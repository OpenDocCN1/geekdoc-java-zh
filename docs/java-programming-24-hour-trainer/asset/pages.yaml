    \        conn.close();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
    \    }\n}\n\n```\n\nThe output of the ShowAnyData program will be the same as\
    \ that of EmployeeList in Listing 22-1. This program can execute any SQL statement\
    \ as long as you are specifying valid database objects. Note that the code in\
    \ ShowAnyData first ensures that you have passed the command-line argument. If\
    \ you run this program from a command line, don't forget to include the SQL statement\
    \ in double quotes. In Eclipse you can specify a command-line argument by selecting\
    \ the Run Configuration panel in the Arguments tab.\n\n# SCROLLABLE RESULT SET\
    \ AND ROWSET\n\nIn all the preceding examples the code traversed the result set\
    \ using the method next(), which moves only the cursor forward. Another option\
    \ is to create a scrollable result set so the cursor can be moved back and forth\
    \ if needed. There is a two-argument version of the method createStatement().\
    \ The first argument specifies the type of scrolling (TYPE_FORWARD_ONLY, TYPE_SCROLL_INSENSITIVE,\
    \ or TYPE_SCROLL_SENSITIVE) and the second makes the result set updateable or\
    \ read-only (CONCUR_READ_ONLY or CONCUR_UPDATABLE). For example,\n\n```\nStatement\
    \ stmt = conn.createStatement(\nResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
    ResultSet rs = stmt.executeQuery(\"SELECT * from Employee\");\n```\n\nThe TYPE_FORWARD_ONLY\
    \ parameter allows only forward movement of the cursor. The difference between\
    \ TYPE_SCROLL_INSENSITIVE and TYPE_SCROLL_SENSITIVE is in whether reflects changes\
    \ that have been made to the result set. The next example sets the cursor at the\
    \ end of the result set and moves the cursor backward:\n\n```\nrs.afterLast();\n\
    while (rs.previous()) {\n    int empno = rs.getInt(\"EMPNO\");\n    String ename\
    \ = rs.getString(\"ENAME\");\n    String job = rs.getString(\"JOB\");\n    System.out.println(\"\
    **\" + empno + \" * \" + ename + \" * \" + job + \"title\");\n}\n```"
