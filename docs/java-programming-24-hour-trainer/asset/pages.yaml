    \    int dependents;\n\n    // Constructor\n    Tax(double gi, String st, int\
    \ depen){\n        grossIncome = gi; // class variable initialization\n      \
    \  state = st;\n        dependents=depen;\n    }\n}\n```\n\nCreating an instance\
    \ of this class can look like this:\n\nTax t = new Tax(65000, \"NJ\",3);\n\nNote\
    \ the difference in the initialization of the class variables: Here you pass the\
