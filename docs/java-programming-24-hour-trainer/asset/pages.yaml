  md: '# 34


    # Working with RESTful

    Web Services


    In the nineties the Web became widely used, and newly created web applications
    were consumed by millions of people around the world. At the same time lots of
    legacy applications were available for use only within corporate walls. They were
    written in a variety of programming languages and deployed on a plethora of types
    of hardware. There was a need to expose corporate data to wider audiences, which
    resulted in the creation of the standard interface for consuming data over the
    Web.


    # THE SOAP WEB SERVICES


    The first standard for publishing and consuming web services was the XML-based
    Simple Object Access Protocol (SOAP). Web clients would form HTTP requests and
    receive responses using the SOAP syntax.


    The difference between traditional JSP/Servlet/JSF web applications and web services
    is that the latter offers just the data and have no interest in what the client''s
    UI will look like. For example, an insurance company could offer information about
    its products, or a mutual fund could expose its data as a web service returning
    XML documents. Clients didn''t need to know that this insurance company was running
    its applications using a server from Sun Microsystems or that the mutual fund
    was running on its mainframe computers from IBM. The clients needed to know the
    directory of services available from this particular organization and the address
    of the endpoint to connect in order to consume this service.


    The directory of services could be published with the XML-based Web Services Description
    Language (WSDL), which is pretty verbose. In the Java world, SOAP messages could
    be processed by JAX-WS without the need for a directory of services.


    Even though SOAP web services are verbose, they are still widely used as a simple
    means of integration with the software produced by third parties. Some SOAP services
    are publicly available. For example, the web page www.webservice.net offers descriptions
    and WSDL locations of such information and services as weather forecasts, US address
    verification, currency converters, and stock quotes. You can integrate these into
    your application, but providing a user interface for them remains your responsibility.'
  merge: -1
  pgno: 422
