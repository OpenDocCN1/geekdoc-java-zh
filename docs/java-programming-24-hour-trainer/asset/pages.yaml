  md: "# LESSON 6 PACKAGES, INTERFACES, AND ENCAPSULATION\n\nSome software developers\
    \ create Java interfaces that contain only final variables storing important application\
    \ constants. Implementing such interfaces will make these constants available\
    \ in the class that implements the interface(s). Not everyone approves such usage\
    \ of interfaces, as it can create a messy situation when using a class that implements\
    \ interfaces with static constants exposes a new set of public APIs (those final\
    \ variables) rather than just using these internally. You can read more about\
    \ this anti-pattern at the following URL: http://java.sun.com/jdk2se/1.5.0/docs/guide/language/static-import.html.\n\
    \n# Marker Interfaces\n\nMarker interfaces are those that have no methods declared.\
    \ One example of such an interface is Serializable, covered in Lesson 17. You\
    \ don't need to write any implementation of interfaces; the Java compiler will\
    \ take care of this for you. A class that implements a marker interface will support\
    \ a certain functionality. For example, if a class implements Serializable, JVM\
    \ will be able to serialize — turn into a string of bytes (the server's JVM) in\
    \ such a way that the string can be sent to another JVM (the client's), which\
    \ will be able to recreate the instance of the object, or de-serialize.\n\nAlso,\
    \ Java has an operator instanceof (see next section) that can check during the\
    \ run if an object is of a certain type. You can use the operator instanceof as\
    \ shown below to check if the object implements a marker interface, or any other\
    \ type of interface for that matter:\n\n```\nif (receivedServerObj instanceof\
    \ Serializable) {\n  // do something\n}\n```\n\n# CASTING\n\nAll Java classes\
    \ form an inheritance tree with the class Object of the hierarchy — all Java classes\
    \ are direct or indirect descendants of Object. When you declare a non-primitive\
    \ variable, you are allowed to use the exact data type of this variable or any\
    \ of its ancestor data types. For example, if the class' extends Tax, each of\
    \ the following lines is:\n\n```\nNJTax myTax1 = new JSONObject();\nTax myTax2\
    \ = new JSONObject(); // upcasting\nObject myTax3 = new JSONObject(); // upcasting\n\
    ```\n\nJava is smart enough to automatically cast an instance of the class to\
    \ its ancestor. When the variable is more generic than it has 10 methods and class\
    \ variables defined, the class Tax (an implicit subclass of Object) adds five\
    \ more methods and variables (making 15), and NJTax adds another two (total 17).\
    \ The variable myTax1 will have access to all 17 methods and variables, myTax2\
    \ will only see 15, and myTax3 just 7. Why not always use exact types in variable\
    \ declarations?\n\nLet's say you need to write a program that will process data\
    \ about workers of a certain company. Some of them are full-time employees and\
    \ some contractors, but you'd like to read their data from some data source and\
    \ into the same array. Arrays can store only objects of the same type, remember?"
