  md: '# The Big Picture


    If you decide to get familiar with any specific JSR, visit the website http://jcp.org.
    Currently Java EE includes 45 JSRs, Java SE has 44, and Java ME (Micro Edition
    covers small devices) has 85. In other words, Java EE is based on standards. If
    you''d like to get hold of the 33 specifications that were included in Java EE
    6, they are described in JSR 316 and are available at http://jcp.org/aboutJava/communityprocess/final/jsr316/index.html.


    # Tiers of Java EE Applications


    A typical distributed Java application can be divided into three or four logical
    tiers. (If the application is getting data directly from a DBMS, as described
    in Lesson 22, it has a two-tier client-server architecture, and Java EE components
    are not needed.) Figure 26-1 shows selected technologies and possible ways of
    building a distributed application that includes Java EE tiers or layers.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_320_0.png)


    FIGURE 26-1


    The client tier can be implemented on a user''s desktop, notebook, or mobile phone,
    or any other device that has JRE or can connect with Java on the web server. You
    can create a client as an independent Java application, an applet, or a thin client
    (as HTML/JavaScript file running in a web browser). The word tier refers to the
    fact that no business processing is being done on the client side, so the server
    has to work hard processing all application logic for all clients.


    If you''re building a web application, the web tier (the presentation tier) comes
    into the picture. You have your choice of JSP, JavaServer Faces (JSF), Servlets,
    or web services. These components are responsible for the look of your client
    tier. Java Swing and javafx are typically (but not necessarily) used as fat clients
    of web applications. The word fat refers to the fact that the client can contain
    some business logic, which minimizes the load on the server.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# LESSON 26 JAVA EE 6 OVERVIEW


    The business logic of your application is placed in the business tier, which is
    represented by EJBs. In the past EJBs were heavy components and third-party frameworks
    such as Spring (see Lesson 35) became a popular choice for implementing the business
    tier. Java EE 6 will regain its market share in this department because it''s
    a light POJO- and annotation-based technology that incorporates the best features
    of the third-party framework. POJO stands for plain old Java object — a class
    that can be written any way you want and don''t have to extend any framework class
    or implement interfaces. This term is easily understood by people who witnessed
    the evolution of EJBs, which were Classes that had to be written and deployed
    in a convoluted way accompanied by heavy XML configurations. Things changed drastically,
    and now EJBs have turned into POJOs with annotations. If some reason you skipped
    Lesson 24 on annotations, you should go back and study it; otherwise you won''t
    understand most of the remaining material in this book.


    While drawing the diagram for 26-1, I noticed the Web Services a couple of times
    between the presentation and business tiers. On one hand, Web Services (see Lesson
    34) are based on web communication protocols; on the other hand they serve as
    a facade hiding anything, including an legacy application written in COBOL on
    mainframes. In the final version of my diagram, Web Services spans both tiers
    and exist as a separate box in the data tier.


    Using DBMs remains the most popular but not the only way to store data in enterprise
    Java EE applications. The data can be served by an external web service or arrive
    as a real-time feed from some messaging infrastructure. MOM stands for message-oriented
    middleware, and you''ll learn what it is in Lesson 30.


    Without some practical example, all these new buzzwords might not make much sense
    to you. You will see examples in the upcoming lessons, but let''s briefly discuss
    how you can rebuild the Stock Market that you already started developed using
    sockets and RMI.


    +   - Have an app to connect to StockQuotesservlet, which creates what is known
    as a session EJB called StockMarketQuote, which connects to external stock exchange
    software and requests a price quote on the specified symbol(s). This session bean
    has a timer that updates the quotes every second.

    - Do as described in the previous bullet, but replace the applet with an HTML
    client.

    - The same as before, replace the Servlet with a JSP.

    - The same as before, but replace the JSP with a JSF.

    - The same as before, replace the session bean with a timer with a message-driven
    bean (MDB) that subscribes to the external stock exchange application that sends
    back new prices only when they change.

    - The same as before, but add a session bean with business that will process every
    price quote received by MDB and apply a secret modeling algorithm, and on certain
    conditions send a message to buy or sell a specific number of shares of the suggested
    stock to a third-party system via a call to a web service.


    Is this enough? I can keep going. As you can see, there are many ways to design
    a distributed Java EE application. This is what Java architects do for a living.'
  merge: -1
