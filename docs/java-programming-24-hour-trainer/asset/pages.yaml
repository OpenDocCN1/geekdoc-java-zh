  md: "```\n<input type=Submit value=\"Search\">\n</form>\n<body>\n</html>\n```\n\n\
    Create a file called BookSearch.html containing the code from Listing 27-1. Open\
    \ this file in a web browser (File -> Open), enter any text in the input field,\
    \ and press Search. You'll get an error message because there is neither a servlet\
    \ nor a servlet called FindBooks at this address. But now you will see what the\
    \ thinnest client can look like.\n\nClients communicate with servlets using HTTP\
    \ protocol, and when no requested resource is found, the HTTPResponse object comes\
    \ with an error. If the server responds, but the requested resource (the HttpServlet\
    \ servlet) is not there, the error code 404 is returned. If the server doesn't\
    \ respond, the web client will show an appropriate error code. If the client's\
    \ request successfully received the needed resource from the server, the HTTPResponse\
    \ contains the status code 200. The list of all HTTP status codes is available\
    \ at www.w3.org/Protocols/rfc2616/rfc2616-sec10.html.\n\n# HOW TO WRITE A SERVLET\n\
    \nTo create a servlet, a class that extends HttpServlet and annotate it with the\
    \ @WebServlet annotation. The method service receives the client's response and\
    \ directs it to one of the methods of your class that's a descendant of HttpServlet.\
    \ You have to override either of the methods doGet() or doPost(). Which one to\
    \ override? This depends on the client's request method. If the client uses the\
    \ method Get (see Listing 27-1), override the callback doGet(i), as in Listing\
    \ 27-2.\n\nLISTING 27-1: Your first servlet\n\n```\nimport javax.servlet.ServletException;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    import java.io.PrintWriter;\n\n@WebServlet(urlPatterns=\"*/books/*\", name=\"\
    FindBooks\")\npublic class FindBooks extends HttpServlet {\n\n@Override\npublic\
    \ void doGet(HttpServletRequest request,\n    HttpServletResponse response) throws\
    \ ServletException {\n    // The code processing request goes here\n    // The\
    \ resulting Web page will be sent back via the\n    // I/O stream that response\
    \ variable contains\n    PrintWriter out = response.getWriter();\n    out.println(\"\
    Hello from FindBooks\");\n}\n```"
