  md: "# TRY/CATCH BLOCKS\n\nThere are five Java keywords that can be used for exception\
    \ handling: try, catch, finally, throw, and throws. One try block can have multiple\
    \ catch blocks, to provide handling for more than one type of error. For example,\
    \ when a program to read a file, the file may not be there — you must catch the\
    \ FileNotFoundException. If the file is there, but the code to read the end of\
    \ the file, the catch clause for EOFException is necessary. Listing 13-4 illustrates\
    \ a multi-catch block.\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_171_0.png)\n\
    \nLISTING 13-4: One with multiple catch statements\n\n```\npublic void getCustomers()\
    \ {\n  try{\n    fileCustomers.read();\n  } catch(FileNotFoundException e) {\n\
    \    System.out.println(\"Can not find Customers*\");\n  } catch(EOFException\
    \ e1) {\n    System.out.println(\"Done with file read\");\n  } catch(IOException\
    \ e2) {\n    System.out.println(\"Problem reading file * + e2.getMessage()\\n\
    \  }\n}\n```\n\nThe order of the catch statements may be important if the exceptions\
    \ are being caught along the same inheritance branch. For example, the EOFException\
    \ is a subclass of the more generic IOException, and you have to put the catch\
    \ block for the subclass first. If you place the catch block for IOException before\
    \ the one for EOFException, the latter block will never be reached — the end-of-file\
    \ errors will be intercepted by the IOException catch block. A lazy programmer\
    \ would cut corners and handle the exceptions that may have happened during the\
    \ reading of the file in a coarse-grained way (the compiler won't complain!)\n\
    \n```\npublic void getCustomers() {\n  try{\n    fileCustomers.read();\n  } catch(Exception\
    \ e) {\n    System.out.println(\"Problem reading file * + e.getMessage()\\\n \
    \ }\n}\n```\n\nA catch block receives an instance of the Exception that contains\
    \ a short explanation of a problem, and the method getMessage() of the Exception\
    \ object will return this info. If the description of an error returned by getMessage()\
    \ is not clear enough, try the method toString() instead.\n\nIf you need more\
    \ detailed information about the exception, use the method printStackTrace() on\
    \ the received Exception object (see Listing 13-6). It will print all internal\
    \ method calls that led to this exception, as described in the section \"Stack\
    \ Trace\" earlier in this lesson."
