    # LISTING 7-2: Class Employee\n\n```\npackage com.practicaljava.lesson;\n\npublic\
    \ class Employee extends Person{\n\n    public Employee(String name) {\n     \
    \   super(name);\n    }\n    public boolean increasePay(int percent) {\n     \
