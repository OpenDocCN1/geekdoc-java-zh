    # Closures


    I''ve included the section on inner classes in the lesson about handling UI events
    just because it was easy to explain their practical use here, but inner classes
    were not created just for the handling of UIs. In some programming languages (such
    as JavaScript and ActionScript) there''s a called closure — you can instantiate
    a method from a class, and the instantiation is done in such a way that the method
    can “remember” the data values from the class variables at the moment of instantiation.


    At the time of this writing Java 7 has not been released yet, but there''s a pretty
    good chance that closure will be one of the new features. Closures have simpler
    syntax than inner classes, and they''re a long-anticipated addition to the language.


