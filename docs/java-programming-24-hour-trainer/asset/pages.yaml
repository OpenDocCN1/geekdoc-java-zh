    The code in Listing 33-1 illustrates the mapping of one-to-many relations between
    the entities Employee and Address (not shown). One employee can have multiple
    addresses, so Employee references a collection of the Address entities.


    # JPQL


    JPQL is a SQL-like query language. The main difference is that SQL operates with
    the DBMS schemas, tables, and stored procedures, but JPQL manipulates with Java
    objects and their attributes from the domain model. You don''t need to know details
    of the underlying data storage objects to perform JPQL queries.


    If you know the queries in advance they can be precompiled; otherwise you can
    build them during the time. Similarly, in JDBC you can use either PreparedStatement
    or Statement.


    JPQL includes pretty easy-to-remember (case-insensitive) keywords: SELECT, WHERE,
    FROM, ORDER BY, GROUP BY, and so on. Here''s how you would write a JPQL query
    to find all managers who have subordinates under the last name Smith:


    ```

    SELECT e.managerName,

    FROM Employee AS e

    WHERE e.lastName=''Smith''

    ```


    The next query finds all employees who were given iPhones by the firm. Note the
    dot notation to find the phone model from the embedded class.


    ```

    SELECT e.firstName, e.lastName

    FROM Employee AS e

    WHERE e.companyPhone.model=''iPhone''

    ```


    To select all entities of certain type (the equivalent of Select * in SQL) just
    specify the alias of the entity right after the SELECT clause:


    ```

    SELECT DISTINCT e

    FROM Employee AS e

    ```


    The Employee and Address entities have a one-to-many relationship. If you''d like
    to find all employees who live in New York, this is the join written in JPQL:


    ```

    SELECT DISTINCT e

    FROM Employee AS e JOIN e.addresses as a

    WHERE a.city=''New York''

    ```'
