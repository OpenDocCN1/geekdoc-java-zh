    BestEmployee.ser\");\n            oOut = new ObjectOutputStream(fOut);\n\n   \
    \         oOut.writeObject(emp); //serializing employee\n\n        } catch (IOException\
    \ e) {\n            // close the streams\n            try{\n                oOut.flush();\n\
