  md: "Employee from Listing 17-1 contains only serializable data types. But if a\
    \ class has properties of custom data types, each of them has to be serializable.\
    \ The Employee class from Listing 17-3 can be serialized only if the class PromotionHistory\
    \ (and all data types it uses) was declared with Serializable.\n\n# LISTING 17-3:\
    \ Class Employee with custom data types\n\n```\nclass Employee implements java.io.Serializable{\n\
    \    String lName;\n    String fName;\n    double salary;\n\n    PromotionHistory\
    \ promos; // A custom data type\n\n}\n```\n\nIf you do not want to serialize some\
    \ sensitive information, such as salary, declare this variable using the keyword\
    \ transient. If you declare the property salary of the class Employee with the\
    \ transient qualifier, its value won't be serialized.\n\ntransient double salary;\n\
    Typically, you declare a variable as transient if it contains some sensitive information\
    \ or if its value is useless in the destination stream. Suppose a Java class that\
    \ runs on the server has database connectivity variables. If such a class gets\
    \ serialized to the client's machine, sending database credentials may be not\
    \ only useless, but unsafe. So such variables have to be declared as transient-types.\n\
    \n# THE CLASS OBJECTINPUTSTREAM\n\n+   1. Open an input stream.\n2. Chain it with\
    \ the ObjectInputStream.\n3. Call the method readObject() and cast the returned\
    \ object to the class that is being deserialized.\n4. Close the stream.\n\nListing\
    \ 17-4 shows a code sample that reads the previously serialized file BestEmployee.ser.\
    \ This code opens a FileInputStream that points at BestEmployee.ser and then chains\
    \ the FileInputStream with ObjectInputStream. The method readObject() resurrects\
    \ the instance of the Employee object in memory."
