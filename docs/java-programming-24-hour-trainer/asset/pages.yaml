  md: '# ABOUT THE AUTHOR


    ![](img/c76c0001feef31da8d0f359dd6abacc0_10_0.png)


    YAKOV FAIN works as a software architect for Farata Systems, a company that provides
    consulting services in the field of development of enterprise applications. He
    has authored several technical books and lots of articles on software development.
    Sun Microsystems has awarded Mr. Fair with the title of Java Champion, which has
    been given to only 150 people in the world. He leads the Princeton Java Users
    Group. Yakov''s Twitter ID is @yfain.


    # ABOUT THE TECHNICAL EDITOR


    ELLIOTTE RUSTY HAROLD is originally from New Orleans, to which he returns periodically
    in search of a decent bowl of gumbo. However, he currently resides in the Prospect
    Heights neighborhood of Brooklyn with his wife Beth, dog Thor, and cat Marjorie.
    He is the author of numerous books including Refactoring HTML, Java Network Programming,
    Java I/O, and Processing XML with Java. His open source projects include the XOM
    Library for processing XML with Java and the Amateur media player.'
