    \ id=\"content\">\n    <ui:insert name=\"content\">\n      The content of my student\
    \ portal goes here\n    </ui:insert>\n  </div>\n  <div id=\"footer\">\n    <ui:insert\
    \ name=\"footer\">\n<h1>The footer of my portal is here</h1>\n    </ui:insert>\n\
    \  </div>\n</body>\n</html>\n```\n\nYou can run and test this template in Eclipse:\
    \ Right-click StudentTemplate.xhtml and select Run on Server. If the GlassFish\
