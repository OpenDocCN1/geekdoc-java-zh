  md: "# LISTING 32-4 (continued)\n\n```\npublic class HelloWorldBean implements Greeting\
    \ {\n    public String sayHello() {\n        return \"Hello World!\";\n    }\n\
    }\n```\n\n# Remote Beans\n\nFor clients that may access the bean remotely, declare\
    \ an interface marked with @Remote and have your bean class implement it. An EJB\
    \ can both implement remote and local interfaces, and you can expose different\
    \ methods for remote and local clients too.\n\n# LISTING 32-5: The Greeting interface\n\
    \n```\n@Remote\npublic interface Greeting { public String sayHello(); }\n\n@Stateless\n\
    public class HelloWorldBean implements Greeting {\n    public String sayHello()\
    \ {\n        return \"Hello World!\";\n    }\n}\n```\n\nThe clients find remote\
    \ beans by performing JNDI lookups. Because the client and the server may be running\
    \ in different JVMs, all arguments of the remote methods must be serializable.\n\
    \n# The Server\n\nRight-click the GlassFish server in the Servers view and add\
    \ the project Lesson32 to deploy this Web application. You may also want to turn\
    \ on automatic redeployments in GlassFish. To do this, double-click the GlassFish\
    \ server in the Servers view and change the Publishing preferences to Automatically\
    \ publish when resources change, as in Figure 32-1. This will eliminate the need\
    \ for manual redeployment of the application every time the code changes.\n\n\
    Start GlassFish if it's not running and run HelloWorldServlet. You'll see the\
    \ output produced by the EJB, as in Figure 32-2; you can get the output by entering\
    \ http://localhost:8080/Lesson32/HelloWorld in your web browser. Even though this\
    \ is a tiny application, nevertheless it demonstrates communication between objects\
    \ from the presentation and business tiers. Real-world applications have more\
    \ business logic, but from an architectural perspective they are the same."
