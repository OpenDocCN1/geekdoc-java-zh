  md: "# JAVA ENUMERATIONS\n\nThe enum construct is not related to the thread concept\
    \ and can be used for a variety of reasons, but because this lesson refers to\
    \ enumerations for the first time in this book, a little sidebar explanation seems\
    \ appropriate.\n\nIf you need to define a group of predefined constants, you can\
    \ use the final key-word. For example, to define various categories of products\
    \ in a store you can declare the following constants:\n\n```\npublic static final\
    \ int CATEGORY_BOOKS = 1;\npublic static final int CATEGORY_VIDEOS = 2;\npublic\
    \ static final int CATEGORY_ELECTRONICS = 3;\npublic static final int CATEGORY_TOYS\
    \ = 4;\n```\n\nBut Java offers a special keyword, enum, that enables you to define\
    \ such constants in a more elegant way:\n\n```\nenum Category (BOOKS, VIDEOS,\
    \ ELECTRONICS, TOYS)\n```\n\nNot only is this notation more compact, but it also\
    \ prevents the programmers from having to prefix each constant with CATEGORY_\
    \ to stress that these values represent a group, but you can define variables\
    \ to represent the entire group, pass enum as an argument to a method, and return\
    \ enum from a method. For example, if you need to write a program that will redirect\
    \ the store customer to the proper representation, you can write something similar\
    \ to what's shown in Listing 20-13.\n\n# LISTING 20-13: enum example\n\n```\n\
    enum Category (BOOKS, VIDEOS, ELECTRONICS, TOYS)\n\npublic class EnumExample {\n\
    \n    public static void redirectToRepresentative(Category cat) {\n\n        switch\
