  md: 'I can suggest to you a simple technique: Write comments first and only then
    the code. By the time your program is written it''s already commented. You can
    write comments pretty much every— before or inside the class, or inside the methods.


    In Java you can use three types of comments:


    +   Block comments that contain more than one line of text located between the
    symbols /* and */. For example:


    ```

    /* This method will calculate the cost of shipping, handling, and all applicable
    taxes

    */


    The compiler ignores the text in comments and you can write whatever you want.

    If you want to write a short comment on a single line, just start this line with
    two forward slashes (//). For example:


    // This method will calculate the cost of shipping

    ```


    +   Some comments with /** and end with */. These are used by a special utility,
    javadoc, which can automatically extract the text from these comments and create
    program documentation. To get a feeling for what javadoc can generate, look at
    the documented API for Java itself http://java.sun.com/javase/6/docs/api/overview-summary.html.


    If you''d like to learn how to use the javadoc utility, refer to its program documentation
    at http://java.sun.com/javase/6/docs/technotes/guides/javadoc/index.html.


    # First Useful Program


    It''s time to write a program that does something more useful than print "Hello
    World." This program will emulate the calculation of state tax. The goal is to
    show how Java classes communicate, how methods are called, and how variables can
    be changed.


    First you need to decide what class(es) you need to write for the task at hand.
    Then think about the properties (class variables) and methods (functions) these
    classes should have.


