    \n# A Brief Introduction to Concurrent Collections\n\nThe package java.util.concurrent\
    \ offers a number of data structures that simplify programming with threads. I'll\
    \ just briefly name some of them in this section.\n\n# Queues\n\nThe concept of\
    \ a queue (First In First Out or FIFO) fits well in any process that involves\
    \ asynchronous intra-object communications. Instead of A trying to place a direct\
    \ lock on object B, the former (aka the producer) can place data objects in a\
    \ queue, and the latter (aka the consumer) will retrieve deque from the queue\
    \ asynchronously. Most importantly, the queues from the java.util.concurrent package\
    \ are thread-safe, which means you can add an object to a queue without worrying\
    \ about race conditions.\n\nIf the queue is blocking, the thread will also block\
    \ while trying to add an object to a full queue or remove an object from an empty\
    \ one. The following classes implement the BlockingQueue interface: LinkedBlockingQueue,\
    \ ArrayBlockingQueue, SynchronousQueue, PriorityBlockingQueue, and DelayQueue.\
    \ To add an object to a queue you can use methods as add(), put(), and offer().\
    \ To retrieve an object from a queue use poll(), remove(), take(), or peek().\n\
    \nUnbounded queues don't place limitations on the number of elements. ConcurrentLinkedQueue\
    \ is an example of such a queue."
