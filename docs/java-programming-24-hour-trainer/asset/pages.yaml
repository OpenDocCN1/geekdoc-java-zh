  md: "# final Methods\n\nIf you declare a class method with a final keyword, this\
    \ method can't be overridden if someone decides to extend the class. Today it\
    \ may seem obvious to you that a particular method will never need to be overridden.\
    \ What are the changes that the formula to convert Fahrenheit to Celsius will\
    \ be changed any time soon?\n\n```\nstatic final double convertToCelsius(double\
    \ far) {\n    return ((far - 32) * 5 / 9);\n}\n```\n\nIn many cases developers\
    \ create reusable libraries of Java classes, finalizing functionality that's not\
    \ written in. While it may seem to you that a particular method will never need\
    \ to be overridden, you might have predicted all use patterns of this class. If\
    \ this happens, some other developer will have to jump through hoops to create\
    \ another version of your method in a subclass.\n\nMany years ago the compiler\
    \ optimized final methods. It doesn't do anymore — all methods are optimized by\
    \ the Hot JVM. Just think twice before making a method final.\n\n# final Classes\n\
    \nIf you declare a class as final, no one will be able to subclass it. For example,\
    \ Java's class String has been created as immutable and declared as final (see\
    \ http://java.sun.com/java/6/docs/api/java/Lang/String.html). If a class is declared\
    \ as final, all its methods become implicitly final.\n\n# INTERFACES\n\nIn general,\
    \ you should have a reason for declaring the methods separately from the class\
    \ that will implement it, and you'll see these reasons in the next lesson when\
    \ you learn about polymorphism, For now, let's just get familiar with the syntax\
    \ of defining and using interfaces. The interface will not have any implementations\
    \ — just declarations. (There is an exception: Marker interfaces don't have even\
    \ declarations. The next section is devoted to this type of interface.)\n\nWhen\
    \ a class declares that it implements a certain interface, it guarantees that\
    \ it contains implementation for all methods from this interface. And a class\
    \ can implement more than one interface: separate their names with commas.\n\n\
    Let's say you have two types of workers in your organization, employees and contractors,\
    \ and that you create the classes Employee and Contractor is entitled to implement\
    \ functionalities that reflect specifics of these different groups. Each person\
    \ is entitled to a pay raise, though for employees this means a salary increase\
    \ and for contractors it means an increase of an hourly or daily rate."
