  md: '# Containers versus Application Servers


    Java EE tiers are implemented in containers. It''s easy to guess that containers
    were created to create something. In the Java EE world containers not only contain,
    but also control the birth, life, and death of Java components. For example, you
    don''t need to write the new statement to create a new instance of an EJB; the
    container will create a pool of them based on configuration parameters. Even on
    the client side, while reading about applets you might have noticed that applets
    life cycles are controlled by the JRE, which can be called an applet container.
    Basically, a container is an area inside JVM that manages a lifecycle of certain
    types of Java objects, such as applets, servlet, EJB, etc.


    Containers can take care of various functions, and one of them is thread safety.
    Its great that multiple clients can connect and make requests to the server, but
    you can ensure that a thread initiated by Mary wont interfere with John''s thread?
    An EJB container implements a single-threaded ensuring that each client''s request
    operates in a dedicated thread. Containers may offer transactional support with
    Java Transaction API (JTA) and persist data for you with Java Persistence API
    (JPA).


    In the first few lessons I used a blueprint analogy to explain the relationship
    between Java classes and objects. I used this analogy again, but this time to
    explain the relationship between the Java EE specification and application servers.
    The Java EE is a specification, and when a release is published, vendors who want
    to implement it in their software products create application servers that support
    this specification.


    Multiple vendors offer their versions of a Java EE application server. The question
    is what version of the Java EE specification they support. Currently the application
    servers GlassFish (Oracle) and JBoss (Hot Har) support Java EE 6. At the time
    of this writing WebLogic (Oracle) and WebSphere (IBM) are still on Java EE 5,
    but should offer support of the latest specification soon.


    Java EE application servers have to support multiple containers, for example a
    Servlet container and an EJB container. Some vendors prefer to create products
    supporting only technologies defined in the Java EE specification. For example,
    Tomcat (Apache), Jetty (Eclipse Foundation), and Resin (Caucho) offer support
    for selected technologies (such as Servlets and JSP), which make them suitable
    for implementing web applications, but if you are planning to create web applications
    based on one of these products, you''ll need to figure out what other tools or
    frameworks will be needed to support transactions, the business tier, data persistence,
    and more.


    In this book I will be using GlassFish 3 from Oracle, which is fully compliant
    with Java EE 6. I have selected the most widely used technologies in Java EE development
    today. In particular you''ll be learning about the following:


    +   - Java Servlets 3.0

    - JSP 2.2

    - EJB 3.1

    - JPA 2.0

    - JTA 1.1

    - CDI 1.0

    - JMS 1.1

    - JAX-RS 1.1'
