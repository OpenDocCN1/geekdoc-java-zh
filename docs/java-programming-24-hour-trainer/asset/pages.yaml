  md: "# LESSON 32 INTRODUCTION TO ENTERPRISE JAVEBEANS\n\nIf you'd like to expose\
    \ certain business methods to local clients, you can create an interface and mark\
    \ it with a @Local annotation. Your bean class has to implement this interface.\
    \ If you'd like to expose your bean to remote clients, create an interface in\
    \ the same package and mark it as @Remote. The bean has to implement this interface.\n\
    \n# Local No-Interface Beans\n\nI am planning to use HelloWorldBean from the servlet\
    \ running in the same JVM, the final version of the code will look like Listing\
    \ 32-2. Any EJB can use regular Java classes to implement business logic: For\
    \ example, the sayHello() method can create instances of other Java classes with\
    \ the new operator and invoke their bean methods if it needs to.\n\n# LISTING\
    \ 32-2: HelloWorld session bean, take 2\n\n```\nimport javax.ejb.LocalBean;\n\
    import javax.ejb.Stateless;\n\n@LocalBean\n@Stateless\npublic class HelloWorldBean\
    \ {\n\n    public String sayHello() {\n        return \"Hello World!\";\n    }\n\
    }\n```\n\nNow let's do hands-on. Create a new Dynamic Web Project in Eclipse as\
    \ you did in previous sessions. Name it Lesson32. Then create a new servlet class,\
    \ HelloWorldServlet, in the package .practical.java.lesson32.client (selecting\
    \ the menu File -> New -> Servlet). This servlet will become our client, communicating\
    \ with the EJB.\n\nNext create a Java class HelloWorldBean in the package com.practical.lesson32.ejb\
    \ by selecting File -> New -> Session Bean (EJB 3.x). Do not select any local\
    \ or remote business interfaces, and uncheck (when possible) the objects related\
    \ to EJB 2.x. Eclipse will create a class with a default constructor. Add to this\
    \ class method sayHello() shown in Listing 32-2, and the EJB is finished.\n\n\
    The next step is to inject the HelloWorldBean into the servlet code with the @EJB\
    \ annotation:\n@EJB HelloWorldBean myBean;\n\nEclipse will mark this line with\
    \ a red error bullet. Right-click and select Quick Fix to automatically insert\
    \ two import statements—one for the @EJB annotation and for HelloWorldBean.\n\n\
    Using JNDI as an alternative to injecting the bean into the client. Java EE supports\
    \ portable JNDI names that don't depend on the application server's implementation.\
    \ Instead of the @EJB annotation you could use the following code:\n\n```\nContext\
    \ ctx = new InitialContext();\nHelloWorldBean myBean = (HelloWorldBean) ctx.lookup(\"\
    java:global/Lesson32/HelloWorldBean\");\n```"
