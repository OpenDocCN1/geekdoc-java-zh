  md: "object or should always request a fresh copy. In general, if you are planning\
    \ to write Java programs that will work using HTTP protocol, use the class HttpURLConnection,\
    \ which supports HTTP-specific features, such as processing header fields, getting\
    \ HTTP response codes, setting request properties, and so on.\n\n# CONNECTING\
    \ THROUGH HTTP PROXY SERVERS\n\nFor security reasons, most enterprises use firewalls\
    \ (see http://en.wikipedia.org/wiki/Firewall_\\%28computing%29) to block unauthorized\
    \ access to their internal networks. As a result their employees can't directly\
    \ reach the Outside World (or even some internal servers), but through HTTP proxy\
    \ servers. Check the settings of your Internet browser to see if you are also\
    \ sitting behind a firewall, and find the hostname and port number of the proxy\
    \ server if you are. Usually, web browsers store proxy parameters under the Advanced\
    \ tabs of their Settings or Preferences menu.\n\nIf your browser has downloaded\
    \ a page containing a Java applet, the latter knows the parameters of the proxy\
    \ servers and can make requests to the remote servers through the firewall. A\
    \ regular Java application should specify the proxyHost and proxyPort parameters\
    \ to \"drill a hole\" in the firewall. For example, if the name of your proxy\
    \ server is proxy.mycompany.com and it runs on port 8080, the following two lines\
    \ should be added to your Java application that needs to connect to the Internet:\n\
    \n```\nSystem.setProperty(\"proxyHost\", \"http://proxy.mycompany.com\")\nSystem.setProperty(\"\
    proxyPort\", \"8080\");\n```\n\nIf you do not want to hardcode these values, pass\
    \ them to your program from the command line: java -Dhttp.proxyHost=http://proxy.mycompany.com\n\
    -Dhttp.proxyPort=8080 WebSiteReader\n\n```\nProxy myProxy = new Proxy(Proxy.Type.HTTP,\n\
    \  new InetSocketAddress(InetAddress.getByName(\"proxy.mycompany.com\"), 8080);\n\
    URL url = new URL(\"http://www.google.com/index.html\");\nURLConnection urlConn\
    \ = url.openConnection(myProxy);\n```\n\nThe other option for programmatically\
    \ specifying proxy parameters is to do it via the class java.net.Proxy. The code\
    \ for the same proxy server parameter would look like this (you can replace the\
    \ name with an IP address):\n\n# HOW TO DOWNLOAD FILES FROM THE INTERNET\n\nCombine\
    \ the class URL with the reading files techniques and you should be able to download\
    \ unprotected file (such as images, music, and binary files) from the Internet.\
    \ The trick is in opening the file stream properly. Listing 18-3 shows the code\
    \ of a Java class, FileDownload, which takes the URL and the destination (local)\
    \ file name as command-line arguments, connects to this resource, and downloads\
    \ it into a local file."
