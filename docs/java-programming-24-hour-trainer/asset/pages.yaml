    \ the download was complete. On a multiprocessor computer, parallel threads can\
    \ run on different CPUs. On a single-processor computer, threads will take turns\
    \ getting \"slices\" of the processor's time. Because switching CPU cycles between\
    \ threads happens fast, a user won't notice the tiny delays in each thread's execution,\
    \ and browsing will feel smooth.\n\nIn many cases, especially on single CPU computers,\
    \ the benefit of many threads comes about because there's a lot of idle time in\
    \ most operations. In particular, if an operation is I/O bound instead of CPU\
