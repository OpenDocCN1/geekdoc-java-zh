  md: '# 31


    # Introducing JNDI


    Instead of having distributed Java programs instantiate lots of reusable objects
    over and again, it''s better if these objects are pre-created and published at
    a known server, where they can be easily and quickly found. The role of the Java
    Naming and Directory Interface (JNDI) is to make it easier to find objects in
    distributed applications. It plays a role similar to that of a company telephone
    directory assistance service. Various software vendors offer specialized directory
    assistance software, and JNDI provides a standard API to read from and write to
    such directories.


    In this lesson you''ll be introduced to the JNDI concepts and will see how to
    use JNDI for publishing (and looking up) administered JMS objects.


    # JAVA NAMING AND DIRECTORY INTERFACE


    A naming service enables you to add, change, or delete names of objects that exist
    in some naming hierarchy so other Java classes can look them up to find their
    location. One more analogy: In a library, you find the name of the physical location
    of a book in a directory, and then go to the shelf to pick up the book. A naming
    service provides a unique name for every entry that is registered (bound) with
    the service. Every naming service will have one or more contexts— think of directories
    and subdirectories in a file system, where any directory there is a child. The
    naming tree originates from a root node, which is also known as an initial context
    (like a root context on the disk).


    A directory service enables you to search the naming tree by object attributes
    rather than object names. One example is that of the domain name system, which
    is a distributed naming system that takes the domain name of a networked computer
    or service and returns the IP address and port number of the resource.


    To allow clients to do lookups, there has to be a process that initially binds
    the objects to a naming tree. This can be handled by an independent program that
    (for example) binds employee names to a directory server of some organization.
    Java EE servers do a similar job (during start-up) by binding such objects as
    EJB, Servlets, JMS, and database connection pools to either their internal or
    external naming servers.'
