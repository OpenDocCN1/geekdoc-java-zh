  md: '# 35


    # Introduction to Spring MVC Framework


    At the beginning of the century Java EE was called J2EE, and it was a heavy and
    over-engineered standard. Programming EJBs was difficult and required writing
    a lot of boilerplate-plate code. Java annotations had not been invented yet. Having
    a Java container that would take care of-multi-threading, transactions, persistence,
    and security was nice, but developers needed a lighter container and a simpler
    programming model.


    Rod Johnson, a talented software engineer, wrote a book titled Expert One-on-One
    J2EE Design and Development, which was published by Wrox at the end of 2002. A
    year later the book''s code samples and development recommendations were released
    as the Spring Framework.


    The Spring Framework is a Java container that provides a living space for an application''s
    objects, which wired to each other in a loosely coupled way in XML configuration.
    This loose comes at a price, — configuration files are quite large in size.


    Spring Framework was built based on the inversion of control (IoC) principle:
    The container is responsible for the instantiation and control of the objects.
    IoC is also known as the Hollywood principle: "Do not call us, we will call you."


    Instead of having a class Customer reach out to some container''s registry trying
    to find an Order, under the Spring Framework would use a system of callbacks to
    instantiate the Order and inject it into the instance of the Customer object.
    This is an example of the dependency injection pattern — the Customer gets an
    injection of required resources. You saw resource injection in action in the Java
    EE lessons.


    Don''t forget that five years ago the injection of resources was not implemented
    in Java EE application servers. Today not only is resource injection implemented,
    but Java EE 6 has yet another injection mechanism known as contexts and dependency
    injection (not covered in this book), which will make future Java EE applications
    even lighter. Don''t forget that some ideas implemented in the current Java EE
    specification were originally introduced by the Spring Framework.'
  merge: -1
  pgno: 434
- img_proc: true
  md: "The last several years the Spring Framework has served as an alternative solution\
    \ for developing enterprise Java applications. It has provided an infrastructure\
    \ that allows you to easily plug in third-party frameworks and components. For\
    \ example, the combination of Spring and the persistence framework Hibernate (see\
    \ Lesson 36) is a popular architecture for lots of production-grade applications.\n\
    \nSerious improvements in the Java EE 6 specification may reduce the number of\
    \ applications developed with Spring/Hibernate, but as of today this duo remains\
    \ a niée infrastructure for developing enterprise Java applications.\n\n# BEAN\
    \ WRIRING\n\nIn the Spring Framework, beans are configured in XML files, and if\
    \ a class called Customer needs an bean you can either look for this bean using\
    \ getBean(\"Order\") on an instance of the main Spring factory, ApplicationContext,\
    \ or better, configure the Order into Customer, in the following code:\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nsi:schemaLocation=\"\
    http://www.springframework.org/schema/beans\nhttp://www.springframework.org/schema/beans/spring-beans-3.0.xsd\"\
    >\n\n  <bean id=\"customerBean\" class=\"com.practicaljava.lesson35.Customer\"\
    >\n    <property name=\"order\" ref=\"ord\" />\n  </bean>\n\n  <bean id=\"ord\"\
    \ class=\"com.practicaljava.lesson35.Order\"/>\n</beans>\n```\n\nThis is an example\
    \ of configuring one object into the fail of another in a loosely coupled way.\
    \ The class Customer knows that someone will provide an Order when the time is\
    \ right. It makes it easy to test the Customer's functionality by wiring orders\
    \ with hard-coded values—just change the value in the preceding XML from com.practicaljava.lesson35.FakeOrder.\
    \ In simple cases you can inject simpler values into Spring bean via setters or\
    \ constructors. You can provide the name of the file with configured beans to\
    \ the constructor of ApplicationContext during instantiation.\n\n# OVERVIEW OF\
    \ SPRING MVC\n\nThe Spring Framework consists of a number of modules that can\
    \ be categorized as web, core, and data access. The good part is that they can\
    \ be used à la carte as you need. The web module simplifies development of web\
    \ applications. The core module provides the infrastructure and wiring for Java\
    \ components living in the Spring container. Data access enables you to create"
  merge: -1
  pgno: 435
- img_proc: true
  md: 'an abstraction layer for data access so that no Java code needs to be changed
    if you decide to use a different JDBC driver or DBMS.


    In this lesson you''ll get familiar with the Spring MVC module that was created
    for the development of web applications. Like Java application servers, Spring
    manages your Java classes, I''ll be using the term Spring container. The classes
    that are going to be managed by the Spring container can be referred to as Spring
    beans.


    The Spring Framework offers a solution for building web applications. It includes
    a number of modules: Spring Faces, Spring Web Flow, Spring JavaScript, Spring
    Security, and Spring BaseDS. And you don''t have to use all these modules to build
    a web application — just use what you need.


    There are two main models for building web applications with HTML clients:


    +   The client connects to a server-side presentation object (such as JSP) that
    is responsible for further routing and processing the request and forming the
    next view to be returned to the client.


    +   The client connects to a server-side controller object (such as no UI code)
    that performs the routing and processing of the request and for selection of the
    proper view to be returned to the client.


    Building a web application in the Spring Framework represents the second model,
    where DispatcherServlet intercepts client requests and passes them to the appropriate
    Java controller to handle the request. The controller creates a ModelAndView object
    and gives it to a view resolver, which finds the view component to return to the
    client. The entire dataflow is shown in Figure 35-1.


    # Servlet Container with Spring Web MVC


    ![](img/c76c0001feef31da8d0f359dd6abacc0_436_0.png)


    FIGURE 35-1


    This architecture is supported by the easily extendable Spring MVC layer. Other
    frameworks can be plugged into the Spring infrastructure. It''s popular to integrate
    Spring and Hibernate for data persistence, but there are other examples of framework
    integration. For example, Adobe''s BaseDS framework or the Apache Struts legacy
    framework can be plugged into Spring.


    HTML forms with data validation and error processing are also supported, and you''ll
    see how to develop such applications in the next section.'
