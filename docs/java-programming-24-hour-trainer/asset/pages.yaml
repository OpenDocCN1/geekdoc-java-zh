  md: "# VARIABLES, CONSTANTS, AND DATA TYPES\n\nSome values representing an object\
    \ change over time (variables) and some remain the same (constants). This section\
    \ will shed more light on the use of both types.\n\n# Declaring Variables\n\n\
    Java is a statically typed language: The program variables must be declared (named\
    \ and typed) first, and then you can assign them values either at the time of\
    \ declaration or later in one of the class methods. For example, the variable\
    \ isGameBoard has been initialized during its declaration in Listing 3-2, and\
    \ currentSubmergeDepth got its value in the method合物().\n\nThe class from Listing\
    \ 3-1 defines a variable color of type String, which is used to represent text\
    \ values.\n\n# Constants\n\nTo store values that never change, you need to declare\
    \ a constant — just add the keyword final to the declaration line, as in Listing\
    \ 3-2:\n\n```\nfinal String MANUFACTURER;\n```\n\nJava developers usually render\
    \ the names of constants in upper case. The value of a constant can be assigned\
    \ only once, and once you are creating an instance of a specific car, its manufacturer\
    \ is known and can't change during the life span of this object:\n\n```\nMANUFACTURER\
    \ = \"J.B. Limited\";\n```\n\nEven though you don't have to initialize final variables\
    \ during their declaration, it is a good practice to follow. The preceding example\
    \ should be written as\n\n```\nfinal String MANUFACTURER = \"J.B. Limited\"\n\
    ```\n\n# Primitive Data Types\n\nThere are eight primitive data types in Java:\
    \ Four are for integer values, two are for values with a decimal point, one is\
    \ for single characters, and one is for Boolean data that allows either true or\
    \ false as a value. Following are some examples of variable declarations and initializations:\n\
    \n```\nint chairs = 12;\nchar grade = 'A';\nboolean cancelJob = false;\ndouble\
    \ nationalIncome = 2386349465745.78;\nfloat hourlyRate = 12.50f; // add an f at\
    \ the end\n                       //float literals\nlong totalCars = 46372836438921;\
    \ // add an 1 at the end\n                       // of long literals\n```"
