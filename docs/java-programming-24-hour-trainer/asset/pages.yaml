  md: "# Access Levels\n\nJava classes, methods, and member variables can have public,\
    \ private, protected, and package access levels, for example:\n\n```\npublic class\
    \ Tax {\n    private double grossIncome;\n    private String state;\n    private\
    \ int dependents;\n    protected double calcTax(...) {...}\n}\n```\n\nThe keyword\
    \ public means that this element (a class, a method, or a variable) can be accessed\
    \ from any other Java class. The keyword protected protects the element \"visible\"\
    \ not only from the current class, but from its subclasses too.\n\nThe keyword\
    \ private is the most restrictive one, as it makes a member variable or a method\
    \ accessible only inside this class. For example, your class may need some additional\
    \ internal methods that could be called from the method calcTax(). The users of\
    \ the class Tax do not need to know about these methods and they should be declared\
    \ private.\n\nIf you do not specify any access, the default is package, which\
    \ means that only classes located in the same package will have access to this\
    \ method or variable. Java classes should expose only the methods that outsiders\
    \ have to know, such as calcTax().\n\nIf you are not sure which access to give\
    \ to methods or variables, make them all private; if later on development some\
    \ other class needs to access them, you can always change the access level to\
    \ be less restrictive. This will protect all the internals of your application\
    \ from misuse. Think of this: \"I want to sell my class Tax to various accounting\
    \ firms across the country. If their software developers integrate my class with\
    \ their existing systems, what are the methods that they must know about in order\
    \ to calculate tax? If designers did not ask themselves similar questions, drivers\
    \ would need to press dozens of buttons just to start the engine.\n\n# THE KEYWORD\
    \ FINAL\n\nThe keyword final can have different meanings depending on the context.\
    \ It's explained in the next sections.\n\n# final Variables\n\nYou can use the\
    \ keyword final while declaring variables, methods, and classes. A final variable\
    \ becomes a constant (see Lesson 3) that can be initialized only once and can't\
    \ change its value during running time. Some people may argue that a constant\
    \ and a variable that can get initialized only once are not the same thing, but\
    \ the fact that you can't change their values makes them very similar.\n\nEven\
    \ though you can declare constants inside a method, it's more common to declare\
    \ them on the class level so they can be reused by several methods of the same\
    \ class. You can also declare a variable with the keyword static and with a proper\
    \ access method so they can use:\n\n```\nstatic final int BOILING_TEMP = 212;\
    \ //in Fahrenheit\n```"
  merge: -1
