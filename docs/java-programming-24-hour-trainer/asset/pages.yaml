  md: '# LISTING 13-3: Catching I/O errors


    Available for download on Wirox.com


    Read the code from Listing 13-3 as follows: "Try to execute fileCustomer.read(),\
    and if an error occurs, jump into the catch section and execute the code from
    there." IOException is a class that contains information about input/output errors.


    In the case of an I/O error, the method read() throws an exception (for more details
    on reading files refer to Lesson 16). The catch block will catch this error and
    process it. The program will not terminate and this exception is considered handled.
    If the method read() finishes successfully, the code in the section catch won''t
    be executed.


    # EXCEPTION HIERARCHY


    Errors in Java are represented as classes that can be divided into two major types:
    those that were caused by bad programming and those that were thrown because of
    some other external condition. For example, if a program declares a variable of
    Tax, but this object was never instantiated, any attempts to call the non-static
    method calTax() will result in NullPointerException:


    ```

    Tax t;

    t.calTax();

    ```


    If a run-time error can be fixed, the exception is called checked. The method
    reads() from Listing 13-3 will throw an exception and the JVM will find to catch
    the code that handles this error. Such an exception can be anticipated and recovered
    without the need to change the code. While the program remains operational, the
    user can find the missing file containing the list of customers and try again
    to populate the GUI with it.


    All exceptions are subclasses of Throwable, which has two immediate descendants:
    Error and Exception. Subclasses of Exception are called checked exceptions and
    have to be handled in your code. You can catch and declare your application-specific
    exception, for example BadShipmentException.


    Subclasses of the class Error are fatal JVM errors and are called unchecked. You
    are not required to put them in try/catch blocks as there is not much you can
    do if, say, the JVM runs out of memory and crashes.


    How is a programmer to know in advance if some Java method may throw a particular
    exception and what the try/catch block should look before? No need to memorize
    anything. If a method throws an exception, the Java compiler will print an error
    message similar to this:


    ```

    "java": unreported exception: java.io.IOException; must be caught or declared
    to be thrown line 57

    ```'
