  md: "# PASSING BY VALUE OR BY REFERENCE\n\nCalling a method with arguments enables\
    \ you to pass some required data to the method. The question is how JVM passes\
    \ these values to the method. Does it create a copy of a variable in a calling\
    \ program and give it to the method?\n\nThe primitive values are passed by value\
    \ (meaning that an extra copy will be created in memory for each variable). If\
    \ you create an instance of Tax as in Listing 4-6, there will be two copies of\
    \ grossIncome and two copies of the dependent variables — one in TestTax and the\
    \ other one in Tax.\n\n# LISTING 4-6: The TestTax class\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_71_0.png)\n\
    \n```\nclass TestTax{\n    public static void main(String[] args) {\n        double\
    \ grossIncome; // local variables\n        String state;\n        int dependents;\n\
    \n        grossIncome = 50000;\n        dependents = 2;\n        state = \"NJ\"\
    ;\n\n        Tax t = new Tax(grossIncome, state, dependents);\n\n        double\
    \ yourTax = t.calcTax(); //calculating tax\n\n        // Printing the result\n\
    \        System.out.println(\"Your tax is \" + yourTax);\n    }\n}\n```\n\nIn\
    \ the preceding example, if you'll be the value of grossIncome or dependents in\
    \ the constructor of the class Tax, it won't affect the values in the corresponding\
    \ variables of the class TestTax because there will be two copies of these primitives.\n\
    \nNow consider another example. I'll declare another variable of type Tax and\
    \ assign the value of it to:\n\n```\nTax t2 = t;\n```\n\nThe variable t is pointing\
    \ to an instance of the Tax object in memory. In other words, the variable t holds\
    \ the reference (the address in memory) to object. The code above will not create\
    \ another copy of the Tax object in memory, but will copy its address to the variable\
    \ t2. Now we still have a single instance of the Tax object, but two reference\
    \ variables — t and t2 — are pointing at it. Until both these variables go out\
    \ of scope (explained in the next section), the object Tax will not be removed\
    \ from memory.\n\nThe process of removal of unused objects from memory is garbage\
    \ collection (GC). JVM runs GC automatically."
