    LastName\" />\n<jsp:setProperty name=\"Student\" property=\"LastName\" value=\"\
    Smith\" />\n```\n\nThe next code snippet populates the Student bean's properties\
    \ LastName and FirstName based on the data from the HTML tag <form>, which has\
    \ two HTML input fields LName and FName:\n\n```\n<jsp:setProperty name=\"Student\"\
    \ property=\"LastName\" value=\"<%= request.getParameter(\"LName\") %>\" />\n\
    <jsp:setProperty name=\"Student\" property=\"FirstName\" value=\"<%= request.getParameter(\"\
    FName\") %>\" />\n```\n\nIf property names are the same in the HTML form and in\
    \ the bean, mapping the HTML form's and bean's fields becomes even simpler with\
    \ the asterisk notation:\n\n```\n<jsp:setProperty name=\"Student\" property=\"\
    *\" />\n```\n\n# How Long Does a Bean Live?\n\nIf a JSP variable is declared inside\
    \ a scriptlet, it has a local scope. To give it an instance scope, declare the\
    \ declaration tag. You can define a bean's scope using the scope attribute of\
    \ the tag <jsp:bean>. The following list defines the various scopes:\n\n+   -\
    \ page: The bean is available only within the current page and will be destroyed\
    \ as soon as the user exits the page. This is a default scope. For example:\n\
    <jsp:Bean id=\"Student\" class=\"com.harward.Student\" scope=\"page\" />\n\n+\
    \   - request: The bean is alive for long as the request object is alive. Even\
    \ if the control will be redirected to a different JSP by means of the tag <jsp:forward,\
    \ the bean will remain available on the new page because it will be using the\
    \ same request object, like this:\n<jsp:Bean id=\"Student\" class=\"com.harward.Student\"\
    \ scope=\"request\" />"
