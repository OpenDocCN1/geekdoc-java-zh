  md: '# LESSON 28 JAVASERVER PAGES


    +   - page represents the instance of the JSP servlet.

    - pageContext represents the JSP context and is used with Tag Libraries (described
    later in this lesson in the section of that name).

    - application provides access to web context. Its use is similar to that of ServletContext.

    - config provides initialization information used by the JSP container. Its use
    is similar to that of the class ServletConfig.


    # OVERVIEW OF THE JSP tags


    Each JSP tag starts and ends with an angle bracket and can be included in any
    HTML file, but you need to save them as .jsp file for proper identification and
    processing by JSP containers. This section is a brief overview of JSP tags. For
    more detailed coverage refer to the JSP documentation at http://java.sun.com/products/jsp/docs.html.


    # Directives


    Directives do not generate screen output, but instruct the JSP container about
    the rules that have to be applied to the JSP. Some of the JSP directives are page,
    include, attribute, and taglib.

    Page directives start with <% and are only effective within the current page.
    Directives are used with such attributes import, extends, session, errorPage,
    contentType, and some others. For example, to import the java.io package use this
    directive:


    ```

    <% page import="java.io.*" %>

    ```


    Include directives to allow the inclusion of any text from a file or any code
    from another JSP, at the time the page is compiled into a servlet, in the following
    example:


    ```

    <% jsp:include page="calcBankRates.jsp %>

    <% include file="bankRates.txt" %>

    ```


    To use a third-party library of custom tags you need to specify where this library
    is located, as in the following example:


    ```

    <% taglib uri="my-taglib.tld" prefix="test" %>

    ```


    The attribute directive enables you to define attributes of custom tags, like
    this:


    ```

    <% attribute name="corporate_logo_file_name" %>

    ```


    # Declarations


    Declarations are used to declare variables before they are used. You can declare
    a variable like this:


    ```

    <! double salary; %>

    ```'
