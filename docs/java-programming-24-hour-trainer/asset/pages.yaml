  md: '# 16


    # Working with Streams


    Most programs work with some kind of data, which could be stored in a local database,
    on a remote computer, or in a file located on your disk. Java has a concept of
    working with streams of data. You can say that a Java program reads sequences
    of bytes from an input stream (or writes into an output stream): byte after byte,
    character after character, primitive after primitive. Accordingly, Java defines
    various types of classes supporting streams, for example InputStream or OutputStream.
    There are classes specifically meant for reading character streams such as Reader
    and Writer. DataInputStream and DataOutputStream can read and write Java primitives,
    and to work with files you may consider such classes as InputStream and FileReader.


    Classes that work with streams are located in two packages: java.io and java.nio.
    Classes from the former implement blocking of input/output (I/O): When bytes are
    being read/written by a process, they become unavailable for other threads of
    execution. The latter package offers non-blocking I/O with improved performance.
    In this lesson you''ll be dealing with streams defined in java.io.


    Before deciding which Java class to use for I/O in each particular case, you need
    to understand what kind of data is coming from the stream in question. But no
    matter what you select, your code will need to perform three operations:


    +   1. Open a stream that points at a specific data source: a file, a socket,
    a URL, and so on.


    +   2. Read or write data from/this stream.


    +   3. Close the stream.


    If a Java program uses a third-party program, such as database management systems
    (DBMS), you won''t need to program streams directly — the database drivers or
    object-relational mapping framework is all you need. In this lesson you''ll see
    examples of performing I/O operations with different streams.'
