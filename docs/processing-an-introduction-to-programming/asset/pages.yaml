  md: '# Processing: An Introduction to Programming


    The Trouble with Fractions on Computers

    Are you curious about why computers have an inherent inaccuracy when it comes
    to fractions? This section explains a bit more about this problem. Don''t worry
    if you don''t understand everything that is covered.


    Consider how, given enough digits, any whole number can be stored exactly on a
    calculator. However, many fractions such as ½ cannot be represented exactly in
    decimal digits. For example, on a calculator, 1 ÷ 3 produces something like


    ![](img/d1536b76dc9068b304a24b0563beff53_92_0.png)


    This inaccuracy results because of the limitations of the decimal (also known
    as “base-10”) number system, which is based upon powers of 10.

    Given enough digits to the left of the decimal point, any whole number can be
    represented exactly in decimal as some combination of quantities of powers of
    10: ones (10⁰), hundreds (10²), thousands (10³), and so on.


    ![](img/d1536b76dc9068b304a24b0563beff53_92_1.png)


    Because 10 is the base, any digit can count from 0 up to 9 before carrying to
    the next digit to the left. For example, fourteen is written as 14, because it
    is a combination of a 10 and four 1s.


    ![](img/d1536b76dc9068b304a24b0563beff53_92_2.png)


    However, to the right of the decimal point, fractions must be represented by decimal
    by combining quantities of negative powers of 10. In other words, we must be able
    to combine quantities of tenths (10⁻¹), hundredths (10⁻²), thousandths (10⁻³),
    and so on, in such a way that this combination equals a given fraction.


    ![](img/d1536b76dc9068b304a24b0563beff53_92_3.png)


    For example, the following quantities of these decimal fractions combine to equal
    ⅓'
