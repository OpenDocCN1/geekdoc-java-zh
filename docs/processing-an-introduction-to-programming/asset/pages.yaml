  md: '# Using the if-else-if-else Statement: Types of Angles


    Angles are sometimes classified according to the following five types:


    ![](img/d1536b76dc9068b304a24b0563beff53_249_0.png)


    | Type of Angle | Description |

    |--- |--- |

    | Acute | less than 90° |

    | Right | 90° exactly |

    | Obtuse | greater than 90° but less than 180° |

    | Straight | 180° exactly |

