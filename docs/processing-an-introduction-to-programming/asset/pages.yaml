  md: 'Processing. However, because the somewhat "magical" behavior of these special
    functions is so different from the most functions operate and is so specific to
    Processing, it is also the case that these special functions can be confusing
    to beginners who are trying to acquire an understanding of functions in general.
    This is the reason why they haven''t been introduced in this book before.


    At the same time, these functions are so central to programming in Processing
    that if you hope to do more advanced programming in Processing, an introduction
    to these special functions is absolutely essential. Thus, the remainder of this
    chapter will give you an to a few of these special void functions, particularly
    the fun and draw() function. If you find these functions somewhat confusing, don''t
    worry: they won''t be used often in this book. However, if you wish to learn more
    about these special void functions, you will find it easier to do so, now that
    you have learned about void functions in general.


    # A special void Function: The draw() function


    As we have learned, the setup() function is a special Processing function. If
    we define the setup() function, Processing will automatically call the setup()
    function, once. draw() function is another special Processing function. We have
    learned about repetition using the while and for statements. However, the draw()
    function offers a different kind of repetition. If we define the draw() function,
    then when we run our program and the defined actions of the setup() function are
    finished, Processing automatically calls the draw() function repeatedly, over
    and over again, until we stop our program. This kind of automatic repetition of
    the draw() function is not found in most programming languages, but it is central
    to creating animations and interactivity in Processing. As the name of the draw()
    function indicates, this is the location where we will typically put statements
    related to drawing on the canvas when we are creating an animation. In more general
    terms, the draw() function is where we will want to put any sequence of statements
    that we wish to have performed repeatedly.


    Select File > New to start a new program. Save this program as DrawDemo.


    ![](img/d1536b76dc9068b304a24b0563beff53_423_0.png)


    Let''s start by defining the setup() function that simply displays a message to
    the console announcing that the setup() function was automatically called by Processing.'
