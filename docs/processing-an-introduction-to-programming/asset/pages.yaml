  md: '# 442 Processing: An Introduction to Programming


    This formula can be written in Processing code as


    ```

    round(numberToRound * 10) / 10.0

    ```


    Notice that we divide by the float value 10.0 (rather than 10) in the above formula
    in order to avoid integer division.

    Similarly, given number with decimal places (e.g., 3.168) can be rounded to hundredths
    by doing the following:


    +   1) multiply the number by 100 316.8

    2) round the result to an integer 317

    3) divide the integer by 100 3.17


    This formula could be written in Processing code as


    ```

    round(numberToRound * 100) / 100.0

    ```


    Notice again that we divide by a float value, 100.0 (rather than 100), in order
    to avoid integer division.

    Now, let''s make our formula more general, so that we can round whatever number
    of decimal places we specify. If n is the number of decimal places to we wish
    to round, then the more general formula can be described as


    +   1) multiply the number by 10"

    2) round the result to an integer

    3) divide the integer by 10"


    For example, to round 3.168 to two decimal places, we would do the following:


    +   1) multiply the number by 10² 316.8

    2) round the result to an integer 317

    3) divide the integer by 10² 3.17


    We can write this more general formula in Processing code as


    ```

    round(numberToRound * pow(10, places)) / pow(10, places)

    ```


    Because the pow() function always returns a float value, we do not need to worry
    about integer division in the above formula.'
