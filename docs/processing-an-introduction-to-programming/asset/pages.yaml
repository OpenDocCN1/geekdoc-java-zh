    \   println(\"Sorry, you lost.\");\n}\n```\n\nHowever, the switch statement actually\
    \ allows us to **combine** cases. Thus, we can simplify this program to the following:\n\
    \n```\nint roll;\nroll = int( random(1, 7) );\nprintln(\"Roll: \" + roll);\n\n\
