    Save the TwoFunctions program.


    # Another Example: Rounding to Decimal Places


    As we know, float values can sometimes be inaccurate, especially in the smaller
    decimal places. For example, in the case of


    ```

    println(3.0/9.0);

    ```


    Processing produces the following console output:


    ```

    0.33333334

    ```


    This is incorrect. The output should be


    ```

    0.33333333

    ```


    Also, working with so many decimal places is sometimes undesirable. For example,
    in the case of monetary figures, we might like to work only with two decimal places.
    To address both of these kinds of problems, it would be useful to use a function
    that returns a float to a certain number of decimal places.


    Select File > New to start a new program. Save this program as Rounding.


    ![](img/d1536b76dc9068b304a24b0563beff53_473_0.png)


    Any given number with decimal places (e.g., 3.168) can be rounded to tenths by
    doing the following:


    +   1) multiply the number by 10

    2) round the result to an integer

    3) divide the integer by 10


    > Actually, the inaccuracy of float values, it sometimes advisable to use int
    values to store monetary amounts. For example, when doing arithmetic with U.S.
    dollars, it may prove be more accurate to work with quantities of cents that int
    values can be used, rather than using float values to represent fractional dollar
    amounts.'
