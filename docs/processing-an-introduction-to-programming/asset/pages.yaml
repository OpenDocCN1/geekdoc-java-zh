    elements is known in Processing as the stroke weight.


    Processing the strokeWeight() function enables us to change the stroke weight
    used when points, line segments, or sharp edges are subsequently drawn. The general
    form of this function is


    ```

    strokeWeight(pixels);

    ```


    The only parameter of the strokeWeight() function is


    pixels The desired stroke weight, specified in pixels'
