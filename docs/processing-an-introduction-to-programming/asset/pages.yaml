    # Constants


    Select File > New to create a new program. Save this program as Constants.


    ![](img/d1536b76dc9068b304a24b0563beff53_138_0.png)


    A constant is similar to a variable in that it is a named storage location that
    stores a value of a certain type. However, unlike the value stored in a variable,
    the value stored in a constant cannot be changed. Also, constants are typically
    given names that are all capital letters to help distinguish them from variables.


    # Predefined Constants


    Similar to Processing''s predefined variables(for example, width and height),
    there are also a number of predefined constants built into Processing.


    A good example is Processing''s predefined float constant named PI. This constant
    has been preassigned a value by Processing: the mathematical number known as pi
    (π) to seven decimal places. To illustrate, if we write the following one-line
    program to display PI to the console,


    ```

    println(PI);

    ```


    we see the following output:


    +   3.1415927


    Notice that the name of this PI, is comprised entirely of capital letters, as
    is customary for constants.

    We can use the PI constant in some of the same ways that we would use a variable.
    For example, the formula for the circumference of a circle is pi multiplied by
    the diameter. Thus, to display the circumference of a circle with a diameter of
    20 pixels, we might write the following one-line program:


    ```

    println(PI * 20);

    ```


    This statement causes the following float value to be displayed in the console:


    ```

    62.831856

    ```'
