    # Benefits of Using Variables


    As our example making of the width and height variables illustrates, variables
    provide a way to describe the objectives of our programs in more general terms.
    By using variables, even if certain factors change, we can still obtain the results
    we desire. In other words, our program is more flexible, less likely to fail when
    certain changes are made.


    Notice how using variables increases the readability of our code. When we use
    specific values for the pixel location of the ellipse


    ```

    ellipse(75, 100, 40, 40);

    ```


    it is probably not very clear to someone reading our code that we are positioning
    our circle at the center of the canvas. In contrast, when we use the width and
    height variables


    ```

    ellipse(width / 2, height / 2, 40, 40);

    ```


    it is much more likely to be apparent to a reader of our code that the circle
    is being drawn at the center of the canvas—that is, in the column is half the
    width of the canvas and at the row that is half the height of the canvas. The
    readability of our code is enhanced by the descriptive and meaningful names that
    variables give, width and height. Giving descriptive and meaningful names to variables
    also makes their names easier to remember.


    Finally, notice also that we are able to use the width and height variables more
    than once in a single program:'
