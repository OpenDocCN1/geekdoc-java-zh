  md: "# 236 Processing: An Introduction to Programming\n\nWhen we test for individual\
    \ values of an int or char variable in an if-else-if-else structure like this,\
    \ we have the option of using a switch statement instead.\n\nThe overall structure\
    \ of the switch statement consists of the keyword switch, followed by the variable\
    \ containing the value we are checking:\n\n```\nswitch (variable)\n{\n}\n```\n\
    \nThus, in our current rock-paper-scissors example, we begin with\n\n```\nint\
    \ integer;\ninteger = int ( random(1, 4) )\nprintln(\"integer is: \" + integer);\n\
    ```\n\n```\nswitch (integer)\n{\n}\n```\n\nWithin this overall structure, we then\
    \ specify each \"case\" of the variable that we wish to test. Each of these cases\
    \ consists of the keyword case, followed by a specific value of the variable and\
    \ a colon. We then specify the statements that we wish to have executed when the\
    \ value of this variable is equal to this particular case's value. Thus, in place\
    \ of\n\n```\nif ( integer == 1 )\n{\n  println(\"Computer picks: Rock!\");\n}\n\
    ```\n\nwe write\n\n```\nswitch (integer)\n{\n  case 1 :\n{\n    println(\"Computer\
    \ picks: Rock!\");\n    break;\n  }\n}\n```\n\nNotice that we conclude this case\
    \ by adding a break statement. This is to ensure that Processing does not go on\
    \ to the next case, but rather exits this switch statement."
  merge: -1
  pgno: 268
