  md: 'We also still see the same float value for the side length output to the console:


    75.0


    Why are we seeing a float value output to the console when we assigned an int
    value the side variable? Here''s what happened: Processing detected a type mismatch
    when we attempted to assign an int value (75) to a float variable (side). However,
    in such cases, Processing automatically resolves the type mismatch by converting
    the int value to the equivalent float value. We can think of this as Processing
    automatically appending *.0* to the end of the int value, making a float value.
    Thus, in this particular program, Processing automatically converts the int 75
    to the float value 75.0 and then assigns this float value to the float variable
    side. We can visualize the automatic conversion in this assignment operation as


    ![](img/d1536b76dc9068b304a24b0563beff53_118_0.png)


    And we can visualize the result of this assignment statement as


    ![](img/d1536b76dc9068b304a24b0563beff53_118_1.png)


    This automatic conversion from int to float is why, when we run our program, we
    do not receive an error message as a result of the type mismatch in our assignment
    statement, and why we see a float value output to the console instead of the int
    value that we used in our assignment statement:


    75.0


    In summary, it is important to remember the following about type mismatches:


    +   * Once a variable is declared, only a value of the defined type may be stored
    in the variable.


    Thus,


    +   * If we attempt to assign a float value to an int variable, then an error
    message will result.


    ![](img/d1536b76dc9068b304a24b0563beff53_118_2.png)


    +   * If we attempt to assign an int value to a float variable, the int value
    is automatically converted to a float value. (We can think of this as simply appending
    the .0 onto the end of the int value.)'
