  md: "# Introduction to Objects ■ 529\n\nNow, when we run our program, we see five\
    \ Circle objects that can each be dragged individually around the canvas:\n\n\
    ![](img/d1536b76dc9068b304a24b0563beff53_561_0.png)\n\nSave and close the ObjectsAndClasses\
    \ program.\n\n# Object-Oriented Programming OOP\n\nAt the outset of this book,\
    \ we built our programs out of simple statements. This is sometimes-called imperative\
    \ programming. Eventually, we arranged these statements into functions, marking\
    \ a move into what is known as procedural programming.\n\nNow that we have an\
    \ introduction to objects, we have have taken steps in the direction of object-oriented\
    \ programming, also known as OOP. In OOP languages such as Java, the fundamental\
    \ unit for building programs is an object, and accordingly, every program that\
    \ is now is comprised of one or more classes. Moving on OOP is a challenging step\
    \ that is beyond the scope of this book. However, after having learned what you\
    \ have through this book, you are now in an excellent position to begin this step\
    \ if you choose to do so. Congratulations!\n\n# Summary\n\nThis chapter provided\
    \ a very brief introduction to creating your own type of objects by creating a\
    \ new class.\n\n+   - An object is a special type of structure that contains\n\
    \  1) Variables that serve as attributes of the object\n  2) Functions known as\
    \ methods, which make use of the attribute variables.\n- A class defines a type\
    \ of object.\n- An object is also known as an instance of a particular class.\n\
    - A constructor has similarities to a function (method) and is used to create\
    \ an object in memory and to initialize the attribute variables of an object.\n\
    - A constructor is called using the new operator.\n- Using a constructor to create\
    \ a new object is also known as instantiating that object.\n- Multiple objects\
    \ of the same class can be instantiated within a single program.\n- Arrays of\
    \ objects can be created."
  merge: -1
