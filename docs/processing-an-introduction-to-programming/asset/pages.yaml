  md: 'Processing: An Introduction to Programming


    # Saving a Program


    When starting a new program, it is a good idea to save it promptly and to save
    it frequently after making changes to the program. "Save early and often!" is
    how this strategy is sometimes stated. This is good advice that can help you from
    losing work that you have done. Saving a program in Processing is very much the
    same process as saving your work in other software that you use. Select File >>
    Save. Since this is the first time you are saving your program, the "Save sketch
    folder..." dialog box appears.


    ![](img/d1536b76dc9068b304a24b0563beff53_34_0.png)


    With this dialog, start by choosing the file folder where you would like to save
    the Processing program you are currently writing. By default, Processing will
    save all your sketches (programs) in a file location that is known as your Sketchbook.
    This Processing program setting that defines this default Sketchbook file location
    can be changed if you plan to save your Programs in a different location. You
    can also browse to the desired file folder location in the manner that you usually
    do when saving your work in other programs that you use.


    Next, in the File name textbox within the dialog box, enter a name for your program.
    It is customary to capitalize the first letter of a Processing program. Let''s
    name this example Drawing.


    ![](img/d1536b76dc9068b304a24b0563beff53_34_1.png)


    Then, click on the Save button to finish saving this program.


    ![](img/d1536b76dc9068b304a24b0563beff53_34_2.png)


    As a result, Processing creates a new folder in which your program is stored.
    This folder has the same name as that you gave to your program. Thus, in this
    example, the new folder is named Drawing.


    ![](img/d1536b76dc9068b304a24b0563beff53_34_3.png)


    Processing calls this the sketch folder. If you examine the contents of the sketch
    folder, you will see a file that has the same name as the folder but also the
    .pde file extension. For example, in the current sketch folder, Drawing.pde is
    the name of the file containing your program.


    +   * You can change this default location of the Sketchbook by doing the following:

    Select File > Preferences.

    Click the Browse button next to the textbox labeled Sketchbook Location.

    Browse to the folder where you would like your Programs saved.

    Press the Open button.

    Press the OK button. The folder you selects is not the default location where
    Processing will save and retrieve your programs.'
