    It is important to remember that the value entered by the user is always returned
    by the showInputDialog() function as a String value. Even if the user''s input
    into the dialog resembles an int or float value, this value is nevertheless returned
    by the showInputDialog() function as a String value.


    For example, let''s change our Dialog program to the following program that prompts
    the user to enter an integer:


