  md: "# Incrementing and Decrementing the for Loop Counter Variable\n\nReturn to\
    \ the ForCount program. As we have learned, a very important part of any counting\
    \ loop is the statement that changes the value of the loop counter variable in\
    \ a way that the loop condition will eventually become false, which stops the\
    \ repetition of the loop. This change in the loop counter variable is often by\
    \ means of an addition operation that increases its value. This is known as incrementing\
    \ the loop counter:\n\n```\nfor (int count = 1; count <= 5; count = count + 1)\n\
    {\n  printf(count);\n}\n```\n\nIn our current statement, we are incrementing the\
    \ loop counter variable by 1, but we can also increment it by other amounts. For\
    \ example, lets instead increase the value of our counting variable by 2 each\
    \ time the loop is performed:\n\n```\nfor (int count = 1; count <= 5; count =\
    \ count + 2)\n{\n  printf(count);\n}\n```\n\nWhen we run this program, we can\
    \ see from the console output that the for loop counts from 1 to 5 in increments\
    \ of 2:\n\n+   1\n3\n5\n\nAs another example, let's make the following changes\
    \ to the initial value of the counting variable, the increment, and the loop condition:\n\
    \n```\nfor (int count = 0; count <= 50; count = count + 10)\n{\n  printf(count);\n\
    }\n```\n\nWhen we run this program, we can see from the console output that the\
    \ for loop counts from 0 to 50 in increments of 10:\n\n+   0\n10\n20\n30\n40\n\
    50"
