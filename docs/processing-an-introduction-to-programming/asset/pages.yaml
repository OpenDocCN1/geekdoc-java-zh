  md: "# Arrays of Objects\n\nReturn to the ObjectsAndClasses program. In creating\
    \ our Circle class, we have created a new kind of object. Thus, we can declare\
    \ any number of objects of type Circle that we wish. We can also have arrays of\
    \ objects. To illustrate, let's create an array of Circle objects.\n\nSelect File\
    \ > Save As and resave the ObjectsAndClasses program as ObjectArray.\n\n![](img/d1536b76dc9068b304a24b0563beff53_559_0.png)\n\
    \nWe can create an array of Circle objects by modifying our main program to the\
    \ following:\n\n```\nint numberOfOfCircles = 5;\nCircle[] circles;\n\nvoid setup()\n\
    {\n  size(200, 200);\n\n  int startColumn;\n  int startRow;\n  int startDiameter;\n\
    \ncir = new Circle[numberOfCircles];\nfor (int count = 0; count < circles.length;\
    \ count = count + 1)\n{\n  startColumn = int (random(width));\n  startRow = int\
    \ (random(height));\n  startDiameter = int (random(20, 60));\n  circles[count]\
    \ = new Circle(startColumn, startRow, startDiameter);\n}\n}\n\nvoid draw()\n{\n\
    \  background(200, 200, 200);\n\nfor (int count = 0; count < circles.length; count\
    \ = count + 1)\n{\n  circles[count].render();\n}\n\nif (mousePressed)\n{\n  for\
    \ (int count = 0; count < circles.length; count = count + 1)\n\n```"
