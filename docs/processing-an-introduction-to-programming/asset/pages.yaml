  md: '# Repetition with a Loop:

    The while Statement


    We have seen the programs we have written that the order in which the statements

    are listed makes a difference. This illustrates a key principle of computing known
    as

    sequence.


    In Chapter 4, we saw that statements placed inside an if or switch statement are
    only

    performed if a certain condition is true. Such conditional programming illustrates
    a sec-

    ond principle of computing known as selection.


    In this chapter and the next, we will see that, sometimes, one or more statements
    need

    to be performed repeatedly in a computer program. This will illustrate a third
    key principle

    in computing: repetition.


    Human beings often find repetitive tasks to be tedious. In contrast, computers
    can pro-

    vide an ideal way to perform repetitive tasks.


    # Repetition as Long as a Certain Condition Is True


    Like the if statement, each repetition structure in this chapter will make use
    of a condi-

    tion. This condition will determine whether the repetition should continue.


    Once again, let''s consider a cooking recipe as an analogy to a computer program.

    Suppose a certain dough recipe says that you are to mix the ingredients and then
    repeat-

    edly ½ cup of flour as long as you can still stir the mixture and the spoon. A
    flowchart

    of this recipe might look like the following:'
  merge: -1
  pgno: 287
- img_proc: true
  md: "![](img/d1536b76dc9068b304a24b0563beff53_288_0.png)\n\nSimilarly, in computer\
    \ programming, there are sometimes sets of statements that we would like to perform\
    \ repeatedly, but only as long as a certain condition is true.\n\n# # Repetition\
    \ with the while Statement\n\nProcessing provides several programming structures\
    \ that can be used for creating repetition. One of the more versatile of these\
    \ repetition structures is the while statement. The basic form of the while statement\
    \ is the following:\n\n```\nwhile (condition)\n{\n  Statement(s) to continue to\
    \ perform\n  as long as condition remains true\n}\n```\n\nwherencondition is the\
    \ condition under which the statement(s) will continue to be performed, repeatedly.*\n\
    Because the while statement creates repetition, it is also known as a while loop.\
    \ In this chapter, we will work through several examples that illustrate the functionality\
    \ of a while statement (loop).\n\n# # Using the while Statement: Rolling a Die\
    \ Repeatedly\n\nLet's return to our Roll program from Chapter 3. Select File >\
    \ Save As and resave the program as RollWhile.\n\n> * Once again, if there is\
    \ only one statement to be repeated, then technically, the pair of curly braces\
    \ is unnecessary. However, we will always use curly braces in the while statements\
    \ in this book. This is not only for consistency but because most while loops\
    \ have more than one statement to be repeated."
