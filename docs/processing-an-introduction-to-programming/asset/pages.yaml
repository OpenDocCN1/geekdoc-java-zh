    - The first letter in the name of a constructor is capitalized.\n- Although a\
    \ constructor does not return a value, we do not use the keyword void in the definition\
    \ of a constructor.\n\nThe header of our new constructor is complete.\n\nWe can\
    \ now define the body of the constructor. This is where we initialize the attribute\
    \ variables to the desired values. In this particular case, we will use our three\
