    \ through and display the seat numbers that appear in any row. To accomplish this,\
    \ we can write\n\n```\nfor (int seat = 1; seat <= 6; seat = seat + 1)\n{\n  print(\"\
    \ Seat \" + seat);\n}\n```\n\nLet’s add a call to the println() function to identify\
    \ the end of the row.\n\n```\nfor (int seat = 1; seat <= 6; seat = seat + 1)\n\
    {\n  print(\" Seat \" + seat);\n}\nprintln(\"-- end of row\");\n```\n\nWhen we\
    \ run this program, we see the following output in the console:\n\nSeat 1 Seat\
    \ 2 Seat 3 Seat 4 Seat 5 Seat 6 -- end of row\n\nNow, suppose we would instead\
    \ like to have a for statement to count through and display the rows. For this,\
    \ we can write\n\n```\nfor (int row = 1; row <= 5; row = row + 1)\n{\n  println(\"\
    Row: \" + row);\n}\n```"
