  md: '# Introduction: Welcome to Computer Programming ■ xxix


    This is a statement instructing Processing to draw an ellipse. It includes four
    items of information that are needed to specify the ellipse that is be drawn.


    The first and second items of information specify where the center of the ellipse
    should be: the pixel column and the pixel row, respectively. In the current statement,
    we have chosen a pixel location of column 50 and row 50, the center of the canvas:


    ```

    ellipse(50, 50, 20, 10);

    ```


    The third and fourth items specify the size of the ellipse to be drawn: the width
    of the ellipse and the height of the ellipse in pixels, respectively. In the current
    statement, we have chosen for an ellipse a width of 20 pixels and a height of
    10 pixels:


    ```

    ellipse(50, 50, 20, 10);

    ```


    Notice that we have added a space after each comma. This spacing is not required,
    but this kind of “whitespace” can make code easier to read. In most cases, Processing
    is very forgiving of adding extra spaces and blank lines for this purpose.


