    28 + " May"


    evaluates to the following:


    "28 May"


    We can verify these results using the println() function:


    ```

    println("blue") + "berry");

    println("May " + 28);

    println(28 + " May");

    ```


    When we run this program, we see the following console output:


    ```

    blueberry

    May 28

    28 May

    ```


    Multiple + operators may be used with concatenation. For example,


    ```

    println("May" + 2 + 8);

    ```


    produces the following output to the console:


    ```

    May28

    ```


    Concatenation has the same level of precedence in the order of operations as addition.
    Thus, when both addition and concatenation appear in the same expression, the
    operations are simply performed left to right. For example, the statement,


    ```

    println(2 + 8 + "May");

    ```


    produces the following output to the console:


    ```

    10May

    ```


    Why is this the result? When the expression 2 + 8 + "May" is evaluated left to
    right, the first operation, 2 + 8, has two int operands. Therefore, the first
    + operation is interpreted as addition, not concatenation.


    Concatenation is also performed if one or both of the operands is a String variable.
    For example, given the following variable declaration and initialization,


    ```

    String food;

    food = "fruit";

    ```'
