  md: "# 212 ■ Processing: An Introduction to Programming\n\nAn if-else-if-else statement\
    \ will work very well for this. Notice that we have a-continuous range of values:\n\
    \n![](img/d1536b76dc9068b304a24b0563beff53_244_0.png)\n\nWhenever we would like\
    \ to implement a continuous range using an if-else-if-else statement, we need\
    \ to identify the breakpoints in the range:\n\n| Temperature Range (°F) | Thermometer\
    \ Color (Meaning) |\n|---|---||\n| breakpoints | below 40 | blue (cold) |\n| 40\
    \ to 49 | light blue (cool) |\n| 50 to 64 | yellow (mild) |\n| 65 to 79 | orange\
    \ (warm) |\n| 80 and above | red (hot) |\n\nThese breakpoints are the four temperatures\
    \ that divide the range of temperatures into the five categories. For example,\
    \ the breakpoint between the blue (cold) category and the light blue (cool) category\
    \ occurs at 40°F. More specifically, the light blue (cool) category begins at\
    \ 40°F, and any lower temperature falls into the blue (cold) category. Thus, we\
    \ can test whether a temperature falls into the blue (cold) category and set the\
    \ corresponding fill color by inserting the following:\n\n```\nif (temperature\
    \ < 40)\n{\n    fill(0, 0, 255); // blue\n    println(\"Cold\");\n}\n```\n\nThe\
    \ next breakpoint is 50°F, which divides the light blue (cool) category from the\
    \ mild (yellow) category. Thus, we add the following else if clause:\n\n```\n\
