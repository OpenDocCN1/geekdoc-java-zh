  md: "# Conditional Programming with if ■ 193\n\nThus, when we run our program, we\
    \ now win only if the roll is a 6:\n\nRoll: 6\nYou won!\n\nNotice that we use\
    \ two equals signs (=) as the operator for comparing two items to see if they\
    \ are equal. In Processing, the double equals sign operator is used to compare\
    \ for equality, as we have learned, the single equals sign is the assignment operator.\
    \ It is easy to make the mistake of typing a single equals sign when a double\
    \ equals sign is needed. For example:\n\n```\nif (roll = 6)\n{\n  println(\"You\
    \ won!\");\n}\n```\n\nFortunately, if we accidentally do this, Processing underlines\
    \ this condition,\n\n```\nif (roll = 6)\n```\n\nand, in this case, gives us the\
    \ following error message in the Message Area:\n\n# Type mismatch, \"int\" does\
    \ not match with \"boolean\"\n\nThis error message isn't entirely clear. However,\
    \ we have seen that a type mismatch often results in a failed assignment statement,\
    \ and this is precisely the problem we have here: we have used the assignment\
    \ operator (=) instead of the equality comparison operator (=).\n\nRemember:\n\
    \n+   - A single equals sign (=) is used for assigning a value to a variable.\n\
    - A double equals sign (=) is used for comparing two values.\n\nSave the Roll\
    \ program. We will return to this program later in this chapter.\n\n# Basic if\
