  md: 'Let''s also add a call to the printf() function after the while statement to
    announce that the game is over:


    ```

    int roll;

    roll = int( random(1, 7) );nprintf("First roll: " + roll);

    ```


    ```

    while (roll != 6)

    {

    roll = int( random(1, 7) );

    printf("Roll again: " + roll);

    }

    ```


    printf("Game over.");


    When we run this modified version of our program several times, we see that the
    first roll of the die always takes place. After this first roll, the number of
    times that the simulated rolling of the die is repeated by the while statement
    depends on how long it takes for a 6 to be rolled. For example, we might see the
    following console output:


    +   * First roll: 2

    * Roll again: 3

    * Roll again: 5

    * Roll again: 4

    * Roll again: 2

    * Roll again: 6

    * Game Over!


    In this particular sample run of our program, after the first roll, the while
    loop continued to be performed five times before a 6 was rolled, which stopped
    the looping. The message announcing the end of the game was then displayed to
    the console.


    Why does the roll of a 6 stop the loop? Because a while loop continues to perform
    the statements in its body only long as the loop condition is true. The loop condition
    for this particular while statement is


    ```

    roll != 6

    ```


    This condition remains true only as long as the roll is not a 6. Once a 6 is rolled,
    this condition becomes false, and the looping action of the while statement ends.


    It is important to understand that, after each time that the statements in the
    body of the loop are performed, the loop''s condition is evaluated again to see
    if it is still true.'
