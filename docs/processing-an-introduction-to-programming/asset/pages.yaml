  md: "```\nint factorial;\nfactorial = 1;\n\nfor (int count = 1; count <= integer;\
    \ count = count + 1)\n{\n  factorial = factorial * count;\n}\n```\n\nLet's take\
    \ a closer look at this assignment statement. Remember, an expression on the right-hand\
    \ side of the assignment operator (=) is always evaluated first:\n\nfactorial\
    \ = factorial * count;\n\nOnce again, you may enclose this expression in parentheses\
    \ if it makes this kind of assignment statement easier for you to understand:\n\
    \nfactorial = (factorial * count);\n\nIn this case, the expression on the right-hand\
    \ side of the assignment statement consists of taking the current value of factorial\
    \ and multiplying it by the current value of count, producing some result. We\
    \ can visualize this as\n\nresult\nfactorial = factorial * count;\n\nThis result\
    \ then stored as the new value of the factorial variable. We can visualize this\
    \ assignment operation as\n\n![](img/d1536b76dc9068b304a24b0563beff53_366_0.png)\n\
    \nFor example, the initial value of factorial is 1, and the initial value of count\
    \ is also 1. Thus, the expression on the right-hand side essentially becomes 1\
    \ * 1.\n\n![](img/d1536b76dc9068b304a24b0563beff53_366_1.png)\n\nThe expression\
    \ 1 * 1 evaluates to 1. Thus, it is stored as the new value of factorial.\n\n\
    ![](img/d1536b76dc9068b304a24b0563beff53_366_2.png)\n\nNext, the value of count\
    \ increases to 2. Thus, the expression on the right-hand side is 1 * 2."
