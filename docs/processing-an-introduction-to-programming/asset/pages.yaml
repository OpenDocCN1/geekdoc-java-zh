    Internally, computers do not use the decimal (base-10) system to represent numbers.
    Rather, computers use **binary** (also known as “base-2”) representation, where
    only powers of 2 are used to represent the digits of a number. Because 2 is the
    base, any binary digit can only count from 0 to 1 before carrying to the next
    digit to the left. Thus, a binary digit can only ever be 0 or 1. A binary digit
    is also known as a **bit**.


    Why are numbers used to build computers? It is easier to represent a binary digit
    on a computer, because a device with only two possible states is that. Consider
    an on-off switch: the “on” position can represent a 1 in a binary digit, and the
    “off” position can represent a 0 in a binary digit.* Thus, computers are built
    using a variety of two-state devices such as transistors (which are used in computers
    as fast as on-off switches).


    Given digits to the *left* of the binary point, any *whole number* can be exactly
    represented in binary as some combination of powers of 2: ones ($2^0$), twos ($2^1$),
    fours ($2^2$), eights ($2^3$), and so on.


    | 8s | 4s | 2s | 1s |

    |---|---|---|---|

    | ↑ | ↑ | ↑ | ↑ |

    | $2^3$ | $2^2$ | $2^1$ | $2^0$ |


    For example, the number 14 would be written in binary as 1110, because it is a
    combination of 8, a 4, and a 2:


    | 1 | 1 | 1 | 0 |

    |---|---|---|---|

    | 8s | 4s | 2s | 1s |

    | ↑ | ↑ | ↑ | ↑ |

    | $2^3$ | $2^2$ | $2^1$ | $2^0$ |


    > * Representing a decimal (base-10) digit requires a more complicated device
    with 10 possible states (e.g., a gear with 10 positions) so that it can represent
    0 through 9.'
