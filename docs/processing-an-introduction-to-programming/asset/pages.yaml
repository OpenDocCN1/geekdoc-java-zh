    # float Arithmetic


    Processing is similar to many other programming languages in the way it performs
    arithmetic involving float values (numbers with decimal points). The important
    principle to bear in mind when performing arithmetic with float values in Processing
    is this:


    > If one or both of the operands is a float value, then the result will also be
    a float value.


    In other words, if even one of the operands has decimal places, then the result
    will have decimal places.


    Examples


    | 5.0 + 2.0 result: 7.0 |

    | 5.0 + 2 result: 7.0 |

    | 5 + 2.0 result: 7.0 |


    | 5.0 * 2.0 result: 10.0 |

    | 5.0 * 2 result: 10.0 |

    | 5 * 2.0 result: 10.0 |'
