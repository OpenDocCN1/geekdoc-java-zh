  md: "# 262 ■ Processing: An Introduction to Programming\n\nBecause the first roll\
    \ was a 6, the very first time that the condition of the while statement was evaluated,\
    \ it was false. The statements inside the body of the while loop were not performed,\
    \ ever once. Rather, Processing skipped over them and moved on to the statement\
    \ after the while.\n\n```\nint roll;\nroll = int(random(1, 7));\nprintln(\"First\
    \ roll: \" + roll);\nwhile (roll == 6 ) != false! {\n  roll = int(random(1, 7));\n\
    \  println(\"Roll again: \" + roll);\n}\n\nprintln(\"Game Over!\");\n```\n\nIf\
    \ the first roll is a 6 then the condition is already false.\nThus, the statements\
    \ in the body of the loop are not performed even once.\n\nProcessing then moves\
    \ to the first statement after the while statement.\n\nThe while statement is\
    \ sometimes called a pretest or test-at-the-top loop because the condition is\
    \ evaluated before any of the statements in the while loop are executed. Thus,\
    \ the statements in the body of a while loop will be performed zero or more times.\n\
    \nSave the While program. We will return to this program later in this chapter.\n\
    \n# Avoiding Infinite Loops\n\nIt is important that the loop condition we choose\
    \ is one that will eventually become false—terminate—that is, stop. Otherwise,\
    \ if the loop condition never becomes false, then we have what is known as an\
    \ infinite loop. This is a programming error that, at the very least, will require\
    \ us to stop the program manually. We might also need close close shut down and\
    \ restart the computer.\n\nHere’s a strategy for avoiding an infinite loop. The\
    \ loop condition of a while statement typically includes a variable. For example,\
    \ the condition of our current while statement contains the roll variable:\n\n\
    ```\nwhile (roll != 6)\n```\n\nTo prevent an infinite loop, there must be a statement\
    \ inside the body of the loop that changes the value of this variable:"
  merge: -1
  pgno: 294
- img_proc: true
  md: "# Repetition with a Loop: The while Statement ■ 263\n\n```\nloop variable\n\
    while (roll) != 6\n{\n  loop variable changed inside body of loop\n  roll = int(random(1,\
    \ 7) );\n  println(\"Roll again: \" + roll);\n}\n```\n\nHowever, the body of the\
    \ loop change the value of the loop variable is not enough to prevent an infinite\
    \ loop. Rather, the value of this loop variable must eventually be changed to\
    \ a value that causes the loop condition to become false. For example, in our\
    \ current game, we have a statement inside the body of the while statement that\
    \ is changing the value of the loop variable each time the loop is performed:\n\
    \n```\nwhile (roll = 6)\n{\n  roll = int(random(1, 7) );\n  println(\"Roll again:\
    \ \" + roll);\n}\n```\n\nWe know from our previous experiences with the random()\
    \ function that this statement will eventually assign the value 6 to the loop\
    \ variable. When this happens, the loop condition becomes false, and the repeated\
    \ performance of the statements in the body of the while loop stops.\nIt is common\
    \ for programmers to create infinite loops by mistake, so don't feel bad if you\
    \ accidentally create one. However, it is a good habit to save your work before\
    \ running a program that has an untested loop!\n\n# Watch Out for the Extra Semicolon!\n\
    \nAs in the case of if statement, notice that there is no semicolon at the end\
    \ of the first line of while statement. In fact, it is even more important to\
    \ avoid this error in a while statement because it might cause an infinite loop:\n\
    \n```\nwhile (roll ! = 6) ; ← to cause an infinite loop!\n{\n  roll = int(random(1,\
    \ 7) );\n  println(\"Roll again: \" + roll);\n}\n```\n\nWhy might this error cause\
    \ an infinite loop? Because adding this semicolon at the end of the line essentially\
    \ creates the equivalent of the following while statement:\n\n```\nwhile (roll\
    \ ! = 6)\n{\n}\n```"
