  md: "# Creating Counting Loops Using the for Statement ■ 339\n\n![](img/d1536b76dc9068b304a24b0563beff53_371_0.png)\n\
    \nAs an illustration of the basic logic of two nested for statements, let’s consider\
    \ an example. Suppose there is a classroom with four rows, numbered 1–4. In each\
    \ row, there are six seats, numbered 1–6.\n\n| seat | seat | seat | seat | seat\
