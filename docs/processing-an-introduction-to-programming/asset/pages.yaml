    255\n```\n\nEach time this loop repeats, let's draw a vertical line segment from\
    \ the top of the canvas (row 0) to the bottom of the canvas (row 49):\n\n![](img/d1536b76dc9068b304a24b0563beff53_351_0.png)\n\
    \nWe'll draw this line segment at the pixel column position equal to the value\
