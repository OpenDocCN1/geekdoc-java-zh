    # float Fractions


    Arithmetic operations with float values usually produces results that are similar
    to what is produced if we perform the same arithmetic on a calculator. However,
    this is not always the case. When using float values, there is a very important
    fact that we need to remember:


    > Computers sometimes produce inaccurate results when fractions are involved.


    As evidence of computer inaccuracy in working with fractions, note that the following
    statement:


    ```

    printf(1.0 / 3.0);

    ```


    produces the following output to the console:


    ```

    0.33333334

    ```


    The 4 in the last digit is obviously incorrect. Similarly, the following statement:


    ```

    printf(0.6 + 0.1);

    ```


    produces the following incorrect output to the console instead of 0.7:


    ```

    0.70000005

    ```


    When programming in Processing, we need to remember to be careful regarding float
    values, especially ones that have more than a few digits to the right of the decimal
    point. In this book, we will use integers (int values) as often as possible.'
