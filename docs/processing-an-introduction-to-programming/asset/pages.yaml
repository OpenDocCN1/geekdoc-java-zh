    # Stacking Order


    Notice that we run our current program,


    ```

    rect(10, 15, 40, 70);

    elipse(65, 50, 55, 70);

    ```


    the ellipse is drawn **on top of** the rectangle.


    ![](img/d1536b76dc9068b304a24b0563beff53_64_1.png)


    We see this result because of what is sometimes known as the **stacking order**.
    In Processing, when a graphical element is drawn *after* some other graphical
    element(s), it is drawn *on top of* those graphical elements that were drawn previously.


    In our current program, the call to the `rect()` function is the **first** statement
    in the program, and the call to the `ellipse()` function is the **second** statement
    of the program:


    ```

    rect(10, 15, 40, 70);

    elipse(65, 50, 55, 70);

    ```


    Therefore, when we run this program, the ellipse is drawn *after* the rectangle.
    Accordingly, the ellipse is drawn **on top of** the rectangle.


    ![](img/d1536b76dc9068b304a24b0563beff53_64_2.png)'
