  md: '# Creating Functions

    That Return a Value


    In this chapter, we will learn how to create our own functions that return a value.


    # (Non-void) Functions


    In Chapter 7, we considered a void function as a sequence of individual actions
    as have been given a name and that, together, comprise desirable overall action.
    As an analogy, we considered how a parent’s general instruction to a teen to “get
    ready for school” is actually a concise way of referring to a whole sequence of
    activities that need to be performed.


    Now, let’s consider a slightly different analogy. Suppose that, each year, a parent
    instructs a teen:


    > Find out how much it will cost for you to play soccer this season.”


    Both the parent and teen know that this general instruction actually translates
    into a whole sequence of individual instructions, such as


    +   - Find out the cost of the cleats you need.

    - Find out the cost of the shin guards you need.

    - Find out the cost of the soccer ball you need.

    - Find out the cost of the team uniform.

    - Add up these costs.

    - Report back the total cost.


    Because the individual activities of this routine are predefined, the parent can
    ask the teen to perform this entire sequence simply by saying, “Find out how much
    it will cost for you to'
  merge: -1
  pgno: 441
- img_proc: true
  md: 'play soccer this season." However, notice that, unlike the "Get ready for school"
    analogy, the sequence of activities in this second analogy ends by requiring the
    teen to bring back an item of information—namely, the total cost of playing soccer
    this season.


    In Processing, a non-void function is similar to this second analogy in a named
    sequence of statements is performed, but a resulting item of information described
    by the general instruction is also brought back. Such non-void functions that
    return a value are more commonly simply as "functions"


    In this book, we have used a number of built-in Processing functions that return
    a value. For example, behind the scenes, the sqrt() function is defined as a sequence
    of steps that comprise the overall action of calculating the square root of whatever
    value we supply as an argument to this function. This square root result is then
    returned to us as a float value.


    ![](img/d1536b76dc9068b304a24b0563beff53_442_0.png)


    Remember also that, when we call a non-void function, we need to make immediate
    use of the returned value. For example, we know that we write the statement


    ```

    sqrt(9.0);

    ```


    then the square root returned by this function call is lost. We have learned that
    a good technique for making immediate use of the value returned by a function
    is to assign this value to a variable. For example, we can store the square root
    returned by the sqrt() function in a float variable, root:


    ```

    float root;

    root = sqrt(9.0);

    ```


    This way, the resulting value returned by the function is stored in a variable
    and is available for us to use further. For instance, we could use this variable
    to display the returned value in the console:


    ```

    float root;

    root = sqrt(9.0);

    printf("Square root: % " + root);

    ```


    Similarly, as we will see, when we create our own function that returns a value,
    we will need to make immediate use of the returned value whenever we call such
    a function.'
