  md: "# Creating Counting Loops using the for Statement ■ 317\n\n```\nfor (int count\
    \ = 1; count <= 5; count = count + 1)\n{\n    println(count);\n}\n```\n\nWhen\
    \ the variable used for counting is declared in the first line of a for statement,\
    \ as it is in our current program, this variable cannot be used outside that for\
    \ statement.\nThe range of a program where a particular variable may be used is\
    \ sometimes called the scope of that variable. The scope may be thought of as\
    \ the \"life span\" of the variable: after we have moved beyond the range of the\
    \ program where this variable may be used, this variable is no longer available\
    \ for us to use. (We'll learn more about variable scope later in this book.) For\
    \ example, in the following program, the count variable may only be used within\
    \ the scope in which it is declared.\n\n```\nfor (int count = 1; count <= 5; count\
    \ = count + 1)\n{\n    println(count);\n}\n```\n\nNow, let's try adding the following\
    \ statement:\n\n```\nfor (int count = 1; count <= 5; count = count + 1)\n{\n \
    \   println(count);\n}\n```\n\n```\nprintln(\"Value of count when loop ends: \"\
    \ + count);\n```\n\nProcessing underlines the reference to count in this added\
    \ statement:\n\n```\nprintln(\"Value of count when loop ends: \" + count);\n```\n\
    \nAlso, the following error message is displayed in the Message Area:\n\n# The\
    \ variable \"count\" does not exist\n\nThis error results because the last statement\
    \ attempts to use the variable count outside the variable's scope, outside the\
    \ range of the program where this variable can be used.\n\n```\nfor (int count\
    \ = 1; count <= 5; count = count + 1)\n{\n    println(count);\n}\n```\n\n```\n\
    println(\"Value of count when loop ends: \" + count);\n```\n\nDelete the statement\
    \ that we just added. Save and close the ForCount program."
