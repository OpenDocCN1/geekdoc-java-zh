    Save the TempsArray program. We will continue working with it in the next section.


    # Accessing an Array Element


    Return to the TempsArray program. We are not required to process the elements
    of an array in sequence. Rather, an array provides random access, which means
    that any of the array locations is directly accessible. To access any array element,
    we simply use the appropriate index. Thus, give the array array declaration


    ```

    int [] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    we can refer to the first element in the array as


    ```

    temperatures[0]

    ```


    > * As of this writing, the println() function still works to display an array
    in this same format, but the newer printArray() function is the one recommended
    for doing so.'
