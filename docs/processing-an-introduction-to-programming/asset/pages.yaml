  md: '# Types, Expressions,

    and Variables


    This chapter introduces basic concepts that are foundational to the chapters that
    follow.

    In this chapter, we will learn how to work with various types of information in
    Processing. We will start by learning some of the types of numbers that we can
    use, how we do arithmetic with these types of numbers, and how we can store these
    types of numbers in variables. We will also learn how to work with nonnumerical
    items of information, such as single text characters and strings of text characters.

    The graphics in this chapter are kept quite simple to make it easier to focus
    on the key concepts that are being introduced.


    Values

    In computing, a single item of information that is in its simplest form is known
    as a value.

    As we shall see, we are able to work with different types of values in Processing.
    These include both numeric values and nonnumeric values such as a letter of the
    alphabet or an entire word.

    We will start with numeric values and look at nonnumeric values later in this
    chapter.


    Numeric Values

    Numeric values are specific numbers that are in their simplest form.


    +   Examples

    - 2 is a numeric value.

    - 2.5 is a numeric value.

    - 2 + 5 is not a numeric value, because it can be further simplified to 7.

    - 7 is a numeric value.'
  merge: -1
