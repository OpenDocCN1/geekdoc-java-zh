    }\nelse if (temperature < 50)\n{\n    fill(127, 226, 255); // light blue\n   \
    \ println(\"Cool\");\n}\n```\n\nAt first glance, this logic might seem to be incorrect.\
    \ After all, consider a temperature such as 32°F. This temperature is not only\
    \ less than 40 but also less than 50. We might worry about the fact that 32°F\
    \ not only satisfies the condition in our if clause,"
