  md: "# 524 ■ Processing: An Introduction to Programming\n\n```\nCircle(int columnInitial,\
    \ int rowInitial, int diameterInitial)\n{\n    column = columnInitial;\n    row\
    \ = rowInitial;\n    diameter = diameterInitial;\n}\n```\n\n```\nvoid render()\n\
    {\n    ellipse(column, row, diameter, diameter);\n}\n```\n\n```\nvoid update()\n\
    {\n    int radius = diameter / 2;\n    float mouseDistance = dist(mouseX, mouseY,\
    \ column, row);\n\n    if (mouseDistance < radius)\n    {\n        column = mouseX;\n\
    \        row = mouseY;\n    }\n}\n```\n\nAs a result, each Circle object will\
    \ now have the ability to update its position whenever we call its update() method\
    \ using dot notation:\n\n```\nlittleCircle.update();\n```\n\nor\n\n```\nbigCircle.update();\n\
    ```\n\nWhen the update() method is called and the mouse pointer is over the Circle\
    \ object, the pixel location of the Circle object's center will be changed to\
    \ the pixel location of the mouse pointer. However, we only want to call this\
    \ new update() method of the Circle object when the mouse is pressed. Fortunately,\
    \ Processing has a built-in boolean variable mousePressed that is true when the\
    \ mouse button is pressed and false otherwise. To call the update() methods of\
    \ our two Circle objects, we add the following to the draw() function:\n\n```\n\
    if (mousePressed)\n{\n    littleCircle.update();\n    bigCircle.update();\n}\n\
    ```"
