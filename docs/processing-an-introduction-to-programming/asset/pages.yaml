  md: '# Types, Expressions, and Variables ■ 87


    # float 0 int


    You might more easily remember how Processing handles such a type mismatch thinking
    of it in the following way:


    +   * Processing will not make the mismatched value "shorter.". That is, it will
    not "cut off" the fractional portion of a float value to make an int value.


    ![](img/d1536b76dc9068b304a24b0563beff53_119_0.png)


    +   * Processing will make the mismatched value "longer.". That is, it will essentially"tack
    on" a .0 to an int value in order to make it a float value.


    ![](img/d1536b76dc9068b304a24b0563beff53_119_1.png)


    Save the Variable program. We will continue working with it in the next section.


    # Why Not Use the float Type?


    Because of the automatic type conversion from int to float that Processing does,
    it might be tempting to declare all numeric variables to be of type float. However,
    here are some reasons why you should not this:


    +   1) It is important to understand the key differences between the int and float
    types, such as the difference between the way division is performed with int values
    and the way division is performed with float values.


    +   2) Any int value is always stored exactly in an int variable, whereas float
    fractions are sometimes inaccurate.


    +   3) There are certain situations in Processing where only int values may be
    used.


    These are also one of the reasons why, in general, you should avoid declaring
    a variable to be of type float when you expect that all the values to be stored
    in this variable will be integers.


    For example, although Processing allows us to use float values with most of its
    drawing functions, any fractional portion of a float value used with a drawing
    function will be ignored because Processing only works with whole pixels. Thus,
    a function call such as


    ```

    rect(0.5, 0.5, 50.2, 50.2);

    ```


    will essentially be treated as


    ```

    rect(0, 0, 50, 50);

    ```'
