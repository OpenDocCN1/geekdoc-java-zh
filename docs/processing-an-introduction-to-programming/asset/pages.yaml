  md: '# Conditional Programming with if ■ 203


    ```

    else if (condition-2)

    {

    Statement(s) to perform if condition-2 is true

    else

    {

    Statement(s) to perform if neither of the above conditions is true

    }

    ```


    However, we are actually allowed to add as many else clauses as we would like:


    ```

    if (condition-1)

    {

    Statement(s) to perform if condition-1 is true

    else if (condition-2)

    {

    Statement(s) to perform if condition-2 is true

    else if (condition-n)

    {

    Statement(s) to perform if condition-n is true

    else

    {

    Statement(s) to perform if none of the above conditions is true}

    ```


    Thus, the if-else-if-else statement offers us the opportunity to test for what
    could be an extensive list of mutually exclusive possibilities. This form of selection
    will become clearer after we look at some examples in the next sections.


