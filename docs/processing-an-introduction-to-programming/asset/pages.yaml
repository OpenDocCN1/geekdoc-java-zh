  md: '# Introduction to Objects


    In processing, we have learned to work with *primitive* types of data, such as
    int, float, char, and boolean. However, we have also learned that Processing allows
    us to work with data *objects*, such as a String object or an array. In this chapter,
    we will undertake a basic introduction to *creating* our own *type* of objects
    by creating a new *class.*


    # Understanding an Object


    What exactly is an *object*, and what makes it special? In Processing, an **object**
    can bundle together


    +   1) **Attributes—*variables*** that store items of information about the object;

    2) **Methods—*functions*** that enable the object to perform certain actions involving
    the object''s attributes (variables).¹


    Thus, whenever we have items of *information* that are related to each other and
    we regularly use to perform certain actions, we might define a new type of object
    to bundle this information with this *usage*.

    One very common reason for defining a new type of Processing object is to model
    (represent) a thing that we use in life. For example, a stopwatch involves *information*
    (e.g., the elapsed time) and *usage* through actions involving its information
    (e.g., pressing the reset button resets the elapsed time).


    > *An attribute is also known by a variety of other terms, such as *field, state,
    characteristic, and data member*.

    ¹A method is simply a function that is defined inside a class.'
  merge: -1
  pgno: 537
