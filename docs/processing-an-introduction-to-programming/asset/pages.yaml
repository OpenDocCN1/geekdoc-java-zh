  md: 'Modify this program so that it consists of the following two statements:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    ```

    intArray(temperatures);

    ```


    Remember that in order to create an array, Processing needs to know the size of
    the array so that it can set aside sufficient space in the computer''s memory
    for it. So far, we have been assigning values for an array in the following manner:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    This statement indicates how large the array needs to be in the computer''s memory
    in order to hold these int values.

    However, we do not always know in advance the specific values that will be stored
    in an array. In this case, we need to use the new operator, followed by the type
    and size of the array, in order to instruct Processing how large to make the array.
    For example, to declare an array named temperatures that can hold six values of
    type int without specifying what these six values are, we write the following:-


    ```

    int[] temperatures = new int[6];\intArray(temperatures);

    ```


    The first statement in this program causes Processing to do the following:


    +   1) Processing sets aside locations in the computer''s memory for a new array
    of six int values.

    2) Processing stores in the temperatures variable the address in the computer''s
    memory where this new array is located.

    3) Processing initializes all the elements of this new array to 0, the default
    value for an int array.


    We visualize this behind-the-scenes process as


    ![](img/d1536b76dc9068b304a24b0563beff53_518_0.png)


    > * We also have the option of using two statements:

    int[] temperatures;

    temperatures = new int[6];'
