  md: '# Arrays ■ 457


    1) Processing aside space for this new array in the computer''s memory.


    In this particular case, Processing determines that we have six elements of type
    int, so it sets aside sufficient space in memory for six elements of this type.


    2) Processing inserts the values we have listed into the corresponding locations
    in the array.


    3) Processing stores in the array variable the numeric address in the computer''s
    memory where this new array is located.


    Using our temperatures array example, we can visualize the resulting relationship
    between our array variable and the array''s location in memory as


    ![](img/d1536b76dc9068b304a24b0563beff53_489_0.png)


    Thus, an array variable does not contain the actual array. Rather, an array variable
    contains the numeric address in the computer''s memory where the array is stored.
    As evidence of this, we can call the print() function using our array variable:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

    print(temperatures);

    ```


    When we run this program, we see console output something like the following:


    ```

    I@2a139a55

    ```


    The somewhat odd-looking sequence of characters you see after the @ symbol describes
    the numeric address in memory where the array is located. These are "hexadecimal"base-16)
    digits, which allow for a more compact way of writing the large numbers needed
    for numbering memory addresses.


    > * The address you see differ from the one shown here.

    † Today''s arrays have gigabytes of memory; so numbers in the billions are required
    to assign a unique address to each location of a computer''s memory. For example,
    705,927,765 is the decimal equivalent of 2a139a55, the decimal (base-16) number
    shown here. Here, the numeric addresses are binary. For example, the number requires
    30 digits: 10101000001110010101010101. This is why hexadecimal numbers are used
    as a kind of "shorthand" version of binary numbers because 2⁴=16, every four (base-2)
    digits can be compacted into one hexadecimal (base-16) digit. Thus, the 30-digit
    binary number can be compacted into the 8-digit hexadecimal number.'
