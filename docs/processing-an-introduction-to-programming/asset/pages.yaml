    # Performing Actions a Specified Number of Times with a for Statement: Coin Flip
    Simulation Example


    We have seen that one of the common uses of a loop is to count through a series
    of numbers such as 0–255. However, we have also seen that another common use of
    loop is to perform a certain set of actions a specified number of times. For example,
    suppose we would like to simulate the flipping of the coin a certain number of
    times to see how many times "heads” is the result and how many times "tails” is
    the result Let’s write a program to do this.


    ![](img/d1536b76dc9068b304a24b0563beff53_356_1.png)


    Select File > New to start a new program. Save this program as CoinToss.


    | CoinToss v |


    We will need a variable to keep track of the number of flips of a coin that we
    would like to simulate. For example, if we intend to simulate the flipping of
    the coin 10 times, we can write


    ```

    int total;

    total = 10;

    ```


    We also need variables to keep track of the number of heads and the number of
    tails result. Since we haven’t started counting yet, we’ll initialize these variables
    to zero:


    ```

    int total;

    total = 10;

    ```'
