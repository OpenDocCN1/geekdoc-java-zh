  md: "244 Processing: An Introduction to Programming\n\nthe day of the week that\
    \ we entered is displayed back to us in the console:\n\nYou entered: Sunday\n\n\
    Now, how do we determine whether the user has correctly entered “Sunday,” the\
    \ first day of the week? An if-else statement will work nicely for this. It is\
    \ tempting to use the equals comparison operator consisting of two equals (=)\
    \ to compare two String objects. Thus, we might try inserting the following if-else\
    \ statement:\n\n```\nimport static javax.swing.JOptionPane.*;\n\nString day;\\\
    iday = showInputDialog(\"Enter the first day of the week:\");\n\nprintln(\"You\
    \ entered: \" + day);\nif (day == \"Sunday\") {\n    println(\"That is the first\
    \ day of the week.\");\n} else {\n    println(\"That is not the first day of the\
    \ week.\");\n}\n```\n\nHowever, when we run this program, we find that no matter\
    \ what, even when we enter “Sunday,”\n\n![](img/d1536b76dc9068b304a24b0563beff53_276_0.png)\n\
    \nwe are told that this is not the first day of the week:\n\nYou entered: Sunday\n\
    That is not the first day of the week.\n\nThe problem we are encountering here\
    \ is that the condition in our if clause,\n\n```\nif (day == \"Sunday\")\n```\n\
    \nis never evaluating to true. Rather, it is evaluating to false, no matter what\
    \ day we enter. Thus, every time we run the program, the else clause of our if-else\
    \ statement is always performed:"
  merge: -1
