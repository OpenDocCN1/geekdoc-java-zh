- img_proc: true
  md: "```\nif (day == \"Sunday\")\n{\n  println(\"That is the first day of the week.\"\
    );\n}\nelse{\n  println(\"That is not the first day of the week.\");\n}\n```\n\
    \nWhy is this happening? The int, float, char, and boolean are all primitive types,\
    \ the most basic types of values and variables in Processing. A variable of a\
    \ primitive type is a named storage location that actually contains whatever primitive\
    \ value is assigned to it. For example, when we write statements like\n\n```\n\
    int first;\nfirst = 15;\n```\n\nwe can visualize the result as\n\n| int |\n| first\
    \ |\n\nString is an object type, a slightly more complex type of value and variable\
    \ in Processing. When we write statements like\n\n```\nString day;\nday = \"Saturday\"\
    ;\n```\n\nwe can visualize the result as\n\n![](img/d1536b76dc9068b304a24b0563beff53_277_0.png)\n\
    \nHowever, behind the scenes, a String variable does not contain an actual sequence\
    \ of characters. Rather, it contains the address in the computer's memory where\
    \ that sequence of characters is stored. Thus, a more accurate visualization might\
    \ be something like\n\nThus, behind the scenes, when we compare two items of type\
    \ String using the equals operator (==), Processing actually compares the two\
    \ memory addresses, not the sequence of characters that are stored at those locations.\n\
    \nThe details concerning the way String objects handled behind the scenes in Processing\
    \ are rather complicated. What's most important to be aware of, is that this comparison\
    \ of String values and variables using == will only sometimes yield a correct"
  merge: -1
  pgno: 277
- img_proc: true
  md: "246 ■ Processing: An Introduction to Programming\n\nresult (true or false),\
    \ so it should never be used with String variables and values. Therefore, we need\
    \ to use another technique whenever we compare String values and variables to\
    \ see if they are equal, a technique that we will learn in the next section.\n\
    \nSave the equals program. We will continue working with it in the next section.\n\
    \n# The equals() Method of a String Object\n\nAs we have learned, String is actually\
    \ an object type. One of the features of an object is that it can have predefined\
    \ functions built into it. This is also known as a \"method.\\ (Whenever you use\
    \ the word method, you may think of it as a predefined function that is built\
    \ into an object). For example, every String object has a built-in equals() method\
    \ for reliably checking if String has the same String value as another String\
    \ object. This equals() method takes one argument: the other String object to\
    \ which we are comparing the current String object. To use this method, we simply\
    \ add a period (dot) to the name of the String variable, followed by the call\
    \ to the equals() method in this manner is an example of what is known as dot\
    \ notation or dot syntax. Return to the Equals program. Here is how we can reliably\
    \ check if the String variable named day is equal to the String value \"Sunday\"\
    :\n\n```\nday.equals(\"Sunday\")\n```\n\nThus, the basic form of testing for equality\
    \ the equals() method is\n\n```\nString1.equals(String2)\n```\n\nOnce we make\
    \ the appropriate modifications to our program, we now have the following:\n\n\
    ```\nimport static javax.swing.JOptionPane.*;\n\nString day;\nday = showInputDialog(\"\
    Enter the first day of the week:\");\n\nprintln(\"You entered: \" + day);\nif\
    \ (  day.equals(\"Sunday\") )\n{\n    println(\"That is the first day of the week.\"\
    );\n}\nelse\n{\n    println(\"That is not the first day of the week.\");\n}\n\
    ```"
  merge: -1
