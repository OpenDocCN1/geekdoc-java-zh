  md: '# Arrays


    Consider the following list of six temperatures:


    +   - 57, 10, 32, 78, 212, 101


    Suppose we need to work with all of these temperatures in a single computer program.
    One way to do so would be to declare a variable for each of them:


    ```

    int temperature1 = 57;

    int temperature2 = 10;

    int temperature3 = 32;

    int temperature4 = 78;

    int temperature5 = 212;

    int temperature6 = 101;

    ```


    However, this seems to be a somewhat cumbersome approach. Think of how unwieldy
    approach would be if we needed to process 100 temperatures! Fortunately, there
    is a better way to work with lists of related elements that are all the same type:
    by using an array of values.


    # About Arrays


    Up to now, each of the variables we have used stored a single value. However,
    like most programming languages, Processing also provides us with the ability
    to use an array of values.


    An array consists of a fixed number of items of the same type arranged in a specific
    order.


    Let''s look more closely at this definition:'
  merge: -1
  pgno: 485
- img_proc: true
  md: '# 454 ■ Processing: An Introduction to Programming


    An array is always defined to store a specific number of items, and this capacity
    does not change.


    2) "same type"


    All the values stored in an array must be of the same type.


    3) "specific order"


    The items in an array are kept in a specific order.


    Each item stored in an array is called an **element**.

    To illustrate an array, suppose we were to insert our list of temperatures into
    the upper-left corner of a spreadsheet and look only at the *row numbers* of these
    temperatures:


    | 1 | 57 |

    | 2 | 10 |

    | 3 | 32 |

    | 4 | 78 |

    | 5 | 212 |

    | 6 | 101 |


    This is a good visual for thinking about arrays. There is one key difference:
    In computer programming, the numbering of items often starts at *zero* rather
    than at 1. For example, we have seen this in the numbering of pixel rows and pixel
    columns of the canvas. We see such zero-based numbering in arrays as well. Here,
    we need to think of six temperatures in our array as numbered from 0 to 5 (not
    1 to 6):


    | 0 | 57 |

    | 1 | 10 |

    | 2 | 32 |

    | 3 | 78 |

    | 4 | 212 |

    | 5 | 101 |


    An array has a *name*. Let''s give the name "temperatures" to this array.


    | temperatures |

    | 0 | 57 |

    | 1 | 10 |

    | 2 | 32 |

    | 3 | 78 |

    | 4 | 212 |

    | 5 | 101 |


    > * Technically, Processing does include functions for expanding and shortening
    an array. However, these functions are not typical of the way that arrays are
    used in most other programming languages.'
  merge: -1
  pgno: 486
- img_proc: true
  md: '# Arrays 455


    Now, suppose we want to refer to a particular element in our array. In Processing,
    the way to do this is simply by giving the name of the array, enclosed in square
    brackets. The row number that refers to a particular element in an array is called
    an index or subscript. For example, we can refer to the element in row 3 of the
    temperatures array


    temperatures [3]


    | temperatures |

    |---|-|

    | 0 | 57 |

    | 1 | 10 |

    | 2 | 32 |

    | 3 | 78 |

    | 4 | 212 |

    | 5 | 101 |


    Using our array terminology, we can say that this element in the temperatures
    array has an index (or subscript) of 3. Likewise, we can say that the element
    currently stored in temperatures [3] is 78. Notice that this element has an index
    of 3, but it is the fourth element in the array the first index of any array as
    zero.


    # Declaring an Array


    Let''s actually create the above temperatures array as a variable in Processing.
    Select File > New to start a new program. Save this program as TempsArray.


    ![](img/d1536b76dc9068b304a24b0563beff53_487_0.png)


    The first step in creating an array variable is declaring it. As usual when declaring
    a variable, we begin the declaration for an array variable by specifying a type:


    ```

    int

    ```


    However, when we declare an array variable, we are specifying the type of all
    the elements that will be stored in the array. For this reason, specifying the
    type of an array variable, we add left and right square brackets after the type
    specifier:


    ```

    int []

    ```'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# 456 Processing: An Introduction to Programming


    Next, we specify the name of our array; This declaration of our array variable
    is now complete:


    ```

    int [] temperatures;

    ```


    However, the above statement merely instructs Processing to create a variable
    named temperatures that is able to store the address in the computer''s memory
    where an array of int values has not actually been created yet, so the memory
    address is not yet known. We can visualize this as


    ![](img/d1536b76dc9068b304a24b0563beff53_488_0.png)


    In order to create an array in the computer''s memory, Processing needs to know
    how many elements our array will be, so that it can set aside space for this array
    in memory.


    Save the TempsArray program. We will continue with it in the next section.


    # Initializing an Array with Specific Values


    Return to the TempsArray program. Sometimes, we already have in mind the initial
    values that we would like our new array to contain when we create it. In such
    cases, we can insert these values to the array variable using the assignment operator
    (=). We simply list the values, separated by commas, and enclose this list between
    left and right braces. For example, we can both declare the temperatures array
    and initialize it to contain the six specific int values in our above example
    using the following statement:


    ```

    int [] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    However, note that we are not able to declare the array variable and specify initial
    values in separate statements. For example, the following two statements generate
    an error:


    ```

    int [] temperatures = {57, 10, 32, 78, 212, 101}; <--error!

    ```


    When we declare and initialize our array in a single statement like this, Processing
    does three things:


    > * Although it is a less common practice, we are also allowed to put the square
    brackets after the array name instead of the type, for example,


    ```

    int temperatures[] = {57, 10, 32, 78, 212, 101};

    ```


    > † Declaring and initializing an array in two separate statements is possible,
    but this technique is quite unconventional:


    ```

    int [] temperatures; temperatures = new int[]{57, 10, 32, 78, 212, 101};

    ```'
