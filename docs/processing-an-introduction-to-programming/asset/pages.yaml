  md: '# Basic Drawing in Processing ■ 33


    On the other hand, suppose we reverse the order of the statements in our program:


    ```

    ellipse(65, 50, 55, 70);

    rect(10, 15, 40, 70);

    ```


    Now, when we run our program, the rectangle is drawn after the ellipse and, as
    a result, the rectangle is drawn on top of the ellipse:


    ![](img/d1536b76dc9068b304a24b0563beff53_65_0.png)


    Let''s return our two statements to their original order:


    ```

    rect(10, 15, 40, 70);

    elipse(65, 50, 55, 70);

    ```


    When we run the program, the ellipse is once again drawn on top of the rectangle:


    ![](img/d1536b76dc9068b304a24b0563beff53_65_1.png)


    In some graphic design software, it is possible to change the stacking order after
    the graphical elements are drawn. However, in Processing, the only way to change
    the stacking order of graphical elements is by changing the order in which they
    are drawn.


    This example illustrates a very important principle in computer programming: the
    performing of actions in a specified sequence. As is the case in a cooking recipe,
    the order in which the individual actions make up a computer program are performed
    is significant. Changing the order of the actions may produce a different result.


