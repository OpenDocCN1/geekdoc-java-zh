  md: '# Creating Counting Loops Using the for Statement


    In computer programming, we sometimes use a loop to count. Such a loop is commonly
    known as a counting loop.


    # Uses of a Counting Loop


    As we shall see in this chapter, a counting loop enables us to perform two main
    kinds of tasks. First, a counting loop enables us to count through a series of
    numbers. For example, suppose we would like to count from 1 to 10 and display
    these numbers. As we shall see in this chapter, we can use a counting loop for
    such a task. Second, a counting loop enables us to repeat a set of statements
    a specified number of times. For example, suppose we would like to display "Hello!"
    to the 20 times. As we shall see in this chapter, we can use a counting loop for
    two main reasons for using a counting loop:


    Thus, there are two main reasons for using a counting loop:


    +   1) to count through a series of numbers

    2) to repeat a certain set of statements a specific number of times.


    # Requirements of a Counting Loop


    When we create a counting loop, we must meet three minimum requirements:


    +   1) Declare and initialize a counting variable.

    2) Define a loop condition that uses this counting variable is specified.

    3) Inside the loop, change the counting variable in such a way that the loop condition
    eventually becomes false, ending the loop.


    Let’s work through an example of a counting loop that illustrates these three
    requirements.'
