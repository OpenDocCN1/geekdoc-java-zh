    \nmax(dice)\nwill return the largest value currently found in the dice array.\n\
    \nOne of the goals of the Yahtzee game is to roll a “Yahtzee,” which is when the\
    \ number shown on all five dice is the same.\n\n![](img/d1536b76dc9068b304a24b0563beff53_523_0.png)\n\
    \nConsider this: If the smallest and largest value in an array are equal, this\
    \ means that all the elements in the array must all be the same value. Thus, if\
