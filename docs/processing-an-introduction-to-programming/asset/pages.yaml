  md: 'The order of operations (operator precedence) in Processing works in a similar
    way. However, one key difference is that, like many programming languages, Processing
    does not have a symbol that can be used for indicating an exponent.* Thus, when
    two or more operators are combined in a single expression, Processing performs
    these operations in the following order:


    +   1. Parentheses

    2. Multiplication or division

    3. Addition or subtraction


    Examples


    ```

    3 * 2 + 5 evaluates to 11

    3 + 2 * 5 evaluates to 13

    3 + 2) * 5 evaluates to 25

    ```


    The results of all these expressions can be verified with calls to the println()
    function, as in the following program:


    ```

    println(3 * 2 + 5);

    println(3 + 2 * 5);

    println(3 + 2) * 5);

    ```


    When we run this program, we see the following resulting values output to the
    console:


    ```

    11

    13

    25

    ```


    In Processing, whenever there are two operators within an expression that have
    the same level of precedence, these operations are performed from left to right.
    This left-to-right order of operations can make a difference when integer division
    is involved.

    For example, consider the expression


    ```

    100 * 3 / 4

