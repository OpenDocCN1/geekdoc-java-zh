    # Inline Comments


    Processing gives us the option of putting comments in our code. One common use
    of comments is to clarify the purpose of one or more lines of our code, not only
    for others who read our code but for ourselves as we work on the program.


    One of commenting in Processing is with inline comments. If we type forward slashes
    (//), Processing will ignore anything we write from the point where the slashes
    are inserted to the end of that line of code.


    For example, to clarify that the stroke() function in our current program will
    turn on red stroking, we can add the following comment:


    ```

    noStroke();

    strokeWeight(5);

    rect(10, 15, 40, 70);

    stroke(255, 0, 0); // red stroke

    elipse(65, 50, 55, 70);

    ```


    Notice that this does not cause an error, because Processing ignores everything
    from the two slashes to the end of that line of code.


