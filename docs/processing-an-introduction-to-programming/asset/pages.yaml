  md: '# Preface: Why We Wrote This Book and For Whom It Is Written xix


    graphical programs in Processing have a numerical basis that is often easier to
    understand in the form of text and numerical output. Third, some readers are likely
    to be learning to program for the purpose of being able to process numerical information
    (e.g., if they are interested in math, science, or business) and/or to process
    data that is likely to include textual information. Fourth, we hope that a combination
    of simple graphical examples with simple examples that use names and/or text will
    appeal to a broader range learners. In our own experience, it is sometimes a visual
    example that first connects with a student, but at other times, it is a numerical
    and/or textual example that a student finds to be more illustrative. In still
    other cases, it might be a combination of these types of examples that successfully
    connects with a student.


    We have followed what might be said to be a fairly traditional sequence of topics,
    one that we have found to work well for introducing programming. instructors and
    students who have undertaken some computer programming before. We have tried to
    introduce the key science concepts with introductory programming without going
    into details that remain being overwhelming. Supplementary materials will be available
    to instructors to introduce even more science concepts associated with the topics
    (e.g., in a “CSI course”). Processing''s capabilities for animation and interactivity
    are not explored extensively in this book and not touched upon until Chapter 7.
    However, additional examples using animation and interactivity are available for
    instructors who wish to provide more coverage of these features and introduce
    them earlier. In addition, several online chapters are provided that introduce
    slightly more advanced topics in Processing, such as two-dimensional arrays, manipulation
    of strings, and file input and output (processingnyhof.com). Additional exercises
    for most of the chapters are also available.


    Throughout the writing of this text, one of our primary concerns has been the
    pace of the material. Some might find it to be slower in comparison with most
    programming texts. However, in our experience, it can be easy to forget how gradual
    a process is required for most beginners to learn to program. Our pace in this
    book is based on our experiences in teaching programming to a wide variety of
    beginners in a classroom. No prior experience is expected. We hope that you will
    find the pace of this book to be a good match to the rate at which you learn as.
    It is our hope that this text will be useful to students and instructors in a
    first programming class, but we have tried to write this book in such a way that
    it will also be useful to persons teaching themselves to program.'
