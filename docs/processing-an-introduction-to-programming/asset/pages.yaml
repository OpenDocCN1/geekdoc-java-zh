    # Nested for Statements and Pixels: A Graphical Example


    Nested for statements are somewhat complicated. However, they can also enable
    us to produce some interesting graphical effects in Processing. For example, nested
    statements can be very useful when there is some operation that we would like
    to perform throughout the canvas. To illustrate this, we can manipulate the entire
    canvas, pixel by pixel, using two nested statements. Select File > New to start
    a new program. Save this program as NestedPixels.


    ![](img/d1536b76dc9068b304a24b0563beff53_373_0.png)


