  md: "# Conditional Programming with if ■ 191\n\nRoll: 3\n\nWe can visualize the\
    \ logic of this if statement with the following flowchart:\n\n![](img/d1536b76dc9068b304a24b0563beff53_223_0.png)\n\
    \nSave the Roll program. We will continue working with this program in the next\
    \ section of this chapter.\n\n# Caution: No Semicolon at the End of the First\
    \ Line of an if Statement\n\nAlways make sure that there is no semicolon at the\
    \ end of the first line of an if statement.\n\n![](img/d1536b76dc9068b304a24b0563beff53_223_1.png)\n\
    \nWe are so accustomed to adding a semicolon to the end of single-line statements\
    \ that adding a semicolon to the first line of an if statement is a very easy\
    \ mistake to make. However, this can be a very difficult error to find, because\
    \ it does not cause an error message. For example, if we accidentally write the\
    \ following, no error message results:\n\n```\nif (roll > 3); {\n  println(\"\
    You won!\");\n}\n```\n\nHowever, this is a logical error because we have now created\
    \ an if statement that actually consists only of the following:\n\n```\nif (roll\
    \ > 3);\n```\n\nThis is an if statement that takes no action, even if the condition\
    \ is true! In other words, we have essentially given the following instruction\
    \ to Processing: \"If the roll is greater than 3, don't do anything.\" Also, because\
    \ of this misplaced semicolon, the statement following the if statement no longer\
    \ has a condition attached to it. Instead, Processing essentially views this statement\
    \ block as:"
