  md: '# Conditional Programming with if


    Up to now, all our programs have been what are sometimes known as straight-line
    programs, because all of the statements in such a program are simply executed
    in the order in which they are listed, from first to last.


    In this chapter, we wish to look at statements that are conditional in that they
    involve one or more actions that are performed only when a certain condition is
    true. Such conditional statements are also known as examples of selection, because
    they specify actions that are performed only selectively.


    # Recipe Analogy


    A cooking recipe can provide a helpful analogy when we think about what a computer
    program is. Like a recipe, a program involves performing a certain set of individual
    actions in a particular sequence, from beginning to end, to achieve a specific
    result. In computer programming, such a sequence of actions that produces a desired
    result is also known as algorithm.


    However, there are times when we wish to perform one or more of the individual
    actions in such a sequence selectively—that is, only if a certain condition is
    true. Consider our recipe analogy. Butter can be purchased salted or unsalted.
    Thus, a recipe might include a statement such as


    If you are using unsalted butter, add 1/4 teaspoon of salt.


    According to this instruction, we do not always want to add this 1/4 teaspoon
    of salt to the recipe. Rather, this action is conditional. Specifically, if the
    condition is true (the butter is indeed unsalted), then we do want to perform
    the action of adding salt. However, if our condition is false (the butter is not
    unsalted, but rather is salted butter), then we do not perform the action of adding
    salt.'
  merge: -1
  pgno: 219
- img_proc: true
  md: "# 188 ■ Processing: An Introduction to Programming\n\nSuch a conditional action\
    \ is sometimess represented as a flowchart:\n\n![](img/d1536b76dc9068b304a24b0563beff53_220_0.png)\n\
    \nSimilarly, a computer program may include conditional statements. Such statements\
    \ are performed selectively, only if a certain condition is true.\n\n# The Basic\
    \ if Statement\n\nMost programming languages provide a very powerful feature for\
    \ conditional action: the if statement. In Processing, the basic if statement\
    \ is typically written in the form\n\n```\nif (condition)\n{\n  Statement(s) to\
    \ perform if the condition is true\n```\n\nUnlike the other statements we have\
    \ written so far, the if statement is usually written as more than one line of\
    \ code, and yet it is still considered to be a single statement.\n\nLet's take\
    \ a closer look at the items of information that we need to supply for the general\
    \ form of the if statement. First, an if statement needs a test condition.\n\n\
    ```\nif (condition)\n```\n\nThis test is usually a comparison that will always\
    \ turn out to be true or false. This kind of true-or-false comparison is also\
    \ known as a Boolean expression.* In Processing, the basic operators for comparison,\
    \ known as the relational operators, are the following:\n\n+   - Greater than\n\
    - Less than\n\n> * Boolean expressions are named after George Boole (1815–1864),\
    \ an English mathematician who, in addition to many other accomplishments, developed\
    \ methods for applying algebra to logic."
  merge: -1
  pgno: 220
- img_proc: true
  md: "# Conditional Programming with if ■ 189\n\n> Greater than or equal to\n\n<=\
    \ Less than equal to\n\n!= Not equal to\n\n== Equal to\n\nSecond, we need to specify\
    \ one or more statements that will be performed if—and only if—the condition is\
    \ true. We will enclose any such statement(s) in a pair of curly braces, creating\
    \ what is known as a block of statements.\n\n```\nif (condition)\n{\n  Statement(s)\
    \ to perform if the condition is true\n}\n```\n\n# Basic if Statement Example:\
    \ Rolling a Die Game\n\nLet's return to the die-rolling Roll program from Chapter\
    \ 3. Currently, it consists of the following statements:\n\n```\nint roll;\nroll\
    \ = int( random(1, 7) );\nprintln(\"Roll: \" + roll);\n```\n\nWhen we run this\
    \ program, we see the following kind of result in the console:\n\nRoll: 2\n\n\
    Now, suppose we are instead playing a game in which the player wins only if the\
    \ number rolled is greater than 3. For this, our test condition can be\n\n```\n\
    roll > 3\n```\n\nThis test condition is comprised of a comparison. Each time we\
    \ run this program, this comparison will always turn out to be either true or\
    \ false. These are only two possibilities. One possibility is that the roll is\
    \ greater than 3 (i.e., the roll is a 4, 5, or 6). In this case, the comparison\
    \ in our condition is true. The other possibility is that the roll is not greater\
    \ than 3. or equal to 3 (i.e., the roll is a 1, 2, or 3). In this case, the comparison\
    \ in our condition is false.\n\n![](img/d1536b76dc9068b304a24b0563beff53_221_0.png)"
  merge: -1
  pgno: 221
- img_proc: true
  md: "# 190 ■ Processing: An Introduction to Programming\n\nAccording to the general\
    \ form of the if statement, we enclose our condition in a pair of parentheses.\
    \ Thus, for the current program, we will start our if statement by adding the\
    \ following line of code to our program:\n\n```\nint roll;\nroll = int( random(1,\
    \ 7) );\nprintln(\"Roll: \" + roll);\n```\n\n```\nif (roll > 3)\n```\n\nNext,\
    \ we need to specify the one or more statements that will be executed—and only\
    \ if—the condition is true. We will enclose these statements in a pair of curly\
    \ braces and indent them, creating a program block:\n\n```\nif (roll > 3)\n{\n\
    \  Statement(s) to perform if roll > 3\n}\n```\n\nWe now need to specify what\
    \ it is that we want to do if the roll is indeed greater than 3. Let's display\
    \ a message to the console announcing that the player has won the game. For this,\
    \ we can insert the following statement:\n\n```\nint roll;\nroll = int( random(1,\
    \ 7) );\nprintln(\"Roll: \" + roll);\n```\n\n```\nif (roll > 3)\n{\n  println(\"\
    You won!\");\n}\n```\n\nNow, when we run this program, if the roll is greater\
    \ than 3, then the condition is true, and the message about winning the game is\
    \ indeed displayed:\n\nRoll: 4\nYou won!\n\nHowever, if the roll is not greater\
    \ than 3 (i.e., less than or equal to 3), the condition is false, and the reminder\
    \ about winning the game is not displayed:\n\n> * Technically, if there is only\
    \ one statement to be executed, then curly braces are not required. Thus, we could\
    \ write:\nif (roll > 3)\nprintln(\"You won!\");\nHowever, for consistency and\
    \ to allow for the later addition of other statements, we will use curly braces\
    \ in every if statement in this book."
  merge: -1
  pgno: 222
