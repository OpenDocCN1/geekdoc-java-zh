  md: "# Arrays 479\n\nThis integer division operation evaluates to 81, an int value.\
    \ As we know, an int value is automatically converted by Processing to the float\
    \ value when we assign it to a float variable. Thus, when the value 81 is assigned\
    \ to average, it is converted to 81.0, so the resulting value of the average variable\
    \ is 81.0.\n\nHow can we fix this? Remember that if one of the two operands in\
    \ an arithmetic operation is a float value. Remember also that the float() function\
    \ will convert an int value to the float value. (We can think of this as Processing\
    \ simply adds a .0 to the int value.) Thus, we can convert sum to a float value\
    \ using the float() function by inserting the following:\n\n```\naverage = float(sum)\
    \ / temperatures.length;\n```\n\nNow, we avoid integer division and will get the\
    \ correct result. Thus, our program is now\n\n```\nint[] temperatures = {57, 10,\
    \ 32, 78, 212, 101};\n\nint sum = 0;\nfloat average;\n\nfor (int count = 0; count\
    \ < temperatures.length; count = count + 1) {\n  println(\"temperatures[\" + count\
    \ + \"] = \" + temperatures[count]);\n  sum = sum + temperatures[count];\n}\n\n\
    println(\"array length: \" + temperatures.length);\nprintln(\"Average: \" + average\\\
    );\n\naverage = float(sum) / temperatures.length;\nprintln(\"Average: \" + average\\\
    );\n```\n\nNow, when we run this program, we see the following output:\n\n```\n\
    temperatures[0] = 57\ntemperatures[1] = 10\ntemperatures[2] = 32\ntemperatures[3]\
