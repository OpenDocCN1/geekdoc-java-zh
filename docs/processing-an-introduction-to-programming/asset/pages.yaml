  md: "# Conditional Programming with if ■ 197\n\n# roll == 6 true false\n\nCurrently,\
    \ when we run our program, a message announcing that the player has won is displayed\
    \ only when the roll is a 6:\n\nRoll: 6\nYou won!\n\nOtherwise, the roll is a\
    \ 1, 2, 3, 4, or 5, and the player has lost. However, in this case, no message\
    \ displayed following the roll:\n\nRoll: 2\n\nWe should also display a message\
    \ following the roll when the player loses. For this, we will add an else clause:\n\
    \n```\nint roll;\nroll = int ( random(1, 7) );\nprintln(\"Roll: \" + roll);\n\n\
    if (roll == 6)\n{\n    println(\"You won!\");\nelse\n{\n}\n```\n\nAn else clause\
    \ specifies the alternative actions that will be performed whenever the condition\
    \ is false. In our current program, we would like to display a message indicating\
    \ that the player has lost. Thus, our else clause can be\n\n```\nint roll;\nroll\
    \ = int ( random(1, 7) );\nprintln(\"Roll: \" + roll);\n\nif (roll == 6)\n{\n\
    \    println(\"You won!\");\n}\n```\n\n> * As the case of the if statement, the\
    \ curly braces are technically unnecessary when a single statement follows the\
    \ else keyword. However, for the sake of consistency and to make it easier to\
    \ add additional statements, we will use curly braces when writing an else clause."
