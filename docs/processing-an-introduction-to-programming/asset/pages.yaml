  md: "# 514 ■ Processing: An Introduction to Programming\n\nourselves. However, it\
    \ is actually better for us to provide an explicit definition of a constructor\
    \ others.\n\nDirectly accessing an object's attribute variables outside the class\
    \ definition using dot notation violates a fundamental principle of OOP known\
    \ as encapsulation. According to this principle, we really should consider an\
    \ object's attribute variables to be \"private\" inside the object and should\
    \ not be manipulated by any statements outside the object. Instead, we should\
    \ initialize instance variables by using a constructor. Similarly, we should only\
    \ change or retrieve the values of attribute instances by using an instance method\
    \ designed for this purpose. Thus, according to the principle of encapsulation,\
    \ we should not be manipulating the attribute variables encapsulated inside the\
    \ littleCircle object. However, this is exactly what we are doing by means of\
    \ the following statements that are currently in the setup() function\n\n```\n\
    littleCircle.column = 30;\nlittleCircle.row = 50;\nlittleCircle.diameter = 20;\n\
    ```\n\nInstead, we define and use our own constructor for the Circle class. We\
    \ can then use this constructor to initialize the instance variables of a Circle\
    \ object to whatever specific values we choose, instead of the default values\
    \ that were assigned by the default Circle() constructor.\n\nDefining the header\
    \ of a constructor is similar to defining the header of a function, except a return\
    \ type is not specified. Not the keyword void should appear in the constructor's\
    \ header. Thus, we begin the header with simply the name of the constructor, which\
    \ is always the same as the name of the class. Unlike functions, the first letter\
    \ of a constructor's name is always capitalized. A constructor is typically defined\
    \ after any instance variables that are declared in the class and before any instance\
    \ methods that will be defined in the class. Thus, we can start our constructor\
    \ definition by inserting the following into our class:\n\n```\nclass Circle {\n\
    \    int column;\n    int row;\n    int diameter;\n\n    Circle()\n\n    void\
    \ render() {\n        ellipse(column, row, diameter, diameter);\n    }\n}\n```"
  merge: -1
