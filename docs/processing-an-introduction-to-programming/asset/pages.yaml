    Let''s search this array for a certain value. We''ll declare and initialize a
    variable to hold the particular value we are seeking:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    ```

    int seeking = 78;

    ```


    Let''s also display this value to the console:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

    ```


    ```

    int seeking = 78;

    ```


    ```

    println("Searching for: " + seeking);

    ```'
