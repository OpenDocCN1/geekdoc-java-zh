    size(300, 200);

    ```


    We can count through each pixel in the canvas in the same way that we did with
    our classroom seat example. The following for statement will count through each
    pixel column of the canvas:


    ```

    for (int column = 0; column < width; column = column + 1)

    {}

    ```


