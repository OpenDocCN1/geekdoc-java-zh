  md: '# Combining Declaration and Initialization


    If we prefer, we are allowed to combine declaration and assignment into a single
    statement.

    For example, instead of writing


    ```

    int side;

    ```


    ```

    side = 50;

    ```


    we can write


    ```

    int side = 50;

    ```


    This single statement accomplishes two operations: it both declares the variable
    side and initializes it with the value 50.


    There are compelling reasons in favor of either style. However, in this book,
    we will usually declare and initialize a variable using separate statements. This
    is to help us remember that declaring a variable and initializing a variable are
    actually two distinct actions. Furthermore, there are some situations in Processing
    where the combined form cannot be used.


    # Reusing a Variable


    Let''s return to our Variable program. Now that our int variable side has been
    declared and initialized, it can be used multiple times in place of other specific
    int values within any statements that follow in our program.


    For example, we can insert our int variable side into the two other places in
    our program where we previously used the specific int value, 50:


    ```

    int side;

    ```


    ```

    side = 50;

    rect(0, 0, side, side);

    println(side);

    ```


    Now when we run our revised program, each time there is a reference to the side
    variable, a copy of the value currently stored in side is retrieved and used in
    that place. We can visualize this as


    ```

    int side;

    ```


    ![](img/d1536b76dc9068b304a24b0563beff53_112_0.png)


    Thus, the call to the rect() function'
