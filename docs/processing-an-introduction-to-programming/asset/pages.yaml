    # Displaying Multiple Items to the Console


    A call to the print() or println() function can also be used to output multiple
    items on a single line in the console. In Processing, there are two main techniques
    for accomplishing this.


    The first technique is to separate the items by commas. These items will be displayed
    on the same line of the console, but a space is automatically inserted between
    each item. For example, the following statement:


    ```

    println("May", 28);

    ```


    produces the following console output:


    May 28


    Notice that a space is automatically inserted between the String value "May" and
    the int value 28. Similarly, the following statement:


    ```

    println(5, 10);

    ```


    produces the following output to the console:


    5 10


    Here, too, notice that a space is automatically inserted between the int value
    5 and the int value 10.


    The second technique for displaying multiple items on a single line in the console
    is to make use of String concatenation. This is the technique that will be used
    in this book.'
