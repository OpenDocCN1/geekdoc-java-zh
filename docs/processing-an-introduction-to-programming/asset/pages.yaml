  md: '# xxiv Introduction: Welcome to Computer Programming


    +   - You cannot always count on someone else to create your software. Computer
    software is needed by so many people and in so many ways that there can never
    be enough people with programming abilities to develop all the software that users
    would like to. Thus, knowing enough about computer programming to create or customize
    software may help you provide software that you or others need and would not otherwise
    be available.


    +   - Even a little knowledge of computer programming is better than none at all.
    Many people have no experience with all programming. Thus, having even a knowledge-edge
    of computer programming puts you a step ahead in terms of understanding computing.


    +   - Computer programming might already be, or turn out to be, something you
    need to learn. Many areas of study and careers are enriched by a basic knowledge-edge
    of computer programming, and a growing number are starting to require it. Traditionally,
    programming paired well with math, science, and business. But in the present era,
    interests and skills in arts and media are also excellent pairings with computer
    programming. Today, computer programs are used to solve a very wide range of problems
    and serve a wide variety of purposes in every area of human society.


    +   - Computer programming is a creative activity. Computer programs are often
    used to solve problems, but computer programming is also a creative activity.
    Thus, you might find yourself writing a program as a means of expressing yourself
    or simply out of an urge to create something new. More artists and designers are
    learning to program, especially those who work in electronic media.


    +   - Computer programming might turn out to be something that you are good at
    and enjoy doing. You will never know this without giving programming a try.


    These are just a few of the many good reasons for learning about computer programming.


    What Is Programming?


    Consider a “program” that you might be given at a band, orchestra, or choir concert.
    This program lists the order in which the musical numbers are performed. This
    notion of putting things in a certain sequence is one of the fundamental concepts
    of computer programming.


    Another useful analogy is that of a recipe, where certain actions with various
    ingredients are performed in a certain order to achieve a certain result. A computer
    program is much like a recipe, involving the performance of a specific sequence
    of actions using certain “ingredients” (items of information) for the purpose
    of producing certain desired results. In computing, such a recipe is also known
    as an algorithm.'
