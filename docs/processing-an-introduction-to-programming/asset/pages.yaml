  md: '# 36 Processing: An Introduction to Programming


    ![](img/d1536b76dc9068b304a24b0563beff53_68_0.png)


    The three primary colors of light are red, green, and blue. When red light is
    mixed with green light, yellow light is produced. When red light is mixed with
    blue light, magenta light is produced. When green light is mixed with blue light,
    cyan light is produced. When red, green, and blue light are mixed in maximum amounts,
    white light is produced. When there is no red, no green, and no blue light at
    all, black is the result.


    When the RGB model is used in computer technologies, the amounts of red, green,
    and blue light are typically described on a scale from 0 to 255. Thus, any color
    is described in RGB as a set of three numbers, each of which from 0 to 255. For
    example, the RGB numbers for the basic colors in the above diagram are:


    | | Red | Green | Blue |

    |---|---|---|---|n| Red | 255 | 0 | 0 |

    | Green | 0 | 255 | 0 |

    | Blue | 0 | 0 | 255 |

    | Yellow | 255 | 255 | 0 |

    | Magenta | 255 | 0 | 255 |

    | Cyan | 0 | 255 | 255 |

    | White | 255 | 255 | 255 |

    | Black | 0 | 0 | 0 |


    Why 255? The amount of each of the red, green, and blue components is actually
    an eight-digit binary number, which is also known as 1 "byte". The largest binary
    number that can be stored in a byte is 11111111, which is the number we write
    in decimal as 255.


    Processing also provides a built-in tool for determining the RGB numbers of a
    particular color. From the Tools menu, select Color Selector:'
