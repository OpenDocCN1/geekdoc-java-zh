  md: "# Caution: Only Two Semicolons!\n\nNotice that in the first line of the forCount\
    \ program, only two semicolons are used to separate the three required parts contained\
    \ within the parentheses:\n\n```\nfor (int count = 1; count <= 5; count = count\
    \ + 1)\n{\n  println(count);\n}\n```\n\nA semicolon is not used after the third\
    \ part, and using one will cause an error:\n\n```\nERROR\nfor (int count = 1;\
    \ count <= 5; count = count + 1);\n{\n  println(count);\n}\n```\n\nAlso, as in\
    \ the case of the if and while statements, be careful not to put a semicolon at\
    \ the end of the first line of the for statement:\n\n```\nERROR!\nfor (int count\
    \ = 1; count <= 5; count = count + 1);\n{\n  println(count);\n}\n```\n\n# Avoiding\
    \ Infinite Loops\n\nIt is important when using a for statement to avoid inadvertently\
    \ creating an infinite loop. Given the initial value of the counting variable,\
    \ the specified change in the counting variable that is made each time the loop\
    \ runs must be such that the condition of the for statement eventually becomes\
    \ false. Otherwise, an infinite loop will result.\n\n| counting variable's initial\
    \ value | test condition | variable must eventually cause test condition to become\
    \ false |\n| --- | --- | --- |\n| count = 1 | count <= 5 | count + 1 |\n\n```\n\
    for (int count = 1; count <= 5; count = count + 1)\n{\n  println(count);\n}\n\
    ```\n\nIn the for statement in the current version of our forCount program, the\
    \ value of the loop starts at 1, it increases by 1 each time the loop is repeated.\
    \ Thus, we know that the value of the loop variable will eventually become greater\
    \ than 5. At that point, the loop condition will become false, ending the repetition\
    \ of the loop."
  merge: -1
