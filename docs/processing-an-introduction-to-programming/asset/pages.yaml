  md: '# Summary


    In this chapter, we learned about an important data structure known as an **array**.


    +   - An array consists of a *fixed* number of items of the *same type* arranged
    in a *specific order*.


    +   - An item in an array is known as an **element**.


    +   - We declare and create an array using *specific values*.


    +   - We refer to an element of an array using an **index**, also known as a **subscript**.


    +   - Array indexes are zero based; in other words, the first item in the array
    has `0` as its index.


    +   - We declare and initialize an array using the **new** operator; the elements
    of such an array will be initialized to a *default* value that is appropriate
    to the type of an array.


    +   - An variable actually stores the *address* where the array is located in
    the computer''s memory.


    +   - Using an index that is greater than or equal to the length of the array
    can cause an error known as an **out-of-bounds exception**.


    +   - Counting loops, especially for*for* loops, are useful for arrays.


    +   - An array is a kind of object, evidenced by its **length** property, which
    stores the length, of a given array.


    +   - Processing provides several functions that can be used with arrays, including
    `printArray()`, `min()`, and `max()`.


    Processing also provides a number of functions for sorting and copying an array.
    Arrays can also be passed as arguments to a function. To learn about such uses
    of arrays, see the online chapter “Advanced Array Operations.”


    Processing also has the capability for *multidimensional* arrays. To learn about
    these, see the online chapter “Two-Dimensional Arrays.”'
  merge: -1
