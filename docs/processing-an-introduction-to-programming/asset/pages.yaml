  md: '# Matching the Type of an Argument to the Type of a Parameter


    Start a new program by selecting File > New. Then, save this new program with
    the name Functions.


    ![](img/d1536b76dc9068b304a24b0563beff53_162_0.png)


    In most of the calls to Processing''s drawing functions that we have made so far,
    we have used integers as the arguments. For example, in Chapter 2, we made calls
    to the size() function like the following:


    ```

    size(150, 200);

    ```


    Actually, the size() function is one of the few Processing drawing functions that
    requires us to supply an int value for each of its parameters. For example, if
    we write the following,


    ```

    size(150.0, 200.0);

    ```


    then Processing underlines the beginning of this statement:


    ```

    size(150.0, 200.0);

    ```


    Also, an error message appears in the Message Area:


    The function "size()" expects parameters like: "size(int, int)"


    Processing is alerting us to the fact that the size() function has two parameters,
    both of which are int type. Thus, the arguments that we supply to meet these parameter
    requirements of this function must be int type as well. In other words, every
    time we call the size() function, we need specify two int values. In this case,
    we received an error because we instead two float values as the arguments. As
    we have learned, a float value cannot be used when an int value is expected.


    How are we to determine the types of the parameters required by a particular Processing
    function so we can know what kind of arguments we need to use when we call that
    function? Rest assured, from this point forward in this book, whenever a function
    is used for the first time, the types of any parameters it has will be identified!


