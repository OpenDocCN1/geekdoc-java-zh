    # Searching an Array: Linear Search


    Another common operation performed on an array is searching for a particular value.
    One of the least efficient but simplest methods of searching is the linear search,
    where we simply step through the array elements in order until we find the value
    we are seeking or until we reach the end of the array.


    Let''s construct a program to do a basic search. Select File > New to start a
    new program. Save this program as LinearSearch.


    ![](img/d1536b76dc9068b304a24b0563beff53_529_0.png)


    Let''s once again use our temperatures array:


    ```

    int[] temperatures = {57, 10, 32, 78, 212, 101};

