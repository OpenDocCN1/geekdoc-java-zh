  md: '# # Preface: Why We Wrote This Book and For Whom It Is Written


    This book is based on our belief that Processing is an excellent language for
    beginners to learn the fundamentals of computer programming.


    What Is Processing?


    Processing was originally developed in 2001 at the MIT Media Lab by two graduate
    students, Ben Fry and Casey Reas, who wanted to make it simpler to use computer
    programming to produce visual art. Fry and Reas have been joined by a community
    of developers who have continued to update and improve Processing. As an open-source
    software project, Processing is free for anyone to download, and versions are
    available for Windows, macOS, and Linux computers.


    Because Processing is based on Java, Processing is quite powerful. For example,
    if you explore these websites as https://processing.org and https://www.openprocessing.org,
    you''ll see a variety of works that have been created using Processing: drawings,
    interactive art, scientific simulations, computer games, music videos, data visualizations,
    and much more. Some of these creations are remarkably complex.


    Because Processing is based on Java, it has many similarities to Java. However,
    Processing is much easier to learn than Java. In fact, we believe that Processing
    might well be the best language currently available for teaching the basics of
    computer programming to beginners.


    Why Not Java?


    One of the most important features of Processing is that it enables us to begin
    the process of learning to program by building our programs out of simple statements
    and functions. Unlike strictly object-oriented languages such as Java, Processing
    does not require us to start with the more complex concepts and structures of
    "objects." This makes for what we believe is a much gentler introduction to programming.
    At the same time, because Processing is based on Java, we have the full capability
    to move on to object-oriented'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii Preface: Why We Wrote This Book and For It Is Written


    programming whenever we are ready to do so. In fact, this book includes a basic
    introduction to objects.*


    At the same time, because Processing is based on Java, it is usually very similar
    (often identical) in Java in terms of much of its syntax and many of its structures,
    at least in regard to the topics typically covered in an introductory programming
    course. Thus, we have found that students proceed smoothly from programming in
    Processing in a first course to programming in Java in a second course. In general,
    Processing''s syntax and structures carry over to the learning of such programming
    languages as Java, C++, C#, and JavaScript, should you wish to learn any of these
    programming languages after Processing.


    # Why about Python?


    Python is becoming increasingly popular as an introductory programming language.
    However, Python often uses syntax and structures that are somewhat untraditional
    in comparison with other programming languages that a student might also wish
    to learn.


    We have also found that the dynamic typing of variables in language like Python
    is actually easier for students to understand after they have learned the static
    typing of variables in a language like Processing.


    # Why This Book?


    There are a number of very good books about Processing that have already been
    written. However, many of them seem to be geared first and foremost toward the
    creation of visual art. Processing provides powerful capabilities for doing this,
    yet the sophistication of such impressive digital art sometimes comes at the cost
    of increased complexity in the code, potentially confusing a beginning programmer.


    In this book, we focus on using Processing as a language to teach the basics of
    programming to beginners who may have a variety of reasons for wanting to learn
    to program. Thus, we do not attempt to do a wide survey of Processing''s vast
    capabilities for graphical and interactive works. Rather, we use its capabilities
    for graphics and activity in order to create examples that we hope will be simple,
    illustrative, interesting, and perhaps even fun. If your goal in learning to program
    is to create digital art, believe that the foundation this book provides an excellent
    place for you to begin and will prepare you well for other Processing books that
    are more oriented toward digital art. However, if you are eager to learn program
    for reasons other than the creation of digital art, rest assured that this book
    also been written with you in mind.


    It might seem surprising to some that a book about a graphics-oriented programming
    language as Processing includes many examples that use numbers or text as the
    primary output. However, these are used for a variety of reasons. First, numerical
    and textual examples are sometimes easier to understand than graphical ones. Second,
    most


