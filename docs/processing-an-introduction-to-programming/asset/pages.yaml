  md: "We'll start by reading in a month number from the user and storing it in a\
    \ String variable-named input:\n\n```\nimport static javax.swing.JOptionPane.*;\n\
    \nString input;\ninput = showInputDialog(\"Enter month number:\");\n```\n\nRemember\
    \ that we use an input dialog, the input from the user returned to us by the showInputDialog()\
    \ function is always a String value, even when the user enters a numerical value.\
    \ In order, to convert the input from a String value back into the corresponding\
    \ numerical value, we must use the int() or float() function to do so. Here, we'll\
    \ use the int() function for this purpose:\n\n```\nimport static javax.swing.JOptionPane.*;\n\
    \nString input;\ninput = showInputDialog(\"Enter month number:\");\n\nint month;\n\
    month = int(input);\n```\n\nNext, we'll use an if-else-if-else statement to determine\
    \ the number of days, the month number, and then output number of days in the\
    \ console:\n\n```\nimport static javax.swing.JOptionPane.*;\n\nString input;\n\
    input = showInputDialog(\"Enter month number:\");\n\nint month;\nmonth = int(input);\n\
    ```\n\n```\nif (month == 2) {\n    println(\"That month has 28 or 29 days.\");\n\
    } else if (month == 4) || (month == 6) || (month == 9) || (month == 11)) {\n \
