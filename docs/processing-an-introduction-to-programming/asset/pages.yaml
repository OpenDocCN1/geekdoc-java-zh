  md: "Until now, we have been writing our programs in what is known as Processing's\
    \ static mode. However, in order to create and use our own functions, we need\
    \ to work in what is known as Processing's active mode. Our work in active mode\
    \ will always involve defining the special setup() function. To define the setup()\
    \ function, we can start by simply writing\n\n```\nvoid setup()\n{\n}\n```\n\n\
    Then, inside the curly braces, we simply place the sequence of statements that\
    \ we would like to have performed when the setup() function is called. For example,\
    \ to have the setup() function display a greeting in the console, we might add\n\
    \n```\nvoid setup()\n{\n  println(\"Hello!\");\n  println(\"How are you?\");\n\
    }\n```\n\nThese steps for defining the special setup() function is very similar\
    \ to the way that we will define our own functions. However, the setup() function\
    \ is special in the way it is called. As we have seen, normally write an explicit\
    \ call to a function whenever we want that function to perform its predefined\
    \ action. However, in active mode, whenever we run our program, Processing will\
    \ always begin by automatically making a single call to the setup() function.\
    \ In other words, in active mode, when we run our programs, the setup() function\
    \ is where we want to put the statements that make up our main program.\n\nThis\
    \ also means that we can convert any one of the static mode programs we have written\
    \ thus far to an active mode program by placing its statements inside the setup()\
    \ function. When we run this new active version of the program, it will perform\
    \ exactly the same as the static mode version. For example, consider our simplest\
    \ dice-rolling game:\n\n```\nint roll;\nroll = int(random(1, 7));\nprintln(\"\
    Roll \" + roll);\n```\n\nThis program produces a random value from 1 to 6 and\
    \ displays it in the console. For example:\n\nRoll: 5\n\nThis program was written\
    \ in Processing's static mode. In order to convert this program to active mode,\
    \ we can simply place all its statements inside the curly braces at the beginning\
    \ and end of the setup() function:"
