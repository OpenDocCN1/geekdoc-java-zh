  md: "# 196 ■ Processing: An Introduction to Programming\n\nWe can visualize the\
    \ logic of this if statement with the following flowchart:\n\n![](img/d1536b76dc9068b304a24b0563beff53_228_0.png)\n\
    \nSave this RandomDiameter program. We will return to it later in this chapter.\n\
    \n# The if-else Statement\n\nWe have seen that the if statement allows us to specify\
    \ a condition and perform certain individual actions only when condition is true.\
    \ An if-else statement allows us to specify also the actions that we would like\
    \ to perform in the alternative scenario: our condition is not true but is instead\
    \ false.\n\nThe basic structure of the if-else statement is typically\n\n```\n\
    if (condition)\n{\n    Statement(s) to perform if the condition is true\n}\nelse\n\
    {\n    Statement(s) to perform if the condition is false\n}\n```\n\nThis is a\
    \ single Processing statement that now has two clauses: an if clause and an else\
    \ clause.\n\nLet's return to the if statement in our example of simulating the\
    \ rolling of a die that we created our Roll program. This program currently consists\
    \ of the following:\n\n```\nint roll;\nroll = int( random(1, 7) );\nprintln(\"\
    Roll: \" + roll);\n```\n\n```\nif (roll == 6)\n{\n    println(\"You won!\");\n\
    }\n```\n\nWhen the value of roll is equal to 6, the condition of this if statement\
    \ is true. Otherwise, the value of roll is equal to 1, 2, 3, 4, or 5, and the\
    \ condition is false."
  merge: -1
  pgno: 228
