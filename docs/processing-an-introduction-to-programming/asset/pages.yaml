  md: "# 320 ■ Processing: An Introduction to Programming\n\nanother line segment\
    \ will be added at each pixel column, all the way to the right end of the canvas.\
    \ Thus, when we run our program, we see the same console output as before:\n\n\
    ```\n0\n1\n2\n3\n⋮\n252\n253\n254\n255\n```\n\nHowever, the canvas output now\
    \ looks like a single black rectangle:\n\n![](img/d1536b76dc9068b304a24b0563beff53_352_0.png)\n\
    \nThis black rectangle results because a black vertical line segment, one pixel\
    \ wide, has been drawn from the top to the bottom of the canvas in *every* pixel\
    \ column, from column 0 through column 255.\n\nRecall that the `stroke()` function\
    \ sets the stroke color that will be used to draw a point, line segment, or shape\
    \ edge. Thus, as we count from 0 to 255, we can set all three of the RGB values\
    \ of the stroke color to the current value of the `count` variable by inserting\
    \ the following statement:\n\n```\nsize(256, 50);\n\nfor (int count = 0; count\
    \ <= 255; count = count + 1) {\n  println(count);\n  stroke(count, count, count);\n\
    \  line(count, 0, count, 49);\n}\n```\n\nAs a result, the stroke color will no\
    \ longer be black each time a vertical line segment is drawn in a pixel column.\
    \ Rather, the stroke starts at black (0, 0, 0) when count is 0 and moves gradually\
    \ toward white (255, 255, 255) as count progresses to 255. Because the current\
    \ value of count is used for all *three* RGB numbers, each line segment that is\
    \ added at each pixel column is the next shade *lighter* than the grayscale than\
    \ the line segment in the preceding pixel column. Thus, when we run this program,\
    \ we see the same console output as before:\n\n```\n0\n1\n2\n3\n```"
