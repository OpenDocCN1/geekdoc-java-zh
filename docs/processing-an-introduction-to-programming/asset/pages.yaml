  md: "# Creating Counting Loops using the for Statement ■ 313\n\n# Using Equals in\
    \ the Loop Condition\n\nIt is important to notice that omitting or including the\
    \ equals sign (=) in the loop condition of a counting loop often changes the number\
    \ of times that loop is performed. Return to the ForCount program. Let's make\
    \ the following changes to the for statement in our program.\n\n```\nfor (int\
    \ count = 1; count < 5; count = count + 1)\n{\n  println(count);\n}\n```\n\nWhen\
    \ we run this program, we see that it now produces the following console output:\n\
    \n+   1\n2\n3\n4\n\nIn this case, because we used strictly the less than operator\
    \ (<) in our loop condition, the loop condition became false when the value of\
    \ the counter variable reached the value in our loop condition, 5. Thus, the body\
    \ of the for statement was only performed four times, and the value used in our\
    \ loop condition, 5, was not displayed. However, if we add an equals sign to the\
    \ loop condition,\n\n```\nfor (int count = 1; count <= 5; count = count + 1)\n\
    {\n  println(count);\n}\n```\n\nin this case, the loop condition does not become\
    \ false until after the value of the counting variable reaches the value in our\
    \ loop condition, 5. In this case, the loop condition became false only when the\
    \ value of the counting variable became 6. Thus, the value in our loop condition\
    \ was displayed in the console output:\n\n+   1\n2\n3\n4\n5\n\nAs we see here,\
    \ adding the equals sign (=) to the loop condition of a counting loop often results\
    \ in an extra repetition of the statements in the body of that loop.\n\nThus,\
    \ when using a counting loop to count through the series of numbers, if the value\
    \ used in the loop condition is one that we want the loop to reach (in this case,\
    \ 5), then we include the equals sign. On the other hand, if the value used in\
    \ the loop condition is an"
