    However, showInputDialog() is not a void function. Rather, it has a return type
    of String. This means that this function returns a String value to us—specifically,
    whatever String value is entered into the dialog box by the user.


    Remember, whenever we call a function that returns a value, we need to make immediate
    use of that returned value. We have adopted the habit of doing this by assigning
    the returned value to a variable of the same type:


    ```

    variable = function(arguments);

    ```


    In this, in case, let us define a variable of type String input and assign the
    String value returned by the showInputDialog() to this variable:


    ```

    import static javax.swing.JOptionPane.*;

    String input;

    input = showInputDialog("Enter your name:");

    ```


    The String entered by the user is now stored in a String variable, input. As a
    result, we can make further use of this entered String value with this variable.
    For example, if we add the following statement to our program,


    ```

    println("Hello, " + input + "!");

    ```


    then the value entered by the user will be output to the console.

    Our program is now


    ```

    import static javax.swing.JOptionPane.*;

    String input;

    input = showInputDialog("Enter your name:");


    println("Hello, " + input + "!");

    ```'
