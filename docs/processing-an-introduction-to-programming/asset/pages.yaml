  md: '# # Introduction: Welcome to Computer Programming


    Congratulations on your decision to try computer programming!


    Why Learn to Program?


    It may be that programming a computer is something that you aren''t sure you are
    able to do or even want to be able to do. If so, then hope that this book changes
    your mind with providing you with a friendly, straightforward, and solid introduction
    to computer programming.


    Being a computer “user” once meant writing programs for the computer. However,
    the emergence of personal computers in the late 1970s was accompanied by a growth
    in the availability of “application” software, such as word processors and spreadsheet-programs.
    Such software is written for “end users,” who do not need to be computer programmers.
    Thus, the concept of a computer user as a programmer gradually shifted to that
    of someone who still uses software written by others.


    However, there are still some very good reasons for learning about computer programming
    in the current era of computing.


    +   - Learning computer programming teaches you about what software really is.
    Computer software programs may seem complicated and mysterious. However, as you
    gain experience with simpler examples of computer software, you will start to
    understand the fundamental nature of computer software. This is important knowledge,
    given that more and more areas of our lives are affected by computer software.


    +   - Learning computer programming gives insight into what a programmer does.
    Someday, you may find yourself working on a team that includes a computer programmer.
    Knowing something about what is involved in programming is likely to help you
    communicate and collaborate better with programmers.


    +   - Instead of changing to fit the software, you can design how the software
    works. When we use software that other people have written, we are forced to adapt
    our ways of thinking and working to the way that the software has been designed.
    In contrast, when you write your own software, you get to decide what the software
    does and how it works.'
