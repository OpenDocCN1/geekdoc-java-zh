  md: "# 312 ■ Processing: An Introduction to Programming\n\nWe can also count downward\
    \ in a counting loop by decreasing the value of our counter variable. For this,\
    \ we need to initialize our counting variable to the maximum value in our series\
    \ of numbers. For example,\n\n```\nfor (int count = 5;      ) \n```\n\nWe also\
    \ need to change our loop condition so that it checks whether the value of our\
    \ counting variable is greater than or equal to (or simply greater than) the minimum\
    \ value in our series of numbers, for example,\n\n```\nfor (int count = 5; count\
    \ >= 0;      )\n```\n\nImportantly, we use a subtraction in the portion of our\
    \ for statement that modifies the loop counter variable. This is known as decrementing\
    \ the loop counter variable.\n\n```\nfor (int count = 5; count >= 0; count = count\
    \ - 1)\n```\n\nIf we make these changes, our program is now the following:\n\n\
    ```\nfor (int count = 5; count >= 0; count = count - 1)\n{\n  println(count);\n\
    }\n```\n\nWhen we run this program, we see that the for loop now counts from 5\
    \ down to 0 by ones:\n\n+   5\n4\n3\n2\n1\n0\n\nSimilarly, if we make the following\
    \ changes to our program,\n\n```\nfor (int count = 50; count >= 0; count = count\
    \ - 10)\n{\n  println(count);\n}\n```\n\nthen when we run this program, we see\
    \ that the for loop counts from 50 down to 0 by tens:\n\n+   50\n40\n30\n20\n\
    10\n0\n\nsee The ForCount program. We will continue using it in the next section."
