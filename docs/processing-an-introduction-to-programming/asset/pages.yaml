  md: "# 508 ■ Processing: An Introduction to Programming\n\nNext, let's define a\
    \ function in this class of object that will enable us to perform some action\
    \ involving one or more of the attribute variables. A function defined inside\
    \ a class is also known as a method.\n\nEvery Circle object should have a method\
    \ (function) to draw the circle on the canvas using its column, row, and diameter\
    \ attribute variables. We'll define a method named render() to perform this drawing.\
    \ This render() method not need to return a value, so we will declare its return\
    \ type to be void. Also, no parameters are necessary for the render() method (function),\
    \ the three internal attribute variables we defined—column, row, and diameter—provide\
    \ all the information that is needed to draw the circle using a call to the ellipse(),\
    \ and these three variables can be used throughout the entire Circle class. Thus,\
    \ inside the class, we write the definition of the render() method as:\n\n```\n\
    class Circle\n{\n    int column;\n    int row;\n    int diameter;\n\nvoid render()\n\
    {\n    ellipse(column, row, diameter, diameter);\n}\n```\n\nGiven our current\
    \ Circle class definition, every object of type Circle will have a built-in method\
    \ (function) named render(), which, when called, will cause Circle object to be\
    \ rendered on the canvas.\n\nWe now have a Class that contains a general definition\
    \ of what a Circle object is. Thus, we might say that the Circle class provides\
    \ a kind of blueprint for any Circle object that we wish to create.\n\n![](img/d1536b76dc9068b304a24b0563beff53_540_0.png)"
