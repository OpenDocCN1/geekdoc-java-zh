  md: '# Creating void Functions


    Thus far, we have been able to use many void and non-void functions that are built
    into Processing. However, it is also possible for us to create our own void and
    non-void functions. Creating our own functions can provide us with a number of
    benefits, including the following:


    +   - Functions can make our code easier to read.


    +   - Functions allow us to reuse a sequence of statements that, together, comprise
    desirable overall action.


    In this chapter, we will learn how to create what are known as void functions.


    # void Functions


    We have all aware routines that we perform as part of our lives. For example,
    a parent might give a child the instruction,


    “Get ready for school.”


    Both the parent and child understand that this general instruction—“Get ready
    for school”—actually translates into a whole sequence of more specific instructions,
    as as


    +   1) “Get out of bed.”


    +   2) “Take a shower.”


    +   3) “Brush your hair.”


    +   4) “Get dressed.”


    +   5) “Eat breakfast.”


    +   6) “Brush your teeth.”'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# 356 ■ Processing: An Introduction to Programming


    +   7) "Get your backpack."

    8) "Get in the car."


    Because the individual steps of this named routine are predefined, the parent
    can now give the child the general instruction, "Get ready for school." The child
    will then know to perform the corresponding sequence of individual activities
    that, together, comprise the desired overall action that the general instruction
    describes: getting ready for school.


    In Processing, a void function is something similar: it is a sequence of statements
    that has been given a name and will be performed whenever this function is called
    by name.* Performing this sequence of statements comprises the overall action
    that is described by the function''s name.


    As we have seen, Processing has built-in void functions: for example, println().
    Behind the scenes, println() is a void function that is predefined in Processing
    to perform a sequence of steps that, together, comprise the desired overall action
    described by the function''s name: displaying a line of text in the console.


    # void function


    ![](img/d1536b76dc9068b304a24b0563beff53_388_0.png)


    To call one of Processing''s void functions, we simply give the name of the function
    followed by any argument(s) that we are required to supply to this particular
    function. For example, we call the println() function by writing


    ```

    println("Hello");

    ```


    When we run our program and one of Processing''s built-in void functions is called,
    that function always performs the specific overall action it was predefined to
    perform, using the particular argument(s) we supply in the function call. In our
    current example, the println() function will display "Hello" on a line of text
    in the console.


    As we will see, we call void function that we create ourselves in the same manner.
    The key difference is, when a function of our own creation is called, it will
    perform the specific sequence of actions that we have defined.


    # Active Mode: Introducing the setup() Function


    Select File > New to start a new program. Save this program as Active.


    ![](img/d1536b76dc9068b304a24b0563beff53_388_1.png)


    > * A void function is also known as a procedure or subroutine.'
