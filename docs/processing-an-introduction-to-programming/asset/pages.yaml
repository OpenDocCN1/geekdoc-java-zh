  md: '# Processing: An Introduction to Programming


    Processing allows us to work with several types of numeric values. The two most
    commonly used numeric types in Processing are the int type and the float type.


    # Integers: The int Type


    In Processing, whenever we use an integer (negative, zero, or positive), we are
    using with known as an int value.


    An int value can be any integer in the range from -2,147,483,648 to 2,147,483,647
    cannot have a decimal point.* Examples of int values:


    ```

    1

    10

    123456789

    -99

    100

    ```


    # Numbers with Decimal Points: The float Type


    Processing also allows us to work with values that are of the float type.


    A float value is identifiable by its decimal point (also known as a "floating
    point"). A float value can be a much larger positive or negative number than is
    possible for an int value.* Scientific notation is also permitted for float values.
    For example, the float value 1000000.0 can also be written as 1E6 or as 1.0E6
    in scientific notation.


    Examples of float values:


    ```

    10.0

    2.5

    0.3

    -23.25

    5.125

    1.0E10

    ```


    # Arithmetic with int Values and float Values


    Now we have a basic understanding of the int type and the float type, let''s look
    at how we can do arithmetic with these two types of numeric values.


    The operators Processing uses for arithmetic operations are the same as those
    used in many programming languages, spreadsheet software, and on some handheld
    calculators:


    | Multiplication | * |

    | Division | / |


    > * In other words, an int value can be in the range from -2³¹ to 2³¹ - 1.

    † A float value can be in the range from -340,282,347,000,000,000,000,000,000,000,000.0
    to 340,282,347,000,000,000,000,000,000,000,000.0.'
