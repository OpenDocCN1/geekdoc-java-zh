    # boolean Variables


    As we have learned, a Boolean expression always turns out to be either true or
    false. Each of the conditions we have used far in our if statements is an example
    of such a Boolean expression.


    In Processing, we are also allowed to define variables that are of the boolean
    type. For example, suppose we were writing a program to ask the user a true-or-false
    question. We could create a variable to store the correct answer to this true-or-false
    question by writing


    ```

    boolean correctAnswer;

    ```


    A boolean variable is only able to store one of the possible boolean values: true
    or false. Suppose the question we want to ask the user is,


    > “TRUE or FALSE? A tomato is a fruit.”


    The correct answer to this true-and-false question is true. Thus, a program to
    ask the user this question might include the following:


    ```

    boolean correctAnswer;

    correctAnswer = false;

    ```


    Or, suppose the question that we want to ask the user is,


    > “TRUE or FALSE? A peanut is a nut.”


    The correct answer to this true-and-false question is false. Thus, a program to
    ask the user this question might include the following statements:


    ```

    boolean correctAnswer;

    correctAnswer = false;

    ```'
