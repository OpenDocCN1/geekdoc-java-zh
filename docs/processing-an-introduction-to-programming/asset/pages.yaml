  md: '# Repetition with a Loop: The while Statement ■ 257


    ![](img/d1536b76dc9068b304a24b0563beff53_289_0.png)


    Currently, our program consists of the following:


    ```

    int roll;

    roll = int( random(1, 7) );

    printf("Roll: " + roll);

    ```


    When we run this program, we see console output like the following:


    Roll: 2


    If we keep running the program, it is only a matter of time before we see that
    a 6 is rolled:


    Roll: 6


    We can be certain of this because we know that the statement


    ```

    roll = int( random(1, 7) );

    ```


    will eventually assign the roll variable the value 6 if we repeatedly run the
    program.

    Current, our program simulates a single roll of a die. Thus, if we wish to simulate
    multiple rolls of a die, we currently need to rerun the entire program. However,
    suppose we would like to change this program into a game that will automatically
    keep repeat-edly rolling the die as long as the roll is not a 6 (i.e., is a 1,
    2, 3, 4, or 5). Once the roll is a 6, the repetition stops, and the game is over.


    ![](img/d1536b76dc9068b304a24b0563beff53_289_1.png)


    We can visualize the looping action we need with the following flowchart:


    ![](img/d1536b76dc9068b304a24b0563beff53_289_2.png)'
