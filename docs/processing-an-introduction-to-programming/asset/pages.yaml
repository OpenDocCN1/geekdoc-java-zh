  md: '# xxviii Introduction: Welcome to Computer Programming


    You should now be able to view more lines of the console output without having
    to scroll.


    A Processing “Sketch”


    Displaying information in the console, such as our “Hello, World!” greeting, can
    be very useful when programming. However, there is a reason why programs in Processing
    are also called “sketches”: programming in Processing can also involve drawing.


    As you may noticed, when you clicked on the Run button, Processing also opened
    what is called the display window. Within this window is a rectangular gray area
    that we will refer to as the canvas because it can be drawn using Processing functions.


    ![](img/d1536b76dc9068b304a24b0563beff53_28_0.png)


    By default, a Processing sketch will render (generate) a canvas that consists
    of 100 columns of pixels and 100 rows of pixels. A pixel is a small square of
    a single color. In this case, all the pixels that make up the canvas are gray.


    The columns of pixels are numbered from left to right, beginning with zero. Likewise,
    the rows of pixels are numbered from top to bottom, beginning with zero. Thus,
    each pixel has a unique location, described by the column and the row in which
    it is located. For example, the pixel in column 50 and row 50 is near the center
    of the current canvas.


    ![](img/d1536b76dc9068b304a24b0563beff53_28_1.png)


    # Drawing an Ellipse


    Let’s delete our current statement that instructed Processing to display “Hello,
    World!” in the console. The Text Editor area of the Processing window should now
    be empty:


    Now, enter the following into the Text Editor area of the Processing window:


    ```

    ellipse(50, 50, 20, 10);

    ```'
