    # Repeating with the do-while Statement


    Processing provides support for another loop structure that is similar to the
    while loop:

    do-while statement.


    The do-while statement is sometimes called a posttest or test-at-the-bottom loop
    because the condition determines whether the loop will continue is performed after
    the statements in the body of the loop have already been performed. This means
    that the statements in the body of the do-while loop will always be performed
    at least once.


    basic form of the do-while statement is


    ```

    do

    {

    statement(s) to perform repeatedly

    as long as condition is true

    while (condition);

    ```'
