    # Performing Actions a Specified Number of Times with a for Statement: Starry
    Night Example


    We have seen that a common use of a counting loop is to perform a certain action
    specified using logic similar to that of our coin-flipping program, we can generate
    a starry sky. Select File > New to start a new program. Save this program as Stars.


    ![](img/d1536b76dc9068b304a24b0563beff53_361_0.png)


    We''ll start with a 300-pixel by 200-pixel canvas with all the pixels set to black:


    ```

    size(300, 200);

    background(0, 0, 0, 0);

    ```


    Let''s also define a variable to specify the number of stars we would like to
    draw:


    ```

    size(300, 200);

    background(0, 0, 0, 0);


    int stars;

    stars = 10;

    ```


    Next, we''ll construct a for statement that will repeat once for each star we
    would like:


    ```

    size(300, 200);

    background(0, 0, 0, 0);


    int stars;

    stars = 10;

    ```


    ```

    for (int count = 1; count <= stars; count = count + 1)

    {

    }

    ```


    In the body of the for loop, we specify the actions we would like to have repeated.
    We''ll start by setting the stroke color to white:


    ```

    size(300, 200);

    background(0, 0, 0, 0);

    ```'
