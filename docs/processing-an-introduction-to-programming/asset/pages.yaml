    # String Concatenation


    Select File > New to create a new program. Save this new program as Concatenate.


    ![](img/d1536b76dc9068b304a24b0563beff53_148_0.png)


    The symbol used to represent addition, +, represents a different operation when
    the value of String type is involved. When one or both of the operands are of
    type String, the + operator has the effect of joining the operands together into
    a single String value. This operation is known as String concatenation. For example,
    the following operation:


    ```

    "blue" + "berry"

    ```


    produces the following result:


    ```

    "blueberry"

    ```


    Remember, if even one of the operands is of type String, the + operator is interpreted
    as concatenation, and the non-String operand will be converted into a String value
    in order to complete this operation. Thus, the following expression:


    ```

    "May " + 28

    ```


    evaluates to the following:


    ```

    "May 28"

    ```


    We obtain a similar result even if the non-String operand comes first in the operation.
    Thus, the following expression:'
  merge: -1
