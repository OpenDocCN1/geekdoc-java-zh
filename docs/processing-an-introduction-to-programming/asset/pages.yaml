    # Special void Functions in Processing Related to the Mouse and Keyboard


    We have learned about two of Processing''s special functions: setup() and draw().
    If we define a setup() function in a program, this function is automatically called
    once by Processing when we start the program. If we also define a draw() function,
    then this function is automatically called repeatedly by Processing after the
    setup() function is performed.*


    If we define the draw() function, then we also have the option of defining several
    special void() functions in Processing that are related to using the mouse and
    keyboard. The repetition of the draw() function (even if there are no statements
    in its body) keeps Processing “listening” for the occurrence of mouse and keyboard
    events as moving the mouse, pressing a mouse button, or pressing a key on the
    keyboard.


    For example, if we define the mousePressed() function, then each time we press
    the mouse button while the mouse pointer is over the canvas, this function will
    be called once by Processing, and any statements in the body of this function
    will be performed. Processing resumes its repeated calling of the draw() function.
    To illustrate, let''s return to the Circles program and insert the following definition
    of the mousePressed() function that includes a call to the background() function:


    * It is also possible to define the draw() function without defining the setup()
    function.'
