    For example, the following statement:


    ```

    println("May" + 28);

    ```


    produces this output to the console:


    May28


    Notice that a space is not automatically inserted between the items when String
    concatenation is used. Thus, any spaces we would like to separate the items must
    be explicitly included. For example, if we write


    ```

    println("May " + 28);

    ```


    then our items are now separated by a space when they are output to the console:


    May 28


    Similarly, if we would like to use concatenation to output numeric values separated
    by a space, then we can write a statement like the following:


    ```

    println(5 + " " + 28);

    ```


    This statement produces the following output to the console:


    5 28


