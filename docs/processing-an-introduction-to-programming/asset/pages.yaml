  md: '# Repetition with a Loop: The Statement ■ 269


    It can also be the case that both the pixel column and the pixel row of the last
    circle drawn are greater than or equal to 185, as in this sample run of our program:


    ![](img/d1536b76dc9068b304a24b0563beff53_301_0.png)


    ```

    Column: 61 Row: 16

    Column: 18 Row: 89

    Column: 16 Row: 172

    Column: 188 Row: 190

    ```


    In this case, both conditions joined by the logical AND (&&) operation in our
    condition are false.


    ```

    false while ( (column < 185) && (row < 185) )

    ```


    However, remember when two conditions are joined by a logical AND (&&) operation,
    both of the conditions must evaluate to true in order for the result of the &&
    operation to be true. Thus, as soon as the first condition turns out to be false,
    there is no longer any way for the result of the && operation to be true. In fact,
    Processing does not bother to to evaluate the second condition.


    ```

    false while ( (column < 185) && (row < 185) )

    ```


    This is another example of short-circuit evaluation of multiple conditions by
    Processing. Let''s add a variable to keep track of the number of balls that are
    thrown until one misses the target.


    ```

    int score;

    ```


    We''ll initialize this variable to zero as well:


    ```

    score = 0;

    ```'
