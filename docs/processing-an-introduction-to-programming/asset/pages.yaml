  md: "# Conditional Programming with if ■ 199\n\nYou might find it useful to paraphrase\
    \ the word else as “otherwise” when working with if-else statements: “If the condition\
    \ is true, perform these actions; otherwise, perform these other actions.”\n\n\
    Save the Roll program. We will return to it later in this chapter.\n\n# Using\
    \ the if-else Statement: Classifying Ages\n\nSelect File > New to start a new\
    \ program. Save this program as Ages.\n\n![](img/d1536b76dc9068b304a24b0563beff53_231_0.png)\n\
    \nEnter the following statements into this program:\n\n```\nint age;\nage = int(\
    \ random(1, 30) );\nprintln(\"Age: \" + age);\n```\n\nWhen we run this program,\
    \ we see that a randomly chosen integer age from 1 to 29 is displayed in the console:\n\
