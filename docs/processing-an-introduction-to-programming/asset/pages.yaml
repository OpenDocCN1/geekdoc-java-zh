    # Working with Color: RGB


    So far, we have used only three pixel colors when drawing in Processing: black,
    white, and a shade of gray. However, Processing allows us to draw with colors
    as well.


    Colors must be described as numbers in order for computers to be able to work
    with them. One of the most common ways that colors are numbered according to the
    RGB color model, where all colors are described as mixed amounts red (R), green
    (G), and blue (B) light.'
