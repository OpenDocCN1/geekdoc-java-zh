  md: '# Creating Functions That Return A Value ■ 411


    # Creating Our Own Function That Returns a Value


    In Processing, we can create our own non-void functions that return a value. Doing
    so is very similar to creating void functions, but there are also some key differences.


    For example, suppose we once again write a program to simulate rolling a die.
    Select File New to create a new program as RollingFunction.


    ![](img/d1536b76dc9068b304a24b0563beff53_443_0.png)


    As when we create void functions, we need to work in Processing''s active mode
    in create functions that return a value. Thus, let''s begin a definition of the
    setup() function by writing the following:


    ```

    void setup()

    {


    }

    ```


    As before, to simulate rolling a die, we will generate a random integer from 1
    to 6, store this result in a variable, and then display the value of this variable
    in the console. To achieve this, we''ll add the following statements to the body
    of our setup() function:


    ```

    void setup()

    {

    int die;


    die = int( random(1, 7) );


    println(die);

    }

    ```


    When we run this program, we see an integer from 1 to 6 displayed in the console:


    +   4


    However, suppose we want our program to simulate the roll in a game that uses
    five dice. One way to achieve this would be by using five statements in our program:


    ```

    die1 = int( random(1, 7) );

    die2 = int( random(1, 7) );

    die3 = int( random(1, 7) );

    die4 = int( random(1, 7) );

    die5 = int( random(1, 7) );

    ```'
