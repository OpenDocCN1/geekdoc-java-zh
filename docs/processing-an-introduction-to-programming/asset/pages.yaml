    # Functions That Return a Value


    Not all of Processing''s functions are void functions. Processing also has non-void
    functions. These are known simply as **functions**. Such a function is similar
    to a void function in that it is like a little machine that performs a predefined
    action when we call it. However, this kind of function also performs an *extra
    step*: it **returns a resulting value** to us.


    ![](img/d1536b76dc9068b304a24b0563beff53_166_0.png)


    For example, the basic form of the sqrt() function is


    ```

    sqrt(number)

    ```


    The parameter is


    +   -number Any nonnegative value of type float. (Remember: If an int value is
    specified, Processing will automatically convert this integer into a float value.)


    When we call the sqrt() function, it performs its predefined action: it calculates
    the square root of the float argument that we supply to. However, this function
    wouldn''t be very useful if it did not report to us what calculated square root
    is. Unlike a void function, the sqrt() function performs the extra step of *returning*
    to a resulting item of information. In the case of the sqrt() function, this resulting
    item of information is the square root that the function has calculated for us.


    Examples


    ```

    sqrt(9.0) returns 3.0

    sqrt(9) returns 3.0

    sqrt(6.25) returns 2.5

    ```'
