    provides the String type, which allows us to work with a sequence of characters
    at the same time. As we have seen, the first letter of the keywords for the int,
    float, and char types are lowercase. This is because they are examples of what
    are known as primitive types.


    In contrast, the first letter of the keyword for the String type name is always
    capitalized. This is because the String type is an example of a more advanced
    data type known as a class. Each specific String value that we work with is sometimes
    known as a String object.


