    # Summary


    In this chapter, we learned about the powerful principle of selection, which enables
    us to specify actions that we want to be performed when certain conditions are
    true.


    +   - We learned about the basic if statement, as well as its if-else and if-else-if-else
    forms.


    +   - We learned about boolean expressions, such as those used in the condition
    of an if statement, and how to create them using the comparison (relational) operators:
    <,>, >=, ==, and !=.


    +   - We learned how to create compound Boolean expressions using the AND (&&)
    and OR (||) operations.


    +   - We learned about boolean variables and how they can be used to store conditions.


    +   - We learned about the switch statement, which can take the place of if-else-if-else
    structures when mutually exclusive conditions are required.


    +   - We learned about reliably testing for equality of String objects using the
    equals() method.'
