    # Two Kinds of Functions


    We have already used quite variety of Processing''s built-in functions up to this
    point, most of which have pertained to drawing on the canvas. However, all the
    functions we used so far have been examples of what are known as void functions.
    There are actually two main categories of functions in Processing:


    +   1) void functions

    2) (Non-void) functions


    Let''s learn more about both of these kinds of functions.


    # void Functions


    A void function is like a little machine that has a predefined action. We simply
    call the function, supplying any arguments that it needs, and the function will
    perform its defined action for us.


    ![](img/d1536b76dc9068b304a24b0563beff53_164_0.png)


    The keyword void is somewhat cryptic, but don''t worry about it for now. We''ll
    look closely at this term in the next section.


    To call a void function, we use the name of the function along with a pair of
    parentheses enclosing any arguments that are required, followed by a semicolon:


    ```

    function(arguments);

    ```


    For example, whenever we call the size () function, we simply write something
    like


    ```

    size(150, 100);

    ```'
