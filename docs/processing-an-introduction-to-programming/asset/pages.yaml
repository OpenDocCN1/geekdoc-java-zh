  md: "# Counting through a Sequence with a for Statement: Grayscale Example\n\nAs\
    \ we learned, the RGB color model uses a trio of numbers to define a particular\
    \ color: a red amount, a green amount, and a blue amount. Each of these numbers\
    \ is a value from 0 to 255. The RGB numbers for black are 0, 0, 0. The RGB numbers\
    \ for white are 255, 255, 255. Thus, for black and white, all three RGB numbers\
    \ are the same. It turns out, any other set of RGB numbers in which all three\
    \ values are the same describes some shade of gray. For example, given that 127\
    \ is approximately half of 255, the RGB numbers 127, 127, 127 define medium gray,\
    \ between black and white on what is known as a grayscale.\n\nLet's use a for\
    \ statement to draw a similar grayscale. Select File > New to start a new program.\
    \ Save this program as Grayscale.\n\n![](img/d1536b76dc9068b304a24b0563beff53_350_0.png)\n\
    \nWe'll start by setting the size of our canvas:\n\n```\nsize(256, 50);\n```\n\
    \nWe have specified a canvas with a width of 256 pixels.\n\n![](img/d1536b76dc9068b304a24b0563beff53_350_1.png)\n\
    \nThus, the pixel column numbers will run from 0 to 255.\n\n![](img/d1536b76dc9068b304a24b0563beff53_350_2.png)\n\
    \nAdding the following for statement:\n\n```\nsize(256, 50);\n```\n\n```\nfor\
    \ (int count = 0; count <= 255; count = count + 1)\n{\n    printf(count);\n}\n\
    ```"
