  md: '# The float() Function


    Processing also provides the float() function for converting values of another
    primitive type into a value of float type. The basic form of a call to the float()
    function is


    ```

    float(value)

    ```


    The parameter is


    +   - value: The value is to be converted to a float value.

    - Type: a primitive value or a String that resembles a number with decimal places.


    The type of value returned is float.


    The most common use of the float() function is to convert an int value to a float
    value. We can think of this as Processing simply appending .0 onto the end of
    the integer digits.


    Examples


    ```

    float(2)      returns 2.0

    ```


    ```

    float(100)   returns 100.0

    ```


    ```

    float(0)      returns 0.0

    ```


    Using the float() function to convert an int value to a float value provides a
    way to avoid integer division. Examples:


    ```

    3 / 2         evaluates to 1

    ```


    ```

    float(3) / 2  evaluates to values of types other than

    ```


    The float() function can also be used to convert values that are of types other
    than int to an equivalent float value. For example, "98.6" resembles a float value,
    but it is actually a String value. Thus, we cannot use it in an arithmetic operation.
    However, we can use the float() function to convert a String of numerals into
    a corresponding float value:


    ```

    float("98.6")

    ```


    returns the float value 98.6, which can be used in an arithmetic operation.'
