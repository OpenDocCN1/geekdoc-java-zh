  md: "# Commenting/Uncommenting\n\nConsole output each time the body of a loop is\
    \ performed is indeed helpful for tracing the repeating actions of a loop. However,\
    \ if this console output is undesirable once the program is working, these statements\
    \ can easily be changed to comments by putting two forward slashes at the beginning\
    \ of each line. (Remember: Processing ignores anything from these slashes to the\
    \ end of the line.) For example, the following change to our program temporarily\
    \ turns off the displaying of the diameter to the console when the program is:\n\
    \n```\nwhile (diameter < width)\n{\n  // println(diameter);\n  ellipse(width /\
    \ 2, height / 2, diameter, diameter);\n  diameter = diameter + step;\n}\n```\n\
    \nThis is sometimes known as commenting out a line of code, and it is often a\
    \ much better alternative to deleting a line of code. Later, if we wish to reactivate\
    \ this line of code to trace the loop again, we can simply \"comment\" the line\
    \ of code by removing the two forward slashes at the beginning of the line:\n\n\
    ```\nwhile (diameter < width)\n{\n  println(diameter);\n  ellipse(width / 2, height\
    \ / 2, diameter, diameter);\n  diameter = diameter + step;\n}\n```\n\nIn fact,\
    \ Processing makes it easy to turn on or off the commenting for one or more lines\
    \ of code simply by selecting the line(s) of code and then choosing Comment/Uncomment\
    \ from the Edit menu or by using the keyboard shortcut:\n\n```\nCtrl/\n```\n\n\
    Save and close the Concentric program.\n\n# Using the while Statement: An Interactive\
