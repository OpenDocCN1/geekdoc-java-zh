    # Drawing Arcs: The arc() Function


    Processing’s arc() function allows us to draw portions of ellipses.

    Recall that the basic form of the ellipse() function is


    ```

    ellipse(column, row, width, height);

    ```


    in which the four parameters are


    | column | The pixel column location of the ellipse''s center |

    | row | The pixel row location of the ellipse''s center |

    | width | The width of the ellipse in pixels |

    | height | The height of the ellipse in pixels |


    Thus, the call to the ellipse() function in the following program,


    ```

    size(150, 200);

    elipse(50, 60, 90, 75);

    ```


    draws an ellipse with its center located at column 50 and row 60, a width of 90
    pixels, and a height of 75 pixels:


    ![](img/d1536b76dc9068b304a24b0563beff53_58_1.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Basic Drawing in Processing 27


    The first four parameters of the arc() function are the same as those of the ellipse()
    function. However, there are two additional parameters, a starting angle and an
    ending angle, which specify the portion of the ellipse that is to be drawn.


    The angle measures for the starting and ending angle must be given in radians
    rather than degrees. Fortunately, Processing provides a radians() for converting
    degrees to radians.


    It is also important to note that the angle measures proceed in a clockwise manner,
    the reverse of the counterclockwise direction you may have learned in math class.


    ![](img/d1536b76dc9068b304a24b0563beff53_59_0.png)


    For example, let''s change our call to the ellipse() function to the following
    call to the arc() function simply by changing the function name and by adding
    a starting angle and an ending angle, respectively:


    ```

    size(150, 200);

    arc(50, 60, 90, 75, radians(90), radians(180));

    ```


    Note that we were able to specify our two angles using degrees, converting each
    angle measurement using the radians() function. As a result, there are now two
    calls to the radians() function inside our call to the arc() function. We are
    allowed to do this! Inserting a call to a function inside another call to a function
    like this is known as "nesting" function calls.


    When we run our program, we now see the following result:


    ![](img/d1536b76dc9068b304a24b0563beff53_59_1.png)


    > * This is because we consider the columns and rows of pixels on the canvas to
    be like the x and y axes in geometry, then the y axis is "ups down" in comparison
    with geometry, because we move downward on the canvas rather than upward as the
    y values increase.'
