    # Variable Names


    A variable is a storage location that has been given a name, and it is important
    that the name we give each variable is an appropriate one.


    In Processing, a variable must begin with a letter. The most common practice is
    to make this first letter a lowercase letter. The characters that follow this
    first letter can be letters, numbers, or underscores.


    Examples of variable names that can be used


    ```

    side

    side2

    side_2

    side_length

    sideLength

    ```


    Examples of variable names that cannot be used


    +   - 7days Must begin with a letter

    - side length Must not contain a space

    - side-length Must not contain an operator (-)'
