  md: "```\nfor (int i = 0; i < dice.length; i = i + 1) {\n  dice[i] = int ( random(1,\
    \ 7) );\n}\n```\n\nHowever, for beginning programmers, descriptive variable names\
    \ are usually the better choice, rather than single-letter variable names.\n\n\
    # Increment (++) and Decrement--) Operators\n\nMost often, when we write statements,\
    \ we increment the loop counter variable by 1 each time the loop repeats. In such\
    \ cases, we write the first line of a loop as\n\n```\nfor (int count = 0; count\
    \ < 5; count = count + 1)\n```\n\nTo increase the value of a variable by 1, Processing\
    \ provides the increment operator:\n\n```\n++\n```\n\nThus, the first line of\
    \ the preceding statement can also be written:\n\n```\nfor (int count = 0; count\
    \ < 5; count++)\n```\n\nSimilarly, to decrease the value of a variable by 1, Processing\
    \ provides the decrement operator:\n\n```\n--\n```\n\nFor example, to count downward\
    \ by ones in a for , loop we can write the first line of such a statement\n\n\
    ```\nfor (int count = 5; count > 0; count = count - 1)\n```\n\nOr, we can use\
    \ the decrement operator and write\n\n```\nfor (int count = 5; count > 0; count--)\n\
    ```\n\nExperienced programmers often favor the use of these shortcut operators.\
    \ However, this may make the code less readable for less experienced programmers.\
    \ Also, the use of these operators can sometimes lead experienced programmers\
    \ to forget that it is possible to increment or decrement the loop counter by\
    \ amounts other than 1. Moreover, there are aspects of these two operators that\
    \ can make them tricky when they are used outside of for statements. For all these\
    \ reasons, we have not used the increment and decrement operators in this book."
