  md: '# Basic Drawing in Processing 9


    Let''s take a closer look at our use of the size() function. When we use a function
    in a statement like this, we say we call this function. Like most functions, the
    size() function requires some information from us in order for it to be able to
    operate when we call it. We put inside the parentheses that follow the name of
    the function. Such a required item of information is known as a parameter. The
    item supplied by us to fulfill this requirement is known as an argument. In other
    words, for each required parameter, we need to supply a corresponding argument.


    The size() has two required parameters, so we need to supply two corresponding
    arguments: the desired pixel width and the desired pixel height, listed in that
    order, separated by commas.


    Thus, the basic form of a call to the size() function could be described in this
    way:


    ```

    size(width, height);

    ```


