  md: '# More about Using Processing’s Built-In Functions


    In this chapter, we will continue to learn about Processing’s built-in functions.
    We will see just how useful these particular functions are, and we will also learn
    more about the nature of functions in general.


    **More about Console Output: The print() and println() Functions**

    Select **File > New** to start a new program. Save this new program as **Console**.


    As we have seen, the println() function is very useful for displaying a line of
    information in the console. For example, the following program:


    ```

    println("May");

    println(28);

    ```


    produces the following output to the console:


    ```

    May

    28

    ```


    Processing also provides the **print()** function for displaying output to the
    console without advancing to a new line. For example, the following program:


    ```

    print("May ");

    println(28);

    ```'
