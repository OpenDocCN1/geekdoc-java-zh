  md: '# Foreword


    In the summer of 2008, I was invited to present at an NSF-sponsored CPATH workshop
    at La Salle University in Philadelphia. The title of the workshop was Revitalizing
    Computer Science Education through the Science of Digital Media. My first book
    on Processing had been recently published, and my talk introduced the Processing
    language and environment. I also discussed my journey from painter to coder. One
    workshop attendee seemed especially animated during my talk, and his enthusiasm
    led to a very lively group discussion. This was my first encounter with Jeff Nyhoff.


    Jeff like me is a hybrid, with a background in the arts (theater) and computing.
    Clearly, what excited Jeff during my talk was discovering another kindred spirit;
    at the time there were far less of us in academia (at least out in the open).
    Jeff and I are both fascinated by the connections we see between coding and arts
    practice; this intersection is now commonly referred to as “creative coding.”
    Rather than seeing two disparate disparate—sometimes called extreme opposite,
    bifurcated left and right brain activities—we also understand (and probably sane)
    people won''t come to this conclusion on their own. Thus, we both worked to spread
    the creative coding gospel, which has led to our common mission, and the ultimate
    purpose of this wonderful new book: radically change how computing is taught.


    I''m not sure if Jeff''s initial exposure to Processing, he instantly recognized
    its elegance and ultimate usefulness, especially for introductory computing education—something
    that its creators, Ben Fry and Casey Rees, didn''t really consider outside of
    the arts context. Jeff and remained in email contact after the workshop, and a
    few years later, at the annual computer science educators'' conference (SIGCSE),
    we met again in person. It was Larry Nyhoff, Larry was warm, cordial, and humble,
    and at first I didn''t realize Jeff and Larry''s professional connection beyond
    father and son. Through Jeff, Larry knew of me and my work, and too seemed excited
    by the possibilities Processing offered for the classroom. I left that clueless
    as I had been speaking to a true computing educator legend.


    Learning more about Larry gave me greater insight into how Jeff, the teacher major,
    became a computer science professor. Larry taught computer science for over 40
    years at Calvin College and is the author or co-author of over 30 books, spanning
    many facets of computer science, as well as related (and aggregate) disciplines.
    Larry''s books teach numerous programming languages and the aggregate of his publishing
    efforts'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'literally represents the history of modern computing education. The Processing
    literature has gotten a lot more respectable thanks to Larry''s participation.


    Jeff and Larry are deeply committed educators who have been willing to bring a
    critical, albeit loving, eye to their own discipline, especially around issues
    of pedagogy. I remember receiving many impassioned emails from Jeff discussing
    his excitement about Processing and CS pedagogy, but also his frustration with
    the established community''s initial hesitant adopting embracing change. It was
    inspiring to find someone so committed to helping students, literally all students,
    learn to code. This is why I am specially excited to learn Jeff and Larry writing
    their own book on Processing.


    The Nyhoffs'' book arrives as Processing enters a very stable and mature form.
    This was certainly not the case for me when I began my book, back in 2004 when
    Processing was still a messy work in progress. Processing 3 is now a very stable,
    professional-grade code library and programming environment that is perfectly
    suited for use within the CS classroom and beyond. Yet, in spite of Processing''s
    success and growing mainstream awareness, there are still very few Processing
    books designed specifically for the CS classroom. Processing''s legacy is the
    arts and design community, and most of the existing Processing literature supports
    this population. The book Creative Coding and Generative Art 2, of which I am
    a co-author, was designed for the CS classroom, with a concentration on visual
    and graphic examples. This approach works well for some populations, but not all.
    And this is where Jeff'' and Larry''s book comes to the rescue.


    The Nyhoffs'' new book directly targets the CS classroom in a way that no other
    Processing book does. The other books, including my own, unabashedly depart from
    traditional text-based examples found in almost all other introductory programming
    texts. In our defense, initiating change sometimes requires a small revolution.
    However, Jeff and Larry present a much less reactionary approach, integrating
    many of the wonderful things about Processing with traditional approaches that
    have worked well in CS pedagogy. Not only is their approach sensible and efficient,
    it is also likely to offer greater comfort to existing CS instructors (who perhaps
    do not have degrees in theater or painting).


    It is this effort of considerable integration—of the old tried and true and improved—that
    I believe has the greatest chance of tipping the balance for Processing''s use
    in the computing classroom.


    Ira Greenberg

    Dallas, Texas'
