  md: '# Processing; An Introduction to Programming


    Processing does not itself contain functions for creating and using dialog boxes.
    However, because Processing is based on Java, we are able to make some use of
    Java’s capability for dialog boxes. In order to do this, we just need to insert
    a special statement that has a reference to the Java "package" that contains these
    functions.


    Unfortunately, this statement that we need to insert is a cryptic one. However,
    please don''t be alarmed by it. You don''t need to try to understand or memorize
    the syntax of this statement. It will be used occasionally in this book, and on
    those occasions, it will be written out for you. Just think of this statement
    as something like a necessary recipe ingredient that happens to have a complicated
    name. Here is the single statement that we need to add to the first line of our
    program in order to be able to use dialog boxes:


    ```

    import static javax.swing.JOptionPane.*;

    ```


    Yes, it''s a nuisance to type in such a cryptic statement. However, the resulting
    capability we gain for creating and using dialog boxes is well worth the nuisance
    of adding this one line of code. Honestly, whenever we do use this statement,
    you can just type it and never again. Also, rest assured, that there are no other
    Java-specific programming elements in this book. After all, this is a book about
    Processing, not about Java. Perhaps someday, a simpler way to create and use dialog
    boxes will be built into Processing.


    # Using a Dialog Box: The showInputDialog() Function


    Processing does not provide a function for inputting a value from the console.
    However, now that we have added the import statement, we are able to obtain input
    from the user through a dialog box by means of showInputDialog() function. The
    basic form of a call to the showInputDialog() function is


    ```

    showInputDialog(prompt);

    ```


    The parameter is


    prompt The message displayed by showInputDialog() is String. Any, but usually
    a String.


    The value returned by showInputDialog() is String. For example, consider the following
    program:


    When we run this program, an input dialog box appears on the screen:


    > * In Java, a function is typically known as a "method."'
