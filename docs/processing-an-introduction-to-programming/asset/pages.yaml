  md: 'The definition of the function header is now complete:


    ```

    void balloon()

    ```


    We define the function *body*, enclosed between a pair of curly braces:


    ```

    void balloon()

    {

    }

    ```


    The balloon drawn by the balloon() function will consist of simply a circle and
    a line segment. Let''s define and initialize two variables to store (1) the length
    of the line segment (the balloon''s string) and (2) the diameter of the balloon
    itself. The values of these two variables won''t change during our program, but
    using variables will make our code more readable than if we use "magic numbers"
    (unexplained specific values). Also, to keep our code a little concise in this
    example, let''s take advantage of the option of declaring and initializing each
    of these variables in a single statement:


    ```

    void balloon()

    {

    int length = 50;

    int diameter = 20;

    }

    ```


    For now, we''ll pick both the pixel *column* and the pixel *row* of the center
    of the balloon. These pixel column location and pixel row locations must be stored
    in variables, because, as we''ll see, we need to use this pair of variables *twice*:
    first to draw the circle (balloon) and then draw the line segment (the balloon''s
    string). Here, too, let''s declare each of these variables and assign each random
    value in a single statement:


    ```

    void balloon()

    {

    int length = 50;

    int diameter = 20;

    int column = int(random(width));

    int row = int(random(height));

    }

    ```


    All of these variables (line, diameter, column, and row) are examples of what
    are known as *local* variables. The *scope* (range of use) of a local variable
    is limited to the statement (defined by a pair of curly braces) in which that
    variable is declared. Thus, in this particular case, none of these local variables
    can be used outside of the `balloon()` function. However, this does not pose any
    problem for us, because we will only be using these variables for the very specific
    task that we are defining this function to perform: drawing a balloon at a random
    pixel location.'
