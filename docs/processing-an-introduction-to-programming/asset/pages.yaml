  md: "# Creating Counting Loops Using the for Statement ■ 325\n\n```\nint heads;\n\
    heads = 0;\nint tails;\ntails = 0;\n```\n\nWe simulate a flip of a coin by picking\
    \ a 1 or a 2 at random, with a 1 counting as a \"heads\" result and a 2 counting\
    \ as a \"tails\" result. Thus, we will also need a variable in which to store\
    \ this random value representing the coin flip:\n\n```\nint total;\ntotal = 10;\n\
    int heads;\nheads = 0;\nint tails;\ntails = 0;\nint flip;\n```\n\nNext, let's\
    \ construct our for statement. In order to count from 1 up to the total number\
    \ of times we wish to flip, we can write\n\n```\nint total;\ntotal = 10;\nint\
    \ heads;\nheads = 0;\nint tails;\ntails = 0;\nint flip;\n```\n\n```\nfor (int\
