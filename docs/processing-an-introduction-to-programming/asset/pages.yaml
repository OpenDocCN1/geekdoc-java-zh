  md: "A class definition begins with the keyword `class`, followed by the `name`\
    \ of the type of object we are creating. The first letter of a class name should\
    \ be capitalized. Thus, we begin our definition of a `Circle` class by adding\
    \ the following statement to our program `after` the `setup()` function:\n\n```\n\
    class Circle\n```\n\nThe body of the class definition that follows must be enclosed\
    \ inside a pair of curly braces. Thus, our program is now\n\n```\nvoid setup()\n\
    {\n  size(200, 200);\n}\n```\n\n```\nclass Circle\n{\n}\n```\n\nNext, we'll define\
    \ the `variables` for the class `attributes`, the items of information about this\
    \ new kind of object we wish to store. Each `Circle` object should have\n\n+ \
    \  - A variable to store the pixel `column` of its center\n- A variable to store\
    \ the pixel `row` of its center\n- A variable to store its `diameter`\n\nThus,\
    \ inside the class body, we declare three variables for these attributes:\n\n\
    ```\nclass Circle\n{\n  int column;\n  int row;\n  int diameter;\n}\n```\n\nAs\
    \ a result, `every` object of type `Circle` will now have these three attribute\
    \ variables: a `column`, a `row`, and a `diameter`. **The scope of any attribute\
    \ variable in a class is the entire class.** Thus, these three variables may be\
    \ used throughout the entire `Circle` class definition.\n\n> * This is why String\
    \ is always capitalized."
