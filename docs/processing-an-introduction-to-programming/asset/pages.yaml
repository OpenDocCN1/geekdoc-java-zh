  md: "# Repetition with a Loop: The while Statement ■ 261\n\n```\nwhile (roll !=\
    \ 6) {\n    roll = int( random(1, 7) );\n    print(\"Roll again: \" + roll)\n\
    }\n```\n\nIf the condition is still true, then all the statements in the body\
    \ of the loop are performed again. Then the loop is evaluated to see if it is\
    \ still true. This cycle of evaluating the loop's test condition and performing\
    \ the statements in the body of the loop continues, as long as the condition remains\
    \ true. However, as soon as this condition becomes false, the statements in the\
    \ body of the loop are not performed, and the while statement is complete. Processing\
    \ moves on to the next (if) any that immediately follows the while statement.\
    \ Thus, when we run our current program, the statements in the body of the loop\
    \ continue to be performed repeatedly, as long as the condition is true—that is,\
    \ as long as the roll is not a 6. However, as soon as the value of roll becomes\
    \ a 6, the while statement is complete, and Processing moves on to the next statement—i.e.,\
    \ the one displays “Game Over!” in the console.\n\n+   - First roll: 2\n- Roll\
    \ again: 3\n- Roll again: 4\n- Roll again: 2\n- Roll again: 6 ← Roll was a 6,\
    \ so the while loop ended\nGame Over!\n\nWe cannot predict in advance how many\
    \ times this particular while loop will be performed. For this reason, this while\
    \ loop is an example of what is known as an indefinite loop. For example, the\
    \ next time we run our program, we might see the following console output:\n\n\
    +   - First roll: 3\n- Roll again: 1\n- Roll again: 5\n- Roll again: 6\nGame Over!\n\
    \nIn this sample run of our program, the while loop was performed only three times\
    \ before a 6 was rolled, stopping the loop.\nSometimes, when we run our program,\
    \ the first roll is a 6. When this happens, we see only the following console\
    \ output:\n\n+   - First roll: 6\nGame Over!"
