  md: "# Checking Equality: float Values\n\nBecause of the imprecision which computers\
    \ store fractions, we have to be careful about testing for equality of float values.\
    \ For example, consider the following program:\n\n```\nfloat first;\nfirst = 1.0;\n\
    \nfloat second;\nsecond = 0.99999999;\n\nif (first == second) {\n    println(\"\
    Equal!\");\n}\n```\n\nIf we run this program, the output to the console is\n\n\
    Equal!\n\nHowever, we can see that the float values stored in these two variables\
    \ are not equal. Whenever possible, use greater than (>), greater than equal to\
    \ (>=), less than (<), less than or equal to (<=) operators when comparing float\
    \ values.\n\n# Checking Equality: String Objects\n\nTesting whether String values\
    \ are equal requires us to adopt special measures. Select File > New to start\
    \ a new program. Save this program as StringEquals.\n\nEnter the following statements\
    \ into the program:\n\n```\nimport static javax.swing.JOptionPane.*;\nnString\
    \ day;\nday = showInputDialog(\"Enter the first day of the week:\");\n\nprintln(\"\
    You entered: \" + day);\n```\n\nWhen we run this program and enter a day of the\
    \ week,\n\n![](img/d1536b76dc9068b304a24b0563beff53_275_0.png)"
