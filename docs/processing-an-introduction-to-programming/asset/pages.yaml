  md: 'The setup() function does not return a resulting value to us when it is finished.
    In Processing terminology, this means that it is a void function. Thus, the return
    type is specified as void in the function header.


    2) The function’s name.


    ```

    name of function

    ↓

    void setup()

    {


    }

    ```


    The function name is the next item added to the function header. The name of this
    function is “setup.” The first letter of a function name is typically a lowercase
    letter.


    3) The function’s required parameters, enclosed in a pair of parentheses.


    ```

    parameters

    ↓

    void setup()

    {


    }

    ```


    As we will see later in this chapter, parameters are variables that store any
    values that need to be sent to this function as arguments whenever it is called.
    The setup() function does not have any required parameter variables, so we simply
    add an empty pair of parentheses to the function header.


    Thus, the three items of information that comprise the header of a function definition
    are


    +   1) The type of value returned

    2) The name of the function

    3) The parameters required


    ```

    type of value returned name parameters

    ↓ ↓

    void setup() ← header

    {


    }

    ```'
