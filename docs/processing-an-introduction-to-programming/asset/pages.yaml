    # Evaluating Expressions


    When we combine two or more operands and one or more arithmetic operators, we
    produce what is known as an arithmetic expression.


    Examples


    ```

    5 * 2

    5 * 2 * 3

    10.1 + 4.5

    8 - 5 - 2

    ```


    Working out the result of an expression is also known as evaluating that expression,
    because it produces a single value as a result.


    Examples


    ```

    5 * 2 evaluates to 10

    5 * 2 * 3 evaluates to 30

    10.1 + 4.5 evaluates to 14.6

    8 - 5 - 2 evaluates to 1

    ```


    As we have seen, we can use the println() function to test the evaluation of expressions.
    For example, if we enter the following


    ```

    println(8 - 5 - 2);

    ```


    into the Text Editor area of the Processing window and then run this one-line
    program, Processing will evaluate the expression and display the resulting value.
    Thus, in this particular case, we see the following resulting value out to the
    console:


    1


    This output confirms that the expression 8 - 5 - 2 does indeed evaluate to 1 in
    Processing.


    # Order of Operations


    In class, you may have learned a “PEMDAS” acronym (e.g., “Please Excuse My Dear
    Aunt Sally”) to help you remember the order in which the operations in an arithmetic
    expression are performed: Parentheses, Exponents, Multiplication, Addition, Subtraction.
    These rules for the order in which the arithmetic operations are performed are
    also known as operator precedence.'
