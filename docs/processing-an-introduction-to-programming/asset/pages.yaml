  md: '# Introduction: Welcome to Computer Programming ■ xv


    # A Tour of Processing


    We will give a more detailed introduction to Processing in the first chapter,
    but let''s start here with a brief tour of Processing that will give you a little
    taste of what it''s like and where we''re headed in this book Do not worry if
    you do not understand all the details that are presented in this tour; everything
    in this introduction will be explained more fully in the coming chapters.


    Processing is an open-source project. It can be downloaded for free https://processing.org
    and is available for Windows, Mac, and computers.


    When you are processing, what is it? Processing''s integrated development environment
    or IDE:


    ![](img/d1536b76dc9068b304a24b0563beff53_25_0.png)


    An IDE is simply a software environment in which you can develop and test programs.
    Compared with most IDEs, the Processing IDE is much simpler to use. Officially,
    the Processing IDE is known as the “Processing development environment” or PDE.
    Here in the PDE, you can enter programs and have Processing execute them.


