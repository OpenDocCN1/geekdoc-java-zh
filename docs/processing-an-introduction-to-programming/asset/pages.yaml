    | | $10^{-1}$ | $10^{-2}$ |


    Rather, there is simply no way to combine quantities of these decimal fractions
    in a way that is exactly equal to one-third:


    | 0. | 3 | 3 | 3 | ... |

    |---|---|---|---|---||

    | 10ths | 100ths | 1000ths |

    | ↑ | ↑ | ↑ |

    | | $10^{-1}$ | $10^{-2}$ | $10^{-3}$ |


    Rather, the result is a repeating decimal digit, which is sometimes written as


    | 0. | 3 |

