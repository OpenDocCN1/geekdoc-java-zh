    # The Logical NOT (!) Operator


    Processing uses the exclamation point (!) as the logical NOT operator. This operator
    can be used to create the logical opposite (also known as the negation) of a boolean
    value, variable, or expression. For example, suppose the value stored in the roll
    variable is 5. If so, then the boolean expression


    ```

    (roll > 3)

    ```


    evaluates to the boolean value true. The logical NOT operation (!) always produces
    the logical opposite (negation) of any boolean expression that follows it. Thus,
    if the value of roll is 5, then the expression


    ```

    roll > 3)

    ```


    evaluates to false.


    # Using NOT (!) With a while Loop’s Stop Condition


    Processing while statement asks us to think of a repeating loop in terms of “long
    as” rather than in terms of “until”. In other words, we need to think in terms
    of the condition when we are looping to continue. continue.


    However, it is easier to think of a particular loop in terms of repeating a certain
    action until a condition is true. In such cases, rather than thinking of when
    we would like the loop to continue, we are thinking instead of the condition we
    would like the loop to stop. The logical NOT (!) operation can be used to create
    such while loops.


    Let’s return to our RollWhile program. Select File > Save As and resave this program
    as RollWhileNot.'
