    +   - Processing sets aside locations in the computer''s memory for a new array
    of six float values.

    - Processing stores in the temperatures variable the address in the computer''s
    memory where this new array is located.

    - Processing initializes all elements in this new array to 0.0, the default value
    for a float array.


