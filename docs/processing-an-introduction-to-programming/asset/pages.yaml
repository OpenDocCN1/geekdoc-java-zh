    # The random() Function


    The random() function enables us to pick a random number from a range of values.
    The function is often very useful when creating a simulation, a game, or an animation.
    The basic form of a call to the random() function is


    ```

    random(minimum, maximum)

    ```


    The parameters are


    +   **minimum**: The minimum number for the range. Type: float . If this argument
    is omitted, the minimum is assumed to be zero.

    - **maximum**: The maximum number for the range. Type: float.

    The random number chosen will be greater than or equal to minimum but strictly
    less than maximum.


    ![](img/d1536b76dc9068b304a24b0563beff53_177_0.png)


    The type of value returned is float.

    Let''s clarify the use of the random() function with some examples. The call to
    the random() function


    ```

    random(1, 10)

    ```


    will generate and return to us a random float value that is greater than or equal
    to 1 but strictly less than 10. In other words


    ```

    random(0, 20)

    ```


    will generate and return to us a random float value that is greater than or equal
    to 0 but strictly less than 20. In other words, the random float value chosen
    for us will be some value in the range (and including) 0 up to (but not including)
    20.

    As noted above, when the minimum value is zero, we are allowed to omit the first
    argument. Thus, the previous function call can also be written as


    ```

    random(20)

    ```'
