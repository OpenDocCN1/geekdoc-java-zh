  md: 'A while statement will enable us to produce this same game action in our program.
    Let''s start by adding to our program the code shown below, which provides the
    overall structure of the while statement:


    ```

    int roll;

    roll = int ( random(1, 7) );

    println("Roll: " + roll);


    while ( )

    {}

    ```


    Next, inside the pair of parentheses, we need to specify the condition that will
    allow the repetition of the while loop:


    ```

    while ( condition )

    {}

    ```


    When trying to determine the loop condition that is needed, it can be helpful
    to paraphrase the word **while** with **“as long as.”** In other words, the while
    loop will continue to perform the tests it contains *as long as* this loop''s
    condition is *true*. For our game example, we want to continue simulating another
    roll of the die *while (as long as)* the current roll is 1, 2, 3, 4, or 5—in other
    words, as long as the roll is not a 6. We can write this code for continuing as


    ```

    roll != 6

    ```


    When we update our while statement to use this condition, we now have the following:


    ```

    int roll;

    roll = int ( random(1, 7) );

    println("Roll: " + roll);


    while (roll != 6)

    {}

    ```


    Next, between the pair of curly braces, we must specify what is known as the **body**
    of the while loop.'
