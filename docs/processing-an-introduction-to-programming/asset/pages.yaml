    # Using the while Statement: A Counting Loop to Draw Concentric Circles


    Let''s use a while statement to draw some concentric circles with gradually increasing
    diameters. Select File > New to start a new program. Save this program as Concentric.


    ![](img/d1536b76dc9068b304a24b0563beff53_311_0.png)


    We''ll set our canvas size to be 150 pixels by 150 pixels:


    ```

    size(150, 150);

    ```


    We''ll need a variable to keep track of the changing diameter of the circles.
    Let''s set the initial diameter to 20 pixels.


    ```

    int diameter;

    diameter = 20;

    ```


    We will also use a named step to keep track of the amount by which the diameter
    of the circle will increase each time. We''ll set the initial step to 10 pixels.
    (Using a variable also makes it easy to change this step size, if we ever decide
    to do so)


    ```

    int step;

    step = 10;

    ```


    Let''s turn off the filling of the circles we will draw and set the stroke weight
    to 3 pixels.


    ```

    noFill();nstrokeWeight(3);

    ```


    We''ll add statements to display the diameter to the console and to draw a circle
    with the current diameter in the center of our canvas:


    ```

    println(diameter);

    elipse(width / 2, height / 2, diameter, diameter);

    ```


    Our program is now


    ```

    size(150, 150);

    ```


    ```

    int diameter;

    diameter = 20;

    ```


    ```

    int step;

    step = 10;

    ```'
