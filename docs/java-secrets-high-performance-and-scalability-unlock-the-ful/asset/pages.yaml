    # 1.2 - Java Virtual Machine (JVM)


    Explains the JVM''s role in executing Java applications.


    The Java Virtual Machine (JVM) is the core component of the Java platform that
    allows Java applications to execute on any system without modification. It serves
    as the runtime environment that abstracts the hardware and operating system, enabling
    Java’s platform independence. The JVM takes Java bytecode, verifies it, and executes
    it, either by interpreting it line-by-line or by compiling it into native machine
    code using Just-In-Time (JIT) compilation.


