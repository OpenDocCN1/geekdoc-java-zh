    file is what the JVM reads and executes.


    Next, you can execute the program using the Java interpreter:


    ```

    1 java HelloWorld

    ```


    The `java` command loads the `HelloWorld.class` file into the JVM, which then
    runs the program. This separation between the source code and machine code enables
    Java’s portability.


