  md: 'Java achieves platform independence through its **write once, run anywhere**
    principle. This is made possible by Java’s architecture, which uses the **Java
    Virtual Machine (JVM)**, **bytecode**, and the **Java Runtime Environment (JRE)**.
    Instead of compiling Java programs into machine-specific code, the Java compiler
    produces an intermediate format called **bytecode**. This bytecode can be executed
    on any machine that has a JVM, regardless of the underlying hardware or operating
    system.


    # ### Bytecode and JVM: Core of Platform Independence


    When a Java program is compiled, the **javac** compiler converts the source code
    into **bytecode**. Bytecode is platform-independent and can run on any JVM. The
    JVM acts as an abstraction layer that translates the bytecode into machine-specific
    instructions during runtime.


    Here is an example program to demonstrate the role of bytecode and JVM:


    ```

