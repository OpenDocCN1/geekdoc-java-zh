- img_proc: true
  md: 'The G1 (Garbage-First) Garbage Collector is a low-pause garbage collector introduced
    in Java 7 and made the default GC starting from Java 9. It is designed to provide
    consistent and predictable pause times while handling large heaps. The G1 GC divides
    the heap into fixed-size regions instead of contiguous spaces like the traditional
    generational garbage collectors. It prioritizes collecting regions with the most
    garbage, hence the name **Garbage-First**.


    The heap in the G1 GC is logically divided into **Young Generation** and **Old
    Generation**, but these are represented as a set of regions rather than contiguous
    spaces. G1 performs both **Minor GCs** (on Young Generation regions) and **Mixed
    GCs**, which collect garbage from both Young and Old regions.


    The key features of G1 GC include:


    +   1. **Region-Based Memory Management**: The heap is divided into multiple regions
    of equal size, making memory management flexible and efficient.


    +   2. **Garbage-First Strategy**: G1 prioritizes regions with the most garbage,
    ensuring efficient reclamation.


    +   3. **Predictable Pause Times**: G1 aims to meet user-defined pause time goals
    using the `MaxGCPauseMillis` parameter.


    +   4. **Concurrent Compaction**: G1 performs compaction during the GC process,
    eliminating heap fragmentation.'
