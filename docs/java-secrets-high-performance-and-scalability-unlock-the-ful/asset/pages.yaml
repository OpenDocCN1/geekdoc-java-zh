  md: '# 2.2.1 - Heap Memory


    Description of Java''s heap memory and its role in object storage.


    Java''s heap memory is the primary area where objects are stored during the execution
    of a program. Managed by the Java Virtual Machine (JVM), the heap is shared among
    all threads and grows dynamically as the program requires more memory. When an
    object is created using the `new` keyword, it is allocated in the heap. The heap
    memory is automatically managed by the garbage collector, which removes unused
    objects to free up space.


    The heap is divided into different generations as part of Java''s **Generational
    Garbage Collection** strategy.


    +   ** **Young Generation**: Newly created objects are allocated here. It includes:

    - **Eden Space**: Where most objects are initially created.

    - **Survivor Spaces (S0 and S1)**: Where objects that survive the initial garbage
    collection are moved.


    +   ** **Old Generation (Tenured)**: Long-lived objects that survive multiple
    garbage collection cycles are moved to the Old Generation.


    +   **Metaspace (from Java 8 onwards)**: Stores class metadata, replacing the
    Permanent Generation used in earlier versions.'
