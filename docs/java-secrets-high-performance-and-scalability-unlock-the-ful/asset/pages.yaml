  md: '# 2.3 - Memory Allocation Strategies


    Memory allocation strategies used in Java for efficient resource management.


    Memory allocation in Java plays a critical role in determining the performance
    and scalability of an application. Java provides automatic memory management through
    the JVM, which handles object allocation and deallocation. The memory is primarily
    divided into stack memory and heap memory. Stack memory is used for method calls
    and local variables, while heap memory is used for object storage. To efficiently
    manage these resources, Java employs different allocation strategies such as **static
    memory allocation**, **dynamic memory allocation**, and **generational memory
    allocation**.


    Static memory allocation happens at compile time, primarily for variables whose
    memory requirements are known before execution. Dynamic memory allocation occurs
    at runtime when memory for objects or data structures is allocated dynamically
    on the heap. Generational allocation, part of Java''s heap strategy, divides heap
    memory into different regions to optimize garbage collection performance.


    Let''s start with an example that highlights the difference between stack allocation
    and heap allocation:'
