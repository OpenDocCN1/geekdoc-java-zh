    # 1.3.2 - Bytecode Optimization


    Describes how Java bytecode is optimized for performance.


    Java bytecode optimization is crucial for delivering high-performance applications.
    The Java Virtual Machine (JVM) uses various optimization techniques at runtime
    to improve execution speed and resource efficiency. Bytecode optimization happens
    through **Just-In-Time (JIT) compilation**, method inlining, loop optimizations,
    escape analysis, and dead code elimination. These techniques transform bytecode
    into optimized machine code, allowing applications to run faster without requiring
    manual intervention.


    The first major optimization is **Just-In-Time (JIT) Compilation**. JIT compiles
    frequently used (hot) bytecode into native machine code for faster execution.
    To observe JIT compilation, enable the `-XX:+PrintCompilation` option:


    Create a program with a method that is executed repeatedly:'
