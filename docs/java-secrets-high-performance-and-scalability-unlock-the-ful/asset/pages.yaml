    # 2.1 - Introduction to Memory Management


    Overview of memory management in Java, its importance, and how it affects performance.


    Memory management in Java plays a fundamental role in ensuring the application
    runs efficiently and remains scalable. Java abstracts low-level memory allocation
    details through the **JVM (Java Virtual Machine)**, which manages the heap, stack,
    and garbage collection mechanisms automatically. Developers do not have to allocate
    or deallocate memory explicitly, which reduces common programming errors such
    as dangling pointers and memory leaks. Effective memory management is crucial
    because poorly managed memory can lead to **performance bottlenecks** or even
    fatal errors like `OutOfMemoryError`. Understanding how memory is managed and
    optimized directly impacts the performance of your application.


    Memory in Java can be divided into two primary areas: the **Heap** and the **Stack**.
    The heap is where objects are stored, and it is managed by the garbage collector.
    The stack is used for method calls and local variables. Whenever a method is invoked,
    a frame is added to the stack. When the method execution completes, the frame
    is removed from the stack, and the memory is reclaimed.'
