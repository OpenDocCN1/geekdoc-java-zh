    # 2.5.1 - Mark-and-Sweep


    Description of the mark-and-sweep algorithm.


    The mark-and-sweep algorithm is a fundamental garbage collection technique used
    in Java to reclaim unused memory. It works in two phases: the **mark phase**,
    where all reachable objects are identified, and the **sweep phase**, where unreferenced
    objects are removed from memory. The algorithm ensures memory occupied by objects
    no longer in use is freed for future allocations.


    In the **mark phase**, the garbage collector traverses the object graph starting
    from **GC roots**—objects that are always reachable, such as static variables,
    local variables on the stack, and active threads. All objects reachable from the
    GC roots are marked as “alive.” In the **sweep phase**, the garbage collector
    scans the heap, identifies unmarked objects, and reclaims their memory.


    The mark-and-sweep algorithm solves the issue of manual memory management but
    can introduce **stop-the-world pauses***, where the application is paused to allow
    the GC to complete its'
