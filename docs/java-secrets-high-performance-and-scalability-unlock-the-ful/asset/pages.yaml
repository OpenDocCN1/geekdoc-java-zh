    # 1.5 - Java Runtime Environment (JRE)


    Explains the components and functionality of the Java Runtime Environment.


    The **Java Runtime Environment (JRE)**** provides the necessary environment to
    execute Java applications. It is part of the Java platform, consisting of the
    Java Virtual Machine (JVM), core libraries, and essential tools. While the JDK
    (Java Development Kit) is used for developing Java programs, the JRE is focused
    solely on running them. Understanding the JRE’s components and how they work ensures
    that Java applications can run efficiently across platforms.


    The JRE consists of three main components:


    +   1. **Java Virtual Machine (JVM):** The engine that interprets and executes
    Java bytecode.

    2. **Core Java Libraries:**** A collection of pre-written classes and libraries
    for input/output, utilities, collections, concurrency, and more.

    3. **Supporting Files:**** Configuration files, property files, and other resources
    necessary for running Java applications.'
