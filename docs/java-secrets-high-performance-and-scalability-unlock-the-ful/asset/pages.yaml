    **NEW**, **RUNNABLE**, **BLOCKED**, **WAITING**, **TIMED_WAITING**, and **TERMINATED**.
    Understanding these states is crucial for managing thread behavior effectively.
    The lifecycle defines how a thread is created, started, executed, paused, and
    eventually terminated. Each state represents the current activity or condition
    of a thread.


