    **Java Class Loader** is part of the Java Runtime Environment (JRE) and is responsible
    for dynamically loading classes into memory at runtime. When you run a Java program,
    the Class Loader locates the required classes, loads their bytecode, and links
    them into the Java Virtual Machine (JVM). It follows a hierarchical delegation
    model to load classes in a structured way. Understanding the Class Loader mechanism
    is essential for debugging, optimizing application performance, and working with
    dynamic class loading.


