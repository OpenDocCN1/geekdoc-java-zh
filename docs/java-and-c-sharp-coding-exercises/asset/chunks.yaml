    Perimeter is \" + (2 * radius * Math.PI));\n        System.out.println(\"Area\
    \ is \" + (Math.PI * radius * radius));\n    }\n}\n```\n**OUTPUT:**\n```\nInput\
    \ the radius of the circle: 10\nPerimeter is = 62.8318530717958\nArea is = 314.159265358979\n\
    ```\n\n## Swap two variables\n```java\nimport java.util.Scanner;\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        int x, y, z;\n\
    \        Scanner in = new Scanner(System.in);\n        System.out.println(\"Input\
    \ first number: \");\n        x = in.nextInt();\n        System.out.println(\"\
    Input second number: \");\n        y = in.nextInt();\n        z = x;\n       \
    \ x = y;\n        y = z;\n        System.out.println(\" Swapped values are:\"\
    \ + x + \" and \" + y);\n    }\n}\n```\n**OUTPUT:**\n```\nInput first number:\
    \ 25\nInput second number: 50\nSwapped values are:50 and 25\n```\n\n## Print a\
