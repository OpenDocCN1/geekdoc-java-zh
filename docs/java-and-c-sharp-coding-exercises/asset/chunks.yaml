    Hello \" + fname + \" \" + lname);\n    }\n}\n```\n**OUTPUT:**\n```\nInput first\
    \ name: JJ\nInput last name: TAM\nHello JJ TAM\n```\n\n## Print the sum of two\
    \ numbers\n```java\nimport java.util.Scanner;\n\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        Scanner input = new Scanner(System.in);\n\
    \        System.out.print(\"Input first number: \");\n        int num1 = input.nextInt();\n\
    \        System.out.print(\"Input second number: \");\n        int num2 = input.nextInt();\n\
    \        int sum = num1 + num2;\n        System.out.println(\"Sum: \" + sum);\n\
    \    }\n}\n```\n**OUTPUT:**\n```\nInput first number: 55\nInput second number:\
    \ 45\nSum: 100\n```\n\n## Divide two numbers and print on the screen\n```java\n\
    import java.util.Scanner;\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Scanner input = new Scanner(System.in);\n        System.out.print(\"\
    Input first number: \");\n        int a = input.nextInt();\n        System.out.print(\"\
    Input second number: \");\n        int b = input.nextInt();\n        int d = (a/b);\n\
    \        System.out.println(\"The division of a and b is:\" + d);\n    }\n}\n\
    ```\n**OUTPUT:**\n```\nInput first number: 100\nInput second number: 25\nThe division\
    \ of a and b is:4\n```\n\n## Print the result of specified operations\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        int\
    \ w = -5 + 8 * 6;\n        int x = (55 + 9) % 9;\n        int y = 20 + (-3 * 5\
    \ / 8);\n        int z = 5 + 15 / 3 * 2 - 8 % 3;\n        System.out.print(w +\
    \ \"\\n\" + x + \"\\n\" + y + \"\\n\" + z);\n    }\n}\n```\n\n## Print multiplication\
    \ table\n```java\nimport java.util.Scanner;\n\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n\
    \        System.out.println(\"Input the Number: \");\n        int n = in .nextInt();\n\
    \        for (int i = 1; i <= 10; i++) {\n            System.out.println(n + \"\
    *\" + i + \" = \" + (n * i));\n        }\n    }\n}\n```\n**OUTPUT:**\n```\nInput\
    \ the Number: 15\n15*1 = 15\n15*2 = 30\n15*3 = 45\n15*4 = 60\n15*5 = 75\n15*6\
    \ = 90\n15*7 = 105\n15*8 = 120\n15*9 = 135\n15*10 = 150\n```\n\n## Find the area\
    \ and perimeter of a circle\n```java\nimport java.util.Scanner;\n\npublic class\
