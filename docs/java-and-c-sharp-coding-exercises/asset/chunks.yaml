    \        arra[3] = \" | '-' |\";\n        arra[4] = \" +-----+\";\n        for\
    \ (int i = 0; i < 5; i++) {\n            System.out.println(arra[i]);\n      \
    \  }\n    }\n}\n```\n**OUTPUT:**\n```\n+\"\"\"\"\"+\n[| o o |]\n|  ^  |\n| '-'\
    \ |\n+-----+\n```\n\n## Fahrenheit to Celsius degree\n```java\nimport java.util.Scanner;\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        Scanner\
    \ input = new Scanner(System.in);\n        System.out.print(\"Input a degree in\
    \ Fahrenheit: \");\n    }\n}\n```\n"
