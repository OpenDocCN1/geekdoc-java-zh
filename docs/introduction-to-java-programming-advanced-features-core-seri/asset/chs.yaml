  ∞ 22 ∞\n\n## 面向开发者的 Java 8 特性\n\nLambda、函数接口\n\nJava 8 于 2014 年 3 月 18 日发布，现在是时候关注开发者的\
  \ Java 8 特性了。关于 Java 8 的资料还没有足够的。但在经过大量努力后，我在这里编写我期待的 Java 8 中引入的一些重要特性，如下：\n\n\
  1. `Iterable` 接口中的 `forEach()` 方法。\n2. 接口中的 `default` 和 `static` 方法。\n3. 函数式接口和\
  \ Lambda 表达式。\n4. 用于集合上批量数据操作的 Java Stream API。\n5. Java Time API。\n6. Collection\
  \ API 的改进。\n7. Concurrency API 的改进。\n8. Java IO 的改进。\n9. 其他核心 API 的改进。\n\n让我们简要回顾这些\
  \ Java 8 特性。我将提供一些代码段以便更好地理解，所以如果你想在 Java 8 中运行程序，必须按照以下步骤设置 Java 8 环境。\n\n下载 JDK8\
  \ 并安装它。安装过程与其他 Java 版本一样简单。在 Java 中编写、编译和运行程序需要安装 JDK。\n\n注意：当前的 Eclipse IDE 不支持\
  \ Java8，因此你必须从 efxclipse.org 下载适用于 Java 8 的 Eclipse。针对 Mac OS、Windows 和 Linux 系统有不同版本的稳定构建，因此请下载最新版本以获取大多数功能。\n\
  \n我今天（2014 年 7 月 28 日）检查过，Eclipse Kepler 4.3.2 SR2 包可以用于 Java 8。你需要先下载它，然后从 Eclipse\
  \ Marketplace 安装“Java 8 support for Eclipse Kepler SR2” 插件。我尝试过了，它看起来运行得良好。\n\n\
  ### 1. `Iterable` 接口中的 `forEach()` 方法\n\n每当我们我们需要遍历一个 `Collection` 时，都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为\
  \ Collection 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\n\
  Java 8 在 `java.lang.Iterable` 接口中引入了 `forEach` 方法，这样我们在编写代码时只需关注业务逻辑。`forEach` 方法接受\
  \ `java.util.function.Consumer` 对象作为参数，因此它有助于将我们的业务逻辑保持在独立的位置，以便我们复用。让我们通过简单的示例来看\
  \ `forEach` 的用法。\n\n**Java8ForEachExample.java**\n\n```java\npackage com.journaldev.java8.foreach;\n\
  import java.util.ArrayList;\nimport java.util.Iterator;\nimport java.util.List;\n\
  import java.util.function.Consumer;\nimport java.lang.Integer;\n\npublic class Java8ForEachExample\
  \ {\n    public static void main(String[] args) {\n        //创建示例集合\n        List<Integer>\
  \ myList = new ArrayList<Integer>();\n        for(int i=0; i<10; i++) myList.add(i);\n\
  \        //使用 Iterator 遍历\n        Iterator<Integer> it = myList.iterator();\n \
  \       while(it.hasNext()){\n            Integer i = it.next();\n            System.out.println(\"\
  Iterator Value::\"+i);\n        }\n        // 使用匿名类通过 Iterable 的 forEach 方法遍历\n\
  \        myList.forEach(new Consumer<Integer>() {\n            public void accept(Integer\
  \ t) {\n                System.out.println(\"forEach class Value::\"+t);\n     \
  \       }\n        });\n        // 使用 Consumer 实现遍历\n        MyConsumer action =\
  \ new MyConsumer();\n        myList.forEach(action);\n    }\n}\n// 可以复用的 Consumer\
  \ 实现\nclass MyConsumer implements Consumer<Integer>{\n    public void accept(Integer\
  \ t) {\n        System.out.println(\"Consumer impl::\"+t);\n    }\n}\n```\n\n代码行数可能会增加，但\
  \ `forEach` 方法有助于将迭代逻辑和业务逻辑分离开来，从而实现更高的关注点分离和更整的代码。\n\n### 2. 接口中的 `default` 和 `static`\
  \ 方法\n\n每当我们我们需要遍历一个 `Collection` 时，都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为 Collection\
  \ 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\nJava 8 在 `java.lang.Iterable`\
  \ 接口中引入了 `forEach` 方法，这样我们在编写代码时只需关注业务逻辑。`forEach` 方法接受 `java.util.function.Consumer`\
  \ 对象作为参数，因此它有助于将我们的业务逻辑保持在独立的位置，以便我们复用。让我们通过简单的示例来看 `forEach` 的用法。\n\n代码行数可能会增加，但\
  \ `forEach` 方法有助于将迭代逻辑和业务逻辑分离开来，从而实现更高的关注点分离和更整的代码。\n\n接口中的 `default` 和 `static`\
  \ 方法\n\n每当我们我们需要遍历一个 `Collection` 时，都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为 Collection\
  \ 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\nJava 8 在 `java.lang.Iterable`\
  \ 接口中引入了 `forEach` 方法，这样我们在编写代码时只需关注业务逻辑。`forEach` 方法接受 `java.util.function.Consumer`\
  \ 对象作为参数，因此它有助于将我们的业务逻辑保持在独立的位置，以便我们复用。\n\n让我们通过简单的示例来看 `forEach` 的用法。\n\n代码行数可能会增加，但\
  \ `forEach` 方法有助于将迭代逻辑和业务逻辑分离开来，从而实现更高的关注点分离和更整的代码。\n\n`default` 和 `static` 方法\n\
  \n每当我们我们需要遍历一个 `Collection` 时，都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为 Collection\
  \ 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\n```java\ndefault\
  \ forEach(Consumer<? super T> action) {\n    Objects.requireNonNull(action);\n \
  \   for (T t : this) {\n        action.accept(t);\n    }\n}\n```\n\n**记住：**\n\n\
  注意到 `forEach` 方法在 `Iterable` 中定义，但我们知道接口不能有方法体。从 Java 8 开始，接口被增强了方法体。我们可以使用 `default`\
  \ 和 `static` 关键字创建接口。\n\n由于 Java 不支持类的多继承，这会导致菱问题。因此如何通过接口处理？解决方案在这种情况下编译器会抛出异常，我们需要在类中提供实现。\n\
  \n**Interface1.java**\n\n```java\npackage com.journaldev.java8.defaultmethod;\n\
  @FunctionalInterface\npublic interface Interface1 {\n    void method1(String str);\n\
  \    default void log(String str) {\n        System.out.println(\"I1 logging::\"\
  +str);\n    }\n    static void print(String str) {\n        System.out.println(\"\
  Printing \"+str);\n    }\n    //尝试覆盖 Object 方法会导致编译错误，因为“A default method cannot\
  \ override a method from java.lang.Object”\n    // default String toString(){\n\
  \    // return \"i1\";\n    // }\n}\n```\n\n**Interface2.java**\n\n```java\npackage\
  \ com.journaldev.java8.defaultmethod;\n@FunctionalInterface\npublic interface Interface2\
  \ {\n    void method2();\n    default void log(String str) {\n        System.out.println(\"\
  I2 logging::\"+str);\n    }\n}\n```\n\n注意到两个接口都有相同的 `log()` 方法实现逻辑。\n\n**MyClass.java**\n\
  \n```java\npackage com.journaldev.java8.defaultmethod;\npublic class MyClass implements\
  \ Interface1, Interface2 {\n    @Override\n    public void method2() {\n    }\n\
  \    @Override\n    public void method1(String str) {\n    }\n    // 如果没有自己的 log()\
  \ 实现，MyClass 将无法编译\n    @Override\n    public void log(String str) {\n        System.out.println(\"\
  MyClass logging::\"+str);\n        Interface1.print(\"abc\");\n    }\n}\n```\n\n\
  你可以看到 `Interface1` 有一个静态方法实现，该方法在 `MYCLASS.LOG()` 方法中使用。Java 8 在 Collection API\
  \ 中大量使用默认和静态方法，添加默认方法是为了确保我们的代码向后兼容。\n\n如果层次结构中的任何类具有相同签名的方法，那么默认方法将失效。由于任何实现接口的类已经有了\
  \ `Object` 作为父类，如果我们在接口中有 `equals()`、`hashCode()` 默认方法，它们将失效。因此为了更好的清晰，不允许接口拥有 `Object`\
  \ 类的默认方法。\n\n要了解 Java 8 接口更改的完整细节，请阅读下方的 Java 8 接口更改。\n\n\n\n\n\nJava 8 最大的设计变化之一是接口概念的引入。在\
  \ Java 7 之前，我们只能在接口中定义方法声明。但从 Java 8 开始，我们可以在接口中使用 `default methods`（默认方法）和 `static\
  \ methods`（静态方法）。\n\n设计接口一直是一项艰巨的工作，因为如果我们要在接口中添加额外方法，将需要修改所有实现类。\n\n随着接口的增长，实现它的类数量可能会增加到无法扩展接口的程度。这就是为什么在设计应用程序时，大多数框架都会提供一个基础实现类，然后我们扩展它并重写适用于我们应用程序的方法。让我们来看看接口的默认方法、静态方法以及引入它们的原因。\n\
  \n### 接口默认方法 (Interface Default Method)\n\n为了在接口中创建默认方法，我们需要在方法签名时使用 `default` 关键字。例如：\n\
  \n| Interface1.java |\n```java\npackage com.journaldev.java8.defaultmethod;\npublic\
  \ interface Interface1 {\n    void method1(String str);\n    default void log(String\
  \ str){\n        System.out.println(\"I1 logging::\"+str);\n        print(str);\n\
  \    }\n}\n```\n\n注意 `log(String str)` 是 `Interface1` 中的默认方法。现在当一个类实现 `Interface1`\
  \ 时，并不强制要求为默认方法提供实现。这一功能将帮助我们通过额外方法来扩展接口，我们只需要提供一个默认实现。假设我们有另一个包含以下方法的接口：\n\n| Interface2.java\
  \ |\n```java\npackage com.journaldev.java8.defaultmethod;\npublic interface Interface2\
  \ {\n    void method2();\n    default void log(String str){\n        System.out.println(\"\
  I2 logging::\"+str);\n    }\n}\n```\n\n我们知道 Java 不允许继承多个类，因为这会导致“菱形问题”（Diamond Problem），即编译器无法决定使用哪个父类方法。有了默认方法，接口也会出现菱形问题。\n\
  \n因为如果一个类同时实现了 `Interface1` 和 `Interface2` 但没有实现公共的默认方法，编译器将无法选择哪一个。\n\n扩展多个接口是\
  \ Java 的不可或缺的一部分，你可以在 Java 核心类以及大多数企业级应用和框架中发现它。因此，为了确保这个问题在接口中不会发生，现在强制要求为公共默认方法提供实现。\n\
  \n所以，如果一个类实现了上述两个接口，它必须为 `log()` 方法提供实现，否则编译器将抛出错误。一个实现 `Interface1` 和 `Interface2`\
  \ 的简单类如下：\n\n| MyClass.java |\n```java\npackage com.journaldev.java8.defaultmethod;\n\
  public class MyClass implements Interface1, Interface2 {\n    @Override\n    public\
  \ void method2() {\n    }\n    @Override\n    public void method1(String str) {\n\
  \    }\n    @Override\n    public void log(String str){\n        System.out.println(\"\
  MyClass logging::\"+str);\n        Interface1.print(\"abc\");\n    }\n}\n```\n\n\
  关于接口默认方法的要点：\n\n- 默认方法将帮助我们扩展接口，而无需担心破坏实现类。\n- 默认方法缩小了接口和抽象类之间的差异。\n- 默认方法将帮助我们避免工具类，例如，所有的\
  \ Collections 类方法都可以直接在接口本身提供。\n- 默认方法将帮助我们移除基础实现类，我们可以提供默认实现，而实现类可以选择重写哪一个。\n-\
  \ 引入默认方法的主要原因之一是增强 Java 8 中的 Collections API 以支持 lambda 表达式。\n- 如果层次结构中的任何类具有相同签名的方法，那么默认方法将变得无关。默认方法不能重写\
  \ `java.lang.Object` 中的方法。原因非常简单，因为 `Object` 是所有 Java 类的基类。因此，即使我们在接口中将 Object 类的方法定义为默认方法，它也是没用的，因为始终会使用\
  \ Object 类的方法。所以为了避免混淆，我们不能拥有重写 Object 类方法的默认方法。\n- 默认方法也被称为防御方法（Defender Methods）或虚拟扩展方法（Virtual\
  \ extension methods）。\n\n### 接口静态方法 (Interface static methods)\n\n静态方法与默认方法类似，但我们不能在实现类中重写它们。这一功能有助于我们避免在子类实现不当的情况下出现意外结果。让我们通过一个简单的例子来看。\n\
  \n| MyData.java |\n```java\npackage com.journaldev.java8.staticmethod;\npublic interface\
  \ MyData {\n    default void print(String str) {\n        if (!isNull(str))\n  \
  \  }\n    static boolean isNull(String str) {\n        System.out.println(\"Interface\
  \ Null Check\" + str);\n        return str == null ? true : false;\n    }\n}\n```\n\
  \n现在让我们看一个实现不当的实现类。\n\n| MyDataImpl.java |\n```java\npackage com.journaldev.java8.staticmethod;\n\
  public class MyDataImpl implements MyData {\n    public boolean isNull(String str)\
  \ {\n        System.out.println(\"Impl Null Check\");\n        return str == null\
  \ ? true : false;\n    }\n    public static void main(String args[]){\n        MyDataImpl\
  \ obj = new MyDataImpl();\n        obj.print(\"\");\n        obj.isNull(\"abc\"\
  );\n    }\n}\n```\n\n注意 `isNull(String str)` 是类方法，它并没有覆盖接口方法。例如，如果我们给 `isNull()`\
  \ 方法添加 `@Override` 注解，将导致编译器错误。现在当我们运行应用程序时，我们得到以下输出。\n\n| Interface Null Check\n\
  Impl Null Check |\n\n如果我们将接口方法从静态改为默认，我们将得到以下输出。\n\n| 123 | Impl Null CheckMyData\
  \ Print::Impl Null Check |\n\n关于接口静态方法的要点：\n\n- 接口静态方法是接口的一部分，我们不能通过实现类对象来使用它。\n\
  - 接口静态方法非常适合提供工具方法，例如空检查、集合排序等。\n- 接口静态方法通过不允许实现类重写它们来帮助我们提供安全性。\n- 我们不能为 Object\
  \ 类的方法定义静态方法，否则将得到编译器错误“This static method cannot hide the instance method from\
  \ Object”。这是因为在 Java 中是不允许的，因为 Object 是所有类的基类，我们不能在一个类中拥有相同签名的类级静态方法实例方法。\n- 我们可以使用接口静态方法来移除\
  \ Collections 这样的工具类，并将其所有的静态方法移动到相应的接口中，这样更容易查找和使用。\n\n### 函数式接口 (Functional Interfaces)\n\
  \n在结束这个主题之前，我想简要介绍一下函数式接口。恰有一个抽象方法的接口被称为函数式接口。\n\n引入了新的注解 `@FunctionalInterface`\
  \ 来标记接口为函数式接口。`@FunctionalInterface` 注解提供了一种防止在函数式接口中意外添加抽象方法的机制。它是可选的，但使用它是良好的习惯。\n\
  \n\n\n\n函数式接口是 Java 8 中受期待且深受许多特性，因为它使我们能够使用 `lambda expressions` 来实例化它们。新增的包 `java.util.function`\
  \ 包含许多函数式接口，为 lambda 表达式和方法引用提供目标类型。\n\n# 3. 函数式接口与 Lambda 表达式\n\n如果你观察上面的接口代码，你会发现\
  \ `@FunctionalInterface` 注解。函数接口是 Java 8 引入的一个新概念。恰好有一个抽象方法的接口就变成了函数接口。\n\n我们不需要使用\
  \ `@FunctionalInterface` 注解来将接口标记为函数接口。`@FunctionalInterface` 注解是一种避免在函数式接口中意外添加抽象方法的机制。\n\
  \n你可以将其比作 `@Override` 注解，并且使用它是最佳实践。具有单个抽象方法 `run()` 的 `java.lang.Runnable` 是函数接口的一个极佳示例。\n\
  \n函数式接口的一个主要优势是可以使用 `lambda expressions` 来实例化它们。虽然我们可以使用 `anonymous class` 来实例化一个接口，但代码看起来会非常臃肿。\n\
  \n```java\nRunnable r = new Runnable(){\n    @Override\n    public void run() {\n\
  \        System.out.println(\"My Runnable\");\n    }\n};\n```\n\n由于函数式接口只有一个方法，lambda\
  \ 表达式可以轻松地提供方法实现。\n\n我们只需要提供方法参数和业务逻辑。例如，我们可以使用 lambda 表达式这样写上面的实现：\n\n```java\n\
  Runnable r1 = () -> {\n    System.out.println(\"My Runnable\");\n};\n```\n\n如果你在方法实现中只有单条语句，我们也不需要大括号。例如，上面的\
  \ `Interface1` 匿名类可以使用如下 lambda 表达式进行实例化：\n\n```java\nInterface1 i1 = (s) -> System.out.println(s);\n\
  i1.method1(\"abc\");\n```\n\n因此，lambda 表达式是轻松创建函数式接口匿名类的手段。使用 lambda 表达式在运行时并没有任何性能上的收益，所以我我会谨慎地使用它，因为我并不介意多写几行代码。\n\
  \n新增的包 `java.util.function` 包含许多函数式接口，用于为 lambda 表达式和方法引用提供目标类型。\n\nLambda 表达式是一个庞大的话题，我将在将来（本书的下一版）对其撰写一个单独的说明（Note）。你可以阅读下方的完整教程：`Java\
  \ 8 Lambda Expressions Tutorial`。\n\n# Java 8 Lambda 表达式与函数式接口教程\n\nJava 一直是一种 `Object\
  \ Oriented Programming` 语言。这意味着 Java 编程中的一切都围绕着对象（为了简单起，某些基本类型除外）。Java 中不只有函数，函数是\
  \ `Class` 的一部分，我们需要使用类/对象来调用任何函数。\n\n如果我们看其他一些编程语言，如 `C++`、JavaScript；它们被称为 `functional\
  \ programming language`，因为我们可以编写函数并在需要时使用它们。这些语言中的一些也支持面向对象编程和函数式编程。\n\n面向对象并不是坏事，但它给程序带来了大量的冗余。例如，假设我们需要创建一个\
  \ `Runnable` 实例。通常我们使用像下面的匿名类来完成：\n\n```java\nRunnable r = new Runnable(){\n   \
  \ @Override\n    public void run() {\n        System.out.println(\"My Runnable\"\
  );\n    }\n};\n```\n\n如果你观察上面的代码，实际用的部分是 `run()` 方法内部的代码。其余所有代码都是由于 Java 程序结构的方式。\n\
  \nJava 8 为我们引入了 `Functional Interfaces` 和 `Lambda Expressions` 的概念，以避免编写那些我们可以通过让\
  \ Java 编译器变智能而轻松避免的无用代码。\n\n## Functional Interface\n\n恰好有一个抽象方法的接口被称为函数接口。添加 `@FunctionalInterface`\
  \ 注解是为了将接口标记为函数接口。使用它不是强制的，但在函数接口中使用它是最佳实践，用以避免意外添加额外方法。如果接口标记了 `@FunctionalInterface`\
  \ 注解且我们尝试拥有多个抽象方法，它会抛出编译器错误。\n\n函数接口的主要优势是我们可以使用 `lambda expressions` 来实例化它们，避免使用臃肿的匿名类实现。\n\
  \nJava 8 Collections API 进行了重写，并提供了新的 `Stream API`，它使用了大量的函数式接口。Java 8 在 `java.util.function`\
  \ 包中定义了许多函数式接口，其中一些实用的包括 `Consumer`、`Supplier`、`Function` 和 `Predicate`。你可以在 `Java\
  \ 8 Stream Example` 中找到更多。\n\n`java.lang.Runnable` 是具有单个抽象方法 `run()` 的函数接口极佳示例。\n\
  \n```java\ninterface Foo {\n    boolean equals(Object obj);\n} // 不是函数，因为 equals\
  \ 已经是 Object 的成员\n\ninterface Comparator<T> {\n    int compare(T o1, T o2);\n} //\
  \ 是函数，因为 Comparator 有一个抽象方法\n\ninterface Foo {\n    Object clone();\n} // 不是函数，因为\
  \ clone 已经是 Object 的成员\n\ninterface X {\n    int m(Iterable<String> arg);\n}\ninterface\
  \ Y {\n    int m(Iterable<Integer> arg);\n}\ninterface Z extends X, Y {} // 是函数：两个方法，但它们的签名相同\n\
  \ninterface X {\n    Iterable<String> m(Iterable arg);\n}\ninterface Y {\n    Iterable<String>\
  \ m(Iterable arg);\n}\ninterface Z extends X, Y {} // 是函数：Y.m 是子签名\n\ninterface\
  \ X {\n    int m(Iterable<String> arg, Class c);\n}\ninterface Y {\n    int m(Iterable\
  \ arg, Class<?> c);\n}\ninterface Z extends X, Y {} // 不是函数：签名不同，擦除相同\n\ninterface\
  \ X {\n    long m();\n}\ninterface Y {\n    int m();\n}\ninterface Z extends X,\
  \ Y {} // 不是函数：返回类型不可可替换\n\ninterface Foo<T> {\n    void m(T arg);\n}\ninterface\
  \ Bar<T> {\n    void m(T arg);\n}\ninterface FooBar<X, Y> extends Foo<X>, Bar<Y>\
  \ {} // 编译器错误：没有方法返回类型可替换\n```\n\n## Lambda Expressions\n\nLambda 表达式是在 Java 对象对象世界中实现\
  \ `functional programming` 的方式。对象是 Java 编程的基础，我们永远脱离函数，这就是为什么 Java 语言只支持配合函数式接口使用\
  \ lambda 表达式。\n\nLambda 表达式语法为 `(argument) -> (body)`。现在让我们如何使用 lambda 表达式编写上面的匿名\
  \ Runnable。\n\n```java\nRunnable r1 = () -> System.out.println(\"My Runnable\");\n\
  ```\n\n- 让我们尝试理解上面的 lambda 表达式发生了什么。\n- `Runnable` 是一个函数接口，这就是为什么我们可以使用 lambda 表达式创建它的实例。\n\
  - 由于 `run()` 方法没有参数，我们的 lambda 表达式也没有参数。\n- 就像 if-else 块一样，由于方法体中只有一条语句，我们可以避免大括号\
  \ {}。\n\n### 为什么我们需要 Lambda Expressions\n\n1. 减少代码量 - 使用 lambda 表达式的一个明显优势是减少了代码量，我们已经看到了如何轻松地使用\
  \ lambda 表达式创建函数式接口的实例而不是使用匿名类。\n2. 顺序和并行执行支持 -\n\n\n\n\n使用 lambda 表达式的另一个好处是我们可以从\
  \ Stream API 对顺序和并行操作的支持中受益。为了解释这一点，让我们来看一个简单的例子，我们需要编写一个方法来测试传递的数字是否为素数。\n\n传统上，我们会像下面一样编写代码。代码没有经过完全优化，但为了演示目的，请见多包涵。\n\
  \n```java\n// 传统方法\nprivate static boolean isPrime(int number) {\n    if(number\
  \ < 2) return false;\n    for(int i=2; i<number; i++){\n        if(number % i ==\
  \ 0) return false;\n    }\n    return true;\n}\n```\n\n上述代码的问题在于它在本质上是顺序的，如果数字非常大，将花费大量时间。代码的另一个问题是有许多个退出点，且可读性差。让我们看看如何使用\
  \ lambda 表达式和 Stream API 编写相同的方法。\n\n```java\n// 声明式方法\nprivate static boolean isPrime(int\
  \ number) {\n    return number > 1\n           && IntStream.range(2, number - 1).noneMatch(\n\
  \                   index -> number % index == 0);\n}\n```\n\n`IntStream` 是一个原始\
  \ int 值的元素的序列，支持顺序和并行聚合操作。这是 `Stream` 的 `int` 原始类型特。为了提高可读性，我们也可以像下面这样写方法。\n\n```java\n\
  private static boolean isPrime(int number) {\n    IntPredicate isDivisible = index\
  \ -> number % index == 0;\n    return number > 1\n           && IntStream.range(2,\
  \ number - 1).noneMatch(\n                   isDivisible);\n}\n```\n\n如果你熟悉 `IntStream`，它的\
  \ `range()` 方法返回一个从 `startInclusive`（包含）到 `endExclusive`（不包含）、增量步长为 1 的顺序有序 `IntStream`。`noneMatch()`\
  \ 方法返回此流中没有元素匹配所提供的谓词。\n\n如果对于确定结果不是必要的，它可能不会对所有元素求谓词。\n\n### 3. 将行为传递给方法\n\n让我们通过一个简单的例子，看看如何使用\
  \ lambda 表达式来传递方法的行为。假设我们需要编写一个方法，当列表中的数字符合给定标准时对它们求和。我们可以使用 `Predicate` 并像下面一样写方法。\n\
  \n```java\npublic static int sumWithCondition(List<Integer> numbers, Predicate<Integer>\
  \ predicate) {\n    return numbers.parallelStream()\n                  .filter(predicate)\n\
  \                  .mapToInt(i -> i)\n                  .sum();\n}\n```\n\n示例用法：\n\
  \n```java\n// 所有数字之和\nsumWithCondition(numbers, n -> true)\n// 所有偶数之和\nsumWithCondition(numbers,\
  \ i -> i%2==0)\n// 所有大于 5 的数字之和\nsumWithCondition(numbers, i -> i>5)\n```\n\n###\
  \ 4. 惰性带来的的高效率\n\n使用 lambda 表达式的另一个优势是惰性求值，例如假设我们需要编写一个方法来找到 3 到 11 范围内最大的奇数，并返回它的平方。通常我们会这样写这个方法的代码：\n\
  \n```java\nprivate static int findSquareOfMaxOdd(List<Integer> numbers) {\n    int\
  \ max = 0;\n    for (int i : numbers) {\n        if (i % 2 != 0 && i > 3 && i <\
  \ 11 && i > max) {\n            max = i;\n        }\n    }\n    return max * max;\n\
  }\n```\n\n上面的程序将始终按顺序运行，但我们可以使用 Stream API 来实现这一点并获得惰性追求的收益。让我们看看如何使用 Stream API\
  \ 和 lambda 表达式以函数的方式重写这段代码。\n\n```java\npublic static int findSquareOfOdd(List<Integer>\
  \ numbers) {\n    return numbers.stream()\n              .filter(NumberTest::isOdd)\
  \ // Predicate 是函数式接口\n              .filter(NumberTest::isGreaterThan3) // 我们使用\
  \ lambdas 初始化它\n              .filter(NumberTest::isLessThan1) // 而不是匿名内部类\n   \
  \           .max(Comparator.naturalOrder())\n              .map(i -> i * i)\n  \
  \            .get();\n}\npublic static boolean isOdd(int i) {\n    return i % 2\
  \ != 0;\n}\npublic static boolean isGreaterThan3(int i){\n    return i > 3;\n}\n\
  public static boolean isLessThan1(int i){\n    return i < 11;\n}\n```\n\n如果你对双冒号\
  \ `::` 操作符感到惊讶，它是在 Java 8 中引入的，用于方法引用。Java 编译器会处理参数映射到被调用方法。它是 lambda 表达式 `i ->\
  \ isGreaterThan3(i)` 或 `i -> NumberTest.isGreaterThan3(i)` 的简写形式。\n\n#### Lambda\
  \ 表达式示例\n\n下面我提供了一些 lambda 表达式的代码片段，并附有简短的注释说明。\n\n```java\n() -> {} // 无参数\nvoid\
  \ () -> 42 // 无参数，表达式体\n() -> null // 无参数，表达式体\n() -> { return 42; } // 无参数，带返回的块体\n\
  () -> { System.gc(); } // 无参数，void 块体 带有多个返回的复杂块体\n() -> {\n    if (true) return\
  \ 10;\n    else {\n        int result = 15;\n        for (int i = 1; i < 10; i++)\n\
  \            result *= i;\n        return result;\n    }\n}\n(int x) -> x+1 // 声明类型参数\n\
  (int x) -> { return x+1; } // 同上\nx -> x+1 // 单推断类型参数，括号可选\nx -> x+1 // 单推断类型情况\n\
  (String s) -> s.length() // 声明类型参数\n(Thread t) -> { t.start(); } // 声明类型参数\ns ->\
  \ s.length() // 单推断类型参数\nt -> { t.start(); } // 单推断类型参数\n(int x, int y) // 多声明类型参数\n\
  (x,y) // 多推断类型参数\n(x, final y) // 错误：不能修改推断类型参数\n(x, int y) // 错误：不能混合推断和声明类型\n\
  ```\n\n方法引用和构造函数引用\n\n方法引用用于引用方法而不调用它；构造函数引用同样用于引用构造函数而不创建命名类或数组类型的实例。\n\n方法和构造函数引用的示例：\n\
  \n```java\nSystem::getProperty\nSystem.out::println\n\"abc\"::length\nArrayList::new\n\
  int[]::new\n```\n\n这就是函数式接口和 Lambda 表达式教程的所有，强烈建议深入，因为这种语法对于 Java 来说是新的，需要一些时间来掌握并更好地使用它。\n\
  \n### 4. 用于集合批量操作的 Java Stream API\n\nJava 8 引入了新的 `java.util.stream`，用于对集合执行 filter/map/reduce\
  \ 等操作。Stream API 允许顺序和并行执行。\n\n这是对我来说最好的特性之一，因为我经常处理集合，而且通常在处理大数据时，我们需要根据某些条件过滤它们。Collection\
  \ 接口扩展了 `STREAM()` 和 `PARALLELSTREAM()` 默认方法，以获取顺序和并行执行的 Stream。让我们通过简单的例子来看它们的用法。\n\
  \n![](img/image01304.jpeg)\n\n| StreamExample.java |\n\n\n\n\n\n```java\npackage\
  \ com.journaldev.java8.stream;\nimport java.util.ArrayList;\nimport java.util.List;\n\
  import java.util.stream.Stream;\n\npublic class StreamExample {\n    public static\
  \ void main(String[] args) {\n        List<Integer> myList = new ArrayList<>();\n\
  \        for(int i=0; i<100; i++) myList.add(i);\n        //sequential stream\n\
  \        Stream<Integer> sequentialStream = myList.stream();\n        //parallel\
  \ stream\n        Stream<Integer> parallelStream = myList.parallelStream();\n  \
  \      //using lambda with Stream API, filter example\n        Stream<Integer> highNums\
  \ = parallelStream.filter(p -> p > 90);\n        //using lambda in forEach\n   \
  \     highNums.forEach(p -> System.out.println(\"High Nums parallel=\"+p));\n  \
  \      Stream<Integer> highNumsSeq = sequentialStream.filter(p -> p > 90);\n   \
  \     highNumsSeq.forEach(p -> System.out.println(\"High Nums sequential=\"+p));\n\
  \    }\n}\n```\n\n如果你运行上面的示例代码，将得到如下输出：\n\nHigh Nums parallel=91\nHigh Nums parallel=96\n\
  High Nums parallel=93\nHigh Nums parallel=98\nHigh Nums parallel=94\nHigh Nums parallel=95\n\
  High Nums parallel=97\nHigh Nums parallel=92\nHigh Nums parallel=99\nHigh Nums sequential=91\n\
  High Nums sequential=92\nHigh Nums sequential=93\nHigh Nums sequential=94\nHigh\
  \ Nums sequential=95\nHigh Nums sequential=96\nHigh Nums sequential=97\nHigh Nums\
  \ sequential=98\nHigh Nums sequential=99\n\n注意并行处理的值不是按顺序的，因此在处理庞大的集合时，并行处理将非常有帮助。在本主题中无法涵盖\
  \ Stream API 的所有内容，你可以在下一节的《Java 8 Stream API 教程》中阅读关于 Stream API 的所有内容。\n\n![STAR-LOGO-2013](img/image01305.jpeg)\n\
  \n# 章节\n∞ 23 ∞\n\n# Java 8 Stream 和时间 API\n## Java 8 Stream API 示例教程 -\n\n在最后几个主题中，我们研究了`Java\
  \ 8 接口更改`以及`函数式接口和 Lambda 表达式`。\n\n现在我们将介绍 Java 8 引入的主要 API 之一 – `Java Stream API`。\n\
  \n1. Stream API 概述。\n2.  与 Stream。\n3. Stream 中常用的函数式接口。\n    1. `Function` 和 `BiFunction`。\n\
  \    2. `Predicate` 和 `BiPredicate`。\n    3. `Consumer` 和 `BiConsumer`。\n    4.\
  \ `Supplier`。\n5. `java.util.Optional`。\n6. `java.util.Spliterator`。\n7. 中间操作和终端操作。\n\
  8. 短路操作。\n9. Java Stream 示例。\n    1. 创建 Stream。\n    2. 将 Stream 集合或数组。\n    3.\
  \ Stream 中间操作。\n    4. Stream 终端操作。\n9. Java Stream API 的局性。\n\n## Stream API 概述\
  \ -\n\n在查看 Java 8 Stream API 示例之前，让我们看看为什么需要它。假设我们想要遍历一个整数列表，并找到所有大于 10 的整数之和。在\
  \ Java 8 之前，实现的方法是：\n\n```java\nprivate static int sumIterator(List<Integer> list)\
  \ {\n    Iterator<Integer> it = list.iterator();\n    int sum = 0;\n    while (it.hasNext())\
  \ {\n        int num = it.next();\n        if (num > 10) {\n            sum += num;\n\
  \        }\n    }\n    return sum;\n}\n```\n\n上述方法存在三个主要问题：\n\n1) 我们只想知道整数之和，但还必须提供迭代如何进行，这被称为`外部迭代`，因为客户端程序在处理遍历列表的算法。\n\
  2) 程序在本质上是顺序的，我们无法轻松以并行的方式执行此操作。\n3) 即使是一个简单的任务，也要编写大量的代码。\n\n为了克服上述缺点，Java 8 引入了\
  \ Stream API。我们可以使用 Stream API 来实现 `内部迭代`，这样更好，因为 Java 框架控制了迭代。`内部迭代` 提供了许多功能，例如顺序执行和并行执行、基于给定标准进行过滤、映射等。\n\
  \n大多数 Stream API 方法的参数都是函数式接口，因此 lambda 表达式与它们配合得非常好。让我们看看如何用用单行语句编写上面的逻辑。\n\n```java\n\
  private static int sumStream(List<Integer> list) {\n    return list.stream().filter(i\
  \ -> i > 10).mapToInt(i -> i).sum();\n}\n```\n\n注意，上述程序利用 Java 框架的迭代策略、过滤和映射方法，并将提高效率。首先，我们将研究\
  \ Stream API 的核心概念，然后通过一些示例来理解最常用的方法。\n\n## 集合与 Stream-\n\n集合（Collection）是一种用于存储值的内存数据结构，在开始使用集合之前，所有值都应该已经被填充。而\
