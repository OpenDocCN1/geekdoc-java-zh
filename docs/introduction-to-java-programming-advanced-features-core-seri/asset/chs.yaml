  \n# 第 8 章：包\n\n## 引言\n\n当我们开发项目时，必须将程序拆分成几个类。为了组织这些类，我们使用了包（Packages）。包既是一种命名机制，也是一种可见性控制机制。包是相互相关的类和接口的集合。在包的帮助下，只要类定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n程序（PROGRAMS）被组织成包的集合。每个包都有自己的子包集合，这有助于防止命名冲突。只有当顶层包被声明为 `public`\
  \ 时，才能在包外部访问。包的命名结构是层级的。包的成员包括类类型、接口类型和子包。Java 中的包是一种封装机制，用于将相关的类、接口和子包组合在一起。\n\n\
  对于小型程序，包可以是未命名的或具有简单的名称，但如果代码要广泛分发，则应该选择唯一的包名。这可以防止当两个开发小组恰好选择相同的包名，且这些包后来被用在同一个程序时，本可能发生的冲突。如果我们不为\
  \ Java 类指定包，那么该类将是 Java 默认包（称为“未命名包”）的一部分。但这要求每个类必须有唯一的名称以避免冲突。\n\n## 未命名包的示例\n\n\
  ```java\nclass A {\n    // - - - - - - -\n    // - - - - - - -\n}\n\nclass A_demo\
  \ {\n    public static void main(String args[]) {\n        // - - - - - -\n    \
  \    // - - - - - - -\n    }\n}\n```\n\n## 如何定义包\n\n要创建一个包，请在 Java 文件的第一条语句中包含 `package`\
  \ 命令。在该文件中声明的任何类将属于指定的包。如果我们省略了包语句，类将被放入没有名称的默认包，即未命名包。Java 使用文件系统目录来存储包。记住大小是敏感的，目录名必须与包名匹配。多个文件可以包含相同的包语句。\n\
  \n语法：\n```java\npackage package_name; // 包声明\nclass A // 类声明\n    // 类 A 的主体\n}\n\
  ```\n`package` 是一个关键字。`p1` 是类 `A` 存储的包名。\n\n### 示例 8.1\n\n```java\npackage p1;\n\
  class A {\n    public static void main(String args[]) {\n        System.out.println(\"\
  First Package program.\");\n    }\n}\n```\n我们假设当前文件夹是 `c:\\javaprg\\p1>`\n```bash\n\
  C:\\javaprg\\p1>javac A.java\nC:\\javaprg\\p1>java p1.A\n```\n输出：\n```\nFirst Package\n\
  ```\n注意：如果我们在 `c:\\javaprg>` 下使用 `javac -d A.java` 编译上述程序，则会创建 `p1` 文件夹，并将上述程序的\
  \ `.class` 文件保存在该文件夹中。如果我们不使用 `-d` 选项编译，则我们需要负责创建 `p1` 文件夹并将 `.class` 文件放在当前文件夹。如果我们想在其他地方创建文件夹，也可以输入完整路径，如\
  \ `javac -d c:\\javaprg A.java`。\n\n## 导入包\n\nJava 的内置类都存储在命名的包中；由于包内的类必须使用包名进行完全限定，因此为每个想要使用的类输入长长的点分隔路径可能会变得繁琐。因此，Java\
  \ 包含了 `import` 语句，以将某些类或整个包引入可见范围。一旦导入，就可以直接使用类名引用类。`import` 语句是一种便利措施，编写完整程序时不需要它。如果我们要在应用程序中引用几个类，那么\
  \ `import` 语句将节省大量的工作。\n\n在 Java 源文件中，`import` 语句紧随包语句之后任何类定义之前。这是 `import` 语句的通用形式。\n\
  ```java\nimport pkg1.classname;\nimport pkg1.*;\n```\n\n### 示例 8.2\n\n```java\n\
  // 使用 Random 类打印 10 个随机数\n// 不使用 import 语句的 java.util\nimport java.util.Random\n\
  class RandomTest1 {\n    public static void main(String args[]) {\n        java.util.Random\
  \ r1 = new java.util.Random();\n        for(int i=1;i<=10;i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n输出：\n```\n1588659525\n481996564\n210875677\n386971039\n\
  360473512\n1922641171\n393055462\n889442536\n1836112189\n320882863\n```\n\n### 示例\
  \ 8.3\n\n```java\n// 使用 Random 类打印 10 个随机数\n// 使用 import 语句的 java.util\nimport java.util.Random;\n\
  class RandomTest2 {\n    public static void main(String args[]) {\n        Random\
  \ r1 = new Random();\n        for(int i=1;i<=10;i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(Math.abs(r1.nextInt()));\n\
  }\n}\n```\n\nOutput:\n```\n686722541\n1154462827\n452959606\n1235134497\n1421490552\n\
  1065881855\n424893046\n731473166\n1217844570\n437181304\n```\n\n### CLASSPATH\n\n\
  如果我们从当前文件夹以外的任何运行运行程序，它将无法运行。默认情况下，Java 运行时系统使用当前工作目录作为起点。\n\n因此，如果我们的包在当前目录或当前目录的子目录下，它就能被找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动计算机时都要输入此命令。但如果我们把此命令放在\
  \ `我的电脑属性高级环境变量` 中，那么就不需要再反复输入此命令了。\n\n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。要这样做，请输入：\n\
  \n```bash\njava –classpath c:\\javaprg p1.A own\n```\n\n**注意 4**-我们可以创建包的层级结构。要这样做，只需使用点将每个包名与其上一个包隔开。多级包语句的通用形式为：\n\
  \n`package package_name1[.package_name2][.package_name3];`\n\n包层次结构必须反映在 Java 开发系统的文件系统中。例如，包\
  \ `java.awt.Image` 需要存储在 `java\\awt\\image` (WINDOWS) 或 `java/awt/image` (UNIX)\
  \ 或 `java:swt:image` (MACINTOSH) 文件系统中。\n\n包层次结构代表了 Java 类和接口的组织。它并不代表类和接口的源代码组织。\n\
  \n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口定义，但编译器会为其中的每一个项生成一个包含 Java 字节码的独立类文件。类或接口可以使用包声明来指示其\
  \ Java 字节码被放置在特定的包中。\n\n*   包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\
  *   包 `java.awt` 有一个子包 `image` 以及许多类和接口。\n*   因为包 `java.awt` 有子包 `image`，它不能包含名为\
  \ `image` 的类或接口类型的声明。\n*   如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是该子包的全限定名。\n\
  *   如果存在一个名为 `mouse` 的包，且该包中有一个成员类 `Button`（这可能被称为 `mouse.Button`），则不能存在任何全限定名为为\
  \ `mouse.Button` 或 `mouse.Button.Click` 的包。\n*   一个源文件中最多出现一个包语句，且它必须是 Java 源文件的第一个语句。\n\
  \n### 类成员的可见性\n\n类和包都是封装和包含变量及方法命名空间与作用域的手段。包作为类和其他从属包的容器。类作为数据和方法代码的容器。\n\n类是 Java\
  \ 最小的抽象单元。由于类和包之间的相互作用，Java 处理类成员的五类可见性。\n\n1. 类内部的可见性。\n2. 同一包内子类中的可见性。\n3. 同一包内非子类的可见性。\n\
  4. 不同包间子类中的可见性。\n5. 既不在同一包内也不是子类的子类中的可见性。\n\n**注意 1**-顶层类和接口只有两种可能的访问权限：默认（default）和\
  \ `public`。\n\n**注意 2**-如果类被声明为 `public`，则可以使用其他代码来访问它。\n\n**注意 3**-如果类具有默认访问权限，则它只能被同一包内的其他代码访问。\n\
  \n**注意 4**-成员可见性只有在类可见的情况下才有意义。如果类的可见性修饰符是默认的，那么即使是类的 public 成员也只在包内可见。\n\n### 访问修饰符\n\
  \n![](img/image01230.jpeg)\n\n### JAR 文件（Java 档文件）\n\n为了压缩文件，我们使用如 winzip 等程序。JAR\
  \ 提供以下选项：\n\n| 选项 | 描述 |\n| :--- | :--- |\n| `c` | 创建新归档。 |\n| `C` | 执行期间更改目录。 |\n\
  | `f` | 文件列表第一个元素是要创建的归档名称。 |\n| `i` | 应提供索引信息。 |\n| `m` | 文件列表第二个元素是外部清单文件的名称。\
  \ |\n| `M` | 不创建清单文件。 |\n| `t` | 应列出归档内容。 |\n| `u` | 更新现有 JAR 文件。 |\n| `v` | 提供详细输出。\
  \ |\n| `x` | 从归档中提取的文件。 |\n| `o` | 不使用压缩。 |\n\n**创建 JAR 文件：**\n```bash\njar -cf\
  \ Myjar.jar pack1\n```\n这将创建一个名为 `Myjar.jar` 的 JAR 文件，包含 `pack1` 的所有文件。\n\n**提取\
  \ JAR 文件：**\n此命令用于提取 jar 文件（类似于 unzip）\n```bash\njar -xf Myjar.jar\n```\n\n**列出\
  \ jar 文件的内容：**\n以下命令列出 `Myjar.jar` 的内容。\n```bash\njar -tf Myjar.jar\n```\n\n**更新现有\
  \ JAR 文件：**\n以下命令用于更新文件。\n```bash\njar -uf Myjar.jar pack1\n```\n\n**创建可执行的 JAR\
  \ 文件：**\n```bash\njar -cmf mainClass Myjar.jar pack1\n```\n其中 mainClass 是一个文本文件，包含\
  \ `Main-Class: pack1.pack2.pack3.A`，并保存在 javaprg 文件夹中。\n\n**执行 jar 文件：**\n```bash\n\
  java -jar Myjar.jar\n```\n\n### 理论题\n\n1. 我们对包有什么理解？\n2. 解释所有的修饰符及其在不同包、子包、子类和其他类中的作用域范围。\n\
  3. JAR 文件有什么用？\n4. import 语句有什么用？\n\n# 第 9 章：接口\n\n## 简介\n\n接口本质上是类的一种。和类一样，接口包含方法和变量，但有一个主要的区别。区别在于接口只定义抽象方法和最终变量（常量/Constants）。这意味着接口不编写任何代码来实现这些方法，且数据字段只包含常量。\n\
  \n\n\n\n\n## 接口\n\n因此，类的责任是实现接口，该接口定义了实现这些方法的代码。接口在语法上与类相似，但它们缺少实例变量，且其方法声明时没有方法体。在实践中，这意味着我们可以定义接口，而不对它们的实现方式做任何假设。接口的目的是将类的接口与其实现分离来。接口仅仅定义了类必须做什么，而没有对实现做任何说明。接口只定义方法签名，不包含任何实例变量。\n\
  \n嵌套接口是指任何声明位于另一个类或接口体内的接口。顶层接口不是嵌套接口的接口。定义接口的语法与定义类非常相似。接口定义的通用形式如下：\n\n```java\n\
  interface interface_name {\n    variable declarations;\n}\n```\n\n这里 `interface`\
  \ 是关键字，`interface_name` 是任何有效的 java 标识符（与类名一样）。\n\n**注意：** 当我们定义一个接口时，默认它是 `public`\
  \ 且 `abstract`。\n\n## 接口修饰符\n\n顶层接口可以使用的修饰符是 `abstract` 和 `public`。即使我们不使用 `abstract`\
  \ 修饰符，接口也会隐式地声明为 `abstract`，因此不需要使用 `abstract` 修饰符。顶层接口的可见性可以是包级（package）或 `public`，就像顶层类一样。如果没有使用可见性修饰符，则接口的可见性假设为包级。\n\
  \n## 数据变量成员声明\n\n接口中只能定义常量。接口中的所有变量都是隐式的 `public`、`final` 和 `static`，这意味着它们不能被实现类更改。它们还必须用常量值进行初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 和 `final`。这意味着它是一个具有公共访问权限的静态变量。变量也被声明为 `final`，这意味着它必须在声明时赋值，并且之后不能再修改。关键字 `final`\
  \ 类似于 C/C++ 中的 `const`。\n\n## 方法声明\n\n方法声明仅包含方法列表，而不包含任何语句。它们在参数列表后以分号结束。它们本质上是抽象方法，接口内指定的任何方法都不能有默认实现。\n\
  \n接口中的所有方法默认都是 `public` 和 `abstract` 修饰符。我们不能在接口中声明静态方法。\n\n```java\npublic abstract\
  \ return_type method_name(parameter_list);\n```\n\n这里是一个包含两个变量和一个方法的接口定义示例。\n\n\
  ```java\ninterface item {\n    static final int code = 1001;\n    static final String\
  \ name = \"Matrix\";\n    abstract void display();\n}\n```\n\n**注意：** 方法的代码不包含在接口中，方法声明仅以分号结束。\n\
  \n另一个接口的示例：\n\n```java\ninterface area {\n    float pi = 3.142;\n    float compute(float\
  \ x, float y);\n    void show();\n}\n```\n\n### 扩展接口\n\n像类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以子类的方式继承子接口的所有成员。这是通过使用\
  \ `extends` 关键字实现的，如下：\n\n```java\ninterface interface_1 {\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1 {\n\
  \    void display();\n}\n```\n\n`interface_2` 将继承其中的常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `codes` 是像普通变量一样声明的。这在这里是被允许的，但接口中的所有变量都被视为常量、公共且静态，尽管这里没有 `public`、`static`\
  \ 和 `final` 关键字。\n\n我们可以将多个接口组合在一个接口中。以下声明是有效的：\n\n```java\ninterface interface_1\
  \ {\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface interface_2\
  \ {\n    void display();\n}\n\ninterface interface_3 extends interface_1, interface_2\
  \ { }\n```\n\n**注意：** 始终记住接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\n## 实现接口\n\n接口被用作“超类”，其属性被类继承。因此，有必要创建一个继承给定接口的类。一旦了接口，一个或多个类就可以实现该接口。\n\
  \n要实现一个接口，需要在类定义中包含 `implements` 子句，然后创建接口声明的方法。实现类必须提供所有接口的方法体，否则它必须声明为 `abstract`。实现类还可以扩展一个类并实现多个接口。\n\
  \n```java\nclass <class-name> implements <interface-name> { }\n```\n\nJava 不支持多继承，但支持多接口继承，如下：\n\
  \n```java\nclass <class-name> implements <interface-1>, <interface-2>, <interface-3>,\
  \ ....<interface-n> { }\n```\n\n**注意：** 当我们实现接口方法时，必须将其声明为 `public`。实现接口方法类似于重写，因此不能降低可见性。\n\
  \n**示例 9.1**\n\n```java\ninterface interface_1 {\n    void show(int x);\n}\n\nclass\
  \ class_1 implements interface_1 {\n    public void show(int x) { }\n}\n```\n\n\
  **抽象类的 9.2 示例**\n\n```java\ninterface common {\n    void push(int x);\n    int pop();\n\
  }\n\nabstract class stack implements common {\n    void disp();\n}\n```\n\n\n\n\n\
  \n在这里 `stack` 类没有实现 `push()` 和 `pop()` 方法。因此，我们必须将 `stack` 类声明为抽象类，这种技术被称为部分实现。\n\
  \n## 接口继承的各种形式：\n\n(a)\n![](img/image01232.jpeg)\n(单级接口继承)\n\n(b)\n![](img/image01233.jpeg)\n\
  (多级接口继承)\n\n(c)\n![](img/image01234.jpeg)\n(层级接口继承)\n\n(d)\n![](img/image01235.jpeg)\n\
  (混合接口继承)\n\n## 通过接口引用访问实现类对象\n\n我们可以声明使用接口而非类类型作为对象引用的变量。任何实现已声明接口的类的任何实例，都可以通过此类变量进行引用。当我们通过这些引用之一调用方法时，将根据根据所引用的接口的实际实例来调用正确版本。\n\
  \n这是接口的重要特性之一。要执行的方法将在运行时动态查找，这允许类在调用其方法的代码之后再创建。调用代码可以通过接口进行分发，而无需了解关于“调用者”的任何信息。这个过程类似于使用父类引用来访问子类对象。\n\
  \n由于在运行时动态查找方法与 Java 中的普通方法调用相比会产生巨大的开销，我们应该注意不要在性能关键的代码中随意接口。\n\n### 示例 9.3\n\n\
  ```java\ninterface Math_function {\n    void display(int x);\n}\n\nclass Sqrt implements\
  \ Math_function {\n    public void display(int x) {\n        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n    }\n}\n\nclass Log implements Math_function {\n\
  \    public void display(int x) {\n        System.out.println(\"log of x = \"+Math.log(x));\n\
  \    }\n}\n\nclass Math_Demo {\n    public static void main(String args[]) {\n \
  \       Math_function f1 = new Sqrt();\n        Math_function f2 = new Log();\n\
  \        f1.display(27);\n        f2.display(3);\n        Math_function f3;\n  \
  \      f3=f1; // 多态（赋值引用）\n        f3.display(30);\n        f3=f2; // 多态（赋值引用）\n\
  \        f3.display(5);\n    }\n}\n```\n输出：\n![](img/image01236.jpeg)\n\n## 接口的特点\n\
  \n- Interface 是一个关键字。\n- 接口可以声明为抽象，但它默认就是抽象的，因此不需要添加 abstract 关键字。\n- 所有变量始终是 public\
  \ static final 的。\n- 接口的所有方法必须在类中实现。\n- 实现类实现的所有方法必须是 public 的。\n- 接口仅包含方法的声明。\n\
  - 接口方法不能声明为 static。它们始终被声明为实例方法。\n- 类既不能缩小接口方法的访问权限，也无法在方法的 throws 子句中指定新的异常；因为尝试这样做等同于更改接口，这将是违法的。重写方法的标准也适用于实现接口方法。\n\
  - 所有方法在实现类中都需要被定义为 public。\n- 此处通过 abstract 关键字允许部分实现。\n- 无论类直接或间接实现多少接口，对于可能在接口中具有多个声明的方法，它只提供单一的实现。\n\
  - 方法原型声明也可以像类一样进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端实现此接口的类或扩展此接口的接口，那么客户端也可以直接访问此类常量，而无需使用全限定名。此类客户端继承了接口常量。\n\
  - 在接口常量多继承的情况下，任何名称冲突都可以使用相关常量的全限定名来解决。\n\n 接口变量\n\n接口中的所有变量始终是 public static 和\
  \ final 的，因为它们是实现访问数据类型和方法的公共部分。\n\n## 接口变量的内存管理\n\n静态变量在我们的程序加载时总是获取内存，它们占用独立的内存，不与任何对象的内存共享。它们也被称为常量变量。可以使用接口名和\
  \ `.` 运算符直接访问。\n\n### 示例 9.4\n\n```java\ninterface Static_Var {\n    int sun=1;\n\
  \    int mon=2;\n    int tues=3;\n    int wed=4;\n    int thurs=5;\n    int fri=6;\n\
  \    int sat=7;\n}\n\nclass Week_Day implements Static_Var {\n    public static\
  \ void main(String args[]) {\n        System.out.println(sun);\n        System.out.println(mon);\n\
  \        System.out.println(tues);\n        System.out.println(wed);\n        System.out.println(thurs);\n\
  \        System.out.println(fri);\n        System.out.println(sat);\n    }\n}\n\n\
  class Week_Day {\n    public static void main(String args[]) {\n        System.out.println(Static_Var.sun);\n\
  \        System.out.println(Static_Var.mon);\n        System.out.println(Static_Var.tues);\n\
  \        System.out.println(Static_Var.wed);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(Static_Var.thurs);\nSystem.out.println(Static_Var.fri);\nSystem.out.println(Static_Var.sat);\n\
  }\n```\n输出: 1\n2\n3\n4\n5\n6\n7\n\n### 示例 9.5\n\n```java\ninterface Two_Methods\
  \ {\n    void m1();\n    void m2();\n}\n\nclass Three_Methods implements Two_methods\
  \ {\n    public void m1() {\n        // m1 的方法体\n    }\n    public void m2() {\n\
  \        // m2 的方法体\n    }\n    public void m3() {\n        // m3 的方法体\n    }\n\
  }\n\nclass Methods_Demo {\n    public static void main(String args[]) {\n      \
  \  Two_methods tm1 = new Three_methods();\n        tm1.m1();\n        tm1.m2();\n\
  \        //tm1.m3(); 错误\n        Three_Methods tm2 = new Three_Methods();\n    \
  \    tm2.m3();\n    }\n}\n```\n\n注意：这里我们不使用接口引用调用 `m3()`，因为该方法在接口中并没有声明。因此，接口引用只能访问在接口块中声明的方法。否则，我们可以调用相同类的对象或扩展类的对象。\n\
  \n### 示例 9.6 在一个类中实现两个接口\n\n```java\ninterface Two_Methods {\n    void m1();\n \
  \   void m2();\n}\n\ninterface One_Method extends Two_Methods {\n    void m3();\n\
  }\n\nclass Three_Methods implements One_methods {\n    public void m1() {\n    \
  \    // m1 的方法体\n    }\n    public void m2() {\n        // m2 的方法体\n    }\n    public\
  \ void m3() {\n        // m3 的方法体\n    }\n}\n\nclass Methods_Demo {\n    public\
  \ static void main(String args[]) {\n        Three_methods tm1 = new Three_methods();\n\
  \        tm1.m1();\n        tm1.m2();\n        tm1.m3();\n    }\n}\n```\n\n非接口方法：当任何类实现了接口的方法并同时在类中定义了额外的方法时，我们可以说这些额外的方法是非非接口方法。使用接口的引用变量无法调用这些额外方法。\n\
  \n### 示例 9.7\n\n```java\ninterface Two_Methods {\n    void push(int x);\n    int\
  \ pop();\n}\n\nclass Stack implements Two_Methods {\n    int arr[] = new int[5];\n\
  \    int top= -1;\n    public void push(int item) {\n        if(top == 4) {\n  \
  \          System.out.println(\"Overflow\");\n            return;\n        }\n \
  \       top++;\n        arr[top]=item;\n    }\n    public int pop() {\n        if(top\
  \ == -1) {\n            System.out.println(\"Underflow\");\n            return -1;\n\
  \        }\n        int item = arr[top];\n        top--;\n        return (item);\n\
  \    }\n    void disp() {\n        for(int i=top;i>=0;i--) {\n            System.out.println(arr[i]);\n\
  \        }\n    }\n}\n\nclass Stack_Demo {\n    public static void main(String args[])\
  \ {\n        Two_Methods s1=new Stack();\n        s1.pop();\n        for(int i=0;i<5;i++)\
  \ {\n            s1.push(i+100);\n        }\n        s1.push(600);\n        System.out.println(\"\
  ----Displaying All Item----\");\n        s1.disp(); //非接口方法\n        System.out.println(\"\
  ----Removing All Items----\");\n        for(int i=0;i<5;i--) {\n            System.out.println(s1.pop());\
  \ // 下溢\n        }\n    }\n}\n```\n\n\n\n\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\
  \n# 第 ∞ 10 章\n\n## (String 和 StringBuffer)\n\n## 简介\n在 Java 中，字符串是类对象，通过两个类实现，即\
  \ `String` 和 `StringBuffer`。与 C 语言字符串相比，Java `String` 更可靠且可预测。这基本上是因为 C 语言缺乏边界检查。Java\
  \ 的 `String` 并不是字符数组，也不是 NULL 终止的。通常情况下，Java 不允许对 `String` 对象应用运算符。\n\n这条规则的唯一例外是\
  \ `+` 和 `+=` 运算符，它们会连接两个字符串并产生一个 `String` 对象。在 Java 中，字符数组不被视为字符串。Java 的 `String`\
  \ 类用于执行所有的字符串操作。`String` 类和 `StringBuffer` 类是 `java.lang` 包的一部分。\n\n### String 类\n\
  ```java\nString s1 = new String(\"matrix\");\nString s2 = \"matrix\";\nSystem.out.println(s1);\n\
  System.out.println(s1.length);\nSystem.out.println(\"matrix\".length);\n```\n\n\
  `String` 在 Java 中具有以下特性：\n\n#### [i] String 在 Java 中是一个对象\nString 代表一个字符序列，但与许多将\
  \ `String` 实现为字符数组的语言不同，Java 将字符串实现为 `string` 类型的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许\
  \ Java 提供全套功能支持，使得字符串处理变得非常方便。此外，字符串对象可以通过多种方式构造，从而在需要时易于获取字符串。\n\n#### [ii] String\
  \ 是不可变的\nString 是不可变的，也就是说，我们在创建字符串后无法更改该字符串。然而，声明为 `String` 引用的变量可以随时更改以指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们我们需要一个现有字符串的修改版本时，就会创建一个包含修改内容的新字符串对象。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串比可更改的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的情况，有一个名为 `StringBuffer` 的伴随类，它的对象包含在创建后可以被修改的字符串。\n\n#### [iii] String\
  \ 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在任何类中扩展 `String` 类。这允许某些优化以提高常用字符串操作的性能。\n\
  \n### String 类的构造函数与方法\n\n| # | 方法 |  |\n| :--- | :--- | :--- |\n| 1 | `public String()\
  \ ` | 初始化新创建的 `String` 对象，使其表示一个空字符序列。`String s1 = new String();` |\n| 2 | `public\
  \ String(String str)` | 初始化新创建的 `String` 对象，使其表示与参数相同的字符序列；换句话说，新创建的字符串是参数字符串的拷贝。`String\
  \ s1 = new String(\"Matrix\"); String s2 = new String(s1);` 字符串 `s2` 是字符串 `s1` 的拷贝。虽然内容相同，但\
  \ `s1` 和 `s2` 指向不同的字符串对象。 |\n| 3 | `public String(char ch[])` | 分配一个新的 `String`，使其表示当前字符数组参数中包含的字符序列。`char\
  \ ch[] = {'a', 'b', 'c'}; String s1 = new String(ch);` //`s1` 将持有 \"abc\" |\n| 4\
