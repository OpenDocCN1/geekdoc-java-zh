  \ i++) {\n            System.out.println(s[i]);\n        }\n    }\n}\n```\n\n###\
  \ 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其字符串表示时，它是通过调用 `String` 类定义的重载字符串转换方法\
  \ `valueOf()` 来的。`valueOf()` 是一个针对所有简单类型和 `Object` 类型重载的静态方法。\n\n对于简单类型，`valueOf()`\
  \ 返回一个包含调用时值的人类可读等价值的字符串。对于对象，`valueOf()` 调用对象上的 `toString()` 方法。\n\n每个类都继承了 `toString()`，因为它们是由\
  \ `Object` 类定义的。然而，`toString()` 的默认实现通常是不够的。它显示类名，后跟一个符号“@”，然后是对象 ID（例如 `Box@ab1342`），这通常没有用处。对于我们创建的大多数重要类，我们希望重写\
  \ `toString()` 并提供我们自己的字符串表示。\n\n#### 示例 10.2\n\n```java\nclass A {\n    private\
  \ int x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n    \
  \    x = x1;\n        y = y1;\n    }\n}\nclass ToString1 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1);\
  \ // 调用 Object 类的 toString()\n        String s1 = \"Object a1 is \" + a1; // 对象与字符串拼接\n\
  \        // 再次调用 Object 的 toString()\n        System.out.println(s1);\n    }\n}\n\
  ```\n**输出：**\n```\nA@3e25a5\nObject a1 is A@3e25a5\n```\n\n#### 示例 10.3:-\n\n```java\n\
  class A {\n    private int x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int\
  \ x1, int y1) {\n        x = x1;\n        y = y1;\n    }\n    public String toString()\
  \ {\n        return (x + \",\" + y);\n    }\n}\nclass ToStringTest2 {\n    public\
  \ static void main(String args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1);\
  \ // 调用 A 类的 toString()\n        String s1 = \"Object a1 is \" + a1; // 对象与字符串拼接\n\
  \        // 再次调用 A 的 toString()\n        System.out.println(s1);\n    }\n}\n```\n\
  **输出：**\n```\n5,6\nObject a1 is 5,6\n```\n\n#### 示例 10.4:-\n\n```java\nimport java.util.*;\n\
