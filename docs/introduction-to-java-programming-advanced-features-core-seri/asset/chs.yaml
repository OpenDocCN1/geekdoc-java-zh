  \     s[i] = sc.next();\n        }\n        // sorting\n        for (int i = 0;\
  \ i < n - 1; i++) {\n            for (int j = i + 1; j < n; j++) {\n           \
  \     if (s[i].compareTo(s[j]) > 0) {\n                    String t = s[i];\n  \
  \                  s[i] = s[j];\n                    s[j] = t;\n               \
