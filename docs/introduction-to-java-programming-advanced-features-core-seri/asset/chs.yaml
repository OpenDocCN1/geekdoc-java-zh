  \ 中的绘图\n\n## 介绍\n许多类型的 `AWT` 组件（例如按钮和滚动条）的外观由底层窗口系统决定。其他组件类型，特别是 `applets`、`frames`、`panels`\
  \ 和 `canvases` 没有内在外观。如果我们我们将这些类中的任何类仅仅作为容器使用，并希望我们的组件看起来有用，我们必须提供实现该组件外观的代码。\n\n\
  每个组件都关联着一个图形上下文（graphics context）。该图形上下文与组件相关的帧缓冲区对应。\n\n我们可以使用 `Graphics Context`\
  \ 支持的方法在组件上进行绘制。绘制在 `Graphics context` 上的任何内容都会显示在组件上。\n\n在任何组件上绘图的正确方法是重写它的 `paint()`\
  \ 方法并提供适当的代码。\n\n`paint()` 方法有一个 `Graphics` 类型的参数，代表组件的 `Graphics Context`。也可以在不使用\
  \ `paint()` 方法的情况下在组件上绘图，尽管这种方法并不被推荐。\n\n### paint() 方法和图形上下文\n以下示例中 `frame` 的一个有趣点是，没有对\
  \ `paint()` 方法进行任何显式调用；该方法仅仅是被提供了。环境似乎很好地在正确的时刻调用了 `paint()`。\n\n在组件上进行绘图是通过调用 `Graphics\
  \ context`（它是 `Graphics` 类的实例）来实现的。图形上下文知道如何渲染到单个目标。`Graphics Context` 可以渲染到的三个介质是：\n\
  \n1. 组件。\n2. 图像。\n3. 打印机。\n\n任何类型的组件都可以与 `Graphics context` 关联。这种关联是永久的；上下文不能重新分配给新的组件。\n\
  \n按钮、Choices、Checkboxes、Labels、Scrollbars、TextFields 和 TextAreas 通常不需要程序员级别的渲染。大多数情况下，这些组件仅使用它们从组件父类继承的\
  \ `paint()` 版本。\n\n然而，存在四类“空白”组件，它们没有默认外观，并且会显示为空矩形，除非它们被子类化并赋予了 `paint()` 方法。\n\
  \n\n\n\n\n这四个组件类是：\n\n* `Applet`\n* `Canvas`\n* `Frame`\n* `Panel`\n\n### 示例 19.1\
  \ 扩展 `Frame` 类并重写 `paint()` 方法以改变框架的外观。\n\n```java\nimport java.awt.*;\npublic class\
  \ SimplePaint extends Frame {\n    public static void main (String args[]) {\n \
  \       Frame f=new SimplePaint();\n        f.setSize(200,200);\n        f.setVisible(true);\n\
  \    }\n    public void paint (Graphics g) {\n        g.setColor(Color.white);\n\
  \        g.fillRect(0,0,300,300);\n        g.setColor(Color.grey);\n        g.fillOval(30,30,50,50);\n\
  \    }\n}\n```\n\n输出：\n\n![](img/image01295.jpeg)\n\n当我们对组件类进行子类化并赋予子类自己的 `paint()`\
  \ 方法时，环境会在适当的时间调用该方法，并传入一个 `Graphics` 实例。\n\n### graphics 类支持的操作\n\ngraphics 类（`graphics`\
  \ 上下文）提供的四大类操作是：\n\n* 选择颜色。\n* 选择字体。\n* 绘制与填充。\n* 裁剪。\n\n#### 选择颜色\n\n通过调用 `setColor()`\
  \ 方法来选择颜色。所需的参数是 `Color` 类的实例。\n\n有 13 种预定义的颜色，可以通过 `Color` 类的 `static final` 变量访问。（这些变量本身是\
  \ `Color` 类的实例。这让一些人感到不安，但 Java 处理这类事情没有问题）。预定义的颜色有：\n\n1. `Color.black`\n2. `Color.blue`\n\
  3. `Color.cyan`\n4. `Color.darkGray`\n5. `Color.gray`\n6. `Color.green`\n7. `Color.gray`\n\
  8. `Color.magenta`\n9. `Color.orange`\n10. `Color.pink`\n11. `Color.red`\n12. `Color.white`\n\
  13. `Color.yellow`\n\n如果我们我们需要不在列表中的颜色，可以自己构造。`Color` 构造函数有几个版本，最简单的是：\n\n`Color(int\
  \ redLevel, int greenLevel, int blueLevel)`\n\n三个参数是主色在 0 到 255 范围内的强度级别。颜色是相加的，这意味着它们的混合方式像光，而不是像颜料。\n\
  \n* `new Color(0,0,0)`：黑色（光的缺失）\n* `new Color(255,0,0)`：红色（仅包含红色色调）\n* `new Color(255,255,255)`：白色（所有颜色同时发光）\n\
  \n下面的代码片段列出了 `paint()` 方法的第一部分，它将其图形上下文的颜色设为绿色：\n\n```java\npublic void paint(Graphics\
  \ g) {\n    Color c= new Color(170,255,170);\n    g.setColor(c);\n}\n```\n\n在上述代码调用\
  \ `setColor()` 之后，所有的图形都将绘制成绿色，直到下一次调用 `setColor()`。调用 `setColor()` 不会改变已经绘制内容的颜色；它影响的是后续的操作。\n\
  \n#### 选择字体\n\n设置图形上下文的字体就像设置绘图操作将使用新字体，而之前绘制的字符串则不受影响。在设置字体之前，我们必须先创建一个。`Font`\
  \ 类的构造函数如下：\n\n`Font(String fontName, int style, int size)`\n\n第一个参数是字体的名称。字体的可用性取决于平台。我们可以通过如下调用工具包上的\
  \ `getFontList()` 方法来获取可用字体名称列表，返回结果为字符串数组：\n\n`String fontNames[]= Toolkit.getDefaultToolkit().getFontList();`\n\
  \n有三种样式：`style` 参数可以传递以下任意一个常量：\n\n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\
  \n下面的代码片段将图形上下文的字体设为 24 点加粗无衬线字体：\n\n```java\nFont f = new Font(\"SansSerif\",Font.BOLD,24);\n\
  gc.setFont(f);\n```\n\n我们可以通过传递样式的之和来指定样式的组合，例如加粗斜体，如下：\n\n`Font.BOLD + Font.ITALIC`\n\
  \n### 绘制与填充\n\n`graphics` 类的所有渲染方法都指定了它们所渲染形状的坐标位置。每个组件都有自己的坐标系，原点位于组件的左上角，x 向右增加，y\
  \ 向下增加。下图显示了组件坐标系：\n\n![](img/image0296.jpeg)\n\ngraphics 上下文类并没有大量的绘图方法（复杂的渲染由\
  \ `2d`、`3d` 和动画等扩展 API 处理）。我们需要了解的图形类中的方法有：\n\n| 方法 |  |\n| :--- | :--- |\n| `void\
  \ drawLine(int x1,int y1, int x2, int y2)` | 在此图形上下文坐标系中使用当前颜色，在点 `(x1,y1)` 和 `(x2,y2)`\
  \ 之间绘制一条线。 |\n| `void drawRect(int x, int y, int width, int height)` | 绘制指定矩形的轮廓。\
  \ |\n| `void fillRect(int x, int y, int width, int height)` | 填充指定的矩形。 |\n| `void\
  \ drawOval(int x, int y, int width, int height)` | 绘制指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int\
  \ x, int y, int width, int height)` | 用当前颜色填充指定矩形边界的椭圆。椭圆由矩形边界框定义。椭圆位于框内，并在每边的中点相切。\
  \ |\n| `void drawArc(int x, int y, int width, int height, int startAngle, int arcAngle)`\
  \ | 绘制覆盖指定矩形的圆形或椭圆弧轮廓。 |\n| `void fillArc(int x, int y, int width, int height, int\
  \ startangle, int arcangle)` | 填充覆盖指定矩形的圆形或椭圆弧。弧是椭圆的一部分。我们像 `drawOval()` 和 `fillOval()`\
  \ 一样指定椭圆的边界框。还需要指定弧的终点，通过指定起始角度和弧所扫描的角度来实现。填充弧是由弧本身以及从椭圆中心到弧端点的两个半径围成的区域。 |\n| `void\
  \ drawPolygon(int[]xPoints, int[]yPoints, int nPoints)` | 使用 x y 坐标数组绘制闭合多边形。 |\n\
  | `void fillPolygon (int[] xPoints , int[]yPoints, int nPoints)` | 使用 x y 坐标数组填充闭合多边形。多边形是具有任意数量顶点的封闭图形。\
  \ |\n| `void drawPolyLine(int[] xPoints, int[]yPoints , int nPoints)` | 根据 x y 坐标数组绘制一系列连接线。折线与多边形相似，但它是开放的而非闭合的。\
  \ |\n\n\n\n\n\n| 方法签名 | `void drawString(String str, int x, int y)` | 使用此图形上下文当前的字体和颜色绘制指定字符串的文本。`x`、`y`\
  \ 参数指定字符串基准线（baseline）的左边缘。带有下伸部 get 字符（在大多数字体中为 g, j, p, q 和 y）延伸到基准线以下。文本坐标是相对于基准线的，这一点非常重要。例如，在简单的文本中，我们可能会尝试在\
  \ `(0,0)` 处绘制字符串，期望它出现在区域的左上角。然而，由于基准线的存在，我们只能看到字符串的伸部，这可能意味着我们什么也看不到。默认情况下，图形上下文使用关联组件的字体，但我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。 |\n| --- | `boolean drawImage(Image img, int x, int y,\
  \ ImageObserver observer)` | 绘制当前可用的所有指定图像。这里，`img`是要渲染的图像，`x` 和 `y` 是目标组件中图像左上角的坐标。图像观察者必须是一个实现\
  \ `ImageObserver` 接口的对象。图像是矩形像素值集合离屏表示。Java 的图像支持非常复杂。目前，假设我们某种方式获取了一个图像（即 `java.awt.Image`\
  \ 类的实例），我们想要使用特定的图形上下文将其渲染到屏幕。这样做的方法是调用图形上下文的 `drawImage()` 方法。 |\n\n### 示例 19.2\n\
  \n此示例说明了如何创建一个图像，然后使用其图形上下文在其进行绘制。然后可以使用 `drawImage()` 方法在 applet 窗口中显示图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() {\n        im = createImage(100,50);\n\
  \        Graphics imgc=im.getGraphics();\n        imgc.setColor(Color.gray);\n \
  \       imgc.fillRect(0,0,100,50);\n        imgc.setColor(Color.black);\n      \
  \  imgc.fillOval(0,0,5,0);\n    }\n    public void paint(Graphics g) {\n       \
  \ g.drawImage(im,10,10,this);\n    }\n}\n```\n输出: ![](img/image0297.jpeg)\n\n###\
  \ 示例 19.3\n\n此示例说明了如何从现有图像创建一个图像对象。然后可以使用 `drawImage()` 方法在 applet 窗口中显示该图像。\n\n\
  ```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.*;\n/*\n<applet\
  \ code=\"PaintImage\" width=500 height=500>\n</applet>\n*/\npublic class PaintImage\
  \ extends Applet {\n    private Image im;\n    public void init() {\n        try\
  \ {\n            im=getImage(new URL(\"file:///c:/matrix/logo.gif\"));\n       \
  \     //im=getImage(new URL(\"http://127.0.0.1/logo.gif\"));\n        } catch (MalformedURLException\
  \ e) {\n            System.out.println(e);\n        }\n    }\n    public void paint(Graphics\
  \ g) {\n        g.drawImage(im,10,10,this);\n    }\n}\n```\n\n### 裁剪 (Clipping)\n\
  \n程序员对图形上下文的大多数调用都涉及颜色选择或绘制和填充。不常用的操作是裁剪。裁剪简单来说限制图形上下文可以修改的区域。\n\n每个图形上下文，即每个 `Graphics`\
  \ 类的实例都有一个裁剪区域（clip region），该区域定义了关联组件的所有或部分。当我们调用 `Graphics` 类的任一个 `drawXXX()`\
  \ 或 `fillXXX()` 方法时，只有位于图形上下文裁剪区域内的像素会被修改。\n\n图形上下文的默认裁剪区域是关联组件的整个可见区域。有方法可以获取和修改裁剪区域。考虑以下\
  \ `paint` 方法。\n\n### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends\
  \ Frame {\n    public static void main(String args[]) {\n        Frame f=new Clip();\n\
  \        f.setSize(30,30);\n        f.setVisible(true);\n    }\n    public void\
  \ paint(Graphics g) {\n        for(int i=0; i<300; i=i+100) {\n            for(int\
  \ j=30; j<330; j=j+100) {\n                g.fillOval(i,j,100,100);\n          \
  \  }\n        }\n    }\n}\n```\n输出: ![](img/image0299.jpeg)\n\n上述程序的 `paint()` 方法绘制了一个点图案。考虑当这是一个\
  \ 200*200 像素的 applet frame 的 `paint()` 方法时会发生什么。由于计数器一直到 500，该方法尝试在 applet frame\
  \ 边界之外绘制。这并不是问题，因为图形上下文默认的裁剪区域与 applet frame 重合。\n\n要为图形上下文设置矩形裁剪，我们可以调用 `setClip(x,y,\
  \ width, height)` 方法，传入四个描述所需矩形位置和大小的 int。例如，上面的代码可以修改如下：\n\n### 示例 19.5\n\n```java\n\
  import java.awt.*;\nclass Clip2 extends Frame {\n    public static void main(String\
  \ args[]) {\n        Frame f=new Clip2();\n        f.setSize(300,330);\n       \
  \ f.setVisible(true);\n    }\n    public void paint(Graphics g) {\n        g.setClip(50,80,200,200);\n\
  \        for(int i=0; i<300; i=i+100) {\n            for(int j=30; j<330; j=j+100)\
  \ {\n                g.fillOval(i,j,100,100);\n            }\n        }\n    }\n\
  }\n```\n\n\n\n\n\n22. } }\n\n输出：\n\n![](img/image01300.jpeg)\n\n如上所示，现在绘画被裁剪到 300\
  \ * 300 Applet 框架中心的 200 * 200 矩形内。\n\n裁剪（Clipping）本身是一项值得了解的知识。当环境需要修复组件的暴露部分时，裁剪也会发挥作用。\n\
  \n### 关于 `paint()` 方法和图形上下文的总结：\n\n`Graphics` 上下文专门用于单个组件。要在组件上进行绘制，我们调用图形上下文的 `drawXXXX()`\
  \ 和 `fillXXXX()` 方法。若要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()` 方法。\n\
  \n### GUI 线程与绘制\n\nJava 运行时环境会创建并控制其在后台运行的各个线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接收用户输入事件以及调用需要绘制组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并非都由环境生成。Java 程序当然进行自己的调用，可以是直接调用，也可以通过 `repaint()`\
  \ 方法间接调用。\n\n还可以使用组件的图形上下文在组件上绘制。这种方法不需要调用 `paint()` 或 `repaint()` 方法。\n\n在组件上绘制的不同方法如下：\n\
  \n(i) 获取组件的图形上下文后直接绘制。\n(ii) 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）。\n(iii) 显式调用 `paint()`\
  \ 方法。\n(iv) 显式调用 `repaint()` 方法，然后其间接调用 `paint()` 方法。\n\n### 在获取组件图形上下文后直接绘制\n\n\
  由于可以使用 `getGraphics()` 方法获取组件 `Graphics` 上下文的引用，人们很容易认为自己可以从任何方便的方法直接在组件上绘制。通常，这种方法存在严重缺陷。\n\
  \n假设我们有一个 Applet，想要在最近一次鼠标点击的位置画一个红点。Applet 的其余部分应该是黄色。假设该 Applet 正在处理自己的鼠标事件。我们可能会考虑如下这样的事件处理器：\n\
  \n示例 19.6：\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n3. class\
  \ PaintApproach extends Frame implements MouseListener\n4. {\n5. public static void\
  \ main (String args [])\n6. {\n7. PaintApproach f = new PaintApproach ();\n8. f.setSize(300,300);\n\
  9. f.addMouseListener(f);\n10. f.setVisible(true);\n11. }\n12. public void mouseEntered(MouseEvent\
  \ e) { }\n13. public void mouseExited(MouseEvent e) { }\n14. public void mousePressed(MouseEvent\
  \ e) { }\n15. public void mouseReleased(MouseEvent e) { }\n16. public void mouseClicked(MouseEvent\
  \ e)\n17. {\n18. System.out.println(\"Mouse Clicked...\");\n19. Graphics g = getGraphics();\n\
  20. g.setColor(Color.yellow);\n21. g.fillRect(0,0, getSize().width, getSize().height);\n\
  22. g.setColor(Color.Red);\n23. g.fillOval(e.getX()-10, e.getY()-10,20,20);\n24.\
  \ }\n```\n\n### 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）\n\n自发绘制并不是一个正式术语，但它通过程序发生。例如，当每个\
  \ Applet 启动时，在 `init()` 方法完成后不久，就会调用 `paint()`。是 GUI 线程执行了这些调用。每个带有 GUI 的 Applet\
  \ 都有一个 GUI 线程。\n\n当组件需要重绘时，GUI 线程会自发调用 `paint()`：\n\n*   暴露后。\n*   最小化后。\n*   首次显示后。\n\
  \n当浏览器返回到之前包含该 Applet 的页面时（只要该 Applet 至少部分可见）。\n\n### 显式调用 `paint()` 方法\n\n如果在组件上的绘制操作是在\
  \ `paint()` 方法以外的方法中执行的，组件可能不会刷新。如果绘制是在 `paint()` 方法中进行的，那么当我们显式调用 `paint()` 方法以及\
  \ GUI 线程隐式调用 `paint()` 方法时，它都会被显示。\n\n上一个示例中的 `mouseClicked()` 方法被重写，以便在每次鼠标点击发生时只需修改实例变量\
  \ `mouseX` 和 `mouseY`。\n\n红点仅在 `paint()` 方法中绘制，这样即使 Applet 被覆盖并重新暴露，它也能被修复。\n\n\
  示例 19.7：\n\n上一节中的示例经过修改，使得组件显示在上述情况下可以得到刷新。这种现象是因为红点是在 `paint()` 方法中绘制的。\n\n```java\n\
  1. import java.awt.*;\n2. import java.awt.event.*;\n```\n\n\n\n\n\n### PaintApproach1\
  \ 实现\n\n```java\npublic class PaintApproach1 extends Frame implements MouseListener\
  \ {\n    int mouseX, mouseY;\n\n    public static void main(String arg[]) {\n  \
  \      PaintApproach1 f = new PaintApproach2();\n        f.setSize(300, 300);\n\
  \        f.addMouseListener(f);\n        f.setVisible(true);\n    }\n\n    public\
  \ void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent e)\
  \ {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked...\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n \
  \       Graphics g = getGraphics();\n        paint(g);\n    }\n\n    public void\
  \ paint(Graphics g) {\n        g.setColor(Color.yellow);\n        g.fillRect(0,\
  \ 0, getSize().width, getSize().height);\n        g.setColor(Color.red);\n     \
  \   g.fillOval(mouseX - 10, mouseY - 10, 20, 20);\n    }\n}\n```\n\n### 显式调用 repaint()\
  \ 方法，从而间接调用 paint() 方法\n\n显式调用 `paint()` 方法可能会导致两个严重的问题。\n\n第一个问题是 GUI 线程会根据需要随时调用\
  \ `paint()` 方法。这通常发生在需要处理窗口暴露（exposure）时。这可能会导致线程交互问题。坦率地说，我们会发现即使使用首选方法，可能仍然需要处理这些问题中的某些，因为\
  \ `paint()` 方法将使用我们正在其他线程中修改的数据。然而，如果我们允许只在 GUI 线程中调用 `paint()`，就能将该问题降到最低。\n\n\
  第二个问题是关于 CPU 使用率的。考虑以下情景：我们的程序定期收到通知，要求它用动画的下一帧或类似的连续移动图形更新显示。此外假设绘图过程是复杂且耗时的。如果我们简单地调用整个\
  \ `paint()` 方法，可能在帧帧发生时我们只完成了一部分的绘图。这将导致程序所有时间都花在绘图上，而且绘图会越来越落后于应该显示的进度。\n\n这些问题可以通过使用首选的处理方法来简单地解决。其核心思想是主程序维护描述应该呈现给用户的绘图数据，但不直接调用绘图程序。相反，程序请求\
  \ GUI 线程运行绘图程序，这大致与线程处理暴露时的方式相同。为了支持这种方法，GUI 系统提供了一个名为 `repaint()` 的方法。该方法定义在 `Component`\
  \ 类中，因此 GUI 中的任何可见对象都可以使用。当我们调用此方法时，我们是在向 GUI 线程发出请求，让它执行绘图程序。GUI 线程会在合理时间内完成，尽管这可能会受到其他高优先级活动的限制。这种方法确保了\
  \ GUI 与线程之间的交互减少到最低。自然地，我们必须确保在数据处于不一致状态时 GUI 线程绝不会使用它。然而，使用同步或双缓冲技术可以很容易地实现这一点。这种行为的另一个结果是，无论程序尝试做多少，系统都会与当前帧保持同步。例如，如果在\
  \ GUI 线程能够处理第一次调用之前，我们调用了十次 `repaint()` 方法，那么结果将是执行一次绘画系统。这意味着程序员可以编写代码，在特定平台上获得最佳性能，而在任何其他平台上都能良好地运行。以下代码实现了这种方案。\n\
  \n### 示例 1.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\nclass PaintApproach2\
  \ extends Frame implements MouseListener {\n    int mouseX, mouseY;\n\n    public\
  \ static void main(String args[]) {\n        PaintApproach2 f = new PaintApproach2();\n\
  \        f.setSize(300, 300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n\
  \    }\n\n    public void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent\
  \ e) {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked …\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n  \
  \      repaint();\n    }\n\n    public void paint(Graphics g) {\n        g.setColor(Color.white);\n\
  \        g.fillRect(0, 0, getSize().width, getSize().height);\n        g.setColor(Color.gray);\n\
  \        g.fillOval(mouseX - 10, mouseY - 10, 20, 20);\n    }\n}\n```\n\n\n\n\n\n\
  线程之间的交互（尝试绘制的前台线程与 GUI 线程之间）是控制且可预测的。\n\n虚拟机永远不会被绘制操作所淹。\n\n当所有代码都以此方式编写时，对于尝试调试代码的其他程序员来说，就不会有任何意外。\n\
  \n尽管这种方法效果良好，但在某些情况下仍需要进一步的改进：动画。如果我们完全按照描述的方法进行操作，可能会注意到动画在运行时会产生不愉快的闪烁。\n\n###\
  \ 平滑动画\n\n重绘机制的默认行为中有一个我们可能并不总是需要的特性：系统在响应我们的 `repaint()` 调用的准备阶段，会清除我们的绘制区域。这会导致动画和其他实时绘制出现不愉快的闪烁。事实证明，当我们调用\
  \ `repaint()` 时，GUI 线程并没有调用 `paint()`；而是调用 `update()` 方法。`update()` 的默认行为是做两件事：清除背景，然后调用\
  \ `paint`。如下所示：\n\n```java\npublic void update (Graphics g)\n{\n    g.clearRect\
  \ (0,0,width, height);\n    paint(g);\n}\n```\n\n我们可能会合理地问，为什么 `repaint()` 一开始就清除窗口，因为这会导致闪烁。嗯，在许多情况下，绘制是使用在背景上绘制线、矩形、椭圆等完成的。\n\
  \n如果我们试图制作一个旋转的棒子，我们需要在绘制新线之前移除旧线。考虑此问题的另一种方式是：如果我们试图绘制一个新图形，应该先擦除旧的图形。\n\n那么，我们如何让新图形出现，而不需要先清除整个显示器呢？我们只需要找到另一种移除旧图形的方法。通用方法是确保我们在每次绘制帧时都绘制整个图形——包括背景和前景。如果我们能安排好这一点，就不需要清除组件，闪烁也就消失了。\n\
  \n为了防止组件在调用 `paint()` 之前被清除，我们只需要重写 `update()` 方法，使其直接调用 `paint()`，如下所示：\n\n```java\n\
  public void update (Graphics g)\n{\n    paint (g);\n}\n```\n\n这是一项标准技术并且工作非常完美，前提是我们的\
  \ `paint()` 方法确实刷新了显示器的所有像素。处理此问题的特别简单的方法是使用离屏图像来存储应该显示在显示器上的绘制内容。\n\n这种技术在速度或内存方面并不总是最高效的，但它简单且易于实现，并且通常被\
  \ Java 程序员所理解。\n\n![11](img/image01214.jpeg) ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\
  \ ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\
  \n# 第 20 章\n\n## (Java.Lang.Object 类)\n\n字体 简介\n\n`java.lang` 包中的 `Object` 类是 Java\
  \ 中所有层次结构的根。所有类都直接或间接地继承 `Object` 类。\n\n即使你写了一个简单的类（即它没有继承任何基类），它也会隐式地继承内置的 `Object`\
  \ 类。因此，该类的特征将在所有类中可用。\n\n### Object 类中的方法\n\n`object` 类定义了以下方法，所有类都继承了这些方法：\n\n\
  1. `public int hashCode()`\n2. `public boolean equals(Object obj)`\n3. `public final\
  \ Class getClass()`\n4. `public String toString()`\n5. `protected void finalize()\
  \ throws Throwable`\n6. `protected Object clone() throws CloneNotSupportedException`\n\
  7. `public final void wait(long timeout) throws InterrputedException`\n8. `public\
  \ final void wait(long timeout, int nanos) throws InterrputedException`\n9. `public\
  \ final void wait() throws InterrputedException`\n10. `public final void notify()`\n\
  11. `public final void notifyAll()`\n\n#### 1. `public int hashCode()`\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间被保证是一致的。\n\
  \n#### 2. `boolean equals(Object obj)`\n如果每个对象都被认为是唯一的，那么没有必要重写 `Object` 类的 `equals()`\
  \ 方法。该方法比较对象引用的相等性。\n\n#### 3. `final Class getClass()`\n返回对象的运行时类，该类在运行时由 `java.lang.Class`\
  \ 类的对象表示。\n\n**示例 20.1：** 下面的示例说明了此方法可以用于获取任何 Java 对象对应的 `Class` 对象。我们随后可以使用 `Class`\
  \ 类的方法通过反射/内省来获取有关对象类的信息。`getMethods()` 和 `getFields()` 将显示所有公共成员，而 `getDeclaredMethods()`\
  \ 和 `getDeclaredFields()` 将显示所有的。\n\n```java\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Field;\nclass DispClass1 {\n    public static void main(String\
  \ args[]) {\n        String s = new String(\"Hello\");\n        Class c = s.getClass();\n\
  \        Method m[] = c.getMethods();\n        System.out.println(\"…… Methods (\"\
  \ + m.length + \")……”);\n        for(int i=0; i < m.length; i++)\n            System.out.println(m[i]);\n\
  \        Field f[] = c.getFields();\n        System.out.println(\"……Public Fields\
  \ (\" + f.length + \")……”);\n        for(int i=0; i< f.length; i++)\n          \
  \  System.out.println(f[i]);\n        m = c.getDeclaredMethods();\n        System.out.println(\"\
  ……Declared Methods (\" + m.length + \")……”);\n        for(int i=0; i < m.length;\
  \ i++)\n            System.out.println(m[i]);\n    }\n}\n```\n\n\n\n\n```java\n\
