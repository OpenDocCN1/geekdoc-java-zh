  Sum is \" + sum);\n    }\n}\n```输出：Sum is 11\n\n## 示例 2 程序 - 交换两个数字（Swap.Java）\n\
  ```java\nclass Swap {\n    public static void main(String args[]) {\n        int\
  \ a=5,b=7;\n        t = a;\n        a = b;\n        b = t;\n        System.out.print(\"\
  After Swap Values are \" + a +\",\" + b);\n    }\n}\n```\n输出：After Swap Values are\
  \ 7,5\n\n## 注释\n有 3 类型的注释：\n- 单行注释：`//`\n- 多行注释：`/* */`\n- 文档注释：`/** */`\n\n- 每一个\
  \ Java 程序必须包含一个类。在 Java 中，`main()` 方法只能定义在类内部。\n- 源文件可以有任意数量的类或接口定义，但最多有一个公共类（public\
  \ class）。\n- 源文件可能包含也不包含带有 `main()` 方法的类，但独立程序始终从 `main()` 方法开始执行。因此，我们想要开始执行的类必须内部定义了\
  \ `main()` 方法。\n- `main()` 方法必须具有以下签名：`public static void main(String[])`\n\n注意\
  \ - Java 中将方法原型称为签名（signature）。\n- `public` 关键字表示该方法可以从任何地方访问。`main()` 方法必须声明为 `public`，因为它是由代码调用的，而该代码是\
  \ JVM 的一部分并位于包含 `main()` 方法类的外部。\n- `static` 关键字表示 `main()` 是一个类级方法，可以在调用 `main()`\
  \ 之前不创建任何对象即可调用，任何对象的创建只发生在 `main()` 方法内部。\n- 在 `main()` 方法前的 `void` 关键字表示它不返回任何值。\n\
  - `main()` 方法接收一个参数，即 `String` 数组。数组的每个元素代表一个命令行参数。\n- `System` 是一个预定义类，提供访问系统的接口，`out`\
  \ 是连接到控制台的输出流。`print()` 方法可显示任何类型的信息。\n\n## Java 程序结构\n所有 Java 源文件必须以 `.java` 结尾。Java\
  \ 是区分大小大小的。注意在上面的程序中，类 `Sum` 和 `System` 的第一个字母是大写的。最好将 Java 程序保存为与类名相同的文件，但并非强制要求。如果类被声明为\
  \ `public`，则强制将该类保存到与类同名的文件中。一个文件可以只包含一个公共类，但可以包含许多非公共类。如果一个文件包含多个类，则编译后每个类会被放入以类名命名的、使用\
  \ `.class` 扩展名的独立输出文件中。\n\n- 文档部分 - 文档部分包含一组注释行，给出程序名称、作者和其他程序员在以后阶段参考的细节。注释解释了算法的“为什么”和“是什么”。除了单行、多行注释外，Java\
  \ 还使用了第三种注释样式 `/**...*/`。\n- 包声明 - 源文件最多有一个包声明（package statement）。如果存在包声明，它必须是 Java\
  \ 程序中的第一个语句。只有注释可以出现在包声明之前。\n- 导入语句 - 源文件可以有零或多个导入语句（import statements）。导入语句类似于\
  \ C/C++ 中的 `#include`。如果存在，所有导入语句必须位于包声明之后类/接口定义之前。\n- 接口语句 - 接口（Interface）类似于类，但包含一组方法声明。这也是一个可选部分，仅当我们希望在程序中实现多重继承特性时使用。\n\
  - 不包含 main 方法的类定义 - Java 程序可以包含多个类定义。类是 Java 程序中主要且核心的元素。这些类用于映射现实世界问题的对象。\n- 包含\
  \ main 方法的类定义 - 由于每个独立程序都需要一个 `main` 方法作为起点，因此该类是 Java 程序的组成部分。一个简单的 Java 程序可能只包含这部分。`main()`\
  \ 方法创建各种类的对象并在它们之间建立通信。到达 `main` 结束，程序终止并将控制权交回操作系统。\n\n## 垃圾回收\nJava 对象的内存分配是完全动态的，但\
  \ Java 不像 C/C++ 那样支持指针算术。当我们运行 Java 程序时，JVM 还会后台运行另一个名为垃圾回收器（Garbage Collector）的程序。垃圾回收器持续检查\
  \ Java 对象。当一个 Java 对象不再被使用时，它会被垃圾回收器收集，即分配对象的内存被添加到空内存池/堆中并可以重复使用。这在很大程度上简化了程序员的工作，同时也消除了许多由于不当使用指针算术和内存管理功能（如手动释放内存）导致的错误。\n\
