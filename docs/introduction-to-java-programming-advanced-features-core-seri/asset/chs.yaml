  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch5\n{\n    public static void\
  \ main(String args[]) {\n    }\n}\n```\n\n\n\n\n\n```\nA a1 = new A();\nA a2 = new\
  \ A();\nA a3 = new A();\nB b1 = new B(a1, \"Hello\");\nB b2 = new B(a2, \"World\"\
  );\nB b3 = new B(a3, \"Matrix\");\n```\n\n**输出：**\n```\n[Hello]\n[World]\n[Matrix]\n\
  ```\n\n## 线程间通信\n\n如前所述，多线程通过将我们的任务划分为离散的逻辑单元，取代了事件循环编程。线程还证明了一个次要优势：它们消除了轮询（polling）。轮询通常通过一个循环实现，用于反复检查某些条件。一旦条件为真，就会采取相应的行动。这会浪费\
  \ CPU 周期。例如，考虑队列问题，一个线程在生产数据，另一个线程在消费数据。为了让该问题产生交互，假设生产者必须等待消费者完成任务才能生成更多数据。在轮询系统中，消费者在等待生产者生产数据时会浪费许多\
  \ CPU 周期。一旦生产者完成工作，它就会开始轮询，再次浪费更多的 CPU 周期来等待消费者完成，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法被实现为 `Object` 类中的 `final` 方法，因此所有类都拥有它们。这三个方法只能在\
  \ `synchronized` 上文中调用。使用这些方法有某些规则。`wait()` 通知调用线程释放监视器并睡眠，直到其他线程进入同一个监视器并调用 `notify()`。`notify()`\
  \ 唤醒一个在同一对象上调用过 `wait()` 的线程（通常是第一个）。`notifyAll()` 唤醒所有在同一对象上调用过 `wait()` 的线程。通常，优先级高的线程会先运行。这些方法在\
  \ `Object` 中声明，如下所示：\n\n```\nfinal void wait() throws InterruptedException\nfinal\
  \ void notify()\nfinal void notifyAll()\n```\n\n### 示例\n下面的示例程序实现了一个简单的生产者/消费者问题。它由四个类组成：`Q`，我们试图同步的队列；`Producer`，产生队列目的线程对象；`Consumer`，消费队列目的线程对象；以及\
  \ `PC`，创建 `Producer` 和 `Consumer` 的微型类。\n\n```java\nclass Q {\n    int n;\n    synchronized\
  \ int get() {\n        System.out.println(\"Got:\"+n);\n        return n;\n    }\n\
  \    synchronized void put(int n) {\n        this.n=n;\n        System.out.println(\"\
  Put:\"+n);\n    }\n}\nclass Producer implements Runnable {\n    Q q1;\n    Producer(Q\
  \ q2) {\n        q1=q2;\n        new Thread(\"Producer\").start();\n    }\n    public\
  \ void run() {\n        int i=0;\n        while(true) {\n            q1.put(++i);\n\
  \        }\n    }\n}\nclass Consumer implements Runnable {\n    Q q1;\n    Consumer(Q\
  \ q2) {\n        q1=q2;\n        new Thread(\"Consumer\").start();\n    }\n    public\
  \ void run() {\n        while (true) {\n            q1.get();\n        }\n    }\n\
  }\nclass PC {\n    public static void main(String args[]) {\n        Q q1=new Q();\n\
  \        new Producer(q1);\n        new Consumer(q1);\n        System.out.println(\"\
  Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q` 上的 `put()` 和 `get()` 是 `synchronized`\
  \ 的，但没有什么能阻止生产者运行消费者，也没有能阻止消费者两次消费同一个值。因此，我们可能会得到如下的错误输出：\n\n```\nPress Control-C\
  \ to stop\nPut:1\nPut:2\nPut:3\nPut:4\nPut:5\nPut:6\nPut:7\nGot:7\nGot:7\nGot:7\n\
  Got:7\nGot:7\nPut:8\nPut:9\nPut:10\nPut:11\nPut:12\nGot:4\nGot:5\nGot:5\nGot:5\n\
  Got:5\n```\n\n编写此程序的正确方法是使用 `wait()` 和 `notify()` 在两个方向上进行信号，如下所示：\n\n```java\n\
  class Q {\n    int n;\n    boolean valueSet=false;\n    synchronized int get() {\n\
  \        if(!valueSet) {\n            try {\n                wait();\n         \
  \   } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n        System.out.println(\"Got :\" + n);\n        valueSet\
  \ = false;\n        notify();\n        return n;\n    }\n    synchronized void put\
  \ (int n) {\n        if(valueSet) {\n            try {\n                wait();\n\
  \            } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n        }\n\n     \
  \   this.n=n;\n        valueSet =true;\n        System.out.println(\"Put :\" + n);\n\
  \        notify ();\n    }\n}\n\nclass Producer implements Runnable {\n    Q q1;\n\
  \n    Producer(Q q2) {\n        q1 = q2;\n        new Thread(this, \"Producer\"\
  ).start();\n    }\n\n    public void run() {\n        int i = 0;\n        while\
  \ (true) {\n            q1.put (++i);\n        }\n    }\n}\n\nclass Consumer implements\
  \ Runnable {\n    Q q1;\n\n    Consumer(Q q2) {\n        q1 = q2;\n        new Thread(this,\
  \ \"consumer\").start();\n    }\n\n    public void run() {\n        while (true)\
  \ {\n            q1.get();\n        }\n    }\n}\n\nclass PC2 {\n    public static\
  \ void main(String args[]) {\n        System.out.println(\"Press Control-C to stop\"\
  );\n        Q q1 = new Q();\n        new Producer(q1);\n        new Consumer(q1);\n\
  \    }\n}\n```\n\n**输出:**\n```\nPress Control-C to stop\nPut:1\nGot:1\nPut:2\nGot:2\n\
  Put:3\nGot:3\nPut:4\nGot:4\nPut:5\nGot:5\n```\n\n### 死锁\n\n一种我们需要避免的、与多任务相关的特殊错误是死锁。当两个线程对一对同步对象产生循环依赖时，就会发生死锁。例如，假设一个线程进入对象\
  \ `X` 的监视器，另一个线程进入对象 `Y` 的监视器。如果 `X` 中的线程尝试调用 `Y` 上的任何同步方法，它将预期地阻塞。然而，如果 `Y` 中的线程反过来尝试调用\
  \ `X` 上的任何同步方法，该线程将永远等待，因为为了访问 `X`，它必须释放对 `Y` 的锁，以便第一个线程能够完成。死锁是一种很难调试的错误，因为：\n\
  (i) 通常情况下，当线程以正确的方式进行时间切片时它很少发生。\n(ii) 它可能涉及两个以上的线程和对象。\n\n### 示例 1\n\n```java\n\
  class A {\n    synchronized void foo(B b1) {\n        System.out.println(\"Method\
  \ called and then blocked\");\n        try {\n            Thread.sleep(1000);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        System.out.println(\"Trying to call b1.last()\");\n        b1.last();\n\
  \    }\n\n    synchronized void last() {\n        System.out.println(\"This not\
  \ be printed\");\n    }\n}\n\nclass B {\n    synchronized void bar(A a1) {\n   \
  \     System.out.println(\"Method called and then blocked\");\n        try {\n \
  \           Thread.sleep(1000);\n        } catch(InterruptedException e) {\n   \
  \         System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call a1.last()\");\n        a1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This not be printed\");\n    }\n}\n\nclass\
  \ DeadLock implements Runnable {\n    A a1= new A();\n    B b1 = new B();\n\n  \
  \  DeadLock() {\n        Thread t = new Thread(this);\n        t.start();\n    \
  \    a1.foo(b1);\n    }\n\n    public void run() {\n        b1.bar(a1);\n    }\n\
  \n    public static void main(String args[]) {\n        new DeadLock();\n    }\n\
  }\n```\n**输出:**\n```\nMethod called and then blocked\nMethod called and then blocked\n\
  Trying to call b1.last()\nTrying to call a1.last()\n```\n\n### 示例 2\n\n在 Java 2\
  \ 之前，`suspend()` 和 `resume()` 由 `Thread` 定义，用于暂停和重启线程的执行。它们的形式如下：\n\n```java\nclass\
