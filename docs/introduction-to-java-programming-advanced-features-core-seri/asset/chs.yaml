  Child Thread: \" + t);\n        t.start();\n    }\n\n    public void run() {\n \
  \       for (int i=1; i<=30; i++) {\n            System.out.println(name + \": \"\
  \ + i);\n            try {\n                Thread.sleep(100);\n            }\n\
