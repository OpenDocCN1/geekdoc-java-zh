  Child thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\nThread One is\
  \ alive?:true\nThread Two is alive?:true\nThread Three is alive?:true\n```\n\n```java\n\
  class Clicker implements Runnable {\n    long click = 0;\n    Thread t;\n    volatile\
  \ boolean running = true;\n    Clicker(int p) {\n        t = new Thread(this);\n\
  \        t.setPriority(p);\n    }\n    public void run() {\n        while (running)\
  \ {\n            click++;\n        }\n    }\n    void stop() {\n        running\
  \ = false;\n    }\n    void start() {\n        t.start();\n    }\n}\nclass HiLoPri\
  \ {\n    public static void main(String args[]) {\n        Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n\
  \        Clicker hi = new Clicker(Thread.NORM_PRIORITY + 1);\n        Clicker lo\
  \ = new Clicker(Thread.NORM_PRIORITY - 1);\n        lo.start();\n        hi.start();\n\
  \        try {\n            Thread.sleep(10000);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        lo.stop();\n    \
  \    hi.stop();\n        try {\n            lo.join();\n            hi.join();\n\
  \        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"Low : \" + lo.click);\n        System.out.println(\"\
  High : \" + hi.click);\n    }\n}\n```\n\n\n\n\n\n高优先级线程获取了超过 98% 的 CPU 时间。但线程仍然发生了上下文切换，尽管它们既没有主动释放\
  \ CPU，也没有因为 I/O 而阻塞。当在非抢占式系统中运行相同的程序时，将获得不同的结果。\n\n注意：变量 `running` 前面带有 `volatile`\
  \ 关键字，以确保在每次迭代以下循环时都会检查 `running` 的值。\n\n```java\nwhile (running) {\n    click++;\n\
  }\n```\n\n如果不使用 `volatile`，Java 可以自由对循环进行优化，创建一个 `running` 的局部副本。使用 `volatile` 可以防止这种优化，告诉\
  \ Java `running` 可能会以即时代码中无法直接看出的方式发生变化。\n\n## 同步\n\n当两个或多个线程需要访问共享资源时，它们需要某种方法来确保资源在同一时刻只有一个线程使用。实现这一目标的过程被称为同步。\n\
  \n同步的核心是监视器（monitor）概念（也称为信号量）。监视器是一个用作互斥锁的对象。在给定时刻只有一个线程可以拥有监视器。\n\n当一个线程获取锁时，就它进入了监视器。所有其他尝试进入被锁监视器的线程都将被挂起，直到第一个线程退出监视器。这些其他线程被称为等待监视器。拥有监视器的线程如果愿意，可以重新进入同一个监视器。我们可以通过两种方式之一同步我们的代码：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用 synchronized 方法\n\
  \n在 Java 中同步是非常简单的，因为所有对象都有与其关联的隐式监视器。要进入对象的监视器，只需调用用 `synchronized` 关键字修改的方法。当一个线程在同步方法内部时，所有尝试在同一实例上调用它（或任何其他同步方法）的其他线程都必须\
  \ `wait()`。要退出监视器并将对象的控制权交给下一个等待线程，监视器的所有者只需从同步方法返回即可。\n\n### 示例 12.8\n\n以下程序说明了三个线程在并发运行时，其生成的输出会混杂。\n\
  \n```java\nclass A {\n    void display(String msg) {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(1000);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable {\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch1 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        B b1 = new B(a1,\"Hello\"\
  );\n        B b2 = new B(a1,\"World\");\n        B b3 = new B(a1,\"Matrix\");\n\
  \    }\n}\n```\n\n输出：\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n正如我们所看到的，通过调用 `sleep()`，`display()`\
  \ 方法允许执行切换到另一个线程。这导致了三个字符串字符串的混杂。在这个程序中，没有任何机制可以防止三个线程在同一时间对同一个对象调用同一个方法。\n\n这被称为竞态条件（race\
  \ condition），因为这三个线程正在相互竞争以完成该方法。这个示例使用 `sleep()` 来使效果可重复且明显。在大多数情况下，竞态条件更加微妙且难以预测，因为我们无法确定上下文切换何时发生。这可能导致程序在一次运行时是正确的，而在下次运行时是错误的。\n\
  \n为了做到，我们只需要在方法 `display()` 的定义之前加上 `synchronized` 关键字。这可以防止任何线程在另一个线程正在使用它时进入 `display()`。\n\
  \n### 示例 12.9\n\n```java\nclass A {\n    synchronized void display(String msg) {\n\
  \        System.out.print(\"[\" + msg);\n        try {\n            Thread.sleep(100);\n\
  \        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\n\nclass B implements Runnable\
  \ {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m) {\n   \
  \     msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run() {\n        obj.display(msg);\n    }\n}\n\nclass Synch2\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     B b1 = new B(a1,\"Hello\");\n        B b2 = new B(a1,\"World\");\n       \
  \ B b3 = new B(a1,\"Matrix\");\n    }\n}\n```\n\n\n\n\n\n虽然在我们创建的类中使用 `synchronized`\
  \ 方法是实现同步的一种简单且有效的方法，但它在所有情况下都不起作用。为了理解为什么，请考虑以下情况：假设我们要同步对一个并非为多线程访问设计的类对象的访问。也就是说，该类没有使用\
  \ `synchronized` 方法。此外，该类不是我们创建的，而是由第三方创建的；我们无法访问其源代码。因此，我们无法在类内部适当的方法上添加 `synchronized`\
  \ 修饰符。那么如何通过 `synchronized` 实现对该类对象的访问呢？\n\n解决方案是将对该类定义的方法调用放在 `synchronized` 块内部。`synchronized`\
  \ 语句的一般形式如下：\n\n```java\nsynchronized(object)\n{\n    //需要同步的语句\n}\n```\n\n在这里，`object`\
  \ 是指向被同步对象的引用。`synchronized` 块确保了对 `object` 成员方法的调用只有在当前线程成功进入 `object` 的监视器（monitor）时才会发生。\n\
  \n### 示例 12.10\n\n上一个示例的变体版本，在 `run()` 方法中使用 `synchronized` 块：\n\n```java\nclass\
  \ A\n{\n    void display(String msg) {\n        System.out.print(\"[\" + msg);\n\
  \        try {\n            Thread.sleep(1000);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        synchronized(obj) {\n            obj.display(msg);\n        }\n   \
  \ }\n}\n\nclass Synch3\n{\n    public static void main(String args[]) {\n      \
  \  A a1 = new A();\n        B b1 = new B(a1,\"Hello\");\n        B b2 = new B(a1,\"\
  World\");\n        B b3 = new B(a1,\"Matrix\");\n    }\n}\n```\n输出:-\n[Hello]\n\
  [World]\n[Matrix]\n\n### 多线程在不同对象上调用同一个方法\n\n#### 示例 12.11\n\n线程可以并发地对类的不同对象调用同一个\
  \ `synchronized` 实例方法，因为每个对象都有不同的锁。这再次导致输出混杂。\n\n```java\nclass A\n{\n    synchronized\
  \ void display(String msg) {\n        System.out.print(\"[\" + msg);\n        try\
  \ {\n            Thread.sleep(100);\n        } catch(InterruptedException e) {\n\
  \            System.out.println(e);\n        }\n        System.out.println(\"]\"\
  );\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n  \
  \  Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch4\n{\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        A a2 = new A();\n    \
  \    A a3 = new A();\n        B b1 = new B(a1,\"Hello\");\n        B b2 = new B(a2,\"\
  World\");\n        B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n输出:\n[Hello[World[Matrix]\n\
  \n### 静态同步方法\n\n#### 示例 12.2\n\n在下面的示例中，尽管我们在不同对象上调用了 `display()` 方法，但输出并没有错乱。原因是\
