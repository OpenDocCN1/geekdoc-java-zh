  \ & COLUMNS 可以是常量或变量\n```\n\n到目前为止，我们讨论了可以存储值列表的数组变量。在[某些]情况下，需要存储一个数值表。考虑下面的数据表，它显示了三名销售人员三种商品的销售额。\n\
  \n该表总共包含 12 个值，每行三个。我们可以将此表看作一个由四行三列组成的矩阵。每一行代表特定销售人员的销售额，每一列代表特定商品的销售额。\n\n## 示例\
  \ 4.4 打印矩阵转置的程序\n\n```java\nimport java.util.*;\n\nclass Transpose\n{\n    public\
  \ static void main(String args[])\n    {\n        Scanner sc=new Scanner(System.in);\n\
  \        int r,c;\n        System.out.print(\"Enter how many rows\");\n        r=sc.nextInt();\n\
  \        System.out.print(\"Enter how many cols.\");\n        c=sc.nextInt();\n\n\
  \        int m[][]=new int[r][c];\n        //input\n        for(int i=0;i<r;i++)\n\
  \            for(int j=0;j<c;j++)\n            {\n                System.out.print(\"\
  Enter\" + (i+1) + \",\" +(j+1));\n                m[i][j]=sc.nextInt();\n      \
  \      }\n        //transpose\n        for(int i=0;i<c;i++)\n        {\n       \
  \     for(int j=0;j<r;j++)\n                System.out.print(m[j][i]+\"\\t\");\n\
  \            System.out.println();\n        }\n    }\n}\n```\n\n## 示例 4.5 将两个矩阵相乘得到第三个矩阵的程序\n\
  \n```java\nimport java.util.*;\n\nclass MatrixMult\n{\n    public static void main(String\
  \ args[])\n    {\n        Scanner sc=new Scanner(System.in);\n        int r1,c1;\n\
  \        System.out.print(\"Enter how many rows\");\n        r1=sc.nextInt();\n\
  \        System.out.print(\"Enter how many cols.\");\n        c1=sc.nextInt();\n\
  \        int r2,c2;\n        System.out.print(\"Enter how many rows\");\n      \
  \  r2=sc.nextInt();\n        System.out.print(\"Enter how many cols.\");\n     \
  \   c2=sc.nextInt();\n        if(c1 != r2)\n        {\n            System.out.println(\"\
  Can't mult\");\n            System.exit(1);\n        }\n        int m1[][]=new int[r1][c1];\n\
  \        //input m1\n        for(int i=0;i<r1;i++)\n            for(int j=0;j<c1;j++)\n\
  \            {\n                System.out.print(\"Enter\" + \"element \" + (i+1)\
  \ + \",\" + (j+1);\n                m1[i][j]=sc.nextInt();\n            }\n    \
  \    int m2[][]=new int[r2][c2];\n        //input m2\n        for(int i=0;i<r2;i++)\n\
  \            for(int j=0;j<c2;j++)\n            {\n                System.out.print(\"\
  Enter\" + \"element \" + (i+1) + \",\" +(j+1));\n                m2[i][j]=sc.nextInt();\n\
  \            }\n        int m3[][]=new int[r1][c2];\n        //matrix mult\n   \
  \     for(int i=0;i<r1;i++)\n            for(int j=0;j<c2;j++)\n               \
  \ for(int k=0;k<c1;k++)\n                    m3[i][j]+=m1[i][k]*m2[k][j];\n    \
  \    //Output m3\n        for(int i=0;i<r1;i++)\n        {\n            for(int\
  \ j=0;j<c2;j++)\n                System.out.print(m3[i][j]+\"\\t\");\n         \
  \   System.out.println();\n        }\n    }\n}\n```\n\n## 3. 可变大小数组\n\n数组将多维数组视为“数组的数组”，可以按照如下方式声明一个二维数组：\n\
