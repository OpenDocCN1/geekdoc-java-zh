  \n![sss](img/image01248.jpeg)\n\n(Java 流类的分类)\n\n## 字节流类概览\n\n字节流类通过两个类层次结构来定义。顶层有两个抽象类：\n\
  \n(1) `InputStream` 和 (2) `OutputStream`\n\n这些抽象类中的每一个都有若干具体的子类，用于处理各种设备之间的差异，例如磁盘文件、网络连接甚至内存缓冲区。\n\
  \n### InputStream 类\n\n用于读取 8 位字节字节的 `InputStream` 类包括一个名为 `InputStream` 的超类，以及若干支持各种输入相关函数的子类。\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01249.jpeg)\n\
  \n![abc](img/image01250.jpeg)\n\n输入流类的层次结构。\n\n![ab](img/image01251.jpeg)\n\n输入流类的层次结构。\n\
  \n### InputStream 类\n\n超类 `InputStream` 是一个抽象类，它定义了执行输入功能的方法，例如：\n\n*   读取字节。\n\
  *   关闭流。\n*   在流中标记位置。\n*   在流中向前跳过。\n*   查找流中的字节数。\n\n### InputStream 类的方法：\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `int available()` | 提供输入中可用的字节数（必须由子类重写）。`InputStream`\
  \ 类的 `available` 方法始终返回 0。 |\n| `void close()` | 关闭此输入流并释放与流相关的任何系统资源。`InputStream`\
  \ 的 `close` 方法什么都不做。 |\n| `void mark(int readlimit)` | 标记此输入流中的当前位置。`InputStream`\
  \ 的 `mark` 方法什么都不做。 |\n| `boolean markSupported()` | 测试此输入流是否支持 `mark` 和 `reset`\
  \ 方法。`InputStream` 的 `markSupported` 方法返回 false。 |\n| `abstract int read()` | 从输入流中下一个字节的数据。子类必须提供此方法的实现。\
  \ |\n| `int read(byte[] b)` | 从输入流中读取若干字节并将其存储在缓冲区数组 `b` 中。实际读取的字节数作为整数返回。 |\n|\
  \ `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节，并从参数 `off` 指定的位置开始存储在缓冲区数组\
  \ `b` 中。实际读取的字节数作为整数返回。 |\n| `void reset()` | 将此流重新定位到上一次在此输入流上调用 `mark` 方法时的位置。`InputStream`\
  \ 的 `reset` 方法什么都不做并始终抛出 `IOException`。 |\n| `long skip(long n)` | 从此输入流中跳过并丢弃最多\
  \ `n` 个字节的数据，并返回实际跳过的字节数。 |\n\n### DataInput 接口\n\n`DataInput` 是一个接口，它定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n### DataInput 接口的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean\
  \ readBoolean()` | 读取一个输入字节，如果该字节非零则返回 true，如果为零则返回 false。 |\n| `byte readByte()`\
  \ | 读取并返回一个字节输入。 |\n| `char readChar()` | 读取一个输入字符并返回其值。 |\n| `double readDouble()`\
  \ | 读取八个输入字节并返回一个 double 值。 |\n| `float readfloat()` | 读取四个输入字节并返回一个 double 值。 |\n\
  | `void readFully(byte[] b)` | 从输入流读取若干字节并将其存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出\
  \ `EOFException`。 |\n| `void readFully(byte[] b, int off, int len)` | 从输入流读取 `len`\
  \ 个字节，并从 `off` 指定的位置开始存储在缓冲区数组 `b` 中。如果流在读取所有字节之前到达末尾，此方法将抛出 `EOFException`。 |\n\
  | `int readInt()` | 读取四个输入字节并返回一个 int 值。 |\n| `String readLine()` | 从输入流读取下一行。 |\n\
  | `long readLong()` | 读取八个输入字节并返回一个 long 值。 |\n| `short readShort()` | 读取两个输入字节并返回一个\
  \ short 值 |\n| `Strig readUTF( )` | 读取使用修改后的 UTF-8 格式编码的字符串。 |\n| `int skipBytes(int\
  \ n)` | 尝试从输入流中跳过 `n` 个字节的数据，忽略跳过的字节。返回实际跳过的字节数。 |\n\n## InputStream 类总结\n\n`FilterInputStream`\
  \ 包含另一个输入流，它将其作为基本数据源，并可能在处理过程中转换数据以提供额外功能。\n\n`FilterInputStream` 类本身简单地重写了 `InputStream`\
  \ 的所有方法，这些版本会将所有请求传递给包含的输入流。`FilterInputStream` 的子类可能会进一步重写其中某些方法，并可能提供额外的方法和字段。\n\
  \n注意，`DataInputStream` 类继承自 `FilterInputStream` 并实现了 `DataInput` 接口。因此，`DataInputStream`\
  \ 继承 `FilterInputStream`，除了使用 `InputStream` 类的方法外，还实现了 `DataInput` 中描述的方法。\n\n###\
  \ InputStream 类总结：\n\n| 类 | 描述 |\n| :--- | :--- |\n| `InputStream` | 此抽象类是所有表示字节输入流类的父类。\
  \ |\n| `BufferedInputStream` | `BufferedInputStream` 为另一个输入流增加了功能——即缓冲输入并支持 `mark`\
  \ 和 `reset` 方法。 |\n| `ByteArrayInputStream` | `ByteArrayInputStream` 包含一个内部缓冲区，其中包含可以从流中读取的字节。\
  \ |\n| `DataInputStream` | `DataInputStream` 允许应用程序从输入流读取 Java 原始数据类型。 |\n| `FileInputStream`\
  \ | `FileInputStream` 包含来自文件的输入字节。 |\n| `FilterInputStream` | `FilterInputStream`\
  \ 包含另一个输入流，它将其作为基本数据源，并可能在传输数据过程中提供额外功能。 |\n| `PipedInputStream` | `PipedInputStream`\
  \ 应该连接到管道输出流，随后管道输入流提供提供写入管道输出流的字节。 |\n| `PushbackInputStream` | `PushbackInputStream`\
  \ 为另一个输入流增加了功能，即“回退”或“重读”一个字节的能力。 |\n| `SequenceInputStream` | `SequenceInputStream`\
  \ 表示流的逻辑连接。 |\n| `ObjectInputStream` | `ObjectInputStream` 反序列化之前使用 `ObjectOutputStream`\
  \ 写入的原始数据对象。 |\n\n### OutputStream 类\n\n`OutputStream` 类派生自基类 `OutputStream`，该类是一个抽象类，并拥有若干支持各种输出相关函数的子类。\n\
  \n### OutputStream 类\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void close()` | 关闭此输出流并释放与流相关的任何资源。\
  \ |\n| `void flush()` | 刷新此输出流并强制写出缓冲的输出字节。 |\n| `void write(byte[] b)` | 从指定的字节数组中写入\
  \ `b. length` 个字节到其输出流。 |\n| `void write(byte[] b, int off, int len)` | 从指定的字节数组从偏移量\
  \ `off` 开始写入 `len` 个字节到其输出流。 |\n| `abstract void write( int b)` | 将指定的字节写入其输出流。\
  \ |\n\n### DataOutput 接口\n\n`DataOutput` 是一个接口，它定义了向 `OutputStream` 写入原始数据类型的方法。\n\
  \n![IO_LayeredInput](img/image01254.jpeg)\n\n\n\n\n![C:\\Users\\Made Man Harry\\\
  Desktop\\Stars\\black_star_logo.jpg](img/image01255.jpeg)\n\n## DataOutput 接口的方法\n\
  \n| 方法 |  |\n| :--- | :--- |\n| `void writeBoolean(boolean v)` | 向输出流写入一个布尔值。 |\n\
  | `void writeByte(int v)` | 向输出流写入参数 `v` 的低 8 位。 |\n| `void writeBytes(string s)`\
  \ | 将字符串写入输出流。按照顺序取字符串 `s` 中的每个字符，向输出流写入一个字节。 |\n| `void writeChar(int v)` | 向输出流写入一个由两个字节组成的字符值。\
  \ |\n| `void writeChars(string s)` | 将字符串 `s` 中的每个字符按八个字节的顺序写入输出流。 |\n| `void writeDouble(double\
  \ v)` | 向输出流写入一个由八个字节组成的 double 值。 |\n| `void writeFloat(float v)` | 向输出流写入一个由四个字节组成的\
  \ float 值。 |\n| `void writeInt(int v)` | 向输出流写入一个由四个字节组成的 int 值。 |\n| `void writeLong(long\
  \ v)` | 向输出流写入一个由八个字节组成的 long 值。 |\n| `void writeShort(int v)` | 向输出流写入一个由两个字节组成的\
  \ short 值。 |\n| `void writeUTF(String str)` | 向输出流写入两个字节的长度信息，随后是字符串 `s` 中每个字符的修改\
  \ UTF-8 表示。 |\n\n## OutputStream 类的总结\n\n`DataOutputStream` 是 `DataInputStream`\
  \ 的对应类。`DataOutputStream` 类除了使用 `OutputStream` 类的方法外，还实现了在 `DataOutput` 接口中描述的方法。\n\
  \n### OutputStream 类类总结\n\n| 类 | 描述 |\n| :--- | :--- |\n| `OutputStream` | 此抽象类是所有表示字节输出流类的超类。\
  \ |\n| `BufferedOutputStream` | 该类实现了一个缓冲输出流。 |\n| `ByteArrayOutputStream` | 该类实现了一个将数据写入字节数组的输出流。\
  \ |\n| `DataOutputStream` | 数据输出流允许应用程序以可移植的方式向输出流写入 Java 原始数据类型。 |\n| `FileOutputStream`\
  \ | 文件输出流是向 `File` 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流以创建通信管道。\
  \ |\n| `FilterOutputStream` | `FilterOutputStream` 包含一些其他输出流，它将其作为目标，可能在传输过程中转换数据或提供额外功能。\
  \ |\n| `PrintStream` | `PrintStream` 为另一个输出流添加功能，即能够方便地打印各种数据值的表示。 |\n\n## 字符流类概述\n\
  \n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 为这些每个类提供了几个具体的子类。抽象的\
  \ `Reader` 和 `Writer` 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入数据字符。这些方法被派生的流类重写。\n\
  \n## Reader 流类\n\nReader 流类设计用于从文件中读取字符。`Reader` 类是该组中所有其他类的基类。这些类在功能上与输入流类非常相似，区别在于输入流使用字节作为信息的基本单位，而\
  \ reader 流使用字符。\n\n`Reader` 类包含与 `InputStream` 类中相同的方法。因此，`Reader` 类可以执行输入流类实现几乎的所有功能。\n\
  \n![](img/image01256.jpeg)\n\n(Reader 流类的层次结构)\n\n### Reader 类\n\n`Reader` 是一个抽象类，定义了\
  \ Java 的字符输入流模型。该类中的所有方法都会抛出 `IOException`。\n\n#### Reader 类的方法\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `abstract void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()`\
  \ 或 `reset()` 调用将抛出 `IOException`。然而，关闭一个之前已关闭的流没有影响。 |\n| `void mark()` | 标记流中的当前位置。随后的\
  \ `reset()` 调用将尝试将流重置到此点。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()`\
  \ | 告知此流是否支持 `mark()` 操作 |\n| `int read()` | 读取单个字符，并返回来自调用输入流的下一个可用字符的整数表示。遇到文件末尾时返回\
  \ -1。 |\n| `int read(char[] buffer)` | 尝试读取最多 `buffer` 长度的字符到 `buffer` 中，并返回成功读取的字符数。遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取最多 `numChar` 个字符缓冲区，返回成功读取的字符数。遇到文件末尾时返回 -1。reader\
  \ 子类必须实现此方法。 |\n| `boolean ready()` | 告知此流是否准备好被读取。如果下一次输入请求不会等待，则返回 true，否则返回 false。\
  \ |\n| `void reset()` | 重置流。并不是所有的字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过最多 `n`\
  \ 个字符并返回跳过的字符数。如果 `n` 为负数，则抛出 `IllegalArgumentException`。 |\n\n#### Reader 类总结\n\
  \n| 类 | 描述 |\n| :--- | :--- |\n| `Reader` | 用于读取字符流的抽象类 |\n| `BufferedReader` |\
  \ 从字符输入流读取文本，对字符进行缓冲，以便高效读取字符、数组和行。 |\n| `CharArrayReader` | 该类实现了一个可以作为字符输入流使用的字符缓冲区。\
  \ |\n| `FileReader` | 用于读取字符文件的便利类。 |\n| `FilterReader` | 用于读取过滤字符流的抽象类。 |\n| `InputStreamReader`\
  \ | `InputStreamReader` 是字节流到字符流的桥梁：它读取字节并使用指定的字符集解码为字符。 |\n| `PipedReader` | 管道字符输入流。\
  \ |\n| `PushbackReader` | 允许将字符推回流的字符读取器。 |\n| `StringReader` | 源自字符串的字符流。 |\n\n\
  ## Writer 流类\n\nWriter 流类设计用于将字符写入文件/输出设备。writer 类是一个抽象类，作为所有其他 writer 流类的基类。\n\n\
  基类通过定义与 `OutputStream` 类相同的方法来提供所有输出操作的支持。\n\n`Writer` 类包含与 `OutputStream` 类中可用的方法。因此，`Writer`\
  \ 类可以执行输出流类实现几乎的所有功能。\n\n![](img/image01257.jpeg)\n\n(Writer 流类的层次结构)\n\n![C:\\\
  Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01258.jpeg)\n\
  \n### Writer 类\n\n`Writer` 是一个抽象类，定义了流字符输出。该类中的所有方法都返回 void 值并在发生错误时抛出 `IOException`。\n\
  \n#### Writer 类的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract void close()` |\
  \ 关闭流并刷新。 |\n| `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。\
  \ |\n| `abstract void write(char[] cbuf, int off, int len)` | 从指定的偏移量开始写入字符数组的一部分。子类必须实现此方法。\
  \ |\n\n\n\n\n\n## Writer 类方法\n\n| `void write(int c)` | 向调用的输出流写入单个字符。注意，该参数为 `int`\
  \ 类型，这允许你直接对表达式调用 `write`，而无需将它们转换回 `char`。 |\n| `void write(String str)` | 写入一个字符串。\
  \ |\n| `void write(String str, int off, int len)` | 写入字符串从指定偏移量开始开始的部分。 |\n\n![C:\\\
  Users\\Made Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image01259.jpeg)\n\
  \n## Writer 类总结\n\n| 类 | 描述 |\n| :--- | :--- |\n| `Writer` | 用于写入字符流的抽象类。 |\n| `BufferedWriter`\
  \ | 将文本写入字符输出流，并对字符进行缓冲，以便高效写入单个字符、数组和字符串。 |\n| `CharArrayWriter` | 此类实现了一个字符缓冲区，可以作为\
  \ `Writer` 使用。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter` | 用于写入过滤后的字符流的抽象类。\
  \ |\n| `OutputStreamWriter` | `OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符使用指定的 `charset`\
  \ 编码为字节。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 将对象的格式化表示写入文本输出流。 |\n\
  | `StringWriter` | 一种字符流，将其输出收集在字符串缓冲区，然后可以使用其来构建字符串。 |\n\n## File 类\n\n尽管 `java.io`\
  \ 定义的大多数类都操作于流，但 `File` 类并不如此。它直接处理文件和文件系统。也就是说，`file` 类并没有指定如何从文件中检索信息或向文件中存储信息。它描述的是自身的属性。\n\
  \n`file` 对象用于获取或操纵与磁盘文件相关的信息，例如权限、时间、日期和目录路径，以及导航子目录层次结构。\n\n虽然出于安全考虑，文件在 applet\
  \ 中的用法受到严格限制，但文件仍然是存储持久和共享信息的核心资源。\n\nJava 中的目录被简单地视为一个文件，多了一个额外的属性——可以通过 `list()`\
  \ 方法检查的文件名列表。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public File(String)` | |\n| `public\
  \ File(String, String)` | |\n| `public File(File, String)` | |\n| `public File(URI)`\
  \ | 此构造函数由 Java 2（版本 1.4）添加。 |\n| `public String getName()` | 返回文件或目录的。 |\n| `public\
  \ String getParent()` | 返回对象创建期间指定的路径中的文件父目录，如果此路径名没有表示父目录，则返回 null。 |\n| `public\
  \ String getPath()` | 返回相对路径。 |\n| `public boolean isAbsolute()` | 测试此抽象路径是否为绝对路径。\
  \ |\n| `public String getAbsolutePath() ` | 返回从根目录开始的绝对（完整）路径。 |\n| `public boolean\
  \ canRead()` | 测试应用程序是否可以读取由此抽象路径指示的文件。 |\n| `public boolean canWrite()` | 测试应用程序是否可以修改由此抽象路径指示的文件。\
  \ |\n| `public boolean exists()` | 测试由此抽象路径指示的文件或目录是否存在。 |\n| `public boolean isDirectory()`\
  \ | 测试由此抽象路径指示的文件是否为目录。 |\n| `public boolean isFile()` | 测试由此抽象路径指示的文件是否为普通文件。 |\n\
  | `public boolean isHidden()` | 测试由此抽象路径命名的文件是否为隐藏文件。 |\n| `public long lastModified()`\
  \ | 返回由此抽象路径指示的文件最后修改的时间。 |\n| `public long length()` | 返回由此抽象路径指示的文件长度。 |\n| `public\
  \ boolean createNewFile() throws java.io.IOException` | 仅当不存在以此路径命名的文件时，自动创建一个由此路径名命名的新空文件。\
  \ |\n| `public boolean delete()` | 删除由此抽象路径指示的文件或目录。 |\n| `public String[] list()`\
  \ | 返回一个字符串数组，命名由此抽象路径指示的目录中的文件和目录。如果 `File` 对象对应文件，则返回 null。 |\n| `public boolean\
  \ mkdir()` | 创建由此抽象路径命名的目录。 |\n| `public boolean mkdirs()` | 创建由此抽象路径命名的目录，包括任何必要的不存在的目录。\
  \ |\n| `public boolean setLastModified(long)` | 设置由此抽象路径命名的文件或目录的最后修改时间。 |\n| `public\
  \ boolean setReadOnly()` | 标记由此抽象路径命名的文件或目录，使其只允许操作。 |\n| `public boolean setWritable(boolean)`\
  \ | |\n| `public boolean setReadable(boolean)` | |\n| `public boolean canExecute()`\
  \ | |\n| `public long getTotalSpace()` | |\n| `public long getFreeSpace()` | |\n\
  | `public long getUsableSpace()` | |\n| `boolean renameTo(File)` | 重命名由此抽象路径指示的文件。\
  \ |\n\n### 示例\n\n`File f1 = new File(\"\");`\n`File f2 = new File(\"/autoexec\"\
  );`\n`File f3 = new File(f1,\"autoexec\");`\n\n注意：Java 会正确处理 UNIX 和 Windows 之间的路径分隔符。如果你在\
  \ Windows 版本的 Java 上使用斜杠 (`/`），路径仍然正确解析。记住，如果你在字符串中使用 Windows 习惯（`\\\\`），Java 的惯例是使用\
  \ UNIX 风格的正斜杠作为路径分隔符。\n\n`File` 定义了许多获取 `File` 对象标准属性的方法。然而，`File` 类并不是对称的。这意味着，虽然有主方法允许你检查简单文件的属性，但不存在相应的函数来更改这些属性。\n\
