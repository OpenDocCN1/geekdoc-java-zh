  \n![STAR-LOGO-2013](img/image01215.jpeg)\n\n# 第 ∞ 1 章\n\n## (Java 概述)\n\n## 引言\n\
  `Java` 是一种由 Sun Microsystems 公司于 1991 年开发的强大面向对象编程语言。`Java` 最初为消费电子设备开发，但后来转向了互联网。现在，`Java`\
  \ 已成为互联网广泛使用的编程语言。`Java` 是一种平台中性的语言（机器无关）。用 `Java` 开发的程序可以运行在世界上任何硬件或任何操作系统上。\n\n\
  Sun Microsystems (Oracle) 在 1995 年 5 月的一次大型会议上正式宣布了 `Java`。通常情况下，这样的事件不会引起太大关注。然而，由于人们对万维网巨大的兴趣，`Java`\
  \ 立即引起了商业界的兴趣。\n\n`Java` 现在用于创建具有动态和交互内容的 Web 页面，开发大型企业应用程序，增强全球网的功能。\n\n## Java\
  \ 的需求\n`Java` 的开发是因为需要一种平台中性的语言，可以用于创建嵌入到各种消费电子设备（如微波炉和遥控器）中的软件。用 `C` 和 `C++` 编写的程序针对特定的硬件编译的，该程序无法在任何其他硬件上运行。因此，我们需要平台中性的语言。这种需求导致了\
  \ Java 的诞生。\n\n## Java 类库\nJava 程序由称为“类”的部分组成。类由方法组成，方法执行完成任务时返回信息。类库主要由编译器供应商提供，但许多类库由独立软件供应商\
  \ (ISVs) 提供。此外，许多类库作为免费软件或共享软件从网上获取。你可以下载免费产品并根据版权所有者指定的任何限制进行免费使用。Java APIs（应用程序接口）。\n\
  \n## 典型 Java 环境的基础\nJava 系统通常由几个部分组成：环境、语言、Java 编程接口 (`API`) 和各种类库。以下解释说明了一个典型的\
  \ Java 程序开发环境，Java 程序通常经过五个阶段才能执行。这些阶段是：编辑、编译、加载、验证和执行。随后的描述使用了 Oracle 提供的标准 `Java\
  \ SE 7 开发工具包` (`JDK 7`)。\n\n如果你在使用不同的 Java 开发环境，则可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请咨询编译器的文档获取详情。\n\
  \n注意：如果你没有使用 UNIX/Linux、Windows 95/98/ME 或 Windows NT/2000，请参考你系统 Java 环境的手手册，或询问你的导师如何在你的环境中完成这些任务。第一阶段包括编辑文件。\n\
  \n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入 Java 程序，并在需要时进行修正。当程序员指定编辑器中的文件应保存时，程序被存储在次级存储设备（如磁盘）上。Java\
  \ 程序文件名以 `.java` 扩展名结尾。\n\n在 UNIX/Linux 系统上广泛使用的编辑器是 `vi` 和 `emacs`。在 Windows 95/98/ME\
  \ 和 Windows NT/2000 上，简单的编辑程序（如 DOS Edit 命令和 Windows 记事本）就足够了。\n\n\n\n\n\nJava 集成开发环境（IDE），例如用于\
  \ Java 社区版的 Forte、NetBeans、Borland 的 JBuilder、Symantec 的 Visual Cafe 以及 IBM 的 Visual\
  \ Age，内置了集成到编程环境中的编辑器。\n\n我们假设读者知道如何编辑文件。像 `Java` 这样的语言是面向对象的——在这种语言中编程被称为`面向对象编程`（`OOP`），它允许设计人员将面向对象的设计实现为运行系统。相比之下，`C`\
  \ 等语言是过程化语言，因此编程倾向于以操作为中心。\n\n在 `C` 中，编程的单元是 `function`（函数）。在 `Java` 中，编程的单元是 `class`（类），最终从类实例化对象（这是“创建”的一种高级说法）。`Java`\
  \ 类包含 `methods`（实现类行为的方法）和 `attributes`（实现类数据的属性）。\n\n`C` 程序员侧重于编写 `functions`。执行某些共同任务的操作组被组合成\
  \ `functions`，而 `functions` 被组合在一起形成程序。数据在 `C` 中无疑是重要的，但观点是数据主要存在是为了支持 `functions`\
  \ 执行的动作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的 `functions` 集合。\n\n`Java` 程序员侧重于创建自己的自定义类型，称为\
  \ `classes`（类）和 `components`（组件）。每个 `class` 包含数据以及操作这些数据的 `functions` Set。`Java`\
  \ 类的数据组件被称为 `attributes`。\n\n`Java` 类的 `function` 组件被称为 `methods`。正如 `int` 等内置类型的实例被称为\
  \ `variable`（变量）一样，自定义类型（即 `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建自定义类型的“构建基块”。\n\
  \n`Java` 的重点在于 `classes`（我们从中创建对象）而不是 `functions`。系统规范中的名词帮助 `Java` 程序员确定 `classes`\
  \ 的集合，将从这些类中创建对象，而这些对象将共同工作以实现系统。\n\n`Classes` 之于 `objects` 就像蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个\
  \ `class` 实例化许多对象。`Classes` 也可以与其他 `classes` 存在关系。\n\n例如，在银行的面向对象设计中，“银行柜员” `class`\
  \ 需要与“客户” `class` 建立联系。这些关系被称为 `associations`（关联）。我们将看到，当软件封装成 `classes` 时，这些类可以在未来的软件系统中被重用。相关的\
  \ `classes` 组通常被封装成可重用的组件。\n\n你创建的每个新 `class` 都有可能成为有价值的软件资产，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\
  \n# Java 与 C, C++, 及 C# 的关系\n\n`Java` 从 `C` 继承了其语法，从 `C++` 继承了面向对象的特性。它不是 `C++`\
  \ 的增强版本。`Java` 既不向上也不向下兼容 `C++`。我想告诉你们的一重要点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。另一种由微软开发用于支持\
  \ `.NET Framework` 的语言 `C#` 与 `Java` 密切相关，因为它们共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是实现 -\n\n## 1. 安全性：\n\n当我们使用 `Java` 兼容的 浏览器时，没有病毒感染的威胁。此外，也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）的威胁。\n\
  \n`Java` 在网络应用程序和我们的计算机之间提供防火墙。\n\n## 2. 可移植性：\n\n`Java` 程序可以从一台计算机迁移到另一台运行不同操作系统且具有不同硬件的计算机。\n\
  \n## Java 字节码 -\n\n`Java` 编译器的输出是 `bytecode`（字节码）而不是机器码（`.class` 文件）。`bytecode`\
  \ 是一组高度优化的指令，旨在由 `Java` 运行时系统执行，该系统被称为 `JVM`（Java Virtual Machine`）。\n\n`JVM` 是解释\
  \ `bytecode` 的解释器。编译后的程序运行得更快，但 `Java` 仍然使用解释器来实现可移植性，因此 `Java` 程序的运行速度稍慢。现在，通过\
  \ `Java` 编译器编译的程序可以在任何环境中运行，但每个平台都需要实现 `JVM`。`Java` 程序是被解释的。这也有助于提高安全性，因为每个 `Java`\
  \ 程序的执行都受到 `JVM` 的控制。\n\n## JIT (即时编译)：-\n\n`JIT` 是 `JVM` 用于将 `bytecode` 翻译成实际机器码的翻译器。它并不翻译整个\
  \ `bytecodes`，而是根据需要按需翻译。\n\n## Java 的各个版本:-\n\n### Java 1\n* `JDK 1.0`\n* `JDK\
  \ 1.1`\n\n### Java 2\n* `JDK 1.2`\n* `JDK 1.3`\n* `JDK 1.4`\n* `JDK 1.5` 或 `JDK\
  \ 5`\n* `JDK 1.6` 或 `JDK 6`\n* `Java 1.7` 或 `SE 7`\n* `Java 8` (2014 年 4 月)\n\n\
  注 1：`JDK` (`Java Development Kit`)\n注 2：旧 Java 版本的许多功能已被新版本弃用\n\n# Java 可以开发的应用程序类型:-\n\
  \n### 1. 独立应用程序\n独立应用程序是一种运行在我们的本地计算机操作系统上的程序，类似于 `C` 或 `C++` 程序。\n\n### 2. Applets（小程序）\n\
  `applet` 是一个小型程序，在互联网上传输并在客户端机器的 `Java`-兼容 浏览器（如 `Internet Explorer` 或 `Netscape\
  \ Navigator`）上执行。\n\n`applet` 实际上是一个跨网络动态下载的微 Java 程序。`applet` 程序存储在 Web 服务器上，并在接到客户端机器请求时传输到客户端机器。\n\
  \n`applet` 不能像独立应用程序那样执行。`applet` 只能通过嵌入 HTML 页面来执行，类似于声音文件、图像文件或视频剪。\n\n现在，这个嵌入了\
  \ `applet` 的 HTML 页面可以在通过浏览器下载此类 HTML 页面后运行。`applet` 是一个可以响应用户输入并能够动态变化的程序。它不会重复播放相同的动画或声音。\n\
  \n### 3. Web 应用程序\n这些是运行在 Web 服务器上的程序。当我们通过在 浏览器中指定 `URL`（通用资源定位符）访问网站时，浏览器会向 Web\
  \ 服务器发送请求。接收到请求后，服务器运行一个程序，该程序被称为 Web 应用程序。我们使用 `Java Servlets` 和 `JSP` (`Java Server\
  \ Pages`) 来编写此类程序。\n\n这些程序运行在服务器上，然后将结果/响应发送给客户端。`JSP` 页面可以被视为 HTML 和 Java 代码的结合。Web\
  \ 服务器在执行之前会将 `JSP` 页面转换为 `Java Servlets`。\n\n当客户端请求特定的 `URL` 且 `URL` 对应 HTML 页面时，Web\
  \ 服务器直接将 HTML 页面返回给客户端，由客户端显示。如果 `URL` 对应 `servlet` 或 `jsp`，则它在服务器上执行并将结果返回给客户端，由客户端显示。\n\
  \n### 4. 分布式应用程序\n`Java` 应用程序被分成运行在单独机器上的小程序。这些程序中的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两个不同计算机上的对象远程执行过程。为此，使用了\
  \ `RMI` (`远程方法调用`)。\n\n\n\n\n\n### 1. 简单\nJava 的语法与 C 和 C++ 几乎相似，因此熟悉 C/C++ 的程序员不需要从头开始学习语法。但\
  \ C/C++ 中许多复杂或导致歧义的特性在 Java 中被移除了。\n\n1. Java 不支持多重继承，因为这个概念有点复杂并可能导致歧义。\n2. Java\
  \ 不支持全局变量，这导致了 C/C++ 程序中出现许多 bug。\n3. Java 不使用指针，也不允许指针算术，由于其固有的复杂性，这是 C/C++ 程序中大多数\
  \ bug 的根源。\n4. Java 不支持运算符重载，因为它可能会导致混淆。\n5. Java 中没有垃圾值的概念。我们必须在使用变量之前对其进行初始化。\n\
  \n### 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）内部，其他部分无法访问它们。这极地提高了安全性。由于这一特性，Java 程序很少发生挂起。这与频繁挂起的\
  \ C/C++ 程序大不相同。Java 的安全模型包含三个主要组件：\n\n1. 类加载器（Class loader）。\n2. 字节码验证器（Bytecode\
  \ Verifier）。\n3. 安全管理器（Security Manager）。\n\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（执行文件）。从远程机器加载的类（如\
  \ Applet 类）不允许读取或写入本地机器的文件。这防止了恶意程序损坏本地文件系统。字节码验证器在类加载器完成工作后立即验证字节码。它确保字节码是有效的 Java\
  \ 代码。几乎消除了 Java 程序访问 `JVM` 之外内存等恶意活动的可能性。管理器控制许多关键操作，如删除文件、创建线程等。只有当 Java 程序具有足够的权限时，才允许这些操作，否则安全管理器将不允许并生成\
  \ `Security Exception`。\n\n### 3. 可移植\nJava 程序是平台无关的。它们遵循“编写一次，到处运行”的策略。为 Windows\
  \ 平台编写的 Java 程序只需拷贝字节码（`.class` 文件）即可运行在任何其他平台（Unix、Linux、Sun Solaris 等）。不需要像 C/C++\
  \ 程序那样复制源代码并重新编译。这一特性使 Java 成为了一门强大的语言。只要机器拥有 `JVM`，我们就可以在任何机器上运行字节码。`JVM` 本身依赖于平台，但它让\
  \ Java 代码与平台无关。实际上是 `JVM` 将字节码转换为机器码并执行它们。\n\n因此我们可以说 Java 是一门可移植的语言。另一个让 Java 高度可移植的特性是原始数据类型的长度与平台无关，固定的。例如，Java\
  \ 中的 `int` 始终是 4 字节。这与 C/C++ 不同，`int` 的大小在某些机器上可能是 2 字节，而在另一些机器上可能是 4 字节。\n\n###\
  \ 4. 面向对象\nJava Almost 是一门纯面向对象的语言，但出于性能考虑，它支持原始数据类型如 `byte`, `short`, `int`, `long`,\
  \ `float`, `double`, `char`, `boolean。\n\n### 5. 健壮\n大多数程序失败于两个原因之一：\n\n1. 内存管理。\n\
  2. 运行时的异常情况。\n\n在设计语言时，目标之一是确保 Java 程序尽可能健壮，即它们很少失败。因此，Java 特别重视上述两个因素。\n\n在 Java\
  \ 中，内存的分配和释放由语言本身处理，这消除了由于 C/C++ 中动态内存管理功能引起的许多问题。Java 还支持面向对象的异常处理功能来处理运行时发生的异常情况。这允许\
  \ Java 程序在发生异常情况后能够恢复并继续执行。\n\n### 6. 多线程\nJava 的设计是为了满足创建交互式、网络化程序的现实需求。Java 提供了编写多线程程序的支持来实现这一点。这允许程序员编写可以并发执行许多任务的程序。\n\
  \n例如，一个基于 GUI（图形用户界面）的应用程序可能正在监听用户事件并采取适当行动，另一个线程可能正在打印，另一个线程可能正在从网络上的某机器下载文件，这一切都是并发完成的。这导致了更好的性能和更好的\
  \ CPU 利用率。\n\n在其他语言中也可以编写多线程程序，但那仅通过使用系统调用来实现，而在 Java 中，这可以通过使用语言本身的特性来实现。\n\n###\
  \ 7. 架构中性\n程序员面临的主要问题之一是，无法保证我们今天写的程序明天是否还能运行——即使在同一台机器上也是。操作系统的升级、处理器的升级以及核心系统资源的变化都可能导致程序发生故障。但\
  \ Java 程序的目标是“编写一次，到处运行”。\n\n### 8. 解释型与高性能\nJava 程序是被解释执行的，但与其他解释器相比，它们运行得很快。\n\
  \n### 9. 分布式\nJava 是为互联网的分布式环境设计的。Java 内置了对各种基于 TCP/IP 协议的支持。此此，使用 `URL` 访问资源与访问本地机器上的文件类似。Java\
  \ 还具有远程方法调用（Remote Method Invocation）功能，这与远程过程调用（RPC）有些相似。这允许不同计算机上的对象远程执行过程。Java\
  \ 为此目的提供了内置 API，称为 `RMI`。\n\n### 10. 动态\n每个 Java 类都是一个独立的执行单元。类只有在需要时才在运行时加载。Java\
  \ 中绑定方法的默认机制也是动态的（运行时绑定）。\n\n## 运行独立的 Java 应用程序\n\n当 C 或 C++ 程序被编译时，它会被直接翻译成机器码。\n\
  \n\n\n\n\n## Step 2\n输入 `CD \\JAVAPRG` 并按回车\n\n## Step 3\n输入 `Edit Sum.Java` 并按回车\n\
