  \n# 第 11 章：异常处理\n\n## 引言\n\n异常是由程序中的运行时错误导致的条件，它会破坏程序的正常流程。当 Java 解释器遇到如整数除以零等错误时，它会创建一个\
  \ `Exception` 对象并将其抛出（即：我们发生了错误）。\n\n每当运行时发生异常时，Java 异常/错误都是 `Exception` 类或其任一子类的对象。异常对象包含有关异常的详细信息，可以使用为此目的提供的公共方法访问这些信息。\n\
  \n在某些旧版语言中，我们必须使用 `if`、`goto` 和 `return` 码来进行错误处理。\n\n异常是代码序列在运行时出现的一种异常状态。换句话说，异常是一种运行时错误。在不支持异常处理的计算机语言中，必须手动检查并处理错误——通常通过使用错误代码等。\n\
  \n这种方法既繁琐又麻烦。Java 的异常处理避免了这些问题，并在此过程中将运行时错误管理带入了面向对象的世界。\n\n## 异常处理基础\n\nJava 异常是一个描述代码中发生的异常（即错误）状态的对象。当异常状态出现时，会产生一个代表该异常的对象，并在导致错误的方法中将其抛出。该方法可以选择自己处理该异常，也可以将其传递下去。\n\
  \n无论何种方式，异常在某一点点都会被捕获并处理。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。Java 抛出的异常与违反 Java 语言规则或\
  \ Java 执行环境限制的根本错误有关。手动生成的异常通常用于向方法的调用者报告某些错误状态。\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。简而言，它们的工作原理如下：你想要监控异常的程序语句包含在 `try` 块中。如果 `try` 块内部发生异常，异常会被抛出。你的代码可以捕获此异常（使用\
  \ `catch`）并以某种方式处理它。系统生成的异常由 Java 运行时自动抛出。要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常都必须由 `throws`\
  \ 子句指定。任何在 `try` 块完成后绝对必须执行的代码都放在 `finally` 块中。\n\n这是异常处理块的通用形式：\n\n```java\ntry\
  \ {\n    // 监控错误的代码块\n} catch (Exception ex) {\n    // 针对 Exception 的异常处理程序\n} .........\n\
  finally {\n    // 在 try 结束后之后要执行的代码块\n}\n```\n\n### 异常类型\n\n所有异常类型都是内置类 `Throwable`\
  \ 的子类。因此，`Throwable` 处于异常层次结构的顶端。`Throwable` 紧下方有两个子类，它们将异常分为两个不同的分支。一个分支由 `Exception`\
  \ 引导。该类用于用户程序应该捕获的异常状态。你也将通过派生该类来创建你自己的异常类型。\n\n`Exception` 有一个重要的子类，称为 `RuntimeException`。这种类型的异常对于你编写的程序自动定义，包括如除以零和无效数组索引等内容。\n\
  \n另一个分支由 `Error` 引导，它定义了在正常情况下你的程序不预期捕获的异常。`Error` 类型的异常由 Java 运行时系统用于指示与运行时环境本身相关的错误。`Stack\
  \ overflow`（堆栈溢出）就是此类错误的示例。本章将不会处理 `Error` 类型的异常，因为这些通常是响应你的程序无法处理的灾难性故障而产生的。\n\n\
  顶层异常层次结构所示：\n![](img/image1237.jpeg)\n\n#### 示例 11.1\n```java\nclass ErrorTest1\
  \ {\n    public static void main(String args[]) {\n        int a=5,b=2,c=2,d;\n\
  \        d=a/(b-c); // 发生了 ArithmeticException(Divide by zero)\n        System.out.println(d);\n\
  \        System.out.println(\"This will not be printed\");\n    }\n}\n```\n程序将在运行期间终止，不会运行剩余的语句。\n\
  \n### 示例 1.2\n```java\nclass A {\n    void display() {\n    }\n}\nclass ErrorTest2\
  \ {\n    public static void main(String args[]) {\n        A a1=null;\n        a1.display();\
  \ // 发生了 NullPointerException\n    }\n}\n```\n在上述程序中会发生 `NullPointerException`。引用变量没有用\
  \ `new` 初始化。在这种情况下程序也会终止。\n\n#### 示例 11.3\n```java\nclass ErrorTest3 {\n    public\
  \ static void main(String args[]) {\n        int a[] = {10,20,30};\n        System.out.println(a[3]);\
  \ // 发生了 ArrayIndexOutOfBoundsException\n    }\n}\n```\n在上述情况下，数组长度为 3，索引从 0 到 2，所以如果我们打印\
  \ `a[3]`，那么它是第 4 个元素，不是一个有效的索引。这将产生一个异常错误。在 C/C++ 中这是允许的，但在 Java 中不允许。\n\n### 注意\n\
  \nJDK 7 增加了一种 `try` 语句的新形式，支持自动资源管理。这种新的 `try` 形式称为 `try-with-resources`，在文件章节中结合文件的上下文进行描述，因为文件是常用资源之一。\n\
  \n### 异常的其他其他情况\n\n1. 我们尝试打开的文件可能不存在。\n2. 我们想要创建一个新对象但没有可用内存。\n3. 我们想要加载的类文件可能丢失或格式错误。\n\
  4. 我们想要转换为数字的字符串包含无效字符，导致无法转换为数字。\n\n如果异常对象没有被妥善捕获和处理，解释器将显示错误消息并终止程序。如果我们想继续执行剩余代码，那么我们应该尝试捕获由错误条件抛出的异常对象。\n\
  \n\n\n\n\n# 异常处理\n\n此任务被称为异常处理。异常处理机制的目的是提供一种检测和报告“异常情况”的手段，以便采取适当措施。该机制建议引入一段独立的错误处理代码，该代码执行以下任务：\n\
  \n1. 发现问题。（发生异常 `Exception occur`）\n2. 通知错误发生。（抛出异常 `throw`）\n3. 接收错误信息。（捕获异常 `catch`）\n\
  4. 采取纠正措施。（处理异常 `handle`）\n\n## Java 异常处理关键字\n\nJava 异常处理通过五个关键字管理：\n`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n\n我们想要监控的程序语句包含在 `try` 块中，每当发生错误时，它会被抛出到 `catch` 块。我们的代码可以捕获此异常（使用\
  \ `catch`）并以合理的方式进行处理。系统生成的异常由 Java 运行时系统自动抛出。\n\n若要手动抛出异常，请使用关键字 `throw`。任何从方法抛出的异常都必须通过\
  \ `throws` 子句指明。在方法返回之前必须执行的代码放在 `finally` 块中。\n\n## Try-Catch 机制\n\n`try` 块必须封装在大括号之间，即使其中只有一个语句。可以有一个或多个\
  \ `catch` 语句，以及零或一个 `finally` 语句。`catch` 和 `finally` 块都是可选的，但必须至少有一个 `catch` 块或一个\
  \ `finally` 块。\n\n`try` 块中的代码像任何其他 Java 代码一样被执行。如果 `try` 块中的代码执行成功，则控制将进入 `finally`\
  \ 块（如果存在），然后从 `finally` 块结束后的语句开始继续执行（即 `try` 语句结束之后）。如果不存在 `finally` 块，则执行从最后一个\
  \ `catch` 块结束后的语句继续执行（即 `try` 语句结束之后）。\n\n如果在执行 `try` 块中的代码时发生某些运行时错误，`JVM` 将抛出一个\
  \ `Exception Error`。这意味着将根据运行时错误的类型创建一个 `Exception Error` 类型的对象或其子类之一。然后，它将按照从上到下的顺序与\
  \ `catch` 块中的 `Exception`/`Error` 类型进行比较。\n\n如果找到匹配的 `catch` 块，则异常/错误被处理，即程序不会终止。执行将从\
  \ `catch` 块中的第一个语句继续。完成 `catch` 块后，执行从 `try` 和 `catch` 语句结束后的语句继续执行。\n\n无论有多少个 `catch`\
  \ 块，最多只有一个 `catch` 块会被执行。如果异常/错误与任何 `catch` 块的异常/错误类型不匹配，我们说它未被处理。\n\n执行将立即从 `try`\
  \ 块返回。即使异常/错误未被处理，`finally` 块中的代码也将执行。如果存在外层的 `try` 块，异常/错误将由其处理，否则必须在调用当前方法的方法中处理。异常/错误将向上层传递，直到它被处理，或者即使在\
  \ `main()` 方法（执行开始的第一个方法）中未被处理，也会作为未处理异常传递给 `JVM`。随后，`JVM` 直接终止程序，并在显示器/控制台上显示异常/错误详情。\n\
  \n## 使用 Try 和 Catch\n\n尽管 Java 运行时系统提供的默认异常处理器对于调试很有用，但你通常想自己处理异常。这样做有两个好处。首先，它允许你修复错误。其次，它防止程序自动终止。如果你的程序每当发生错误就停止运行并打印堆栈跟踪，大多数用户会感到困惑（至少可以这样说）！幸运的是，防止这种情况非常容易。\n\
  \n为了防止并处理运行时错误，只需将你想要监控的代码封装在 `try` 块中。紧随在 `try` 块之后，包含一个 `catch` 子句，指定你想要 `catch`\
  \ 的异常类型。\n\n为了说明如何而而地完成这一点，以下程序包含一个 `try` 块和一个 `catch` 子句，后者用于处理由除零错误产生的 `ArithmeticException`：\n\
  \n```java\nclass Exc2 {\n    public static void main(String args[]) {\n        int\
  \ d, a;\n        try {\n            //监控一段代码块。\n            d = 0;\n           \
  \ a = 42 / d;\n            System.out.println(\"这不会被打印.\");\n        } catch (ArithmeticException\
  \ e) {\n            // 捕获除零错误\n            System.out.println(\"Division by zero.\"\
  );\n        }\n        System.out.println(\"After catch statement.\");\n    }\n\
  }\n```\n\n此程序产生输出：\n```\nDivision by zero.\nAfter catch statement.\n```\n\n注意 `try`\
  \ 块内部的 `println()` 永远不会被执行。一旦抛出异常，程序就会跳出 `try` 块进入 `catch` 块。一旦执行 `catch` 块，执行将从\
  \ `try` 语句结束后的语句继续执行。\n\n`catch` 的作用范围局限于受 `try` 保护的语句。构建良好的 `catch` 子句的目标应该是解决异常情况然后继续。例如，在接下来的程序中，循环的每次迭代都会获取两个整数。这两个整数相互相除，结果放入\
  \ `a` 中。如果任何一次除法导致了除零错误，它将被捕获，`a` 的值被设置为零，程序继续。\n\n### 处理异常并继续。\n\n```java\nimport\
  \ java.util.Random;\n\nclass HandleError {\n    public static void main(String args[])\
  \ {\n        int a=0, b=0, c=0;\n        Random r = new Random();\n        for(int\
  \ i=0; i<3000; i++) {\n            try {\n                b = r.nextInt();\n   \
  \             c = r.nextInt();\n                a = 12345 / (b/c);\n           \
  \ } catch (ArithmeticException e) {\n                System.out.println(\"Division\
  \ by zero.\");\n                a = 0; // 将 a 设置为零并继续\n            }\n         \
  \   System.out.println(\"a: \" + a);\n        }\n    }\n}\n```\n\n## 显示异常描述\n\n\
  `Throwable` 重写了 `toString()` 方法（由 `Object` 定义），使其返回一个包含异常描述的字符串。你可以通过将异常作为参数传递给\
  \ `println()` 来显示此描述。例如，上述程序中的 `catch` 块可以重写为：\n\n```java\ncatch (ArithmeticException\
  \ e) {\n    System.out.println(\"Exception: \" + e);\n    a = 0; // 将 a 设置为零并继续\n\
  }\n```\n\n当替换此版本并运行程序时，每次除零错误都会显示以下消息：\n`Exception: java.lang.ArithmeticException:\
  \ / by zero`\n\n虽然这在这种背景下没有特别价值，但显示异常描述的能力在其他情况下是有价值的——特别是在你在实验异常或进行调试时。\n\n| 异常类型\
  \ | 异常原因 |\n| :--- | :--- |\n| `ArithmeticException` | 算术错误，例如 - 除以 0 |\n\n\n\n\n\
  \n| 异常 | 说明 |\n| :--- | :--- |\n| `ArrayIndexOutOfBoundsException` | 数组索引越界 |\n\
  | `ArrayStoreException` | 在数组中存储了错误类型的数据 |\n| `FileNotFoundException` | 访问不存在的文件\
  \ |\n| `IOException` | 无法从文件中读取 |\n| `NullPointerException` | 由引用空对象引起 |\n| `NumberFormatException`\
  \ | 字符串与数字之间的转换失败 |\n| `OutOfMemoryException` | 没有足够的内存来分配新对象 |\n| `SecurityException`\
  \ | Applet 尝试执行浏览器安全设置不允许的操作 |\n| `StackOverflowException` | 系统栈空间不足 |\n| `StringIndexOutOfBoundsException`\
  \ | 程序尝试访问字符串中不存在的字符位置 |\n\n# Java 的内置异常\n\n在标准包 `java.lang` 中，Java 定义了若干异常类。其中几个已在之前的示例中使用过。这些异常中最通用的是标准类型\
  \ `RuntimeException` 的子类。\n\n正如之前所解释的，这些异常不需要包含在任何方法的 `throws` 列表中。在 Java 语言中，这些被称为**未检查异常**（unchecked\
  \ exceptions），因为编译器不会检查方法是否处理或 `throws` 这些异常。`java.lang` 中定义的未检查异常列于表 -1。表 -2 列出了\
  \ `java.lang` 定义的异常，如果该方法可能产生这些异常且本身不进行处理，则必须包含在方法的 `throws` 列表中。这些被称为**检查异常**（checked\
  \ exceptions）。Java 还定义了其他几种与其各种类库相关的异常类型。\n\n![ss](img/image01238.jpeg)\n\n# 异常处理的一形式\n\
  \n![](img/image01239.jpeg)\n（异常处理机制）\n\n### 语法：\n\n```text\n- - - - - - - - - -\
  \ - -\n- - - - - - - - - - - - -\ntry\n{\n    statement;          //产生异常\n}\ncatch\
  \ (Exception-type e)\n{\n    statement;          //处理异常\n}\n- - - - - - - - - -\
  \ - -\n- - - - - - - - - - - - -\n```\n\n# 多个 catch 子句\n\n在某些情况下，一段代码可能会抛出多个异常。为了处理这种情况，你可以指定两个或多个\
  \ catch 子句，每个捕获不同类型的异常。\n\n当异常抛出时，会顺序检查每个 `catch` 语句，并执行第一个与异常类型匹配的 `catch` 语句。在一个\
  \ `catch` 语句执行后，其他的将被跳过，执行在 `try` / `catch` 块之后继续。下面的示例捕获了不同的异常类型：\n\n```java\n\
  // 多个 catch 语句。\nclass MultipleCatches {\n    public static void main(String args[])\
  \ {\n        try {\n            int a = args.length;\n            System.out.println(\"\
  a = \" + a);\n            int b = 42 / a;\n            int c[] = { 1 };\n      \
  \      c[42] = 99;\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  Divide by 0: \" + e);\n        } catch(ArrayIndexOutOfBoundsException e) {\n   \
  \         System.out.println(\"Array index oob: \" + e);\n        }\n        System.out.println(\"\
  After try/catch blocks.\");\n    }\n}\n```\n\n如果在没有命令行参数的情况下启动此程序，由于 `a` 等于 0，它会导致除以零异常。如果你提供了命令行参数并将\
  \ `a` 设置为大于 0 的值，它将跳过除法错误。但它会导致 `ArrayIndexOutOfBoundsException`，因为 `int` 数组 `c`\
  \ 的长度为 1，但程序尝试给 `c[42]` 赋值。\n\n以下是以两种运行方式生成的输出：\n```\nC:\\>MultipleCatches\na =\
  \ 0\nDivide by 0: java.lang.ArithmeticException: / zero\nAfter try/catch blocks.\n\
  C:\\>MultipleCatches\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException:\
  \ 42\nAfter try/catch blocks.\n```\n\n当你使用多个 `catch` 语句时，重要的是记住**异常子类必须在任何父类之前**。这是因为使用父类的\
  \ `catch` 语句会捕获该类型的异常以及其任何子类的异常异常。因此，如果子类排在父类之后，则永远无法被访问。此外，在 Java 中，不可达代码是一个错误。例如，考虑以下程序：此程序包含一个错误。在系列\
  \ `catch` 语句中，子类必须在父类之前。否则，将创建不可达代码并导致编译时错误。\n\n```java\nclass SuperCatch {\n  \
  \  public static void main(String args[]) {\n        try {\n            int a =\
  \ 0;\n            int b = 2 / a;\n        } catch(Exception e) {\n            System.out.println(\"\
  Generic catch.\");\n            /* 此 catch 永远不会被到达，因为 ArithmeticException 是 Exception\
  \ 的子类。 */\n            catch(ArithmeticException e) { // 错误 – 不可达\n            \n\
  \        }\n    }\n}\n```\n如果你尝试编译此程序，将收到错误消息，第二个 `catch` 语句是不可达的，因为异常已经被捕获。由于 `ArithmeticException`\
  \ 是 `Exception` 的子类，第一个 `catch` 语句将处理所有基于 `Exception` 的错误，包括 `ArithmeticException`。这意味着第二个\
  \ `catch` 语句将不会执行。要解决这个问题，请反转 `catch` 语句的顺序。\n\n# 嵌套 try\n\n`try` 语句是可以嵌套的。也就是说，`try`\
  \ 语句可以位于另一个 `try` 块内部。每当进入 `try` 语句时，异常的上下文就会推入栈中。如果内部 `try` 语句没有特定异常的 `catch` 处理器，栈将回溯并检查下一个\
  \ `try` 语句的 `catch` 处理器。这将一直持续，直到某个 `catch` 语句成功，或者所有的嵌套 `try` 语句执行完毕。如果没有 `catch`\
  \ 语句匹配，则 Java 运行时系统将处理该异常。\n\n这是一个使用嵌套 `try` 语句的示例：当有多个 `catch` 语句时，被称为多个 catch\
  \ 语句。\n\n```java\ntry {\n    statement; //产生异常\n} catch(Exception-type-1 e) {\n\
  \    statement 1; //处理异常 type1\n} catch(Exception-type-2 e) {\n    statement 2;\
  \ //处理异常 type2\n}\ncatch(Exception-type-n e) {\n    statement n; //处理异常 n\n}\n```\n\
  \n多个 catch 语句示例\n```java\nclass Test4 {\n    public static void main(String args[])\
  \ {\n        try {\n            int a = 10, b = 2, d;\n            System.out.println(\"\
  Before Exception \");\n            d = a / (b - c);\n        } catch(Exception e)\
  \ {\n            System.out.println(\"After Exception \");\n        }\n    }\n}\n\
  ```\n输出：\n![](img/image1240.jpeg)\n\n在这里我们没有捕获异常，因此程序将在显示消息 “Before Exception ”\
  \ 之后终止。现在我们使用异常处理解决了这个问题。\n\n示例 11.5\n```java\nclass ErrorTest5 {\n    public static\
  \ void main(String[] args) {\n```\n\n\n\n\n\n```java\nint a=10, b=2, c=2, d;\n\n\
  try {\n    System.out.println(\"Before Exception\");\n    d=a/(b-c);\n    System.out.println(\"\
  This Will Not Print\");\n} catch(ArithmeticException e) {\n    System.out.println(\"\
  After Exception\");\n    System.out.println(\"error : Division by zero\");\n}\n\
  ```\nOutput:\n```\nBefore Exception\nAfter Exception\nerror : Division by zero\n\
  java.lang.ArithmeticException: / by zero\n```\n(Image: `image0241.jpeg`)\n\n###\
  \ 异常处理的优势\n- 我们可以很容易地指定异常/错误将在哪里被处理。异常/错误会在运行时沿着调用栈向上传播，直到被外层的 `try` 块捕获。\n- 由于可以使用完整的堆栈轨迹信息（stack\
  \ trace），异常/错误发生的位置是确切的。这对于调试非常有帮助。\n- 程序员获得了从错误/异常状态中恢复的机会。\n- 将错误处理与正常的程序流分离，从而提高了代码的可读性和可维护性。\n\
  - 在 Java 中，无需测试是否会发生异常/错误。添加更多的错误/异常只需要添加 `catch` 子句，而无需触动原始程序流。\n\n#### 异常类的层次结构\n\
  所有 `Exception`/`Error` 的根类是 `throwable`，它是 `object` 类的直接子类。在 Java 中，异常/错误也是对象。\n\
  \n#### Error（错误）\n`Error` 类子类主要用于信号异常状态，例如：\n1. `OutOfMemoryError`:  Java 虚拟机内存耗尽，且垃圾器无法回收任何内存。\n\
  2. `StackOverflowError`: 解释器发生栈溢出。\n通常情况下，这些错误是不可恢复的，不应该被处理。\n\n#### Exception（异常）\n\
  `Exception` 类的子类通常是可以恢复的。例如，`EOFException` 表示我们打开的文件没有更多数据可读。`FileNotFoundException`\
  \ 则表示我们想要打开的文件在文件系统中不存在。\n(Image: `image0242.jpeg`)\n\n### 异常分为两种类型\n\n#### 检查异常\
  \ (Checked Exception)\n如果必须捕获某个异常，则它被称为检查异常。如果 `try` 块中可能发生检查异常且未被处理，程序将无法编译。编译器确保了如果一个方法可以直接或间接地抛出检查异常，那么该方法必须显式地处理它。该方法要么捕获异常并采取适当措施，要么将异常传递给其调用者。\n\
  注意：`Exception` 及其所有子类（runtime-exception 及其子类除外）都是检查异常，必须被捕获。\n\n#### 非检查异常 (Unchecked\
  \ Exception)\n如果不必须捕获某个异常，则它称为非检查异常。即使未处理非检查异常，程序也可以编译。如果程序中发生了任何未处理的非检查异常，程序执行将在该点终止。但如果异常被处理，程序将不会因为异常而终止。\n\
  注意：`Error` 及其所有子类都是非检查异常，不需要捕获。运行时异常（Runtime Exception）及其所有子类都是非检查异常。所有用户定义的异常都是检查异常。\n\
  \n#### Exception 类中的可用方法\n| 方法 |  |\n| :--- | :--- |\n| `String getMessage()` |\
  \ 获取与异常或错误相关的消息。 |\n| `void printStackTrace()` | 打印堆栈轨迹，显示异常/错误发生的位置。 |\n| `String\
  \ toString()` | 显示异常/错误名称以及由 `getMessage()` 返回的消息。 |\n\n### 示例 1.6\n```java\nclass\
  \ ErrorTest6 {\n    public static void main(String[] arr) {\n        try {\n   \
  \         int a=10, b=2, c=2, d;\n            System.out.println(\"Before Exception\"\
  );\n            d=a/(b-c);\n            System.out.println(\"This Will Not Print\"\
  );\n        } catch(ArithmeticException e) {\n            System.out.println(\"\
  After Exception\");\n            System.out.println(\"error : Division zero\");\n\
  \            System.out.println(e); // 调用了 toString()。\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\nOutput:\n```\nBefore Exception\nAfter Exception\nerror\
  \ : by zero\njava.lang.ArithmeticException: / by zero\nat ErrorTest6.main(ErrorTest6.java:0)\n\
  ```\n\n### 示例 1.7 多重捕获\n```java\nclass ErrorTest7 {\n    public static void main(String[]\
  \ args) {\n        try {\n            int a=args.length;\n            System.out.println(\"\
  Before Exception\");\n            int b=58/a;\n            int c[] = {1};\n    \
  \        c[47]=100;\n            System.out.println(\"After Exception\");\n    \
  \    } catch(ArithmeticException e) {\n            System.out.println(\"Divide by\
  \ zero \"+e);\n        } catch(ArrayIndexOutOfBoundsException e) {\n           \
  \ System.out.println(\"Array oob :\"+e);\n        }\n        System.out.println(\"\
  After try/catch block\");\n    }\n}\n```\nOutput 1: 当我们通过 `java ErrorTest7` 运行上述程序时：\n\
  ```\nBefore Exception\nDivide by zero : java.lang.ArithmeticException: / by zero\n\
  After try/catch block\n```\nOutput 2: 当我们通过 `java ErrorTest7 45` 运行上述程序时：\n```\n\
  Before Exception\nArray oob: java.lang.ArrayIndexOutOfBoundsException: 47\nAfter\
  \ try/catch block\n```\n\n\n\n\n\n## 嵌套 try-catch\n\n如果我们在另一个 `try` 块中使用 `try` 和\
  \ `catch` 语句，则被称为嵌套 try-catch。\n\n## 语法\n\n```java\ntry //外部 try\n{\n    try //内部\
  \ try\n    {\n        statement ;\n    }\n    catch1() //内部 catch\n    {\n     \
  \   statement ;\n    }\n    catch2() //内部 catch\n    {\n        statement ;\n  \
  \  }\n}\ncatch() //外部 catch\n{\n    statement ;\n}\n```\n\n## 示例 11.8 嵌套的 try 和\
  \ catch-\n\n```java\nclass Nested {\n    public static void main(String args[])\
  \ {\n        try {\n            int a=args.length;\n            int b=58/a;\n  \
  \          System.out.println(\"a=\"+a);\n            try {\n                if(a==1)\n\
  \                    a=a/(a-a);\n                if(a==2) {\n                  \
  \  int c[]={1};\n                    c[42]=100;\n                }\n           \
  \ } catch (ArrayIndexException e) {\n                System.out.println(\"ArrayIndex\
  \ oob \"+e);\n            }\n        } catch (ArithmeticException e) {\n       \
  \     System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n**输出 I:**\n\
  当我们运行 `java ErrorTest8` 执行上述程序时：`/ zero`\n\n**输出 II:**\n当我们运行 `java ErrorTest8 10`\
  \ 执行上述程序时：`a=1 / by zero`\n\n**输出 III:**\n当我们运行 `java ErrorTest8 10 20` 执行上述程序时：`a=2`\n\
  `ArrayIndex oob java.lang.ArrayIndexOutOfBoundsException: 42`\n\n# finally 语句\n\n\
  Java 支持另一种名为 `finally` 的语句，它可以用于处理未被任何之前的 `catch` 语句捕获的异常。`finally` 块可以用于处理 `try`\
  \ 块中生成的任何异常。无论是否发生错误，它都会被执行。它可以紧跟在 `try` 块之后，或者最后一个 `catch` 块之后，如下所示：\n\n## 语法\n\
  \n```java\ntry\n{\n    // ...\n}\ncatch (...)\n{\n    // ...\n}\ncatch (...)\n{\n\
  \    // ...\n}\nfinally\n{\n    // ...\n}\n```\n\n### 示例 1.9 finally 语句\n\n```java\n\
  class ErrorTest9 {\n    public static void main(String args[]) {\n        int a[]\
  \ = {5,10};\n        int b=5;\n        try {\n            int x=a[2]/b-a[1];\n \
  \       } catch (ArithmeticException e) {\n            System.out.println(\"Division\
  \ Zero\");\n        } catch (ArrayIndexException e) {\n            System.out.println(\"\
  Array error\");\n        } catch (ArrayStoreException e) {\n            System.out.println(\"\
  Wrong Data Type\");\n        } finally //始终执行\n        {\n            System.out.println(\"\
  Always Execute\");\n            int y=a[1]/a[0];\n            System.out.println(\"\
  y = \"+y);\n        }\n    }\n}\n```\n**输出：**\n`Array error`\n`Always Execute`\n\
  `y = 2`\n\n到目前为止，只捕获的是 Java 运行时系统抛出的异常。然而，我们的程序也可以使用 `throw` 语句显式地抛出异常，`throw` 的通用形式所示：\n\
  \n`throw instance;`\n\n在这里，`instance` 必须是 `Throwable` 类型的对象或其子类。简单类型如 `int` 或 `char`，以及非\
  \ `Throwable` 类（如 `String` 和 `Object`）不能作为异常。我们有两种方法获取 `Throwable` 对象：使用 `catch`\
  \ 子句中的参数，或者使用 `new` 操作符创建一个。执行流在 `throw` 语句之后立即停止；任何后续语句都不会执行。将检查最近的嵌套 `try` 块，查看是否有与异常类型匹配的\
  \ `catch` 语句。如果找到了匹配项，控制将转移到该语句。如果没有，则检查下一个外层的 `try` 语句，以此此类推。如果未找到匹配的 `catch`，默认处理程序将停止程序并打印堆栈跟踪。我们选取了一个创建并抛出异常的程序。捕获异常的处理器会将其重新抛给外层处理器。\n\
  \n### 示例 1.10\n\n```java\nclass ErrorTest0 {\n    int age;\n    void setAge(int\
  \ a) {\n        if(a>0)\n            age = a;\n        else\n            throw new\
  \ NullPointerException(\"Invalid\");\n    }\n    public static void main(String\
  \ args[]) {\n        ErrorTest0 a1 = new ErrorTest0();\n        try {\n        \
  \    a1.setAge(20);\n            a1.setAge(-10);\n        } catch (NullPointerException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\
  \n\n\n\n\n## throws\n\n如果一个方法可能会产生它自身未处理的异常，则它必须指定这种行为，以便方法的调用者能够防范该异常。我们通过在方法的声明中包含一个\
  \ `throws` 子句来实现这一点。`throws` 子句列出了方法可能抛出的异常类型。\n\n这对于所有检查异常（checked exceptions）来说都是必要的。方法可以抛出的所有异常都必须在\
  \ `throws` 子句中声明。如果没有声明，将导致编译错误。这是一个包含 `throws` 子句的方法声明的通用形式：\n\n## 语法\n```java\n\
  type method-name(parameter list)throws exception-list\n{\n    //方法正文\n}\n```\n\n\
  在这里，`exception list` 是方法可以抛出的异常的逗号分隔的列表。\n\n### 示例 11.11\n```java\nimport java.io.*;\n\
  \nclass ErrorTest11\n{\n    int age;\n    void setAge(int a) throws IOException\n\
  \    {\n        if(a>0)\n            age = a;\n        else\n        {\n       \
  \     IOException e = new IOException(\"Invalid Age\");\n            throw e;\n\
  \        }\n    }\n    public static void main(String args[])\n    {\n        ErrorTest11\
  \ a1 = new ErrorTest11();\n        try\n        {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        }\n        catch(IOException e)\n        {\n\
  \            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n输出：\n\
  ```\nInvalid Age\n```\n\n### 创建用户定义的异常子类\n这非常，只需定义 `Exception` 的子类即可。我们的子类不需要实现任何内容。`Exception`\
  \ 类本身没有定义任何方法。当然，它继承了由 `Throwable` 提供的方法。\n\n尽管 Java 的内置异常处理了大多数错误，但你可能想要创建自己的异常类型来处理特定应用程序的情况。这非常简单：定义\
  \ `Exception` 的子类（当然，它是 `Throwable` 的子类）。你的子类实际上不需要实际实现任何内容——正是它们在类型系统中的存在，允许你将其作为异常使用。\n\
  \n`Exception` 类本身没有定义任何方法。它当然继承了由 `Throwable` 提供的那些方法。因此，所有异常（包括你创建的异常）都可以使用 `Throwable`\
  \ 定义的方法。\n\n`Exception` 定义了四个构造函数。其中两个支持链式异常，将在下一节中描述。另外两个显示在此处：`Exception()` 和\
  \ `Exception(String msg)`。第一种形式创建一个没有描述的异常。第二种形式允许你指定异常的描述。\n\n尽管在创建异常时指定描述通常有用，但有时重写\
  \ `toString()` 更好。原因如下：`Throwable` 定义（并 `Exception` 继承）的 `toString()` 版本显示异常名称，后面跟着冒号，然后是你的描述。通过重写\
  \ `toString()`，你可以防止异常名称和冒号的显示。这使得输出更加整洁，在某些情况下是理想的。\n\n### 示例 11.12\n```java\n\
  class AgeException extends Exception\n{\n    AgeException(String msg)\n    {\n \
  \       super(msg);\n    }\n}\n\nclass ErrorTest12\n{\n    int age;\n    void setAge(int\
  \ a) throws AgeException\n    {\n        if(a>0)\n            age = a;\n       \
  \ else\n        {\n            AgeException e = new AgeException(\"Invalid Age\"\
  );\n            throw e;\n        }\n    }\n    public static void main(String args[])\n\
  \    {\n        ErrorTest12 a1 = new ErrorTest12();\n        try\n        {\n  \
  \          a1.setAge(20);\n            a1.setAge(-10);\n        }\n        catch(AgeException\
  \ e)\n        {\n            System.out.println(e.getMessage());\n        }\n  \
  \  }\n}\n```\n输出：\n```\nInvalid Age\n```\n\n下面的示例声明了一个 `Exception` 的新子类，然后使用该子类在方法中信号错误条件。它重写了\
  \ `toString()` 方法，允许显示经过精心定制的异常描述。\n\n![sss](img/image01243.jpeg)\n\n此示例定义了一个名为\
  \ `MyException` 的 `Exception` 子类。该子类非常简单：它只包含一个构造函数和一个重写的 `toString()` 方法，该方法显示异常的值。\n\
  \n`ExceptionDemo` 类定义了一个名为 `compute()` 的方法，该方法抛出一个 `MyException` 对象。当 `compute()`\
  \ 的整数参数大于 10 时，会抛出异常。`main()` 方法为 `MyException` 设置了异常处理程序，然后用合法值（小于 10）和非法值调用 `compute()`，以展示代码的两种路径。\n\
  \n结果如下：\n```\nCalled compute(1)\nNormal exit\nCalled compute(20)\nCaught MyException[20]\n\
  ```\n\n## 链式异常\n链式异常功能允许我们将另一个异常与异常关联。第二个异常描述了第一个异常的原因。例如，想象一种情况：方法由于尝试除以零而抛出 `ArithmeticException`。然而，问题的实际原因是发生了\
  \ I/O 错误，这导致除数被设置不当。\n\n尽管方法必须抛出 `ArithmeticException`（因为这是发生的错误），但我们可能还想让调用代码知道根本原因是\
  \ I/O 错误。\n\n为了允许链式异常，Java 2 1.4 版本为 `Throwable` 类增加了两个构造函数和两个方法。\n\n\n\n\n\n```java\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定一个描述。这两个构造函数也被添加到了 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的链式异常方法有 `getCause()` 和 `initCause()`。\n\
  \n```java\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n\
  `getCause()` 方法返回作为当前异常底层的异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联起来，并返回该异常的引用。因此，我们可以在异常创建后为异常关联一个原因。然而，原因异常只能设置一次。\n\
  \n因此，每个异常对象我们只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，那么我们无法再次使用 `initCause()` 方法来设置它。通常情况下，`initCause()`\
  \ 用于为那些不支持前述两个额外构造函数的旧异常类设置原因。Java 大多数内置异常都没有定义这些额外的构造函数。因此，如果我们需要为这些异常添加异常链，我们将使用\
  \ `initCause()`。\n\n链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 11.13\n\
  \n1. 类 `ErrorTest13`\n2.\n```java\nclass ErrorTest13 {\n    int age;\n    void setAge(int\
  \ a) {\n        if(a>0)\n            age = a;\n        else {\n            NullPointerException\
  \ e = new NullPointerException(\"Admission Failed\");\n            e.initCause(new\
  \ ArithmeticException(\"Age is invalid\"));\n            throw e;\n        }\n \
  \   }\n    public static void main(String args[]) {\n        ErrorTest13 a1 = new\
  \ ErrorTest13();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \            System.out.println(e.getCause());\n        }\n    }\n}\n```\n**输出：**\n\
  ```\nAdmission Failed\nAge is Invalid\n```\n![sss](img/image0244.jpeg)\n\n在这个示例中，顶层异常是\
  \ `NullPointerException`。它被添加了一个原因异常 `ArithmeticException`。当异常从 `setAge()` 抛出时，它被\
  \ `main()` 捕获。在那里，显示了顶层异常，随后是通过调用 `getCause()` 获取的底层异常。链式异常可以根据所需的深度持续延续。因此，原因异常本身也可以拥有原因。请注意，过长的异常链可能表明设计不当。链式异常并不是每个程序都需要的。然而，在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个新的 JDK 7 异常特性（已更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个特性自动化了资源（如文件）在不再需要时释放的过程。它是基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在介绍介绍文件的后续章节中描述。第二个新特性称为 `multi-catch`（多异常捕获），第三个有时被称为\
  \ `final rethrow`（最终重新抛出）或更精确的重新抛出。这里描述了后两个特性。\n\n`multi-catch` 特性允许两个或多个异常被同一个\
  \ catch 子句捕获。两个或多个异常处理器使用相同的代码序列并不罕见，尽管它们响应的是不同的异常。与其不得不单独捕获每种异常类型，现在可以使用单个 catch\
  \ 子句来处理所有异常，而无需代码重复。要使用 `multi-catch`，用 OR 运算符分隔 catch 子句中的每个异常类型。每个 `multi-catch`\
  \ 参数都是隐式 `final` 的（如果需要，你可以显式地指定 `final`，但没有必要）。因为每个 `-catch` 参数都是隐式的 `final`，所以它们不能被赋予新值。\n\
  \n这是一个使用 `multi-catch` 特性同时捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException`\
  \ 的 catch 语句：\n\n```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n```\n\n以下程序展示了 `multi-catch` 特性的用法：\n\n```java\n// 展示 JDK 7 的 multi-catch\
  \ 特性。\nclass MultiCatch {\n    public static void main(String args[]) {\n      \
  \  int a=10, b=0;\n        int vals[] = { 1, 2, 3 };\n        try {\n          \
  \  int result = a / b; // 生成一个 ArithmeticException\n            // vals[10] = 19;\
  \ // 生成一个 ArrayIndexOutOfBoundsException\n            // 这个 catch 子句捕获了这两个异常。\n\
  \        } catch(ArithmeticException | ArrayIndexOutOfBoundsException e) {\n   \
  \         System.out.println(\"Exception caught: \" + e);\n        }\n        System.out.println(\"\
  After multi-catch.\");\n    }\n}\n```\n\n当尝试除零时，程序将生成一个 `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，就会生成一个\
  \ `ArrayIndexOutOfBoundsException`。这两个异常都被同一个 catch 语句捕获。\n\n更精确的重新抛出特性限制了可以重新抛出的异常类型，仅限于关联的\
  \ `try` 块抛出的检查异常、未被之前的 catch 子句处理的且是参数子类或超类的异常。虽然这种能力可能并不经常需要，但现在已经可以使用。为了使更精确的重新抛出特性生效，catch\
  \ 参数必须是有效的 final 的（即在 catch 块内部不能被赋值新值），或者显式声明为 `final`。\n\n### 使用异常\n\n异常处理提供了一种强大的机制，用于控制具有许多动态特征的程序。将\
  \ `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的清晰方式是很重要的。与其他使用错误返回码指示失败的语言不同，Java\
  \ 使用异常。因此当方法可能失败时，让它抛出一个异常。\n\n这是处理失败模式的一种更清晰的方法。最后一点：Java 的异常处理语句不应被视为远程跳转的通用机制。如果你这样做，只会混乱你的代码并使其难以维护。\n\
  \n 理论问题\n\n1. 什么是异常？\n2. 如何定义 `try` 块？\n3. 如何定义 `catch` 块？\n\n\n\n\n\n# 4. 列举 Java\
