  \ 1000 个世界和 10000 世纪中寻找你，直到找到你。”\n\n## 关于作者\n\nHarry 是一位匿名组织黑客活动分子、GOC 著名计算机程序员、畅销的\
  \ Java 作者以及科学黑客专业人士，在计算机编程、黑客攻击和网络安全领域拥有独特经验。\n\n他曾帮助全球范围内许多国家的政府和许多跨国软件公司保护其网络和安全。他编写了多本关于各种计算机编程语言以及计算机安全与黑客攻击的书籍。\n\
  \n他是一位技术类软件工程师和硕士。他是 `C Programming`、`C++ Programming`以及 `Core Java`、数据结构和算法的领先权威。他的\
  \ `C` 和 `C++`、`C#` 及 `Java` 书广受誉。他拥有超过 5 年的软件方法论经验。他的教学和研究兴趣在人工智能、编程语言领域。\n\n他过着两种生活。一种生活是在一家受誉软件公司的计算机程序编写员。另一种生活在计算机中，他使用黑客别号“Chief\
  \ Hacker – Captain Harry”。目前，他在世界著名的匿名社区 Anonymous international 担任离线 IT 经理 - Team\
  \ Anonymous。\n\n### 作者的话\n\n你可能注意到这里缺少了什么：没有令人印象深刻的资历。我没有在某所著名大学当过四分之一世纪的教授；我也不是硅谷的高管。\n\
  \n在这些年里我发现，如果能以易于理解的方式让人们理解技术，那么就太棒了。我并不是一个糟糕的程序员，，我只是才开始发现如何解释计算机技术。\n\n\n\n\n\n\
  \n# 从畅销书 Java 编程作者 Harry. H. Chaudhary（销量超过 167,000 本！）那里，快速掌握 Java 编程的所有基础和高级特性。本\
  \ Java 指南从基础开始，通过数千个 Java 代码详细引导你进入 Java 的高级特性，我承诺这本书将让你成为 Java 专家级冠军。任何人都可以通过这本书达到专家水平学习\
  \ Java。\n\n工程专业的学生和新手开发者也可以使用这本书。这本书涵盖了所有计算机科学专业学位的核心课程大纲。如果你是认真的，请尽管开始用这本终极 Java\
  \ 书开启你的一天。\n\n本 Java 书的主要目标不仅仅是给你提供 Java 编程知识，我遵循了一种模式，针对每个 Java 主题问题，通过不同复杂度的理论解释改进了数千个代码的解决方案，你会发现复杂的\
  \ Java 问题有多种解决方案。\n\n## 特别之处\n\n在书中，我为开发者和新手详细涵盖并解释了最新的 Java 8 特性的几个主题，如——`Lambdas`、`Java\
  \ 8 泛式接口`、以及 `Java 8` 中的 `Stream` 和 `Time API`。\n\n如果你读过这本书，你就知道可以期待什么：一种根据你大脑工作方式设计的视觉丰富的格式。如果你还没读过，你将有一场享受。你会发现为什么人们说它和你读过的任何其他\
  \ Java 书不同。\n\n学习一门新语言并非易事，尤其是对于像 `Java` 这样一种面向对象的编程语言而言。你可能会认为问题出在你的大脑上。它似乎有自己的主意，并不总是想接受你被迫学习的枯燥技术内容。事实是，你的大脑渴望新奇感。\n\
  \n它不断地寻找、扫描，等待着不寻常的事情发生。毕竟，它是为了帮助你生存而构建的。它将所有常规、普通、无聊的内容过滤到背景中，以确保它们不会干扰你大脑的真正工作——记录重要的事情。你的大脑是如何知道什么是重要的呢？\n\
  \n本 Java 书不需要之前的编程经验。然而，如果你拥有 `C` 或 `C++` 编程背景，那么你将学得更快。\n\n正因如此，本 Java 书对 Java\
  \ 的几个关键特性提供了快速详细的概述。这里描述的内容将为你提供一个立足点，让你能够编写和理解简单且典型的程序。讨论的大部分主题将在后续章节中通过数千个现场 Java\
  \ 代码示例进行更详细的检查。\n\n正如我们过去几年文档所记录的事实：Web 不可逆转地重塑了计算的面貌，而不愿掌握其环境的程序员将被遗留。以上是一个强有力的论述，它也是事实。\n\
  \n越来越多的应用程序必须与 Web 接口。应用程序本身已不再重要，几乎通用的 Web 访问正在拉动、推动并诱导程序员为在线世界编写程序，而 `Java` 是许多人将使用它来实现这一目标的语言。坦率地说，熟练掌握\
  \ `Java` 对于专业程序员来说已不再是一个选项，而是一项要求。这本书将帮助你获得这项技能。\n\n![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\
