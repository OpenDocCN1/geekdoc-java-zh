  \n`TextField` 和 `TextArea` 类实现了用于文本输入和显示的一维和二维组件。它们都继承了 `TextComponent` 类：`Object`\
  \ → `TextComponent` → (`TextField`, `TextArea`)。\n\n`TextField` 和 `TextArea` 都有多种构造函数，可以提供指定初始字符串或大小的选项。未指定首选大小的构造函数在布局管理器将忽略组件首选大小的情况下最为合适。\n\
  \n### TextField 类构造函数\n- `TextField()`：构造一个新的文本字段。\n- `TextField(int columns)`：构造一个具有指定列数的文本字段。\n\
  - `TextField(String text)`：构造一个包含指定文本的文本字段。\n- `TextField(String text, int columns)`：构造一个包含指定文本的文本字段，宽度足够容纳指定列数的文本。\n\
  \n### TextArea 类构造函数\n- `TextArea()`：构造一个带有空字符串的新区域。\n- `TextArea(int rows, int\
  \ columns)`：构造一个具有指定行数和列数的空字符串文本区域。\n- `TextArea(String text)`：构造一个包含指定文本的文本区域。\n\
  - `TextArea(String text, int rows, int columns)`：构造一个包含指定文本、行数和列数的文本区域。\n- `TextArea(String\
  \ text, int rows, int columns, int ScrollPolicy)`：构造一个包含指定文本、行数、列数以及指定滚动策略的文本区域。\n\
  \n`TextArea` 类定义了几个常量可以作为 `scrollPolicy` 参数的值：\n- `SCROLLBARS_BOTH`\n- `SCROLLBARS_VERTICAL_ONLY`\n\
  - `SCROLLBARS_HORIZONTAL_ONLY`\n- `SCROLLBARS_NONE`\n\n对于这两个类，`columns` 参数都存在一些出人意料的问题。首先，列数是根据特定字体渲染的文本列数来衡量的宽度。使用极小字体的\
  \ 25 列文本区域将非常窄，而使用巨大字体的 5 列文本区域将极其宽。其次是等比例字体的问题。对于固定宽度的字体，列宽应该是多少是显而易见的。但对于等比例字体，列宽被认为是字体中所有字符宽度的平均值。这个平均值是集合中所有字符的简单算术平均值；它没有考虑使用频率。因此在大多数情况下，包含大量小写字母的文本组件显示的字符数将超过请求的数量。\n\
  \n### TextComponent 类方法\n- `String selectText()`：从此文本组件显示的文本中返回选中的文本。\n- `String\
  \ getText()`：返回此文本组件显示的文本。\n- `void setEditable(Boolean b)`：设置决定此文本组件是否可编辑的标志。\n\
  - `void setText(String t)`：将此文本组件显示的文本设置为指定的文本。\n\n示例 17.19\n```java\nimport java.awt.*;\n\
  \nclass TextFieldTest {\n    public static void main(String args[]) {\n        Frame\
  \ f=new Frame();\n        f.setLayout(new FlowLayout ());\n        TextField tf1=new\
  \ TextField();\n    }\n}\n```\n\n\n\n\n\n```java\nTextField tf2=new TextField(8);\n\
  TextField tf3=new TextField(\"matrix\");\nTextField tf4=new TextField(\"matrix\"\
  , 20);\nTextArea ta1=new TextArea();\nTextArea ta2=new TextArea(3,8);\nTextArea\
  \ ta3=new TextArea(\"abc\\nxyz\\naaa\");\nTextArea ta4=new TextArea(\"abc\\nxyz\\\
  naaa\", 2, 2);\nTextArea ta5=new TextArea(\"abc\\nxyz\\naaa\", 4, 20, TextArea.SCROLLBARS_BOTH);\n\
  f.add(tf1); f.add(tf2); f.add(tf3); f.add(tf4);\nf.add(ta1); f.add(ta2); f.add(ta3);\
  \ f.add(ta4);\nf.add(ta5);\ntf1.setText(\"abc\");\nSystem.out.println(tf3.getText());\n\
  tf3.setEditable(false);\nf.setSize(800, 400);\nf.setVisible(true);\n```\n\n![Images/image01290.jpeg]\n\
  \n### FileDialog\n该类表示一个文件打开或保存对话框。文件对话框是一个模态对话框，这意味着只要对话框留在屏幕上，来自对话框父帧的输入将重定向到对话框。当用户指定文件或点击取消按钮时，对话框会自动移除。最有用的\
  \ `FileDialog` 构造函数具有以下形式：\n\n`FileDialog(Frame parent, String title, int mode)`\n\
  \n对话框的 `parent` 是对话框将出现的帧。`title` 字符串显示在对话框的标题栏中。`mode` 应该是：\n- `FileDialog.LOAD`\n\
  - `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名称或其目录：\n- `String getDirectory()` 获取此文件对话框所选的目录。\n\
  - `String getFile()` 获取此文件对话框所选的文件。\n\n### 示例 17.20\n```java\nimport java.awt.*;\n\
  public class FileDialogTest {\n    public static void main(String args[]) {\n  \
  \      Frame f=new Frame() ;\n        f.setLayout(new FlowLayout() );\n        f.setSize(200,\
  \ 200);\n        f.setVisible(true);\n        FileDialog fd=new Dialog (f, \"Load\
  \ file\", FileDialog.LOAD);\n        fd.setVisible(true);\n        System.out.println(fd.getFile());\n\
  \        System.out.println(fd.getDirectory());\n    }\n}\n```\n\n### ScrollPane\n\
  滚动面板可以包含单个组件，该组件可能比滚动面板本身更高或更宽。如果容器大于滚动面板，则滚动面板的默认行为是根据需要获取水平或垂直滚动条。该类有两个构造函数：\n\
  \n- `ScrollPane()` 创建一个滚动条策略为“按需”的新窗格容器。\n- `ScrollPane(int scrollDisplayPolicy)`\
  \ 创建一个具有指定滚动条行为的新滚动面板。滚动面板的显示策略应该是以下之一：\n  - `ScrollPane.SCROLLBARS_AS_NEEDED`（默认）\n\
  \  - `ScrollPane.SCROLLBARS_ALWAYS`\n  - `ScrollPane.SCROLLBARS_NEVER`\n\n下面的代码创建了一个具有默认（按需）滚动条行为的滚动面板。该滚动面板包含包含一个非常大的按钮；因此肯定需要滚动条。\n\
