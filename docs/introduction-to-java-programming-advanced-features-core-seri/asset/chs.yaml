  Feet is \" + feet + \"\\nches is \" + inches);\n        }\n\n        void swap(Inner\
  \ obj)\n        {\n            this.feet = obj.feet;\n            this.inches =\
  \ obj.inches;\n        }\n    }\n}\n\nclass ClassTest\n{\n    public static void\
