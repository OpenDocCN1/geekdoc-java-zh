  \ ![11](img/image01214.jpeg) ![11](img/image01214.jpeg) ![11](img/image01214.jpeg)\n\
  \n![STAR-LOGO-2013](img/image01215.jpeg)\n\n## 多线程编程（第 12 章）\n\n## 引言\n线程是程序内部的控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\
  \n### 线程对比进程\n通常情况下，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，会保存当前运行进程的状态并恢复另一个进程的状态。在状态切换期间，没有进行任何有用的工作。为了最大化\
  \ CPU 的利用率，状态切换时间应该尽可能短。\n\n线程也像独立的进程，但它们共享内存和状态。各个线程也有独立的状态，但与进程状态相比，这种状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。与进程相比，线程的上下文切换时间非常短。因此，在多线程的情况下，CPU\
  \ 的利用率比多进程的情况下高。\n\n### 多线程程序\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程都定义了一条单独的执行路径。因此，多线程是多任务的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个负责打印。\n* 一个负责编辑。\n* 一个负责从互联网下载文件。\n\n所有这些线程可能都在并发运行，从而使 CPU\
  \ 利用率最大化。\n\n### 基于进程的多任务处理\n大多数操作系统都允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个\
  \ Java 程序，同时编辑一个 Word 文档。基于进程的多任务处理确保了大部分时间会有程序被执行，从而提高了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是调度程序可以分发的代码最小单元。\n\
  \n### 基于线程的多任务处理\n在基于线程的多任务环境中，线程是执行的最小单元。一个进程可以被分为若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以编辑一个 Word 文档的同时打印另一个文档。基于线程的多任务处理像基于进程的多任务处理一样提高了 CPU 利用率。但同时，它通过在单独线程中并发执行程序的不同部分，有效加快了单个程序的执行速度。\n\
  \n因此，基于进程的多任务处理处理的是“大局”，而基于线程的多任务处理的是细节。\n\n### Java 线程模型\nJava 运行时系统依赖线程完成许多工作，所有的类库在设计时都考虑了多线程。事实上，Java\
  \ 使用线程来实现整个环境的异步化。这有助于通过防止 CPU 周期的浪费来减少低效。。单线程系统使用一种称为带轮询的事件循环的方法。在这种模型中，单个控制线程在无限循环中运行，轮询单个事件队列以决定下一步做什么。在单线程环境中，当线程因为等待某些资源而阻塞（即暂停执行）时，整个程序都会停止运行。\n\
  \nJava 多线程的益处是消除了主循环/轮询机制。当 Java 程序中的线程被阻塞时，只有被阻塞的那个线程会暂停，所有其他线程继续运行。\n\n### 线程生命周期（线程状态）\n\
  线程存在多种状态。线程可以处于运行状态。它一旦获得 CPU 时间就可以进入就绪状态。运行中的线程可以被挂起，这会暂时停止它的活动。被挂起的线程随后可以恢复，让它从中断的地方继续执行。线程在等待资源时可能会被阻塞。在任何时刻，线程都可以被终止，这将立即停止其执行。一旦终止，线程将无法恢复。\n\
  \n#### 1. 新生状态 (Newborn State)\n当我们创建一个线程对象时，线程就出生了，处于新生状态。该线程尚未被调度运行。在此状态下，我们只能对它执行以下操作之一：\n\
  1. 使用 `start()` 调度它运行。\n2. 使用 `stop()` 将其杀死。\n\n如果被调度，它将进入可运行状态。如果在此状态下尝试使用任何其他方法，将抛出异常。\n\
  \n#### 2. 可运行状态 (Runnable State)\n可运行状态意味着线程已准备好执行，并等待处理器的可用。也就是说，线程已经进入了等待执行的线程队列。如果所有线程的优先级相同，它们将以轮流的方式获得执行时间片。\n\
  \n放弃控制权的线程会进入队列末尾并再次等待轮到。然而，如果我们想让一个线程在轮到它之前放弃控制权给同优先级的线程，可以通过调用 `yield()` 实现。\n\
  \n#### 3. 运行状态 (Running State)\n运行意味着处理器已经为线程分配了执行时间。运行中的线程在以下情况下可能会放弃控制权：\n* 时间片结束。\n\
  * 被高优先级线程抢占。\n* 让位，即自愿放弃控制权。\n* 完成了执行。\n* 被其他线程停止。\n* 被 `suspend()` 挂起。被挂起的线程可以通过\
  \ `resume()` 恢复。这种方法在我们想要由于某些原因挂起线程一段时间但不想杀死它时非常有用。\n* 被告知等待某些事件发生。这是通过 `wait()`\
  \ 实现的。线程可以通过 `notify()` 重新调度运行。\n* 正在执行 I/O 操作。\n\n#### 4. 阻塞状态 (Blocked State)\n\
  当线程被阻止进入可运行状态并随后进入运行状态时，被称为被阻塞。这发生在线程为了挂起、睡眠或等待以满足某些需求时。阻塞的线程被认为“不可运行”但并未死亡，因此完全有资格再次运行。\n\
  \n#### 5. 死亡状态 (Dead State)\n每个线程都有生命周期。运行中的线程在完成执行 `run()` 方法后结束生命。它有自然死亡。然而，我们在任何状态下向它发送停止消息来杀死它，导致过早死亡。\n\
  \n### 线程优先级 (Thread Priorities)\nJava 为每个线程分配一个优先级，该优先级决定了对待其他线程的方式。线程优先级是整数，指定了一个线程相对于另一个线程的相对优先级。\n\
  \n\n\n\n作为一个绝对值，优先级是没有意义的；如果一个线程是唯一运行的线程，那么高优先级线程的运行速度不会比低优先级线程快。相反，线程的优先级用于决定何时从一个运行中的线程切换到下一个线程。这被称为上下文切换。决定何时切换切换的规则如下：\n\
  \n*   线程可以自愿地（自己）放弃控制权。这通过显式地让（yielding）、睡眠（sleeping）、阻塞（blocking）或等待 I/O（pending\
  \ I/O）来实现。在这种情况下，将检查所有其他线程，通常会将 CPU 分给就绪运行的高优先级线程。\n*   线程可以被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在做什么，都会被一个高优先级线程简单地抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理。\n\
  *   某些操作系统支持非抢占式优先级调度。在这种情况下，高优先级线程只有在低优先级线程完成时才有机会运行。\n*   当两个优先级相同的线程竞争 CPU 周期周期时，情况会变得有点复杂。对于像\
  \ `windows98` 这样的操作系统，等优先级的线程必须自愿地（自己）让出（放弃）控制权给同级线程。如果它们这样做，其他线程将不会运行。\n\n注意：操作系统切换相同优先级线程的方式差异可能会产生问题。\n\
  \n## 同步\n\n由于多线程为我们的程序引入了异步行为，因此在需要时，必须有一种方法让我们强制执行同步。例如，如果我们想让两个线程通信并共享一个复杂的数据结构（如链表），我们需要某种方法来确保它们不会发生冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时进行写入操作。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象为一个只能容纳一个线程的小盒子。一旦线程进入监视器，监视器就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统以对象的形式暴露，我们的程序必须显式地获取并锁定。Java 提供了一个更简洁的解决方案。\n\n并没有 `monitor` 类，相反，每个对象都有自己的隐式监视器，当调用对象的某个\
  \ `synchronized` 方法时，该监视器会自动进入。一旦线程进入 `synchronized` 方法，任何其他线程都无法调用该对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持内置在语言中。\n\n## 消息传递\n\n使用大多数其他语言进行编程时，我们必须依赖操作系统建立线程之间的通信。\n\
  \n这无疑增加了开销。相比之下，Java 提供了一种简洁、低成本的方法让两个或多个线程相互通信，通过调用所有对象都具有的预定义方法。Java 的消息传递系统允许线程进入对象的\
  \ `synchronized` 方法，并在那里等待，直到其他某些线程显式通知其退出。\n\n## Thread 类和 Runnable 接口\n\nJava\
  \ 的多线程系统构建在 `Thread` 类、其方法及其伴侣接口 `Runnable` 之上。该类属于 `java.lang` 包，因此不需要显式导入。\n\n\
  `Thread` 封装了一个执行线程，由于我们无法直接引用运行线程的内部状态，我们通过通过其代理（即创建它的 `Thread` 实例）来处理它。要创建一个新线程，我们的程序将扩展\
  \ `Thread` 类或实现 `Runnable` 接口。`Thread` 类定义了几个有助于管理线程的方法：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `String getName()` | 返回此线程的名字 |\n| `int getPriority()` | 返回此线程的优先级\
  \ |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void\
  \ run()` | 如果此线程是使用独立的 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法什么都不做并返回；如果扩展了类并在子类中重写了\
  \ `run()` 方法，则调用被重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程的名字更改为参数名\
  \ |\n| `static void sleep(long millis) throws InterruptedException` | 使当前执行的线程睡眠指定的毫秒数（临时停止执行）。(1\
  \ sec = 1000ms) |\n| `static void sleep(long millis, int nanos) throws InterruptedException`\
  \ | 使当前执行的线程睡眠指定的毫秒加上指定的纳秒数（停止执行）。 |\n| `void start()` | 使此线程开始执行，Java 虚拟机调用此线程的\
  \ `run` 方法。 |\n| `static void yield()` | 使当前执行的线程对象临时暂停并允许其他线程执行。 |\n| `static Thread\
  \ currentThread()` | 返回当前执行线程对象的引用。 |\n\n### 主线程\n\n当一个 Java 程序启动时，一个线程会立即开始。这通常被称为我们程序的主线程，因为它是程序启动时执行的那个线程。主线程是创建“子”线程的线程。虽然主线程是在程序启动时创建的，但可以通过\
  \ `Thread` 对象进行控制。要这样做，我们必须通过调用 `currentThread()` 获取它的引用，它是 `Thread` 类的公共静态成员。该方法返回调用它的方法的线程引用。一旦获取了主方法的引用，我们就可以像控制其他线程一样控制它。\n\
  \n示例 2.1 下面的示例演示了如何获取主线程的引用并使用 `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentTest\
  \ {\n    public static void main (String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n        System.out.println(\"Priority:\"\
  \ + t.getPriority());\n        for (int n=1; n<=5; n++) {\n            System.out.println(n);\n\
  \            try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"Main thread interrupted\");\n     \
  \       }\n        }\n    }\n}\n```\n\n\n\n\n注意 1：`Thread` 类中的 `sleep()` 方法可能会抛出\
  \ `InterruptedException`，这是一个检异常（checked exception）。如果其他线程想要中断正在睡眠的这个线程，就会发生这种情况。\n\
  \n注意 2：注意当 `t`（线程引用）作为 `println()` 的参数时产生的输出。将按顺序显示：线程名称、其优先级以及线程组名称。它的优先级是 5，这是默认值，而\
  \ `main` 也是该线程所属线程组名称。线程组是一个控制整个线程集合状态的数据结构。\n\n## 创建线程\n\n在最通用的意义上，我们通过实例化 `Thread`\
  \ 类型的对象来创建线程。Java 识别了两种实现这一目标的方法：\n\n1. 我们可以实现 `Runnable` 接口。\n2. 我们可以扩展 `Thread`\
  \ 类本身。\n\n## 实现 Runnable\n\n创建线程最简单的方法是创建一个实现 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为\
  \ `run()` 的方法。\n\n```java\npublic void run()\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()`\
  \ 可以调用其他方法、使用其他类并声明变量，就像主线程一样。\n\n唯一的区别是 `run()` 为我们程序中的另一个并发执行的线程建立了入口点。该线程会在 `run()`\
  \ 返回时结束。\n\n在我们创建了一个实现 `Runnable` 的类之后，我们将在该类内部使用以下构造函数之一来实例化 `Thread` 类型的对象：\n\n\
  ```java\nThread(Runnable threadObj)\nThread(Runnable threadObj, String threadName)\n\
  ```\n\n这里 `threadObj` 是被调用 `run` 方法的对象，`threadName` 是新线程的名称。在新线程创建后，在我们调用 `start()`\
  \ 方法之前，它将不会开始运行。\n\n`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run()` 方法开始。\n\
  \n### 示例 12.2\n\n```java\nclass A implements Runnable {\n    public void run() {\n\
  \        for(int i=1;i<=5;i++) {\n            System.out.println(\"Child Thread:\"\
  \ + i);\n        }\n        System.out.println(\"Exiting child thread\");\n    }\n\
  }\n\nclass RunnableTest {\n    public static void main(String args[]) {\n      \
  \  A a1=new A();\n        Thread t1 = new Thread(a1,\"Demo Thread\");\n        t1.start();\n\
  \        System.out.println(\"Main thread exiting\");\n    }\n}\n```\n\nOutput:\n\
  ```\nMain thread exiting\nChild Thread:1\nChild Thread:2\nChild Thread:3\nChild\
  \ Thread:4\nChild Thread:5\nExiting child thread\n```\n\n### 示例 12.3\n\n```java\n\
  class A implements Runnable {\n    Thread t;\n    A() {\n        t= new Thread(this,\
  \ \"Demo Thread\");\n        System.out.println(\"Child thread: \"+ t);\n      \
  \  t.start();\n    }\n    public void run() {\n        for (int i=1; i<=5; i++)\
  \ {\n            System.out.println(\"Child Thread: + i );\n            try {\n\
  \                Thread.sleep(500);\n            } catch (InterruptedException e)\
  \ {\n                System.out.println(e);\n            }\n        }\n        System.out.println(\"\
  Exiting thread\");\n    }\n}\n\nclass RunnableTest2 {\n    public static void main\
  \ (String args ) {\n        A a1=new A();\n        for (int i=1; i<=5; i++) {\n\
  \            System.out.println (\"Main Thread:\"+ i);\n            try {\n    \
  \            Thread.sleep (100);\n            } catch(InterruptedException e) {\n\
  \                System.out.println(\"main thread interrupted\");\n            }\n\
  \        }\n        System.out.println(\"End of Main thread\");\n    }\n}\n```\n\
  \nOutput:\n```\nChild thread: Thread[Demo Thread,5,main]\nMain Thread:1\nChild Thread:\
  \ 1\nChild Thread: 2\nMain Thread:2\nChild Thread: 3\nChild Thread: 4\nMain Thread:3\n\
  Child Thread: 5\nExiting Child thread\nMain Thread:4\nMain Thread:5\nEnd of Main\
  \ thread\n```\n\n## 扩展 Thread 类\n\n创建线程的另一种方法是创建一个扩展 `Thread` 的类，然后创建该类的实例。扩展类必须重写\
  \ `run()` 方法，这是新线程的入口点。它还必须调用 `start()` 来开始新线程的执行。\n\n### 示例 12.4\n\n```java\nclass\
  \ A extends Thread {\n    A( ) {\n        super (\"Test\");\n        System.out.println\
  \ (\"Child thread:\" + this);\n        start();\n    }\n    public void run () {\n\
  \        for (int i=1; i<=5; i++) {\n            System.out.println(\"Child Thread:\"\
  +i);\n            try {\n                Thread.sleep(500);\n            }\n   \
  \     }\n    }\n}\n```\n\n\n\n\n```java\n        System.out.println (\"Exiting Child\
  \ thread\");\n    }\n}\n\nclass ThreadTest {\n    public static void main(String\
  \ args[]) {\n        new A();\n        for (int i=1; i<=5; i++) {\n            System.out.println(\"\
  Main Thread: \"+i);\n            try {\n                Thread.sleep(100);\n   \
  \         } catch (InterruptedException e) {\n                System.out.println(\"\
  Main thread interrupted\");\n            }\n        }\n        System.out.println\
  \ (\"Main thread exiting\");\n    }\n}\n```\n\n输出:\n```\nChild thread:Thread[Testing\
  \ Thread,5,main]\nMain Thread: 1\nChild Thread:1\nChild Thread:2\nMain Thread: 2\n\
  Child Thread:3\nChild Thread:4\nMain Thread: 3\nChild Thread:5\nExiting Child thread\n\
  Main Thread: 4\nMain Thread: 5\nMain thread exiting\n```\n注：如果 `Thread` 没有被分配任何名称，它将是：`Thread-1`、`Thread-2`、`Thread-3`\
  \ 等。\n\n### 选择方法：\n\n`thread` 类定义了几个可以被派生类重写的方法。在这些方法中，唯一必须重写的是 `run()`。当然，这与我们实现\
  \ `Runnable` 接口时需要的方法相同。\n\n许多 Java 程序员认为，只有当类被某种方式进行增强或修改时才应该被扩展。因此，如果我们不重写 `Thread`\
  \ 的其他任何方法，最好的办法可能是简单实现 `Runnable` 接口。\n\n### 创建多个线程：\n\n示例 12.5\n\n```java\nclass\
  \ A implements Runnable {\n    String name;\n    Thread t;\n    A(String threadName)\
  \ {\n        name=threadName;\n        t=new Thread(this, name);\n        System.out.println(\"\
  Child thread:\"+t);\n        t.start();\n    }\n    public void run() {\n      \
  \  for(int i=1;i<=5;i++) {\n            System.out.println(name + \":\"+ i );\n\
  \            try {\n                Thread.sleep(1000);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(name+ \"Exiting\");\n    }\n}\n\nclass MultiThreadTest {\n\
  \    public static void main(String[] ) {\n        A a1=new(\"One\");\n        A\
  \ a2=new(\"Two\");\n        A a3=new(\"Three\");\n        try {\n            Thread.sleep(10000);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(\"main\
  \ thread interrupted\");\n        }\n        System.out.println (\"Main thread exiting\"\
  );\n    }\n}\n```\n输出:\n```\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\n\
  Child thread:Thread[Three,5,main]\nOne:1\nTwo:1\nThree:1\nOne:2\nTwo:2\nThree:2\n\
  One:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\nTwo:5\nThree:5\nOneExiting\n\
  TwoExiting\nThreeExiting\nMain thread exiting\n```\n\n### 使用 `isAlive()` 和 `join()`\
  \ 方法强制排序：\n\n通常我们希望主线程最后结束。实现此点的一种方法是在 `main` 方法中调用 `sleep()`。这相当粗糙。有两种方法可以判断一个线程是否已完成。首先，我们可以在线程上调用\
  \ `isAlive()`。该方法由 `Thread` 定义，其通用形式为：`boolean isAlive()`。如果调用该方法的线程仍在运行，则 `isAlive()`\
  \ 返回 `true`，否则返回其他值。虽然 `isAlive()` 有时很有用，但我们通常用于等待线程完成的方法是 `join()`，此处所示：`void join()\
  \ throws InterruptedException`。该方法会等待直到调用它的线程终止。`join()` 的其他形式允许我们指定等待指定线程终止的最长时间。接下来的示例使用了\
  \ `join()` 来确保主线程是最后一个停止的线程。它还演示了 `isAlive()` 方法。\n\n示例 2.6\n\n```java\nclass A\
  \ implements Runnable {\n    String name;\n    Thread t;\n    A(String threadName)\
  \ {\n        name=threadName;\n        t=new Thread(this, name);\n        System.out.println(\"\
  Child thread:\"+t);\n        t.start();\n    }\n    public void run() {\n      \
  \  for(int i=1;i<=5;i++) {\n            System.out.println(name + \":\"+ i );\n\
  \            try {\n                Thread.sleep(1000);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n        }\n     \
  \   System.out.println(name+ \"Exiting\");\n    }\n}\n```\n\n\n\n\n\n```java\n \
  \       }\n    }\n    System.out.println(name + \"Exiting\");\n    }\n}\nclass DemoJoin\
  \ {\n    public static void main(String args[]) {\n        A ob1 = new A(\"One\"\
  );\n        A ob2 = new A(\"Two\");\n        A ob3 = new A(\"Three\");\n       \
  \ System.out.println(\"Thread One is alive?:\" + ob1.t.isAlive());\n        System.out.println(\"\
  Thread Two is alive?:\" + ob2.t.isAlive());\n        System.out.println(\"Thread\
  \ Three is alive?:\" + ob3.t.isAlive());\n        try {\n            ob3.t.join();\n\
