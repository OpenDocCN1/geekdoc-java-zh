  ### FlowLayout 布局（续）\n\n#### 示例 17.3\n如果我们将行\n`f.setLayout(new FlowLayout(FlowLayout.CENTER));`\n\
  改为 `f.setLayout(new FlowLayout(FlowLayout.LEFT));`，组件将左对齐。\n**输出：**\n![](img/image1273.jpeg)\n\
