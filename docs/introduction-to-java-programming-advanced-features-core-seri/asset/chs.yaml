  \ exiting\n```\n\n![STAR-LOGO-2013](img/image01215.jpeg)\n\n# 章节：∞ 13 ∞\n\n## (修饰符\
  \ / 可见性模式)\n\n## 简介\n修饰符是 Java 关键字，为编译器提供有关代码、数据、类或接口性质的信息。例如，我们一直在使用可见性修饰符 `public`、`private`、`protected`、`package\
  \ public` 等来指定类成员的可见性。除了可见性，我们还使用了修饰符 `static`、`final` 和 `abstract`。\n\n为了方便理解，修饰符可以分类为：\n\
  \n1. 顶层类和接口的访问权限修饰符。\n2. 类的成员访问权限/可见性修饰符。\n3. 接口的成员访问权限/可见性修饰符。\n4. 顶层类的其他修饰符。\n\
  5. 顶层接口的其他修饰符。\n6. 接口成员的其他修饰符。\n7. 类成员的其他修饰符。\n\n### 1. 顶层类和接口的访问权限修饰符：\n* `public`\n\
  * `default`（包级）访问权限\n\n### 2. 类的成员访问权限/可见性修饰符：\n通过指定成员访问权限修饰符，类可以控制哪些信息对客户端（即其他类）可见。这些修饰符帮助类定义一个约，让客户端确切知道该类提供了哪些服务。\n\
  \n成员的访问权限/可见性可以是以下之一：\n* `public`\n* `protected`\n* `default`（也称为包级访问）\n* `private`\n\
  \n注意：成员访问权限修饰符只有在类（或其任何一个子类）对客户端可见时才有意义。另外请注意，一个成员可以指定一个访问权限修饰符。\n\n该讨论同时适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问权限/可见性修饰符：\n可以与接口数据成员和方法使用的唯一成员访问权限/可见性修饰符是 `public`。\n\n`public`\
  \ 也是接口成员的隐式访问权限/可见性修饰符，即使我们不使用 `public` 修饰符，成员总是被隐式假设为公共的。\n\n### 4. 顶层类的其他修饰符：\n\
  除了可见性修饰符，我们还可以在顶层类之前使用以下修饰符：\n\n**(a) `abstract`**\n可以使用关键字 `abstract` 指定一个类，表示它不能被实例化。包含抽象方法的类必须是\
  \ `abstract` 的。\n\n**(b) `final`**\n可以使用关键字 `final` 指定一个类，表示它不能被扩展。\n\n### 5. 顶层接口的其他修饰符：\n\
  **(a) `abstract`**\n这是除可见性修饰符外，唯一可用于接口修饰符。\n\n### 6. 接口成员的其他修饰符：\n**数据成员：**\n除了可见性修饰符\
  \ `public` 外，我们还可以使用 `static` 和 `final`。\n\n**方法：**\n除了可见性修饰符 `public` 外，我们还可以使用\
  \ `abstract`。\n\n### 7. 类成员的其他修饰符：\n可以通过以下关键字在声明中指定字段和方法的某些特性：\n1. `static`\n2.\
  \ `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n7. `volatile`\n\
  \n#### A. `static` 修饰符\n`static` 成员属于它们声明的类，而不是该类的任何实例的一部分。根据类中静态成员的访问权限修饰符，客户端可以使用类名或通过类的对象引用来访问这些成员。\n\
  \n#### B. 静态变量（也称为类变量）\n这些变量仅存在于它们定义的类中。当类被加载时，如果没有指定显式初始化表达式，静态变量将初始化为默认值。静态成员变量通常用于跟踪实例的全局信息。\n\
  \n#### C. 静态方法\n这些也被称为类方法。类中的静态方法可以直接访问类中的其他静态成员。它无法访问类的实例（即非静态）成员，因为静态方法没有与对象关联的概念。\n\
  \n\n\n\n\n* 它们只能调用其他静态方法。\n* 它们只能访问静态数据成员。\n* 它们无法以任何方式引用 `this` 或 `super`。\n\n\
  ### 静态初始化块 (static initialization block)\n\n一个 Java 类可以有一个或多个静态初始化块。静态初始化块的语法如下：\n\
  \n```java\nstatic\n{\n    code\n}\n```\n\n静态块可以被视为一种静态方法，它在类加载时被隐式/自动调用。\n\n静态块在以下情况下非常有用：\n\
  \n* 静态变量的动态初始化。\n* 在类加载时执行一次性活动。例如，加载 jdbc 驱动类。\n* 在 `Hashtable`、`HashMap`、`Properties`\
  \ 等中加载较小的数据库/配置文件。\n\n### B. final 修饰符\n\n`final` 修饰符可以用于：\n* 局部变量\n* 实例变量/数据成员\n\
  * 静态变量/数据成员\n* 实例方法\n\n#### final 变量\n\nfinal 变量通常在声明时初始化，一旦赋值，其值就不能被修改。以下是关于 final\
  \ 变量的一些重要点：\n\n* 尽管被称为变量，但 final 变量是一个常量。一旦初始化，它的值就无法更改。这适用于实例变量、静态和局部变量，包括声明为 `final`\
  \ 的参数。\n* `final` 是唯一适用于局部变量或形式参数的修饰符。\n* 基本数据类型的 final 变量一旦初始化，其值就无法更改。\n* 引用类型的\
  \ final 变量一旦初始化，其引用值就无法更改，但它所指向的对象的状态仍然可以更改。\n* 通常，final 变量在声明时初始化，但并非必须如此。这种 final\
  \ 变量也称为空白 final 变量（blank final variable），在在使用之前必须初始化一次。\n* `final static` 变量通常用于定义具名常量，例如\
  \ `Integer.MAX_VALUE`，它是 int 的最大值。\n\n#### 局部 final 变量:-\n\n**示例 13.1**\n\n以下示例说明了如上所述，局部\
  \ final 变量可以留空，但在首次使用之前必须初始化。变量 `x` 是在显示器上显示其值之前才进行初始化的。\n\n```java\nclass FinalTest1\
  \ // 使用了空白 final\n{\n    public static void main(String args[])\n    {\n       \
  \ final int x;           // 声明时不必初始化\n        x = 50;\n        System.out.println(x);\n\
  \    }\n}\n```\n输出: 50\n\n**示例 13.2**\n\n以下代码将无法编译，因为 final 变量被初始化两次。\n\n```java\n\
  class FinalTest2 // 使用了空白 final\n{\n    public static void main(String args[ ])\n\
  \    {\n        final int x;\n        x = 0;\n        System.out.println(x);\n \
  \       x = 60;\n    }\n}\n```\n\n#### 实例 final 变量:-\n\n实例 final 可以留空，但在获取包含 final\
  \ 变量的类的对象引用之前必须进行初始化。因此，如果不在声明时初始化，final 变量可以初始化的其他地方是：\n* 构造方法\n*  代码块\n\n**示例\
  \ 13.3**\n\n以下程序将无法编译，因为 final 变量没有初始化。默认初始化的概念不适用于 final 变量，因为它们在初始化后不会被修改。\n\n\
  ```java\nclass FinalTest3 // 使用了 final\n{\n    final int x; // 实例变量没有初始化\n}\nclass\
  \ MyClass\n{\n    public static void main(String args[])\n    {\n        FinalTest3\
  \ f=new FinalTest3();\n        System.out.println(f.x);\n    }\n}\n```\n输出:\n(编译时错误):\
  \ variable `x` might not have been initialized.\n\n**示例 13.4**\n\n以下程序也将无法编译，因为\
  \ final 变量在获取引用后才被初始化。\n\n```java\nclass FinalTest4\n{\n    final int x;\n}\nclass\
  \ MyClass\n{\n    public static void main(String args[])\n    {\n        FinalTest4\
  \ f=new FinalTest4();\n        f.x = 0;\n        System.out.println(f.x);\n    }\n\
  }\n```\n\n**示例 13.5**\n\n以下示例说明空白实例变量可以在构造方法中初始化。\n\n```java\nclass FinalTest5\n\
  {\n    final int x;\n    public static void main(String args[])\n    {\n       \
  \ FinalTest5 f=new FinalTest5();\n        System.out.println(f.x);\n    }\n    FinalTest5()\n\
  \    {\n        x=0;\n    }\n}\n```\n输出: 0\n\n**示例 13.6**\n\n以下程序说明空白 final 变量可以使用动态值初始化，并可以使用\
  \ `this` 关键字引用。因此，同一类的对象可以有不同的 final 变量值。\n\n```java\nclass FinalTest6\n{\n    final\
  \ int x;\n    FinalTest6(int x1)\n    {\n        x = x1;\n    }\n    public static\
  \ void main(String args[])\n    {\n        FinalTest6 f1=new FinalTest6(10);\n \
  \       FinalTest6 f2=new FinalTest6(20);\n        System.out.println(f1.x);\n \
  \       System.out.println(f2.x);\n    }\n}\n```\n\n\n\n\n初始化块可以被视为一种构造函数，它在对象创建时被隐式地/自动调用。事实上，如果一个类包含初始化块，它们会在任何构造函数执行之前，按照定义的从上到下的顺序执行。\n\
  \n### 示例 13.7:\n\n```java\nclass FinalTest7\n{\n    final int x;\n    public static\
  \ void main(String args[])\n    {\n        FinalTest7 f=new FinalTest7();\n    \
  \    System.out.println(f.x);\n    }\n    {\n        x=20;\n    }\n}\n```\n\n初始化块在以下情况下非常有用：\n\
  * 实例变量的动态初始化。\n* 定义所有构造函数通用的代码。这将增加代码的可重用性并减少维护工作。\n\n### static final 变量：\n\n`static\
  \ final` 变量可以留空，但必须在类被程序使用之前完成初始化。因此，如果我们在声明时没有进行初始化，那么 `static final` 变量唯一的初始化位置就是：\n\
  * `static` 初始化块\n\n### 示例 13.8\n\n以下示例说明了空白的 `static final` 变量可以在 `static` 块中初始化。\n\
  \n```java\nclass FinalTest8\n{\n    static final int x;\n    public static void\
  \ main(String args[])\n    {\n        System.out.println(FinalTest8.x);\n    }\n\
  \    static\n    {\n        x=20;\n    }\n}\n```\n输出：`20`\n\n### Final 方法：\n\n*\
  \ 类中的 `final` 方法是完整的（即具有实现），不能在任何子类中被重写。因此，子类在更改方法行为方面受到了限制。\n* 编译器能够对 `final` 方法执行某些代码优化，因为可以对此类成员做出某些假设。当调用非静态方法时，运行时会确定对象的实际类型，将方法调用绑定到该该的正确实现上，然后进行调用。\n\
  * 对于 `final` 方法，我们确定子类无法重写该方法，因此像处理 `private` 和 `static` 方法的情况一样，绑定是在编译时完成的，这绝对提升了性能。\n\
  \n### abstract 修饰符：\n\n`abstract` 修饰符只能用于实例方法。`abstract` 方法没有实现，也就是说，`abstract`\
  \ 方法没有定义方法体，类中仅提供方法原型。\n其所在的类也是 `abstract` 的（即不完整的），并且必须显式声明为 `abstract`。`abstract`\
  \ 类的子类必须提供方法的实现；否则，它们也是抽象的。\n\n以下是与抽象方法相关的一些重要点：\n* `abstract` 方法不能声明为 `private`。这是显而易见的，因为我们无法重写\
  \ `private` 方法，而在 `abstract` 方法的情况下，方法体始终由子类通过重写抽象方法来提供。\n* 只有实例方法可以声明为 `abstract`，因为\
  \ `static` 方法不能被重写；声明 `abstract static` 方法没有意义，并将导致编译错误。\n* `final` 方法不能是 `abstract`\
  \ 的，反之亦然。\n* 关键字 `abstract` 不能与方法的任何访问修饰符结合使用。\n* 在接口中指定的方法隐式地是 `abstract` 的，因为接口中只定义了方法原型。\n\
  \n### synchronized 修饰符：\n\n`synchronized` 关键字可以用于方法和代码块。程序中可以多个线程同时执行。它们可能会尝试在同一个对象上同时执行多个方法。如果希望一次只有一个线程可以执行对象中的某个方法，可以将这些方法声明为\
  \ `synchronized`。它们的执行在所有线程之间是互斥的。\n\n在任何给定时刻，最多有一个线程可以执行对象上的 `synchronized` 方法。此讨论也适用于类的\
  \ `static synchronized` 方法。\n注意：`synchronized` 修饰符不适用于类或成员变量。\n\n### native 修饰符：\n\
  \n`native` 修饰符只能引用方法。与 `abstract` 关键字一样，`native` 表示方法的体将在其他处找到。`native` 方法体完全位于\
  \ `JVM` 之外，位于库中。`Native` 代码用非 Java 语言编写（通常是 `C` 或 `C++`），并针对单一目标机器类型进行编译。因此，Java\
  \ 的平台独立性被破坏了。将 Java 移植到新平台的人通过实现大量的 `native` 代码来支持 GUI 组件、网络通信以及广泛其他特定平台的功能。然而，应用程序和\
  \ Applet 程序员需要编写 `native` 代码的情况非常罕见。\n\n### transient 修饰符：\n\n可以使用序列化存储对象。序列化将对象转换为有利于存储对象的输出格式。稍后可以序列化时的相同状态检索对象，这意味着包含在序列化中的所有字段将具有与序列化时相同的值。此类对象被称为持久化对象。\n\
  \n在类声明中可以将字段指定为 `transient`，表示当类的对象被写入持久化存储时，其值不应被保存。\n\n```java\nclass Experiment\
  \ implements Serializable\n{\n    transient int currentTemperature; // transient\n\
  \    double mass; // 持久化值\n}\n```\n\n对静态变量指定 `transient` 修饰符是冗余的，因此不建议这样做。静态变量不是序列化对象持久化状态的一部分。\n\
  \n### volatile 修饰符：\n\n在执行期间，编译后的代码可能会出于效率考虑缓存字段的值。由于多个线程可以访问同一个字段，因此不允许缓存在读取和写入字段值时导致不一致是至关重要的。`volatile`\
  \ 修饰符可以用于告知编译器不要尝试对该字段进行优化。\n\n\n\n\n\n# 包装类 (Wrapper Classes)\n\nJava 为每个基本数据类型都提供了对应的包装类，如下所示：\n\
  \n| 基本数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | `Boolean` |\n| char | `Character`\
  \ |\n| byte | `Byte` |\n| short | `Short` |\n| int | `Integer` |\n| long | `Long`\
  \ |\n| float | `Float` |\n| double | `Double` |\n\n## Number 类\n\n抽象类 `Number` 定义了一个超类，被封装数值类型\
  \ `byte`、`short`、`int`、`long`、`float` 和 `double` 的类实现。`Number` 类拥有抽象方法，用于返回不同数字格式的对象值。这些方法是：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `byte byteValue()` | 将指定的数字作为 `byte` 返回值。 |\n\
  | `short shortValue()` | 将指定的数字作为 `short` 返回值。 |\n| `abstract int intValue()` |\
  \ 将指定的数字作为 `int` 返回值。 |\n| `abstract long longValue()` | 将指定的数字作为 `long` 返回值。 |\n\
  | `abstract float floatValue()` | 将指定的数字作为 `float` 返回值。 |\n| `abstract double doubleValue()`\
  \ | 将指定的数字作为 `double` 返回值。 |\n\n**注意**：`byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回的值可能涉及舍入或截断。\n\n### 示例 14.1\n\n下面的示例演示了在调用 `Number` 类的方法时是如何发生舍入和截断的。\n\
  \n```java\nclass Wrapper {\n    public static void main(String args[ ]) {\n    \
  \    Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // truncation\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); truncation\n    }\n}\n```\n\n**输出:**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n## 使用包装类的构造函数将基本类型转换为对象，以及将数值对象转换回基本类型\n\
  \n### 示例 14.2\n\n下面的示例演示了如何将基本类型封装在对象中，以及如何将其转换回基本类型。\n\n```java\nclass Convert\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  primitive numbers to objects \" + \"using constructors\");\n        byte b = 105;\n\
  \        Byte bObj = new Byte(b);\n        System.out.println(bObj); // toString()\n\
  \        short s = 205;\n        Short sObj = new Short(s);\n        System.out.println(sObj);\n\
  \        int i=32717;\n        Integer iObj = new Integer(i);\n        System.out.println(iObj);\n\
  \        long l = 234543335565675L;\n        Long lObj = new Long(l);\n        System.out.println(lObj);\n\
  \        float f = 3.145f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"numeric objects to primitive numbers\");\n      \
  \  byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n        int\
  \ i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n        float f1 =\
  \ fObj.floatValue();\n        double d1 = dObj.doubleValue();\n        System.out.println(b1);\n\
  \        System.out.println(s1);\n        System.out.println(i1);\n        System.out.println(l1);\n\
  \        System.out.println(f1);\n        System.out.println(d1);\n    }\n}\n```\n\
  \n**输出:**\n```\nprimitive numbers to objects using constructors\n105\n205\n32717\n\
  234543335565675\n3.145\n3.1415\nnumeric objects to primitive numbers\n105\n205\n\
  32717\n234543335565675\n3.145\n3.1415\n```\n\n## 使用包装类的 toString() 静态方法将基本类型转换为字符串\n\
  \n#### 示例 14.3\n\n```java\nclass ConvertToString {\n    public static void main(String\
  \ args[]) {\n        System.out.println(\"primitive numbers to String \" + \"using\
  \ toString() static method of wrapper class:\");\n        byte b = 105;\n      \
  \  String str=Byte.toString(b);\n        System.out.println(str);\n        short\
  \ s=303;\n        str = Short.toString(s);\n        System.out.println(str);\n \
  \       int i=100;\n        str = Integer.toString(i);\n        System.out.println(str);\n\
  \        long l=45444444444l;\n        str = Long.toString(l);\n        System.out.println(str);\n\
  \        float f=3.444f;\n        str=Float.toString(f);\n        System.out.println(str);\n\
  \        double d=3.44444;\n        str=Double.toString(d);\n        System.out.println(str);\n\
  \    }\n}\n```\n\n**输出:**\n```\nprimitive numbers to String using toString() static\
  \ method of wrapper class:\n105\n303\n100\n45444444444\n3.444\n3.44444\n```\n\n\
  ## 使用包装类的 toString() 方法将对象转换为字符串\n\n```java\nclass ObjectDemo {\n    public static\
  \ void main(String args[]) {\n        System.out.println(\"Converting objects to\
  \ Strings\" + \"toString() method of wrapper class:\");\n        byte b = 105;\n\
  \        Byte bObj = new Byte(b);\n        String str=bObj.toString();\n       \
  \ System.out.println(str);\n        short s=203;\n        Short sObj=new Short(s);\n\
  \        str = sObj.toString();\n    }\n}\n```\n\n\n\n\n\n### 使用相应包装类的 `toString()`\
  \ 方法将对象类型数字转换为字符串：\n\n输出：\n```\n103\n203\n32000\n4544444444444\n3.1444\n4.1444\n\
  ```\n\n### 使用相应包装类的静态 `valueOf()` 方法将 String 对象（数字型字符串）转换为数值对象\n\n#### 示例 14.5\n\
  \n```java\nclass StringToNumericObjectDemo {\n    public static void main(String\
  \ args[]) {\n        String str = \"30\";\n        String str2 = \"30.33\";\n  \
  \      Byte bObj = Byte.valueOf(str);\n        System.out.println(bObj);\n     \
  \   //Byte b1 = new Byte(str2); //NumberFormatException\n        Short sObj = Short.valueOf(str);\n\
  \        System.out.println(sObj);\n        Integer iObj = Integer.valueOf(str);\n\
  \        System.out.println(iObj);\n        Long lObj = Long.valueOf(\"344324232432\"\
  );\n        System.out.println(lObj);\n        Float fObj = Float.valueOf(\"3.333\"\
  );\n        System.out.println(fObj);\n        Double dObj = Double.valueOf(str2);\n\
  \        System.out.println(dObj);\n    }\n}\n```\n输出：\n```\n30\n30\n44324232432\n\
  3.33\n30.33\n```\n注：如果字符串不包含可解析的数字，所有 `valueOf()` 方法都会抛出 `NumberFormatException`。\n\
  \n### 使用相应类的构造函数将字符串（数字型字符串）转换为数值对象\n\n#### 示例 4.6\n\n```java\nclass StringToNumericDemo1\
  \ {\n    public static void main(String args[]) {\n        String str = new String(\"\
  30\");\n        //String str=\"30\";\n        String str2=new String(\"30.333\"\
  );\n        Byte bObj = new Byte(str);\n        System.out.println(bObj);\n    \
  \    //Byte bObj=new Byte(str2); //NumberFormatException\n        Short sObj=new\
  \ Short(str);\n        System.out.println(sObj);\n        Integer iObj=new Integer(str);\n\
  \        System.out.println(iObj);\n        Long lObj=new Long(str);\n        System.out.println(lObj);\n\
  \        Float fObj=new Float(str);\n        System.out.println(fObj);\n       \
  \ Double dObj=new Double(str);\n        System.out.println(dObj);\n    }\n}\n```\n\
  输出：\n```\n30\n30\n30\n30\n30.333\n30.333\n```\n注：如果字符串不包含可解析的数字，上述构造函数将抛出 `NumberFormatException`。\n\
  \n### 使用相应包装类的解析方法将 String 对象（数字型字符串）转换为原始类型数字\n\n#### 示例 14.7：\n\n```java\nclass\
  \ StringToPrimitiveDemo {\n    public static void main(String args[]) {\n      \
  \  String str = new String(\"30\");\n        //String =\"30\";\n        String str2=\
  \ new String(\"30.33\");\n        byte b = Byte.parseByte(str);\n        System.out.println(b);\n\
  \        //byte b1=Byte.parseByte(str2); //NumberFormatException\n        short\
  \ s = Short.parseShort(str);\n        System.out.println(s);\n        int i = Integer.parseInt(str);\n\
  \        System.out.println(i);\n        long l = Long.parseLong(str);\n       \
  \ System.out.println(l);\n        float f = Float.parseFloat(str2);\n        System.out.println(f);\n\
  \        double d = Double.parseDouble(str2);\n        System.out.println(d);\n\
  \    }\n}\n```\n（注：原文文本中 14-23 行的代码逻辑存在混乱和错位，已根据语义进行了结构化对齐）\n\n```java\nSystem.out.println(str);\n\
  Integer iObj = new Integer(32000);\nstr = iObj.toString();\nSystem.out.println(str);\n\
  str = new Long(4544444444444l).toString();\nSystem.out.println(str);\nstr = new\
  \ Float(3.1444f).toString();\nSystem.out.println(str);\nstr = new Double(4.1444).toString();\n\
  System.out.println(str);\n```\n\n\n\n\n\n# Byte 类\n\n| `static Byte decode(String\
  \ nm)` | 返回一个包含字符串 `nm` 所指定值的 `Byte` 对象。接受由以下语法提供的十进制、十六进制和八进制数：可解码字符串:[-] 十进制数值[-]\
  \ 0x 十六进制数字[-] 0X 十六进制数字[-] # 十进制数字[-] 0 八进制数字 |\n| :--- | :--- |\n| `boolean equals(Object\
  \ obj)` | 将此对象与指定的对象进行比较。 |\n| `int hashCode()` | 返回此 `Byte` 的哈希值。 |\n\n## Short\
  \ 类中的其他方法\nShort 类中的方法与 `Byte` 类的方法相同，只是在上表中使用 `short` 和 `Short` 单词替换了 `byte` 和\
  \ `Byte` 单词。\n\n## Integer 类中的其他方法\n某些方法与 `Byte` 或 `Short` 类的方法相同。其他一些方法在下文中描述：\n\
  \n| `static String toBinaryString(int i)` | 返回整数参数 `i` 的字符串表示，作为基 2 的无符号整数。 |\n\
  | `static String toHexString(int i)` | 返回整数参数 `i` 的字符串表示，作为基 16 的无符号整数。 |\n| `static\
  \ String toOctalString(int i)` | 返回整数参数 `i` 的字符串表示，作为基 8 的无符号整数。 |\n\n## Long 类中的其他方法\n\
  `Long` 类中的方法与 `Integer` 类的方法几乎相同。\n\n# Character 类\n字符类将基本类型 `char` 的值封装在对象中。\n\n\
  #### 构造函数\n`Character(char value)`\n构造一个新的分配的 `Character` 对象，该对象表示指定的 `char` 值。\n\
  示例：`Character chObj = new Character('A');`\n\n### 方法\n`Character` 类的某些方法在下表中描述：\n\
  \n| `char charValue()` | 返回此 `Character` 的值的值。 |\n| `static boolean isDefined(char\
  \ ch)` | 确定指定的字符 `ch` 是否在 Unicode 中。 |\n| `static boolean isDigit(char ch)` | 确定指定的字符\
  \ `ch` 是否为数字。 |\n| `static boolean isJavaIdentifierPart(char ch)` | 确定指定的字符 `ch`\
  \ 是否可以作为 Java 标识符的一部分（除第一个字符外）。 |\n| `static boolean isJavaIdentifierStart(char\
  \ ch)` | 确定指定的字符 `ch` 是否允许作为 Java 标识符的第一个字符。 |\n| `static boolean isLetter(char\
  \ ch)` | 确定指定的字符 `ch` 是否为字母。 |\n| `static boolean isLetterorDigit(char ch)` | 确定指定的字符\
  \ `ch` 是否为字母或数字。 |\n| `static boolean isLowerCase(char ch)` | 确定指定的字符 `ch` 是否为小写字母。\
  \ |\n| `static boolean isSpaceChar(char ch)` | 确定指定的字符 `ch` 是否为 Unicode 空格字符。 |\n\
  | `static boolean isTitleCase(char ch)` | 确定指定的字符 `ch` 是否为标题大小写字符。 |\n| `static\
  \ boolean isUpperCase(char ch)` | 确定指定的字符 `ch` 是否为大写字母。 |\n| `static boolean isWhitespace(char\
  \ ch)` | 根据 Java 确定指定的字符 `ch` 是否为空白字符。 |\n| `static char toLowerCase(char ch)` |\
  \ 将字符参数 `ch` 转换为小写。 |\n| `static char toUpperCase(char ch)` | 将字符参数 `ch` 转换为大写。\
  \ |\n| `static char toTitleCase(char ch)` | 将字符参数 `ch` 转换为标题大小写。 |\n| `int compareTo(Character\
