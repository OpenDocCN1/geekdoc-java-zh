  \n# 数据类型\n\nJava 中的数据类型大致分为两类：\n\n#### 1. 基本数据类型 / 简单类型\nJava 是一种面向对象的语言，但基本数据类型不是对象。出于性能考虑，它们被保留了下来。它们是我们程序定义的其他类型的基础。Java\
  \ 是一种强类型语言。\n\n**数值数据类型**\n- `byte` (1 字节)：范围 -128 到 127\n- `short` (2 字节)：范围 -32768\
  \ 到 32767\n- `int` (4 字节)：范围 -2147483648 到 2147483647\n- `long` (8 字节)：范围 -9223372036854775808\
  \ 到 9223372036854775807\n\n包含 `byte`、`short`、`int` 的表达式会自动转换为 `int`。\n\n**浮点型数据类型**\n\
  - `float` (4 字节)：范围 1.401298464324817E-45f 到 3.4028234663852886E38f\n- `double`\
  \ (8 字节)：范围 4.9E-324d 到 1.7976931348623157E308d\n\n**布尔数据类型**：boolean\n\n**字符数据类型**\n\
  - `char` (2 字节)：范围 0 到 65535\n\n*注*：Java 字符也可以用于整数表达式。当字符作为整数表达式的一部分时，使用其 Unicode\
  \ 值。\n\n#### 2. 非基本数据类型 / 派生数据类型或引用\n\n\n\n\n\n# 数据类型\n\n引用数据类型也称为派生数据类型，因为它们派生自原始数据类型。\n\
  \n### 类\n1. 内置类/库类\n2. 用户定义类\n\n## 接口\n3. 内置类/库类\n4. 用户定义类\n\n# 数组\n在 Java 中，数组也被视为对象。\n\
  \n## Java 的自动转换\n在以下情况下会发生：\n1. 两个类型是兼容的。\n2. 目标类型大于源类型。\n\n## 变量\n变量是用于存储值的内存位置名称。在向变量中存储值之前，必须对其进行声明。或者说，变量是主内存中的位置（内存位置），我们可以在其中存储数据或值。\n\
  \n变量有三种：\n\n### 局部变量\n局部变量用于块或方法内部。局部变量（也称为自动变量）默认不初始化。局部变量在第一次使用之前必须显式初始化，否则将出现编译错误“变量可能未初始化”（Variable\
  \ might not have been initialized）。\n\n示例\n```java\nint a,b=5;\nif(b>2)\n{\n   \
  \ a = b;\n}\nSystem.out.print(a);\n```\n在上面的程序中，如果 `if` 条件为假，则 `a` 的值未定义，因此编译器将给出错误“变量\
  \ a 可能未初始化”。\n\n在 Java 中，我们不能在内部块中定义与外部块同变量。\n```java\nint a=5;\n{\n    int a=7;\
  \ // 错误\n}\n```\n\n### 实例变量\n实例变量用于定义对象的属性或状态。\n\n### 类变量\n类变量用于定义类的所有对象共有的属性/状态。\n\
