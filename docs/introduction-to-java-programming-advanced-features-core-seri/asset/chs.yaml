  } catch(InterruptedException e) { }\nf.setVisible(false);\nf.setSize(500,100);\n\
  f.setVisible(true);\ntry {\n    Thread.sleep(500);\n} catch(InterruptedException\
  \ e){ }\nf.setVisible(false);\nf.setBounds(20, 20, 100, 100);\nf.setVisible(true);\n\
  Dimension d3=f.getSize();\nSystem.out.println(\"Frame Size : \" + d3.width + \"\
  \ \" + d3.height);\nSystem.out.println(f.paramString());\n}\n```\n\n**输出：**\n![](img/image01272.jpeg)\n\
