  \ last :\" +l1);\n\n        // 获取并设置值\n        String val = l1.get(2);\n       \
  \ l1.set(2, val + \"Changed\");\n        System.out.println(\"l1 after change:\"\
  +l1);\n\n        // 倒序迭代器\n        Iterator itr=l1.descendingIterator();\n     \
  \   while(itr.hasNext())\n        {\n            System.out.println(itr.next());\n\
