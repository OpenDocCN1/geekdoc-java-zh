  输出：![](img/image0281.jpeg)\n\n## CardLayout\n\n在 `CardLayout` 中，我们可以存储许多卡片，但一次只显示一张卡片。一次只有一张卡片是可见的，但你可以在不同卡片之间切换。\n\
  \n#### 构造函数\n- `CardLayout()`：创建一个 `CardLayout`。\n- `CardLayout(int h, int v)`：创建一个具有指定水平和垂直间隙的\
  \ `CardLayout`。\n\n### 方法\n- `first(Container parent)`：切换到第一张卡片。\n- `next(Container\
  \ parent)`：切换到下一张卡片。如果当前卡片是最后一张，它将切换到第一张。\n- `previous(Container parent)`：切换到上一个卡片。如果当前卡片是第一张，它将切换到最后一张。\n\
  - `last(Container parent)`：切换到最后一张卡片。\n- `show(Container parent, String name)`：切换到带有给定名称的布局中的组件。如果不存在此类组件，则什么都不会发生。\n\
  \n### 如何使用 CardLayout\n1. 创建一个新的 `Panel` 和一个 `CardLayout` 对象。\n2. 使用 `CardLayout`\
  \ 实例为 `Panel` 设置布局。\n3. 对于每张卡片，创建一个单独的 `Panel` 并添加你任何组件（按钮、复选框等）。\n4. 将第 3 步中创建的每个\
  \ `Panel` 添加到第 1 步创建的主 `Panel` 中，并为每张卡片指定一个唯一名称。\n5. 最后，将主 `panel` 添加到 applet 窗口。\n\
  \n### 示例 17.10\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ java.applet.*;\n\n/*<applet code=\"CardLayoutTest\" width=500 height=100></applet>*/\n\
  public class CardLayoutTest extends Applet implements ActionListener, MouseListener\
  \ {\n    Panel mp;\n}\n```\n\n\n\n\n\n```java\nCardLayout c1;\n\npublic void init()\n\
  {\n    Button b1=new Button(\"First\");\n    Button b2=new Button(\"Second\");\n\
  \    b1.addActionListener(this);\n    b2.addActionListener(this);\n    add(b1);\n\
  \    add(b2);\n    Panel p1=new Panel();\n    Label l1=new Label(\"INDIA\");\n \
  \   p1.add(l1);\n    Panel p2=new Panel();\n    Label l2=new Label(\"USA\");\n \
  \   p2.add(l2);\n    mp=new Panel();\n    c1=new CardLayout();\n    mp.setLayout(c1);\n\
  \    mp.add(p1,\"Country1\");\n    mp.add(p2,\"Country2\");\n    add(mp);\n    addMouseListener(this);\n\
  }\n\npublic void actionPerformed(ActionEvent ae)\n{\n    Button b=(Button)ae.getSource();\n\
  \    if(b.getLabel().equals(\"First\"))\n        c1.show(mp,\"Country1\");\n   \
  \ else\n        c1.show(mp,\"Country2\");\n}\n\npublic void mousePressed(MouseEvent\
  \ me)\n{\n    c1.next(mp);\n}\n\npublic void mouseReleased(MouseEvent me){}\npublic\
  \ void mouseClicked(MouseEvent me){}\npublic void mouseEntered(MouseEvent me){}\n\
  public void mouseExited(MouseEvent me){}\n}\n```\n\nOutput:\n![](img/image1282.jpeg)\n\
  \n## GridBagLayout\n`GridBagLayout` 是标准布局管理器中最复杂且最灵活的一种。尽管它听起来似乎应该是 `GridLayout`\
  \ 的子类，但它完全不同。在 `GridLayout` 中，元素的排列方式为\n\n### 示例 17.11\nAWT 组件可以分类为：\n1. 视觉组件。\n\
  2. 容器组件。\n3. 菜单组件。\n\n视觉组件和容器组件都是从 `java.awt.Component` 类开始的组件层次结构的一部分。\n\n####\
  \ `java.awt.Component` 类的方法\n由于继承自 `java.awt.component`，所有的视觉组件和容器组件都实现了几个方法（菜单组件继承自\
  \ `java.awt.MenuComponent`，因此它们不继承相同的父类功能）。这些方法在下文中讨论：\n\n- `Dimension getSize()`：以\
  \ `Dimension` 对象的格式返回此组件的大小，该对象具有 `int` 类型的公共数据成员 `height` 和 `width`。\n- `void setBackground(Color\
  \ c)`：设置组件的背景颜色。通常，背景颜色用于渲染组件的非文本区域。\n- `void setForeground(Color c)`：设置组件的前景颜色。通常，组件的前景颜色用于渲染文本。如果我们不显式地设置组件的前景或背景颜色，组件将使用其直接容器的前景颜色和背景颜色。\n\
  - `void setFont(Font f)`：`setFont()` 方法决定组件在渲染其需要显示的任何文本时使用的字体。如果我们不显式地设置组件的字体，组件将使用其容器的字体。\n\
  - `void setEnabled(Boolean b)`：如果参数为 `true`，则组件具有正常外观。如果参数为 `false`，则组件将置灰且对用户输入没有响应。\n\
  - `void setSize(Dimension d)`：设置组件的大小。\n- `void setSize(int width, int height)`：设置组件的大小。\n\
  - `void setBounds(int x, int y, int width, int height)`：尝试移动并调整组件的大小。左上角的新位置由 `x`\
  \ 和 `y` 指定，新大小由 `width` 和 `height` 指定。\n- `void setVisible(Boolean b)`：此方法接受一个 `Boolean`\
  \ 参数，决定组件是否在屏幕上可见。此方法通常用于帧（frames）。\n\n**注意：** 如果我们已经尝试过调用 `setSize()` 或 `setBounds()`，我们就知道这通常是徒劳的。我们尝试赋予组件的大小和位置会被布局管理器覆盖。事实上，这两个方法存在很大程度上是为了供布局管理器使用的。此规则的例外是\
  \ `Frame` 类，它不受布局管理器的控制，并且完全接受拥有自己的大小或边界。\n\n### 视觉组件\n视觉组件是用户能够看到并与之交互的组件。AWT 支持以下视觉组件：\n\
  - `Button`\n- `Canvas`\n- `Checkbox`\n- `Choice`\n- `Dialog`\n- `List`\n- `ScrollPane`\n\
  - `Scrollbar`\n- `TextField`\n\n要在 GUI 中使用这些组件之一，我们首先通过调用相应的构造函数来创建一个实例。然后将组件添加到容器中。\n\
  \n### Button\n`Button` 类实现了一个按钮。\n\n**构造函数：**\n- `Button()`\n- `Button(String)`：构造函数接收一个字符串参数，用于指定按钮的标签。当按钮按下时，它会发送一个事件。\n\
  \n**方法：**\n- `String getLabel()`：获取此按钮的标签。\n- `void setLabel(String label)`：将按钮的标签设置为指定的字符串。\n\
  - `void addActionListener(ActionListener l)`：添加指定的动作监听器以接收来自此按钮的动作事件。\n\n#### 示例\
  \ 17.2\n```java\nimport java.awt.*;\nclass ButtonTest{\n    public static void main(String\
  \ args[]) {\n        Frame f=new Frame(\"Testing Button Component\");\n        f.setLayout(new\
  \ FlowLayout());\n        Font f1=new Font(\"Arial\",Font.BOLD,40);\n        Color\
  \ c1=new Color(255,0,0);\n        Color c2=new Color(0,25,0);\n        Button b1\
  \ = new Button();\n        Button b2 = new Button(\"Cancel\");\n        b1.setForeground(c1);\n\
  \        b2.setForeground(c1);\n        b1.setBackground(c2);\n        b2.setBackground(c2);\n\
  \        b1.setFont(f1);\n        b2.setFont(f1);\n        b1.setLabel(\"Ok\");\n\
  \        System.out.println(b2.getLabel());\n        f.add(b1);\n        f.add(b2);\n\
  \        f.setSize(500,200);\n    }\n}\n```\n\n\n\n\n\n```java\nf.setVisible(true);\n\
  }\n}\n```\n\n输出：\n\n![](img/image01283.jpeg)\n\n## Canvas\n\n`Canvas` 是一种组件，它没有默认的外或行为。我们可以通过派类\
  \ `canvas` 来创建自定义绘制区域、工作区域、组件等。`Canvas` 接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的视觉效果和体验。\n\
  \n`canvas` 的默认大小（或者更准确地说，首选大小）小得毫无意义。处理这个问题的一种方法是使用可以调整 `canvas` 大小的布局管理器。另一种方法是自己为\
  \ `canvas` 调用 `setSize()`，`canvas` 是少数这种方法实际上可能有效的例子，因为我们传递给 `setSize()` 方法的值将成为\
  \ `canvas` 的首选大小。\n\n### 示例 17.13\n\n```java\nimport java.awt.*;\nclass CanvasTest\n\
  {\n    public static void main (String args [])\n    {\n        Frame f = new Frame\
  \ ();\n        f.setLayout(new FlowLayout());\n        Canvas c=new MyCanvas();\n\
  \        c.setSize(100, 100);\n        f.add(c) ;\n        f.setSize(300, 300 );\n\
  \        f.setVisible(true);\n    }\n}\nclass MyCanvas extends Canvas\n{\n    public\
  \ void paint(Graphics g )\n    {\n        setBackground(Color.green);\n        g.setColor(Color.red\
  \ );\n        g.drawLine(0, 0, 9, 9 );\n    }\n}\n```\n输出：\n![](img/image0284.jpeg)\n\
  \n## Checkbox\n\n复选框是一个双状态按钮。这两个状态为 `true`（选中）和 `false`（未选中）。\n\n构造函数的三种基本形式：\n\
  - `Checkbox()`：创建一个标签为空空字符串的复选框。\n- `Checkbox(String label)`：创建一个带有指定标签的复选框。\n-\
  \ `Checkbox(String label, boolean state)`：创建一个带有指定标签并设置指定状态的复选框。如果我们不指定状态，默认认为 `false`。\n\
  \n方法：\n- `getLabel()`：获取此复选框的标签。\n- `setLabel(String label)`：将此复选框的标签设置为字符串参数。\n\
  - `getState()`：确定此复选框处于“开启”还是“关闭”状态。\n- `setState(boolean state)`：将此复选框的状态设置为指定状态。\n\
  - `addItemListener(ItemListener)`：添加指定的监听器以接收此复选框的项目事件。\n\n### 示例 17.4\n\n```java\n\
  import java.awt.*;\nclass CheckboxTest\n{\n    public static void main(String args[])\n\
  \    {\n        Frame f = new Frame(\"Testing Checkbox Component\");\n        f.setLayout(new\
  \ GridLayout(3,1));\n        Checkbox c1=new Checkbox();\n        Checkbox c2=new\
  \ Checkbox(\"Lunch\",true);\n        Checkbox c3=new Checkbox(\"Dinner\");\n   \
  \     c1.setLabel(\"BreakFast\");\n        c3.setState(true);\n        f.add(c1);f.add(c2);f.add(c3);\n\
  \        if(c1.getState())\n            System.out.println(c1.getLabel());\n   \
  \     if(c2.getState())\n            System.out.println(c2.getLabel());\n      \
  \  if(c3.getState())\n            System.out.println(c3.getLabel());\n        f.setSize(100,100);\n\
  \        f.setVisible(true);\n    }\n}\n```\n输出：\n![](img/image0285.jpeg)\n\n###\
  \ 另一个示例\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest\
  \ extends Frame implements ItemListener\n{\n    Checkbox c1;\n    TextField tf1;\n\
  \    CheckboxTest()\n    {\n        setLayout(new GridLayout(2,1));\n        c1=new\
  \ Checkbox(\"Red\");\n        c1.addItemListener(this);\n        add(c1);\n    \
  \    tf1=new TextField();\n        add(tf1);\n        setSize(100,100);\n      \
  \  setVisible(true);\n    }\n    public static void main(String args[])\n    {\n\
  \        new CheckboxTest();\n    }\n    public void itemStateChanged(ItemEvent\
  \ ie)\n    {\n        if(c1.getState())\n            tf1.setBackground(Color.red);\n\
  \        else\n            tf1.setBackground(Color.white);\n    }\n}\n```\n\n##\
  \ Radio button\n\n复选框可以组合成复选框组，它们具有单选行为。在单选行为下，复选框组内同时只有一个成员可以为 `true`；选择新成员会将之前选中的成员状态改为\
  \ `false`。我们可以通过创建多个复选框并使用 `java.awt.CheckboxGroup` 将它们分组来实现单选行为。在 Java 中，`java.awt.CheckboxGroup`\
  \ 类不是一个组件；它仅仅是一个组织复选框的类。这意味着 Java 没有在组内成员之间施加空间关系。如果我们愿意，可以将组中的一个成员放在左上角，另一个成员放在右下，第三个成员放在不同的框架中。当然，结果将违背逻辑和大多数样式指南。\n\
  \n`CheckboxGroup` 类有两个方法支持获取和设置当前选中的成员或组：\n- `getSelectedCheckbox()`：从此复选框组获取当前选择。\n\
  - `setSelectedCheckbox(Checkbox box)`：将此组中当前选中的复选框设置为指定的复选框。\n\n### 示例 17.15\n\n\
  ```java\nimport java.awt.*;\nclass CheckboxGroupTest\n{\n    public static void\
  \ main(String args[])\n    {\n        Frame f = new Frame(\"Testing RadioButton\
  \ Component\");\n    }\n}\n```\n\n\n\n# AWT 组件详解\n\n## Button 组件\n`Button` 是 AWT\
  \ 中最常用的控件之一，用于允许用户通过点击来触发操作。\n\n#### 构造函数\n- `Button()`：创建一个空按钮。\n- `Button(String\
  \ label)`：创建一个带有指定文本的按钮。\n- `Button(String label, int align)`：创建一个带有指定文本和对齐方式的按钮。\n\
  \n### 主要方法\n- `String getLabel()`：获取按钮上的文本。\n- `void setLabel(String label)`：设置按钮上的文本。\n\
  - `void addActionListener(ActionListener l)`：为按钮添加动作事件监听器。\n\n### 示例代码\n```java\n\
