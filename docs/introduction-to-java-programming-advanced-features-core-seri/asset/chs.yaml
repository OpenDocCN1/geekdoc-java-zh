  \ 18 ∞\n## AWT 事件简介\n\n## 简介\n\n当一个普通的 Java 程序（非 GUI 类的）需要输入时，它会提示用户然后调用某些输入方法，例如\
  \ `readline()`，也就是说交互是由程序发起的。这并不是基于 GUI 的程序的行为方式。是由用户与程序进行交互，而不是由程序发起动作。\n\n例如，在文字处理软件中，用户通过点击不同的按钮来启动动作，这产生一个事件并执行相应的代码，从而地发生某些动作。点击保存按钮将调用将内容保存到文件的方法。\n\
  \n| 接口 | 事件(方法) | 类 | 方法 |\n| :--- | :--- | :--- | :--- |\n| `ActionListener` |\
  \ `actionPerformed()` | `ActionEvent ae` | `getSource` |\n| `ItemListener` | `itemStateChanged()`\
  \ | `ItemEvent ie` | `getItem` |\n| `AdjustmentListener` | `adjustmentValueChanged()`\
  \ | `AdjustmentEvent ae` | `getAdjustable()` |\n| `MouseListenerMouseAdapter` |\
  \ `mouseEnteredmouseExitedmouseClickedmousePressedmouseReleased` | `MouseEvent me`\
  \ | `getX()`()`getY()`()`getPoint()`()`getClickCount()`()`getButton()`()`getModifiersEx()`()`getModifiersExText()`\
  \ |\n| `MouseMotionListenerMouseMotionAdapter` | `mouseMovedmouseDragged` | `MouseEvent\
  \ me` | 同上。 |\n| `KeyListenerKeyAdapter` | `keyTypedkeyPressedkeyReleased` | `KeyEvent\
  \ ke` | `getKeyChar()`()`getKeyCode()` |\n| `FocusListenerFocusAdapter` | `focusGainedfocusLost`\
  \ | `FocusEvent fe` | `getSource()` |\n| `WindowListenerWindowAdapter` | `windowOpendwindowClosingwindowClosedwindowActivatedwindowDeactivatedwindowIconifiedwindowDeiconified`\
  \ | `WindowEvent we` | `getWindow()` |\n\nJava 使用事件委托模型进行事件处理。在事件委托模型中，可以告诉一个组件当该组件产生特定类型的事件时，应该通知哪个对象。\n\
  \n如果一个组件对某种类型的事件感兴趣，那么该类型的事件将不会被传播。委托模型基于以下核心概念：\n\n*   事件类。\n*   事件监听器。\n*   适配器（Adapters）。\n\
  \n### 事件类\n\n点击按钮会产生一个事件。该事件包含许多相关信息，例如：时间、产生事件的组件、点击发生点的坐标等。\n\n这些信息被放在事件类内部。这个概念与异常处理相似。每当发生异常时，就会创建一个适当异常类的对象，并将所有异常相关的信息放入此对象中。\n\
  \n我们有一个事件类的层次结构，它与异常类的层次结构有些相似。每当发生某些事件时，会被事件处理机制检测到，该机制创建适当事件类的对象并将所有事件相关的信息放入其中。\n\
  \n### 事件监听器\n\n事件监听器负责在事件发生时采取适当的动作。事件监听器是一个对象，组件将处理特定类型事件的任务委托给该对象。\n\n当组件经历输入时，会构造一个相应类型的事件，然后该事件作为参数传递给监听器上的方法调用。监听器必须实现包含该事件处理方法的接口。\n\
  \n我们可以将事件监听器与处理异常的 `catch` 块进行比较。我们需要提供一个与要处理的异常相对应的 `catch` 块。同样地，如果我们想处理由某些组件生成的事件，我们需要提供适当的监听器。\n\
  \n监听器与组件相关联。不同的事件有不同的监听器。当事件发生时，会调用适当的监听器方法并将事件对象作为参数传递。\n\n## 适配器 (Adapters)\n\n\
  语言中定义的监听器仅是接口。我们需要提供适当监听器的实现。某些监听器具有 2 个或更多方法。\n\n要实现一个拥有多个方法的监听器，即使我们只对一个方法感兴趣，也需要提供所有方法的实现。适配器类为这个问题提供了解决方案。\n\
  \n适配器类提供了监听器所有方法的空实现（dummy implementation）。这有助于减少编程工作。如果我们只想使用包含 5 个方法的监听器类中的一个方法，我们可以简单地扩展该适配器类并重写所需的方法。\n\
  \n### 事件层次结构\n\nAWT 拥有定义良好的事件层次结构。通常，事件层次结构中叶子节点对应的类代表实际事件。而非叶子节点的类则作为基类并封装……。\n\
  \nAWT 事件层次结构在如下所示。\n\n![](img/image01292.jpeg)\n\n### java.util.eventObject 类\n\n\
  这是所有事件类的最顶级父类。它是一个非常用的类，只有一个感兴趣的方法，返回产生事件的物体。\n\n`Object getsource()`\n\n### java.awt.AWTEvent\
  \ 类\n\n`event object` 的一个子类是 `java.awt.AWTEvent`，它是所有委托模型事件类的父类。同样，只有一个感兴趣的方法，返回事件的\
  \ ID。\n\n`int getID()`\n\n事件的 ID 是一个 `int`，用于指定事件的性质。例如，`MouseEvent` 类的实例可以表示七种情况：点击、拖拽、进入、退出、按下、释放。这些可能性都通过\
  \ `int` `MouseEvent.CLICKED`、`MouseEvent.DRAGGED` 等表示。\n\n`java.awt.AWTEvent` 的子类表示由各种\
  \ AWT 组件生成的各种事件类型，并包含与触发事件相关的所有信息。\n\n非超类事件类型（即实际由组件触发的类型）包括：\n\n1.  `ActionEvent`：组件激活产生，例如。点击按钮、双击列表项以及在\
  \ TextField 中按回车键产生。\n2.  `AdjustmentEvent`：滚动条等可调整组件的调整产生。\n3.  `ContainerEvent`：组件被容器或移除时产生。\n\
  4.  `FocusEvent`：组件接收或丢失焦点时产生。\n5.  `ItemEvent`：从列表、选择或复选框选择项目时产生。\n6.  `KeyEvent`：键盘活动产生。\n\
  7.  `MouseEvent`：鼠标活动产生。\n8.  `MouseWheelEvent`：指示鼠标轮在组件中旋转的事件。\n9.  `WindowEvent`：窗口活动产生（如最小化或还原等）。\n\
  10. `TextEvent`：文本组件被修改时产生。\n\n### java.awt.event 包\n\n该包提供了用于处理 AWT 组件触发的各种类型事件的接口和类。事件由事件源触发。事件监听器向事件源注册以接收特定类型事件的通知。\n\
  \n该包定义了事件和事件监听器，以及事件监听器适配器，后者是简化编写事件监听器的便利类。\n\n### 事件监听器接口\n\n每个事件类都有相应的监听器接口，并定义了一个或多个方法。常用的监听器接口在以下章节中描述。\n\
  \n#### Action Listener 接口：\n\n\n\n\n\n这是用于接收动作事件的监听接口。感兴趣处理动作事件的类实现此接口，并使用该类创建的对象注册到组件中，使用组件的\
  \ `addActionListener()` 方法。当动作事件发生时，将调用动作监听器的 `actionPerformed()` 方法，其方法签名如下：\n\n\
  | 签名 | 描述 |\n| :--- | :--- |\n| `void actionPerfomed (ActionEvent e)` | 当动作发生时调用。\
  \ |\n\n## AdjustmentListener 接口\n\n这是用于接收调整事件的监听接口。\n\n| 签名 | 描述 |\n| :--- | :---\
  \ |\n| `void adjustmentValueChanged(Adjustment event e)` | 当滑块/滑动条的值改变时调用。 |\n\n\
  ## ContainerListener 接口\n\n这是用于接收组件被添加到或从容器中移除时的事件的监听接口。\n\n### 方法：\n\n| 签名 | 描述\
  \ |\n| :--- | :--- |\n| `void componentAdded(containerEvent e)` | 当组件被添加到容器时调用。\
  \ |\n| `void componentRemoved(containerEvent e)` | 当组件从容器中移除时调用。 |\n\n## FocusListener\
  \ 接口\n\n这是用于接收组件获得或失去焦点时的事件的监听接口。\n\n### 方法：\n\n| 签名 | 描述 |\n| :--- | :--- |\n|\
  \ `void focusGained(focusEvent e)` | 当组件获得键盘焦点时调用。 |\n| `void focusLost (focusEvent\
  \ e)` | 当组件失去键盘焦点时调用。 |\n\n## ItemListener 接口 \n\n这是用于接收项目事件的监听接口。\n\n### 方法：\n\n\
  `void itemStateChanged (ItemEvent e)`\n\n当用户选中或取消选择某个项目时调用。\n\n## keyListener 接口\
  \ \n\n这是用于接收键盘事件（按键输入）的监听接口。\n\n| 签名 | 描述 |\n| :--- | :--- |\n| `void keyPressed(KeyEvent\
  \ e)` | 当按下键时调用。 |\n| `void keyReleased(KeyEvent e)` | 当释放按键时调用。 |\n| `void keyTyped(KeyEvent\
  \ e)` | 当输入按键（按下并释放）时调用。 |\n\n## MouseListener 接口 \n\n这是用于接收组件上鼠标事件（按下、释放、点击、进入和退出）的监听接口。\n\
  \n### 方法：\n\n`void mouseClicked(MouseEvent e)`\n当在 `Component` 上点击（按下并释放）鼠标按钮时调用。\n\
  \n`void mouseEntered(MouseEvent e)`\n当鼠标进入组件时调用。\n\n`void mouseExited(MouseEvent\
  \ e)`\n当鼠标退出组件时调用。\n\n`void mousePressed(MouseEvent e)`\n当在组件上按下鼠标按钮时调用。\n\n`void\
  \ mouseReleased(MouseEvent e)`\n当在组件上释放鼠标按钮时调用。\n\n## MouseMotionListener \n\n这是用于接收组件上鼠标移动事件（移动和拖动）的监听接口。\n\
  \n### 方法：\n\n`void mouseDragged(MouseEvent e)`\n当在组件上按下鼠标按钮并拖动时调用。\n\n`void mouseMoved(MouseEvent\
  \ e)`\n当鼠标光标在组件上移动但未按下按钮时调用。\n\n## MouseListener 接口 \n\n这是用于接收组件上鼠标事件的监听接口。\n\n\
  ### 方法：\n\n`void mouseWheel(MouseEvent e)`\n当滚动鼠标轮时调用。\n\n## WindowListener \n\n\
  当窗口状态由于打开、关闭、激活或最小化而发生变化时，将调用监听器中的相关方法，并将事件传递给它。\n\n### 方法：\n\n- `void activated(WindowEvent\
  \ e)`: 当窗口被设置为激活窗口时调用。\n- `void closed(WindowEvent e)`: 当调用窗口的 `dispose()` 导致窗口关闭时调用。\n\
  - `void closing(WindowEvent e)`: 当用户尝试从窗口系统菜单关闭窗口时调用。\n- `void deactivated(WindowEvent\
  \ e)`: 当窗口不再是激活窗口时调用。\n- `void iconified(WindowEvent e)`: 当窗口从正常状态变为最小化状态时调用。\n\
  - `void opened(WindowEvent e)`: 当窗口第一次变为可见时调用。\n\n 处理 ActionEvent：示例 18.1 \n\n以下示例解释了如何处理点击按钮产生的事件。\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\nclass A1 {\n    public\
  \ static void main(String args[]) {\n        Frame f = new Frame();\n        f.setLayout(new\
  \ FlowLayout());\n        f.setSize(500,100);\n        Button b1 = new Button(\"\
  Push me\");\n        Button b2 = new Button(\"Click me\");\n        b1.addActionListener(new\
  \ B());\n        b2.addActionListener(new C());\n        f.add(b1);\n        f.add(b2);\n\
  \        f.setVisible(true);\n    }\n}\n\nclass B implements ActionListener {\n\
  \    public void actionPerformed(ActionEvent ae) {\n        System.out.println(\"\
  Pushed\");\n    }\n}\n\nclass C implements ActionListener {\n    public void actionPerformed(ActionEvent\
  \ ae) {\n        System.out.println(\"Clicked\");\n    }\n}\n```\n输出： (Images/image0123.jpeg)\n\
  \n示例 18.2：\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\nclass A2\
  \ implements ActionListener {\n    static Button b1=null,b2=null;\n    public static\
  \ void main(String args[]) {\n        Frame f = new Frame();\n        f.setLayout(new\
  \ FlowLayout());\n        f.setSize(500,100);\n        b1 = new Button(\"Push me\"\
  );\n        b2 = new Button(\"Click me\");\n        b1.addActionListener(new A2());\n\
  \        b2.addActionListener(new A2());\n        f.add(b1);\n        f.add(b2);\n\
  \        f.setVisible(true);\n    }\n\n    public void actionPerformed(ActionEvent\
  \ ae) {\n        if(ae.getSource() == b1) {\n            System.out.println(\"Pushed\"\
  );\n        } else {\n            System.out.println(\"Clicked\");\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n### 示例 18.3\n\n输出：与上示例相同。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A3 implements ActionListener\n{\n    Button b1=null,b2=null;\n\
  \    A3()\n    {\n        Frame f=new Frame();\n        f.setLayout(new FlowLayout());\n\
  \        f.setSize(500,100);\n        b1=new Button(\"Push me\");\n        b2=new\
  \ Button(\"Click me\");\n        b1.addActionListener(this);\n        b2.addActionListener(this);\n\
  \        f.add(b1);\n        f.add(b2);\n        f.setVisible(true);\n    }\n  \
  \  public static void main(String args[])\n    {\n        A3();\n    }\n    public\
  \ void actionPerformed(ActionEvent ae)\n    {\n        if(ae.getSource() == b1)\n\
  \            System.out.println(\"Button Pushed\");\n        else\n            System.out.println(\"\
  Button Clicked\");\n    }\n}\n```\n输出：与上示例相同。\n\n### 示例 18.4\n\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\nclass A4 implements ActionListener\n{\n\
  \    static Button b1=null,b2=null;\n    static TextField tf1=null,tf2=null, tf3=null;\n\
