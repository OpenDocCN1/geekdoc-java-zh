  Sum\");\n        b2=new Button(\"Avg\");\n        b1.addActionListener(new A4());\n\
  \        b2.addActionListener(new A4());\n        f.add(l1);f.add(tf1);\n      \
  \  f.add(l2);f.add(tf2);\n        f.add(l3);f.add(tf3);\n        f.add(b1);f.add(b2);\n\
