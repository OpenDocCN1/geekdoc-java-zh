  2. 写一个程序使用二分查找在数组中的某个元素。\n\n---\n\n# 第 5 章：类与对象\n\n## 引言\n\n#### 类定义\n类代表 ADT（抽象数据类型）。它像一个模板，我们可以通过它创建多个对象（实例）。类的声明只创建一个模板，而不会创建实际的对象。类创建了一种可以用于创建对象的新数据类型。也就是说，类创建了一个定义了其成员之间关系的逻辑框架。当我们声明一个类的对象时，我们是在创建该类的一个实例。因此，类是一个逻辑结构。而对象具有物理现实（也就是说，对象占用内存空间）。\n\
  \n```java\nmodifiers class <类名> {\n    modifiers 类型 变量名;\n    modifiers 类型 方法 1(参数列表)\
  \ {\n        //方法体\n    }\n}\n```\n\n#### 声明对象\n```java\nStudent s1;\n```\n在上面的示例中\
  \ `s1` 不是一个对象。在 C++ 中 `s1` 被视为对象，但在 Java 中 `s1` 仅仅是一个变量，可以持有对象的引用。在赋值 `Student`\
  \ 类型的对象引用之前，该变量将持有垃圾值或 `null` 引用。它尚未指向任何实际的对象。在此时点尝试使用该变量将导致编译时错误。它就像 C/C++ 中对象的指针。如果该变量声明在任何块或方法内部，它是局部变量，不会初始化为\
  \ `null`；但如果它声明在类中，它就是实例变量并自动初始化为 `null`。\n\n#### 分配内存\n在 Java 中，通过 `new` 运算符动态分配内存。\n\
  ```java\ns1 = new Student();\n```\n在上面的示例中 `new` 运算符为 `Student` 类的对象分配内存并返回其引用，然后赋值给引用类型变量\
  \ `s1`。它还会调用构造函数来初始化成员变量。\n\n**注意 1：** `new` 在运行时为对象分配内存。如果 `new` 无法分配内存，将产生运行时异常/错误。\n\
  **注意 2：** 如果我们将一个引用变量赋值另一个引用变量，传递的只是引用（地址）。不会产生对象的副本。例如，如果我们创建另一个引用变量 `s2` 然后执行\
  \ `s1 = s2`，这不会复制对象，同一个对象由 `s1` 引用。在 `s2` 中进行的更改将反映在 `s1` 中。如果我们将 `s1` 赋值为 `null`，该对象将被垃圾回收器销毁，对象占用的内存将被释放。\n\
  \n### 示例 5.1 包含成员变量的类\n```java\nclass A {\n    private int x;\n    private int y;\n\
  }\n```\n\n\n\n\n\n### 示例 5.3 定义类自身的对象\n\n```java\nclass A {\n    private int x;\n\
  \    private int y;\n    void setdata(int x1, int y1) {\n        x = x1;\n     \
  \   y = y1;\n    }\n    void display() {\n        System.out.println(x + \"\\t\"\
  \ + y);\n    }\n}\n\nclass ClassTest2 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        A a2 = new A();\n        //a1.x=10; 因为 x 是私有的，报错\n\
  \        a1.setdata(10,20);\n        a2.setdata(5,7);\n        a1.display();\n \
  \       a2.display();\n    }\n}\n```\n输出:\n```\n10\t20\n5\t7\n```\n注意：我们可以在类内部声明类的对象。\n\
  \n### 类成员的修饰符 / 访问性标签\n\n访问性修饰符仅适用于成员，而不适用于局部变量。\n\n1. `private`：如果我们为成员变量或方法指定\
  \ `private` 修饰符，那么该成员在声明它的类外部是不可见的。这将该类的成员对其他类隐藏。\n2. `public`：如果我们为成员变量或方法指定 `public`\
  \ 修饰符，那么该成员对所有类可见。该成员甚至可以在包外部被访问。`main()` 方法始终定义为 `public`，因为 `main()` 方法是由 JVM\
  \ 访问的，而 JVM 在定义 `main()` 方法类的外部。\n3. `protected`：声明为 `protected` 的成员可以被同一包中的所有类访问。保护成员也可以被其他包的任何子类访问。\n\
  4. `default` / 无修饰符：如果在声明之前没有指定访问性修饰符，则该成员可以被同一包中的所有类访问。该成员无法在包外部访问。\n\n类或接口的访问性修饰符\n\
  \n1. `public`：如果一个类要对无论包包的所有类可见，则必须通过指定修饰符 `public` 声明为 `public`，该修饰符应该出现在 `class`\
  \ 关键字之前。\n2. `default` / 无修饰符：如果类之前没有任何访问/可见性修饰符，它的可见性仅在定义它的包（类组）内有效。\n\n`this`\
  \ 关键字\n\n`this` 是一个引用变量，存储当前用于调用方法的对象的引用。`this` 的引用在运行时会被调用对象的引用所替换。有时，方法需要引用调用它的对象。这可以通过\
  \ `this` 的帮助来实现。`this` 可以用于任何方法内部来引用当前对象。\n\n注意：局部变量会隐藏实例变量，因此我们必须显式地使用 `this` 关键字。\n\
  \n实例变量隐藏\n\n众所周知，在 Java 中在相同或嵌套的作用域内声明两个同名的局部变量是非合法的。但我们可以让局部变量（成员方法的参数）与类的实例成员变量具有相同的名称。当局部变量与实例变量同名时，局部变量会隐藏实例变量。但\
  \ `this` 关键字允许我们即使在局部变量隐藏了它的情况下也能引用实例变量。\n\n#### 示例 5.4 `this` 关键字的使用\n\n```java\n\
  class A {\n    private int x;\n    private int y;\n    void setdata(int x, int y)\
  \ {\n        this.x = x; //this.x 是类成员，x 是局部变量\n        this.y = y;   \n    }\n\
  \    void display() {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\n\
  class ClassTest4 {\n    public static void main(String args[]) {\n        A a1 =\
  \ new A();\n        A a2 = new A();\n        a1.setdata(10,20);\n        a2.setdata(5,7);\n\
  \        a1.display();\n        a2.display();\n    }\n}\n```\n输出:\n```\n10\t20\n\
  5\t7\n```\n\n#### 方法重载\n\n我们可以拥有多个同名方法，只要它们在参数数量、参数类型或参数顺序上有所不同即可。这被称为方法重载。\n\n\
  在调用重载方法时，传递的实际参数的类型可能与任何重载方法的形式参数不完全匹配。在这种情况下，参数将提升到下一个更高的类型，直到找到匹配项为止。如果提升提升参数后仍未找到匹配，则会发生编译错误。\n\
  \n示例 5.5 在此示例中，有两个同名的 `setdata()` 方法，但它们的参数不同，因此这是方法重载。\n\n```java\nclass A {\n\
  \    private int x,y;\n    void setdata(int x1) {\n        x = x1;\n    }\n    void\
  \ setdata(int x1, int y1) {\n        x = x1;\n        y = y1;\n    }\n    void display()\
  \ {\n        System.out.println(x + \"\\t\" + y);\n    }\n}\nclass ClassTest5 {\n\
  \    public static void main(String args[]) {\n        A a1 = new A();\n       \
  \ a1.setdata(5);\n        a1.display();\n        A a2 = new A();\n        a2.setdata(10,20);\n\
  \        a2.display();\n    }\n}\n```\n输出:\n```\n5\t5\n10\t20\n```\n\n构造函数-\n\n\
  创建对象后立即初始化对象是非常常见的需求。我们可以为此目的定义实例方法，但它们必须被显式调用。\n\n\n\n\n\n# Java 构造函数\n\nJava 为这一需求提供了解决方案。Java\
  \ 允许对象在通过构造函数创建时进行初始化。它具有相同的特性。\n\n构造函数的语法与实例方法非常相似。它们的名称与类名相同，并且没有返回类型。\n\n这是因为类构造函数的隐式返回类型是类本身。构造函数可以像方法一样进行重载。\n\
  \n当使用运算符 `new` 创建类的实例/对象时，`JVM` 会为对象分配内存，然后将实例变量初始化为它们的默认初始值，最后调用相应的构造函数来初始化实例变量。\n\
  \n### 注意\n`constructor` 这个名字有点容易误导。看起来构造函数的目的是创建对象/实例。但实际上，在调用构造函数之前，对象已经创建，且实例变量和静态变量已经初始化为它们的默认初始值。\n\
  \n因此，构造函数的目的是用默认值以外的值来初始化实例变量。\n\n## 构造函数的类型\n\n### 默认构造函数\n每个类都有一个默认构造函数（如果没有定义显式的构造函数），它不接受任何参数，且体体不包含任何语句。编译器会自动生成默认构造函数。\n\
  \n一旦我们添加了自己的构造函数，编译器就会停止生成默认构造函数。当我们不在类中创建任何构造函数时，`JVM` 将创建默认构造函数并将实例变量初始化为默认值 `null`\
  \ 或 `zero`。\n\n#### 示例 5.6 默认构造函数的使用\n```java\nclass A {\n    private int x;\n \
  \   private int y;\n    void display() {\n        System.out.println(x + \"\\t\"\
  \ + y);\n    }\n}\nclass ClassTest6 {\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        a1.display();\n    }\n}\n```\n**输出:**\n```\n\
  0       0\n```\n注意：在这里我们没有创建任何构造函数，因此 `JVM` 在创建对象后自动创建默认构造函数，并将实例变量初始化为 0 或 null。\n\
  \n### 默认零参数构造函数\n我们可以用自己的零参数构造函数替换默认构造函数。这允许我们将实例变量初始化为任何值。\n\n### 参数化构造函数\n带有参数的构造函数称为参数化构造函数。注意：构造函数可以像方法一样进行重载。\n\
  \n#### 示例 5.7 构造函数的使用\n```java\nclass A {\n    private int x;\n    private int y;\n\
  \n    A() // 参数构造函数 {\n        x = y = 0;\n    }\n\n    A(int x1) // 单参数参数化构造函数\
  \ {\n        x = x1;\n    }\n\n    A(int x1, int y1) // 双参数参数化构造函数 {\n        x\
  \ = x1;\n        y = y1;\n    }\n\n    void display() {\n        System.out.println(x\
  \ + \"\\t\" + y);\n    }\n}\nclass ClassTest7 {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A();\n        a1.display();\n        A a2 = new\
  \ A(5);\n        a2.display();\n        A a3 = new A(4,7);\n        a3.display();\n\
  \    }\n}\n```\n**输出:**\n```\n0       0\n5\n4       7\n```\n\n### 示例 5.8\n```java\n\
  import java.util.Scanner;\n\nclass Complex {\n    private int real, imag;\n\n  \
  \  Complex() // 零参数构造函数 {\n        real = imag = 0;\n    }\n\n    Complex(int real,\
  \ int imag) {\n        this.real = real;\n        this.imag = imag;\n    }\n\n \
  \   void getdata() {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"\
  Enter real\");\n        real = sc.nextInt();\n        System.out.print(\"Enter imag\"\
  );\n        imag = sc.nextInt();\n    }\n\n    void display() {\n        if (imag\
  \ >= 0)\n            System.out.println(real + \"+\" + imag + \"i\");\n        else\n\
  \            System.out.println(real + \"\" + imag + \"i\");\n    }\n\n    Complex(Complex\
  \ c) {\n        Complex t = new Complex();\n        t.real = real + c.real;\n  \
  \      t.imag = imag + c.imag;\n        return t; // 或者\n        return new Complex(real\
  \ + c.real, imag + c.imag);\n    }\n\n    Complex mult(Complex c) {\n        Complex\
  \ t = new Complex();\n        t.real = real * c.real - imag * c.imag;\n        t.imag\
  \ = real * c.imag + imag * c.real;\n        return t;\n    }\n\n    public static\
  \ void main(String args[]) {\n        Complex c1 = new Complex();\n        Complex\
  \ c2 = new Complex();\n        Complex c3 = null, c4 = null;\n        c1.getdata();\n\
  \        c2.getdata();\n        c3 = c1.sum(c2);\n        System.out.print(\"Sum\
  \ is \");\n        c3.display();\n        c4 = c1.mult(c2);\n        System.out.print(\"\
  Product is \");\n        c4.display();\n    }\n}\n```\n\n### finalize() 方法\n有时对象在被销毁时需要执行某些操作。例如，如果一个对象持有某些非\
  \ Java 资源（如文件句柄），我们可能希望在对象被销毁之前释放这些资源。\n\n\n\n\n为了处理此类情况，Java 提供了一种名为最终化（finalization）的机制。通过使用最终化，我们可以定义在对象即将被垃圾器回收时执行的特定操作。`finalize()`\
  \ 仅在垃圾收集之前被调用。它在对象离开作用域时不会被调用。在 C++ 中，使用析构函数的概念来实现最终化，但它与 Java 中的 `finalize()`并不完全相同。\n\
  \n```java\nprotected void finalize() {\n    // 这里是最终化代码\n}\n```\n\n**注意**：除了使用 `protected`\
  \ 修饰符，我们也可以使用 `public`。\n\n## 变量类型\n\nJava 有三种变量：\n\n### 1. 实例变量\n在类中声明且位于所有成员方法之外的变量称为实例变量。该变量的数量将与对象的数量相同（每个对象有一个拷贝）。\n\
  \n在 Java 中不需要初始化实例变量，因为这些变量在对象创建并使用 `new` 运算符分配内存时就会被初始化。\n\n变量根据其类型进行初始化。所有数值型变量都自动初始化为\
  \ `0`，`Boolean` 变量初始化为 `false`，引用变量（对象）初始化为 `null` 值。\n\n我们可以通过对象名和点（`.`）运算符来访问这些变量（`对象引用变量.实例变量名`）。我们不能像\
  \ C/C++ 那样使用 `->` 运算符分隔对象引用变量和实例变量。\n\n### 2. 局部变量\n在方法内部声明的变量称为局部变量。它与实例变量不同。局部变量没有自动初始化。\n\
  \n### 3. 静态变量\n静态变量像实例一样也声明在方法/块之外。但静态变量在数据类型之前使用了 `static` 修饰符。静态变量对于类及其所有的实例（对象）来说都是全局的。\n\
  \n它们对于跟踪全局状态非常有用。例如，类中的静态变量 `count` 可以存储程序在任何时刻创建的该类的实例/对象数量。\n\n对象之间可以使用静态变量进行通信，就像\
  \ C 函数通过全局变量进行通信一样。对于静态变量，无论程序中创建了多少实例/对象，该变量只有一个拷贝，并且在所有实例之间共享。\n\n点（`.`）运算符也用于访问类变量，但我们可以使用类名也可以对象名来访问静态变量。如果我们对不同的对象声明它，它们都将指向静态变量的同一个拷贝。\n\
  \n静态变量在类加载/使用时会自动用它们的默认值（零、false 或 null）初始化。\n\n它们只能调用其他静态方法。它们必须只能访问静态数据。它们不能以任何方式引用\
  \ `this` 或 `super`。（关键字 `super` 与继承有关，稍后会描述。）\n\n### 示例 5.9\n```java\nclass A {\n\
  \    int x;         //实例变量\n    static int y; //静态变量或类变量\n}\n\nclass ClassTest8\
  \ {\n    public static void main(String args[]) {\n        A a1 = new A();\n   \
  \     A a2 = new A();\n        A a3 = new A();\n        a1.x = 10;\n        a1.y\
  \ = 20;\n        a2.x = 11;\n        a2.y = 21;\n        a3.x = 12;\n        a3.y\
  \ = 22;\n        System.out.println(a1.x + \"\\t\" + a1.y);\n        System.out.println(a2.x\
  \ + \"\\t\" + a2.y);\n        System.out.println(a2.x + \"\\t\" + a3.y);\n    }\n\
  }\n```\n**输出:**\n```\n10  22\n11  21\n12  22\n```\n\n## 方法类型\n\n1. 实例方法。\n2. 静态方法。\n\
  \n### 实例方法\n这些与 C++ 函数相同。实例方法只能通过对象调用。如果我们在同类的静态方法内部调用实例方法，那么我们必须使用对象名。\n\n### 静态方法\n\
  静态方法可以使用对象或类名调用。静态方法只能访问静态成员。静态方法可以从同类的静态方法中直接调用（不需要对象或类名）。\n\n### 示例 5.10\n```java\n\
  class A {\n    int x;\n    static int y;\n\n    static int sum(int a, int b) {\n\
  \        // y = 5; // 错误：静态方法可以访问静态变量\n        // x = 0; // 错误：静态方法无法访问实例变量\n  \
  \      // A a1 = new A();\n        // a1.x = 10; // 错误：静态方法可以通过对象访问实例变量\n      \
  \  // this.x = 10; // 错误：静态方法无法访问 this 或 super 关键字\n        int c;\n        c =\
  \ a+b;\n        return(c);\n    }\n\n    static float avg(int a, int b) {\n    \
  \    return (float)(a+b)/2;\n    }\n}\n\nclass ClassTest9 {\n    public static void\
  \ main(String args[]) {\n        System.out.println(A.sum(5,6)); // 静态方法可以通过类名调用\n\
  \        System.out.println(A.avg(5,6));\n        A a1 = new A();\n        System.out.println(a1.sum(5,6));\
  \ // 静态方法也可以通过对象调用\n    }\n}\n```\n**输出:**\n```\n1\n5\n```\n\n## 块\n块（Block）用于初始化类的成员变量，静态块用于初始化类的静态变量。但构造函数这些块之后被调用。\n\
  \n#### 示例 5.1\n```java\nclass A {\n    int x;\n    static int y;\n\n    {\n    \
  \    // 初始化块初始化变量\n        x = 10;\n    }\n\n    static {\n        // 静态块初始化变量\n\
  \        y = 5;\n    }\n}\n\nclass ClassTest10 {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A();\n        System.out.println(a1.x + \"\\t\"\
  \ + a1.y);\n    }\n}\n```\n**输出:**\n```\n10  5\n```\n\n### 最终变量\n如果变量被声明为 `final`，则我们不能改变它的值（`final\
  \ PI=3.14;`）。final 变量不在每个实例占用内存。final 变量是常量，其值不能改变。final 引用类型不能改变其引用。\n\n### 示例\
  \ 5.12\n```java\nclass A {\n    void m1() {\n        System.out.println(\"Inside\
  \ m1()\");\n    }\n}\n\nclass ClassTest11 {\n}\n```\n\n\n\n```java\npublic static\
  \ void main(String args[])\n{\n    final int x=10; // 不能更改\n    final int y;   \
  \ // 变量 y 未初始化，所以稍后可以初始化 y\n    y=20;           // 现在 y 已初始化，此之后我们不能改变它的值\n    //\
  \ y=30;         //错误\n    System.out.println(x);\n    System.out.println(y);\n \
  \   final A a1=new A();  // a1 是常量引用，所以我们不能\n    // 将其他对象的引用赋值给 a1。\n    a1.m1();\n\
  \    A a2 = new A();\n    // a1 = a2;  错误\n}\n```\nOutput: 10\n20\n\n在 `m1()` 内部\n\
  \n# 参数传递机制-\n\n1. 值传递（Call by Value）。\n2. 引用传递（Call by reference）。\n\n当将基本类型（`int`、`float`、`long`\
  \ 等）传递给方法时，它是使用值传递的方式。对于对象，实际传递的是对象的引用。\n\n对象引用也是通过值传递的方式传递的。然而，由于所传递的值引用一个对象，因此该值的拷贝将仍然指向与其对应的参数相同的对象。\n\
  \n例如，如果我们将一个存储了对象引用的引用变量 `a1` 传递给函数，而在函数中 `a2` 是形式参数，那么 `a1` 和 `a2` 指向同一个对象。\n\n\
  通过 `a2` 修改对象的值将反映在 `a1` 中。但如果我们给 `a2` 赋值一个新引用，则不会影响 `a1`。\n\n### 示例 5.11\n\n```java\n\
  class Box\n{\n    private int feet;\n    private int inches;\n\n    Box(int feet,\
  \ int inches)\n    {\n        this.feet = feet;\n        this.inches = inches;\n\
  \    }\n\n    void display()\n    {\n        System.out.println(\"Feet is \" + feet\
  \ + \"\\nches is \" + inches);\n    }\n\n    void swap(Box obj)\n    {\n       \
  \ this.feet = obj.feet;\n        this.inches = obj.inches;\n    }\n}\n\nclass Outer\n\
  {\n    class Inner\n    {\n        int feet;\n        int inches;\n\n        void\
  \ display()\n        {\n            System.out.println(\"Feet is \" + feet + \"\\\
  nches is \" + inches);\n        }\n\n        void swap(Inner obj)\n        {\n \
  \           this.feet = obj.feet;\n            this.inches = obj.inches;\n     \
  \   }\n    }\n}\n\nclass ClassTest\n{\n    public static void main(String args[])\n\
  \    {\n        Outer outer = new Outer();\n        Outer.Inner in1 = outer.new\
  \ Inner();\n        in1.feet = 5;\n        in1.inches = 6;\n        in1.display();\n\
  \n        Outer.Inner in2 = outer.new Inner();\n        in2.feet = 8;\n        in2.inches\
  \ = 9;\n        in2.display();\n\n        in1.swap(in2);\n        in1.display();\n\
  \n        in2.swap(in1);\n        in2.display();\n    }\n}\n```\nOutput:\nFeet is\
  \ 5\nInches is 6\nFeet is 8\nInches is 9\nFeet is 8\nInches is 9\nFeet is 5\nInches\
  \ is 6\n\n## 嵌套类\n\n允许在一个类内部定义另一个类；这种类被称为嵌套类。嵌套类的作用域受其外部类的限制。\n\n嵌套类有两种类型：静态和非静态。静态嵌套类可以访问外部类的所有成员（包括私有成员），但不能直接访问外部类的非静态成员。非静态嵌套类可以访问外部类的所有成员。静态嵌套类必须通过外部类的实例来访问其非静态成员。\n\
  \n## 5.12\n\n```java\nclass Box\n{\n    private int feet;\n    private int inches;\n\
