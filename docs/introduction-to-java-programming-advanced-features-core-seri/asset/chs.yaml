  );\n        l1.addFirst(\"A\");\n        l1.add(1, \"A2\");\n        System.out.println(\"\
  Original Contents of l1 : \"+ l1);\n\n        // 从链表中删除元素。\n        l1.remove(\"\
  F\");\n        l1.remove(2);\n        System.out.println(\"Contents of l1 after\
  \ deletion:\"+l1);\n\n        // 删除第一个和最后一个元素。\n        l1.removeFirst();\n    \
