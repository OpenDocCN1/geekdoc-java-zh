  \        }\n    }\n}\n```\n\n## 理论问题\n\n1. 如果我们希望一个成员变量在类外部完全无法访问，在声明变量时应该在其名前加上什么关键字？\n\
  \n2. 在 Java 中，对象/值是如何传递的？\n\n3. 考虑以下代码：\n\n```java\npublic static void main(String\
  \ args[])\n{\n    int a = 5;\n    System.out.println( cube( a ) );\n}\n\nint cube(\
  \ int theNum )\n{\n    return theNum * theNum * theNum;\n}\n```\n\n解释“static”关键字的重要性\n\
  \n当我们尝试编译并运行此代码时会发生什么？\n\n\n\n\na) 它无法编译，因为 `cube` 在 `java.lang.Math` 类中已经定义。\n\n\
  b) 它无法编译，因为 `cube` 不是静态的。\n\nc) 它可以编译，但会抛出算术异常（arithmetic exception）。\n\nd) 它可以完美运行并在标准输出打印\
  \ \"125\"。\n\n## 4. 什么是静态内部类？它与其他任何静态成员有什么区别？\n\n## 5. 我们如何在 Java 中声明常量？\n\n## 6.\
  \ \"final\" 关键字的含义是什么？\n\n## 7. 什么是类变量？\n\n答案：\n\n当我们创建一个相同类的多个对象时，每个对象将共享变量的公共副本。这意味着无论创建了多少个对象，每个类都只有一个副本。类变量或\
  \ `static` 变量在类中使用 `static` 关键字声明。\n\n这些变量存储在静态内存中。类变量主要用于常量，即其初始值永远不会改变的变量。`static`\
  \ 变量始终通过类名进行调用。\n\n该变量在程序启动时创建，即在使用 `new` 操作符创建类的实例之前创建），并在程序停止时销毁。类变量的作用域与实例变量相同。\n\
  \n类变量可以在类级别的任何地方使用 `static` 关键字定义。它的初始值与实例变量相同。当类变量被定义为 `int` 时，其默认值为零；当声明为 `boolean`\
  \ 时，其默认值为 `false`；对象引用为 `null`。类变量与类相关，而不是与任何对象相关。\n\n## 8. 解释垃圾回收。\n\n答案：垃圾回收（Garbage\
  \ collection）是 Java 最重要的特性之一。垃圾回收也被称为自动内存管理，因为 `JVM` 会自动从内存中移除未使用的变量/对象（值为 `null`）。用户程序无法直接从内存中释放对象，相反，垃圾回收器自动释放不再被程序引用的对象。每个类都从\
  \ `java.lang.Object` 继承 `finalize()` 方法，当垃圾回收器确定不再存在该对象的引用时，就会调用 `finalize()` 方法。\n\
  \n在 Java 中，当变量不再使用时，显式地将其赋值 `null` 是一个好习惯。在 Java 中调用 `System.gc()` 和 `Runtime.gc()`\
  \ 时，`JVM` 会尝试回收未使用的对象，但无法保证所有对象何时会被垃圾回收。\n\n## 9. 如果类有多个构造方法，我们可以从一个构造方法调用另一个吗？\n\
  \n可以。使用 `this()` 来调用另一个构造方法。\n\n## 10. 构造方法和普通方法之间的区别是什么？\n\n构造方法必须与类名相同且不能返回值。它们只被调用一次，而普通方法可以被调用多次，并且可以返回结果或为\
  \ `void`。\n\n### 11. 我们如何强制垃圾回收？\n\n垃圾回收是自动过程，无法强制。我们可以通过调用 `System.gc()` 来请求它。`JVM`\
  \ 不保证 GC 会立即启动。\n\n## 12. 下列哪一陈述不是正确的。\n\n(a) Java 中的局部变量总是由默认值初始化。\n\n(b) Java\
  \ 中的局部变量必须在使用之前进行初始化。\n\n(c) 内部块中的局部变量不能与外部块中的局部变量具有相同的名称。\n\n(d) 两个同层级块中的局部变量可以同名。\n\
