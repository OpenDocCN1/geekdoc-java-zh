  );\n        n = sc.nextInt();\n        int a[] = new int[n]; // 输入数组\n        for(int\
  \ i=0;i<n;i++)\n        {\n            System.out.print(\"Enter element \" + (i+1)\
  \ + \" \");\n            a[i] = sc.nextInt();\n        }\n        // 排序\n      \
  \  for(int i=0;i<n-1;i++)\n            for(int j=i+1;j<n;j++)\n                if(a[i]\
  \ > a[j])\n                {\n                    int t=a[i];\n                \
