  5. {\n6. int n;\n7. FileInputStream fin = new FileInputStream(\"A.txt\");\n8. FileOutputStream\
  \ fout = new FileOutputStream(\"B.txt\");\n9. byte b[]= new byte[10];\n10. n = fin.read(b);\n\
  11. while(n != -1)\n12. {\n13. fout.write(b,0,n);\n14. n = fin.read(b);\n15. }\n\
  16. fin.close();\n17. fout.close();\n18. }\n19. }\n```\n\n\n\n\n\n# FileReader\n\
  \n`FileReader` 类创建了一个 `Reader`，你可以用它来读取文件的内容。它最常用的两个构造函数是：\n\n- `FileReader(File\
  \ file)`：创建一个 `FileReader` 流，用于从指定的 `file` 读取内容。\n- `FileReader(String fileName)`：创建一个\
  \ `FileReader` 流，用于从指定的 `file` 读取内容。\n\n**注意：** 如果文件不存在、是一个目录而不是普通文件，或者由于其他原因无法打开读取，则任一个构造函数都可能抛出\
  \ `FileNotFoundException`。\n\n# FileWriter\n\n`FileWriter` 类创建一个 `writer`，你可以用它向文件写入。它最常用的两个构造函数是：\n\
  \n#### 构造函数\n- `FileWriter(File file)`：构造一个 `FileWriter` 对象以写入指定的 `file`。\n- `FileWriter(String\
  \ fileName)`：构造一个 `FileWriter` 对象以写入指定的 `file`。\n- `FileWriter(File file, boolean\
  \ append)`：构造一个 `FileWriter` 对象，以 `append` 模式写入指定的 `file`。\n- `FileWriter(String\
  \ filename, boolean append)`：构造一个 `FileWriter` 对象，以 `append` 模式写入指定的 `file`。如果使用前两个构造函数，则总是创建一个新文件。如果存在指定名称的文件，它将被删除。如果使用后两个构造函数且\
  \ `append` 标志为 `false`，则它们的行为与前两个相同。\n\n如果 `append` 标志为 `true`，则文件以 `append` 模式打开，即如果文件已存在，文件指针将放在文件末尾；如果文件不存在，则创建一个新文件。\n\
  \n**注意：**\n如果文件存在但是一个目录而不是普通文件、不存在但无法创建，或由于其他原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n\n```java\nimport java.io.*;\nclass FileCopy {\n\
  \    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fin=null;\n        FileWriter fout=null;\n        fin=new FileReader(args[0]);\n\
  \        fout=new FileWriter(args[1]);\n        int a;\n        a = fin.read();\n\
  \        while(a != -1) {\n            fout.write((char)a);\n            a = fin.read();\n\
  \        }\n        fin.close();\n        fout.close();\n    }\n}\n```\n\n# RandomAccessFile\n\
  \n`RandomAccessFile` 封装了一个随机访问文件。`RandomAccessFile` 允许我们从文件的某个位置读取和写入字节、文本和原始数据类型（当使用适当的访问权限时）。它没有继承自\
  \ `InputStream`，而是实现了 `DataInput` 和 `DataOutput` 接口，这些接口定义了基本的 I/O 方法。它还支持定位请求——也就是说，你可以将文件指针指向文件的任何位置。\n\
  \n`mode` 参数指定打开文件的访问模式。允许的值及其含义如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| \"r\" | 仅用于读取打开。调用结果对象的任何写入方法将导致抛出\
  \ `IOException`。 |\n| \"rw\" | 以读写打开。如果文件不存在，则将尝试创建它。 |\n| \"rws\" | 以读写打开（与 \"\
  rw\" 相同），并且对文件内容或元数据的每次更新都同步写入底层存储设备。 |\n| \"rwd\" | 以读写打开（与 \"rw\" 相同）。并且对文件内容（数据）的每次更新都同步写入底层存储设备。\
  \ |\n\n### RandomAccessFile 类的方法\n\n除了 `DataInput` 和 `DataOutput` 接口的方法外，该类的一些常用方法包括：\n\
  \n- `public RandomAccessFile(String, String) throws java.io.FileNotFoundException;`：创建一个随机访问文件流，用于读取指定的\
  \ `name` 文件，并可选地写入。\n- `public RandomAccessFile(File, String) throws FileNotFoundException;`：创建一个随机访问文件流，用于读取由\
  \ `File` 参数指定的文件，并可选地写入。\n- `public native int read() throws java.io.IOException;`\n\
  - `public int read(byte[], int, int) throws java.io.IOException;`\n- `public int\
  \ read(byte[]) throws java.io.IOException;`\n- `public int skipBytes(int) throws\
  \ java.io.IOException;`\n- `public native void write(int) throws java.io.IOException;`\n\
  - `public void write(byte[]) throws java.io.IOException;`\n- `public void write(byte[],\
  \ int) throws java.io.IOException;`\n- `public native long getPointer() throws java.io.IOException;`\n\
  - `public native void seek(long) throws java.io.IOException;`\n- `public native\
  \ long length() throws java.io.IOException;`\n- `public void setLength(long) throws\
  \ java.io.IOException;`\n- `public void close() throws java.io.IOException;`\n-\
  \ `public final boolean readBoolean() throws java.io.IOException;`\n- `public final\
  \ byte readByte() throws java.io.IOException;`\n- `public final int readUnsignedByte()\
  \ throws java.io.IOException;`\n- `public final short readShort() throws java.io.IOException;`\n\
  - `public final int readUnsignedShort() throws java.io.IOException;`\n- `public\
  \ final char readChar() throws java.io.IOException;`\n- `public final int readInt()\
  \ throws java.io.IOException;`\n- `public final long readLong() throws java.io.IOException;`\n\
  - `public final float readFloat() throws java.io.IOException;`\n- `public final\
  \ double readDouble() throws java.io.IOException;`\n- `public final String readLine()\
  \ throws java.io.IOException;`\n- `public final String readUTF() throws java.io.IOException;`\n\
  - `public final void writeBoolean(boolean) throws java.io.IOException;`\n- `public\
  \ final void writeByte(int) throws java.io.IOException;`\n- `public final void writeShort(int)\
  \ throws java.io.IOException;`\n- `public final void writeChar(int) throws java.io.IOException;`\n\
  - `public final void writeInt(int) throws java.io.IOException;`\n- `public final\
  \ void writeLong(long) throws java.io.IOException;`\n- `public final void writeFloat(float)\
  \ throws java.io.IOException;`\n- `public final void writeDouble(double) throws\
  \ java.io.IOException;`\n- `public final void writeBytes(String) throws java.io.IOException;`\n\
  - `public final void writeChars(String) throws java.io.IOException;`\n- `public\
  \ final void writeUTF(String) throws java.io.IOException;`\n\n### 示例 15.6\n\n```java\n\
  import java.io.*;\nclass RandomIO {\n}\n```\n\n\n\n\n\n### 代码示例\n\n```java\npublic\
  \ static void main(String args[]) throws IOException {\n    RandomAccessFile file\
  \ = null;\n    try {\n        file = new RandomAccessFile(\"rand.dat\", \"rw\");\n\
  \        file.writeChar('X');\n        file.writeInt(1999);\n        file.writeDouble(222.44);\n\
  \        System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n    \
  \    file.seek(0);\n        System.out.println(file.readChar());\n        System.out.println(file.readInt());\n\
  \        System.out.println(file.readDouble());\n        System.out.println(\"File\
  \ pointer Pos:\"+file.getFilePointer());\n        file.seek(2);\n        System.out.println(\"\
  File pointer Pos:\"+file.getFilePointer());\n        System.out.println(file.readInt());\n\
  \        file.seek(file.length());\n        file.writeBoolean(false);\n        file.seek(14);\n\
  \        System.out.println(file.readBoolean());\n        System.out.println(\"\
  File pointer Pos:\"+file.getFilePointer());\n        System.out.println(file.readInt());//EOF\
  \ Exception\n    } catch(EOFException e) {\n        System.out.println(\"Trying\
  \ to read after end of file\");\n    } finally {\n        file.close();\n    }\n\
  }\n```\n\n输出：\n```\nFile pointer Pos:14\nX\n1999\n222.44\nFile pointer Pos:14\n\
  File pointer Pos:2\n1999\nfalse\nFile pointer Pos:15\nTrying to read after end of\
  \ file\n```\n注意：如果尝试在文件末尾之后进行读取，则会发生 `EOFException`。\n\n# ByteArrayInputStream\n\
  \n`ByteArrayInputStream` 包含一个内部缓冲区，其中包含可以从流中读取的字节。`ByteArrayInputStream` 是使用字节数组作为源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。`ByteArrayInputStream`\
  \ 实现了 `mark()` 和 `reset()` 方法。但是，如果没有调用过 `mark()`，则 `reset()` 将将流指针设置为流的开头。\n\n\
  | 方法 |\n| :--- |\n| `public ByteArrayInputStream(byte[]);` |\n| `public ByteArrayInputStream(byte[],\
  \ int, int);` |\n| `public synchronized int read();` |\n| `public synchronized int\
  \ read(byte[], int, int);` |\n| `public synchronized long skip(long);` |\n| `public\
  \ synchronized int available();` |\n| `public boolean markSupported();` |\n| `public\
  \ void mark(int);` |\n| `public synchronized void reset();` |\n| `public void close()\
  \ throws IOException;` |\n\n#### 示例 15.7\n\n```java\nimport java.io.*;\nclass ByteArrayInputStreamTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        String\
  \ s1=\"abcdefghij\";\n        byte b[]=s1.getBytes();\n        ByteArrayInputStream\
  \ b1 = new ByteArrayInputStream(b);\n        int a;\n        while((a=b1.read())=-1)\
  \ {\n            System.out.print((char)Character.toUpperCase(a));\n        }\n\
  \        b1.close();\n    }\n}\n```\n输出：`ABCDEFGHIJK`\n\n# ByteArrayOutputStream\n\
  \n`ByteArrayOutputStream` 实现了一个输出流，其中数据被写入字节数组中。`ByteArrayOutputStream` 是使用字节数组作为目的地的输出流实现。缓冲区保存在\
  \ `ByteArrayOutputStream` 的受保护字段 `buf` 中。如果需要，缓冲区的大小将增加。缓冲区持有的字节数包含在 `ByteArrayOutputStream`\
  \ 的受保护字段 `count` 中。\n\n| 方法 |\n| :--- |\n| `public java.io.ByteArrayOutputStream();`\
  \ |\n| `public java.io.ByteArrayOutputStream(int);` |\n| `public synchronized void\
  \ write(int);` |\n| `public synchronized void write(byte[], int, int);` |\n| `public\
  \ synchronized void writeTo(java.io.OutputStream) throws java.io.IOException;` |\n\
  | `public synchronized void reset();` |\n| `public synchronized byte[] to_array();`\
  \ |\n| `public synchronized int size();` |\n| `public synchronized java.lang.String\
  \ toString();` |\n| `public synchronized java.lang.String toString(java.lang.String)\
  \ throws java.io.UnsupportedEncodingException;` |\n| `public synchronized java.lang.String\
  \ toString(int);` |\n| `public void close() throws java.io.IOException;` |\n\n####\
  \ 示例 15.8\n\n```java\nimport java.io.*;\nclass ByteArrayOutputStreamTest {\n   \
  \ public static void main(String args[]) throws IOException {\n        ByteArrayOutputStream\
  \ b1 = new ByteArrayOutputStream();\n        b1.write('a');\n        String s1 =\
  \ \"abcdefghij\";\n        byte arr1[]= s1.getBytes();\n        b1.write(arr1);\n\
  \        System.out.println(b1);  //toString()\n        // 使用 for 循环显示\n       \
  \ byte arr2 [] = b1.toByteArray();\n        for(int i=0;i<arr2.length;i++) {\n \
  \           System.out.print((char)arr2[i]);\n        }\n        System.out.println();\n\
  \        // 使用 for 循环显示\n        for(int i:arr2) {\n            System.out.print((char)i);\n\
  \        }\n        b1.close();\n    }\n}\n```\n\n\n\n\n根据指定的字符数组创建一个 `CharArrayReader`。生成的读取器将从给定的偏移量开始读取。从此读取器中可以读取的字符总数将是\
  \ `length` 或 `buf.length`。\n\n### 示例 15.9\n\n```java\nimport java.io.*;\n\nclass\
  \ CharArrayReaderTest {\n    public static void main(String args[]) throws IOException\
  \ {\n        String tmp = \"abcdefghijklmnopqrstuvwxyz\";\n        int length =\
  \ tmp.length();\n        char c[] = new char[length];\n        tmp.getChars(0, length,\
  \ c, 0);\n        CharArrayReader input1 = new CharArrayReader(c);\n        CharArrayReader\
  \ input2 = new CharArrayReader(c, 0, 5);\n        int i;\n        while ((i = input1.read())\
  \ != -1) {\n            System.out.print((char)i);\n        }\n        System.out.println();\n\
  \        while ((i = input2.read()) != -1) {\n            System.out.print((char)i);\n\
  \        }\n    }\n}\n```\n**输出:**\nabcdefghijklmnopqrstuvwxyz\nabcde\n\n# CharArrayWriter\n\
  \n`CharArrayWriter` 是一个写入流的实现，它使用字符数组缓冲区作为目标。\n\n#### 构造函数\n- `CharArrayWriter()`:\
  \ 在第一种形式下，创建一个具有默认大小的缓冲区。\n- `CharArrayWriter(int initialSize)`: 在第二种形式下，创建一个大小等于参数\
  \ `initialSize` 指定的缓冲区。\n\n缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，将增加缓冲区的大小。缓冲区中的字符数量包含在\
  \ `CharArrayWriter` 的 `count` 字段中。`buf` 和 `count` 都是保护字段。\n\n#### 示例 15.10\n```java\n\
  import java.io.*;\n\nclass CharArrayWriterTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        CharArrayWriter f = new CharArrayWriter();\n\
  \        String s = \"This should end up in the array\";\n        char buf[] = new\
  \ char[s.length()];\n        s.getChars(0, s.length(), buf, 0);\n        f.write(buf);\n\
  \        System.out.println(f.toString());\n        char c[] = f.toCharArray();\n\
  \        for (int i = 0; i < c.length; i++) {\n            System.out.print(c[i]);\n\
  \        }\n        FileWriter f2 = new FileWriter(\"test.txt\");\n        f.writeTo(f2);\n\
  \        f2.close();\n        f.reset();\n        System.out.println();\n      \
  \  System.out.println(\"After:\" + f.toString());\n        for (int i = 0; i < 3;\
  \ i++) {\n            f.write('A');\n            System.out.println(f.toString());\n\
  \        }\n    }\n}\n```\n**输出:**\nThis should end up in the array\nThis should\
  \ end up in the array\nAfter:\nAAA\n\n### Push back InputStream\n\n`PushbackInputStream`\
  \ 为另一个输入流增加了功能，即“回退”或“取消读取”一个字节的能力。缓冲的用途之一就是实现回退。`pushback` 用于输入流上，允许读取一个字节然后将其返回到流中。除了\
  \ `InputStream` 类熟悉的方法外，`PushbackInputStream` 还提供了 `unread()` 方法，如下：\n\n| 方法 | \
  \ |\n| :--- | :--- |\n| `public java.io.PushbackInputStream(java.io.InputStream,\
  \ int)` | 创建一个具有指定大小回退缓冲区的 `PushbackInputStream`，并保存其参数（输入流）以备后用。这允许将多个字节返回到输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream)` | 创建一个 `PushbackInputStream`\
  \ 并保存其参数（输入流）以备后用。这允许将一个字节返回到输入流。 |\n| `public int read() throws java.io.IOException`\
  \ | |\n| `public int read(byte[], int, int) throws java.io.IOException` | |\n| `public\
  \ void unread(int) throws java.io.IOException` | 通过将其复制到回退缓冲区的头部来回退一个字节 |\n| `public\
  \ void unread(byte[], int, int) throws java.io.IOException` | 通过将字节数组的一部分复制到回退缓冲区的头部来回退字节数组的一部分。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException` | 通过将字节数组复制到回退缓冲区的头部来回退字节数组。\
  \ |\n| `public int available() throws java.io.IOException` | |\n| `public long skip(long)\
  \ throws java.io.IOException` | |\n| `public boolean markSupported()` | `PushbackInputStream`\
  \ 的副作用是使创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用 `markSupported()` 方法检查任何你将对其使用\
  \ `mark()/reset()` 的流。 |\n| `public synchronized void mark(int)` | |\n| `public\
  \ synchronized void reset() throws java.io.IOException` | |\n| `public synchronized\
  \ void close() throws java.io.IOException` | |\n\n#### 示例 15.11\n```java\nimport\
  \ java.io.*;\n\nclass PushbackInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        FileInputStream fin = new FileInputStream(\"\
  A.txt\");\n        PushbackInputStream p1 = new PushbackInputStream(fin);\n    \
  \    int ch = p1.read();\n        System.out.println((char)ch);\n        ch = p1.read();\n\
  \        System.out.println((char)ch);\n        ch = p1.read();\n        System.out.println((char)ch);\n\
  \        p1.unread(ch); // or p1.unread('z')\n        ch = p1.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出:**\nA.txt contains “Matrix Computers”\nm\na\nt\n\n\n\n\n\n\
  | `public int read(char[], int, int) throws java.io.IOException;` |\n| `public void\
  \ unread(int) throws java.io.IOException;` 推回一个单个字符。 |\n| `public void unread(char[],\
  \ int, int) throws java.io.IOException;` 将字符数组的一部分拷贝到推回缓冲区的头部，将其推回。 |\n| `public\
  \ void unread(char[]) throws java.io.IOException;` 将一个数组拷贝到推回缓冲区的头部，将其推回。 |\n| `public\
  \ boolean ready() throws java.io.IOException;` |\n| `public void mark(int) throws\
  \ java.io.IOException;` |\n| `public void reset() throws java.io.IOException;` |\n\
  | `public boolean markSupported();` |\n| `public void close() throws java.io.IOException;`\
  \ |\n| `public long skip(long) throws java.io.IOException;` |\n\n注意：当在推回缓冲区满的情况下尝试返回字符时，将抛出\
  \ `IOException`。\n\n### 示例 15.12\n\n```java\nimport java.io.*;\nclass PushbackReaderTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fr = new FileReader(\"A.txt\");\n        PushbackReader pr = new PushbackReader(fr);\n\
  \        int ch = pr.read();\n        System.out.println((char)ch);\n        ch\
  \ = pr.read();\n        System.out.println((char)ch);\n        ch = pr.read();\n\
  \        System.out.println((char)ch);\n        pr.unread(ch);\n        ch = pr.read();\n\
  \        System.out.println((char)ch);\n    }\n}\n```\n输出：\n```\nm\na\nt\nt\n```\n\
  \n### SequenceInputStream\n\n`SequenceInputStream` 类是一个字节流，允许你连接多个 `InputStreams`。`SequenceInputStream`\
  \ 的构造与其他任何 `InputStream` 都不同。`SequenceInputStream` 构造函数使用一对 `InputStream` 类或一个 `InputStream`\
  \ 类的 `Enumeration` 作为其参数：\n\n- `SequenceInputStream(InputStream is1, InputStream\
  \ is2)` 通过记住两个参数来初始化新创建的 `SequenceInputStream`，这两个参数将按顺序（`is1` 然后是 `is2`）读取，为 `SequenceInputStream`\
  \ 提供要读取的字节。\n- `SequenceInputStream(Enumeration e)` 通过记住参数来初始化新创建的 `SequenceInputStream`，该参数必须是一个产生运行时类型为\
  \ `InputStream` 的对象的 `Enumeration`。理想情况下，该类将满足来自第一个 `InputStream` 的请求直到其耗尽，然后切换到第二个。在\
  \ `Enumeration` 的情况下，它将继续遍历所有的 `InputStreams` 直到最后一个流的结束。\n\n示例 15.13 在下面将文件名作为命令行参数提供：\n\
  \n```java\nimport java.io.*;\nclass SequenceInputStreamTest {\n    public static\
  \ void main(String args[]) throws IOException {\n        FileInputStream f1 = new\
  \ FileInputStream(args[0]);\n        FileInputStream f2 = new FileInputStream(args[1]);\n\
  \        FileOutputStream f3 = new FileOutputStream(args[2]);\n        SequenceInputStream\
  \ sis = new SequenceInputStream(f1,f2);\n        int c;\n        while((c = sis.read())\
  \ != -1) {\n            f3.write(c);\n        }\n        f3.close();f1.close();f2.close();\n\
  \    }\n}\n```\n输出：\n```\nA.txt\nB.txt\nC.txt\n```\n\n## PrintStream\n\n这是一个继承自\
  \ `OutputStream` 的字节流类。`PrintStream` 为另一个输出流增加了功能，即方便地打印各种值的表示形式的能力。可选地，可以创建一个 `PrintStream`\
  \ 以便自动刷新；这意味着在写入字节数组、调用其中一个 `println` 方法或写入换行符（`\\n`）之后，将调用 `flush` 方法。通过 `PrintStream`\
  \ 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入构造函数中指定的 `OutputStream` 或 `File`。`PrintStream` 支持针对所有类型的\
  \ `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintStream` 方法将调用对象的 `toString()` 方法然后打印结果。\n\
  \n构造函数：\n\n- `PrintStream(File file)` 使用指定的文件创建一个新的打印流，且不进行行自动刷新。\n- `PrintStream(String\
  \ fileName)` 使用指定的文件名创建一个新的打印流，且不进行行自动刷新。\n- `PrintStream(OutputStream out)` 为指定的\
  \ `OutputStream` 创建一个新的打印流。\n- `PrintStream(OutputStream out, boolean autoFlush)`\
  \ 连接到指定的 `OutputStream` 创建一个新的打印流。\n\n示例 15.14\n```java\nimport java.io.*;\nclass\
  \ PrintStreamTest {\n    public static void main (String args[]) throws IOException\
  \ {\n        PrintStream ps = new PrintStream(System.out, true);\n        ps.println(\"\
  This is a string\");\n        int i = -7;\n        ps.println(i);\n        double\
  \ d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n输出：\n```\nThis is a string\n\
  -7\n4.5E-7\n```\n\n示例 15.5\n```java\nimport java.io.*;\nclass PrintStream2 {\n \
  \   public static void main (String argv[]) throws IOException {\n        FileOutputStream\
  \ fout = new FileOutputStream(\"test.dat\");\n        PrintStream ps = new PrintStream(fout,\
  \ true);\n        ps.println(\"This is a string\");\n        int i = -7;\n     \
  \   ps.println(i);\n        double d = 4.5e-7;\n        ps.println(d);\n    }\n\
  }\n```\n\n\n\n\n\n## PrintWriter 类\n\n创建一个新的 `PrintWriter`，不具备自动行刷新功能，用于写入指定的 `OutputStream`。\n\
  \n`PrintWriter(OutputStream out, boolean autoFlush)`\n\n创建一个新的 `PrintWriter`，用于写入指定的\
  \ `OutputStream`。\n\n`PrintWriter(Writer out)`\n\n创建一个新的 `PrintWriter`，不具备自动行刷新功能，用于写入指定的\
  \ `Writer`。\n\n`PrintWriter(Writer out, Boolean autoFlush)`\n\n创建一个新的 `PrintWriter`，用于写入指定的\
  \ `Writer`。\n\n最常用的构造函数是：\n\n`PrintWriter(OutputStream os, boolean flushOnNewLine)`\n\
  \n在这里，`os` 是 `OutputStream` 类型的对象，`flushOnNewLine` 控制 Java 是否在每次调用 `println()` 方法时都冲刷输出流。如果\
  \ `flushOnNewLine` 为 `true`，则会自动进行冲刷。如果为 `false`，则不进行自动冲刷。\n\n`PrintWriter` 支持针对所有类型（包括对象）的\
  \ `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter` 方法将调用对象的 `toString()` 方法然后打印结果。\n\
  \n要使用 `PrintWriter` 写入控制台，请指定 `System.out` 为输出流，并在每行之后冲刷流。例如，这行代码创建了一个连接到控制台输出的\
  \ `PrintWriter`。\n\n`PrintWriter pw = new PrintWriter(System.out, true)`\n\n###\
  \ 示例 15.16\n```java\nimport java.io.*;\nclass PrintWriterTest {\n    public static\
  \ void main (String argv[]) throws IOException {\n        PrintWriter pw = new PrintWriter(System.out,\
  \ true);\n        pw.println(\"This is a string\");\n        int i = -7;\n     \
  \   pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n    }\n\
  }\n```\n**输出：**\n```\nThis is a string\n-7\n4.5E-7\n```\n\n### 示例 15.17\n```java\n\
  import java.io.*;\nclass PrintWriterTest1 {\n    public static void main (String\
  \ argv[]) throws IOException {\n        FileWriter fout = new FileWriter(\"test.dat\"\
  );\n        PrintWriter pw = new PrintWriter(fout, true);\n        pw.println(\"\
  This is a string\");\n        int i = -7;\n        pw.println(i);\n        double\
  \ d = 4.5e-7;\n        pw.println(d);\n    }\n}\n```\n\n### 示例 15.18\n```java\n\
  import java.io.*;\nclass PrintWriterTest2 {\n    public static void main (String\
  \ argv[]) throws IOException {\n        PrintWriter pw = new PrintWriter(\"test.dat\"\
  );\n        pw.println(\"This is a string\");\n        int i = -7;\n        pw.println(i);\n\
  \        double d = 4.5e-7;\n        pw.println(d);\n        pw.close();\n    }\n\
  }\n```\n\n# PipedInputStream 和 PipedOutputStream\n\n管道输出流可以连接到管道输入流以创建一个通信管道。管道输出流是管道的发送端。管道输入流应该连接到管道输出流；随后，管道输入流将读取写入管道输出流的任何字节。通常，数据由一个线程从\
  \ `PipedInputStream` 对象读取，并由另一个线程写入相应的 `PipedOutputStream`。不建议在单个线程中同时使用这两个对象，因为可能会导致线程死锁。\n\
  \n#### 构造函数\n- `PipedInputStream()`: 创建一个 `PipedInputStream`，其尚未连接。\n- `PipedInputStream(PipedInputStream\
  \ src)`: 创建一个 `PipedInputStream`，使其连接到输出流 `src`。\n- `PipedOutputStream()`: 创建一个\
  \ `PipedOutputStream`，其尚未连接到管道输入流。\n- `PipedOutputStream(PipedInputStream snc)`:\
  \ 创建一个连接到指定管道输入流的 `PipedOutputStream`。\n\n### 示例 15.19\n```java\nimport java.io.*;\n\
  class TextGenerator extends Thread {\n    OutputStream out;\n    TextGenerator(OutputStream\
  \ out) {\n        this.out = out;\n    }\n    public void run() {\n        try {\n\
  \            for(byte b = 65; b<=90; b++) {\n                out.write(b);\n   \
  \         }\n        } finally {\n            out.close();\n        } catch (IOException\
  \ e) {\n            System.out.println(e);\n        }\n    }\n}\nclass Pipe {\n\
  \    public static void main(String args[]) throws IOException {\n        PipedOutputStream\
  \ out = new PipedOutputStream();\n        PipedInputStream in = new PipedInputStream(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start();\n \
  \       int ch;\n        while((ch = in.read()) != -1) {\n            System.out.print((char)\
  \ ch);\n        }\n    }\n}\n```\n**输出：**\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n```\n\
  \n# PipedReader 和 PipedWriter\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream`\
  \ 相同，区别在于它们是字符流。\n\n#### 构造函数\n- `PipedReader()`: 创建一个 `PipedReader`，其尚未连接。\n- `PipedReader(PipedWriter\
  \ src)`: 创建一个 `PipedReader`，使其连接到管道写入器 `src`。\n- `PipedWriter()`: 创建一个 `PipedWriter`，其尚未连接到管道读取器。\n\
  - `PipedWriter(PipedReader snk)`: 创建一个连接到指定管道读取器的 `PipedWriter`。\n\n### 示例 15.20\n\
  ```java\nimport java.io.*;\nclass TextGenerator extends Thread {\n    Writer out;\n\
  ```\n\n\n\n\n\n## TextGenerator(Writer out)\n\n```java\nTextGenerator(Writer out)\
  \ {\n    this.out = out;\n}\npublic void run() {\n    try {\n        try {\n   \
  \         for(char c = 'a'; c<='z'; c++)\n                out.write(c);\n      \
  \  }\n        finally {\n            try {\n                Thread.sleep(2000);\n\
  \            } catch (Exception e) {}\n            System.out.println(\"aaaaaaaaaaaaa\"\
  );\n            if(true) {\n                return; // IOException: Broken\n   \
  \             out.close(); //IOException: Write dead\n            } //OK thread\
  \ after closing the pipe\n        }\n    } catch(IOException e) { System.out.println(e);}\n\
  }\n```\n\n## Pipe2\n\n```java\nclass Pipe2 {\n    public static void main (String\
  \ argv[]) throws IOException {\n        PrintStream ps = new PrintStream(System.out);\n\
  \        PipedWriter out = new PipedWriter();\n        PipedReader in = new PipedReader(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start(); int\
  \ ch;\n        while((ch = in.read()) != -1) {\n            System.out.print((char)\
  \ ch);\n        }\n    }\n}\n```\n输出:\n`abcdefghijklmnopqrstuvxyzaaaaa`\n`Exception\
  \ in thread \"main\" java.io.IOException: Pipe broken`\n`at java.io.PipedReader.read(Unknown\
  \ Source)`\n`at Pipe2.main(Pipe2.java:43)`\n\n## 过滤字节流 (Filtered Byte Streams)\n\
  \n过滤流只是输入或输出流的包装器，能够透明地提供某些扩展功能。常见的扩展包括缓冲、zip 压缩/解压等。过滤字节流是 `FilterInputStream`\
  \ 和 `FilterOutputStream`。它们的构造函数如下：\n\n* `FilterInputStream(InputStream in)`：通过将参数\
  \ `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后使用。\n* `FilterOutputStream(OutputStream\
  \ out)`：创建一个在指定的输出流之上构建的输出过滤器。这些类中提供的方法与 `InputStream` 和 `OutputStream` 中的方法相同。\n\
  \n## 缓冲字节流 (Buffered Byte Streams)\n\n对于面向字节的流，缓冲流通过在 I/O 流上附加内存缓冲区来扩展过滤流类。该缓冲区允许\
  \ Java 一次处理多个字节的 I/O 操作，从而提高性能。由于缓冲区的存在，对流进行跳过（skipping）、标记（marking）和重置（reset）变得可能。缓冲流类是\
  \ `BufferedInputStream` 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\
  \n### BufferedInputStream\n\n缓冲 I/O 是一种常见的性能优化。Java 的 `BufferedInputStream` 类允许你将任何\
  \ `InputStream` “包装”成缓冲流并实现这种性能提升。`BufferedInputStream` 有两个构造函数：\n\n* `BufferedInputStream(InputStream\
  \ in)`：创建一个 `BufferedInputStream` 并保存参数 `in` 以供稍后使用。创建一个内部缓冲区数组并存储在 `buf` 中。\n*\
  \ `BufferedInputStream(InputStream in, int size)`：创建一个具有指定缓冲区大小的 BufferInputStream，并保存参数\
  \ `in` 以供稍后使用。\n\n缓冲输入流还提供了支持在可用缓冲区向后移动的基础。除了任何 `InputStream` 实现的 `read()` 和 `skip()`\
  \ 方法外，`BufferedInputStream` 还支持 `mark()` 和 `reset()` 方法。这种支持通过 `BufferedInputStream.markSupported()`\
  \ 返回 `true` 反射出来。\n\n### 示例 15.21\n\n```java\nimport java.io.*;\nclass BufferedInputStreamTest\
  \ {\n    public static void main(String args[])throws IOException {\n        FileInputStream\
  \ fin=new FileInputStream(\"A.txt\");\n        BufferedInputStream b1 = new BufferedInputStream(fin);\n\
  \        for(int i=1;i<=10;i++) {\n            System.out.print((char)b1.read());\n\
  \        }\n        System.out.println();\n        if(b1.markSupported()) {\n  \
  \          b1.mark(500);\n            for(int i=1;i<=10;i++) {\n               \
  \ System.out.print((char)b1.read());\n            }\n            System.out.println();\n\
  \            b1.reset();\n            for(int i=1;i<=10;i++) {\n               \
  \ System.out.print((char)b1.read());\n            }\n        } else {\n        \
  \    System.out.println(\"Marking option is not availabel\");\n        }\n     \
  \   b1.close();\n        fin.close();\n    }\n}\n```\n输出：\n`matrix Research`\n`earch\
  \ And`\n`earch And`\n\n**注意：**\n`mark(32)` 为下次读取的 32 个字节保留标记（这足够包含所有实体引用）。`mark`\
  \ 的使用限制在缓冲区内的访问。这意味着你只能为 `mark()` 指定一个小于流的缓冲区大小的参数。\n\n## BufferedOutputStream\n\
  \n与缓冲输入不同，缓冲输出不提供额外的功能。它仅被用于提高性能。以下是可用的构造函数：\n\n* `BufferedOutputStream(OutputStream\
  \ out)`\n\n\n\n\n\n## BufferedOutputStream\n\n创建一个新的缓冲输出流，将数据写入到指定的底层输出流。它使用一个大小为\
  \ 512 字节的缓冲区。\n\n`BufferedOutputStream(OutputStream out, int size)`\n\n创建一个新的缓冲输出流，使用指定的缓冲区大小将数据写入到指定的底层输出流。\n\
  \n### 示例 15.22\n\n```java\nimport java.io.*;\n\nclass BufferedOutputStreamTest {\n\
  \    public static void main(String args[ ]) throws IOException {\n        BufferedOutputStream\
  \ f = new BufferedOutputStream (System.out,100);\n        byte buf[ ] = \"This will\
  \ not be displayed without flush()\\n\".getBytes();\n        f.write(buf);\n   \
  \     f.write(buf);\n        System.out.println(\"testing...\");\n        f.write(buf);\n\
  \        //f.flush(); or\n        //f.close();\n    }\n}\n```\n\n**输出：**\n```\n\
  testing...\nThis will not be displayed without flush()\nThis will not be displayed\
  \ without flush()\nThis will not be displayed without flush()\n```\n\n## BufferedReader\n\
  \n`BufferedReader` 通过缓冲输入来提高性能。它有两个构造函数：\n\n`BufferedReader(Reader in)`\n创建一个使用默认大小输入缓冲区的缓冲字符输入流。\n\
  \n`BufferedReader(Reader in, int sz)`\n创建一个使用指定大小输入缓冲区的缓冲字符输入流。\n\n### 示例 15.23\n\
  \n```java\nimport java.io.*;\n\nclass BufferedReaderTest {\n    public static void\
  \ main(String args[]) throws IOException {\n        FileReader fr=new FileReader(\"\
  A.txt\");\n        BufferedReader b1 = new BufferedReader(fr);\n        for(int\
  \ i=1;i<=10;i++) {\n            System.out.print((char)b1.read());\n        }\n\
  \        System.out.println();\n        if(b1.markSupported()) {\n            b1.mark(5);\n\
  \            for(int i=1;i<=10;i++) {\n                System.out.print((char)b1.read());\n\
  \            }\n            System.out.println();\n            b1.reset();\n   \
  \         for(int i=1;i<=10;i++) {\n                System.out.print((char)b1.read());\n\
  \            }\n        } else {\n            System.out.println(\"Marking option\
  \ is not availabel\");\n        }\n        b1.close();\n        fr.close();\n  \
  \  }\n}\n```\n\n## BufferedWriter\n\n使用 `BufferedWriter` 通过减少数据实际写入流的次数来提高性能。\n\n\
  #### 构造函数\n\n`BufferedWriter(Writer out)`\n创建一个使用默认大小缓冲区的缓冲字符输出流。\n\n`BufferedWriter(Writer\
  \ out, int sz)`\n创建一个使用给定大小输出缓冲区的缓冲字符输出流。\n\n### 示例 15.4\n\n```java\nimport java.io.*;\n\
  \nclass Test {\n    public static void main(String args[]) throws IOException {\n\
  \        BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n \
  \       String s = \"will not be displayed without flush()\\n\";\n        char buf[\
  \ ] = new char[s.length()];\n        s.getChars(0,s.length(),buf,0);\n        f.write(buf);\n\
  \        f.write(buf);\n        System.out.println(\"testing...\");\n        f.write(buf);\n\
  \        //f.flush();\n        //f.close();\n    }\n}\n```\n\n**输出：**\n```\ntesting...\n\
  ```\n\n# 使用字节流处理原始数据类型\n\n基本的输入和输出流提供的读/写方法只能用于读/写字节或字符。\n\n如果我们想读/写像整数和双点数这样的原始数据类型，可以使用过滤器类作为现有输入输出流的包装，以对原始流中的数据进行过滤。\n\
  \n用于创建处理原始类型的“数据流”的两个过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类使用了所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\
  \n![](img/image01262.jpeg)\n\n从文件输入数据流可以如下创建：\n\n```java\nFileInputStream fis =\
  \ new FileInputStream(infile);\nDataInputStream dis = new DataInputStream(fis);\n\
  ```\n\n这些语句基本上是将 `dis` 包装在 `fis` 之上并将其作为“过滤器”。同样，以下语句创建了输出数据流 `dos` 并将其封装在输出文件之上：\n\
  \n```java\nFileOutputStream fos = new FileOutputStream(outfile);\nDataOutputStream\
  \ dos = new DataOutputStream(fos);\n```\n\n### 示例 15.5\n\n以下程序演示了原始数据类型的读和写。\n\n\
  ```java\nimport java.io.*;\n\nclass ReadWritePrimitive {\n    public static void\
  \ main (String[]) throws IOException {\n        File primitive = new File(\"prim.dat\"\
  );\n        FileOutputStream fos = new FileOutputStream(primitive);\n        DataOutputStream\
  \ dos = new DataOutputStream(fos);\n        dos.writeInt(1999);\n        dos.writeDouble(22.44);\n\
  \        dos.writeBoolean(false);\n        dos.writeChar('X');\n        dos.close();\n\
  \        fos.close();\n\n        FileInputStream fis = new FileInputStream(primitive);\n\
  \        DataInputStream dis = new DataInputStream(fis);\n        System.out.println(dis.readInt());\n\
  \        System.out.println(dis.readDouble());\n        System.out.println(dis.readBoolean());\n\
  \        System.out.println(dis.readChar());\n        dis.close();\n    }\n}\n```\n\
  \n\n\n\n\n```java\nfis.close();\n}\n}\n```\n\nOutput:\n1999\n222.44\nfalse\nX\n\n\
  ## 预定义流\n\n`System` 类包含三个预定义的流变量：`in`、`out` 和 `err`。这些字段在 `System` 类中被声明为 `public`\
  \ 且 `static`。这意味着它们可以被程序的任何部分使用，而无需引用特定对象。\n\n`System.out` 指标准输出流。默认情况下，它是控制台。`System.out`\
  \ 是一个 `PrintStream` 类型的对象。\n\n`System.in` 指标准输入，默认是键盘。`System.in` 是一个 `InputStream`\
  \ 类型的对象。\n\n`System.err` 指标准错误流，默认情况下也是控制台。`System.err` 是一个 `PrintStream` 类型的对象。\n\
  \n这些是字节流，尽管它们通常用于从控制台读取和写入字符。如果需要，你可以将这些流封装在基于字符的流中。\n\n### InputStreamReader\n\n\
  `InputStreamReader` 是字节流到字符流的桥梁；它读取字节并使用指定的 `charset` 将其解码为字符。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\
  \n#### 构造函数\n\n- `InputStreamReader(InputStream in)`：创建一个使用默认字符集的 `InputStreamReader`。\n\
  - `InputStreamReader(InputStream in, String charsetName)`：创建一个使用指定名称字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n\n```java\nimport java.io.*;\nclass InputStreamReaderTest {\n  \
  \  public static void main (String argv[]) throws IOException {\n        char c;\n\
  \        InputStreamReader is = new InputStreamReader(System.in);\n        System.out.println(\"\
  Enter characters, 'q' to quit\");\n        c = (char)is.read();\n        while(c!='q')\
  \ {\n            System.out.print(c);\n            c = (char)is.read();\n      \
  \  }\n    }\n}\n```\nOutput:\nEnter characters, 'q' to quit\nabcd\nq\n\n## 示例 15.27\n\
  \n对上一个示例进行了修改，使用缓冲区来提高性能。\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\
  \ {\n    public static void main (String args[]) throws IOException {\n        char\
  \ c;\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter characters, 'q' to quit\");\n        c = (char)br.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)br.read();\n\
  \        }\n    }\n}\n```\nOutput:\nEnter characters, 'q' to quit\nabcd\nq\n\n##\
  \ 示例 15.28\n\n`InputStreamReader` 没有提供 `readLine()` 方法，因此 `InputStreamReader` 与提供了\
  \ `readLine()` 方法的 `BufferedReader` 关联。\n\n```java\nimport java.io.*;\nclass BufferedReaderTest\
  \ {\n    public static void main (String argv[]) throws IOException {\n        BufferedReader\
  \ br = new BufferedReader(new InputStreamReader(System.in));\n        System.out.println(\"\
  Enter 'stop' to quit\");\n        String str = br.readLine();\n        while(!str.equals(\"\
  stop\")) {\n            System.out.println(\"Your Name:\"+str);\n            str\
  \ = br.readLine();\n        }\n    }\n}\n```\nOutput:\nEnter 'stop' to quit\nHarry\
  \ Feat\nYour Name:Harry Feat\n\n## 示例 15.29\n\n此示例演示了我们可以直接从 `System.in` 读取。\n\n\
  ```java\nimport java.io.*;\nclass ReadFromConsole {\n    public static void main\
  \ (String arg[]) throws IOException {\n        char c;\n        System.out.println(\"\
  Enter characters, 'q' to quit\");\n        c = (char) System.in.read();\n      \
  \  while(c!='q') {\n            System.out.print(c);\n            c = (char) System.in.read();\n\
  \        }\n    }\n}\n```\nOutput:\nEnter characters, 'q' to quit\nabcd\nabcd\n\
  q\n\n## OutputStreamWriter\n\n`OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符将使用指定的 `charset`\
  \ 编码为字节。它使用的字符集可以显式指定，也可以接受平台的默认字符集。\n\n#### 构造函数\n\n- `OutputStreamWriter(OutputStream\
  \ out)`：创建一个使用默认编码的 `OutputStream`。\n- `OutputStreamWriter(OutputStream out, String\
  \ charsetName)`：创建一个使用指定名称字符集的 `OutputStream`。\n\n## 读取控制台输入\n\n在 Java 中，执行控制台输入的唯一方法是使用字节流，这种方法存在于旧代码。今天，使用字节流读取控制台仍然可行，但可能需要使用过弃的方法，且这种方法并不推荐。在\
  \ Java 中，控制台输入通过读取 `System.in` 实现。为了获得连接控制台的字符流，你可以将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，然后进一步封装在 `BufferedReader` 对象中以提高性能。\n\n## 输出控制台输出\n\n控制台输出可以通过 `print()` 和\
  \ `println()` 直接完成。这些方法由 `PrintStream` 类定义（它是 `System.out` 的类型）。尽管 `System.out`\
  \ 是字节流，但用它进行简单的程序输出是可以接受的。\n\n然而，基于字符的替代方案是正确的选择。因为 `PrintStream` 是派自 `OutputStream`\
  \ 的输出流，它还实现了底层的 `write()` 方法。`PrintStream` 定义的最简单 `write()` 形式为：\n\n```java\nvoid\
  \ write(int byteval)\n```\n\n该方法向流写入由 `byteval` 指定的字节。尽管 `byteval` 被声明为整数，但只有低 8\
  \ 位会被写入。\n\n### 示例 15.30\n\n```java\nimport java.io.*;\nclass WriteTest {\n}\n```\n\
  \n\n\n\n\n# Java 中的序列化\n\n## 序列化概述\n\n序列化是将对象的状态写入字节流的过程。当你想要将对象的状态存储到字节流中时，这种方法非常有用。当你想要将程序状态保存到持久化区域（如文件）时，它同样有用。在之后的某个时刻，你可以通过反序列化过程恢复这些对象。\n\
  \n实现 `RMI` 也需要序列化。`RMI` 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为远程方法的参数传递。发送端对对象进行序列化并转换，接收端对其进行反序列化。\n\
  \n如果你尝试对对象图顶部的对象进行序列化，所有引用的对象都会被递归定位并序列化。同样，在反序列化过程中，所有这些对象及其引用都会被正确存储。声明为 `transient`\
  \ 或 `static` 的变量不会被序列化机制保存。\n\n注意：你通常不会使用 `write()` 执行控制台输出，因为 `print()` 和 `println()`\
  \ 使用起来要简单得多。\n\n## Externalizable 接口\n\nJava 的序列化和反序列化设施设计使得保存和恢复对象状态的大部分工作可以自动完成。然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术可能是必要的。`Externalizable`\
  \ 接口正是为了这种情况设计的。实现 `Externalizable` 的对象也可以被序列化反序列化，但控制权在用户手中，即用户可以决定序列化序列化哪些部分。序列化代码写在\
  \ `writeExternal()` 方法中，反序列化代码写在 `readExternal()` 中。\n\n### Externalizable 接口的方法\n\
  - `void readExternal(ObjectInput in)`：对象实现 `readExternal` 方法，通过调用用于基本类型的 `DataInput`\
  \ 方法以及用于对象、字符串和数组的 `readObject` 方法来恢复内容。\n- `void writeExternal(ObjectOutput out)`：对象实现\
  \ `writeExternal` 方法，通过调用用于其基本值的 `DataOutput` 方法或调用用于对象、字符串和数组的 `ObjectOutput` `writeObject`\
  \ 方法来保存内容。\n\n## ObjectOutput 接口\n\n`ObjectOutput` 接口扩展了 `DataOutput` 接口并支持对象序列化。除了\
  \ `DataOutput` 接口定义的方法外，`ObjectOutput` 接口只定义了一个方法：\n\n- `Void writeObject(Object\
  \ object)`：调用以序列化对象。`ObjectOutput` 接口的所有方法在错误条件下都会抛出 `IOException`。\n\n### ObjectOutputStream\n\
  `ObjectOutputStream` 类扩展了 `OutputStream` 类并实现了 `ObjectOutput` 接口。它负责将对象写入流中。\n\n\
  **构造函数：**\n`ObjectOutputStream(OutputStream out)`：创建一个向指定的 `OutputStream` 写入数据的\
  \ `ObjectOutputStream`。参数 `out` 是将写入序列化对象的输出流。\n\n**写入对象的方法：**\n`void writeObject(Object\
  \ obj)`：将对象写入底层存储或流。\n\n### ObjectInput 接口\n\n`ObjectInput` 接口扩展了 `DataInput` 接口。它支持对象序列化。除了\
  \ `DataInput` 接口定义的方法外，`ObjectInput` 接口只定义了一个方法：\n\n- `Object readObject()`：调用以反序列化对象。\n\
  \n### ObjectInputStream\n`ObjectInputStream` 类扩展了 `InputStream` 类并实现了 `ObjectInput`\
  \ 接口。`ObjectInputStream` 负责从流中读取对象。\n\n**构造函数：**\n`ObjectInputStream(InputStream\
  \ in)`：创建一个从指定的 `InputStream` 读取数据的 `ObjectInputStream`。参数 `in` 是应该从其读取序列化对象的输入流。\n\
  \n**反序列化方法为：**\n`Object readObject()`：从 `ObjectInputStream` 中读取对象。\n\n## 示例 15.31\n\
  \n```java\nimport java.io.*;\nclass SerializationTest {\n    public static void\
  \ main(String args[]) throws IOException {\n        try {\n            MyClass object1\
  \ = new MyClass(\"Hello\", 23, 1.3);\n            MyClass object2 = new MyClass(\"\
  Hello1\", 1, 2);\n            System.out.println(object1);\n            System.out.println(object2);\n\
  \            FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n    \
  \        ObjectOutputStream oos = new ObjectOutputStream(fos);\n            oos.writeObject(object1);\n\
  \            oos.writeObject(object2);\n            oos.flush();\n            oos.close();\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \        try {\n            MyClass object3, object4;\n            FileInputStream\
  \ fis = new FileInputStream(\"serial.dat\");\n            ObjectInputStream ois\
  \ = new ObjectInputStream(fis);\n            object3 = (MyClass)is.readObject();\n\
  \            object4 = (MyClass)is.readObject();\n            ois.close();\n   \
  \         System.out.println(\"After deserialization\");\n            System.out.println(object3);\n\
  \            System.out.println(object4);\n        } catch (Exception e) {\n   \
  \         System.out.println(e);\n        }\n    }\n}\n```\n\n```java\npublic static\
  \ void main (String argv[ ]) throws IOException {\n{\n    // ...\n    int b;\n \
  \   // ...\n    b = 'A';\n    // ...\n    System.out.write(b);\n    // ...\n   \
  \ System.out.flush();to flush\n    System.out.write('\\n');//to flush\n    System.out.write(b);\n\
  }\n```\n\n```java\nclass MyClass implements Serializable {\n    String s;\n    int\
  \ i=100;\n    double d;\n    MyClass(String s, int i, double d) {\n        s = s;\n\
  \        i = i;\n        d = d;\n    }\n    public String toString() {\n    }\n\
  }\n```\n\n\n\n\n\n```java\nreturn \"s = \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n\
  }\n}\n```\n\n**输出:**\n```text\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i =\
  \ 1 ; d = 2.0\n```\n\n**反序列化后**\n```text\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1;\
  \ i = 1 ; d = 2.0\n```\n\n> **注意：** 我们可以在一个文件中保存多个相同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\
  \n### 示例 15.32\n\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会持久化。\n\n```java\nimport\
  \ java.io.*;\n\nclass SerializationTest2 {\n    public static void main (String\
  \ args[]) throws IOException {\n        try {\n            MyClass object1 = new\
  \ MyClass(\"Hello\", 123, 1.3e3);\n            MyClass object3 = new MyClass(\"\
  Hello1\", 1, 2);\n            object3.x = 200;\n            A object5 = new A();\n\
  \            System.out.println(object1);\n            System.out.println(object3);\n\
  \            System.out.println(object5);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            oos.writeObject(object1);\n            oos.writeObject(object3);\n\
  \            oos.writeObject(object5);\n            object3.x = 400;\n         \
  \   oos.flush();\n            oos.close();\n        } catch (Exception e) {\n  \
  \          System.out.println(e);\n        }\n        try {\n            MyClass\
  \ object2, object4;\n            A object6;\n            FileInputStream fis = new\
  \ FileInputStream(\"serial.dat\");\n            ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \            object2 = (MyClass) ois.readObject();\n            object4 = (MyClass)\
  \ ois.readObject();\n            object6 = (A) ois.readObject();\n            ois.close();\n\
  \            fis.close();\n            System.out.println(\"After deserialization\"\
  );\n            System.out.println(object2);\n            System.out.println(object4);\n\
  \            System.out.println(object6);\n        } catch (Exception e) {\n   \
  \         System.out.println(e);\n        }\n    }\n}\n\nclass MyClass implements\
  \ Serializable {\n    String s;\n    transient int i=100;\n    public static int\
  \ x = 0;\n    double d;\n    MyClass(String s, int i, double d) {\n        this.s\
  \ = s;\n        this.i = i;\n        this.d = d;\n        x = 100;\n    }\n    public\
  \ String toString() {\n        return \"s = \" + s + \"; i = \"+ i + \" ;d = \"\
  \ + d +\"; x = \"+ x;\n    }\n}\n\nclass A implements Serializable {\n    public\
  \ String toString() {\n        return \"A\";\n    }\n}\n```\n\n### 示例 15.3 使用 Externalizable\n\
  \n```java\nimport java.io.*;\n\nclass SerializationTest {\n    public static void\
  \ main (String args[]) throws IOException {\n        try {\n            MyClass\
  \ object1 = new MyClass(\"Hello\", 99, 123.45);\n            System.out.println(object1);\n\
  \            FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n    \
  \        ObjectOutputStream oos = new ObjectOutputStream(fos);\n            System.out.println(\"\
  before writing object\");\n            oos.writeObject(object1);\n            System.out.println(\"\
  after writing\");\n            oos.flush();\n            oos.close();\n        }\
  \ catch (Exception e) {\n            System.out.println(e);\n        }\n       \
  \ try {\n            MyClass object2;\n            FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n            ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \            System.out.println(\"before reading\");\n            object2 = (MyClass)\
  \ ois.readObject();\n            System.out.println(\"after reading\");\n      \
  \      ois.close();\n            fis.close();\n            System.out.println(object2);\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n\nclass MyClass implements Serializable {\n    String s;\n```\n\n\n\n\
  \n\n```java\nint i = 100;\ndouble d;\npublic MyClass() {}; // 这是必须的\npublic MyClass(String\
  \ s, int i, double d) {\n    this.s = s;\n    this.i = i;\n    this.d = d;\n}\n\
  public String toString() {\n    return \"s = \" + s + \"; i = \" + i + \" ;d = \"\
  \ + d;\n}\npublic void writeExternal(ObjectOutput oos) throws IOException {\n  \
  \  System.out.println(\"Inside writeExternal\");\n    oos.writeObject(s);\n    oos.writeInt(i);\n\
  \    oos.writeDouble(d);\n}\npublic void readExternal(ObjectInput ois) throws ClassNotFoundException,\
  \ IOException {\n    System.out.println(\"Inside readExternal\");\n    s = (String)\
  \ ois.readObject();\n    i = ois.readInt();\n}\n```\n\n输出:\n```\ns = Hello; i =\
  \ 99 ;d = 123.45\nbefore writing object\nafter writing object\nbefore reading object\n\
  after reading object\ns = Hello; i = 99 ;d = 123.45\n```\n\n注意：\n在反序列化期间，对象将使用默认构造函数进行构建（与\
  \ `serializable` 接口不同），然后进行初始化。状态测试应该在 `readExternal()` 中进行。同样，在序列化期间，只保存类标识。任何状态必须在\
  \ `writeExternal()` 中显式保存。\n\n# Applet\n\n## 简介\nApplet 是一种设计用于在互联网传输并在兼容 Java 的网络浏览器（如\
  \ Internet Explorer 或 Netscape Navigator）客户端上执行的应用程序。Applet 也是 Java 程序，但它们存储在服务器上。\n\
  \nApplet 不能像独立应用程序那样运行。Applet 只能通过嵌入图像或声音文件的 HTML 文件来执行。运行 applet 需要访问一个嵌入了 applet\
  \ 的 HTML 页面。当网络浏览器下载此类 HTML 页面时，随后会加载包含 applet 代码的可执行文件并在本地机器上执行。\n\nApplet 到达客户端后，它对资源的访问有限，这样它可以生成任意的多媒体用户界面并运行复杂的计算，而不会引入病毒风险或破坏数据完整性。\n\
  \n## Applet 架构\nApplet 与普通的 Java 程序不同。\n\n* Applet 是基于 GUI（窗口化）的程序\n* Applet 是事件驱动的\n\
  \n当一个普通的 Java 程序（非基于 GUI 的）需要输入时，它会提示用户并调用某些输入方法，例如 `readLine()`，即交互是由程序发起的。这并不是\
  \ GUI 程序的运行方式。是由用户发起与程序的交互，而不是由程序发起动作。例如，在文字处理软件中，用户通过点击按钮发起动作，产生一个事件，结果是执行一段代码并相应地发生动作。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 和处理事件。之所以被称为 `awt`，因为它依赖于底层操作系统的功能。applet 类似于一组中断例程，等待事件发生。awt\
  \ 通过调用 applet 提供的事件处理程序来通知 applet。一旦发生这种情况，applet 必须采取适当行动并迅速将控制权还给 AWT。这是一个至关重要的点。在绝大多数情况下，我们的\
  \ applet 不应该进入一种长时间保持控制的运行“模式”。相反，它必须响应事件执行特定操作，然后将控制权返回给 AWT 运行时。在 applet 需要独立执行重复任务的情况下（例如在窗口跨区域显示消息），我们必须启动额外的执行线程。\n\
  \n## 编写 Applet\n所有的 applet 都是 `Applet` 类的子类。`Applet` 类位于 `java.applet` 包中。Applet\
  \ 类的层次结构如下：\n\n```\njava.lang.Object\n      |\n  java.awt.Component\n      |\n \
  \ java.awt.Container\n      |\n  java.awt.Panel\n      |\n  java.applet.Applet\n\
  ```\n\n`Applet` 类为 applet 的执行提供了必要的支持，如启动和停止。它提供了加载和显示图像的方法。它还为所有基于窗口的活动提供了必要的支持。我们扩展\
  \ `Applet` 的子类必须声明为 `public`，因为它是由网络浏览器实例化（创建对象）并执行的。浏览器在实例化 applet 时使用无参构造函数，因此它必须提供具有\
  \ `public` 可见性的无参构造函数。建议我们不要在 `Applet` 类中提供构造函数，以防编译器提供默认的参数构造函数。我们可以利用 `init()`\
  \ 方法进行初始化。在编写 applet 代码时，我们通常会重写 `Applet` 类的一些方法，这些方法在 applet 执行期间会被自动调用。重写 `paint()`\
  \ 方法是非常常见的。`paint()` 方法中的代码主要在 applet 窗口中显示输出。\n\n### 示例 16.1: App1.java\n以下程序演示了一个简单的\
  \ applet，它在窗口内显示“Hello World”。在下面的示例中，applet 窗口的背景被设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文字“Hello”将以绿色显示。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.Applet;\n/*applet code=\"App1\"\
  \ width=500 height=100*/\nclass App1 extends Applet {\n    public void init() {\n\
  \        setBackground(Color.red);\n        setForeground(Color.green);\n    }\n\
  \    public void paint(Graphics g) {\n        g.drawString(\"Hello World\", 20,\
  \ 20);\n    }\n}\n```\n\n\n\n\n\n![](img/image01263.jpeg)\n\n## 执行 Applet\n\nApplet\
  \ 并不是通过基于控制的 Java 运行时解释器执行的。有两种方法可以运行 applet：\n\n1. 在兼容 Java 的网页浏览器中执行 applet。\n\
  2. 使用 appletviewer，例如标准的 SDK 工具 `appletviewer`。`appletviewer` 会在一个窗口中执行我们的 applet。这是测试\
  \ applet 最快且最简单的方法。\n\n## 在网页浏览器中执行 Applet\n\n我们需要编写一个短的 HTML 文本文件，其中包含适当 `APPLET`\
  \ 标签。`applet` 标签必须包含以下三个属性：\n\n- `Code`\n- `Width`\n- `Height`\n\n属性 `code` 的指定包含\
  \ applet 代码的类名。`width` 和 `height` 属性分别指定 applet 窗口的宽度和高度。\n\n这里是嵌入了 \"App1\" applet\
  \ 的 HTML 文件 `RunApp.Html`：\n\n```html\n<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Simple “Hello World” Application </h1>\n<applet code= “App1”\
  \ width =500 height=100>\n</applet>\n</body>\n</html>\n```\n\n你可以通过在浏览器中打开文件 `RunApp.html`\
  \ 来执行 applet。该文件可以位于本地文件系统上，也可以从网络服务器加载。\n\n## 使用 appletviewer 执行 Applet\n\n然而，存在一种更方便的方法可以用来加速测试。只需在你的\
  \ Java 源代码文件中包含一个带有 `APPLET` 标签的注释即可。通过这样做，我们的代码就包含了必要 HTML 语句的原型，我们只需通过启动 `appletviewer`\
  \ 并加载我们的 Java 源代码文件即可测试编译后的输出。如果我们使用这种方法，在编译后可以按照如下方式执行 applet：\n\n```bash\nappletviewer\
  \ SimpleApplet.Java\n```\n\n## Applet 生命周期方法\n\nAppApplet 重写了一组方法，这些方法提供了浏览器或 `appletviewer`\
  \ 与 applet 接口交互并控制其执行的基本机制。\n\n这些方法也被称为生命周期方法，因为浏览器或 applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五种生命周期方法：\n\
  \n- `public void init()`\n- `public void start()`\n- `public void stop()`\n- `public\
  \ void destroy()`\n- `public void paint(Graphics g)`\n\n这五个方法中的：`init()`、`start()`、`stop()`\
  \ 和 `destroy()` 是在 `applet` 类中定义的。\n\n`paint()` 是由 `awt Component` 类定义的，并为所有这些方法提供了默认实现。Applet\
  \ 不需要重写它们没有用到的方法。然而，非常简单的 applet 不需要定义它们。\n\n## Applet 的初始化和终止\n\n当 applet 开始时，将按顺序调用以下方法：\n\
  \n1. `init()`\n2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下方法调用序列：\n4. `stop()`\n\
  5. `destroy()`\n\n### init 方法\n这是第一个被调用的方法。在这里我们应该初始化变量并为其他初始化活动编写代码。该方法在 applet\
  \ 的生命周期内仅在实例化后立即被调用一次。\n\n### start 方法\n`start()` 方法在 `init()` 之后被调用它它用于在 applet\
  \ 停止后重启 applet。当 `init()` 在第一次加载 applet 时被调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时都会被调用。因此，如果用户离开网页并返回，applet\
  \ 将从 `start()` 恢复执行。\n\n### paint 方法\n`paint()` 在 applet 开始执行时于 `init()` 和 `start()`\
  \ 方法之后被调用。每当 applet 的输出需要重绘时，也会调用 `paint()` 方法。这种情况可能由于几个原因发生。例如，运行 applet 的窗口可能被另一个窗口覆盖然后重新显示，或者\
  \ applet 窗口可能被最小化然后恢复。\n\n### stop 方法\n当网页浏览器离开包含 applet 的 HTML 文档转到另一个页面时，`stop()`\
  \ 方法会被调用。当 `stop()` 被调用时，applet 可能正在运行。\n\n我们应该使用 `stop()` 来挂起 applet 不可见时不需要运行的线程。如果用户返回页面，我们可以在调用\
  \ `start()` 时重新启动它们。我们还可以在 `start()` 方法中释放任何昂贵的资源并重新获取。\n\n### destroy 方法\n当环境确定我们的\
  \ applet 需要从内存中完全移除时，`destroy()` 方法会被调用。在此时，我们应该释放 applet 可能正在使用的任何资源。`stop()` 方法始终在\
  \ `destroy()` 之前被调用。\n\n**示例 16.2 一个简单的 applet，将背景颜色设置为青色，前景颜色设置为红色，并显示一条消息，说明 applet\
  \ 启动时 `init()`、`start()` 和 `paint()` 方法被调用的顺序。**\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App2\" width=500 height=100></applet>*/\n\
  class App2 extends Applet {\n    String msg=\"\";\n    public void init() {\n  \
  \      System.out.println(\"Inside init\");\n        setBackground(Color.cyan);\n\
  \        setForeground(Color.red);\n        msg = \"Inside init --\";\n    }\n \
  \   public void start() {\n        System.out.println(\"Inside start\");\n     \
  \   msg += \"Inside start --\";\n    }\n    public void stop() {\n        System.out.println(\"\
  Inside stop\");\n        msg += \"Inside stop --\";\n    }\n    public void paint(Graphics\
  \ g) {\n        System.out.println(\"Inside paint\");\n        msg += \"Inside paint\
  \ --\";\n        g.drawString(msg,10,30);\n    }\n    public void destroy() {\n\
  \        System.out.println(\"Inside destroy\");\n    }\n}\n```\n\n输出：\n![](img/image264.jpeg)\n\
  \n## 动态 Applet\n\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示移动的横幅。Applet 也可以用于应用程序，例如通过从服务器获取板球比赛得分和其他统计数据；显示股票价格等。\n\
  \n### 示例 16.3\n以下示例显示了一个移动的横幅。它演示了使用 `repaint()` 方法来刷新显示。该 applet 在 applet 窗口上从右向左滚动消息。\n\
  \n由于消息滚动是一项重复性任务，它由一个独立的线程执行，该线程在 applet 初始化时被创建。此程序还演示了可以在 `stop()` 方法中释放资源并在 `start()`\
  \ 方法中重新获取。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet code=\"\
  App3\" width=500 height=100></applet>*/\nclass App3 extends Applet implements Runnable\
  \ {\n    String msg=\"A Simple Moving Banner.\" ;\n    Thread t = null;\n    boolean\
  \ stopFlag;\n    public void init ()\n```\n\n\n\n\n\n```java\n{\n    setBackground(Color.cyan);\n\
  \    setForeground(Color.red);\n}\npublic void start()\n{\n    t=new Thread(this);\n\
  \    stopFlag = false ;\n    t.start ();\n}\npublic void stop()\n{\n    stopFlag=true;\n\
  \    t=null;\n}\npublic void paint(Graphics g)\n{\n    g.drawString(msg, 0, 0);\n\
  }\npublic void run()\n{\n    for (;;) {\n        repaint();\n        try {\n   \
  \         Thread.sleep(250);\n        } catch(InterruptedException e) {\n      \
  \      System.out.println(e);\n        }\n        msg = msg.substring(1) + msg.charAt(0);\n\
  \        if (stopFlag) {\n            break;\n        }\n    }\n}\n```\n输出：\n![](img/image0265.jpeg)\n\
  \n## 使用状态窗口\n\n除了在窗口中显示信息外，Applet 还可以向运行它的浏览器或 `appletviewer` 的状态窗口输出消息。\n\n要做到这一点，请调用\
  \ `showStatus()` 并传入我们想要显示的字符串。状态窗口是向用户提供 Applet 正在发生的情况反馈、建议选项或报告某些类型错误的好地方。状态窗口也是极佳的调试助手（帮助），因为它为我们提供了一种输出关于\
  \ Applet 信息的简单方法。\n\n#### 示例 16.4：以下示例演示了如何使用状态窗口。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App4\" width=500 height=100></applet>*/\n\
  public class App4 extends Applet\n{\n    public void init()\n    {\n        setBackground(Color.cyan);\n\
  \    }\n    public void paint(Graphics g)\n    {\n        g.drawString(\"This is\
  \ in the applet window\",10,20);\n        showStatus(\"This is shown in the status\
  \ window\");\n    }\n}\n```\n输出：\n![](img/image0266.jpeg)\n\n### HTML 的 APPLET 标签\n\
  \n`APPLET` 标签用于从 HTML 文档和 `appletviewer` 启动 applet。`appletviewer` 会在单独窗口中执行找到的每个\
  \ `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer 等浏览器允许在单个页面上运行多个 applet。\n\
  \n标准 `APPLET` 标签的语法为：\n\n```html\n<APPLET\n    CODE=applet class\n    CODEBASE=codebase\
  \ URL\n    ALT=alternate Text,\n    NAME=appletInstename\n    WIDTH=pixels\n   \
  \ HEIGHT=pixels\n    ALIGN=alignment\n    VSPACE=vertical space in pixels\n    HSPACE=horizontal\
  \ space in pixels\n>\n<PARAM NAME=attributeName-1 VALUE=Attribute Value-1>\n<PARAM\
  \ NAME=attributeName-2 VALUE=Attribute Value-2>\n-------------\n<PARAM NAME=attributeName-N\
  \ VALUE=Attribute Value-N>\n………在没有 Java 的情况下显示的 HTML………\n</APPLET>\n```\n\n### 属性\n\
  \n- **CODE**: `CODE` 是一个必需属性，提供包含 applet 编译类文件的文件名。该文件相对于 applet 的 `CODEBASE` URL（如果设置了\
  \ `CODEBASE` 则由其指明）。\n- **CODEBASE**: `CODEBASE` 是一个可选属性，指定 applet 的基础 URL，即搜索 applet\
  \ 可执行文件（由 `CODE` 标签指定）的目录。如果未指定此属性，则使用 HTML 文档的目录作为 `CODEBASE`。`CODEBASE` 不一定位于读取\
  \ HTML 文档的主机。\n- **ALT**: `ALT` 标签是一个可选属性，用于指定浏览器理解 `APPLET` 标签但无法运行 Java 时应显示的短文本。这是为不支持\
  \ applet 的浏览器提供的替代方案。\n- **NAME**: `NAME` 是一个可选属性，用于指定 applet 实例名称。applet 必须命名，以便同页的其他\
  \ applet 通过名称找到它们并与其通信。通过名称获取 applet 请使用 `getName()`，它由 `Applet` 接口定义。\n- **WIDTH\
  \ 和 HEIGHT**: `WIDTH` 和 `HEIGHT` 是显示区域的大小（像素）。\n- **ALIGN**: `ALIGN` 是一个可选属性，指定\
  \ applet 的对齐方式。该属性的处理方式与 `IMG` 标签相同，可能的值有`LEFT`、`RIGHT`、`BOTTOM`、`TEXTTOP`、`MIDDLE`\
  \ 和 `BOTTOM`。\n- **VSPACE 和 HSPACE**: 这些属性是可选的；`VSPACE` 指定 applet 上下的像素间隔。`HSPACE`\
  \ 指定 applet 两侧的像素间隔。它们的处理方式与 `IMG` 标签的 `VSPACE` 和 `HSPACE` 相同。\n\n### PARAM 标签\n\
  \n`PARAM` 标签允许我们在 HTML 中指定 applet 参数。applet 使用 `getParameter()` 方法访问属性。`PARAM` 标签有两个属性：`NAME`\
  \ 和 `VALUE`。\n\n#### 示例 16.5：此示例演示了如何从 HTML 页面向 Applet 传递参数\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App5\" width=500 height=100>\n    <param\
  \ name=\"fontName\" value=\"Arial\">\n    <param name=\"fontSize\" value=\"30\"\
  >\n</applet>*/\npublic class App5 extends Applet\n{\n    String fName;\n    int\
  \ fSize;\n    public void init ()\n    {\n        fName = getParameter(\"fontName\"\
  );\n        if (fName == null)\n            fName = \"Courier\";\n        fSize\
  \ = Integer.parseInt(getParameter(\"fontSize\"));\n        Font f1 = new Font(fName,\
  \ Font.PLAIN, fSize);\n        setFont(f1);\n    }\n    public void paint (Graphics\
  \ g)\n    {\n        g.drawString (\"Font Name : \" + fName, 0, 25 );\n    }\n}\n\
  ```\n\n\n\n\n\n```java\ng.drawString (\"Font Size : \" + fSize, 0, 50 );\ng.drawString\
  \ (\"Hello world\", 0,75);\n}\n```\n\n![](img/image01267.jpeg)\n\n## 获取 DocumentBase\
  \ 和 CodeBase\n\n通常，我们会创建需要显式加载媒体和文本的 applet。Java 允许 applet 从启动 applet 的 HTML 文件所在的目录（文档基\
  \ base）以及加载 applet 类文件所在的目录（代码基 base）加载数据。\n\n这些目录以 `URL` 对象的形式返回。它们可以与命名我们想要加载的文件的字符串拼接。要实际加载另一个文件，我们将使用由\
  \ `Applet` 上文接口定义的 `showdocument()` 方法。\n\n### 示例 16.6 以下示例演示了如何在 applet 代码中获取文档基和代码基。\n\
  \n#### App6.java\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet\n{\n    public void paint (Graphics g)\n    {\n\
  \        URL u1 = getCodeBase( );\n        g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \        URL u2 = getDocumentBase();\n        g.drawString (\"Document base:-\"\
  +u2, 10,40);\n    }\n}\n```\n\n#### App6.html\n```html\n<html>\n<body>\n    <applet\
  \ code=\"App6\" width=500 height=200></applet>\n</body>\n</html>\n```\n输出：\n\n##\
  \ AppContext 和 Document\n\nJava 的应用之一是使用活跃的图像和动画来提供一种图形化的网页导航手段，这比超文本使用的下划线文字更有趣。为了允许我们的\
  \ applet 将控制权转移到另一个 URL，我们必须使用 `AppContext` 接口定义的 `document()` 方法。\n\n`AppContext`\
  \ 是一个接口，允许我们从 applet 的执行环境中获取信息。当前执行的 applet 的上下文通过调用 `Applet` 类定义的 `getContext()`\
  \ 方法获得。\n\n在 applet 内部，一旦获取了 applet 的上下文，我们就可以通过 `showDocument()` 方法将另一个文档引入视线。该方法没有返回值，如果执行失败也不会抛出异常，因此请谨慎使用。共有两个\
  \ `showDocument()` 方法：\n\n1. `void showDocument(URL url)`：用给定的 `URL` 当前正在查看的网页。\n\
  2. `void showDocument (URL url, String where)`：在浏览器窗口的指定位置显示指定的文档。“where”的有效参数：\n\
  \   - `\"_self\"`（在当前帧中）\n   - `\"_parent\"`（在父帧中）\n   - `\"_top\"`（在顶层帧中）\n   -\
  \ `\"_blank\"`（在新浏览器窗口中）\n\n### 示例 16.7 以下 applet 演示了 AppContext 和 `showDocument()`\
  \ 的用法。执行时，它获取当前的 applet 上下文并使用该上下文将控制权转移到名为 A.html 的文件。该文件必须与 applet 位于同一目录下。Test.html\
  \ 可以包含你喜欢的任何有效超文本。\n\n#### App7.java\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.net.*;\npublic class App7 extends Applet\n{ \n    AppContext ac;\n \
  \   URL u1;\n    public void init()\n    {\n        setBackground(Color.cyan);\n\
  \    }\n    public void start( )\n    {\n        ac = getContext();\n        u1\
  \ = getCodeBase();\n        try\n        {\n            Thread.sleep(300);\n   \
  \         ac.showDocument(new URL(u1 + \"A.html\"),\"_blank\");\n        }\n   \
  \     catch(MalformedURLException e)\n        { \n            showStatus(\"Invalid\
  \ URL\");\n            e.printStackTrace() ;\n        }\n        catch(InterruptedException\
  \ e)\n        { \n            showStatus(\"Invalid URL\");\n            e.printStackTrace\
  \ () ;\n        }\n    }\n    public void paint (Graphics g)\n    {\n        g.drawString(u1+\"\
  A.html\",0,20);\n        try\n        {\n            Thread.sleep(300);\n      \
  \  }\n        catch(InterruptedException e)\n        {\n            System.out.println(e);\n\
  \        }\n    }\n}\n```\n\n#### App7.html\n```html\n<html>\n<head>\n    <Title>Applet\
  \ Demo</Title>\n</head>\n<body>\n    <applet code=\"App7\" width=200 height=200></applet>\n\
  </body>\n</html>\n```\n\n#### A.html\n```html\n<html>\n<head>\n    <title>New Page</title>\n\
