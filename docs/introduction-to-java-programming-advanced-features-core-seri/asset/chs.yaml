  \ is \" + feet + \"\\nches is \" + inches);\n    }\n\n    void swap(Box obj)\n \
  \   {\n        this.feet = obj.feet;\n        this.inches = obj.inches;\n    }\n\
  }\n\nclass Outer\n{\n    static class Inner\n    {\n        int feet;\n        int\
