  tc2.a=8\ntc2.b=4.5\ntc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\ntc2.c[0]=4\n\
  tc2.c[1]=5\ntc2.c[2]=6\ntc2.c[3]=7\ntc1.c[0]=4\ntc1.c[1]=5\ntc1.c[2]=6\ntc1.c[3]=7\n\
  \n### 示例 2.9：下面的代码通过实现深克隆解决了上一个示例中面临的问题。\n\n```java\nclass TestDeepClone implements\
  \ Cloneable {\n    int a;\n    float b;\n    int c[];\n    public Object clone()\
  \ throws CloneNotSupportedException {\n        TestDeepClone tc = (TestDeepClone)\
  \ super.clone();\n        int d[] = new int[4];\n        for(int i=0; i<4; i++)\
