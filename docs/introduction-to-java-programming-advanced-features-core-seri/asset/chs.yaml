  Enter a string\");\n    }\n}\n```\n\n\n\n\n```java\ns1=sc.next();\nSystem.out.print(\"\
  Enter string to search\");\ns2=sc.next();\nint ans = s1.indexOf(s2);\nif(ans ==\
  \ -1)\n    System.out.println(\"Not Found\");\nelse\n    System.out.println(\"found\
  \ at pos \" + ans);\n```\n\n## # `StringBuffer`\n\n`StringBuffer` 是 `String` 的对等类，提供了\
  \ `String` 的大部分功能。众所周知，`String` 代表固定长度且不可变的字符序列。与 `String` 不同，`StringBuffer` 代表可增长和可写的字符序列。`StringBuffer`\
  \ 可以在中间插入字符和子字符串，也可以在末尾追加。\n\n`StringBuffer` 会自动增长以为这些添加留出空间，通常预分配的字符比实际需要的更多，以便留出增长空间。Java\
  \ 大使用了这两个类，但许多程序员只处理 `String`，而 Java 会通过使用重载的 `+` 运算符在后台操作 `StringBuffer`。\n\n###\
  \ 关于 `StringBuffer` 类的几个重要点\n\n- `StringBuffer` 像 `String` 一样是一个 `Object`。\n- `StringBuffer`\
  \ 类也像 `String` 类一样是 `final`。\n- `StringBuffer` 对象是可变的（可以修改），与 `String` 对象不同。\n\n\
  ### `StringBuffer` 类的构造函数和方法\n\n| 方法 |  |\n| :--- | :--- |\n| `public StringBuffer()`\
  \ | 默认构造函数预留了 16 个字符的空间，无需重新分配。 |\n| `public StringBuffer(int)` | 此构造函数接受一个整数参数，显式地设置缓冲区的大小。\
  \ |\n| `public StringBuffer(String)` | 此构造函数接受一个 `String` 参数，设置 `StringBuffer` 对象的初始内容，并预留额外\
  \ 16 个字符的空间，无需重新分配。 |\n| `public synchronized int length()` | 返回 `StringBuffer`\
  \ 的当前长度。 |\n| `public synchronized int capacity()` | 返回当前容量。容量是为新插入的字符提供的可用存储空间，超过该容量将发生内存分配。\
  \ |\n| `public synchronized void ensureCapacity(int)` | 确保容量至少等于指定的最小容量。如果我们想在 `StringBuffer`\
  \ 构造后为特定数量的字符预留空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。如果我们预先知道将向 `StringBuffer` 追加大量小字符串，这种方法非常有用。\
  \ |\n| `public synchronized void trimToSize()` | 这将移除额外的空闲空间。现在 `Capacity` 将等于 `length`。\
  \ |\n| `public synchronized void setLength(int newLength)` | 设置字符序列的长度。`newLength`\
  \ 必须是非负数。当我们增加缓冲区大小时，会在现有缓冲区末尾添加空字符。如果调用 `setLength()` 传入的值小于 `length()` 返回的当前值，则存储在新长度之外的字符将丢失。\
  \ |\n| `public synchronized char charAt(int index)` | 返回此序列中指定索引处的 `char` 值。 |\n\
  | `public synchronized void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将字符从此序列复制到目标字符数组 `dst`。第一个复制的字符位于索引 `srcBegin`；最后一个复制的字符位于索引 `srcEnd-1`。要复制的字符总数为\
  \ `srcEnd-srcBegin`。字符被复制到 `dst` 中从 `dstBegin` 开始的子数组中。注意：确保目标目标数组足够大以容纳这些字符。 |\n\
  | `public synchronized void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果\
  \ `index` 为负或大于等于 `length()`，则会发生 `IndexOutOfBoundsException`。 |\n| `public synchronized\
  \ StringBuffer append(Object)` | `append` 方法将任何其他类型数据的字符串表示追加到调用 `StringBuffer`\
  \ 对象的末尾。 |\n| `public synchronized StringBuffer delete(int start, int end)` | 删除从\
  \ `start` 到 `end-1` 的字符。 |\n| `public synchronized StringBuffer deleteCharAt(int\
  \ index)` | 删除指定位置的字符。 |\n| `public synchronized StringBuffer replace(int start,\
  \ int end, String str)` | 用指定 `str` 中的字符替换从 `start` 到 `end-1` 的字符。 |\n| `public\
  \ synchronized String substring(int)` | 返回一个新的 `String`，包含此字符序列中的字符子序列。该子字符串从指定的索引开始并延伸到此序列的结束。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，包含此字符序列中的字符子序列。该子字符串从指定的\
  \ `start` 开始并延伸到 `end-1` 处的字符。 |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将一个 `String` 插入另一个 `String`。它被重载以接受所有简单类型的值加 `Objects`。 |\n| `public\
  \ int indexOf(String)` | |\n| `public int indexOf(String, int)` | |\n| `public int\
  \ lastIndexOf(String)` | |\n| `public int lastIndexOf(String, int)` | |\n| `public\
  \ synchronized StringBuffer reverse()` | 反转 `StringBuffer` 的内容。 |\n\n### 示例 1.5\n\
  \n```java\nimport java.util.Scanner;\n\nclass SortStr {\n    public static void\
  \ main(String args[]) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"\
  Enter a string\");\n        StringBuffer sb1 = new StringBuffer(sc.next());\n  \
  \      //排序\n        for(int i=0; i<sb1.length()-1; i++)\n            for(int j=i+1;\
  \ j<sb1.length(); j++) {\n                if(sb1.charAt(i) > sb1.charAt(j)) {\n\
  \                    char t=sb1.charAt(i);\n                    sb1.CharAt(i,sb1.charAt(j));\n\
  \                    sb1.CharAt(j,t);\n                }\n            }\n      \
  \  System.out.println(sb1);\n    }\n}\n```\n**输出:** Enter a string SHIVAM -> **AHIMSV**\n\
