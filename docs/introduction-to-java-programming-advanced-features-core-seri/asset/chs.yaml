  \ ae)\n    {\n        int a,b,c;\n        float av;\n        a=Integer.parseInt(tf1.getText());\n\
  \        b=Integer.parseInt(tf2.getText());\n        if(ae.getSource() == b1)\n\
  \            tf3.setText(\"\" +(a+b));\n        else\n            tf3.setText(\"\
  \" +(a+b)/2);\n    }\n}\n```\n\n注意：一个组件可以关联多个监听器。无法保证监听器会按照它们被添加的顺序被通知。同样无法保证所有的监听器通知都会在同一个线程中发生，因此，监听器必须采取措施防止损坏共享数据。可以通过调用\
  \ `XXXListener()` 方法并传入要移除的监听器从组件的监听器列表中移除它。例如，从按钮移除监听器 `al`：`btn.removeActionListener(al);`。\n\
  \n### 处理窗口事件\n\n### 示例 18.5\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class A5\n{\n    public static void main(String args[])\n    {\n        Frame f=\
  \ new Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(300,300);\n\
  \        f.addWindowListener(new B( ));\n        f.setVisible(true);\n    }\n}\n\
  class B implements WindowListener\n{\n    public void windowOpened (WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Opened\");\n    }\n    public\
  \ void windowActivated(WindowEvent we)\n    {\n        System.out.println(\"Window\
  \ Activated\");\n    }\n    public void windowDeactivated(WindowEvent we)\n    {\n\
  \        System.out.println(\"window Deactivated\");\n    }\n    public void windowClosing(WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Closing\");\n        Frame f =\
  \ (Frame) we.getWindow( );\n        f.dispose();\n    }\n    public void windowClosed(WindowEvent\
  \ we)\n    {\n        System.out.println(\"Window Closed\");\n    }\n    public\
  \ void windowIconified(WindowEvent we)\n    {\n        System.out.println(\"Window\
  \ Iconified\");\n    }\n    public void windowDeiconified(WindowEvent we)\n    {\n\
  \        System.out.println(\"Window Deiconified\");\n    }\n}\n```\n\n## 适配器 (Adapters)\n\
  \n某些事件监听器接口包含多个方法。最大的接口 `WindowListener` 有七个方法。假设我们想要捕获 `windowClosing( )` 事件以便执行关闭窗口的代码。虽然我们在实现\
  \ `WindowListener` 的类中只需要 `windowClosing( )` 一个方法，但我们必须为所有方法提供空位实现。\n\n\n\n\n\n\
  `java.awt.event` 包提供了几个适配器类（adapter classes），每个类对应一个定义了多个方法的监听器接口。\n\n适配器仅仅一个通过提供“什么都不做”的方法来实现接口的类。例如，`WindowAdapter`\
  \ 类实现了 `WindowListener` 接口，并包含了七个空实现的方法。\n\n### 适配器类及其对应的接口\n\n| 适配器类 | 监听器接口 |\n\
  | :--- | :--- |\n| `ContainerAdapter` | `ContainerListener` |\n| `FocusAdapter`\
  \ | `FocusListener` |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter` | `MouseListener`\
  \ |\n| `MouseMotionAdapter` | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener`\
  \ |\n\n### 示例 18.6 WindowAdapter 类的使用。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class A6 {\n    public static void main(String args[]) {\n        Frame f = new\
  \ Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(300,300);\n\
  \        f.addWindowListener(new B( ));\n        f.setVisible(true);\n    }\n}\n\
  class B extends WindowAdapter {\n    public void windowClosing(WindowEvent we) {\n\
  \        System.out.print(\"Window Closing\");\n        Frame f = (Frame) we.getWindow();\n\
  \        f.dispose();\n    }\n}\n```\n\n### InputEvent 类\n\n这是所有组件输入事件的根事件类。输入事件在由源组件进行正常处理之前，会先投递给监听器。这允许监听器和子类“消费”事件，使得源组件不会以默认方式处理它们。例如，在\
  \ `Button` 组件上消费鼠标事件将防止 `Button` 被激活。\n\n### 方法\n- `void consume()`: 消费此事件，使其不会被源源组件以默认方式处理。\n\
  - `int getModifiers()`: 返回此事件的修饰掩码（Modifier mask）。\n- `int getModifiersEx()`: 返回此事件的扩展修饰掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回一个描述扩展修饰键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中是否按下了\
  \ Alt 修饰键。\n- `boolean isConsumed()`: 返回此事件是否已被消费。\n- `boolean isControlDown()`:\
  \ 返回此事件中是否按下了 Control 修饰键。\n- `boolean isShiftDown()`: 返回此事件中是否按下了 Shift 修饰键。\n\n\
  ### MouseEvent 类\n\n它是 `Input Event` 的子类。该事件表示组件中发生了鼠标操作。当且仅当鼠标指针位于组件或顶层窗口的未遮挡部分时，才认为鼠标操作发生在特定组件中。该事件既用于鼠标事件（点击、按下、释放），用于移动事件（移动和拖拽）。\n\
  \n### 方法\n- `int getButton()`: 返回哪个鼠标键发生了变化（如果有发生变化的话）。\n- `int getClickCount()`:\
  \ 返回与此事件相关的鼠标点击次数。\n- `static String getModifiersText(int modifiers)`: 返回一个描述事件发生期间按下的修饰键的字符串，例如“Shift”或“Ctrl\
  \ + shift”。\n- `point getPoint()`: 返回相对于源组件的事件 x, y 位置。\n- `int getX()`: 返回相对于源组件的事件水平\
  \ x 位置。\n- `int getY()`: 返回相对于源组件的事件垂直 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意**：弹出菜单在不同系统上的触发方式不同。因此，为了实现良好的跨平台功能，应该在 `mousePressed` 和 `mouseReleased`\
  \ 中都检查 `isPopupTrigger()`。\n\n### 处理鼠标事件：示例 18.7\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\nclass A7 {\n    public static void main(String args[])\
  \ {\n        Frame f = new Frame();\n        f.setLayout(new FlowLayout());\n  \
  \      f.setSize(300,30);\n        Button b1 = new Button(\"Push Me\");\n      \
  \  b1.addMouseListener(new B());\n        b1.addMouseMotionListener(new C());\n\
  \        b1.addActionListener(new D());\n        f.add(b1);\n        f.setVisible(true);\n\
  \    }\n}\nclass B implements MouseListener {\n    public void mouseEntered(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Entered...\");\n        System.out.println(me.getX());\n\
  \        System.out.println(me.getY());\n    }\n    public void mouseExited(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Exited...\");\n        Point p1=me.getPoint();\n\
  \        System.out.println(p1.x);\n        System.out.println(p1.y);\n    }\n \
  \   public void mousePressed(MouseEvent me) {\n        System.out.println(\"Mouse\
  \ pressed...\");\n        int ms = me.getModifiersEx();\n        String s = me.getModifiersExText(ms);\n\
  \        System.out.println(s);\n    }\n    public void mouseReleased(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Released...\");\n        System.out.println(\"\
  ClickCount-->\" + me.getClickCount());\n    }\n}\n```\n\n\n\n\n\n```java\npublic\
  \ void mouseClicked(MouseEvent me)\n{\n    System.out.println(\"Mouse Clicked...\"\
  );\n    System.out.println(\"Button-->\"+me.getButton());\n}\n\nclass C implements\
  \ MouseMotionListener\n{\n    public void mouseMoved(MouseEvent me)\n    {\n   \
  \     System.out.println(\"Mouse Moved...\");\n    }\n    public void mouseDragged(MouseEvent\
  \ me)\n    {\n        System.out.println(\"Mouse Dragged...\");\n    }\n}\n\nclass\
  \ D implements ActionListener\n{\n    public void actionPerformed(ActionEvent ae)\n\
  \    {\n        System.out.println(\"Button Pressed...\");\n    }\n}\n```\n\n###\
  \ ActionEvent 类\n这是一种语义化事件，表示组件发生了某个动作。这种高层事件是由组件（如 `Button`）在发生特定动作时（如被按下时）生成的。该事件会被传递给每个通过组件的\
  \ `addActionListener` 方法注册的接收此类事件的 `ActionListener`。实现 `ActionListener` 接口的对象在事件发生时会获取此事件。因此，监听器可以省去处理单个鼠标移动和点击的细节，而是可以处理诸如“按钮被按下”之类的“有意义”的事件。注意：要在\
  \ `Button` 上触发 `ActionEvent`，请使用空格键。\n\n### 方法\n- `String getAction()`：返回与动作相关的命令字符串。\n\
  - `int getModifiers()`：返回动作事件发生期间按下的修饰键。\n- `long getWhen()`：返回事件发生的时间戳。\n\n###\
  \ 示例 18.8\n此示例说明了我们如何在 `ActionEvent` 发生时识别有效的键修饰键。\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\npublic class KeyModifierDemo extends Frame implements\
  \ ActionListener\n{\n    Button b;\n    KeyModifierDemo()\n    {\n        b = new\
  \ Button(\"Button\");\n        b.addActionListener(this);\n        setLayout(new\
  \ FlowLayout());\n        add(b);\n        setBounds(0,0,20,20);\n        setVisible(true);\n\
  \    }\n    public static void main(String args[])\n    {\n        new KeyModifierDemo();\n\
  \    }\n    public void actionPerformed(ActionEvent ae)\n    {\n        System.out.println(\"\
  Button Pressed\");\n        int ms = ae.getModifiers();\n        if (ms & InputEvent.CTRL_DOWN_MASK)!=0)\n\
  \        {\n            System.out.println(\"CTRL key was pressed\");\n        }\n\
  \        if (ms & InputEvent.SHIFT_DOWN_MASK)!=0)\n        {\n            System.out.println(\"\
  Shift Key was pressed\");\n        }\n        if (ms & InputEvent.ALT_DOWN_MASK)!=0)\n\
  \        {\n            System.out.println(\"ALT key was pressed\");\n        }\n\
  \    }\n}\n```\n\n### 处理多个动作命令\nAction 事件是最简单的。当我们发现滚动条发送了调整事件时，显而易见的问题是“现在滚动条的值是多少？”当我们发现鼠标被点击时，自然会想：“鼠标的\
  \ x 坐标和 y 坐标是多少？”但当我们发现一个按钮发送了 `ActionEvent` 时，似乎并没有任何额外的信息需要寻找；按钮已经被点击了，这似乎就是全部的已知信息。\n\
  \n然而，`ActionEvent` 关联关联了一个额外信息。这条信息是一个字符串，被称为动作命令（Action command）。我们可以通过 `getActionCommand()`\
  \ 方法提取 `ActionEvent` 的动作命令。如果 `ActionEvent` 是文本字段发送的，`getActionCommand()` 返回文本字段当前的内容（当用户输入回车键时，文本字段会发送\
  \ `ActionEvent`）。如果 `ActionEvent` 是按钮发送的，默认行为是 `getActionCommand()` 返回按钮标签的字符串。然而，我们可以通过调用\
  \ `setActionCommand(String a)` 方法显式地设置按钮的动作命令。\n\n```java\nButton btn = new Button\
  \ (\"Hello\");\nbtn.setActionCommand (\"Hello\");\n```\n\n当按钮的 `ActionListener`\
  \ 需要决定如何对 `ActionEvent` 做出反应时，动作命令对按钮的优势是显而易见的。单个监听器作为多个组件的监听器是很常见的；在我们的语境中，单个对象可以是几个或多个按钮的\
  \ `ActionListener`。在这种情况下，对象的 `actionPerformed()` 方法必须通过判断是哪个按钮被命中来执行。以下示例演示了这一点：\n\
  \n### 示例 18.9\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonTest\n\
