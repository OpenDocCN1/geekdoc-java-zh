  \    tf3.setText(String.valueOf(c));\n        }\n    }\n}\n```\n\n# 第 17 章：抽象窗口工具包\
  \ - AWT\n\n## 引言\n\nJava 提供了大量的内置类，帮助我们设计图形用户界面（GUI）。这些类大部分属于 `java.awt` 包，统称为抽象窗口工具包（AWT）。\n\
  \n我们熟悉如 `MS-WORD`、`MS-EXCEL` 等软件。所有这些软件都有 GUI，即当我们运行这些软件时，可以看到图形用户界面。我们通过通过键盘或鼠标选择不同的选项来访问这些软件的各种功能。显示用户界面需要大量的编程工作。\n\
  \nAWT 中帮助设计图形用户界面的三个重要部分是：\n\n* 组件 (Components)\n* 容器 (Containers)\n* 布局管理器 (Layout\
  \ Managers)\n\n以上所有内容在设计 GUI 中都起着重要作用。\n\n## 组件\n\n组件是 Java 创建 GUI 的构建块。组件是一个具有图形表示的对象，可以显示在屏幕上并与用户交互。典型图形用户界面的组件示例包括按钮、复选框和滚动条。`java.awt.Component`\
  \ 类是非菜单相关 AWT 组件的抽象超类。组件类也可以直接扩展以创建轻量级组件。轻量级组件是不与原生不透明窗口相关的组件。\n\n某些组件类型（如按钮和滚动条）直接用于\
  \ GUI 控制。其他类型的组件（继承自 `Container` 类的组件）提供了特殊的组织方式。而 `TextField`、`TextArea`、`List`\
  \ 等组件用于接受用户输入。`label` 是不同类型的组件，其目的仅仅是显示相应的标签以识别其他组件。\n\nJava 组件通过 `java.awt.Component`\
  \ 和 `java.awt.Menu` 组件超类的许多子类来实现。组织这些大量类的一种方法是将它们分为以下几类：\n\n* 可视组件\n* 容器组件\n* 菜单组件\n\
  \n### 组件层次结构\n\n下图显示了 AWT 的组件层次结构。\n\n![](img/image01269.jpeg)\n\n## 容器\n\n下图描述了容器层次结构。\n\
  \n![](img/image01270.jpeg)\n\n所有基于窗口的应用程序都从屏幕上可见的顶层窗口开始。同样，所有基于 GUI 的 Java 程序也从顶层窗口开始，在\
  \ Java 术语中被称为顶层容器。\n\n也是包含其他组件的 Java 组件。只有通过将组件添加到容器或将其放入容器内部，组件才能变得可见。所有的 Java\
  \ GUI 都存在于 `applet` 或 `Frame` 中。applet 和 frame 是 Java 中的两个顶层容器。\n\n## 布局管理器\n\n\
  在将组件添加到容器时，一个重要问题是关于组件的位置和大小。组件的位置可以通过两种方式指定：\n\n### (i) 绝对定位\n\n在绝对定位中，我们指定组件应该添加的精确位置。这种方法为我们提供了精细的控制，如果我们只为某一个平台设计\
  \ GUI，这可能是最佳选择。\n\n### (ii) 相对定位\n\n另一种方法是相对定位，它可能不允许我们指定组件的精确位置，但在我们希望组件始终位于容器中间的情况下，它是合适的。\n\
  \n\n\n\n\n在 `java` 中，可以使用绝对定位，但并不建议这样做。`AWT` 设计初为了使用相对定位。我们可以通过相对规范来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到其他组件的下方、组件将出现在顶部、组件的大小将是容器宽度的\
  \ 1/4 等。即使在不知道组件尺寸的情况下，这些规范也有用。\n\nJava 鼓励相对定位，是因为它是平台无关的，相同的 GUI 应该可以在无需修改的情况下运行在各种平台上。\n\
  \n被称为布局管理器（layout managers）的内置 `java` 类处理将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\
  \n1. `FlowLayout`\n2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\
  \n### 使用布局管理器时的两个观察结果\n\n- 我们不必承担指定每个组件精确位置和尺寸的负担。\n- 我们不再再拥有指定每个组件精确位置和尺寸的权力。\n\
  \n### 为什么 Java 使用布局管理器？\n\n原因有两个：\n\n1. 理论上在于，精确布局（即以像素指定每个组件的尺寸和位置）是一项重复且经常执行的任务；因此，根据\
  \ OOP 的布局功能，布局应该被封装在一个或多个类中以自动化该任务。显然，布局管理器消除了大量的开发繁琐工作。许多程序员起初不喜欢布局管理器，但随着繁琐选择的消除，他们变得越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 `java` 的平台无关性。在 `java` 中，`AWT` 组件从运行 `JVM` 的底层硬件窗口系统中继承其行为。因此，在\
  \ Macintosh 上，`AWT` 按钮就像任何其他 Mac 按钮；在 motif 平台上，`java` 按钮看起来就像其他 motif 按钮，以此此类推。问题在于，按钮和其他组件在不同平台上实例化时具有不同的尺寸。如果\
  \ `java` 鼓励精确的像素级尺寸和定位，那么会有很多 `java` GUI 在其源平台上看起来很精美，但在其他平台上看起来很糟糕甚至无法使用。\n\n如上所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略\n\n每个 `java` 组件都有首选尺寸（preferred size）。首选尺寸表示在不与布局管理器冲突的情况下，组件希望有多大。首选尺寸通常是渲染组件以使其在视觉上具有意义的、所需的最小尺寸，例如，一个按钮的首选尺寸是其标签文本的大小，加上文本周围的一点空隙边框，再加上标记按钮边界的阴影装饰，因此按钮的首选尺寸是“恰好足够的”。首选尺寸是取决于平台的，因为组件的边界装饰会随系统而异。\n\
  \n当布局管理器对其容器的子组件进行布局时，它必须平衡两个考量：\n(i) 布局策略和\n(ii) 每个组件的首选尺寸\n\n首要任务是强制执行布局策略。如果尊重组件的首选尺寸意味着违反了布局策略，则布局管理器将覆盖组件的首选尺寸。理解布局管理器意味着理解它将把组件放在什么位置，以及它将如何处理组件的首选尺寸。\n\
  \n### 1. FlowLayout\n\n流式布局管理器的功能封装在 `java.awt.FlowLayout` 类中。\n\n流式布局管理器（Flow Layout）将组件按水平行排列。它是面板（panels）和应用程序（applets）的默认布局管理器类型。流式布局管理器尽可能将多个组件放入第一行，并将其他组件移动到第二行。如果第二行没有留空间，组件将移动到第三行，以此此类推。这与在文档中输入文字非常相似。\n\
  \n当我们到达当前行的末尾时，下一个单词将移动到下一行，以此此类推。如果我们更改了文档的宽度或高度，整个文档将重新进行格式化。组件始终从左到右，按照它们被添加到容器的顺序出现。\n\
  \n默认情况下，流式布局管理器在水平和垂直方向上组件之间留有五像素的间隙。此默认可以通过调用 `FlowLayout` 构造函数的重载版本并传入所需的水平和垂直间隙来更改。\n\
  \n在每一行内，组件是等距离分布的，组件簇是居中的。簇的对齐方式（有时称为“对齐”）可以通过向流式布局构造函数传递参数来控制。可能的值为\n- `FlowLayout.LEFT`\n\
  - `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n#### 示例 17.1\n\n```java\nimport java.awt.*;\n\
  class MyFrame1 {\n    public static void main(String args[ ]) {\n        Frame f=new\
  \ Frame( );\n        FlowLayout flow=new FlowLayout();\n        f.setLayout(flow);\n\
  \        Label l1 = new Label(\"Name \");\n        f.add(l1);\n        TextField\
  \ tf1=new TextField(\"Matrix\");\n        f.add(tf1);\n        tf1.setBackground(Color.green);\n\
  \        tf1.setForeground(Color.red);\n        Button b1 = new Button(\"ok\");\n\
  \        Font f1 = new Font(\"Arial\", Font.BOLD, 24);\n        b1.setFont(f1);\n\
  \        f.add(b1);\n        f.setSize(50,100);\n        f.setVisible(true);\n \
  \   }\n}\n```\n注意：如果我们减小上述窗口的大小且三个组件无法放入单行内，组件将移动到下一行，从最后一个组件开始。\n输出：Images/image27.jpeg\n\
  \n#### 示例 7.2\n\n```java\nimport java.awt.*;\nclass MyFrame2 extends Frame {\n \
  \   public static void main (String args [] ) {\n        MyFrame2 f=new MyFrame2();\n\
  \        f.setLayout(new FlowLayout(FlowLayout.CENTER));\n        System.out.println(f.paramString());\n\
  \        Label l1=new Label(\"Name :\");\n        f.add(l1);\n        TextField\
  \ tf1=new TextField(\"Sample Program\");\n        f.add(tf1);\n        tf1.setBackground(Color.GREEN);\n\
  \        tf1.setForeground(Color.RED);\n        Button b1=new Button(\"OK\");\n\
  \        b1.setFont(new Font(\"Serif\",Font.BOLD,24));\n        b1.setEnabled(false);\n\
  \        Dimension d = b1.getSize( );\n        System.out.println(\"Button Size\
  \ :\" + d.width + \" \" + d.height);\n    }\n}\n```\n\n\n\n\n```java\n// f.setResizable(false);\n\
  // f.setUndecorated(true);\nf.setVisible(true);\nDimension d1=b1.getSize( );\nSystem.out.println(\"\
  Button Size: \" + d1.width + \" \" + d1.height);\nDimension d2=f.getSize();\nSystem.out.println(\"\
