  \  }\n}\n```\n\n# 构造函数的调用顺序：:-\n\n\n\n\n\n# 类层次结构中的构造函数执行\n\n当创建一个类层次结构时，构成该层次结构的类的构造函数按什么顺序调用？答案是，在类层次结构中，构造函数按照派生顺序从父类到子类调用。\n\
  \n此外，由于 `super()` 必须是子类构造函数中执行的第一条语句；无论是否使用 `super()`，这种顺序都是相同的。如果不使用 `super()`，则将执行每个父类的默认或无参数的构造函数。\n\
  \n构造函数按照派生顺序执行。因为父类对任何子类一无所知，它需要执行的任何初始化都是独立的，并且可能是子类执行的任何初始化的前决条件。因此，它必须首先执行。\n\
  \n## `super` 关键字\n\n`super` 关键字在满足以下条件下可以使用：\n\n- `super()` 构造函数只能在子类的构造方法内部被调用。\n\
  - 对父类构造函数的调用必须作为子类构造函数中的第一条语句。\n- `super` 调用中的参数必须与父类构造函数的参数顺序和类型匹配。\n\n# 动态方法绑定\n\
  \n## 动态方法分发（运行时绑定）\n\n方法重写构成了 Java 强大概念之一的基础：动态方法分发是在运行时解析对被重写实例方法的调用的机制，而不是在编译时。动态方法分发非常重要，因为这是\
  \ Java 实现运行时多态的方式。\n\n父类引用变量可以指向子类对象。Java 利用这一事实在运行时解析对重写方法的调用。当通过父类引用调用重写方法时，Java\
  \ 会根据调用发生时所引用对象的类型来决定执行该方法的哪个版本。\n\n因此，这种确定是在运行时进行的，当引用到不同类型的对象时，将调用重写方法的不同版本。换句话说，是所引用对象的类型（而不是引用的类型）决定了将执行哪个版本的重写方法。\n\
  \n被重写的方法允许 Java 支持运行时多态。多态对于面向对象编程（OOP）来说至关重要，原因在于：它允许通用类指定所有派生类都共有的方法，同时允许父类定义这些方法中某些或全部方法的具体实现。\n\
  \n通过将继承与重写方法相结合，父类可以定义所有子类都将使用的方法的通用形式。现有代码库在不重新编译的情况下调用新类实例的方法，同时保持整洁的抽象接口的能力，是一项极其强大的工具。\n\
  \n基类引用可以接受子类引用，但子类引用不能接受基类引用。\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image0122.jpeg)\n\
