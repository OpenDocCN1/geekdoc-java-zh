  ```\n\n# 抽象类与抽象方法\n\n我们已经看到，通过将方法标记为 `final`，我们可以确保该方法不会在子类中被重定义。Java 允许我们做与此完全相反的事情。即我们可以指示某个方法必须在子类中重定义，从而使重写成为强制性。这是通过在方法定义中使用修饰符\
  \ `abstract` 实现的。\n\n在某些情况下，我们希望定义一个父类，它声明结构但不提供每个方法的完整实现。也就是说，有时我们想创建一个父类，定义一个由所有子类共享的通用形式，而让每个子类去填充细节。这种情况发生在父类无法创建有意义的实现时。要声明抽象方法，使用\
  \ `return_type name(parameter-list)`；任何包含一个或多个抽象方法的类也必须声明为抽象类。要声明一个类，只需在类前面使用 `abstract`\
  \ 关键字。抽象类不能有对象；也就是说，抽象类不能用 `new` 运算符实例化。这样的对象将毫无用，因为抽象类没有被完全定义。此外，我们不能声明抽象构造函数。抽象类的任何子类必须实现所有抽象方法，或者被声明为抽象类。\n\
  \n**示例 6.6：**\n\n```java\nabstract class Shape {\n    abstract void getdata();\n\
  \    abstract void area();\n    abstract void display();\n}\n\nclass Circle extends\
  \ Shape {\n    void getdata() {\n        System.out.println(\"getdata() of Circle\"\
  );\n    }\n}\n```\n\n\n\n\n\n```java\n    }\n\n    void display() {\n        System.out.println(\"\
  display() of Circle\");\n    }\n}\nclass Rectangle extends Shape {\n    void getdata()\
  \ {\n        System.out.println(\"getdata() of Rectangle\");\n    }\n    void area()\
  \ {\n        System.out.println(\"area() of Rectangle\");\n    }\n    void display()\
  \ {\n        System.out.println(\"display() of Rectangle\");\n    }\n}\nclass InheritTest6\
  \ {\n    public static void main(String args[]) {\n        //父引用变量接受子类对象\n     \
  \   //动态绑定\n        Shape s[]={new Circle(), new Rectangle()};\n        for(int\
  \ i=0;i<s.length;i++) {\n            s[i].getdata();\n            s[i].area();\n\
  \            s[i].display();\n        }\n    }\n}\n```\nOutput:\n```\ngetdata()\
  \ of Circle\narea() of Circle\ndisplay() of Circle\ngetdata() of Rectangle\narea()\
  \ of Rectangle\ndisplay() of Rectangle\n```\n\n#### Final 方法 (Final method)\n如果我们不希望某个方法被派生类重写，可以将基类定义为\
  \ `final`。任何尝试重写该方法的行为都会导致编译错误。\n\n```java\nclass A {\n    final void method1()\
  \ {\n        -----\n    }\n}\nclass B extends A {\n    void method1() // \n    \
  \    -----\n    }\n}\n```\n\n#### Final 类 (Final class)\n有时出于安全考虑，我们可能希望防止一个类被进一步子类。不能被子类的类被称为\
  \ final 类。在 Java 中通过使用 `final` 关键字来实现这一点：\n\n```java\nfinal class A1 {\n    -----\n\
  \    -----\n}\n```\n任何尝试继承 `A` 的行为都会导致错误，编译器将不允许。声明 `final` 类可以防止对该类进行意外的扩展。\n\n\
  #### 理论题 (Theory Questions)\n1. 什么是继承？\n2. Java 中共有多少种继承？\n3. 默认构造函数和参数化构造函数之间有什么区别？\n\
  4. `final` 类和 `final` 方法之间有什么区别？\n5. 什么是 `super` 类？\n6. 什么是抽象类？\n7. 编译时绑定和运行时绑定有什么区别？\n\
  8. 方法重载和方法重写有什么区别？\n\n#### 简介 - 面向对象编程对比过程化编程 (Introduction - Object oriented programming\
  \ vs/ procedural programming)\n所有程序由两个元素组成：过程（逻辑）和数据。根据主要关注的是处理还是数据，有两种不同的方法。过程化语言（`c`、`FORTRAN`、`PASCAL`、`COBOL`）关注处理部分，即它们更重视“发生了什么”（过程），而不太重视“谁受了影响”（数据）。\n\
  \n随着程序变得巨大且复杂，过程化方法变得越来越不适用。开发面向对象的语言是为了克服过程化编程语言的局限性。与过程化语言中的类似程序相比，面向对象的编程语言相对简单得多。面向对象的程序围绕数据（即对象）和一组定义良好的接口（方法）组织。\n\
  \nJava 基于面向对象范式。Java 几乎是纯面向对象的语言。我们使用“几乎”一词是因为出于性能考虑，Java 也支持基本数据类型。`C++` 并不是纯面向对象的语言。`C++`\
  \ 是 `C` 的扩展，因此它使用一种混合了面向过程方法和面向对象方法的方法。\n\n两种方法的基本区别总结如下：\n(i) 面向对象的程序是以数据为中心的，而用过程化语言编写的程序是以过程为中心的。\n\
  (ii) 面向对象的程序围绕数据（对象）组织，因此它们能更好地模拟现实世界的对象。\n(iii) 与过程化方法相比，面向对象方法的代码重用性和扩展性非常高。因此代码量更少。\n\
  (iv) 面向对象的程序更容易维护，因为它们相对简单且尺寸较小。\n(v) 面向对象的程序基于自底向上的设计方法，而过程化程序基于自顶向下的设计方法。\n\n\
  #### OOP（面向对象编程）的基本概念 (Basic concepts of OOP)\n以下提到了面向对象编程的一些基本元素：\n- 抽象 (Abstraction)\n\
  - 对象和类 (Objects and classes)\n- 三大 OOP 原：\n    - 封装 (Encapsulation)\n    - 继承 (Inheritance)\n\
  \    - 多态 (Polymorphism)\n- 持久化 (Persistence)\n- 泛型 (Genericity)\n- 组合 / 聚合 (Composition\
  \ / Aggregation)\n\n#### 1. 抽象 (Abstraction)\n抽象是包括过程化语言在内的任何编程语言的基本元素之一。内置数据类型的概念也是一种抽象。在\
  \ `C` 语言中使用 `struct` 定义自己的数据类型的特征进一步扩展了这种抽象。\n\n抽象的基本目的是通过隐藏细节来降低复杂性。例如，一座建筑不被认为是建筑材料的集合，而是一个具有独特特征和属性的定义良好的对象。抽象可以定义为识别对象的本质属性和行为的行为，而不涉及细节。对象的属性和行为使其与其他相似类型的对象区分开来，并有助于对对象分类/分组。面向对象的编程语言使用类和对象来建模抽象。\n\
  \n#### 2. 对象和类 (Object and Classes)\n**对象 (Object)**：对象是一个物理或抽象的实体或事物，可以与其他相似类型的对象区分来。对象具有三个特征：\n\
  (i) 标识性。\n(ii) 属性（特征）。\n(iii) 行为（方法 / 操作 / 函数）。\n对象也可以被看作 `class` 的实例，其中 `class`\
  \ 类似于内置数据类型，而 `object` 是变量。\n\n**类 (Class)**：类通过抽象其属性和行为来表示一类对象。`class` 可以被看作创建对象的蓝图。对象具有由其\
  \ `class` 定义的属性和行为。`class` 可以看作用户自定义的数据类型，而 `object` 是 `class` 所代表的数据类型的变量/实例。\n\
  \n\n\n\n\n类（Class）也可以被认为是一种用户定义的数据类型，而对象（Object）是该数据类型的变量。一旦定义了类，我们就可以创建任意属于该类的对象。\n\
  \n## 3. 三大 OOP 原则\n\n### 封装\n封装（Encapsulation）代码及其所操作的数据绑定在一起的机制。Java 类支持这一点，因为它们允许我们将代码和数据定义在一起。封装还通过将某些类成员声明为\
  \ `private` 来帮助实现数据隐藏，使得这些成员无法被类之外的代码访问。\n\n### 继承\n在面向对象编程中，继承（Inheritance）指的是一个类的属性提供给其他子类或派生类。子类或派生类是派自现有类的类。它继承了现有类的所有特征，现有类也被称为基类（base-class）或超类。因此，继承可以定义为从超类或基类派生类的过程。继承类不会给基类/超类引入任何更改。与基类相比，派生类/子类具有更多的属性和行为。\n\
  \n继承的主要优势是代码重用。如果基类已经使用了长时间，并且需要添加一些额外的属性和方法，我们可以通过派生另一个类来实现。派生类将能够使用基类的代码而无需调试，因为它已经运行了很久。\n\
  \n#### 类层次结构\n所有派生自共同基类的类都属于一个家族并形成类层次结构。类层次结构可以与树形结构相比，其中一个基类位于根节点且没有超类。\n\n所有其他类要么派生自层次结构根节点类，要么派生自某些直接或间接派生自根类的类。随着我们在树向下移动，添加的功能越来越多。由叶子节点表示的类没有任何子类。以下示例显示了一些类层次结构。\n\
  \n![](img/image01229.jpeg)\n\n### 多态\n多态（Polymorphism）是一种允许用同一接口用于通用动作的特性。大多数面向对象的语言在以下情况使用多态：\n\
  - 运算符重载（Operator Overloading）。\n- 方法重载（Method Overloading）。\n- 方法重写（Method Overriding）。\n\
  \n#### 运算符重载\n大多数语言使用这种形式的多态用于内置操作。例如，C/C++ 或 Java 中所有的算术运算符都可以用于许多类型的操作数（`int`、`long`、`float`、`double`\
  \ 等）。因此，相同的加法运算符既可以加两个整数，也可以加两个浮点数。\n\nC++ 允许用户重载内置运算符。例如，我们可以重载算术运算符来处理复数。虽然 Java\
  \ 对内置运算符使用了运算符重载，但它不允许用户重载运算符。\n\n#### 方法重载\n这一特性允许我们编写多个具有相同名称的方法。C++ 和 Java 都具有这一特性。同名的方法（C++\
  \ 中称为 `function`）根据参数（参数）进行区分。重载的方法必须具有不同数量的参数，或者如果参数数量相同，则参数类型必须不同。\n\n如果对重载方法的调用可以在编译时解析，即如果编译器可以决定调用哪一个重载方法，则称为静态绑定（static\
  \ binding），这是编译时多态的示例。\n\n如果对重载方法的调用无法在编译时解析，即如果编译器无法决定调用哪一个重载方法，则称为动态绑定（dynamic\
  \ binding），这是运行时多态的示例。\n\n通常，Java 在运行时解析对重载方法的调用，但在许多情况下，对重载方法的调用是在编译时解析的。\n\n####\
  \ 方法重写\n子类可以定义一个与父类中同名的方法，且参数的数量和类型也相同。这被称为方法重写（method overriding）。\n\n编译器无法解析对重写方法的调用。Java\
  \ 通常使用动态绑定来解析对重写方法的调用，即发生在发生在。\n\n## 4. 持久化\n某些面向对象的语言允许我们从/到持久存储介质存储/检索程序的状态，例如次级存储等永久存储介质。这被称为持久化（Persistence）。\n\
  \nJava 允许我们在次级存储中存储任何对象并在稍后检索它。如果我们尝试在对象图的顶端存储对象，所有其他引用的对象将被递归地定位并保存。同样，当以后检索该对象时，所有对象及其引用（即整个对象图）都会主内存中正确创建。\n\
  \n例如，可以通过保存树的根来保存整个树形结构。在后续阶段，可以通过保存树的根在内存中重建整个树形结构。C++ 不支持这一特性。\n\n## 5. 泛型\n这种定义一次算法（独立于任何特定数据类型）并然后将该算法应用于各种数据类型而无需任何额外努力的概念被称为泛型（Genericity）。C++\
  \ 使用模板（templates）支持这一特性。Java 也通过 `Object` 类支持这一特性，该类位于 Java 中任何类层次结构的顶端。\n\n例如，使用这一特性，我们可以实现一个泛型数据类型\
  \ `stack`，以便在栈中存储任何类型的元素。这一特性在很大程度上提高了重用性。\n\n## 6. 组合 / 聚合\n一个对象可能由其他对象组成。这样的对象被称为组合（Composite）或聚合（Aggregate）对象。例如，如果\
  \ `vehicle` 类的对象定义为由 `Engine`、`Body`、`Axle`、`Seats` 等对象组成的组合对象是合适的。\n\n### 继承与组合\n\
  从现有类派生新类的基本机制有两种：继承和组合。`Bus` 类可以通过继承 `vehicle` 类的属性来派生。这里 `Bus` 是车辆的一种，除了所有车辆共属性外，它还有额外的属性。\n\
  \n也就是说，`Bus` 类与 `vehicle` 类之间存在“是一个”的关系，因为我们可以说 `Bus` 是一种车辆。\n\n`vehicle` 类本身可能通过组合从许多其他类派生。例如，一个\
  \ `vehicle` 类的对象可能由属于 `Engine`、`Gear Box`、`Seats`、`Driver’s Seat Body` 和 `Steering\
  \ Wheel` 等类的对象组成。\n\n在这种情况下，派生类与代表组合对象部分的类之间存在整体与部分的关系。我们不能说 `vehicle` 是一个 `Engine`\
  \ 或 `Vehicle` 是一个 `Gear Box`。\n\n# 超类与子类\n通常，一个类的对象也是另一个类的对象。矩形显然是四边形（正方形、平行四边形和梯形也是如此）。因此，可以说\
  \ `Rectangle` 类继承自 `Quadrilateral` 类。在这种背景下，`Quadrilateral` 类是超类，`Rectangle` 类是子类。矩形是四边形的一种特定类型，但声称四边形是矩形是不错误的（四边形可能是平行四边形）。图显示了几个超类和潜在子类的简单继承示例。\n\
  \n\n\n\n\n## 继承概览\n\n然而，对这些术语还有另一种视角，它是完全合理的。因为每个子类对象“都是”其父类的对象，而且由于一个父类可以有多个子类，所以父类代表的对象的集合通常大于该父类的任何子类所代表的对象的集合。\n\
  \n例如，父类 `Vehicle` 以通用的方式表示所有车辆，如汽车、卡车、船只、自行车等。然而，子类 `Car` 只代表了世界上所有 `Vehicles` 中的一小部分。继承关系形成了类树的层级结构。\n\
  \n父类与其子类之间存在层级关系。一个类完全可以独立存在，但只有当一个类配合继承机制使用时，它才会变成向其他类提供属性和行为的父类，或者是继承这些属性和行为的子类。通常，一个类既是子类也是父类。\n\
  \n| 父类 | 子类 |\n| :--- | :--- |\n| Student | 研究生、本科生 |\n| Shape | 圆形、三角形、矩形 |\n|\
  \ Loan | 汽车贷款、住房贷款、教育贷款 |\n| Employee | 教职员工、行政员工 |\n| Account | 支票账户、储蓄账户 |\n\n\
