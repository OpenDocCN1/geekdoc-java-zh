  java DispClassMembers2 String\n```\n\n## 4. String 的 toString()\n\n如果子类没有重写此方法，它将返回对象的文本表示，其格式如下：\n\
  `<类名>@<对象的哈希码值>`\n\n该方法通常会被重写并用于调试。方法调用 `System.out.println(Objref)` 会隐式地使用 `toString()`\
  \ 方法将其参数转换为文本表示。\n\n### 示例 20.3\n\n此示例演示了当我们尝试显示 `Box` 类对象时会显示什么。对象使用 `object` 类的\
  \ `toString` 方法转换为文本表示。\n\n```java\nclass Box {\n    double w,h,d;\n    Box(double\
  \ w, double h, double d) {\n        this.w=w;\n        this.h=h;\n        this.d=d;\n\
  \    }\n}\nclass ToString1 {\n    public static void main(String args[]) {\n   \
  \     Box b= new Box(10,12,4);\n        String s=\"Box:\"+b;\n        System.out.println(b);\n\
  \        System.out.println(s);\n    }\n}\n```\n\n**输出：**\n```\nBox1@82b41\nBox1:\
  \ Box1@82b41\n```\n\n### 示例 20.4\n\n此示例演示了如果我们在 `Box` 类中重写了 `toString()` 方法，那么将使用重写后的方法将对象转换为文本表示。\n\
  \n```java\nclass Box {\n    double w,h,d;\n    Box(double w, double h, double d)\
  \ {\n        this.w=w;\n        this.h=h;\n        this.d=d;\n    }\n    public\
  \ String toString() {\n        return \"Dimensions are \"+ w+ \" by \"+ h+ \" by\
  \ \"+ d+\".\";\n    }\n}\nclass ToStringDemo2 {\n    public static void main(String\
  \ args[]) {\n        Box b= new Box(8,11,13);\n        String s=\"Box b:\" + b;\
  \ // 拼接 box 对象并调用 toString() 方法\n        System.out.println(b); // 调用 toString()\
  \ 方法\n        System.out.println(s);\n    }\n}\n```\n\n**输出：**\n```\nDimensions\
  \ are 8.0 by 11.0 by 13.0.\nBox b: Dimensions are 8.0 by 11.0 by 13.0.\n```\n\n\
  ## 5. `protected void finalize() throws Throwable`\n\n它在对象被垃圾回收之前被调用，以便进行任何清理工作。然而，`object`\
  \ 类中的默认 `finalize()` 方法没有做任何有用的工作。这对于释放非 Java 资源可能有用，但不推荐。如果可用内存足够，`finalize()`\
  \ 方法可能永远不会被调用，在这种情况下资源可能永远不会释放。\n\n## 6. `protected Object clone() throws CloneNotSupportedException`\n\
  \n通过 `clone()` 方法可以创建与当前对象完全相同（即具有相同状态）的新对象，即基本类型值和引用值被复制，这被称为浅克隆。\n\n类可以重写 `clone()`\
  \ 方法以提供其自己的克隆概念。例如，通过递归克隆组成对象来克隆复合对象被称为深克隆。\n\n如果重写 `clone()` 方法依赖于 `Object` 类中的\
  \ `clone()` 方法，则子类必须实现 `cloneable` 标记接口，以指示其对象可以安全地克隆。否则，`Object` 类中的 `clone()`\
  \ 方法将抛出检查异常 `CloneNotSupportedException`。\n\n### 使用 `clone()` 和 Cloneable 接口\n\n\
  `clone()` 方法生成被调用对象的的一个一个副本。以下是关于 `clone()` 方法的一些重要事实：\n\n- 实现了 `Cloneable` 接口的类才能被克隆。`Cloneable`\
  \ 接口没有定义成员。它用于指示类允许对对象进行位拷贝（即克隆）。\n- 如果你尝试对未实现 `cloneable` 接口的对象调用 `clone()`，则会抛出\
  \ `CloneNotSupportedException`。\n- `cloneable` 接口是一个空接口。这种接口被称为标记/标签接口。在创建克隆时，被克隆对象的构造函数不会被调用。\n\
  - 克隆仅仅是原始对象的完全复制。克隆是一种潜在的危险操作，因为它会导致意外的副作用。\n- 例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆时，克隆中的\
  \ `objRef` 将与原始对象中的 `objRef` 指向同一个对象。如果克隆更改了 `objRef` 所向对象的内容，原始对象也会随之改变。\n\n###\
  \ 示例 20.5\n\n以下示例演示了 `clone()` 方法的使用。`CloneDemo1` 类通过间接通过 `clone2()` 方法调用 `clone()`\
  \ 方法，为 `TestClone1` 类的对象创建克隆。\n\n\n\n\n\n```java\nclass TestClone1 implements Cloneable\
  \ {\n    int a;\n    float b;\n    public TestClone1 clone2() throws CloneNotSupportedException\
  \ {\n        return (TestClone1) clone();\n    }\n}\n\nclass CloneDemo1 {\n    public\
  \ static void main(String a[]) throws CloneNotSupportedException {\n        TestClone1\
  \ tc1 = new TestClone1();\n        TestClone1 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n\
  \        tc2 = tc1.clone2();\n        System.out.println(tc2.a);\n        System.out.println(tc2.b);\n\
  \    }\n}\n```\n输出:\n8\n4.5\n\n在这里，`clone2()` 方法调用了 `Object` 类的 `clone()` 并返回结果。注意，`clone()`\
  \ 返回的对象必须强制转换为其适当类型，即 `TestClone1`。\n\n### 示例 2.6：在下面的示例中，重写了 `clone()` 方法，以便可以在类外部进行调用。为了做到这一点，访问修饰符必须是\
  \ `public`。\n\n```java\nclass TestClone2 implements Cloneable {\n    int a;\n  \
  \  float b;\n    public Object clone() throws CloneNotSupportedException {\n   \
  \     return super.clone();\n    }\n}\n\nclass CloneDemo2 {\n    public static void\
  \ main(String args[]) throws CloneNotSupportedException {\n        TestClone2 tc1\
  \ = new TestClone2();\n        TestClone2 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n\
  \        tc2 = (TestClone2) tc1.clone();\n        System.out.println(tc2.a + \"\
  \ , \" + tc2.b);\n    }\n}\n```\n输出: 8 , 4.5\n\n### 示例 2.7：在下面的示例中，重写了 `clone()`\
  \ 方法，使其不使用 `Object` 类的 `clone()` 方法。我们正在编写自己的 `clone()` 方法。\n\n```java\nclass TestClone3\
  \ {\n    int a;\n    float b;\n    public Object clone() {\n        TestClone3 tc\
  \ = new TestClone3();\n        tc.a = a;\n        tc.b = b;\n        return tc;\n\
  \    }\n}\n\nclass CloneDemo3 {\n    public static void main(String args[]) {\n\
  \        TestClone3 tc1 = new TestClone3();\n        TestClone3 tc2;\n        tc1.a\
  \ = 8;\n        tc1.b = 4.5f;\n        tc2 = (TestClone3) tc1.clone();\n       \
  \ System.out.println(tc2.a + \" \" + tc2.b);\n    }\n}\n```\n输出: 8 , 4.5\n\n###\
  \ 克隆的副作用\n注意：如果实现自己的 `clone()` 方法，则不需要声明 `CloneSupportedException`，但需要实现 `Cloneable`。克隆引起的副作用起初很难发现。人们很容易认为一个类可以安全克隆，而实际上并非如此。通常情况下，如果没有充分理由，你不应该为任何类实现\
  \ `Cloneable`。\n\n### 示例 2.8：此示例演示了克隆的副作用。\n\n```java\nclass TestShallow implements\
  \ Cloneable {\n    int a;\n    float b;\n    int c[];\n    public Object clone()\
