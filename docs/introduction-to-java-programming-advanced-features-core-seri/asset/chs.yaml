  \ | 创建一个输出流写入指定命名的文件。 |\n| `public FileOutputStream(String, boolean) throws java.io.FileNotFoundException`\
  \ | 创建一个输出流写入指定命名的文件。 |\n| `public FileOutputStream(File) throws FileNotFoundException`\
  \ | 创建一个输出流写入由 `File` 对象表示的文件。 |\n| `public FileOutputStream(File, boolean) throws\
  \ FileNotFoundException` | 创建一个输出流写入由 `File` 对象表示的文件。 |\n| `public native void write(int)\
  \ throws java.io.IOException` | |\n| `public void write(byte[]) throws java.io.IOException`\
  \ | |\n| `public void write(byte[], int int) throws java.io.IOException` | |\n|\
  \ `public void close() throws java.io.IOException` | |\n\n#### Example 5.2\n```java\n\
