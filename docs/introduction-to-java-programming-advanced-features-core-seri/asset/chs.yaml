  22. 列出 C 和 Java 之间的 10 个主要区别。\n23. 描述一个 Java 程序的结构。\n\n## 编程练习\n\n1. 编写程序计算两个整数的平均值。\n\
  2. 编写程序在不使用第三个变量的情况下交换两个数字的值。\n3. 编写程序将小时、分钟和秒转换为总秒数。\n4. 编写程序计算给定圆的面积和周长。\n\n#\
  \ Java 语言\n\n### 标记\n\n最小的独立单位被称为标记，包括 `keywords`（关键字）、`identifiers`（标识符）、`strings`（字符串）和\
  \ `Operators`（运算符）。\n\nA. `Keywords`（关键字）是语言的保留名称，不能用作变量名等。\nB. `Identifier`（标识符）指变量、`arrays`（数组）、`classes`（类）等的名称。\n\
  C. `Constants/Literals`（常量/字面量）指程序无法更改的值。\nD. `Operators`（运算符）是作用于变量和常量的特殊符号，形成\
  \ `expression`（表达式）。\nE. `Separators`（分隔符）是用于分隔语句的特殊字符，如 `()` `{}` `[]` `;` `,`。\n\
  \n**关键字-**\n```\nabstract, assert, boolean, break, byte, catch, char, class, continue,\
  \ default, do, do, double, else, extends, final, finally, float, import, implements,\
  \ instanceof, int, interface, native, package, private, public, return, short, static,\
  \ super, synchronized, this, throws, transient, void, volatile\n```\n\n\n\n\nJava\
  \ 提供了丰富的运算符集合。运算符将常量、变量和子表达式组合成表达式。Java 中的大多数运算符的行为与 C/C++ 相似，但存在少数差异，本文将介绍这些差异。\n\
  \n运算符可以分类为以下几类：\n\n### 算术运算符 (`+`, `-`, `*`, `/`, `%`)\n\n- 这些运算符与 C/C++ 中的相同。\n\
  - `%` 运算符也可以用于浮点数。\n- 当二元运算符应用于两个不同类型的操作数时，在求值之前，低类型的操作数会被转换为高类型，结果的类型将与高类型操作数的类型相同。\n\
  - 对于 `int` 类型，除以零或取模零会导致 `ArithmeticException`（运行时错误），但对于浮点数则不会。\n- 当我们对 `int` 应用算术运算符且结果超出了\
  \ `int` 的范围时，额外的高位位将被截断，这个新值将赋值给接收结果的变量；但在浮点类型中，溢出将导致 `Infinity` 或 `-Infinity`，而下溢将导致为\
  \ `0`。\n\n### 递增与递减运算符 (`++`, `--`)\n\n这些运算符与 C/C++ 中的相同。\n\n```java\nint a=5,b;\n\
  b = ++a*++a;\nSystem.out.print(b); //42\na = 5;\nSystem.out.print(++a*++a); //42\n\
  ```\n\n### 关系运算符 (`<`, `>`, `<=`, `>=`, `instanceof`)\n\n这些运算符与 C/C++ 相同，但 `<`、`<=`、`>`、`>=`\
  \ 不能应用于布尔类型和引用类型。\n\n### instanceof 运算符\n\n`instanceof` 运算符用于测试对象的类型。`instanceof`\
  \ 运算符的通用形式为：\n\n```javaif(object instanceof type)\n```\n\n在这里，`object` 是类的实例，`type`\
  \ 是一个类类型。如果 `object` 是指定类型的实例或该指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则其结果为 `false`。\n\
  \n### 赋值运算符 (`=`, `+=`, `-=`, `*=`, `/=`, `%=`)\n\n这些运算符与 C/C++ 中的相同。\n\n### 相等运算符\
  \ (`==`, `!=`)\n\n这些运算符与 C/C++ 中的相同。\n\n### 逻辑运算符 (`&&`, `||`, `!`)\n\n这些运算符与 C/C++\
  \ 中的相同。\n\n### 三元运算符 (`? :`)\n\n该运算符与 C/C++ 中的相同。\n\n### 位运算运算符 (`&`, `|`, `^`,\
  \ `~`, `<<`, `>>`, `>>>`)\n\n这些运算符与 C/C++ 相同，位移运算符除外。位移运算符仅作用于整数类型。\n\n#### 左移 (`<<`)\
  \ 运算符\n\n要获得 `<<` 运算符的结果，左侧操作数中的位将根据右侧操作数的指定向左移动，右侧的空位将用 零填充。左移 1 位等于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左侧位，而该位可能会从\
  \ 0 变为 1 或从 1 变为 0，从而导致符号改变。\n\n示例 `b = a << 2;` 要获得 `b` 的值，将 `a` 中的位向左移动 2 位，并用\
  \ 0 填充右侧 2 位。\n\n#### 右移 (`>>`) 运算符（带符号）\n\n要获得 `>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，左侧的空位将用符号位填充。右移\
  \ 1 位等于除以 2。该运算符永远不会改变结果的符号，即它与左侧操作数的符号相同。\n\n示例 `b = a >> 2;` 要获得 `b` 的值，将 `a`\
  \ 中的位向右移动 2 位，并用符号填充右侧 2 位（如果 `a` 为正则填充 0，如果 `a` 为负则填充 1）。\n\n#### 零填充右移 (`>>>`)\
  \ 运算符（无符号）\n\n要获得 `>>>` 运算符的结果，左侧操作数的位将根据右侧操作数的指定向右移动，左侧的空位将用 0 填充。右移 1 位等于除以 2。如果发生了位移，结果将始终为正数，因为最右侧位将变为\
  \ 0。\n\n示例 `b = a >>> 2;` 要获得 `b` 的值，将 `a` 中的位向右移动 2 位，并用 0 填充右侧 2 位。\n\n![black_star_logo](img/image0127.jpeg)\n\
  ![black_star_logo](img/image0127.jpeg)\n![black_star_logo](img/image0127.jpeg)\n\
  \n#### 运算符优先级\n\n| 级别 | 运算符 | 关联性 |\n| :--- | :--- | :--- |\n| 1 | `()`, `[]` |\
  \ 函数调用、下标、从左到右 |\n| 2 | `++`, `--`, `~`, `!` | 递增、递减、位取反、逻辑非、从右到左 |\n| 3 | `*`,\
  \ `/`, `%` | 乘法、除法、取模、从左到右 |\n| 4 | `+`, `-` | 加法、减法、从左到右 |\n| 5 | `>>>`, `>>`,\
  \ `<<` | 无符号右移、带符号右移、左移 |\n| 6 | `>=`, `instanceof` | 大于等于、实例检查 |\n| 7 | `==`, `!=`\
