  \ = 4.5;\nint c[] = new int[4];\nfor(int i=0; i<4; i++)\n    c[i] = i;\ntc1.c =\
  \ c;\nfor(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”+ i +”]=” + tc1.c[i]);\n\
  tc2 = (TestDeepClone) tc1.clone();\nSystem.out.println(“tc2.a”+tc2.a);\nSystem.out.println(“tc2.b”+tc2.b);\n\
  for(int i=0; i<4; i++)\n    System.out.println(“tc2.c[” + i + “]=” + tc2.c[i]);\n\
  for(int i=0; i<4; i++)\n    tc2.c[i] = i+4;\nfor(int i=0; i<4; i++)\n    System.out.println(“tc2.c[”\
  \ + i + “]=” + tc2.c[i]);\nfor(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”\
  \ + i + “]=” + tc1.c[i]);\n```\n\n输出：\ntc1.c[0]=0\ntc1.c[1]=1\ntc1.c[2]=2\ntc1.c[3]=3\n\
  tc2.a=8\ntc2.b=4.5\ntc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\ntc2.c[0]=4\n\
  tc2.c[1]=5\ntc2.c[2]=6\ntc2.c[3]=7\ntc1.c[0]=0\ntc1.c[1]=1\n\n### 在多线程环境下有方法\n\n\
  除了上述讨论的方法外，`object` 类通过以下方法在同步代码中提供线程通信支持：使当前线程等待，直到另一个线程调用此对象的 `notify()` 方法或 `notifyAll()`\
  \ 方法。\n\n8. `final void wait(long timeout) throws InterruptedException`\n\n9. `final\
  \ void wait(long timeout, long nanos) throws InterruptedException`\n使当前线程等待，直到另一个线程调用此对象的\
  \ `notify()` 方法或 `notifyAll()` 方法，或者其他线程中断了当前线程，或者指定的时间已过。\n\n10. `final void notify()`\n\
  唤醒一个在该对象监视器上等待的线程。\n\n11. `final void notifyAll()`\n唤醒所有在该对象监视器上等待的线程。线程通过调用其中一个\
  \ `wait` 方法在对象的监视器上等待。线程在它持有的锁对象上调用这些方法。线程等待另一个线程的通知。\n\n# 集合框架 (Collection Framework)\n\
  \n## 简介\n\nJava 集合框架标准化了程序处理对象组的方式。在 Java2 之前，Java 提供了如 `Vector`、`Stack`、`Dictionary`、`Hashtable`\
  \ 和 `Properties` 等临时类来存储和操作对象组。\n\n尽管这些类非常有用，但它们缺乏一个中央的统一主题。我们使用 `Vector` 的方式与使用\
  \ `properties` 类的方式不同，而且之前的临时方法并非设计为易于扩展或适应。集合框架是对这些（以及其他）问题的答案。\n\n#### 目标\n\n\
  Java 集合框架的设计具有以下几个目标：\n\n*   框架必须是高性能的。\n*   框架必须允许不同类型的集合。\n*   框架必须是可扩展或可适应的。\n\
  *   框架提供了高度的互操作性。\n\n为了实现这些目标，框架定义了以下特性：\n\n*   标准接口。\n*   高效的实现（动态数组、链表、树、哈希表）。\n\
  *   迭代器 (Iterator)。\n\n#### 集合接口\n\n框架定义了多个接口。具体类仅提供不同的实现。支撑集合的接口是：\n\n*   `Collection`：允许你处理对象组；它位于集合层次结构的顶端。\n\
  *   `List`：扩展集合以处理序列（对象列表）。\n*   `Set`：扩展集合以处理集合，集合必须包含唯一元素。\n*   `SortedSet`：扩展集合以处理排序集合。\n\
  \n除了集合接口，集合还使用了 `Comparator`、`Iterator` 和 `RandomAccess` 接口。`Comparator` 定义了两个对象如何比较；`Iterator`\
  \ 和 `ListIterator` 枚举集合中的对象。通过实现 `RandomAccess`，列表表示它支持对其元素进行高效的随机访问。\n\n#### Iterator\
  \ 接口\n\n`Iterator` 接口定义了以下方法：\n\n*   `boolean hasNext()`：如果迭代还有更多元素，则返回 true。\n\
  *   `Object next()`：返回迭代中的下一个元素。\n*   `void remove()`：从底层集合中移除迭代器返回的上一个元素。这是一个可选操作，因此如果迭代器不支持此操作，可能会抛出\
  \ `UnsupportedOperationException`。\n\n\n\n\n它是列表的迭代器，允许程序员以正反两个方向遍历列表，在迭代过程中修改列表，并获取迭代器在列表中的当前位置。\n\
  \n### 方法总结\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void add(Object obj)` | 将指定的元素插入列表中（可选操作）。\
  \ |\n| `boolean hasNext()` | 如果在正向遍历列表时此列表迭代器还有更多元素，则返回 true。 |\n| `boolean hasPrevious()`\
  \ | 如果在反向遍历列表时此列表迭代器还有更多元素，则返回 true。 |\n| `Object next()` | 返回列表中的下一个元素。 |\n| `int\
  \ nextIndex()` | 返回后续调用 `next` 将返回的元素的索引。 |\n| `Object previous()` | 返回列表中的上一个元素。\
  \ |\n| `int previousIndex()` | 返回后续调用 `previous` 将返回的元素的索引。 |\n| `void remove()`\
  \ | 从列表中删除上一个由 `next` 或 `previous` 返回的元素（可选操作）。 |\n| `void set(Object obj)` | 用\
  \ `next` 或 `previous` 返回的最后一个元素替换为指定的元素（可选操作）。 |\n\n### RandomAccess 接口\n\n这是一个由\
  \ `List` 实现类使用的标记接口，用于指示它们支持随机访问。`ArrayList` 和 `Vector` 实现了此接口。\n\n### Comparator\
  \ 接口\n\n比较器用于控制某些数据结构（如 `TreeSet` 或 `TreeMap`）的顺序。\n\n### 方法\n\n| 返回值 | 描述 |\n|\
  \ :--- | :--- |\n| `Int compare(Object o1,Object o2)` | 比较两个参数的顺序。 |\n| `Boolean\
  \ equal(Object obj)` | 表明某个其他对象是否“等于”此 `Comparator`。 |\n\n### Collection 接口\n\n\
  集合接口是构建集合框架的基础。它声明了所有集合都将具有的核心方法。由于所有集合都实现了 `collection interface`，因此熟悉它的方法对于清晰理解该框架是必要的。某些方法可能会抛出\
  \ `UnsupportedOperationException`。当一个对象与另一个对象不兼容时（例如尝试向集合中添加不兼容的对象时），会生成 `ClassCastException`。\n\
  \n#### Collection 接口中的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean add(Object\
  \ obj)` | 确保此集合包含指定的元素（可选操作）。将对象添加到调用者的集合中。如果元素 `obj` 已添加到集合中，则返回 true。如果元素 `obj`\
  \ 是集合的成员且集合不允许重复，则返回 false。 |\n| `boolean addAll(Collection c)` | 将指定集合中的所有元素添加到此集合中（可选操作）。\
  \ |\n| `void clear()` | 从此集合中移除所有元素（可选操作）。 |\n| `boolean contain(Object o)` | 如果此集合包含指定的元素，则返回\
  \ true。 |\n| `boolean containAll(Collection c)` | 如果此集合包含指定集合中的所有元素，则返回 true。 |\n\
  | `boolean equal(Object o)` | 将指定的对象与此集合进行等性比较。 |\n| `int hashCode()` | 返回此集合的哈希值。\
  \ |\n| `boolean isEmpty()` | 如果此集合不包含任何元素，则返回 true。 |\n| `Iterator iterator()` |\
  \ 返回一个用于此集合元素的迭代器。 |\n| `boolean remove(Object o)` | 如果指定的元素存在，则从集合中移除该元素的单个实例（可选操作）。\
  \ |\n| `boolean removeAll(Collection c)` | 移除所有包含指定集合中的元素（可选操作）。 |\n| `boolean retainAll(Collection\
  \ c)` | 保留此集合中包含指定集合中的元素（可选操作）。 |\n| `int size()` | 返回此集合中元素的数量。 |\n| `Object[ ]\
  \ toArray()` | 返回一个包含此集合中所有元素的数组。 |\n\n可以通过调用 `equals()` 方法比较两个集合的等性。“等性”的精确含义可能根据集合的不同实现而异。\n\
  \n例如，你可以实现 `equals()` 以便比较集合中存储的元素的值。或者，`equals()` 可以比较这些元素的引用。\n\n### List 接口\n\
  \n列表是一种有序的集合，也称为序列（sequence）。`List` 接口扩展了 `Collection` 并声明了存储元素序列的集合的行为。\n\n可以使用从\
  \ 0 开始的索引根据元素在列表中的位置插入或访问元素。列表可以包含重复元素。除了 `collection` 定义的方法外，`List` 还定义了自己的一些方法。\n\
  \n#### List 接口中的方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `boolean add(Object o)` |\
  \ 将指定的元素添加到此列表的末尾（可选操作）。该方法定义在 `Collection` 接口中，但作为 `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。\
  \ |\n| `void add(int index, Object element)` | 将指定的元素插入列表的指定位置（可选操作）。插入点处或之后的任何现有元素都会向后移动。因此，元素不会被覆盖。\
  \ |\n| `boolean addAll(Collection c)` | 将指定集合中的所有元素添加到此列表的末尾，其顺序与指定集合迭代器返回的顺序相同（可选操作）。该方法定义在\
  \ `Collection` 接口中，但作为 `List` 接口的一部分，它应该实现为始终将元素添加到列表的末尾。 |\n| `boolean addAll(int\
  \ index, Collection c)` | 将指定集合中的所有元素插入列表的指定位置（可选操作）。如果调用者的列表发生变化，则返回 true，否则返回\
  \ false。 |\n| `boolean addAll(int index, Collection c)` | （此处上重复描述）如果调用者的列表发生变化，则返回\
  \ true，否则返回 false。 |\n| `Object get(int index)` | 返回列表中指定位置的元素。 |\n| `int indexOf(Object\
  \ o)` | 返回元素在列表中首次出现的索引，如果不包含该元素则返回 -1。 |\n| `int lastIndexOf(Object o)` | 返回元素在列表中最后一次出现的索引，如果不包含该元素则返回\
  \ -1。 |\n| `ListIterator iterator()` | 返回一个此列表元素的迭代器（按顺序）。 |\n| `ListIterator iterator(int\
  \ index)` | 返回一个从列表指定位置开始的列表元素迭代器（按顺序）。 |\n| `Object remove(int index)` | 删除指定位置的元素（可选操作）并返回被删除的元素。结果列表将压缩。也就是说，后续元素的索引减一。\
  \ |\n| `Object set(int index, Object element)` | 用指定的元素替换列表中指定位置的元素（可选操作）。 |\n|\
  \ `List subList(int fromIndex, int toIndex)` | 返回一个包含调用者列表中从 fromIndex 到 toIndex-1\
  \ 的列表。返回列表中的元素也被调用对象引用。 |\n\n注意：如果集合不可修改，这些方法中的某些将抛出 `UnsupportedOperationException`；当对象与集合不兼容时，会生成\
  \ `ClassCastException`。\n\n由 `collection` 接口定义的 `add(Object o)` 和 `addAll(Collection\
  \ c)` 方法的语义被 `list` 改变，变为将元素添加到列表末尾。\n\n### Set 接口\n\n`Set` 接口定义了一个集合。它扩展了 `Collection`\
  \ 并声明了不允许重复元素的行为。\n\n因此，当尝试向集合添加重复元素时，`add()` 方法返回 false。它没有定义任何额外的方法。\n\n### SortedSet\
  \ 接口\n\n\n\n\n\n`SortedSet` 接口扩展了 `Set` 并声明了按升序排序的集合的行为。\n\n| `Comparator comparator()`\
  \ | 返回与此排序集合关联的比较器；如果使用其元素的自然排序，则返回 null。 |\n| :--- | :--- |\n| `Object first()`\
  \ | 返回此排序集合中的第一个元素。 |\n| `SortedSet headSet(Object toElement)` | 返回此排序集合的一个部分视图，其中的元素严格小于\
  \ `toElement`。 |\n| `Object last()` | 返回此排序集合中的最后一个元素。 |\n| `SortedSet subSet(Object\
  \ fromElement, Object toElement)` | 返回此排序集合的一个部分视图，其中的元素范围从 `fromElement`（包含）到 `toElement`（不包含）。\
  \ |\n| `SortedSet tailSet(Object fromElement)` | 返回此排序集合的一个部分视图，其中的元素大于等于 `fromElement`。\
  \ |\n\n当调用的集合中不包含任何项时，有几个方法会抛出 `NoSuchElementException`。当对象与集合中的元素不兼容时，会抛出 `ClassCastException`。如果尝试使用\
  \ null 对象且集合不允许 null，则会抛出 `NullPointerException`。\n\n### 集合类\n\n某些集合类提供了完整的实现，可以直接使用。另一些是抽象类，它们提供了骨架实现，作为创建具体集合的起点。\n\
  \n没有任何集合类是同步版本。标准集合类如下：\n\n| `AbstractCollection` | 实现了大部分 `Collection` 接口。 |\n\
  | :--- | :--- |\n| `AbstractList` | 扩展 `AbstractCollection` 并实现了大部分 `List` 接口。 |\n\
  | `AbstractSequenceList` | 扩展 `AbstractList`，用于对元素进行顺序访问而非随机访问的集合。 |\n| `AbstractSet`\
  \ | 扩展 `AbstractCollection` 并实现了 `Set` 接口。 |\n| `LinkedList` | 通过扩展 `AbstractSequentialList`\
  \ 实现链表列表。 |\n| `ArrayList` | 通过扩展 `AbstractList` 实现动态数组。它对元素使用随机访问。 |\n| `HashSet`\
  \ | 扩展 `AbstractSet`，用于与哈希表配合。 |\n| `LinkedHashSet` | 扩展 `HashSet` 以允许按插入顺序迭代。 |\n\
  | `TreeSet` | 扩展 `AbstractSet` 并实现 `SortedSet` 接口。它使用二叉搜索树按排序顺序存储元素。 |\n\n注意：除了集合类外，一些旧有的类如\
  \ `Vector`、`Stack`、`Hashtable` 也经过重写以支持集合。\n\n### 通过 Iterator 和 ListIterator 访问集合\n\
  \n通常，你想要遍历集合中的元素。到目前为止，最简单的方法是使用迭代器（iterator），这是一个实现了 `Iterator` 或 `ListIterator`\
  \ 接口的对象。\n\n`Iterator` 允许你通过遍历集合来获取或移除元素。`ListIterator` 扩展了 `Iterator`，允许对列表进行双向遍历并修改元素。\n\
  \n通过迭代器访问集合之前，你必须获取它。每个集合类都提供了一个 `iterator()` 方法，返回一个指向集合开头的迭代器。通过使用这个迭代器对象，你可以一次访问集合中的每个元素。\n\
  \n对于实现 `List` 的集合，你还可以通过调用 `ListIterator` 获取迭代器。列表迭代器允许你以正向或反向方向访问集合，并且你可以修改元素。否则，`ListIterator`\
  \ 的用法与 `Iterator` 一样。\n\n### ArrayList 类\n\n`ArrayList` 类扩展了 `AbstractList` 并实现了\
  \ `List` 接口。`ArrayList` 支持按需增长的动态数组。在 Java 中，标准数组是固定长度的。\n\n数组创建后，它们就不能增长或缩小，这意味着我们必须提前知道数组将持有多少个元素。但有时，我们在运行时之前不知道数组的大小。为了处理这种情况，集合框架定义了\
  \ `ArrayList`。\n\n一个 `ArrayList` 是一个变长度的对象引用数组，也就是说，`ArrayList` 的大小可以动态增加或减少。数组列表在创建时具有初始大小。\n\
  \n当超过当前大同时，集合会自动扩大；当对象被移除时，数组可能会缩小。使用 J2SE 5 引入的泛型功能，可以限制添加到 `ArrayList` 中的元素类型。\n\
  \n注意：旧类 `Vector` 也支持动态数组。\n\n### ArrayList 类的构造函数与方法\n\n| 方法 |or |\n| :--- | :---\
  \ |\n| `public ArrayList(int)` | 一个具有指定初始容量的空列表。当元素被添加到数组列表中时，容量会自动增长。 |\n| `public\
  \ ArrayList()` | 一个初始容量为十的空列表。 |\n| `public ArrayList(Collection)` | 构造一个包含指定集合元素的列表。元素按照集合的\
  \ `Iterator` 返回的顺序排列。 |\n| `public void trimToSize()` | 反之，如果我们想减小 `ArrayList` 对象底层数组的大小，使其恰好等于当前持有的项数，可以调用\
  \ `trimToSize()` 方法。 |\n| `public void ensureCapacity(int)` | 尽管 `ArrayList` 对象的容量在存储对象时会自动增加，但我们可以通过调用\
  \ `ensureCapacity()` 方法手动增加 `ArrayList` 对象的容量。通过在开始时增加一次容量，可以防止后续的多次重新分配。因为重新分配在时间上是昂贵的，防止不必要的分配可以提高性能。\
  \ |\n| `public int size()` | |\n| `public Boolean isEmpty()` | |\n| `public Object\
  \ clone()` | |\n| `public Object[] toArray()` | 处理 `ArrayList` 时，我们有时想要获取一个包含其内容的实际数组。可以通过调用\
  \ `toArray()` 方法来实现。许多原因导致将集合转换为数组，例如：<ul><li>为某些操作获得更快的速度</li><li>将数组传递给不支持集合的方法</li><li>与不支持集合的旧代码集成</li></ul>\
  \ |\n| `public Object[] toArray(Object[])` | |\n| `public Object get(int)` | |\n\
  | `public Object set(int, Object)` | |\n| `public boolean add(Object)` | |\n| `public\
  \ void add(int, Object)` | |\n| `public Object remove(int)` | |\n| `public boolean\
  \ remove(Object)` | |\n| `public void clear()` | |\n| `public boolean addAll(Collection)`\
  \ | |\n| `public boolean addAll(int, Collection)` | |\n| `public boolean contains(Object)`\
  \ | |\n| `public int indexOf(Object)` | |\n| `public int lastIndexOf(Object)` |\
  \ |\n\n#### 示例 1\n\n```java\nimport java.util.*;\nclass ArrayListTest {\n    public\
