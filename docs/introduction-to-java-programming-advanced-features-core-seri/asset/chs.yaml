  \ `FileInputStream` 类的对象，并将文件名（直接或间接）作为构造函数的参数指定。\n\n| Method Signature | Description\
  \ |\n| :--- | :--- |\n| `public FileInputStream(String) throws FileNotFoundException`\
  \ | 通过打开指向实际文件的连接来创建 `FileInputStream`，该文件由文件系统中路径名 `filePath` 命名的。 |\n| `public\
  \ FileInputStream(File) throws FileNotFoundException` | 通过打开指向实际文件的连接来创建 `FileInputStream`，该文件由文件系统中的\
  \ `File` 对象 `file` 命名的。 |\n| `public native int read() throws IOException` | |\n\
  | `public int read(byte[]) throws IOException` | |\n| `public int read(byte[], int\
  \ int) throws IOException` | |\n| `public native long skip(long) throws IOException`\
  \ | |\n| `public native int available() throws IOException` | |\n| `public void\
  \ close() throws IOException` | |\n\n### FileOutputStream\n它是 `OutputStream` 类的直接子类。要打开文件进行写入，我们只需创建一个\
  \ `FileOutputStream` 类的对象，并将文件名（直接或间接）作为构造函数的参数指定。\n\n| Method Signature | Description\
