  \      System.out.println(\"tc2.a\"+tc2.a);\n        System.out.println(\"tc2.b\"\
  +tc2.b);\n        for(int i=0; i<4; i++) {\n            System.out.println(\"tc2.c[\"\
  \ + i +\"]=\" + tc2.c[i]);\n        }\n        for(int i=0; i<4; i++) {\n      \
  \      tc2.c[i] = i+4;\n        }\n        for(int i=0; i<4; i++) {\n          \
  \  System.out.println(\"tc2.c[\" + i +\"]=\" + tc2.c[i]);\n        }\n        for(int\
