  \ FlowLayout(FlowLayout.CENTER, 20 ,20))`\n**输出：**\n![](img/image1275.jpeg)\n![](img/image1276.jpeg)\n\
  \n### 3. GridLayout\n\n`GridLayout` 布局管理器的功能封装在 `java.awt.GridLayout` 类中。`GridLayout`\
  \ 以表格形式在行和列中排列组件。我们可以将容器空间看作一个由行和列组成的网格。在指定布局时，我们需要指定行数和列数。`GridLayout` 会根据行的大小（即布局中指定的列数）将尽可能多的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，它被分为固定数量的行和列。\n\
  \n流布局管理器（FlowLayout）始终尊重组件的首选尺寸。而 `GridLayout` 布局管理器采取了相反策略：当它在给定空间内执行布局时，它会忽略组件的首选尺寸。`GridLayout`\
  \ 中的每一行和每一列的大小都是相同的，布局的可用区域在行数和列数之间平均分配。`GridLayout` 使用“行主优先”符号，即组件按照它们添加的顺序从左到右、一行一行地出现。\n\
  \n当我们添加的组件很少（即远少于行数乘以列数）或很多（即多于行数乘以列数）时，`GridLayout` 的行为会很奇怪。如果将相同的组件在一个更高、更窄的框架中布局，那么每个组件都会按比例变得更高、更窄，反之亦然。\n\
  \n#### 示例 17.6\n```java\nimport java.awt.*;\npublic class MyFrame6 extends Frame\
  \ {\n    public static void main(String args[]) {\n        Frame f = new MyFrame6(\
  \ );\n        f.setLayout(new GridLayout(5,3));\n        for(int row=0; row<5; row++)\
  \ {\n            f.add(new Label(\"Label\" + row ));\n            f.add(new Button(\"\
  Button\" + row ));\n            f.add(new TextField(\"TextField\" + row ));\n  \
  \      }\n        f.setSize(500,200);\n        f.setVisible(true);\n    }\n}\n```\n\
  **输出：**\n![](img/image1278.jpeg)\n\n### 4. BorderLayout\n\n`BorderLayout` 布局管理器的功能封装在\
  \ `java.awt.BorderLayout` 类中。`BorderLayout` 是框架的默认管理器，因此应用程序程序员迟早都会熟悉它。\n\n它强制执行了一种非常有用的布局策略，但可能没有流布局或网格布局管理器那么直观。流布局管理器始终尊重组件的首选尺寸；而\
  \ `Grid` 布局管理器则从如此。`Border` 布局管理器则介于两者之间。\n\n`BorderLayout` 管理器将可用的容器空间分为五个部分：`North`（北）、`South`（南）、`East`（东）、`West`（西）和\
  \ `Center`（中心）。我们可以在每个区域添加一个组件。这五个区域中的每一个可以是空的，也可以包含一个组件（即每个区域不需要包含组件，但每个区域只能包含一个组件）。\n\
  \n`Border` 布局管理器尊重 `North` 和 `South` 组件的首选高度，并强制它们的宽度恰好与容器一样。`North` 和 `South` 区域适用于工具栏、状态行以及任何应该尽可能宽但高度不超过必要的控件。\n\
  \n`East` 和 `West` 区域与 `North` 和 `South` 相反。在 `East` 和 `West` 中，组件获得其首选宽度，但高度受到限制。在这里，组件在垂直方向上延伸到\
  \ `North` 组件的底部（如果有）或到容器的顶部（如果没有 `North` 组件）。\n\n同样，组件在垂直方向上延伸到 `South` 组件（如果有）或到容器的底部（如果没有\
  \ `South` 组件）。\n\n正确使用 Border 布局管理器要求第二个参数必须是 Border Layout 类本身定义的常量。重载形式的 `add(\
  \ )` 方法接受两个参数：\n\n*   第一个是要添加的组件，以及\n*   第二个是一个对象\n\n\n\n\n\n## BorderLayout\n\n\
  - `BorderLayout.SOUTH`\n- `BorderLayout.EAST`\n- `BorderLayout.WEST`\n- `BorderLayout.CENTER`\n\
  \n`Border` 布局管理器控制的第五个区域被称为 `Center`。`Center` 只是容器在分配了 `North`、`South`、`East` 和\
  \ `West` 后剩余的部分。\n\n在向中心添加组件时，向 `add()` 调用传递第二个参数是合法的但非常不明智的。在 Java Platform 中，`Border`\
  \ 布局管理器会假设我们的意思是 `center`。\n\n然而，在旧版本中，这种行为是不可预测的通常会导致组件完全不可见。\n\n### 示例 17.7\n\n\
  ```java\nimport java.awt.*;\n\npublic class MyFrame7 {\n    public static void main(String\
  \ args[]) {\n        Frame f = new Frame();\n        Scrollbar sbRight = new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbRight, BorderLayout.EAST);\n        Scrollbar sbLeft = new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbLeft, BorderLayout.WEST);\n        Label labelTop = new Label(\"\
  This is North\");\n        labelTop.setFont(new Font(\"Serif\", Font.ITALIC, 36));\n\
  \        labelTop.setForeground(Color.white);\n        labelTop.setBackground(Color.black);\n\
  \        f.add(labelTop, BorderLayout.NORTH);\n        Label labelBottom = new Label(\"\
  This is south\");\n        labelBottom.setFont(new Font(\"Monaced\", Font.BOLD,\
  \ 18));\n        labelBottom.setForeground(Color.white);\n        labelBottom.setBackground(Color.black);\n\
  \        f.add(labelBottom, BorderLayout.SOUTH);\n        f.setSize(50, 20);\n \
  \       f.setVisible(true);\n    }\n}\n```\n输出：![](img/image0279.jpeg)\n\n### 示例\
