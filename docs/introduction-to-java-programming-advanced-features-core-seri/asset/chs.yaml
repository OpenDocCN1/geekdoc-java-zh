  \ Scrollbar\n调整列表和滚动面板的 Scrollbar 组件可以作为一个独立的组件使用。有三个构造函数：\n\n- `Scrollbar()` 构建一个新的垂直滚动条。\n\
  - `Scrollbar(int orientation)` 构建一个具有指定方向的新滚动条。\n- `Scrollbar(int orientation, int\
  \ initialValue, int sliderSize, int minValue, int maxValue)` 构建一个具有指定方向、初始值、滑块大小以及最小值和最大值的新滚动条。`sliderSize`\
  \ 参数控制滑块的大小，但不是以像素为单位。对于接受方向参数的构造函数，该值应该是以下之一：\n- `Scrollbar.HORIZONTAL`\n- `Scrollbar.VERTICAL`\n\
