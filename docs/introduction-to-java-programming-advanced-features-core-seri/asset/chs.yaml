  No. of characters to read=\"+fin.available());\n20. fin.close();\n21. }\n22. catch(ArrayIndexOutOfBoundsException\
  \ e)\n23. {\n24. System.out.println(e);\n25. }\n26. catch(FileNotFoundException\
  \ e)\n27. {\n28. System.out.println(e);\n29. }\n30. catch(IOException e)\n31. {\n\
