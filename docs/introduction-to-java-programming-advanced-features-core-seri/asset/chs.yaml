  \n## 第 6 章 继承\n\n## 引言\n\n当一个类的属性转移到另一个类时，被称为继承。在这种情况下，被继承的类被称为超类（super class）、基类（base\
  \ class）或父类（parent class），而被继承的类被称为子类（child class）、子类（sub class）或派生类（derived class）。\n\
  \n继承允许我们通过添加额外功能来扩展现有的类（基类）。它鼓励代码重用，这有助于减少代码量，尽管在某些情况下可能会导致复杂性。例如，如果我们已经完成了一个简单计算器的代码。之后我们需要开发科学计算器，我们有两种选择：\n\
  \n(i) 创建一个新类（重写该类）\n(ii) 扩展类。在大多数情况下，第二种方案是更好的选择。在这种情况下，我们只需要编写一小段代码。同时，我们不需要花费大量时间进行调试和测试，因为基类已经过过测试并运行了长时间。当我们需要将一个类继承到另一个类时，必须使用\
  \ `extends` 关键字。\n\n语法：`class sub_class extends base_class`\n\n`Class A`（超类或基类或父类）。`Class\
  \ B`（子类或派生类或子类）。子类将拥有基类的所有特征，加上扩展类中定义的新特征。Java 不支持多重继承，但支持多级继承，因此子类可以扩展一个基类。\n\n\
  ### 示例 6.1:\n\n```java\nclass A {\n    int x;\n    void setX(int x1) {\n       \
  \ x = x1;\n    }\n    void displayX() {\n        System.out.println(x);\n    }\n\
  }\n\nclass B extends A {\n    int y;\n    void setY(int y1) {\n        y = y1;\n\
  \    }\n    void displayY() {\n        System.out.println(y);\n    }\n}\n\nclass\
  \ InheritTest {\n    public static void main(String args[]) {\n        A a1 = new\
  \ A(); // 4 bytes\n        a1.setX(5);\n        a1.displayX();\n        B b1 = new\
  \ B(); // 8 bytes\n        b1.setX(10);\n        b1.setY(20);\n        b1.displayX();\n\
  \        b1.displayY();\n    }\n}\n```\n\n输出：\n```\n5\n10\n20\n```\n\n### 成员隐藏\n\
  \n如果子类的成员与超类的成员具有相同的名称（对于方法来说具有相同的签名），则它会隐藏超类的成员。\n\n虽然两个成员在子类中可能都可用，但使用成员名称时，只能访问子类成员，因为它隐藏了超类中同名的成员。\n\
  \n### 使用 super 关键字\n\n当子类需要引用其直接超类时，可以通过 `super` 关键字来实现。`super` 有两种通用用途：\n\n1. 调用超类的构造方法\n\
  子类可以通过以下形式的 super 调用其超类定义的构造器方法：`super(parameter-list);`\n\n在这里，`parameter-list`\
  \ 指定了超类构造方法所需的任何参数。事实上，`super()` 必须是子类构造方法内部执行的第一条语句。\n\n2. 访问被子类隐藏的的类成员。\n\n`super`\
  \ 关键字可以按如下方式访问超类的隐藏成员：\n\n`super.member;`\n\n\n\n\n在这里，成员可以是方法，也可以是数据成员。\n\n# 方法重载与方法重写\n\
  \n#### 方法重载\n当两个或多个方法具有相同名称但参数不同时，称为方法重载。当对象需要执行相似的任务但使用不同的输入参数时，就会使用方法重载。\n\n当我们调用一个方法时，`java`\
  \ 首先匹配方法名，然后匹配参数的数量和类型。决定调用哪一个方法定义被称为多态。\n\n## 方法重写\n我们已经看到，超类中的方法会被其子类继承，并由子类创建的对象使用。方法继承允许我们在子类中重复定义和使用方法，而无需在子类中再次定义该方法。\n\
  \n在类层次结构中，当子类中的实例方法与其超类中的实例方法（非私有）具有相同的签名时，子类中的方法被认为重写了超类中的方法。\n\n当从子类内部调用被重写的方法时，它将始终引用子类定义的该方法版本。超类定义的方法版本将被隐藏。\n\
