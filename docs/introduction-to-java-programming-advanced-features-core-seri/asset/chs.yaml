  \n# 第 4 章：(Scanner 类与数组)\n## (命令行参数)\n\n## 引言\n\n### Scanner 类\n\n这是 Java 在 JDK\
  \ 1.5-6-7 版本中新增的类，用于从用户处获取基本数据类型的输入。使用此类类获取输入非常简单，因为只需要创建该类的对象并调用特定方法即可。该类位于 `java.util`\
  \ 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public java.util.Scanner(java.io.File)\
  \ throws java.io.FileNotFoundException;` |\n| `public java.util.Scanner(java.lang.String);`\
  \ |\n| `public void close();` |\n| `public boolean hasNext();` |\n| `public java.lang.String\
  \ next();` 输入不包含任何空格的字符串。 |\n| `public java.lang.String nextLine();` 输入可能包含空格的字符串。\
  \ |\n| `public boolean hasNextBoolean();` |\n| `public boolean nextBoolean();` |\n\
  | `public boolean hasNextByte();` |\n| `public byte nextByte();` |\n| `public boolean\
  \ hasNextShort();` |\n| `public short nextShort();` |\n| `public boolean hasNextInt();`\
  \ 检查输入缓冲区中的下一个值是否为 `int`。 |\n| `public int nextInt();` 输入整数值。 |\n| `public boolean\
  \ hasNextLong();` |\n| `public long nextLong();` |\n| `public boolean hasNextFloat();`\
  \ |\n| `public float nextFloat();` |\n| `public boolean hasNextDouble();` |\n| `public\
  \ double nextDouble();` |\n\n#### 示例 4.1:\n\n```java\nimport java.util.*;\nclass\
  \ SumInput\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc=new Scanner(System.in);\n        int a,b,sum;\n        System.out.print(\"\
  Enter Ist number\");\n        a = sc.nextInt();\n        System.out.print(\"Enter\
  \ 2nd number\");\n        b = sc.nextInt();\n        sum = a+b;\n        System.out.println(\"\
  Sum is \" + sum);\n    }\n}\n```\n**输出：**\nEnter Ist number 45\nEnter 2nd number\
  \ 55\nSum is 100\n\n# 数组\n\nJava 中的数组是相同类型变量或数据项目的有序集合。Java 允许任意维度的数组。Java 数组与 C/C++\
  \ 有些不同。我们在声明时时不指定数组的大小。内存分配始终是动态的。Java 中的每个数组都被视为一个对象，并有一个特殊的属性 `length`，它指定数组中元素的数量。\n\
  \n### 一维数组\n\n- **声明**: `type array_name[];` // 声明时不分配内存空间。\n- 或 `type[] array_name;`\
  \ 需要注意的是，声明并没有实际创建数组。它只是声明了一个可以指向数组对象的引用。\n- `int a1[], a2; int a3[], a4;` 这两个声明声明了\
  \ `a1`、`a3` 和 `a4` 为可以指向 `int` 数组的引用变量，但变量 `a2` 不能指向 `int` 数组。它仅仅是一个 `int` 变量。当\
  \ `[]` 跟在类型后面，声明中的所有变量都是数组。否则，`[]` 跟在声明中的每个名称后面。\n- **使用 new 操作符分配内存**: `array_name\
  \ = new type[SIZE];` // `SIZE` 可以是常量或变量。\n- **注意 1**: 数组的所有元素都将自动初始化为零。\n- **注意\
  \ 2**: 要用不同的值初始化数组，可以在数组本身初始化：`int a[]={5,7};`。\n- **注意 3**: 在 Java 中，所有数组都将大小存储在一个名为\
  \ `length` 的变量中。我们通过属性 `array_name.length` 访问数组长度。\n- **注意 4**: `int a[], b = new\
  \ int[5];` 在上述步骤中 `new` 创建了一个数组，该引用将存储在 `b` 中。因此 `a` 和 `b` 指向同一个数组。赋值引用不会创建副本。\n\
  \n#### 示例 4.2 数组存储的所有数字的和\n\n```java\nclass SumArr\n{\n    public static void main(String\
  \ args[])\n    {\n        int a[]={10,50,20,40,30};\n        int n=a.length,sum=0;\n\
  \        for(int i=0;i<n;i++)\n            sum+=a[i];\n        System.out.println(\"\
  Sum of numbers is \" + sum);\n    }\n}\n```\n**输出：** Sum of numbers is 150\n\n####\
  \ 示例 4.3 使用选择排序法对数组排序的程序。\n\n```java\nimport java.util.Scanner;\nclass Sort\n{\n\
