    # 第9章：

    在语句和表达式中使用空格


    首先，是一些关于空格的令人反感的地方：


    在以下情况下不要使用不必要的空格：


    - 在花括号、中括号或圆括号内部


    良好的示例：

    `ham(spam[1], (eggs: 2))`


    一个糟糕的示例：

    `ham(spam[ 1 ], ( eggs: 2 ))`


    - 在冒号、分号或逗号正之前：


    # 一个良好的示例：

    `if x == 4; print x, y; x = y, x`


    # 一个糟糕的示例：

    `if x == 4 : print x , y ; x = y = x`


    然而，在使用切片（slice）时，冒号类似于二元运算符，它的两侧应该包含等量的的。。当你使用扩展切片时，两个冒号必须包含完全相同的间距。例外情况是省略了切片参数及其空格。


    # 一个良好的示例：

    `spam[1:8], spam[8:2]; spam[8:2], spam[1:2]`

    `spam[lower:upper], spam[lower:upper]; spam[lower:step]`

    `spam[lower+offset : upper+offset]`

    `spam[: upper_fn(x) : step_fn(x)]`

    `spam[lower + offset : upper + offset]`


    # 一个糟糕的示例：

    `spam[lower + offset:upper + offset]`

    `spam[ 1:8], ham[1:8], ham[1:8 2]`

    `spam[lower : upper]`

    `spam[: upper ]`


    - 在函数调用参数列表开始的左圆括号之前


    # 一个良好的示例：

    `ham(1 )`


    # 一个糟糕的示例：

    `ham (1)`


    - 在开始切片或索引的左圆括号之前


    # 一个良好的示例：

    `dct[''key''] = lst[index]`


    # 一个糟糕的示例：

    `dct[''key''] = lst [index]`


    - 当运算符（如赋值运算符）周围有多个空格，用为了与另一个运算符对齐时


    # 一个良好的示例：

    `x=1`

    `y=2`

    `long_variable = 3`


    # 一个糟糕的示例：


    ```

    x = 1

    y = 2

    long_variable = 3

    ```


    # 其他建议


    在整个代码中避免使用尾随空格，因为它是不可见的并且可能会引起混淆。例如，如果你输入一个反斜杠，后面跟着一个空格然后换行——这不会被视为换行符。事实上，某些编辑器不会保留它，而有些项目包含
    pre-commit 钩子会直接拒绝它——其中之一就是 CPython。


    以下二元运算符应该被单个空格包围（两侧各一个）：


    - 赋值 (=)

    - 复合赋值 (+=, =)


    以下比较运算符被视为相同处理：


    - =

    - <

    - >

    - !=

    - <>

    - =

    - >=

    - in

    - not in

    - is

    - is not


    以及这些布尔值：


    - and

    - or

    - not


    如果你使用的具有不同优先级的运算符，考虑在优先级最低的运算符周围加上空格——在此处请根据你的最佳判断判断。然而，你不应该使用超过一个空格，并确保运算符的每一侧都具有等量的空格——不要在一侧放
    1 个而在另一侧放 2 个：


    # 一个良好的示例：


    ```

    i = i + 1

    submitted += 1

    x = x*2 - 1

    ```


    '
