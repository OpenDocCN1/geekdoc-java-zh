  mdcn: "\n\n## 第 3 章：\n代码布局\n\n最显而易见的入门点是如何布局你的代码。我将为你提供代码布局的最佳实践指南，并结合如何做以及不该如何做的示例：\n\
    \n## 缩进与对齐\n\n每个缩进级别应为 4 个空格。\n\n当你使用延续行时，它们应该通过以下两种方法之一对折行的元素进行对齐：\n\n- 垂直对齐，类似于\
