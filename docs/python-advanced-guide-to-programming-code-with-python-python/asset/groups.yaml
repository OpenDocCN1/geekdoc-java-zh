    ## 第 8 章：命名规范


    老实说，Python 库的命名规范有些混乱，因此我们永远无法做到完全一致。然而，有一些建议的命名标准，且所有新创建的包和模块（包括任何第三方框架）都必须符合这些标准。话虽如此，如果你在使用具有不同风格的现有库，请坚持该风格，因为一致性是优的，特别是在可读性方面。


    要学习的第一条也是最重要的原则是：当你使用作为公共 API可见部分的名称时，你必须使用反映名称用途而非其实现的约定。


    ## 描述性命名


    有很多不同的命名风格，因此识别使用的是哪种风格（独立于使用方式）是有帮助的。这些是最常见的区分命名风格：


    - B – 单字母大写

    - b – 单字母小写

    - lowercase_with_underscores 划线全小写

    - lowercase 全小写

    - UPPERCASE_WITH_UNDERSCORES 划线全大写

    - UPPERCASE 全大写

    - CapitalizedWords – 通常被称为驼峰命名，因为字母看起来有些*起伏*

    - mixedCase – 与驼峰命名不同，因为首字母是小写的

    - Capital_Words_With_Underscore – 这种风格并不好看！


    * 当你在驼峰命名中使用缩写词时，你应该确保所有的缩写字母都是大写的。例如，与其使用 `HttpServer`，不如使用 `HttpServerError`。


    你还可以使用另一种风格，即添加唯一的短前缀，将一组相关的名称放在一起。这在 Python 中并不常见，但我提到它是为了让你知道它的存在。一个例子是函数 `os.stat()`
    – 它将返回一个元组，其中包含如 `st_size`、`st_mode`、`st_mtime` 等命名的项。


    以下是一些使用尾或或下划线的形式，通常可以与任何大小写约定结合：


    - _one_leading_underscore – 这通常是“内部使用”的指示，但并不强。

    - _trailing_underscore_ - 通常用于防止与 Python 关键字冲突，例如：`Apiter.Toplevel(master,class=''ClassNameName'')`

    - __two_leading_underscores – 当你使用类属性时，这会触发名称修饰（mangling），例如：（在 `FootBar` 类内部的
    `__boo`）将变为 (`_FootBar__boo`）。

    - __two_leading_and_two_trailing_underscores 是位于用户控制命名空间中的属性或“魔法”对象。例如：`__init__`、`__file__`
    或 `__import__`。


    ## 规范性命名


    这些是你应该避免的名称：


    永远不要使用‘O’（大写）、‘l’（小写 L）或‘I’（大写 i），因为它们可能与数字混淆。根据字体，你应该使用小写。


    ## 模块和包名


    所有模块名称都应该是小写的。如果你正在使用用于内部使用的模块，请使用前置下划线以防止名称与关键字冲突。


    ## 类名


    类名通常使用驼峰命名。如果你正在使用用于内部使用的类，请使用下划线。


    ## 类型变量


    变量名通常使用驼峰命名。如果你正在使用的变量可能会被子化，请使用前置下划线。如果你还使用了可能被子类的属性，你应该使用双前置下划线。


    ```python

    VT_co = TypeVar(''VT_co'')

    KT_contra = TypeVar(''KT_contra'')

    ```


    ## 异常命名


    异常通常有一个后缀。如果你编写异常，使用‘Error’。


    ## 全局变量


    全局变量定义在模块级，全大写并用划线分隔。


    ## 函数


    所有函数名均为小写并用划线分隔。


    ## 实例变量和方法名


    约定同样适用于实例变量。如果你在使用非公开方法，请使用下划线。


    ## 常量


    这些通常是大写并用划线分隔的例如 `MAX_OVERFLOW`。


    ## 继承设计


    要遵守的规则是判断实例变量或类方法是非公开的。如果你无法决定，请选择非公开，因为你可以轻松地将其改为公开，而将公开改为非公开并不那么容易。


    公共属性是与用户相关的，而非公开属性是为第三方设计的。对于公共属性，你保证从开始到结束向后兼容；而对于非公开属性，你可以进行更改。另一个属性类别是保护属性。在
    Python 中，它们属于子类 API。这些是专门用于继承的类，无论是为了扩展还是修改某些行为。当你设计这样的类时，务必对属性做出明确判断——它们是公共的、仅供基类使用的，还是子类
    API 的？


    综以上，这些是 Python 之：


    - 公共属性不能有前置下划线

    - 如果公共属性与关键字冲突，在属性名称末尾添加一个下划线。这比使用拼写错误或缩写是优的方法。

    - 对于公共数据属性，最好的方法是仅暴露属性名称，而不使用任何复杂的修改器或访问器。如果一个简单的属性需要扩展其功能，Python 可以让你轻松实现。

