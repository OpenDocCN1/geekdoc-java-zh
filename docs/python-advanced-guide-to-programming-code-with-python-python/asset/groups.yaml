  - "[PAGE 8]\n\n# Returning Values\n\nWhen you get a function that is ever-growing\
    \ in complexity, it isn’t unheard of to use several return statements in the body\
    \ of the function. However, if you want to maintain clear intent and a good level\
    \ of readability, you should try not to return values from several points in the\
    \ function body.\n\nWhen it comes to returning values within a function, there\
    \ are 2 cases for doing so: the result that comes from a normally processed function,\
    \ and the errors that are indicative of incorrect input parameters or for any\
    \ reason the function cannot complete the computation.\n\nIf you don’t want exceptions\
    \ raised for the latter case, then it might be necessary for values, such as False\
    \ or None to be returned, as an indication that the function was not able to perform\
    \ properly. In cases such as this, it is best practice to return as soon as the\
    \ wrong context has noticed.\n\nThis will help to neaten the function structure\
    \ because all code that comes after the error return assumes that the condition\
    \ has been met so that the main function result can be computed. As such, it is\
    \ sometimes necessary to have several return statements like this.\n\nThat said,\
    \ if a function contains several different courses it can go, it can be unwieldy\
    \ to debug the result so it is preferable to maintain just one course. This also\
    \ helps in working out code paths and, if you have several courses, it could be\
    \ an indication that you need to re-look at your code and tidy it up.\n\n# For\
    \ Example:\n\n```\ndef complex_function(c, b, a):\n    if not c:\n        return\
    \ None # Raising an exception might be better\n    if not b:\n        return None\
    \ # Raising an exception might be better\n    # Some elaborate code that is trying\
    \ to make x from c, b and a\n    # Try not to return x if successful\n    if not\
    \ x:\n        # A Plan-B calculation of x\n        return x # One exit point for\
    \ the value x will be helpful\n        # when trying to maintain the code.t\n\
    ```"
