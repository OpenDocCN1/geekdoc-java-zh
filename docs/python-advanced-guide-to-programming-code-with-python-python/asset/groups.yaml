    \ ValueError('message')` 而不是 `raise ValueError 'message'`，因为后者在 Python 3 中既不是有效的的也不是合法的。此外，使用括号意味着当你在添加字符串格式化或异常参数过长时，不需要在行末使用续行符。\n\
    \n- 当你捕获异常时，尽可能提到具体的异常类型，而不是使用裸露的 `except:` 子句，这使得使用 `KeyboardInterrupt` 和 `SystemExit`\
