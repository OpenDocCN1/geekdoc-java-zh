    \n通过阅读本文，读者同意在任何情况下，作者对因使用本文中所包含的信息而导致的任何直接或间接损失不负责，包括但不限于错误、遗漏或不准确。\n\n# 引言\n\
    \n我想感谢你的阅读，并祝贺你选择了《Python：Python 编程代码最佳实践》这本书。这本书包含了关于如何更有效地进行 Python 编程的成熟步骤和策略。当你开始学习\
    \ Python 时，人们会教你写代码，但在很多情况下，他们并没有教你如何写整洁的代码。\n\n如果你与任何 Python 程序员交流，问问他们 Python\
    \ 是什么样的。我保证他们会告诉你，其中一个主要原因是因为它非常易于阅读。事实上，这是 Python 语言的核心灵魂，因为计算机代码被阅读的次数远大于编写的次数。这在很大程度上归于\
    \ Python 代码遵循了一set指南和“Pythonic”（Python 风格）惯用法——如果你听到程序员提到代码某部分不“Pythonic”，意味着它没有遵循这些指南，而且没有以任何方式表达其意图。\n\
    \n代码风格和布局极其重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，而指南简单来说并不适用——你必须知道什么时候是这种时候，以及在\
    \ Python 编程中何时该依靠主观判断。\n\n通过本指南，我将向你展示编写代码的极致方式，整理你的程序并使其更加有效、高效。我不会只给你基础知识。我将深入探讨你需要了解的一切，从代码布局到如何编写函数、惯用法和命名。\n\
    \n我将谈到空格和标签、字符串和方法。我还会为你提供关于 Python 编程的一些通用建议以及通用概念。简而言之，当你读完我的最佳实践指南时，你将成为你所能的最优秀的\
    \ Python 程序员。\n\n我的书假设你对 Python 编程有一定的先验知识，所以如果你是编程领域的完全新手，请在阅读本书之前熟悉 Python 代码。我的目标是帮助你产出没有（或至少极少）复杂性或显而性问题的\
    \ Python 代码，并让它对他人来说是可读的。\n\n再次感谢阅读本书，希望你喜欢！\n\n# 第 1 章：Python 编码通用概念\n\n在我们正式进入书籍之前，这些是你应该意识到的编码通用概念；这些概念将让你的生活变得更轻松。\n\
    \n## 显式代码 (Explicit Code)\n\n虽然你可以用 Python 做各种奇妙而神奇的事情，但最好保持直接和显式。\n\n### 坏示例：\n\
    \n```python\ndef make_complex(*args):\n    x, y = args\n    return dict(**locals())\n\
    ```\n\n### 好的示例：\n\n```python\ndef make_complex(x, y):\n    return {'x': x, 'y':\
    \ y}\n```\n\n比较这些示例；在后者的代码示例中，我们从调用者那里显式接收了 x 和 y，返回是一个显式的字典。\n\n编写这段代码的开发者只需看这一行和最后一行就能知道什么；而坏示例并非如此。\n\
    \n## 一行一语句 (One Line, One Statement)\n\n虽然存在复合语句（如列表推导式），是被允许且在很多情况下受到推崇的，但在同一行代码上放置两个互不关联的语句并不是良好的做法。\n\
    \n### 坏示例：\n\n```python\nprint 'one'; print 'two'\n\nif x == 1: print 'one'\n\n\
    if <复杂比较> and <其他复杂比较>:\n    # 执行一些事情\n```\n\n### 好的示例：\n\n```python\nprint 'one'\n\
    print 'two'\n\nif x == 1:\n    print 'one'\n\ncond1 = <复杂比较>\ncond2 = <其他复杂比较>\n\
    if cond1 and cond2:\n    # 执行一些事情\n```\n\n## 返回值 (Returning Values)\n\n当你获得一个不断变得复杂的函数时，有时有必要使用返回语句。然而，如果你想保持清晰的意图和良好的可读性，你不应该尝试从多个点返回值。\n\
    \n在函数内部返回值时，有两种情况可以这样做：指示输入错误的错误，或者由于任何原因函数无法完成。在这样的情况下，最佳实践是在发现错误时立即返回。\n\n尽管如此，如果一个函数包含多个可以返回的路径，调试结果可能会变得异常困难，因此最好只维护一个出口。这也有助于理清代码路径。\n\
    \n### 示例：\n\n```python\ndef complex_function(c, b, a):\n    if not c:\n      \
    \  return None # 抛异常可能更好\n    if not b:\n        return None # 抛异常可能更好\n    #\
    \ 尝试从 c, b 和 a 生成 x 的复杂代码\n    # 如果成功，尽量不要返回 x\n    if not x:\n        # x 的方案\
    \ B 计算\n        return x # 为 x 一个出口会有帮助\n        # 在维护代码时\n```\n\n# 第 2 章：编程建议\n\
    \n这些是编写 Python 代码的基本建议，如果你希望你的代码更加有效高效且易读，就应该遵循这些建议。\n\n- 你的代码编写方式必须不会损害其他 Python\
    \ 实现（如 IronPython, Jython, PyPy, Psyco 和 Python）。\n\n例如，你永远不要依赖于 CPython 的高效字符串拼接，其形式为\
    \ a=a+b 或 a+=b。这是一种相当脆弱的优化，尽管它在 CPython 中超级高效，但在所有类型上并不适用，而且在任何使用引用计数的 Python\
    \ 实现中都不会存在。\n\n相反，在你使用性能敏感的库部分时，你应该使用 .join() 形式。这将确保拼接在所有不同的 Python 实现中都是线性的。\n\
    \n- 永远不要使用相等运算符来与单例（如 None）进行比较。请使用 is 或 not。\n\n"
