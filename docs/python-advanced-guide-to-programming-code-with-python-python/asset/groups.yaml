    \ in ['apple', 'banana']:\n    print('Found apple')\n```\n\n然而，性能是不同的。为了判断一个项是否在列表中，Python\
    \ 必须搜索每一个项。而在集合中，每个项都有一个哈希值告诉 Python 去哪里查找。这使得搜索快得多。在以下情况下，使用集合比列表是更好的选择：\n\n\
    - 集合包含大量项\n- 你将重复进行搜索\n- 没有重复项\n\n## 第 5 章：\n注释\n\n由于你已经有一些 Python 编程经验，你会知道注释在程序运行时是不可见的。注释是为了帮助代码编写者和其他阅读代码的人理解做了什么以及为什么。现在，有些人认为因为它们是不可见的，所以不需要编写它们，而另一些人写的注释毫无意义且代码冲突。我必须告诉你，在这者中，有冲突的注释比不写注释糟糕得多，因此，每当你修改代码时，都必须确保更新了相应的注释。\n\
    \n当你编写注释时，确保它是一个完整的句子并有正确的结尾。正如你写任何东西一样，你的注释（无论是句子还是短语）必须以大写字母开头。该规则的唯一例外是它是以小字母开头的标识符——这里的黄金法则是你永远不要改变标识符的大小！\n\
    \n如果你使用的是简短注释，可以省略结尾的句号。如果你在写块注释，这些通常由至少一个段落组成，有时更多，每个段落由完整的句子组成。这些句子中的每一个都要有句号。每个句号后面应该留出\
    \ 2 个空格，所有注释都应该用英文编写。\n\n"
