    \ __ge__, __gt__, __le__`）。\n\n为了减少工作量，有一个特定的装饰器可以生成所需的任何比较方法。该装饰器是 `functools.total_ordering()`。\n\
    \n风格指南指出 Python 假设了反射规则。因此，Python 解释器可能会更改交换 `y > x` 与 `x < y` 的操作，或者可能会交换 `y\
    \ >= x` 与 `x <= y`。\n\n你可能还会发现参数 `x == y` 被交换为 `x != y`。`min()` 和 `sort()` 操作肯定会使用\
    \ `<` 运算符，而 `max()` 函数将使用 `>` 运算符。然而，作为最佳实践，你应该使用所有操作，以防产生混淆。\n\n- 与其使用将 lambda\
    \ 表达式绑定到标识符的赋值语句，不如使用 `def` 语句。\n\n# 一个良好的示例：\n```python\ndef f(x):\n    return\
    \ 2\n```\n\n# 一个糟糕的示例：\n```python\nf = lambda x: 2\n```\n第一个示例显示，赋予函数对象的名称是 'f'\
    \ 而不是 `<lambda>`。这对于字符串表示以及回溯追踪（tracebacks）非常有用，而通过使用赋值语句，你放弃了 lambda 表达式相比 `def`\
    \ 语句提供的一个优势——即它可以被嵌入更大的语句中。\n\n当你想要派生异常时，请使用 `Exception` 而不是 `BaseException`。后者保留给那些捕获它们是非常错误的异常。在设计异常层次结构时，应基于可能需要的质量来设计。始终要回答一个问题——“哪里出错了？”，而不是仅仅说某事错了。遵循命名约定，但请记住为产生错误的类添加“Error”\
    \ 后缀。对于不是错误且用作流控制或其他形式的信号的异常，不需要添加任何特殊后缀。\n\n- 当你使用异常链（exception chaining）时，请仅在需要的地方使用。当你替换内部异常时，确保将正确的细节重新定位到新异常中。例如，在将\
