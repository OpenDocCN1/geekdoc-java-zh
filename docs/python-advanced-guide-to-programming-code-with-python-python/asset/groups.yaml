    \ Python 代码应该的编写方式。我们通常将惯用代码称为 Python 代码，虽然编写某些东西通常有一种非常明显的方法，但 Python 代码的实际编写方式对于\
    \ Python 初初学者来说可能有些晦涩。所以，你需要学习良好的惯用法，其中一些更常见的有：\n\n### 解包（Unpacking）\n\n只要你知道元组或列表的长度，封包（packing）允许你为每个元素赋予一个名称。例如，`enumerate()`\
