  \ Mobile\n*   结合地理定位使用 jQuery Mobile\n\n## 第 8 章\n\n## JQUERY MOBILE 中的用户手势与动画效果\n\
  \n本章包含许多代码示例，演示了如何处理用户手势以及如何在 jQuery Mobile 中创建动画效果。幸运的是，jQuery Mobile 会为用户手势触发事件，例如\
  \ `orientationchange`、`scrollstart`、`scrollstop`、`swipe`、`swipeleft`、`swiperight`、`tap`\
  \ 和 `taphold`。本章的第一部分向你展示如何处理其中一些用户手势。你还将看到代码示例，展示如何在 jQuery 中创建与滑动相关和淡入相关的动画效果。本节的最后部分简要讨论了\
  \ jQuery Mobile 虚拟鼠标事件，当你需要在 HTML Web 页面中处理鼠标相关事件以及触摸相关事件时，它可以简化你的代码。\n\n本章的第二部分向你展示如何使用\
  \ jQuery Mobile 创建 CSS3 2D/3D 动画效果。一个代码示例使用 jQuery Mobile 创建了 3D 立体效果。此外，光盘中还有渲染“跳动球”的示例，展示了如何获取移动设备的加速度计值，然后在\
  \ jQuery Mobile Web 页面中显示实时值。\n\n![image](img/cd.jpg) 回想一下在第 2 章中学习了如何创建 CSS3 2D\
  \ 和 3D 效果，在第 3 章中学习了如何在 HTML5 Web 页面中将这些效果与 jQuery 结合。在本章中，你将看到如何使用 jQuery Mobile\
  \ 创建一些相应的效果。\n\n### 处理 jQuery Mobile 中的用户手势和事件\n\njQuery Mobile 为用户手势触发了一系列事件，例如\
  \ `orientationchange`、`scrollstart`、`scrollstop`、`swipe`、`swipeleft`、`swiperight`、`tap`\
  \ 和 `taphold`。\n\n如果你需要处理许多用户手势，可以考虑使用 jQuery 插件而不是编写自己的代码。有各种插件可可用，下一节将简要讨论其中两个插件。\n\
  \n当你想要在 HTML Web 页面上检测用户手势时，可以使用 jQuery 的 `.on(\"click\")` 方法编写自定义 jQuery 代码来处理这些手势。请查看第\
  \ 1 章中关于 jQuery 1.7 及更高版本中弃用的 jQuery 事件相关方法的章节，以及推荐的处理事件的 jQuery 方法。\n\n你可能已经知道，每当用户点击元素时，就会发生\
  \ `tap` 事件，而当用户触摸元素并保持接触一秒钟时，就会发生 `taphold` 事件。你可以使用以下代码段在 jQuery Mobile 中绑定 `tap`\
  \ 事件和 `taphold` 事件：\n\n```javascript\n$(\"body\").bind(\"tap\", function () {\n\
  \  console.log(\"Tap Event on the body Element\");\n  return false;\n});\n\n$(\"\
  body\").bind(\"taphold\", function () {\n  console.log(\"Tap Hold Event on the body\
  \ Element\");\n  return false;\n});\n```\n\njQuery 事件处理器内部的 `return false` 语句实际上等同于调用\
  \ `e.preventDefault()`（防止默认事件发生）以及 `e.stopPropagation()`（它*会*阻止事件“冒泡”），这些是作为参数传递给\
  \ JavaScript 函数的 jQuery 事件对象（本示例中未提供该参数）。请记住，非 jQuery 事件处理器中的 `return false` 语句*不会*阻止所发生事件的“冒泡”行为。\n\
  \n当在一秒的间隔内以 30px（或更高）的速度进行水平拖动时，就会发生 `swipe` 事件。`swipeleft` 和 `swiperight` 事件则分别在\
  \ `swipe` 事件向左或向右时发生。\n\n列表 8.1 显示了 `JQMSwipeEvents1.html` 的内容，阐明了如何在 jQuery Mobile\
  \ 中处理点击事件以及向左滑动和向右滑动事件。\n\n***列表 8.1 JQMSwipeTapEvents1.html***\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>Swipe\
  \ and Tap Events in jQuery Mobile</title>\n    <link rel=\"stylesheet\" href=\"\
  http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\" />\n    <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b.js\"></script>\n    <script src=\"\
  http://code.jquery.com/jquery-migrate-1.1.js\"></script>\n    <script src=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.js\"\
  ></script>\n  </head>\n  <body>\n    <div data-role=\"page\" id=\"page1\">\n   \
  \   <div data-role=\"header\"><h1>Swipe and Tap Events in jQuery Mobile</h1></div>\n\
  \      <div data-role=\"content\">\n        <img id=\"sample1\" src=\"sample1.png\"\
  \ width=\"50\" height=\"150\">\n        <img id=\"sample2\" src=\"sample2.png\"\
  \ width=\"50\" height=\"150\">\n        <img id=\"sample3\" src=\"sample3.png\"\
  \ width=\"50\" height=\"150\">\n        <p id=\"result1\">Left Image</p>\n     \
  \   <p id=\"result2\">Middle Image</p>\n        <p id=\"result3\">Right Image</p>\n\
  \      </div>\n      <div data-role=\"footer\"><h1>Footer</h1></div>\n    </div>\n\
  \    <script>\n      <!-- jQuery 事件处理开始 -->\n      $(\"#page1\").live('pageinit',\
  \ (function(event){\n        // 处理 taphold 事件\n        $(\"#sample1\").bind(\"taphold\"\
  ,function(event, ui){\n          console.log(\"Left Image: tap hold\");\n      \
  \    $(\"#result1\").html(\"Left Image: tap hold\");\n        })\n        // 处理\
  \ swipeleft 事件\n        $(\"#sample2\").bind(\"swipeleft\",function(event, ui){\n\
  \          console.log(\"Middle Image: swipe left\");\n          $(\"#result2\"\
  ).html(\"Middle Image: swipe left\");\n        })\n        // 处理 swiperight 事件\n\
  \        $(\"#sample3\").bind(\"swiperight\",function(event, ui){\n          console.log(\"\
  Right Image: swipe right\");\n          $(\"#result3\").html(\"Right Image: swipe\
  \ right\");\n        })\n      }));\n    </script>\n  </body>\n</html>\n```\n*(注：由于原文示例\
