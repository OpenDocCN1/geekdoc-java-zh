  \n## jQuery Mobile 中的滚动事件\n\njQuery Mobile 支持以下自定义事件：`orientationchange`（由更改设备方向——无论是垂直还是水平——触发）、`scrollstart`（在滚动开始时触发）和\
  \ `scrollstop`（在滚动结束时触发）。你可以像处理其他 jQuery 事件一样使用 `live()` 或 `bind()` 来绑定这些事件，它们在\
  \ jQuery 1.7 版本之前的用法方法详见 第 6 章。此外，当你的 jQuery Mobile 代码绑定到 `orientationchange` 事件时，回调函数可以指定第二个参数，该参数包含一个等于\
  \ `portrait` 或 `landscape` 的取向属性。\n\n![image](img/cd.jpg) CD 上的 HTML5 Web 页面 `JQMScrollEvents1.html`\
  \ 展示了如何在 jQuery Mobile 中处理滚动事件，其逻辑如下：\n\n```html\n<script>\n  $(\"#page1\").live('pageinit',\
  \ (function(event,ui){\n    var eventsElement = $('#events');\n    $(window).bind('scrollstart',\
  \ function () {\n      console.log('Scroll start');\n      $('.ui-body-c').css('background',\
  \ 'green');\n      eventsElement.append('<li><a href=\"\">Scroll</a></li>');\n \
  \     //eventsElement.listview('refresh');\n      eventsElement.listview();\n  \
  \  });\n    $(window).bind('scrollstop', function () {\n      console.log('Scroll\
  \ stop');\n      $('.ui-body-c').css('background', 'red');\n      eventsElement.append('<li><a\
  \ href=\"\">Stop</a></li>');\n      //eventsElement.listview('refresh');\n     \
  \ eventsElement.listview();\n    });\n    $(window).bind('orientationchange', function\
  \ () {\n      console.log('Orientationchange change');\n      $('.ui-body-c').css('background',\
  \ 'red');\n      eventsElement.append('<li><a href=\"\">Orientation</a></li>');\n\
  \      //eventsElement.listview('refresh');\n      eventsElement.listview();\n \
  \   });\n  });\n</script>\n```\n\n## 竖屏模式与横屏模式\n\n除了检测移动设备的方向外，当方向发生时，你可能还需要更改用于样式\
  \ Web 页面元素的 CSS 类。\n\n![image](img/cd.jpg) CD 上的 HTML5 Web 页面 `JQMOrientation1.html`\
  \ 展示了你如何根据移动设备的方向轻松更改 HTML 元素相关的 CSS 类。关键逻辑包含在此代码块中：\n\n```javascript\n$(\"#page1\"\
  ).live('pageinit', (function(event,ui){\n  $(window).bind ('orientationchange',\
  \ function (e) {\n    console.log(\"new orientation: \"+e.orientation);\n    $(\"\
  #content\").removeClass('portrait landscape').addClass (e.orientation ? 'landscape'\
  \ : 'portrait');\n  });\n});\n```\n\n注意 `orientationchange` 事件被绑定到 `window` 对象上。在当前示例中，竖屏模式下背景颜色设置为红色，宽度设置为\
  \ 320px，而在横屏模式下背景颜色设置为蓝色，宽度设置为 480px。\n\n另一个需要记住的点是，`window.orientation` 在竖屏模式下的值为\
  \ 0，在横屏模式下的值为 -90 或 90。\n\n另一种方法是在你的 HTML Web 页面中使用以下类型的代码：\n\n```css\n@media all\
  \ and (orientation: portrait) { body {background-color: red} }\n<link rel=\"stylesheet\"\
  \ media=\"all and (orientation: landscape)\" href=\"landscape.css\" />\n```\n\n\
  图 8.2 显示了在带有 Android 的 Asus Prime 平板上拍摄的横屏截图渲染 `JMOrientation1.html` 的结果。\n\n![image](img/fig8.2.jpg)\
  \ 在带有 Android 的 Asus Prime 平板上检测方向\n\n 使用 jQuery Mobile 的动画效果\n\n你可以使用 jQuery Mobile\
  \ 创建各种基于 jQuery 的动画效果，包括淡入效果、滑动效果和自定义动画效果。创建动画效果的方法（在 jQuery 和 jQuery Mobile 中可用）包括：`animation()`、`clearQueue()`、`delay()`、`fadeIn()`、`fadeOut()`、`fadeToggle()`、`hide()`、`queue()`、`slideDown()`、`slideUp()`、`stop()`\
  \ 和 `toggle()`。本节包含 jQuery Mobile 中的代码示例。\n\n#### 淡入相关方法\n\n`fadeIn()` 和 `fadeOut()`\
  \ 方法提供了创建简单动画效果的方便方法。![image](img/cd.jpg) CD 上的 HTML5 Web 页面 `FadeInOut1.html` 展示了如何在\
  \ jQuery 页面中使用 `fadeIn()` 和 `fadeOut()` 方法，其主要逻辑如下：\n\n```html\n<body>\n  <div data-role=\"\
  page\" id=\"page1\">\n    <div id=\"header\" data-role=\"header\">\n      <h3>Click\
  \ To Show Text</h3>\n    </div>\n    <div id=\"context\" data-role=\"content\">\n\
  \      <img id=\"sample1\" src=\"Sample1.png\" width=\"200\" height=\"200\">\n \
  \     <img id=\"sample2\" src=\"Sample2.png\" width=\"200\" height=\"200\">\n  \
  \    <img id=\"sample3\" src=\"Sample3.png\" width=\"200\" height=\"200\">\n   \
  \   <p>Hello World from jQuery Mobile</p>\n      <p>Goodbye World from jQuery Mobile</p>\n\
  \      <p>Click on this text to toggle this paragraph.</p>\n    </div>\n    <div\
  \ data-role=\"footer\"><h3>Footer</h3></div>\n  </div>\n  <script>\n    $(\"#page1\"\
  ).live('pageinit', (function(event,ui){\n      var imgs = $(\"img\");\n      //\
  \ 当点击第一个 <img> 时，淡出\n      $(\"img:first\").click(function () {\n        $(\"img:first\"\
  ).fadeOut(\"slow\");\n      });   \n      // 当点击最后一个 <img> 时，显示第一个 <img>\n     \
  \ $(\"img:last\").click(function () {\n        $(\"img:first\").fadeIn(\"slow\"\
  );\n      });\n      // 当点击第一个 <p> 时，淡出\n      $(\"p:first\").click(function ()\
  \ {\n        $(\"p:first\").fadeOut(\"slow\");\n      });\n      // 当点击最后一个 <p>\
  \ 时，显示第一个 <p>\n      $(\"p:last\").click(function () {\n        $(\"p:first\").fadeIn(\"\
  slow\");\n      });\n    })\n  </script>\n</body>\n```\n\n\n\n\n\n当用户点击最右侧的图像时，第一张图像会再次缓慢显示：\n\
  \n```javascript\n// 当用户点击最后一张 <img> 标签时，显示第一个 <img> \n$(\"img:last\").click(function\
  \ () {\n    $(\"img:first\").fadeIn(\"slow\");\n});\n```\n\n你可以使用类似的代码块来捕获其他 HTML\
  \ 元素的事件。在这个示例中，我们也可以使用此片段获取所有的 `<p>` 元素：\n\n```javascript\nvar para = $(\"p\");\n\
  ```\n\n然而，在 `JQMFadeInOut1.html` 中，我们使用 `$(\"p:first\")` 和 `$(\"p:last\")` 引用第一个和最后一个\
  \ HTML `<p>` 元素，然后执行类似的淡入效果。\n\n图 8.3 显示了在 MacBook 的 Chrome 浏览器上横屏模式渲染 `JQMFadeInOut1.html`\
  \ 的结果。\n\n![image](img/fig8.3.jpg)\n\n**图 8.3** MacBook 上 Chrome 浏览器上的淡入效果。\n\n\
  ***\n\n## 与滑动相关的 jQuery 方法\n\n如你所推的，jQuery 的 `.slideUp()` 和 `.slideDown()` 方法为 jQuery\
  \ Mobile 提供了滑动相关的功能。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `JQMSlideUpDown1.html`\
  \ 展示了如何在 jQuery Mobile Web 页面中使用 jQuery 的 `.slideUp()` 和 `.slideDown()` 方法，这里显示了部分代码：\n\
  \n```html\n<body\n    <div data-role=\"page\" id=\"page1\">\n        <div data-role=\"\
  header\"><h3>Header</h3></div\n        <div data-role=\"content\">\n           \
  \ <p>点击我或其中一个矩形：</p>\n            <div name=\"first\" id=\"first\">First</div>\n\
  \            <div id=\"second\">Second</div>\n            <div id=\"third\">Third</div>\n\
  \            <div id=\"fourth\">Fourth</div>\n        </div>\n        <div data-role=\"\
  footer\"><h3>Footer</h3></div>\n    </div>\n    <script>\n        $(\"#page1\").live('pageinit',\
  \ (function(event,ui) {\n            $(\"#page1\").click(function() {\n        \
  \        if ($(\"div:first\").is(\":hidden\")) {\n                    $(\"div\"\
  ).show(\"slow\");\n                } else {\n                    $(\"div[name='first']\"\
  ).slideUp(2000);\n                }\n                $(\"div[name='first']\").css({background:'#00f'}).show(2000).hide(2000).slideDown(2000);\n\
  \            })\n        }))\n    </script>\n</body>\n```\n\nHTML5 Web 页面 `JQMSlideUpDown1.html`\
  \ 包含一个 `<style>` 元素，该元素使用 CSS 为矩形应用了一些样式，随后是一个处理页面中任意位置点击事件的代码块：\n\n```javascript\n\
  $(\"#page1\").click(function() {\n    // 处理页面上的事件\n}\n```\n\njQuery Mobile 代码的核心由一行代码组成，它使用链式调用创建一个多部分动画。每当用户点击矩形时，它会：1)\
  \ 将背景颜色更改为红色，2) 执行为期 2 秒的“显示”和“隐藏”效果，紧接着 3) 执行一个持续 2 秒的“滑动”效果，如下：\n\n```javascript\n\
  $(\"div[name='first']\").css({background:'#00f'}).show(2000).hide(2000).slideDown(2000);\n\
  ```\n\n图 8.4 显示了在带有 Android ICS 的 Asus 平板电脑上横屏渲染 `JQMSlideUpDown1.html` 的结果。\n\n\
  ![image](img/fig8.4.jpg)\n\n**图 8.4** 带有 Android ICS 的 Asus 平板电脑上的淡入效果。\n\n***\n\
  \n## jQuery Mobile 与过渡效果\n\njQuery Mobile 使用基于 WebKit 的 CSS3 变换来实现页面过渡动画，目前 Web\
  \ 浏览器对 CSS3 支持最好（但其他浏览器也在提高支持水平）。由于基于 WebKit 的浏览器使用硬件加速，CSS 动画效果在移动设备以及笔记本电脑和桌面设备上都显得非常流畅。你通过应用\
  \ `data-transition` 属性来指定过渡，其支持的七个值为：\n\n- `fade`：简单让页面或对话框从之前的内容淡入\n- `flip`：动画翻转，将当前视图旋转并显示另一面\n\
  - `pop`：页面从屏幕中心弹出视图\n- `slide`：从左侧或右侧滑入，将之前的内容推开\n- `slidedown`：从顶部向下滑动，越过当前内容\n\
  - `slideup`：向上滑动到顶部，显示后续内容\n\njQuery Mobile 还提供了 `animationComplete` 事件，这在添加或移除应用\
  \ CSS 过渡的类后可能非常有用。\n\n列表 8.2 显示了 `JQMTransition1.html` 的内容，展示了如何在 jQuery Mobile\
  \ 页面中使用 slidedown 和 flip 过渡。\n\n### 列表 8.2 JQMTransition1.html\n\n```html\n<body>\n\
  \    <div data-role=\"page\" id=\"first\">\n        <div data-role=\"header\"><h2>This\
  \ is the first page header</h2></div>\n        <div data-role=\"content\">\n   \
  \         <p>\n                <a href=\"#second\" data-transition=\"slidedown\"\
  >Go to Page Two</a>\n            </p>\n        </div>\n        <div data-role=\"\
  footer\"><h2>This is the first page footer</h2>\n    </div>\n    <div data-role=\"\
  page\" id=\"second\">\n        <div data-role=\"header\"><h2>This is the second\
  \ page header</h2></div>\n        <div data-role=\"content\">\n            <p>You\
  \ saw a slidedown effect\n                <a href=\"#first\" data-transition=\"\
  flip\" data-direction=\"reverse\">Go to Page #1 via 'flip' and reverse</a>\n   \
  \         </p>\n        </div>\n        <div data-role=\"footer\"><h2>This is the\
  \ second page footer</h2></div>\n    </div>\n</body>\n```\n\n列表 8.2 包含了 `JQMTransition1.html`\
  \ 的内容...\n\n\n\n\n```javascript\n{\n    'width':'200px',\n    'height':'200px'\n\
  });\n});\n\n$(\"#button1\").click(function() {\n    $(\"#sample2\").slideDown(800);\n\
  });\n$(\"#button2\").click(function() {\n    $(\"#sample2\").css({\n        'position':'relative',\n\
  \        'width':'100px',\n        'height':'100px'\n    });\n});\n})\n```\n\n列表\
  \ 8.3 渲染了两个图片并包含两个绑定到点击事件的按钮。视觉效果取决于点击按钮的顺序。当用户点击第二个按钮（“点击缩小右侧图像”）时，使用以下代码块，最右侧的图像将从初始的\
  \ 200x200 尺寸缩小为 100x100：\n\n```javascript\n$(\"#button2\").click(function() {\n\
  \  $(\"#sample2\").css({\n    'position':'relative',\n    'width':'100px',\n   \
  \ 'height':'100px'\n  });\n});\n```\n\n如你所见，前面的代码块使用 jQuery 的 `css()` 函数来修改最右侧图像的宽度高度，这意味着没有过渡效果。\n\
  \n接下来，如果用户悬停在最右侧的图像上（此时图像已缩小），由于以下代码块，图像将带有过渡效果缩小并消失：\n\n```javascript\n$(\"#sample2\"\
  ).hover(function() {\n    $(this).slideUp(800);\n});\n```\n\n现在，如果用户点击第一个按钮（“点击显示右侧图像”），由于以下代码，第二个图像将以其原始尺寸再次出现（再次使用了过渡效果）：\n\
  \n```javascript\n$(\"#button1\").click(function() {\n    $(\"#sample2\").slideDown(800);\n\
  });\n```\n\n这些代码示例说明了编写 jQuery 代码来为图片创建愉的动画效果是多么简单。此外，你可以将 jQuery 动画效果与 jQuery 的\
  \ `css()` 函数结合使用。例如，你可以使用 `css()` 函数在用户点击图像时渲染具有背景径向渐变效果的图像，或者更新该图像（或元素）的任何其他 CSS\
  \ 属性。\n\n因此，你可以结合对 jQuery 动画、CSS 以及 CSS3 图形和动画的知识，通过简单且紧凑的 jQuery 代码创建有趣的效果。\n\n\
