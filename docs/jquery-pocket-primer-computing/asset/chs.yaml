- "# Jquery 入门指南\n\n\n\n```xml\n<embed src=\"OEBPS/cover.xml\">\n```\n\n\n\n\n\n\n\
  \n\n\n![image](img/publisher.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n我想将这本书献给父母——愿这给他们的生活带来欢乐和幸福。\n\
  \n\n\n\n\n\n\n\n\n\nCSS3 支持广泛且丰富的伪类集，包括 `nth-child()` 以及一些语义相关的“变体”，如 `nth-of-type()`、`nth-first-of-type()`、`nth-last-of-type()`\
  \ 和 `nth-last-child()`。\n\nCSS3 还支持布尔选择器（也是伪类），如 `empty`、`enabled`、`disabled` 和\
  \ `checked`，这些对于表单相关的 HTML 元素非常有用。另一个伪类是 `not()`，它返回不符合选择标准的元素集。\n\n尽管本节重点是 `:nth-child()`\
  \ 伪类，但你将熟悉各种其他的 CSS 伪类。如果你需要使用那些伪类，在本节末尾提供链接，其中包含了更多信息和说明如何使用它们的示例。\n\n### CSS3\
  \ 伪类 (#toc.html_toc-h2-0011)\n\nCSS3 的 `:nth-child()` 伪类既强大又实用，其格式如下：\n\n`:nth-child(在此处插入关键字或线性表达式)`\n\
  \n以下列表提供了使用 `nth-child()` 伪类的各种示例，以匹配 HTML `<div>` 元素的子元素子集（元素也可以被其他 HTML 元素替换）：\n\
  \n```\ndiv:nth-child(1): 匹配第一个子元素\n```\n\n\n\n\n`div:nth-child(2)` 匹配第二个子元素\n\n\
  `div:nth-child(:even)` 匹配偶数子元素\n\n`div:nth-child(:odd)` 匹配奇数子元素\n\n`nth-child()`\
  \ 伪类有趣且强大的一点在于，它支持形式为 `an+b` 的线性表达式，其中 `a` 是正整数，`b` 是非负整数，如下所示（使用 HTML5 `<div>`\
  \ 元素）：\n\n`div:nth-child(3n)` 匹配从位置 0 开始的每第三个子元素\n\n`div:nth-child(3n+1)` 匹配从位置\
  \ 1 开始的每第三个子元素\n\n`div:nth-child(3n+2)` 匹配从位置 2 开始的每第三个子元素\n\n另一个非常有用的伪类涉及 `:hover`，它可以轻松创建精佳的视觉效果。以下\
  \ CSS3 `:hover` 伪类的示例展示了当用户用鼠标悬停在关联元素上时，更改 `id` 属性值为 `text1` 的元素的字体大小：\n\n```css\n\
  #text1:hover {\n  font-size: 12pt;\n}\n```\n\n## CSS3 属性选择\n\n你可以指定 CSS3 选择器来选择\
  \ HTML 元素，还可以根据正则表达式基于 HTML 元素的属性值选择 HTML 元素。例如，以下选择器选择了 `src` 属性以 `Laurie` 开头的元素，并将\
  \ `width` 和 `height` 属性设置为 `100px`：\n\n```css\nimg[src^=\"Laurie\"] {\n  width:\
  \ 100px;\n  height: 100px;\n}\n```\n\n当你想要根据图片的名称（`Laurie`、`Steve` 等）为图片设置不同的尺寸，上述\
  \ CSS3 选择器非常有用。以下 `<img>` 元素不匹配上述选择器：\n\n```html\n<img src=\"Laurie\" width=\"200\"\
  \ height=\"200\" />\n<img src=\"Laurrie\" width=\"200\" height=\"200\" />\n```\n\
  \nCSS3 使用元字符 `^`、`$` 和 `*`（后跟 `=` 符号）来匹配文本字符串的起始、结束或任意位置。如果你熟悉 Unix 工具 `grep`、`sed`\
  \ 以及 `vi` 编辑器，那么这些元字符对你来说非常熟悉。然而，CSS3 对元字符的使用施限制：它们只能在使用方括号的属性上下文中使用。以下选择器选择了 `src`\
  \ 属性以 `jpeg` 结尾的 HTML 元素，并将选中元素的 `width` 和 `height` 属性设置为 `150px`：\n\n```css\nimg[src$=\"\
  jpeg\"] {\n  width: 150px;\n  height: 150px;\n}\n```\n\n当你想要根据图片的类型（`jpg`、`png`\
  \ 等）为图片设置不同的尺寸，上述 CSS3 选择器非常有用。以下选择器选择了 `src` 属性包含文本字符串 `baby` 任意位置的 HTML 元素，并将选中元素的\
  \ `width` 和 `height` 属性设置为 `200px`：\n\n```css\nimg[src*=\"baby\"] {\n  width: 200px;\n\
  \  height: 200px;\n}\n```\n\n当你想要根据图片的“分类”（`mybaby`、`yourbaby`、`babyboy` 等）为图片设置不同的尺寸时，上述\
  \ CSS3 选择器非常有用。如果你想学习更多关于在 CSS 选择器中使用的模式（及其描述），可以在此处查看详尽列表：`http://www.w3.org/TR/css3-selectors`\n\
  \n本章的第一部分到此结束，下一节将深入探讨面向 CSS3 的效果，例如圆角和阴影效果。\n\n## CSS3 阴影效果与圆角\n\nCSS3 阴影效果对于创建生动的视觉效果非常有用。你可以对文本以及矩形区域使用阴影效果。CSS3\
  \ 还让你轻松渲染带圆角的矩形，因此你不需要 JPG 文件创建这种效果。\n\n## 使用 RGB 和 HSL 指定颜色\n\n在我们深入研究 CSS3 的有趣功能之前，你需要知道如何表示颜色。一种方法是使用\
  \ `(R, G, B)` 三元组代表颜色的红、绿、蓝分量。例如，三元组 `(255, 0, 0)`、`(255, 25, 0)` 和 `(0, 0, 255)`\
  \ 分别代表红色、黄色和蓝色。指定颜色的其他方法包括：十六进制三元组 `(F, 0, 0)` 和 `(FF, 0, 0)`；十进制三元组 `(100%, 0,\
  \ 0)`；或字符串 `#F00`。你也可以使用 `(R, G, B, A)`，其中第四个分量指定透明度，这是一个 `0`（透明）到 `1`（不透明）之间的小数。\n\
  \n然而，还有颜色的 `HSL`（色相、饱和度和亮度）表示，其中第一个分量是 `0` 到 `360` 之间的角度（0 度是北），另外两个分量是 `0` 到 `100`\
  \ 之间的百分比。例如，`(0, 100%, 50%)`、`(120, 100%, 50%)` 和 `(240, 100%, 50%)` 分别代表红色、绿色和蓝色。\n\
  \n书中的代码示例使用 `(R, G, B)` 和 `(R, G, B, A)` 表示颜色，但你可以可以通过搜索获取有关 `HSL` 的更多信息。\n\n##\
  \ CSS3 与文本阴影效果\n\n文本阴影效果可以使 Web 页面看起来更生动、吸引人。许多网站在使用对用户不会过强的阴影效果后看起来更好（除非你特别需要这样做）。\n\
  \n`Listing 2.1` 显示了 HTML5 页面 `TextShadow1.html` 的内容，说明了如何带阴影效果渲染文本，`Listing 2.2`\
  \ 显示了 `Listing 2.1` 引用的 CSS 样式表 `TextShadow1.css` 的内容。\n\n### 列表 2.1 TextShadow1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>CSS Text Shadow Example</title>\n  <link href=\"TextShadow1.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n  <div id=\"text1\">Line\
  \ One</div>\n  <div id=\"text2\">Line Two</div>\n  <div id=\"text3\">Line Three</div>\n\
  \  <div id=\"text4\"><span id=\"dd\">13</span><span id=\"mm\">August</span><span\
  \ id=\"yy\">2012</span></div>\n  <div id=\"text5\"><span id=\"dd\">13</span><span\
  \ id=\"mm\">August</span><span id=\"yy\">2012</span></div>\n  <div id=\"text6\"\
  ><span id=\"dd\">13</span><span id=\"mm\">August</span><span id=\"yy\">2012</span></div>\n\
  </body>\n</html>\n```\n\n`Listing 2.1` 中的代码非常直观：它引用了 `TextShadow1.css` 样式表，该表包含两个选择器。一个指定如何渲染\
  \ `id` 值为 `text1` 的 `<div>` 元素，另一个匹配 `id` 为 `text2` 的 `<div>` 元素。虽然示例包含了 CSS3 `rotate()`\
  \ 函数，但我们将在本章稍后详细讨论该函数。\n\n### 列表 2.2 TextShadow1.css\n\n```css\n#text1 {\n  font-size:\
  \ 24pt;\n  text-shadow: 2px 4px 5px #00f;\n}\n#text2 {\n  font-size: 32pt;\n  text-shadow:\
  \ 0px 1px 6px #000, 4px 5px #f00;\n}\n/* 注意 text-shadow 中的多个部分 */\n#text3 {\n  font-size:\
  \ 40pt;\n  text-shadow: 0px 1px 6px #fff, 2px 4px 4px #0ff, 4px 5px 6px #00f, 0px\
  \ 0px 10px #444, 0px 0px 20px #844, 0px 0px 30px #a44, 0px 0px 40px #f44;\n}\n#text4\
  \ {\n  position: absolute;\n  top: 200px;\n  right: 200px;\n  font-size: 48pt;\n\
  \  text-shadow: 0px 1px 6px #fff, 2px 4px 4px #0ff, 4px 5px 6px #00f, 0px 0px 10px\
  \ #000, 0px 0px 20px #448, 0px 0px 30px #a4a, 0px 0px 40px #fff;\n  -webkit-transform:\
  \ rotate(-90deg);\n}\n#text5 {\n  position: absolute;\n  left: 0px;\n  font-size:\
  \ 48pt;\n  text-shadow: 2px 4px 5px #00f;\n  -webkit-transform: rotate(-10deg);\n\
  }\n#text6 {\n  float: left;\n  font-size: 48pt;\n}\n```\n\n\n\n\n```css\n  text-shadow:\
  \ 2px 4px 5px #f00;\n\n  -webkit-transform: rotate(-170deg);\n\n}\n\n/* 'transform'\
  \ 稍后解释 */\n\n#text1:hover, #text2:hover, #text3:hover,\n\n#text4:hover, #text5:hover,\
  \ #text6:hover {\n\n-webkit-transform : scale(2) rotate(-45deg);\n\ntransform :\
  \ scale(2) rotate(-45deg);\n\n}\n```\n\n`Listing 2.2` 中的第一个选择器指定了 24 的 `font-size`\
  \ 以及一个 `text-shadow`，后者将渲染出具有蓝色背景的文本（由十六进制值 `#00f` 表示）。`text-shadow` 属性指定了（从左到右）阴影的\
  \ x 坐标、y 坐标、模糊半径以及颜色。第二个选择器指定了 32 的 `font-size` 和红色阴影背景（`#f00`）。第三个选择器通过指定 `text-shadow`\
  \ 属性中的多个组件创建了更丰富的视觉效果，这些组件是通过对不同组件的不同值进行效果实验而选出的。\n\n最后一个 CSS3 选择器每当用户悬停在六个文本字符串之一上时，都会创建一个动画效果，动画细节将在本章稍后部分介绍。\n\
  \n`Figure 2.1` 显示了 CSS 样式 `TextShadow1.css` 中的选择器与 HTML 页面 `TextShadow1.html` 中的\
  \ HTML `<div>` 元素匹配的结果。该横屏截图取自运行在 Nexus S 4G（Android ICS）智能手机上的 Android 应用（基于 `Listing\
  \ 2.1` 和 `Listing 2.2` 中的代码）。\n\n![image](img/fig2.1.jpg)\n\n**图 2.1** CSS3 文字阴影效果。\n\
  \n## CSS3 与外阴投影效果\n\n你也可以对包含文本字符串的框应用阴影效果，这对于吸引用户注意网页的特定部分非常有效。然而，关于过度使用的警告同样适用于外阴投影。\n\
  \n![image](img/cd.jpg)HTML 页面 `BoxShadow1.html` 和文件 `BoxShadow1.css` 在此处未显示，但可以在\
  \ CD 中找到。它们共同渲染出一个外阴投影效果。\n\n关键属性是 `box-shadow` 属性，在此处加粗显示 Mozilla、WebKit 以及不带前缀的属性：\n\
  \n```css\n#box1 {\n  position:relative;top:10px;\n  width: 50%;\n  height: 30px;\n\
  \  font-size: 20px;\n  -moz-box-shadow: 10px 10px 5px #800;\n  -webkit-box-shadow:\
  \ 10px 10px 5px #800;\n  box-shadow: 10px 10px 5px #800;\n}\n```\n\n`Figure 2.2`\
  \ 显示了一张带有 Android ICS 的 Nexus S 4G 的横屏截图（基于 `BoxShadow1.html` 和 `BoxShadow1.css`\
  \ 中的代码）。\n\n![image](img/fig2.2.jpg)\n\n**图 2.2** 带有 Android ICS 的 Sprint Nexus\
  \ 上的 CSS3 外阴投影效果。\n\n## CSS3 与圆角\n\nWeb 开发者等待 CSS 中的圆角已经很久，而 CSS3 非常容易地渲染带有圆角的框。`Listing\
  \ 2.3` 显示了 HTML 页面 `RoundedCorners1.html` 的内容，该页面在圆角框中渲染文本字符串，而 `Listing 2.4` 显示了\
  \ CSS 文件 `RoundedCorners1.css`。\n\n**LISTING 2.3 RoundedCorners1.html**\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <link href=\"RoundedCorners1.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n  <div id=\"outer\">\n\
  \    <a href=\"#\" class=\"anchor\">圆角矩形内的文本</a>\n  </div>\n  <div id=\"text1\"\
  >带有阴影效果的文本第一行</div>\n  <div id=\"text2\">带有阴影效果的文本第二行</div>\n</body>\n</html>\n\
  ```\n\n`Listing 2.3` 包含了对 CSS 样式表 `RoundedCorners1.css` 的引用，该样式表包含三个 CSS 选择器，分别匹配\
  \ `id` 属性 值为 `anchor`、`text1` 和 `text2` 的元素。`RoundedCorners1.css` 中的 CSS 选择器创建了视觉效果，正如你将看到的，悬停选择（hover）允许你创建动画效果。\n\
  \n**LISTING 2.4 RoundedCorners1.css**\n\n```css\na.anchor:hover {\n  background:\
  \ #00F;\n}\na.anchor {\n  background: #FF0;\n  font-size: 24px;\n  font-weight:\
  \ bold;\n  padding: 4px 4px;\n  color: rgba(255,0,0,0.8);\n  text-shadow: 0 1px\
  \ 1px rgba(0,0,0,4);\n  -webkit-border-radius: 8px;\n  border-radius: 8px;\n}\n\
  ```\n\n`Listing 2.4` 包含选择器 `a.anchor:hover`，每当用户用鼠标悬停在任何元素上时，它会在两秒的间隔内将文本颜色从黄色（`#FF0`）变为蓝色（`#00F`）。选择器\
  \ `a.anchor` 包含各种属性，用于指定包裹 `<a>` 元素的框的尺寸，以及两对属性。第一对指定了 `border-radius` 属性（以及 WebKit\
  \ 特有的属性），其值为 `8px`，这决定了包裹文本的框圆角的半径（像素）。最后两个选择器与选择器中的选择器相同。\n\n\n\n\n\n```css\n{\n\
  \  font-size: 32px;\n  background-image: -webkit-gradient(linear, 100% 0%, 0% 100%,\
  \ from(#fff), to(#ff0));\n  background-image: -gradient(linear, 100% 0%, 0% 100%,\
  \ from(#fff), to(#ff0));\n  -webkit-border-radius: 4px;\n  border-radius: 4px;\n\
  }\n\n#line3 {\n  width: 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear,\
  \ 0% 0%, 0% 100%, from(#f00), to(#00f));\n  background-image: -gradient(linear,\
  \ 0% 0%, 0% 100%, from(#f00), to(#00f));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n\n#line4 {\n  width: 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear,\
  \ 100% 0%, 0% 100%, from(#f00), to(#00f));\n  background-image: -gradient(linear,\
  \ 100% 0%, 0% 100%, from(#f00), to(#00f));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n\n#outline {\n  font-size: 2.0em;\n  font-weight: bold;\n  color: #fff;\n\
  \  text-shadow: 1px 1px 1px rgba(0,0,0,0.5);\n}\n\nh3 {\n  width: 50%;\n  position:\
  \ relative;\n  margin-top: 0;\n  font-size: 32px;\n  font-family: helvetica, ariel;\n\
  }\n\nh3 a {\n  position: relative;\n  color: red;\n  text-decoration: none;\n  -webkit-mask-image:\
  \ -webkit-gradient(linear, left top, left bottom, color(rgba(0,0,0,1)), color-stop(50%,\
  \ rgba(0,0,0,0.5)), to(rgba(0,0,0,0)));\n}\n\nh3:after {\n  content: \"This is a\
  \ Line of Gradient Text\";\n  color: blue;\n}\n```\n\n代码列表 2.6 中的第一个选择器指定了文本的 `font-size`\
  \ 为 32，`border-radius` 为 4（渲染为圆角），以及一个从白色到蓝色的线性渐变，如下所示：\n\n```css\n#line1 {\n  width:\
  \ 50%;\n  font-size: 32px;\n  background-image: -webkit-gradient(linear, 0% 0%,\
  \ 0% 100%, from(#fff), to(#f00));\n  background-image: -gradient(linear, 0% 0%,\
  \ 0% 100%, from(#fff), to(#f00));\n  -webkit-border-radius: 4px;\n  border-radius:\
  \ 4px;\n}\n```\n\n如你所示，第一个选择器包含了两个带有 `-webkit` 前缀的属性和两个不带该前缀的标准属性。由于代码列表 2.6 中的后续三个选择器与第一个选择器相似，我们不再讨论它们的内容。下一个选择器通过将文本渲染为白色并带有细阴影，创建一个带有漂亮阴影的文本轮廓，如下所示：\n\
  \n```css\ncolor: #fff;\ntext-shadow: 1px 1px 1px rgba(0,0,0,0.5);\n```\n\n代码列表 2.6\
  \ 的最后部分包含了三个影响 `<h3>` 元素及其嵌入 `<a>` 元素渲染的选择器。`h3` 选择器指定了宽度和字体大小；`h3` 选择器指定了线性渐变；而\
  \ `h3:after` 选择器指定在 HTML5 `<h3>` 元素之后显示文本“This is a Line of Gradient Text”（*注*：你可以使用\
  \ `h3:before` 在 HTML5 `<h3>` 元素之前指定文本字符串）。还指定了其他属性，但这些是这些选择器的主要属性。图 2.4 显示了将 CSS\
  \ 样式表 `Gradient1.css` 中的选择器与 HTML 页面 `Gradient1.html` 匹配的结果，该结果取自一张在运行 Android ICS\
  \ 的 Asus Prime 平板的 Android 应用中拍摄的横屏截图。\n\n## 径向渐变\n\nCSS3 径向渐变比 CSS3 线性渐变更复杂，但你可以使用它们来创建更复杂的特效。基于\
  \ Webkit 的浏览器支持以下语法来定义径向渐变：\n\n*   起始点\n*   起始半径\n*   结束点\n*   结束半径\n*   使用 `from()`\
  \ 指定的起始颜色\n*   零个或多个颜色停止点\n*   使用 `to()` 指定的结束颜色\n\n![image](img/fig2.4)\n**图 2.4**\
  \ 在 Asus Prime 平板上的 CSS3 线性渐变效果\n\n注意，径向渐变的语法与线性渐变相似，但你还指定了起始半径和结束半径。![image](img/cd)\n\
  \nHTML5 页面 `Gradient1.html` 和 CSS 样式表 `Gradient1.css` 在此处未显示，但完整的代码如下块所示：\n\n```html\n\
  <div id=\"outer\">\n  <div id=\"radial3\">Text3</div>\n  <div id=\"radial2\">Text2</div>\n\
  \  <div id=\"radial4\">Text4</div>\n  <div id=\"radial1\">Text1</div>\n</div>\n\
  ```\n\nCSS 样式表 `Gradient1.css` 包含了五个 `<div>` 元素的选择器，其中之一所示：\n\n```css\n#radial1\
  \ {\n  background: -webkit-gradient(radial, 0% 0%, 0% 100%, from(red), color_stop(0.05,\
  \ orange), color_stop(0.4, yellow), color_stop(0.6, green), color_stop(0.8, blue),\
  \ to(white));\n}\n```\n\n`#radial1` 选择器使用 `-webkit` 前缀定义了径向渐变，并指定了：\n\n*   起始点 (500%,\
  \ 40%)\n*   起始半径 0\n*   结束点 (301%, 25%)\n*   结束半径 360\n*   起始颜色红色\n*   结束颜色白色\n\n\
  选择器与第一个选择器语法相同，但渲染的径向渐变效果不同。通过指定不同的起始点和结束点，以及指定比结束半径大的起始半径，你可以创建这些（其他的）特效。图 2.5\
  \ 显示了将 CSS 样式表 `Gradient1.css` 中的选择器与 HTML 页面 `Gradient1.html` 匹配的结果，该结果取自一张在运行\
  \ Android ICS 的 Asus Prime 平板的 Android 应用中拍摄的横屏截图。\n\n### CSS3 2D 变换](#toc.html-h1-0013)\n\
  \n除了过渡之外，CSS3 还支持四种可以应用于 2D 形状以及 JPG 文件的常用变换。这四种 CSS3 变换是比例（scale）、旋转（rotate）、倾斜（skew）和平移（translate）。后续章节包含代码示例，说明如何将这些\
  \ CSS3 变换应用于一组 JPG 文件。当用户悬停在任何 JPG 文件上会发生动画效果；此外，通过在相邻 JPG 文件之间快速移动，可以创建“部分”动画。列表\
  \ 2.7 显示了 `Scale1.html` 的内容，而列表 2.8 显示了 `Scale1.css` 的内容，它们说明了如何缩放 JPG 文件创建一个“悬停框”图库。\n\
  \n\n\n\n\n```css\nimg.scaled {\n  -webkit-box-shadow: 10px 10px 5px #800;\n  box-shadow:\
  \ 10px 10px 5px #800;\n}\n\nimg.scaled:hover {\n  -webkit-transform : scale(2);\n\
  \  transform : scale(2);\n}\n```\n\n列表 2.8 中的 `img` 选择器指定了一个 `transition` 属性，该属性使用\
  \ `ease` 函数在了一秒的间隔内应用 `transform` 变换效果，如下所示：\n\n```css\ntransition: transform 1.0s\
  \ ease;\n```\n\n接下来，选择器 `img.scaled` 指定了一个 `box-shadow` 属性，该属性创建一个红色的阴影效果（你在本章之前的章节已经见过它），如下所示：\n\
  \n```css\nimg.scaled {\n  -webkit-box-shadow: 10px 10px 5px #800;\n  box-shadow:\
  \ 10px 10px 5px #800;\n}\n```\n\n最后，选择器 `img.scaled:hover` 指定了一个 `transform` 属性，该属性使用\
  \ `scale()` 函数，每当用户鼠标悬停在任何 `<img>` 元素上时，将关联 JPG 文件的大小翻倍，如下所示：\n\n```css\ntransform\
  \ : scale(2);\n```\n\n由于 `img` 选择器使用 `ease` 函数指定了一秒的间隔，因此缩放效果将持续一秒钟。尝试 CSS3 `scale()`\
  \ 函数的不同值，也尝试时间间隔的不同值，以创建符合你需求的的动画效果。\n\n另一个需要记住的点是，你可以同时对水平和垂直进行缩放：\n\n```css\n\
  img {\n  -webkit-transition: -webkit-transform 1.0s ease;\n  transition: transform\
  \ 1.0s ease;\n}\n\nimg.mystyle:hover {\n  -webkit-transform : scaleX(1.5) scaleY(0.5);\n\
  \  transform : scaleX(1.5) scaleY(0.5);\n}\n```\n\n图 2.6 显示了将 CSS 样式 `Scale1.css`\
  \ 中的选择器与 HTML 页面 `Scale1.html` 匹配的结果。该横屏截图截自运行在带有 Android ICS 的 Nexus S 4G 智能手机上的\
  \ Android 应用（基于 列表 2.7 和 列表 2.8 中的代码）。\n\n# 旋转变换](#toc.html_toc-h2-0019)\n\nCSS3\
  \ `transform` 属性允许你指定 `rotate()` 函数来创建缩放效果，其语法如下：\n\n```css\nrotate(someValue);\n\
  ```\n\n你可以将 `someValue` 替换为任何数字。当 `someValue` 为正数时，旋转为顺时针方向；当 `someValue` 为负数时，旋转为逆时针方向；当\
  \ `someValue` 为零时，则没有旋转效果。在所有情况下，旋转效果的初始位置都是正水平轴。\n\n![image](img/fig2.6.jpg)\n\n\
  ***图 2.6*** 基于 CSS3 的 JPG 文件缩放效果。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `Rotate1.html`\
  \ 和 CSS 样式表 `Rotate1.css` 阐了如何创建旋转效果，其示例所示：\n\n```css\nimg.imageL:hover {\n  -webkit-transform\
  \ : scale(2) rotate(-45deg);\n  transform : scale(2) rotate(-45deg);\n}\n```\n\n\
  `img` 选择器指定了一个 `transition` 属性，该属性使用 `ease` 计时函数在了一秒的间隔内创建一个动画效果，如下所示：\n\n```css\n\
  transition: transform 1.0s ease;\n```\n\nCSS3 `transform` 属性允许你指定 `skew()` 函数来创建倾斜效果，其语法如下：\n\
  \n```css\nskew(xAngle, yAngle);\n```\n\n你可以将 `xAngle` 和 `yAngle` 替换为任何数字。当 `xAngle`\
  \ 和 `yAngle` 为正数时，倾斜效果为顺时针方向；当 `xAngle` 和 `yAngle` 为负数时，倾斜效果为逆时针方向；当 `xAngle` 和\
  \ `yAngle` 为零时，则没有倾斜效果。在所有情况下，倾斜效果的初始位置都是正水平轴。\n\n![image](img/cd.jpg) HTML5 页面\
  \ `Skew1.html` 和 CSS 样式表 `Skew1.css` 在 CD 上，它们阐述了如何创建倾斜效果。CSS 样式表包含 `img` 选择器，它指定了一个\
  \ `transition` 属性，反而使用 `ease` 计时函数在了一秒的间隔内创建一个动画效果，如下所示：\n\n```css\ntransition:\
  \ transform 1.0s ease;\n```\n\n还有四个选择器 `img.skewed1`、`img.skewed2`、`img.skewed3`\
  \ 和 `img.skewed4` 创建了深浅不一的红色、黄色的背景阴影效果。每当用户鼠标悬停在任何 `<img>` 元素上时，`transform` 属性就会执行变换效果，如下所示：\n\
  \n```css\ntransform : scale(2);\n```\n\n`img` 选择器指定了一个 `transition` 属性，该属性使用 `ease`\
  \ 计时函数在了一秒的间隔内创建一个动画效果，如下所示：\n\n图 2.7 显示了将 CSS 样式 `Scale1.css` 中的选择器与 HTML 页面 `Scale1.html`\
  \ 匹配的结果。该横屏截图截自运行在带有 Android ICS 的 Nexus S 4G 智能手机上的 Android 应用。\n\n![image](img/fig2.7.jpg)\n\
  \n***图 2.7*** 基于 CSS3 的缩放效果。\n\nCSS3 `transform` 属性允许你指定 `translate()` 函数来创建位移效果，其语法如下：\n\
  \n```css\ntranslate(xDirection, yDirection);\n```\n\n位移相对于屏幕的左上角。因此，`xDirection`\
  \ 和 `yDirection` 的正值会向右和向下位移，而 `xDirection` 和 `yDirection` 的负值会向左和向上位移。而 `xDirection`\
  \ 和 `yDirection` 为零时不会产生位移。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `Rotate1.html`\
  \ 和 CSS 样式表 `Rotate1.css` 阐述了如何创建位移效果，其示例所示：\n\n```css\nimg.trans2:hover {\n  -webkit-transform\
  \ : scale(0.5) translate(-50px, -50px);\n  transform : scale(0.5) translate(-50px,\
  \ -50px);\n}\n```\n\nCSS 样式表包含 `img` 选择器，它指定了一个 `transition` 属性，反而使用 `ease` 计时函数在了一秒的间隔内创建一个动画效果，如下所示：\n\
  \n```css\ntransition: transform 1.0s ease;\n```\n\n四个选择器 `img.trans1`、`img.trans2`、`img.trans3`\
  \ 和 `img.trans4` 创建了深浅不一的红色、黄色、绿色和蓝色的阴影效果，正如你在之前的章节中看到的那样。每当用户鼠标悬停在 `<img>` 元素上时，`transform`\
  \ 属性就会执行缩放效果和位移效果，如下所示：\n\n```css\ntransform : scale(2) translate(100px, 50px);\n\
  ```\n\n由于 `img` 选择器使用 `ease` 函数指定了一秒的间隔，因此位移效果将持续一秒钟。\n\n## CSS3 媒体查询\n\nCSS 媒体查询\
  \ (Media Queries)\n\n CSS 媒体查询是非常有用的逻辑表达式，允许你检测具有不同物理属性的应用程序。例如，通过 CSS 媒体查询，你可以更改应用程序的尺寸和布局，使其在智能手机和平板上正确显示。\n\
  \n具体来说，你可以使用 CSS 媒体查询来确定以下特征：\n\n*   浏览器窗口宽度和高度\n*   设备宽度和高度\n*   方向（横屏或竖屏）\n* \
  \  横宽比\n*   设备横宽比\n*   分辨率\n\n\n\n\n\n例如，下面的 `link` 元素仅在设备为屏幕且设备最大宽度为 480px 时加载\
  \ CSS 样式表 `mystuff.css`：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ media=\"screen and (max-device-width: 480px)\" href=\"mystuff.css\"/>\n```\n\n\
  前面的 `link` 包含一个 `media` 属性，它指定了两个组件：媒体类型 `screen`，以及一个指定 `max-device-width` 值为 `480px`\
  \ 的查询。CSS3 媒体查询中 `media` 的支持值为 `braille`、`embossed`、`handheld`、`print`、`projection`、`screen`、`speech`、`tty`\
  \ 和 `tv`。\n\n下一个 CSS3 媒体查询检查媒体类型、设备最大宽度以及分辨率：\n\n```css\n@media screen and (max-device-width:\
  \ 480px) and (resolution: 160dpi) {\n  #innerDiv {\n    float: none;\n  }\n}\n```\n\
  \n如果上述代码段中的 CSS3 媒体查询为真，则嵌套的 CSS 选择器将匹配 `id` 属性值为 `innerDiv` 的 HTML 元素，并在任何最大屏幕宽度为\
  \ 480px 的设备上，其 `float` 属性将被设置为 `none`。如你所示，可以创建包含非平凡逻辑的紧凑 CSS3 媒体查询，这显然有用，因为 CSS3\
  \ 没有像其他编程语言那样的 if/then/else 结构。\n\n![image](img/cd.jpg) CD 额外代码示例\n\nCSS 样式表 `CSS3MediaQuery1.css`\
  \ 和 HTML5 网页 `CSS3MediaQuery1.html` 阐明了如何使用媒体查询在用户旋转移动设备时更改两个图像的大小。\n\n![image](img/cd.jpg)\
  \ 你可以使用简单的 JavaScript 代码检测移动设备方向变化，因此你并不“被迫”使用 CSS3 媒体查询。CD 上的 HTML5 网页 `CSS3OrientationJS1.html`\
  \ 阐明了如何使用标准 JavaScript 在用户旋转移动设备时更改两个图像的大小。\n\n从本质上说，代码使用变量 `window.orientation`\
  \ 的值来检测移动设备的四种不同方向。在每四种情况下，JPG 文件的尺寸都会使用以下类型的代码更新：\n\n```javascript\ndocument.getElementById(\"\
  img1\").style.width = \"120px\";\ndocument.getElementById(\"img1\").style.height\
  \ = \"300px\";\n```\n\n尽管这是一个非常简单的示例，但希望这段代码能让你领会 CSS3 媒体查询的能力。\n\n### 总结\n\n本章向你展示了如何创建图形效果、阴影效果以及如何在\
  \ CSS3 中使用变换（transforms）。你学习了如何创建可以应用到 HTML 元素的动画效果，并看到了如何定义 CSS3 选择器来完成以下操作：\n\n\
  *   渲染圆矩形\n*   为文本和 2D 形状创建阴影效果\n*   创建线性渐变和径向渐变\n*   使用 `translate()`、`rotate()`、`skew()`\
  \ 和 `scale()` 方法\n*   创建基于 CSS3 的动画效果\n\n## 第 3 章\n\n### 使用 JQUERY 和 CSS3 实现动画效果\n\
  \n本章向你展示了如何创建能够产生动画效果并为用户提供交互性的 HTML5 网页。你将看到一系列创建各种动画效果的 `jQuery` 函数，你可以轻松地将它们整合到你的\
  \ HTML5 网页中。这个内容极其丰富的章节旨在为你提供许多动画效果，以及一系列代码示例和代码片段，你可以将这些内容整合到你的其他 HTML5 网页中。\n\n\
  本章的第一部分向你展示了如何使用 `jQuery` 通过设置 CSS3 选择器中的属性值来操作元素的属性，以及使用 `animate` 和 `effect` 创建动画效果的示例。你将看到创建基于滑动和淡入淡出（`fadeIn`、`fadeOut`、`fadeTo`）动画效果的代码示例。本节还阐明了如何结合\
  \ `jQuery` 和 CSS3 `keyframes` 来创建 2D 动画效果。\n\n本章的第二部分阐明了如何创建一个“跟随鼠标”的 HTML5 网页，该网页使用\
  \ CSS3 实现视觉效果，并使用 `jQuery` 更新渐变填充矩形的位置。记住，书中的 CSS3 示例专为基于 WebKit 的浏览器设计，但你可以修改代码示例以包含特定厂商的前缀，以便代码示例可以在其他浏览器中运行。本章的最后一个示例阐明了如何使用\
  \ `jQuery` 插件通过 `jQuery` 渲染 SVG。\n\n注意，本章涵盖了 `jQuery` 动画效果，第七章包含了一些使用 `jQuery Mobile`\
  \ 的相应动画效果，这两个章节都包含了基于 CSS3 的动画效果。由于空间限制，本章仅涵盖了 `jQuery` 可部分动画功能。你可以通过阅读在线 `jQuery`\
  \ 文档或在互联网上搜索额外的教程和文章来学习更多 `jQuery` 动画。\n\n## 在 jQuery 中处理 CSS3 选择器\n\n本节包含代码示例，阐明了如何使用\
  \ `jQuery` 程序化创建 CSS 类，例如圆角、渐变和阴影效果。\n\n### jQuery 中的基础动画效果\n\n本节包含代码片段而非完整列表，这些代码片段阐明了如何使用\
  \ `hide()` 和 `show()` 创建动画效果。请记住本节仅涵盖了可用功能的一部分。请务必阅读在线文档。\n\n`hide()` 和 `show()`\
  \ 函数允许你更改元素的可见性。例如，下面的代码在用户点击第一个按钮时隐藏第二个按钮；当用户双击第一个按钮时，第二个按钮变为可见：\n\n```javascript\n\
  $(\"#myButton1\").click(function() {\n  $(\"#myButton2\").hide();\n});\n\n$(\"#myButton1\"\
  ).dblclick(function() {\n  $(\"#myButton2\").show();\n});\n```\n\n`toggle` 函数可以处理同一事件的多次发生。例如，下面的代码处理元素的一次、两次或三次点击：\n\
  \n```javascript\n$(\"#myDiv1\").toggle(\n  function() {\n    $(\"myText\").text(\"\
  第一次点击\");\n  },\n  function() {\n    $(\"#myText\").text(\"第二次点击\");\n  },\n  function()\
  \ {\n    $(\"#myText\").text(\"第三次点击\");\n  }\n);\n```\n\n两个非常有用的 `jQuery` 方法是 `removeClass()`\
  \ 和 `addClass()`，分别移除或添加 CSS 类，示例所示：\n\n```javascript\n$(\"#myDiv1\").toggle(\n\
  \  function() {\n    $(\"myText\").addClass(\"shiny\");\n  },\n  function() {\n\
  \    $(\"#myText\").addClass(\"dark\");\n  }\n);\n```\n\n`addClass()` 方法添加 CSS 类，而\
  \ `toggleClass()` 方法则“切换” CSS 类；即：如果类不存在则添加，如果已包含则移除。\n\n其他相关的 `jQuery` 方法包括 `fadeClass()`（使用淡入淡出效果）和\
  \ `slideClass()`（创建滑动效果）。\n\n### 使用回调函数\n\n许多 `jQuery` 函数（包括 `hide()`、`show()`、`toggle()`\
  \ 和相关的滑动函数）允许你指定一个回调函数，该函数将在指定的操作完成后执行。例如，你可以定义以下代码块：\n\n```javascript\n$(\"#myButton1\"\
  ).click(function() {\n  $(\"#myButton2\").hide('slow',\n```\n```\n\n\n\n\n\n```javascript\n\
  function callback() {\n  // do something else\n});\n});\n```\n\n当用户点击 id 为 `myButton1`\
  \ 的元素时，前面的代码块会缓慢隐藏 id 为 `myButton2` 的元素，在动画完成后，将执行 `callback` 函数中的代码。\n\n本书包含了基于\
  \ WebKit 的代码示例，但如果你决定在 IE 中使用上述代码块，请记住 IE 在回调函数中使用命名函数（named functions）时存在一个 bug。下文的文章提供了关于命名函数的有用信息：\n\
  \n[`kangax.github.com/nfe`](http://kangax.github.com/nfe)\n\n## jQuery 渐隐和滑动动画效果\n\
  \njQuery 与淡入（fade）和滑动（slide）相关的效果很容易创建，如果你定义得当，它们可以在你的 Web 页面中创建出非常佳的视觉效果。\n\n下面的示例结合了\
  \ jQuery 的 `.fadeIn()` 和 `.fadeOut()` 函数，并向你展示了如何链式调用这些函数，以便创建多个动画效果。\n\n## fadeIn(),\
  \ fadeOut(), 和 fadeToggle() 函数\n\n这三个 jQuery 方法 `.fadeIn()`、`.fadeOut()` 和 `.fadeToggle()`\
  \ 可以指定三个参数，其语法所示：\n\n`jQuery(list-of-elements).fadeIn(speed);`\n\n`jQuery(list-of-elements).fadeOut(speed);`\n\
  \n`jquery(list-of-elements).fadeTo(speed);`\n\n下面的代码块阐述了如何使用这三个 jQuery 函数：\n\n```javascript\n\
  $(\"#something\").click(function() {\n  $(this).fadeIn('slow');\n});\n\n$(\"#something\"\
  ).click(function() {\n  $(this).fadeOut('slow');\n});\n\n$(\"#something\").click(function()\
  \ {\n  $(this).fadeTo('slow', .65);\n});\n```\n\n`Listing 3.1` 显示了 `FadeInOut.html`\
  \ 的内容，并阐明了如何在 jQuery 中执行简单和链式的渐变效果。\n\n### 列表 3.1 FadeInOut.html\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>jQuery\
  \ Fade-Related Effects</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <div>\n    <div> <p>来自 jQuery 的 Hello World (悬停在我身上)</p> </div>\n\
  \    <div> <p>来自 jQuery 的 Goodbye World (悬停在我身上)</p> </div>\n    <div>\n      <input\
  \ type=\"button\" id=\"button1\" value=\"隐藏我\" />\n    </div>\n  </div>\n  <script>\n\
  \    $(document).ready(function(){\n      var para = $(\"div > p\");\n      para.each(function(){\n\
  \        var p = $(this);\n        p.append('<span style=\"color:red;font-size:18px\"\
  '+'>这段文字在悬停时会渐变</span>');\n      });\n      para.hover(function() {\n        //\
  \ 你可以使用使用 'slow' 或 'fast'\n        //$(this).find(\"span\").fadeIn(\"slow\");\n\
  \        $(this).find(\"span\").fadeIn(3000).fadeOut(\"fast\").fadeIn(\"slow\");\n\
  \      }, function() {\n        //$(this).find(\"span\").hide();\n        $(this).find(\"\
  span\").fadeOut(2000).fadeIn(\"slow\").fadeOut(\"fast\").fadeIn(2000).fadeOut(\"\
  slow\");\n      });\n      $(\"#button1\").click(function() {\n        $(this).fadeOut(2000,\
  \ function() {\n          //$(this).remove();\n        });\n      });\n    });\n\
  \  </script>\n</body>\n</html>\n```\n\n`Listing 3.1` 以两个 `<div>` 元素和一个 `<button>`\
  \ 元素开始，随后是用于将渐变效果应用到 `<p>` 元素的 jQuery 代码。需要注意的第一点是 JavaScript 变量 `para`，它存储了对 `<div>`\
  \ 元素子元素 `<p>` 元素的引用，所示：\n\n```javascript\n$(document).ready(function(){\n  var para\
  \ = $(\"div > p\");\n  // 省略代码\n}\n```\n\n接下来的代码块为 `para` 变量中引用的 `<p>` 元素动态添加一个\
  \ `<span>` 元素：\n\n```javascript\npara.each(function(){\n  var p = $(this);\n  p.append('<span\
  \ style=\"color:red;font-size:18px\"'+'>这段文字在悬停时会渐变</span>');\n});\n```\n\n当用户悬停在任何\
  \ `<p>` 元素上时，jQuery 代码使用方法链为 `<p>` 元素创建了多个渐变相关的效果。示例如所示：\n\n```javascript\n$(this).find(\"\
  span\").fadeOut(2000).fadeIn(\"slow\").fadeOut(\"fast\").fadeIn(2000).fadeOut(\"\
  slow\");\n```\n\n你可以使用 jQuery 方法将效果应用到当前焦点元素以外的元素上。例如，如果你想在悬停事件期间隐藏一个兄弟元素，你可以这样做：\n\
  \n`$(this).next().fade();`\n\n下一节将向你展示如何使用滑动相关函数创建滑动动画效果。\n\n## jQuery 滑动相关函数\n\n\
  jQuery 的 `.slideUp()`、`.slideDown()` 和 `.slideToggle()` 方法可以指定三个参数，它们的语法如下：\n\n\
  `jQuery(elements).slideUp([speed], [easing], [callback]);`\n\n`jQuery(elements).slideDown([speed],\
  \ [easing], [callback]);`\n\n`jQuery(elements).slideToggle([speed], [easing], [callback]);`\n\
  \n`milliseconds` 指定动画的持续时间，而 `callback` 是动画完成后执行的可选 JavaScript 函数。`Listing 3.2`\
  \ 显示了 `QSlideUpDown.html` 的内容，并阐明了如何在 jQuery 中执行简单和链式的滑动。\n\n### 列表 3.2 QSlideUpDown.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>Slide-Related Effects</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <div>\n    <div> <p>来自 jQuery 的 Hello World (悬停在我身上)</p> </div>\n\
  \    <div> <p>来自 jQuery 的 Goodbye World (悬停在我身上)</p> </div>\n    <div>\n      <input\
  \ type=\"button\" id=\"button1\" value=\"点击向上滑动隐藏\" />\n    </div>\n  </div>\n \
  \ <script>\n    $(document).ready(function(){\n      var para = $(\"div > p\");\n\
  \      para.each(function(){\n        var p = $(this);\n        p.append('<span\
  \ style=\"color:red;font-size:18px\"'+'>这段文字在悬停时会滑动</span>');\n      });\n     \
  \ para.hover(function() {\n        // 你可以使用 'slow' 或 'fast'\n        //$(this).find(\"\
  span\").slideDown(\"slow\");\n        $(this).find(\"span\").slideDown(3000).slideUp(\"\
  fast\").slideDown(\"slow\");\n      }, function() {\n        //$(this).find(\"span\"\
  ).hide();\n        $(this).find(\"span\").slideUp(2000).slideDown(\"slow\").slideUp(\"\
  fast\").slideDown(2000).slideUp(\"slow\");\n      });\n      $(\"#button1\").click(function()\
  \ {\n        $(this).slideUp(2000, function() {\n          //$(this).remove();\n\
  \        });\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n`Listing\
  \ 3.2` 与 `Listing 3.1` 类似，只是使用了滑动相关的 jQuery 方法代替了渐变相关的 jQuery 方法，且该代码示例的描述与 `Listing\
  \ 3.1` 的描述对应。\n\n需要记住的一点是，对于具有 CSS `padding` 或 `margin` 属性或 `width` 属性未设置为固定宽度的元素，滑动效果并不并不总是符合预期（可能会出现一些抖动）。尝试这些场景，看看结果行为是否符合你的预期，或者是否对你的\
  \ Web 页面来说是可以接受的。\n\n## jQuery 中的缓动函数\n\n\n\n\n\n`jQuery` 支持一组所谓的“缓动（easing）”函数，这些函数提供了不同类型的动画效果。通俗来说，缓动函数使用某种方程作为动画效果的路径。例如，你可以使用线性方程来创建恒定速度的动画。你也可以使用二次方程（二阶多项式，其通用形式为\
  \ `a*x*x+b*x+c`）来创建具有加速度的动画效果，或用于二次贝塞尔曲线，并使用三次方程用于三次贝塞尔曲线。\n\n`jQuery` 还为某些动画提供了缓动函数，这些动画在缓动函数的不同位置的速度更为复杂（先慢、快、后慢）。在搜索\
  \ `jQuery` 插件之前，非常值得花时间探索现有的 `jQuery` 缓动函数，其中一些：`linear`、`easeInQuad`、`easeOutQuad`、`easeInCubic`、`easeOutCubic`、`easeInOutCubic`、`easeInSine`、`easeOutSine`、`easeInOutSine`、`easeInElastic`、`easeOutElastic`\
  \ 和 `easeInOutElastic`。\n\n你可以找到许多链接，它们提供了 `jQuery` 缓动函数的详尽演示，包括此处所示：\n\n[`jqueryui.com/demos/effect/easing.html`](http://jqueryui.com/demos/effect/easing.html)\n\
  \n此外，还有许多 `jQuery` 插件可用于自定义动画相关的缓动函数，或者如果你无法找到符合你要求的插件，也可以创建自己的 `jQuery` 插件。\n\n\
  ## jQuery .animate() 方法\n\n`jQuery` 的 `animate()` 方法可以接受四个参数，它们看起来如下：\n\n```javascript\n\
  jQuery(elements).animate([properties],\n    [milliseconds],\n    [easing-function],\n\
  \    [complete-function]);\n```\n\n`properties` 参数包含要动画的属性列表，而 `milliseconds` 参数指定动画效果的持续时间。`easing-function`\
  \ 参数指定上一节讨论的缓动函数之一，而 `complete-function` 参数指定在动画效果完成后执行的 JavaScript 回调函数。\n\n![image](img/cd.jpg)\
  \ CD 上的 HTML5 页面 `JQAnimate1.html` 示例了如何使用 `jQuery` `animate()` 函数在两个 PNG 文件上创建动画效果。\n\
  \n该 HTML5 页面包含两个 PNG 图像，以及针对两个 HTML `<button>` 元素的 jQuery 点击处理器。每当用户点击左侧按钮时，`jQuery`\
  \ 代码会将 PNG 的透明度从 `1.0` 降低到 `0.25`，将图像文件向右移动 50 个单位，并在五秒内将其高度增加 100 个单位，如下：\n\n```javascript\n\
  $('#text1').animate({\n    opacity: 0.25,\n    left: '+=50',\n    height: '+=100'\n\
  }, 5000, function() {\n    // 动画完成（执行其他操作）\n});\n```\n\n每当用户点击第二个按钮时，`jQuery` 代码会对右侧图像文件执行类似的动画效果。启动\
  \ Listing 3.2 中的代码并点击按钮查看动画效果。\n\n你可以在 HTML5 页面 `JQAnimate2.html` 查看 Listing 3.2\
  \ 中动画效果的变体，以及 `JQAnimate2.html` 页面中的顺序和并行动画效果，两者均可在 CD 上获得。\n\n![image](img/cd.jpg)\
  \ 你可以通过更改 HTML 元素的不同 CSS 属性来使用 `jQuery` `animate()` 函数创建其他有趣的视觉效果。例如，以下代码块为 HTML\
  \ `<ul>` 元素中的列表项创建一个“摇晃”效果：\n\n```javascript\n$('#mylist li').hover(function() {\n\
  \    $(this).animate({paddingLeft: '+=15px'}, 200);\n}, function() {\n    $(this).animate({paddingLeft:\
  \ '-=15px'}, 200);\n});\n```\n\n你还可以创建线性和摆动动画效果，如下所示：\n\n```javascript\n$('p:first').toggle(function()\
  \ {\n    $(this).animate({'height':'+=150px'}, 1000, 'linear');\n}, function() {\n\
  \    $(this).animate({'height':'-=150px'}, 1000, 'swing');\n});\n```\n\n## 使用 .animate()\
  \ 函数自定义 CSS 动画\n\n你可以使用 `jQuery` 动画化许多 CSS 属性，包括 `border-width`、`bottom`、`font-size`、`height`、`margin`、`opacity`、`padding`、`right`、`top`、`width`\
  \ 和 `word-spacing`。此外，你可以使用 `slow`、`fast` 或代表毫秒的整数值指定持续时间。\n\n以下代码动画化 HTML `<div>`\
  \ 元素的 `width` 和 `height` 属性，使其最终值分别为 `500` 和 `300`：\n\n```javascript\n$(\"#myDiv\"\
  ).click(function() {\n    $(this).animate({width:'500px', height: '300px'});\n});\n\
  ```\n\n在前面的 `jQuery` 代码段中，如果初始值小于 `500px`，宽度将增加到 `500px`；否则，宽度将减少到 `500px`（`height`\
  \ 属性也是如此）。\n\n### 基于 CSS 的动画效果\n\n本节说明了你可以使用 CSS3 创建的各种动画效果。\n\n\n\n\n\n[Listing\
  \ 3.3] 包含一个带有 CSS3 keyframes 定义的 HTML `<style>` 元素（你也可以将其移动到单独的 CSS 样式表中），随后是两个类型为按钮的\
  \ HTML `<input>` 元素，这两个元素都在 [Listing 3.3] 的 `<script>` 元素中定义了点击事件处理程序。\n\n当用户点击任何一个按钮时，CSS3\
  \ keyframes 定义就会应用到该按钮上。这反过来通过使用 `translate()`、`rotate()` 和 `skew()` 函数的组合，为关联选择器中指定的时间段（分别为\
  \ 2 秒或 4 秒）创建动画效果。此外，点击处理程序还会创建一个持续 500 毫秒的淡入出效果。\n\n当你在浏览器中启动 HTML 页面 `JQButtonAnimation1.html`\
  \ 时，每当你悬停在任一按钮上，都会看到动画效果。\n\n## 使用 CSS3 和 jQuery 进行 2D 变换\n\n本节中的代码示例展示了如何使用 jQuery\
  \ 的 `css()` 函数直接对元素（基于用户触发的事件）应用 CSS 变换。\n\n[Listing 3.4] 显示 `JQTransforms2D1.css`\
  \ 的内容，其中包含了 CSS3 选择器，这些选择器被应用于 [Listing 3.4] 所示的 HTML5 页面 `JQTransforms2D1.html`。\n\
  \n### LISTING 3.4 JQTransforms2D1.css\n\n```css\n#outer {\n  position: absolute;\n\
  \  left: 50px;\n  top: 150px;\n}\n\n#inner1 {\n  float: left;\n  background-color:#F00;\n\
  \  width: 200px;\n  height:150px;\n}\n\n#inner2 {\n  float: left;\n  background-color:#FF0;\n\
  \  width: 200px;\n  height:150px;\n}\n\n#inner3 {\n  float: left;\n  background-color:#00F;\n\
  \  width: 200px;\n  height:150px;\n}\n```\n\n[Listing 3.4] 非常直观：为 [Listing 3.5]\
  \ 中定义的三个 HTML `<div>` 元素指定了宽度和高度等多个属性。\n\n### LISTING 3.5 JQTransforms2D1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery Transform Effects</title>\n  <link href=\"Transforms1.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <h1>Click Inside Any of the Rectangles:</h1>\n  <div id=\"outer\"\
  >\n    <div id=\"inner1\"></div>\n    <div id=\"inner2\"></div>\n    <div id=\"\
  inner3\"></div>\n  </div>\n  <script>\n    $(document).ready(function() {\n    \
  \  $(\"#inner1\").click(function() {\n        $(\"div\").css({height: '300px',\n\
  \          'webkit-transform': 'scale(0.5, 0.5) skew(-10deg, 20deg)'\n        });\n\
  \      });\n      $(\"#inner2\").click(function() {\n        $(\"div\").css({height:\
  \ '200px',\n          width: '250px',\n          'webkit-transform': 'scale(0.5,\
  \ 0.8) rotate(-45deg)'\n        });\n      });\n      $(\"#inner3\").click(function()\
  \ {\n        $(\"div\").css({height: '100px',\n          width: '250px',\n     \
  \     'webkit-transform': 'skew(-10deg, 10deg) rotate(-45deg)'\n        });\n  \
  \    });\n    });\n  </script>\n</body>\n</html>\n```\n\n[Listing 3.5] 为三个 HTML\
  \ `<div>` 元素定义了点击事件的处理程序，所有这些处理程序都会调用 `css()` 函数来更新接收点击的 `<div>` 元素的属性。\n\n例如，每当用户点击元素时，第一个\
  \ HTML `<div>` 元素将如下更新：\n\n```javascript\n$(\"div\").css({height: '300px',\n  'webkit-transform':\
  \ 'scale(0.5, 0.5) skew(-10deg, 20deg)'\n});\n```\n\n如你所见，高度属性被设置为 300px，并且当用户点击它们时，变换会被应用到\
  \ `<div>` 元素。\n\n请记住，你可以将 [Listing 3.5] 中点击处理程序引用的 CSS3 代码移动到单独的 CSS 样式表中。这使得在单个文件中维护\
  \ CSS3 代码更加容易，你可以在多个 HTML 页面中引用同一个 CSS 样式表。\n\n除了 CSS3 2D 动画效果外，你显然还可以创建 CSS3 3D\
  \ 动画效果。你可以通过在 [Listing 3.5] 代码中添加第 2 章中提供的某些 3D 效果，或者来自以下开源：http://code.google.com/p/css3-graphics\
  \ 来实验这些代码。\n\n[Figure 3.1] 显示了 MacBook 上的 Chrome 浏览器中的 `JQTransforms2D1.html`。\n\
  \n本章的其余部分包含了与之前的代码不同的示例。[Listing 3.4] 和 [Listing 3.5] 涉及到鼠标相关功能，而 [Listing 3.6]\
  \ 在下一节中展示了如何使用 jQuery 和 CSS3 在 HTML5 页面中根据用户的鼠标位置渲染 `<div>` 元素。\n\n![image](img/fig3.jpg)\n\
  \n**图 3.1** MacBook 浏览器中的变换矩形。\n\n## 使用 jQuery 的跟随鼠标示例\n\n本节代码示例通过展示如何通过编程创建 `<div>`\
  \ 元素并将其添加到 DOM，扩展了前节介绍的功能。[Listing 3.6] 显示了 `JQSketchMouse1.html` 的内容，该文件说明了如何使用\
  \ jQuery 和 CSS3 在用户当前位置渲染 `<div>` 元素。\n\n### LISTING 3.6 JQSketchMouse1.html\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery Follow Mouse Example</title>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  </head>\n<body>\n  <div></div>\n  <script>\n    // 关于前面的空 <div> 元素的注释\n    $(document).ready(function()\
  \ {\n      var rectWidth = 20;\n      var rectHeight = 20;\n      var moveCount\
  \ = 0;\n      var insertNode = true;\n      var currColor = \"\";\n      var rectColors\
  \ = Array('#ff000', '#ffff0', '#0ff0', '#00ff');\n      var newNode;\n      $(document).mousemove(function(e)\
  \ {\n        ++moveCount;\n        // 用户正在移动鼠标？\n        if(insertNode == true)\
  \ {\n          // 在当前位置创建一个矩形\n          newNode = $('<div id=newNode>').css({\n\
  \            position: 'absolute',\n            'background-color':#ff000',\n  \
  \          width: rectWidth+'px',\n            height: rectHeight+'px',\n      \
  \      top: e.pageY,\n            left: e.pageX\n          });\n          // 使用此代码将矩形添加到\
  \ body：\n          $(\"div\").append(newNode);\n          // 不使用此代码将矩形添加到 body：\n\
  \          //$(document.body).append(newNode);\n          insertNode = false;\n\
  \        } else {\n          currColor = rectColors[moveCount % rectColors.length];\n\
  \          $('div').each(function() {\n            $(this).css({top: e.pageY,\n\
  \              left: e.pageX,\n              'background-color': currColor\n   \
  \         });\n          });\n        }\n      });\n    });\n  </script>\n</body>\n\
  </html>\n```\n\n\n\n\n\n列表 3.6 初始化了一些 JavaScript 变量，然后使用 jQuery 的 `css()` 方法动态创建一个\
  \ HTML `<div>` 元素，该元素的左上角坐标与 `mousemove` 事件发生时的点坐标相同，从而创建了一个跟随鼠标的效果。需要注意的关键点是，事件对象（在此代码示例中称为\
  \ `e`）让我们能够访问当前移动位置的坐标。我们可以使用属性 `e.pageX` 和 `e.pageY` 分别设置 CSS 属性 `left` 和 `top`。\n\
  \n同样注意，在列表 3.6 中，HTML `<body>` 元素之后紧接着包含了一个空的 HTML `<div>` 元素。需要这个元素是因为众周知，在脚本之后添加的\
  \ UI 元素在某些旧浏览器中会消失。解决方案是包含这个空的 `<div>` 元素，然后向该元素添加内容。\n\n# 使用 jQuery 处理其他事件（#toc.html_toc-h1-0023）\n\
  \n你已经见过一些代码示例，它们展示了如何使用 jQuery 处理各种事件。jQuery 为鼠标相关事件提供了广泛支持，并像接下来两节所示，对键盘事件也支持。\n\
  \n## 处理鼠标事件（#toc.html_toc-h2-0027）\n\njQuery 支持以下常见的鼠标事件，你可能对它们熟悉：`mousedown`、`mouseenter`、`mouseleave`、`mousemove`、`mouseout`、`mouseover`\
  \ 和 `mouseup`。你可以使用以下 jQuery 代码结构在 jQuery 中检测这些每一个鼠标事件：\n\n```javascript\n$(\"#myInput\"\
  ).mousedown(function() {\n  // do something\n});\n\n$(\"#myInput\").mouseenter(function()\
  \ {\n  // do something\n});\n\n$(\"#myInput\").mouseleave(function() {\n  // do\
  \ something\n});\n\n$(\"#myInput\").mousemove(function() {\n  // do something\n\
  });\n\n$(\"#myInput\").mouseout(function() {\n  // do something\n});\n\n$(\"#myInput\"\
  ).mouseover(function() {\n  // do something\n});\n\n$(\"#myInput\").mouseup(function()\
  \ {\n  // do something\n});\n```\n\n你可以将所需的任何代码代码包含 HTML 中，然后添加处理逻辑以提供实现的功能。\n\n\
  ## 处理键盘事件（#toc.html_toc-h2-0028）\n\n你也可以在 jQuery 中检测 `keypress`、`keyup` 和 `keydown`\
  \ 事件。例如，这段代码在用户点击大写字母“Z”键时显示一个警告框：\n\n```javascript\n$(\"#myInput\").keypress(function(e)\
  \ {\n  if (e.which == 90) alert ('Z was typed.')\n});\n```\n\n你可以检查其他键事件，请记住大写 `A`\
  \ 的十进制是 65（十六进制 41），小写 `a` 的十进制是 97（十六进制 61），小写 `z` 的十进制是 122（十六进制 7A）。\n\n你还可以添加许多其他效果，包括本章之前代码示例中提供的动画效果。\n\
  \n### CD 上的额外代码示例（#toc.html_toc-h1-0024）\n\nCD 上的 HTML5  页面 `JQSlideShow1.html`\
  \ 展示了如何使用 jQuery 创建一个带有 JPG 图像的幻灯片，它使用以下代码块来确定下一个 HTML `<img>` 元素（当我们到达最右侧图像时，它会循环到列表的第一张图像），并添加\
  \ `show` 属性，如下所示：\n\n```javascript\nnext = curr.next().length ? curr.next() :\n\
  \       curr.parent().children(':first');\n\nnext.addClass(\"show\");\n```\n\nCD\
  \ 上的 HTML5 页面 `JQSketchSolid1.html` 展示了如何使用 jQuery 和 CSS3 在 HTML5 页面中创建一个原始的素描程序。\n\
  \n图 3.2 在 MacBook 的 Chrome 浏览器上显示了 `JQSketchSolid1.html`。\n\n**图 3.2** 在 MacBook\
  \ 的 Chrome 浏览器上使用 jQuery 进行素描。\n\n用于 3D 动画的 jQuery 插件 `rotate3di` 允许对 HTML 内容和其他视觉效果制作动画，其首页在这里：\n\
  \nhttp://www.zachstronaut.com/projects/rotate3di/\n\n你还可以结合 jQuery 与 SVG 使用，而不是动态创建使用\
