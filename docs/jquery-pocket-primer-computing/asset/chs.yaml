  </</html>\n```\n\n列表 10.2 是一个简单的 HTML Web 页面，它引用了 CSS 样式表 `AndroidCSS3.css`（可在光盘上找到）以及一个\
  \ HTML `<div>` 元素（其 `id` 属性值为 `outer`），该元素作为四个 HTML `<div>` 元素的“容器”。\n\n![image](img/cd.jpg)\
  \ CSS 样式表 `AndroidCSS3.css` 包含一个用于为 `id` 为 `outer` 的 HTML `<div>` 元素设置样式的 CSS 选择器，随后是四个\
  \ CSS 选择器 `radial1`、`radial2`、`radial3` 和 `radial4`，用于设置列表 2 中对应的 HTML `<div>` 元素。这些选择器的内容应该非常熟悉（你可以在前面的章节中复习\
  \ CSS3 渐变的材料），因此我们不会在本节中详细介绍它们的内容。\n\n### 列表 10.3: AndroidCSS3Activity.java\n\n\
  ```java\npackage com.iquarkt.css3;\n\nimport android.app.Activity;\nimport android.os.Bundle;\n\
  import android.webkit.WebChromeClient;\nimport android.webkit.WebSettings;\nimport\
  \ android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class\
  \ AndroidCSS3Activity extends Activity\n{\n    /** 当 activity 首次创建时调用。 */\n    @Override\n\
  \    public void onCreate(Bundle savedInstanceState)\n    {   \n      super.onCreate(savedInstanceState);\n\
  \      setContentView(R.layout.main);\n      // 获取声明的 WebView 对象的引用\n      WebView\
