  );\n    }\n}\n```\n\n![image](img/fig10.jpg) 图 10.1 Android 平板上基于 CSS 的应用程序。`AndroidCSS3Activity`\
  \ 继承了 `Activity` 类。`onCreate()` 方法“指向”main.xml，以便我们通过 `R.id.webview` 获取其 `WebView`\
