  \ Canvas` 与 `jQuery` 或 `jQuery Mobile` 没有任何任何形式的“依赖关系”。如有必要，你可以结合其他工具包（如 `PhoneGap`）甚至在不使用工具包的情况下创建包含\
  \ `HTML5 Canvas` 的混合 HTML5 移动应用程序。\n\n## 什么是 HTML5 Canvas？\n\n几年前，`Canvas` 在 OS\
  \ X 中作为一种组件工具包出现。在 `Canvas` 在 `Safari` 浏览器中可用后，它成为了 Web 的一种规范。现在，它通常被称为 `HTML5 Canvas`。\n\
  \n`HTML5 Canvas` 和 `SVG` 都允许你通过 `JavaScript` 在浏览器中程序化地渲染图形。然而，`HTML5 Canvas` 使用的是“立即模式”（immediate\
  \ mode），这是一种写完即遗忘的图形渲染方法。因此，如果你想在 `HTML5 Canvas` 中编写一个绘图程序，并想提供“撤销”功能，那么你必须程序化地跟踪用户在屏幕上绘制的所有内容。另一方面，`SVG`\
  \ 使用的是“保留模式”（retained mode），它涉及一个 `DOM`（文档对象模型）结构，用于跟踪渲染对象以及它们彼此之间的关系。\n\n如果你打算编写一个大量使用图形效果的\
  \ HTML Web 页面，你可能需要从性能角度理解 `HTML5 Canvas` 和 `SVG` 之间的差异。你可以自由地仅使用一种技术，也可以创建一个包含\
  \ `HTML5 Canvas`、`SVG` 和 `CSS3` 混合的 HTML Web 页面。与性能相关的信息可以帮助你决定如何编写你的 HTML Web 页面。\n\
  \n虽然本章没有深入探讨上述观点，但你可以在这里找到关于 `HTML5 Canvas` 某些功能/优势的良好概述：\n\n*http://thinkvitamin.com/code/how-to-draw-with-html-5-canvas/*\n\
  \n顺便提一下，如果你在 `Internet Explorer 8` 中需要 `HTML5 Canvas` 支持，你可以使用 `ExplorerCanvas`，这是一个开源项目，地址如下：\n\
  \n*http://code.google.com/p/explorercanvas/*\n\n你只需要通过在 HTML Web 页面中包含以下代码段即可使用上述代码项目：\n\
  \n```html\n<!-- [if IE lt 8]><script src=\"excanvas.js\"></script><![endif]-->\n\
  ```\n\n## HTML5 Canvas 对比 SVG\n\n需要考虑的一点是何时使用 `HTML5 Canvas` 而不是 `SVG` 等技术会更有优势。以下简短列表包含了在进行此类分析时需要考虑的一些特性：\n\
  \n* 原生支持与浏览器插件的对比\n* 不同浏览器对 `SVG` 的支持程度\n* 动画支持\n* 对过滤的支持（仅限 SVG）\n* 对类 HTML 小部件的内置支持\n\
  * 第三方支持\n\n大多数现代浏览器都对 `SVG` 提供了不同程度的内置支持，`Adobe` 的 `SVG` 查看器可以配合 `Microsoft` 的 `Internet\
  \ Explorer` 使用。如果你需要基于过滤的视觉效果，`SVG` 提供了非常丰富（可能是最好的）的功能。如果你需要对 HTML 控件的内置支持，那么像 `Wijmo`\
  \ 这样的框架可能是你需求的良好解决方案。另一个考虑的点是，`Adobe` 不再支持其 `SVG` 查看器。这是一个重大的决定，因为多年来 `Adobe` 的\
  \ `SVG` 查看器一直是 `SVG` 查看器事实上的标准。尽管 `Firefox` 和 `Opera` 在支持 `SVG` 方面取得了巨大进展，并且两者都在增强对\
  \ `SVG` 的支持，但它们仍然缺乏 `Adobe` `SVG` 查看器的功能支持。因此，你需要权衡最重要的因素，以做出符合你项目需求的决策。\n\n这里有一篇包含示例和图表、比较\
  \ `HTML5 Canvas` 和 `SVG` 使用情况的非常好的文章：\n\n*http://blogs.msdn.com/b/ie/archive/2011/04/22/thoughts-on-when-to-use-canvas-and-svg.aspx/*\n\
  \n## HTML5 Canvas 坐标系\n\n回想你高中的时光，那时你学过笛卡尔坐标系通过一对数字（通常写为 `(x,y)`）来识别欧几里得平面上的任意点。第一个数字代表水平值，第二个数字代表垂直值。水平轴标记为\
  \ `x-axis`，`x-axis` 上的正值位于垂直轴的右侧（即向右）。垂直轴标记为 `y-axis`，`y-axis` 上的正值位于水平轴上方。原点是 `x-axis`\
  \ 和 `y-axis` 的交点。\n\n`HTML5 Canvas` 坐标系中的情况几乎相同。`x-axis` 是水平的，正方向朝向右。`y-axis` 是垂直的，但正方向是向下的，这与典型数学教科书中大多数图表的方向相反。在\
  \ `HTML5 Canvas` 坐标系中，原点是屏幕的左上角（而不是左下角），测量单位是像素。当本书出版时，最大的可见显示器是 2880×1800，无疑未来会有更大的显示器。\n\
  \n![image](img/fig9.jpg)\n图 1 在 Canvas 中渲染。\n\n作为一个简单的说明，图 1 显示了四个点。如果你从原点（屏幕左上角）开始向右移动\
  \ 50 像素，然后向下移动 50 像素，你将到达左上点。接下来，如果你从原点开始向右移动 200 像素并向下 50 像素，你将到达右上点。这一行的两个点坐标分别为\
  \ (50,100) 和 (200,100)。注意第一行的两个点 y 坐标相同，这是合理的，因为它们距离页面顶部的距离相同；第二行也是如此。同样，左列的两个点\
  \ x 坐标相同，因为它们距离侧边的距离相同。\n\n现在你已经理解了 HTML5 坐标系，让我们来看看一个准备好用于 HTML5 图形的最小 HTML 页面的内容。书中的每个基于\
  \ Canvas 的示例都使用这段代码（或其变体）。\n\n列表 9.1 Canvas1.html\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Canvas Rectangles</title>\n\
  \  <script>\n    window.addEventListener('load', function () {\n      // 获取 canvas\
  \ 元素\n      var elem = document.getElementById('myCanvas');\n      if (!elem ||\
  \ !elem.getContext) {\n        return;\n      }\n      // 获取 canvas 2d 上文\n    \
  \  var context = elem.getContext('2d');\n      if (!context) {\n        return;\n\
  \      }\n      // 在此处插入你的自定义 Canvas 代码\n    });\n  </script>\n</head>\n<body>\n\
  \  <canvas id=\"myCanvas\" width=\"300\" height=\"300\">\n    不支持 Canvas。\n  </canvas>\n\
  </body>\n</html>\n```\n请注意，如果你在浏览器中运行此代码，你将只会看到一个空白屏幕。\n\n\n\n\n\n```\nvar context\
  \ = elem.getContext('2d');\n```\n\n如果你在不支持 HTML5 Canvas 的浏览器中运行 Listing 9.1，将显示文本消息“No\
  \ support for Canvas.”。\n\n由于一个在加载事件期间执行的匿名 JavaScript 函数，每当你启动该 Web 页面时，都会执行以下代码段：\n\
  \n```html\n<script><!--\nwindow.addEventListener('load', function () {\n  // do\
  \ something here\n});\n// --></script>\n```\n\n现在你已经理解了渲染基于 Canvas 的 2D 形状的底层代码，可以专注于实际绘制某些\
  \ 2D 形状的代码，从下一节的示例开始。\n\n## 线段、矩形、圆形和阴影效果\n\n本节包含了一系列代码示例，展示了如何在 HTML5 Canvas 中渲染\
  \ 2D 形状。本节引入了许多概念，因此在深入研究代码示例之前，让我们先看看本节中用到的一些 HTML5 Canvas API。第 2 章包含一个描述指定颜色各种方式的章节，该章节的内容与本章的代码示例相关（如果你现在需要，可以立即快速回顾其内容）。\n\
  \nHTML5 Canvas 提供了 `fillRect()` 方法来渲染矩形，它需要四个参数：矩形的左上角顶点（由其 `x` 坐标和 `y` 坐标定义）、矩形的宽度以及目标矩形的高度。Canvas\
  \ 的 `fillRect()` API 如下所示：\n\n```javascript\ncontext.fillRect(x, y, width, height);\n\
  ```\n\nHTML5 Canvas 允许你通过指定线段两个端点的 `(x,y)` 坐标来渲染线段。本节代码示例中两个新 API 是 `moveTo()` 和\
  \ `lineTo()`，它们如下所示：\n\n```javascript\ncontext.moveTo(x1, y1);\ncontext.lineTo(x2,\
  \ y2);\n```\n\n前面的代码段代表一条线段，其两个端点由点 `(x1, y1)` 和 `(x2, y2)` 指定。注意，你也可以通过以下代码段渲染相同的线段：\n\
  \n```javascript\ncontext.moveTo(x2, y2);\ncontext.lineTo(x1, y1);\n```\n\n阴影效果提供了更丰富的视觉体验，是对非阴影效果的改进。你通过为三个阴影相关的属性赋值来创建阴影效果，这些属性控制底层阴影的大小以及阴影的“模糊”程度，如下所示：\n\
  \n```javascript\ncontext.shadowOffsetX = shadowX;\ncontext.shadowOffsetY = shadowY;\n\
  context.shadowBlur = 4;\n```\n\n你也可以像这里为 `shadowColor`（绘图上下文的属性）分配 `(R,G,B)` 或 `(R,G,B,A)`\
  \ 值：\n\n```javascript\ncontext.shadowColor = \"rgba(0,0,64,1.0)\";\n```\n\nListing\
  \ 9.2 中的 HTML5 Web 页面 `RandRectanglesShadow.html`（为了省略了代码部分）使用了这种技术来渲染一组带有阴影效果的随机生成矩形。\n\
  \n***LISTING 9.2 RandRectanglesShadow.html***\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Canvas Random Rectangles\
  \ With Shadow Effects</title>\n  <link href=\"CSS3Background2.css\" rel=\"stylesheet\"\
  \ type=\"text/css\">\n  <script><!--\n  window.addEventListener('load', function()\
  \ {\n    redrawCanvas = function() {\n      // 在绘制一组新矩形之前清除画布\n      context.clearRect(0,\
  \ 0, elem.width, elem.height);\n      for(var r=0; r<rectCount; r++) {\n       \
  \ basePointX = canWidth*Math.random();\n        basePointY = canHeight*Math.random();\n\
  \        // 根据奇偶点击计数 \n        // 使用不同的 (R,G,B,A) 值交替阴影效果\n        if(clickCount\
  \ % 2 == 0) {\n          context.shadowColor = \"rgba(0,0,64,1.0)\";\n        }\
  \ else {\n          context.shadowColor = \"rgba(64,0,0,1.0)\";\n        }\n   \
  \     // 指定底层阴影效果的大小以及\n        // “模糊”程度的代码\n        context.shadowOffsetX = shadowX;\n\
  \        context.shadowOffsetY = shadowY;\n        context.shadowBlur = 4;\n   \
  \     context.lineWidth = 1;\n        // 渲染一个颜色的矩形\n        colorIndex = Math.floor(basePointX);\n\
  \        context.fillStyle = styles[colorIndex];\n        context.fillRect(basePointX,\
  \ basePointY, rectWidth, rectHeight);\n        clickCount++;\n      }\n    }\n \
  \ });\n// --></script>\n</head>\n<body>\n  <canvas id=\"myCanvas\" width=\"800\"\
  \ height=\"350\"></canvas>\n</body>\n</html>\n```\n\n\n\n\n\n# HTML5 Canvas 线性渐变\n\
  \nHTML5 Canvas 提供了两种主要的颜色渐变（类似于 SVG 和 CSS3）：*线性渐变*和*径向渐变*。\n\n线性颜色渐变可以进一步分为三类型：水平线性渐变、垂直线性渐变和对角线线性渐变。因此，HTML5\
  \ Canvas 提供的颜色渐变能够创建出悦目的视觉效果。\n\n线性渐变通过 `ColorStop` 元素定义，每个元素包含一个小数（在 0 到 1 之间）和一个表示颜色的十六进制值。例如，如果你定义一个初始颜色为\
  \ #FF0000（红色的十六进制值）、结束颜色为 #000000（黑色的十六进制值）的线性渐变，那么生成的颜色渐变将（线性方式）从红色变为黑色。线性渐变让你能够创建生动且有趣的色彩组合，并且它们有三种形式：水平、垂直和对角线。注意，在书中，“线性渐变”和“线性颜色渐变”是通用的。\n\
  \n## 水平、垂直和对角线线性渐变\n\n正如在本章的引言中所学的，HTML5 Canvas 支持 `createLinearGradient()` 方法，你可以用它通过编程方式创建线性渐变。其语法如下：\n\
  \n```javascript\ncontext.createLinearGradient(startX, startY, endX, endY);\n```\n\
  \n![image](img/cd.jpg) [Listing 9.4] 中的 HTML5 页面 LGradRectangles1.html 展示如何渲染一组具有水平、垂直和对角线线性渐变的矩形。[Listing\
  \ 9.3] 引用了 CSS3 样式 HoverAnimation1.css，该表每当用户用鼠标悬停在第一个 HTML5 <canvas> 元素上时，就会应用基于\
  \ CSS3 关键帧的 2D 动画。[Listing 9.4] 同样引用了 CSS3 样式 HoverAnimation2.css，其工作方式类似。然而，该样式表对\
  \ [Listing 9.3] 中的第二个 HTML5 <canvas> 元素应用了 CSS3 3D 动画效果。由于这些 CSS 样式中的动画技术在[第 2 章]中讨论过，我们将在本章中省略它们，但完整的源代码可以在\
  \ CD 上找到。\n\n***LISTING 9.3 LGradRectangles1.html***\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Canvas Linear Gradient\
  \ Rectangles</title>\n  <link href=\"HoverAnimation1.css\" rel=\"stylesheet\" type=\"\
  text/css\">\n  <link href=\"HoverAnimation2.css\" rel=\"stylesheet\" type=\"text/css\"\
  >\n  <script>\n    window.addEventListener('load', function () {\n      redrawCanvas\
  \ = function() {\n        // 在绘制新的一组矩形之前清除画布\n        //context.clearRect(0, 0,\
  \ elem.width, elem.height);\n        //context2.clearRect(0, 0, elem.width, elem.height);\n\
  \        // 左上角矩形：水平线性渐变\n        currentX = basePointX;\n        currentY = basePointY;\n\
  \        gradient1 = context.createLinearGradient(\n          currentX,\n      \
  \    currentY,\n          currentX+rectWidth,\n          currentY+rectHeight\n \
  \       );\n        gradient1.addColorStop(0, '#f00');\n        gradient1.addColorStop(1,\
  \ '#00f');\n        context.fillStyle = gradient1;\n        context.fillRect(currentX,\
  \ currentY, rectWidth, rectHeight);\n        // 右上矩形：垂直线性渐变\n        // 为了起见省略了相似代码\n\
  \        // 在第二个 <canvas> 元素中渲染下方的矩形\n        // 左下矩形：对角线渐变\n        // 为了起见省略了相似代码\n\
  \        // 右下矩形：对角线渐变\n        // 为了起见省略了相似代码\n        ++clickCount;\n        basePointX\
  \ += 4;\n        basePointY += 2;\n      }\n      // 渲染线性渐变矩形\n      redrawCanvas();\n\
  \    }, false);\n  </script>\n</head>\n<body>\n  <div>\n    <canvas id=\"myCanvas\"\
  \ width=\"600\" height=\"250\" No support for Canvas alt=\"Rendering gradient rectangles.\"\
  ></canvas>\n  </div>\n  <div>\n    <canvas id=\"myCanvas2\" width=\"600\" height=\"\
  250\"No support for Canvas alt=\"Rendering gradient rectangles.\"></canvas>\n  </div>\n\
  \  <div>\n    <input type=\"button\" onclick=\"redrawCanvas();return false\" value=\"\
  Redraw the Rectangles\" />\n  </div>\n</body>\n</html>\n```\n\n[Listing 9.3] 渲染了四个带有线性渐变阴色的矩形。这些线性渐变对\
  \ `addColorStop()` 方法调用了两次、三次或四次，使用了不同的颜色组合（以十六进制形式表示），以便你可以看到可能的渐变效果。\n\n尝试不同的颜色停止点定义值，观察这些值如何改变渲染矩形的外观。\n\
  \n![image](img/fig9.3)\n\n***图 9.3*** Android Nexus 7 平板上的线性渐变。\n\n[图 9.3] 显示了一组基于\
  \ LGradRectangles1.html 随机生成的带有阴影效果的矩形，处于横屏模式。\n\n## 径向颜色渐变\n\n径向颜色渐变是基于 HTML5 Canvas\
  \ 的第二类型渐变。你可以通过 `createRadialGradient()` 方法定义径向颜色渐变，并使用 `addColorStop()` 方法添加颜色值。其语法（不包含\
  \ `addColorStop()` 方法）如下：\n\n```javascript\ncontext.createRadialGradient(startCenterX,\
  \ startCenterY, startRadius, endCenterX, endCenterY, endRadius);\n```\n\n*径向*颜色渐变可以比作向池塘扔石头产生的波纹效应，其中每个“波纹”的颜色以渐变方式变化。每个波纹对应一个颜色停止元素。例如，如果你定义一个起始颜色为\
  \ #FF0000（红色）、结束颜色为 #000000（黑色）的径向渐变，那么生成的颜色渐变将（以径向方式）从红色变为黑色。径向渐变还包含多个停止点颜色。注意，在书中，“径向渐变”和“径向颜色渐变”是通用的。\n\
  \n![image](img/cd.jpg) HTML5 页面 RGradRectangles1.html 与 [Listing 9.3] 类似，不同在于使用了径向渐变（而非线性渐变），该渐变以径向方式从蓝色变为红色。`addColorStop()`\
  \ 方法被调用了四次，以便为径向渐变添加四个“颜色停止值”。\n\n```javascript\ngradient1 = context.createRadialGradient(\n\
  \  currentX,\n  currentY,\n  currentX,\n  currentX+rectWidth,\n  currentY,\n  currentY+rectHeight\n\
  );\ngradient1.addColorStop(0, '#f00');\ngradient1.addColorStop(1, '#00f');\ncontext.fillStyle\
  \ = gradient1;\ncontext.fillRect(currentX, currentY, rectWidth, rectHeight);\n```\n\
  \n![image](img/fig9.4.jpg)\n\n***图 9.4*** iPad3 上的径向渐变矩形。\n\n\n\n\n\n图 9.4 显示了一组在\
  \ `iPad3` 横屏模式下基于 `RGradRectangles1.html` 的带有径向渐变的矩形。\n\n# HTML5 Canvas 变换与状态保存\n\
  \nHTML5 `Canvas` 允许你通过以下方法旋转、缩放、剪切或平移（水平和/垂直移动）2D 形状和文本字符串：\n\n- `rotate(x,y)`\n\
  - `scale(x,y)`\n- `transform(x1,y1,x2,y2,x3,y3)`\n- `translate(x,y)`\n\n需要记住的一点是，你需要在\
  \ HTML5 Web 页面中实际渲染图形形状*之前*指定你想要应用的变换（以及设置属性值）。\n\n以下代码段说明了你可以在上述 Canvas 方法中使用的示例值，其中\
  \ `context` 是一个引用 HTML5 `<canvas>` 元素上下文的 JavaScript 变量：\n\n```javascript\ncontext.rotate(30*Math.PI/180);\n\
  context.scale(0.8, 0.4);\ncontext.translate(100, 200);\ncontext.transform(1, 0,\
  \ 0.5, 1, 0, 0);\n```\n\n上述代码块中的 `rotate()` 方法引用了 JavaScript 常量 `Math.PI`，其值代表 PI\
  \ 弧度。如果你忘记了，PI 弧度等于 180 度，因此 `2*PI` 弧度是 360 度，而 `PI/2` 弧度是 90 度。因此，`Math.PI/6` 弧度（或\
  \ `30*Math.PI/180`）等于 30 度。你不需要了解更多关于弧度的知识，但如果你想阅读一些提供额外示例的教程，可以随时进行搜索。\n\nHTML5\
  \ Canvas 的另外两个 API 是 `save()` 和 `restore()`，它们允许你保存 canvas 的当前状态，进行一些更改，然后恢复 canvas\
  \ 的原始状态。`save()` 方法将当前状态“推”到栈中，而 `restore()` 方法从栈中“弹出”最近推入栈的状态。\n\n你可以在应用本节列出的任何变换之后，也可以在指定阴影相关属性（以及其他属性）的值之后，保存（稍后恢复）canvas\
  \ 状态。你可以对 canvas 状态多次调用 `save()` 和 `restore()` 方法，这使得这两个方法对于游戏相关的 Web 页面非常有用。我们将在本章的任何代码示例未使用这两个方法，但你可以通过搜索来阅读教程并找到代码示例。\n\
  \n![image](img/cd.jpg) CD  HTML5 Web 页面 `JQMCanvasTransforms1.html` Illust 了如何将四种\
  \ HTML5 Canvas 变换应用于文本字符串。\n\n# jCanvas: 一个用于 HTML5 Canvas 的 jQuery 插件\n\n`jCanvas`\
  \ jQuery 插件允许你使用 jQuery 语法来指定在 HTML5 `<canvas>` 元素中渲染的 2D 形状。它的首页在这里：\n\n*[`calebevans.me/projects/jcanvas/`](http://calebevans.me/projects/jcanvas/)*\n\
  \n CD  HTML5 Web 页面 `JCanvasSamples1.html` Illust 了如何使用 `jCanvas` 渲染多个 2D 形状。\n\n\
  ![image](img/fig9.5.jpg)\n\n***图 9.5*** `iPad3` 上的 jQuery `jCanvas` 插件。\n\n图 9.5\
  \ 显示在 `iPad3` 横屏模式下渲染 `JCanvasSamples1.html` 的结果。\n\n你也可以将 jQuery Mobile 用于 HTML5\
  \ Canvas，如下一节的代码示例所示。\n\n## 结合 CSS3 和 jQuery Mobile 的 HTML5 Canvas\n\n到目前，我们希望你已经如何在\
  \ HTML5 Canvas 中渲染 2D 形状。本节包含一个代码示例，向你展示如何结合 jQuery Mobile、HTML5 Canvas 以及当用户点击此网页中的\
  \ HTML5 `<canvas>` 元素时动态创建 HTML `<div>` 元素。\n\n记住，尽管图形效果并不一定符合你的需求，但此代码示例确实说明了如何在\
  \ jQuery Mobile 中处理元素的动态创建以及点击事件（其处理方式与 jQuery 中的点击事件不同）。\n\n列表 9.4 显示了 HTML5 Web\
  \ 页面 `JQMCanvas1.html` 的内容，列表 9.5 显示了 CSS 表 `JQMCanvas1.css`，其 CSS3 选择器与 HTML5 Web\
  \ 页面 `JQMCanvas1.html` 中的元素匹配。\n\n***列表 9.4 JQMCanvas1.html***\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>JQueryMobile\
