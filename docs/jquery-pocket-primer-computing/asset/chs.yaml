  text\" value=\"0\" />\n    </div>\n    <div id=\"newValue\">\n      设置新值：\n    \
  \  <input id=\"newVal\" type=\"text\" value=\"0\" />\n    </div>\n  </div>\n  <script>\n\
  \    $(document).ready(function() {\n      $(\"#progressBar1\").progressbar({ value:\
