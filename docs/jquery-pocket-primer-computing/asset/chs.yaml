  \ `<script>` 元素，该元素包含了 JavaScript 文件 `phonegap.js`，该文件定义了 PhoneGap 核心功能的函数。\n\n\
  列表 10.7 的第二部分显示了锚点元素，这些元素允许你测试手机的媒体相关功能，包括加速度计、地理定位、打电话（通过 Android 应用）、蜂鸣效果、震动效果以及使用手机或平板电脑拍照。\n\
  \n列表 10.8 显示了 JavaScript 文件 `main.js` 的内容，它包含了支持 HTML5 页面 `index.html` 功能的选 JavaScript\
