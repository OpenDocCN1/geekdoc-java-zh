  $(document).ready(function() {\n    $(\"#progressBarDiv1\").progressbar({ value:\
  \ 40 });\n\n    $(\"#text1\").val($(\"#progressBarDiv1\").progressbar(\"value\"\
  ));\n\n    $(\"#newValue\").bind(\"change\", function() {\n        var newVal =\
  \ $(\"#newVal\").val();\n        $(\"#progressBarDiv1\").progressbar(\"option\"\
  , \"value\",\n            parseInt(newVal));\n    });\n});\n```\n\n\n\n\n本章第三部分包含一个代码示例，展示了如何通过\
  \ jQuery 实现 JPG 文件的拖放（这比“纯”HTML5 拖放 API 更简单）、一个在 jQuery 中调用某些 HTML5 文件 API 的示例，最后是一个用于获取用户地理位置信息的\
  \ jQuery 插件。你还将学习 `jStorage` 和 `jStore` 这两个 jQuery 插件，它们在 HTML5 Storage API 之上提供了一个抽象层。本章的最后部分提供了\
  \ History API 的概述，这是一项 HTML5 技术，其 W3C 状态为 WD（工作草案）。\n\n如果你有选择（也许是出于“奢侈”），当有更简单的替代方案时，你可能更倾向于代码的便捷性，而不是被冗长而乏味的代码示例“困住”。例如，使用\
  \ jQuery 实现 HTML5 拖放（DnD）的代码示例比直接调用现有 HTML5 DnD API 的代码示例要直观得多。\n\n更简单的代码示例的另一个优势是，它们能快速带你接触许多\
  \ HTML5 技术，此后你将能够更好地去探索这些 HTML5 技术的细微差别。另一种场景是将 jQuery Mobile 与其它工具包结合，例如 PhoneGap（在第\
  \ 10 章 中讨论）或 appMobi（本书未讨论）。像 PhoneGap 等工具包提供了硬件功能支持；你也可以将 PhoneGap 与 jQuery Mobile\
  \ 结合。你的应用程序需求和限制将决定你为移动 Web 应用选择哪些工具包（如果有）。\n\n总来说，jQuery 和 jQuery Mobile 可能与其他工具包一起工作，但你应该检查在线论坛以查看任何可能影响你的\
  \ Web 应用程序的问题。最后，如果你不想使用 jQuery 插件，可以进行互联网搜索，寻找在线教程，演示如何使用纯 HTML5 API 为本书涵盖的所有 HTML5\
  \ 技术创建 HTML5 Web 页面。\n\n## W3C 审核流程的阶段 (#toc.html_toc-h1-0037)\n\n如果你不熟悉 W3C 流程的各个阶段，下面提供了以下简要描述（从最早阶段到最终阶段）。\n\
  \nWD（“Working Draft”，工作草案）文档是公开的第一种标准形式。意见被广泛接受，但不保证会被采纳，且该文档可能与其最终形式有显著差异。\n\n\
  LC（“Last Call”，最后征询）状态涉及创建一个工作组对关于规范的所有意见回复的公开记录。该阶段还处理关于规范的错误报告。顺带一提，HTML5 于 2011\
  \ 年 5 月在 W3C 达到 LC 状态。\n\nCR（“Candidate Recommendation”，候选建议）状态比 WD 文档更确定，主要功能已经定型。其目标是寻求开发社区关于该标准实现程度的协助。\n\
  \nPR（“Proposed Recommendation”，提议建议）状态意味着该标准已通过了之前的两个阶段，此时文档提交给 W3C 进行最终批准。\n\n\
  REC（“Recommendation”，建议）状态是批准过程的最终阶段，堪比许多其他行业中发布的技术标准。规范成为 W3C 建议标准的标准是“具有两个 100%\
  \ 完整且完全互操作的实现”。\n\n回想第 1 章描述了某些创建规范的小组，并提供了有关本章所讨论技术 API 的详细信息。\n\n## 处于 W3C 建议状态\
  \ (REC) 的 HTML5 APIs (#toc.html_toc-h1-0038)\n\n你可能会发现 SVG 和 MathML 具有 REC 状态而感到惊讶。这两项技术都已成熟，并包含在\
  \ HTML5 的伞下。然而，本书并未涵盖这两个主题。\n\n## HTML5 地理位置 (#toc.html_toc-h1-0039)\n\n地理位置允许用户共享他们的当前位置，这可以通过以下方法确定：\n\
  \n*   手机基站\n*   设备上的 GPS 硬件\n*   IP 地址\n*   无线网络连接\n\n实际使用的方法取决于浏览器和设备能力。浏览器随后确定位置并将其传回地理位置\
  \ API。注意，W3C 地理位置规范提到，不能保证地理位置 API 返回的是设备的实际位置。\n\ngeolocation 对象是 `window.navigator`\
  \ 的一个子对象，你可以通过以下类型的代码块检查你的浏览器是否支持地理位置：\n\n```javascript\nif(window.navigator.geolocation)\
  \ {\n  // 支持地理位置\n} else {\n  // 不支持地理位置\n}\n```\n\nW3C 地理位置 API 允许你在运行在设备上的浏览器会话中获取地理位置信息。geolocation\
  \ 对象在全局 `window.navigator` 对象可用，可以通过 `window.navigator.geolocation` 访问。\n\n注意，地理位置\
  \ API 需要用户允许 Web 应用程序访问位置信息：\n\n*   geolocation 对象包含以下三个方法：\n*   `getCurrentPosition(successCallback,\
  \ errorCallback, options)`\n*   `watchPosition(successCallback, errorCallback, options)`\n\
  *   `clearWatch(watchId)`\n\n`getCurrentPosition()` 方法尝试获取地理位置信息。如果成功，它将使用 `successCallback`\
  \ 方法；否则，它将调用参数列表中的 `errorCallback` 方法。\n\n`watchPosition()` 方法定期获取地理位置，它还返回一个 `watchId`\
  \ 值。成功和失败通过其参数列表中的两个 JavaScript 方法处理。\n\n最后，`clearWatch(watchId)` 方法根据 `watchId`\
  \ 的停止停止过程。\n\n前两个方法的主要区别是，`watchPosition()` 方法在调用时会立即返回一个值，该返回值唯一标识该监听操作。\n\n这里有一个显示桌面和移动浏览器地理位置支持的表格：[`cuse.com/geolocation`](http://cuse.com/geolocation)\n\
  \n## 使用 getCurrentPosition() 获取用户位置 (#toc.html_toc-h2-0030)\n\n`PositionOptions`\
  \ 对象是一个可选参数，可以传递给 `getCurrentPosition()` 和 `watchPosition()` 方法。`PositionOptions`\
  \ 对象中的所有属性也是可选的。\n\n例如，你可以通过以下代码块定义 `PositionOptions` 对象的实例：\n\n```javascript\n\
  var options = {\n  enableHighAccuracy: true,\n  maximumAge: 60000,\n  timeout: 45000\n\
  };\n```\n\n接下来，我们可以通过指定 JavaScript 成功回调函数、JavaScript 错误函数以及之前定义的 `options` 变量来调用\
  \ `getCurrentPosition()` 方法，如下：\n\n```javascript\nnavigator.geolocation.getCurrentPosition(successCallback,\
  \ errorCallback, options);\n```\n\n## 使用 watchPosition() 跟踪用户位置 (#toc.html_toc-h2-0031)\n\
  \n当应用程序在设备位置变化时都需要更新位置时，此方法非常有用。监听操作是一个异步操作，调用方式所示：\n\n```javascript\nvar watchID\
  \ = null;\nvar options = { enableHighAccuracy: true, timeout: 30000 };\n\nif (window.navigator.geolocation)\
  \ {\n  watchID = navigator.geolocation.watchPosition(successCallback, errorCallback,\
  \ options);\n} else {\n  alert('您的浏览器不支持地理位置。');\n}\n\nfunction successCallback(position)\
  \ {\n  console.log(\"成功获取设备位置\");\n}\n\n// 错误获取位置\n\nfunction errorCallback(error)\
  \ {\n  console.log(\"获取设备位置出错\");\n}\n```\n\n\n\n\n\n如果你的浏览器支持地理定位（Geolocation），JavaScript\
  \ 变量 `watcher` 是通过调用 `geolocation` 对象的 `watchPosition()` 方法初始化的。请注意用于处理成功或失败的 JavaScript\
  \ 函数 `successCallback()` 和 `errorCallback()`。（在本例中，这些函数简单地在浏览器控制台中显示一条消息）。\n\nW3C\
  \ 地理定位 API 提供了一了一种方法，通过向 `clearWatch()` 方法传递 `watchId` 来清除监听操作，如下所示：\n\n```\nnavigator.geolocation.clearWatch(watcher);\n\
  ```\n\n在创建一个新的监听操作后，你可以在成功获取设备位置后移除该监听，如下所示：\n\n```javascript\nfunction successCallback(position)\
  \ {\n  navigator.geolocation.clearWatch(watcher);\n  // 在此处对位置进行某些操作\n}\n```\n\n\
  如你所见，JavaScript 函数 `successCallback()` 只是“清除”了 JavaScript 变量 `watcher`。关键点在于，在你清除此变量之前，你将持续接收信息。\n\
  \n你可以通过 Google 搜索来查找各种支持地理定位的 JavaScript 插件。如果你倾向于使用 jQuery 插件进行地理定位，有几个可用选择，包括这一个：\n\
  \n[http://mobile.tutsplus.com/tutorials/mobile-web-apps/html5-geolocation/]\n\n\
  ## HTML5 跨源资源共享 (CORS)\n\n简之，“同源策略”允许来自相同站点和协议的脚本执行，它们可以不受限制地访问彼此的方法和属性。该策略还限制了\
  \ AJAX 请求只能向页面相同的源发送（但有一个“漏洞”，在动态加载 `<script>` 标签时可以绕过这一限制）。\n\n举一个简单的例子，以下这对 URL\
  \ 属于同一站点但使用了不同的协议，因此它们不符合“同源策略”的标准：\n\nhttp://foo.com\nhttps://foo.com\n\n另一方面，*跨源资源共享*（CORS）规定了\
  \ Web 服务器允许不同域的 Web 页面访问其资源的方式。虽然 CORS 比“同源策略”更灵活，但它不允许任何和所有请求访问资源。\n\n简单来说，CORS\
  \ 规范通过客户端和服务器之间简单的标头交换为跨域通信提供了支持。\n\nCORS 规范的一些新 HTTP 头部是 `Options`、`Origin` 和 `Access-Control-Allow-Origin`。当提供了适当的\
  \ CORS 头部时，CORS 使得向其他域发送异步 HTTP 请求成为可能。\n\n记住以下一点：没有单一的 CORS API，但任何使用跨源功能的 API\
  \ 都可以被称为 CORS API。在实践中，CORS API 使用 `XMLHttpRequest` 对象作为发送和接收所需 CORS 标头的“容器”，还使用了\
  \ `withCredentials` 属性，该属性可用于程序化判断 `XMLHttpRequest` 对象是否支持 CORS。\n\n如需有关 CORS 的更详细描述，请进行互联网搜索，你将找到许多此类信息的免费文章。\n\
  \n## W3C 候选建议状态 (CR) 中的 HTML5 API\n\n本章的这一部分包含一组处于候选建议（Candidate Recommendation）状态的\
  \ HTML5 API。尽管 HTML5 技术 Navigation Timing、RDFa 和 Selectors 具有 CR 状态，但本文并未讨论它们。\n\
  \n## 电池 API\n\nBattery API 由 DAP（设备 API）工作组维护，该小组提供有关主机设备电池状态的信息。以下来自 `Battery1.html`\
  \ 的简单代码段向你展示如何在每次电量变化时将电量水平写入控制台：\n\n```javascript\nnavigator.battery.onlevelchange\
  \ = function () {\n  console.log(navigator.battery.level);\n};\n```\n\n下一节包含一个基于\
  \ AJAX 的代码示例，向你展示如何结合 XHR2 使用下文描述的新 `FormData` 对象。\n\n## XMLHttpRequest Level 2\
  \ (XHR2)\n\n`XMLHttpRequest` Level 2 规范支持以下新功能：\n\n- 处理如 `File`、`Blob` 和 `FormData`\
  \ 对象的字节流用于和下载\n- 在上传和下载期间显示进度事件\n- 创建跨源请求\n- 创建匿名请求（非 HTTP Referrer）\n-为请求设置超时\n\
  \n在查看 XHR2 代码示例之前，我们将从一个代码示例开始，向你展示如何发送一个简单的 AJAX 请求，随后是另一个使用 jQuery 的 AJAX 请求。\n\
  \n### 不使用 jQuery 进行 AJAX 调用\n\n本节中的代码示例向你展示如何进行“传统”的 AJAX 调用。稍后我们将查看如何使用 jQuery\
  \ 完成相同任务。此示例的目的是说明 jQuery（再次）允许你编写更简单的代码，这些代码更易维护、调试和通过附加功能进行增强（你已经从通本书看到的代码示例中了解了这一点）。\n\
  \n![image](img/note.jpg) *你必须从实际的 Web 服务器（而不是文件管理器）启动 BasicAjax1.html，因为此网页读取了本地文件\
  \ `sample.xml` 的内容。*\n\n***列表 5.1 BasicAjax1.html***\n\n```html\n<!DOCTYPE html>\n\
  <html\n<head>\n  <meta charset=\"utf-8\">\n  <title>Ajax</title>\n  <script>\n \
  \   var xmlHTTP, url = \"http://localhost:8080/sample.xml\";\n    function loadXML(url)\
  \ {\n      if (window.XMLHttpRequest) {\n        // Chrome, Firefox, IE+, and Safari\n\
  \        xmlHTTP = new XMLHttpRequest();\n      } else {\n        // IE5 and IE6\n\
  \        xmlHTTP = new ActiveXObject(\"XMLHTTP\");\n      }\n      xmlHTTP.onreadystatechange\
  \ = callback;\n      xmlHTTP.open(\"GET\", url, true);\n      xmlHTTP.send();\n\
  \    }\n    function init() {\n      loadXML(url, function() {\n        if (xmlHTTP.readyState\
  \ == 4 && xmlHTTP.status == 200) {\n          document.getElementById(\"myDiv\"\
  ).innerHTML = xmlHTTP.responseText;\n        }\n      });\n    }\n  </script>\n\
  </head>\n<body onload=\"init()\">\n  <div id=\"myDiv\"></div>\n</body>\n</</html>\n\
  ```\n\n列表 5.1 包含一个在 页面加载时执行的 JavaScript 函数 `init()`。`init()` 函数调用了 `loadXML()` 函数，以及一个在\
  \ AJAX 请求完成后执行的 JavaScript 函数。\n\n```javascript\nxmlHTTP.onreadystatechange = callback;\n\
  xmlHTTP.open(\"GET\", url, true);\nxmlHTTP.send();\n```\n\n当 AJAX 请求完成后，列表 5.1 中的\
  \ HTML `<div>` 元素将使用 AJAX 请求返回的数据进行更新。代码示例中，XML 文档 `sample.xml` 是一个包含三个矩形的 SVG 文档，如下：\n\
  \n```xml\n<?xml version='1.0' encoding='iso-8859-1'?>\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"100%\" height=\"100%\">\n\
  \  <rect x=\"50\" y=\"10\" width=\"100\" height=\"200\" stroke=\"blue\" fill=\"\
  red\" />\n  <rect x=\"200\" y=\"10\" width=\"100\" height=\"200\" stroke=\"blue\"\
  \ fill=\"green\" />\n  <rect x=\"350\" y=\"10\" width=\"100\" height=\"200\" stroke=\"\
  blue\" fill=\"blue\" />\n</svg>\n```\n\n\n\n\n\n如果你是 AJAX 的初学者，那么 Listing 5.1 中的代码可能看起来非常复杂，甚至让人困惑。幸运的是，jQuery\
  \ 通过屏蔽底层细节简化了发送 AJAX 请求的过程，正如你将在下一节中看到的那样。\n\n### 使用 jQuery 进行 AJAX 调用 (#toc.html_toc-h2-0033)\n\
  \n此示例是 Listing 5.1 的修改版本，它为代码添加了 jQuery 功能。有几个 jQuery 方法提供了基于 AJAX 的功能，包括 `jQuery.load()`、`jQuery.get()`、`jQuery.post()`\
  \ 和 `jQuery.ajax()`。\n\n![image](img/note.jpg) *你必须从实际的 Web 服务器（而不是文件管理器）启动* `JQueryAjax1.html`，*因为该网页读取了名为*\
  \ `sample.xml` 的本地文件内容。\n\nListing 5.2 显示了 `JQueryAjax1.html` 的内容，说明了如何在 HTML Web\
  \ 页面中使用这些 jQuery AJAX 方法中的第一个，以产生与 Listing 5.1 相同的结果。\n\n***Listing 5.2 JQueryAjax1.html***\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n <meta charset=utf-8 />\n <title>JQuery\
  \ Ajax</title>\n <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n\
  \ <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n</head>\n\
  <body>\n  <div id=\"myDiv\"></div>\n  <script>\n    var url = \"http://localhost:8080/sample.xml\"\
  ;\n    $(document).ready(function() {\n      $(\"#myDiv\").load(url, function()\
  \ {});\n    });\n  </script>\n</body>\n</html>\n```\n\nListing 5.2 仅包含一行通过 `jQuery\
  \ load()` 方法执行 AJAX 请求的代码，如下：\n\n```javascript\n$(\"#myDiv\").load(url, function()\
  \ {});\n```\n\n执行 Listing 5.2 中代码的结果与执行 Listing 5.1 的结果相同。`id` 属性为 `myDiv` 的 HTML\
  \ `<div>` 元素的内容被 `sample.xml` 的内容替换，并渲染了三个基于 SVG 的矩形。\n\n或者，你可以如下所示使用 `jQuery.ajax()`\
  \ 方法：\n\n```javascript\n$.ajax({\n  url: url,\n  type: \"get\",\n  success: GotData,\n\
  \  dataType: 'xml'\n});\n```\n\n在前面的代码块，你还需要定义一个名为 `GotData()` 的 JavaScript 函数，在其中处理\
  \ Ajax 调用的结果。\n\n正如你预期的，jQuery 提供了更多的 AJAX 功能。具体来说，jQuery 提供了以下回调钩的支持：\n\n- `beforeSend()`\n\
  - `fail()`\n- `dataFilter()`\n- `done()`\n- `always()`\n\n`beforeSend()`、`error()`\
  \ 和 `done()` 函数的命名直观，且行为符合预期。`dataFilter()` 回调是第一个接收数据的回调；在它完成处理后，将调用 `done()` 回调。最后，无论\
  \ AJAX 用的结果是成功还是错误，都会调用 `always()` 回调。\n\n这是一个使用链式调用结合上述几个 API 发送 AJAX 请求的 jQuery\
  \ 代码简洁示例：\n\n```javascript\n// 在发送请求后立即分配处理程序，\n// 并获取该请求的 jqxhr 对象的引用\nvar jqxhr\
  \ = $.ajax( \"example.php\" )\n    .done(function() { alert(\"success\"); })\n \
  \   .fail(function() { alert(\"error\"); })\n    .always(function() { alert(\"complete\"\
  ); });\n// 在处执行其他工作 …\n// 为上述请求设置另一个完成函数\njqxhr.always(function() { alert(\"second\
  \ complete\"); });\n```\n\n如果你想探索 jQuery 中更多与 AJAX 的功能，这里是 jQuery AJAX 方法的完整列表：\n\
  \n- [`api.jquery.com/category/ajax/`](http://api.jquery.com/category/ajax/)\n- [`api.jquery.com/ajaxComplete/`](http://api.jquery.com/ajaxComplete/)\n\
  \n下一节包含一个使用新 `FormData` 对象的代码样本。\n\n### 使用 XMLHttpRequest Level 2 (XHR2) 的 AJAX\
  \ 请求 (#toc.html_toc-h2-0034)\n\nListing 5.3 显示了 `AjaxForm.html`，它说明了如何使用新的 `FormData`\
  \ 对象创建 HTML5 Web 页面。\n\n***Listing 5.3 AjaxForm.html***\n\n```html\n<!doctype html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Ajax Form</title>\n\
  <script>\nfunction sendForm(form) {\n  var formData = new FormData(form);\n  var\
  \ xhr = new XMLHttpRequest();\n  xhr.open('POST', form.php', true);\n  xhr.onload\
  \ = function() {\n    // do something\n  };\n  xhr.send(formData);\n}\n</script>\n\
  </head>\n<body>\n<form id=\"myform\" action=\"xhr.php\" onsubmit=\"sendForm(this);return\
  \ false;\">\n<input type=\"text\" name=\"username\">\n<input type=\"number\" name=\"\
  id\">\n<input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\nListing 5.3 显示了\
  \ `AjaxForm.html`，说明了如何使用新的 `FormData` 对象创建 HTML5 Web 页面。\n\n\n\n\n\n## jQuery 与\
  \ HTML5 拖放\n\n在 jQuery 中，拖放功能变得异常简单：对于一个 HTML 元素，只需要一行代码即可。\n\n列表 5.4 显示了 HTML5\
  \ Web 页面 `JQDragAndDrop1.html` 的内容，它说明了如何使用 jQuery 轻松创建一个带有拖放功能的 HTML5 Web 页面。\n\
  \n### 列表 5.4 JQDragAndDrop1.html\n\n```html\n<!doctype html>\n<html lang=\"en\"\
  >\n<head>\n <meta charset=utf-8 />\n <<title>JQuery DnD</title>\n<style>\n  div[id^=\"\
  draggable\"] {\n    position:relative; width: 100px; height: 100px;\n  }\n  #draggable1\
  \ { background: red; }\n  #draggable2 { background: yellow; }\n  #draggable3 { background:\
  \ blue; }\n</style>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n\
  <!-- version 1.8.9 of jQuery UI causes an error:\n<script src=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.9/jquery-ui.min.js\"\
  ></script>\n-->\n<script src=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.1/jquery-ui.min.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-ui-1.8.14.custom.min.js\"\
  ></script>\n</head>\n<body\n  <div id=\"content\" style=\"height: 400px;\">\n  \
  \  <div id=\"draggable1\">\n        <img src=\"sample1.png\" width=\"100\" height=\"\
  100\" />\n    </div>\n    <div id=\"draggable2\">\n        <img src=\"sample2.png\"\
  \ width=\"100\" height=\"100\" />\n    </div>\n    <div id=\"draggable3\">\n   \
  \     <img src=\"sample3.png\" width=\"100\" height=\"100\" />\n    </div>\n  </div>\n\
  \  <script>\n    $(document).ready(function() {\n      $('#draggable1').draggable();\n\
  \      $('#draggable2').draggable();\n      $('#draggable3').draggable();\n    });\n\
  \  </script>\n</body>\n</html>\n```\n\n列表 5.4 包含了一段 jQuery 代码，它使用如下代码片段使得三个 HTML\
  \ `<div>` 元素（定义在 `<body>` 元素中）变为可拖动：\n\n`$('#draggable2').draggable();`\n\n`<body>`\
  \ 元素包含三个 `<div>` 元素，每个元素都包含一张可以在屏幕上拖拖移动的 PNG 图片。\n\n![image](img/fig5.1.jpg)\n\n\
  图 5.1：MacBook 上 Chrome 浏览器中的三张图片。\n\n图 5.1 显示了在 MacBook 的 Chrome 浏览器中渲染列表 5.4 的结果。\n\
