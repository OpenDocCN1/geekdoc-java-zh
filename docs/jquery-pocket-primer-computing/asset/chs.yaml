  \      $(\"#newValue\").bind(\"change\", function() {\n        var newVal = $(\"\
  #newVal\").val();\n        $(\"#progressBar1\").progressbar(\"option\", \"value\"\
  , parseInt(newVal));\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n\
