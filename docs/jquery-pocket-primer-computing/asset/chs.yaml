  ).hide(\"slow\");\n        $(\"#radial2\").show(\"slow\");\n        $(\"#radial3\"\
  ).show(\"slow\");\n        $(\"#radial4\").hide(\"slow\");\n      });\n    });\n\
  \  </script>\n</div>\n<div data-role=\"footer\">\n  <h3>JQuery Mobile 与 Canvas 图形</h3>\n\
  </div>\n</div>\n\n注意 Listing 9.4 包含单个 jQuery Mobile 页面视图。在初始化了一些 JavaScript 变量后，Listing\
  \ 9.4 包含了 JavaScript 变量 `gradient1`、`gradient2`、`gradient3` 和 `gradient4` 的定义，每个变量包含一个基于\
  \ Webkit 的径向渐变定义。\n\n当用户点击 id 为 `MyCanvas` 的 `<canvas>` 元素时，代码会在点击事件添加一个新的矩形，然后\
  \ `<canvas>` 元素会缓慢消失，如下：\n\n```javascript\n$(\"#MyCanvas\").live('vmousedown',function(event)\
  \ {\n  xCoord = 0.40*(event.clientX)*window.devicePixelRatio;\n  yCoord = 0.40*(event.clientY)*window.devicePixelRatio;\n\
  \  context.fillStyle = rectColors[++tapCount%rectColors.length];\n  context.fillRect(xCoord,\
  \ yCoord, rectWidth, rectHeight);\n  $(\"#MyCanvas\").hide(\"slow\");\n});\n```\n\
  \n记住，你必须使用 `vmousedown` 事件，因为 jQuery Mobile 中的点击事件不会为你提供点击位置的坐标。在计算点击位置时，你还需要使用\
  \ `window.devicePixelRatio` 的值。\n\n当用户点击 id 为 `tapInside` 的 `<canvas>` 元素时，隐藏的 `<canvas>`\
  \ 元素将再次显示，并带有之前通过 `fillRect()` 方法渲染的所有矩形。\n\n当用户点击 id 值为 `CanvasParent` 的 `<canvas>`\
  \ 元素时，代码首先使用条件逻辑来确定选择种径向渐变并将其赋值给 JavaScript 变量 `currentBG`。\n\n接下来，在点击事件的位置动态创建一个新的\
  \ HTML `<div>` 元素并将其追加到 `CanvasParent` 元素中，如下：\n\n```javascript\nnewNode = $('<div>').css({'position':'absolute',\n\
  \  'background': currentBG,\n  'width':'35px',\n  'height':'35px',\n  'left': event.pageX,\n\
  \  'top': event.pageY\n});\n$(\"#CanvasParent\").append(newNode);\n```\n\n注意，在前面的代码中\
  \ `position` 被设置为 `absolute`，这意味着这个动态创建的 `<div>` 将保持可见。最后，当用户点击任何 `<div>` 元素时，代码将导致它们消失。\n\
  \n### JQuery Mobile 与 Canvas 图形\n\n```html\n<div id=\"tapInside\">\n  <p>点击红色矩形内部隐藏，点击此处显示：</p>\n\
  </div>\n<div id=\"CanvasParent\" name=\"CanvasParent\">\n  <canvas name=\"MyCanvas\"\
  \ id=\"MyCanvas\" style=\"background:#f00;width=80%;height=200px\"></canvas>\n \
  \ <div id=\"outer\">\n    <div id=\"radial3\">Text3</div>\n    <div id=\"radial2\"\
  >Text2</div>\n    <div id=\"radial4\">Text4</div>\n    <div id=\"radial1\">Text1</div>\n\
  \  </div>\n  <!-- jQuery 切换处理代码 -->\n  <script>\n    $(document).ready(function()\
  \ {\n      $(\"#outer\").toggle(function(){\n        $(\"#radial1\").show(\"slow\"\
  );\n        $(\"#radial2\").hide(\"slow\");\n        $(\"#radial3\").hide(\"slow\"\
  );\n        $(\"#radial4\").show(\"slow\");\n      },function(){\n        $(\"#radial1\"\
  ).hide(\"slow\");\n        $(\"#radial2\").show(\"slow\");\n        $(\"#radial3\"\
  ).show(\"slow\");\n        $(\"#radial4\").hide(\"slow\");\n      });\n    });\n\
  \  </script>\n</div>\n<div data-role=\"footer\">\n  <h3>JQuery Mobile 与 Canvas 图形</h3>\n\
  </div>\n```\n\n\n\n\n\n![image](img/cd.jpg) HTML5 页面 `LRGradQCBezier1.html` 展示了如何渲染带有线性渐变着色的二次贝塞尔曲线，以及带有径向渐变着色的三次贝塞尔曲线。光盘中提供了两个\
  \ CSS 样式表 `CSS3Background4.css` 和 `HoverAnimation1.css`。\n\nHTML5 页面 `LRGradQCBezier1.html`\
  \ 中定义的三次贝塞尔曲线是根据几个计算点，使用六个颜色停止点通过径向渐变渲染的，所示：\n\n```\ncontext.bezierCurveTo(\n  \
  \    currentX+3*multiplier*rectWidth,\n      currentY+2*multiplier*rectHeight,\n\
  \      currentX+2*multiplier*rectWidth,\n      currentY-multiplier*rectHeight,\n\
  \      currentX+100, currentY+300);\n```\n\n尝试贝塞尔曲线中点的不同值，你可能会发现其他创建良好视觉效果的方法。列表\
  \ 9.6 的下一部分使用带有五个颜色停止点的线性渐变渲染二次贝塞尔曲线。\n\n请注意，每当用户点击“重绘（redraw）”按钮时，都会根据变量 `clickCount`\
  \ 的值绘制另一条三次和二次贝塞尔曲线，该变量会在用户每次点击“重绘”按钮时递增。新曲线叠加在之前的曲线上，从而营造出良好的视觉效果。然而，如果你想在渲染另一对贝塞尔曲线之前刷新\
  \ HTML5 `<canvas>` 元素，只需取消以下代码段中第二行的注释：\n\n```\n// clear the canvas before drawing\
  \ new set of rectangles\n//context.clearRect(0, 0, elem.width, elem.height);\n```\n\
  \n![image](img/fig9.7.jpg)\n\n**图 9.7** iPad3 上的渐变贝塞尔曲线。\n\n图 9.7 在 iPad3 的横屏模式下渲染了\
  \ `LRGradQCBezier1.html` 中定义的二次和三次贝塞尔曲线。\n\nHTML5 Canvas 支持 JPG 文件的渲染，你还可以对 HTML5\
  \ `<canvas>` 元素应用 CSS 选择器。光盘包含 HTML5 Web 页面 `Image1.html` 和 `Image1.css`，其选择器匹配\
  \ HTML5 `<canvas>` 元素。\n\n顺便提到，HTML5 Canvas 还支持 `clip()` 方法，允许你以各种方式“裁剪”JPG 文件。此外，你可以执行合成效果，甚至可以操作\
  \ JPG 文件的单个像素。可以在互联网上搜索描述这些效果技术细节的文章。\n\nHTML5 Canvas 提供了 `createPattern(image,\
  \ type)` 方法，允许你根据模式类型渲染一组图像，其取值可以是 `repeat`、`repeat-x`、`repeat-y` 和 `no-repeat`。语法的示例（以及如何使用它）如下所示：\n\
  \n```\nvar pattern = canvas.createPattern(img,\"repeat\");\ncanvas.fillStyle = pattern;\n\
  canvas.fillRect(0,0,500,300);\n```\n\n![image](img/cd.jpg) 光盘上的 HTML5 Web 页面 `RepeatingImage1.html`\
  \ 展示了如何在 HTML5 `<canvas>` 元素上重复 JPG 。\n\n图 9.8 在 MacBook 的 Chrome 浏览器上以横屏模式显示 `RepeatingImage1.html`。\n\
  \n![image](img/fig9.8.jpg)\n\n**图 9.8** MacBook 上 Chrome 浏览器中的重复 JPG 。\n\n### 其他\
  \ HTML5 Canvas 工具包 (#toc.html_toc-h1-0093)\n\n有几个非常好的 JavaScript 工具包，它们在 HTML5 Canvas\
  \ 之上提供了抽象层，包括 `Easel.js`、`Fabric.js` 和 `Paper.js`。\n\n除了这些工具包各自主页提供的代码示例外，你可能喜欢以下开源项目的内容，该项目使用\
  \ `Easel.js` 创建图形代码示例：\n\n*http://code.google.com/p/easeljs-graphics*\n\n### 总结\
  \ (#toc.html_toc-h1-0094)\n\n本章介绍了 HTML5 Canvas，并向你展示了使用 HTML5 `<canvas>` 元素创建 2D\
  \ 形状的示例。你还学习了如何将 HTML5 Canvas 与 jQuery 自代码相结合，以便使用基于 Canvas 的 2D 形状操作 HTML5 Web\
  \ 页面。特别是，你学习了如何在 HTML5 Canvas 中实现以下操作：\n\n* 渲染线段、矩形和圆形\n* 创建线性和径向渐变\n* 创建贝塞尔曲线\n\
  * 显示 JPG 文件\n* 使用 `jCanvas`（用于 Canvas 的 jQuery 插件）\n* 将 HTML5 Canvas 与 CSS3 结合\n\
  * 将 HTML5 Canvas 与 jQuery Mobile 结合\n\n# 第 10 章 (#toc.html_toc-10)\n\n## 使用 PHONEGAP\
  \ 开发 HTML5 移动应用 (#toc.html_toc-10)\n\n本章向你展示如何为 Android 和 iOS 创建基于 HTML5 的混合移动应用程序。本章中的代码示例包含了\
  \ HTML5 以及 HTML5、CSS3 和 SVG 的各种组合。\n\n正如你很快会发现的，基于 Android 的代码示例比基于 iOS 的多。代码示例的移动平台选择纯粹出于风格考虑。然而，每个基于\
  \ Android 的代码示例都有对应的 iOS 版本。\n\n本章的第一部分概述了如何使用“手动”方法而不是工具包来开发移动应用程序。本节的代码示例使用了你之前看过的代码，并向你展示如何创建截图。如果你很有野心，可以为本章中的所有示例创建\
  \ Android 移动应用程序。\n\n本章的第二部分包含了基于 Android 代码示例，向你展示如何结合 CSS3、SVG 和 HTML5 Canvas。本节包含了一个多线图的示例，其值可以每当用户点击按钮时进行更新。请记住，代码示例后的讨论非常快，因为\
  \ HTML 页面包含简单的标记，CSS3 选择器包含了你在前面章节中的代码，而 SVG 形状在第 4 章讨论过。\n\n本章的第三部分提供了 `Apache\
  \ Cordova`（以前称为 PhoneGap）这一流行的跨平台工具包。2011 年 Adobe 收购了创建 PhoneGap 的 Nitobi 公司，随后\
  \ Adobe 开源了 PhoneGap。本节解释了 PhoneGap 可以做什么，以及与它配合的一些工具包。你将学习如何创建一个渲染 CSS3 效果的 Android\
  \ 应用。你可以将此移动应用部署到支持 Android ICS 或更高版本的 Android 设备上。\n\n本章的最后一部分讨论了如何使用 Xcode 的 PhoneGap\
  \ 插件创建 iOS 混合移动应用程序。\n\n正如你在本章看到的，PhoneGap 允许你使用 HTML、CSS 和 JavaScript 创建移动应用程序。你可以将这些移动应用程序部署到多个平台，包括\
  \ Android、iOS、BlackBerry 和 Windows Mobile。你还可以创建结合 PhoneGap 和 Sencha Touch（另一种流行的框架）的移动应用程序。然而，由于空间限制，本章未讨论\
  \ Sencha Touch。\n\n\n\n\n\n如果你对 Android 不熟悉，可以阅读本书的附录，其中对本章代码示例中涉及的 Android 特定概念进行了简要概述。每当你遇到不清楚的\
  \ Android 概念时，都可以参考相应的章节。\n\n本节的代码示例向你展示了如何在 Android 应用程序中启动 HTML5 Web 页面（该页面还引用了\
  \ CSS3 样式表）。核心思想包含三个步骤：\n\n1. 修改 Android `Activity` 类以实例化 Android `WebView` 类，并进行一些与\
  \ JavaScript 相关的设置。\n2. 引用 Android 项目中 `assets/www` 子目录下的 HTML5 Web 页面。\n3. 将 HTML5\
  \ Web 页面、CSS 样式表和 JavaScript 文件复制到 Android 项目的 `assets/www` 子目录中。\n\n在步骤 3 中，你可能会创建一个分级目录结构，其中包含相同类型（HTML、CSS\
  \ 或 JavaScript）的文件，这与你在 Web 应用程序中组织文件的方式非常相似。\n\n现在启动 Eclipse，并创建一个名为 `AndroidCSS3`\
  \ 的 Android 项目。请确保你选择的是 Android 版本 3.1 或更高版本，这是渲染基于 CSS3 效果所必需的。\n\n创建项目后，让我们来看包含此\
  \ Android 移动应用程序自定义代码的四个文件。列表 10.1、10.2 和 10.3 分别显示了项目文件 `main.xml`、`AndroidCSS3.html`\
  \ 和 `AndroidCSS3Activity.java` 的内容。\n\n### 列表 10.1 main.xml\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \n    android:layout_height=\"fill_parent\">\n  <WebView android:id=\"@+id/webview\"\
  \n              android:layout_width=\"fill_parent\"\n              android:layout_height=\"\
  fill_parent\"/>\n</LinearLayout>\n```\n\n列表 10.1 指定了一个包含 Android `WebView` 的 `LinearLayout`，它将占据移动设备的整个屏幕。这是我们想要看到的效果，因为\
  \ Android 默认浏览器是在 Android `WebView` 渲染的。\n\n### 列表 10.2 AndroidCSS3.html\n\n```html\n\
  <!doctype html>\n<head>\n  <title>CSS Radial Gradient Example</title>\n  <link href=\"\
