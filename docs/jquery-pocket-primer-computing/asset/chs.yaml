  \ 列表 4.2 相同。\n\n### 列表 4.4 JQUICheBoxRadio1.html\n\n```html\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Checkbox and Radio\
  \ Buttons</title>\n  <link href=\"JQUICheBoxRadio1.css\" rel=\"stylesheet\" type=\"\
  text/css\">\n</head>\n<body>\n  <!-- 内容已根据原文错乱逻辑进行修复 -->\n</body>\n</html>\n```\n\
  \n\n\n\n图 4.3 MacBook 上 Chrome 浏览器中的复选框/按钮。\n\n## 组合框 (Combo Boxes)\n\njQuery 支持\
  \ HTML 组合框，你可以向其绑定事件处理器，以检测与这些 HTML 元素相关的事件。\n\n列表 4.5 显示了 `JQUIComboBox1.html`\
  \ 的内容，说明了如何在 HTML Web 页面中渲染组合框，以及当用户在组合框中选择不同的值时如何执行一段代码。\n\n### 列表 4.5 JQUIComboBox1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery ComboBox</title>\n  <link type=\"text/css\" href=\"css/themename/jquery-ui-1.8.14.custom.css\"\
  \ />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n  <style>\n    #ComboBoxInfo\
  \ {\n      position: relative;\n      font-size: 20px;\n      top: 10px;\n     \
  \ width: 50%;\n      height: 50px;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"\
  outer\">\n    <div>\n      <fieldset id=\"ComboBoxInfo\">\n        <label for=\"\
  ComboBox\"><strong>我的组合框：</strong></label>\n        <select id=\"ComboBox\">\n \
  \         <option value=\"1\">Value 11</option>\n          <option value=\"2\">Value\
  \ 2</option>\n          <option value=\"3\">Value 3</option>\n          <optgroup\
  \ label=\"Group1\">\n            <option value=\"4\">Value 4</option>\n        \
  \    <option value=\"5\">Value 5</option>\n            <option value=\"6\">Value\
  \ 6</option>\n          </optgroup>\n        </select>\n        <label for=\"selected1\"\
  ><strong>你选择了：</strong></label>\n        <input id=\"selected1\" type=\"text\" value=\"\
  \">\n      </fieldset>\n    </div>\n  </div>\n  <script>\n    $(document).ready(function()\
  \ {\n      $(\"#ComboBox\").change(function() {\n        // 显示选中的值\n        $(\"\
  #selected1\").val(\n          $(\"#ComboBox option:selected\").text());\n      });\n\
  \    });\n  </script>\n</body>\n</html>\n```\n\n列表 4.5 的内容非常直观：第一部分引用了所需的 jQuery\
  \ 文件，随后是一个 HTML `<style>` 元素，然后是组合框中项目的的定义。\n\n每当用户更改组合框中的选定项目时，这段代码就会被执行：\n\n```javascript\n\
  $(\"#ComboBox\").change(function() {\n  // 显示选中的值\n  $(\"#selected1\").val(\n  \
  \  $(\"#ComboBox option:selected\").text()\n  );\n});\n```\n\n图 4.4 显示了在 Chrome\
  \ 浏览器中渲染列表 4.5 中 `JQUIComboBox1.html` 的结果。\n\n图 4.4 MacBook 上 Chrome 浏览器中的组合框。\n\
  \n## 日期选择器 (Date Pickers)\n\njQuery 支持“日期选择器”功能，让你能够设置过去、现在和未来的日期，并能够以相关上下文的方式修改这些日期。\n\
  \n列表 4.6 显示了 HTML5 Web 页面 `JDatePicker1.html` 的内容，说明了如何在 HTML 页面中渲染 jQuery 日期选择器。省略了\
  \ CSS 样式表 `JDatePicker1.css`，因为它的内容与列表 4.2 相同。\n\n### 列表 4.6 JDatePicker1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>Date Picker</title>\n  <script src=\"http://code.jquery.com/jquery-ui-1.8.1.custom.min.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n\
  \  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n  <style>\n \
  \   #input1, #input2, #input3 {\n      width: 150px;\n      height: 50px;\n    \
  \  float: left;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"outer\">\n    <div\
  \ id=\"input1\">\n      上周：\n      <input type=\"text\" name=\"date\" id=\"date1\"\
  \ />\n    </div>\n    <div id=\"input2\">\n      今日：\n      <input type=\"text\"\
  \ name=\"date\" id=\"date2\" />\n    </div>\n    <div id=\"input3\">\n      未来的日期：\n\
  \      <input type=\"text\" name=\"date\" id=\"date3\" />\n    </div>\n  </div>\n\
  \  <script>\n    $(document).ready(function() {\n      // 将日期设为上周\n      var defaultDate1\
  \ = $(\"#date1\").datepicker(\"option\", \"defaultDate\");\n      $(\"#date1\").datepicker(\"\
  option\", \"defaultDate\", -7);\n      // 将日期设为今天\n      var defaultDate2 = $(\"\
  #date1\").datepicker(\"option\", \"defaultDate\");\n      $(\"#date2\").datepicker(\"\
  option\", \"defaultDate\", +0);\n      // 将日期设为未来\n      var futureDate = \"07/07/2017\"\
  ;\n      $(\"#date3\").datepicker(\"setDate\", futureDate);\n    });\n  </script>\n\
  </body>\n</html>\n```\n\n列表 4.6 引用了通常的 jQuery 文件，随后是一个应用于三个 `<div>` 元素样式的 `<style>`\
  \ 元素。HTML `<body>` 元素指定了三个 `<div>` 元素的容器，随后是一段将三个 `<input>` 字段转换为日期选择器组件的代码：\n\n\
  ```javascript\n$(\"#date1\").datepicker();\n$(\"#date2\").datepicker();\n$(\"#date3\"\
  ).datepicker();\n```\n\n你可以指定一个未来的日期，当你想要更改该日期时，jQuery 将显示相对于该日期的上个月和下个月，如下所示：\n\
  \n```javascript\n// 将日期设为未来\nvar futureDate = \"07/07/2017\";\n$(\"#date3\").datepicker(\"\
  setDate\", futureDate);\n```\n\n图 4.5 显示了在 Chrome 浏览器中渲染列表 4.6 中 `JDatePicker1.html`\
  \ 的结果。\n\n图 4.5 MacBook 上 Chrome 浏览器中的日期选择器。\n\n## 进度条 (Progress Bars)\n\n你可以轻松地创建和更新进度条。列表\
  \ 4.7 显示了 `JProgressBar1.html` 的内容，说明了如何在 HTML 页面中渲染进度条。\n\n### 列表 4.7 JProgressBar1.html\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>Progress Bar</title>\n  <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.8/base/jquery-ui.css\"\
  />\n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script src=\"\
  http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n  <style>\n    #progressBar1\
  \ {\n      width: 30%;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"outer\"\
