  \ 展示了如何在 jQuery HTML5 页面中渲染一组垂直跳动的球。图 3.3 显示了在带有 Android ICS 的 Asus Prime 平板电脑上渲染此\
  \ HTML5 5 页面的结果。\n\n**图 3.3** 带有 Android ICS 的 Asus Prime 平板上的跳动球。\n\njQuery 插件\
  \ `PFold` 提供了一种很好的折叠效果，可以在此处下载：\n\nhttp://tympanus.net/Development/PFold\n\n# 动画：比较\
  \ CSS3 与 jQuery（#toc.html_toc-h1-0025）\n\nCSS3 和 jQuery 之间的性能差异是一个有趣且显然重要的话，特别是当你计划开发一个包含许多动画的页面或应用程序时。本节提供了三个带有性能基准的链接。\n\
  \n第一个链接是 Christian 编写的一篇文章，其中包含了五个与性能相关的提示：\n\nhttp://christianheilmann.com/2013/01/25/five-things-you-can-to-make-html5-better/\n\
  \n第二个链接提供了性能基准（它与 Christian 的略有不同）：\n\nhttp://blog.tumult.com/2013/02/28/transform-translate-left/\n\
  \n第三个链接是 Opera 网站上一篇文章，比较了性能：\n\n“CSS3 在比赛中胜出。巨大的差异是因为浏览器的 CSS 解析器是用 C++ 编写的，执行非常快，而\
  \ jQuery（JavaScript）是一种解释型语言，浏览器无法预测未来发生什么事件。”\n\n上述引用自以下网站：\n\nhttp://dev.opera.com/articles/view/css3-vs-jquery-animations/#comments\n\
  \n上述网站还指出：“虽然尽管上述结果表明你应该使用 CSS3 进行动画，但请记住我们之前讨论过的优缺点。你需要考虑到很大一部分仍然在使用 Internet Explorer\
  \ 7 和 8，所以如果你的动画绝对需要在这些旧浏览器中工作，你应该使用 jQuery。”\n\n上述链接提供了改进你的 HTML5 页面性能的指南。然而，你可能需要对\
  \ HTML5 页面的内容进行更详细的分析以进行调整。在互联网上搜索讨论类似动画效果的文章。\n\n# 总结（#toc.html_toc-h1-0026）\n\n\
  本章向你介绍了 jQuery 图形和动画效果，以及展示如何使用 jQuery 函数创建简单动画效果的代码示例。特别是，你学习了如何执行以下操作：\n\n-  \
  \ jQuery 基础动画\n-   效果动作\n-   滚动效果\n-   使用 jQuery 处理 CSS3 选择器\n-   使用 `css()` 函数设置属性\n\
  -   切换 CSS 属性\n-   创建圆角\n-   创建阴影效果\n-   设置线性和径向渐变\n-   处理图像\n-   使用回调函数\n回调函数\n\
  -   `fadeIn()`、`fadeOut()` 和 `fadeTo()` 方法\n-   设置速度\n-   切换 `hide()` 和 `show()`\n\
  -   jQuery 渐入和滑动动画效果\n\n\n\n\n\n*   `fadeIn()` 和 `fadeOut()` 函数\n*   jQuery `slideUp()`\
  \ 和 `slideDown()` 函数\n*   jQuery 中的缓动函数 (Easing functions)\n*   使用 `animate()` 自定义\
  \ CSS 动画\n*   创建幻灯片\n*   基于 CSS3 的动画效果\n*   使用 CSS3 的简单滑动效果\n*   使用 CSS3 更新多个属性\n\
  *   使用 CSS 的滑动效果\n*   使用 CSS3 keyFrames 和 2D 变换的动画效果\n*   使用 CSS3 和 jQuery 进行 2D\
  \ 变换\n*   使用 CSS3 和 jQuery 进行 3D 变换\n*   使用 jQuery 的鼠标跟随示例\n*   你的第一个绘图程序\n\n下一章将向你介绍各种\
  \ jQuery UI 控件，以及展示如何在 HTML5 网页中渲染某些 jQuery UI 控件的代码示例。\n\n## 第 4 章：jQuery UI 控件\n\
  \n本章向你介绍各种 jQuery UI 控件，并提供如何在 HTML5 网页中渲染某些 jQuery UI 控件的代码示例。使用这些 UI 控件的理由很简单：它们不需要像编写自己的自定义\
  \ UI 控件那样花费大量精力，你不需要维护这些控件的代码。此外，这些 UI 控件在多种浏览器上运行良好。\n\n你将看到使用 jQuery 渲染手风琴 (accordions)、按钮、组合框、日期选择器、进度条、滑块和标签的示例。此外，你将学习如何编写处理涉及\
  \ jQuery UI 控件的用户触发事件。你可以通过查询 jQuery 主页了解更多可用 UI 控件。\n\n本章中的 jQuery UI 控件按字母顺序排列，因此你可以自由跳读，阅读你感兴趣的\
  \ UI 控件。虽然 jQuery 文档中提供了关于这些 UI 控件的信息，但这是一本入门读物，因此将 UI 控件列表列在一个方便的地方，比告诉你“去读文档”更为恰当。在读完本章后，你也将能够更好地理解章末的冗长代码示例。该示例以一种反映较为真实场景的方式展示了一个带有各种\
  \ jQuery UI 控件的 HTML5 网页。\n\n本章还包含用于处理用户点击事件的代码示例，这些事件会触发同一 HTML5 网页中此处定义的其他（有时是图形的）元素的更新。这种方法易于理解如何实现事件相关的功能，希望你能够根据自己的特定需求调整本章中的代码示例。\n\
  \n需要记住的一点是，本章中的 HTML5 网页同时包含 HTML 标记和 jQuery 代码。对于较长的网页，将 jQuery 代码放在单独的文件（正如我们处理\
  \ CSS 样式表的那样）更有意义。然而，本章中的几乎每个网页都很短（在 1 页到 1.5 页之间），因此出于考虑，将代码保留在单个文件中。\n\n第二点涉及如何编写自己的\
  \ jQuery 插件，这超出了本书的范围。如果你找不到任何符合你现有 jQuery 插件，可以在网上找到教程学习如何编写 jQuery 插件。\n\n## 本章中使用\
  \ jQuery 2.0\n\n以下代码示例在 jQuery 1.5 上可以正常工作，但在 jQuery 2.0.0 中无法正常工作：\n\n*   `JQUIProgressBar1.html`（不显示进度条）\n\
  *   `JQUISlider1.html`（不显示滑块）\n*   `JQUISliderColors1.html`（不显示滑块）\n*   `JQUIThemes1.html`（使用\
  \ github 上的可用插件）\n\n请记住，jQuery 的未来版本将解决这些问题以及你在使用 jQuery 的 HTML 网页中可能遇到的其他不一致问题。\n\
  \n## 手风琴效果\n\njQuery UI 支持手风琴控件，它包含一个或多个“文件夹”，只有当用户点击特定文件夹时，才会显示其内容。\n\n`Listing\
  \ 4.1` 显示了 HTML5 网页 `JQUIAccordion1.html` 的内容，它说明了如何渲染手风琴控件。\n\n**列表 4.1 JQUIAccordion1.html**\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>jQuery Accordion</title>\n  <link href=\"JQUIAccordion1.css\" rel=\"\
  stylesheet\" type=\"text/css\">\n  <link type=\"text/css\" href=\"css/themename/jquery-ui-1.8.14.custom.css\"\
  \ />  \n  <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n \
  \ <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n  <script\
  \ src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n  <link href=\"\
  JQUIAccion1.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n  <div\
  \ id=\"accordion\">\n    <h3><a href=\"#\">Section 1</a></h3>\n    <div><p>This\
  \ is the first section of the accordion.</p></div>\n    <h3><a href=\"#\">Section\
  \ 2</a></h3>\n    <div>\n      <p>This is the second section of the accordion.</p>\n\
  \      <ul>\n        <li>item one</li>\n        <li>item two</li>\n        <li>item\
  \ three</li>\n      </ul>\n    </div>\n    <h3><a href=\"#\">Section 3</a></h3>\n\
  \    <div><p>This is the third section of the accordion.</p></div>\n    <h3><a href=\"\
  #\">Section 4</a></h3>\n    <div>\n      <p>This is the fourth section of the accordion.</p>\n\
  \      <div id=\"outer\">\n        <div id=\"inner1\"></div>\n        <div id=\"\
  inner2\"></div>\n        <div id=\"inner3\"></div>\n      </div>\n    </div>\n \
  \ </div>\n  <script>\n    $(document).ready(function() {\n      $(\"#accordion\"\
  ).accordion();\n    });\n  </script>\n</body>\n</html>\n```\n\n\n\n\n启动列表 4.1 中的\
  \ HTML5 Web 页面，并点击渲染后的手风琴控件中的每个“文件夹”，这将显示当前选中文件夹的内容，并隐藏该手风琴中其他文件夹的内容。\n\n图 4.1 显示了在\
  \ 列表 4.1 中 `JQUIAccordion1.html` 的渲染结果，该截图取自运行在 Android ICS 的 Nexus S 4G 上的 Android\
  \ 应用程序，采用横屏模式。\n\n## 按钮\n\n按钮\n\n按钮在 Web 页面中非常重要，特别是对于提交表单数据，jQuery 为按钮相关的功能提供了重大的支持。你可以定义\
  \ CSS3 选择器来对 HTML 按钮应用任何所需的样式效果，包括渐变和阴影效果。\n\n列表 4.3 显示了 HTML5 Web 页面 `JQUIButtons1.html`\
  \ 的内容，它说明了如何在 HTML Web 页面中渲染按钮。CSS 样式表 `JQUIButtons1.css` 被省略，因为它的内容与 列表 4.2 相同。\n\
  \n### 列表 4.3 JQUIButtons1.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n  <meta charset=\"utf-8\" />\n  <title>jQuery Buttons</title>\n  <link href=\"\
  JQUIButtons1.css\" rel=\"stylesheet\" type=\"text/css\">\n  <link type=\"text/css\"\
  \ rel=\"Stylesheet\" href=\"css/themename/jquery-ui-1.8.14.custom.css\" />\n  <script\
  \ src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n  <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"\
  ></script>\n  <script src=\"http://code.jquery.com/ui/1.10.1/jquery-ui.js\"></script>\n\
  </head>\n<body>\n  <div id=\"outer\">\n    <div class=\"buttons\">\n      <button>A\
  \ regular button</button>\n      <input type=\"submit\" value=\"A submit button\"\
  >\n      <a href=\"#\">An anchor button</a>\n    </div>\n    <div id=\"inner1\"\
  ></div>\n    <div id=\"inner2\"></div>\n    <div id=\"inner3\"></div>\n  </div>\n\
  \  <script>\n    $(function() {\n      $( \"input:submit, a, button\", \".buttons\"\
  \ ).button();\n    });\n  </script>\n  <script>\n    $(document).ready(function()\
  \ {\n      var divColors = new Array('#000', '#F0F', '#F00', '#0F0', '#00F', '#0FF');\n\
  \      var clickCount = 0;\n      var color1 = \"\";\n      $(\"button\").click(function()\
  \ {\n        ++clickCount;\n        color1 = divColors[(clickCount) % divColors.length];\n\
  \        $(\"#inner1\").css({background: color1});\n      });\n      $(\"input\"\
  ).click(function() {\n        ++clickCount;\n        color1 = divColors[(clickCount)\
  \ % divColors.length];\n        $(\"#inner2\").css({background: color1});\n    \
  \  });\n      $(\"a\").click(function() {\n        ++clickCount;\n        color1\
  \ = divColors[(clickCount) % divColors.length];\n        $(\"#inner3\").css({background:\
  \ color1});\n      });\n    });\n  </script>\n</body>\n</html>\n```\n\n列表 4.3 包含一个\
  \ `<script>` 元素，该元素通过一行代码将 `button()` 方法应用于三个 HTML 元素并将其转换为 jQuery 按钮，代码所示：`$(\"\
  input:submit, a, button\", \".buttons\").button();`。注意，前面的代码段也指定了类 `.buttons`（它用于为包含\
  \ HTML 按钮和链接的 `<div>` 元素设置样式）。这个额外的类在代码中是多余的，但它展示了指定一组想要转换为 jQuery 按钮的 HTML 元素的灵活性。\n\
  \n接下来的代码块渲染了三个 `<div>` 元素，其颜色在关联 CSS 样式表中定义的选择器中指定。启动列表 4.3 中的 HTML Web 页面，当你点击顶行的按钮（包括链接）时，矩形会发生变化。例如，由于以下代码的作用，每当用户点击按钮时按钮就会改变颜色：\n\
  \n```javascript\n$(\"button\").click(function() {\n  ++clickCount;\n  color1 = divColors[(clickCount)\
  \ % divColors.length];\n  $(\"#inner1\").css({background: color1});\n});\n```\n\n\
  在前面的事件处理器中，颜色是从 JavaScript 数组 `divColors` 中选择的，该数组包含一组颜色。图 4.2 显示了在 列表 4.3 中 `JQUIButtons.html`\
  \ 的渲染结果，该截图取自 iPad 的横屏模式![image](img/fig4.2.jpg) **iPad 上的图 4.2**。\n\n## 复选框和单选框\n\
