  \n\n\n\n\njQuery Mobile 按钮元素或 `type` 属性为 `submit`、`reset`、`button` 或 `image` 的输入元素不需要\
  \ `data-role=\"button\"` 属性，因为 jQuery Mobile 会自动将这些元素视为基于链接的按钮。\n\n虽然原始的基于表单的按钮没有显示，但它被包含在\
  \ HTML 标记中。当链接按钮发生点击事件时，原始表单按钮也会发生相应的点击事件。\n\n## 按钮组与列网格\n\njQuery Mobile 允许你通过定义一个指定了\
  \ `data-role=\"controlgroup\"` 属性的容器 HTML `<div>` 元素并包含一个或多个按钮元素，将一组按钮（或复选框或单选按钮）渲染为一个块。所包含的按钮的默认渲染方式是水平的（一行），你可以通过指定\
  \ `data-type=\"vertical\"` 属性将按钮渲染为垂直组。\n\njQuery Mobile 会渲染按钮，移除按钮之间的间距（以及外阴投影），并对第一个和最后一个按钮进行“圆角”处理以创建类似组的效果。下面的代码块展示了如何指定一个水平按钮组：\n\
  \n```html\n<div data-role=\"controlgroup\">\n  <a href=\"index1.html\" data-role=\"\
  button\">One</a>\n  <a href=\"index2.html\" data-role=\"button\">Two</a>\n  <a href=\"\
  index3.html\" data-role=\"button\">Three</a>\n</div>\n```\n\n需要记住的一点是：如果按钮数量超过屏幕宽度，按钮将“换行”到额外的行。列表\
  \ 7.5 向你展示了如何渲染水平按钮组和垂直按钮组。\n\njQuery Mobile 框架允许你通过块样式类约定 `ui-grid` 渲染基于 CSS 的列。你可以使用类值\
  \ `ui-grid-a`、`ui-grid-b`、`ui-grid-c` 和 `ui-grid-d` 分渲染两列、三列、四列和五列布局。接下来的代码块说明了如何渲染两列布局：\n\
  \n```html\n<div class=\"ui-grid-a\">\n  <div class=\"ui-block-a\">Block 1 and text\
  \ inside will wrap</div>\n  <div class=\"ui-block-b\">Block 2 and text inside will\
  \ wrap</div>\n</div>\n```\n\n注意接下来的显示三列布局的代码块中的差异：\n\n```html\n<div class=\"ui-grid-b\"\
  >\n  <div class=\"ui-block-a\">Block 1 and text inside will wrap</div>\n  <div class=\"\
  ui-block-b\">Block 2 and text inside will wrap</div>\n  <div class=\"ui-block-c\"\
  >Block 3 and text inside will wrap</div>\n</div>\n```\n\n你可以在此处找到更多细节和代码示例：\n\n\
  [`jquerymobile.com/demos/1.0b1/#/demos/1.0/docs/content/content-grids.html`](http://jquerymobile.com/demos/1.0b1/#/demos/1.0/docs/content/content-grids.html)\n\
  \n## 使用主题渲染按钮\n\njQuery Mobile 拥有一套广泛的主题系统，涉及标记为“a”到“e”的主题，用于控制按钮样式的呈现方式。当链接添加到容器中时，jQuery\
  \ Mobile 将为其分配一个与其父元素主题匹配的主题“色块（swatch）”字母。例如，放置在主题为“a”（默认主题下为黑色）的内容容器内的按钮将自动被分配按钮主题“a”（默认主题下为炭灰色）。\n\
  \n这里显示了一个按钮主题的示例：\n\n```html\n<div data-role=\"footer\" class=\"ui-bar\">\n  <a\
  \ href=\"left.html\" data-icon=\"arrow-l\" data-role=\"button\" data-theme=\"a\"\
  >Left</a>\n</div>\n```\n\n列表 7.5 显示了 `JQMButtons1.html` 的内容，它说明了如何水平和垂直渲染按钮、如何应用不同的主题，以及如何指定自定义\
  \ CSS 选择器。\n\n### 列表 7.5 JQMButtons1.html\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <title>jQuery Mobile 中的多个按钮和主题</title>\n\
  \    <link rel=\"stylesheet\" href=\"CSS3Background1.css\" />\n    <link rel=\"\
  stylesheet\" href=\"http://code.jquery.com/mobile/1.1.0/jquery.mobile-1.1.0.min.css\"\
  \ />\n    <script src=\"http://code.jquery.com/jquery-2.0.0b1.js\"></script>\n \
  \   <script src=\"http://code.jquery.com/jquery-migrate-1.1.0.js\"></script>\n \
  \   <script src=\"http://code.jquery.com/mobile/1.1.0/jquery-mobile-1.1.0.min.js\"\
  ></script>\n  </head>\n  <body>\n    <div id=\"page1\" data-role=\"page\">\n   \
  \   <div data-role=\"header\">\n        <!-- 这个按钮出现在左侧 -->\n        <a href=\"abc.html\"\
  \ data-icon=\"arrow-l\" data-theme=\"b\">Index</a>\n        <h1>在移动端渲染按钮</h1>\n\
  \        <!-- 这个按钮出现在右侧 -->\n        <a href=\"def.html\" data-icon=\"plus\" data-theme=\"\
  e\">Add</a>\n      </div>\n      <div class=\"content\" data-role=\"content\">\n\
  \        <div data-role=\"controlgroup\">\n          <a href=\"index1.html\" data-role=\"\
  button\">One</a>\n          <a href=\"index2.html\" data-role=\"button\">Two</a>\n\
  \          <a href=\"index3.html\" data-role=\"button\">Three</a>\n          <a\
  \ href=\"index4.html\" data-role=\"button\">Four</a>\n          <a href=\"index5.html\"\
  \ data-role=\"button\">Five</a>\n        </div>\n        <div data-role=\"controlgroup\"\
  \ data-type=\"vertical\">\n          <a href=\"index6.html\" class=\"shadow\" data-role=\"\
  button\">Vertical1</a>\n          <a href=\"index7.html\" class=\"shadow\" data-role=\"\
  button\">Vertical2</a>\n          <a href=\"index8.html\" class=\"shadow\" data-role=\"\
  button\">Vertical3</a>\n        </div>\n        <div>\n          <a href=\"index9.html\"\
  \ data-role=\"button\" id=\"cancel\" data-inline=\"true\">Cancel</a>\n         \
  \ <a href=\"index10.html\" data-role=\"button\" id=\"submit\" data-inline=\"true\"\
  \ data-theme=\"b\">Save</a>\n        </div>\n      </div>\n      <!-- 显示方向键 -->\n\
  \      <div data-role=\"footer\" class=\"ui-bar\">\n        <a href=\"left.html\"\
  \ data-icon=\"arrow-l\" data-theme=\"a\">Left</a>\n        <a href=\"up.html\" data-icon=\"\
  arrow-u\" data-theme=\"b\">Up</a>\n        <a href=\"down.html\" data-icon=\"arrow-d\"\
  \ data-theme=\"c\">Down</a>\n        <a href=\"right.html\" data-icon=\"arrow-r\"\
  \ data-theme=\"e\">Right</a>\n      </div>\n    </div>\n  </body>\n</html>\n```\n\
  \n\n\n\n\nListing 7.5 中底部的四个 HTML `<a>` 元素渲染了四个方向箭头，因为它们的 `data-icon` 属性分别被设置为 `arrow-l`、`arrow-u`、`arrow-d`\
  \ 和 `arrow-r`。此外，这四个 HTML `<a>` 元素为 `data-theme` 属性指定了不同的值，并根据每种预定义的 jQuery Mobile\
  \ 主题的视觉显示效果进行渲染。\n\n注意，Listing 7.6 中的 HTML `<a>` 元素引用的 HTML 页面并未在此移动应用程序定义。因此，当用户点击这些链接时，他们将看到错误消息。\n\
  \n### 列表 7.6 CSS3Background1.css\n\n```css\n#cancel, #submit, .shadow {\n  background-color:white;\n\
  \  background-image:\n    -webkit-radial-gradient(red 4px, transparent 18px),\n\
