  \ 2px,  green 4px,\n                              yellow 8px, blue 12px,\n     \
  \                         transparent 28px,\n                              green\
  \ 20px, red 24px,\n                              transparent 28px,\n           \
  \                   transparent 32px);\n  background-size: 50px 60px, 70px 80px;\n\
  \  background-position: 0 0;\n  -webkit-box-shadow:  30px 30px 30px #400;\n}\n```\n\
  \nListing 7.6 包含了你在第 2 章 中熟悉的定义。如果你需要温习记忆，可以参考该章节的相关部分。\n\n图 7.6 显示了在 Android 设备上渲染\
  \ Listing 7.5 中 HTML 页面的结果。\n\n![image](img/fig7.jpg) 图 7.6 Android 设备上的按钮。\n\n\
  如你所见，jQuery Mobile 中有很多与样式相关的选项，因此关于 jQuery 按钮的总结可能会有用：\n* 带有 `data-role=\"button\"\
  ` 属性的锚链接会被渲染为按钮。\n* 任何 `type=\"submit\"` 的输入元素或图像都会分配 `ui-btn` 类，并显示基于链接的按钮。\n*\
  \ 添加 `data-icon` 属性可以创建一个带有图标的按钮。\n* 添加 `data-pos` 属性可以更改图标的位置。\n* 指定 `data-inline=\"\
  true\"` 可使按钮的宽度仅与文字等宽。\n* `data-role=\"control\"` 将按钮在 `<div>` 元素中水平分组。\n* `data-theme=\"\
  e\"` 属性是五个预定义主题（从“a”到“e”）中的第五个。\n\n## jQuery Mobile 中的列表视图\n\njQuery Mobile 支持列表视图（移动应用程序中很常见）以及多种变体，包括列表按钮、嵌套列表视图和列表拆分按钮。jQuery\
  \ Mobile 可以通过对列表应用 `data-role=\"listview\"` 属性来增强有序列表无序列表。嵌入锚标签内部的列表视图元素响应用户手势，如\
  \ Listing 7.7 所示，它显示了 jQuery Mobile 页面 ListView.html 的内容。\n\n### 列表 7.7 ListView.html\n\
