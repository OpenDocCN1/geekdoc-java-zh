  \ jQuery Mobile 虚拟鼠标事件](#toc.html_toc-h1-0081)\n\njQuery Mobile 提供了一套“虚拟”鼠标事件来处理鼠标和触摸事件。这些事件非常有用，因为每个事件都能很好地处理相应的触摸事件，这可以减少你在页面中编写的代码量。此外，虚拟鼠标事件的使用支持同一个\
  \ Web 页面中的桌面和移动交互。\n\njQuery 中虚拟鼠标事件的名称以字母 `v`（代表“virtual”）开头，后是鼠标事件的通用名称或标准名称。例如，虚拟事件\
  \ `vmousedown` “派送”了 `mousedown` 事件，同时也触发了 `touchstart` 事件。虚拟鼠标事件（及其相应的触摸相关和鼠标相关事件）的列表所示：\n\
  \n- `vclick` (touchend 或鼠标点击)\n- `vmousecancel` (touch 或 mousecancel)\n- `vmousedown`\
  \ (touchstart 或 mousedown)\n- `vmousemove` (touchmove 或 mousemove)\n- `vmouseover`\
  \ (touch 或 mouseover)\n- `vmouseup` (touchend 或 mouseup)\n\n记住：在支持触摸的设备上，`vclick`\
  \ 事件在 `vmouseup` 事件之后派发；然而，正如你预期的，`vmouseup` 在 `vmousedown` 之前派发，而 `vmousedown`\
  \ 在 `vclick` 之前派发。此外，事件对象包含坐标信息的 `pageX`、`pageY`、`screenX`、`screenY`、`clientX` 和\
  \ `clientY`，你将在后续代码中看到。\n\n![image](img/cd.jpg) CD 上的 HTML5 页面 `QM2DAnimationRGradReflect1.html`\
  \ 和样式 表 `QM2DAnimationRGradReflect1.css` 展示了如何在 jQuery Mobile 中创建 CSS3 2D 动画效果。\n\
  \n```html\n<!-- 列表 8.4 QM2DAnimationRGradReflect1.html -->\n<div data-role=\"page\"\
  >\n  <div data-role=\"content\">\n    <div id=\"outer\">\n      <div id=\"radial3\"\
  >Text3</div>\n      <div id=\"radial2\">Text2</div>\n      <div id=\"radial4\">Text4</div>\n\
  \      <div id=\"radial1\">Text1</div>\n    </div>\n  </div>\n</div>\n```\n\n列表\
  \ 8.4 非常直观：jQuery Mobile 代码包含了四个 `<div>` 元素，它们在关联的 CSS 样式表中对应的 CSS3 选择器。这四个 CSS3\
  \ 选择器定义了径向渐变（在 CD 附带样式表中定义），与第 2 章 中的 CSS3 示例非常相似。（如果需要刷新请阅读相关章节。）关键点在于，尽管此代码中的视觉效果是新的，但它展示了如何轻松地将\
  \ jQuery 代码与 CSS3 图形和动画结合起来。\n\n![image](img/fig8.7.jpg)\n\n***图 8.7*** iPad 上的\
