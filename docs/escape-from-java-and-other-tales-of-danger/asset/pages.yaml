    # Lala Ramjimal


    Lala left us in the afternoon, promising to return when it grew dark, then he
    would take us to his own house. He ran a grave risk in doing so, but he had promised
    us his protection, and he was a man who once he had decided on taking a certain
    course of action, could not be shaken from his purpose. He was not a Government
    servant and owed no loyalties to the British; nor had he conspired with the rebels
    for his path never crossed theirs. He had been content always to go about his
    business (he owned several dolies and carriages, which he hired out to the Europeans
    who could not buy their own) in a quiet and efficient manner, and was held in
    some respect by those he came into contact with; his motives were always'
