    The children’s mother had died when Dolly was born, and their father, Mr Burman,
    worked on a tea estate a few hundred miles away, where there were no schools.
    So the children stayed with Mr Burman’s parents, who wouldn’t have parted with
    them for anything in the world.


    Every year there were earth tremors in this part of India, but there hadn’t been
    a really big earthquake for thirty years.


    ‘What do you do when there’s an earthquake?’ asked Rakesh, who had heard all about
    the last one.


    ‘There isn’t time to do much,’ said Grandfather. ‘Everyone just rushes out of
    doors.’


    ‘I’ll stay in my bed until it’s over,’ said Rakesh. ‘I’ll get under my bed,’ said
    Mukesh. ‘It can’t find me there!’


    ‘It’s best to stand in a doorway,’ said Grandmother.


    “If you look at earthquake pictures, you’ll notice that the door frames are always
    left standing!”


    Although Shillong was in a region where earthquakes sometimes happened, the family
    liked living there.'
