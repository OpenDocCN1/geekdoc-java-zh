  md: '# PUFFIN BOOKS


    # ESCAPE FROM JAVA AND OTHER TALES OF DANGER


    Born in Kasauli (Himachal Pradesh) in 1934, Ruskin Bond grew up in Jamnagar (Gujarat),
    Dehra Dun, New Delhi and Simla. His first novel, The Room on the Roof, written
    when he was seventeen, won the John Llewellyn Rhys Memorial Prize in 1957. Since
    then he has written over three hundred short stories, essays and novellas (including
    Vagrants in the Valley, A Flight of Pigeons and Delhi Is Not Far), and more than
    fifty books for children.


    He has also written numerous articles that have appeared in a number of magazines
    and anthologies. He received the Sahitya Akademi Award in 1993 and the Padma Shri
    in 1999. Several of his stories have been filmed, including The Blue Umbrella,
    A Flight of Pigeons (filmed as Junoon), and Susanna''s Seven Husbands (as a forthcoming
    film Saath Khoon Maaf).


    He lives in Landour, Mussoorie, with his extended family.


