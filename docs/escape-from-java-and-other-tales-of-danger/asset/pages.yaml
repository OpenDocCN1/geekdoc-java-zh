  md: '# The Island in the River


    In the middle of the river, the river that began in the mountains of the Himalayas
    and ended in the Bay of Bengal, there was a small island. The river swept round
    the island, sometimes clawing at its banks but never going right over it. The
    river was still deep and swift at this point, because the foothills were only
    forty miles distant. More than twenty years had passed since the river had flooded
    the island, and at that time no one had lived there. But then years ago a small
    family had come to live on the island and now a small hut stood on it, a mud-walled
    hut with a sloping thatched roof. The hut had been built into a huge rock. Only
    three of its walls were mud, the fourth was rock.


    A few goats grazed on the short grass and the prickly leaves of the thistle. Some
    hens followed them about. There was a melon patch and a vegetable patch and a
    small field of marigolds. The marigolds were sometimes'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'made into garlands, and the garlands were sold during weddings or festivals
    in the nearby town.


    In the middle of the island stood a peepul tree. It was the only tree on this
    tongue of land. But peepul trees will grow anywhere—through the walls of old temples,
    through gravestones, even from rooftops. It is usually the buildings, and not
    the trees, that give way!


    Even during the great flood, which had occurred twenty years back, the peepul
    tree had stood firm.


    It was an old tree, much older than the old man on the island, who was only seventy.
    The peepul was about three hundred. It provided shelter for the birds who sometimes
    visited it from the mainland.


    Three hundred years ago, the land on which the peepul tree stood had been part
    of the mainland; but the river had changed its course and the bit of land with
    the tree on it had become an island. The tree had had lived alone for many years.
    Now it gave shade and shelter to a small family who were grateful for its presence.


    The people of India love peepul trees, especially during the hot summer months
    when the heart-shaped leaves catch the least breath of air and flutter eagerly,
    fanning those who sit beneath.


    A sacred tree, the peepul, the abode of spirits, good and bad.'
