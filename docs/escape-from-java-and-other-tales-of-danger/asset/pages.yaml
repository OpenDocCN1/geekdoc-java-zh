    I realized that I was now fatherless, and my mother, a widow; but we had no time
    to indulge in our private sorrow. Our own lives were in constant danger. From
    our hiding place we could hear the crackling of timber coming from our burning
    house. The road from the city to the cantonment was in an uproar, with people
    shouting on all sides. We heard the tramp of men passing up and down the road,
    just in front of our door; a moan or a sneeze would have betrayed us, and then
    we would have been at the mercy of the most ruffianly elements from the bazaar,
    whose swords flashed in the dazzling sunlight.


    There were eight of us in the little room: Mother, Granny, myself; my cousin,
    Anet; my mother’s halfbrother, Pilloo, who was about my age, and his mother; our
    servants, Champa and Lado; as well as two of our black-and-white spaniels, who
    had followed close on Mother’s heels when she fled from the house.


    The mud hut in which we were sheltering was'
