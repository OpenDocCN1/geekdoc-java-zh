  md: 'Join intrepid heroes and dauntless heroines in their quest for survival against
    earthquakes, fire, floods and bombs!


    Live life on the edge with five stories of danger and adventure. Flee with Romi
    as he rides his cycle straight into the river to escape a fearsome forest; listen
    to Ruth''s hair-raising story of escape from rioting sepoys during the uprising
    of 1857; read about the author''s miraculous flight from Java as Japanese planes
    bombard the city; witness the havoc wreaked by the deadliest earthquake ever in
    Rakesh''s town, Shillong; and watch Sita combat a fatal flood that threatens to
    engulf her.


    Thrilling plots, daring protagonists, explosive exploits—this book has it all!
    Written in Ruskin Bond''s inimitable style, with doses of humour and excitement,
    these extraordinary stories are simply unputdownable.


