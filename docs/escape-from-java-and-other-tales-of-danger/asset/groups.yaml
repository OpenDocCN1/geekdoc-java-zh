    # Escape from Java


    ‘I don’t know,’ I said. ‘It all depends on my father.’

    ‘My father says the Japs will be here in a week.

    And if you’re still here then, they’ll put you to work building a railway.’


    ‘I wouldn’t mind building a railway,’ I said.

    ‘But they won’t give you enough to eat. Just rice with worms in it. And if you
    don’t work properly,

    they’ll shoot you.’


    ‘They do that to soldiers,’ I said. ‘We’re civilians.’

    ‘They do it to civilians, too,’ said Sono.


    What were my father and I doing in Batavia,

    when our home had been first in India and then in

    Singapore? He worked for a firm dealing in rubber,

    and six months earlier he had been sent to Batavia to

    open a new office in partnership with a Dutch business

    house. Although I was so young, I accompanied my

    father almost everywhere. My mother left when I was

    very small, and my father had always looked after

    . After the war was over he was going to take me

    to England.


    ‘Are we going to win the war?’ I asked.

    ‘It doesn’t look like it from here,’ he said.


    No, it didn’t look as though we were winning.

    Standing at the docks with my father, I watched the

    ships arrive from Singapore crowded with refugees—'
- md: '

    men, women and children, all living on the decks in the hot tropical sun; they
    looked pale and worn out and worried. They were on their way to Colombo or Bombay.
    No one came ashore at Batavia. It wasn’t British territory; it was Dutch, and
    everyone knew it wouldn’t be Dutch for long.


    ‘Aren’t we going too?’ I asked. ‘Sono’s father says the Japs will be here any
    day.’


    ‘We’ve still got a few days,’ said my father. He was a short, stocky man who seldom
    got excited. If he was worried, he didn’t show it. ‘I’ve got to wind up a few
    business matters, and then we’ll be off.’


    ‘How will we go? There’s no room for us on those ships.’


    ‘There certainly isn’t. But we’ll find a way, lad, don’t worry.’


    I didn’t worry. I had complete confidence in my father’s ability to find a way
    out of difficulties. He used to say, ‘Every problem has a solution hidden away
    somewhere, and if only you look hard enough you will find it.’


    There were British soldiers the the streets but they did not make it feel much
    safer. They were just waiting for troop ships to come and take them away.


    ## Escape from Java


    No one, it seemed, was interested in defending Java, only in getting out as fast
    as possible.


    Although the Dutch were unpopular with the Javanese people, there was no ill feeling
    against individual Europeans. I could walk safely through the streets. Occasionally
    small boys in the crowded Chinese quarter would point at me and shout, ‘Orang
    Balandi!’ (Dutchman!) but they did so in good humour, and I didn’t know the language
    well enough to stop and explain that the English weren’t Dutch. For them, all
    white people were the same, and understandably so.


    My father’s office was in the commercial area, along the canal banks. Our two-storied
    house, about a mile away, was an old building with a roof of red tiles and a broad
    balcony which had stone dragons at either end. There were flowers in the garden
    almost all the year round. If there was anything in Batavia more regular than
    the bombing, it was the rain, which came pattering down on the roof and on the
    banana fronds almost every afternoon. In the hot and steamy atmosphere of Java,
    the rain was always welcome.


    There were no anti-aircraft guns in Batavia—at least we never heard any—and the
    Jap bombers came over at will, dropping their bombs by daylight. Sometimes bombs
    fell in the town. One day the building next to my father’s office received a direct
    hit and tumbled into the river. A number of office workers were killed.


    The schools closed, and Sono and I had nothing to do all day except sit in the
    house, playing darts or carrom, wrestling on the carpets, or playing the gramophone.
    We had records by Gracie Fields, Harry Lauder, George Formby, and Arthur Askey,
    all popular British artists of the early 1940s. One song by Arthur Askey made
    fun of Adolph Hitler, with the words, ‘Adolph, we’re gonna hang up your washing
    on the Siegfried Line, if the Siegfried Line’s still there!’ It made us feel quite
    cheerful to know that back in Britain people were confident of winning the war!


    One day Sono said, ‘The bombs are falling on Batavia, not in the countryside.
    Why don’t we get cycles and ride out of town?’


    I fell in with the idea at once. After the morning all-clear had sounded, we mounted
    our cycles and rode out of town. Mine was a hired cycle, but Sono’s was his own.
    He’d had it since the age of five, and it was constantly in need of repair. ‘The
    soul gone out of it,’ he used to say.


    Our fathers were at work; Sono’s mother had gone out to do her shopping (during
    air raids she took shelter under the most convenient shop counter) and wouldn’t
    be back for at least an hour. We expected to be back before lunch.


    We were soon out of town, on a road that passed through rice fields, pineapple
    orchards and cinchona plantations. On our right lay dark green hills; on our left,
    groves of coconut palms and, beyond them, the sea. Men and women were working
    in the rice fields, knee-deep in mud, their broad-brimmed hats protecting them
    from the fierce sun. Here and there a buffalo wallowed in a pool of brown water,
    while a naked boy lay stretched out on the animal’s broad back.


    We took a bumpy track through the palms. They grew right down to the edge of the
    sea. Leaving our cycles on the shingle, we ran down a smooth, sandy beach and
    into the shallow water.


    ‘Don’t go too far in,’ warned Sono. ‘There may be sharks about.’


    Wading in amongst the rocks, we searched for interesting shells, then sat down
    on a large rock and looked out to sea, where a sailing ship moved placidly on
    the crisp, blue waters. It was difficult to imagine that half the world was at
    war, and Batavia, two or three miles away, was right in the middle of it.


    On our way home we decided to take a short cut through the rice fields, but soon
    found that our tyres got bogged down in the soft mud. This delayed our return;
    and to make things worse, we got the roads mixed up and reached an area of the
    town that seemed unfamiliar. We had barely entered the outskirts when the siren
    sounded, followed soon after by the drone of approaching aircraft.


    ‘Should we get off our cycles and take shelter somewhere?’ I called out.


    ‘No, let''s race home!’ shouted Sono. ‘The bombs won’t fall here.’


    But he was wrong. The planes flew in very low. Looking up for a moment, I saw
    the sun blotted out by the sinister shape of a Jap fighter-bomber. We pedaled
    furiously; but we had barely covered fifty yards when there was a terrific explosion
    on our right, behind some houses. The shock sent us spinning across the road.
    We were flung from our cycles. And the cycles, still propelled by the blast, crashed
    into a wall.


    I felt a stinging sensation in my hands and legs, as though scores of little insects
    had bitten me. Tiny droplets of blood appeared here and there on my flesh. Sono
    was on all fours, crawling beside me, and I saw that he too had the same small
    scratches on his hands and forehead, made by tiny shards of flying glass.


    We were quickly on our feet, and then we began running in the general direction
    of our homes. The twisted cycles lay forgotten on the road.


    ‘Get off the street, you two!’ shouted someone from a window; but we weren’t going
    to stop running until we got home. My father washed my cuts and scratches, dabbed
    at my face with iodine and then stuck plaster all over my face. Sono and I had
    a fright, and we did not venture far from the house. That night my father said:
    ‘I think we’ll be able to leave in a day or two.’


    ‘Has another ship come in?’


    ‘No.’


    ‘Then how are we going? By plane?’


    ‘Wait and see, lad. It isn’t settled yet. But we won’t be able to take much with
    us—just enough to fill a couple of bags.’


    ‘What about the stamp collection?’ I asked.


    My father’s stamp collection was quite valuable and filled several volumes.


    ‘I’m afraid we’ll have to leave most of it,’ he said. ‘Perhaps Hartono will keep
    it for me, and when the war is over—if it’s over—we’ll come back for it.’


    ‘But we can take one or two albums with us, can’t we?’


    ‘I’ll take one. There’ll be room for one. Then if we’re short of money in Bombay,
    we can sell the stamps.’


    ‘Bombay? That’s in India. I thought we were going back to England.’


    First we must go to India. The following morning I found Sono in the garden, patched
    up like me, and with one foot in a bandage. But he was as cheerful as ever and
    gave me his usual wide grin.


    ‘We’re leaving tomorrow,’ I said.


    The grin left his face.


    ‘I will be sad when you go,’ he said. But then you will be able to escape from
    the Japs.’


    ‘After the war, I’ll come back.’


    ‘Yes, you must come back. And then, when we are big, we will go round the world
    together. I want to see England and America and Africa and India and Japan. I
    want to go everywhere.’


    ‘We can’t go everywhere.’


    ‘Yes, we can. No one can stop us!’


    We had be up very early the next morning. Our bags had been packed late at night.
    We were taking a few clothes, some of my father’s business papers, a pair of binoculars,
    one stamp album, and several bars of chocolate. I was pleased about the stamp
    album and the chocolates, but I had to give up several of my treasures—favourite
