    ## 逃离爪哇及其他危险故事


    拉拉的母亲和姨婶经常来从我们的井里打水，并在我们房子附近的小祭坛前供奉贝叶。起初他们对我们感到很害羞；而我们由于深陷在自己的困境中，挤在房子的角落里，互相看着对方的面い哭。拉拉的妻子会过来用缝合叶子做的盘子为我们上菜。我们每二十四小时只吃一次饭，就在午后不久，但我们对这顿大餐感到很满足了。


