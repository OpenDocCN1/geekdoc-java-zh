    ## 鲁斯金·邦德 (Ruskin Bond)


    ## 逃离爪哇岛

    ## 以及其他危险的故事


    ![](img/defbe82e8b3bd8565140d15d2f49746d_0_0.png)


    ![](img/defbe82e8b3bd8565140d15d2f49746d_1_0.png)


    # 潘芬图书


    # 逃离爪哇岛和其他危险的故事


    鲁斯金·邦德于1934年出生于卡萨利（喜马尔普拉肖邦），在贾姆纳加尔（古吉拉特邦）、德拉敦、新德里和西姆拉长大。他在十七岁时写了他的第一部小说《屋顶上的房间》（The
    Room on the Roof），并于1957年获得了约翰·卢埃林·莱斯纪念奖。从那以后，他创作了三百多篇短篇、散文和中篇小说（包括《山谷流浪者》、《鸽群》和《德里并不遥远》），并编写了五十多部儿童读。


    他还写了大量发表在各类杂志和选集的文章。他于1993年获得文学学院奖（Sahitya Akademi Award），并于1999年获得帕德玛·什里勋章（Padma
    Shri）。他的几部故事被拍成电影，包括《蓝伞》、《鸽群》（电影名为《Junoon》）以及《苏珊娜的七个丈夫》（作为即将上映的电影《Saath Khoon
    Maaf》）。


    他与家人一起住在穆索里地区的兰道尔。


