    ## Earthquake


    had overturned at one place, while another left the rails. Over a thousand people
    lost their lives in the Cherrapunji Hills. The mighty Brahmaputra river burst
    its banks and many farmers were drowned in the flood. In one small town, two elephants
    sat down in the bazaar and refused to get up until the following morning. One
    man was lucky; when the walls of his house came down, a pot of coins showered
    down on him. But no one else found any treasure.


    It rained all night, although the main shock of the earthquake had passed, minor
    shocks took place at regular intervals of five minutes or so. Rakesh stayed awake
    with the grown-ups. He was sure the school buildings had fallen, and there wouldn''t
    be school for months. There wouldn''t be much else, either.


    Early in the morning, Mumtaz got up to make tea on his small primus stove. Grandfather
    got up and went outside. It had stopped raining, but even the sky looked wounded
    as the sun came up red and angry. For many, it would be a long, sad day.


    Soon the children were up and playing around the house. Grandmother opened a tin
    of sardines—sardine tins were earthquake-proof, it seemed—while Mumtaj’s wife
    made chapattis. They went quite well with the sardines. Pickle enjoyed them too.


    Escape from Java and Other Tales of Danger


    Grandfather had washed and bandaged his head, and he was beginning to feel normal
    again.


    ‘Will we be going away?’ asked Rakesh, munching a sardine rolled up in chapatti.


    ‘I suppose we’ll have to,’ said Grandmother. ‘We can go to Calcutta, or stay with
    your father on the tea estates.’


    ‘I don’t want to go,’ said Mukesh.


    ‘Mukesh always wants to do the opposite of everyone else,’ said Rakesh. ‘What
    about you, Dolly? What do you want to do?’


    ‘Dig up my doll’s house,’ said Dolly.


    ‘We’ll get you another,’ said Rakesh. ‘I’ll make one for you.’


    ‘It will have to be Calcutta,’ said Grandfather. ‘There are schools there. Lots
    of them.’


    ‘No,’ said Rakesh. ‘We like it here. The school will start again.’


    ‘But we don’t have a house now!’


    ‘We can build it again, can’t we?’


    ‘Yes,’ agreed Mukesh. ‘We can build it again! Build it again,’ repeated Dolly,
    ‘build it again!’


    All easier than done, said Grandmother. ‘But where’s the money to come from?’


    ‘What’s our Daddy for?’ Rakesh wanted to know.


    ‘He has a job. He can send us money to build a new house, can’t he? That’s what
    fathers are for!’


    ‘Yes, I suppose he could,’ said Grandmother, opening another tin of sardines.
    ‘That’s what sons are for!’


    Grandfather was standing at the gate when he saw his friend Azad, the carpenter,
    passing along the road, looking drawn and pale. Azad raised his hand in greeting
    and made as if to pass on; usually he stopped to talk.


    ‘What’s the hurry?’ asked Grandfather. ‘There’s going to be enough work in town
    to keep you busy for more than a year.’


    ‘But for what—for whom?’ said Azad, without stopping. ‘My wife and daughter are
    lying in the military hospital—it’s the only one left—and I don’t know if they
    will live. . . . I’m sleeping there too, as my own house has gone.’


    And there were others like him who had suffered greatly . . . Mumtaj brought home
    an eight-year-old girl, a distant cousin of his, who’d lost both her parents when
    the roofs of their houses fell in.


    ‘How will she manage alone?’ asked Grandmother. ‘I’ll look after her,’ said Mumtaj.
    ‘I wanted another daughter.’


    ‘It won’t be easy for you,’ said Grandmother.

    ‘You must let us help.’

    ‘It is god’s will,’ said Mumtaz. ‘He has spared us—we must care for those who
    were not so fortunate.’


    While most of the survivors of the earthquake began leaving the town, Grandfather
    and his family began the task of putting their property together again. They would
    clear the rubble, salvage what could still be used, and then start from scratch;
    but Grandfather had decided to use only the smaller bricks together with light
    wooden frames. ‘So that if there’s another earthquake,’ he said, ‘we can sway
    and rock like Mumtaz’s hut, instead of crashing to the ground.’


    ‘I suppose there is something to be learnt from a disaster,’ said Grandmother.


    A neighbour looked over the broken wall and asked, ‘Aren’t you people leaving?’


    ‘No,’ said Grandfather. ‘We’re staying.’


    ‘The experts say there’s sure to be another earthquake.’


    ‘Who knows?’ said Grandfather.


    ‘Did they predict *this* earthquake?’


    ‘No, they didn’t,’ admitted neighbour.

    So why run away? Where are you off to?

    ‘Cuttack.’


    The expert’s predict there’ll be a cyclone in Cuttack.

    The neighbour threw up his arms in horror and walked away, looking thoughtful;
    perhaps Cuttack wasn’t such a good idea after all. Where *did* one go, in order
    to escape disaster?


    Grandfather and the family had decided to stay where they had always lived and
    face it out. Maybe there *would* be another earthquake. But they’d be prepared
    this time. And meanwhile, there were a few compensations. Mukesh and Dolly had
    recovered some of their toys and dolls, battered but still recognizable; Grandmother’s
    oven had turned up almost intact from the bottom of the rubble, and biscuits were
    about to be made; and Grandfather had recovered his twisted bathtub and hammered
    it back into shape.


    He’d placed it under the mango tree, filled it with hot water, and taken his bath
    in the afternoon sunshine. There hadn’t been any soap, but there was plenty of
    mint in the garden. He started singing at the top of his voice, and the birds,
    who had just begun to return to the grove, took off in alarm and flew away again.


    ## Riding through the Flames


    ## 1


    As Romi was about to mount his bicycle, he saw smoke rising from behind the distant
    line of trees.


    ‘It looks like a forest fire,’ said Prem, his friend and classmate.


    ‘It’s well to the east,’ said Romi. ‘Nowhere near the road.’


    ‘There’s a strong wind,’ said Prem, looking at the dry leaves swirling across
    the road.


    It was the middle of May, and it hadn’t rained for several weeks. The grass was
    brown, the leaves of the trees covered with dust. Even though it was getting to
    six o’clock in the evening, the boys’ shirts were damp with sweat.


    ‘It will be getting dark soon,’ said Prem. ‘You’d better spend the night at my
    house.’


    ‘No, I said I’d be home tonight. My father isn’t keeping well. The doctor has
    given me some pills for him.


    Escape from Java and Other Tales of Danger


    ‘You’d better hurry, then. That fire seems to be spreading,’


    ‘Oh, it’s far off. It will take me only forty minutes to ride through the forest.
    Bye, Prem—see you tomorrow!’


    Romi mounted his bicycle and pedalled off down the main road of the village, scattering
    stray hens, stray dogs and stray villagers.


    ‘Hey, look where you’re going!’ shouted an angry villager, leaping out of the
    way of the oncoming bicycle. Do you think you own the road?”


    ‘Of course I own it,’ called Romi cheerfully, and cycled on.


    His own village lay seven miles distant, on the other side of the forest; but
    there was only a primary school in his village, and Romi was now at high school.
    His father, who was a fairly wealthy sugar cane farmer, had only recently bought
    him the bicycle. Romi didn’t care too much for school and felt there weren’t enough
    holidays but he enjoyed the long rides, and he got on well with his classmates.


    He might have stayed the night with Prem had it not been for the pills which the
    vaid—the village doctor—had given him for his father. Romi’s father was having
    back trouble, and the pills had been specially prepared from local herbs. Having
    been given such a fine bicycle, Romi felt that the least he could do in return
    was to get those pills to his father as early as possible. He put his head down
    and rode swiftly out of the village. Ahead of him, the smoke rose from the burning
    forest and the sky glowed red.


    ## 11


    He had soon left the village far behind. There was a slight climb, and Romi had
    to push harder on the pedals to get over the rise. Once over the top, the road
    went winding down to the edge of the forest.


    This was the part Romi enjoyed the most. He relaxed, stopped pedalling and allowed
    the bicycle to glide gently down the slope. Soon the wind was rushing past him,
    blowing his hair about his face and making his shirt billow out behind him. He
    burst into a song.


    A dog from the village ran beside him, barking furiously. Romi shouted to the
    dog, encouraging him in the race.

