    void, and we found it difficult to talk. A hot wind blew through the cracks in
    the door, and our throats were parched. Late in the afternoon, a chatty of cold
    water was let down to us from a tree outside a window at the rear of the hut.
    This was an act of compassion on the part of a man called Chinta, who had worked
    for us as a labourer when our bungalow was being built.


    At about ten o’clock, Lala returned, accompanied by Dhani, our older bearer. He
    proposed to take us to his own house. Mother hesitated to come out into the open,
    Lala assured her that the roads were quite clear now, and there was little fear
    of our being molested. At last, she agreed to go.


    We formed two batches. Lala led the way with a drawn sword in one hand, her umbrella,
    holding each other’s hands. Mother and Anet and I followed, holding each other’s
    hands. Mother had thrown over us a counterpane which she had been carrying with
    her when she left the house. We avoided the main road, making our way around the
    sweeper settlement, and reached Lala’s house after a fifteen-minute walk. On our
    arrival there, Lala offered us a bed to sit upon, while he squatted down on the
    ground with his legs crossed.


    Mother had thrown away her big bunch of keys as we left Tirloki’s house. When
    I asked her why she'
  - '[PAGE 76]


    had done so, she pointed to the smouldering ruins of our bungalow and said: ''Of
    what possible use could they be to us now?''


    The bearer, Dhani, arrived with the second batch, consisting of dear Granny, Pilloo
    and his mother, and Champa and Lado and the dogs. There were eight of us in Lala’s
    small house; and, as far as I could tell, his own family was as large as ours.


    We were offered food, but we could not eat. We lay down for the night—Mother,
    Granny and I on the bed, the rest on the ground. And in the darkness, with my
    face against my mother’s bosom, I gave vent to grief and wept bitterly. My mother
    wept too, but silently, and I think she was still weeping when at last I fell
    asleep.


    # Lala’s House


    Lala Ramjimal’s family consisted of himself, his wife, mother, aunt and sister.
    It was a house of women, and our unexpected arrival hadn’t changed that. It must
    indeed have been a test of the Lala’s strength and patience, with twelve near-hysterical
    females on his hands!


    His family, of course, knew who we were, because'
  - '[PAGE 77]


    # Escape from Java and Other Tales of Danger


    Lala’s mother and aunt used to come and draw water from our well, and offer bel
    leaves at the little shrine near our house. They were at first shy of us; and
    we, so immersed in our own predicament, herded together in a corner of the house,
    looked at each other’s faces and wept. Lala’s wife would come and serve us food
    in platters made of stitched leaves. We ate once in twenty-four hours, a little
    after noon, but we were satisfied with this one big meal.


    The house was an ordinary mud building, consisting of four flat-roofed rooms,
    with a low veranda in the front, and a courtyard at the back. It was small and
    pretentious, occupied by a family of small means.


    Lala’s wife was a young woman, short in stature, with a fair complexion. We didn’t
    know her name, because it is not customary for a husband or wife to call the other
    by name; but her mother-in-law would address her as *dulhan*, or bride.


    Ramjimal himself was a tall, lean man, with a long moustache. His speech was always
    very polite, like that of most Kayasthas but he had an air of determination about
    him that was rare in others.


    On the second day of our arrival, I overheard his mother speaking to him: ‘Lalaji,
    you have made a great mistake in bringing these *Angrezans* into our'
  - '[PAGE 78]


    # A Flight of Pigeons


    house. What will people say? As soon as the rebels hear of it, they will come
    and kill us.’


    ‘I have done what is right,’ replied Lala very quietly. ‘I have not given shelter
    to Angrezans. I have given shelter to friends. Let people say or think as they
    please.’


    He seldom went out of the house, and was usually to be seated before the front
    door, either smoking his small hookah, or playing chess with some friend, who
    happened to drop by. After a few days, people began to suspect there was somebody
    in the house about whom Lala was being very discreet, but they had no idea who
    these guests be. He kept a close watch on his family, to prevent them from talking
    too much; and he saw that no one entered the house, keeping the front door chained
    at all times.


    It is a wonder that we were able to live undiscovered for as long as we did, for
