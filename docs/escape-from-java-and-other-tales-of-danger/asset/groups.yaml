    ## 逃离 Java 与其他危险故事


    他在河里捕了十十年鱼，是个出色的渔夫。他知道哪里能找到纤细的银色鲺鱼、大而美丽的马鱼以及长着长胡须的鳀；他知道哪里水深哪里水浅；他知道该用什么诱饵——什么时候用虫子，什么时候用鹰豆。他教过儿子钓鱼，但他的儿子去了一个近百英里外的城市工厂工作了。他没有孙子，但他有一个女儿，叫西塔（Sita），她能做男孩能做的一切事情，有时甚至做得更好。她在两三岁时就失去了母亲。祖母教了她女孩应该学会的一切——厨、缝纫、磨香料、打扫房屋、喂鸟——而爷爷教了她其他事情，比如划小船过河、清理鱼、修理鱼网，或者抓着尾巴捉蛇！还有些事情是她自学的——比如爬菩提树，或者在浅水区的岩石间跳跃，或在水流平静的海湾游泳。


    祖父母双方都不识字，因此西塔也不识字。


    河对岸的一个村子里有一所学校，但西塔从未见过。她去的最远的地方就是河边附近的小集镇沙阿甘吉（Shahganj）。她从未见过城市。她从未坐过火车。河流隔绝了她与许多事物，但她并不会缺少从未见过的东西，而且，她忙极了。


    当爷爷在补网时，西塔在屋里为祖母揉着发烫的额头。祖母已经病了三天，吃不下东西。她以前也生过病，但从未像这样严重。爷爷给她带了一些甜橙子，但她什么也吃不下。


    她比爷爷年轻，但因为生了病，看起来要老得多。她的身体一直不太强壮。她经常咳嗽，有时会呼吸困难。


    当西塔注意到祖母睡着时，她离开床边，光脚踮着出了房间。


    外面，天空被季风云染得发暗。雨下了一整夜，再几个小时后还会下雨。季风雨在六月底就早到了。现在已经是七月底了，河流已经泛滥了。那湍急的水声听起来比平时更近、更具威胁性。


    西塔来到爷爷身边，坐在他旁边。


    “你饿了就告诉我，”她说，“我给你做饼。”


    “你祖母睡了吗？”


    “睡了。但她很快就会醒的。疼得很厉害。”


    老人盯着河对岸那片深绿色的森林和铅色的天空，说：“如果到明天早上她还没好，我就带她去沙阿甘吉的医院。他们知道怎么治好她。你可能需要自己过两天。但你以前也独立过。”


    西塔严肃地点了点头——她以前确实独立过；但不是在雨季中间、水位这么高的时候。她知道必须留一个人。她希望祖母康复，她知道只有爷爷能在水流如此湍急的情况下划着小船过河。


    西塔并不害怕独自一人，但她不喜欢河流的样子。今天早上，她在去取水时，注意到水位突然升高了。


    “爷爷，如果水位涨得更高，我怎么办？”


    “你必须待在高处。”


    “如果水漫到了高处呢？”


    “那就进屋子，把鸡也带上。”


    “如果水进了屋子呢？”


    “那就爬上菩提树。那是一棵很壮的树，不会倒。水也涨不上树那么。”


    “那羊呢，爷爷？”


    “我会带它们一起走的。我可能得卖了它们，给你祖母买好食物和药。至于鸡，你可以把它们放在屋顶上。但不要太担心水进屋子的事，”他拍了拍西塔的头，“水不会涨得那么高。以前有过这种情况吗？我会很快回来的，记住这一点。”


    “祖母会回来吗？”


    “会。——但他们可能会让她在医院留一段时间。”


    ## 河声


    那天晚上，雨又下起来了。大大的雨滴打在河面上，泛起层层。但那是暖雨，西塔可以在里面走动。她不怕淋湿。她习惯了。上个月，她发现过一只蝎子，她很喜欢。


    ## 西塔与河流


    她想奇青蛙是怎么来到岛屿的。她讨厌那些涌入居所并试图躲在屋里避雨的黑蝎子。踩到它们很容易了，而且蛰得非常疼。上个季风她被蝎子咬过，整整一天一夜都在发烧、剧痛。西塔从未杀过生物，但现在，每当她发现蝎子，她就用石头把它压碎！当她终于回到屋室内时，她饿了。她吃了一些炒鹰豆，又热了些羊奶。祖母醒了一次要水，西塔把黄铜杯举到嘴边。雨下了一整夜。屋顶漏水了，地板上积了一个小水洼。爷爷一直着煤油灯。他们并不需要光，但不知为何这让他们觉得更安全。河流的声音一直伴随着他们，尽管他们很少注意到。但那天晚上，他们注意到了水声的变化。有一种类似呻吟的声音，像风吹过高树树梢，还有水流掠过岩石并冲走卵石时发出的急促嘶声。有时还会听到泥土落入水中的隆隆声。


