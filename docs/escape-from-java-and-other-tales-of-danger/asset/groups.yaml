    ## Escape from Java and Other Tales of Danger


    Then the road straightened out, and Romi began pedalling again.


    The dog, seeing the forest ahead, turned back to the village. It was afraid of
    the forest.


    The smoke was thicker now, and Romi caught the smell of burning timber. But ahead
    of him the road was clear. He rode on.


    It was a rough, dusty road, cut straight through the forest. Tall trees grew on
    either side, cutting off the last of the daylight. But the spreading glow of the
    fire on the right lit up the road, and giant tree-shadows danced before the boy
    on the bicycle.


    Usually the road was deserted. This evening it was alive with wild creatures fleeing
    from the forest fire. The first animal Romi saw was a hare, leaping across the
    road in front of him. It was followed by several more hares. Then a band of monkeys
    streamed across, chattering excitedly.


    "They''ll be safe on the other side," thought Romi. The fire won''t cross the
    road.


    But it was coming closer. And realizing this, Romi pedalled harder. In half an
    hour he should be out of the forest.


    Suddenly, from the side of the road, several pheasants rose in the air, and with
    a *whoosh*, flew low across the path, just in front of the oncoming bicycle. Taken
    by surprise, Romi fell off. When he picked himself up and began brushing his clothes,
    he saw that his knee was bleeding. It wasn’t a deep cut, but he allowed it to
    bleed a little, took out his handkerchief and bandaged his knee. Then he mounted
    the bicycle again.


    He rode a bit slower now, because birds and animals kept coming out of the bushes.


    Not only pheasants but smaller birds too were streaming across the road—parrots,
    jungle crows, owls, magpies—and the air was filled with their cries.


    "Everyone’s on the move," thought Romi. It must be a really big fire.


    He could see the flames now, reaching out from behind the trees on his right,
    and he could hear the crackling as the dry leaves caught fire. The air was hot
    on his face. Leaves, still alight or turning to cinders, floated past.


    A herd of deer crossed the road and Romi had to stop until they had passed. Then
    he mounted again and rode on; but now, for the first time, he was feeling afraid.


    ## Escape from Java and Other Tales of Danger


    ### III


    From ahead came a faint clanging sound. It wasn''t an animal sound, Romi was sure
    of that. A fire engine? There were no fire engines within fifty miles.


    The clanging came nearer and Romi discovered that the noise came from a small
    boy who was running along the forest path, two milk cans clattering at his side.


    "Teju!" called Romi, recognizing a boy from a neighboring village. "What are you
    doing out here?"


    "Trying to get home, of course," said Teju, panting along beside the bicycle.


    "Jump on," said Romi, stopping for him.


    Teju was only eight or nine—a couple of years younger than Romi. He had come to
    deliver milk to some road-workers, but the workers had left at the first signs
    of the fire, and Teju was hurrying home with his cans still full of milk.


    He got up on the crossbar of the bicycle, and Romi moved on again. He was quite
    used to carrying friends on the crossbar.


    "Keep beating your milk cans," said Romi. "Like that, the animals will know we
    are coming. My bell doesn’t make enough noise. I’m going to get a horn for my
    cycle!"


    "I never knew there were so many animals in the jungle," said Teju. "I saw a python
    in the middle of the road. It stretched right across!"


    "What did you do?"


    "Just kept running and jumped right over it!"


    Teju continued to chatter but Romi’s thoughts were on the fire, which was much
    closer now. Flames shot up from the dry grass and ran up the trunks of trees and
    along the branches. Smoke billowed out above the forest.


    Romi’s eyes were smarting and his hair and eyebrows felt scorched. He was feeling
    tired but he couldn’t stop now; he had to get beyond the range of the fire. Another
    ten or fifteen minutes of steady riding would get them to the small wooden bridge
    that spanned the little river separating the forest from the sugar cane fields.


    Once across the river, they would be safe. The fire could not touch them on the
    other side because the forest ended at the river’s edge. But could they get to
    the river in time?


    ## IV


    Clang, clang, clang went Teju’s milk cans. But the sounds of the fire grew louder
    too.


    ## Escape from Java and Other Tales of Danger


    A tall silk-cotton tree, its branches leaning across the road, had caught fire.
    They were almost beneath it when there was a crash and a burning branch fell to
    the ground a few yards in front of them.


    The boys had to get off the bicycle and leave the road, forcing their way through
    a tangle of thorny bushes on the left, dragging and pushing at the bicycle and
    only returning to the road some distance ahead of the burning tree.


    "We won’t get out in time," said Teju, back on the crossbar but feeling disheartened.


    "Yes, we will," said Romi, pedalling with all his might.


    "The fire hasn’t crossed the road as yet."


    Even as he spoke, he saw a small flame leap up from the grass on the left. It
    wouldn’t be long before more sparks and burning leaves were blown across the road
    to the grass on the other side.


    "Oh, look!" exclaimed Romi, bringing the bicycle to a sudden stop.


    "What’s wrong now?" asked Teju, rubbing his sore eyes. And then, through the smoke,
    he saw what was stopping them.


    An elephant was standing in the middle of the road.


    ## Riding through the Flames


    Teju slipped off the crossbar, his cans rolling on the ground, bursting open and
    spilling their contents.


    The elephant was about forty feet away. It moved about restlessly, its big ears
    flapping as it turned its head from side to side, wondering which way to go.


    From far to the left, where the forest was still untouched, a herd of elephants
    moved towards the river. The leader of the herd raised his trunk and trumpeted
    a call. Hearing it, the elephant on the road raised its own trunk and trumpeted
    a reply. Then it shambled off into the forest, in the direction of the herd, leaving
    the way clear.


    "Come, Teju, jump on!" urged Romi. "We can’t stay here much longer!"


