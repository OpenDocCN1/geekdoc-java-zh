    side of the river looked as though they had grown out of the water, like mangroves.
    The sky was banked with massive, moisture-laden clouds. Thunder rolled down from
    the hills, and the river seemed to take it up with a hollow booming sound.


    Something was floating down the river, something big and bloated. It was closer
    now and Sita could make out its bulk—a drowned bullock being carried downstream.


    So the water had already flooded the villages further upstream. Or perhaps, the
    bullock had strayed too close to the rising river.


    Sita’s worst fears were confirmed when, a little later, she saw planks of wood,
    small trees and bushes, and then a wooden bedstead, floating past the island.


    As she climbed down from the tree, it began to rain more heavily. She ran indoors,
    shooing the hens before her. They flew into the hut and huddled under Grandmother’s
    cot. Sita thought it would be best to keep them together now.


    There were three hens and a cockbird. The river did not bother them. They were
