    ## Earthquake


    There was a great crash, followed by clouds of dust and plaster.


    Grandmother looked across the road and saw other houses collapsing, almost as
    though some unseen giant was blowing them down. The lines from an English fairy
    tale ran through her head: ‘I’ll huff and puff and I’ll blow your house down!’


    There was a peculiar whistling wind, but it wasn’t the wind that had done the
    damage; it was the shivering of the earth that had loosened bricks and plaster,
    beams and rafters. The air was filled with choking dust. They couldn’t speak.


    How flimsy all the houses seem, thought Grandmother. Just dolls’ houses. And yet,
    many of them had stood for over a hundred years. A hundred years—and in a moment,
    gone!


    The shaking had stopped, but already their home was a mound of rubble. A bedstead
    poked out of a broken window. A bathroom tap gushed water over a squashed sofa
    set. Here a bit of broken desk or chair, there a bit of torn carpet, a familiar
    hat, battered books, a twisted umbrella; these were the only reminders that this
    had once been a home.


    The goat was missing, the hens had vanished. The only things that hadn’t been
    touched were the clothes that Dolly and Grandmother had been hanging up. They
    remained firmly on the washing line, flapping about in the wind.


    Cries from afar came to them on the wind—cries for help, people calling out for
    each other, some just shouting because there was nothing else to do.


    Dolly and Grandmother stood like statues in the middle of the garden. They were
    too shocked to move—until they saw Grandfather and Mukesh running down the road
    towards them. Then they too began to run.


    Pickle found himself trapped in the storeroom. He had been ferreting between two
    large boxes, trying to get at a terrified rat, when the ceiling came down on top
    of the boxes. There was dust and darkness everywhere. Pickle didn’t like it one
    bit. He wanted to be out of that suffocating hole, and he wasn’t going to sit
    there waiting to be rescued. The instincts of the dachshund, and his own experience
    in digging for rats, now came to his aid. He began burrowing in the rubble, trying
    to tunnel a way out.


    ## The Lucky Ones


    Mumtaz’s hut was one of the few homes left standing. Light and flimsy and made
    of wooden planks and a thatched roof, it could have been blown away by a strong
    wind. But it withstood the earthquake. Whereas bricks and plaster had come crashing
    down, the light wooden structure had shaken and shivered and swayed with the movements
    of the earth, but it had remained upright.


    Dolly was soon at home in the hut, playing on the smooth earthen floor with the
    cook’s children. Mukesh still hung on to Grandfather, while Grandmother, hands
    on hips, surveyed the wreckage of the house.


    ‘I hope Rakesh is all right,’ said Grandfather. ‘If you can keep an eye on Mukesh,
    I’ll go and look for him.’


    ‘Yes, do. I’m worried about him,’ said Grandmother. ‘And we may get another earthquake.’


    ‘Will you be all right here?’


    ‘Well, there’s nothing left to fall down. Mumtaz says we must sleep in his house
    tonight. It seems to be the safest place.’


    ‘You and the children can sleep there. I’ll sleep out in the open. It’s warm enough—and
    I don’t think it will rain.’


    While Grandfather was gone looking for Rakesh, Grandmother and Mumtaz searched
    the ruins of the house, looking for things that could still be used. Unfortunately
    most of their belongings were buried deep beneath the rubble, and there was hardly
    anything worth retrieving—just a battered pram, a boxful of clothes, several tins
    of sardines, some cans of fruit juice that had rolled across the grass, and Grandfather’s
    typewriter, which hadn’t been working anyway. They had no idea that Pickle was
    in the ruined building, buried at the bottom of everything; they thought he was
    somewhere in the neighbourhood, dashing about as usual, looking for the cause
    of all the trouble.


    ‘Find my dolls!’ demanded Dolly. ‘And the doll’s house.’


    But the doll’s house no longer existed.


    ‘No more toys,’ said Mukesh with satisfaction, feeling very grown-up about everything.
    ‘We’re poor now.’


    ‘Has the bank fallen down too?’ asked Dolly. ‘Must have,’ said Mukesh sagely.


    In spite of Grandfather’s prediction of clear weather, it began to rain and they
    had to take shelter in Mumtaz’s little hut. It was very crowded in the small room,
    but Mumtaz, for one, did not notice—he had a big heart.


    ## Earthquake


    The waters of the upturned lake drained away almost as rapidly as they had flooded
    the surrounding area. Rakesh peered through the branches of the tree in the general
    direction of his school. He wanted to know the time. Usually the clock tower above
    the school building was visible for miles around, but now there was no sign of
    it. It had, in fact, disappeared when the rest of the building collapsed. Even
    now, frantic efforts were being made to extricate the headmaster from the rubble
    around his desk, where he had been trapped by a falling beam. The classrooms were
    a shambles and a fire had broken out in the kitchen and was spreading to other
    parts of the building. It would be many months before the school would start functioning
    again. Many would never return to it.


    After some time Rakesh climbed down from the tree. He looked around for his bicycle,
    but couldn''t see it anywhere. A lot of other things had been washed up at the
    base of the tree, including a dead cat, several drowned chickens, fish that had
    been left flopping around when the water receded, and a cinema star hoarding.
    The face of a famous Bombay film star stared up from the mud.


    In the distance he saw a great cloud of dust. He did not know it then, but the
    dust came from hundreds of fallen or damaged buildings. Rakesh knew, of course,
    that there had been an earthquake, and a tremendous one, and that it must have
    been felt over a large area. What could have happened to his grandparents and
    his brother and sister? He began running for home, taking the road through the
    town.


    He wasn’t sure it was the same town he was running through, because many of the
    familiar landmarks had gone. The town’s biggest and most expensive hotel, the
    Grand Eastern, had tumbled down. Many of its guests had been killed. An ambulance
    stood in the grounds, and across the road a fire engine was trying to put out
    several fires which had broken out. Almost automatically Rakesh began to help
    the rescue workers who were clearing the rubble. There wasn’t much he could do
    apart from shifting bricks and broken furniture. Then he realized that his own
    home might be in a similar condition, and he paused, staring horrified at the
    wreckage of the once posh hotel. He felt a touch on his shoulder. Grandfather
    was standing beside him.


    ‘Are you all right, my boy?’


    Rakesh nodded, although he looked rather bewildered.


    ‘And everyone at home?’ he asked.


    ## Earthquake


    ‘They’re all right.’ Grandfather did not mention the house. ‘Come along, there’s
    nothing you can do here. What happened to the bicycle?’


    ‘It was swept away. All the water came out of the lake. I had to climb a tree!’


    They walked home in silence. But all around them there was noise and confusion.


    Rakesh hadn’t expected to find their house in total ruin. He looked around in
    shock and dismay.


    ‘Everything’s gone,’ he said at last. ‘What luck—what terrible luck . . .’


    ‘No,’ said Grandfather. ‘We’re the lucky ones! We’re alive, aren’t we?’


    ## Beginning Again


    Late that night, Grandfather wondered if he had spoken too soon. There was another
    strong tremor, and Mumtaz’s frail hut swayed and swung as though it was a hot-air
    balloon. In the town, more buildings came down. Grandfather had been wrong about
    the weather too, because it did not stop raining and he had to give up his plan
    to sleep outside. Everyone else had bedded down on the floor of the hut, using
    bits of torn carpet and bedding rescued from the house. Nobody slept much, except
    for Mukesh and the smaller children.


    In the middle of the night, Pickle finally succeeded in digging his way out of
    the ruins. He was white with plaster, and one of his long ears had almost come
    off. He sat down outside the hut and begged for most of the night. Other dogs
    in other parts of the town took up the howling, so it was a weird, frightening
    sort of night, with what with the wind, the rain, the howling—and always the fear
    of another earth tremor.

