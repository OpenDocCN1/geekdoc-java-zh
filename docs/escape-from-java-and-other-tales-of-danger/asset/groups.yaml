    ## Sita and the River


    Phambiri simply grunted, which could have meant anything. He hadn’t studied further
    than class 6, which was just as well, as he was a man of muscle, not brain.


    Phambiri loved putting his strength to some practical and useful purpose. Whenever
    the cart wheels got stuck in the mud, he would get off, remove his shirt and put
    his shoulder to the side of the cart, while his muscles bulged and the sweat glistened
    on his broad back.


    ‘Phambiri is the strongest man in our district,’ said Hukam Singh proudly. ‘And
    clever, too! It takes quick thinking to win a wrestling match.’


    ‘I have never seen one,’ said Sita.


    ‘Then stay with us tomorrow morning, and you will see Phambiri wrestle. He has
    been challenged by the Karauli champion. It will be a great fight!’


    ‘We must see Phambiri win,’ said Vijay.


    ‘Will there be time?’ asked Sita.


    ‘Why not? The train for Shahganj won’t come in evening. The fair goes on all day
    and the wrestling bouts will take place in the morning.’


    ‘Yes, you must see me win!’ exclaimed Phambiri, thumping himself on the chest
    as he climbed back on to the cart after freeing the wheels. ‘No one can defeat
    me!’


    ## Escape from Java and Other Tales of Danger


    ‘How can you be so certain?’ asked Vijay.

    ‘He has to be certain,’ said Hukam Singh. ‘I have taught him to be certain! You
    can’t win anything if you are uncertain . . . Isn’t that right, Phambiri? You
    know you are going to win!’


    ‘I know,’ said Phambiri with a grunt of confidence.

    ‘Well, someone has to lose,’ said Vijay.

    ‘Very true,’ said Hukam Singh smugly. ‘After all, what would we do without losers?
    But for Phambiri, it is win, all the time!’


    ‘And if he loses?’ persisted Vijay.

    ‘Then he will just forget that it happened and will go on to win his next fight!’


    Vijay found Hukam Singh’s logic almost unanswerable, but Sita, who had been very
    puzzled by the argument, now saw everything very clearly and said, ‘Perhaps he
    hasn’t won any fights as yet. Did he lose the last one?’


    ‘Hush!’ said Hukam Singh looking alarmed. ‘You must not let him remember. You
    do not remember losing a fight, do you, my son?’


    ‘I have never lost a fight,’ said Phambiri with great simplicity and confidence.


    ‘How strange,’ said Sita. ‘If you lose, how can you win?’


    ‘Only a soldier can explain that,’ said Hukam Singh. ‘For a man who fights, there
    is no such thing as defeat. You fought against the river, did you not?’


    ‘I went with the river,’ said Sita. ‘I went where it took me.’


    ‘Yes, and you would have gone to the bottom if the boy had not come along to help
    you. He fought the river, didn’t he?’


    ‘Yes, he fought the river,’ said Sita.


    ‘You helped me to fight it,’ said Vijay.


    ‘So you both fought,’ said the old man with a nod of satisfaction. ‘You did not
    go with the river. You did not leave everything to the gods.’


    ‘The gods were with us,’ said Sita.


    And so they talked, while the bullock cart tumbled along the muddy village roads.
    Both bullocks were white, and were decked out for the fair with coloured bead
    necklaces and bells hanging from their necks. They were patient, docile beasts.
    The cartwheels which were badly in need of oiling, protested loudly, creaking
    and groaning as though all the demons in the world had trapped within them.


    Sita noticed a number of birds in the paddy fields. There were black-and-white
    curlews and cranes with pink coat-tails. A good monsoon means plenty of birds.


    ## Escape from Java and Other Tales of Danger


    But Hukam Singh was not happy about the cranes.


    ‘They do great damage in the wheat fields,’ he said. Lighting up a small, hand-held
    hookah pipe, he puffed at it and became philosophical again: ‘Life is one long
    struggle for the farmer. When he had overcome the drought, survived the flood,
    hunted off the pig, killed the crane and reaped the crop, then comes that blood-sucking
    ghoul, the moneylender. There is no escaping him! Is your father in debt to a
    moneylender, boy?’


    ‘No,’ said Vijay.


    ‘That is because he doesn’t have daughters who must be married! I have two. As
    they resemble Phambiri, they will need generous dowries.’


    In spite of his grumbling, Hukam Singh seemed fairly content with his lot. He’d
    had a good maize crop, and the front of his cart was piled high with corn. He
    would sell the crop at the fair, along with some cucumbers, eggplants and melons.


    The bad road had slowed them down to so much that when darkness came, they were
    still far from Karauli. In India there is hardly any twilight. Within a short
    time of the sun’s going down, the stars come out.


    ‘Six miles to go,’ said Hukam Singh. In the dark our wheels may get stuck again.
    Let us spend the night here. If it rains, we can pull an old tarpaulin over the
    cart.’


    Vijay made a fire in the charcoal burner which Hukam Singh had brought along,
    and they had a simple meal, roasting the corn over the fire and flavouring it
    with salt and spices and a squeeze of lemon. There was some milk, but not enough
    for everyone. They settled down to sleep in the bullock cart, and Phambiri and
    his father were soon asleep. ‘If I win tomorrow, I will give all of you a feast!’


    Sita was very tired but couldn’t sleep. The night was full of sounds. Vijay slept,
    a half-smile on his face. Only Sita lay awake, worried and waiting for the dawn.


    ## At the Fair


    Already, at nine o’clock, the fairground was crowded. Cattle were being sold or
    auctioned. Stalls had opened, selling everything from pins to ploughs. Foodstuffs
    were on sale—hot food, spicy food, sweets and . A merry-go-round, badly oiled,
    was squeaking and groaning, while a loudspeaker blared popular film music across
    the grounds. While Phambiri was preparing for his wrestling match, Hukam Singh
    was busy haggling over the price of pumpkins. Sita and Vijay wandered on their
    own among the stalls, gazing at toys and kites and bangles and clothing, at brightly
    coloured syrupy sweets. Some of the rural people had transistor radios dangling
    by straps from their shoulders, the radio music competing with the loudspeaker.
    Occasionally a buffalo bellowed, drowning all sounds.


    Various people were engaged in roadside professions. There was the fortune teller.
    He had slips of paper, each of them covered with writing, which he kept in little
    trays along with some grain. He had a tame sparrow. When you gave the fortune
    teller your money, allowed the little bird to hop in and out among the trays until
    it stopped at one and started pecking at the grain. From this tray the fortune
    teller took the slip of paper and presented it to his client. The writing told
    you what to expect over the next few months or years.


    And that was what they heard—a sound more hideous than the wail of demons, a rising
    crescendo of noise—wurrk, wurrk, wurrk—coming from the ditches on either side
    of the road. All the frogs in the jungle seemed to have gathered at that spot,
    and each one appeared to have something to say for himself. The speeches continued
    for an hour. Then the meeting broke up and silence returned to the forest.


    A jackal slunk across the road. A puff of wind brushed through the trees. The
    bullocks, freed from the cart, were asleep beside it. The men’s snores were softer
    now.


