    Escape from Java


    ‘No,’ said my father with a straight face. ‘Snakes’ eggs.’


    Mr Muggeridge turned a delicate shade of green; but he soon recovered his poise,
    and for about an hour kept talking about almost everything under the sun, including
    Churchill, Hitler, Roosevelt, Mahatma Gandhi, and Betty Grable. (The last-named
    was famous for her beautiful legs.) He would have gone talking all the way to
    Bombay had he been given a chance, but suddenly a shudder passed through the old
    plane, and it began lurching again.


    ‘I think an engine is giving trouble,’ said my father. When I looked through the
    small glassed-in window, it seemed as though the sea was rushing up to meet us.


    The co-pilot entered the passenger cabin and said something in Dutch. The passengers
    looked dismayed, and immediately began fastening their seat belts.


    ‘Well, what did the blighter say?’ asked Mr Muggeridge.


    ‘I think he’s going to have to ditch the plane,’ said my father, who knew enough
    Dutch to get the gist of anything that was said.


    ‘Down in the drink!’ exclaimed Mr Muggeridge.'
  - '[PAGE 99]


    ''Gawd ''elp us! And how far are we from Bombay, guv?


    ‘A few hundred miles,’ said my father.


    ‘Can you swim, mate?'' asked Mr Muggeridge looking at me.


    ‘Yes,’ I said. But not all the way to Bombay. How far can you swim?''


    ‘The length of a bathtub,’ he said


    ‘Don’t worry,’ said my father. ‘Just make sure your life jacket’s properly tied.’


    We looked to our life jackets; my father checked mine twice, making sure that
    it was properly fastened.


    The pilot had now cut both engines, and it was bringing the plane down in a circling
    movement. But he couldn’t control the speed, and it was tilting heavily to one
    side. Instead of landing smoothly on its belly, it came down on a wing tip, and
    this caused the plane to swivel violently around in the choppy sea. There was
    a terrific jolt when the plane hit the water, and if it hadn’t been for the seat
    belts we’d have been flung from our seats. Even so, Mr Muggeridge struck his head
    against the seat in front, and he was now holding a bleeding nose and using some
    shocking language.'
