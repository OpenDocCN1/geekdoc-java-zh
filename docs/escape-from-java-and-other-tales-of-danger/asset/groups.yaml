    ‘I’ll buy you a beer in Bombay,’ said my father.


    ‘Have an egg,’ I said, remembering we still had boiled eggs in one of the travelling
    bags.


    ‘Thanks, mate,’ said Mr Muggeridge, accepting an egg with alacrity. ‘A real egg,
    too! I’ve been on egg powder these last six months. That’s what they give you
    in the army. And it ain’t hens’ eggs they make it from, let me tell you. It’s
    either gulls’ or turtles’ eggs!’'
