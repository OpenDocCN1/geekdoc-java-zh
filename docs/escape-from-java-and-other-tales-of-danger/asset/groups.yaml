    # Earthquake


    ‘In other words,’ said a passing wit, ‘don’t cheat your customers.’


    ‘And when did you ever work for a living,’ shouted the shopkeeper. You still owe
    me twenty rupees!’


    Back at the Burman house, the family sat down to a quiet lunch. It wasn’t quiet
    for long, because Dolly wanted what was on Mukesh’s plate (even though it was
    no different from hers), and when she was told to eat her own food, she threw
    a tantrum.


    ‘These children,’ sighed Rakesh, bolting down his rice and bean curry. ‘It’s time
    they went to school.’


    ‘It’s time you got back to school,’ said Grandmother. It’s half past one.’


    ‘We’re not having school this afternoon. Although we couldn’t get an earthquake-holiday,
    we’re going to watch the cricket match. There’s a team from Calcutta playing against
    the Lake Club.’


    ‘Take me with you,’ said Mukesh.


    ‘No, you’re always falling off the back of the cycle.’


    ‘I’ll sit in front, then,’


    ‘You’ll stay at home,’ said Grandmother. The last time you went to a football
    match, you got lost.’


    ‘But this is a cricket match,’ argued Mukesh. No one gets lost at cricket matches.’


    ‘Would you like to come with me to the Bengali sweet shop?’ asked Grandfather.


    ‘Oh, please,’ said Mukesh. It’s better than cricket. Better than that rotten bicycle.’


    ‘Why do we have earthquakes?’ asked Rakesh.


    ‘Well,’ said Grandfather, the earth has been around a long time—millions of years—and
    sometimes it feels the stress and strain of being so old . ....''


    ‘Are you a million?’ interrupted Mukesh.


    ‘Not yet,’ said Grandfather, not yet. But, just like me, the earth wants to stretch
    a little and yawn, and when it does, the earth’s crust has these convulsions—we
    call them earthquakes’


    ‘But why does it have to stretch *here*?’ asked Rakesh.


    ‘It can stretch anywhere, and *does*. Tokyo, San Francisco, Iran, the South Pacific,
    Italy, Turkey—there’s hardly a corner of the earth that hasn’t felt an earthquake
    at some time or the other. In course in some places it’s worse . . . This is one
    of the places where the earth likes to do its stretching.’


    When lunch was over, Rakesh rode off to the cricket ground, Grandfather and Mukesh
    walked off in the direction of the bazaar, and Dolly followed Grandmother into
    the courtyard to help with the washing.


    It was about ten minutes later that the real earthquake was felt, and half the
    town came tumbling down.


    # Earthquake Chaos


    Rakesh had almost reached the cricket ground when, all of a sudden, the road tilted
    and rose up towards him. A second later he found himself sprawling on the ground.


    A deep rumbling sound seemed to come from the bowels of the earth, and the road
    kept having convulsions. It was like a huge snake thrashing around in its death
    throes. Rakesh found that lying on the ground was even more difficult than riding
    his bicycle.


    The cricket match, which had started a little while earlier, came to an abrupt
    end, as a huge rent appeared across the pitch. Into it fell a fast bowler, an
    umpire, and a fielder standing at silly mid-on. They were rescued later, but it
    was the first time ever anywhere that a match had to be abandoned due to an earthquake.


    # Escape from Java and Other Tales of Danger


    Those who were playing, or watching from the lakeside pavilion, heard a thunderous
    roar. It was due to half the hillside falling into the lake. The earth, along
    with trees, bushes and rocks, simply bulged out, and then came crashing down.
    Dust and water rose skywards, and at the same time the bed of the lake erupted,
    rose like a tidal wave, and spewed its contents over the surrounding plain. Fortunately
    for both cricketers and spectators, this massive surge of water was flowing in
    the opposite direction. But it swept away a number of parked cars, several grazing
    cattle and goats, telegraph poles, and the walls of the old jail.


    Here was a chance for hundreds of inmates of the jail to escape. But they were
    too shocked by the suddenness of the disaster to be able to do anything except
    make a dash for the high ground behind the jail. A few could not make it and were
    washed away by the rushing waters of the upturned lake. Those who reached safety
    huddled together in groups, waiting to be rescued.


    Rakesh saw the wave coming towards him as he lay on the ground. It was about fifty
    metres away when he scrambled to his feet and ran for the nearest tree. Fortunately
    it was a large banyan tree, well anchored with its many aerial roots—branches
    that had come down to the ground and taken root again. It was also an easy tree
    to climb. Rakesh climbed as high as he could go, glancing down as the advancing
    water swirled around beneath him. He watched as his bicycle swept past. And he
    was never to see it again.


    Grandfather and Mukesh were in the bazaar, eating sweets. They both shared a passion
    for gulab-jamuns—rose-scented milk and sugar dumplings fried a deep brown. The
    old man and the small boy stood outside the sweet shop popping syrupy gulab-jamuns
    down their throats.


    The bazaar itself was a hive of activity. It was the busiest hour of the day.
    The street was crowded with women shopping for vegetables, and pavement-vendors
    selling everything from shiny brassware to old clothes and second-hand comics,
    in competition with the bigger shops just off the road. Weaving in and out of
    the crowd were cyclists, scooters, pony carts, stray cows, stray dogs and stray
    policemen.


    Mukesh had eaten four gulab-jamuns and Grandfather six when the sweet shop began
    to wobble about in front of them. Then the cloth awning collapsed, burying the
    shopkeeper among his sweetmeats. His muffled shouts for help were lost in the
    noise from the street, where people were shouting and rushing about in panic.


    Grandfather and Mukesh found themselves on top of the struggling shopkeeper. As
    he freed himself, Mukesh got stuck in the awning and had to be helped out, and
    all the time the ground was heaving about and shops were tottering and collapsing
    like packs of cards.


    In the space of a few seconds, a straight bazaar had become a crooked bazaar.
    The road had been twisted out of shape to such an extent that some shops that
    had been on on the left now turned up on the right, and vice versa. A beggar in
    a cart who had never been known to walk now leapt to his feet and ran for his
    life. The cows had vanished and had so the policemen. A motorcycle had disappeared
    into a hole in the ground, while a car had mounted down the steps of the Town
    Hall. A tonga-pony galloped the middle of the road; of the tonga and its driver
    there was no sign.


    The Town Hall itself had collapsed, burying a number of clerks and officials.
    By the time the powerful tremor had passed, several other buildings had also come
    down.


    Grandfather did not panic. He picked Mukesh a of sweets and helped the dazed shopkeeper
    to his feet. Then he realized that the earthquake must have affected every part
    of the town.


    ‘Let’s get back to the house,’ he said. ‘Anything could have happened!’


    Grabbing Mukesh by the hand, he started running down the road. Mukesh had trouble
    keeping up with him. He’d never seen Grandfather running before.


    ***


    Dolly was helping Grandmother hang out the washing when the shock came. Had they
    been inside the house, they would not have come alive.


    As in the case of the first tremor, the dog began to howl and all the birds rose
    from the trees and began making a great noise. Then suddenly there was a wind
    rushing through the trees, and the ground began to heave and quake.


    Dolly looked up to see the tall chimney toppling off the roof of the house.


    ‘Look, Granny!’ she cried. ‘The house is falling down! What will happen to my
    doll’s house?’


    ‘Never mind the doll’s house,’ said Grandmother. ‘Let’s get clear of the building.’


    They ran into the garden just as the walls of the house bulged outwards and the
    roof fell inwards.

