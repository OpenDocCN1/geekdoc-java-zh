    # 地震


    # 爷爷的浴室


    每当发生紧急情况时，爷爷恰好在洗澡。


    当他在洗澡时，一头狂野的大象闯进了花园，踩踏了奶奶最引以为傲的玫瑰和豌豆，并撞倒了花园的墙。他在洗澡时，大象冲破了花园的墙。当他在洗澡时，台风吹走了了房子的屋顶。当他在洗澡时，一位女士惊慌失措，因为有一条蛇蜷缩在梳妆台上。事实上，爷爷的浴室是一个老式的金属浴缸，里面装满了水，水里加了几枝薄荷。薄荷浴！没有人听过这种事，但爷爷说很清爽。


    他在洗澡时，地震震动了城市，那场地震让大部分地方变成了废墟。


    # 地震


    鲁斯金·邦德于1934年出生于卡萨利（喜马尔普拉肖邦），在贾姆纳加尔（古吉拉特）、德拉敦、新德里和西姆拉长大。孩子的母亲在女儿出生时去世了，父亲邦德先生在几英外的茶园工作，那里没有学校。所以孩子们和祖父母住在一起，他们不愿离开孩子。


    印度这个地区每年都有地震，但已经三十年没有过真正的大地震了。


    “地震时你们怎么办？”鲁斯金问，他听过那次地震。


    “没时间做什么，”爷爷说，“大家只管往外跑。”


    “我会一直待在床上直到地震结束，”鲁斯金说。


    “我会躲在床底下，”穆克什说，“它找不到我！”


    “站在门框最好，”奶奶说。


    “如果你看地震图片，你会发现门框总是立着的！”


    尽管穆索里是一个偶尔发生地震的地区，但他们喜欢住在那里。


    # 逃离爪哇岛


    那里有一个湖泊和一个色彩斑纷的集市，奶奶的花园里满了蝴蝶、鸟和奇异兰花，还有果树和可以爬的树。鲁斯金喜欢骑自行车在城里逛。穆克什喜欢集市上的甜品店——只要他不是和姆塔兹的两个男孩扭架。。莉莉忙于在行李箱下搭建自己的娃娃房子。


    穆索里的生活节奏缓慢。除了花园那只大象，家里最近没有发生什么有趣的事情。就在一个早晨，当爷爷正在洗澡时，小镇突然变得非常安静、平静……


    # 第一次震动


    爷爷什么也没注意到，因为他正在浴缸里玩水唱歌；但正在花园里修剪玫瑰丛的奶奶奶奶停下了动作，抬头望去。为什么鸟儿沉默了？'
