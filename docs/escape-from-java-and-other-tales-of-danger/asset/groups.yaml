    ## 逃离爪哇


    飞机一停下来，我父亲就解开了我的安全带。时间不等人。水已经开始满了机舱，所有的乘客——除了一个死在座位上、颈骨折断的人以外——都在拼命向出口舱门爬。副驾驶拉下杠杆，舱门掉掉了，露出巨大的波浪正拍打着这架受难飞机的侧面。


    父亲牵着我的手，领着我走向出口。


    “快点，孩子，”他说，“我们浮不了多久了。”

    “帮个忙！”穆格里奇先生喊道，他还在和他的救生衣作斗争，“先是这该死的流出血，现在又有什么东西卡住了。”


    我父亲帮他固定好了救生衣，然后在我们面前把他推出了门。


    当我们远离那架水上飞机时（穆格里奇先生在我们旁边剧烈地拍打着水），我们注意到了水里的其他乘客。其中一人用荷兰语对我们喊道，让我们跟着他。


    我们跟着他向救生艇游去，救生艇在我们落水的一刻就释放了。那艘在波浪中起伏的黄色救生艇，就像陆地一样令人欢迎。


    ## 逃离爪哇及其他危险故事


    所有离开飞机的人都成功爬进了救生艇。我们总共七个人——挤得非常紧。我们才刚在救生艇的底部坐稳，穆格里奇先生依然捂着鼻子，惊呼道——“它沉了！”正当我们无助地看着时，那架水上飞机迅速而无声地没入了波涛之下。


    救生艇进了很多水，很快每个人都忙着用杯子（救生艇里有几个）、帽子和赤手来舀水。海面有轻微的涌浪，每隔一会儿水就会再次涌进来，填满一半救生艇。但在半小时内，我们排出了大部分水，然后就可以轮流工作，两个人舀水，其他人休息。没有人预料我会做这项工作，但我还是帮了忙，用了我父亲的草编顶帽（sola
    topi）。


    “我们在哪儿？”一名乘客问道。

    “离任何地方都很远，”另一人说。

    “印度洋上应该有一些岛屿。”

    “但在到达其中一个岛屿之前，我们可能要在海上漂上几天。”


    “几天，甚至几周，”船长说，“让我们看看我们的物资。”


    ## 逃离爪哇


    救生艇上的应急食物看起来相当充足：饼干、葡萄干、巧克力（我们把自己的丢了），以及足够维持一周的水。还有一个急救箱，急救箱立刻被用上了，因为穆格里奇先生的鼻子需要被处理。其他几个人也有割伤和淤青。其中一名乘客头部受了重击，似乎患有记忆力丧失。他不知道我们怎么会漂在印度洋中心；他坚信我们正坐在巴达维亚（Batavia）几英里外巡游。


    救生艇在波浪间的波谷中起伏，这种不熟悉的动作让几乎每个人都晕了船。由于没有人能吃下任何东西，一天的口粮被节省了起来。


    太阳非常热，我父亲用一块大斑点手帕遮住头。他一直喜欢带黄色斑点的方手帕，身上很少少于两块；所以他自己也有一块。那顶浸透了水的草编顶帽正被穆格里奇先生用着。


    只有当我从晕船中恢复得差不多时，才想起那本珍贵的邮票集，坐起来惊呼道：“邮票！爸爸，你带邮票集了吗？”


    他遗憾地摇了摇头。“现在一定已经在海底了，”他说，“但别担心，我在钱包里留了几张稀有邮票。”他看起来对自己很自豪，拍了拍他野战衬衫的口袋。


    救生艇漂了一整天，没有人知道它会带我们去向何方。


    “可能是在绕圈走，”穆格里奇先生悲观地说。


    没有指南针，也没有帆，即使我们有桨，划船也去不了远；我们只能听命于洋流的摆布，希望它能带我们走向陆地，或者至少带到经过船只的可呼救范围内。


    太阳落了，像一个熟透的西红柿在海中慢慢融。黑暗压在我们身上。这是一个无月之夜，我们只能看到波浪顶尖的白色泡沫。我头靠在父亲的肩膀上，仰望着遥远天空中闪烁的星星。


    “也许你的朋友尊（Sono）今晚抬头看天空，也会看到同样的星星，”父亲说，“世界终没有那么大。”


    ## 逃离爪哇及危险故事


    “尽管如此，我们周围还是海洋，”穆格里奇先生从黑暗中对尊说道。


    想起尊，我把手伸进口袋，摸到玉马光滑的轮廓，心里感到很安心。


    “我仍然留着尊的海马，”我说，展示给父亲看。


    “收好它，”他说，“它可能会带给我们运气。”“海马幸运吗？”


    “谁知道呢？但他是爱送给你的，而爱是……”


    那天晚上我没睡多久。第二天，太阳又热起来了，我们严格节约用水。到中午我们都饿了，早餐由两块饼干和一块巧克力组成。没有人觉得那么难受，但对我们如何被救起进行了一些讨论。


    ## 逃离爪哇


    “救生艇里有火箭吗？”父亲问道。如果我们看到船或飞机，就可以发射火箭并希望被看到。他们对救生艇进行了彻底搜寻，但没有火箭。


    “一定有人用过它们，”穆格里奇先生评论道。


    “他们在荷兰，”父亲说。“噢，”穆格里奇先生说，一点也不生气。“我一直说，大多数伟人都是英国人。那个叫福克斯（Fawkes）的家伙又做了什么？”


    “试图炸掉议会，”父亲说。


    那天下午，我们看到了了鲨鱼。它们是巨大的生物，当它们在船下来回滑行时，似乎可能会把我们撞翻。它们离开了一段时间，但在傍晚又回来了。


    晚上，当我躺在父亲身边半睡半醒时，我感到几滴水落在我的脸上。起初我以为是海雾；但当洒水持续持续，我意识到是在下雨。


    “下雨了！”我坐起来喊道，“下雨了！”大家都醒了，尽力用杯、帽子或其他容器收集水。穆格里奇先生躺着，张开嘴接落下的雨。


    ## 逃离爪哇及其他危险故事


    “这像了，”他说。


    “你可以拥有全世界的阳光和沙子。给我英国的一个雨天！”


    但第二天一早云层就消失了，那天变得比前一天还要热。很快，我们都被晒得通红发烫。到中午，连穆格里奇先生也保持了沉默。没有人精力说话。


    这时父亲低声说：“孩子，你听到飞机的声音了吗？”


    我仔细听着，在海浪的嘶声中，我听到了远处飞机的轰鸣声；它一定很远，因为我们看不到它。也许它正迎着太阳飞行，刺光让我们酸痛的眼睛无法承受；或者我们只是幻听了那个声音。


    那个失去记忆的荷兰人以为他看到了陆地，一直指向地平线说：“那是巴达维亚，我告诉过你们离岸很近！”其他人什么都没看到。所以不光我和父亲在产生幻觉。


    父亲说：“这只能说明，一个人……”


