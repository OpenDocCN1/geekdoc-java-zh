    ## Escape from Java


    As soon as the plane came to a standstill, my father undid my seat belt. There
    was no time to lose. Water was already filling the cabin, and all the passengers—except
    one, who was dead in his seat with a broken neck—were scrambling for the exit
    hatch. The co-pilot pulled a lever and the door fell away to reveal high waves
    slapping against the sides of the stricken plane.


    Holding me by the hand, my father was leading me towards the exit.


    ‘Quick, lad,’ he said. ‘We won’t stay afloat for long.’

    ‘Give us a hand!’ shouted Mr Muggeridge, still struggling with his life jacket.
    ‘First this bloody bleedin’ nose, and now something’s gone and stuck.’


    My father helped him fix the life jacket, then pushed him out of the door ahead
    of us.


    As we swam away from the seaplane (Mr Muggeridge splashing fiercely alongside
    us), we were aware of the other passengers in the water. One of them shouted to
    us in Dutch to follow him.


    We swam after him towards the dinghy, which had been released the moment we hit
    the water. That yellow dinghy, bobbing about on the waves, was as welcome as land.


    ## Escape from Java and Other Tales of Danger


    All who had left the plane managed to climb into the dinghy. We were seven altogether—a
    tight fit. We had hardly settled in the well of the dinghy when Mr Muggeridge,
    still holding his nose, exclaimed:—‘There she goes!’ And as we looked on helplessly,
    the seaplane sank swiftly and silently beneath the waves.


    The dinghy had shipped a lot of water, and soon everyone was busy bailing it out
    with mugs (there were a couple in the dinghy), hats, and bare hands. There was
    a light swell, and every now and then water would roll in again and half fill
    the dinghy. But within half an hour we had most of the water out, and then it
    was possible to take turns, two men doing the bailing while the others rested.
    No one expected me to do this work, but I gave a hand anyway, using my father’s
    sola topi for the purpose.


    ‘Where are we?’ asked one of the passengers.

    ‘A long way from anywhere,’ said another.

    ‘There must be a few islands in the Indian Ocean.’

    ‘But we may be at sea for days before we come to one of them.’


    ‘Days or even weeks,’ said the captain. ‘Let us look at our supplies.’


    ## Escape from Java


    The dinghy appeared to be fairly provided with emergency rations: biscuits, raisins,
    chocolates (we’d lost our own), and enough water to last a week. There was also
    a first-aid box, which was put to immediate use, as Mr Muggeridge’s nose needed
    attention. A few others had cuts and bruises. One of the passengers had received
    a hard knock on the head and appeared to be suffering from a loss of memory. He
    had no idea how we happened to be drifting about in the middle of the Indian Ocean;
    he was convinced that we were on a pleasure cruise a few miles off Batavia.


    The unfamiliar motion of the dinghy, as it rose and fell in the troughs between
    the waves, resulted in almost everyone getting seasick. As no one could eat anything,
    a day’s rations were saved.


    The sun was very hot, and my father covered his head with a large spotted handkerchief.
    He’d always had a fancy for bandana handkerchiefs with yellow spots, and seldom
    carried fewer than two on his person; so he had one for himself too. The sola
    topi, well soaked in sea water, was being used by Mr Muggeridge.


    It was only when I had recovered to some extent from my seasickness that I remembered
    the valuable stamp album, and sat up, exclaiming, ‘The stamps! Did you bring the
    stamp album, Dad?’


    He shook his head ruefully. ‘It must be at the bottom of the sea by now,’ he said.
    ‘But don’t worry, I kept a few rare stamps in my wallet.’ And looking pleased
    with himself, he tapped the pocket of his bush shirt.


    The dinghy drifted all day, with no one having the least idea where it might be
    taking us.


    ‘Probably going round in circles,’ said Mr Muggeridge pessimistically.


    There was no compass and no sail, and paddling wouldn’t have got us far even if
    we’d had paddles; we could only resign ourselves to the whims of the current and
    hope it would take us towards land or at least to within hailing distance of some
    passing ship.


    The sun went down like an overripe tomato dissolving slowly in the sea. The darkness
    pressed down on us. It was a moonless night, and all we could see the white foam
    on the crests of the waves. I lay with my head on my father’s shoulder, and looked
    up at the stars which glittered in the remote heavens.


    ‘Perhaps your friend Sono will look up at the sky tonight and see those same stars,’
    said my father. ‘The world isn’t so big after all.’


    ## Escape from Java and Tales of Danger


    ‘All the same, there’s a lot of sea around us,’ said Mr Muggeridge from Sono out
    of the darkness.


    Remembering Sono, I put my hand in my pocket and was reassured to feel the smooth
    outline of the jade horse.


    ‘I’ve still got Sono’s sea horse,’ I said, showing it to my father.


    ‘Keep it carefully,’ he said. ‘It may bring us luck.’ ‘Are sea horses lucky?’


    ‘Who knows? But he gave it to you with love, and love is...’


    I didn’t sleep much that night. The next day, the sun was hot again, and we rationed
    our water strictly. By midday we were all hungry, and breakfast consisted of two
    biscuits and a piece of chocolate. No one felt so sick, but there was some discussion
    of our picked up.


    ## Escape from Java


    ‘Are there any rockets in the dinghy?’ asked my father. If we see a ship or a
    plane, we can fire a rocket and hope to be seen. A thorough search was made in
    the dinghy, but there were no rockets.


    ‘Someone must have used them,’ commented Mr Muggeridge.


    ‘They’re in Holland,’ said my father. ‘Ah,’ said Mr Muggeridge, not in the least
    put out. I’ve always said, most great men are Englishmen. And what did this chap
    Fawkes do?’


    ‘Tried to blow up Parliament,’ said my father.


    That afternoon we saw our first sharks. They were enormous creatures, and as they
    glided backward and forward under the boat it seemed they might hit capsize us.
    They went away for some time, but returned in the evening.


    At night, as I lay half asleep beside my father, I felt a few drops of water strike
    my face. At first I thought it was the sea spray; but when the sprinkling continued,
    I realized that it was raining.


    ‘Rain!’ I shouted, sitting up. ‘It’s raining!’ Everyone woke up and did his best
    to collect water in mugs, hats or other containers. Mr Muggeridge lay back with
    his mouth open, drinking the rain as it fell.


    ## Escape from Java and Other Tales of Danger


    ‘This is more like it,’ he said.


    ‘You can have all the sun an’ sand in the world. Give me a rainy day in England!’


    But by early morning the clouds had passed, and the day turned out to be even
    hotter than the previous one. Soon we were all red and raw from sunburn. By midday
    even Mr Muggeridge was silent. No one had the energy to talk.


    Then my father whispered, ‘Can you hear a plane, lad?’


    I listened carefully, and above the hiss of the waves I heard what sounded like
    the distant drone of a plane; it must have been very far away, because we could
    not see it. Perhaps it was flying into the sun, and the glare was just too much
    for our sore eyes; or perhaps we’d just imagined the sound.


    Then the Dutchman who’d lost his memory thought he saw land, and kept pointing
    towards the horizon and saying, ‘That’s Batavia, I told you we were close to shore!’
    No one else saw anything. So my father and I weren’t the only ones imagining things.


