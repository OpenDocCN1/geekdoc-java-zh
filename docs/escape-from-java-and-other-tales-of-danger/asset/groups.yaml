    the general clamour of the station and the shunting of a steam engine in the yard—‘Tea,
    hot tea!'', ‘Fresh limes!’ Sweets, papads, hot stuff, cold drinks, mangoes, toothpowder,
    photos of film stars, bananas, balloons, wooden toys! The platform had become
    a bazaar. What a blessing for those vendors that trains ran late and that people
    had to wait, and waiting, drank milky tea, bought toys for children, cracked peanut
    shells, munched bananas and chose little presents for the friends or relations
    on whom they were going to descend very shortly.


    But there came the train!

    The signal was down. The crowd surged forward, swamping an assistant stationmaster.
