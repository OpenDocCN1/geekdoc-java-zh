    # Sita and the River


    Grandfather brought home a huge mahseer, and Sita made it into a delicious curry.


    ## Deep River


    Grandfather sat outside the hut, smoking his hookah. Sita was at the far end of
    the island, spreading clothes on the rocks to dry. One of the goats had followed
    her. It was the friendlier of the two, and often followed Sita about the island.
    She had made it a necklace of coloured beads.


    She sat down on a smooth rock, and as she did so, she noticed a small bright object
    in the sand near her feet. She picked it up. It was a little wooden toy—a coloured
    peacock, God Krishna’s favourite bird—it must have come down on the river and
    been swept ashore on the island. Some of the paint had been rubbed off; but for
    Sita, who had no toys, it was a great find.


    There was a soft footfall behind her. She looked round, and there was Vijay, barefoot,
    standing over her and smiling.


    ‘I thought you wouldn’t come,’ said Sita. ‘There was much work in my village.
    Did you keep my flute?’


    ‘Yes, but I cannot play it properly.’


    ‘I will teach you,’ said Vijay.


    He sat down beside her and they cooled their feet in the water, which was clear
    now, taking in the blue of the sky. They could see the sand and the pebbles of
    the riverbed.


    ‘Sometimes the river is angry and sometimes it is kind,’ said Sita.


    ‘We are part of the river,’ said Vijay.


    It was a good river, deep and strong, beginning in the mountains and ending in
    the sea.


    Along its banks, for hundreds of miles, lived millions of people, and Sita was
    only one small girl among them, and no one had ever heard of her, no one knew
    her—except for the old man, and the boy, and the water that was blue and white
    and wonderful.


    # Read More in Puffin


    ## Mr Oliver’s Diary

    ### Ruskin Bond

    Illustrated by Anjali Nayar


    - A gun-toting, violin-playing Headmaster.

    - A homicidal barber.

    - A hungry leopard and about a hundred frogs on the loose.

    - Boys with a talent for pranks and jokes.


    Ruskin Bond’s fresh new school stories are a non-stop laugh riot.


    Mr Oliver, a history teacher, arrives in Simla with a train-load of hungry boys
    to start a new term at the Prep School. As he records the antics of the amazing
    characters there, and all that they get up to, we quickly realize that there is
    never a dull moment. A fire, a missing Headmaster, runaway students make sure
    not a day goes by when Mr Oliver has nothing to report in his diary. He writes
    about the eccentric teachers, the girls’ school next door and the lovely Anjali
    Ramola, whom he secretly admires.


    Laugh-out-loud funny, with a core of old-world charm that is trademark Bond, *Mr
    Oliver’s Diary* has stories and characters that have never appeared anywhere before.
    With his runaway wig, pet shrew and endearing dry wit, Mr Oliver is sure to become
    as well-loved as those other vintage Ruskin Bond characters, Uncle Ken and Rusty.


    # Read More in Puffin


    ## The Parrot Who Wouldn’t Talk and Other Stories

    Ruskin Bond

    Illustrated by Kavita Arvind


    I think everyone has at least one eccentric aunt or uncle in the family. I had
    more than one. My boyhood days were brightened by their presence.


    India’s best-loved children’s writer Ruskin Bond introduces us to some of the
    most endearing and adorable characters he has ever written about—his grandfather,
    with his unusual ability to disguise himself as the street-vendor, carpenter and
    sometimes the washerman, the eccentric and ubiquitous Ken, with his knack for
    trouble and disastrous escapades; the stationmaster Mr Ghosh and his amazing family
    comprising a dozen mice; and the unforgettable Aunt Ruby, whose encounter with
    a parrot who wouldn’t talk will make you burst with laughter!


    Meet the regimental myna, read all about the snake who turned into a handsome
    prince every night, and enjoy the tale of the author’s travels as a cook . . .


    Heartwarming, funny and delightful, The Parrot Who Wouldn’t Talk and Other Stories
    features some old-favourites as well as refreshingly new stories written exclusively
    for this collection. Marked by Bond’s inimitable style and trademark humour, and
    embellished with lively illustrations, this book will be a firm favourite with
    children.


    # Read More in Puffin


    ## Panther’s Moon and Other Stories

    Illustrated by Suddhasattwa Basu


    He heard something scratching at the door, and the hair on his head felt tight
    and prickly. It was like a cat scratching, only louder. The door creaked a little
    whenever it felt the impact of the paw . . . ‘It’s the panther,’ Bisnu muttered
    under her breath, sitting up on the hard floor.


    Ten unforgettable tales of fascinating human encounters with animals and birds—of
    a man-eater that terrorizes an entire village; a strange and wonderful trust that
    develops between a fierce leopard and a boy; revengeful monkeys who never forgive
    a woman who grows dahlias; a crow who genuinely thinks human beings are stupid;
    and many others—creating a world in which men and wild creatures struggle to survive
    despite each other: a world where, in the end, one is not quite sure which side
    one is on.


    Another marvellous collection of stories from India’s most-loved author that will
    once again amuse, enchant and delight children of all ages.


    # Read More in Puffin


    ## The Room of Many Colours: A Treasury of Stories for Children

    Ruskin Bond

    Illustrated by Tapas Guha


    For over five decades, Ruskin Bond has written charming tales that have mesmerized
    readers of all ages. This collection brings together his finest stories for children
    in one volume. Published previously as A Treasury of Stories, this attractive
    rejacketed edition includes two new stories, ‘The Big Race’ and ‘Remember this
    Day’.


    Filled with a rich cast of characters and superb illustrations, The Room of Many
    Colours: A Treasury of Stories is the definitive book for all Ruskin Bond fans
    and truly a collector’s item.

