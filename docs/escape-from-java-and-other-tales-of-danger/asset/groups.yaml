    # Sita and the River


    But the python went past them, its head above water, its great length trailing
    behind, until it was lost in the shadows.


    Vijay had more mangoes in the basket, and he and Sita sucked hungrily on them
    while they sat in the boat.


    A big sambhar stag came threshing through the water. He did not have to swim.
    He was so tall that his head and shoulders remained well above the water. His
    antlers were big and beautiful.


    ‘There will be other animals,’ said Sita. ‘Should we climb on to the tree?’


    ‘We are quite safe in the boat,’ said Vijay. ‘The animals will not be dangerous
    tonight. They will not even hunt each other. They are only interested in reaching
    dry land. For once, the deer are safe from the tiger and the leopard. You lie
    down and sleep. I will keep watch.’


    Sita stretched herself out in the boat and closed her eyes. She was very tired
    and the sound of the water lapping against the side of the boat soon lulled her
    to sleep.


    She woke once, when a strange bird called overhead. She raised herself on one
    elbow but Vijay was awake, sitting beside her, her legs drawn up and his chin
    resting on his knees. He was gazing out across the water. He looked blue in the
    moonlight, the colour of the young God Krishna, and for a few moments Sita was
    confused and wondered if the boy was actually Krishna. But when she thought about
    it, she decided that it wasn’t possible; he was just a village boy and she had
    seen hundreds like him—well, not exactly like him, he was a little different .
    . .


    And when she slept again, she dreamt that the boy and Krishna were one, and that
    she was sitting beside him on a great white bird, which flew over the mountains,
    over the snow peaks of the Himalayas, into the cloud-land of the gods. And there
    was a great rumbling sound, as though the gods were angry about the whole thing,
    and she woke up to this terrible sound and looked about her, and there in the
    moonlit glade, to his belly in water, stood a young elephant, his trunk raised
    as he trumpeted his predicament to the forest—for he was a young elephant, and
    he was lost, and he was looking for his mother.


    He trumpeted again, then lowered his head and listened. And presently, from far
    away, came the shrill trumpeting of another elephant. It must have been the young
    one’s mother, because he gave several excited trumpet calls, and then went stamping
    and churning through the water towards a gap in the trees. The boat rocked in
    the waves made by his passing.


    ‘It is all right,’ said Vijay. ‘You can go to sleep again.’ ‘I don’t think I will
    sleep now,’ said Sita.


    ‘Then I will play my flute for you and the time will pass quickly.’


    He produced a flute from under the seat and putting it to his lips began to play.
    And the sweetest music that Sita had ever heard came pouring from the little flute,
    and it seemed to fill the forest with its beautiful sound. And the music carried
    her away again, into the land of dreams, and they were riding on the bird once
    more, Sita and the blue god. And they were passing through cloud and mist, until
    suddenly the sun shot through the clouds. And at that moment Sita opened her eyes
    and saw the sky through the branches of the mahogany tree, the shiny green leaves
    making a bold pattern against the blinding blue of an open sky.


    The forest was drenched with sunshine. Clouds were gathering again, but for an
    hour or so there would be a hot sun on a steamy river.


    Vijay flute lay in the palm of his half-open hand. The sun came slanting across
    his bare brown legs. A leaf had fallen on his face, but it had not woken him.
    It lay on his cheek as though it had grown there.


    Sita did not move about as she did not want to wake the boy. Instead she looked
    around her, and thought the water level had fallen in the night, but she couldn’t
    be sure.


    Vijay woke up last. He yawned, stretched his limbs and sat up beside Sita.


    ‘I am hungry,’ he said.


    ‘So am I,’ said Sita.


    ‘The last mangoes,’ he said, emptying the basket of its last two mangoes.


    After they had finished the fruit, they sucked the big seeds until they were quite
    dry. The discarded seeds floated well on the water. Sita had always preferred
    them to paper boats.


    ‘We had better move on,’ said Vijay.


    He rowed the boat through the trees, and then for about an hour they were passing
    through the flooded forest, under the dripping branches of rain-washed trees.
    Sometimes, they had to use the oars to push away vines and creepers. Sometimes,
    submerged bushes hampered them. But they were out of the forest before ten o’clock.


    The water was no longer very deep and they were soon gliding over flooded fields.
    In the distance they saw a village standing on high ground. In the old days, people
    had built their villages on hilltops as a better defence against bandits and the
    soldiers of invading armies. This was an old village, and though its inhabitants
    had long ago exchanged their swords for pruning forks, the hill on which it stood
    gave it protection from the flood waters.


    # A Bullock Cart Ride


    The people of the village were at first reluctant to help Sita and Vijay.


    ‘They are strangers,’ said an old woman. ‘They are not of our people.’


    ‘They are of low caste,’ said another. ‘They cannot remain with us.’


    ‘Nonsense!’ said a tall, turbaned farmer, twirling his long, white moustache.
    ‘They are children, not robbers. They will come into my house.’


    The people of the village—long-limbed, sturdy men and women of the Jat race—were
    generous by nature, and once the elderly farmer had given them the lead, they
    were friendly and helpful.


    Sita was anxious to get to her grandparents, and the farmer, who had had business
    to transact at a village fair some twenty miles distant, offered to take Sita
    and Vijay with him.


    The fair was being held at a place called Karauli, and at Karauli there was a
    railway station from which a train went to Shahganj.


    It was a journey that Sita would always remember. The bullock cart was so slow
    on the waterlogged roads there was plenty of time in which to see things, to notice
    one another, to talk, to think, to dream.


    Vijay couldn’t sit still in the cart. He was used to the swift, gliding movements
    of his boat (which he had to leave behind in the village), and every now and then
    he would jump off the cart and walk beside it, often ankle-deep in water.


    There were four of them in the cart. Sita and Vijay, Hukam Singh, the Jat farmer,
    and his son, Phambiri, a mountain of a man who was going to take part in the wrestling
    matches at the fair.


    Hukam Singh, who drove the bullocks, liked to talk. He had been a soldier in the
    British Indian army during the First World War, and had been with his regiment
    to Italy and Mesopotamia.


    # Escape from Java and Other Tales of Danger


    “There is nothing to compare with soldiering,’ he said, ‘except, of course, farming.
    If you can’t be a farmer, be a soldier. Are you listening, boy? Which will you
    be—farmer or soldier?”


    “Neither,’ said Vijay. ‘I shall be an engineer!’


    Hukam Singh’s long moustache seemed almost to bristle with indignation.


    ‘An engineer! What next! What does your father do, boy?”


    ‘He keeps buffaloes.’


    ‘Ah! And his son would be an engineer? . . . Well, well, the world isn’t what
    it used to be! No one knows his rightful place any more. Men send their children
    to schools and what is the result? Engineers! And who will look after the buffaloes
    while you are engineering?”


    ‘I will sell the buffaloes,’ said Vijay, adding rather cheekily, ‘perhaps you
    will buy one of them, Subedar Sahib!’


    He took the cheek out of his remark adding ‘Subedar Sahib’, the rank of a non-commissioned
    officer in the old army. Hukam Singh, who had never reached this rank, was naturally
    flattered.


    ‘Fortunately, Phambiri hasn’t been to school. He’ll be a farmer and a fine one,
    too.’

