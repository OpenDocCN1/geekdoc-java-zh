    "Everyone’s on the move," thought Romi. It must be a really big fire.


    He could see the flames now, reaching out from behind the trees on his right,
    and he could hear the crackling as the dry leaves caught fire.


    A jackal, overcome by the heat, lay in the middle of the path, either dead or
    unconscious. Romi did not stop. He swerved around the animal. Then he put all
    his strength into one final effort.


    He covered the last hundred yards at top speed, and then they were out of the
    forest, freewheeling down the sloping road to the river.


    "Look!" shouted Teju. "The bridge is on fire!" Burning embers had floated down
    on the small bridge and the dry timber had quickly caught fire. It was now burning
    fiercely.


    Romi did not hesitate. He left the road, riding the bicycle over sand and pebbles.
    Then with a rush they went down the river bank and into the water.


    The next thing they knew they were splashing around, trying to find each other
    in the darkness.


    "Help!" cried Teju. "I’m drowning!"


    ## VI


    "Don’t be silly," said Romi. "The water isn’t deep—it’s up to the knees. Come
    here and grab hold of me."


    Teju splashed across and grabbed Romi by the belt.


    "The water’s so cold," said Teju, his teeth chattering.


    "Do you want to go back and warm yourself?" asked Romi. "Some people are never
    satisfied. Come on, help me get the bicycle up. It’s down here, just where we
    are standing."


    Together they managed to heave the bicycle out of the water and stand upright.


    "Now sit on it," said Romi. "I’ll push you across."


    "We’ll be swept away," said Teju.


    "No, we won’t. There’s not much water in the river at this time of the year. But
    the current is quite strong in the middle, so sit still. All right?"


    "All right," said Teju nervously.


    Romi began guiding the bicycle across the river, one hand on the seat and one
    hand on the handlebar. The river was shallow and sluggish in midsummer, even so,
    it was quite swift in the middle. But having got safely out of the burning forest,
    Romi was in no mood to let a little river defeat him.


    He kicked off his shoes, knowing they would be lost, and then gripping the smooth
    stones of the river bed with his toes, he concentrated on keeping his balance
    and getting the bicycle and Teju through.

