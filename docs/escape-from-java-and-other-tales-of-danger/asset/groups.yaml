    \n她坐在一块光滑的岩石上，这时她注意到脚边的沙地里有一个亮亮的小物体。她把它捡了起来。那是一个木制玩具——一只彩色的孔雀，克里希纳神最喜欢的鸟——它可能是顺着河流而下，被冲上这座岛的岸边的。油漆掉了一些；但对于没有玩具的希塔来说，这是一个伟大的发现。\n\
    \n她身后传来轻微的脚步声。她环顾望去，是维杰，他光着脚站在她面前微笑。\n\n“我以为你不会过来了，”希塔说，“我村子里有很多事要忙。你留着我的笛子了吗？”\n\
    \n“留着了，但我没法好好吹它。”\n\n“我会教你的，”维杰说。\n\n他坐在她身边，两人在水里泡脚，此时水已经变得清澈透明，倒映着天空的蓝色。他们能看到河床上的沙子和鹅石。\n\
    \n“河流有时很愤怒，有时很和蔼，”希塔说。\n\n“我们是河流的一部分，”维杰说。\n\n这是一条好河，深邃而有力，发于山脉，止于大海。\n\n沿着河岸，绵延数百英里的范围内，生活着数百万人口，而希塔只是其中一个一个小女孩，没有人听过她的名字，也没有人认识她——除了那个老人、那个男孩，还有那片蓝白相间、奇妙的水。\n\
    \n# 在 Puffin 出版阅读更多\n\n## 奥利弗先生的日记\n作者 鲁斯金·邦德 \nAnjali Nayar 绘\n\n- 一位带着枪、会拉小提琴的校长。\n\
    - 一个有杀人倾向的理发师。\n- 一只饥饿的豹子和一百只逃跑的青蛙。\n- 一些擅长恶作剧和开玩笑的男孩。\n\n鲁斯金·邦德新鲜的校园故事是一场停不断的欢笑盛宴。\n\
    \n奥利弗先生是一位历史老师，他带着一车饥饿的男孩来到西姆拉，在预备学校开启新学期。当他记录那里奇特人物的作剧以及他们所做的一切时，我们很快意识到这里从没有无聊的时刻。火灾、失踪的校长、逃课的学生确保了没有哪一天奥利弗先生的日记无话可写。他写了那些古怪的老师、隔壁的女校，以及他暗暗爱慕的安贾莉·拉莫拉。\n\
    \n《奥利弗先生的日记》令人捧腹大笑，核心蕴含着邦德标志性的老世界魅力，书中包含了从未在任何地方出现过的故事和人物。凭借他那逃掉的假发、宠物鼱和深受人喜爱的冷冷幽默，奥利弗先生一定会像其他那些经典的鲁斯金·邦德角色——肯叔叔和拉斯蒂一样深受喜爱。\n\
    \n# 在 Puffin 出版阅读更多\n\n## 不说话的鹦鹉和其他故事\n作者 鲁斯金·邦德\nKavita Arvind 绘\n\n我想每个家庭里至少有一个古怪的姨妈或叔舅。我有不止一个。他们的存在点亮了我的童年。\n\
    \n印度最受爱的儿童作家鲁斯金·邦德向我们介绍了他写过的最迷人和最可爱的角色——他的爷爷，他有不寻常伪装成街头小贩、木工，有时还是洗衣工；古怪且无处不在的肯，他擅长惹麻烦和遭遇灾难性的冒险；站长格什先生以及他那由十二只老鼠组成的神奇家庭；还有令人难忘的鲁比阿姨，她与一只不说话的鹦鹉的相遇会让你大笑喷口！\n\
    \n认识那只军团八哥，读一读关于一条每晚都会变成帅王子的蛇的故事，并享受作者作为厨师的旅行故事……。\n\n《不说话的鹦鹉和其他故事》温馨人心、幽默且精彩，包含了一些经典故事，也有为本辑专门撰写的新颖故事。凭借邦德独一无二的风格和标志性的幽默，并辅以生动的插画，这本书将成为孩子们最喜爱的。\n\
    \n# 在 Puffin 出版阅读更多\n\n## 豹之月和其他故事\nSuddhasattwa Basu 绘\n\n他听到门外有抓挠声，头上的汗毛都竖起来了。听起来像猫在抓挠，但声音更大。每当爪子击中时，门就会吱吱作响……“是豹子，”比斯努坐在坚硬的地板上低声自语。\n\
    \n十个关于人类与动物鸟类迷人邂逅的难忘故事——关于一只恐扰整个村庄的食人兽；一只凶猛的豹子与男孩之间建立的奇妙的信任；一群永远不原谅种大花的女性的报复猴子；一只真心认为人类很愚蠢的乌鸦；以及许多其他故事——创造了一个人类与野生生物相互竞争生存的世界：在这个世界里，人们并不确定自己站在哪一边。\n\
    \n这是这位印度最受爱的作者的另一个精彩故事集，将再次令各个年龄段的孩子感到惊喜和快乐。\n\n# 在 Puffin 出版阅读更多\n\n## 色彩纷的房间：儿童故事集\n\
    作者 鲁斯金·邦德\nTapas Guha 绘\n\n五十多年来，鲁斯金·邦德一直写着让各年龄读者着迷的故事。这个合集将他最优秀的儿童故事汇成一册。此前曾以《故事集》出版，这本精美的重装版本包含了两个新故事：“大赛”和“记住这一天”。\n\
    \n《色彩纷呈的房间：儿童故事集》包含了丰富的角色阵容和精彩的插画，是所有鲁斯金·邦德粉丝的必读之作，绝对是收藏品。\n\n"
