    of everything. We are so small—do you think they know we are here?


    ‘Who knows what the gods think?’


    ‘But I made you,’ said Sita, ‘and I know you are here.’


    ‘And will you save me if the river rises?’


    ‘Yes, of course. I won’t go anywhere without you, Mumta.’


    # The Water Rises


    Sita couldn’t stay indoors for long. She went out, taking Mumta with her, and
    stared out across the river to the safe land on the other side. But was it really
    safe there? The river looked much wider now. It had crept over its banks and spread
    far across the flat plain. Far away, people were driving their cattle through
    waterlogged, flooded fields, carrying their belongings in bundles on their heads
    or shoulders, leaving their homes, making for high land. It wasn’t safe anywhere.


    Sita wondered what had happened to Grandfather and Grandmother. If they had reached
    the shore safely, Grandfather would have had to engage a bullock cart or a pony-drawn
    ekka to get Grandmother to the'
