    man was lucky; when the walls of his house came down, a pot of coins showered
    down on him. But no one else found any treasure.


    It rained all night, although the main shock of the earthquake had passed, minor
    shocks took place at regular intervals of five minutes or so. Rakesh stayed awake
    with the grown-ups. He was sure the school buildings had fallen, and there wouldn''t
    be school for months. There wouldn''t be much else, either.


    Early in the morning, Mumtaz got up to make tea on his small primus stove. Grandfather
    got up and went outside. It had stopped raining, but even the sky looked wounded
    as the sun came up red and angry. For many, it would be a long, sad day.


