    # Sita and the River


    Grandfather brought home a huge mahseer, and Sita made it into a delicious curry.


    # Deep River


    Grandfather sat outside the hut, smoking his hookah. Sita was at the far end of
    the island, spreading clothes on the rocks to dry. One of the goats had followed
    her. It was the friendlier of the two, and often followed Sita about the island.
    She had made it a necklace of coloured beads.


    She sat down on a smooth rock, and as she did so, she noticed a small bright object
    in the sand near her feet. She picked it up. It was a little wooden toy—a coloured
    peacock, God Krishna’s favourite bird—it must have come down on the river and
    been swept ashore on the island. Some of the paint had been rubbed off; but for
    Sita, who had no toys, it was a great find.


    There was a soft footfall behind her. She looked round, and there was Vijay, barefoot,
    standing over her and smiling.


    ‘I thought you wouldn’t come,’ said Sita. ‘There was much work in my village.
    Did you keep my flute?’'
  - '[PAGE 179]


    ‘Yes, but I cannot play it properly.’


    ‘I will teach you,’ said Vijay.


    He sat down beside her and they cooled their feet in the water, which was clear
    now, taking in the blue of the sky. They could see the sand and the pebbles of
    the riverbed.


    ‘Sometimes the river is angry and sometimes it is kind,’ said Sita.


    ‘We are part of the river,’ said Vijay.


    It was a good river, deep and strong, beginning in the mountains and ending in
    the sea.


    Along its banks, for hundreds of miles, lived millions of people, and Sita was
    only one small girl among them, and no one had ever heard of her, no one knew
    her—except for the old man, and the boy, and the water that was blue and white
    and wonderful.'
  - '[PAGE 180]


