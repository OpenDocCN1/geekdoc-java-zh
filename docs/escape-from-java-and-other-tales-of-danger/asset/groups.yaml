    # Escape from Java


    ‘First we must go to India.’


    The following morning I found Sono in the garden, patched up like me, and with
    one foot in a bandage. But he was as cheerful as ever and gave me his usual wide
    grin.


    ‘We’re leaving tomorrow,’ I said.


    The grin left his face.


    ‘I will be sad when you go,’ he said. But then you will be able to escape from
    the Japs.’


    ‘After the war, I’ll come back.’


    ‘Yes, you must come back. And then, when we are big, we will go round the world
    together. I want to see England and America and Africa and India and Japan. I
    want to go everywhere.’


    ‘We can’t go everywhere.’


    ‘Yes, we can. No one can stop us!’


    We had to be up very early the next morning. Our bags had been packed late at
    night. We were taking a few clothes, some of my father’s business papers, a pair
    of binoculars, one stamp album, and several bars of chocolate. I was pleased about
    the stamp album and the chocolates, but I had to give up several of my treasures—favourite
    books, the gramophone and records, an old Samurai sword, a train set and a'
