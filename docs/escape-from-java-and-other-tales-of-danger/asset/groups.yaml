    # Escape from Java and Other Tales of Danger


    Sita milked the goat thinking that perhaps it was the last time she would be milking
    it. But she did not care for the goat in the same way that she cared for Mumta.


    The sun was just coming up when Grandfather pushed off in the boat. Grandmother
    lay in the prow. She was staring hard at Sita, trying to speak, but the words
    would not come. She raised her hand in blessing.


    Sita bent and touched her grandmother’s feet and then Grandfather pushed off.
    The little boat—with its two old people and three goats—rode swiftly on the river,
    edging its way towards the opposite bank. The current was very swift and the boat
    would be carried about half a mile downstream before Grandfather would be able
    to get it to dry land.


    It bobbed about on the water, getting small and smaller, until it was just a speck
    on the broad river. And suddenly Sita was alone.


    There was a wind, whipping the raindrops against her face; and there was the water,
    rushing past the island; and there was the distant shore, blurred by rain; and
    there was the small hut; and there was the tree.


    Sita got busy. The hens had to be fed. They weren’t concerned about anything except
    food. Sita threw'
