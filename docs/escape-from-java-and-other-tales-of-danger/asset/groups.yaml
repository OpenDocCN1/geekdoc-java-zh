    # Panther’s Moon and Other Stories


    Illustrated by Suddhasattwa Basu


    He heard something scratching at the door, and the hair on his head felt tight
    and prickly. It was like a cat scratching, only louder. The door creaked a little
    whenever it felt the impact of the paw . . . ‘It’s the panther,’ Bisnu muttered
    under her breath, sitting up on the hard floor.


    Ten unforgettable tales of fascinating human encounters with animals and birds—of
    a man-eater that terrorizes an entire village; a strange and wonderful trust that
    develops between a fierce leopard and a boy; revengeful monkeys who never forgive
    a woman who grows dahlias; a crow who genuinely thinks human beings are stupid;
    and many others—creating a world in which men and wild creatures struggle to survive
    despite each other: a world where, in the end, one is not quite sure which side
    one on.


    Another marvellous collection of stories from India’s most-loved author that will
    once again amuse, enchant and delight children of all ages.'
