    his knee when I was a baby, and I had grown up under his eyes. He led me to a
    hut some thirty yards from our old home. It was a mud house, facing the road,
    and its door was closed. Lala knocked on the door, but received no answer; then
    he put his mouth to a chink and whispered, ‘Missy-baba is with me, open the door.’


