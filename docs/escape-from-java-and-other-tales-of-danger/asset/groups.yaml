    # 希塔与河流


    “如果雨一直这样下，河水位一直上涨，水就会冲进屋子了。”

    “我害怕河流，穆姆塔。你不害怕吗？”

    “别害怕。河流一直以来对我们很好。”


    “如果水进了屋子我们怎么办？”

    “我们会爬到屋顶上去。”

    “如果水也漫过了屋顶呢？”

    “我们就爬大榕树。河水位从来没有比大榕树高过。”


    当第一缕光线从小小的天窗透进来时，希塔就起来走到了室外。雨并没有下得很大，只是毛毛雨；但这种毛雨可能会持续好几天，很可能意味着河流源头的山区正下着大雨。


    希塔走到水边。她找不到她最喜欢的那块石头了，那块她经常坐在上面，双脚悬在水里，看着小鹹鹱鱼游过。那块石头无疑还在那里，但河水已经漫过了它。


    她站在沙滩上，能感觉到水从脚底下渗出、泛着泡。


    河流不再是绿蓝相间并点缀着白色。它变成了一种浑浊的颜色。


    # 逃离爪哇和其他危险故事


    希塔挤着羊奶，心想也许这是最后一次挤奶了。但她对这只羊的感情并不像对穆姆塔那样。


    太阳刚升起，爷爷推着船出发了。奶奶躺在船头。她紧紧地盯着希塔，试图说话，却话说不出来。她举手做了一个祝福的手势。


    希塔弯身碰了奶奶的脚，接着爷爷推船离开了。那只小船——载着两个老人和三只羊——在河面上快速航行，向对岸边缘延伸去。水流非常急，在爷爷把船带上陆地之前，船会被顺流冲大约半英里。


    它在水面上漂浮，变得越来越小，直到变成宽阔河流上的一个小点。突然间，希塔变得孤单了。


    有风刮过，将雨滴打在她的脸上；有水流流过岛屿；有远处的岸边，被雨模糊了；还有那间小木屋；还有那棵树。


    希塔忙碌起来。母鸡必须喂食。除了食物，它们什么都不关心。希塔给它们撒下了一把粗粮、土豆皮和花生壳。


    然后她拿起扫帚打扫了屋子，点上炭炉，加热了一些牛奶，心里想着：“明天就没有牛奶喝了……”她开始剥洋葱皮。很快，她的眼睛开始刺痛，她停顿片刻，环顾四周安静的房间，再次意识到自己是孤单的。在角落里，爷爷的烟斗静静地立在墙角。那是一个非常漂亮的旧烟斗，曾属于希塔的曾祖父。烟斗是由包裹在银里的椰壳制成的。长弯曲的烟杆至少四英尺长。这是他们最宝贵的财物。奶奶那根结实的相柚木拐杖站在另一个角落。


    希塔寻找着穆姆塔，在轻木的架床下找到了娃娃，并把它放在了自己能看得见、听到的范围内。雷声从山上滚滚落下。轰——轰——轰……


    “山神生气了，”希塔说，“你觉得他们是在生我的气吗？”


    “为什么要生你的气呢？”穆姆塔问。他们生气不需要理由。他们对万物都生气，而我们正处于万物之中。我们是如此渺小——你觉得他们知道我们在这里吗？”


    “谁知道神在想什么呢？”


    “但我创造了你，”希塔说，“我知道你在这里。”


    “如果水涨，你会救我吗？”


    “会的，当然了。穆姆塔，我不会离开你去任何地方的。”


    # 水涨了


    希塔无法在室内呆太久。她带着穆姆塔来到户外，隔着河流望向对面安全的陆地。但那里真的安全吗？河流现在看起来宽了许多。水已经漫过了岸，在平坦的平原上散得很远。远处，人们正赶着牲畜穿过积水、淹没的田野，头顶或肩上扛着行李离开家园，向高处走去。哪里都不是安全的。


    希塔想爷爷奶奶发生了什么。如果他们安全到达了岸边，爷爷就得找一辆牛车或马拉的单轮车，把奶奶送到五六英里外的地区医院。沙甘吉有一个市场、法庭、监狱、电影院和医院。


    她想自己是否还能见到奶奶。她已经尽力照顾这位老人家，记得奶奶过去照顾她的时光，曾温柔地触碰她发烧的额头，并给她讲过故事——那些关于神的故事——关于小克里希纳，他是鸟兽的朋友，充满了顽皮作剧，总是让其他神灵陷入混乱。他曾未经许可移动了一座山，让因陀拉神发了。因陀拉是云之神，主宰雷电，当他生气时，就会降下像这样的大洪水。


    岛屿现在看起来小得许多。它的一些泥岸很快溶解了，没入河中。但在岛屿中间有岩石地，岩石只能被部分淹没。希塔爬上树以更好地观察洪情。她用手遮住眼睛挡住雨，向上游望去。到处都是水。世界变成了一条巨大的河流。河岸看起来像是从水里长出来的，像红树林。天空布满了充满水分的云。雷声从山上滚滚落下，河流似乎发着空洞的轰鸣声回应着。有什么东西顺水流而下，某个巨大而肿胀的东西。它现在近了，希塔能看清它的体型——是一头顺流而下的溺死牛。所以水已经淹没了上游的村庄。又或许，那只牛离上涨的河流太近了。她看到木板、小树和灌木丛，然后是一个木床漂了过去。


    当她爬下树时，雨下得更大了。她跑回室内，赶着走在前面的母鸡。它们飞进屋子，缩在奶奶的床下。希塔想现在把它们留着是最好的。有三只母鸡和一只公鸡。河流没有扰到它们。它们对食物感兴趣，希塔给它们扔一把洋葱皮让它们感到很满足。


    她本想关上门，隔绝雨水的沙沙声和河流的轰鸣声，但那样就不知道水涨得有多快了。她把穆姆塔抱在怀里，开始祈祷雨停水退。她向因陀拉神祈求，以防他忙于别处，她也向其他神祈求。她祈求祖父母平安，也祈求自己平安。她把自己放在最后——但在那是努力之后！


    最后，希塔决定为自己做顿饭。于是她切了一些洋葱，煎了它们，然后加入姜黄和辣椒辣椒、盐和水，搅拌直到一切滋滋作响；然后加入了一杯豆子并盖上锅。这花了她大约十分钟。菜还需要半小时才能煮好。


