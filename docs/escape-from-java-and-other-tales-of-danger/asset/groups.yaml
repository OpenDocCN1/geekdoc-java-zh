    ## Lala’s House


    Lala Ramjimal’s family consisted of himself, his wife, mother, aunt and sister.
    It was a house of women, and our unexpected arrival hadn’t changed that. It must
    indeed have been a test of the Lala’s strength and patience, with twelve near-hysterical
    females on his hands!


    His family, of course, knew who we were, because


    ## Escape from Java and Other Tales of Danger


    Lala’s mother and aunt used to come and draw water from our well, and offer bel
    leaves at the little shrine near our house. They were at first shy of us; and
    we, so immersed in our own predicament, herded together in a corner of the house,
    looked at each other’s faces and wept. Lala’s wife would come and serve us food
    in platters made of stitched leaves. We ate once in twenty-four hours, a little
    after noon, but we were satisfied with this one big meal.


    The house was an ordinary mud building, consisting of four flat-roofed rooms,
    with a low veranda in the front, and a courtyard at the back. It was small and
    pretentious, occupied by a family of small means.


    Lala’s wife was a young woman, short in stature, with a fair complexion. We didn’t
    know her name, because it is not customary for a husband or wife to call the other
    by name; but her mother-in-law would address her as *dulhan*, or bride.


    Ramjimal himself was a tall, lean man, with a long moustache. His speech was always
    very polite, like that of most Kayasthas but he had an air of determination about
    him that was rare in others.


    On the second day of our arrival, I overheard his mother speaking to him: ‘Lalaji,
    you have made a great mistake in bringing these *Angrezans* into our house. What
    will people say? As soon as the rebels hear of it, they will come and kill us.’


    ‘I have done what is right,’ replied Lala very quietly. ‘I have not given shelter
    to Angrezans. I have given shelter to friends. Let people say or think as they
    please.’


    He seldom went out of the house, and was usually to be seated before the front
    door, either smoking his small hookah, or playing chess with some friend, who
    happened to drop by. After a few days, people began to suspect there was somebody
    in the house about whom Lala was being very discreet, but they had no idea who
    these guests be. He kept a close watch on his family, to prevent them from talking
    too much; and he saw that no one entered the house, keeping the front door chained
    at all times.


    It is a wonder that we were able to live undiscovered for as long as we did, for
    there were always the dogs to draw attention to the house. They would not leave
    us, though we had nothing to offer except the leftovers from our own meals. Lala’s
    aunt told Mother that the third of our dogs, who had not followed us, had been
    seen going round and round the smoking ruins of our bungalow, and that on the
    day after the outbreak, he was found dead, sitting up—waiting for his master’s
    return!


    ## Escape from Java


    It all happened within the space of a few days. The cassia tree had barely come
    into the flower when the first bombs fell on Batavia (now called Jakarta) and
    the bright pink blossoms lay scattered over the wreckage in the streets.


    News had reached us that Singapore had fallen to the Japanese. My father said,
    ‘I expect it won’t be long before they take Java. With the British defeated, how
    can the Dutch be expected to win!’ He did not mean to be critical of the Dutch;
    he knew they did not have the backing of the Empire that Britain had. Singapore
    had been called the Gibraltar of the East. After its surrender there could only
    be retreat, a vast exodus of Europeans from South-East Asia.


    It was the Second World War. What the Javanese thought about the war is now hard
    for me to say, because I was only nine at the time and knew very little of worldly
    matters. Most people knew they would be exchanging their Dutch rulers for Japanese
    rulers; but there were also many who spoke in terms of freedom for Java when the
    war was over.


    Our neighbour, Mr Hartono, was one of those who looked ahead to a time when Java,
    Sumatra and the other islands would make up one independent nation. He was a college
    professor and spoke Dutch, Chinese, Javanese and a little English. His son, Sono,
    was about my age. He was the only boy I knew could talk to me in English, and
    as a result we spent a lot of time together. Our favourite pastime was flying
    kites in the park.


    The bombing soon put an end to kite flying. Air raid alerts sounded at all hours
    of the day and night and, although in the beginning most of the bombs fell near
    the docks, a couple of miles from where we lived, we had to stay indoors. If the
    planes sounded very near, we dived under beds or tables. I don''t remember if
    there hadn''t been time for trench digging, and now there was time only for digging
    graves. Events had moved all too swiftly, and everyone (except, of course, the
    Javanese) was anxious to get away from Java.


    “When are you going?” asked Sono, as we sat on the veranda steps in a pause between
    air raids.


    ## A Flight of Pigeons


    ‘I don’t know,’ I said. ‘It all depends on my father.’

    ‘My father says the Japs will be here in a week. And if you’re still here then,
    they’ll put you to work building a railway.’


    ‘I wouldn’t mind building a railway,’ I said.

    ‘But they won’t give you enough to eat. Just rice with worms in it. And if you
    don’t work properly, they’ll shoot you.’


    ‘They do that to soldiers,’ I said. ‘We’re civilians.’

    ‘They do it to civilians, too,’ said Sono.


    What were my father and I doing in Batavia, when our home had been first in India
    and then in Singapore? He worked for a firm dealing in rubber, and six months
    earlier he had been sent to Batavia to open a new office in partnership with a
    Dutch business house. Although I was so young, I accompanied my father almost
    everywhere. My mother left when I was very small, and my father had always looked
    after. After the war was over he was going to take me to England.


    ‘Are we going to win the war?’ I asked.

    ‘It doesn’t look like it from here,’ he said.


    No, it didn’t look as though we were winning. Standing at the docks with my father,
    I watched the ships arrive from Singapore crowded with refugees—

