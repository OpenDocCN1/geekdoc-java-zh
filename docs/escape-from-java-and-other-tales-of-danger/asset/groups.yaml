    She wondered if she would ever see Grandmother again. She had done her best to
    look after the old lady, remembering the times when Grandmother had looked after
    her, and had gently touched her fevered brow, and had told her the stories—stories
    about the gods—about the young Krishna, friend of birds and animals, so full of
    mischief, always causing confusion among the other gods. He made God Indra angry
    by shifting a mountain without permission. Indra was the god of the clouds, who
    made the thunder and lightning, and when he was angry he sent down a deluge such
    as this one.


    The island looked much smaller now. Some of its mud banks had dissolved quickly,
    sinking into the river. But in the middle of the island there was rocky ground,
    and the rocks would never crumble; they could only be submerged.


    Sita climbed into the tree to get a better view of the flood. She had climbed
    the tree many times, and it took her only a few seconds to reach the higher branches.
    She put her hand to her eyes as a shield from the rain and gazed upstream.


    There was water everywhere. The world had become one vast river. Even the trees
    on the forested


