    “我会来的，”维贾杰说，“如果有一天。”


    当他离开时，他给了她一个笛。维贾杰笑着说，“我会来的！”


    ## 回归


    比起下雨，但糟糕的情况已经结束了，当祖父和茜塔回到岛屿时，河流不再泛滥。祖父几乎无法相信自己的眼睛，看到那棵树消失了——那棵树曾是岛屿本身的一部分。“是那棵树救了你，”祖父说。“还有那个男孩，”茜塔说。“是的，还有那个男孩。”


    她想起了维贾杰，不知道自己是否还能再次见到他。他会像法姆比里和哈卡姆·辛格一样，从童话中出现，然后神秘地消失吗？她那时并不知道，但我们生命中某些移动的力量注定会触碰我们，然后离而去。……


    因为奶奶已经不在他们身边，岛屿上的生活完全不同。夜晚是忧伤而孤独的。


    但有很多工作要做，茜塔没有太多时间考虑奶奶、维贾杰或她在途中看到的世界。


    三个晚上，他们睡在麻袋制成的简陋避难所。白天，茜塔帮助祖父重建泥屋。他们再次使用大石头作为支撑。


    茜塔小心打包的箱子没有被冲离岛，但水进了里面，食物和衣服都坏了。但祖父的烟斗保存了下来，晚上工作结束后，他们吃完茜塔准备的简单便饭后，他会带着一点满足感抽烟，讲述他小时候经历过的其他洪水。他还会告诉她他赢得摔跤比赛，以及他放过的风。


    ## 从爪哇逃脱和其他危险故事


    茜塔在菩树立过的地方种了一颗芒果种子。多年后它才会长成大树，但茜塔喜欢想象自己坐在树枝上，直接从树上摘芒果吃，整天大快。


    祖父更在意种菜园，种下了豌豆、胡萝卜、豆类和芥末。


    一天，当大部分工作完成，新屋子准备好时，茜塔拿着维贾杰给她的笛，走到水边尝试吹奏。但她发出的只有破碎的音符，连山羊也不理会她的音乐。


