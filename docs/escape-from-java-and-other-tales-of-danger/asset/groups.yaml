    # Earthquake


    # Grandfather’s Bath


    Whenever there was an emergency, Grandfather happened to be in his bath.


    He was in his bath when a wild elephant smashed its way through the garden, trampling
    Grandmother’s prize roses and sweet peas and bringing down the garden wall. He
    was in his bath when the roof of the house blew away in a cyclone. And he was
    in his bath when a visiting aunt went into hysterics because there was a baby
    python curled up on her dressing table. On all these occasions he expressed surprise
    that anything could have happened during the twenty minutes he was in his bathtub;
    by the time he had dressed, everything was over—the wild elephant had gone trumpeting
    on its way, the cyclonic storm had passed, and the baby python had been removed
    by young master Rakesh who had put it there in the first place.


    Grandfather’s bath consisted of an old-fashioned tin tub filled with several buckets
    of hot water to which he added sprigs of mint. A mint bath! No one had ever heard
    of such a thing, but Grandfather said it was refreshing.


    He was in his bath when the first shock of the earthquake shook the town, an earthquake
    that was to reduce most of it to rubble.


    # Earthquake


    The children’s mother had died when Dolly was born, and their father, Mr Burman,
    worked on a tea estate a few miles away, where there were no schools. So the children
    stayed with Mr Burman’s parents, who wouldn’t have parted with them for anything.


    Every year there were earth tremors in this part of India, but there hadn’t been
    a really big for thirty years.


    ‘What do you do when there’s an earthquake?’ asked Rakesh, who had heard all about
    the last one.


    ‘There isn’t time to do much,’ said Grandfather. ‘Everyone just rushes out of
    doors.’


    ‘I’ll stay in my bed until it’s over,’ said Rakesh. ‘I’ll get under my bed,’ said
    Mukesh. ‘It can’t find me there!’


    ‘It’s best to stand in a doorway,’ said Grandmother.


    “If you look at earthquake pictures, you’ll notice that the door frames are always
    left standing!”


    Although Shillong was in a region where earthquakes sometimes happened, the family
    liked living there.


    # Escape from Java


    There was a lake and a colourful bazaar, and Grandmother’s garden was full of
    butterflies, birds and exotic orchids, as well as fruit trees and trees that were
    fun to climb. Rakesh liked roaming around the town on his bicycle. Mukesh enjoyed
    the sweet shops in the bazaar—when he wasn’t wrestling in the dust with Mumtaz’s
    two boys. Dolly kept herself busy building her own doll’s house under the suitcase.


    Life moved at a gentle pace in Shillong. Apart from the elephant in the garden,
    nothing very exciting had happened recently to the family. The highlight of the
    year had been winning Rakesh’s high jump in his school sports, for which he had
    won a small cup—so small, that he had given it to Dolly to add to her doll’s house.


    Then one morning, while Grandfather was having his bath, the town seemed suddenly
    very still and very quiet . . .


    # The First Tremors


    Grandfather didn’t notice anything because he was splashing about and singing;
    but Grandmother, who was in the garden trimming her rose bushes, paused in her
    work and looked up. Why were the birds silent?

