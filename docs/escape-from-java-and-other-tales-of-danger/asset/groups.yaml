    # Sita and the River


    She would have liked to close the door and shut out the swish of the rain and
    the boom of the river, but then she would have no way of knowing how fast the
    water rose.


    She took Mumta in her arms, and began praying for the rain to stop and the river
    to fall. She prayed to God Indra, and just in case he was busy elsewhere, she
    prayed to other gods too. She prayed for the safety of her grandparents and for
    her own safety. She put herself last—but only after an effort!


    Finally Sita decided to make herself a meal. So she chopped up some onions, fried
    them, then added turmeric and red chilli powder, salt and water, and stirred until
    she had everything sizzling; and then she added a cup of lentils and covered the
    pot.


    Doing this took her about ten minutes. It would take about half an hour for the
    dish to cook.


    When she looked outside, she saw pools of water among the rocks. She couldn''t
    tell if if it was rainwater or the overflow from the river.


    She had an idea.


    A big tin trunk stood in a corner of the room. In it Grandmother kept an old single-thread
    sewing machine. It had belonged once to an English lady,'
- md: '

    had found its way to a Shahganj junkyard, and had been rescued by Grandfather
    who had paid fifteen rupees for it. It was just over a hundred years old but it
    could still be used.


    The trunk also contained an old sword. This had originally belonged to Sita’s
    great-grandfather, who had used it to help defend his village against marauding
    Rohilla soldiers more than a century ago. Sita could tell that it had been used
    to fight with, because there were several small dents in the steel blade.


    But there was no time for Sita to start admiring familylooms. She decided to stuff
    the trunk with everything useful or valuable. There was a chance that it wouldn’t
    be carried away by the water.


    Grandfather’s hookah walking stick went in, too. So did a number of small tins
    containing the spices used in cooking—nutmeg, caraway seed, cinnamon, coriander,
    pepper—also a big tin of flour and another of molasses. Even if she had to spend
    several hours in the tree, there would be something to eat when she came down
    again.


    A clean white cotton dhoti of Grandfather’s and Grandmother’s only spare sari
    also went into the trunk. Never mind if they got stained with curry powder!


    ## Sita and the River


    Never mind if they got the smell of salted fish—some of that went in, too.


    Sita was so busy packing the trunk that she paid no attention to the lick of cold
    water at her heels. She locked the trunk, dropped the key into a crack in the
    rock wall and turned to give her attention to the food. It was only then that
    she discovered that she was walking about on a watery floor.


    She stood still, horrified by what she saw. The water was oozing over the threshold,
    pushing its way into the room.


    In her fright, Sita forgot about her meal and everything else. Darting out of
    the hut, she ran splashing through ankle-deep water towards the safety of the
    peepul tree. If the tree hadn’t been there, such a well-known landmark, she might
    have floundered into deep water, into the river.


    She climbed swiftly into the strong arms of the tree, made herself comfortable
    on a familiar branch and thrust her wet hair away from her eyes.


    ## The Tree


    She was glad she had hurried. The hut was now surrounded by water. Only the higher
    parts of the island could still be seen—a few rocks, the big rock into which the
    hut was built, a hillock on which some brambles and thorn grew.


    The hens hadn’t bothered to leave the hut. Instead, they were perched on the wooden
    bedstead.


    ‘Will the river still rise higher?’ wondered Sita. She had never seen it like
    this before. With a deep, muffled roar it swirled around her, stretching away
    in all directions.


    The most unusual things went by on the water—an aluminium kettle, a cane chair,
    a tin of tooth powder, an empty cigarette packet, a wooden slipper, a plastic
    doll . . .


    A doll!


    With a sinking feeling, Sita remembered Mumta. Poor Mumta, she had been left behind
    in the hut. Sita, in her hurry, had forgotten her only companion.


    She climbed down from the tree and ran splashing through the water towards the
    hut. Already the current was pulling at her legs. When she reached the hut, she
    found it full of water. The hens had gone and so had Mumta.


    Sita struggled back to the tree. She was only just in time, for the waters were
    higher now, the island fast disappearing.


    ## Sita and the River


    She crouched miserably in the fork of the tree, watching her world disappear.


    She had always loved the river. Why was it threatening her now? She remembered
    the doll and thought, ‘If I can be so careless with someone I have made, how can
    I expect the gods to notice?’


    Something went floating past the tree. Sita caught a glimpse of a stiff, upraised
    arm and long hair streaming behind the water. The body of a drowned woman. It
    was soon gone but it made Sita feel very small and lonely, at the mercy of great
    and cruel forces. She began to shiver and then to cry.


    She stopped crying when she saw an empty kerosene tin, with one of the hens perched
    on top. The tin came bobbing along on the water and sailed slowly past the tree.
    The hen looked a bit ruffled but seemed secure on its perch.


    A little later, Sita saw the remaining hens fly up to rock ledge to huddle there
    in a small recess.


    The water was still rising. All that remained of the island was the big rock behind
    the hut and the top of the hut and the peepul tree.


    She climbed a little higher into the crook of a branch. A jungle crow settled
    in the branches above her. Sita saw the nest, the crow’s nest, an untidy platform
    of twigs wedged in the fork of a branch.


    In the nest were four speckled eggs. The crow sat on them and cawed disconsolately.
    But though the bird sounded miserable, its presence brought some cheer to Sita.
    At least she was not alone. Better to have a crow for company than no one at all.


    Other things came floating out of the hut—a large pumpkin; a red turban belonging
    to Grandfather, unwinding in the water like a long snake; and then—Mumta!


    The doll, being filled with straw and wood shavings, moved quite swiftly on the
    water, too swiftly for Sita to do anything about rescuing it. Sita wanted to call
    out, to urge her friend to make for the tree, but she knew that Mumta could not
    swim—the doll could only float, travel with the river, and perhaps washed ashore
    many miles downstream.


    The trees shook in the wind and rain. The crow cawed and flew up, circled the
    tree a few times, then returned to the nest. Sita clung to the branch.


    The tree trembled throughout its tall frame. To Sita it felt like an earthquake
    tremor. She felt shudder of the tree in her own bones.


    The river swirled all around her now. It was almost up to the roof of the hut.
    Soon the mud walls would crumble and vanish. Except for the big rock and some
    trees very far away, there was only water to be seen. Water and the grey, weeping
    sky.


    In the distance, a boat with several people in it moved sluggishly away from the
    ruins of a flooded village. Someone looked out across the flooded river and said,
    ‘See, there is a tree right in the middle of the river! How could it have got
    there? Isn’t someone moving in the tree?’


    But the others thought he was imagining things. It was only a tree carried down
    by the flood, they said. In worrying about their own distress, they had forgotten
    about the island in the river.


    The river was very angry now, rampaging down from the hills and thundering across
    the plain, bringing with it dead animals, uprooted trees, household goods and
    huge fish choked to death by the swirling mud.


    The peepul tree groaned. Its long, winding roots still clung tenaciously to the
    earth from which it had sprung many, many years ago. But the earth was softening,
    the stones were being washed away. The roots of the tree were rapidly losing their
    hold.


    ## Escape from Java and Other Tales of Danger


    The crow must have known that something was wrong, because it kept flying up and
    circled the tree, reluctant to settle in it, yet unwilling to fly away. As long
    as the nest was there, the crow would remain too.


    Sita’s wet cotton dress clung to her thin body. The rain streamed down from her
    long, black hair. It poured from every leaf of the tree. The crow, too, was drenched
    and groggy.


    The tree groaned and moved again.


    There was a flurry of leaves, then a surge of mud from below. To Sita it seemed
    as though the river was rising to meet the sky. The tree tilted, swinging Sita
    from side to side. Her feet were in the water but she clung tenaciously to her
    branch.


    And then, she found the tree moving, moving with the river, rocking her about,
    dragging its roots along the ground as it set out on the first and last journey
    of its life.


    And as the tree moved out on the river and the little island was lost in the swirling
    waters, Sita forgot her fear and her loneliness. She was as though one of the
    gods had remembered her after all.

