    ## A Flight of Pigeons


    bewildered and dazed by what had happened. I remember asking my father what had
    happened to make him bleed so much.


    ‘Take the handkerchief from my pocket and bandage my face,’ he said.


    When I made a bandage from both our handkerchiefs and tied it about his head,
    he said he wished to go home. I took him by the hand and tried to lead him out
    of the porch; but we had gone only a few steps when he began to feel faint, and
    said, ‘I can’t walk, Ruth. Let us go back to the church.’


    ***


    The armed men had made only one rush through the church, and had then gone off
    through the vestry door. After wounding my father, they had run up the centre
    of the aisle, slashing right and left. They had taken a cut at Lieutenant Scott,
    but his mother threw herself over him and received the blow on her ribs; her tight
    clothes saved her from a serious injury. Mr Ricketts, Mr Jenkins, the Collector,
    and Mr MacCullam, the minister, ran out through the vestry.


    The rest of the congregation had climbed up to the belfry, and on my father’s
    urging me to do so, I joined them there. We saw Captain James riding up to the
    church, quite unaware of what was happening. We shouted him a warning, but as
    he looked up at us, one of the sepoys, who were scattered about on the parade
    ground, fired at him and he fell from his horse. Now two other officers came running
    from the Mess, calling out to the sepoys: ‘Oh! children, what are you doing?’
    They tried to pacify their men, but no one listened to them. They had, however,
    been popular officers with the sepoys, who did not prevent them from joining us
    in the turret with their pistols in their hands.


    Just then we saw a carriage coming at full speed towards the church. It was Dr
    Bowling’s, and it carried him, his wife and child, and the nanny. The carriage
    had to cross the parade ground, and they were halfway across when a bullet hit
    the doctor who was sitting on the coach box. He doubled up in his seat, but did
    not let go of the reins, and the carriage had almost reached the church, when
    a sepoy ran up and made a slash at Mrs Bowling, missing by inches. When the carriage
    reached the church, some of the officers ran down to help Dr Bowling off the coach
    box. He struggled in his arms for a while, and was dead when they got him to the
    ground.


    I had come down from the turret with the officers, and now ran to where my father
    lay. He was sitting against the wall, in a large pool of blood. He did not complain
    of any pain, but his lips were parched, and he kept his eyes open with an effort.
    He told me to go home, and to ask Mother to send someone with a cot, or a *dolie*,
    to carry him back. So much had happened so quickly that I was completely dazed,
    and though Mrs Bowling and the other women were weeping, there wasn''t a tear
    in my eye. There were two great wounds on my father’s face, and I was reluctant
    to leave him, but to run home and fetch a *dolie* seemed to be the only way in
    which I could help him.


    Leaving him against the stone wall of the church, I ran round to the vestry side
    and almost fell over Mr Ricketts, who was lying about twelve feet from the vestry
    door. He had been attacked by an expert and powerful swordsman, whose blow had
    cut through the trunk from the left shoulder, separating the head and right hand
    from the rest of the body. Sick with horror, I turned from the spot and began
    running home through Buller’s compound.


    Nobody met me on the way. No one challenged me, or tried to intercept or molest
    me. The cantonment seemed empty and deserted; but just as I reached the end of
    Buller’s compound, I saw our house in flames. I stopped at the gate, looking about
    for my mother, but could not see her anywhere. Granny, too, was missing, and the
    servants. I saw Lala Ramjimal walking down the road towards me.


    ‘Don’t worry, my child,’ he said. ‘Mother, Granny and the others are all safe.
    Come, I will take you to them.’


