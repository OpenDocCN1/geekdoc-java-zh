    For a few moments there was chaos. The crowd surged backwards and forwards. No
    one could get out. No one could get in! Fifty people were leaving the train, a
    hundred were catching it! No one wanted to give way. But every problem has a solution
    somewhere, provided one looks for it. And this particular problem was solved by
    a man climbing out of a window. Others followed his example. The pressure at the
    doors eased and people started squeezing into the compartments.


