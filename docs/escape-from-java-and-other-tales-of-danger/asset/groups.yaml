    changing its course and flooding the whole of Assam, while crocodiles invaded
    the towns and villages; of glaciers sliding down from the Himalayas; and of the
    earth opening up and swallowing the whole of Shillong!


    ‘The end of the world is near!’ proclaimed a holy man in the bazaar.


    ‘Tell us, holy one, what should we do about it?’ asked a shopkeeper.


    ‘Purify yourself,’ said the holy man. ‘Take care of your soul!’'
