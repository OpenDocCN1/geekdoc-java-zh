    # Escape from Java and Other Tales of Danger


    dartboard. The only consolation was Sono, and not a stranger, would have them.


    In the first faint light of dawn a truck drew up in front of the house. It was
    driven by a Dutch businessman, Mr. Hookens, who worked with my father. Sono was
    already at the gate, waiting to say goodbye.


    ‘I have a present for you,’ he said.


    He took me by the hand and pressed a smooth hard object into my palm. I grasped
    it and then held it up against the light. It was a beautiful little sea horse,
    carved out of pale blue jade.


    ‘It will bring you luck,’ said Sono.


    ‘Thank you,’ I said. ‘I will keep it forever.’


    And I slipped the little sea horse into my pocket.


    ‘In you get, lad,’ said my father, and I got up on the front seat between him
    and Mr. Hookens.


    As the truck started up, I turned to wave to Sono. He was sitting on his garden
    wall, grinning at me. He called out: ‘We will go everywhere, and no one can stop
    us!’


    He was still waving when the truck took us round the end of the road.


    We drove through the still, quiet streets of Batavia, occasionally passing burnt-out
    trucks and shattered buildings. Then we left the sleeping city far behind and
    were climbing into the forested hills. It had rained during the night, and when
    the sun came up over the green hills, it twinkled and glittered on the broad,
    wet leaves. The light in the forest changed from dark green to greenish gold,
    broken here and there by the flaming red or orange of a trumpet-shaped blossom.
    It was impossible to know the names of all those fantastic plants! The road had
    been cut through a dense tropical forest, and on either side the trees jostled
    each other, hungry for the sun; but they were chained together by the liana creepers
    and vines that fed upon the struggling trees.


    Occasionally a jelarang, a large Javan squirrel, frightened by the passing of
    the truck, leapt through the trees before disappearing into the depths of the
    forest. We saw many birds: peacocks, junglefowl, and once, standing majestically
    at the side of the road, its great size and splendid crest making it a striking
    object even at a distance. Mr. Hookens slowed down so that we could look at the
    bird. It bowed his head so that its crest swept the ground; then it emitted a
    low hollow boom rather than the call of a turkey.


    When we came to a small clearing, we stopped for breakfast. Butterflies, black,
    green and gold, flitted across the clearing.


    # Escape from Java and Other Tales of Danger


    I was lost in thought on raid, and wondered what he would be doing at home: probably
    trying out the gramophone!


    We ate boiled eggs and drank tea from a thermos, then got back into the truck
    and resumed our journey.


    I must have dozed off soon after, because the next thing I remember is that we
    were going quite fast down a steep, winding road, and in the distance I could
    see a calm blue lagoon.


    ‘We’ve reached the sea again,’ I said.


    ‘That’s right,’ said my father. ‘But we’re now nearly a hundred miles from Batavia,
    in another part of the island. You’re looking out over the Sunda Straits.’


    Then he pointed towards a shimmering white object resting on the waters of the
    lagoon.


    ‘There’s our plane,’ he said.


    ‘A seaplane!’ I claimed. ‘I never guessed. Where will it take us?


    ‘To Bombay, I hope. There aren’t many other places left to go to!’


    It was a very old seaplane, and no one, not even the captain—the pilot was called
    the captain—could promise that it would take off. Mr. Hookens wasn’t coming with
    us; he said the plane would be back for him the next day. Besides my father and
    me, there were four other passengers, and all but one were Dutch. The old man
    was out a Londoner, a motor mechanic who’d been left behind in Java when his unit
    was evacuated. (He told us later that he’d fallen asleep at a bar in the Chinese
    quarter, waking up some hours after his regiment had moved off!) He looked rather
    scruffy. He’d lost the top button of his shirt, but instead of leaving his collar
    open, as we did, he’d kept it together with a large safety pin, which thrust itself
    out from behind a bright pink tie.


    ‘It’s a relief to find you here, governor,’ he said, shaking my father by the
    hand. ‘Knew you for a Yorkshireman the minute I set eyes on you. It’s the sangfroid
    that does it, if you know what I mean.’ (He meant sangfroid, French for a ‘cool
    look’). ‘And here I was, with all these flippin’ forrinners, and me not knowing
    a word of what they’ve yemtering about. Do you think this old tub will get us
    back to Blighty?’


    ‘It does look a bit shaky,’ said my father. ‘One of the first flying boats, from
    the looks of it. If it gets us to Bombay, that’s far enough.’


    ‘Anywhere out of Java’s good enough for me,’ said our new companion. ‘The name’s
    Muggeridge.’


    ‘Pleased to know you, Mr. Muggeridge,’ said my father. ‘I’m Bond. This is my son.’


    Mr. Muggeridge rumbled my hair and favoured me with a large wink.


    The captain of the seaplane was beckoning to us to join him in a small skiff which
    was about to take us across a short stretch of water to the seaplane.


    ‘Here we go,’ said Mr. Muggeridge. ‘Say your prayers and keep your fingers crossed.’


    The seaplane was a long time getting airborne. It had to make several runs before
    it finally took off. Then, lurching drunkenly, it rose into the clear blue sky.


    For a moment I thought we were going to end up in the briny. And ‘talkin’ of fish,
    said Mr. Muggeridge, untying his seat belt. I’d give a week’s wages for a plate
    of fish an’ chips and a pint of beer.’


    ‘I’ll buy you a beer in Bombay,’ said my father.


    ‘Have an egg,’ I said, remembering we still had boiled eggs in one of the travelling
    bags.


    ‘Thanks, mate,’ said Mr. Muggeridge, accepting an egg with alacrity. ‘A real egg,
    too! I’ve been on egg powder these last six months. That’s what they give you
    in the army. And it ain’t hens’ eggs they make it from, let me tell you. It’s
    either gulls or turtles.’


    # Escape from Java


    ‘No,’ said my father with a straight face.


    Mr. Muggeridge turned a delicate shade of green; but he soon recovered his poise,
    and for an hour kept talking about everything under the sun, including Churchill,
    Hitler, Roosevelt, Mahatma Gandhi, and Betty Grable. (The last-named was famous
    for her beautiful legs.) He would have gone talking the way to Bombay had he been
    given a chance, but suddenly a shudder passed through the plane, and it began
    lurching again.


    ‘I think an engine is giving trouble,’ said my father. When I looked through the
    small glassed window, it seemed as though the sea was rushing up to meet us.


    The co-pilot entered the passenger cabin and said something in Dutch. The passengers
    looked dismayed, and immediately began fastening their seat belts.


    ‘Well, what did the blighter say?’ asked Mr. Muggeridge.


    ‘I think he’s going to ditch the plane,’ said my father, who knew enough Dutch
    to get the gist of anything that was said.


    ‘Down in the drink!’ exclaimed Mr. Muggeridge.


    ‘Gawd ‘elp us! And how far are we from Bombay, guv?


    ‘A few hundred miles,’ said my father.


    ‘Can you swim, mate?’ asked Mr. Muggeridge looking at me.


    ‘Yes,’ I said. But not all the way to Bombay. How far can you swim?’


    ‘The length of a bathtub,’ he said.


    ‘Don’t worry,’ said my father. ‘Just make sure your life jacket’s properly tied.’


    We looked to our life jackets; my father checked mine twice, making sure that
    it was properly fastened.


    The pilot had now cut both engines, and it was bringing the plane down in a circling
    movement. But he couldn’t control the speed, and it was tilting heavily to one
    side. Instead of landing smoothly on its belly, it came down on a wing tip, and
    this caused the plane to swivel violently around in the choppy sea. There was
    a terrific jolt when the plane hit the water, and if it hadn’t been for the seat
    belts we’d have been flung from our seats. Even so, Mr. Muggeridge struck his
    head against the seat in front, and he was now holding a bleeding nose and using
    some shocking language.

