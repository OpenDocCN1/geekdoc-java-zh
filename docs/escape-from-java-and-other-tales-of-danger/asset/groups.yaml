    # 逃离 Java


    他只想看他想看的，即使那里空无一物！


    鲨鱼依然和我们待在一起。穆格里奇先生开始怨恨它们。他脱掉一只鞋，向最近的一条鲨鱼扔过去，但那条大鱼忽视了那只鞋，继续追着我们游去。


    “现在，穆格里奇先生，如果你的脚掉在那只鞋里，鲨鱼可能就会接受它，”我父亲观察道。


    “别把你们的鞋掉了，”船长说，“我们可能会在荒凉的海岸上岸，然后得走几百英里！”


    那天傍晚起了一阵微风，小艇在波光粼粼面上移动得更快了。


    “我们终于在向前走了，”船长说。


    “绕圈子，”穆格里奇先生说。


    但这阵风让人心旷神怡；它吹凉了我们灼热的肢体，帮助我们入睡。半夜时，我醒了，感到非常饥饿。


    “你还好吗？”父亲问我，他一直没有睡着。


    “只是饿了，”我说。


    “你想吃什么？”


    “橙子！”


    他笑了。“船上没有橙子。但我为你留了一块巧克力。如果你渴的话，还有一点水。”我把巧克力含在嘴里持续了很久，试图让它吃得久一点。然后我抿了一小口水。


    “你不饿吗？”我问他。

    “饿极了！我能吃掉整只火鸡。当我们到达孟买、马德拉斯或科伦坡，或者无论我们到达什么地方，我们都要去城里最好的餐厅，吃得像——像——”


    “像遭遇海难的水员一样！”我说。

    “没错。”

    “爸爸，你觉得我们能上岸吗？”

    “我确定我们可以的。你不害怕吧？”

    “不。只要你和我在一起我就不怕。”


    第二天早上，令大家高兴的是，我们看到了海鸥。这是陆地不远的可靠信号，但小艇漂过三十四十英里可能需要好几天时间。鸟儿在小艇上方喧闹地盘旋。它们的叫声是我们在三天三夜以来，除了风声、海声和我们疲惫的声音外，第一个熟悉的声音。


    鲨鱼消失了，这也是一个令人鼓舞的信号。它们不喜欢水面上出现的油膜。


    但很快它们离开了我们，我们担心自己正漂离陆地而去。


    “绕圈子，”穆格里奇先生重复道，“绕圈子。”

    我们有足够的食物和水可以在海上再待一周；但没有人想再考虑在海上再度过一周。


    太阳像一个火球。我们的饮用水配给不足以解渴。到中午时，我们已经没有多少希望或精力。


    我父亲嘴里叼着烟斗。他没有烟草，但他喜欢把烟斗夹在牙齿间。他说这能防止他的嘴巴太干。


    鲨鱼又回来了。


    穆格里奇先生脱下另一只鞋，向它们扔去。


    “真不像英国宜人的湿润夏天啊，”他嘟囔着。


    我在小艇的舱底处睡着了，父亲的大手巾盖在我的脸上。手巾上的黄色斑点似乎在变成巨大的旋转太阳。


    当我醒来时，我发现一个巨大的阴影笼罩在我们上方。起初我以为是一朵云。但那是移动的阴影。我父亲从我脸上拿走手巾说：“孩子，你可以醒了。我们很快就能回家上岸了。”


    一艘渔船在我们身边，阴影来自它宽大且飘动的帆。几位古铜色皮肤、微笑、闲聊的渔民——我们后来发现是缅甸人——正从他们的船板上俯视着我们。


    几天后，我和父亲在孟买。我父亲把他的稀有邮票卖了一千多卢卢比，我们……


