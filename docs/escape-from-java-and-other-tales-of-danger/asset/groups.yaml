    # A Flight of Pigeons

    (An Extract)


    The revolt broke out at Meerut on the 10th of May, at the beginning of a very
    hot and oppressive summer. The sepoys shot down their English officers; there
    was rioting and looting in the city; the jail was broken open and armed convicts
    descended on English families living in the city and cantonment, setting fire
    to houses and killing the inmates. Several mutinous regiments marched to Delhi,
    their principal rallying point, where the peaceful, poetry-loving Emperor Bahadur
    Shah suddenly found himself the figurehead of the revolt.


    The British Army, which had been cooling off in Shimla, began its long march to
    Delhi. But meanwhile, the conflict had spread to other cities. And on the 30th
    May there was much excitement in the magistrate’s office at Shahjahanpur, some
    250 miles east of Delhi.


    A bungalow in the cantonment, owned by the Redmans, an Anglo-Indian family, had
    been set on fire during the night. The Redmans had been able to escape, but most
    of their property was looted or destroyed. A familiar figure had been seen flitting
    around the grounds that night; and Javed Khan, a Rohilla Pathan, well known to
    everyone in the city, was arrested on suspicion of arson and brought before the
    magistrate.


    ***


    The burning of the Redmans’ bungalow failed to alert the small English community
    in Shahjahahanpur to a sense of danger. Meerut was far away, and the Moffusilite,
    the local news sheet, carried very little news of the disturbances. The army officers
    made their rounds without noticing anything unusual, and the civilians went to
    their offices. In the evening they met in the usual fashion, to eat and drink
    and dance.


    On the 30th of May it was Dr Bowling’s turn as host. In his drawing room, young
    Lieutenant Scott strummed a guitar, while Mrs Bowling sang a romantic ballad.
    Four army officers sat down to a game of whist, while Mrs Ricketts, Mr Jenkins,
    the Collector, and Captain James discussed the weather over a bottle of Exshaw’s
    whisky.


    Only the Labadors had any foreboding of trouble. They were not at the party.


    # A Flight of Pigeons


    Mr Labado was forty-two, his wife thirty-eight. Their daughter, Ruth, was a pretty
    girl, with raven black hair and dark, lustrous eyes. She had left Mrs Shield’s
    school at Fatehgarh only a fortnight before, because her mother felt she would
    be safer at home.


    Mrs Labadoor’s father had been a French adventurer who had served in the Maratha
    army; her mother came from a well-known Muslim family of Rampur. Her name was
    Mariam. She and her brothers had been brought up as Christians. At eighteen, she
    married Labadoor, a quiet, unassuming man, who was a clerk in the magistrate’s
    office. He was the grandson of a merchant from Jersey (in the Channel Islands),
    and his original Jersey name was Labadu.


    While most of the British wives in the cantonment thought it beneath their dignity
    to gossip with servants, Mariam Labadoor, who made few social calls, enjoyed these
    conversations of hers. Often they enened her day by reporting the juiciest scandals,
    on which they were always well informed. But from what Mariam had heard recently,
    she was convinced that it was only a matter of hours before rioting broke out
    in the city. News of the events at Meerut had reached the bazaars and sepoy lines,
    and a fakir, who lived near the River Khannaut, was said to have predicted the
    end of the English East India Company’s rule in the coming months. Mariam made
    her husband and daughter stay at home the evening of the Bowling’s party, and
    had even suggested that they avoid going to church the next day, Sunday: a surprising
    request from Mariam, a regular church-goer.


    Ruth liked having her way, and insisted on going to church the next day; and her
    father promised to accompany her.


    ***


    The sun rose in a cloudless, shimmering sky, and only those who had risen at dawn
    had been lucky enough to enjoy the cool breeze that had blown across the river
    for a brief spell. At seven o’clock the church bell began to toll, and people
    could be seen making their way towards the small, sturdily built cantonment church.
    Some, like Mr Labado and his daughter, were on foot, wearing their Sunday clothes.
    Others came in carriages, or were borne aloft in *dolies* manned by sweating *dolie-bearers*.


    St Mary’s, the little church in Shahjahanpur, was situated on the southern boundary
    of the cantonment, near an ancient mango grove. There were three entrances: one
    to the south, facing a large compound known as Buller’s; another to the west,
    below the steeple; and the vestry door opening to the north. A narrow staircase
    led up to the steeple. To the east there were open fields sloping down to the
    river, cultivated with melon; to the west lay an open plain bounded by the city;
    while the parade ground stretched away to the north until it reached the barracks
    of the sepoys. The bungalows scattered about the side of the parade ground belonged
    to the regimental officers, Englishmen who had slept soundly, quite unaware of
    an atmosphere charged with violence.


    I will let Ruth take up the story . .…


    # At the Church


    Father and I had just left the house when we saw several sepoys crossing the road,
    on their way to the river for their morning bath. They stared so fiercely at us
    that I pressed close to my father and whispered, ‘Papa, how strange they look!’
    But their appearance did not strike him as unusual: the sepoys usually passed
    that way when going to the River Khannaaut, and I suppose Father was used to meeting
    them on his way to office.


    We entered the church from the south porch, and took our seats in the last pew
    to the right. A number of people had already arrived, but I did not particularly
    notice who they were. We knelt down, and were in the middle of the Confession,
    when we heard a tumult outside and a lot of shouting that seemed nearer every
    moment. Everyone in the church got up, and Father left our pew and went and stood
    at the door, where I joined him.


    There were six or seven men on the porch. Their faces were covered up to their
    noses, and they wore loincloths as though they had prepared for a wrestling bout;
    but they held naked swords in their hands. As soon as they saw us, they sprang
    forward, and one of them made a cut at us. The sword missed us both and caught
    the side of the door where it buried itself in the wood. My father had his left
    hand against the door, and I rushed out from under it, and escaped into the church
    compound.


    A second and third cut were made at my father by the others, both of which caught
    him on his right cheek. Father tried to seize the sword of one of his assailants,
    but he caught high up on the blade, and so firmly that he lost two fingers from
    his right hand. These were the only cuts received; but though he did not fall,
