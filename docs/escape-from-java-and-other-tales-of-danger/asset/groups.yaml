    # Catching the Traîn


    And now a real engine, a steam engine belching smoke and fire, was on its way
    towards Sita.


    She stood with Vijay on the station platform along with over a hundred other people
    waiting for the Shahganj train.


    The platform was littered with the familiar bedrolls (or holdalls) without which
    few people in India ever travel. On these rolls sat women, children, great-aunts
    and great-uncles, grandfathers, grandmothers and grandchildren, while the more
    active adults hovered at the edge of the platform, ready to leap on to the train
    as soon as it arrived and reserve a space for the family. In India, people do
    not travel alone if they can help it. The whole family must be taken along—especially
    if the reason for the journey is a marriage, a pilgrimage, or simply a visit to
    friends or relations.


    Moving among the piles of bedding and luggage were coolies; vendors of magazines,
    sweetweets, tea and betel-leaf preparations; also stray dogs, stray'
