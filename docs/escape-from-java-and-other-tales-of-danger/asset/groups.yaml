    his back. That was all that mattered. There was no count.


    For a few moments Sher Dil had Phambiri almost helpless, but Phambiri wriggled
    out of a crushing grip, and using his legs once again, sent Sher Dil rocketing
    across the akhara. But Sher Dil landed on his belly, and even with Phambiri on
    top of him, it wasn’t victory.


    Nothing happened for several minutes, and the crowd became restless and shouted
    for more action. Phambiri thought of twisting his opponent’s ear but he realized
    that he might get disqualified for doing that, so he restrained his grip slightly,
    and this gave Sher Dil a chance to heave himself up and send Phambiri spinning
    across the akhara. Phambiri was still in a sitting position when the other took
    a flying leap at him. But Phambiri dived forward, taking his opponent between
    the legs, and then rising, flung him backwards with a resounding thud. Sher Dil
    was helpless, and Phambiri sat on his opponent’s chest to remove all doubts as
    to who was the winner. Only when the applause of the spectators told him that
    he had won did he rise and leave the ring.


    Accompanied by his proud father, Phambiri accepted the prize money, thirty rupees,
    and then went in search of a tap. After he had washed the oil and mud from his
    body, he put on fresh clothes. Then, putting his arms around Vijay and Sita, he
    said, ‘You have brought me luck, both of you. Now let us celebrate!’ And he led
    the way to the sweet shops.


    They ate syrup rasgullas (made from milk and sugar) and almond-filled fudge, and
    little pies filled with minced meat, and washed everything down with a fizzy orange
    drink.


    ‘Now I will buy each of you a small present,’ said Phambiri.


