    \ on the wall suddenly jumped up and disappeared in opposite directions.\n\nGrandmother\
    \ had read somewhere that animals sense the approach of an earthquake much quicker\
    \ than humans. And true enough, within half a minute of her noticing the noise\
    \ made by the animals, she heard a rattling, rumbling sound, like the approach\
    \ of an express train.\n\nThe noise increased for about a minute and then there\
    \ was the first trembling of the ground. The animals by this time all seemed to\
    \ have gone mad and were making a hideous noise. Treetops lashed backwards and\
    \ forwards, doors banged and windows shook, and Grandmother said later that the\
    \ house actually swayed in front of her. She had difficulty in standing straight,\
    \ although she admitted that this may have been due more to the trembling of her\
    \ knees than to the trembling of the ground.\n\nThis first shock lasted only about\
    \ half a minute, but it seemed much longer. I realized that Grandfather was in\
    \ his bath, that Rakesh was on his way to school, that Mukesh was playing marbles\
    \ with Mumtaz’s son, and that Dolly was under the staircase busy with her doll’s\
    \ house; Mumtaz would be in the kitchen washing vegetables. Grandmother rushed\
    \ indoors to fetch Dolly.\n\nAs she did so, the rumble grew louder. Grandfather\
    \ did not hear it because he was still singing; but Grandmother heard it, and\
    \ so did Dolly, who also noticed that her doll’s house was beginning to totter.\
    \ Along with the rumble, Mumtaz heard the rattle of crockery. A teapot slithered\
    \ off the sideboard and fell to the floor in pieces. In the sitting room, an antique\
    \ vase (three hundred years old, according to Grandfather), leapt off the mantelpiece\
    \ and crashed to the ground.\n\nWhen Dolly felt the first tremor, she instinctively\
    \ crawled under the well of the staircase, dragging her favourite doll with her.\
    \ All the doll’s hair had long since come out, and so had one eye, but Dolly had\
    \ had the doll a long time and felt she needed special care and attention. She\
    \ couldn’t understand why the house was shaking, but she wasn’t afraid. Houses\
    \ just shook sometimes, she supposed.\n\nGrandmother did not see her under the\
    \ staircase and dashed into the drawing room, calling, ‘Dolly, Dolly! Where are\
    \ you?’ The clocks on the wall went crazy and began striking all hours.\n\nIn\
    \ the kitchen, Mumtaz was trying to catch plates, glasses and dishes as they sprang\
    \ madly from the shelves. Mukesh had lost all his marbles, and not in a game with\
    \ his friends. They had rolled out of the gate and down the road and then disappeared\
    \ into the ground, where a number of fissures had appeared.\n\nGrandfather stopped\
    \ singing when he found he couldn’t manage the high notes. He noticed that his\
    \ bathtub was almost empty. Surely he hadn’t splashed so much! He reached for\
    \ the mug, but couldn’t find it. He started getting out of the tub, but the tub\
    \ itself rose up and pitched him out on the flooded bathroom floor.\n\n‘A ghost!’\
    \ exclaimed Grandfather. ‘There’s a mischievous ghost in here, playing tricks\
    \ with the tub!’\n\nHe grabbed his towel and wrapped it around his waist, then\
    \ flung open the bathroom door and dashed on to the landing.\n\nBy that time the\
    \ first earthquake tremor was over.\n\n***\n\nRakesh was halfway to school when\
    \ he found his cycle swerving about on the road, out of his control. He almost\
    \ collided with a bullock cart.\n\nHe dismounted to see if the cycle-chain had\
    \ jammed. He found the road as unsteady as the bicycle! But this sensation lasted\
    \ for just a few seconds. Everything was steady again. \n\nStrangely, though,\
    \ the bullocks were refusing to move.\n\n“Did you feel that?” asked the cart driver.\n\
    \n“Yes, everything was shaking,’ said Rakesh. ‘Was it an earthquake?”\n\n“A small\
    \ one,’ said the driver. ‘Or the start of a big one!’\n\nRakesh rode to school.\
    \ The bell had yet to ring for classes, and the field was a ferment of excitement,\
    \ as the assembled boys and girls stood around in groups talking about the shock\
    \ that had just been felt. The headmaster had decided that, just in case there\
    \ was another tremor, the children would be safer out in the open than in the\
    \ rather ancient school building; and so he delayed the ringing of the assembly\
    \ bell. Naturally the children were delighted at the delay. But when nothing further\
    \ happened after fifteen minutes, the headmaster decided it was time for school.\
    \ There were groans of protest, followed by calls for a holiday. Rakesh was the\
    \ spokesman for his class.\n\n‘Sir, you gave us a holiday last year when the roof\
    \ blew off!’\n\n‘But the roof has not blown off,’ observed the headmaster.\n\n\
    ‘What if the walls fall down, sir?’\n\n‘When the walls fall, we will think about\
    \ a holiday,’ snapped the headmaster. ‘Now into class all of you!’\n\n## Earthquake\
    \ Gossip\n\n‘Couldn’t have a proper bath,’ grumbled Grandfather. There wasn’t\
    \ enough water in the tub!\n\n‘Didn’t you feel it?’ asked Grandmother.\n\n‘Feel\
    \ what?’\n\nThe earthquake.\n\n‘Well, most of the crockery is broken, as well\
    \ as that tea set,’ said Grandmother.\n\nEscape from Java and Other Tales of Danger\n\
    \n‘I hadn’t noticed anything. Anyway, it’s time we left this house. It’s much\
    \ too big and costs too much to look after.’\n\nI suppose we can settle in Calcutta.\
    \ But you won’t enjoy living in a small flat. I was thinking of another hill station—where\
    \ they don’t have earthquakes. We could sell this place and buy or rent a cottage\
    \ in Darjeeling or Kalimpong.’\n\nThen pray we don’t have another,’ said grandfather.\
    \ ‘No one’s going to buy a ruin.’\n\nThey heard Mukesh shouting in the garden.\n\
    \n‘He’s up to some mischief as usual,’ grumbled Grandmother, going out to see\
    \ what all the noise was about.\n\nMukesh had found a nest and several broken\
    \ eggs on the lawn, and was shouting because he was being attacked by a pair of\
    \ thrushes.\n\n‘What did you do to that nest?’ demanded Grandmother.\n\n‘Nothing!’\
    \ said Mukesh. ‘It fell out of the trees when everything began to shake!’\n\n\
    ‘That must have what happened. But keep away from the nest, or those birds will\
    \ really go for you!’\n\nThe dog Pickle had been running about for whoever had\
    \ caused all the commotion. He and the neighbour’s dog began barking at each other,\
    \ though laying the blame at each other’s doorways.\n\n‘How dare you rock my house!’\
    \ they seemed to be saying. Eventually tiring of the argument, Pickle went into\
    \ the storeroom looking for rats. He was good at catching rats.\n\nIn the town\
    \ everyone was talking about the tremor that had just been felt. As there hadn’t\
    \ been any serious damage and nothing big had fallen down, it was all thought\
    \ to have been great fun. There were older people who remembered the earthquake\
    \ of thirty years ago, and who had lost friends, relatives and homes when hundreds\
    \ of houses had fallen down. They knew that a mild earthquake tremor was often\
    \ followed by a second, more severe shock—and they dreaded this possibility. There\
    \ was talk of the jail collapsing and the prisoners escaping; of the mighty Brahmaputra\
    \ river changing its course and flooding the whole of Assam, while crocodiles\
    \ invaded the towns and villages; of glaciers sliding down from the Himalayas;\
    \ and of the earth opening up and swallowing the whole of Shillong!\n\n‘End of\
    \ the world is near!’ proclaimed a holy man in the bazaar.\n\n‘Tell us, holy one,\
    \ what should we do about it?’ asked a shopkeeper.\n\n‘Purify yourself,’ said\
    \ the holy man. ‘Take care of your soul!’\n"
