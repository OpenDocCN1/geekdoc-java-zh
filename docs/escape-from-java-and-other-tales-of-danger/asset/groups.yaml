    many who spoke in terms of freedom for Java when the war was over.


    Our neighbour, Mr Hartono, was one of those who looked ahead to a time when Java,
    Sumatra and the other islands would make up one independent nation. He was a college
    professor and spoke Dutch, Chinese, Javanese and a little English. His son, Sono,
    was about my age. He was the only boy I knew could talk to me in English, and
    as a result we spent a lot of time together. Our favourite pastime was flying
    kites in the park.


    The bombing soon put an end to kite flying. Air raid alerts sounded at all hours
    of the day and night and, although in the beginning most of the bombs fell near
    the docks, a couple of miles from where we lived, we had to stay indoors. If the
    planes sounded very near, we dived under beds or tables. I don''t remember if
    there hadn''t been time for trench digging, and now there was time only for digging
    graves. Events had moved all too swiftly, and everyone (except, of course, the
    Javanese) was anxious to get away from Java.


    “When are you going?” asked Sono, as we sat on the veranda steps in a pause between
    air raids.'
