    ## Sita and the River


    across the railway lines. As the train came alongside the platform, doors opened,
    window shutters fell, eager faces appeared in the openings, and even before the
    train had come to a stop, people were trying to get in or out.


    For a few moments there was chaos. The crowd surged backwards and forwards. No
    one could get out. No one could get in! Fifty people were leaving the train, a
    hundred were catching it! No one wanted to give way. But every problem has a solution
    somewhere, provided one looks for it. And this particular problem was solved by
    a man climbing out of a window. Others followed his example. The pressure at the
    doors eased and people started squeezing into the compartments.


    Vijay stayed close to the Sikh who forged a way through the throng. The Sikh reached
    an open doorway and was through. Vijay and Sita were through! They found somewhere
    to sit and were then able to look down at the platform, into the whirlpool and
    enjoy themselves a little. The vendors had abandoned the people on the platform
    and had started selling their wares at the windows. Hukam Singh, after buying
    their tickets, had given Vijay and Sita a rupee to spend on the way. Vijay bought
    a freshly split coconut, and Sita bought a comb for her hair. She had never bothered
    with her hair before.


    They saw a worried man rushing along the platform searching for his family; but
    they were already in the compartment, having beaten him to it, and eagerly helped
    him in at the door. A whistle shrilled and they were off! A couple of vendors
    made last-minute transactions, then jumped from the slow-moving train. One man
    did this expertly with a tray of teacups balanced on one hand.


    The train gathered speed.


    ‘What will happen to all those people still on the platform?’ asked Sita anxiously.
    ‘Will they all be left behind?’


    She put her head out of the window and looked back at the receding platform. It
    was strangely empty. Only the vendors and the coolies and the stray dogs and the
    dishevelled railway staff were in evidence. A miracle had happened. No one—absolutely
    no one—had been left behind!


    Then the train was rushing through the night, the engine throwing out bright sparks
    that danced away like fireflies. Sometimes the train had to slow down, as flood
    water had weakened the embankments. Sometimes it stopped at brightly-lit stations.


    When the train started again and moved on into the dark countryside, Sita would
    stare through the glass of the window, at the bright lights of a town or the quiet
    glow of village lamps. She thought of Phambiri and Hukam Singh, and wondered if
    she would ever see them again. Already they were like people in a fairy tale,
    met briefly on the road and never seen again.


    There was no room in the compartment in which to lie down; but Sita soon fell
    asleep, her head resting against Vijay’s shoulder.


    ## A Meeting and a Parting


    Sita did not know where to look for her grandfather. For an hour she and Vijay
    wandered through the Shahganj bazaar, growing hungrier all the time. They had
    no money left and they were hot and thirsty.


    Outside the bazaar, near a small temple, they saw a tree in which several small
    boys were helping themselves to the sour, purple fruit.


    It did not take Vijay long to join the boys in the tree. They did not object to
    his joining them. It wasn’t their tree, anyway.


    Sita stood beneath the tree while Vijay threw the jamuns down to her. They soon
    had a small pile of the fruit. They were on the road again, their faces stained
    with purple juice.


    They were asking the way to the Shahganj hospital, when Sita caught a glimpse
    of her grandfather on the road.


    At first the old man did not recognize her. He was walking stiffly down the road,
    looking straight ahead, and would have walked right past the dusty, disheveled
    girl, had she not charged straight at his thin, shaky legs and clasped him round
    the waist.


    ‘Sita!’ he cried, when he had recovered his wind and his balance. ‘Why are you
    here? How did you get off the island? I have been very worried—it has been bad,
    these last two days…’


    ‘Is Grandmother all right?’ asked Sita.


    But even as she spoke, she knew that Grandmother was no longer with them. The
    dazed look in the old man’s eyes told her as much. She wanted to cry—not for Grandmother,
    who could suffer no more, but for Grandfather, who looked so helpless and bewildered.
    She did not want him to be unhappy. She forced back her tears and took his gnarled
    and trembling hand, and with Vijay walking beside her, led the old man down the
    crowded street.


    She knew, then, that it would be on her shoulder that Grandfather would lean in
    the years to come.


    They decided to remain in Shahganj for a couple of days, staying at a dharamsala—a
    wayside rest house—until the flood waters subsided. Grandfather still had two
    of the goats—it had not been necessary to sell more than one—but he did not want
    to take the risk of rowing a crowded boat across to the island. The river was
    still fast and dangerous.


    But Vijay could not stay with Sita any longer. ‘I must go now,’ he said. ‘My father
    and mother will be very worried and they will not know where to look for me. In
    a day or two the water will go down, and you will be able to go back to your home.’


    ‘Perhaps the island has gone forever,’ said Sita. ‘It will be there,’ said Vijay.
    ‘It is a rocky island. Bad for crops but good for a house!’


    ‘Will you come?’ asked Sita.


    What she really wanted to say was, ‘Will you come to see me?’ but she was too
    shy to say it; and besides, she wasn''t sure if Vijay would want to see her again.


    ‘I will come,’ said Vijay. ‘That is, if my father gets me another boat?’


    As he turned to go, he gave her flute.

    ‘Keep it for me,’ he said. ‘I will come for it one day.’ When he saw her hesitate,
    he smiled and said, ‘It is a good flute!’


    ## The Return


    There was more rain, but the worst was over, and when Grandfather and Sita returned
    to the island, the river was no longer in spate.


    Grandfather could hardly believe his eyes when he saw that the tree had disappeared—the
    tree that had seemed as permanent as the island, as much a part of his life as
    the river itself had been. He marvelled at Sita’s escape.


    ‘It was the tree that saved you,’ he said.

    ‘And the boy,’ said Sita.

    ‘Yes, and the boy.’


    She thought about Vijay and wondered if she would ever see him again. Would he,
    like Phambiri and Hukam Singh, be one of those people who arrived as though out
    of a fairy tale and then disappeared silently and mysteriously? She did not know
    it then, but some of the moving forces of our lives are meant to touch us briefly
    and go their way. . .


    And because Grandmother was no longer with them, life on the island was quite
    different. The evenings were sad and lonely.


    But there was a lot of work to be done, and Sita did not have much time to think
    of Grandmother or Vijay or the world she had glimpsed during her journey.


    For three nights they slept under a crude shelter made out of gunny bags. During
    the day, Sita helped Grandfather rebuild the mud hut. Once again they used the
    big rock for support.


    The trunk which Sita packed so carefully had not been swept off the island, but
    water had got into it and the food and clothing had been spoiled. But Grandfather’s
    hookah had been saved, and in the evenings, after work was done and they had eaten
    their light meal which Sita prepared, he would smoke with a little old contentment
    and tell Sita about other floods he had experienced as a boy. And he would tell
    her about the wrestling matches he had won, and the kites he had flown.


    ## Escape from Java and Other Tales of Danger


    Sita planted a mango seed in the same spot where the peep tree had stood. It would
    be many years before it grew into a big tree, but Sita liked to imagine herself
    sitting in the branches, picking the mangoes straight from the tree and feasting
    on them all day.


    Grandfather was more particular about making a vegetable garden, putting down
    peas, carrots, gram and mustard.


    One day, when most of the hard work had been done and the new hut was ready, Sita
    took the flute which had been given to her by Vijay, and walked down to the water''s
    edge and tried to play it. But all she could produce were a few broken notes,
    and even the goats paid no attention to her music.


    Sometimes Sita thought she saw a boat coming down the river, and she would run
    to meet it; but usually there was no boat, or if there was, it belonged to a stranger
    or to another fisherman. And so she stopped looking out for boats.


    Slow, the rains came to an end. The flood waters had receded, and in the villages
    people were beginning to till the land again and sow crops for the winter months.
    There were more cattle fairs and wrestling matches. The days were warm and sultry.
