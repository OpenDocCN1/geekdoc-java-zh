    # Sita and the River


    ‘If it keeps raining like this and the river keeps rising, it will reach the hut.’

    ‘I am afraid of the river, Mumta. Aren’t you afraid?’

    ‘Don’t be afraid. The river has always been good to us.’


    ‘What will we do if it comes into the hut?’

    ‘We will climb on the roof.’

    ‘And if it reaches the roof?’

    ‘We will climb the peepul tree. The river has never gone higher than the peepul
    tree.’


    As soon as the first light showed through the little skylight, Sita got up and
    went outside. It wasn’t raining hard, it was drizzling; but it was the sort of
    drizzle that could continue for days, and it probably meant that heavy rain was
    falling in the hills where the river began.


    Sita went down to the water’s edge. She couldn’t find her favourite rock, the
    one on which she often sat dangling her feet in the water, watching the little
    chilwa fish swim by. It was still there, no doubt, but the river had gone over
    it.


    She stood on the sand and she could feel the water oozing and bubbling beneath
    her feet.


    The river was no longer green and blue and flecked with white. It was a muddy
    colour.'
