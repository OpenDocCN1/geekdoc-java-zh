    He bought a bright blue sports shirt for Vijay. He bought a new hookah bowl for
    his father. And he took Sita to a stall where dolls were sold, and asked her to
    choose one.


    There were all kinds of dolls—cheap plastic dolls, and beautiful dolls made by
    hand, dressed in the traditional costumes of different regions of the country.
    Sita was immediately reminded of Mumta, her own rag doll, who had been made at
    home with Grandmother’s help. And she remembered Grandmother, and Grandmother’s
    sewing machine, and the home that had been swept away, and the tears started to
    her eyes.


    The dolls seemed to smile at her. The crowd was cheering and Sita and Vijay were
    cheering him too, but the wrestlers were too absorbed in their struggle to be
    aware of their supporters. Each sought to turn the other on to his back. That
    was all that mattered. There was no count.


