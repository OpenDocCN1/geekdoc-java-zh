    # Escape from Java


    can see what he wants to see, even if there’s nothing to be seen!’


    The sharks were still with us. Mr Muggeridge began to resent them. He took off
    one of his shoes and hurled it at the nearest shark, but the big fish ignored
    the shoe and swam after us.


    ‘Now, if your leg had been in that shoe, Mr Muggeridge, the shark might have accepted
    it,’ observed my father.


    ‘Don’t throw your shoes away,’ said the captain. ‘We might land on a deserted
    coastline and have to walk hundreds of miles!’


    A light breeze sprang up that evening, and the dinghy moved more swiftly on the
    choppy water.


    ‘At last we’re moving forward,’ said the captain. ‘In circles,’ said Mr Muggeridge.


    But the breeze was refreshing; it cooled our burning limbs, and helped us to get
    some sleep. In the middle of the night I woke up feeling very hungry.


    ‘Are you all right?’ asked my father, who had been awake all the time.


    ‘Just hungry,’ I said.


    ‘And what would you like to eat?’


    ‘Oranges!’


    He laughed. ‘No oranges on board. But I kept a piece of my chocolate for you.
    And there’s a little water, if you’re thirsty.’ I kept the chocolate in my mouth
    for a long time, trying to make it last. Then I sipped a little water.


    ‘Aren’t you hungry?’ I asked.

    ‘Ravenous! I could eat a whole turkey. When we get to Bombay or Madras or Colombo,
    or wherever it is we get to, we’ll go to the best restaurant in town and eat like—like—’


    ‘Like shipwrecked sailors!’ I said.

    ‘Exactly.’

    ‘Do you think we’ll ever get to land, Dad?’

    ‘I’m sure we will. You’re not afraid, are you?’

    ‘No. Not as long as you’re with me.’


    Next morning, to everyone’s delight, we saw seagulls. This was a sure sign that
    land couldn’t be far away, but a dinghy could take days to drift a distance of
    thirty or forty miles. The birds wheeled noisily above the dinghy. Their cries
    were the first familiar sounds we had heard for three days and three nights, apart
    from the wind and the sea and our own weary voices.


    The sharks had disappeared, and that too was an encouraging sign. They didn’t
    like the oil slicks that were appearing in the water.


    But presently they left us, and we feared we were drifting away from land.


    ‘Circles,’ repeated Mr Muggeridge. ‘Circles.’

    We had sufficient food and water for another week at sea; but no one wanted to
    think about spending another week at sea.


    The sun was a ball of fire. Our water ration wasn’t sufficient to quench our thirst.
    By noon, we were without much hope or energy.


    My father had his pipe in his mouth. He didn’t have any tobacco, but he liked
    holding the pipe between his teeth. He said it prevented his mouth from getting
    too dry.


    The sharks came back.


    Mr Muggeridge removed his other shoe and threw it at them.


    ‘Nothing like a lovely wet English summer,’ he mumbled.


    I fell asleep in the well of the dinghy, my father’s large handkerchief spread
    over my face. The yellow spots on the cloth seemed to grow into enormous revolving
    suns.


    When I woke up, I found a huge shadow hanging over us. At first I thought it was
    a cloud. But it was a shifting shadow. My father took the handkerchief from my
    face and said, ‘You can wake up now, lad. We’ll be home and dry soon.’


    A fishing boat was beside us, and the shadow came from its wide, flapping sail.
    A number of bronzed, smiling, chattering fishermen—Burmese, as we discovered later—were
    gazing down at us from the deck of their boat.


    A few days later my father and I were in Bombay. My father sold his rare stamps
    for over a thousand rupees, and we were able to live in a comfortable hotel. Mr
    Muggeridge was flown back to England. Later we got a postcard from him saying
    the English rain was awful!


    ‘And what about us?’ I asked. ‘Aren’t we going back to England?’


    ‘Not yet,’ said my father. ‘You’ll be going to a boarding school in Simla, until
    the war’s over.’


    ‘But why should I leave you?’ I asked.

    ‘Because I’ve joined the RAF,’ he said.


    ‘Don’t worry, I’m being posted to Delhi. I’ll be able to come up to see you sometimes.’


    A week later I was on a small train which went chugging up the steep mountain
    track to Simla. Several Indian, Anglo-Indian and English children tumbled around
    in the compartment. I felt quite out of place among them, as though had grown
    out of their pranks. But I wasn’t unhappy. I knew my father would be coming to
    see me soon. He’d promised me some books, a pair of roller skates, and a cricket
    bat, just as soon as he got his first month’s pay.


    Meanwhile, I had the jade sea horse which Sono had given me.


    And I have it with me today.


