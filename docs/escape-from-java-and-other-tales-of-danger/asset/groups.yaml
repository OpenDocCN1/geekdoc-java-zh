    # 逃离爪哇岛及其他危险故事


    飞镖盘。唯一的安慰是索诺，他不是陌生人，他会照顾他们的。


    在黎明微弱的光芒中，一辆卡车停在了房子前。司机是一个荷兰商人胡肯斯先生，他与我父亲一起工作。索诺已经站在门口了，等着向我们告别。


    “我送送你一个礼物，”他说。


    他拉住我的手，将一个光滑坚硬的物体按在我的掌心里。我握住它，对着光看了看。那是一漂亮的小海马，是用浅蓝色的玉石雕刻而。


    “它会带给你好运的，”索诺说。


    “谢谢你，”我说，“我会永远收藏它的。”


    我把那只小海马滑进了口袋。


    “上车吧，孩子，”我父亲说道，我坐在前座，坐在他和胡肯斯先生之间。


    当卡车启动时，我转过身向索诺挥手。他正坐在花园的墙上，冲我大笑。他喊道：“我们会去任何地方，没有任何人能挡住我们！”


    当卡车绕过道路尽头时，他仍在挥手。


    我们穿过巴达雅雅宁静的街道，途中偶尔会路过烧毁的卡车和破碎的建筑。然后，我们把沉睡的城市抛在身后，开始爬上森林覆盖的山丘。夜晚下过雨，当太阳从绿色的山丘上升起时，阳光在宽阔湿润的叶子上闪烁。森林里的光线从深绿色变成青金色，间或或被喇叭形状的火红色或橙色花朵打破。人们无法知道所有这些奇异植物的名字！道路穿过一片茂密的热带森林，两旁的树木互相推挤，渴望阳光；但它们被藤蔓和卷须缠绕在一起，这些藤蔓吸食着挣扎中的树木。


    偶尔，一只大爪子（爪哇松鼠被路过的卡车惊扰，跃过树林，消失在森林的深处。我们看到了许多鸟：孔雀、丛鸡，还有一次，一只鸟雄武地站在路边，它巨大的体型和华丽的羽冠让它即使在远处也引人注目。胡肯斯先生慢了车速，让我们能观察那只鸟。它低下头，让羽冠扫过地面；然后发出一声低沉空洞的轰鸣声，而不是火鸡的叫声。


    当我们来到一个小空地时，停下来吃早餐。黑色的、绿色的和金色的蝴蝶在空地上上穿梭。


    # 逃离爪哇岛及其他危险故事


    我在袭击中陷入了沉思，想他在家里会做什么：可能在尝试那台留声机！


    我们吃了煮蛋，从热水壶里喝茶，然后回到卡车上继续旅程。


    不久后我一定睡着了，因为我记得的下一件事就是我们正很快地沿着一条陡峭弯曲的道路向下行驶，远处我可以看到一片平静的蓝色湖。


    “我们又回到海边了，”我说。


    “没错，”我父亲说，“但我们现在离巴达雅雅近一百里，在岛的另一个地方。你俯瞰的是巽他海峡。”


    然后他指向湖面水面上一个闪烁的白色物体。


    “那是我们的飞机，”他说。


    “是一架水上飞机！”我惊呼道，“我从没猜到。它会带我们去哪里？


    “去孟买，我希望如此。没多少其他地方可以去了！”


    那是一架非常老旧的水上飞机，没有人——甚至机长——飞行员被称为机长——能保证它能起飞。胡肯斯先生没有和我们一起；他说飞机明天会接他。除了我父亲和我，还有四名乘客，除了一人外都是荷兰人。那个老头是个伦敦人，一个机修师，当他的部队撤离时被留在了爪哇岛。（他后来告诉我们，他在中国街的一家酒吧睡着了，在他的部队出发几小时后才醒来！）他看起来相当邋遢。他衬衫最上面的纽扣丢了，但他但他没有像我们那样敞开领口，而是用一个大别针把它固定在一起，别针从一条亮粉色的领带后面露出来。


    “在这里见到你真是松了口气，老兄，”他握着我父亲的手说，“我一看到你就知道你是约克郡人。这种镇定是关键，如果你懂我的意思的话。（指的是 sangfroid，法语，指“冷静的神情”）。“而我在这儿，面对这群该死的外乡人，我完全不知道他们在嘟囔什么。你觉得这台老铁能带我们回老伦敦吗？”


    “看起来确实有点不稳，”我父亲说，“看样子是第一批飞行艇之一。如果它能带我们去孟买，就足够了。”


    “离开爪洲岛的任何地方对我来说都可以，”我们的新伙伴说，“我叫 Muggeridge。”


    “很高兴认识你，Muggidge先生，”我父亲说，“我是邦德。这是我儿子。”


    Muggidge先生揉了揉我的头发，给了我一个大眨眼。


    水上飞机的机长向我们招手，让我们加入一艘小木舟，木舟正带我们穿过一段短水域到达水上飞机。


    “我们要走了，”Muggidge先生说，“祈祷吧，保好运气。”


    小木舟正带我们穿过一小段水域，到达那架水上飞机。


    “我们要走了，”Muggidge先生说，“祈祷吧，保好运气。”


    我们祈祷吧，保好稳了。


    水上飞机花了很久才起飞。然后，它摇摇晃晃地升入蓝天。


    “我们要走了，”Muggidge先生说，“祈祷吧，保好稳了。”


    小木舟正带我们穿过一小段水域，到达那架水上飞机。


    水上飞机花了很久才起飞。


    # 逃离爪哇岛


    “不，”我父亲面色严肃地说。


    Muggidge 的脸变成了一层淡淡的绿色；但他很快恢复了镇定。


    “我想发动机出问题了，”我父亲说。当我透过小窗户看时，海面似乎正向我们袭来。


    飞机突然剧烈震动。


    副驾驶进入客舱，用荷兰语说了什么。乘客们面露忧色，立即系上安全带。


    “喂，那家伙说了什么？”Muggidge 问道。


    “我想他是要让飞机迫水，”我父亲说，他有足够的荷兰语能听懂大概。


    “掉进水里了！”Muggidge 惊呼道。


    “上帝保佑！我们离孟买有多远，老兄？”


    “几百英里，”我父亲说。


    “你会游泳吗，哥们？”Muggidge 看着我问。


    “会，”我说。但去不了整个孟买。你能游多远？”


    “一个浴缸的长度，”他说。


    “别担心，”我父亲说，“确保你的救生衣系好。”


    我们检查了自己的救生衣；我父亲检查了我的两次，确保它系得牢固。


