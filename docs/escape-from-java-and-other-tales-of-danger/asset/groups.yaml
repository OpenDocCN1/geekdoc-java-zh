    ## Escape from Java and Other Tales of Danger


    fished in the river for ten years, and he was a good fisherman. He knew where
    to find the slim silver chilwa and the big, beautiful mahseer and the singhara
    with its long whiskers; he knew where the river was deep and where it was shallow;
    he knew which baits to use—when to use worms and when to use gram. He had taught
    his son to fish, but his son had gone to work in a factory in a city nearly a
    hundred miles away. He had no grandson but he had a granddaughter, Sita, and she
    could do all the things a boy could do and sometimes she could do them better.
    She had lost her mother when she was two or three. Grandmother had taught her
    all that a girl should know—cooking, sewing, grinding spices, cleaning the house,
    feeding the birds—and Grandfather had taught her other things, like taking a small
    boat across the river, cleaning a fish, repairing a net, or catching a snake by
    the tail! And some things she had learnt by herself—like climbing the peepul tree,
    or leaping from rock to rock in shallow water, or swimming in an inlet where the
    water was calm.


    Neither grandparent could read or write, and as a result Sita couldn''t read or
    write.


    There was a school in one of the villages across the river, but Sita had never
    seen it. She had never been further than Shahganj, the small market town near
    the river. She had never seen a city. She had never been in a train. The river
    cut her off from many things, but she could not miss what she had never known
    and, besides, she was much too busy.


    While Grandfather mended his net, Sita was inside the hut, pressing her grandmother’s
    forehead which was hot with fever. Grandmother had been ill for three days and
    could not eat. She had been ill before but she had never been so bad. Grandfather
    had brought her some sweet oranges but she couldn’t take anything else.


    She was younger than Grandfather but, because she was sick, she looked much older.
    She had never been very strong. She coughed a lot and sometimes she had difficulty
    in breathing.


    When Sita noticed that Grandmother was sleeping, she left the bedside and tiptoed
    out of the room on her bare feet.


    Outside, she found the sky dark with monsoon clouds. It had rained all night and,
    in a few hours, it would rain again. The monsoon rains had come early at the end
    of June. Now it was the end of July and already the river was swollen. Its rushing
    sounds seemed nearer and more menacing than usual.


    Sita went to her grandfather and sat down beside him.


    ‘When you are hungry, tell me,’ she said, ‘and I will make the bread.’


    ‘Is your grandmother asleep?’


    ‘Yes. But she will wake soon. The pain is deep.’


    The old man stared out across the river, at the dark green of the forest, and
    the leaden sky, and said, ‘If she is not better by morning, I will take her to
    the hospital in Shahganj. They will know how to make her well. You may be on your
    own for two or three days. But you have been on your own before.’


    Sita nodded gravely—she had been alone before; but not in the middle of the rains
    with the river so high. She knew that someone must stay behind. She wanted Grandmother
    to get well and she knew that only Grandfather could take the small boat across
    the river when the current was so strong.


    Sita was not afraid of being left alone, but she did not like the look of the
    river. That morning, when she had been fetching water, she had noticed that the
    level had suddenly disappeared.


    ‘Grandfather, if the river rises higher, what will I do?’


    ‘You must keep to the high ground.’


    ‘And if the water reaches the high ground?’


    ‘Then go into the hut and take the hens with you.’


    ‘And if the water comes into the hut?”


    ‘Then climb into the peepul tree. It is a strong tree. It will not fall. And the
    water cannot rise higher than the tree.’


    ‘And the goats, Grandfather?’


    ‘I will be taking them with me. I may have to sell them, to pay for good food
    and medicine for your grandmother. As for the hens, you can put them on the roof
    of the hut. But do not worry too much, if the water enters the hut,’ and he patted
    Sita’s head, ‘the water will not rise so high. Has it ever done so? I will be
    back soon, remember that.’


    ‘And won’t Grandmother come back?’


    ‘Yes—but they may keep her in the hospital for some time.’


    ## The Sound of the River


    That evening it began to rain again. Big pellets of rain, scarring the surface
    of the river. But it was warm rain and Sita could move about in it. She was not
    afraid of getting wet. She was used to it. In the previous month, she had found
    a scorpion and she liked it.


    ## Sita and the River


    She wondered how the frogs had come to the island. She disliked the black scorpions
    which flooded dwellings and tried to shelter in the hut. It was so easy to step
    on one and the sting could be very painful. She had been bitten by a scorpion
    the previous monsoon, and for a day and a night she had known fever and great
    pain. Sita had never killed creatures but now, whenever she found a scorpion,
    she crushed it with a rock! When, finally, she went indoors, she was hungry. She
    ate some parched gram and warmed up some goat’s milk. Grandmother woke once and
    asked for water, and Grandmother held the brass tumbler to her lips. It rained
    all night. The roof was leaking and a small puddle formed on the floor. Grandfather
    kept the kerosene lamps alight. They did not need the light but somehow it made
    them feel safer. The sound of the river had always been with them, although they
    seldom noticed it. But that night they noticed a change in its sound. There was
    something like a moan, like a wind in the tops of tall trees, and a swift hiss
    as the water swept round the rocks and carried away pebbles. And sometimes there
    was a rumble as loose earth fell into the water.

