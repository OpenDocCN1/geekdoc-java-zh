    When the train started again and moved on into the dark countryside, Sita would
    stare through the glass of the window, at the bright lights of a town or the quiet
    glow of village lamps. She thought of Phambiri and Hukam Singh, and wondered if
    she would ever see them again. Already they were like people in a fairy tale,
    met briefly on the road and never seen again.


    There was no room in the compartment in which to lie down; but Sita soon fell
    asleep, her head resting against Vijay’s shoulder.


    # A Meeting and a Parting


    Sita did not know where to look for her grandfather. For an hour she and Vijay
    wandered through the Shahganj bazaar, growing hungrier all the time. They had
    no money left and they were hot and thirsty.


    Outside the bazaar, near a small temple, they saw a tree in which several small
    boys were helping themselves to the sour, purple fruit.'
