    \nOutput:\n\n5 is the Thread priority, and Thread Running is the text which is\
    \ the output of our code.\n\n# Java Thread Synchronization\n\nIn multithreading,\
    \ there is the asynchronous behavior of the programs. If one thread is writing\
    \ some data and another thread is reading data at the same time, might create\
    \ inconsistency in the application.\n\nWhen there is a need to access the shared\
    \ resources by two or more threads, then synchronization approach is utilized.\n\
    \nJava has provided synchronized methods to implement synchronized behavior.\n\
    \nIn this approach, once the thread reaches inside the synchronized block, then\
    \ no other thread can call that method on the same object. All threads have to\
    \ wait till that thread finishes the synchronized block and comes out of.\n\n\
    In this way, the synchronization helps in a multithreaded application. One thread\
    \ has to wait till other thread finishes its execution only then the other threads\
    \ are allowed for execution. \n\nIt can be written in the following form:\n\n\
    ```\nSynchronized(object)\n{\n  //Block of statements to be synchronized\n}\n\
    ```"
