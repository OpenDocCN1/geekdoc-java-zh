  md: 'finally lowest level as the Machine Language.

    A compiler is a program that converts a program from one level of language to
    another.

    Example conversion of C++ program into machine code.


    The java compiler is a convert''s high level java code into bytecode (which is
    also a type of machine code).


    A interpreter is a program that converts a program at one level to another programming
    language at the same level. Example conversion of Java program into C++

    in Java , the Just In Time Code generator converts the bytecode into the native
    machine code which are at the same programming levels.


    Hence java is both compiled as well as interpreted language.

    Why is Java slow?


    The two main reasons behind the slowness of Java are

    Dynamic Linking = Unlike C, linking is done at run-time , every time the program
    is run in Java.


    Run-time Interpreter = The conversion of byte code into native machine code is
    done at run-time in Java which further slows down the speed

    However, the latest version of Java have addressed the performance bottlenecks
    to a great extent.


    Summary:

    JVM or Java Virtual Machine is the engine that drives the Java Code. It converts
    Java bytecode into machines language.


    In JVM, Java code is compiled to bytecode. This bytecode gets interpreted on different
    machines

    JIT or Just-in-time compiler is the part of the Java Virtual Machine (JVM). It
    is used to speed up the execution time

    in comparison to other compiler machine, Java may be slow in execution.


