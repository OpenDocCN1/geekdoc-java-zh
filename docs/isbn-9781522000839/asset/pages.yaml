    # # String CompareTo Method


    I want to check if the String that was generated by some method is equal to something
    that I want to verify with? How do I compare Strings?


    Use the method "compareTo" and specify the String that you would like to compare.


    Use "compareToIgnoreCase" in case you don''t want the result to be case sensitive.


    The result will have the value 0 if the argument string is equal to this; a value
    less than 0 if this string is lexicographically less than the string argument;
    and a value greater than 0 if this string is lexicographically greater than the
    string argument.


    ```

    public class Sample_String{

    public static void main(String[] args){//Compare to a String

    String str_Sample = "RockStar";

    System.out.println("Compare To ''ROCKSTAR'': " + str_Sample.compareTo("rockstar"));

    //Compare to - Ignore case

    System.out.println("Compare To ''ROCKSTAR'': " + str_Sample.compareToIgnoreCase("ROCKSTAR"));\}}

    ```


