  md: '# # What is Abstraction in OOP?


    Suppose you want to create a banking application and you are asked to collect
    all the information about your customer? There are chances that you will come
    up with many information related to a customer, but many of them are not required
    at least for a banking application.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_19_0.png)


    So, you need to sort out the relevant information for your banking application
    from that pool of database like name, address, tax information, etc. Since we
    have fetched or sorted out the customer information from the largest Pool- hence
    the process is referred as Abstraction.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_19_1.png)


    But the same information once extracted can be used for a wide range of applications.
    For instance, you can use the same data for hospital application, job portal application,
    Government database, etc.


    # ## Points to Remember about Java Abstraction:


    +   - Abstraction is the process of selecting important data sets for an Object
    in your software , and leaving out the insignificant ones.'
