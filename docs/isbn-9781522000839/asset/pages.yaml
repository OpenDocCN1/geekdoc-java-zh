  md: '+   1. The normal code goes into TRY block.

    2. The exception handling code goes into the CATCH block


    ![](img/6f6cf42a75b6996d40290c9064bc348f_101_0.png)


    In our example, TRY block will contain the code to connect to the server. CATCH
    block will contain the code to connect to the backup server.


    In case the server is up, the code in the CATCH block will be ignored. In case
    the server is down, an exception is raised, and the code in catch catch block
    will be executed.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_101_1.png)


    So, this is how the exception is handled in Java.


    A Summary of the points covered in the above demonstration –


    +   1. An Exception is a run-time error which interrupts the normal flow of program
    execution.'
