    # # What is JVM?


    JVM stands for Java Virtual Machine. It is the engine that drives the Java Code.
    It converts Java bytecode into machines language.

    In other programming language, the compiler produces code for a particular system.
    But Java compiler produces code for a Virtual Machine.

    In JVM, Java code is compiled into bytecode. This bytecode gets interpreted on
    different machines

    Between host system and Java source, Bytecode is an intermediary language. JVM
    is responsible for allocating a memory space.


    | Class Loader | Byte Code Verifier | Execution Engine |


    Why is Java both interpreted and compiled language?

    Programming languages are classifies as

    Higher Level Language Ex. C++, Java

    Middle Level Languages Ex. C

    Low Level Language Ex Assembly'
