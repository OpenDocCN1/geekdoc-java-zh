    4. Waiting

    5. Dead


    +   1. **New**: In this phase, the thread is created using class "Thread class".It
    remains in this state till the program startsthe thread. It is also known as born
    thread.


    +   2. **Runnable**: In this page, the instance of the thread is invoked with
    a start method. The thread control is given to scheduler to finish the execution.
    It depends on the scheduler, whether to run the thread.


    +   3. **Running**: When the thread starts executing then the state is changed
    to "running" state. The scheduler selects one thread from the thread pool, and
    it starts executing in the application.


    +   4. **Waiting**: This is the state when a thread has to wait. As there are
    multiple threads running in the application, there is a need for synchronization
    between threads. Hence, one thread has to wait, till the other thread get executed.
    Therefore, this state is referred as waiting state.


    +   5. **Dead**: This is the state when the thread is terminated. The thread is
    in running state and as soon as it completed processing it is in "dead state".


    Some of commonly used methods for threads:


    +   1. start()


    This method starts the execution of the thread and JVM calls the run() method
    on the thread.


    We will cover this in the below example.


    +   2. Sleep(int milliseconds)


    This method makes the thread sleep hence the thread''s execution will pause for
    milliseconds provided and after that, again the thread starts executing. This
    help in synchronization of the threads.


    +   3. getName()


    It returns the name of the thread.


    +   4. setPriority(int newpriority)


    It changes the priority of the thread.


    +   5. yield ()


    It causes current thread on halt and other threads to execute.'
