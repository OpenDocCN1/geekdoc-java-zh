  md: '# How to handle exception


    So far we have seen what exception is.


    But blaming your code failure on environmental issues is not a solution. You need
    a Robust Programming, which takes care of exceptional situations. Such code is
    known as Exception Handler.


    In our example, good exception handling would be, when the server is down connect
    to the backup server.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_100_0.png)


    To implement this, enter your code to connect to the server (Using traditional
    if and else conditions).


    You will check if the server is down.


    If yes write the code to connect to the backup server.


    Such organization of code, using "if" and "else" loop is not effective when your
    code has multiple java exceptions to handle.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_100_1.png)


    Hence, Java provides an inbuilt exceptional handling.'
