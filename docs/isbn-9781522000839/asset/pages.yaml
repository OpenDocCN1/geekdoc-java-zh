    How about recollecting some basic concept of computing?


    # What is PC?


    A computer is an electronic device capable of performing computations, and we
    all know that it composed of a monitor, keyboard, mouse and memory to store information.
    But the most important component of the computer is a PROCESSOR. Which does all
    thinking of computer, but the question is how the computer does this thinking?
    How does it understand text, images, videos, etc.?


    # A COMPUTER IS AN ELECTRONIC DEVICE CAPABLE OF PERFORMING COMPUTATIONS


    The computer is an electronic device, and it can only understand electronic signals
    or binary signals. For example, the 5-volt electronic signal may represent binary
    number 1 while 0 volts may represent binary number 0. So your PC is continuously
    bombarded with these signals.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_4_0.png)


    Eight bits of such signals are group together to interpret Text, numerical and
    symbols.'
