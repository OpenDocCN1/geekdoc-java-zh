    # How "Garbage Collection" Works in Java?


    # What is Garbage Collection


    In the Java programming language, dynamic allocation of objects is achieved using
    the new operator. An object once created uses some memory and the memory remains
    till there are references for the use of the object.


    When there are no references for an object, it is assumed to be no longer needed
    and the memory occupied by the object can be reclaimed. There is no explicit need
    to destroy an object as java handles the de-allocation automatically.


    The technique that accomplishes this is known as Garbage Collection. Programs
    that do not deallocate memory can eventually crash when there is no memory left
    in the system to allocate. Programs are said to have memory leaks'
