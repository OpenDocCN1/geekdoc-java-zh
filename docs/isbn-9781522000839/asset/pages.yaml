    ![](img/6f6cf42a75b6996d40290c9064bc348f_5_1.png)


    This is known as 8-bit computing. Current day processor is capable of 64 bit time.
    But what is the relation of this concept with the programming language JAVA. Let
    us understand these with an example.


    Suppose if you want to tell the computer to add two number (1+2) which is represented
    by some binary numbers (10000011), how are you going to tell the computer? Yes,
    we going to use assembly language to get our code executed.


    "Assembly Language is the most elementary form of software development languages."


    We are going to give the command to a computer in this format as shown below.
    Your code to add two numbers in this language would be in this order.


    # ASSEMBLY LANGUAGE


    +   - STORE 1 AT MEMORY LOCATION SAY A

    - STORE 2 AT MEMORY LOCATION SAY B

    - ADD CONTENTS OF LOCATION A & B

    - STORE RESULT'
