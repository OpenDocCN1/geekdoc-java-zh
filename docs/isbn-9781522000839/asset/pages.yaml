  md: '# Dynamic Polymorphism Java


    A reference variable of the super class can refer to a sub class object - Surgeon


    Doctor obj = new Surgeon();


    Consider the statement


    obj.treatPatient();

    Here the reference variable "obj" is of the parent class , but the object it is
    poiting to is of the child class (as as show in diagram).


    obj.treatPatient() will execute treatPatient() method of the sub-class - Surgeon


    If a base class reference is used to call a method, the method to be invoked is
    decided by the JVM, depending on the object the reference is pointing to


    For example, even though obj is a reference to Doctor, it calls the method of
    Surgeon, as it points to a Surgeon object


    This is decided during run-time and hence DYNAMIC or RUN-TIME POLYMORPHISM


