  md: 'As we discussed earlier, if a data member is declared "private", then it can
    only be accessed within the same class. No outside class can access data member
    (variable) of other class.


    +   However if you need to access these variables, you have to use public "getter"
    and "setter" methods.


    +   Setup public "getter" and "setter" method to update and read the private data
    field. This will allow data access from private class.


    Frequently, java encapsulation is referred for data hiding. But more than data
    hiding, encapsulation concept is meant for better management or grouping of related
    data.


    To achieve a lesser degree of encapsulation in Java you can use modifiers like
    "protected" or "public". With encapsulation, developers can change one part of
    the code easily without affecting other.


    Often encapsulation is misunderstood with Abstraction. To get clear on this,


    +   Encapsulation is more about "How" to achieve that functionality


    +   Abstraction is more about "what" a class can do.


    A simple example to understand this difference is a mobile phone. Where the complex
    logic in the circuit board is encapsulated in a touch screen, and the interface
    is provided to abstract it.


    # Java Inheritance & Polymorphism


    In the previous tutorial, we learned one of the three OOP concepts. i.e Java –
    Encapsulation.


    In this tutorial, we will learn the remaining two OOP concept Inheritance in java
    and Polymorphism in java.


    Before we go deep into what, we first get an overview of it.


    +   What is Inheritance? - When a "class" acquires the property of another class
    it is known as Inheritance. For example, a child inherits the traits of parents.


    +   What is Polymorphism? While Polymorphism means one name but many forms. For
    example, you have a smartphone for communication. The communication mode you could
    choose be anything. It can be a call, a text msg, a picture msg, mail, etc. So
    the goal is common that is communication, but their approach is different. This
    is called Polymorphism.'
