    But how are we going to do this? Back in 1950''s when computers were huge and
    consumed great deal of power, you would convert your assembly code into corresponding
    machine code to 1 and O''s mapping sheets. Later this code would be punched into
    the machine cards and feed to the computer. The computer will read this code and
    execute the program. This would be a long process then until ASSEMBLER came to
    help.


    # What are Assembler and Compiler?


    With the advancement of technology i/o devices were invented you could directly
    type your program into the PC using a program called ASSEMBLER. It converts it
    into corresponding machine code (110001..) and feed to your processor. So coming
    back to our example addition of (1+2), the assembler will convert this code into
    machine code and give the output.


    +   1) Store 1,Location A

    2) Store 2,Location B

    3) Add Location A, Location B

    4) Store Results


    ![](img/6f6cf42a75b6996d40290c9064bc348f_6_0.png)


    That apart, you will also have to make calls to create Operating System provided
    functions to display the output of the code.


    But alone assembler is not involved in this whole process, it also requires the
    compiler to compile the long code into a small chunk of codes. With advancement
    in software development languages, this entire assembly code could shrink into
    just one line f 1+2 A with the help of software called COMPILER. It is used to
    convert your c language code into assembly code, and the assembler converts it
    into corresponding machine code, and this machine code will be transmitted to
    the processor. The most common processor used in Or Computers are Intel processor.


    +   1) Store 1,Location A

    2) Store 2,Location B

    3) Add Location A, Location B

    4) Store Results

    5) O.S. Calls


