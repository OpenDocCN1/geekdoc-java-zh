    \        SimpleDateFormat objSDF = new SimpleDateFormat(strDateFormat);//Date\
    \ format string is passed as an argument to the\nDate object\n        System.out.println(objSDF.format(objDate));//Date\
    \ formatting is applied to the current date\n    }\n}\n```\n\n## Comparison of\
    \ Dates\n\nThe most useful method of comparing dates is by using the method –\
    \ compareTo()\n\nLet us take a look at the below code snippet-\n\n```\nimport\
