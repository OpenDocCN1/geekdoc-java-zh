    \ 实例线程的 `start` 方法。这里线程将开始执行。\n\n**代码第 13 行**：在这里我们使用 `guruthread1` 实例线程的 `sleep`\
    \ 方法。因此，线程将睡眠 1000 毫秒。\n\n**代码第 12-17 行**：我们将 `sleep` 方法放在 `catch` 块中，因为会发生一个受检查的异常，即\
    \ `InterruptedException`。\n\n"
