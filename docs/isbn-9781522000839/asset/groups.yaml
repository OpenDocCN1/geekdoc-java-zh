    Step 2) Using the java compiler the code is converted into an intermediate code
    the bytecode. The output is a .class file.


    Step 3) This code is not understood by any platform, but only a virtual platform
    called the Java Virtual Machine


    Step 4) This Virtual Machine resides in the RAM of your operating system. When
    the Virtual Machine is fed with this bytecode, it identifies the platform it is
    working on and converts the bytecode into the native machine code


    In fact, while working on your PC or browsing the web whenever you see either
    of icons are assured the java virtual machine loaded in your RAM. But what makes
    java lucrative is that code once compiled can run not only on all PC platforms
    but also mobiles or other electronic gadgets supporting java


    Hence, java is a language as well as a platform (JVM)


    In order to write and execute a software program you need the following


    +   1) Editor – To type your program into, a notepad could be used for this

    2) Compiler – To convert your high language program into native machine code

    3) Linker – To combine different program files reference in your main program
    together.


