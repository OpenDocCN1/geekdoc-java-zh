    \n步骤 5) 错误 = ? 变量 b 是 final 的。\n\n## Java 继承概念与 Java 多态\n\n在开始本节之前，我们建议您复习我们之前关于继承与多态的教程。\n\
    \n## Java 中的继承\n\n- 当两个类之间存在“是”（Is-A）关系时，我们使用继承。\n- 父类称为超类（super class），被继承的类称为子类（sub\
    \ class）。\n- 子类使用 `extends` 关键字来继承超类的特征。\n- 继承很重要，因为它导致了代码的可重用性。\n\n## Java 继承示例\n\
    \n```java\nclass Doctor{\n  // Doctor 类的实例变量和方法\n}\n\nclass Surgeon extends Doctor{\n\
    \  // 继承 doctor 类的实例变量和方法\n  // 可能有自己的变量和方法。\n}\n```\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_73_0.png)\n\
    \n## 方法重写\n\n在子类中重新定义超类的方法称为方法重写（method overriding）。\n\n方法重写的规则是：方法名、参数列表和返回类型必须完全匹配。\n\
    \n- 被重写的方法可以扩大访问范围，但不能缩小它。例如，如果它在基类中是 `private`，则子类可以将其变为 `public`，但反之不行。\n\n\
    示例\n\n```java\nDoctor doctorObj = new Doctor();\ndoctorObj.treatPatient();\n//\
    \ 将执行 Doctor 类中的\n// treatPatient 方法\nSurgeon surgeonObj = new Surgeon();\nsurgeonObj.treatPatient();\n\
    // 将执行 Surgeon 类中的\n// treatPatient 方法\n```\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_74_0.png)\n\
    \n## Java 动态多态\n\n超类的引用变量可以指向子类对象 - `Surgeon`\n\n```java\nDoctor obj = new Surgeon();\n\
    ```\n\n考虑语句\n\n`obj.treatPatient();`\n\n在这里，引用变量 \"obj\" 是父类类型，但它指向的对象是子类类型（如所示所示）。\n\
    \n`obj.treatPatient()` 将执行子类 - `Surgeon` 的 `treatPatient()` 方法。\n\n如果使用基类引用调用方法，则要调用的方法由\
    \ JVM 决定，取决于该引用所指向的对象。\n\n例如，尽管 `obj` 是 `Doctor` 的引用，但它调用的是 `Surgeon` 的方法，因为它指向一个\
    \ `Surgeon` 对象。\n\n这是在运行时决定的，因此是动态或运行时多态（DYNAMIC or RUN-TIME POLYMORPHISM**）。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_75_0.png)\n\n## Super\n\n如果 `Surgeon`\
    \ 类中的 `treatPatient` 方法想要执行 `Doctor` 类定义的功能，然后再执行它自己的特定功能怎么办？\n\n在这种情况下，可以使用 `super`\
    \ 关键字从子类访问父类的方法。\n\n`Surgeon` 类中的 `treatPatient` 方法可以写为：\n\n```java\ntreatPatient(){\n\
    \  super.treatPatient();\n  // 添加特定于 Surgeon 的\n}\n```\n\n`super` 关键字可以用于在子类中访问超类的任何数据成员或方法。\n\
    \n作业:-学习继承、多态和 `super` 关键字\n\n步骤 1) 将以下代码复制到编辑器中\n\n```java\npublic class Test{\n\
