    # Why use Strings ?


    One of the primary functions of modern computer science, is processing human language

    Similarly to how numbers are important to math, language symbols are important
    to meaning and decision making. Although it may not be visible to computer users,
    computers process language in the background as precisely and accurately as a
    calculator. Help dialogs provide instructions. Menus provide choices. And data
    displays show statuses, errors, and real-time changes with language.


    As a Java programmer, one of your main tools for storing and processing language
    is going to be the String class.


