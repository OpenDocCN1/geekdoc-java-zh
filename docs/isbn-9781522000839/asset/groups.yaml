    | G | y | M | d |\n|---|---|---|---|\n| h | H | m | s |\n| S | E | D | F |\n|\
    \ w | W | a | k |\n| K | z | | \" ' |\n\nDon't worry, you don't need to remember\
    \ all of these, they can be referred anytime you need to format a particular date.\n\
    \n## How Dates Formats can be used?\n\nJava provides a class called SimpleDateFormat\
    \ that allows you to format and parse dates in the as per your requirements.\n\
    \nYou can use the above characters to specify the format- For example:\n\n- 1.\
    \ Date format required: 2012.10.23 20:20:45 PST\n\nThe appropriate date format\
    \ specified will be- yyyy.MM.dd HH:mm:ss zzz 2\n\n- 2. Date format required: 09:30:00\
    \ AM 23-May-2012\n\nThe appropriate date format specified will be- hh:mm:ss a\
    \ dd-MMM-yyyy\n\nTip: Be careful with the letter capitalization. If you mistake\
    \ M with m, you will undesired results!\n\nLets learn with this code example\n\
    \n```\nimport java.text.SimpleDateFormat;\nimport java.util.Date;\nclass TestDates_Format\
    \ {\n    public static void main(String[] args[]) {\n        Date objDate = new\
