    \n```java\nclass Account{\n    private int account_number;\n    private int account_balance;\n\
    \n    public void showData(){\n        // code to show data\n    }\n\n    public\
    \ void deposit(int a) {\n}\n```\n\n如果数据成员是私有的，意味着它只能在同一个类内部访问。类外部无法访问其他类的私有数据成员或变量。\n\
    \n所以在这我们的案例中，黑客无法向你的账户存入 -100。\n\n```java\nclass Hacker {\n  Account a= new Account();\n\
    \  a.account_balance= -100;\n}\n```\n\n方法 2：黑客的第一种方法未能存入金额。接下来，他尝试使用“deposit”方法执行相同的操作。为了执行此操作，他使用了“deposit”方法。\n\
    \n```java\nclass Hacker {\n  Account a= new Account();\n  a.account_balance= -100;\n\
    \  a.deposit(-100);\n}\n```\n\n但方法的实现中有对负值的检查。因此，第二种方法也未能向你的账户存入金额 -100。\n\n```java\n\
    public void deposit(int a) {\n    int ac=0;\n    //show error\n    if (a < 0)\
    \ {\n        // handle error\n    } else {\n        account_balance += a;\n  \
    \  }\n}\n// method implementation has checked for negative values (-100) and throws\
    \ an error\n```\n\n因此，你永远不会将数据暴露给外部实体。这使得你的应用程序是安全的。\n\n```java\nclass Account\
    \ {\n    private int account_number;\n    private int account_balance;\n\n   \
    \ public void showData() {\n        // code to show data\n    }\n\n    public\
    \ void deposit(int a) {\n        int ac=0;\n        if (a < 0) {\n           \
    \ //show error\n        } else {\n            account_balance += a;\n        }\n\
    \    }\n}\n```\n\n> 整个代码可以被视为胶囊，你只能通过消息进行通信。\n\n整个代码可以被看作胶囊，你只能通过消息进行通信。因此得名封装。\n\
    \n关于 Java 封装的几点说明：\n\n- 在 Java 中，封装是将数据与其相关的功能绑定。\n- 这里，功能意味着“方法”，数据意味着“变量”。\n\
    - 所以我们将变量和方法放在一个地方。那个地方是“类”。\n- “类”是封装的基础。\n- 通过 Java 封装，你可以隐藏（限制访问）代码中的关键数据成员，这提高了安全性。\n\
    \n正如我们之前讨论的，如果一个数据成员被声明为私有，那么它只能在同一个类中访问。类外部无法访问其他类的私有数据成员。\n\n- 然而，如果你需要访问这些变量，你必须使用公开的\
    \ getter 和 setter 方法。通常，Java 封装被称为数据隐藏。但除了数据隐藏，封装的概念是为了更好地管理或分组。为了在 Java 中实现较低程度的封装，可以使用\
    \ protected 或 public 修饰符。\n\n- 封装更多是关于“如何做”\n- 抽象更多是关于类能“做什么”\n\n## 继承与多态\n\n\
