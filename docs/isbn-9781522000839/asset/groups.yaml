    # ### Java Exception class Hierarchy


    After one catch statement executes, the others are bypassed, and execution continues
    after the try/catch block.The nested catch blocks follow Exception hierarchy.


    ![](img/6f6cf42a75b6996d40290c9064bc348f_105_0.png)


    # ### Exception Hierarchy


    +   * All exception classes in java extends the class ‘Throwable’. ‘Throwable’
    has two sub classes, Error and Exception

    * The Error class defines the exception or the problems that are not expected
    to be under normal circumstances by our program, example Memory error, Hardware
    error , JVM error etc

    * The Exception class represents the exceptions that can be handled by our program
