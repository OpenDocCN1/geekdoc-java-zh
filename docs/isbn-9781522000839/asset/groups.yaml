    the behavior of the class. When you send a message to an object, you are asking
    the object to invoke or execute one of its methods.


    From a programming point of view, an object can be a data structure, a variable
    or a function. It has a memory location allocated. The object is designed as class
    hierarchies.


    # What is the difference between Object & class?


    A class is a blueprint or prototype that defines the variables and the methods
    (functions) common to all objects of a certain kind.


    An object is a specimen of a class. Software objects are often used to model real-world
    objects you find in everyday life.


