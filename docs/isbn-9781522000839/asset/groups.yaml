- md: "\n- The date (it will be the actual date of the month).\n- The day (the day\
    \ at the given date – like Sun, Mon, Tue etc).\n\nIn terms of computer systems,\
    \ there are quite a lot of parameters that can be used to associate with a date.\
    \ We shall see them in the later parts of this topic.\n\n## Displaying a Date\
    \ in Java\n\nNow let us see how Java provide us the Date, first we shall see how\
    \ to get the current date-time.\n\nJava provides a Date class under the java.util\
    \ package, the package provides several methods to play around with the date.\n\
    \nYou can use the Date object by invoking the constructor of Date class as follows:\n\
    \n```\nimport java.util.Date;\nclass Date_Ex1 {\n    public static void main(String\
