    \ and Abstraction.\n\nIn Java, encapsulation is a mechanism of wrapping data (variables)\
    \ and code together as a single unit.\n\nTo understand what is encapsulation?\
    \ We will see an example of a banking application created in our previous tutorial.\n\
    \nSuppose a hacker managed to gain access to the code of your bank account. Now,\
    \ he tries to deposit amount -100 into your account by two ways. Let us see his\
    \ first method or approach.\n\n**Approach 1:** He tries to deposit an invalid\
    \ amount (say -100) into your bank account by manipulating the code.\n\n```java\n\
    class Hacker{\n  Account a= new Account();\n  a.account_balance= -100;\n}\n```\n\
    \nNow, the question is – Is that possible?\n\nLet us see whether it is possible\
    \ or not? Usually, a variable and class is set as a \"Private\" as shown below.\
    \ It can only be accessed with the corresponding methods, and no other alternative\
    \ methods are allowed to carry out the operations.\n\n```java\nclass Account{\n\
    \    private int account_number;\n    private int account_balance;\n\n    public\
    \ void showData(){\n        // code to show data\n    }\n\n    public void deposit(int\
    \ a) {\n}\n```\n\nIf a data member is private, it means it can only be accessed\
    \ within the same class. Outside class cannot access private data member or variable\
    \ of other class.\n\nSo in our case the hacker cannot deposit amount -100 to your\
    \ account.\n\n```java\nclass Hacker {\n  Account a= new Account();\n  a.account_balance=\
    \ -100;\n}\n```\n\nApproach 2: Hacker's first approach failed to deposit the amount.\
    \ Next, he tries to do the same using \"deposit\" method. To carry out this operation\
    \ he uses \"deposit\" method.\n\n```java\nclass Hacker {\n  Account a= new Account();\n\
    \  a.account_balance= -100;\n  a.deposit(-100);\n}\n```\n\nBut method implementation\
    \ has check for negative values. So the second approach also fails in depositing\
    \ amount -100 into your account.\n\n```java\npublic void deposit(int a) {\n  \
    \  int ac=0;\n    //show error\n    if (a < 0) {\n        // handle error\n  \
    \  } else {\n        account_balance += a;\n    }\n}\n// method implementation\
    \ has checked for negative values (-100) and throws an error\n```\n\nThus, you\
    \ never expose your data to an external party. Which makes your application secure.\n\
    \n```java\nclass Account {\n    private int account_number;\n    private int account_balance;\n\
    \n    public void showData() {\n        // code to show data\n    }\n\n    public\
    \ void deposit(int a) {\n        int ac=0;\n        if (a < 0) {\n           \
    \ //show error\n        } else {\n            account_balance += a;\n        }\n\
    \    }\n}\n```\n\n> The entire code can be thought of as a capsule, and you can\
    \ only communicate through messages.\n\nThe entire code can be thought of as a\
    \ capsule, and you can only communicate through messages. Hence the name encapsulation.\n\
    \nFew notes on Encapsulation in Java:\n\n- In Java, encapsulation is binding the\
    \ data with its related functionality\n- Here functionality means \"methods\"\
    \ and data means \"variables\"\n- So we keep variable and methods in one place.\
    \ That place is \"class.\"\n- \"Class\" is the base for encapsulation.\n- With\
    \ Java Encapsulation, you can hide (restrict access) to critical data members\
    \ in your code, which improves security\n\nAs we discussed earlier, if a data\
    \ member is declared \"private\", then it can only be accessed within the same\
    \ class. No outside class can access data member (variable) of other class.\n\n\
    - However if you need to access these variables, you have to use public \"getter\"\
    \ and \"setter\" methods.\n- Setup public \"getter\" and \"setter\" method to\
    \ update and read the private data field. This will allow data access from private\
    \ class.\n\nFrequently, java encapsulation is referred to as data hiding. But\
    \ more than data hiding, encapsulation concept is meant for better management\
    \ or grouping of related data.\n\nTo achieve a lesser degree of encapsulation\
    \ in Java you can use modifiers like \"protected\" or \"public\". With encapsulation,\
    \ you can change one part without affecting others.\n\n- Encapsulation is more\
    \ about \"how\"\n- Abstraction is more about \"what\" a class can do\n\n## Inheritance\
    \ & Polymorphism\n\nIn the previous tutorial, we learned one of the three concepts.\
    \ In this tutorial, we will learn the remaining two: Inheritance and Polymorphism.\n\
    \n- What is Inheritance? - When a class acquires the traits of another.\n- What\
    \ is Polymorphism? - Polymorphism means many forms.\n\nConsider the same banking\
