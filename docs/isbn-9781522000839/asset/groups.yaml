  mdcn: "\n\n- 抽象类的引用指向其子类的对象，从而实现运行时多态。例如：`Shape obj = new Rectangle();`\n- 如果一个类包含一个或多个抽象方法，则该类必须强制标记为抽象类。\n\
    \n## Java 中的 final\n\n`final` 修饰符可以用于类、方法和变量。`final` 的含义随语境而异，但其核心思想是相同的。\n\n\
    - `final` 类不能被继承。\n- `final` 变量变成一个常量，其值不能被改变。\n- `final` 方法不能被重写。这样做是为了安全考虑，且这些方法用于优化。\n\
    - `final` 类不能被继承。\n\n作业：- 学习 `abstract` 和 `final` 关键字\n\n步骤 1) 将以下代码复制到编辑器中\n\n\
