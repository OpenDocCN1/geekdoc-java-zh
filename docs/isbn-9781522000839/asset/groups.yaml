- md: "\n## Features of Java HashMap\n\na) The values can be stored in a map by forming\
    \ a key-value pair. The value can be retrieved using the key by passing it to\
    \ the correct method.\n\nb) If no element exists in the Map, it will throw a 'NoSuchElementException'.\n\
    \nc) HashMap stores only object references. That's why, it's impossible to use\
    \ primitive data types like double or int. Use wrapper class (like Integer or\
    \ Double) instead.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_54_0.png)\n\n##\
    \ Using HashMaps in Java Programs:\n\nFollowing are the two ways to declare a\
    \ Hash Map:\n\n```\nHashMap<String, Object> map = new HashMap<String, Object>();\n\
    HashMap<String, Object> map = new HashMap<String, Object>();\n```\n\n### Important\
    \ HashMap Methods\n\n- get(Object KEY) – This will return the value associated\
    \ with specified key in this Java hashmap.\n- put(Object KEY, String VALUE) –\
    \ This method stores the specified value and associates it with the specified\
    \ key in this map.\n\n## Java HashMap Example\n\nFollowing is a sample implementation\
    \ of java Hash Map:\n\n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\
    public class Sample_TestMaps{\n    public static void main(String[] args) {\n\
    \        Map<String, String> objMap = new HashMap<String, String>();\n       \
    \ objMap.put(\"Name\", \"Suzuki\");\n        objMap.put(\"Power\", \"220\");\n\
    \        objMap.put(\"Type\", \"2-wheeler\");\n        objMap.put(\"Price\", \"\
    85000\");\n        System.out.println(\"Elements of the Map:\");\n        System.out.println(objMap);\n\
    \    }\n}\n```\n\n## Lets ask us a few queries to the Hash Map itself to know\
    \ it better\n\nQ: So Mr.Hash Map, how can I find if a particular key has been\
    \ assigned to you?\n\nA: Cool, you can use the containsKey(Object KEY) method\
    \ with me, it will return a Boolean value if I have a value for the given key.\n\
    \nQ: How do I find all the available keys that are present in the Map?\n\nA: I\
    \ have a method called as keyset() that will return all the keys in the map. In\
    \ the above example, if you write a line - System.out.println(objMap.keySet());\n\
    \nIt will return an output as-[Name, Type, Power, Price]\n\nSimilarly, if you\
    \ need all the values only, I have a method as values(). System.out.println(objMap.values());\n\
    \nIt will return an output as-[Suzuki, 2-wheeler, 220, 85000]\n\nQ: Suppose, I\
    \ need to remove only a particular key from the Map, do I need to delete the entire\
    \ Map?\n\nA: No buddy!! I have a method as remove(Object KEY) that will remove\
    \ only that particular key-value pair.\n\nQ: How can we check if you actually\
    \ contain some key-value pairs?\n\nA: Just check if I am empty or not!! In short,\
    \ use isEmpty() method against me ;)\n\n## How to use Java Array\n\n## What is\
    \ ArrayList in Java?\n\nWondering how ArrayList java could be useful, see the\
    \ below conversation -\n\nHey Duke, I am facing a small challenge in my program.\
    \ I have a series of elements that I need to handle on a dynamic basis. Sometimes\
    \ it can be 5 elements, sometimes 3 or at times 10 too. Can you please suggest\
    \ a suitable solution wherein I can handle this dynamic behavior efficiently?\n\
    \nOf course!! I can help with that, you we knew that such situations will arise\
    \ several times and we have a very useful structure called as ArrayList for this\
    \ purpose. Let's understand this\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_57_0.png)\n\
    \nSee the following picture of a man stretching an elastic rubber band.\n\nThe\
    \ actual length of the rubber band is much smaller but when stretched it can extend\
    \ a lot more than its actual length and can be used to hold/bind much larger objects\
    \ with it.\n\nNow, consider the next picture, that of a simple rope, it cannot\
    \ stretch and will have a fixed length.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_57_1.png)\n\
    \nArrayList are like RubberBands\n\nArrays are like a rope.\n\nThey are fixed\n\
    \nIt can grow as and when required to accommodate the elements it needs to store\
    \ and when elements are removed, it can shrink back to a smaller size.\n\nSo as\
    \ our friend has the issue array he is using cannot be expanded or made to shrink,\
    \ we will definitely be using ArrayList.\n\nArrays are like the rope shown in\
    \ the above picture; they will have a fixed length, cannot be expanded nor reduced\
    \ from the original length.\n\nSo our stretchable rubber-band is much like the\
    \ List whereas the rope can be considered as the array.\n\nTechnically speaking,\
    \ Java Array List is like a dynamic array or a variable-length array.\n\nLet us\
    \ see and understand the following code snippet that will help you working around\
    \ with Array List.\n\n```\nArrayList<Object> a = new ArrayList<Object>();\n```\n\
    \n## Arraylist Methods\n\n- ArrayList add: This is used to add elements to the\
    \ Array List. If an ArrayList already contains elements, the new element gets\
    \ added after the.\n- ArrayList remove: The specified element is removed from\
    \ the list. Alternately, you can also specify the index.\n- Java size: This will\
    \ give you the number of elements in the list.\n- contains: This method will return\
    \ true if the list contains the element.\n\n## Java Array Example\n\n```java\n\
    import java.util.ArrayList;\nclass Account {\n    int a;\n    int b;\n\n    public\
    \ void setData(int a, int b) {\n        this.a = a;\n        this.b = b;\n   \
