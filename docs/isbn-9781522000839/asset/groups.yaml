    );\n\n```\n\nDate dt_1 = objSDF.parse(\"20-08-1981\");\nDate dt_2 = objSDF.parse(\"\
    12-10-2012\");\n\nSystem.out.println(\"Date1: \" + objSDF.format(dt_1));\nSystem.out.println(\"\
    Date2: \" + objSDF.format(dt_2));\n\nif (dt_1.compareTo(dt_2)>0) {\n    System.out.println(\"\
    Date 1 occurs after Date 2\");\n    // compareTo returns the value greater than\
    \ 0 if This is after the Date argument.\n}\nelse if (dt_1.compareTo(dt_2)<0) {\n\
    \    System.out.println(\"Date 1 occurs before Date 2\");\n    // compareTo returns\
    \ the value less than 0 if This is before the Date argument.\n}\nelse if (dt_1.compareTo(dt_2)==0){\n\
    \    System.out.println(\"Both are same dates\");\n    // compareTo returns the\
    \ value 0 if the argument is equal to the second Date;\n}\n```\n\n## How to use\
    \ Java Timer and Example\n\nWays of Timer Java implementation\n\n- 1) To set up\
    \ a specific amount of delay until a task is executed.\n- 2) To find the time\
    \ difference between two specific events\n\nJava Timer - Need to understand Few\
    \ concept\n\n- * It can only be a future event that can be timed.\n* Will the\
    \ event occur once or repeatedly?\n* How long is the Timer required?\n* There\
    \ may be several Timers required in parallel.\n* The timers should have the facility\
    \ to stop or even cancel at any given point.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_129_0.png)\n\
    \n## Java Timer Example\n\nUsing the Java timer for your programs\n\nTHE TIMER\
    \ IN JAVA IS PROVIDED WITHIN THE JAVA.UTIL PACKAGE.\n\nLet us have a look at using\
    \ Timer for 2 tasks that we need to schedule-\n\nStep 1) But before that lets\
    \ create the class that will contain some task that we need to do-\nimport java.util.TimerTask;\n\
    \n```\nimport java.util.Timer;\n\npublic class TaskMaster extends TimerTask {\n\
    \n    String strObject;\n\n    public TaskMaster(String strObject) {\n       \
    \ this.strObject = strObject;\n    }\n\n    public void run() {\n        System.out.println(\"\
    Inside Run task-\" + strObject);\n    }\n}\n```\n\nThis is a simple class that\
    \ uses the run() method of Threads when the task is invoked. The String strObject\
    \ will help us identify which task is running.\n\nStep 2) Create 2 timers as follows\
    \ in a class called Java Timer class:\n\nTimer_timer_1;\n\nTimer_timer_2;\n\n\
    Step 3) Create a constructor of this class having 2 integer parameters as input-\n\
    public Timer(int t1,int t2) {\n}\n\nThis constructor will have the code to invoke\
    \ the 2 timers declared earlier to use for the tasks created in TaskMaster class.\n\
    \nStep 4) Initiate the timers as follows\n\n```\ntimer_1 = new Timer();\n```\n\
    \nStep 5) Now if you use this object, you will see several methods in it.\n\n\
    - task - task to be scheduled.\n- delay - delay in milliseconds before task is\
    \ executed.\n- period - time in milliseconds between successive executions.\n\n\
    The constructor should now be looking like-\n\n```java\npublic Timers(int t1,int\
    \ t2) {\n\n    timer_1 = new Timer();\n    timer_1.schedule(new TaskMaster(\"\
    Alpha\"), t1, t1);\n\n    timer_2 = new Timer();\n    timer_2.schedule(new TaskMaster(\"\
    Delta\"), t2, t2);\n}\n```\n\nStep 6) Repeat step 5 for timer_2 and pass some\
    \ string say \"Delta\".\n\nYour constructor should now be looking like-\n\n```java\n\
    public Timers(int t1,int t2) {\n\n    timer_1 = new Timer();\n    timer_1.schedule(new\
    \ TaskMaster(\"Alpha\"), t1, t1);\n\n    timer_2 = new Timer();\n    timer_2.schedule(new\
    \ TaskMaster(\"Delta\"), t2, t2);\n}\n```\n\nStep 7) Now create the main method\
    \ and call the Timers class with 2 arguments as integers.\n\n```\npublic static\
    \ void main(String[] args[]) {\n\n    new Timers(1,5);\n}\n```\n\nStep 8) On executing\
    \ this method, the result will appear something like-\n\nInside Run task-Alpha\n\
    \nInside Run task-Alpha\n\nInside Run task-Alpha\n\nInside Run task-Alpha\n\n\
    Inside Run task-Delta\n\nInside Run task-Alpha\n\nInside Run task-Alpha\n\nInside\
    \ Run task-Alpha\n\nInside Run task-Alpha\n\nInside Run task-Alpha\n\nInside Run\
    \ task-Alpha\n\nInside Run task-Delta\n\nInside Run task-Alpha\n\nInside Run task-Alpha\n\
    \nInside Run task-Alpha\n\n...... THIS WILL CONTINUE UNTIL YOU DON'T TERMINATE\
    \ THE PROGRAM.\n\nThis was the Schedule method of timer that schedules the specified\
    \ task for repeated FIXED-DELAY EXECUTION, beginning after the specified delay.\
    \ Subsequent executions take place at approximately regular intervals separated\
    \ by the specified period.\n\nIn fixed-delay execution, each execution is scheduled\
    \ RELATIVE TO THE ACTUAL EXECUTION TIME OF THE PREVIOUS EXECUTION\n\nStep 9) Now\
    \ comment the line with schedule method and uncomment the scheduleAtFixedRate.\n\
    \nThe output will be quite similar.\n\nThis method too schedules the specified\
    \ task for repeated FIXED-RATE EXECUTION, beginning after the specified delay.\
    \ Subsequent executions take place at approximately regular intervals, separated\
    \ by the specified period.\n\nIn fixed-rate execution, each execution is scheduled\
    \ RELATIVE TO THE SCHEDULED EXECUTION TIME OF THE INITIAL EXECUTION.\n\nOh yes!!\
    \ You can programmatically stop the timers by calling the cancel() method of the\
    \ timer.\n"
  mdcn: "\n\n- 日期（将是该月的实际日期）。\n- 星期（给定日期的星期 - 如 Sun, Mon, Tue 等）。\n\n在在计算机系统中，有很多参数可以与日期相关联。我们将在本主题的后续部分介绍它们。\n\
    \n## 在 Java 中显示日期\n\n现在让我们看看 Java 如何为我们提供 Date 类，首先我们将查看如何获取当前日期和时间。\n\nJava 在\
    \ `java.util` 包下提供了一个 `Date` 类，该包提供了几个方法来处理日期。\n\n你可以通过如下方式调用 `Date` 类的构造函数来使用\
    \ `Date` 对象：\n\n```\nimport java.util.Date;\nclass Date_Ex1 {\n    public static\
    \ void main(String args[]) {\n        // 通过调用构造函数实例化 Date 对象\n        Date objDate\
    \ = new Date();\n        // 使用 toString() 显示日期和时间\n        System.out.println(objDate.toString());\n\
    \    }\n}\n```\n\n## 以指定的格式显示日期：\n\n你们在幼儿园都学过字母表了....\n现在让我们学习日期格式的 ABC。\n\n|\
    \ G | y | M | d |\n|---|---|---|---|\n| h | H | m | s |\n| S | E | D | F |\n|\
    \ w | W | a | k |\n| K | z | | \" ' |\n\n不要担心，你不需要记住所有这些，当你需要格式化特定日期时可以随时参考它们。\n\
    \n## 日期格式如何使用？\n\nJava 提供了一个名为 `SimpleDateFormat` 的类，允许你根据需求格式化和解析日期。\n\n你可以使用上述字符来指定格式\
    \ - 例如：\n\n- 1. 需要的日期格式：2012.10.23 20:20:45 PST\n\n指定的适当日期格式将为：`yyyy.MM.dd HH:mm:ss\
    \ zzz`\n\n- 2. 需要的日期格式：09:30:00 AM 23-May-2012\n\n指定的适当日期格式将为：`hh:mm:ss a dd-MMM-yyyy`\n\
    \n提示：注意字母的大小写写。如果你将 `M` 误认为 `m`，你将得到意外的结果！\n\n让我们通过这个代码示例来学习\n\n```\nimport java.text.SimpleDateFormat;\n\
    import java.util.Date;\nclass TestDates_Format {\n    public static void main(String[]\
    \ args[]) {\n        Date objDate = new Date(); // 当前系统日期和时间赋值给 objDate\n    \
    \    String strDateFormat = \"hh:mm:ss a dd-MMM-yyyy\";// 指定日期格式\n        SimpleDateFormat\
    \ objSDF = new SimpleDateFormat(strDateFormat);// 将日期格式字符串作为参数传递给 Date 对象\n  \
    \      System.out.println(objSDF.format(objDate));// 对当前日期应用日期化\n    }\n}\n```\n\
    \n## 日期的比较\n\n比较日期最有效的方法是使用 `compareTo()` 方法。\n\n让我们来看下面的代码段-\n\n```\nimport java.text.SimpleDateFormat;\n\
    import java.text.ParseException;\nimport java.util.Date;\n\nclass TestDates_Compare\
    \ {\n    public static void main(String[] args[]) throws Exception {\n\nSimpleDateFormat\
    \ objSDF = new SimpleDateFormat(\"dd-mm-yyyy\");\n\n```\n\nDate dt_1 = objSDF.parse(\"\
    20-08-1981\");\nDate dt_2 = objSDF.parse(\"12-10-2012\");\n\nSystem.out.println(\"\
    Date1: \" + objSDF.format(dt_1));\nSystem.out.println(\"Date2: \" + objSDF.format(dt_2));\n\
    \nif (dt_1.compareTo(dt_2)>0) {\n    System.out.println(\"Date 1 occurs after\
    \ Date 2\");\n    // 如果此日期在 Date 参数之后，compareTo 返回大于 0 的值\n}\nelse if (dt_1.compareTo(dt_2)<0)\
    \ {\n    System.out.println(\"Date 1 occurs before Date 2\");\n    // 如果此日期在 Date\
    \ 参数之前，compareTo 返回小于 0 的值\n}\nelse if (dt_1.compareTo(dt_2)==0){\n    System.out.println(\"\
    Both are same dates\");\n    // 如果参数与第二个 Date 相等，compareTo 返回值 0；\n}\n```\n\n\
    ## 如何使用 Java Timer 及其示例\n\nTimer Java 的实现方式\n\n- 1) 设置特定的延迟，直到执行执行。\n- 2) 找出两个特定事件之间的时间差\n\
    \nJava Timer - 需要理解的几个概念\n\n- * 它只能是一个可以计时的未来事件。\n* 事件是发生一次还是重复发生？\n* Timer 需要多长时间？\n\
    * 可能需要多个并行的 Timer。\n* 定时器应该具有在任何给定点停止甚至取消的能力。\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_129_0.png)\n\
    \n## Java Timer 示例\n\n在程序中使用 Java timer\n\nJAVA 中的 TIMER 在 JAVA.UTIL 包中提供。\n\n\
    让我们来看看看如何使用 Timer 处理我们需要调度的 2 个任务-\n\n步骤 1) 在此之前，让我们创建一个包含我们需要执行的一些任务的类-\n`java.util.TimerTask`\n\
    \n```\nimport java.util.TimerTask;\n\nclass TaskMaster extends TimerTask {\n\n\
    \    String strObject;\n\n    public TaskMaster(String strObject) {\n        this.strObject\
    \ = strObject;\n    }\n\n    public void run() {\n        System.out.println(\"\
    Inside run-\" + strObject);\n    }\n}\n```\n\n这是用于识别是否在 Date 参数之后调用的简单类。\n\n步骤\
    \ 2) 创建一个我们需要调度的 2 个任务的 Timer-\n```java\nimport java.util.Timer;\n\nclass TimerExample\
    \ {\n\n    public static void main(String[] args[]) {\n\n        Timer timer =\
    \ new Timer();\n\n        TaskMaster task1 = new TaskMaster(\"Task 1\");\n   \
    \     timer.schedule(task1, 1000, 5000);\n\n        TaskMaster task2 = new TaskMaster(\"\
    Task 2\");\n        timer.schedule(task2, 2000, 3000);\n    }\n}\n```\n\n这是用于识别是否在\
    \ Date 参数之前调用的简单类。\n\n步骤 3) 停止定时器\n\n```java\ntimer.cancel();\n```\n\n这是用于识别是否与第二个\
    \ Date 相等的调用的简单类。\n\n"
