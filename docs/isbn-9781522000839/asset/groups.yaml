- md: "\n## How to handle exception\n\nSo far we have seen what exception is.\n\n\
    But blaming your code failure on environmental issues is not a solution. You need\
    \ a Robust Programming, which takes care of exceptional situations. Such code\
    \ is known as Exception Handler.\n\nIn our example, good exception handling would\
    \ be, when the server is down connect to the backup server.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_100_0.png)\n\
    \nTo implement this, enter your code to connect to the server (Using traditional\
    \ if and else conditions).\n\nYou will check if the server is down.\n\nIf yes,\
    \ write the code to connect to the backup server.\n\nSuch organization of code,\
    \ using \"if\" and \"else\" loop is not effective when your code has multiple\
    \ java exceptions to handle.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_100_1.png)\n\
    \nHence, Java provides an inbuilt exceptional handling.\n\n- 1. The normal code\
    \ goes into TRY block.\n- 2. The exception handling code goes into the CATCH block\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_101_0.png)\n\nIn our example, TRY block\
    \ will contain the code to connect to the server. CATCH block will contain the\
    \ code to connect to the backup server.\n\nIn case the server is up, the code\
    \ in the CATCH block will be ignored. In case the server is down, an exception\
    \ is raised, and the code in catch block will be executed.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_101_1.png)\n\
    \nSo, this is how the exception is handled in Java.\n\nA Summary of the points\
    \ covered in the above demonstration –\n\n- 1. An Exception is a run-time error\
    \ which interrupts the normal flow of program execution.\n- 2. A robust program\
    \ should handle all exceptions and continue with its normal flow of program execution.\n\
    - 3. Exception Handler is a set of code that handles an exception.\n\nExceptions\
    \ can be handled in Java using try & catch.\n\n## Syntax for using try & catch\n\
    \n```java\ntry{\n  statement(s)\n}\n catch (exceptiontype name){\n  statement(s)\n\
    }\n```\n\nStep 1) Copy the following code into an editor\n\n```java\nclass JavaException\
    \ {\n  public static void main(String args[]) {\n    int d = 0;\n    int n = 20;\n\
    \    int fraction = n/d;\n    System.out.println(\"End Of Main\");\n  }\n}\n```\n\
    \nStep 2) Save the file & compile the code. Run the program using command, java\
    \ JavaException.\n\nStep 3) An Arithmetic Exception - divide by zero is shown\
    \ as below for line #5 and line #6 is never executed.\n\nStep 4) Now lets examine\
    \ how try and catch will help us handle this exception. We will put the exception\
    \ causing line of code into a try block, followed by a catch block. Copy the following\
    \ code into editor.\n\n```java\nclass JavaException {\n  public static void main(String\
    \ args[]) {\n    int d = 0;\n    int n = 20;\n    try{\n      int fraction = n/d;\n\
    \      System.out.println(\"This line will not be Executed\");\n    }\n catch(ArithmeticException\
    \ e){\n      System.out.println(\"In the catch Block due to Exception = \" +e);\n\
    \    }\n    System.out.println(\"End Of Main\");\n  }\n}\n```\n\n## Step 5) Save,\
    \ Compile & Run the code. You will get the following output\n\n```text\nC:\\workspace>\
    \ java JavaException\nIn the catch block due to Exception = java.lang.ArithmeticException:\
    \ / by zero\nEnd Of Main\n```\n\nAs you observe, the exception is handled and\
    \ the last line of code is also executed. Also note that Line # 7 will not be\
    \ executed because as soon as an exception is raised flow of control jumps to\
    \ the catch block.\n\nNote: The ArithmeticException Object \"e\" carries information\
    \ about the exception that has occurred which can be useful in taking recovery\
    \ actions.\n\n## Java Finally Block\n\nThe finally block is executed irrespective\
    \ of an exception being raised in the try block. It is optional to use with a\
    \ try block.\n\n```java\ntry{\n    statement(s)\n}\ncatch(ExceptionType name){\n\
    \    statement(s)\n}\nfinally{\n    statement(s)\n}\n```\n\nIn case, an exception\
    \ is raised in the try block, finally block is executed after the catch block\
    \ is executed.\n\n## Assignment\n\nStep 1) Copy the following code into an editor.\n\
    \n```java\nclass JavaException {\n    public static void main(String[] args[]){\n\
    try{\n    int d = 0;\n    int n = 20;\n    int fraction = n/d;\n}\ncatch(ArithmeticException\
    \ e) {\n    System.out.println(\"In the catch clock due to Exception = \" +e);\n\
    }\nfinally {\n    System.out.println(\"Inside the finally block\");\n}\n    }\n\
    }\n```\n\nStep 2) Save, Compile & Run the Code.\n\nStep 3) Expected output. Finally\
    \ block is executed even though an exception is raised.\n\nStep 4) Change the\
    \ value of d = 1. Save, Compile & Run the code. Observe the output.\n\n## Summary:\n\
    \n- Java provides inbuilt exception handling.\n- The normal code goes into TRY\
    \ block.\n- The exception handling code goes into the CATCH block.\n- An Exception\
    \ is a run-time error which interrupts the normal flow of program execution.\n\
    - A robust program should handle all exceptions and continue with its normal flow\
    \ of program execution.\n- Exception Handler is a set of code that handles an\
    \ exception.\n- The finally block is executed irrespective of an exception being\
    \ raised in the try block. It is optional to use with a try block.\n- The ArithmeticException\
    \ Object \"e\" carries information about the exception that has occurred which\
    \ can be useful in taking recovery actions.\n- Errors are classified into: Error\
    \ and Exception.\n- Exception is a subclass of Throwable.\n- Runtime exception\
    \ is a subclass of Exception class.\n- IO exception is generated during input\
    \ and output operations.\n- Interrupted exceptions are generated during threading.\n\
    - Custom exceptions can be created by extending the Exception class.\n"
