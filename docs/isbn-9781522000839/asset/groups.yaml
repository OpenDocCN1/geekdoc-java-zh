    \n- OOP's approach: While using OOPs programming approach. We would create two\
    \ classes. Each having implementation of the deposit and withdraw functions. This\
    \ will be redundant work.\n\n## Implementing Privileged Bank Account\n\nNow there\
    \ is a change in the requirement specification for something that is so common\
    \ in the software industry. You are supposed to add functionality privileged Banking\
    \ Account with Overdraft Facility. For a background, overdraft is that you can\
