    +   - The Stack section of memory contains methods, local variables and reference
    variables.


    +   - The Heap section contains Objects (may also contain reference variables).


    +   - The Static section contains Static data/methods.


    Of all of the above 4 sections, you need to understand the allocation of memory
    in Stack & Heap the most, since it will affect your programming efforts.


