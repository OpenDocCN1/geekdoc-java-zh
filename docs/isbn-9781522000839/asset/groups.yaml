    \n# 第 7 章：条件循环\n\n## 如何在 Java 中循环/遍历数组\n\n让我们以一个想要在不使用计数器的情况下遍历的 String 数组。\n\n\
    考虑初始化如下的 String 数组 arrData：\n\n`String[] arrData = {\"Alpha\", \"Beta\", \"Gamma\"\
