    \n# Java 静态方法和变量\n\n变量类型\n\n- 1. 静态变量\n- 2. 静态方法\n- 3. 静态代码块。\n\n让我们先来看静态变量和静态方法。\n\
    \n## Java 静态变量\n\n- 它是一个**属于类**而**不属于**对象（实例）的变量。\n- 静态变量只在执行开始时初始化一次。这些变量会在任何实例变量初始化之前先初始化。\n\
    - 类的所有实例共享这一个副本。\n- 静态变量可以通过类名直接访问，不需要对象。\n- 语法：`<类名>变量名>`\n\n## Java 静态方法\n\n\
    - 它是一个属于类而不属于对象（实例）的方法。\n- 静态方法只能访问静态数据。它不能访问非静态数据。\n- 静态方法可以调用静态方法，不能调用非静态方法。\n\
    - 静态方法可以通过类名直接访问，不需要对象。\n- 语法：`<类名>方法名>`\n- 注意：静态方法中不能引用 \"this\" 或 \"super\"\
    \ 关键字。\n\n## 垃圾回收是如何在 Java 中工作的\n\n在 Java 编程语言中，对象的动态分配是通过 `new` 运算符实现的。对象一旦使用某些内存，只要有引用就会存在。\n\
    \n当对象没有引用时，假设它不再需要，它所占用的内存可以被回收。Java 不需要显式地销毁对象，因为它会自动处理。\n\n实现这种技术的被称为垃圾回收。不释放内存的程序最终会在没有可用内存时崩溃。这种程序被认为存在内存泄漏。\n\
