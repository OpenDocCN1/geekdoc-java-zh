    \n- Structural approach: Using functional approach, I have to modify my withdraw\
    \ function, which is already tested and baselined. And add a method like below\
    \ will take care of new requirements.\n\n- OOP's approach: Using OOP's approach,\
    \ you just need to write a new class with unique implementation of withdraw function.\
    \ We never touched the tested piece of code.\n\nWhat if the requirement changes\
    \ further? Like to add credit card account with its own unique requirement of\
    \ deposits.\n"
  mdcn: "\n\n# 什么是面向对象（OOP）中的抽象？\n\n假设你想创建一个银行应用程序，并且被要求收集客户的所有信息。你可能会想到很多与客户相关的信息，但其中许多信息对于银行应用程序来说至少是不需要的。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_19_0.png)\n\n因此，你需要从那个像数据库的池中筛选出与银行应用程序相关的信息，例如姓名、地址、税收信息等。由于我们从最大的池中提取或筛选了客户信息，因此这个过程被称为**抽象**（Abstraction）。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_19_1.png)\n\n但一旦提取出相同的信息，就可以广泛应用于。例如，你可以将相同的数据用于医院应用程序、招聘门户应用程序、政府数据库等。\n\
    \n## 关于 Java 抽象的记忆点：\n\n- 抽象是为软件中的对象选择重要数据集并忽略不紧要的数据集的过程。\n- 一旦你使用抽象对对象进行了建模，同一组数据就可以用于不同的应用程序。\n\
