    \        }\n    }\n}\n```\n\n现在，你知道那些奇怪的数字是如何生成的了！！！\n\n# 第 10 章重要内容\n\n任何应用程序都可以有多个进程（实例）。每个进程都可以被分配为单线程或多线程。\n\
    \n- 单线程（Single Thread）：单线程基本上是轻量级的且是处理的最小单元。\n- 多线程（Multi-Thread）：而多线程可以定义为两个或多个线程的并发执行。\n\
    \n我们将在本教程中查看如何同时执行多个任务，并学习线程以及线程之间的同步。\n\n# 什么是单线程和多线程\n\n正如我们之前讨论的，单线程是处理的最小单元。Java\
    \ 通过使用“Thread 类”来使用线程。\n\n线程有两种类型——用户线程（user thread）和守护线程（daemon thread）（守护线程在我们想要清理应用程序时使用，并在后台运行）。\n\
    \n当应用程序首次启动时，会创建用户线程。之后，我们可以创建许多用户线程和守护线程。\n\n单线程示例：\n\n```java\npackage demotest;\n\
    ```\n\npublic class GuruThread1 implements Runnable\n{\n    /**\n     * @param\
    \ args\n     */\n    public static void main(String[] args) {\n        Thread\
    \ guruThread1 = new Thread(\"Guru1\");\n        Thread guruThread2 = new Thread(\"\
    Guru2\");\n        guruThread1.start();\n        guruThread2.start();\n      \
    \  System.out.println(\"Thread names are following:\");\n        System.out.println(guruThread1.getName());\n\
    \        System.out.println(guruThread2.getName());\n    }\n\n    @Override\n\
    \    public void run() {\n    }\n}\n```\n\n# 单线程的优点：\n\n- 减少了应用程序中的开销，因为单线程在系统中执行。\n\
    - 同样，它降低了应用程序的维护成本。\n\n# 多线程\n\n多线程应用程序是两个或多个线程并发运行的地方。这种多任务处理是在多个进程共享 CPU、内存等共同资源时完成的。\n\
    \n每个线程彼此并行运行。线程不分配独立的内存区域，因此节省了内存。此外，线程之间的上下文切换花费的时间更短。\n\n# 多线程示例：\n\n```java\n\
    package demotest;\npublic class GuruMultithread implements Runnable{\n\n/**\n\
