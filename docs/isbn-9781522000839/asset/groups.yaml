    \n虽然你可能知道查找数组大小并然后使用传统的 for 循环（计数器、条件和递增）遍历数组的每个元素，但我们需要找到一种不使用任何计数器的优化方法。\n\n\
    这是 \"for\" 循环的传统方法：\n\n```java\nfor(int i = 0; i < arrData.length; i++) {\n  \
    \  System.out.println(arrData[i]);\n}\n```\n\n你可以看到计数器的使用，并将其作为数组的索引。Java 提供了一种使用\
    \ \"for\" 循环的方法，如下所示遍历数组的每个元素。以下是语法模板：\n\n```java\nfor<DataType of array/List\
    \ temp name : Array/List to be iterated> {\n    System.out.println(temp);\n}\n\
    ```\n\n这是我们之前声明的数组的代码：\n\n```java\nclass UsingForEach {\n    public static void\
    \ main(String[] args) {\n        String[] arrData = {\"Alpha\", \"Beta\", \"Gamma\"\
    , \"Delta\", \"Sigma\"};\n        // 使用 for循环的优化方法 - 也称为 foreach 循环\n        for\
    \ (String strTemp : arrData) {\n            System.out.println(strTemp);\n   \
    \     }\n        System.out.println(\"\\nForEach loop:\");\n    }\n}\n```\n\n\
    你可以看到循环之间的区别。代码显著减少了。循环中也没有使用索引或计数器。确保在 foreach 循环中声明的数据类型与你正在遍历的数组的数据类型匹配。\n\n\
    > For each 优化了你的循环，节省了一些输入量，当然也节省了你的时间！！\n\n## Switch Case（分支语句）\n\n我们在生活中经常使用开关。是的，我指的是用于灯和风扇的开关。如下面的图片所示，每个开关都分配用于操作特定的设备。例如，在图中，第一个开关是风扇，下一个是灯，以此此类推。因此，我们可以看到每个开关只能激活/禁用一个项目。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_95_0.png)\n\n### Java 中的 Switch Case\
    \ 是什么？\n\n同样，Java 中的 switch 是一种条件语句，它在给定的输入中仅激活匹配的条件。让我们考虑一个程序示例，用户提供一个数值作为输入（在本例中仅为一位数字），输出应该是单词形式的数字。整数变量\
    \ `iSwitch` 是 switch 运行的输入。各种可用选项（cases）随后被写为 `case <value>:` 并带有冒号。如果 case 与\
    \ switch 的输入匹配，将执行该语句。\n\n### Java Switch 示例\n\n```java\nclass SwitchBoard{\n\
