- md: "\nDuring execution, the compiler is confused. Whether \"a\" on the left side\
    \ of the assigned operator is the instance variable or the local variable. Hence,\
    \ it is not set the value of 'a' when the method set data is called.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_62_0.png)\n\
    \n```java\nclass Account{\n    public void setData(int a , int b) {\n        a=b;\n\
    \    }\n}\n```\n\nproblem can be overcome by \"THIS\" keyword\nAppend both 'a'\
    \ and 'b' with the \"this\" keyword followed by a dot (.) operator.\n\n```java\n\
    class Account{\n    int a;\n    int b;\n    public void setData(int a , int b)\
    \ {\n        this.a=a;\n        this.b=b;\n    }\n    public static void main(String\
    \ args[]) {\n        Account obj = new Account();\n    }\n}\n```\n\n```java\n\
    public void setData(int a , int b) {\n    this.a=a;\n    this.b=b;\n}\npublic\
    \ static void main(String[] args) {\n    Account obj = new Account();\n    obj.setData(2,3);\n\
    }\n```\n\nDuring code execution when an object calls the method 'setdata'. The\
    \ keyword 'this' is replaced by the object handler 'obj.' (See the image below).\n\
    \n```java\npublic void setData(int a , int b) {\n    obj.a=a;\n    obj.b=b;\n\
    }\npublic static void main(String args[]) {\n    Account obj = new Account();\n\
    \    obj.setData(2,3);\n}\n```\n\nSo now the compiler know,\n\n- The 'a' on the\
    \ left-hand side is an Instance variable.\n- Whereas the 'a' on right-hand side\
    \ is a local variable.\n\nThe variables are initialized correctly, and the expected\
    \ output is shown.\n\n```bash\nC:\\workspace>javac thisDemo.java\nC:\\workspace>java\
    \ Account\nValue of A=2\nValue of B=3\n```\n\nSuppose you are smart enough to\
    \ choose different names for your instance variable and methods arguments.\n\n\
    ![](img/6f6cf42a75b6996d40290c9064bc348f_64_0.png)\n\nBut this time around, you\
    \ create two objects of the class, each calling the set data method.\n\nHow the\
    \ compiler will determine whether it is supposed to work on instance variable\
    \ of object 1 or object 2.\n\n```java\npublic void setData(int c , int d) {\n\
    \    // compiler will know which is which\n    // (c or d) has to execute\n  \
    \  a=c;\n    b=d;\n}\npublic static void main(String args[]) {\n    Account object1\
    \ = new Account();\n    object1.setData(2,3);\n    Account object2 = new Account();\n\
    \    object2.setData(4,3);\n}\n```\n\nWell, the compiler implicitly appends the\
    \ instance variable with \"THIS\" keyword (image below). Such that when object\
    \ 1 is calling a set data method, instance variable are appended by its reference\
    \ variable. While object 2 is calling the set data method, an instance variable\
    \ of object 2 are modified.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_65_0.png)\n\
    \n```java\npublic void setData(int c, int d) {\n    object1.a=c;\n    object1.b=d;\n\
    }\npublic static void main(String args[]) {\n    Account object1 = new Account();\n\
    \    object1.setData(2,3);\n    Account object2 = new Account();\n    object2.setData(4,3);\n\
    }\n}\n```\n\n```java\npublic void setData(int c, int d) {\n    object2.a=c;\n\
    \    object2.b=d;\n}\npublic static void main(String args[]) {\n    Account object1\
    \ = new Account();\n    object1.setData(2,3);\n    Account object2 = new Account();\n\
    \    object2.setData(4,3);\n}\n}\n```\n\nThis process is taken care of by the\
    \ compiler itself. You don't have to append 'this' keyword explicitly unless there\
    \ is an exceptional situation as in our example.\n\n# Points to Remember:\n\n\
    - \"this\" is a reference to the current object, whose method is being called\
    \ upon.\n\nYou can use \"this\" keyword to avoid naming conflicts in the method/constructor\
    \ of your instance/object.\n\n# Assignment: To learn the use \"this\" keyword\n\
    \nStep 1 ) Copy the following code into a notepad.\n\n```java\nclass Account{\n\
    \    int a;\n    int b;\n\n    public void setData(int a ,int b){\n        a =\
    \ a;\n        b = b;\n    }\n    public void showData(){\n        System.out.println(\"\
    Value of A=\"+a);\n        System.out.println(\"Value of B=\"+b);\n    }\n   \
    \ public static void main(String args[]){\n        Account obj = new Account();\n\
    \        obj.setData(2,3);\n        obj.showData();\n    }\n}\n```\n\nStep 2 )\
    \ Save, Compile & Run the code.\n\nStep 3 ) Value of a & b is shown as zero? To\
    \ correct the error append line # 6 & 7 with \"this\".\n\n```java\nthis.a = a;\n\
    this.b = b;\n```\n\nStep 4 ) Value of a & b is shown as two and 3.\n\n# Summary:\n\
    \n- \"this\" is a reference to the current object, whose method is being called\
    \ upon.\n- The 'a' on the left-hand side is an Instance variable.\n- Whereas the\
    \ 'a' on right-hand side is a local variable.\n- The compiler implicitly appends\
    \ the instance variable with \"this\" keyword.\n- The compiler takes care of this\
    \ process itself.\n\n# Command Line Arguments\n\n## What is Command Line Arguments?\n\
    \nDuring execution, the arguments are passed to the program.\n\n## Important Points:\n\
    \n- Command line arguments can be used to pass information.\n- There is no restriction\
    \ on the number of arguments.\n- They are captured as Strings in the main method.\n\
    \n# Assignment: To learn the use of Command Line Arguments\n\nStep 1 ) Copy the\
    \ following code into a notepad.\n\n```java\nclass Demo {\n    public static void\
    \ main(String args[]) {\n        System.out.println(\"Argument one = \"+args[0]);\n\
    \        System.out.println(\"Argument two = \"+args[1]);\n    }\n}\n```\n\nStep\
    \ 2 ) Save, Compile & Run the code.\n\nStep 3 ) Run the code with arguments.\n\
    \n```bash\njava Demo Hello World\n```\n\nOutput:\n```\nArgument one = Hello\n\
    Argument two = World\n```\n\n# Chapter 5: Inheritance\n\n# Abstract Class and\
    \ Methods\n\n## Concept of Abstract Class\n\nConsider the following hierarchy\
    \ consisting of a Shape class which is inherited by Rectangle and Triangle. The\
    \ Shape class is created to save common attributes and methods. calculateArea()\
    \ is one such method shared by all three classes.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_69_0.png)\n\
    \nNow, assume you write code to create objects for the classes above. Lets observe\
    \ how these objects will look in a practical world.\n\nAn object of the class\
    \ rectangle, will gives a rectangle , a shape we commonly observed in everyday\
    \ life\n\n```java\nRectangle obj = new Rectangle();\n```\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_70_0.png)\n\
    \nAn object of the class triangle, will gives a triangle , again a common shape\n\
    \n```java\nTriangle obj = new Triangle();\n```\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_70_1.png)\n\
    \nBut what would an object of Class Shape look like in a practical world??\n\n\
    ```java\nShape obj = new Shape();\n```\n\n???\n\nIf you observe the Shape class\
    \ serves in our goal of achieving inheritance and polymorphism. But it was not\
    \ built to be instantiated.Such classes can be labeled Abstract.Ex.\n\n```java\n\
    abstract class Shape{\n// code\n}\n```\n\nIt is possible that you DO NOT label\
    \ class Shape as Abstract and then instantiate it. But such object will have no\
    \ use in your code and will open a room for potential errors. Hence this is not\
    \ desirable.\n\n# Abstract Method Java\n\nAs we all know, the formula for calculation\
    \ area for rectangle , circle & triangle is different. The calculateArea() method\
    \ will have to be overridden by the inheriting classes.It makes sense defining\
    \ it in the Shape class, but we need to make sure that all the inheriting classes\
    \ do have the method.\n\nSuch methods can be labeled abstract.\n\n```java\nabstract\
    \ public void calculateArea();\n```\n\nFor an abstract method , no implementation\
    \ for is required. Only the signature of the method is defined.\n"
