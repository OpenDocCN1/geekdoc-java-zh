    \n@Override\npublic void run() {\n    // TODO Auto-generated method stub\n}\n\
    ```\n\n# 多线程的优点：\n\n- 用户不会被阻塞，因为线程是独立的，我们可以同时执行多个操作。\n\n- 正因如此线程是独立的，如果一个线程遇到异常，其他线程不会受到影响。\n\
    \n# Java 中的线程生命周期\n\n线程的生命周期：\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_118_0.png)\n\
    \n线程的生命周期中有多个阶段，如上图所示：\n\n- 1. **New（新建）**：在此阶段，使用“Thread 类”创建线程。在程序启动线程之前，它一直保持此状态。它也被称为出生线程。\n\
    - 2. **Runnable（可运行）**：在此页面中，通过 `start` 方法调用线程实例。线程控制权交给调度器以完成执行。这取决于调度器是否运行该线程。\n\
    - 3. **Running（运行中）**：当线程开始执行时，状态变为“running”状态。调度器从线程池中选择一个线程，它在应用程序中开始执行。\n-\
    \ 4. **Waiting（等待）**：这是线程必须等待的状态。由于应用程序中有多个线程在运行，因此线程之间需要同步。因此，一个线程必须等待，直到另一个线程完成。\n\
    - 5. **Dead（死亡）**：这是线程终止的状态。线程处于运行状态并由于已完成而结束。\n\n一些常用的线程方法：\n\n- 1. `start()`：此方法启动线程的执行，JVM\
    \ 调用 `run()` 方法。我们将在下面的示例中介绍它。\n- 2. `Sleep(int milliseconds)`：此方法让线程睡眠指定的毫秒数。因此，线程将等待。\n\
    - 3. `getName()`：它返回线程名称。\n- 4. `setPriority(int newpriority)`：它更改线程的优先级。\n- 5.\
    \ `yield()`：它导致当前线程挂起并执行其他线程。\n\n示例：在这个示例中，我们将创建一个线程并探索其内置方法。\n\n```java\npackage\
    \ demotest;\npublic class thread_example1 implements Runnable {\n\n@Override\n\
    \    public void run() {\n}\n    public static void main(String[] args) {\n  \
    \      Thread guruthread1 = new Thread();\n        guruthread1.start();\n    \
