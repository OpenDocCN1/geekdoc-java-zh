    # 第一章：引言


    # 什么是 Java 平台？


    为了理解 JAVA 编程语言，我们需要理解计算机程序如何运行命令并执行操作的基本概念。


    “Java 既是一种编程语言，也是一个平台”

    回顾一些计算的基本概念如何？


    # 什么是 PC？


    计算机是一种能够执行计算的电子设备，我们都知道它由显示器、键盘、鼠标和存储信息的内存组成。但计算机最重要的组件是处理器 (PROCESSOR)。它负责计算机的所有思考，但问题是计算机是如何进行思考的？它是如何理解文本、图像、视频等的？


    # 计算机是一种能够计算的电子设备


    计算机是一种电子设备，它只能理解电子信号或二进制信号。例如，5伏特电子信号可能代表二进制 1，而 0 特可能代表二进制 0。因此，你的 PC 持续地受到这些信号的轰击。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_4_0.png)


    八位此类信号组合在一起以解释文本、数字和符号。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_5_0.png)


    例如，# 符号被计算机识别为 10101010。同样，添加函数的模式由 10000011 表示。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_5_1.png)


    这被称为 8 位计算。当今处理器能够处理 64 位运算。但这个概念与 JAVA 编程语言之间有什么关系？让我们通过一个例子来理解。


    假设你想告诉计算机两个两个数字 (1+2)，这两个数字由某些二进制数 (10000011) 表示，你将如何告诉计算机？是的，我们将使用汇编语言来执行我们的代码。


    “汇编语言是软件开发语言最基础的形式。”


    我们将按照所示格式向计算机下发命令。你在这种语言中相加两个数字的代码顺序如下。


    # 汇编语言


    - 将 1 存储在内存位置 A

    - 将 2 存储在内存位置 B

    - 相加位置 A 和 B 的内容

    - 存储结果


    - 将数字 1 存储在内存位置 A

    - 将数字 2 存储在内存位置 B

    - 相加位置 A 和 B 的内容

    - 存储结果


    但我们如何做到这一点？在20 世纪 50 代，当计算机巨大且消耗大量功率时，你会将汇编代码转换为机器码。


    # 什么是汇编器和编译器？


