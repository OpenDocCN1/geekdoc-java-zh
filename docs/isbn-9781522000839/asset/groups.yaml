    \n# 总结\n\n“Java throw 关键字”用于声明异常。对于任何会“抛出”异常的方法，在调用它的方法中，必须使用 throws 来列出抛出的异常。\n\
    \n# 第 9 章 数学\n\nJava 拥有几个高级用法应用，包括处理物理学中的复杂计算、结构的建筑/设计、处理 Map 以及相应的经纬度等。\n\n所有应用都需要使用复杂的计算/方程，手动执行这些非常繁琐。在程序中，此类计算将涉及对数、三角函数、指数方程等的使用。\n\
