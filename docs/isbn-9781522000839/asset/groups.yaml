    \n考虑上一个示例中的同一个银行应用程序。我们需要开设两种账户类型，一个是储蓄账户，另一个是支票账户。\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_24_0)\n\
    \n让我们比较并研究如何从结构化和面向对象的角度处理代码。\n\n- 结构化方法：在结构化编程中，我们将创建两个函数——一个用于取款，另一个用于存款操作。因为这些函数的功能在账户之间保持一致。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_24_1)\n\n- OOP 方法：当使用 OOP 编程方法时。我们将创建两个类。每个类都有存款和取款函数的实现。这将是重复工作。\n\
    \n## 实现特权银行账户\n\n现在需求规范发生了变化，这在软件行业中非常常见。你被要求添加透支功能的特权银行账户。背景信息是，透支意味着你可以提取超过账户中可用余额的金额。\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_25_0)\n\n- 结构化方法：使用函数方法，我必须修改我的取款函数，而该函数已经过过测试并建立了基准。添加像下面这样的方法就可以处理新需求。\n\
    \n- OOP 方法：使用 OOP 方法，你只需要编写一个具有唯一取款函数实现的类类。我们从未触碰经过测试的代码片段。\n\n如果需求进一步发生变化呢？比如添加一个具有其独特存款需求的信用卡账户。\n\
    \n"
