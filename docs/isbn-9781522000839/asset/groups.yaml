    ## 如何处理异常


    到为止，我们已经了解了什么是异常。


    但将代码的失败归咎于环境问题并不是解决方案。你需要进行健壮性编程（Robust Programming），它会处理异常情况。这种代码被称为异常处理程序（Exception
    Handler）。


    在我们的示例中，良好的异常处理应该是：当服务器宕机时，连接到备份服务器。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_100_0.png)


    为了实现这一点，请输入你的代码来连接服务器（使用传统的 `if` 和 `else` 条件）。


    你将检查服务器是否宕机。


    如果是，编写连接到备份服务器的代码。


    这种使用 "if" 和 "else" 循环的这种组织方式在你的代码有多个需要处理的 Java 异常时是无效的。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_100_1.png)


    因此，Java 提供了内置的异常处理机制。


    - 1. 正常代码进入 TRY 块。

    - 2. 异常处理代码进入 CATCH 块。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_101_0.png)


    在我们的示例中，TRY 块将包含连接服务器的代码。CATCH 块将包含连接备份服务器的代码。


    如果服务器正常，CATCH 块中的代码将被忽略。如果服务器宕机，则会抛出异常，并执行 catch 块中的代码。


    ![](img/6f6cf42a75b6996d40290c9064bc348f_101_1.png)


    所以，这就是在 Java 中处理异常的方式。


    上述演示涵盖的要点总结——


    字体 健壮性编程：处理异常情况。

    - TRY 块：存放正常代码。

    - CATCH 块：存放异常处理代码。

    - 当异常发生时，执行 CATCH 块；若无异常则跳过 CATCH 块。

    - Java 异常处理机制比多个 `if-else` 嵌套更有效。


    '
