    class Y extends X{\n```\n\n```java\n  int c; // 类 Y 的新实例变量\n  public void m1(){\n\
    \    // 重写方法\n    System.out.println(\"This is method m1 of class Y\");\n  }\n\
    \  public void m2(){\n    super.m1();\n    System.out.println(\"This is method\
    \ m2 of class Y\");\n  }\n}\n```\n\n步骤 2) 保存、编译并运行代码。观察输出。\n\n步骤 3 ) 取消第 6-9 行的注释。保存、编译并运行代码。观察输出。\n\
    \n步骤 4) 取消第 10 行的注释。保存并编译代码。\n\n步骤 5) 错误 = ? 这是因为子类无法访问超类的私有成员。\n\n## 重载与重写的区别\n\
    \n**方法重载（Method overloading）**：方法发生在同一个类中，多个方法具有相同的方法名但不同的签名。例如：\n\n```java\n\
    void sum(int a, int b);\nvoid sum(float a, float b);\n```\n\n**方法重写（Method overriding）**：方法重写是在子类中重新定义超类的方法之一。在这种情况下，签名保持不变。例如：\n\
    \n```java\nclass X{\n  void sum(int a, int b){}\n}\n\nclass Y extends X{\n  void\
    \ sum(int a, int b){}\n}\n```\n\n## 静态与动态的区别\n\n**静态多态（Static Polymorphism）**：与方法重载有关。错误在编译时解决。\n\
    \n**动态多态（Dynamic Polymorphism）**：与方法重写有关。在变量调用重写的方法的情况下，要调用的方法由引用指向的对象决定。这只能在运行时确定。\n\
    \n## 第6章：内存\n\n## Java 栈与堆\n\nJVM 将内存分为：\n\n1. 堆 (Heap)\n2. 栈 (Stack)\n3. 代码 (Code)\n\
    4. 静态 (Static)\n\n这种内存划分是为了有效管理。\n\n- **code** 部分包含你的字节码。\n- **Stack** 内存包含方法、局部变量和引用变量。\n\
    - **Heap** 部分包含对象（可能包含引用变量）。\n- **Static** 部分包含静态数据/方法。\n\n在上述四个部分中，你最需要理解栈和堆的内存分配，因为它会影响你的编程工作。\n\
    \n## 局部变量与实例变量的区别\n\n实例变量定义在类内部，但在方法之外。\n\n```java\nclass Student{\n  int num;\
    \ // num 是实例变量\n  public void showData()\n}\n```\n\n局部变量定义在方法内部，包括方法参数。\n\n```java\n\
