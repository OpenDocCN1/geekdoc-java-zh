    \ new Thread();\n        guruthread2.start();\n    }\n\n@Override\npublic void\
    \ run() {\n    // TODO Auto-generated method stub\n}\n```\n\n# Advantages of multithread:\n\
    \n- The users are not blocked because threads are independent, and we can perform\
    \ multiple operations at times\n\n- As such the threads are independent, the other\
    \ threads won't get affected if one thread meets an exception.\n\n# Thread life\
    \ cycle in java\n\nLife cycle of a thread:\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_118_0.png)\n\
    \nThere are various stages in life cycle of thread as shown in above diagram:\n\
    \n- 1. **New**: In this phase, the thread is created using class \"Thread class\"\
    . It remains in this state till the program starts the thread. It is also known\
    \ as born thread.\n- 2. **Runnable**: In this page, the instance of the thread\
    \ is invoked with a start method. The thread control is given to scheduler to\
    \ finish the execution. It depends on the scheduler, whether to run the thread.\n\
    - 3. **Running**: When the thread starts executing then the state is changed to\
    \ \"running\" state. The scheduler selects one thread from the thread pool, and\
    \ it starts executing in the application.\n- 4. **Waiting**: This is the state\
    \ when a thread has to wait. As there are multiple threads running in the application,\
    \ there is a need for synchronization between threads. Hence, one thread has to\
    \ wait, till the other thread.\n- 5. **Dead**: This is the state when the thread\
    \ is terminated. The thread is in running state and as it completed.\n\nSome of\
    \ commonly used methods for threads:\n\n- 1. start(): This method starts the execution\
    \ of the thread and JVM calls the run() method. We will cover this in the below\
