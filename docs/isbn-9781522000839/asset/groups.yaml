    First, let''s understand what they are,


    +   **What is Class:** A class is an entity that determines how an object will
    behave and what the object will contain. In other words, it is a blueprint or
    a set of instruction to build a specific type of object.


    +   **What is an object:** An object is nothing but a self-contained component
    which consists of methods and properties to make a particular type of data useful.
    Object determines'
