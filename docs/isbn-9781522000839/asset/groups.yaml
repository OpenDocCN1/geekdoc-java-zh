    \n# Chapter: 7 Conditional Loops\n\n## How to Loop/Iterate an array in Java\n\n\
    Let us take the example using a String array that you want to iterate over without\
    \ using any counters.\n\nConsider a String array arrData initialized as follows:\n\
    \n`String[] arrData = {\"Alpha\", \"Beta\", \"Gamma\", \"Delta\", \"Sigma\"};`\n\
    \n![](img/6f6cf42a75b6996d40290c9064bc348f_93_1.png)\n\nAlthough, you might know\
    \ methods like finding the size of the array and then iterating through each element\
    \ of the array using the traditional for loop (counter, condition and increment),\
    \ we need to find a more optimized approach that will not use any counter.\n\n\
    This is the conventional approach of the \"for\" loop:\n\n```java\nfor(int i =\
    \ 0; i < arrData.length; i++) {\n    System.out.println(arrData[i]);\n}\n```\n\
    \nYou can see the use of the counter and then using it as the index for the array.\
    \ Java provides a way to use the \"for\" loop that will iterate through each element\
    \ of the array as shown below. Following will be the syntactical template:\n\n\
    ```java\nfor<DataType of array/List temp name : Array/List to be iterated> {\n\
    \    System.out.println(temp);\n}\n```\n\nHere is the code for the array that\
    \ we declared earlier:\n\n```java\nclass UsingForEach {\n    public static void\
    \ main(String[] args) {\n        String[] arrData = {\"Alpha\", \"Beta\", \"Gamma\"\
    , \"Delta\", \"Sigma\"};\n        // The optimized method of using for loop -\
    \ also called foreach loop\n        for (String strTemp : arrData) {\n       \
    \     System.out.println(strTemp);\n        }\n        System.out.println(\"\\\
    nForEach loop:\");\n    }\n}\n```\n\nYou can see the difference between the loops.\
    \ The code has reduced significantly. There is also no use of the index or the\
    \ counter in the loop. Ensure that the data type declared in foreach loop must\
    \ match the data type of array that you are iterating.\n\n> For each optimizes\
    \ your loops, saves some typing and of course your time!!\n\n## Switch Case\n\n\
    We use switches regularly in our lives. Yes, I am talking about switches we use\
    \ for lights and fans. As you see from below picture, each switch is assigned\
    \ to operate particular equipment. For example, in the picture, the first switch\
    \ is fan, next for light and so on. Thus, we can see that each switch can activate/deactivate\
    \ only one item.\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_95_0.png)\n\n###\
    \ What is Switch Case in Java?\n\nSimilarly, switch in java is a type of conditional\
    \ statement that activates only the matching condition out of given input. Let\
    \ us consider the example of a program where the user gives input as a numeric\
    \ value (only one digit in this example) and the output should be the number in\
    \ words. The integer variable `iSwitch` is the input for the switch to work. The\
    \ various available options (cases) are then written as `case <value>:` with a\
    \ colon. This will have the statement to be executed if the case and the input\
    \ to the switch match.\n\n### Java Switch Example\n\n```java\nclass SwitchBoard{\n\
    \    public static void main(String args[]) {\n        int iSwitch=4;\n      \
    \  switch(iSwitch) {\n            case 0:\n                System.out.println(\"\
    ZERO\");\n                break;\n            case 1:\n                System.out.println(\"\
    ONE\");\n                break;\n            case 2:\n                System.out.println(\"\
    TWO\");\n                break;\n            case 3:\n                System.out.println(\"\
    THREE\");\n                break;\n            case 4:\n                System.out.println(\"\
    FOUR\");\n                break;\n            default:\n                System.out.println(\"\
    Not in the list\");\n                break;\n        }\n    }\n}\n```\n\nNow what\
    \ are those two words break and default lying out there do?\n\n- \"break\" – will\
    \ simply break out from the switch block once a condition is satisfied.\n- \"\
    Default\" – This will be executed in case none of the conditions match the given\
    \ input. In the given example these are simple print statements, however they\
    \ can also refer to complex situations like calling a method etc.\n\n### What\
    \ if you do not provide a break?\n\nIn case the break is not provided, it will\
    \ execute the matching conditions as well as the default condition. Your logic\
    \ will go haywire if that occurs. I will leave it to the users to experiment without\
    \ using break.\n\n### Java Switch statement:\n\n- As a standard programming logic,\
    \ it can simply be achieved by using if...else conditions, but then it will not\
    \ be optimized for good programming practice nor does the code look readable.\n\
    - In programs involving more complex cases, scenarios will not be so simple and\
    \ would require calling several methods. Switch solves this problem and avoids\
    \ several nested if...else statements. Also, while using if...else, it is recommended\
    \ to use the most highly expected condition to be on top and then go ahead in\
    \ a nested manner.\n- SOME BENMARKING TESTS HAVE PROVEN THAT IN JAVA CASE OF HIGH\
    \ NUMBER OF ITERATIONS, THE SWITCH IS FASTER AS COMPARED TO IF...ELSE STATEMENTS.\n\
    \n### Points to Note\n\n- There is no limit on the number of cases you can have.\n\
    - Switch java can take input only as integers or characters.\n- The latest version\
    \ of Java8, also introduces the much awaited support for java switch strings statement.\n\
    \nSo now go ahead and wire your own switch board!!\n\n# Chapter 8 Exception Handling\n\
    \n## Java Exception Handling\n\nDisruption during the execution of the program\
    \ is referred as error or exception. In other words, an exception is any event\
    \ that interrupts the normal flow of execution. There are two types of errors:\n\
    \n- Compile time errors\n- Runtime errors\n\n![](img/6f6cf42a75b6996d40290c9064bc348f_98_0.png)\n\
    \nCompile time errors can be again classified into two types:\n\n| Compile time\
    \ error | Run time error |\n| :--- | :--- |\n| - Syntax Errors Example: Integer\
    \ int a; you mistakenly declared it as in a; for which compiler will throw an\
    \ error. | - A Runtime error is called Exceptions error. It is any event that\
    \ interrupts the normal flow of program execution. Example for exceptions are\
    \ arithmetic exception, Nullpointer exception, Divide by zero exception, etc.\
    \ Exceptions in java are something that are out of developers control. |\n\n-\
    \ Semantic Errors: Example: You have declared a variable (int a;) and after some\
    \ lines of code you again declare an integer as (int a;). All these errors are\
    \ highlighted when you compile the code. Suppose you have coded a program to access\
    \ the server. Things worked fine while you were developing the code. Please be\
    \ patient. The Video will load in some time. If you still face issue viewing video\
