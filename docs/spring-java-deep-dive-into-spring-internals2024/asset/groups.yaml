    ProxyFactoryBean. These options allow developers to customize aspects such as
    transaction propagation, isolation level, timeout, and rollback rules.


    # 7. Limitations and Considerations:


    Proxy-based transactional invocation applies only to external method calls, meaning
    that self-invocation within the same class does not trigger transactional behavior.
    Additionally, developers should be cautious when applying transactional annotations
