    # 2. Propagation Behavior:


    Spring provides various propagation behaviors, such as REQUIRED, REQUIRES_NEW,
    and NESTED, to govern transaction propagation between method invocations. These
    behaviors determine how transactions are handled within different transactional
    contexts, ensuring consistency and isolation.


    +   - REQUIRED: Executes within an existing transaction if available; otherwise,
    initiates a new transaction.

    - REQUIRES_NEW: Always initiates a new transaction, suspending the current transaction
    if present.

    - NESTED: Operates within a nested transaction if available; otherwise, behaves
    like REQUIRED.


