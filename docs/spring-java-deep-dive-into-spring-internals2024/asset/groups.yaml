    \ Scope):\n\n- WebSocket 范围在 Spring 4.0 中引入，允许 Bean 作用于 WebSocket 会话。\n- 作用范围为\
    \ WebSocket 的 Bean 每个 WebSocket 会话创建一次，并在会话关闭时销毁。\n\n## 7. 自定义作用范围 (Custom Scopes):\n\
    \n- Spring 还提供了灵活性，可以根据特定的应用程序需求定义自定义作用范围。\n- 开发者可以实现自定义作用范围接口并将其注册到应用上下文中以创建具有自定义生命周期语义的\
    \ Bean。\n\n理解并选择合适的 Bean 作用范围对于设计高效、可扩展且可维护的应用程序至关重要。在 Bean 需要共享状态或具有昂贵初始化逻辑的场景下，可能优先单例范围（singleton）以减少资源消耗并提高性能。相反，对于具有瞬态状态或会话特定数据的\
    \ Bean，原型范围（prototype）或会话范围可能更合适，以确保数据隔离并防止意外的副作用。\n\n考虑以下在 Spring MVC 控制器中定义请求作用范围\
    \ Bean 的示例：\n\n```java\nimport org.springframework.context.annotation.Scope;\n\
    import org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
    import org.springframework.web.bind.annotation.ResponseBody;\n\n@Controller\n\
    @Scope(\"request\")\npublic class MyController {\n\n    @GetMapping(\"/hello\"\
    )\n    @ResponseBody\n    public String sayHello() {\n        return \"Hello,\
    \ World!\";\n    }\n\n}\n```\n\n在此示例中，**MyController** 类被标记为 **@Scope(\"request\"\
    )**，表示该控制器的实例应该每个 HTTP 请求创建一次。这确保了对 **/hello** 端点的每个请求都接收到控制器的全新实例，防止了潜在的线程安全问题。\n\
    \n总结来说，“理解高级 Bean 作用范围”为开发者提供了知识和专业技能，能够有效利用 Spring 丰富的 Bean 作用范围。通过为每个 Bean 选择合适的作用范围，开发者可以优化资源使用、有效管理状态并设计健壮且可扩展的应用程序。无论是确保\
    \ Web 应用中的数据隔离，还是管理企业级系统中的共享资源，掌握 Bean 作用范围对于使用 Spring 框架构建高质量、可维护的软件至关重要。\n\n\
    # 第二章\n\n# Spring 应用上下文内部\n\n## 揭示 ApplicationContext 层次结构的复杂性\n\n“探索 ApplicationContext\
    \ 层次结构的错综之处”深入探讨了 Spring 框架中 ApplicationContext 层次结构的详细结构和功能。ApplicationContext\
    \ 是负责管理 Bean、提供配置以及支持依赖注入、事件处理和资源管理等功能的核心组件。理解 ApplicationContext 实例的层次结构对于构建可扩展和模块化的\
    \ Spring 应用程序至关重要。\n\n从本质上说，ApplicationContext 代表 Spring 反转控制（IoC）容器的核心。该容器处理\
    \ Spring 内部 Bean 的实例化、配置和管理。然而，在更复杂的场景中，多个 ApplicationContext 实例可能会按层次组织，以增强模块化、封装性和资源管理。\n\
    \nApplicationContext 实例的层次结构促进了父子关系的建立。在这些关系中，子上下文从其父上下文继承 Bean 定义和配置。这种层次结构允许在不同上下文之间共享公共\
    \ Bean 和资源，同时允许每个上下文定义其独特的 Bean 和配置。\n\nApplicationContext 层次结构的关键优势之一是能够将应用程序组件分离到逻辑单元中，每个单元都有自己独立的上下文。例如，在\
    \ Web 应用中，根上下文（root context）可能存在于应用级别，而多个子上下文则对应于不同的模块或层。\n\n考虑以下 Web 应用中 ApplicationContext\
    \ 层次结构的示例：\n\n```java\n@Configuration\n@ComponentScan(basePackages = \"example\"\
    )\npublic class RootApplicationConfig {\n    // 此处存放公共 Bean\n}\n```\n\n在这里，**RootApplicationConfig**\
    \ 代表根上下文的配置。同样，子上下文的定义如下：\n\n```java\n@Configuration\n@Import(RootApplicationConfig.class)\n\
    public class WebApplicationConfig {\n    // 此处存放 Web 特有的 Bean\n}\n```\n\n在这种场景下，**RootApplicationConfig**\
    \ 作为父上下文，而 **WebApplicationConfig** 作为子上下文。子上下文从父上下文继承 Bean 定义和配置。\n\nApplicationContext\
    \ 层次结构在资源管理中也起着关键作用。每个上下文都可以拥有自己的组资源，如属性文件、数据库连接和 JNDI 资源，提供了封装并防止了应用程序不同部分之间的资源冲突。\n\
    \n"
