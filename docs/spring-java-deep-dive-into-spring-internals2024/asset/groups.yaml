    \ Spring 管理的组件，也是事务型服务。\n\n## 使用元注解简化配置：\n\n元注解通过减少对重复注解和配置设置的需求来简化配置。开发者不再需要在单个类上标记多个注解，而是可以应用一个包含所需配置的单个元注解。\n\
