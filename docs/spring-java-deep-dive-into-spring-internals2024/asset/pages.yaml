  md: "```\n@Configuration\n@ComponentScan(basePackages = \"com.example.controllers\"\
    )\npublic class WebApplicationContextConfig {\n    // Configuration for the web\
    \ application context\n}\n```\n\nSimilarly, the WebApplicationContextConfig class\
    \ represents the configuration for the web application context. It scans the com.example.controllers\
    \ package for controller components to be registered within the web context.\n\
    \nIn this scenario, the RootApplicationContextConfig acts as the parent context,\
    \ while WebApplication-ContextConfig serves as the child context. The child context\
