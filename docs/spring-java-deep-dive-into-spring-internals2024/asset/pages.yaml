  md: '# Understanding Advanced Bean Scopes


    "Understanding Advanced Bean Scopes" delves into the nuanced concepts surrounding
    bean scopes in the Spring Framework, providing developers with insights into how
    beans are managed and accessed within the application context. Mastery of bean
    scopes is essential for designing applications with the appropriate lifecycle
    and managing resources efficiently.


    In Spring, bean scope determines the lifecycle and visibility of bean instances
    within the application context. Different scopes cater to diverse requirements,
    allowing developers to tailor the behavior of beans to suit specific use cases.
    While the singleton and prototype scopes are widely used, Spring offers several
    advanced scopes that cater to more specialized scenarios.


    # 1. Singleton Scope:


    +   - By default, beans in Spring are singletons, meaning that the IoC container
    creates a single instance of the bean and shares it across all requests for that
    bean.


    +   - Singleton beans are cached within the application context and are shared
    among clients requesting the bean, ensuring consistency and resource efficiency.


    # 2. Prototype Scope:


    +   - Beans with prototype scope are instantiated anew each time they are requested
    from the application context.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   - This scope is useful for beans that have stateful behavior or require
    a fresh instance on each invocation, such as session-specific beans in web applications.


    # 3. Request Scope:


    +   - Beans scoped as request are created once per HTTP request and are destroyed
    at the end of the request.

    - This scope is commonly used for beans that hold request-specific data, such
    as form-controllers or request handlers in web applications.


    # 4. Session Scope:


    +   - Session-scoped beans are created once per HTTP session and are destroyed
    when the session expires or is invalidated.

    - This scope is ideal for beans that store session-specific data, such as user
    preferences or shopping cart items.


    # 5. Application Scope:


    +   - Beans with application scope are created once for the entire lifecycle of
    the web application and are shared across all sessions and requests.

    - This scope is suitable for beans that maintain global state or configuration
    settings that remain constant throughout the application''s runtime.


    # 6. WebSocket Scope:


    +   - Introduced in Spring 4.0, WebSocket scope allows beans to be scoped to a
    WebSocket session.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '+   - Beans with WebSocket scope are created once per WebSocket session and
    are destroyed when the session closes.


    # 7. Custom Scopes:


    +   - Spring also provides the flexibility to define custom scopes tailored to
    specific application requirements.


    +   - Developers can implement custom scope interfaces and register them with
    the application context to create scoped beans with custom lifecycle semantics.


    Understanding and selecting the appropriate bean scope is critical for designing
    applications that are efficient, scalable, and maintainable. In scenarios where
    beans require shared state or have expensive initialization logic, singleton scope
    may be preferred to minimize resource usage and improve performance. Conversely,
    for beans with transient state or session-specific data, prototype or session
    scope may be more suitable to ensure data isolation and prevent unintended side
    effects.


    Consider the following example of defining a bean with request scope in a Spring
    MVC controller:


    java


    ```

    import org.springframework.context.annotation.Scope;

    import org.springframework.stereotype.Controller;

    ```'
