  \n## 引言\n\nSQL，即结构化查询语言，是与关系型数据库通信的主要语言。本书的目标是作为这一基础语言的一份实用入门指南。\n\n在另一个平行宇宙中，这本书的标题可能是\
  \ `SQL 逻辑`。这是因为，与所有计算机语言一样，SQL 语言更多是与冷酷的逻辑有关，而不是英语词汇。尽管如此，出于多种原因，标题中保留了“语言”一词。首先，SQL\
  \ 中某种基于语言的语法使其与其他计算机语言区别来。与其他语言不同，SQL 使用了许多普通单词（如 `WHERE` 和 `FROM`）作为其语法中的关键字。\n\
  \n本着 SQL 中嵌入的语言精神，我们在主题顺序中特别强调了“语言”。通过这本书，你将像学习英语一样学习 SQL。SQL 关键字按照逻辑顺序呈现，从简单到复杂。从本质上说，这是同时处理语言和逻辑的一种尝试。\n\
  \n要学习任何语言，必须从听和记忆构成发音基础的实际单词开始。同时，这些词具有必须理解的特定含义。在 SQL 的情况下，其含义与逻辑有很大关系。\n\n坚持使用\
  \ `SQL 语言` 而不是 `SQL 逻辑` 作为标题的最后一个原因是它听起来更好听。虽然在计算机语言书籍中可能没有多少文学辞藻，但希望“语言”一词的出现能为这个毕竟非常有趣的主题增加一些额外的热情。\n\
  \n### 主题与特征\n\n即使你还并不熟悉 SQL，也可以说它是一门包含许多组件和特征的复杂语言。在本书中，我们将关注一个主要主题：\n\n• 如何使用 SQL\
  \ 从数据库中检索数据\n\n在较小范围内，我们还将涵盖：\n\n• 如何更新数据库中的数据\n• 如何构建和维护数据库\n• 如何设计关系型数据库\n• 检索数据后显示数据的策略\n\
  \n许多特征使得本书在 SQL 入门书籍中脱颖而出：\n\n• **在阅读正文时，你不需要下载软件或坐在电脑前。**\n\n我们的意图是提供只需通过阅读书籍即可理解的\
  \ SQL 使用示例。文中包含了小型数据样本，让你能够清晰地看到 SQL 语句是如何运作的。\n\n• **采用基于语言的方法，使你能够像学习英语一样学习 SQL。**\n\
  \n主题按照直观且符合逻辑的顺序组织。SQL 关键字逐一介绍，让你在遇到新单词和新概念时，能够在你先有的理解基础上不断进阶。\n\n• **本书涵盖了三个广泛使用的数据库的语法：Microsoft\
  \ SQL Server、MySQL 和 Oracle。**\n\n如果这些数据库之间存在任何差异，Microsoft SQL Server 的语法将会在正文中。特殊的“数据库差异”（Database\
  \ Differences）侧边栏将显示并解释 MySQL 或 Oracle 语法的任何变化。\n\n• **重点关注 SQL 用于检索数据的相关方面。**\n\
  \n这种方法对于那些仅需要配合报告工具使用 SQL 的人非常有用。在最后一章，我们将超越纯 SQL，涵盖检索数据后显示数据的策略，包括如何使用交叉表报告（crosstab\
  \ reports）和透视表（pivot tables）的想法。在现实世界中，这类工具可以大幅减轻 SQL 开发人员的负担，并为最终用户提供更大的活性。\n\n\
