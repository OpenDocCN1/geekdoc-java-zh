    # CHANGING THE DRAWING COLOR


    By default, when you call fillrect, JavaScript draws a black rectangle. To use
    a different color, you can change the fillstyle property of the drawing context.
    When you set fillstyle to a new color, everything you draw will be drawn in color
    until you change fillstyle again.


    The easiest way to set a color for fillstyle is to give it the name of a color
    as a string. For example:


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    ctx.fillStyle = "Red";

    ctx.fillRect(0, 0, 100, 100);

    ```


    At we tell the drawing context that everything we draw from now on should be colored
    red. Running this code should draw a bright red square on the screen, as shown
    in Figure 13-3.'
