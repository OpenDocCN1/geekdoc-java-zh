  md: '# USING MATH.RANDOM()


    We can produce random numbers using a special method called Math.random(), which
    returns a random number between 0 and 1 each time it''s called. Here''s an example:


    ```

    Math.random();

    0.8945409457664937

    Math.random();

    0.3697543195448816

    Math.random();

    0.48314980138093233

    ```


    It''s important to note that Math.random() always returns a number less than 1
    and will never return 1 itself.

    If you want a bigger number, just multiply the result of calling Math.random().
    For example, if you wanted numbers between 0 and 10, you would multiply Math.random()
    by 10:


    ```

    Math.random() * 10;

    7.648027329705656

    Math.random() * 10;

    9.7569504534421861

    Math.random() * 10;

    0.21483442978933454

    ```


    # ROUNDING DOWN WITH MATH.FLOOR()


    We can''t use these numbers as array indexes, because indexes have to be whole
    numbers with nothing after the decimal point. To fix that, we need another method
    called Math.floor(). This takes a number and rounds it down to the whole number
    below it (basically getting rid of everything after the decimal point).


    ```

    Math.floor(3.7463463);

    3

    Math.floor(9.9999);

    9

    Math.floor(0.793423451963426);

    0

    ```


    We can combine these two techniques to create a random index. All we need to do
    is multiply Math.random() by the length of'
