  md: '# BUILDING THE ARRAY WITH PUSH


    Let''s write some code that would do exactly that. We start off by creating an
    empty array. The array starts off empty because you don''t know what landmarks
    you''ll see until you actually start walking to your friend''s house. Then, we''ll
    push a description of landmark onto the end of the array. Then, when it''s time
    to go home, we''ll pop each landmark off the array.


    ```

    var landmarks = [];

    landmarks.push("My house");

    landmarks.push("Front path");

    landmarks.push("Flickering streetlamp");

    landmarks.push("Leaky fire hydrant");

    landmarks.push("Fire station");

    landmarks.push("Cat rescue center");

    landmarks.push("My old school");

    landmarks.push("My friend''s house");

    ```


    ![](img/e5791ceef5f489e724ff12c45401c333_81_0.png)


    Here we create an array named landmarks and then use push to store all the landmarks
    you pass on the way to your friend''s house.


    # GOING IN REVERSE WITH POP


    Once you arrive at your friend''s house, you can inspect your array of landmarks.
    Sure enough, the first item is "My house", followed by "Front path", and so on
    through the end of the array, with the final item "My friend''s house". When it''s
    time to go home, all you need to do is pop off the items one by one, and you''ll
    know where to go next.


    ```

    landmarks.pop();

    "My friend''s house"

    landmarks.pop();

    "My old school"

    landmarks.pop();

    "Cat rescue center"

    landmarks.pop();

    "Fire station"

    landmarks.pop();

    "Leaky fire hydrant"

    ```'
