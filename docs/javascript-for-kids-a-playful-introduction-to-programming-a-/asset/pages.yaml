  md: "As mentioned earlier in this chapter, the output of a function is called the\
    \ return value. When you call a function that returns a value, you can use that\
    \ value in the rest of your code (you could save a return value in a variable,\
    \ pass it to another function, or simply combine it with other code). For example,\
    \ the following line of code adds 5 to the return value of the call to Math.floor(1.2345):\n\
    \n![](img/e5791ceef5f489e724ff12c45401c333_156_0.png)\n\n```\n5 + Math.floor(1.2345);\n\
    ```\n\nMath.floor is a function that returns the number you pass to it, rounded\
    \ down to the nearest whole number. When you see a function call like Math.floor(1.2345),\
    \ imagine replacing it with the return value of that function, which is the number\
    \ 1.\n\nLet's create a function that returns a value. The function double takes\
    \ the argument number and returns the result of number * 2. In other words, the\
    \ value returned by this function is twice the number supplied as its argument.\n\
    \n```\ndouble double = function(number) {\n  return number * 2;\n};\n```\n\nTo\
    \ return a value from a function, use the keyword return, followed by the value\
    \ you want to return. At, we use the return keyword to return the value number\
    \ * 2 from the double function. Now we can call our double function to double\
    \ numbers:\n\n```\ndouble(3);\n```\n\nHere, the return value (6) is shown on the\
    \ second line. Even though functions can take multiple arguments, they can return\
    \ only one value. If you don't tell the function to return anything, it will return\
    \ undefined."
  merge: -1
  pgno: 156
- img_proc: true
  md: '# USING FUNCTION CALLS AS VALUES


    When you call a function from within a larger piece of code, the function''s return
    value is used wherever that call was placed. For example, let''s use our double
    function to determine the result of doubling two numbers and then adding the results:


    ```

    double(5) + double(6);

    22

    ```


    In this example, we call the double function twice and add the two return values
    together. You can think of the call of double(5) as the value 10 and the call
    double(6) as the value 12.

    You can also pass a function into another function as an argument, and the function
    call will be substituted with its return value. In this next example we call double,
    passing the result of calling double with 3 as an argument. We replace double(3)
    with 6 so that double(double(3)) simplifies to double(6), which then simplifies
    to 12.


    ```

    double(double(3));

    12

    ```


    Here''s how JavaScript calculates this:


    ```

    double(double(3));

    ```


    +   1 double(3 * 2)

    2 double(6)

    3 6 * 2


    The body of the double function returns number * 2, so ① we replace double(3)
    with 3 * 2. ② we replace 3 * 2 with 6. Then at ③, we do the same thing and replace
    double(6) with 6 * 2. Finally, at ④, we can replace 6 * 2 with 12.'
  merge: -1
