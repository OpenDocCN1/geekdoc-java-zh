  md: 'You can use an object as a way of linking a string and a value together. In
    this case, the string would be your friend''s name, and the value would be the
    amount of money he or she owes you. Let''s have a look.


    ```

    var owedMoney = {};

    wowedMoney["Jimmy"] = 5;

    wowedMoney["Anna"] = 7;

    wowedMoney["Jimmy"];

    wowedMoney["Jinen"];\undefined

    ```


    At 1, we create new empty object called owedMoney. At 2, we assign the 5 to the
    key "Jimmy". We do the same thing at 3, assigning the 7 to the key "Anna". At
    4, we ask for the value associated with the key "Jimmy", which is 5. Then we ask
    for the value associated with the key "Jinen", which is undefined because we didn''t
    set it.


    ![](img/e5791ceef5f489e724ff12c45401c333_99_0.png)


    Now let''s imagine that Jimmy borrows some money (say, $3). We can update our
    object and add 3 to the amount Jimmy owes with the plus-equals operator (+=) that
    you saw in Chapter 2.


    ```

    owedMoney["Jimmy"] += 3;

    wowedMoney["Jimmy"];

    ```


    This is like saying owedMoney["Jimmy"] = owedMoney["Jimmy"] + 3. We can also look
    at the entire object to see how much money Jimmy owes us:


    ```

    owedMoney;

    { Jimmy: 8, Anna: 7 }

    ```'
