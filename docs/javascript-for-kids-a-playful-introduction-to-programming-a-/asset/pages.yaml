  md: '# DRAWING LOTS OF CIRCLES WITH A FUNCTION


    If you just want to draw circles, the arc method is a bit complicated. For circles,
    you''re always going to start the arc at 0 and end at π × 2, and the direction
    (clockwise or counterclockwise) doesn''t matter. Also, to actually draw the circle
    you always need to call ctx.beginPath and ctx.stroke before and after the arc
    method. We can make a function to draw circles that lets ignore details so that
    we have to supply only the x, y, and radius arguments. Let''s do that now.


    ```

    var circle = function (x, y, radius) {

    ctx.beginPath();

    ctx.arc(x, y, radius, Math.PI * 2, false);

    ctx.stroke();


    ```


    As with the arc method, inside this function the first thing we have to do is
    call ctx.beginPath to tell the canvas we want to draw a path. Then, we call ctx.arc,
    passing the x, y, and radius variables from the function arguments. As before,
    we use 0 for the start angle, Math.PI * 2 for the end angle, and false to draw
    the circle clockwise.


    Now that we have this function, we can draw lots of circles by simply filling
    in the center coordinates and radius as arguments. For example, this code would
    draw some concentric circles:


    ```

    ctx.lineWidth = 4;


    ctx.strokeStyle = "Red";

    circle(100, 100, 10);


    ctx.strokeStyle = "Orange";

    circle(100, 100, 20);


    ctx.strokeStyle = "Yellow";

    circle(100, 100, 30);


    ctx.strokeStyle = "Green";

    circle(100, 100, 40);


    ctx.strokeStyle = "Blue";

    circle(100, 100, 50);

    ```'
