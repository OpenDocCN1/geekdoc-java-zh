  md: "# MOVING THE BALL\n\nTo move the ball, we just have to update the x and y properties\
    \ based on the current speed. We'll do that using the following move method:\n\
    \n```\nBall.prototype.move = function () {\n  this.x += this.xSpeed;\n  this.y\
    \ += this.ySpeed;\n};\n```\n\nWe use this.x += to add the horizontal speed of\
    \ the ball to this. Then this.y += this.ySpeed adds the vertical speed to this.y.\
    \ For example, at the beginning of the animation, the ball will be at the point\
    \ (100, 100), with this.xSpeed set to -2 and this.ySpeed set to 3. When we call\
    \ the move method, it subtracts 2 from the x value and adds 3 to the y value,\
    \ which places the ball at the point (98, 103). This moves the ball's location\
    \ to the left 2 pixels and down 3 pixels, as illustrated in Figure 14-6.\n\n![](img/e5791ceef5f489e724ff12c45401c333_255_0.png)\n\
    \nFigure 14-6: The first three steps of the animation, showing how the x and y\
    \ properties change\n\n# BOUNCING THE BALL\n\nAt every step of the animation,\
    \ we check to see if the ball hit one of the walls. If it has, we update the xSpeed\
    \ or ySpeed property by negating it (multiplying it by -1). For example, if the\
    \ ball hits the bottom wall, we negate this.ySpeed. So if this.ySpeed is 3, negating\
    \ it will make it -3. If this.ySpeed is -3, negating it will set it back to 3."
  merge: -1
  pgno: 255
- img_proc: true
  md: "![](img/e5791ceef5f489e724ff12c45401c333_256_0.png)\n\nWe'll call this method\
    \ checkCollision, because it checks to see if the ball has collided with (hit)\
    \ the wall.\n\n```\nBall.prototype.checkCollision = function () {\n  if (this.x\
    \ < 0 || this.x > 200) {\n    this.xSpeed = -this.xSpeed;\n  }\n  if (this.y <\
    \ 0 || this.y > 200) {\n    this.ySpeed = -this.ySpeed;\n  }\n};\n```\n\nAt 0,\
    \ we determine whether the ball has hit the left wall or the right wall by checking\
    \ to see if its x property is either less than 0 (meaning it hit the left edge)\
    \ or greater than 200 (meaning it hit the right edge). If either of these is true,\
    \ the ball has started to move off the edge of the canvas, so we have to reverse\
    \ its horizontal direction. We do this by setting this.xSpeed equal to -this.xSpeed.\
    \ For example, if this.xSpeed was -2 and the ball hit the left wall, this.xSpeed\
    \ would become 2.\n\nAt 2, we do the same thing for the top and bottom walls.\
    \ If this.y is less than 0 or greater than 200, we know the ball has hit the top\
    \ wall or the bottom wall, respectively. In that case, we set this.ySpeed to be\
    \ equal to -this.ySpeed.\n\nFigure 14-7 shows what happens when the ball hits\
    \ the left wall. this.xSpeed starts as -2, but after the collision it is changed\
    \ to 2. However, this.ySpeed remains unchanged at 3."
