  md: 'argument A value that can be passed into a function.


    array A list of JavaScript values. In an array, each value has an index, which
    is the numbered position of value in the array.

    The first value is at index 0, the next value is at index 1, and so on.


    atribute A key-value pair in an HTML element. You can use HTML attributes to control
    certain aspects of an element, like where the element links to or the size of
    the element.


    Boolean A value that can be true or false.


    call To execute or run a function. To call functions in JavaScript, you enter
    the function name followed by a pair of parentheses(with any arguments inside
    the parentheses).


    camel case A common way to name variables in which you capitalize the first letter
    of each word (except the first word) and then join all the words to make one long
    word, like so: myCaseVariable.


    comment Text in a program that is not executed by the JavaScript interpreter—comments
    are just there to describe the program for the person reading it.


    conditional statement A statement that executes code checking a condition. If
    the condition is true, the statement will execute one bit of code; if the condition
    is false, it will execute a different bit of code or stop altogether. Examples
    include state-ments and if...else statements.


    constructor A kind of function that’s used to create objects objects that they
    share build-in properties.


    control structure A way to control when a piece of code is run and how often it’s
    run. Examples include conditional statements (which control code is run by checking
    a condition) and loops (which repeat a piece of code a certain number of times).


    data The information we store and manipulate in computer programs.


    decrement To decrease the value of a variable (usually by 1).


    dialog A small pop-up window. You can use JavaScript to open different kinds of
    dialogs in a browser, such as an alert (to display

    message) or a prompt (to ask a question and receive input).'
