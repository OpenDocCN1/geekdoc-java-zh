  md: '# SYNTAX


    Our program includes lots of symbols, including parentheses (), semicolons; curly
    brackets {}, plus signs +, and a few that might seem mysterious at first (like
    var and console.log). These are all part of JavaScript''s syntax—that is, JavaScript''s
    rules for how to combine symbols and words to create working programs.


    When you''re learning a new programming language, one of the trickiest parts is
    getting used to the rules for how to write different kinds of instructions to
    the computer. When you''re first starting out, it''s easy to forget when to include
    parentheses, or to mix up the order in which you need to include certain values.
    But as you practice, you''ll start to get the hang of it.


    In this book, we''ll go slow and steady, introducing new syntax little by little
    that you can build increasingly powerful programs.


    # COMMENTS


    The first line in our cats program is this:


    ```

    // Draw as many cats as you want!

    ```


    This is called a comment. Programmers use comments to make it easier for other
    programmers to read and understand their code. The computer ignores comments completely.
    Comments in JavaScript start with two forward slashes (//). Everything following
    the slashes (on the same line) is ignored by the JavaScript interpreter, so the
    comments don''t have any effect on how a program is executed—they are just to
    provide a description.


    In the code in this book, you''ll see comments that describe what''s happening
    in the code. As you write your own code, add your own comments. Then when you
    look at your code later, your comments will remind you how the code works and
    what''s happening in each step.


    There''s another code comment on the last line of our program. Remember, everything
    after that // isn''t run by the computer!


    ```

    drawCats(10); // You can put any number here instead of 10.

    ```


    ```

    Code comments can be on their own line, or they can come after your code. If you
    put the // at the front, like this:

    ```


    ```

    // drawCats(10);

    ```'
