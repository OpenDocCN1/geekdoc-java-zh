  md: "# WHILE LOOPS\n\nThe simplest kind of loop is a while loop. A loop repeatedly\
    \ executes its body until a particular condition stops being true. By writing\
    \ a while loop, you are saying, “Keep doing this while this condition is true.\
    \ Stop when the condition becomes false.\"\n\nAs Figure 6-4 shows, while loops\
    \ start with the while keyword, followed by a condition in parentheses and then\
    \ a body is checked\n\nThis condition is checked each time the loop repeats.\n\
    \n```\nwhile (condition) {\n  console.log(\"Do something\");\n  i++;\n}\n```\n\
    \nSome code to run and repeat as long as the condition is true (something in here\
    \ should change things so the condition is eventually false)\n\nFigure 6-4: The\
    \ general structure of a while loop\n\nLike an if statement, the body of a while\
    \ loop is executed if the condition is true. Unlike an if statement, after the\
    \ body is executed, the condition is checked again, and if it's still true, the\
    \ body runs again. This cycle goes on until the condition is false.\n\n# COUNTING\
    \ SHEEP WITH A WHILE LOOP\n\nYou're having trouble sleeping and you want to count\
    \ sheep. But you're a programmer, why not write a program to count sheep for you?\n\
    \n```\nvar sheepCounted = 0;\nwhile (sheepCounted < 10) {\n  console.log(\"I have\
    \ counted \" + sheepCounted + \" sheep!\");\n  sheepCounted++;\n}\nconsole.log(\"\
    Zzzzzzzzz\");\n```"
