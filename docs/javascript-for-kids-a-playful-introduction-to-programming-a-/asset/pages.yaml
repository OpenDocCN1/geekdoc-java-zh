  md: '# WHAT YOU LEARNED


    In this chapter, you learned the basics of object-oriented programming in JavaScript,
    including how to create constructors to build new objects and how to modify the
    prototype property of those constructors to share methods between objects.


    In-oriented programs, most functions are written as methods. For example, to draw
    the car, we call the draw method on the car, and to move the car to the right,
    we call the move method. Constructors and prototypes are JavaScript''s built-in
    way of letting you create objects that share the same set of methods, but there
    are many ways to write object-oriented JavaScript. (For more on object-oriented
    JavaScript, see Nicholas C. Zakas''s Principles of Object-Oriented JavaScript
    [No Starch Press, 2014])


    Writing JavaScript in an object-oriented way can help you structure your code.
    Having well-structured code means when you come back to it to make changes, it
    should be easier to figure out how your program works if you don''t remember (this
    is particularly important with bigger programs or when you start to work with
    other programmers who may need to access your code). For example, in the final
    project in this book, we''ll build a Snake game that requires quite a bit of code,
    and we''ll use objects and methods to organize our game and handle a lot of the
    important functionality.


    In the next chapter, we''ll go over how to draw and animate lines and shapes on
    a web page using the canvas element.


    # PROGRAMMING CHALLENGES


    Try these challenges to practice working with objects and prototypes.


    #1: DRAWING IN THE CAR CONSTRUCTOR


    Add a call to the draw method from inside the car constructor so that car objects
    automatically appear in the browser as soon as you create them.


    (continued)'
