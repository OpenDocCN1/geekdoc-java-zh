    # ADDING THE CHECKCOLLISION METHOD


    Each time we set a new location for the snake''s, we have to check for collisions.
    Collision detection, a very common step in game mechanics, is often one of the
    more complex aspects of game programming. Fortunately, it''s relatively straightforward
    in our Snake game.


    We care about two types of collisions in our Snake game: collisions with the wall
    and collisions with the snake itself. A wall collision happens if the snake hits
    a wall. The snake can collide with itself if you turn the head so that it runs
    into the body. At the start of the game, the snake is too short to collide with
    itself, but after eating a few apples, it can.


    Here is the checkCollision method:


    ```

    Snake.prototype.checkCollision = function (head) {

    var leftCollision = (head.col === 0);

    var topCollision = (head.row === 0);

    var rightCollision = (head.col === widthInBlocks - 1);

    var bottomCollision = (head.row === heightInBlocks - 1);


    var wallCollision = leftCollision || topCollision ||

    rightCollision || bottomCollision;


    selfCollision = false;

    for (var i = 0; i < this.segments.length; i++) {

    if (head.equal(this.segments[i])) {

    selfCollision = true;

    }

    }

    return wallCollision || selfCollision;

    ```'
