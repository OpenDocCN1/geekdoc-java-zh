  md: '# REAL PROGRAMMING.

    REAL EASY.


    ILLUSTRATIONS BY MIRAN LIPOVAČ


    JavaScript is the programming language of the Internet, the secret sauce that
    makes the Web awesome, your favorite sites interactive, and online games fun!


    JavaScript for Kids is a lighthearted introduction that teaches programming essentials
    through patient, step-by-step examples paired with funny illustrations. You will
    begin with the basics, working with strings, arrays, and loops, and then move
    on to more advanced topics, like building interactivity with jQuery and drawing
    graphics with Canvas.


    With visual examples like bouncing balls, animated bees, and racing cars, you
    can really see what you''re programming. Each chapter builds on the last, and
    programming challenges at the end of each chapter will stretch your brain and
    inspire your amazing programs. Make something cool with JavaScript today!


    # ABOUT THE AUTHOR


    Nick Morgan is a frontend engineer at Twitter. He loves all programming languages
    but has a particular soft spot for JavaScript. Nick lives in San Francisco (the
    foggy part) with his fiancée and his fluffy dog, Pancake. He blogs at skillrick.com.


    Along the way, you will write games such as Find the Buried Treasure, Hangman,
    and Snake. You''ll also learn to:


    +   - Create functions to organize and reuse your code

    - Write and modify HTML to create dynamic web pages

    - Use the DOM and jQuery to make web pages react to user input

    - Use the Canvas element to draw and animate graphics

    - Program real user-controlled games with collision detection and score keeping


