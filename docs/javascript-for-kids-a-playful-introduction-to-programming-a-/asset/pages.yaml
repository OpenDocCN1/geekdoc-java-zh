    # # 13

    THE CANVAS ELEMENT


    JavaScript isn’t all about playing with text and numbers. You can also use JavaScript
    to draw pictures with the HTML canvas element, which you can think of as a blank
    canvas or sheet of paper. You can draw almost anything that you want on this canvas,
    such as lines, shapes, and text. The only limit is your imagination!'
