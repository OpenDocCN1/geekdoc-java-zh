  md: 'document object model (DOM) The way that browsers organize and keep track of
    HTML elements on a web page. These elements are organized in a treelike structure
    called the DOM tree. JavaScript and jQuery provide methods that work with the
    DOM to create and modify elements.


    element Part of an HTML page, such as a header, a paragraph, or the body. An element
    is marked by start and end tags (which determine what type of element it is) and
    includes everything in between. The DOM tree is made up of these elements.


    event An action that happens in the browser, such as a mouse click or a keyboard
    press by the user. We can detect and respond to these events with event handlers.


    event handler A function that is called whenever a certain event happens in a
    certain HTML element. For example, in Chapter 11''s “Find the Buried Treasure!”
    game, we create an event handler function that is called whenever the user clicks
    on a map image.


    execute To run a piece of code, such as a program or function.


    function A piece of code that bundles multiple statements so that they are all
    executed together. A function makes it easy to repeat a certain action in different
    parts of a program. A function can take arguments as input, and it will output
    a return value.


    increment To increase the value of a variable (usually by 1).


    index A number that indicates the position of a value inside an array. The index
    can be used to access a specific value in an array.


    infinite loop A loop that never stops repeating (often causing the interpreter
    to crash). This error can occur if the conditions of a loop are set incorrectly.


    interpreter A piece of software that reads and runs code. Web browsers contain
    a JavaScript interpreter, which we use to run our JavaScript throughout this book.


    jQuery A JavaScript library that provides many useful methods for modifying and
    working with DOM elements on a web page.'
