    \ every frame.\n\n![](img/e5791ceef5f489e724ff12c45401c333_254_0.png)\n\nFigure\
    \ 14-5 shows the starting position of the ball and its direction of movement.\n\
    \n# DRAWING THE BALL\n\nNext we add a draw method to draw the ball. We will add\
    \ this method to the Ball prototype so that any objects created by the Ball constructor\
    \ can use:\n\n```\nvar circle = function (x, y, radius, fillCircle) {\n  ctx.beginPath();\n\
    \  ctx.arc(x, y, radius, 0, Math.PI * 2, false);\n  if (fillCircle) {\n    ctx.fill();\n\
    \  } else {\n    ctx.stroke();\n  }\n}\n```\n\n```\nBall.prototype.draw = function\
    \ () {\n  circle(this.x, this.y, 3, true);\n}\n```\n\nFirst we include our circle\
    \ function, the same one we used earlier in “A New circle Function” on page 222.\
    \ We then add the draw method to Ball.prototype. This method simply calls circle(this.x,\
    \ this.y, 3, true) to draw a circle. The circle's center will be at (this.x, this.y):\
    \ the location of the ball. It will have a radius of 3 pixels. We pass true as\
    \ the final argument to tell the circle to fill the circle."
