  md: "# ADDING THE EQUAL METHOD\n\nIn our game, we'll need to know whether two blocks\
    \ are in the\nsame location. For example, if the apple and the snake's head are\n\
    in the same location, that means the snake has eaten the apple.\n\nOn the other\
    \ hand, if the snake's head and tail are in the same\nlocation, then the snake\
    \ has collided with itself.\n\nTo make it easier to compare block locations, we'll\
    \ add a\nmethod, equal, to the Block constructor prototype. When we call\nequal\
    \ on one block object and pass another object as an argument,\nit will return\
    \ true if they are in the same location (and false if not).\nHere's the code:\n\
    \n```\nBlock.prototype.equal = function(otherBlock) {\n  return this.col === otherBlock.col\
    \ && this.row === otherBlock.row;\n};\n```\n\nThis method is pretty straightforward:\
    \ if the two blocks\n(this and otherBlock) have the same col and row properties\
    \ (that\nis is, if this.col is equal to otherBlock.col and this.row is equal to\n\
    otherBlock.row), then they are in the same place, and the method\nreturns true.\n\
    \nFor example, let's create two new blocks called apple and head\nsee if they're\
    \ in the same location:\n\n```\nvar apple = new Block(2, 5);\nvar head = new Block(3,\
    \ 5);\nhead.equal(apple);\nfalse\n```\n\nAlthough apple and head have the same\
    \ row property (5), their\ncol properties are different. If we set the head to\
    \ a new block object\noneone column to the left, now the method will tell us that\
    \ the two\nobjects are in the same location:\n\n```\nhead = new Block(2, 5);\n\
    head.equal(apple);\ntrue\n```\n\nNote that it doesn't make any difference whether\
    \ we write\nhead.equal(apple) or apple.equal(head); in both cases we are making\n\
    the same comparison.\n\nWe'll use the equal method later to check whether the\
    \ snake has\neaten the apple or collided with itself."
