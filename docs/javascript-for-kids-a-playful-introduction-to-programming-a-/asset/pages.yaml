    # BUILDING THE BLOCK CONSTRUCTOR


    In this section, we''ll define a Block constructor that will create objects that
    represent individual blocks on our invisible game grid. Each block will have the
    properties col (short for *column*) and *row*, which will store the location of
    that particular block on the grid. Figure 17-1 shows this grid with some of the
    columns and rows numbered. Although this grid won''t actually appear on the screen,
    our game is designed so that the apple and the snake segments will always line
    up with it.


    | | 0 | 10 | 20 | 30 | 39 |

    |---|---|---|---|---||}{

