    # # 9

    THE DOM AND JQUERY


    So far, we’ve been using JavaScript to do relatively simple things like print
    text to the browser console or display an alert or prompt dialog. But you can
    also use JavaScript to manipulate (control or modify) and interact with the HTML
    you write in web pages. In this chapter, we’ll discuss two tools that will allow
