- img_proc: true
  md: "The DOM, or document object model, is what allows JavaScript to access the\
    \ content of a web page. Web browsers use the DOM to keep track of the elements\
    \ on a page (such as paragraphs, headings, and other HTML elements), and JavaScript\
    \ can manipulate DOM elements in various ways. For example, you'll soon see how\
    \ you can use JavaScript to replace the main heading of the HTML document with\
    \ input from a prompt dialog.\n\nWe'll also look at a useful tool called jQuery,\
    \ which makes it much easier to work with the DOM. jQuery gives us a set of functions\
    \ that we can use to choose which elements to work with and make changes to those\
    \ elements.\n\nIn this chapter, we'll learn how to use the DOM and jQuery to edit\
    \ existing DOM elements and create new DOM elements, giving us full control over\
    \ the content of our web pages from JavaScript. We'll also learn how to use jQuery\
    \ to animate DOM elements—for example, fading elements in and out.\n\n# SELECTING\
    \ DOM ELEMENTS\n\nWhen you load an HTML document into a browser, the browser converts\
    \ the elements into a tree-like structure. This tree is known as the DOM tree.\
    \ Figure 9-1 shows a simple DOM tree—the tree we use in Chapter 5 to illustrate\
    \ the hierarchy of HTML. The browser gives JavaScript programmers a way to access\
    \ and modify this tree structure using a collection of methods called the DOM.\n\
    \n```\n<html>\n  <body>\n    <title></title>\n    <h1></h1>\n    <p></p>\n  </body>\n\
    </</html>>\n```\n\nFigure 9-1: The DOM tree for a simple HTML document, like the\
    \ one we made in Chapter 5"
  merge: -1
  pgno: 170
