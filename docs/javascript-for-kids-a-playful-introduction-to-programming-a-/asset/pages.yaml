  md: '# USING ID TO IDENTIFY ELEMENTS


    The HTML id attribute lets you assign a unique name, or identifier, to an HTML
    element. For example, this h1 element has an id attribute:


    ```

    <h1 id="main-heading">Hello world!</h1>

    ```


    In this example, the id of "main-heading" will let us identify, and eventually
    change, this particular heading without affecting other elements or even other
    h1 headings.


    # SELECTING AN ELEMENT USING GETELELEMENTBYID


    Having uniquely identified an element with id (each must have a unique value),
    we can use the DOM method document.getElementById to return the "main-heading"
    element:


    ```

    var headingElement = document.getElementById("main-heading");

    ```


    By calling document.getElementById("main-heading"), we tell the browser to look
    for the element with the id of "main-heading". This returns a DOM object that
    corresponds to the id, and we save this DOM object to the variable headingElement.


    Once we''ve selected element, we can manipulate it with JavaScript. For example,
    we can use the innerHTML property to retrieve and replace the text inside the
    selected element:


    ```

    headingElement.innerHTML;

    ```


    This code returns the HTML contents of headingElement—the element we selected
    using getElementById. In this case, the content of this element is the text Hello
    world! that we entered between the <h1> tags.


    ![](img/e5791ceef5f489e724ff12c45401c333_171_0.png)


    The DOM and jQuery 145'
