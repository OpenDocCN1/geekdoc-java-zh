    <head>\n  <title>My first proper HTML page</title>\n</head>\n<body>\n  <h1>Hello\
    \ world!</h1>\n  <p>My first web page.</p>\n  <script>\n    var message = \"Hello\
    \ world\";\n    console.log(message);\n  </script>\n</body>\n</html>\n```\n\n\
    Here've added a new element, called script. This is a special element in HTML.\
    \ With most HTML elements, the content between the opening and closing tags is\
    \ displayed on the page. With script, on the other hand, everything between the\
    \ tags is treated as JavaScript and run by the JavaScript interpreter.\n\nNow's\
    \ look at the code inside the script element:\n\n```\nvar message = \"Hello world!\"\
    ;\nconsole.log(message);\n```"
