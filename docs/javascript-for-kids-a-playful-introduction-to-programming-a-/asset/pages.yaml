    # INCREMENTING AND DECREMENTING


    As a programmer, you''ll often need to increase or decrease the value of a variable
    containing a number by 1. For example, you might have a variable that counts the
    number of high-fives you received today. Each time someone high-fives, you''d
    want to increase that variable by 1.


    Increasing by 1 is called incrementing, and decreasing by 1 is called decrementing.
    You increment and decrement using the operators ++ and --.


    ```

    var highFives = 0;

