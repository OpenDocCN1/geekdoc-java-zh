    # WHY LEARN JAVASCRIPT?


    JavaScript isn''t the only programming language out there—in fact, there are literally
    hundreds of programming languages. But there are many reasons to learn JavaScript.
    For one, it''s lot easier (and more fun) to learn many than other programming
    languages. But perhaps best of all, in order to run and write JavaScript programs,
    all you need is a web browser like Internet Explorer, Mozilla Firefox, or Google
    Chrome. Every web browser comes with a JavaScript interpreter that understands
    how to read JavaScript programs.


    Once you''ve written a JavaScript program, you can send people a link to it, and
    they can run it in a web browser on their computer, too! (See "Sharing Your Code
    Using JSFiddle" on page 297.)'
