  md: '# SELECTING AND SAVING THE CANVAS ELEMENT


    First, we select the canvas element using document.getElementById("canvas"). As
    we saw in Chapter 9, the getElementById returns a DOM object representing the
    element with the supplied id. This object is assigned to the canvas variable var
    canvas = document.getElementById("canvas").


    ![](img/e5791ceef5f489e724ff12c45401c333_227_0.png)


    # GETTING THE DRAWING CONTEXT


    Next, we get the drawing context from the canvas element. A drawing context is
    a JavaScript object that includes all the methods and properties for drawing on
    a canvas. To get this, we call getContext on canvas and pass it the string "2d"
    as an argument. This argument says that we want to draw a two-dimensional image
    on our canvas. We save this drawing context object in the variable ctx = canvas.getContext("2d").


    # DRAWING A SQUARE


    Finally, on the third line, we draw a rectangle on the canvas by calling the method
    fillRect on the drawing context. The fillRect method takes four arguments. In
    order, these are the x- and y-coordinates of the top-left corner of the rectangle
    (10, 0). In this case we say, "Draw a 10-pixel-by-10-pixel rectangle at coordinates
    (0, 0)," which are at the top-left corner of the canvas.


    When you run this code, you should see a small black square on your screen, as
    shown in Figure 13-1.


    ![](img/e5791ceef5f489e724ff12c45401c333_227_1.png)


    Figure 13-1: Our first canvas drawing'
