  md: "# ADDING THE SET METHOD\n\nThe setDirection method takes the new direction\
    \ from the keyboard handler we just looked at and uses it to update the snake's\
    \ direction. This method also prevents the player from making turns that would\
    \ have the snake run into itself. For example, if the snake is moving right, and\
    \ then it suddenly turns left without moving up or down to get out of its way,\
    \ it will collide with itself. We'll call these illegal turns because we do not\
    \ want to allow the player to make them. For example, Figure 17-6 shows the valid\
    \ directions and the one illegal direction when the snake is moving right.\n\n\
    ![](img/e5791ceef5f489e724ff12c45401c333_308_0.png)\n\nFigure 17-6: Valid new\
    \ directions based on the current direction\n\nThe setDirection method checks\
    \ whether the player is trying to make an illegal turn. If they are, the method\
    \ uses return to end early; otherwise, it updates the nextDirection property on\
    \ the snake object.\n\nHere's the code for the setDirection method.\n\n```\nSnake.prototype.setDirection\
    \ = function(newDirection) {\n  if (this.direction === \"up\" && newDirection\
    \ === \"down\") {\n    return;\n  } else if (this.direction === \"right\" && newDirection\
    \ === \"left\") {\n    return;\n  } else if (this.direction === \"down\" && newDirection\
    \ === \"up\") {\n    return;\n  } else if (this.direction === \"left\" && newDirection\
    \ === \"right\") {\n    return;\n  }\n  this.nextDirection = newDirection;\n};\n\
    ```"
