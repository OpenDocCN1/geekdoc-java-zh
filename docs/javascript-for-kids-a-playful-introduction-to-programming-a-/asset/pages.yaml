  md: '# ABOUT THE AUTHOR


    Nick Morgan is a frontend engineer at Twitter. He loves all programming languages
    but has a particular soft spot for JavaScript. Nick lives in San Francisco (the
    foggy part) with his fiancée and their fluffy dog, Pancake. He blogs at skillidrick.co.uk.


    # ABOUT THE ILLUSTRATOR


    Miran Lipovača is the author of Learn You a Haskell for Great Good! He enjoys
    boxing, playing bass guitar, and, of course, drawing. He has a fascination with
    dancing skeletons and the number 71, and when he walks through automatic doors
    he pretends that''s actually opening them with his mind.


    # ABOUT THE TECHNICAL REVIEWER


    Angus Croll is the author of If Hemingway Wrote JavaScript, and he is obsessed
    with JavaScript and literature in equal measure. He works on Twitter’s UI framework
    team, where he co-authored the Flight framework. He writes the influential JavaScript,
    JavaScript blog and speaks at conferences worldwide. He tweets at @angustweets.'
