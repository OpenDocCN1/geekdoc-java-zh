- img_proc: true
  md: '# CHAINING JQUERY ANIMATIONS


    When you call a method on a jQuery object, the method usually returns the original
    object that it was called on. For example, $("h1") returns a jQuery object representing
    all h1 elements, and $("h1").fadeOut(3000) returns the same jQuery object representing
    the h1 element and fades it out. To change the text, you could:


    ```

    $("h1").text("This will fade out").fadeOut(3000);

    ```


    Calling multiple methods in a row like this is known as chaining.

    We can chain multiple animations on the same element. For example, here''s how
    we could chain a call to the fadeOut and fadeIn methods to fade an element out
    and then immediately it in:


    ```

    $("h1").fadeOut(3000).fadeIn(2000);

    ```


    The fadeIn makes an invisible element fade back in. jQuery is smart enough to
    know when you chain two animations in a row like this, you probably want them
    to happen after the other. This code fades the h1 element out over the course
    of 3 seconds and then fades it back in 2 seconds.


    jQuery provides two additional animation methods similar to fadeOut and fadeIn,
    called slideUp and slideDown. The slideUp method makes elements disappear by sliding
    them up, and slideDown makes them reappear by sliding them down. Replace the second
    script element in the dom.html document with the following, and reload the page
    to try it out:


    ```

    $("h1").slideUp(1000).slideDown(1000);

    ```


    We select the h1 element, slide it up over 1 second, and slide it down over 1
    second until it reappears.


    ![](img/e5791ceef5f489e724ff12c45401c333_178_0.png)'
