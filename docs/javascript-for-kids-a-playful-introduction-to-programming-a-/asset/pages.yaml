  md: "# DRAWING MULTIPLE SQUARES\n\nHow about trying something a bit more interesting?\
    \ Rather than drawing just one square, let's use a loop to draw multiple squares\
    \ running diagonally down the screen. Replace the code in the `<script>` tags\
    \ with the following. When you run this code, you will see a set of eight black\
    \ squares, as shown in Figure 13-2:\n\n```\nvar canvas = document.getElementById(\"\
    canvas\");\nvar ctx = canvas.getContext(\"2d\");\nfor (var i = 0; i < 8; i++)\
    \ {\n  ctx.fillRect(i * 10, i * 10, 10, 10);\n}\n```\n\nThe first two lines are\
    \ the same as in the earlier listing. The third line, we create a for loop that\
    \ runs from 0 to 8. Next, inside this loop, we call fillRect on the drawing context.\n\
    \n![](img/e5791ceef5f489e724ff12c45401c333_228_0.png)\n\nFigure 13-2: Drawing\
    \ multiple squares using a for loop\n\nThe x and y positions for the top-left\
    \ corner of each square are based on the loop variable, i. The first time around\
    \ the loop, when i is 0, the coordinates are (0, 0) because $0 \\times 10$ is\
    \ equal to 0. This means that we run the code ctx.fillRect(i * 10, i * 10, 10,\
    \ 10), we will draw a square at the coordinates (0, 0), with a width and height\
    \ of 10 pixels by 10 pixels. This is the top-left square in Figure 13-2.\n\nThe\
    \ second time around the loop, when i is 1, the coordinates are (10, 10) because\
    \ $1 \\times 10$ is equal to 10. This time, the code ctx.fillRect(i * 10, i *\
    \ 10, 10, 10) draws a square at the coordinates (10, 10),"
