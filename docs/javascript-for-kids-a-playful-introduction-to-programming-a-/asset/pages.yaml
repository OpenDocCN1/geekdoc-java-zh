    # USING THE PYTHAGOREAN THEOREM


    Next, the getDistance function uses the Pythagorean theorem to calculate the distance
    between two points. The Pythagorean theorem says that for a right triangle, $a$
    and $b$ represent the lengths of the two sides bordering the right angle and $c$
    represents the length of the diagonal side (the hypotenuse), $a^2 + b^2 = c^2$.
    Given the lengths of $a$ and $b$, we can calculate the length of the hypotenuse
    by calculating the square root of $a^2 + b^2$.'
