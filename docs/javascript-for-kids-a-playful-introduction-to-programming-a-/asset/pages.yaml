    We create a variable called numberOfSiblings and assign the value of 1 + 3 (which
    JavaScript works out to be 4). Then we create the variable numberOfCandies and
    assign 8 to it. Finally, we write numberOfCandies / numberOfSiblings. Because
    numberOfCandies is 8 and numberOfSiblings is 4, JavaScript works out 8 / 4 and
