  md: "Conditionals and loops are powerful concepts that are key to any sophisticated\
    \ program. They are called control structures because they allow you to control\
    \ which parts of your code are executed when and how they're executed, based on\
    \ certain conditions you define.\n\nWe first need to go over how to embed JavaScript\
    \ in our HTML file so we can start longer programs than we've looked at so far.\n\
    \n# EMBEDDING JAVASCRIPT IN HTML\n\nHere is the HTML file we created in Chapter\
