  md: '# TAGS AND ELEMENTS


    HTML documents are made up of elements. An element starts with a start tag and
    ends with an end tag. For example, in our document so far we have two elements:
    h1 and p. The h1 element starts with the start tag <h1> and ends with the end
    tag </h1>. The p element starts with the start tag <p> and ends with the end tag
    </p>. Anything between the opening and closing tags is the content of the element.
    Start tags consist of the element name surrounded by angle brackets: < >. End
    tags are the same, but they have a forward slash (/) before the element name.


    # HEADING ELEMENTS


    Each element has a special meaning and use. For example, the h1 element means
    “This is a top-level heading.” The content you put between the opening and closing
    <h1> tags is displayed by the browser on its own line, in a large, bold font.
    There are six levels of heading elements in HTML: h1, h2, h3, h4, h5, and h6.
    They look like this:


    ```

    <h1>First-level heading</h1>

    <h2>Second-level heading</h2>

    <h3>Third-level heading</h3>

    <h4>Fourth-level heading</h4>

    <h5>Fifth-level heading</h5>

    <h6>Sixth-level heading</h6>

    ```


    Figure 5-2 shows how the headings look on a web page.


    ![](img/e5791ceef5f489e724ff12c45401c333_106_0.png)


    Figure 5-2: The different heading elements'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# THE P ELEMENT


    The p element is used to define separate paragraphs of text. Any text you put
    between <p tags will display in a separate paragraph, with some space above and
    below the paragraph. Let''s try creating multiple p elements. Add this new line
    to your page.html document (the old lines are shown in gray):


    ```

    <h1>Hello world!</h1>

    <p>My first web page.</p>

    <p>let''s add another paragraph.</p>

    ```


    Figure 5-3 shows the web page with the new paragraph.


    ![](img/e5791ceef5f489e724ff12c45401c333_107_0.png)


    Figure 5-3: The same page but with an extra paragraph


    Notice that the paragraphs appear on different lines and are separated by a bit
    of space. This is all because of the <p> tags.


    # WHITESPACE IN HTML AND BLOCK-LEVEL ELEMENTS


    What would our page look like without the tags? Let''s take a look:


    Hello world!

    My first web page.

    Let''s add another paragraph.


    Figure 5-4 shows our page without any tags.


    ![](img/e5791ceef5f489e724ff12c45401c333_107_1.png)


    Figure 5-4: The same page but with no HTML tags'
