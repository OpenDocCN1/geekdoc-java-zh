    \ method to create\ncircle with its center at the position (x, y) and a radius\
    \ of radius.\nAfter this, we check to see if the fillCircle argument is true.\n\
    If it is true, we fill the circle using ctx.fill. Otherwise, we\noutline the circle\
    \ using ctx.stroke.\n\n# DRAWING THE BEE\n\nNext, we create the drawBee function\
