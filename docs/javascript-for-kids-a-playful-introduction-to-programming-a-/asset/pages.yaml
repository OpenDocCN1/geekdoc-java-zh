  md: "letters on their keyboard (like the classic W, A, S, D game controls). For\
    \ example, instead of just having a ball bounce across a screen, we can have a\
    \ player control the movement of the ball using the arrow keys.\n\n# KEYBOARD\
    \ EVENTS\n\nJavaScript can monitor the keyboard through keyboard events. Each\
    \ time a user presses a key on the keyboard, they generate a keyboard event, which\
    \ is a lot the mouse events we saw in Chapter 10. With mouse events, we used jQuery\
    \ to determine where the cursor was when the event took place. With keyboard events,\
    \ you can use jQuery to determine which key was pressed and then use that information\
    \ in your code. For example, in this chapter we will make a ball move left, right,\
    \ up, or down the user presses the left, right, up, or down arrow key.\n\nWe’ll\
    \ use the keydown event, which is triggered whenever a user presses a key, and\
    \ we’ll use jquery to add an event handler to the keydown event. That way, every\
    \ time a keydown event occurs, our event handler function can find out which key\
    \ was pressed and respond accordingly.\n\n# SETTING UP THE HTML FILE\n\nTo begin,\
    \ create a clean HTML file containing the following code and save it as keyboard.html.\n\
    \n```\n<DOCTYPE html>\n<html>\n<head>\n  <title>Keyboard input</title>\n</head>\n\
    <body>\n  <canvas id=\"canvas\" width=\"400\" height=\"400\"></canvas>\n<script\
    \ src=\"https://jquery.com/jquery-2.1.0.js\"></script>\n<script>\n  // We'll fill\
    \ this in next\n</script>\n</body>\n</html>\n```"
