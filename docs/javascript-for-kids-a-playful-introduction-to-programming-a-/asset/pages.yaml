    +   **undefined** A value that JavaScript uses when something like a property
    or variable doesn''t have any particular value assigned to it.


    +   **variable** A way of giving a JavaScript value a name. After you assign a
    value to a variable, you can use the variable name later to retrieve the value.


    +   **whitespace** Invisible characters like spaces, newlines, and tabs.'
