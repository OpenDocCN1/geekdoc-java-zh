    </html>\n```\n\n# THE BALL CONSTRUCTOR\n\nFirst we'll create the Ball constructor,\
    \ which we'll use to create our bouncing ball. Type the following code into the\
    \ <script> tags in ball.html.\n\n```\nvar Ball = function () {\n  this.x = 100;\n\
    \  this.y = 100;\n  this.xspeed = -2;\n  this.yspeed = 3;\n};\n```\n\nOur constructor\
    \ is very straightforward: forward: it simply sets the starting position of the\
