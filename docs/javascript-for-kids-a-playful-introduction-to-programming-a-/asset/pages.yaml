- img_proc: true
  md: "# #3: MAKING THE GAME SPEED UP AS YOU PLAY\n\nModify the game so that every\
    \ time the snake eats an apple, the game speeds up. To do this, you'll have to\
    \ change the code to use setTimeout instead of setInterval, because setInterval\
    \ keeps calling a function at a regular interval that cannot be changed. Instead,\
    \ you can repeatedly call a function with setTimeout and change the timeout delay\
    \ each time you call it:\n\n```\nvar animationTime = 100;\nvar gameLoop = function\
    \ () {\n  // The code that draws and updates the game should go here\n  setTimeout(gameLoop,\
    \ animationTime);\n};\n\ngameLoop();\n```\n\nInstead of using setInterval to call\
    \ setTimeout(gameLoop, animationTime), which means \"call gameloop again after\
    \ animation milliseconds.\" Like setInterval, this is a way to call a function\
    \ over and over again, with a short pause between each function call. The difference\
    \ is that you can easily modify the animation time from anywhere in your code\
    \ by changing animationTime, and the program will use that value for subsequent\
    \ calls to setTimeout.\n\n(One other thing to bear in mind here is that you need\
    \ to find a new way to stop the game from looping when the game is over. How would\
    \ you do that?)\n\n# #4: FIXING THE APPLE.MOVE METHOD\n\nEvery time you move the\
    \ apple, it moves to a new random location, but as written there's nothing to\
    \ stop the apple from moving to a block that part of the snake is already occupying.\
    \ To prevent this, modify the move method to take into account the current locations\
    \ of the snake's segments. (Hint: Use a while loop to keep calling move until\
    \ it picks a location that's not occupied by the snake.)"
