  md: 'key-value pair A made up of a string (called a key) that is matched with a
    particular value (which can be any type of value). Key-value pairs go inside JavaScript
    objects, and they are used to define an object''s properties and methods.


    keyword A word with a special meaning in JavaScript (for example, for, return,
    or function). Keywords can''t be used as variable names.


    library A collection of JavaScript code that we load into our web pages to provide
    additional functions and methods. In this book we use the jQuery library, which
    gives us functions and methods for working with the DOM more easily.


    loop A way to execute a piece of code multiple times.


    method A function that is a property of an object.


    null A special value that can be used to indicate that a variable is purposely
    empty.


    object A set of key-value pairs. Each key is a string that can be paired with
    any JavaScript value. You can use the key to retrieve whatever it''s paired with
    in the object.


    object-oriented programming A style of programming that takes advantage of objects
    and methods to organize the code and represent the most important features of
    the program.


    programming language A language that programmers can use to tell computers what
    to do. JavaScript is one programming language, but there are many others.


    property A name for a key-value pair in an object.


    prototype A property of a constructor. Any methods added to a constructor''s prototype
    will be available to all objects created by that constructor.


    return The act of leaving a function and returning to the code that called the
    function. A function returns when it reaches the end of its body or it reaches
    a return keyword (which can be used to leave a function early). When a function
    returns, it outputs a return value (if no particular return value is specified,
    it simply returns the empty value undefined).'
