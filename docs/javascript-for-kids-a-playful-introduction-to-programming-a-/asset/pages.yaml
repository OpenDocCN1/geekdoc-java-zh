  md: '# CSS


    CSS (short for Cascading Style Sheets) is the language used to control the appearance
    of web pages. Learn more about CSS:


    +   - The Mozilla Developer Network''s Getting Started with CSS: https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Getting_started/

    - Codecademy HTML & CSS course: http://www.codeacademy.com/tracks/web/


    # SERVER-SIDE CODE WITH NODE.JS


    Web pages live on web servers. A server stores all the HTML, CSS, and JavaScript
    for a web page, and it allows people to access the page from the Internet. You
    can also write programs for the server (called server-side code) to make the server
    generate new HTML files each time a page is loaded. For example, when you visit
    http://twitter.com/, a program runs on a server that finds the latest tweets for
    your, generates an HTML file containing those tweets, and sends that file to your
    browser.


    Node.js lets you write server-side code in JavaScript. Find out more about Node.js
    with these links:


    +   - Node.js documentation: http://nodejs.org/

    - The Node Beginner Book: http://www.nodebeginner.org/


    # GRAPHICAL PROGRAMMING


    If you want to make interactive graphics in JavaScript, you have two main options:
    the canvas element and SVG.


    # CANVAS


    We learned the basics of the canvas element in this book, there''s much more you
    can do with it. Here are some tutorials and games you can use to learn more:


    +   - The Mozilla Developer Network''s Canvas Tutorial: https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial/

    - Code Monster from Crunchzilla: http://www.crunchzilla.com/code-monster/'
