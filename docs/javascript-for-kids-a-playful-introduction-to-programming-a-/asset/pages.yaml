  md: 'The null value is usually used when you want to deliberately say "This is empty."


    ```

    var myVariable = null;

    myVariable;

    null

    ```


    At this point, you won''t be undefined or null very often. You''ll see undefined
    if you create a variable and don''t set its value, because undefined is what JavaScript
    will always give you when it doesn''t have a value. It''s not very common to set
    something to undefined; if you feel the need to set a variable to "nothing," you
    should use null instead.


    null is used only when you actually want to say something''s not there, which
    is very occasionally occasionally helpful. For example, say you''re using a variable
    to track what your favorite vegetable is. If you have all vegetables and don''t
    have a favorite, you might set the favorite vegetable variable to null.


    Setting the variable to null would make it obvious to anyone reading the code
    that you don''t have a favorite vegetable. If it were undefined, however, someone
    might just think you hadn''t gotten around to setting a value yet.


    # WHAT YOU LEARNED


    Now you know all the basic data types in JavaScript—numbers, strings, and Booleans—as
    well as the special values null and undefined. Numbers are used for math-type
    things, strings are used for text, and Booleans are used for yes or no questions.
    The values null and undefined are there to give us a way to talk about things
    that don''t exist.


    In the next two chapters, we''ll look at arrays and objects, which are both ways
    of joining basic types to create more complex collections of values.'
