  md: '# SVG USING RAPHAËL


    SVG is an image format that lets you draw shapes and animate them without redrawing
    from scratch for each animation step. SVG programming can be difficult to get
    the hang of, but it''s much easier if you use the JavaScript library called Raphaelël.
    Here are some resources for learning Raphaelël:


    +   - Raphaelël website: http://raphaeljs.com/

    - An Introduction to the Raphael JS Library: http://code.tutsplus.com/tutorials/an-introduction-to-the-raphael-js-library--net-7186/


    # 3D PROGRAMMING


    Remember how in Chapter 13 we told canvas we wanted to make a 2D drawing context
    by calling canvas.getContext("2d"). It''s also possible to do 3D graphics using
    canvas. This is another one of areas where it''s easier to use a library, so I
    recommend using the library three.js. Here are some resources for learning three.js:


    +   - three.js Manual: http://threejs.org/docs/index.html#Manual

    - The Beginner''s Guide to three.js: http://blog.teamtreehouse.com/the-beginners-guide-to-three-js/


    # PROGRAMMING ROBOTS


    You can control robots using JavaScript! For example, the Parrot AR.Drone is a
    small flying helicopter that you can control using Node.js. Or you can check out
    Johnny-Five, a JavaScript library that lets you use Node.js to control devices
    such as the Arduino (a popular microcontroller that''s used in lots of homemade
    electronics and robotics projects). Here are some resources for learning how to
    control robots and other devices with JavaScript:


    +   - node-ar-drone: https://github.com/felixge/node-ar-drone/

    - NodeCopter: http://nodecopter.com/

    - NodeBots: http://nodeobots.io/

    - Johnny-Five: https://github.com/rwaldron/johnny-five/'
