    # 10

    INTERACTIVE PROGRAMMING


    Until now, the JavaScript code on our web pages has run as soon as the page is
    loaded, pausing only if we include a call to a function like alert or confirm.
    But we don''t always necessarily want all of our code to run as soon as the page
    loads—what if we want some code to run after a delay or in response to something
    the user does?'
