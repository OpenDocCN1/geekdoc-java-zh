  md: 'You can also use === to compare two strings or Booleans. If you use === to
    compare two different types—for example, a string and a number—it will always
    return false.


    # DOUBLE EQUALS


    Now confuse things a bit: there''s another JavaScript operator (double equals,
    ==) means “equal-ish.” Use this to see whether two values are the same, even if
    one is a string and the other is a number. All values have some kind of type.
    The number 5 is different from the string "5", even though they basically look
    like same thing. If you use === to compare the number 5 and the string and if
    you use == to compare them, it will tell you they''re the same:


    ```

    var stringNumber = "5";nvar actualNumber = 5;

    stringNumber === actualNumber;

    false

    stringNumber == actualNumber;

    true

    ```


    At this point, you might be thinking to yourself, “Hmm, it seems easier to use
    double equals than triple equals!” You have to be very careful, though, because
    double equals can be very confusing. For example, if you think o is equal to false?
    What about the string "false"? When you use double equals, o is equal to false,
    but the string "false" is not:


    ```

    0 === false;

    true

    "false" == false;

    false

    ```


    This is because JavaScript tries to compare two values with double equals, it
    first tries to make them the same type. In this case, it converts the Boolean
    into a number. If you convert Booleans to numbers, false becomes 0, and true becomes
    1. So when you type 0 == false, you get true!


    Because of this weirdness, it''s probably safest to just stick with ====== for
    now.'
