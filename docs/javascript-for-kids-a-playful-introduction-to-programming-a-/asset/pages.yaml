    # # 6 CONDITIONALS AND LOOPS


    Conditionals and loops are two of the most important concepts in JavaScript. A
    conditional says, “If something is true, do this. Otherwise, do that.” For example,
    if you do your homework, you can have ice cream, but if you don’t do your homework,
    you don’t get the ice cream. A loop says, “As long as something is true, keep
    doing this.” For example, as long as you are thirsty, keep drinking water.'
