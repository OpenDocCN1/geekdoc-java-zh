  md: "# STORING INFORMATION ABOUT YOUR MOVIES\n\nLet's say you have a large collection\
    \ of movies on DVD and Blu-ray. Wouldn't it be great to have the information about\
    \ those movies on your computer so you can find out about each movie easily?\n\
    You can create an object to store information about your movies, where every key\
    \ is a movie title, and every value is another object containing information about\
    \ the movie. Values in objects can be objects themselves!\n\n```\nvar movies =\
    \ {\n  \"Finding Nemo\": {\n    releaseDate: 2003,\n    duration: 100,\n    actors:\
    \ [\"Albert Brooks\", \"Ellen DeGeneres\", \"Alexander Gould\"],\n    format:\
    \ \"DVD\"\n  },\n  \"Star Wars: Episode VI - Return of the Jedi\": {\n    releaseDate:\
    \ 1983,\n    duration: 134,\n    actors: [\"Mark Hamill\", \"Harrison Ford\",\
    \ \"Carrie Fisher\"],\n    format: \"DVD\"\n  },\n  \"Harry Potter and the Goblet\
    \ of Fire\": {\n    releaseDate: 2005,\n    duration: 157,\n    actors: [\"Daniel\
    \ Radcliffe\", \"Emma Watson\", \"Rupert Grint\"],\n    format: \"Blu-ray\"\n\
    }\\}\n}\n```\n\nYou might have noticed that I used quotes for the movie titles\
    \ (the keys in the outer object) but not for the keys in the inner objects. That's\
    \ because the movie titles need to have spaces—otherwise, I'd have to type each\
    \ title like StarWarsEpisodeVIReturnOfTheJedi, and that's just silly! I didn't\
    \ need quotes for the keys in the inner objects, so I left them off. It can make\
    \ code look a bit cleaner when there aren't unnecessary punctuation marks in it.\n\
    \n![](img/e5791ceef5f489e724ff12c45401c333_100_0.png)"
