  md: '# CALLING A FUNCTION


    To run the code inside a function (the function body), we need to call the function.
    To call a function, you enter its name followed by a pair of parentheses, as shown
    here.


    ![](img/e5791ceef5f489e724ff12c45401c333_151_0.png)


    ```

    ourFirstFunction();

    Hello world!

    ```


    Calling ourFirstFunction executes the body of the function, which is console.log("Hello
    world!"); and the text we asked to be printed is displayed on the next line: Hello
    world.


    But if you call this function in your browser, you''ll notice there''s a third
    line, with a little left-facing arrow, as shown in Figure 8-2. This is the return
    value of the function.


    > > ourFirstFunction();

    > Hello, world!

    > undefined


    **Figure 8-2:** *Calling a function with an undefined return value*


    A return value is the value that a function outputs, which can be used elsewhere
    in your code. In this case, the return value is undefined because we didn''t tell
    the function to return any particular value in the body of the function. All we
    did ask it to print a message to the console, which is not the same as returning
    a value. A function always returns undefined unless there is something in the
    function body that tells it to return a different value. (We’ll look at how to
    specify a return value in “Returning Values from Functions” on page 129.)


    **NOTE** In the Chrome console and in the code listings throughout this book,
    return values are always color-coded based on data type, while text printed with
    console.log is always plain black.'
