  md: '# NAMING VARIABLES


    Be careful with your variable names, because it''s easy to misspell them. Even
    if you get the capitalization wrong, the JavaScript interpreter won''t know what
    you mean! For example, if you accidentally used a lowercase c in numberOfOfCandies,
    you''d get an error:


    ```

    numberOfCandies / numberOfSiblings;

    ReferenceError: numberOfOfCandies is not defined

    ```


    Unfortunately, JavaScript will only do exactly what you ask it to do. If you misspell
    a variable name, JavaScript has no idea what you mean, and it will display an
    error message.


    Another tricky about variable names in JavaScript is that they can''t contain
    spaces, which means they can be difficult to read. I could have named my variable
    numberOfcand with no capital letters, which makes it even harder to read because
    it''s not clear where the word ends. This variable "num erfocand" or "numberofcan
    dies" Without the capital letters, it''s hard to tell.


    One common way to get around this is to start each word with a capital letter
    in NumberOfCandies.(This convention it supposedly looks case because it supposedly
    looks the humps on a camel).


    The standard practice is to have variables start with a lowercase letter, so it''s
    common to capitalize each word except for the first one, like this: numberOfCandies.

    ''ll follow this version of the camel case convention throughout this book, but
    you''re free to do whatever you want!


    ![](img/e5791ceef5f489e724ff12c45401c333_45_0.png)


