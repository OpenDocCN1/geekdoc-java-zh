  md: '# SECONDS IN AN HOUR


    First we create two new variables called secondsInMinute and minutesInHour and
    make them both 60 (because, as we know, there are 60 seconds in a minute and 60
    minutes in an hour). Then we create a variable called secondsInHour and set its
    value to the result of multiplying secondsInMinute and minutesInHour. At ℑ, we
    enter secondsInHour, which is like saying, "Tell me the value of secondsInHour
    now!" JavaScript gives you the answer: it’s 3600.


    ```

    var secondsInMinute = 60;

    var minutesInHour = 60;

    var secondsInHour = secondsInMinute * minutesInHour;

    secondsInHour;

    ```


    # SECONDS IN A DAY


    Now we create a variable called hoursInDay and set it to 24. Next we create the
    variable secondsInDay and set it equal to secondsInHour multiplied by hoursInDay.
    When we ask for the value secondsInDay at ℑ, we get 86400, which is the number
    of seconds in a day.


    ```

    var hoursInDay = 24;

    var secondsInDay = secondsInHour * hoursInDay;

    secondsInDay;

    ```


    ![](img/e5791ceef5f489e724ff12c45401c333_46_0.png)


    # SECONDS IN A YEAR


    Finally, we create the variables daysInYear and secondsInYear. The daysInYear
    variable is assigned the value 365, and the variable secondsInYear is assigned
    the value of secondsInDay multiplied by daysInYear. Finally, we ask for the value
    of secondsInYear, which is 31536000 (more than 31 million!)


    ```

    var daysInYear = 365;

    var secondsInYear = secondsInDay * daysInYear;

    secondsInYear;

    ```


    31536000'
