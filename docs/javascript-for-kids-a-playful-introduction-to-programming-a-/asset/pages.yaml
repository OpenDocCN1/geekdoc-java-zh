    Finish this example using the age and accompanied variables to work out this 12-year-old
    is allowed to see the movie. Try changing the values (for example, set age to
    13 and accompanied to false) and see if your code still works out the right answer.


    ![](img/e5791ceef5f489e724ff12c45401c333_63_0.png)


    # UNDEFINED AND NULL


    Finally, we have two values that don''t fit any particular mold. They''re called
    undefined and null. They''re both used to mean “nothing,” but in slightly different
    ways.


    undefined is the value JavaScript uses when it doesn''t have a value for something.
    For example, when you create a new variable, if you don''t set its value to anything
    using the = operator, its value will be set to undefined:


    ```

    var myVariable;

    myVariable;\undefined

    ```'
