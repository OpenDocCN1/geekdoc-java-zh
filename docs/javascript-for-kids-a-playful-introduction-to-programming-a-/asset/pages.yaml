  md: "# RESPONDING TO USER ACTIONS\n\nAs you've seen, one way to control when code\
    \ is run is with the functions setTimeout and setInterval, which run a function\
    \ once a fixed amount of time has passed. Another way is to run code only when\
    \ a user performs certain actions, as clicking, typing, or even moving the mouse.\
    \ This will let users interact with your web page so that your page responds according\
    \ to what they do.\n\nIn a browser, every time you perform an action as clicking,\
    \ typing, or moving your mouse, something called an event is triggered. An event\
    \ is the browser's way of saying, \"This thing happened!\" You can listen to these\
    \ events by adding an event handler to the element where the event happened. Adding\
    \ an event handler is your way of telling JavaScript, \"If this event happens\
    \ on this element, call this function.\" For example, if you want a function to\
    \ be called when the user clicks a heading element, you could add a click event\
    \ handler to the heading element. We'll look at how to do that next.\n\n# RESPONDING\
    \ TO CLICKS\n\nWhen a user clicks an element in the browser, this triggers a click\
    \ event. jQuery makes it easy to add a handler for a click event. Open the interactive.html\
    \ document you created earlier, use File > Save As to save it as clicks.html,\
    \ and replace its second script element with this code:\n\n```\nvar handler =\
    \ function (event) {\n  console.log(\"Click! \" + event.pageX + \" \" + event.pageY);\n\
    }\n```\n\n```\n$(\"h1\").click(clickHandler);\n```\n\nWe create the function with\
    \ the single argument event. When this function is called, the event argument\
    \ will be an object holding information about the click event, such as the location\
    \ of the click. Inside the handler function, we use console.log to output the\
    \ properties pageX and pageY from the object. These properties tell us the event's\
    \ x and y-coordinates—in other words, they say where on the page the click occurred.\n\
    \nFinally, we activate the click handler. The code $\\(\"h1\") selects the h1\
    \ element, and calling $\\(\"h1\").click(clickHandler);"
