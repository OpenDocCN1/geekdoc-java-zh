    \ (x, y, radius, fillCircle) {\n  ctx.beginPath();\n  ctx.arc(x, y, radius, 0,\
    \ Math.PI * 2, false);\n  if (fillCircle) {\n    ctx.fill();\n  } else {\n   \
    \ ctx.stroke();\n  }\n};\n```\n\nThe function takes four arguments: x, y, radius,\
    \ and fillCircle.\nWe used a similar circle function in Chapter 13, but here we've\n\
