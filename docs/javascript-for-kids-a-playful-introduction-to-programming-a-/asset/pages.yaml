- img_proc: true
  md: "In this chapter, we'll look at different ways of modifying our code is run.\
    \ Programming in this way is called interactive programming. This will let us\
    \ create interactive web pages that change over time and respond to actions by\
    \ the user.\n\n# DELAYING CODE WITH SETTIMEOUT\n\nInstead of having JavaScript\
    \ execute a function immediately you can tell it to execute a function after a\
    \ certain period of time. Delaying a function like this is called setting a timeout.\
    \ To set a timeout in JavaScript, we use the function setTimeout. This function\
    \ takes two arguments (as shown in Figure 10-1) the function to call after the\
    \ time has elapsed and the amount of time to wait (in milliseconds).\n\nThe function\
    \ to call after milliseconds have passed\n\n```\nsetTimeout(func, timeout)\n```\n\
    \nThe number of milliseconds to wait before calling the function\n\nFigure 10-1:\
    \ The arguments for setTimeout\n\nThe following listing shows how we could use\
    \ setTimeout to play an alert dialog.\n\n+   var timeUp = function () {\n  alert(\"\
    Time's up!\");\n};\n\n+   setTimeout(timeUp, 3000);\n\nWe create the function\
    \ timeUp, which opens an alert dialog that displays the text \"Time's up!\\ We\
    \ call setTimeout with two arguments: the function we want to call (timeUp) and\
    \ the number of milliseconds (3000) to wait before calling that function. We're\
    \ essentially saying, “Wait 3 seconds and then call timeUp.” When setTimeout(timeUp,\
    \ 3000) is first called, nothing happens, but 3 seconds timeUp is called and the\
    \ alert dialog pops up."
  merge: -1
  pgno: 182
- img_proc: true
  md: "Notice calling setTimeout returns 1. This return value is called the timeout\
    \ ID. The timeout ID is a number that's used to identify this particular timeout\
    \ (that is, this particular delayed function call). The actual number returned\
    \ could be any number, since it's just an identifier. Call setTimeout again, and\
    \ it should return a different timeout ID, as shown here:\n\n```\nsetTimeout(timeoutUp,\
    \ 5000);\n```\n\nYou can use this timeout ID with the clearTimeout function to\
    \ cancel that specific timeout. We'll look at that next.\n\n# CANCELING A TIMEOUT\n\
    \nOnce you've called setTimeout to set up a delayed function call, you may find\
    \ that you don't actually want to cancel that function after all. For example,\
    \ if you set an alarm to remind you to do your homework, you'd want to cancel\
    \ that if you finish doing your homework early. To cancel that alarm, use the\
    \ clearTimeout on the timeout ID returned by setTimeout. For example, say we create\
    \ a \"do your homework\" alarm like:\n\n![](img/e5791ceef5f489e724ff12c45401c333_183_0.png)\n\
    \n```\nvar doHomeworkAlarm = function () {\n  alert(\"Hey! You need to do your\
    \ homework!\");\n};\n```\n\n+   var timeoutID = setTimeout(doHomeworkAlarm, 60000);\n\
    \nThe function doHomeworkAlarm pops up an alert dialog telling you to do your\
    \ homework. When we call setTimeout(doHomeworkAlarm, 60000) we're telling JavaScript\
    \ to execute that function after 60,000 milliseconds (or 60 seconds) has passed.\
    \ At ① we make this call to setTimeout and save the timeout ID in a new variable\
    \ called timeoutID.\n\nTo cancel the timeout, pass the timeout ID to the clearTimeout\
    \ function like this:\n\n```\nclearTimeout(timeoutID);\n```\n\nNow setTimeout\
    \ won't call the doHomeworkAlarm function after all."
  merge: -1
  pgno: 183
- img_proc: true
  md: "# CALLING CODE MULTIPLE TIMES WITH SETINTERVAL\n\nThe setInterval function\
    \ is like setTimeout, except that it repeatedly calls the supplied function after\
    \ regular pauses, or intervals. For example, if you wanted to update a clock display\
    \ using JavaScript, you could use setInterval to call an update every second.\
    \ You call setInterval with two arguments: the function you want to call and the\
    \ length of the interval (in milliseconds), as shown in Figure 10-2.\n\n![](img/e5791ceef5f489e724ff12c45401c333_184_0.png)\n\
    \nFigure 10-2: The arguments for setInterval\n\nHere's how we could write a message\
    \ to the console every second:\n\n+   var counter = 1;\n\n+   var printMessage\
    \ = function () {\n  console.log(\"You have been staring at your console for \"\
    \ + counter + \"n seconds\");\n  counter++;\n}\n\n+   var intervalId = setInterval(printMessage,\
    \ 1000);\nYou have been staring at your console for 1 seconds\nYou have been staring\
    \ at your console for 2 seconds\nYou have been staring at your console for 3 seconds\n\
    You have been staring at your console for 4 seconds\nYou have been staring at\
    \ your console for 5 seconds\nYou have been staring at your console for 6 seconds\n\
    \n+   clearInterval(intervalId);"
  merge: -1
  pgno: 184
