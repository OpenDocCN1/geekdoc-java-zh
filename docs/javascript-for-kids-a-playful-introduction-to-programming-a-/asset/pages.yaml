    # ANIMATING ELEMENTS WITH JQUERY


    Lots of websites use animations to show and hide content. For example, if you
    were adding a new paragraph of text to your page, you might want to fade it in
    slowly so it doesn''t appear all of a sudden.


    jQuery makes it easy to animate elements. For example, to fade an element out,
    we can use the fadeOut method. To test this method, replace the contents of the
    second script element in dom.html with this:


    ```

    $("h1").fadeOut(3000);

    ```


    We use the $ function to select all h1 elements. Because dom.html has only one
    h1 element (the heading containing the text world!), that heading is selected
    as a jQuery object. By calling .fadeOut(3000) on this jQuery object, we make the
    heading fade away until it disappears, over the course of 3 seconds. (The argument
    to fade is in milliseconds, or thousandths of a second, so entering 3000 out makes
    the animation last 3. seconds.)


    As soon as you load the page with this code, the h1 element should start to fade
    away.'
