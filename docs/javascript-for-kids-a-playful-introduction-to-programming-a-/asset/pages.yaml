- img_proc: true
  md: '# SYNTAX HIGHLIGHTING


    Sublime Text will color-code your programs with syntax highlighting. This is designed
    to make programs easier to read by assigning different colors to different types
    of code. For example, strings might be green, while var might be orange.


    Sublime Text has lots of color schemes to choose from. In this book, we are using
    the IDLE color scheme, which can match your screen by going to Preferences > Scheme
    and selecting IDLE.


    # OUR FIRST HTML DOCUMENT


    Once you''ve installed Sublime Text, start the program and create a new file with
    File > New File. Next, choose File > Save to save your new, blank file; name it
    page.html and save it to your desktop.


    Now it''s time to write some HTML. Entering the text into your page.html file:


    ```

    <h1>Hello world!</h1>

    <p>My first web page.</p>

    ```


    Save your updated version of page.html with File > Save. Now let''s see what your
    page would look like in a web browser. Open Chrome, choose File > Open File, and
    select page.html from your desktop. You should see something like Figure 5-1.


    ![](img/e5791ceef5f489e724ff12c45401c333_105_0.png)


    Figure 5-1: Your first HTML page in Chrome


    You''ve just created your first HTML document! Although you''re viewing it in
    your web browser, it''s not actually on the Internet. Chrome is opening your page
    locally and just reading your markup tags to figure out what to do with its text.


    The Basics of HTML 79'
