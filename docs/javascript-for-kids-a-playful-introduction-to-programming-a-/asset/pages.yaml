    \  ctx.fillStyle = \"Gold\";\n\n  circle(x, y, 8, true);\n  circle(x, y, 8, false);\n\
    \  circle(x - 5, y - 11, 5, false);\n  circle(x + 5, y - 11, 5, false);\n  circle(x\
