    # CALCULATING THE DISTANCE BETWEEN THE CLICK AND THE TREASURE


    To figure out whether the player is hot or cold (close to the treasure or far
    away), we need to measure the distance between where the player clicked and the
    location of the hidden treasure. To do this, we''ll write a function called getDistance,
    like so:


    ```

    var getDistance = function (event, target) {

    var diffX = event.offsetX - target.x;

    var diffY = event.offsetY - target.y;

    return Math.sqrt((diffX * diffX) + (diffY * diffY));

    ```


    The getDistance function takes two objects as arguments: event and target. The
    event object is the object passed to the click handler, and it comes with built-in
    information about the player''s click. In particular, it contains two properties
    called offsetX and offsetY, which tell us the x- and y-coordinates of the click,
    and that''s exactly the information we need.


    Inside the function, the variable diffX stores the horizontal distance between
    the clicked location and the target, which we calculate by subtracting target.x
    (the x-coordinate of the target) from event.offsetX (the x-coordinate of the click).
    We calculate the'
