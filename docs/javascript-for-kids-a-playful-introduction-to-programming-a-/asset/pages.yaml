  md: 'We get the canvas and drawing context as usual on the first two lines. Then
    we create a ball object using new Ball() and save it in the variable ball at ❶.
    Next, we call setInterval at ②, passing a function and the number 30 at Ⓒ. As
    you''ve seen before, “call this function every 30 milliseconds.”


    ![](img/e5791ceef5f489e724ff12c45401c333_258_0.png)


    The function we pass to setInterval does several things. First, it clears the
    canvas, using ctx.clearRect(0, 0, 200, 200) at ③. After this, it calls the draw,
    move, and checkCollision methods at   on the ball object. The draw method draws
    the ball at its current x and y-coordinates. The move method updates the position
    of the ball based on its xspeed and yspeed properties. Finally, the checkCollision
    method updates the direction of the ball, if it hits a wall.


    The last thing we do in the function passed to setInterval is ctx.strokeRect(0,
    0, 200, 200) at ⑤ to draw a line around the edge of the canvas, so we can see
    the walls the ball is hitting.


    When you run this code, the ball should immediately start moving down and to the
    left. It should hit the bottom wall first, and bounce up and to the left. It will
    continue to bounce around the canvas as long as you leave the browser window open.


    # WHAT YOU LEARNED


    In this chapter, we combined our knowledge of animation from Chapter 11 with our
    knowledge of the canvas element to create various canvas-based animations. We
    began simply by moving and growing squares on the canvas. Next, we made a bee
    randomly around the screen, and we ended with an animation of a bouncing ball.'
