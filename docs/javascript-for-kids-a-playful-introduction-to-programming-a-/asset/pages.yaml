  md: "Finally, we draw the eyes. The first one is 2 pixels to the left of the center\
    \ of the body and 1 pixel above, with a radius of 2 pixels. The second one is\
    \ the same, except it's 2 pixels right of center.\n\n```\ncircle(x - 2, y - 1,\
    \ 2, false);\ncircle(x + 2, y - 1, 2, false);\n```\n\nTogether, these circles\
    \ create a bee, with its body centered around the (x, y) coordinate passed into\
    \ the drawBee function.\n\n![](img/e5791ceef5f489e724ff12c45401c333_250_0.png)\n\
    \n# UPDATING THE BEE'S LOCATION\n\nWe'll create an update function to randomly\
    \ change the x- and y-coordinates in order to make it appear to buzz around the\
    \ canvas. The update function takes a single coordinate; we update the x- and\
    \ y-coordinates one at a time so that the bee will move randomly left and right\
    \ and up and down. The update function looks like this:\n\n```\nvar update = function(coordinate)\
    \ {\n  var offset = Math.random() * 4 - 2;\n  coordinate += offset;\n  if (coordinate\
    \ > 200) {\n    coordinate = 200;\n  }\n  if (coordinate < 0) {\n    coordinate\
    \ = 0;\n  }\n  return coordinate;\n```\n\n![](img/e5791ceef5f489e724ff12c45401c333_250_1.png)\n\
    \n# CHANGING THE COORDINATE WITH AN OFFSET VALUE\n\nAt ❶, we create a variable\
    \ called offset, which will determine how much to change the current coordinate.\
    \ We generate the offset value by calculating Math.random() * 4 - 2. This will\
    \ give us a random number between -2 and 2. Here's how: calling Math.random()\
    \ on its own gives us a random number between 0 and 1, so Math.random() * 4 produces\
    \ a random number between 0 and 4. We subtract 2 to get a random number between\
    \ -2 and 2."
