    At we create a variable called blockSize and set it to 10, since we want our blocks
    to be 10 pixels tall and wide. At we create the variables widthInBlocks and heightInBlocks.
    We create widthInBlocks equal to the width of the canvas divided by the block
    size, which tells us how many blocks wide the canvas is. Similarly, heightInBlocks
    tells us how many blocks tall the canvas is. At the moment the canvas is 400 pixels
    wide and tall, so widthInBlocks and heightInBlocks will both be 40. If you count
