  md: 'At ③ comes the code for the Block constructor, followed by its drawSquare,
    drawCircle, and equal methods. Then, at ④, we have the Snake constructor and all
    of its methods. After that, at ⑤, is the Apple constructor and draw and move methods.


    Finally, at ⑥, you can see the code that starts the game and keeps it running.
    First we create the snake and apple objects. Then we use setInterval to get the
    game animation going. Notice that when we call setInterval, we save the interval
    ID in the variable intervalId so we can cancel it later in the gameOver function.


    The function passed to setInterval is called for every step of the game. It is
    responsible for drawing everything on the canvas and for updating the state of
    the game. It clears the canvas and draws the score, the snake, the apple, and
    the border. It also calls the move method on the snake, which, as you saw earlier,
    moves the snake one step in its current direction. After the call to setInterval,
    at ⑦, we end with the code for listening to keyboard events and setting the snake''s
    direction.


    ![](img/e5791ceef5f489e724ff12c45401c333_316_0.png)


    As always, you''ll need to type all this code inside the script element in your
    HTML document. To play the game, just load snake.html in your browser and use
    the arrows to control the snake''s direction. If the arrows don''t work, you might
    need to click inside the browser window to make sure it can pick up the key events.


    If the game doesn''t work, there might be an error in JavaScript. Any error will
    be output in the console, so look for any helpful messages. If you can''t determine
    why things aren''t working, check each line carefully against the preceding listing.


    Now that you have the game running, what do you think? How high a score can you
    get?'
