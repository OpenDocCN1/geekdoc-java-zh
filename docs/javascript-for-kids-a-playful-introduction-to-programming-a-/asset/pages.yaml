    function, diffX is the length of the horizontal edge of the triangle, and diffY
    is the length of the vertical edge.


    To calculate the distance between the click and the treasure, we need to calculate
    the length of the hypotenuse, based on the lengths diffX and diffY. A sample calculation
    is shown in Figure 11-3.


    ![](img/e5791ceef5f489e724ff12c45401c333_200_0.png)


    **Figure 11-3:** Calculating the hypotenuse to find out the distance between event
    and target


    To get the length of the hypotenuse, we first have to square diffX and diffY.
    We then add these squared values together, and get the square root using the JavaScript
    function Math.sqrt. So our complete formula for calculating the distance between
    the click and the targets looks something like this:


    ```

    Math.sqrt((diffX * diffX) + (diffY * diffY))

    ```


    The getDistance function calculates this and returns the result.'
