  md: '# INTRODUCTION


    Welcome to JavaScript for Kids! In this book, you''ll learn to program with JavaScript,
    the language of the Web. But more than that, you''ll become a programmer—someone
    who not only *uses* computers but also *controls* them. Once you learn to program,
    you can bend computers to your will and make them do whatever you want!'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'JavaScript is a great programming language to learn because it''s used everywhere.
    Web browsers like Chrome, Firefox, and Internet Explorer use JavaScript. With
    the power of JavaScript, web programmers can transform web pages from simple documents
    into full-blown interactive applications and games.


    But you''re not limited to building web pages. JavaScript can run on web servers
    to create websites and can even be used to control robots and other hardware!


    # # WHO SHOULD READ THIS BOOK?


    This book is for anyone who wants to learn JavaScript or to start programming
    for the first time. The book is designed to be kid friendly, but it can serve
    as a first programming book for beginners of all ages.


    With this book, you''ll build up your knowledge of JavaScript gradually, starting
    with JavaScript''s simple data types, moving onto complex types, control structures,
    and functions. After that you''ll learn how to write code that reacts when the
    user moves the mouse or presses a key on the keyboard. Finally, you''ll learn
    about the canvas element, which lets you use JavaScript to draw and animate anything
    you can!


    Along the way, you''ll create a few games to stretch your programming skills and
    put what you''ve learned to good use.


    # # HOW TO READ THIS BOOK


    First off, read it in order! That might sound like a silly thing to say, but lots
    of people want to jump straight into the fun stuff, like making games. Each chapter
    is meant to build on what was covered in earlier chapters, so if you begin at
    the beginning, you''ll have an easier time when you get to the games.


    Programming languages are like spoken languages: you have to learn the grammar
    and the vocabulary, and this takes time. The only way to improve is by writing
    (and reading) a lot of code. As you write more and more JavaScript, you''ll find
    certain parts of the language become second nature, and eventually you''ll become
    a fluent writer of JavaScript.


    As you read, I encourage you to type out and test the code examples throughout
    the book. If you don''t fully understand what''s'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'going on, try making small changes to see what effect they have. If the changes
    don''t have the effect you expected, see you can find out why.


    Above all, work through the “Try It Out” and “Programming Challenges” sections.
    Typing out the code that appears in the book is a good first step, you''ll understand
    programming at a deeper level when you start writing your code. If you find a
    challenge interesting, keep at it! Come up with your own challenges to build even
    more onto the programs you''ve written.


    You''ll find sample solutions to the programming challenges (as well as the code
    files for the games and other examples) at http://nostarch/javascriptforkids/.
    Looking looking the solutions after you''ve solved a challenge, so you can compare
    your approach to mine. Or, if you''re stuck, you can check the solution for hints.
    Remember that these are just sample solutions. There are many, many different
    ways to accomplish the same goal in JavaScript, so don''t worry if you end up
    with a completely different solution from mine!


    If you come across a word and don''t know what it means, check the glossary at
    the back of the book. The glossary contains definitions for many of the programming
    terms you''ll encounter in this book.


    # WHAT''S IN THIS BOOK?


    +   - Chapter 1 gives you a quick introduction to JavaScript and you started writing
    JavaScript in Google Chrome.


    +   - Chapter 2 introduces variables and the basic data types used by JavaScript:
    numbers, strings, and Booleans.


    +   - Chapter 3 is all about arrays, which are used to hold lists of pieces of
    data.


    +   - Chapter 4 is about objects, which contain pairs of keys and values.


    +   - Chapter 5 is an introduction to HTML, the language used to create web pages.


    +   - Chapter 6 shows you how to gain more control over your code using if statements,
    for loops, and other control structures.


    +   - Chapter 7 puts together everything you''ve learned so far to create a simple
    Hangman word-guessing game.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Chapter 8 shows you how to write your own functions so you can group together
    and reuse blocks of code.


    Chapter 9 introduces jQuery, a tool that makes it easy to control web pages using
    JavaScript.


    Chapter 10 shows you how to use timeouts, intervals, and event handlers to make
    your code more interactive.


    Chapter 12 teaches a style of programming called object-oriented programming.


    Chapter 13 introduces the canvas element, which allows you to draw graphics on
    a web page with JavaScript.


    Chapter 14 builds on the animation techniques you learned in Chapter 10 so you
    can create animations with canvas, and


    Chapter 15 shows you how to control those canvas animations with the keyboard.


    In Chapters 16 and 17, you''ll program a complete Snake game, using everything
    you learned in the previous 15 chapters!


    The Afterword gives you some ideas for how to learn even more about programming.


    The Glossary contains definitions for many of the new words you''ll encounter.


    # HAVE FUN!


    One thing to remember: Have fun! Programming can be a playful and creative activity,
    just like drawing or playing a game (in fact, you''ll be drawing and playing games
    with JavaScript a lot in this book). Once you get the hang of how to write code,
    the only limit is your imagination. Welcome to the amazing world of computer programming—I
    hope you have a blast!'
