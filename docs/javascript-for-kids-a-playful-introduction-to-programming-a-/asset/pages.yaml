  md: "# LEAVING A FUNCTION EARLY WITH RETURN\n\nAs soon as the JavaScript interpreter\
    \ reaches return in a function, it leaves the function, even if more code remains\
    \ in the function body.\n\nOne common way to use return is to leave a function\
    \ early if any of the arguments to the function are invalid; that is, if they're\
    \ not the kind of arguments the function needs to order properly. For example,\
    \ the following function returns a string telling you the fifth character of your\
    \ name. If the name passed to the function has fewer than five characters, the\
    \ function uses return to leave the function immediately. This means the return\
    \ statement at the end, which tells you the fifth letter of your name, is never\
    \ executed.\n\n![](img/e5791ceef5f489e724ff12c45401c333_161_0.png)\n\n```\nvar\
    \ fifthLetter = function (name) {\n  if (name.length < 5) {\n    return;\n  }\n\
    \n  return \"The fifth letter of your name is \" + name[4] + \".\";\n}\n```\n\n\
    ① we check to see whether the length of the input name is less than five. If it\
    \ is, we use return at ② to exit the function. Let's try calling this function.\n\
    \nfifthLetter(\"Nicholas\");\n\"The fifth letter of your name is o.\"\n\nThe name\
    \ Nicholas is longer than five characters, so fifthLetter completes and returns\
    \ the fifth letter in the name"
  merge: -1
  pgno: 161
- img_proc: true
  md: "Nicholas, which is the letter o. Let's try calling it again on a shorter name:\n\
    \n```\nfifthLetter(\"Nick\");nunefined\n```\n\nWhen we call fifthLetter with the\
    \ name Nick, the function knows that name isn't long enough, so it exits early\
    \ with the first return statement at ❶. Because there is no value specified after\
    \ the return at ➁, the function returns undefined.\n\n# USING RETURN MULTIPLE\
    \ TIMES INSTEAD OF IF...ELSE STATEMENTS\n\nWe can use multiple return keywords\
    \ inside different if statements to have a function return a different value depending\
    \ on the input. For example, say you're writing a game that awards medals based\
    \ on their score. A score of 3 or below is a bronze medal, scores between 3 and\
    \ 7 are silver, and anything-above 7 is gold. You could use a function like medalForScore\
    \ to evaluate a score and return the right kind of medal, as shown here:\n\n![](img/e5791ceef5f489e724ff12c45401c333_162_0.png)\n\
    \n```\nvar medalForScore = function (score) {\n  if (score < 3) {\n    return\
    \ \"Bronze\";\n  }\n```\n\n```\nif (score < 7) {\n    return \"Silver\";\n  }\n\
    ```\n\n```\nreturn \"Gold\";\n};\n```\n\n❶ we return \"Bronze\" and exit the function\
    \ if the score is less than 3. If we reach ➁ we know that score must be at least\
    \ 3, because if it was less than 3, we would have returned already"
  merge: -1
  pgno: 162
- img_proc: true
  md: "(that is, we would have exited the function when we reached the return keyword\
    \ in the first test). Finally, if we reach, we know that score must be at least\
    \ 7, so there's nothing left to check, and we can just return \"Gold\".\n\nAlthough\
    \ we're checking multiple conditions, we don't need to chain if...else statements.\
    \ We use if...else statements to ensure that only one of the options is executed.\
    \ When each of the options has its own return statement, this also ensures that\
    \ only one of the options will be executed (because functions can return only\
    \ once).\n\n# SHORTHAND FOR CREATING FUNCTIONS\n\nThere's a longhand way and a\
    \ shorthand way to write functions. I'm using the longhand way because it shows\
    \ more clearly how a function is stored as a variable. Still, you should know\
    \ what the shorthand looks like because lots JavaScript code uses it. Once you're\
    \ used to functions work, you might want to use the shorthand version, too. Here's\
    \ an example of a longhand function:\n\n```\nvar double = function(number) {\n\
    \  return number * 2;\n}\n```\n\nThe shorthand version looks like this:\n\n```\n\
    function double(number) {\n  return number * 2;\n}\n```\n\nAs you can see, in\
    \ the longhand version, we explicitly create a variable name and assign the function\
    \ to the variable, so double appears before the function keyword. By contrast,\
    \ the function keyword appears first in the shorthand version, followed by the\
    \ function name. In this version, the variable double is created by JavaScript\
    \ behind the scenes.\n\nIn technical terms, the longhand version is known as a\
    \ function expression. The shorthand version is known as a function declaration."
