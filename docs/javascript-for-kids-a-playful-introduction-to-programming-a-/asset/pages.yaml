  md: 'y-coordinates. Calling moveTo picks up our virtual JavaScript pen off the canvas
    paper and moves it to those coordinates without drawing a line.


    To start drawing a line, we call the lineTo method at x- and y-coordinates, which
    places the virtual pen back on the canvas and traces a path to these new coordinates.
    Here, we draw a line from the point (10, 10) to the point (60, 60)—a diagonal
    line from the top left of the canvas to the bottom right, forming the first line
    of the X.


    At we call moveTo again, which sets a new location to draw.


    At we call lineTo again, to draw a line from (60, 10) to (10, 60)—a diagonal line
    from the top right of the bottom left, completing the X shape.


    But we''re not done yet! So far we''ve only told the canvas what we''d draw; we
    haven''t actually drawn anything. So at, we call the stroke method, which finally
    makes the lines appear on the screen.


    ![](img/e5791ceef5f489e724ff12c45401c333_233_0.png)


