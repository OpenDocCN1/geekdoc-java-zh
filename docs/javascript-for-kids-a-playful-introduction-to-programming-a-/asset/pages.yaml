- img_proc: true
  md: 'HTML (Hyper-Text Markup Language) is the language used to make web pages. The
    word HyperText refers to text that is connected by hyperlinks, the links on a
    web page. A markup language is used to annotate documents so that they''re not
    plaintext. The markup tells software (like a web browser) how to display the text
    and what to do with it.


    In this chapter, I''ll show you how to write HTML documents in a text editor,
    a simple program for writing plaintext files without the formatting you find in
    word processors Microsoft Word. Word-processed documents contain formatted text
    (with different fonts, type colors, font sizes, etc.), and word processors are
    designed to make it easy to change the formatting of the text. Word processors
    usually allow you to insert images and graphics as well.


    Plaintext files contain any text, without any information about the font, color,
    size, and so on. You can''t put an image in a text file unless you make out of
    text—like this cat, for example.


    ![](img/e5791ceef5f489e724ff12c45401c333_104_0.png)


    # TEXT EDITORS


    We will write our HTML in the cross-platform (compatible with Windows, Mac OS,
    and Linux) Sublime Text editor. You can download and use Sublime Text for free,
    but after a while you''ll be asked to pay for a license. If you don''t like that
    idea, I''ve listed some completely free alternatives below. My instructions in
    this chapter are geared toward Sublime Text, but since text editors are relatively
    simple, the instructions should work pretty much the same for any editor.


    +   - Gedit is a cross-platform text editor from the GNOME project (https://wiki.gnome.org/Apps/Gedit/).

    - For Microsoft Windows, Notepad++ (http://notepad-plus-plus.org/) is another
    good alternative.

    - On Mac OS, TextWrangler (http://www.barebones.com/products/textwrangler/) is
    a good option.


    To install Sublime Text, visit http://www.sublimetext.com/. Installation instructions
    differ for each operating system, but you should find them pretty clear. If you
    run into any problems, try the Support Section at the Sublime Text home page.'
  merge: -1
