- img_proc: true
  md: 'All of these animations work in basically the same way: we draw a shape of
    a particular size in a particular position, then we update that size or position,
    and then we clear the canvas and draw the shape again. For elements moving around
    a 2D canvas, we generally have to keep track of the x- and y-coordinates of the
    element. For the bee animation, we added or subtracted a random number from the
    x- and y-coordinates. For the bouncing ball, we added the current xspeed and yspeed
    to the x- and y-coordinates. In the next chapter, we''ll add interactivity to
    our canvas, which will let us control what''s drawn to the canvas using the keyboard.


    # PROGRAMMING CHALLENGES


    Here are some ways you can build on the bouncing ball animation from this chapter.


    # #1: BOUNCING THE BALL AROUND A LARGER CANVAS


    Our 200-by-200-pixel canvas is a bit small. What if you wanted to increase the
    canvas size to 400 by 400 pixels or some other arbitrary size?

    Instead of entering the width and height of the canvas manually throughout your
    program, you can create width and height variables and set the variables using
    the canvas object. Use the following code:


    ```

    var width = canvas.width;

    var height = canvas.height;

    ```


    Now if you use these variables throughout your program, you only have to change
    the properties on the canvas element in the HTML if you want to try out a new
    size. Try changing the size of the canvas to 500 pixels by 300 pixels. Does your
    program still work?


    # #2: RANDOMIZING THIS.XSPEED AND THIS.YSPEED


    To make the animation more interesting, setting this.xspeed and this.yspeed to
    different random numbers (between -5 and 5) in the Ball constructor.


    (continued)'
