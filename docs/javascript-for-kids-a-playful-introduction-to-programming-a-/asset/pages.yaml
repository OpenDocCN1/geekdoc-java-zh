  md: 'Running JavaScript in an HTML file is quite different from running in the console.
    When you''re using the JavaScript console, each line you type is run as soon as
    you press ENTER, and the value of that line is printed out to the console. In
    a web page, the JavaScript is all run from top to bottom at one time, and nothing
    is automatically printed to the console, unless we tell the browser otherwise.
    We can use console.log to print things out, which will make it easier to see what''s
    going on as we run our programs. The console.log method takes any value and prints
    out, or *logs*, that value to the console. For example, if you load the HTML file
