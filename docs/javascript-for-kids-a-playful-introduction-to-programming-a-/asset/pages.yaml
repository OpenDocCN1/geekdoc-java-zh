  md: '# SETTING THE TEXT BASELINE


    The coordinate location that determines where the text appears is called the baseline.
    By default, the bottom-left corner of the text is lined up with the baseline point
    so that the text appears above and to the right of that point.


    To change where the text appears in relation to the baseline, we can change the
    textBaseline property. The default value for this property is "bottom", but you
    can also set the textBaseline property to "top" or "middle". Figure 16-6 shows
    how the text is aligned for each of these options, in relation to the baseline
    point (shown as a red dot) that you pass to fillText.


    | bottom | middle | top |


    Figure 16-6: The effect of changing textBaseline


    For example, to run your text below the baseline, enter:


    ```

    ctx.textBaseline = "top";nctx.fillText("Hello world!", 50, 50);

    ```


    Now, when you call fillText, the text will be below the point (50, 50), as you
    can see in Figure 16-7.


    ![](img/e5791ceef5f489e724ff12c45401c333_287_0.png)


    Figure 16-7: The string Hello world! with textBaseline set to "top"'
