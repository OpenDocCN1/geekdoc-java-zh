    # # 1nWHAT IS JAVASCRIPT?


    Computers are incredibly powerful machines, capable of performing amazing feats
    like playing competitive chess, serving thousands of web pages, or making millions
    of complex calculations in less than a few seconds. But deep down, computers are
    actually pretty dumb. Computers can *only* do exactly what humans tell them to
    do. We tell computers how to behave using computer programs, which are just sets
    of instructions for the computers to follow. Without programs, computers can''t
    do anything at all!'
