- img_proc: true
  md: 'Oh no! Not only have we lost the formatting, but everything''s on one long
    line! The reason is that in HTML, all whitespace is collapsed into a single space.
    Whitespace means any character that results in blank space on the page—for example,
    the space character, the tab character, and the newline character(the character
    that is inserted when you press ENTER or RETURN). Any blank lines you insert between
    two pieces of text in an HTML document will get collapsed into a single space.


    The p and h1 elements are called block-level elements because they display their
    content in a separate block, starting on a new line, and with any following content
    on a new line.


    # INLINE ELEMENTS


    Let’s add two more elements to our document, em and strong:


    ```

    <h1>Hello world</h1>

    <p>My <em>first</em> <strong>web page</strong>.</</p>

    <p>Let''s add another <strong><em>paragraph</em></strong>.</p>

    ```


    Figure 5-5 shows what the page looks like with the new tags.


    ![](img/e5791ceef5f489e724ff12c45401c333_108_0.png)


    Figure 5-5: The em and strong elements


    The em element makes its content italic. The strong element makes its content
    bold. The em and strong elements are both inline elements, which mean that they
    don''t put their content onto a new line, as block-level elements do.'
  merge: -1
