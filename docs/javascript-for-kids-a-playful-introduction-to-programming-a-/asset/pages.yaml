  md: 'Now, when you want information about a movie, it''s easy to find:


    Here we save the movie information about Finding Nemo into a variable called findingNemo.
    We can then look at the properties of this object (like duration and format) to
    find out about the movie.

    You can also easily add new movies to your collection:


    ```

    var cars = {

    releaseDate: 2006,

    duration: 117,

    actors: ["Owen Wilson", "Bonnie Hunt", "Paul Newman"],

    format: "Blu-ray"\n};

    movies["Cars"] = cars;

    ```


    Here we create a new object of movie information about Cars. We insert this into
    the movies object, under the key "Cars".

    Now that you''re building up your collection, you might find an easy way to list
    the names of all your movies. That''s where Object.keys comes in:


    ```

    Object.keys(movies);

    ```


    [\Finding Nemo", "Star Wars: Episode VI - Return of the Jedi", "Harry Potter and
    the Goblet of Fire", "Cars"];


    # WHAT YOU LEARNED


    You''ve seen how objects work in JavaScript. They''re a lot like arrays, because
    you can use them to hold lots of pieces of information together in one unit. One
    major difference is that you use strings to access elements in an object and you
    use numbers to access elements in an array. For this reason, arrays are ordered,
    while objects are not.


    We''ll be doing a lot more with objects in later chapters, we''ve learned more
    about JavaScript''s features. In the next chapter, we''ll look at conditionals
    and loops, which are both ways of adding structure to our programs to make them
    more powerful.'
