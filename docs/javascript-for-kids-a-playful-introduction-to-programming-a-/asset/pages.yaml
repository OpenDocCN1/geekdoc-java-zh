    # # 5

    THE BASICS OF HTML


    The browser-based JavaScript console that we''ve been using so far is great for
    trying out small snippets of code, but in order to create actual programs, we''ll
    need something a bit more flexible, like a web page with some JavaScript in it.
    In this chapter, we''ll learn how to create a basic HTML web page.'
