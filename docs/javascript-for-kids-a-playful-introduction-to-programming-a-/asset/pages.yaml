    # GAME PROGRAMMING


    If you want to do more game programming in JavaScript, you might want to try using
    a game engine. A game engine is a collection of code that handles a lot of the
    lower-level concerns of the game (like keyboard and mouse input), allowing you
    to concentrate on the parts that make your game different. Here are some resources
    you can check out to learn more about game programming and game engines:


    +   - Crafty game engine: http://craftyjs.com/

    - Pixi Renderer: https://github.com/GoodBoyDigital/pixi.js

    - HTML5 Game Engines: http://html5gameengine.com/

    - Udacity HTML5 Game Development: https://www.udacity.com/course/cs255

    - 3D Game Programming for Kids by Chris Storm (Pragmatic Programmers, 2013)


    # SHARING YOUR CODE USING JSFIDDLE


    If you want to share all the great JavaScript you''ve written with the world?
