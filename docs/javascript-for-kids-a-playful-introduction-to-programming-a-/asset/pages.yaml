  md: 'As we create the snake and apple objects for this game, we''ll use the object-oriented
    programming techniques we learned in Chapter 12 to create constructors and methods
    for each object. Both our snake and apple objects will rely on a more basic block
    object, which we''ll use to represent one block on the game grid. Let''s start
