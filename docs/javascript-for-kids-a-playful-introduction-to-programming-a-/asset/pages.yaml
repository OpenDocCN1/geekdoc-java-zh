  md: '# MEET JAVASCRIPT


    Even worse, computers can''t understand English or any other spoken language.
    Computer programs are written in a programming language like JavaScript. You might
    not have heard of JavaScript before, but you''ve certainly used it. The JavaScript
    programming language is used to write programs that run in web pages. JavaScript
    can control how a web page looks or makes the page respond when a viewer clicks
    a button or moves the mouse.


    Sites like Gmail, Facebook, and Twitter use JavaScript to make it easier to send
    email, post comments, or browse websites. For example, when you''re on Twitter
    reading tweets from @nostarch and you see more tweets at the bottom of the page
    you scroll down, that''s JavaScript in action.


    You only have to visit a couple of websites to see why JavaScript is so exciting.


    +   - JavaScript lets you play music and create amazing visual effects. For example,
    you can fly through an interactive music video created by HelloEnjoy for Ellie
    Goulding''s song “Lights” (http://lights.helloenjoy.com/), as shown in Figure
    1-1.

    - JavaScript lets you build tools for others to make their own art. Patatap (http://www.patatap.com/)
    is a kind of virtual “drum machine” that creates all kinds of cool noises—animations
    to go along with them—as shown in Figure 1-2.


    ![](img/e5791ceef5f489e724ff12c45401c333_30_0.png)'
