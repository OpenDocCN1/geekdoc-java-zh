  md: "# CREATING A SETDIRECTION METHOD\n\nNow we have to create a way to set the\
    \ direction of the ball. We'll do that with a method called setDirection. This\
    \ method will be called by our keydown event handler, which you'll see in the\
    \ next section. The keydown handler will tell setDirection key was pressed by\
    \ passing it a string (\"left\", \"up\", \"right\", \"down\", or \"stop\"). Based\
    \ on that string, setDirection will change the xSpeed ySpeed properties of the\
    \ ball to make it move in the direction that matches the keypress. For example,\
    \ if the string \"down\" is passed, we set this.xSpeed to 0 and this.ySpeed to\
    \ 5. Add this code after the draw method:\n\n```\nBall.prototype.setDirection\
    \ = function (direction) {\n  if (direction === \"up\") {\n    this.xSpeed = 0;\n\
    \    this.ySpeed = -5;\n  } else if (direction === \"down\") {\n    this.xSpeed\
    \ = 0;\n    this.ySpeed = 5;\n  } else if (direction === \"left\") {\n    this.xSpeed\
    \ = -5;\n    this.ySpeed = 0;\n  } else if (direction === \"right\") {\n    this.xSpeed\
    \ = 5;\n    this.ySpeed = 0;\n  } else if (direction === \"stop\") {\n    this.xSpeed\
    \ = 0;\n    this.ySpeed = 0;\n  }\n};\n```\n\nThe entire body of this method is\
    \ one long if...else statement. The new direction is passed into the method as\
    \ the direction argument. If direction is equal to \"up\", we set the ball's xSpeed\
    \ property to 0 and its ySpeed property to -5. The other directions are handled\
    \ in the same way. Finally, if the direction is set to the string \"stop\", we\
    \ set both this.xSpeed and this.ySpeed to 0, which means that the ball will stop\
    \ moving."
