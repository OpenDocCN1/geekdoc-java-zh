- img_proc: true
  md: 'To make content bold and put it inside both tags. Notice in the previous example
    that the bold italic text has the tags in this order: <strong><em><paragraph></</em>></strong>.
    It''s important to properly nest elements. Nesting means that if an element is
    inside another element, its opening and closing tags should both be inside the
    parent element. For example, this is not allowed:


    ```

    <<strong><em><paragraph></</em>>

    ```


    In this case, the closing <strong> tag comes before the closing </em> tag. Browsers
    generally won''t tell you when you''ve made a mistake like this, but getting wrong
    can cause your pages to break in strange ways.


    # # A FULL HTML DOCUMENT


    We''ve looked at so far is really just a snippet of HTML. A full HTML document
    requires some extra elements. Let''s take a look at example of a complete HTML
    document and what each part means. Update your page.html file with these new elements:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>My first proper HTML page</title>

    </head>

    <body>

    <h1>Hello world!</h1>

    <p>My <em>first</em> <strong>web page<strong><em><paragraph></</em>></strong>.</</p>

    <p>Let''s add another <strong><em><paragraph></</em>></strong>.</</p>

    </body>

    </html>

    ```


    NOTE


    Sublime Text should automatically indent lines for you, as shown in this example.
    It''s actually identifying lines based on their tags (like <html>, <h1>, and so
    on) and indenting them according to their nesting. Sublime Text doesn''t indent
    the <head> and <body> tags, though some editors do.'
