    # # CREATING OBJECTS USING CONSTRUCTORS


    A JavaScript constructor is a function that creates objects and gives them a set
    of built-in properties and methods. Think of it as a specialized machine for creating
    objects, kind of a factory that can churn out tons of copies of the same item.
    Once you''ve set up a constructor, you can use it to make as many of the same
    object as you want. To try it out, we''ll build the beginnings of a racing game,
    using a Car constructor to create a fleet of cars with basic properties and methods
    for steering and acceleration.


    # # ANATOMY OF THE CONSTRUCTOR


    Each time you call a constructor, it creates an object and gives the new object
    built-in properties. To call a normal function, you enter the function name followed
    by a pair of parentheses. To call a constructor, you enter the keyword new (which
    tells JavaScript that you want to use your function as a constructor), followed
    by the constructor name and parentheses. Figure 12-1 shows the syntax for calling
    a constructor.'
