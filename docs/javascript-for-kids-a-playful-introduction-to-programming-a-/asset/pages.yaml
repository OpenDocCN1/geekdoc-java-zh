  md: '# WHAT YOU LEARNED


    In this chapter, we made a full game using the canvas element. This game combines
    many of the data types, concepts, and techniques you learned throughout this book:
    numbers, strings, Booleans, arrays, objects, control structures, functions, object-oriented
    programming, event handlers, setInterval and drawing with canvas.


    Now that you''ve programmed this Snake game, there are lots of other simple two-dimensional
    games that you could write JavaScript. You could make your own version of classic
    games like Breakout, Asteroids, Space Invaders, or Tetris. Or you could make up
    your own game!


    Of course, you can use JavaScript for programs besides games. Now that you''ve
    used JavaScript to do some complicated math, you could use it to help with your
    math homework. Or maybe you want to create a website to show off your programming
    skills to the world. The possibilities are endless!


    # PROGRAMMING CHALLENGES


    Here are a few ways you could improve and add features to the game.


    +   #1: MAKING THE GAME BIGGER


    Change the size of the game to 500 pixels square. Where do you need to modify
    the code to make it work at 500 pixels?


    +   #2: COLORING THE SNAKE


    Our snake is a bit boring: every segment of the body is blue. It might look a
    bit more like a real snake if you alternated the colors to create stripes. For
    example, make the head green and then alternate between blue and yellow for the
    rest of the body, or choose your own colors.


    (continued)'
