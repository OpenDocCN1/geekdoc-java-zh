  md: '# WORKING WITH ARRAYS


    Properties and methods help you work with arrays. Properties generally tell you
    something about the array, and methods usually do something to change the array
    or return a new array. Let''s have a look.


    # FINDING THE LENGTH OF AN ARRAY


    Sometimes it''s useful to know how many elements there are in an array. For example,
    if you adding dinosaurs to your array, you might forget how many dinosaurs you
    have.


    The length property of an array tells you how many elements are in the array.
    To find the length of an array, just add .length to the end of its name. Try it
    out. First we''ll make a new array with three elements:


    ```

    var maniacs = ["Yakko", "Wakko", "Dot"];

    maniacs[0];

    "Yakko"

    maniacs[1];

    "Wakko"

    maniacs[2];

    "Dot"

    ```


    > To find the length of the array, add .length to maniacs:


    ```

    maniacs.length;

    3

    ```


    JavaScript tells us that there are 3 elements in the array, and we already know
    they have the index positions 0, 1, and 2. This gives us a useful piece of information:
    the last index in an array is always the same number as the length of the array
    minus 1. This means that there is an easy way to access the last element in an
    array, however long that array is:


    ```

    maniacs[maniacs.length - 1];

    "Dot"

    ```'
