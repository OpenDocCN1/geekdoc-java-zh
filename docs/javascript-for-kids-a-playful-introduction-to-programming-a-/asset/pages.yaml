  md: '![](img/e5791ceef5f489e724ff12c45401c333_232_0.png)


    # DRAWING LINES OR PATHS


    Lines on the canvas are called *paths*. To draw a path with the canvas, you use
    x- and y-coordinates to set where each line begins and end. By using a careful
    combination of starting and stopping coordinates, you can draw specific shapes
    on the canvas. For example, here''s how you might draw the turquoise X in Figure
    13-6:


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    ctx.strokeStyle = "Turquoise"

    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.moveTo(10, 10);

    ctx.lineTo(60, 60);

    ctx.moveTo(60, 10);

    ctx.lineTo(10, 60);

    ctx.stroke();

    ```


    ![](img/e5791ceef5f489e724ff12c45401c333_232_1.png)


    At ① and ② we set the color and width of the line. At ③ we call the beginPath
    method on the drawing context (saved as ctx) to tell the canvas that we want to
    start drawing a new path. At ④ we call the moveTo method with two arguments: x-
    and'
