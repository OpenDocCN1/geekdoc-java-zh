  md: '![](img/e5791ceef5f489e724ff12c45401c333_39_0.png)


    # 2 DATA TYPES AND VARIABLES


    Programming is all about manipulating data, but what *is* data? *Data* is information
    that we store in our computer programs. For example, your name is a piece of data,
    and so is your age. The color of your hair, how many siblings you have, where
    you live, whether you’re male or female—these things are all data.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'In JavaScript, there are three basic types of data: numbers, strings, and Booleans.
    Numbers are used for representing, well, numbers! For example, your age can be
    represented as a number, and so can your height. Numbers in JavaScript look like
    this:


    ```

    5;

    ```


    Strings are used to represent text. Your name can be represented as a string in
    JavaScript, as can your email address. Strings look like this:


    ```

    "Hi, I''m a string";

    ```


    Booleans are values that can be true or false. For example, a Boolean value about
    whether you would wear glasses. Another could be whether you like broccoli. A
    Boolean looks like this:


    ![](img/e5791ceef5f489e724ff12c45401c333_40_0.png)


    ```

    true;

    ```


    There are different ways to work with each data type. For example, you can multiply
    two numbers, but you can''t multiply two strings. With a string, you can ask for
    the first five characters. With Booleans, you can check to see whether two values
    are both true. The following code example illustrates each of these possible operations.


    ```

    99 * 123;

    12177

    "This is a long string".slice(0, 4)

    "This"

    true && false;

    false

    ```


    All data in JavaScript is just a combination of types of data. In this chapter,
    we''ll look at each type in turn and learn different ways to work with each type.


    You may have noticed that all of these commands end with a semicolon (;). Semicolons
    mark the end of a JavaScript command or instruction (also called a statement),
    sort of like the period at the end of a sentence.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# NUMBERS AND OPERATORS


    JavaScript lets you perform basic mathematical operations like addition, subtraction,
    multiplication, and division. To make these calculations, we use the symbols +,
    -, *, and /, which are called operators.


    You can use the JavaScript console just like a calculator. We''ve already seen
    one example, adding together 3 and 4. Let''s try something-hard. What''s 12,345
    plus 56,789?


    ```

    12345 + 56789;

    69134

    ```


    That''s not so easy to work out in your head, JavaScript calculated it in no time.
    You can add multiple numbers with multiple plus signs:


    ```

    22 + 33 + 44;

    99

    ```


    JavaScript can also do subtraction . . .


    ```

    1000 - 17;

    983

    ```


    and multiplication, using an asterisk . . .


    ```

    123 * 456;

    56088

    ```


    and division, using a forward slash . . .


    ```

    12345 / 250;

    49.38

    ```


    You can also combine these simple operations to make something more complex, like
    this:


    ```

    1234 + 57 * 3 - 31 / 4;

    1397.25

    ```


    Here it gets a bit tricky, because the result of this calculation (the answer)
    will depend on the order that JavaScript does'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'each operation. In math, the rule is that multiplication and division always
    take place before addition and subtraction, and JavaScript follows this rule as
    well.


    Figure 2-1 shows the order JavaScript would follow. First, JavaScript multiplies
    57 * 3 and gets 171 (shown in red). Then it divides 31 / 4 to get 7.75 (shown
    in blue). Next it adds 1234 + 171 to get 1405 (shown in green). Finally it subtracts
    1405 - 7.75 to get 1397.25, which is the final result.


    ```

    1234 + 57 * 3 - 31 / 4

    1234 + 171 - 31 / 4

    1234 + 171 - 7.75

    1405 - 7.75

    1397.25

    ```


    Figure 2-1: The order of operations: multiplication, division, addition, subtraction


    What if you wanted to do the addition first, before doing the multiplication and
    division? For example, say you have 1 brother and 3 sisters and 8 candies, and
    you want to split the candies equally among your 4 siblings? (You''ve already
    taken your share!) You would have to divide 8 by your number of siblings. Here''s
    an attempt:


    ```

    8 / 1 + 3;

    11

    ```


    That can''t be right! You can''t give each sibling 11 candies when you''ve only
    got 8! The problem is that JavaScript does division before addition, so it divides
    8 by 1 (which equals 8) and then adds 3 to it, giving you 11. To fix this and
    make JavaScript use the addition first, we can use parentheses:


    ```

    8 / (1 + 3);

    2

    ```


    ![](img/e5791ceef5f489e724ff12c45401c333_42_0.png)


    That''s more like it! Two candies to each of your siblings. The parentheses force
    JavaScript to add 1 and 3 before dividing 8 by 4.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# TRY IT OUT!


    Let''s say your friend is trying to use JavaScript to work out how many balloons
    to buy. She''s throwing a party and wants everyone to have 2 balloons to blow
    up. There were originally 15 people coming, but then she invited 9 more. She tries
    the following code:


    ```

    15 + 9 * 2;

    ```


    But that doesn''t seem right. The problem is that the multiplication is happening
    before the addition. How would you add parentheses to make sure that JavaScript
    does the addition first? How many balloons does your friend really need?


    # VARIABLES


    JavaScript lets you give names to values using variables. You can think of a variable
    as a box that you can fit one thing in. If you put something else in it, the first
    thing goes away.


    To create a new variable, use the keyword var, followed by the name of the variable.
    A keyword is a word that has special meaning in JavaScript. In this case, when
    we type var, JavaScript knows that we are about to enter the name of a new variable.
    For example, here''s how you''d make a new variable called nick:


    ```

    var nick;

    undefined

    ```


    We''ve created a new variable called nick. The console spits out undefined in
    response. This isn''t an error! That''s just what JavaScript does whenever a command
    doesn''t return a value. What''s a return value? Well, for example, when you typed
    12345 + 56789;, the console returned the value 69134. Creating a variable in JavaScript
    doesn''t return a value, so the interpreter prints undefined.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'To give the variable a value, use the equal sign:


    ```

    var age = 12;

    efined

    ```


    Setting a value is called assignment (we are assigning the value 12 to the variable
    age). Again, undefined is printed, because we''re creating another new variable.
    (In the rest of my examples, I won''t show the output when it''s undefined.)


    The variable age is now in its interpreter and set to the value 12. That means
    that if you type age on its own, the interpreter will show you its value:


    ```

    age;

    12

    ```


    Cool! The value of the variable isn''t set in stone, though (they''re called variables
    because they can vary), and if you want to update it, just use age =


    ```

    age = 13;

    13

    ```


