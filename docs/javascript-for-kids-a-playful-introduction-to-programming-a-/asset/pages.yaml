  md: '# DEFINING THE SCORE VARIABLE


    Finally, we define the score variable.


    ```

    var score = 0;

    ```


    We''ll use the score variable to keep track of the player''s score. Because this
    is the beginning of the program, we set score equal to 0. We''ll increment it
    by 1 every time the snake eats an apple.


    ![](img/e5791ceef5f489e724ff12c45401c333_284_0.png)


    # DRAWING THE BORDER


    Next, we''ll create a drawBorder function to draw a border around the canvas.
    We''ll make this border one block (10 pixels) thick.


    Our function will draw four long, thin rectangles, for each edge of the border.
    Each rectangle will be blockSize (10 pixels) and the full width and height of
    the canvas.


    ```

    var drawBorder = function () {

    ctx.fillStyle = "Gray";

    ctx.fillRect(0, 0, width, blockSize);

    ctx.fillRect(0, height - blockSize, width, blockSize);

    ctx.fillRect(0, 0, blockSize, height);

    ctx.fillRect(width, 0, blockSize, height);

    };

    ```


    +   1. ctx.fillRect(0, 0, width, blockSize);

    2. ctx.fillRect(0, height - blockSize, width, blockSize);

    3. ctx.fillRect(0, 0, blockSize, height);

    4. ctx.fillRect(width, 0, blockSize, height);


    First set the fillStyle to gray, because we want the border to be gray. Then,
    at ❶, we draw the top edge of the border. Here we''re drawing a rectangle starting
    at (0, 0)—the top-left corner of the canvas—with a width of width (400 pixels)
    and a height of blockSize (10 pixels).


    Next, ➁, we draw the bottom edge of the border. This will be a rectangle at the
    coordinates (0, height - blockSize), or (0, 390). This is 10 pixels up from the
    bottom of the canvas, on the left. The top pixels of, this rectangle has a width
    of width and a height of blockSize.


    Figure 16-3 shows what the top and bottom borders look like.'
