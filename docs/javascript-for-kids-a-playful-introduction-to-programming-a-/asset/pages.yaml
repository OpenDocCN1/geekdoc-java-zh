  md: "# ADDING THE KEYOWN EVENT HANDLER\n\nNow let's add some JavaScript to respond\
    \ to keydown events. Enter this code inside the empty <script> tags in your keyboard.html\
    \ file.\n\n```\n$$(body).keydown(function (event) {\n  console.log(event.keyCode);\n\
    });\n```\n\nIn the first line, we use the jQuery function to select the body element\
    \ in our HTML and then call the keydown method. The argument to the keydown method\
    \ is a function that will be called whenever a key is pressed. Information about\
    \ the keydown event is passed in the function through this program, we want to\
    \ know which key was pressed, and the information is stored in the event object\
    \ as event.key.\n\nInside the function, we use console.log to output the event's\
    \ keyCode property: a number representing the pressed key. Each key on your keyboard\
    \ has a unique keycode. For example, the keycode for the spacebar is 32, and the\
    \ left arrow is 37.\n\nOnce you've edited your keyboard.html file, save it and\
    \ then open it in a browser. Now open the console so you can see the output, and\
    \ click in the main browser window to have JavaScript register your keypresses.\
    \ Now, if you start pressing keys, the corresponding keycodes should be printed\
    \ to the console.\n\nFor example, if you type hi there, you should see the following\
    \ output in the console:\n\n+   72\n73\n32\n84\n72\n69\n82\n69\n\nEvery key you\
    \ press has a different keycode. The H key is 72, the I key is 73, and so on.\n\
    \n![](img/e5791ceef5f489e724ff12c45401c333_263_0.png)"
