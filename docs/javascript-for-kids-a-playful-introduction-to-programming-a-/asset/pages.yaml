    Phew, you made it!\ Did you notice how the first landmark you put in the array
    was also the last one you got out of? And the last landmark you put in was the
    first that came out? You might have thought that you''d always want the first
    item you put in to be the first you get out, but you can see that it''s sometimes
    helpful to go back through an array in reverse.

    It''s actually very common to use a process like this in larger programs, which
    is why JavaScript makes pushing and popping so easy.


    ![](img/e5791ceef5f489e724ff12c45401c333_82_0.png)


    # NOTE


    This technique is known as a stack in computer-speak. Think of it like a stack
    of pancakes. Every time you cook a new pancake, it goes on top (like push), and
    every time you eat one, it comes off the top (like pop). Popping a stack is like
    going back in time: the last item you pop is the first one you pushed. It''s the
    same with pancakes: the last pancake you eat is the first one that was cooked.
    In programming jargon, this is also called Last In, First Out (LIFO). The alternative
    to LIFO is First In, First Out (FIFO). This is also known as a queue, because
    it acts like a queue (or line) of people. The first person to join the queue is
    the first person to be served.


