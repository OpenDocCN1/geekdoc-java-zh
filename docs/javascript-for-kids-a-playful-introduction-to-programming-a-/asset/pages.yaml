  md: '# CHECKING FOR WALL COLLISIONS


    At we create the variable leftCollision and set it to the value of head.col ===
    0. This variable will be true if the snake collides with the left wall; that is,
    when it is in column 0. Similarly, the topCollision in the next line checks the
    row of the snake''s head to see if it has run into the top wall.


    After that, we check for a collision with the right wall by checking whether the
    value of the head is equal to widthInBlocks - 1. Since widthInBlocks is set to
    40, this checks whether the head is see in column 39, which corresponds to the
    right wall, as you can see in Figure 17-1. Then we do the same for bottomCollision,
    checking whether the head''s row property is equal to heightInBlocks - 1.


    At we determine whether the snake has collided with a wall by checking to see
    if leftCollision or topCollision or rightCollision or bottomCollision is true,
    using the || (or) operator. We save the Boolean result in the variable wallCollision.


    ![](img/e5791ceef5f489e724ff12c45401c333_306_0.png)


    # CHECKING FOR SELF-COLLISIONS


    To determine whether the snake has collided with itself, we create a variable
    at called selfCollision and initially set it to false. Then at we use a for to
    loop through all the segments of the snake to determine whether the new head is
    in the same place as any segment, using head.equal(this.segments[i]). The head
    and all of the other segments are blocks, so we use the equal method that defined
    for block objects to see whether they are in the same place. If we find any of
    the snake''s segments are in the same place as the new head, we know that the
    snake has collided with itself, and we set selfCollision to true (at).


    Finally, at we return wallCollision || selfCollision, which will be true if the
    snake has collided with either the wall or itself.'
