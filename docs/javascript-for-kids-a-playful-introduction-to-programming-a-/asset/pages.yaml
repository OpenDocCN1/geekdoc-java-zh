    property, on the other hand, will be updated anytime the player presses an arrow
    key (so if they press the keys really fast, this property could theoretically
    change multiple times per animation step). By keeping these two properties separate,
    we make sure the snake can''t turn back on itself if the player presses two keys
    very quickly between two steps in the animation.


