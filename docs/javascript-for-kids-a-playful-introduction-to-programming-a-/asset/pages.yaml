  md: '# WRITING SOME JAVASCRIPT


    Let''s write a bit of simple JavaScript in Google Chrome (http://www.google.com/chrome/).
    Install Chrome on your computer (if it''s not already installed), and then open
    it and type about:blank in the address bar. Now press ENTER and you''ll see a
    blank page, like the one in Figure 1-4.


    We''ll begin coding in Chrome''s JavaScript console, which is a secret way programmers
    can test out JavaScript programs. On Microsoft Windows or Linux, hold down the
    CTRL and SHIFT keys and press J. On Mac OS, hold down the COMMAND and OPTION keys
    and press J.


    If you''ve done everything correctly, you should see a blank web page, and beneath
    that, a blinking cursor (|) next to a right bracket (>), as shown in Figure 1-4.
    That''s where you will write JavaScript!


    > The console will color your code text; for example, the text you input will
    be blue, and output will be colored based on its type. In this book, we''ll use
    similar colors for our code text wherever we''re using the console.


    ![](img/e5791ceef5f489e724ff12c45401c333_33_0.png)


    Figure 1-4: Google Chrome''s JavaScript console'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'When you enter code at the cursor and press ENTER, JavaScript should run, or
    execute, your code and display the result (if any) on the next line. For example,
    type this into the console:


    ```

    3 + 4;

    ```


    Now press ENTER. JavaScript should output the answer (7) to this simple bit of
    addition on the following line:


    ```

    3 + 4;

    ```


    Well, that''s easy enough. But isn''t JavaScript more than a glorified calculator?
    Let''s try something else.


    # THE STRUCTURE OF A JAVASCRIPT PROGRAM


    Let''s create a bit sillier—a JavaScript program to print a series of cat faces
    that look like this:


    ```

    =^^==

    ```


    Unlike our addition program, this JavaScript program will take multiple lines.
    To type the program into the console, you''ll have to add new lines by pressing
    SHIFT-ENTER at the end of each line. (If you just press ENTER, Chrome will try
    to execute what you''ve written, and the program won''t work as expected. I warned
    that computers were dumb!)


    ![](img/e5791ceef5f489e724ff12c45401c333_34_0.png)


    Type this into your browser console:


    ```

    // Draw many cats as you want!

    drawCats = function (howManyTimes) {

    for (var i = 0; i < howManyTimes; i++) {

    console.log(i + "^^=");

    }

    }

    ```


    ```

    drawCats(10); // You can put any number instead of 10.

    ```'
