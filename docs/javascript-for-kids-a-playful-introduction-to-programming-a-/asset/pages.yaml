  md: '![](img/e5791ceef5f489e724ff12c45401c333_243_0.png)


    Creating canvas animations in JavaScript is a lot like creating a stop-motion
    animation. You draw a shape, pause, erase the shape, and then redraw it in a new
    position. This may sound like a lot of steps, but JavaScript can update the position
    of the shape very quickly in order to create a smooth animation. In Chapter 10,
    we learned how to animate DOM elements. In this chapter, we''ll animate our canvas
    drawings.'
