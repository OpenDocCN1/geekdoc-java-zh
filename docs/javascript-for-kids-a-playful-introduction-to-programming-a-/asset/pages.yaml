  md: 'Figure 5-6 shows the complete HTML document.


    ![](img/e5791ceef5f489e724ff12c45401c333_110_0.png)


    Figure 5-6: The complete HTML document


    Let''s take a walk through the elements in our page.html file. The <!DOCTYPE html>
    tag is just a declaration. It simply says, "This is an HTML document." Next comes
    the opening <html> tag (the closing </html> tag is at the very end). All HTML
    documents must have an html element as its outermost element. There are two elements
    inside the html element: head and body. The head element contains certain information
    about your HTML document, such as the title element, which contains the document''s
    title. For example, note that in Figure 5-6, the title in the browser tab—“My
    first proper HTML page”—matches what we entered in the title element. The title
    element is contained inside the head element, which is contained inside the html
    element. The body element contains the content that will be displayed in the browser.
    Here, we''ve just copied the HTML from earlier in the chapter.


    # HTML HIERARCHY


    HTML elements have a clear hierarchy, or order, and can be thought of as a kind
    of upside-down tree. You can see how our document would look as a tree in Figure
    5-7.


    ![](img/e5791ceef5f489e724ff12c45401c333_110_1.png)


    Figure 5-7: The elements from Figure 5-6, shown as a tree'
