  md: '# USING JQUERY TO WORK WITH THE DOM TREE


    The built-in DOM methods are great, but they''re not very easy to use. Because
    of this, many developers use a set of tools called jQuery to access and manipulate
    the DOM tree. jQuery is a JavaScript library—a collection of related tools (mostly
    functions) that gives us, in this case, a simpler way to work with DOM elements.
    Once we load a library onto our page, we can use its functions and methods in
    addition to those built into JavaScript and those provided by the browser.


    # LOADING JQUERY ON YOUR HTML PAGE


    To use the jQuery library, we first tell the browser to load it with this line
    of HTML:


    ```

    <script src="https://code.jquery.com/jquery-2.1.0.js"></script>

    ```


    Note that the <script> tag has no contents, and it has a src attribute. The src
    attribute lets us insert a JavaScript file into our page by including its URL
    (web address). In this case, https://code.jquery.com/jquery-2.1.0.js is the URL
    for a specific version of jQuery (version 2.1.0) on the jQuery website.


    To see the jQuery library, visit that URL; you''ll see the JavaScript that will
    be loaded when this <script> tag is added. The entire library is over 9,000 lines
    of complicated JavaScript, though, don''t expect to understand it all right now!


    # REPLACING THE HEADING TEXT USING JQUERY


