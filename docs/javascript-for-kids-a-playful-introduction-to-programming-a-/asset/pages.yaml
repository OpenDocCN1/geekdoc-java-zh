  md: '# DRAWING RECTANGLE OUTLINES


    As we''ve seen, the fillRect method draws a filled-in rectangle. That''s fine
    if that''s what you want, but sometimes you might want to draw just the outline,
    as if you were using a pen or pencil. To draw just the outline of a rectangle,
    we use the strokeRect method. (The word stroke is another word for outline.) For
    example, running- this code draws the outline of a small rectangle, as shown in
    Figure 13-4:


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    ctx.strokeRect(10, 10, 100, 20);

    ```


    ![](img/e5791ceef5f489e724ff12c45401c333_231_0.png)


    Figure 13-4: Using strokeRect to draw the outline of a rectangle


    The strokeRect method takes the same arguments as fillRect: first the x- and y-coordinates
    of the top-left corner, followed by the width and height of the rectangle. In
    this example, we see that a rectangle is drawn starting at 10 pixels from the
    top left of the canvas, and it is 100 pixels wide by 20 pixels tall.


    Use the strokeStyle property to change the color of the rectangle''s outline.
    To change the thickness of the line, use the lineWidth property. For example:


    ```

    var canvas = document.getElementById("canvas");

    var ctx = canvas.getContext("2d");

    ctx.strokeStyle = "DeepPink";

    ctx.lineWidth = 4;

    ctx.strokeRect(10, 10, 100, 20);

    ```


    Here, we set the color of the line to DeepPink at ① and the width of the line
    to 4 pixels at ②. Figure 13-5 shows the resulting rectangle.'
