  md: "# USING SETINTERVAL TO ANIMATE THE GAME\n\nAs you can see in the pseudocode,\
    \ every 100 milliseconds we need to call a series of functions and methods that\
    \ update and draw everything to the game board. Just as we've done in Chapters\
    \ 14 and 15, we'll use setInterval to animate the game by calling those functions\
    \ at regular intervals. This is what our call in the final program:\n\n```\nvar\
    \ intervalId = setInterval(function () {\n  ctx.clearRectRect(0, 0, width, height);\n\
    \  drawScore();\n  snake.move();\n  snake.draw();\n  apple.draw();\n  drawBorder();\n\
    }, 100);\n```\n\nIn the function that we pass to setInterval, the first line clears\
    \ the canvas with clearRect so that we can draw the next step in the animation.\
    \ Next we see several function and method calls. Notice that these all roughly\
    \ match up the steps in the pseudocode listing on the previous page.\n\nAlso notice\
    \ that we save the interval ID in the variable intervalId. We'll need that interval\
    \ ID when the game is over and we want to stop the animation (see \"Ending the\
    \ Game\") on page 264).\n\n# CREATING THE GAME OBJECTS\n\nFor this program, we'll\
    \ use the object-oriented programming style we learned about Chapter 12 to represent\
    \ the two main objects in the game: the snake and the apple. We'll create a constructor\
    \ for each of these objects (called Snake and Apple), and we'll add methods (like\
    \ move and draw) to the prototypes of these constructors.\n\nWe'll divide the\
    \ game board into a grid and create a constructor called Block, which we'll use\
    \ to create objects that represent squares in the grid. We'll use these block\
    \ objects to represent the location of segments of the snake, and we'll use a\
    \ single block object to store the apple's current location. These blocks will\
    \ also have methods to let us draw the segments of the snake and the apple."
