  md: "# MOVING ACROSS THE PAGE\n\nLet's use canvas and setInterval to draw a square\
    \ and move it slowly across a page. Create a new file called canvasanimation.html\
    \ and add the following HTML:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Canvas\
    \ Animation</title>\n</head>\n\n<body>\n    <canvas id=\"canvas\" width=\"200\"\
    \ height=\"200\"></canvas>\n\n    <script>\n        // We'll fill this in next\n\
    \    </script>\n</body>\n</html>\n```\n\nNow add the following JavaScript to the\
    \ script element:\n\n```\nvar canvas = document.getElementById(\"canvas\");\n\
    var ctx = canvas.getContext(\"2d\");\n\nvar position = 0;\n\nsetInterval(function\
    \ () {\n    ctx.clearRect(0, 0, 200, 200);\n    ctx.fillRect(position, 0, 20,\
    \ 20);\n\n    position++;\n    if (position > 200) {\n        position = 0;\n\
    \    }\n}, 30);\n```\n\nThe first two lines in this code create the canvas and\
    \ the text. Next, we create the variable position and set it to 0, with the code\
    \ position = 0. We'll use this variable to control the left-right movement of\
    \ the square.\n\nNow we call setInterval to start our animation. The first argument\
    \ to setInterval is a function, which draws a new square every time it is called."
  merge: -1
  pgno: 244
- img_proc: true
  md: '# CLEARING THE CANVAS


    Inside the function we passed to setInterval, we call clearRect at 0 which clears
    a rectangular area on the canvas. The clearRect method takes four arguments, which
    set the position and size of the rectangle to be cleared. With fillRect, the first
    two arguments represent the x- and y-coordinates of the top-left corner of the
    rectangle, and the last two represent the width and height. Calling ctx.clearRect(0,
    0, 200, 200) erases a 200-by-200-pixel rectangle, starting at the very top-left
    corner of the canvas. Because our canvas is exactly 200 by 200 pixels, this will
    clear the entire canvas.


    ![](img/e5791ceef5f489e724ff12c45401c333_245_0.png)


    # DRAWING THE RECTANGLE


    Once we''ve cleared the canvas, at we use ctx.fillRect(position, 0, 20, 20) to
    draw a 20-pixel square at the point (position). When our program starts, the square
    will be drawn at (0, 0) because position starts off set to 0.


    # CHANGING THE POSITION


    Next, we increase position by 1, using position++ at Then we ensure that position
    doesn''t get larger than 200 with the check if (position > 200). If it is, we
    reset it to 0.


    # VIEWING THE ANIMATION IN THE BROWSER


    When you load this page in your browser, setInterval will call the supplied function
    every 30 milliseconds, or about 33 times a second (this time interval is set by
    the second argument to setInterval). Each time the supplied function is called,
    it clears the canvas, draws a square at (position, 0), and increments the variable
    position. As a result, the square gradually moves across the canvas. When the
    square reaches the end of the canvas (200 pixels to the right), its position is
    reset to 0.


    Figure 14-1 shows the first four steps of the animation, zoomed in to the top-left
    corner of the canvas.'
