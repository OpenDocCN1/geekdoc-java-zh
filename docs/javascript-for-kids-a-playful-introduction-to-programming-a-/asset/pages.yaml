    \ the square moves 1 pixel to the right.\n\n# # ANIMATING THE SIZE OF A SQUARE\n\
    \nBy making only three changes to the code in the previous section, we can create\
    \ a square that grows larger instead of moving. Here's what the code would look\
    \ like:\n\n```\nvar canvas = document.getElementById(\"canvas\");\nvar ctx = canvas.getContext(\"\
    2d\");\n\nvar size = 0;\n\nsetInterval(function () {\n  ctx.clearRect(0, 0, 200,\
    \ 200);\n  ctx.fillRect(0, 0, size, size);\n\n  size++;\n  if (size > 200) {\n\
    \    size = 0;\n  }\n}, 30);\n```\n\nAs you can see, we've done two things. First,\
    \ instead of a position variable, we now have a variable named size, which will\
    \ control the dimensions of the square. Second, instead of using this variable\
    \ to set the square's horizontal position, we're using it to set the square's\
