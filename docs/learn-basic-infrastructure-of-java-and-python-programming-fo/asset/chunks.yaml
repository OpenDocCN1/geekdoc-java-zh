  trans: "\n\n在这个示例中，当 `fruit` 变量等于 \"banana\" 时，将执行 `continue` 语句，导致该迭代中循环内部的其余代码被跳过。循环将进入下一次迭代，并打印剩余的水。\n\
    \n### continue while\n\n在 Python 的 `while` 循环中使用 `continue` 语句，你可以将其放置在循环块内部，以跳过当前迭代的剩余代码并移动到下一次迭代。以下是在\
    \ `while` 循环中使用 `continue` 语句的方法：\n\n```python\n# Example: Using continue in a\
    \ while loop\nwhile condition:\n    # Code block\n    if condition:\n        continue\n\
    \    # More code\n```\n\n在此语法中：\n- `condition` 是决定循环是否继续执行的表达式。\n- 只要 `condition`\
    \ 结果为 `True`，`while` 循环就会继续执行。\n- 在循环块内部，带有 `condition` 的 `if` 语句检查是否满足某个特定条件。\n\
    - 如果 `condition` 结果为 `True`，则执行 `continue` 语句，导致跳过该迭代中循环内的其余代码，循环进入下一次迭代。\n\n\
    下面是一个简单的示例，演示了在 `while` 循环中使用 `continue` 语句的方法：\n\n```python\n# Example: Using\
    \ continue in a while loop\ni = 0\nwhile i < 5:\n    i += 1\n    if i == 3:\n\
    \        continue\n    print(i)\n```\n\n输出：\n```\n1245\n```\n\n在这个示例中，当 `i` 等于\
    \ 3 时，执行 `continue` 语句，导致跳过该迭代中循环内的其余代码。循环进入下一次迭代，并打印 `i` 的剩余值。\n\n# 第 5 章：函数\n\
    \n## Python 函数\n\n### 介绍\n在 Python 中，函数是执行特定任务的可重代码块。函数提供了将代码组织成易管理部分的方法，提高了代码的可用性，并使代码更具读性。\n\
    \n以下是在 Python 中定义和使用函数的语法：\n\n#### 1. 定义函数：\n```python\ndef function_name(parameter1,\
    \ parameter2, ...):\n    # Function body\n    # Code to perform the task\n   \
    \ return result\n```\n- `def` 关键字用于定义函数。\n- `function_name` 是函数的名称。\n- `(parameter1,\
    \ parameter2, ...)` 是函数接受的参数列表（如果有）。参数是可选的。\n- `:` 冒号表示函数体的开始。\n- 函数体由执行任务的代码组成。\n\
    - `return result` 语句（可选）用于从函数返回一个值。如果没有 `return` 语句，函数默认默认返回 `None`。\n\n#### 2.\
    \ 使用函数：\n```python\nresult = function_name(argument1, argument2, ...)\n```\n-\
    \ `function_name` 是要调用的函数名称。\n- `(argument1, argument2, ...)` 是传递给函数的参数列表（如果有）。参数是可选的。\n\
    - 使用指定的参数调用函数，并将结果（如果有）存储在 `result` 变量中。\n\n以下是一个在 Python 中定义和使用简单函数的示例：\n```python\n\
    # Function definition\ndef add_numbers(x, y):\n    # Function body: adds two numbers\n\
    \    result = x + y\n    return result\n\n# Using the function\nsum_result = add_numbers(3,\
    \ 5)\nprint(\"Sum:\", sum_result)  # Output: Sum: 8\n```\n在这个示例中：\n- 我们定义了一个函数\
    \ `add_numbers`，它接受两个参数 `x` 和 `y`，将它们相加并返回结果。\n- 我们使用参数 `3` 和 `5` 调用函数 `add_numbers`，并将结果存储在变量\
    \ `sum_result` 中。\n- 我们将结果打印到控制台。\n\n### 参数\n在 Python 中，函数参数是在函数定义中指定的变量，用于调用函数时传递值。参数允许函数接受输入值并对其进行操作。\n\
    \n以下是在 Python 函数中定义和使用参数的语法：\n\n#### 1. 定义参数：\n```python\ndef function_name(parameter1,\
    \ parameter2, ...):\n    # Function body\n    # Code that uses parameter1, parameter2,\
    \ ...\n```\n- `def` 关键字用于定义函数。\n- `function_name` 是函数的名称。\n- `(parameter1, parameter2,\
    \ ...)` 是函数接受的参数列表。参数是可选的。\n- 列表中的每个参数都是持有传递给函数的值的变量。\n- 参数之间用逗号分隔。\n\n#### 2.\
    \ 使用参数：\n```python\nresult = function_name(argument1, argument2, ...)\n```\n-\
    \ `function_name` 是要调用的函数名称。\n- `(argument1, argument2, ...)` 是传递给函数的参数列表。参数是可选的。\n\
    - 参数是调用函数时传递给函数的实际值。\n- 函数使用这些参数来执行其任务。\n\n下面是一个演示在 Python 函数中使用参数的示例：\n```python\n\
    # Function definition with parameters\ndef greet(name):\n    # Function body:\
    \ greets the user with the provided name\n    print(\"Hello,\", name, \"!\")\n\
    \n# Using the function\ngreet(\"Alice\")  # Output: Hello, Alice!\n```\n在这个示例中：\n\
    - 我们定义了一个函数 `greet`，它接受一个参数 `name`。\n- 当使用参数 `\"Alice\"` 调用函数时，该值被传递给该参数。\n\n\
    ### 关键字参数\nPython 中的关键字参数（也称为关键字参数）是通过指定相应的名称传递给函数的参数。关键字参数允许按任意顺序提供参数。\n\n以下是定义和使用关键字参数的语法：\n\
    \n#### 1. 定义关键字参数：\n```python\ndef function_name(param1=default1, param2=default2,\
    \ ...):\n    # Function body\n    # Code that uses parameter1, parameter2, ...\n\
    ```\n- `def` 关键字用于定义函数。\n- `function_name` 是函数的名称。\n- `(param1=default1, param2=default2,\
    \ ...)` 是带有默认值的参数列表。关键字参数是可选的。\n- 列表中的每个参数都使用 `param=default` 语法定义。\n- 如果在调用函数时没有提供值，则使用默认值。\n\
    \n#### 2. 使用关键字参数：\n```python\nresult = function_name(param1=value1, param2=value2,\
    \ ...)\n```\n- `function_name` 是要调用的函数名称。\n- `param1=value1, param2=value2` 等是关键字参数。\n\
    - 关键字参数可以按任意顺序提供。\n\n下面是一个在 Python 中使用关键字参数的示例：\n```python\n# Function definition\
    \ with parameters\ndef greet(name, message=\"Hello\"):\n    # Function body: greets\
    \ the user with the provided name and message\n    print(message, name, \"!\"\
    )\n\n# Using the function with keyword arguments\ngreet(name=\"Bob\", message=\"\
    Hi\")  # Output: Hi Bob!\n```\n在这个示例中：\n- 我们定义了一个函数 `greet`，它接受两个参数：`name` 和 `message`。\n\
    - 参数 `message` 有默认值 `\"Hello\"`。\n- 当使用关键字参数 `name=\"Bob\"` 和 `message=\"Hi\"\
    ` 调用函数时，这些参数被传递给相应的参数。\n- 函数使用提供的值打印问候语 \"Hi Bob!\"。\n\n### 默认值\n在 Python 中，你可以通过在函数定义中直接指定默认值来为参数添加默认值。以下是为参数添加默认值的语法：\n\
    \n```python\ndef function_name(param1=default_value1, param2=default_value2, ...):\n\
    \    # Function body\n    # Code that uses parameter1, parameter2, ...\n```\n\
    在此语法中：\n- `param1=default_value1`, `param2=default_value2` 等是带有相应默认值的参数。\n\n"
- fmt: "\n- If no value is provided for a parameter during the function call, the\
    \ default value specified in the function definition is used.\n\nHere's an example\
    \ demonstrating how to add default values to function parameters:\n\n```python\n\
    def greet(name, message=\"Hello\"):\n    # Function body: greets the user with\
    \ the provided name and message\n    print(message, name, \"!\")\n\n# Using the\
    \ function without providing the default parameter value\ngreet(\"Alice\")  #\
    \ Output: Hello Alice!\n\n# Using the function with providing a custom parameter\
    \ value\ngreet(\"Bob\", \"Hi\")  # Output: Hi Bob!\n```\n\nIn this example:\n\
    * We define a function `greet` with two parameters: `name` and `message`.\n* The\
    \ parameter `message` has a default value `\"Hello\"`.\n* When the function is\
    \ called without providing a value for the `message` parameter (`greet(\"Alice\"\
    )`), the default value `\"Hello\"` is used, and the function prints `\"Hello Alice!\"\
    `.\n* When the function is called with a custom value for the `message` parameter\
    \ (`greet(\"Bob\", \"Hi\")`), the provided value `\"Hi\"` is used instead of the\
    \ default value, and the function prints `\"Hi Bob!\"`.\n\n## Return Values\n\n\
    In Python, you can return values from a function using the `return` statement.\
    \ The `return` statement is used to exit the function and specify the value(s)\
    \ that the function should return to the caller. Here's the syntax to return values\
    \ from a Python function:\n\n```python\ndef function_name(parameter1, parameter2,\
    \ ...):\n    # Function body\n    # Code that performs the task\n    return value1,\
    \ value2, ...\n```\n\nIn this syntax:\n* `def` keyword is used to define a function.\n\
    * `function_name` is the name of the function.\n* `(parameter1, parameter2, ...)`\
    \ is the list of parameters that the function accepts. Parameters are optional.\n\
    * The `return` statement is used to exit the function and return one or more values\
    \ to the caller.\n* `value1, value2, ...` are the values that the function returns.\
    \ You can return multiple values separated by commas, or a single value.\n\nHere's\
    \ an example demonstrating how to return values from a Python function:\n\n```python\n\
    def add_numbers(x, y):\n    # Function body: adds two numbers\n    result = x\
    \ + y\n    return result\n\n# Using the function and storing the returned value\n\
    sum_result = add_numbers(3, 5)\nprint(\"Sum:\", sum_result)  # Output: Sum: 8\n\
    ```\n\nIn this example:\n* We define a function `add_numbers` that takes two parameters\
    \ `x` and `y`, adds them together, and returns the result using the `return` statement.\n\
    * When the function is called with arguments `3` and `5`, the function calculates\
    \ the sum `(3 + 5 = 8)` and returns the result `8`.\n* The returned value is stored\
    \ in the variable `sum_result`, and we print it to the console.\n\n## 2 Python\
    \ Function Recursion\n\n### Introduction\n\nFunction recursion in Python refers\
    \ to the concept of a function calling itself, either directly or indirectly.\
    \ Recursion is a powerful technique used in programming where a function solves\
    \ a problem by breaking it down into smaller, similar subproblems and calling\
    \ itself to solve each subproblem. Recursion continues until it reaches a base\
    \ case, which is a simple case that can be solved directly without further recursion.\n\
    \nHere's a basic example of a recursive function to calculate the factorial of\
    \ a number:\n\n```python\ndef factorial(n):\n    if n == 0:\n        return 1\n\
    \    else:\n        return n * factorial(n - 1)\n\n# Example usage\nresult = factorial(5)\n\
    print(result)  # Output: 120 (5! = 5 * 4 * 3 * 2 * 1 = 120)\n```\n\nIn this example:\n\
    * The `factorial` function calculates the factorial of a non-negative integer\
    \ `n`.\n* The base case is when `n` is equal to `0`, where the factorial is defined\
    \ as `1`.\n* For any other value of `n`, the function recursively calls itself\
    \ with `n - 1` until it reaches the base case.\n* The result is computed by multiplying\
    \ `n` with the factorial of `n - 1`.\n\nRecursion is useful in situations where\
    \ a problem can be divided into smaller, identical subproblems that can be solved\
    \ more easily. Common examples include:\n\n1. **Tree-based problems**: Problems\
    \ involving trees, such as traversing a binary tree or finding the height of a\
    \ tree, are often naturally suited for recursion.\n2. **Divide and conquer algorithms**:\
    \ Problems that can be divided into smaller, similar subproblems, such as sorting\
    \ algorithms like merge sort and quicksort, can be efficiently solved using recursion.\n\
    3. **Dynamic programming**: Recursive solutions are often used in dynamic programming\
    \ to solve problems by breaking them down into overlapping subproblems.\n\nRecursion\
    \ can make code more concise and elegant for certain types of problems. However,\
    \ it can also lead to performance issues and stack overflow errors if not implemented\
    \ carefully, especially for problems with deep recursion or overlapping subproblems.\
    \ In such cases, iteration or other optimization techniques may be preferred.\n\
    \n### Pros and cons\n\nRecursion and iteration are both techniques used in programming\
    \ to solve problems, and each has its own set of advantages and disadvantages.\
    \ Here are a pros and cons of recursion and iteration in Python:\n\n#### Recursion:\n\
    \n**Pros:**\n1. **Elegant solution**: Recursion often leads to concise and elegant\
    \ solutions for problems that can be divided into smaller, identical subproblems.\n\
    2. **Readability**: Recursive solutions closely mimic the problem's definition,\
    \ making the code easier to understand and maintain, especially for problems involving\
    \ tree structures or mathematical sequences.\n3. **Divide and conquer**: Recursion\
    \ is well-suited for divide-and-conquer algorithms, where a problem can be broken\
    \ down into smaller subproblems.\n\n**Cons:**\n1. **Performance overhead**: Recursive\
    \ function calls involve additional overhead, such as call stack management, which\
    \ can lead to slower execution.\n2. **Stack overflow**: Recursive solutions can\
    \ lead to stack overflow errors if not implemented carefully, particularly for\
    \ problems with deep recursion.\n3. **Difficulty in debugging**: Recursive functions\
    \ can be more difficult to debug due to their indirect nature, making it challenging\
    \ to trace the execution flow.\n\n#### Iteration:\n\n**Pros:**\n1. **Efficiency**:\
    \ Iterative solutions often have better performance compared to recursive solutions,\
    \ especially for problems with large inputs or deep recursion levels, as they\
    \ typically involve less overhead.\n2. **Control over execution**: Iteration provides\
    \ more explicit control over the execution flow, making it easier to understand\
    \ and debug, particularly for complex algorithms.\n3. **Tail optimization**: Some\
    \ programming languages, including Python, support tail call optimization, which\
    \ allows certain tail-recursive functions to be optimized into iterative form,\
    \ eliminating the risk of stack overflow.\n\n**Cons:**\n1. **Complexity**: Iterative\
    \ solutions can sometimes be more complex and less intuitive, especially for problems\
    \ that naturally lend themselves to recursive solutions.\n2. **Verbose code**:\
    \ Iterative solutions may require more lines of code and additional variables\
    \ to maintain loop state, leading to less concise code compared to recursive solutions\
    \ for certain problems.\n3. **Difficulty with certain problems**: Some problems\
    \ may be inherently difficult to solve iteratively, especially those involving\
    \ tree traversal or backtracking, where recursion provides a more natural and\
    \ intuitive approach.\n\nIn summary, both recursion and iteration have their advantages\
    \ and disadvantages, and the choice between them depends on factors such as problem\
    \ complexity, performance requirements, and personal preference. While recursion\
    \ often leads to elegant and concise solutions for certain problems, iteration\
    \ may offer better performance and explicit control over execution flow in others.\
    \ It's essential to consider these factors when deciding which approach to use\
    \ in a given situation.\n"
