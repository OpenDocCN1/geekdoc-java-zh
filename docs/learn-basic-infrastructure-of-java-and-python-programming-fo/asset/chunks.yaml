    algorithm).public static int binarySearch(X[] a, X key)// Copy the elements of
    an array to create a new array with the specified length.public static int[] copyOf(X[]
    original, X newLength)// Copies the specified range of the specified array into
    a new array.public static double[] copyOfRange(X[] original, int from, int to)//
    Compare two arrayspublic static boolean equals(X[] a, long[] a2)// Assigns the
