    \ using the `=` operator.\n\n```python\nx = 10\nname = \"Alice\"\n```\n\n### 2.\
    \ Variable Naming Rules\n* Variable names must start with a letter (`a-z`, `A-Z`)\
    \ or an underscore `_`.\n* Variable names can contain letters, digits (`0-9`),\
    \ and underscores `_`.\n* Variable names are case-sensitive (`name` and `Name`\
    \ are different variables).\n* Python keywords (e.g., `if`, `for`, `while`, `def`,\
    \ etc.) cannot be used as variable names.\n\n### 3. Data Types\nPython variables\
    \ can hold values of different data types, including:\n* Integer (`int`): Whole\
    \ numbers, e.g., `10`, `-5`, `1000`.\n* Float (`float`): Floating-point numbers,\
    \ e.g., `3.14`, `2.718`.\n* String (`str`): Sequence of characters, e.g., `\"\
    Hello\"`, `'Python'`.\n* Boolean (`bool`): Represents `True` or `False`.\n* List\
    \ (`list`), Tuple (`tuple`), Dictionary (`dict`), Set (`set`), etc.\n\n```python\n\
    age = 25  # integer\npi = 3.14  # float\nname = \"Alice\"  # string\nis_student\
    \ = True  # boolean\n```\n\n### 4. Variable Reassignment\nYou can change the value\
    \ of a variable by assigning a new value to it.\n\n```python\nx = 5\nx = x + 1\
    \  # x now holds the value 6\n```\n\n### 5. Variable Scope\nVariables have a scope,\
    \ which defines where they can be accessed from. Variables declared inside a function\
    \ have local scope, meaning they are only accessible within that function. Variables\
    \ declared outside of any function have global scope and can be accessed from\
    \ anywhere in the code.\n\n```python\nx = 10  # global variable\ndef my_function():\n\
    \    y = 20  # local variable\n    print(x)  # x can be accessed here\n    print(y)\
    \  # y can be accessed here\n\nmy_function()\nprint(x)  # x can be accessed here\n\
    print(y)  # Error: y is not defined\n```\n\nVariables are fundamental to programming\
    \ in Python, as they allow you to store and manipulate data within your programs.\n\
    \n# Constants\n\nIn Python, constants are typically created by defining variables\
    \ with uppercase names and treating them as if they were constant, although Python\
    \ does not have built-in support for constant variables like some other programming\
    \ languages. Here's how you can create constants in Python:\n\n```python\nMY_CONSTANT\
    \ = 10\nANOTHER_CONSTANT = \"Hello\"\n```\n\nBy convention, constants are usually\
    \ written in uppercase to distinguish them from regular variables. However, it's\
    \ important to note that Python doesn't enforce constants; you can still modify\
    \ their values, but it's a convention to treat them as immutable.\n\nIf you want\
    \ to prevent accidental modification of a constant value, you can use the `readonly`\
    \ or `dataclass` module to create immutable objects. Here's an example using `readonly`:\n\
    \n```python\nfrom readonly import readonly\n@readonly\nclass Constants:\n    MY_CONSTANT\
    \ = 10\n    ANOTHER_CONSTANT = \"Hello\"\n\n# Now you cannot modify the values\
    \ of these constants:\n# Constants.MY_CONSTANT = 20  # This will raise an AttributeError\n\
    ```\n\n# Chapter 2 : Python Data Types\n\n## 1 Python boolean\n\n### Introduction\n\
    \nBoolean values are a data type in Python that represent truth values. They can\
    \ only have one of two values: `True` or `False`. Boolean values are commonly\
    \ used in conditional statements, loops, and logical operations to control the\
    \ flow of the program or to represent the result of a comparison.\n\nHere's how\
    \ you can use Boolean values in Python:\n\n### 1. Boolean Variables\nYou can assign\
    \ Boolean values to variables like any other data type.\n\n```python\nis_student\
    \ = True\nhas_passed_exam = False\n```\n\n### 2. Conditional Statements\nBoolean\
    \ values are often used in conditional statements (`if`, `elif`, `else`) to execute\
    \ different blocks of code based on whether a condition is `True` or `False`.\n\
    \n```python\nif is_student:\n    print(\"The person is a student.\")\nelse:\n\
    \    print(\"The person is not a student.\")\n```\n\n### 3. Logical Operators\n\
    Boolean values can be combined using logical operators (`and`, `or`, `not`) to\
    \ create compound conditions.\n\n```python\nage = 20\nis_adult = age >= 18\nis_teenager\
    \ = age >= 13 and age <= 19\n```\n\n### 4. Loops\nBoolean values are often used\
    \ as loop conditions to control the execution of the loop.\n\n```python\nwhile\
    \ is_student:\n    print(\"Still studying...\")\n```\n\n### 5. Returns\nBoolean\
    \ values are often returned by functions to indicate success or failure of an\
    \ operation.\n\n```python\ndef is_even(number):\n    return number % 2 == 0\n\
    ```\n\n### 6. Built-in Functions\nPython provides built-in functions like `bool()`\
    \ to convert other types to Boolean values.\n\n```python\nbool(0)   # False\n\
    bool(1)   # True\nbool([])  # False\nbool([1]) # True\n```\n\n### boolean to int\n\
    \nIn Python, you can convert a Boolean value to an integer using the `int()` function.\
    \ When you convert a Boolean value to integer, `True` is represented as `1` and\
    \ `False` is represented as `0`. Here's how you can do it:\n\n```python\nprint(int(True))\
    \   # Output: 1\nprint(int(False))  # Output: 0\n```\n\n### boolean to string\n\
    \nIn Python, you can convert a boolean value to a string using either the `str()`\
    \ function or by using string formatting methods. Here is a example:\n\nUsing\
    \ `str()` function:\n\n```python\nprint(str(True))  # Output: \"True\"\nprint(str(False))\
    \ # Output: \"False\"\n```\n\n### True False\n\nIn Python, `True` and `False`\
    \ are the two boolean values that represent the truth values. They are used to\
    \ control the flow of the program, make decisions, and perform logical operations.\
    \ Here are some important notes on `True` and `False` and how to use them:\n\n\
    #### 1. True and False Values\n* `True` and `False` are reserved keywords in Python.\n\
    * `True` represents the truth value true, while `False` represents the truth value\
    \ false.\n* These are the only two boolean values in Python.\n\n#### 2. Boolean\
    \ Operations\n* Boolean values are commonly used in logical operations such as\
    \ AND, OR, and NOT.\n* The `and` operator returns `True` if both operands true,\
    \ otherwise it returns `False`.\n* The `or` operator returns `True` if at least\
    \ one of the operands is true, otherwise it returns `False`.\n* The `not` operator\
    \ returns the opposite boolean value of its operand.\n\n#### 3. Comparison Operators\n\
    * Comparison operators (`==`, `!=`, `<`, `<=`, `>`, `>=`) return boolean values\
    \ (`True` or `False`) based on the comparison result.\n* For example, `x == y`\
    \ returns `True` if `x` is equal to `y`, otherwise it returns `False`.\n\n####\
    \ 4. Control Structures\n* Boolean values are extensively used in control structures\
    \ such as `if`, `elif`, `else` statements and loops (`while`, `for`).\n* These\
    \ structures allow you to execute different blocks of code based on conditions\
    \ evaluated to `True` or `False`.\n\n#### 5. Truthiness and Falsiness\n* In addition\
    \ to `True` and `False`, other values in Python can be evaluated as either true\
    \ or false in a boolean context.\n"
