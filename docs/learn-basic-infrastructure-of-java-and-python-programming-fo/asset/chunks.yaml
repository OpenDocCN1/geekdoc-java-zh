    \n# 2 Python 变量\n\n## 介绍\n\n在 Python 中，变量用于存储数据值。变量是一个指向内存中存储的句值的名称。与某些其他编程语言不同，Python\
    \ 是动态类型的，这意味着你不需要在给变量赋值之前先声明该变量的类型。以下是你在如何在 Python 中使用变量的方法：\n\n### 1. 变量赋值\n\
    你可以使用 `=` 运算符为变量赋值。\n\n```python\nx = 10\nname = \"Alice\"\n```\n\n### 2. 变量命名规则\n\
    * 变量名必须以字母（`a-z`、`A-Z`）或下划线 `_` 开头。\n* 变量名可以包含字母、数字（`0-9`）和下划线 `_`。\n* 变量名大小敏感（`name`\
    \ 和 `Name` 是不同的变量）。\n* Python 关键字（例如 `if`、`for`、`while`、`def` 等）不能用变量名。\n\n###\
    \ 3. 数据类型\nPython 变量可以持有不同类型的值，包括：\n* 整数 (`int`)：整数，例如 `10`、`-5`、`1000`。\n* 浮点数\
    \ (`float`)：浮点数，例如 `3.14`、`2.718`。\n* 字符串 (`str`)：字符序列，例如 `\"Hello\"`、`'Python'`。\n\
    * 布尔值 (`bool`)：表示 `True` 或 `False`。\n* 列表 (`list`)、元组 (`tuple`)、字典 (`dict`)、集合\
    \ (`set`) 等。\n\n```python\nage = 25  # 整数\npi = 3.14  # 浮点数\nname = \"Alice\"\
    \  # 字符串\nis_student = True  # 布尔\n```\n\n### 4. 变量重新赋值\n你可以通过给变量赋新值来改变它的值。\n\n\
    ```python\nx = 5\nx = x + 1  # x 现在持有值 6\n```\n\n### 5. 作用域\n变量有作用域，定义了它们可以在哪里被访问。在函数内部定义的变量具有局部作用域，这意味着它们只能在该函数内部访问。在任何函数外部定义的变量具有全局作用域，可以从代码的任何地方访问。\n\
    \n```python\nx = 10  # 全局变量\ndef my_function():\n    y = 20  # 局部变量\n    print(x)\
    \  # 这里可以访问 x\n    print(y)  # 这里可以访问 y\n\nmy_function()\nprint(x)  # 这里可以访问 x\n\
    print(y)  # 错误：y 未定义\n```\n\n变量是 Python 编程的基础，因为它们允许你在程序中存储和操作数据。\n\n# 常量\n\n\
    在 Python 中，常量通常通过定义大写名称的变量来创建，并将其视为常量，尽管 Python 没有像某些其他编程语言那样内置对常量变量的支持。以下是你如何在\
    \ Python 中创建常量的方法：\n\n```python\nMY_CONSTANT = 10\nANOTHER_CONSTANT = \"Hello\"\
    \n```\n\n按照惯例，常量通常使用大写字母，以便与普通变量区分。然而，需要注意的是，Python 并不强制执行；你仍然可以修改它们的值，但将它们视为不可变对象是一种惯例。\n\
    \n如果你想防止意外修改常量值，可以使用 `readonly` 或 `dataclass` 模块来创建不可变对象。以下是一个使用 `readonly` 的示例：\n\
    \n```python\nfrom readonly import readonly\n@readonly\nclass Constants:\n    MY_CONSTANT\
    \ = 10\n    ANOTHER_CONSTANT = \"Hello\"\n\n# 现在你无法修改这些常量的值了：\n# Constants.MY_CONSTANT\
    \ = 20  # 这将引发 AttributeError\n```\n\n# 第 2 章：Python 数据类型\n\n## 1 Python 布尔值\n\
    \n### 介绍\n\n布尔值是 Python 中的一种表示真值的数据类型。它们只能取两个值之一：`True` 或 `False`。布尔值常用于条件语句、循环和逻辑操作中，用于控制程序的流程或表示比较的结果。\n\
    \n以下是你如何在 Python 中使用布尔值：\n\n### 1. 布尔变量\n你可以像处理其他数据类型一样给变量赋值布尔值。\n\n```python\n\
    is_student = True\nhas_passed_exam = False\n```\n\n### 2. 条件语句\n布尔值经常用于条件语句（`if`、`elif`、`else`），根据条件是\
    \ `True` 还是 `False` 来执行不同的代码块。\n\n```python\nif is_student:\n    print(\"这个人是一个学生.\"\
    )\nelse:\n    print(\"这个人不是学生.\")\n```\n\n### 3. 逻辑运算符\n布尔值可以使用逻辑运算符（`and`、`or`、`not`）组合起来以创建复合条件。\n\
    \n```python\nage = 20\nis_adult = age >= 18\nis_teenager = age >= 13 and age <=\
    \ 19\n```\n\n### 4. 循环\n布尔值常用循环条件来控制循环的执行。\n\n```python\nwhile is_student:\n \
    \   print(\"正在学习...\")\n```\n\n### 5. 返回\n布尔值经常由函数返回表示成功或失败。\n\n```python\ndef\
    \ is_even(number):\n    return number % 2 == 0\n```\n\n### 6. 内置函数\nPython 提供内置函数如\
