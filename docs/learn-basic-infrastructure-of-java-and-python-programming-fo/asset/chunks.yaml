    \n```python\nnumber = -10\nabsolute_value = number if number >= 0 else -number\n\
    print(\"Absolute value:\", absolute_value)  # Output: 10\n```\n\n#### 4. 检查有效性：\n\
    \n```python\nusername = \"john_doe\"\nmessage = \"Valid\" if len(username) >=\
    \ 8 else \"Invalid\"\nprint(\"Username is\", message)  # Output: Username is Valid\n\
    ```\n\n#### 5. 处理除以零：\n\n```python\ndividend = 10\ndivisor = 0\nresult = dividend\
    \ / divisor if divisor != 0 else \"Error: Division by Zero\"\nprint(\"Result:\"\
    , result)  # Output: Result: Error: Division by Zero\n```\n\n### 最大值\n\n你可以创建一个\
    \ Python 程序，使用三元运算符找到用户输入的两个数字中的最大值，如下：\n\n```python\n# 从用户处输入两个数字\nnumber1 =\
    \ float(input(\"Enter first number: \"))\nnumber2 = float(input(\"Enter second\
    \ number: \"))\n\n# 使用三元运算符确定最大数字\nlargest = number1 if number1 > number2 else\
    \ number2\n\n# 显示结果\nprint(\"The largest number is:\", largest)\n```\n\n"
- fmt: "\nThe result is displayed to the user.\n\n# Chapter 4: Statements\n\n## 1\
    \ Python if\n\n### Introduction\n\nIn Python, the `if` statement is a control\
    \ flow statement that allows you to execute a block of code based on whether a\
    \ specified condition evaluates to True. It is used for decision-making in programming.\n\
    \nThe syntax of the `if` statement in Python is as follows:\n\n```python\nif condition:\n\
    # Code block to execute if the condition is True\nstatement1\nstatement2...\n\
    ```\n\nHere's how the `if` statement works:\n\n- The condition is evaluated. If\
    \ it is True, the code block following the `if` statement is executed. If it is\
    \ False, the code block is skipped.\n- The code block under the `if` statement\
    \ is typically indented to indicate that it belongs to the `if` statement. The\
    \ indentation is usually four spaces, but it can be any consistent whitespace.\n\
    - Optionally, you can include an `else` statement to specify a block of code to\
    \ execute if the condition is False. Additionally, you can use `elif` (short for\
    \ \"else if\") to specify additional conditions to check.\n\nHere's an example\
    \ of using the `if` statement in Python:\n\n```python\nx = 10\nif x > 5:\n   \
    \ print(\"x is greater than 5\")\n```\n\nIn this example:\n\n- The condition `x\
    \ > 5` is evaluated. Since `x` is `10`, which is greater than 5, the condition\
    \ is True.\n- Therefore, the code block under the `if` statement is executed,\
    \ and the message \"x is greater than 5\" is printed to the console.\n\n### Syntax\n\
    \nThe `if` statement in Python can be used in various ways to create conditional\
    \ logic. Here are the different forms of `if` statements along with their syntax:\n\
    \n1. **Basic if statement**:\n```python\nif condition:\n# Code block to execute\
    \ if the condition is True\nstatement1\nstatement2...\n```\n\n2. **if-else statement**:\n\
    ```python\nif condition:\n# Code block to execute if the condition is True\nstatement1\n\
    statement2...\nelse:\n# Code block to execute if the condition is False\nstatement3\n\
    statement4...\n```\n\n3. **Chained if-elif-else statement**:\n```python\nif condition1:\n\
    # Code block to execute if condition1 is True\nstatement1\nstatement2...\nelif\
    \ condition2:\n# Code block to execute if condition2 is True\nstatement3\nstatement4...\n\
    elif condition3:\n# Code block to execute if condition3 is True\nstatement5\n\
    statement6...\nelse:\n# Code block to execute if all conditions are False\nstatement7\n\
    statement8...\n```\n\n4. **Nested if statement**:\n```python\nif condition1:\n\
    \    if condition2:\n        # Code block to execute if both condition1 and condition2\
    \ are True\n        statement1\nstatement2...\n```\n\nIn each form of the `if`\
    \ statement, you can include one or more conditions and corresponding code blocks\
    \ to execute based on the evaluation of those conditions. The `else` and `elif`\
    \ clauses are optional and can be used to specify alternate code blocks to execute\
    \ when the conditions are False.\n\n#### Even Odd\n\nYou can check whether a given\
    \ number is even or odd in Python using an `if` statement with the modulo operator\
    \ (`%`). Here's how you can do it:\n\n```python\ndef check_even_odd(number):\n\
    \    if number % 2 == 0:\n        print(number, \"is even.\")\n    else:\n   \
    \     print(number, \"is odd.\")\n\n# Example usage\nnumber = 7\ncheck_even_odd(number)\n\
    ```\n\nIn this program:\n\n- The `check_even_odd()` function takes a number (`number`)\
    \ as input.\n- It checks if the number is even or odd using the modulo operator\
    \ (`%`). If the remainder when dividing the number by `2` is `0`, the number is\
    \ even; otherwise, it is odd.\n- If the number is even (`number % 2 == 0`), it\
    \ prints a message indicating that the number is even. Otherwise, it prints a\
    \ message indicating that the number is odd.\n- The example usage demonstrates\
    \ checking whether the number `7` is even or odd. You can pass any integer to\
    \ the function to check if it's even or odd.\n\n#### Largest/smallest\n\nYou can\
    \ read in three integers from the user, then use `if` statements to determine\
    \ the largest and smallest integers among them. Here's how you can do it:\n\n\
    ```python\n# Read in three integers from the user\nnum1 = int(input(\"Enter first\
    \ integer: \"))\nnum2 = int(input(\"Enter second integer: \"))\nnum3 = int(input(\"\
    Enter third integer: \"))\n\n# Assume the first number is both the largest and\
    \ smallest initially\nlargest = num1\nsmallest = num1\n\n# Determine the largest\
    \ integer\nif num2 > largest:\n    largest = num2\nif num3 > largest:\n    largest\
    \ = num3\n\n# Determine the smallest integer\nif num2 < smallest:\n    smallest\
    \ = num2\nif num3 < smallest:\n    smallest = num3\n\n# Print the largest and\
    \ smallest integers\nprint(\"Largest integer:\", largest)\nprint(\"Smallest integer:\"\
    , smallest)\n```\n\nIn this program:\n\n- We first read in three integers (`num1`,\
    \ `num2`, `num3`) from the user using the `input()` function, and convert them\
    \ to integers using the `int()` function.\n- We initialize the variables `largest`\
    \ and `smallest` to the value of `num1`, assuming initially that `num1` is both\
    \ the largest and smallest integer.\n- We then use `if` statements to compare\
    \ `num2` and `num3` with `largest` to determine the largest integer, and similarly\
    \ compare them with `smallest` to determine the smallest integer.\n- Finally,\
    \ we print the largest and smallest integers to the console.\n\n#### Positive\
    \ or negative\n\nYou can create a Python program to check whether a given integer\
    \ is positive or negative using an `if` statement like this:\n\n```python\n# Take\
    \ input from the user\nnum = int(input(\"Enter an integer: \"))\n\n# Check if\
    \ the number is positive, negative, or zero\nif num > 0:\n    print(\"The number\
    \ is positive.\")\nelif num < 0:\n    print(\"The number is negative.\")\nelse:\n\
    \    print(\"The number is zero.\")\n```\n\nIn this code:\n\n- We take an integer\
    \ input from the user using the `input()` function.\n- Then, we convert the input\
    \ into an integer using the `int()` function.\n- We use the `if`, `elif`, and\
    \ `else` statements to check whether the number is positive, negative, or zero.\n\
    - If the number is greater than `0`, it's positive. If it's less than `0`, it's\
    \ negative. Otherwise, it's zero.\n\n## 2 Python while\n\n### Syntax\n\nThe syntax\
    \ of a `while` loop in Python is as follows:\n\n```python\nwhile condition:\n\
