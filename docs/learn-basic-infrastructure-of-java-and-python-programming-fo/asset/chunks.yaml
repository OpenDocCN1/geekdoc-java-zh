    \ + i + \", j = \" + j);\n    }\n}\n```\n\n### 第六章：Java 中的数组\n\n1. 什么是数组\n2. 一维数组\n\
    3. 一维数组与 for-each 循环\n4. 一维数组的工具方法\n5. 二维数组\n\n#### 1 什么是数组\n\n在 Java 中，数组是一组具有相同类型的元素，在内存中是连续的。数组具有固定数量的元素且无法更改大小。\n\
