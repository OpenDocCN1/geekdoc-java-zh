    \ we use `map()` to convert each element of the tuple to a string, and then use\
    \ string formatting inside the `join()` method.\n\n# 6 Python Dictionary\n\n##\
    \ Introduction\n\nA Python dictionary is an unordered collection of key-value\
    \ pairs. Each `key` in a dictionary is unique and immutable, and it maps to a\
    \ corresponding `value`. You can think of a dictionary like a real-world dictionary,\
    \ where each word (`key`) has a definition (`value`).\n\nYou can create a dictionary\
    \ in Python using curly braces `{}` and specifying key-value pairs separated by\
    \ colons `:`. Here's how you can create a dictionary:\n\n```python\n# Creating\
    \ an empty dictionary\nempty_dict = {}\n# Creating a dictionary with key-value\
    \ pairs\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New York'}\n# Creating\
    \ a dictionary using the dict() constructor\nanother_dict = dict(name='Alice',\
    \ age=25, city='Los Angeles')\n```\n\nIn the examples above:\n\n*   `empty_dict`\
    \ is an empty dictionary.\n*   `my_dict` contains three key-value pairs: `'name':\
    \ 'John'`, `'age': 30`, and `'city': 'New York'`.\n*   `another_dict` is created\
    \ using the `dict()` constructor, where keys and values are specified as keyword\
    \ arguments.\n\nYou can access, modify, add, or remove elements from a dictionary\
    \ using its `keys`. Dictionaries are widely used for storing and retrieving data\
    \ efficiently, especially when you need to access values by their associated `keys`.\n\
    \n## Loop Pairs\n\nYou can loop through all key-value pairs in a Python dictionary\
    \ using a `for` loop. Python dictionaries provide several methods to access `keys`,\
    \ `values`, or both. Here's how you can loop through all key-value pairs in a\
    \ dictionary:\n\n```python\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New\
    \ York'}\n# Loop through all key-value pairs\nfor key, value in my_dict.items():\n\
    \    print(key, '=', value)\n```\n\nIn this example, `my_dict.items()` returns\
    \ a view object that provides a dynamic view of the dictionary's key-value pairs.\
    \ The `for` loop iterates over each key-value pair, and `key` and `value` are\
    \ assigned to each key-value pair respectively. Inside the loop, you can access\
    \ both the `key` and `value` of each pair and perform any desired operations.\n\
    \nOutput:\n\n```\nname = John\nage = 30\ncity = New York\n```\n\nUsing `.items()`\
    \ is the most common and efficient way to loop through all key-value pairs in\
    \ a dictionary in Python.\n\n## Access\n\nYou can access values in a Python dictionary\
    \ using the `keys` as indices. Here are a few methods to access values in a dictionary:\n\
    \n1. Using square brackets `[]`:\n\n```python\nmy_dict = {'name': 'John', 'age':\
    \ 30, 'city': 'New York'}\n# Accessing values using keys\nname = my_dict['name']\n\
    age = my_dict['age']\ncity = my_dict['city']\nprint(\"Name:\", name)\nprint(\"\
    Age:\", age)\nprint(\"City:\", city)\n```\n\n2. Using the `get()` method:\n\n\
    ```python\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New York'}\n# Accessing\
    \ values using get() method\nname = my_dict.get('name')\nage = my_dict.get('age')\n\
    city = my_dict.get('city')\nprint(\"Name:\", name)\nprint(\"Age:\", age)\nprint(\"\
    City:\", city)\n```\n\nBoth methods will output:\n\n```\nName: John\nAge: 30\n\
    City: New York\n```\n\nIn both examples, we access the values in the dictionary\
    \ `my_dict` using the `keys` `'name'`, `'age'`, and `'city'`. Using square brackets\
    \ is straightforward and raises a `KeyError` if the `key` is not found in the\
    \ dictionary. Using the `get()` method allows you to provide a default value if\
    \ the `key` is not found, which can help avoid `KeyError` exceptions.\n\n# Chapter\
    \ 3 : Operators\n\n## 1 Python Arithmetic Operators\n\n### Introduction\n\nIn\
    \ Python, arithmetic operators are used to perform mathematical operations. Here's\
    \ a list of arithmetic operators in Python:\n\n1.  Addition: `+`\n2.  Subtraction:\
    \ `-`\n3.  Multiplication: `*`\n4.  Division: `/`\n5.  Floor Division (integer\
    \ division): `//`\n6.  Modulus (remainder): `%`\n7.  Exponentiation: `**`\n\n\
    You can use these operators to perform arithmetic operations on numbers in Python.\n\
    \n### Usage\n\nHere are examples illustrating the use of each arithmetic operator\
    \ in Python:\n\n1. Addition (`+`):\n\n```python\na = 5\nb = 3\nresult = a + b\n\
