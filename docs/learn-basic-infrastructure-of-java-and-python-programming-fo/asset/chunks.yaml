    print the modified list to verify the changes.


    These methods provide flexible ways to add elements to a list in Python, allowing
    you to easily extend the list with new data as needed.


    Insert Elements


    To insert elements in the middle of a Python list, you can use the insert() method.
    The insert() method allows you to specify the index where you want to insert the
    new element. Here''s how you can insert elements into the middle of a list:


    | # Define a listmy_list = [''apple'', ''banana'', ''cherry'', ''date'']# Insert
    an element in the middle of the listmy_list.insert(2, ''blueberry'')  # Insert
    ''blueberry'' at index 2# Print the modified listprint(my_list)  # Output: [''apple'',
    ''banana'', ''blueberry'', ''cherry'', ''date''] |


    In this example:


    *   We define a list my_list containing four elements.


    *   We use the insert() method to insert the element ''blueberry'' at index 2.


    *   The index 2 indicates that the new element will be inserted after the second
    element (''banana'') and before the third element (''cherry'').


    *   We print the modified list to verify the changes.


    The insert() method modifies the original list in place by shifting existing elements
    to make room for the new element. It''s a convenient way to insert elements at
    specific positions within a list.


    Sort Permanently


    To sort a Python list permanently using the sort() method, you can simply call
    the sort() method on the list. The sort() method sorts the elements of the list
    in ascending order by default. Here''s how you can use the sort() method to sort
    a list permanently:


    | # Define a listmy_list = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3]# Sort the list permanentlymy_list.sort()#
    Print the sorted listprint("Sorted list:", my_list)  # Output: [1, 1, 2, 3, 3,
    4, 5, 5, 6, 9] |


