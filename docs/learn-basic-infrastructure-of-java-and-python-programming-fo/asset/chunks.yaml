    Mouse weight: \" + mouse.getWeight());\n        }\n    }\n}\n```\n\n## 4 Polymorphism\
    \ in Java\n\nYou have a cat Asian Cat, you can call it is a Cat or call it is\
    \ an Animal which is an aspect of the polymorphism.\n\nOr another example: On\
    \ your resume records that you're an Asian man, while you actually are a Vietnamese.\n\
    \nThe example below shows you how to behave between declaring and reality.\n\n\
    `AsianCat` is a subclass of the class `Cat`.\n\n### AsianCat.java\n\n```java\n\
    package com.abd.java.inheritance.animal;\npublic class AsianCat extends Cat {\n\
    \    public AsianCat(String name, int age, int height) {\n        super(name,\
    \ age, height);\n    }\n    // Override the method of the parent class (Cat)\n\
    \    @Override\n    public String getAnimalName() {\n        return \"Asian Cat\"\
    ;\n    }\n}\n```\n\nPolymorphism of Java is described in the following illustration:\n\
    \n![](OEBPS/image_rsrc704.jpg)\n\n### PolymorphismDemo.java\n\n```java\npackage\
