    5  Structure of an Interface


    NoAccessModifierInterface.java


    | package com.abd.java.itf;// This is an interface not specified access modifier.//
    Its access modifier is default.// Only classes in the same package can implements
    this interface.interface NoAccessModifierInterface {} |


    CanMove.java


    | package com.abd.java.itf;// This interface defines a standard,// about things
    capable of moving.public interface CanMove {// The methods in Interface are always
    abstract and public.public abstract void run();// Even if you do not specify ''public
    abstract'', java always understands.void back();// Velocity.public int getVelocity();}
    |


    CanDrink.java


    | package com.abd.java.itf;// This interface defines a standard,// about things
    capable of drinking.public interface CanDrink {// Fields in Interface are always
    ''public static final''.// Whether you declare it or not.public static final String
    PEPSI = "PEPSI";final String NUMBER_ONE = "NUMBER ONE";String SEVENUP = "SEVEN
    UP";public void drink();} |


    6    Class implements Interface


    Animal.java


    | package com.abd.java.cls;import com.abd.java.itf.CanMove;// This class extends
    from Object.// And implements CanMove interface.// CanMove has 3 abstract methods.//
    This class implements only one abstract method of CanMove.// Therefore it must
    be declared as abstract.// The remaining abstract methods to be implemented in
    the subclasses.public abstract class Animal implements CanMove {// Implements
    run() method of CanMove.@Overridepublic void run() {System.out.println("Animal
    run...");}} |


    Cat.java


    | package com.abd.java.cls;import com.abd.java.itf.CanDrink;import com.abd.java.itf.CanEat;//
    This class extends Animal and implements CanEat, CanDrink interfaces.// This class
    is not declared as abstract.// So it must implements all abstract methods of the
    interfaces.public class Cat extends Animal implements CanEat, CanDrink {private
    String name;public Cat(String name) {this.name = name;}public String getName()
    {return this.name;}// Implements method of CanMove@Overridepublic void back()
    {System.out.println(name + " cat back ...");}// Implements method of CanMove.@Overridepublic
    int getVelocity() {return 110;}// Implements method of CanEat.@Overridepublic
    void eat() {System.out.println(name + " cat eat ...");}// Implements method of
    CanDrink.@Overridepublic void drink() {System.out.println(name + " cat drink ...");}}
    |


    Mouse.java


    | package com.abd.java.cls;import com.abd.java.itf.CanDrink;import com.abd.java.itf.CanEat;public
    class Mouse extends Animal  implements CanEat, CanDrink {@Overridepublic void
    back() {System.out.println("Mouse back ...");}@Overridepublic int getVelocity()
    {return 85;}@Overridepublic void drink() {System.out.println("Mouse drink ...");}@Overridepublic
    void eat() {System.out.println("Mouse eat ...");}} |


    AnimalDemo.java


    | package com.abd.java.cls;import com.abd.java.itf.CanEat;public class AnimalDemo
    {public static void main(String[] args) {// Inherit static field from CanDrink
    interface.System.out.println("Drink " + Cat.SEVENUP);// Create CanEat object//
    via constructor of Cat.CanEat canEat1 = new Cat("Tom");// An object declared as
    CanEat.// But in fact is Mouse.CanEat canEat2 = new Mouse();// Polymorphism shown
    here.// Java know the actual types of objects.// ==> Tom cat eat ...canEat1.eat();//
    ==> Mouse eat ...canEat2.eat();boolean isCat = canEat1 instanceof Cat;System.out.println("catEat1
    is Cat? " + isCat);// Castif (canEat2 instanceof Mouse) {Mouse mouse = (Mouse)
    canEat2;// Call drink method (Inherited from CanDrink).mouse.drink();}}} |


