    \n![](img/image_rsrc6ZY.jpg)\n\nArrayExample1.java\n\n"
- fmt: "\n```java\npackage com.abd.java.javabasic.array;\npublic class ArrayExample1\
    \ {\n    public static void main(String[] args) {\n        // Declare an array\
    \ with 5 elements\n        int[] myArray = new int[5];\n        // Note: the first\
    \ element of the array index is 0\n        // Assigning values to the first element\
    \ (index 0)\n        myArray[0] = 10;\n        // Assigning value to the second\
    \ element (index 1)\n        myArray[1] = 14;\n        myArray[2] = 36;\n    \
    \    myArray[3] = 27;\n        // Assigning value to the 5th element (the last\
    \ element in the array)\n        myArray[4] = 18;\n        // Print out element\
    \ count.\n        System.out.println(\"Array Length=\" + myArray.length);\n  \
    \      // Print to Console element at index 3 (4th element in the array)\n   \
    \     System.out.println(\"myArray[3]=\" + myArray[3]);\n        // Use a for\
    \ loop to print out the elements in the array.\n        for (int index = 0; index\
    \ < myArray.length; index++) {\n            System.out.println(\"Element \" +\
    \ index + \" = \" + myArray[index]);\n        }\n    }\n}\n```\n\n**Output**\n\
    ```\nArray Length=5\nmyArray[3]=27\nElement 0 = 10\nElement 1 = 14\nElement 2\
    \ = 36\nElement 3 = 27\nElement 4 = 18\n```\n\nArrayExample2.java\n```java\npackage\
    \ com.abd.java.javabasic.array;\npublic class ArrayExample2 {\n    public static\
    \ void main(String[] args) {\n        // Declare an array with 5 elements\n  \
    \      int[] myArray = new int[5];\n        // Print out element count\n     \
    \   System.out.println(\"Array Length=\" + myArray.length);\n        // Using\
    \ loop assign values to elements of the array.\n        for (int index = 0; index\
    \ < myArray.length; index++) {\n            myArray[index] = 100 * index * index\
    \ + 3;\n        }\n        // Print out the element at index 3\n        System.out.println(\"\
    myArray[3] = \" + myArray[3]);\n    }\n}\n```\n\n**Output**\n```\nArray Length=5\n\
    myArray[3] = 903\n```\n\n### 3 One-dimensional array and for-each loop\n\nJava\
    \ 5 provides you with a for-each loop that allows you to traverse all elements\
    \ of an array without using an index variable.\n\nExample:\n\nArrayForeachExample.java\n\
    ```java\npackage com.abd.java.javabasic.array;\npublic class ArrayForeachExample\
    \ {\n    public static void main(String[] args) {\n        // Declare an array\
    \ of String.\n        String[] fruits = new String[] { \"Apple\", \"Apricot\"\
    , \"Banana\" };\n        // The for-each loop to traverse array.\n        for\
    \ (String fruit : fruits) {\n            System.out.println(fruit);\n        }\n\
    \    }\n}\n```\n\n**Output**\n```\nApple\nApricot\nBanana\n```\n\n### 4 The Utility\
    \ methods for One-Dimensional Array\n\nThe Java provides you with some static\
    \ methods for arrays, such as sorting arrays, assigning values to all array elements,\
    \ searching, comparing arrays, etc. These methods are defined in the `Arrays`\
    \ class.\n\nBelow are some really useful, static methods defined in the `Arrays`\
    \ class. These methods apply to the arrays of elements with `byte`, `char`, `double`,\
    \ `float`, `long`, `int`, `short`, `boolean` types.\n\n- Pass parameters of the\
    \ same type, and returns a List. `public static <T> List<T> asList(T... a)` Type:\
    \ byte, char, double, float, long, int, short, boolean\n- Search the index of\
    \ a value that appears in the array. (Using binary search algorithm).\n`public\
    \ static int binarySearch(X[] a, X key)`\n- Copy the elements of an array to create\
    \ a new array with the specified length.\n`public static int[] copyOf(X[] original,\
    \ X newLength)`\n- Copies the specified range of the specified array into a new\
    \ array.\n`public static double[] copyOfRange(X[] original, int from, int to)`\n\
    - Compare two arrays: `public static boolean equals(X[] a, long[] a2)`\n- Assigns\
    \ the same value to all elements of the array. `public static void fill(X[] a,\
    \ X val)`\n- Convert an array to string. `public static String toString(X[] a)`\n\
    \nThe following example uses some methods of the `Arrays` class.\n\nArraysExample.java\n\
    ```java\npackage com.abd.java.javabasic.array;\nimport java.util.Arrays;\nimport\
    \ java.util.List;\npublic class ArraysExample {\n    public static void main(String[]\
    \ args) {\n        int[] years = new int[] { 2001, 1994, 1995, 2000, 2017 };\n\
    \        // Sort\n        Arrays.sort(years);\n        for (int year : years)\
    \ {\n            System.out.println(\"Year: \" + year);\n        }\n        //\
    \ Convert an array to string.\n        String yearsString = Arrays.toString(years);\n\
    \        System.out.println(\"Years: \" + yearsString);\n        // Create lists\
    \ from several values.\n        List<String> names = Arrays.asList(\"Tom\", \"\
    Jerry\", \"Donald\");\n        for (String name : names) {\n            System.out.println(\"\
    Name: \" + name);\n        }\n    }\n}\n```\n\n**Output**\n```\nYear: 1994\nYear:\
    \ 1995\nYear: 2000\nYear: 2001\nYear: 2017\nYears: [1994, 1995, 2000, 2001, 2017]\n\
    Name: Tom\nName: Jerry\nName: Donald\n```\n\n### 5 Two-dimensional array\n\nThe\
    \ rows and columns of two-dimensional array are marked with indices 0, 1, 2,....\
    \ To access an element of a two- dimensional array, you need to access by two\
    \ indices: row index and column index.\n\n![](OEBPS/image_rsrc6ZZ.jpg)\n\nYou\
    \ have three ways to declare a two-dimensional array.\n\n- Declare an array with\
    \ 5 rows, 10 columns: `MyType[][] myArray1 = new MyType[5][10];`\n- Declare 2\
    \ dimensional array with 5 row (Array of arrays): `MyType[][] myArray2 = new MyType[5][];`\n\
    - Declare 2 dimensional array, Specifies the values for the elements: `MyType[][]\
    \ myArray3 = new MyType[][] {{ value00, value01, value02 , value03 },{ value10,\
    \ value11, value12 }};`\n\n**Note**: `MyType` can be either primitive (byte, char,\
    \ double, float, long, int, short, boolean) or reference type.\n\nIf you declare\
    \ an array of primitive type (`byte`, `char`, `double`, `float`, `long`, `int`,\
    \ `short`, `boolean`), the elements are not assigned values, but default values.\n\
    \n- Default value `0` corresponds to the types such as `byte`, `double`, `float`,\
    \ `long`, `int`, `short`.\n- Default value `false` corresponds to the `boolean`\
    \ type.\n- Default value `\\u0000` corresponds to `char` type.\n\nConversely,\
    \ if you declare an array of reference type and one element of the array is not\
    \ assigned a value, it will be `null`.\n\nExample:\n\nTwoDimensionalExample.java\n\
    ```java\npackage com.abd.java.javabasic.array;\npublic class TwoDimensionalExample1\
    \ {\n    public static void main(String[] args) {\n        // Declare a two-dimensional\
    \ array with 2 rows, 3 columns\n        // Elements have default values\n    \
    \    int[][] myArray = new int[2][3];\n        // Row count of two dimensional\
    \ array.\n        System.out.println(\"Length of myArray: \"+ myArray.length);\
    \ // 2\n        // Print out\n        for (int row = 0; row < 2; row++) {\n  \
    \          for (int col = 0; col < 3; col++) {\n                System.out.println(\"\
    myArray[\" + row + \",\" + col + \"]=\" + myArray[row][col]);\n            }\n\
    \        }\n        System.out.println(\" --- \");\n        // Assigns values\
    \ to elements.\n        for (int row = 0; row < 2; row++) {\n            for (int\
    \ col = 0; col < 3; col++) {\n                myArray[row][col] = (row + 1) *\
    \ (col + 1);\n            }\n        }\n        // Print out\n        for (int\
    \ row = 0; row < 2; row++) {\n            for (int col = 0; col < 3; col++) {\n\
    \                System.out.println(\"myArray[\" + row + \",\" + col + \"]=\"\
    \ + myArray[row][col]);\n            }\n        }\n    }\n}\n```\n\n**Output**\n\
    ```\nLength of myArray: 2\nmyArray[0,0]=0\nmyArray[0,1]=0\nmyArray[0,2]=0\nmyArray[1,0]=0\n\
    myArray[1,1]=0\nmyArray[1,2]=0\n ---\nmyArray[0,0]=1\nmyArray[0,1]=2\nmyArray[0,2]=3\n\
