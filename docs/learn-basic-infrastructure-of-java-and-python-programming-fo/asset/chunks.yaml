    \ 和 `elif` 子句是可选的，用于指定当条件为 False 时执行的备选代码块。\n\n#### 偶奇\n\n在 Python 中，你可以使用带有模运算符\
    \ `%` 的 `if` 语句来检查给定数字是偶数还是奇数。以下是实现方法：\n\n```python\ndef check_even_odd(number):\n\
