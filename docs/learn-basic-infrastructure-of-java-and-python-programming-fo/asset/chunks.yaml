    True False


    In Python, True and False are the two boolean values that represent the truth
    values. They are used to control the flow of the program, make decisions, and
    perform logical operations. Here are some important notes on True and False and
    how to use them in Python:


    1    True and False Values:


    *   True and False are reserved keywords in Python.


    *   True represents the truth value true, while False represents the truth value
    false.


    *   These are the only two boolean values in Python.


    2    Boolean Operations:


    *   Boolean values are commonly used in logical operations such as AND (and),
    OR (or), and NOT (not).


    *   The and operator returns True if both operands are true, otherwise it returns
    False.


    *   The or operator returns True if at least one of the operands is true, otherwise
    it returns False.


    *   The not operator returns the opposite boolean value of its operand.


    3    Comparison Operators:


    *   Comparison operators (==, !=, <, <=, >, >=) return boolean values (True or
    False) based on the comparison result.


    *   For example, x == y returns True if x is equal to y, otherwise it returns
    False.


    4    Control Structures:


    *   Boolean values are extensively used in control structures such as if, elif,
