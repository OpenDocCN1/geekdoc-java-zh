    ## 1. 引言\n2. 类、构造函数与实例\n3. Java 中的继承\n4. Java 中的多态\n\n### 1. 引言\n继承和多态——这是 Java\
    \ 中一个非常重要的概念。如果你想学习 Java，就必须更好地理解它。\n\n### 2. 类、构造函数与实例\n在开始学习 Java 继承之前，你需要显式地理解类、构造函数和实例。我们考虑\
    \ `Person` 类，它描述了一个包含全名、出生年份、出生地信息的的人。\n\n#### `Person.java`\n\n```java\npackage\
    \ com.abd.java.inheritance.basic;\npublic class Person {\n    // 字段名 - 人的名字。\n\
    \    private String name;\n    // 字段出生年份\n    private Integer bornYear;\n    //\
    \ 字段出生地。\n    private String placeOfBirth;\n\n    // 构造函数有 3 个参数。\n    // 目标是给\
