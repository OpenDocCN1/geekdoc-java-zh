    \ fruit : fruits) {\n            System.out.println(fruit);\n        }\n    }\n\
    }\n```\n\n**输出**\n```\nApple\nApricot\nBanana\n```\n\n### 4 一维数组的工具方法\n\nJava\
    \ 为你提供了一些数组的静态方法，例如排序数组、为所有数组元素赋值、搜索、比较数组等。这些方法定义在 `Arrays` 类中。\n\n下面是 `Arrays`\
    \ 类中定义的一些非常有用的静态方法。这些方法适用于 `byte`、`char`、`double`、`float`、`long`、`int`、`short`、`boolean`\
    \ 类型的数组。\n\n- 传递相同类型的参数并返回 List。`public static <T> List<T> asList(T... a)` 类型：byte,\
    \ char, double, float, long, int, short, boolean\n- 搜索数组中值的索引（使用二分查找算法）。`public\
    \ static int binarySearch(X[] a, X key)`\n- 复制数组元素以创建一个指定长度的新数组。`public static\
    \ int[] copyOf(X[] original, X newLength)`\n- 将指定数组的指定范围复制到新数组中。`public static\
    \ double[] copyOfRange(X[] original, int from, int to)`\n- 比较两个数组：`public static\
    \ boolean equals(X[] a, long[] a2)`\n- 给数组的所有元素赋相同的值。`public static void fill(X[]\
    \ a, X val)`\n- 将数组转换为字符串。`public static String toString(X[] a)`\n\n以下示例使用了了 `Arrays`\
    \ 类的一些方法。\n\nArraysExample.java\n```java\npackage com.abd.java.javabasic.array;\n\
    import java.util.Arrays;\nimport java.util.List;\npublic class ArraysExample {\n\
    \    public static void main(String[] args) {\n        int[] years = new int[]\
