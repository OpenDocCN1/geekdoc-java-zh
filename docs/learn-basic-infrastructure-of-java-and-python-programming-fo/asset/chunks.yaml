    \ or range) or any iterable object. The for loop executes a block of code multiple\
    \ times, once for each item in the sequence or iterable.\n\nThe syntax of a for\
    \ loop in Python is as follows:\n\n```python\nfor item in sequence:\n    # Code\
    \ block to be executed for each item in the sequence\n```\n\nIn this syntax:\n\
    - `item` is a variable that takes on the value of each item in the sequence during\
    \ each iteration of the loop.\n- `sequence` is the sequence of elements over which\
    \ the loop iterates. It can be any iterable object, such as a list, tuple, string,\
    \ or range.\n- The colon (`:`) at the end of the `for` statement indicates the\
    \ start of the indented block of code that will be executed for each item in the\
    \ sequence.\n- The code inside the loop block is indented to signify that it belongs\
    \ to the loop body.\n- During each iteration of the loop, the `item` variable\
    \ takes on the value of the next element in the sequence, and the code block inside\
    \ the loop is executed with that value.\n\nHere's a simple example of using a\
    \ for loop to iterate over a list:\n\n```python\nfruits = [\"apple\", \"banana\"\
    , \"cherry\"]\nfor fruit in fruits:\n    print(fruit)\n```\n\nOutput:\n```\napple\n\
    banana\ncherry\n```\n\nIn this example, the for loop iterates over each item in\
    \ the `fruits` list, and during each iteration, the `fruit` variable takes on\
    \ the value of the current item, which is then printed.\n\n## Syntax\nIn Python,\
    \ the for loop can be used in different ways depending on the type of iterable\
    \ you are iterating over or the specific requirement of the loop. Here are some\
    \ common variations of for loop statements:\n\n### 1. Iterating over a sequence\
    \ (list, tuple, string, etc.):\n```python\nsequence = [1, 2, 3, 4, 5]\nfor item\
    \ in sequence:\n    # Code block to be executed for each item in the sequence\n\
    ```\n\n### 2. Iterating over a range of numbers:\n```python\nfor i in range(start,\
    \ stop, step):\n    # Code block to be executed for each value of i in the range\n\
    ```\nHere, `start` is the starting value of the range (inclusive), `stop` is the\
    \ ending value of the range (exclusive), and `step` is the step size between each\
    \ value (default is 1).\n\n### 3. Iterating over a sequence with index using enumerate():\n\
    ```python\nsequence = [\"a\", \"b\", \"c\", \"d\"]\nfor index, value in enumerate(sequence):\n\
    \    # Code block to be executed for each (index, value) pair\n```\n\n### 4. Iterating\
    \ over multiple sequences simultaneously using zip():\n```python\nsequence1 =\
    \ [1, 2, 3]\nsequence2 = [\"a\", \"b\", \"c\"]\nfor item1, item2 in zip(sequence1,\
    \ sequence2):\n    # Code block to be executed for each corresponding pair of\
    \ items\n```\n\n### 5. Iterating over dictionary keys, values, or items:\n```python\n\
    dictionary = {\"a\": 1, \"b\": 2, \"c\": 3}\n# Iterating over keys\nfor key in\
    \ dictionary:\n    # Code block to be executed for each key\n# Iterating over\
    \ values\nfor value in dictionary.values():\n    # Code block to be executed for\
    \ each value\n# Iterating over key-value pairs\nfor key, value in dictionary.items():\n\
    \    # Code block to be executed for each (key, value) pair\n```\n\nThese are\
    \ some of the common ways you can use the for loop in Python, but there can be\
    \ more variations depending on the specific requirements of your code.\n\n## Loop\
    \ on array\nIn Python, you can print each element in an array (or list) using\
