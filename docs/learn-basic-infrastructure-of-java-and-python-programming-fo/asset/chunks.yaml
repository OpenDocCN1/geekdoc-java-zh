  trans: "\n\n```java\n// 类只能继承自一个父类。\n// 但可以实现（继承）多个接口。\npublic class Cat extends\
    \ Animal implements CanEat, CanDrink {\n    // ....\n}\n```\n\n# 5 接口的结构\n\n###\
    \ `NoAccessModifierInterface.java`\n```java\npackage com.abd.java.itf;\n// 这是一个没有指定访问修饰符的接口。\n\
    // 它的访问修饰符是默认的。\n// 只有同一包中的类可以实现这个接口。\ninterface NoAccessModifierInterface {}\n\
    ```\n\n### `CanMove.java`\n```java\npackage com.abd.java.itf;\n// 这个接口定义了一个关于\n\
    // 移动能力的标准。\npublic interface CanMove {\n    // 接口中的方法总是抽象且公共的。\n    public abstract\
    \ void run();\n    // 即使你没有指定 'public abstract', java 也总是理解。\n    void back();\n\
    \    // 速度。\n    public int getVelocity();\n}\n```\n\n### `CanDrink.java`\n```java\n\
    package com.abd.java.itf;\n// 这个接口定义了一个关于\n// 饮能力的标准。\npublic interface CanDrink\
    \ {\n    // 接口中的字段始终是 'public static final'。\n    // 无论你是否声明。\n    public static\
    \ final String PEPSI = \"PEPSI\";\n    final String NUMBER_ONE = \"NUMBER ONE\"\
    ;\n    String SEVENUP = \"SEVEN UP\";\n    public void drink();\n}\n```\n\n# 6\
    \ 类实现接口\n\n### `Animal.java`\n```java\npackage com.abd.java.cls;\nimport com.abd.java.itf.CanMove;\n\
    // 这个类继承自 Object。\n// 并实现了 CanMove 接口。\n// CanMove 有 3 个抽象方法。\n// 这个类只实现了 CanMove\
    \ 的一个抽象方法。\n// 因此它必须声明为抽象类。\n// 剩余的抽象方法将在子类中实现。\npublic abstract class Animal\
    \ implements CanMove {\n    // 实现 CanMove 的 run() 方法。\n    @Override\n    public\
    \ void run() {\n        System.out.println(\"Animal run...\");\n    }\n}\n```\n\
    \n### `Cat.java`\n```java\npackage com.abd.java.cls;\nimport com.abd.java.itf.CanDrink;\n\
    import com.abd.java.itf.CanEat;\n// 这个类继承 Animal 并实现了 CanEat, CanDrink 接口。\n//\
    \ 这个类没有声明为抽象类。\n// 所以它必须实现接口所有的抽象方法。\npublic class Cat extends Animal implements\
    \ CanEat, CanDrink {\n    private String name;\n    public Cat(String name) {\n\
    \        this.name = name;\n    }\n    public String getName() {\n        return\
    \ this.name;\n    }\n    // 实现 CanMove 的方法\n    @Override\n    public void back()\
    \ {\n        System.out.println(name + \" cat back ...\");\n    }\n    // 实现 CanMove\
    \ 的方法。\n    @Override\n    public int getVelocity() {\n        return 110;\n \
    \   }\n    // 实现 CanEat 的方法。\n    @Override\n    public void eat() {\n       \
    \ System.out.println(name + \" cat eat ...\");\n    }\n    // 实现 CanDrink 的方法。\n\
    \    @Override\n    public void drink() {\n        System.out.println(name + \"\
    \ cat drink ...\");\n    }\n}\n```\n\n### `Mouse.java`\n```java\npackage com.abd.java.cls;\n\
    import com.abd.java.itf.CanDrink;\nimport com.abd.java.itf.CanEat;\npublic class\
    \ Mouse extends Animal implements CanEat, CanDrink {\n    @Override\n    public\
    \ void back() {\n        System.out.println(\"Mouse back ...\");\n    }\n    @Override\n\
    \    public int getVelocity() {\n        return 85;\n    }\n    @Override\n  \
    \  public void drink() {\n        System.out.println(\"Mouse drink ...\");\n \
    \   }\n    @Override\n    public void eat() {\n        System.out.println(\"Mouse\
    \ eat ...\");\n    }\n}\n```\n\n### `AnimalDemo.java`\n```java\npackage com.abd.java.cls;\n\
    import com.abd.java.itf.CanEat;\npublic class AnimalDemo {\n    public static\
    \ void main(String[] args) {\n        // 从 CanDrink 接口继承静态字段。\n        System.out.println(\"\
    Drink \" + Cat.SEVENUP);\n        // 创建 CanEat 对象\n        // 通过 Cat 的构造函数。\n\
    \        CanEat canEat1 = new Cat(\"Tom\");\n        // 一个声明为 CanEat 的对象。\n  \
    \      // 但实际上是 Mouse。\n        CanEat canEat2 = new Mouse();\n        // 此处展示多态。\n\
    \        // Java 知道对象的实际类型。\n        // ==> Tom cat eat ...\n        canEat1.eat();\n\
    \        // ==> Mouse eat ...\n        canEat2.eat();\n        boolean isCat =\
    \ canEat1 instanceof Cat;\n        System.out.println(\"catEat1 is Cat? \" + isCat);\n\
    \        // 强制转换\n        if (canEat2 instanceof Mouse) {\n            Mouse mouse\
    \ = (Mouse) canEat2;\n            // 调用 drink 方法（继承自 CanDrink）。\n            mouse.drink();\n\
    \        }\n    }\n}\n```\n\n### 输出\n```\nDrink SEVEN UP\nTom cat eat ...\nMouse\
    \ eat ...\ncatEat1 is Cat? true\nMouse drink ...\n```\n\n# 第 9 章：软件安装\n\n## 1\
    \ 简介\n- 第一步 $\\rightarrow$ 我们将查看安装和配置\n- 第二步 $\\rightarrow$ 我们将查看带图的完整解释\n\n##\
