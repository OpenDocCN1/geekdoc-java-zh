    *   The function keeps calling itself with decreasing values of n until it reaches
    the base case, at which point the recursion stops.


    String Reverse


    You can reverse a string using recursion in Python by recursively swapping the
    characters at the beginning and end of the string until the entire string is reversed.
    Here''s how you can implement it:


    | def reverse_string(s):if len(s) <= 1:return selse:return reverse_string(s[1:])
    + s[0]# Test the functioninput_string = "hello"print("Original string:", input_string)print("Reversed
    string:", reverse_string(input_string)) |


    In this code:


    *   The base case is when the length of the string is less than or equal to 1\.
    In this case, the string itself is returned.


    *   Otherwise, the function returns the result of recursively calling reverse_string
    on the substring starting from the second character (s[1:]) and then appending
    the first character (s[0]) at the end.


    *   The function keeps calling itself with substrings until it reaches the base
    case, at which point the recursion stops and the reversed string is constructed.


    Chapter 6 :


    Object Oriented


    1   Python Modules


    Introduction


    A Python module is a file containing Python code, which can define functions,
    classes, and variables. The purpose of a Python module is to organize related
    code into a reusable and shareable unit. Modules provide a way to structure large
    Python projects into smaller, manageable components, making it easier to maintain,
    test, and collaborate on code.


    Here are some key purposes and benefits of using Python modules:


    1    Code Organization: Modules help organize code by grouping related functionality
    together. This makes it easier to understand and maintain the codebase.


    2    Encapsulation: Modules provide a way to encapsulate code into separate namespaces.
    This helps prevent naming conflicts and allows you to use the same names for variables
    and functions in different modules without causing conflicts.


    3    Reusability: Modules can be reused in multiple projects or within the same
    project. Once defined, a module can be imported into other Python scripts or modules,
    allowing you to reuse code without duplication.


    4    Abstraction: Modules allow you to abstract away implementation details and
    expose only the necessary interfaces to users. This promotes a clean and modular
    design, where each module can be treated as a black box with well-defined inputs
    and outputs.


    5    Scoping: Modules define their own scope, which helps avoid polluting the
    global namespace. Variables and functions defined within a module are accessible
    only within that module unless explicitly imported or exported.


    6    Namespacing: Modules provide a way to organize and manage namespaces in Python.
    Each module has its own namespace, which helps avoid naming conflicts and provides
    a clean separation of concerns.


    Overall, Python modules play a crucial role in structuring and organizing Python
    code, promoting modularity, reusability, and maintainability. They enable developers
    to build complex applications by breaking them down into smaller, more manageable
    components.


    Create


    To create a Python module, you simply need to create a Python file (.py) containing
    the code you want to include in the module. Here''s a step-by-step guide on how
    to create a Python module:


    1    Create a Python File: Create a new file with a .py extension. This file will
    contain the code for your module. For example, you can name it mymodule.py.


    2    Write Module Code: Write the Python code for your module in the created file.
    This can include function definitions, class definitions, variable assignments,
    and any other Python code you want to include in the module.


    3    Define Module Interface: Decide which functions, classes, and variables you
    want to make accessible to users of your module. These will be the public interface
    of your module.


    4    Save the File: Save the Python file containing your module code.


    5   Use the Module: You can now import and use your module in other Python scripts
    or modules by using the import statement.


    Here''s an example of a simple Python module named mymodule.py:


    | # mymodule.pydef greet(name):return f"Hello, {name}!"def add(a, b):return a
    + bPI = 3.14159 |


    To use this module in another Python script, you would import it like this:


    | # main.pyimport mymoduleprint(mymodule.greet("Alice"))  # Output: Hello, Alice!print(mymodule.add(2,
    3))        # Output: 5print(mymodule.PI)               # Output: 3.14159 |


    As for the file/folder structure convention for a Python module, it''s common
    practice to organize related modules into packages. A package is a directory that
    contains one or more Python modules and an __init__.py file. Here''s an example
    of a typical file/folder structure for a Python module:


    | ![](OEBPS/image_rsrc6ZA.jpg) |


    In this structure:


    *   my_package is the top-level package directory.


    *   __init__.py files indicate that the directories are Python packages and can
    contain module code.


    *   module1.py and module2.py are Python modules directly within the my_package
    package.


    *   subpackage is a subpackage directory within the my_package package.


    *   submodule1.py and submodule2.py are Python modules within the subpackage subpackage.


    This structure allows you to organize your modules into logical groups and namespaces,
    making it easier to manage and maintain larger codebases.


    import Syntax


    In Python, the import statement is used to include various Python modules into
    your code. There are several syntaxes you can use depending on what you want to
    achieve:


    1    Importing the entire module:


    | import module_name |


    Example:


    | import math |


    2    Importing with an alias:


    | import module_name as alias |


    Example:


    | import numpy as np |


    3    Importing specific attributes from a module:


    | from module_name import attribute_name1, attribute_name2, ... |


    Example:


    | from math import sqrt, pi |


    4    Importing all attributes from a module:


    | from module_name import * |


    This imports all attributes defined in the module, but it''s generally discouraged
    because it can lead to namespace pollution and make it unclear where certain functions
    or classes come from.


    Example:


    | from math import * |


    5    Importing a submodule:


    | import package_name.module_name |


    Example:


    | import matplotlib.pyplot as plt |


    These are the primary ways to use the import statement in Python. Each has its
    use case depending on the requirements of your program and your coding style preferences.


    import all function


    To import all functions and attributes from a module in Python, you can use the
    * wildcard character with the import statement. However, it''s generally discouraged
    because it can lead to namespace pollution and make it unclear where certain functions
    or classes come from.


    Here''s how you can import all functions from a module:


    | from module_name import * |


    Replace module_name with the name of the module you want to import from.


    Example:


    | from math import * |


    This imports all functions and attributes from the math module into the current
    namespace. However, it''s recommended to import only the specific functions or
    attributes you need from a module to keep your code clean and avoid potential
    naming conflicts.


