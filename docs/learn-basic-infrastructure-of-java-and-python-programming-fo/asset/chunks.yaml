    \ 语句的方法：\n\n```python\nfor item in iterable:\n    # 代码块\n    if condition:\n \
    \       continue\n    # 更多代码\n```\n\n在此语法中：\n\n- `iterable` 是循环迭代的序列或可迭代对象。\n\
    - `item` 是循环变量，在每次迭代中会获取 `iterable` 中每个项的值。\n- 循环块中带有 `condition` 的 `if` 语句检查是否满足特定条件。\n\
    - 如果 `condition` 求值结果为 `True`，则执行 `continue` 语句，导致跳过当前迭代中循环内的剩余代码，并循环进入下一次迭代。\n\
    \n这是一个演示在 for 循环中使用 `continue` 语句的简单示例：\n\n```python\nfruits = [\"apple\", \"\
    banana\", \"cherry\", \"date\"]\nfor fruit in fruits:\n    if fruit == \"banana\"\
    :\n        continue\n    print(fruit)\n```\n\n输出：\n\n```\napple\ncherry\ndate\n\
    ```\n\n"
- fmt: "\nIn this example, when the `fruit` variable becomes equal to \"banana\",\
    \ the `continue` statement is executed, causing the rest of the code inside the\
    \ loop for that iteration to be skipped. The loop proceeds to the next iteration,\
    \ and the remaining fruits are printed.\n\n### continue while\n\nTo use the `continue`\
    \ statement within a `while` loop in Python, you can place it inside the loop's\
    \ block to skip the remaining code for the current iteration and move to the next\
    \ iteration. Here's how you can use the `continue` statement in a `while` loop:\n\
    \n```python\n# Example: Using continue in a while loop\nwhile condition:\n   \
    \ # Code block\n    if condition:\n        continue\n    # More code\n```\n\n\
    In this syntax:\n- `condition` is the expression that determines whether the loop\
    \ should continue executing.\n- The `while` loop continues to execute as long\
    \ as the `condition` evaluates to `True`.\n- Inside the loop block, the `if` statement\
    \ with `condition` checks if a certain condition is met.\n- If the `condition`\
    \ evaluates to `True`, the `continue` statement is executed, causing the rest\
    \ of the code inside the loop for that iteration to be skipped, and the loop proceeds\
    \ to the next iteration.\n\nHere's a simple example demonstrating the usage of\
    \ the `continue` statement in a `while` loop:\n\n```python\n# Example: Using continue\
    \ in a while loop\ni = 0\nwhile i < 5:\n    i += 1\n    if i == 3:\n        continue\n\
    \    print(i)\n```\n\nOutput:\n```\n1245\n```\n\nIn this example, when `i` becomes\
    \ equal to 3, the `continue` statement is executed, causing the rest of the code\
    \ inside the loop for that iteration to be skipped. The loop proceeds to the next\
    \ iteration, and the remaining values of `i` are printed.\n\n# Chapter 5: Functions\n\
    \n## Python function\n\n### Introduction\nIn Python, a function is a block of\
    \ reusable code that performs a specific task. Functions provide a way to organize\
    \ code into manageable pieces, improve code reusability, and make the code more\
    \ readable.\n\nHere's the syntax to define and use a function in Python:\n\n####\
    \ 1. Defining a function:\n```python\ndef function_name(parameter1, parameter2,\
    \ ...):\n    # Function body\n    # Code to perform the task\n    return result\n\
    ```\n- `def` keyword is used to define a function.\n- `function_name` is the name\
    \ of the function.\n- `(parameter1, parameter2, ...)` is the list of parameters\
    \ (if any) that the function accepts. Parameters are optional.\n- `:` colon indicates\
    \ the beginning of the function body.\n- The function body consists of the code\
    \ that performs the task.\n- `return result` statement (optional) is used to return\
    \ a value from the function. If there's no `return` statement, the function returns\
    \ `None` by default.\n\n#### 2. Using a function:\n```python\nresult = function_name(argument1,\
    \ argument2, ...)\n```\n- `function_name` is the name of the function to call.\n\
    - `(argument1, argument2, ...)` is the list of arguments (if any) to pass to the\
    \ function. Arguments are optional.\n- The function is called with the specified\
    \ arguments, and the result (if any) is stored in the `result` variable.\n\nHere's\
    \ an example of defining and using a simple function in Python:\n```python\n#\
    \ Function definition\ndef add_numbers(x, y):\n    # Function body: adds two numbers\n\
    \    result = x + y\n    return result\n\n# Using the function\nsum_result = add_numbers(3,\
    \ 5)\nprint(\"Sum:\", sum_result)  # Output: Sum: 8\n```\nIn this example:\n-\
    \ We define a function `add_numbers` that takes two parameters `x` and `y`, adds\
    \ them together, and returns the result.\n- We call the function `add_numbers`\
    \ with arguments `3` and `5`, and store the result in the variable `sum_result`.\n\
    - We print the result to the console.\n\n### Parameters\nIn Python, function parameters\
    \ are variables that are specified in the function definition and are used to\
    \ pass values to the function when it is called. Parameters allow functions to\
    \ accept input values and perform operations on them.\n\nHere's the syntax to\
    \ define and use parameters in Python functions:\n\n#### 1. Defining parameters:\n\
    ```python\ndef function_name(parameter1, parameter2, ...):\n    # Function body\n\
    \    # Code that uses parameter1, parameter2, ...\n```\n- `def` keyword is used\
    \ to define a function.\n- `function_name` is the name of the function.\n- `(parameter1,\
    \ parameter2, ...)` is the list of parameters that the function accepts. Parameters\
    \ are optional.\n- Each parameter in the list is a variable that holds the value\
    \ passed to the function.\n- Parameters are separated by commas.\n\n#### 2. Using\
    \ parameters:\n```python\nresult = function_name(argument1, argument2, ...)\n\
    ```\n- `function_name` is the name of the function to call.\n- `(argument1, argument2,\
    \ ...)` is the list of arguments that are passed to the function. Arguments are\
    \ optional.\n- Arguments are the actual values that are passed to the function\
    \ when it is called.\n- The function uses these arguments to perform its task.\n\
    \nHere's an example demonstrating the usage of parameters in Python functions:\n\
    ```python\n# Function definition with parameters\ndef greet(name):\n    # Function\
    \ body: greets the user with the provided name\n    print(\"Hello,\", name, \"\
    !\")\n\n# Using the function with an argument\ngreet(\"Alice\")  # Output: Hello,\
    \ Alice!\n```\nIn this example:\n- We define a function `greet` that takes a single\
    \ parameter `name`.\n- When the function is called with the argument `\"Alice\"\
    `, the value `\"Alice\"` is passed to the parameter `name`.\n- Inside the function,\
    \ the parameter `name` holds the value `\"Alice\"`.\n\n### Keyword Parameters\n\
    Keyword parameters (also known as keyword arguments) in Python are parameters\
    \ that are passed to a function by specifying their corresponding names. Keyword\
    \ parameters allow you to provide arguments to a function in any order.\n\nHere's\
    \ the syntax to define and use keyword parameters:\n\n#### 1. Defining keyword\
    \ parameters:\n```python\ndef function_name(param1=default_value1, param2=default_value2,\
    \ ...):\n    # Function body\n    # Code that uses parameter1, parameter2, ...\n\
    ```\n- `def` keyword is used to define a function.\n- `function_name` is the name\
    \ of the function.\n- `(param1=default_value1, param2=default_value2, ...)` is\
    \ the list of parameters with default values. Keyword parameters are optional.\n\
    - Each parameter in the list is defined with its default value using the syntax\
    \ `param=default_value`.\n- Default values are used if no value is provided during\
    \ the function call.\n\n#### 2. Using keyword parameters:\n```python\nresult =\
    \ function_name(param1=value1, param2=value2, ...)\n```\n- `function_name` is\
    \ the name of the function to call.\n- `param1=value1, param2=value2`, etc., are\
    \ the keyword arguments.\n- Keyword arguments can be provided in any order.\n\n\
    Here's an example demonstrating the usage of keyword parameters in Python:\n```python\n\
    # Function definition with keyword parameters\ndef greet(name, message=\"Hello\"\
    ):\n    # Function body: greets the user with the provided name and message\n\
    \    print(message, name, \"!\")\n\n# Using the function with keyword arguments\n\
    greet(message=\"Hi\", name=\"Bob\")  # Output: Hi Bob!\n```\nIn this example:\n\
    - We define a function `greet` that takes two parameters: `name` and `message`.\n\
    - The parameter `message` has a default value `\"Hello\"`.\n- When the function\
    \ is called with keyword arguments `message=\"Hi\"` and `name=\"Bob\"`, these\
    \ arguments are passed to the corresponding parameters.\n- The function uses the\
    \ provided values to print the greeting message \"Hi Bob!\".\n\n### Default value\n\
    In Python, you can add default values to function parameters by specifying the\
    \ default values directly in the function definition. Here's the syntax to add\
    \ default values to function parameters:\n\n```python\ndef function_name(param1=default_value1,\
    \ param2=default_value2, ...):\n    # Function body\n    # Code that uses parameter1,\
    \ parameter2, ...\n```\nIn this syntax:\n- `param1=default_value1`, `param2=default_value2`,\
    \ etc., are the parameters with their corresponding default values.\n"
