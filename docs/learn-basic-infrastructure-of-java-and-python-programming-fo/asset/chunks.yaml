    You can perform various arithmetic operations on integer numbers in Python, including
    addition, subtraction, multiplication, division, floor division, and modulus.
    Depending on the operands and operators used, Python will return the appropriate
    result, which can be an integer or a floating-point number.


    ### Floats


    Creating floating-point numbers and performing simple calculations in Python is
    similar to working with integer numbers. Here''s an example of creating floating-point
    variables and performing arithmetic operations:


    | # Create floating-point variables

    x = 3.5

    y = 2.0

    # Perform arithmetic operations

    sum_result = x + y

    difference_result = x - y

    product_result = x * y

    quotient_result = x / y |


    You can use the same arithmetic operators (`+`, `-`, `*`, `/`, `//`, `%`) as with
    integer numbers to perform calculations with floating-point numbers. However,
    it''s important to note that when performing division (`/`), Python will always
    return a floating-point result, even if the operands are integers.


    | # Print the results

    print("Sum:", sum_result)

    print("Difference:", difference_result)

    print("Product:", product_result)

    print("Quotient:", quotient_result) |


    In this example:


    *   We create two floating-point variables `x` and `y`.

    *   We perform simple arithmetic operations using the `+`, `-`, `*`, and `/` operators.

    *   We print the results of the calculations.


    Output:


    | Sum: 5.5

    Difference: 1.5

    Product: 7.0

    Quotient: 1.75 |


    You can perform various arithmetic operations on floating-point numbers in Python,
    and Python will return floating-point results for division operations.


    ### Multiple Assignment


    Multiple assignment in Python allows you to assign multiple variables in a single
    line, each with its corresponding value. This can be done using tuple unpacking
    or list unpacking. Here''s how you can do multiple assignment:


    1. **Tuple Unpacking**: You can use a tuple on the right-hand side of the assignment
    operator to assign values to multiple variables.


    | # Tuple unpacking

    x, y, z = 10, 20, 30

    print("x:", x)  # Output: 10

    print("y:", y)  # Output: 20

    print("z:", z)  # Output: 30 |


    2. **List Unpacking**: You can use a list on the right-hand side of the assignment
    operator to assign values to multiple variables.


    | # List unpacking

    [a, b, c] = [10, 20, 30]

    print("a:", a)  # Output: 10

    print("b:", b)  # Output: 20

    print("c:", c)  # Output: 30 |


    3. **Extended Unpacking**: You can use extended unpacking with the `*` operator
    to assign the remaining elements of an iterable to a single variable.


    | # Extended unpacking

    first, *rest = [1, 2, 3, 4, 5]

    print("first:", first)  # Output: 1

    print("rest:", rest)    # Output: [2, 3, 4, 5] |


    4. **Swapping Variables**: Multiple assignment is commonly used to swap the values
    of variables without needing a temporary variable.


    | # Swapping variables

    x = 10

    y = 20

    x, y = y, x

    print("x:", x)  # Output: 20

    print("y:", y)  # Output: 10 |


    Multiple assignment is a convenient feature in Python that allows you to write
    concise and readable code when working with multiple values simultaneously.


    ### Int to string


    To convert an integer to a string in Python, you can use the `str()` function.
