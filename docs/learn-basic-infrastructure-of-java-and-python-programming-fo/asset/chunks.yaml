    \ Logical AND: False\n```\n\n#### 2. 逻辑或 (or):\n\n```python\na = True\nb = False\n\
    result = a or b\nprint(\"Logical OR:\", result)  # Output: Logical OR: True\n\
    ```\n\n#### 3. 逻辑非 (not):\n\n```python\na = True\nresult = not a\nprint(\"Logical\
    \ NOT:\", result)  # Output: Logical NOT: False\n```\n\n这些示例演示了 Python 中每个逻辑运算符的使用。你可以更改\
    \ `a` 和 `b` 的值来测试不同的逻辑操作。\n\n### 组合\n\n你可以通过使用括号对表达式分组并根据需要应用逻辑运算符（`and`、`or`、`not`），在\
    \ Python 中创建更复杂的条件。以下是一个组合逻辑运算符的示例：\n\n```python\n# 示例：检查数字是否在 10 到 20 之间，或者在\
    \ 30 到 40 的范围之外\ndef check_number_range(num):\n    if (num >= 10 and num <= 20)\
    \ or (num < 30 or num > 40):\n        return True\n    else:\n        return False\n\
    \n# 示例用法\nnumber1 = 15\nnumber2 = 25\nnumber3 = 35\nprint(\"Is\", number1, \"\
