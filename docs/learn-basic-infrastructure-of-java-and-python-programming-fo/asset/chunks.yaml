    \         return Number(self.value * other.value)\n        else:\n           \
    \ # If 'other' is not an instance of Number, raise TypeError\n            raise\
    \ TypeError(\"Unsupported operand type(s) for *: '{}' and '{}'\".format(type(self).__name__,\
    \ type(other).__name__))\n    def __str__(self):\n        return str(self.value)\n\
    \n# Create instances of Number\nnum1 = Number(5)\nnum2 = Number(10)\n# Use the\
    \ overloaded multiplication operator\nresult = num1 * num2\nprint(\"Result:\"\
    , result)  # Output: 50\n```\n\nIn this example:\n* We define a `Number` class\
    \ that represents a numerical value.\n* We define the `__mul__()` special method,\
    \ which will be called when the multiplication operator `*` is used with instances\
    \ of the `Number` class.\n* Inside the `__mul__()` method, we check if the other\
    \ operand is an instance of the `Number` class. If it is, we perform the multiplication\
    \ of the values and return a new `Number` object with the result.\n* If the other\
    \ operand is not an instance of the `Number` class, we raise a `TypeError` to\
    \ indicate that the operation is not supported.\n* We define a `__str__()` method\
    \ to provide a string representation of `Number` objects when they are printed.\n\
    \nYou can now use the multiplication operator `*` with instances of the `Number`\
    \ class, and Python will automatically call the `__mul__()` method to perform\
    \ the multiplication operation.\n\n# Chapter 7: Advanced\n\n## 1 Python File\n\
    \n### Access Modes\n\nPython file access modes are used to specify the mode in\
    \ which a file is opened. Each mode determines the operations that can be performed\
    \ on the file, such as reading, writing, appending, or creating a new file. Here\
    \ are the commonly used file access modes in Python:\n\n1. `'r'`: Open for reading\
    \ (default). If the file does not exist or cannot be opened, an `IOError` will\
    \ be raised.\n2. `'w'`: Open for writing. If the file already exists, its contents\
    \ will be overwritten. If the file does not exist, it will be created.\n3. `'a'`:\
    \ Open for appending. The file pointer is positioned at the end of the file. New\
    \ data will be written to the end of the file. If the file does not exist, it\
    \ will be created.\n4. `'r+'`: Open for reading and writing. The file pointer\
    \ is positioned at the beginning of the file. If the file does not exist or cannot\
    \ be opened, an `IOError` will be raised.\n5. `'w+'`: Open for reading and writing.\
    \ If the file already exists, its contents will be overwritten. If the file does\
    \ not exist, it will be created.\n6. `'a+'`: Open for reading and appending. The\
    \ file pointer is positioned at the end of the file. New data will be written\
    \ to the end of the file. If the file does not exist, it will be created.\n\n\
    Here's how you can use these file access modes in Python:\n\n```python\n# Open\
    \ a file in read mode\nwith open('file.txt', 'r') as file:\n    content = file.read()\n\
    \    print(content)\n\n# Open a file in write mode\nwith open('file.txt', 'w')\
    \ as file:\n    file.write('Hello, world!')\n\n# Open a file in append mode\n\
    with open('file.txt', 'a') as file:\n    file.write('\\nAppending new content')\n\
    \n# Open a file in read and write\nwith open('file.txt', 'r+') as file:\n    content\
    \ = file.read()\n    file.write('\\nAdding new content')\n\n# Open a file in read\
    \ and write mode (creating a new file if it doesn't exist)\nwith open('new_file.txt',\
    \ 'w+') as file:\n    file.write('This is a new file')\n\n# Open a file in read\
    \ and append mode (creating a new file if it doesn't exist)\nwith open('new_file.txt',\
    \ 'a+') as file:\n    file.write('\\nThis is appended content')\n```\n\nRemember\
    \ to always close the file using the `with` statement or by explicitly calling\
    \ the `close()` method.\n\n### Handler\n\nIn Python, a file handler (also referred\
    \ to as a file object or file descriptor) is an object that represents an open\
    \ file. It provides methods and attributes that allow you to interact with the\
    \ file, such as reading from it, writing to it, or manipulating its contents.\n\
    \nFile handlers are typically obtained by calling the `open()` function, which\
    \ returns a file handler associated with the file. You can then use this file\
    \ handler to perform various operations on the file.\n\nHere's how to use a file\
    \ handler in Python:\n\n```python\n# Open a file in read mode and obtain a file\
    \ handler\nfile_handler = open('file.txt', 'r')\n# Read the entire contents of\
    \ the file\ncontent = file_handler.read()\nprint(content)\n# Close the file handler\
    \ when done\nfile_handler.close()\n```\n\nIn the above example:\n* We use the\
    \ `open()` function to open a file named `file.txt` in read mode (`'r'`). This\
    \ returns a file handler that represents the opened file.\n* We then use the `read()`\
    \ method of the file handler to read the entire contents of the file and store\
    \ it in the variable `content`.\n* Finally, we close the file handler by calling\
    \ its `close()` method. It's important to close file handlers when they are no\
    \ longer needed to free up system resources and ensure that any buffered data\
    \ is flushed to the file.\n\nAdditionally, Python supports a context manager (`with`\
    \ statement) for file handling, which automatically closes the file handler when\
    \ you exit the block. This is the recommended way to work with files in Python.\n"
