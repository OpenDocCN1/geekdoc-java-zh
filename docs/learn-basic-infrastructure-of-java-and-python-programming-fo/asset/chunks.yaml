    \ and the program execution continues from the statement immediately following\
    \ the loop.\n\nHere's a simple example demonstrating the usage of `break` in a\
    \ for loop:\n\n```python\nfruits = [\"apple\", \"banana\", \"cherry\", \"date\"\
    ]\nfor fruit in fruits:\n    print(fruit)\n    if fruit == \"cherry\":\n     \
    \   break\n```\n\nOutput:\n\n```\napplebanana\ncherry\n```\n\nIn this example,\
    \ the loop terminates prematurely when the `fruit` variable becomes equal to `\"\
    cherry\"` due to the `break` statement.\n\n# break nested for\n\nIn Python, you\
    \ can use the `break` statement within a nested for loop to exit the inner loop\
    \ prematurely based on a certain condition. Here's how you can use the `break`\
    \ statement in a nested for loop:\n\n```python\nfor outer_item in outer_iterable:\n\
    \    # Outer loop code block\n    for inner_item in inner_iterable:\n        #\
