    5    Two-dimensional array


    The rows and columns of two-dimensional array are marked with indices 0, 1, 2,....
    To access an element of a two- dimensional array, you need to access by two indices:
    row index and column index.


    | ![](OEBPS/image_rsrc6ZZ.jpg) |


    You have three ways to declare a two-dimensional array.


    | // Declare an array with 5 rows, 10 columnsMyType[][] myArray1 = new MyType[5][10];//
    Declare 2 dimensional array with 5 row// (Array of arrays)MyType[][] myArray2
    = new MyType[5][];// Declare 2 dimensional array, Specifies the values for the
    elements.MyType[][] myArray3 = new MyType[][] {{ value00, value01, value02 , value03
    },{ value10, value11, value12 }};// ** Note:// MyType can be either primitive
    (byte, char, double, float, long, int, short, boolean)// or reference type. |


    If you declare an array of primitive type (byte, char, double, float, long, int,
    short, boolean), the elements are not assigned values, but default values.


    Default value 0 corresponds to the types such as byte, double, float, long, int,
    short.


    Default value false corresponds to the boolean type.


    Default value ''\u0000'' (character null) corresponds to the char type.


    Conversely, if you declare an array of reference type and if one element of the
    array is not assigned a value, it will be the null default value.


    Example:


    TwoDimensionalExample1.java


