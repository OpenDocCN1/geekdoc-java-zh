    Chapter 4 :


    Statements


    1   Python if


    Introduction


    In Python, the if statement is a control flow statement that allows you to execute
    a block of code based on whether a specified condition evaluates to True. It is
    used for decision-making in programming.


    The syntax of the if statement in Python is as follows:


    | if condition:# Code block to execute if the condition is Truestatement1statement2...
    |


    Here''s how the if statement works:


    *   The condition is evaluated. If it is True, the code block following the if
    statement is executed. If it is False, the code block is skipped.


    *   The code block under the if statement is typically indented to indicate that
    it belongs to the if statement. The indentation is usually four spaces, but it
    can be any consistent whitespace.


    *   Optionally, you can include an else statement to specify a block of code to
    execute if the condition is False. Additionally, you can use elif (short for "else
    if") to specify additional conditions to check.


    Here''s an example of using the if statement in Python:


    | x = 10if x > 5:print("x is greater than 5") |


    In this example:


    *   The condition x > 5 is evaluated. Since x is 10, which is greater than 5,
    the condition is True.


    *   Therefore, the code block under the if statement is executed, and the message
    "x is greater than 5" is printed to the console.


    Syntax


    The if statement in Python can be used in various ways to create conditional logic.
    Here are the different forms of if statements along with their syntax:


    1    Basic if statement:


    | if condition:# Code block to execute if the condition is Truestatement1statement2...
    |


    2    if-else statement:


    | if condition:# Code block to execute if the condition is Truestatement1statement2...else:#
    Code block to execute if the condition is Falsestatement3statement4... |


    3    Chained if-elif-else statement:


    | if condition1:# Code block to execute if condition1 is Truestatement1statement2...elif
    condition2:# Code block to execute if condition2 is Truestatement3statement4...elif
    condition3:# Code block to execute if condition3 is Truestatement5statement6...else:#
    Code block to execute if all conditions are Falsestatement7statement8... |


    4    Nested if statement:


    | if condition1:if condition2:# Code block to execute if both condition1 and condition2
    are Truestatement1statement2... |


    In each form of the if statement, you can include one or more conditions and corresponding
    code blocks to execute based on the evaluation of those conditions. The else and
    elif clauses are optional and can be used to specify alternate code blocks to
    execute when the conditions are False.


    Even Odd


    You can check whether a given number is even or odd in Python using an if statement
    with the modulo operator (%). Here''s how you can do it:


    | def check_even_odd(number):if number % 2 == 0:print(number, "is even.")else:print(number,
    "is odd.")# Example usagenumber = 7check_even_odd(number) |


    In this program:


    *   The check_even_odd function takes a number (number) as input.


    *   It checks if the number is even or odd using the modulo operator (%). If the
    remainder when dividing the number by 2 is 0, the number is even; otherwise, it
    is odd.


    *   If the number is even (number % 2 == 0), it prints a message indicating that
    the number is even. Otherwise, it prints a message indicating that the number
    is odd.


    *   The example usage demonstrates checking whether the number 7 is even or odd.
    You can pass any integer to the function to check if it''s even or odd.


    Largest/smallest


    You can read in three integers from the user, then use if statements to determine
    the largest and smallest integers among them. Here''s how you can do it:


    | # Read in three integers from the usernum1 = int(input("Enter first integer:
    "))num2 = int(input("Enter second integer: "))num3 = int(input("Enter third integer:
    "))# Assume the first number is both the largest and smallest initiallylargest
    = num1smallest = num1# Determine the largest integerif num2 > largest:largest
    = num2if num3 > largest:largest = num3# Determine the smallest integerif num2
    < smallest:smallest = num2if num3 < smallest:smallest = num3# Print the largest
    and smallest integersprint("Largest integer:", largest)print("Smallest integer:",
    smallest) |


    In this program:


    *   We first read in three integers (num1, num2, num3) from the user using the
    input function, and convert them to integers using the int function.


    *   We initialize the variables largest and smallest to the value of num1, assuming
    initially that num1 is both the largest and smallest integer.


    *   We then use if statements to compare num2 and num3 with largest to determine
    the largest integer, and similarly compare them with smallest to determine the
    smallest integer.


    *   Finally, we print the largest and smallest integers to the console.


    Positive or negative


    You can create a Python program to check whether a given integer is positive or
    negative using an if statement like this:


    | # Take input from the usernum = int(input("Enter an integer: "))# Check if the
    number is positive, negative, or zeroif num > 0:print("The number is positive.")elif
    num < 0:print("The number is negative.")else:print("The number is zero.") |


    In this code:


    *   We take an integer input from the user using the input() function.


    *   Then, we convert the input into an integer using the int() function.


    *   We use the if, elif, and else statements to check whether the number is positive,
    negative, or zero.


    *   If the number is greater than 0, it''s positive. If it''s less than 0, it''s
    negative. Otherwise, it''s zero.


    2   Python while


    Syntax


    The syntax of a while loop in Python is as follows:


    | while condition:# Code block to be executed repeatedly# as long as the condition
    is True |


    In this syntax:


    *   condition is an expression that is evaluated before each iteration of the
    loop. If the condition evaluates to True, the loop body is executed. If the condition
    evaluates to False, the loop terminates.


    *   The colon (:) at the end of the while statement indicates the start of the
    indented block of code that will be executed repeatedly as long as the condition
    is True.


    *   The code inside the loop block is indented to signify that it belongs to the
    loop body.


    *   The loop continues to execute the code block repeatedly until the condition
    becomes False. If the condition never becomes False, you can end up with an infinite
    loop.


    break


    You can use the break statement to exit a while loop prematurely in Python. Here''s
    how you can use it:


    | while condition:# Code block to be executed repeatedly# as long as the condition
    is Trueif some_condition:break  # Exit the loop if some condition is met |


    In this code:


    *   Inside the while loop, there''s an if statement that checks for a certain
    condition (some_condition).


    *   If some_condition evaluates to True, the break statement is executed.


    *   When the break statement is encountered, it immediately exits the while loop,
    regardless of whether the loop''s condition is still True.


    *   After the break statement is executed, the program continues to execute the
    code that follows the loop.


    continue


    You can use the continue statement to skip the current iteration of a while loop
    and proceed to the next iteration. Here''s how you can use it:


    | while condition:# Code block to be executed repeatedly# as long as the condition
    is Trueif some_condition:continue  # Skip the rest of the loop''s code and start
    the next iteration# Code here will be skipped if some_condition is True |


    In this code:


    *   Inside the while loop, there''s an if statement that checks for a certain
    condition (some_condition).


    *   If some_condition evaluates to True, the continue statement is executed.


    *   When the continue statement is encountered, it skips the remaining code in
    the loop''s block for the current iteration and moves on to the next iteration
    of the loop.'
