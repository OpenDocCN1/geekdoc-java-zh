    \ function that calls itself until reaching the base case. Here's how you can\
    \ do it:\n\n```python\ndef sum_of_natural_numbers(n):\n    if n <= 1:\n      \
    \  return n\n    else:\n        return n + sum_of_natural_numbers(n - 1)\n\n#\
    \ Test the function\nn = 5\nprint(\"Sum of first\", n, \"natural numbers is:\"\
    , sum_of_natural_numbers(n))\n```\n\nIn this code:\n\n- The base case is when\
    \ `n` becomes 1 or less, in which case we return `n`.\n- Otherwise, we return\
    \ `n` plus the sum of natural numbers from 1 to `n-1`, which we obtain by calling\
    \ the function recursively with `n-1`.\n- The function keeps calling itself with\
    \ decreasing values of `n` until it reaches the base case, at which point the\
    \ recursion stops.\n\n# String Reverse\n\nYou can reverse a string using recursion\
    \ in Python by recursively swapping the characters at the beginning and end of\
    \ the string until the entire string is reversed. Here's how you can implement\
    \ it:\n\n```python\ndef reverse_string(s):\n    if len(s) <= 1:\n        return\
    \ s\n    else:\n        return reverse_string(s[1:]) + s[0]\n\n# Test the function\n\
    input_string = \"hello\"\nprint(\"Original string:\", input_string)\nprint(\"\
    Reversed string:\", reverse_string(input_string))\n```\n\nIn this code:\n\n- The\
    \ base case is when the length of the string is less than or equal to 1. In this\
    \ case, the string itself is returned.\n- Otherwise, the function returns the\
    \ result of recursively calling `reverse_string` on the substring starting from\
    \ the second character (`s[1:]`) and then appending the first character (`s[0]`)\
    \ at the end.\n- The function keeps calling itself with substrings until it reaches\
    \ the base case, at which point the recursion stops and the reversed string is\
