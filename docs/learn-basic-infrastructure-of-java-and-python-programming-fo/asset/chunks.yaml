    Chapter 2 :


    Python Data Types


    1   Python boolean


    Introduction


    Boolean values are a data type in Python that represent truth values. They can
    only have one of two values: True or False. Boolean values are commonly used in
    conditional statements, loops, and logical operations to control the flow of the
    program or to represent the result of a comparison.


    Here''s how you can use Boolean values in Python:


    1    Boolean Variables: You can assign Boolean values to


    variables like any other data type.


    | is_student = Truehas_passed_exam = False |


    2    Conditional Statements: Boolean values are often used in


    conditional statements (if, elif, else) to execute different


    blocks of code based on whether a condition is True or


    False.


    | if is_student:print("The person is a student.")else:print("The person is not
    a student.") |


    3    Logical Operators: Boolean values can be combined using


    logical operators (and, or, not) to create compound


    conditions.


    | age = 20is_adult = age >= 18is_teenager = age >= 13 and age <= 19 |


    4    Loops: Boolean values are often used as loop conditions to


    control the execution of the loop.


    | while is_student:print("Still studying...")# Some condition to update is_student,
    otherwise, it may result in an infinite loopis_student = False |


    5    Function Returns: Functions can return Boolean values to


    indicate the success or failure of an operation or to indicate


    a condition.


    | def is_even(number):return number % 2 == 0print(is_even(4))  # Trueprint(is_even(5))  #
    False |


    6    Built-in Functions: Python provides built-in functions like


    bool() to convert other data types to Boolean values.


    | print(bool(0))     # Falseprint(bool(1))     # Trueprint(bool([]))    # False
    (empty list)print(bool([1]))   # True (non-empty list) |


    boolean to int


    In Python, you can convert a Boolean value to an integer using the int() function.
    When you convert a Boolean value to an integer, True is represented as 1 and False
    is represented as 0\. Here''s how you can do it:


    | # Convert True to integerboolean_value = Trueinteger_value = int(boolean_value)print(integer_value) 
    # Output: 1# Convert False to integerboolean_value = Falseinteger_value = int(boolean_value)print(integer_value) 
    # Output: 0 |


    boolean to string


    In Python, you can convert a boolean value to a string using either the str()
    function or by using string formatting methods. Here are a example:


    Using str() function:


    | # Convert True to stringboolean_value = Truestring_value = str(boolean_value)print(string_value) 
    # Output: "True"# Convert False to stringboolean_value = Falsestring_value = str(boolean_value)print(string_value) 
