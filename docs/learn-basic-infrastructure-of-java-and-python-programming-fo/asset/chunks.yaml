    , 3, 20);\n        Cat cat2 = new AsianCat(\"ATom\", 2, 19);\n        System.out.println(\"\
    Animal Name of cat1: \" + cat1.getAnimalName());\n        System.out.println(\"\
    Animal Name of cat2: \" + cat2.getAnimalName());\n    }\n}\n```\n\n**Output**\n\
    ```\nAnimal Name of cat1: Cat\nAnimal Name of cat2: Asian Cat\n```\n\n## Chapter\
    \ 8: Abstract class and Interface in Java\n\n1. Introduction\n2. Abstract Class\n\
    3. Abstract class, the examples\n4. Overview of the interface\n5. Structure of\
    \ an Interface\n6. Class implements Interface\n\n### 1. Introduction\n\nIn this\
    \ document, I will instruct you in Interface and Abstract Class, also analyze\
    \ the similarities and differences between them.\n\n### 2. Abstract Class\n\n\
    Abstract class. for example:\n\n```java\n// This is an abstract class\n// It must\
    \ be declared as abstract because it has an abstract method.\npublic abstract\
    \ class ClassA {\n    // This is an abstract method\n    // It has no body.\n\
    \    // Its access modifier is public\n    public abstract void doSomething();\n\
    \n    // The access modifier of this method is protected\n    protected abstract\
    \ void doNothing();\n\n    // The access modifier of this method is protected\n\
    \    protected void todo() {}\n}\n```\n\nCharacteristics of an abstract class:\n\
    - It is declared as `abstract`.\n- It cannot be instantiated directly.\n- It can\
    \ have abstract methods (methods without body) and concrete methods.\n\n### 3.\
    \ Abstract class, the examples\n\nSee illustration:\n\n![](OEBPS/image_rsrc705.jpg)\n\
    \n**AbstractJob.java**\n```java\npackage com.abd.java.inheritance.demo;\n// This\
    \ is an abstract class\n// It must be declared as abstract because it has an abstract\
    \ method.\npublic abstract class AbstractJob {\n    // This is an abstract method\n\
    \    // It has no body.\n    // Its access modifier is public\n    public abstract\
    \ void getJobName();\n}\n```\n\n**JavaCoding.java**\n```java\npackage com.abd.java.inheritance.demo;\n\
    // AbstractJob has two abstract methods.\n// This class implements all abstract\
    \ methods.\npublic class JavaCoding extends AbstractJob {\n    public JavaCoding()\
    \ {}\n    // Implements abstract method of parent class.\n    @Override\n    public\
    \ void doJob() {\n        System.out.println(\"Coding Java...\");\n    }\n   \
    \ // Return name of Job.\n    @Override\n    public String getJobName() {\n  \
    \      return \"Coding Java\";\n    }\n}\n```\n\n**ManualJob.java**\n```java\n\
    package com.abd.java.inheritance.demo;\n// AbstractJob has two abstract methods.\n\
    // This class implements only one abstract method of parent class.\n// Therefore\
    \ it must be declared as abstract.\npublic abstract class ManualJob extends AbstractJob\
    \ {\n    public ManualJob() {}\n    // Implements abstract method of parent class.\n\
    \    @Override\n    public String getJobName() {\n        return \"Manual Job\"\
    ;\n    }\n}\n```\n\n**BuildHouse.java**\n```java\npackage com.abd.java.inheritance.demo;\n\
    // This class inherited from ManualJob\n// BuildHouse is not declared as abstract\n\
    // so it must implements all abstract methods.\npublic class BuildHouse extends\
    \ ManualJob {\n    public BuildHouse() {}\n    // Implements abstract methods\
