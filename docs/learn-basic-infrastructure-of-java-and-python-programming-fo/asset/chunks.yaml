    To move a file from one directory to another in Python, you can use the shutil.move()
    function from the shutil module. Here''s how you can use it:


    | import shutil# Source and destination file pathssource_file = ''source_directory/file.txt''destination_file
    = ''destination_directory/file.txt''# Move the file from the source directory
    to the destination directoryshutil.move(source_file, destination_file)print("File
    moved successfully!") |


    In this example:


    *   We import the shutil module.


    *   We define the paths of the source file and the destination file.


    *   We use the shutil.move() function, passing the source file path and the destination
    file path as arguments.


    *   The function moves the file from the source directory to the destination directory.


    *   Finally, we print a message to indicate that the file has been moved successfully.


    Make sure to replace ''source_directory/file.txt'' and ''destination_directory/file.txt''
    with the actual paths of the source and destination directories respectively,
    as well as the filenames you want to move.


    Delete File


    To delete a file in Python, you can use the os.remove() function from the os module.
    Here''s how you can use it:


    | import os# File pathfile_path = ''file_to_delete.txt''# Check if the file exists
    before attempting to delete itif os.path.exists(file_path):# Delete the fileos.remove(file_path)print("File
    deleted successfully!")else:print("File does not exist.") |


    In this example:


    *   We import the os module.


    *   We define the path of the file we want to delete.


    *   We use the os.path.exists() function to check if the file exists before attempting
    to delete it.


    *   If the file exists, we use the os.remove() function, passing the file path
    as an argument, to delete the file.


    *   If the file does not exist, we print a message indicating that the file does
    not exist.


    Make sure to replace ''file_to_delete.txt'' with the actual path of the file you
    want to delete.


    2   Python Text File


    Read


    To read from a file in Python, you can use the open() function to open the file
    and obtain a file handler, and then use methods like read(), readline(), or readlines()
    to read the content from the file. Here''s how you can do it:


    1    Reading the entire contents of a file at once using read():


    | # Open the file in read mode and obtain a file handlerwith open(''file.txt'',
    ''r'') as file_handler:# Read the entire contents of the filecontent = file_handler.read()print(content)
    |


    2    Reading one line at a time using readline():


    | # Open the file in read mode and obtain a file handlerwith open(''file.txt'',
    ''r'') as file_handler:# Read one line at a timeline = file_handler.readline()while
    line:print(line, end='''')  # end='''' to avoid adding extra newlinesline = file_handler.readline()
    |


    3    Reading all lines into a list using readlines():


    | # Open the file in read mode and obtain a file handlerwith open(''file.txt'',
    ''r'') as file_handler:# Read all lines into a listlines = file_handler.readlines()for
    line in lines:print(line, end='''')  # end='''' to avoid adding extra newlines
    |


    In each example:


    *   We use the open() function with the file name ''file.txt'' and the mode ''r''
    to open the file in read mode.


    *   We use a context manager (with statement) to automatically close the file
    handler after it''s been opened.


    *   We use one of the file handler''s methods (read(), readline(), or readlines())
    to read the content from the file.


    *   We print the content to the console.


    Choose the appropriate method based on your specific requirements. If you want
    to process the entire content of the file at once, use read(). If you want to
    process the file line by line, use readline(). If you want to store all lines
    in a list, use readlines().


    Path


    In Python, you can obtain both relative and absolute file paths using various
    methods. Here are some common approaches:


    1    Using the os.path Module:


    *   The os.path.abspath() function returns the absolute path of a file.


    *   The os.path.relpath() function returns the relative path of a file from a
    specified directory (or the current working directory if not specified).


    | import os# Absolute pathabsolute_path = os.path.abspath(''file.txt'')print("Absolute
    path:", absolute_path)# Relative path from the current working directoryrelative_path
    = os.path.relpath(''file.txt'')print("Relative path:", relative_path) |


    2    Using the pathlib Module (Python 3.4 and later):


    *   The pathlib.Path.resolve() method returns the absolute path of a file.


    *   The pathlib.Path.relative_to() method returns the relative path of a file
    from a specified directory.'
