    \ 2. Using str.format() Method\nThe `str.format()` method allows you to format\
    \ strings with placeholders `{}` that are replaced with variable values.\n\n```python\n\
    name = \"Alice\"\nage = 30\ngreeting = \"Hello, {}! You are {} years old.\".format(name,\
