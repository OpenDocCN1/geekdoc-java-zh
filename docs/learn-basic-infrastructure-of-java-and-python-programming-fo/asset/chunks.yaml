    \ Exceptions can be logged to record information about errors that occur during\
    \ program execution. This can be useful for debugging and troubleshooting.\n4.\
    \ **Take corrective action**: Exceptions can be caught and handled by executing\
    \ specific code to address the error condition, such as retrying an operation,\
    \ using default values, or prompting the user for input.\n\nHere's an example\
    \ of using exceptions to handle a division by zero error:\n\n```python\ntry:\n\
    \    result = 10 / 0  # Attempting division by zero\nexcept ZeroDivisionError:\n\
