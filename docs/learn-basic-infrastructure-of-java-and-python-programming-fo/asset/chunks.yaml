    myArray[3] = 903\n```\n\n### 3 一维数组和 for-each 循环\n\nJava 5 为你提供了 for-each 循环，允许你在不使用索引变量的情况下遍历数组的所有元素。\n\
    \n示例：\n\nArrayForeachExample.java\n```java\npackage com.abd.java.javabasic.array;\n\
