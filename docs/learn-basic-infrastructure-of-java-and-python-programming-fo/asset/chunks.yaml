    # Division returns a float in Python 3.xfloor_division_result = x // y  # Floor
    division returns an integerremainder_result = x % y  # Modulus operator returns
    the remainder# Print the resultsprint("Sum:", sum_result)print("Difference:",
    difference_result)print("Product:", product_result)print("Quotient:", quotient_result)print("Floor
    Division:", floor_division_result)print("Remainder:", remainder_result) |


    Output:


    | Sum: 8Difference: 2Product: 15Quotient: 1.6666666666666667Floor Division: 1Remainder:
    2 |


    In this example:


    *   We create two integer variables x and y.


    *   We perform simple arithmetic operations using the +, -, *, /, //, and % operators.


    *   We print the results of the calculations.'
