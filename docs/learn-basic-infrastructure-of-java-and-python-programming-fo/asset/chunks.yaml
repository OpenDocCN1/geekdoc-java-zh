    ----------------------\nx = 2\nx after ++ = 3\n----------------------\nx = 3\n\
    x after ++ = 4\n----------------------\nx = 4\nx after ++ = 5\n----------------------\n\
    x = 5\nDone!\n```\n\n### 7 循环中的 continue 语句\n\n`continue` 语句可以出现在循环中。当遇到 `continue`\
    \ 语句时，程序将忽略块内的语句以及 `continue` 之后的语句，并开始新的迭代（如果条件仍然正确的话）。\n\n![](img/image_rsrc6ZT.jpg)\n\
    \nLoopContinueExample.java\n```java\npackage com.abd.java.javabasic.loop;\npublic\
    \ class LoopContinueExample {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Continue example\");\n        int x = 2;\n     \
    \   while (x < 7) {\n            System.out.println(\"----------------------\\\
    n\");\n            System.out.println(\"x = \" + x);\n            // x = x + 1;\n\
    \            x++;\n            // % 运算符用于计算余数。\n            // 如果 x 是偶数，则忽略 'continue'\
    \ 下方的命令行，\n            // 开始新的迭代（如果条件仍然为真）。\n            if (x % 2 == 0) {\n \
