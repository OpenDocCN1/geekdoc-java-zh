    1    What is Array


    In Java, array is a set of elements with the same data type, and consecutive addresses
    on the memory. The array has the fixed number of elements and you can not change
    its size.


    | ![](OEBPS/image_rsrc6ZV.jpg) |


    The elements of an array are marked with a index, starting at index 0\. You can
    access its elements through index.


    Let''s see, a array with 5 elements, int type.


    | ![](OEBPS/image_rsrc6ZW.jpg) |


    In addition to one-dimensional arrays, you sometimes have to work with two-dimensional
    or multiple-dimensional arrays. For a two-dimensional array, its elements will
    be marked with two indexes such as row index and column index. Below is an image
    of a two- dimensional array.


    | ![](OEBPS/image_rsrc6ZX.jpg) |


    2    One-dimensional array


    How to declare an array in Java.


    | // Declare an array, not a specified number of elements.int[] array1;// Initialize
    the array with 100 elements// The elements has not been assigned a specific valuearray1
    = new int[100];// Declare an array specifies the number of elements// The elements
    has not been assigned a specific valuedouble[] array2 = new double[10];// Declare
    an array with elements assigned a specific values.// This array has 4 elementslong[]
    array3= {10L, 23L, 30L, 11L}; |


    Let''s look at an example:


    | ![](OEBPS/image_rsrc6ZY.jpg) |


