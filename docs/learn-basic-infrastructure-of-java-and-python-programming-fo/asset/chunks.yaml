    2    Abstract Class


    Abstract class. for example:


    | // This is an abstract class.// It must be declared as abstract because it has
    an abstract method.public abstract class ClassA  {// This is an abstract method//
    It has no body.// Its access modifier is publicpublic abstract void doSomething();//
    The access modifier of this method is protected.protected abstract String doNothing();//
    This method does not declare access modifier// It has the default access modifier.abstract
    void todo() ;}// This is an abstract class.// It is declared as abstract,// though
    it does not have any abstract methods.public abstract class ClassB   {} |


    Characteristics of an abstract class is:


    It is declared abstract.


    It can declare 0, 1 or more of inside abstract methods.


    Unable to initialize one object directly from an abstract class.


