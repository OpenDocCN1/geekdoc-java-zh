    \ {\n    // This is an example to sum the numbers from 1 to 100,\n    // and print\
    \ out the results to the console.\n    public static void main(String[] args)\
    \ {\n        // Declare a variable\n        int total = 0;\n        // Declare\
    \ a variable value\n        // Initial value is 1\n        // After each iteration\
    \ increases the 'value' by adding 1\n        // Note: value++ equivalent to the\
    \ statement: value = value + 1;\n        // value-- equivalent to the statement:\
    \ value = value - 1;\n        for (int value = 1; value <= 100; value++) {\n \
    \           // Increase 'total' by adding 'value'.\n            total = total\
    \ + value;\n        }\n        System.out.println(\"Total = \" + total);\n   \
    \ }\n}\n```\n\n**Output**\n```\nTotal = 5050\n```\n\n### 3 for-each loop\n\n```java\n\
    // arrayOrCollection: Array or Collection\nfor (Type variable: arrayOrCollection)\
