    \        for (int year : years) {\n            System.out.println(\"Year: \" +\
    \ year);\n        }\n        // 将数组转换为字符串。\n        String yearsString = Arrays.toString(years);\n\
    \        System.out.println(\"Years: \" + yearsString);\n        // 从多个值创建列表。\n\
    \        List<String> names = Arrays.asList(\"Tom\", \"Jerry\", \"Donald\");\n\
    \        for (String name : names) {\n            System.out.println(\"Name: \"\
    \ + name);\n        }\n    }\n}\n```\n\n**输出**\n```\nYear: 1994\nYear: 1995\n\
    Year: 2000\nYear: 2001\nYear: 2017\nYears: [1994, 1995, 2000, 2001, 2017]\nName:\
    \ Tom\nName: Jerry\nName: Donald\n```\n\n### 5 二维数组\n\n二维数组的行和列用 0, 1, 2 等索引标记。访问二维数组的元素需要两个索引：行索引和列索引。\n\
    \n![](img/image_src6.jpg)\n\n你有三种方法声明二维数组：\n\n- 声明具有 5 行 10 列的数组：`Type[][] myArray1\
    \ = new Type[5][10];`\n- 声明具有 5 行的二维数组（数组数组）：`Type[][] myArray2 = new Type[5][];`\n\
    - 声明二维数组并指定元素的值：`Type[][] myArray3 = new Type[][]{{value0, value1, value2},{value3,\
    \ value4, value5}};`\n\n**注意**：`Type` 既可以是基本类型（`byte`、`char`、`double`、`float`、`long`、`int`、`short`、`boolean`），也可以是引用类型。如果你声明基本类型数组，元素具有默认值：\n\
    \n- 默认值 `0` 对应 `byte`、`double`、`long`、`int`、`short` 类型。\n- 默认值 `false` 对应 `boolean`\
    \ 类型。\n- 默认值 `\\u0000` 对应 `char` 类型。\n\n相反，如果你声明引用类型数组，元素是 `null`。\n\n示例：\n\n\
    TwoDimensionalExample.java\n```java\npackage com.abd.java.javabasic.array;\npublic\
    \ class TwoDimensionalExample {\n    public static void main(String[] args) {\n\
    \        // 声明具有 2 行 3 列的二维数组\n        // 元素具有默认值\n        int[][] myArray = new\
    \ int[2][3];\n        // 二维数组的行数。\n        System.out.println(\"Length of myArray:\
    \ \"+ myArray.length); // 2\n        // 打印\n        for (int row = 0; row < 2;\
    \ row++) {\n            for (int col = 0; col < 3; col++) {\n                System.out.println(\"\
    myArray[\" + row + \",\" + col + \"]=\" + myArray[row][col]);\n            }\n\
    \        }\n        System.out.println(\" --- \");\n        // 给元素赋值。\n      \
    \  for (int row = 0; row < 2; row++) {\n            for (int col = 0; col < 3;\
