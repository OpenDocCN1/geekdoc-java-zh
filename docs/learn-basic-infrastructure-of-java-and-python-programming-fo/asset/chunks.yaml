    4   Python Logical Operators


    Introduction


    In Python, logical operators are used to combine multiple conditions and produce
    a single Boolean result (True or False). Here''s a list of logical operators in
    Python:


    1    Logical AND (and): Returns True if both operands are True.


    2    Logical OR (or): Returns True if at least one of the operands


    is True.


    3    Logical NOT (not): Returns True if the operand is False, and


    False if the operand is True.


    These operators are commonly used in conditional statements, loops, and other
    contexts where logical operations are needed.


    Usage


    Here are examples illustrating the use of each logical operator in Python:


    1    Logical AND (and):


    | a = Trueb = Falseresult = a and bprint("Logical AND:", result)  # Output: Logical
    AND: False |


    2    Logical OR (or):


    | a = Trueb = Falseresult = a or bprint("Logical OR:", result)  # Output: Logical
    OR: True |


    3    Logical NOT (not):


    | a = Trueresult = not aprint("Logical NOT:", result)  # Output: Logical NOT:
    False |


    These examples demonstrate the use of each logical operator in Python. You can
    change the values of a and b to test different logical operations.


    Combine


    You can combine logical operators to create more complex conditions in Python
    by using parentheses to group expressions and applying logical operators (and,
    or, not) as needed. Here''s an example that demonstrates combining logical operators:


    | # Example: Check if a number is between 10 and 20, or outside the range 30 to
    40def check_number_range(num):if (num >= 10 and num <= 20) or (num < 30 or num
    > 40):return Trueelse:return False# Example usagenumber1 = 15number2 = 25number3
    = 35print("Is", number1, "between 10 and 20 or outside the range 30 to 40?", check_number_range(number1)) 
    # Output: Trueprint("Is", number2, "between 10 and 20 or outside the range 30
    to 40?", check_number_range(number2))  # Output: Falseprint("Is", number3, "between
    10 and 20 or outside the range 30 to 40?", check_number_range(number3))  # Output:
    True |


    In this example:


    *   The check_number_range function takes a number (num) as input and checks if
    it meets the specified conditions.


    *   The condition is defined using logical operators:


    *   (num >= 10 and num <= 20) checks if the number is between 10 and 20.


    *   (num < 30 or num > 40) checks if the number is outside the range 30 to 40.


    *   The or operator is used to combine these two conditions.


    *   The and operator is used within the first condition to check if the number
    satisfies both the lower and upper bounds of the range.


    *   Parentheses are used to group expressions and ensure the correct evaluation
    of the conditions.


    *   The function returns True if the number meets the conditions and False otherwise.


    *   The example usage demonstrates checking whether three different numbers meet
    the specified conditions. Adjust the numbers and conditions as needed for your
    specific requirements.


    Greatest of three numbers


    You can create a Python program to find the greatest of three numbers using logical
    operators (and and or) to compare the numbers. Here''s how you can do it:


    | def find_greatest(num1, num2, num3):if num1 >= num2 and num1 >= num3:return
    num1elif num2 >= num1 and num2 >= num3:return num2else:return num3# Example usagenumber1
    = 10number2 = 20number3 = 15greatest = find_greatest(number1, number2, number3)print("The
    greatest of the three numbers is:", greatest) |


    In this program:


    *   The find_greatest function takes three numbers (num1, num2, num3) as input.


    *   It compares the numbers using logical operators (and and or) to find the greatest
    among them.


    *   If num1 is greater than or equal to both num2 and num3, it returns num1 as
    the greatest.


    *   If num2 is greater than or equal to both num1 and num3, it returns num2 as
    the greatest.


    *   Otherwise, it returns num3 as the greatest.


    *   The example usage demonstrates finding the greatest of three numbers (10,
    20, and 15). You can adjust the values of number1, number2, and number3 to find
    the greatest of any three numbers.


    5   Python Ternary Operators


    Introduction


    The ternary operator in Python is a conditional expression that evaluates a condition
    and returns one of two values depending on whether the condition is true or false.
    It is also known as the conditional expression. The syntax of the ternary operator
    in Python is as follows:


    | x = <value_if_true> if <condition> else <value_if_false> |


    Here''s how the ternary operator works:


    *   <condition> is evaluated first. If it is true, <value_if_true> is returned;
    otherwise, <value_if_false> is returned.


    *   The ternary operator is an expression, not a statement, so it can be used
    within larger expressions or assignments.


    Here''s an example of using the ternary operator in Python:


    | x = 10y = 20max_value = x if x > y else yprint("Maximum value:", max_value) 
    # Output: Maximum value: 20 |


    In this example:


    *   The condition x > y is evaluated first. If it is true, x is assigned to max_value;
    otherwise, y is assigned.


    *   Since x (10) is not greater than y (20), the value of y (20) is assigned to
    max_value.


    *   The ternary operator makes the code concise and readable, especially in situations
    where you need to choose between two values based on a condition.


    Usage


    Here are examples illustrating the use of the ternary operator in Python:


    1    Assigning Maximum Value:


    | x = 10y = 20max_value = x if x > y else yprint("Maximum value:", max_value) 
    # Output: Maximum value: 20 |


    2    Checking Even or Odd:


    | num = 15result = "Even" if num % 2 == 0 else "Odd"print(num, "is", result) 
    # Output: 15 is Odd |


    3    Assigning Absolute Value:


    | number = -10absolute_value = number if number >= 0 else -numberprint("Absolute
    value:", absolute_value)  # Output: Absolute value: 10 |


    4    Checking for Validity:


    | username = "john_doe"message = "Valid" if len(username) >= 8 else "Invalid"print("Username
    is", message)  # Output: Username is Valid |


    5    Handling Division by Zero:


    | dividend = 10divisor = 0result = dividend / divisor if divisor != 0 else "Error:
    Division by Zero"print("Result:", result)  # Output: Result: Error: Division by
    Zero |


    These examples demonstrate the versatility of the ternary operator in Python for
    making concise conditional assignments or expressions.


    Largest


    You can create a Python program to find the largest of two numbers entered by
    the user using ternary operators as follows:


    | # Input two numbers from the usernumber1 = float(input("Enter first number:
    "))number2 = float(input("Enter second number: "))# Determine the largest number
    using ternary operatorlargest = number1 if number1 > number2 else number2# Display
    the resultprint("The largest number is:", largest) |


    In this program:


    *   The input function is used to get two numbers as input from the user.


    *   Ternary operator is used to determine the largest of the two numbers.


    *   If number1 is greater than number2, number1 is assigned to largest; otherwise,
    number2 is assigned.'
