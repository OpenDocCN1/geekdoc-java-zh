    *   We call the sort() method on the list my_list to sort its elements permanently.


    *   The sort() method modifies the original list by sorting its elements in ascending
    order.


    *   We print the sorted list to verify the changes.


    5   Python Tuple


    Introduction


    A Python tuple is an immutable, ordered collection of elements. Immutable means
    that once a tuple is created, its elements cannot be changed or modified. Tuples
    are similar to lists, but they are enclosed in parentheses () instead of square
    brackets [].


    You can create a tuple in Python by enclosing elements within parentheses ().
    Here are a few examples of creating tuples:


    | # Creating an empty tupleempty_tuple = ()# Creating a tuple with elementsmy_tuple
    = (1, 2, 3, 4, 5)# Creating a tuple with elements of different typesmixed_tuple
    = (1, "apple", 3.14, True)# Creating a single-element tuple (note the comma)single_element_tuple
    = (42,)# You can also create a tuple without parentheses (not recommended for
    readability)another_tuple = 1, 2, 3 |


    Tuples are commonly used for grouping data that belongs together, like coordinates,
    records from a database, or returning multiple values from a function. Because
    tuples are immutable, they provide a certain level of safety when dealing with
    data that should not be changed accidentally.


    Loop


    Looping through all values in a Python tuple is similar to looping through a list.
    You can use a for loop to iterate over each element in the tuple. Here''s how
    you can do it:


    | my_tuple = (1, 2, 3, 4, 5)# Loop through all values in the tuplefor value in
    my_tuple:print(value) |


    This loop iterates over each element in the my_tuple tuple and prints each value.


    Alternatively, you can also use indexing to loop through a tuple if you need access
    to the index:


    | my_tuple = (1, 2, 3, 4, 5)# Loop through all values in the tuple with indexfor
    index in range(len(my_tuple)):value = my_tuple[index]print(value) |


    However, using the first method with a for loop directly iterating over the tuple
    elements is generally more Pythonic and preferred.


    length


    In Python, you can use the len() function to get the length (number of elements)
    of a tuple. Here''s how you can use it:


    | my_tuple = (1, 2, 3, 4, 5)# Get the length of the tuplelength = len(my_tuple)print("Length
    of the tuple:", length) |


    Output:


    | Length of the tuple: 5 |


    The len() function returns the number of elements in the tuple, in this case,
    5\. This function can be used with tuples as well as other sequences like lists,
    strings, and dictionaries.


    max/min


    In Python, you can use the max() and min() functions to find the maximum and minimum
    elements, respectively, in a tuple. Here''s how you can use them:


    | my_tuple = (3, 7, 1, 9, 2, 6)# Find the maximum element in the tuplemaximum
    = max(my_tuple)print("Maximum element:", maximum)# Find the minimum element in
    the tupleminimum = min(my_tuple)print("Minimum element:", minimum) |


    Output:


    | Maximum element: 9Minimum element: 1 |


    Both max() and min() functions return the maximum and minimum elements of the
    tuple, respectively. These functions work similarly for other iterable data types
    like lists and strings as well.


    tuple to string


    To convert a tuple to a string in Python, you can use string manipulation techniques.
    One common approach is to use the join() method along with a string concatenation
    or formatting to convert the elements of the tuple into a string. Here''s how
    you can do it:


    Using join() method with string concatenation:


    | my_tuple = (1, 2, 3, 4, 5)# Convert tuple to stringtuple_string = '', ''.join(str(element)
    for element in my_tuple)print("Tuple as string:", tuple_string) |


