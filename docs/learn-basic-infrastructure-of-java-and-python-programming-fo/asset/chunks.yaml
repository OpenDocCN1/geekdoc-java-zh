  raw: '5    Specialization: Subclasses can specialize or customize the behavior of
    the superclass by adding new functionality or modifying existing functionality.
    This allows you to tailor classes to specific requirements while maintaining a
    consistent interface across related classes.


    Overall, inheritance is a powerful mechanism in object-oriented programming that
    promotes code reuse, modularity, and extensibility, making it easier to manage
    and maintain complex systems. However, it should be used judiciously to avoid
    creating overly complex class hierarchies and tight coupling between classes.


    Syntax


    In Python, creating inheritance between classes involves defining a new class
    that inherits from an existing class. Here''s the syntax to create inheritance
    in Python:


    | class BaseClass:# Attributes and methods of the base classclass DerivedClass(BaseClass):#
    Additional attributes and methods of the derived class |


    In the above syntax:


    *   BaseClass is the name of the existing class from which you want to inherit.


    *   DerivedClass is the name of the new class that you''re creating, which will
    inherit from BaseClass.


    *   DerivedClass is said to be a subclass of BaseClass, and BaseClass is said
    to be the superclass or parent class of DerivedClass.


    By inheriting from BaseClass, DerivedClass gains access to all the attributes
    and methods defined in BaseClass. Additionally, you can define new attributes
    and methods specific to DerivedClass within its own class definition.


    Here''s an example to illustrate inheritance in Python:


    | class Animal:def sound(self):print("Some generic sound")class Dog(Animal): 
    # Dog inherits from Animaldef sound(self):print("Woof")class Cat(Animal):  # Cat
    inherits from Animaldef sound(self):print("Meow")# Create instances of subclassesdog
    = Dog()cat = Cat()# Call methods from the superclass and subclassesdog.sound() 
    # Output: Woofcat.sound()  # Output: Meow |


    In this example, Dog and Cat are subclasses of Animal. They inherit the sound()
    method from Animal but provide their own implementation of the method. When you
    call sound() on instances of Dog and Cat, it prints the sound specific to each
    subclass.


    __init__()


    To define and use the __init__() method for a child class (subclass) in Python
    inheritance, you can override the __init__() method of the parent class (superclass).
    This allows you to customize the initialization process for instances of the child
    class while still leveraging the initialization logic of the parent class if needed.
    Here''s how you can do it:


    | class ParentClass:def __init__(self, parent_attribute):self.parent_attribute
    = parent_attributeprint("ParentClass initialized with:", self.parent_attribute)class
    ChildClass(ParentClass):def __init__(self, parent_attribute, child_attribute):#
    Call the __init__() method of the parent classsuper().__init__(parent_attribute)self.child_attribute
    = child_attributeprint("ChildClass initialized with:", self.child_attribute)#
    Create an instance of the child classchild_obj = ChildClass("Parent Data", "Child
    Data") |


    In the above example:


    *   ParentClass defines an __init__() method that initializes an attribute parent_attribute.


    *   ChildClass is a subclass of ParentClass and defines its own __init__() method.


    *   Inside ChildClass''s __init__() method, super().__init__(parent_attribute)
    calls the __init__() method of the parent class (ParentClass) to initialize the
    parent_attribute.


    *   After initializing the parent attribute, the __init__() method of ChildClass
    initializes its own attribute child_attribute.


    *   When you create an instance of ChildClass, both ParentClass''s and ChildClass''s
    __init__() methods are called, in the order defined in the inheritance hierarchy.


    This approach ensures that the initialization logic defined in the parent class
    is executed before the initialization logic of the child class, allowing for proper
    initialization of attributes in both classes.


    Overriding Methods


    In Python, you can override methods from the parent class in a child class by
    defining a method with the same name in the child class. When an instance of the
    child class calls the method, the overridden method in the child class will be
    executed instead of the method from the parent class. Here''s how you can override
    methods from the parent class in Python:


    | class ParentClass:def some_method(self):print("This is a method from ParentClass")class
    ChildClass(ParentClass):def some_method(self):print("This is an overridden method
    from ChildClass")# Create an instance of the child classchild_obj = ChildClass()#
    Call the overridden methodchild_obj.some_method()  # Output: This is an overridden
    method from ChildClass |


    In the above example:


    *   ParentClass defines a method called some_method().


    *   ChildClass is a subclass of ParentClass and defines its own version of the
    some_method() method.


    *   When you call some_method() on an instance of ChildClass, it calls the overridden
    method from ChildClass, not the method from ParentClass.


    This demonstrates how you can override methods from the parent class in Python.
    Overriding methods allows child classes to provide their own implementations of
    methods inherited from the parent class, providing flexibility and customization
    in object-oriented programming.


    4   Python Abstract Base Classes


    Introduction


    Abstract Base Classes (ABCs) in Python are classes that cannot be instantiated
    directly but are meant to be subclassed. They define a set of abstract methods
    that must be implemented by concrete subclasses. ABCs provide a way to define
    a common interface or behavior for a group of related classes while enforcing
    a contract that specifies which methods must be implemented by subclasses.


    To use Abstract Base Classes in Python, you need to import the abc module from
    the standard library, which provides the ABC class and other utilities for defining
    and working with abstract classes. Here''s how you can define and use Abstract
    Base Classes in Python:


    | from abc import ABC, abstractmethodclass Shape(ABC):@abstractmethoddef area(self):pass@abstractmethoddef
    perimeter(self):passclass Rectangle(Shape):def __init__(self, length, width):self.length
    = lengthself.width = widthdef area(self):return self.length * self.widthdef perimeter(self):return
    2 * (self.length + self.width)# Attempting to instantiate the Shape class directly
    will raise an error# shape = Shape()  # This will raise TypeError: Can''t instantiate
    abstract class Shape with abstract methods area, perimeter# Instantiate a subclass
    of Shaperectangle = Rectangle(5, 4)print("Area:", rectangle.area())  # Output:
    20print("Perimeter:", rectangle.perimeter())  # Output: 18 |


    In the above example:


    *   Shape is an abstract base class that defines two abstract methods: area()
    and perimeter().


    *   The abstractmethod decorator from the abc module is used to mark these methods
    as abstract, indicating that they must be implemented by concrete subclasses.


    *   Rectangle is a concrete subclass of Shape that implements both area() and
    perimeter() methods.


    *   You cannot instantiate the Shape class directly because it is abstract and
    contains abstract methods. Attempting to do so will raise a TypeError.


    *   You can instantiate Rectangle, which is a concrete subclass of Shape, and
    use its methods.


    Abstract Base Classes provide a way to define a common interface or behavior for
    a group of related classes, ensuring that subclasses implement the required methods.
    They are useful for enforcing contracts and promoting code clarity and maintainability
    in object-oriented programming.


