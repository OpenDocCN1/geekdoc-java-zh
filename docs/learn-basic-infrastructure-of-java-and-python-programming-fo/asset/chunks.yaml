    \ 'r') as file_handler:\n    content = file_handler.read()\nprint(content)\n```\n\
    \nIn this example, the file handler is automatically closed when the code block\
    \ exits, regardless of whether an exception occurs. Using a context manager helps\
    \ ensure that file resources are properly managed and avoids the need for explicit\
    \ calls to `close()`.\n\n# Append\n\nTo append data to a file using a file handler\
    \ in Python, you can open the file in append mode (`'a'`) and then use the file\
    \ handler's `write()` method to add the desired content to the end of the file.\
    \ Here's how you can do it:\n\n```python\n# Open the file in append mode and obtain\
    \ a file handler\nwith open('file.txt', 'a') as file_handler:\n    # Write data\
    \ to the file\n    file_handler.write('\\nNew data to be appended')\n```\n\nIn\
    \ this example:\n* We open the `file.txt` in append mode (`'a'`) using a context\
    \ manager (`with` statement), which automatically closes the file handler when\
    \ done.\n* Inside the context manager, we use the file handler's `write()` method\
    \ to append the string `'\\nNew data to be appended'` to the file. The `\\n` character\
    \ is used to add a new line before the appended data.\n\nAfter executing this\
    \ code, `file.txt` will contain the original contents followed by the new data\
    \ appended. It's worth noting that the file will be created if it does not exist.\
    \ If you want to append data to an existing file, ensure it's present in the specified\
    \ location.\n\n# Create\n\nTo create and write content to a file using a file\
    \ handler in Python, you can open the file in write mode (`'w'`) and then use\
    \ the file handler's `write()` method to add the content. Here's how you can do\
    \ it:\n\n```python\n# Open the file in write mode and obtain a file handler\n\
    with open('file.txt', 'w') as file_handler:\n    # Write data to the file\n  \
    \  file_handler.write('This is some content that we are writing.\\n')\n    file_handler.write('This\
    \ is another line of content.\\n')\n```\n\nIn this example:\n* We open the `file.txt`\
    \ in write mode (`'w'`) using a context manager (`with` statement), which automatically\
    \ closes the file handler when done.\n* Inside the context manager, we use the\
    \ file handler's `write()` method to write the desired content. Each call to `write()`\
    \ adds the specified string to the file.\n\nAfter executing this code, `file.txt`\
    \ will contain the content that we wrote. If the file already exists, its contents\
    \ will be overwritten. If you want to append content to an existing file or preserve\
    \ its current contents, you should use append mode (`'a'`) instead of write mode\
    \ (`'w'`).\n\n# File size\n\nYou can use the `os.path.getsize()` function from\
    \ the `os` module to get the size of a file in bytes. Here's how you can use it:\n\
    \n```python\nimport os\n# Get the size of the file\nfile_size = os.path.getsize('file.txt')\n\
    print(\"File size:\", file_size, \"bytes\")\n```\n\nIn this example:\n* We import\
    \ the `os` module.\n* We use the `os.path.getsize()` function, passing the path\
    \ to the file (`'file.txt'` in this case) as an argument.\n* The function returns\
    \ the size of the file in bytes, which we store in the variable `file_size`.\n\
    * We print the size of the file to the console.\n\nThis method allows you to quickly\
    \ retrieve the size of a file without needing to open it or read its contents.\n\
    \n# Move File\n\nTo move a file from one directory to another in Python, you can\
    \ use the `shutil.move()` function from the `shutil` module. Here's how you can\
    \ use it:\n\n```python\nimport shutil\n# Source and destination file paths\nsource_file\
    \ = 'source_directory/file.txt'\ndestination_file = 'destination_directory/file.txt'\n\
    # Move the file from the source directory to the destination\nshutil.move(source_file,\
    \ destination_file)\nprint(\"File moved successfully!\")\n```\n\nIn this example:\n\
    * We import the `shutil` module.\n* We define the paths of the source file (`source_file`)\
    \ and the destination file (`destination_file`).\n* We use the `shutil.move()`\
    \ function, passing the source file path and the destination file path as arguments.\n\
    * The function moves the file from the source directory to the destination directory.\n\
    * Finally, we print a message to indicate that the file has been moved.\n\nMake\
    \ sure to replace `'source_directory/file.txt'` and `'destination_directory/file.txt'`\
    \ with the actual paths of the source and destination directories respectively,\
    \ as well as the filenames you want to move.\n\n# Delete File\n\nTo delete a file\
    \ in Python, you can use the `os.remove()` function from the `os` module. Here's\
    \ how you can use it:\n\n```python\nimport os\n# File path\nfile_path = 'file_to_delete.txt'\n\
    # Check if the file exists before attempting to delete it\nif os.path.exists(file_path):\n\
    \    # Delete the file\n    os.remove(file_path)\n    print(\"File deleted successfully!\"\
    )\nelse:\n    print(\"File does not exist.\")\n```\n\nIn this example:\n* We import\
    \ the `os` module.\n* We define the path of the file we want to delete (`file_path`).\n\
    * We use the `os.path.exists()` function to check if the file exists before attempting\
    \ to delete it.\n* If the file exists, we use the `os.remove()` function, passing\
    \ the file path as an argument, to delete the file.\n* If the file does not exist,\
    \ we print a message indicating that the file does not exist.\n\nMake sure to\
    \ replace `'file_to_delete.txt'` with the actual path of the file you want to\
    \ delete.\n\n# Python Python Text File\n\n## Read\n\nTo read from a file in Python,\
    \ you can use the `open()` function to open the file and obtain a file handler,\
    \ and then use methods like `read()`, `readline()`, or `readlines()` to read the\
    \ content from the file. Here's how you can do it:\n\n### 1. Reading the entire\
    \ contents of a file at once using `read()`\n\n```python\n# Open the file in read\
    \ mode and obtain a file handler\nwith open('file.txt', 'r') as file_handler:\n\
    \    # Read the entire contents of the file\n    content = file_handler.read()\n\
    print(content)\n```\n\n### 2. Reading one line at a time using `readline()`\n\n\
    ```python\n# Open the file in read mode and obtain a file handler\nwith open('file.txt',\
    \ 'r') as file_handler:\n    # Read one line at a time\n    line = file_handler.readline()\n\
    \    while line:\n        print(line, end='')  # end='' to avoid adding extra\
    \ newlines\n        line = file_handler.readline()\n```\n\n### 3. Reading all\
    \ lines into a list using `readlines()`\n\n```python\n# Open the file in read\
    \ mode and obtain a file handler\nwith open('file.txt', 'r') as file_handler:\n\
    \    # Read all lines into a list\n    lines = file_handler.readlines()\n    for\
    \ line in lines:\n        print(line, end='')  # end='' to avoid adding extra\
    \ newlines\n```\n\nIn each example:\n* We use the `open()` function with the file\
    \ name `'file.txt'` and the mode `'r'` to open the file in read mode.\n* We use\
    \ a context manager (`with` statement) to automatically close the file handler\
    \ after it's opened.\n* We use one of the file handler's methods (`read()`, `readline()`,\
    \ or `readlines()`) to read the content from the file.\n* We print the content\
    \ to the console.\n\nChoose the appropriate method based on your specific requirements.\
    \ If you want to process the entire content of the file at once, use `read()`.\
    \ If you want to process the file line by line, use `readline()`. If you want\
    \ to store all lines in a list, use `readlines()`.\n\n## Path\n\nIn Python, you\
    \ can obtain both relative and absolute file paths using various methods. Here\
    \ are some common approaches:\n\n### 1. Using the `os.path` Module\n\n* The `os.path.abspath()`\
    \ function returns the absolute path of a file.\n* The `os.path.relpath()` function\
    \ returns the relative path of a file from a specified directory (or the current\
    \ working directory if not specified).\n\n```python\nimport os\n# Absolute path\n\
    absolute_path = os.path.abspath('file.txt')\nprint(\"Absolute path:\", absolute_path)\n\
    # Relative path from the current working directory\nrelative_path = os.path.relpath('file.txt')\n\
    print(\"Relative path:\", relative_path)\n```\n\n### 2. Using the `pathlib` Module\
    \ (Python 3.4 and later)\n\n* The `pathlib.Path.resolve()` method returns the\
    \ absolute path of a file.\n* The `pathlib.Path.relative_to()` method returns\
    \ the relative path of a file from a specified directory.\n"
