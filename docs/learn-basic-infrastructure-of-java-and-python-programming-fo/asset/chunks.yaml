    ```\n\n**输出**\n```\nContinue example\n----------------------\nx = 2\nx after ++\
    \ = 3\n----------------------\nx = 3\n----------------------\nx = 4\nx after ++\
    \ = 5\n----------------------\nx = 5\nx after ++ = 6\n----------------------\n\
    x = 6\nDone!\n```\n\n### 8 标签循环\n\n`break` 和 `continue` 语句可以在带有标签的循环中使用。当你有嵌套循环并且想要跳出或继续外部循环而不是内部循环时，这非常有用。\n\
    \n```java\nlabel1: for (int i = 0; i < 5; i++) {\n    label2: for (int j = 0;\
