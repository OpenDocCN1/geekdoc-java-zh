    4    The Utility methods for One-Dimensional Array


    The Java provides you with some static methods for arrays, such as sorting arrays,
    assigning values to all array elements, searching, comparing arrays, etc. These
    methods are defined in the Arrays class.


    Below are some really useful, static methods defined in the Arrays class. These
    methods apply to the arrays of elements with byte, char, double, float, long,
    int, short, boolean types.


    | // Pass parameters of the same type, and returns a List.public static <T> List<T>
    asList(T... a)// Type X can be: byte, char, double, float, long, int, short, boolean----------------------//
