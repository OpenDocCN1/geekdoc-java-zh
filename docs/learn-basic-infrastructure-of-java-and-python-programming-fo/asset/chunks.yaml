    \ concatenation:\n\n```python\nmy_tuple = (1, 2, 3, 4, 5)\n# Convert tuple to\
    \ string\ntuple_string = ', '.join(str(element) for element in my_tuple)\nprint(\"\
    Tuple as string:\", tuple_string)\n```\n"
