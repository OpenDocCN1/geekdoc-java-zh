    1    Loops in Java


    In computer programming, a loop is used regularly, and the purpose is to execute
    a program snippet several times. The Java supports 3 different kinds of loops:


    for loop


    while loop


    do-while loop


    The for loop has 2 variants:


    Common for loop.


    For-each loop (Introduced from Java 5 version ).


    Statements can be used in a loop:


    break


    continue.


