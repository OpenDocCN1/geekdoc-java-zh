    ABC subclass


    Subclassing an Abstract Base Class (ABC) in Python involves creating a new class
    that inherits from the ABC and provides concrete implementations for its abstract
    methods. This allows you to define a common interface or behavior specified by
    the ABC and ensure that subclasses adhere to this interface by implementing the
    required methods. Here''s how you can subclass an ABC and use it in Python:


    1    Defining an ABC: First, you define an abstract base class by subclassing
    ABC from the abc module and using the @abstractmethod decorator to mark methods
    as abstract.


    2    Creating concrete subclasses: Then, you create concrete subclasses that inherit
    from the ABC and provide implementations for its abstract methods.


    3    Using the subclasses: Finally, you can instantiate and use the concrete subclasses,
    which now adhere to the interface defined by the ABC.


    Here''s an example illustrating subclassing an ABC in Python:


    | from abc import ABC, abstractmethodclass Shape(ABC):@abstractmethoddef area(self):pass@abstractmethoddef
    perimeter(self):passclass Rectangle(Shape):def __init__(self, length, width):self.length
    = lengthself.width = widthdef area(self):return self.length * self.widthdef perimeter(self):return
    2 * (self.length + self.width)class Circle(Shape):def __init__(self, radius):self.radius
    = radiusdef area(self):return 3.14 * self.radius ** 2def perimeter(self):return
    2 * 3.14 * self.radius# Create instances of concrete subclassesrectangle = Rectangle(5,
    4)circle = Circle(3)# Use the concrete subclassesprint("Rectangle Area:", rectangle.area()) 
    # Output: 20print("Rectangle Perimeter:", rectangle.perimeter())  # Output: 18print("Circle
    Area:", circle.area())  # Output: 28.26print("Circle Circumference:", circle.perimeter()) 
    # Output: 18.84 |


    In this example:


    *   Shape is an abstract base class (ABC) that defines two abstract methods: area()
    and perimeter().


    *   Rectangle and Circle are concrete subclasses of Shape that provide implementations
    for the abstract methods.


    *   Both subclasses adhere to the interface defined by the Shape ABC, ensuring
    that they provide area() and perimeter() methods.


    *   You can instantiate and use instances of the concrete subclasses, which now
    have well-defined behavior specified by the ABC.


    5   Python Operator Overloading


    Introduction


    Operator overloading in Python refers to the ability to redefine the behavior
    of built-in operators (+, -, *, /, etc.) for user-defined objects. By overloading
    operators, you can customize how objects of a class behave when operated with
    built-in operators, allowing for more natural and intuitive syntax.


    To use operator overloading in Python, you need to define special methods, also
    known as magic methods or dunder methods (due to their double underscore prefix
    and suffix), that correspond to the operators you want to overload. These special
    methods are automatically called when the corresponding operator is used with
    objects of your class.


    Here''s an example of how to use operator overloading in Python:


    | class Point:def __init__(self, x, y):self.x = xself.y = ydef __add__(self, other):return
    Point(self.x + other.x, self.y + other.y)def __sub__(self, other):return Point(self.x
    - other.x, self.y - other.y)def __mul__(self, scalar):return Point(self.x * scalar,
    self.y * scalar)def __str__(self):return f"({self.x}, {self.y})"# Create two Point
    objectsp1 = Point(1, 2)p2 = Point(3, 4)# Use the overloaded operatorsprint("Addition:",
    p1 + p2)  # Output: (4, 6)print("Subtraction:", p1 - p2)  # Output: (-2, -2)print("Scalar
    multiplication:", p1 * 2)  # Output: (2, 4) |


    In this example:


    *   We define a Point class to represent 2D points with x and y coordinates.


    *   We overload the +, -, and * operators by defining special methods __add__,
    __sub__, and __mul__, respectively.


    *   When we use the +, -, and * operators with Point objects, Python automatically
    calls the corresponding special methods.


    *   We also define a __str__ method to customize the string representation of
    Point objects when using print().


    Operator overloading allows you to write more expressive and concise code by providing
    natural syntax for operations on user-defined objects. It''s a powerful feature
    of Python''s object-oriented programming model that enables customization of behavior
    to suit the needs of your classes.


    Addition


    To overload the addition operator (+) for numerical operations in Python, you
    need to define the special method __add__() within your class. This method will
    be automatically called when the addition operator is used with instances of your
    class. Here''s how to overload the addition operator for numerical operations
    in Python:


    | class Number:def __init__(self, value):self.value = valuedef __add__(self, other):#
    Check if ''other'' is an instance of Numberif isinstance(other, Number):# If ''other''
    is an instance of Number, perform additionreturn Number(self.value + other.value)else:#
    If ''other'' is not an instance of Number, raise TypeErrorraise TypeError("Unsupported
    operand type(s) for +: ''{}'' and ''{}''".format(type(self).__name__, type(other).__name__))def
    __str__(self):return str(self.value)# Create instances of Numbernum1 = Number(5)num2
    = Number(10)# Use the overloaded addition operatorresult = num1 + num2print("Result:",
    result)  # Output: 15 |


    In this example:


    *   We define a Number class that represents a numerical value.


    *   We define the __add__() special method, which will be called when the addition
    operator (+) is used with instances of the Number class.


    *   Inside the __add__() method, we check if the other operand is an instance
    of the Number class. If it is, we perform the addition of the values and return
    a new Number object with the result.'
