    \ 10);\n    }\n}\n```\n\n**输出**\n```\nValue = 3\nValue = 6\nValue = 9\n```\n\n\
    ### 6 循环中的 break 语句\n\n`break` 语句可以出现在循环中。它是帮助程序退出循环的语句。\n\n![](img/image_rsrc6ZS.jpg)\n\
    \nLoopBreakExample.java\n```java\npackage com.abd.java.javabasic.loop;\npublic\
