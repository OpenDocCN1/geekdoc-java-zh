    6   Python Dictionary


    Introduction


    A Python dictionary is an unordered collection of key-value pairs. Each key in
    a dictionary is unique and immutable, and it maps to a corresponding value. You
    can think of a dictionary like a real-world dictionary, where each word (key)
    has a definition (value).


    You can create a dictionary in Python using curly braces {} and specifying key-value
    pairs separated by colons :. Here''s how you can create a dictionary:


    | # Creating an empty dictionaryempty_dict = {}# Creating a dictionary with key-value
    pairsmy_dict = {''name'': ''John'', ''age'': 30, ''city'': ''New York''}# Creating
    a dictionary using the dict() constructoranother_dict = dict(name=''Alice'', age=25,
    city=''Los Angeles'') |


    In the examples above:


    *   empty_dict is an empty dictionary.


    *   my_dict contains three key-value pairs: ''name'': ''John'', ''age'': 30, and
    ''city'': ''New York''.


    *   another_dict is created using the dict() constructor, where keys and values
    are specified as keyword arguments.


    You can access, modify, add, or remove elements from a dictionary using its keys.
    Dictionaries are widely used for storing and retrieving data efficiently, especially
    when you need to access values by their associated keys.


    Loop Pairs


    You can loop through all key-value pairs in a Python dictionary using a for loop.
    Python dictionaries provide several methods to access keys, values, or both. Here''s
    how you can loop through all key-value pairs in a dictionary:


    | my_dict = {''name'': ''John'', ''age'': 30, ''city'': ''New York''}# Loop through
    all key-value pairsfor key, value in my_dict.items():print(key, ''='', value)
    |


    In this example, my_dict.items() returns a view object that provides a dynamic
    view of the dictionary''s key-value pairs. The for loop iterates over each key-value
    pair, and key and value are assigned to each key-value pair respectively. Inside
    the loop, you can access both the key and value of each pair and perform any desired
    operations.


    Output:


    | name = Johnage = 30city = New York |


    Using .items() is the most common and efficient way to loop through all key-value
    pairs in a dictionary in Python.


    Access


    You can access values in a Python dictionary using the keys as indices. Here are
    a few methods to access values in a dictionary:


    1    Using square brackets []:


    | my_dict = {''name'': ''John'', ''age'': 30, ''city'': ''New York''}# Accessing
    values using keysname = my_dict[''name'']age = my_dict[''age'']city = my_dict[''city'']print("Name:",
    name)print("Age:", age)print("City:", city) |


    2    Using the get() method:


    | my_dict = {''name'': ''John'', ''age'': 30, ''city'': ''New York''}# Accessing
    values using get() methodname = my_dict.get(''name'')age = my_dict.get(''age'')city
    = my_dict.get(''city'')print("Name:", name)print("Age:", age)print("City:", city)
    |


    Both methods will output:


    | Name: JohnAge: 30City: New York |


    In both examples, we access the values in the dictionary my_dict using the keys
    ''name'', ''age'', and ''city''. Using square brackets is straightforward and
    raises a KeyError if the key is not found in the dictionary. Using the get() method
    allows you to provide a default value if the key is not found, which can help
    avoid KeyError exceptions.


