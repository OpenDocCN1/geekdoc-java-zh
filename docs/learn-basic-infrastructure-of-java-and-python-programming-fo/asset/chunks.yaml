- fmt: "\n### 3. Code Reusability\nBy defining classes and using inheritance, you\
    \ can reuse code across different parts of your program. This promotes code organization,\
    \ reduces redundancy, and makes it easier to manage complex systems.\n\n### 4.\
    \ Polymorphism\nClasses support polymorphism, which allows different objects to\
    \ be treated as instances of the same class, even if they are of different types.\
    \ This promotes flexibility and makes it easier to work with heterogeneous collections\
    \ of objects.\n\nIn summary, Python classes are essential for building modular,\
    \ maintainable, and scalable software. They provide a way to structure code, encapsulate\
    \ data and behavior, promote code reuse, and model real-world entities in a flexible\
    \ and understandable manner.\n\n### `__init__()`\nIn Python, `__init__()` is a\
    \ special method (also known as a constructor) that is automatically called when\
    \ a new instance of a class is created. It is used to initialize the attributes\
    \ of the newly created object. The `__init__` method is optional, but it is commonly\
    \ used to set up the initial state of an object.\n\nHere's the syntax for defining\
    \ the `__init__` method within a class:\n\n```python\nclass ClassName:\n    def\
    \ __init__(self, parameter1, parameter2, ...):\n        # Initialization code\
    \ here\n```\n\nIn the `__init__` method:\n* `self`: The first parameter of the\
    \ `__init__` method is always `self`, which refers to the current instance of\
    \ the class. It is used to access the attributes and methods of the instance within\
    \ the class.\n* `parameter1`, `parameter2`, ...: These are the parameters that\
    \ you want to pass when creating an instance of the class. You can define any\
    \ number of parameters here, depending on the initialization requirements of your\
    \ class.\n\nHere's an example to illustrate the usage of the `__init__` method:\n\
    \n```python\nclass Person:\n    def __init__(self, name, age):\n        self.name\
    \ = name\n        self.age = age\n\n# Creating instances of the Person class\n\
    person1 = Person(\"Alice\", 30)\nperson2 = Person(\"Bob\", 25)\n\n# Accessing\
    \ attributes of the instances\nprint(person1.name)  # Output: Alice\nprint(person1.age)\
    \   # Output: 30\nprint(person2.name)  # Output: Bob\nprint(person2.age)   # Output:\
    \ 25\n```\n\nIn this example, the `__init__` method initializes the `name` and\
    \ `age` attributes of each `Person` object when it is created. When you create\
    \ a new `Person` object (`person1` and `person2`), you provide values for `name`\
    \ and `age`, which are then assigned to the corresponding attributes of the object.\n\
    \n### Instance\nTo make an instance from a Python class, you need to follow these\
    \ steps:\n1. **Define the class**: Define the blueprint for the objects you want\
    \ to create by writing a class definition.\n2. **Instantiate the class**: Use\
    \ the class name followed by parentheses `()` to create an instance of the class.\n\
    \nHere's a simple example:\n\n```python\n# Define the class\nclass MyClass:\n\
    \    def __init__(self, parameter1, parameter2):\n        self.parameter1 = parameter1\n\
    \        self.parameter2 = parameter2\n\n# Instantiate the class\nmy_instance\
    \ = MyClass(value1, value2)\n```\n\nLet's break down this example:\n* We define\
    \ a class named `MyClass`.\n* Inside the class, there is an `__init__` method\
    \ that initializes the instance attributes (`parameter1` and `parameter2`) with\
    \ the values passed as arguments.\n* We then create an instance of `MyClass` by\
    \ calling `MyClass(value1, value2)`. This invokes the `__init__` method with the\
    \ specified values for `parameter1` and `parameter2`, creating a new instance\
    \ of the class.\n* The newly created instance is assigned to the variable `my_instance`.\n\
    \nNow, you can use `my_instance` to access the attributes and methods of the `MyClass`\
    \ object:\n\n```python\nprint(my_instance.parameter1)\nprint(my_instance.parameter2)\n\
    ```\n\nReplace `value1` and `value2` with the values you want to initialize the\
    \ instance with. This is how you make an instance from a Python class.\n\n###\
    \ Attributes\nTo access an attribute from a Python class, you use dot notation\
    \ (`.`) followed by the attribute name. Here's how you do it:\n1. First, you need\
    \ to create an instance of the class.\n2. Then, you can use dot notation to access\
    \ the attributes of that instance.\n\nHere's an example:\n\n```python\nclass MyClass:\n\
    \    def __init__(self, attribute):\n        self.attribute = attribute\n\n# Create\
    \ an instance of MyClass\nmy_instance = MyClass(\"value\")\n\n# Access the attribute\
    \ using dot notation\nprint(my_instance.attribute)\n```\n\nIn this example:\n\
    * We define a class named `MyClass` with an `__init__` method that initializes\
    \ an attribute (`self.attribute`) with the value passed as an argument.\n* We\
    \ create an instance of `MyClass` called `my_instance` and pass the value `\"\
    value\"` to the constructor.\n* We then use dot notation (`my_instance.attribute`)\
    \ to access the value of the attribute `attribute` of the `my_instance` object.\n\
    \nThis will print `\"value\"`, which is the value assigned to the attribute `attribute`\
    \ of the `my_instance` object.\n\n### Calling Methods\nTo call methods defined\
    \ in a Python class, you follow these steps:\n1. Create an instance of the class.\n\
    2. Use dot notation (`.`) followed by the method name to call the method on that\
    \ instance.\n\nHere's a simple example:\n\n```python\nclass MyClass:\n    def\
    \ __init__(self, attribute):\n        self.attribute = attribute\n    def my_method(self):\n\
    \        print(\"Hello from my_method!\")\n\n# Create an instance of MyClass\n\
    my_instance = MyClass(\"value\")\n\n# Call the method using dot notation\nmy_instance.my_method()\n\
    ```\n\nIn this example:\n* We define a class named `MyClass` with an `__init__`\
    \ method that initializes an attribute (`self.attribute`) with the value passed\
    \ as an argument, and a `my_method` method.\n* We create an instance of `MyClass`\
    \ called `my_instance` and pass the value `\"value\"` to the constructor.\n* We\
    \ then call `my_method()` using dot notation.\n\nThis will print `\"Hello from\
    \ my_method!\"`, indicating that the method has been called successfully on the\
    \ instance.\n\n### 3. Python class Inheritance\n\n#### Introduction\nClass inheritance\
    \ in Python allows a class (subclass) to inherit attributes and methods from another\
    \ class (superclass). This means that the subclass can access and use the attributes\
    \ and methods of the superclass without redefining them. Inheritance creates a\
    \ parent-child relationship between classes, where the subclass inherits the characteristics\
    \ of the superclass and can also have its own attributes and methods.\n\nSyntax\
    \ for Class Inheritance:\n\n```python\nclass Superclass:\n    # Attributes and\
    \ methods\n\nclass Subclass(Superclass):\n    # Additional attributes and methods\n\
    ```\n\nIn the above syntax:\n* `Subclass` is the subclass that inherits from `Superclass`.\n\
    * `Subclass` can access all attributes and methods of `Superclass` and can define\
    \ its own additional attributes and methods.\n\n#### When and Why Do We Need Inheritance\n\
    1. **Code Reusability**: Inheritance allows you to reuse code by defining common\
    \ attributes and methods in a superclass. Subclasses can then inherit these common\
    \ characteristics without having to redefine them, reducing code duplication.\n\
    2. **Modularity and Extensibility**: Inheritance promotes modularity by organizing\
    \ code into logical hierarchies. Subclasses can extend the functionality of the\
    \ superclass by adding new methods or overriding existing ones, thus providing\
    \ flexibility and extensibility to the codebase.\n3. **Abstraction and Encapsulation**:\
    \ Inheritance helps in creating abstract classes that define a common interface\
    \ or behavior for a group of related classes. It allows you to encapsulate common\
    \ functionality in the superclass, making the code more manageable and understandable.\n\
    4. **Polymorphism**: Inheritance facilitates polymorphism, which allows objects\
    \ of different classes to be treated uniformly based on their common superclass.\
    \ This enables you to write code that operates on objects of the superclass type\
    \ but can also handle objects of the subclass type, providing flexibility and\
    \ code reuse.\n"
  raw: '3   Code Reusability: By defining classes and using inheritance, you can reuse
    code across different parts of your program. This promotes code organization,
    reduces redundancy, and makes it easier to manage complex systems.


    4    Polymorphism: Classes support polymorphism, which allows different objects
    to be treated as instances of the same class, even if they are of different types.
    This promotes flexibility and makes it easier to work with heterogeneous collections
    of objects.


    In summary, Python classes are essential for building modular, maintainable, and
    scalable software. They provide a way to structure code, encapsulate data and
    behavior, promote code reuse, and model real-world entities in a flexible and
    understandable manner.


    __init__()


    In Python, __init__() is a special method (also known as a constructor) that is
    automatically called when a new instance of a class is created. It is used to
    initialize the attributes of the newly created object. The __init__() method is
    optional, but it is commonly used to set up the initial state of an object.


    Here''s the syntax for defining the __init__() method within a class:


    | class ClassName:def __init__(self, parameter1, parameter2, ...):# Initialization
    code here |


    In the __init__() method:


    *   self: The first parameter of the __init__() method is always self, which refers
    to the current instance of the class. It is used to access the attributes and
    methods of the instance within the class.


    *   parameter1, parameter2, ...: These are the parameters that you want to pass
    when creating an instance of the class. You can define any number of parameters
    here, depending on the initialization requirements of your class.


    Here''s an example to illustrate the usage of the __init__() method:


    | class Person:def __init__(self, name, age):self.name = nameself.age = age# Creating
    instances of the Person classperson1 = Person("Alice", 30)person2 = Person("Bob",
    25)# Accessing attributes of the instancesprint(person1.name)  # Output: Aliceprint(person1.age)   #
    Output: 30print(person2.name)  # Output: Bobprint(person2.age)   # Output: 25
    |


    In this example, the __init__() method initializes the name and age attributes
    of each Person object when it is created. When you create a new Person object
    (person1 and person2), you provide values for name and age, which are then assigned
    to the corresponding attributes of the object.


    Instance


    To make an instance from a Python class, you need to follow these steps:


    1    Define the class: Define the blueprint for the objects you want to create
    by writing a class definition.


    2    Instantiate the class: Use the class name followed by parentheses () to create
    an instance of the class.


    Here''s a simple example:


    | # Define the classclass MyClass:def __init__(self, parameter1, parameter2):self.parameter1
    = parameter1self.parameter2 = parameter2# Instantiate the classmy_instance = MyClass(value1,
    value2) |


    Let''s break down this example:


    *   We define a class named MyClass.


    *   Inside the class, there is an __init__() method that initializes the instance
    attributes (parameter1 and parameter2) with the values passed as arguments.


    *   We then create an instance of MyClass by calling MyClass(value1, value2).
    This invokes the __init__() method with the specified values for parameter1 and
    parameter2, creating a new instance of the class.


    *   The newly created instance is assigned to the variable my_instance.


    Now, you can use my_instance to access the attributes and methods of the MyClass
    object:


    | print(my_instance.parameter1)print(my_instance.parameter2) |


    Replace value1 and value2 with the values you want to initialize the instance
    with. This is how you make an instance from a Python class.


    Attributes


    To access an attribute from a Python class, you use dot notation (.) followed
    by the attribute name. Here''s how you do it:


    1    First, you need to create an instance of the class.


    2   Then, you can use dot notation to access the attributes of


    that instance.


    Here''s an example:


    | class MyClass:def __init__(self, attribute):self.attribute = attribute# Create
    an instance of MyClassmy_instance = MyClass("value")# Access the attribute using
    dot notationprint(my_instance.attribute) |


    In this example:


    *   We define a class named MyClass with an __init__() method that initializes
    an attribute (self.attribute) with the value passed as an argument.


    *   We create an instance of MyClass called my_instance and pass the value "value"
    to the constructor.


    *   We then use dot notation (my_instance.attribute) to access the value of the
    attribute attribute of the my_instance object.


    This will print "value", which is the value assigned to the attribute attribute
    of the my_instance object.


    Calling Methods


    To call methods defined in a Python class, you follow these steps:


    1    Create an instance of the class.


    2    Use dot notation (.) followed by the method name to call the method on that
    instance.


    Here''s a simple example:


    | class MyClass:def __init__(self, attribute):self.attribute = attributedef my_method(self):print("Hello
    from my_method!")# Create an instance of MyClassmy_instance = MyClass("value")#
    Call the method using dot notationmy_instance.my_method() |


    In this example:


    *   We define a class named MyClass with an __init__() method that initializes
    an attribute (self.attribute) with the value passed as an argument, and a my_method()
    method.


    *   We create an instance of MyClass called my_instance and pass the value "value"
    to the constructor.


    *   We then call the my_method() method on the my_instance object using dot notation
    (my_instance.my_method()).


    This will print "Hello from my_method!", indicating that the method has been called
    successfully on the instance of the class.


    3   Python class Inheritance


    Introduction


    Class inheritance in Python allows a class (subclass) to inherit attributes and
    methods from another class (superclass). This means that the subclass can access
    and use the attributes and methods of the superclass without redefining them.
    Inheritance creates a parent-child relationship between classes, where the subclass
    inherits the characteristics of the superclass and can also have its own additional
    attributes and methods.


    Syntax for Class Inheritance:


    | class Superclass:# Attributes and methodsclass Subclass(Superclass):# Additional
    attributes and methods |


    In the above syntax:


    *   Subclass is the subclass that inherits from Superclass.


    *   Subclass can access all attributes and methods of Superclass and can also
    define its own additional attributes and methods.


    When and Why Do We Need Inheritance


    1    Code Reusability: Inheritance allows you to reuse code by defining common
    attributes and methods in a superclass. Subclasses can then inherit these common
    characteristics without having to redefine them, reducing code duplication.


    2    Modularity and Extensibility: Inheritance promotes modularity by organizing
    code into logical hierarchies. Subclasses can extend the functionality of the
    superclass by adding new methods or overriding existing ones, thus providing flexibility
    and extensibility to the codebase.


    3    Abstraction and Encapsulation: Inheritance helps in creating abstract classes
    that define a common interface or behavior for a group of related classes. It
    allows you to encapsulate common functionality in the superclass, making the code
    more manageable and understandable.


    4    Polymorphism: Inheritance facilitates polymorphism, which allows objects
    of different classes to be treated uniformly based on their common superclass.
    This enables you to write code that operates on objects of the superclass type
    but can also handle objects of the subclass type, providing flexibility and code
    reuse.'
