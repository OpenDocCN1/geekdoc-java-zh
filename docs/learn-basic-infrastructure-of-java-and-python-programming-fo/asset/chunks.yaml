    Chapter 5 :


    Functions


    1   Python function


    Introduction


    In Python, a function is a block of reusable code that performs a specific task.
    Functions provide a way to organize code into manageable pieces, improve code
    reusability, and make the code more readable.


    Here''s the syntax to define and use a function in Python:


    1    Defining a function:


    | def function_name(parameter1, parameter2, ...):# Function body# Code to perform
    the taskreturn result |


    *   def keyword is used to define a function.


    *   function_name is the name of the function.


    *   (parameter1, parameter2, ...) is the list of parameters (if any) that the
    function accepts. Parameters are optional.


    *   : colon indicates the beginning of the function body.


    *   The function body consists of the code that performs the task.


    *   return result statement (optional) is used to return a value from the function.
    If there''s no return statement, the function returns None by default.


    2    Using a function:


    | result = function_name(argument1, argument2, ...) |


    *   function_name is the name of the function to call.


    *   (argument1, argument2, ...) is the list of arguments (if any) to pass to the
    function. Arguments are optional.


    *   The function is called with the specified arguments, and the result (if any)
    is stored in the result variable.


    Here''s an example of defining and using a simple function in Python:


    | # Function definitiondef add_numbers(x, y):# Function body: adds two numbersresult
    = x + yreturn result# Using the functionsum_result = add_numbers(3, 5)print("Sum:",
    sum_result)  # Output: Sum: 8 |


    In this example:


    *   We define a function add_numbers that takes two parameters x and y, adds them
    together, and returns the result.


    *   We call the function add_numbers with arguments 3 and 5, and store the result
    in the variable sum_result.


    *   We print the result to the console.


    Parameters


    In Python, function parameters are variables that are specified in the function
    definition and are used to pass values to the function when it is called. Parameters
    allow functions to accept input values and perform operations on them.


    Here''s the syntax to define and use parameters in Python functions:


    1    Defining parameters:


    | def function_name(parameter1, parameter2, ...):# Function body# Code that uses
    parameter1, parameter2, ... |


    *   def keyword is used to define a function.


    *   function_name is the name of the function.


    *   (parameter1, parameter2, ...) is the list of parameters that the function
    accepts. Parameters are optional.


    *   Each parameter in the list is a variable that holds the value passed to the
    function.


    *   Parameters are separated by commas.


    2    Using parameters:


    | result = function_name(argument1, argument2, ...) |


    *   function_name is the name of the function to call.


    *   (argument1, argument2, ...) is the list of arguments that are passed to the
    function. Arguments are optional.


    *   Arguments are the actual values that are passed to the function when it is
    called.


    *   The function uses these arguments to perform its task.


    Here''s an example demonstrating the usage of parameters in Python functions:


    | # Function definition with parametersdef greet(name):# Function body: greets
    the user with the provided nameprint("Hello,", name, "!")# Using the function
    with an argumentgreet("Alice")  # Output: Hello, Alice! |


    In this example:


    *   We define a function greet that takes a single parameter name.


    *   When the function is called with the argument "Alice", the value "Alice" is
    passed to the parameter name.


    *   Inside the function, the parameter name holds the value "Alice", and the function
    prints "Hello, Alice!" to the console.


    Keyword Parameters


    Keyword parameters (also known as keyword arguments) in Python are parameters
    that are passed to a function by specifying their corresponding parameter names
    along with the values. Keyword parameters allow you to provide arguments to a
    function in any order, making the function call more readable and flexible.


    Here''s the syntax to define and use keyword parameters in Python functions:


    1    Defining keyword parameters:


    | def function_name(param1=default_value1, param2=default_value2, ...):# Function
    body# Code that uses param1, param2, ... |


    *   def keyword is used to define a function.


    *   function_name is the name of the function.


    *   (param1=default_value1, param2=default_value2, ...) is the list of parameters
    with their default values (if any). Keyword parameters are optional.


    *   Each parameter in the list is defined with its default value using the syntax
    param=default_value.


    *   Default values are used if no value is provided for the corresponding parameter
    during the function call.


    2    Using keyword parameters:


    | result = function_name(param1=value1, param2=value2, ...) |


    *   function_name is the name of the function to call.


    *   param1=value1, param2=value2, etc., are the keyword arguments passed to the
    function.


    *   Each keyword argument consists of the parameter name followed by the value
    assigned to it.


    *   Keyword arguments can be provided in any order.


    Here''s an example demonstrating the usage of keyword parameters in Python functions:


    | # Function definition with keyword parametersdef greet(name, message="Hello"):#
    Function body: greets the user with the provided name and messageprint(message,
    name, "!")# Using the function with keyword argumentsgreet(message="Hi", name="Bob") 
    # Output: Hi Bob! |


    In this example:


    *   We define a function greet that takes two parameters: name and message.


    *   The parameter message has a default value "Hello".


    *   When the function is called with keyword arguments message="Hi" and name="Bob",
    these arguments are passed to the corresponding parameters.


    *   The function uses the provided values to print the greeting message "Hi Bob!"
    to the console.


    Default value


    In Python, you can add default values to function parameters by specifying the
    default values directly in the function definition. Here''s the syntax to add
    default values to function parameters:


    | def function_name(param1=default_value1, param2=default_value2, ...):# Function
    body# Code that uses param1, param2, ... |


    In this syntax:


    *   param1=default_value1, param2=default_value2, etc., are the parameters with
    their corresponding default values.'
