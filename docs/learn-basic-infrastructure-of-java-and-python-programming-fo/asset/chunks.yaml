    \n#### 1. 使用 % 运算符\n你可以使用 `%` 运算符将变量插入字符串中。与 f-strings 和 `str.format()` 等新方法相比，这种方法较旧且不再推荐。\n\
    \n```python\nname = \"Alice\"\nage = 30\ngreeting = \"Hello, %s! You are %d years\
