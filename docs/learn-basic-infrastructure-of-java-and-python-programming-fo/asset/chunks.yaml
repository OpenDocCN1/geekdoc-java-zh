    3   Python Exceptions


    Introduction


    An exception in Python is an event that occurs during the execution of a program
    that disrupts the normal flow of the program''s instructions. When an exceptional
    condition arises, such as an error or unexpected behavior, Python raises an exception
    to handle the situation.


    Exceptions are used to manage errors and unexpected situations in Python programs.
    They provide a mechanism for handling errors gracefully and preventing program
    crashes. Instead of abruptly terminating the program when an error occurs, exceptions
    allow you to handle errors in a controlled manner, such as by displaying an error
    message, logging the error, or taking corrective action.


    You should use exceptions in Python to:


    1    Handle errors: Exceptions allow you to detect and handle errors that occur
    during the execution of your program. This helps prevent program crashes and provides
    a way to gracefully recover from errors.


    2    Provide feedback to users: Exceptions allow you to provide informative error
    messages to users, helping them understand what went wrong and how to resolve
    the issue.


    3    Log errors: Exceptions can be logged to record information about errors that
    occur during program execution. This can be useful for debugging and troubleshooting.


    4    Take corrective action: Exceptions can be caught and handled by executing
    specific code to address the error condition, such as retrying an operation, using
    default values, or prompting the user for input.


    Here''s an example of using exceptions to handle a division by zero error:


    | try:result = 10 / 0  # Attempting division by zeroexcept ZeroDivisionError:print("Error:
    Division by zero") |


    In this example:


    *   The code inside the try block attempts to divide 10 by zero, which would result
    in a ZeroDivisionError.


    *   The except block catches the ZeroDivisionError exception and prints an error
    message indicating that division by zero occurred.


    *   By handling the exception, the program continues to execute normally without
    crashing.


    try-except


    In Python, you use the try and except blocks to handle exceptions. The basic syntax
    is as follows:


    | try:# Code that may raise an exception# ...except ExceptionType:# Code to handle
    the exception# ... |


    Here''s a breakdown of the syntax:


    *   The try block contains the code that may raise an exception. It''s the block
    where you expect the potential error to occur.


    *   The except block specifies the type of exception that you want to catch and
    handle. If an exception of the specified type (or a subclass of it) occurs within
    the try block, the corresponding except block is executed.


    *   You can have multiple except blocks to handle different types of exceptions,
    or a single except block to catch all exceptions. If no specific exception type
    is specified, it will catch all exceptions (not recommended unless you have a
    good reason).


    Here''s an example demonstrating the use of try-except blocks:


    | try:# Code that may raise an exceptionnum1 = int(input("Enter a number: "))num2
    = int(input("Enter another number: "))result = num1 / num2print("Result:", result)except
    ValueError:# Handle ValueError (e.g., invalid input)print("Please enter valid
    integers.")except ZeroDivisionError:# Handle ZeroDivisionError (e.g., division
    by zero)print("Error: Division by zero is not allowed.")except Exception as e:#
    Handle any other type of exceptionprint("An error occurred:", e) |


    In this example:


    *   The try block attempts to perform division operation between two numbers entered
    by the user.


    *   If a ValueError occurs (e.g., if the user inputs non-integer values), the
    corresponding except ValueError block handles it.


    *   If a ZeroDivisionError occurs (e.g., if the user inputs 0 as the second number),
    the corresponding except ZeroDivisionError block handles it.


    *   If any other type of exception occurs, it will be caught by the except Exception
    block, and the error message will be printed.


    *   If no exception occurs within the try block, the except block(s) will be skipped,
    and the program will continue execution after the try-except statement.


