  trans: "\n\n## InstanceofDemo.java\n\n```java\npackage com.abd.java.inheritance.demo;\n\
    import com.abd.java.inheritance.animal.Animal;\nimport com.abd.java.inheritance.animal.Cat;\n\
    import com.abd.java.inheritance.animal.Mouse;\n\npublic class InstanceofDemo {\n\
    \    public static void main(String[] args) {\n        // 创建一个 Animal 对象\n   \
    \     // Animal 是抽象类，\n        // 你无法通过 Animal 的构造函数来创建对象。\n        Animal tom\
    \ = new Cat(\"Tom\", 3, 20);\n        System.out.println(\"name: \" + tom.getName());\n\
    \        System.out.println(\"animalName: \" + tom.getAnimalName());\n\n     \
    \   // 使用 'instanceof' 运算符来\n        // 检查一个对象是否是特定类的实例。\n        boolean isMouse\
    \ = tom instanceof Mouse;\n        System.out.println(\"Tom is mouse? \" + isMouse);\n\
    \        boolean isCat = tom instanceof Cat;\n        System.out.println(\"Tom\
    \ is cat? \" + isCat);\n        boolean isAnimal = tom instanceof Animal;\n  \
    \      System.out.println(\"Tom is animal? \" + isAnimal);\n    }\n}\n```\n\n\
    **输出**\n```\nname: Tom\nanimalName: Cat\nTom is mouse? false\nTom is cat? true\n\
    Tom is animal? true\n```\n\n## InheritMethodDemo.java\n\n```java\npackage com.abd.java.inheritance.demo;\n\
    import com.abd.java.inheritance.animal.Cat;\n\npublic class InheritMethodDemo\
    \ {\n    public static void main(String[] args) {\n        // 创建 Cat 的实例\n   \
    \     Cat tom = new Cat(\"Tom\", 3, 20);\n        // 调用从父类（Animal）继承而的方法。\n  \
    \      System.out.println(\"name: \" + tom.getName());\n        System.out.println(\"\
    animalName: \" + tom.getAnimalName());\n        System.out.println(\"-----------------\"\
    );\n        // 调用 Cat 类中声明的方法。\n        System.out.println(\"Age: \" + tom.getAge());\n\
    \        System.out.println(\"Height: \" + tom.getHeight());\n    }\n}\n```\n\n\
    **输出**\n```\nname: Tom\nanimalName: Cat\n-----------------\nAge: 3\nHeight: 20\n\
    ```\n\n## Java 中的类型转换\n\n### CastDemo.java\n\n```java\npackage com.abd.java.inheritance.demo;\n\
    import java.util.Random;\nimport com.abd.java.inheritance.animal.Animal;\nimport\
    \ com.abd.java.inheritance.animal.Cat;\nimport com.abd.java.inheritance.animal.Mouse;\n\
    \npublic class CastDemo {\n    // 此方法返回一个随机动物。\n    public static Animal getRandomAnimal()\
    \ {\n        // 返回一个随机值 0 或 1。\n        int random = new Random().nextInt(2);\n\
    \        Animal animal = null;\n        if (random == 0) {\n            animal\
    \ = new Cat(\"Tom\", 3, 20);\n        } else {\n            animal = new Mouse(\"\
    Jerry\", 5);\n        }\n        return animal;\n    }\n\n    public static void\
    \ main(String[] args) {\n        Animal animal = getRandomAnimal();\n        if\
    \ (animal instanceof Cat) {\n            // 强制转换为 Cat\n            Cat cat = (Cat)\
    \ animal;\n            // 并调用 Cat 类的方法。\n            System.out.println(\"Cat\
    \ height: \" + cat.getHeight());\n        } else if (animal instanceof Mouse)\
    \ {\n            // 强制转换为 Mouse。\n            Mouse mouse = (Mouse) animal;\n\
    \            // 并调用 Mouse 类的方法。\n            System.out.println(\"Mouse weight:\
    \ \" + mouse.getWeight());\n        }\n    }\n}\n```\n\n## 4 Java 中的多态\n\n你有一只猫亚洲猫（Asian\
    \ Cat），你可以称它是一只猫（Cat），也可以称它是一只动物（Animal），这就是多态的一个方面。\n\n或者另一个例子：在你的简历上记录你是一个亚洲男性，但你实际上是一个越南人。\n\
    \n下面的示例展示了你如何在声明与现实之间表现。\n\n`AsianCat` 是 `Cat` 类的子类。\n\n### AsianCat.java\n\n\
    ```java\npackage com.abd.java.inheritance.animal;\npublic class AsianCat extends\
    \ Cat {\n    public AsianCat(String name, int age, int height) {\n        super(name,\
    \ age, height);\n    }\n    // 重写父类（Cat）的方法\n    @Override\n    public String\
    \ getAnimalName() {\n        return \"Asian Cat\";\n    }\n}\n```\n\nJava 的多态通过下面的插描述：\n\
    \n![](img/image_rsrc704.jpg)\n\n### PolymorphismDemo.java\n\n```java\npackage\
    \ com.abd.java.polymorphism;\nimport com.abd.java.inheritance.animal.AsianCat;\n\
    import com.abd.java.inheritance.animal.Cat;\n\npublic class PolymorphismDemo {\n\
    \    public static void main(String[] args) {\n        Cat cat1 = new Cat(\"Tom\"\
    , 3, 20);\n        Cat cat2 = new AsianCat(\"ATom\", 2, 19);\n        System.out.println(\"\
    Animal Name of cat1: \" + cat1.getAnimalName());\n        System.out.println(\"\
    Animal Name of cat2: \" + cat2.getAnimalName());\n    }\n}\n```\n\n**输出**\n```\n\
    Animal Name of cat1: Cat\nAnimal Name of cat2: Asian Cat\n```\n"
- fmt: "\n```java\n// A class can extends from only one parent class.// But can implements\
    \ (extends) from multiple Interfaces.\npublic class Cat extends Animal implements\
    \ CanEat, CanDrink {\n    // ....\n}\n```\n\n# 5 Structure of an Interface\n\n\
    ### `NoAccessModifierInterface.java`\n```java\npackage com.abd.java.itf;\n// This\
    \ is an interface not specified access modifier.\n// Its access modifier is default.//\n\
    // Only classes in the same package can implements this interface.\ninterface\
    \ NoAccessModifierInterface {}\n```\n\n### `CanMove.java`\n```java\npackage com.abd.java.itf;\n\
    // This interface defines a standard,//\n// about things capable of moving.\n\
    public interface CanMove {\n    // The methods in Interface are always abstract\
    \ and public.\n    public abstract void run();\n    // Even if you do not specify\
    \ 'public abstract', java always understands.\n    void back();\n    // Velocity.\n\
    \    public int getVelocity();\n}\n```\n\n### `CanDrink.java`\n```java\npackage\
    \ com.abd.java.itf;\n// This interface defines a standard,\n// about things capable\
    \ of drinking.\npublic interface CanDrink {\n    // Fields in Interface are always\
    \ 'public static final'.\n    // Whether you declare it or not.\n    public static\
    \ final String PEPSI = \"PEPSI\";\n    final String NUMBER_ONE = \"NUMBER ONE\"\
    ;\n    String SEVENUP = \"SEVEN UP\";\n    public void drink();\n}\n```\n\n# 6\
    \ Class implements Interface\n\n### `Animal.java`\n```java\npackage com.abd.java.cls;\n\
    import com.abd.java.itf.CanMove;\n// This class extends from Object.//\n// And\
    \ implements CanMove interface.//\n// CanMove has 3 abstract methods.//\n// This\
    \ class implements only one abstract method of CanMove.//\n// Therefore it must\
    \ be declared as abstract.//\n// The remaining abstract methods to be implemented\
    \ in the subclasses.\npublic abstract class Animal implements CanMove {\n    //\
    \ Implements run() method of CanMove.\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Animal run...\");\n    }\n}\n```\n\n### `Cat.java`\n\
    ```java\npackage com.abd.java.cls;\nimport com.abd.java.itf.CanDrink;\nimport\
    \ com.abd.java.itf.CanEat;\n// This class extends Animal and implements CanEat,\
    \ CanDrink interfaces.//\n// This class is not declared as abstract.//\n// So\
    \ it must implements all abstract methods of the interfaces.\npublic class Cat\
    \ extends Animal implements CanEat, CanDrink {\n    private String name;\n   \
    \ public Cat(String name) {\n        this.name = name;\n    }\n    public String\
    \ getName() {\n        return this.name;\n    }\n    // Implements method of CanMove\n\
    \    @Override\n    public void back() {\n        System.out.println(name + \"\
    \ cat back ...\");\n    }\n    // Implements method of CanMove.\n    @Override\n\
    \    public int getVelocity() {\n        return 110;\n    }\n    // Implements\
    \ method of CanEat.\n    @Override\n    public void eat() {\n        System.out.println(name\
    \ + \" cat eat ...\");\n    }\n    // Implements method of CanDrink.\n    @Override\n\
    \    public void drink() {\n        System.out.println(name + \" cat drink ...\"\
    );\n    }\n}\n```\n\n### `Mouse.java`\n```java\npackage com.abd.java.cls;\nimport\
    \ com.abd.java.itf.CanDrink;\nimport com.abd.java.itf.CanEat;\npublic class Mouse\
    \ extends Animal implements CanEat, CanDrink {\n    @Override\n    public void\
    \ back() {\n        System.out.println(\"Mouse back ...\");\n    }\n    @Override\n\
    \    public int getVelocity() {\n        return 85;\n    }\n    @Override\n  \
    \  public void drink() {\n        System.out.println(\"Mouse drink ...\");\n \
    \   }\n    @Override\n    public void eat() {\n        System.out.println(\"Mouse\
    \ eat ...\");\n    }\n}\n```\n\n### `AnimalDemo.java`\n```java\npackage com.abd.java.cls;\n\
    import com.abd.java.itf.CanEat;\npublic class AnimalDemo {\n    public static\
    \ void main(String[] args) {\n        // Inherit static field from CanDrink interface.\n\
    \        System.out.println(\"Drink \" + Cat.SEVENUP);\n        // Create CanEat\
    \ object\n        // via constructor of Cat.\n        CanEat canEat1 = new Cat(\"\
    Tom\");\n        // An object declared as CanEat.//\n        // But in fact is\
    \ Mouse.\n        CanEat canEat2 = new Mouse();\n        // Polymorphism shown\
    \ here.//\n        // Java know the actual types of objects.//\n        // ==>\
    \ Tom cat eat ...\n        canEat1.eat();\n        // ==> Mouse eat ...\n    \
    \    canEat2.eat();\n        boolean isCat = canEat1 instanceof Cat;\n       \
    \ System.out.println(\"catEat1 is Cat? \" + isCat);\n        // Cast\n       \
    \ if (canEat2 instanceof Mouse) {\n            Mouse mouse = (Mouse) canEat2;\n\
    \            // Call drink method (Inherited from CanDrink).\n            mouse.drink();\n\
    \        }\n    }\n}\n```\n\n### Output\n```\nDrink SEVEN UP\nTom cat eat ...\n\
    Mouse eat ...\ncatEat1 is Cat? true\nMouse drink ...\n```\n\n# Chapter 9 : Software\
