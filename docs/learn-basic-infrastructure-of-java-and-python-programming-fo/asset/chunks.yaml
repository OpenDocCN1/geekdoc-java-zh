    = Number(10)# Use the overloaded multiplication operatorresult = num1 * num2print("Result:",
    result)  # Output: 50 |


    In this example:


    *   We define a Number class that represents a numerical value.


    *   We define the __mul__() special method, which will be called when the multiplication
    operator (*) is used with instances of the Number class.


    *   Inside the __mul__() method, we check if the other operand is an instance
    of the Number class. If it is, we perform the multiplication of the values and
    return a new Number object with the result.


    *   If the other operand is not an instance of the Number class, we raise a TypeError
    to indicate that the operation is not supported.


    *   We define a __str__() method to provide a string representation of Number
    objects when they are printed.


    You can now use the multiplication operator (*) with instances of the Number class,
    and Python will automatically call the __mul__() method to perform the multiplication
    operation.


    Chapter 7 :


    Advanced


    1   Python File


    Access Modes


    Python file access modes are used to specify the mode in which a file is opened.
    Each mode determines the operations that can be performed on the file, such as
    reading, writing, appending, or creating a new file. Here are the commonly used
    file access modes in Python:


    1    ''r'': Open for reading (default). If the file does not exist or cannot be
    opened, an IOError will be raised.


    2   ''w'': Open for writing. If the file already exists, its contents will be
    overwritten. If the file does not exist, it will be created.


    3    ''a'': Open for appending. The file pointer is positioned at the end of the
    file. New data will be written to the end of the file. If the file does not exist,
    it will be created.


    4    ''r+'': Open for reading and writing. The file pointer is positioned at the
    beginning of the file. If the file does not exist or cannot be opened, an IOError
    will be raised.


    5    ''w+'': Open for reading and writing. If the file already exists, its contents
    will be overwritten. If the file does not exist, it will be created.


    6    ''a+'': Open for reading and appending. The file pointer is positioned at
    the end of the file. New data will be written to the end of the file. If the file
    does not exist, it will be created.


    Here''s how you can use these file access modes in Python:


    | # Open a file in read modewith open(''file.txt'', ''r'') as file:content = file.read()print(content)#
    Open a file in write modewith open(''file.txt'', ''w'') as file:file.write(''Hello,
    world!'')# Open a file in append modewith open(''file.txt'', ''a'') as file:file.write(''\nAppending
    new content'')# Open a file in read and write modewith open(''file.txt'', ''r+'')
    as file:content = file.read()file.write(''\nAdding new content'')# Open a file
    in read and write mode (creating a new file if it doesn''t exist)with open(''new_file.txt'',
    ''w+'') as file:file.write(''This is a new file'')# Open a file in read and append
    mode (creating a new file if it doesn''t exist)with open(''new_file.txt'', ''a+'')
    as file:file.write(''\nThis is appended content'') |


    Remember to always close the file using the with statement or by explicitly calling
    the close() method after you are done working with it. This ensures that any resources
    used by the file are properly released.


    Handler


    In Python, a file handler (also referred to as a file object or file descriptor)
    is an object that represents an open file. It provides methods and attributes
    that allow you to interact with the file, such as reading from it, writing to
    it, or manipulating its contents.


    File handlers are typically obtained by calling the open() function, which returns
    a file handler associated with the specified file. You can then use this file
    handler to perform various operations on the file.


    Here''s how to use a file handler in Python:


    | # Open a file in read mode and obtain a file handlerfile_handler = open(''file.txt'',
    ''r'')# Read the entire contents of the filecontent = file_handler.read()print(content)#
    Close the file handler when donefile_handler.close() |


    In the above example:


    *   We use the open() function to open a file named ''file.txt'' in read mode
    (''r''). This returns a file handler that represents the opened file.


    *   We then use the read() method of the file handler to read the entire contents
    of the file and store it in the variable content.


    *   Finally, we close the file handler by calling its close() method. It''s important
    to close file handlers when they are no longer needed to free up system resources
    and ensure that any buffered data is flushed to the file.


    Additionally, Python supports a context manager (with statement) for file handling,
    which automatically closes the file handler when you exit the block. This is the
    recommended way to work with files in Python:'
