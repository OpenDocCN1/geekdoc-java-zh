    1    if statment


    The if statement is the most basic of all the control flow statements. It tells
    your program to execute a certain section of code only if a particular test evaluates
    to true.


    Below is the structure of if statement:


    | if (condition)  {// Do something here if ''condition'' is true.} |


    | ![](OEBPS/image_rsrc6ZH.jpg) |


    The above image illustrates the flow of application when it meets a if statement.


    1    The program checks the condition.


    2    If the condition is true, code in the if block will be executed. It then
    continues executing the codes below theif block.


    3    If the condition is false, the program will ignores the code in the if block
    and execute code snippets below theif block.


    Example:


    IfExample.java


    | package com.abd.java.javabasic.controlflow;public class IfExample {public static
    void main(String[] args) {// Declare a variable, representing your ageint age
    = 30;System.out.println("Your age: " + age);// The condition to test is ''age>
    20''if (age > 20) {System.out.println("Okey!");System.out.println("Age is greater
    than 20");}// The code after the ''if'' block.System.out.println("Done!");}} |


    Output


    | Your age: 30Okey!Age is greater than 20Done! |


    2    if - else statement


    | if( condition )  {// Do something here}// Elseelse  {// Do something here} |


    | ![](OEBPS/image_rsrc6ZJ.jpg) |


