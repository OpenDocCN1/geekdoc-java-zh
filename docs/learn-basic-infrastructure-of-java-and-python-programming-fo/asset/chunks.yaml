    *   We use the assignment operator = to assign the string "Hello, World!" to the
    variable my_string.


    *   We then print the value of my_string using the print() function.


    You can assign any string value to a variable in Python, and the variable will
    hold that value until it is changed or deleted.


    Variables in String


    In Python, you can use variables inside strings using string formatting techniques.
    There are several ways to achieve this, including using the % operator, the str.format()
    method, and f-strings (formatted string literals). Here''s how you can use variables
    inside strings using each method:


    1    Using % Operator: You can use the % operator to insert


    variables into strings. This method is older and less


    recommended compared to newer methods like f-strings


    and str.format().


    | name = "Alice"age = 30greeting = "Hello, %s! You are %d years old." % (name,
    age)print(greeting) |


    2    Using str.format() Method: The str.format() method allows


    you to format strings with placeholders {} that are replaced


    with variable values.


    | name = "Alice"age = 30greeting = "Hello, {}! You are {} years old.".format(name,
    age)print(greeting) |


    3    Using f-strings (Formatted String Literals): F-strings provide


    a more concise and readable way to insert variables into


    strings. You can directly include variables and expressions


    within curly braces {} inside the string.


    | name = "Alice"age = 30greeting = f"Hello, {name}! You are {age} years old."print(greeting)
    |


    All three methods achieve the same result, but f-strings are generally preferred
    due to their simplicity and readability. They were introduced in Python 3.6 and
    offer a more intuitive way to format strings with variables.


    Escape


    Escape sequences in Python strings are special characters that are preceded by
    a backslash \. These sequences allow you to include characters in strings that
    are difficult or impossible to type directly in source code. Here are some commonly
    used escape sequences in Python:


    1    \n: Newline character. It inserts a newline into the string.


    | print("Line 1\nLine 2") |


    Output:


    | Line 1Line 2 |


    2    \t: Tab character. It inserts a horizontal tab into the string.


    | print("Column 1\tColumn 2") |


    Output:


    | Column 1    Column 2 |


    3    \r: Carriage return character. It moves the cursor to the


    beginning of the line.


    | print("Hello\rWorld") |


    Output:


    | World |


    4    \\: Backslash character. It inserts a literal backslash into the


    string.


    | print("This is a backslash: \\") |


    Output:


    | This is a backslash: \ |


    Quote


    To include single quotes ('') or double quotes (") inside a Python string, you
    can use the opposite type of quote to delimit the string, or you can escape the
    quote character using a backslash (\). Here''s how you can do it:


    1    Using Opposite Type of Quote: If you want to include single quotes inside
    a string delimited by double quotes or vice versa, you can simply use the opposite
    type of quote inside the string.


    | # Using double quotes to delimit the string with single quotes insidestring_with_single_quotes
    = "He said, ''Hello''"print(string_with_single_quotes)# Using single quotes to
    delimit the string with double quotes insidestring_with_double_quotes = ''She
    said, "Hi"''print(string_with_double_quotes) |


    Output:


    | He said, ''Hello''She said, "Hi" |


    2    Escaping Quote Characters: If you want to include the same


    type of quote character inside a string, you can escape it


    using a backslash (\).


    | # Using single quotes with escaped single quote insidestring_with_escaped_single_quote
    = ''I\''m fine''print(string_with_escaped_single_quote)# Using double quotes with
    escaped double quote insidestring_with_escaped_double_quote = "She said, \"It''s
    raining\""print(string_with_escaped_double_quote) |


    Output:


    | I''m fineShe said, "It''s raining" |


    Both of these methods allow you to include single quotes or double quotes inside
    a Python string without causing syntax errors. Choose the method that best fits
    your code style and readability preferences.


    3   Python Number


    Introduction


    Python supports several numerical data types, each with its own characteristics
    and use cases. Here are the main numerical data types that Python can handle:


    1    Integer (int):


    *   Integers represent whole numbers without any decimal point.


    *   Example: 5, -10, 1000.


    2    Floating-Point (float):


    *   Floating-point numbers represent real numbers with a decimal point.


    *   Example: 3.14, 2.718, -0.5.


    3    Complex (complex):


    *   Complex numbers represent numbers with both a real part and an imaginary part.


    *   They are written with a j or J suffix to denote the imaginary part.


    *   Example: 3 + 2j, -4.5 - 1.2j.


    4    Decimal (decimal.Decimal):


    *   Decimal numbers represent fixed-point decimal numbers with arbitrary precision.


    *   They are useful for financial and other applications requiring exact decimal
    representations.


    *   Example: Decimal(''3.14''), Decimal(''10.5'').


    5    Fraction (fractions.Fraction):


    *   Fraction numbers represent rational numbers as fractions of integers.


    *   They are useful for exact representation of fractions.


    *   Example: Fraction(3, 4), Fraction(5, 2).


    6    Boolean (bool):


    *   Boolean values represent truth values, which can be either True or False.


    *   They are commonly used for logical operations and control flow.


    *   Example: True, False.


    7    Rational (sympy.Rational):


    *   Rational numbers represent fractions of integers with arbitrary precision.


    *   They are similar to fractions but offer additional capabilities and are part
    of the sympy library.


    *   Example: Rational(3, 4), Rational(5, 2).


    These are the main numerical data types that Python can handle. Depending on your
    requirements, you can choose the appropriate data type for your calculations and
    applications.


    Integer


    Creating integer numbers and performing simple calculations in Python is straightforward.
