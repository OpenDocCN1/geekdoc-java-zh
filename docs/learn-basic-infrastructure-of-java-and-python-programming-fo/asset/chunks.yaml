    \n## 2 Python while\n\n### 语法\n\nPython 中 `while` 循环的语法如下：\n\n```python\nwhile\
    \ condition:\n# 如果条件为 True，则重复执行代码块\n```\n\n在此语法中：\n\n- `condition` 是在每次循环迭代之前评估的表达式。如果条件为\
    \ True，则执行循环体。如果条件为 False，循环终止。\n- `while` 语句结尾的冒号（:）标明了条件为 True 时将执行的代码块的开始。\n\
    - 循环内的代码块会缩进，以表示它属于循环。\n- 循环会重复执行代码块直到条件变为 False。如果条件永远不变为 False，可能会导致死循环。\n\n\
    ### break\n\n你可以使用 `break` 语句提前退出 `while` 循环。以下是使用方法：\n\n```python\nwhile condition:\n\
    \    # 如果条件为 True，则重复执行代码块\n    if some_condition:\n        break # 如果满足某些条件则循环\n\
    ```\n\n在此代码中：\n\n- 在 `while` 循环内部，有一个 `if` 语句检查某个条件 (`some_condition`)。\n- 如果\
    \ `some_condition` 为 True，则执行 `break` 语句。\n- 当遇到 `break` 语句时，会立即退出 `while` 循环，无论循环条件是否仍为\
    \ True。\n- 执行 `break` 语句后，程序继续执行循环之后的代码。\n\n### continue\n\n你可以使用 `continue` 语句跳过\
    \ `while` 循环的当前迭代并进入下次迭代。以下是使用方法：\n\n```python\nwhile condition:\n    # 如果条件为\
