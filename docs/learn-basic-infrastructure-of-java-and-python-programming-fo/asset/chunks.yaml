    \ exception type is specified, it will catch all exceptions (not recommended unless\
    \ you have a good reason).\n\nHere's an example demonstrating the use of `try-except`\
    \ blocks:\n\n```python\ntry:\n    # Code that may raise an exception\n    num1\
    \ = int(input(\"Enter a number: \"))\n    num2 = int(input(\"Enter another number:\
    \ \"))\n    result = num1 / num2\n    print(\"Result:\", result)\nexcept ValueError:\n\
    \    # Handle ValueError (e.g., invalid input)\n    print(\"Please enter valid\
    \ integers.\")\nexcept ZeroDivisionError:\n    # Handle ZeroDivisionError (e.g.,\
    \ division by zero)\n    print(\"Error: Division by zero is not allowed.\")\n\
    except Exception as e:\n    # Handle any other type of exception\n    print(\"\
    An error occurred:\", e)\n```\n\nIn this example:\n\n* The `try` block attempts\
    \ to perform division operation between two numbers entered by the user.\n* If\
    \ a `ValueError` occurs (e.g., if the user inputs non-integer values), the corresponding\
    \ `except ValueError` block handles it.\n* If a `ZeroDivisionError` occurs (e.g.,\
    \ if the user inputs 0 as the second number), the corresponding `except ZeroDivisionError`\
    \ block handles it.\n* If any other type of exception occurs, it will be caught\
    \ by the `except Exception` block, and the error message will be printed.\n* If\
    \ no exception occurs within the `try` block, the `except` block(s) will be skipped,\
    \ and the program will continue execution after the `try-except` statement.\n\n\
    ### else\n\nIn Python, you can use a `try...else` block to handle exceptions in\
    \ a way that distinguishes between the code that may raise an exception and the\
    \ code that should run if no exception occurs. The `else` block is executed only\
    \ if no exception is raised in the `try` block. Here's the syntax:\n\n```python\n\
    try:\n    # Code that may raise an exception\nexcept ExceptionType:\n    # Code\
    \ to handle the exception\nelse:\n    # Code to run if no exception was raised\n\
    ```\n"
