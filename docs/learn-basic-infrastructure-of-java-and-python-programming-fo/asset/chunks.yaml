    \ bornYear, String placeOfBirth) {\n        this.name = name;\n        this.bornYear\
    \ = bornYear;\n        this.placeOfBirth = placeOfBirth;\n    }\n\n    // 构造函数有\
    \ 2 个参数。\n    // 目标是给 Person 的名字、出生年份字段赋值。\n    // 未分配出生地。\n    public Person(String\
    \ name, Integer bornYear) {\n        this.name = name;\n        this.bornYear\
    \ = bornYear;\n    }\n\n    public String getName() {\n        return name;\n\
    \    }\n\n    public void setName(String name) {\n        this.name = name;\n\
    \    }\n    public Integer getBornYear() {\n        return bornYear;\n    }\n\
    \    public void setBornYear(Integer bornYear) {\n        this.bornYear = bornYear;\n\
    \    }\n    public String getPlaceOfBirth() {\n        return placeOfBirth;\n\
    \    }\n    public void setPlaceOfBirth(String placeOfBirth) {\n        this.placeOfBirth\
    \ = placeOfBirth;\n    }\n}\n```\n\n#### `PersonDemo.java`\n\n```java\npackage\
    \ com.abd.java.inheritance.basic;\npublic class PersonDemo {\n    public static\
    \ void main(String[] args) {\n        // 实例：托马斯·迪森。\n        Person edison = new\
    \ Person(\"Thomas Edison\", 1847);\n        System.out.println(\"Info:\");\n \
    \       System.out.println(\"Name: \" + edison.getName());\n        System.out.println(\"\
    Born Year: \" + edison.getBornYear());\n        System.out.println(\"Place Of\
    \ Birth: \" + edison.getPlaceOfBirth() );\n        // 实例：比尔·盖茨\n        Person\
    \ billGates = new Person(\"Bill Gate\", 1955, \"Seattle, Washington\");\n    \
    \    System.out.println(\"Info:\");\n        System.out.println(\"Name: \" + billGates.getName());\n\
    \        System.out.println(\"Born Year: \" + billGates.getBornYear());\n    \
    \    System.out.println(\"Place Of Birth: \" + billGates.getPlaceOfBirth());\n\
    \    }\n}\n```\n\n### 区分类、构造函数和实例\n`Person` 模拟了一个人的类，它是抽象的，但它包含信息。在上面的示例中，信息是名字、出生年份和出生地。\n\
    \n### 构造函数\n- 构造函数的名称始终与类名相同。\n- 一个类可以有一个或多个构造函数。\n- 带有参数或不带参数的构造函数，不带参数构造函数被称为默认构造函数。\n\
    - 构造函数用于创建类的实例。\n- 参见示例，从构造函数创建对象（实例）。\n\n!![](img/image_rsrc701.jpg)\n\n## 3.\
    \ Java 中的继承\n我们需要几个类来参与示例。\n- `Animal`：模拟动物的类。\n- `Duck`：`Animal` 的子类。\n- `Cat`：`Animal`\
    \ 的子类。\n- `Mouse`：`Animal` 的子类。\n\n!![](img/image_rsrc702.jpg)\n\n```java\npublic\
    \ abstract getAnimalName();\n```\n"
