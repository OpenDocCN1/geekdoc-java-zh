    \ 和模式 `'w'` 以写入模式打开文件。如果文件不存在，则将创建它；如果文件已存在，其内容将被覆盖。\n* 我们使用上下文管理器（`with` 语句）在打开文件句柄后自动关闭文件句柄。\n\
