    4    Polymorphism in Java


    You have a cat Asian Cat, you can call it is a Cat or call it is an Animal which
    is an aspect of the polymorphism.


    Or another example: On your resume records that you''re an Asian man, while you
    actually are a Vietnamese.


    The example below shows you how to behave between declaring and reality


    AsianCat is a subclass of the class Cat.


    AsianCat.java


