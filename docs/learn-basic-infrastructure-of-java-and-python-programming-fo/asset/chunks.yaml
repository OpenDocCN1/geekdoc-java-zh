    \ |\n\n# Chapter 7: Inheritance and polymorphism in Java\n\n## 1. Introduction\n\
    2. Class, Constructor and instance\n3. Inheritance in java\n4. Polymorphism in\
    \ Java\n\n### 1. Introduction\nInheritance and polymorphism - this is a very important\
    \ concept in Java. You must understand it better if you want to learn java.\n\n\
    ### 2. Class, Constructor and instance\nYou need to understand explicitly about\
    \ class, constructor and instance before starting to learn inheritance in java.\
    \ We consider the class `Person`, describes a person with information full name,\
    \ year of birth, place of birth.\n\n#### `Person.java`\n\n```java\npackage com.abd.java.inheritance.basic;\n\
    public class Person {\n    // Field name - name of person.\n    private String\
    \ name;\n    // Field bornYear\n    private Integer bornYear;\n    // Field placeOfBirth.\n\
    \    private String placeOfBirth;\n\n    // Constructor has 3 parameters.\n  \
    \  // The aim is to assign values to the fields of Person.\n    // Specify the\
    \ name, year of birth, place of birth of a person.\n    public Person(String name,\
    \ Integer bornYear, String placeOfBirth) {\n        this.name = name;\n      \
    \  this.bornYear = bornYear;\n        this.placeOfBirth = placeOfBirth;\n    }\n\
    \n    // Constructor has 2 parameters.\n    // The aim is to assign values to\
    \ the name, born year fileds of the Person.\n    // The place of birth is not\
    \ assigned.\n    public Person(String name, Integer bornYear) {\n        this.name\
    \ = name;\n        this.bornYear = bornYear;\n    }\n\n    public String getName()\
    \ {\n        return name;\n    }\n\n    public void setName(String name) {\n \
    \       this.name = name;\n    }\n    public Integer getBornYear() {\n       \
    \ return bornYear;\n    }\n    public void setBornYear(Integer bornYear) {\n \
    \       this.bornYear = bornYear;\n    }\n    public String getPlaceOfBirth()\
    \ {\n        return placeOfBirth;\n    }\n    public void setPlaceOfBirth(String\
    \ placeOfBirth) {\n        this.placeOfBirth = placeOfBirth;\n    }\n}\n```\n\n\
    #### `PersonDemo.java`\n\n```java\npackage com.abd.java.inheritance.basic;\npublic\
    \ class PersonDemo {\n    public static void main(String[] args) {\n        //\
    \ Instance: Thomas Edison.\n        Person edison = new Person(\"Thomas Edison\"\
    , 1847);\n        System.out.println(\"Info:\");\n        System.out.println(\"\
    Name: \" + edison.getName());\n        System.out.println(\"Born Year: \" + edison.getBornYear());\n\
    \        System.out.println(\"Place Of Birth: \" + edison.getPlaceOfBirth() );\n\
    \        // Instance: Bill Gates\n        Person billGates = new Person(\"Bill\
    \ Gate\", 1955, \"Seattle, Washington\");\n        System.out.println(\"Info:\"\
    );\n        System.out.println(\"Name: \" + billGates.getName());\n        System.out.println(\"\
    Born Year: \" + billGates.getBornYear());\n        System.out.println(\"Place\
    \ Of Birth: \" + billGates.getPlaceOfBirth());\n    }\n}\n```\n\n### Distinguishing\
    \ Class, constructor and instance\n`Person` simulate a class of people, it is\
    \ something abstract, but it has information, in the example above, information\
    \ is the name, year of birth, place of birth.\n\n### Constructor\n- Constructor\
    \ always have the same name as the class.\n- One class has one or more constructors.\n\
    - Constructor with or without parameters, no parameters constructor called default\
    \ constructor.\n- Constructor using for create a instance of class.\n- See example,\
    \ create a object (instance) from Constructor.\n\n!![](OEBPS/image_rsrc701.jpg)\n\
    \n## 3. Inheritance in java\nWe need a few classes to participate in examples.\n\
    - `Animal`: Class simulate an animal.\n- `Duck`: Subclass of `Animal`.\n- `Cat`:\
    \ Subclass of `Animal`.\n- `Mouse`: Subclass of `Animal`.\n\n!![](OEBPS/image_rsrc702.jpg)\n\
    \nHere we have the `Animal` class, it has a method without body.\n\n```java\n\
    public abstract String getAnimalName();\n```\n\nThis method is an abstract method,\
    \ in the subclass you need to declare and implement its body.\n`Animal` class\
    \ has at least one abstract method, it must be declared as `abstract`. Class `abstract`\
    \ has constructor, but you can not create instance from it.\n\nIn essence means\
