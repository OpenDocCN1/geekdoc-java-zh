    String[] { "Apple", "Apricot", "Banana" };// The for-each loop to traverse array.for
    (String fruit : fruits) {System.out.println(fruit);}}} |


    Output


    | AppleApricotBanana |


    4    while Loop


    The while loop is used to execute a program snippet repeatedly, when a condition
    is still true. The while loop is usually used when iterationsare not defined before
    (not fixed).


    This is while loop structure:


    | // While condition is true then do something.while ( condition ) {// Do something
    here...} |


    WhileExample1.java


    | package com.abd.java.javabasic.loop;public class WhileExampe1 {public static
    void main(String[] args) {int value = 3;// While the ''value'' is still less than
    10, the loop still works.while (value < 10) {System.out.println("Value = " + value);//
    Increase ''value'' by adding 2value = value + 2;}}} |


    5    do-while Loop


    The do-while loop is used to execute a section of program many times.The characteristics
    of the do-while is that the block of statement is always executed at least once.
    After each iteration, the program will check the condition, if the condition is
    still correct, the statement block will be executed again.


    This is the structure do-while loop:


    | // The do-while loop performs at least one iteration.// And while the condition
    is true, it continues to workdo {// Do something here.}while (condition); |


    DoWhileExample1.java


    | package com.abd.java.javabasic.loop;public class DoWhileExample1 {public static
    void main(String[] args) {int value = 3;// do-while loop will execute at least
    oncedo {System.out.println("Value = " + value);// Increase by 3value = value +
    3;} while (value < 10);}} |


    Output


    | Value = 3Value = 6Value = 9 |


    6    The break statement in loop


    The break statement can appear in a loop. It is the statement that help the program
    exit the loop


    | ![](OEBPS/image_rsrc6ZS.jpg) |


    LoopBreakExample.java


    | package com.abd.java.javabasic.loop;public class LoopBreakExample {public static
    void main(String[] args) {System.out.println("Break example");int x = 2;while
    (x < 15) {System.out.println("----------------------\n");System.out.println("x
    = " + x);// If x = 5 then exit the loop.if (x == 5) {break;}x++;System.out.println("x
    after ++ = " + x);}System.out.println("Done!");}} |


    Output


    | Break example----------------------x = 2x after ++ = 3----------------------x
    = 3x after ++ = 4----------------------x = 4x after ++ = 5----------------------x
    = 5Done! |


    7    The continue statement in a loop


    The continue statement can appear in a loop. When encountering the continue statement,
    the program will ignore the statement lines within the block and at the bottom
    of the continue and start an new iteration (If the condition is still correct).


    | ![](OEBPS/image_rsrc6ZT.jpg) |


    LoopContinueExample.java


    | package com.abd.java.javabasic.loop;public class LoopContinueExample {public
    static void main(String[] args) {System.out.println("Continue example");int x
    = 2;while (x < 7) {System.out.println("----------------------\n");System.out.println("x
    = " + x);// x = x + 1;x++;// % operator is used for calculating remainder.// If
    x is even, then ignore the command line below of ''continue'',// and start new
    iteration (if condition still true).if (x % 2 == 0) {continue;}System.out.println("x
    after ++ = " + x);}System.out.println("Done!");}} |


    Output


    | Continue example----------------------x = 2x after ++ = 3----------------------x
    = 3----------------------x = 4x after ++ = 5----------------------x = 5----------------------x
    = 6x after ++ = 7Done! |


    8    Labelled Loop


    The Java allows you to stick a label to a loop. It is like you name a loop, which
    is useful when you use multiple nested loops in a program.


    You can use break labelX statement;to break a loop is attached labelX.


    You can use continue labelX statement; to continue a loop is attached labelX.


    | ![](OEBPS/image_rsrc6ZU.jpg) |


    | // for loop with Label.label1: for( ... )  {}// while loop with Label.label2:
    while ( ... )  {}// do-while loop with Label.label3: do  {} while ( ... ); |


    LabelledLoopBreakExample.java


    | package com.abd.java.javabasic.loop;public class LabelledLoopBreakExample {public
    static void main(String[] args) {System.out.println("Labelled Loop Break example");int
    i = 0;label1: while (i < 5) {System.out.println("----------------------\n");System.out.println("i
    = " + i);i++;label2: for (int j = 0; j < 3; j++) {System.out.println("  --> "
    + j);if (j > 0) {// Exit the loop with label1.break label1;}}}System.out.println("Done!");}}
    |


    Output


    | Labelled Loop Break example----------------------i = 0--> 0--> 1Done! |


    Example of using nested labelled loops and labelled continue statement.


    LabelledLoopContinueExample.java


