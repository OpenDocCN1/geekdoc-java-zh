    x = 10\ny = 20\nmax_value = x if x > y else y\nprint(\"Maximum value:\", max_value)\
    \  # Output: 20\n```\n\n在此示例中：\n\n*   `x > y` 条件首先被求值。\n*   由于 `10` 不大于 `20`，将\
