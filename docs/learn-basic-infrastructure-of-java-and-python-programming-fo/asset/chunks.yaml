    3   Python for loop


    Introduction


    In Python, a for loop is used to iterate over a sequence (such as a list, tuple,
    string, or range) or any iterable object. The for loop executes a block of code
    multiple times, once for each item in the sequence or iterable.


    The syntax of a for loop in Python is as follows:


    | for item in sequence:# Code block to be executed for each item in the sequence
    |


    In this syntax:


    *   item is a variable that takes on the value of each item in the sequence during
    each iteration of the loop.


    *   sequence is the sequence of elements over which the loop iterates. It can
    be any iterable object, such as a list, tuple, string, or range.


    *   The colon (:) at the end of the for statement indicates the start of the indented
    block of code that will be executed for each item in the sequence.


    *   The code inside the loop block is indented to signify that it belongs to the
    loop body.


    *   During each iteration of the loop, the item variable takes on the value of
    the next element in the sequence, and the code block inside the loop is executed
    with that value.


    Here''s a simple example of using a for loop to iterate over a list:


    | fruits = ["apple", "banana", "cherry"]for fruit in fruits:print(fruit) |


    Output:


    | applebananacherry |


    In this example, the for loop iterates over each item in the fruits list, and
    during each iteration, the fruit variable takes on the value of the current item,
    which is then printed.


    Syntax


    In Python, the for loop can be used in different ways depending on the type of
    iterable you are iterating over or the specific requirement of the loop. Here
    are some common variations of for loop statements:


    1    Iterating over a sequence (list, tuple, string, etc.):


    | sequence = [1, 2, 3, 4, 5]for item in sequence:# Code block to be executed for
    each item in the sequence |


    2    Iterating over a range of numbers:


    | for i in range(start, stop, step):# Code block to be executed for each value
    of i in the range |


    Here, start is the starting value of the range (inclusive), stop is the ending
    value of the range (exclusive), and step is the step size between each value (default
    is 1).


    3    Iterating over a sequence with index using enumerate():


    | sequence = ["a", "b", "c", "d"]for index, value in enumerate(sequence):# Code
    block to be executed for each (index, value) pair |


    4    Iterating over multiple sequences simultaneously using zip():


    | sequence1 = [1, 2, 3]sequence2 = ["a", "b", "c"]for item1, item2 in zip(sequence1,
    sequence2):# Code block to be executed for each corresponding pair of items |


    5    Iterating over dictionary keys, values, or items:


    | dictionary = {"a": 1, "b": 2, "c": 3}# Iterating over keysfor key in dictionary:#
    Code block to be executed for each key# Iterating over valuesfor value in dictionary.values():#
    Code block to be executed for each value# Iterating over key-value pairsfor key,
    value in dictionary.items():# Code block to be executed for each (key, value)
    pair |


    These are some of the common ways you can use the for loop in Python, but there
    can be more variations depending on the specific requirements of your code.


    Loop on array


    In Python, you can print each element in an array (or list) using a for loop.
    Here''s how you can do it:


    | # Define an array (or list)my_array = [1, 2, 3, 4, 5]# Iterate over each element
    in the array using a for loopfor element in my_array:print(element) |


    In this code:


    *   We define an array (or list) called my_array containing some elements [1,
    2, 3, 4, 5].


    *   We use a for loop to iterate over each element in the array.


    *   During each iteration, the element variable takes on the value of the current
    element in the array.


    *   Inside the loop, we print each element using the print() function.


    This will print each element of the array on a new line. If you want to print
    them on the same line, you can use the end parameter of the print() function,
    like this:


    | # Print each element on the same linefor element in my_array:print(element,
    end=" ") |


    This will print each element separated by a space on the same line.


    4   Python pass


    Introduction


    In Python, the pass statement is a null operation. It doesn''t do anything, and
    it acts as a placeholder when a statement is syntactically required but you don''t
    want to execute any code.


    You might use the pass statement in the following situations:


    1    Placeholder for future code: You can use pass as a placeholder when you want
    to indicate that a block of code will be implemented later, but you want to have
    a syntactically correct placeholder in the meantime.


    | if condition:# To be implemented laterpass |


    2    Empty function or class: When you define a function or a class that doesn''t
    contain any code yet, you can use pass to indicate that it''s intentionally empty.


    | def my_function():passclass MyClass:pass |


    3    Implementing a placeholder for a loop or conditional block: Sometimes, when
    designing your code, you might want to include a loop or conditional block that
    doesn''t do anything yet. In such cases, you can use pass as a placeholder.


    | for item in my_list:# Placeholder for future codepassif condition:# Placeholder
    for future codepass |


    Using pass allows your code to remain syntactically correct while providing a
    clear indication that the block of code is intentionally left empty or will be
    implemented later.


    5   Python break


    Introduction


    In Python, the break statement is used to exit (or "break out of") a loop prematurely.
    When a break statement is encountered inside a loop (such as a for loop or a while
    loop), the loop is immediately terminated, and the program execution continues
    from the statement immediately following the loop.


    Here''s a basic example of how break statement works in a loop:


    | for i in range(5):print(i)if i == 2:break |


    In this example, the loop iterates over the range from 0 to 4\. When i becomes
    equal to 2, the if condition i == 2 becomes true, and the break statement is executed.
    As a result, the loop is terminated prematurely, and the program execution continues
    after the loop.


    Output:


    | 012 |


    After i reaches 2, the loop is terminated, and the statement print("Loop terminated")
    (if present) would be executed next.


    The break statement is often used in combination with conditional statements (if
    statements) inside loops to exit the loop based on certain conditions. It provides
    a way to terminate the loop prematurely when a specific condition is met, which
    can be useful for optimization or for handling special cases.


    Syntax


    In Python, the break statement is used within loops to exit the loop prematurely.
    Here are some common ways to use the break statement with different types of loops:


    1    Using break in a for loop:


    | for item in iterable:# Code blockif condition:break |


    2    Using break in a while loop:


    | while condition:# Code blockif condition:break |


    In both cases:


    *   The break statement is used to exit the loop immediately when a certain condition
    is met.


    *   It can be placed inside a conditional statement (if statement) to define the
    condition under which the loop should be terminated.


    *   Once the break statement is executed, the loop is terminated, and the program
    execution continues from the statement immediately following the loop.


    Here''s an example demonstrating the usage of break in both types of loops:


    | # Using break in a for loopfor i in range(5):print(i)if i == 2:break# Using
    break in a while loopi = 0while i < 5:print(i)if i == 2:breaki += 1 |


    Output:


    | 012012 |


    In both cases, the loop terminates prematurely when i becomes equal to 2 due to
    the break statement.


