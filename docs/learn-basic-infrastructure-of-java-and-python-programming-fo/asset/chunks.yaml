    \        String[] fruits = new String[] { \"Apple\", \"Apricot\", \"Banana\" };\n\
    \        // The for-each loop to traverse array.\n        for (String fruit :\
    \ fruits) {\n            System.out.println(fruit);\n        }\n    }\n}\n```\n\
    \n**Output**\n```\nApple\nApricot\nBanana\n```\n\n### 4 while Loop\n\nThe `while`\
    \ loop is used to execute a program snippet repeatedly, when a condition is still\
    \ true. The `while` loop is usually used when iterations are not defined before\
    \ (not fixed).\n\nThis is while loop structure:\n\n```java\n// While condition\
    \ is true then do something.\nwhile ( condition ) {\n    // Do something here...\n\
    }\n```\n\nWhileExample1.java\n```java\npackage com.abd.java.javabasic.loop;\n\
    public class WhileExampe1 {\n    public static void main(String[] args) {\n  \
    \      int value = 3;\n        // While the 'value' is still less than 10, the\
    \ loop still works.\n        while (value < 10) {\n            System.out.println(\"\
    Value = \" + value);\n            // Increase 'value' by adding 2\n          \
    \  value = value + 2;\n        }\n    }\n}\n```\n\n### 5 do-while Loop\n\nThe\
    \ `do-while` loop is used to execute a section of program many times. The characteristics\
    \ of the `do-while` is that the block of statement is always executed at least\
    \ once. After each iteration, the program will check the condition, if the condition\
    \ is still correct, the statement block will be executed again.\n\nThis is the\
    \ structure do-while loop:\n\n```java\n// The do-while loop performs at least\
    \ one iteration.\n// And while the condition is true, it continues to work\ndo\
    \ {\n    // Do something here.\n} while (condition);\n```\n\nDoWhileExample1.java\n\
    ```java\npackage com.abd.java.javabasic.loop;\npublic class DoWhileExample1 {\n\
    \    public static void main(String[] args) {\n        int value = 3;\n      \
    \  // do-while loop will execute at least once\n        do {\n            System.out.println(\"\
    Value = \" + value);\n            // Increase by 3\n            value = value\
    \ + 3;\n        } while (value < 10);\n    }\n}\n```\n\n**Output**\n```\nValue\
    \ = 3\nValue = 6\nValue = 9\n```\n\n### 6 The break statement in loop\n\nThe `break`\
    \ statement can appear in a loop. It is the statement that help the program exit\
    \ the loop.\n\n![](OEBPS/image_rsrc6ZS.jpg)\n\nLoopBreakExample.java\n```java\n\
    package com.abd.java.javabasic.loop;\npublic class LoopBreakExample {\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Break example\"\
    );\n        int x = 2;\n        while (x < 15) {\n            System.out.println(\"\
    ----------------------\\n\");\n            System.out.println(\"x = \" + x);\n\
    \            // If x = 5 then exit the loop.\n            if (x == 5) {\n    \
    \            break;\n            }\n            x++;\n            System.out.println(\"\
    x after ++ = \" + x);\n        }\n        System.out.println(\"Done!\");\n   \
    \ }\n}\n```\n\n**Output**\n```\nBreak example\n----------------------\nx = 2\n\
    x after ++ = 3\n----------------------\nx = 3\nx after ++ = 4\n----------------------\n\
    x = 4\nx after ++ = 5\n----------------------\nx = 5\nDone!\n```\n\n### 7 The\
    \ continue statement in a loop\n\nThe `continue` statement can appear in a loop.\
    \ When encountering the `continue` statement, the program will ignore the statement\
    \ lines within the block and at the bottom of the `continue` and start a new iteration\
    \ (If the condition is still correct).\n\n![](OEBPS/image_rsrc6ZT.jpg)\n\nLoopContinueExample.java\n\
    ```java\npackage com.abd.java.javabasic.loop;\npublic class LoopContinueExample\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Continue example\");\n        int x = 2;\n        while (x < 7) {\n          \
    \  System.out.println(\"----------------------\\n\");\n            System.out.println(\"\
    x = \" + x);\n            // x = x + 1;\n            x++;\n            // % operator\
    \ is used for calculating remainder.\n            // If x is even, then ignore\
    \ the command line below of 'continue',\n            // and start new iteration\
    \ (if condition still true).\n            if (x % 2 == 0) {\n                continue;\n\
    \            }\n            System.out.println(\"x after ++ = \" + x);\n     \
    \   }\n        System.out.println(\"Done!\");\n    }\n}\n```\n\n**Output**\n```\n\
    Continue example\n----------------------\nx = 2\nx after ++ = 3\n----------------------\n\
    x = 3\n----------------------\nx = 4\nx after ++ = 5\n----------------------\n\
    x = 5\nx after ++ = 6\n----------------------\nx = 6\nDone!\n```\n\n### 8 Labelled\
    \ Loop\n\nThe `break` and `continue` statements can be used with label loops.\
    \ This is useful when you have nested loops and you want to break or continue\
    \ the outer loop rather than the inner one.\n\n```java\nlabel1: for (int i = 0;\
    \ i < 5; i++) {\n    label2: for (int j = 0; j < 5; j++) {\n        if (i == 2\
    \ && j == 2) break label1; // Breaks the outer loop\n        if (j == 1) continue\
    \ label2; // Continues the inner loop\n        System.out.println(\"i = \" + i\
    \ + \", j = \" + j);\n    }\n}\n```\n\n### Chapter 6: Arrays in Java\n\n1. What\
    \ is Array\n2. One-dimensional array\n3. One-dimensional array and for-each loop\n\
    4. Utility methods for One-Dimensional Array\n5. Two-dimensional array\n\n####\
    \ 1 What is Array\n\nIn Java, array is a set of elements with the same data type,\
