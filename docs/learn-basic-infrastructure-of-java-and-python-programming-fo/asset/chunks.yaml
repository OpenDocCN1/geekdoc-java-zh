    \ `a` 和 `b` 的值来测试不同的比较。\n\n## 4. Python 逻辑运算符\n\n### 介绍\n\n在 Python 中，逻辑运算符用于组合多个条件并产生单个布尔结果（`True`\
    \ 或 `False`）。以下是 Python 中逻辑逻辑运算符的列表：\n\n1. **逻辑与 (and)**：如果两个操作数都为 `True`，则返回\
    \ `True`。\n2. **逻辑或 (or)**：如果操作数中至少有一个为 `True`，则返回 `True`。\n3. **逻辑非 (not)**：如果操作数为为\
    \ `False`，则返回 `True`；如果操作数为为 `True`，则返回 `False`。\n\n这些运算符通常用于条件语句、循环以及需要逻辑操作的其他语境。\n\
    \n### 使用方法\n\n以下是演示 Python 中每个逻辑运算符用法的示例：\n\n#### 1. 逻辑与 (and):\n\n```python\n\
