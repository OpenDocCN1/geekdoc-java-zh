    --- ");// Assigns values to elements.for (int row = 0; row < 2; row++) {for (int
    col = 0; col < 3; col++) {myArray[row][col] = (row + 1) * (col + 1);}}// Print
    outfor (int row = 0; row < 2; row++) {for (int col = 0; col < 3; col++) {System.out.println("myArray["
    + row + "," + col + "]=" + myArray[row][col]);}}}} |


