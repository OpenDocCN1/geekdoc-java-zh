    10  Reference Types


    1    Overview of data types


    Any programming language has a set of data types. Data types are basic, and quite
    similar for all languages. All data types are composed from bits.


    Java has two types of data types:


    *   Primitive Types


    *   Reference Types


    There are 8 primitive data types which are boolean, byte, char, short, int, long,
    float, double.


    | ![](OEBPS/image_rsrc6ZF.jpg) |


    Logic type: boolean.


    Integer types: byte, short, char, int, long.


    Real number type is also called floating point: float, double.


    Reference types, which are objects created by the constructor of classes.


    2   byte


    1 byte a byte is composed of 8 consecutive bits in the memory of computer. Each
    bit is a binary number of 0 or 1\. Java uses "byte" to name a integer type with
    small scope (Size: 1 byte).


    | ![](OEBPS/image_rsrc6ZG.jpg) |


    The first bit in a row of 8 bits has value of 0 or 1.


    If it is 0, Java considers it as + (Represent a positive number)


    If it is 1 Java considers it as - (Represent a negative number)


    3    boolean


    boolean is the simplest data type. It has size of 1 bit. It has 2 values of true
    and false.


    The default value for the boolean type isfalse.


    | // Declare a variable named ''valid'', data type is boolean// The value will
    be false by default.boolean valid;// Declare a variable named ''active'', data
    type is boolean// Value is true.boolean active = true; |


    4    char


    Although "char" is the first four characters of the "Character" term, the char
    type in Java is used to store non-negative integers with the two-byte size. It
    is also used to represent for a Unicode character because in nature, each character
    corresponds to a specific number. (This number is understood as the code of character.)


    5    short


    short is data type for the purpose of representing a two-byte integer (16 bits),
    including negative integer.


    The smallest value is -32,768 (-2^15) and the largest value is 32,767 (2^15 -1).


    Default value is 0.


    6    int


    int data type is used to represent an integer with the size of 4 bytes (32 bits).


    The smallest value: -2,147,483,648 (-2^31)


    The largest value: 2,147,483,647 (2^31 -1)


    Default value: 0.


