    \n### 5 do-while 循环\n\n`do-while` 循环用于多次执行程序段。`do-while` 的特点是语句块至少会被执行一次。每次迭代后，程序将检查条件，如果条件仍然正确，则将再次执行语句块。\n\
    \n这是 do-while 循环的结构：\n\n```java\n// do-while 循环至少执行一次迭代。\n// 只要条件为真，它就会继续工作\n\
