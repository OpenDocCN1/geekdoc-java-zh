    \ 19 and 39\n```\n\n# 第 4 章：Java 中的 switch 语句\n\n## 1. switch 语句的结构\n## 2. switch\
    \ 示例\n## 3. switch 中的 break 语句\n\n### 1. switch 语句的结构\n\n```java\n// variable_to_test:\
    \ 待测试的变量。\nswitch ( variable_to_test ) {\n    case value1: //在此处操作\n    break;\n\
    \    case value2: //在此处操作\n    break;\n    default: //在此处操作\n}\n```\n\n`switch`\
    \ 语句的特点：\n\n`switch` 会检查变量的值并从上到下与每个值进行比较。每个值被称为一个 `case`。当 `case` 为真时，将执行该 `case`\
    \ 的语句块。\n\n![](img/image_rsrc6ZM.jpg)\n\n如果所有 cases 都为假，将执行 `default` 语句。注意：在\
    \ switch 语句的结构中，可能没有 `default` 语句。\n\n![](img/image_rsrc6ZN.jpg)\n\n当找到 true case\
    \ 时，将执行该 case 的语句块。如果没有遇到 break 语句，程序将继续执行。`break` 语句会让程序退出。\n\n![](img/image_rsrc6ZP.jpg)\n\
    \n注意：在 switch 语句的结构中，可能没有 `default` 语句。\n\n```java\n// variable_to_test: 待测试的变量。\n\
    switch ( variable_to_test ) {\n    case value1: //在此处操作\n    break;\n    case\
    \ value2: //在此处操作\n    break;\n    default: //在此处操作\n}\n```\n\n### 2. switch 示例\n\
    \nSwitchExample1.java\n\n```java\npackage com.abd.java.javabasic.controlflow;\n\
    public class SwitchExample {\n    public static void main(String[] args) {\n \
    \       int age = 20;\n        switch (age) {\n            case 18:\n        \
    \        System.out.println(\"You are 18 year old\");\n                break;\n\
    \            case 20:\n                System.out.println(\"You are 20 year old\"\
    );\n                break;\n            default:\n                System.out.println(\"\
    Other age\");\n        }\n    }\n}\n```\n\nOutput\n```\nYou are 20 year old\n\
    ```\n\n### 3. switch 中的 break 语句\n\n`break` 语句用于退出 `switch` 块。\n\n```java\npackage\
    \ com.abd.java.javabasic.controlflow;\npublic class SwitchExample1 {\n    public\
    \ static void main(String[] args) {\n        int age = 20;\n        switch (age)\
    \ {\n            case 18:\n                System.out.println(\"You are 18 year\
    \ old\");\n                break;\n            case 20:\n                System.out.println(\"\
    You are 20 year old\");\n                break;\n            default:\n      \
    \          System.out.println(\"Other age\");\n        }\n    }\n}\n```\n"
