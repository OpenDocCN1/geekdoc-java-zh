  You are not 50 year old\");\n            }\n            // 如果 age 是 60 或 70\n  \
  \          if (age == 60 || age == 70) {\n                System.out.println(\"\
  You are 60 or 70 year old\");\n            }\n        }\n    }\n}\n```\n\nOutput\n\
  ```\nYou are between 19 and 39\n```\n\n# 第 4 章：Java 中的 switch 语句\n\n## 1. switch\
  \ 语句的结构\n## 2. switch 示例\n## 3. switch 中的 break 语句\n\n### 1. switch 语句的结构\n\n```java\n\
  // variable_to_test: 待测试的变量。\nswitch ( variable_to_test ) {\n    case value1: //在此处操作\n\
  \    break;\n    case value2: //在此处操作\n    break;\n    default: //在此处操作\n}\n```\n\
  \n`switch` 语句的特点：\n\n`switch` 会检查变量的值并从上到下与每个值进行比较。每个值被称为一个 `case`。当 `case` 为真时，将执行该\
  \ `case` 的语句块。\n\n![](img/image_rsrc6ZM.jpg)\n\n如果所有 cases 都为假，将执行 `default` 语句。注意：在\
  \ switch 语句的结构中，可能没有 `default` 语句。\n\n![](img/image_rsrc6ZN.jpg)\n\n当找到 true case\
  \ 时，将执行该 case 的语句块。如果没有遇到 break 语句，程序将继续执行。`break` 语句会让程序退出。\n\n![](img/image_rsrc6ZP.jpg)\n\
  \n注意：在 switch 语句的结构中，可能没有 `default` 语句。\n\n```java\n// variable_to_test: 待测试的变量。\n\
  switch ( variable_to_test ) {\n    case value1: //在此处操作\n    break;\n    case value2:\
  \ //在此处操作\n    break;\n    default: //在此处操作\n}\n```\n\n### 2. switch 示例\n\nSwitchExample1.java\n\
  \n```java\npackage com.abd.java.javabasic.controlflow;\npublic class SwitchExample\
  \ {\n    public static void main(String[] args) {\n        int age = 20;\n     \
  \   switch (age) {\n            case 18:\n                System.out.println(\"\
  You are 18 year old\");\n                break;\n            case 20:\n        \
  \        System.out.println(\"You are 20 year old\");\n                break;\n\
  \            default:\n                System.out.println(\"Other age\");\n    \
  \    }\n    }\n}\n```\n\nOutput\n```\nYou are 20 year old\n```\n\n### 3. switch\
  \ 中的 break 语句\n\n`break` 语句用于退出 `switch` 块。\n\n```java\npackage com.abd.java.javabasic.controlflow;\n\
  public class SwitchExample1 {\n    public static void main(String[] args) {\n  \
  \      int age = 20;\n        switch (age) {\n            case 18:\n           \
  \     System.out.println(\"You are 18 year old\");\n                break;\n   \
  \         case 20:\n                System.out.println(\"You are 20 year old\");\n\
  \                break;\n            default:\n                System.out.println(\"\
  Other age\");\n        }\n    }\n}\n```\n\n\n\n\n```java\npackage com.abd.java.javabasic.loop;\n\
  public class ForLoopExample2 {\n    // 这是一个计算 1 到 100 之和的示例，\n    //并将结果打印到控制台。\n\
  \    public static void main(String[] args) {\n        // 声明一个变量\n        int total\
  \ = 0;\n        // 声明一个变量值\n        // 初始值为 1\n        // 每次迭代后通过加 1 增加 'value'\n\
  \        // 注意：value++ 等于语句：value = value + 1;\n        // value-- 等于语句：value =\
  \ value - 1;\n        for (int value = 1; value <= 100; value++) {\n           \
  \ // 通过加 'value' 增加 'total'。\n            total = total + value;\n        }\n  \
  \      System.out.println(\"Total = \" + total);\n    }\n}\n```\n\n**输出**\n```\n\
  Total = 5050\n```\n\n### 3 for-each 循环\n\n```java\n// arrayOrCollection: 数组或集合\n\
  for (Type variable: arrayOrCollection) {\n    // 代码 ...\n}\n```\n\n**示例：**\n\nForeachExample.java\n\
  \n```java\npackage com.abd.java.javabasic.loop;\npublic class ForeachExample {\n\
  \    public static void main(String[] args) {\n        // 声明一个 String 数组。\n    \
  \    String[] fruits = new String[] { \"Apple\", \"Apricot\", \"Banana\" };\n  \
  \      // 用于遍历数组的 for-each 循环。\n        for (String fruit : fruits) {\n        \
  \    System.out.println(fruit);\n        }\n    }\n}\n```\n\n**输出**\n```\nApple\n\
  Apricot\nBanana\n```\n\n### 4 while 循环\n\n`while` 循环用于在条件仍然为真时重复执行程序段。`while` 循环通常用于迭代次数未定义（不固定）的情况。\n\
  \n这是 while 循环的结构：\n\n```java\n// 如果 while 条件为真，则执行某些操作。\nwhile ( condition ) {\n\
  \    // 在此处执行某些操作...\n}\n```\n\nWhileExample1.java\n```java\npackage com.abd.java.javabasic.loop;\n\
  public class WhileExampe1 {\n    public static void main(String[] args) {\n    \
  \    int value = 3;\n        // 当 'value' 仍然小于 10 时，循环继续。\n        while (value\
  \ < 10) {\n            System.out.println(\"Value = \" + value);\n            //\
  \ 通过加 2 增加 'value'\n            value = value + 2;\n        }\n    }\n}\n```\n\n\
  ### 5 do-while 循环\n\n`do-while` 循环用于多次执行程序段。`do-while` 的特点是语句块至少会被执行一次。每次迭代后，程序将检查条件，如果条件仍然正确，则将再次执行语句块。\n\
  \n这是 do-while 循环的结构：\n\n```java\n// do-while 循环至少执行一次迭代。\n// 只要条件为真，它就会继续工作\ndo\
  \ {\n    // 在此处执行某些操作。\n} while (condition);\n```\n\nDoWhileExample1.java\n```java\n\
  package com.abd.java.javabasic.loop;\npublic class DoWhileExample1 {\n    public\
  \ static void main(String[] args) {\n        int value = 3;\n        // do-while\
  \ 循环至少执行一次\n        do {\n            System.out.println(\"Value = \" + value);\n\
  \            // 加 3\n            value = value + 3;\n        } while (value < 10);\n\
  \    }\n}\n```\n\n**输出**\n```\nValue = 3\nValue = 6\nValue = 9\n```\n\n### 6 循环中的\
  \ break 语句\n\n`break` 语句可以出现在循环中。它是帮助程序退出循环的语句。\n\n![](img/image_rsrc6ZS.jpg)\n\n\
  LoopBreakExample.java\n```java\npackage com.abd.java.javabasic.loop;\npublic class\
  \ LoopBreakExample {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Break example\");\n        int x = 2;\n        while (x < 15) {\n            System.out.println(\"\
  ----------------------\\n\");\n            System.out.println(\"x = \" + x);\n \
  \           // 如果 x = 5 则退出循环。\n            if (x == 5) {\n                break;\n\
  \            }\n            x++;\n            System.out.println(\"x after ++ =\
  \ \" + x);\n        }\n        System.out.println(\"Done!\");\n    }\n}\n```\n\n\
  **输出**\n```\nBreak example\n----------------------\nx = 2\nx after ++ = 3\n----------------------\n\
  x = 3\nx after ++ = 4\n----------------------\nx = 4\nx after ++ = 5\n----------------------\n\
  x = 5\nDone!\n```\n\n### 7 循环中的 continue 语句\n\n`continue` 语句可以出现在循环中。当遇到 `continue`\
  \ 语句时，程序将忽略块内的语句以及 `continue` 之后的语句，并开始新的迭代（如果条件仍然正确的话）。\n\n![](img/image_rsrc6ZT.jpg)\n\
  \nLoopContinueExample.java\n```java\npackage com.abd.java.javabasic.loop;\npublic\
  \ class LoopContinueExample {\n    public static void main(String[] args) {\n  \
  \      System.out.println(\"Continue example\");\n        int x = 2;\n        while\
  \ (x < 7) {\n            System.out.println(\"----------------------\\n\");\n  \
  \          System.out.println(\"x = \" + x);\n            // x = x + 1;\n      \
  \      x++;\n            // % 运算符用于计算余数。\n            // 如果 x 是偶数，则忽略 'continue'\
  \ 下方的命令行，\n            // 开始新的迭代（如果条件仍然为真）。\n            if (x % 2 == 0) {\n   \
  \             continue;\n            }\n            System.out.println(\"x after\
  \ ++ = \" + x);\n        }\n        System.out.println(\"Done!\");\n    }\n}\n```\n\
  \n**输出**\n```\nContinue example\n----------------------\nx = 2\nx after ++ = 3\n\
  ----------------------\nx = 3\n----------------------\nx = 4\nx after ++ = 5\n----------------------\n\
  x = 5\nx after ++ = 6\n----------------------\nx = 6\nDone!\n```\n\n### 8 标签循环\n\
  \n`break` 和 `continue` 语句可以在带有标签的循环中使用。当你有嵌套循环并且想要跳出或继续外部循环而不是内部循环时，这非常有用。\n\n```java\n\
  label1: for (int i = 0; i < 5; i++) {\n    label2: for (int j = 0; j < 5; j++) {\n\
  \        if (i == 2 && j == 2) break label1; // 跳出外部循环\n        if (j == 1) continue\
  \ label2; // 继续内部循环\n        System.out.println(\"i = \" + i + \", j = \" + j);\n\
  \    }\n}\n```\n\n### 第六章：Java 中的数组\n\n1. 什么是数组\n2. 一维数组\n3. 一维数组与 for-each 循环\n\
  4. 一维数组的工具方法\n5. 二维数组\n\n#### 1 什么是数组\n\n在 Java 中，数组是一组具有相同类型的元素，在内存中是连续的。数组具有固定数量的元素且无法更改大小。\n\
  \n![](img/image_rsrc6ZV.jpg)\n\n数组元素通过索引标记，从索引 0 开始。你可以通过索引访问它的元素。\n\n让我们看一个包含 5\
  \ 个元素的 int 数组。\n\n![](img/image_rsrc6ZW.jpg)\n\n除了一维数组外，你有时需要处理二维或多维数组。对于二维数组，其元素用两个索引标记，例如行索引和列索引。下面是一个二维数组的图像。\n\
  \n![](img/image_rsrc6ZX.jpg)\n\n#### 2 一维数组\n\n如何在 Java 中声明数组。\n\n```java\n// 声明数组，未指定元素数量。\n\
  int[] array1;\n// 初始化数组为 100 个元素\n// 元素尚未赋值特定值\narray1 = new int[100];\n// 声明指定元素数量的数组\n\
  // 元素尚未赋值特定值\ndouble[] array2 = new double[10];\n// 声明已赋值特定值的数组\n// 此数组有 4 个元素\n\
  long[] array3= {10L, 23L, 30L, 11L};\n```\n\n让我们看一个示例：\n\n![](img/image_rsrc6ZY.jpg)\n\
  \nArrayExample1.java\n\n\n\n\n\n```java\npackage com.abd.java.javabasic.array;\n\
  public class ArrayExample1 {\n    public static void main(String[] args) {\n   \
  \     // 声明一个包含 5 个元素的数组\n        int[] myArray = new int[5];\n        // 注意：数组的第一个元素索引从\
  \ 0 开始\n        // 给第一个元素（索引 0）赋值\n        myArray[0] = 10;\n        // 给第二个元素（索引\
  \ 1）赋值\n        myArray[1] = 14;\n        myArray[2] = 36;\n        myArray[3] =\
  \ 27;\n        // 给第 5 个元素（数组的最后一个元素）赋值\n        myArray[4] = 18;\n        // 打印元素计数。\n\
  \        System.out.println(\"Array Length=\" + myArray.length);\n        // 打印控制台索引为\
  \ 3 的元素（数组中的第 4 个元素）\n        System.out.println(\"myArray[3]=\" + myArray[3]);\n\
  \        // 使用 for 循环打印数组中的元素。\n        for (int index = 0; index < myArray.length;\
  \ index++) {\n            System.out.println(\"Element \" + index + \" = \" + myArray[index]);\n\
  \        }\n    }\n}\n```\n\n**输出**\n```\nArray Length=5\nmyArray[3]=27\nElement\
  \ 0 = 10\nElement 1 = 14\nElement 2 = 36\nElement 3 = 27\nElement 4 = 18\n```\n\n\
  ArrayExample2.java\n```java\npackage com.abd.java.javabasic.array;\npublic class\
  \ ArrayExample2 {\n    public static void main(String[] args) {\n        // 声明一个包含\
  \ 5 个元素的数组\n        int[] myArray = new int[5];\n        // 打印元素计数\n        System.out.println(\"\
  Array Length=\" + myArray.length);\n        // 使用循环为数组元素赋值。\n        for (int index\
  \ = 0; index < myArray.length; index++) {\n            myArray[index] = 100 * index\
  \ * index + 3;\n        }\n        // 打印索引为 3 的元素\n        System.out.println(\"\
  myArray[3] = \" + myArray[3]);\n    }\n}\n```\n\n**输出**\n```\nArray Length=5\nmyArray[3]\
  \ = 903\n```\n\n### 3 一维数组和 for-each 循环\n\nJava 5 为你提供了 for-each 循环，允许你在不使用索引变量的情况下遍历数组的所有元素。\n\
  \n示例：\n\nArrayForeachExample.java\n```java\npackage com.abd.java.javabasic.array;\n\
  public class ArrayForeachExample {\n    public static void main(String[] args) {\n\
  \        // 声明一个 String 数组。\n        String[] fruits = new String[] { \"Apple\"\
  , \"Apricot\", \"Banana\" };\n        // 遍历数组的 for-each 循环。\n        for (String\
  \ fruit : fruits) {\n            System.out.println(fruit);\n        }\n    }\n\
  }\n```\n\n**输出**\n```\nApple\nApricot\nBanana\n```\n\n### 4 一维数组的工具方法\n\nJava 为你提供了一些数组的静态方法，例如排序数组、为所有数组元素赋值、搜索、比较数组等。这些方法定义在\
  \ `Arrays` 类中。\n\n下面是 `Arrays` 类中定义的一些非常有用的静态方法。这些方法适用于 `byte`、`char`、`double`、`float`、`long`、`int`、`short`、`boolean`\
  \ 类型的数组。\n\n- 传递相同类型的参数并返回 List。`public static <T> List<T> asList(T... a)` 类型：byte,\
  \ char, double, float, long, int, short, boolean\n- 搜索数组中值的索引（使用二分查找算法）。`public\
  \ static int binarySearch(X[] a, X key)`\n- 复制数组元素以创建一个指定长度的新数组。`public static int[]\
  \ copyOf(X[] original, X newLength)`\n- 将指定数组的指定范围复制到新数组中。`public static double[]\
  \ copyOfRange(X[] original, int from, int to)`\n- 比较两个数组：`public static boolean\
  \ equals(X[] a, long[] a2)`\n- 给数组的所有元素赋相同的值。`public static void fill(X[] a, X val)`\n\
  - 将数组转换为字符串。`public static String toString(X[] a)`\n\n以下示例使用了了 `Arrays` 类的一些方法。\n\
  \nArraysExample.java\n```java\npackage com.abd.java.javabasic.array;\nimport java.util.Arrays;\n\
  import java.util.List;\npublic class ArraysExample {\n    public static void main(String[]\
  \ args) {\n        int[] years = new int[] { 2001, 1994, 1995, 2000, 2017 };\n \
  \       // 排序\n        Arrays.sort(years);\n        for (int year : years) {\n \
  \           System.out.println(\"Year: \" + year);\n        }\n        // 将数组转换为字符串。\n\
  \        String yearsString = Arrays.toString(years);\n        System.out.println(\"\
  Years: \" + yearsString);\n        // 从多个值创建列表。\n        List<String> names = Arrays.asList(\"\
  Tom\", \"Jerry\", \"Donald\");\n        for (String name : names) {\n          \
  \  System.out.println(\"Name: \" + name);\n        }\n    }\n}\n```\n\n**输出**\n\
  ```\nYear: 1994\nYear: 1995\nYear: 2000\nYear: 2001\nYear: 2017\nYears: [1994, 1995,\
  \ 2000, 2001, 2017]\nName: Tom\nName: Jerry\nName: Donald\n```\n\n### 5 二维数组\n\n\
  二维数组的行和列用 0, 1, 2 等索引标记。访问二维数组的元素需要两个索引：行索引和列索引。\n\n![](img/image_src6.jpg)\n\n\
  你有三种方法声明二维数组：\n\n- 声明具有 5 行 10 列的数组：`Type[][] myArray1 = new Type[5][10];`\n- 声明具有\
  \ 5 行的二维数组（数组数组）：`Type[][] myArray2 = new Type[5][];`\n- 声明二维数组并指定元素的值：`Type[][]\
  \ myArray3 = new Type[][]{{value0, value1, value2},{value3, value4, value5}};`\n\
  \n**注意**：`Type` 既可以是基本类型（`byte`、`char`、`double`、`float`、`long`、`int`、`short`、`boolean`），也可以是引用类型。如果你声明基本类型数组，元素具有默认值：\n\
  \n- 默认值 `0` 对应 `byte`、`double`、`long`、`int`、`short` 类型。\n- 默认值 `false` 对应 `boolean`\
  \ 类型。\n- 默认值 `\\u0000` 对应 `char` 类型。\n\n相反，如果你声明引用类型数组，元素是 `null`。\n\n示例：\n\nTwoDimensionalExample.java\n\
  ```java\npackage com.abd.java.javabasic.array;\npublic class TwoDimensionalExample\
  \ {\n    public static void main(String[] args) {\n        // 声明具有 2 行 3 列的二维数组\n\
  \        // 元素具有默认值\n        int[][] myArray = new int[2][3];\n        // 二维数组的行数。\n\
  \        System.out.println(\"Length of myArray: \"+ myArray.length); // 2\n   \
  \     // 打印\n        for (int row = 0; row < 2; row++) {\n            for (int col\
  \ = 0; col < 3; col++) {\n                System.out.println(\"myArray[\" + row\
  \ + \",\" + col + \"]=\" + myArray[row][col]);\n            }\n        }\n     \
  \   System.out.println(\" --- \");\n        // 给元素赋值。\n        for (int row = 0;\
  \ row < 2; row++) {\n            for (int col = 0; col < 3; col++) {\n         \
  \       myArray[row][col] = (row + 1) * (col + 1);\n            }\n        }\n \
  \       // 打印\n        for (int row = 0; row < 2; row++) {\n            for (int\
  \ col = 0; col < 3; col++) {\n                System.out.println(\"myArray[\" +\
  \ row + \",\" + col + \"]=\" + myArray[row][col]);\n            }\n        }\n \
  \   }\n}\n```\n\n**输出**\n```\nLength of myArray: 2\nmyArray[0,0]=0\nmyArray[0,1]=0\n\
  myArray[0,2]=0\nmyArray[1,0]=0\nmyArray[1,1]=0\nmyArray[1,2]=0\n ---\nmyArray[0,0]=1\n\
  myArray[0,1]=2\nmyArray[0,2]=3\nmyArray[1,0]=2\nmyArray[1,1]=4\nmyArray[1,2]=6\n\
  ```\n\n二维数组实际上是数组的数组。\n\n在 Java 中，二维数组是数组数组，因此你可以可以通过指定行数而不指定列数来声明二维数组。因为二维数组是“数组数组”，二维数组的\
  \ `length` 属性返回数组的行数。\n\n![](img/image_src700.jpg)\n\n\n\n\n\n| 团队数量：2Us 玩家数量：3Vn\
  \ 玩家数量：2 位于[0][0]=Sam 位于[0][1]=Smith 位于[0][2]=Robert 位于[1][0]=Tran 位于[1][1]=Nguyen\
  \ |\n\n#### 示例：`TwoDimensionalExample3.java`\n\n```java\npackage com.abd.java.javabasic.array;\n\
  public class TwoDimensionalExample3 {\n    public static void main(String[] args)\
  \ {\n        // 声明一个二维数组（数组的数组）。\n        // 有 2 行。\n        String[][] teamAndPlayers\
  \ = new String[2][];\n        // 美国玩家\n        teamAndPlayers[0] = new String[]{\
  \ \"Sam\", \"Smith\", \"Robert\" };\n        // 越南玩家\n        teamAndPlayers[1]\
  \ = new String[]{ \"Tran\", \"Nguyen\" };\n        for (int row = 0; row < teamAndPlayers.length;\
  \ row++) {\n            String[] players = teamAndPlayers[row];\n            for\
  \ (int col = 0; col < players.length; col++) {\n                System.out.println(\"\
  Player at[\" + row + \"][\" + col + \"]=\" + teamAndPlayers[row][col]);\n      \
  \      }\n        }\n    }\n}\n```\n\n## 输出\n\n| 位于[0][0]=Sam 位于[0][1]=Smith 位于[0][2]=Robert\
  \ 位于[1][0]=Tran 位于[1][1]=Nguyen |\n\n# 第 7 章：Java 中的继承与多态\n\n## 1. 引言\n2. 类、构造函数与实例\n\
  3. Java 中的继承\n4. Java 中的多态\n\n### 1. 引言\n继承和多态——这是 Java 中一个非常重要的概念。如果你想学习 Java，就必须更好地理解它。\n\
  \n### 2. 类、构造函数与实例\n在开始学习 Java 继承之前，你需要显式地理解类、构造函数和实例。我们考虑 `Person` 类，它描述了一个包含全名、出生年份、出生地信息的的人。\n\
  \n#### `Person.java`\n\n```java\npackage com.abd.java.inheritance.basic;\npublic\
  \ class Person {\n    // 字段名 - 人的名字。\n    private String name;\n    // 字段出生年份\n\
  \    private Integer bornYear;\n    // 字段出生地。\n    private String placeOfBirth;\n\
  \n    // 构造函数有 3 个参数。\n    // 目标是给 Person 的字段赋值。\n    // 指定人的名字、出生年份、出生地。\n    public\
  \ Person(String name, Integer bornYear, String placeOfBirth) {\n        this.name\
  \ = name;\n        this.bornYear = bornYear;\n        this.placeOfBirth = placeOfBirth;\n\
  \    }\n\n    // 构造函数有 2 个参数。\n    // 目标是给 Person 的名字、出生年份字段赋值。\n    // 未分配出生地。\n\
  \    public Person(String name, Integer bornYear) {\n        this.name = name;\n\
  \        this.bornYear = bornYear;\n    }\n\n    public String getName() {\n   \
  \     return name;\n    }\n\n    public void setName(String name) {\n        this.name\
  \ = name;\n    }\n    public Integer getBornYear() {\n        return bornYear;\n\
  \    }\n    public void setBornYear(Integer bornYear) {\n        this.bornYear =\
  \ bornYear;\n    }\n    public String getPlaceOfBirth() {\n        return placeOfBirth;\n\
  \    }\n    public void setPlaceOfBirth(String placeOfBirth) {\n        this.placeOfBirth\
  \ = placeOfBirth;\n    }\n}\n```\n\n#### `PersonDemo.java`\n\n```java\npackage com.abd.java.inheritance.basic;\n\
  public class PersonDemo {\n    public static void main(String[] args) {\n      \
  \  // 实例：托马斯·迪森。\n        Person edison = new Person(\"Thomas Edison\", 1847);\n\
  \        System.out.println(\"Info:\");\n        System.out.println(\"Name: \" +\
  \ edison.getName());\n        System.out.println(\"Born Year: \" + edison.getBornYear());\n\
  \        System.out.println(\"Place Of Birth: \" + edison.getPlaceOfBirth() );\n\
  \        // 实例：比尔·盖茨\n        Person billGates = new Person(\"Bill Gate\", 1955,\
  \ \"Seattle, Washington\");\n        System.out.println(\"Info:\");\n        System.out.println(\"\
  Name: \" + billGates.getName());\n        System.out.println(\"Born Year: \" + billGates.getBornYear());\n\
  \        System.out.println(\"Place Of Birth: \" + billGates.getPlaceOfBirth());\n\
  \    }\n}\n```\n\n### 区分类、构造函数和实例\n`Person` 模拟了一个人的类，它是抽象的，但它包含信息。在上面的示例中，信息是名字、出生年份和出生地。\n\
  \n### 构造函数\n- 构造函数的名称始终与类名相同。\n- 一个类可以有一个或多个构造函数。\n- 带有参数或不带参数的构造函数，不带参数构造函数被称为默认构造函数。\n\
  - 构造函数用于创建类的实例。\n- 参见示例，从构造函数创建对象（实例）。\n\n!![](img/image_rsrc701.jpg)\n\n## 3. Java\
  \ 中的继承\n我们需要几个类来参与示例。\n- `Animal`：模拟动物的类。\n- `Duck`：`Animal` 的子类。\n- `Cat`：`Animal`\
  \ 的子类。\n- `Mouse`：`Animal` 的子类。\n\n!![](img/image_rsrc702.jpg)\n\n```java\npublic\
  \ abstract getAnimalName();\n```\n\n\n\n\n## InstanceofDemo.java\n\n```java\npackage\
  \ com.abd.java.inheritance.demo;\nimport com.abd.java.inheritance.animal.Animal;\n\
  import com.abd.java.inheritance.animal.Cat;\nimport com.abd.java.inheritance.animal.Mouse;\n\
  \npublic class InstanceofDemo {\n    public static void main(String[] args) {\n\
  \        // 创建一个 Animal 对象\n        // Animal 是抽象类，\n        // 你无法通过 Animal 的构造函数来创建对象。\n\
  \        Animal tom = new Cat(\"Tom\", 3, 20);\n        System.out.println(\"name:\
  \ \" + tom.getName());\n        System.out.println(\"animalName: \" + tom.getAnimalName());\n\
  \n        // 使用 'instanceof' 运算符来\n        // 检查一个对象是否是特定类的实例。\n        boolean\
  \ isMouse = tom instanceof Mouse;\n        System.out.println(\"Tom is mouse? \"\
  \ + isMouse);\n        boolean isCat = tom instanceof Cat;\n        System.out.println(\"\
  Tom is cat? \" + isCat);\n        boolean isAnimal = tom instanceof Animal;\n  \
  \      System.out.println(\"Tom is animal? \" + isAnimal);\n    }\n}\n```\n\n**输出**\n\
  ```\nname: Tom\nanimalName: Cat\nTom is mouse? false\nTom is cat? true\nTom is animal?\
  \ true\n```\n\n## InheritMethodDemo.java\n\n```java\npackage com.abd.java.inheritance.demo;\n\
  import com.abd.java.inheritance.animal.Cat;\n\npublic class InheritMethodDemo {\n\
  \    public static void main(String[] args) {\n        // 创建 Cat 的实例\n        Cat\
  \ tom = new Cat(\"Tom\", 3, 20);\n        // 调用从父类（Animal）继承而的方法。\n        System.out.println(\"\
  name: \" + tom.getName());\n        System.out.println(\"animalName: \" + tom.getAnimalName());\n\
  \        System.out.println(\"-----------------\");\n        // 调用 Cat 类中声明的方法。\n\
  \        System.out.println(\"Age: \" + tom.getAge());\n        System.out.println(\"\
  Height: \" + tom.getHeight());\n    }\n}\n```\n\n**输出**\n```\nname: Tom\nanimalName:\
  \ Cat\n-----------------\nAge: 3\nHeight: 20\n```\n\n## Java 中的类型转换\n\n### CastDemo.java\n\
  \n```java\npackage com.abd.java.inheritance.demo;\nimport java.util.Random;\nimport\
  \ com.abd.java.inheritance.animal.Animal;\nimport com.abd.java.inheritance.animal.Cat;\n\
  import com.abd.java.inheritance.animal.Mouse;\n\npublic class CastDemo {\n    //\
  \ 此方法返回一个随机动物。\n    public static Animal getRandomAnimal() {\n        // 返回一个随机值\
  \ 0 或 1。\n        int random = new Random().nextInt(2);\n        Animal animal =\
  \ null;\n        if (random == 0) {\n            animal = new Cat(\"Tom\", 3, 20);\n\
  \        } else {\n            animal = new Mouse(\"Jerry\", 5);\n        }\n  \
  \      return animal;\n    }\n\n    public static void main(String[] args) {\n \
  \       Animal animal = getRandomAnimal();\n        if (animal instanceof Cat) {\n\
  \            // 强制转换为 Cat\n            Cat cat = (Cat) animal;\n            // 并调用\
  \ Cat 类的方法。\n            System.out.println(\"Cat height: \" + cat.getHeight());\n\
  \        } else if (animal instanceof Mouse) {\n            // 强制转换为 Mouse。\n  \
  \          Mouse mouse = (Mouse) animal;\n            // 并调用 Mouse 类的方法。\n     \
  \       System.out.println(\"Mouse weight: \" + mouse.getWeight());\n        }\n\
  \    }\n}\n```\n\n## 4 Java 中的多态\n\n你有一只猫亚洲猫（Asian Cat），你可以称它是一只猫（Cat），也可以称它是一只动物（Animal），这就是多态的一个方面。\n\
  \n或者另一个例子：在你的简历上记录你是一个亚洲男性，但你实际上是一个越南人。\n\n下面的示例展示了你如何在声明与现实之间表现。\n\n`AsianCat`\
  \ 是 `Cat` 类的子类。\n\n### AsianCat.java\n\n```java\npackage com.abd.java.inheritance.animal;\n\
  public class AsianCat extends Cat {\n    public AsianCat(String name, int age, int\
  \ height) {\n        super(name, age, height);\n    }\n    // 重写父类（Cat）的方法\n   \
  \ @Override\n    public String getAnimalName() {\n        return \"Asian Cat\";\n\
  \    }\n}\n```\n\nJava 的多态通过下面的插描述：\n\n![](img/image_rsrc704.jpg)\n\n### PolymorphismDemo.java\n\
  \n```java\npackage com.abd.java.polymorphism;\nimport com.abd.java.inheritance.animal.AsianCat;\n\
  import com.abd.java.inheritance.animal.Cat;\n\npublic class PolymorphismDemo {\n\
  \    public static void main(String[] args) {\n        Cat cat1 = new Cat(\"Tom\"\
  , 3, 20);\n        Cat cat2 = new AsianCat(\"ATom\", 2, 19);\n        System.out.println(\"\
  Animal Name of cat1: \" + cat1.getAnimalName());\n        System.out.println(\"\
  Animal Name of cat2: \" + cat2.getAnimalName());\n    }\n}\n```\n\n**输出**\n```\n\
  Animal Name of cat1: Cat\nAnimal Name of cat2: Asian Cat\n```\n\n\n\n\n```java\n\
  // 类只能继承自一个父类。\n// 但可以实现（继承）多个接口。\npublic class Cat extends Animal implements CanEat,\
  \ CanDrink {\n    // ....\n}\n```\n\n# 5 接口的结构\n\n### `NoAccessModifierInterface.java`\n\
  ```java\npackage com.abd.java.itf;\n// 这是一个没有指定访问修饰符的接口。\n// 它的访问修饰符是默认的。\n// 只有同一包中的类可以实现这个接口。\n\
  interface NoAccessModifierInterface {}\n```\n\n### `CanMove.java`\n```java\npackage\
  \ com.abd.java.itf;\n// 这个接口定义了一个关于\n// 移动能力的标准。\npublic interface CanMove {\n \
  \   // 接口中的方法总是抽象且公共的。\n    public abstract void run();\n    // 即使你没有指定 'public\
  \ abstract', java 也总是理解。\n    void back();\n    // 速度。\n    public int getVelocity();\n\
  }\n```\n\n### `CanDrink.java`\n```java\npackage com.abd.java.itf;\n// 这个接口定义了一个关于\n\
  // 饮能力的标准。\npublic interface CanDrink {\n    // 接口中的字段始终是 'public static final'。\n\
  \    // 无论你是否声明。\n    public static final String PEPSI = \"PEPSI\";\n    final String\
  \ NUMBER_ONE = \"NUMBER ONE\";\n    String SEVENUP = \"SEVEN UP\";\n    public void\
  \ drink();\n}\n```\n\n# 6 类实现接口\n\n### `Animal.java`\n```java\npackage com.abd.java.cls;\n\
  import com.abd.java.itf.CanMove;\n// 这个类继承自 Object。\n// 并实现了 CanMove 接口。\n// CanMove\
  \ 有 3 个抽象方法。\n// 这个类只实现了 CanMove 的一个抽象方法。\n// 因此它必须声明为抽象类。\n// 剩余的抽象方法将在子类中实现。\n\
  public abstract class Animal implements CanMove {\n    // 实现 CanMove 的 run() 方法。\n\
  \    @Override\n    public void run() {\n        System.out.println(\"Animal run...\"\
  );\n    }\n}\n```\n\n### `Cat.java`\n```java\npackage com.abd.java.cls;\nimport\
  \ com.abd.java.itf.CanDrink;\nimport com.abd.java.itf.CanEat;\n// 这个类继承 Animal 并实现了\
  \ CanEat, CanDrink 接口。\n// 这个类没有声明为抽象类。\n// 所以它必须实现接口所有的抽象方法。\npublic class Cat\
  \ extends Animal implements CanEat, CanDrink {\n    private String name;\n    public\
  \ Cat(String name) {\n        this.name = name;\n    }\n    public String getName()\
  \ {\n        return this.name;\n    }\n    // 实现 CanMove 的方法\n    @Override\n  \
  \  public void back() {\n        System.out.println(name + \" cat back ...\");\n\
  \    }\n    // 实现 CanMove 的方法。\n    @Override\n    public int getVelocity() {\n\
  \        return 110;\n    }\n    // 实现 CanEat 的方法。\n    @Override\n    public void\
  \ eat() {\n        System.out.println(name + \" cat eat ...\");\n    }\n    // 实现\
  \ CanDrink 的方法。\n    @Override\n    public void drink() {\n        System.out.println(name\
  \ + \" cat drink ...\");\n    }\n}\n```\n\n### `Mouse.java`\n```java\npackage com.abd.java.cls;\n\
  import com.abd.java.itf.CanDrink;\nimport com.abd.java.itf.CanEat;\npublic class\
  \ Mouse extends Animal implements CanEat, CanDrink {\n    @Override\n    public\
  \ void back() {\n        System.out.println(\"Mouse back ...\");\n    }\n    @Override\n\
  \    public int getVelocity() {\n        return 85;\n    }\n    @Override\n    public\
  \ void drink() {\n        System.out.println(\"Mouse drink ...\");\n    }\n    @Override\n\
  \    public void eat() {\n        System.out.println(\"Mouse eat ...\");\n    }\n\
  }\n```\n\n### `AnimalDemo.java`\n```java\npackage com.abd.java.cls;\nimport com.abd.java.itf.CanEat;\n\
  public class AnimalDemo {\n    public static void main(String[] args) {\n      \
  \  // 从 CanDrink 接口继承静态字段。\n        System.out.println(\"Drink \" + Cat.SEVENUP);\n\
  \        // 创建 CanEat 对象\n        // 通过 Cat 的构造函数。\n        CanEat canEat1 = new\
  \ Cat(\"Tom\");\n        // 一个声明为 CanEat 的对象。\n        // 但实际上是 Mouse。\n       \
  \ CanEat canEat2 = new Mouse();\n        // 此处展示多态。\n        // Java 知道对象的实际类型。\n\
  \        // ==> Tom cat eat ...\n        canEat1.eat();\n        // ==> Mouse eat\
  \ ...\n        canEat2.eat();\n        boolean isCat = canEat1 instanceof Cat;\n\
  \        System.out.println(\"catEat1 is Cat? \" + isCat);\n        // 强制转换\n  \
  \      if (canEat2 instanceof Mouse) {\n            Mouse mouse = (Mouse) canEat2;\n\
  \            // 调用 drink 方法（继承自 CanDrink）。\n            mouse.drink();\n       \
  \ }\n    }\n}\n```\n\n### 输出\n```\nDrink SEVEN UP\nTom cat eat ...\nMouse eat ...\n\
  catEat1 is Cat? true\nMouse drink ...\n```\n\n# 第 9 章：软件安装\n\n## 1 简介\n- 第一步 $\\\
