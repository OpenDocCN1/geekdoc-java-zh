  5. `Python 运算符重载`\n\n### 第 7 章：高级\n1. `Python 文件`\n2. `Python 文本文件`\n3. `Python\
  \ 异常`\n4. `Python 测试`\n\n## 引言\n逐步学习 Python 编程。\n\nPython 的流行源于它的简单性、多功能性和健壮性。以下是它的主要特征之一：\n\
  \n- **可读且简单的语法**：Python 的语法设计得易于阅读和编写，让初学者和资深程序员都能轻松上手。它强调可读性，降低了程序的维护和开发成本。\n-\
  \ **丰富的标准库**：Python 自带了一个庞大的标准库，为字符串处理、文件 I/O、网络等各种任务提供了模块和包。这个丰富的库减少了对额外第三方模块的需求，并简化了开发。\n\
  - **动态类型和动态绑定**：Python 是动态类型，这意味着你不需要声明变量的类型。这允许更大的灵活性和更快的开发周期。此外，Python 具有动态绑定特性，这意味着变量名在运行时绑定到对象上，为代码结构提供了更多的灵活性。\n\
  - **跨平台兼容性**：Python 支持所有主流操作系统（Windows、macOS、Linux），并可以在平台间迁移。这允许开发者编写一次代码并在任何地方运行，使其具有极高的通用性。\n\
  - **高层语言**：Python 抽象了许多如内存管理等低级细节，并提供了高层数据类型和结构，使用户更容易专注于解决问题，而不是处理实现细节。\n- **对多种编程范式的支持**：Python\
  \ 支持多种编程范式，包括过程化、面向对象和函数式编程。这种灵活性允许开发者根据特定需求选择合适的方法。\n- **庞大活跃的社区**：Python 拥有庞大且活跃的开发者社区，他们为\
  \ Python 的增长和发展做出贡献。这种社区支持意味着 Python 开发有丰富的资源、库、框架和工具可用。\n- **可扩展性和性能**：虽然 Python\
  \ 的速度可能没有 C 或 C++ 等编译型语言快，但它对大多数应用程序都提供了良好的性能。此外，Python 可以轻松与高性能语言集成以处理性能关键型任务，并且有各种优化技术可以提高性能。\n\
  - **开源**：Python 是开源的，这意味着它的源代码免费可用，任何人都可以对其进行修改和分发。这促进了 Python 社区内部创新和协作。\n\n这些特征共同促进了\
  \ Python 的流行，以及它在 Web 开发、数据科学、机器学习、人工智能、科学计算、自动化等多个领域的广泛应用。\n\n### 第 1 章：Python\
  \ 简介\n### 1. 简介\nPython 的流行源于它的简单性、多功能性和健壮性。以下是它的主要特征之一：\n\n- **可读且简单的语法**：Python\
  \ 的语法设计得易于阅读和编写，让初学者和资深程序员都能轻松上手。它强调可读性，降低了程序的维护和开发成本。\n- **丰富的标准库**：Python 自带了一个庞大的标准库，为字符串处理、文件\
  \ I/O、网络等各种任务提供了模块和包。这个丰富的库减少了对额外第三方模块的需求，并简化了开发。\n- **动态类型和动态绑定**：Python 是动态类型，这意味着你不需要声明变量的类型。这允许更大的灵活性和更快的开发周期。此外，Python\
  \ 具有动态绑定特性，这意味着变量名在运行时绑定到对象上，为代码结构提供了更多的灵活性。\n- **跨平台兼容性**：Python 支持所有主流操作系统（Windows、macOS、Linux），并可以在平台间迁移。这允许开发者编写一次代码并在任何地方运行，使其具有极高的通用性。\n\
  - **高层语言**：Python 抽象了许多如内存管理等低级细节，并提供了高层数据类型和结构，使用户更容易专注于解决问题，而不是处理实现细节。\n- **对多种编程范式的支持**：Python\
  \ 支持多种编程范式，包括过程化、面向对象和函数式编程。这种灵活性允许开发者根据特定需求选择合适的方法。\n- **庞大活跃的社区**：Python 拥有庞大且活跃的开发者社区，他们为\
  \ Python 的增长和发展做出贡献。这种社区支持意味着 Python 开发有丰富的资源、库、框架和工具可用。\n- **可扩展性和性能**：虽然 Python\
  \ 的速度可能没有 C 或 C++ 等编译型语言快，但它对大多数应用程序都提供了良好的性能。此外，Python 可以轻松与高性能语言集成以处理性能关键型任务，并且有各种优化技术可以提高性能。\n\
  - **开源**：Python 是开源的，这意味着它的源代码免费可用，任何人都可以对其进行修改和分发。这促进了 Python 社区内部创新和协作。\n\n###\
  \ 安装解释器\nPython 是一种解释型语言，因此它在传统意义上不需要编译。然而，你确实需要在系统中安装 Python 解释器来运行 Python 代码。以下是如何下载和安装\
  \ Python：\n\n- **访问 Python 网站**：访问 Python 官网 `https://www.python.org/`。\n- **下载\
  \ Python**：在首页上，你会看到一个明显的下载 Python 按钮。点击它进入下载页面。\n- **选择安装程序**：你将看到不同版本的 Python。通常，你想要下载适用于你的操作系统（Windows、macOS\
  \ 或 Linux）的最新稳定版本。Python 发行版适用于 32 位和 64 位系统。\n- **下载安装程序**：点击与你的操作系统和架构匹配的安装程序下载链接。\n\
  - **运行安装程序**：一旦下载安装程序，双击下载的文件运行它。\n- **遵循安装向导**：安装向导将引导你完成安装过程。你可以选择安装目录、自定义安装选项，并安装\
  \ `pip`（Python 的包管理器）以及将 Python 添加到 `PATH`。\n- **完成安装**：配置好安装选项后继续安装。安装程序会将必要的文件复制到系统并设置\
  \ Python。\n- **验证安装**：安装完成后，可以通过打开命令提示符（Windows）或终端（macOS/Linux）并输入 `python --version`\
  \ 或 `python3 --version` 来验证 Python 安装正确。这将显示安装的 Python 版本。\n\n### Hello world\n\
  在 Python 中向控制台输出“你好！”非常简单。以下是代码：\n\n```python\nprint(\"你好!\")\n```\n\n你可以使用文本编辑器或集成开发环境（IDE）编写此代码，例如\
  \ Visual Studio Code、PyCharm 或 IDLE。将文件保存为 `.py` 扩展，例如 `hello_world.py`。\n\n运行 Python\
  \ 代码：\n\n1. 打开命令提示符（Windows）或终端（macOS/Linux）。\n2. 使用 `cd` 命令进入 Python 文件（`hello_world.py`）所在的目录。\n\
  3. 进入正确的目录后，输入 `python hello_world.py`（在某些系统上为 `python3 hello_world.py`）并按回车。这将执行\
  \ Python 脚本，你应该能在控制台上看到“你好！”。\n\n### 注释\n在 Python 中，你可以编写注释来记录代码或提供解释。注释会被 Python\
  \ 解释器忽略，是给人类读者看的。以下是在 Python 中编写注释的方法：\n\n单行注释：\n\n```python\n# 这是一个单行注释\nprint(\"\
  你好!\")  # 这也是单行注释\n```\n\n多行注释（技术上说是，未赋值给变量的多行字符串）：\n\n\n\n\n\n```python\n\"\"\"\
  这是一个多行注释。你可以在三引号内编写多行文本。这通常被用作文档字符串（docstring），用于记录函数或模块\"\"\"\nprint(\"Hello, World!\"\
  )\n```\n\n或者，你也可以使用 `#` 字符来注释掉多行：\n\n```python\n# 这是一个注释\n# 这是另一个注释\nprint(\"Hello,\
  \ World!\")\n```\n\n在 Python 中，编写清晰、简洁的注释来解释你的代码是一种常见的惯例，这使得其他人（以及你未来的自己）更容易理解代码的意图和功能。\n\
  \n# 2 Python 变量\n\n## 介绍\n\n在 Python 中，变量用于存储数据值。变量是一个指向内存中存储的句值的名称。与某些其他编程语言不同，Python\
  \ 是动态类型的，这意味着你不需要在给变量赋值之前先声明该变量的类型。以下是你在如何在 Python 中使用变量的方法：\n\n### 1. 变量赋值\n你可以使用\
  \ `=` 运算符为变量赋值。\n\n```python\nx = 10\nname = \"Alice\"\n```\n\n### 2. 变量命名规则\n*\
  \ 变量名必须以字母（`a-z`、`A-Z`）或下划线 `_` 开头。\n* 变量名可以包含字母、数字（`0-9`）和下划线 `_`。\n* 变量名大小敏感（`name`\
  \ 和 `Name` 是不同的变量）。\n* Python 关键字（例如 `if`、`for`、`while`、`def` 等）不能用变量名。\n\n### 3.\
  \ 数据类型\nPython 变量可以持有不同类型的值，包括：\n* 整数 (`int`)：整数，例如 `10`、`-5`、`1000`。\n* 浮点数 (`float`)：浮点数，例如\
  \ `3.14`、`2.718`。\n* 字符串 (`str`)：字符序列，例如 `\"Hello\"`、`'Python'`。\n* 布尔值 (`bool`)：表示\
  \ `True` 或 `False`。\n* 列表 (`list`)、元组 (`tuple`)、字典 (`dict`)、集合 (`set`) 等。\n\n```python\n\
  age = 25  # 整数\npi = 3.14  # 浮点数\nname = \"Alice\"  # 字符串\nis_student = True  #\
  \ 布尔\n```\n\n### 4. 变量重新赋值\n你可以通过给变量赋新值来改变它的值。\n\n```python\nx = 5\nx = x + 1  #\
  \ x 现在持有值 6\n```\n\n### 5. 作用域\n变量有作用域，定义了它们可以在哪里被访问。在函数内部定义的变量具有局部作用域，这意味着它们只能在该函数内部访问。在任何函数外部定义的变量具有全局作用域，可以从代码的任何地方访问。\n\
  \n```python\nx = 10  # 全局变量\ndef my_function():\n    y = 20  # 局部变量\n    print(x)\
  \  # 这里可以访问 x\n    print(y)  # 这里可以访问 y\n\nmy_function()\nprint(x)  # 这里可以访问 x\n\
  print(y)  # 错误：y 未定义\n```\n\n变量是 Python 编程的基础，因为它们允许你在程序中存储和操作数据。\n\n# 常量\n\n在 Python\
  \ 中，常量通常通过定义大写名称的变量来创建，并将其视为常量，尽管 Python 没有像某些其他编程语言那样内置对常量变量的支持。以下是你如何在 Python\
  \ 中创建常量的方法：\n\n```python\nMY_CONSTANT = 10\nANOTHER_CONSTANT = \"Hello\"\n```\n\n\
  按照惯例，常量通常使用大写字母，以便与普通变量区分。然而，需要注意的是，Python 并不强制执行；你仍然可以修改它们的值，但将它们视为不可变对象是一种惯例。\n\
  \n如果你想防止意外修改常量值，可以使用 `readonly` 或 `dataclass` 模块来创建不可变对象。以下是一个使用 `readonly` 的示例：\n\
  \n```python\nfrom readonly import readonly\n@readonly\nclass Constants:\n    MY_CONSTANT\
  \ = 10\n    ANOTHER_CONSTANT = \"Hello\"\n\n# 现在你无法修改这些常量的值了：\n# Constants.MY_CONSTANT\
  \ = 20  # 这将引发 AttributeError\n```\n\n# 第 2 章：Python 数据类型\n\n## 1 Python 布尔值\n\n\
  ### 介绍\n\n布尔值是 Python 中的一种表示真值的数据类型。它们只能取两个值之一：`True` 或 `False`。布尔值常用于条件语句、循环和逻辑操作中，用于控制程序的流程或表示比较的结果。\n\
  \n以下是你如何在 Python 中使用布尔值：\n\n### 1. 布尔变量\n你可以像处理其他数据类型一样给变量赋值布尔值。\n\n```python\n\
  is_student = True\nhas_passed_exam = False\n```\n\n### 2. 条件语句\n布尔值经常用于条件语句（`if`、`elif`、`else`），根据条件是\
  \ `True` 还是 `False` 来执行不同的代码块。\n\n```python\nif is_student:\n    print(\"这个人是一个学生.\"\
  )\nelse:\n    print(\"这个人不是学生.\")\n```\n\n### 3. 逻辑运算符\n布尔值可以使用逻辑运算符（`and`、`or`、`not`）组合起来以创建复合条件。\n\
  \n```python\nage = 20\nis_adult = age >= 18\nis_teenager = age >= 13 and age <=\
  \ 19\n```\n\n### 4. 循环\n布尔值常用循环条件来控制循环的执行。\n\n```python\nwhile is_student:\n   \
  \ print(\"正在学习...\")\n```\n\n### 5. 返回\n布尔值经常由函数返回表示成功或失败。\n\n```python\ndef is_even(number):\n\
  \    return number % 2 == 0\n```\n\n### 6. 内置函数\nPython 提供内置函数如 `bool()` 将其他类型转换为布尔值。\n\
  \n```python\nbool(0)   # False\nbool(1)   # True\nbool([])  # False\nbool([1]) #\
  \ True\n```\n\n### 布尔转整数\n\n在 Python 中，你可以使用 `int()` 函数将布尔值转换为整数。当将布尔值转换为整数时，`True`\
  \ 表示 `1`，`False` 表示 `0`。你可以这样操作：\n\n```python\nprint(int(True))  # 输出: 1\nprint(int(False))\
  \ # 输出: 0\n```\n\n### 布尔转字符串\n\n在 Python 中，你可以使用 `str()` 函数或字符串格式化方法将布尔值转换为字符串。这是一个示例：\n\
  \n使用 `str()` 函数：\n\n```python\nprint(str(True))  # 输出: \"True\"\nprint(str(False))\
  \ # 输出: \"False\"\n```\n\n### True False\n\n在 Python 中，`True` 和 `False` 是表示真值的布尔值。它们用于控制程序的流程、做出决策和执行逻辑操作。关于\
  \ `True` 和 `False` 的重要说明：\n\n#### 1. True 和 False 值\n* `True` 和 `False` 是 Python\
  \ 中的保留关键字。\n* `True` 代表真，而 `False` 代表假。\n* 它们是 Python 中唯一的布尔值。\n\n#### 2. 布尔运算\n\
  * 布尔值常用于逻辑操作，如 AND、OR 和 NOT。\n* `and` 运算符在两个操作数均为真时返回 `True`，否则返回 `False`。\n* `or`\
  \ 运算符在至少一个操作数为真时返回 `True`，否则返回 `False`。\n* `not` 运算符返回操作数相反的布尔值。\n\n#### 3. 比较运算符\n\
  * 比较运算符（`==`、`!=`、`<`、`<=`、`>`、`>=`）根据结果返回布尔值（`True` 或 `False`）。\n* 例如，`x == y`\
  \ 在 `x` 等于 `y` 时返回 `True`，否则返回 `False`。\n\n#### 4. 控制结构\n* 布尔值被广泛用于控制结构，如 `if`、`elif`、`else`\
  \ 语句和循环（`while`、`for`）。\n* 这些结构根据评估为 `True` 或 `False` 的条件来执行不同的代码块。\n\n#### 5. 真值与假值\n\
  * 除了 `True` 和 `False` 之外，Python 中的其他值在布尔上下文中也可以评估为真或假。\n\n\n\n\n\n* 如空序列（列表、元组、字符串等）、`0`\
  \ 和 `None` 等值会被求值为 `False`。任何非零数字或非空序列都会被求值为 `True`。\n\n## 返回值\n\n*   函数可以返回布尔值来表示操作的成功或失败，或者表示某种条件。\n\
  *   例如，检查数字是否为偶数的函数可能会根据检查结果返回 `True` 或 `False`。\n\n理解如何有效使用 `True` 和 `False` 对于编写清晰、简洁且高效的\
  \ Python 代码至关重要。它们使你能够以易于理解和维护的方式表达条件和逻辑。\n\n## Python 字符串\n\n### 引言\n\n在 Python\
  \ 中创建一个变量并为其赋值一个字符串值是非常简单的。以下是操作方法：\n\n```python\n# 创建一个名为 'my_string' 的变量并为其赋值一个字符串值\n\
  my_string = \"Hello, World!\"\n# 打印变量的值\nprint(my_string)\n```\n\n在这个示例中：\n\n* \
  \  我们创建了一个名为 `my_string` 的变量。\n*   我们使用赋值运算符 `=` 将字符串 `\"Hello, World!\"` 赋值给变量\
  \ `my_string`。\n*   我们我们使用 `print()` 函数打印 `my_string` 的值。\n\n你可以为 Python 中的变量分配任何字符串值，该变量将保存该值，直到它被更改或删除。\n\
  \n### 字符串中的变量\n\n在 Python 中，你可以使用字符串格式化技术在字符串内部使用变量。有几种实现方法，包括使用 `%` 运算符、`str.format()`\
  \ 方法和 f-strings（格式化字符串字面量）。以下是如何使用这些方法在字符串中使用变量：\n\n#### 1. 使用 % 运算符\n你可以使用 `%`\
  \ 运算符将变量插入字符串中。与 f-strings 和 `str.format()` 等新方法相比，这种方法较旧且不再推荐。\n\n```python\nname\
  \ = \"Alice\"\nage = 30\ngreeting = \"Hello, %s! You are %d years old.\" % (name,\
  \ age)\nprint(greeting)\n```\n\n#### 2. 使用 str.format() 方法\n`str.format()` 方法允许你使用占位符\
  \ `{}` 格式化字符串，占位符会被变量值替换。\n\n```python\nname = \"Alice\"\nage = 30\ngreeting = \"\
  Hello, {}! You are {} years old.\".format(name, age)\nprint(greeting)\n```\n\n####\
  \ 3. 使用 f-strings (格式化字符串字面量)\nf-strings 提供了一种更简洁、更易读的方式在字符串中插入变量。你可以直接在字符串内部的大括号\
  \ `{}` 中包含变量和表达式。\n\n```python\nname = \"Alice\"\nage = 30\ngreeting = f\"Hello,\
  \ {name}! You are {age} years old.\"\nprint(greeting)\n```\n\n这三种方法实现相同的结果，但由于其简单性和可读性，通常更优选择\
  \ f-strings。它们在 Python 3.6 中引入，提供了一种更直观的方式来带变量格式化字符串。\n\n### 转义\n\nPython 字符串中的转义序列是以反斜杠\
  \ `\\` 前缀的特殊字符。这些序列允许你在字符串中包含那些在源代码中难以或无法直接输入的字符。以下是 Python 中一些常用的转义序列：\n\n1.  `\\\
  n`: 换行符。它在字符串中插入一个换行。\n    ```python\n    print(\"Line 1\\nLine 2\")\n    ```\n\
  \    输出：\n    ```\n    Line 1\n    Line 2\n    ```\n2.  `\\t`: 制表符。它在字符串中插入一个水平制表符。\n\
  \    ```python\n    print(\"Column 1\\tColumn 2\")\n    ```\n    输出：\n    ```\n\
  \    Column 1      Column 2\n    ```\n3.  `\\r`: 回车符。它将光标移动到行首。\n    ```python\n\
  \    print(\"Hello\\rWorld\")\n    ```\n    输出：\n    ```\n    World\n    ```\n4.\
  \  `\\\\`: 反斜杠字符。它在字符串中插入一个字面的反斜杠。\n    ```python\n    print(\"This is a backslash:\
  \ \\\\\")\n    ```\n    输出：\n    ```\n    This is a backslash: \\\n    ```\n\n###\
  \ 引\n\n要在 Python 字符串内部包含单引号 `'` 或双引号 `\"`，你可以使用相反类型的引号来限定字符串，或者使用反斜杠 `\\` 转义引号字符。以下是操作方法：\n\
  \n1.  **使用相反类型的引号**：如果你想在由双引号限定的字符串内部包含单引号（或者反之），你可以直接在字符串内部使用相反类型的引号。\n    ```python\n\
  \    # 在双引号限定的字符串内部使用单引号\n    string = \"It's a test\"\n    ```\n2.  **转义引号**：使用反斜杠转义引号字符。\n\
  \    ```python\n    # 使用反斜杠转义引号\n    string = 'It\\'s a test'\n    ```\n\n## Python\
  \ 数字\n\n### 引言\n\nPython 支持多种数值类型，每类型都有自己的特性。以下是 Python 处理的主要数值类型：\n\n1.  **整数 (`int`)**：整数表示不带小数点的整数。\n\
  2.  **浮点数 (`float`)**：浮点数表示带有小数点的实数。\n3.  **复数 (`complex`)**：复数同时表示实部和虚部。它们使用 `j`\
  \ 后缀来表示虚部。\n4.  **小数 (`decimal.Decimal`)**：小数表示具有任意精度的定点数。它们适用于金融和其他需要精确小数的应用。\n\
  5.  **分数 (`fractions.Fraction`)**：分数表示分数形式的有数。它们适用于分数的精确表示。\n6.  **布尔值 (`bool`)**：布尔值表示真值，可以是\
  \ `True` 或 `False`。它们常用于逻辑操作和控制流。\n7.  **比例 (`sympy.Rational`)**：比例表示整数分数。它们与分数相似，但提供了更多功能并属于\
  \ `sympy` 库。\n\n### 整数\n\n在 Python 中创建整数并进行简单的计算是非常简单的。你可以定义整数变量并使用数学运算符进行计算。这是一个示例：\n\
  \n```python\n# 创建整数变量\nx = 5\ny = 3\n\n# 执行算术运算\nsum_result = x + y\ndifference_result\
  \ = x - y\nproduct_result = x * y\nquotient_result = x / y  # Python 3 中除法返回浮点数。\n\
  floor_division_result = x // y  # 整除返回整数\nremainder_result = x % y  # 取模运算符返回余数\n\
  \n# 打印结果\nprint(\"Sum:\", sum_result)\nprint(\"Difference:\", difference_result)\n\
  print(\"Product:\", product_result)\nprint(\"Quotient:\", quotient_result)\nprint(\"\
  Floor Division:\", floor_division_result)\nprint(\"Remainder:\", remainder_result)\n\
  ```\n\n输出：\n```\nSum: 8\nDifference: 2\nProduct: 15\nQuotient: 1.6666666666666667\n\
  Floor Division: 1\nRemainder: 2\n```\n\n\n\n\n你可以在 Python 中对整数执行各种算术运算，包括加法、减法、乘法、除法、地板除和模。根据使用的操作数和运算符，Python\
  \ 将返回适当的结果，该结果可以是整数或浮点数。\n\n### 浮点数 (Floats)\n\n在 Python 中创建浮点数和进行简单计算与处理整数相似。以下是一个创建浮点变量并执行算术运算的示例：\n\
  \n| # 创建浮点变量\nx = 3.5\ny = 2.0\n# 执行算术运算\nsum_result = x + y\ndifference_result\
  \ = x - y\nproduct_result = x * y\nquotient_result = x / y |\n\n你可以使用与整数相同的算术运算符（`+`,\
  \ `-`, `*`, `/`, `//`, `%`）来对浮点数进行计算。然而，重要的是，在执行除法（`/`）时，Python 始终返回浮点数结果，即使操作数是整数。\n\
  \n| # 打印结果\nprint(\"Sum:\", sum_result)\nprint(\"Difference:\", difference_result)\n\
  print(\"Product:\", product_result)\nprint(\"Quotient:\", quotient_result) |\n\n\
  在此示例中：\n\n*   我们创建了两个浮点变量 `x` 和 `y`。\n*   我们使用 `+`, `-`, `*` 和 `/` 运算符执行了简单的算术运算。\n\
  *   我们打印了计算结果。\n\n输出：\n\n| Sum: 5.5\nDifference: 1.5\nProduct: 7.0\nQuotient: 1.75\
  \ |\n\n你可以在 Python 中对浮点数执行各种算术运算，Python 将为除法运算返回浮点结果。\n\n### 多变量赋值 (Multiple Assignment)\n\
  \nPython 中的多变量赋值允许在一行内为多个变量赋值，每个变量都有对应的值。可以使用元组解包或列表解包来实现。以下是如何进行多变量赋值：\n\n1. **元组解包\
  \ (Tuple Unpacking)**：你可以在赋值运算符右侧使用元组给多个变量赋值。\n\n| # 元组解包\nx, y, z = 10, 20, 30\n\
  print(\"x:\", x)  # 输出: 10\nprint(\"y:\", y)  # 输出: 20\nprint(\"z:\", z)  # 输出:\
  \ 30 |\n\n2. **列表解包 (List Unpacking)**：你可以在赋值运算符右侧使用列表给多个变量赋值。\n\n| # 列表解包\n[a,\
  \ b, c] = [10, 20, 30]\nprint(\"a:\", a)  # 输出: 10\nprint(\"b:\", b)  # 输出: 20\n\
  print(\"c:\", c)  # 输出: 30 |\n\n3. **扩展解包 (Extended Unpacking)**：你可以使用 `*` 运算符进行扩展解包，将迭代对象中的剩余元素赋值给单个变量。\n\
  \n| # 扩展解包\nfirst, *rest = [1, 2, 3, 4, 5]\nprint(\"first:\", first)  # 输出: 1\n\
  print(\"rest:\", rest)    # 输出: [2, 3, 4, 5] |\n\n4. **交换变量 (Swapping Variables)**：多变量赋值常用于交换变量的值，而不需要临时变量。\n\
  \n| # 交换变量\nx = 10\ny = 20\nx, y = y, x\nprint(\"x:\", x)  # 输出: 20\nprint(\"y:\"\
  , y)  # 输出: 10 |\n\n多变量赋值是 Python 中一个方便的特性，允许你在同时处理多个值时编写出简洁且可读的代码。\n\n### 整数转字符串\
  \ (Int to string)\n\n在 Python 中，将整数转换为字符串，可以使用 `str()` 函数。以下是操作方法：\n\n| # 将整数转换为字符串\n\
  number = 123\nstring_number = str(number)\n# 打印字符串表示\nprint(string_number) |\n\n\
  输出：\n\n| 123 |\n\n在此示例中，使用 `str()` 函数将整数 `123` 转换为字符串表示 `\"123\"`。生成的字符串随后可以用于字符串操作、打印或存储在变量中以进行后续处理。\n\
  \n### 字符串转整数 (Int from string)\n\n在 Python 中，将字符串转换为整数，可以使用 `int()` 函数。以下是操作方法：\n\
  \n| # 将字符串转换为整数\nstring_number = \"123\"\nnumber = int(string_number)\n# 打印整数值\n\
  print(number) |\n\n输出：\n\n| 123 |\n\n在此示例中，使用 `int()` 函数将字符串 `\"123\"` 转换为整数值 `123`。生成的整数随后可以用于算术运算、比较或存储在变量中以进行后续处理。\n\
  \n### 整数转浮点数 (Int to floating point)\n\n在 Python 中，将整数转换为浮点数，只需使用 `float()` 函数。以下是操作方法：\n\
  \n| # 将整数转换为浮点数\ninteger_number = 123\nfloat_number = float(integer_number)\n# 打印浮点数\n\
  print(float_number) |\n\n输出：\n\n| 123.0 |\n\n在此示例中，使用 `float()` 函数将整数 `123` 转换为浮点数\
  \ `123.0`。生成的浮点数随后可以用于算术运算、比较或存储在变量中以进行后续处理。\n\n### 4. Python 列表 (Python List)\n\
  \n#### 简介 (Introduction)\n\n在 Python 中，列表是一种表示特定顺序元素的内置数据结构。列表是可变的，意味着你可以在创建后更改其元素。列表可以包含不同类型，并根据需要增长或缩小。\n\
  \n| # 创建列表\nmy_list = [1, 2, 3, 4, 5]\n# 访问列表元素\nprint(my_list[0])  # 输出: 1\n# 修改列表元素\n\
  my_list[1] = 10\nprint(my_list)  # 输出: [1, 10, 3, 4, 5]\n# 向列表添加元素\nmy_list.append(6)\n\
  print(my_list)  # 输出: [1, 10, 3, 4, 5, 6]\n# 从列表中移除元素\nmy_list.remove(3)\nprint(my_list)\
  \  # 输出: [1, 10, 4, 5, 6] |\n\n你可能在以下需要使用 Python 列表：\n\n1. **存储多个值**：在一个变量中存储多个可能不同的值。\n\
  2. **维护顺序**：你需要保持元素的顺序。\n3. **动态大小**：你需要一个可以增长或缩小的数据结构。\n4. **可变操作**：你需要执行添加、删除或修改元素的等变操作。\n\
  5. **索引和切片**：你需要通过索引访问元素或切片提取子集。\n\n#### 通过索引访问 (Access by Index)\n\n在 Python 中，你可以通过索引访问列表元素。索引从\
  \ 0 开始，这意味着列表的第一个元素索引为 0，第二个元素为 1，以此类推。你还可以使用负索引从列表末尾访问元素，其中 -1 表示最后一个元素，-2 表示倒数第二个元素，等等。以下是如何通过索引访问\
  \ Python 列表元素：\n\n| # 定义列表\nmy_list = ['apple', 'banana', 'cherry', 'date', 'elderberry']\n\
  # 通过索引访问元素\nprint(my_list[0])  # 输出: 'apple' (第一个元素)\nprint(my_list[2])  # 输出: 'cherry'\
  \ (第三个元素)\nprint(my_list[-1]) # 输出: 'elderberry' (最后一个元素)\nprint(my_list[-2]) #\
  \ 输出: 'date' (倒数第二个元素) |\n\n#### 修改元素 (Modify Elements)\n\n要修改 Python 列表中的元素，你可以直接使用索引为特定元素分配新值。Python\
  \ 中的列表是可变的，这意味着你可以在创建后更改其元素。\n\n\n\n\n# 定义列表\n\n```python\n# 定义一个列表\nmy_list = ['apple',\
  \ 'banana', 'cherry', 'date', 'elderberry']\n# 修改列表中的元素\nmy_list[1] = 'blueberry'\
  \  # 修改索引为 1 的元素\nmy_list[-2] = 'grape'     # 修改倒数第二个元素\n# 打印修改后的列表\nprint(my_list)\
  \  # 输出: ['apple', 'blueberry', 'cherry', 'grape', 'elderberry']\n```\n\n在此示例中：\n\
  \n- 我们定义了一个包含五个元素的列表 `my_list`。\n- 我们使用方括号 `[]` 根据索引访问列表中的元素。\n- 我们为特定索引处的元素分配了新值以对其进行修改。\n\
  - 我们打印了修改后的列表以验证更改。\n\n你可以使用任何有效的 Python 表达式来修改列表中的元素。这意味着你可以分配相同类型、不同类型的新值，甚至是涉及列表中其他元素的表达式的结果。列表为\
  \ Python 中管理数据集合提供了一种灵活且强大的方式。\n\n## 添加元素\n\n若要向 Python 列表添加添加元素，你可以使用多种方法，如 `append()`、`insert()`\
  \ 或拼接（`+` 运算符）。以下是使用这些方法向列表添加元素的方法：\n\n### 1. 使用 `append()` 方法\n`append()` 方法在列表的末尾添加单个元素。\n\
  \n```python\n# 定义一个列表\nmy_list = ['apple', 'banana', 'cherry']\n# 在列表末尾添加单个元素\n\
  my_list.append('date')\n# 打印修改后的列表\nprint(my_list)  # 输出: ['apple', 'banana', 'cherry',\
  \ 'date']\n```\n\n### 2. 使用 `insert()` 方法\n`insert()` 方法在列表的指定索引处插入单个元素。\n\n```python\n\
  # 定义一个列表\nmy_list = ['apple', 'banana', 'cherry']\n# 在指定索引插入单个元素\nmy_list.insert(1,\
  \ 'blueberry')\n# 打印修改后的列表\nprint(my_list)  # 输出: ['apple', 'blueberry', 'banana',\
  \ 'cherry']\n```\n\n### 3. 使用拼接 (`+`)\n\n你可以拼接两个列表来创建一个包含这两个列表元素的新列表。\n\n```python\n\
  # 定义一个列表\nmy_list = ['apple', 'banana', 'cherry']\n# 创建另一个元素列表\nnew_elements = ['date',\
  \ 'elderberry']\n# 拼接列表添加元素\nmy_list += new_elements\n# 打印修改后的列表\nprint(my_list)\
  \  # 输出: ['apple', 'banana', 'cherry', 'date', 'elderberry']\n```\n\n在每个示例中，我们首先定义一个列表\
  \ `my_list`。然后我们使用其中一种方法（`append()`、`insert()` 或拼接）向列表添加元素。最后，我们打印修改后的列表以验证更改。这些方法为列表添加元素提供了灵活的方式，允许你根据需要轻松扩展列表。\n\
  \n## 插入元素\n\n若要在 Python 列表的中间插入元素，你可以使用 `insert()` 方法。`insert()` 方法允许你指定要插入新元素的索引。\n\
  \n```python\n# 定义一个列表\nmy_list = ['apple', 'banana', 'cherry', 'date']\n# 在列表中间插入元素\n\
  my_list.insert(2, 'blueberry')  # 在索引 2 处插入 'blueberry'\n# 打印修改后的列表\nprint(my_list)\
  \  # 输出: ['apple', 'banana', 'blueberry', 'cherry', 'date']\n```\n\n在此示例中：\n- 我们定义了一个包含四个元素的列表\
  \ `my_list`。\n- 我们使用 `insert()` 方法在索引 `2` 处插入元素 `blueberry`。\n- 索引 `2` 表示新元素将插入第二个元素（`banana`）之后、第三个元素（`cherry`）之前。\n\
  - 我们打印了修改后的列表。\n\n`insert()` 方法通过移动现有元素为新元素留位来修改原始列表。这是在列表特定位置插入元素的方便方法。\n\n## 永久排序\n\
  \n要使用 `sort()` 方法永久对 Python 列表进行排序，只需在列表上调用 `sort()` 方法。`sort()` 方法默认按升序对列表元素排序。\n\
  \n```python\n# 定义一个列表\nmy_list = [3, 1, 4, 1, 5, 9, 2, 6, 5]\n# 永久排序列表\nmy_list.sort()\n\
  # 打印排序后的列表\nprint(\"Sorted list:\", my_list)  # 输出: [1, 1, 2, 3, 4, 5, 5, 6, 9]\n\
  ```\n\n在此示例中：\n- 我们定义了一个包含未排序元素的列表 `my_list`。\n- 我们在列表 `my_list` 上调用 `sort()` 方法来永久对其元素排序。\n\
  - `sort()` 方法通过按升序排列其元素来修改原始列表。\n- 我们打印了排序后的列表。\n\n# Python 元组 (Tuple)\n\n### 介绍\n\
  \nPython 元组是一个不可变的、有序的元素集合。“不可变”意味着一旦创建了元组，其元素就不能被更改或修改。元组与列表相似，但它们使用括号 `()` 而不是方括号\
  \ `[]`。\n\n你可以通过将元素包含在括号 `()` 内在 Python 中创建元组。以下是创建元组的几个示例：\n\n```python\n# 创建一个空元组\n\
  empty_tuple = ()\n# 创建带有元素的元组\ntuple_with_elements = ('apple', 'banana', 'cherry')\n\
  # 创建包含不同类型的元组\nmixed_tuple = (1, 'apple', 3.14, True)\n# 创建包含一个元素的元组（注意逗号）\nsingle_element_tuple\
  \ = ('apple',)\n```\n\n元组通常用于存储不应更改的数据。由于它们是不可变的，它们可以用作字典的键。\n\n### 循环\n\n你可以遍历元组中的元素，就像遍历列表一样：\n\
  \n```python\nmy_tuple = ('apple', 'banana', 'cherry')\n# 遍历元组并打印每个元素\nfor item in\
  \ my_tuple:\n    print(item)\n```\n\n你也可以使用索引来访问元组中的元素：\n\n```python\nmy_tuple =\
  \ ('apple', 'banana', 'cherry')\n# 使用索引遍历\nfor i in range(len(my_tuple)):\n    print(my_tuple[i])\n\
  ```\n\n### 长度\n\n你可以使用 `len()` 函数获取元组的长度（元素数量）。\n\n```python\nmy_tuple = ('apple',\
  \ 'banana', 'cherry', 'date', 'elderberry')\n# 获取元组的长度\nlength = len(my_tuple)\n\
  print(\"Length of the tuple:\", length)\n```\n\n输出：\n`Length of the tuple: 5`\n\n\
  ### 最大值/最小值 (max/min)\n\n在 Python 中，你可以使用 `max()` 和 `min()` 函数分别找到元组中的最大值和最小值。\n\
  \n```python\nmy_tuple = (3, 7, 1, 9, 2, 6)\n# 找到元组的最大值\nmaximum = max(my_tuple)\n\
  print(\"Maximum element:\", maximum)\n# 找到元组的最小值\nminimum = min(my_tuple)\nprint(\"\
  Minimum element:\", minimum)\n```\n\n输出：\n`Maximum element: 9`\n`Minimum element:\
  \ 1`\n\n### 元组转字符串 (tuple to string)\n\n要在 Python 中将元组转换为字符串，你可以使用字符串处理技术。一种常见的方法是使用\
  \ `join()` 方法结合字符串拼接或格式化，将元组元素转换为字符串。\n\n```python\nmy_tuple = (1, 2, 3, 4, 5)\n\
  # 将元组转换为字符串\ntuple_string = ', '.join(str(element) for element in my_tuple)\nprint(\"\
  Tuple as string:\", tuple_string)\n```\n\n\n\n\n\n```python\nmy_tuple = (1, 2, 3,\
  \ 4, 5) # 将元组格式化为字符串\ntuple_string = ', '.join(map(str, my_tuple))\nprint(\"Tuple\
  \ as string:\", tuple_string)\n```\n\n两个示例输出：\n\n```\nTuple as string: 1, 2, 3,\
  \ 4, 5\n```\n\n在两个示例中，都使用了 `join()` 方法将元组中的元素连接成一个单一字符串。在第一个示例中，我们在 `join()` 方法内部使用了生成器表达式和字符串拼接。在第二个示例中，我们使用\
  \ `map()` 将元组中的每个元素转换为字符串，然后在 `join()` 方法内部使用字符串格式化。\n\n# 6 Python 字典 (Dictionary)\n\
  \n## 序言\n\nPython 字典是一个无序的键值对集合。字典中的每个 `key`（键）都是唯一且不可变的，它会映射到一个相应的 `value`（值）。你可以将字典想象成现实世界中的字典，其中每个单词（`key`）都有一个定义（`value`）。\n\
  \n你可以使用大括号 `{}` 并指定用冒号 `:` 分隔的键值对在 Python 中创建字典。以下是创建字典的方法：\n\n```python\n# 创建一个空字典\n\
  empty_dict = {}\n# 创建一个带有键值对的字典\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New\
  \ York'}\n# 使用 dict() 构造函数创建字典\nanother_dict = dict(name='Alice', age=25, city='Los\
  \ Angeles')\n```\n\n在上面的示例中：\n\n*   `empty_dict` 是空字典。\n*   `my_dict` 包含三个键值对：`'name':\
  \ 'John'`、`'age': 30` 和 `'city': 'New York'`。\n*   `another_dict` 是使用 `dict()` 构造函数创建，其中键和值作为关键字参数指定。\n\
  \n你可以使用字典的 `keys` 来访问、修改、添加或删除元素。字典被广泛用于高效地存储和检索数据，特别是当你需要通过相关的 `keys` 访问值时。\n\n\
  ## 遍历键值对 (Loop Pairs)\n\n你可以使用 `for` 循环遍历 Python 字典中的所有键值对。Python 字典提供了几种方法来访问 `keys`、`values`\
  \ 或两者两者。以下是遍历字典中所有键值对的方法：\n\n```python\nmy_dict = {'name': 'John', 'age': 30, 'city':\
  \ 'New York'}\n# 遍历所有键值对\nfor key, value in my_dict.items():\n    print(key, '=',\
  \ value)\n```\n\n在这个示例中，`my_dict.items()` 返回一个视图对象，它提供了字典键值对的动态视图。`for` 循环遍历每个键值对，`key`\
  \ 和 `value` 分别被赋值给每个键值对。在循环内部，你可以访问每个对的 `key` 和 `value` 并执行任何所需的操作。\n\n输出：\n\n```\n\
  name = John\nage = 30\ncity = New York\n```\n\n使用 `.items()` 是 Python 中遍历字典中所有键值对最常见且高效的方法。\n\
  \n## 访问 (Access)\n\n你可以使用 `keys` 作为索引访问 Python 字典中的值。以下是访问字典中值的几种方法：\n\n1. 使用方括号\
  \ `[]`：\n\n```python\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New York'}\n\
  # 使用键访问值\nname = my_dict['name']\nage = my_dict['age']\ncity = my_dict['city']\n\
  print(\"Name:\", name)\nprint(\"Age:\", age)\nprint(\"City:\", city)\n```\n\n2.\
  \ 使用 `get()` 方法：\n\n```python\nmy_dict = {'name': 'John', 'age': 30, 'city': 'New\
  \ York'}\n# 使用 get() 方法访问值\nname = my_dict.get('name')\nage = my_dict.get('age')\n\
  city = my_dict.get('city')\nprint(\"Name:\", name)\nprint(\"Age:\", age)\nprint(\"\
  City:\", city)\n```\n\n两种方法都将输出：\n\n```\nName: John\nAge: 30\nCity: New York\n```\n\
  \n在两个示例中，我们使用键 `'name'`、`'age'` 和 `'city'` 访问字典 `my_dict` 中的值。使用方括号是直观的，如果字典中未找到\
  \ `key`，则抛出 `KeyError`。使用 `get()` 方法允许在未找到 `key` 时提供一个默认值，这有助于避免 `KeyError` 异常。\n\
  \n# 第 3 章：运算符 (Operators)\n\n## 1 Python 算术运算符\n\n### 序言\n\n在 Python 中，算术运算符用于执行数学运算。以下是\
  \ Python 中的算术运算符列表：\n\n1.  加法：`+`\n2.  减法：`-`\n3.  乘法：`*`\n4.  除法：`/`\n5.  地板除（整除）：`//`\n\
  6.  取模（余数）：`%`\n7.  幂：`**`\n\n你可以使用这些运算符在 Python 中对数字进行算术运算。\n\n### 用法\n\n以下是说明\
  \ Python 中每个算术运算符使用的示例：\n\n1.  加法 (`+`)：\n\n```python\na = 5\nb = 3\nresult = a\
  \ + b\nprint(\"Addition:\", result)  # 输出: Addition: 8\n```\n\n2. 减法 (`-`)：\n\n\
  ```python\na = 7\nb = 4\nresult = a - b\nprint(\"Subtraction:\", result)  # 输出:\
  \ Subtraction: 3\n```\n\n3. 乘法 (`*`)：\n\n```python\na = 6\nb = 5\nresult = a * b\n\
  print(\"Multiplication:\", result)  # 输出: Multiplication: 30\n```\n\n4. 除法 (`/`)：\n\
  \n```python\na = 10\nb = 3\nresult = a / b\nprint(\"Division:\", result)  # 输出:\
  \ Division: 3.3333333333333335\n```\n\n5. 地板除 (`//`)：\n\n```python\na = 10\nb =\
  \ 3\nresult = a // b\nprint(\"Floor Division:\", result)  # 输出: Floor Division:\
  \ 3\n```\n\n6. 取模 (`%`)：\n\n```python\na = 10\nb = 3\nresult = a % b\nprint(\"Modulus:\"\
  , result)  # 输出: Modulus: 1\n```\n\n7. 幂 (`**`)：\n\n```python\na = 2\nb = 3\nresult\
  \ = a ** b\nprint(\"Exponentiation:\", result)  # 输出: Exponentiation: 8\n```\n\n\
  这些示例展示了 Python 中每个算术运算符的使用。\n\n### 处理除以零 (Handle By Zero)\n\n要在 Python 中处理除以零和多种异常，你可以使用\
  \ `try` 和 `except` 块。如下：\n\n```python\ndef divide_numbers(a, b):\n    try:\n   \
  \     result = a / b\n        print(\"Result of division:\", result)\n    except\
  \ ZeroDivisionError:\n        print(\"Error: 不能除以零.\")\n    except (TypeError, ValueError):\n\
  \        print(\"Error: 输入类型或值无效.\")\n    except Exception as e:\n        print(\"\
  发生了意外错误:\", e)\n\n# 使用\ndivide_numbers(10, 0) # 除以零\ndivide_numbers(10, 'a') # 类型不匹配\n\
  ```\n\n\n\n\n\n```python\ndef common_divisors(num1, num2):\n    # Find the minimum\
  \ of the two numbers\n    min_num = min(num1, num2)\n    # Initialize a list to\
  \ store common divisors\n    common_divisors_list = []\n    # Iterate through the\
  \ range from 1 to min_num\n    for i in range(1, min_num + 1):\n        # Check\
  \ if both numbers are divisible by i without remainder\n        if num1 % i == 0\
  \ and num2 % i == 0:\n            common_divisors_list.append(i)\n    return common_divisors_list\n\
  \n# Example usage\nnum1 = 12\nnum2 = 18\nresult = common_divisors(num1, num2)\n\
  print(\"Common divisors of\", num1, \"and\", num2, \":\", result)\n```\n\n在这个示例中：\n\
  \n- `common_divisors` 函数接收两个整数 `num1` 和 `num2` 作为输入。\n- 它找到两个数中的最小值来确定循环的范围。\n-\
  \ 它初始化了一个空列表 `common_divisors_list` 来存储公约数。\n- 它遍历从 1 到两个数中的最小值之间的范围。\n- 对于每个数字\
  \ `i`，它检查 `num1` 和 `num2` 是否都能被 `i` 整除且没有余数。\n- 如果是，则将 `i` 添加到 `common_divisors_list`\
  \ 中。\n- 最后，它返回公约数列表。\n\n你可以通过将数字作为参数传递给函数，使用此函数找到任意两个数的公约数。\n\n# 平方和\n\n要在 Python\
  \ 中找到前 `n` 个自然数的平方和，你可以使用简单的公式并直接计算和。求前 `n` 个自然数平方和的公式为：\n\n$$ \\sum_{i=1}^{n} i²\
  \ = \\frac{n(n+1)(2n+1)}{6} $$\n\n以下是在 Python 中实现的方法：\n\n```python\ndef sum_of_squares_of_first_n(n):\n\
  \    return n * (n + 1) * (2 * n + 1) // 6\n\n# Example usage\nn = 5\nresult = sum_of_squares_of_first_n(n)\n\
  print(\"Sum of squares of the first\", n, \"natural numbers:\", result)\n```\n\n\
  在此实现中：\n\n- `sum_of_squares_of_first_n` 函数接收一个整数 `n` 作为输入。\n- 它使用公式 $(\\frac{n(n+1)(2n+1)}{6})$\
  \ 计算平方和。\n- 返回计算结果。\n\n你可以调整 `n` 的值，以找到任意 `n` 值对应的前 `n` 个自然数的平方和。\n\n# 2 Python\
  \ 位运算符\n\n## 引言\n\n在 Python 中，位运算符用于对整数执行按位操作。以下是 Python 中位运算符的列表：\n\n1. **按位与 (`&`)**：对两个整数的对应位执行按位与运算。\n\
  2. **按位或 (`|`)****：对两个整数的对应位执行按位或运算。\n3. **按位异或 (`^`)**：对两个整数的对应位执行按位异或（互斥或）运算。\n\
  4. **按位取反 (`~`)**：执行按位取反（补码）运算，即反转整数的所有位。\n5. **左移 (`<<`)**：将整数的位向左移动指定数的位数，移出的位置用零填充。\n\
  6. **右移 (`>>`)**：将整数的位向右移动指定数的位数，移出的位置用零或符号位填充（对于有符号整数）。\n\n这些运算符在位级别工作，操作整数值中的单个位。它们通常用于低级编程、硬件操作和优化任务。\n\
  \n## 使用方法\n\n以下是演示 Python 中使用每个位运算符的示例：\n\n1. **按位与 (`&`)**：\n```python\na = 5 \
  \ # 二进制 0101\nb = 3  # 二进制 0011\nresult = a & b\nprint(\"Bitwise AND:\", result)\
  \  # 输出: 1 (二进制 0001)\n```\n\n2. **按位或 (`|`)**：\n```python\na = 5  # 二进制 0101\n\
  b = 3  # 二进制 0011\nresult = a | b\nprint(\"Bitwise OR:\", result)  # 输出: 7 (二进制\
  \ 0111)\n```\n\n3. **按位异或 (`^`)**：\n```python\na = 5  # 二进制 0101\nb = 3  # 二进制 0011\n\
  result = a ^ b\nprint(\"Bitwise XOR:\", result)  # 输出: 6 (二进制 0110)\n```\n\n4. **按位取反\
  \ (`~`)**：\n```python\na = 5  # 二进制 0101\nresult = ~a\nprint(\"Bitwise NOT:\", result)\
  \  # 输出: -6 (32 位整数的二进制 1010)\n```\n\n5. **左移 (`<<`)**：\n```python\na = 5  # 二进制\
  \ 0101\nresult = a << 2\nprint(\"Left Shift:\", result)  # 输出: 20 (10100)\n```\n\
  \n6. **右移 (`>>`)**：\n```python\na = 5  # 二进制 0101\nresult = a >> 1\nprint(\"Right\
  \ Shift:\", result)  # 输出: 2 (10)\n```\n\n## 2 的幂\n\n你可以使用位运算符来判断一个数字是否是 2 的幂。方法如下：\n\
  \n```python\ndef is_power_of_two(num):\n    # 2 的幂只有一个位为 1。\n    return num > 0\
  \ and (num & (num - 1)) == 0\n\n# Example usage\nnum1 = 4\nnum2 = 6\nprint(num1,\
  \ \"is power of two:\", is_power_of_two(num1))\nprint(num2, \"is power of two:\"\
  , is_power_of_two(num2))\n```\n\n在此逻辑中：\n- `num & (num - 1)` 会移除最低置位。\n- 如果结果为 `0`，说明该数字只有一个位，因此它是\
  \ 2 的幂。\n\n## 奇偶数字和\n\n要计算一个数字的奇偶数数字之和，你可以使用算术运算符遍历每个数字。你可以这样做：\n\n```python\ndef\
  \ sum_odd_even_digits(num):\n    odd_sum = 0\n    even_sum = 0\n    while num >\
  \ 0:\n        digit = num % 10\n        if digit % 2 == 0:\n            even_sum\
  \ += digit\n        else:\n            odd_sum += digit\n        num //= 10\n  \
  \  return odd_sum, even_sum\n\n# Example usage\nnumber = 123456\nodd_s, even_s =\
  \ sum_odd_even_digits(number)\nprint(\"Sum of odd digits:\", odd_s)\nprint(\"Sum\
  \ of even digits:\", even_s)\n```\n\n在这个示例中：\n- `sum_odd_even_digits` 函数接收一个整数 `num`\
  \ 作为输入。\n- 它初始化 `odd_sum` 和 `even_sum` 来存储和。\n- 它通过将数字除以 10 来遍历每个数字。\n- 它使用模运算符（`%`）检查数字是奇数还是偶数。\n\
  - 它将数字添加到对应的和中。\n- 函数返回奇数和偶数数字的和。\n\n\n\n\n\n## 比较运算符\n\n```python\na = 5\nb = 5\n\
  result = a == b\nprint(\"Is\", a, \"equal to\", b, \"?\", result)  # Output: Is\
  \ 5 equal to 5 ? True\n```\n\n### 2. 不等于 (!=):\n\n```python\na = 5\nb = 6\nresult\
  \ = a != b\nprint(\"Is\", a, \"not equal to\", b, \"?\", result)  # Output: Is 5\
  \ not equal to 6 ? True\n```\n\n### 3. 大于 (>):\n\n```python\na = 6\nb = 5\nresult\
  \ = a > b\nprint(\"Is\", a, \"greater than\", b, \"?\", result)  # Output: Is 6\
  \ greater than 5 ? True\n```\n\n### 4. 小于 (<):\n\n```python\na = 5\nb = 6\nresult\
  \ = a < b\nprint(\"Is\", a, \"less than\", b, \"?\", result)  # Output: Is 5 less\
  \ than 6 ? True\n```\n\n### 5. 大于或等于 (>=):\n\n```python\na = 6\nb = 6\nresult =\
  \ a >= b\nprint(\"Is\", a, \"greater than or equal to\", b, \"?\", result)  # Output:\
  \ Is 6 greater than or equal to 6 ? True\n```\n\n### 6. 小于或等于 (<=):\n\n```python\n\
  a = 5\nb = 6\nresult = a <= b\nprint(\"Is\", a, \"less than or equal to\", b, \"\
  ?\", result)  # Output: Is 5 less than or equal to 6 ? True\n```\n\n这些示例演示了 Python\
  \ 中每个比较运算符的使用。你可以更改 `a` 和 `b` 的值来测试不同的比较。\n\n## 4. Python 逻辑运算符\n\n### 介绍\n\n在 Python\
  \ 中，逻辑运算符用于组合多个条件并产生单个布尔结果（`True` 或 `False`）。以下是 Python 中逻辑逻辑运算符的列表：\n\n1. **逻辑与\
  \ (and)**：如果两个操作数都为 `True`，则返回 `True`。\n2. **逻辑或 (or)**：如果操作数中至少有一个为 `True`，则返回\
  \ `True`。\n3. **逻辑非 (not)**：如果操作数为为 `False`，则返回 `True`；如果操作数为为 `True`，则返回 `False`。\n\
  \n这些运算符通常用于条件语句、循环以及需要逻辑操作的其他语境。\n\n### 使用方法\n\n以下是演示 Python 中每个逻辑运算符用法的示例：\n\n\
  #### 1. 逻辑与 (and):\n\n```python\na = True\nb = False\nresult = a and b\nprint(\"\
  Logical AND:\", result)  # Output: Logical AND: False\n```\n\n#### 2. 逻辑或 (or):\n\
  \n```python\na = True\nb = False\nresult = a or b\nprint(\"Logical OR:\", result)\
  \  # Output: Logical OR: True\n```\n\n#### 3. 逻辑非 (not):\n\n```python\na = True\n\
  result = not a\nprint(\"Logical NOT:\", result)  # Output: Logical NOT: False\n\
  ```\n\n这些示例演示了 Python 中每个逻辑运算符的使用。你可以更改 `a` 和 `b` 的值来测试不同的逻辑操作。\n\n### 组合\n\n你可以通过使用括号对表达式分组并根据需要应用逻辑运算符（`and`、`or`、`not`），在\
  \ Python 中创建更复杂的条件。以下是一个组合逻辑运算符的示例：\n\n```python\n# 示例：检查数字是否在 10 到 20 之间，或者在 30\
  \ 到 40 的范围之外\ndef check_number_range(num):\n    if (num >= 10 and num <= 20) or\
  \ (num < 30 or num > 40):\n        return True\n    else:\n        return False\n\
  \n# 示例用法\nnumber1 = 15\nnumber2 = 25\nnumber3 = 35\nprint(\"Is\", number1, \"between\
  \ 10 and 20 or outside the range 30 to 40?\", check_number_range(number1))  # Output:\
  \ True\nprint(\"Is\", number2, \"between 10 and 20 or outside the range 30 to 40?\"\
  , check_number_range(number2))  # Output: False\nprint(\"Is\", number3, \"between\
  \ 10 and 20 or outside the range 30 to 40?\", check_number_range(number3))  # Output:\
  \ True\n```\n\n在此示例中：\n\n*   `check_number_range` 函数接收一个数字 (`num`) 作为输入并检查它是否满足指定的条件。\n\
  *   条件使用逻辑运算符定义：\n*   `(num >= 10 and num <= 20)` 检查数字是否在 10 到 20 之间。\n*   `(num\
  \ < 30 or num > 40)` 检查数字是否在 30 到 40 的范围之外。\n*   `or` 运算符用于组合这两个条件。\n*   `and` 运算符在第一个条件内部，用于检查数字是否同时满足范围的下限和上限。\n\
  *   括号用于分组表达式并确保条件的正确求值。\n*   如果数字满足条件，函数返回 `True`，否则返回 `False`。\n*   示例用法演示了检查三个不同的数字是否满足指定条件。根据你的特定需求调整数字和条件。\n\
  \n### 三个数中的最大值\n\n你可以创建一个 Python 程序，使用逻辑运算符（`and` 和 `or`）比较数字来找到三个数中的最大值。以下是实现方法：\n\
  \n```python\ndef find_greatest(num1, num2, num3):\n    if num1 >= num2 and num1\
  \ >= num3:\n        return num1\n    elif num2 >= num1 and num2 >= num3:\n     \
  \   return num2\n    else:\n        return num3\n\n# 示例用法\nnumber1 = 10\nnumber2\
  \ = 20\nnumber3 = 15\nprint(\"The greatest of three numbers is:\", find_greatest(number1,\
  \ number2, number3))\n```\n\n在此示例中：\n\n*   `find_greatest` 函数接收三个数字 (`num1`, `num2`,\
  \ `num3`) 作为输入。\n*   它使用逻辑运算符比较值。\n*   函数返回三个数中的最大值。\n\n## 5. 三元运算符\n\n### 介绍\n\n\
  Python 中的三元运算符是一个条件表达式，根据条件返回两个值中的之一。三元运算符的语法如下：\n\n`value_if_true if condition\
  \ else value_if_false`\n\n三元运算符的工作原理：\n\n*   `condition` 首先被求值。\n*   如果为真，则返回 `value_if_true`。\n\
  *   如果为假，则返回 `value_if_false`。\n\n这是一个使用三元运算符的示例：\n\n```python\nx = 10\ny = 20\n\
  max_value = x if x > y else y\nprint(\"Maximum value:\", max_value)  # Output: 20\n\
  ```\n\n在此示例中：\n\n*   `x > y` 条件首先被求值。\n*   由于 `10` 不大于 `20`，将 `y` 的值赋值给 `max_value`。\n\
  \n三元运算符使得代码更加简洁，特别是在需要在两个值之间选择时。\n\n### 使用方法\n\n以下是演示 Python 中三元运算符用法的示例：\n\n####\
  \ 1. 赋值最大值：\n\n```python\nx = 10\ny = 20\nmax_value = x if x > y else y\nprint(\"\
  Maximum value:\", max_value)  # Output: 20\n```\n\n#### 2. 检查奇偶：\n\n```python\n\
  num = 15\nresult = \"Even\" if num % 2 == 0 else \"Odd\"\nprint(num, \"is\", result)\
  \  # Output: 15 is Odd\n```\n\n#### 3. 赋值绝对值：\n\n```python\nnumber = -10\nabsolute_value\
  \ = number if number >= 0 else -number\nprint(\"Absolute value:\", absolute_value)\
  \  # Output: 10\n```\n\n#### 4. 检查有效性：\n\n```python\nusername = \"john_doe\"\nmessage\
  \ = \"Valid\" if len(username) >= 8 else \"Invalid\"\nprint(\"Username is\", message)\
  \  # Output: Username is Valid\n```\n\n#### 5. 处理除以零：\n\n```python\ndividend = 10\n\
  divisor = 0\nresult = dividend / divisor if divisor != 0 else \"Error: Division\
  \ by Zero\"\nprint(\"Result:\", result)  # Output: Result: Error: Division by Zero\n\
  ```\n\n### 最大值\n\n你可以创建一个 Python 程序，使用三元运算符找到用户输入的两个数字中的最大值，如下：\n\n```python\n#\
  \ 从用户处输入两个数字\nnumber1 = float(input(\"Enter first number: \"))\nnumber2 = float(input(\"\
  Enter second number: \"))\n\n# 使用三元运算符确定最大数字\nlargest = number1 if number1 > number2\
  \ else number2\n\n# 显示结果\nprint(\"The largest number is:\", largest)\n```\n\n\n\n\
  \n结果将显示给用户。\n\n# 第 4 章：语句\n\n## 1 Python if\n\n### 简介\n\n在 Python 中，`if` 语句是一种控制流语句，允许你根据指定条件的评估结果为\
  \ True（真）来执行代码块。它用于编程中的决策判断。\n\nPython 中 `if` 语句的语法如下：\n\n```python\nif condition:\n\
  # 如果条件为 True，则执行代码块\nstatement1\nstatement2...\n```\n\n以下是 `if` 语句的工作原理：\n\n- 评估条件。如果为\
  \ True，则执行 `if` 语句后续的代码块。如果为 False（假），则跳过该代码块。\n- `if` 语句下的代码块通常会缩进，以表示它属于 `if`\
  \ 语句。缩进通常为四个空格，但也可以是任何一致的空白字符。\n- 可选，你可以包含一个 `else` 语句，以指定当条件为 False 时执行的代码块。此外，你可以使用\
  \ `elif`（\"else if\" 的缩写）来指定要检查的额外条件。\n\n这是一个在 Python 中使用 `if` 语句的示例：\n\n```python\n\
  x = 10\nif x > 5:\n    print(\"x is greater than 5\")\n```\n\n在此示例中：\n\n- 评估条件 `x\
  \ > 5`。由于 `x` 是 `10`，大于 5，因此条件为 True。\n- 因此，执行了 `if` 语句下的代码块，并在控制台打印消息 \"x is greater\
  \ than 5\"。\n\n### 语法\n\nPython 中的 `if` 语句可以以多种方式用于创建条件逻辑。以下是 `if` 语句的不同形式及其对应的语法：\n\
  \n1. **基础 if 语句**：\n```python\nif condition:\n# 如果条件为 True，则执行代码块\nstatement1\n\
  statement2...\n```\n\n2. **if-else 语句**：\n```python\nif condition:\n# 如果条件为 True，则执行代码块\n\
  statement1\nstatement2...\nelse:\n# 如果条件为 False，则执行代码块\nstatement3\nstatement4...\n\
  ```\n\n3. **链式 if-elif-else 语句**：\n```python\nif condition1:\n# 如果 condition1 为\
  \ True，则执行代码块\nstatement1\nstatement2...\nelif condition2:\n# 如果 condition2 为 True，则执行代码块\n\
  statement3\nstatement4...\nelif condition3:\n# 如果 condition3 为 True，则执行代码块\nstatement5\n\
  statement6...\nelse:\n# 如果所有条件为 False，则执行代码块\nstatement7\nstatement8...\n```\n\n\
  4. **嵌套 if 语句**：\n```python\nif condition1:\n    if condition2:\n        # 如果 condition1\
  \ 和 condition2 均为 True，则执行代码块\n        statement1\nstatement2...\n```\n\n在 `if`\
  \ 语句的各种形式中，你都可以包含一个或多个条件，并根据这些条件的评估执行相应的代码块。`else` 和 `elif` 子句是可选的，用于指定当条件为 False\
  \ 时执行的备选代码块。\n\n#### 偶奇\n\n在 Python 中，你可以使用带有模运算符 `%` 的 `if` 语句来检查给定数字是偶数还是奇数。以下是实现方法：\n\
  \n```python\ndef check_even_odd(number):\n    if number % 2 == 0:\n        print(number,\
  \ \"is even.\")\n    else:\n        print(number, \"is odd.\")\n\n# 使用示例\nnumber\
  \ = 7\ncheck_even_odd(number)\n```\n\n在此程序中：\n\n- `check_even_odd()` 函数接收一个数字 (`number`)\
  \ 作为输入。\n- 它使用模运算符 `%` 检查该数字是偶数还是奇数。如果数字除以 `2` 的余数为 `0`，则为偶数；否则为奇数。\n- 如果数字是偶数（`number\
  \ % 2 == 0`），它会打印指示数字为偶数的消息。否则，打印指示数字为奇数的消息。\n- 示例演示了检查数字 `7` 是偶数还是奇数。你可以向函数传递任何整数来检查它的奇性。\n\
  \n#### 最大/最小\n\n你可以从用户处读取三个整数，然后使用 `if` 语句确定其中最大和最小的整数。以下是实现方法：\n\n```python\n#\
  \ 从用户处读取三个整数\nnum1 = int(input(\"Enter first integer: \"))\nnum2 = int(input(\"\
