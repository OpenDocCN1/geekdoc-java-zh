  \n#### 1 Java 虚拟机 (`JVM`)\n\nJava 是一种编写可以在不同平台上运行的程序。一次编写，到处运行。\n\n在 Java 诞生之前，在\
  \ Windows 操作系统上编写并编译成机器码运行的程序，由于大量的差异，无法在 Linux 操作系统上运行。\n\n!![](img/image_rsrc6ZB.jpg)\n\
  \nSun 系统的工程师创建了 `JVM`（Java 虚拟机），以便安装在 Windows、Linux、Mac 等不同平台上。\n\n!![](img/image_rsrc6ZC.jpg)\n\
  \n用 Java 编写的程序被编译成字节码（Byte Code），这可以在 `JVM` 环境中运行的特殊代码。`JVM` 将将字节码转换为宿主机代码。这就是解释为什么\
  \ Java 可以在不同平台上运行的原理。\n\n#### 2 JDK 和 JRE\n\n`JRE`（Java 运行时）\n\n!![](img/image_rsrc6ZD.jpg)\n\
