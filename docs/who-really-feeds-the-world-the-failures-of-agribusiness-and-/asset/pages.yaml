    Hybrid seeds are first-generation seeds produced from crossing two genetically
    dissimilar plant species. The progeny of these seeds cannot be saved or replanted,
    because the next generations will give much lower yields. Hybrid seeds force farmers
    to go to the market every season. Hybrid seeds lay the foundations for the biological
    patenting of the seed. No one else, nor rival company, can produce the same seeds
    unless they know the parent lines, which are company secrets. Combined with the
    introduction of new laws, this biological patenting effectively prevents the farmer
    from multiplying, saving, and selling seeds.


    GMOs, or genetically engineered organisms, are made by using the technique of
    gene splicing or recombinant DNA to introduce genes from an unrelated organism
    into the cells of a plant. This is done by one of two methods: using a gene gun
    to shoot the gene, or introducing a plant cancer called agrobacterium to infect
    the plant. Since both techniques are unreliable, an antibiotic-resistance gene
    is added to the cells that absorbed the new gene from those that did not. Further,
    since the gene is not part of the plant genome, there is a tendency for the plant
    to not express the traits for which the gene was introduced. For instance, genes
    of viruses are added as promoters so the plant is more likely to express the traits.
    In this way, every GMO has four characteristics: genes that do not belong to the
    plant, genes for plant cancer, genes for antibiotic-resistance markers, and the
    genes of viruses that act as promoters. This bundle of genes causes harm to the
    plant, to biodiversity, and to those who eat it.


