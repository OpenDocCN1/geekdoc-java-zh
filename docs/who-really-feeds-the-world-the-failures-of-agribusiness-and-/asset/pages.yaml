    According to Bacon, the discipline of scientific knowledge and the mechanical
    inventions it leads to not “merely exert a gentle guidance over nature’s course;
    they have the power to conquer and subdue her, shake her to her foundations.”
    In The Masculine Birth of Time, Bacon promised to create “a blessed race of heroes
    and supermen” that would dominate both nature and society. The gendered violence
    of his words are unmistakable: heroes and supermen will dominate and shake nature
    to her foundations.


    The Royal Society, founded in 1660 in London, is seen as being instrumental in
    the Scientific Revolution of the seventeenth and eighteenth centuries. The society
    was inspired by Bacon’s philosophy and seen by its organizers as a masculine project.
    In 1664 its secretary, Henry Oldenburg, announced that the intention of the society
    was to “raise a masculine philosophy. whereby the Mind of the Man may be ennobled
    with the knowledge of solid truths.” Joseph Granville, another fellow of the Royal
    Society, held that the masculine aim of science was to know “the ways of captivating
    Nature, and making her observe our purposes, thereby achieving the Empire of Man
    Over Nature.


    Scientist Robert Boyle, a founding fellow of the Royal Society and governor of
    the New England Company, saw the rise of mechanical philosophy as an instrument
    of power: not just over nature, but also over the original inhabitants of America.
    He explicitly declared his intention of ridding the New England Indians of their
