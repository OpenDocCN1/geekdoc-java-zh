    Through a mechanistic, reductionist framework, a myth has been created that without
    chemical monocultures we will have no food, and that biodiverse, organic farming
    is more expensive and a luxury for the wealthy.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'We must dismantle these myths. Under the industrial paradigm, toxic chemicals
    kill the biodiversity of bees, butterflies, and friendly insects. Chemical fertilizers
    kill soil organisms, destroying the soil and soil fertility. Nitrogen fertilizers
    create dead zones and kill the biodiversity of aquatic and marine life. Furthermore,
