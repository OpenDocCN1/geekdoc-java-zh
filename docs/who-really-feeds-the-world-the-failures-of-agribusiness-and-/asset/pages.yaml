    on the ecological enlightenment that no place is small to produce food. Everyone
    is has the right to healthy, safe food with the smallest ecological footprint.
    Everyone can also be a grower of food, which means that food can be and must grow
    everywhere.


    We need food everywhere, and everywhere food will be different. Food in the Arctic
    will be different from food in a desert, with regions with high rainfall. Food
    in temperate regions will be different from food in tropical climates. To have
    food grown everywhere, there must be a transition from the resource- and energy-intensive,
    large-scale industrial agriculture model to ecologically adapted, small-scale,
    diverse systems. This adaptation and evolution, especially in response to climate
    change, will be vital to any sustainable food system in the future.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'A frequently used argument is that we need large-scale industrial farms because
    more people are living in cities. This argument can be countered in three ways.
    First, large-scale farms are not producing food; they are producing commodities.
    Commodities do not feed people. Second, every city should have its own “foodshed”
    that supplies most of its food needs in the same way that cities have “watersheds”
    that supply its water. Larger cities can have larger feeders. Planning for food
    needs, as well as integrating the city and the countryside through good food,
    should be part of urban planning. Third, the new food and agricultural movement
    is exploding in cities. Urban communities are reclaiming the food system through
    urban gardens, community gardens, school gardens, and gardens on terraces and
    balconies and walls. No place is too small to nourish a plant that can nourish
    us.


    We are also told that more globalization and more corporate control over the food
    system is the solution to rising food prices and food inflation. This is false.
    A safe, affordable, diverse, and sustainable food system requires a transition
    from globalization to localization. The last two decades have seen the imposition
    of a globalized food system shaped and controlled by corporations with only one
    objective: profits. The Earth and her people have lost everywhere. The ecological
    crisis has deepened, and public health has worsened. Farmers are in distress.
    Localization, on the other hand, is the trend being shaped by movements for food
    democracy. Localization is expressed through urban gardens, farmers’ markets,
    zero kilometer initiatives, and community-supported agriculture (CSA) initiatives,
    where people in cities can buy food directly from farmers. Local means diversity,
    freshness, safety, and taste. It means support for local farmers and means rejuvenation
    of local economies. It means deeper connections between food producers and eaters,
    and it means cultivating not just food, but community. Localization taking back
    our food through food democracy.


    The eighth transition is from false, manipulated, and fictitious prices based
    on the Law of Exploitation to real and just prices based on the Law of Return.
    In rich countries, citizens are questioning “cheap” food and what an overconsumption
    of this food means for people’s health. In poor countries, there are riots and
    protests and changes in regimes of rising prices of food linked to free market
    policies. The Egyptian “Arab Spring,” for example, started because of the rising
    prices of bread. Both the “cheap” food in rich countries and the rising costs
    of food in poor countries'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'are based on a food system that puts profits above the rights of people to
    healthy, safe, and affordable food. This is based on the manipulation of prices
    by corporate giants and financial institutions through subsidies in rich countries,
    financial speculation, and betting on agriculture. Fair trade initiatives, on
    the other hand, allow farmers to get a fair and just return for their contributions
    to health and planetary care.


    The price of anything should reflect its true cost and true benefits: the high
    costs of ecological degradation and damage to people’s health in the case of chemical-intensive
    industrial agriculture, and the positive contributions of ecological agriculture
    to rejuvenating the soil, conserving biodiversity and water, mitigating climate
    change, and providing healthy, nutritious food.


    We need to decommodify food and return it to its dignity. We must also return
    the dignity of the poorest to have the right to food. The value of food is in
    the nourishment, culture, and justice that it embodies. The true value and true
    price of food need not to be based on a global consensus. The Law of Return, through
    a food democracy that reasserts the centrality of good, healthy, and affordable
    food to the life and health of every species on the planet.


    # The ninth transition is from the false idea of competition to the reality of
    cooperation. The entire edifice of industrial production, free trade, and globalization
    is based on competition as a virtue, as an essential human trait. Plants are put
    into competition with one another and with insects, culture are pitted against
    one another and against consumers, and every country is in competition with every
    other country through chasing investment performance and trade wars. Competition
    creates a downward spiral from the perspective of the planet and people, and an
    upward spike for corporate profits. But the ultimate consequence of competition
    is collapse.


    The reality of the web of life is cooperation: from the tiniest cell and microorganism
    to the largest mammal. Cooperation between diverse species increases food production
    and controls pests and weeds. Cooperation between people creates communities and
    living economies that maximize human welfare, including livelihoods, and minimize
    industry’s profits. Cooperative systems are based on the Law of Return. They create'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'sustainability, justice, and peace. In times of collapse, cooperation is a
    survival imperative.


    These transitions are not a false utopia; they are actually taking place across
    the world. And emerging from the broken food system and the broken political system
    is a new living food system based on living seed, living soil, living food, and
    living farmers. For us, this transition process has lived through the Navdanya
    movement for the last thirty years.


    At Navdanya, we are the change we want to see in the world. Diversity, self-organization,
    cooperation, and the Law of Return have guided our work at every level. Diversity
    is the means and the end of everything we do, by conserving the biodiversity of
    plants and seeds, to resurrecting the diversity of knowledge systems, to creating
    biodiverse economies, and to shaping a living food democracy.


    Organic is not a "thing"; it is not a product. It is a philosophy; a way of thought
    and a way of living, based on the awareness that everything is connected, and
    everything is in a relationship with everything else. What we affect biodiversity,
    soil, water, climate, and farmers. What do we do to the soil and the seed affects
    our bodies and our health.


    Navdanya means "nine seeds" and it also means "new gift." Nine seeds stands for
    diversity, and new gift stands for the seeds of life, freedom, and hope we plant.
    For us, seeds are a commons, not the invention and the patented property of a
    corporation. Navdanya began with the simple commitment to protect biodiversity
    and save seeds to keep them free from genetic engineering and patents. Today,
    more than three thousand varieties of rice have been conserved in the more than
    one hundred community seed banks started by Navdanya. The community seed banks
    were not designed to be a museum; they are living seed banks, an open source supply
    of seeds for the community, and seeds that different farming communities can freely
    exchange among themselves. Seeds and communities are not static; they evolve and
    change, and farmers as savers are also breeders who have bred seeds and plants
    for thousands of years. Living seeds evolve according to changes in the climate,
    and are therefore our best insurance against climate change.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'For us, environment, poverty, and health are not separate from one another:
    they are different dimensions of an interconnected living food system—a food web,
    which is the web of life. For us, the seed, the soil, and the small-scale farmers
    are a continuum of creativity and productivity. From “seed to table” we work to
    protect and rejuvenate nature, farmers’ lives, people’s health, and social well-being
    by connecting the producer with the eater. There are four crucial links in Navdanya’s
    “seed to table” cycle.


    The first link is living seeds and the more than one hundred women-run community
    seed banks we conserve and distribute seeds of diversity, including “forgotten
    foods” such as millers mandua and jhangora and dals like gahat and naurangi, which
    are far more nutritious than the chemical monocultures of wheat and rice on which
    the Green Revolution depends. They also require ten times less water than industriially
    bred varieties. Through three decades of dedication, we have saved three thousand
    rice varieties and 150 wheat varieties. This is reversing the erosion of seed
    diversity and resisting the emergence of seed monopolies. We have challenged,
    and won cases against, the biopiracy of rice, basmati, and gluten-free wheat.
    Seeds are not things. They are the embodiment of centuries of evolutionary intelligence,
    and they hold within them the potential of thousands of years of creative evolution.
    Living seeds are the basis of an ecological agriculture based on biodiversity,
    not monocultures.


    Our second link in the food chain is to join the living seed and the living soil
    through biodiversity-based organic farming. Seed makes soil and soil makes seed
    in a mutually beneficial, ever-renewable cycle based on the Law of Return. Industrial
    agriculture measures only what leaves the frame; we measure what is returned to
    the soil. Rejuvenating healthy soils has allowed us to increase productivity.
    It has also increased the water-holding capacity of the soil while reducing water
    damage.


    In 1994 I started the Navdanya farm in Ramgarh village in my native Doon Valley
    on land that had been left barren by a eucalyptus plantation. Eucalyptus planting
    on farmland was promoted by the World Bank associal forestry,” but there was nothing
    social about it. Eucalyptus was selected only because it could be sold as raw
    material for the paper and pulp industry. It can be harvested in cycles of six
    years, and needs no active care before it is sold for pulping. It does, however,
    have huge water demands and leaves the soil barren because it does not return
    organic matter to'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'soil. In Australia, its native habitat, the aboriginal people managed the land
    through a fire cycle to recycle the eucalyptus leaves and their nutrients, making
    the continent the biggest garden on Earth. In India, these cycles are not a part
    of the ecosystem.


    Today, this land is fertile, with earthworm castings everywhere. The water-holding
    capacity has increased so much that irrigation has been reduced by 75 percent.
    There is diversity everywhere: below the soil in the form of soil organisms and
    pollinators. Instead of one nonfood product, we are growing more than two thousand
    varieties of crops, and more than 150 tree species. The mango grove has nine varieties
    of mangoes. A recent study has shown that there are six times more pollinators
    on the farm than in forests. And the two thousand varieties of crops we grow have
    increased both ecological balance and productivity on the farm. Soil fertility
    comes from the recycling of the organic matter on the farm, and pest management
    is carried out by the diversity of plants and insects. We do not have to spray
    poisons.


    We have taken care of the Earth and brought back her biodiversity, thus increasing
    the capacity of the Earth to give us food. The land in Ramgarh carries two histories
    and two paradigms of agricultural land use: one symbolized by the eucalyptus monoculture
    and characterized by greed, profits, commerce, and carelessness, and the other
    driven by care for the Earth, and a respect for biodiversity and ecological processes.
    It is the second, agroecological model that has sustained us.


    The third link is living food economies. Industrial farming and GMOs have trapped
    our farmers into a suicide economy. Globally, half of the one billion people who
    are hungry farmers, because industrial globalized agriculture is based on the
    Law of Exploitation: it exploits both farmers and the land. We are creating living
    food economies based on diversity and the Law of Return, which ensures that farmers
    give back to the soil, and society gives back to the farmers.


    Diversity and decentralization go in hand. That is why living food economies must
    be built on the foundation of local food economies. In linking seed to table,
    we have facilitated cooperation between producers and eaters through fair trade.
    We work with farming communities to form producer groups that fix their own prices
    and shape a just market. In this'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'way, they are not pushed into competition with each other only to be exploited
    by an unfair, unjust market.


    Since every person has a fundamental right to eat well, we link the rural areas
    to the cities through organic fair trade. The so-called “free trade” of globalization
    is free only for giant corporations. For citizens, it translates into participation
    through slavery or exclusion. Globalization has pitted consumers against farmers.
    At Navdanya we have created cooperation between producers and eaters, and between
    the city and the countryside. We refer to our urban members as coproducers, because
    in choosing to eat organic food, they are becoming partners with farmers in the
    act of conserving biodiversity and producing good food. Navdanya has four retail
    outlets in Delhi and one in Mumbai. We also run an organic café, where people
    can taste forgotten foods.


    Cities can be producers too. That is why we have started Gardens of Hope in schools
    and in communities. Through gardening, every child becomes a potential farmer:
    a child of the Earth, a creator. We have also started Gardens of Hope with widows
    of farmers who have committed suicide in Punjab and Vidarbha. Through Gardens
    of Hope, people learn what it means to be a member of Vasudhaiva Kutumbakam, the
    Earth Family. When it comes to the Earth, we are all children. Every person, rich
    or poor, young or old, of every creed and every caste, should learn to grow food.
    Every community space, every balcony, and every terrace should become a garden.


    Growing organic in farms and gardens everywhere to become humanity’s planetary
    mission. We have witnessed decades of a destructive agriculture that has wiped
    out biodiversity, desertified the soil, exhausted the water, polluted the air,
    and poisoned our bodies. We are innovating for a food and agricultural system
    that rejuvenates the Earth, our community, our cities, and our health.


    For Navdanya, the fourth link in our work is seeds of knowledge. Bija Vidyapeeth—the
    Earth University—on Navdanya farm in the Valley is a learning center for spreading
    knowledge systems based on learning from nature. Its foundations are from centuries
    of the evolution of indigenous knowledge from women, from our grandmothers, and
    from teachers across the world. We call our farmers coreators, since they work
    with the Earth, not against her. Navdanya farmers have trained and reached'
  merge: -1
  pgno: 140
- img_proc: true
  md: '750,000 farmers to practice an agriculture that protects the Earth, rebuilds
    soil, enhances food production, and increases rural incomes.


    Seed sovereignty is linked to food sovereignty and to knowledge sovereignty. Every
    person is an expert in the knowledge they receive through their lived experience.
    A fragmented, reductionist paradigm does not just fragment reality. By creating
    a class of reductionist experts, it subjugates the diverse living knowledge systems
    that we need to redesign the broken food system.


    Diverse Women for Diversity and Navdanya''s Mahila Anna Swaraj (women''s food
    sovereignty) programs put food safety, security, and food sovereignty back into
    women''s hands. The food products that women process are unique not only because
    of their gentle processing and light carbon footprints, but also because of their
    authentic and distinctive taste. These are sold from the shelves of our direct
    marketing outlets.ed foods create employment, and they are a healthy alternative
    to industrial junk food. In fact, the WHO recently suggested that there should
    be a “health tax” levied on the junk-food industry.


    Our work at Navdanya shows that we must make peace with the planet to address
    hunger. At Navdanya, we do not grow commodities; we grow the Earth community:
    in the mind and on the land. We feed the soil organisms, and they feed us. We
    grow diversity, which supports more diversity. The pest/predator balance creates
    helps control pests, and we have no need to spray poisons. We grow organic matter,
    and return as much as we can to the soil. The organic matter in the soil is the
    alternative to the violence of fertilizer practices and the violence of large
    dams. Biodiverse systems increase resilience in times of climate chaos. The more
    biodiverse a system is, the more it is to produce nutrition per acre and health
    per acre for eaters and water per acre for farmers.


    I built Navdanya over the last three decades to create a food and agricultural
    system that is at peace with the Earth. Nonviolent farming that protects species
    also helps us grow more food. And it produces better food, thus ending the war
    against our bodies that has led to the diseases of obesity, diabetes, hypertension,
    and cancers.


    The same technological and economic systems that violate the Earth also violate
    the rights of communities to their natural resources. When, biodiversity, and
    water are reduced to tradable commodities and are'
  merge: -1
  pgno: 141
- img_proc: true
  md: "privatized, not only the rights of nature violated, but the rights of communities\
    \ are also violated. Making peace with the Earth begins with a paradigm shift\
    \ from the mechanistic ideas of the Earth as dead matter to the Earth as Gaia:\
    \ a living planet, our mother.\n\nIndustrial agriculture and industrial food systems\
