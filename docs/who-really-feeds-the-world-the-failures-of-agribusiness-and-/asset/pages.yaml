- img_proc: true
  md: 'Industrial agriculture is intolerant of diversity. Diversity is nourishing
    and naturally resistant, but in order to increase profits, industrial agriculture
    makes crops dependent on external inputs such as chemical fertilizers, pesticides,
    herbicides, and genetically modified seeds. Not only does industrial agriculture
    look more and more like chemical warfare against the planet, the distribution
    of food also looks like war, with so-called “free trade” treaties pitting farmer
    against farmer, and country against country, in perpetual “competition” and conflict.
    Free trade allows corporations and investors to grab every seed, every drop of
    water, and every inch of land; it limitlessly exploits the Earth, the farmers,
    and all citizens. This model sees profits as the endgame, where no thought or
    care is given for the soil, for producers, and for people''s health. Corporations
    do not grow food; they grow profits.


    The industrial paradigm replaces truths with manipulation, and reality with fictions.
    The first fiction is the fiction of the corporation as a person. Acting under
    this guise of personhood, corporations write the rules of production and trade
    to maximize their profits and exploit living beings. A second fiction is that
    “capital”—not the ecological processes of nature and the hard and intelligent
    work of farmers—creates wealth and food. People and nature are reduced to mere
    inputs. The third fiction is that a system that more inputs than it produces is
    efficient and productive. This is manipulated by hiding the financial costs of
    fossil fuels and chemicals, as well as the devastating health and environmental
    costs of a chemical-intensive system to the planet and its people. A fourth fiction
    is that which profitable to corporations is profitable and good for farmers. As
    the profits of corporations in food and agricultural systems grow, farmers become
    poorer by getting deeper in debt and are finally forced off their land. The fifth
    fiction is that food is a commodity. The reality is the more food is converted
    into a commodity, the more it is taken from the poor, which creates hunger, and
    the more it is degraded in quality, which leads to disease.


    What we are talking about here is not a food system—it is food into conflict with
    itself as it is violently pulled out of the food web and local economies to be
    traded for profit and thrown away as waste. The result is ecological catastrophe,
    poverty, and hunger. The future of food depends on remembering that the web of
    life is a food web. This'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'book is dedicated to this remembering, because forgetting the ecology of food
    is a recipe for famine and extinction.


    Over the past three decades I have realized that our current food system is broken.
    In 1984 I began studying the Green Revolution in Punjab. The Green Revolution
    is the misleading name given to a chemical-based agricultural model that was introduced
    to India in 1965. Following World War II, chemical companies and factories were
    searching desperately for new markets for synthetic fertilizers and factories
    of the war. Indigenous varieties of crops rejected the artificial fertilizers,
    so plants were redesigned as dwarf varieties to allow them to take up—and become
    dependent upon—chemicals. By the mid-1960s, this new seed/chemical package was
    ready to be exported to countries in the Global South under the label of the Green
    Revolution.


    The false narrative perpetuated by the Green Revolution is essential to understanding
    the dominant narrative that has been created around food and agriculture. This
    narrative credits the Green Revolution with pulling India out of starvation, for
    which Norman Borlaug—the leading scientist on the project—was awarded the Nobel
    Peace Prize in 1970. But there was no starvation in India in 1965. Food prices
    had risen in cities due to a nationwide drought, and the country needed to import
    food grains. But under a policy to promote chemicals in agriculture, a condition
    was created by the US government and the World Bank under which grains would be
    sent to India by America only if it imported seeds and chemicals.


    There was a huge gap between the Green Revolution’s narrative of success and the
    realities in Punjab. Reduced to a land of rice and wheat, Punjab producing less
    food and nutrition as a result of industrial agriculture. Once farmers in Punjab
    grew forty-one varieties of wheat, thirty-seven varieties of rice, four varieties
    of maize, eight varieties of bajra, sixteen varieties of sugarcane, nineteen varieties
    of pulses, and nine varieties of oilseeds.¹⁰ The majority of this diversity was
    destroyed. In the place of wheat grains with names like Sharbati, Darra, Lal Pissi,
    and Malwa, which described the origins and quality of the crops, we find personality-less
    monocultures named HD 2329, PBW 343, and WH 542:'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'crops infested with pests and diseases, requiring ever-higher doses of pesticides.


    While the Green Revolution in Punjab has left behind desertified soils, depleted
    aquifers, disappearing biodiversity, indebted farmers, and a “cancer train” that
    carries the victims of pesticide-related cancer to Rajasthan for free treatment,
    this nonsustainable model is being exported to the eastern states of India and
    to Africa. Bill Gates, with billions of dollars, is brilliantly pushing chemicals
    and commercial seeds into Africa through the Alliance for a Green Revolution in
    Africa. In fact, all aid routed through policies of the G8 countries is democratically
    imposing a failed model on Africa. Sadly, the true lessons from Punjab''s Green
    Revolution were only learned by those who were destroyed in its wake.


    Today is a second Green Revolution under way: one driven by GMOs. GMOs, or genetically
    modified organisms, are engineered crops with toxins introduced into them. Like
    the original Green Revolution, GMOs claim to “feed the world.” But the reality
    is that GMOs do not produce more, they have led to increased chemical use, and
    they fail to control weeds and pests. Genetic engineering creates an entirely
    new type of pollution on our planet, negatively impacting plants and animals,
    human health, and the livelihoods of farmers and local communities. The only beneficiaries
    of GM crops are corporations, because they sell more toxic chemicals and they
    also collect royalties on seed. As a matter of fact, corporations’ greed and desire
    to own seeds is the only reason why GMOs are being pushed democratically into
    food and farming systems across the world.


    But something is shifting. The anger that burst in Punjab in 1984 is bursting
    everywhere—whether it be the streets of Egypt, where the Arab Spring began as
    protests against rising prices of bread; or Syria, where the conflict started
    as protests by peasants seeking relief for crop failure due to an intense drought;
    or millions of people from every walk of life joining the March against Monsanto,
    protesting the control of corporations over what we grow and eat. There is discontent
    everywhere because the dominant industrialized and globalized food system, controlled
    by a handful of corporations, is destroying the planet, farmers’ livelihoods,
    people’s health, democracy, and peace. In the face of this, redesigning the food
    system has become a survival imperative.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'So what is preventing us from transitioning to an ecologically friendly, people-friendly
    food system?


    The first barrier comes from the power of corporations, which are rooted in the
    architecture of war. Just five seed and chemical giants—Monsanto, Syngenta, Bayer,
    Dow, and DuPont—seek to completely dominate our food system. Corporations are
    a legal construct that are now claiming personhood. But corporations are not people.
    They are not born and do not die. They cannot grow food and they cannot eat food.
    Yet they are taking over our sustainable and nourishing food systems, replacing
    them with commodities and violence.


    The second barrier comes from the militarized, mechanistic, reductionist, and
    fragmented paradigm of agriculture that creates a blindness to the contributions
    of diverse species and the ecological processes and functions that they provide
    and participate in. This paradigm refuses to acknowledge and include women and
    small-scale farmers, who provide most of the world’s food, and whose knowledge
    is vital to sustainable food production.


    The third barrier comes from greed and a callous of prosperity based on greed.
    The greed of corporations for profits is blocking a transition to a healthy, sustainable,
    and democratic food system. For farmers, the system of corporate greed manifests
    in an imperative to chase an illusion of more money, even though farmers are the
    losers in a high-cost industrial system of production. As citizens, corporate
    greed reduces us to mere consumers, and the majority of us remain unaware of how,
    and by whom our food was grown, and what our food actually contains.


    So what, then, really feeds the world? Again, we must ask ourselves what we mean
    by “food” and what we mean by “world.” If “food” is the web of life—the currency
    of life, our nourishment, our cells, our blood, our culture, and our identity—and
    the “world” is Gaia—our rich and living planet, our Mother Earth, vibrant with
    diverse beings and ecosystems, multitudes of peoples and cultures—then it is the
    contributions of biodiversity, compassion, and the knowledge and intelligence
    of small-scale farmers that feed the world. My own research and lived experience
    over the last three decades taught me that the answer to the food question does
    not lie in industrial agriculture but in agroecology and ecological farming.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Food is produced by the soil, the seed, the sun, the water, and the farmer,
    all interacting with one another. Food embodies ecological relationships, and
    the knowledge and science of the interactions and interconnectedness that produce
    food are called agroecology. Agroecology feeds us.


    Fertile soil is the basis of food production. Soil fertility is created by billions
    of soil organisms that come together to form the soil food web. Biodiversity and
    soils rich in organic matter are also the best strategy for climate adaptation
    and water conservation. Water is vital for living soils, and organic farming conserves
    water by increasing the water-holding capacity of soils through recycling organic
    matter. The soil becomes like a sponge, which can absorb more water, reducing
    water use and also contributing to resilience to climate change. Living soil feeds
    us.


    Pollinators like butterflies take pollen from one plant to another, fertilizing
    them in the process. Without pollinators, plants would not reproduce. Pollinators
    feed us.


    Feeding the planet means sustaining the integrity and diversity of the food web:
    from the soil to the oceans, microorganisms to mammals, from plants to humans.
    The food system is not outside nature and the Earth. It is based on the ecological
    processes through which the planet creates, maintains, and renews life. The planet
    is living; its currency is life; its is food. As the ancient Indian text Taittiriya
    Upanishad reminds us, “Everything is food. Everything is something’s food.” Nature,
    contrary to what industrial agriculture tells us, is very much alive, and its
    diversity feeds us.


    Farmers are plant breeders and savers, soil conservators and soil builders, water
    preservers and water keepers. Farmers are food producers. While using only 30
    percent of the world’s resources, small-scale farmers provide 70 percent of the
    planet’s food. Small-scale farmers, farming families, and gardeners feed us.


    Seed is the first link in the food system. Without seed there is no food. Without
    diversity of seed, there is no diversity of food and nutrition, which is vital
    to health. Without diversity of seed, there is no climate resilience in times
    of climate chaos and climate instability. Seeds feed us.


    Food is not a commodity; it is not a perfume or a piece of jewelry that can be
    sold anywhere in the world. Every being engages with food differently, and each
    culture or locality produces its own food. Since'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'everyone must eat, local food sovereignty is the key to food security: localization
    feeds us.


    Working with seed, biodiversity, soil, and water, according to the laws of nature
    and ecology, this knowledge and its practice have traditionally belonged to women,
    who make up the majority of the world’s food producers. **Women feed us.**


    Food is life, and it is created through living processes that sustain life. In
    agriculture and food production, nature and nature’s laws come first. Violating
    these laws and trespassing on nature’s limits of renewal—of seed and soil, water
    and energy—is a recipe for food security and future famines. While rejuvenating
    nature’s economy, ecological agriculture produces more and better food, and it
    rejuvenates the health and well-being of communities. Taking care of the Earth
    and feeding people go in hand.


    Feeding the planet raises some of the most fundamental questions of our times.
    The food question becomes an ethical question about our relationship with the
    Earth and other species; about whether we have the right to push species to extinction
    or deny numbers of the human family safe, healthy, and nutritious food. It becomes
    an ecological question about whether humans will live as members of the Earth
    Community or push themselves to extinction by destroying the ecological foundations
    of agriculture. It becomes a cultural question about our food cultures, our identity,
    and our sense of place and rootedness.


    Feeding people is a knowledge question about whether we continue to think through
    a destructive, reductionist, mechanistic paradigm, viewing seed and soil as dead
    matter and mere machines to be manipulated and poisoned, or whether we think of
    seed and soil as living, self-organizing, self-renewing systems that can give
    us food without the use of chemicals and poisons. It is also a knowledge question
    about whether we see centuries of farming by peasants based on knowledge, and
    farmers as intelligent, or whether we think of farmers as ignorant just because
    they may not have been to college.


    The food question is also an economic question: about whether the poor eat or
    go hungry; about whether public taxes go to subsidize an unhealthy and nonsustainable
    food system; about whether seeds are in the commons or owned through patents by
    corporations; and about whether food is'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'distributed on principles of justice, fairness, and sovereignty, or on the
    basis of the unfair rules of so-called “free trade.”


    Once I realized how misguided and false the dominant system of agriculture was,
    I dedicated my life to saving seeds and promoting organic farming and ecological
    agriculture. Instead of intensifying chemical and capital inputs that were pushing
    our small-scale farmers into debt, I committed myself to intensifying biodiversity
    and ecological processes, working with nature, rather than declaring war against
    her.


    In 1987 I started Navanya, a movement for saving seeds, protecting biodiversity,
    and spreading ecological methods of farming. We have helped create more than one
    hundred community seed banks, which have provided open access seeds to farmers
    to grow tasty, nutritious crops with no external inputs, increasing their own
    nutrition while also increasing their incomes. These seed banks have rescued farmers
    in times of climate extremes, including droughts, floods, and cyclones. Beginning
    with the saving and sharing of seeds, we now share the seeds of the knowledge
    of agroecology. Through our Earth University we spread the ideas and practices
    related to living seed, living soil, living food, living economies, and living
    democracies. Through the practice of biodiversity-based, ecological agriculture,
    we teach how food can be grown in health and abundance, and farming can be done
    to enhance the fertility of the soil, increase biodiversity, conserve water, and
    reduce greenhouse gases that contribute to climate change.


