    When we use the term “livelihood,” we are talking about self-organized work in
    living economies, based on cocreation and coproduction. A livelihood is not a
    “job.\. The word “job” was first used during the rise of the Industrial Revolution
    to describe piecework: a type of work that was measured by the number of items—or
    “pieces”—produced, such as garments or tools. The etymology is significant when
    we think of how the word “job” is used today. A “job” is based on the reduction
    of a creative, autonomous human being to “labor,” and the further reduction of
    labor to a commodity. Peasants and small-scale farmers do not have jobs; they
    have livelihoods. Women providing food to their families and communities do not
    have “jobs,” yet they work more and harder than anyone else.


    Generating meaningful and productive work and creating employment, including self-employment,
    all outputs are in an ecological system of production. Reducing human activity
    to labor, and transforming it from an output to an input, is a prescription for
    unemployment, displacement, and the destruction of livelihoods of small family
    farmers and their communities over the world.


    The devaluation of livelihoods is also a recipe for further intensifying the external
    inputs of chemicals and fossil fuels, which rather than feeding people and sustaining
    farming systems, create hunger and generate environmental degradation. This is
    known as the “myth of more,” in which an agricultural system where a farmer spends
    more for costs of inputs than she or he will earn from selling a monoculture commodity
    is presented as “productive,” a path to higher incomes and higher production.
    The reality that undercuts this myth is that through globalized trade, genetically
    engineered seeds, and corporate-owned farms, farmers’ incomes are actually declining,
    leading to debt, displacement, and the suicides of farmers.


    According to the Indian Ministry of Agriculture, which has vested interests in
    corporate, large-scale agriculture,


    Limited holding per capita in India is a great obstacle which inhibits large scale
    mechanisation and adopting other measures for increasing the productivity and
    bringing down the unit cost of production. It is a well known fact that in the
    major exporting countries like USA, Canada, and Australia, the cost of production
    is low since the farms are fully mechanised, little human labour is used,'
