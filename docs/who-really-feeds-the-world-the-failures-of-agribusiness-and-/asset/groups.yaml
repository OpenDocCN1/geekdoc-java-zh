    农场是比绿色革命或基因工程更有效的全球饥饿解决方案。


    纳德达尼亚（Navdanya）在印度的研究表明，小规模、生物多样化的农业增加了农民收入。如今外部强加在印度农民身上的四种作物是转基因棉花、杂交稻、杂交玉米。在公平的贸易体系中，种植有机棉、本土水米、小米和本土豆类的农民，比通过大宗贸易销售农产品的农民赚得更多。种植杂交稻的农民每公顷收入
    71,862 卢比，而纳达达尼亚成员穆昆迪·拉尔（Mukundi Lal）种植本土巴斯马米每公顷收入 30,131 卢比。种植大豆的农民每公顷收入 2,863
    卢比，而像恰克拉塔的莫汉·辛（Mohan Singh）这样种植本土菜豆的农民每公顷收入 267,399 卢比。种植杂交玉米的农民每公顷收入 30,657 卢比，而鲁德拉普拉亚杰的拉杰什瓦里（Rajeshwari）种植小米（ragi）每公顷收入
    219,400 卢比，而种植苋菜的苏谢拉·德维（Sushela Devi）收入更多。在小农场保护生物多样性和实践农业生态学无疑增强了农民的收入。


    小规模农民不仅是食物和营养的生产者。他们还是种子和土壤的守护者、水和土地的保护者，以及生物文化多样性的保护和恢复者。他们用更少的资源产出更多，因此比取代他们的大型工业单一种作物更有生产力和效率。小规模农民仅占全球不到
    30% 的耕地，生产了世界上 70% 的食物。另一方面，农业企业利用全球 70% 的耕地仅生产了 30% 的食物。


    那么，究竟是谁在养养世界？数据清晰有力。


    今天，小规模农民正处于危机之中。他们正在被企业全球化的规则抹杀，这些规则旨在以小规模农民为代价来实现企业利润的最大化。企业以种子和化学品的形式向农民出售昂贵的投入品，并廉价收购他们的农产品。农民陷入债务陷阱，耕作变得无法维持，导致大量人口从农村向城市贫民窟迁移。自
    1991 年农业全球化政策实施以来，农民人数从 1.1 亿人减少到 9580 万。这意味着失去了近 1500 万名农民，或者平均每天损失两千名农民。


    通过激进的土地掠夺，农民正在失去他们的土地。全球农用地总量在萎缩，但土地正日益集中在少数大型私有实体手中。在欧盟，前 1% 的农场控制了欧盟 20% 的耕地，前
    3% 的农场控制了欧盟 50% 的耕地。 80% 的农场（假设由小规模农民组成）控制着所有农用地的 14.5%。向大规模农业经营的转变迅速排挤了农民；在 2007
    年至 2010 年间，拥有少于 10 公顷欧洲耕地的小规模农民减少——这一面积大于瑞士，而拥有超过 50 公顷土地的农民和公司在同期增加了近 700 万公顷——这一面积是比利时的两倍。


    在美国，农田正离开农民手中，要么是因为他们“太老了”无法耕种，要么是被迫抵押土地。企业开始收购农田，特别是在大规模工业农业主导的地区。根据美国农业部（USDA）的一份报告，美国
    40% 的农田是农民从银行和投资者那里租的。在包括爱荷华州、伊利诺伊州和加利福尼亚州在工业农业中心州，数字高达 50%。


    在印度，为了矿山、公路和扩张城市的土地掠夺使农民和部落人失去了农田和家园。根据印度农业部的数据，在通往 2010-2011 年的十年里，印度失去了 1.6
    万平方公里（0.8%）的耕地面积。这些损失大部分是以农村土地为代价并增加到城市的；印度人口普查专员计算，同一时期城市面积增加了 2.4 万平方公里。随着城市增长，邻近的农业区域萎缩。印度
    28.4 万起自杀事件与债务引发的土地掠夺有关。企业在“农民将赚得更多”的虚假承诺下推销昂贵的种子和化学品，使农民陷入债务陷阱。当债权人来夺地时——因为农民没有变富，反而欠了债——农民服农药结束生命。


    “大规模养活世界而非小规模”的假设正在破坏养活我们的农业和社区基石，从而破坏了我们的粮食安全基础。


    是时候让小规模的活力经济与小规模的活力民主相结合，为所有人创造和平、和谐、富足和福祉了。甘地通过拿出纺车来对抗大英的庞大，手工纺织衣服，从而拒绝从英国进口机器纺织品，而这些纺织品本身依赖印度的棉花。通过这样做，他发起了本土运动（Swadeshi
    movement），鼓励无数印度人效法他的榜，在范围内收回纺织生产。这种小规模产生了巨大的连锁影响。正如甘地所说：“数百万人做的事将具有独特的力量……这个轮子是没有生命的，但当我赋予它象征意义时，它对我来说变成了一个活生的东西。”


    受甘地纺车的启发，纳德达尼亚开始拯救种子并推广农业生态学，创造了粮食安全、生计安全和生态安全。种子是微小的，但它也是生命的源泉。通过与规模农民合作，我们正在创造粮食安全、生计安全和生态安全。种子是微小的，但它也是生命的源泉。


    “大规模养活世界而非小规模”的假设正在破坏养活我们的农业和社区基石，从而破坏了我们的粮食安全基础。


    是时候让小规模的活力经济与小规模的活力民主相结合，为所有人创造和平、和谐、富足和福祉了。

    '
