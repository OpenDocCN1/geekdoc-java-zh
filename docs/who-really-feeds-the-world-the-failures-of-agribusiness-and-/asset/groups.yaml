    印度饮食中含有铁。事实上，由于铁的吸收随着维生素 C 的增加而增加，女性的知识确保了富含维生素 C 的酱（chutneys）作为饮食的一部分被食用。但这种知识正在被忽视和抹除.¹¹⁸


    营养不良的解决方案在于种植营养，而种植营养意味着增加生物多样性。这意味着要承认数百万印度女性对生物多样性和营养的知识，这些知识是她们作为祖母的智慧代代相传的。但存在一种创造神话，它对自然的创造力、生物多样性，以及女性的创造力、智慧和知识视而不见。根据这种父权制科学的创造神话，富有且权力的男性是“创造者”。他们可以通过专利和知识产权拥有生命。他们对数千年的自然复杂演化进行摆弄，并声称他们微不足道的具有破坏性的基因操纵“创造”了生命、“创造”了食物并“创造”了营养。


    用于生物化的转基因生物（GMOs）是一个父权项目的一部分，该项目使得女性在生物多样性和营养方面的优越知识变得隐形并被取代。在转基因香蕉的案例中，是一个人——比尔·盖茨——资助了一位澳大利亚科学家——戴尔（Dale），后者通过了解一种作物——香蕉——将低效且危险的转基因香蕉强加给印度和乌干达的数百万人，而这些人在数千年来已经种植了数百种香蕉品种以及数千种其他作物。


    营养不良的答案不在于单一栽培和男性企业对我们种子和食物的支配性统治。它在于我们农场和花园中的生物多样性，以及我们食物系统的文化多样性：它在于女性的手和女性的大脑中。


    由女性塑造的农业系统具有许多关键特征：农业从小规模经营，自然资源得到保护和再生，对化石燃料和化学品的依赖很少或没有依赖。


    生产所需的投入（如肥料）是在农场通过堆肥、绿肥或固氮作物生产的。多样性和整合是关键特征，营养是一个关键考虑因素。小农场上的女性在保护资源的同时，使每英里的营养和健康水平最大化。


    由于为了食用而种植了食物，大多数食物在家庭或当地水平消费，只有一部分运往远方。以女性为中心的农业是农村社区粮食安全的基础。当家庭和社区粮食安全时，女性儿童就有粮食安全。当家庭和社区粮食不安全时，由于性别歧视，女性儿童在营养不良方面付出的代价最高。


    全球南方的女性农民主要是小农户。女性与生物多样性之间的伙伴关系在历史上一直让世界饱腹，并在未来将继续滋养世界。确保粮食安全需要保护和促进这种伙伴关系。


    基于多样性、去中心化和通过生态方法提高小农场生产力的农业，是以女性为中心、亲近自然的农业。在这种以女性为中心的农业中，知识是共享的，其他物种和植物是亲缘而非“财产”，可持续性基于地球肥力的再生。女性的耕作和知识与新兴的农业生态科学范式深层联系，在这个范式中，没有基因工程作物的单一栽培之地，也没有寻求破坏而非保护的无情经济学。


    食物的未来需要由女性夺回、由女性塑造并由女性进行民主化控制。只有当食物在女性手中时，食物和女性才能安全。


    1996年，玛丽亚·米斯（Maria Mies）和我发起了《粮食安全掌握在女性手中的莱比锡倡议》。全球的女性正在抵抗企业对食物系统的控制，并创造替代方案以确保其社区的粮食安全。这些包括：


    - 本地化和区域化，而非全球化

    - 非暴力而非侵略性统治

    - 公平与互惠而非竞争

    - 对自然及其物种完整性的尊重

    - 将人类视为自然的一部分，而非自然的主宰

    - 保护生产和消费中的生物多样性


