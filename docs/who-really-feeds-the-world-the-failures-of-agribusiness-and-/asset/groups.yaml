    第二个障碍来自军事化、机械化、还原论和碎片化的农业范式，这种范式导致了人们对多样化物种的贡献，以及它们所提供和参与的生态过程与功能视盲目。这种范式拒绝承认和纳入妇女和小农，而他们提供了世界的大部分食物，且他们的知识对于可持续食品生产至关重要。


