    无法种植食物的人，而成为完全的人类的一部分是与地球及其社区重新建立联系。


    第二次转型是从机械论、还原论的科学转向基于关系和互联互性的农业生态学科学。它承认土壤、种子、水、农民和我们的身体都是智能生物，而不是死寂的物质或机器。基于战争暴力的专业知识对于演进这种智能没有意义，它对于养活人类或复兴地球也没有意义。这种智能存在于土壤中，在种子中；在植物和动物中；在我们的手和身体中。那些将化学战作为农业专业知识进行教授的老旧大学正被作为学校的农场所取代，在那里，增长着生产真实食物的真实耕作知识。从企业和利润的统治中转出来，也是一种通向新兴的农业生态学科学范式的知识转型。


    第三次转型是从种子作为公司的“知识产权”转向种子作为活的、多样化的且演化的生命：种子作为公有资源是食物的来源和生命的源泉。社区种子库和种子图书馆的建立是种子自由运动的一部分，这些运动正在抵抗基于统一性的不科学且不公正的种子法律的强加。这种抵抗的一部分还包括通过参与式和进化性育种进行创新的科学运动，它们为工业化育种提供了成功且优越的替代方案。


    第四次转型是从化学强化转向生物多样性强化和生态强化，从单一种作物转向多样化。我们必须实现从将化学品和毒素作为农业的主要投入转向无化学的、农业生态系统。生态系统能产生更多食物和营养的证据正在增加。化学品在耕作和我们的食物中没有立足之地。这种转型必须从“高产”的幻象转向多样化系统输出的现实，包括数量、质量、口感、健康和营养。生物多样化的农业系统不仅生产率更高、更有韧性，生物多样化的食物系统也是防御与营养缺乏相关的疾病的最佳保险。例如，印度的阿育吠陀科学（Ayurveda）证明，所有食物都应该具有六种味道，这确保了多样性和健康。


    第五次转型是从伪生产力转向真实生产力。将活的自然和创造性的人类还原为“土地”、“劳动”以及投入工业系统的更多投入，是一种基于剥削法则的伪生产力系统。复兴自然资源并创造有意义的工作和可持续生计是良好耕作的目标和产出，不能被还原为投入。在伪生产力的计算法中，逻辑是最小化劳动投入以增加生产力。这意味着排挤农民。在真实的生产力计算法中——一种基于真实而非抽象的计算——创造性工作作为产出被最大化以增加生产力。真实的生产力必须体现化学化、资本密集型和化石燃料密集型工业农业的所有社会、健康和生态成本，以及生态农业对公共健康、社会凝聚力和生态可持续性的益处。真实的生产力计算法承认农民的权利。在一个生态和充满生命的世界里，农民不仅是食物的生产者；他们还是生物多样性和稳定气候的保护者和建设者，是健康的提供者，以及我们多样集体文化的守护者。


    我们时代最重要的转型是土地和劳动的去商品化和解放，关注自然的生命智能，以及她的多样性和创造丰饶的潜力。我们还必须将焦点转向创造性的、智能的、努力的人，他们拥有对自己的土地、种子、知识、创造性工作以及通过“回报法则”（Law
    of Return）获得其创造性工作成果的权利。这种转型正由多元运动的塑造，这些运动致力于承认地球母亲的权利，以及所有人类在食物网中进行智能和民主参与的权利。


    第六次转型是从虚假食物转向真实食物，从破坏我们身体和心智的食物。这也是从食物作为为了利润生产的商品转向食物作为健康和福祉最重要的来源的。整个食物和农业系统将食物视为一种待生产、加工和交易的商品，完全是为了最大化公司利润。食物的最高价值在于提供健康和营养，食物的主要贡献是对公共健康，而非公司利润。商品仅基于数量，而无论它们是营养空虚的还是满了毒素和毒物。作为可交易商品的食物丧失了它的营养价值。


    真正挑战主导食物系统涉及培养种植真实、多样化食物的能力，建立创新的系统在当地分发新鲜健康的食物，并培养对真实食物与虚假食物区别的认知。这涉及到知道你所吃食物的权利、选择生态可持续、健康且安全食物的权利，以及作为一个社会拥有独立于工业的科研和监管机构的权利。由于对安全食物权利的威胁源于不公正和不民主的法律，通过“真理力量”（Satyagraha）——一场为了真理的斗争——不履行此类法律成为一种伦理和政治上的必要要求。这就是我们在
