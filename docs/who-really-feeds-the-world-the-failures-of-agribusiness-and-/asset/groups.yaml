    ## 4

    ### 生物多样性滋养世界，而非毒性单一作物


    历史上，超过七千种生物曾养过人类：这是我们星球生物多样性的显著标志。在生物多样化的农业系统中，数以千计的昆虫为作物授粉并为我们提供食物。益虫通过维持自然的虫敌平衡来控制害虫。数百万微小生物为土壤创造生命和肥力。肥沃健康的土壤为我们提供丰富健康的食物。在生物多样化的农场、生态系统或星球上，食物网就是生命。


    但今天，三十种作物提供了人类饮食中90%的热量，而只有三类物种——水米、小麦和玉米占了我们热量摄取的50%以上。根据《世界粮食植物遗传资源状况》，20世纪初在美国记录的7,098个苹果品种中，96%已经丢失了。此外，95%的卷心菜、91%的田玉米、94%的豌豆和81%的番茄品种也丢失了。在墨西哥，1930年报告的所有玉米品种，今天仅存20%。


    我们食物和土地上生物多样性的丧失是因为工业化农业系统促进了单一作物。单一作物基于仅一种品种作物的栽培，这种品种是为了应对外部施加的化学品或毒素而培育的。


    生物多样性的快速侵蚀发生在一个食品体系之下，这种体系将农场视为商品工厂，而非食物生产和生命的网格。这些工厂依靠曾为战争设计的化学品运行，并正在摧毁在我们星球上繁荣了数千年的多样物种。生物多样性增加了生态系统及其生态功能的稳定性，而基因、物种和生物群数量的减少降低了整个社区的效率和韧性。


    三种力量驱动了全球生物多样性的消失，这三者都与企业对种子的控制有关。第一是大大企业进入种子市场，使农民演化的局部多样化品种被公司工程并销售的统一商业杂交种和转基因生物所取代。尽管我们过去曾拥有形状不同、营养丰富且具有季节性的水果，而今天，我们有全年供应的统一品种。第二个因素是全球化驱动的长途贸易。多样性与地方性并存，但在长途贸易中，多样性消失了，取而代之的是全球化的单一性。


