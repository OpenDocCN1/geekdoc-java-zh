    超级杂草和超级害虫的出现。在美国，抗甘膦（Roundup Ready）作物已经产生了抗甘膦的杂草。现在有约1500万英亩的土地被超级杂草占据，为了杀死这些杂草，孟农公司支付农民每英亩12美元，用于喷洒致命的除草剂，例如越南战争期间使用的**橙剂剂**。


    像抗甘膦玉米和大豆这类抗除草剂植物，导致了甘草膦（除草剂中的成分）的使用量增加，这种物质会杀死所有其他植物，包括乳草——这是黑斑蝴蝶产卵的唯一植物。黑斑蝴蝶是作物重要的授粉者，也是世界上最美丽的生物之一。随着抗甘膦作物增加到90%，乳草减少了60%，每年跨越美国进入墨西哥的黑斑蝴蝶数量已从1997年的10亿只下降到最低的3350万。


    印度，以Bollgard命名出售的Bt棉本应控制棉虫害虫。如今，棉虫已对Bt棉产生了抗性，孟农公司正在销售带有两个额外毒性基因的Bollgard II。Nirvana和科学技术与生态研究基金于2008年进行的田间调查显示，在马哈拉施拉邦的Vidarbha地区，引入Bt棉后农药使用量增加了三倍。最近的一项研究还显示，Bt棉的化学农药支出高于其他作物品种。


    这些数据并非印度独有。查尔斯·本布鲁（Charles Benbrook）的一项报告显示，1996年至2011年间，抗除草剂作物技术导致美国农药使用量增加了2.9亿公斤，而Bt作物通常减少了5600万公斤的杀虫剂使用。总体而言，这意味着农药使用量增加了1.83亿公斤，或约7%。此外，杀虫剂使用的减少并非适用于所有作物。Bt玉米的引入对化学品的使用没有影响，但在广泛种植Bt棉的阿拉巴巴马州，杀虫剂的使用量*在1997年至2008年间增加了一倍*。


    此外，同一报告还发现，2008年，转基因作物每英亩所需的农药比种植传统品种的高出26%，并预计由于甘膦抗性杂草的扩散，这种情况将持续下去。甘膦抗性杂草的兴起使得通过使用其他通常是更有毒性的除草剂来对抗这些杂草变得必要。2010年美国农业部的数据证实了这一趋势，显示甘膦使用量的激增伴随着其他、更有毒性的除草剂使用率的持续不变或增加。


    在中国，自1997年引入Bt棉以来，此前对农民构成微小问题的蚽亚虫数量增加了十倍。《国际生物技术杂志》2008年的一项研究发现，种植Bt棉带来的任何财务收益都被为了对抗非靶害虫而增加的农药使用所消耗。


    在阿根廷，1999年引入抗甘膦大豆后，除草剂的使用量增加了三倍以上。抗甘膦大豆使用的除草剂是传统大豆的两倍多；2007年，报告称在超过12万公顷优质农田上发现了抗甘膦版本的牛筋草（被认为是世界上最糟糕、最难处理的杂草之一）——这是甘膦使用量增加的结果。估计，每位农民每年还需要额外25升除草剂来控制这些抗性杂草。在阿根廷所谓的“转基因带”内，公民们对激进喷洒农药引起日益严重的健康风险（包括癌症和出生缺陷）表示不满。


    巴西自2008年以来一直是全球最大的农药消费者，转基因作物占该国所有行作物的45%。这一比例预计还将上升。


    本布鲁对美国农药使用的研究得出结论：


    与反复强调的认为今天的基因工程作物已经并正在减少农药使用的的说法相反，在抗除草剂杂草管理系统中，甘膦抗性杂草的扩散导致除草剂施用数量和体积的大幅增加……在抗性土地上除草剂使用量的增幅远超过了过去16年Bt作物杀虫剂使用的减少，并且在可预见的未来将继续如此。


    尽管有人声称GMO将降低化学品的使用水平，但事实并非如此。这令人由于，既是因为这些化学品对生态系统和人类有负面影响，还因为化学品使用的增加会导致害虫和杂草产生抗性，从而需要更多的化学品来管理它们。


    这不是食品生产。这是战争。


    先青化工公司首席执行官迈克·麦克（Mike Mack）在世界经济论坛上为GMO的使用辩护，他表示：“很少农业是自然的……农业已经存在了万年，很多时间[被花在]试图无论如何，把害虫驱离农场。”⁴²


    但对抗害虫的战争既不必要也不有效。当农业系统中的不同组成部分存在生态平衡时，害虫就会得到控制，而生物多样性是我们处理害虫问题的最好朋友。这在两个面上发挥作用。


    首先，害虫不会出现在基于多样性的农业系统中，因为在农生态农业系统中，没有任何一种昆虫或杂草是“害虫”。通过生物多样性实现的生态平衡是最好的控制机制，益虫如瓢虫、甲虫、蜘蛛、胡蜂和螳螂都对这一过程做出了贡献。


    在印度尼西亚，联合国粮农组织（FAO）与政府合作建立了农民学校，教授综合防治方法。这被广泛认为是减少农药依赖的最成功案例之一。”在印度，安得拉普尔邦政府已承诺推广无农药农业，该地区的农民既增加了产量又降低了成本。


    生物多样性的第二个益处是，如果发生爆发，生物多样性提供了植物源杀虫剂的生态替代方案，如苦楝。苦楝（Azadirachta indica）是一种起源于印度的树，因其益处传遍全球。1985年霍帕尔气体悲剧发生，我发起了一场口号为“不要霍帕尔，种苦楝”的运动。十年后，我发现苦楝的使用已被美国农业部和W.
    R. Grace公司专利化（该公司曾因污染波士顿外的地下水而导致癌症疾病；书籍和电影《行动》基于此案）。与欧洲议会绿党的马格达·埃沃（Magda Aevo）以及国际有机农业联盟主席琳达·布拉德（Linda
    Bullard）一起，我针对生物专利专利提诉。花费了十几年，但我们推翻了专利，苦楝作为天然控虫方式的使用权回给了自然和农民。在生物多样性系统中，提供安全有效控虫的多种植物得以蓬勃生长。这些植物包括苦楝、鳄参（Melia
    azedarach）、nurgundi、番荔（Annona squamosa）、蓬茄（Pongamia pinnata）、大蒜（Allium sativum）和烟草（Nicotiana
    tabacum）。


    全球各地的人正在反抗食品系统中使用的农药和毒药。美国蜂农在因油菜种子农药处理导致损失数千个蜂群后，起诉了拜耳公司。2013年4月29日，欧盟为了保护蜜蜂禁止了烟碱类杀虫剂的使用。这些农药的销售名称直接来自战争火器：Helix、Cruiser、Flagship和Honcho。在欧洲，烟碱类农药占80亿欧元农药市场的16%。

