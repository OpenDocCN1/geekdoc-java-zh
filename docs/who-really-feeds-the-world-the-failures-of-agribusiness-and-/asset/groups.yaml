    The prioritizing of uniformity over diversity and of quantity over quality has
    degraded our diets and displaced the rich biodiversity of food and crops. It is
    based on a false “creation boundary” that excludes nature’s intelligence and creativity
    and farmers’ intelligence and creativity. It has created a legal boundary to disenfranchise
    farmers of their seed freedom and seed sovereignty to impose unjust seed laws
    that establish corporate monopolies. An arsenal of legal instruments is being
    invented and imposed undemocratically to criminalize farmers’ seed breeding, seed
    saving, and seed sharing. This violence against farmers has manifested primarily
    in three ways.


    First, their contribution to breeding is erased, and what farmers have coevolved
    with nature is patented as an innovation. We call this biopiracy. Patents on life
