    now owned by Dow—in Bhopal, India. A gas leak known as the Bhopal gas tragedy
    killed three thousand people overnight and has killed more than thirty thousand
    since. Countless animals and nonhuman creatures also died in the forty-minute
    long leak: a stark reminder that pesticides brutally kill everything in their
    path. The gas from the pesticide plant polluted drinking water and soil, following
    which two hundred women had stillbirths and four hundred babies died only days
    after they were born. According to official figures, ten thousand people were
