  - '[PAGE 140]


    way, they are not pushed into competition with each other only to be exploited
    by an unfair, unjust market.


    Since every person has a fundamental right to eat well, we link the rural areas
    to the cities through organic fair trade. The so-called “free trade” of globalization
    is free only for giant corporations. For citizens, it translates into participation
    through slavery or exclusion. Globalization has pitted consumers against farmers.
    At Navdanya we have created cooperation between producers and eaters, and between
    the city and the countryside. We refer to our urban members as coproducers, because
    in choosing to eat organic food, they are becoming partners with farmers in the
    act of conserving biodiversity and producing good food. Navdanya has four retail
    outlets in Delhi and one in Mumbai. We also run an organic café, where people
    can taste forgotten foods.


    Cities can be producers too. That is why we have started Gardens of Hope in schools
    and in communities. Through gardening, every child becomes a potential farmer:
    a child of the Earth, a creator. We have also started Gardens of Hope with widows
    of farmers who have committed suicide in Punjab and Vidarbha. Through Gardens
    of Hope, people learn what it means to be a member of Vasudhaiva Kutumbakam, the
    Earth Family. When it comes to the Earth, we are all children. Every person, rich
    or poor, young or old, of every creed and every caste, should learn to grow food.
    Every community space, every balcony, and every terrace should become a garden.


    Growing organic in farms and gardens everywhere to become humanity’s planetary
    mission. We have witnessed decades of a destructive agriculture that has wiped
    out biodiversity, desertified the soil, exhausted the water, polluted the air,
    and poisoned our bodies. We are innovating for a food and agricultural system
    that rejuvenates the Earth, our community, our cities, and our health.


    For Navdanya, the fourth link in our work is seeds of knowledge. Bija Vidyapeeth—the
    Earth University—on Navdanya farm in the Valley is a learning center for spreading
    knowledge systems based on learning from nature. Its foundations are from centuries
    of the evolution of indigenous knowledge from women, from our grandmothers, and
    from teachers across the world. We call our farmers coreators, since they work
    with the Earth, not against her. Navdanya farmers have trained and reached'
  - '[PAGE 141]


    750,000 farmers to practice an agriculture that protects the Earth, rebuilds soil,
    enhances food production, and increases rural incomes.


    Seed sovereignty is linked to food sovereignty and to knowledge sovereignty. Every
    person is an expert in the knowledge they receive through their lived experience.
    A fragmented, reductionist paradigm does not just fragment reality. By creating
    a class of reductionist experts, it subjugates the diverse living knowledge systems
    that we need to redesign the broken food system.


    Diverse Women for Diversity and Navdanya''s Mahila Anna Swaraj (women''s food
    sovereignty) programs put food safety, security, and food sovereignty back into
    women''s hands. The food products that women process are unique not only because
    of their gentle processing and light carbon footprints, but also because of their
    authentic and distinctive taste. These are sold from the shelves of our direct
    marketing outlets.ed foods create employment, and they are a healthy alternative
    to industrial junk food. In fact, the WHO recently suggested that there should
    be a “health tax” levied on the junk-food industry.


    Our work at Navdanya shows that we must make peace with the planet to address
    hunger. At Navdanya, we do not grow commodities; we grow the Earth community:
    in the mind and on the land. We feed the soil organisms, and they feed us. We
    grow diversity, which supports more diversity. The pest/predator balance creates
    helps control pests, and we have no need to spray poisons. We grow organic matter,
    and return as much as we can to the soil. The organic matter in the soil is the
    alternative to the violence of fertilizer practices and the violence of large
    dams. Biodiverse systems increase resilience in times of climate chaos. The more
    biodiverse a system is, the more it is to produce nutrition per acre and health
    per acre for eaters and water per acre for farmers.


    I built Navdanya over the last three decades to create a food and agricultural
    system that is at peace with the Earth. Nonviolent farming that protects species
    also helps us grow more food. And it produces better food, thus ending the war
    against our bodies that has led to the diseases of obesity, diabetes, hypertension,
    and cancers.


    The same technological and economic systems that violate the Earth also violate
    the rights of communities to their natural resources. When, biodiversity, and
    water are reduced to tradable commodities and are'
  - "[PAGE 142]\n\nprivatized, not only the rights of nature violated, but the rights\
    \ of communities are also violated. Making peace with the Earth begins with a\
    \ paradigm shift from the mechanistic ideas of the Earth as dead matter to the\
    \ Earth as Gaia: a living planet, our mother.\n\nIndustrial agriculture and industrial\
    \ food systems have brought us a triple crisis: a dying planet, diseased citizens,\
    \ and debt-ridden farmers. Ecological and just alternatives have become an imperative.\
    \ \n\nSeed freedom and food freedom are the foundations for food democracy. Food\
    \ democracy is the right of farmers to save and share seed to practice poison-free\
    \ agroecology. It is the right of farmers to have the freedom to grow and share\
    \ diversity through diversified and fair markets. Food democracy is the right\
    \ of all citizens to have access to healthy, nutritious, safe, affordable, culturally\
    \ appropriate, and sustainably produced food. It is the right to know what is\
    \ in our food. Alternatives based on food democracy are flowering everywhere.\n\
    \nBut an industry that has used profits at any cost would do its best to prevent\
    \ the flowering of these alternatives. Pseududosafety laws, fascist seed laws,\
    \ neoliberal policies and markets are preventing alternatives to a model that\
    \ is in deep crisis. This is the moment that calls for Satyagraha: the fight for\
    \ truth.\n\nLet us be the we want to see, and let us each contribute to the shift\
    \ from a poisoned food system to a living food system. No farmer should commit\
    \ suicide. No child should die of hunger. No one should be because of food. The\
    \ Earth, and human beings as cocreators with the Earth, can provide good and healthy\
    \ food in abundance for all. Let us put our collective creative energies to work\
    \ designing a future of food that protects the planet by working with Mother Earth\
    \ to protect our soil, seeds, and biodiversity, instead of declaring a war against\
    \ her through globalized agriculture and its weapons of war.\n\nBy working according\
    \ to nature’s laws, we have each within the seeds of potential to bring abundant\
    \ and good food to everyone, down to the last child, the last woman, the last\
    \ farmer, and the last living being.\n\nWhen we come together in harmony, we can\
    \ cultivate paradise on Earth."
