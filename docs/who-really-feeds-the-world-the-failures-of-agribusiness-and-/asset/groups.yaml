    在印度，所有商业销售的种子都涂有农药。在美国，90%的玉米种子涂有拜耳（Bayer）的烟碱类杀虫剂，这些农药与蜜蜂死亡密切相关。


    农药的制造和使用正在不断增加。新的化学品定期进入市场，政府注册和控制农药的系统存在很大缺陷，并可以根据公司利益被操纵。这种增长在全球南方尤为明显，那里农药的使用每年以5-7%的速度增长。现在，农药出现在我们的河流、地下水、母乳、土壤、食物和空气中。食用食物是人类暴露于农药和工业污染物的主要途径。我们都暴露在农药中，并且身体里携带了可测量的这些有害化学物质。我们通过日常饮食摄入的这些农药的完全影响尚未被完全[理解]，但研究表明，最有害的影响是儿童，因为儿童单位体重的摄入的食物量更多。例如，印度的婴儿接触的砷含量比普通人高，因为婴儿摄入更多的米饭，而米中的砷浓度较高。


    除了农药在我们的食物中产生的毒素外，农药还对与其接触的人构成了严重的健康风险，特别是农民，或居住在生产这些工厂附近的人。


    I. G. 法公司和其他公司专门负责开发沙林和甲气，这些化学品属于有机磷类（OPs）一类，曾被纳粹集中营被用作神经性毒气。如今，市场上绝大多数农药都是神经毒素，这意味着它们作用于神经系统。这解释了它们的有效性以及其毒性潜力。这些农药即使是极少量，也会损害神经系统，从而导致神经生理功能障碍，其病程可能是慢性或长期的。暴露于有机磷类会导致急性疾病，如恶心、呕吐、头痛、腹痛、眩晕、皮肤病、眼病、流产和出生畸形。I.
    G. 法公司在二战后的纽伦堡审判中因其在大屠杀中的作用受到审判。然而，它在传播近期种族灭绝中的作用在很大程度上没有受到限制。


    1984年12月，被广泛认为是世界上最恶的工业灾难发生在印度博帕尔由联合碳公司（Union Carbide）拥有的一家农药厂。一场被称为博帕尔毒气事件的气体泄漏在夜之间杀死了三千人，还杀死了超过三万非人类生物。农药厂排出的气体污染了饮用水和土壤，导致两百名妇女流产，四百名婴儿死亡。根据官方数据，一万人永久残疾，十万人遭受轻微功能受损。尽管斗争了三十年，博帕尔毒气灾难的受害者并未获得正义。相反，道尔公司（Dow）多次对活动人士提起诉讼。


    与此同时，道尔公司正在向全球范围内传播其化学品。橙橙剂——一种由道尔公司开发并在越南战争期间由美军喷洒的产品——以及农业中的农药正在杀死农农、消费者、儿童和蝴蝶。纳夫丹尼亚（Navdanya）的报告《我们食物中的毒素》显示，农药的使用与流行病之间存在明确的联系。在旁遮普邦，每天使用大量农药，癌症发病率异常高。毒素对人类饮食的破坏性影响是深远的。每年有近七千印度人死于癌症，而超过一百人被诊断患有某种形式的这种疾病。在全球范围内，2012年有30万人死于癌症，世界卫生组织报告，每年有22.万人死于农药中毒。1960年的美国，每二十人中有一个患癌症。到1995年，由于农药使用量的增加，这一数字跳到八分之一。


    斯里兰卡的一项研究发现甘膦（在孟绿色品牌 Roundup Ready 下使用）的使用增加与肾脏疾病之间有关，这影响了四千名农民。根据美国疾病控制与预防中心的数据，自闭症在二十年增加了35%，从每八十五儿童中一个增加到每六十八儿童中一个。全球增长的数据表明，我们无法忽视食品系统带来的危险和威胁生命的代价。一种应对这些数据的公司策略是试图沉默、骚扰和迫害那些工作表明农药和转基因生物对健康损害的科学家。例子包括英国的阿帕德·普斯泰（Arpad
    Pusztai）、法国的吉尔·埃里克·塞拉尼（Gilles-Éric Séralini）、加州大学伯克利分校的泰隆·海斯（Tyrone Hayes）以及南卡罗来纳大学的维基·范斯（Vicki
    Vance）。鉴于农药应用中只有1%作用于目标“害虫”，其对益虫和授粉者的影响是毁灭性的。授粉者对我们的粮食安全和农业经济做出了巨大贡献。例如，蜜蜂授粉了百种最常见作物中的七十一种，这些作物占了世界食物供应的90%。在全球范围内，蜜对作物生产的贡献估计为2000亿美元。世界上每四口食物中有一口是由授粉者的生态贡献产生的。美国的昆虫授粉作物价值200亿美元。然而，蜜蜂和蝴蝶正被作为工业农业基础的毒药库所杀死。从1985年到1997年，美国农场的蜂群数量减少了约57%。农药是这种变化的主要原因。蜜蜂的免疫系统在暴露于农药后会变弱，它们更容易受到天敌。暴露于农药还会干扰它们的繁殖和发育。


    授粉者是为农民提供的基本自然服务，没有它们，我们的粮食安全将面临威胁。^{27}美国科学家保罗·德巴赫（Paul DeBach）写道：


    化学防治害虫的哲学一直是实现可能的最高杀灭，而死亡率一直是实验室筛选新化学品的主要衡量标准。这种目标，即可能的最高杀灭，结合对非目标昆虫和螨虫的无知或忽视，注定是导致失衡和产生抗药性的快速途径。^{28}


    许多进入农化行业的大型公司后来通过基因工程进入了种子行业。在这些公司中，位于美国的孟绿色（Monsanto）拥有垄断地位，占据了全球专利种子市场的23%。^{29}
