  - '[PAGE 30]


    Where industrial agriculture sees nature as dead matter, or as a machine, agroecology
    injects life back into the Earth, seeing her as a living, breathing being.


    In the agroecological paradigm of knowledge, and in organic farming, food is the
    web of life. Humans are part of this web, as cocreators and copducers, as well
    as eaters. When we save seed and replant it, we become part of the cycle of life.
    When we return organic matter to the soil, we are feeding the soil organisms.
    Working according to nature’s laws participating in nature’s processes of creation
    and production. This is the basis of sustainability of food and agricultural systems.
    An agroecological knowledge system feeds the world, not a violent, reductionist
    paradigm of agriculture.'
  - '[PAGE 31]


    # 2


    # Living Soil Feeds the World, Not Chemical

    Fertilizers


    Whatever I dig of you, O Earth,

    May that grow quickly upon you,

    O pure One, may my thrust never pierce thy

    Vital points, Thy Heart


    > “PRITHVI-SUKTA,” A PRAYER IN THE ANCIENT INDIAN TEXT ATHARVA VEDA


    English botanist Sir Albert Howard arrived in Indore, India, in 1905. He began
    with his wife Gabrielle as an agricultural adviser, observing the methods of cultivation
    used by peasants and farmers. How is known as the father of organic farming, but
    it was actually the peasants of India who fathered and mothered the scientist''s
    now-famous agricultural philosophy and practice. It was here he began espousing
    farming techniques that returned nutrients to the soil, and in his several writings
    he most famously observed, “Health in soil, plant, animal, and man is one great
    subject.”


    The soil is a living system, with billions of soil organisms weaving an intricate
    soil food web to create, maintain, and renew soil fertility. All food production
    rests on this web. The well-being of the soil is vital to human well-being, and
    from this point of view, the aim of fertilization is not to simply increase yields
    and fertilize plants to nurture living soil.


    However, the reductionist paradigm that paved the way for industrial chemical
    agriculture treats soil as an inert, empty container for chemical fertilizers.
    After World War I, manufacturers of explosives whose factories were equipped for
    nitrogen fixation had to find other markets for their products. Synthetic fertilizers
    provided a convenient “conversion” for peaceful uses of war products, except instead
    of being peaceful, these chemicals waged a battle against the soil and against
    the Earth. Following World War II, this war against the planet was led under the
    banner of the'
  - '[PAGE 32]


    Green Revolution in a bid to export these toxic chemicals to the Global South.


    In India alone, twenty years of Green Revolution agriculture have succeeded in
    destroying the fertility of Punjab’s soils. These soils were maintained across
    centuries by generations of farming families and could have been indefinitely
    maintained if international “experts” and Indian followers had not mistakenly
    believed that technologies could substitute for land, and that chemicals could
    replace the organic fertility of soils.


    Today, 24 billion metric tons of fertile soils are lost from world agricultural
    systems each year. India is losing 6.6 billion metric tons of soil per year, China
    is losing 5.5 billion metric tons, and the United States is losing 3 billion metric
    tons. In fact, soil is being lost at ten to forty times the rate at which it can
    be replenished naturally. Soil nutrients to erosion cost $20 billion annually.
    Chemical monocultures also make soils vulnerable to drought and further contribute
    to food insecurity. Resulting from this degradation are reduced availability of
    clean water, and increased vulnerability of the affected areas to climate change,
    food insecurity, and poverty. Today, 1.5 billion people in all parts of the world
    are already directly affected by the loss of land through reduced income or food
    insecurity.¹ According to the current status of soil degradation, if we continue
    to destroying the soil of our planet, there will be 30 percent less food on the
    planet over the next twenty to fifty years.


    Fueled by the Law of Exploitation and the Law of Domination, in the place of soils,
    we now have chemical fertilizers. The push for more fertilizers was an important
    factor in the spread of the new seeds, because wherever they opened up new markets
    for chemical fertilizers. In 1967, at a meeting in New Delhi, Norman Bourlaug—who
    is credited with the “success” of the Green Revolution in India—was emphatic about
    the role of fertilizers in the new agricultural order. “If I were a member of
    your parliament,” he told the politicians and diplomats in the audience, “I would
    leap from my seat every fifteen minutes and yet the toll of my voice, ‘Fertilizers!
    Give the farmers more fertilizers.’ There is no more vital message in India than
    this. Fertilizers will give India more food.”²


    But no technology system can claim to feed the world while it destroys life in
    the soil. This is why the Green Revolution’s claims—or genetic'
  - '[PAGE 33]


    engineering’s claims—that its technologies will feed the world are false.

    Intrinsic to these technologies are recipes for killing the life of the soil,
    thus accelerating soil erosion and degradation. Degraded and dead soils, soils
    without organic matter, soils without soil organisms, and soils with no water-holding
    capacity do not create food security; they create famines and are at the heart
    of the food crisis the world is facing today.


    Healthy and fertile soils make healthy plants, which in turn make healthy people.
    Howard wrote:


    A soil teeming with healthy life in the shape of abundant microflora will bear
    healthy plants, and these, when consumed by animals and man, will confer health
    on animals and man. An infertile soil, that is, one lacking sufficient microbial,
    fungus, and other life, will pass on some form of deficiency to the plant, and
    such plant, in turn, will pass on some form of deficiency to animals and man.


    The millions of organisms found in soil are the source of its fertility. The greatest
    biomass in soil consists of microorganisms. Soil microorganisms maintain soil
    structure, contribute to the biodegradation of dead plants and animals, and fix
    nitrogen. They are the key to soil fertility, and their destruction by chemicals
    threatens our survival and our food security. 1997 Danish study analyzed a single
    cubic meter of soil and found thousands of small earthworms, fifty thousand insects
    and mites, and twelve million roundworms. A single gram of the soil contained
    thirty thousand protozoa, fifty thousand algae, four hundred thousand fungi, and
    billions of individual bacteria. This is an amazing biodiversity that maintains
    and rejuvenates soil fertility and allows workers in the soil, or soil organisms,
    to flourish. These include fungi, bacteria, nematodes, and earthworms.


    In uncontaminated soil, organic matter is broken down by soil organisms to form
    humus. Humus is the Latin word for “soil” or “earth.” Humus is organic matter
    digested by soil organisms and made into living soil. One important characteristic
    of humus is that it functions as a sponge and can'
  - '[PAGE 34]


    hold up to 90 percent of its weight in water. Soil that lacks humus is more vulnerable
    to drought, nutrient deficiency, and soil erosion.


    Soils rich in humus are rich in fungi like mycorrhizae, which cannot exist without
    humus. Mycorrhizae create a symbiotic relationship with plants by entering the
    roots and mobilizing nutrients and moisture for plants. In a cycle of codependence,
    these fungi also contribute to forming humus and binding soil.


    Living soils are teeming with beneficial bacteria. One teaspoon of soil has between
    one hundred million and one billion bacteria, which translates to one metric ton
    per every acre. Bacteria decompose and immobilize nutrients, which are retained
    in their cells, preventing soil loss. They produce substances that bind soil particles
    into aggregates—preventing soil erosion and increasing the water-holding capacity
    of soil.


    Actinomycetes are bacteria that break down organic matter and live on providing
    a glue to bind soil particles into aggregates. In absence of microorganisms, soil
    does not. Instead, it becomes dust and is easily blown away by wind and washed
    away by water. Living soils also have nitrogen-fixing bacteria, which create a
    symbiotic relationship with the plant root and give the plant nitrogen in exchange
    for carbon.


    Nematodes—or multicellular roundworms—get their name from the Greek word for “thread”:
    nema. Ninety percent of nematodes reside in the top 15 cm of soil. Nematodes do
    not decompose organic matter but, instead, feeding on living material. Nematodes
    can effectively regulate bacterial populations by eating up to five thousand bacteria
    per minute, and for the process, produce nitrogen.


    Earthworms are essential to living soils and soil fertility. In 1881, Darwin published
    a book entitled The Formation of Vegetable Mould through the Action of Worms,
    with Observations on Their Habits. Of worms, he wrote, “It may be doubted whether
    there are other animals who have played such a important part in the history of
    creatures.” Earthworms are far more sophisticated than the most expensive fertilizer
    factories, because they not only provide fertility, they also increase the water-holding
    capacity and air volume of the soil, which are essential to living soil. Earthworms
    burrow through the soil to make small tunnels through which air and water can
    move. Earthworms increase the air volume of the soil by up to 30 percent and'
- md: '

    the water-holding capacity of soil by 20 percent. This makes soil more resilient
    to drought. Soils with earthworms also drain ten times faster than those without,
    which makes soil resilient to floods. In a single square meter of organic soil,
    there can be anywhere from thirty to three hundred earthworms.


    In addition to earthworms, fungi, and bacteria, between ten thousand and one hundred
    thousand green and blue algae cells are found per gram of soil. Between one thousand
    and one hundred thousand mites, spiders, ants, beetles, centipedes, and millipedes
    are found per square meter of organic soil. The more soil organisms present, the
    healthier the soil; it is more fertile, retains more water, and is less prone
    to erosion.


    Nitrogen is an essential component of farming because it helps plants make their
    food. In order for nitrogen to be used, it must be “fixed” from the atmosphere
    in a process that converts it to ammonium. In factories, nitrogen is fixed from
    the air with huge amounts of fossil-fuel and energy use. In organic farming, where
    different plants grow by side, nitrogen-fixing crops like peas and legumes give
    us free nitrogen. plants have a symbiotic relationship with rhizobia, which are
    bacteria in the soil that enter plant roots and help them access nitrogen from
    the air through biological nitrogen-fixing.


    Additionally, in organic farming there are many plant species that give us natural
    green manure. Sesbania, glicidia, and crotalaria, for example, can increase soil
    fertility immensely. These are usually grown as hedges in traditional agriculture,
    though they are nowhere to be seen in industrial monocultures. They are very effective,
    glicidia, as a hedge, can yield biomass or organic matter of up to 6–8 tons per
    hectare per year. Proponents of industrial agriculture repeatedly tell us that
    organic farming is not possible because there is not enough organic matter. But
    with green manures we can produce huge amounts of organic nitrogen and organic
    matter, which can replace the synthetic fertilizers that deplete soil fertility
    by killing soil organisms.


    Ecological agriculture is based on recycling organic matter, and hence recycling
    nutrients. It is based on the Law of Return and giving nutrients back to the soil,
    not simply taking nutrition out of it. Taking without giving is a robbery of the
    soil and a banditry, “a particularly mean of banditry, because it involves the
    robbing of future generations which are not here to defend themselves."¹¹"


    Sir Albert Howard writes in An Agricultural Testament:


    The feature of the manuring of the West is the use of artificial manures. The
    factories engaged during the Great War in the fixation of nitrogen for the manufacture
    of explosives had to find other markets, the use of nitrogenous fertilizers in
    agriculture increased, until today, the majority of farmers and market gardeners
    base their manorial programme on the cheapest forms of nitrogen (N), phosphorus
    (P), and potassium (K) on the market. What may be conveniently described as the
    NPK mentality farming in the experimental stations and in the countryside. Vested
    interests, entrenched in times of national emergency, have gained a stronghold.¹²


    In the industrial agriculture paradigm, soil is seen as dead matter: an empty
    container for pouring synthetic fertilizers, especially NPK. This is done despite
    the fact that plants and soils need thirty-three elements for healthy growth.
    With their roots in water, these synthetic fertilizers continue our war against
    our living soil.


    Mycorrhizae bacteria and earthworms do not survive the application of chemical
    fertilizers. Fertilizers block the soil capillaries, which supply nutrients and
    water to plants. Infiltration of rain is stopped, runoff increases, and soil faces
    droughts, requiring ever-increasing irrigation and ever-increasing fossil fuels
    for pumping groundwater.


    Two-thirds of the nitrogen fertilizer applied is not taken up by the plant; instead,
    it contaminates groundwater with nitrate pollution. It also contaminates surface
    waters, leading to eutrophication (overfertilization) of rivers and lakes, and
    creates dead zones in coastal waters. Large parts of nitrogen fertilizer escape
    into the air as nitrous oxide, which has an atmospheric life of 166 years and
    is three hundred times more damaging to the atmosphere as carbon dioxide. In spite
    of what the chemical companies would like us to believe, the reality is that nitrogen-fixing
    crops can provide enough nitrogen to substitute for synthetic nitrogen. Ecological
    alternatives that create, maintain, and rejuvenate living soils do so at zero
    cost, and are much more effective in increasing soil fertility and agricultural
    fertility than industrial fertilizers.


    While destroying the sources of soil fertility and destabilizing the climate,
    synthetic fertilizers also waste financial resources through high costs and public
    subsidies. The global annual consumption of fertilizers is 164.4 million metric
    tons, which consist of 105 metric tons of nitrogen, 37.9 metric tons of phosphorus,
    and 21.5 metric tons of potash. On the other hand, earthworm castings—what earthworms
    secrete into the soil—can amount up to 36 metric tons per acre, contain three
    times more exchangeable nitrogen, seven times more phosphorous, three times more
    exchangeable magnesium, eleven times more potash, and one and one-half metric
    tons more calcium than artificially fertilized soil.


    Synthetic fertilizers use natural gas, so is a highly energy-intensive process.
    One kg of nitrogen fertilizer requires the energy equivalent of two liters of
    diesel. In 2000, the energy consumed while manufacturing fertilizers across the
    world was equivalent to 191 million liters of diesel. This number is projected
    to rise to 277 billion by 2030. While industrial agriculture claims to have reduced
    the amount of labor required, all it has done is replace the hard work of people
    with “energy slaves”—the fossil-fuel equivalent of the work of a human being—and
    increase the ecological footprint of farming.


    Today we are living in the age of “peak oil,” which is M. King Hubert’s term for
    the point at which the planet reaches the highest level of oil production. After
    this, oil production will necessarily decrease. Decreasing production will mean
    increasing prices, and the unprecedented increase in the price of oil since 2008
    is sign of an emerging crisis. As Weinberg put it, “The party’s over"


    Since synthetic nitrogen is based on fossil fuels, prices of fertilizers also
    go up when the price of oil goes up. In India the subsidy for fertilizers was
    Rs. 600 million in 1976–1977. It rose to Rs. 403 billion in 2007–2008, and reached
    Rs. 966 billion—or nearly a trillion—in 2008–2009. These subsidies go to agribusiness,
    not farmers, who in turn deeper into debt traps as a result of these rising prices.
    Since synthetic fertilizers come from nonrenewable resources, they will eventually
    run out, though not before they have depleted the soil’s renewable sources of
    fertility: its living organisms.


    We are soil. We are earth. We are made of the same five elements—earth, water,
    fire, air, and space—that constitute the universe. What we do to soil, we do to
    ourselves; it is not an accident that “humus” and “humans” have the same etymological
    root.


    This ecological truth is forgotten in the dominant knowledge paradigm, because
    industrial agriculture is based on eco-apartheid. It is based on the false idea
    that we are separate from and independent of the earth. It is based on a worldview
    that defines soil as dead matter. If soil is to begin with, human action cannot
    destroy its life; it can only “improve” the soil with chemical fertilizers. And
    if we are masters and conquerors of the soil, we determine the fate of the soil.


    It has been assumption of the Green Revolution that nutrient loss and nutrient
    deficit can be made up by the use of non-renewable inputs of phosphorus, potash,
    and nitrates as chemical fertilizers. Under the industrial paradigm of agriculture,
    the nutrient cycle—in which nutrients are produced by soil through plants and
    returned to the soil as organic matter—has been replaced by linear, non-renewable
    flows of phosphorus and potash from geological deposits, and nitrogen derived
    from petroleum.¹¹⁷


    But even Howard’s early work showed that “the foundation of all good cultivation
    lies not so much in the plant as in the soil.”¹⁸ While it at his experimental
    station, Howard showed that taking care of living soil that nourishes the plant
    can have more significant contributions to farming than simply breeding plants
    without improving the soil. Where breeding alone contributed to a 10 percent increase
    in yield, soil fertility improvement through organic matter and green manures
    contributed to a 200–300 percent increase.¹⁹

