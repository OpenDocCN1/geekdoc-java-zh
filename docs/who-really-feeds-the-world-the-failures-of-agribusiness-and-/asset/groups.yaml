    Pollinators are an essential natural service provided to farmers, and without
    their existence, our very food security is under threat.^{27}

    US scientist Paul DeBach writes:


    The philosophy of pest control by chemicals has been to achieve the highest kill
    possible, and percent mortality the has been the main yardstick in the early screening
    of new chemicals in the lab. Such an objective, the highest kill possible, combined
    with ignorance of, or disregard for, non-target insects and mites, is guaranteed
    to be the quickest road to upset resonances and the development of resistance
    to pesticides.^{28}


    Many large war companies that became the agrochemical industry later became the
    seed industry through genetic engineering. Of these companies, US-based Monsanto
    has as a monopoly, owning 23 percent of the global proprietary seed market.^{29}
    In the United States, where GM crops are widespread, 80 percent of corn and 93
    percent of soy grown is from Monsanto-painted GM seeds. 282 million acres of land
    are used for Monsanto crops (from 3 million in 1996).^{30}


    Genetic engineering was offered as an alternative to chemical pesticides. However,
    GM crops are part of the same logic of war against nature promoted by the Law
    of Domination and a militaristic paradigm. In the case of GMOs, the poison has
    been introduced as a toxin-producing gene within the plant, so in effect, the
    GMO becomes a pesticide-producing plant. As pesticides have created pests instead
    of controlling them, GMOs as pesticide-producing plants also increase pests instead
    of controlling them. New pests emerge and old pests become resistant. The result
    is an increased use of chemical pesticides.


    GMOs are failing to control pests and weeds. Instead, they have created superperms
    and weeds. In twenty years of the commercialization of genetically engineered
    crops, only two traits have been commercialized on a significant scale: herbicide
    tolerance and insect resistance. Herbicide-tolerant crops, known under the Monsanto
    brand name Roundup Ready, were supposed to control weeds, and Bt crops were intended
    to control pests. In 2013, Food and Water Watch calculated that 27 percent of
    Monsanto’s profits came from the sale of Roundup herbicide.^{31} But instead of
    controlling weeds and pests, these GM crops have led to the'
