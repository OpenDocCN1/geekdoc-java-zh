    Despite claims that GMOs will lower the levels of chemicals used, this has not
    been the case. This is of great concern both because of the negative impacts of
    these chemicals on ecosystems and humans, and because there is the danger that
    increased chemical use will cause pests and weeds to develop resistance, requiring
    even more chemicals in order to manage them.


    This is not food production. This is war.


    The CEO of agrochemical company Syngenta, Mike Mack, defended the use of GMOs
    at the World Economic Forum, stating, “There is very little farming that’s natural.
    . . Farming’s been around for 10,000 years, and a lot of [it] has been [spent]
    trying to keep the pests, however you do that, off the farm.”⁴²


    But the war against pests is neither necessary nor effective. Pests are controlled
    when there is an ecological balance among diverse components in a farming system,
    and biodiversity is our best friend in dealing with pest problems. This works
    on two levels.


    First, pests do not emerge in agricultural systems based on diversity, because
    in an agroecological farming system, no one insect, or weed, is a “pest.” Ecological
    balance through biodiversity is the best control mechanism, and friendly insects
    such as ladybugs, beetles, soldier beetles, spiders, wasps, and the praying mantis
    all contribute to this process.


    Biodiversity allows for systems of integrated pest control like the push-pull
    system, where one plant’s role is to attract pests and another’s is to repel them.
    This technique is used by thousands of farmers across eastern Africa who intercrop
    silverleaf desmodium (a fodder legume) with maize, napier, and Sudan grass. Aromas
    produced by the desmodium repel (push) pests like the maize while scents produced
    by the grasses attract (pull) the stemborer and encourage them to lay their eggs
    in the grass instead of maize. In turn, the napier grass produces a gummy substance
    that traps the stemborer larvae, so that once they hatch, only a few survive into
    adulthood, thus reducing their numbers.⁴³


    Countries across the world are adopting systems of integrated pest control based
    on biodiversity. In Indonesia, the Food and Agriculture Organization (FAO) worked
    together with the government to establish'
  - '[PAGE 51]


    farmers'' field schools to teach integrated pest management. This is widely considered
    to be one of the most successful examples of reducing dependence on pesticides
    through biodiversity.” In India, the state government of Andhra Pradesh has made
    a commitment to promote pesticide-free farming, and farmers within the state have
    both increased production and reduced costs.


    The second benefit of biodiversity is that if there a pest outbreak, biodiversity
    offers ecological alternatives in the form of botanical pest control agents, as
    neem. Neem (Azadirachta indica) is a tree indigenous to India that has spread
    worldwide because of its beneficial uses. In 1985 at the time of the Bhopal gas
    tragedy, I started a campaign with the slogan “No more Bhos, plant a neem.” Ten
    years later, I found that the use of neem has been patented by the US Department
    of Agriculture and W. R. Grace (a chemical company that was implicated in polluting
