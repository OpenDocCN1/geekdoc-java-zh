    of the Mind）关注的是一种经济：由全球公司控制的全球市场。它们忽视了自然和社会的经济，忽视了自然的经济，忽视了人类的生计经济。我们需要终结土地和人类思维中的单植化，并且迫切需要评估工业化农业的真实成本以及生物多样化、生态农作的真正效益。


    生物多样性的混合耕作系统基于土壤、水、农场动物和植物之间的共生关系。生态农业以可持续的方式将这些元素联系在一起，每个元素都相互依赖，它们之间的关系也随之加强。绿色革命农业或工业农业，通过引入外部投入（如为响应化学品而培育的种子）或化学品本身，取代了这种整合。种子/化学品的组合不仅破坏了生态农作的内在联系，还与土壤和水系建立了其有毒的相互作用。在衡量工业农业的成本或产量时，并没有考虑到这些新的相互作用。


    在农业中，由于存在认为多样性与低生产力相关的这种错误假设，多样性被破坏了。结果，农民多样化的本土品种被误导性称为“高产品种”（HYVs）的新作物所取代。高产品种是推行工业化单植农场系统的第一个迷思的一部分：即化学耕作能产生更多食物。跨国公司方便地忘记告诉我们的是，高产品种本身并不高产。相反，它们对化学品反应良好（这些化学品很可能由推广高产品种的同一种子公司生产）。事实上，对它们更合适的标签应该是：


    此类品种的培育目的是只有在高水平的化学品投入下才能提高谷物产量。如果我们将耕作系统视为一个不仅养活人类、而且养活农场所有生物的生态系统，那么高产品种表现出极低的系统生产力。例如，在印度等国，从谷物中获得的秸草数量与牲畜饲料一样重要。高产品种无法产生足够数量或质量的秸草，导致公司可以增加谷物的市场产出。但农场上的动物仍然需要食物，因此它们被喂了原本供人类食用的谷物。这种谷物在营养和数量上对动物来说都是的。土壤和动物都没有从高产品种中受益，而谷物市场产出的增加是以牺牲动物和土壤生物量减少、以及由于过度使用资源导致生态系统生产力下降为代价实现的。


    如果我们考虑到耕作系统中的总生物量，农民的本土品种表现就优于高产品种。事实上，许多品种在谷物产量和总生物量输出方面都比取代它们的高产品种产量更高。一项比较传统间作轮作（polycultures）与工业单植耕作的研究显示，间作轮作系统可以从5单位的投入中产生100单位食物，而工业系统需要300单位的投入才能产生同样的100单位食物。那额外的295单位投入在生物多样化农场上本可以提供5900单位的额外食物。因此，工业系统导致了5900单位食物的减少。这是让人类饿死的配方，而不是养活他们的方法。


    绿色革命范式下对产量和生产力的衡量，脱离了对增加单一物种单一功能的过程如何影响维持农业生产条件的过程的理解。这种现象通过减少耕作系统的物种数量和功能多样性，以及用危险的农药替代生物多样性提供的内部投入来实现。虽然这些还原论的产量和生产力类别允许获得更高的衡量，但它们忽略了维持农业生产条件的生产性。


    传统耕作实践的生产性一直很高，因为它们对外部投入的需求极少。虽然绿色革命被描绘为增加了绝对生产力，但在考虑到资源利用时，单植系统在绝对意义上的生产力更低。


    推广农业基因工程的一个常见论点是，只有工业农业和育种才能跟上增长的人口对食物的需求。《科学美国人》的一项研究显示，通过密集的外部投入维持的单植化导致了粮食不安全和饥饿。


    由于有机农民种植更多样化的作物，农场的整个生产不会受到相同害虫或季节性天气事件的影响。此外，有机耕作的土壤能吸收更多的降水，从而为干旱提供了保护。¹如果发生全面歉收，有机农民遭受的经济损失更小，因为他们投入的购买成本较少。有机农场作物的多样性还有其他益处。多样性为单一商品的价格波动提供了某种保护，并提供了更好的季节性投入分配。


    由于两个原因，有机农民比传统农民需要的贷款更少。首先，有机农民购买的投入较（如肥料和农药）。其次，多样化有机农场的成本和收入在全年分布更均匀。在印度，农民自杀的潮集中在那些由于化学密集化导致成本增加、且经济作物单植化因全球化而面临价格和收入下降的地区。高生产成本是农村债务的最主要原因，在一个方程中：单植化
    = 化学品 = 债务 = 自杀。


