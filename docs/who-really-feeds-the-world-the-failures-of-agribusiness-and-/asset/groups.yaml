  - '[PAGE 57]


    We must dismantle these myths. Under the industrial paradigm, toxic chemicals
    kill the biodiversity of bees, butterflies, and friendly insects. Chemical fertilizers
    kill soil organisms, destroying the soil and soil fertility. Nitrogen fertilizers
    create dead zones and kill the biodiversity of aquatic and marine life. Furthermore,
    because they rely heavily on inputs of deadly chemicals, the cost to both the
    farmer and the consumer is greater in monoculture farming; the only profits being
    made are by large agribusinesses. Monocultures of the Mind focus on one economy:
    the global market controlled by global corporations. They remain blind to the
    economies of nature and society, to nature’s economy, and to people’s sustenance
    economy. We need to put an end to monocultures, on both land and in the human
    mind, and we need to urgently assess the true costs of industrial agriculture
    and the true benefits of biodiverse, ecological farming.


    Biodiverse systems of mixed cropping are based on a symbiotic relationship between
    soil, water, farm animals, and plants. Ecological agriculture links these elements
    together in sustainable ways, where each is dependent on the other, and the relationship
    between them is thus strengthened. Green Revolution agriculture, or industrial
    agriculture, replaces this integration with the introduction of external inputs,
    such as seeds that are bred for responding to chemicals, or with the chemicals
    themselves. Not only does the seed/chemical package break ecological farming interlinkages,
    but it also sets up its toxic interactions with soil and with water systems. These
    new interactions are not taken into account when measuring the cost or the yields
    of industrial farming.


    Diversity has been destroyed in agriculture under the false assumption that it
    is associated with low productivity. As a result, farmers'' diverse, native varieties
    have been replaced by new crops that are misleadingly called high yielding varieties,
    or HYVs. HYVs are part of the first myth that has been used to push industrial,
    monoculture farm systems: that chemical farming produces more food. What multinational
    companies conveniently forget to tell us is that HYVs are not intrinsically high
    yielding. Rather, they respond well to chemicals (most likely produced by the
    same seed companies promoting HYVs). In fact, a more appropriate label for them
    would be'
  - '[PAGE 58]


    Such varieties have been bred to yield enhanced grain production only with high
    levels of chemical inputs. If we look at a farming system as an ecosystem that
    feeds not only humans, but all living beings on the farm, HYVs exhibit very low
    system productivity. In countries like India, for example, the quantity of straw
    that is obtained from grain is as important as fodder for livestock. HYVs fail
    to produce a sufficient quantity or quality of straw, so that corporations can
    increase the marketable output of grain. But animals on the farm still have to
    eat, and so they are fed the very grain that was intended for humans. This grain
    is insufficient in terms of both nutrition and quantity for animals. Neither soil
    nor animals benefit from HYVs, and the increase in the marketable output of grain
    has been achieved at the cost of a decreased biomass for animals and soils, and
    decreased ecosystem productivity due to an overuse of resources.


    Farmers'' indigenous varieties outperform HYVs if we take into account the total
    biomass in a farming system. In fact, many varieties have higher yields in terms
    of grain output as well as in terms of total biomass output than the HYVs that
    have been introduced in their place. A study that compares traditional polycultures
    with industrial monocultures shows that a polyculture system can produce 100 units
    of food from 5 units of inputs, whereas an industrial system requires 300 units
    of input to produce the same 100 units of food. The 295 units of inputs could
    have provided 5,900 units of additional food on a biodiverse farm. Thus, the industrial
    system leads to a decline of 5,900 units of food. This is a recipe for starving
    people, not for feeding them.


    The measurement of yield and productivity in the Green Revolution paradigm is
    divorced from an understanding of how the processes of increasing a single function
    of a single species affect the processes that sustain the conditions for agricultural
    production. This takes place by reducing the number of species and the functional
    diversity of farming systems, as well as by replacing internal inputs provided
    by biodiversity with hazardous agrochemicals. While these reductionist categories
    of yield and productivity allow for a higher measure of harvestable yields of
    single commodities, they exclude the measurement of the ecological destruction
    that affects possibly and the destruction of diverse outputs from biodiversity-rich
    systems.'
  - '[PAGE 59]


    Productivity in traditional farming practices has always been high, because it
    requires very few external inputs. While the Green Revolution has been portrayed
    as having increased productivity in the absolute sense, when resource utilization
    is taken into account, it has lower productivity both in the sense of total biomass
    production as well as in the use of external inputs. Industrial chemical agriculture
    uses 10 kcal in inputs to produce 1 kcal of food. It also uses ten times more
    water and a lot more than ecological agriculture to produce the same amount of
    food. The extra resources used by monocultures could have gone to feed people.
    Resources wasted amounted to the creation of hunger. By being resourceful through
    one-dimensional monocultures maintained through intensive external inputs, new
    biotechnologies create food insecurity and starvation.


    A common argument used in promoting genetic engineering in agriculture is that
    only industrial agriculture and industrial breeding can keep up with the increasing
    food needs of a growing population. Increased mouths to feed require a more efficient
    use of resources. A study in the Scientific American shows that industrial agriculture
    has led to a sixtyfold decrease in food-producing capacity and is not an efficient
    strategy for using land, water, and biodiversity to feed the world.


    Agribusiness, governed by the Law of Exploitation and the Law of Domination, tells
    us that monocultures are the most cost-effective way of producing food, through
    both chemical farming and genetic engineering.'
