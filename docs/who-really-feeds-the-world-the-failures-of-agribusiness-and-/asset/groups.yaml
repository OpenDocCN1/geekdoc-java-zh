    Where industrial agriculture sees nature as dead matter, or as a machine, agroecology
    injects life back into the Earth, seeing her as a living, breathing being.


    In the agroecological paradigm of knowledge, and in organic farming, food is the
    web of life. Humans are part of this web, as cocreators and producers, as well
    as eaters. When we save seed and replant it, we become part of the cycle of life.
    When we return organic matter to the soil, we are feeding the soil organisms.
    Working according to nature’s laws, participating in nature’s processes of creation
    and production. This is the basis of sustainability of food and agricultural systems.
    An agroecological knowledge system feeds the world, not a violent, reductionist
    paradigm of agriculture.


    ## 2

    ## Living Soil Feeds the World, Not Chemical Fertilizers


    Whatever I dig of you, O Earth,

    May that grow quickly upon you,

    O pure One, may my thrust never pierce thy

    Vital points, Thy Heart


    > “PRITHVI-SUKTA,” A PRAYER IN THE ANCIENT INDIAN TEXT ATHARVA VEDA


    English botanist Sir Albert Howard arrived in Indore, India, in 1905. He began
    with his wife Gabrielle as an agricultural adviser, observing the methods of cultivation
    used by peasants and farmers. Howard is known as the father of organic farming,
    but it was actually the peasants of India who fathered and mothered the scientist''s
    now-famous agricultural philosophy and practice. It was here he began espousing
    farming techniques that returned nutrients to the soil, and in his several writings
    he most famously observed, “Health in soil, plant, animal, and man is one great
    subject.”


    The soil is a living system, with billions of soil organisms weaving an intricate
    soil food web to create, maintain, and renew soil fertility. All food production
    rests on this web. The well-being of the soil is vital to human well-being, and
    from this point of view, the aim of fertilization is not to simply increase yields
    and fertilize plants to nurture living soil.


    However, the reductionist paradigm that paved the way for industrial chemical
    agriculture treats soil as an inert, empty container for chemical fertilizers.
    After World War I, manufacturers of explosives whose factories were equipped for
    nitrogen fixation had to find other markets for their products. Synthetic fertilizers
    provided a convenient “conversion” for peaceful uses of war products, except instead
    of being peaceful, these chemicals waged a battle against the soil and against
    the Earth. Following World War II, this war against the planet was led under the
    banner of the Green Revolution in a bid to export these toxic chemicals to the
    Global South.


    In India alone, twenty years of Green Revolution agriculture have succeeded in
    destroying the fertility of Punjab’s soils. These soils were maintained across
    centuries by generations of farming families and could have been indefinitely
    maintained if international “experts” and Indian followers had not mistakenly
    believed that technologies could substitute for land, and that chemicals could
    replace the organic fertility of soils.


    Today, 24 billion metric tons of fertile soils are lost from world agricultural
    systems each year. India is losing 6.6 billion metric tons of soil per year, China
    is losing 5.5 billion metric tons, and the United States is losing 3 billion metric
    tons. In fact, soil is being lost at ten to forty times the rate at which it can
    be replenished naturally. Soil nutrients to erosion cost $20 billion annually.
    Chemical monocultures also make soils vulnerable to drought and further contribute
    to food insecurity. Resulting from this degradation are reduced availability of
    clean water, and increased vulnerability of the affected areas to climate change,
    food insecurity, and poverty. Today, 1.5 billion people in all parts of the world
    are already directly affected by the loss of land through reduced income or food
    insecurity.¹ According to the current status of soil degradation, if we continue
    to destroying the soil of our planet, there will be 30 percent less food on the
    planet over the next twenty to fifty years.


    Fueled by the Law of Exploitation and the Law of Domination, in the place of soils,
    we now have chemical fertilizers. The push for more fertilizers was an important
    factor in the spread of the new seeds, because wherever they opened up new markets
    for chemical fertilizers. In 1967, at a meeting in New Delhi, Norman Bourlaug—who
    is credited with the “success” of the Green Revolution in India—was emphatic about
    the role of fertilizers in the new agricultural order. “If I were a member of
    your parliament,” he told the politicians and diplomats in the audience, “I would
    leap from my seat every fifteen minutes and yet the toll of my voice, ‘Fertilizers!
    Give the farmers more fertilizers.’ There is no more vital message in India than
    this. Fertilizers will give India more food.”²


    But no technology system can claim to feed the world while it destroys life in
    the soil. This is why the Green Revolution’s claims—or genetic engineering’s claims—that
    its technologies will feed the world are false. Intrinsic to these technologies
    are recipes for killing the life of the soil, thus accelerating soil erosion and
    degradation. Degraded and dead soils, soils without organic matter, soils without
    soil organisms, and soils with no water-holding capacity do not create food security;
    they create famines and are at the heart of the food crisis the world is facing
    today.


    Healthy and fertile soils make healthy plants, which in turn make healthy people.
    Howard wrote:


    A soil teeming with healthy life in the shape of abundant microflora will bear
    healthy plants, and these, when consumed by animals and man, will confer health
    on animals and man. An infertile soil, that is, one lacking sufficient microbial,
    fungus, and other life, will pass on some form of deficiency to the plant, and
    such plant, in turn, will pass on some form of deficiency to animals and man.


    The millions of organisms found in soil are the source of its fertility. The greatest
    biomass in soil consists of microorganisms. Soil microorganisms maintain soil
    structure, contribute to the biodegradation of dead plants and animals, and fix
    nitrogen. They are the key to soil fertility, and their destruction by chemicals
    threatens our survival and our food security. 1997 Danish study analyzed a single
    cubic meter of soil and found thousands of small earthworms, fifty thousand insects
    and mites, and twelve million roundworms. A single gram of the soil contained
    thirty thousand protozoa, fifty thousand algae, four hundred thousand fungi, and
    billions of individual bacteria. This is an amazing biodiversity that maintains
    and rejuvenates soil fertility and allows workers in the soil, or soil organisms,
    to flourish. These include fungi, bacteria, nematodes, and earthworms.


    In uncontaminated soil, organic matter is broken down by soil organisms to form
    humus. Humus is the Latin word for “soil” or “earth.” Humus is organic matter
    digested by soil organisms and made into living soil. One important characteristic
    of humus is that it functions as a sponge and can hold up to 90 percent of its
    weight in water. Soil that lacks humus is more vulnerable to drought, nutrient
    deficiency, and soil erosion.


    Soils rich in humus are rich in fungi like mycorrhizae, which cannot exist without
    humus. Mycorrhizae create a symbiotic relationship with plants by entering the
    roots and mobilizing nutrients and moisture for plants. In a cycle of codependence,
    these fungi also contribute to forming humus and binding soil.


    Living soils are teeming with beneficial bacteria. One teaspoon of soil has between
    one hundred million and one billion bacteria, which translates to one metric ton
    per every acre. Bacteria decompose and immobilize nutrients, which are retained
    in their cells, preventing soil loss. They produce substances that bind soil particles
    into aggregates—preventing soil erosion and increasing the water-holding capacity
    of soil.


    Actinomycetes are bacteria that break down organic matter and live on providing
    a glue to bind soil particles into aggregates. In absence of microorganisms, soil
    does not. Instead, it becomes dust and is easily blown away by wind and washed
    away by water. Living soils also have nitrogen-fixing bacteria, which create a
    symbiotic relationship with the plant root and give the plant nitrogen in exchange
    for carbon.


    Nematodes—or multicellular roundworms—get their name from the Greek word for “thread”:
    nema. Ninety percent of nematodes reside in the top 15 cm of soil. Nematodes do
    not decompose organic matter but, instead, feeding on living material. Nematodes
    can effectively regulate bacterial populations by eating up to five thousand bacteria
    per minute, and for the process, produce nitrogen.


    Earthworms are essential to living soils and soil fertility. In 1881, Darwin published
    a book entitled The Formation of Vegetable Mould through the Action of Worms,
