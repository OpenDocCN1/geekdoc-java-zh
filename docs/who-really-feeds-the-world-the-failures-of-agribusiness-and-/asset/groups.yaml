    suicides in India—and across the world—are the result of policies of market freedom.
    Liberalization, privatization, and globalization trends in agriculture have resulted
    in the creation of an unregulated seed market. At the same time, existing rules
    and regulations have either been abandoned or modified to accommodate multinational
    and transnational corporations. Farmers’ seed supply and direct-exchange networks
    have been adversely affected by the proliferation of unregulated seed markets.¹⁴


