    and natural resources such as soil fertility and rainfall distribution are better.


    But in developed countries, only 15 percent of the price of a loaf of bread goes
    to the farmer—the rest goes to milling, baking, packaging, transportation, and
    marketing. For agribusiness, high production costs and low commodity prices translate
    into two-way profits. For the farmer, they translate into a negative economy and
    spiraling debts. Even though US farm exports from large monocultures are booming,
    farmers cannot survive. More US farmers die of suicides than of any unnatural
    cause. As a group, farmers are three times more likely to kill themselves than
    the general population.²


    In 2000, the Canadian National Farmers Union submitted a report to the Senate
    called “The Farm Crisis.” The report reads:


    While the farmers growing cereal grains—wheat, oats, corn—earn negative returns
    and are pushed close to bankruptcy, the companies that make breakfast cereals
    reap huge profits. In 1998, cereal companies Kellogg’s, Quaker Oats, and General
    Mills earned on equity rates of 56%, 165%, and 222% respectively. While a bushel
    of corn sold for less than $4, a bushel of corn flakes sold for $133. In 1998,
    the cereal companies were 186 to 740 times more profitable than the farms. Maybe
    farmers are making too little because others are taking too much.³


    A false logic is established through the “myth of more,” according to which industrial
    monocultures produce more, and more food leads to lower prices. But when viewed
    in terms of total food output—large-scale farming does not produce more. As we
    see in Chapter Seven, low prices, as in the case of wheat cereal, are linked to
    monopoly control rather more food production. The lowering of agricultural prices
    is not due to an increase in productivity or efficiency, but to agribusiness,
    which takes several times more from the land than it gives back to the farmer
    or the Earth.


    The Indian Ministry of Agriculture would do well to learn from the successes of
    its own food production prior to the implementation of Green'
  - '[PAGE 71]


    Revolution, large-scale monocultures. As former Indian Prime Minister Charan Singh
