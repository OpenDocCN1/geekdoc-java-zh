    Given that only 1 percent of a pesticide application acts on the target “pest,”
    the effect on friendly insects and pollinators is drastic. Pollinators contribute
    significantly to our food security and agricultural economy.


    Honeybees, for example, pollination seventy-one of the hundred most common crops
    that account for 90 percent of the world’s food supply. Globally, the contribution
    of bees to crop production has been estimated at $200 million. Out of every four
    mouths of food in the world is produced by the ecological contributions of pollinators.
    Insect-pollinated crops in the United States are valued at $20 billion. Yet bees
    and butterflies, are being killed by the arsenal of poisons that form the basis
    of industrial agriculture.


    From 1985 to 1997 the number of honeybee colonies in US farmland dropped by approximately
    57 percent. Pesticides were largely responsible for this change. The immune system
    of honeybees weakens on exposure to pesticides, and they become more vulnerable
    to natural enemies. Exposure to pesticides can also disrupt their reproduction
    and development.'
