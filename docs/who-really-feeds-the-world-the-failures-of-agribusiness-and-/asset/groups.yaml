    Today there are up to 1,400 pesticides used globally in agriculture. Pesticides
    fall into five categories: herbicides, used to destroy unwanted weeds and plants;
    insecticides, to kill insects and other arthropods; rodenticides, to control mice
    and other rodents; fungicides, to destroy fungi; and molluscicides, used against
    mollusks.


    Ideally, these pesticides should act only on the target organism. However, only
    1 percent of the pesticide sprayed acts on the target, and the rest spreads into
    the ecosystem, affecting all organisms. Pesticides are highly nonspecific and
    are toxic to many nont organisms, including humans. A 1990 report from the World
    Health Organization (WHO) states that “There is no segment of the general population
    that is sheltered from exposure to pesticides and potentially serious health effects,
