    2014年5月6日，中国政府宣布将不再向军事人员提供转基因粮食、食品和油脂。湖北省襄阳市粮油局网站显示，“目前中国对转基因粮食和油类产品的安全性担忧尚未确定，为了保障我市居住军人员的整体健康，将禁止转基因食品。”更具意义的是，2014年4月，俄罗斯禁止了进口任何转基因产品，其总理德米特里·梅德韦德夫评论道：“如果美国人喜欢吃转基因产品，让他们吃去吧。我们不需要这样做；我们有足够的空间和机会生产有机食品。”


    无论是有机运动——迈向无化学品、无农药、无转基因的耕作——还是环保运动——反对气候变化——都在试图创造一个无毒的世界。传播毒素的紧迫性并非自然运作的生态紧迫性，也不是创造繁荣经济的社会经济迫切。相反，它仅仅是企业利润的迫切，而这些利润根源于战争带来的毒素。这些公司随后对利润产生了依赖，并产生军事化的思维和知识范式，这种范式使得毒素看起来对于害虫控制并延伸到养养世界变得必不可少。


    但正如我们所看到的，无毒耕作方式不仅是可能的，而且是。打破毒素循环对于保护我们的健康和生物多样性至关重要，而生物多样性正受到农药及产生农药的植物的威胁。生物多样性和生态过程是控制害虫最复杂且经过证明的方法。现在是时候进行范式转移了：从将所有物种视为待消灭敌人的军事化思维，转变为将人类视为地球家庭的一部分，并承认授粉者和益虫昆虫为我们食物网中的共同生产者的世界观。


