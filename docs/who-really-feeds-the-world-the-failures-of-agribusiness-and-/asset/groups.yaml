    A false logic is established through the “myth of more,” according to which industrial
    monocultures produce more, and more food leads to lower prices. But when viewed
    in terms of total food output—large-scale farming does not produce more. As we
    see in Chapter Seven, low prices, as in the case of wheat cereal, are linked to
