    protect the biodiversity of our planet. The Seed Freedom Movement is a small seed
    we hope will multiply and reproduce without seed, no farmer, and no citizen is
    bonded, colonized or enslaved. The stories of seed freedom are stories of courageous
    and creative individuals and organizations that are challenging unjust laws.


    Across the world, various seed movements are defending the freedom of seeds, farmers,
    and citizens. In India, a Bija Satyagraha stopped the introduction of a seed law
    in 2004 that would have made farmers'' seeds illegal. In Europe, when the European
    Commission tried to introduce a seed law that would have criticized biodiversity
    and local seed varieties, the Seed Freedom Movement worked with the European Parliament,
    and the law was sent back to the European Commission. In Colombia, farmers took
    to the streets to stop a seed law that would make their seeds illegal.'
  - '[PAGE 92]


    traveled across Africa in 2014 to support the indigenous movements for seed sovereignty
    and food sovereignty.


    In every country there is a contest between people’s movements for seed freedom
    and the corporate push for seed dictatorship. Food democracy rests on seed freedom.
    Seed dictatorship is the foundation for food dictatorship. During the Vietnam
    War, Henry Kissinger said, “Food is a weapon.” Today, seed has become the ultimate
    weapon in a war against the Earth and her people. In this war, if corporations
    win, we will lose all our food and our future.


    Seed freedom has become an ecological, political, economic, and cultural imperative.
    If we do not respond, or if we have a fragmented and weak response, species will
    irreversibly disappear. Agriculture, including the food and cultural spectrum
    dependent on biodiversity, will disappear. Small-scale farmers will disappear,
    healthy food diversity will disappear, seed sovereignty will disappear, and food
    sovereignty will disappear.


    On the other hand, if we speak and act strongly in one voice in defense of seed
    freedom, we can put the obscenity, violence, injustice, and immorality of patents
    on seeds and life behind us. In another era, slavery was made history. Just as
    today corporations see nothing wrong in owning life, slave owners saw nothing
    wrong in owning other humans. Just as people questioned and challenged slavery,
    it is our ethical and ecological duty and right to challenge patents on seeds.
    We have a duty to liberate the seed and our farmers. We have a duty to defend
    our freedom and protect open source seeds as a commons. We have the duty and the
    right to defend life on Earth.'
  - '[PAGE 93]


    # 7

    # Localization Feeds the World, Not Globalization


    Two principles have shaped the evolution of food systems across the world. The
    first is that everyone must eat. The second is that every place where human beings
    lives food. From the Arctic to the rainforest to the desert, each place has a
    different ecosystem, and hence a different food system, but there will be food
    wherever people are. Between these two principles, the food systems that have
    evolved to nourish people are, by their nature, local. These systems of food production
    nourish both biological and cultural diversity. The localization of food is not
    only natural but vital, because it allows farmers to practice the Law of Return,
    produce more food through biodiversity, create food systems adapted to local cultures
    and ecologies, and nourish themselves, their communities, and the soil that they
    give back to.


    Over the last twenty years, the globalization of food and agricultural systems
    have been presented as a natural and inevitable phenomenon. However, there is
    nothing natural about globalization, and in particular, the globalization of food.


    The first wave of globalization began in the seventeenth century and was driven
    by Europe, which sought to control the spice trade from India. This is what led
    to the establishment of the East India Company and the signing of the first “free
    trade agreement” between the East India Company and the collapsing Mughal Empire.
    The East India Company traded in spices, not staple foods. In fact, until the
    establishment of the World Trade Organization in 1995, food was a subject of local
    and national sovereignty, not of global trade.


    The rules of global trade have been written by corporations in order to expand
    their control over food and agriculture, and thus increase their profits. The
    idea that free trade is based on competition is a myth. It led to monopolies,
    with just five giants controlling seed—Monsanto, Syngenta, DuPont, Bayer, and
    Dow—five grain giants controlling grain supply—Cargill, ADM (Archer Daniels Midland),
    Bunge, Glencore'
  - '[PAGE 94]


    International, and Louis Dreyfus—five processing giants controlling food and beverage
    processing—PepsiCo, JBS, Tyson Foods, Danone, and Nestlé—and five retail giants
    controlling food retail—Walmart, Carrefour, Metro Group, Aeon, and Tesco.


    Just as false claims of feeding have been made about industrial agriculture as
    a model of production, false claims have been made about feeding the world through
    globalization, and free trade as a model of distribution. The reality is the opposite.
    Globalization has created displacement, unemployment, hunger, and food insecurity
    on an unprecedented scale. While the language used is “free trade” and competition,
    corporate globalization consists of unfair and unnecessary trade.


    Globalization was imposed with the argument that it would do two things for food.
    First, that it would increase food production, under the theory that corporations
    are better at producing large amounts of things than small groups of people are.
    And second, that it would make food cheaper and therefore more accessible for
    the poor. Both these claims are lies. As far as food production goes, we’ve already
    seen how the “myth of more” produces less through monocultures, large farms, and
    poisons. In fact, globalization doesn’t produce food; it produces commodities.
    Ninety percent of the corn and soy in the world is used for biofuel or animal
    feed, because that’s where the largest profits lie. Commodities don’t feed people;
    they create hunger.


    As far as “cheap food” goes, globalized food is actually produced at a very high
    cost, and if it weren''t for the fact that agribusinesses collect more than $400
    billion in subsidies in rich countries, the entire system would collapse. Input
    costs—including fertilizers, pesticides, and machinery—are always higher than
    the value of what is traded, and without these subsidies, the system of generalized,
    mechanized food production would not work. These subsidized commodities are then
    in sold to poor countries, which are forced to dismantle their border protections
    that rich nations “dump” cheap commodities into the developing world. To add to
    this, volatile global prices resulting from financial speculation further entrench
    a system that takes from farmers and gives to corporations and governments.


    Globalization is implemented through neoliberal economic “reform” policies, which
    deregulate both domestic and international commerce,'
- md: '

    privatize public goods, and create a framework that accepts corporate rule.


    Today, the world’s food supply is in crisis. This crisis has multiple facets.
    First, the ecological costs of chemical-intensive, fossil-fuel-intensive industrial
    agriculture are massive, and are leading to climate change, biodiversity erosion,
    water depletion, and soil erosion. Second, global industrial agriculture is leading
    to the mass displacement of small-scale farmers, where on the one hand growing
    debt has pushed hundreds of thousands of farmers to suicide, and on the other
    hand mass unemployment is feeding into different forms of extremism. Third, it
    is in the design of industrial food production to create hunger, malnutrition,
    and disease. Hunger is created by debt in situations where farmers are forced
    to sell what they grow; it is created by dumping, which destroys livelihoods;
    and it is created by turning food into a commodity for long-distance trade, which
    wastes large amounts of food.


    Every dimension of the food crisis—unsustainability, injustice, unemployment,
    hunger, and disease—is linked to the globalized, industrialized food system, and
    every dimension of the crisis can be addressed through ecological agriculture
    and local food systems. To grow sustainability, nutrition, and food democracy,
    we must think small, not big; local, not global.


    Globalization benefits the wealthy (including wealthy countries) and exploits
    the poor. This is done in the name of “free trade,” enacted through trade liberalization,
    and the dismantling of governmental restrictions on and how much can be imported
    into a country. It is closely linked to the entrenchment of privatization, because
    when governments (are forced to) take a backseat through policies enforced by
    organizations such as the WTO, private companies step in and fill the gap. Trade
    liberalization is touted as “opening up” of a country’s borders to allow the easy
    flow of goods and services. In reality, the only stakeholders who benefit from
    these agreements are large companies and rich nations. Over the last two decades,
    neoliberal policies have devastated livelihoods and food security across the world.


    Trade liberalization forces countries to remove their import barriers, which leaves
    them vulnerable to “dumping,” the process by which commodities that are subsidized
    in the Global North are "dumped" in large quantities into countries in the Global
    South. This creates the artificial impression that cheaper goods are now available
    in poorer countries. However, what this actually does is destroy local sources
    of food production and distribution, including farmers'' livelihoods.


    In 1998, when quantitative restrictions (or import barriers) were first dismantled
    in India, several commodities were dumped to undercut local food sources. So,
    at the time, sold in the international market by the United States at $150 per
    metric ton. However, the subsidy (behind the production of soy) given to large
    farms and companies was $190 per metric ton. Without the subsidy, soy would have
    been unable to compete with local Indian product. As this artificially cheap product
    flooded Indian markets, it began to undercut local farmers and food production.
    This happened across crops. Once the price of a coconut in Kerala was Rs. 10,
    after the dismantling of quantitative restrictions, it fell to Rs. 2 per nut.
    People in Kerala, the land of the coconut, began chopping their trees and resorted
    to growing crops or selling their land.


    One significant treaty that has allowed dumping to carry on at the expense of
    poorer countries is the Common Agricultural Policy (CAP) of the European Union,
    which is a system of agricultural subsidies. It was first implemented in 1962,
    but has been revised several times to allow for larger-scale dumping into poor
    countries. In Jamaica, the dumping of heavily subsidized EU milk powder has led
    to a collapse in local dairy production. Ironically, EU dairy farmers have largely
    failed to benefit from the subsidies because payments are made directly to large
    food-processing companies rather than to the farmers themselves.


    In West Africa, between ten and eleven million farmers lost $200 million as a
    direct result of US subsidies, which are enacted through the US Farm Bill. In
    South Africa, research shows that the European Union''s sugar regime has enabled
    high-cost European farmers to benefit at the expense of much more efficient South
    African producers, resulting in lost jobs and revenue in a country battling both
    HIV/AIDS and the legacy of apartheid. Farmers in the Global South see CAP and
    the US Farm Bill as the worst examples of Northern double standards, summed up
    as “you liberalise, subsidize.”


    Due to the high levels of subsidies in the Global North, the removal of protective
    barriers transmits distorted price signals to domestic markets, which in turn
    pushes prices downward below survival levels. This also creates an imbalance in
    supply and demand, and as we explore toward the end of the chapter, begins to
    aggressively reshape what people can access.


    The policies of trade liberalization go over and above dumping. These policies—the
    pillars of liberalization—have undermined the government’s role in ensuring food
    security for people and livelihood security for farmers. Advocates of trade liberalization
    call governmental measures meant to aid people “trade distorting” and demand that
    these be scrapped. In this way, when farmers and local producers are being put
    out of business by large quantities of imported goods, governments are unable
    to step in and help.


    At the same time, rather than encourage community initiatives, trade liberalization
    has encouraged policies that give agribusiness increasing control over the food
    production and distribution system through programs such as “privatization,” “market
    access,” and the removal of quantitative restrictions on imports. An obvious example
    of the policy shift from people-centered concerns to trade- and corporation-centered
    concerns is the fact that farmers are not allowed by law to take their produce
    beyond borders, whereas traders can pick up produce from anywhere and take it
    anywhere. In fact, governments (after forcibly taking away from farmers and communities)
    are building superways to connect centers of agricultural production to airports
    and ports, so that corporations can quickly transport these commodities for export.


    Whereas countries were once exporters, they have now become importers. In other
    words, they have moved from food-independent, self-sufficient economies to food-dependent
    economies. India, for example, is one of the world’s largest producers of castor,
    sesame, and niger oil. In the span of a decade from 1985 to 1996, oilseed production
    more than doubled, and India achieved self-sufficiency. From 1990 to 1991, this
    went up to Rs. 10,310 million. However, with the introduction of trade liberalization
    and the dismantling of import barriers in 1998, India went from being a net exporter
    to importer of edible oils. By 2001, India was importing $133 million; and by
    2003, the import bill had jumped to $940.6 million, which accounts for 63.5 percent
    of our imports.


    In 1992, Indonesian farmers produced enough soy to supply the domestic market.
    Soy-based tofu and tempeh are important parts of the daily diet across the archipelago.
    Following the implementation of a neoliberal doctrine, the country opened its
    borders to food imports, allowing cheap US (in other words, heavily subsidized
    soy) to flood the market. This destroyed national production, and today 60 percent
    of the soy consumed in Indonesia is imported. Record prices for US soy in 2007
    led to a national crisis in Indonesia, when the price of tofu and tempeh—known
    as the “meat of the poor”—doubled in just a few weeks.


    According to the FAO, the food deficit in West Africa increased by 81 percent
    between 1995 and 2004. During the same period, cereal imports increased by 102
    percent, sugar imports by 83 percent, dairy products by 152 percent, and poultry
    by 500 percent. However, according to the International Fund for Agricultural
    Development (2007), the region has the potential to produce sufficient amounts
    of food. All across the world, liberalization goes on, even though it is increasing
    countries'' vulnerabilities. The proponents of globalization depict trade liberalization
    as a policy intended to benefit all parties, and one that countries in the Global
    South have voluntarily signed up for it. In reality, large companies and rich
    nations have put pressure on poorer countries to deregulate trade and open their
    markets to cheap imports.

