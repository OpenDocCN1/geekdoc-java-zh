  raw:
  - '[PAGE 22]


    The first is a Newtonian-Cartesian idea of separation: a fragmented world made
    of fixed, immutable atoms. In this worldview, Newton himself writes, the "solid,
    mass, impenetrable, moveable particles . . . are very hard, as never to wear,
    or break in pieces: no ordinary power being able to divide, what God himself made
    one in the first creation. . . . And therefore, that Nature may be lasting." This
    understanding of the world sees nature as composed of dead matter: a Lego set
    where particles and pieces can be used, moved, moved, and substituted without
    any overarching consequences. This mechanistic assumption has given rise to genetic
    reductionism and genetic determinism, and has led to the development of what has
    come to be known as the central dogma of molecular biology, which is the belief
    that genetic material, or DNA, serves as a master molecule. This dogma was so
    fundamentally inscribed into scientific belief that it was "the equivalent of
    science''s Ten Commandments, written in stone."


    Subsequently, this belief system has provided the basis for genetic engineering
    and genetically modified seeds, or GMOs. As we will see throughout this book,
    instead of killing pests and growing food, GMOs have reduced food production while
    producing new superplants and superweeds, which are growing increasingly tolerant
    to the sprays to kill them. And like the scientific paradigm that gave rise to
    them, GMOs have displaced indigenous knowledge, and in particular, women''s knowledge,
    with a mechanized, reductive worldview. As geneticist Dr Mae-Wan Ho puts, "The
    organism is doing its own natural genetic modification a molecular dance of life
    that''s necessary for survival. Unfortunately, genetic engineers do not know the
    steps or the rhythm and music of the dance."


    Newtonian-Cartesian theories have been proven to be false by new sciences such
    as quantum theory, ecology, the new biology, and epigenetics. Quantum theory teaches
    us that the world is not made of hard, immutable matter but of fields of potential
    with a dynamic transformation of particles into waves and into particles. My doctoral
    thesis on the foundations of quantum theory focused on inseparability, not Newtonian
    separation, the defining characteristic of a quantum universe. Ecology teaches
    us that everything is a web of life and that Gaia is a self-organizing system
    at every level, from the cell to the organism. Epigenetics teaches us that the
    idea there are atoms of life called "genes"\which determine the traits of all
    living organisms—is not true. It shows us that the environment'
  - '[PAGE 23]


    influences genes, and genes do not regulate or organize themselves independently
    of their surroundings.


    In The Doctrine of DNA, Richard Lewontin writes:


    DNA is a dead molecule, among the more nonreactive, chemically inert molecules
    in the world. It has no power to reproduce itself. Rather, it is produced out
    of elementary materials by a complex cellular machinery of proteins. . . . While
    it is often said that DNA produces proteins, in fact proteins (enzymes) produce
    DNA. When we refer to genes as self-replicating, we endow them with a mysterious,
    autonomous power that seems to place them above ordinary materials of the body.
    Yet if anything in the world can be self-replicating, it is not the gene, but
    the entire organism as a complex system.


    The second significant theory that has framed the knowledge paradigm for industrial
    agriculture is Darwin''s theory of competition as the basis for evolution. In
    his book The Biology of Belief, Bruce H. Lipton writes:


    [Darwin] concluded that living organisms are perpetually embroiled in a struggle
    for existence. For Darwin, struggle and violence are not only a part of animal
    nature, but the principal forces behind evolutionary involvement. In the final
    chapter of The Origin of Species: By Means of Natural Selection, or, The Preservation
    of Favoured Races in the Struggle for Life, Darwin wrote of an inevitable “struggle
    for life” and that evolution was driven by “the way of nature, from famine and
    death.”


    But life does not evolve through competition; rather, life evolves through cooperation
    and self-organization. Fifty trillion cells cooperate to create the human body.
    Millions of species cooperate to shape ecosystems and the planet.


    The Darwinian paradigm of competition has fueled the industrial agriculture paradigm.
    Monocultures are born of the idea that plants compete with each other, when the
    reality is that plants cooperate with each other. In'
  - '[PAGE 24]


    mixed farming system of corn, beans, and squash in Mexico, for example, nitrogen-fixing
    beans and pulses provide free nitrogen to cereals, and in return, the stalks of
    cereals like maize or millets provide support for the bean stalks to climb. In
    turn, the squash provides cover to the soil, preventing soil erosion, water evaporation,
    and the emergence of weeds. Together, these diverse crops provide nutrition for
    soil, animals, and human beings. The Darwinian paradigm, on the other hand, sees
    every insect as being at war with humans, and therefore as something to be exterminated
    with poisons.


    Together these two scientific theories form a reductionist, mechanistic paradigm
    of knowledge that permits limitless exploitation. While the tools of implementation
    under this paradigm vary, the privile of this knowledge has provided the intellectual
    foundation for industrialism as a system of production and of control over nature.
    Under the industrial systems of agriculture born from this paradigm, soil is treated
    as an inert container for chemical fertilizers, plants are defined as factories,
    and are seen as machines that run on agrochemicals.


    The Newtonian-Cartesian theory of fragmentation and separation, and the Darwinian
    paradigm of competition, have led to a nonrenewable use of the Earth’s resources,
    a unsustainable model of food and agriculture, and an unhealthy model of health
    and nutrition. An emphasis on the legitimacy of these arguments as the sole “scientific”
    approach has created a knowledge apartheid by discounting the knowledge of farmers
    and the intelligence and creativity of Mother Earth. After all, if nature is already
    dead, how can you kill her?


    The scientific paradigms of violence paved the road for intensified warfare. During
    World War II, large companies made even larger sums of money from the deaths of
    millions of people. After the wars ended, an industry that grew and made profits
    by making explosives and chemicals for war, including concentration camps, remodled
    itself as the agrochemical industry. With the choice of closing down or “rebranding,”
    explosives factories started to make synthetic fertilizers, and war chemicals
    began to be used as pesticides and herbicides. At the heart of industrial agriculture
    is'
  - '[PAGE 25]


    the use of poisons; the system of industrial agriculture is a necroeconomy— its
    profits are rooted in death and destruction.


    The chemical push changed how agriculture was both understood and lived. Instead
    of working with ecological processes and taking the well-being and health of the
    entire agroecosystem into account, agriculture was reduced to an external system
    based on poisons. So where once there was a farming system in which everything
    was internally recycled and reused, from the soil to the water to the plants,
    there was now a system that relied on external inputs of seeds, chemicals, and
    fertilizers that constantly needed to be purchased.


    Industrial farming is a massive contributor to climate change. It is responsible
    for 25 percent of the world’s carbon dioxide emissions, 60 percent of methane
    gas emissions, and 80 percent of nitrous oxide, which are all powerful greenhouse
    gases. As we shall see in the following chapters, it has also contributed to soil
    erosion and infertility, water pollution and aquifer depletion, and the destruction
    of self-sufficient societies across the world.


    Even small farms produce more food through diversity, agriculture has become focused
    on large, monoculture farms based on the intensive use of chemicals, fossil fuels,
    and capital. Instead of diverse cultures based on more than 8,500 plant species
    across the world, these farms produce monocultures of a handful of commodities
    to be traded globally. Monocultures based on external inputs—such as chemical
    fertilizers and pesticides—are also more vulnerable to pests, and they fare poorly
    compared to a diverse, organic farming system. The shift from diversity to monocultures
    in farming has led to a shift from diversity to monocultures in diets. These agricultural
    shifts impoverished both the health of soul and the health of people. War, as
    we all know, is never an undertaking for health or for life.


    Under a reductionist knowledge paradigm, the effects of war on agriculture led
    to a privileged commodity production. Commodity production is to economics what
    fragmented thinking is to biology. The same system that sees genes as master molecules
    deems commodities to be the master currency of the world. The system for managing
    commodities is gross domestic product, or GDP. But GDP did not always exist. In
    fact, it was created to finance war, we'
- md: '

    governments could justify pulling out resources from sustenance to fund warfare.
    GDP is dangerous to agriculture because it has resulted in the fictitious idea
    that if you produce what you consume, you do not produce. So where you once had
    nature and women as producers of food, you now have commodities—that which creates
    economic profit—being counted as production.


    Through this artificially imposed economy, society has been reduced to producers
    and consumers of commodities, rather than growers and eaters of food. Nature’s
    production of ecological goods and services, and the ability of societies to maintain
    nature and provide sustenance, were first erased in people’s minds and then in
    real ecosystems and local economies. This centuries-old knowledge that provides
    nourishment and sustenance to soil and society is the basis of ecological destruction
    and leads to poverty and hunger across the world.


    The construction of the reductionist economic paradigm gave mysterious qualities
    to capital and to corporations as the creative forces that bring us food. By rendering
    invisible the production carried out by nature, women, and small-scale farmers,
    the only part of the food economy made visible was that was under corporate control.
    Systems based on diversity were replaced by monocultures, which produced less
    nutrition but more commodities. Farmers were made dependent on purchasing costly
    seeds and chemicals, and many debt-trapped farmers were eventually driven to suicide.


    Within an agroecological system that sustains life, there are three coexisting
    economies: nature’s economy, people’s economy, and the market economy. Together
    they make up an economy of sustainability. Nature’s economy includes biodiversity,
    soil fertility, and water conservation, which together provide the ecological
    foundations on which agriculture depends. People’s economy is an economy of sustenance,
    where communities produce what is needed and look after each other. Finally, the
    market economy involves exchanges and interactions between real beings, not corporations.


    The sustainability of both nature’s economy and people’s economy is based on the
    Law of Return: giving back to seeds, soil, and society. The Law of Return of the
    seed sustains the cycle of living seed. It includes allowing seed to turn into
    seed while also giving us food. It also allows for living seed evolved by nature
    and farmers to move freely from farmer to farmer through what we call seed freedom.
    The Law of Return of the soil includes giving back organic matter to the soil,
    to renew fertility and sustain living soils. The Law of Return in society includes
    giving back to farmers their fair pay for producing food and sustaining us with
    nourishment, so they can live a life of dignity and freedom. It includes cooperation
    and mutuality as well as closing the cycle between production and consumption.
    And above all, it includes the Law of Return between generations, with each generation
    remembering the gifts received from our ancestors, and leaving behind a legacy
    of seed, soil, knowledge, and culture for generations to come.


    In a sustainable system, these three economies exist as a stable pyramid. Nature’s
    economy, in all its plentiful, renewing sustenance, forms the base of the pyramid.
    Nature’s economy supports people’s economy, which recycle and renew the natural
    resources it uses. The tip of the pyramid is the market economy based on nature’s
    and people’s economy, which is made up of the interactions of different communities
    to share resources, knowledge, and ideas.


    Under the reductionist, mechanistic paradigm of knowledge and profits, the idea
    of sustainability itself is being mutated. There are quite clearly two different
    meanings of “sustainability.” The real meaning refers to nature and people’s sustainability,
    and it recognizes that nature supports our lives and livelihoods and is the primary
    source of sustenance. Sustaining nature implies maintaining the integrity of nature’s
    processes, cycles, and rhythms.


    Now, however, there is a second kind of “sustainability,” one that refers to the
    Market with a capital “M.” This paradigm only measures growth in the Market economy
    through GDP, even though this growth is associated with destruction and shrinkage
    of nature and people’s economy. Sustainability in this all-powerful Market involves
    ensuring supplies of raw material, flow of commodities, accumulation of capital,
    and returns on investment. It cannot provide the sustenance that we are already
    losing by impairing nature’s capacities to support life. The growth of global
    markets hides the destruction of the local economy of domestic production and
    consumption. And since industrial raw materials and market commodities can be
    substituted—whereas people and nature can’t—sustainability is translated into
    the substitutability of materials, which is further translated into nature’s convertibility
    into profits and cash.


    This mutated idea of sustainability has turned the economic pyramid on its head,
    making it ecologically and socially unstable. At the top is a large, profit-driven
    Market; below is a smaller, also market-driven people’s economy; and finally,
    nature’s economy is reduced to a tiny tip, attempting to hold up a system that
    only takes and never gives back.


    We need to restore the pyramid to its original, enduring form. This transition
    to sustainable agriculture requires that the two neglected economies of nature
    and people should be made visible in the assessment of productivity and cost-benefit
    analysis in agriculture. Sustainability criteria can be internalized in agriculture
    only when nature’s economy reflects the health of nature’s ecological processes—the
    health of soil, the health of biodiversity, the health of water systems—and when
    people’s economy reflects the health of people’s socioeconomic and nutritional
    status. In order to begin this reversal, we must first reverse the dominant knowledge
    paradigms that have framed these debates.


    The knowledge of conservation has never been recognized as knowledge by the gatekeepers
    of reductionist science and economics. Instead, the dominant paradigms of knowledge
    have been focused on exploitation. Take a tree, it has no value; it is only when
    you cut the tree that the value is accrued. Under this logic, the only knowledge
    that matters is the knowledge that feeds the market. But the tree provides shade,
    gives fruit, sustains soil, birds, and animals, and provides the oxygen that we
    breathe. This is the knowledge that the emerging field of agroecology claims.


    Agroecology is the new name given to the scientific paradigm that covers all ancient,
    sustainable, and traditional farming systems that were based on ecological principles.
    These practices were usually only explained in traditional, localized worldviews,
    such as knowledge passed down from generation to generation in tribal and indigenous
    communities. Agroecology takes all of this diversity, combines it with knowledge
    from new sciences like epigenetics and quantum theory that reinforces the connectedness
    of the world, and produces a new, sustainable knowledge paradigm.


    The paradigm of agroecological knowledge reshapes the ways in which we understand
    issues surrounding food and agriculture.


    - It recognizes interconnections in nature and is based on the application of
    ecological science to food and agricultural systems, instead of a reductionist,
    mechanistic, and militarized approach.

    - It promotes the health of soil, plants, animals, and human beings.

    - It enhances the ecological integrity of food production through the Law of Return.

    - It conserves biodiversity and intensifies biodiversity services such as pollinators,
    rendering agrochemical inputs as pesticides redundant.

    - It maximizes “health per acre” and “nutrition per acre” instead of “yield per
    acre.”

    - It is based on seed freedom, where the control of seeds lies with farmers, instead
    of a system that views seeds as corporate intellectual property.

    - It creates the socioeconomic, political, and cultural context for the exercise
    of food freedom and food sovereignty.

    - It is centered on women''s knowledge of biodiversity, ecosystems, health, and
    nutrition, instead of corporate-controlled and manipulated knowledge based on
    monocultures.

    - It is based on a sense of place and gives priority to the local, instead of
    the unfair privilege given to global corporations.


    Agroecology is a very real alternative to the broken, violent paradigm of industrial
    chemical agriculture. As we will see in the following chapters, it is the methods
    and practices developed by agroecology that really feed the world. Where industrial
    agriculture destroys biodiversity, ecological agriculture conserves and rejuvenates
    diverse species. Where industrial agriculture depletes and pollutes water, organic
    farming conserves water by increasing the water-holding capacity of soils by recycling
    organic matter.

    '
  mdcn: '

    政府可能认为从维持生活的资源中提取资金资助战争是合理的。GDP（国内总值）对农业是有害的，因为它产生了一种虚假的想法：如果你生产了你消耗的东西，你就没有生产。因此，过去你拥有自然和女性作为食物生产者，而现在，商品——即创造经济利润的物品——被计为生产。


    通过这种人为强加的经济，社会被简化为商品的生产者和消费者，而不是食物的种植者和食用者。自然对生态产品和服务的生产，以及社会维持自然和提供生存的能力，首先在人们脑海中被抹除，随后在真实的生态系统和局部经济中消失。这种数百年来为土壤和社会提供营养和养的知识，是生态破坏的基础，并导致了全球范围内的贫困和饥饿。


    还原论经济范式的构建赋予了资本和公司神秘色彩，使其被视为带给我们食物的创造力量。通过让自然、女性和小农户所做的生产变得隐形，食物经济中唯一变得可见的部分是受企业控制的部分。基于多样性的系统被单一种作物栽培取代，后者产生的营养较少，但商品更多。农民变得依赖购买昂贵的种子和化学品，许多陷入债务陷阱的农民最终走向了自杀。


    在一个维持生命的农业生态系统中，存在三种并存的经济：自然经济、人类经济和市场经济。它们共同构成了可持续性经济。自然经济包括生物多样性、土壤肥力和水资源保护，这些要素共同构成了农业所依赖的生态基础。人类经济是一种生存性经济，社区生产所需的物品并相互照顾。最后，市场经济涉及真实实体（而非公司）之间的交换与互动。


    自然经济和人类经济的可持续性基于“回报法则”（Law of Return）：回馈种子、土壤和社会。种子的回报法则维持了活种子的循环。它包括允许种子在变为新种子的同时也为我们提供食物。它还允许由自然和农民演化出的活种子通过我们所说的“种子自由”在农民之间自由流动。土壤的回报法则包括向土壤归有机物，以更新肥力并维持活土。社会的回报法则包括向生产食物和为我们提供营养的农民支付公平的报酬，让他们能够过上尊严和自由的生活。它包括合作与互助，以及关闭生产与消费之间的循环。最重要的是，它包含了代际之间的回报法则，每一代人都记住从祖先那里接受的馈赠，并为后代留下种子、土壤、知识和文化的遗产。


    在一个可持续的系统中，这三种经济作为一个稳定的金字塔存在。自然经济及其所有丰富的、再生的生存资料，构成了金字塔的基础。自然经济支持人类经济，人类经济则回收和更新其使用的自然资源。金字塔的顶端是基于自然和人类经济的市场经济，由不同社区共享资源、知识和理念的互动组成。


    在还原论、机械论的知识和利润范式下，“可持续性”概念本身正在发生变异。“可持续性”显然有两种不同的含义。真正的含义是指自然和人类的可持续性，它认同自然支持着我们的生活和生计，是生存的首要来源。维持自然意味着维持自然过程、循环和节奏的完整性。


    然而，现在存在第二种“可持续性”，指的是大写字母 M 代表的“市场”（Market）。这种范式仅通过 GDP 衡量市场经济的增长，尽管这种增长与自然和人类经济的破坏和萎缩有关。在这个无所不能的市场中，可持续性意味着确保原材料的供应、商品的流动、资本的积累和投资回报。它无法提供我们因损害自然支持生命的能力而正在失去的生存。全球市场的增长掩盖了国内生产和消费局部经济的破坏。由于工业原材料和市场商品可以相互替代，国内生产和消费局部经济的破坏被掩盖了。


