    Monsanto seeds; he used to buy his seeds from other farmers in what are known
    as grain elevators. As it turns out, some of these seeds were transgenic: they
    had a Monsanto gene in them. Bowman fought the case until 2013 all the way up
    to the Supreme Court, which finally ruled in favor of Monsanto. This ruling describes
    the grain that comes out of the seed as Monsanto''s property, which in effect
    means farmers cannot buy grain from the market and grow a crop from it without
    paying Monsanto.


    Worse still we find the case of Percy Schmeier, a Canadian farmer whose canola
    crop was genetically contaminated by Monsanto''s Roundup Ready. This was discovered
    after Monsanto sent private detectives into his fields, and rather than paying
    the farmer for biological pollution, Monsanto sued Schmeier for $200,000, accusing
    him of “stealing” their property. Schmeier fought Monsanto on the grounds that
    it was corrupted his crops. In 2004 the court ruled in favor of Monsanto, though
    gave Schmeier a partial victory by stating that he did not have to pay the seed
    giant because there was no evidence he had profited from the contamination of
    his crops.


    These two rulings have grave consequences. In the case of Bowman, the court''s
    ruling sets a precedent for Monsanto and others to own future generations of seeds
    (because it is, of course, in the nature of seed to reproduce). In the case of
    Schmeier, the ruling means that companies like Monsanto can use patents to sue
    farmers whose crops it has contaminated. In other words, contamination makes it
    theirs.. Alarmingly, Monsanto also sponsors toll-free “tip line” in North America
    to help farmers whose may be contaminated or who may have purchased seeds from
    a source other than Monsanto. As Hope Stand of the Rural Advancement Foundation
    International says, “Our rural communities are being turned into corporate police
    states, and farmers are being turned into criminals."


    Now the United States is pushing TRIPS onto developing countries on behalf of
    Monsanto, and genetic contamination is spreading. India has lost its native cotton
    because of contamination from Monsanto''s Bt cotton. Mexico, the historical cradle
    of corn, has 80 percent of its corn varieties. These are only two instances of
    the loss of local and national seed heritage. After contamination, as in the case
    of Schmeier, biotech seed corporations use sue farmers for patent infringement.
    Recently, more than eighty groups came together to file a case in the United States
    to prevent Monsanto from suing farmers whose seed had been contaminated.


    The TRIPS clause on patents on life was due for a mandatory review in 1999. In
    its submission, India stated, “Clearly, there is a case for examining the grant
    patents on life forms anywhere in the world. Until such systems are in place,
    it may be advisable to . . . exclude patents on all life forms.”¹


    In a similar vein, the African Group stated the following:


    For plant varieties to be protected under the TRIPS Agreement, the protection
    must clearly, and not just implicitly or by way of exception, strike a good balance
    with the interests of the community as a whole and protect farmers’ rights and
    traditional knowledge, and ensure the preservation of biological diversity.¹


    This mandatory review has been subverted by the United States, which has prevented
    review discussions from taking place.


    Simultaneously, the US government has been threatening countries, including India,
    to change their laws to recognize that Monsanto creates seeds. But create seeds
    itself; all Monsanto does is add a toxic gene. Monsanto should be recognized as
    a pol,, except as examples from across the world have shown, this logic has grossly
    perverted.


    So far, they have not been successful in reversing laws in India. On July 5, 2013,
    the Indian courts denied Monsanto’s attempt to patent the climate-resilient features
    of plants. The courts used Article 3(j) of the Indian Patents Act, which excludes
    from patentability plants and animals in whole or any part thereof other than
    microorganisms including seeds, varieties and species and essentially biological
    processes for production or propagation of plants and animals.


    In other words, the ruling showed that life and its biological processes (re)produce
    themselves and cannot be deemed as manufactured or assembled by an external force.


