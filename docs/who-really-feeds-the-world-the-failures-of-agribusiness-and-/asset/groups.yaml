    exchangeable magnesium, eleven times more potash, and one and one-half metric
    tons more calcium than artificially fertilized soil.


    Synthetic fertilizers use natural gas, so is a highly energy-intensive process.
    One kg of nitrogen fertilizer requires the energy equivalent of two liters of
    diesel. In 2000, the energy consumed while manufacturing fertilizers across the
    world was equivalent to 191 million liters of diesel. This number is projected
    to rise to 277 billion by 2030. While industrial agriculture claims to have reduced
    the amount of labor required, all it has done is replace the hard work of people
    with “energy slaves”—the fossil-fuel equivalent of the work of a human being—and
    increase the ecological footprint of farming.


    Today we are living in the age of “peak oil,” which is M. King Hubert’s term for
    the point at which the planet reaches the highest level of oil production. After
    this, oil production will necessarily decrease. Decreasing production will mean
    increasing prices, and the unprecedented increase in the price of oil since 2008
    is sign of an emerging crisis. As Weinberg put it, “The party’s over"


    Since synthetic nitrogen is based on fossil fuels, prices of fertilizers also
    go up when the price of oil goes up. In India the subsidy for fertilizers was
    Rs. 600 million in 1976–1977. It rose to Rs. 403 billion in 2007–2008, and reached
    Rs. 966 billion—or nearly a trillion—in 2008–2009. These subsidies go to agribusiness,
    not farmers, who in turn deeper into debt'
