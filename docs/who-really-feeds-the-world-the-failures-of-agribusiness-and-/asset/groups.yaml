    iron found in the Indian diet. In fact, because iron absorption increases with
    vitamin C, women’s knowledge has ensured that vitamin C-rich chutneys are eaten
    as a part of the diet. This knowledge is being discounted and erased.¹¹⁸


    The solution to malnutrition lies in growing nutrition, and growing nutrition
    means growing biodiversity. It means recognizing the knowledge of biodiversity
    and nutrition among millions of Indian women who have received it for generations
    as grandmothers’ knowledge. But there is a creation myth that is blind to nature’s
    creativity and biodiversity, and to the creativity, intelligence, and knowledge
    of women. According to this creation myth of patriarchal science, rich and powerful
    men are the “creators.” They can own life through patents and intellectual property.
    They tinker with nature’s complex evolution over millennia and claim that their
    trivial yield destructive acts of gene manipulation “create” life, “create” food,
    and “create” nutrition.


    GMOs for biofication are part of a patriarchal project that renders invisible
    and displaces women’s superior knowledge of biodiversity and nutrition. In the
    case of GM bananas, it is one man—Bill Gates—financing one Australian scientist—Dale—who
    knows one crop—the banana—to impose inefficient and hazardous GM bananas on millions
    of people in India and Uganda, who have grown hundreds of banana varieties for
    thousands of years, in addition to thousands of other crops.


    The answer to malnutrition does not lie in monocultures and a masculine corporate
    domination of our seeds and food. It lies in the biodiversity in our farms and
    gardens, and in the cultural diversity of our food systems: it lies in women’s
    hands and in women’s minds.


    Agricultural systems shaped by women have a number key features: farming is done
    on a small scale, natural resources are conserved and renewed, and there is little
    or no dependence on fossil fuels and chemicals.


    Inputs needed for production, such as fertilizers, are produced on the farm from
    compost, green manures, or nitrogen-fixing crops. Diversity and integration are
    key features, and nutrition is a key consideration. Women on small farms maximize
    nutrition per acre and health per acre, while they conserve resources.


    With food grown for eating, most food is consumed at the household or local level,
    and only some goes to distant places. Women-centered agriculture is the basis
    of food security for rural communities. When the household and the community are
    food secure, female children are food secure. When the household and the community
    are food insecure, it is the female children who pay the highest price in terms
    of malnutrition, because of gender discrimination.


    Women farmers in the Global South are predominantly small-scale farmers. The partnership
    between women and biodiversity has kept the world fed throughout history, and
    will continue to feed the world in the future. It is this partnership that needs
    to be preserved and promoted to ensure food security.


    Agriculture based on diversity, decentralization, and improving small-farm productivity
    through ecological methods is a women-centered, nature-friendly agriculture. In
    this women-centered agriculture, knowledge is shared, other species and plants
    are kin, not “property,” and sustainability is based on the renewal of the Earth’s
    fertility. Women’s farming and knowledge are deeply tied to the emerging scientific
    paradigm of agroecology, where there is no place for monocultures of genetically
    engineered crops or a ruthless economics that seeks to destroy rather than conserve.


    The future of food needs to be reclaimed by women, shaped by women, and democratically
    controlled by women. Only when food is in women’s hands will both food and women
    be secure.


    In 1996 Maria Mies and I initiated the Leipzig Appeal for Food Security in Women’s
    Hands. Women worldwide are resisting the corporate control over food systems and
    creating alternatives to guarantee food security for their communities. Some of
    these are:


    - Localization and regionalization instead of globalization

    - Nonviolence instead of aggressive domination

    - Equity and reciprocity instead of competition

    - Respect for the integrity of nature and her species

    - Understanding humans as part of nature instead of as masters over nature

    - Protection of biodiversity in production and consumption


    Here are some extracts from the text of the appeal:


    For thousands of years women have produced their own food and guaranteed food
    security for their children and communities. Even today, 80 percent of the work
    in local food production in Africa is done by women, in Asia [it is] 50 to 60
    percent and in Latin America [the number is] 30 to 40 percent.


    Our food security is too vital an issue to be left in the hands of a few transnational
    corporations with their profit motives, or up to national governments that increasingly
    lose control over food security decisions, or to a few, mostly male national delegates
    at UN conferences, who take decisions affecting all our lives.


    Food security must remain in women’s hands everywhere! And men must share the
    necessary work, be paid or unpaid. We have a right to know what we eat. . . .
    We will resist those who force us to produce and consume in ways that destroy
    nature and ourselves.¹¹⁹


    ## #9


    ## The Way Forward


    We stand at a watershed in terms of the interconnected future of food, people,
    and the planet.


    If we continue down the path of industrial agriculture, GMOs, toxic chemicals,
    and corporate control, any benefits from them will be illusory. There will be
    an illusion of more food flow through the conversion of farmland to monoculture
    commodity production spaces. There will be an illusion of prosperity with more
    money flow, even though more money will be flowing away from farmers as their
    seed, land, and water are commodified, as their dependence on costly inputs deepens,
    and as their dependence on purchased food grows.


    In the short run, more small-scale farmers who really feed the world will be displaced,
    more people will be hungry and suffer from diseases related to bad food, the deepening
    of the ecological crisis will threaten their very existence, and the erosion of
    food democracy will lead to the emergence of a food dictatorship.


    In the long run, we will create conditions for our extinction as a species.


    As I have written earlier, only 30 percent of the food eaten by people comes from
    large-scale industrial farms; 70 percent comes from small, biodiverse farms. On
    the other hand, 75 percent of the ecological destruction of our soil, water, and
    biodiversity is caused by industrial methods of farming, and 40 percent of the
    climate we see today is caused by industrial generalized agriculture. Ecological
    unraveling is a nonlinear phenomenon, taking place according to an exponential
    curve of rapid change. Even if one assumes it is linear, the time industrial agriculture
    can provide even 40 percent of our food supply, it will have destroyed 100 percent
    of our ecological life-support base. This is a recipe for extinction, not for
    feeding the world.


    Extinction need not be our fate.


    The model of agriculture based on diversity, democracy, and decentralization that
    is already contributing to 70 percent of the food that nourishes people can be
    increased to 100 percent. Through this process, we can heal and rejuvenate the
    planet, bring prosperity to farmers, end agrarian distress and displacement, improve
    people''s health, nutrition, and well-being, increase livelihood opportunities,
    and create more just, resilient economies.


    So how we do we get from here?


    A unsustainable, unhealthy, unjust, and undocratic food system has been designed
    according to the Law of Exploitation by chemical corporations whose origins lie
    in war. But an ecologically sustainable, healthy, socially just, and democratic
    food system aligned with the Law of Return is being advocated for and created
    by citizens everywhere. The specifics vary according to context, but the principles
    of the transition and of the emerging design are commonly shared.


    It this common principles of transition that are the key to making an ecological
    and democratic food system 100 percent reality for all people on the planet. For
    this we need a road map to transition from a corporate-driven and corporate-controlled
    industrialized and globalized to Earth-centered and person-centered paradigm of
    agroecology and food democracy. Here, I will divide this transition process into
    nine steps.


    The first transition is from fiction to reality. We need to move from the fiction
    of corporate personhood to the reality of real people who grow, process, cook,
    and eat real food. From small-scale farmers to gardeners to mothers to children,
    these are real people with real bodies and real minds, who can cocreate and coproduce
    with nature. These are also real people who go hungry when they have no access
    to food and who suffer from diseases like obesity, diabetes, hypertension, cardiovascular
    diseases, and cancers when the food they eat is toxic and junk food.


    Real people are creating real food systems that protect the Earth and serve people.
    Against all odds, people are designing new food systems that are the driving force
