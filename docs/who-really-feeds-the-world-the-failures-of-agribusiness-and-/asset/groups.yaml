    正如我们在第一章看到的，牛顿-笛卡尔式的将自然视为碎片化世界的观点否定了自然的相互关联性，并随后被量子物理学和表观遗传学等新科学科学证明是错误的。


    根据培根的观点，科学知识的学科及其引导的机械发明并“仅仅是对自然的运行过程施加温和的引导；它们拥有征服和镇服她的力量，从根基上动摇她。”在《时间的男性化诞生》（*The
    Masculine Birth of Time*）中，培根承诺创造一个“受祝福的英雄和超人种族”，他们将统治自然和社会。他话语中的性别暴力色彩是不言而喻的：英雄和超人将统治并从根基上动摇自然。


    成立于1660年伦敦的英国皇家学会，被认为是17世纪和18世纪科学革命的重要推动。该学会受到培根哲学的启发，并被其组织者视为一项男性的工程。1664年，其秘书亨利·奥尔登堡（Henry
    Oldenburg）宣布，该学会的意图是“建立一种男性的哲学。借此，人类的心灵可以因认知坚实的真理而升华。”皇家学会另一位成员约瑟夫·格兰维尔（Joseph
    Granville）认为，科学的男性目标是了解“捕捉自然的方法，并让它服从我们的意志，从而实现人类对自然的帝国”。


    科学家罗伯特·波义尔（Robert Boyle）是皇家学会的创始成员和新英格兰公司的董事，他将机械哲学的兴起视为权力的工具：不仅针对自然，也针对美洲的原住民。他明确宣布了自己的意图，要让新英格兰印第人摆弃关于自然运作的“荒谬”观念。他们攻击了当地将自然视为“某种女神”的认知，并辩称“人类对他们所谓的‘自然’所蕴含的崇拜，已成为人类统治上帝之下低等生物帝国的一种令人沮丧的障碍。”


    脑海中自然的死亡导致了一场针对地球的战争爆发。毕竟，如果地球仅仅是死物质，那么没有任何东西可以被杀死。正如女性主义历史学家卡罗琳·墨奇（Carolyn Merchant）指出的，自然从一个活的、滋养的母亲变为惰性的、死亡且可操纵的物质，这种转变极其符合日益增长资本主义的剥削性需求。滋养性的地球形象曾是剥削自然的一种文化制约，正如墨奇所写的，“人们不会轻易杀掉一个母亲，挖开她的内脏或残害她的身体。”但培根计划所创造的主宰和统治形象，以及科学革命的男性冲动，消除了所有的束缚，并当了剥夺自然的文化制裁。


    女性的农业知识演变了五千年。虽然科学革命对这种知识视而不见，但它却摧毁了食物和农业的基础。但现在，在短短二十年的时间内，随着全球公司、基因工程和专利的兴起，对女性知识和生产的直接攻击正在发生。


    全球公司利用男性科学奠定的基础，通过忽视农业生产中的多样性维度，使女性的知识和生产力变得隐形。正如粮农组织（FAO）一份名为《女性养世界》的报告提到的，女性使用的植物多样性（包括栽培和未栽培）远超农业科学家的认知。在尼日利亚的家庭花园中，女性在一个家庭花园里种植了18至57种植物。在哈哈拉以南的非洲，女性在男性管理的作物间隙空间内栽培了多达120种不同的植物。在危地马拉，面积不足0.1公顷的家庭花园种植了十多种树木和作物。


    在非洲的一个单一家庭花园中，统计了超过60种产粮树木。在印度的农业中，女性使用150种不同植物用于蔬菜、饲料和健康护理。在西孟加拉，从稻田采集的124种“杂草”品种被证明对农民具有经济和营养价值。在墨西哥的韦拉克鲁斯（Veracruz），农民利用了约435种动植物品种，其中229种是可以食用的。女性是全球的生物多样性专家。遗憾的是，在隐形和工业农业统治的双重压力下，她们作为食物生产者和生物多样性专家的潜力被剥夺了。


    当女性管理和生产多样性时，占主农业范式却在“单作物产量更高”的错误假设下推崇单一种作物。但单作物并不能产生更多；它们只是将控制权和权力集中在少数公司手中。对女性农业知识的系统性侵蚀违背了女性作为农业专家的地位，由于她们的专业知识与模仿自然再生模式建立农业有关，这种知识的破坏与对自然过程的生态破坏以及对人类生计和生活的毁灭并存。


    父权经济学构建了一个虚拟的生产边界，否定了发生在自然经济和人类生计经济中的生产。对资源和人的剥削被呈现为生产和增长。GDP基于一个错误的假设：如果你消费了你生产的东西，你就没有生产。因此，女性在食物经济中的工作被简化为零，尽管正是她们的工作维持了人们的饮食。


    这种父权经济学使女性作为食物提供者的工作变得隐形，因为女性服务的是家庭而非公司，而且因为女性承担着涉及多种技能的任务。尽管女性对农业有贡献，但她们作为农民一直是隐形的，因为父权经济体系未能将女性的生产计为“工作”，因为这超出了生产边界。这些收集农业工作数据的问题出现，并不是因为工作的女性太少，而是因为工作的种类太多。统计学家和研究人员在概念上无法定义家庭内外的女性工作，而农业通常是两者的结合。这种对什么是劳动、什么不是劳动的缺失，由于女性做的工作量巨大以及她们同时进行多项工作而进一步加剧。工资以金钱支付，但金钱不再仅仅代表支付或支付手段。像农民一样，女性没有“工作”；她们有生计。“资本”（capital）一词的拉丁语根是
    *caput*，意为“头”。金钱作为真人生产真实财富的手段，被表现得像是由公司在生产的。公司剥削者随后操纵“资本”的含义，将自己变成“头”：去统治和剥削人类。今天，随着全球化和跨国公司（TNCs）的出现，所有关于经济的话语都被简化为“外来投资”，正如“资本”一样，“投资”是1%的人躲在后面的概念，用以剥夺99%的人的资源和机会。


    在整合经济学中，罗尼·莱姆（Ronnie Lessem）和亚历山大·谢弗（Alexander Schieffer）反思，如果资本理论的奠父们选择母亲而非单一男性作为理论构建的最小单位，他们就无法以现在的方式制定人类自私性的公理。


    今天，什么是人类正在发生变化。

    '
