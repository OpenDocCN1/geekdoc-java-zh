  - '[PAGE 87]


    intellectual commons. Life-forms have been redefined as “manufactured” and “machines,”
    robbing life of its integrity and self-organization. Traditional knowledge is
    being pirated and patented, and through biopiracy, Western corporations claim
    indigenous biodiversity and farmers’ varieties as their “inventions.” Examples
    of this from India can be seen in the patents on neem, turmeric, and basmati rice.
    To save the sovereignty and rights of farmers, our legal systems must recognize
    the rights of communities and their collective and cumulative innovation in breeding
    diversity, and not merely the rights of corporations.


    Second, patents lead to royalty collection, and royalty collection is extortion
    in the name of technology and improvement. In Brazil, farmers have been fighting
    against seed Monsanto, most recently filing a lawsuit suing the company for more
    than $6 million on the grounds that the company has been collecting royalties
    from farmers. The seeds on which Monsanto has been collecting royalties from what
    are known as “renewal” seed harvests, which means that these seeds have been collected
    from the previous harvest: a practice used for centuries. But because these seeds
    are from Monsanto’s genetically modified plants, Monsanto is demanding that farmers
    pay. Not only are these royalties unfairly enforced, they are pushing farmers
    deeper into debt that they cannot pay back, leaving them flourishing in their
    fields of failed genetically modified crops.


    Third, when genetically engineered crops contaminate neighboring farmers’ fields,
    the “polluter pay” principle is turned on its head. Corporations use patents to
    establish the principle of “polluter gets paid.” This is what happened in the
    case of Percy Schmeier in Canada, as well as to thousands of farmers in the United
    States.


    If the first colonization based on *terra nullius* gave us landlords, who pushed
    two million people to death during the Great Bengal famine of 1943, the new imperialism
    based on *bio nullius* has given us life lords: the biotechnology/seed/chemical
    industry, which has pushed thousands of farmers across the world to suicide.


    In 2003, Lee Kyung Hae, a Korean farmer, took his life at the barricades of the
    people’s protest against the World Trade Organization (WTO), an organization that
    has been instrumental in liberalizing and privatizing seed. As he stabbed himself,
    he carried a banner reading,“WTO Kills Farmers.”'
  - '[PAGE 88]


    Mr. Lee’s suicide was symbolic of the suicides of thousands of farmers across
    the globe as a result of corporate seed control.


    The inability to repay past debt—and therefore to access fresh loans—has been
    widely accepted as the most significant proximate cause of the farmers’ suicides
    that are widespread in different areas in India. Since 1995, 284,000 farmers in
    India have killed themselves due to rising input prices and volatile output prices.
    As governmental support for farmers declined through liberalization, and breeders
    could no longer access credit from public-sector or cooperative banks, they were
    driven into the hands of potentially more exploitative, usurious relationships.
    While institutional credit would have left farmers’ land, farmers were instead
    forced to borrow from either traditional moneylenders or, worse, agents of the
    seed and chemical companies, who would give credit against the farmers’ land.
    And the day the farmer loses the land is the day the farmer commits suicide.


    Farming communities are increasingly losing their family members, who have been
    driven to death by increased costs of seeds, increased debts, and crop failures.
    There have been several cases in which farmers have had to sell their land and
    even their kidneys to pay off their loans. In other cases, their houses or tractors
    have been mortgaged to the loan providers, or they have been arrested when they
    failed to pay back the loans.


    Navdanya has been updating a report Seeds of Suicide since 1997, which shows farmers’
    suicides in India—and across the world—are the result of policies of market freedom.
    Liberalization, privatization, and globalization trends in agriculture have resulted
    in the creation of an unregulated seed market. At the same time, existing rules
    and regulations have either been abandoned or modified to accommodate multinational
    and transnational corporations. Farmers’ seed supply and direct-exchange networks
    have been adversely affected by the proliferation of unregulated seed markets.¹⁴


    For me, every life is equal, whether it is the life of a US citizen or an Indian
    farmer. However, those who justify the deaths of farmers across the globe as the
    collateral damage in improving the economy should consider the fallacy of their
    argument. If the States’ accident and health insurance measure for the value of
    life is applied to the cost of farmers’ suicides to the Indian economy, the figure
    would be 5 percent of the GDP.'
  - '[PAGE 89]


    For the 284,000 farmers’ suicides since 1995, this translates to $1.99 trillion.


    Farmers are the original breeders, farmers’ rights to food and livelihoods are
    a fundamental right to poisons. Yet Monsanto and other companies have created
    a system where those who have been custodians and givers of seed are now criminalized.
    In extreme cases such as in India, they are being pushed to end their lives. Seed,
    which is the source of life, has been appropriated and privatized to cause the
    end of life for farmers. This is genocide.


    Today, the freedom of nature and culture to evolve is under violent and direct
    threat. The worldview of bio nullius unleashes violence and injustice on the Earth,
    on farmers, and on all citizens. We are losing biodiversity and cultural diversity,
    and we are losing nutrition, taste, and quality in our food. Above all, we are
    losing our fundamental freedom to decide what seeds we will sow, who will grow
    our food, and what we will eat. The seed is the first point of attack, but conversely,
    it is also our first line of defense. It is where we begin the fight for seed
    freedom.


    We use the term “seed freedom” to talk about the right of the seed as a living,
    self-organized system that can evolve freely without the threat of extinction,
    genetic contamination, or termination through technologies designed to make seeds
    sterile. Seed freedom is the freedom of bees to pollinate freely, without threat
    of extinction due to poisons. Seed freedom is the freedom of the web of life to
    weave itself in integrity and resilience, fostering interconnectedness and well-being
    for all. Seed freedom is the right of farmers to save, exchange, breed, and seed
    farmers’ varieties—seeds that have been evolved over millennia—without interference
    by the state or by corporations. Seed freedom is the freedom of eaters to access
    to food grown from seeds bred for diversity, taste, quality, and nutrition.


    Seed freedom is the duty to save and exchange native seeds bred by farmers. This
    is also seed sovereignty. For farmers’ varieties to be conserved, used, and bred
    as a commons, this will entail self-organization and self-rule at the level of
    local communities, free from interference by the state or corporations. At national
    and international levels, seed freedom'
  - '[PAGE 90]


    includes the obligation of governments to protect the freedoms of biodiversity
    and people by regulating corporations to prevent them from undermining people’s
    sovereignty through biopacy on the one hand, and threats to biosafety by genetically
    engineered seeds and crops on the other. Seed freedom and seed sovereignty is
    to have the freedom to self-govern at the level of the community, to take care
    of the commons, and to share sustainably and equitably in its fruits. It also
    involves freedom from harm through national and international regulations.


    Seed freedom means regulation by the state of those who can cause harm to others,
    creating the context for the practice of freedom in people’s spaces. This is how
    rapists do not have the freedom to rape, murderers do not have the freedom to
    murder, and polluters do not have the freedom to pollute. Corporations, on the
    other hand, have unprecedented capacities to harm the Earth and its people with
    new technologies like genetic engineering. This must be stopped.


    For me, saving and protecting life on Earth, especially biodiversity and seeds,
    is the highest dharma, or duty. In 1987, when I heard the corporations spell out
    their vision of total control over life through genetic engineering and patents
    on life and seeds, I started Navdanya. Navanya was formed to protect our seed
    diversity and farmers’ rights to save, breed, and exchange seeds freely. For life-forms,
    plants, and seeds are all evolving, self-organized, sovereign beings. They have
    intrinsic worth, value, and standing. Owning life by claiming it to be a corporate
    invention is ethically and legally wrong. Patents on seeds are legally wrong,
    because seeds are not an invention. Patents on seeds are ethically wrong, because
    seeds are life-forms—they are kin members of our Earth Family.


    In 2001, the Agriculture Minister at the time, Shri Chaturanan Mishra, invited
    me to be part of the expert group for drafting a law entitled The Protection of
    Plant Varieties and Farmers’ Rights Act. Within this law we were able to include
    a clause for farmers’ rights, which


    a farmer shall be deemed to be entitled to save, use, sow, resow, exchange, share
    or sell his farm produce including seeds of a variety protected under this Act
    in the same manner as he was entitled before the coming into force of this Act.'
- md: '

    Resistance to unjust seed laws through the Seed Satyagraha is one aspect of seed
    freedom. Saving and sharing seeds is another aspect. That is why Navdayana has
    worked with local communities to reclaim seed diversity and seed as a commons,
    by establishing more than one hundred community seed banks. Across the world,
    communities are saving and exchanging seeds in diverse ways, appropriate to their
    contexts. They are creating and re-creating freedom—for the seed, for seed keepers,
    and for all life.


    In 2012, climate movements and scientists across the world put together a participatory
    report, sparking a global Seed Freedom Movement. The organizations and movements
    coming together in this initiative include Shumei International, Kopopelli (France),
    Slow Food International, ETC Group, GRAIN (International), Nayakrishhi (Bangladesh),
    African Centre for Biosafety, African Biodiversity Network, IFOAM (International
    Federation of Organic Agriculture Movements), Grupo de Refusión Rural (Argentina),
    Center for Food Safety (United States), OSGATA (Organic Seed Growers and Trade
    Association, United States), Perennia (Canada), No Patents on Seeds, Arche Noah
    (Austria), Associazione Donne in Campo (Italy), Fondation Danielle Mitterrand
    (France), and Red Semillas Libres (Chile).


    The movement brings together activists, scientists, and citizens to respond to
    the seed emergency by alerting people and governments to how precarious seed supply
    has become. Since its inception, the movement has already reached more than five
    million people in various countries in a bid to reclaim seeds as a commons and
    protect the biodiversity of our planet. The Seed Freedom Movement is a small seed
    we hope will multiply and reproduce without seed, no farmer, and no citizen is
    bonded, colonized or enslaved. The stories of seed freedom are stories of courageous
    and creative individuals and organizations that are challenging unjust laws.


    Across the world, various seed movements are defending the freedom of seeds, farmers,
    and citizens. In India, a Bija Satyagraha stopped the introduction of a seed law
    in 2004 that would have made farmers'' seeds illegal. In Europe, when the European
    Commission tried to introduce a seed law that would have criticized biodiversity
    and local seed varieties, the Seed Freedom Movement worked with the European Parliament,
    and the law was sent back to the European Commission. In Colombia, farmers took
    to the streets to stop a seed law that would make their seeds illegal.


    traveled across Africa in 2014 to support the indigenous movements for seed sovereignty
    and food sovereignty.


    In every country there is a contest between people’s movements for seed freedom
    and the corporate push for seed dictatorship. Food democracy rests on seed freedom.
    Seed dictatorship is the foundation for food dictatorship. During the Vietnam
    War, Henry Kissinger said, “Food is a weapon.” Today, seed has become the ultimate
    weapon in a war against the Earth and her people. In this war, if corporations
    win, we will lose all our food and our future.


    Seed freedom has become an ecological, political, economic, and cultural imperative.
    If we do not respond, or if we have a fragmented and weak response, species will
    irreversibly disappear. Agriculture, including the food and cultural spectrum
    dependent on biodiversity, will disappear. Small-scale farmers will disappear,
    healthy food diversity will disappear, seed sovereignty will disappear, and food
    sovereignty will disappear.


    On the other hand, if we speak and act strongly in one voice in defense of seed
    freedom, we can put the obscenity, violence, injustice, and immorality of patents
    on seeds and life behind us. In another era, slavery was made history. Just as
    today corporations see nothing wrong in owning life, slave owners saw nothing
    wrong in owning other humans. Just as people questioned and challenged slavery,
    it is our ethical and ecological duty and right to challenge patents on seeds.
    We have a duty to liberate the seed and our farmers. We have a duty to defend
    our freedom and protect open source seeds as a commons. We have the duty and the
    right to defend life on Earth.


    # 7

    # Localization Feeds the World, Not Globalization


    Two principles have shaped the evolution of food systems across the world. The
    first is that everyone must eat. The second is that every place where human beings
    lives food. From the Arctic to the rainforest to the desert, each place has a
    different ecosystem, and hence a different food system, but there will be food
    wherever people are. Between these two principles, the food systems that have
    evolved to nourish people are, by their nature, local. These systems of food production
    nourish both biological and cultural diversity. The localization of food is not
    only natural but vital, because it allows farmers to practice the Law of Return,
    produce more food through biodiversity, create food systems adapted to local cultures
    and ecologies, and nourish themselves, their communities, and the soil that they
    give back to.


    Over the last twenty years, the globalization of food and agricultural systems
    have been presented as a natural and inevitable phenomenon. However, there is
    nothing natural about globalization, and in particular, the globalization of food.


    The first wave of globalization began in the seventeenth century and was driven
    by Europe, which sought to control the spice trade from India. This is what led
    to the establishment of the East India Company and the signing of the first “free
    trade agreement” between the East India Company and the collapsing Mughal Empire.
    The East India Company traded in spices, not staple foods. In fact, until the
    establishment of the World Trade Organization in 1995, food was a subject of local
    and national sovereignty, not of global trade.


    The rules of global trade have been written by corporations in order to expand
    their control over food and agriculture, and thus increase their profits. The
    idea that free trade is based on competition is a myth. It led to monopolies,
    with just five giants controlling seed—Monsanto, Syngenta, DuPont, Bayer, and
    Dow—five grain giants controlling grain supply—Cargill, ADM (Archer Daniels Midland),
    Bunge, Glencore International, and Louis Dreyfus—five processing giants controlling
    food and beverage—PepsiCo, JBS, Tyson Foods, Danone, and Nestlé—and five retail
    giants controlling food retail—Walmart, Carrefour, Metro Group, Aeon, and Tesco.


    Globalization was imposed with the argument that it would do two things for food.
    First, that it would increase food production, under the theory that corporations
    are better at producing large amounts than small groups of people are. And second,
    that it would make food cheaper and therefore more accessible for the poor. Both
    these claims are lies. As far as food production goes, we’ve already seen how
    the “myth of more” produces less through monocultures, large farms, and poisons.
    In fact, globalization doesn’t produce food; it produces commodities. Ninety percent
    of the corn and soy in the world is used for biofuel or animal feed, because that’s
    where the largest profits lie. Commodities don’t feed people; they create hunger.


    As far as “cheap food” goes, globalized food is actually produced at a very high
    cost, and if it weren''t for the fact that agribusinesses collect more than $400
    billion in subsidies in rich countries, the entire system would collapse. Input
    costs—including fertilizers, pesticides, and machinery—are always higher than
    the value of what is traded, and without these subsidies, the system of generalized,
    mechanized food production would not work. These subsidized commodities are then
    in sold to poor countries, which are forced to dismantle their border protections
    that rich nations “dump” cheap commodities into the developing world. To add to
    this, volatile global prices resulting from financial speculation further entrench
    a system that takes from farmers and gives to corporations and governments.


    Globalization is implemented through neoliberal economic “reform” policies, which
    deregulate both domestic and international commerce,

