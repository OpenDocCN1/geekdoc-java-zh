    Due to the high levels of subsidies in the Global North, the removal of protective
    barriers transmits distorted price signals to domestic markets, which in turn
    pushes prices downward below survival levels. This also creates an imbalance in
    supply and demand, and as we explore toward the end of the chapter, begins to
    aggressively reshape what people can access.


    The policies of trade liberalization go over and above dumping. These policies—the
    pillars of liberalization—have undermined the government’s role in ensuring food
    security for people and livelihood security for farmers. Advocates of trade liberalization
    call governmental measures meant to aid people “trade distorting” and demand that
    these be scrapped. In this way, when farmers and local producers are being put
    out of business by large quantities of imported goods, governments are unable
    to step in and help.


    At the same time, rather than encourage community initiatives, trade liberalization
    has encouraged policies that give agribusiness increasing control over the food
    production and distribution system through programs such as “privatization,”market
    access,” and the removal of quantitative restrictions on imports. An obvious example
    of the policy shift from people-centered concerns to trade- and corporation-centered
    concerns is the fact that farmers are not allowed by law to take their produce
    beyond borders, whereas traders can pick up produce from anywhere and take it
    anywhere. In fact, governments (after forcibly taking away from farmers and communities)
    are building superways to connect centers of agricultural production to airports
    and ports, so that corporations can quickly transport these commodities for export.


    Whereas countries were once exporters, they have now become importers. In other
    words, they have moved from food-independent, self-sufficient economies to food-dependent
    economies. India, for example, is one of the largest vegetable oil economies in
    the world, and ranks first in the world’s production of castor, safflower, sesame,
    and niger oil. In the span of a decade from 1985 to 1996, oilseed production more
    than doubled, and India achieved self-sufficiency. From 1990 to 1991, India exported
    Rs. 10,310 million of oilseeds. From 1991 to 1992, this went up to Rs. 16,500
    million. However, with the introduction of trade liberalization and the dismantling
    of import barriers in 1998, India went from being a net exporter'
  - '[PAGE 98]


    to a net importer of edible oils. By 2001, India was importing $133 million of
    edible oils; and by 2003, the import bill had jumped to $940.6 million, which
    accounts for 63.5 percent of our agri-imports.


    In 1992, Indonesian farmers produced enough soy to supply the entire domestic
    market. Soy-based tofu and tempeh are important parts of the daily diet across
    the archipelago. Following the implementation of a neoliberal doctrine, the country
    opened its borders to food imports, allowing cheap US (in other words, heavily
    subsidized US soy) to flood the market. This destroyed national production, and
    today 60 percent of the soy consumed in Indonesia is imported. Record prices for
    US soy in 2007 led to a national crisis in Indonesia, when the price of tofu and
    tofu—known as the “meat of the poor”—doubled in just a few weeks.


    According to the FAO, the food deficit in West Africa increased by 81 percent
    between 1995 and 2004. During the same period, cereal imports increased by 102
    percent, sugar imports by 83 percent, dairy products by 152 percent, and poultry
    by 500 percent. However, according to the International Fund for Agricultural
    Development (2007), the region has the potential to produce sufficient amounts
    of food. All across the world, liberalization goes on, even though it is increasing
    countries'' vulnerabilities.


    The proponents of globalization depict trade liberalization as a policy intended
    to benefit all parties, and one that countries in the Global South have voluntarily
    signed up for it. In reality, large companies and rich nations have put pressure
    on poorer countries to deregulate trade and open their markets to cheap imports.


    The systems of industrial agriculture pushed by globalization pretend to be more
    efficient than organic small-scale farms by manipulating the definition of “yield”
    to include just one part of crop. This is not real efficiency but only pseudoefficiency.
    In order to justify the industrial production of food and the policies of globalization
    and trade liberalization as the best framework in which to produce food, pseudosurplus
    and pseudocompetition are added to the existing framework of pseudoefficiency.'
- md: '

    The globalization of agriculture is the corporate control of agriculture. The
    1995 WTO Agreement on Agriculture is an international treaty that forces countries
    to liberalize exports and imports, and allows global corporations to take control
    of domestic production, domestic markets, and global trade. The links between
    the treaty and the corporate sector are startlingly clear, since it was former
    Cargill Vice President Dan Amstutz who drafted its original text. The supply of
    grain across the world is almost entirely controlled by a handful of privately
    owned corporations: Cargill, Continental, ConAgra, Louis Dreyfus, Bunge, Gac,
    Mitsui/Cook, and Archer Daniels Midland. Cargill recently bought Continental,
    making it the largest grain giant.


    These grain giants are both the architects and the beneficiaries of the globalization
    of agriculture. They control agriculture and food production from seed to table
    and from farm to factory. They control the farmers'' buy and the markets in which
    farmers sell their produce. Crucially, they determine the price at which farmers
    sell what they have grown. In the short run, they lower prices to capture markets.
    In the long run, such monopoly leads to high food prices.


    As farmers are forced to spend ever-increasing amounts on inputs while receiving
    less for their produce, food production has been transformed into a negative economy
    the world over. Low farm prices are usually explained as the result of surpluses
    and overproduction. In reality, prices are linked to monocultures and monopolies.
    When all farmers grow only one commodity, there will of course a surplus of one
    product. But this is a surplus, not a real surplus. It is not the surplus left
    after nature’s needs for ecological maintenance have been met, or a farm family’s
    needs for food and sustenance have been satisfied.


    Industrial agriculture means that all the natural functions that biodiversity
    could perform for the farmer now have to be purchased. The same agribusiness corporations
    who sell external inputs to farmers also buy the farmers’ produce. In India, where
    government support to farmers has been decreasing rapidly due to trade liberalization
    policies, the price of potatoes has fallen to Rs. 0.40 per kg. This allows large
    companies, such as PepsiCo and McDonald’s, to pay farmers less than Rs. 0.08 to
    make potato chips they sell for Rs. 10 per 200 g. For thirteen million metric
    tons of potatoes, this amounts to a transfer of Rs. 20 billion from impoverished
    farmers and peasants to global multinational companies.¹. In Germany, farmers
    have seen the farmgate price of milk drop by 20–30 percent, pushing them into
    bankruptcy, because supermarkets use cheap dairy products as a marketing tool
    to attract consumers.


    Low prices are not a result of higher production. In fact, prices are falling
    in spite of lower production, countering all commonly held supply and demand theories.
    Collapsing prices have more to do with the concentration of control with excess
    supply. Farm prices are low because they are being “fixed” by corporate monopolies.
    Corporate giants can determine prices because farmers are locked into dependency
    for buying inputs and selling produce. For agribusiness, high production costs
    and low commodity prices translate into two-way profits. For the farmer, they
    translate into a negative economy and spiraling debt.


    In this corporate-controlled system, the idea of “competition” is as false as
    the idea of “surplus,” “free market.” Neoliberal policies suggest that a capitalist
    system of production encourages competition between companies and individuals,
    which results in the best and cheapest goods and services being made available
    to consumers. This is far from the truth. First, given that there are only a few
    companies who control nearly all the world’s global food production, the competition
    is between agribusinesses that are more than happy to scratch each other’s backs
    at the expense of small-scale farmers and common people.


    Second, the very measure of “competitiveness” in the global free trade calculus
    is both fictitious and abstract, whereas the calculation is based on a comparison
    between the international price and the domestic price of a commodity. A paper
    from the Indian Ministry of Agriculture reads:


    "India is hard pressed to remove Quantitative Restrictions on imports... In view
    of this, it is urgently needed that Indian farmers prepare themselves to face
    international competition. . . Results based on the analysis of export competitiveness
    reveal that crops like rice, banana, grapes, sapota, lychees, onions, tomatoes
    and mushrooms are highly competitive. Crops like mangoes and potatoes are moderately
    competitive. The vulnerable section comprising competitive or not competitive
    crops includes maize, sorghum, soybean, oil palm, pulses, coconut, clove, spices,
    jute and several other crops.¹²"


    The problem with competitiveness is here that it completely fails to take into
    account climate, ecology, local economies, and people’s needs. When international
    prices are controlled by two or three corporations that also control the market
    for external inputs, prices can be fixed at extremely low levels. Governments
    in the Global North give massive subsidies to industrial farms and exporters,
    and just enough support to farmers to allow them to survive in negative agricultural
    economies. When then they heavily subsidized commodities are dumped into the Global
    South, it is termed “competitiveness”. Farmers in poorer countries who are producing
    food that people actually eat are then seen as unable to keep up with the “competition,”
    and the destruction of farmers'' livelihoods is presented by the proponents of
    globalization as inevitable.


    Prices are not only artificially lowered, but also artificially raised. In many
    countries, large supermarkets have gained a near-monopoly power and are increasing
    prices far more than is justified by any actual price increase of the agricultural
    product. To add to this, international financial speculation has played a major
    role in food price increases since the summer of 2007. Due to the financial collapse
    in the United States, speculators moved from financial products to raw materials,
    which included agricultural products. This directly affects prices in domestic
    markets, because as we have seen, many countries are becoming increasingly dependent
    on food imports. Speculators bet on expected scarcity, while production levels
    remain high. Based on these predictions, TNCs (transnational companies) keep huge
    profits. In Indonesia, in January 2008, the company Cargill was still keeping
    13,000 metric tons of soybeans in its warehouse. This creates hunger when there
    is actually food to feed everyone. As Kaufman writes, “Imaginary wheat bought
    anywhere affects real wheat bought everywhere.”³


    Unlike speculators and large traders, most peasants and farmers do not benefit
    from higher prices. If food comes from domestic producers, companies and other
    intermediaries that buy products from farmers and sell them at higher prices reap
    the benefits. If products come from the international market, it’s even clearer
    who the beneficiaries are: transnational companies TNCs define what prices are
    bought at. In sectors with increasing production costs, such as dairy and meat,
    farmers see their prices going down while prices for the consumer are shooting
    up. This is because, as we have seen, farmers sell their produce at an extremely
    low price compared to what consumers pay. In Europe, the Spanish Coordinator of
    Farmers and Ranchers (COAG) calculated that consumers in Spain pay up to 600 percent
    more than what the food producer gets for his or her. Similar figures also exist
    for other countries where the consumer price is defined mainly by costs for processing,
    transportation, and retailing.


    Farmers, landless laborers, and consumers have all hit hard by the crisis in food
    prices and food security. Agricultural workers as well as many people in rural
    areas now have to buy food, as they do not have access to land to produce their
    own. Some peasants and small-scale farmers may have land, but are forced to produce
    cash crops instead of food. These crops are less profitable. For example, the
    increase of the price of edible oils in Indonesia since 2007 has not benefited
    the palm oil farmers at all. Many of them are working under contract farming agreements
    with agribusiness companies that process, refine, and sell the product. These
    companies increased domestic prices following the international price hike, but
    farmers themselves received only a minor price increase. The contract farming
    model creates a situation in which farmers cannot produce food for their families.
    Instead, they are forced to produce cash crops in monocultures such as sugarcane,
    milk oil, coffee, tea, and cacao. This means that even if the farmer receives
    a minor increase for her cash crop, she has to buy much more expensive food from
    the market to feed her family. In this way, increasing prices actually cause more
    in farming families.

