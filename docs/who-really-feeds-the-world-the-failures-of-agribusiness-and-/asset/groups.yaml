    一种机械化的、暴力的范式塑造了围绕知识、科学、技术以及粮食农业政策的主流观点。事实上，一个破坏自然经济（粮食生产赖以生存的生态基础）的食物系统是无法养世界的。一个旨在取代小农户（他们是真正农业的社会基础）的农业系统也无法养世界。工业农业的每一个方面都在撕裂脆弱的生命网，并破坏着粮食安全的基石。


    工业农业正在杀灭授粉者和益虫。爱因斯坦在其超越时代的远见中警告道：“蜜蜂消失时，人类也将消失。”如今，在过去的三十年里，由于有毒农药的影响，某些地区75%的蜜蜂数量被杀灭。化学农药杀灭了益虫，取而代之的是制造了害虫。合成肥料通过杀死自然产生活土的生物来破坏土壤，反过来又导致了土壤侵失和土壤退化。


    工业农业正在开采和污染水资源。地球上70%的水资源正因化学密集型工业农业所需的密集灌溉而枯竭和污染。来自工业农场水中的硝酸盐正在海洋中制造“死区”：即没有任何生命存在的空间。


    工业农业主要是由化石燃料驱动的农业。在一种将人视为原材料或农业投入的逻辑下，用化石燃料取代人类被粉装得更具效率。但化石燃料的财务和生态成本是天文数字。在美国农业中，每个工人的背后都隐藏着超过250个隐藏的“能量奴隶”。能量奴隶是人的化石燃料对应物，如果我们考虑到粮食生产和消费系统的化石燃料强度，显而易见，工业农业消耗的比生产的多。正如阿莫里·洛文斯（Amory
    Lovins）指出的：“从劳动力角度来看，地球人口不是40亿，而是大约2000亿，关键点在于其中约98%的人不吃传统食物。”那是因为他们不是人；他们是能量奴隶，吃的是油。工业农业投入十单位的化石燃料能量，只产出一个单位的食物。浪费的能量导致了大气污染并使我们的气候变得不稳定。


    农业的工业范式正在导致气候变化。导致气候变化的所有温室气体排放的40%来自基于化石燃料的全球农业系统。用于制造肥料、运行农机以及将食物浪费地跨越全球数千公里的化石燃料导致了二氧化碳排放。化学氮肥释放氧化亚二，其对气候的不稳定性影响是二氧化碳的300%。此外，工厂化养殖是甲烷的主要来源，另一种导致全球变暖的毒素。1995年，联合国计算出工业农业已导致超过75%的农业生物多样性（农业发现的生物多样性）灭绝。今天，这个数字可能已经达到了90%。


    矛盾的是，虽然这种对自然资本的生态破坏从“养人”的角度来看合理的，但饥饿问题却加剧了。有一亿人处于永久饥饿状态，另有十亿人遭受肥胖等与食物相关的疾病的困扰。这些情况是硬币的两面：营养危机。随着食物麦当化将加工垃圾食品传遍全球，即使是那些能吃饱肚子的人，也很少获得他们所需的营养。与大众认知相反，肥胖并不是因为人们吃得太多：往往是发展中国家的贫困人口承担了最严酷的饮食相关疾病。此外，与工业饮食相关的疾病以及食物中的毒素（包括癌症）正在稳步增长。商品并不养活人；食物才是。


    尽管企业化的工业农业系统制造了饥饿，尽管它使用了地球75%的资源却仅对食物系统贡献了25%，尽管它是生态破坏的主导力量，是对粮食生产所依赖的自然系统的破坏者，但“工业农业养活世界”的神话仍在延续。这一神话建立在一个过时的范式基础之上，而事实上，这种范式已经被科学所抛弃。将自然视为死物质以及可以被人类操纵之物的错误观念，让我们认为向食物系统投入越多的毒素，长出的食物就越多。一个生态上具有破坏性且营养效率低下的食物系统已成为我们脑海中的主流范式，成为土地上最受推崇的实践，尽管实际上，与自然过程合作的小型生物多样性农场生产了我们吃的大部分食物。


    工业农业对多样性缺乏包容。多样性具有滋养和天然抵抗力，但为了增加利润，工业农业使作物依赖化学肥料、农药、除草剂和转基因种子等外部投入。工业农业看起来越来越像针对行星的化学战争，食物的分配也看起来像战争，所谓的“自由贸易”协约让农民与农民、国家与国家之间陷入永恒的“竞争”和冲突。自由贸易允许公司和投资者夺取每一个种子、每一滴水和每一寸土地；无限制地剥削地球、农民和所有公民。这种模式将利润视为终点，完全不考虑土壤、生产者和人类健康。企业不生产食物；它们生产利润。


    工业范式用操纵取代了真理，用虚构取代了现实。第一个虚构是“公司即人”的虚构。在这种人格的掩护下，公司编写生产和贸易规则以实现利润最大化并剥削生物。第二个虚构是“资本”——而非自然的生态过程以及农民辛勤且聪明的劳动——创造了财富和食物。人和自然被简化为单纯的投入。第三个虚构是，投入大于产出的系统是高效且高产的。这通过隐藏财务成本和投入被操纵着。第四个虚构是对公司有利的对地球也有好处。第五个虚构是食物是商品。现实是，食物越被转化成商品，从穷人身上夺取的就越多，质量也越退化。


    我们在这里讨论的不是一个食物系统——它陷入了冲突并被当作垃圾丢弃。结果是生态灾难、贫困和饥饿。食物的未来取决于记住生命网是一个食物网。这本书致力于这种记忆，因为遗忘食物的生态学是导致饥荒的药方。在过去的三十年里，我意识到我们目前的食物系统是破碎的。1984年，我开始在旁遮普研究“绿色革命”。绿色革命是对一种基于化学物质的农业模式的误导性命名，该模式于1965年引入印度。二战后，化学公司和工厂急切地为合成肥料和战争期间的工厂寻找新市场。当地作物品种拒绝了人工肥料，因此植物被重新设计成矮生品种，以便它们吸收并成为化学品的载体。到20世纪60年代中期，这种新的种子/化学品包准备好以“绿色革命”的名义出口到全球南方国家。


    绿色革命所延续的虚假叙事，对于理解围绕粮食和农业创造的主流叙事至关重要。这种叙事将绿色革命归功让印度脱离了饥饿，项目的首席科学家诺曼·鲍尔格（Norman
    Borlaug）因此在1970年荣得了诺贝尔和平奖。但1965年的印度并没有饥荒。由于全国性干旱，城市粮食价格上涨，该国需要进口粮食。但在促进农业中使用化学品的的政策下，美国政府和世界银行设定了一个条件：只有在印度进口种子和化学品的情况下，粮食才会送到印度。

