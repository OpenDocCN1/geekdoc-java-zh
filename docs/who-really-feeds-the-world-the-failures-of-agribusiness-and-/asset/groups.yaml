    尽管旁遮普邦的绿色革命留下了沙漠化的土壤、枯竭的含水层、消失的生物多样性、债台累的农民，以及一个将农药相关癌症受害者运往拉贾斯坦进行免费治疗的“癌症火车”，但这种不可持续的模式正在向印度东部国家和非洲出口。比尔·盖斯凭借数十亿美元的资金，正通过“非洲绿色革命联盟”极其成功地向非洲推销化学品和商业种子。事实上，所有通过G8国家政策路线的援助，都是在民主化地向非洲强加一种失败的模式。遗憾的是，旁遮普邦绿色革命的真正教训，只有那些随之毁灭的人才学到。


    今天，第二次绿色革命正在进行：一场由转基因生物（GMOs）驱动的革命。GMO，即转基因生物，是经过工程引入毒素的工程作物。与最初的绿色革命一样，GMO声称要“养饱世界”。但现实是，GMO并没有增加产量，它们导致了化学品使用的增加，并且无法控制杂草和害虫。基因工程在我们星球上创造了一种全新的污染类型，对植物、动物、人类健康以及农民和当地社区的生计产生了负面影响。基因农物的唯一受益者是公司，因为他们销售了更多有毒化学品，并对种子收取专利费。事实上，公司的贪婪和对拥有种子的欲望，是GMO被民主化地推向全球食品和农业系统的唯一原因。


    但某些东西正在发生变化。1984年在旁遮普邦爆发的愤怒正在处处爆发——无论是在埃及的街头（阿拉伯之春始于反对面包价格上涨的抗议），还是在叙利亚（冲突始于农民因严重干旱导致歉收而寻求救援的抗议），亦或是各行各业的数百万加入“反对孟山德游行”，抗议公司对我们种植和食用食物的控制。处处都存在着不满，因为由少数公司控制的主导性工业化和全球化食品系统正在破坏地球、农民的生计、人类健康、民主和和平。面对这些，重新设计食品系统已成为生存的必要选择。


