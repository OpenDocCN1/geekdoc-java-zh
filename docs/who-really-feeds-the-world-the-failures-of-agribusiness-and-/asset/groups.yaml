    # 3

    ## 蜜蜂和蝴蝶喂养世界，而非毒药和农药


    > 消灭害虫是逃避而非解决所有农业问题。

    > —阿尔伯特·霍华德爵士（SIR ALBERT HOWARD）


    蜜蜂、蝴蝶、昆虫和鸟类在花与花之间传播花粉，使植物授粉并繁殖。没有授粉者，大多数植物无法繁殖；没有植物的繁殖，我们的食物供应将受到威胁。种子的循环，无论是森林中的树木还是构成我们食物的作物，都依赖于授粉循环。


    生态生物多样性系统不仅保护了我们我们的蜜蜂和授粉者，还通过自然的害虫/捕食者平衡来控制害虫。它们支持了大量的天敌，防止了害虫数量的爆发。另一方面，工业化单一种经营为害虫提供了盛宴，因为没有生物多样性来提供控虫的生态功能。


    在知识和农业的最初范式中，控虫是一个战争。正如一本害虫管理教材所述：“与害虫的战争是一场持久战，人们必须战斗以确保生存。害虫（尤其是昆虫）是我们地球上主要的竞争对手。”


    五十多年前，瑞切尔·卡森（Rachel Carson）写了《寂静的春天》，这是对后代的早期预警。她对周围的世界提出了质疑：


    有一种奇异的寂静。例如鸟类——它们去到哪儿了？随处看到的几只鸟都是垂死的；它们剧烈地颤抖，无法飞行……在农场里，母鸡在孵化，但没有小鸡出生……苹果树开了花，但花丛间没有蜜蜂的嗡嗡声，因此没有授粉，也不会有果实……这是一个没有声音的春天。


    卡森这本如今已标志性的著作探讨了化学品和农药的危害生态后果，警告说那些让春光之声沉默的致命化学品也不会放过人类。今天，她的警告已变成广泛的现实，我们的食品系统里到处都是毒素。


    在过去的四十年里，我们见证了源自化学战争的农药使用量剧增。农药不仅对生态系统和友好授粉者具有破坏性，对我们的健康也是如此。因为农药公司不仅对生态系统和友好授粉者具有破坏性，对我们的健康也是如此。因为农药公司不仅对生态系统和友好授粉者具有破坏性，对我们的健康也是如此。因为农药公司不仅对生态系统和友好授粉者具有破坏性，对我们的健康也是如此……（注：原文此段落存在大量OCR识别错误导致的重复，译文已根据逻辑进行了去重处理）

