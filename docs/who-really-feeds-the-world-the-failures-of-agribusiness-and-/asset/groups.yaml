    profits, and as the rich diversity of food cultures is being replaced by monocultures
    of junk food, the human mind is also being reduced to a monoculture. Monocultures
    of the Mind, rooted in a reductionist, mechanistic paradigm, create a blindness
    to the diversity of the world. Based on mechanistic thought, these monocultures
    are blind to the evolutionary potential and intelligence of cells, ecosystems,
    and communities. They are blind to the ecological functioning arising from the
    relationships and cooperation between diverse living components of an agroecosystem.
    And in a vicious cycle of uniformity, these Monocultures of the Mind once again
    perpetuate monocultures on the land.


    A mechanistic paradigm of industrial agriculture converts diversity by focusing
    on external inputs of chemicals as well as on uniform monoculture commodities
    as outputs. We have been falsely led to believe that chemical-intensive monocultures
    produce more food and are the answer to hunger and food insecurity. The same mechanized
    thinking promotes the idea that by intensifying monocultures through inputs of
    toxic chemicals, fossil fuels, and capital, biodiversity will be conserved because
    less land will be used. This is false.


    Chemical-intensive monocultures produce less food per acre than biodiverse, ecological
    farms when all outputs are taken into account. Monocultures displace diversity
    on a farm, and according to the UN International Technical Conference for Plant
    Genetic Resources in Leipzig, Germany, in 1995, 75 percent of all agro-biodiversity
    has been displaced because of industrial monocultures in agriculture. We can safely
    assume that this percentage has only grown.


    Industrial agriculture is based on external inputs of chemical pesticides as well
    as GMO products with pesticides built into them, which will kill beneficial species
    and undermine food production. These chemicals come from war. And through industrial
    agriculture, they continue the war. The false productivity of industrial agriculture
    has been manipulated at every level by ignoring the contributions of the biodiversity
    of plants, soil organisms, and pollinators to agriculture and food production.
    Through a mechanistic, reductionist framework, a myth has been created that without
    chemical monocultures we will have no food, and that biodiverse, organic farming
    is more expensive and a luxury for the wealthy.'
