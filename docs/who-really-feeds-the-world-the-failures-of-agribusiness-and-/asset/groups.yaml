    on land that had been left barren by a eucalyptus plantation. Eucalyptus planting
    on farmland was promoted by the World Bank associal forestry,” but there was nothing
    social about it. Eucalyptus was selected only because it could be sold as raw
    material for the paper and pulp industry. It can be harvested in cycles of six
    years, and needs no active care before it is sold for pulping. It does, however,
    have huge water demands and leaves the soil barren because it does not return
