    # #9


    # ## The Way Forward


    We stand at a watershed in terms of the interconnected future of food, people,
    and the planet.


    If we continue down the path of industrial agriculture, GMOs, toxic chemicals,
    and corporate control, any benefits from them will be illusory. There will be
    an illusion of more food flow through the conversion of farmland to monoculture
    commodity production spaces. There will be an illusion of prosperity with more
    money flow, even though more money will be flowing away from farmers as their
    seed, land, and water are commodified, as their dependence on costly inputs deepens,
    and as their dependence on purchased food grows.


    In the short run, more small-scale farmers who really feed the world will be displaced,
    more people will be hungry and suffer from diseases related to bad food, the deepening
    of the ecological crisis will threaten their very existence, and the erosion of
    food democracy will lead to the emergence of a food dictatorship.


    In the long run, we will create conditions for our extinction as a species.


    As I have written earlier, only 30 percent of the food eaten by people comes from
    large-scale industrial farms; 70 percent comes from small, biodiverse farms. On
    the other hand, 75 percent of the ecological destruction of our soil, water, and
    biodiversity is caused by industrial methods of farming, and 40 percent of the
    climate we see today is caused by industrial generalized agriculture. Ecological
    unraveling is a nonlinear phenomenon, taking place according to an exponential
    curve of rapid change. Even if one assumes it is linear, the time industrial agriculture
    can provide even 40 percent of our food supply, it will have destroyed 100 percent
    of our ecological life-support base. This is a recipe for extinction, not for
    feeding the world.


    Extinction need not be our fate.'
  - '[PAGE 131]


    The model of agriculture based on diversity, democracy, and decentralization that
    is already contributing to 70 percent of the food that nourishes people can be
    increased to 100 percent. Through this process, we can heal and rejuvenate the
    planet, bring prosperity to farmers and the countryside, end agrarian distress
    and displacement, improve people''s health, nutrition, and well-being, increase
    livelihood opportunities, and create more just, robust, and resilient economies.


    So how we do we get from here?


    A unsustainable, unhealthy, unjust, and undocratic food system has been designed
    according to the Law of Exploitation by chemical corporations whose origins lie
    in war. But an ecologically sustainable, healthy, socially just, honest, and democratic
    food system aligned with the Law of Return is being advocated for and created
    by citizens everywhere. The specifics vary according to context, but the principles
    of the transition and of the emerging design are commonly shared.


    It this common principles of transition that are the key to making an ecological
    and democratic food system 100 percent reality for all people on the planet. For
    this we need a road map to transition from a corporate-driven and corporate-controlled
    industrialized and globalized to to Earth-centered and person-centered paradigm
    of agroecology and food democracy. Here, I will divide this transition process
    into nine steps.


    The first transition is from fiction to reality. We need to move from the fiction
    of corporate personhood to the reality of real people who grow, process, cook,
    and eat real food. From small-scale farmers to gardeners to mothers to children,
    these are real people with real bodies and real minds, who can cocreate and coproduce
    with nature. These are also real people who go hungry when they have no access
    to food and who suffer from diseases like obesity, diabetes, hypertension, cardiovascular
    diseases, and cancers when the food they eat is toxic and junk food.


    Real people are creating real food systems that protect the Earth and serve people.
    Against all odds, people are designing new food systems that are the driving force
    behind this transition. Farming and gardening are becoming new revolutions. Whereas
    the rise of industrial agriculture was based on the removal of people from the
    land, the emergence of the new agriculture paradigm is based on returning to the
    dirt, to the Earth, and to the soil: in cities and in schools, on terraces and
    on walls. There is no'
- md: '

    person who cannot grow food, and part of being fully human is reconnecting to
    the Earth and its communities.


    The second transition is from mechanistic, reductionist science to agroecological
    science based on relationships and interconnectedness. It is the recognition that
    soil, seed, water, farmers, and our bodies are intelligent beings, not dead matter
    or machines. An expertise based on the violence of war is not relevant for evolving
    this intelligence, and it is not relevant to feeding people or to rejuvenating
    the planet. This intelligence is in the soil and in the seed; it is in the plants
    and in the animals; it is in our hands and our bodies. The old universities teaching
    chemical warfare as agricultural expertise are replaced by farms as schools, where
    the knowledge of real farming to produce real food is growing. A transition away
    from the rule of corporations and profits is also a knowledge transition toward
    the emerging scientific paradigm of agroecology.


    The third transition is from seed as the “intellectual property” of corporations
    to seed as living, diverse, and evolving: seed as the commons is the source of
    food and the source of life. The creation of community seed banks and seed libraries
    is part of the movements for seed freedom that are resisting the imposition of
    unscientific and unjust seed laws based on uniformity. Also part of this resistance
    are the scientific movements innovating with participatory and evolutionary breeding,
    which are offering successful and superior alternatives to industrial breeding.


    The fourth transition is from chemical intensification to biodiversity intensification
    and ecological intensification, from monocultures to diversity. We must make the
    transition from chemicals and toxins as the main input into agriculture to chemical-free,
    agroecological systems. The evidence that ecological systems produce more food
    and nutrition is growing. Chemicals have no place in farming and our food. This
    transition must also move away from the fiction of “high yield” to the reality
    of diverse systems outputs, including quantity, quality, taste, health, and nutrition.
    Not only are biodiverse agricultural systems more productive and resilient, biodiverse
    food systems are the best insurance against diseases linked to nutritional deficiencies.
    For example, the Indian science of Ayurveda demonstrates that all food should
    have six tastes, which ensures both diversity and health.


    The fifth transition is from pseudoproductivity to real productivity. The reduction
    of living nature and creative people to “land,” “labor,” and more inputs into
    the industrial system is a system of pseudoproductivity based on the Law of Exploitation.
    Rejuvenating natural resources and creating meaningful work and sustainable livelihoods
    are objectives and outputs of good farming, and cannot be reduced to inputs. In
    the pseudoproductivity calculus, the logic is to minimize labor input to make
    productivity increase. This means displacing farmers. In a real productivity calculus—one
    that is based on the real, not on the abstract—creative work is maximized as an
    output to increase productivity. Real productivity must materialize all social,
    health, and ecological costs of chemical-, capital-, and fossil-fuel-intensive
    industrial agriculture, as well as the benefits of ecological agriculture for
    public health, social cohesion, and ecological sustainability. A real productivity
    calculus recognizes farmers'' rights. In an ecological and living world, farmers
    are not just producers of food; they are conservators and builders of biodiversity
    and a stable climate, they are providers of health, and they are the custodians
    of our diverse collective cultures.


    The most significant transition in our times is to decommodify and liberate land
    and labor, and focus on the living intelligence of nature, with her diversity
    and potential for creating abundance. We must also shift the focus to creative,
    intelligent, hardworking people who have rights to their land, their seed, their
    knowledge, creative work, and the fruits of their creative work through the Law
    of Return. This transition is being shaped by diverse movements working for the
    recognition of Mother Earth''s rights, as well as the rights of all human beings
    to participate intelligently and democratically in the food web.


    The sixth transition is from fake food to real food, from food that destroys our
    bodies and minds. This is also a transition from food as a commodity produced
    for profits to food as the most important source of health and well-being. The
    entire food and agricultural system treats food as a commodity to be produced,
    processed, and traded solely to maximize corporate profits. The highest value
    of food is in providing health and nourishment, and the primary contribution of
    food is to public health, not corporate profits. Commodities are based on quantity
    alone, irrespective of whether they are nutritionally empty or full of toxins
    and poisons. Food as a tradable commodity loses its value of nourishment.


    Really challenging the dominant food system involves nurturing the capacity to
    grow real, diverse food, creating innovative systems to distribute fresh and healthy
    food locally, and cultivating awareness about the difference between real food
    and fake food. This involves the right to know what you are eating, the right
    to choose ecologically sustainable, healthy, and safe food, and as a society the
    right to institutions for research and regulation that are independent of industry.
    Since the threat to the right to safe food comes from unjust and undemocratic
    laws, nonoperation with such laws through a Satyagraha—a fight for truth—becomes
    an ethical and a political imperative. This is what we did in Navdayna through
    Sarson (Mustard) Satyagraha when our cold-pressed edible oils, including mustard
    oil, were banned so that markets could be flooded through dumping with GMO soy
    oil. Because of our actions and movements, cold-pressed mustard oil was not banned.
    The movement for chemical-free and GMO-free food that has exploded in recent times
    is based on people making a choice for health and safety. There is a new politics
    of food safety emerging as citizens rise up against poisons in our food and against
    the imposition of GMOs.


