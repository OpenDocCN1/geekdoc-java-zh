    The paradigm shift we propose is a shift from monocultures to diversity; from
    chemical-intensive agriculture to ecologically intensive agriculture; from external
    inputs to internal inputs; from capital-intensive production to low- or zero-cost
    production; from yield per acre to health and nutrition per acre; and from food
