    # 关于作者


    ![](img/d377abfe23cacc1609fc293418c31758_172_0.png)


    摄影：Kartikey Shiva


    万达纳·希瓦（VANDANA SHIVA）是一位物理学家、世界著名的环保思想家和活动家，也是经济、粮食和性别正义的不懈斗士。她是许多影响性著作的作者和编辑，包括《与地球和解》、《地球民主学》、《土壤而非石油》、《被盗的收成》、《水战争》以及《全球化的新战争》。希瓦博士曾获得二十多项国际奖，其中包括正义生活奖（1993年）、约翰·列侬-小野洋子和平奖（2008年）、悉尼和平奖（2010年）以及卡尔加里和平奖（加拿大，2011年）。此外，她还是世界未来理事会的成员，以及全球化国际论坛的领导人和董事成员。她经常前往世界各地进行演讲。


