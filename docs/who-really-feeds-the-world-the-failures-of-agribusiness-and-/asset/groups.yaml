    Agriculture being a life process, in actual practice, under given conditions,
    yields per acre decline as the size of farm increases (in other words, the application
    of human labour and supervision per acre decreases). The above results are well-nih
    universal: output per acre of investment is higher on small farms than on large
    farms. Thus, if a crowded, capital-scarce country like India has a choice between
    a single 100 acre farm and 2.5 acre farms, the capital cost to the national economy
    will be less if the country chooses the small farms.


    Small farms produce more food than large industrial farms because small-scale
    farmers give more care to the soil, plants, and animals, and they intensify biodiversity,
    not external chemical inputs. Farms increase in size, they replace labor with
    fossil fuels for farm machinery, the caring work of farmers with toxic chemicals,
    and the intelligence of nature and farmers with careless technologies.


    However, when profit is the name of the (food) game, it is the small farms and
    small-scale farmers who are being destroyed by globalization and trade-driven
    economic reforms. Five million peasants'' livelihoods have disappeared in India
    since agricultural “reforms” were introduced. And in fifteen years, 284,000 farmers
    have committed suicide because of the unsustainability of capital- and chemical-intensive
    farming based on nonrenewable seeds.


    Today, it is time to break the “myth of more” and give credit where it is due:
    not to global agribusiness, but to small-scale farmers across the world, who,
    despite all the threats they face, put food on our tables.


    Small is big when it comes to food. In spite of all subsidies going to large farms,
    and in spite of all the governmental policies that promote industrial agriculture,
    today 70 percent of the world’s food comes from small farms, according to the
    UN Food and Agriculture Organization (FAO). If we add kitchen gardens and urban
    gardens, it becomes clear that most food that'
  - '[PAGE 72]


    people eat is grown on a small scale. What is growing on large farms is not food;
    it is commodities. For example, only 10 percent of the corn and soy taking over
    world agriculture is eaten. Ninety percent goes to drive cars as biofuel, or to
    feed animals being tortured in factory farms.


    Under the Law of Exploitation fostered by a reductive, militaristic knowledge
    and science paradigm, food is produced in linear chains, which hide ecological
    nonsustainability and social injustice. The common corporate language is one of
    values. The food web is converted into food chains, and cycles that renew and
    rejuvenate are now converted into linear flows of exploitation. When the value
    returned to the farmer is reduced to grow corporate profits, it is called value
    added. When industrial processing takes away nutrition and quality from food,
    it is called value added. In the food chain, value removed is presented as value
    added.


    The Law of Return, on the other hand, is based on cycles that exist in a web of
    relationships. This web gives back to the Earth, society, and to farmers. While
    food chains are used to justify exploitation and violence, food webs are the basis
    of sustainability and justice. Food chains are controlled by corporate greed,
    while food webs are sustained by small farms and small-scale farmers. This can
    be seen across the world.


    Peasants and small-scale farmers, especially women, account for more half of Russia''s
    agricultural production, but occupy only a quarter of the agricultural lands.
    In Ukraine, small-scale farmers produce 55 percent of the country''s agricultural
    output on only 16 percent of the land, while in Kazakhstan, where they occupy
    half the land, they account for 73 percent of agricultural production. The fact
    is that these countries are fed by the peasants and by their small-scale farmers.
    And this is true the world over. Wherever official data is available, including
    for the European Union, Colombia, and Brazil, or where studies have been undertaken,
    including countries in Asia, Africa, and Latin America, peasant farming is shown
    to be more efficient than large-scale agribusiness.


    Take for instance, some of these examples:


    +   * In Papua New Guinea, as many as five thousand varieties of sweet potato
    are cultivated, with more than twenty varieties grown in a single garden.'
  - '[PAGE 73]


    +   - In Java, small-scale farmers cultivate 607 species in their gardens, with
    an overall species diversity comparable to that in a deciduous tropical forest.

    - A single home garden in Thailand has more than 230 species.

    - In eastern Nigeria, home gardens occupying only 2 percent of a household''s
    farmland account for half of the farm''s total output.

    - Home gardens in Indonesia are estimated to provide more than 20 percent of household
    income and 40 percent of domestic food supplies.


    The central argument used for the industrialization of food and the corporatization
    of agriculture is the low productivity of the small-scale farmer. Surely these
    families and farmers, on their little plots of land, are capable of meeting the
    world''s need for food?


    The UNCTAD (United Nations Conference on Development)''s 2013 Trade and Environment
    Review shows that monoculture and industrial farming methods are not providing
    sufficient, affordable food when it is needed, while causing mounting and unsustainable
    environmental damage. It goes to state that farming in rich and poor nations alike
    should shift from large-scale, chemical, globalized monocultures toward greater
    varieties of crops, a reduced use of fertilizers and other inputs, greater support
    for small-scale farmers, and more locally focused production and consumption of
    food. Similarly, the FAO''s analysis shows that small farms can be thousands of
    times more productive than large farms.


    An ILO (International Labour Organization) report shows that small-scale agriculture
    is the solution to the ecological crisis, the food crisis, and the crisis of work
    and employment. The report cites examples of how small farms in Africa have increased
    food production through ecological agriculture. A project involving one thousand
    farmers in South Nyanza, Kenya, who are cultivating two hectares each on average,
    showed that their crop yields rose by 2–4 metric tons per hectare after an initial
    conversion to organic farming. In another case, the incomes of thirty thousand
    smallholders in Thika, Kenya, rose by 50 percent within three years. The International
    Assessment of Agricultural Knowledge, Science and Technology for Development has
    also confirmed that small ecological'
