    We need food everywhere, and everywhere food will be different. Food in the Arctic
    will be different from food in a desert, with regions with high rainfall. Food
    in temperate regions will be different from food in tropical climates. To have
    food grown everywhere, there must be a transition from the resource- and energy-intensive,
    large-scale industrial agriculture model to ecologically adapted, small-scale,
    diverse systems. This adaptation and evolution, especially in response to climate
    change, will be vital to any sustainable food system in the future.'
  - '[PAGE 135]


    A frequently used argument is that we need large-scale industrial farms because
    more people are living in cities. This argument can be countered in three ways.
    First, large-scale farms are not producing food; they are producing commodities.
    Commodities do not feed people. Second, every city should have its own “foodshed”
    that supplies most of its food needs in the same way that cities have “watersheds”
    that supply its water. Larger cities can have larger feeders. Planning for food
    needs, as well as integrating the city and the countryside through good food,
    should be part of urban planning. Third, the new food and agricultural movement
    is exploding in cities. Urban communities are reclaiming the food system through
    urban gardens, community gardens, school gardens, and gardens on terraces and
    balconies and walls. No place is too small to nourish a plant that can nourish
    us.


    We are also told that more globalization and more corporate control over the food
    system is the solution to rising food prices and food inflation. This is false.
    A safe, affordable, diverse, and sustainable food system requires a transition
    from globalization to localization. The last two decades have seen the imposition
    of a globalized food system shaped and controlled by corporations with only one
    objective: profits. The Earth and her people have lost everywhere. The ecological
    crisis has deepened, and public health has worsened. Farmers are in distress.
    Localization, on the other hand, is the trend being shaped by movements for food
    democracy. Localization is expressed through urban gardens, farmers’ markets,
    zero kilometer initiatives, and community-supported agriculture (CSA) initiatives,
    where people in cities can buy food directly from farmers. Local means diversity,
    freshness, safety, and taste. It means support for local farmers and means rejuvenation
    of local economies. It means deeper connections between food producers and eaters,
    and it means cultivating not just food, but community. Localization taking back
    our food through food democracy.


    The eighth transition is from false, manipulated, and fictitious prices based
    on the Law of Exploitation to real and just prices based on the Law of Return.
    In rich countries, citizens are questioning “cheap” food and what an overconsumption
    of this food means for people’s health. In poor countries, there are riots and
    protests and changes in regimes of rising prices of food linked to free market
    policies. The Egyptian “Arab Spring,” for example, started because of the rising
    prices of bread. Both the “cheap” food in rich countries and the rising costs
    of food in poor countries'
- md: '

    are based on a food system that puts profits above the rights of people to healthy,
    safe, and affordable food. This is based on the manipulation of prices by corporate
    giants and financial institutions through subsidies in rich countries, financial
    speculation, and betting on agriculture. Fair trade initiatives, on the other
    hand, allow farmers to get a fair and just return for their contributions to health
    and planetary care.


    The price of anything should reflect its true cost and true benefits: the high
    costs of ecological degradation and damage to people’s health in the case of chemical-intensive
    industrial agriculture, and the positive contributions of ecological agriculture
    to rejuvenating the soil, conserving biodiversity and water, mitigating climate
    change, and providing healthy, nutritious food.


    We need to decommodify food and return it to its dignity. We must also return
    the dignity of the poorest to have the right to food. The value of food is in
    the nourishment, culture, and justice that it embodies. The true value and true
    price of food need not to be based on a global consensus. The Law of Return, through
    a food democracy that reasserts the centrality of good, healthy, and affordable
    food to the life and health of every species on the planet.


    ## The ninth transition is from the false idea of competition to the reality of
    cooperation. The entire edifice of industrial production, free trade, and globalization
    is based on competition as a virtue, as an essential human trait. Plants are put
    into competition with one another and with insects, culture are pitted against
    one another and against consumers, and every country is in competition with every
    other country through chasing investment performance and trade wars. Competition
    creates a downward spiral from the perspective of the planet and people, and an
    upward spike for corporate profits. But the ultimate consequence of competition
    is collapse.


    The reality of the web of life is cooperation: from the tiniest cell and microorganism
    to the largest mammal. Cooperation between diverse species increases food production
    and controls pests and weeds. Cooperation between people creates communities and
    living economies that maximize human welfare, including livelihoods, and minimize
    industry’s profits. Cooperative systems are based on the Law of Return. They create
    sustainability, justice, and peace. In times of collapse, cooperation is a survival
    imperative.


    These transitions are not a false utopia; they are actually taking place across
    the world. And emerging from the broken food system and the broken political system
    is a new living food system based on living seed, living soil, living food, and
    living farmers. For us, this transition process has lived through the Navdanya
    movement for the last thirty years.


    At Navdanya, we are the change we want to see in the world. Diversity, self-organization,
    cooperation, and the Law of Return have guided our work at every level. Diversity
