    through which multinationals acquired control over seeds and hence over the entire
    food system. The Green Revolution commercialized and privatized seeds, removing
    control of plant genetic resources from peasant women in the Global South. This
    control was in turn given to male technocrats in international research centers
    run by the World Bank—such as the CIMMYT and IRRI—and to multinational corporations.


    Women have acted as the custodians of genetic heritage for centuries. In a study
    of rural women in Nepal, it was found that seed selection is primarily a female
    responsibility. In 60.4 percent of the examples in the study, women alone decided
    what type of seed to use, while men decided in only 20.7 percent of the examples.
    In cases where families use their own seeds, the decision is made by women alone
    81.2 percent of the time.¹⁵'
