    As we have seen, globalization generates hunger and malnutrition. But the other
    side of this industrially processed food coin is obesity and other diet-related
    health conditions. In countries like the United States, the epidemic of obesity
    is highly visible, and can be linked to patterns in what investigative journalist
    Eric Schlosser has famously called “Fast Food Nation.” An Indiana University study
    finds that between 1976 and 1980, there was a sharp incline in the number of Americans
    who went from “overweight” to “obese.” This increase, is linked to the percentage
    of fat and sugar being consumed by Americans (USDA data shows that between 1970
    and 2003, fat consumption in the United States increased by 63 percent and sugar
    consumption by 19 percent), but to the types of sugar and fat being consumed.


    Take sugar. In the 1970s, technology was developed to turn cornstarch into glucose.
    This eventually became HFCS, or high fructose corn syrup. Aided by the government’s
    subsidization of the corn industry, HFCS became the most cost-effective replacement
    for sugar. As globalization, large-scale farming, and industrially processed food
    became the dominant means of food production in the United States, the consumption
    of HFCS increased more than 1,000 percent between 1970 and 1990. American Society
    for Clinical Nutrition data from 2004 demonstrates that due to the difference
    in digestion, absorption, and metabolism between sucrose (normal sugar) and fructose
    (which makes up HFCS), the increase in HFCS consumption can be temporally linked
    to the obesity epidemic in the United States.³⁶'
