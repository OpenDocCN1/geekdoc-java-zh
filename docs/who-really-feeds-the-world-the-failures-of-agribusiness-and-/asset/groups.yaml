    deficit can be made up by the use of non-renewable inputs of phosphorus, potash,
    and nitrates as chemical fertilizers. Under the industrial paradigm of agriculture,
    the nutrient cycle—in which nutrients are produced by soil through plants and
    returned to the soil as organic matter—has been replaced by linear, non-renewable
    flows of phosphorus and potash from geological deposits, and nitrogen derived
    from petroleum.¹¹⁷


