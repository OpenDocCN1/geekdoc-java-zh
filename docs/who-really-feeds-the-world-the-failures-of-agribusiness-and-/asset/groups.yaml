    are not just producers of food; they are conservators and builders of biodiversity
    and a stable climate, they are providers of health, and they are the custodians
    of our diverse collective cultures.


    The most significant transition in our times is to decommodify and liberate land
    and labor, and focus on the living intelligence of nature, with her diversity
    and potential for creating abundance. We must also shift the focus to creative,
    intelligent, hardworking people who have rights to their land, their seed, their
    knowledge, creative work, and the fruits of their creative work through the Law
    of Return. This transition is being shaped by diverse movements working for the
    recognition of Mother Earth''s rights, as well as the rights of all human beings
    to participate intelligently and democratically in the food web.


    The sixth transition is from fake food to real food, from food that destroys our
    bodies and minds. This is also a transition from food as a commodity produced
    for profits to food as the most important source of health and well-being. The
    entire food and agricultural system treats food as a commodity to be produced,
    processed, and traded solely to maximize corporate profits. The highest value
    of food is in providing health and nourishment, and the primary contribution of
    food is to public health, not corporate profits. Commodities are based on quantity
    alone, irrespective of whether they are nutritionally empty or full of toxins
    and poisons. Food as a tradable commodity loses its value of nourishment.


    Really challenging the dominant food system involves nurturing the capacity to
    grow real, diverse food, creating innovative systems to distribute fresh and healthy
    food locally, and cultivating awareness about the difference between real food
    and fake food. This involves the right to know what you are eating, the right
    to choose ecologically sustainable, healthy, and safe food, and as a society the
    right to institutions for research and regulation that are independent of industry.
    Since the threat to the right to safe food comes from unjust and undemocratic
    laws, nonoperation with such laws through a Satyagraha—a fight for truth—becomes
    an ethical and a political imperative. This is what we did in Navdayna through
    Sarson (Mustard) Satyagraha when our cold-pressed edible oils, including mustard
    oil, were banned so that markets could be flooded through dumping with GMO soy
    oil. Because of our actions and movements, cold-pressed mustard oil was not banned.
    The movement for chemical-free and GMO-free food that has exploded in recent times
    is based on people making a choice for health and safety. There is a new politics
    of food safety emerging as citizens rise up against poisons in our food and against
    the imposition of GMOs.


    The seventh transition is from the obsession with “big” to a nurturing of “small,”
    from the global to the local. Large-scale, long-distance food chains in an industrialized,
    globalized food system must become a small-scale, short-distance food web based
    on the ecological enlightenment that no place is small to produce food. Everyone
