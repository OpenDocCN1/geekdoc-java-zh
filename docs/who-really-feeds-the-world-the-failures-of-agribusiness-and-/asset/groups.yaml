  - '[PAGE 111]


    Climate change today is global in cause and global in effect: trade liberalization
    and corporate globalization are causing climate change in several ways. Most significantly,
    resource- and energy-intensive polluting industries are moving to countries in
    the Global South. In 1991 the World Bank''s chief economist Lawrence Summers wrote
    a memo to senior World Bank staff in which he said, "Just between you and me,
    we shouldn''t the World Bank be encouraging more migration of the dirty industries
    to the LDCs [less developed countries]"^42


    Summers justified the economic logic of increasing pollution in the Global South
    on three grounds. First, since wages are low in the Global South, the economic
    costs of pollution arising from increased illness and death are lowest in the
    poorest countries. Second, since many countries in the Global South still have
    low pollution rates, according to Summers it makes economic sense to introduce
    pollution. And third, he argues that the poor are poor, they cannot possibly worry
    about environmental problems.


    Today, this mercenary logic is being put into practice, and in India, for example,
    we are seeing an explosion of steel, aluminum, and sponge iron production; automobile
    manufacture; and petrochemical industries, all of which lead to increased CO2
    emissions.


    As local economies and production are destroyed, more carbon dioxide is being
    added to the atmosphere to meet the same human needs. This is because the production,
    transportation, refrigeration, and packaging of global food commodities require
    more fossil fuels. We are also seeing the destruction of local economies and local
    production, and as a result, more carbon dioxide is being added to the atmosphere
    to meet the same human needs. Through these processes, the burden of global industrial
    production is now falling on poorer countries, and, in a distorted paradigm, the
    pollution caused by these industries is being presented as proof of development.


    Another way in which globalization is causing climate change is through food miles.
    Food miles are the distance food travels from where it is produced to where it
    is consumed. A study by the Danish Ministry of the Environment showed that 1 kg
    of food moving across the world generates'
  - '[PAGE 112]


    10 kg of carbon dioxide. A study in Canada calculated that in 2003, food in Toronto
    traveled an average of 3,333 miles. In the United Kingdom, the distance traveled
    by food increased by 50 percent between 1978 and 1999. And alarmingly, a Swedish
    study found that the food miles of a typical morning breakfast are a distance
    equivalent to the circumference of the Earth.


    Very often, all that globalization achieves is a food swap, which again contributes
    to food miles. Tracy Worcester writes in Resurgence:


    In 1996, Britain exported 111 million litres of milk and imported 173 million
    litres. It imported 49 million kilograms of butter but it exported 47 million.
    Why didn''t it consume its own 47 million kilos and import the shortfall of 2
    million, thus saving all the transportation costs? Why? Because not importing
    and exporting on a grand scale produces no profits for the transnational and their
    transport leets. The food giants fly apples to Britain from 14,000 miles away
    in New Zealand and bring green beans 4,000 miles from Kenya, although British
    farmers can easily grow both.


    Globalization leads to waste at multiple levels, and the FAO estimates that 30
    percent of the global food supply is wasted, totaling $1 trillion of food waste
    each year. Data shows that half the industrialized world''s food is wasted by
    retailers or consumers, while there are growing losses after harvest in the Global
    South.


    Long-distance food chains destroy food at both the level of production and the
    level of distribution. Wastage begins with how food is grown. Industrial agriculture
    is based on monocultures and the destruction of biodiversity; this biodiversity
    is food. A centralized and generalized supply of food promotes uniformity. The
    apple and peach must be the exact shape and size demanded by the retailer, and
    the cabbage and lettuce must be uniform before they can be “counted.” This leads
    to massive waste at the farm level.


    Safe food is a vital component of food security. However, pseudafety standards
    being imposed in the name of “modernization” do not guarantee'
  - '[PAGE 113]


    safe food. Uniformity in the shape and size of fruits and vegetables has nothing
    to do with safety. Using the standards of industrial food processing to shut down
    artisanal production and local processing is a forced replacement of healthy,
    safe, culturally diverse food with unhealthy, processed junk food. It is a waste
    of real food that real people eat.


    The FAO''s Wastage Footprint project shows that in addition to the retail cost
    of food, another $700 billion is wasted in natural resources, including $172 billion
    in wasted water, $42 billion in cleared forest, and $429 billion in greenhouse
    gas costs. Such ecological destruction of natural capital is justified in terms
    of “feeding people.”⁴⁸


    It is a waste to use to drive cars. It is a waste to use 10 kg of grain to produce
    1 kg of meat. A food system that focuses on profits, rather than the health and
    well-being of people or the planet, will not only food, but also people and the
    planet. Indeed, half of India''s children are severely malnourished that they
    are technically described as wasted. And, according to the FAO, the 70 percent
    of food not wasted doused in pesticides costs us $350 billion in health treatment
    every year: a waste of money.⁴⁹


    Subsidies worth $400 billion each year are wasted to keep this system artificially
    afloat. “Cheap” commodities have very high financial, ecological, and social costs.
    Industrial agriculture displaces productive rural families. It creates debts,
    which, alongside mortgages, are the main reason for the disappearance of the family
    farm. In extreme cases, as in the cotton belt of India, such debt has pushed more
    than 284,000 farmers to suicide since 1995.⁵⁰ These are wasted lives.


    > “Freedom” has become such a contested term. When I say “freedom,” I use it to
    refer to people’s freedom to live freely, having livelihoods and vital resources,
    including seed, food, water, and land. I use “freedom” to talk about the freedom
    of the Earth and all beings.


    But corporations also use the word “freedom.” “Free trade” rules are written by
    corporations to enlarge their freedom to commodity and privatize the last inch
    of land, the last drop of water, the last seed, and the last morsel of food. In
    the process, they destroy the freedom of the Earth and the Earth'
  - '[PAGE 114]


    Family, and destroy the freedom of people to enjoy their livelihoods, cultures,
    and democracies.


    We want freedoms for people, We want governments to regulate corporations that
    cause harm, not police citizens through undemocratic seed laws and food laws whose
    only objective is to criminalize citizen freedoms in order to establish corporate
    totalitarianism over seed and food. These freedoms can be attained only when we
    move from big to small, from global to local.


    Navdayanya''s research and practice show that an ecological approach to agriculture
    through localized and decentralized food systems delivers higher benefits in terms
    of food security and food sovereignty than industrial agriculture. Diversity goes
    hand in hand with decentralization, and the creation of decentralized, biodiverse
    food systems is the key to the design of a world without hunger. For this, a shift
    from globalization to localization is vital. Globalization has reduced food to
    a commodity while expanding the control of agribusiness. Localization reclaims
    food as nourishment, expands community control over food systems, and promotes
    food democracy and food sovereignty.


    In a globalized system, agriculture and food systems are shaped and controlled
    by corporations; in a localized system, they are shaped and controlled by communities.
    Whereas globalization is based on chemicals and GMOs that bring profits to corporations,
    localization is based on biodiversity and agroecology, which bring benefits to
    ecosystems and communities. Globalized agriculture views seeds as the intellectual
    property of corporations; localized agriculture views seeds as the common property
    of communities. Globalization creates monopolies of a few commodities; localization
    nourishes the biodiversity of plants, animals, and ecosystems. Food under globalization
    is a commodity; food under localization is a source of nourishment and a human
    right. In a globalized system, commodity speculation drives prices; in a localized
    system, prices are fixed by principles of justice and fairness. A globalized system
    of food has led to one billion hungry people, and another two billion suffering
    from food-related diseases; a localized food system, on the other hand, will see
    the end of hunger and malnutrition, and provide good food for all people. Finally,
    globalization runs on a system of food dictatorship, whereas localization functions
    according to a system of food sovereignty and food democracy.'
- md: '

    We urgently need to design a transition from a globalization paradigm to a localization
    paradigm. This does not mean an end to international trade. But it means prioritizing
    the local. It means the decommodification of food to reclaim food as our being,
    our nourishment, our identity, and our human right. It means getting agriculture
    out of WTO rules and governing it on the principles of food sovereignty. It means
    getting gamblers away from our food before they bring down the food economy they
    brought down the financial economy. It means stopping landlords and the diversion
    of food for the poor into fuel for the cars of the rich. It means remembering
    that everything is food, we are what we eat, and at the biological level, food
    justice is an ecological imperative. As biological beings, we all have equal right
    to the Earth’s resources and to their potential to provide food for all. Seedgrab,
    landgrab, and foodgrab violate the ethical and ecological design of what it means
    to be human. Hunger by design is immoral, unjust, and unsustainable. We are capable
    of making a transition to a better design that is ethical, just, and sustainable.


    How can we make this transition happen? First, countries should give priority
    in their budgets to support the poorest consumers so that they have access to
    sufficient food. Second, countries should give priority to their domestic food
    production in order to become less dependent on the world market. This means an
    increased investment in peasant- and farmer-based food production. We do need
    more intensive food production, but intensive in the use of labor and in the sustainable
    use of natural resources. Diverse production systems have to be developed to integrate
    local foods that have been neglected since the onset of the Green Revolution.
    Small-scale farms can produce a large diversity of food that guarantees both a
    balanced diet and surpluses for the markets. Third, internal market prices have
    to be stabilized at a reasonable level for farmers and consumers—for farmers so
    that they receive prices that cover the cost of production and secure a decent
    income, and for consumers so that they are protected against high food prices.
    Direct sales from peasants and small-scale farmers to consumers have to be encouraged.


    Fourth, in every country an intervention system has to be in place that can stabilize
    market prices. In order to achieve this, import controls with taxes and quotas
    are needed to regulate imports and avoid dumping or low-price imports that undermine
    domestic production. National buffer stocks of food managed by the state have
    to be built up markets; in times of surplus, cereals can be taken from the market
    to build up the cereal stock, and in case of shortage, cereals can be released.


    Finally, to make this happen, land must be distributed equally to the landless
    and to peasant families through genuine agrarian reforms and land reforms. This
    should include control over and access to water, seed, credits, and appropriate
    technology. People should be enabled once again to produce their own food and
    feed their own communities. Any landgrabbing, land evictions, and expansions of
    land allocation for agribusiness-led agriculture have to be stopped.


    Two decades of globalization have left us with an agrarian crisis, a food crisis,
    a disease epidemic, food waste, and a deepening of the ecological crisis. As a
    food system, industrial globalization has failed the planet and humanity. We now
    need to make a transition to systems of production and distribution of food on
    local economies and local food systems. These localized systems bring us real
    and living food, which is part of the web of life. Here, food is produced by real
    farmers who work with living seed and living soil, not by global corporations.
    We need to break away from the rules of agriculture written by global corporations
    and write new rules: ones written by the people, for the people, through a real
    food democracy.


    # 8


    ## Women Feed the World, Not Corporations


    Women, who are the primary growers and providers of food, nutrition, and nourishment
    in societies across the world, have evolved agriculture. Most farmers in the world
    are women, and most girls are future farmers: they learn the skills and knowledge
    of farming in fields and in farms. Women-centered food systems are based on sharing
    and caring, and on conservation and well-being. What is grown on farms determines
    what livelihoods are secured, what is eaten, how much is eaten, and by whom it
    is eaten. Women''s food is diverse and sustaining, and when women control the
    food system, biodiversity experts, nutritional experts, and the economists who
    know how to produce more using less. Women make the most significant contributions
    to food security by producing more than half the world''s food and by providing
    more than 80 percent of the food needs of food-insecure households and regions.


    But corporate globalization driven by a capitalist patriarchy has transformed
    food: what it contains, how it is produced, and how it is distributed. Corporate-controlled
    food is no longer food; it is a commodity manufactured for profit. Food—or what
    corporations call food—can be casually interposed between biofuel for driving
    a car, feed for factory farms, and sustenance for the hungry. Today, a handful
    of corporations control the global food system, food has been displaced and women''s
    knowledge, work, skills, and creativity have been destroyed. The control over
    the entire food chain, from seed to table, is shifting from women''s hands into
    the greedy hands of global corporations, who are today''s global patriarchs.


    Women have vast knowledge of seed, biodiversity, and nutrition. The knowledge
    that governs women''s food is nonmechanistic, nonreductionist, and deeply rooted
    in the principles of agroecology. Women do more work than anyone in growing and
    processing food, and their knowledge of farming is more sophisticated than industries
    and so-called “experts” promoting industrial agriculture. They are smarter at
    providing nutrition through biodiversity than the “miracles” being offered by
    biotechnologists through genetic engineering.


    Yet neither women''s knowledge nor their work is taken into account the structures
    of patriarchal science and patriarchal economics. Patriarchal science is based
    on an artificial construction of a fictitious “creation boundary.” This creation
    erases the creativity and intelligence of nature and women, and renders their
    knowledge invisible. Patriarchal economics, in turn, renders women invisible as
    farmers through the creation of an unjust “production boundary,” where the rules
    of GDP and official “jobs” mean that if you consume what you produce, you do not
    “count” as a producer. Patriarchal economics constructs a boundary that excludes
    women''s work, which is for sustenance, not profiting at the cost of nature and
    people.


    In agriculture—as in other sciences and areas of economic activity—women''s scientific
    and economic contribution has been erased. Women''s work in food and agriculture
    has been made invisible, even though it is the foundation of society. Sustainable
    food systems shaped by women for sustaining their families, communities, biodiversity,
    and the Earth are reduced to zero in this patriarchal productivity calculus and
    the patriarchal scientific calculus.


    Corporations, on the other hand, exist only to make profit. As they enter the
    arenas of seed, food, and agriculture, they destroy the nourishing and sustaining
    qualities of the food system and transform everything into a commodity to be traded
    for profit. Women''s knowledge and work are destroyed, and with it the health
    of the planet and its people is also devastated.


    Industrial agriculture is rooted in a patriarchal scientific paradigm that privileges
    violence, fragmentation, and mechanistic thought. Rooted in ideologies of war,
    this paradigm promotes Monocultures of the Mind and monocultures on our land,
    denying the knowledge of agroecology and of diversity, which is women''s knowledge.
    The implementation of this violent paradigm as the dominant lens for understanding
    our place in the world began with the “fathers of modern science”: Bacon, Newton,
    and Descartes.

