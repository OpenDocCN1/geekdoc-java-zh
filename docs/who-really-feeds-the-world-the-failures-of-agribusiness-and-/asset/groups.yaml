    # About the Author


    ![](img/d377abfe23cacc1609fc293418c31758_172_0.png)


    Photo by Kartikey Shiva


    VANDANA SHIVA is a physicist, a world-renowned environmental thinker and activist,
    and a tireless crusader for economic, food, and gender justice. She is the author
    and editor of many influential books, including Making Peace with the Earth, Earth
    Democracy, Soil Not Oil, Stolen Harvest, Water Wars, and Globalization’s New Wars.
    Dr. Shiva is the recipient of more than twenty international awards, among them
    the Right Livelihood Award (1993); the John Lennon-Yoko Ono Grant for Peace (2008);
    The Sydney Peace Prize (2010); and the Calgary Peace Prize (Canada, 2011). In
    addition, she is a board member of the World Future Council and one of the leaders
    and board members of the International Forum on Globalization. She travels frequently
    to speak at conferences around the world.


