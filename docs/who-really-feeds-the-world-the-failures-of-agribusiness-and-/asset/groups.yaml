    The international policies of the last few decades have expelled hundreds of millions
    of people from farms to urban centers, where most live in slums and eke out precarious
    linings. These urban dwellers are forced to work for very low wages and buy food
    and other goods at exorbitantly high prices. They are the first victims of the
    current crisis, since they have no way to produce their own food. Their number
    has increased dramatically, and they spend a big part of their income on food.
    According to the FAO, food represents up to 60-80 percent of consumer spending
    in developing countries (including landless farmers and agricultural workers).¹⁴


    Even in rich countries of the Global North, hunger has emerged as an emergency.
    In the United States, 14.5 percent of households struggle to get enough food for
    the table. More than 48 million Americans, including 15.9 million children, are
    hungry.¹⁵ In Britain, hunger is becoming a “public health emergency,” according
    to a letter from scientists and doctors to the British Medical Journal. The number
    of cases of malnutrition has soared since the economic crisis began. In 2008,
    3,361 patients were admitted to hospitals in the United Kingdom for malnutrition-related
    diseases; in 2012, the number rose to more than 5,000. In 2006, food banks fed
    26,000 people; in 2012, the number exceeded 347,000.¹⁶


    Through the removal of trade barriers and through the practice of dumping, governments
    are forced to import expensive food to meet consumer demand and do not have the
    means to support the poorest consumers. Companies ruthlessly exploit the current
    situation, accepting that the trade-off for profiteering is that increasing numbers
    of people go hungry.


    Examples from countries across the world illustrate how policies of trade liberalization,
    dumping, and artificially inflated or reduced prices have destroyed food security.
    Here, we will look at two case studies.


    ## KENYA


    Like many African countries in the decades after colonial rule, Kenya received
    large amounts of aid in the form of loans to stabilize its economy.


    In 1980, in return for the aid it was unable to repay, Kenya was forced to liberalize
    its markets through a Structural Adjustment Loan from the World Bank. Under this
    new policy, the Kenyan government reduced support to its farmers, cut tariffs
    on imports, and deregulated its markets. In the early 1990s, Kenya joined the
    WTO, which allowed these policies to be more aggressively pursued. Cheap subsidized
    goods, from clothes to sugar to steel, flooded the country''s markets. Thrown
    into competition with other countries, Kenya''s fledgling industries and vulnerable
    farmers didn''t stand a chance. Worse, the government was prevented from stepping
    in to help as a result of the agreements it had signed with the international
    community.


    The situation in Kenya has steadily worsened, and one of the most obvious impacts
    has been on food production and consumption. For example, the dairy industry was
    decimated by cheaply available powdered milk, and the sugar industry was replaced
    by an influx of cheaper sugar. Other postliberalization countries, Kenya also
    became an exporter of food. Each night, Kenya exports 350 metric tons of cut flowers
    and vegetables to be sold the next day in the United Kingdom. The largest percentage
    of exports to the United Kingdom is legumes vegetables, which include peas, beans,
    and snow peas. In 2008, 1.3 million people in rural areas and nearly 4 million
    people in urban areas of Kenya were food insecure; they were hungry. The World
    Food Programme says that Kenya has a yearly need of $300 million in food aid,
    whereas exporters export more than $3 billion in food products in 2010. The companies
    exporting the food are large, multinational companies not owned by Kenyans.


    Trade liberalization in Kenya has not only destroyed local industries, but worsened
    people''s standard of living. Changes in land ownership—from a commonly owned
    land system to one in which land is now registered under the male head of a family—have
    not only affected the types of food grown through a mass movement toward cash
    crops, but have pushed out the Masai; Kenya''s nomadic tribal communities. Women,
    who make up the majority of food producers in the country, have borne the brunt
    of these changes. Men moved into new industries, leaving women with more responsibility
    for producing food, but with less freedom and space to decide what was being grown:
    land is always in the man''s name.


    women are forced to shift to less nutritious crops that require less labor, or
    to rely on child labor, particularly girls.


    Unemployment, poverty, and hunger have created several nexuses of violence and
    crime. Young adults, who are often poor and uneducated, are recruited by crime
    bosses in Somalia and Kenya to ext money from commercial and private ships in
    the Indian Ocean. There has also been an increase in trafficking in humans, weapons,
    and drugs. A 2001 survey found that between 90 and 95 percent of households in
    northern Kenya were armed.


    These are not accidental or inevitable situations, but a direct consequence of
    the policies of trade liberalization and globalization enforced since the late
    1990s. Consider these figures. Data from 2005 shows that 56 percent of Kenyans
    live in poverty; in 1990, the figure was 48 percent. Data from 2005 shows less
    than 30 percent of Kenyans are in formal employment; in 1988, the number was 70
    percent. Data from 2005 shows that 48 percent of children in Kenya are not vaccinated;
    in 1993, the number was considerably less, at 31 percent. As a consequence of
    liberalization, Kenya has an uneducated generation of young people, mass unemployment,
    and shattered industries that were once self-sustaining. Destroying a country’s
    food security is the first and final step to destroying a country’s well-being,
    and as a government paper read in 2003, “During the past two decades we have seen
    Kenya systematically into the abyss of underdevelopment and hopelessness.


    ## MEXICO


    January 2014 marked the twenty-year anniversary of the day the Mexican government
    signed the North American Free Trade Agreement (NAFTA) together with the United
    States and Canada. Tooted by US president Bill Clinton as an attempt to close
    the wage gap between US and Mexican workers, the thrust of this 1994 “free trade”
    treaty was remove tariffs on products being imported from the United States into
    Mexico. The last twenty years have shown NAFTA to be a key criminal in the systematic
    destruction of the Mexican people’s standard of living, wealth, livelihoods, and
    economies; however, it is still claimed by the champions of liberalism to be a
    success. The only successes, however, have been for US multinational corporations,
    and have been won at the expense of Mexico’s people.


    For more than ten thousand years, Mexican farmers have grown more than 209 varieties
    of maize, or corn. Approximately three million farmers grow maize, two-thirds
    of whom grow enough to feed their families.24 Maize has always been the backbone
    of the Mexican diet. Today, these farmers are in crisis. The most drastic measure
    taken under NAFTA was the liberalization of the maize sector, which was dually
