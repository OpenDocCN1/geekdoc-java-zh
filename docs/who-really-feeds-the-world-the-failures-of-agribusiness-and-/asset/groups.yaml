    are based on a food system that puts profits above the rights of people to healthy,
    safe, and affordable food. This is based on the manipulation of prices by corporate
    giants and financial institutions through subsidies in rich countries, financial
    speculation, and betting on agriculture. Fair trade initiatives, on the other
    hand, allow farmers to get a fair and just return for their contributions to health
    and planetary care.


    The price of anything should reflect its true cost and true benefits: the high
    costs of ecological degradation and damage to people’s health in the case of chemical-intensive
    industrial agriculture, and the positive contributions of ecological agriculture
    to rejuvenating the soil, conserving biodiversity and water, mitigating climate
    change, and providing healthy, nutritious food.


    We need to decommodify food and return it to its dignity. We must also return
    the dignity of the poorest to have the right to food. The value of food is in
    the nourishment, culture, and justice that it embodies. The true value and true
    price of food need not to be based on a global consensus. The Law of Return, through
    a food democracy that reasserts the centrality of good, healthy, and affordable
    food to the life and health of every species on the planet.


    # The ninth transition is from the false idea of competition to the reality of
    cooperation. The entire edifice of industrial production, free trade, and globalization
    is based on competition as a virtue, as an essential human trait. Plants are put
    into competition with one another and with insects, culture are pitted against
    one another and against consumers, and every country is in competition with every
    other country through chasing investment performance and trade wars. Competition
    creates a downward spiral from the perspective of the planet and people, and an
    upward spike for corporate profits. But the ultimate consequence of competition
    is collapse.


    The reality of the web of life is cooperation: from the tiniest cell and microorganism
    to the largest mammal. Cooperation between diverse species increases food production
    and controls pests and weeds. Cooperation between people creates communities and
    living economies that maximize human welfare, including livelihoods, and minimize
    industry’s profits. Cooperative systems are based on the Law of Return. They create'
