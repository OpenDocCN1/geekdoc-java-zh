    Maize lacks the amino acids lysine and tryptophan, which the body needs to make
    proteins and niacin. . . . Beans have both lysine and tryptophan. . . . Squashes,
    for their part, provide an array of vitamins; avocados, fats. The milpa, in the
    estimation of H. Garrison Wilkes, maize researcher at the University of Massachusetts
    in Boston, “is one of the most successful human inventions ever created.”


    In San Felipe el Agua, *milpa* is more than the fields and crops: it is a network
    of families, commerce, and practices, much of which is very old. The *milpa* of
    San Felipe comprises traditional knowledge, handmade tools, the zebu-crossed criollo
    cattle for plowing, burrows, dogs, backyard tortilla factories, kitchen tables,
    meals, and hard work—it is a way of life centered around the maize, and a testament
    to not only biodiversity, but cultural diversity.


    Variations of this organic practice (organic in terms of crops but also in terms
    of being rooted within a community) can be found across cultures. Among some Native
    American tribes, the milpa system takes the name “three sisters,” bringing together
    corn, beans, and squash. By the time European settlers arrived in America in the
    early 1600s, the Iroquois had been growing the three sisters for more than three
    centuries. The vegetable sustained the Native Americans both physically and spiritually;
    in legend, the plants were a gift from the gods, always to be grown together,
    eaten together, and celebrated together.


    Both aspects of the food crisis—the agrarian crisis on the one hand and the malnutrition
    crisis on the other—are related to the fact that food production has become chemical-intensive
    and focused on “yield per acre.” However, yield per acre ignores the loss of nutrition
    that is leading to the malnutrition crisis. So while the Green Revolution led
    to an increase of rice and wheat with chemical-intensive, capital-intensive, and
    water-intensive inputs, it simultaneously displaced pulses, oilseeds, millets,
    greens, vegetables, and fruits from people’s diets. Yield per acre'
- md: '

    is a measure of nothing but profits for agribusiness. Under the paradigm of agroecology,
    what we can measure instead is nutrition per acre.


    Navdanya’s report “Health Per Acre” shows a shift to biodiverse organic farming
    and ecological intensification increases the output of nutrition while reducing
    input costs. For the study, we conducted field experiments in organic farms in
    which farmers grew twelve crops (baranja), nine crops (navdanya), and seven crops
    (saptarshi). In an acre of farmland, organic baranja produced 73.5 percent more
    protein, 3,200 percent more vitamins, 67 percent more minerals, and 186 percent
    more iron than conventional monoculture cropping did. Organic navdanya produced
    355 percent more protein, 5,174 percent more vitamins, 57 percent more minerals,
    and 160 percent more iron than conventional monoculture cropping did, per acre
    of farmland. And finally, organic saptarshi produced 66 percent more protein,
    54 percent more minerals, and 153 percent more iron than conventional monoculture
    cropping.¹ When agricultural output is measured in terms of “health per acre”
    and “nutrition per acre” instead of “yield per acre,” biodiverse, ecological systems
    clearly have a much higher output.


    Given the rapid changes and crises within our food system, there is an urgent
    need to monitor the ecological costs of the globalization of agriculture using
    a biodiversity-based productivity framework to reflect the health of nature’s
    economy and people’s economy. We at Navdanya developed such a framework over the
    past three decades. This framework:


    - provides documentation of the biodiversity status of a farm, including crop,
    tree, and animal biodiversity

    - indicates the contribution of biodiversity to provisioning of internal inputs
    to the building and maintenance of nature’s economy through the conservation of
    soil, water, and biodiversity

    - indicates the contribution of biodiversity to the self-provisioning of food
    needs by agricultural families and communities, and the building and maintenance
    of people’s economy

    - reflects the market economy of the farm in terms of incomes from the sale of
    agricultural produce, as well as the additional costs for external inputs and
    retail food when is lost


    The paradigm shift we propose is a shift from monocultures to diversity; from
    chemical-intensive agriculture to ecologically intensive agriculture; from external
    inputs to internal inputs; from capital-intensive production to low- or zero-cost
    production; from yield per acre to health and nutrition per acre; and from food
    as a commodity to food as nourishment and nutrition. This shift addresses the
    multiple crises related to food systems: falling incomes for farmers, rising costs
    for consumers, and the increasing levels of pollution in our food.


    Biodiverse organic farming leads to increased farm productivity and farm incomes,
    a lowering of costs to consumers through fair trade, and safe and healthy food
    for people and animals through pesticide-free and chemical-free production and
    processing. It shows how we can protect the environment while also protecting
    our farmers and our health. By maximizing health per acre and nurturing biodiversity,
    we can ensure that every human being has access to healthy, nutritious, safe,
    and good food.


    ## 5

    Small-Scale Farmers Feed the World, Not Large-Scale Industrial Farms


    In an age of obsession with gigantism, we live under the illusion that “big is
    best,” that big produces more, that big is more powerful. When it comes to food,
    this translates into the idea that we need big farms and big corporations to feed
    the world. Today, just five corporations control the majority of seed, water,
    and land in the world, and they are growing.


    But the reality is that “small is big”—ecologically, culturally, and economically.


    Despite threats from large companies, local farming communities still produce
    70% of the world’s food. These farming systems have been around for centuries
    and are governed by small-scale farmers and are steeped in diversity. On the one
    hand, they reflect diversity agroclimatic features, and on the other hand, they
    have developed within diversity food cultures. As we have seen, the diversity
    of agricultural systems and the cultural diversity of food systems have coevolved
    in a mutual interplay of nature and culture. Biodiversity and cultural diversity
    go in hand, and small is big culturally, too.


    Economically speaking, it is often falsely assumed that small farms and small-scale
    farmers have low rates of production. But as we have seen, small, biodiverse farms
    are more ecologically efficient than large industrial monocultures. When one recognizes
    that small farms across the world produce greater and more diverse outputs of
    nutritious crops, it becomes clear that industrial breeding has actually reduced
    food security. Industrial farming has created hunger and poverty; yet large industrial
    farms are justified as necessary in order to produce more food.


    The globalization of agriculture has led to the destruction of diverse farming
    systems and the displacement of small-scale farmers worldwide. This in turn has
    led to a destruction of the environment and rural livelihoods, and especially
    farmers’ livelihoods. Our nutritional, environmental, and cultural well-being
    is under threat. And in order to secure a future for ourselves and for all life
    on the planet, we must return to the kernel of truth we began with: small is big,
    and small is beautiful.


    According to the dominant paradigm of industrial agriculture, intensifying chemical
    inputs and energy use is necessary for feeding a growing population because intensification
    of inputs and large farms lead to higher productivity and hence more food. This
    is not true. Productivity is the measure of output per unit of input. In terms
    of resources and energy, the higher the input, the lower the productivity. Since
    industrial agriculture is resource and energy intensive, it has led to a productivity
    decline in terms of ecological efficiency and resource-use efficiency.


    In an ecological and small farming system, output includes the rejuvenation of
    ecological processes, the diverse outputs of crops, livestock, trees, and the
    livelihoods created through cocreation and coproduction. In a large-scale industrial
    system, output is reduced to a single commodity (the part of plant) and input
    is reduced to labor. The intensification of chemicals and fossil fuels is primarily
    aimed at substituting the labor and concentrating ownership of land in corporations.
    When labor is artificially selected as the only input that “counts,” an illusion
    is created. This illusion fosters a false sense of productivity and greater availability
    of food. In reality, more resources are being wasted, more livelihoods are being
    destroyed, and more hunger is being created.


    When we use the term “livelihood,” we are talking about self-organized work in
    living economies, based on cocreation and coproduction. A livelihood is not a
    job. The word “job” was first used during the rise of the Industrial Revolution
    to describe piecework: a type of work that was measured by the number of items—or
    pieces—produced, such as garments or tools. The etymology is significant when
    we think of how the word “job” is used today. A “job” is based on the reduction
    of a creative, autonomous human being to labor, and the further reduction of labor
    to a commodity. Peasants and small-scale farmers do not have jobs; they have livelihoods.
    Women providing food to their families and communities do not have “jobs,” yet
    they work more and harder than anyone else.


    Generating meaningful and productive work and creating employment, including self-employment,
    all outputs in an ecological system. Reducing human activity to labor, and transforming
    it from an output to an input, is a prescription for unemployment, displacement,
    and the destruction of livelihoods of small family farmers and their communities
    over the world.


    According to the Indian Ministry of Agriculture, which has vested interests in
    corporate, large-scale agriculture, limited holding per capita in India is a great
    obstacle which inhibits large scale mechanisation and adopting other measures
    for increasing the productivity and bringing down the unit cost of production.
    It is a well known fact that in the major exporting countries like USA, Canada,
    and Australia, the cost of production is low since the farms are fully mechanised,
    little human labour is used,

