    建立在正义、公平和主权的原则之上，或建立在所谓“自由贸易”的不公平规则之上。


    当我意识到占据主导地位的农业系统是多么误导和虚假时，我将毕生致力于拯救种子、推广有机农业和生态农业。我没有去加强那些将我们的小农户推向债务深渊的化学和资本投入，而是致力于加强生物多样性和生态过程，与自然合作，而不是向自然宣战。


    1987年，我发起了Navanya运动，这是一项旨在拯救种子、保护生物多样性以及传播生态耕作方法的运动。我们帮助创建了的一百多个社区种子库，这些种子库为农民提供了开放获取的种子，让他们能够在没有外部投入的情况下种植出美味、富营养的作物，从而在增加他们自身营养水平的同时，也增加了收入。这些种子库在气候极端天气（包括干旱、洪水和气旋）期间拯救了农民。从种子的拯救和分享开始，我们现在又分享农业生态学知识的种子。通过我们的地球大学（Earth
    University），我们传播了与活种子、活土壤、活食物、活经济和活民主相关的理念和实践。通过基于生物多样性的生态农业实践，我们教导如何健康且充足地生产食物，以及如何通过农业来增强土壤肥力、增加生物多样性、节水并减少导致气候变化的温室气体。


    这两种食物范式之间的竞争，是两种理念和组织原则之间的竞争。一种范式基于剥削法和统治法，始于战争并根根于暴力。第二种范式植根于农业生态学和活经济，并基于回报法则：即向社会、小农户和地球回馈。它体现了分享和关怀的价值观，而不是自私和贪婪。今天，范式的转变已成为一项不容忽视的全球生存使命。


    《谁在喂养世界？》（Who Feeds the World?）是对三十年研究与行动的总结，是对全球转变的呼吁。


    我们需要范式的转变和权力转移。受企业贪婪塑造的工业农业没有、也无法带给我们可持续性和健康。相反，我们可以通过关注拯救种子、回馈土壤、培育生物多样性以及保护我们的小农户和妇女，向农业生态学转型并实现充足的自给自足。我们必须停止贫化我们美丽的星球。播种希望的种子，建立一个造福星球及其人类健康健康的食物系统，就在我们手中。


    # 农业生态学喂养世界，而非暴力的知识范式


    在过去的上万年里，人类一直以生态方式耕作。自然的系统和循环产生了更新、繁殖和多样性，让所有生物能够和平共存。这些可持续系统并不是停滞或静态的；它们处于不断演化之中。在这些生态系统中，有机农业蓬勃发展。事实上，其繁荣程度令那些最初从工业农业中获利的人发现，他们的化学品和农药对“改进”传统生态农业的作用微乎其微。


    早在1889年，约翰·奥古斯塔·沃尔莱克（Dr. John Augustus Voelcker）博士被派往印度，为英国帝国政府就化学农业在印度农场的应用提供建议。在研究印度农业系统后，沃尔莱克表示：“几乎没有什么是可以改进的。……我可以确定，至少我没有见过比这更精细耕作的完美画面了。我可以大胆地说，对英国农业提出改进建议比对印度农业提出有价值的建议容易得多。”


    二十多年后，现代可持续农业的“父亲”阿尔伯特·哈华德爵（Sir Albert Howard）对印度和中国写道：“东方的农业实践已经通过了最高测试，它们几乎像原始森林、草原或海洋一样永久。”这些陈述中引人注目的是，这两个人终究是殖民者，他们寻求更大的利润和对本土土地更强的控制。即使是他们，也无法在这些“完美”的耕作系统中发现任何缺陷。与普遍观点相反，饥荒的发生并非因为本土农业系统没有产生充足的食物，而是因为……（此处原文似乎中断，但根据逻辑应指某种系统性因素）。


    （注：原文文本在此处似乎不完整，翻译根据提供的段落进行。）


