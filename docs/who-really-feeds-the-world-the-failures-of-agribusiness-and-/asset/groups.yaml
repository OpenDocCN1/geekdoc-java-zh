    美国的标签法。作为回应，孟山（Monsanto）与该国最大的垃圾食品游说集团——食品制造业协会（GMA）声称，这“强加了负担负担的新言论要求”。通过这种方式，孟山将隐藏毒素信息的权利描绘成了言论自由权。今天，全球有六十个国家制定了强制性转基因标签法，但美国其他州通过这些法律的努力均被工业界阻挠。在加利福尼亚和华盛顿，孟山和GMA花费了近亿美元击败了支持标签的投票。


    当公司等人工实体被视为自然人时，它们的权利变得绝对，并可以损害所有物种、所有人类以及所有女性的权利。公司没有自己的思想，但它可以通过知识产权掠夺女性数千年来保护的种子和种子知识集体财富。公司不生产任何东西，但通过自由贸易规则，它可以掠夺农民生产的所有食物并将其变为商品。公司不能投票，但可以通过企业资助来窃取选举。美国最高法院将选举资助的限制解释为对公司“言论自由”的干涉。


    企业对食品系统的控制不仅导致了女性知识和生产能力的边缘化，还在破坏我们物种自给自足的潜力。五个巨头和五个食品巨头取代了数十亿女性生产者和加工者，这导致了全球粮食不安全。超过十亿人无法获得食物，另十亿人因工业加工食品遭受肥胖及相关疾病的折磨。在遭受这两种营养不良的人中，女性和女孩受害最深。这就是为什么世界上饥饿的人口是食物种植者：他们大多数是女性。


    基于对地球暴力的科学和经济模型与针对女性的真实暴力直接相关。当我在旁遮普研究绿色革命时，我看到墙上手绘了第一批选择性别流产广告。这种用化学品和机器取代女性、使其离开农业生产工作的农业模式，现在正使她们变成一次性的性别。根据全球范围内下降的性别比例（衡量每千名男性中女性数量的数据），经济学家阿马蒂亚·森（Amartya
    Sen）表示，超过一亿女性失踪.¹¹⁴ 一个男性化的生产模式系统性地贬低女性在世界上的地位，女性自身也被贬值、驱逐和消失。全球范围内强奸发生率的增加和残暴性也与一种将每个生物（尤其是女性）转变为商品的暴力经济有关。当数百万人被连根和流离时，遭受残暴对待的男性也会变得残暴。


    种子是食物链的第一个环节。五千年来，农民一直生产自己的种子，在食物链中进行选择、储存、重新种植，并让自然顺其发展。女性原则指导着种子的保护，通过种子保护，女性保护了遗传多样性和农作物的自我更新能力。这种可持续的知识和农业实践是新兴农业生态学范式的基础，却被绿色革命破坏了。


    绿色革命的核心是新型的“奇迹”种子，博尔格（Borlaug）收到的这种“奇迹”种子获得了诺贝尔奖，并在第三世界迅速蔓延，但它也种下了农业新商业化的种子。博尔格通过创造一种技术，使跨国公司获得了对种子的控制，从而获得了整个食品系统的控制，开启了企业控制食品生产的时代。绿色革命使种子商业化和私有化，剥夺了全球南方农民妇女对植物基因资源的控制。这种控制权转而交给了世界银行运行的国际研究中心（如CIMMYT和IRRI）的男性技术官以及跨国公司。


    几个几个世纪一直是遗传遗产的守护者。对尼泊尔农村女性的研究发现，种子选择主要是女性的责任。在研究涉及的60.4%案例中，由女性独立决定使用什么种类的种子，而男性仅在20.7%的案例中做决定。在家庭使用自己种子的情况下，81.2%的时间由女性独立做决定.¹¹⁵


    女性数千年来细心维护着食品生产的遗传基础。但现在，一种关于种子的男性观点将这种共同财富定义为“原始的”，并将其自己的新产品视为“先进”品种。


    绿色革命是一种通过破坏种子的自我繁殖特性和遗传多样性，来育种“女性原则”的策略。植物育种中女性原则的死亡是种子成为利润和控制来源的开始。但杂交“奇迹”种子是一种商业上的奇迹，因为农民每年必须购买它们的供应；它们不会自我繁殖。杂交后不会产生相同结果的种子，因为杂交不会将其活力传递给下一代。通过杂交，种子不再是植物生命的来源，不再通过食物和营养提供维持；它们现在是私人利润的来源。


    从自然、女性和贫穷农民的角度来看，绿色革命种子并没有增加粮食。这些品种对于希望在种子和化肥销售中寻找新利润途径的公司唯一有用。资助新种子研究的国际机构也为分配提供了资金。向数百万买不起这些种子的的小农民销售新品种这一不可能的任务，由世界银行、联合国开发计划、粮农组织（FAO）以及一系列双边援助计划解决，他们开始优先考虑分配高产（HYV）种子。绿色革命通过杂交种子和转基因生物传播了化学水稻和小麦的单栽培，将生物多样性、尤其是营养从我们的农场和饮食中驱逐。


    那些在化学冲击中幸存的作物，如苋叶菜和藜等自生植物——它们富含铁——随后被洒了毒素和除草剂。本该被视为富铁和营养丰富的作物，却被视为“杂草”。孟山的一位代表曾说，基因工程作物“掠夺了阳光”。孟山在印度的广告告诉女性：“解放你自己”。但转基因生物是为了女性的解放，还是为了营养。


