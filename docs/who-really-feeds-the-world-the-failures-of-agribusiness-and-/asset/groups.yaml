    Economist José Cuesta entitle “No Food, No Peace” warns that “It is quite likely
    we will experience more food riots in the foreseeable future . . . food price
    shocks have repeatedly led to spontaneous—typically urban sociopolitical instability.”


    Just between 2005 and 2008, the international price of various foods increased
    by nearly half. While a metric ton of wheat was $152 in 2005, it went up to $343
    in 2008; while rice was $207, it went up to $580; and while soy oil was $545,
    it escalated to $1,423. In the face of these rising prices, then US President
    Bush used a fallacious argument to explain unaffordable food: he blamed the growing
    middle class in developing countries. At Missouri press conference on the economy,
    he said, “There are 350 million people in India who are classified as middle class.
    That’s bigger than America. Their middle class is larger than our entire population.
    And when you start getting wealth, you demand better nutrition and better food
    so demand is high and causes the price to go up.” This argument served both to
    divert US political debate away from the role of US agribusiness in precipitating
    the food crisis, and to present economic globalization as benefiting countries
    like India.


    But as the data shows, India is the hunger capital of the world, and as globalization
    becomes further entrenched, so does hunger. The myth that President Bush was propagating
    is a growth myth. It is repeatedly stated that the price increase is due to “surging
    demand in emerging economies like China and India.” The argument is that since
    the economies of China and India have grown, the Chinese and the Indians have
    gotten richer and are eating more, and this increased demand is leading to higher
    prices. This growth myth is false on many counts. While the Indian economy has
    indeed grown, the majority of Indians have grown poorer, since as is due a direct
    result of globalization, they have lost their land and their livelihoods. Most
    Indians are in fact eating less than before the era of globalization and trade
    liberalization. The availability of food per capita has declined from 117 kg per
    person per year in 1991 to 152 kg per person per year in 2003. The daily availability
    of food has declined from 485 to 419 g/day, and the daily calorie intake has dropped
    from 2,220 cals/day to 2,150 cals/day. Million Indian children die every year
    from a lack of food.


    The fact that India is the capital of hunger shows that growth does not reduce
    hunger, and the fact that most of the world''s hungry people are themselves producers
