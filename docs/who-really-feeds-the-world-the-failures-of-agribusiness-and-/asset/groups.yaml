    But monoculture farming is a losing economy. As early as 1978, Professor William
    Lockeretz compared the economic performance of fourteen organic crop and livestock
    farms in the Midwestern United States with that of fourteen conventional, or monoculture,
    farms were paired on the basis of physical characteristics and types of farm enterprises.
    The market value of crops produced per unit area was 11 percent less on the organic
    farms. But since the cost of production was also less, organic farming relies
    less on external inputs such as chemicals and fertilizers, the net income per
    unit area was nearly equal for both systems. Monoculture farming is not more profitable
    than organic farming.


    Because organic farmers grow a greater diversity of crops, the entire production
    on a farm is not vulnerable to the same pests or seasonal weather events. Additionally,
    organically farmed soils absorb more of the available rainfall, providing protection
    from drought.¹ If there is a total crop failure, organic farmers suffer fewer
    economic losses, because they have invested less in purchased inputs. The diversity
    of crops on organic farms also has other benefits. Diversity provides some protection
    from adverse price changes in a single commodity and provides a better seasonal
    distribution of inputs.


    Organic farmers need to borrow less money than conventional farmers for two reasons.
    First, organic farmers buy fewer inputs, such as fertilizer and pesticides. Second,
    costs and income are more evenly distributed throughout the year on diversified,
    organic farms, because different crops are ready for harvesting at different points
    in the year. In India, the epidemic of farmers'' suicides is concentrated in regions
    where chemical intensification has increased the costs of production and cash
    crop monocultures are facing a decline in prices and incomes due to globalization.
    High costs of production are the most significant reason for rural indebtedness,
    in an equation where monocultures = chemicals = debt = suicides.


    When we consider all the data, the argument that there is a larger amount of cheaper
    food available through monocultures is illusory on four counts. First, monocultures
    focus on the partial aspects of single crops rather than total system yields of
    multiple crops and integrated systems. Second, industrial breeding focuses on
    yields of one or two global commodities, not on the diverse crops that people
    actually eat. Here, the'
- md: '

    focus is on quantity per acre rather than nutrition per acre, when in fact, nutrition
    per acre has been reduced as a result of industrial agriculture. Third, industrial
    breeding, including genetic engineering, uses natural resources intensively and
    wastefully. If productivity is defined on the basis of resource use, industrial
    agriculture has very low productivity and undermines food security by using resources
    that in a sustainable system of production could have been directly used to produce
    more food. Fourth, and crucially, chemical intensification and genetic engineering
    in monocultures produces less food than on ecological alternatives that are based
    on biodiversity intensification.


    According to the dominant paradigm of food production, diversity hinders productivity.
    This creates an imperative for uniformity and monocultures, and has generated
    a paradoxical situation in which modern plant “improvement” has been based on
    the destruction of the biodiversity it then uses as a raw material. The irony
    of plant and animal breeding is that it destroys the very building blocks on which
    the technology depends. Forestry development schemes introduce monocultures of
    industrial species such as eucalyptus, and push into extinction the diversity
    of local species that once fulfilled local needs. Agricultural modernization schemes
    introduce new and uniform crops into farmers’ fields and destroy the diversity
    of local varieties. Modernization of animal husbandry destroys diverse breeds
    and introduce factory farming.


    This strategy of basing productivity increase on the destruction of diversity
    is dangerous and unnecessary. Monocultures are ecologically and socially unsustainable
    because they destroy both nature’s economy and people’s economy. In agriculture,
    forestry, fisheries, and animal husbandry, production is being incessantly pushed
    into the direction of diversity destruction. Production based on uniformity thus
    becomes the primary threat to biodiversity conservation and to ecological and
    socioeconomic sustainability.


    Diversity must first be made the logic of production before it can be conserved.
    If production continues to be based on the logic of uniformity and homogenization,
    uniformity will continue to displace diversity. “Improvement” from the corporate
    viewpoint, or from the viewpoint of Western agricultural or forestry research,
    is often a loss for the Global South, and especially for the poor in the Global
    South. Plant improvement in agriculture has been based on the enhancement of the
    yield of desired products at the expense of unwanted plant parts. The “desired”
    product is, however, not the same for agribusiness and for peasants, and which
    parts of a farming system will be treated as “unwanted” depends on what class,
    caste, or gender one belongs to. What is unwanted for agribusiness may be wanted
    by the poor, and by squeezing those aspects of biodiversity, “agricultural development”
    fosters poverty and ecological decline. There is therefore no truth in the myth
    that production runs counter to diversity. Uniformity as a pattern of production
    becomes inevitable only in a context of control and profitability.


    Productivity and sustainability are much higher in mixed systems of farming and
    forestry that produce diverse outputs. The productivity of monocultures is low
    in the context of diverse outputs and needs. It is high only in the restricted
    context of the output of “a part of a part” of the forest and farm biomass. “High
    yielding” Green Revolution cropping patterns pick one among hundreds—for example,
    wheat—for yields from only one of the wheat plant: grain. High partial yields
    do not translate into high yields. Productivity is therefore different depending
    on whether it is measured in a framework of diversity or in a framework of uniformity,
    and whether it is understood through the Law of Return or the Law of Domination.


    In this way, the economic calculations of agricultural productivity in the dominant
    paradigm distort measures of productivity. They leave out the benefits of internal
    inputs derived from biodiversity and fail to account for the additional financial
    and ecological costs generated by the purchase of external, chemical inputs as
    substitutes for internal, natural inputs in monoculture systems.


    The higher productivity of diversity-based systems indicates that there is an
    alternative to genetic engineering and industrial agriculture: an alternative
    that is more ecological and more equitable. This alternative is based on biodiversity
    intensification instead of chemical intensification. But even though diversity
    produces more than monocultures, monocultures are profitable to industry, both
    for markets and for political control. The shift from high yielding diversity
    to low yielding monocultures is made possible because of a market logic that takes
    resources from the poor and gives them to the rich, only to then be destroyed.
    Meanwhile, higher commodity production brings benefits only to those with economic
    power, and ironically, it is the hunger of the poor that is used to justify the
    agricultural strategies that deepen their hunger.


    While collecting seeds in a tribal region of Tamil Nadu in southern India, I met
    a farmer growing nine crops together. He explained how the diversity of crops
    on the land is connected from the macro to the micro: from the planetary balance
    of the solar system to the ecological balance of the Earth to the nutritional
    balance in our bodies. Navdana means "nine seeds," or "nine crops," and as a testament
    to this diversity, I named our save movement Navdanya.


    The idea that "diversity is prosperity" is as old as it is, and its practice can
    be seen across the living planet. Local mountain farmers in the Garhwal Himalayas
    have developed complementary and synergistic associations among different species
    to foster biodiversity-centered agricultural practices. Of these, the baranaaja
    culture is a prime example and a testimony to prosperity in diversity. Baranaaja
    consists of twelve food grains intercropped with finger millet, which is used
    as the base crop. Amaranth, buckwheat, kidney beans, horse gram, black soybean,
    black gram, green gram, cowpea, rice bean, adzuki bean, sorghum, and cleome are
    the crops generally intermixed with finger millet. Baranaaja helps provide the
    maximum number of food items while ensuring a balanced diet from a minimum area
    of land. Baranaaja occupy the least fertile areas of cropland where other moisture-loving
    or water-guzzling crops would fail to grow. Such carefully crafted biodiversity
    management enhances the sustainability of the agroecosystem and raises the food
    security level of the entire farming community.


    Several oceans away from the Himalayan mountain range, farmers of Mesoamerica
    have used a mixed-cropping system known as milpa for centuries. Based on the ancient
    agricultural methods of the Maya, Zapotec, and other Mesoamerican peoples, milpa
    agriculture produces maize (corn), beans, and squash, along with other crops suitable
    to local conditions. The system is entirely self-sustaining in regard to levels
    of consumption, and includes avocados, melons, tomatoes, chiles, sweet potatoes,
    jicama, amaranth, and mucuna. Journalist and author Charles C. Mann describes
    milpa as “nutrititionally and environmentally complementary.” He writes:


    “Maize lacks the amino acids lysine and tryptophan, which the body needs to make
    proteins and niacin. . . . Beans have both lysine and tryptophan. . . . Squashes,
    for their part, provide an array of vitamins; avocados, fats. The milpa, in the
    estimation of H. Garrison Wilkes, maize researcher at the University of Massachusetts
    in Boston, “is one of the most successful human inventions ever created.’”


    In San Felipe el Agua, *milpa* is more than the fields and crops: it is a network
    of families, commerce, and practices, much of which is very old. The *milpa* of
    San Felipe comprises traditional knowledge, handmade tools, the zebu-crossed criollo
    cattle for plowing, burrows, dogs, backyard tortilla factories, kitchen tables,
    meals, and hard work—it is a way of life centered around the maize, and a testament
    to not only biodiversity, but cultural diversity.


    Variations of this organic practice (organic in terms of crops but also in terms
    of being rooted within a community) can be found across cultures. Among some Native
    American tribes, the milpa system takes the name “three sisters,” bringing together
    corn, beans, and squash. By the time European settlers arrived in America in the
    early 1600s, the Iroquois had been growing the three sisters for more than three
    centuries. The vegetable sustained the Native Americans both physically and spiritually;
    in legend, the plants were a gift from the gods, always to be grown together,
    eaten together, and celebrated together.


    Both aspects of the food crisis—the agrarian crisis on one hand and the malnutrition
    crisis on the other—are related to the fact that food production has become chemical-intensive
    and focused on “yield per acre.” However, yield per acre ignores the loss of nutrition
    that is leading to the malnutrition crisis. So while the Green Revolution led
    to an increase of rice and wheat with chemical-intensive, capital-intensive, and
    water-intensive inputs, it simultaneously displaced pulses, oilseeds, millets,
    greens, vegetables, and fruits from people’s diets.

