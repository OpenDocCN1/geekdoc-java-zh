- md: '

    distributed on principles of justice, fairness, and sovereignty, or on the basis
    of the unfair rules of so-called “free trade.”


    Once I realized how misguided and false the dominant system of agriculture was,
    I dedicated my life to saving seeds and promoting organic farming and ecological
    agriculture. Instead of intensifying chemical and capital inputs that were pushing
    our small-scale farmers into debt, I committed myself to intensifying biodiversity
    and ecological processes, working with nature, rather than declaring war against
    her.


    In 1987 I started Navanya, a movement for saving seeds, protecting biodiversity,
    and spreading ecological methods of farming. We have helped create more than one
    hundred community seed banks, which have provided open access seeds to farmers
    to grow tasty, nutritious crops with no external inputs, increasing their own
    nutrition while also increasing their incomes. These seed banks have rescued farmers
    in times of climate extremes, including droughts, floods, and cyclones. Beginning
    with the saving and sharing of seeds, we now share the seeds of the knowledge
    of agroecology. Through our Earth University we spread the ideas and practices
    related to living seed, living soil, living food, living economies, and living
    democracies. Through the practice of biodiversity-based, ecological agriculture,
    we teach how food can be grown in health and abundance, and farming can be done
    to enhance the fertility of the soil, increase biodiversity, conserve water, and
    reduce greenhouse gases that contribute to climate change.


    The contest between the two paradigms of food is a contest between two ideas and
    organizing principles. One paradigm is based on the Law of Exploitation and the
    Law of Domination, beginning with wars and rooted in violence. The second paradigm
    is embedded in agroecology and living economies and is based on the Law of Return:
    of giving back to society, small-scale farmers, and the Earth. It embodies the
    values of sharing and caring, not selfishness and greed. Today, a paradigm shift
    has become a global survival imperative that cannot wait longer.


    Who Feeds the World? is a distillation of three decades of research and action,
    and a call for a global shift.


    We need a paradigm shift and a power shift. Industrial agriculture shaped by corporate
    greed does not, and cannot, bring us sustainability and health. Instead, we can
    make the transition to agroecology and feed ourselves in abundance by focusing
    on saving seeds, giving back to the soil, nurturing biodiversity, and protecting
    our small-scale farmers and women. We must stop impoverishing our beautiful planet.
    It is in our hands to sow the seeds of hope for a food system that works for the
    health and well-being of the planet and all its people.


    # Agroecology Feeds the World, Not a Violent Knowledge Paradigm


    Over the last ten thousand years, humanity has farmed ecologically. Systems and
    cycles of nature have given rise to renewal, reproduction, and diversity, allowing
    all beings to peacefully coexist. These sustainable systems are not stagnant or
    static; they are in constant evolution. Within these ecological systems, organic
    farming has thrived. In fact, thrived so well that even those who first stood
    to profit from industrial agriculture found that there were little their chemicals
    and pesticides could do to “improve” traditional ecological farming.


    As early as 1889, Dr. John Augustus Voelcker was sent to India to advise the imperial
    British government on the application of chemical agriculture to India’s farms.
    On studying Indian farming systems, Voelcker stated, “there is little or nothing
    that can be improved. . . . Certain that it is I, at least, have never seen a
    more perfect picture of careful cultivation. I may be bold to say that it is a
    much easier to propose improvements in English agriculture than to make valuable
    suggestions for that of India.


    More than twenty years later, Sir Albert Howard, the “father” of modern sustainable
    farming, wrote of India and China: “The agricultural practices of the Orient have
    passed the supreme test, they are almost as permanent as those of the primeval
    forest, of the prairie, or of the ocean.” What is remarkable about these statements
    is that these two men were, after all, colonizers, looking for larger profits
    and stronger control over indigenous land. And even they could find no deficiencies
    within such “perfect” systems of cultivation. Contrary to commonly held opinion,
    famines took place not because indigenous agricultural systems did not produce
    abundant food, but because of colonial exploitation, as is evidenced by the Bengal
    famine of 1943.


    In the last fifty years, however, something has shifted. The last century has
    been a short-lived experiment with nonsustainable, chemical-intensive, water-intensive,
    and capital-intensive agriculture. This new farming, often incorrectly touted
    as “conventional,” has destroyed the ecological foundations of agriculture, devastated
    natural environments, and resulted in food insecurity across the world. Given
    that self-sustaining systems have been in existence for millennia, how did this
    ecologically devastating farming become the dominant paradigm for approaching
    agriculture the world over? To answer this question, we must look at the ways
    of thinking—the knowledge paradigms—that gave rise to this new agriculture.


    As physicist Thomas Kuhn has written, all scientific systems are framed by knowledge
    paradigms. This is also true for the science and technology used in agriculture.
    Technological tools for food production do not exist independently of the knowledge
    paradigm of which they are a part, and the sophistication and sustainability of
    an agricultural farming system is dependent on the sophistication of the knowledge
    paradigm that governs it.


    Traditional agriculture and organic farming have their roots in several strands
    of knowledge, which are collectively recognized as the emerging knowledge paradigm
    of agroecology. Agroecology takes account of the interconnectedness of life and
    the complex processes that take place within nature. The time-tested agroecological
    knowledge of centuries, evolved in diverse ecosystems and cultures, is now being
    reinforced by the latest findings in modern science. There is new scientific knowledge
    in epigenetics about the interaction between genes and the environment, new knowledge
    of the ecological services provided by biodiversity and ecosystems, and a scientific
    recognition of the fact that the Earth is living. These are all contributing to
    the emergence of agroecology as a widely recognized scientific paradigm.


    During the industrial agriculture revolution, these traditional knowledge systems
    were replaced by a militarized way of thinking that promoted violence toward the
    Earth. The tools designed under this system were devised in ignorance of the fragile
    web of life, and they went on to disrupt and destroy the ecological foundations
    of food production. Industrial agriculture is not a knowledge system based on
    the understanding of ecological processes within an agroecosystem; rather, it
    is a collection of violent tools. These tools were literally the products of warfare
    and relied on chemicals that were originally designed to kill people.


    The discussion about who really feeds the world is first and foremost a discussion
    about which knowledge paradigm is a better guarantee for sustainable food production.
    Sophisticated, sustainable systems of both thought and food production have always
    existed. Humanity, after all, did not start eating in contemporary times. How
    then did we arrive at a situation where the Green Revolution and industrial agriculture
    displaced and destroyed systems that have nourished humanity over millennia and
    substituted the knowledge of ecological agricultural systems—agroecology—with
    the tools of warfare. And how did an outmoded mechanistic philosophy continue
    to dominate agriculture, even as emerging scientific disciplines converged with
    indigenous knowledge to create a system view of farming and food? And, finally,
    how can we move into a future based on the ecological foundations of agriculture,
    without which food production cannot take?


    When poisons are introduced into agriculture to control pests, or when GMOs are
    introduced under the argument of “feeding the world,” the justification given
    is always “science.” But “science” does not have a singular entity, and it did
    not come into existence within a vacuum. Today, what we generally refer to as
    “science” is in fact Western, mechanistic, reductionist modern science, which
    became the dominant practice of understanding the world during the Industrial
    Revolution and has continued as the dominant paradigm.


    Beginning in the mid-1700s when colonialism was at its peak, land that was once
    shared by communities, called the commons, needed to be enclosed in order to build
    industries and empires. To do this, the knowledge of the Earth and its species
    as interconnected and mutually beneficial needed to be replaced by something that
    allowed violence toward the land. To shape the industrial system in the form of
    new, violent technologies, and to shape the capitalist system in the form of a
    new, profit-driven economics, a certain type of science was promoted and privileged
    as the only scientific knowledge system. Two scientific theories privileged to
    dominate, and they continue to shape practices of food, agriculture, health, and
    nutrition even today.

