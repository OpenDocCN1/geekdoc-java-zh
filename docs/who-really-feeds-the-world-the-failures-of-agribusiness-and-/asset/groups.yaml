    We must dismantle these myths. Under the industrial paradigm, toxic chemicals
    kill the biodiversity of bees, butterflies, and friendly insects. Chemical fertilizers
    kill soil organisms, destroying the soil and soil fertility. Nitrogen fertilizers
    create dead zones and kill the biodiversity of aquatic and marine life. Furthermore,
    because they rely heavily on inputs of deadly chemicals, the cost to both the
    farmer and the consumer is greater in monoculture farming; the only profits being
    made are by large agribusinesses. Monocultures of the Mind focus on one economy:
    the global market controlled by global corporations. They remain blind to the
    economies of nature and society, to nature’s economy, and to people’s sustenance
    economy. We need to put an end to monocultures, on both land and in the human
    mind, and we need to urgently assess the true costs of industrial agriculture
    and the true benefits of biodiverse, ecological farming.


    Biodiverse systems of mixed cropping are based on a symbiotic relationship between
    soil, water, farm animals, and plants. Ecological agriculture links these elements
    together in sustainable ways, where each is dependent on the other, and the relationship
    between them is thus strengthened. Green Revolution agriculture, or industrial
    agriculture, replaces this integration with the introduction of external inputs,
    such as seeds that are bred for responding to chemicals, or with the chemicals
    themselves. Not only does the seed/chemical package break ecological farming interlinkages,
    but it also sets up its toxic interactions with soil and with water systems. These
    new interactions are not taken into account when measuring the cost or the yields
    of industrial farming.


    Diversity has been destroyed in agriculture under the false assumption that it
    is associated with low productivity. As a result, farmers'' diverse, native varieties
    have been replaced by new crops that are misleadingly called high yielding varieties,
    or HYVs. HYVs are part of the first myth that has been used to push industrial,
    monoculture farm systems: that chemical farming produces more food. What multinational
    companies conveniently forget to tell us is that HYVs are not intrinsically high
    yielding. Rather, they respond well to chemicals (most likely produced by the
    same seed companies promoting HYVs). In fact, a more appropriate label for them
