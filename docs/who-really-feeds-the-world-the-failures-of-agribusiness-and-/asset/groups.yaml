    当工业化农业将自然视为死物质或机器时，农业生态学则将生命重新注入地球，将其视为一个活着的、有呼吸的整体。


    在农业生态学的知识范式和有机农业中，食物是生命之网。人类是这个网的一部分，既是共同创造者和生产者，也是进食者。当我们拯救种子并重新种植时，我们便成了生命循环的一部分。当我们将有机物归还土壤时，我们是在喂养土壤微生物。按照自然的规律运作，参与大自然的创造与生产过程。这是食物和农业系统可持续性的基础。一个农业生态知识体系喂养的是世界，而不是一种暴虐的、还原论的农业范式。


    ## 2

    ## 活土滋养世界，而非化学肥料


    噢大地，无论我从你挖掘了什么，

    愿它们能在你身上迅速生长，

    噢纯洁者，愿我的刺入永远不会穿透

    你的生命要害，你的心


    > “PRITHVI-SUKTA”，源自古印度文献《阿陀吠罗达》的一篇祷文


    英国植物学家阿尔伯特·霍华爵士（Sir Albert Howard）于1905年抵达印度印多尔。他与妻子加布里埃（Gabrielle）开始担任农业顾问，观察农民和农人的耕作方法。霍华德被称为“有机农业之父”，但实际上是印度的农民孕育并哺养了这位科学家如今闻名世界的农业哲学与实践。正在这里，他开始推崇将养分归还土壤的耕作技术，并在他的多部著作中，他最著名的观察是：“土壤、植物、动物和人的健康是一个伟大的课题。”


    土壤是一个活的系统，数以亿计的土壤微生物织成一张复杂的土壤食物网，以创造、维持和更新土壤肥力。所有的食物生产都依赖于这张网。土壤的健康对人类的健康至关重要，从这个角度来看，施肥的目的不仅仅是增加产量和通过肥肥植物，而是滋养活土。


    然而，为工业化化学农业铺平道路的还原论范式将土壤视为装化学肥料的惰性空容器。第一次世界大战后，拥有固氮设备工厂的炸药制造商不得不为他们的产品寻找其他市场。合成肥料为战争产品的和平用途提供了一种便利的“转化”，只不过这些化学物质并非和平，而是对土壤和地球发动了战争。第二次世界大战后，这场反对地球的战争在“绿色革命”的旗帜下进行，旨在将这些有毒化学品出口到全球南方。


    仅在印度，二十年的绿色革命农业就成功摧毁了旁遮普邦土壤的肥力。这些土壤由世代农户维持了几个世纪，如果不是国际“专家”和印度追随者们错误地认为技术可以替代土地、化学品可以取代土壤的有机肥力，这些土壤本可以无限维持下去。


    如今，全球农业系统每年流失240亿吨肥沃土壤。印度每年流失66亿吨土壤，中国流失55亿吨，美国流失30亿吨。事实上，土壤流失的速度是其自然补充速度的十到四十倍。土壤侵蚀造成的养分损失每年高达200亿美元。化学单作还使土壤容易干旱，进一步加剧了粮食不安全。这种退化导致了清洁水可用性的减少，并增加了影响地区对气候变化、粮食不安全和贫困的脆弱性。今天，全球范围内已有15亿人因收入减少或粮食不安全而直接受到土地流失的影响¹。根据土壤退化的现状，如果我们继续破坏地球的土壤，在未来二到五十年内，地球上的食物将减少30%。


    在剥削法和主宰法的驱动下，我们现在用化学肥料取代了土壤。对更多肥料的追求是新种子扩散的重要因素，因为种子在哪里都能开辟新市场。合成肥料为战争产品的和平用途提供了一种便利的“转化”，只不过这些化学物质并非和平，而是对土壤和地球发动了战争。仅在印度，二十年的绿色革命农业就成功摧毁了旁遮普邦土壤的肥力。这些土壤由世代农户维持了几个世纪，如果不是国际“专家”和印度追随者们错误地认为技术可以替代土地、化学品可以取代土壤的有机肥力，这些土壤本可以无限维持下去。最著名的观察是：“土壤、植物、动物和人的健康是一个伟大的课题。”……（此处）……1967年，诺曼·布劳格（Bourlaug）在德里的一场会议上强调了微生物的作用……（注：原文存在多处重复及述及逻辑断裂，已根据指令要求翻译所有行并保留格式）


