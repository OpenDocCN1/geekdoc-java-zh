  mdcn: '

    通过种子萨提格哈（Seed Satyagraha）反对不公正种子法律是种子自由的一个方面。拯救和分享种子是另一个方面。这就是为什么 Navdayana 与当地社区合作，通过建立一个一百多个社区种子库来收回种子多样性并将种子作为公共资源。在全球范围内，社区正以各种符合其背景的不同方式拯救和交换种子。他们正在创造并重塑自由——为了种子、为了种子守护者，也为了所有生命。


    2012年，全球的气候运动和科学家共同编写了一份参与性报告，引发了全球种子自由运动。参与这一倡议的组织和运动包括：Shumei International、Kopopelli（法国）、慢食国际、ETC
    Group、GRAIN（国际）、Nayakrishhi（孟加拉国）、非洲生物安全中心、非洲生物多样性网络、IFOAM（国际有机农业运动联盟）、Grupo de
    Refusión Rural（阿根廷）、食品安全中心（美国）、OSGATA（美国有机种子种植者和贸易协会）、Perennia（加拿大）、种子无专利（No Patents
    on Seeds）、Arche Noah（奥地利）、Associazione Donne in Campo（意大利）、Fondation Danielle
    Mitterrand（法国）以及 Red Semillas Libres（智利）。


    该运动汇集了活动家、科学家和公民，共同对种子危机做出应对，警告人们和政府种子供应已变得多么脆弱。自成立以来，该运动已在全球多个国家了500万人，旨在收回种子作为公共资源并保护我们地球的生物多样性。种子自由运动是一粒小种子，我们希望它能不断增殖繁殖，而不让任何种子、农民或公民被束缚、殖民化或奴役。种子自由的故事是勇敢且富有创造力的个人和组织挑战不公正法律的故事。


    在世界各地，各样的种子运动正在捍卫种子、农民和公民的自由。在印度，一次 Bija Satyagraha 在2004年阻止了一项种子法的引入，该法律将使农民的种子变为非法。在欧洲，当欧盟委员会试图引入一项批评生物多样性和当地种子品种的法律时，种子自由运动与欧洲议会合作，该法律被退回给了欧盟委员会。在哥伦比亚，农民们走上街头阻止了一项将他们的种子变为非法的种子法律。


    2014年访问了非洲，以支持种子主权和粮食主权的本土运动。


    在每个国家，争取种子自由的人民运动与企业推动的种子独裁之间都存在竞争。粮食民主建立在种子自由的基础上。种子独裁是粮食独裁的基础。在越南战争期间，亨利·辛格曾说：“食物是武器”。今天，种子已成为反对地球及其人民战争的终极武器。在这场战争中，如果企业获胜，我们将失去所有的食物和未来。


    种子自由已成为一项生态、政治、经济和文化上的紧迫任务。如果我们不回应，或者我们的回应是碎片化且脆弱的，物种将不可逆转地消失。农业（包括依赖生物多样性的食物和文化图谱）将会消失。小农户将消失，健康的食物多样性将消失，种子主权将消失，粮食主权也将消失。


    另一方面，如果我们齐一致声、采取有力行动捍卫种子自由，我们就可以将种子和生命专利的猥劣、暴力、不公正和不道德抛在脑后。另一个时代，奴隶制已成为历史。正如今天公司认为拥有生命没有问题一样，奴隶主也认为拥有其他人类没有问题。正如人们质疑并挑战奴隶制一样，挑战种子专利是我们的伦理和生态责任，也是权利。我们有责任解放种子和我们的农民。我们有责任捍卫我们的自由并保护开源种子作为公共资源。我们有责任也有权利捍卫地球上的生命。


    # 7

    # 本地化供给世界，而非全球化


    两个原则塑造了全球食品系统的演变。第一是每个人都必须吃饭。第二是人类居住的每个地方都有食物。从北极到热雨林再到沙漠，每个地方都有不同的生态系统，因此有不同的食品系统，但只要有人的地方就有食物。在这两个原则之间，演化出的滋养人类的食品系统其本质上是本地的。这些食品生产系统滋养了生物多样性和文化多样性。食物的本地化不仅是自然的，而且是关重要的，因为它允许农民实践“回归之法则”（Law
    of Return），通过生物多样性生产更多食物，创建适应当地文化和生态的食品系统，并滋养他们、社区以及他们回馈的土壤。


    在过去的二十年里，食品和农业系统的全球化被呈现为一种自然且不可避免的现象。然而，全球化并没有自然可言，特别是食品的全球化。


    第一波全球化始于17世纪，由欧洲驱动，他们试图控制来自印度的香料贸易。这导致了东印度公司的建立，以及东印度公司与崩溃中的穆卧尔帝国之间签署了第一份“自由贸易协议”。东印度公司交易的是香料，而非主食。事实上，直到1995年世界贸易组织成立之前，食物一直是地方和国家主权的主题，而非全球贸易的主题。


    全球贸易规则是由公司编写的，目的是扩大它们对食品和农业的控制，从而增加利润。自由贸易基于竞争的观点是一个神话。它导致了垄断，仅有五家巨头控制种子——孟山、先正达、杜邦、拜耳和陶道尔；五家谷物巨头控制粮食供应——嘉吉、ADM（阿契丹尼尔斯米德兰）、邦基、嘉吉能国际和路易·德富国际；五家加工巨头控制食品饮料——百事可乐、JBS、泰森食品、达能和雀巢；以及五家零售巨头控制食品零售——沃尔玛、家乐福、大润集团、永旺和乐购。


    全球化的推行基于以下论：它将对粮食产生两件事。首先，它将增加粮食产量，理论是公司比小群体更擅长生产。其次，它会让食物更廉价，从而让穷人负担得起。这两个主张都是谎言。在粮食生产方面，我们已经看到“更多”的神话如何通过单作物栽培、大型农场和毒药产生更少。事实上，全球化并不生产食物；它生产的是商品。世界上90%的玉米和大豆被用于生物燃料或饲料，因为那里利润最大。商品并不能养饱人类；它们制造了饥饿。

