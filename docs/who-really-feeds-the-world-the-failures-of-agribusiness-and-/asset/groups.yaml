    so that corporations can make farmers’ seeds and local diverse varieties illegal.
    These are laws of uniformity, enforced either through UPOV—the International Union
    for the Protection of New Varieties of Plants, which allows intellectual property
    rights on plants in seventy-one member countries—or through seed acts that require
    seed registration.


