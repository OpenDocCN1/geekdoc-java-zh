    在我们 Navdanya 的农场，我们发现了同样的趋势。我们的农场始于一片从澳大利亚引进到印度的桉树种植场遗留的、贫瘠且沙化的的土地，那里的树木无法参与“回报法则”。它们的叶子不会降解，消耗过多的水分，并释放出他感性单萜，抑制任何其他植物的生长。那里土地没有土壤微生物，也没有蓄水能力。我们用爱培育了多样性，并向土壤归还了尽可能多的有机质。土壤充满了微生物，蚯蚓的洞穴遍布农场，我们已经能够减少
    70% 的用水量，因为土壤现在可以蓄水了。土壤充满生机，赋予我们生命。


    健康的土壤产生健康的植物，正如霍华德（Howard）曾经所说：“每种作物的出生权利就是健康。”这在气候变化时代尤为如此。工业农业负责了导致气候变化的 40%
    温室气体，而重施肥的粪肥更容易受到气候变化的影响。


    在 2009 年印度全国性干旱期间，当我访问了全国不同地区的 Navdanya 农民时，我发现他们的作物并没有遭受损失，因为他们使用的是当地适应的种子，而且由于有机施肥，土壤具有蓄水能力。使用“绿色革命”、高肥力品种或转基因
    Bt 棉花的农民则遭遇了歉收，因为无论是种子还是土壤都不具备韧性。


    种植多样性和发展有机耕作已成为我们的土壤适应气候变化的必要手段。支持健康的土壤是从大气中吸收二氧化碳最有效的方法。含有有机质的土壤对干旱和极端气候更具韧性。生物多样性密集型系统——实际上是光合作用密集型系统——驱动二氧化碳从大气中进入植物，然后进入土壤。土壤而不是石油，掌握着人类的未来。基于石油的、化石燃料密集型的、化学密集型的工业农业利用正在杀死土壤的过程，在这里终结了我们的未来。


    历史证明，社会和文明的命运与我们对待土壤的方式密切相连：我们是通过“回报法则”还是通过“剥削法则”与土壤建立联系？回报法则，即回馈，确保了肥沃土壤的创造与维持，并能由活土壤支撑数千年之。剥削法则，即索取而不回馈，导致了文明的崩溃。


    随着土壤被侵蚀、退化、埋在混凝土之下并被剥夺生命，全球当代社会正处于崩溃边缘。但情况可以有所不同。


    霍华德近一个世纪年前曾警告过我们：


