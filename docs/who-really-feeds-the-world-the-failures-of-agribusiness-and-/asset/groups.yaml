    # 5

    Small-Scale Farmers Feed the World, Not Large-Scale Industrial Farms


    In an age of obsession with gigantism, we live under the illusion that “big is
    best,” that big produces more, that big is more powerful. When it comes to food,
    this translates into the idea that we need big farms and big corporations to feed
    the world. Today, just five corporations control the majority of seed, water,
    and land in the world, and they are growing.


    But the reality is that “small is big”—ecologically, culturally, and economically.


    Despite threats from large companies, local farming communities still produce
    70% of the world’s food. These farming systems have been around for centuries
    and are governed by small-scale farmers and are steeped in diversity. On the one
    hand, they reflect diversity agroclimatic features, and on the other hand, they
    have developed within diversity food cultures. As we have seen, the diversity
    of agricultural systems and the cultural diversity of food systems have coevolved
    in a mutual interplay of nature and culture. Biodiversity and cultural diversity
    go in hand, and small is big culturally, too.


    Economically speaking, it is often falsely assumed that small farms and small-scale
    farmers have low rates of production. But as we have seen,'
  - '[PAGE 68]


    small, biodiverse farms are more ecologically efficient than large industrial
    monocultures. When one recognizes that small farms across the world produce greater
    and more diverse outputs of nutritious crops, it becomes clear that industrial
    breeding has actually reduced food security. Industrial farming has created hunger
    and poverty; yet large industrial farms are justified as necessary in order to
    produce more food.


    The globalization of agriculture has led to the destruction of diverse farming
    systems and the displacement of small-scale farmers worldwide. This in turn has
    led to a destruction of the environment and rural livelihoods, and especially
    farmers’ livelihoods. Our nutritional, environmental, and cultural well-being
    is under threat. And in order to secure a future for ourselves and for all life
    on the planet, we must return to the kernel of truth we began with: small is big,
    and small is beautiful.


    According to the dominant paradigm of industrial agriculture, intensifying chemical
    inputs and energy use is necessary for feeding a growing population because intensification
    of inputs and large farms lead to higher productivity and hence more food. This
    is not true. Productivity is the measure of output per unit of input. In terms
    of resources and energy, the higher the input, the lower the productivity. Since
    industrial agriculture is resource and energy intensive, it has led to a productivity
    decline in terms of ecological efficiency and resource-use efficiency.


    In an ecological and small farming system, output includes the rejuvenation of
    ecological processes, the diverse outputs of crops, livestock, trees, and the
    livelihoods created through cocreation and coproduction. In a large-scale industrial
    farming system, output is reduced to a single commodity (the part of a plant)
    and input is reduced to labor. The intensification of chemicals and fossil fuels
    is primarily aimed at substituting the labor of small-scale farmers and concentrating
    ownership of land in large farms owned by corporations. When labor is artificially
    selected as the only input that “counts,” and productivity with respect to labor
    is seen as the only “real” productivity, an illusion is created. This illusion
    fosters a false sense of overall productivity and greater availability of food.
    In reality, more resources are being wasted, more livelihoods are being destroyed,
    and more hunger is being created.'
