    farms are a more effective solution to world hunger than the Green Revolution
    or genetic engineering.


    Navdanya''s studies in India also point to an increase in farmers'' incomes through
    small-scale, biodiverse farming. The four crops being externally imposed on Indian
    farmers today are GMO Bt cotton, hybrid rice, hybrid corn. Farmers growing organic
    cotton, indigenous rice, millets, and indigenous pulses earn more in a just trade
    system than farmers selling their produce through commodity trade. Farmers growing
    hybrid rice earn Rs. 71,862/hectare, whereas Navdanya member Mukundi Lal, growing
    indigenous basmati rice, earns Rs. 30,131/hectare. Farmers growing soy earn Rs.
    2,863/hectare, whereas farmers like Mohan Singh of Chakrabata, growing indigenous
    kidney beans, earn Rs. 267,399/hectare. Farmers growing hybrid corn earn Rs. 30,657/hectare,
    whereas Rajeshwari of Rudraprayraj, who grows millet (ragi), earns Rs. 219,400/hectare,
    and Sushela Devi, who grows amaranth, earns more. Conserving biodiversity and
    practicing agroecology on small farms have undeniably enhanced farmers'' incomes.


    Small-scale farmers are not just producers of food and nutrition. They are custodians
    of seed and soil, conservators of water and land, and protectors and rejuvenators
    of biological and cultural diversity. They produce more using less, and are hence
    more productive and efficient than the large industrial monocultures they are
    being replaced with. From less than 30 percent of the world''s arable land, small-scale
    farmers produce 70 percent of the food eaten in the world. Agribusiness, on the
    other hand, uses 70 percent of the world''s arable land to produce a mere 30 percent
    of the food.


    So who really feeds the world? The numbers speak loud and clear.


    Today, small-scale farmers are in crisis. They are being wiped out by the rules
    of corporate globalization, designed to maximize corporate profits at the cost
    of small-scale farmers. Corporations sell costly inputs in the form of seeds and
    chemicals to farmers, and buy their produce at cheap prices. Farmers are locked
    into debt, and farming is made untenable, leading to a massive exodus from the
    countryside to urban slums. Since the policies of globalization of agriculture
    were introduced in 1991, farmers have shrunk in number from 110 million to 95.8
    million. That is a loss of nearly fifteen million farmers, or two thousand farmers
    per day.


    Through aggressive land grabs, farmers are losing their land. The overall amount
    of agricultural land across the world is shrinking, but it is also becoming increasingly
    concentrated in a few shareholdings in the hands of fewer large private entities.
    In the European Union, the top 1 percent of farms control 20 percent of EU farmland,
    and the top 3 percent of farms control 50 percent of EU farmland. Eighty percent
    of farms, presumably made up of small-scale farmers, control 14.5 percent of all
    farming land. The movement to large-scale farming has rapidly displaced farmers,
    and between 2007 and 2010, small-scale farmers owning less than ten hectares of
    Europe''s farmland—an area bigger than Switzerland, whereas farmers and companies
    owning more than fifty hectares have gained almost seven million hectares in the
    same period—an area twice the size of Belgium.


    In the United States, farmland is moving out of the hands of farmers, either because
    they are "too old" to farm or they have been forced to mortgage their land. Corporations
    are starting to buy up farmland, especially in areas dominated by large-scale
    industrial agriculture. According to a USDA report, 40 percent of farmland in
    the United States is rented by farmers from banks and investors. In states that
    are major industrial agriculture centers, including Iowa, Illinois, and California,
    the figure is as high as 50 percent.


    In India, land grabs for mines, highways, and sprawling cities have uprooted peasants
    and tribal people from their farms, farms, and homes. According to the Indian
    Ministry of Agriculture, India lost 16,000 km² (0.8 percent) of its farmland area
    in the ten-year period leading to 2010–2011. Much of this loss was at the expense
    of rural land and was added to cities, and the Indian Census Commissioner calculates
    for the same time period, the area under urban jumped by 24,000 km². As cities
    grow, neighboring agricultural areas shrink. The 284,000 suicides in India are
    linked to debt-induced land grabs. Farmers are being trapped into debt as corporations
    push costly seeds and chemicals under the illusory promise that farmers will earn
    more. When creditors come to take the land—because instead of farmers getting
    richer, they became indebted—farmers drink pesticide to end their lives.


    The assumption that big feeds the world and not small is leading to the destruction
    of the foundations of farming and of community that feed us, and thus destroying
    our food security base.


    It is time for the living economies of the small to join with living democracies
    of the small to create peace, harmony, abundance, and well-being for all. Gandhi
    responded to the bigness of the British Empire by pulling out the spinning wheel,
    hand-spinning his own clothes, and thereby rejecting machine-spun textiles imported
    from England, which themselves relied on cotton crops from India. In doing so,
    he sparked the Swadeshi movement, encouraging countless Indians to follow his
    example and reclaim textile production on a small scale. This small scale had
    big, rippling effects. As Gandhi said, “Anything that millions can do becomes
    with unique power. . . The wheel which is lifeless, but when I invest it with
    symbolism, it becomes a living thing for me.”


    Inspired by Gandhi’s spinning wheel, Navdanya started saving seeds and promoting
    agroecology, creating food security, livelihood security, and ecological security.
    The seed is small, but it is also the powerhouse of life. Working with small-scale
    farmers, we are creating food security, livelihood security, and ecological security.
    The seed is small, but it is also the powerhouse of life.


    The assumption that big feeds the world and not small is leading to the destruction
    of the foundations of farming and of community that feed us, and thus destroying
    our food security base.


    It is time for the living economies of the small to join with living democracies
    of the small to create peace, harmony, abundance, and well-being for all.

