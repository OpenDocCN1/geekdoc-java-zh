    The door to patents on seed and patents on life was opened by genetic engineering.
    By adding one new gene to the cell of a plant, corporations claimed they had invented
    and created the seed, and the plant, and that all future seeds were their property.
    Under this logic, GMO came came to mean God Move Over. While GMOs are presented
    as just another technology, they are the tool for creating a global system of
    control over our seed and food.


    Large corporations defined farmers’ acts of saving seed as a problem, which needed
    to be “fixed” by preventing farmers from saving and seed sharing. In order to
    do this, corporations began advocating for global intellectual property rights
    following the “success” of the Green Revolution. This is how the Trade-Related
    Aspects of Intellectual Property Rights (TRIPS) Agreement of the World Trade Organization
    was born in 1994.


    Article 27.3(b) of the TRIPS Agreement states:


    Parties may exclude from patentability plants and animals other than micro-organisms,
    and essentially biological processes for the production of plants or animals other
    than non-biological and microbiological processes. However, parties shall provide
    for the protection of plant varieties either by patents or by an effective *sui
    generis* system or by any combination thereof.


    This protection of plant varieties is precisely what prohibits the free exchange
    of seeds between farmers. Monsanto—one of the five big seed giants and the *only*
    corporation that has commercialized GMOs—acknowledges its role in drawing the
    TRIPS Agreement. In fact, Monsanto representative once famously stated that they
    were the “patient, diagnostician, [and] physician” all in one. The “disease” they
    diagnosed and sought to cure was that farmers saved seeds. The “cure” was that
    farmers should be prevented from saving and exchanging seeds by defining these
    fundamental freedoms as a crime. Simply put, TRIPS imposes patents on seeds, and
    patents allow corporations like Monsanto to prevent farmers from saving seeds.
    Today, Monsanto has patented 1,676 seeds, plants, and other applicable processes
    across the world.


    In 2007 Monsanto sued Vernon Hugh Bowman, an American farmer from Indiana, for
    reproducing patented seeds. But Bowman never bought'
