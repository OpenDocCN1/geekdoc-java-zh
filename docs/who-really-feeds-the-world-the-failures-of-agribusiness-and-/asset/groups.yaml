    Rejuvenating natural resources and creating meaningful work and sustainable livelihoods
    are objectives and outputs of good farming, and cannot be reduced to inputs. In
    the pseudoproductivity calculus, the logic is to minimize labor input to make
    productivity increase. This means displacing farmers. In a real productivity calculus—one
    that is based on the real, not on the abstract—creative work is maximized as an
    output to increase productivity. Real productivity must materialize all social,
    health, and ecological costs of chemical-, capital-, and fossil-fuel-intensive
    industrial agriculture, as well as the benefits of ecological agriculture for
    public health, social cohesion, and ecological sustainability. A real productivity
    calculus recognizes farmers'' rights. In an ecological and living world, farmers
