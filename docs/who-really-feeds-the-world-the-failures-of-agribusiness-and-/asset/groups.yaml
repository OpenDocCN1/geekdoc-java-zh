    # Introduction


    We are facing a deep and growing crisis rooted in how we produce, process, and
    distribute our food. The planet''s well-being, people''s health, and societies''
    stability are severely threatened by an industrial global agriculture driven by
    greed and profits. An inefficient, wasteful, and nonsustainable model of food
    production is pushing the planet, ecosystems, and its diverse species to the brink
    of destruction. Food, whose primary purpose is to provide nourishment and health,
    is today the biggest health problem in the world: nearly one billion people suffer
    from hunger and malnutrition, two billion suffer from diseases like obesity and
    diabetes, and countless others suffer from diseases, including cancer, caused
    by the poisons in our food.¹


    Instead of remaining a source of nourishment, food has been transformed into a
    commodity: something to be speculated on and profiteered from. This leads to rising
    food prices and creates social instability everywhere. Since 2007 there have been
    fifty-one food riots in thirty-seven countries, including Tunisia, South Africa,
    Cameroon, and India. The food system is badly on every measure that counts: sustainability,
    justice, and peace.


    Today, an alternative has become an imperative for our survival, so let us begin
    by asking the question, “Who feeds the world?”


    Food and agriculture have become sites for major paradigm wars. Under each paradigm,
    a certain type of knowledge, economics, culture, and, of course, farming is being
    promoted to feed the world; in reality, only one does.


    The dominant paradigm is industrial and mechanized, which has led to the collapse
    in our food and agricultural systems. This crisis is not an accident; it is built
    into the system''s very design. At the heart of this paradigm is the Law of Exploitation,
    which sees the world as a machine and nature as dead matter. This paradigm sees
    humans as separate from nature, and every part of nature as separable from the
    rest: the seed from the soil, the soil from the plant, the plant from the food,
    and the food from our bodies. The industrial paradigm is also based on seeing
    humans and nature'
  - '[PAGE 7]


    as mere inputs in a production system. The productivity of the Earth and its people
    is made invisible by a sophisticated intellectual infrastructure that puts the
    twin constructs of capital and corporations at the center of its economics.


    The paradigm of industrial agriculture is rooted in war: we very literally uses
    the same chemicals that were once used to exterminate people to destroy nature.
    It is based on the perception that every insect and plant is an enemy to be exterminated
    with poisons, and is constantly seeking new and more powerful instruments of violence,
    including pesticides, herbicides, and genetically engineered pesticide-producing
    plants. While the technologies of violence grow more sophisticated, the knowledge
    of ecosystems and biodiversity shrinks. The deeper the ignorance of the planet’s
    rich biodiversity and ecological processes, the greater the arrogance of corporate
    destroyers who claim to be creators. Life is thus redefined as an invention of
    those whose only desire and capacity is to poison and kill it.


    Tools governed by the Law of Exploitation and the Law of Domination harm people''s
    health and the environment. These tools are often marketed as “agrochemicals,”
    and we are told that farming is impossible without them. In reality the corporations
    that make these chemicals are shaping the paradigm of possibility. They define
    what constitutes scientific knowledge, what an efficient food production system
    looks like, and what the boundaries of research and trade should be. When applied
    to agriculture and the food system, a paradigm rooted in the violence of war and
    a militarized mindset brings the war to our fields, to our plates, and to our
    bodies.


    But there is another new, emerging paradigm, one that maintains continuity with
    time-honored ways of working together with nature and is governed by the Law of
    Return. Under this law, all living beings give and take in mutuality. This ecological
    paradigm of agriculture is based on life and its interconnectedness. It is centered
    on the Earth and small-scale farmers, and especially women farmers. It recognizes
    the potential of fertile seeds and fertile soils to feed humanity and diverse
    species to whom we are all related as Earth Citizens. Under this paradigm, the
    role of the human community is to act as cocreators and coproducers with Mother
    Earth. Within this paradigm, knowledge is not owned; rather, knowledge grows through
    farming, where we are all participants in the web of life.'
  - '[PAGE 8]


    ecological agriculture, the cycles of nature are intensified and diversified so
    as to produce more and better food, while using fewer resources. In ecological
    farming, the waste of the plants becomes food for farm animals and soil organisms.
    Adhering to the Law of Return, there is no waste; everything is recycled.


    Ecological food systems are local food systems, growing what they can, exporting
    real surpluses, and importing what cannot be grown locally. Sustainability and
    justice flow naturally from the Law of Return and from the localization of food
    production. The resources of the Earth that are vital to the maintenance of life,
    such as biodiversity and water, are managed as a “commons,” or shared spaces for
    communities. The ecological paradigm cultivates compassion for all beings, including
    humans, ensuring that no one is deprived of his or her share of food.


    Today, the industrial paradigm is in deep conflict with the ecological paradigm,
    and the Law of Exploitation is pitted against the Law of Return. These are paradigm
    wars of economics, culture, and knowledge, and they frame the very basis of the
    food crisis we are facing today.


    Who feeds the world?” The answer depends on which paradigm we use as our lens,
    because the meaning of “food” and “world” vastly differs between the two. First,
    let’s examine this from the perspective of the dominant paradigm: industrial,
    mechanized agriculture. Under this paradigm, “food” is a mere commodity to be
    produced and traded for profits, and the “world” is a global marketplace where
    seeds and chemicals are as farming inputs and commodities are as food. If the
    planet is seen through this lens, it is chemical fertilizers and pesticides, corporate
    seeds and GMOs, agribusiness, and biotechnology corporations that feed the world.


    Yet the reality is that only 30 percent of the food that people eat comes from
    large-scale industrial farms. The other 70 percent comes from small farmers working
    on small plots of land. Meanwhile, industrial agriculture accounts for 75 percent
    of the ecological damage being done to the planet. These figures are routinely
    ignored, hidden, denied, and the myth that industrial agriculture feeds the world
    is promoted worldwide.'
- md: '

    A mechanized, violent paradigm shapes dominant views around the knowledge, science,
    technology, and policies for food and agriculture. In reality, a food system that
    destroys nature’s economy—the ecological foundation on which food production rests—cannot
    feed the world. An agricultural system designed to displace small-scale farmers,
    who form the social foundation of real farming, cannot feed the world. Every aspect
    of industrial agriculture is rupturing the fragile web of life and destroying
    the foundations of food security.


    Industrial agriculture is killing pollinators and friendly insects. Years ahead
    of his time, Einstein cautioned, “When the bee disappears, humans will disappear.”
    Today 75 percent of bee populations in some regions have been killed over the
    last three decades because of toxic pesticides. Chemical pesticides kill beneficial
    insects and, in their place, create pests. Synthetic fertilizers destroy soil
    by killing organisms that naturally create living soil, and, in turn, contribute
    to soil erosion and soil degradation.


    Industrial agriculture mines and pollutants water. Seventy percent of the water
    on the planet is depleted and polluted by the intensive irrigation that is required
    in chemical-intensive industrial agriculture. The nitrates in water from industrial
    farms are creating “dead zones” in the oceans: spaces where no life can exist.


    Industrial agriculture is primarily a fossil-fuel driven agriculture. Replacing
    people with fossil fuels has been made to look more efficient under a logic that
    treats people as raw material or farming inputs. But the financial and ecological
    costs of fossil fuels are astronomical. In US agriculture, each worker has more
    than 250 hidden energy slaves behind her. An energy slave is the fossil-fuel equivalent
    to a person, and if we take into account the fossil-fuel intensity of our food
    production and consumption systems, it is all clear that industrial agriculture
    consumes more than it produces. As Amory Lovins pointed out, “In terms of workforce,
    the population of the earth is not 4 billion but about 200 billion, the important
    point being that about 98 percent of them do not eat conventional food.” That
    is because they’re not people; they’re energy slaves, and they eat oil. Industrial
    agriculture uses ten units of fossil fuel energy as an input to produce one unit
    of food as an output. The wasted energy goes toward polluting the atmosphere and
    destabilizing our climate.


    The industrial paradigm of agriculture is causing climate change. Forty percent
    of all greenhouse gas emissions responsible for climate change come from a fossil-fuel-based
    global system of agriculture. The fossil fuels used to make fertilizers, run farm
    machinery, and wastefully move food thousands of miles across the globe contribute
    to carbon dioxide emissions. Chemical nitrogen fertilizers emit nitrous oxide,
    which is 300 percent more destabilizing the climate than carbon dioxide. Additionally,
    factory farming is a major source of methane, another toxin responsible for global
    warming. In 1995 the United Nations calculated that industrial agriculture had
    pushed more than 75 percent of agro-biodiversity—the biodiversity found in agriculture—to
    extinction. Today, the number is likely to have reached 90 percent.


    Paradoxically, while this ecological destruction of natural capital is justified
    in terms of “feeding people,” the problem of hunger has grown. One billion people
    are permanently hungry, and another two billion suffer from food-related diseases
    like obesity. These conditions are two sides of the same coin: a nutrition crisis.
    As the McDonaldization of food spreads processed junk across the globe, even those
    who do get enough to eat are rarely getting the nutrients they need. Contrary
    to popular belief, obesity isn''t about people eating too much: it''s often the
    poor in developing countries who bear the harshest of diet-related diseases. Additionally,
    diseases linked to an industrial diet and poisons in our food, including cancer,
    are steadily growing. Commodities don''t feed people; food does.


    Even though the corporate industrial agriculture system creates hunger, even though
    it contributes only 25 percent to the food system using 75 percent of the Earth’s
    resources, and even though it is a dominant force of ecological destruction and
    a disruption of the natural systems on which food production depends, the myth
    that industrial agriculture feeds the world continues to be perpetuated. This
    myth is constructed on the basis of an obsolete paradigm, one that, in fact, has
    been discarded by science. False ideas of nature as dead matter and as something
    that can be manipulated by humans have allowed us to think that the more poisons
    we put into the food system, the more food we grow. An ecologically destructive
    and nutritionally inefficient food system has become the dominant paradigm in
    our minds and the most touted practice on our lands, even though, in reality,
    small, biodiverse farms working with nature’s processes produce most of the food
    we eat.


    Industrial agriculture is intolerant of diversity. Diversity is nourishing and
    naturally resistant, but in order to increase profits, industrial agriculture
    makes crops dependent on external inputs such as chemical fertilizers, pesticides,
    herbicides, and genetically modified seeds. Not only does industrial agriculture
    look more and more like chemical warfare against the planet, the distribution
    of food also looks like war, with so-called “free trade” treaties pitting farmer
    against farmer, and country against country, in perpetual “competition” and conflict.
    Free trade allows corporations and investors to grab every seed, every drop of
    water, and every inch of land; it limitlessly exploits the Earth, the farmers,
    and all citizens. This model sees profits as the endgame, where no thought or
    care is given for the soil, for producers, and for people''s health. Corporations
    do not grow food; they grow profits.


    The industrial paradigm replaces truths with manipulation, and reality with fictions.
    The first fiction is the fiction of the corporation as a person. Acting under
    this guise of personhood, corporations write the rules of production and trade
    to maximize their profits and exploit living beings. A second fiction is that
    “capital”—not the ecological processes of nature and the hard and intelligent
    work of farmers—creates wealth and food. People and nature are reduced to mere
    inputs. The third fiction is that a system that more inputs than it produces is
    efficient and productive. This is manipulated by hiding the financial costs of
    and and. A fourth fiction is that which profitable to corporations is good for
    the planet. The fifth fiction is that food is a commodity. The reality is the
    more food is converted into commodity, the more it is taken from the poor, and
    the more it is degraded in quality.


    What we are talking about here is not a food system—it is into conflict and thrown
    away as waste. The result is ecological catastrophe, poverty, and hunger. The
    future of food depends on remembering that the web of life is a food web. This
    book is dedicated to this remembering, because forgetting the ecology of food
    is a recipe for famine. Over the past three decades I have realized that our current
    food system is broken. In 1984 I began studying the Green Revolution in Punjab.
    The Green Revolution is the misleading name given to a chemical-based agricultural
    model that was introduced to India in 1965. Following World War II, chemical companies
    and factories were searching desperately for new markets for synthetic fertilizers
    and factories of the war. Indigenous varieties of crops rejected the artificial
    fertilizers, so plants were redesigned as dwarf varieties to allow them to take
    up—and become upon—chemicals. By the mid-1960s, this new seed/chemical package
    was ready to be exported to countries in the Global South under the label of the
    Green Revolution.


    The false narrative perpetuated by the Green Revolution is essential to understanding
    the dominant narrative that has been created around food and agriculture. This
    narrative credits the Green Revolution with pulling India out of starvation, for
    which Norman Borlaug—the leading scientist on the project—was awarded the Nobel
    Peace Prize in 1970. But there was no starvation in India in 1965. Food prices
    had risen in cities due to a nationwide drought, and the country needed to import
    food grains. But under a policy to promote chemicals in agriculture, a condition
    was created by the US government and the World Bank under which grains would be
    sent to India only if it imported seeds and chemicals.


    There was a huge gap between the Green Revolution’s narrative of success and the
    realities in Punjab. Reduced to a land of rice and wheat, Punjab producing less
    food and nutrition as a result of industrial agriculture. Once farmers in Punjab
    grew forty-one varieties of wheat, thirty-seven varieties of rice, four varieties
    of maize, eight varieties of bajra, sixteen varieties of sugarcane, nineteen varieties
    of pulses, and nine varieties of oilseeds. The majority of this diversity was
    destroyed. In the place of wheat grains with names like Sharbati, Darra, Lal Pissi,
    and Malwa, which described the origins and quality of the crops, we find personality-less
    monocultures named HD 2329, PBW 343, and WH 542.

