    other hand, uses 70 percent of the world''s arable land to produce a mere 30 percent
    of the food.


    So who really feeds the world? The numbers speak loud and clear.


    Today, small-scale farmers are in crisis. They are being wiped out by the rules
    of corporate globalization, designed to maximize corporate profits at the cost
    of small-scale farmers. Corporations sell costly inputs in the form of seeds and
    chemicals to farmers, and buy their produce at cheap prices. Farmers are locked
    into debt, and farming is made untenable, leading to a massive exodus from the
    countryside to urban slums. Since the policies of globalization of agriculture
    were introduced in 1991, farmers have shrunk'
  - '[PAGE 75]


    in number from 110 million to 95.8 million. That is a loss of nearly fifteen million
    farmers, or two thousand farmers per day.


    Through aggressive land grabs, farmers are losing their land. The overall amount
    of agricultural land across the world is shrinking, but it is also becoming increasingly
    concentrated in a few shareholdings in the hands of fewer large private entities.
    In the European Union, the top 1 percent of farms control 20 percent of EU farmland,
    and the top 3 percent of farms control 50 percent of EU farmland. Eighty percent
    of farms, presumably made up of small-scale farmers, control 14.5 percent of all
    farming land. The movement to large-scale farming has rapidly displaced farmers,
    and between 2007 and 2010, small-scale farmers owning less than ten hectares of
    Europe''s farmland—an area bigger than Switzerland, whereas farmers and companies
    owning more than fifty hectares have gained almost seven million hectares in the
    same period—an area twice the size of Belgium.


    In the United States, farmland is moving out of the hands of farmers, either because
    they are "too old" to farm or they have been forced to mortgage their land. Corporations
    are starting to buy up farmland, especially in areas dominated by large-scale
    industrial agriculture. According to a USDA report, 40 percent of farmland in
    the United States is rented by farmers from banks and investors. In states that
    are major industrial agriculture centers, including Iowa, Illinois, and California,
    the figure is as high as 50 percent.


    In India, landgrabs for mines, highways, and sprawling cities have uprooted peasants
    and tribal people from their farmers, farms, and homes. According to the Indian
    Ministry of Agriculture, India lost 16,000 km² (0.8 percent) of its farmland area
    in the ten-year period leading to 2010–2011. Much of this loss was at the expense
    of rural land and was added to cities, and the Indian Census Commissioner calculates
    for the same time period, the area under urban jumped by 24,000 km²,As cities
    grow, neighouring agricultural areas shrink. The 284,000 suicides in India are
    linked to debt-induced landgrabs. Farmers are being trapped into debt as corporations
    push costly seeds and chemicals under the illusory promise that farmers will earn
    more. When creditors come to take the land—because instead of farmers getting
    richer, they became indebted—farmers drink pesticide to end their lives.'
  - '[PAGE 76]


    The assumption that big feeds the world and not small is leading to the destruction
    of the foundations of farming and of community that feed us, and thus destroying
    our food security base.


    It is time for the living economies of the small to join with living democracies
    of the small to create peace, harmony, abundance, and well-being for all. Gandhi
    responded to the bigness of the British Empire by pulling out the spinning wheel,
    hand-spinning his own clothes, and thereby rejecting machine-spun textiles imported
    from England, which themselves relied on cotton crops from India. In doing so,
    he sparked the Swadeshi movement, encouraging countless Indians to follow his
    example and reclaim textile production on a small scale. This small scale had
    big, rippling effects. As Gandhi said, “Anything that millions can do becomes
    with unique power. . . The wheel which is lifeless, but when I invest it with
    symbolism, it becomes a living thing for me.”


    Inspired by Gandhi’s spinning wheel, I started Navdayanya for saving seeds and
    promoting organic farming during an era when giant corporations are concentrating
    their control on the seed and on our food. Working with small-scale farmers, we
    are creating food security, livelihood security, and ecological security. Connecting
    the small seed and the small-scale farmers in ever-expanding circles of cooperation,
    we are creating a paradigm shift to an old understanding that must be made new
    again: small is big.


    The seed is small, but it is also the powerhouse of life and freedom. Each of
    us can be savers of seeds and growers of living food, and we can support the millions
    of small-scale farmers and growers across the world who put food on our plates
    and inject life into the earth. Recently, and despite the FAO’s findings, its
    director general, José Graziano da Silva, coauthored an article with Suma Chakrabarti,
    the president of the European Bank for Reconstruction and Development (EBRD),
    where they called upon people to “fertilize this land with money.” But it is organic
    matter, and the love, care, and intelligence of small-scale farmers that fertilize
    the soil, not money.


    In Rumi’s earth


    in this earth


    in this earth'
  - '[PAGE 77]


    in this immaculate field

    we shall not plant any seeds

    except for compassion

    except for love'
  - '[PAGE 78]


    # 6

    Seed Freedom Feeds the World, Not Seed Dictatorship


    We don''t sell seed; we sell profit.

    —SHRIMIR BIOSEED GENETICS CORPORATE LITERATURE


    Seed is the first link in the food chain and the repository of life’s future evolution:
    it is the very foundation of our being. Seeds have evolved freely over millennia
    and given us diversity and richness of life on the planet. For thousands of years,
    farmers, and especially women, have evolved and bred seed freely with each other
    and with nature. Farmers’ seeds carry within them the knowledge of an agroecological,
    connected web of food and life.


    In last half century, a reductionist, mechanistic paradigm has laid down the legal
    and economic framework for privatizing seeds and the knowledge of seeds. This
    has destroyed diversity, denied farmers’ innovation and breeding rights, enclosed
    the biological and intellectual commons through patents, and created seed monopolies.


    This destruction has been made possible by a systemic discrediting of farmers’
    native seed varieties. These seeds have been developed by farmers over centuries
    to suit their ecological, nutritional, taste, medicinal, fodder, fuel, and other
    needs. But because corporations want to control, adapt, and genetically modify
    seeds for their own profit, farmers’ varieties are being called “primitive cultivars”
    and are contrasted with “elite cultivars”, or those seeds evolved by scientists,
    or the “elite.”


    reducing farmers’ varieties to a genetic meme, which can then be stolen, extracted,
    and patented by large companies. Not is only the negation of farmers’ breeding
    unfair and to farmers, it is unfair and unjust to society as a whole, because
    farmers’ varieties have taste, nutrition, and quality. That is why wherever heirloom
    or traditional varieties have been saved and cultivated, people prefer them to
    hybrids and GMOs.'
- md: '

    These indigenous farmers'' varieties can be saved and replanted year after year.
    Globally, more than 1.4 billion people depend on farm-saved seed as their primary
    seed source. In order for agribusinesses to make profits, they must rupture this
    self-sustaining, nutritious system of food production. Farmers'' varieties are
    therefore being replaced by three new seed varieties: high-yielding varieties
    (HYVs), hybrid seeds, and GMOs.


    HYVs, as we have seen, are in fact response varieties, and are heavily dependent
    on chemicals and fertilizers. HYVs are also vulnerable to disease and pests; although
    farmers may initially be able to save them, they need to be replaced after one
    or two crops. To do this, farmers have to buy new seeds.


    Hybrid seeds are first-generation seeds produced from crossing two genetically
    dissimilar plant species. The progeny of these seeds cannot be saved or replanted,
    because the next generations will give much lower yields. Hybrid seeds force farmers
    to go to the market every season. Hybrid seeds lay the foundations for the biological
    patenting of the seed. No one else, nor rival company, can produce the same seeds
    unless they know the parent lines, which are company secrets. Combined with the
    introduction of new laws, this biological patenting effectively prevents the farmer
    from multiplying, saving, and selling seeds.


    GMOs, or genetically engineered organisms, are made by using the technique of
    gene splicing or recombinant DNA to introduce genes from an unrelated organism
    into the cells of a plant. This is done by one of two methods: using a gene gun
    to shoot the gene, or introducing a plant cancer called agrobacterium to infect
    the plant. Since both techniques are unreliable, an antibiotic-resistance gene
    is added to the cells that absorbed the new gene from those that did not. Further,
    since the gene is not part of the plant genome, there is a tendency for the plant
    to not express the traits for which the gene was introduced. For instance, genes
    of viruses are added as promoters so the plant is more likely to express the traits.
    In this way, every GMO has four characteristics: genes that do not belong to the
    plant, genes for plant cancer, genes for antibiotic-resistance markers, and the
    genes of viruses that act as promoters. This bundle of genes causes harm to the
    plant, to biodiversity, and to those who eat it.


    Another newer type of GMO is the terminator seed. Terminator seeds are genetically
    engineered seeds that release a lethal toxin that kills the embryo of the seed,
    making sterile. Monsanto owns the patent on terminator technology together with
    the US Department of Agriculture. There was an attempt to commercialize terminator
    technology a few years ago, but a global campaign, of which I was a part, had
    a moratorium on these seeds through the UN Convention on Biological Diversity.


    Corporations say that GMOs are substantially equivalent to non-GMO crops and food,
    but the same corporations simultaneously claim that GMOs are new and different,
    that they are inventions. Under this logic, the same GMO is natural when it comes
    to avoiding responsibility for safety, but it is different from the natural—or
    unnatural—when it comes to owning it. It is ontological schizophrenia. GMOs have
    been introduced with only one purpose: to sow seeds and life-forms through. In
    this way, GMOs become both a source of control and a source of profits through
    royalty collection.


    The diversity of farmers'' seeds has been rendered invisible in a process that
    began with the Green Revolution. Instilling the assumption that farmers'' seed
    varieties are “empty,” today Green Revolution agriculture is continued through
    corporate industrial breeding that continues to give us seeds and crops that are
    not only nutritionally empty, but also loaded with toxins.


    The shift to HYVs, hybrid seeds, and GMOs has meant that from once a free resource
    reproduced on farms, seeds have been transformed into costly inputs that farmers
    now need to purchase. Countries have been forced to take international loans to
    help the new seeds, and farmers have had to obtain credit from banks to use them.
    International agricultural centers—like the CIMMYT (International Maize and Wheat
    Improvement Center) in Mexico, and the IRRI (International Rice Research Institute)
    in the Philippines, which later became part of the World Bank—run centers of agricultural
    research—are launching pads for their new seeds.


    Twenty years ago there were thousands of seed companies, most of which were small
    and family-owned. Today, the top ten global seed companies control one-third of
    the $23 billion in the commercial seed trade.¹ Multinational seed companies are
    seeking absolute control of seed, and through control over seed, control over
    the food system. If all farmers, who are the original breeders, could be forced
    into the market every year, the seed industry would have a market worth trillions
    of dollars.


    Every seed is an embodiment of millennia of nature’s evolution and centuries of
    farmers’ breeding. It is the distilled expression of the intelligence of the Earth
    and the intelligence of farming communities. Farmers have bred seeds for diversity,
    resilience, taste, nutrition, health, and adaption to local agroecosystems.


    On the other hand, industrial breeding treats nature’s contributions and farmers’
    contributions as nothing. As the jurisprudence of *terra nullius* defined the
    land as empty and allowed mass colonization by imperial European countries, the
    jurisprudence of intellectual property rights related to life-forms is *bio nullius*:
    life as empty. The Earth is defined as dead matter, it cannot create. And farmers
    have empty heads, so they cannot breed plants.


    Peruvian anthropologist and poet José María Arguedas writes in “A Call to Certain
    Academics”:


    > “We say that we do not know anything. That our head needs changing for a better
    one. They say that some learned men are saying this about us. These academics
    who reproduce themselves in our own lives. What is on the banks of these rivers,
    Doctor? Take out your binoculars and your spectacles. Look if you can. Five hundred
    flowers from five hundred different types of potato grow on the terraces above
    abysses that your eyes don’t reach. Those five hundred flowers are my brain, my
    flesh.”


    In a bid to *bio nullius* through the Law of Domination and Exploitation, corporations
    claim themselves the “creators” of seed. By doing so, farmers’ right to save and
    share is now defined as “theft,” or an “intellectual property crime.”


    The door to patents on seed and patents on life was opened by genetic engineering.
    By adding one new gene to the cell of a plant, corporations claimed they had invented
    and created the plant, and that all future seeds were their property. Simply put,
    TRIPS imposes patents on seeds, and patents allow corporations like Monsanto to
    prevent farmers from saving seeds.


    In 2007 Monsanto sued Vernon Hugh Bowman, an American farmer from Indiana, for
    reproducing patented seeds. But Bowman never bought

