    土壤持水能力提高了20%。这使得土壤对干旱更具韧性。有蚯蚓的土壤排水速度比没有蚯蚓的土壤快十倍，这使得土壤具有抵御洪水的能力。在每平方米有机土壤中，可以有三十到三百只蚯蚓。


    除了蚯蚓、真菌和细菌外，每克土壤中含有一万到十万个绿藻和蓝藻细胞。每平方米有机土壤中可以发现一千到十万只螨、蜘蛛、蚂蚁、甲虫、蜈和马陆。土壤微生物越多，土壤就越健康；它越肥沃，保水能力越，越不容易受到侵蚀。


    氮是农业生产中的重要组成部分，因为它有助于植物制造食物。为了利用氮，必须在一个过程中将其从大气中“固定”，转化为铵。在工厂中，通过消耗大量的化石燃料和能量从空气中固定氮。在有机耕作中，不同植物并排生长，豌豆和豆类等固氮作物为我们提供了免费的氮。植物与根瘤菌有共生关系，根瘤菌是土壤中的细菌，进入植物根部帮助它们通过生物固氮作用从空气获取氮。


    此外，在有机农业中，许多植物品种能为我们提供天然绿肥。例如，合欢、刺槐和白草可以极大提高土壤肥力。这些在传统农业中通常被用绿篱种植，但在工业单一种作物中无处可见。它们非常有效，作为绿篱的刺槐，每公顷每年每年可产生多达6-8吨的生物质或有机物。工业农业的支持者反复告诉我们，有机农业是不可能的，因为没有足够的有机物。但通过绿肥，我们可以产生大量的有机氮和有机物，这些可以取代那些通过杀死土壤微生物而耗尽土壤肥力的合成肥料。


    生态农业基于有机物的循环，因此也是养分的循环。它基于“报答律”，将养分归还给土壤，而不是简单地从中提取营养。只取不予是对土壤的掠夺，是盗窃行为，“一种尤为卑劣的盗窃行为，因为它涉及掠夺那些尚未出生、无法保卫自己的后代。”¹¹”


    阿尔伯特·霍华德爵（Sir Albert Howard）在《农业遗嘱》中写道：


    西方施肥的特点是使用人工肥料。第一次大大战期间从事固氮以制造炸药的工厂必须寻找其他市场，农业中氮肥的使用不断增加，直到今天，大多数农民和市场园艺者的经营计划都基于市场上最廉价的氮（N）、磷（P）和钾（K）形式。这可以方便地描述为实验站和农村地区盛行的“NPK心态”耕作。在国家紧急关头根深蒂固的利益集团已占据了据足地。¹²


    在工业农业的范式中，土壤被视为死物质：一个倾倒合成肥料（尤其是NPK）的空容器。尽管植物和土壤的健康生长需要三十三种元素，这种做法依然在进行。由于其根在水中，这些合成肥料持续着我们对活体土壤的战争。


    菌根细菌和蚯蚓在施用化学肥料后无法生存。肥料会堵塞向植物提供养分和水的土壤毛细管。雨水渗透被停止，径流增加，土壤面临干旱，需要不断增加灌溉和不断增加用于抽取地下水的化石燃料。


    施用的氮肥三分之二没有被植物吸收；相反，硝酸盐污染破坏了地下水。它还污染了地表水，导致河流湖泊的富营养化（过肥），并在沿海水域形成死区。大部分氮肥以一氧化氮的形式逸入大气，其大气寿命为166年，对大气的损害是二氧化碳的三百倍。尽管化学公司想让我们相信某些事情，但事实是，固氮作物提供的氮足以替代合成肥料。

