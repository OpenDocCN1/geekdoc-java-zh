    abundance by focusing on saving seeds, giving back to the soil, nurturing biodiversity,
    and protecting our small-scale farmers and women. We must stop impoverishing our
    beautiful planet. It is in our hands to sow the seeds of hope for a food system
    that works for the health and well-being of the planet and all its people.'
