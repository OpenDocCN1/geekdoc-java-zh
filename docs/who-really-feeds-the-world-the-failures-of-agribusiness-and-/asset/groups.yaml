    In addition to earthworms, fungi, and bacteria, between ten thousand and one hundred
    thousand green and blue algae cells are found per gram of soil. Between one thousand
    and one hundred thousand mites, spiders, ants, beetles, centipedes, and millipedes
    are found per square meter of organic soil. The more soil organisms present, the
    healthier the soil; it is more fertile, retains more water, and is less prone
    to erosion.


    Nitrogen is an essential component of farming because it helps plants make their
    food. In order for nitrogen to be used, it must be “fixed” from the atmosphere
    in a process that converts it to ammonium. In factories, nitrogen is fixed from
    the air with huge amounts of fossil-fuel and energy use. In organic farming, where
    different plants grow by side, nitrogen-fixing crops like peas and legumes give
    us free nitrogen. plants have a symbiotic relationship with rhizobia, which are
    bacteria in the soil that enter plant roots and help them access nitrogen from
    the air through biological nitrogen-fixing.


    Additionally, in organic farming there are many plant species that give us natural
    green manure. Sesbania, glicidia, and crotalaria, for example, can increase soil
    fertility immensely. These are usually grown as hedges in traditional agriculture,
    though they are nowhere to be seen in industrial monocultures. They are very effective,
    glicidia, as a hedge, can yield biomass or organic matter of up to 6–8 tons per
    hectare per year. Proponents of industrial agriculture repeatedly tell us that
    organic farming is not possible because there is not enough organic matter. But
    with green manures we can produce huge amounts of organic nitrogen and organic
    matter, which can replace the synthetic fertilizers that deplete soil fertility
    by killing soil organisms.


    Ecological agriculture is based on recycling organic matter, and hence recycling
    nutrients. It is based on the Law of Return and giving nutrients back to the soil,
    not simply taking nutrition out of it. Taking without giving is a robbery of the
    soil and a banditry, “a particularly mean of'
  - '[PAGE 36]


    banditry, because it involves the robbing of future generations which are not
    here to defend themselves.\"¹¹"


    Sir Albert Howard writes in An Agricultural Testament:


    The feature of the manuring of the West is the use of artificial manures. The
    factories engaged during the Great War in the fixation of nitrogen for the manufacture
    of explosives had to find other markets, the use of nitrogenous fertilizers in
    agriculture increased, until today, the majority of farmers and market gardeners
    base their manorial programme on the cheapest forms of nitrogen (N), phosphorus
    (P), and potassium (K) on the market. What may be conveniently described as the
    NPK mentality farming in the experimental stations and in the countryside. Vested
    interests, entrenched in time[s] of national emergency, have gained a stronghold.\¹²


    In the industrial agriculture paradigm, soil is seen as dead matter: an empty
    container for pouring synthetic fertilizers, especially NPK. This is done despite
    the fact that plants and soils need thirty-three elements for healthy growth.
    With their roots in water, these synthetic fertilizers continue our war against
    our living soil.


    Mycorrhizae bacteria and earthworms do not survive the application of chemical
    fertilizers. Fertilizers block the soil capillaries, which supply nutrients and
    water to plants. Infiltration of rain is stopped, runoff increases, and soil faces
    droughts, requiring ever-increasing irrigation and ever-increasing fossil fuels
    for pumping groundwater.


    Two-thirds of the nitrogen fertilizer applied is not taken up by the plant; instead,
    it contaminates groundwater with nitrate pollution. It also contaminates surface
    waters, leading to eutrophication (overfertilization) of rivers and lakes, and
    creates dead zones in coastal waters. Large parts of nitrogen fertilizer escape
    into the air as nitrous oxide, which has an atmospheric life of 166 years and
    is three hundred times more damaging to the atmosphere as carbon dioxide. In spite
    of what the chemical companies would like us to believe, the reality is that nitrogen-fixing
    crops can provide'
  - '[PAGE 37]


    enough nitrogen to substitute for synthetic nitrogen. Ecological alternatives
    that create, maintain, and rejuvenate living soils do so at zero cost, and are
    much more effective in increasing soil fertility and agricultural fertility than
    industrial fertilizers.


    While destroying the sources of soil fertility and destabilizing the climate,
    synthetic fertilizers also waste financial resources through high costs and public
    subsidies. The global annual consumption of fertilizers is 164.4 million metric
    tons, which consist of 105 metric tons of nitrogen, 37.9 metric tons of phosphorus,
    and 21.5 metric tons of potash. On the other hand, earthworm castings—what earthworms
