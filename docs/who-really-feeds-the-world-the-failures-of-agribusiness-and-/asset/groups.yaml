    Both the organic movement—toward chemical-free, pesticide-free, GMO-free farming—as
    well as the environmental movement—against climate change—are trying to create
    a poison-free world. The imperative to spread poisons is not an ecological imperative
    for how nature works, is it a socioeconomic imperative for creating thriving economies.
    Rather, it is only an imperative for corporate profits, which have their roots
    in poisons from war. These corporations have subsequently become addicted to the
    profits as well as a militarized mindset and paradigm of knowledge that make poisons
    appear essential for pest control, and by extension, feeding the world.


    But as we have seen, there are poison-free ways of farming that are not only possible
    but successful. Breaking out of the poison cycle is crucial to protecting our
    health and our biodiversity, which are under threat from pesticides and pesticide-producing
