    the creation of hunger. Agricultural policies that push the small-scale farmer
    to destination on the one hand and promote cash cropping on the other have resulted
    in lowered food production. There has been a steady decline in food production
    since the early 1990s as a result of the thrust toward export-oriented agriculture.
    The collapse of domestic support for food production (through dismantling import
    barriers, the rising costs of inputs, and crop failure due to uncertified seeds)
