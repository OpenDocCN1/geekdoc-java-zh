    # 4

    # Biodiversity Feeds the World, Not Toxic Monocultures


    More than seven thousand species have fed humanity throughout history: a remarkable
    indication of the biodiversity on our planet. In a biodiverse farming system,
    thousands of insects pollinate our crops and give us food. Friendly insects control
    pests by maintaining a natural pest-predator balance. Millions of small organisms
    work to create life and fertility in the soil. Fertile and healthy soils give
    us abundant and healthy food. On a biodiverse farm, ecosystem, or planet, the
    food web is one of life.


    But today, thirty crops provide 90 percent of the calories in the human diet,
    and only three species—rice, wheat, and maize—account for more than 50 percent
    of our calorie intake. According to the State of the World''s Plant Genetic Resources
    for Food and Agriculture, the 7,098 apple varieties documented in the United States
    in the beginning of the twentieth century, 96 percent have been lost. Additionally,
    95 percent of the cabbage, 91 percent of the field maize, 94 percent of the pea,
    and 81 percent of the tomato varieties have also been lost. In Mexico, all the
    varieties of corn reported in 1930, only 20 percent exist today.


    The loss of biodiversity in our food and on our land is because industrial agriculture
    systems promote monocultures. Monocultures are based on the cultivation of only
    one variety of crop, which is bred to respond to externally applied chemicals
    or toxins.


    The rapid erosion of biodiversity has taken place under a food system that sees
    farms as factories for commodities rather than webs of food production and life.
    These factories run on chemicals that were once designed for warfare, and are
    destroying the diverse species that have flourished on our planet for millennia.
    Biodiversity increases the stability of ecosystems and their ecological functions,
    whereas a reduction in the number of genes, species, and groups of organisms reduces
    the efficiency and resilience of whole communities.'
  - '[PAGE 55]


    Three forces have driven the disappearance of biodiversity across the world, and
    all three are connected to the corporate control over seed. The first is the entry
    of big business into the seed market, which has displaced local diverse varieties
    evolved by farmers with uniform, commercial hybrids and GMOs engineered and sold
    by corporations. Whereas once we had differently shaped, nutritious, and seasonal
    fruits, today we have uniform varieties available all year round. The second factor
    is globalization-driven long-distance trade. Diversity goes in hand with local,
    decentralized food systems, but in a global food system, freshness and softness
    are replaced by hardness, so that fruits can travel. We are breeding rocks, not
    fruit. The third factor is industrial processing, which leads to companies like
    McDonald''s and PepsiCo replacing nutritious, local dishes with junk-food commodities.
    This influences what crops grow. For example, juicy, tasty tomatoes disappear
    to make way for hard, tasteless ones because tomato ketchup requires the latter.
    Today, every cuisine deserves to be recognized as cultural heritage before it
    is wiped out.


    Biodiversity, food variety, and cultural diversity go hand in hand. Tribals in
    the heartland of India evolved two thousand rice varieties from one wild grass:
    Oryza sativa. Rice is their life, rice is their food, and rice is their culture.
    I joined them at Atki, the festival that marks the beginning of the agricultural
    cycle where they bring their diverse rice varieties, offer them to the village
    deity, share them with each other, and then sow the rice in their fields. Or take
    Mexico, where thousands of years ago, peasants decimated a wild plant that transformed
    and evolved it into the diversity of thousands of corn varieties. Mexicans are
    the people of corn: corn is their identity, their food, and their culture.


    The corporate control of seed that has eroded biodiversity is a result of a paradigm
    of production based on uniformity and monocultures: what I have called Monocultures
    of the Mind. A Monoculture of the Mind imposes one way of knowing—reductionist
    and mechanistic—on a world with a diversity and plurality of knowledge systems.
    These knowledge systems include the knowledge and expertise that come from practice,
    experience, and working with nature as a partner: the knowledge of women and workers,
    and of farmers and peasants. These knowledge systems are multiple and diverse.
    But as ecological biodiversity is replaced by monocultures of food and crops that
    can be commodified and patented for'
