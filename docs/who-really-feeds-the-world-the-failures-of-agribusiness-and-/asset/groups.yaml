    关注点在于每亩产量而非每亩营养价值，但事实上，工业化农业导致每亩营养价值的下降。第三，工业化育种（包括基因工程）对自然资源的利用极其密集且浪费。如果根据资源利用来定义生产力，那么工业化农业的生产力极低，它通过消耗那些在可持续生产系统中本可以直接用于生产更多食物的资源，损害了粮食安全。第四，也是至关的一点是，单一种作物中的化学强化和基因工程所产生的食物少于基于生物多样性强化的生态替代方案。


    根据粮食生产的主导范式，多样性阻碍生产力。这导致了对统一性和单一种作物的迫切需求，并产生了一个悖论局面：现代植物的“改良”建立在破坏其随后作为原料使用的生物多样性的基础之上。动植物育种的讽刺之处在于，它破坏了技术赖以生存的基石。林业发展计划引入了桉等工业物种的单一种林，并将曾经满足当地需求的当地物种多样性推向灭绝。农业现代化方案将新的新的、统一的作物引入农民田间，破坏了当地品种的多样性。畜牧业现代化则破坏了多肉品种并引入了工厂化养殖。


    这种基于破坏多样性来增加生产力的策略是危险且不必要的。单一种作物在生态和社会上都是不可持续的，因为它们同时破坏了自然经济和人类经济。在农业、林业、渔业和畜牧业中，生产正不断被推向破坏多样性的方向。因此，基于统一性的生产成为生物多样性保护以及生态和社会经济可持续性的主要威胁。


    多样性必须首先成为生产的逻辑，才能被保护。如果生产继续基于统一性和同质化的逻辑，统一性将继续取代多样性。从企业观点或西方农业或林业研究的观点来看，“改良”往往对全球南方而言是一种损失，特别是对全球南方的贫困地区而言。农业中的植物改良一直以牺牲不需要的植物部分为代价，增加目标产品的产量。然而，“目标”产品对于农业企业和农民来说是不相同的，而一个农耕系统中的哪些部分被视为“不需要的”，取决于个人所属的阶级、种姓或性别。对于农业企业而言不需要的特性，可能是穷人所需要的，而通过挤压这些生物多样性的方面，“农业发展”助长了贫困和生态退化。因此，“生产与多样性背离”这一神话并非事实。统一性作为一种生产模式，只有在控制和利润的语境下才会变得不可避免。


    在产生多样化产出的农林混合系统中，其生产力和可持续性要高得多。在多样化产出和需求的背景下，单一种作物的生产力很低。只有在森林和农场生物量“部分之部分”产出的局限背景下，它的生产力才是高的。“高产”绿色革命作物模式从数百种作物中挑选出一种——例如小麦——仅从小麦植物的一个部分（谷物）获取产量。高局部产量并不意味着高总产。因此，生产力的高低取决于是在多样性框架还是统一性框架内进行衡量的，取决于它是通过“报酬律”还是“统治律”来理解的。


    通过这种方式，主导范式中对农业生产力的经济计算扭曲了生产力的衡量。它们忽略了源自生物多样性的内部投入的收益，并未能考虑到在单一种作物系统中购买外部化学投入以替代内部自然投入所产生的额外财务和生态成本。


    基于多样性的系统具有更高的生产力，这表明基因工程和工业化农业存在替代方案：一种更生态、更公平的替代方案。这种替代方案基于生物多样性强化而非化学强化。但尽管多样性的产出比单一种作物多，但单一种作物对工业是有利的，无论是为了市场还是政治控制。从高产多样性向低产单一种作物的转变之所以成为可能，是因为市场逻辑从穷人手中夺取资源并交给富人，然后将其摧毁。同时，更高的商品生产只给那些拥有经济权力的人带来利益，讽刺的是，正是穷人的饥饿被用来证明那些加剧了他们饥饿的农业策略。


    在印度南部泰米尔纳德邦的一个部落地区收集种子时，我遇到一位同时种植九种作物的农民。他解释了土地上作物多样性如何从宏观到微观联系起来：从太阳系的行星平衡到地球的生态平衡，再到我们体内的营养平衡。Navdana
    的意思是“九种种子”或“九种作物”，作为这种多样性的证明，我将我们的拯救运动命名为 Navdanya。


    “多样性即繁荣”的理念与历史一样悠久，其实践在整个地球上可见。加尔瓦尔喜马拉雅山脉的当地山民在不同物种之间开发了互补和协同的，以促进以生物多样性为中心的农业实践。其中，baranaaja
    文化是一个典型的例子，也是多样性繁荣的证明。Baranaaja 由十二种粮食组成，并与指谷（基础作物）间作。苋、荞、腰豆、马豆、黑大豆、黑豆、绿豆、豇豆、稻豆、红豆、高粱和龙爪草是通常与指谷混合种植的作物。Baranaaja
    有助于在最小土地上提供最多数量的食物，同时确保均衡饮食。Baranaaja 占据了农田中最不肥沃的地区，而在那里其他喜水或耗水作物将无法生长。这种精心设计的生物多样性管理增强了农农生态系统的可持续性，提高了整个农业社区的粮食安全水平。


    在距离喜马拉雅山脉几个洋之外的地方，中美洲的农民几个世纪以来一直使用名为 milpa 的混合作作系统。基于玛雅、扎波特克等中美洲人民的古代农业方法，milpa
    农业生产玉米、豆类和南瓜，以及适合当地条件的其他作物。该系统在消费水平上完全自给自足，并包括牛油果、瓜、西红柿、辣椒、红薯、山药、苋和苦豆。记者兼作家 Charles
    C. Mann 将 milpa 描述为“营养和环境上互补的”。他写道：


    “玉米缺乏赖氨酸和色氨酸，而身体需要这些物质来产生蛋白质和烟酸……豆类既含有赖氨酸也含有色氨酸……南瓜类则提供了多种维生素；牛油果提供了脂肪。根据波士顿马萨诸塞大学玉米研究员
    H. Garrison Wilkes 的估计，milpa ‘是人类历史上创造过的最成功的、最伟大的明的明的之一’。”


    在 San Felipe el Agua，*milpa* 不仅仅是田地和作物：它是由家庭、商业和实践组成的网络，其中许多非常古老。San Felipe 的
    *milpa* 包含了传统知识、手工工具、用于耕地的瘤杂克罗牛、地道、狗、后院饼饼工厂、厨房桌、餐食和汗水——这是一种以玉米为中心的生活方式，不仅是生物多样性的证明，也是文化多样性的证明。


    这种有机实践（从作物角度看是有机的，从植根于社区的角度看也是有机的）的变体跨越文化。在一些原住民部落中，milpa 系统被称为“三姐妹”，将玉米、豆类和南瓜结合在一起。当欧洲殖民者在
    17 世纪初到达美国时，爱洛华人种植三姐妹已有三个多世纪了。这些蔬菜在生理和精神上都支撑着原住民；在传说中，这些植物是神灵赐予的礼物，永远一起种植、一起食用、一起庆祝。


    粮食危机的这两个方面——一方面是农业危机，另一方面是营养不良危机——都与粮食生产已变为化学强化并关注“每亩产量”这一事实有关。然而，每亩产量忽略了导致营养不良危机的营养流失。因此，虽然绿色革命导致了在化学密集、资本密集和水密集投入下水稻和小麦增加，但它同时也将豆类、油籽、小米、蔬菜、蔬菜和水果从人们的饮食中取代了。

