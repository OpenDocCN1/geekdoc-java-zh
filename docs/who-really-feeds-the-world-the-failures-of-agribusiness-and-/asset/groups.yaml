    Bees and Butterflies Feed the World, Not Poisons and

    Pesticides


    > The destruction of a pest is the evasion of, rather than the solution [for],
    all agricultural problems.

    —SIR ALBERT HOWARD''


    Bees, butterflies, insects, and birds move pollen from flower to flower, fertilizing
    plants and allowing them to reproduce. Without pollinators, most plants would
    not reproduce, and without plant reproduction, our food supply would be threatened.
    The cycle of seed, whether it is for trees in the forests or crops that make up
    the food we eat, relies on cycles of pollination.


    Ecologically biodiverse systems do not just protect bees and pollinators that
    feed us; they also control pests through a natural pest/predator balance. They
    support an abundance of natural enemies, which prevent the explosion of pest populations.
    Industrial monocultures, on the other hand, create a feast for pests, because
    there is no biodiversity to provide the ecological functions of pest control.


    In the initial paradigm of knowledge and agriculture, pest control is a matter
    of war. As a pest management textbook states, “The war against pests is a continuing
    one one must fight to ensure his survival. Pests (in particular insects) are our
    major competitors on earth."


    More than fifty years ago, Rachel Carson wrote Silent Spring, an early warning
    for future generations. She questioned the world around her:


    There was a strange stillness. The birds, for example—where had they gone? The
    few birds seen anywhere were moribund; they trembled violently and could not fly.
    . . . On the farms the hens brooded, but no chicks hatched. . . . The apple trees
    were coming into bloom but no'
  - '[PAGE 42]


    bees droned among the blossoms, so there was no pollination and there would be
    no fruit.... It was a spring without voices.


    Carson’s now-iconic book explored the hazardous ecological consequences of chemicals
    and pesticides, warning that the deadly chemicals silencing the sounds of spring
    would not spare human beings either. Today her warning has become a widespread
    reality, and there are poisons everywhere in our food system.


    Over the past four decades we have witnessed a drastic increase in the use of
    pesticides that have their origins in chemical warfare. Pesticides are not only
    devastating to the ecosystem and to friendly pollinators, but to our health. And
    because pesticide corporations are often also in the business of pharmaceuticals
    and seeds, these chemicals are unethically marketed as safe “medicines” for plants
    and as food providers for humans. In countries where farmers tend to be poor and
    illiterate, this pervasive and dangerous packaging of toxins has been difficult
    to subvert. Furthermore, given the large amounts of money to be made by agribusiness,
    the use of harmful pesticides remains unchallenged by government agencies that
    are supposed to protect people from harm.


    But pesticides do not control pests; rather, they create them. Pests increase
    with the application of pesticides because beneficial species are killed and pests
    become resistant to chemicals. Promoters of agribusiness argued that there has
    been a recent outbreak of pests that must be controlled. But in reality, both
    pesticides and GMOs—which were designed as proposed alternatives to pesticides—are
    threatening our natural systems of pest control: pollinators. Outbreaks of pests
    are symptoms of a system that is out of balance; instead of deepening the imbalance
    by introducing more deadly poisons to kill pests, we must restore the natural
    balance of pollinators and pests, and then restore health and nutrition in our
    food and sustainable life in our ecosystems.


    On December 25, 1925, I. G. Farben, a German chemical conglomerate, was constituted
