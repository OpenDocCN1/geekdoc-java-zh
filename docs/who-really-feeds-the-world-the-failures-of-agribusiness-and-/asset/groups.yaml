  mdcn: '


    我们迫切需要设计从全球化范式向本地化范式的转型。这并不意味着国际贸易的终结，但意味着优先考虑本地。这意味着食物的去商品化，重新夺回食物作为我们的存在、养分、身份和人权的地位。意味着让农业从世贸组织（WTO）规则中脱离，并根据粮食主权原则进行管理。意味着让赌博者远离我们的食物，以免他们像摧毁金融经济那样摧毁粮食经济。意味着停止地主主的剥削，并停止将本该属于贫困人的食物转变为富人汽车的燃料。意味着记住万物皆为食物，人如其所食，而在生物学层面，粮食正义是一项生态必然要求。作为生物体，我们都有平等获得地球资源及其为所有人提供食物的潜力。种子掠夺、土地掠夺和粮食掠夺违反了人类本质内涵的伦理和生态设计。设计的饥饿是不道德的、不公正且不可持续的。我们有能力转向一种更伦理、公正且可持续的设计。


    我们该如何实现这一转型？首先，各国应在预算中优先支持最贫困的消费者，使他们能够获得足够的食物。其次，各国应优先考虑国内粮食生产，以减少对世界市场的依赖。这意味着要增加对基于农民和农户粮食生产的投入。我们确实需要更密集的粮食生产，但这种密集是指现在劳动投入和对自然资源的持续利用上。必须开发多样化的生产体系，以整合自绿色革命以来被忽视的本地食物。小规模农场可以生产多样化的食物，既能保证均衡饮食，又能为市场提供剩余。第三，内部市场价格必须稳定在农民和消费者都能接受的合理水平——对于农民，要确保价格能覆盖生产成本并获得体面的收入；对于消费者，要保护他们免受高粮价的影响。必须鼓励农民和小规模农户向消费者的直接销售。


    第四，每个国家都必须建立一套能够稳定市场的干预系统。为了实现这一目标，需要通过关税和配额等进口控制来监管进口，避免倾销或破坏国内生产的低价进口。必须建立由国家管理的粮食国家储备作为市场；在丰收年，可以从市场上买入谷物以建立储备；在短缺时，则可以释放谷物。


    最后，为了实现这一点，必须通过真正的农业改革和土地改革，将土地平等分配给无地者和农民家庭。这应该包括对水资源、种子、信贷和适当技术的控制与获取。应该让人们重新生产自己的食物并养活自己的社区。任何土地掠夺、土地驱逐以及为农业企业主导的农业扩大用地的行为必须停止。


    二十年的全球化带来了农业危机、粮食危机、疾病流行、粮食浪费以及生态危机的加剧。作为一种粮食系统，工业全球化失败了地球和人类。我们现在需要转向基于本地经济和本地食物系统的生产与分配体系。这些本地系统带给我们真实的活食物，在这里是由真实的农民通过充满生机的种子和充满生机的土壤生产的，而不是通过全球公司。我们需要摆脱全球公司编写的农业规则，并编写新的规则：由人民书写、为人民而写、通过真正的粮食民主来实现的规则。


    # 8


    ## 女性喂养世界，而非公司


    女性是全球社会食物、营养和养分的主要种植者和提供者，她们进化了农业。世界上大多数农民是女性，大多数女孩都是未来的农民：她们在田间农场学习耕作的技能和知识。以女性为中心的食物系统基于分享与关怀，基于保护与福祉。农场上种植什么决定了什么生计得到保障、吃什么、吃多少以及由谁来吃。女性的食物是多样化且具有维持力的，当女性控制食物系统时，生物多样性专家、营养专家以及知道如何用更少资源产出更多产物的经济学家都能受益。女性对粮食安全做出了最巨大的贡献，她们生产了世界上一半以上的食物，并提供了粮食安全不安全家庭和地区
    80% 以上的食物需求。


    但由资本主义父权制驱动的集团全球化改变了食物：其内成分、生产方式和分配方式。受公司控制的食物不再是食物；它是为了利润而制造的商品。食物——或公司口中的食物——可以被随意地穿插在汽车的生物燃料、工厂化农场的饲料和饥饿者的口粮之间。今天，少数家公司控制着全球粮食系统，食物被取代，女性的知识、劳动、技能和创造力遭到了破坏。从种子到餐桌的整个食物链的控制权正从女性手中转向全球公司的贪婪手中，而他们正是当今的全球父权者。女性对种子、生物多样性和营养拥有丰富的知识。治理女性食物的知识是非机械论的、非还原论的，并深根于农业生态学原则。女性在种植和加工食物方面比任何人都做得得多，她们对耕作的知识比推广工业农业的行业和所谓的“专家”更为精深。通过生物多样性提供营养方面，她们比生物技术人员通过基因工程提供的“奇迹”要明得多。


    然而，女性的知识或其劳动都没有被纳入父权科学和父权经济的结构之中。父权科学基于对一个虚构的“创造边界”的人工构建。这种构筑抹灭了自然和女性的创造力和智慧，使她们的知识变得隐形。反过来，父权经济通过建立一个不公正的“生产边界”，使女性作为农民的身份变得隐形——在这个边界下，GDP
    和正式工作的规则意味着，如果你消费的是自己生产的东西，你就不被视作“生产者”。父权经济构建了一个排除女性工作的边界，而这些工作是为了生存，而非以牺牲自然和人类为代价获利。


    在农业领域——正如其他科学和经济活动领域——女性的科学和经济贡献被抹杀了。女性在食物和农业方面的劳动被隐形了，尽管它是社会的基石。由女性塑造的旨在维持家庭、社区、生物多样性和地球的可持续食物系统，在这种父权式的生产力计算和父权式的科学计算中被降为零。


    相比之下，公司只为了利润而存在。当它们进入种子、食物和农业领域时，它们破坏了食物系统的滋养和维持特性，并将一切转化为为了利润贸易的商品。女性的知识和劳动被破坏了，随之，地球和人类的健康也遭受了毁灭。


    工业农业根植于一种父权科学范式，这种范式优先考虑暴力、碎片化和机械思维。这种范式根植于战争意识形态，推崇思想的单一化和土地的单一栽培，否定了对农业生态学和多样性的知识，而这正是女性的知识。


