  raw:
  - '[PAGE 119]


    As we saw in Chapter One, the Newtonian-Cartesian idea of nature as a fragmented
    world denies the interconnectedness of nature and has subsequently been proved
    false by new sciences such as quantum physics and epigenetics.


    According to Bacon, the discipline of scientific knowledge and the mechanical
    inventions it leads to not “merely exert a gentle guidance over nature’s course;
    they have the power to conquer and subdue her, shake her to her foundations.”
    In The Masculine Birth of Time, Bacon promised to create “a blessed race of heroes
    and supermen” that would dominate both nature and society. The gendered violence
    of his words are unmistakable: heroes and supermen will dominate and shake nature
    to her foundations.


    The Royal Society, founded in 1660 in London, is seen as being instrumental in
    the Scientific Revolution of the seventeenth and eighteenth centuries. The society
    was inspired by Bacon’s philosophy and seen by its organizers as a masculine project.
    In 1664 its secretary, Henry Oldenburg, announced that the intention of the society
    was to “raise a masculine philosophy. whereby the Mind of the Man may be ennobled
    with the knowledge of solid truths.” Joseph Granville, another fellow of the Royal
    Society, held that the masculine aim of science was to know “the ways of captivating
    Nature, and making her observe our purposes, thereby achieving the Empire of Man
    Over Nature.


    Scientist Robert Boyle, a founding fellow of the Royal Society and governor of
    the New England Company, saw the rise of mechanical philosophy as an instrument
    of power: not just over nature, but also over the original inhabitants of America.
    He explicitly declared his intention of ridding the New England Indians of their
    “ridiculous” notions about the workings of nature. They attacked their perception
    of nature “as a kind of goddess” and argued that “the veneration, wherein men
    are imbued for what they call nature, has been a discouraging impediment to the
    empire of man over the inferior creatures of God.


    The death of nature in the mind allows a war to be unleashed against the Earth.
    After all, if the Earth is merely dead matter, then nothing can be killed. As
    feminist historian Carolyn Merchant points out, this transformation of nature
    from a living, nurturing mother to inert, dead, and manipulable matter was eminently
    suited to the exploitation imperative of'
  - '[PAGE 120]


    growing capitalism. The nurturing Earth image acted as a cultural constraint on
    the exploitation of nature, and as Merchant writes, “One does not readily slay
    a mother, dig into her entrails or mutilate her body.” But the images of mastery
    and domination created by the Baconian program and the masculine thrust of the
    Scientific Revolution removed all restraint, and functioned as cultural sanctions
    for the denudation of nature.


    Feminine knowledge of agriculture has evolved over five thousand years. While
    the Scientific Revolution remained blind to this knowledge, it was to destroy
    the foundations of food and agriculture. But now, in less two decades and with
    the rise of global corporations, genetic engineering, and patents, a direct assault
    on women’s knowledge and production is taking place.


    Global corporations have used the foundations laid by masculine science to render
    women’s knowledge and productivity invisible by ignoring the dimension of diversity
    in agricultural production. As an FAO report entitled “Women Feed the World” mentions,
    women use more plant diversity—both cultivated and uncultivated—than agricultural
    scientists know. In Nigerian home gardens, women plant 18–57 species in a single
    home garden. In sub-Saharan Africa, women cultivate as many as 120 different plants
    in the spaces left alongside the crops managed by men. In Guatemala, home gardens
    account for less than 0.1 hectare of land grow more than ten tree and crop species.


    In a single African home garden, more than 60 species of food-producing trees
    are counted. In Indian agriculture, women use 150 different species of plants
    for vegetables, fodder, and health care. In West Bengal, 124 “weed” species collected
    from rice fields are shown to have economic and nutritional importance for farmers.
    In Veracruz, Mexico, peasants utilize approximately 435 plant and animal species,
    of which 229 are eaten. Women are the biodiversity experts of the world. Unfortunately
    are being denied their potential as food producers and as biodiversity experts
    under the dual pressures of invisibility and the domination of industrial agriculture.


    While women manage and produce diversity, the dominant paradigm of agriculture
    promotes monocultures under the false tenet that monocultures produce more. But
    monocultures do not produce more; they simply concentrate control and power in
    the hands of a few corporations. The'
  - '[PAGE 121]


    systemic erosion of women’s knowledge of agriculture has violated women’s position
    as experts in agriculture, and since their expertise is related to modeling agriculture
    on nature’s methods of renewability, the destruction of this knowledge has gone
    hand in hand with the ecological destruction of nature’s processes, and the destruction
    of people’s livelihoods and lives.


    Patriarchal economics constructs an imaginary production boundary that denies
    production that takes place in nature’s economy and in people’s sustenance economies.
    The exploitation of resources and people is presented as production and growth.
    GDP is based on a false assumption: if you consume what you produce, you don’t
    produce. Women’s work in the food economy is thus reduced to zero, even though
    it is their work that keeps people fed.


    This patriarchal economics has rendered women’s work as food providers invisible
    because women provide for households not companies, and also because women perform
    multiple tasks involving diverse skills. Women have remained invisible as farmers
    in spite of their contribution to farming, because a patriarchal economic system
    fails to count women’s production as “work,” since it falls outside the production
    boundary. These problems with collecting data on agricultural work arise not because
    few women work but too many kinds of work. There is a conceptual inability of
    statisticians and researchers to define women’s work both inside and outside the
    home, and farming is usually part of both. This lack of recognition of what is
    and not labor is exacerbated by the great volume of work that women do and the
    fact that they do chores at the same time. It is also related to the fact that
    although women work to sustain their families and communities, most of their work
    is not measured in wages. Like all farmers, women do not have “jobs”; they have
    livelihoods.


    Wages are paid in money, but money no longer signifies just payment or a means
    of payment. Corporations have redefined the concept of money and turned it into
    “capital.” In this process, the creativity of women’s work has been erased. The
    Latin root of the word “capital” is caput, which means “the head.” Money, the
    means used by real people to produce real wealth, is'
  - '[PAGE 122]


    made to look as if corporations were producing it. Corporate exploiters then manipulate
    the meaning of “capital” to turn themselves into the “head”: to rule over and
    exploit nature and people. Today, with the advent of globalization and TNCs, all
    the discourse about economics is reduced to “foreign investment,” and like “capital,”
    “investment” is a construct behind which the 1 percent hide to rob 99 percent
    of their resources and opportunities.


    In Integral Economics, Ronnie Lessem and Alexander Schieffer reflected that


    The fathers of capitalist theory had chosen a mother rather than a single bourgeois
    male as the smallest economic unit for their theoretical constructions, they would
    not have been able to formulate the axiom of the selfish nature of human beings
    in the way they did.¹¹⁰


    Today, or what counts as a human being is changing. Beginning with the idea of
    a bourgeois male as the normative “human,” patriarchal economics constructed the
    “corporation” as a patriarchal person. Seed, food, and agriculture, which are
    women’s spheres of knowledge and production, are simultaneously ignored in the
    dominant economy while also being seen as sources of mega profits for corporations.


    The first corporations, like the British East India Company, were established
    during colonial rule as “limited liability companies,” with associations of rich
    european men forming companies to privatize profits and socialize losses. Over
    time, especially in the United States, corporations started to be treated as natural
    persons instead of artificial constructs. In fact, the Fourteenth Amendment, which
    was added to the US Constitution to protect the rights of free slaves, was reinterpreted
    so as to cover corporations.¹¹


    With the rights of natural persons, corporations could now begin undermining the
    rights of real people. They could start blocking democrat institutionalized laws
    to protect citizens by claiming that their Fourteenth Amendment freedoms were
    being interfered with. Today, corporations are claiming that their economic power
    to influence elections, to control seeds, and to dominate our food system is a
    part of their “freedom of speech.” In May 2014, the state of Vermont passed the
    first GMO'
- md: '

    labeling law in the United States. In response, Monsanto, together with the largest
    junk-food lobby in the country—the Grocery Manufacturers Association (GMA)—claimed
    that this “impose[d] burdensome new speech requirements.”— In this way, the right
    to hide information about poisons was portrayed by Monsanto as the right to free
    speech. Today, sixty countries across the world have mandatory GMO labeling laws,
    but several efforts in other US states to pass these laws have been blocked by
    industry. In California and Washington, Monsanto and the GMA spent nearly $100
    million to defeat the vote in favor of labeling.


    When artificial entities like corporations are treated as natural persons, their
    rights become absolute and they can undermine the rights of all species, all people,
    and all women. A corporation does not have a mind of its own, but it can appropriate
    people''s collective wealth of seed and seed knowledge that women have conserved
    over millennia through intellectual property rights. A corporation produces nothing,
    but through free trade rules it can appropriate all the food in the world produced
    by farmers and turn it into a commodity. A corporation cannot vote, but it can
    steal elections through corporate funding. Limits on financing elections were
    interpreted by the US Supreme Court as interferences with the “free speech” of
    a corporation.


    The control of corporations over the food system is not just leading to the marginalization
    of women''s knowledge and productive capacity, but it is also undermining the
    potential of our species to feed itself. Five giants and five food giants have
    replaced billions of women producers and processors, which has created global
    food insecurity. More than one billion people are denied access to food, and another
    billion are cursed with obesity and related diseases due to industrially processed
    food. Among those who suffer the two kinds of malnutrition, women and girls are
    the worst sufferers. This is why the world''s hungry population are food growers:
    most of them are women.


    A scientific and economic model based on violence towards the Earth is directly
    linked to real violence against women. When I was studying the Green Revolution
    in Punjab, I saw the first advertisements for sex-selective abortion handpainted
    on walls. A model of agriculture that had displaced women from their productive
    work in agriculture by replacing them with chemicals and machines was now making
    them a disposable sex. Based on the declining sex ratio across the world (a figure
    that measures the number of women per thousand men), economist Amartya Sen has
    said that more than one hundred million women are missing.¹¹⁴ As a masculine model
    of production systemically devalues women''s place in the world, women themselves
    are devalued, displaced, and disappeared. The growing incidence and brutality
    of rapes worldwide is also related to a violent economy that transforms every
    being into a commodity, including and especially women. And as millions are uprooted
    and displaced, brutalized men brutalize.


    Seed is the first link in the food chain. For five thousand years, peasants have
    produced their own seeds, selecting, storing, replanting, and letting nature take
    its course in the food chain. Feminine principles have governed the conservation
    of seeds, and through seed conservation, women preserve genetic diversity and
    the self-renewability of food crops. This sustainable knowledge and agricultural
    practice is the foundation for the emerging paradigm of agroecology was ruptured
    by the Green Revolution.


    At the heart of the Green Revolution lay new varieties of "miracle" seeds, "miracle"
    seeds for Borlaug received a Nobel Prize and that rapidly spread across the third
    world also sowed the seeds of a new commercialization of agriculture. Borlaug
    ushered in an era of corporate control of food production by creating a technology
    through which multinationals acquired control over seeds and hence over the entire
    food system. The Green Revolution commercialized and privatized seeds, removing
    control of plant genetic resources from peasant women in the Global South. This
    control was in turn given to male technocrats in international research centers
    run by the World Bank—such as the CIMMYT and IRRI—and to multinational corporations.


    Women have acted as the custodians of genetic heritage for centuries. In a study
    of rural women in Nepal, it was found that seed selection is primarily a female
    responsibility. In 60.4 percent of the examples in the study, women alone decided
    what type of seed to use, while men decided in only 20.7 percent of the examples.
    In cases where families use their own seeds, the decision is made by women alone
    81.2 percent of the time.¹¹⁵


    Women have carefully maintained the genetic base of food production for thousands
    of years. But now, a masculine viewpoint of seeds defines this common wealth as
    “primitive,” and sees its own new products as “advanced” varieties.


    The Green Revolution was a strategy based on breeding the feminine principle by
    destroying the self-reproducing characteristic and genetic diversity of seeds.
    The death of the feminine principle in plant breeding was the beginning of seeds
    becoming a source of profits and control. But the hybrid “miracle” seeds are a
    commercial miracle because farmers have to buy supplies of them every year; they
    do not reproduce themselves. Hybrids do not produce seeds that duplicate the same
    result because hybrids do not pass on their vigor to the next. With hybridization,
    seeds are no longer a source of plant life, producing sustenance through food
    and nutrition; they are now a source of private profit.


    Green Revolution seeds did not increase food production from the point of view
    of nature, women, and poor peasants. These varieties were useful only for corporations
    that wanted to find new avenues of profit in seed and fertilizer sales. The international
    agencies that financed research on the new seeds also provided the money for their
    distribution. The impossible task of selling a new variety to millions of small
    peasants who could not afford to buy these seeds was solved by the World Bank,
    the United Nations Development Programme, the FAO, and a host of bilateral aid
    programs, which began to accord high priority to the distribution of HYV seeds.
    The Green Revolution has spread monocultures of chemical rice and wheat through
    both hybrid seeds and GMOs, driving out biodiversity, and hence nutrition, from
    our farms and diets.


    Those crops that survived this chemical onslaught, such as spontaneous crops like
    the amaranth greens and chenopodium (bathua)—which are rich in iron—were then
    sprayed with poisons and herbicides. Instead of being seen as iron-rich and vitamin-rich
    gifts, these crops are treated as “weeds.” A Monsanto representative once said
    that genetically engineered crops resistant to their proprietary herbicide Roundup
    killed the weeds that “steal the sunshine.” And Monsanto’s ads for Roundup in
    India tell women, “Liberate yourself, use Roundup.” But GMOs are for women’s liberation
    nor food liberation, for malnutrition.


    Instead of growing biodiversity following the Law of Return to give nutrients
    back to the soil so that food is full of nutrients, and instead of growing democracy
    to ensure everyone in society has access to healthy, safe, and nutritious food,
    capitalist patriarchy turns the malnutrition crisis it has created through Monocultures
    of the Mind and mechanistic science into its next market opportunity.


    After the failure of Bt and HT crops to increase yields, decrease chemical use,
    or control weeds and pests, biofortification through genetic engineering has become
    the next big push of global agribusinesses. Two such initiatives in India were
    the introduction of golden rice to remove vitamin A deficiency and end blindness,
    and iron-enriched bananas, to prevent Indian women from dying in childbirth because
    of iron-deficiency anemia.


    But in reality, golden rice is far less than available alternatives, and the promoters
    of golden rice themselves admit that it produces only 35 micrograms (µg) per gram
    of rice. Biodiversity and ecological agriculture offers us alternatives that are
    350-600 percent richer in vitamin A than golden rice. Some of these alternatives
    commonly used in Indian food include amaranth leaves, which have 14,190 µg of
    vitamin A per 100 g; drumstick leaves at 19,690 µg; spinach at 5,580 µg; and carrots
    at 6,460 µg of vitamin A per 100 g. In contrast, 3,500 µg of vitamin A are found
    in 100 g of golden rice. The knowledge of these alternatives has always been in
    women''s hands, farmlands, and control. Today, this knowledge and practice are
    being displaced by a biofortification that will actually decrease vitamin A availability
    and create profits for ever-growing corporations.¹


    Iron-rich bananas are just as much of a myth. The same scientist—James Dale from
    Queensland University of Technology, Australia—who is beginning human trials of
    A-rich bananas in Uganda is claiming to end mothers'' deaths after childbirth
    by fortifying bananas with iron, to prevent iron-deficiency anemia. After a decade
    of research and development, the GMO iron-rich banana will provide 2–3 mg of iron
    in 100 g of food. This is vastly inferior to women''s knowledge offers. For example,
    amaranth has 11 mg of iron per 100 g of food, neem has 25.3, rice bran has 35,
    lotus stems have 60, and mango powder has 45.2 mg of iron per 100 g of food. These
    are only a few of countless indigenous sources²

