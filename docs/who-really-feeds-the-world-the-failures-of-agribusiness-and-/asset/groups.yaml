    A Civil Action were based on the case). With Magda Aevoet from the Greens of the
    European Parliament, and Linda Bullard, the president of the International Federation
    of Organic Agriculture Movements, I filed a case challenging the biocopacy of
    neem. It took eleven years, but we overturned the patent, and the use of neem
