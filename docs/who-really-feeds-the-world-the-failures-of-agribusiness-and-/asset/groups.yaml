    to seed as living, diverse, and evolving: seed as the commons is the source of
    food and the source of life. The creation of community seed banks and seed libraries
    is part of the movements for seed freedom that are resisting the imposition of
    unscientific and unjust seed laws based on uniformity. Also part of this resistance
    are the scientific movements innovating with participatory and evolutionary breeding,
    which are offering successful and superior alternatives to industrial breeding.


    The fourth transition is from chemical intensification to biodiversity intensification
    and ecological intensification, from monocultures to diversity. We must make the
    transition from chemicals and toxins as the main input into agriculture to chemical-free,
    agroecological systems. The evidence that ecological systems produce more food
    and nutrition is growing. Chemicals have no place in farming and our food. This
    transition must also move away from the fiction of “high yield” to the reality
    of diverse systems outputs, including quantity, quality, taste, health, and nutrition.
    Not only are biodiverse agricultural systems more productive and resilient, biodiverse
    food systems are the best insurance against diseases linked to nutritional deficiencies.
    For example, the Indian science of Ayurveda demonstrates that all food should
    have six tastes, which ensures both diversity and health.


    The fifth transition is from pseudoproductivity to real productivity. The reduction
