    The manufacture and use of pesticides is continuously increasing. New chemicals
    are introduced in the market regularly, and the system of registering and controlling
    pesticides by governments is greatly flawed and can be manipulated in accordance
    with corporate interests. The increase is especially seen in the Global South,
    where the use of pesticides is growing at the rate of 5–7 percent per year. Pesticides
    are now found in our rivers, groundwater, breast milk, soil, food, and air. Consumption
    of food is a key route of human exposure to pesticides and industrial pollutants.
    We are all exposed to pesticides and carry measurable amounts of these harmful
    chemicals in our bodies. The full effects of these pesticides we ingest through
    our daily diets are not entirely, but studies demonstrate that the most harmful
    effects are on children, who consume greater quantities of food per unit of body
    weight. For example, infants in India are exposed to relatively more arsenic than
    the general population because infants consume more rice, which has a higher arsenic
    concentration. In addition to the poisons that pesticides create in our food,
    pesticides also pose serious health risks to those working with them, especially
    farmers, or those living in close proximity to the factories in which they are
    produced.


    I. G. Farben and others specialized in the development of sarin and tabun, chemicals
    that fall under a category known as organophosphates (OPs), were used as nerve
    gases in the Nazi concentration camps. Today, most of the pesticides in the market
    are nerve poisons, which means that they act on the nervous system. This explains
    both their effectiveness and their toxic potential. These pesticides, even in
    minute quantities, can damage the nervous system and hence cause neurophysiological
    disorders, either chronic or long-lasting in their course. Exposure to OPs can
    cause acute illness such as nausea, vomiting, headache, abdominal pain, dizziness,
    skin diseases, eye diseases, stillbirths, and birth defects. I. G. Farben was
    tried for its role in the Holocaust during the Nuremberg trials that followed
    World War II. Its role in spreading a more recent, pesticide-based genocide has,
    however, largely unchecked.


    In December 1984, what is widely considered to be the world’s worst industrial
    disaster occurred at a pesticide plant owned by Union Carbide—'
