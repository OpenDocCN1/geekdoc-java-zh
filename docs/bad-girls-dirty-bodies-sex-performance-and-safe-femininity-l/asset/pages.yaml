  md: '# Introduction


    This book is based on original ethnographic research exploring Bad Women, Dirty
    bodies and dangerous feminities in a range of settings in subculture and popular
    culture. ‘Bad’, ''Dirty'' and the policing of heteronormative sexual norms are
    core themes and tensions which are explored through confrontational, fun, perverse,
    deliberately dirty and kinky performances. Alongside the celebration of Dirt,
    Bad Girls in this book demonstrate how giving yourself permission to do what you
    want opens more inclusive space to reflect the diversity of femininity and the
    importance of embodied knowledge. The central stories in this book are from the
    voices and experiences of women who have been maligned Bad/Dirty (i.e. non-conforming).
    Burlesque is used as a vehicle for debates about femininity, but also to elicit
    a deeper critique of how women’s stories are mediated. Drawing from the accounts
    of research participants and emergent themes in the ethnography, this book argues
    that the construction of feminities within the contemporary revival of burlesque
    does not challenge or offer an alternative to mainstream heteronormativity.


    When we think of alternatives to the mainstream, this may conjure images of individuals
    or groups who question or challenge the norm’. Questioning or challenging the
    norm can be articulated through alternative practices and belief systems, expressing
    intimacy beyond socially approved ways (i.e. polyamory, BDSM that is not Fifty
    Shades of Grey, non-monogamy, striptease, etc.) and through visual means (i.e.
    body modifications, striptease, etc.). Furthermore, this can include a political
    statement that is performed on stage in ways'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'that undermine established ways of performing beauty, sexiness, self-identity
    and so on. Alternative constructions of femininity can also be applied when exploring
    ‘subcultures’ where progressive space is apparently opened for exploring who do
    not follow expected social scripts aligned with ‘good femininity’. A safe progressive
    space can be positive, especially when it supports women articulating their self-identity
    on their own terms. Whilst the opening of space is important for possibilities
    to happen, we still need to investigate the extents of which these alternative
    constructions are really alternative, or if some women are still punished or dismissed
    for going socially approved ways of ‘doing’ the alternative. This dismissal can
    even be articulated by some women about Bad/Dirty/Other women in the same scenes,
    which evidences the pervasiveness of heteronormativity and how this value system
    is used to validate or vilify.


    Stories, performances and case studies used in the book are a to explore alternative
    constructions of femininity, embodied knowledge and the Bad Girl. Central to the
    book is the articulation of femininity, specifically specifically demarcated as
    ‘Bad’, problematic, indecent, pornographic and unsafe. How gender and sexuality
    are negotiated in various spaces, and the issues that emerge are key features
    of the case studies (Ms T, Empress Stah and RubberDoll, Mouse and Doris La Trine)
    and how they offer a challenge to binaries (i.e. cleanliness/dirtiness and the
    good/Bad Girl). These situate the Bad Girl as a site of power and transformation.


    # My voice and self-identity


    As the book explores voice and experience, it is important for me to position
    myself within the research, sexual politics and feminism. Firstly, I am a cultural
    theorist and an ethnographer who is invested in exploring the lived experience
    of marginalized women who identify'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'as Bad, dirty, alternative and queer (although these identifying features are
    sometimes imposed on marginalized women). I am an intersectional queer feminist,
    although some see me as a ‘third wave’ feminist (i.e. positioning myself alongside
    and within post 90s feminist discourse). The approach of the book, and indeed
    my own political ethos, is sex-positive, holistic and queer. I am white and from
    a working-class family. I am a goth and a queer woman. Being Bad myself gave me
    access to the Bad Women in this book, but it is important to note that critique
    and reflexivity are central in unpacking what these femininities mean.


    Since my teens, I have been interested in identities, lifestyles and sexualities
    that have deviated from the norm. Some of this interest was stoked by my own feelings
    and experience of marginalization and exclusion. Every person experiences marginalization
    in different ways, dependent on a myriad of intersections. How marginalization
    operates and is negotiated by individuals is something which has always intrigued
    me, both on a personal and professional level. Growing up in the 1990s and 2000s
    in a very conservative setting meant that I was unaware of why I felt different.
    In Sixth Form and through my Saturday job at Coventry Market, my friendship group
    reflected more of what I identified with: goths and metalheads. Mixing with different
    people on the goth and alternative scenes opened up possibilities for me. Although
    I wasn''t comfortable with my sexuality until my early thirties, I felt that the
    clubs I frequented in my youth allowed myself and my friends to be ourselves.
    In these spaces, I started to mix with people who were queer, lesbian, bisexual
    and kinky. These people were kind, cool and understanding. Mainstream culture
    did not really see this way.


    One thing I noticed (and continue to notice) was the hypocrisy of popular culture.
    Some aspects of subculture and alternative expressions of femininity were accepted
    (i.e. mainstream fashion, film and TV, celebrity culture, etc.), whilst other
    types of alternative women'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'and sexual expressions were demonized or maligned as bad and dirty (i.e. too
    kinky, too naughty, too sexual, too weird, too different for male approval, etc.).
    These contradictions have never disappeared as they were also found in my research
    too. Contradictions/ contestations can feel negative and constraining; however,
    what has always fascinated me is how women navigate, queer and challenge heteronormative
    expectations.


    We will see how Bad Women (as evidenced in the research) demonstrate how space
    can be both challenged and created to allow more possibilities to be present (i.e.
    not at the expense of other women, nor by telling ‘women’ that all they need to
    be the same). The policing of women’s bodies and self-expression, as we will see
    in this book, also operates within subculture and between women too. This was
    something I observed in my personal life and in the research. Possibilities and
    contradictions are central in the investigation into Bad Women and how both Bad/Dirty
    as the underpinnings of the book bring both together.


    # Bad Girls, Dirty Bodies


    Bad Women and Dirty Bodies have direct links to dangerous forms of femininity,
    such as the slut, the woman who is far too kinky, the bisexual and the woman who
    expresses self-identity in disapproving ways (i.e too honest, too confrontational,
    too gay, etc.). Dangerous feminities challenge patriarchy in various ways, as
    outspoken women who speak their own truth, women who reveal in their own sexiness/filth
    and sexual women who do not need male approval (or other women’s approval for
    that matter). Challenging gendered scripts can be through troubling social norms
    around your femininity is expected to be performed (i.e. in any group setting,
    and not just within popular culture). Dangerous feminities are'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    important to explore, and in relation to this book, the case studies offer ways
    in which self-identity can be given space through voice, biography, context and
    experience.


    ''Bad’ and ‘Dirty’ (we can add: ‘problematic’, ‘pornographic’ and ‘unsafe’) can
    also conjure a variety of images in the readers’ mind through their own cultural
    awareness of what a Bad Girl is and how she may be framed in popular culture at
    any given time. These images are usually related to iconic figures in popular
    culture, such as the femme fatale, a woman who is sexually ravenous, the girl
    you would never want to take home to your parents, marry, the black widow, the
    good girl gone bad, lustful lesbians, boyfriend-stealing rivals, bisexual champs
    and the man-eating nymphomaniac. The issue of using words or associations with
    the Bad Girl – even to valorize the potential of the Bad Girl in challenging heterocentric
    discourses – means that the Bad Girl is always fighting against and speaking to
    binaries (i.e. good/bad,normal/pathological,burlesque/ stripping, straight/gay,
    etc.). This can be problematic if the same language systems we use to communicate,interpret
    and express trap how the Bad Girl can be read, perceived and valued. How then
    can we see the potential of the Bad Girl and clearly understand the messages she
    is projecting (i.e. in the manner she wants us to see her message too), if we
    cannot see beyond or between binaries?


    The concept of the Bad Girl is not something new, with feminist and gender scholarship
    and media and cultural theorists engaging with debates connecting to popular culture,
    new/alternative femininities, post-feminist discourses and the ‘sexually independent’
    woman (e.g. Attwood, 2005, 2007a, 2009, 2007a and b; Attwood and Holland, 2009;
    2004, 2010; Walters, Ferreday, 2008; Budgeon, 1998, 2001, 2011; Evans and Riley,
    2014, but also see fourth feminist critiques of digital/social media). Porn studies
    also offers new and exciting avenues in exploring women’s desire, affect and resonance,
    and porn consumption/production (see the extensive work of Feona'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Bad Girls, Dirty Bodies


    Attwood, Clarissa Smith, Susanna Paasonen and Paul J. Maginn). All of these contexts
    enable femininity to be seen, understood and researched in ways beyond the heteronormative.


    There are, however, still absences in popular culture. Women whose lifestyles,
    sexual identities and bodily practices are maligned as ‘dirty’, strange and pathological
    are still not acceptable or represented in good light. This is despite positive
    developments in socio-sexual, political and gendered contexts where conditions
    are that more femininities are supposedly included and celebrated in popular culture.
    For example, being too slutty, too queer, too butch, alternative, too kinky and
    too ‘bad’ relegate women labelled Bad/Dirty (i.e. Other), as being both unworthy
    and insignificant. It is OK to be alternative, independent and sex-positive or
    ‘bad’ in ways that are still deemed to be feminine or socially permissible. Being
    authentically bad can class that individual as socially corrosive, dirty and contagious.
    These labels are not politically neutral nor they emerge out of thin air; they
    have a history. Dirtiness and stigma do not happen overnight, nor are they aimed
    sporadically. Dirt, abjection and filth are still terms that ensure the Bad Girl
    is seen in a negative light (see Cohen, 2005; Douglas, 1966; Mort, 2000; Weeks,
    1991). On the other hand, versions of the Bad Girl – in contemporary media and
    popular culture – create opportunity for controversy. This opportunity is not
    in favour of women who step beyond the mediated image, and adopt or express characteristics
    which contravene the mediated/permissible Bad Girl image (i.e this is not just
    in subcultural spaces, but in popular culture too).


    Applying these terms and expressions to a person or body is a systematic way of
    abstracting and disqualifying a person’s agency, rights and value. We may think
    that this is a symptom of the mainstream holding onto a sense of stability to
