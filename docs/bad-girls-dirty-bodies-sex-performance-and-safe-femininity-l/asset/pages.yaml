    # The value of lived experience and the inclusion of contexts


    It is important to acknowledge the significance of using ethnography in the study
    of gender and sexuality, especially as ethnography opens up meaning through considering
    a range of contributing factors rather than relying on presuppositions. Critiquing
    femininity and the expression of female sexuality is a significant point to start
    at specifically as discussions of gender and sexuality are fraught with contentions
    which take away agency and solidarity from women who matter when shaking established
    ways of doing gender. The book does not make Other women specifically as it retains
    their rights and agency in the contexts experienced in the ethnography, rather
    falling into the trap of cultural presuppositions about sexual, sexualized and
    marginalized women. It was found in the ethnography that the women who open scope
    and queer normality are marginalized individuals like Empress Stah, Ms T, Doris
    La Trine, Mouse and RubberDoll.


    Lived personal experience is of great significance, especially highlighting the
    problems with acquired modes of expression. The case studies demonstrate that
    women do not have to be ashamed of overt sexuality and that there are many ways
    of doing gender. What they provide is a showcase of women and their individual
    sexual self-expression and desire, all of which cannot be automatically reduced
    to interpretations connoting patriarchy, misogyny and lack. This range undermines
    the preoccupation that some anti-porn feminists'
