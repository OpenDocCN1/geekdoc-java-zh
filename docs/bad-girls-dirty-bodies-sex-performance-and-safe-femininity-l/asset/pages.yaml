  md: '# Series Editors’ Foreword


    Just what constitutes ‘popular culture’ is something that many of the books in
    this Library explore, testing the boundaries of culture and subculture. As society
    continues to become more liberal and tolerant, with laws introduced in all parts
    of the world that extend the boundaries of gender equality, so too does the cultural
    context in which gender is performed. Gemma Commane’s study here is relevant,
    as she explores the world of constructions of the femininity that have been in
    taboo and celebrated. As the title of the book shows, there is a moral value judgement
    of what is acceptable of the adjectives ‘bad’ and ‘dirty’. In exploring the subversive
    nature of female performances from subculture to popular culture, Commane is able
    to show how the policing of heteronormative sexual norms has led to these labels
    being attached.


    This book shares several themes with others in the Library, most closely with
    Claire Nally’s Steampunk: Gender, Subculture and the Neo-Victorian (2019) and
    with Anna Watz’s Paradoxical Pleasures (forthcoming), but also in tangential ways
    with Esperanza Miyake’s The Gendered Motorcycle (2018) and Cristelle Maury and
    David Roche’s edited collection, Women Who Kill (2020).


    Commane’s use of ethnographic interviews and own personal experiences of identifying
    as an intersectional queer feminist allows readers to see a world that is on the
    edges of popular culture. Like the participants in Victoria Cann’s Girls Like
    This, Boys Like That (2018), Commane’s evidence shows how complicated it can be
    to negotiate identity in a contemporary setting. Both studies have found that
    there is a boundary between what is ‘cool’ and what is ‘uncool’ or even ‘gross’.
    In Commane’s study, this relates more to expressions of sexuality and'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'she is able to show that these boundaries are both challenged and created.
    What she is also able to show is that the policing of women''s bodies in the ever-present
    patriarchal gaze of popular culture is also mirrored in the subcultural level.


    She explores how this contradiction operates in terms of what is it to be ''bad''
    and what it is to be ''dirty''. In both cases, dangerous femininity is in operation.
    Just as other authors in the Library have explored pornography in terms of gay
    sexuality, Commane''s study shows how similar issues are apparent in queer feminism.
    She offers case studies drawn from interviews with a range of well-known and lesser-known
    performers who engage with expressions of sexuality, gender non-conformity and
    ''taboo''. The performers'' witty and playful expressions of identity test the
    boundaries of ''safe'' femininity. The book leads to an exploration of the more
    mainstream articulation of the Bad Girl and Dirty Body, in the form of heteronormative
    burlesque, before offering a critique of binary opposite of the Bad/Dirty Body
    – the good/clean body – and suggests that the fierce femininity of the Bad Girls
    is something that helps us challenge the patriarchal expectations of the good/clean
    girl.'
