    research being combined with theoretical positions to promote permanency, agency
    and the integrity of knowledges found. There is scope for people who are not white
    (or cis) to explore the meanings in the burlesque scene from their own positionality.
    Importantly, this contributes something different (i.e. embodied knowledge and
    power) especially when it comes from those within their spheres, who are part
    of the meaning making. This correlates to the nature of ethnography and the method
    as lived experience. For example, there needs to be more research exploring trans
    and non-binary performers and BAME burlesquers. I am an ally, but it is not my
    place to discuss those practices as my positionality (being white, cis, queer,
    etc.) would interpret meaning in ways that may take voice away. Ownership needs
    go to those communities.


    What the book identified, through an ethnographic study, highlights visibility
    and worth in including marginalized identities through the variety of ways in
    which femininity can be re-presented. As insiders and outsiders depend on location,
    group allegiance and attitude, then the book opens up routes for the integration
    of a variety of embodied knowledges which acknowledge the irreducibility of human
    experience. Therefore, suppositions regarding sexualized women need not always
    be reduced to standardized interpretations'
