  md: '# 212 Bad Girls, Dirty Bodies


    connoting tainting a community or lack of choice. Rather, the integration of women
    who have the choice to be sexual without being reduced to insignificance or demonized
    demonstrates the need to continually question the purity/dirt paradigm as the
    definitive point to which all characteristics are set. How women are expected
    to study and how particular types of women are framed/depicted/researched are
    important areas to continually address in future research because how both are
    conceived through theory and attitude affects the ways in which participants can
    be re-presented. Consequently, this continually needs to be addressed in order
    to progress knowledge, how we understand various social positions and how particular
    social positions can shake the limits of gender and sexuality.


    One key area of research that I will continue to explore is the Bad Girl, by opening
    critique into the lived experiences of creatives, entrepreneurs and activists
    within the sex industry (namely Professional Domination). In addition, future
    research should seek to challenge how ethical approval is gained for ethnographic
    research, specifically as ethical committees have a specific quantitative view
    on what ethics looks like. The future of research depends not only on the continuation
    of agency and truthfulness within all aspects of the research process, but on
    ethnographic research into gender and sexuality actually taking place.'
