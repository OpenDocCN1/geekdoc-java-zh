  md: '# Library of Gender and Popular Culture


    From Mad Men to gaming culture, performance art to steampunk fashion, the presentation
    and representation of gender continues to saturate popular media. This series
    seeks to explore the intersection of gender and popular culture, engaging with
    a variety of texts - drawn primarily from Art, Fashion, TV, Cinema, Cultural Studies
    and Media Studies - as a way of considering various models for understanding the
    complementary relationship between ‘gender identities’ and ‘popular culture’.
    By considering race, ethnicity, class, and sexual identities across a range of
    cultural forms, each book in the series adopts a critical stance towards issues
    surrounding the development of gender identities and popular and mass cultural
    ‘products’.


    # For further information or enquiries, please contact the library series editors:


    Claire Nally: claire.nally@northumbria.ac.uk

    Angela Smith: angela.smith@sunderland.ac.uk


