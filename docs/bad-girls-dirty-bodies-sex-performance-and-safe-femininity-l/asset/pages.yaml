    Birmingham, Manchester, Brighton, London and Blackpool. Over forty-two events
    were visited (club nights, private parties, erotic art exhibitions and adult lifestyle
    shows, cabaret nights with dining, theatre shows in city centres, community events
    and fetish fashion markets). Over 170 performances were observed (involving 109
    different performers), which revealed themes such as tensions between different
