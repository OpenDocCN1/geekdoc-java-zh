    \ the multicore of the PGI compiler. This allows use MPI for communication, and\
    \ OpenACC parallelization within a node on Central Processing Unit (CPU) clusters.\n\
    \nAs described, the subfolder `Jacobi_MPI_multi_device` contains an example for\
    \ the alternative to use a multidevice with OpenACC.\n\n# EXAMPLE: JACOBI SOLVER\
    \ FOR THE 2D POISON EQUATION\n\nThe source code accompanying this chapter uses\
    \ a Jacobi solver for the 2D Poisson equation\n\n$\\Delta A(y,x) = e^{-10(y'+x')}$\n\
    \nwith periodic boundary conditions on the top/bottom and left/right boundaries\
    \ (Jacobi Method, 2016: Poisson Equation, 2016). The solver essentially executes\
    \ the following steps in a loop checking for convergence:\n\n+   1. Execute a\
    \ Jacobi step on all inner points of the domain by dominating (Fig. 5).\n\n$A_{i+1}(ix,ij)\
    \ = rhs(ix,ij) - (A_x(ix,ij-1) + A_x(ix+1,ij) + A_y(ix-1,ij) + A_y(ix,ij+1))$\n\
    \n```\nerror = 0.0;\n@pragma acc kernels\nfor (int iy = 1; iy < NY-1; iy++) {\n\
