  md: '# Foreword by Michael Wolfe


    It''s all about Performance.


    In short sentence, that sums up this book—Parallel Programming with OpenACC. For
    many readers, that sums up what you want and need, whether you believe it or not.
    From the beginning of computing until the turn of the millennium, we expected
    and received faster computers almost every year, due largely to semiconductor
    technology improvements. For the past 12 years, processor clock rates have not
    improved. This means that parallelism, in some form, is the only avenue for higher
    performance.


    Parallel computing is not a new topic. For over 50 years, parallelism in computer
    designs has been exploited in one form or another. Pipelined processors with multiple
    independent functional units appeared in the 1960s with the Control Data 6600
    and the IBM 360 model 91. Vector processors appeared in the 1970s with the Control
    Data STAR, Texas Instruments ASC, and Cray 1. Multiprocessor systems were also
    designed and built in that time period, and symmetric memory multiprocess became
    common in the 1980s, particularly with the ability of single-chip 32-bit processors.
    Highly parallel multi-node systems became available in the 1980s, such as the
    nCUBE hypercube, Intel iPSC/1, and many more. The various message-passing programming
    models eventually became standardized in the Message Passing Interface in common
    today. For a programmer, today''s top supercomputers have many similarities to
    those early hypercube systems, the largest current systems have more than 90,000
    nodes.


    Now we are at another inflection point in the design of high-performance systems.


    Parallelism is still the performance driver, and these systems will have many
    message-passing nodes, but the nodes themselves are becoming highly parallel.
    Even workloads are much more parallel than the past. This is due in part to processor
    architecture adopting the pipeline and multiple functional features of early supercomputers.
    These processors include SIMD instructions, with similarity to early vector processors,
    and incorporate multiple cores, each core acting like an independent processor
    in the symmetric, shared-memory operating chips, with each coherence managed by
    a high speed inter-processor connection. The number of cores at each node or in
    a high-end workstation is increasing dramatically, from digits to over 20 today
    and more in the near future. The Intel Integrated Core (MIC) CPUs have up to 72
    cores on a single chip by the time this book is published. Many CPUs have cores
    that also support multiple hardware threads, delivering overall performance by
    taking advantage of even more application-level parallelism.


    Recently, the use of attached accelerators has become common, in particular using
    GPUs for computing. Attached accelerators appeared as far back as the'
