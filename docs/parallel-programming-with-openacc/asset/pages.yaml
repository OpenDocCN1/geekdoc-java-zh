    # COMPUTATIONAL DETAILS


    For the purpose of evaluating the various GPU schemes of the “Implementation”
    section, we conduct performance tests on four problems of increasing size, namely
    the [alaj-5] alpine amino acids in an α-helix arrangement) in the cc-pVXX (X =
    D, T, Q, and 5) basis sets by (Dunning Jr., 1989) and cc-pVXX-RI auxiliary basis
    sets (Hättig, 2005; Weis, Kohn, & Hättig, 2002), which are double-, triple-, and
    pentuple-z quality. The problems are defined by the number of occupied orbitals,
    virtual orbitals, auxiliary basis functions, and size of Alpha in GB (mem):


    +   - DZ: nocc = 100; nvirt = 399; naux = 0.6

    - TZ: nocc = 100; nvirt = 1058; naux = 2.5

    - QZ: nocc = 100; nvirt = 2140; naux = 8.4

    - SZ: nocc = 100; nvirt = 3751; naux = 22.4


    In terms of hardware, the accelerators used are NVIDIA Kepler K4 GPUs (280 processor
    cores at 745 MHz GPU Boost at 875 MHz enabled), and the “GPU boost” section (12GB
    main memory) and nodes are Intel Ivy Bridge E5-2690 v2, dual 10-core CPUs (20
    cores at 3.0GHz and 128 GB memory). The (single- or multi-threaded, depending
    on the version of the code) host library is Intel MKL (version 11.2) and the corresponding
    device math library is CUBLAS (CUDA 7.5). All calculations are serial (non-MPI),
    and the OpenMP- and OpenACC-compatible Fortran compiler used is of PGI compiler
    (version 16.4).


    # GPU boost


    On the K40 GPUs, the base clock rate is 745 MHz. However, provided that the power
    and thermal doubts allow it, e.g., for small problems in the current context,
    the GPU offers the possibility of boosting the application performance by increasing
    the GPU boost (and memory) clock rates. The GPU will dynamically reset the clock
    rates to the default values when cannot safely run over the selected clocks, the
    use of GPU boost is an additional (free) way of enabling even more performance
    from the accelerator. From the results in Fig. 10, we note how the double- and
    triple-ζ calculations in double precision (scheme GPU-7), the net increase amounts
    to 7–13%, while the effect of the increased application clock rates diminishes
    for the larger QZ problem. For the corresponding calculations in single precision,
    however, the increase in performance comes close to matching the theoretical increase
    from 745MHz over 810 MHz (9%) to 875 MHz (17%), and the results in Fig. 10 hence
    mirror the intrinsic difference between the single and double precision math library
    routines as well as the possible gain of using the former whenever possible.'
