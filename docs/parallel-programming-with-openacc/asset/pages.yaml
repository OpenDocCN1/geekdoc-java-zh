    # PREPARING THE MEASUREMENT THROUGH CODE INSTRUMENTATION


    In order to acquire very detailed performance data, the source code of the application
    under test needs to be modified to push events to a performance monitor. This
    process is called instrumentation, which means the compiler is invoked with additional
    options to generate callbacks for all function entries and exits which will be
    handled by Score-P. These callbacks are the events that were introduced previously.
    This order requires that the compiler supports the injection of such callbacks,
    which most current compilers do.


    All parallelism paradigms (MPI, OpenMP, Pthreads, OpenACC, CUDA, OpenCL, OpenSHMEM,
    or any combination) are instrumented automatically providing performance tool
    interfaces, wrapper libraries, or source-to-source transformation. As a result,
    Score-P can record all activity directly without manual changes to the source
    code of the application under test.'
