  md: '# ASYNCHRONOUS EXECUTION


    Now that both the computation and data transfers have been blocked they can be
    made asynchronous, freeing the host CPU to issue each block to the accelerator
    without waiting for the previous block to complete. This is done by using the
    async and wait directive. The async clause can be added to nearly any OpenACC
    directive to make it operate asynchronously with the CPU. When a directive is
    async the operation is placed in a work queue and immediately returns to the host
    CPU. Since all of the accelerator directives are now operating asynchronously
    with the host CPU, the CPU eventually reaches a point at which it needs the results.
    It is necessary to use OpenACC wait directive to suspend execution until the previously
    issued asynchronous operations complete. In the example the right place to wait
    is between the end of the looping block and the end of the data region, since
    we need to ensure that all of the blocks are copied back to the host device arrays
    are destroyed at the end of the data region. Once all asynchronous operations
    complete, the host CPU execution can use the results. Fig. 9 shows the resulting
    code:


    ```

    19 num_blocks = 16;

    20 block_size = (HEIGHT/num_blocks)*WIDTH;

    21 #pragma async data create(image[WIDTH*HEIGHT])

    22 {

    23 for(int block = 0; block < num_blocks; block++) {

    24 int start = block * (HEIGHT/num_blocks);

    25 int end = start + (HEIGHT/num_blocks);

    26 }

    27 #pragma parallel loop async

    28 for(int y=start; y<end; y++) {

    29 for(int x=0; x<WIDTH; x++) {

    30 image[y*WIDTH+x]=mandelbrot(x,y);

    31 }

    32 }

    33 #pragma async update self(image[block*block_size:block_size]) async

    34 #pragma async wait

    35

    ```


    FIG. 9

    Mandelbrot code pipeline with asynchronous blocks.


    The final step in building the pipeline is to exploit the fact that each block
    is independent of each other block by putting blocks into different asynchronous
    queues. The async clause accepts a number representing the number of the queue
    in which to add the work. In theory each block could be given its own queue, but
    the creation of work queues can be an expensive operation on some architectures.
    Instead we use two queues: one for computing and one for copying data back from
    the accelerator. The parallel loop and the update for each block must occur in
    order, so they should occur in the same queue, but blocks are independent, so
