    careful choice of their optional parameters. The tuned OpenACC accelerated running
    on the GPU was almost twice as fast as its OpenMP counterpart running on the multicore
    CPU.


    # CONCLUSION


    The OpenACC standard allow for a multitude of options to annotate the loop construct
    in order to provide hints to the compiler about the type of parallelism that should
    be used for executing the loop and define any necessary reduction operations.
    Some of the clauses described in this chapter have special use cases; others are
    more common and applicable to the majority of codes. Further tuning of some integer
    arguments in some of the clauses is typically good to get better performance of
    the accelerated kernel on the target hardware. You can refer to some research
    work that has been conducted for auto-tuning these parameters. Even though this
    chapter focuses on explaining the different clauses that can be used with the
    loop construct, developer may use a combination of many of these in their kernels.
    Fig. 17 illustrates this aspect by using both tile and reduction clauses for example.'
