  md: '# Development of OpenACCl CloverLeaf 201


    By splitting the nested loops, only one loop is not being partitioned as desired
    for acceleration. In the case of this nonpartitioned loop, it can be forced to
    be scheduled across all the threads by addition of the OpenACC vector class to
    the !acc loop construct.


    Fig. 14 illustrates the original nested loop structure alongside its re-factored
    accelerated pseudo code. The re-factored advec mom kernel time drops from 19s
    to 8s as highlighted in Fig. 15’s re-profile. Fig. 15 also shows that the timestep
    routine is now dominating the runtime. Consulting the associated listing file
    for timestep reveals that the kernel is only executing on a single GPU thread.


    ```

    !acc parallel loop

    DO k = y_min, y_max

    DO j = x_min, x_max

    <flux stuff>

    ENDDO

    ENDDO

    !acc end parallel loop

    !acc parallel loop

    DO k = y_min, y_max

    DO j = x_min, x_max

    <mass stuff>

    ENDDO

    ENDDO

    !acc end parallel loop

    !acc parallel loop

    DO k = y_min, y_max

    !acc loop vector

    DO j = x_min, x_max

    <vel stuff>

    ENDDO

    ENDDO

    !acc end parallel loop

    ```


    ```

    !acc parallel loop

    DO k = y_min, y_max

    DO j = x_min, x_max

    <flux stuff>

    ENDDO

    DO j = x_min, x_max

    <mass stuff>

    ENDDO

    DO j = x_min, x_max

    <vel stuff>

    ENDDO

    ENDDO

    !acc end parallel loop

    ```


    (A) (B)


    FIG. 14


    Nested and re-factored pseudo code for advec mom: (A) version B and (B) version
    C.


    The cause is traced to the use of global variables. As all threads have the potential
    to write to these global variables, the compiler is taking a conservative approach
    and only allowing the scheduling of the kernel on a single thread. The global
    variables in question are the timestep kernel to return the (i,j,k) coordinate
    of the cell which contains the minimum timestep values for the iteration. This
    functionally can be retained without the need of global variables by the Fortran
    intrinsic MINLOC.


    Constituting version C, the flat profile (Fig. 16) shows the timestep kernel’s
    execution time is reduced from 13s to less than 1s.'
