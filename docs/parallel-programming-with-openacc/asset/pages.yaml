    # A SIMPLE DATA-PARALLEL LOOP


    Programming a sequential processor requires writing a program that specifies each
    of the tasks and data operations needed to compute some result. OpenACC was created
    so programmers can insert pragmas to provide information to the compiler about
    parallel opportunities and data movement to and from accelerators. Programmers
    use pragmas to work in concert with the compiler to tune and optimize parallel
    to achieve high performance.


    OpenACC helps programmers write efficient data- and task-parallel software. Data-parallelism
    focuses on distributing data operations across multiple current threads of execution.
    A *thread* in computer science is short for a thread of execution that runs a
    section of code personally. By using multiple threads of execution, an application
    can make use of parallel hardware such as multicore processors'
