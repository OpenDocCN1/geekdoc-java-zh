    # DESCRIBE DATA MOVEMENT


    In order to ensure that our three accelerated routines share the device arrays
    and remove the necessity to copy data to and from the device in each function,
    we will introduce OpenACC data directives to express the desired data motion at
    a higher level in the program call tree. By taking control of the data motion
    from the compiler we are able to express our knowledge about how the data is actually
    used by the program as a whole, rather than requiring the compiler to make cautious
    decisions based on how the data is used inside individual functions.


    OpenACC has two types of directives for managing memory: structured and unstructured.
    The structured approach has a defined beginning and end within the same program
    scope, for instance a function, which limits its ability to express data motion
    to programs be represented in a structured way. Unstructured data directives provide
    the programmer more flexibility in where data management occurs, allowing the
    allocation and deletion of data to happen in different places in the program.
    While this is es useful in C++ classes, where data is frequently allocated in
    a constructor and deleted in the destructor it provides the programmer with a
    clean way to manage the device memory alongside the management of host memory.
    For this we''ll use the unstructured data directives to manage the device data
    in the existing data management routines.


    The enter data and exit data directives are used for unstructured data management.
    As the names imply, enter data specifies the beginning of a variable''s'
