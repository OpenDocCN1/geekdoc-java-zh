    Equation 1: Amdahl''s law


    Amdahl''s law tells us that OpenACC developers have two goals when parallelizing
    an application:


    +   1. Express the parallel sections of code so they run as fast as possible.
    Ideally they should run N times faster using N processors.

    2. Utilize whatever techniques or inventiveness they have to minimize the (1–P)
    serial time.


    It is possible that the parallel sections can run so fast that the program''s
    runtime can become dominated by the serial section(s) of code. This is one of
    the reasons why computer architects powerful sequential processors (e.g., CPUs)
    with parallel accelerators and coprocessors.


