    # # SUMMARY


    OpenACC, a directive-based programming model, can generate executables for more
    devices than just GPUs. This means that an application scientist can maintain
    a single code base whilst portant applications across a range of computing devices.
    This is critical since legacy codes usually contain several millions of lines
    of code, and it is impractical to rewrite them every time the device architecture
    changes.'
