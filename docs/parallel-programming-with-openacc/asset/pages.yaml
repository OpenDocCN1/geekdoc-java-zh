  md: '# Using OpenACC to port large legacy climate and weather modeling code to GPUs


    Xavier Lapillonne*, Katherine Osterried*, Oliver Fuhrer*

    Federal Office of Meteorology and Climatology MeteoSSwiss, Zurich, Switzerland*
    Center for Climate Systems Modeling (C2SM)


    The purpose of this chapter is to describe a step-by-step porting approach for
    weather and climate model Fortran code to run on GPUs using CUDA and OpenACC.

    At the end of this chapter, the reader will have a basic understanding of:


    +   - How to use OpenACC to port components of a production weather and climate
    model achieving a gain of about a factor of 2.3x in terms of time and about a
    factor of 3x in terms of energy to solution

    - The step-by-step approach to port large sections weather and climate model code
    with OpenACC

    - Optimizations that may be introduced to enhance performance further on GPU when
    using OpenACC


    # INTRODUCTION


    Weather and climate models typically encompass a large codebase maintained by
    an international developer community of weather and climate researchers. The life-cycle
    of weather and climate models is often in the order of 30 years, they tend to
    contain a significant fraction of legacy Fortran code. Furthermore, many code
    sections of these models have a low compute intensity, the speedup achieved by
    executing individual code sections on accelerators may not be sufficient to compensate
    for the extra cost of data transfers between the Central Processing Unit (CPU)
    and the accelerator: As a consequence, a significant fraction of the legacy'
  merge: -1
  pgno: 286
- img_proc: true
  md: '268 CHAPTER 13 Large legacy climate and weather modeling code


    code has to be ported to accelerators in order to avoid costly data transfers
    as much as possible. Since the effort of a complete rewrite—for example, in CUDA—may
    be excessive, port the code to accelerators using compiler directives is an attractive
    and time-efficient alternative.


    The material presented here is inspired by our experience in porting the full
    COSMO (Consortium for Small Scale Modeling) weather and climate model. When beginning
    the effort to port and optimize the COSMO model to run on Graphic Processing Units
    (GPUs), the first step taken was to profile the model carefully. The goal of porting
    the code to GPU and optimizing it is only to reduce runtime. It is therefore fundamental
    to have a good understanding of not which subroutines are the most computational
    time in the program, but also where the large data transfers occur between the
    CPU and GPU. Several profiling tools were used during the porting and optimization
    process of the COSMO model. The profiler from Nvidia is useful to understand the
    performance of individual kernels, while internal timers have been used to get
    a global overview of the different model components when running the model at
    scale on a distributed system. Fig. 1 shows the runtime of different sections
    of the model in the production environment at the Federal Office of Meteorology
    and Climatology MeteSwiss (in Switzerland).


    ![](img/4798a278f62814efc0b15c6258d71d30_287_0.png)


    +   Dynamics Physics Output Assimilation


    FIG. 1


    Operational COSMO runtime distribution.


    Clearly, the dynamics—the part of the model solving the equations of flow motion—is
    the most time-consuming part of the model run. However, the dynamics section was
    ported with a different strategy directly using CUDA (Fuhrer et al., 2014), and
    is therefore not discussed here. The porting and optimization work with OpenACC
    directives was applied to the physics parameterizations and the data'
