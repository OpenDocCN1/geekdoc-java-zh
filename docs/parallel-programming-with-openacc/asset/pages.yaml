  md: '# CHAPTER


    # GPU-accelerated molecular dynamics clustering analysis with OpenACC


    John. Stone, Juan R. Perilla, C. Keith Cassidy, Klaus Schulten

    University of Illinois at Urbana-Champaign, Urbana, IL, United States


    This chapter explores the use of OpenACC to accelerate the calculation of a so-called
    dissimilarity matrix, the most costly computation required for clustering analysis
    of molecular dynamics simulations.

    By the end of this, the reader will have an understanding of:


    +   * Key algorithmic analysis steps that help decision making involved in application
    acceleration and parallelization and help set realistic performance targets for
    a successful OpenACC implementation on GPUs and other accelerators

    * Differences in development and maintenance of directive-based kernels and compiler
    autvectorization as compared with data-parallel languages such as CUDA and OpenCV,
    and hand-written kernels based on compiler intrinsics and the like

    * The step-by-step approaches taken for adaption of existing molecular dynamics
    trajectory analysis algorithm for OpenACC

    * Program and data structure transformations that are beneficial for performance
    on GPU accelerators and many-core CPUs that employ SIMD vector units

    * Performance tuning techniques that can help OpenACC compilers and runtime systems
    achieve better performance on target accelerators with typical architecture characteristics


    # INTRODUCTION


    The tremendous performance provided by petascale supercomputers enables scientists
    to use molecular dynamics (MD) simulations to study in atomic detail the structure
    and dynamics of large biological complexes, including viruses'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# CHAPTER 11 GPU-accelerated molecular dynamics clustering analysis


    (C. Liu et al., 2016; Perilla, Hadden, Goh, Mayne, & Schulten, 2016; Zhao et al.
    2013), the sensory arrays of bacteria (Cassidy et al., 2015) and photosynthetic
    membranes (Stone et al., 2016), that are otherwise inaccessible to experimental
    imaging and associated structure determination methods. A decade ago, the required
    performance of analysis software for MD simulations was just beginning to become
    a significant consideration for molecular scientists. Today, the long simulation
    times that can be achieved by the combination of state-of-the-art simulation algorithms
    and leading computing platforms present a formidable challenge for researchers,
    who must efficiently analyze hundreds of trajectories by deconstruction.


    Accelerators as Graphic Processing Units (GPUs) are a major part of the performance
    achieved by state-of-the-art supercomputing platforms, so modern simulation and
    analysis tools have adapted to take advantage of accelerators for key algorithms.
    The performance of MD simulation tools is often determined by a few well-known
    algorithms for computation and time-integration of forces, in only a moderate
    number of computational kernels that are performance-critical. In contrast, for
    simulation preparation, and visualization encompass a much larger number of algorithms
    that are highly user-customizable to suit the unique needs of a given research
    project, resulting in a comparatively large number of kernels that need to be
    optimized to exploit GPUs or other accelerators.


    As a representative example, the molecular visualization and analysis tool VMD
    (Humphrey, Dalke, & Schulten, 1996), developed by the authors, contains roughly
    half million lines of code written in C++, and a similar number of lines written
    in high-level scripting languages such as T and Python. The wide range of analysis
    algorithms that must ultimately support accelerators poses a challenge it may
    not be practical to develop and maintain hand-coded accelerator kernels written
    in high-level simple multi-data languages such as CUDA (Nickolls, Buck, Garland,
    & Skadion, 2008), OpenCL (Stone, Gobara, & Shi, 2010), or ISPC (Pharr & Mark,
    2012), neverthe lower-level hand-coding of Single Instruction Multiple Data (SIMD)
    vectorized kernels using processor-specific intrinsics such as SSE, AVX, or similar.
    In the case of VMD, many analysis and visualization algorithms have already been
    adapted for accelerators (Stone, Hardy, Ufitsev, & Schulten, 2010; Stone, McGeevey,
    Israelowitz, & Schulten, 2014; Stone et al., 2016), however many more remain.
    New algorithms are always being created for accelerators. OpenACC, OpenMP, and
    other directive-based parallel programming approaches provide an interesting avenue
    for low-cost adaptation of large portions of existing applications to heterogeneous
    computing platforms with GPUs and other accelerators by leveraging the latest
    advances in compiler technology, parallel runtime systems, and accelerator hardware.


