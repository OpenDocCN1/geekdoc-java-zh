  md: '# ADVANCED LOOP OPTIMIZATION CLAUSES


    # THE gang, worker, and vector CLAUSES


    A typical accelerator architecture exhibits multiple levels of parallelism. For
    example, NVIDIA GPUs consist of multiple streaming multiprocessors, each of which
    can schedule blocks of warps, which are 32-wide Single Instruction Multiple Data
    (SIMD) threads. On the other hand, Intel Xeon Phi, has a large number of x86_64
    cores, each of which can execute up to four threads of 52-bits-wide SIMD instructions.


    In line with these common architectural considerations, OpenACC has been equipped
    with the gang, worker, and vector clauses allow you to map the loop iterations
    to the target device using three levels of parallelism. Please note that these
    clauses can also be associated with the parallel or kernels constructs to a loop
    construct. This chapter does not discuss this specific case and rather focuses
    on their usage accompanying a loop construct.


    The first level of parallelism can be specified using the gang clause, which ensures
    that the iterations of the associated loop or loops are executed across multiple
    gangs. Furthermore, you can add an integer argument to state the number of gangs
    to be scheduled on the device.


    The second level of parallelism can be described using a worker clause to indicate
    that the iterations of the associated loops are be executed in parallel across
    the workers within a gang. You can optionally add an integer argument to specify
    how many workers per gang to execute the iterations of this loop.


    The third level of parallelism can be expressed using the vector clause, which
    specifies that the iterations of the associated loop or loops are be executed
    with vector or SIMD processing. Similarly, you can add an optional integer argument
    to determine the vector. Typical vector lengths for Graphic Processing Unit (GPU)
    targets are multiple of the warp size, i.e., 32 in the latest generations.


    If you do not specify these clauses and/or their arguments, the compiler will
    use its heuristics to make the best mappings.


    On NVIDIA GPUs, a possible mapping could be gang to thread blocks, worker to threads.
    Alternatively, you can omit the worker clause and map gang to thread blocks and
    vector to threads within a block.


    In our example, we further annotate the outer loop construct with the gang clause
    and the subsequent nested loop with the vector clause. Then, the optional argument
    for both clauses is tuned to achieve better performance with the best combination
    of number of thread blocks and number of threads per block. While our example
    is tuned manually, it is possible to obtain the best values using some available
    auto-tuning tools (Fig. 13).'
