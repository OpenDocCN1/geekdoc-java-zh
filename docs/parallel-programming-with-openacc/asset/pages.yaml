    This chapter shows how a directive-based model can make it possible for application
    scientists to ''keep'' their codes, accelerate them with reduced programming effort,
    and achieve performance equal to or better than that obtained using hand-written
    code and low-level programming interfaces. Specifically, this chapter covers programmers''
    experiences porting two commonly used algorithms—Feldkamp stencil—on single and
    multiple GPUs with multicore platforms. These algorithms are representative of
    computational patterns used in a variety of domains including computational fluid
    dynamics, PDE solvers, MRI imaging, and image processing for computed tomography
    among several others. Additional discussion explains how OpenMP, another widely
    utilized directive-based programming model, can co-exist with OpenACC thus creating
    a hybrid programming strategy to target and distribute the workload across multiple
    GPUs.


    At the end of this chapter the reader will have a basic understanding of:


    +   - How to profile and get a basic understanding of code characteristics for
    GPUs

    - To compile an OpenACC code using relevant compilation flags and analyze the
    compilation information

    - To incrementally improve an OpenACC code

    - How to use OpenMP with OpenACC in the same code

    - How to tune OpenACC code and provide relevant hints to achieve close to, or
    better performance than CUDA code


    # INTRODUCTION


    Accelerators have gained mainstream in High Performance Computing (HPC), where
    they are being widely used in fields such as bioinformatics, molecular dynamics,
    computational finance, computational fluid dynamics, weather, and climate. Their
    power efficient, high capacity enables many applications to run faster and more
    efficiently than on general-purpose Central Processing Units (CPUs). As a'
