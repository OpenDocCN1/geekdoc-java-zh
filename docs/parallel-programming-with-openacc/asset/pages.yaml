    # VERSION D: MULTIGPUS, REDUCING HIDDEN TRANSFERS


    To understand how the scaling on the accelerator is limited to a few GPUs, attention
    is needed on determining the bottlenecks of multiGPU execution. The first area
    of interest is the data transfers between the host CPU and GPU. Depending on the
    variable in question, different depths of halo exchange cells are required for
    spatial domain decomposition. By default, the MPI hidden code sets the halo depth
    consistently for all variables. That default matches the maximum depth required
    for the worst case variable. As MPI communication is a stepping function rather
    than a linear progression, the overhead in communication of one or two layers
    of data is negligible, if at all. However, any halo exchange data when running
    on GPUs first needs to be transferred from the GPU to the host memory to CPU to
    MPI communication, and the receiving GPU needs to transfer the new data from host
    memory to the GPU.


    As previously, PCIe data transfers to and from the GPU are a major bottleneck,
    so no reduction in data transfers should provide benefit. With this in mind the
    code was the CRA ACC DEBUG environment variable documented from version 8.1.0.165
    of CEE. The variable has three在了 setting levels. Each level providing increasing
    amounts of information relating to and how much data is transferred to and from
    the GPU.


    Enabling the CRA ACC DEBUG environment variable shows unexpected data transfers
    in the accelerate kernel not associated to the halo exchange data. Although a
    relatively small in size (2376 bytes), the output shows that a Fortran derived
    is being transferred and allocated on the GPU. On further investigation, the scalar'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'components of that particular derived type are being utilized in the accelerate
    kernel, and an implicit copy of the entire derived type is occurring to place
    it on the GPU. The implicit copy stopped by creating local scalars and copying
    the appropriate fields from the derived type into the local scalars.


    The resultant performance of version D of the mini-app with shown in these two
    changes implemented is Fig. 18. Although this is a significant improvement, multiple
    GPU scalability is still relatively modest with 4 GPUs taking 63.57s while 6 GPUs
    taking 67.01s.


    ![](img/4798a278f62814efc0b15c6258d71d30_223_0.png)


    FIG. 18

    Version D performance comparison.


    # VERSION E: “ACC SYNC WAITS"


    A profile of version D is shown in Fig. 19. What is now dominating are a number
    of routines all with the overhead of ACC SYNC WAIT. On further investigation,
    what all of these routines have in common is that they allocate data on the GPU.


    By preallocating temporary arrays at the same height level of the calling tree
    as described in the “Achieving Full Residency on the GPU” section and carrying
    out an initial data copy to the device, device memory is re-used multiple times
    by passing the relevant arrays through subroutine arguments. This removes the
    need to check if the data is present, and negates the need to create it on the
    device via an allocation.


    Fig. 20 pseudo code for the original allocation method and the location implementation.
    A new code profile of version E (with the preallocations implemented) is displayed
    in Fig. 21. This shows the implementation of the preallocation removed the ACC
    SYNC WAIT overhead.'
