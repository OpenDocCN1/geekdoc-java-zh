  md: '# 210 CHAPTER 10 The detailed development of an OpenACC application


    This structure thus allowed us to have one code base to target the CPU and one
    to target the GPU.


    However, with the more recent versions of the PGI compiler there is now the facility
    to target the CPU with OpenACC code.


    Currently you must build the binaries with a separate targeting, multicore for
    the CPU threads. However, this can be done with the source code used for the GPU
    variant, from a maintainability perspective this is significantly beneficial.


    OpenACC provides a perfect framework for variance in targets to the descriptive
    nature of the language. Within the OpenACC part of CloverLeaf we make use of the
    Kernels construct, marking each loop as “Loop Independent;” this works well with
    nested loops.


    The descriptive nature of OpenACC, allowing us to do this without making any further
    restriction on how it should be executed.


    We simply state that the loop iterations can be processed in parallel, without
    worrying about placement. This means that the compiler is free to make decisions
    on how to generate threaded code based on this information.


    By taking an OpenACC code we implicitly know that is enough in the kernel, to
    make it worth processing on a GPU.


    This currently works on the CPU by targeting the outermost loop as the parallel
    loop. In many scenarios this will be the desired behavior, however without making
    use of nested parallelism this may not expose sufficient parallelism for the number
    of CPU threads the code is running.


    There is one inherent difference between the GPU and CPU environment is data movement.


    With GPU programming, there are two distinct memory spaces, of the CPU and that
    of the GPU. OpenACC as a language reflects that, supporting directives for the
    placement and movement of data.


    With the CPU thread support, no code executes in the same memory space as the
    host code, there is no need to be explicit about the data movement.


    For the CloverLeaf mini-app, we are able to recompile the codebase with “=tesla”
    rather than “-tesla” or the desired GPU target.


    This compilation took place without any fault and generated a binary which could
    run on the CPU threads.


    Using the PGI 15.7 compiler, with support for multicore, we were able to compile
    and run CloverLeaf both as OpenMP and OpenACC builds. We are then able to perform
    a side by side analysis of the resulting performance.


    We then scaled the binaries, running flat threads (no MPI) across the whole of
    a dual socket, 24 cores, Intel Xeon (Haswell), for both data sets (Figs. 26 and
    27).


    From the results we can see that for both problem sizes there is negligible performance
    difference between the two parallelism options. This is reassuring, as it utilizes
    the use of a single source codebase to target two very different hardware options,
    with no loss of performance.'
