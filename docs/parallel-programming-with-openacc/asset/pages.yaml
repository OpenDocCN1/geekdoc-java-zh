  md: '# Preface


    Welcome to our book, a collection of introductory, intermediate, and advanced
    chapters that provides an OpenACC education from beginner to advanced. The book
    draws on 23 authors from around the world who have shared their expertise in both
    teaching and working with highly parallel programming. Their examples are both
    timely and timeless. Each chapter is written to be self-contained for private
    study or as a section for classroom study. PowerPoint slides and example codes
    are available on the github: https://github.com/mfarber/ParallelProgrammingWithOpenACC.


    This book is about parallel programming and not about OpenACC alone, or providing
    information that can be gleaned from documentation. It is about acquiring the
    knowledge to write practical and performant well as portable programs that run
    across a broad spectrum of devices, ranging from CPUs to GPUs. To make this concrete,
    the authors in this book demonstrate the use of compilers by vendors like PGI,
    Cray, and PathScale to create example codes and demonstrate them running on Intel
    x86 processors, Cavium 96-64-bit ARMv8 processor chipsets, and NVIDIA GPUs.


    Performance and profiling go hand-in-hand, which is both open source and PGI profilers
    are also included.


    It is amazing how the OpenACC 2012 standard has changed, and compiler technology
    matured since June 11, 2012 OpenACC tutorial on the Dr. Hobbs website: “Easy GPU
    Parallelism with OpenACC.” The past 4 years of intense development mean that OpenACC
    is now available at most HPC sites and in the freely available GNU compiler toolset.
    Access and availability is why real application examples are provided in the intermediate
    and advanced programming chapters—because programmers need to solve real problems,
    not just work on classroom problems. Meanwhile, OpenACC is still new enough that
    we can all benefit from a few introductory chapters!'
