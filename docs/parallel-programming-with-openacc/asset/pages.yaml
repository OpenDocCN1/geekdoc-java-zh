    copy, which have been added to the outermost loops in Figs. 5 and 6.


    The copyin OpenACC directive informs the compiler that it should copy the named-host
    array onto the GPU prior to launching the parallel kernel, and that it is not
    necessary for the data to be copied back after the kernel is complete, for example,
    the data is either read-only within the GPU kernel, or any modifications made
    to the data can be discarded and not needed by the host. The copy directive is
    similar, except that it copies the named array from the host before the GPU executes,
    and also copies it to the host completion. This is necessary for data that are
    written by the GPU and are ultimately needed on the host. In case of the dissimilarity
    matrix calculation, the GPU kernels only write to a triangular region of the array
    (in the case of a fully symmetric matrix storage), so the matrix is zero-filled
