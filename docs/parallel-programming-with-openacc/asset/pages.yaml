    capabilities. Thus, the expected speedup, S(N) of the parallel code over the serial
    code when using N processors is dictated by the proportion of a program that can
    be made parallel, P, and the portion that cannot be parallelized, (1–P). This
    relationship is shown in Eq. (1):


    ```

