  md: '# 220 CHAPTER 11 GPU-accelerated molecular dynamics clustering analysis


    # FAST COMPUTATION OF PAIRWISE RMSDs WITH QCP


    Widely used approaches for computing RMSDs have typically used one of the well-known
    structure alignment algorithms to perform pairwise alignment (Katsch, 1976, 1978),
    followed by computation of the resulting RMSD using straightforward algorithmic
    implementations of Eq. (1). This approach is well suited for such as visualization
    comparison, where it is desirable to superimpose the two structures for further
    analysis. However, the determination of the best-fit rotation and subsequent transformation
    of the atomic coordinates prevent unnecessary work in the context of computing
    the RMSD dissimilarity matrix for clustering analysis.


    Fortunately there is higher performance alternative approach based on Theobald''s
    Quadratic Characteristic Polynomial (QCP) method (Theobald, 2005). QCP can be
    used to compute the minimum RMSD without the need to determine the optimal rotation
    and align the pair of structures (Theobald, 2005). It should be noted that QCP
    is also capable of computing the optimal rotation (P. Liu et al., 2010). The QCP
    method exploits special properties of the quaternion representation and of the
    characteristics polynomial of a $4 \times4$ "key" matrix. To solve for the minimum
    RMSD, QCP solves for the most positive eigenvalue of the $4 \times 4$ matrix using
    the Newton-Raphson method to find the largest eigenvalue, which is used to compute
    the minimum RMSD. The costliest computation within the QCP algorithm is the calculation
    of the $4 \times 4$ matrix to solve (Kneller, 2011; P. Liu, Agrafotis, & Theobald,
    2011). Fortunately, with some adaptations we describe in the following, the calculation
    of the $4 \times 4$ matrix is very well suited for fine-grain parallel computing
    approaches and benefits from the heavy memory bandwidth of GPUs. The QCP Newton-Raphson
    solver is well suited for implementation within individual GPU threads or SIMD
    vector units. The pseudocode shown in Algorithm 1 summarizes the center of mass
    decomposition and translation preprocessing steps and the QCP $4 \times4$ matrix
    construction loop we will target for parallelization with OpenACC directives.


    # ATOM SELECTIONS AND TRAJECTORY DATA STRUCTURES


    A challenge that arises with parallelization of algorithms in large software application
    is the need for data to take on a particular layout in memory for most efficient
    access during computation. Since VMD is heavily used for visualization as well
    as structure preparation and simulation analysis, its internal data structures
    are organized to facilitate real-time rendering of large molecular scenes containing
    millions of atoms or other particles. VMD stores atomic coordinate data in an
    array-structures (AOS) format interleaving x, y, and z coordinates, which is the
    memory organization required by contemporary high-performance graphics APIs such
    as OpenGL. To achieve the best performance for computation of RMSDs'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Overview of MD clustering analysis


    ```

    ALGORITHM 1 QCP CALCULATION OF MINIMUM RMSD FOR A PAIR OFnMOLECULAR STRUCTURES

    1: for l=1 to S do [loop over selected atoms in frame A]

    2:   Compute center of mass for trajectory A

    3:   end for

    4: for l=1 to S do [loop over selected atoms in frame A]

    5:   Translate atoms so that the center of mass lies at the origin

    6:   end for

    7: for l=1 to S do [loop over selected atoms in frame B]

    8:   Compute center of mass for trajectory B

    9:   end for

    10: for l=1 to S do [loop over selected atoms in frame B]

    11:   Translate atoms so that the center of mass lies in the origin

    12:   end for

    13: for l=1 to S do [loop over selected atoms in A and B]

    14:   Compute QCP inner product sums for the Newton-Raphson solver

    15:   end for

    16: QCP Newton-Raphson iteration solves RMSD from inner product sums

    17: return RMSD

    ```


    Using QCP on SIMD vector, it is best to restructure the atomic coordinates in
