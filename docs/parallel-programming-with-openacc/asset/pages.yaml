    # SUMMARY


    Managing the creation and synchronization of data between the host and device
    can be a challenge when moving beyond simple programs to full applications. Users
    of OpenACC can simplify this challenge by taking a whole program, top-down approach
    to data management. Utilizing unstructured data regions to create data at the
    same time as the host device allows for the lifetime of device data to match that
    of the host data. The program''s computation can be offloaded incrementally with
    synchronization between the host and device enabled by using OpenACC directives.


    Utilizing OpenACC enter and exit directives can mirror host and device structures,
    aggregating data types with dynamic data, as well as to encapsulate data management
    within C++ class structures. The declare directive allows you to use static global
    and Fortran module in device callable routines. For cases where the host data
    is too large to be contained in device memory, you can create device memory pools
    using acc_malloc in which host data can be mapped using acc_map_data. Finally,
    you can use CUDA IPC memory with acc_map_data to share device data between multiple
    host MPI processes.'
