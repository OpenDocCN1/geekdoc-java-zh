    \ 29\n\nManual caching in a scalar variable.\n\n# RESULTS FOR THE RADIATION PARAMETERIZATION\n\
    \nIn order to illustrate the impact that the advanced optimizations described\
    \ in the previous section can have on a working Fortran code that has been accelerated\
    \ with OpenACC directs, we present in this section results for the radiation parameterization\
    \ in the COSMO model. The radiation parameterization is one of the physics modules\
    \ in COSMO, and is used to calculate the radiative equilibrium in the atmosphere\
    \ (e.g., the solar radiation or cloud radiation). Here, the so-called Ritter-Geleyn\
    \ radiation parameterization (Ritter & Geleyn, 1992) is considered. This parameterization\
    \ in the COSMO model is composed of 18 subroutines and corresponds to approximately\
    \ 10,000 lines of Fortran code. The entire radiation code, the initialization,\
    \ is ported with OpenACC directives are simply added without any further optimizations\
    \ (that is, no loop fusion or reordering, scalar replacement, on-the-fly computation,\
    \ or caching techniques are applied). Profiling of the radiation code indicated\
    \ that one component, namely the radiative equilibrium solver, accounts for about\
    \ 80% of the radiation runtime, and is de-responds to about 1500 lines of code,\
    \ i.e., 15% of the total radiation code, and is split over four subroutines. The\
    \ base code is well optimized for CPU execution, and in particular is in a friendly\
    \ way for compiler auto-vectorization. The more advanced optimizations, as discussed\
    \ in the previous section, are therefore applied to this component of the radiation\
    \ code (Lapillonne & Fuhrer, 2014) to make it more suitable for running on GPUs."
