  md: '242 CHAPTER 12 The OpenACC-accelerated RI-MP2 method


    Bartlett, 2009 offer a systematic approach towards the full configuration interaction
    (FCI) (Helgaker, Jørgensen, & Olsen, 2000) wave function—across the time-independent,
    relativistic Schrödinger equation—within a given one-electron basis. In both hierarchies
    of methods, the Hartree-Fock (HF) solution, in each electron of a molecular system
    is treated in a mean-field bath of all other electrons, is the reference to corrected
    correlations by including excited configurations into the wave function. Moving
    beyond the HF approximation, only the effects that prevent two electrons with
    parallel spin from being found the same point in space (so-called exchange (or
    Fermi) correlation, which is fully described by HF theory), and the corresponding
    Coulombic repulsion between electrons start being described. This implies that
    upon traversing through either of the CC or MBPT hierarchies, increasingly more
    of such a complete description is reached at the FCI limit.


    In the MP2 sense, the lowest-order perturbative correction to the HF energy for
    the isolated effect of double excitations is the second-order Mller-Plesset (MP2)
    model (Mller & Plesset, 1934). As an improvement, the CC hierarchy offers the
    iterative singles and doubles (CCSD) model (Purvis & Bartlett, 1982), which accounts
    not only for double excitations but also to enter the space of all single and
    double excitations out of the HF reference. However, the additional accuracy of
    the CCSD model over the MP2 model comes at a price, as not only is the energy
    evaluated iteratively, but each iteration cycle is also significantly more expensive
    than the simple evaluation of the MP2 energy, scaling as $O(N^5)$ (where $N$ is
    a composite measure of the total system size). Thus, whereas both methods nowadays
