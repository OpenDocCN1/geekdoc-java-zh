  md: 'to understand OpenACC''s three levels of parallelism: gangs, workers, and vectors.

    Starting at the bottom of the levels, vector parallelism is very tight-grained
    parallelism where multiple data elements are operated on with the same instruction.
    For instance, if I have two arrays of numbers that need to be added together,
    some hardware has special instructions that are able to operate on groups of numbers
    from each array and add them all together at the same time. The number added is
    referred to as the vector length, and varies from machine to machine. At the top
    of the levels of parallelism is gangs. Gang operate completely independently of
    each other, with no opportunity to synchronize with each other and no guarantees
    about when gang will run in relation to other. Because gang parallelism is coarse-grained,
    it is very scalable. Worker parallelism falls between gang and vector. A gang
    is comprised of one or more workers, each of which operate on a vector. The workers
    within a vector have the ability to synchronize and share a common cache of fast
    memory. Every loop parallelized by an OpenACC compiler will be mapped to at least
    one of these levels of parallelism, or it will be run sequentially (abbreviated
    seq). Fig. 23 shows the three levels of OpenACC parallelism.


    ![](img/4798a278f62814efc0b15c6258d71d30_66_0.png)


    FIG. 23


    With that background, we can see how the OpenACC compiler has mapped our two loops
    to the levels of parallelism. It has mapped the loop at line 30 to gang and vector
    parallelism, implicitly creating just one worker per gang, and assigned a vector
    length of 128. The loop at line 34 is run sequentially. Given this information
    we can now begin to give the compiler additional information to guide how it maps
    the loops to the levels of parallelism.


    OpenACC''s three levels of parallelism.'
