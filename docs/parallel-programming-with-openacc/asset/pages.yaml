    \n# Caching\n\nIn the physics, as shown in the example code, and in the above\
    \ described pseudo-\ncode, there are some dependencies between the vertical levels.\
    \ It may be beneficial\nto save those variables which are reused at the next level\
    \ as scalars, as illustrated in\nFig. 29. This technique, which we refer to here\
    \ as caching, has the benefit (similar\nto scalar replacement) that the cached\
    \ variables may be stored in a register and\ncan be read again without accessing\
    \ the main memory. Although this type\nof optimization could sometimes be done\
    \ automatically by the compiler, we have\nseen in practice that such manual optimizations\
    \ are often beneficial.\n\n# On-the-fly computation\n\nWhen a computation is done\
    \ multiple times, it is often beneficial for the CPU\nto store the result and\
    \ reuse it at several places. On the GPU, however, the ratio between\nFLOP/s and\
    \ memory bandwidth is such that in most cases it is better to avoid the\nadditional\
    \ memory accesses required to read the precomputed values, and simply to\nrecompute\
    \ the values \"on the fly\" every time they are needed."
