    Notice in the compiler feedback that at line 29 it generated an implicit reduction.
    Every iteration of the loop calculates its value for xcoefs[i]*ycoeffs[i], but
    the compiler recognizes that we don''t care about each of those results, but the
    sum of them. A reduction takes the n distinct values calculated in the loop and
    reduces them down to the value we care about: the sum. It is important to understand
    that due to the imprecise nature of floating point a parallel reduction may result
    in a slightly different, but equally correct, answer by adding the numbers at
    one time sequentially. How much this will depend on the actual numbers added together,
    how many numbers are being summed, and the order of operations happens, the difference
    could be a few or even several digits. Remember, both the sequential and parallel
    sum are correct by its nature. Because we used the kernels pragma to parallelize
    this loop, the compiler handled the complexity of identifying this reduction for
    us. Had we used the more advanced parallel pragma instead, it would have been
