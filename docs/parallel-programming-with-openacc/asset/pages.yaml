  md: '# CHAPTER

    nPipelining data transfers with OpenACC

    4

    Jeff Larkin

    NVIDIA, Santa Clara, CA, United States


    The purpose of this chapter is to introduce asynchronous programming with OpenACC,
    particularly in regards to a technique known as pipelining. This chapter will
    accelerate an existing OpenACC code by enabling the overlap of computation and
    data transfers.

    At the end of this chapter the reader will have an understanding of:


    +   - Asynchronous execution within OpenACC

    - Pipelining as a technique to overlap data transfers with computation

    - How to use the OpenACC routine directive


    To date (Nov. 2016), OpenACC has primarily been used on systems with co-processor
    accelerators, such as discrete Graphics Processing Unit (GPU), Many-Integrated
    Core (MIC or Intel Xeon Phi), Field Programmable Gate Array (FPGA), or Digital
    Signal Processing (DSP) devices. One challenge when dealing with co-processor
    accelerators is that the computation the cost of transferring data to the host
    and accelerator memory can limit performance improvements. Unfortunately, by the
    very nature of co-processors, the movement of data between the host and device
    memory is necessary and can never be fully eliminated. Once data movement is reduced
    as much as possible the only way to further reduce the effect of data movement
    on performance is to overlap data with computation. For instance, on an NVIDIA
    Tesla GPU connected to the host Central Processing Unit (CPU) via PCI Express
    (PCIe) it is possible to be copying data to the GPU, from the GPU, computing on
    the GPU, and computing on the CPU all at the same time. Of course, with many operations
    simultaneously the processor must carefully chore and synchronize the independent
    operations to ensure that the program still produces correct results. This chapter
    focuses on one particular technique for overlapping data movement with using OpenACC
    asynchronous capabilities: pipelining.


    # INTRODUCTION TO PIPELINING


    Synchronous operations require that one operation must wait for another before
    it can begin. As an example, consider a grocery checkout line: before'
