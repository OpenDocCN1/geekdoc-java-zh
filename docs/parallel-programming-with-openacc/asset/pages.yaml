  md: '# CHAPTER 3 Profiling performance of hybrid applications


    In order to invoke the compiler instrumentation, Score-P provides compiler wrappers
    for the most common compilers. These wrappers will add the correct flags to insert
    the necessary callbacks through the compiler. A generic wrapper called scorep
    provides access to these wrappers. It is used as shown in Fig. 4.


    ```

    # compiler definitions

    NVCC = nvcc

    CXX = g++

    MPICC = mpic++

    # compiler definitions with Score-P

    NVCC = scorep nvcc

    CXX = scorep g++

    MPICC = scorep--cuda mpic++

    ```


    FIG. 4 Makefile modification to enable the Score-P compiler wrappers.


    In the linking step it might necessary to explicitly specify the accelerator paradigms
    in case the Score-P wrapper does not correctly detect them. The PConGPU example
    the Score-P MPI wrapper that is used for linking the whole application must be
    informed that it is actually triggering CUDA activation so that it will link the
    corresponding CUDA monitoring plugin to the record CUDA activity. The upcoming
    Score-P 3.0 release will also include Open/ACC event recording through the OpenACC
    performance tool API which requires a compiler that supports this API and also
    require passing the --openacc flag to the Score-P compiler wrapper.


    The example illustrates the general principle of source code instrumentation.
    For PConGPU the instrumentation is slightly more complex. First of all, one does
    not want to record functions such as constructors or destructors. Thus, they are
    compiled without instrumentation. In addition, the option of providing a filter
    to list the instrumentation is also used to exclude a number of functions from
    instrumentation. From general behavior, it is important to capture the four phases
    of each iteration with little runtime overhead as; the underlying details can
    be added on demand. Score-P 2.0 introduced the capability of data acquisition
    through sampling. In order to use that feature the application needs to be instrumented
    so that the parallelization library activity is recorded using events and external
    tools are required for acquiring the call stack.


    # RECORDING PERFORMANCE INFORMATION DURING THE APPLICATION RUN


    An application will launch the Score-P monitor automatically with the first instrumented
