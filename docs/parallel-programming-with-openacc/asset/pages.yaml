    \ (or dissimilarity, or “distance”) matrix, in which the $ij$-th element of the\
    \ matrix gives the measure between elements $i$ and $j$ in the data. In the case\
    \ of MD simulations, a trajectory selected atoms and $N$ coordinate frames may\
    \ be viewed as a $3 \times S \times N$ coordinate matrix. Utilizing RMSD to characterize\
    \ the structural similarity between molecular conformations with a trajectory,\
    \ an RMSD dissimilarity matrix may be constructed for use analysis. As depicted\
    \ in Fig. 2A, the RMSD dissimilarity matrix may be represented as an upper-triangular\
    \ matrix in which each element RMSD, gives the pairwise RMSD between structures\
    \ $\tilde{x}_i$ and $\tilde{x}_j$. Importantly, during a simulation the molecule\
    \ of interest diffuses freely, therefore translational of freedom are removed\
