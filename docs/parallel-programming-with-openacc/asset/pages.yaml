  md: '# Aggregate types with dynamic data members


    ```

    BOX 4 MULTIDIMENSIONAL C ARRAYS

    #pragma acc enter data create(A[0:size][0:size2])

    #pragma acc update self(A[0:size][0:size2])

    ```


    However, if the array has a nonuniform shape, for instance where each vector array
    is a different size, it is up to the programmer to manually create and update
    the data. The following example uses a top-down approach where we create an array
    of pointers on the device and then the loop creates each vector. The vector array
    is "attached", i.e., where the vector''s device pointer is assigned to the correct
    device pointer array.


    ```

    BOX 5 CREATING A JAGGED ARRAY

    double **allocData(size_t size, int * sizes) {

    double **tmp;

    int i;

    tmp = (double **) malloc(size*sizeof(double*));

    /* Create an array of pointers **/

    #pragma acc enter data create(tmp[0:size][0:1])

    for (i=0; i < size; ++i) {

    tmp[i] = (double *) malloc(sizes[i]*sizeof(double));

    /* Create the vector array and attach it to the pointer array */

    #pragma acc enter data create(tmp[i:1][0:sizes[i]])

    }

    return tmp;

    }


    deleteData(double ** A, size_t size) {

    int i;

    for (i=0; i < size; ++i) {

    #pragma acc exit data delete(A[i:1])

    free(A[i]);

    }

    #pragma acc exit data delete(A)

    free(A);

    }

    ```


    Note that in the example from Box 5, each vector array needs to be individually
    created. When the data becomes available on the host, each vector array needs
    to be individually updated. If the pointer array itself were updated, the code
    would be copying device or host memory addresses. This will cause runtime errors
    when dereferencing the pointers. Be sure to only update fundamental, fixed size
    aggregate types, or arrays of those types!


    Let''s now expand on this idea and in Box 6 create an array of "vector" structs
    each of which contains a size variable and an array of doubles (Box 7).'
