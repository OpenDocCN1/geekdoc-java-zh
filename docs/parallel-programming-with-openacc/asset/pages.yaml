    # INTERFACING WITH CUDA


    Another OpenACC feature is the ability to interface Fortran OpenACC code with
    CUDA code. This was in particular useful in the COSMO project to interface the
    dynamics section, which was ported with CUDA, to the rest of the model which was
    ported with OpenACC. Here, we provide an interfacing example where the saturation
    adjustment is implemented as a CUDA kernel. A proper interoperability between
    the Fortran and C/CUDA part is ensured thanks to the BIND() attribute and the
    ISO_C_BINDING module (introduced with the Fortran 2003 standard). In order to
    avoid data transfers between the CPU and the GPU, we directly pass the addresses
    of the data, allocated on the GPU in the Fortran part, to the CUDA code. This
    is achieved by using the host_data_use_device OpenACC construct around the call
    to the CUDA routine together with the function, as illustrated in Fig. 22.


    The CUDA version of the saturation_adjustment routine is shown in Fig. 23. We
    do note that no cudaalloc nor any transfers required, because the addresses of
    the arrays allocated in the Fortran part are directly passed to the kernel. This
    CUDA implementation is comparable in performance to the implementation in step
    3; running the CUDA version on the GPU, we obtained a run time of 58 ms with the
    Cray compiled version and 61 ms with the PGI compiled version (see Fig. 24). In
    the downloaded source, the corresponding code can be found in the example_openacc_alt2
    directory.'
