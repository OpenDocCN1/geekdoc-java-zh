    # UNDERSTANDING UNIFIED MEMORY


    Wherever possible, you should take advantage of automation capabilities that improve
    programmer productivity. This is the case with Unified Memory, which is one of
    the more dynamic programming model improvements for the Tesla platform. With Unified
    Memory, demand paging support was added so that memory allocated from a single
    managed pool can be automatically migrated between the host and GPU. The PGI tool-chain
    integrated Unified Memory support into the OpenACC environment. Under the right
    conditions, you can rely on the underlying system to ensure that the data is migrated
    to the right memory at the right time, without specifying any OpenACC directives.


