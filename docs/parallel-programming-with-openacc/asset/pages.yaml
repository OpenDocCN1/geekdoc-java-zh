  md: '# Adding GPU task parallelism


    The common part in kernels is that they need to traverse the particle list to
    first accumulate the contribution to the aggregate electrical current of a cell
    (cptCurrent) and then update the positions of the particle (moveParticles). It
    turns out that the data structure—a linked list of C struct representing (position,
    velocity, and charge) taken from the originating PIC Central Processing Unit (CPU)
    implementation—does not work well on a GPU which requires coalesced memory accesses
    by CUDA threads. The particle structure was changed to a list of arrays of 256
    floats and the performance improved dramatically as shown in Fig. 10. This is
    also due to changing the used MPI communications from synchronous to asynchronous
    MPI.


    ![](img/4798a278f62814efc0b15c6258d71d30_84_0.png)


    Fig. 10 PiConGPU using the optimized data structure and asynchronous MPI communication.


    # ADDING GPU TASK PARALLELISM


    When zooming into a host-device-pair in Fig. 10, it turns out that there is quite
    some lag between kernel launches and their start of execution. Furthermore, there
    are still times when the GPU is idle due to synchronous CUDA memory copies. The
    introduction of asynchronous GPU activity using CUDA streams enables PiConGPU
    to push more work to the GPU and the GPU figure out the best way to process. The
    result can be seen in Fig. 11. Each process now uses CUDA streams (in this case
    five streams per GPU); one as a target for CUDA memory copies, the remainder to
    off concurrent work.'
