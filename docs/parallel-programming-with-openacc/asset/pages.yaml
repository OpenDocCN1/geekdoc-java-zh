    \        error = fmax(error, fabs(Anew[ix][iy]-A[ix][iy])));\n    }\n}\n```\n\n\
    FIG. 5\nJacobi step on single OpenACC device.\n\n+   2. Compute computed values\
    \ from Anew to reuse A and Anew in the next iteration (Fig. 6).\n\n```\n@pragma\
    \ acc kernels\nfor (int iy = 1; iy < NY-1; iy++) {\n    for (int ix = 1; ix <\
    \ NX-1; ix++) {\n        A[ix][iy] = Anew[ix][iy];\n    }\n}\n```\n\nFIG. 6\n\
    Compute computed values from Anew to A."
