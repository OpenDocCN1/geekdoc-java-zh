    At this point the execution time should be at least slightly improved from the
    original execution time, since the data copies and computation are overlapped.
    The execution can be further improved by varying the number of blocks, which in
    turn varies the size of each block. It is necessary to find a balance between
    the added overhead of a large number of blocks and the benefit of overlapping
    small, evenly sized blocks, one should experiment to find the optimal number of
    blocks for a given system. The best number of blocks differs from system to system
    to differences in the accelerator, host CPU, and data transfer speeds. Fig. 11
    shows the Visual Profiler timeline with 16 blocks on an NVIDIA Tesla K40 GPU.


    # PIPELINING ACROSS MULTIPLE DEVICES


    Since the image generation is now divided into independent blocks, it is not only
    possible to pipeline the blocks on a single accelerator, but the blocks could
    be executed across multiple devices. OpenACC provides an API for selecting which
    device the runtime use based on a device type and number. Up to this point the
    example uses the default device, which is selected automatically by the runtime.
    It is possible to change which device the runtime uses by calling the acc_set_device_num
    function.'
