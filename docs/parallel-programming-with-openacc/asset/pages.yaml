    \ pp. 122–123):\n\n+   1. Serial time: $T_s$—how it takes to run the problem with\
    \ a single processor, for example, a GPU.\n2. Parallel time: $T_p$—how long it\
    \ takes to run the problem in parallel with multiple processors.\n3. Number of\
    \ processors: $P$—the number of processors operating in parallel.\n\nWith we can\
    \ define the following metrics to measure the success of our multidevice parallelization:\n\
    \n+   4. Speedup: $S=\frac{T_s}{T_p}$—how much faster the parallel version is\
    \ versus the serial version. The ideal speed is $S$.\n5. Parallel efficiency:\
    \ $E=\frac{S}{P}$—how efficiently the processors are being used. The ideal efficiency\
    \ is 1.\n\nThe source code for this chapter computes the same problem twice: once\
    \ with single devices and once with multiple devices. The runtimes of executions\
