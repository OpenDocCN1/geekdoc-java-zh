    # LOCK-FREE PROGRAMMING


    Mutual exclusion locks are commonly used mechanism for synchronizing processes
    or threads that need access to shared resource in parallel programs. They work
    as their names suggest: if a thread “locks” a resource, another thread that wishes
    to access will need wait until the first unlocks. Once that happens, the second
    one would then proceed to lock it it is processing. The program’s threads must
    be disciplined to unlock it as soon as they are done using the shared resource
    to keep the program execution flowing smoothly.


    Due to the absence of locks, programmers need to become acquainted with the concept
    of lock-free programming and data structures.

    A lock-free method guarantees progress of at least one of the threads executing
    the method. There may be circumstances where some threads can be delayed, but
    it is guaranteed that at least one thread makes progress at each step. Statistically,
    all threads will make progress in a lock-free method over time. According to Blehmann
    (2016) a data structure is considered to be lock-free if some concurrent operations
    are guaranteed to be finished in a finite number of steps.


    Readers are highly encouraged to delve into lock-free programming and lock-free
    data structures. An excellent example of further information is “The Art of Multiprocessor
    Programming”(Herilly & Shavit, 2012).


    Lock-free programming is more challenging than simply using a lock to protect
    a critical region (say using OpenMP #pragma omp critical). However, lock-free
    programs can’t provide any of the performance guarantees of a lock-free method.
    In practice, locks are a common culprit that prevents scaling. Deadlock is'
