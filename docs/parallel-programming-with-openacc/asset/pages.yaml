    removed from the code by defining DEBUG during compilation once debugging is finished.
    As a result, no memory is consumed once assert finished.


    Good programming practice dictates that the use of the Application Interface (API)
    calls should be verified. Reader will note that the success of the dynamic memory
    allocation was not checked. This was omitted for brevity. The only OpenACC annotation
    required to convert accFill_ex1.cpp from a sequential code to can run in parallel
    using thousands of concurrent threads of execution is the line, "pragma acc parallel
    loop copyout(status[0:nCount])." This pragma can be interpreted as:


    +   - "pragma acc parallel loop": "pragma acc" tells the compiler that this is
    an OpenACC program. The "parallel" keyword tells the compiler to use the rules
    for a parallel construct (as opposed to kernels construct), which will be discussed
    in the next section. The "loop" clause tells the compiler that we actually want
    the C++ for to be parallelized. OpenACC pragmas utilize define the scope of the
    code block to which this program applies. In this example, the nCount[0:nCount]"
    This clause tells the OpenACC compiler to create an array of status with starting
    index 0 with nCount elements on the OpenACC device(s). The elements will only
    be copied back from the device to the end of the parallel region so the host version
    of status will contain the same contents as the accelerator version.

    - We used the copy(out) rather than copy() in this clause to avoid the unnecessary
    movement of uninitialized data from the host to the accelerator.

    - Compilers are not required for data movements in the special case when the OpenACC
    host that runs the sequential code shares the same memory as the parallel device.
    For example, no data movement occurs when running this OpenACC example on a multicore
    processor.


