    # # CONCLUSIONS


    Pipelining is a powerful technique to take advantage of OpenACC''s asynchronous
    capabilities to overlap computation and data transfer to speed up a code. In the
    reference system adding pipelining to the code increases this speed by a 2.9x
    speed- and extending the pipeline across six devices this speed-up to 7.8x over
    the original. Pipeling is just one way to write asynchronous code, for stencil
    types of codes, such as finite difference and spectral methods, asynchronous behavior
    may be used to overlap the exchange of boundary conditions with calculations on
    interior elements. When working on large datasets, it may be possible to use asynchronous
    coding to divide the work between the host CPU and accelerator or to perform out-of-core
    calculations to stream the data through the accelerator in smaller chunks. Writing
    asynchronous code requires a lot of foresight and careful coding, but the end
    result is often better utilization of available system resources and improved
    time to solution.'
