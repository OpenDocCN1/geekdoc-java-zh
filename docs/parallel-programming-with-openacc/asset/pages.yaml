  md: '# Domain decomposition 131


    necessary to update the halo regions with new values computed in neighbor domains.

    To do one step of the Jacobi solver for each inner point of the domain we need
    the four nearest neighbors and a halo of 1. For a 2D problem like the given Jacobi
    solver, there are basically three options to do a domain decomposition summarized
    in Fig. 9.


    | Horizontal stripes | Vertical stripes | Tiles |

    | --- | --- | --- |

    | ![image](url_to_image_1) | ![image](url_to_image_2) | ![image](url_to_image_3)
    |

    | • Minimizes number of neighbors | • Minimizes number of neighbors | • Minimizes
    surface area/volume ratio |

    | • Optimal for latency bound communication | • Optimal for latency bound communication
    | • Optimal for bandwidth communication

    | • Contiguous halo exchanges when data is low row order (C) | • Contiguous halo
    exchange when data is column order (Fortran) | • Requires non contiguous halo
    exchange |


    **FIG. 9**nDomain decomposition strategies.


    Whether the domain decomposition strategy is the best depends on many factors
    such as the applied algorithm, the problem size, the number of devices used, and
    the available iterative bandwidth. To avoid the complexities of noncontiguous
    halo exchange we apply a domain decomposition with horizontal stripes. For the
    Jacobi solver the following points need to be addressed for a multdevice parallelization:


    +   1. Handle GPU affinity (see preceding text).

    2. Apply the domain decomposition and compute which device should handle subset
    of contiguous rows.

    3. Compute the global error after applying the Jacobi step.

    4. Halo exchange.


