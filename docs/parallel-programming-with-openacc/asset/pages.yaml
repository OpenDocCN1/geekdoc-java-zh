    First, you will use OpenMP tools to measure baseline host Central Processing Unit
    (CPU) scalability, then use enhanced OpenACC profiling capabilities to gain performance
    uplift for multicore host or Graphic Processing Unit (GPU) targets. To maximize
    your productivity, the OpenACC tools help you:


    +   - Highlight parallel execution dependencies

    - Identify critical optimization targets

    - Measure code intensity regions (common memory bandwidth vs. floating point operations)'
