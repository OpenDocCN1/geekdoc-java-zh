- img_proc: true
  md: 'Performance measurement and visualization is composed of three steps: data
    acquisition, recording, and presentation. The performance monitor wants to analyze
    the behavior of the application. To do so it can either interrupt the unmodified
    application and “pull” information as to what the application was doing when it
    interrupted (sampling) or the application can be modified itself to “push” information
    about its activity to the performance monitor (event based instrumentation). Recording
    can either immediately summarize all data or log all activity as timestamp entries.
    The full log file can be presented as a timeline or a profile for arbitrary time
    interval while the summarized data can only be presented as a profile of the whole
    application run.


    All analysis techniques have advantages and disadvantages. For example, sampling
    which interrupts the application at a fixed sampling rate, e.g., has a constant
    perturbation of the runtime time of the application that is measured. The measurement
    accuracy is depending on the sampling frequency. Event based instrumentation records
    all targeted activity, all functions or code segments that have been augmented
    manually or via the compiler with triggers, but the perturbation depends on the
    event rate which is not known at compile time and can be orders of magnitude footprint
    in a worst-case scenario. Immediate summarization maintains a low overhead for
    the performance monitor and does not lead to additional input/output but it drops
    the temporal context of the recorded activity, whereas for logging it show activities
    according to their impact on the application (typically time distribution over
    the functions) while they omit the temporal context. Timelines are just the opposite;
    they show the temporal evolution of a program while making it harder to isolate
    the most consuming activity right away.


    Event based tracing is able to record the “full picture” of all activity during
    application run, at the price of potentially very high run perturbation. Fortunately,
    a compromise between the introduced techniques can be used to generate as much
    information as necessary at the lowest possible overhead. Score-P offers the—even
    concurrent—usage of all the presented performance analysis techniques and as such
    is unique in its capabilities as a performance monitor.


    # EVOLUTIONARY PERFORMANCE IMPROVEMENT


    Examples in this book show that profile-driven development can be used to constantly
    improve an application’s performance using OpenACC by offloading more and more
    activity and optimizing data transfers. Optimizing hybrid applications follows
    a similar pattern as illustrated in Fig. 2.'
