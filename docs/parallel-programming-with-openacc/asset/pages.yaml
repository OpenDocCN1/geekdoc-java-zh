    # SUMMARY


    In this chapter, you learned how to accelerate a 3D finite difference code by
    using a profile-driven approach. You converted directives from OpenMP to OpenACC,
    and with enhanced dependency analysis tools identified critical optimization targets.
    A key transformation from stack-based to heap-based allocation allowed you to
    take advantage of Unified Memory, and use the underlying system to automatically
    migrate data between host and GPU. You used detailed compiler reports to guide
    precise insertion of OpenACC directives. This last transformation allowed you
    to take advantage of OpenACC portability by specifying GPU and multicore targets.
    A simple set of directives combined with powerful OpenACC tool-chain delivered
    a nice performance uplift for this example code.


