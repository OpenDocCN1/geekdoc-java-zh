    # ACHIEVING FULL RESIDENCY ON THE GPU


    The pseudo code in Fig. 4 shows how to use the OpenACC copyin and copyout data
    transfer directives in the main entry point of the CloverLeaf program to move
    data to and from the accelerator. Subsequent use of the OpenACC present clause
    on the data struct in each kernel indicates that data is already on the device
    and no copy is required before using the data on the device.


    In addition to restricting the data transfer to an initial copy, in order to enable
    full residency additional kernels to the six kernels need to be placed on the
    GPU. These additional kernels are not computationally intensive kernels, but without
    placement on the GPU implicit data transfers occur to and for the host for each
    invocation of these sections of code.


    With the exception of the initial set-up, a total of 14 unique kernels (including
    the previously identified six kernels) are required to be accelerated on the GPU.
    Fig. 5 shows the impact of accelerating these additional kernels and applying
    an additional data off transfer.


    With the all now executing on the GPU there is virtually no computation remaining
    to be carried out by the CPU (compare against Fig. 2). This is observed in the
    visible increase in data compute. The most marked difference is that the data
    transfer overhead is dramatically reduced by implementation of the initial transfer.
    As this is a "one off" event, it is reasonable to hypothesize that if the problem
    size was large enough, or computation long enough, the data transfer overhead
    would be a relatively small percentage of the overall execution time.'
