  md: 'result, Graphics Processing Unit (GPU) accelerators are inherently appealing
    for scientific applications. However, in the past GPU programming used of low-level
    languages such as OpenCL, CUDA, and other vendor-specific interfaces. These low-level
    programming models imply a steep learning curve and demand excellent programming
    skills; moreover, they are time consuming to debug. OpenACC, a directive-based
    high-level model addresses challenges for GPUs and simplifies the porting of applications
    to GPUs without unduly sacrificing performance.


    In this chapter, we discuss experiences gained while porting programs to single
    and multiple GPUs using OpenACC. We also demonstrate how OpenACC can be used to
    run on multicore platforms, thus maintaining a single code base. In our experimental
    analysis, we conclude that efficient implementations of high-level directive-based
    models permit user-guided optimizations that lead to performance close to that
    of hand-written CUDA code.


    # EXPERIMENTAL SETUP


    The platform for these experiments is a multicore server containing two NVIDIA
    Kepler80 GPUs (see Fig. 1 for configuration details). The most recent compiler
    versions are used for the experiments discussed in this chapter. P16 with the
    compilation flag -fast is employed to translate the CPU and OpenACC versions of
    the programs. CUDA 7.5 is used to compile all CUDA programs. Wall-clock time is
    the basis for our evaluation: results of running CPU, OpenACC, and CUDA versions
    of the codes are collected and compared.


