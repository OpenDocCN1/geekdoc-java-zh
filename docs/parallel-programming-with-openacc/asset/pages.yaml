  md: '# CHAPTER 3

    Profiling performance of hybrid applications with Score-P and Vampir


    Guido Juckeland*, Robert Dietrich*

    Department of Information Services and Computing, Helmholtz-Zentrum Dresden-Rosendorf
    (HZDR), Dresden, DEU, Germany* Technische Universität Dresden, Dresden, Germany


    The purpose of this chapter is to familiarize the reader with the concept of evolution-
    ary performance and the tools involved when adding other paralleliza- paradigms
    to OpenACC applications. Such hybrid applications can suffer from a number of
    bottlenecks and a holistic picture of all activities during the application run
    shed light on how to improve the overall performance.

    At the end of this chapter the reader will have a basic understanding of:


    +   * Terminology and methods for performance analysis of hybrid applications
    (e.g., MPI + OpenACC)

    * How to modify hybrid applications to generate and record performance data

    * How to visualize and analyze the performance data to make educated choices on
    application improvement

    * Common pitfalls when extending an existing application to include another parallelism
    paradigm


    OpenACC aims at providing a relatively easy and straightforward way to describe
    parallelism on platforms with hardware accelerators. By design, it is an ap- proch
    for targeting legacy High Performance Computing (HPC) to novel architectures.
    Legacy and new applications that exceed the capabilities of a single node can
    use Message Passing Interface (MPI) for internode communication and coarse work
    distribution. The combined OpenACC and MPI applications are referred as hybrid
    applications. It is also possible to combine OpenMP on the host to utilize all
    resources of a compute node or to use all three levels of parallelism (MPI, OpenACC,
    and OpenMP) concurrently. Tuning performance for one parallelism paradigm is challenging,
    the second or third level of parallelism introduces a new layer of potential performance
    challenges due to the interaction of all parallelism paradigms. Profile-guided
    development can also cover these computation scenarios when using the right profiling
    tools.'
