    \ U>\nvoid accUpdateFT(U *p, long size) {\n    #pragma acc update self(p[0:_size])\n\
    }\n\ntemplate<typename U>\nauto accUpdateFT(U *p, int) -> decltype(p->accUpdateSelf())\
