  md: '# Experimental setup 157


    ```

    $$\frac{\partial T}{\partial t} = \alpha (\frac{\partial^2 T}{\ x^2} + \frac{\partial^2
    T}{\ y^2})$

    ```


    **FIG. 12**

    2D heat conduction formula.


    where $T$ is temperature, $t$ is time, $\alpha$ is the thermal diffusivity, $x$
    and $y$ are points in a grid. To solve this problem, one possible finite difference
    approximation is given in Fig. 13:


    ```

    $$\frac{\Delta T}{\Delta t} = \alpha (\frac{T_{i+1,j}-2T_{i,j}+T_{i-1,j}}{\Delta
    x^2} + \frac{T_{i,j+1}-2T_{i,j}+T_{i,j-1}}{\Delta y^2})$

    ```


    **FIG. 13**

    One possible finite difference approximation.


    where $\Delta T$ is the temperature change over time $\Delta t$ and $i, j$ are
    indices in a grid. At startup, a grid is set up that has boundary points with
    an initial temperature and inner points for which the temperature must be incrementally
    updated. Each inner point updates its temperature using the previous temperature
    of its neighboring points and itself. The updating step diffuses the temperature
    from the boundary points, but it can only progress one point per iteration; this
    means a large number of iterations can be required to reach a steady state across
    all points in the grid.


    A snippet from the code that implements the stencil-based temperature update is
    reproduced in Fig. 14. The number of iterations used is 20,000, and the grid size
    is increased from $256\times256$ to $4096\times4096$.


    In order to parallelize the application, OpenACC directives are used: "#pragma
    acc kernels\" is inserted at the top of the nested loop inside the temperature
    updating kernel, and "#pragma acc loop independent\" is inserted before each loop.
    The `independent` clause is used to tell the compiler that there is no loop-carried
    dependency in the momentum nest. In addition, the `copyin` and `copyout` clauses
    are added to move the data to GPU and output data from GPU to CPU.


    Results of profiling the basic implementation, shown in Fig. 15, indicate that
    the data is transferred back and forth in every main iteration.


    The cost of transfer is so high that the parallelized code takes longer to execute
    than the original version. To avoid this overhead, a `data` directive is added
    surrounding the main iterations; this ensures that the data is transferred only
    before and after the loops. After all iterations have completed, the data in `temp`
    needs to be transferred from GPU to CPU since the pointers of `temp` have been
    swapped. In the kernel, the `copy` and `copyout` clauses are replaced by the `present`
    clause which indicates that the data are already on the GPU and thus there is
    no need to do any data movement.


    Fig. 16A shows the OpenACC code snippet after applying data optimization and Fig.
    17 shows the corresponding profile result. It is clear that the number of times
    the data has been reduced from 40,000 to 30. To enable a comparison, Fig. 16B
    is a CUDA implementation of the same kernel.'
