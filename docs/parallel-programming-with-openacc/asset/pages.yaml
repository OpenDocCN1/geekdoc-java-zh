  md: '# Summary and conclusion 237


    buffers were guaranteed to be aligned to 16-byte boundaries. Hence, the compilers
    likely generated memory load/store operations that were slightly less efficient
    than what was written by hand. We note that the gap in performance between the
    hand-codedX+FMA kernel and either the Intel or PGI compiler-provided vectorization
    was 15%, demonstrative of the fact that in the vast majority of cases it would
    be unnecessary to write a hand-coded kernel.


    The two GPU accelerated kernels largely outperform the CPU kernels in both cases.
    This is what we should expect given the CPU kernels enhance memory-bandwidth-bound
    performance with just a few active cores/threads, and given the much higher bandwidths
    provided by GPUs vs. hot CPUs. The K80''s significantly higher double-precision
    arithmetic throughput and larger-on chip register count explain the noteworthy
    performance gap between the Quadro M6000 and the Tesla K80. The performance results
    for half-K80 tests show that the superior memory bandwidth of the Quadro M6000
    vs. the half-K80 (317 GB/s vs. 240 GB/s), the half-K80''s factor of 7x advantage
    in double-precision arithmetic throughput plays in its favor. To achieve higher
    performance on GPUs optimized for single-precision as the Quadro M6000, one might
    consider developing a more sophisticated mixed-precision summation scheme or using
    a variation of a recursive summation approach (Higham, 1993).


    The average memory bandwidth (including any benefits from on-chip caches) achieved
    by the CPU kernel for the 8001 test case was 45 GB/s. The average memory bandwidths
    (including any benefits from on-chip caches) achieved by the GPU kernels for the
    8001 test case were 92 GB/s for the Quadro M6000 and 157 GB/s for the halfK80.
    The Quadro M6000 result is below what we would hope for, but this is an outcome
    of its very low double-precision performance. The half-K80 result is a respectable
    65% of 240 GB/s''s theoretical peak bandwidth, and a good result for a nontrivial
    kernel with directive-based parallelism. It should be possible to achieve higher
    performance and a higher fraction of memory bandwidth using a hand-written CUDA
    kernel that uses advanced hardware features that OpenACC cannot presently exploit
    (e.g., cross-thread reductions), but the achieved results are excellent.


    # SUMMARY AND CONCLUSION


    This chapter demonstrates the use of OpenACC directives to parallelize some of
    the most costly computations involved in clustering analysis of MD simulations.
    Along the way, we provided details about hardware architecture considerations
    that are important for achieving high performance, particularly those that relate
    to memory accesses and the layout of data structures in memory. The chapter described
    methodologies for adapting existing code and data structures to meet the special
    requirements of massively parallel accelerators such as GPUs, and many-core CPUs.
    The chapter demonstrated some of the challenges that can arise in the adaptation
    of existing applications, where compromises must often be made between existing
    data'
