    The test used for performance evaluation consists of a dual socket system hosting
    NVIDIA Kepler K20 GPU card. Each CPU socket contains an eight-core Sandy Bridge
    Intel(R) Xeon(R) CPU E5-2650, running at a clock speed of 2.00 GHz.

    You can perceive a first good performance advantage when the third nested loop
