  md: '# Basic loop optimization clauses 117


    # THE data-dependencies CLAUSE


    Some data-dependencies can be overcome with reductions. If you are not already
    familiar with reductions, then the best way to proceed is via example and it happens
    that our matrix-matrix multiplication example is perfect for that purpose. The
    innermost loop runs in gradually accumulating the sum of the a[i] [kj] times b[k][j]
    multiplications performed at each iteration. The multiplications are independent
    over the iterations and thus could be performed in parallel, if the result of
    the multiplications could be individually saved to temporary loop. So, with those
    temporary variables as operators after their values become available. This sums
    are then performed sounds quite like a bit of code modification and also extra
    storage that needs to be allocated. Frankly, the compiler can do that automatically
    when hinted about this reduction operation via the reduction clause.


    More generally, the reduction clause requires specifying arguments: a reduction
    operator and one more scalar variables. For each reduction variable, a private
    copy is created and initialized for that operator operating the table in Fig.
    8. While executing, threads will store partial results in their respective copies
    of the variable. When all the threads finish the loop execution, the partial results
    are combined using the specified reduction operator along the original value of
    the variable. The global result becomes available at the end of the parallel or
    kernels region that has loop parallelism, and at the end of the loop otherwise.


    In our example, the reduction result supposedly should go in c[i][j]. However,
    the variable argument to the reduction clause is required to be scalar. Thus,
