  md: '# Incrementally accelerating the RI-MP2 correlated method of electronic structure
    theory using OpenACC compiler directives


    Janus Juul Eriksenn

    qLEAP Center for Theoretical Chemistry, Department of Chemistry, Aarhus University,

    Aarhus C, Denmark


    The purpose of this chapter is to demonstrate how electronic structure many-body
    theories may be incrementally accelerated in an efficient and portable manner
    by means of OpenACC compiler directives, with an illustrative application to the
    RI-MP2 method. The efficiency of the implementation (using six K40 GPUs) is illustrated
    through a series of test calculations, for which the accelerated code is capable
    of reducing the total time-to-solution by at least an order of magnitude over
    an optimized CPU-only reference implementation.

    At the end of this chapter the reader will have an understanding of:


    +   * The use of accelerator offloading in quantum chemistry

    * Asynchronous pipelining of computations and data transfers

    * Hybrid CPU/GPU computing using OpenMP compiler directives

    * Fortran interoperability with CUBLAS

    * Pinning of memory in CUDA Fortran


    # INTRODUCTION


