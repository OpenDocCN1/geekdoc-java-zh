    \    30, Accelerator restriction: induction variable live-out from loop: counter\n\
    ```\n\nFIG. 17\nPIQ when the atomic is omitted.\n\nUsing USE_ATOMIC during compilation\
    \ includes the OpenACC pragma. In this example the PGI compiler reports it can\
