    # HARDWARE ARCHITECTURE CONSIDERATIONS


    State-of-the-art microprocessors, whether CPUs, GPUs, or other accelerators, share
    a number of macroscopic properties used for High Performance Computing (HPC) consist
    of processors that contain multiple processor cores and SIMD arithmetic units
    to provide high throughput that would not be achievable otherwise. This is an
    area of significant variability among processor designs due to the prevailing
    classes of workload that were prioritized highly during their design. Accordingly,
    programmers must design their algorithms to encompass hardware variability by
    exploiting many processor cores, and SIMD vector units of varying width and capability.


    Applications also content with a significant gap between the performance of arithmetic
    operations and the performance of memory operations. The commodity CPUs, GPUs,
    and other accelerators available today provide all arithmetic performance levels
    are typically one to two orders of magnitude higher than their achievable bandwidth.
    As an example, the NVIDIA Tesla K20X GPU accelerator used in the Blue Waters (Mendes
    et al., 2014) and Titan (Joubert et al., 2015) supercomputers reaches up to 1.3FLOPS
    double-precision arithmetic throughput, 3.9FLOPS single-precision arithmetic throughput,
    but only up to 250GB/s bandwidth (with ECC decoded). The Tesla K20X throughput
    outpaces its bandwidth by roughly a factor of 40 for double-precision, and a factor
    of 60 for single-precision. In practice scientific application software contains
    lots of integer instructions associated with array indexing and loop control,
    and there are often opportunities for review of values in machine registers. One
    could reasonably divide those ratios by four or more, but it is even then that
    there is still a very significant gap in the throughput of arithmetic and memory
    operations.


    The main outcome of this observation is that for many scientific codes, particularly
    those that operate on large data, the primary consideration for performance is
    ensuring the optimality of memory operations, with others of algorithm design
    and performance optimization secondary. In the context of directive-based parallel
    approaches such as OpenMP and OpenACC typically means that a developer should
    consider memory locality and access performance first and leave consideration
    of arithmetic throughput as to be optimized only after the throughput of memory
    operations reaches its peaks. In many cases, there are no significant opportunities
    for increasing performance after maximizing memory performance. In principle,
    this is another argument in favor of directive-based parallel programming systems
    such as OpenACC; while a compiler may generate code that runs as purpose-written
    parallelized code in lower-level languages such as CUDA, in many it is only necessary
    to achieve performance levels high enough that a kernel''s performance becomes
    memory-bandwidth-bound.


    For memory-bandwidth-bound kernels the potential performance gain obtained from
    the use of OpenACC is limited to the ratio of the memory bandwidth on the accelerator
    accelerated by OpenACC relative to the reference platform.'
