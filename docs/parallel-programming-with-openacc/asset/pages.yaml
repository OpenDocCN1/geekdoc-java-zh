    \ is the root-mean-squared deviation (RMSD) given by\n\n```\n$RMSD_{i,j} = \\\
    sqrt{\frac{1}{N} \\left[ \\sum_{k=1}^{N} (x_k - y_k)^2 \\right]} \\quad (1)$\n\
