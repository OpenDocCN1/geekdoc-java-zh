  md: 'the GPU optimizations degrade performance on CPU, mostly the final OPT2 code
    is less favorable for auto-vectorization. Additionally, the on-the-fly computations
    are less favorable on CPU in this part of the code, as the execution is compute-bound
    on CPU while it is memory-bound on the GPU. For community codes like COSMO, which
    run with high performance on both CPU and GPU architectures, this lack of portability
    is a problem. Most either find an acceptable trade-off between performance on
    different architectures, or when the amount of code is limited in size as for
    the radiative solver, keep two separate versions: one for CPU and one for GPU.
    Finally, comparing the best CPU results (BASE) to the best GPU results (OPT2 with
    Cray), we achieved a speedup of about a factor of 2.9x on the GPU.


