  md: 'on a Cartesian grid in two dimensions. Each grid cell stores three quantities:
    energy, density and pressure, and each cell corner, or node, stores a velocity
    vector. CloverLeaf solves the equations with second-order accuracy, using an explicit
    finite-volume method.


    Each cycle of the application consists of two steps: (i) a Lagrangian step advances
    the solution using a predictor-corrector scheme, distorting the cells as they
    move with the fluid flow; and (ii) an advection step is used to restore the cells
    to their original positions.


    The advection routine updates based on the direction of the “wind” (the material
    flow), and performs sweeps in the x and y coordinates in a 1D temporary array,
    corresponding to one row/column of cells. Using a larger, temporary, 2D array
    allows all cells in the mesh to be updated in parallel.


    The computational intensive sections of CloverLeaf are implemented via individual
    kernels. In this instance, we use kernel to refer to a self-contained function
    which carries out one specific aspect of the overall hydrodynamics algorithm.


    CloverLeaf is written with the purpose of assessing emerging hardware and programming
    models. The simple hydrodynamics scheme is written in such a way as to cause unnecessary
    dependencies in key computational sections. All scientific computation is carried
    out in small kernel functions, making long complex chains having many subroutine
    calls unnecessary.


    The initial implementation of CloverLeaf was in Fortran 90 and was used to develop
    an optimized and highly vectorizable, hybrid Message Passing Interface (MPI)/OpenMP
    code. This version was ported to an OpenACC implementation using Cray’s Compiling
    Environment (CCE) compiler, on an NVIDIA™accelerated Cray XK6. This initial OpenACC
    version was then used as the basis of an implementation that would compile and
    perform under the Portland Group, Inc. (PGI) and CAPS Enterprise OpenACC compilers.
    This ultimately led to the two OpenACC implementations presented here, the “parallel”
    and “kernel” versions.


    CloverLeaf’s C, MPI/OpenMP hybrid, OpenCL, CUDA, Intel’s Heterogeneous Offload
    model and OpenMP 4.0 implementations are utilized, however permitting, to compare
    each of the OpenACC variants. Copies of all of CloverLeaf’s implementations are
    available for download, and can be found under the download section of the Mantevo
    Suite.


    # TEST CASE


    A simple yet asymmetric test problem is used throughout the study. The problem
    consists of two regions of idealized gas; one of high density and energy, adjacent
    to that of a lower density and energy region. As the simulation proceeds a shock
    wave forms penetrates the low density region.'
