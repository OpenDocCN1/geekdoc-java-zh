  md: '# Describe parallelism 35


    dependency occurs when one loop iteration depends upon data from another iteration.
    Close examination of the loop body reveals that each iteration of the loop is
    completely data-independent of each other iteration, meaning that the results
    calculated in one iteration will not be used by any other. So why does the compiler
    believe that a loop has a dependency? The problem lies in the low-level nature
    of the C and C++ programming languages, which represent arrays as pointers into
    memory; which can potentially point to the same memory. The problem is that the
    compiler cannot prove that the three arrays used in the loop do not alias or overlap,
    which makes it to assume that parallelizing the loop would be unsafe. We can provide
    the compiler with more information in one of two ways. One possibility is to give
    the compiler more information about the pointers by promising that they will never
    alias. This can be done by adding the C99 restrict keyword. While this is not
    a C++ keyword, the PGI compiler will accept this way in C++ codes directive. We
    could also give the compiler more information about the loop itself using the
    OpenACC loop directive. The loop directive guides the next iteration. We can use
    the loop independent to inform the OpenACC compiler that all iterations of the
    loop are independent, meaning that no two iterations depend upon the data of the
    other, thus overriding the compiler''s dependency analysis of the loop. Both solutions
    promise that the programmer makes the compiler about the code. If the promise
    is broken unpredictable results we cannot make guarantee that our vectors will
    not alias, since at the time the loop is called with y and w being the same vector,
    so we will use independent instead. The final code for waxpy appears in Fig. 7
    along with compiler feedback in Fig. 8. Notice from the compiler feedback that
    the compiler has determined that the loop at line 41 is parallelizable.


    ```

    33 void waxpy(double alpha, const vector &x, double beta, const

    34 vector &y, const vector &w) {

    35 unsigned int n=nx;

    36 double *restrict xcoefs=x.coeffs;

    37 double *ycoefs=y.coeffs;

    38 double *wcoefs=w.kernels;

    39 #pragma acc loop independent

    40 {

    42 for(int i=0;i<n;i++) {

    43 44 wcoefs[i]=alpha*xcoefs[i]+beta*ycoefs[i];

    45 }

    46 }

    ```


    FIG. 7


    Final waxpy code with OpenACC.


    > ''Some C++ compilers will not accept the restrict keyword, but will accept __restrict
    is.'
