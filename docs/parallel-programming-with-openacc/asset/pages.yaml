  md: '# HYBRID OpenMP/OpenACC


    This section discusses the case where the application uses two GPUs. Fig. 18 produces
    the program details including. In this implementation, *ni* and *nj* are the *X*
    and *Y* dimensions of the grid (not including the boundary), respectively.

    As seen in Fig. 18, the grid is partitioned into two parts along the *Y* dimension,
    each of which will run on one GPU. The decomposed parts overlap at the boundaries
    and the overlapping regions are called halo. At the start of the computation,
    the initial temperature is stored in `temp1_h`; after updating the temperature,
    the new temperature is stored in `temp2_h`. Then the pointer is swapped so that
    in the next iteration of the kernel points to the current temperature from its
    neighboring points. Each data point needs temperature values from its previous
    iteration for the update, the two GPUs need to exchange halo data between different
    GPUs using high-level directives or runtimes. The only workaround is to transfer
    the data from one device to the other. This is illustrated by Fig. 19 for the
    2D heat equation where different OpenACC devices exchange halo data through the
    CPU.


    The profiling results that after every iteration, the part of GPUs exchange data
    through the CPU. Because different GPUs use different parts of the data in the
    grid, shared memory for this particular do not to be allocated, instead only the
    private pointer to be used to point to the different positions of the shared variable
    `temp1_h`. If *tid* is the id of a thread, then that thread''s pointer points
    to the position `tid*rows*(ni+2)` of the grid (because it needs to include the
    halo region) and it needs to transfer `(rows+2)*(ni+2)` data to the device where
    *rows* updates the temperature in the multiGPU implementation is exactly the same
    as in the single-GPU version.


    Fig. 21 shows the results of profiling both OpenACC and CUDA multipplementation.
    Note that their performance is similar. The kernel performance of the OpenACC
    is slightly better than that of the CUDA implementation, which demonstrates that
    translating OpenACC kernels, the OpenACC compiler may apply optimizations that
    are not available in the CUDA compiler.

    Fig. 22 compares the performance obtained by different implementations. It is
    obvious that the execution time of the serial version of the single GPU is always
    the slowest. The OpenACC multicore performance is slightly better than the GPU
    performance when the problem size is small, but poorer than GPU performance when
    the problem size is large. While comparing the performance of multiGPU with single
    GPU, we noticed that there is a trivial performance difference when the problem
    size is small. however, there is a significant increase in performance using multiple
    GPUs for larger sizes.


    Fig. 23 shows the speedup in multicore and GPU compared to the CPU performance.
    For a grid size of 4096×4096, the speedup using two GPUs is around twice that
    of the single GPU implementation. This is because the grid size increases, the
    computation also increases significantly, the halo-data exchange'
