  md: '# Results for the radiation parameterization 289


    In the results from this optimization effort described here, the BASE version
    is the original "optimized for CPU" code where OpenACC parallel and data regions
    have simply been added. The OPT1 version, the loops have been restructured to
    be more GPU friendly (see Fig. 27). Finally, in the OPT2 version, some precomputed
    arrays are replaced with on-the-fly computations and caching scalar variables
    are introduced in the vertical direction. The code is parallel employing the Message
    Passing Interface (MPI), using a domain decomposition method in two horizontal
    directions. The reference CPU results are obtained on a 12-core Intel Xeon E5-2690
    CPU using the Cray and 12 MPI-threads. The CPU results are compared to those obtained
    on an NVIDIA Tesla K80 GPU cards using both the Cray and PGI compilers in Fig.
    30. The K80 is a so-called dual GPU, the GPU results are obtained using 2 MPI
    ranks as use both GPUs. The compiler version is Cray 8.4.0 with optimization flags
    "-O3 -hacc" and PGI 16.3 with "-O3 -ta=tesla:O0,cc.35". For this version of the
    PGI compiler, the best results are obtained with "-ta=tesla:O0" as compared to
    higher optimization, e.g., "-ta=tesla:O3; due to some conflict between optimizations
    in the PGI tool chain. As in the section with the simplified atmospheric code,
    we again consider a domain size of 128×128×60 points.


    ![](img/4798a278f62814efc0b15c6258d71d30_308_0.png)


    FIG. 30

    COSMO radiation timing for a 128×128×60 domain using the Cray and PGI compiler.
    CPU, 12-core Intel E5-2690 v3 (Haswell); GPU, Nvidia Tesla K80.


    Looking at the GPU results, we can see significant improvement when going from
    the base to the GPU-optimized code which stresses the importance of such optimizations.
    For the Cray compiler the time is reduced by 40% and by about a factor of 3x for
    PGI. We also notice that there are some differences between the compilers, in
    particular for the base case code, which result from different internal compiler
    optimizations. Another interesting point to note is that'
