    end subroutine deallocateData\n\nmodule unstruct\n\n# AGGREGATE TYPES WITH DYNAMIC\
    \ DATA MEMBERS\n\nAggregate data types such as C++ Classes, structs, and Fort\
    \ user-defined types can be managed with data structures. If the aggregate type's\
    \ size and shape is known at compile time, the compiler is able to manage the\
    \ data movement for fixed-size types to be used in data clauses and update directives.\
    \ However, if the aggregate type contains a dynamic data member, such as a C pointer\
    \ or Fortran object, the size and shape of the type's members is deferred to the\
    \ runtime.\n\nIn Fortran descriptors contain rank and bounds information about\
    \ the allocate array, it may be possible for the runtime to create and update\
    \ the aggregate type on the device. However, this is not part of the current OpenACC\
    \ specification for other cases such as a C++ pointer to an object where the runtime\
    \ has little to no information about the data type, it is not possible to perform\
    \ the data operations automatically. Further versions of the OpenACC standard\
    \ may contain shape giving users to describe the shape of the dynamic data members\
    \ and policy directive which allows for different shapes to be used in different\
    \ situations.\n\nThe next few sections walk through examples on how to manually\
    \ create and update data structures. These methods manually implement the same\
    \ steps a compiler runtime would do automatically if the shape directive was available.\n\
    \n# BUILDING DATA STRUCTURES FROM THE TOP-DOWN\n\nTo begin, let's start with a\
    \ simple array of pointers, pointers to pointer, multidimensional array. For the\
    \ most common case where the dimensions are rectangular, the arrays can be used\
    \ directly within data clauses (Box 4)."
