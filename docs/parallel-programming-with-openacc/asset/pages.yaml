    \ 2 ...\nend do\nend do\n```\n\n**FIG. 25**\n\nPseudocode of the physics parameterizations\
    \ in COSMO.\n\nEach loop in the example pseudocode in one loop are used a short\
    \ number of calculations, and variables that are calculated in one loop are used\
    \ in a different loop calculation. This code form works well with systems taking\
    \ advantage of compiler vectorization for generating SIMD instructions, but is\
    \ typically not ideal for GPUs. On GPUs, if parallel regions are applied to each\
    \ loop in the pseudocode, we have numerous individual GPU kernels, often with\
    \ the same variables in them. Furthermore, a lot of variables require explicit\
    \ data management between GPU kernels. Applying OpenACC directives in the step-by-step\
    \ approach would result in the pseudocode shown in [Fig. 26].\n\nThe first optimization\
    \ that can be applied here is so-called loop fusion and loop reordering. With\
    \ this technique, a sequence of loops with the same loop index is fused into a\
    \ single loop containing a larger amount of computation. This reduces the number\
    \ of kernels that the GPU needs to launch (i., removes the associated kernel overhead)\
    \ and results in simpler data management. We additionally swap the i and k loop,\
    \ which is also beneficial for scalar replacement optimization described in the\
    \ next section. Applying loop fusion and reordering to the pseudocode would result\
    \ in the pseudocode shown in [Fig. 27].\n\n# Scalar replacement\n\nThe second\
    \ optimization technique that can be applied here is scalar replacement. After\
    \ combining loops in the loop fusion, the variable c(1) is first calculated from\
    \ some other variables, and then used in a calculation of a final variable. Because\
    \ the variable c is only used as an intermediate variable, it does not need to\
    \ be stored in an array, but can be stored as a scalar. The main advantage is\
    \ that this variable"
