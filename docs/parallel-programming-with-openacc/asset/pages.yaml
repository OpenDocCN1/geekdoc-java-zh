  md: 'a large waste of resource. Ideally we would like to utilize all of the resources
    on a node, and do so with the same binary.


    Using an MPI runtime configuration, we can run these together as part of the same
    job, assigning one MPI rank to one binary and another MPI rank to the other binary.


    This allows us to target the threads on a node, and the GPU on a node simultaneously.


    Within CloverLeaf, the communications between the two partitions are handled within
    MPI, using dedicated buffers, and both ranks can otherwise progress independently.


    With OpenACC, the data arrays reside on the GPUs, this means that the communication
    buffer needs to be populated on the GPU and then the data updated with the GPU
    data.


    This means that the MPI ranks can communicate these buffers, which are used to
    update the main data arrays, either on the host for the CPU version or on the
    GPU with the OpenACC version.


    The obvious issue is here the natural load balance between the dual-socket CPU
    and the GPU version.


    In testing, we have seen around a 4x performance difference between the dual-socket
    CPU and the GPU version. This would suggest that if we were to utilize all of
    the resource then we would be looking around a 20% performance gain.


    However, we still need to assign some CPU resource to the OpenACC rank to drive
    the GPU. Thus our experienced performance gain is less than this—potentially 10%.


    This is an ideal scenario. Currently the decomposition scheme in CloverLeaf assigns
    equal work to each MPI rank. However, with our heterogeneous scheme we would actually
    a much larger portion of the data allocated to the GPU, proportional to the relative
    performance difference.


    As a mini-app, CloverLeaf is sufficiently flexible that we are implement a new
    decomposition scheme, driven by input deck parameters. Allowing the user to simply
    state what fraction of the problem set should be allocated to each MPI rank of
    the.


    Unwedly, this allows us to prototype a hardware specific load balance. The load
    balance in CloverLeaf is static, this for now; however, it would act as a precursor
    for a dynamic load balance for more complex codes.


