  md: 'properly, i.e., you managed data movements wisely with the OpenACC data constructs,
    you should have already seen significant performance improvement over native CPU
    code. But, it also means that you are striving for better performance. Fortunately,
    simple as it is, OpenACC allows you to further improve your code performance,
    in a short time, while still using a high-level API.

    For purpose, and as it is very likely that the code portions that run on the accelerator
    are loops, you can apply the OpenACC loop construct to the loop which immediately
    follows, in order to provide hints to the compiler with more details about the
    parallelization and distribution of iterations. The loop already has to be part
    of a code section that will be executing on the accelerator. However, although
    perfectly legitimate, a bare loop construct is only through the multitude of associated
    clauses that you get to describe what type of parallelism should be used for executing
    the loop, and define any necessary reduction operations.


    # THE LOOP CONSTRUCT


    Referring to OpenACC standard version 2.5, the general syntax of the loop construct
    is (Figs. 1 and 2):


    +   - In C/C++


    ```

    #pragma acc loop [clause-list]

    for(...)

    ```


    FIG. 1

    OpenACC loop directive syntax in C/C++.


    +   - In Fortran


    ```

    !$acc loop [clause-list]

    do . .

    ```


    FIG. 2

    OpenACC loop directive syntax in Fortran.


    where [clause-list] is one or a combination of clauses and its arguments properly
    selected from the following list (Fig. 3).

    Throughout the rest of this chapter, the significance of most of these clauses
    and corresponding arguments will be explained and their usage illustrated using
    both a simple code example.'
