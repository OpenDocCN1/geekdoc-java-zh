    # THE VARIOUS FORMS OF OpenACC PARALLELISM


    The OpenACC execution model allows users to express three levels of parallelism:
    *gang, worker*, and vector.

    As illustrated in Fig. 6, starting at the top:


    +   - A thread: The core parallel concept is a single, serial thread of execution
    that runs any valid C, C++, oring code.

    - A worker: Groups of threads that can operate in a SIMD or vector fashion are
    called workers (CUDA programmers will recognize that a worker is just the OpenACC
    name for a warp.).

    - Vectors: Vectors cause worker threads to work in lockstep when running vector
    or SIMD instruction.

    - A gang: Groups of workers are called gangs (CUDA programmers will recognize
    a gang is another name for a CUDA superblock.) Gangs operate independently of
    each other.'
