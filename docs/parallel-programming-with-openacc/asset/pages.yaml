  md: 'After deploying 9 GPUs and instigating a communication in both dimensional
    planes, the cost per cell stays constant while increasing GPUs. At over 96% parallel
    efficiency, this shows good scaling on the whole of the machine.


    # CONCLUSION


    OpenACC is a directive-based programming model to allow the code developer to
    identify areas of code to be accelerated on a hosted device. Adding directives
    to an existing code base is is an attractive proposition when compared to re-writing
    in a new language and realizes some of the benefits from an open, nondruptive
    approach. Vendors are developing backends that can still utilize their proposed
    methodology, yet they have the OpenACC standard as a common interface. By investigating
    the OpenACC programming model, through the hydrodynamic mini-app CloverLeaf, an
    idea of the steps and understanding needed to accelerate an application has been
    gained. It has been shown that it is "hot spot" an application and apply directives,
    that the time has to be taken to understand what is happening on a hardware level
    in those targeted subroutines and kernels.


    The re-factoring of compute kernels to data parallel is key. As the number of
    processing elements on accelerated hardware can run into the thousands


    Data transfers destroy performance. It has been shown that this can even be true
    for the smallest innocent piece of data, which instigates a much larger implicit
    data transfer.


    Optimizations required for a performant GPU implementation can give significant
    benefits when applied to a CPU implementation. These optimizations forced the
    kernels to be data parallel, which not only meant they threaded well on the GPU,
    but also when running multithreaded via OpenMP on a CPU. Additionally, the re-factoring
    of code also allowed the compiler to perform better scale and vector optimizations.


    # OpenACC ON THE CPU


    Throughout the development of the OpenACC version of CloverLeaf the similarities
    with the OpenMP version have become obvious.


    At a core level, both programming models provide a method to annotate the inherent
    parallelism within the algorithm, once it has been structured in such a way to
    exploit it.


    Historically, CloverLeaf has maintained two codebases for the OpenMP and OpenACC
    variants, although no fundamental differences exist within the code, the directives
    used obviously differ.'
