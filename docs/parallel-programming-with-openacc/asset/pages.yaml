    \    }\n}\n```\n\nNote that the full source listing for the example accList.andFloat3.h\
    \ header are given at the end of the chapter.\n\n# USING GLOBAL AND MODULE VARIABLES\
    \ IN ROUTINES\n\nA host program binary file is divided into segments. One segment\
    \ holds the instructions the program will run, another holds space for the stack,\
    \ a third contains the program's static (fixed size) data. Data program such as\
    \ fixed size arrays, C/C++ static variables, Fortran variables with the attribute-variable,\
    \ module variables, etc. are placed in this data segment. During compilation,\
    \ the compiler doesn't know where in the data segment the static data will be\
    \ placed. Instead it creates holder references which the linker resolves them\
    \ as an offset into the data segment.\n\nWhile users can put static data into\
    \ OpenACC data would need to be passed into any device routine that uses it. To\
    \ access the static data directly in a routine, the device would need to reference\
    \ an offset into a data segment that doesn't exist in device memory. To solve\
    \ this issue, OpenACC provides declare directive which can be used in a nonexecutable,\
    \ declaration section of a program (Box 16)."
