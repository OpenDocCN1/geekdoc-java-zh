  md: "# Parallel execution and race conditions\n\nFailure to include atomic pragma\
    \ is a common error that will result in a race condition that can cause garbage\
    \ and nondeterministic results as the programmer has no control over the order\
    \ of execution of threads. The nondeterministic behavior is particularly dangerous\
    \ as the program might seemingly correct results when debugging and then fail\
    \ in production. Also, the application may run correctly on one platform and fail\
    \ on another, or correctly with a particular software release and fail when the\
    \ software is updated.\n\nThe PGI OpenACC compiler is smart enough to detect the\
    \ error in this example when the atomic is omitted. As be seen in boldface in\
    \ Fig. 17, the compiler decided to generate serial code using only one thread\
    \ to ensure correctness. The reason is given in the following information line\
    \ that the **counter variable is live-out** from the loop. St variable is live\
    \ if it holds a value that may be needed in the future and it is **live-out**\
    \ when the compiler data flow analysis determines it is potentially needed by\
    \ other statements on exit from a code block. There are many excellent texts and\
    \ presentations available on compiler data flow analysis that can provide the\
    \ precise *live-out* mathematical definition, which is beyond the scope of this\n\
    \n```\npgcc++ -std=c11 -acc -ta=multicore,tesla:acc35 -Minfo-acc accelCounter.cpp\
