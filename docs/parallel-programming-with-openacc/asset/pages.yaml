    # CODE EXAMPLE: SOLVING 3D SCALAR WAVE EQUATION


    It is amazing how mathematical formulas can be used to express the behavior of
    natural phenomena, as waves propagating through space and time. A complete understanding
    of the formulas derived in this section is not necessary. However, the details
    are provided here to help you gain insight into how the problem is solved, and
    how the code is structured. The example for this chapter uses standard Cartesian
    coordinates to express the 3D scalar wave equation in this:


    ```

    $$\frac{\partial^2\phi}{\partial x^2} + \frac{\partial^2\phi}{\partial y^2} +
    \frac{\partial^2\phi}{\partial z^2}} = 0$

    ```


    where phi $(\phi)$ represents a scalar function that waves displacement over time.
    For example, $\phi=f(x, y, z)$ could represent the propagation of waves in a fluid.
    To solve this second-order equation, two first-order equations are:


    ```

    $f = g \frac{\partial\phi}{\partial t}$

    ```


