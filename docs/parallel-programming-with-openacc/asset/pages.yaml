  md: 'If you examine the loops in our previous example code, you will see that the
    computation of a single element of the product matrix does not depend on values
    of other elements of the same matrix. So, the two outermost computation loops
    are independent, which confirms the compiler''s previous analysis. However, for
    the innermost loop, each iteration requires the value of c[i][j] from the previous
    one: that is a data-dependency caution excludes the use of the independent clause.


    Note that you must exercise caution when considering this. First, if you miss
    a data-dependency in a specific loop and annotate it with the independent clause,
    your program will most probably give you incorrect and inconsistent results. Then,
    there is also the case where the independent clause is implied on all loop constructs,
    unless explicitly overridden by the auto or the seq clauses, and that is when
    the parent compute construct is a parallel construct. And here rises the importance
    of the auto clause: using the loop construct with the auto clause is always safer
    than keeping it.


    # THE SEQ CLAUSE


    If for some reason (most often data-dependency), a loop has to execute sequentially,
    you need only annotate it with the loop construct along the seq clause. This clause
    will override any automatic parallelization or vectorization that might be attempted
    by the compiler. Let''s note that compilers tend to operate on the safe side when
    it comes to data dependency detection: false-positives are much more frequent
    than false-negatives. In other words, the seq clause is absolutely needed in the
    very rare cases where the compiler parallelizes a loop containing a data dependency,
    which would produce erroneous numerical results.


    For it is quite straightforward, the compiler has already found out which loops
    were required sequential execution in our matrix-multiplication example. So, the
    following annotation is only for the sale of illustrating the use of the independent
    and seq clauses but does not have any influence on the extent of parallelization
    (Fig. 7).


    ```

    #pragma acc data copy(a,b) copy(c)

    #pragma acc kernel

    #pragma acc loop independent

    for (int i = 0; i < SIZE; ++i) {

    #pragma acc loop independent

    for (int j = 0; j < SIZE; ++j) {

    #pragma acc loop seq

    for (int k = 0; k < SIZE; ++k) {

    c[i][j] += a[i][k] * b[k][j];

    }

    }

    ```


    FIG. 7


    Example of the independent and seq clauses.'
