    Although the code is now running on the GPU at the end of the first porting step,
    it is actually much slower than the reference CPU OpenMP version of 240ms. This
    issue will be addressed in the next porting step. The different timings between
    the two compilers for this first example are mostly due to a different behavior
    regarding the so-called pinned memory. By using the flag `-ta nvidia,pinned` with
    PGI the time goes to 1024ms similar to what is achieved with the Cray compiler.
    The "pinned" flag has no negative impact for some of the later examples, and then
    we keep `-Q3 -ta=nvidia` for PGI for the reader.


    In general, the timing of the main time loop is the main concern for porting of
    atmospheric GPU compared to the timestep. The actual atmospheric model is much
    smaller. However, it should also be noted that initialization times for the code
    compiled with PGI (not on the table) has increased when the OpenACC directives
    were added to the code. This is because, depending on the OpenACC implementation,
    the device is eagerly initialized when encountering the first parallel region,
    which adds some time to cost. In the example code presented here, an OpenACC parallel
    region is used in the `m_setup_f90` to initialize the GPU, and initialization
    is therefore not accounted in the time for the execution of the main time loop.
    It is good to be aware of this additional time required for the initialization
    of the GPU, as the first OpenACC parallel region in your code may be within the
    main time loop.


    # STEP 2: MANAGING DATA TRANSFERS


    In first porting step, OpenACC parallel regions were added to the code and successfully
    used to run part of the code on GPU. However, this resulted in a slowdown of the
    code, instead of a speed. The reason for this is the lack of data management in
    the code. At the beginning of each OpenACC parallel region, the variables needed
    for calculation are copied from the CPU to the GPU at the beginning of the region,
    and then back at the end of the parallel region. This results in a significant
    amount of time spent transferring data, as there are now two OpenACC parallel
    regions being executed during each time loop—see Fig. 7.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '![](img/4798a278f62814efc0b15c6258d71d30_293_0.png)


    **FIG. 7**

    Schematic of data transfers at the beginning of step 2.


    To mitigate this problem, in step 2 more OpenACC directives are added to eliminate
    the unnecessary data transfers between the CPU and the GPU. First, an unstructured
    data region is created for the global variables t and qv in m_setup.f90. The data
    are first allocated on the GPU using the $acc data enter statement, and then copied
    from the CPU to the GPU using the $acc update device statement during the initialize
    subroutine. The $acc data enter statement requires a $acc exit data statement,
    which is placed right after deallocation of the global variables in the cleanup
    subroutine in m_setup.f90, as shown in Fig. 8.


    These OpenACC directives ensure that the t and qv variables are allocated and
    copied to the GPU before the time instead of copied back and forth between OpenACC
    parallel regions—see Fig. 9.


    Next, a data region is created for the local variable qc in m_physics.f90 using
    the $acc data create and $acc end data statement, shown in Fig. 10. The $acc data
    create allocate all memory on the GPU, but does not copy data from host to GPU
    when exiting a region. The data region spans the two calls to the parameterization
    subroutines and ensures that the qc variable is not copied back and forth between
    the CPU and the GPU between the calls to the saturation_adjustment and microphysics
    subroutines.


    Data regions are also needed in the subroutines in m_parameterization.f90 file
    to indicate that the t, qv, and qc are now located on the GPU (from another containing
    region). Therefore, $acc data present and $acc end data statements are added at
    the beginning and end of the saturation_adjustment and microphysics subroutines,
    as shown in Fig. 11.'
