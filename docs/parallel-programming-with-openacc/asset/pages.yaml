  md: '# GPU-2


    In the first optimization of the GPU code, the copyout (host update) of the g_ij
    is achieved by performing the worksharing summation on the device instead. By
    avoiding the (redundant) data transfer of g_ij, the entire kernel has effectively
    ported to the device. As such, the implementation will take full advantage of
    the accelerator, but we note how the host is now completely idle during computation,
    an issue we will address later in. For now, we note that both the EPSOcc and EPSVirt
    vectors have been declared as present in the OpenACC parallel region to avoid
    excessive data movement, as we copy the Alpha tensor in the clause of the outer
    data region. The two relevant elements of the EPSOcc have furthermore been explicitly
    fetched into the local cache, even though most, if for pedagogical purposes, one
    would do this automatically. However, being verbose here is not only for clarity
    but it is used to aid the compiler in the analysis of the nested loop, in the
    same way as the code added (loop iterations are explicitly data-independent) and
    the GPU parallelization of the energy summation has explicitly mapped to threads
    (block threads) and vectors (individual threads), although the compiler might
    decide this upon even in the absence of the clauses. In general, if implicit,
    it is good practice to enforce the final implementation to be verbose, not only
    to make it more transparent to the future developers of the code, but also to
    guarantee comparable execution with compilers from different vendors. However,
    we have refrained from explicitly mapping the loops to x number of thread blocks
    (num_gangs) of length y (vector_length(y)), as this would make the code less general
    in which it is able to target other architectures, see the “Introduction” section
    (Fig. 3).


    # GPU-3


    Having succeeded in port the kernel to a single device, as opposed to a host-only
    execution, the next obvious step is to port to multiple devices. In doing so,
    one has the option between (least) two different strategies, namely: using (1)
    message passing (MPI); or (2) worksharing compiler directives (OpenMP). For option
    (1), each MPI rank has to create its own context, and sharing the host main memory
    among the individual ranks is nontrivial (although indeed possible). Furthermore,
    one would have to create an additional layer of communication on top of a possible
    intra-node parallelization of the kernel. For option (2), on the other hand, the
    individual devices are mapped to OpenMP threads, among them they share a common
    shared memory context. For memory-intensive tensors grow very large in size. Thus,
    by embedding the OpenACC implementation of the “GPU-2” section within an OpenMP
    parallel region, we can extend the accelerated code from one to multiple devices
    (Fig. 4).'
