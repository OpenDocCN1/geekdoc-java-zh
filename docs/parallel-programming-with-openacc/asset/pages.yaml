  md: '196 CHAPTER 10 The detailed development of an OpenACC application


    # COMPARISON OF HYBRID MPI/OpenMP


    At face value, a factor of six fold improvement in the accelerated code over the
    original nonaccelerated code sounds like a significant gain. However, this is
    comparing the performance of the entire X2090 GPU against that of a single Opter
    core. A more realistic comparison is to compare against the performance achievable
    by using all the cores on the Opter socket.


    At the time of study, the optimal performance achieved using the hybrid MPI/OpenMP
    version of CloverLeaf is achieved by using 8 MPI tasks, 1 OpenMP threads, and
    one per Bulldozer module. This gave wall clock time of 43.52s, in comparison to
    the 58.03s for the GPU; a factor of 0.88.


    The factor of six over a serial implementation may look attractive, but with a
    distributed parallel implementation on the CPU outperforming the accelerated GPU,
    a GPU-based architecture is no longer such an attractive proposition. Before returning
    to and addressing this performance gap, the OpenACC version of the code needs
    to be extended to execute execution on multiple GPUs.


    # HYBRID MPI/OpenACC


    To enable to execute on multiple GPUs, the OpenACC build of CloverLeaf is extended
    to use MPI. This required each GPU to be fully resident on its section of the
    computational domain, with a traditional halo data exchange scheme implemented
    between each subdomain.


    In this practice we first updating the host with the latest data from its own
    GPU, then using MPI to communicate that data between neighboring CPUs, and finally
    each accelerated GPU obtaining the updated halo data from its CPU host. Fig. 7
    shows how this is implemented using the OpenACC update directive. This results
    in a fully distributed and accelerated version of the CloverLeaf mini-app.


    # VERSION A: INITIAL PERFORMANCE


    Referred as version A, this initial, fully distributed and accelerated version
    is taken as a starting point for analyzing performance. Fig. 8 shows the strong
    performance characteristics of the initial MPI GPU version of the code. Plots
    are for one Interlagos CPU core, one Interlagos socket, and 1–6 GPUs.


    The key points to take away are as follows:


    +   - X2090 GPU is a factor of 5.97 faster than one Interlagos CPU core.

    - X2090 GPU is 0.88 times faster than one Interlagos socket.

    - MultiGPU scaling turns over after utilizing 6 GPUs.


    To see if these initial findings can be improved on, understanding these performance
    figures is crucial.'
