    \ ] [ if, wait, async, finalize ]\n```\n\nThe enter dataclause should only be\
    \ used after the associated host variable has been created, likewise, theexit\
    \ dataclause should be used before the host variable is destroyed. Theenterexit\
    \ data clauses are similar to structured data regions where an enter directive\
    \ can only createorcopyin and the exit directive can copyoutdelete data. Upon\
    \ entering the data region, if the data is already present on the device, the\
    \ data will not be created again but its reference count is incremented. When\
    \ an exit directive is encountered, the device data's reference count is decremented\
    \ and when no references remain, the finalizeclause to an exit region will set\
    \ the reference count to zero and delete the device data. Both directives support\
    \ conditional execution using the ifclause as well as asynchronous execution using\
    \ asyncwait clauses (Boxes 2 and 3).\n\n```\nBOX 2 USING UNSTRUCTURED DATA REGIONS\
    \ IN C\ndouble * allocData(size_t size) {\nd *\ntmp = (double *) malloc(sizeof(double));\n\
    /* Create the array on device.\nThe host copy must be allocated before creating\
    \ the device copy */\n#pragma acc enter data create(tmp[0:size])\n return tmp;\n\
    }\n\nint deleteData(double * A) {\n/* Delete the host copy.\nThe device copy should\
    \ be deleted before the host is freed.\n*/\n#pragma acc exit data delete(A)\n\
    free(A);\n}\n```"
