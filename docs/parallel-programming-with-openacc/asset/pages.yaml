  md: '# CHAPTER 3 Profiling performance of hybrid applications


    Profiling tools from compiler or accelerator vendors are usually limited to the
    scheme the product addresses, e.g., only OpenACC and CUDA/OpenCL activity. Nearly
    all vendor tools are unable to record MPI activity leaving the programmer in the
    dark how well hybrid applications perform over all aspects of the application
    parallelism. Research-based performance tools cover this gap. HPcountool, Tau,
    and Score-P are the most prominent third-party profiling tools that also offer
    hardware parallelization records, of the three Score-P is the one that covers
    the most parallelization records, can record the most concurrent activity and,
    as a result, provide the most complete performance picture even for complex applications.
    Therefore, Score-P will be used as the example performance recording tool for
    this chapter. Vampir will be used for visualizing the performance data since it
    is by far the most capable trace visualizer and profile generator.


    You can get Score-P at http://www.score-p.org and Vampir at http://www.vampir.eu.


    # PERFORMANCE ANALYSIS TECHNIQUES AND TERMINOLOGY


    While the term “profiling” is commonly used to describe application performance
    as a whole, it technically refers to a subset of the performance measurement and
    analysis techniques. A formal comparison of the techniques is shown in Fig. 1.


    ![](img/4798a278f62814efc0b15c6258d71d30_75_0.png)


    FIG. 1


    Formal categorization of performance analysis techniques and their relation (Lische,
    Schuchart, Schöne, & Hackenberg, 2014).'
