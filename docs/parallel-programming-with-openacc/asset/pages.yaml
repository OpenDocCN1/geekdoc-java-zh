  md: '# Summary and conclusion 261


    ![](img/4798a278f62814efc0b15c6258d71d30_280_0.png)


    SUMMARY AND CONCLUSION

    In the present, OpenACC compiler directives have been used to compactly and efficiently
    accelerate the O(N^2)-scaling rate-determining step of the RI-MP2 method. With
    a total of eight steps, the computations have been incrementally offloaded to
    the accelerators (GPUs in the present context), followed by a subsequent optimization
    of the involved data transfers. In the final versions of the code, computations
    and data traffic have been asynchronously pipelined, and an explicit pinning of
    the involved tensors in page-locked host memory has been introduced in order to
    make the tiled GPU schemes compute-bound on par with the more memory-intensive
    schemes. With their minimal memory footprints and explicit dependency on optimized
    math libraries, the two final versions of the code using either double or single
    precision arithmetics are capable of scaling to large systems as allowed by the
    capacity of the host memory.


    The evaluation of the RI-MP2 energy has been accelerated using a high-level approach
    through the use of compiler directives rather than a low-level, albeit possibly
    more efficient approach through recasting of the code using the CUDA platform.
    This has been a deliberate choice, based on a number of reasons. First and foremost,
    it is the opinion of the present author that accelerated code needs to be relatively
    easy and fast to implement, as new bottlenecks are bound to


    FIG. 15 Total time-to-solution for the CPU-only and hybrid CPU/GPU versions of
    schemes 7 and 8 (using six K40 GPUs).'
