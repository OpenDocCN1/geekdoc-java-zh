    # SUMMARY


    Once identified, OpenACC was applied to each kernel on an individual basis, and
    the breakdown of compute and data transfer to and from the CPU can be assessed
    by kernel basis.


    Once all the main compute kernels were accelerated, they were then executed in
    unison. This then showed the overall performance being achieved form execution
    on the GPU. However, as each kernel was still transferring data to and the host,
    also highlighted the overhead of the data transfer.


    To remove the impact of the data transfers, the code was made fully resident on
    the GPU device. This removed all an initial copy to the GPU and a final copy back
    to the host CPU.


    However, to make fully resident, and run exclusively on the GPU, not only did
    all the data to be identified for the initial transfer, but also those parts of
    the code that were not necessarily computationally intensive also needed to be
    made on the GPU.


    Once the entire application was resident and running exclusively on the GPU, the
    performance was then investigated to determine bottlenecks. Firstly the impact
    of increasing the problem size was explored, and once a large enough case identified
    suited it the GPU performance was compared against the best CPU performance from
    the most optimal variant of the code (MPI, OpenMP, MPI/OpenMP) available at the
    time of study. By based these comparisons, a range of optimizations were applied
    by analyzing how each kernel utilizes the GPU''s threads.


    Finally, a robust, fully resident OpenACC version of the code, the application
    was extended to use multiple GPUs by developing a hybrid MPI/OpenACC implementation.
