    # STEP 3: BASIC OPTIMIZATIONS


    The third step in the OpenACC porting of the simple atmospheric model is to perform
    basic optimizations. These are small changes to the code which are not expected
    to be as large as the initial speedup that was achieved in steps 1 and 2 of the
    porting approach. There are three separate optimizations that are added to the
    simple atmospheric model code.


    # Fine-grain control of parallelism


    The first optimization is to add some clauses to the acc loop directives in the
    physics parametrization subroutines saturation_adjustment and microphysics. Because
    the loops in the saturation_adjustment subroutine are tightly nested, a collapse(3)
    clause is added to the acc loop on the outer loop. This means that the loops are
    collapsed together and treated as one large loop. All three loops in the microphysics
    subroutine cannot be collapsed because of the dependency in the i loop. The i
    and j loops could be collapsed together if desired.

    Gang and vector clauses are also added to the acc loop directives in the physics
    subroutines. The gang and vector clauses are used to distribute the iterations
    of the loops among the gangs or vector mode, In the saturation_adjustment subroutine,
    both the gang and vector clauses are added to the single acc loop directive, as
    shown in Fig. 14.

    In the microphysics subroutines, the vector class is added to the i loop, because
    the vector class should be associated with the loop of stride-1 in the arrays
    (most index in Fortran, as is the i loop). The gang clause is added to the j loop,
    and the k loop must still be run sequentially because of the dependency in k (see
    Fig. 15).'
