  md: '# CHAPTER


    # # Profile-guided development

    with OpenACC


    # 2


    Jeff Larkin

    NVIDIA, Santa Clara, CA, United States


    The purpose of this chapter is to introduce OpenACC programming by accelerating
    a real benchmark application. Readers will learn to profile the code and incrementally
    improve the application by adding OpenACC directives. By the end of the chapter
    the example application will be transformed from a serial code to one that run
    in parallel on offloaded accelerators, such as Graphic Processing Units (GPUs),
    and multicore targets, such as multicore Processing Units (CPUs).

    At the end of this chapter the reader will have a basic understanding of:


    +   * OpenACC kernels directive

    * OpenACC data directives and clauses

    * The PGProf profiler

    * OpenACC''s three levels of parallelism

    * Data dependencies


    Compiler directives, as OpenACC, provide developers with a means of expressing
    information to the compiler that is above and beyond what is available in the
    standard programming languages. For instance, OpenACC provides mechanisms for
    expressing parallelism of loops and the movement of data between distinct memories,
    neither of which is directly available in C, C++, or Fortran, the base languages
    supported by OpenACC. As such, programmers typically add directives to existing
    codes incrementally, applying the directives first to high-impact functions and
    loops and then add other parts of the code as they becoming increasingly important.
    Profile-guided development is a technique that uses performance analysis tools
    to inform the programmer at which step of the application will deliver the greatest
    impact once. We will use the Portland Group (PGI) compiler and PGPROF performance
    analysis tool to accelerate a benchmark code through incremental improvements.
    By the end of this chapter we will have a serial benchmark and parallelized it
    completely with OpenACC.

    Prerequisites for completing this chapter: a working OpenACC compiler and make
    executable (the NVIDIA OpenACC Toolkit will be used in the examples); the ability
    to read, understand, and compile a C or Fortran code; the ability to run the executable
    produced by the OpenACC compiler.'
