    We showed a hand-vectorized CPU kernel looks like using intrinsics for Intel x86
    FMA instructions, and we used it to provide a performance baseline for comparison
    with compiler-provided autovectorization for CPUs and GPUs-accelerated kernels
    with OpenACC. The OpenACC kernel performance reported here achieved 65% of the
    theoretical peak GPU memory bandwidth when we used one GPU of the Tesla K80, which
    is a very respectable outcome. OpenACC kernel performance could be improved further
    with additional performance tuning and by taking advantage of new features and
    optimization improvements using OpenACC compilers, but the results we achieved
    are representative of an experienced practitioner can achieve on a very limited
    time budget. OpenACC directives are well suited to the task of parallelizing legacy
    code without the need to maintain a multiplicity of hand-written kernels for GPUs
    or other accelerators, and are particularly appropriate when a large amount of
    code needs to be accelerated in observation of the impacts of Amdahl''s law.


