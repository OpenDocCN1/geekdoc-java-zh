    # # USING OpenACC TOOLS


    Now that we measured the baseline host performance, you can use the OpenACC tools
    to target GPU-based accelerators. You will need access to a system that has an
    NVIDIA GPU, and PGI compilers installed. For this chapter, a single NVIDIA™ Tesla®
    M40 24 GPU Accelerator (with 24GB of GDDR5 GPU DRAM, and Maxwell G200 CUDA® cores
    across 24 Multiprocessors) was added to the Haskell-based system. Since the original
    code was analyzed for parallel execution using OpenMP threads, you can confidently
    assert that the OpenACC directives are all parallel targets for corresponding
    loops.


    # # ADDING OpenACC PARALLEL DIRECTIVES


    There are two types of OpenACC parallel directives used at this stage:


    +   * #pragma acc kernels

    * #pragma acc loop


    By inserting the kernels directive, you express your desire to parallelize any
    loops within the region, and place the burden of analysis on the compiler. In
    conjunction with the kernels directive, you add the loop directive before loops
    that you deem interesting, and should be further analyzed by the compiler. Fig.
    1 shows a portion of the C code using both kernels and loop directives.

    The additional clauses to the #pragma loop directive are: independent, collapse(N),
    gang, and vector. The independent clause informs the compiler that each iteration
    of the loop is independent (that there will be no race conditions or ordering
    arrays). The collapse(N) clause will instruct the compiler to turn the next N
    loops into one flattened loop. This typically helps improve GPU occupancy. The
    gang and vector allow you to provide hints to the compiler to specify which parallel
    resources are scheduled. Multiple gangs work independently from each other, and
    are scheduled using a round-robin technique. This allows gangs to share resources
    as multiprocessors, cache, etc. from a single GPU. Gangs have one or more workers,
    and each worker performs operations on a set of threads. Vector threads work in
    lock-step with same instruction operating on multiple data elements'
