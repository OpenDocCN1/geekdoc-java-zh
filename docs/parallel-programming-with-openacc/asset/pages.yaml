    # AICLE-IN-CELL SIMULATION OF A LASER DRIVEN ELECTRON BEAM


    Particle-in-cell codes simulate the movement of particles in electromagnetic fields
    by partitioning the simulation domain into a grid (cells) while maintaining the
    particles as freely moving entities. The specific simulation (Burau et al., 2010)
    used for the performance study in this chapter describes how a very energy laser
    pulses a hydrogen gas and in its wake field accelerates electrons to generate
