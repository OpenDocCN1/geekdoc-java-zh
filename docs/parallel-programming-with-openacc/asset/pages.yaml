    # PARALLEL LOOP CONTAINING SUBROUTINE CALLS


    In the previous sections, a three-step approach for porting the simple atmospheric
    model has been described. However, the example code is somewhat simplistic and
    only contains subroutines with purely nested loops. In a real application, the
    call tree may be more complex and in particular contain subroutine calls within
    the parallel loops. This case can be handled by using the $acc routine clause.


    The purpose of this section is to show how this OpenACC construct is required.
    We then ensure the code is structured properly, with the horizontal loop i and
    j directly in the physics and a modified version of the saturation_adjustment
    and microphysics subroutines being called for each iterations of the i.j loop.
    An OpenACC data region and a parallel region are added around these new nested
    loops in the physics (Fig. 19).


    The OpenACC data region outside the main time loop was described in step 2 of
    the previous section is also implemented, so that the main variables are copied
    to and from the GPU outside of the main time loop.


    The $acc seq directives are added to the saturation_adjustment and microphysics
    subrout. The seq clause tells the compiler that there will be no further parallelization
    inside the routine. This clause is required for the physics subroutine because
    the k loop must be run sequentially as a result of the dependency on k-1. The
    saturation_adjustment routine must also be run sequentially, because the i loop
    in the physics subroutine has the vector clause, which is the lowest level of
    parallelization that can be applied.'
