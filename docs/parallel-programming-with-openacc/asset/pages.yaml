    # INVESTIGATING OpenACC RUN TIME EVENTS WITH SCORE-P AND VAMPIR


    Compilers and run times have a certain freedom in implementing OpenACC directives.
    Therefore, it is important to review their conversion and execution. For example,
    the kernels can trigger the device initialization, device memory allocations,
    and data transfers without explicitly specifying respective operations. The profiling
    interface introduced with OpenACC 2.5 defines a set of events that unveil detail
    on the implementation and execution of Open directives. It enables tools such
    as Score-P to measure the duration of OpenACC regions, expose waiting time and
    offloading overhead on the host, and track memory allocations on the accelerator.
    More accelerator events such as the beginning and end of GPU kernels and CPU-GPU
    data transfers can be gathered with the CUPTI interface for CUDA'
