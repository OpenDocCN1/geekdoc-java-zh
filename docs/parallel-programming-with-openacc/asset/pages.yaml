    # DEBUGGING AND PROFILING


    For OpenACC targets building on the CUDA platform, it is possible to use the NVIDIA®
    debugging and profiling tools. This section summarizes tips and tricks on how
    to use the NVIDIA® debugging and profiling tools for an MPI+OpenACC application
    targeting NVIDIA® devices. Besides the discussed NVIDIA® tools are also OpenACC
    aware, for pgprof, score-p, Vampir, and Tau for profiling or the DDT and ToolView
    debuggers.


    # DEBUGGING WITH cuda-memcheck AND cuda-gdb


    To use cuda-memcheck on an MPI+OpenACC application it can be launched with the
    MPI launcher so that one cuda-memcheck instance is started for each MPI rank:


    ```

    mpirun -np 2 cuda-memcheck ./myapp <args>

    ```


    The main issue of this usage is that cuda-memcheck output is interleaved between
    MPI ranks. This can be avoided by writing the output of cuda-memcheck to a file
    using these cuda-memcheck command line options:


    +   - --log-file.%q(ENV_VAR).log: to write the console output of cuda-memcheck
    to a text file.

    - --save-name.%q(ENV_VAR).memcheck: write a binary file that can be later read
    by cuda-memcheck with cuda-memcheck -read.'
