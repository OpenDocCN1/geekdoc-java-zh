  md: "# CHAPTER 5 Advanced data management\n\nNote the class'this pointer is also\
    \ added to an enter data created directive. The thispointer is the actual instance\
    \ of a particular object's data members. Although typically hidden from the programmer,\
    \ all accesses to the object's data members are performed through thethispointer.\
    \ So while the program may be using \"size=0\", the actual is accessing \"this->size\
    \ = 0.\" When this pointer is created on the device, space is created for each\
    \ of the object's data members. If a pointer is created in copyclause, then shallow\
    \ copy of the data members is performed. If any of the data members are present,\
    \ then the associated host pointer is copied to the device (Fig. 2).\n\n![](img/4798a278f62814efc0b15c6258d71d30_109_0.png)\n\
    \n![](img/4798a278f62814efc0b15c6258d71d30_109_1.png)\n\n**FIG. 2** Creating data\
    \ in a C++ constructor.\n\nNext, the dynamic data members are allocated on the\
    \ device and attached to thethispointer. Attaching will fill in the value of the\
    \ data member's pointer to the address of the device. Order matters. If the dynamic\
    \ data is created before thispointer, there is nothing used to attach to or the\
    \ attach will be skipped. In the destructor, the reverse order is used where the\
    \ dynamic data is deleted from the device, then thethispointer is deleted.\n\n\
    Since the data is private, the class must provide methods to perform data synchronization\
    \ between the host and the device (Box 10).\n\nBOX 10 ADDING CLASS UPDATE METHODS\n\
    void accUpdateSelf() {\n  #pragma acc updateSelf(A[0:size])\n}\nvoid accUpdateDevice()\
    \ {\n  #pragma acc update device(A[0:size])\n}\n\nBox 11 shows a simple program\
    \ that uses the myListclass. Other than deciding when to synchronize data, the\
    \ programmer does not need to manage the creation, deletion, or updating of the\
    \ underlying data."
