    # BIG-O CONSIDERATIONS AND DATA TRANSFERS


    Big-O notation is a convenient way to describe how the size of problem affects
    the consumption by an algorithm of some resource such as processor time or memory
    as a function of its input. In this, computer scientists can describe the worst
    and average case runtime of an algorithm. These Big-O descriptions can be used
    to compare algorithms, which helps us understand the types of parallel algorithms
    that might exhibit a high computation per data item and identify those of interest
    for Open/ACC offloading.

    Some common Big-O rates are as:


    +   - O(1): These are constant time (or space) algorithms that always consume
    the resources regardless of the size of the input. For example, indexing a single
    element in a vector does not vary in time or with the size of the data set and
    exhibits O(1) runtime growth.

    - O(N): Resource consumption with these algorithms increases linearly with the
    size, represented by N, of the input. This is common for algorithms that loop
    over a data set (of size N) where the work inside the loop requires constant time.

    - O(N²): Performance is directly proportional to the square of the input data
    set. Typical examples algorithms that use nested loops over data set exhibit O(N²)
    runtime. De iterations iterations show greater runtime (e.g., three nested loops
    in O(N³), O(N⁴) when loops are nested,


    There are many excellent texts on algorithm analysis that provide a more precise
    and comprehensive description of Big-O notation. One popular text is “Introduction
    to Algorithms” (Cormen, Leiserson, & Rivest, 2009). There are numerous resources
    on the Internet discussing teaching Big-O notation and algorithm analysis.


    Most computationally oriented scientists are familiar with BLAS (Basic Linear
    Algebra Subprograms). BLAS is the facto programming interface for basic linear
    algebra. To remain competitive, most vendors provide highly optimized BLAS libraries.
    Powerful heterogeneous-performance dense linear algebra libraries like the MAGMA
    project at the University of Tennessee Computing Laboratory are all available.
    Heterogeneous computation can utilize the computational capabilities of both the
    host processor (CPU) and several types of Open/ACC devices. MAGMA in particular
    can attain high performance by exploiting all the system computational capabilities.
    It is available for free download.


    BLAS is structured according three different levels with increasing data and runtime
    requirements.


    +   - Level-1: Vector-vector operations that require O(N) data and O(N) work.
