    point in space, also known as a scalar wave field (Riffe, 2016). Here, $g$ tells
    you how the scalar wave field is changing in a specific direction. $g$ assigns
    a vector (magnitude+direction) to each point in space (also known as the linear
    time derivative of the field $f$). Using substitution leads to the following formulas:'
