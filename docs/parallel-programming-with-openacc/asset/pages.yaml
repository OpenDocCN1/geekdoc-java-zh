    \n# USTERING ALGORITHMS\n\nClustering algorithms primarily fall into one of two\
    \ categories: either hierarchical or partial, which differ primarily in the way\
    \ in which clusters are determined (Reynolds et al., 2006). In particular, hierarchical\
    \ methods organize data into a hierarchical tree of nested clusters using either\
    \ an agglomerative or divisive scheme (Reynolds et al., 2006). Agglomerative schemes\
    \ work in a bottom-up fashion, forming larger clusters from smaller ones, while\
    \ divisive methods use a down approach. The decision of whether to merge or divide\
    \ a cluster is made according to a so-called criterion that is specified by the\
    \ user. Partial methods, on the other hand, organize data into non-overlapping\
    \ groups. Methods require the user to specify the number of clusters, usually\
    \ denoted as $k$. Based on this parameter, an objective function particular to\
    \ the partial method in use is iteratively optimized to arrive at a final grouping\
    \ of $k$ clusters (Reynolds et al., 2006)."
