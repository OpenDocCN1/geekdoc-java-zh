    # CUDA-aware MPI


    A CUDA-aware MPI implementation allows you to exchange data directly and from
    device memory buffers, avoiding the overhead of the host buffering in the user
    code. Without a CUDA-aware MPI it would have been necessary to stage data to host
    memory with update directives (see Fig. 32). If necessary, the host staging can
    be done far efficiently when embedded in the internal pipelines of the MPI implementation.
    Furthermore a CUDA-aware MPI will use acceleration technologies such as GPUDirectPeer-to-Peer
    (P2P) and Remote Direct Memory Access (RDMA) avoiding any host memory staging
    if possible (Kraus, 2016).


    Remark: Direct GPU to GPU transfers (GPUDirect™P2P) require using inter-process
    communication (IPC). CUDA-aware MPI implementations using CUDA IPC P2P mappings
    between GPUs controlled by different processes. Establishing the P2P mappings
    is often done lazily by the MPI implementation on the first communication, and
    has a significant overhead. In longer running applications the overhead is usually
    insignificant. To exclude it from the reported time variant contains MPI warm
    up calls A similar technique was used to avoid the OpenACC initialization costs
    that slow down the first iterations of de-f all discussed variants.


    # OVERLAPPING COMMUNICATION WITH COMPUTATION


    The parallel efficiency of all presented variants suffers from the parallel overhead
    caused by the necessary halo exchange. Since the halo exchange only requires reading
    the first and last row of each domain, it is possible to hide these latencies
    behind the execution of the copy kernel (Hager & Wellein, 2010, pp. 216–220).'
