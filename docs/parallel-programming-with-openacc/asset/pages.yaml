    lifetime on the device, which are controlled by the create or copyin data class.
    Similarly the exit data directive marks the end of the lifetime of a variable
    with the copyout, release, and delete data classes. Since data is passed between
    functions, it is actually possible that the variable may have multiple entry and
    exit data directives that refer to it, so the runtime will keep a count of how
    many times a variable has been referenced, ensuring that the data isn''t removed
    from the device until it is no longer needed on the device. The runtime will also
    use this reference to determine whether it is necessary to copy data to or from
    the device, which occurs on the first and last references to the data needed.
    Table 2 expands upon Table 1 adding the two data clauses that may only appear
    on exit data directives.


    # Table 2 Additional Data Clauses Only Valid on Exit Data Directives


    | Clause | Behavior |

    | --- | --- |

    | delete | Listed variables will be immediately removed from the device, regardless
    of reference count, triggering any data copy |

    | release | The reference count for listed variables will be reduced. If the reference
    count reaches 0, the variable will be removed from the device without triggering
    any data copy


