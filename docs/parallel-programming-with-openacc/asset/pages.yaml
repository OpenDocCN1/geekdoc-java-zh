    # BLOCKING COMPUTATION


    Blocking, or tiling, is a technique of breaking a single large operation into
    smaller, independent pieces. When blocking is applied correctly, the final result
    should require the same amount of work and produce the correct results. Fig. 6
    shows the same Mandelbrot set that was generated previously and illustrates the
    image can be broken into multiple parts, in this case 4, that are generated separately
    because each pixel is generated independently. For this exercise we only block
    the image generation along rows, as shown, but the code can also be blocked by
    columns or by rows and columns. The decision to block by row ensures that the
    data for each block is contiguous in memory, thus simplifying the transfer of
    the data to and from the accelerator.'
