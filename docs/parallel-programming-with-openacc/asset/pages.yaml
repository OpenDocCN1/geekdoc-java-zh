  md: '# Looking at a first parallel PlconGPU implementation


    The various displays for the performance data can be selected by the toolbar icons
    on the top left. There are two groups of displays, the timeline and statistics
    displays. The time displays show the activity along the temporal evolution in
    the horizontal direction. In this group is the master timeline, which shows the
    color coded activity of all event streams (which can be processes, or CUDA streams).


    The color code is by default based on the function groups shown in the calling
    context over time for one event stream. The counter timeline shows the values
    of a performance counter associated with one event stream. This can be e.g. a
    PAPI counter, but also derived counters such as memory allocations or anything
    that was created with the Vampir metric editor. The temporal context of a counter
    for all event streams is shown in the performance radar.


    The second display group contains the statistics which present various profile
    data. The function summary shows the distribution of run time or number of invocations
    among functions or groups. The message summary provides statistics about all data
    transfers (between host and device or between MPI processors). Others are the
    process summary, the message matrix, the I/O summary and the call tree. Detailed
    explanation of all Vampir features can be found in its manual which is part of
    the installation.


    The most important feature of Vampir, which sets it apart from standard profiling
    tools is to zoom into any arbitrary interval in the program execution timeline.
    Only an excerpt of the trace is shown in Fig. 8 as indicated in the thumbnail
    view in the upper right (the selected interval is depicted by the two black bars).
    Displays including the statistics are always updated to the currently displayed
    time interval. As a result, Vampir enables profiling of applications for any phase
    of the application and at high temporal resolutions. All displays of Vampir can
    be configured with respect to how they display the information by right-clicking
    into the display. Left-clicking on anything will bring up a context view which
    will show details about the selected item (such as start/end time, duration, function
    name, file name, size, etc.).


    The trace file shown in Fig. 8 depicts the run of a first attempt of parallelizing
    the single GPU PCIConGPU using MPI to increase the simulation area (weak scaling).
    The trace shows a typical problem of such a parallelization attempt: Sequential
    task execution. In this case we can see that both the MPI activity and the CUDA
    memory copies dominate the execution time while GPU utilization is lower.


    The high proportion of MPI activity is due to very long transfer times for smaller
    messages (which can be analyzed using the message summary). It turns out that
    PCI compute is so fast on the GPU that MPI transfers cannot be hidden. To reduce
    transfer the only option is to reduce the latency. In this case the 1 GB Ethernet
    in the development cluster was augmented with an Infiniband network to provide
    significantly faster MPI communication.


    Another issue is the rather long phase of synchronous memory copies (the bar of
    the host processes before it started on the device). Here, better interleaving
    of computing and data transfer will increase the overall throughput.'
