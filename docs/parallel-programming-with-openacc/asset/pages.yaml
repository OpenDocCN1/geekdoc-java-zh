    of paying cannot proceed until the operation of scanning the products is complete.
    This operation is fairly inefficient, since neither the buyer nor payer can do
    their part of the transaction until the other has completed. To serve more customers,
    it is tempting to think that the solution is to open more lanes, in fact a better
    solution is to optimize what happens within each checkout lane. For instance,
    a bagger can be bagging groceries while the customer is paying, the customer can
    be preparing the groceries while the groceries are being scanned, and the clerk
    can be scanning one customer''s groceries while the next customer begins loading
    Each of these operations are independent and can, at the same time, occur in the
    right order. These are the stages in the grocery checkout pipeline: unload the
    cart onto the belt, scan the groceries, pay, and bag. By allowing each person
    in the process to work asynchronously from each other the checkout line is able
    to process multiple customers in a more efficient manner than simply opening more
    lanes.


    Another example of a pipeline is an automobile industry. While Henry Ford did
    not invent the automobile, he optimized the automobiles were produced by recognizing
    that certain steps in the process could be completed at the same time on different
    cars, provided the steps always occur in a specific order. For example, one worker
    welds the frame, another worker adds wheels to a completed frame, and another
    worker adds the body to the completed frame with wheels. By ensuring that each
    step in the assembly takes a comparable amount of time, assembly lines are an
    effective way to keep every worker productive while building an automobile in
    a predictable amount of time.


    We can apply this concept to an OpenACC program. By default, OpenACC directives
    operate synchronously between the host CPU and the accelerator, meaning that the
    host CPU waits until the accelerator completes before moving forward. By making
    OpenACC regions asynchronous, the CPU can immediately do other things, such as
    execute additional work, perform data transfers, or perform other operations on
    the host. Asynchronous operations enable all parts of the system to be productive:
    the host CPU, the accelerator, and the PCIe bus, for data transfers. In the case
    that we use a technique to reduce execution time by overlapping operations that
    can be done simultaneously to keep the parts of the system, much like the assembly
    line previously described.


    Fig 1 shows an idealized pipeline that one might build to overlap accelerator
    computation fully with data transfers, where H2D represents host to device copies
    and D2H represents device to copies. The image is idealized in reality the time
    taken by each step does not line up as nicely as shown in the picture. Notice
    that by pipelining the operations four operations complete in the two operations
    would require to execute in series. Additionally, pipelining limits the full cost
    (time) of data transfers to only the first and last transfers; all other transfers
    are essentially free.'
