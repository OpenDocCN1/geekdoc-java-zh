  md: '# 24 CHAPTER 1 From serial to parallel programming using OpenACC


    Most parallel programmers follow the approach of exploiting the greatest amount
    of parallelism in the system to achieve the highest performance.


    The idea behind large numbers of threads is to give the parallel scheduler as
    many threads to choose from to maximize the chances that all computing resources
    will be fully utilized. GPU programmers like to speak in terms of occupancy as
    a measure of thread parallelism. A high occupancy implies that the scheduler has
    more active threads to choose from, and the opportunity to achieve higher performance.


    High occupancy does not necessarily translate into the fastest application performance.
    Instruction level parallelism (ILP) can be equally effective in hiding thread
    latency by using the processor (or GPU) with fewer threads that consume fewer
    resources and less overhead. However, the program has to run to ensure best use
    of the parallel hardware. The reasoning for ILP is simple yet powerful: Using
    fewer threads means more resources can be used over (Volkov, 2010).


    This argument can be adapted to OpenACC to control parallel resource utilization.
    Unlike OpenMP, OpenACC does not provide a mechanism like omp_thread_num() to determine
    the identity of a thread, or omp_get_num_threads() to find out the number of concurrent
    threads. As a result, it is not possible to write classes that can control their
    parallel resource utilization. At least as of the OpenACC 2.5 specification—must
    use a loop structure to explicitly control how parallel resources are used in
    their programs.


    For example, the following program (accParaNG.cpp) utilizes a number of sequential
    number generators in parallel. To be successful, the program has to guarantee
    that only one thread will be using each RNG at a time. Otherwise, uninterated
    RNG state information can get corrupted. It is not possible to do the update of
    the seed information in a single atomic operation, the only way to guarantee correction
    in OpenACC is to use a set of loops.


    The accParaNG.cpp uses code-based parallelism and the OpenACC constructs discussed
    in this chapter along the multiply-with-carry (MWC) random number generator. The
    MWC random number generator was invented by George Marsaglia for generating sequences
    of randomly chosen seed values (Marsaglia & Zaman, 1991). The advantages of the
    MWC method are that it can be implemented in a few lines of C++ code and it utilizes
    integer arithmetic. MCW leads to the very fast generation of decent sequences
    of random numbers. The reader can substitute more elaborate random number generators
    in accParaNG.cpp such as with the widely used Mersenne Twister (Matsumoto & Nishimura,
    1998) or the Dieharder random number test suite (Brown, 2006; and 24).


