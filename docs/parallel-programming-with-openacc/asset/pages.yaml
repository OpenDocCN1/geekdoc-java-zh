    Note that for applications are sensitive to floating-point operation ordering
    and precision. Here the floating-point values of the final output on a GPU can
    differ from the values computed on the CPU. One reason for this is the fused multiply
    (FMA) operation Pullan (2009), where the computation rn(X * Y + Z) is carried
    out in a single stage and is only rounded once. Without FMA, fn(rn(X * Y) + Z)
    is composed of two steps and rounded twice. Though, but this does not mean that
    using FMA will cause the results to differ; rather that the FMA implementation
    is incorrect. The difference in results obtained with and without FMA, may matter
    for certain types of codes and not for others. However, if a complex code, e.g.,
    a weather modeling code is under consideration, even minute differences may not
    be tolerable.


    To compile the C version of the FDK, the following command is used (Fig. 5):


    ```

    $ pgcc -fast -acc -ta=tesla:cc35,nofma -Minfo=accel fdk.c -o acc_fdk

    ```


    FIG. 5

    Compilation command-line.


    The flag "ta=tesla" tells the compiler to generate code for the compute capability
    of the Tesla GPU. We use the option "cc35" to specify the Tesla GPU product family
    has evolved over time and contains several generations of devices that differ
    with respect to their compute capabilities. The flag "nofma" tells the compiler
