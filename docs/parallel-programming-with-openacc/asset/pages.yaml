  md: '# Multidevice programming with OpenACC


    # 7


    Jiri Kraus

    VIDIA GmbH, Würselen, DEU, Germany


    The purpose of this chapter is to explain how to program multiple OpenACC devices
    to work cooperatively on a single problem.

    At the end of this chapter the reader will have a basic understanding of:


    +   - How to program host device or accelerated clusters with OpenACC using a
    single thread host, OpenMP, or MPI

    - Coordinate the work of multiple devices using a domain decomposition strategy

    - How to use the async clause to overlap computation and MPI communication

    - How to use the NVIDIA® tools for MPI+OpenACC applications


    # INTRODUCTION


    After accelerating your application using a single device, it is natural to consider
    extending your application to take advantage of multiple devices in a single node
    or multiple nodes of an accelerated cluster. The major reasons to use multiple
    devices are


    +   - Compute faster—more devices equals faster time to solution

    - Compute larger—more devices equals more memory for larger problems


    Application acceleration often requires the use of multiple devices, because the
    problem does not fit into the memory of a single device or needs to be computed
    in a certain amount of time (e.g., numerical weather prediction).

    In this chapter, you will learn how to program multidvice systems with OpenACC.
    To coordinate the work of multiple devices, domain decomposition is achieved by
    a Jacobi solver for the 2D Poisson equation. The chapter covers OpenMP, Message
    Passing Interface (MPI), and single-threaded as different alternatives to program
    multiple devices with OpenACC. It focuses on accelerators with memory that is
    physically separate from host, for example, Graphics Processing Units (GPUs).
    For OpenACC targets the memory of the host processors and the accelerator is the,
    for example, the Portland Groups (PGI’s) multicore target, having a domain decomposition
    to process all cores within a shared memory node'
