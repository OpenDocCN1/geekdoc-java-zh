    # THEORY


    In the closed-shell (canonical) MP2 model (Møller & Pstet, 1934), the correlation
    energy is given by the following expression


    ```

    $E_{MP2} = -\sum_{ab} \frac{g_{ab}(2g_{ab} - g_{ab})}{\epsilon_{ab}} $$

    ```


    in terms of two-electron electron repulsion integrals (ERIs), $g_{ab}$ (Mulliken
    notation), over spatial (spin-free) HF virtual orbitals $a, b$ and occupied orbitals
    $i, j$,


    ```

    $g_{ab} = \int \int \frac{\phi_i^*(r_1)\phi_j^*(r_2)\\phi_a(r_1)\\phi_b(r_2)}{|r_1
    - r_2|} dr_{r_1}dr_2,$$

    ```


    as well as the difference in energy between these, $\epsilon_{ab} = \epsilon_a
    + \epsilon_b - (\epsilon_i + \epsilon_j)$. Besides the final evaluation of the
    MP2 energy in Eq.(1), the dominant part of MP2 calculation is the construction
    of the four-index ERIs. In the so-called resolution-of-the-identity MP2 (RI-MP2)
    method (Feyereisen et al., 1993; Vahtras et al., 1993; Weigend & Häser, 1997),
    these are approximated by products of two-, and three-index, integrals using the
    following symmetric decomposition


    ```

    $g_{ab} = \sum_{ij} C_{ab}^* C_{ij} $$

    ```


    In Eq.(3), Greek denotes atomic orbitals within an auxiliary basis set for spanning
    the RI, and the fitting coefficients, $C_{ab}^*$, are defined as


    ```

    $C_{ab}^* = \sum_{ij} W_{ij} V^{(1/2)}_{ij} $$

    ```


    In terms of computational cost, the evaluation of two- and three-index integrals
    and/ the calculation of the fitting coefficients will determine the overall calculation
    for small systems ($O(N^3)$ and $O(N^4)$)-scaling processes, however, upon an
    increase in system size, the final $O(N^3)$-scaling prevails. However, the two-electron
    integrals in Eq.(3) will start to dominate, and this process is the ideal candidate
    for accelerating the RI-MP2 method. If the permutational symmetry of the two-electron
    integrals in Eq.(3) is taken into consideration, the evaluation of Eqs.(1) and
    (3) may be collectively expressed as in the pseudocode Fig. 1. Here, nocc, nvert,
    and naux denote the number of occupied orbital, virtual orbital, and auxiliary
    basis functions, respectively, while EpsOcc, EpsVirt, and eps denote the corresponding
    occupied and virtual energies as well as the difference between them. Large the
    involved dimensions grow for a given calculation depends much on the size of'
