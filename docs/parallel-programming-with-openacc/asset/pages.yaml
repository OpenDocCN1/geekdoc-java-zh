  md: '# Describe parallelism 39


    The most important part of the compiler output here is the accelerator restriction
    at line 34, which states it doesn''t know how to calculate the size of the arrays
    used inside the kernels region, specifically the three arrays used within the
    innermost loop. In the previous two examples, the compiler could determine based
    on the number of loop iterations how much data was needed to be relocated to the
    accelerator, because the loop bounds inside of matrix are hidden within our data
    structure, it is impossible for the compiler to determine how to relocate the
    key arrays. This is a case where we need to add explicit clauses to our kernels
    pragma Table 1 lists the five most common data clauses and their meanings. We''ve
    already seen the copyin and copyouts implicitly used by the compiler in the previous
    functions.


    # Data Clauses and Their Meanings


    | Clause | Behavior |

    | --- | --- |

    | copyin | Check if the listed variables are already present on the device, if
    not create space and copy the current data in the device copy |

    | copyout | Check if the listed variables are already present on the device, if
    not create space on the device and copy the resulting data of the device copy
    after the last use |

    | copy | Behaves like the variables appeared in both copyin and copyout data clause
    |

    | create | Check if the listed variables are already present on the device, if
    not create empty space on the device |

    | present | Assume that the listed variables are already present on the device
    |


    In order for the compiler to parallelize the loop nest in for my GPU, which requires
    the offloading of data, we''ll need to tell the compiler the shape of the three
    arrays used in the inner loop. All of these arrays are used only for reading,
    we can use a copy data clause, but we''ll need to tell the compiler the *shape*
    of the arrays, which we can learn by looking at how they are allocated in the
    `allocate_3_poison_function`, located in matrix.h. The data clauses accept a list
    of variables about the size and shape of variables. In C and C++ the size and
    shape of the arrays are provided using square brackets [ ] containing the starting
    index and number of elements to transfer, e.g., [0:100] to start copying at index
    0 and copy 100 elements of the array. In Fortran the syntax uses parentheses and
    the first and last index to copy, for instance (1:100) to start at index 1 and
    copy all elements up to 100 in the array. The difference between these programming
    languages is intentional to fit with the conventions of the base programming languages.
    Since Fortran variables are self-describing, the size and shape information can
    be left off if the entire variable needs to be moved to the device.'
