    Now, instead of using pinned memory as merely a staging area for transfers between
    the device and the host, one must instead choose to directly allocate host variables
    in pinned memory. Traditionally, this is done by allocating/deallocating host
    main memory with the cudaMalloc/cudaFreeHost routines of the CUDA API and subsequently
    pinning/unpinning the allocation by calling cudaHostRegister/cudaHostunregister.
    In the PGI-specific CUDA extension, however, the use of pinned memory may be enforced
    by applying the variable attribute on the allocatable tensor. Besides the of Calpha
    in pinned rather padded memory, no further changes are made with respect to the
    GPU-6 version of the code in the "GPU-6" section. However, some operating systems
    and installations restrict the availability, or size of page-locked memory, the
    allocation has been augmented by a third argument, which, if it fails makes the
    user aware that the allocation has defaulted to a regular allocation in padded
    memory.


