    # 11.3 PRIORITY OF THREAD


    The runtime environment executes threads based on their priority. A C.P.U. can
    execute only one thread at a time. Therefore, the threads that are ready for execution
    queue up processor time. Each thread gets a slice of time after which it goes
    back into the thread queue. The threads are scheduled using fixed-priority scheduling,
    which essentially executes the threads depending on their priority relative to
    one another. A thread with a priority that affects its position in the thread
    queue of the processor. A thread with higher priority runs before a thread with
    lower priority.


    If Java encounters another thread with higher-priority, the current thread pushed
    back with the higher priority is executed. A thread can voluntarily relinquish
    its position in the thread queue. This is done when the thread yields to another
    or it sleeps. The thread is pre-empted (pushed back in the queue) by another,
    if it is waiting for an input/output operation. A thread can also be pre-empted,
    when another thread of higher priority wakes up from sleep. The priority from
    the thread that created it. You can represent the priority of a thread by an integer
    in the range of 1 to 10. You can change the priority for a thread using the setPriority()
    method of the Thread class.


    # Syntax


    ```

    public final void setPriority(int newPriority);

    ```


    The argument newPriority can take any of the constants mentioned below:


    ```

    MIN_PRIORITY

    MAX_PRIORITY

    NORM_PRIORITY

    ```


    These constants are declared in the Thread class.


    ```

    MIN_PRIORITY has value - 1

    MAX_PRIORITY has value - 10

    NORM_PRIORITY has value - 5

    ```'
