    # 9.7 THE APPLET CONTEXT INTERCHANGE


    The Applet class does not have the capability to change the web page displayed
    by the browser. Applet context is a link to the browser and controls the browser
    environment in which the applet is displayed. Use getAppletContext() method to
    get the context of the applet.


    ```

    public AppletContext getAppletContext() ;

    ```


    Use the showStatus() to change the message that is displayed on the status bar
    of the browser.


    ```

    public void showStatus();

    ```


    Use the showDocument() method to change to another web page.


    ```

    public void showDocument (URL);

    ```


    The following program illustrates the use of these methods.


    ```

    import java.applet.Applet;

    import java.awt.*;

    import java.net.*;

    public class Demo extends Applet

    {

    public void init() {

    getAppletContext().showStatus("connecting to yahoo.com");\ntry {

    getAppletContext().showDocument(new URL("http:// www.yahoo.com"));

    }

    catch (MalformedURLException urlException) {

    getAppletContext().showStatus("Error connecting to URL");

    }

    }}

    ```


    Note:


    +   - URL stands for Uniform Resource Locator. A URL specifies the location of
    a web page.

    - The above program displays the www.yahoo.com web page when the applet is loaded.
    If the URL is not locatable, an error message is displayed on the status bar of
    the browser.

    - The java.net package has been imported since the URL class is used to specify
    the address of the web site. The constructor of the URL class throws an exception
    if the site is not found.'
