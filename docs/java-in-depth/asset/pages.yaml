  md: "# CHAPTER-5\n\n# CONSTRUCTORS, ACCESS SPECIFIERS\nAND MODIFIERS\n\n# 5.1 CONSTRUCTORS\n\
    \nSuppose you plan to present a Birthday cake to your elder sister on her birthday.\
    \ You order a chocolate cake from a baker. The baker asks for details like the\
    \ weight and the shape of the cake and the message you want to write on it. You\
    \ specify rules for these attributes. For example, weight = 2 pounds, shape =\
    \ square, and message = “Happy Birthday, Sister”. If the values of all these attributes\
    \ are not determined at the time of baking, the object would have some weight,\
    \ some shape, and the message “Happy Birthday, somebody”. But your sister would\
    \ not be flattered.\n\nThe concept of object-orientation is drawn from real life.\
    \ You need to initialize the value of certain data members when you create an\
    \ object. You could write a method, say initializeData() in a class and call this\
    \ method after creating the object. You could, write a code for initializing the\
    \ variables in the method initializeData(). Java solves this problem by providing\
    \ a special method known as constructor. But, how will you ensure that everybody\
    \ a constructor contains the code for initializing the data members of a class.\
    \ It is executed automatically when an object of the class is created. Therefore,\
    \ no matter who creates an object of the class, the constructor is invoked and\
    \ the data members are initialized. The constructor has the same name as that\
    \ of the class in which it is defined.\n\n# Example\n\n```\npublic class Cake{\n\
    \    String message;\n    double weight;\n    String shape;\n    Cake( )\n   \
    \ {\n        message = \"Happy Birthday, Sister\";\n        weight = 2;\n    \
    \    shape = \"Square\";\n    }\n}\n```"
