  md: '# CHAPTER-1


    # INTRODUCTION TO JAVA


    # 1.1 HISTORY OF JAVA


    Although the Java programming language is usually associated with the World Wide
    Web, it''s origin predates the web. Java began life as the programming language
    OaK.


    “Oak” was developed by the members of the Green project, which included Patrick
    Naughton, Mike Sheridan and James Gosling a group formed in 1991 to create Product
    for the smart electronics, consumer gadgets and other devices. The team decided
    that the existing programming languages were not well suited for use in consumer
    electronics. The chief programmer of Sun Microsystems, James Gosling, was given
    the task of creating the Software for controlling consumer electronic devices.
    The team wanted a fundamentally new way of computing, based on the power of networks
    and wanted the same, software to run on different kinds of computers. “Patenting
    issues gave a new name to Oak-Java.” During that period, Mosaic, the first graphical
    browser was released. Non programmers starting accessing the World Wide Web and
    Web grew dramatically. People with different types of machines and operating Systems
    would provide the required cross-platform independence that is, independence from
    the hardware, the network, and the operating System. Very soon, Java became an
    integral part of the web.


    Java Software works just everywhere, from the smallest devices to Super computers.
    Java technology components don''t depend on the kind of computer, telephone, or
    operating System they run on. They work on any kind of compatible devices that
    Supports the Java platform.


    # Java Version History


    The Fist Java Beta (jdk Beta) version released in 1995 and First Version (jdk
    1.0) released in 1996. Java is enhancing its functionality and latest version
    of java is jdk 1.8 released in 2014.


    # 1.2 FEATURES OF JAVA OR JAVA BUZZWORDS


    No discussion of Java can be done without the keywords. Although the fundamental
    forces that are necessary for Java are portability & Security; other factors also
    play an important role in molding the final form of the language. The features
    of Java or Buzzword are as follows:'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Java in Depth


    +   1. Simple

    Java is a simple language that can be easily learn, even if you have just starting
    programming. Best of all, if you are an experienced C++ programmer, moving to
    Java will require very little effort. Because Java inherits the C, C++ syntax
    and many of the object-oriented features of C++. Moreover unlike C++ in which
    the programmer handles memory manipulation, Java handles the required memory manipulation,
    and prevents errors that arise due to proper memory usage. Java also removes complexity
    like operator overloading and virtual functions.


    +   2. Object-oriented

    Java defines data as objects with methods that support Inheritance. It is purely
    object-oriented and provides abstraction, encapsulation, polymorphism. Even the
    most basic program has a class. Any code that you write in Java is inside a class.


    +   3. Distributed

    Java is tuned to the Web. Java programs can access data across the webs as easily
    as they access data from local system because Java handles TCP/IP protocols. It
    means accessing a resource using a URL is not much different from accessing a
    file. You can build distributed in Java that uses resources from any other networked
    computer.


    +   4. Interpreted

    Java is both interpreted and compiled. The code is compiled to a byte code, which
    is binary and platform independent. When the program has to be executed, the code
