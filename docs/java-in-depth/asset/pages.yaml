    # Which choice is better?


    In the above analogy, the soup is similar to an object and the spoon plays a role
    similar to that of the monitor of the objects.


    Let us look at another example in which the data produced by thread1 is consumed
    by thread2. Here thread1 is the producer and thread2 is the consumer. The consumer
    has to check every now and then whether it has the data to act upon. This is a
    huge waste of C.P.U time as the consumer occupies C.P.U. time to check whether
    or not the producer is ready with data.


    What if the producer could communicate to the consumer once it has finished producing
    the required data? The consumer would not use up C.P.U cycles just to check whether
    the producer has done its job. This communication between threads is called Inter
    - Thread communication.


    # Inter thread communication is achieved using four methods


    +   - wait()

    - notify()

    - notifyAll()

    - yield()


    All methods are declared final in the object class. They can only be called from
    synchronized method.


    # A) The wait() method


    The wait() method tells the current thread to give up the monitor and sleep until
    another thread calls the notify() method. You can use the wait() method to synchronize
    threads.


    # Syntax


    ```

    public final void wait( ) throws InterruptedException

    ```


    The wait() method makes the current thread wait until another thread invokes the
    notify() or notifyAll method of the current object.


    It is necessary for the current thread to own the monitor of the object.


    Note: (1) Both the wait() and sleep() delay the thread for the requested amount
    of time. If you use the wait() method, you can resume the thread with the notify()
    method. The same cannot be done when you use the sleep() method. This is crucial
    for the thread that it sleeps for minutes at a time.


    (2) The thread that is waiting may get control over the object''s monitor as soon
    as it is notified. There may be other threads that gain control over the monitor.


    # B) The notify method


    The notify() method wakes up a single thread that is waiting for the current monitor
    of the object. If multiple threads are waiting, one is chosen arbitrarily. The
    awakened thread is not able to proceed until the current thread releases the lock
    from the monitor. A thread that is the owner of the monitor of the object should
    call the method.'
