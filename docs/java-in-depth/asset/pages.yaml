  md: 'Null pointer exception: This exception is thrown when an application attempts
    to use null where an object is required. An object that has not been allocated
    memory holds the null value. The situations in which such an exception is thrown
    are:


    +   1 Using an object without allocating memory for it.

    2 Calling the methods of a null object.

    3 Accessing or modifying the attributes of a null object.

    4 Using the length of the null as if it is an array.


    Example:


    ```

    String s;

    s.length();

    /* generates null pointer exception as

    there is no string stored in s */

    ```


    Array store exception: This exception is thrown when you store an object in an
    array that is not permitted for the array type.


    Class cast exception: This exception is thrown when you try to cast an object
    to an invalid type. The object is neither of the class specified, nor it''s a
    sub or a super class of the class specified.


    Illegal Argument exception: This exception is thrown when you pass an argument
    to a method that does not correspond with the parameter type.


    Security Exception: This exception is thrown when your program performed an illegal
    operation. For instance, trying to read a file on the local machine from an applet.


    For all the other classes derived from the class Exception, the compiler will
    check that you have either handled the exception in the method, (where the exception
    may be thrown) or you have indicated that the method can throw an exception. If
    you do neither, your code won''t compile. These are called checked exceptions.


    # 10.3 EXCEPTION - HANDLING TECHNIQUES


    When an unexpected error occurs in a method, Java creates an object of the type
    Exception. After creating the Exception object, Java sends it to a program, by
    an action ‘throwing an exception’. The Exception object contains information about
    the type of error and the state of the program when the exception occurred. You
    need to handle the exception using an exception-handler and the process to handle
    the exception.


    You can implement exception-handling in your program by using the keywords:


    +   1 try

    2 catch

    3 throw

    4 throws

    5 finally'
