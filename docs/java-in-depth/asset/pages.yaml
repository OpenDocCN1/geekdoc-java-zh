  md: '# 14.6 CONTROLS IN JAVA


    # I) Button


    Buttons are components that can contain a label. It has an outline. The button
    is similar to a push button in any other GUI. Pushing a button causes the run
    time to generate an event. This event is sent to the program. The program in turn
    can detect the event and respond to it. Clicking a button generates an ActionEvent.


    However, before a button can be used, it has to be created. It can be created
    using the new keyword in association with the constructors that are defined for
    it.


    Buttons must be added to the containers before they can be used. This is done
    using the keyword add. Once the buttons have been created and added, they can
    be used.


    When a button is clicked, the AWT sends an instance of the ActionEvent to the
    button. The ActionEvent passes the action event to any action listeners that have
    registered an interest in action events generated by the button.


    | Constructor | Description |

    | Button() | Construct a button with no label. |

    | Button(String label) | Construct a button with a label specified. |


    | Method | Description |

    | addActionListener() | Adds the specified action listener to receive action events
    from the corresponding button. |

    | getCommand() | Returns the command name which the action event fires by the
    corresponding button. |

    | getLabel() | Returns the label of the corresponding button. |

    | paramString() | Returns the parameter string representing the state of the corresponding
    button. |

    | setLabel(String label) | Sets the label of the button to the value specified.
    |


    Example below contains two labels and two buttons: "OK" and "Cancel". Two labels
    are used to display the test of the buttons named – Button 1 and Button 2. The
    status bar indicates which button was clicked.


    Example :


    ```

    import java.awt.*;

    import java.applet.*;

    import java.awt.event.*;

    public class ButtonTest extends Frame {

    Label lbl = new Label("Button1"); };

    ```'
