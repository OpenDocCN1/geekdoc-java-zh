  md: "# Constructor Access Specifier and Modifier | 79\n\n# 5.7 MODIFIERS\n\nModifiers\
    \ determine how the data members and methods are used in other classes and objects.\n\
    \n# 5.7.1 The static modifier\n\nConsider a class student. You have created many\
    \ objects of the student class, and want to know how many objects you have created.\
    \ How would you do that? What you need here is a variable (counter) that is maintained\
    \ by the class itself and not by the individual objects. Every time an object\
    \ of the class is created, the constructor should increment the counter. Thus\
    \ the value of the counter would indicate the number of objects created. The static\
    \ modifier allows a variable or method to be associated with its class. You can\
    \ access a static variable or method using the class name as shown here.\n\nclass-\
    \ static variable;\n\nclass - static method();\n\n```\nclass StaticDemo2 {\n \
    \   static int counter = 0;\n    StaticDemo2( )\n    {\n        counter++;\n \
    \       System.out.println(counter);\n    }\nclass StaticDemo {\n    public static\
    \ void main(String[] args) {\n        // TODO Auto-generated method stub\n   \
    \     StaticDemo2 sd1 = new StaticDemo2( );\n        StaticDemo2 sd2 = new StaticDemo2();\n\
    \    }\n}}\n```\n\n# Output\n\n+   1\n2\n\nNote:\n\n+   1. A Static method and\
    \ a static variable can be accessed by the class name. You do not need to create\
    \ an object of the class to call a static method or variable. The variable and\
    \ methods declared using the static keyword are called static variable and class\
    \ methods respectively.\n2. You cannot access non-static data members from a static\
    \ method. Because non-static data members are instances variables (belong to individual\
    \ instances)."
