  md: 'the conditions that do not occur under normal conditions. In other words, the
    Error class is used for catastrophic failures as virtual machine Error. These
    classes are available in the Java.lang package.


    ![](img/170d6e8f69d81957cecd48ac340496ea_147_0.png)


    # Hierarchy of Exceptions


    The exceptions that are defined by the Error class and its subclasses are characterized
    by the fact that they all represent conditions that you are not expected to do
    anything about, so you are not expected to catch them.


    Error class has three direct sub classes:


    +   - Thread Death

    - Linkage Error

    - Virtual Machine Error


    **Thread Death:** This exception is thrown whenever an executing thread is deliberately
    stopped. It helps to destroy the thread properly.

    **Linkage Error:** This exception has sub classes that record, serious errors
    with the classes in your program.

    **Virtual Machine Error:** This class has four sub classes that specify exception
    that will be thrown when a catastrophic failure of the JVM happens.


    # Runtime Exception


    They are also **unchecked exception** because the object of these exceptions is
    made by JVM. They are used to signal problems in various packages in the Java
    language. The various runtime exceptions are:


    +   - **Arithmetic exception:** It arises when an attempt to divide an integer
    value by zero is made.

    - **Index out of Bound exception:** This exception is thrown when an attempt is
    made to access an array element beyond the index of the array. For instance, it
    is thrown when an array has ten elements and you try to access the eleventh element
    of the array.

    - **Negative Array size exception:** This exception is thrown when you try to
    define an array with a negative dimension.'
