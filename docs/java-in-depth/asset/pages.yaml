    # INHERITANCE


    The philosophy behind inheritance is to portray things as they exist in the real
    world. For instance, a child inherits properties from both of his/her parents.
    Inheritance means that a class derives a set of attributes and related behavior
    from a parent class. By using inheritance, you can create a general class that
    defines traits common to a set of related items, and this class can be inherited
    by other class. The super class represents the generalized properties and the
    sub class represents specialized properties.


    Super class is a class from which another class inherits properties. It shares
    its properties with its children classes. A sub class is a class that inherits
    attributes and methods from a super class. The concept of inheritance greatly
    enhances the ability to reuse code and make designing a simple and a cleaner process.


    To inherit any class “extends” keyword is used.


    # Example


    Let us take the example of Air tickets. Air tickets can be in two states: Request
    and Confirmed. Both these state of tickets have a lot of common attributes, such
    as as, flight number, date, time and destination. However, a confirmed ticket
    would also have a seat number, while a requested ticket would not have it.


    Generalization


    ![](img/170d6e8f69d81957cecd48ac340496ea_103_0.png)


    Specialization


    Fig : Explaining AirTicket Hierarchy'
