  md: '# Data Types and Variables |


    Each variable that is used in a program must be declared. That is to say, the
    program must contain a statement specifying precisely, what kind of information
    (type of data) the variable will contain. This applies to every variable used
    in the program, regardless of the type.


    To use the variable number for storing an integer value, the variable number,
    must be declared and it should be of the type int.


    Definition:- ‘A variable is defined by the combination of an identifier, a type
    and an optional initialization.’


    Note: All variables have a scope, which defines their visibility and a lifetime.


    # 2.5.1 Variable Naming conventions


    Certain rules and conventions govern the naming of variables. The rules are enforced
    by the programming language. Your program will not compile if you have not followed
    the rules of the language. Conventions help to improve the readability of the
    program, but following them is not mandatory.


    # 2.5.2 Rules for Naming Variables


    +   (1) The name of a variable needs to be meaningful, short and without any embedded
    space or symbol like !, @, #, %, &, (, ), [, ], ,, 1 "c/ and \. However, underscores
    cannot be used where a space is required. For example basic_Salary.


    +   (2) Variable names must be unique. For example, to store four different numbers,
    four unique variable names need to be used.


    +   (3) A variable name must begin with a letter, a dollar symbol ($) or underscore,
    which may be followed by a sequence of letters (A-Z, a-z) or digits (0-9), ''$'',
    or underscore.


    +   (4) Keywords cannot be used for variable names. For example, you cannot declare
    a variable switch.


    # 2.5.3 Variable Naming Conventions in Java


    +   (1) Variables names must be meaningful.


    +   (2) The names must reflect the data that the variables contain. For example,
    to store the age of an employee, the variable name could be emp_age.


    +   (3) Variable names are nouns and begin with a lowercase letter. Each word
    begins with an uppercase letter. However, the first word will start with a lowercase
    letter.


    +   (4) If a variable name contains two or more words; begin each word with an
    uppercase letter. However, the first word will start with a lowercase letter.


    # 2.5.4 Examples of Variables Names


    The following variable names are valid:


    +   (1) address


    +   (2) emp_age


    +   (3) employee_name


