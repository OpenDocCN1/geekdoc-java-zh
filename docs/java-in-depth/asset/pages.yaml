  md: '# 3.5 ARRAYS


    Have you ever noticed the hotel rooms are numbered in a linear manner? You find
    a row of rooms that have a continuous numbering pattern. Each room is recognized
    by its number. If you were to send a bouquet of flowers to your friend who stays
    in room 121, Hotel Regency, you would probably write the address as Room number
    121, Hotel Regency. In fact, any room would be addressed in a similar way. There
    are two parts to the address specified above:


    +   1. The Hotel Name

    2. The Room number


    An array is a representation of data in contiguous spaces in the memory of your
    computer. All the variables of an array have the same name just as all the rooms
    at Hotel Regency. The room number in the hotel is the index (or subscript) of
    the variables (elements) in the array. Each element in the array is distinguish
    by the index. All the elements in an array must be of the same data type. For
    example, you cannot have one of the int type and the boolean data type in the
    same array. More formally, an array is a collection of elements that are referenced
    by a common name.


    Each element of an array can be referred to by an array name and a subscript or
    an index. To create and use an array in Java, you need to first declare the array
    and then initialize it.


    # 3.5.1 One-Dimensional Arrays


    Single/one-Dimensional array is, essentially, a list of like typed variables.


    # Syntax


    To declare a single-dimensional array, the syntax is:


    +   (1) Data type [ ] variable_name;

    (2) Data type variable_name[ ];

    (3) Data type [ ] variable_name, variable_name;

    (4) Datatype... variable_name;


    Example:


    ```

    int i [];

    int [ ] i;

    int[] j;

    int...i;

    int i [|] j [];

    ```


    After declaring the variables for the array, the array needs to be created in
    the memory. This can be done by using the new operator in the following way:


    ```

    new int [10];

    i = new int [10];

    j = new int [10];

    ```


    This statement assigns ten contiguous memory locations of the int type to the
    variable i and j. The array can store ten elements. Initializing the array can
    be done using the for loop as given below:'
