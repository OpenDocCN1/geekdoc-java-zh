  md: "# 76 | Java in Depth\n\n+   2. The private access specifier\n3. The protected\
    \ access specifier\n4. The default access specifier\n\n# 5.5.1 The Public Access\
    \ Specifier\n\nAll classes except inner class (class with other class) can have\
    \ the public access specifier. You can use a public class, a data member, or a\
    \ method from any object in Java program.\n\nExample\n\n```\npublic class pubclass\n\
    {\n    public int variable;\n    public void public_method ()\n        //code......\n\
    \    }\n}\n```\n\n# 5.5.2 The Private Access Specifier\n\nOnly objects of the\
    \ same class can access a private variable or method. You can declare only variable,\
    \ method and inner classes as private.\n\nExample\n\n```\nprivate int privatevariable;\n\
    private void private-method () { //code...}\n```\n\n# 5.5.3 The Protected Access\
    \ Specifier\n\nVariables, methods and inner class that are declared protected\
    \ are accessible to the subclasses of the class in which they are declared.\n\n\
    Example\n\n```\nprotected int protvar;\n```\n\n# 5.5.4 Default Access\n\nIf you\
    \ do not specify any of the above access specifiers the scope is friday. A class,\
    \ a variable or a method that has a friendly access is accessible to all the classes\
    \ of a package (a package is a collection of classes).\n\nNote\n\n+   In Java,\
    \ friendly is not a keyword. It is a term that is used for the access level, when\
    \ no access specifier has been specified. You cannot declare a class, variable\
    \ or method with the friendly specifier."
