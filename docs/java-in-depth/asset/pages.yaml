  md: '# CHAPTER-12


    # STREAMS


    # 12.1 STREAMS IN JAVA


    All programs accept input from a user, process it and produce an output. Therefore,
    all programming languages support input and output operations. Java provides support
    for input and output through the classes of the Java.io Package. Java handles
    all input and output in the form of streams. A stream is a sequence of bytes travelling
    from a source to a destination over a communication path.


    If a program writes from a stream, it is the stream''s source. Similarly, if it
    is reading to a stream, it is a stream''s destination. Streams are powerful because
    they abstract the details of input/output (I/O) operations.


    The two basic streams are:


    +   (a) Input streams

    (b) Output streams


    Each stream has a particular functionality. You can only read from an Input stream
    and conversely, you can write to an Output stream.


    Note:


    +   1) Streams: Some streams read from or write to a specific place like a disk
    file or memory are called node streams. Types of node streams include files, memory
    and pipes.

    2) Filters: Some streams are used to read data from one stream and write it to
    another stream.


    ![](img/170d6e8f69d81957cecd48ac340496ea_182_0.png)'
