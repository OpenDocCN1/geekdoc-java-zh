  md: 'Java Soft created the JDBC-ODBC bridge that translates the JDBC-API to the
    ODBC.API. It is used with available ODBC drivers.


    # 17.3 Categories of JDBC drivers


    +   - JDBC-ODBC bridge + ODBC Driver

    - Native-API Driver (partly Java Driver)

    - Network Protocol Driver (Pure Java Driver)

    - Thin Driver


    JDBC-ODBC bridge + ODBC Driver. The JDBC-ODBC bridge driver uses ODBC driver to
    connect to the database. The JDBC-ODBC bridge driver converts JDBC method calls
    into the ODBC function calls. This is now discouraged because of thin driver.


    ![](img/170d6e8f69d81957cecd48ac340496ea_272_0.png)


    # JDBC Driver Manager


    The JDBC driver manager is the backbone of JDBC architecture. The function of
    the JDBC driver manager is to connect a Java application to the appropriate driver
    specified in your Java Program.


    # JDBC-ODBC Bridge


    As part of JDBC, sun Microsystems provides a driver to access ODBC data sources
    from JDBC. This driver is called the JDBC-ODBC bridge. The JDBC-ODBC bridge is
    implemented as the JDBC class and the native library is used to access the ODBC
    driver. In the windows platform, the native library is JDBC ODBCB.DIL.


    # Advantages


    +   - Easy to use

    - Can be easily connected to any database


    # Disadvantages


    +   - Performance is degraded because JDBC method call is converted into the ODBC
    function call.

    - The ODBC driver needs to be installed on the client machine.'
