    # Methods of Socket


    +   - InetAddress getInetAddress(): Returns the InetAddress associated with the

    socket object. It returns null if the socket is not connected.

    - getPort(): Returns the port to which the invoking socket object is

    connected. It returns 0 if the socket is not connected.

    - getLocalPort(): Returns the local port to which the invoking socket object

    is bound. It returns -1 if the socket is not connected.

    - InputStream getInputStream() throws IOException: It returns the input

    stream associated with the invoking socket.

    - OutputStream getOutputStream() throws IO Exception: It returns the

    output stream associated with the invoking socket.

    - connect(): It allows you to specify a new connection.

    - isConnected(): Returns true if the socket is connected to a server.

    - isBound(): Returns true if the socket is bound to an address.

    - isClosed(): Returns true if the socket is closed.


