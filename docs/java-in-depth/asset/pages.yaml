    \n# 11.2 SINGLE-THREADED AND MULTITHREADED APPLICATIONS\n\nA process that is made\
    \ up of only one thread is said to be single-threaded. A single -threaded application\
    \ can perform only one task at a time. You have to wait for one task to get completed\
    \ before another start.\n\n![](img/170d6e8f69d81957cecd48ac340496ea_161_1.png)\n\
    \nFor instance, we have three activities- read file, process and write file, which\
