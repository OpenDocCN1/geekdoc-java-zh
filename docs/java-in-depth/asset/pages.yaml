  md: '# CHAPTER-17


    # DATABASE CONNECTIVITY


    # 17.1 DATABASE MANAGEMENT ON THE WEB


    Most of the web-based application programs need to interact with Database Management
    Systems (DBMS). These DBMS are repositories of the information used by applications.
    For example, online shopping mall needs to keep track of its customers and the
    items sold. A search site like.yahoo.com needs to keep track of the URLs of the
    webpages visited by the user.


    This chapter explains the techniques of database programming using Java. You will
    also see how databases are accessed using the JDBC-ODBC bridge, ODBC drivers.


    # 17.1.1 Database Management


    A database is a collection of related information and a DBMS is a software that
    provides you with a mechanism to retrieve, modify and add data to the database.
    There are many DBMS/RDBMS products available, for example, MS-Access, MS-SQL Server,
    Oracle, Sybase, Informix Progress & Ingress. Each of these Relational Database
    Management Systems (RDBMS) stores data in its own form.


    For example, MS-Access stores data in the MDB file format, whereas MS-SQL stores
    data in the .DAT file format.


    Imagine you have been assigned to develop an application for a general store that
    allows a shop owner to maintain record of daily transactions. You will design
    the database, install MS-SQL server/Oracle on the shop owner’s machine and tell
    him to use it. It will be a good idea for you to develop a customized front-end
    application in which the client is given options to retrieve, and modify data
    at the touch of the key.


    To accomplish the above, you should have a mechanism of making the application
    work with the file format of the database, that is .MDB or .DAT files.


    # 17.2 DATABASE CONNECTIVITY


    For your application to communicate with the database, it needs to have the following
    information.


    +   - The location of the database.


    +   - The name of the database.'
