  md: '# 5.7.4 The Transient Modifier


    Objects can be written to files so that they can be saved for further use. You
    can use the transient modifier, if you do not want to store a certain data member
    into a file. The transient modifier is used only with data members. Transient
    variables cannot be final or static.


    # 5.7.5 The Synchronized Modifier


    The synchronized modifier is used in multithreaded programs. A thread is a unit
    of execution with a process. In a multithreaded program, you need to synchronize
    various threads. The synchronized keyword is covered in detail in later chapters.


    # 5.7.6 The Volatile Modifier


    The volatile modifier is used for variables that can be simultaneously modified
    by many threads. The compiler treats these data members in a special manner when
    they are updated.


    Note:


    +   Access specifiers determine the accessibility of data members from the objects
    of other classes. For example, a data member that is declared private cannot be
    accessed from an object of any other class.

    Modifiers determine how data members are used in other objects. For example, a
    data member that has been declared static as be accessed without the creation
    of an object of the class, to which the data member belongs.

    You cannot use two or more access – specifiers in a declaration. For example:

    ```public protected int var; // not allowed```


    # SUMMARY


    +   Constructors are special methods that are invoked automatically when you create
    an object of the class. Constructors have the same name as that of the class and
    do not return any value.

    Access specifiers determine which features of a class may be used by other classes.
    The access specifiers are:

    * public

    * private

    * protected

    If you do not specify any of the above access specifiers, the default access level
    is friendly.

    Modifiers determine the way data members and methods are used in other classes
    and objects. The modifiers in Java are:

    * static

    * final

    * native

    * transient

    * synchronized

    * volatile'
