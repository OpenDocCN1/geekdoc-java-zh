  md: '# 258 | Java in Depth


    # II) Native-API Driver


    The native API driver uses the client side libraries of the database. The driver
    converts JDBC method calls into native calls of the database API. It is not written
    entirely in Java.


    Advantage


    +   - Performance is better than JDBC-ODBC bridge driver.


    Disadvantages


    +   - The Native driver needs to be installed on each and every client machine.

    - The vendor client library needs to be installed on client machine.


    # III) Network Protocol driver


    It uses middleware (application server) that converts JDBC calls directly or indirectly
    to the vendor-specific database protocol. It is fully written in Java.


    Advantage


    +   - No client side library is required.


    Disadvantages


    +   - Network support is required

    - Requires database-specific coding in the middle tier.

    - Maintenance of Network Protocol becomes costly because it requires database
    specific coding


    # IV) Thin Driver


    Thin driver converts JDBC calls directly into the vendor-specific database protocol.
    That is why it is known as thin driver. It is fully written in Java.


    Advantages


    +   - Better Performance than all other drivers.

    - No Software is required at the client side or the server side.


    Disadvantage


    +   - Depend on the database.


    # 17.4 QUERING A DATABASE


    Now that you have understood the JDBC architecture, you can write a Java application
    that is capable of working with a database. In this section, you will learn about
    packages and classes available in Java that allow you to send queries to a database
    and process the query results.


    # 17.4.1 Connecting to A Database


    The java.sql package contains the classes that help in connecting to a database,
    sending embedded SQL statements to the database and processing the query results.'
