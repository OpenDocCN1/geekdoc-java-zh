    # 6.8 ABSTRACT CLASS


    You cannot model the objects of the world in the same manner. In fact, most of
    the real world classes are too abstract to exist by themselves. Consider the following
    hierarchy:


    ![](img/170d6e8f69d81957cecd48ac340496ea_109_0.png)


    Fig . Hierarchy of Classes


    If you were asked to describe a rectangle, you would describe the number of sides
    it has, its length, width and area. You would have a similar description for a
    hexagon and a circle.


    How would you describe a shape? Does it exist? A shape is an abstract concept
    or an abstract class. You will come across many abstract classes. For Instance,
    automobiles and mammals have abstract classes.


    Abstract classes allow the implementation of a behavior in different ways. The
    classes and methods declared using the abstract modifier are incomplete. They
    are deliberately left incomplete. The implementation is in subclasses. Abstract
    classes can have abstract methods only. A class which has an abstract method must
    be declared as abstract.


    Restrictions


    +   1. An abstract class cannot be instantiated because the class is incomplete.

    2. Subclasses must override the abstract methods of the super class.

    3. The Java compiler force you to declare a class as when:

    a) A class has one or more abstract methods

    b) A class inherits an abstract method and had not override it.


    Note: The abstract modifier is opposite of final modifier.


    +   1. A final class can never be declared as abstract.

    2. An abstract class must have a subclass, whereas a final class cannot be sub-classed.

    3. You cannot use the final and abstract modifier for the same class, method or
    data member.'
