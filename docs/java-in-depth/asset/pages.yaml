    cannot, therefore, be accessed in the program. marked. At the end of the trace,
    all unmarked Objects that are reachable are unmarked objects can be garbage collected.
    This is known as mark-and-sweep algorithm that marks all the referenced objects.
    The sweep phase garbage collects the memory of unreferenced objects.


    +   (c) Compacting Collectors

    These collectors reduce fragmentation of memory by moving all the free space to
    one side during garbage collection. The free memory is then available as one huge
    space. All references to the shifted objects are then updated to refer to the
    new memory locations.


    +   (d) Adaptive Collectors

    This algorithm makes use of the fact that different garbage collection algorithms
    work better in different situations. The adaptive algorithm monitors the situation
    and uses the garbage technique that best suits that situation.


    # 2. De-allocate the memory of garbage objects and make it available to the program.


    ```

    finalize() Method

    ```


    Before freeing the memory associated with one object, the garbage collector runs
    the finalize() method of objects. You can declare the finalize() method in any
    class. The finalize() method is declared as follows.


    ```

    protected void finalize() throws Throwableable

    {

    Super finalize();

    }

    ```


    The garbage collector checks all the dereferred objects for the finalize() method.
    After executing the method, the garbage collector frees the memory associated
    with the objects.


    The garbage collection algorithm executes whenever there is no memory available
    for objects. It may also run when the system is idle for a long time. You can
    call the garbage collector manually using the System.gc() method. Since the garbage
    collection thread has a very low priority, it is interrupted frequently. Sometimes
    it is possible that the memory is not de-allocated until the program ends.


