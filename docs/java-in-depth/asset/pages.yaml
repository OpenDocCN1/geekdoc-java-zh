  md: '# Networking | 189


    telnet for remote login, File Transfer Protocol (FTP) for transferring file across
    the network, etc. Each service is associated with a port. A port is a numeric
    address through which a service request such as a request for a webpage is processed.


    The TCP protocol requires two data items:


    +   - The IP address

    - The port number


    So, how is it possible when you type http://www.Yahoo.com, you get to yahoo’s
    home page?


    The Internet Protocol (IP) provides every network device with a logical address
    an IP address. The IP address provided by the internet protocol has a specific
    structure. It is a 32 bit represented as a series of four 8-bit numbers (octet),
    which range in value from 0 to 255, out of which the last octet forms the port
    number.


    If the port number is not specified, the server’s port in the services file is
    used. Every protocol has a default port number, which is used if the port number
    is not specified.


    | Port number | Application |

    |---|---|n| 21 | FTP (transfer a file) |

    | 23 | Telnet (provides remote login) |

    | 25 | SMTP (deliver mail messages) |

    | 67 | BOOT ( provides configuration at Boot time) |

    | 80 | HTTP (transfer a web page) |


    Let’s look at the URL http://www.yahoo.com

    The first part of the URL (http) means that you are using the hyper text transmission
    protocol (http), the protocol for handling web documents having port number 80.
    If a file is not specified, most servers are configured to fetch the file index.html.
    Therefore the IP address and the port are determined either by explicit specification
    of all the parts of the URL or by using the default.


