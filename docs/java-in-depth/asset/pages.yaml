    about the current font and changing the font. It also provides methods to get
    and set the foreground and the background color. The foreground color is used
    for the text displayed in the components as well as for any custom drawing that
    the components executes. The background color is the color behind the text.

    4. Image-Handling: The Component class provides an implementation of the Observer
    interface and defines methods to help components display images.

    5. On Size and Position Control: The size and position of all the components are
    subject to the requirements specified by the LayoutManager class. Nevertheless
    every component can determine its size, if not its position. The Component class
    provides methods to resize and position the components. It also provides methods
    that allow components to report their preferred and minimum sizes. Further, it
    provides methods that return information about the size and location of a component.


