  md: '# CHAPTER 16


    # EVENT HANDLING


    # 16.1 EVENTS


    You are leaving for work in the morning, and the telephone rings......

    That''s an event !


    In life, you encounter events that force you to suspend other activities and respond
    to them immediately. In Java, events represents all the activities that goes on
    between the application and its user. When the user interacts with a program (say,
    by clicking on a command button), the system creates an event representing the
    action and delegates it to the event-handling code within the program. This code
    determines how to handle the event that the user gets the appropriate response.


    This chapter explains event-driven programming, the event model of Java and the
    different ways in which you can handle events.


    # 16.2 EVENT-DRIVEN PROGRAMMING


    Event handling is essential to GUI programming. The program waits for a user to
    perform some action. The user controls the sequence of operations that the application
    executes through a GUI. This approach is called event-driven programming.


