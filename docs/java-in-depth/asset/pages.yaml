  md: '# CHAPTER-15


    # LAYOUTS


    # 15.1 LAYOUT MANAGERS


    Layout managers are special objects that determines how the components of a container
    are organized. When you create a container, java automatically creates and assigns
    a default layout manager. The default layout manager manages and determines the
    placing of the controls in the Applet''s or any Container''s display. You can
    create different types of layout managers in order to control how your applet
    or frame looks.


    # Default Layouts of Container


    | Container | Layout |

    | Panel | Flow layout |

    | Applet | Flow layout |

    | Frame | Border layout |


    The list of the commonly used layout managers in Java is given below:


    +   1. java.awt.FlowLayout

    2. java.awt.GridLayout

    3. java.awt.BorderLayout

    4. java.awt.CardLayout

    5. java.awt.GridBagLayout

    6. javax.swing.BoxLayout


    These classes have been extended from the super class Object.


    ![](img/170d6e8f69d81957cecd48ac340496ea_242_0.png)


    # 15.1.1 The Flow Layout Manager


    The default manager for an applet is the Flow Layout Manager. It places control
    in the order in which they are added one after the other in horizontal rows. When
    the layout manager reaches the right border of the applet, it begins placing controls
    on the next rows. In its default state, the flow layout manager centers controls
    on each row.'
