    # 2. The Dialog Class


    Dialogs are pop-up windows that are used to accept input from the user. There
    are two kinds of dialog boxes model and modelless. Unlike a modelless dialog box,
    a model dialog box does not allow a user to interact with other windows while
    it is displayed. A dialog must be owned by a frame or an another dialog. You cannot
    directly attach a dialog to an applet. You can attach a dialog to a frame.


    When you create a dialog box, you can specify whether you want a model or modelless
    dialog box. You cannot change the “modality” of the dialog box after creating
    it. Use the Dialog class for creating dialog boxes. This class offers overloaded
    constructors.


    # Constructors


    The following constructors create a dialog box that has another dialog box.


    +   Dialog(Dialog owner): Constructs an initially invisible, modelless Dialog
    with the specified owner Dialog and an empty title.


    +   Dialog(Dialog owner, String title): Constructs an initially invisible, modelless
    Dialog with the specified owner Dialog and a title.


    +   Dialog(Dialog owner, String title, boolean modal): Constructs an initially
    invisible Dialog with the specified owner Dialog, a title, and the modality.


    The following constructors create dialog box that has a Frame.


    +   Dialog(Frame owner): Constructs an initially invisible, modelless Dialog with
    the specified owner Frame and an empty title.


    +   Dialog(Frame owner, boolean modal): Constructs an initially invisible Dialog
    with the specified owner Frame and modality and an empty title.


    +   Dialog(Frame owner, String title, boolean modal): Constructs an initially
    invisible Dialog with the specified owner Frame, title and modality.


    The single argument constructor creates a model dialog box without a title. The
    second argument that may be passed to the dialog box constructor is the title
    of the dialog box. To create a model dialog, use the three-argument constructor
    as shown below:


    ```

    Dialog dialog = new Dialog(frame, "Title of dialog", true);

    ```'
