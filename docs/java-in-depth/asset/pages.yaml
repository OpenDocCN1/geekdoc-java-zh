    \ marked annotation is retained by the compiler at compile time, but is ignored\
    \ by the Java Virtual Machine (JVM).\n    - RetentionPolicy.RUNTIME – The marked\
    \ annotation is retained by the JVM can be used by the runtime environment.\n\n\
    +   2. @Documented: @Documented annotation indicates that whenever the specified\
    \ annotation is used, the elements should be documented using the Javadoc tool.\n\
    3. @Target: @Target marks another annotation to restrict what kind of Java elements\
    \ the annotation can be applied to. A target annotation specifies one of the following\
    \ element type as its value:\n    - ElementType.ANNOTATION_TYPE can be applied\
    \ to an annotation type.\n    - ElementType.CONSTRUCTOR can be applied to a constructor.\n\
    \    - ElementType.FIELD can be applied to a field or a property.\n    - ElementType.LOCAL_VARIABLE\
    \ can be applied to a local variable.\n    - ElementType.METHOD can be applied\
    \ to a method-level annotation.\n    - ElementType.PACKAGE can be applied to a\
    \ package declaration.\n    - ElementType.PARAMETER can be applied to the parameters\
    \ of a method.\n    - ElementType.TYPE can be applied to any element of a class.\n\
    \n+   4. @Inherited @Inherited annotation indicates that the annotation type can\
    \ be inherited from the super class. This is not true by default. When the user\
