  md: '# Java in Depth


    Note: (1) To convert a positive binary number to a negative one, toggle all the
    bits except the rightmost bit that start with a value of 1.


    For example: The decimal value 10 represents as 000010110. The rightmost bits
    that start with 1 are in bold. These bits will not be toggled. Therefore -10 will
    be represented in binary as 111010110.


    The result of -10 >> 2 is 3, which is represented as:


    | 1 | 1 | 1 | 1 | 1 | 0 | 1 |


    The result of -10<< 2 is 40 which is represented as:


    | 1 | 0 | 0 | 1 | 1 | 0 | 0 | 0 |


    # USING THE UNSIGNED SHIFT


    The unsigned shift operator shifts all the bits to the right and initializes the
    unused bits to 0, irrespective of whether the number is positive or negative.

    Therefore, 10 >>> 2 gives 2


    | 0 | 0 | 0 | 0 | 0 | 1 | 0 |


    And -10>>> 2 gives a large number 1073741821.

    The complete 4-byte representation is shown below:


    ```

    00111111 11111111 11111111 11111101

    ```


    To summarize:


    +   * The << operator shifts the bits to the left

    * The >> operator shifts the bits to the right

    * The >>> operator performs an unsigned right shift. 0''s are introduced in the
    most significant bits.


    Note: The leftmost bit is known as the most significant bit and the rightmost
    bit is known as the least significant bit.


    # 3.1.6 Bit-wise Operators


    | Operator | Description | Example | Explanation |

    | & (AND) | Evaluates to a binary value after a bit-wise AND on the operands |
    x & y | AND results in 1 if both the bits are 1. Any other combination to 0. |

    | | (OR) | Evaluates to a binary value after a bit-wise OR on the two operands
    | x |y | OR results in 0 when both bits are 0. Any other combination to 1. |

    | XOR | Evaluates to a binary value after a bit-wise XOR on the two operands |
    x XOR y | XOR results in 0, if both the bits are of the same value and 1 if the
    bits have different values. |'
