  md: '# CHAPTER-13


    # NETWORKING


    # 13.1 INTRODUCTION TO NETWORKING


    Consider a scenario from restaurant as an analogy. In a restaurant you are offered
    a variety of exotic food on the menu. You decided to order for a pizza. A few
    minutes later, you are munching a hot pizza topped with melted cheese and everything
    else you wanted on it. The catch is that you neither know nor want to know, as
    to where the waiter got the pizza from, what went into its making or how the ingredients
    were obtained.


    The entities involved in the above example are - the delicious pizza, the waiter
    who took your order, the kitchen where the pizza was made, and of course, you.
    were the customer or client who ordered the pizza. There was a process of creating
    the pizza which was encapsulated from you. Your request was processed in the kitchen,
    the pizza was created and it was served by the waiter.


    Here customer is the client who request or order to the server i.e. waiter. The
    server processes the request of the client. Client or customer does not want to
    know what the process to complete the request. What client need is response. The
    communication between the client and server is an important constituent in client/server
    model, and is usually connected through a network.


    ![](img/170d6e8f69d81957cecd48ac340496ea_202_0.png)


    The server and the client are not necessarily hardware components. They can be
    programs working on the same machine or on different machines.


    When computers communicate they need to follow certain rules too. Data is sent
    from one machine to another in the form of packets. Rule governs packaging of
    the data into packets, speed of transmission and recreation of data to its original
    form. These rules are called network protocols. Some examples of network protocols
    are TCP/IP, UDP, APPLE TALK and NETBEUI.'
