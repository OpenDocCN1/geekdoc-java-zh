    # # 9.2 LIFE CYCLE OF AN APPLET


    You can describe the life cycle of an applet through four methods. These methods
    are;


    +   * The init() method.

    * The start() method.

    * The stop() method.

    * The destroy() method.


    # # The init() Method


    The init() method is called when the first time an applet is loaded into the memory
    of a computer. You can initialize variables and add components like buttons and
    check boxes to the applet in the init() method.


    # # The start() Method


    The start() method is called immediately after the init() method and every time
    the applet receives a focus as a result of scrolling in the active window. You
    can use this method when you want to restart a process or every time the applet
    receives the focus.


    # # The stop() Method


    The stop() method is called every time the applet looses the focus. You can use
    this method to reset variables and stop the threads that are running.


    # # The destroy() Method


    The destroy() method is called by the browser when the user moves to another page.
    You can use this method to perform clean-up operations like closing a file.'
