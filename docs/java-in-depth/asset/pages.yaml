  md: '# 10 | Java in Depth


    # 1.9 GARBAGE COLLECTION


    You can allocate memory to an object or array using the new operator you cannot,
    however, release the memory explicitly through code. Garbage collection is the
    process that automatically frees the memory of objects that are no in use. There
    are no specifications for technique for garbage collection. The implementation
    has been left to vendors. When the program stops referencing an object, the object
    is not required anymore and becomes garbage. The space that is used by the object
    can be released and used for another object. In C, C++ and Pascal, the programmer
    has to release the memory allocated to the objects. Problems are faced by programmers
    who forget to free the memory that has been allocated (or reallocated the memory
    of an object that is already in use. Garbage collection frees a programmer from
    the burden of freeing allocated memory. The garbage collector determines the objects
    that are not more referenced in the program. One problem that arise as a result
    of allocation and de-allocation of memory is fragmentation. Fragmentation slows
    down the program. Therefore, in addition to freeing unreferenced memory, the garbage
    collection limits the fragmentation of memory also. As a garbage collector has
    keep track of the memory allocated to objects and the objects being referenced;
    the overhead can affect the performance of the program.


    # 1.9.1 Garbage Collection Algorithm


    The garbage collector must do two things:


    +   (1) Detect garbage objects

    (2) De-allocate the memory of garbage objects and make it available to the program.


    # 1. Detecting Garbage Objects


    The different approaches for detecting garbage objects are discussed below.


    +   (a) Reference – Counting collectors

    Reference – Counting garbage collectors keep a count of the reference for each
    live object. When an object is created, the reference count of the object is set
    to one. When you refer the reference object count of the object is incremented
    by one. Similarly, when a reference to the object goes out of scope, the reference
    count is decremented by one. An object that has a reference count of zero and
    is not referenced in the program, is a garbage object. When the object is garbage
    collected, the reference counts of all the objects that it refers to are also
    decremented. Therefore, garbage collection of one object can lead to creation
    of small parts with more garbage objects. This method can be executed in small
    parts with the program, and the program need not be interrupted for a long time.
    However, there is an overhead of increment and decrement of the counters every
    time.


    +   (b) Tracing Collectors

    In this technique, a stack of roots is defined from where the objects are traced.
    An object is reachable if there are not reachable are considered garbage objects
    since they are not referenced and'
