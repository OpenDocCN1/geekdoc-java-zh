  md: "# 4.3 CREATING AN OBJECT\n\nAn object is an instance of a class. Declaring\
    \ an object is similar to declaring a variable\n\n# Syntax\n\n<class-name> <object>;\n\
    \n# Example\n\nCamera Kodak_36;\n\nYou must allocate memory to objects before\
    \ you use them. This is done using the new operator.\nKodak_36 = new Camera (\
    \ );\n\n# 4.3.1 Dynamic allocation of memory through new operator\n\nWhen we allocate\
    \ memory through new operator, we are allocating memory for an object during run-time.\
    \ As memory is finite, it is possible that new will not be able to allocate memory\
    \ for an object because of insufficient memory. If this happens, runtime exception\
    \ will occur and object reference variables will act differently than you might\
    \ expect, when an assignment takes place\n\nClass-var = new class-name ( );\n\n\
    # For example\n\n```\nclass Second\n{\n    int breadth = 2;\n    int length =\
    \ 3;\n    public static void main (String a [ ])\n{\n    Second d1 = new Second\
    \ ( ) ;\n    Second d2 = d1;\n}\n```\n\nYou might think that d2 is being assigned\
    \ a reference to a copy of the object referred by d1. You might think that d1\
    \ and d2 refer to separate and distinct objects. However this would be wrong.\
    \ After this fragment gets executed, d1 and d2 will both refer to the same object.\
    \ The assignment of d1 and d2 did not allocate any memory or copy part of the\
    \ original object. It makes d2 refer to the same object as does d1. Thus, any\
    \ changes made to the object through d2 will affect the object being referred\
    \ by d1, as they are the same object."
