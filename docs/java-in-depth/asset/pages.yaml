    # Wumpus!


    Wumpus is a text-based game, where a player moves through a cave system searching
    for gold and trying to avoid bottomless pits and a feared Wumpus. The cave system
    is a 4 x 4 grid. Each grid element can hold one GameItem. A GameItem is one of:
    Gold, Pit, Wumpus or ClearGround.


    The player can move forward, backward, left or right one grid element at a time.
    The cave system wraps around so, for example, moving left from position [3][0]
    causes the player to appear in position [3][3].


    The player can sense, but not see, what is in the immediate grid elements around
    the player. A pit will be sensed as a breeze, gold as a glitter and the Wumpus
    as a vile smell. In this assignment, the grid will be displayed, but in a real
    game this feature would be disabled. If the player moves onto a pit or the Wumpus,
    the player dies and the game ends. If the player moves onto gold, the game score
    increases by one and the gold is replaced by ClearGround.


    # Implementation:


    You should write a Game class, which has a 2D array of size 4 x 4 of GameItem
    board for implementing the Wumpus game described above.


    Classes Gold, Pit, Wumpus and ClearGround are extensions of GameItem. GameItem
    provides a public instance variable for specifying the displayed character. Character
    is displayed as ''g'', a Pit as ''p'', the Wumpus as ''W'', clear ground as ''.''.
    GameItem provides a constructor GameItem(char c) for specifying the displayed
    character. It should not be possible to instantiate an object of GameItem. The
    player is not implemented as an object, just being represented by Game as private
    row & column coordinates. The position of the player is displayed by a ''*''.
    The items are positioned randomly over board. There is exactly one Wumpus, at
    least, and up to three pieces of gold (chosen randomly) and exactly three pits.
    The player is positioned over a ClearGround position.


    # Game should provide:


    +   * a private method setBoard(), which instantiates objects on the board

    * a private method display() which will display the board.

    * a private method senseNearby(int), which displays text about what the player
    can sense from the board elements immediately surrounding the player.

    * a private method menu() which will provide a menu asking the user to make a
    choice from the following and output the user input:


    ====Wumpus===


    +   1. Move player left

    2. Move player right'
