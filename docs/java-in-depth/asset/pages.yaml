  md: '# 188 | Java in Depth


    Java provides a rich library of network-enabled classes that allow applications
    to readily access network resources. There are two tools available in Java for
    communication. These include datagram that use user datagram Portocol (UDP) and
    sockets that use transmission control protocol or Internet Protocol(TCP/IP).


    A datagram packet is an array of bytes, sent from one program (sending program)
    to another (receiving program). As datagram UDP, there is no guarantee that the
    data packet will reach its destination. Datagram are not reliable and are therefore
    used only when there is little data to be transmitted and there is not much distance
    between the sender and the receiver. If the network traffic is high, there is
    a chance of the datagram packets being lost at receiving end while handling multiple
    requests from other programs.


    Sockets on the other hand use TCP/IP for communication. The advantage of the socket
    model over other communication models is that the server is not affected by the
    source of client request and it accepts all requests, as long as the clients TCP/IP
    protocols. This means that the client can be any kind of computer. No longer is
    the client restricted to UNIX, Windows or Macintosh platforms. Therefore, all
    the computers in a network implementing TCP/IP can communicate with each other
    through sockets.


    # 13.2 UNDERSTANDING THE SOCKET


    In client/server applications, the server provides services like handling queries
    of database or modifying data in the database. The communication that occurs between
    the client and the server must be reliable. There should be no loss of data and
    must be available to the client in the same sequence in which the server has sent
    it.


    TCP provides a reliable bidirectional, persistent point-to-point communication
    channel. To communicate over TCP, client and server programs establish a connection
    and bind a socket. Sockets are used to handle communication links between applications
    over the network.


    Java was designed as the networking language. It makes network programming easier
    by encapsulating connection functionality in the Socket class to create a client
    socket and the Server class to create a server socket. The different classes are
    outlined below.


    Socket is the basic class, which supports the TCP protocol. TCP is a reliable
    stream network connection protocol. This class provides methods for stream I/O,
    which makes reading from and writing to a socket easy. This class is indispensable
    for the programs written to communicate on the internet. The package that provides
    Socket class, which implements client side of the connection is java.net.


    ServerSocket is a class used by server programs for listening to client request
    server. Socket does not actually perform the service; instead, it creates a socket
    object on behalf of the client. The communication is performed through the object
    created.


    # 13.3 IP ADDRESS AND PORT


    An internet server can be thought of as a set of socket classes that provide additional
    capabilities, generally called services. Some examples of services are electronic
    mail,'
