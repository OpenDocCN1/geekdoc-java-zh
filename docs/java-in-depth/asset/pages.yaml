  md: "# 4.10 SCOPE OF VARIABLES\n\nVariables can be defined with in a class, a method\
    \ or a block. A block is defined as a set of statements between two curly braces\
    \ - { }.\n\n# Local Scope\n\nVariables that are declared in a method or a block\
    \ are called local variables, as they cannot be accessed outside the method or\
    \ block in which they are declared. They are also defined as automatic or auto\
    \ variables. Local variables are created and initialized every time the method\
    \ is invoked. The variables are destroyed when the method or the block completes\
    \ execution. Parameters of a method are also local to the method.\n\n# Class Scope\n\
    \nVariables declared outside the methods have a class scope. The variable and\
    \ its value is retained as long as an object of the particular class exists, and\
    \ can be used in all the methods of the class. If the variable is declared public,\
    \ then the variable can be accessed from the objects of all the classes.\n\nEg:\n\
    \n```\nclass Scope{\n    public int classscopevariable1;\n    private int classscopevariable2;\n\
    \    public void method1 (char local_variable)\n    {\n        int local_variable2\
    \ = 0;\n        if (local_variable = 'a'){\n            boolean n = true;\n  \
    \      }\n        /* cannot use the variable 'n' outside the if\nconstruct as\
    \ it is local to the block. */\n        public void method2() {\n            /**\
    \ can access only classscopevariable1 and\n            classscopevariable2*/\n\
    \        }\n}\n```\n\n# SUMMARY\n\n+   1. The syntax for declaring a class is\n\
    \   [<access-specifier>] [<modifier>]class<class_name>\n   {\n2. Memory is allocated\
    \ to objects by using the new operator.\n3. Comment entries and identifications\
    \ make the program readable."
