  md: '# 9.8 CREATING AN APPLICATION


    All applets must extend from the Applet class. Unlike Applets, applications need
    not be extended from any class. An application does not require a browser for
    execution.

    An applications starts with the main ( ) method. The prototype of the method is
    as follows:


    ```

    public static void main (String args[]) {

    }

    ```


    The keywords public and static can be interchanged in the declaration of the method.
    Use javac to compile a java application and java to execute it.


    # Passing Parameters to an Application


    You can pass parameters to an application when you execute it.

    The parameters you send are received as strings. The following code displays the
    parameters received by an application.


    ```

    public class ParameterApplication {

    public static void main(String args [ ]) {

    for (int x = 0; x < args.length; x++) {

    System.out.println("parameter number " + x + " is="+ args[x]);

    }

    }

    ```


    Execute the application with the following command:


    ```

    java ParameterApplication sending five words as parameters

    ```


    # Output


    | parameter number0is =sending

    parameter number1is =five

    parameter number2is =words

    parameter number3is =as

    parameter number4is =parameters |


    The application will throw an exception "Array index out of Bounds", if you will
    try to use the array elements when no parameters have been passed. In the program
    given above, this situation has been avoided by checking length of the array.


    # Limitation of the main() Method


    The main() method is static. Therefore, it can access the non-static members of
    the class through an object of the class only.'
