  md: '# Collection | 273


    Methods of Collection interface is applicable for all the implementations as Collection
    is the parent for all classes/interfaces.


    # 18.4 METHODS OF COLLECTION


    +   - public boolean add(Object element): is used to insert an element in this
    collection.

    - public boolean addAll(Collection c): is used to insert the specified collection
    elements in the invoking collection.

    - public boolean remove(Object element): is used to delete an element from this
    collection.

    - public boolean removeAll(Collection c): is used to delete all the elements of
    the specified collection from the invoking collection.

    - public boolean retainAll(Collection c): is used to delete all the elements of
    invoking collection except the specified collection.

    - public int size(): return the total number of elements in the collection.

    - public void clear(): removes the total number of elements in the collection.

    - public boolean contains(Object element): is used to search an element.

    - public boolean containsAll(Collection c): is used to search the specified collection
    in this collection.

    - public Iterator iterator(): returns an iterator.

    - public Object[] toArray(): converts collection into array.

    - public boolean isEmpty(): checks if collection is empty.

    - public boolean equals(Object element): matches two collection.

    - public int hashCode(): returns the hashcode number for collection.


    # 18.5 ITERATOR INTERFACE


    Iterator interface provides the facility of iterating the elements in forward
    direction only.


    # Methods of Iterator interface


    There are three methods in the Iterator interface. They are:


    +   - public boolean hasNext(): it returns true if iterator has elements.

    - public Object next(): it returns the element and moves the cursor pointer to
    the next element.

    - public void remove(): it removes the last elements returned by the iterator.
    It is rarely used.


    # 18.6 LIST INTERFACE


    A List cares about index. The one that List has that non list do, is a set of
    methods related to the index. Those key methods include things like get(int index),
    indexOf(Object o), add(int index, object obj) and so on.'
