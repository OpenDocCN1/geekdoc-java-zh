    # 3.1 OPERATORS


    Operators are used to compute and compare values, and test multiple conditions.
    They are divided into following groups:


    +   (1) Arithmetic operators

    (2) Assignment operators

    (3) Unary operators

    (4) Comparison operators

    (5) Shift operators

    (6) Bit-wise operators

    (7) Logical operators

    (8) Conditional operator

    (9) The new operator

    (10) instanceOf


    # 3.1.1 Arithmetic Operators


    | Operator | Description | Examples | Explanation |

    | --- | --- | --- | --- |

    | + | Adds the operands | x = y + z | Add the value of y and z stores the result
    in x |

    | - | Subtracts the right operand from the left operand | x = y - z | Subtract
    from y and stores the result in x |

    | x | Multiplies the operands | x = y * 3 | Multiplies the value of y with 3 and
    stores the result in x |

    | / | Divides the left operand by the right operand | x = y/z | Divides by y and
    z stores the result in x |

    | % | Calculates the remainder of an integer division | x = y % z | Divides by
    y and z stores the remainder in x |


    # The + Operator with Numeric Data Types


    When you add two operands of the primitive numeric data type, the result is primitive
    numeric data type.'
