    \ | Write-1 | Read Block-2 | Process-2 | Write-2 |\n\nA single-threaded process\n\
    \nA process having more than one thread is said to be multithreaded. It is a group\
    \ of processes that runs at the same time, perform different tasks, and interact\
    \ with each other."
