    www. Instituteoflearning.in and a port number 8080 which is the port of a server.
    If the server is up and running, the code creates a new socket instance and continues
    running. If the server encounters a problem while connecting, it throws an exception.


    To discontinue from the server, use the close() method.


    ```

    Socketconnection close();

    ```'
