  md: '# Operator, Loop, Statement & Arrays | 39


    The code would seem to be fine since all the variable are of the same type.

    However the compiler returns an error. Let us see why it does this.


    When you see the ''+'' operator with numeric data, the resulting value is at least
    an int.

    Therefore the expression on the right evaluates to an int.


    You will have either declare z as an int or an explicit typecast. The solution
    can be


    z=(short)(x+y);

    Note: When youcast to a lower data type, you may lose some data. Always check
    the result of such a typecast.


    # Rules for Typecasting


    +   (1) A Boolean variable cannot be typecasted.

    (2) There is an implicit conversion for non-Boolean data if the conversion increases
    the range of data that can be stored.

    (3) If the range is narrowed, An Explicit typecast is required.

    (4) An implicit cast occurs in the following order byte->short->>int->long->float->double
    char->int->long->float->double

    (5) Any other conversion needs to be typecasted as it narrows the range of data
    that can be stored.


    # Type casting Example


    ```

    public class Conversion

    {

    public static void main (String a[ ] )\n{

    double x;

    int y = 2, i;

    float z = 2.2f,fl=5.5f;

    Short s = 1 , p = 2,q;

    // implicit conversion

    x= y +z;

    System.out.println("The implicit conversion x = y +z="+x);");

    // Explicit conversion

    i = fl/2; // show an error

    i=(int) fl/2; // Explicit type casting

    s = s+p;// This also shows an error by default expression

    right evaluates to an int

    q = (short) s + p;// // error

    System.out.println("The explicit conversion (int) fl/2 is"\n+i);

    System.out.println("one more explicit conversion (short) s +\np is" + q);

    }

    ```'
