  md: '# CHAPTER-11


    # MULTI THREADING PROGRAMMING


    Most computer games uses graphics and sound. Have you noticed that the graphics,
    the score, and the music runs simultaneously? Imagine a situation in which you
    see the screen changing first, your score getting updated next, and then finally,
    you hear the sound!


    A single game has all these elements being processed at the same time. In other
    words, the program has been divided into three sub-units, each unit being handled
    by a thread.


    If you have used Microsoft word, you would have noticed that as key in the text,
    the word application saves the files automatically in the background. This is
    another example of multithreading, in which the user interface is handled by one
    thread, and the saving of a file is handled by another. The same holds true when
    you print a document.


    Threads are very useful when you have large computations that take several seconds
    to complete and you do not want the user to feel the delay. Animation is another
    area where threads are used.


    # 11.1 THREADS


    Thread is similar to a sequential program. A sequential program has a beginning,
    a sequence of steps to execute, and an end. A thread also has a beginning, a sequence,
    and an end. However a thread is not a program on its own but runs with a program.
    A thread can be defined as the sequential flow of control within a program. Every
    program has at least one thread that is called the primary thread. You can create
    more threads when necessary.


    The microprocessor allocates memory to the processes that you execute. Each process
    occupies its own address space (memory). However, all the threads in a process
    share the same address space. Therefore, resources like memory, devices, data
    of program and environment of a program are available to all the threads of program.
    A thread is also known as a “Light weight process” or “execution context”. This
    is because there are fewer overlaps on the processor when it switches from one
    thread to another. Processes are, on the other hand, heavy weight. The following
    figure shows the relationship between a thread and a process.'
