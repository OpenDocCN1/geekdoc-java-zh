    # APPLETS AND APPLICATIONS


    # 9.1 THE APPLET CLASS


    The java.applet package is the smallest package of the Java APIs. The applet class
    is the only class in this package. An applet is automatically loaded and executed
    when you open a web page that contains it. The applet class has over 20 methods
    that are used to display images, play audio files and respond when you interact
