  md: "# 80 | Java in Depth\n\n# 5.7.2 The final modifier\n\nThe final keyword is\
    \ used for security reasons. Consider a situation where you do not want your class\
    \ to be subclassed, or the value of a data member to be changed. The “final” Modifier\
    \ does not allow the class to be inherited. It is used to create classes that\
    \ serve as a standard and nobody can override the methods and use it in a different\
    \ manner.\n\nThe final modifier implements the following restrictions:\n\n+  \
    \ 1. The final class cannot be inherited.\n2. A final method cannot be changed\
    \ (over ridden) by a sub class.\n3. A final data member cannot be changed after\
    \ initialization.\n4. All methods and data members in a final class are implicitly\
    \ final.\n\nYou can define constants using the final keyword. The compiler forces\
    \ you to initialize final variables.\n\n# Example\n\n```\npublic class FinalDemo\
    \ {\n    final int i = 5;\n    final void show()\n    {\n        System.out.println(\"\
    In final block\");\n    }\n}\nclass sub extends FinalDemo {\n    void show(){\n\
    \        /* error will come \"cannot override show()\"*/\n    }\n    public static\
    \ void main(String args[]) {\n        sub s = new sub();\n        s.show();\n\
    \        s.i = 10; /* error will come \"cannot assign a value to final variable\"\
    */\n    }\n}\n```\n\n# 5.7.3 The Native Modifier\n\nA native modifier can be used\
    \ only by methods. It is used to tell the compiler that the method has been coded\
    \ in a non-Java language such as C or C++. Native method is platform-dependent.\
    \ The body of a native method lies outside the Java environment. Therefore, writing\
    \ native method must be avoided. They are used when you have existing code in\
    \ another language and do not want to rewrite the code in Java."
