  md: '# Chapter-10


    # EXCEPTION HANDLING


    An exception is an abnormal condition or event that occurs during program execution
    and disrupts the normal flow of instruction. It is a run time error. Exception
    does not always indicate an error. Though, it can also signal some particularly
    unusual event in your program that deserves a special attention. The major benefit
    of exception is that it separates the code that deals with errors from the code
    that is executed when things are moving along smoothly. With many kinds, you must
    include code in your program to deal with them, otherwise your code will not compile.


    # 10.1 NEED FOR EXCEPTION HANDLING


    You cannot afford to have an application that stops or crashes, if the requested
    file is not present on the disk. Traditionally, programmers use the return values
    of methods to detect errors that occurred at run time. A variable "errno" was
    used for a numerical representation for the error. In case of multiple errors
    in the method, "errno" would return only one value; the value of the last error
    that occurred in the method. Java handles exceptions in the object - oriented
    way. You can use a hierarchy of exception classes to manage runtime errors. An
    exception provides a mechanism for notifying programmers about any error.


    The situations that cause exceptions are quite diverse, but they fall into four
    broad categories.


    +   1. Code or Data error: For example, you attempt an invalid case of an object,
    you try to use an array index which is outside the limits for the array, an integer
    arithmetic exception has a zero divisor, etc.


    +   2. Standard method Exceptions: For example, if you use the substring() method
    in the String class, it can throw a string index out of bounds exception.


    +   3. Throwing your own exceptions: You can throw your own exceptions when you
    need to throw.


    +   4. Java errors: These can be due to errors in execution by the JVM, which
    runs your compiled program, but usually as a consequence of errors in your program.


    # 10.2 TYPE OF EXCEPTIONS


    The class at the top of the hierarchy is called Throwable. Two classes are derived
    from the throwable class- Error and Exception. The Exception class is used for
    the exceptional conditions that have to be trapped in a program. The Error class
    defines'
