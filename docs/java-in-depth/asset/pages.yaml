    Once you have created the panel, add it to a Window, a Frame or an Applet. can
    be done using the add() method of the Container class.


    # Sub-panel


    You can also create nested panels, with one panel containing one or more sub panels.
    You can nest panels as many levels deep as you like. For instance:


    ```

    Panel mainpanel1,subpanel1,subpanel2;

    mainpanel1 = new Panel();

    subpanel1 = new Panel();

    subpanel2 = new Panel();

    mainpanel1.add(subpanel1);

    mainpanel1.add(subpanel2);

    ```


