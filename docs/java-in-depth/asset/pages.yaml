  md: '# Multi Threading Programming | 147


    ![](img/170d6e8f69d81957cecd48ac340496ea_162_0.png)


    Multi-Threaded program


    Any web browser like Microsoft Internet Explorer is an example of a multithreaded
    application. With the browser, you can print a page in the background while you
    are scrolling through the page. You can play audio files and watch animated images
    at the same time. This behavior is close to real life where you perform several
    tasks concurrently.


    Java has built-in support for threads. A major portion of the Java architecture
    is multithreaded. In Java programs, the most common use of the thread is to allow
    an applet to accept input from a user, and at the same time, display animation
    in another part of the screen. Any application that requires at least two things
    to be done at the same time is probably a great candidate for multithreading.


    Continuing our previous example, let us arrange the program so that reading a
    block from the file is one activity, performing the calculation is a second activity
    and writing the results is a third activity. In this case, reading the second
    block can start as soon as the first block has read. In all, we can have all three
    activates concurrently as shown in figure below.


    ![](img/170d6e8f69d81957cecd48ac340496ea_162_1.png)


    A multi-thread process


    # Current Threads


    Every program that you create has at least one thread. You can access this thread
    using the “current thread()” method of the Thread class. This method is a static
    method and hence you do not have to create an object of the Thread class to invoke
    the method.'
