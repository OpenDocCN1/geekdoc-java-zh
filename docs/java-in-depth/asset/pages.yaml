    # A Primitive Database application architecture


    This means the application you create would be able to work with only one kind
    of database and will be very difficult to code and port.


    The above problems are solved by Microsoft’s mechanism for efficient communication
    with the databases and is called Open Database Connectivity (ODBC).


    # I) ODBC Application Programming Interface (API)


    ODBC API is a set of library routines that enable your programs to access a variety
    of databases. All you need to do is to install a DBMS-specific ODBC driver and
    write your program to interact with that driver.


    Later, if the database is upgraded to a newer version of RDBMS or ported to a
    different RDBMS product, you will need to change only the ODBC driver and not
    the program.


    | Applicable | ODBC Driver Manager | Access Driver | MS Access Database |

    | --- | --- | --- | --- |

    | | | Oracle Driver | Oracle Database |


    ODBC application architecture


    # II) JDBC-API


    Java Database connectivity (JDBC) provides a database programming API for Java
    programs. Since the ODBC API is written in the C language and makes use of pointers
    and other constructs that Java does not support, a Java program cannot directly
    communicate with an ODBC driver.'
