    # RELATIONSHIP BETWEEN CLASSES


    # 6.1 POLYMORPHISM (OVERLOADING)


    When a same thing has different behavior in different situations, then this phenomenon
    is known as polymorphism. The word Polymorphism is a combination of two Greek
    words.


    Poly + morphism

    Many + form:


    Polymorphism is of two types

    Static polymorphism

    (Eg: function overloading)

    Dynamic polymorphism

    (Eg: function overriding)


    > Note: Operator overloading is not supported in Java.


    # 6.2 FUNCTION/METHOD OVERLOADING


    There are times when you want to create several methods, that performs closely
    related tasks. For example, the class Calculator has a method that adds two integers,
    another method that adds two values and a third method that adds a float and an
    integer value. These methods perform the same essential operation, addition, and
    so it is appropriate to use the same name for all these functions.


    Java supports method overloading and hence, the methods in the above example can
    be declared as follows:


    +   (1) public void add (int a, int b); // adds two integers

    (2) public void add (float a, float b); // adds two floats

    (3) public void add (float a, int b); // adds a float and an integer'
