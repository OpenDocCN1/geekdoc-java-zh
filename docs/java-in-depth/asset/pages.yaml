  md: '# 17.4.2 The Connection Object


    The connection object represents a connection with a database. You may have several
    connection objects in an application that connects to one or more database.


    # Loading the Driver and Establishing the Connection


    To establish a connection with a database, following needs to be done.


    +   I) Register the ODBC JDBC/thin driver by calling the forName() method from
    the Class.

    Class.forName("oracle.jdbc.driver.OracleDriver");

    II) Calling the getConnection("JDBC URL") method from the DriverManager class.

    The getConnection() method of the DriverManager class attempts to locate the driver
    that can connect to the database represented by the JDBC URL passed to the getConnection()
    method.


    # The JDBC URL


    The JDBC URL is a string that provides a way of identifying a database. A JDBC
    URL is divided into three parts:

    <protocol>:<sub protocol>:<subname>

    <protocol> in a JDBC URL is always Jdbc

    <subprotocol> is the name of the database connectivity mechanism. If the mechanism
    of retrieving the data is ODBC bridge, the subprotocol must be ODBC.

    <Subname> is used to identify the database.


    # A Sample JDBC URL


    ```

    String url = "jdbc:oracle:@localhost:1521:xe";

    // URL For thin Driver

    "jdbc:oracle:thin@localhost:1521:xe"

    Class.forName("oracle.jdbc.driver.OracleDriver");

    Connection con = DriverManager.getConnection(

    (url,"system","password");

    ```


    # 17.4.3 Processing a Query in Database


    Once a connection with the database is established, you can query the database
    and process the result set. JDBC does not enforce any restriction on the type
    of SQL statements that can be sent, as a programmer, it is your responsibility
    to ensure that the database is able to process the statements.

    JDBC provides three classes for sending SQL statements to a database. These are:


    +   i) The Statement Object

    You can create the statement object by calling the createStatement() method from
    the connection object.'
