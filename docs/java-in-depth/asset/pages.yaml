  md: "# Constructor Access Specifier and Modifier | 77\n\n# Consider an Example\n\
    \nClasses Y and Z are inherited from class X. Class Z belongs to the package P2\
    \ and classes X and Y belong to the package P1.\n\n![](img/170d6e8f69d81957cecd48ac340496ea_92_0.png)\n\
    \nA method () has been declared in class X.\nThe following table shows you the\
    \ accessibility of the method shown() from class Y and Z.\n\n| ACCESS SPECIFIER\
    \ | CLASS Y | CLASS Z |\n|---|---|--|\n| Shown() is declared protected | Accessible,\
    \ as Y is a sub class | Accessible, as Z is a sub class (even if it is in another\
    \ package) |\n| Shown() is declared without access specifier (friendly) | Accessible,\
    \ as it is in the same package | Not accessible, as it is not in the same package\
    \ |\n\n# 5.6 ACCESS SPECIFIER FOR CONSTRUCTORS\n\nConstructors can have the same\
    \ access specifiers used for them as variables and methods. Their meaning is the\
    \ same. For example, when a constructor is declared \"private\", then only the\
    \ class itself can create an instance of it. Other classes in the same package\
    \ cannot create any instance of it. Either any sub class of that class, or other\
    \ class outside the package cannot create any instance.\n\nExample\n\n```\nclass\
    \ Q {\n    public int x;\n    private Q (int n)\n    {\n        x = n;\n     \
    \   System.out.println(\"I am born\");\n    }\n}\n```"
