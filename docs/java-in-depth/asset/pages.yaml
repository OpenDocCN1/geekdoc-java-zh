  md: '# Java in Depth


    ```

    double x ;

    int y = 2;

    float z = 2.2f;

    x = y + z;

    ```


    The expression which is in the right of the "+=" operator is solved first. The
    resulting value is stored in x. The expression on the right has variables of two
    different numeric data types, int and float. The int value is automatically promoted
    to the higher data type float (float has a larger range than int) and then, the
    expression is evaluated. Thus, the resulting expression is of the float data type.
    This value is then assigned to x, which is a double (large range than float),
    and therefore, its result is double.


    # Java automatically promotes values to higher data types to prevent any loss
    of information


    Consider the following statement


    ```

    int x = 5.5 / 2;

    ```


    The expression on the right evaluates to a decimal value and the expression on
    the left is an integer and thus, cannot hold a fraction. When you compile this
    code, the compiler will give you the following error:


    > “Incompatible type of declaration. Explicit cast needed to convert double to
    int.”


    ![](img/170d6e8f69d81957cecd48ac340496ea_53_0.png)


    This implies that data can be lost when it is converted from a higher data type
    to a lower data type. The compiler requires that you type cast the assignment.
    To accomplish this, you type the following


    ```

    int x = (int) 5.5 / 2;

    ```


    This is known as Explicit casting.

    Explicit Casting has to be done when there is a possibility of loss of data during
    conversion. The assignment between short and char needs explicit typecasting.

    Let us look at one more example


    ```

    short x=1, y=2, z;

    z=x+y;

    ```'
