    # IV) THE PIPEDINPUTSTREAM AND PIPEDOUTPUTSTREAM CLASSES


    PipedInputStream is used for the transfer of data between threads. The PipedInputStream
    object in a thread is received as input from a PipedOutputStream present in another
    thread. These classes are used together for creating a pipe. Typically, data is
    read from a PipedInputStream object by one thread and written to the corresponding
    PipedOutputStream by some other thread. Attempting to use both objects from a
    single thread is not recommended, as it may deadlock the thread.


    Example:


    ```

    PipedOutputStream outpipe = new PipedOutputStream();

    PipedInputStream inpipe = new PipedInputStream(outpipe);

    ```


    By giving the PipedInputStream object reference to the Input pipe, you connect
    the input (inpipe) and the output (outpipe) into a stream. Data flows in a single
    direction as shown in the figure.


    ![](img/170d6e8f69d81957cecd48ac340496ea_190_0.png)'
