    # 2.5.5 Declaring a Variable


    In Java, all variables must be declared before they can be used. The basic form
    of a variable declaration is shown here.


    Type identifier [= value], identifier [=value]; // [...] represents... is optional


    Type is one of Java''s data types, or the name of a class or interface. Class
    and interfaces will be discussed later in coming chapters. Identifier is the name
    of the variable. Through the equal sign, you can assign a value to a variable.
    To declare more than one variable of the same type use a comma () separated list.


    Example


    +   (1) int a, b, c;

    (2) int d=3; // declaration and assigning value

    (3) byte z = 22;


    # 2.5.6 Variable Initialization


    You cannot use a variable without initializing it. When you create an object of
    a class, Java assigns default value to the primitive data types class variables.
    The following table displays the default initial values that are generally used
    to initialize the data members of a class.


    | Data type | Initial value |

    | byte | 0 |

    | short | 0 |

    | int | 0 |

    | long | 0 |

    | float | 0.0 |

    | double | 0.0 |

    | char | ''u0000'' |

    | boolean | false |

    | abstract data type | null |


    Note


    The values are assigned automatically only to the data members of a class that
    are of the primitive types. You must initialize the variables that you declare
    in the method (local variables). The Java returns an error if you do not initialize
    the variable that you have declared in a method.'
