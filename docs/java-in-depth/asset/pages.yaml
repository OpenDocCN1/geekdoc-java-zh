  md: '# Chapter 7


    # Annotations


    # 7.1 ANNOTATIONS


    Java Annotations were introduced with JDK 1.7. Annotations provide additional
    information used by Compiler or JVM. These are alternative option for XML and
    Java Marker interfaces.


    A Java Annotation is a tag that represents the metadata attached with a class,
    interface, methods or fields to indicate some additional information which can
    be used by Java compiler and JVM.


    Annotations have a number of uses:


    +   **Information for the compiler** — Annotations can be used by the compiler
    to detect errors or suppress warnings

    **Compile-time and deployment-time processing** — Software tools can process annotation
    information to generate code, XML files, and so forth.

    **Runtime processing** — Some annotations are available to be examined at the
    runtime.


    # The Format of an Annotation


    In its simplest form, an annotation looks like the following:


    > @Entity


    The sign character (@) indicates to the compiler, what follows is an annotation.


    # 7.2 BUILT-IN JAVA ANNOTATIONS


    There are several built-in annotations in Java.


    +   I) Built-In Java Annotations used in Java code

    1. @Override

    2. @SuppressWarnings

    3. @Deprecated

    4. @SafeVarargs

    5. @FunctionalInterface

    II) Built-In Java Annotations used in other annotations

    1. @Target

    2. @Retention

    3. @Inherited

    4. @Documented'
