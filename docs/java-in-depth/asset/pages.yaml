  md: '# CHAPTER-4


    # CLASSES AND METHODS


    # 4.1 CLASSES


    Consider a company that has hundreds of employees. For easy management, the employees
    are organized into different departments each having defined responsibilities.
    Each department would know how to handle the responsibilities assigned to it.
    For example, the Human Resources (HR) department would know how to recruit people
    and prepare paychecks. Employees of the other departments would only be interested
    in taking their paychecks, rather than knowing how they were created.


    Similarly, classes help you to organize task and assign them to entities. You
    can encapsulate the data and restrict access to it. You can build hierarchies
    of classes. Classes help you to reuse data and code. When you instantiate a class,
    you create an object. Objects are the basic building blocks of object-oriented
    programming.


    # 4.1.1 Class Fundamentals


    # What is a Class?


    In the real world, you often find many individual objects, all of the same kind.
    For instance, there may be thousands of bicycles in existence, all of the same
    kind and model. Each bicycle was built from the same set of blueprints and therefore
    contains the same components. In oriented theme, we say that your bicycle is an
    instance of the class of objects known as bicycles. A class is the blueprint from
    which individual objects are created. A class defines the behavior of an object.


    Let us explain with another example. A building is constructed on the architectural
    blueprint. Many buildings can be constructed from the same blueprint but each
    instance of a building will have its own state and set of attributes.


    A class is just a mould that helps in creating an object and is not the object
    itself. You can create several instances (objects) of a class.


    # Syntax


    A class has data members (attributes) and behavior (methods). The data members
    and methods of a class are defined upside inside a class body. In Java, braces
    ({}) marks the beginning and the end of a class or method. Braces are also used
    to delimit blocks of code in loops and iterative constructs or statements.'
  merge: -1
  pgno: 72
