  md: "# 2.5.7 The Scope and Lifetime of Variables\n\nScope determines what objects\
    \ are visible to other parts of your program and lifetime of these objects. The\
    \ scope defined by a method begins with its opening curly braces. As a general\
    \ rule, variables declared inside a scope are not visible to code that is outside\
    \ the scope. Thus, when you declare a variable within a scope, you are localizing\
    \ that variable and protecting it from unauthorized access and/or modification.\n\
    \nScope can be nested. For example each time you are creating a block, you are\
    \ creating a new nested scope. When this occurs, the outer scope encloses the\
    \ inner scope. This means objects declared in the outer scope will be visible\
    \ to code in the inner scope. However, the reverse is not possible.\n\nFor example:\n\
    \n```\nclass ScopeDemo{\n  public static void main(String a[] )\n  {\\ // known\
