  md: '# 18.8 SET INTERFACE


    A set cares about uniqueness. It does not allow duplicates. *equals()* method
    determine that the two objects are similar.The three Set implementations are described
    below:


    **HashSet:** It is an unsorted and unordered set. It uses *hashCode()* of the
    object for storing. Hashset is used when we do not bother about order but we need
    uniqueness in the object.


    **LinkedHashSet:** It is an Ordered Set that maintains doubly Linked List. When
    you iterate through HashSet, the order is unpredictable unlike Linked List you
    iterate through the elements in the order in which they are inserted.


    **TreeSet:** The TreeSet is one of two sorted collections (the other being TreeMap).
    and guarantees that the elements will be in ascending order, according to natural
    order.


    Example of HashSet.util.*;


