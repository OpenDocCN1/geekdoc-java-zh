  md: '# 20 | Java in Depth


    # 2.3 ABSTRACT OR DERIVED DATA TYPES


    Abstract data types are based on primitive data types and have more functionality
    than primitive data types. For example, String is an abstract data type that can
    store letters, digits, and other characters like /, (); $ and #.


    You cannot perform calculation on a variable of the string data type even if the
    data stored in it has digits. However, string provides methods for concatenating
    strings, searching for one string within another, and extracting a portion of
    a string. The primitive data types do not have these features.


    # 2.4 ESCAPE SEQUENCE


    An escape sequence is a special character that displays non-visible data. For
    example, you can use this type of character to indicate the end of line. An escape
    sequence is represented by a backslash character, followed by another character
    or symbol.


    | Escape Sequences | Name | Description |

    |---|---|---|

    | /a | Bell(alert) | Makes a sound from the computer |

    | /b | Back space | Takes the cursor bar |

    | /t | Horizontal Yab | Takes the cursor to the next tab stop |

    | /n | New line | Takes the cursor to the beginning of the next line |

    | /v | Vertical tab | Performs a vertical tab. |

    | /f | form feed | Performs form feed |

    | /z | carriage return | Cause a carriage return |

    | " | Double quote | Displays a quotation mark |

    | '' | Apostrophe | Displays an apostrophe |

    | // | Backslash | Displays a backslash |

    | /0 | Null | Assigns Null value |


    # 2.5 VARIABLES


    When you learned algebraic equations in school, you used x and y to represent
    values in equations. Unlike pi, which has a constant value of 3.14, the values
    of x and y are not constant in the equations. Java provides constant and variables
    for storing and manipulating data in program.


    Java allocates memory to each variable and constant that you use in your program.
    As in algebra, the values of variables may change in a program, but the values
    of constants, do not change. You must assign unique names to variables and constants.
    If the name is used to refer to an area in memory in which a value is stored,
    then number is a variable. Variable names are used in programs in much the same
    way as they are in Algebra.'
