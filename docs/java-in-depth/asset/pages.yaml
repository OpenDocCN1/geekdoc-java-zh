    # (2) Start thread state


    In state, thread is only created, but resource is allocated in the start state
    and then the thread actually starts.


    ```

    newthread.start( );

    ```


    # (3) Runnable thread state


    When the start() method of a thread is invoked, the thread enters the runnable
    state. Since a single processor cannot execute more than one thread at a time,
    the processor maintains a thread queue. Once a thread is started, it is queued
    for processor time and waits for it to be executed. At any point of time, a thread
    may be waiting for the attention of the processor. This is why the state of the
    thread is said to be runnable (and not running).


    # (4) Not Runnable thread state


    A thread is said to be in the not runnable state if it is:


    +   (a) sleeping

    (b) waiting

    (c) blocked by another thread.


    A thread is put into the sleeping mode with the sleep() method. A sleeping thread
    enters the runnable state after the specified time of sleep has elapsed.


    A thread can be made to wait on a conditional variable until condition is satisfied.
    A thread can be notified of a condition by invoking the notify() method of the
    Thread class. When a thread is blocked by an input - output operation, it enters
    the not runnable state although it might otherwise qualify as runnable.


    # (5) Dead thread state


    A thread can either die naturally or be killed. A thread dies a natural death
    when the loop in the run() method is complete. For example, if the loop in the
    run() method has a hundred iteration, the life of the thread is a hundred iteration
    of the loop. Assigning null to a thread object kills a thread.


    The isAlive() method of the Thread class is used to determine whether a thread
    has been started.


    # Note


    +   (1) You cannot restart a dead thread.

    (2) You cannot call the methods of a dead thread.


    # SUMMARY


    +   1. A thread is a sequential flow of control with in a program. Every program
    has at least one thread that is called a primary thread.

    2. Applications having only one thread are called single - threaded applications.'
