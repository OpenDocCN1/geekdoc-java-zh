    # The Break Statement


    The break statement causes the program flow to exit from the body of the switch
    construct. Control (of the program) goes to the first statement following the
    end of the switch construct. If the break statement is not used control passes
    to the next case statement and the remaining statements in the switch construct
    are also executed.


    # The Default Keyword


    The statements associated with the default keyword are executed if the value of
    the switch variable does not match any of the case constants.


    Note:


    +   (1) The default label, if used, must be the last in the switch construct,

    (2) The case expressions are of either numeric or character data type.

    (3) The cases in the switch construct cannot have the same value.


    # 3.4.2 Repetition Statements


    # A Looping Construct


    A Loop causes a section of a program to be repeated a certain number of time.
    The repetitions continue while the condition set for it remains true. When the
    condition becomes false, the loop ends and the control is passed to the statement
    following the loop construct.


    # The While Loop


    The while loop is a looping construct available in Java. The while loop continues
    until the evaluating condition becomes false. The evaluating condition has to
    be a logical expression and must return a true or a false value. The variable
    that is checked in the Boolean expression is called the loop control variable.'
