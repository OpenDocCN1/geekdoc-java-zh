  md: "# Classes and Methods |\n\n# 4.9.1 Call By Value\n\nIn Java, all arguments\
    \ of the primitive data type are passed by value, which means that the original\
    \ value of the argument cannot be altered by the called method. The called method\
    \ gets only a copy of the argument. This means that any change made to the object\
    \ by the called method is not reflected in the calling method.\n\n# Call By Value\n\
    \n```\nCallingmethod( )\n{\n  int a = 20;\n\n  Calledmethod(a);\n  System.out.println(a);\n\
    }\n\nCalledmethod(int rec)\n{\n  rec = 100;\n}\n```\n\nIn by value, a copy of\
    \ the argument's value is passed to the CalledMethod() which is maintained at\
    \ a separate memory location. Therefore, when the CalledMethod() method changes\
    \ the value of the argument, the change is not reflected in the CallingMethod()\
    \ method.\n\n# 4.9.2 Call By Reference\n\nArguments that are objects, are passed\
    \ by reference to the called method. This means that any change made to the object\
    \ by the called method is reflected in the calling method.\n\n```\nCallingmethod(\
    \ )\n{\n  Person passit = new Person( );\n  passit.name = \"My Java\";\n  CalledMethod(passit);\n\
    \  System.out.println(passit);\n}\n\nCalledmethod(Person rec)\n{\n  rec.name =\
    \ \"changed\";\n}\n```\n\nIn by reference, the memory address (reference) of the\
    \ argument is passed to the called method. Therefore, when the calledmethod()\
    \ changes the values of the argument; the change is reflected in the calling method.\n\
    \nThe output is changed."
