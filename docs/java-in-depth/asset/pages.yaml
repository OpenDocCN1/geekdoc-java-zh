  md: '# Chapter 18


    # Collection


    A Collection (may called Container), is simply an object which contains multiple
    elements in a group. Collection represents data items that form a natural group.
    For instance, collection of cards, Telephone Directory (that map names to phone
    numbers), etc.


    # 18.1 COLLECTION FRAMEWORK


    Framework means architecture that is used to represent and manipulate collection.
    In Collection we have number of interfaces and abstract classes.


    # Advantages of Collection


    +   1. Minimize the Programmer effort: Collection provides readymade data structure
    and algorithms like Stack, Queue, List.

    2. High Performance: There are various interfaces that can be implemented interchangeably
    and programmer is free from writing the code for data structure.

    3. Interoperability: The Collection Framework had to allow different types of
    collections to work in a similar manner and with a high degree of interoperability.


    # 18.2 COLLECTION INTERFACE


    ![](img/170d6e8f69d81957cecd48ac340496ea_286_0.png)'
