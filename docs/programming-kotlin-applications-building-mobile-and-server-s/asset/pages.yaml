    \ guess that the property in question is the new\none, partner. And when you waking\
    \ right: you're not initializing the property with a value, and it's not\nabstract.\
    \ For now, the focus should be on initialization.\n\n> NOTE We'll talk more about\
    \ abstract properties later, when we dig much\nurther into inheritance and subclassing.\
    \ For now, consider that it's not what you want\nin terms of the partner property.\n\
    \nRemember that in Kotlin, properties declared in a class must be explicitly given\
    \ a value. That's why\ny took all the properties during the primary construction\
    \ and assigned them:\n\n```\nclass Person(firstName: String, lastName: String,\n\
    \    hasPartner: Boolean = false,\n    height: Double = 0.0, age: Int = 0) {\n\
    \\var firstName: String = _firstName\nvar lastName: String = _lastName\nvar height:\
    \ Double = _height\nvar age: Int = _age\nvar hasPartner: Boolean = _hasPartner\n\
    ```\n\nIt's also why we have to give your properties a default value if they're\
    \ not passed into a constructor\nwith a value defined.\n\nHere, that's not really\
    \ the situation. You don't want to receive a partner instance because\not every\
    \ Person instance has one. In other words, this is a rare case where you want\
