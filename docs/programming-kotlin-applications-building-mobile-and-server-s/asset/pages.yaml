  md: "# Data Classes Add Special Behavior to Generated Code\n\n> NOTE You've not\
    \ seen the final keyword, but it does just what it sounds like it: marks a chunk\
    \ of code as “final,” and disallows subclasses to override or replace that code.\n\
    \nIf a superclass has componentN() functions, things get a little trickier. As\
    \ long as the componentN() functions are marked as open and return compatible\
    \ types, the data class doesn't generate code for those functions. If they are\
    \ not open, or are incompatible in return type, Kotlin will throw an error, because\
    \ the data class won't be able to generate code that works with the superclass.\n\
    \nIf the superclass has a copy() function with signature the data class would\
    \ use, then things break altogether. Kotlin will throw an error and you'll have\
    \ to remove the inheritance or change the superclass's copy() function.\n\n> WARNING\
    \ Take that if you follow the earlier advice of avoiding creating a data class\
    \ that inherits from any class other than these last sections aren't things you\
    \ need to worry about. That's the best approach, and the simplest one well: keep\
    \ your data classes as simple as possible, and override as little as possible.\n\
    \n# Data Classes Only Generate Code for Constructor Parameters\n\nYou've seen\
    \ in several cases now that the constructor isn't the only way to get data into\
    \ a class. You can also declare properties inside the class body. These are derived\
    \ from constructor parameters. Listing 8.10 is an older version of the Person\
    \ class that had code with a property declared inside the class.\n\n+   LISTING\
    \ 8.10: Person with extra properties\n\n```\npackage org.wiley.kotlin.person\n\
    class Person(var firstName: String, var lastName: String) {\n  var fullName: String\n\
    \n  // Set the full name when creating an instance\n  init {\n    fullName = \"\
    $firstName $lastName\"\n  }\n\n  override fun toString(): String {\n    return\
    \ fullName\n  }\n}\n```"
