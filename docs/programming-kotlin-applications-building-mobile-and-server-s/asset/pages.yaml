- pgno: 186
  md: "# When Is Kotlin's Version of Switch\n\n> > **NOTE** The % operator means modulo.\
    \ It returns the remainder from a division operation. In this case, anotherNumber\
    \ % 2 means that anotherNumber is divided by two, and the remainder is returned.\
    \ If it's 0, the number was evenly divided by two, and therefore even. If there\
    \ is a remainder, the number is odd.\n\n# # Each Branch Can Support a Range\n\n\
    when is used on numbers, and branches can handle more than a single value. Here's\
    \ an example in each branch:\n\n```\nwhen (anotherNumber) {\n  0, 1, 2, 3, 4 ->\n\
    \    println(\"the number is less than 5\")\n  } else -> {\n    println(\"The\
    \ number is 5 or greater\")\n    even = (anotherNumber % 2 == 0)\n  }\n}\n```\n\
    \nYou can also use the in to condense this syntax:\n\n```\nwhen (anotherNumber)\
    \ {\n  in 0..4 ->\n    println(\"the number is less than 5\")\n  } else -> {\n\
    \    println(\"The number is 5 or greater\")\n    even = (anotherNumber % 2 ==\
    \ 0)\n  }\n```\n\nYou just provide in with a lower and upper bound with two dots\
    \ (..) between them. Also note that in is inclusive of the lower and upper bounds,\
    \ so in 0..4 will be true for 0, 1, 2, 3, and 4.\n\nYou can also negate a negative\
    \ with !, resulting in !in:\n\n```\nwhen (!anotherNumber) {\n  in 0..4 ->\n  \
    \  println(\"the number is greater than 5\")\n  } else -> {\n    println(\"The\
    \ number is 4 or less\")\n    even = (anotherNumber % 2 == 0)\n  }\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: "# Each Branch Usually Has a Partial Expression\n\nIt's possible to use a when\
    \ statement as a sort of super-if. Each branch condition can be a statement that\
    \ evaluates to a Boolean value, which is what you've already seen. However, the\
    \ rules are a bit different than how you've written if statements.\n\nHere's an\
    \ example opening statement for a when that includes a value on the first line:\n\
    \n```\nwhen (anotherNumber) {\n```\n\nThe value of anotherNumber is the value\
    \ being compared. But the statement at the beginning of each branch is actually\
    \ not a complete expression. For instance:\n\n```\n0, 1, 2, 3, 4 -> {\n  println(\"\
    the number is less than 5\")\n}\nin 5..100 -> {\n  println(\"the number is between\
    \ 5 and 100\")\n}\n```\n\nHere, the bits 0, 1, 2, 3, 4 and in 5..100 do not stand\
    \ on their own. Instead, they combine with the opening value to create a complete\
    \ statement. You may take:\n\n```\nwhen (anotherNumber) {\n```\n\nand anotherNumber\
    \ becomes a prefix to each partial expression for each branch. If there is no\
    \ operator supplied, a comparison is made:\n\n```\nanotherNumber ==\n```\n\nIf\
    \ multiple numbers and no operator are supplied, multiple equalities are checked\
    \ for an \"or\" combining the statements:\n\n```\n(anotherNumber == 0) OR (anotherNumber\
    \ == 1) OR (anotherNumber == 2) ...\n```\n\nAnd finally, if an operator is supplied,\
    \ you get something like this:\n\n```\nanotherNumber in 5..100\n```\n\nThis combination\
    \ is evaluated as a Boolean. If the result is true, the branch is executed. If\
    \ it's false, the branch is skipped, and the next branch is checked.\n\nIf no\
    \ branches match, and there is an else, then the else branch is executed. If no\
    \ branches match and there is not an else, no branches are executed, and the flow\
    \ returns to the code directly after the when.\n\nYou have another option, though.\
    \ You can leave the variable or expression in the first line of your when, and\
    \ then include complete Boolean statements for each branch. Here's a case where\
    \ when is turned into an if:\n\n```\nwhen {\n```\n\n```\n(anotherNumber % 2 ==\
    \ 0) -> println(\"the number is even!\")\nelse -> println(\"the number is odd!\"\
    )\n}\n```"
  merge: -1
  img_proc: true
