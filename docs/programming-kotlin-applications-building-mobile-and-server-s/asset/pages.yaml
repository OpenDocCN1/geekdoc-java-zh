  md: "# Local Functions Are Functions Inside Functions\n\nA local function means\
    \ that the function is *local* to something else, and in Kotlin and the context\
    \ of functions, this usually means a function is local to another function.\n\n\
    Here's a working (albeit rather silly) example:\n\n```\nopen fun sum(numl: Int,\
    \ var numbers: Int): Int {\n  var sum = numl\n\n  add(first: Int, second: Int)\
    \ =\n    first + second\n  for (num in numbers)\n    sum = add(sum, num)\n\n \
    \ return sum\n}\n```\n\nHere, the function add() is declared within the function\
    \ sum(), and can only be used by the code in sum(). What's interesting about local\
    \ functions is that they can access variables in the outer scope. In other words,\
    \ they can access variables in the containing function. So, you could rewrite\
    \ this as:\n\n```\nopen fun sum(numl: Int, var numbers: Int): Int {\n  var sum\
    \ = numl\n\n  fun add(toInt: Int) {\n    sum += toAdd\n  }\n  for (num in numbers)\n\
    \    add(num)\n\n  return sum\n}\n```\n\nadd() is using sum, even though sum isn't\
    \ declared or passed into add(). That's typical of local functions, as they have\
    \ access to variables passed into them directly.\n\n> NOTE The containing function\
    \ of a local function is called the closure. Variables that are local to the closure\
    \ are available to the local function as well as the closure itself.\n\n# Member\
    \ Functions Are Defined in a Class\n\nYou've been using member functions since\
    \ you got started with Kotlin back in Chapter 1. Calculator's execute(), add(),\
    \ and sum() functions are all member functions. However, sum() also has a local\
    \ function, also called add().\n\nThis demonstrates that a local function's name,\
    \ can be duplicated. In other words, there is no conflict with the add() member\
    \ function of Calculator, and the add() local function within sum(), which is\
    \ in turn a member function."
  merge: -1
  img_proc: true
