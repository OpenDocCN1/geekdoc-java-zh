    # Organize Your Classes with Packages


    While it''s great that you''ve got Person separate from the test main function,
    you''re still really solved the original problem: class organization. If having
    all your classes in one file is a pain, then by extension, you is having all your
    classes in a single directory.


    What you really want is to organize your classes by functionality. Let''s assume
    that you want your Person class, but you also might later want some specific types
    of people; maybe a Mother class or a Child class. Suppose you''re building software
    to model a genealogy, for example.'
