- pgno: 341
  md: "# LISTING 12.14: A BMW subclass of Car\n\n```\npackage org.wiley.kotlin.car\n\
    \nclass BMW(model: String, color: String) : Car(model, color) {\n    override\
    \ var maxSpeed : Int = 182\n\n    override fun start() {\n        println(\"Starting\
    \ the BMW ${model}: Depressing the brake, pushing the starter button*\")\n   \
    \ }\n\n    override fun stop() {\n        println(\"Stopping the ${model}*\")\n\
    \    }\n\n    override fun drive(direction: String, speed: Int) : Int {\n    \
    \    println(\"The BMW ${model} is driving!\\*\")\n        return speed / 60\n\
    \    }\n}\n```\n\n> NOTE As mentioned earlier, these are pretty trivial examples\
    \ of Car subclasses without much variation as you'd want in a more realistic application.\
    \ The focus here is on minor printing differences so it's easy to see which subclass\
    \ is being invoked in the test case, shown in Listing 12.15.\n\nNow you can build\
    \ a program that loads a bunch of Car subclasses, and iterates over them, treating\
    \ each generically... even each subclass has unique behavior. That's exactly what\
    \ Listing 12.15 does.\n\n# LISTING 12.15: Iterating over Cars in a list\n\n```\n\
    import kotlin.random.Random\nimport org.wiley.kotlin.car.BMW\nimport org.wiley.kotlin.car.Car\n\
    import org.wiley.kotlin.car.Honda\nimport org.wiley.kotlin.car.Infiniti\nimport\
    \ org.wiley.kotlin.car.Porsche\n\nfun main() {\n    var car = Honda(\"Accord\"\
    , \"blue\")\n    car.start()\n    car.drive(\"W\", 60)\n    car.stop()\n}}\n```"
