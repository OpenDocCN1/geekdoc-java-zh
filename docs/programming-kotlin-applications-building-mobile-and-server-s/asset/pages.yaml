  md: 'Again, as long as you can express the criteria as a Boolean expression, you
    can use filter().


    > NOTE filter() is still written with parentheses as a shorthand to indicate that
    it''s a method. But it actually takes what is called a predicate, which is the
    expression you pass to be evaluated.


    # Filter Has a Number of Useful Variations


    You can do more with filter() once you understand its basic usage and how to write
    predicates. One useful is filterNot(), which returns the inverse of what filter()
    returns. So where filter() returns elements that evaluate to true in predicate,
    filterNot() returns elements that evaluate to false.


    Here is a simple filter that returns all bands that do not have "Black" in their
    name:


    ```

    println(rockBands.filterNot { it.name.contains("Black", ignoreCase = true })

    ```


    > NOTE It''s generally safe to say filterNot() returns the things that filter()
    would not, and vice versa, but in some special cases both might evaluate to not
    include the element, most likely if there''s a null value involved.


    Another variation of filter() is filterInstanceOf(). This allows you to select
    all the elements from a collection that are of a certain type.


    This might seem odd when you consider that most collections are strongly typed;
    what would this help? It''s actually particularly useful with strongly typed collections
    of custom objects that have subclasses. For example, suppose that you developed
    a custom RockBand class, JazzBand class, and CountryBand class, all of which are
    inherited from Band. You can use filterInstanceOf() to return a list typed to
    Band and return all members of the list that are specifically RockBand:


    ```

    var justRock = bands.filterInstanceOf<RockBand>()

    ```


    Now you have a new typed list of just the subtype you.


    # COLLECTIONS: FOR PRIMITIVE AND CUSTOM TYPES


    Most of the examples in this chapter have used a combination of Kotlin types.
    Primitive types, like Int, Float, String, and Boolean, are easy to work with collections.
    You also worked with collections of custom objects (Band most notably, as well
    as Person). They''re no more complex to work with, but you will need to ensure
    that you have useful equals(x) and hashCode() methods and you understand the types
    so you can work with them appropriately.'
