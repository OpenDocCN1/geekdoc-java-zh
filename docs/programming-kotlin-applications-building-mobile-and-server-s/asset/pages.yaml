- pgno: 26
  md: '# INTRODUCTION


    For decades, the Java programming language has been the dominant force in compiled
    languages. While there have been plenty of alternatives, it''s Java that has remained
    core to so many applications, from desktop to server-side to mobile. This has
    become especially true for Android mobile development.


    Finally, though, there is a real contender to at least live beside Java: Kotlin,
    a modern programming language shepherded by JetBrains (www.jetbrains.com). It
    is not Java, but is completely interoperable with it. Kotlin feels a lot like
    Java, and will be easy to learn for developers already familiar with the Java
    language, but offers several nice improvements.


    Further, Kotlin is a full-blown programming language. It''s not just for mobile
    applications, or a visual language that focuses on one specific application. Kotlin
    supports:


    +   - Inheritance, interfaces, implementations, and class hierarchies

    - Control and flow structures, both simple and complex

    - Lambdas and scope functions

    - Rich support for generics while preserving string typing

    - Idiomatic approaches to development, giving Kotlin a “feel” all its own


    You''ll also learn that Kotlin is a new language, it doesn''t feel particularly
    new because it builds upon Java, and doesn''t reinvent wheels. Rather, Kotlin
    reflects that thousands of programmers using Java (and other languages) employ
