  md: "This function returns a Boolean, and that's the long line of code does:\n\n\
    ```\nreturn (firstName.equals(other.firstName)) &&\n(lastName.equals(other.lastName))\n\
    ```\n\nFirst, it compares the firstName property of the current object instance\
    \ with the firstName property of the instance passed. Then, it does the same comparison\
    \ on lastName to see if this instance is equal to the lastName of the other instance\
    \ passed.\n\nThen, it uses && to combine two values. && takes two Boolean values—one\
    \ to the left of the && and one to the right—and evaluates the logical and of\
    \ the two. Here's how works:\n\n+   1. If the first value (to the left of &&)\
    \ is false, the entire expression is false.\n\n+   2. If the first value is true,\
    \ the second value is evaluated. If it's false, the expression is false.\n\n+\
    \   3. If both the first and second value are true, the expression is true.\n\n\
    Here's another, longer way to write the expression:\n\n```\nif (firstName.equals(other.firstName))\
    \ {\n  if (lastName.equals(other.lastName)) {\n    return true\n  } else {\n \
    \   return false\n  }\n} else {\n  return false\n}\n```\n\nOf course, programmers\
    \ like things brief, so && is usually the way to go.\n\n> WARNING In addition\
    \ to this being a lot longer, it's also not nearly as clear and simple to read.\n\
    \nThe problem is this code won't compile. If you try, you'll get errors that look\
    \ like this:\n\n```\nError: (26, 44) Kotlin: Unresolved reference: firstName\n\
    Error: (26, 82) Kotlin: Unresolved reference: lastName\n```\n\nWhat's going on\
    \ here? Well, it has to do with that definition of equals(x):\n\n```\noverride\
    \ fun equals(other: Any?): Boolean\n```\n\nSpecifically, the issue is that equals(x)\
    \ takes in an instance class other of Any?. Any in Kotlin is the base, and you\
    \ can take this to mean for now is that anything can be passed into this method,\
    \ and Kotlin will happily pass that into your equals(x) method.\n\nIn the case\
    \ of Person, then Kotlin is telling you through those errors, \"It's not sure\
    \ for you're getting a Person instance, so there might not be properties firstName\
    \ and lastName.\" That's where the unresolved reference is coming into play: Kotlin\
    \ can't be sure those references exist."
