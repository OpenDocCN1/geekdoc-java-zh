  md: "```\nprintln(it.execute(5, Operation.Add(4))\nprintln(it.execute(2, Operation.Add(4)))\n\
    }\n```\n\nThis is a textbook example of a function, the let function. You can\
    \ use let as a suffix on the object instance. In this case, an instance of Calculator\
    \ is created:\n\n```\nCalculator()\n```\n\nThen, the dot notation is added, and\
    \ let follows that. Then, a code block is introduced with an opening brace:\n\n\
    ```\nCalculator().let {\n```\n\nThe context, or scope, of everything in that code\
    \ block is the instance that was created. In other words, you would think of this\
    \ code block as a function:\n\n```\nfun theFun(calc: Calculator) {\n    var itFunction\
    \ = { 5 - 2 }\n    println(calc.add(itFunction(), 3, 5, 3))\n    println(calc.execute(5,\
    \ Operation.Add(4)))\n    println(calc.execute(2, Operation.Add(4)))\n}\n```\n\
    \nThen, new Calculator instance is created and passed into that function:\n\n\
    ```\nvar calc = Calculator()\ntheFun(calc)\n```\n\nSo now the function can operate\
    \ on the Calculator instance.\n\nUsing let, you don't need to define a function,\
    \ and you don't even need a variable to store the calculator instance. It happens\
    \ all within this scope:\n\n```\nCalculator().let {\n    var itFunction = { 5\
    \ - 2 }\n    println(it.add(itFunction(), 3, 5, 3))\n    println(it.execute(5,\
    \ Operation.Add(4)))\n    println(it.execute(2, Operation.Add(4)))\n}\n```\n\n\
    # Lets You to Access an Instance\n\nOnce you create your let and associated code\
    \ block, the instance that let is attached to via it:\n\n```\nprintln(it.add(itFunction(),\
    \ 3, 5, 3))\nprintln(it.execute(5, Operation.Add(4)))\nprintln(it.execute(2, Operation.Add(4)))\n\
    ```\n\nThis should feel familiar. It is exactly how lambda expressions worked\
    \ when you didn't declare a single parameter:\n\n```\n{ if (it.length > 5) true\
    \ false }\n```"
