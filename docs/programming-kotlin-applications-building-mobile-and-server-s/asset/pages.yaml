- pgno: 333
  md: "# Abstract Classes Cannot Be Instantiated\n\nListing 12.1 revisits the User\
    \ class shown in several previous chapters. This is a data class, and has a single\
    \ function explicitly defined. As it's a data class, it will also handle property\
    \ access to email, firstName, and lastName.\n\nLISTING 12.1: The User data class\
    \ is a class for extension\n\n```\npackage org.wiley.kotlin.user\n\ndata User(var\
    \ email: String, var firstName: String, var lastName: String) {\n    override\
    \ fun toString(): String {\n        return `$$firstName $lastName with an email\
    \ of $email`\n    }\n}\n```\n\n> NOTE You might remember that data classes cannot\
    \ be abstract. As you'll, in many ways, a data class is the opposite of an abstract\
    \ class. Data classes are all about implementing behavior, and abstract classes\
    \ are primarily concerned with defining behavior, not implementing it.\n\nIf you\
    \ think about User, it's a great candidate for being a base class. You can imagine\
    \ a number of extensions: an Administrator, a SuperUser, a GuestUser, and so on.\
    \ Each of these extensions could extend User and add type-specific behavior.\n\
    \nThe same is true for the Band class defined and used in previous chapters, and\
    \ the Person class as well. These classes are perfect candidates for extension\
    \ and overriding behavior or adding type-specific behavior.\n\nWhat's particularly\
    \ important to understand, that both classes—User, Band, and Person—can stand\
    \ on their own. There is absolutely the concept of a general User, Band, and a\
    \ Person. It makes sense in many contexts to instantiate User, Band, and Person.\n\
    \nIn contrast, look at Listing 12.2, a new class called Car.\n\nLISTING 12.2:\
    \ A basic Car class\n\n```\npackage org.wiley.kotlin.user\n\nclass Car {\n   \
    \ fun drive(direction: String, speed: Int) : Int {\n        // drive in the given\
    \ direction at the given speed\n        // return the distance driven - fix later\n\
    \        return 0\n    }\n}\n```"
