  md: "The set keyword tells Kotlin that this is a mutator. Additionally, Kotlin assumes\
    \ that the mutator is for whatever property was just defined.\n\n> WARNING Kotlin\
    \ uses a property's definition line in a file to determine that, if there's a\
    \ custom mutator (or accessor), that definition is on the very next line. That's\
    \ a big deal, and worth noting.\n\nThen, value represents the value coming into\
    \ the mutator. So in the following example, value would come to the firstName\
    \ mutator as \"Bobby\":\n\n```\n// Brian's first name\nbrian.firstName = \"Bobby\"\
    ,\n```\n\nNow here's where things look a little odd. There's this line:\n\n```\n\
    field = value\n```\n\nWhat's going on there? What heck is the field? Well, it's\
    \ the property being mutated. It's calling a backing field. So here, field references\
    \ the backing field for the property, which's firstName (because that the property\
    \ is just defined). That backing field is assigned the value passed into the mutator—in\
    \ our example, that's the String \"Bobby\".\n\nThe final piece is where you can't\
    \ say anything something like this:\n\n```\nvar firstName: String = _firstName\n\
    set(value) {\n    firstName = value\n}\n```\n\nThis will actually compile, but\
    \ it will give you a horrible error when you try to run and use this class. The\
    \ problem is that Kotlin sees this:\n\n```\nfirstName = value\n```\n\nit interprets\
    \ that as \"run the code that mutates firstName.\" But that code is the code already\
    \ running. So it calls itself—a concept called recursion—and that line runs again.\
    \ And again. And again. And . . . you get the idea.\n\nBy using the backing field\
    \ field, you avoid this recursion, and things behave. Go ahead and create a custom\
