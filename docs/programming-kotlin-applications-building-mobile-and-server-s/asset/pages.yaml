  md: '# 4


    # Inheritance Matters


    WHAT''S IN THIS CHAPTER?


    +   - Building more flexible classes with secondary constructors

    - When do you need a subclass?

    - All Kotlin classes inherit from Any

    - Creating the option for inheritance

    - Writing a superclass


    # GOOD CLASSES ARE NOT ALWAYS COMPLEX CLASSES


    So far, you''ve largely focused on a single class: the Person began in Chapter
    1 and developed in the last few chapters. It''s a good "first class" because it
    represents a real-world object and raises lots of core issues, related to equality,
    mutable properties, and construction.


    It is possible to begin let some concern creep in, though: are classes really
    this simple? Is this a "toy" class that isn''t realistic? Well, yes and no.


    Yes, in that Person is a pretty typical class. It represents something, it has
    some properties, and it''s kept intentionally. In other words, it has nothing
    that isn''t absolutely essential.


    No, in some key things there are missing from Person:


    +   - It doesn''t inherit from a custom base class, or get extended by any other
    classes.

    - It doesn''t offer multiple constructors.

    - It doesn''t offer any real behavior, just properties.


    This chapter is going to address several of those "No" answers and give you a
    taste of "real-world" Kotlin classes along the way.'
