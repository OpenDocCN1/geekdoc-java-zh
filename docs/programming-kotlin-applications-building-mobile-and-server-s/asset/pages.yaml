    Here, there really isn''t a common type other than the broadest Kotlin type, Any.
    So you''re getting a List<Any>. While there''s nothing wrong with this, it''s
    not going to give you much type safety. Or do you add any type to this list, and
    you''ll have no problems.


    Still, in these cases, the results are somewhat predictable.


    # Sometimes Type Inference Is Wrong


    Consider a case where things might not be predictable based on type inference:


    ```

    val mom = Parent("Cheryl", "Truesy", _child=brian)

    val anotherMom = Parent("Marie", "Bushnell", _child=rose)

    val parentList = mutableListOf(mom, anotherMom)

    ```


    Kotlin sees two instances and infers that you want a List<Parent>. But that is
    the actual intent? Or do you want a List of Person instances, and it just happens
    that mom and anotherMom are Parent instances (which are subclasses of Person)?


    This is why type inference can be problematic. Kotlin knows why you''ll get an
    exception here:


    ```

    val mom = Parent("Cheryl", "Truesy", _child=brian)

    val anotherMom = Parent("Marie", "Bushnell", _child=rose)

    val parentList = mutableListOf(mom, anotherMom)

    ```


    ```

    parentList.add(brian)

    ```


    The exception is:


    ```

    Error(20, 20) Kotlin: Type mismatch: inferred type is Person but expected

    ```


    That''s why you created a List<Parent> to let Kotlin infer your type. If you wanted
    to add Person instances, you''d need to explicit:


    ```

    val mom = Parent("Cheryl", "Truesy", _child=brian)

    val anotherMom = Parent("Marie", "Bushnell", _child=rose)

    val parentList = mutableListOf<Person>(mom, anotherMom)

    ```


    ```

    parentList.add(brian)

    ```


    This code compiles happily, if you''re explicit about your types and now allow
    Person instances in parentList.


    # Don''t Assume You Know Intent


    If this is a little manufactured, it actually happens more than you might think.
    Lots of times, you''re not creating an object instance and creating a collection
    in the same bit of code, alone in subsequent lines of code. Often, you are writing
    a method that takes in an argument—and you don''t always know the intent of that
    object.'
