- pgno: 124
  md: "Now, to inherit from a class, you simply append a colon (:) and then the name\
    \ of the base class when declaring the new class:\n\n```\nclass Parent : Person\
    \ {\n}\n```\n\nGo ahead and try to compile, you're going to see a couple of immediate\
    \ errors:\n\n```\nError:(3, 16) Kotlin: This type is final, so it cannot be inherited\
    \ from\nError:(3, 16) Kotlin: This type has a constructor, and thus must be\n\
    \       initialized here\n```\n\nThe first of these illustrates the open requirement.\
    \ Person is not currently open, so is is considered final, which means it cannot\
    \ be subclass.\n\nGo back to Person and add open before the class keyword:\n\n\
    ```\nopen class Person(firstName: String, _lastName: String,\n             height:\
    \ Double = 0.0, _age: Int = 0) {\n```\n\nNow compile again, and you'll see the\
    \ first error related to Person being final has gone away:\n\n```\nError:(3, 16)\
    \ Kotlin: This type has a constructor, and thus must be\n       initialized here\n\
    ```\n\nNow you need to fix this error, which has to be done with construction\
    \ and initialization.\n\n# Terminology: Subclass, Inherit, Base Class, and More\n\
    \nBefore getting to error, it's worth taking a moment to get your head around\
    \ some key terms that are going to come up with a lot. These all enter the programmer's\
    \ vocabulary when you get into inheritance- and subclasses:\n\n+   Inheritance:\
    \ The principle of one class inheriting from another, usually properties and methods.\n\
    Base class: The class that is inherited from. Any is the base class for all Kotlin\
    \ classes, and Person is the base class for Parent.\nSuperclass: Another word\
    \ for base class. This is in relation to another class. So Person is the superclass\
    \ of Parent.\nSubclass: A class that inherits from another class. So Parent is\
    \ a subclass of Person.\nExtend: You'll sometimes hear a subclass described as\
    \ extending a base class. This is common, and something you should be aware of.\n\
    \nYou don't need to necessarily memorize these; there's no quiz coming. However,\
    \ they are common, and you'll likely pick up on most of these as you work through\
    \ this book and advance in your own programming career.\n\nThese are also words\
    \ that're not specific to Kotlin, but apply to any language that supports inheritance."
