  md: '> NOTE It should be said outright that this example is a bit silly. There''s
    almost no why a class that uses values like this would not store those values
    as a property. In fact, it''s argued that a class like Calculator that uses a
    set of values is poorly designed if it does not store the input values.


    # Data Classes Cannot Be Abstract, Open, Sealed, or Inner


    Another requirement of data classes is that they cannot be abstract, open, sealed,
    or inner. You''ve seen open classes already, but not gotten into sealed, inner,
    or abstract classes. Don''t worry, though: cover-age of these is coming up in
    Chapter 9.


    Most of this boils down to this simple: data classes can inherit from a non-class,
    but cannot themselves be inherited from. If you create a User class, you won''t
    be able to inherit from it and create a SuperUser class. That''s the commonality
    between abstract, open, sealed and inner classes'' relevant here: they are set
    up to be inherited from.


    The problem, is that data classes are entirely composed of compiler-generated
    methods and properties that are not explicitly declared. But when you inherit
    from a class, those are the very things you''ll typically override or extend.
    There''s simply no consistent for a subclass to modify compiler-generated code
    without knowing more about that code than Kotlin makes explicitly.


    It is still legal for a data class to inherit from a superclass. This also be
    pretty intuitive, as by now you know that Kotlin classes implicitly inherit from
    Any.


    > WARNING With the exception of the implicit inheritance from Any, you should
    try to avoid creating a data class that inherits from another custom class, or
    fix any class out of size. A lot of tricky logic can result from the collision
    of the compiler-generated code in a data class and normal inheritance.


    There''s also growing discussion and movement toward disallowing inheritance in
    data classes. While this is still legal as of this writing, it may not be in future
    versions of Kotlin, so better to get ahead of things now and allow data classes
    to stand on their own.


    # DATA CLASSES ADD SPECIAL BEHAVIOR TO GENERATED CODE


    In addition to the restrictions on them, data classes add a number of wrinkles
    to normal rules of inheritance and some of the special methods you''ve already
    learned about, such as toString() and hashCode().'
