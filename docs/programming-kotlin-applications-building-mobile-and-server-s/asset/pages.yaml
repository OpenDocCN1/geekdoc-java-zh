- pgno: 119
  md: "# CHAPTER 4 INHERITANCE MATTERS\n\n> NOTE This, like other parts of this book,\
    \ can be a bit annoying. First, you add a hasPartner property. Then you change\
    \ that to a hasPartner() function and add parentheses. Now, hasPartner has changed\
    \ back to a property—read-only time—and you need to remove those parentheses that\
    \ you just added.\nAs as this can seem a bit like we are going back and forth,\
    \ it is an attempt to demonstrate how development happens: iteratively, changing\
    \ one thing and then another, and doing work that sometimes seemingly thrown away.\
    \ While it would be easy to just give you the \"final\" version of this code right\
    \ away, it is much more interesting and effective to have you walk through these\
    \ steps and see how this process would go in an actual development.\n\nFinally,\
    \ you can go back and clean up PersonTest to remove any incorrect usage of constructors\
    \ that have changed. Listing 4.13 shows a sample of what a test class might look\
    \ like.\n\n# LISTING 4.13: The PersonTest class has a helper function and works\
    \ with the updated\nPerson class\n\n```\nimport org.wiley.kotlin.Person\n\nfun\
    \ main() {\n    // Create a new person\n    val brian = Person(\"Brian\", \"Truesby\"\
    , 68.2, 33)\n    printPersonPartnerStatus(brian)\n\n    // Create another person\n\
    \    val rose = Person(\"Rose\", \"Bushnell\", brian)\n    printPersonPartnerStatus(rose)\n\
    \n    // Change Rose's last name\n    rose.lastName = \"Bushnell-Truesby\"\n \
    \   println(rose)\n}\n\nfun printPersonPartnerStatus(person: Person) {\n    if\
    \ (person.hasPartner) {\n        println(\"${person} has a partner: ${person.partner}\"\
    )\n    } else {\n        println(\"${person} does not have a partner.\")\n   \
    \ }\n}\n```\n\nNote that a new helper function has been introduced: printPersonPartnerStatus().\
    \ This takes some code that you might use multiple times and ensures that it only\
    \ has to be written once.\nThat's the DRY principle discussed earlier: Don't Repeat\
    \ Yourself."
