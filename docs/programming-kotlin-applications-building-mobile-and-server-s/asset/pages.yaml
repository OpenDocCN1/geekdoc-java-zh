  md: "when has the same capabilities:\n\n```\nfun isPositiveInteger(theValue: Any):\
    \ Boolean =\nwhen {\n  (theValue is Int) && (theValue is Byte) &&\n  (theValue\
    \ is Short) && (theValue is Long) -> false\n  (theValue is Int) -> (theValue as\
    \ Int > 0)\n  (theValue is Short) -> (theValue as Short > 0)\n  (theValue is Byte)\
    \ -> (theValue as Byte > 0)\n  (theValue is Long) -> (theValue as Long > 0)\n\
    \  else -> false\n}\n```\n\nHere, a function is defined as a when statement, and\
    \ like if, each branch returns the last statement.\n\nThe first condition is a\
    \ multi-condition: it checks to see if the theValue is not one of those types.\
    \ If it is one of those types, it is converted in the appropriate expression (as\
    \ an Int, Short, or Byte, or Long).\n\nBut remember, if no match is found, the\
    \ else is run. That means you could remove first condition, when leaving this:\n\
    \n```\nwhen {\n  (theValue is Int) -> (theValue as Int > 0)\n  (theValue is Short)\
    \ -> (theValue as Short > 0)\n  (theValue is Byte) -> (theValue as Byte > 0)\n\
    \  (theValue is Long) -> (theValue as Long > 0)\n  else -> false\n```\n\nNow,\
    \ if no type match occurs, you get the same false returned value, without the\
    \ clutter of that first conditional.\n\n> Note This is a slightly new syntax for\
    \ functions. Rather than using an open and closing set of curly braces for the\
    \ function definition, it's entirely represented by an = then a single statement\
    \ for the function.\n\n# FOR IS LOOPING\n\nThe for control structure is likely\
    \ the second most common structure—with if being the most common—and almost certainly\
    \ familiar to you if you've done any programming at all. You've already seen it\
    \ in action with collections, but of course that's not its usage.\n\nfor, at its\
    \ simplest, is a loop that goes through a set number of things. “Thing” here is\
    \ meant to be vague, because a for loop can traverse almost anything—as long as\
    \ there is a starting point and an ending point."
  merge: -1
  img_proc: true
- pgno: 191
  md: "# For in Kotlin Requires an Iterator\n\nIf you've been programming for long,\
    \ you've likely seen simple for loops that provide some sort of index or counter.\
    \ Here's an example in Java:\n\n```\nfor (int i = 0; i < 5; i++) {\n  System.out.println(i);\n\
    }\n```\n\nAnd here's what that would look like JavaScript:\n\n```\nfor (i = 0;\
    \ i < 5; i++) {\n  text += i + \"<br>\";\n}\n```\n\nKotlin is a bit different.\
    \ Here's that same loop in Kotlin:\n\n```\nfor (i in 0..4) {\n  println(i)\n}\n\
    ```\n\nThis may not look like a change, but some important differences are lurking\
    \ here.\n\nFirst, Kotlin doesn't support the somewhat typical format of:\n\n```\n\
    for (statement 1; statement 2; statement 3) {\n  // code block to be executed\n\
    }\n```\n\nIn this format (common to Java, JavaScript, and many other languages),\
    \ statement 1 is typically an assignment, statement 2 is typically a condition\
    \ that must be true to execute the code block, and statement 3 is executed after\
    \ the loop runs each time.\n\nKotlin, though, requires an iterator, which really\
    \ does all this to your code internally. Here's the Kotlin again:\n\n```\nfor\
    \ (i in 0..4) {\n  println(i)\n}\n```\n\nIn this code, 0..4 actually creates an\
    \ iterator on the fly. In other words, this is somewhat equivalent to the following\
    \ code:\n\n```\nval numbers = listOf(0, 1, 2, 3, 4)\nval numbersIterator = numbers.iterator()\n\
    ```\n\nYou've already seen how to use this code in a connection with while; it\
    \ looks like this:\n\n```\nval numbers = listOf(0, 1, 2, 3, 4)\nval numbersIterator\
    \ = numbers.iterator()\nwhile (numbersIterator.hasNext()) {\n  println(numbersIterator.next())\n\
    }\n```\n\n> NOTE We'll come back to while in a bit. For now, we're just passing\
    \ through."
