  md: '# ABOUT THE AUTHOR


    BRETT MCLAUGHIN has been working and writing in the technology space for over
    20 years. Today, Brett''s focus is squarely on cloud and enterprise computing.
    He has quickly become a trusted name in helping companies execute a migration
    to the cloud—and in particular Amazon Web Services—translating confusing cloud
    concepts into a clear executive-level vision. He spends his days working with
    key decision makers who need to understand the cloud as well as leading and building
    teams of developers and operators who must interact with the ever-changing cloud
    computing space. He has most recently led large-scale cloud migrations for NASA''s
    Earth Science program and the RockCreek Group''s financial platform. Brett is
    currently the Chief Technology Officer at Volusion, an ecommerce platform provider.'
