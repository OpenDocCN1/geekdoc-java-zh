    # SCOPE FUNCTIONS SUMMARY


    Now that you''ve seen all these scope functions, you''ve realized the most important
    thing about them: they''re very similar and almost interchangeable. Using one
    over the other has more to do with style and preference than a particular use
    case.


    There are a few key differences that will help you separate each scope function
    from the others:


    +   * The Name of the reference variable, it or this (even though you can override
    the name for all scope functions).


    +   * What is returned: the context object or the result of the lambda function.


    +   * Whether the scope function is an extension function, and therefore attached
    to the context object with dot notation.


    Once you have each scope function aligned with these three items, you really have
    a complete picture, and can pick and choose at will. Table 11.1 summarizes the
    differences.


    TABLE 11.1: Differences between scope functions


    | SCOPE FUNCTION | CONTEXT OBJECT REFERENCE | RETURN VALUE FROM FUNCTION | USAGE
    |

    | :--- | :--- | :--- | :--- |

    | let | it | Lambda result | Extension function (dot notation on context object)
    |

    | with | this | Lambda result | Context object passed in |

    | run | this (or nothing) | Lambda result | Extension function or without a context
    object |

    | apply | this | Context object | Extension function |

    | also | it | Context object | Extension function |'
