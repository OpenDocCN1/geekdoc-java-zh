- pgno: 147
  md: "You can see this true if you make some simple fixes to equals(x). Listing 5.6\
    \ shows an update to Band that addresses this (and includes a matching change\
    \ to hashCode()).\n\n# LISTING 5.6: Updated equals(x) and hashCode() to improve\
    \ Band\n\n```\npackage org.wiley.kotlin.music\n\nimport org.wiley.kotlin.person.*\n\
    \nclass Band(name: String, _singer: Person, _guitarist: Person, _drummer: Person,\n\
    \    _bassist: Person) {\n    var name: String = _name\n    var singer: Person\
    \ = _singer\n    var guitarist: Person = _guitarist\n    var drummer: Person =\
    \ _drummer\n    var bassist: Person = _bassist\n\n    override fun toString():\
    \ String {\n        return name\n    }\n\n    override fun hashCode(): Int {\n\
    \        return name.hashCode()\n    }\n\n    override fun equals(other: Any?):\
    \ Boolean {\n        if (other is Band) {\n            return name == other.name\n\
    \        } else {\n            return false\n        }\n    }\n}\n```\n\n> NOTE\
    \ Like the equals(x) method in Person from earlier chapters, this is a bit simplistic\
    \ (It's actually quite a bit more simplistic than Person.). Still, it illustrates\
    \ the point in question.\n\nNow, rerun your test code, and you'll see only one\
    \ instance of the Beatles:\n\n[The Beatles, The Black Crowes, The Kinks, The Rolling\
    \ Stones]\n\nWith an equals(x) method that reports the two instances are equal\
    \ based on band name, the set now only accepts the first addition."
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Using a Set? Check equals(x)\n\nThe final thing that this illustrates is\
    \ that if you're filling a set with any custom objects, you need to be sure that\
    \ equals(x) for those objects does you think it does. There's nothing harder to\
    \ track down than a set that you choose to eliminate duplicates actually appearing\
    \ to eliminate duplicates.\n\nWhen in doubt, look at the source code for custom\
    \ objects. Or at a minimum, you can compare a couple of instances that you would\
    \ assume as equal in code using equals(x) and see what happens. This will least\
    \ let you prepare accordingly.\n\n# Iterators Aren’t (Always) Mutable\n\nOne thing\
    \ you haven't seen is that the Iterator you get from a list or a set allows you\
    \ to change the collection that is operating upon:\n\n```\nvar iterator = rockBands.iterator()\n\
    while iterator.hasNext() {\n  var band = iterator.next()\n  if band.name.contains(\"\
    Black\", ignoreCase = true) {\n    iterator.remove()\n  }\n}\n```\n\nIf you compile\
    \ and run this code, and then print rockBands after its execution, you will see\
    \ that the Black Keys and the Black Crews have been removed.\n\nThe reason this\
    \ is twofold: a collection's iterator knows about the underlying collection, so\
    \ you can remove or add things as needed; and a mutable collection gets a mutable\
    \ iterator. In fact, Mutable inherits from Iterator. A collection that is not\
    \ mutable does not provide a mutable iterator, for obvious reasons: the underlying\
    \ collection can't change.\n\n# MAPS: WHEN A SINGLE VALUE ISN’T ENOUGH\n\nSo,\
    \ you've seen sets and lists. They're pretty similar: they store a collection\
    \ of items. It's only in how they store these items, and order and duplication\
    \ matters, that set them apart. But there's another collection type that is different:\
    \ Map.\n\nA map stores key-value pairs. For every item in the map, there's a key\
    \ (a unique identifier) and a value (what that identifier points to, or is associated\
    \ with). Generally, the key is not just property of the value, as that's somewhat\
    \ redundant. So you wouldn't have a map, for example, where the key was a person's\
    \ first name and the value was a Person object with that first name.\n\nYou will\
    \ often see a map with a numeric ID of some sort and a value associated with that\
    \ ID, often an object."
  merge: -1
  img_proc: true
- pgno: 149
  md: "# Maps Are Created by Factories\n\nLike a set or list, you create a map with\
    \ a factory method. Unlike those two collections, though, you have to provide\
    \ both value and key, and the notation looks a bit different:\n\n```\nvar statusCodes\
    \ = map(200 to \"OK\",\n202 to \"Accepted\",\n402 to \"Payment Required\",\n404\
    \ to \"Not Found\",\n500 to \"Internal Server Error\")\n```\n\n> NOTE This particular\
    \ map is modeling the various HTTP status codes and the associated description.\
    \ It's also wholly incomplete. There are many, many more status codes.\n\nYou\
    \ can print the keys and values with properties on the map:\n\n```\nvar statusCodes\
    \ = map(200 to \"OK\",\n202 to \"Accepted\",\n402 to \"Payment Required\",\n404\
    \ to \"Not Found\",\n500 to \"Internal Server Error\")\n```\n\n```\nprintln(Keys:\
    \ ${statusCodes.keys})\\nprintln(Values: ${statusCodes.values})\n```\n\nNow when\
    \ it comes to actually getting an individual value, you use the same sorts of\
    \ methods as with lists and sets:\n\n```\nprintln(\"202 has an associated value\
    \ of '${statusCodes.get(202)}\")\n```\n\n# Use Keys to Find Values\n\nUnder the\
    \ hood, your Map is actually a Set of key-value pairs or a List of key-value pairs.\
    \ That order may or not be preserved in your map. In other words, you should not\
    \ writing code that depends on the order of keys in a map.\n\nInstead, you should\
    \ be using keys to find values, or looking up keys or values, as shown here:\n\
    \n```\nif (statusCodes.contains(404)) {\n  println(\"Message: ${statusCodes.get(404)}\"\
    )\n} else {\n  println(\"No message for 404.\")\n}\n```\n\nOf course, you need\
    \ a key to get a value. If you supply a key that doesn't map to a value, you won't\
    \ get anything. In fact, you'll need a null value:\n\n```\nprintln(statusCodes.get(400)\\\
    *)\n```"
  merge: -1
  img_proc: true
- pgno: 150
  md: "This returns null, meaning you'll likely need code that either checks for a\
    \ key before calling get()\nusing contains(), or handles the possibility of null\
    \ return values.\n\n# # How You Want Your Value?\n\nIf you want to avoid that—and\
    \ in many cases, it's not worth the extra code—you can use getOrDefault(). This\
    \ variation of get() allows you to specify a return value to use if get()() would\n\
    normally return null:\n\n```\nprintln(statusCodes.getOrDefault(400, \"Default\
    \ Value\"))\n```\n\nHere, 400 isn't a key in the set, you'll simply get back \"\
