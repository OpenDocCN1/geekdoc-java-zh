    } while (emptyList.size < 100)\nprintln(emptyList)\n```\n\n# do ... While Can\
    \ Be a Performance Consideration\n\nNow that you've seen while and do ... while,\
    \ and realize that you *can* use while for every-, the reason: is why *ever* use\
    \ do ... while?? Certainly, in the examples you've seen and written, the difference\
    \ is small and arguably negligible.\n\nIt's actually true. Given that, you have\
    \ only really two reasons to consider do ... while over while:\n\n+   - You want\
    \ to make the intention of your code as clear as possible, and you know that the\
    \ code in your block will run at least once (and's potentially useful to make\
    \ that clear to others who read, review, or maintain your code).\n- The negligible\
    \ difference between while and do ... while matters, and you anticipate that difference\
    \ adding up over time."
