  md: '# 336 | CHAPTER 13 KOTLIN: THE NEXT STEP


    ![](img/0c8d5d6c6d95ced628a954a187036113_365_0.png)


    FIGURE 13.1: Kotlin''s reference documentation is thorough and helpful.


    # Use the Internet to Supplement Your Own Needs and Learning Style


    If you want more than the reference documentation provides, there are some tried
    and true online reference sites that are consistently helpful:


    +   - baeldum.com: Like the reference documentation, baeldum.com is a bit of academic
    learning site. You''ll get a lot of programming theory, and lots of generics.
    However, you''ll also get some interesting articles on design patterns and using
    Kotlin to its fullest.


    +   - medium.com: The medium.com is a great go-to for a lot of topics, from culture
    to programming. Kotlin is covered a bit sporadically, and you might find three
    articles on inheritance and not mobile on all, but it''s still a great site when
    you find what you are looking for. It is also very practical, with articles written
    for programmers who may not as much interest in the science of computer science.


    +   - journaldev.com: The site journaldev.com is another site that has varied
    coverage, but is great site for practical articles that have some pretty clear
    examples.


    +   - play.kotlin.org/koans/overview: The Kotlin Koans are a pretty unique playground.
    It''s an interactive way to learn as you go. It''s structured but almost entirely
    experiential, so if you want a lot of clear and explicit explanation, this might
    not be the site for you. Still, it''s worth checking out. Figure 13.2 shows an
    example of a Koan on data classes that requires you to fill out missing code with
    some hints along the right.'
