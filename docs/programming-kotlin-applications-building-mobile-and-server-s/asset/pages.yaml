- pgno: 321
  md: '# APPLY HAS A CONTEXT OBJECT NO RETURN VALUE


    apply is yet another tool in your scope function toolbox and continues the pattern
    of providing small variations on a theme of convenience and readability. apply''s
    main difference from let, run, and with that it does not return a value from the
    lambda expression.


    Like run and with, apply uses this as the scope object. So apply becomes a perfect
    function for operating on an instance without needing return values back. It''s
    convenient in that you don''t need to type the instance name over and over.


    The following code uses apply:


    ```

    // Examples without using apply

    val brian = Person("Brian", "Truthy")

    brian.partner = Person("Rose", "Elizabeth", _age = 34)

    // For some reason, all we know that Brian is two years younger than his partner

    brianage = brian.partner?.{ it.age - 2 } ?: 0

    println(brian)

    println(brian.partner)

    ```


    The thing that might jump out at you is how many times you see the instance brian
    appear. It''s a lot!


    > If you''re entering and executing the code as you follow along—and you should
    be—you''ll need to import org.wiley.kotlin.person.Person into your project and
    test program.


    # apply Operates upon an Instance


    The key here is that after an instance of Person is created, the resulting instance,
    brian, is operated upon multiple times. That''s why apply is useful.


    The following is how you could rewrite this code:


    ```

    // Rewriting this code with apply

    val brian = Person("Brian", "Truthy").apply {

    partner = Person("Rose", "Elizabeth", _age = 34)

    age = partner?.{ it.age - 2 } ?: 0

    println(this)

    }

    println(brian)

    ```


    As has been with other scope functions, there''s no change in functionality. However,
    the code is cleaner and clearer. Both partner and age are referenced through this,
    and clearly are attached to the initial Person instance.'
