  md: "The entirety of add() boils down to just making a calculation. Put into Kotlin\
    \ parlance, the function is a single expression.\n\n# Single-Expression Functions\
    \ Don’t Have Curly Braces\n\nWhen you run across single-expression functions,\
    \ you can skip the opening and closing curly braces, and assign the result of\
    \ that expression to the function declaration. Listing 10.6 revisits Calculator\
    \ with this notation for add().\n\n> LISTING 10.6: Changing add() to be a single\
    \ expression assigned to the function\n\n```\npackage org.wiley.kotlin.math\n\n\
    import kotlin.math\n\nclass Calculator {\n    fun execute(input: Int, operation:\
    \ Operation): Int {\n        val returnVal = when (operation) {\n            is\
    \ OperationAdd -> input + operation.value\n            is OperationSubtract ->\
    \ input - operation.value\n            is OperationMultiply -> input * operation.value\n\
    \            is OperationDivide -> input / operation.value\n            is OperationRaise\
    \ -> (input.toFloat().pow(operation.value)).toInt()\n            else -> {\n \
    \               throw Exception(\"Unhandled Operation: ${operation}\")\n     \
    \       }\n        }\n        return returnVal\n    }\n}\n\nopen fun add(num1:\
    \ Int, num2: Int, num3: Int = 0, num4: Int = 0): Int =\n    num1 + num2 + num3\
    \ + num4\n```\n\nWhile this is a relatively simple change, it opens up a lot of\
    \ learning possibilities.\n\nIt’s worth reviewing the original definitions of\
    \ the beginning and end of an opening curly {:\n\n+   **The beginning of the function.**\
    \ Functions typically open with a curly brace: this is the beginning of what function\
    \ actually does, also called the function's behavior.\n\n+   **The end of the\
    \ function.** This is the matching ending to the earlier beginning. Just as most\
    \ functions open with a curly brace, most close with one as well.\n\nNotice that\
    \ functions \"typically\" open with a curly brace. Now you’re seeing that while\
    \ is true, they can also open with an equals sign (=). They also typically close\
    \ with a closing curly brace, but only to match an opening, if present."
