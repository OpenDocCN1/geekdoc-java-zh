- pgno: 199
  md: "```\nif (!foundPrime) print(\"$low \")\nlow++\n}\n```\n\n> > NOTE This code\
    \ is based on similar code from the Programagiz site (www.programiz.com). That\
    \ site is a great resource for Kotlin examples (as well as other languages). The\
    \ sample also uses break, which as mentioned before, you'll learn shortly.\n\n\
    # # DO ... WHILE ALWAYS RUNCES\n\nA loop always evaluates its condition before\
    \ anything else occurs. So take this (trivial) example:\n\n```\nwhile (false)\
    \ {\n  println(\"Code that never runs!\")\n}\n```\n\nThe println() line will never\
    \ execute because the condition evaluates to false. But if you want the code to\
    \ always execute at least once, you can switch to a do ... while loop:\n\n```\n\
    do {\n  println(\"Gonna run at least once!\")\n} while (false)\n```\n\nUnlike,\
    \ the condition is evaluated after execution of the code block. That is the only\
    \ difference between while and do ... while.\n\n# # Every do ... while Loop Can\
    \ Be Written as a while Loop\n\nYou may have already figured out, but it's an\
    \ important point: every do ... while loop can be rewritten as a while loop. And\
    \ in every situation you might want to use a do ... while, you can also use a\
    \ while loop. However, you may have to change the loop to make this conversion.\
    \ So take this code:\n\n```\ncondition = false\ndo {\n  println(\"Gonna run at\
    \ least once!\")\n} while (condition)\n```\n\nYou cannot simply switch out do\
    \ ... while for while. So this won't mimic the previous code:\n\n```\ncondition\
    \ = false\nwhile (condition) {\n  // This line actually will NOT run now\n  println(\"\
    Gonna run at least once!\")\n}\n```"
