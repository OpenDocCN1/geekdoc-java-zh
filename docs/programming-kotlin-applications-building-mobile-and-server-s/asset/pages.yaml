- pgno: 256
  md: "```\nclass Calculator {\n    fun execute(input: Int, operation: Operation):\
    \ Int =\n        when (operation) {\n            is Operation.Add -> input + operation.value\n\
    \            is Operation.Subtract -> input - operation.value\n            is\
    \ Operation.Multiply -> input * operation.value\n            is Operation.Divide\
    \ -> input / operation.value\n            is Operation.Raise -> -\n        }\n\
    \        return (input.toFloat().pow(operation.value.toFloat())).Int()\n    }\n\
    }\n```\n\n> >\n\nThis will now compile because every subclass of the sealed class\
    \ is covered.\nThere's also a pretty exception to the \"every subclass must be\
    \ covered\" rule, and that's a subtle one. Note that in Listing 9.25, when the\
    \ evaluates and the result is directly returned. In this case, it is returned\
    \ as the return value of execute(). That's why the function definition for execute(),\
    \ it has an - sign before the return.\n\nThe rule's: if when evaluates is the\
    \ right-hand side of an expression or returned from a function, the function must\
    \ handle every subclass. If the when is not the right-hand side of an expression\
    \ or returned, the rule doesn't apply. So this code is perfectly:\n\n```\nclass\
    \ Calculator {\n    fun execute(input: Int, operation: Operation): Int {\n   \
    \     when (operation) {\n            is Operation.Add -> input + operation.value\n\
    \            is Operation.Subtract -> input - operation.value\n        }\n   \
    \     return 0\n    }\n```\n\nObviously, the code doesn't make sense that it always\
    \ returns 0, but it does make the point: the when is not subject to the \"every\
    \ subclass\" rule since it's no longer returned from execute().\n\n```\nclass\
    \ Calculator {\n    fun execute(input: Int, operation: Operation): Int {\n   \
    \     val returnVal: Int = when (operation) {\n            is Operation.Add ->\
    \ input + operation.value\n    }\n```"
