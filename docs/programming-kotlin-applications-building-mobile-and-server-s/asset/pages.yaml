    Chloe\", \"Herng Lee\").apply {\n    println(\"New person created: ${fullName()}\"\
    )\n}\n```\n\napply uses this reference, so there's no collision between the two\
    \ scope functions. it still refers to the first Person, David. In the apply block,\
    \ this refers the second Person, Chloe Herng Lee. So the call to fullName() is\
    \ attached to this, and should print out her name.\n\n> NOTE Once you start using\
    \ scope functions more often, you'll find you use them a lot often, and it will\
    \ be common to use scope function within another. Because most scope functions\
    \ are close to interchangeable, you may choose one function over another because\
    \ one uses it and the other uses this, or vice versa. Avoiding reference collision\
    \ is a perfectly valid reason to choose apply over let, or run over also.\nThis\
    \ sort of potential for reference collision may also cause you to rename your\
