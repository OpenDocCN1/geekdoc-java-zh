    \ indicate the platforms you want to build\nfor (which may use different versions\
    \ of the JVM), and set properties used as part of compilation and\nstructuring\
    \ of your project. Once again, the Kotlin documentation is a good place to start:\
    \ kotlin-\nlang.org/docs/reference/using-gradle.html.\n\n# WHEN KOTLIN QUESTIONS\
