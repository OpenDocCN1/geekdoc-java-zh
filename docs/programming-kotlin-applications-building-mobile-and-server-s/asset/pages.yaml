  md: 'This all boils down again (to type safety). Kotlin uses a pretty heavy hand
    here, by assuming that if you''re expecting a Set, you want a Set—and not a MutableSet.
    If you really want to work around that, you have to do it yourself, which is why
    you''ll your own init block and to call addAll().


    There''s one additional tweak that cleans this up a bit more. You can actually
    drop the init block and make this assignment when you declare the children property:


    ```

    var children: MutableSet<Person> = _children.toMutableSet()

    ```


    # Collection Properties Are Just Collections


    With this change you now have the power of collections available through the children
    property of any Parent instance. Here''s a portion of the ever-growing PersonTest
    using the filter() method of children:


    ```

    val mom = Parent("Cheryl", "Truesby", _child-brian)

    mom.children.add(rose)

    mom.children.add(Person("Barrett", "Truesby"))

    println(Cheryl''s kids: ${mom.children*})


    println(mom.children.filter { it.firstName.startsWith("BB") })

    ```


    Obviously, the reason that the children property has a filter() method is because
    it''s a collection, and that''s something that collections give you.


    For the user, though just feels like a method that''s been defined on children.
    That children is a collection is a detail that isn''t as important as having a
    children property that is useful. That''s the power of collections: lots of methods,
    and easy to wrap into a custom object.


    At this point, you''ve got a great body of knowledge on classes. In the next chapter,
    you''ll step away from classes (but only briefly!) and learn about generics and
    how those Set<Person> declarations really work.'
