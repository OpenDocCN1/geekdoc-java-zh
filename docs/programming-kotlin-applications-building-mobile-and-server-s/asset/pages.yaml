- pgno: 143
  md: "# In Sets, Ordering Is Not Guaranteed\n\nYes, you've now heard multiple times\
    \ that sets don't preserve order. They *might*. In other words, sets don't say\
    \ \"your ordering is random.\" Sets simply say, \"no promises. We can do whatever\
    \ we want with ordering of elements.\n\nFor example, Kotlin will typically default\
    \ to supplying you a `LinkedHashSet`\n\n```\nval bandSet = setOf<Band>(rockBands[0],\
    \ rockBands[1],\n    rockBands[2], rockBands[3]))\nprintln(\"${bandSet}::${class.simple}\"\
    )\n```\n\nYou'll see that `bandSet` (which contains the first four elements from\
    \ your `rockBands` list) is a `LinkedHashSet`:\n\n```\nLinkedHashSet\n[The Beatles,\
    \ The Kinks, The Rolling Stones, The Black Crowes, The Black Keys, The Kinks,\
    \ The Kinks, Bad Company]\n[The Beatles, The Kinks, The Rolling Stones, The Black\
    \ Crowes]\n```\n\n> NOTE *That you may see these items in a different order. Don't\
    \ worry about that; it's not an issue that indicates something is wrong.*\n\n\
    LinkedHashSet happens to use the order in which elements were added. So if you\
    \ compare its first four elements to the first four of `rockBands`, you'll see\
    \ that they match.\n\nBut that's not the same as a guarantee of ordering! `rockBands`\
    \ will always report ordering; `bandSet` can change that any time without violating\
    \ any of Kotlin's rules.\n\nBut use a `HashSet` (with `setOf()`) and see the difference:\n\
    \n```\nval bandSet = hashOf<Band>(rockBands[0], rockBands[1],\n    rockBands[2],\
    \ rockBands[3]))\nprintln(\"${bandSet}::${class.simple}\")\n```\n\nThe output\
    \ will not show matching first elements:\n\n```\nHashSet\n[The Beatles, The Kinks,\
    \ The Rolling Stones, The Black Crowes, The Black Keys, The Kinks, The Kinks,\
    \ Bad Company]\n[The Beatles, The Rolling Stones, The Black Crowes, The Kinks]\n\
    ```\n\nHashSet does not preserve order."
  merge: -1
  img_proc: true
- pgno: 144
  md: '# When Does Order Matter?


    Given sets that don''t order items and lists, why would you use one over the other?
    Well, notably, sets that don''t order items are typically faster when seeing if
    an item is in that set.


    > WARNING Beware that there is a difference between a set that doesn''t maintain
    order and a set that actually doesn''t maintain order. The default is LinkedHashSet,
    doesn''t maintain order but still does. That means it''s not going to be significantly
    faster in these respects than a list. If you''re looking to use a set primarily
    for speed purposes, use HashSet via hashOf() to be sure you get an unordered set.


    This mostly has to do with the use of hashes in sets (thus, HashSet). But this
    means you''ve made a commitment that order doesn''t, and that''s not always obvious.
    It''s going to depend on what you are modeling and how you are using the set.


    For example, take the list of rock bands. If you are just collecting list of bands,
    you really don''t need ordering, so a set is a great choice. But what if you are
    doing more than just collecting bands. What if:


    +   - You are collecting the bands ordered by album release

    - You are using the list as a set of bands and the order is the order in which
    they play?

    - You are alphabetizing the bands?


    In these cases, you might want to list preserve order.


    But why? Aren''t all these situations where order matters? Yes, but that may not
    require you to preserve that order within the list structure.


    # Sort Lists (and Sets) on the Fly


    Lists and sets provide a method called sortBy() which allows you to sort a list
    or set without worrying about the actual ordering of that list. Here''s an example
    that sorts the bands by the name of the band:


    ```

    println(rockBands.sortBy { band -> band.name })

    ```


    So you called sortBy() and then give it a block of code. You''re identifying a
    variable to represent the item at each list index (which in this we know is a
    Band, thanks to Kotlin strong typing), and to indicate a property to sort on.
    In this case, the band''s name is used.


    The result is a sorted output:


    ```

    [Bad Company, The Beatles, The Black Crowes, The Black Keys

    The Kinks, The Kinks, The Kinks, The Rolling Stones]

    ```


    You could save this new list to a variable, or just use it directly as is the
    case here.'
  merge: -1
  img_proc: true
- pgno: 145
  md: "So then why use a list at all? Well, you might want to keep up with the ordering\
    \ based on when something was added to the list. Or you might want to preserve\
    \ ordering because you don't have an attribute to sort by the objects in the actual\
    \ list. In these cases, you want the ordering, and you want to count on the ordering.\n\
    \n# Sets: No Duplicates, No Matter What\n\nAnother reason you might want to use\
    \ a set is that lists don't allow duplicates. Go ahead and try this and see what\
    \ happens:\n\n```\nval bandSet = hashOf<Band>(rockBands[0], rockBands[1], rockBands[2],\
    \ rockBands[3])\nprintln(\"${bandSet.class.simpleName}\")\n\n// Add a band that's\
    \ already been added\nbandSet.add(rockBands[0])\n```\n\nYou will not get an error\
    \ from Kotlin here; it will happily run this code. But the output reveals that\
    \ there's still only one of each item in the resulting set:\n\n> [The Beatles,\
    \ The Rolling Stones, The Black Crowes, The Kinks]\n\n# Sets \"Swallow Up\" Duplicates\n\
    \nYou'll notice here something: it's not an error to attempt to add a duplicate\
    \ to a set; it's just ignored. You won't see an error; you also won't see the\
    \ addition.\n\nThis is important, because you were expecting an error or a notification,\
    \ you won't get it. You can, however, use the contains() method on a set to see\
    \ if it contains an element. You can also use this as a check before adding a\
    \ new item:\n\n```\n// Add a band if it's not already in the set\nif (bandSet.contains(rockBands[0]))\
    \ {\n    println(\"bandSet already contains \\${rockBands[0]}\")\n} else {\n \
    \   bandSet.add(rockBands[0])\n}\n```\n\nAll of this talk of duplicates raises\
    \ an important question: how a set determine if an item is a duplicate? The answer\
    \ is actually yes, and you may have already thought about it: equals(x) is used.\
    \ So if a new item equals any existing item—based on return values from equals(x)—then\
    \ item isn't added to the set.\n\nTo see this fail when you might think it would\
    \ fail, look at this chunk of code:\n\n```\nvar duplicateBand = rockBands[0]\n\
    \n// Add a band if it's not already in the set\nif (bandSet.contains(duplicateBand))\
    \ {\n    println(\"bandSet already contains \\${duplicateBand}\")\n} else {\n\
    \    bandSet.add(duplicateBand)\n}\n```"
  merge: -1
  img_proc: true
