  md: "204 | CHAPTER 9 ENUMS AND SEALED, MORE SPECIALTY CLASSES\n\n# LISTING 9.1 (continued)\n\
    \n```\nprintln(\"You are frothing with power!\")\n} else {\n    println(\"Keep\
    \ it at, you'll be an admin one day!\")\n}\n```\n\n> NOTE If you want to match\
    \ the example files available for download, or just follow along exactly, this\
    \ class EnumApp.\n\nPair this class with Listing 9.2, slightly advances the User\
    \ class from Chapter 8.\n\n# LISTING 9.2: A user class with a type\n\n```\npackage\
    \ org.wiley.kotlin.user\n\ndata class User(var email: String, var firstName: String,\
    \ var lastName: String, var type: String)\n\nfun isAdmin(): Boolean {\n    return\
    \ type.equals(\"Admin\")\n}\n\noverride fun toString(): String {\n    return \"\
    $firstName $lastName with an email of $email has a user type of $type\"\n}\n\n\
    ```\n\nBuild and run this code, and you'll get a hint at the issue that enum classes—the\
    \ subject of much of this chapter—address:\n\nKeep at it, you'll be an admin one\
    \ day!\n\nWhy does this user—given a type of \"ADMIN\"—not report back as an admin?\
    \ Well, on its face, this is a capitalization issue. However, there's much more\
    \ going on worth considering.\n\n# Strings Are Terrible Type Representations\n\
    \nAt its heart, there are just a few infamous lines of code here. First, there's\
    \ the instantiation of a new User instance:\n\n```\nval bardia = User(\"bardia@gmail.com\"\
    , \"Bardia\", \"Dejaman\", \"ADMIN\")\n```"
