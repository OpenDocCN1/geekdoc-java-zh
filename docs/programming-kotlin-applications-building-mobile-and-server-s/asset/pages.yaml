- pgno: 116
  md: "# Handle Dependent Values with Custom Mutators\n\n```\nprintln(rose)\nrose.hasPartner\
    \ = false\n```\n\nKotlin reports that the setter (mutator) is private:\n\n```\n\
    Error:(11, 5) Kotlin: Cannot assign to 'hasPartner': the setter\nis private in\
    \ 'Person'\n```\n\nThis is generally good practice, because hasPartner is a dependent\
    \ value. It is always going to report based on the partner instance. So now you've\
    \ prevented code from setting its value directly.\n\n# When Possible, Calculate\
    \ Dependent Values\n\nThere's actually yet another step you can take to clean\
    \ up Person. Given that hasPartner is always dependent on partner, there's really\
    \ no need to have a hasPartner property on its own. Instead, you can represent\
    \ this as a new method on Person, and simply check the status of partner every\
    \ time the method is called.\n\nHere's what that method in Person should look\
    \ like. Go ahead and add this in:\n\n```\nfun hasPartner(): Boolean {\n    return\
    \ (partner != null)\n}\n```\n\nThe only real change is how you'd use this method\
    \ and the now-def hasPartner property is in the trailing parentheses that are\
    \ required for a method. So you would use to write this:\n\n```\nif (rose.hasPartner)\
    \ {\n    // do something\n}\n```\n\nNow you'd write this:\n\n```\nif (rose.hasPartner())\
    \ {\n    // do something\n}\n```\n\nIf you try to compile your code, you're going\
    \ to have to chase down a few errors you've created, like the use of parentheses.\
    \ Other than that, you might need to remove the code. Listing 4.11 shows Person\
    \ with all the code you should have commented out. You can comment these lines\
    \ out, but a better idea would be to remove them altogether.\n\n> LISTING 4.11:\
    \ Update Person to have a new method, hasPartner(), and remove the property of\
    \ the same name\n\n```\npackage org.wiley.kotlin.person\nclass Person(firstName:\
    \ String, lastName: String,\n//hasPartner: Boolean = false,\n    height: Double\
    \ = 0.0, _age: Int = 0) {\n\n    var firstName: String = _firstName\n    var lastName:\
    \ String = _lastName\n    var height: Double = _height\n```\n\ncontinues"
