  md: "# A vararg Argument Can Be Treated Like an Array\n\nnumbers can be treated\
    \ as an Array, which makes this bit of code work via iteration:\n\n```\nfor (num\
    \ in numbers)\n    sum += num\n```\n\nYou'll also get access to Array methods,\
    \ like size() and get() and iterator().\n\nYou can call the sum() function now\
    \ like this:\n\n```\nprintIn(calc.sum(5, 2))\n```\n\nBut you can also call it\
    \ like this:\n\n```\nprintIn(calc.sum(5, 2, 4, 6))\n```\n\nAnd this is legal,\
    \ too:\n\n```\nprintIn(calc.sum(5, 2, 4, 6, 8, 10, 12, 14, 18, 200))\n```\n\n\
    However the input argument is not an Array. In other words, this code is not legal:\n\
    \n```\nprintIn(calc.sum(10, IntArray(5)) { 42 })\n```\n\nHere, second argument\
    \ is a quick array created via IntArray, a helper function that creates arrays\
    \ like a factory. But this will result in an error:\n\n> Kotlin: Type mismatch:\
    \ inferred type is IntArray but Int was expected\n\nWhile the input vararg to\
    \ the sum() function can be treated like an Array within the function, an Array\
    \ cannot be passed to sum() as an actual argument.\n\nIn many ways, this is the\
    \ reason that vararg exists to: avoiding having to pass in an array of values.\
    \ You could easily rewrite sum() like this:\n\n```\nopen fun sum2(num: Int, numbers:\
    \ Array<Int>): Int {\n    var sum = num\n    for (num in numbers)\n        sum\
    \ += num\n}\n```\n\nThis works, but now you have to expose Array in calling the\
    \ function:\nprintIn(calc.sum2(10, Array<Int>(5)) { 42 })\n\nThis isn't necessarily\
    \ better or worse than sum() with a vararg, but calling syntax just isn't simple\
    \ and direct.\n\n# FUNCTIONS IN KOTLIN HAVE SCOPE\n\nIn addition to the rules\
    \ that govern how you write functions, functions also have scope. There are three\
    \ different scopes for a function:\n\n+   - Local\n- Member\n- Extension"
