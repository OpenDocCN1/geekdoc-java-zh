- pgno: 115
  md: "# LISTING 4.10 (continued)\n\n```\noverride fun hashCode(): Int {\n    return\
    \ (firstName.hashCode() * 28) + (lastName.hashCode() * 31)\n}\n\noverride fun\
    \ equals(other: Any?): Boolean {\n    if (other is Person) {\n        return (firstName\
    \ == other.firstName) &&\n               (lastName == other.lastName)\n    } else\
    \ {\n        return false\n    }\n}}\n```\n\nAt this point, this code would test\
    \ for yourself. Experiment with using PersonTest to add a person with a partner,\
    \ remove the person's partner, and check if they have a partner (using hasPartner).\
    \ Add a new partner, or a null partner. All of these operations should work, and\
    \ hasPartner should reflect the person's correct status.\n\n# Limit Access to\
    \ Dependent Values\n\nAt this point, things are coming along. But there's the\
    \ possibility for misuse. Suppose you put this code in PersonTest:\n\n```\n//\
    \ Create another person\nval rose = Person(\"Rose\", \"Bushnell\", brian)\nprintln(rose)\n\
    rose.hasPartner = false\n\nif (rose.hasPartner) {\n    println(\"${rose} has a\
    \ partner: ${rose.partner}.\")\n} else {\n    println(\"${rose} does not have\
    \ a partner.\")\n}\n```\n\nThis is not a good thing, because it's breaking the\
    \ connection between the partner instance and the hasPartner property. You just\
    \ fixed that in the custom mutator, now you need to make sure that nobody can\
    \ set the status of hasPartner directly. It should be completely bypassed by the\
    \ presence (or lack) of a partner instance.\n\nFortunately, Kotlin makes this\
    \ easy. You can just add the word private before the accessor (get) or mutator\
    \ (set) you want to prevent access to it. In this case, it's the mutator that\
    \ is the issue:\n\n```\nvar hasPartner: Boolean = _hasPartner\n    private set\n\
    ```\n\nNow, try to compile your program, and you will get an error if you have\
    \ code like this:\n\n```\n// Create another person\nval rose = Person(\"Rose\"\
    , \"Bushnell\", brian)\n```"
