  md: 'Additionally, with lambdas in particular, you can start to define functions
    quickly—often not even assigning them to variables—and pass them into other functions.
    You''ll find greater flexibility than ever before you use lambdas more and more.


    However, there are two things to pay careful attention to as you get into the
    world of these varying approaches to defining functions:


    +   By using it, undeclared parameters, and the result of an expression as the
    return value, it can become increasingly unclear what your code does. Comment
    often and use shortcuts carefully to avoid your code becoming confusing and unreadable
    to others (and yourself when you revisit it days or weeks after initial writing).


    +   Be careful not to get sloppy with anonymous functions and lambdas. Sometimes
    it''s easier to quickly type in a lambda, but it might be a better idea to create
    an actual function, declare it, and use it through its name. Functions really
    are about reuse.


    Regardless of how often and how semantically you use these function tools, you
    will use them. In the next chapter, you''re going to add some more Kotlin-specific
    idioms and patterns to your toolkit.'
