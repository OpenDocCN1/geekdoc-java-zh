- pgno: 214
  md: '# Common Characteristics Result in Common Usage


    Now, because this is a common set of characteristics, programmers have been creating
    classes like these and using them for nearly as long as object-oriented programming
    has existed. They have created a sort of shared body of knowledge around classes
    like this; a set of typical use cases that have been tested through time and experience.


    > NOTE It''s worth saying that in addition to simply reading other programmers
    code, you should try to understand why other programmers write their code the
    way they do. It''s great to program as much as you can; you''ll inevitably learn
    your own lessons. It''s even better to learn from others who have also been programming
    for a long time, and build a common set of what are typically called best practices
    as to how you code and use Kotlin or any other language.


    The result is that modern languages (like Kotlin) and modern versions of older
    languages (like Java) are starting to take these commonalities into account, and
    introduce them into the language itself. In the case of this set of characteristics,
    that means a new type of class emerges.


    # A DATA CLASS TAKES THE WORK OUT OF A CLASS FOCUSED ON DATA


    That heading sounds a little circular. A better approach is to simply look at
    a new take on a class definition for yours. Listing 8.2 shows a new data class
    in Kotlin.


    +   LISTING 8.2: A New User class as a data class


    ```

    package org.wiley.kotlin.user


    data class User(val email: String, val firstName: String, val lastName: String)

    ```


    That''s a remarkably tense class. It also seems to be missing most of the things
    you have to grow associate with classes: curly braces, code in the constructor,
    any secondary constructors, a useful toString(), a functional hashCode() method
    ... in fact, pretty much everything that Person is in Listing 8.1, User does not
    have in Listing 8.2.


    But it will absolutely suffice. Try it!


    # Data Classes Handle the Basics of Data for You


    To get a sense of what you can do with User—all with a few lines of code—create
    a test class. You can call it DataClassApp if you want to follow along with the
    example code. Listing 8.3 shows this class''s starting point.'
