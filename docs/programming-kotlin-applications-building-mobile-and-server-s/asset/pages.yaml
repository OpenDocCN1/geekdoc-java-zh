- pgno: 237
  md: "# LISTING 9.5 (continued)\n\n```\nfun isAdmin(): Boolean {\n    return type.equals(ADMIN)\n\
    }\n```\n\n```\noverride fun toString(): String {\n    return \"$firstName $lastName\
    \ with an email of $email has a user\ntype of $Type*\"\n}\n```\n\nThe problem\
    \ here is related to multiple instances of User existing.\n\n# Constants Must\
    \ Be Singular\n\nIt's not obvious, but the problem here has do with User being\
    \ an object that can be (and must be) instantiated. As a reminder, here's a fragment\
    \ of the test code using the User object:\n\n```\nusers.add(User(\"bardia@gmail.com\"\
    , \"Bardia\", \"Dejban\", \"ADMIN\")\nusers.add(User(\"shawn@gmail.com\", \"Shawn\"\
    , \"Khorrami\", \"Administrator\"))\n```\n\nOnce these two lines of code have\
    \ executed, there are two instances of User. Each of these instances has a constant.\
    \ The first, with a name of \"Bardia,\" has an ADMIN const, the second one, with\
    \ a name of \"Shawn\".\n\nKotlin recognizes this as a problem. The ADMIN constant\
    \ does not exist for all instances; it is a property of each User instance. For\
    \ a String constant, that's not a huge deal. Suppose the first User instance was\
    \ named bardia, and the second shawn. In that situation, you could compare bardia.ADMIN\
    \ to shawn.ADMIN and get a true result. Because String comparisons using equals()\
    \ just compare the actual String values.\n\nBut if you were using == or any version\
    \ of equals() that actually did a memory-level comparison, it's possible for a\
    \ comparison of the same constant in two instances to return false. That's a big\
    \ problem.\n\n> For the Java programmers, this is exactly what the static keyword\
    \ protects against. It tells Java to share a variable or method across all instances\
    \ of the class. That's what you want in Kotlin but you need to learn how to do\
    \ that in Kotlin.\n\nOn some level, the idea here is bardia.ADMIN and shawn.ADMIN\
    \ would not return equal values, but that would return the same value. And in\
    \ this context, the \"same\" doesn't just mean that shawn.ADMIN.equals(bardia.ADMIN)\
    \ would return true. More than that: shawn.ADMIN and bardia.ADMIN are actually\
    \ the same bit of memory, the same actual object at the lowest level.\n\nSo take\
    \ one step further. It makes it much more obvious that there is a single PROPERTY\
    \ shared across all instances of User."
