  md: "Here's a simple example of using with from the last section:\n\n```\nwith(Calculator())\
    \ {\n    println(execute(8, Operation.Add(4))\n    println(execute(12, Operation.Multiply(12)))\n\
    }\n```\n\nHere's the same code using run:\n\n```\nCalculator().run {\n    println(execute(8,\
    \ Operation.Add(4))\n    println(execute(12, Operation.Multiply(12)))\n}\n```\n\
    \nBoth bits of code output the same results:\n\n12\n144\n\n# Choosing a Scope\
    \ Function is a Matter of Style and Preference\n\nIt may odd, but programming\
    \ is least partially creative art. Scope functions are a great example of this:\
    \ you can really use a with or a run, or even a let, all to do the same thing.\
    \ In fact, here's the code we just showed using let:\n\n```\nCalculator().let\
    \ {\n    println(execute(8, Operation.Add(4))\n    println(execute(12, Operation.Multiply(12)))\n\
    }\n```\n\nSo, what's the difference? It really just comes down to style. With\
    \ let and run, you attach the scope function directly to the context object. let\
    \ uses it to reference the context object and run uses this (which means you can\
    \ omit the this in your code as it's implicit for the compiler), which looks more\
    \ like a when with, and also uses this.\n\nEach looks a bit different than the\
    \ other. run is probably most commonly used when you have an object like calculator\
    \ that you want to execute operations against. run also returns the value of the\
    \ lambda, which is useful for initializing an object instance and storing the\
    \ result of an operation—a function call—on that object.\n\nThe following is an\
    \ example of both initializing an object and storing the result:\n\n```\nvar product\
    \ = Calculator().run {\n    execute(20435, Operation.Multiply(12042))\n}\nprintln(product)\n\
    ```\n\nAgain, to be clear, there's nothing unique about this code, and it could\
    \ be written with a let:\n\n```\n// Example of run using let\nCalculator().let\
    \ {\n    it.execute(20435, Operation.Multiply(12042))\n}\n```\n\nThere's nothing\
    \ wrong here, but it does introduce the it reference, which really isn't needed.\
    \ The context object in run uses this, which makes the usage with run easier to\
    \ read and more natural."
