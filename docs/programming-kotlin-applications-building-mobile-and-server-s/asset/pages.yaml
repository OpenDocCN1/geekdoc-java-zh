    \ earlier, but with result used for the inner lambda:\n\n```\nvar result = Calculator().let\
    \ { calc ->\n    var initFunction = { 5 - 2 }\n    println(calc.add(initFunction(),\
    \ 3, 5, 3))\n    println(calc.execute(5, Operation.Add(4)))\n    println(calc.execute(2,\
    \ Operation.Add(4)))\n\ncalc.execute(5, Operation.Multiply(5)).let { result ->\n\
    \    println(\"Inner result: ${calc.execute(result, Operation.Add(12))\")\n}\n\
    ```\n\nThis isn't a bad idea, and really makes your code quite cleaner. However,\
    \ it turns out to be a prac-\ntice can be a bit of overkill. If you have a very\
    \ long lambda, you actually remove a lot of its\n\"shortness\" (and therefore,\
    \ to some extent, its value) with:\n\n```\nvar finalVal = calc.execute(5, Operation.Multiply(5)).let\
    \ { result ->\n    calc.execute(result, Operation.Add(12)) }\n```\n\n> NOTE As\
    \ a bit of case in point, the line of code in the example doesn't fit\nin a single\
    \ line of the book!\n\nIn these cases—especially where you're going to de, single\
    \ clear thing with your lambda—using it is\npreferable:\n\n```\nvar finalVal =\
    \ calc.execute(5, Operation.Multiply(5)).let { calc.execute(it,\nOperation.Add(12)\
    \ }\n```\n\nIt's much shorter and just as clear.\n\n# Chaining Scope Functions\
    \ Is Simpler and Cleaner\n\nIt is quite a easier to simply chain scope functions.\
    \ This is done through remembering a key aspect\nof any lambda expression and\
