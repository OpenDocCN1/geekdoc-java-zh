    \ for an interesting combination of events. Update PersonTest to look like this:\n\
    \n```\n// Create another person\nval rose = Person(\"Rose\", \"Bushnell\", brian)\n\
    println(rose)\nrose.partner = null\n\nif (rose.hasPartner) {\n    println(\"$rose\
    \ has a partner: ${rose.partner}\")\n} else {\n    println(\"$rose does not have\
    \ a partner.\")\n}\n```\n\nSee any issues? The output will show you a problem:\n\
    \nRose Bushnell has a partner: null.\n\nThis happens because you're allowing partner\
    \ to directly be set to null, but not updating hasPartner. That's got to be fixed.\n\
    \n> Unfortunately, when you start allowing null values, you're going to run into\
    \ this sort of issue. Kotlin tries very hard to prevent you from using null. When\
    \ you use null anyway—and there will be times it makes sense—you're going to have\
    \ to check your code a few times for issues just like this.\n\n# HANDLE DEPENDENT\
    \ VALUES WITH CUSTOM MUTATORS\n\nThe issue is that you now have two properties\
    \ that are closely related: hasPartner and partner. Right now, those values are\
    \ equal. You can set them separately, and in fact you can pass hasPartner to the\
    \ primary constructor and partner to the secondary constructor.\n\nThere's some\
    \ work to do, and it is common work; you'll often find a class (or classes) with\
    \ dependent values that need to interoperate.\n\n# Set Dependent Values in a Custom\
    \ Mutator\n\nThis is a perfect case for using your custom mutator (setter, if\
    \ you like). You saw custom mutators back in Chapter 2, although you didn't need\
    \ one here. Here, you do.\n\nWhenever a partner is set, the hasPartner property\
    \ should also be set. Simple enough:\n\n```\nvar partner: Person? = null\nset(value)\
    \ {\n    field = value\n    hasPartner = true\n}\n```"
  merge: -1
