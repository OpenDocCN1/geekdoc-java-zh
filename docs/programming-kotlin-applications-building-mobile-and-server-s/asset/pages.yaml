    \ {\n        println(formatString(it))\n    }\n}\n\nfun getRandomString(len: Int)\
    \ : String? =\n    when {\n        len < 0 -> null\n        len == 0 -> \"\"\n\
    \        len > 0 -> (1..len).map { \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzxyz\"\
    .random() }.joinToString(\"*\")\n        else -> null\n    }\n\nfun formatString(str:\
