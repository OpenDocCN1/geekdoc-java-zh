- pgno: 352
  md: "# Delegation Offers Another Option for Extending Behavior | 323\n\nLISTING\
    \ 12.26 A MODIFIED VEHICLE INTERFACE WITH A MORE GENERIC NAME FOR MOVING\n\n```\n\
    package org.wiley.kotlin.vehicle\n\ninterface Vehicle {\n  val maxSpeed: Int\n\
    \n  val purpose: String\n  get() = \"This interface models vehicles of all kinds\"\
    \n\n  fun start()\n  fun stop()\n  fun go(direction: String, speed: Int) : Int\n\
    \n  fun stats(): String {\n    return \"This vehicle is a ${this::class.simple}\
    \ and has a maximum of ${maxSpeed}\"\n  }\n```\n\nNow this change appears to break\
    \ a lot of code. Suddenly all subclasses of Car need updates, because they all\
    \ implement drive(), and not the new generic go(). This change to Vehicle and\
    \ how it affects Car is actually good—the Car is an abstract class and therefore\
    \ makes this a smooth fix. Check out Listing 12.27, which defines drive() as before,\
    \ and now implements go() to simply call drive().\n\nLISTING 12.27: Updating Car\
    \ to pass go() calls to drive()\n\n```\npackage org.wiley.kotlin.vehicle\n\nimport\
    \ org.wiley.kotlin.vehicle\n\nabstract class Car(val model: String, val color:\
    \ String) : Vehicle {\n\n  override fun go(direction: String, speed: Int) : Int\
    \ {\n    return drive(direction, speed)\n  }\n\n  abstract fun drive(direction:\
    \ String, speed: Int) : Int\n\n  override fun toString() : String {\n    return\
    \ \"${this::class.simpleName}${model} in ${color}\"\n  }\n```\n\nAt this point,\
    \ you will be able to compile all your existing classes and things will work.\n\
    \n> NOTE One possible exception is your Volkswagen class, which originally (way\
    \ back in Listing 12.17) implemented Vehicle directly. You can modify that to\
    \ also extend Car, or change its drive() function to implement go() instead."
