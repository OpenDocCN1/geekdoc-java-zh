  md: "Also take note that child is *not* a nullable property. It does not have the\
    \ ? operator:\n\n```\nvar child: Person? = _child\n```\n\nThat's because this\
    \ property is essential for a Parent and should never be null.\n\n# Don't Make\
    \ Mutable What Isn’t Mutable\n\nIt's at this point that you need to think about\
    \ an important detail. Right now, your child property is mutable, because it's\
    \ declared as a var:\n\n```\nvar child: Person? = _child\n```\n\nBut is that accurate?\
    \ Should you be able to change out a child? That doesn't really model the real\
