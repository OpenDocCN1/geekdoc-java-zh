  md: "# # 10\n# Functions and Functions and Functions\n\nWHAT'S IN THIS CHAPTER?\n\
    \n+   * Functions that take functions as arguments\n* Functions that return functions\n\
    * Anonymous functions and lambda expressions\n* Warnings about lambdas\n\n# ##\
    \ REVISITING THE SYNTAX OF A FUNCTION\n\nBy now, even if this book is your very\
    \ first introduction to Kotlin, you've seen functions hundreds of times. They\
    \ are the building blocks of Kotlin, whether you're writing a simple data class\
    \ or a sealed class with subclasses or a complicated custom class.\nIn this chapter,\
    \ you're going to get deeper into functions: both the syntax that you've been\
    \ all along, and the number of ways you can expand and stretch that syntax to\
    \ do much more interesting things.\n\n# ## Functions Follow a Basic Formula\n\n\
    Listing 10.1 is about the simplest Kotlin file possible. It's called FunctionApp.kt,\
    \ and has only one thing in it: a simple function called main().\n\nLISTING 10.1:\
    \ A super simple Kotlin class with a super simple function\n\n```\nfun main()\
    \ {\n    println(\"Here we go...\")\n}\n```"
