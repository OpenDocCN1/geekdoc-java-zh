- pgno: 112
  md: "# Handle Dependent Values with Custom Mutators\n\n> NOTE If you're hazy on\
    \ the details regarding field and value, flip back to Chapter 2 where overriding\
    \ the default mutator was first detailed. Re-read that section and then come back\
    \ here for more.\n\nThis means that code like this:\n\n```\nrose.partner = brian\n\
    ```\n\nis now essentially the same as this:\n\n```\nrose.partner = brian\nrose.hasPartner\
    \ = true\n```\n\nThis is good; it ensures that when a Person instance has a partner,\
    \ they will be set to correctly report back on Partner. But you now have some\
    \ subtle issues that still need cleanup.\n\n# All Property Assignments Use the\
    \ Property's Mutator\n\nTake a look at the current constructor for Person:\n\n\
    ```\nconstructor(_firstName: String, _lastName: String,\n  partner: Person) :\n\
    \  this(_firstName, _lastName) {\n  hasPartner = true\n  partner = _partner\n\
    }\n```\n\nWhen you assign _partner to partner, you can think of that code as being\
    \ \"replaced\" by the mutator. So what this code really becomes:\n\n```\nconstructor(_firstName:\
    \ String, _lastName: String,\n  partner: Person) :\n  this(_firstName, _lastName)\
    \ {\n  hasPartner = true\n  // partner = _partner\n  // gets expanded into this:\n\
    \  partner = _partner // field = value\n  hasPartner = true\n}\n```\n\nSee anything\
    \ interesting here? You should. hasPartner is actually set twice. Your custom\
    \ mutator is now handling assignment, so you can remove it from your constructor:\n\
    \n```\nconstructor(_firstName: String, _lastName: String,\n  partner: Person)\
    \ :\n  this(_firstName, _lastName) {\n  partner = _partner\n}\n```\n\nThis is\
    \ much cleaner now."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Nullable Values Can Be Set to null!\n\nThere's another issue, though, and\
    \ it's related to this property declaration:\n\n```\nvar partner: Person? = null\n\
    ```\n\nThe issue is that partner is allowed to take on the value of null, partner\
    \ can actually be set to null explicitly. You even did this earlier:\n\n```\n\
    // Create another person\nval rose = Person(\"Rose\"\n```\n\nRose.partner to null\
    \ is a perfectly legal assignment. Now run this code, and you're going to get\
    \ incorrect output:\n\n```\nRose Bushnell has a partner: null.\n```\n\nWhat's\
    \ going on here? Well, your mut for partner sets hasPartner to true in every case.\
    \ Should actually be checking the passed-in partner (which might be null!) and\
    \ making a decision about what to set hasPartner to check\n\nYou can check for\
    \ null in Kotlin using the == operator, like this:\n\n```\nif (value == null)\
    \ {\n    println(\"It's null!\")\n}\n```\n\nSimilarly, you can check that a value\
    \ is not null with !=, like this:\n\n```\nif (value != null) {\n    println(\"\
    It's not null!\")\n}\n```\n\nSo you now rewrite the mut for partner to check for\
    \ null, and then set hasPartner appropriately:\n\n```\nvar partner: Person? =\
    \ null\nset(value) {\n    field = value\n    if (field == null) {\n        hasPartner\
    \ = false\n    } else {\n        hasPartner = true\n    }\n}\n```\n\nThis code\
    \ is perfectly workable. However, before moving on, you can actually make this\
    \ a little simpler. In Kotlin, anytime you have an expression, that expression\
    \ itself evaluates to a Boolean: it's either true or false."
  merge: -1
  img_proc: true
- pgno: 114
  md: "So the following expression:\n\n```\nfield == null\n```\n\nis going to return\
    \ true if field is null, and false if it's not. That's almost what we want. If\
    \ field\nrepresents the partner property in this case) is null, we want hasPartner\
    \ to be false; if field\nis not null, hasPartner should be true.\n\nIn other words,\
    \ hasPartner should be set to the evaluation of the expression (field != null).\n\
    Make that change to your secondary constructor now:\n\n```\nvar partner: Person?\
    \ = null\nset(value) {\n    field = value\n    hasPartner = (field != null)\n\
    }\n```\n\nJust to make sure you've caught up, 4.10 shows the latest version of\
    \ Person.\n\n# LISTING 4.10: Person with updated constructor and a custom mutator\n\
    \n```\npackage org.wiley.kotlin.person\n\nclass Person(firstName: String, lastName:\
    \ String,\n    hasPartner: Boolean = false,\n    height: Double = 0.0, age: Int\
    \ = 0) {\n\n    var firstName: String = _firstName\n    var lastName: String =\
    \ _lastName\n    var height: Double = _height\n    var age: Int = _age\n    var\
    \ hasPartner: Boolean = _hasPartner\n    var partner: Person? = null\n    set(value)\
    \ {\n        field = value\n        hasPartner = (field != null)\n    }\n\n  \
    \  constructor(firstName: String, lastName: String,\n        partner: Person)\
    \ {\n        this(firstName, lastName)\n        partner = partner\n    }\n\n \
    \   fun fullName(): String {\n        return \"$firstName $lastName\"\n    }\n\
    \n    override fun toString(): String {\n        return fullName()\n    }\n```\n\
    \ncontinues"
