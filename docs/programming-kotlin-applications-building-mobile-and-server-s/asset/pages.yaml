- pgno: 198
  md: "condition = Random.nextBoolean()\n\nthisMightChangeThings(condition)\n\nThe\
    \ good news is while Kotlin initially allowed this sort of thing, it no longer\
    \ does. So is this is actually illegal Kotlin, and nothing to worry about any\
    \ longer.\n\n> NOTE Kotlin uses what is called \"pass by value.\" Parameters are\
    \ passed into functions as values, not \"by reference\" to the actual object or\
    \ value in memory. That means that no function can change a value passed into\
    \ it.\n\nBut if you're writing code that is multithreaded, you could actually\
    \ have a variable that is being accessed in multiple threads. That's a little\
    \ complex to show, and well beyond what this chapter gets into. However, it's\
    \ worth knowing it is possible in a multithreaded environment for two different\
    \ pieces of code to simultaneously acting on a single variable. That can create\
    \ unpredictable changes to that variable, and if it is used in your loop condition,\
    \ unpredictable evaluation of the condition.\n\n> NOTE This is a relatively brief,\
    \ incredibly general overview of threading, and not one you should get too wrapped\
    \ up in. It also doesn't mention coroutines, which are a big part of how Kotlin\
    \ handles these situations.\nThe main takeaway here is that you should know in\
    \ rare cases, it's possible for your condition to get modified without you being\
    \ aware. Consider yourself prepared!\n\n# Combine Control Structures for More\
    \ Interesting Solutions\n\nWith an if, a while, and a for you can start to do\
    \ some interesting things. Remember, when your outer loop is a while, you are\
    \ going to want something within your loop changing parts of the condition, so\
    \ that the condition might change to false at some point.\n\nHere's a bit of code\
    \ that uses multiple loops to work out the prime numbers between low and high:\n\
    \n```\nvar low = 1\nvar high = 100\n\nwhile (low < high) {\n    var foundPrime\
    \ = false\n\n    for (i in 2 .. low/2) {\n        if (low % i == 0) {\n      \
    \      foundPrime = true\n            break\n        }\n    }\n}\n```"
  merge: -1
