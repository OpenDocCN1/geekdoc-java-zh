  md: '# Try to Anticipate How Types Will Be Used


    While solution works, it''s a bit inelegant. It is going to require every user
    of your Person class—included—to add F to decimals or to use the Float type for
    variables passed into a constructor. And, as you learned, Kotlin uses Double as
    the default decimal type.


    A better solution is to realize that if Kotlin defaults to Double, maybe you should,
    too. (At least, unless you have a very good reason not to.) So change your Person
    constructor to take in what most users will pass—a Double from a typed-in number:


    ```

    class Person(var firstName: String, var lastName: String,

    var height: Double, var age: Int, hasPartner: Boolean) {

    ```


    Easy enough! And, because you anticipated how users will create a new instance
    of Person, you''ll annoy your friendly developer comrades a lot.


    > Don''t forget to remove the F from the two numbers in your main function. If
    you don''t, you''ll get another error—this time from trying to pass a Float into
    a constructor that expects a Double.


    # It''s Easy to Break Kotlin (Sort of)


    The title of this chapter is "It''s Hard to Break Kotlin," which might seem like
    the opposite of what you''re seeing. Without much effort, you''ve managed to get
    Kotlin to throw a lot of errors, and Kotlin keeps quite resistant to helping you
    out with converting between types.


    Said, Kotlin is actually breaking before your code is running in some production
    system, serving an API for a mobile app, or running on a phone or handling web
    requests. In other words, Kotlin is making you do some extra work at compile time—when
    you''re writing code—to avoid potential problems the program is running and needs
    to work.


    Put another way, the chapter might be better titled, "It''s Hard to Break Kotlin
    When It''s Running in Production Because It''s Going to Make You Really Specific
    About Types When You''re Writing Before It Gets to Production." Of course, that''s
    not really a title that anyone is going to get through editing and proofing, so
    let''s go with "It''s Hard to Break Kotlin" and trust that you know what that
    means.


    # OVERRIDING PROPERTY ACCESSORS AND MUTATORS


    With what you know about types, and strong types in particular, you''re finally
    ready to get back to that annoying little detail of Person: if you set the last
    name outside the Person constructor, printing the class instance the original
    name, not the modified one. As a refresher, here''s the code in question:


    ```

    // Create another person

    val rose = Person("Rose", "Busnell", 56.8, 32, true)

    print(rose)

    ```'
