    \ sum = num1 + num2 - num3 + num4\n    println(ab.add())\n}\n```\n\n**10.2: A\
    \ good IDE gives you default values for a function, even from a base class.\n\n\
    Note that now num2 and num3 have default values but num4 does not.\n\n> WARNING\
    \ You will have to make this change to the version of add() in Calculator, and\
    \ not the overridden version in Abacus. The version in Abacus cannot change the\
    \ default values, so the preceding code would not compile.\n\nAnytime you have\
    \ default values for arguments that precede additional arguments without default\
    \ values, some special rules come into play. If you do not manage your arguments\
    \ in the calling code—not the function itself, but the code that calls function—then\
    \ default values will be assumed. That means this code will generate a compiler\
    \ error:\n\n```\nprintln(ab.add(1, 2))\n```\n\nThere is a combination of arguments\
    \ that would make this valid. If 1 was assigned to num1 and 2 to num4, then num2\
    \ would be given a default value of 0 and num3 would also be given a default value\
    \ of 0. However, Kotlin would not be able to make this assumption.\n\nInstead,\
    \ absent any specific information to the contrary, Kotlin assumes your values\
    \ are provided to the arguments in the function order, starting with the first\
    \ argument, and proceeding to right. That means 1 goes to num1 and 2 goes to num2—regardless\
    \ of num2 and num3 having default values.\n\nIf you want to take advantage of\
    \ those default values, you'll need to use name arguments, which you've seen before.\
    \ You can call add() like this:\n\n```\nprintln(ab.add(num1 = 1, num3 = 3))\n\
    ```\n\nThis compiles, because num2 and num3 both assume their default values.\
    \ You can also skip the first argument, because Kotlin already assumes that the\
    \ first value is for num1:\n\n```\nprintln(ab.add(1, num4 = 3))\n```\n\nThis is\
    \ all made lot easier with an IDE, as you can see in Figure 10.3. Most IDEs will\
    \ do something similar and show the arguments accepted as well as their default\
    \ values, if any."
