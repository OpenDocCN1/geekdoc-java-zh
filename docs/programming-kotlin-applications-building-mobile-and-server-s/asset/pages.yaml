  md: "> **NOTE** You'll also need the Operation class from Chapter 9 in your project\
    \ to compile Calculator.\n\nIf you now subclass Calculator—call it Abacus—you\
    \ can override add(). . Listing 10.4 shows this.\n\n# LISTING 10.4: Extending\
    \ Calculator and overriding the add() function\n\n```\npackage org.wiley.kotlin.math\n\
    class Abacus : Calculator() {\n    override fun add(num1: Int, num2: Int, num3:\
    \ Int, num4: Int): Int {\n        super.add(num1, num2, num3, num4)\n    }\n}\n\
    ```\n\nThis overridden version of add() just calls the implementation of add()\
    \ from its superclass, Calculator—but not the default values of add() are left\
    \ out:\n\n```\noverride fun add(num1: Int, num2: Int, num3: Int, num4: Int): Int\
    \ {\n```\n\n# Default Values in Functions Cannot Be Overridden\n\nIn fact, you\
    \ cannot specify those values even if you update. The function signature to look\
    \ like this:\n\n```\noverride fun add(num1: Int, num2: Int, num3: Int = 0, num4:\
    \ Int = 0): Int {\n```\n\nNow compile, and you'll get this error:\n\n> Kotlin:\
    \ An overriding function is not allowed to specify default values for it if they're\
