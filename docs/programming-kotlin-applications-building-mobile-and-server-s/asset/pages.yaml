    In the latter case, Kotlin sees an object passed to println() and automatically
    runs brian.toString() and passes the result on printing. In either case, you''ll
    get output that looks something like this:


    ```

    Person@7c30a502

    ```


    That''s not very useful, is it? It''s essentially an identifier for your specific
    instance of Person that is useful to Kotlin internals and the JVM, but not much
    else. Let''s fix that.


    # Override the toString() Method


    One of the cool things about a class method is that you can write code and define
    what that method does. We haven''t done that yet, but it''s coming soon. In the
    meantime, though, what we have here is slightly different: a method that we didn''t
    write code for, and doesn''t what we want.


    In this case, you can do something overriding a method. This means replacing the
    code of the method with your own code. That''s exactly what we want to do.


    First, you need to tell Kotlin that you''re overriding a method using the override
    keyword. You use another keyword, fun, and then the name of the method to override,
    like this:


    ```

    override fun toString()

    ```


    > NOTE Earlier, you learned the difference between a function and a method. And
    toString() is definitely a method, in this case in Person. So why are you using
    the keyword? That looks an awful lot like "function," and that''s, in fact, what
    it stands for.


    The official answer is that Kotlin essentially sees a method as a function attached
    to an object. And it was easier not to use a different keyword for a standalone
    function and an actual method.


    But, if that bugs you, you''re in good company. It bugs me, too! Still, for the
    purposes of Kotlin, you define both functions and methods with fun.


    toString() adds a new wrinkle: it returns a value. It returns a String to print.
    You need to tell Kotlin that this method returns something. You do that with a
    colon after the parentheses and then the return type, which in this case is a
    String:


    ```

    override fun toString(): String

