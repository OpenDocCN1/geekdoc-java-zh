  md: "# 112 | CHAPTER 5 LISTS AND SETS AND MAPS, OH MY!\n\nnot ordered and cannot\
    \ store duplicate items. A map is actually quite a bit different than either and\n\
    uses key-value pairs.\n\nYou'll quickly find it's easy to determine which type\
    \ you need, and lists are often most common. If\ny want to have something that\
    \ behaves like an array—items are in an order, items can be accessed\nby index,\
    \ and don't care about duplicates—then go with a list.\n\n# Order Gives You Ordered\
