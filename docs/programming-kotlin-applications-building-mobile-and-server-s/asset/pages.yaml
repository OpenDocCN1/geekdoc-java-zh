    \ ${user.lastName} is frothing with power!\");\n  } else {\n    println(\"${user.firstName}\
    \ ${user.lastName} is still working at... maybe one day!\");\n  }\n}\n\n```\n\n\
    These two bits of code—Listing 9.8 and 9.9—are exactly the same when executed.\
    \ So then the question that plagues anxious developers is: if both are OK, which\
    \ is better?\n\n# Using Companion Object's Name Is Stylistic\n\nHonestly, neither\
    \ is better. There's an argument to be made that adding Factory makes the code\
    \ a clearer, a little more self-documenting. It becomes really obvious that the\
    \ createAdmin() and createManager() functions are factory functions, and also\
    \ likely singletons, because of the nature of factory methods in general.\n\n\
    > It's common, and even expected, that factory methods are generally written as\
    \ singletons, they don't typically maintain state. There to do one thing: create\
    \ object instances.\n\nSo adding the Factory companion object name is a little\
    \ clearer. Of course, that only helps the companion object is named Factory, or\
    \ something else helpful (maybe UserCreator or UserFactory, although Factory on\
    \ its is pretty good).\n\nBut also note that it really doesn't help much to add\
    \ Factory in referencing the constants in that companion object. This code is\
    \ pretty clear:\n\n```\nusers.add(User(\"bardia@gmail.com\", \"Bardia\", \"Dejban\"\
    , User.ADMIN))\nusers.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\", User.ADMIN))\n\
    ```\n\nThis code actually introduces the companion object name without much value:\n\
    \n```\nusers.add(User(\"bardia@gmail.com\", \"Bardia\", \"Dejban\", User.Factory.ADMIN))\n\
    users.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\", User.Factory.ADMIN))\n\
    ```\n\nSo it can become a little bit of a mixed bag; sometimes you may use the\
    \ companion object, and sometimes you may not. It really is a matter of style\
    \ and choice. Again, if you simply choose the option in a given situation that\
    \ makes for the clearest code, you're usually making a good choice—even if you're\
    \ not totally consistent."
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Companion Object Names Are Hard\n\nIt's worth pointing out that getting the\
    \ right companion name is often really hard... or it's really easy. If that sounds\
    \ odd, think about a couple of things that are in play when naming your companion\
    \ object:\n\n+   - Any object (like User) can only have *one* companion object.\n\
    - Anything that must be single-instance, shared across instances, or a singleton\
    \ must be in that companion object.\n- Often, high-level classes (like User, that\
    \ may have multiple subclasses) need to share functionality (like factory methods)\
    \ and constants (like User.MANAGER and User.ADMIN).\n\nIf you don't have to represent\
    \ both constants and factory methods, naming is easy. Listing 9.10 shows a version\
    \ of *User* with just constants, a companion object named *Constants*, and results\
    \ in a very clear, self-documenting object.\n\n# LISTING 9.10: The User object\
    \ with just constants in the companion object\n\n```\npackage org.wiley.kotlin.user\n\
    \ndata class User(var email: String, var firstName: String, var lastName: String,\
    \ var type: String) {\n    companion object Constants {\n        const val ADMIN\
    \ = \"Admin\"\n        const val MANAGER = \"Manager\"\n        const val END_USER\
    \ = \"End User\"\n        const val DEFAULT = END_USER\n    }\n\n    fun isAdmin():\
    \ Boolean {\n        return type.equals(ADMIN)\n    }\n\n    override fun toString():\
    \ String {\n        return \"$firstName $lastName with email of $email as a user\
    \ type of $type\"\n    }\\}\n```\n\nThat's easy. But as soon as you add the factory\
    \ methods (like Listing 9.7 earlier), then neither Constants nor Factory works\
    \ for everything in the companion object.\n\nSo, what do you do? Well, you can\
    \ avoid the problem altogether, as you'll see next, and later in the chapter,\
    \ you'll see a way to handle constants in yet another manner and avoid the problem\
    \ in a different way."
  merge: -1
  img_proc: true
- pgno: 244
  md: "# You Can Skip the Companion Object Name Altogether\n\nIf you look all the\
    \ way back at Listing 9.6, you'll see that companion objects don't have to have\
    \ names. In fact, Listing 9.11 has all the constants and helper functions that\
    \ you've added to User's companion object, but this time without a companion object\
    \ name.\n\n# LISTING 9.11: User with an unnamed companion object\n\n```\npackage\
    \ org.wiley.kotlin.user\n\ndata User(var email: String, var firstName: String,\
    \ var lastName: String,\nvar type: String) {\n\tcompanion object {\n\t\\const\
    \ val ADMIN = \"Admin\"\n\t\\const val MANAGER = \"Manager\"\n\t\\const val END_USER\
    \ = \"End User\"\n\t}\n\n\\fun createAdmin(email: String, firstName: String, lastName:\
    \ String): User {\n\treturn User(email, firstName, lastName, ADMIN)\n\t}\n\nfun\
    \ createManager(email: String, firstName: String, lastName: String): User {\n\t\
    return User(email, firstName, lastName, MANAGER)\n\t}\n\nfun isAdmin(): Boolean\
    \ {\n\treturn type.equals(ADMIN)\n\t}\n\noverride fun toString(): String {\n\t\
    return \"$firstName $lastName with an email of $email has a User\ntype of \"$type\"\
    \n\t}\n```\n\n> NOTE If you're following along, you may get some compilation errors\
    \ after making the change shown in Listing 9.11. You'll need to remove any references\
    \ to Factory in your test class to get rid of those issues.\n\nThis is a sort\
    \ of \"best of both worlds\" approach, although it could also be seen as a \"\
    worst of both worlds\" approach, too. On the upside, you no longer have constants\
    \ in a companion object called Factory, or factory methods in a companion object\
    \ called Constants. You also don't have to decide in your classes whether to add\
    \ the companion object name."
  merge: -1
  img_proc: true
- pgno: 245
  md: "On the downside, you’re getting less specificity, and it’s easy to throw anything\
    \ into the companion object. A name like Constants or Factory gives lest subtle\
    \ guidance; a nameless companion object does not.\n\nRegardless, this is an option,\
    \ and does provide consistency and some naming benefits.\n\n# ENUMS DEFINE CONSTANTS\
    \ AND PROVIDE TYPE SAFETY\n\nThere remains a different path for constants, though.\
    \ First, you should recognize that even with a companion object—whether it called\
    \ Factory or Constants, or is nameless—there is still a potential for misuse.\
    \ Look at the declaration for the User class’s primary constructor:\n\n```\nclass\
    \ User(var email: String, var firstName: String, var lastName: String, var type:\
    \ String)\n```\n\nNow, even with constants like User.ADMIN and User.MANAGER, you’re\
    \ just passing in a String. User.ADMIN is a String (\"Admin\") and User.MANAGER\
    \ is a String (\"Manager\").\n\nHere’s how you prefer users work with the User\
    \ class:\n\n```\nusers.add(User(\"bardia@gmail.com\", \"Bardia\", \"Dejban\",\
    \ User.ADMIN\\))\nusers.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\"\
    , User.MANAGER\\))\n```\n\nBut here’s perfectly legal bit of code:\n\n```\nusers.add(User(\"\
    bardia@gmail.com\", \"Bardia\", \"Dejban\", \"ADMIN\\))\nusers.add(User(\"shawn@gmail.com\"\
    , \"Shawn\", \"Khorrami\", \"Administrator\"))\n```\n\nSo all the work to define\
    \ constants and use those in your equals() method really doesn’t provide any type\
    \ safety. You are still allowing any String as input, and that String might match\
    \ your constants, it might not, and it might be mistyped or miscapitalized complete\
    \ gibberish.\n\nYou want more than just predefined String values. You actually\
    \ want full-blown type safety, where you define a new type—in this case, something\
    \ like UserType—and limit the available types. Your User instances then only accept\
    \ the types defined by UserType.\n\n# Enum Classes Provide Type-Safe Values\n\n\
    An enum is a special type of class that provides exactly what you need in this\
    \ situation: specific values and a new type that can be used in your classes.\n\
    Listing 9.12 is a simple enum that defines a new type: UserType. You just preface\
    \ the class keyword with enum, in the same way that you preface the class keyword\
    \ with data for data classes.\n\n> LISTING 9.12: A new UserType\n\n```\npackage\
    \ org.wiley.kotlin.user\nenum class UserType {\n\tADMIN,\n```"
  merge: -1
  img_proc: true
- pgno: 246
  md: "# MANAGER,\nEND_USER\n\nThis is an incredibly simple class that is going to\
    \ provide a lot more in terms of type safety than String constants. You can access\
    \ the constants by the class name and the constant name, just as you have been\
    \ doing: UserType.ADMIN, UserType.MANAGER, UserType.END_USER.\n\nThe key difference\
    \ in and companion objects is that the String constants in a companion object\
    \ are String types, and here, you've defined a new type, UserType.\n\nThat means\
    \ you can update User to UserType as the input type for the type property, as\
    \ you update the equals() method. Finally, you can remove the constants from the\
    \ companion object. The result is shown in Listing 9.13.\n\nLISTING 9.13: Using\
    \ the UserType enum in User\n\n```\npackage org.wiley.kotlin.user\n\ndata class\
    \ User(email: String, firstName: String, var lastName: String, var type: UserType)\
    \ {\n    companion object {\n        const val ADMIN = \"Admin\"\n        const\
    \ val MANAGER = \"Manager\"\n        const val END_USER = \"End User\"\n     \
    \   const val DEFAULT = END_USER\n    }\n\n    fun createAdmin(email: String,\
    \ firstName: String, lastName: String): User {\n        return User(email, firstName,\
    \ lastName, UserType.ADMIN)\n    }\n\n    fun createManager(email: String, firstName:\
    \ String, lastName: String): User {\n        return User(email, firstName, lastName,\
    \ UserType.MANAGER)\n    }\n\n    fun isAdmin(): Boolean {\n        return type.equals(UserType.ADMIN)\n\
    \    }\n\n    override fun toString(): String {\n        return \"$firstName $lastName\
    \ with an email of $email has a user $type\"\n    }\n}\n```\n\nYou have now removed\
    \ stray types from being used and removed the possibility of a random String being\
    \ supplied by other code.\n\nListing 9.14 shows an updated version of the test\
    \ class that takes advantage of the UserType enum."
  merge: -1
  img_proc: true
- pgno: 247
  md: "# LISTING 9.14: Creating users with a specific UserType\n\n```\nimport org.wiley.kotlin.user.User\n\
    import org.wiley.kotlin.user.UserType\n\nfun main() {\n    val users = mutableListOf<User>()\n\
    \    users.add(User(\"bardia@gmail.com\", \"Bia\", \"Debjan\", UserType.ADMIN))\n\
    \    users.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\", UserType.ADMIN\
    \ ))\n\n    users.add(User.createAdmin(\"bahar@gmail.com\", \"Bahar\", \"Debjan\"\
    ))\n    users.add(User.createManager(\"bastion@email.com\", \"Bastion\", \"Fennell\"\
    ))\n\n    for (user in users) {\n        if (user.isAdmin()) {\n            println(\"\
    ${user.firstName} ${user.lastName} is frothing with power!\")\n        } else\
    \ {\n            println(\"${user.firstName} ${user.lastName} is still working\
    \ at it...\n            may be one day!\")\n        }\n    }\n}\n```\n\nCreating\
    \ a User with a type is shown, the factory methods on the User's companion object\
    \ work with the changes introduced in Listing 9.13.\n\n# Enums Classes Are Still\
    \ Classes\n\nAlthough enums typically are used to provide type-safe constants,\
    \ they are still classes. That means they can override methods and define behavior.\
    \ For example, suppose you want to define a custom implementation of toString().\
    \ You can do that, as shown in Listing 9.15.\n\n# LISTING 9.15: Overriding a method\
    \ in an enum\n\n```\npackage org.wiley.kotlin.user\nenum class UserType {\n  \
    \  ADMIN,\n    MANAGER,\n    END_USER;\n\n    override fun toString(): String\
    \ {\n        return \"User type of ${name}\";\n    }\n}\n```\n\nIt's important\
    \ to note that this looks like any other class that overrides behavior from the\
    \ implicitly inherited Any class. But there is one wrinkle: the use of a property\
    \ called name."
  merge: -1
  img_proc: true
- pgno: 248
  md: "# Enums Give You the Name and Position of Constants\n\nname is a property you\
    \ get in all enums. It will report the specific name of the object chosen, in\
    \ this case, ADMIN or MANAGER or END_USER. So you might use that like this:\n\n\
    ```\nprintln(user.type);\n```\n\nYou'd get something back like:\n\n```\nUser type\
    \ of MANAGER;\n```\n\nYou also get access to ordinal, which will give you the\
    \ numeric index of the constant you've chosen. This seems odd until you know an\
    \ enum as essentially a list of constant objects.\n\nSo for UserType, this is\
    \ the simple declaration without any overridden functions:\n\n```\nenum class\
    \ UserType {\n  ADMIN,\n  MANAGER,\n  END_USER;\n}\n```\n\nordinal for 0, MANAGER\
    \ would report 1, and END_USER 2.\n\nYou won't use ordinal as often, but name\
    \ is quite helpful.\n\n# Each Constant in an enum Is an Object\n\nIn addition\
    \ to an enum itself being a class, each constant is basically an anonymous object.\
    \ This means that they, too, can define functions and behavior.\n\nListing 9.16\
    \ adds a custom toString() implementation for just the ADMIN constant.\n\n> LISTING\
    \ 9.16: Overriding a function in a particular constant object\n\n```\npackage\
    \ org.wiley.kotlin.user\n\nenum class UserType {\n  ADMIN {\n    override fun\
    \ toString(): String {\n      return \"Administrator\"\n    },\n  MANAGER,\n \
    \ END_USER;\n\n  override fun toString(): String {\n    return \"User type of\
    \ ${name}\"\n  }\n}\n```\n\nNow try this code snippet:\n\n```\nprintln(UserType.ADMIN)\n\
    println(UserType.MANAGER)\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: "The first line prints:\n\nAdministrator\n\nThis is using the overridden version\
    \ of `toString()` specific to `UserType.ADMIN`.\n\nThe second line prints:\n\n\
    User type of MANAGER\n\nThis is using the version of `toString()` overridden by\
    \ the enum, but nothing specific to MANAGER (other than the `name` property of\
    \ that constant).\n\n# Each Constant Can Override Class-Level Behavior\n\nAlthough\
    \ you've not dealt with abstract definitions yet (they're coming soon!), consider\
    \ Listing 9.17.\n\n> LISTING 9.17: Defining a function to be overridden by constant\
    \ objects\n\n```\npackage org.wiley.kotlin.user\n\nenum class UserType {\nADMIN\
    \ {\n    override fun toString(): String {\n        return \"Administrator*\n\
    \    }\n    override fun isSuperUser() = true\n}\nMANAGER {\n    override fun\
    \ isSuperUser() = false\n}\nEND_USER {\n    override fun isSuperUser() = false\n\
    }\n\noverride fun toString(): String {\n    return \"User type of ${name}\"\n\
    }\nabstract fun isSuperUser(): Boolean\n}\n```\n\nHere, the enum defines a function—`isSuperUser()`—and\
    \ declares it as `abstract`. This requires the constant objects defined in the\
    \ enum to implement that, which each does.\n\nNow you can call `isSuperUser()`\
    \ on any `UserType` instance:\n\n```\nif (users.first().type.isSuperUser()) {\n\
    \    println(\\*The first user has super access*\")\n}\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "# Sealed Classes Are Type-Safe Class Hierarchies | 221\n\nAt this point, you\
    \ have a pretty extensive and configurable tool—enums—for representing constant\
    \ values. You don't have to rely on constants that don't provide type safety,\
    \ and you don't have to worry about naming of companion objects.\n\nYou also get\
    \ actual classes, with constant objects (not strings or other data types) that\
    \ can define their own behavior and even override functions upon the inheritance\
    \ tree.\n\nBut what if you want more than a constant? What if you want this same\
    \ level of type safety and you want it in a class hierarchy? This is where sealed\
    \ classes come in.\n\n# SEALED CLASSES ARE TYPE-SAFE CLASS HIERARCHIES\n\nSuppose\
    \ you wanted model luxury automobiles in Kotlin. Maybe you're building a site\
    \ that allows luxury cars to be traded in an online process, and you need an object-based\
    \ system for representing the different types of cars that could be traded.\n\n\
    You might start with an Auto class, something very simple, like Listing 9.18.\n\
    \nLISTING 9.18: A very simple Auto class\n\n```\npackage org.wiley.kotlin.auto\n\
    \ndata class Auto(var make: String, var model: String) {\n}\n```\n\nThis class\
    \ is a data class, which is great. You're probably also thinking that it could\
    \ use an enum, and that's true. You might add it to an enum for popular makes,\
    \ like that shown in Listing 9.19.\n\nLISTING 9.19: The beginning of an enum with\
    \ makes of automobiles\n\n```\npackage org.wiley.kotlin.auto\n\nenum class Make\
    \ {\n    ALFA_ROMEO,\n    AUDI,\n    BMW,\n    CADILLAC,\n    JAGUAR,\n    LAND_ROVER,\n\
    \    LEXUS,\n    MASERATI,\n    MERCEDES\n}\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 222 | CHAPTER 9 ENUMS AND SEALED, MORE SPECIALTY CLASSES


    > > WARNING For the luxury car fans out there, this Auto enum is woefully incomplete,
    and a lot of time could be spent debating which makes belong and which doesn''t.
    Please take this list as representative, and not exhaustive!


    You could change the primary constructor to Auto to use this enum for the make:


    ```

    data class Auto(var make: Make, var model: String) {

    ```


    This doesn''t change much about Auto, but it does now ensure safety, and also
    that an Auto instance doesn''t have a make that doesn''t exist, is misspelled,
    or isn''t included in the luxury list. So far, it seems using enums and data classes
    is sufficient.


    # Enums and Class Hierarchies for Shared Behavior


    At this point, you could build Auto with a drive() function, perhaps a featureList()
    function that returns your models'' features, and a whole addition of behavior.
    Then, you could build the behavior for the class. Some of it will be—really you
    need a drive() function that''s different for each model—and some might exist
    on the constant objects in Model.


    You could model this with a class hierarchy. Instead of using the Enum, you could
    create a base class Auto, and extend that class with a Lexus and Jaguar and Maserati
    subclass. Each would extend Auto, and each would override any needed behavior.


    There''s nothing wrong with this approach. It''s like the correct approach, because
    accurately models the hierarchy between a more basic type, Auto, and more specific
    types, Lexus, Jaguar, and others. The base type has them add or override Auto
    with behavior that is specific to that subclass.


    Additionally, you can add additional subclasses. When the Genesis make out, you''d
    just add as a new subclass, or as a new constant in the Make.


    But there are some cases where this approach doesn''t work well, and where sealed
    classes come in.


    # Sealed Classes Address Fixed Options and Non-Shared Behavior


    It''s time to revisit your high school mathematics course. Remember those days?
    You had a set of values and a set of operators, and those operators could be applied
    to values. The basic operations were addition, subtraction, multiplication, and
    division. It''s really it. There were some more—exponents and roots—that are less
    common but total to six.


    Once you knew six operations, you were more or less done. That was—the usage got
    complex, but the operators stayed basically the same. So suppose you wanted to
    build a calculator program in Kotlin. You''d need to represent these operations.'
