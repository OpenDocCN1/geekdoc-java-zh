- pgno: 167
  md: 'But covariance has another constraint; covariant types only return the type
    E, but they also cannot accept the type E. That means you won''t be able to add()
    to a List<Parent> with Parent instances. You can either get Parent instances out,
    or you can put Parent instances (like a MutableList). But you can''t do both.


    So, to recap:


    +   - Covariant types, using the word out, return type E, but cannot take E as
    an input parameter to methods. The List<E> type in Kotlin is covariant.

    - Invariant types, which do not use out, can take E as input type E, but cannot
    be cast to types that do not exactly match them. The MutableList<E> type in Kotlin
    is invariant.


    Of course, this makes sense, the most important thing to think about is that a
    mutable class is its ability to be mutated—which means it needs to take in its
    type (E). That knocks out covariance for mutable collections.


    # Covariance Is Really about Making Inheritance Work The Way You Expect


    If you think about it, all of this discussion is really making explicit what you
    likely expect to happen. Covariance allows a class typed as RockBand to work as
    an input for something that expects a class typed as Band. Similarly, you can
    accept a List<Person> as input when you expect a List<Parent>. and that''s important
    to remember.


    Another important way to think about this is that a covariant class is a producer.
    The out keyword tells you that the class will produce:


    ```

    interface List<out E> {

    ```


    This list is now a producer of type E. So if you have a List<Person>, the list
    produces E. Producers are covariant. The cost for being a producer is that the
    list cannot take arguments as E.


    Next up, you''re going to see another type of variance: contravariance, or consumers.
    They are in many ways the mirror image of covariants.


    # CONTRAVARIANCE: BUILDING CONSUMERS FROM GENERIC TYPES


    So you''ve seen how you can limit the output type of a type, and by doing so,
    allow for inheritance to work in intuitive ways. But what about mutable types?
    What about types where you want to focus on what goes into the class, rather than
    what comes out? That''s contravariance.'
