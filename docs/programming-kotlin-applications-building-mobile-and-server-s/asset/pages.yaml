- pgno: 347
  md: "This isn't state. It's essentially a fixed value that is now available on all\
    \ implementations of Vehicle. Every instance of Car and Motorcycle will have a\
    \ purpose property, and the value for all of them when called is the string defined\
    \ in Vehicle:\n\n```\nprintln(car.purpose)\n```\n\nYou won't find these with fixed\
    \ values defined often, because you typically want properties to be stateful—to\
    \ change with each instance. This is sort of a constant for all interface implementations,\
    \ which turns out not to be useful most of the time.\n\n> NOTE There is one pretty\
    \ good use case for fixed-value properties in interface. You'll see this use in\
    \ the section on interfaces that implement other interfaces, coming up shortly.\n\
    \n# Interfaces Define Function Bodies\n\nOne thing that interfaces in Kotlin can\
    \ that surprise you is define a function and that behavior. It might seem a little\
    \ odd; an interface has no properties that define state, so what would a function\
    \ do? You've already seen a good example of this. Remember this version of toString()\
    \ in the abstract class:\n\n```\noverride fun toString(): String {\n    return\
    \ \"$${this::class.simpleName} in ${color}\"*\n}\n```\n\nYou could come with something\
    \ similar without the model property for the Vehicle interface:\n\n```\nfun stats():\
    \ String {\n    return \"This vehicle is a ${this::class.simpleName}\" and has\
    \ a maximum speed of \\${maxSpeed}\"\n}\n```\n\nNow this might look a bit odd.\
    \ At first glance, isn't this breaking the rule about an interface maintaining\
    \ state? No, it's not actually the interface maintaining state; it's the concrete\
    \ implementation somewhere within the inheritance chain. Actual instance will\
    \ have its own maxSpeed that must be handled—the maxSpeed property is defined\
    \ in the Vehicle interface but implemented elsewhere.\n\nIn fact, go back to your\
    \ sample code (last in Listing 12.15), and make this addition to the loop that\
    \ goes through the list of Car instances:\n\n```\nvar cars : List<Car> = loadCars(10)\n\
    for (car in cars) {\n    println(car.stats())\n    car.start()\n    car.drive(\"\
    E\", Random.nextInt(0, 200))\n    car.stop()\n}\n```"
