    \ (input.toFloat()).pow(operation.value.\ntoFloat().toInt()\n}\n }\n```\n\n```\n\
    return returnVal;\n }\n```\n\nIn this case, the rule applies because the when\
    \ is the right-hand side of an assignment to returnVal.\nThe when is missing the\
    \ Operation.Multiply and Operation.Divide subclasses, so an error occurs at compilation.\n\
    \nIt's important to note that if you did another subclass to Operation, every\
    \ when you have is going to immediately break (unless you use else, which is covered\
    \ next).\n\n# else Clauses Usually Don't Work for Sealed Classes\n\nIt is technically\
    \ legal to use an else clause in your when to ensure that all subclasses of a\
    \ sealed class are handled. 9.26 shows a version of Calculator that uses an else\
    \ and is perfectly Kotlin code.\n\nLISTING 9.26: Adding an else to a when\n\n\
    ```\npackage org.wiley.kotlin.math\n\nimport kotlin.math.pow\n\nclass Calculator\
    \ {\nfun execute(input: Int, operation: Operation): Int {\nval returnVal: Int\
    \ = when (operation) {\nis Operation.Add -> input + operation.value\nis Operation.Subtract\
    \ -> input - operation.value\n// Operation.Multiply -> input * operation.value\n\
    // Operation.Divide -> input / operation.value\nis Operation.Raise -> (input.toFloat()).pow(operation.value)\n\
    toFloat()..toInt()\nelse -> throw Exception(\"Operation not yet supported\")\n\
    }\nreturn returnVal;\n}\n\n```\n\nGenerally speaking, in Listing 9.26 turns out\
    \ to be the only sort of else that makes sense for a sealed class. The else is\
    \ a true-catch, but rather invoking shared behavior for multiple subclasses of\
    \ Operation, it throws an Exception to indicate that the functionality is not\
    \ explicitly covered.\n\nIn other words, this is a rather unusual case where multiple\
    \ subclasses of a sealed class (in this case, Operation) share behavior, even\
    \ if that behavior is their unimplemented. But it calls out the point, especially\
    \ if you go back to the criteria for sealed classes earlier."
