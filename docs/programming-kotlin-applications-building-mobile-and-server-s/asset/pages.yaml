- pgno: 118
  md: "You can also remove the hasPartner() code altogther. Listing 4.12 shows the\
    \ completed version of Person.\n\n# LISTING 4.12: Moving from a function back\
    \ to a property, but this time, a read-only one\n\n```\npackage org.wiley.kotlin.person\n\
    open class Person(_firstName: String, _lastName: String,\n_height: Double = 0.0,\
    \ _age: Int = 0) {\n\n    var firstName: String = _firstName\n    var lastName:\
    \ String = _lastName\n    var height: Double = _height\n    var age: Int = _age\n\
    \    var hasPartner: Boolean\n    get() = (partner != null)\n\n    var partner:\
    \ Person? = null\n\n    constructor(_firstName: String, _lastName: String,\n \
    \                this(_firstName, _lastName) {\n        partner = _partner\n \
    \   }\n\n    fun fullName(): String {\n        return \"$firstName $lastName\"\
    \n    }\n\n    fun hasPartner(): Boolean {\n        return (partner != null)\n\
    \    }\n\n    override fun toString(): String {\n        return fullName()\n \
    \   }\n\n    override fun hashCode(): Int {\n        return (firstName.hashCode()\
    \ * 28) + (lastName.hashCode() * 31)\n    }\n\n    override fun equals(other:\
    \ Any?): Boolean {\n        if (other is Person) {\n            return (firstName\
    \ == other.firstName) &&\n                   (lastName == other.lastName)\n  \
    \      } else {\n            return false\n        }\n    }\n}\n```\n\nIs this\
    \ better than using a hasPartner() function? Not particularly; it's functionally\
    \ equivalent. However, it's probably a little more idiomatic. In other words,\
    \ Listing 4.12 is a little more how an experienced Kotlin programmer would write\
    \ the Person class."
