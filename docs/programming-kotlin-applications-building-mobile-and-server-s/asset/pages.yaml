  md: "Like you've already seen with much of Kotlin, you'll need to make decisions\
    \ on the type of collection you want to work at creation time. And most of the\
    \ time when you need collections, you'll begin with lists. Listing 5.1 shows a\
    \ super simple test program CollectionTest.kt that you can use to start experimenting\
    \ with this chapter.\n\n# Listing 5.1: Beginning to play with lists\n\n```\nfun\
    \ main() {\n    var rockBands = mutableListOf(\"The Black Crows\", \"Led Zeppelin\"\
    , \"The Beatles\")\n    println(rockBands)\n}\n```\n\nThis does just what it looks\
    \ like: creates a mutable (changeable) list of things. In this case, the list\
    \ holds strings. println() uses the list's built-in toString() method to output\
    \ the following:\n\n[The Black Crow, Led Zeppelin, The Beatles]\n\nYou can see\
    \ that by default, a list prints its members separated by commas. You'll also\
    \ notice what will become a very familiar pattern in Kotlin when working with\
    \ collections:\n\n+   1. Create the collection\n2. Use the collection\n\nThose\
    \ steps seem obvious, but it's important to take a minute to see that the creation\
    \ of a list (or map) in Kotlin doesn't work quite how you might expect.\n\n# Collection\
    \ is a Factory for Collection Objects\n\nCollection uses a loose form of the factory\
    \ pattern, a common design pattern written about depth in Design Patterns: Elements\
    \ of Reusable Object-Oriented Software, already referenced earlier in this book.\
    \ It's a pattern that describes a creation of objects (like a collection) without\
    \ the use of the new key or object instantiation.\n\nYou've creating Person instances\
    \ like this:\n\n```\nval brian = Person(\"Brian\", \"Truesby\", 68.2, 33)\n```\n\
    \nBut you didn't do something similar for creating a new list. You did not this:\n\
    \n```\nvar rockBands = List(\"The Black Crows\", \"Led Zeppelin\", \"The Beatles\"\
    )\n```\n\nInstead, you used mutableListOf():\n\n```\nvar rockBands = mutableListOf(\"\
    The Black Crows\", \"Led Zeppelin\", \"The Beatles\")\n```\n\nIn fact, mutableListOf()\
    \ is a method on Collection, not List. It's declared like this:\n\n```\npublic\
    \ inline fun <T> mutableListOf(): MutableList<T> = ArrayList(\n```"
