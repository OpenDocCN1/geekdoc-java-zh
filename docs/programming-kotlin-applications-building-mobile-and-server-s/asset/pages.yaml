    # ## Higher-Order Functions Accept Functions as Arguments


    You''ve come across something very important in this little line of code:


    ```

    println(funVar(2))

    ```


    println() is a higher-order function in Kotlin. Higher-order functions are functions
    that can take as arguments other functions. So here, you''re actually passing
    a function (referenced by funVar) into the println() function. The function is
    treated like any other value, and is accepted by println() without an issue.


    Note the definition of println() from Kotlin itself:


    ```

    fun println(message: Any)?

    ```


    Because this function takes Any (or nothing, which is the signature of the ?),
    it can accept function arguments. Consider if the signature were:


    ```

    fun println(message: String)?

    ```


    This no longer compile in cases you passed a function argument into println().


    Any function that accepts a function is called a higher-order function.


    # ## The Result of a Function Is Not a Function


    Before going further down this road


    ```

    open fun sum(num: Int, vararg numbers: Int): Int {

    ```


    Now suppose you had another anonymous function defined and you passed that into
    add():


    ```

    calc.add({ 5 - 2 }, 3 })

    ```


    This will not compile. You''ll get an error like this:


    ```

    Kotlin: Type mismatch: inferred type () -> Int Int was expected

    ```


    add() says it takes an Int, and the result of executing the anonymous function
    is an Int, this code actually passes the function in the itself. You can see this
    more clearly if you break up the statements:


    ```

    var calc = Calculator()

    var intFunction = { 5 - 2 }

    calc.add(intFunction, 3, 5, 3)

    ```


    intFunction is a function, not an Int. You''ll get the same error, and it''s even
    clearer why: giving add() the wrong argument type.'
