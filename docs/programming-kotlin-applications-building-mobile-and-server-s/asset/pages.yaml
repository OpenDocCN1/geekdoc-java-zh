- pgno: 100
  md: "That's the idea: whenever possible, simple code, using inheritance, gets the\
    \ job done better than thou-sands of lines of code.\n\n> NOTE Obviously, at times\
    \ you are going to need a lot more complexity. But the point here is those times\
    \ are probably less than you think. Especially if you plan on writing mobile applications\
    \ using Kotlin, you're going to want to keep things simple. The more code you\
    \ write, the larger your program, and that is an issue even on today's hard-drive-sized\
    \ phones.\n\n# # Keep It Flexible, Stupid\n\nThis is admittedly not a childish\
    \ saying—but maybe it should. So far, you've been creating a simple Person class,\
    \ and the main concern has been its properties and overriding equals(x) and hashCode().\n\
    \nOne thing that hasn't been discussed is really thinking how this class will\
    \ be used—both by programs and other classes. That's another topic we are going\
    \ to see through later. Every decision you make about Person affects programs\
    \ that use Person, and other objects that may extend Person.\n\nTo help you think\
    \ about this as we get into the chapter, consider Listing 4.2, a very simple class\
    \ Square.\n\n# LISTING 4.2: Basic class to \"draw\" a square\n\n```\nopen class\
    \ Square {\n    val length: Int = 12\n\n    fun drawSquare() { println(\"Drawing\
    \ a square with area \" + \n      (length * length)) }\n}\n```\n\nThis class defines\
    \ (shockingly!) how to draw a Square. No big deal, right?\n\n> NOTE You'll see\
    \ some new pieces of syntax here that you don't need to worry about right now:\
    \ the open keyword or the use of get(). You'll learn about throughout the rest\
    \ of this chapter. For now, focus on the basic class and that drawSquare() method.\n\
    \nBut this class is not very flexible; in fact, it's totally specific to a square,\
    \ because of the name of its single method: drawSquare(). Consider what happens\
    \ when another class wants to extend this, as in Listing 4.3."
  merge: -1
  img_proc: true
- pgno: 101
  md: "# LISTING 4.3: Extending Square to become a rectangle\n\n```\nclass Rectangle:\
    \ Square() {\n    val width: Int = 8\n\n    fun drawRectangle() {\n        println(\"\
    Drawing a rectangle with area \" + (length * width))\n    }\n}\n```\n\nRectangle\
    \ is now a subclass of Square, so it gets a length property from Square and then\
    \ adds its own property, width. It also inherits drawSquare() from Square, and\
    \ adds its own drawRectangle().\n\nThe problem here is not that obvious, but the\
    \ more so as you work through this chapter: you now have two methods—drawSquare()\
    \ (which came from the base class) and the new drawRectangle() method. It's not\
    \ simple, and it's a result of Square that is not flexible.\n\nSquare is inflexible\
    \ because it used a name for a method—drawSquare—that didn't consider that other\
    \ classes might want to extend the class and override that method. A better name\
    \ would simply be \"draw,\" as shown in Listing 4.4.\n\n# LISTING 4.4: Rewriting\
    \ Square to become a more flexible property name\n\n```\nopen class Square {\n\
    \    val length: Int = 12\n\n    fun draw() {\n        println(\"Drawing a square\
    \ with area \" + (length * length))\n    }\n}\n```\n\nNow, Rectangle can extend\
    \ Square and just override that draw() method, as shown in Listing 4.5.\n\n# LISTING\
    \ 4.5: Now extending Square is much cleaner\n\n```\nclass Rectangle: Square()\
    \ {\n    val width: Int = 8\n\n    override fun draw() {\n        println(\"Drawing\
    \ a rectangle with area \" + (length * width))\n    }\n}\n```\n\nSquare was adjusted\
    \ to be more flexible, Rectangle is now more sensible: it overrides draw(), and\
    \ now there is just a single draw() method for classes.\n\nThis is the sort of\
    \ consideration to take into account throughout the rest of this chapter, and\
    \ is particularly key if you ever open-source or share your code with anyone.\
    \ They're going to want clear and flexible classes, just as you would."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# CLASSES CAN DEFINE DEFAULT VALUES FOR PROPERTIES\n\nLook at Listing 4.6,\
    \ which contains the current version of Person.\n\nLISTING 4.6: The latest version\
    \ of Person works, but isn't flexible\n\n```\npackage org.wiley.kotlin.person\n\
    \nclass Person(firstName: String, lastName: String,\n      height: Double, age:\
    \ Int, hasPartner: Boolean) {\n\n    var firstName: String = _firstName\n    var\
    \ lastName: String = _lastName\n    var height: Double = _height\n    var age:\
    \ Int = _age\n    var hasPartner: Boolean = _hasPartner\n\n    fun fullName():\
    \ String {\n        return \"$firstName $lastName\"\n    }\n\n    override fun\
    \ toString(): String {\n        return fullName()\n    }\n\n    override fun hashCode():\
    \ Int {\n        return (firstName.hashCode() * 28) + (lastName.hashCode() * 31)\n\
    \    }\n\n    override fun equals(other: Any?): Boolean {\n        if (other is\
    \ Person) {\n            return (firstName == other.firstName) &&\n          \
    \         (lastName == other.lastName)\n        } else {\n            return false\n\
    \        }\n    }\n```\n\nThis class certainly has the job, but is it flexible?\
    \ One way to answer this question is to look at what it takes to create a new\
    \ instance of the class in question. For Person, referring back to Person-Test,\
    \ you will need a line of code like this:\n\n```\nval brian = Person(\"Brian\"\
    , \"Truesby\", 68.2, 33, true)\n```\n\nIs this good? Well, it gets the core values\
    \ needed for a Person. But it goes beyond that—are cases where you might not have\
    \ a Person's weight? And is it really necessary to specify if a Person-instance\
    \ has a partner at object instance construction?\n\nThese are examples that the\
    \ class just isn't flexible. It requires more information than is always available."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Constructors Can Accept Default Values\n\nTo make this more flexible, you\
    \ can use default values for non-essential properties. A person is really defined\
    \ by a few core pieces of data; in this case, it is the first and last name of\
    \ the person. The other details are really useful, but not required.\n\nDefault\
    \ values allow you to provide values for non-essential properties that will be\
    \ used if nothing is provided.\n\n```\nclass Person(firstName: String, lastName:\
    \ String,\n              height: Double = 0.0, age: Int = 0,\n              hasPartner:\
    \ Boolean = false) {\n```\n\nKotlin will now allow you to skip values for anything\
    \ that has a default: the person's height, age, and if they have a partner. You\
    \ could now create\n\n```\n// another person\nval rose = Person(\"Rose\", \"Bushnell\"\
    )\n```\n\nIn this instance, the rose variable will have a height of 0.0, an age\
    \ of 0, and no partner. This cleans up the code significantly.\n\n# Kotlin Effects\
    \ Arguments in Order\n\nThere are a couple of wrinkles here, though. Suppose you\
    \ want to create a person with just their name—which is now possible. You cannot\
    \ simply add that argument to the constructor. In other words, the following code\
    \ is illegal:\n\n```\nval rose = Person(\"Rose\", \"Bushnell\", true)\n```\n\n\
    The hasPartner property is 5th, not 3rd. If you choose to take advantage of default\
    \ values, you cannot skip any values. To indicate a partner, you'd need values\
    \ for the arguments before that one:\n\n```\nval rose = Person(\"Rose\", \"Bushnell\"\
    , 0.0, true)\n```\n\nThis works, but you've lost some of that flexibility. You\
    \ could still set the property after instance creation:\n\n```\nval rose = Person(\"\
    Rose\", \"Bushnell\")\nrose.hasPartner = true\n```\n\nThis is likely your best\
    \ bet. It doesn't require any extra code.\n\nYou can continue to specify argument\
    \ values in order and leave off default values—as long as they are at the end\
    \ of the constructor. This is legal, if you leave a person's first name, last\
    \ name, and height, but not their age or partner status:\n\n```\nval rose = Person(\"\
    Rose\", \"Bushnell\", 62.5)\n```\n\n# Specify Arguments by Name\n\nThere is a\
    \ way around this limitation: you can pass arguments into a constructor by name.\
    \ This is not used often but can help you get around the order limitation. You\
    \ just supply the name of the argument as defined in the class, an equals sign,\
    \ and a value:\n\n```\nval rose = Person(\"Rose\", \"Bushnell\", hasPartner =\
    \ true)\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "# Classes Can Define Default Values for Properties | 75\n\nKotlin will happily\
    \ pass the value supplied to the named argument. In fact, you can do this with\
    \ all\narguments you are really:\n\n```\nval rose = Person(\"Rose\", lastName\
    \ = \"Bushnell\",\n      hasPartner = true)\n```\n\nOf course is a bit verbose,\
    \ and you'll rarely see this sort of syntax. The biggest drawback is\nit requires\
    \ a calling program to know the names of the arguments in the class. Parameter\
    \ names like\nfirstName are often chosen because they aren't seen by the calling\
    \ program. This isn't a huge\nissue, but it's worth thinking about.\n\n# Change\
    \ the Order of Arguments (If You Need)\n\nIt's easy to create an instance and\
    \ assign it all additional properties. But there will be times\nyou find that\
    \ you are frequently setting the same property after construction. For example,\
    \ suppose\nthat over half the time, you want an instance with a first name, last\
    \ name, and partner status. Cur-\nrently means you'll always need to do this:\n\
    \n```\nval rose = Person(\"Rose\", \"Bushnell\")\nrose.hasPartner = true\n```\n\
    \nThat's because hasPartner input is last. Or, you would need to keeping the\n\
    parameter name:\n\n```\nval rose = Person(\"Rose\", \"Bushnell\", _hasPartner\
    \ = true)\n```\n\nNeither is bad, or ever problems. However, if you find that\
    \ the most common usage of your\nconstructor involves a different set of parameters,\
    \ there's a simple fix! Just change the order of your\nconstructor's arguments:\n\
    \n```\nclass Person(firstName: String, lastName: String,\n      hasPartner: Boolean\
    \ = false,\n      height: Double = 0.0, _age: Int = 0) {\n```\n\nThat's a simple\
    \ change, but a really easy one, and now this construction is legal:\n\n```\n\
    val rose = Person(\"Rose\", \"Bushnell\", true)\n```\n\nThis isn't a huge change,\
    \ but does make things a little more direct, less verbose, and avoids the\nto\
    \ keeping typing in parameter name _hasPartner.\n\n> WARNING If you make this\
    \ change to the constructor for Person, and then\nupdatePersonTest, you may get\
    \ an error that takes you a second to process:\nthat error occurs because now\
    \ any constructors that supply all inputs will fail.\nThat's because now the third\
    \ argument is no longer a Double (for height) but\ninstead a Boolean (for hasPartner).\
    \ Just change those constructions, too, and\nyou'll be back in business."
  merge: -1
  img_proc: true
- pgno: 105
  md: "# SECONDARY CONSTRUCTORS PROVIDE ADDITIONAL CONSTRUCTION OPTIONS\n\nSuppose\
    \ you have a case where you want to allow entirely different information passed\
    \ into an object at creation. In other words, you're not decreasing the number\
    \ of arguments passed to the constructor, but changing one or more of them.\n\n\
    To make this concrete, consider a Person that has a partner. Right now, your class\
    \ only knows if the person has a partner, but nothing about that. Let's change\
    \ Person to allow an additional Person instance to be passed as the partner.\n\
    \nSo you want to construct a Person like this:\n\n```\nval rose = Person(\"Rose\"\
    , \"Busnell\", brian)\n```\n\nHere, the rose instance is created and another Person\
    \ instance, brian, is passed in as well. For this, you need something new: a secondary\
    \ constructor.\n\n# Secondary Constructors Come Second\n\nThis is a case where\
    \ you don't want to add another argument to the constructor of Person; you actually\
    \ want to pass something totally different: another Person instance to represent\
    \ the constructed instance's partner.\n\nThis is where a secondary constructor\
    \ comes in. You literally add an additional constructor, using the constructor\
    \ keyword:\n\n```\nconstructor(_firstName: String, _lastName: String,\n    _partner:\
    \ Person) {\n    // Need code here soon\n}\n```\n\nThis new constructor still\
    \ takes in a first and last name, and adds a new argument, which has to be a Person\
    \ instance. Now, you would be trying to compile this, but you're going to immediately\
    \ get an error:\n\n> Error:(14, 5) Kotlin: Primary constructor call expected\n\
    \nThe problem is that Kotlin expects all secondary constructors (and you can have\
    \ as many as you want) to call the primary constructor, like:\n\n```\nconstructor(_firstName:\
    \ String, _lastName: String,\n    _partner: Person) :\n    this(_firstName, _lastName)\
    \ {\n    // Need code here soon\n}\n```\n\nWhat's going on here isn't obvious\
    \ unless you remember what this references—and that was only briefly mentioned\
    \ earlier, so don't worry if you don't recall it.this is a reference to the current\
    \ instance of the class. So this(_firstName, _lastName) is calling the class's\
    \ default constructor, and passing in the values the secondary constructor received."
  merge: -1
  img_proc: true
- pgno: 106
  md: "So this code is actually equivalent to something like this:\n\n```\n// Create\
    \ a new Person instance like:\n// newPerson = Person(\"First\", \"Last\")\n//\
    \ Then run the code in the secondary constructor, with access to a\n// Person\
    \ representing the partner\n```\n\nAnother way of following this code is to trace\
    \ the sequence of code that is run:\n\n+   1. The secondary constructor is called.\n\
    2. The secondary constructor calls the primary constructor.\n3. The primary constructor\
    \ runs.\n4. Any init block associated with the primary constructor is run, as\
    \ well as property assignments.\n5. Control is returned to the secondary constructor.\n\
    6. Any code in the secondary constructor is run.\n7. Any code associated with\
    \ the secondary constructor (through an additional code block) is run.\n\nSo now\
    \ the actual code for the secondary constructor needs to be put in place.\n\n\
    # Secondary Constructors Can Assign Property Values\n\nAt this point, you need\
    \ to be aware of what the values of all your instance properties are. Because\
    \ the default constructor has run, and has only been supplied a first and last\
    \ name, the default values for age, height, and partner status have been used.\
    \ That, for example, hasPartner is false.\n\nOf course, there is a problem, because\
    \ using the secondary constructor passing in a new Person instance, which implies\
    \ the new person has a partner. So that property can be reassigned a correct:\n\
    \n```\nconstructor(_firstName: String, _lastName: String,\n    _partner: Person)\
    \ :\n    this(_firstName, _lastName) {\nhasPartner = true\n```\n\nNow, this gets\
    \ a bit trickier: what about that Person instance being passed in? Your instinct\
    \ might be to do something like this:\n\n```\nconstructor(_firstName: String,\
    \ _lastName: String,\n    _partner: Person) :\n    this(_firstName, _lastName)\
    \ {\nhasPartner = true\n    partner = _partner\n}\n```"
  merge: -1
  img_proc: true
