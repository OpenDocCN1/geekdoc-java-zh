  md: '# 5


    # Lists and Sets and Maps, Oh My!


    WHAT''S IN THIS CHAPTER?


    +   - The basic Collection class in Kotlin

    - Lists and how to use them

    - Sets and how they differ from lists

    - Iteration and mutability up close(r)

    - One more collection: maps


    # LISTS ARE JUST A COLLECTION OF THINGS


    At this point, it''s time to take a detour back into some of the basic types that
    Kotlin provides. Currently, you can provide a single child instance through a
    Person. But parents can have multiple children (rather obviously). In fact, in
    programming terms, a parent can have a list of children: more than one. Kotlin
    supports lists in a variety of fashions.


    # Kotlin Lists: One type of Collection


    A list is a type of the base Kotlin type for groupings of things: a Collection
    Collection, part of the kotlin.collections package, defines a number of collection
    basics as well as ways to iterate (or traverse) over collections.


    Collections defines methods to create various types of lists (and sets and maps),
    which are variations on all, and those lists come in two basic varieties:


    +   - Read-only: You can access elements in the collection, but not not change
    them.

    - Mutable: You can not only access elements but also add, remove, and update those
    elements.'
