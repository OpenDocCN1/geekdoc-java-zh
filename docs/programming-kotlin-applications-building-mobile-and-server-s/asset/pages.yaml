- pgno: 142
  md: "# Sets: Unordered but Unique | 113\n\nNow you'll have three different elements\
    \ in the list with the Kinks:\n\n+   - The lead singer for The Beatles is John\
    \ Lennon\n- The lead singer for The Kinks is Ray Davies\n- The lead singer for\
    \ The Black Keys is Dan Auerbach\n- The lead singer for The Rolling Stones is\
    \ Mick Jagger\n- The lead singer for The Black Crows is Chris Robinson\n- The\
    \ lead singer for The Kinks is Ray Davies\n\nThis isn't a problem as long as you\
    \ know it's possible, and don't assume your list has only unique elements. If\
    \ you want to deal with unique elements, you can use the distinct() method:\n\n\
    ```\nfor (band in rockBands.distinct()) {\n    println(\"The singer for ${band.name}\
    \ is ${band.singer}\");\n}\n```\n\nNow the output each band has band once:\n\n\
    +   - The lead singer for The Beatles is John Lennon\n- The lead singer for The\
    \ Kinks is Ray Davies\n- The lead singer for The Rolling Stones is Mick Jagger\n\
    - The lead singer for The Black Crows is Chris Robinson\n- The lead singer for\
    \ The Black Keys is Dan Auerbach\n\nThis method is nondestructive, though. It\
    \ does not actually change the list it's called on. Instead, it returns a new\
    \ list. So you could store that new:\n\n```\nvar singularBands = rockBands.distinct()\n\
    ```\n\nIn this case, you'd have rockBands, which has (potentially) duplicates,\
    \ and singularBands, which will absolutely not have any duplicates.\n\n> NOTE\
    \ You can still do a lot more things with lists. In fact, you could read another\
    \ 20 or 30 pages before you'd hit the extent of it: filtering, sorting, selecting\
    \ uniqueness based on specific attributes, and much more. This is plenty for you\
    \ to make good practical use of lists, and as more needs arise, you can easily\
    \ add to your lists and collections toolkit.\n\n# SETS: UNORDERED BUT UNIQUE\n\
    \nYou already know a lot of what you need to know about sets. Like lists, they\
    \ inherit from Collection, and like lists, which can be mutable or read-only.\
    \ They are also commonly iterated over, something you just learned to do.\n\n\
    The big differences are that a set is unordered (while a list is ordered) and\
    \ a set has one and only one of every item in it (while a list can have duplicates)."
