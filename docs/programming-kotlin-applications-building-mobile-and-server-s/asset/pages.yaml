- pgno: 337
  md: "# LISTING 12.8 (continued)\n\n```\nabstract var maxSpeed: Int\n\n// Start the\
    \ car up\nabstract fun start()\n\n// Stop the car\nabstract fun stop()\n\n// Subclasses\
    \ need to define how they drive\nabstract fun drive(direction: String, speed:\
    \ Int) : Int\n\n```\n\n> WARNING If you are following along and compiling as you\
    \ go, this change to Car will break the Honda Class. That no longer fulfills the\
    \ contract that Car lays out because it doesn't handle the new maxSpeed property,\
    \ or the stop() functions.\n\n# Abstract Classes Can Define Concrete Properties\
    \ and Functions\n\nSo far, everything in Car is abstract: its properties and functions.\
    \ But there's no requirement for that. In fact, this will turn out to be a key\
    \ difference between an abstract class and an interface, which you'll learn later\
    \ in this chapter. An abstract class can have fully implemented (sometimes called\
    \ \"concrete\") functions and properties mixed in abstract ones.\n\nChange the\
    \ first line of Car to look like this:\n\n```\nabstract class Car(val model: String,\
    \ val color: String) {\n```\n\nNow, every subclass has a model and color property\
    \ available. They can also be used in the abstract class, even though they won't\
    \ be defined until compile time, and in a subclass. Listing 12.9 adds a simple\
    \ costring() function—one that is concrete-to Car. This method is available to\
    \ all subclasses of Car.\n\n# LISTING 12.9: Setting up some concrete functions\
    \ and properties in Car\n\n```\npackage org.wiley.kotlin.car\n\nabstract class\
    \ Car(val model: String, val color: String) {\n\n    abstract var maxSpeed: Int\n\
    \n    // Start the car up\n    abstract fun start()\n\n    // Stop the car\n \
    \   abstract fun stop()\n```"
