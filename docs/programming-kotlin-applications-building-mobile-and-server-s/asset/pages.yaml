    \ formatting and run. Here is the key line:\n\n```\nsomeString?.let { println(formatString(someString))\
    \ }\n```\n\nThe output is what you'd expect:\n\n```\nqbttNxelV\n\n>>> qbttNxelV\
    \ <<=\n```\n\nThe value of someString is first printed (showing it's not null),\
    \ and then printed with formatting via formatString().\n\nBut now change the initialization\
    \ of someString:\n\n```\nvar someString: String? = getRandomString(-2)\n```\n\n\
    If you take a look at getRandomString(), you'll see that a null input parameter\
