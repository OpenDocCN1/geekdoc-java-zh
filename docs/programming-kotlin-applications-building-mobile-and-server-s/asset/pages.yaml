    # TYPE SAFETY CHANGES EVERYTHING


    The big takeaway here is that when a language seeks to really enforce type safety—as
    Kotlin does—nearly everything in the language gets affected. Properties are required
    to have values, and have them early, so that Kotlin can ensure the correct types
    are used. The mutability of variables is tightly controlled—in Kotlin''s case,
    with var and val being different—so Kotlin can determine when it needs to keep
    a variable''s type over time, and the values assigned to that type. Kotlin doesn''t
    convert types for you. All of these nuances in keeping type safety intact and
    making it much harder to break Kotlin at runtime.


    Believe it or not, there is a lot more to Kotlin''s type safety: things you''ll
    learn in future chapters. Kotlin has a list of specific rules around values, checking
    for null, and the idea of null safety: keeping your code from null pointer exceptions.


    > If you''re not familiar with null pointers, or have never seen a NullPointerException,
    for example, Java, count yourself lucky. If you have, they''re the source of very
    difficult bugs. Kotlin attempts to add some extra work at the coding layer in
    favor of avoiding those annoying and hard-to-find bugs. It''s a trade-off, but
    one that works quite well for Kotlin.


    # WRITING CODE IS RARELY LINEAR


    If you take a step back and consider what you''ve done over these last two chapters,
    it''s both cool and potentially confusing. The cool part is even if you''ve never
    written a line of Kotlin before, you''ve got a functioning class that exercises
    some of Kotlin''s key and relatively unique features: objects, construction, and
    overiding classes (more on later), as well as the unusual requirements Kotlin
    enforces around property values.


    What could be a bit confusing, though, is how you got to the terse code in Listing
    2.10. You added properties, removed them, added a couple of mutators, removed
    them, and ultimately deleted nearly much as you added. It wouldn''t have been
    easier to jump right to Listing 2.10?


    Well, it might have, it wouldn''t have helped in getting you to see how Kotlin
    works. Arguably as important, it wouldn''t be realistic. Seasoned developers are
    constantly going through this process: trying things out, adding something new,
    having to go back and change code to accommodate new code, tweaking, and removing
    as much as is added. It''s common to refactor—to restructure code to make it less
    redundant, more efficient, more organized, and generally just better.


    That''s really point if you''re learning Kotlin, too: to get more than just a
    syntactic understanding. Want to be a good developer? Keep adding things, removing
    things, and taking a fresh look to make sure your code is the right code.'
