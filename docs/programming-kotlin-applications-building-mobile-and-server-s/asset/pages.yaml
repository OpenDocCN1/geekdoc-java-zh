- pgno: 348
  md: "This is actually a pretty important point to make: an interface (as well as\
    \ an abstract class) can quickly add functionality to inheriting classes in this\
    \ manner. With multiple subclasses of Car, Car itself, and even Motorcycle and\
    \ Motorcycle subclasses, adding a function to Vehicle provided new behavior for\
    \ all of those implementing classes.\n\n# Interfaces Allow Multiple Forms of Implementation\n\
    \nYou know that a class—even an abstract class—can implement an interface. But\
    \ an interface can also implement an interface. For example, you could decide\
    \ that Car is better as an interface than it is as an abstract class, so it, rework\
    \ it, as shown in Listing 12.20.\n\n+   LISTING 12.20: Car as an Interface (with\
    \ errors)\n\n```\npackage org.wiley.kotlin.car\n\nimport org.wiley.kotlin.vehicle.Vehicle\n\
    \ninterface Car(val model: String, val color: String) : Vehicle {\n\n    override\
    \ fun toString() : String {\n        return \"${this::class.simpleName} $${color}\"\
    \n    }\n}\n```\n\nThis is going to generate a number of errors, though. First,\
    \ an interface can't have a constructor, so you'd lose the model and color properties.\
    \ You could declare them as properties, just like maxSpeed declared on Vehicle,\
    \ and then implement them in subclasses, but lose a lot of common behavior—basically,\
    \ the reason Car was an abstract class in the first place.\n\nTry Listing 12.21,\
    \ instead. This defines a new interface called Manufacturer. This could then be\
    \ extended to the class in Listing 12.22, a HondaManufacturer.\n\n+   LISTING\
    \ 12.21: A new interface for vehicle manufacturers\n\n```\npackage org.wiley.kotlin.vehicle\n\
    \ninterface Manufacturer {\n    val name: String\n}\n```"
