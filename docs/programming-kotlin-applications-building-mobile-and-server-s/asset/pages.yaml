- pgno: 230
  md: "This couldn't be simpler, and in many ways, it is the epitome of a data class.\
    \ There's a class with a few properties, and Kotlin is left to generate every\
    \ bit of code associated with this class.\n\nCompare this with Listing 8.16, a\
    \ much more complicated version of a data class.\n\n> **LISTING 8.16: A data class\
    \ with less code to generate**\n\n```\npackage org.wiley.kotlin.person\n\ndata\
    \ class Person(var firstName: String, var lastName: String) {\n    var numChildren:\
    \ Int = 0\n    var fullName: String\n\n    init {\n        fullName = \"$firstName\
    \ $lastName\"\n    }\n\n    override fun toString(): String {\n        return\
    \ fullName\n    }\n}\n```\n\nHere, there are additional properties (numChildren\
    \ and fullName), an init block, and a toString() that prevents a generated version\
    \ from being created. You could even have this extend a class to further complicate\
    \ this.\n\nUltimately, though data classes actually start to lose value as you\
    \ add customizations. They're at best and most useful when you override generated\
    \ code, the more you pick up responsibilities in keeping the class consistent\
    \ and the less it becomes a simple, \"managed by Kotlin helper\".\n\nIn many ways,\
    \ a data class is bit like the default versions of equals() and hashCode() that\
    \ you get in subclassing Any. Data classes (and the default implementations of\
    \ equals() and hashCode()) are great if you use them \"as is\". But remember:\
    \ when you change equals(), you also have to change hashCode(), and quickly, you've\
    \ got a lot more to manage. In the same way, as soon as you start changing a data\
    \ class, you lose a lot of advantages and flexibility that you've gained.\n\n\
    Your best bet is to declare a data class, and if all must, leave it at that. But\
    \ unless you have to override functions and acting behavior to add functionality\
    \ or properties outside of the constructor or prevent functions from being generated,\
    \ take a minute and make sure that you are getting the most out of your data classes,\
    \ and that the simplicity makes the data class valuable.\n\nNow that you've seen\
    \ how Kotlin makes data handling easy with data classes, you're ready to look\
    \ at more built-in Kotlin helpers: constants, enums, and sealed classes."
  merge: -1
