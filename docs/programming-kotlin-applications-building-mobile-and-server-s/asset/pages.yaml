  md: "# LISTING 8.3: Testing out the User data class\n\n```\nimport org.wiley.kotlin.user.User\n\
    \nfun main() {\n    val robert = User(\"powell@rockwallblackblack.com\", \"Robert\"\
    , \"Powell\")\n    println(robert)\n}\n```\n\nRun this class and you'll get the\
    \ following output:\n\n```\nUser(email=powell@rockwallblackblack.com, firstName=Robert,\
    \ lastName=Powell)\n```\n\nThere's definitely a lot going on under the hood. But\
    \ there's a bit more you can do for \"for free\". Make these additions to your\
    \ test class:\n\n```\nfun main() {\n    val robert = User(\"powell@rockwallblackblack.com\"\
    , \"Robert\", \"Powell\")\n    robert.email = \"rpowell@rockwallblackblack.com\"\
    \n    robert.firstName = \"Bob\"\n    println(robert)\n}\n```\n\nNow recompile,\
    \ and you'll get these two errors:\n\n```\nError:(6, 5) Kotlin: Val cannot be\
    \ reassigned\nError:(7, 5) Kotlin: Val cannot be reassigned\n```\n\nThat makes\
    \ sense; look again at the declaration of User, which did indeed use val:\n\n\
    ```\ndata class User(val email: String, val firstName: String, val lastName: String)\n\
    ```\n\nIf you want these properties to be changeable, you need to use var:\n\n\
    ```\ndata class User(var email: String, var firstName: String, var lastName: String)\n\
    ```\n\nNow recompile and the errors will go away. Also notice that the instance\
    \ is printed, the updated values for email and firstName are used:\n\n```\nUser(email=rpowell@rockwallblackblack.com,\
    \ firstName=Bob, lastName=Powell)\n```\n\nSo without any properties defined with\
    \ val accessor (getter) methods\n\n+   - Any properties defined with val accessor\
    \ (getter) methods\n- Any properties defined with var mut (setter) and accessor\
    \ methods\n- toString() works immediately and uses the property values of the\
    \ class\n\n# The Basics of Data Classes includes hashCode() and equals(x)\n\n\
    Remember that for a while now, hashCode() and equals(x) have become an important\
    \ part of how you think about classes. But also remember that you don't get meaningful\
    \ values of these methods when you create an empty class—at least until now.\n\
    \nTo drive this point home, Listing 8.4 shows a simple version of User—called\
    \ SimpleUser—that is not a data class."
