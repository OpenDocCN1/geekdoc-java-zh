- pgno: 133
  md: 'As you''d expect, there are other factory methods on Collection:


    +   - listOf(): Creates a read-only list (List) containing what you pass into
    the method

    - emptyList(): Creates an empty list

    - mutableListOf(): Creates a new mutable (MutableList) containing what you pass
    into the method

    - listOfNull(): Creates a read-only list (List) containing all non-null objects
    passed into this method


    You''ll use many of these as you work through this chapter. In each case, you
    will use the factory method to create an instance of the object you need.


    # Collection Is Automatically Available to Your Code


    Another thing to note is that you didn''t have to import the Collection class,
    or even prefix mutableListOf with Collection, you might if you''ve worked with
    other languages. That''s because of three things:


    +   - Collection is in the kotlin.collections package.

    - The factory methods in Collection are all public methods.

    - Collections is really just a collection of classes and methods.


    Kotlin automatically imports a number of packages for whenever you create new
    Kotlin code. One of those packages is kotlin.collections. That means everything
    defined in that package—including Collection—is immediately available for use
    within your program without an import statement.


    Second, the factory methods are all public, like this:


    ```

    public fun <T> emptyList(): List<T> = EmptyList

    ```


    You can use them immediately, as they are visible to your code.


    And third, there is a difference between a Collection, which is defined by Kotlin,
    and the Collections file, the actual source code file. The source defines a set
    of methods—like these factory methods—that are not in a class. They''re simply
    methods available to your program. That''s why you don''t have to write code like:


    ```

    val rockBands = Collection.mutableListOf("The Black Crow", "Led Zeppelin", "The
    Beatles")

    ```


    > NOTE If this is a little confusing, that''s normal. The Collections code and
    package does things that are more about Kotlin internals than you need to know
    right now. Just realize that you can access methods defined in the Collections
    file because that file is in an automatically imported package, the methods are
    public, and they''re not defined as part of an actual class. That''s all you need
    to know for now.'
