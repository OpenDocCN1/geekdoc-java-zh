  md: "> NOTE It's worth asking yourself, “Why are we revisiting this basic stuff?”\
    \ It's a fair question, you've been working with functions and arguments and default\
    \ values for quite a while now. Still, it's important to get into the mechanics\
    \ of these ideas for two reasons: first, you need to have a firm grasp of the\
    \ syntax of any language that goes beyond what you've figured out implicitly;\
    \ and second, this chapter will start to stretch these concepts, ensuring you've\
    \ got the basics down first will allow you to move into these more advanced uses\
    \ much more quickly.\n\n# Default Values in Constructors Are Inherited\n\nDefault\
    \ values for constructors have some wrinkles when inheritance is introduced into\
    \ the picture. The primary constructor for Person has default values declared\
    \ like this:\n\n```\nopen class Person(firstName: String, lastName: String,\n\
    \    _height: Double = 0.0, _age: Int = 0) {\n```\n\nIf you add an argument to\
    \ a subclass of Person, you have to maintain default values, redefine them, or\
    \ ensure that you don't call the superclass version illegally.\n\nFor example,\
    \ here's a Child subclass of Person that keeps the same default values for _height\
    \ and _age:\n\n```\nclass Child(firstName: String, lastName: String,\n    _height:\
    \ Double = 0.0, _age: Int = 0, parents: Set<Person>) :\n    Person(firstName,\
    \ lastName, _height, _age) {\n```\n\nHere's the same subclass, but the default\
    \ _age is set to 12 instead of 0, as it is in Person:\n\n```\nclass Child(firstName:\
    \ String, lastName: String,\n    _height: Double = 0.0, _age: Int = 12, parents:\
    \ Set<Person>) :\n    Person(firstName, lastName, _height, _age) {\n```\n\nNow,\
    \ you can legally remove the default value for _height:\n\n```\nclass Child(firstName:\
    \ String, lastName: String,\n    _height: Double, _age: Int = 12, parents: Set<Person>)\
    \ :\n```\n\nHowever, the current code in the superclass constructor is now illegal:\n\
    \n```\nclass Child(firstName: String, lastName: String,\n    _height: Double,\
    \ _age: Int = 0, parents: Set<Person>) :\n    Person(firstName, lastName, _height,\
    \ _age) {\n```\n\nThis is passing in _height, which may be undefined, and Kotlin\
    \ won't allow that."
