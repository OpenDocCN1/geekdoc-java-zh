  md: "# Your Subclass Should Be Different Than Your Superclass\n\nfrom Person or\
    \ from a Person superclass. In fact, you could have four or five layers of inheritance\
    \ and the lowest subclass gets everything from all of its superclasses, regardless\
    \ of how far “up” the inheritance chain are.\n\n# YOUR SUBCLASS SHOULD BE DIFFERENT\
    \ THAN YOUR SUPERCLASS\n\nThis may seem like an obvious statement, but it bears\
    \ repeating: your subclass, which is a more specific thing, different from your\
    \ superclass, which is a more general thing.\n\nFor this reason, you may want\
    \ to be a bit suspicious of a subclass that just calls its super’s constructor\
    \ as-is. It may indicate that you’re not really thinking about what makes your\
    \ subclass unique.\n\nIn the case of Parent, what is it that makes a Parent unique\
    \ and more specific than a Person? Well, it’s that a Parent has a child or children,\
    \ of course.\n\n# Subclass Constructors Often Add Arguments\n\nIf the existence\
    \ of a child is the very thing that differentiates a Parent from a Person, then\
    \ consider making it required upon instantiation. Consider taking the child (or\
    \ children), to address shortly as part of the constructor.\n\nRight now, there’s\
    \ no Child class (something else to get into later). But a child is just another\
    \ Person instance, much as a partner was a Person instance. So you could add a\
    \ parameter for this to your Parent constructor:\n\n```\nclass Parent(firstName:\
    \ String, lastName: String,\n    height: Double = 0.0, age: Int = 0, child: Person):\n\
    \    Person(firstName, lastName, height, age) {\n\nvar child: Person = _child\n\
    ```\n\nThis should intuitively feel right. You’re now requiring the thing that\
    \ defines a Parent as part of its construction. You could certainly make this\
    \ a property that can be set, but then you could theoretically have a Parent that\
    \ has no children, which is odd and possibly problematic in this scenario.\n\n\
    > NOTE At this point, it should be clear: valid scenarios exist where an actual\
    \ parent does not have a child. Many of those reasons are tragic, and this example\
    \ isn’t meant to be insensitive or invalidate those parents. It’s instead a simplification\
    \ to teach programming, and it actually illustrates a quite important principle:\
    \ no program can ever truly model all the nuances and brilliance of real life.\n\
    \nNow you have a class that better model a Parent: it requires a child (via Person\
    \ instance) to be passed in construction."
