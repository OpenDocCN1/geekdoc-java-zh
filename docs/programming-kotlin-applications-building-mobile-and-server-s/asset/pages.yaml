- pgno: 343
  md: "Listing 12.16 is a Vehicle interface that looks quite similar to your existing\
    \ Car abstract class.\n\n# LISTING 12.16: Building an interface for vehicles\n\
    \n```\npackage org.wiley.kotlin.vehicle\n\ninterface Vehicle {\n    val maxSpeed:\
    \ Int\n\n    fun start()\n    fun stop()\n    fun drive(direction: String, speed:\
    \ Int) : Int\n}\n```\n\nObviously, there are some differences between this and\
    \ the Car abstract class in Listing 12.9:\n\n+   - An interface uses the interface\
    \ instead of class, and an abstract class uses the class keyword after abstract.\n\
    - An interface's functions and properties don't have to be preceded by the abstract\
    \ keyword, while an abstract class's functions and properties do.\n- An interface\
    \ cannot have constructors or properties taken in as part of initialization, while\
    \ abstract classes can.\n\nA class can implement an interface as shown in Listing\
    \ 12.17.\n\n# LISTING 12.17: Implementing the Vehicle interface\n\n```\npackage\
    \ org.wiley.kotlin.car\n\nimport org.wiley.kotlin.vehicle.Vehicle\n\nclass Volkswagen\
    \ : Vehicle {\n    override val maxSpeed = 190\n\n    override fun start() {\n\
    \        println(\\*Starting the VW: Turning the key, shifting into drive*\")\n\
    \    }\n\n    override fun stop() {\n        println(\\*Stopping the VW*\")\n\
    \    }\n\n    override fun drive(direction: String, speed: Int) : Int {\n    \
    \    println(\\*The VW is driving*\")\n        return speed / 60\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 344
  md: "# Interfaces Define Behavior but Have No Body\n\n> NOTE The terminology is\
    \ a bit different here. A class implements an interface but subclasses or extends\
    \ a class. As you'll see shortly, both of these can go on at the same time, so\
    \ getting the terminology correct is important.\n\nIt's pretty obvious that Volkswagen,\
    \ while implementing Vehicle instead of subclassing Car, looks very similar to\
    \ the other Car classes. In fact, Car and Vehicle are really similar.\n\n# Interfaces\
    \ and Abstract Classes Are Similar\n\nIt's no accident that these look alike.\
    \ In many cases, it is entirely a personal preference as to whether you use an\
    \ interface or an abstract class. You can also use a bit of both! For example,\
    \ you could redefine Car to look like Listing 12.18.\n\nLISTING 12.18: An abstract\
    \ class implementing an interface\n\n```\npackage org.wiley.kotlin.car\nimport\
    \ org.wiley.kotlin.vehicle.Vehicle\nabstract class Car(val model: String, val\
    \ color: String) : Vehicle {\n    // var maxSize: Int\n\n    // Start the car\
    \ up\n    abstract fun start()\n\n    // Stop the car\n    abstract fun stop()\n\
    \n    // Subclasses need to define how they drive\n    abstract fun drive(direction:\
    \ String, speed: Int) : Int\n\n    override fun toString() : String {\n      \
    \  return \"${this::class.simpleName}${model} in ${color}\"\n    }\n```\n\nMost\
    \ of the code is commented so that you can see the changes in Car are removals.\
    \ It now implements Vehicle, adds details related to a model and color, and defines\
    \ a toString() function. The function definitions are no longer needed because\
    \ the maxSpeed property as well as start(), stop(), and drive() are all defined\
    \ in Vehicle, and don't need to be redefined in the Car abstract class.\n\nThis\
    \ is a pretty common pattern: define very generic interface, and then subdivide\
    \ implementation through using an abstract class. For instance, consider an inheritance\
    \ hierarchy as visualized in Figure 12.1."
  merge: -1
  img_proc: true
- pgno: 345
  md: "# 316 | CHAPTER 12 INHERITANCE, ONE MORE TIME, WITH FEELING\n\n![](img/0c8d5d6c6d95ced628a954a187036113_345_0.png)\n\
    \nFIGURE 12.1: An inheritance hierarchy using interfaces, abstract classes, and\
    \ concrete classes\n\nAt the top of the hierarchy is a generic interface, Vehicle.\
    \ It defines required behavior for a broad class—vehicles. Then Car and Motorcycle\
    \ both implement the interface and then define specificity and what needs to be\
    \ implemented. A number of subclasses extend the abstract class (which by extension\
    \ means that they are implementations of the Vehicle interface) and fill in all\
    \ the required behavior.\n\nThis has all the hallmarks of a sound inheritance\
    \ tree. It begins at the top of the tree with general functionality. At each level,\
    \ drawing down the tree, classes become more specific and the variation becomes\
    \ more defined. However, all of these classes are ultimately Vehicle implementations.\n\
    \nYou could have a list of Vehicle instances and each item in that list could\
    \ be a Car subclass or a Motorcycle subclass, and you could call any function\
    \ defined in Vehicle on each item in that list, knowing that the contract Vehicle\
    \ creates is fulfilled.\n\nYou could also create a list of subclasses of Motorcycle,\
    \ and call functions that are specific to Motorcycle. You might have Motorcycle\
    \ add a kickstand property that a Car doesn't have, and any subclass of Motorcycle\
    \ is now going to support that property.\n\n# Interfaces Cannot Maintain State\n\
    \nAt the beginning of this section on interfaces, you read that an interface can\
    \ define properties, but they can't define state or be used in the rest of the\
    \ class. To understand this, take a look at how Vehicle defines the maxSpeed property:\n\
    \n```\ninterface Vehicle {\n  maxSpeed: Int\n\n  // other code\n}\n```\n\nmaxSpeed\
    \ is effectively abstract. If you look back at how this was defined in Car, it\
    \ was marked as abstract here:\n\n```\nabstract class Car(val model: String, val\
    \ color: String) : Vehicle {\n\n  abstract var maxSpeed: Int\n```"
