    \ = _hasPartner\n//  private set\nvar partner: Person? = null\n//  set(value)\
    \ {\n//    // field = value\n//    hasPartner = (field != null)\n//  }\n  _partner\
    \ = partner\n```\n\n```\nconstructor(firstName: String, lastName: String,\n_partner:\
    \ Person) : \n  this(firstName, lastName) {\n  partner = _partner\n}\n```\n\n\
    ```\nfun fullName(): String\n  return \"$firstName $lastName\"\n}\n```\n\n```\n\
    fun hasPartner(): Boolean\n  return (partner != null)\n}\n```\n\n```\noverride\
    \ fun toString(): String\n  return fullName()\n}\n```\n\n```\noverride fun hashCode():\
    \ Int\n  return (firstName.hashCode() * 28) + (lastName.hashCode() * 31)\n}\n\
    ```\n\n```\noverride fun equals(other: Any?): Boolean\n  if (other is Person)\
    \ {\n    return (firstName == other.firstName) &&\n      (lastName == other.lastName)\n\
    \  } else {\n    return false\n  }\n}\n```\n\nAlso note that this change, the\
    \ custom mutator for partner can go away as well. Finally, you can remove the\
    \ _hasPartner argument from the primary constructor. Much cleaner code!\n\n# You\
    \ Can Avoid Parentheses with a Read-Only Property\n\nNow that you've updated all\
    \ of your hasPartner calls to hasPartner(), here's a bit of a tip: you can actually\
    \ avoid writing a hasPartner() function, you could just create a read-only property\
    \ with the same custom accessor (getter). Add this declaration right under the\
    \ other properties defined after the primary constructor:\n\n```\nval hasPartner:\
    \ Boolean\nget() = (partner != null)\n```"
