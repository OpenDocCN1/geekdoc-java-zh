- pgno: 334
  md: "> WARNING In Chapter 9, you created an Auto class in the org.wiley.kotlin auto\
    \ package. This chapter uses a new package, org.wiley.kotlin.car, and a new class\
    \ name Car, to distinguish from that earlier class.\n\nAt first glance, this seems\
    \ like another variation on a theme: a base class that can be extended into Porsche\
    \ and Audi Ford and Honda subclasses, each with their own unique behavior, and\
    \ likely some amount of shared behavior.\n\nHowever, there's important difference\
    \ between Car as opposed to Band or User. There is really no such thing as a \"\
    generic\" Car. Every Car is a particular make (and you can extend this to model\
    \ if you want). A Band is a standalone concept. An instance of Bands makes sense,\
    \ because it is self-defining. A RockBand instance might be more specific to a\
    \ type of music, but a plain Band instance also works.\n\nThat's not the same\
    \ as Car. Car can have certain things. When this is the case, you really don't\
    \ want an instance of a Car. It's incomplete. And you can use Kotlin to disallow\
    \ creation of Car instances by creating an abstract class, rather than a non-abstract\
    \ class—regardless of whether that class is open or not.\n\n> NOTE If you've just\
    \ thought of 10 or 20 objections to this line of reasoning, that's great! They\
    \ may be valid—just keep reading, as this is a complex and somewhat nuanced topic\
    \ that will take more than a few paragraphs to explain fully.\n\nListing 12.3\
    \ converts Car to an abstract version.\n\nLISTING 12.3: An abstract version of\
    \ the Car class\n\n```\npackage org.wiley.kotlin\n\nabstract class Car {\n\n \
    \   fun drive(direction: String, speed: Int) : Int {\n        // drive in the\
    \ given direction at the given speed\n        // return the distance driven -\
    \ fix later\n        return 0\n    }\n}\n```\n\nBelieve it or not, just abstract\
    \ before the first line of the class definition is all that's required. You can\
    \ see the effect of this by creating a new sample program, like the one shown\
    \ in Listing 12.4."
