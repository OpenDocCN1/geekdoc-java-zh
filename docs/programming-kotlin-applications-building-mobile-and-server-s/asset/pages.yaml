  md: "# Assign an Uninitialized Property a Dummy Value\n\nThe easiest fix here is\
    \ actually quite... easy. You can simply get around Kotlin's insistence on property\
    \ initialization by assigning an empty value at creation, such as an empty String:\
    \ \"\". Just add that to your class:\n\n```\nclass Person(firstName: String, lastName:\
    \ String,\n    height: Double, age: Int, hasPartner: Boolean) {\n    var fullName:\
    \ String = \"\"\n```\n\nKotlin will not stop complaining! You've initialized fullName,\
    \ so there's no problem. However, this is a bit tricky. It defeats the purpose\
    \ of Kotlin's checking (something we'll come back to in a moment). It also builds\
    \ a hidden dependency in your code. Look at the init method again:\n\n```\n//\
    \ Set the full name when creating an instance\ninit {\n    updateName()\n}\n```\n\
    \nEven with this, there's nothing except your own memory and understanding of\
    \ how Person works—and this chapter—ells you that you have call updateName() in\
    \ init. If you don't, then fullName will not be initialized, and in turn, will\
    \ miss up the toString() function. Bad news!\n\nIf this seems unlikely, it's not.\
    \ When you're writing code, you know what is supposed to be. But leave that for\
    \ a few weeks, or months, and you forget how it worked, when you wrote it that\
    \ way! Worse, but just like likely, someone else comes back to it and has no idea\
    \ how it works.\n\nIn both cases, it could be quite plausible that some well-meaning\
    \ forager forgets that updateName() must be called in init, or moves it, and problems\
    \ ensues. This is really a fragile solution.\n\n# Tell Kotlin You'll Initialize\
    \ a Property Later\n\nAnother easy solution is to tell Kotlin that you are going\
    \ to initialize a property later. It's sort of the equivalent of saying \"Look,\
    \ Kotlin, trust me. I'll take care of it.\" To do this, you preface a property\
    \ declaration with lateinit, a keyword that means what it sounds like—you'll initialize\
    \ the property later:\n\n```\nclass Person(firstName: String, lastName: String,\n\
    \    height: Double, age: Int, hasPartner: Boolean) {\n    lateinit var fullName:\
    \ String\n```\n\nRemove the assignment to \"\" and add lateinit. Now, your class\
    \ will compile again! No problem.\n\n> WARNING lateinit has some pretty limitations.\
    \ It works with var, not val, and the properties can't be declared within the\
    \ constructor itself. You also can't create a custom accessor or mutator for a\
    \ lateinit-declared property. So it's not a fix-all. In fact, it's not even a\
    \ fix in this case, really."
