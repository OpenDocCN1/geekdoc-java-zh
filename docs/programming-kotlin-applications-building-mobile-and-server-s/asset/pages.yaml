  md: '# #3

    Kotlin Is Extremely Classy


    WHAT''S IN THIS CHAPTER?


    +   - Every class has an equals() and hashCode() method

    - Different types of object and object instance comparison

    - Overriding equals() and hashCode() in meaningful ways

    - The importance of equals() and hashCode() in comparison operations

    - Why class basics matter


    # OBJECTS, CLASSES, AND KOTLIN


    It is not an overstatement to say that Kotlin is entirely about objects, which
    necessarily means it is all about classes. Since an object is just a specific
    instance—an instantiation—of a class, any language that makes heavy usage of objects
    is going to have a lot of class-based logic.

    Put simply, if you want to be a good Kotlin programmer, you need to understand
    classes as you''re using them a lot. In fact, most Kotlin applications have at
    a single nonlocal involved: the main function that you''ve already seen.

    In this chapter you''re going to get more into the weeds with classes, and really
    understand what they come with "out of the box" in Kotlin, and how to use them
    more effectively. Literally everything else you will be based on this, so take
    your time, and try not to skip the boring parts.


    > NOTE It may seem an odd thing for a writer to say "the boring parts," some boring
    parts are definitely coming. Not everything about classes in Kotlin is particularly
    exciting or even fact. That said, you''ve got to get a hold of these things to
    know how to use classes to maximum advantage. So . . boring? Yup. Essential? Also
    y.'
