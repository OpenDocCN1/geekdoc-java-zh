- pgno: 121
  md: "# LISTING 4.14 (continued)\n\n+   * See the License for the specific language\
    \ governing permissions and\n* limitations under the License.\n/\n\n```\npackage\
    \ kotlin\n\npublic open class Any {\n    public open fun equals(other: Any?):\
    \ Boolean\n\n    public open fun hashCode(): Int\n\n    public fun toString():\
    \ String\n}\n```\n\nThis is the base class for all classes in Kotlin. So Person,\
    \ even though you may not have realized, and certainly haven't have to do anything,\
    \ is a subclass of Any.\n\nThis is the ultimate example of taking a nonspecific\
    \ class—Any—and making it more specific by extending it in Person. All Person\
    \ instances are also Any instances, but all instances of Any are certainly not\
    \ Person instances.\n\nWhen you have a base class, any method that has the word\
    \ open in its method definition can be used by extending and having the subclass.\
    \ Take a look at the three methods in Any:\n\n```\npublic open fun equals(other:\
    \ Any?): Boolean\n\npublic open fun hashCode(): Int\n\npublic fun toString():\
    \ String\n```\n\n> NOTE For now, don't worry about the operator keyword. You'll\
    \ learn about that soon, but for now, focus on open.\n\nAll three of these are\
    \ open for overriding, and of course that's exactly what's been done in Person:\n\
    \n```\noverride fun toString(): String { ... }\noverride fun hashCode(): Int {\
    \ ... }\noverride fun equals(other: Any?): Boolean { ... }\n```\n\nSo there's\
    \ a pairing here: the base class uses open and the subclass uses override."
  merge: -1
  img_proc: true
- pgno: 122
  md: '# {...} Is Shorthand for Collapsed Code


    One quick technique that applies to this book, but also to most Kotlin IDEs and
    interacting with the Kotlin community online, that you''ll sometimes see notation
    like this:


    ```

    override fun hashCode(): Int { ... ... }

    ```


    This was used early in referencing the three methods in Person that overrode methods
    defined in Any. The open and close brackets with three dots means “there is code
    here, but it''s been collapsed (hidden).


    This is not actual syntax. You can''t type that into your editor and get a successful
    compilation. However, it showing code (online or in print) shorter the details
    of the method might not actually matter for what''s being discussed.


    You''ll also see this in IDEA as an option. Figure 4.1 shows the IntelliJ IDEA
    with code as it normally appears, and Figure 4.2 shows some code collapsed. You
    can toggle back and forth by clicking the sample + - icons to the left of each
    line that defines a block of code (see the closeup in Figure 4.3).


