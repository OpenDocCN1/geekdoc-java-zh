- pgno: 200
  md: "In a do ... while, it doesn't matter what the initial value of condition; the\
    \ code will run once. In a while, condition's value does initially matter. So\
    \ you'd need to fix that:\n\n```\ncondition = true\nwhile (condition) {\n    //\
    \ This line actually will run with condition initially set to\n    println(\"\
    run at least once!\")\n    condition = false\n}\n```\n\nNow you'll get the same\
    \ output.\n\n# If Something Must Happen, Use do ... while\n\nIt takes a little\
    \ creative to get your head around things that using do ... while makes more than\
    \ sense. As a rule of thumb, it's less about the code in the loop and more about\
    \ the preexisting state of what that code operates on\n\nFor example, suppose\
    \ you need to initialize a list with some data. First, here's a quick helper function\
    \ create random strings:\n\n```\nfun randomString(length: Int): String {\n   \
    \ val allowedChars = ('A'..'Z')\n    return (1..length)\n        .map { allowedChars.random()\
    \ }\n        .joinToString(\"\")\n}\n```\n\n> NOTE There are some functions that\
    \ you haven't seen here, like map and joinToString(), that you don't need to worry\
    \ too much here. First, you can probably figure out what they do, and second,\
    \ you'll learn more about map in later chapters.\n\nNow, here's a do ... while\
    \ loop that fills up an empty string with random strings:\n\n```\nvar emptyList:\
    \ MutableList<String> = mutableListOf<String>()n\ndo {\n    emptyList.add(randomString(10))\n\
    } while (emptyList.size < 10)\n\nprintln(emptyList)\n```\n\nThere's really no\
    \ reason to use a while and evaluate the condition first, because you know that\
    \ the list is initially empty and has less than 10 items in it. This is a great\
    \ case for do ... while, because you know you want the code to run at least once."
