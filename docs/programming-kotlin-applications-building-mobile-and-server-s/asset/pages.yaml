    \ Compile and get the first line of issues:\n\n```\nError(10, 13) None of the\
    \ following functions can be called with the arguments supplied:\npublic constructor\
    \ Parent(_firstName: String, lastName: String, height:Double, _age:Int, _child:\
    \ Person) defined in org.wiley.kotlin.person.Parent\npublic constructor Parent(_firstName:\
    \ String, lastName: String, _children:Set<Person>) defined in org.wiley.kotlin.person.Parent\n\
    Error(11, 20) Type mismatch: inferred type Set<Person> but MutableSet<Person>\
    \ was expected\n```\n\nSo what's going on? Well, take one item at a time. First,\
    \ remember that any secondary constructor must call the class's primary constructor,\
    \ which in this case requires a single Person instance for the _child argument.\
    \ That's immediately a problem, unless you do something rather like this:\n\n\
    ```\nconstructor(_firstName: String, lastName: String, _children: Set<Person>)\
    \ :\n    this(_firstName, _child = _children.first()) {\n    children = _children\n\
    ```\n\nTechnically it works, but it's not good programming. You're following the\
    \ rules of Kotlin, but what really suggests that your constructors are not well-planned\
    \ or executed.\n\nYou'll recall that when it comes to inheritance, you want the\
    \ more general class higher up the inheritance tree, and more specific classes\
    \ are subclasses. So Person is more general and a superclass, while Parent is\
    \ more specific and a subclass.\n\nIn the same vein, you want your primary constructor\
    \ to be the broadest, more general constructor, and secondary constructors are\
    \ more specific versions. That's exactly the opposite of what we're going on here:\
