  md: "# LISTING 8.14: Person as a data class with a single internal property\n\n\
    ```\npackage org.wiley.kotlin.person\n\ndata class Person(var firstName: String,\
    \ var lastName: String) {\n    var numChildren: Int = 0\n}\n```\n\nKotlin will\
    \ generate all functions based on the firstName and lastName property, including\
    \ equals(). These functions will not use numChildren in all of those functions.\n\
    \nNow consider this code:\n\n```\nval jason = Person(\"Jason\", \"Smith\")\njason.numChildren\
    \ = 2\n\nval anotherJason = Person(\"Jason\", \"Smith\")\nanotherJason.numChildren\
    \ = 1\n```\n\nTwo instances of Person are created, with the same name, but with\
    \ a different number of children. These instances are not equal if you consider\
    \ the number of children they each have. However, comparing them with equals():\n\
    \n```\nval jason = Person(\"Jason\", \"Smith\")\njason.numChildren = 2\n\nval\
    \ anotherJason = Person(\"Jason\", \"Smith\")\nanotherJason.numChildren = 1\n\
    ```\n\n```\nprintln(jason.equals(anotherJason))\n```\n\nThe output here is:\n\n\
    ```\ntrue\n```\n\nThe generated equals() classes are equal, because it is only\
    \ comparing firstName and lastName, which are equal in jason and anotherJason.\
    \ The numChildren property is completely ignored, resulting in equals() returning\
    \ true when it likely should report false.\n\n# DATA CLASSES ARE BEST LEFT ALONE\n\
    \nYou can do a lot of things with data classes beyond the simple creation and\
    \ declaration of properties. Listing 8.15 is a data class in its simplest form\n\
    \n# LISTING 8.15: A User data class in its simplest form\n\n```\npackage org.wiley.kotlin.person\n\
    \ndata class User(val email: String, val firstName: String, val lastName: String)\n\
    ```"
  merge: -1
