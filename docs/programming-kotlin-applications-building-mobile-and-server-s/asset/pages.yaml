  md: '# CHAPTER 2 IT''S HARD TO BREAK KOTLIN


    Kotlin will largely take care of figuring out which type to use when you don''t
    declare type explicit. In that, it''s going to look at the value when you assigning
    the variable, and make some assumptions. This is a pretty important concept called
    type inference, and it''s something we''re going to talk about a lot more detail
    in Chapter 6.


    If you create a variable and assign it a number that is type Int, then Int will
    be used. If the number is outside the range of Int, it will be used as a Long:


    ```

    val someInt = 20

    tval tooBig = 4532145678

    ```


    So here, someInt will be an Int. tooBig is too big to fit into an Int so it will
    be a Long. You can also force a variable to be a Long by casting a L to the value:


    ```

    val marketLong = 42L

    ```


    Kotlin gives you a couple of options for decimals, as well: two, again, based
    on precision and size. Those are listed in Table 2.2.


    TABLE 2.2: Kotlin Types for Decimal Numbers

    | TYPE | SIZE (BITS) | SIGNIFICANT BITS | EXPONENT BITS | DECIMAL DIGITS |

    |---|---|---|---||}{

    | Float | 32 | 24 | 8 | 6–7 |

    | Double | 64 | 53 | 11 | 15–16 |


    Assignment here works a bit unexpectedly. Decimal variables are Double unless
    you tell Kotlin to Float using the f or F suffix:


    ```

    val g = 9.8

    val theyAllFloat = 9.8F

    ```


    # Letters and Things


    If you want to represent a single character—including special characters like
    backslash or a carriage return—you use the Char type:


    ```

    val joker = ''j''

    ```


    A character should be enclosed in a set of single quotes. You can also enclose
    special characters in quotes and precede the character code with a backslash.
    For instance, tab is \t, a line feeds \n, and a backslash is itself \:\


    ```

    val special = ''\n''

    ```


    > NOTE Backslash is weird because it is itself an escape character. To get an
    actual backslash, you use the escape character (\) and then another backslash
    (\), which gets you \\.'
