  md: "# Sets: Unordered Unique | 11\n\n```\nvar bandTwo = Band(\n  rockBands[0].name,\n\
    \  _singer = Person(rockBands[0].singer.firstName,\n  rockBands[0].singer.lastName,\n\
    \  _guitarist = Person(rockBands[0].guitarist.firstName,\n  rockBands[0].guitarist.lastName,\n\
    \  _bassist = Person(rockBands[0].bassist.firstName,\n  rockBands[0].bassist.lastName,\n\
    \  _drummer = Person(rockBands[0].drummer.firstName,\n  rockBands[0].drummer.lastName)\n\
    );\n\n// Add a band if it's not already in the set\nif (bandSet.contains(bandTwo))\
    \ {\n  println(\"bandSet already contains ${bandTwo}\");\n} else {\n  bandSet.add(bandTwo);\n\
    }\n```\n\nTake some time to make sure you see what's happening here. First, a\
    \ duplicate is added by taking an element already in the set (from earlier in\
    \ the code) and adding it to the set. You'd expect that the element won't get\
    \ added (it turns out to be the Beatles in my case, by the way).\n\n> NOTE Like\
    \ the order of bands earlier, you may see a different band at issue here. Before\
    \ as, this isn't a problem.\n\nBut then, another Band instance is created, given\
    \ the name and each individual instance data for each member of the band:\n\n\
    ```\nvar bandTwo = Band(\n  rockBands[0].name,\n  _singer = Person(rockBands[0].singer.firstName,\n\
    \  rockBands[0].singer.lastName,\n  _guitarist = Person(rockBands[0].guitarist.firstName,\n\
    \  rockBands[0].guitarist.lastName,\n  _bassist = Person(rockBands[0].bassist.firstName,\n\
    \  rockBands[0].bassist.lastName,\n  _drummer = Person(rockBands[0].drummer.firstName,\n\
    \  rockBands[0].drummer.lastName)\n)\n```\n\nIn theory, rockBands[0] should be\
    \ the equivalent of bandTwo, so when bandTwo is added to bandSet, it should get\
    \ ignored. But check the output; that's not what happened:\n\n[The Beatles, The\
    \ Beatles, The Black Crowes, The Kinks, The Rolling Stones]\n\nSo what gives us?\
    \ Well, the answer lies in equals (x). Even though the data in these two objects\
    \ are identical, they are not the same object. You should recall from Chapter\
    \ 3 that without a custom implementation of equals (x), object equality is typically\
    \ based on memory location of an object—so two objects with the same data are\
    \ not equal."
