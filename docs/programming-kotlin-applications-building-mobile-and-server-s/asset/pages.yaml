    \n```\nprintln(\"The second band is ${rockB[1]}\")\nprintln(\"The third band is\
    \ ${rockB.get(2)}\")\n```\n\nYou can also grab the first or last item in a list:\n\
    \n```\nprintln(\"The first band is ${rockB.first()}\")\nprintln(\"The second band\
    \ is ${rockB[1]}\")\nprintln(\"The last band is ${rockB.last()}\")\n```\n\nNone\
    \ of these methods will apply to non-ordered collections. You can also shuffle\
    \ list items:\n\n```\nprintln(\"The first band is ${rockB.first()}\")\nprintln(\"\
    The second band is ${rockB[1]}\")\nprintln(\"The last band is ${rockB.last()}\"\
    )\n```\n\n```\nrockBands.shuffle()\n```\n\n```\nprintln(\"The first band (post\
    \ shuffle) is ${rockB.first()}\")\nprintln(\"The second band (post shuffle) is\
    \ ${rockB[1]}\")\nprintln(\"The last band (post shuffle) is ${rockB.last()}\"\
    )\n```\n\nThe output reflects the shuffle:\n\n> The first band is The Beatles\n\
    The second band is The Rolling Stones\nThe last band is The Black Keys\nThe first\
    \ band (post shuffle) is The Black Keys\nThe second band (post shuffle) is The\
    \ Beatles\nThe last band (post shuffle) is The Rolling Stones\n\n# Lists Can Contain\
    \ Duplicate Items\n\nYou can also add the same item to a list multiple times.\
    \ Here's a trivial example:\n\n```\nvar kinks = Band(\"The Kinks\",\n      singer\
    \ = Person(\"Ray\", \"Davies\"),\n      guitarist = Person(\"Dave\", \"Davies\"\
    ),\n      drummer = Person(\"Mick\", \"Avory\"),\n      bassist = Person(\"Pete\"\
    , \"Quaife\")\n)\n\n```\n\n```\nrockBands.add(kinks)\nrockBands.add(kinks)\nrockBands.add(1,\
    \ kinks)\n```"
