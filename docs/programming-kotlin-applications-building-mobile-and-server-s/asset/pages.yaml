- pgno: 201
  md: "Now, this is actually still a little contrived, because you know the loop needs\
    \ to run 10 times and could use a for loop. That would do without needlessly checking\
    \ the condition 9 times, when you know it's not really needed:\n\n```\nvar anotherEmpty:\
    \ MutableList<String> = mutableListOf()\n\nfor (i in 1..10) {\n    anotherEmpty.add(randomString(10))\n\
    }\n\nprintln(anotherEmptyList)\n```\n\nA better case is when you are operating\
    \ on a variable and are not sure how many times that operation should occur. So\
    \ perhaps you are handing off the array to a function that you don't have visibility\
