  md: "# LISTING 12.37: Delegating to three different interfaces\n\n```\npackage org.wiley.kotlin.person\n\
    ```\n\n```\nimport org.wiley.kotlin.car.Car\nimport org.wiley.kotlin.motorcycle.Motorcycle\n\
    import org.wiley.kotlin.plane.Plane\n```\n\n```\nclass Spy(val name: String, bike:\
    \ Motorcycle, plane: Plane, car: Car) : Motorcycle\n    by bike, by plane, by\
    \ car {\n\n}\n```\n\nNow Spy takes three vehicles, and implements three interfaces,\
    \ all through delegation. You can now call functions from all three interfaces\
    \ on Spy! You could do something like this:\n\n```\n// Code that only works when\
    \ delegating to three interfaces\nspy = Spy(\"White Spy\", bike, plane, car)\n\
    spy.ride(\"North\", 145)\nspy.fly(\"West\", 280)\nspy.ride(\"Northwest\", 128)\n\
    ```\n\nThis is pretty cool and shows how flexible Kotlin will let you be with\
    \ a little foresight and planning.\n\n# INHERITANCE REQUIRES FOREIGHT AND AFTEROUGHT\n\
    \nAt this point, you've seen a lot of varieties of inheritance: interfaces, abstract\
    \ classes, extension, implementation, decoration, and now delegation. In many\
    \ cases, these are all options. In other words, there's rarely a time when one\
    \ type of inheritance works. In that sense, inheritance is similar to scope functions:\
    \ you'll use the one that best suits your needs and style at the time.\n\nThe\
    \ limitations of inheritance do bear weight. You can't extend more than one class,\
    \ while you can implement multiple interfaces. You can't delegate to an abstract\
    \ class, but you can to an interface implementation.\n\nThis will cause you to\
    \ work and rework your inheritance tree. It's great to suppose you can always\
    \ get it right by planning ahead, but sometimes you'll need to go back and change\
    \ things, those changes will give you more flexibility . until you need to make\
    \ the next set of changes.\n\nRegardless, now you have the tools to build rich\
    \ object hierarchies and better model the objects your programs depend upon."
