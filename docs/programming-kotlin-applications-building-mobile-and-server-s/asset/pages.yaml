- pgno: 350
  md: "# Interfaces Define Behavior but Have No Body | 321\n\n```\noverride fun stop()\
    \ {\n    println(\"Stopping the ${model}\")\n}\n\noverride fun drive(direction:\
    \ String, speed: Int) : Int {\n    println(\"The Honda ${model} is driving!\"\
    )\n    return speed / 60\n}\n```\n\nFrom what's visible here, Honda now extends\
    \ Car and implements HondaManufacturer. It's also technically implementing Vehicle\
    \ via Car as well. There's a lot going on in this class!\n\nYou can create an\
    \ instance of Honda and print out its name property, which it gets from Honda-Manufacturer:\n\
    \n```\nvar honda = Honda(\"Odyssey\", \"grey\")\nprintln(honda.name)\n```\n\n\
    # Interface Property Names Can Get Confused\n\nYou may see a problem here. When\
    \ looking just the Manufacturer interface, the name property made plenty of sense.\
    \ But now, looking at the Honda class, it's not all clear what name references.\
    \ You have two options to address this:\n\n+   - Prefix an interface property\
    \ names (like name) with the interface, so use manufacturerName instead of name,\
    \ for example.\n- Avoid generic property names, so use manufacturer or make instead\
    \ of name.\n\nEither is okay, and this becomes a matter of style and preference.\
    \ For this, you can simply change the name of the name property in Manufacturer\
    \ and HondaManufacturer to make, which gives better context for the property's\
    \ value and purpose.\n\n# Interfaces Decorate a Class\n\nSomething you have noticed\
    \ is that even Honda (and other subclasses of Car or even the fictional Motorcycle\
    \ abstract class) can implement HondaManufacturer, no additional behavior had\
    \ to be implemented.\n\nThis is typically known as decoration, or the decorator\
    \ pattern. You can read more about this design in a number of places, but a good\
    \ Java-specific (and therefore close to Kotlin) explanation is here: dzone.com/articles/gang-four-%E2%80%93-decorate-decorator.\
    \ The idea is that a class decorates an existing class with existing data or behavior\
    \ without having to refract or impact the existing object.\n\nIn this case, HondaManufacturer\
    \ decorates Honda by giving it a new property, and the Honda class only has to\
    \ add another inherited interface. You could also add functionality in this manner;\
    \ you might add a function that provides information about the manufacturer. So\
    \ Manufacturer might define a new function, as shown in Listing 12.24, and then\
    \ HondaManufacturer could further define behavior as shown in Listing 12.25."
