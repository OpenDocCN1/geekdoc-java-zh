  md: "As you'll see in a minute, though, the default version of this method almost\
    \ never does what you want it to.\n\n> WARNING Take a moment to realize that equals(x)\
    \ compares two instances of a class, rather than two actual classes. And in general,\
    \ it will always return false if the two objects aren't instances of the same\
    \ class.\nThis of course makes sense: how could an instance of Person ever be\
    \ considered equal to an instance of Automobile?\n\nIf you run Listing 3.1, you'll\
    \ just get what you'd expect:\n\n+   Brian Bisby\nRose Bushnell\nRose Bushnell-Truesby\n\
    Nope.. not the same person\n\nBut there's a problem. To see it in action, make\
    \ this addition:\n\n```\nif (rose.equals(brian))\n    println(\"It's the same\
    \ person!\")\nelse\n    println(\"Nope... not the same person\")\nval second_brian\
    \ = Person(\"Brian\", \"Truesby\", 68.2, 33)\nif (second_brian.equals(brian))\n\
    \    println(\"It's the same Brian!\")\nelse\n    println(\"Nope... not the same\
    \ Brian!\")\n```\n\nNow run your code, and the output may not be what you'd expect:\n\
    \n+   Brian Truesby\nRose Bushnell\nRose Bushnell-Truesby\nNope.. not the same\
    \ person\nNope.. not the same Brian\n\nSo what's going on? Why are two object\
    \ instances with the same property values not identical? It has to do with the\
    \ way Kotlin's default implementation of equals(x) works: the equality is based\
    \ on memory location.\n\nThe equality evaluated by equals(x) by default is the\
    \ equality of the actual object instance in memory compared to another object's\
    \ location in memory. In other words, equals(x) does not care if two objects have\
    \ the exact same value; it cares if the two instances are the actual bit of memory.\
    \ To see this in action, add more code:\n\n```\nval copy_of_brian = brian\nif\
    \ (copy_of_brian.equals(brian))\n    println(\"Now it's the same Brian!\")\nelse\n\
    \    println(\"Nope... still not the same Brian\")\n```"
