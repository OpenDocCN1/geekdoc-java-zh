  md: "# A Subclass Must Follow Its Superclass's Rules\n\nNow, back to that error:\n\
    \n```\nError:(3, 16) Kotlin: This type has a constructor, and must be\ninitialized\
    \ here\n```\n\nThe key to understanding this is to remember what it takes to create\
    \ a new Person instance:\n\n```\nval brian = Person(\"Brian\", \"Truesby\", 68.2,\
    \ 33)\n```\n\nPerson has a primary constructor, which means that it requires certain\
    \ things to be instantiated.\nBehavior is then inherited by its subclass.\n\n\
    You need to define a primary constructor for Parent that takes in any required\
    \ information\\and passes it on to Person, like this:\n\n```\nclass Parent (firstName:\
    \ String, lastName: String,\n      height: Double = 0.0, age: Int = 0) :\n  Person(firstName,\
    \ lastName, height, age) {\n```\n\nYou should be able to reason what's happening\
    \ here exactly. Parent takes all the\nsame arguments that Person does, and passes\
    \ them to the Person constructor.\n\nKeep in mind, though, that the rule here\
    \ is not that you must initialize a subclass in the same way\ny initialize your\
    \ class's; it's only that you initialize the superclass in a valid manner.\nYou\
    \ could easily do this by:\n\n```\nclass Parent (firstName: String, lastName:\
    \ String):\n  Person(firstName, lastName, 68.5, 34) {\n```\n\nThis doesn't make\
    \ sense here (where there's no reason to assume a Person is 68.5 inches tall\n\
    and 34 years old), but it's still following the rules of the superclass.\n\n#\
    \ A Subclass Gets Behavior from All of Its Superclasses\n\nPerson is also going\
    \ to have an equals(x) method, a hashCode() method, and a toString()\nmethod,\
    \ because it inherits all its methods from parent, Person.\n\nMore specifically,\
    \ a subclass also gets the methods its superclass has. Note that the word here\
    \ is\nhas, not defines. In other words, means that Person did not override toString().\
    \ It would still\\have access to that, because Person inherits from Any, which\
    \ defines the method.\n\n> NOTE To be a little more specific, your Kotlin installation\
    \ provides an imple-\nmentation of Any with behavior for toString(), and Person\
    \ gets that imple-\nmentation. You'll learn more about interfaces and implementation\
    \ in the coming\nchapters.\n\nIn this imaginary case, Person defines behavior\
    \ for hashCode() and equals(x) and inherits behavior\nto toString(). Parent gets\
    \ all of that behavior, regardless of whether it is inherited directly"
