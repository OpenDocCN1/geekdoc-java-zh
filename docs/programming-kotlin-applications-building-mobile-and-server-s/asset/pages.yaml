  md: '# Kotlin Has a Large Number of Types


    With all these changes in place, you can recompile and run your program again.
    Things should work beautifully (although that last name is still wrong!).


    # Classes: The Ultimate Type in Kotlin


    Before getting into Kotlin types—this chapter is going to spend the rest of its
    time on—it''s worth saying that classes are really the ultimate type in Kotlin.
    A class provides you a way to collect data and work with that data in a single
    manner, and to model the world: sentences, objects like cars, people, abstract
    ideas like a radio wave or a device.


    Classes also give you a pointer to something that''s so important in Kotlin: type
    safety refers to the degree to which a programming language keeps you from making
    mistakes by assigning one type (like number) to a variable that should only hold
    letters. There''s nothing as frustrating as treating a variable like it''s all
    letters, and things in your program break because it turns out that variable actually
    contains an instance of Person (or Car, or User, or something else that doesn''t
    act like letters).


    And that''s where classes and objects are so key to type safety. Your Person is
    now strongly typed; you can''t create an integer and show it into string. More
    specifically, you can''t create a Car and show it into Person. You''re going to
    see a lot more about this as the chapter goes on. For now, though, just think
    of objects as a really powerful way to be sure variable (by val or var) has exactly
    what you need in the world.


    > NOTE If you''re wondering how Kotlin knows what type is allowed for a variable,
    keep reading. Much more on that shortly.


    # KOTLIN HAS A LARGE NUMBER OF TYPES


    Like any programming language, Kotlin supports lots of basic types. You can define
    integers (Int), sequences of letters (String), decimal numbers (Float), and a
    lot more. Let''s take a blazing-run through the basic types and start putting
    them to use.


    # Numbers in Kotlin


    Kotlin gives you four options for integers, largely varying based on range. These
    are shown in Table 2.1.


    TABLE 2.1: Kotlin Types for Integers (Nondecimal)


    | TYPE | SIZE (BITS) | MINIMUM VALUE | MAXIMUM VALUE |

    |---|---|---|-|

    | Byte | 8 | -128 | 127 |

    | Short | 16 | -32,678 | 32,678 |

    | Int | 32 | -2,147,483,648 (-2³) | 2,147,483,647 (2³ – 1) |

    | Long | 64 | -9,223,372,036,854,777,808 (-2⁶ | 9,223,372,036,854,777,807 (2⁶³
    – 1) |'
