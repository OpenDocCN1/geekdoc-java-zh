  md: "# #9 Enums and Sealed, More Specialty Classes\n\n**WHAT'S IN THIS CHAPTER?**\n\
    \n+   - The problem with strings for types\n- Companion objects and constants\
    \ in Kotlin\n- Enums for type safety\n- Enums and their relationship to anonymous\
    \ classes\n- Enums and implementing interfaces\n- Representing class hierarchies\
    \ with sealed classes\n\n# STRINGS ARE TERRIBLE AS STATIC TYPE REPRESENTATIONS\n\
    \nIt's time to look at one of the most common, and often annoying, aspects of\
    \ building out class structures: constants and variables that use those constants.\
    \ More specifically, the common problem of ensuring that a particular property\
    \ can only have a certain set of values.\nListing9.1 shows a very simple test\
    \ class that will quickly illustrate this issue.\n\nLISTING 9.1: Creating a user\
    \ of a certain type\n\n```\nimport org.wiley.kotlin.user.User\n\nfun main() {\n\
    \    val bardia = User(\"bardia@gmail.com\", \"Bardia\", \"Dejban\", \"ADMIN\"\
    )\n\n    if (bardia.isAdmin()) {\n```\n\n*continues*"
