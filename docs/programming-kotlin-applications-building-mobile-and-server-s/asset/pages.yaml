- pgno: 308
  md: "Here, multiple expressions are chained together. Each expression is the last\
    \ (and only) expression\nin each lambda bonded to a let. So, the result of evaluating\
    \ each is returned, and passed to\nthe next let.\n\nYou could also condense this\
    \ further:\n\n```\ncalc.execute(8, Operation.Add(4)).let { calc.execute(12, Operation.Multiply(it))\
    \ }\n.let { calc.execute(it, Operation.Divide(18)) }\n.let { calc.execute(16,\
    \ Operation.Subtract(it)) }\n.let { calc.execute(it, Operation.Raise(2)) }\n```\n\
    \nAnd you could condense this further, potentially into one very long line.\n\n\
    The goal isn't to write the shortest version, or the longest line of code. The\
    \ goal is to avoid\nhaving variable scattered around, each only using once\n\n\
    ```\nvar calculator = Calculator()\nvar one = calc.execute(8, Operation.Add(4))\n\
    var two = calc.execute(12, Operation.Multiply(one))\nvar three = calc.execute(two,\
    \ Operation.Divide(18))\nvar four = calc.execute(16, Operation.Subtract(three))\n\
    var five = calc.execute(four, Operation.Raise(2))\n```\n\nThere is not a single\
    \ value other than the result (stored in five) that needs to hang around. Even\n\
    calculator is really not needed after all the calls to execute() complete.\n\n\
    That's the core value proposition of scope functions: to make your code more convenient,\
    \ organized,\nin easy to read.\n\n# Prefer Chaining over Nesting\n\nIt's really\
    \ important to get comfortable with the idea of using chaining versus nesting,\
    \ and in most\ncases, using nesting. You could write the previous code as a set\
    \ of expressions:\n\n```\nvar nestedResult = Calculator().let { calc ->\ncalc.execute(8,\
    \ Operation.Add(4)).let {\n  calc.execute(12, Operation.Multiply(it)).let {\n\
    \    calc.execute(it, Operation.Divide(18)).let {\n      calc.execute(16, Operation.Subtract(it)).let\
    \ {\n        calc.execute(it, Operation.Raise(2))\n    }\n  }\n}\n}\n}\nprintln(\"\
    Nested result is \\${nestedResult}\")\n```\n\nThere are a number of obvious problems\
    \ here, though. None of them will stop you from compiling\nyour code, but they\
    \ are all worth examining.\n\nFirst, this code is much less readable, as you end\
    \ up with all those closing brackets to match up. You'll\nhave to make sure that\
    \ each statement is properly indented, or it becomes a mess to read, as well."
  merge: -1
