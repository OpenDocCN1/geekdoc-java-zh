- pgno: 184
  md: "When you see a when statement, you should read it as “When anotherName is .\
    \ . .” for the first line:\n\n```\nwhen (anotherNumber) {\n```\n\nThen, for each\
    \ successive line, read it as “0, then do . . ” or “1, then do . .\":\n\n```\n\
    0 -> println(\"number is 0\")\n1 -> println(\"number is 1\")\n// etc\n```\n\n\
    In other words, each is a specific criterion, that if met, the code after -> runs.\n\
    \n# Each Comparison or Condition Is a Code Block\n\nYou can also use curly braces\
    \ to create blocks for each case:\n\n```\nwhen (anotherNumber) {\n0 -> {\n  println(\"\
    number is 0\")\n}\n1 -> println(\"number is 1\")\n2 -> println(\"number is 2\"\
    )\n3 -> println(\"number is 3\")\n4 -> println(\"number is 4\")\n}\n```\n\n> NOTE\
    \ Each case in Kotlin is also sometimes called a branch. The terms are interchangeable.\n\
    \nAnd of var, you can have multiple lines within these blocks:\n\n```\nvar even\
    \ = false\nwhen (anotherNumber) {\n0 -> {\n  println(\"number is 0\")\n  even\
    \ = true\n}\n1 -> println(\"number is 1\")\n2 -> {\n  println(\"number is 2\"\
    )\n  even = true\n}\n3 -> println(\"number is 3\")\n4 -> {\n  println(\"number\
    \ is 4\")\n  even = true\n}\n}\n```\n\nEach block can do multiple things, and\
    \ just as with if, the block will evaluate to the last statement in the block."
