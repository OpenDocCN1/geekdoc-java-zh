  md: "# CHAPTER 10 FUNCTIONS AND FUNCTIONS AND FUNCTIONS\n\nThis function works but\
    \ is a bit silly. What if you want to add five numbers? Or six?\n\nThis is a case\
    \ where you really want to support a variable number of arguments. You want to\
    \ pass some undefined number of Ints into add() and let them all up. Kotlin considers\
    \ these as variable arguments. They are represented by the vararg keyword.\n\n\
    Create a new function sum(), and show in the complete list for Calculator in Listing\
    \ 10.8.\n\n# LISTING 10.8: Using varargs in a new function in Calculator\n\n```\n\
    package org.wiley.kotlin.math\n\nimport kotlin.math.pow\n\nclass Calculator {\n\
    \    fun execute(input: Int, operation: Operation) : Int =\n        when (operation)\
    \ {\n            is Operation.Add -> input + operation.value\n            is Operation.Subtract\
    \ -> input - operation.value\n            is Operation.Multiply -> input * operation.value\n\
    \            is Operation.Divide -> input / operation.value\n            is Operation.Raise\
    \ -> (input.toFloat()).pow(operation.value).toInt()\n            else -> {\n \
    \               throw Exception(\"Unhandled Operation: ${operation}\")\n     \
    \       }\n        }\n\n    fun add(num1: Int, num2: Int, num3: Int, num4: Int)\
    \ =\n        num1 + num2 + num3 + num4\n\n    fun sum(num1: Int, vararg numbers:\
    \ Int) : Int {\n        var sum = num1\n        for (num in numbers) {\n     \
    \       sum += num\n        }\n        return sum\n    }\n```\n\nsum() takes two\
    \ arguments now:\n\n+   * num1, an Int\n* numbers, a vararg where each type is\
    \ An Int\n\nThere are two arguments because a sum should always involve two numbers,\
    \ and this makes clear by definition.\n\n> NOTE A vararg can actually have 0 arguments,\
    \ so it's still possible to call sum() and just pass in one number. You could\
    \ expand sum() to take in num1, num2, and numbers if you wanted to ensure there\
    \ were always two input values. That becomes a matter of preference at that point."
