    # CREATING USEFUL OBJECTS


    With a working Kotlin environment, it''s time to make that Person class from Listing
    1.2 something less vacuous. As mentioned earlier, objects should model real-world
    objects. Specifically, if an object represents a "thing" in the world (or in formal
    circles you''ll remember that objects are "nouns"), then it should have properties
    or attributes of that thing, too.


    A person''s most fundamental property is their name, specifically a first name
    and last name (or surname, if you like). These can be represented as properties
    of the object. Additionally, these are required properties; you really don''t
    want to create a person without a first and last name.


    For required properties, it''s best to require those when creating a new instance
    of an object. An instance is just a specific version of the object; you might
    have multiple instances of the Person class, each one representing a different
    actual person.


    > WARNING As you may already be figuring out, there''s a lot of technical vocabulary
    with classes. Unfortunately, it will get worse before it gets better: instantiation
    and constructors and more. Don''t get too worried about catching everything right
    away; just keep going, and you''ll find that the vocabulary becomes second nature
