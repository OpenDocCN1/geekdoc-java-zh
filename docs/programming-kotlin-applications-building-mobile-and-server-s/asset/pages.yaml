  md: "null. This goes beyond the method declaration for getRandomString(), which\
    \ clearly indicates that\nmight return a null:\n\n```\nfun getRandomString(len:\
    \ Int) : String? =\n```\n\nInstead, the ? operator must be applied. Add the ?\
    \ to the end of the function call. It's actually the?\nis telling Kotlin to only\
    \ conditionally execute the lambda, not the scope function itself:\n\n```\ngetRandomString(-2)?.let\
    \ {\n    println(\"In here\")\n}\n```\n\nThis is a very important distinction.\
    \ Scope functions can be set to execute only if the input is non-\nnull, but the\
    \ trigger for this execute code is the ?, not simply the presence of a scope function.\n\
    \nIf you compile and run this code, you'll\nsee no output from the println(\"\
    In here\"\nstatement, which is what you'd\nexpect. Additionally, as you can see\
    \ in\nFigure 11.2, a good IDE will also indicate\nthat now it is reference to\
    \ a String,\nnot a String?\n\n![](img/0c8d5d6c6d95ced628a954a187036113_315_0.png)\n\
    \nFIGURE 11.2: Distinguishing between a String and a String?\n\nOnce you add the\
    \ ? after the function call, you can return the code to its original state, as\
    \ shown in\nListing 11.8.\n\n# LISTING 11.8: Using the ? operator to apply a scope\
