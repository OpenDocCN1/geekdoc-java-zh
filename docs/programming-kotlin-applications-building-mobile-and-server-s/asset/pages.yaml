  md: "This is a bit different than you may be used to: data comes in through a constructor,\
    \ but it’s separated\nfrom the initialization code, which is in the initializer\
    \ block.\n\nIn this case, the initializer block uses the new fullName variable\
    \ and sets it using the first and last\nname properties through the class constructor:\n\
    \n```\n// Set the full name when creating an instance\ninit {\n    fullName =\
    \ \"$firstName $lastName\"\n}\n```\n\nThen this variable is used in toString():\n\
    \n```\noverride fun toString(): String {\n    return fullName\n}\n```\n\n> WARNING\
    \ As much new material as this chapter introduces, you may have just\nrun across\
    \ the most important thing that you may learn, in the long-term sense.\nBy changing\
    \ toString() to use fullName, rather than also using the firstName\nand lastName\
    \ variables directly, you are implementing a principle called DRY:\\Don’t Repeat\
    \ Yourself.\nIn this case, you’re not repeating the combination of first name\
    \ and last name,\nwhich was done already in the initializer block. You assign\
    \ that combination to\na variable, and then forever more, you should use that\
    \ variable instead of what it\nactually references. On this later, but note here:\
    \ this is a big deal!\n\n# Kotlin Auto-Generates Getters and Setters\n\nAt this\
    \ point, things are going well. Part of all that you’ve added, but another big\
    \ help is that Kotlin\ndo a lot behind the scenes. It’s running for you automatically\
    \ (like initializer block)\nand letting you override methods.\n\nIt’s doing something\
    \ else, it’s: auto-generating some extra methods on your class. Because\ny made\
    \ firstName and lastName property values (with that val keyword), and you defined\
    \ a\nfullName property, Kotlin created getters and setters for all of those properties.\n\
    \n# Terminology Update: Getters, Setters, Mutators, Accessors\n\nA getter is a\
    \ method that allows you to get a value. For instance, you can add this into your\
    \ main\nfunction, and it will not only work, but print out the first name of the\
    \ brian Person instance:\n\n```\n// Create a new person\nval brian = Person(\"\
    Brian\", \"Trustesby\")\nprintln(brian.firstName)\n```\n\nThis works because you\
    \ have a getter for Person for firstName. You can do the same with fullName\n\
    and lastName, too. This getter is, more formally, an accessor. It provides access\
    \ to a value, in this case\nproperty of Person. And it’s “free” as Kotlin creates\
    \ this for you."
