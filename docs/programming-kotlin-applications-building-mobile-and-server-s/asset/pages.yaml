  md: "# ALL CLASSES NEED AN EQUALS(X) METHOD\n\nThe first thing you should realize\
    \ is something you've already used: each class in Kotlin has some methods already\
    \ defined. You saw this in the Person class when you override toString().\n\n\
    > NOTE There is actually a lot more going on with toString and similar methods\
    \ than just \"existing\" for every class. You'll get more into these methods—which\
    \ are actually inherited from another class—in Chapter 5. For now, it's safe to\
    \ think of these as predefined methods.\n\nClasses also come with two more methods\
    \ \"for free\" like this: equals() and hashCode(). You'll find that you use equals()\
    \ quite a bit-like toString()—and hashCode() very rarely in typical Kotlin programs.\n\
    \n# Equals(x) Is Used to Compare Two Objects\n\nequals() is actually written like\
    \ equals(x), which indicates that it takes in a parameter (represented by x).\
    \ The parameter is another object, and the method returns either true or false.\
    \ True indicates that the object itself (the one that you called equals(x)) and\
    \ on the object passed into the method are identical. Listing 3.1 shows how you\
    \ could use this method with Person instances.\n\nLISTING 3.1: Using equals(x)\
    \ to compare two instances\n\n```\nimport org.wiley.kotlin.person.Person\n\nfun\
    \ main() {\n    // Create a new person\n    val brian = Person(\"Brian\", \"Trubies\"\
    , 68.2, 33, true)\n    println(brian)\n\n    // Create another person\n    val\
    \ rose = Person(\"Rose\", \"Bushnell\", 56.8, 33, true)\n    println(rose)\n\n\
    \    // Change Rose's last name\n    rose.lastName = \"Bushnell-Trubies\"\n  \
    \  println(rose)\n\n    if (rose.equals(brian)) {\n        println(\"It's the\
    \ same person!\")\n    } else {\n        println(\"Nope... not the same person\"\
    )\n    }\n}\n```"
