  md: 'However, using the math.pow() function a Float is returned. It will only operate
    on Float or

    Double, so you''re going to have to Float values (or Double values) all around.


    This merely generated an error and caused you to convert back to an Int (with
    toInt()) when

    execute() was explicitly set to return an Int. But now, type inference is used.
    To see the potential

    try this:


    ```

    var calc = Calculator()

    var result: Int

    result = calc.execute(5, Operation.Add(5))

    ```


    Compile this code and you''re going to get a surprising error:


    Kotlin: Type mismatch: inferred type is Any but Int was expected


    So what''s going on? Well, Kotlin is forced to infer a type from the expression
    attached to

    execute(), and it cannot infer different types for different cases in the when.
    In other words, Kotlin

    cannot say "Well, if the case is for Operation.Add and Operation.Subtract, that
    an Int is

    returned, but if the case is for Operation.Raiser, that a Float is returned."


    Instead, Kotlin does a type widening. It has to come up with a type that is wide
    enough to support all

    possible types. So for execute(), the possible return values are Int and Float.
    The narrowest

    type in Kotlin that supports both of those is Any (which is quite a wide type
    indeed).


    If you want to avoid widening and control the specific type returned, you''ll
    have to avoid type

    inference. Specify the return type, and then let the compiler take care of warning
    when you

    don''t return that type.


    > NOTE Before you continue, go ahead and change execute() in Calculator to

    return an Int. You''ll also need to take the result of the expression for the

    Operation.Raiser case and convert it back to an Int using toInt(). That will

    allow you to compile so you can keep following along.


