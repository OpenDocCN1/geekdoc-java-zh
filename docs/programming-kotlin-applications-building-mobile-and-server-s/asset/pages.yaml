    if it starts with a or T:


    ```

    { str: String -> if (str.toUpperCase().startsWith("*T")) true false }

    ```


    # Lambda Expressions Are Functions with Less Syntax


    What you''re seeing here is not just an "inline function," but what Kotlin calls
    a lambda expression. This is another way to write a function, and it is even more
    broken down than an anonymous function.


    Here''s an anonymous function:


    ```

    fun(str: String) : Boolean = if (str.toUpperCase().startsWith("*T"))

    true

    else

    false

    ```


    Take out the fun keyword and parameter list, and it becomes even simpler. Now
    this is a lambda expression:


    ```

    { str: String -> if (str.toUpperCase().startsWith("*T")) true false }

    ```


    > It''s largely just a convention that an anonymous function is called a function
    while a lambda expression is called an expression (and not a function). The only
    real syntactic difference is that more often than not, lambdas are shorter and
    usually fit on a single line of a reasonable editor (think 80 characters or so).


    You will also see the term lambda function. This is really not technically correct,
    as a lambda expression can be used as a function but is not usually referred to
    as a function. This largely distinguishes lambda expressions from anonymous functions.


    Technically, there''s more to a lambda expression. Here''s the "fuller" version
    of the lambda expression shown just:


    ```

    val filterT = { str: String -> if (str.toUpperCase().startsWith("*T")) true

    else false }

    ```


    However, lambdas are often used without the val and just passed to another function
    inline, like this:


    ```

    printList(strings, { str: String -> if (str.toUpperCase().startsWith("*T")) true

    else false })

    ```'
