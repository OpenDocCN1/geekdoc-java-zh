  md: 'NOTE There''s actually quite a deep rabbit hole to explore if you want to get
    into the mechanics of Kotlin and generics, and you''ll quickly find yourself learning
    about Java and its usage of generic types as well. If you are programming language
    theory, you might want to check out kotlinlang.org/docs/reference/generics.html,
    which makes a much deeper and more theoretical dive into Kotlin generics and its
    history as it reaches back into Java.


    # GENERICS TRY TO INFER A TYPE WHEN POSSIBLE


    As with any other language, the more you use Kotlin, the more you''ll learn where
    you can let Kotlin figure out things and do less work (which usually means less
    typing). For example, if you create a new instance of a generic type, Kotlin will
    do its best to figure out the parameter type that needs to be assigned to that.


    This is called type inference, and its a very important part of understanding
    Kotlin, generics, and what can be some very annoying exceptions when trying to
    compile code.


    # Kotlin Looks for Matching Types


    For example, suppose you have code like:


    ```

    val brian = Person("Brian", "Truesby", 68.2, 33)

    val rose = Person("Rose", "Bushnell", brian)

    var personList = mutableListOf(brian, rose)

    ```


    Kotlin assumes that you''ve given the mutableListOf() method two Person instances,
    you must want a list of Person. So it infers that you are creating a mutable list:


    ```

    var personList = mutableListOf<Person>(brian, rose)

    ```


    Notice here, the generic List is a parameter type: Person. This should make perfect
    sense. It saves you time, and in early chapters you could do things like this:


    ```

    var wordList = mutableListOf("rose", "any", "other", "name", "rose")

    var primes = mutableListOf(1, 2, 3, 5, 7, 11)

    ```


    In each case, Kotlin type inferences are based on the contents of your list. The
    first is a list of String objects and the second is a list of Int.


    # Kotlin Looks for the Narrowest Type


    But Kotlin does more than just look for a matching type. When it''s doing type
    inference, Kotlin looks for the newest matching type. In other words, it is looking
    for the most restrictive type that matches all incoming arguments.


    Consider the following code:


    ```

    val brian = Person("Brian", "Truesby", 68.2, 33)

    val rose = Person("Rose", "Bushnell", brian)

    var personList = mutableListOf(brian, rose)

    ```'
