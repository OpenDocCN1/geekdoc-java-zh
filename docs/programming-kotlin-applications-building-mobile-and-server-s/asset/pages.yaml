- pgno: 236
  md: "# Companion Objects Are Single Instance | 207\n\n```\nreturn \"$firstName $lastName\
    \ with an email $email has a user\ntype of $type\n}\n```\n\nTo be clear, the const\
    \ keyword doesn't change the type of the variable. In other words, take this line:\n\
    \n```\nconst val ADMIN = \"Admin\"\n```\n\nThis line is not creating a different\
    \ type of this:\n\n```\nval ADMIN = \"Admin\"\n```\n\n> NOTE If you have experience\
    \ programming in Java, you'll likely recognize this as the equivalent of a public\
    \ static final variable. As you're about to see, though, the idea of static in\
    \ Kotlin isn't represented in the same way that it is in Java.\n\nIn either case,\
    \ you end up with a String. That could be \"Admin\" (as it is here) or \"giraffe\"\
    \ or \"asd8asd832nsa\". But the comparison becomes now in isAdmin():\n\n```\n\
    fun isAdmin(): Boolean {\n  return type.equals(ADMIN)\n}\n```\n\nAs long as the\
    \ ADMIN is used on \"both sides\" of the comparison, this will work. You'll want\
    \ to change the code in your test to use this class same:\n\n```\nusers.add(User(\b\
    ardia@gmail.com\", \"Bardia\", \"Dejban\", User.ADMIN))\n```\n\nUnfortunately,\
    \ this you're going to hit a very strange wall. You'll know you hit it when you\
    \ get a compiler error like this:\n\n```\nKotlin: Const 'val' are only allowed\
    \ on top level or in objects\n```\n\nTo fix this, you're going to take a step\
    \ back from string comparison and learn companion objects.\n\n# COMPANION OBJECTS\
    \ ARE SINGLE INSTANCE\n\nWhat's the problem with the code in Listing 9.5?\n\n\
    LISTING 9.5: Current User class ... which won't compile\n\n```\npackage org.wiley.kotlin.user\n\
    \ndata class User(var email: String, var firstName: String, var lastName: String,\
    \ var type: String) {\n  const val ADMIN = \"Admin\"\n}\n```\n\ncontinues"
