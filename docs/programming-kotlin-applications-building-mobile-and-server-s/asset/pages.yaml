  md: '# You Can “Copy” an Object or Make a Copy of an Object | 193


    Here’s the output:


    ```

    Bob''s first name: Percy

    Robert''s first name: Percy

    Bob''s first name: Bob

    Robert''s first name: Bob

    ```


    The most important thing here is to realize that the actual object instance lives
    in memory and the robert variable just references to that memory. When you use
    = to assign robert to a new variable—bob—you’re just assigning to bob.


    When you change the firstName property of bob, you are changing it in what bob
    actually points at—which happens to be bob points to, too. So changes are reflected
    in both variables, and in fact, any variables reference that same instance in
    memory.


    # If You Want a Real Copy. Use copy()


    If you want an actual copy, you can’t use =. You have to use the copy() method,
    which is another thing you get for free with data.


    copy() works just like you’d. You get a new variable with a new instance, but
    that instance starts with all the values of the old instance. Here’s how that
    looks:


    ```

    // Create a variable that is a copy of the robert instance

    val differentBob = robert.copy()

    ```


    | Non-data classes don’t have a copy() implementation that’s useful by

    default, make sure you’re using copy() on a data class instance |


    What’s actually happening here is that there are now two object instances in play:
    the original one, which robert points to, and a new—with its own memory space—which
    bob points to.


    You can see this in action with some more code, as in Listing 8.8.


    # LISTING 8.8: Moving from = to copy()


    ```

    // Create a variable that is a copy of the robert instance

    val differentBob = robert.copy()


    // Change the original instance

    robert.firstName = "Robert"

    robert.email = "powell@rbba.com"


    println("Bob''s name is \${bob.email}")

    println("Bob''s first name is \${bob.firstName}")

    println("Bob''s last name is \${bob.lastName}")


    println("Different Bob''s name is \${differentBob.email}")

    println("Different Bob''s first name is \${differentBob.firstName}")

    println("Different Bob''s last name is \${differentBob.lastName}")

    ```'
