    # Does Any of This Really Matter?


    If your eyes are rolling back into you and you''re stuck thinking "contra" as
    the name of a sidesider video game, you are in good company. Covariance and contravariance
    are heavy topics, and you''re not going to find a list of discussion around them
    at typical programmer gatherings. They might turn up in an advanced session of
    Kotlin at a conference or in an article on medium.com, but it''s nothing that
    is going to come in your every-single-day programming life.


    Additionally, a Kotlin programmer (or programmer of Java, or any other inheritance-heavy
    language) has lived out their days never once worrying about whether to use in
    or out. You might occasionally run into an error like this:


    Type parameter T is declared as ''in'' but occurs in ''out'' position in type
    T


    But that''s really it. Even then, you could likely fiddle with your code until
    it compiles. Then . . . why all the fuss?


    Here''s why: if you want to gain a deep understanding of inheritance, you''re
    going to need at least a basic understanding of covariance and contravariance.
    You should recognize the in and out keywords, because they appear in the Kotlin
    source code, especially in collections. And yes, sometimes you may want to engage
    in one of those advanced-level sessions at the dusty end of a conference hall.


    # UNSAFEVARIANCE: LEARNING THE RULES, THEN BREAKING THEM


    As long as you are hanging out in the restricted area of the library, there''s
    one more keyword you should learn, and it''s actually called an annotation: @UnsafeVariance.


    > NOTE An annotation is a form of metadata in Kotlin. It''s a way to write something
    in your code that speaks to the compiler directly, often giving it an instruction.


    The @UnsafeVariance annotation is used like this:


    ```

    override fun lastIndexOf(element: @UnsafeVariance E): Int = indexOfLast { ...
    }

    ```'
