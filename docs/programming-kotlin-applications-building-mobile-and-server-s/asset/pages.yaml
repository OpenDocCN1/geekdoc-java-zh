  md: "# CHAPTER 1 OBJECTS ALL THE WAY\n\nBut you can also use the keyword `var`,\
    \ something you *haven't* done yet. That would look like this:\n\n```\nvar brian\
    \ = Person(\"Brian\", \"Tresby\")\n```\n\nFirst, in both cases, you end up with\
    \ a variable; val does not stand for value, for example, but is simply another\
    \ way to declare a variable, alongside `var`. When you use `val`, you are creating\
    \ a constant variable. In Kotlin, a constant variable can be assigned a value\
    \ once, and only once. Once a variable is then it can never be changed.\n\nYou\
    \ created the `lastName` variable in `Person` with this line:\n\n```\nclass Person(val\
    \ firstName: String, val lastName: String) {}\n```\n\nThat defines `lastName`\
    \ (and `firstName`) as a constant variable. Once it's passed in and assigned when\
    \ the `Person` instance is created, it can't be changed. That makes this statement\
    \ illegal:\n\n```\nrose lastName = \"Busnell-Tresby\"\n```\n\nTo clear the odd\
    \ error from earlier, what you need is for `lastName` to be a *mutable* variable;\
    \ you need it to be changeable after initial assignment.\n\n> Note Not to beat\
    \ a hairy and somewhat fluffy dog to death, but here is another reason to use\
    \ mutator over setter; a mutator allows you to mutate a mutable variable. This\
    \ aligns the terminology much more cleanly than using \"setter.\"\n\nSo change\
    \ your `Person` constructor to use `var` instead of `val`. This indicates that\
    \ `firstName` and `lastName` can be changed:\n\n```\nclass Person(var firstName:\
    \ String, var lastName: String) {}\n```\n\nNow you should be able to compile the\
    \ program again, without error. In fact, once you've done that, make a few tweaks.\
    \ You want to end up with your code looking like Listing 1.7.\n\n# LISTING 1.7:\
    \ Using mutable variables\n\n```\nclass Person(var firstName: String, var lastName:\
    \ String) {\n  // Set the full name when creating an instance\n  init {\n    fullName\
    \ = \"$firstName $lastName\"\n  }\n\n  override fun toString(): String {\n   \
    \ return fullName\n  }\n}\n```"
