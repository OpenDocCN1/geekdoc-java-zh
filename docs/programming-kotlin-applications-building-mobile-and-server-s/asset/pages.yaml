  md: "# EVERY OBJECT INSTANCE NEEDS A UNIQUE HASHCODE()\n\nGreat! You've got equality\
    \ covered! But there's something you're (now) missing: an overridden implementation\
    \ of hashCode() to match. To understand why, you need to take a deeper look at\
    \ Any.\n\n# All Classes Inher from Any\n\nEvery Kotlin object has Any as its base\
    \ class. That doesn't mean much now if you're new to inheritance, but it will\
    \ later. For now, it means that the Any class defines behavior that Kotlin classes—including\
    \ the ones you define, like Person—must either use or override. Any class is shown\
    \ in its entirety in Listing 3.4.\n\n> NOTE It's easy to get class and object\
    \ mixed up. A class is your code that defines an object. So, Person.kt is your\
    \ Person class. The class defines an object. So which defines an object. Then,\
    \ when you create a new instance of that object, you have an object instance.\
    \ All three of these things are different: class, object, and instance.\n difference\
    \ is really important; so because a lot of the time, developers are a little sloppy\
    \ in terminology and use the terms interchangeably. Your ability to determine\
    \ if “create a new Person object” means to create a new class, a new object, or\
    \ a new object instance, will help you enormously in becoming a better developer.\n\
    \nLISTING 3.4: Any, the base class for all Kotlin classes\n\n```\n/\n* Copyright\
