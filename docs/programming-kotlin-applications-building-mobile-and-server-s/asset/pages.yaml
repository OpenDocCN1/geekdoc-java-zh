    \ String = _lastName\n}\n```\n\nThis class is at least on the surface, functionally\
    \ identical to User. Listing 8.5 is an updated version of the test class to compare\
    \ how User (a data class) compares to SimpleUser (which isn't a data class).\n\
    \nLISTING 8.5: Comparing what you get \"for free\" between User and SimpleUser\n\
    \n```\nimport org.wiley.kotlin.user.SimpleUser\nimport org.wiley.kotlin.user.User\n\
    \nfun main() {\n    val robert = User(\"powell@rockwallblackbelt.com\", \"Robert\"\
