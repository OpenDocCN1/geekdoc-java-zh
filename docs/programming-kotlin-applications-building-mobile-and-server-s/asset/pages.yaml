- pgno: 296
  md: '# Function Literals: Lambdas and Anonymous Functions


    > NOTE You may have noticed that the terms lambda expression and lambda are often
    used interchangeably. They are the same in terms of Kotlin use, you''ll often
    see lambda or lambdas as a shorter stand-in for lambda expression or lambda expressions.


    In the current definition of filterOut, the lambda takes a single parameter. You
    can actually omit it in the input lambda. Here''s a version of a lambda that indicates
    the parameter it takes in:


    ```

    { str: String -> if (str.toUpperCase().startsWith("T")) true else false }

    ```


    Here''s an equivalent lambda using it:


    ```

    { if (it.toUpperCase().startsWith("T")) true else false }

    ```


    Since this lambda only requires a single parameter, it is omitted. Then, it is
    used to represent that parameter.


    Then this lambda is passed into a higher-order function; the higher-order function
    essentially controls the type of parameter. Because printList() declares that
    it takes a lambda which accepts a String, lambda expression basically can only
    take String inputs when used by printList().


    # it Makes Lambdas Work More Smoothly


    Now that you''ve seen how it works, you can get a better idea of why a lambda
    expression that has no declared input parameter can be passed to a higher-order
    function that expects a function with a single input.


    Consider this lambda expression:


    ```

    { str: String -> true }

    ```


    In this expression, a single parameter is accepted, but ignored in the actual
    expression. That''s perfectly legal. Recall that if you have a single parameter,
    you don''t have to declare it. You can just use it:


    ```

    { if (it.length > 5) true else false }

    ```


    Since you don''t have to use input parameters, you can just easily reduce all
    of this:


    ```

    { true }

    ```


    This is now a legal lambda expression for any higher-order function that accepts
    a function with a single argument.


    # Lambda Expressions Return the Last Execution Result


    Take another look at some of the lambda expressions used for filtering so far:


    ```

    { if (it.toUpperCase().startsWith("T")) true else false }

    ```'
