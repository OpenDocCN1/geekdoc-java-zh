- pgno: 342
  md: "# Interfaces Define Behavior but Have No Body | 33\n\n```\nprintln(\"nLoading\
    \ fleet of cars...\")\nvar cars : MutableList<Car> = loadCars(10)\nfor (car in\
    \ cars) {\n    car.start()\n    car.drive(\"E\", Random.nextInt(0, 200))\n   \
    \ car.stop()\n}\n```\n\n```\nfun loadCars(numCars: Int) : MutableList<Car> {\n\
    \    var list = mutableListOf<Car>()\n    for (i in 0..numCars) {\n        when\
    \ (Random.nextInt(0, 3)) {\n            0 -> list.add(Honda(\"CRV\", \"black\"\
    )\n            1 -> list.add(Porsche(\"Boxster\", \"yellow\")\n            2 ->\
    \ list.add(BMW(\"435i\", \"blue\")\n            3 -> list.add(Infiniti(\"QX60\"\
    , \"silver\")\n        }\n    }\n    return list\n}\n```\n\nThe key is not the\
    \ behavior or the output. It's that from program's point of view, every entry\
    \ in the cars list is a Car. This is where contract is so important: Each Car\
    \ subclass has a drive() and a start() and a stop(). It really doesn't matter\
    \ how those functions are implemented. Your code can just trust that they are\
    \ implemented, because that's what the contract laid out by Car establishes.\n\
    \n# INTERFACES DEFINE BEHAVIOR BUT HAVE NO BODY\n\nYou've seen that abstract classes\
    \ have a couple of specific properties:\n\n+   - They define a contract for later\
    \ behavior by requiring that certain functions and properties are implemented\n\
    - They can add concrete properties and functions that are inherited by subclasses\n\
    \nInterfaces are similar, but can *only define behavior and properties*. They\
    \ cannot define anything concrete in terms of using any property or being accessed\
    \ by the rest of the class.\n\n> NOTE That last sentence is a bit odd. What does\
    \ it mean to use a property for state, or to access that property in the rest\
    \ of the class? It's okay if that was hard to follow, because it's something quite\
    \ unusual about interfaces. Keep reading and it will become clearer, but don't\
    \ worry if you don't quite understand what means just yet."
