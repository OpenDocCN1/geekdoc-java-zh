- pgno: 339
  md: "# Subclasses Fulfill the Contract Written by an Abstract Class\n\nNow you see\
    \ that an abstract class is of no real value until until it is subclassed. It\
    \ really goes further: most abstract classes are intended to be subclassed by\
    \ multiple subclasses. You wouldn't create Car unless you intended more than a\
    \ Honda subclass.\n\n# Subclasses Should Vary Behavior\n\nWhen you start to see\
    \ multiple subclasses, though, there are some things to be careful about. First,\
    \ you really want subclasses to have different behaviors. To see this, look first\
    \ at a counterexample. Listing 12.12 creates another subclass of Car called Porsche.\n\
    \nLISTING 12.12: Building another subclass of Car\n\n```\npackage org.wiley.kotlin.car\n\
    class Porsche(model: String, color: String) : Car(model, color) {\n    override\
    \ var maxSpeed: Int = 212\n\n    override fun start() {\n        println(\"Starting\
    \ up the Porsche ${model}!\")\n    }\n\n    override fun stop() {\n        println(\"\
    Stopping the Porsche ${model}!\")\n    }\n\n    override fun drive(direction:\
    \ String, speed: Int) : Int {\n        println(\"The Porsche ${model} is driving!\"\
    )\n        return speed / 60\n    }\n}\n```\n\nThis is actually a poor example\
    \ of subclassing—not just the Porsche class, but in combination with the Honda\
    \ class. Both Honda and Porsche are doing the exact same things in the start(),\
    \ stop(), and drive() functions.\n\nYou could actually refactor this and make\
    \ these functions concrete in Car:\n\n```\n// Start the car up\nfun start() {\n\
    \    println(\"Starting up the ${this::class.className} ${model}!\")\n}\n\n//\
    \ Stop the car\nfun stop() {\n    println(\"Stopping the ${this::class.className}\
    \ ${model}!\")\n}\n```\n\nAt this point, the base class—abstract or not—takes\
    \ care of printing a generic message associated with starting and stopping each\
    \ specific instance type."
  merge: -1
  img_proc: true
- pgno: 340
  md: "Imagine for the sake of the details of how these various cars start is different.\
    \ That's not actually far-fetched, and the further you go modeling the behavior\
    \ of the vehicles actually start up, the truer this becomes. So you might have\
    \ this for how a Honda starts:\n\n```\noverride fun start() {\n    println(\"\
    Inserting the key, depressing the brake, pressing the ignition, starting.\")\n\
    }\n```\n\nAnd you might have this for the Porsche:\n\n```\noverride fun start()\
    \ {\n    println(\"Remote starting, depressing the brake, shifting into drive\"\
    )\n}\n```\n\nYou could imagine replacing these println statements with other function\
    \ calls to vary your vehicle functions.\n\nIn general, if your subclasses have\
    \ the same behavior in them, then you should review how you are using inheritance.\n\
    \n# The Contract Allows for Uniform Treatment of Subclasses\n\nAs you develop\
    \ your inheritance tree, you should see more and more subclasses, but a greater\
    \ degree of variety within how subclasses override the base abstract class's behavior.\n\
    \nThe key is that: all subclasses originate in a base class. That means that you\
    \ can treat the subclasses as the base class and operate upon the contract rather\
    \ than the specific subclass. Now that's a lot of formal language, so it's worth\
    \ walking through how that looks.\n\nFirst, you need a few Car subclasses. Listings\
    \ 12.13 and 12.14 add an Infiniti and a BMW to the mix.\n\n+   LISTING 12.13:\
    \ An Infiniti subclass of Car\n\n```\npackage org.wiley.kotlin.car\n\nclass Infiniti(model:\
    \ String, color: String) : Car(model, color) {\n\n    override var maxSpeed: Int\
    \ = 167\n\n    override fun start() {\n        println(\"Starting the Infiniti\
    \ ${model}: Inserting the key, starting the engine\")\n    }\n\n    override fun\
    \ stop() {\n        println(\"Stopping the Infiniti ${model}!\")\n    }\n\n  \
    \  override fun drive(direction: String, speed: Int) : Int {\n        println(\"\
    The Infiniti ${model} is driving!\")\n        return speed / 60\n    }\n}\n```"
