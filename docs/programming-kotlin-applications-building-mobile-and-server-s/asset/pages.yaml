  md: "# CHAPTER 7 FLYING THROUGH CONTROL STRUCTURES\n\nSome other variations exist,\
    \ too. First, on the initial line of your when, you can actually perform computation:\n\
    \n```\nwhen (anotherNumber % 2) {\n    0 -> println(\"The number is even!\")\n\
    \    else -> println(\"The number is odd!\")\n}\n```\n\nThere's not that much\
    \ surprising here. Kotlin evaluates (anotherNumber % 2) and the result is combined\
    \ with the partial expressions in each branch to determine which to follow. And\
    \ you can use functions in that first line as well:\n\n```\nwhen (mom.children.size\
    \ % 2) {\n    0 -> println(\"The kids can pair up!\")\n    else -> println(\"\
    Uh, someone will be left out!\")\n}\n```\n\nYou can have functions in branch conditions,\
    \ too:\n\n```\nwhen {\n    canPlayBasketball(mom.children.size) -> println(\"\
    You can play a good game of hoop!\")\n    canPlayTag(mom.children.size) -> println(\"\
    Plenty for tag!\")\n    else -> println(\"Uh, no good game ideas!\")\n}\n```\n\
    \n> WARNING If you're following along, this code isn't actually working code,\
    \ as there are no canPlayBasketball() or canPlayTag() methods defined anywhere.\
    \ It's purely for demonstration purposes.\n\nAll of these are just expressions,\
    \ whether in the initial line of a when or in a branch; partial or complete.\n\
    \n# When Can Be Evaluated as a Statement, Too\n\nRemember that if statement can\
    \ actually be evaluated as a whole:\n\n```\nprint(\"The number you guessed\")\n\
    var hasRightNumber = if (guess.toInt() == theNumber) {\n    true\n} else {\n \
    \   println(\"wrong.\")\n    false\n}\n```\n\nprintln(hasRightNumber)"
