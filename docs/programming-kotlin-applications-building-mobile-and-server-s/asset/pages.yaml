    \ Vehicle the generic go() to the more specific drive(). Finally, concrete classes\
    \ offer behavior that backs all of that. However, at the top of the inheritance\
    \ tree, it's still the go() function that kicked all this behavior off. You can\
    \ see this illustrated in Figure 12.2.\n\n![](img/0c8d5d6c6d95ced628a954a187036113_353_0.png)\n\
    \nFIGURE 12.2: The go() function in Vehicle eventually is handled by drive() implementations\
    \ in concrete subclasses of Car.\n\n# More Specificity Means More Inheritance\n\
    \nTo round things out, here's a fairly significant chunk of code. Listing 12.28\
