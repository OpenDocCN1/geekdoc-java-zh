  md: "# LISTING 11.5 (continued)\n\n```\nlen < 0 -> null\nlen == 0 -> (1..len).map\
    \ { \"ABCDEFGHIQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\".random() }.joinToString(\"\
    *\")\nlen > 0 -> random()\nelse -> null\n\nfun formatString(str: String) : String\
    \ =\n\"\\n>>> ${str}\\***\n```\n\nTry to compile, and you'll get an error:\n\n\
    Kotlin: Type mismatch: inferred type is String? but String was expected\n\nThis\
    \ is a problem you've seen before. formatString() does not accept String?, but\
    \ String. In other words, it will take a String, but String must be non-null,\
    \ and that's okay as formatString compiler is ensuring that is the case.\n\n#\
    \ Accepting null Values Isn't a Great Idea\n\nOne easy fix would be to change\
    \ formatString() to have this signature:\n\n```\nfun formatString(str: String?)\
    \ : String =\n\"\\n>>> ${str}\\***\n```\n\nThis is legal and will take care of\
    \ the compilation error. With this change, formatString() will accept someString,\
    \ because someString might be null, and formatString() takes in a String.\n\n\
    However, this is really a bad practice. The strongest features of Kotlin is its\
    \ strong typing and compile-time type safety, so coding something that accepts\
    \ nullable values, you lose these strong typing and type safety abilities.\n\n\
    While you'll never be able to completely remove the ? operator or functions and\
    \ variables that might interact with null, you should try to reduce the occurrences\
    \ of them.\n\n# Scope Functions Give You Null Options\n\nSo what do you do? To\
    \ keep type safety and avoid lots of nullable values, but sometimes, you have\
    \ a situation where you might have a null and you need to deal with that. Frankly,\
    \ scope functions are perfect for this.\n\nYou can add a scope function like let\
    \ onto a variable that might be null after you add a ? operator. If the variable\
    \ is null, the scope function is ignored. If it's not, the scope function executes.\
    \ Listing-11.6 shows this in action\n\n# LISTING 11.6: Using a scope function\
    \ to work around potentially null values\n\n```\nfun main() {\n  var someString:\
    \ String? = getRandomString(10)\n  println(someString)\n```"
