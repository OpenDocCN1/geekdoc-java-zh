    \ pretty self-explanatory. The potential wrinkle is the ? after person.partner\
    \ in the printPartnerStatus() helper function. That indicates partner might be\
    \ null, and if it is, simply stop the operation. null is returned from the expression\
    \ to indicate that a null value was found.\n\nNote that even though this function\
    \ called hasPartner() first, you still have to use the ? operator to safely call\
    \ a function attached to a potentially nullable property (partner).\n\nAgain,\
    \ remember the (fictional) situation: you want to add a marry() function to Person,\
    \ but don't have the ability to change Person. You can define a function using\
    \ the class name (Person), a dot (.), and the new function.\n\nHere's an example\
    \ of how you could code marry():\n\n```\nfun Person.marry(spouse: Person) {\n\
    \    this.partner = spouse\n    spouse.partner = this\n}\n```\n\nThis is almost\
    \ trivial in its simplicity, and it's one particularly cool feature of Kotlin.\n\
    \n# This Gives You Access to the Extension Class\n\nIn addition to the dot notation\
    \ for the function—following the class being extended—there's another addition:\
    \ the this keyword. This is where the scoping of an extension function gets a\
    \ little unusual. this an extension function gives you access to the class being\
    \ extended (usually called the extension class)."
