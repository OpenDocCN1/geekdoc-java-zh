  md: "# Extension Functions Extend Existing Behavior without Inheritance\n\nIf you\
    \ have a class like Calculator, and you want to extend or build upon that class's\
    \ behavior, you would likely subclass Calculator and add a new function or override\
    \ an existing function. This is exactly what Abstract did. However, this case\
    \ was pretty simple because you had control of both the Calculator and Abacus\
    \ classes. You were able to set Calculator as open and then subclass it.\n\nIn\
    \ this case, it was pretty easy to subclass Calculator. The class itself was open,\
    \ there wasn't a lot of abstract behavior that had to be defined, and there was\
    \ no compelling reason not to subclass Calculator with Abacus.\n\nIt's not always\
    \ easy to extend or add to a class's behavior, though you might want to add behavior\
    \ to a class that you don't have access to, and the class itself isn't open. Or\
    \ the class that the behavior you want to add has a lot of other behavior that\
    \ you don't want to extend, or even inherit.\n\nIn all of these cases, an extension\
    \ function may allow you to add or override behavior without inheritance and subclassing.\n\
    \n> NOTE If you're having a hard time thinking of a case where an extension function\
    \ is hasty, consider that every time you use a library of code, you're likely\
    \ using code that isn't open for extension and that you don't have the ability\
    \ to subclass. That's exactly the use case for extension functions.\n\n# Extend\
    \ an Existing Class Using Dot Notation\n\nSuppose you've got the Person class\
    \ shown in Listing 10.9. To make this bit more realistic, this version removes\
    \ the open keyword that allows Person to be subclassed. It is now in effect a\
    \ class that can't be added.\n\nLISTING 10.9: A closed version of the Person class\n\
    \n```\npackage org.wiley.kotlin.person\n\nclass Person(firstName: String, lastName:\
    \ String,\n      height: Double = 0.0, _age: Int = 0) {\n\n    var firstName:\
    \ String = firstName\n    var lastName: String = _lastName\n    var height: Double\
    \ = _height\n    var age: Int = _age\n```\n\ncontinues"
