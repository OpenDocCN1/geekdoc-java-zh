    \ 2060437994\n\n# Use == equals(x) for Speed\n\nThe second item is to consider\
    \ some improvements in equals(x). This is important because one of the keys for\
    \ equals(x) is in list comparison. We have not used lists yet, but they are an\
    \ important part of programming languages, and Kotlin is no exception. On top\
    \ of that, one key part of using lists is comparing items.\n\nWhether you're building\
    \ a web application or a mobile application, ensuring that every time items are\
    \ compared in a list as fast as possible is a big deal for your users' experience.\n\
    \nAn easy performance gain is to be had looking at the current equals(x) implementation:\n\
    \n```\noverride fun equals(other: Any?): Boolean {\n    if (other is Person) {\n\
    \        return (firstName.equals(other.firstName)) &&\n               (lastName.equals(other.lastName))\n\
    \    } else {\n        return false\n    }\n```\n\nThis is using equals(x) to\
    \ do string comparisons. But that method actually uses == (the equals operator),\
    \ which compares two objects (Strings in this case) to see if they're equal. You\
    \ can rewrite equals(x) to look like this:\n\n```\noverride fun equals(other:\
    \ Any?): Boolean {\n    if (other is Person) {\n        return (firstName == other.firstName)\
    \ &&\n               (lastName == other.lastName)\n    } else {\n        return\
    \ false\n    }\n```\n\nWhile this doesn't seem like a big deal, it's going to\
    \ result in two fewer methods: one to equals(x) on firstName and another on equals(x)\
    \ in lastName. Those methods would then use ==, so you can go directly to that.\
    \ Two method calls on every comparison can really add up, especially in list full\
    \ of hundreds of objects!\n\n# A Quick Speed Check on hashCode()\n\nYou should\
    \ also take a look at hashCode() and see if it is optimized for the fast comparisons\
    \ that list operations needs.\n\n```\noverride fun hashCode(): Int {\n    return\
    \ (firstName.hashCode() * 28) + (lastName.hashCode() * 31)\n}\n```"
