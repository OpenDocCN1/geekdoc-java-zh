  md: '# 13


    # Kotlin: The Next Step


    WHAT''S IN THIS CHAPTER?


    +   - Kotlin for Android

    - Kotlin for Java

    - Building with Gradle

    - Start writing your own codelab


    # PROGRAMMING KOTLIN FOR ANDROID


    One of the most common uses for Kotlin is programming mobile applications, especially
    for the Android platform. You may be surprised that this didn''t receive major
    coverage in this book. However, everything you do to program a mobile application
    depends on objects, functions, instantiation, inheritance, and the topics covered
    in this book. It''s far more important that you have an idea of how Kotlin works
    than to learn a bunch of odd class names and build a mobile application—all unsure
    of what you''re actually creating.


    # Kotlin for Android Is Still Just Kotlin


    The following is a prerequisites notice for the simplest possible Android app
    that Google''s Codelabs teaches you to build:


    > This codelab is written for programmers and assumes that you know either the
    Java or Kotlin programming language. If you are an experienced programmer and
    adept at reading code, you will likely be able to follow this codelab, even if
    you don''t have much experience with Kotlin.'
  merge: -1
  img_proc: true
- pgno: 361
  md: "As you can see, you're going to have know Kotlin in general before you can\
    \ get into specific uses, mobile or otherwise. Once you know Kotlin, then going\
    \ deeper into any area is largely centered on two areas:\n\n+   Learning new libraries\
    \ and possibly syntax. This is the case for Android programming in particular:\
    \ there are a lot of mobile-specific libraries you'll need to get used working\
    \ with.\n\n+   Learning new syntax and idioms. You'll remember the idea of programming\
    \ idiomatic Kotlin from Chapter 11. This is the concept of working with libraries\
    \ in a way that is accepted as “best” for a particular use case.\n\nListing 13.1\
    \ shows a fragment from the same Google Codelabs tutorial starting out in Android.\n\
    \n# LISTING 13.1: Loading and deploying text on an initial view\n\n```\noverride\
    \ fun onCreateViewCreated(view: View, savedInstanceState: Bundle?) {\n    super.onViewCreated(view,\
    \ savedInstanceState)\n\n    view.findViewById<Button>(R.id.count_button).setOnClickListener\
    \ {\n        val countTextView = view.findViewById<TextView>(R.id.count_text)\n\
    \        val currentCount = countTextView.text.toString().toInt()\n        val\
    \ action = FirstFragmentDirections.actionFirstFragmentToSecondFragment(currentCount)\n\
    \        navNavController().navigate(action)\n    }\n\n    // show the toast by\
    \ its ID\n    view.findViewById<Button>(R.id.toast_button).setOnClickListener\
    \ {\n        // create a Toast with some text, to appear for a short time\n  \
    \      val myToast = Toast.makeText(context, \"Hello Toast!\", Toast.LENGTH_SHORT)\n\
    \        // show the Toast\n        myToast.show()\n    }\n\n    view.findViewById<Button>(R.id.count_button).setOnClickListener\
    \ {\n        countMe(view)\n    }\n}\n```\n\nFully two-thirds of this code is\
    \ operating with Android libraries and the android.view.View object. This is specific\
    \ to building visual mobile applications, and you'll see the android.widget.TextView\
    \ class also appearing in this listing.\n\nThese classes operate like any other\
    \ Kotlin class—even though they build upon Java objects aimed at Android. Most\
    \ of the code is doing the things you've learned from the earliest chapters: inheriting,\
    \ calling functions on the base class, creating variables, and passing lambdas\
    \ to other functions like setOnClickListener()."
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Move from Concept to Example


    There''s another important difference in how you should approach learning a skill
    like programming Kotlin for Android as opposed to learning Kotlin overall. As
    you''ve certainly seen by now, there are at least many examples of syntax in this
    book as there are actual code samples. The samples in this book are relatively
    basic, because the focus is on concept and fundamental learning. How does inheritance
    work? How does abstract class work?


    The result is that the examples are simpler, and the explanation is longer. However,
    you are now ready to flip that and focus on longer code examples, tutorials, and
    hundreds and at times thousands of lines of code. You need fewer explanation now,
    as you understand the basics. The best thing you can do is to code, code, code.


    Here are a few code-heavy tutorial sites to start with:


    +   codelabs.developers.google.com: Google''s Codelabs have been mentioned a few
    times already. It''s really the gold standard for getting into Android with Kotlin.
    It still has a bit of explanation but does focus on practical examples and writing
    a lot of code. It''s an ideal next step after finishing this.


    +   developer.android.com: Android''s own developer site actually links you back
    to Codelabs in many cases, but organizes things bit differently and is a different
    view of where to get into Android programming.


    Beyond these two sites, any web search will find you a ton of good sites for getting
    into Android programming using Kotlin.


    # KOTLIN AND JAVA ARE GREAT COMPANIONS


    Just as using Kotlin for Android programming is a great pairing, interacting with
    Java code in Kotlin is also a great combination. However, the relationship between
    these two is a bit different.


    When it comes to Android, you will use Kotlin to interact with Android-based phones.
    You''ll primarily write all Kotlin code, and rarely need beyond the Kotlin libraries
    that Android provides. With Java, often exists alongside existing Java code, and
    you may move between a piece of Java code and a piece of Kotlin code, or even
    take a piece of data from Java, work on in Kotlin, and send it back to Java. As
    a result, you''ll likely need to have a fairly solid understanding of Java in
    addition to Kotlin for this use case.


    # Your IDE is a Key Component


    For most Kotlin applications—building mobile applications, desktop applications,
    or anything else—lot of your work is going to be within a local project that is
    then deployed elsewhere.'
  merge: -1
  img_proc: true
- pgno: 363
  md: "# CHAPTER 13 KOTLIN: THE NEXT STEP\n\n> NOTE If your background is in web programming.\
    \ Kotlin will cause you to level your local development skills. This is quite\
    \ different than (for example) developing a React application that interacts with\
    \ an API gateway and lambdas in Amazon Web Services (AWS) or similar.\n\nWhile\
    \ you can certainly interact with APIs in Kotlin, and deploy to a cloud platform,\
    \ many of your applications will be compiled locally and deployed as a complete\
    \ unit of work. In those cases, the IDE really does become a critical part of\
    \ your toolchain.\n\nIf you get Kotlin code and Java code into the same project,\
    \ they can call each other without issue. This typically involves telling your\
    \ IDE that you want to use the JVM. This will vary for different IDEs, in IntelliJ,\
    \ you don't have to do anything; Java support is built in. Listing 13.2 is a simple\
    \ version of User from previous chapters that use the Java Date package without.\n\
    \n# LISTING 13.2: Interacting with Java from Kotlin\n\n```\npackage org.wiley.kotlin.user\n\
    \nimport java.util.Date\n\ndata class User(var email: String, var firstName: String,\
    \ var lastName: String)\n{\n    val createdOn = Date()\n\n    override fun toString():\
    \ String {\n        return \"$firstName $lastName with an email of $email created\
    \ on ${createdOn}\"\n    }\n}\n```\n\nIf you didn't know better, you'd never know\
    \ that this class mixes Java and Kotlin. But java.util.Date is very much a Java\
    \ package, and in toString(), the property that stores a Date instance is treated\
    \ like any other Kotlin property:\n\n```\nreturn \"$firstName $lastName with an\
    \ email of $email created on ${createdOn}\"\n```\n\nListing 13.3 shows a simple\
    \ program to use this class.\n\n# LISTING 13.3: Using the Kotlin class that in\
    \ uses Java\n\n```\nimport org.wiley.kotlin.user\n\nfun main() {\n    var user\
    \ = User(\"wayne.scott@example.com\", \"Wayne\", \"Scott\")\n\n    println(user)\n\
    }\n```\n\n*"
