    \ -> \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzwxyz\".random().joinToString(\"\
    \")\n  else -> null\n}\n```\n\nNow, you're passing null to let. So the let code\
