- pgno: 120
  md: '# Need Specifics? Consider a Subclass


    NOTE Once again, you''ve done a lot of work just to remove a lot of the code you
    just wrote. Still, this is the way of a good programmer, refactor, and eliminate
    waste. While you could certainly just copy a final state for Person back in Chapter
    1, you''d know a lot less about how classes work, and that''s really the point,
    isn''t it? Keep working through the examples—even when it means removing code
    you worked hard to write—and realize that nobody uses a programmer on the length
    of their code. In fact, most programmers write less code than less experienced
    ones!


    # NEED SPECIFICS? CONSIDER A SUBCLASS


    Person is looking pretty solid at this point. But it''s still a single class,
    and a relatively simple one at that. Suppose you wanted to build a genealogy and
    model the various relationships. You might have a person with a partner (which
    is already handled), but you also want to model parents and children (and their
    children).


    This is a case you have a class—Person—but now want a more specific version of
    that class. It''s important to understand: by adding things to Person, like a
    parent or child, you''re making it less flexible; you''re making the class apply
    to a subset of the original thing.


    Put another way, all people are people—Persons are children. But not all Persons
    are children. Person is more general, and a child is more specific. If you''re
    moving from the general to the specific, you should consider using a subclass
    rather than adding properties to your existing class.


    # Any Is the Base Class for Everything in Kotlin


    You''ve already seen this in action when you overrode equals(x) and hashCode()
    (briefly) at the source code for Any. It''s shown again in Listing 4.14, although
    most of the comments have been stripped out for space.


