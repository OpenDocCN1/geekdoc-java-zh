  md: 'So what’s happening here? Well, you’re about to put your knowledge of covariance
    and invariance into practice.


    First, look at the definition of the Array class:


    ```

    class Array<T> { ... }

    ```


    So that''s it. It''s not covariant, and not contravariant; it''s invariant.


    > NOTE You''ll find it increasingly common to want to see how classes are defined
    in Kotlin (or any other language). This is easy; just Google “Kotlin source code
    [class name]” and you’ll almost always get a direct link to that class’s source
