  md: "# Handle Everything Else with an else Block\n\nYou can use an else with when\
    \ as well. In this case, else catches anything that wasn't explicitly matched\
    \ prior to the else:\n\n```\nvar anotherNumber = Random.nextInt(0, 1000)\n\nvar\
    \ even = false\nwhen (anotherNumber) {\n  0 -> {\n    println(\"the number is\
    \ 0\")\n    even = true\n  }\n  1 -> println(\"the number is 1\")\n  2 -> {\n\
    \    println(\"the number is 2\")\n    even = true\n  }\n  3 -> println(\"the\
    \ number is 3\")\n  4 -> {\n    println(\"the number is 4\")\n    even = true\n\
    \  }\n  else -> println(\"The number is 5 or greater\")\n}\n```\n\nIn this example,\
    \ anotherNumber can now run up to 1000, and the else handles anything greater\
    \ than 4. And else can also have its own code block:\n\n```\nvar anotherNumber\
    \ = Random.nextInt(0, 1000)\n\nvar even = false\nwhen (anotherNumber) {\n  0 ->\
    \ {\n    println(\"the number is 0\")\n    even = true\n  }\n  1 -> println(\"\
    the number is 1\")\n  2 -> {\n    println(\"the number is 2\")\n    even = true\n\
    \  }\n  3 -> println(\"the number is 3\")\n  4 -> {\n    println(\"the number\
    \ is 4\")\n    even = true\n  }\n  else -> {\n    println(\"The number is 5 or\
    \ greater\")\n    even = (anotherNumber % 2 == 0)\n  }\n}\n```\n\nprintln(\"The\
    \ actual number was $anotherNumber\")"
