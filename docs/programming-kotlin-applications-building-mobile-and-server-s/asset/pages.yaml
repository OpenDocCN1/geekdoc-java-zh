  md: "# FUNCTION LITERALS: LAMBDAS AND ANONYMOUS FUNCTIONS\n\nFunctions in Kotlin\
    \ are typically declared. They have a name and are scoped to a class in most cases.\
    \ It is a typical member of the Person instance, and you can call it using its\
    \ name,\nfullName():\n\n```\nfun fullName(): String {\n    return \"$firstName$LastName\"\
    \n}\n```\n\nAnd this is also declared, as an extension function. It can be called\
    \ on a Person instance with its name,\nmarry():\n\n```\nfun Person.marry(spouse:\
    \ Person) {\n    this.partner = spouse\n    spouse.partner = this\n}\n```\n\n\
    Nothing special here.\n\n# Anonymous Functions Don’t Have Names\n\nBut functions\
    \ do not have to be declared like this. You can essentially drop a function in\
    \ anywhere, even in the middle of other code. Create a new test class—you can\
    \ call it Lambda—and add the code shown in Listing 10.12.\n\n> LISTING 10.12:\
    \ Creating an anonymous function\n\n```\nfun main() {\n    // Anonymous function\n\
    \    println(\"Here we go!\")\n}\n```\n\nThis looks a bit odd because it’s not\
    \ declared with a name, but it also isn’t reusable in any way. It’s just a function\
    \ sitting in the middle of another function (declared as main()). What’s order\
    \ if you run this code, you will not get output. By putting the code inside curly\
    \ braces { and }, you’re telling Kotlin you’re defining a function. Functions\
    \ have to be run to execute, since this function isn't, you'll get no output at\
    \ all.\n\nThis is an example of an anonymous function, and it’s just what it sounds\
    \ like it: a function that doesn’t have a name. It looks like a function, it acts\
    \ like a function, and Kotlin sees it as a function. It simply doesn’t provide\
    \ a name to be called.\n\nYou can also add parameters and return types, as shown\
    \ in Listing 10.13."
