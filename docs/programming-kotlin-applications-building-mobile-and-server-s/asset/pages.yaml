  md: '# Destructuring Data through Declarations | 189


    > WARNING This code will work as shown as long as you''ve been following along
    with the code samples in this chapter so far, and as long as this code appears
    after the robert instance of User has been instantiated. If you''ve not been following
    along, just create a new instance of a data class, make sure the properties of
    the class instance are set, and then you can destructure it as shown in the preceding
    code.


    This looks odd, but if you stare at it a bit, it will take some to make sense.
    Three variables are created: email, firstName, and lastName. Then, they are all
    assigned values at once through a destructuring declaration. This declaration
    takes the property values from robert and assigns each to the three variables.


    Here''s the output:


    ```

    Email is rpowell@rockwallblackberry.com

    First name is Bob

    LastName is Powell

    ```


    This is a case where Kotlin again is helping you grab data in a way that''s convenient
    and quick.


    # Destructuring Declarations Aren''t Particularly Clever


    Now before you get too excited, try this bit of code, which looks a lot like the
    previous code, but is in fact quite different:


    ```

    val(firstName, lastName, email) = robert

    println("Email is ${email}")

    println("First name is ${firstName}")

    println("Last name is ${lastName}")

    ```


    The output here is what you''d hope for:


    ```

    Email is rpowell@rockwallblackberry.com

    First name is Bob

    ```


    So what''s going on? Kotlin has no idea what a variable named email means; it''s
    a sequence of letters. When you have a destructuring declaration, Kotlin is not
    matching object property names to variable names. You could just easily have code
    like this:


    ```

    val (a, b) = robert

    ```


    This code works, and a will have email, b will have firstName, and c will have
    lastName. Kotlin is simply taking the first property in User and assigning it
    to the first variable in the destructuring declaration, taking the second property
    and so on, and it''s a bit of a dumb operation, albeit a useful dumb operation.'
