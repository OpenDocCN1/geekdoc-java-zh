  md: "# If and Else: The Great Decision Point | 153\n\nThis is something that looks\
    \ quite familiar. There's a conditional expression that evaluates to either\n\
    true or false. No big deal. And then there is a bit of code for that expression\
    \ is true and another\nfor it's false. No big deal.\n\nThe oddity, that the code\
    \ in each block isn't a statement that runs, but a simple value:\neither \"right!\
    \ or \"wrong!. Remember, the entire if statement is an expression that is evaluated;\n\
    the whole will run in either the string \"right! or the string \"wrong!. Then,\
    \ that string will be\nhanded off to the append() method:\n\n```\nresponse.append(guess.toInt()\
    \ == theNumber ? \"right! : \"wrong!\")\"\n```\n\nThat makes perfect sense, because\
    \ the append() method of StringBuilder takes a String as input.\nValue is appended\
    \ to response's existing content, and then output.\n\n# Kotlin Has No Ternary\
    \ Operator\n\nIf you've used any other programming languages like Java, you've\
    \ seen the equivalent of this sort of\nbehavior and control via a ternary operator.\
    \ This is an operator that does just what the if/else\nstatement you've just seen,\
    \ but has slightly different syntax.\n\nFor example, here's how that operator\
    \ looks in Java:\n\n```\nresponse.append(guess.toInt() == theNumber ? \"right!\"\
    \ : \"wrong!\")\"\n```\n\nThe form actually looks similar to how you've already\
    \ seen:\n\n```\n[EXPRESSION] ? [CODE TO EVALUATE IF] : [CODE TO EVALUATE IF FALSE]\n\
    ```\n\nOf course, you could easily make this look like an if statement:\n\n```\n\
    if [EXPRESSION] then [CODE TO EVALUATE IF TRUE] else [CODE TO EVALUATE IF FALSE]\n\
    ```\n\nThat-mapping and how clear it is-to Kotlin not implementing a specific\
    \ ternary operator.\n\n# A Block Evaluates to the Last Statement in That Block\n\
    \nConsider these slightly longer blocks of code in both patterns of if statement:\n\
    \n```\nif (guess.toInt() == theNumber) {\n    response.append(\"right!\")\n  \
    \  true\n} else {\n    response.append(\"false!\")\n    false\n}\n```\n\nIn each\
    \ block, the expression evaluates to the last statement. The top block would evaluate\
    \ to true\nand the bottom block to false.\n\nThat means you start to get a little\
    \ clever about using the result of an if statement. Take a look\nat this code:\n\
    \n```\nprint(\"The number you guessed is \")\nvar hasRightNumber = if (guess.toInt()\
    \ == theNumber) {\nprintln(\"right!\")\n```"
