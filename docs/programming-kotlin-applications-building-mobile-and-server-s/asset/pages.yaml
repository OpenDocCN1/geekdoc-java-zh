  md: "# CHAPTER 4 INHERITANCE MATTERS\n\n![](img/0c8d5d6c6d95ced628a954a187036113_123_0.png)\n\
    \n```\nconstructor(_firstName: String, _lastName: String,\n    _parent: Person)\
    \ :\n    this(_firstName, _lastName) {\n    partner = _parent\n}\n\nfun fullName():\
    \ String {\n    return \"$firstName $lastName\"\n}\n\nfun hasPartner(): Boolean\
    \ {\n    return (partner == null)\n}\n\noverride fun toString(): String {...}\n\
    override fun hashCode(): Int {...}\noverride fun equals(other: Any?): Boolean\
    \ {...}\n```\n\nFIGURE 4.2: You can collapse code blocks to the { ... } in your\
    \ IDE\n\n![](img/0c8d5d6c6d95ced628a954a187036113_123_1.png)\n\n```\noverride\
    \ fun toString(): String {...}\noverride fun hashCode(): Int {...}\noverride fun\
    \ equals(other: Any?): Boolean {...}\n```\n\nFIGURE 4.3: Toggle between expanded\
    \ and collapsed with the + - icons\n\n# A Class Must Be Open for Subclassing\n\
    \nYou should also notice that Any uses the keyword open at the top level:\n\n\
    ```\npublic open class Any { ... }\n```\n\nThis is what allows subclassing to\
    \ happen. Any is open for subclassing, and then the methods that use the open\
    \ keyword are open for overriding. Anything that does not declare itself as cannot\
    \ be subclassed or overridden.\n\nTo see this in action, go ahead and create a\
    \ new class. Call it Parent. This will be a specific subclass of Person that has\
    \ one or more children. Listing 4.15 shows the very simple beginnings of this\
    \ new class, also in the org.wiley.person package.\n\nLISTING 4.15: Parent, an\
    \ eventual subclass of Person\n\n```\npackage org.wiley.kotlin.person\n\nclass\
    \ Parent {\n}\n```"
