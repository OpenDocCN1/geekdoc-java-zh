  md: "# LISTING 10.13: Adding parameters and a return value to an anonymous function\n\
    \n```\nfun main() {\n\n  // Anonymous function\n  fun(input: String) : String\
    \ {\n    return \"The value is ${input}\"\n  }\n}\n```\n\nHowever, this is still\
    \ pretty useless. In fact, most IDEs will even point this out, as Figure 10.4\
    \ shows: the anonymous function is unused.\n\n![](img/0c8d5d6c6d95ced628a954a187036113_287_0.png)\n\
    \n# You Can Assign a Function to a Variable\n\nWhile functions are anonymous and\
    \ some are declared, all functions in Kotlin are considered first class. This\
    \ means they can actually be stored in variables. So update your test class to\
    \ look like:\n\n```\nvar funVar = fun(input: String) : String {\n  return \"The\
    \ value is ${input}\"\n}\n```\n\nNow you have a variable, funVar, as that its\
    \ \"value\" has a function. It's important to note that this variable is not the\
    \ result of the function, but a reference to the function itself.\n\nTry printing\
    \ out the variable:\n\n```\nvar funVar = fun(input: String) : String {\n  return\
    \ \"The value is ${input}\"\n}\n```"
