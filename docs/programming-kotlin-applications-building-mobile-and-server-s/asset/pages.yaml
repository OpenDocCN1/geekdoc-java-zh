- pgno: 252
  md: '# Sealed Classes Are Type-Safe Class Hierarchies


    > NOTE If you spend much time reading up on Kotlin online or in books, you''re
    going to find that almost every time sealed classes come up, the examples used
    are centered on operations. It''s a perfect example for sealed classes, and it
    turns out that there aren''t a lot of different good sealed class examples.

    nYou can build sealed classes in other ways; it just turns out that in of those
    cases, a sealed class isn''t really needed. So rather make up an example that
    really doesn''t lend itself to a sealed class, we''re taking the same approach:
    using a perfect example of when a sealed class is a good idea, even if it is the
    same example you find in other resources.


    Naturally, you''d start with a base class, perhaps called Operation. This is the
    analog to Auto in the prior examples; everything you inherit from Operation. Operation
    isn''t an enum, either. You don''t want constants for Divide or the others; you
    want actual subclasses with behavior.

    So you''d likely have something like Listing 9.20 for Operation.


    +   LISTING 9.20: A simple Operation class built to be subclassed


    ```

    package org.wiley.kotlin.math


    open class Operation {


    }

    ```


    Listing 9.21 shows an empty inheriting class, Add.


    +   LISTING 9.21: An empty Add class that subclasses Operation


    ```

    package org.wiley.kotlin.math


    class Add : Operation() {

    \}

    ```


    # Sealed Classes Don''t Have Shared Behavior


    There''s not much interesting here at first glance. The key is considering the
    shared behavior of the different operations. What is shared between Add, Subtract,
    Multiply, Divide, and the other operations?

    Asked another way, what functions would be defined in Operation that would apply
    across all operations? Are there any? Even one?'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'The answer is, "Not really." Each operation is indeed an operation, but they
    all operate in fundamentally different ways. This is one of two indications that
    you might have a good use case for a sealed class.


    **Criterion 1:** A sealed class represents common subclasses that do not share
    behavior.


    # Sealed Classes Have a Fixed Number of Subclasses


    The second criterion is a little more nuanced. Put simply, it''s:


    **Criterion 2:** A sealed class represents a class hierarchy where the options
    are fixed, and an object can be only one of those.


    This is nuanced because at first glance, this class hierarchy meets this criterion.
    Consider, for example, the Auto hierarchy. There are only a certain number of
    subclasses (*Maserati*, *Mercedes*, and so forth), and an Auto instance can only
    be one of those. But the nuance is in: that list of subclasses is fixed only because
    those are the subclasses defined earlier, and not because the list of subclasses
    is actually exhaustive. As pointed out earlier, there may be additional subclasses
    added.


    This is quite different from *Operation*: the possible subclasses are really fixed,
    and known. They aren''t going to grow over time (unless someone comes up with
    a new way to combine two numbers algebraically!) or shift.


    In this case, you''d declare the sealed class with the `sealed` keyword where
    you''d normally use `open` or data. Listing 9.22 defines a new sealed class, `Operation`.


    LISTING 9.22: Operation as a sealed class


    ```

    package org.wiley.kotlin.math


    sealed class Operation {

    }

    ```


    > **WARNING** If you''re following along, you''ll need to replace the code shown
    in Listing 9.20 with Listing 9.22. Kotlin (and almost any language) won''t allow
    you to define two different `Operation` classes in the same package.


    If you created the `Add` class shown earlier in Listing 9.21, you''ll need to
    remove that file altogether, as Kotlin will otherwise report this error:


    `Kotlin: Cannot access ''<init>'': it is private in ''Operation''`


    This is because sealed classes aren''t subclassed in the way you''re used to subclassing.
    Instead, they appear within the sealed class file. Listing 9.23 shows a compilable
    version of `Operation`.'
  merge: -1
  img_proc: true
- pgno: 254
  md: "# Sealed Classes Are Type-Safe Class Hierarchies | 225\n\n# Listing 9.23 Operation\
    \ as a sealed class with subclasses\n\n```\npackage org.wiley.kotlin.math\n\n\
    sealed class Operation {\n    class Add(val value: Int) : Operation()\n    class\
    \ Subtract(val value: Int) : Operation()\n    class Multiply(val value: Int) :\
    \ Operation()\n    class Divide(val value: Int) : Operation()\n    class Raise(val\
    \ value: Int) : Operation()\n}\n\nYou can now compile this (after removing Add)\
    \ without error.\n```\n\n> NOTE If you're wondering what happened to taking the\
    \ root of something, it's represented by Raise. Raise in this model actually handles\
    \ exponentiation (5 raised to the 2nd power is 25) as well as roots (9 to ½ is\
    \ the same as the square root of 9, which is 3). This approach keeps the code\
    \ a little simpler, and since we're not actually building a complete calculator\
    \ here, it also keeps the focus on the concepts.\n\n# Subclasses of a Sealed Class\
    \ Don't Always Define Behavior\n\n9.23 should strike you a bit odd. While there\
    \ are subclasses, these subclasses don't define any behavior. They do define a\
    \ primary constructor—each subclass takes in an Int value—but no behavior.\n\n\
    That's OK; you typically don't use these classes in the way you'd use a class\
    \ modeling an object. This is also where the all-important when control structure\
    \ reappears, with new wrinkles.\n\n# when Requires All Sealed Subclasses to Be\
    \ Handled\n\nYou've seen more than a few times, often like this:\n\n```\nwhen\
    \ {\n    (anotherNumber %2 == 0) -> println(\"The number is divisible by 2!\"\
    )\n    (anotherNumber %3 == 0) -> println(\"The number is divisible by 3!\")\n\
    \    (anotherNumber %5 == 0) -> println(\"The number is divisible by 5!\")\n \
    \   (anotherNumber %7 == 0) -> println(\"The number is divisible by 7!\")\n  \
    \  (anotherNumber %11 == 0) -> println(\"The number is divisible by 11!\")\n \
