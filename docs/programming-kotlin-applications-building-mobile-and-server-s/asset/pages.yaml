  md: '# ABOUT THE TECHNICAL EDITOR


    JASON LEE is a software developer happily living in the middle of the heartland.
    He has over 23 years of experience in a variety of languages, writing software
    running on mobile devices all the way up to big iron. For the past 15+ years,
    he has worked in the Java/Jakarta EE space, working on application servers, frameworks,
    and user-facing applications. These days, he spends his time working as a backend
    engineer, primarily using Kotlin, building systems with frameworks like Quarkus
    and Spring Boot. He is the author of Java 9 Programming Blueprints, a former Java
    User Group president, an occasional conference speaker, and a blogger. In his
    spare time, he enjoys spending time with his wife and two sons, reading, playing
    the bass guitar, and running. He can be found on Twitter at twitter.com/jasondlee,
    and on his blog at jasondlee.ee.'
