- pgno: 346
  md: "# Interfaces Define Behavior but Have No Body\n\n```\n// other code\n}\n```\n\
    \nIn both cases, the actual handling of maxSpeed is deferred to concrete classes.\
    \ Because of that, max-Speed can be used in functions, like toString() in Car:\n\
    \n```\noverride fun toString() : String {\n    return \"${this::class.simpleName}\
    \ ${modelName} in ${color} with a max speed of\n${maxSpeed}\"\n}\n```\n\nThis\
    \ is legal Kotlin's compiler understands that by the time this function is called,\
    \ code in a concrete class will have ensured that maxSpeed is populated.\n\n#\
    \ A Class's State Is the Values of Its Properties\n\nA class BMW has stored state\
    \ in its property values. Its model, state, color, and so on, are all stored in\
    \ model and color and maxSpeed properties:\n\n```\nclass BMW(model: String, color:\
    \ String) : Car(model, color) {\n    override var maxSpeed : Int = 182\n```\n\n\
    A specific instance of BMW will have different state than another specific instance.\
    \ One might be a blue 435 and another a white M3.\n\nAn interface, cannot store\
    \ state. That must be handled by concrete instances. But an inter-face can do\
    \ something a bit odd: it can define getters for properties that are not deferred\
    \ until later.\n\n# An Interface Can Have Fixed Values\n\nIn an interface, you\
    \ can define a property that is immediately provided with a custom getter implementation.\
    \ You can see this in Listing 12.19.\n\n> LISTING 12.19: Adding a property with\
    \ a getter to Vehicle\n\n```\npackage org.wiley.kotlin.vehicle\n\ninterface Vehicle\
    \ {\n    val maxSpeed: Int\n\nval purpose: String\n    get() = \"This interface\
    \ models vehicles of all kinds\"\n\nfun start()\nfun stop()\nfun drive(direction:\
    \ String, speed: Int) : Int\n}\n```"
