- pgno: 263
  md: "Listing 10.1 is simple because it makes it easy to see the components of a\
    \ function. Figure 10.1 breaks\ndese down a bit further.\n\n| fun key word | function\
    \ name | argument list inside |\n| --- | --- | --- |\n| | fun main() { | beginning\
    \ of function |\n| | printin(\"Here we go...\") | O or more lines of code to execute\
    \ |\n| } end of function |\n\n**FIGURE 10.1:** A function always has the same\
    \ parts.\n\nEvery function has this set of components, although as you'll see\
    \ throughout this chapter, they\nge get pretty complex.\n\nStill, if you understand\
    \ the basic parts, when things do get complex, you'll have a much easier\ntime\
    \ figuring out what's going on, and mapping more complex representations of the\
    \ basic parts back\nto the functionality that those parts play.\n\nHere are the\
    \ parts of a typical function:\n\n+   * **The fun keyword.** This identifies the\
    \ function itself, in Kotlin and of course to developers\n  writing code.\n\n\
    +   * **The function name.** This name is typically used in calling the function.\
    \ As you'll soon see,\nth, many functions have no names.\n\n+   * **The argument\
    \ list.** Functions can take information via passed arguments, or parameters.\n\
    You'll know you're looking at an argument list because the arguments are surrounded\
    \ by\nparentheses. If there are no arguments, you'll still have an empty set of\
    \ parentheses: ().\n\n+   * **The return type of the function.** This is the only\
    \ thing not shown in Figure 10.1. Functions\ncan return values, and that's indicated\
    \ by a colon (:) after the argument list and then the\nreturn type, like: `fun\
    \ copy(obj: Any): Any`.\n\n+   * **The beginning of the function.** Functions\
    \ typically open with an opening brace: {.nThis is the beginning of what the function\
    \ actually does, also called the function's code\nblock, which establishes the\
    \ function's behavior.\n\n+   * **The body of the function.** The body of the\
    \ function exists between the beginning ({)\n the end (}) of the function. There\
    \ can be all sorts of code, or there can be nothing in the\nbody.\n\n+   * **The\
    \ end of the function.** This is the matching ending to the earlier beginning.\
    \ Just as\nfunctions open with a curly brace, most close with one as well."
