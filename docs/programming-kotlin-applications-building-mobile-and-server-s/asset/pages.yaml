  md: 'This is a remarkably elegant solution for a tricky problem. Gone is the when
    statement in the flee()

    method, working about String vehicle names, and instead, you''ve got a clean implementation
    of

    Vehicle without clouding the core Spy functionality.


    # Delegation occurs at


    Be careful, though, as there are still some tricky things to watch out for here.
    First, the delegation to the attached object when it is passed into the instance
    of Spy. Look at this code:


    ```

    var spy = Spy("Black Spy", bike)

    spy.go("North", 145)

    spy.vehicle = plane

    spy.go("West", 280)

    spy.vehicle = car

    spy.go("Northwest", 128)

    ```


    You might think that each invocation of go() would use the current vehicle property,
    but that''s not

    what happens; here''s the output:


    +   Riding off on a Harley at 145 speed!

    Riding off on a Harley at 280 speed!

    Riding off on a Harley at 128 speed!


    You''d have to manually-create the instance of Spy for this to work:


    ```

    var spy = Spy("Black Spy", bike)

    spy.go("North", 145)

    ```


    ```

    spy = Spy(spy.name, plane)

    // spy.vehicle = plane

    spy.go("West", 280)

    ```


    ```

    spy = Spy(spy.name, car)

    // spy.vehicle = car

    spy.go("Northwest", 128)

    ```


    This is messy, and you end up with a lot of code that is not particularly self-documenting.
    If this is

    t behavior you want, you could consider converting Plane, Motorcycle, and Car
    into interfaces

    themelves, extending Vehicle.


    > NOTE There''s no sample code for this conversion, as it is a great exercise
