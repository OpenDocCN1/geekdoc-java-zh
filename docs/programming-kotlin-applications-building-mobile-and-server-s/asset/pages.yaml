    \ = 0):\nnum1 + num2 + num3 + num4\n```\n\nIn particular, note that when execute(),\
    \ there's only a single expression: the when. That means you can change this function\
    \ to use : notation inside of curly, like so:\n\n```\nfun execute(input: Int,\
    \ operation: Operation): Int =\nwhen (operation)\n    is Operation.Add -> input\
    \ + operation.value\nis Operation.Subtract -> input - operation.value\nis Operation.Multiply\
    \ -> input * operation.value\nis Operation.Divide -> input / operation.value\n\
    is Operation.Raise -> (input.toFloat()).pow(operation.value)\ntoFloat().toInt()\n\
    else -> {\n    throw Exception(\"Unhandled Operation: ${operation}\")\n}\n```\n\
    \n> NOTE If this change was confusing, just consider that the entire function\
