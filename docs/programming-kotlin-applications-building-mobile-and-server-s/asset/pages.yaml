- pgno: 166
  md: '# Some Languages Take Extra Work To Covariant


    In many languages, covariance is not automatic. So in Java, suppose you had this
    same assignment:


    ```

    List<Parent> momList = new ArrayList(cheryl, shirley);

    List<Person> familyReunion = momList; // ERROR!

    ```


    You''d get an error here. That because Java''s covariance are invariant. You cannot
    add a type that has a parameter subtype to a type that has a parameter with subtype''s
    superclass (or, in fact, anywhere up the inheritance chain).


    # Kotlin Actually Takes Extra Work To Be Covariant,


    It''s time for a little surprise: Kotlin is not covariant by default. It''s just
    that Kotlin has already defined its collections as covariant. Here''s the actual
    declaration for a List in Kotlin:


    ```

    interface List<out E> {

    ```


    Notice the all-important keyword out. That is one word that can make it covariant.
    It says something like, "methods of class can only return type E." Kotlin can
    then take E and see if it''s a subclass of another type (the type of a list you
    want to assign these contents to).


    Consider this assignment:


    ```

    List<Person> familyReunion = momList;

    ```


    Kotlin knows that momList will return type Parent, because the out keyword guarantees.
    Kotlin also knows that a Person will work as an input to familyReunion, because
    it''s a List<Person>, and if the list takes a Person, it can take a Parent, too.
    So the covariance allows this code compiles.


    Any class, that uses out is going to be covariant.


    # Sometimes You Have to Make Explicit Is Obvious


    It''s worth taking a quick mental break to acknowledge something that may have
    occurred to you: out is telling Kotlin that you expect Kotlin to know on its own.
    Shouldn''t it be obvious that a list of List objects should be addable to a list
    of Person objects, that Parent inherits from Person? It does not seem like it.


    But this is a case where humans are still required to be smarter—and more deliberate—than
    the computer. You have to tell Kotlin exactly what you want to be so it understands
    that, these collections should be covariant. And get ready, because some more
    unintuitive nuances show up!


    # Covariant Types Limit the Input Type as Well as the Output Type


    You know now that a collection''s covariant—like List—is covariant because it
    tells Kotlin, "I will only return a specific type, E" and for a List<Parent>,
    it''s further saying, "That type is Parent." That''s great; you can assign a List<Parent>
    to a List<Person> because of that declaration.'
