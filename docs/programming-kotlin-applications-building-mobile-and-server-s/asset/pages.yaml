  md: "212 | CHAPTER 9 ENUMS AND SEALED, MORE SPECIALTY CLASSES\n\n# ### LISTING 9.8\
    \ (continued)\n\n```\nval users = mutableListOf<User>()\n\nusers.add(User(\"bardia@gmail.com\"\
    , \"Bardia\", \"Dejban\", User.ADMIN))\nusers.add(User(\"shawn@gmail.com\", \"\
    Shawn\", \"Khorrami\", User.ADMIN))\n\nusers.add(User.createAdmin(\"bahar@gmail.com\"\
    , \"Bahar\", \"Dejban\"))\nusers.add(User.createManager(\"bastion@email.com\"\
    , \"Bastion\", \"Fennell\"))\n\nfor (user in users) {\n  if (user.isAdmin) {\n\
    \    println(\"${user.firstName} ${${user.lastName} is frothing with power!\"\
    )\n  } else {\n    println(\"${user.firstName} ${${user.lastName} is still working\
    \ at it...\\n    maybe one day!\")\n  }\n}\n```\n\nThis makes the code a little\
    \ simpler and is more self-documenting.\n\n> Note Self-documenting is a trait\
    \ that generally means code is written in a way that it's obvious what it does\
    \ from just reading it—even if you're not familiar with the code. In this case,\
    \ the function name createAdmin clearly creates admin, and the same is true for\
    \ createManager. Both of these names are self-documenting. You can also create\
    \ variables that are named critically, like a and u2, or are also self-documenting,\
    \ like index and user2. It's always better to write self-documenting code when\
    \ possible.\n\nNote that Listing 9.9 is a slightly different version of Listing\
    \ 9.8 that uses the same functions, but this introduces the companion object name.\n\
    \n# ### LISTING 9.9: Using helper functions and adding the companion object name\n\
    \n```\nimport org.wiley.kotlin.user.User\n\nfun main() {\n  val users = mutableListOf<User>()\n\
    \n  users.add(User(\"bardia@gmail.com\", \"Bardia\", \"Dejban\", User.ADMIN))\n\
    \  users.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\", User.ADMIN))\n\
    \n  users.add(User.Factory.createAdmin(\"bahar@gmail.com\", \"Bahar\", \"Dejban\"\
    ))\n  users.add(User.Factory.createManager(\"bastion@email.com\", \"Bastion\"\
    , \"Fennell\"))\n```"
