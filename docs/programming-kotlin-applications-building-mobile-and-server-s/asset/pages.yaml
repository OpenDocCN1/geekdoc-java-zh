  md: "# LISTING 10.9 (continued)\n\n```\nvar partner: Person? = null\n\nconstructor(_firstName:\
    \ String, _lastName: String,\n    partner: Person) :\n    this(_firstName, _lastName)\
    \ {\n    partner = _partner\n}\n\nfun fullName(): String {\n    return \"$firstName\
    \ $lastName\"\n}\n\nfun hasPartner(): Boolean {\n    return (partner != null)\n\
    }\n\noverride fun toString(): String {\n    return fullName()\n}\n\noverride fun\
    \ hashCode(): Int {\n    return (firstName.hashCode() * 28) + (lastName.hashCode()\
    \ * 31)\n}\n\noverride fun equals(other: Any?): Boolean {\n    if (other is Person)\
    \ {\n        return (firstName == other.firstName &&\n            _lastName ==\
    \ other.lastName)\n    } else {\n        return false\n    }\n}\n```\n\nSo perhaps\
    \ you've downloaded this code in a library—perhaps a library without source code.\
    \ So all you have the compiled version of this. (Listing 10.9 is shown above so\
    \ you can actually get a compiled version).\n\nNow suppose you want to add a `marry()`\
    \ function that takes another Person, sets the two Person instances' `partner`\
    \ property to each other, and ensure that `hasPartner()` returns true. That would\
    \ be a piece of cake... if you could update the source code for `Person`. Or if\
    \ you could subclass `Person`. But in this example, you have neither option: you\
    \ have a `Person` class that you can't modify and you can't extend.\n\nTo extend\
    \ a class in this case, you can add an extension function and with dot notation,\
    \ which get limited access to that class—if the extension function is within the\
    \ class's scope. That's why a class of function in terms of scope. It's not a\
    \ local function, it's not a member function, but it still has a specific scoping.\n\
    \nListing 10.10 is a new test class `ExtensionFunctionApp`. In addition to creating\
    \ few `Person` instances, it adds a helper function `printPartnerStatus()` that\
    \ makes it easy to do some quick printing and indicates whether a `Person` instance\
    \ has a partner or not."
