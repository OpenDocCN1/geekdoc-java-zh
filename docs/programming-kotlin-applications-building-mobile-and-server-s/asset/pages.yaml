- pgno: 313
  md: "You see null, from the first println(someString), and then there is no additional\
    \ output. This verifies that the second println() which uses formatString() doesn't\
    \ execute. Anytime you have a variable that may be null, you can use a scope function\
    \ to specify activity on variable without risking compiler errors.\n\n# Scope\
    \ Functions Work on Other Functions . . . Very Particular Ways\n\nSo now you know\
    \ that taking a null variable and applying a lambda to a scope function works,\
    \ and you can avoid execution if a null is invoked:\n\n```\nsomeString?.let {\
    \ println(formatString(someString)) }\n```\n\nBut remember, what much of scope\
    \ functions give you is convenience and clarity of code. They remove variables\
    \ from dont clutter your code, as well as memory.\n\nIn the previous example,\
    \ there are still some wasted variables. Here's the full section:\n\n```\nvar\
    \ someString: String? = getRandomString(-2)\nsomeString?.let { println(formatString(someString))\
    \ }\n```\n\nAlthough using the let is nice, someString serves no purpose other\
    \ than to hold the result from calling getRandomString(). That's exactly the sort\
    \ of thing scope functions are intended to clean up.\n\nYou can take things further!\
    \ by applying a let (or any scope function) to function, and if that original\
    \ function returns null, the scope function won't run. Take a look at Listing\
    \ 11.7, which demonstrates this idea with the code you've already written.\n\n\
    # LISTING 11.7: Applying a scope function to a function that might return null\n\
    \n```\nfun main() {\n  // var someString: String? = getRandomString(10)\n  var\
    \ someString: String? = getRandomString(-2)\n  println(someString)\n\n  someString?.let\
    \ { println(formatString(someString)) }\n}\n\ngetRandomString(12).let {\n  println(formatString(it))\n\
    }\n\n\nfun getRandomString(len: Int) : String? =\n  when {\n    len < 0 -> null\n\
    \    len == 0 -> \"*\"\n    len > 0 -> (1..len).map {\n      \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\"\
    .random() }.joinToString(\"*\")\n    else -> null\n  }\n\nfun formatString(str:\
    \ String) : String =\n  \"\\n>>> $\\${str} <<<\\n*\"\n```"
