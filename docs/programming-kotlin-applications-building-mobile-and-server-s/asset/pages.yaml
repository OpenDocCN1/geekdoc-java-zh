- pgno: 192
  md: "You can then condense a bit using for:\n\n```\nval numbers = listOf(0, 1, 2,\
    \ 3, 4)\nfor (item in numbers) {\n  println(item)\n}\n```\n\nThis is old by now.\
    \ That's actually great; once you realize that Kotlin is really just doing the\
    \ same thing internally, for loops become something you've already got down.\n\
    \n# You Do Less, Kotlin Does More\n\nWhen you write this code:\n\n```\nfor (i\
    \ in 0..4) {\n  println(i)\n}\n```\n\nKotlin actually turns 0..4 into a collection,\
    \ and i into an iterator over collection. You could almost see Kotlin converting\
    \ this into something like this:\n\n```\nfor (i in listOf(0, 1, 2, 3, 4)) {\n\
    \  println(i)\n}\n```\n\nEasy, right? Each time you through the loop, i is equal\
    \ to the next item in the collection.\n\n> WARNING Kotlin doesn't quite do this,\
    \ although it's close. Honestly, for now, getting into the bytecode generated\
    \ isn't that useful. Just focus on the key idea that Kotlin turns your range into\
    \ a collection and then creates an iterator on that collection, and you have what\
    \ you need.\n\n# For Has Requirements for Iteration\n\nNow that you've seen for\
    \ in action, it's worth being a little more specific about the requirements for\
    \ what can iterate over anything that provides an iterator, which means it requires:\n\
    \n+   Something (like a range) that has a member or function iterator(), and:\n\
    \  That iterator has a next() function, and\n  That iterator has a hasNext() function\
    \ that returns a Boolean value.\n\n+   That something doesn't have to be a collection,\
    \ but usually is or be turned into one (like range, for instance, 0..4) by Kotlin.\n\
    \nAs long as all of these requirements are met, you're able to use a for loop."
