  md: '# Producers Can’t Consume and Consumers Can’t Produce


    However, by using type projection, you''ve created a new problem: you''ve turned
    targetArray and sourceArray into producers. They can now produce Any (or subtypes
    of Any). That''s not a problem for sourceArray, but look at this:


    ```

    targetArray[index] = sourceArray[index]

    ```


    This statement is assigning a value from an Any to targetArray—which is a producer.
    As you''ve already seen in detail, producers cannot consume. So assigning anything
    to targetArray is going to generate an error; the set() method becomes unusable
    because you turned it into a consumer via the keyword.


    Now, you have a few options here. One you must return targetArray be invariant,
    so you can assign values to:


    ```

    fun copyArray(sourceArray: Array<out Any>, targetArray: Array<Any>)

    ```


    This is good (even though your code breaks). Now you can assign values from sourceArray—which
    remains covariant—to targetArray. But you''re back to an error you see:


    ```

    Error:(41, 22) Kotlin: Type mismatch: inferred type Array<Int> but Array<Any>
    was expected

    ```


    You can''t in for a hard time assigning anything but an Array<Any>. What do you
    do?


    # Variance Can’t Solve Every Problem


    Well, you could change your input array:


    ```

    val words: Array<String> = arrayOf("*", "cow", "jumped", "over", "the", "moon")nval
    numbers: Array<Any> = arrayOf(1, 2, 3, 4, 5, 6)

    ```


    ```

    copyArray(words, numbers)

    ```


    You''re now passing in an Array<String> to the sourceArray argument, which works
    because you''ve functionally made sourceArray covariant. You''re getting exactly
    what targetArray needs—an Array<Any>—because the code will not compile and work.


    The problem, of course, is that this is probably not what you want. The numbers
    isn''t an Array<Any> in any true sense; it''s an Array<Int>. But you''re going
    to have to use it if you want to pass it to copyArray(). Ultimately, this is likely
    a case where you''re not going to get exactly what you want out of a copy operation
    like this.


    If you dig deeper into Kotlin, you''ll find that this copying shows up a lot of
    collections. You are going to have a hard time copying one-type array into another
    one-type array. It''s easier to, for example, an array that is typical—like Array<Int>—and
    copy additional integers into it. In that case, you don''t have two variance issues.


    And now you''ve discovered why variance is not just about the depths of Kotlin.
    It has an impact on the code you write in unexpected ways—particularly when dealing
    with collections.'
