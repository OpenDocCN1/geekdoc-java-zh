    \ to.\n\nCompile this code and run it. You'll get something different:\n\n```\n\
    New person created: David Le\nNew partner created: Chloe Herng Lee\nDavid's partner\
    \ is Chloe Herng Lee\nDavid Le\n```\n\nThe output reflects the key difference\
    \ between also and other functions: the also block executes prior to the assignment\
    \ of the context object to any variable or passing to any function. It is\n\n\
    Unfortunately, this is a bit counterintuitive, particularly as the scope function\
    \ is called \"also\". It is easy to even think also as Initialize (or use) this\
    \ object instance, and (then) also execute this code but that's not what also\
    \ does. Instead, you should think of also as \"Execute this block of code, and\
    \ assign the context object to the variable (or pass to it the function) complete\
    \ with this block.\"\n\n> WARNING No matter how different you twist or rewrite\
    \ a description of also, it's going to come out bit awkward. The naming isn't\
    \ ideal, frankly. Even the official Kotlin documentation stumbles saying you can\
    \ read also as \"and also the following with the object.\" But the \"and\" in\
    \ that sentence implies an order, and that the \"doing\" (the block of code in\
    \ the lambda) follows the object assignment.\n\nThis is a case where you should\
    \ put less credence in the name of the function as being self-descriptive and\
    \ focus on memorizing what it actually does.\n\nWith this in mind, you can make\
    \ sense of the ordering of the code. Here's the code again first as a reminder:\n\
    \n```\nprintln(Person(\"David\", \"Le\").)\nprintln(\"New person created: \\${it.fullName()}\"\
    )\nit.partner = Person(\"Chloe\", \"Herng\").apply {\n    println(\"New partner\
    \ created: \\${it.fullName()}\")\n}\nprintln(\"${it.firstName}'s partner is \\\
    ${it.partner?.fullName()}\")\n```\n\nThe following is exactly what happens:\n\n\
    +   1. A person is initialized (David Le).\n2. That instance is passed into the\
    \ also block:\n   a. The fullName() function on the Person instance (David) is\
    \ printed.\n   b. A person instance (Chloe Herng Lee) is created.\n   c. An apply\
    \ is called on the new Person instance (Chloe):\n   i. The full name of the Person\
