  md: "The output is nothing remarkable at all—and that in itself is interesting:\n\
    \nWayne Scott with an email of wyne.scott@example.com created on Thu Sep 24\n\
    08:00:32 CDT 2020\n\n# Kotlin Is Compiled to Bytecode for the Java Virtual Machine\n\
    \nThere is no big secret here; rather, Kotlin code is compiled into bytecode that\
    \ can run on the\nJava Virtual Machine (JVM). So it's pretty cool and unique that\
    \ you can seamlessly weave Java\nKotlin into the same program, at the end of the\
    \ day, you've been writing code that runs on the\nJVM for a solid 13 chapters\
    \ now.\n\nThe benefit is you do not need to do anything to get interoperability\
    \ with Java. You just\nimport the needed classes from Java packages and work with\
    \ them from Kotlin.\n\nThere are some additional wrinkles that you may have to\
    \ do to get them, but get into specific you use\ncases. The best thing to do if\
    \ you want to get deep into Java interoperability is to check out Kot-\nl's official\
    \ documentation on the matter at kotlang.org/docs/reference/java-inter-\nhtml\
    \ (for calling Java code from Kotlin) and kotlang.org/docs/reference/java-to-kotlin-\n\
    interop.html (for calling Kotlin code from Java). Both documents will give you\
    \ more.\n\n# Grade Gives You Project Build Capabilities\n\nIf you're looking to\
    \ build a project outside of your IDE, you can use Gradle (gradle.org) to build\
    \ a\nKotlin project that also references Java code. Gradle allows you to specify\
    \ the versions of Kotlin and\noptionally Java that you want to use and lock your\
