  md: '# Now What? | 337


    ![](img/0c8d5d6c6d95ced628a954a187036113_366_0.png)


    **FIGURE 13.2:** The Kotlin Koans aren''t for everyone, but they''re great for
    interactive learning.


    # # NOW WHAT?


    With an entire book on Kotlin now in your rearview mirror, you are more than ready
    to take what you''ve learned and build your own programs, classes, objects, functions,
    lambdas, flows, and applications. You''re also ready to make that shift discussed
    earlier in this chapter from reading code to coding. Yes, keep this book and your
    browser with Kotlin documentation handy, but get into your IDE. You''ll find you
    may never look back.


    Enjoy, and happy programming!'
