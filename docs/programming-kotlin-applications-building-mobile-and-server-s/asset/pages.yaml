- pgno: 258
  md: "Criterion 1 hammers the home point: sealed classes do not share behavior. They\
    \ operate inde- pendently, and the only thing they do is a class hierarchy. Given\
    \ that, it only makes sense while you can use an else in a when that involves\
    \ a sealed class, it rarely makes sense. An else by definition is \"shared behavior\
    \ for anything not explicitly handled,\" which goes against criterion 1 for sealed\
    \ classes.\n\nIt is better to write a when in the situation where you have clear,\
    \ explicit behavior for each subclass of the sealed class.\n\n# else Clauses Hide\
    \ Unimplemented Subclass Behavior\n\nTake things step further. It's actually a\
    \ bad idea to use an else in when with sealed classes. We take a look at Listing\
    \ 9.27, which can turn into sneaky problems.\n\n> LISTING 9.27: Using an else\
    \ to catch any extra subclasses\n\n```\npackage org.wiley.kotlin.math\n\nimport\
    \ kotlin.math.pow\n\nclass Calculator {\n    fun execute(input: Int, operation:\
    \ Operation): Int {\n        val returnVal: Int = when (operation) {\n       \
    \     is Operation.Add -> input + operation.value\n            is Operation.Subtract\
    \ -> input - operation.value\n            is Operation.Multiplication -> input\
    \ * operation.value\n            is Operation.Divide -> input / operation.value\n\
    \            is Operation.Raise -> (input.toFloat()).pow(operation.value)\n  \
    \      }.toInt()\n        else -> {\n            // Catch all\n            0\n\
    \        }\n        return returnVal\n    }\n}\n```\n\nThis is legal code, but\
    \ generally considered a bad idea. This code hides subclasses of Opera- tion that\
    \ might be added down the line. For example, suppose Operation was updated to\
    \ look like Listing 9.28.\n\n> LISTING 9.28: Adding subclasses to Operation\n\n\
    ```\npackage org.wiley.kotlin.math\n\nsealed class Operation (\n    class Add(val\
    \ value: Int) : Operation()\n    class Subtract(val value: Int) : Operation()\n\
    ```\n\ncontinues"
