  md: "# Initialize an Object and Change a Variable\n\nNot too bad for getting started!\
    \ There's just one more detail to work through before closing shop on your first\
    \ foray into Kotlin.\n\n# INITIALIZE AN OBJECT AND CHANGE A VARIABLE\n\nSuppose\
    \ you want to play around a bit with your Person class. Try this out: update your\
    \ code to match Listing 1.6 (some of this may be confusing, but you can probably\
    \ figure out most of what's going on).\n\nLISTING 1.6: Creating a new property\
    \ for a Person\n\n```\nclass Person(val firstName: String, val lastName: String)\
    \ {\n    val fullName: String\n\n    // Set the full name when creating an instance\n\
    \    init {\n        fullName = \"$firstName $lastName\"\n    }\n\n    override\
    \ fun toString(): String {\n        return fullName\n    }\n}\n\nfun main() {\n\
    \    // Create a new person\n    var brian = Person(\"Brian\", \"Truesby\")\n\n\
    \    // Create another person\n    var rose = Person(\"Rose\", \"Bushnell\")\n\
    \n    println(brian)\n}\n```\n\nYou'll see a number of new things here, but none\
    \ are too surprising. First, a new variable is declared inside the Person object:\
    \ fullName. This is something you've already done in your main function. This\
    \ time, though, because you're doing it inside the Person object, it automatically\
    \ becomes part of each Person instance.\n\nAnother small change is the addition\
    \ of a new Person instance in main; this time it's a variable named rose.\n\n\
    Then, there's a keyword: init. That bears further discussion.\n\n# Initialize\
    \ a Class with a Block\n\nIn most programming languages, Java included, a constructor\
    \ takes in values (as it does in your Person class) and perhaps does some logic.\
    \ Kotlin does this a bit differently; it introduces the idea of an initializer\
    \ block. This's block—identified conveniently with the init keyword—code that\
    \ should run every time an object is created."
