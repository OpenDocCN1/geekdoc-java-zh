    \ this looks so odd and potentially confusing, return Unit doesn't mean much to\
    \ anyone unless you have a grasp of Kotlin internals—it's optional, usually left\
    \ out:\n\n> NOTE If you're a Java veteran, you might wonder why Kotlin doesn't\
    \ support returning void, which is what Java does in a comparable situation. This\
    \ comes back to Kotlin's emphasis on strong typing. Kotlin always wants to return\
    \ a type, and void isn't. So Kotlin uses Unit instead. This ensures that every\
    \ function returns a type, all the time, and further reinforces that types are\
    \ always present in Kotlin.\n\n# Functions Can Be Single Expressions\n\nHere's\
    \ another look at the add() function that's the subject of the earlier sections\
    \ of this chapter. This is the version in Calculator:\n\n```\nfun add(num1: Int,\
    \ num2: Int = 0, num3: Int = 0, num4: Int): Int {\n    return num1 + num2 + num3\
    \ + num4\n}\n```\n\nIn this function, there's a single line. Further, that single\
    \ line is just one expression. In other words, if you squint a little bit and\
    \ ignore the arguments for a moment, you could almost see something like:\n\n\
    ```\nfun add() = num1 + num2 + num3 + num4\n```"
