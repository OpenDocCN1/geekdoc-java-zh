    If all that's needed is an assignment to partner, you might try something like\
    \ this:\n\n```\nvar firstName: String = _firstName\nvar lastName: String = _lastName\n\
    var height: Double = _height\nvar age: Int = _age\nvar hasPartner: Boolean = _hasPartner\n\
    var partner: Person = null\n```\n\nThis seems to meet the requirements of Kotlin,\
    \ right? You've assigned the property a value: null. But\nit's still going to\
