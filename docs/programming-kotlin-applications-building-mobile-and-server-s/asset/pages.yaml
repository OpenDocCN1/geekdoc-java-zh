  img_proc: true
- pgno: 197
  md: "This is a little silly because you can do the same thing with for, and do it\
    \ in a way that is both cleaner and easier to read:\n\n```\nfor (x in 1..5) {\n\
    \    println(x)\n}\n```\n\nIn fact, it turns out it's pretty hard to do much of\
    \ interest with while except to copy a for loop—unless you use some other control\
    \ structures as well.\n\nOne of the most realistic examples of while stays pretty\
    \ simple is to pull a value from some piece of code, and then use that as part\
    \ of your condition:\n\n```\nvar condition: Boolean = Random.nextBoolean()\nwhile\
    \ (condition) {\n    println(\"still true!\")\n    condition = Random.nextBoolean()\n\
    }\n```\n\nRandom.nextBoolean() is a simple helper function that returns a random\
    \ true or false value. The while loop grabs that value, and then loops as long\
    \ as condition is true. Note that within the while loop, the next value is polled\
    \ each time. Don't forget this, or condition will never change, and you'll have\
    \ another infinite loop!\n\n> NOTE There is no way to avoid this infinite loop:\
    \ set condition to false before it begins. The loop will never execute.\n\nThis\
    \ code still isn't particularly exciting, but it does give you a look at how most\
    \ while loops work: they pull a value from another piece of code, calculate a\
    \ value, and then plug that into the condition.\n\n# A Wrinkle in while: Multiple\
    \ Operators, One Variable\n\nOne note bears a bit of explanation: the code so\
    \ far—and statements about how while works—is making a pretty safe assumption\
    \ that nothing outside your code is changing the values used in the while's loop.\
    \ However, it's possible that this isn't the case.\n\nConsider a variable condition\
    \ that is either true or false, and value is used as the condition in a while\
    \ loop. If that variable is changed by any other code, it would potentially affect\
    \ your while loop. But could that happen if you don't change condition within\
    \ your own code?\n\nThe simplest case would be pass condition to a function that\
    \ then changes condition within the function.\n\n```\nvar condition: Boolean =\
    \ Random.nextBoolean()\nwhile (condition) {\n    println(\"Still true!\")}\n```"
