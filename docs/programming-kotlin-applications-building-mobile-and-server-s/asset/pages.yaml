- pgno: 332
  md: '# 12


    # Inheritance, One More Time,

    with Feeling


    WHAT''S IN THIS CHAPTER?


    Abstract classes


    +   - Interfaces for defining behavior

    - Implementing interfaces

    - Implementation versus extension

    - Delegation patterns

    - Delegation versus implementation


    # ABSTRACT CLASSES REQUIRE A LATER IMPLEMENTATION


    You''ve already spent a couple of chapters learning about classes and inheritance,
    and you''ve built a lot of open classes and extended those classes. Now it''s
    time to take one more pass through classes, inheritance, and some concepts you''ve
    only briefly seen as well as a few that you''ve not seen yet at all.


    First is the abstract class. You learned in Chapter 8 that data classes cannot
    be abstract, even though you had not learned much about abstract classes at that
    point. You also briefly saw an abstract method in Chapter 9:


    ```

    abstract fun isSuperUser(): Boolean

    ```


    abstract in Kotlin is in many a deferral term. It says, "This defines functionality
    that will have to be implemented later." In the case of a method, it requires
    a class that extends the class to override that method. In the case of a class,
    it means the class cannot be directly instantiated.'
