    \ with one function\n\n```\npackage org.wiley.kotlin.math\n\nclass Calculator\
    \ {\n    fun execute(input: Int, operation: Operation) {\n        when (operation)\
    \ {\n            is Operation.Add -> input + operation.value\n        }\n    }\n\
    }\n```\n\nSo now you would (theoretically) be able to call execute(5, Operation.Add(4))\
