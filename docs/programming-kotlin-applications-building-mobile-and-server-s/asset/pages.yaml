    # DATA CLASSES REQUIRE SEVERAL THINGS FROM YOU


    Clearly, data classes offer a lot of advantages. Additionally, you''ll find that
    a lot of your classes will almost seamlessly transition to data classes. Just
    add the data keyword before class in your class declaration, and you''re ready
    to go:


    ```

    data class User(var email: String, var firstName: String, var lastName: String)

    ```


    But there are some reasons, albeit ones that are typically easy to meet


    # Data Classes Require Parameters and val or var


    In the primary constructor for your data class, you must have at least one parameter.
    That means that this is not valid Kotlin:


    ```

    data class User

    ```


    You need something in that primary constructor, a named parameter like email or
    firstName:


    ```

    data class User(var email: String, var firstName: String, var lastName: String)

    ```


    This should make perfect sense, though. A data class is about data, and if your
    class doesn''t actually represent any data—which is fed to the class through parameters
    in the primary constructor—the whole idea breaks down.


    Additionally, the parameters to the class''s constructor must be either val or
    var. This is also sensible that a data class really is an object designed to easily
    store property values. var tells the data class that the property can be both
    set and get (mutable), and val tells the data class that the property is read-only
    (immutable).


    As a reminder, the situation where this not be the case would be when a primary
    constructor is taking values that are used to create a new value. For example,
    suppose you created a class taking in a set of values and only stored the minimum,
    and maximum, and also calculated the average:


    ```

    class Calculator(values: Set)

    ```


    This class would presumably do some calculations using the values in its constructor.
    Since the actual values aren''t being stored (in this rather silly hypothetical),
    the property isn''t preceded by either val or var.


    This would not work as a data class, though. To make that work, values would have
    to be stored:


    ```

    data class Calculator(val values: Set)

    ```'
