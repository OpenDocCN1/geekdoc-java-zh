  md: 'Likely doesn''t all make sense yet, but here''s the gist of it: this is a method
    on Collection that takes in a list of objects and returns a MutableList. MutableList
    is a subclass of MutableCollection, which in turn inherits from Collection.


    It''s helpful to get your head around all these things relate to each other, so
    Figure 5.1 shows a partial inheritance tree starting with Collection.


    ![](img/0c8d5d6c6d95ced628a954a187036113_132_0.png)


    **FIGURE 5.1:** Collection and several related classes


    This isn''t all the classes related here (there''s Iterable, MutableIterable,
    and Map and MutableMap), but for now, these are the ones we focus on. Notice that
    a list that can change is in an entirely different class than one cannot (MutableList
    versus List). This is a great example of the principle discussed in the previous
    chapter: the base class is more general, and the subclass is more specific. That''s
    what you''re seeing here in practice.


    > > WARNING There''s quite a bit in Figure 5.1 that may strike you as odd. Most
    notably, there are two arrows going to MutableList and MutableSet: one from each
    MutableCollection and one to each List or Set. How does that work? Can a single
    class have two superclasses? That''s a good question, and one you dig into the
    next chapter.


    When you call mutableListOf(), you''re calling a method on Collection. It creates
    a MutableList (and specifically, an ArrayList) and returns that to your code.
    That method is basically a factory for lists (that''s where the name "factory
    pattern" comes from).'
