- pgno: 349
  md: "# CHAPTER 12 INHERITANCE, ONE MORE TIME, WITH FEELING\n\nLISTING 12.22: Extending\
    \ the Manufacturer implementation\n\n```\npackage org.wiley.kotlin.vehicle\n\n\
    interface HondaManufacturer : Manufacturer {\n    override val name: String\n\
    \    get() = \"Honda\"\n}\n```\n\nThere is a lot of interesting detail in these\
    \ two short interfaces. First, you see that an interface can extend another. Second,\
    \ you're seeing the use case where a property defined with a fixed get () function\
    \ makes sense: in the case where you have an interface extend another interface.\n\
    \n> NOTE Here is another important naming and lexical convention. A class that\
    \ inherits from an interface is said to implement the interface. An interface\
    \ that inherits from another interface is said to extend the interface. Because\
    \ inheriting interface actually doesn't implement behavior; it just adds or extends\
    \ definitions, as case with HondaManufacturer extending Manufacturer.\n\nIt's\
    \ almost always safe to say that one class or interface inherits from another\
    \ class or interface. If you're not,\"inherits\" is usually a safe bet.\n\nIn\
    \ the top-level interface, Manufacturer, a property named is declared. But HondaManufacturer\
    \ doesn't want to leave that property to be defined; it wants to set it for all\
    \ implementing classes of HondaManufacturer. So this is where setting the value\
    \ through a fixed () method makes sense. Now classes that implement HondaManufacturer\
    \ don't need to define defining name and they all get \"Honda\" as a name automatically.\n\
    \n# A Class Can Implement Multiple Interfaces\n\nNow you have an interesting story.\
    \ The org.wiley.kotlin.car.Honda class—which, to be clear, is distinct from a\
    \ potential org.wiley.kotlin.motorcycle. Honda class—implements Car. But it could,\
    \ and also, implement HondaManufacturer. That is perfectly legal, as Listing 12.23\
    \ shows.\n\nLISTING 12.23: Honda extends a class and implement interfaces\n\n\
    ```\npackage org.wiley.kotlin.car\n\nimport org.wiley.kotlin.vehicle.HondaManufacturer\n\
    \nclass Honda(model: String, color: String) : Car(model, color), HondaManufacturer\
    \ {\n\n    override var maxSpeed: Int = 128\n\n    override fun start() {\n  \
    \      println(\"Inserting the key, pressing the brake, pressing the ignition,\
    \ starting.\")\n    }\n}\n```"
