- pgno: 32
  md: 'it, and those types are fixed. That also implies that Kotlin is compiled, which
    is also true. Object-oriented means it has classes and inheritance, making it
    a familiar language for Java and C++ developers.


    Kotlin was in fact created by a group of developers that worked on the JetBrains
    IDE, and it feels very much like a natural evolution of Java. It''s been around
    in early form since 2011, but was officially in 2016. That means it''s new, which
    is good, but also means it''s new, at times it can be bad. Kotlin can run inside
    a Java Virtual Machine (JVM), and can even be compiled to JavaScript—a cool feature
    you''ll find out a little later.


    It''s also important to note that Kotlin is a fantastic language for writing Android
    apps. In fact, many of its enhancements to Java reflect an Android usage. That
    said, even if you never intended to write a mobile app, you''ll find Kotlin a
    welcome addition to your arsenal, and well suited for server-side situations.


    # # What Does Kotlin Add to Java?


    That''s a good question that has a long answer. In fact, we will spend most of
    this book answering in various forms. But, for most, Kotlin adds or changes a
    few key features when we contrast Java:


    > NOTE If you''re new to Kotlin or not coming from a Java background, feel free
    to skip right to the next section.


    +   - Kotlin ditches NullPointerException (and nullable variables altogether)
    in almost all situations.

    - Kotlin supports extending functions without having to entirely override a parent
    class.

    - Kotlin doesn''t support checked exceptions (you may not find this to be an advancement,
    so fair warning).

    - Kotlin adds components of functional programming, as extensive lambda support
    and lazy evaluation.

    - Kotlin defines data classes that let you skip writing getters and setters.


    There''s certainly a lot more to this list, but you can quickly see that Kotlin
    isn''t just a slightly different version of Java. It seems to be different and
    better, and in many ways, it very much is exactly that.


    # # KOTLIN IS OBJECT-ORIENTED


    At this point, most books and tutorials would put you together a simple "Hello,
    World! program, and the assumption here here is that you want to get moving, and
    moving quickly. For that reason, the logical place to begin with Kotlin is by
    creating an object.'
