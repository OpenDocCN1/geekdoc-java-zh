- pgno: 320
  md: "The same example could also be written with a with:\n\n```\n// Example of run\
    \ but using with\nwith (Calculator())\n    execute(20435, Operation.Multiply(12042))\n\
    ```\n\nWhat's the best? None of them. It really comes down to how you want your\
    \ code to read. However, the Kotlin documentation actually provides some guidance\
    \ or if you aren't sure. Figure 11.4 shows an excerpt from Kotlin's official page\
    \ on scope functions regarding the use of run.\n\n![](img/0c8d5d6c6d95ced628a954a187036113_320_0.png)\n\
    \nFIGURE 11.4: Kotlin suggests using run to initialize an instance and get a result.\n\
    \nThere is something very clean about run, because it most closely matches what\
    \ the code is doing: running some functions and taking the result.\n\n# Run Doesn't\
    \ Have to Operate on an Object Instance\n\nOne thing that is somewhat about run\
    \ that it doesn't require a context object. The following is an example of that\
    \ sort of use:\n\n```\n// run without a context object\nval hexNumberRegex = run\
    \ {\nval digits = \"0-9\"\nval hexDigits = \"A-Fa-f\"\nval sign = \"+\\-*\"\n\n\
    Regex(\"\\?[sign]?$hexDigits]+\")\n}\n\nfor (match in hexNumberRegex.findAll(\"\
    +1234 -FFFF not-a-number\")) {\n    println(match.value)\n}\n```\n\nThe result\
    \ of run lambda starts with hexNumberRegex, which is used in for statement.\n\n\
    > NOTE This code example is taken from the Kotlin scope functions documentation\
    \ online at https://kotlinlang.org/docs/reference/scope-functions.html. It is\
    \ a bit of an unusual usage of run because it doesn't include a text object. There's\
    \ very little advantage to using run like this, as it saves a negligible amount\
    \ of memory for variables that only exist within the scope function."
