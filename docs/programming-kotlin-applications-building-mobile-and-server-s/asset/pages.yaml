  md: "# Use the Results of an if Statement Directly\n\nYou can use this to your advantage\
    \ by assigning the result of the statement to a variable, or otherwise using it\
    \ directly. Here's a sample if statement that assigns a value based on an EXPRESSION:\n\
    \n```\nvar response = StringBuilder(\"The number you guessed is \")\nif (guess.toInt()\
    \ == theNumber) {\n    response.append(\"right!\")\n} else {\n    response.append(\"\
    wrong!\")\n}\n\nprintln(response.toString())\n```\n\n> NOTE StringBuilder is just\
    \ what it sounds like—a way to build up strings easily.\n\nThis is a variation\
    \ on what you already have done, so nothing very exciting here. But consider what\
    \ you can put want within the if and else block, that nothing is returned from\
    \ the if statement's evaluation. So suppose you had an if statement like this:\n\
    \n```\nval evenOrOdd = \"even\"\nif (evenOrOdd == \"even\") {\n    6\n} else {\n\
    \    9\n}\n```\n\nIn the case, the if statement would evaluate to 6. If evenOrOdd\
    \ were set to anything other than \"even\", the if statement would evaluate to\
    \ 9. So with this in mind, you can rewrite the earlier statement using StringBuilder:\n\
    \n```\nvar response = StringBuilder(\"The number you guessed is \")\n\nresponse.append(if\
    \ (guess.toInt() == theNumber) \"right!\" else \"wrong!\")\n\nprintln(response.toString())\n\
    ```\n\nWhat is exactly going on here? It looks a bit odd, but break this down\
    \ (in particular, the second line). First, take the if statement:\n\n```\nif (guess.toInt()\
    \ == theNumber) \"right!\" else \"wrong!\"\n```\n\nNow, for clarity, break this\
    \ further into blocks:\n\n```\nif (guess.toInt() == theNumber) {\n    \"right!\"\
    \n} else {\n    \"wrong!\"\n}\n```"
