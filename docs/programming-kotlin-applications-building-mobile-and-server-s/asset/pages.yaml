  md: '# 11


    # Speaking Idiomatic Kotlin


    WHAT''S IN THIS CHAPTER?


    +   - Using let, run, with, apply, and also

    - Connecting code to scope

    - Working with context objects

    - Using scope functions for readability and style


    # SCOPE FUNCTIONS PROVIDE CONTEXT TO CODE


    In Chapter 10, you saw that there are certain ways you can call lambdas that provide
    a sort of Kotlin-specific idiom. If a lambda is the last argument to a function—a
    trailing lambda—then you can omit parentheses around it.


    This is an idiom, a term you will see a few times. An idiom in language is a usage
    of words or terms, or in this syntax, that is specific to someone''s back, and
    often can be interpreted literally. In English, you might say "get off my back!"
    and not mean anything related to an actual person on someone''s back. That idiom
    points to a thorough understanding of the language, and often distinguishes native
    or well-trained speakers from those who are not as familiar, or only have a more
    casual understanding, of the language.


    In Kotlin, there are many idioms, and one of those is the trailing lambda. Several
    others are covered in this chapter—in particular, what Kotlin calls scope functions.
    A scope function lets you execute a block of code within a specific context, often
    that of a particular object instance.'
