- pgno: 196
  md: "# USE WHILE TO EXECUTE UNTIL A CONDITION IS FALSE\n\nSo far, you've seen that\
    \ you can loop over a collection easily, and you can also loop over anything that\
    \ can be turned into an iterator. But sometimes you want to loop as long as a\
    \ particular condition is true. Put another way, you want to loop until that condition\
    \ is false.\n\nThis is where while comes into play. Like if and else, while operates\
    \ very similarly to other languages, so you may find this to routine and particularly\
    \ easy to pick up.\n\n# While Is all about a Boolean Condition\n\nIf you have\
    \ some time on your hands, and then run this code:\n\n```\nwhile (true) {\n  \
    \  // this will loop endlessly!\n}\n```\n\nAlthough this is useless, an infinite\
    \ loop, it also illustrates the simplest form of a while loop. You have a condition,\
    \ and as long as that condition is true, the body of the loop will execute:\n\n\
    ```\nwhile (CONDITION) {\n    // this will loop endlessly!\n}\n```\n\nCONDITION\
    \ must evaluate to a Boolean here. Additionally, that CONDITION is the way that\
    \ the loop is exited.\n\n> NOTE You have a few other ways to get out of a loop\
    \ using break, which are covered a bit later in this chapter.\n\nWhat this effectively\
    \ means is that you should potentially changing the components of CONDITION within\
    \ the loop body. Otherwise, CONDITION will continue to evaluate to, and you'll\
    \ have an infinite loop.\n\nAt its simplest, you can create a counter out of a\
    \ while:\n\n```\nvar x: Int = 1\nwhile (x < 6) {\n    println(x)\n}\n```\n\n>\
    \ WARNING If you've been following along, you may need to make a few tweaks to\
    \ your code to get this to run. First, if you've already declared x earlier, remove\
    \ the declaration line and replace it with x = 1. Second, if you compiled in the\
    \ infinite loop from the previous code, make sure you remove that, or you'll never\
    \ get your code to stop, let alone get to anything you've added after the infinite\
    \ loop."
