- pgno: 323
  md: '# 294 | CHAPTER 11 SPEAKING IDOMATIC KOTLIN


    This gets immediately tricky, even though you''ve assigned another Person instance
    to partner in the previous line, as a property can be null. It''s declared in
    Person like this:


    ```

    var partner: Person? = null

    ```


    Kotlin knows this, so you need to use a let function to ensure that the age from
    partner doesn''t fail compilation due to null safety.


    Then, in the let lambda, it is used to reference partner. The partner''s age is
    retrieved, 2 is subtracted from it, and the result of this expression ends up
    in this.age, which is the age of the brian instance.


    But there''s still a problem. This portion of the expression extends the case
    when partner is not null:


    ```

    partner?.let { it.age - 2 }

    ```


    It''s easy to think the work is done, because you know partner has a value assigned.
    But Kotlin has to assume, like any good compiler, that other threads might be
    changing the value of the partner property. It is theoretically possible that
    between your assignment of a Person instance to partner and this line, partner
    could have been set back to null.


    For this reason, you could provide a non-null value to assign to age (the receiver
    of this line of code) in the event that partner is null and the let doesn''t execute.
    You could turn this whole line into a big statement, but that actually gets tricky,
    and it''s not worth getting into because Kotlin gives you a better option: the
    Elvis operator. The operator is ? and then a :, like:


    ```

    ?:

    ```


    This allows you to indicate an expression to evaluate and return if the preceding
    expression is null. Here''s that line, with the Elvis operator, in context:


    ```

    age = partner?.let { it.age - 2 } ?: 0

    ```


    If this partner evaluates to non-null, the let returns and assigns the result
    of its lambda to age. If partner is null, then the Elvis operator kicks in and
    returns 0. You can also have expressions on the right side of the Elvis operator
    as well.


    > Believe it or not, the Elvis is not named for a notable computer scientist or
    mathematician. Instead, it''s named for the so-called king of rock and roll, Elvis
    Presley. Many think that the question mark (?) followed by a colon (:) looks like
    sideways versions of Elvis, with two eyes and a huge quizz of hair. Who said programmers
    aren''t trendy?


    # ALSO GIVES YOU AN INSTANCE ... BUT OPERATES ON THE INSTANCE FIRST


    The scope function is also. Like the other scope functions, also does just what
    it suggests. It takes an action (in this case, an assignment), and also does a
    few other things.'
