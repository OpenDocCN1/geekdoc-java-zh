- pgno: 351
  md: "# LISTING 12.24: Defining a new function on Manufacturer implementations\n\n\
    ```\npackage org.wiley.kotlin.vehicle\n\ninterface Manufacturer {\n    val make:\
    \ String\n\n    fun manufacturerInformation() : String\n}\n```\n\n# LISTING 12.25:\
    \ Adding behavior available to all implementations of the interface\n\n```\npackage\
    \ org.wiley.kotlin.vehicle\n\ninterface HondaManufacturer : Manufacturer {\n \
    \   override val make: String\n        get() = \"Honda\"\n\n    override fun manufacturerInformation()\
    \ : String {\n        return \"Honda was the eighth automobile manufacturer in\
    \ the world in 2015.\" + +\n               \"Learn more at https://www.honda.com\"\
    \n    }\n}\n```\n\n# DELEGATION OFFERS ANOTHER OPTION FOR EXTENDING BEHAVIOR\n\
    \nAt this point, you've got the bulk of \"everyday inheritance\" in Kotlin down.\
    \ Nine times out of ten, you'll use interfaces, and implement them with abstract\
    \ or concrete classes or extend them with other interfaces. Then, ever so often,\
    \ you'll implement multiple interfaces, sometimes decorating a class with new\
    \ behavior, and requiring that class to implement behavior defined in the new\
    \ interface. Regardless, you've got a lot of tools at your disposal.\n\nBut there\
    \ are rare cases that you'll run across once in a while, and this is something\
    \ Kotlin is particularly interested in: the idea of an object that be composed\
    \ of more than one implementation of an interface. This gets a little tricky,\
    \ take your time, but the rewards are worth working through this use case.\n\n\
    # Abstract Classes Move from Generic to Specific\n\nSuppose you have a Spy class.\
    \ This is representing a spy that has its main function escaping from trouble\
    \ (because what else do spies do?). And like all good spies, there are several\
    \ ways to escape: in a car, in a motorcycle, or in a plane.\n\nTo make this possible,\
    \ start out tweaking the Vehicle class. Instead of a drive() function, it needs\
    \ a simpler, more generic name: go(). Listing 12.26 makes this adjustment."
