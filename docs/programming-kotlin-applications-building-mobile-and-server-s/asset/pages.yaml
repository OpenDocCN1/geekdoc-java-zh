    good, you can’t exactly change the source code for Array! It called type projection,
    and it’s a sort of localized-version of the declaration site variance you’ve already
    seen.


    # Type Projection Tells Kotlin to Allow Subclasses as Input for a Base Class


    Look again the method signature for copyArray() and think about what you would
    need to happen:


    ```

    fun copyArray(sourceArray: Array<Any>, targetArray: Array<Any>) { ... }

    ```


    You can use the out keyword, so you’ve seen before:


    ```

    fun copyArray(sourceArray: Array<out Any>, targetArray: Array<out Any>) { ...
    }

    ```


    This is sort of in-place contravariance (That’s not a technical term as a way
    to think about this paradigm). It allows the input to put both sourceArray and
    targetArray to accept not just Array<Any> but any subclass of Array<String> or
    Array<Int> would both be accepted inputs.


    If you recompile the code, you’ll get an error—but that


    ```

    Error(47, 11) Kotlin: Out-projected type Array<Any> prohibits the use of ‘public
    final operator fun set(index: Int, value: T): Unit defined in kotlin.Array''

    ```


    The first thing to note is that the errors related to passing in an Array<String>
    or Array<Int> to are gone. A step in the right direction.


    But there’s a new problem. Note that the compiler indicates you now have an “out-projected
    type.” That’s exactly right; you’ve projected a type, allowing for any subclass
    of the declared type to be accepted. Your function now accepts both arrays you
    supplied as input.'
