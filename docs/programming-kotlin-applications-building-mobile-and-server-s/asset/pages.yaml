    # Custom-Set Properties Can''t Be in a Primary Constructor


    What a mouthful! It''s true, though: because we want to take control of what happens
    when a first or last name is changed, we''re going to make a lot of changes to
    how Person is constructed. Basically, we will override the accessor for firstName
    and lastName. To do that, we cannot have the properties initialized in the primary
    constructor.


    > You may have noticed the term "primary constructor" here. Think of simply as
    "the constructor" for now. Later, you''ll see that Kotlin lets you define multiple
    constructors, and the primary one is the one defined on the first line of the
    class—the one you already have.


    On this later, so don''t worry too much about primary and secondary constructors
    for now.


    # Move Properties Out of Your Primary Constructors


    You''ve actually stumbled onto a fairly standard best practice in Kotlin: it''s
    often a good idea to move properties out of the primary constructor. You''ll recall
    that this seems like way back in Chapter 1:


