- pgno: 316
  md: "With this change, you'll get no output if getRandomString() is null, and correct\
    \ output if there's a String return value to format.\n\n# WITH IS A SCOPE FUNCTION\
    \ FOR PROCESSING AN INSTANCE\n\nBefore digging too much into the specifics of\
    \ another scope function, with, it's important that you recognize that all functions\
    \ are very similar in use. While there are some syntactical differences, you'll\
    \ quickly see that everything you learned about let apply to with.\n\nYou can\
    \ take an object and operate on it using with. Here's a basic example, using an\
    \ instance of Calculator:\n\n```\nwith(Calculator()) {\n    println(execute(8,\
    \ Operation.Add(4))\n    println(execute(12, Operation.Multiply(12)))\n}\n```\n\
    \nYou can quickly see what this does by looking at the code.\n\n+   1. First,\
    \ the scope function is provided: with.\n2. A context object is provided to with.\
    \ That context object, an instance of Calculator created through Calculator(),\
    \ becomes the reference throughout the lambda.\n3. Any operations within the lambda\
    \ are assumed to operate on the context object.\n\nBecause the context object\
    \ is an instance of Calculator, all the methods of that can be run: execute(),\
    \ add(), and sum().\n\n> WARNING This code sample and assumes that you've kept\
    \ Calculator current as you've gone through the various chapters. If not, you'll\
    \ want to download the code samples so you can follow along and have available\
    \ all the functions referenced throughout this and the following sections.\n\n\
    # Uses as Its Object Reference\n\nOne of the big differences between let and how\
    \ the context object is referenced. In let, you used it, as is in lambda expressions:\n\
    \n```\ngetRandomString(-2)?.let {\n    println(formatString(it))\n}\n```\n\nwith\
    \ this instead. Knowing that, you could rewrite the with block to be more explicit:\n\
    \n```\nwith(Calculator()) {\n    println(this.execute(8, Operation.Add(4))\n \
    \   println(this.execute(12, Operation.Multiply(12)))\n}\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "However, this is a clunky, and moves away from the point of this chapter: writing\
    \ idiomatic Kotlin. Since anytime you want to invoke a function attached to the\
    \ current this object, you can omit this, it's much cleaner to write the code\
    \ like this:\n\n```\nwith(Calculator()) {\n    println(execute(8, Operation.Add(4)))\n\
    \    println(execute(12, Operation.Multiply(12)))\n}\n```\n\n> > WARNING This\
    \ is a good time to point out that reading (and writing) text about this reference\
    \ is a tricky proposition, because the word \"this\" is going to appear a lot\
    \ and not be a reference to an object, but instead a simple English word. In this\
    \ book, you can pay particular attention to the font face. When the word this\
    \ is in code font, it's a reference to an object instance. When this is in a normal\
    \ font, it's just a part of regular English.\n\nYour IDE will also give you helpful\
    \ hints; Figure 11.3 shows how IntelliJ views you within your lambda expression.\
    \ This is similar to the indicator of what it references shown in Figure 11.2\
    \ earlier in the chapter.\n\nThe use of this instead of it is one of the most\
    \ significant differences between with and let. It makes a lot of sense, though.\
    \ You are effectively saying in your code, \"With the following object instance,\
    \ do these things.\" It would be redundant to then have to say, \"With that instance,\
    \ do this. With that, do that.\"\n\nInstead, you read Kotlin one time, \"With\
    \ the following object instance...\" and then, within the lambda, say \"Do this\"\
    \ and \"Do that.\" The with sets the context, and everything in the with relates\
    \ back to context.\n\n# # A This Reference Is Always Available\n\nIt's important\
    \ to really get having a this reference as implied in all code within a with block.\
    \ While it may sound like that's repeating the previous section, look at the following\
    \ code:\n\n```\nwith (Person(\"David\", \"let\") {\n    println(\"My name is ${fullName()}\"\
    )\n}\n```\n\nThis is legal code and makes a lot of sense. The with block takes\
    \ in a new instance of Person, and this references that instance. fullName() is\
    \ a method that is being called on the instance through this, and you don't need\
    \ to explicitly type this, the fullName function just appears inside the println()\
    \ seemingly unattended to any instance.\n\n![](img/0c8d5d6c6d95ced628a954a187036113_317_0.png)"
