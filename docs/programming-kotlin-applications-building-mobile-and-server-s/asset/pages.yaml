    \ returnVal was returned. That's a great indicator that you might have single-expression\
    \ function. By removing returnVal and simply making assignment to the function\
    \ itself, you've got yourself a working conversion.\n\nNow, you can go one step\
    \ further, and return the type from the entire function (currently as Int), and\
    \ Kotlin will infer the type:\n\n```\nfun execute(input: Int, operation: Operation)\
    \ =\nwhen (operation)\n    is Operation.Add -> input + operation.value\nis Operation.Subtract\
    \ -> input - operation.value\nis Operation.Multiply -> input * operation.value\n\
    is Operation.Divide -> input / operation.value\nis Operation.Raise -> (input.toFloat()).pow(operation.value)\n\
    toFloat().toInt()\n```"
