  md: "# You Can Override Compiler-Generated Versions of Many Standard Methods\n\n\
    Data classes will automatically give you meaningful and usable versions of equals(),\
    \ hashCode(), and toString(). You saw earlier in Listings 8.2, 8.3, 8.4, and 8.5.\
    \ But that doesn't prevent you from creating your own versions of these functions.\n\
    \nAll you have to do is define your own version of these functions, and Kotlin\
    \ will simply not generate a version of that. Listing 8.9 adds a custom toString()\
    \ to User.\n\n```\nListing 8.9: A data class with an overridden toString()\n```kotlin\n\
    package org.wiley.kotlin.user\ndata class User(var email: String, var firstName:\
    \ String, var lastName: String) {\n    override fun toString(): String {\n   \
    \     return \"$firstName $lastName with an email of $email\"\n    }\n}\n```\n\
    ```\n\nIf you execute this function, so as with println(robert) (assuming of course\
    \ that robert is an instance of User), you'll get something like this:\n\nBob\
    \ Powell with an email of rpowell@rockwallblackbelt.com\n\nKotlin uses your version\
    \ of toString() and doesn't generate one of its own.\nnThe same is true for equals()\
    \ and hashCode(). Override them yourself, and Kotlin will use your versions. However,\
    \ the best practices as mentioned in several earlier chapters: if you override\
    \ equals(), you must override hashCode() with an appropriate corresponding version\
    \ of code.\n\n> NOTE Be careful when overriding these compiler-generated methods.\
    \ You give up a lot of the value of a data class when you write code for the things\
    \ Kotlin is generating for you.\n\nWhile you can override equals(), hashCode(),\
    \ and toString(), you cannot override copy() or componentN() functions. These\
    \ must remain compiler-generated.\n\n# Supertype Class Functions Take Precedence\n\
    \nIn general, if you create a data class that inherits from a superclass, any\
    \ of the superclass methods marked as final result in not generating those methods.\
    \ So if a class that data class inherits from had a final version of toString(),\
    \ that version would be used in the data class as well."
