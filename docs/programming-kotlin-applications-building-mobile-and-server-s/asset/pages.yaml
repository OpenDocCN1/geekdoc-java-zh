    \ up the readability of the class.\n\n> LISTING 2.6: Clarifying property names\
    \ and constructor inputs\n\n```\npackage org.wiley.kotlin.person\n\nclass Person(_firstName:\
    \ String, _lastName: String,\n    _height: Double, _age: Int, _hasPartner: Boolean)\
    \ {\n    var fullName: String\n    var firstName: String = _firstName\n    var\
