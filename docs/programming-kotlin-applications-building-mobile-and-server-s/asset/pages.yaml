  md: 'When you compile, you''ll get this rather oddly worded error:


    ```

    Error:(7, 22) Kotlin: Type inference failed. The value of the type parameter T
    should be mentioned in input types (argument types, receiver type or expected
    type). Try to specify it explicitly.

    ```


    That''s good! That''s the static safety that''s so critical to Kotlin. It''s also
    the power of generics.


    > Note the use of T in the error shouldn''t be confusing. Different single letters
    (E and T are the most common) all are used at various times for parameters. Treat
    the T in the error the same way you would if it were E.


    Understanding that error is actually a great step toward getting a better understanding
    of generics. What''s going on in this case, a String—“type inference failed?”
    It means that Kotlin is taking the input argument—and trying to figure out if
    it can fit the object it require. Since E is an ArrayList<Band>, it rejects that.
    Kotlin attempts to suggest a resolution: "Try to specify it explicitly." But that
    doesn''t work, because String cannot be forced into a Band.


    This also brings a good point: sometimes you have to do a little searching online
    (and re)) to figure out a Kotlin error message. That''s the case; it would be
    nice if it simply, "Please supply a Band argument." But the more formal message
    Kotlin gives is correct: it is trying to infer from the input argument that would
    fit for contains>(), and couldn''t.


    # Generic: What Does It Refer To?


    It can sometimes be tricky to get programming vocabulary correct. While the most
    important thing about a good programmer or developer is to actually write clean
    code, the terminology is helpful. In the case of generics, the generic refers
    to a type. Further, the term is usually used to represent the overall type, not
    a specific instance.


    So you might say or that in Kotlin, lists are generic. That makes sense: the overall
    List type (as well as other collections) is generic and uses E (or sometimes T)
    to keep a parameter open. But, you wouldn''t have a generic list and reference
    a specific value (like bands). The overall type is generic, but once you instantiate
    it, you''ve got something else (even if it is just a list of Any objects, the
    broadest list instance type).


    In addition to generic types, you can have generic functions. These are just what
    you''d think: functions that are defined in such a way that they return are left
    open to later definition. For instance, suppose you had an Animal class that defined
    a breed() method. That method might return a List<T> as its return type. Subclasses
    would take that generic method and refine the type (perhaps to List<Dog>). You
    can start to take this pretty far, keep reading for a lot more on using generics
    in practical ways.'
