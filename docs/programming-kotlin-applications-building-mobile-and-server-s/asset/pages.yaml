- pgno: 235
  md: "# 206 | CHAPTER 9 ENUMS AND SEALED, MORE SPECIALTY CLASSES\n\nThe output isn't\
    \ too surprising:\n\nBardia Dejban is frothing with power!\nShawn Khorrami is\
    \ still working at it... maybe one day!\n\nThe issue this is is capitalization,\
    \ but using \"Administrator\" instead of some of \"Admin.\\nThe result is that\
    \ \"Admin\" (the value used in User's isAdmin() method) doesn't match \"Administrator\"\
    , so the second instance reports back false from isAdmin().\n\nAgain, this could\
    \ be fixed with a tweak to the isAdmin() function:\n\n```\nfun isAdmin(): Boolean\
    \ {\n    return type.equals(\"Admin\", true) ||\n    type.equals(\"Administrator\"\
    , true)\n}\n```\n\nThis sort of starts to get pretty silly fast, though. How far\
    \ are you willing to go to catch every variation on \"Admin\"\n\n# This Problem\
    \ Occurs All the Time\n\nThis problem is a pretty common one in programming. As\
    \ you build out objects, whether they're people (the Person class used in earlier\
    \ chapters), representations of cars or products, or nontangible things like transactions,\
    \ you're going to classify instances of those objects. The property might not\
    \ be called type, as it was in User, but you'll need a way to see if an instance\
    \ is \"this type of thing\" or \"that type of thing\".\n\nPut another, this problem\
    \ is bigger than dealing with string comparison. It's something that is pretty\
    \ fundamental to programming and requires an elegant solution you're going to\
    \ have to implement that solution again and again.\n\n# String Constants Can Help\
    \ . . . Some\n\nA common \"next step\" in dealing with these types is to use constants.\
    \ This is providing a fixed name that has a value, but allowing other code to\
    \ use that fixed name, and not worry about the value.\n\nYou can do this with\
    \ a combination of the const keyword in Kotlin as a prefix to val. Listing 9.4\
    \ adds several constants to the User class.\n\n> LISTING 9.4: Adding a constant\
    \ to the User class\n\n```\npackage org.wiley.kotlin.user\n\nclass User(var email:\
    \ String, var firstName: String, var lastName: String, var type: String) {\n \
    \   const val ADMIN = \"Admin\"\n\n    fun isAdmin(): Boolean {\n        return\
    \ type.equals(ADMIN)\n    }\n\n    override fun toString(): String {\n```"
