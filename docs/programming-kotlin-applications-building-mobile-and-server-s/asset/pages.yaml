    \ representation of the function stored in funVar. It's a function that takes\
    \ an Int (in the earlier version, a String), and returns (denoted by->) a String.\n\
    \n# Executable Code Makes for an \"Executable\" Variable\n\nWhen you make the\
    \ assignment to funVar, you're creating a named reference to that function—in\
