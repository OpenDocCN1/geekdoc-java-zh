  md: '# Sometimes Objects Don’t Exactly Map to the Real World


    At this point, it''s worth saying that the goal in programming, and especially
    object-oriented programming, is to align with the real-world object your pragmatic
    constructs are modeling, that doesn''t always make sense.


    In this case, it may be that setting a child through a constructor and never allowing
    it to change isn''t what you want. That does making a child value difficult; you''d
    have to throw away the Parent and create a new one. That becomes a call rather
    than an issue of right or wrong. You''ll need to decide how your objects are used
    in your code, and also how they might be used by other people in their code.


    Remember, this chapter began with the theme of flexibility, and here''s a case
    where you need to make some decisions around that flexibility. Do you want to
    model the case where a child really can''t be "changed" on a Parent instance,
    which more closely models a real-world situation? Or do you want to use var instead,
    and allow change to make the object more convenient?


    # Generally, Objects Should Map to the Real World


    In this case, you can leave child as a val. It may need to change later, and that''s
    easy, but if you default to modeling real-world behavior, you''ll tend to write
    better code and objects.


    There''s another real-world consideration to take into account now, as well: a
    parent can have more than one child. In fact, parents can have one or more children,
    and that''s going to require some new concepts: collections, lists, and sets.
    That''s what the next chapter is all about, so once you''ve got your head around
    the basics of inheritance, turn the page, and you can get into handling multiple
    children.'
