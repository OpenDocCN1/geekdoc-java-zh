  md: "# Default Values in Functions Inherited\n\nFunctions work differently in inheritance,\
    \ only because a primary constructor must call the superclass constructor, so\
    \ that adds some requirements. Functions that are not constructors are a little\
    \ broader in what they'll allow.\n\nHere's a simple function with some default\
    \ values:\n\n```\nfun add(num1: Int, num2: Int, num3: Int, num4: Int = 0, num4:\
    \ Int = 0): Int {\n    return num1 + num2 + num3 + num4\n}\n```\n\n> WARNING Sometimes\
    \ good code makes for poor example, and sometimes a good example makes for poor\
    \ production code. This is an example of the latter. This is a terrible approach\
    \ for building an add() function, but it does make default arguments and their\
    \ usage very clear. Learn the concept, and don't try breaking out this add() function\
    \ around your Kotlin peers; they likely won't appreciate its purpose!\n\nIf you\
    \ change this function to open, then it can be extended in a subclass. Listing\
    \ 10.3 gives the source code for Calculator, based on work from Chapter 9 and\
    \ this new add() function. Both Calculator and add() are marked as open, and available\
    \ for subclassing.\n\n# LISTING 10.3: An open class with an open add() function\n\
    \n```\npackage org.wiley.math.pow\n\nimport kotlin.math.pow\n\nopen class Calculator\
    \ {\n    fun execute(input: Int, operation: Operation): Int {\n        val returnVal:\
    \ Int = when (operation) {\n            is Operation.Add -> input + operation.value\n\
    \            is Operation.Subtract -> input - operation.value\n            is\
    \ Operation.Multiplication -> input * operation.value\n            is Operation.Divide\
    \ -> input / operation.value\n            is Operation.Raise -> (input.toFloat()).pow(operation.value)\n\
    \        }.toInt()\n        else ->\n            throw Exception(\"Unhandled Operation:\
    \ ${operation}\")\n        }\n        return returnVal\n    }\n\n    open fun\
    \ add(num1: Int, num2: Int, num3: Int, Int: Int = 0, num4: Int = 0): Int {\n \
    \       return num1 + num2 + num3 + num4\n    }\n}\n```"
