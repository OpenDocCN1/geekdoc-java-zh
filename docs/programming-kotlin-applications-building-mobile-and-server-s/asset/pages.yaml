  md: "# Single-Expression Functions Don't Use the return Keyword\n\nAdditionally,\
    \ notice that in this expression format, there is no return. The result of the\
    \ expression is returned. Further, that result must match the specified type,\
    \ which is Int for add().\n\nThird, and most important for the rest of this chapter,\
    \ your expressions can stand for all sorts of things, and that function can actually\
    \ be an expression. While it's useful to think of a function as a declaration\
    \ and a body, and that body is filled with executed statements, you can condense\
    \ that a bit. A function is just an expression (maybe more than one), and at least\
    \ part of the result of executing some or all of that expression.\n\nWhy does\
    \ this matter? Keep reading, as this will quickly become a lot more dynamic. First,\
    \ though, one last word on expression-based functions.\n\n# Single-Expression\
    \ Functions Can Infer a Return Type\n\nIt's entirely possible to streamline a\
    \ function little more when you evaluate an expression. You can drop the return\
    \ type, and Kotlin will figure out the return type from the type of the expression.\
    \ So you can remove the Int type from add():\n\n```\nopen fun add(num1: Int, num2:\
    \ Int = 0, num3: Int = 0, num4: Int) =\nnum1 + num2 + num3 + num4\n```\n\nHere,\
    \ the expression is evaluated, which becomes an Int, and add() is interpreted\
    \ as returning an Int. So if you assigned the result to a Float, you'll have issues,\
    \ as shown here:\n\n```\nvar returnVal: Float\nreturnVal = ab.add(num3 = 3, num1\
    \ = 1, num2 = 8)\n```\n\nThis code generates an error:\n\n```\nKotlin: Type mismatch:\
    \ inferred type is Int but Float was expected\n```\n\nYou can change returnVal\
    \ back to Int and things will compile.\n\nNow, as with this inference, it's not\
    \ without downsides. You've certainly seen many times over now, Kotlin has type\
    \ safety in its very makeup. Whether it's the refusal to accept null values unless\
    \ explicitly declared with a ? in an argument list or the refusal to perform even\
    \ basic casting unless instructed, Kotlin doesn't like to infer types\n\nIn this\
    \ case, this inference can be problematic if you're not careful with your code\
    \ that the type is inferred. From look at Listing 10.7, which is the Calculator\
    \ class from the last chapter revisited.\n\n> LISTING 10.7: Revisiting type inference\
    \ in Calculator\n\n```\npackage org.wiley.kotlin.math\n\nimport kotlin.math.pow\n\
    \nclass Calculator {\n  fun execute(input: Int, operation: Operation): : Int {\n\
    \    val returnVal: Int = when (operation) {\n```"
