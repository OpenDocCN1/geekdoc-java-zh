    # Kotlin Doesn''t Tell You the Generic Type


    One of the most frustrating things about this situation is that you can''t print
    out the type that Kotlin has inferred—or even that you''ve assigned—to a collection
    or any other generic type. You can print the class with variable::class.simpleName
    but that will only give you List or Band. It will not give you List<Person> or
    List<Parent> or Band<Rock>.


    This can be frustrating, as the only time you do out the inferred type is when
    you have an exception:


    ```

    Error:(18, 20) Kotlin: Type mismatch: inferred type is Person but Parent was expected

    ```


    Here, you can see that the inferred type is Person. There''s no other way to get
    that information easily.

    You can grab the type from the object in the list, but that''s not always accurate.
    Consider this little bit of code:


    ```

    val brian = Person("Brian", "Truesby", 68.2, 33)

    val rose = Person("Rose", "Bushnell", brian)

    val mom = Parent(" Cheryl", "Truesby", _child=brian)

    var inferredList = mutableListOf(mom, brian, rose)

    ```


    If you print out the first item in the list, you''re going to get a Parent, but
    then later in the list a Person, meaning that the inferred type would be the specific
    type, Person.


    # Just Tell Kotlin What You Want!


    This is something that''s been said before, and if there is anything to take away
    from this section, it''s to simply declare your types whenever possible. This
    removes a concern about a narrower type causing Kotlin to list your list or set
    (or some other generic type) incorrectly. It''s also going to improve your code;
    you''re leaving less room for inference (by other people who read your code, not
    just the Kotlin compiler) and making your intent very clear.


    # COVARIANCE: A STUDY IN TYPES AND ASSIGNMENT


