- pgno: 335
  md: "CHAPTER 12 INHERITANCE, ONE MORE TIME, WITH FEELING\n\n# LISTING 12.4: Testing\
    \ out an abstract class\n\n```\nimport org.wiley.kotlin.car.Car\n\nfun main()\
    \ {\n    var car = Car()\n}\n```\n\nYou'll immediately get a compiler error:\n\
    \nKotlin: Cannot create an instance of an abstract class\n\nThis is pretty self-explanatory.\
    \ You can't instantiate an abstract class. More importantly, though, it gives\
    \ you a sense of what abstract classes are really for: defining must-have behavior\
    \ without defining the behavior itself.\n\n# Abstract Classes Define a Contract\
    \ with Subclasses\n\nCar defines a sort of contract with anything that subclasses\
    \ it. However, right now, contract is empty. You can't instantiate Car, if you\
    \ subclass it, you don't have to fulfill any requirements. Makes Car a rather\
    \ useless abstract class.\n\nA better approach is to define behavior in the abstract\
    \ class and then defer implementation to sub-classes. Listing 12.5 shows this\
    \ and what the drive() function abstract as well.\n\n# LISTING 12.5: Making the\
    \ single function in Car abstract\n\n```\npackage org.wiley.kotlin.car\nnabstract\
    \ class Car {\n\n    // Subclasses need to define how they drive\n    abstract\
    \ fun drive(direction: String, speed: Int) : Int\n}\n```\n\nIn this case, even\
    \ though the Car class is overall abstract, it's an effect. The class abstract\
    \ is the effect of having at least one abstract function. This is an important\
    \ thing to realize: abstract classes must be extended specifically so that the\
    \ abstract functions in those abstract classes can be overridden and given behavior.\n\
    \nThis is the contract that you'll often hear, and it's a contract between the\
    \ defining class—abstract class, in this case Car—and any and all classes that\
    \ subclass Car. The abstract class in this case says that this method must be\
    \ defined with this signature:\n\n```\n// Subclasses need to define how they drive\n\
    abstract fun drive(direction: String, speed: Int) : Int\n```\n\nNow classes that\
    \ extend Car know what is required of them. Listing 12.6 shows a simple extension\
    \ (with the emphasis on simple) of the Car class that fulfills the contract."
  merge: -1
  img_proc: true
- pgno: 336
  md: "# LISTING 12.6: Fulfilling the contract laid out by Car\n\n```\npackage org.wiley.kotlin.car\n\
    \nclass Honda : Car() {\n\n    override fun drive(direction: String, speed: Int)\
    \ : Int {\n        // Demo. Super: just return speed / minutes in an hour\n  \
    \      return speed / 60\n    }\n}\n```\n\nListing 12.7 uses Honda in an equally\
    \ simple example.\n\n# LISTING 12.7: Instantiating Honda and using the drive()\
    \ function\n\n```\nimport org.wiley.kotlin.car.Honda\n\nfun main() {\n    var\
    \ car = Honda()\n    println(\"The car drove ${car.drive(\"W\", 60)} miles in\
    \ the last minute.\")\n}\n```\n\nThe output is what you'd expect:\n\nThe car drove\
    \ 1 miles in the last minute.\n\n> WARNING Fair the implementation of functions\
    \ in this chapter will likely neither impress nor amaze you. That's OK; the goal\
    \ isn't to write particularly code, but to really focus on the various approaches\
    \ to inheritance that Kotlin provides, with first abstract classes and functions\
    \ and soon with interfaces and implementations of these interfaces. Don't get\
    \ too worried about the function code, but instead pay attention to how these\
    \ classes and constructs interact, and why inheritance works the way it does in\
    \ Kotlin.\n\nAbstract classes usually do more than just define a single abstract\
    \ function, though. It's common to see a number of functions as part of the contract\
    \ laid out by the abstract class. Abstract classes can also define properties\
    \ that needs to be handled by subclasses. Listing 12.8 shows a slightly evolved\
    \ version of car that adds an abstract property and some additional abstract functions.\n\
    \n# LISTING 12.8: Adding more details to the contract that Car defines\n\n```\n\
    package org.wiley.kotlin.car\n\nabstract class Car {\n```\n\n(continues)"
