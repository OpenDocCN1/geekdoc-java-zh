- pgno: 238
  md: "# Companion Objects Are Singletons\n\nThere is an important concept you need\
    \ to understand now: that of a singleton. a singleton is a class that has only\
    \ a single instance in a particular system. So even though you might reference\
    \ object—in two or five of one hundred places in your code, there is only a single\
    \ instance used in every reference.\n\nIn Kotlin, this is the role of a companion\
    \ object. A companion object is declared inside the object it is a companion to.\
    \ Listing 9.6 takes the code from Listing 9.5 and introduces a companion object,\
    \ and then places the ADMIN definition within that companion object.\n\n+   LISTING\
    \ 9.6: Adding an unnamed companion object to User\n\n```\npackage org.wiley.kotlin.user\n\
    \nclass User(var email: String, var firstName: String, var lastName: String, var\
    \ type: String) {\n    companion object {\n        const val ADMIN = \"Admin\"\
    \n    }\n\n    fun isAdmin(): Boolean {\n        return type.equals(ADMIN)\n \
    \   }\n\n    override fun toString(): String {\n        return \"$firstName $lastName\
    \ with an email of $email has a type of $type\"\n    }\n}\n```\n\nIn this case,\
    \ the companion object has no name, so you can reference the ADMIN property through\
    \ User:\n\nprintln(User.ADMIN)\n\nSo now you can go to your test class and change\
    \ your code to use this companion object property:\n\n```\nusers.add(User(\"bardia@gmail.com\"\
    , \"Bardia\", \"Dejban\", \"User.ADMIN\")\nusers.add(User(\"shawn@gmail.com\"\
    , \"Shawn\", \"Khorrami\", \"User.ADMIN\"))\n```\n\nThis code now compiles, and\
    \ gives you the expected output:\n\nBardia Deban is frothing with power:\nShawn\
    \ Khorrami is frothing with power!\n\nIt's worth walking exactly what's happening\
    \ here to be really clear about the effect of a singleton.\n\nFirst, instances\
    \ of User are created.\n\n```\nusers.add(User(\"bardia@gmail.com\", \"Bardia\"\
    , \"Dejban\", \"User.ADMIN\")\nusers.add(User(\"shawn@gmail.com\", \"Shawn\",\
    \ \"Khorrami\", \"User.ADMIN\"))\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "Both have as type User.ADMIN, which is the value defined in the companion object.\
    \ So both have the exact same value for type. Again, that doesn't just mean both\
    \ have a String value of \"ADMIN.\" It means they both point to the same actual\
    \ location in memory, which is \"owned\" by the User's companion object.\n\nFor,\
    \ each of these instances, the isAdmin() function is called, which runs this code:\n\
    \n```\nfun isAdmin(): Boolean {\n    return type.equals(ADMIN)\n}\n```\n\nThe\
    \ type value is the User.ADMIN property, which is compared to the exact same property.\
    \ And remember, this is actually going result in memory equality, every time you\
    \ use User.ADMIN, or just ADMIN within the User class, the exact same instance\
    \ object property is referenced.\n\nThat's the power and use of a companion object\
    \ that's a singleton: it removes any ambiguity about a value, and ensures equality\
    \ of comparisons at the deepest, lowest level possible.\n\n# Companion Objects\
    \ Are Still Objects\n\nBefore returning to the problem at hand—constants and type\
    \ safety for the User class and in general—it's worth looking a bit more at companion\
    \ objects. At their heart, companion objects are singletons, so they are just\
    \ objects. They can have names, their own properties, and functions.\n\nListing\
    \ 9.7 takes the version of User in Listing 9.6 and adds quite a bit to its companion,\
    \ including a name. It adds some functions to that.\n\nLISTING 9.7: Filling out\
    \ the companion object for User\n\n```\npackage org.wiley.kotlin.user\n\ndata\
    \ class User(email: String, firstName: String, lastName: String, var type: String)\
    \ {\n    companion object Factory {\n        const val ADMIN = \"Admin\"\n   \
    \     const val MANAGER = \"Manager\"\n        const val END_USER = \"End User\"\
    \n        const val DEFAULT = END_USER\n    }\n\n    fun createAdmin(email: String,\
    \ firstName: String, lastName: String): User {\n        return User(email, firstName,\
    \ lastName, ADMIN)\n    }\n\n    fun createManager(email: String, firstName: String,\
    \ lastName: String): User {\n        return User(email, firstName, lastName, MANAGER)\n\
    \    }\n\n    fun isAdmin(): Boolean {\n        return type.equals(ADMIN)\n  \
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Companion Objects Single Instance\n\n```\noverride fun toString(): String\
    \ {\n    return \"$firstName $lastName with an email of $email has a user type\
    \ of $\\$type\"\n}\n```\n\nA couple of things to note here, all important as you\
    \ begin using companion objects:\n\n+   - A companion object can have a name,\
    \ in this case, Factory.\n- A companion object can have functions.\n\n+   - Companion\
    \ object functions often return the type of the containing object (in other words,\
    \ the object this companion is the companion to).\n\nThis is a relatively clear\
    \ idea. The companion object is now called Factory, and in addition to the ADMIN\
    \ context, it defines a few additional user types: MANAGE and END_USER. It also\
    \ defines a DEFAULT type, which references the END_USER type.\n\nIt also adds\
    \ things that create a couple of users with just an first name, and last name.\
    \ This means that users of this code (not User instances, but all developers)\
    \ don't keep up with constants like User. ADMIN if they don't want to. Instead,\
    \ they can createAdmin() or createManager() and the details of types will be taken\
    \ care of by the Factory object.\n\n# You Use Companion Objects Without Your Names\n\
    \nIf you updated your code to match 9.7 and compiled or ran your project, you\
    \ might have noticed something pretty unusual. These lines of code did not result\
    \ in a compiler error:\n\n```\nusers.add(User(\"bardia@gmail.com\", \"Bardia\"\
    , \"Debjan\", \"User.ADMIN\")\nusers.add(User(\"shawn@gmail.com\", \"Shawn\",\
    \ \"Khorrami\", \"User.ADMIN\\))\n```\n\nYou would expect all the references to\
    \ User. ADMIN to change to User.Factory. But that's another wrinkle (or convenience)\
    \ that companion objects add: you can use the companion object's name, but you\
    \ don't have to. You can reference properties and functions as they belonged to\
    \ the companion class\n\n# Using a Companion Object's Name Is Optional\n\nYou\
    \ would expect that you need to modify these types to look like this:\n\n```\n\
    users.add(User(\"bardia@gmail.com\", \"Bardia\", \"Debjan\", \"User.Factory.ADMIN\"\
    )\nusers.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\", \"User.Factory.ADMIN\\\
    ))\n```\n\nBut that's not the case, and it makes using companion objects quite\
    \ simple. You can now use the helper functions, as shown using helper functions\
    \ in Listing 9.8.\n\nLISTING 9.8: Using functions in the test class\n\n```\nimport\
    \ org.wiley.kotlin.kotlin.User\n\nfun main() {\n```\n\ncontinues"
