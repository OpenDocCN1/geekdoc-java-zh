    \ = _children\n\n    constructor(_firstName: String, lastName: String,\n     \
    \   _children: Set<_child>) :\n        this(_firstName, lastName, _children =\
    \ setOf(_child))\n}\n```\n\nIn fact, this eliminates the need for any code in\
    \ the secondary constructor. It now acts as a convenience constructor.\n\n# Sets\
    \ and MutableSets Aren’t the Same\n\nBut you still have errors:\n\nError(7, 40)\
    \ Kotlin: Type mismatch: inferred type is Set<Person> but\nMutableSet<Person>\
    \ was expected\n\nWhat's going on now? The issue here is that you're creating\
    \ a new MutableSet<Person> called\nchildren and assigning it a Set<Person>. But\
    \ a mutable set and an immutable one are not all the\\same, so Kotlin throws an\
    \ error.\n\nInstead, you'll need to create the mutable set and add all the elements\
    \ from the immutable\nset to it:\n\n```\nvar children: MutableSet<Person> = mutableListOf()\n\
    \ninit {\n    children.addAll(_children)\n}\n```\n\n> NOTE It’s actually a bit\
    \ misleading to call the set passed into the primary con-\nstructor of Parent\
    \ an immutable set. Rather, it's that Kotlin treats them as imm-\ntable because\
    \ the type is Set<Person> in the constructor's list of arguments. But\nthat's\
    \ just that either a mutable or immutable set can be passed in.\nIn reality, it's\
    \ the need to accept both types of sets at the constructor level that\ncreates\
    \ this extra code in init. That's a tradeoff; rather than only accepting\nmutable\
    \ sets in the constructor, all sets are accepted, but then extra code has to\n\
