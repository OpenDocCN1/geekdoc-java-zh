- pgno: 205
  md: "You may not find yourself coding in one of these two contexts, so using while\
    \ as your standard is absolutely OK. However, if you do find yourself in a place\
    \ where performance is critical, it tends to matter a lot. In other words, while\
    \ small percentage of the time that the difference between do ... while and while\
    \ executing at least one versus maybe be not at all tends to really be a game\
    \ changer.\n\n# GET OUT OF A LOOP IMMEDIATELY WITH BREAK\n\nSo far, you've seen\
    \ a number of control structures. Each allows you to choose from one of a few\
    \ different paths or reach a portion of a path over. These various structures\
    \ and iterations can be simple or complex, and you can get plenty fancy with conditions\
    \ and iterators if you need to.\n\nThe last two sections in this chapter focus\
    \ on a bit of heavy-handed approach to controlling the flow of your code. Using\
    \ break (covered in this section) and continue (covered in the next) are great\
    \ tools, but used less than if for and while. They are blunt instruments more\
    \ often than not, ripping out of the sequence of code being executed, skipping\
    \ over lines or jumping from one of code to a bit more abruptly than you've seen\
    \ so far.\n\n# Break Skips What's Left in a Loop\n\nSuppose you have a loop like\
    \ this:\n\n```\nvar low = 1nvar high = 100\nwhile (low < high) {\n    var foundPrime\
    \ = false\n    for (i in 2 .. low/2) {\n        if (low % i == 0) {\n        \
    \    foundPrime = true\n            break\n        }\n    }\n    if (!foundPrime)\
    \ print(\"$low\")\n}\nlow++\n```\n\nYou saw this code earlier in an example of\
    \ using multiple control structures in a single piece of code. This code hunts\
    \ through a range of numbers (between low and high) and sees if each number it\
    \ examines prime. Once it finds a prime, the loop needs to stop executing.\n\n\
    This is important, because finding a prime is effectively a second exit condition\
    \ for the loop. The first exit condition is the iteration from 2 to low/2. Of\
    \ course, for loops don't offer two exit conditions, which is where break comes\
    \ in."
  merge: -1
  img_proc: true
- pgno: 206
  md: "# Get out of a Loop Immediately with Break | 177\n\nUsing that keyword with\
    \ an if, there's this extra exit condition:\n\n```\nif (low % i == 0) {\n  foundPrime\
    \ = true\n  break\n}\n```\n\nIf this condition evaluates to true, foundPrime is\
    \ updated, and the break keyword exits the nearest enclosing loop. That for your\
    \ loop here:\n\n```\nfor (i in 2 .. low/2) {\n  if (low % i == 0) {\n    foundPrime\
    \ = true\n    break\n  }\n}\n```\n\n# You Can Use a Label with break\n\nSometimes,\
    \ with most control structures, it can be hard to know exactly where program execution\
    \ goes. This is particularly true with break, as control does not continue to\
    \ the next line, or move to a specific block of code further down in your code.\n\
    \nTo aid in this, you can use a label. A label in Kotlin is a single word that\
    \ ends with @ That word is ignored by the Kotlin compiler in terms of syntax.\
    \ But it can be used by other pieces of your code.\n\nHere's that same loop as\
    \ earlier, with an added label:\n\n```\nprime_loop@ for (i in 2 .. low/2) {\n\
    \  if (low % i == 0) {\n    foundPrime = true\n    break\n  }\n}\n```\n\nYou can\
    \ now use that label in your break statement. You use break as you normally would,\
    \ add the @ sign, and then the name of the label:\n\n```\nprime_loop@ for (i in\
    \ 2 .. low/2) {\n  if (low % i == 0) {\n    foundPrime = true\n    break@prime_loop\n\
    \  }\n}\n```\n\n> WARNING The use of @ in Kotlin syntax with labels and break\
    \ can be a little confusing at first. The @ character goes after the loop name,\
    \ but before the loop name when used in a break. This just takes some time before\
    \ it becomes natural."
  merge: -1
  img_proc: true
- pgno: 207
  md: "In this example, the label isn't needed; break already was jumping out of that\
    \ for loop, because it's the nearest currently executing for. In one sense, the\
    \ label adds clarity; it indicates the loop break is getting your code out of.\
    \ So control would continue with the first line after the for loop marked with\
    \ the matching label.\n\nNow, that's not particularly clear, using a label just\
    \ \"because\" won't always help your code's legitimacy that much.\n\nHere's an\
    \ example with two loops, each with a distinct label:\n\n```\nouter_loop: for\
    \ (j in 1..10) {\n  var low = 1\n  var high = 100\n\n  while (low < high) {\n\
    \    var foundPrime = false\n\n    prime_loop: for (i in 2..low / 2) {\n     \
    \ if (low % i == 0) {\n        foundPrime = true\n        break outer_loop\n \
    \     }\n    }\n\n    if (!foundPrime) print(\"$low \")\n\n    low++\n  }\n  println(n)\n\
    }\n```\n\nIn this example, when a prime is found, break uses the outer_loop label\
    \ to jump out of the for loop running from 1 to 10—which is not the nearest executing\
    \ loop.\n\n> NOTE Full disclosure: finding a practical example for using a labeled\
    \ break is actually pretty tough. I couldn't think of a single case where I've\
    \ used something like this in nearly 20 years of programming, and even some significant\
    \ time on Google largely turned up contrived or downright silly examples. So know\
    \ that you can do this, but realize you might never actually use it!\n\n# GO TO\
    \ THE NEXT ITERATION IMMEDIATELY WITH CONTINUE\n\nbreak is a relatively extreme\
    \ flow control because it immediately (and in some cases, abruptly) jumps out\
    \ of the current or labeled loop. continue, on the other hand, moves to the next\
    \ iteration of the current loop. So it stops the current iteration—ignoring any\
    \ remaining code in that loop—and continues with the next iteration."
  merge: -1
  img_proc: true
- pgno: 208
  md: "# Go to the Next Iteration Immediately with Continue | 179\n\nHere’s a simple\
    \ loop that uses continue:\n\n```\nfor (i in 1..20) {\n    if (i % 2 == 0) continue\n\
    \    println(\"${i} is odd\")\n}\n```\n\nThis loop has an if, and if the condition\
    \ is true, the continue goes to the next iteration. That means for even numbers,\
    \ this will be skipped:\n\n```\nprintln(\"${i} is odd\")\n```\n\nThis is the significant\
    \ advantage of continue: it leaves your loop intact. You write the loop body as\
    \ you normally, knowing that any code after a continue is simply ignored in that\
    \ iteration.\n\n# Continue Works with Labels as Well\n\nJust as you can use break\
    \ with a labeled loop, you can do the same with continue:\n\n```\nmeasures@ (measure\
    \ in 1..10) {\n    print(\"Measure ${measure}: *\")\n    for (beat in 1..4) {\n\
    \        // Lay out on beats 3 and 4 of measures 5 and 10\n        if (measure\
    \ == 5 | measure == 10) && (beat in 3..4)) {\n            println(\"...\")\n \
    \           continue@measure\n        }\n\n        // only \"play\" on the 2 and\
    \ 4\n        if (beat % 2 == 0) {\n            print(\"snare beat\")\n       \
    \ else {\n            print(\"${beat} beat\")\n        }\n    }\n    println()\n\
    }\n```\n\nThis loop has few control structures and uses a continue to jump out\
    \ of the outer loop (the for using measure as a counter) when certain conditions\
    \ are met.\n\n# If versus continue: Mostly Style over Substance\n\nLook carefully\
    \ at this code:\n\n```\nfor (i in 1..20) {\n    if (i % 2 == 0) continue\n   \
    \ println(\"${i} is odd\")\n}\n```\n\nYou could easily rewrite this code using\
    \ an if without continue:\n\n```\nfor (i in 1..20) {\n    if (i % 2 != 0) println(\"\
    ${i} is odd\")\n}\n```"
  merge: -1
  img_proc: true
- pgno: 209
  md: "The condition for the if has to be negated (using != instead of ==), but then\
    \ the if statement condition executes the printin, and you get the result.\n\n\
    In fact, you can always use an if instead of a continue if you like. Suppose a\
    \ loop looks like this:\n\n```\nfor (CONDITION) {\n  // Code that always runs\n\
    \  if (CONDITION) {\n    continue\n  }\n  // Code that only runs if the above\
    \ CONDITION was false\n}\n```\n\nThis loop can be converted to if and not use\
    \ continue like this:\n\n```\nfor (CONDITION) {\n  // Code that always runs\n\
    \  if (!CONDITION) {\n    // Code that only runs if the above CONDITION was true\n\
    \  }\n}\n```\n\nSo why use one over the other? Well, it's really a matter of preference.\
    \ You're going to have some sort of condition associated with continue, or you'd\
    \ never complete your loop body. That means you can use the opposite of that same\
    \ condition to execute the rest of the loop body. Either way, that is the effect.\n\
    \nThe primary advantage to using continue is that it's very clear what's going\
    \ on, and you don't have to put a lot of code into an if block. If you have 20\
    \ or 30 lines of code that only executes in certain situations, and especially\
    \ if that code has control structures of its own, continue can really clean up\
    \ your code.\n\nOn the other hand, if you are only skipping a line or two with\
    \ continue, it is actually easier to an if without continue. This will make your\
    \ code simpler.\n\n# RETURN RETURNS\n\nIt's worth mentioning return briefly, even\
    \ though you've been using return for quite a bit already. Put simply, return\
    \ returns. More technically, return exits out of the nearest function body.\n\n\
    For the most part, you've seen return used at the end of a function, like this:\n\
    \n```\nfun someStrings(): List<String> {\n  var someStrings = mutableListOf<String>()\n\
    \  for (i in 1..Random.nextInt(10)) {\n    someStrings.add(randomString(10))\n\
    \  }\n  return someStrings\n}\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "But you can put a return anywhere. Here’s another simple utility function to\
    \ find a string in a supplied list that starts with a particular character:\n\n\
    ```\n```kotlin\nfun findFirstStringStartingWith(starts: Char, strings: List<String>):\
    \ String {\n    for (str in strings) {\n        if (str.startsWith(starts)) return\
    \ str\n    }\n    return \"\"\n}\n```\n```\n\nreturn is used here to jump out\
    \ of this code as soon as a matching string is found. That could result in a big\
    \ change in how this code executes. Suppose you had a list of 1,000 strings, and\
    \ the second string started with the desired character. By using return, you skip\
    \ another 998 iterations through this loop.\n\nSo what’s next? You’ve just blown\
    \ through over 30 pages of new control structures and ways to adjust the program\
    \ flow. With that in hand, it’s time to go back to class and dig even deeper into\
    \ what Kotlin provides."
