  md: '# # 7 Flying through Control Structures


    WHAT''S IN THIS CHAPTER?


    +   - Using if and else for conditional code execution

    - Building expressions with when

    - Selecting from multiple options for execution

    - Iterating over collections with for

    - Looping until a condition is true with while

    - Adding do to while for initial execution

    - Using break and continue to control flow


    # ## CONTROL STRUCTURES ARE THE BREAD AND BUTTER OF PROGRAMMING


    Whether you are relatively new to programming or have been writing Java for 20
    years, and Kotlin is just an exercise in expanding your programming breadth, you''ve
    almost certainly worked with a lot of control structures. In fact, you''ve already
    seen these a number of times in this book: every time you''ve used an if statement
    or a for, you''ve been using a control structure.


    In this chapter, you''ll go beyond passing familiarity with these in Kotlin and
    dig more deeply into control structures and loops. The obvious place to start
    is with the most common: if, when, for, and while.'
