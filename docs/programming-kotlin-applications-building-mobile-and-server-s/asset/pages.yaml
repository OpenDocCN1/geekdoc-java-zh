- pgno: 96
  md: 'Fortunately, there’s not much needed here, for a few reasons:


    +   - You’re using the hashCode() methods from the built-in String class. You
    can generally count on hashCode() implementations in Kotlin basic types being
    well-optimized, so that’s a safe thing to leave in place.


    +   - You’re using multiplication and addition of Ints. This is another highly
    optimized activity that isn’t going to take a lot of CPU time.


    +   - Finally, you’re adding the results of those multiplications. Addition is
    also blazing fast.


    So this method is good to go. Still, when you check out equals(x), always remember
    to check out hashCode(x) , too.


    # BASIC CLASS METHODS ARE REALLY IMPORTANT


    At this point, you may be a little surprised. After all, in over 15 pages of text
    on learning Kotlin, you’ve spent your time working with two methods: equals(x)
    and hashCode(x). On top of that, these methods are already written for you! You’ve
    just been updating them. So what gets?


    The reality is that the fundamentals of class design in Kotlin are really, important.
    The very best programmers—in any language—understand that a well-written equals(x)
    method dramatically improve performance of a program, reduces bugs related to
    checking for equality, and ultimately reflect a skilled hand at the class helm.
    Pick up classic programming works like Bloch’s Effective Java or the famous Gang
    of Four’s work on Design Patterns: Elements of Reusable Object-Oriented Software
    and you’ll find a lot of time spent on basics like this.


    > NOTE In fact, Joshua Bloch talks about the need to override hashCode(x) when
    you override equals(x) in Effective Java specifically.


    You’ve implicitly taken some important steps to understanding inheritance, as
    well as gotten your first look at the Any class. These are both to later classes
    that dig deeper into inheritance and subclassing. So take heart! All this work
    will pay off, and you’ll be among the masses left wondering “why do things work
    the way they do with Kotlin classes?'
