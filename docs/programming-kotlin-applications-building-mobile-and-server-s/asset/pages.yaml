  md: '# If You Can Use a Class, You Should


    This really highlights the value of data classes. While it wasn''t a tremendous
    amount of work to add component1(), component2(), and component3() method to SimpleUser,
    the upkeep is significant. Just think of how often these methods might need to
    change:


    +   * A new property is added to a class and therefore a new componentN() method
    is needed.

    * The order of properties and therefore the body of the methods needs to change
    to return the correct property.

    * A property is removed and therefore the accompanying component method needs
    to also be removed.


    Compare this to data class. If you''re using a class and any of the preceding
    situations occur, you have to do... nothing. Just recompile, and Kotlin takes
    care of the rest.


    # YOU CAN "COPY" AN OBJECT OR MAKE A COPY OF AN OBJECT


    What a mouthful of a heading! But it''s true: you have two different ways to create
    a copy of an object, and data classes are really helpful in this regard.


    # Using = Doesn''t Actually Make a Copy


    First, you can copy through a simple = assignment. This is actually not creating
    a copy (and why the heading for this section reads "copy" with quotation marks).
    Here''s how you''d typically see that:


    ```

    val bob = robert

    ```


    This looks straightforward but has some issues. It''s actually not creating a
    copy of anything. Instead, you now have two variables: robert and bob. Both point
    at the same bit of memory, and both point to the same actual instance of User.
    That means changes to one affect the other.


    Try out the code shown in 8.7.


    > LISTING 8.7: Using = copy()


    ```

    // Create another variable pointed at the robert instance

    val bob = robert

    ```


    ```

    // Change things and see the effect

    bob.firstName = "Percy"

    println("Bob''s first name: ${${bob.firstName}}")

    println("Robert''s first name: ${${robert.firstName}}")

    bert.firstName = "Bob"

    println("Bob''s first name: ${${bob.firstName}}")

    println("Robert''s first name: ${${robert.firstName}}")

    ```'
