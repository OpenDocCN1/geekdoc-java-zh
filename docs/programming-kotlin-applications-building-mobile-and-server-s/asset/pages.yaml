  md: "# Multiple Properties to Differentiate Them in hashCode()\n\nYou need a way\
    \ to see if this is happening (and when it's not). Add this to PersonTest:\n\n\
    ```\nval backward_brian = Person(\"Trusby\", \"Brian\", 67.6, 42, false)\nif (backward_brian.equals(brian))\n\
    \    println(\"Brian and Backward Brian are the same!\")\nelse\n    println(\"\
    Brian and Backward Brian are not the same!\")\n\nprintln(\"Brian hashcode: ${brian.hashCode()}\"\
    )\nprintln(\"Rose hashcode: ${rose.hashCode()}\")\nprintln(\"Second Brian hashcode:\
    \ ${second_brian.hashCode()}\")\nprintln(\"Copy of Brian hashcode: ${copy_of_brian.hashCode()}\"\
    )\nprintln(\"Backward Brian hashcode: ${backward_brian.hashCode()}\")\n```\n\n\
    The output should look like this:\n\n```\nRose and Brian aren't the same\nBrian\
    \ and Second Brian are the same!\nBrian and Copy of Brian are the same!\nBrian\
    \ and Backward Brian are not the same\nBrian hashcode: 680248194\nRose hashcode:\
    \ -153460291\nSecond Brian hashcode: 680248194\nCopy of Brian hashcode: 680248194\n\
    Backward Brian hashcode: 680248194\n```\n\nThis definitely confirms the issue:\
    \ brian and backward_brian are not equal, but they are returning the same hashcode.\n\
    \nTo fix this, you need to differentiate between names matching, and specifically\
    \ the first and last name matching. The most developers handle this in a method\
    \ like hashCode() is to use a multi-plier that differs for each, like this:\n\n\
    ```\noverride fun hashCode() : Int\n    return (firstName.hashCode() * 28) + (lastName.hashCode()\
    \ * 31)\n```\n\n> There is nothing significant about the number 28 or 31. You\
    \ just need something to multiply the properties. What is important is that you\
    \ use a different number for each property. If you don't, you're going to get\
    \ identical hash codes when you shouldn't.\n\nNow, if two objects have a match\
    \ between first name and last name, and then last name and first name, the result\
    \ from hashCode() will be different because the multiplier is different. Run Person-Test\
    \ to see this in action:\n\n+   Rose and Brian aren't the same\nBrian and Second\
    \ Brian are the same!\nBrian and Copy of Brian are the same!"
