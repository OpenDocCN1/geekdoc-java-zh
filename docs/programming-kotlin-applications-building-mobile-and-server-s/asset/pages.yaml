- pgno: 193
  md: "# You Can Grab Indices Instead of Objects with for\n\nOne apparent limitation\
    \ of using via an iterator is that you're generally going to be going over each\
    \ item in the collection. On top of that, you're just getting the item itself,\
    \ rather than an index.\n\nSo with Java, you'd have code like this:\n\n```\nint\
    \ ar[] = { 1, 2, 3, 4, 5, 6, 7, 8 };\nint i, x;\n\n// iterating over an array\n\
    for (i = 0; i < ar.length; i++) {\n    // accessing each element of array\n  \
    \  x = ar[i];\n    System.out.print(x + \" * *\");\n}\n```\n\nEach time through\
    \ the loop, i would be an index, and that index also serves as a loop counter.\
    \ But you can do the equivalent in Kotlin by grabbing the indices from a collection:\n\
    \n```\nint ar[] = { 1, 2, 3, 4, 5, 6, 7, 8 };\nint i, x;\n\nfor (i in ar.indices)\
    \ {\n    x = ar[i]\n    println(\"${{x} * ${x}\")\n}\n```\n\nInstead of directly\
    \ iterating over the loop, the indices property is used—which itself returns an\
    \ iterator—and each time through the loop, i is an index rather than the item\
    \ at index.\nin the preceding example, it's a bit useless, as the code would be\
    \ better to grab each object of the array. But you might want to print out the\
    \ index of each item:\n\n```\nfor (i in ar.indices) {\n    x = ar[i]\n    println(\"\
    ${{x} is at index ${i}}\")\n}\n```\n\nOne warning of though: it is not safe to\
    \ assume that the collection returned by indices is identical to a counter starting\
    \ at 0 or 1. If you want a stricter counter, you'll likely need to separate the\
    \ indices from objects or objects over which you're iterating:\n\n```\nvar counter:\
    \ Int = 1\nfor (i in ar.indices) {\n    x = ar[i]\n    println(\"Item ${{counter}}:\
    \ ${x} is at index ${i}\")\n    counter++\n}\n```"
  merge: -1
