    \ class\n\n```\nimport org.wiley.kotlin.person.Person\nimport org.wiley.kotlin.person.Parent\n\
    \nfun main() {\n    // Create a new person\n    val brian = Person(\"Brian\",\
    \ \"Trueby\", 68.2, 33)\n    printPersonPartnerStatus(brian)\n\n    // Create\
    \ another person\n    val rose = Person(\"Rose\", \"Bushnell\", brian)\n    printPersonPartnerStatus(rose)\n\
    \n    // Change Rose's last name\n    rose.lastName = \"Bushnell-Trueby\"\n  \
    \  println(rose)\n\n    val mom = Parent(\"Cheryl\", \"Trueby\", _child=brian)\n\
    \    mom.child = rose\n}\n\nfun printPersonPartnerStatus(person: Person) { ..\
    \ }\n```\n\n> WARNING Don't forget to add the new import line at the top to import\
    \ the Parent class in addition to Person.\n\nThis is weird, to say the least.\
    \ So it would be better to change child to a val, making it immutable:\n\n```\n\
    val child: Person? = _child\n```"
