- pgno: 297
  md: 'But this can be made simpler. A function or lambda can explicitly return a
    value. If there''s not a return, the expression is evaluated, and the result of
    evaluation is that. That''s actually what is happening in the preceding code;
    the expression evaluates to either true or false, and that value is returned,
    even there is not an explicit return.


    Still, things can get even simpler. In lambda expressions with an if, all you
    may need is the condition itself. If the condition is evaluated and comes back
    true, you can let that get up as the result of the lambda; if the condition evaluates
    to false, then that can be returned as.


    Here''s how that might look for the same expression:


    ```

    { it.toUpperCase().startsWith("*") }

    ```


    Using in it and just the condition from an if, this lambda expression gets concise,
    and actually clearer to read.


    # Trailing Functions as Arguments to Other Functions


    Just as is idiomatic to lambdas in Kotlin, so is the ability to leave out parentheses
    on what is called a trailing lambda. Take a look at the definition of printList():


    ```

    printList(input: List<String>, filterOut: (String) -> Boolean) {

    ```


    This function has its last argument as an input function. In this case you will
    see a different notation for calling this higher-order function. Currently, here''s
    how printList() is called with a lambda expression input:


    ```

    printList(strings, { it.toUpperCase().startsWith("*") })

    ```


    However, you can include all but the trailing function in parentheses, and then
    leave the trailing lambda expression outside the parentheses:


    ```

    printList(strings) { it.toUpperCase().startsWith("*") }

    ```


    This probably looks a little odd, but you''ll see this often from experienced
    Kotlin programmers. It doesn''t offer any particular advantage; it''s just a notation
    change that you should be aware of when looking at other Kotlin code.


    > NOTE This truly a matter of coding style and preference. You may find that you
    like this style, or you may find that you prefer to not use trailing lambdas,
    and keep everything in parentheses. There is no right or wrong, or even better
    or worse, here.


    # LOTS OF FUNCTIONS, LOTS OF ROOM FOR PROBLEMS


    With great functionality comes room for poor programming. That''s not a popular
    expression, but it could be. With anonymous functions, lambda expressions, higher-order
    functions, and everything you''ve learned prior to this chapter, you''re seeing
    that almost any task in Kotlin can be accomplished in more than one way.'
