  md: 'This new function uses the add() function already defined and prints out a
    sum with a String prefix. You can call this new function easily:


    ```

    ab.add_print("* sum is:", 1, 8, 0, 3)

    ```


    If you wanted to avoid the prefix sum, you could send an empty string:


    ```

    ab.add_print("*", 1, 8, 0, 3)

    ```


    > NOTE This code makes the point about null values, but it also removes the ability
    to take advantage of default values that add() declares. To still allow those,
    you''d have to add the default values that are defined in the add() function of
    Calculator (as they can''t be restated in Abacus) to the function definition of
    add_and_print().

    That''s still a bad idea, now if Calculator''s add() changes, you''ll have to
    change add_and_print(), and that sort of undocumented tie between two functions—in
    two classes, no—is a bad and fragile approach to code.


    However, you cannot call the function like this:


    ```

    ab.add_print(null, 1, 8, 0, 3)

    ```


    Kotlin won''t accept null values, and gives you an error in compilation:

    Kotlin: Null cannot be a value of a non-null type String


    You can avoid this by defining in the function that the String argument can be
    null:


    ```

    fun add_and_print(text: String?, num1: Int, num2: Int, num3: Int, num4: Int) {

    The ? after the type of the argument for text tells Kotlin that you''re prepared
    to take responsibility for null values.

    ```


    Of course, getting to compile and running the code is two separate things. This
    code now compiles, but you''re going to get silly out:


    ```

    null 12

    ```


    While add_and_print allows null values, it really does nothing to actually handle
    them in a useful way. You''d want something like this:


    ```

    fun add_and_print(text: String?, num1: Int, num2: Int, num3: Int, num4: Int) {

    var outputString = StringBuilder(null)

    if (text != null && !text.isEmpty()) {

    outputString.append(text).append(": *")

    }

    outputString.append(add(num1, num2, num3, num4))

    }

    println(outputString)

    ```'
