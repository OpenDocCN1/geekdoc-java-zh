- pgno: 309
  md: "# CHAPTER 11 SPEAKING IDIOMATIC KOTLIN\n\n> NOTE IDEs don't particularly like\
    \ this nested form, either. I kept having to remove a closing bracket and move\
    \ it to even write this code in the first place. It's almost as if the IDE knew\
    \ that there was a better approach!\n\nA second problem is that the use of it\
    \ can become hairy. While it's relatively clear that it applies to the current\
    \ lambda, what it references is actually changing as you go down further into\
    \ the nesting. That's potentially confusing.\n\nWhat you might have noticed, though,\
    \ that this case of nesting does not result in the shadowing of an it reference.\
    \ When you immediately attach the let (or other scope function) to the last lambda\
    \ expression, you can use it as without concern.\n\n# Many Chained Functions Start\
    \ with a Nested Function\n\nThere's another common pattern that shows up in this\
    \ example:\n\n```\nvar bigResult = Calculator().let { calc ->n  calc.execute(8,\
    \ Operation.Add(4)).let {\n    calc.execute(12, Operation.Multiply(it))\n  }.let\
    \ {\n    calc.execute(it, Operation.Divide(18))\n  }.let {\n    calc.execute(16,\
    \ Operation.Subtract(it))\n  }.let {\n    calc.execute(it, Operation.Raise(2))\n\
    \  }\n}\nprintln(\"Big result is ${bigResult}\")\n```\n\nIt's the idea of a single\
    \ nesting with chains of scope function functioning within that. The initial let\
    \ call on an instance of Calculator has within it a lot of nested scope functions,\
    \ but each of those are chained together.\n\nThis turns out to be common, especially\
    \ when you start to think of scope functions as ways to avoid keeping variables\
    \ that are only needed for a single purpose. You'll often create an initial instance\
    \ that you can then operate on over and over again, chaining results.\n\n# You\
    \ Can Scope Functions to Non-Null Results\n\nAnother important use of let and\
    \ scope functions is to address situations where an instance or variable might\
    \ be null.\n\n> NOTE You're probably noticing that much of this chapter talks\
    \ about let and scope functions in the same breath. While not all scope functions\
    \ act identically to let, most follow the same basic rules. This section gets\
    \ you comfortable with those rules, and the following sections detail the specific\
    \ scope functions beyond let, and how each is similar to and varies from let."
