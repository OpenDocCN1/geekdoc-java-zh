  md: "Kotlin also gives you a setter, or (again, more formally) a mutator. A mutator\
    \ lets you mutate a value, which just needs to change it. So you can add this\
    \ into your program:\n\n```\n// Create a new person\nval brian = Person(\"Brian\"\
    , \"Trues\")\nprintln(brian.firstName)\n```\n\n```\n// Create another person\n\
    val rose = Person(\"Rose\", \"Bushnell\")\nrose.lastName = \"Bushnell-Truesby\"\
    \n```\n\nJust as you can get data through an accessor, you can update data through\
    \ mutators.\n\n> WARNING For the most part, I'll be calling setters, and calling\
    \ setters mutators. That's not as common as \"getter\" or \"setter,\" but as a\
    \ good friend and editor of mine once told me, a setter is a hairy and somewhat\
    \ fluffy dog; a mutator lets you update class data. The difference—and his colorful\
    \ explanation—has stuck with me for 20 years.\n\nNow, if you've gone ahead and\
    \ compiled this code, you've run into yet another odd error, and that's the last\
    \ thing to fix before moving on from this initial foray into objects.\n\n# Constants\
    \ Can't Change (Sort of) \n\nHere's the code causing the problem:\n\n```\n// Create\
    \ another person\nval rose = Person(\"Rose\", \"Bushnell\")\nrose.lastName = \"\
    Bushnell-Truesby\"\n```\n\nIf you try to run this, you'll get an error like this:\n\
    \n```\nError: Kotlin cannot be reassigned\n```\n\nOne of the things that is fairly\
    \ unique about Kotlin is its strong stance on variables. Specifically, Kotlin\
    \ allows you to not just declare the type of a variable, but also whether that\
    \ variable is a mutable, or a constant variable.\n\n> NOTE The terminology here\
    \ is a bit confusing, so take your time. Just as with methods being declared with\
    \ the fun keyword, the idea of a constant variable takes a little getting used\
    \ to.\n\nWhen you declare a variable in Kotlin, you can use the keyword val, as\
