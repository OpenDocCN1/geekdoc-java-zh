  md: "This isn’t particularly helpful, as you could do this with an if. If it become\
    \ interesting when you’re dealing with multiple branches, though:\n\n```\nwhen\
    \ {\n    (anotherNumber % 2 == 0) -> println(\"The number is divisible by 2!\"\
    )\n    (anotherNumber % 3 == 0) -> println(\"The number is divisible by 3!\")\n\
    \    (anotherNumber % 5 == 0) -> println(\"The number is divisible by 5!\")\n\
    \    (anotherNumber % 7 == 0) -> println(\"The number is divisible by 7!\")\n\
    \    (anotherNumber % 11 == 0) -> println(\"The number is divisible by 11!\")\n\
    \    else -> println(\"This is hardly divisible by anything!\")\n}\n```\n\nThis\
    \ particular example isn’t exciting, but it does show that you can handle a multiple-branch\
    \ situation easily. To do this with, you would need if/else statements chained\
    \ together:\n\n```\nif (anotherNumber % 2 == 0) {\n    println(\"The number is\
    \ divisible by 2!\")\n} else if (anotherNumber % 3 == 0) {\n    println(\"The\
    \ number is divisible by 3!\")\n} else if (anotherNumber % 5 == 0) {\n    println(\"\
    The number is divisible by 5!\")\n} else if (anotherNumber % 7 == 0) {\n    println(\"\
    The number is divisible by 7!\")\n} else if (anotherNumber % 11 == 0) {\n    println(\"\
    The number is divisible by 11!\")\n} else {\n    println(\"This is hardly divisible\
    \ by anything!\")\n}\n```\n\n> Kotlin doesn’t have any idea of an elseif or itself,\
    \ as some languages do. You can simply use else and then if, successively.\n\n\
    # Branch Conditions Are Checked Sequentially\n\nThe Kotlin runtime will check\
    \ each branch at a time, in the order that you appear in your code. Additionally,\
    \ only one branch will execute. In the previous code, if anotherNumber is 6, it\
    \ would actually be divisible by 2 and 3, but only the branch with the condition\
    \ (anotherNumber % 2 == 0) will execute. The first branch that matches, and therefore\
    \ the only branch executes.\n\nMost of the time, you will naturally write conditions\
    \ that are mutually exclusive. However, you may want to be intentional about that.\
    \ You should also note that once a condition completes, the when statement is\
    \ blocked. This is different from some languages that require an explicit call\
    \ to exit a switch or use the break keyword in Java.\n\n# Branch Conditions Are\
    \ Just Expressions\n\nYou’ve already seen a few variations of different expressions\
    \ for branches. With a variable in the initial line of when, you can have partial\
    \ expressions for each branch. If you drop the variable on the initial line, you\
    \ can complete expressions for each branch."
