    Your results are not what you expected. You probably got a couple of errors like
    this:


    ```

    Error:(5, 44) Kotlin: The floating-point literal does not conform to the expected
    type Float

    Error:(9, 43) Kotlin: The floating-point literal does not conform to the expected
    type Float

    ```


    What in the world this mean? If you find the line (the first number in the parentheses)
    and the place on that (position 44), you''ll see that the error occurs:


    ```

    val brian = Person("Brian", "Truesby", 68.2, 33, true)

    ```


    You''re passing in a decimal for height—in this seems right. Here''s the constructor
    in Person:


    ```

    class Person(var firstName: String, var lastName: String,

    var height: Float, var age: Int, var hasPartner: Boolean) {

    ```


    So what gives? The problem is that Kotlin is not converting types. A few things
    are actually happening:


    +   1. You give Kotlin the value 68.2. Kotlin sees a decimal number and automatically
    uses the Double type. This is important! Anytime a decimal is not given an explicit
    type, Kotlin will use Double.

    2. The Double is passed into the Person constructor. However, Person is expecting
    a Float.

    3. Kotlin will not try to convert between these two types—even though, in this
    case, they are compatible! Instead, Kotlin insists on strong typing, and throws
    an error.


    # You Explicitly Tell Kotlin What Type to Use


    You have two ways to fix this. The easiest is to tell Kotlin that the value you''re
    passing in to be treated as a Float; you can do that by putting a F after the
    number:


    ```

    val brian = Person("Brian", "Truesby", 68.2F, 33, true)

    println(brian)

    ```


    ```

    // Create another person

    val rose = Person("Rose", "Busnell", 56.8F, 32, true)

    println(rose)

    ```


    In this case, you''re sending Person what it wants: a Float. That passes the type
    checking and things are OK again.'
