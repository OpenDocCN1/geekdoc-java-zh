  md: "# CHAPTER 4 INHERITANCE MATTERS\n\nThe issue is Kotlin's resistance to unexpected\
    \ null values. You might remember this was first mentioned in Chapter 3, in the\
    \ discussion of Any and the ? operator. Remember this declaration of the equals(x)\
    \ method?\n\n```\noverride fun equals(other: Any?): Boolean {\n```\n\nAny indicated\
    \ that any object was derived from Any (as a subclass) and, the trailing ? that\
    \ null values were also allowed. You could read this as \"accept a subclass of\
    \ Any or a null.\"\n\nYou want something similar here. You want to say, \"accept\
    \ an instance of Person or a null,\" which allows a partner (or not). So the ?\
    \ operator is answer:\n\n```\nvar partner: Person = null\n```\n\nThat one additional\
    \ ? tells Kotlin to allow null values, which is what is needed here. Listing 4.8\
    \ shows this change, along with a small update to the secondary constructor to\
    \ update _hasPartner to indicate that a Person instance passed in, the partner\
    \ being created does indeed have a partner.\n\n# LISTING 4.8: Person with a working\
    \ secondary constructor\n\n```\npackage org.wiley.kotlin.person\n\nclass Person(firstName:\
    \ String, lastName: String,\n    hasPartner: Boolean = false,\n    _height: Double\
    \ = 0.0, _age: Int = 0) {\n\nvar firstName: String = _firstName\nvar lastName:\
    \ String = _lastName\nvar height: Double = _height\nvar age: Int = _age\nvar hasPartner:\
    \ Boolean = _hasPartner\nvar partner: Person = null\n\nconstructor(firstName:\
    \ String, lastName: String,\n    partner: Person) {\n    this(firstName, lastName)\n\
    \    hasPartner = true\n    partner = _partner\n}\n\nfun fullName(): String {\n\
    \    return \"$firstName $lastName\"\n}\n\noverride fun toString(): String {\n\
    \    return fullName()\n}\n\noverride fun hashCode(): Int {\n    return (firstName.hashCode()\
    \ * 28) + (lastName.hashCode() * 31)\n}\n\noverride fun equals(other: Any?): Boolean\
    \ {\n```"
