- pgno: 92
  md: "There's an immediate problem here: the brian instance and second_brian report\
    \ as equals, but their hash codes don't match. And, potentially another surprise:\
    \ brian and copy_of_brian are equal and their hash codes match.\n\n# Default Hash\
    \ Codes Are Based on Memory Location\n\nThe issue is that, without you overriding\
    \ hashCode(), it's going to return an integer based on the memory location of\
    \ the object instance upon which it's called.\n\nPractically, that means that\
    \ two object instances with the same property values are not going to have the\
    \ same hash code, because those two object instances in different systems in your\
    \ memory. Memory's that brian and second_brian are returning different hash codes:\
    \ they are different pieces of memory, and therefore two different hash codes\
    \ (and therefore a problem).\n\nOn the other hand, if you have two variables referencing\
    \ the same object, you're going to get identical codes. In fact, you're not getting\
    \ two hash codes; you're getting the same hash code from the same object, but\
    \ you're just calling that method twice. That's why the hash codes for brian and\
    \ copy_of_brian are the same.\n\n> Don't get too hung up on how the default implementation\
    \ of hashCode() works. It's enough to know that it uses memory location, and that\
    \ you're going to need to override it anytime you override(x).\n\nSo there is\
    \ work to do. Instances that are the same (like brian and copy_of_brian) as well\
    \ as instances that report back as equals using equals(x) (like brian and second_brian)\
    \ should all return the same hash code.\n\n# Hash Codes to Come Up with Hash Codes\n\
    \nThat sounds confusing, but it's actually a good bit of advice: you can use objects\
    \ that have working hashCode() methods to build up your hash code. Take Person;\
    \ right now, the key properties that determine equality—are firstName and lastName.\
    \ If you're not sure why, take a look at how you override equals(x):\n\n```\n\
    override fun equals(other: Any?): Boolean {\n  if (other is Person) {\n    return\
    \ (firstName.equals(other.firstName)) &&\n           lastName.equals(other.lastName)\n\
    \  } else {\n    return false\n  }\n}\n```\n\nEquality is basically controlled\
    \ by those two properties; therefore, hashCode() should be as well. Better still,\
    \ since those properties are just Strings, you can rely on them having working\
    \ hashCode() methods, as that's the job of the Kotlin engine you're using."
  merge: -1
  img_proc: true
- pgno: 93
  md: "So you can use something like this:\n\n```\noverride fun hashCode(): Int {\n\
    \    return firstName.hashCode() + lastName.hashCode()\n}\n```\n\nThis code takes\
    \ the two unique property names and uses the sum of their hash codes to get a\
    \ unique value for the class instance overall. Compile and run your test program\
    \ and you get out-put similar to this:\n\n+   Brian hashcode: 680248194\nRose\
    \ hashcode: -1533460291\nSecond Brian hashcode: 680248194\nCopy of Brian hashcode:\
    \ 680248194\n\n> NOTE Can you think of any problems with this implementation,\
    \ aside from two people having the same first name and last name? There's a subtle\
    \ but important problem that you'll have to come back and fix later.\n\nNotice\
    \ that the two references to the same object instance and the instance with identical\
    \ values for first and last name all report the same hash code.\n\n> NOTE If you're\
    \ wondering about that negative hash code for the rose object, it means that the\
    \ two hash codes (from firstName and lastName) exceeded the upper limit of the\
    \ int class, and the value then wrapped around. This is unusual behavior that\
    \ you don't have to worry about too much for now.\n\nUnfortunately, you're not\
    \ quite done yet.\n\n# SEARCHING (AND OTHER THINGS) DEPEND ON USEFUL AND FAST\
    \ EQUALS(X) AND HASHCODE()\n\nA couple of issues are worth before moving on:\n\
    \n+   An object with the first name of another object's last name, and the last\
    \ name of that other object's first name, are going to return the same hash code.\
    \ That's bad.\nThe current implementation of equals(x) could be faster; and with\
    \ these methods, speed matters.\n\nThe first problem is not that hard to solve;\
    \ you're just going to have to get a little creative, and also learn a bit about\
    \ typical solutions to this sort of problem."
