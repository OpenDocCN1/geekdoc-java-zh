- pgno: 57
  md: 'In that situation, you really want your classes related to Person grouped together.
    You might also have some classes related to the customer, with their account information:
    username, password, email. These aren''t instances of Person, they''re (perhaps)
    instances of a User. You might even have a UserPreferences class at some point,
    letting you store that user''s information. So that might belong to a group of
    classes related to User.


    Kotlin—and many other languages—use the concept of packages to organize this organization.
    A package is just a logical grouping of classes, with a particular namespace:
    some way to prefix and identify classes as being related. You could have a package
    with Person, Mother, Father, and so forth, and a user package with User, UserPreferences,
    and the like.


    Naming your package is important, so have a few practices:


    +   Packages should begin with lowercase letters. Use person instead of Person.
    (Classes begin with capitals; packages with lowercase.)


    +   Start the package with a dot-separated name that identifies the organization,
    like org.wiley or com.myCodeShop.


    If you use other languages besides Kotlin, you might also want to add kotlin as
    part of the package name, to distinguish the package from other code (such as
    Java).


    Put all this together and separate the pieces with a dot delimiter (.). For this
    book, the package will usually be org.wiley.kotlin.[general category]. Person
    will be in org.wiley.kotlin.person and User will be in org.wiley.kotlin.user.


    > NOTE You don''t always have to have the last part of the package name (like
    person) match a class in that package (like Person). You might have an org.wiley.kotlin.sport
    package that has various sports-related classes like Football, Baseball, Hockey,
    and Volleyball, but not have an actual Sport class. It really depends on your
    own preferences and style.


