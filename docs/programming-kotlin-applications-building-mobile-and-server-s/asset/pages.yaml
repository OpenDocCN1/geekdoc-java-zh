- pgno: 177
  md: "# IF AND ELSE: THE GREAT DECISION POINT\n\n> NOTE Unfortunately control structures\
    \ are not particularly exciting. They’re important, though, so this chapter strikes\
    \ a balance: it moves through control structures as fast as possible, but is going\
    \ to try to unearth some detail you might normally miss or skip.\n\nThere’s nothing\
    \ particularly mystical or magical about it. It works just like you’d think. Listing\
    \ 7.1 shows a very simple (very simple) program that picks a random number and\
    \ lets you guess that number.\n\n# LISTING 7.1: A very basic usage of if and else\n\
    \n```\nimport kotlin.random.Random\n\nfun main() {\n    var theNumber = Random.nextInt(0,\
    \ 1000)\n    print(\"Guess your number: *\")\n    val guess = readLine()?.toInt()!!\n\
    \n    if (guess == theNumber) {\n        println(\"You got it!\")\n    } else\
    \ {\n        println(\"Sorry, you missed it.\")\n    }\n}\n\n```\n\nA number is\
    \ taken in readLine(), which actually will return a String. That String is converted\
    \ to an Int, with the randomly generated number in theNumber, and then it is used\
    \ to determine if there’s a match. If there is a match, a success message is printed.\
    \ If there’s not, the else control structure picks the flow and prints a consolation\
    \ method.\n\n# !! Non-Nullable Values\n\nA slight diversion is here to tell the\
    \ odd !! you may have noticed. If you looked the definition of readLine(), you’d\
    \ see it defaults to return T?. This returns a parameterized type (in typical\
    \ usage, T will be String), and the ? indicates that null can also be returned.\n\
    \nIf you remove the !! so your code looks like this and compile, you’ll get an\
    \ error:\n\n```\nprint(\"Guess your number: *\")\nval guess = readLine())\n\n\
    if (guess.toInt() == theNumber) {...}\n\n```"
