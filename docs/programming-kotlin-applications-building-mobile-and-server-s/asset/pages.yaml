  md: "So switch those up, as shown in Listing 5.9. You'll also find that this makes\
    \ the calling of the primary constructor from the secondary quite trivial.\n\n\
    # LISTING 5.9: Flipping constructors in Parent to function as they should\n\n\
    ```\npackage org.wiley.kotlin.person\nclass Parent(_firstName: String, lastName:\
    \ String,\n    _height: Double = 0.0, _age: Int = 0, children: Set<Person>) :\n\
