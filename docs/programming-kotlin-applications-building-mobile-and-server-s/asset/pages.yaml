- pgno: 178
  md: '# If and Else: The Great Decision Point | 149


    The error will indicate a problem with your toInt():


    ```

    Error:(15, 14) Kotlin: Only safe (?.) or non-null asserted (!!) calls are allowed

    on a nullable receiver of type String?

    ```


    The issue is that toInt() will error out if it gets a null value, as will method
    called on a null receiver. Kotlin recognizes that guess is null—because readLine()
    returns T—and so it throws an error.


    To avoid that, you need to ensure that guess is not null. There are many ways
    to do that, but one of the easiest is to use !!. That operator converts a null
    value into a non-null one, and if the input to it (in this case, readLine()) throws
    a NullPointerException.


    With addition, as originally showing in Listing 7.1, Kotlin sees there''s no way
    for guess to have a null value by the time toInt() is called. The compiler is
    happy, and the error goes away.


    > WARNING While adding !! was an easy solution, it''s also pretty brute force.
    Your program is going to exit abruptly with a stack trace in the event of a null
    entry. This works because it''s a trivial test project that''s already pretty
    basic, but would almost certainly be a poor idea in a production system or application.
    In those cases, you''d want to handle nulls gracefully and likely prompt users
    to re-enter their value. The easiest solution would be to return and end the program.


    # Control Structures Affect the Flow of Your Code


    if and its companion else are simple to use, but critical because they do something
    fundamental to your program: they affect the flow of execution. That''s why these
    constructs are control structures: they allow you to control the flow.


    Figure 7.1 shows the sort of thinking you''ll need to adapt as you begin to work
    more with control structures in this chapter and in your code.


    This initial example is pretty basic. Code begins to execute and when it hits
    the if, flow splits. Execution goes to either the path or the else path, as shown
    in Figure 7.2. Finally, both blocks end in the same place, and flow merges (just
    long enough to execute the program, in this case).


    Now this is pretty basic, and you probably didn''t need to get a pencil or marker
    to draw the flow. You can see it instantly.


    However, as your control structures get more complex, the more you use them, and
    the more you start to nest them, it becomes trickier to map control flow. Add
    to that many times you will then call methods within your if, when, else, for
    and while blocks, and it can be quite difficult to follow programming logic unless
    you take a little extra time.


    This is important, though. as you''ll see throughout this chapter, knowing exactly
    what''s going on in your code is the key to writing good code, and ensuring that
    flow goes exactly the way you want it to is key to writing great code.'
