    \ was of the two criteria for a sealed class.\n\nThe when expression uses criterion\
    \ 2, knowing that the options in a sealed class are fixed, and requires that every\
    \ one of those subclasses is represented. Right now, only the Add operation is\
    \ covered, leaving Subtract, Multiply, Divide, and Raise missing.\n\nThis is easy\
    \ enough to fix, and a solution is shown in Listing 9.25.\n\n# LISTING 9.25: Adding\
    \ additional sealed class subclasses to the expression\n\n```\npackage org.wiley.kotlin.math\n\
    \nimport kotlin.math.pow\n```"
