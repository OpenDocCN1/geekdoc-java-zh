  md: "```\nelse -> {\n  throw Exception(\"Unhandled Operation: ${operation}\")\n\
    }}\n```\n\nThis will still compile and work without any issue.\n\n# Widening Returns\
    \ in the Widest Type Returned\n\nNotice the case for handling Operation.Raise\
    \ in the execute() function of the Calculator class:\n\n```\nis Operation.Raise\
    \ -> (input.toFloat()).pow(operation.value.toFloat()).toInt()\n```\n\nWhen writing\
    \ this, it started out like:\n\n```\nis Operation.Raise -> input.toFloat().pow(operation.value.toFloat())\n\
    ```\n\nBut at the time of compilation, Kotlin threw an error. Because execute()\
    \ declared that it would return an Int (remember, this before the function was\
    \ converted to use = instead of {}, returnVal), this case was rejected. It returns\
    \ a Float, rather than an Int, and all the other cases returned Ints.\n\nNow,\
    \ change the code to:\n\n```\nis Operation.Raise -> input.toFloat().pow(operation.value.toFloat())\n\
    ```\n\nWithout execute() declaring that it returns an Int, no errors are generated\
    \ at compile time. But look at what we have happening now:\n\n```\nfun execute(input:\
    \ Int, operation: Operation) =\nwhen (operation) {\n  is Operation.Add -> input\
    \ + operation.value\n  is Operation.Subtract -> input - operation.value\n  is\
    \ Operation.Multiply -> input * operation.value\n  is Operation.Divide -> input\
    \ / operation.value\n  is Operation.Raise -> (input.toFloat()).pow(operation.value.toFloat)\n\
    \    .toInt()\n  else -> {\n    throw Exception(\"Unhandled Operation: ${operation}\"\
    )\n  }\n}\n```\n\nFor Operation.Add, Operation.Subtract, Operation.Multiply, and\
    \ Operation.Divide, the return value will be an Int, because an Int is passed\
    \ in input, and an operation.value will always be an Int. Operations on two Ints—even\
    \ with division—will return an Int.\n\n> WARNING Although this case is on type\
    \ inference in single-expression functions, don't let that sentence line slip\
    \ by you without some awareness. Kotlin will return an Int if you divide one Int\
    \ by another Int, which is frankly unintended and potentially problematic. If\
    \ you divide an int with a value of 5 by an int with 2, you will not get back\
    \ a Float or Double with the value of 2.5, but rather another Int, with the value\
    \ of 2. You get the quotient as the answer, with any remainder (decimal or otherwise)\
    \ ignored."
