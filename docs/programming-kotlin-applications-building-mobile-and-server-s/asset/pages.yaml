- pgno: 234
  md: "# Strings Are Terrible as Static Type Representations | 205\n\nSecond, there's\
    \ the code in the User class that actually reports whether a user is an admin\
    \ or not:\n\n```\nfun isAdmin(): Boolean {\n    return type.equals(\"Admin\")\n\
    }\n```\n\nOf course\n\n# Capitalization Creates Comparison Problems\n\nOne fix\
    \ is to take capitalization out of the picture. This change to isAdmin():\n\n\
    ```\nfun isAdmin(): Boolean {\n    return type.equals(\"Admin\", true)\n}\n```\n\
    \nThis variant of equals() provides an additional parameter to string comparisons:\
    \ ignoreCase. default is false, so \"Admin\" and \"ADMIN\" would not be considered\
    \ equal. With the ignoreCase parameter set to true, \"Admin\" and \"ADMIN\" (as\
    \ well as \"ADMIN\" and \"admin\") will report equal.\n\nNow you can rerun the\
    \ test class and you'll see that the bardia instance correctly reports as an admin:\n\
    \nYou are frothing with power!\n\nBefore you get too comfortable though, this\
    \ is still fragile. Seasoned developers know what comes next. Listing 9.3 adds\
    \ another intended admin to the test class and runs through all the instances\
    \ to check if they're admins.\n\nLISTING 9.3: An updated test class that checks\
    \ for admins\n\n```\nimport org.wiley.kotlin.user.User\n\nfun main() {\n    val\
    \ users = mutableListOf<User>()\n\nusers.add(User(\"bardia@gmail.com\", \"Bardia\"\
    , \"Dejban\", \"ADMIN\"))\nusers.add(User(\"shawn@gmail.com\", \"Shawn\", \"Khorrami\"\
    , \"Administrator\"))\n\n    for (user in users) {\n        if (user.isAdmin())\
    \ {\n            println(\"${user.firstName} $\\${user.lastName} is frothing with\
    \ power!\")\n        } else {\n            println(\"${user.firstName} $\\${user.lastName}\
    \ is still working at it...\")\n        }\n    }\n    maybe be one day!\")\n \
    \   }\n}\n```"
