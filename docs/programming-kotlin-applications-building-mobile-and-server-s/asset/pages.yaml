  img_proc: true
- pgno: 322
  md: "# apply Returns the Context Object, Not the Lambda Result\n\nAnother important\
    \ thing to note about apply is that the return from the function is the instance\
    \ operated upon—the context object. So, in this code, the context object is a\
    \ Person instance:\n\n```\n// Rewriting this code with apply\nval brian = Person(\"\
    Brian\", \"Truesby\").apply {\n    partner = Person(\"Rose\", \"Elizabeth\", age\
    \ = 34)\n    // For some reason, all we know that Brian is two years younger than\n\
    \    his partner\n    age = partner?.let { it.age - 2 } ?: 0\n    println(this)\n\
    \    println(partner)\n}\n```\n\nThat means that apply at the end holds the Person\
    \ instance created, with the updated values from within the lambda block.\n\n\
    In some ways, you can think of apply as an extended init block. If you need to\
    \ create a new instance of an object and configure that object, then that configuration\
    \ can be done within the instance, then init works fine. In this example, there's\
    \ data out of the b instance involved, such as the age of the partner, and some\
    \ printing wouldn't make sense to be common for all Person instances.\n\nAnytime\
    \ you have this sort of configuration or instance which is specific to an instance\
    \ or doesn't make to be part of an init block, apply is a great alternative solution.\n\
    \nAlso note this line:\n\n```\nprintln(this)\n```\n\nAlthough not common, you\
    \ certainly can use this reference to get out of the context object directly.\
    \ That's the need here, as println() would not assume this reference as an input\
    \ argument, so there's a need to explicitly pass this into the println() function.\n\
    \n# Kotlin's Elvis Operator\n\nThere's a slight detour from scope functions working.\
    \ This line of code could look like a bit odd to you:\n\n```\nage = partner?.let\
    \ { it.age - 2 } ?: 0\n```\n\nFirst, make sure understand the scope function pieces\
    \ of this. The line could be written explicitly with this reference:\n\n```\n\
    this.age = partner?.let { it.age - 2 } ?: 0\n```\n\nThe context object (brian,\
    \ an instance of Person) is getting a value for the age property. In this (somewhat\
    \ silly) example, the brian instance's age are set to be 2 less than the partner's\
    \ age."
