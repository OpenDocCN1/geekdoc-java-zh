  md: '# TCP


    Transmission Control Protocol is a communication protocol that reliably transmits
    data over the internet. It breaks up data into smaller packets, establishes a
    connection between devices, detects and corrects errors, and regulates data flow
    between devices to ensure that data is transmitted and received correctly, without
    errors or loss. It''s a postal service that guarantees that letters are sent and
    received correctly and can fix any mistakes during delivery.


    # HTTP


    HTTP (Hypertext Transfer Protocol) is the protocol used for transferring data
    over the World Wide Web. It allows your web browser to communicate with web servers
    and retrieve web pages, images, videos, and other resources. When you type a URL
    into your web browser, it sends an HTTP request to the web server asking for the
    resource you want to access.


    The server then responds with an HTTP response containing the requested resource
    or an error message if the resource cannot be found or any other error happens.
    HTTP is a client-server protocol that involves communication between a client
    (your web browser) and a server (the web server hosting the resource you want
    to access).


