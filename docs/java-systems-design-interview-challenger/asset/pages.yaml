  md: '# Reverse Proxy


    A reverse proxy is a server or software application that acts as an intermediary
    between clients and servers, accepting client requests and forwarding them to
    the appropriate backend servers. It operates on behalf of the server, meaning
    that the client is usually unaware of a reverse proxy.


    ![](img/8cfb2e60a6ee9a68840f8cedf2509d8e_77_0.png)


    Figure 9. Reverse Proxy


    Here''s how a reverse proxy works:


    **Client Request:** A client sends a request to access a resource, such as a web
    page, to the reverse proxy server.


    **Reverse Proxy Reception:** The reverse proxy server receives the client''s request.


    **Backend Server Selection:** The reverse proxy determines which backend server
    or servers should handle the request. This selection can be based on various factors
    such as load-balancing algorithms, server availability, or specific routing rules.'
  merge: -1
