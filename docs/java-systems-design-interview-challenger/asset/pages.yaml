    When you visit a website that uses HTTPS, your browser establishes a secure connection
    with the website’s server. This connection is encrypted, meaning that any data
    transmitted between the browser and the server is encoded in a way that only the
    intended recipient can understand it.


    The encryption is achieved using SSL (Secure Sockets Layer) or its successor TLS
    (Transport Layer Security) protocols. These protocols use cryptographic algorithms
    to encrypt the data and verify the identity of the website.


    Here’s a simplified explanation of how HTTPS works:


    +   Client Request: You type in a website’s address (e.g., https://www.example.com)
    in your browser.


    +   Server Response: Your browser sends a request to the server asking for the
    website’s content.


    +   SSL/TLS Handshake: The server responds by sending its SSL/TLS certificate,
    which contains a public key. Your browser uses this public key to initiate the
    handshake process.'
