  md: '200 - OK: This response code means that the request was successful and the
    server has returned the requested data.


    201 - Created: This response code means that the server has successfully created
    a new resource as a result of the request.


    202 - Accepted: This response code means that the request has been accepted for
    processing, but the processing has not yet been completed.


    204 - No Content: This response code means that the server has successfully processed
    the request, but there is no data to return to the client.


    301 - Moved Permanently: This response code means that the requested resource
    has been moved permanently to a new location, and the client should update its
    records accordingly.


    302 - Found: This response code means that the requested resource has been temporarily
    moved to a new location, and the client should use the new location for future
    requests.


    304 - Not Modified: This response code means that the requested resource has not
    been modified since the last time the client requested it, and the server is instructing
    the client to use its cached version of the resource.


    401 - Unauthorized: This response status code indicates that the requested resource
    is restricted and requires authentication. In other words, the server is telling
    the client that they need to provide valid credentials (such as username and password)
    in order to access the requested resource. This status code is often used for
    web pages that require users to log in before they can access the content. If
    the client does not provide valid credentials, the server will return a 401 Unauthorized
    status code, indicating that access is denied.


    403 - Forbidden: This response code means that the client does not have permission
    to access the requested resource.'
