  md: '# Do Interviews - Practice, Practice, Practice


    A best way to practice those interviews is by doing the interviews. Of course,
    it might be frustrating to practice that in a real interview because being rejected
    sucks. But we need to know how to deal with rejection and understand that there
    is always a reason.


    The problem is not to do the interview and be rejected, the problem is to not
    do the interview because of the fear of bein rejected. Doing the interview is
    an effective way learn how the game works in practice.


    We also have to remember that by doing those interviews and failing on them doesn''t
    mean we are bad developers. It means instead that we don''t know how the game
    for this interview works exactly. That''s why we need to study, practice until
    we pass on those interviews.'
