  md: '# 8 - Latency and Throughput


    Latency and throughput are crucial concepts for a Systems Design interview. Since
    building Microservices in the cloud is the new normal in the market, knowing basic
    network concepts make a big difference. We will often see those terms when designing
    a system in the cloud.


    Let''s explore those concepts further so you get sharp for the Systems Design
    interview and learn to build systems in the cloud more effectively.


    # Latency


    Latency is the time it takes for data to travel from one point to another in a
    system. We measure latency in nanoseconds (ns), microseconds (µs), milliseconds
    (ms), or seconds (s).


    Latency is significant because it affects the performance of a system. For example,
    if a website has high latency, it will take longer for users to load and interact
    with it.


    # What can affect latency?


    Several factors can affect latency, including:


    The distance between the two points: The further apart the two points are, the
    higher the latency will be. The type of network: A wired network typically has
    lower latency than a wireless network.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'The amount of traffic on the network: If there is a lot of traffic, latency
    will be higher. What can reduce latency? Latency can be reduced by using a wired
    network, reducing the distance between the two points, and using a network that
    is not congested.


    # Simulation of Latency Time for Data Reading


    Let''s roughly estimate the is the latency to transfer one megabyte of data:


    | Reading Data from | Time in Milliseconds |

    | SSD (solid-state drive) | 1 ms |

    | Via Network (If it''s in the same country or close enough) | 10 ms |

    | HDD (hard disk drive) | 20ms |

    | Via Network From Ireland to the US | 150ms |


    Notice that sending 1 MB via a network is faster than reading data from HDD. Also,
    sending data from one continent to the other is much slower. Your systems design
    decisions have to take that in consideration if your system needs fast response.


    For example, the latency from Ireland to the US is roughly 150 ms for each MB.
    This is relatively fast for a single packet of data. However, if you send a large
    file, the latency will increase, and the transfer will take longer.'
