  md: '# Databases


    A database system collects organized data stored and managed in a computer system.
    It is designed to efficiently store, retrieve, and manage large amounts of data
    and can be used by various applications and users.


    In a database, data is typically organized into tables of rows and columns. Each
    row represents a unique record, while each column represents a specific attribute
    or information about the record. The data is stored in a structured way, which
    makes it easy to search, sort, and analyze.


    Databases are used in various applications, including business, education, research,
    healthcare, and more. They are essential for managing and organizing large amounts
    of data and support many important functions, such as customer relationship management,
    inventory management, financial reporting, etc.


    RDBMS (Relational Database Management System) Relational databases such as Postgres,
    MySQL, and Oracle will have the data organized in tables that relate to each other
    using constraints. Those databases are highly reliable for consistency, meaning
    that you will always get the latest data, and it''s also possible to have high
    availability since those databases can be replicated in different nodes (cloud
    machines).


    # ACID Transactions


    ACID is a set of properties that ensure reliable and consistent database transactions.


    Atomicity: Transactions are treated as a single unit of work. Either all the changes
    in a transaction are applied, or none of them are. There are no partial or incomplete
    transactions. This is'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'very important for financial transactions. Suppose you need to withdraw money.
    Then the system checks if money is available and will give you the money. You
    won''t lose the money if any problem occurs during this transaction.


    Consistency: Transactions bring the database from one valid state to another.
    The data in the database follow predefined rules or constraints, ensuring it is
    always valid. An example is the foreign key, which ensures a register will be
    inserted in two tables about the primary key from another table. Therefore, the
    consistency principle won''t allow this process if we try to delete the register
    with the primary key.


    Isolation: Transactions are executed independently and do not interfere with each
    other. Even if multiple transactions happen simultaneously, each transaction is
    isolated and will be executed in order.


    Durability: Once a transaction is successfully committed, its changes are permanent
    and will survive future failures or system crashes. In other words, the data will
    persist in the disk and be available even if an outage happens.


    In simple terms, ACID ensures that transactions are treated as a whole, maintain
    data integrity, work independently, and are resilient to failures. These properties
    are important for reliable and consistent database operations.


    # NoSQL


    NoSQL stands for Not Only SQL, and nowadays, there are many famous of them. The
    great advantage of most NoSQL databases is that performance and amount of data
    are higher than relational databases. On the other hand, it''s not as good to
    have sophisticated table relationships or to be as consistent as a relational
    database.


    Here are some key principles and features of NoSQL databases:'
