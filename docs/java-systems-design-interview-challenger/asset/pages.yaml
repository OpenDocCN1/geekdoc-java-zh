  md: '# 16 - Periodic Pooling and Streaming


    We often use Periodic pooling and streaming in our day-to-day jobs, and it''s
    also crucial to know what those concepts are for Systems Design.


    In Jenkins, we often configure pooling to build our apps periodically. Kafka uses
    streaming by providing a distributed and fault-tolerant platform that allows applications
    to publish, subscribe, and process streams of records in real-time.


    # What is Periodic Pooling?


    Pooling, also known as polling, is a technique in software development where a
    client periodically checks a server or a data source for updates or changes. Here
    are some advantages of using polling in software development:


    **Simplicity**: Polling doesn''t require complex event-driven architectures or
    real-time streaming infrastructure. Polling can be easily implemented using standard
    HTTP requests or similar communication protocols.


    **Compatibility**: We use polling in various environments and technologies. It
    is compatible with most programming languages and frameworks. Additionally, it
    can work with various types of data sources, such as databases, APIs, or file
    systems.


    **Control over Request Frequency**: With Polling, you control the frequency of
    requests made to the server or data source. You can adjust the polling interval
    based on the specific requirements of'
  merge: -1
  pgno: 180
- img_proc: true
  md: '16 - Periodic Pooling and Streaming


    171


    your application. This flexibility allows you to balance the trade-off between
    real-time updates and the load on the server.


    **Support for Non-Real-Time Updates:** Polling suits scenarios where real-time
    updates are not critical. If the data or information you are retrieving doesn''t
    need to be immediately up-to-date, polling can be an effective solution. It allows
    you to retrieve updates at a reasonable interval without the need for continuous
    streaming or event-driven architectures.


    **Lower Complexity on the Server-Side:** Polling puts less burden on the server
    or data source than real-time streaming or event-driven systems. The server only
    needs to respond to requests polled by the client rather than maintaining persistent
    connections or handling continuous data streams.


    **Compatibility with Caching:** The client can cache the response received from
    the server during a polling request and use it for subsequent requests until new
    data is available. Caching can reduce server load and improve performance by serving
    responses from the cache instead of making frequent requests.


    It''s important to note that polling also has some limitations. It can introduce
    latency as the client needs to wait for the next polling interval to receive updates.
    It can also result in unnecessary network traffic if updates are infrequent or
    the client polls frequently. In scenarios where real-time updates are critical,
    or network work efficiency is a concern, alternative approaches like streaming
    or event-driven architectures may be appropriate.


    In general, polling can be a simple and effective solution for scenarios where
    real-time updates are not required, and periodic checks for updates are sufficient.'
