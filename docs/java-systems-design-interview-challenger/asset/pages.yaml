  md: '# What is HTTP?


    HTTP, or Hypertext Transfer Protocol, is the protocol used for transferring data
    over the internet. It defines how information is formatted and transmitted between
    web servers and web browsers, allowing for the retrieval and display of web pages
    and other online resources. HTTP can be seen as a common language or pattern that
    computers will understand each other in a network.


    When you type a URL into your web browser, the browser sends an HTTP request to
    the web server hosting the website. The server responds with an HTTP response,
    which contains the requested resource, such as an HTML document or image file.


    HTTP is a stateless protocol, which means that it doesn''t keep track of previous
    requests or responses. This makes it efficient for transferring small amounts
    of data, but it can become slow and inefficient for larger data transfers.


    HTTP is the foundation of the World Wide Web and is used by millions of websites
    and web applications every day.


    # What Applications use the Client-server Model?


    The client-server model is a widely used architecture for designing and implementing
    networked applications, and it is used in a wide range of applications across
    different industries. Here are some examples of applications that use the client-server
    model:


    **Web browsers and web servers:** When you browse the internet, your web browser
    acts as a client, sending requests to web servers to retrieve web pages and other
    resources. The web servers then respond with the requested content, which is displayed
    in your browser.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '3 - Client Server Model


    34


    **Email clients and SMTP servers:** Email clients such as Microsoft Outlook and
    Apple Mail use the Simple Mail Transfer Protocol (SMTP) to send and receive email
    messages. The email client acts as the client, and the SMTP server acts as the
    server.


    **File transfer applications:** Applications such as FTP (File Transfer Protocol)
    and SFTP (Secure File Transfer Protocol) use the client-server model to transfer
    files between computers.


    **Database applications:** Database management systems (DBMS) use the client-server
    model to allow multiple users to access and manipulate a database simultaneously.
    The DBMS acts as the server, and the client applications send requests to the
    server to retrieve or modify data.


    **Online games:** Many online games use the client-server model to manage the
    game state and enable players to interact with each other in real-time.


    These are just a few examples of the many applications that use the client-server
    model.


    # # Summary


    The client-server model is present everywhere on systems. Understanding the fundamentals
    of this model is crucial for a systems design interview. The vast majority of
    the systems you will design in such interview will have the client-server model.
    Sometimes the interviewer will ask you about IP, DNS, HTTP. That''s why it''s
    fundamental to understand those concepts.'
