  md: '# 22 - Security with HTTPS


    Security is not asked much in Systems Design interviews, but we need to know the
    difference between HTTP and HTTPS to avoid common hack attacks.


    This article won''t go deep into security because it''s a vast topic. However,
    as software engineers, we need to know the basics of security to prevent systems
    from being hacked because of a basic mistake.


    Therefore, let''s explore the essence of HTTP and HTTPS to know why they''re important
    and why we should use HTTPS instead of HTTP.


    # The Problem with HTTP


    HTTP (Hypertext Transfer Protocol) is the foundation of communication on the World
    Wide Web. While HTTP has been widely successful in enabling the exchange of information
    between clients (such as web browsers) and servers, it does have a few limitations
    and shortcomings:


    **Lack of security:** HTTP is inherently insecure because it does not encrypt
    the transmitted data. That''s because any information sent over HTTP, including
    sensitive data like passwords or credit card details, can be intercepted and read
    by malicious actors. HTTPS (HTTP Secure) addresses this issue by adding a layer
    of encryption using SSL/TLS protocols.


    **Lack of state:** HTTP is a stateless protocol, which means that each request
    from a client to a server is independent and does not carry any context or memory
    of previous requests. This poses challenges'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'when building web applications that require maintaining session information
    or user authentication across multiple requests. Developers often use techniques
    like cookies or server-side sessions to work around this limitation.


    **Performance overhead:** HTTP relies on a request-response model, where each
    client request results in a separate response from the server. This introduces
    overhead over the repeated establishment and termination of connections. Additionally,
    the text-based nature of HTTP messages can lead to larger payload sizes, which
    can impact performance, especially on low-bandwidth or high-latency networks.


    **Limited flexibility:** HTTP has a fixed set of methods (GET, POST, PUT, DELETE,
    etc.) that define the operations that can be performed on resources. While these
    methods cover many common use cases, they might be insufficient for more complex
    interactions or custom requirements. This limitation has led to the development
    of additional protocols, such as WebDAV and RESTful APIs, to extend the capabilities
    of HTTP.


    **Lack of real-time communication:** HTTP is primarily designed for request-response
    communication, which makes it less suitable for real-time or bidirectional communication
    scenarios, such as instant messaging or live streaming. To address this, alternative
    protocols like WebSockets or technologies like Server-Sent Events (SSE) have been
    introduced to enable real-time communication over HTTP.


    It’s worth noting that while HTTP has its limitations, it has been the foundation
    of the modern web and has undergone significant improvements over the years. Many
    of these limitations have been addressed through various extensions, protocols,
    and best practices, making HTTP a widely adopted and reliable protocol for web
    communication.'
