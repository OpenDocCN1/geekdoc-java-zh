  md: 'Preface


    3


    our profession make more than others we will learn our whole life. We must see
    that as a good thing because if we are learning something new it means we are
    alive. If we stop learning we are dying, there is nothing else to do in life.


    Keep this mantra, Never Stop Learning.


    # Scope and Limitations


    We will explore the most important fundamentals of Systems Design. We will see:


    +   * Concepts and technologies to make services communicate with the client

    * Technologies to make Microservices scalable

    * Manipulating data in the database

    * Ways to debug and monitor cloud services

    * How to make Microservices resilient to failure

    * How to make Microservices performant

    * How to make data transferring fast for special cases

    * How to make Microservices more secure

    * Techniques and technologies to handle Big Data


    Notice that it''s impossible to explain all of those topics in dept in just one
    book. For most of those technologies andconcepts would be able to create a whole
    book.


    However, remember that it''s impossible to know all of those technologies in depth,
    we just need to know approximately 20% so we can solve 80% of the problems. Don''t
    think you must know all of those technologies because that will never happen.


    We must keep in mind that it''s useless to know all of those technologies in depth,
    instead, we must know enough of them so we can solve important problems, so we
