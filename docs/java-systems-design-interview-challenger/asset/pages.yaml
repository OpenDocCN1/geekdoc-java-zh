  md: '# Recap of Key Concepts


    In this book we explored the main concepts of Systems Design so we are able to
    design a Systems on the spot. Now, let''s recap the main concepts we explored:


    +   - Fundamentals of Availability: The principles and practices that ensure a
    system or service is consistently accessible and operational for users.

    - Client-Server Model: A computing architecture where a client device requests
    services or resources from a server, which provides the requested functionality
    or data.

    - Protocols: Rules and conventions that govern communication between different
    systems, specifying how data is transmitted, received, and interpreted.

    - Effective API Design: Designing application programming interfaces (APIs) that
    are intuitive, efficient, and easy to use, promoting developer productivity and
    enabling seamless integration between software components.

    - Storage Databases: Systems that organize and store structured data, providing
    efficient data retrieval, storage, and management capabilities.

    - Proxy: An intermediary server that acts as a gateway between clients and other
    servers, facilitating various functions such as caching, load balancing, and security.

    - Latency and throughput: Latency refers to the delay between a request and a
    response, while throughput measures the amount of data processed within a given
    time period.

    - Load Balancer: A device or software that distributes network traffic across
    multiple servers or resources, optimizing resource utilization and enhancing system
    scalability and availability.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Recap of Key Concepts


    +   * Hashing: The process of converting data into a fixed-length value or key
    using a hashing algorithm, commonly used for data indexing, lookup, and ensuring
    data integrity.

    * Cache: A high-speed storage component that stores frequently accessed data,
    reducing the need to fetch data from slower storage systems and improving system
    performance.

    * Specific Storage: Tailored storage solutions designed to meet specific requirements,
    such as specialized databases for handling specific data types or use cases.

    * Database Replica and Sharding: Replication involves creating multiple copies
    of a database for redundancy and fault tolerance, while sharding involves partitioning
    a database into smaller, more manageable pieces to distribute the workload.

    * Leader election: The process by which a distributed system selects a leader
    or coordinator node to provide centralized control and coordination among the
    participating nodes.

    * Peer-to-peer: A decentralized network architecture where participating nodes
    or devices interact directly with each other, sharing resources and responsibilities
    without the need for a central server.

    * Periodic Polling and Streaming: Mechanisms for data retrieval in which periodic
    polling involves regularly querying a data source for updates, while streaming
    involves continuous data delivery in real-time.

    * Static and Dynamic Configuration: Static configuration predefined settings that
    remain unchanged until modified, while dynamic configuration allows for runtime
    modifications and adjustments to system behavior.

    * Rate Limiting: Imposing restrictions on the number of requests or data transmitted
    within a specific timeframe to prevent abuse, ensure fair resource allocation,
    and maintain system stability.

    * Logging and Monitoring: Practices for recording and analyzing system events,
    errors, and performance metrics to diagnose issues, track system health, and support
    troubleshooting.'
  merge: -1
  pgno: 282
