  md: '# Components You Should Know for a Systems Design Interview


    To create performant, scalable, resilient cloud systems, you need to know about
    the basic components. You might be asked about those components during the interview.
    You need to at the very least know what components do. Let''s see some examples:


    **Load balancer**: helps distribute network traffic across multiple servers to
    prevent overloading and improve performance. It works as a mediator between the
    client and server, ensuring requests are evenly distributed. Load balancers detect
    server failures and redirect traffic to healthy servers. They''re commonly used
    in web applications and distributed systems to optimize resource utilization and
    improve availability.


    **Proxy**: is a server or software that acts as an intermediary between a client
    and a server. It receives requests from clients and forwards them to the server,
    sends the response back to the client. Proxies can be used to filter requests,
    cache responses, or provide anonymity for clients. They''re commonly used in web
    applications to improve performance, security, and privacy.


    **Cache**: is a temporary storage location that stores frequently accessed data
    to reduce the time it takes to access it. It serves as a quick lookup for commonly
    used data, so that it doesn''t have to be fetched from the original source every
    time it''s requested. Caches can be found in various forms such as web browser
    caches, CPU caches, and disk-based caches. They''re commonly used to improve performance
    and reduce latency in computer systems.


    **Rate limiting**: is a technique used to control the rate of traffic sent or
    received by a network or an application. It sets a limit on the number of requests
    that can be made within a certain time frame to prevent overloading and ensure
    stable performance. Rate limiting can be used to prevent abuse, protect against
    attacks, and optimize'
  merge: -1
  pgno: 21
- img_proc: true
  md: '1 - Introduction


    12


    resource utilization. It’s commonly used in web applications, APIs, and network
    devices.


    **Leader election:** is a process used in distributed systems to select a leader
    from a group of nodes. The leader is responsible for making decisions and coordinating
    actions among the nodes. If the leader fails or goes offline, the other nodes
    can initiate a new leader election to select a new leader. Leader election is
    commonly used in systems like Apache Zookeeper and etcd to ensure that a single
    node is responsible for managing the system at any given time.


