    The hash value is then mapped onto the ring. Starting from that point, you move
    clockwise on the ring until you find the nearest server or the next available
    server point.


    This server is responsible for handling the request. So, requests with similar
    hash values will be directed to the same or nearby servers.


    The key idea behind consistent hashing is that when a server is added or removed,
    only a small portion of the keys or requests need to be remapped. This minimizes
    the disruption to the overall system. With regular hashing, adding or removing
