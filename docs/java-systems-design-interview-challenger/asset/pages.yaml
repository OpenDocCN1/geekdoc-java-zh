  md: '# 7 - Proxy


    We must know what a proxy is to design cloud systems and pass in the systems design
    interview. Proxy is powerful and useful to create an intermediary between the
    client and the server.


    Let''s see what types of proxies we have, how they can be helpful, and the technologies
    we can use.


    Forward Proxy The forward proxy is an intermediary server between the client and
    the server. We will usually use a forward proxy to hide the IP for the client.
    Also, remember that a forward proxy will serve the client, not the server.


    ![](img/8cfb2e60a6ee9a68840f8cedf2509d8e_75_0.png)


    Let''s see in detail how a forward proxy works:


    **Client Request:** A client sends a request to access a resource, such as a website,
    to the forward proxy server.


    **Forward Proxy Reception:** The forward proxy server receives the client''s request.


    **Target Server Connection:** The forward proxy server establishes a connection
    with the target server on behalf of the client.


    **Forwarding the Request:** The forward proxy server forwards the client''s request
    to the target server. Target Server Response: The target server processes the
    request and generates a response.'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Forward Proxy Response: The forward proxy server receives the response from
    the target server.


    Response Delivery to Client: The forward proxy server sends the response back
    to the client that originally made the request. By using a forward proxy, clients
    direct their requests to the proxy server instead of directly communicating with
    external servers. This provides several benefits:


    Privacy and Anonymity: The forward proxy server masks the client''s IP address,
    enhancing privacy and providing a level of anonymity.


    Content Filtering: The forward proxy server can be configured to filter and control
    access to specific websites or types of content based on predefined rules or policies.


    Caching: The forward proxy server can cache frequently requested resources, reducing
    bandwidth usage and improving response times for subsequent requests.


    Bandwidth Control: The forward proxy server can apply bandwidth control measures,
    limiting the data clients can receive or send.


    Security: The forward proxy server can act as a firewall, inspecting incoming
    and outgoing traffic and providing an additional layer of security by blocking
    malicious or unauthorized requests.


    Forward proxies are commonly used in corporate networks, educational institutions,
    and organizations to control internet access, enforce security policies, and optimize
    network usage. They allow clients to access external resources indirectly through
    the proxy server, providing various functionalities and controls in the process.'
