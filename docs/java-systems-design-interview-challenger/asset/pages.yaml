    # Tracking Access Frequency: LFU maintains a frequency count for each item in
    the cache. An item''s access frequency count is incremented whenever accessed
    or requested.


    Eviction Decision: When the cache reaches its capacity limit and a new item is
    inserted, LFU examines the access frequency counts of the items in the cache.
    It identifies the item with the least access frequency or the lowest count.


    Eviction of Least Frequently Used Item: The item with the lowest frequency count
    is evicted from the cache to make room for the new item. If multiple items have
    the same lowest count, LFU may use additional criteria, such as the time of insertion,
    to break ties and choose the item to evict.


    Updating Access Frequency: After the eviction, LFU updates the access frequency
    count of the newly inserted item to indicate that it has been accessed once.


    LFU is based on the assumption that items that have been accessed frequently are
    likely to be popular and will continue to be accessed in the future. By evicting
    the least frequently used items in the cache, LFU aims to prioritize keeping the
    more frequently accessed items in the cache, thus maximizing hit rates and improving
    overall performance.


