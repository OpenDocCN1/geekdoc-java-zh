  md: '**Latency:** refers to the time delay between when an action is performed and
    when it is actually executed or completed. It can be caused by various factors
    such as slow internet connection or processing time of a device. For example,
    when you click on a link on a website, it may take a few seconds for the page
    to load because of latency. In general, lower latency means faster response times,
    while higher latency means slower response times.


    **Throughput:** refers to the amount of data that can be transferred over a network
    or processed by a device in a given amount of time. It is often measured in bits
    or bytes per second.


    Higher throughput means that more data can be transferred or processed in a shorter
    amount of time, which can result in faster performance.


    For example, with low latency and high internet speed the higher network throughput
    means that files can be downloaded or uploaded faster. While a higher processing
    throughput means that a computer can perform more tasks in a given time period.


    **Redundancy:** means having backup systems or components to ensure that if one
    fails, another can take over. It''s done to increase reliability and minimize
    downtime. For example, in a hard drive, data may be stored in multiple locations.
    In a network, redundant systems are set up so that if one fails, another can take
    over its tasks.


    **Consistency:** means maintaining a uniform behavior or performance over time.
    It involves following a set standard or pattern. It can be seen in data accuracy
    across multiple systems, quality and performance standards in products, and a
    consistent tone in communication. Consistency establishes trust and reliability
    in a product, system, or service.'
