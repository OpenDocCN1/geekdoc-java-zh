  md: '# What is IP?


    IP (Internet Protocol) is the address of a computer on the internet. Each device
    has its own unique IP or address so it''s possible to exchange data on the internet.


    There are two versions of the IP protocol currently in use: IPv4 and IPv6. IPv4
    is the older version and uses a 32-bit address format, while IPv6 is the newer
    version and uses a 128-bit address format. IPv6 was developed to provide a larger
    address space to accommodate the growing number of devices connected to the internet.


    You can test IP addresses using a tool called “netcat”. To use netcat, you can
    run the command on the terminal:


    ```

    nc -l 8081

    ```


    Then use the following command in another terminal to connect to the IP address
    and port:


    ```

    nc 127.0.0.1 8081

    ```


    # What is a port?


    A port is a communication endpoint that allows different processes or services
    running on a device to send and receive data over a network. Ports are identified
    by a number between 0 and 65535 and are used to differentiate between different
    types of network traffic.


    Each port is associated with a specific process or service, and when data is sent
    to a device, the receiving device uses the port number'
