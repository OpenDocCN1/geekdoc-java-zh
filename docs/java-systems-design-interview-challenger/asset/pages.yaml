  md: '# 15 Peer-to-peer


    A peer-to-peer network will help a file be downloaded by multiple machines much
    faster, so P2P is a crucial concept to consider for Systems Design and Systems
    Design interviews.


    A peer-to-peer (P2P) network is a computer network where all the connected devices,
    share resources directly without needing a central server. In a P2P network, each
    device acts as a client and a server, meaning it can request and provide resources
    simultaneously.


    Think of it like a group of friends sitting in a circle, where everyone can share
    things directly. Instead of going through a central authority or relying on a
    single person to distribute resources, each friend can share their resources and
    access resources from others in the group.


    For example, in a file-sharing P2P network, if you have a file that someone else
    wants, they can download it directly from your computer, and vice versa. This
    direct sharing of resources among peers allows for decentralized and distributed
    file sharing, communication, or any other type of collaboration within the network.


    We often use P2P networks for applications like file sharing (e.g., BitTorrent),
    decentralized cryptocurrencies (e.g., Bitcoin), torrent downloads, and communication
    platforms (e.g., Zoom). They offer advantages such as increased scalability, fault
    tolerance, and the ability to operate without relying on a single point of failure.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# What is the problem Peer-To-Peer Networks Solve?


    If 10 machines download 100MB from one machine with an upload speed of 10 Mbps,
    and each machine has an internet speed of 100 Mbps with no latency, we can calculate
    the time it would take for all the machines to complete the download.


    First, let''s convert the file size and network speeds to the same units:


    100MB = 800 Mb (1 byte = 8 bits) 10 Mbps = 10 Mb/s (megabits per second) 100 Mbps
    = 100 Mb/s (megabits per second)


    To calculate the time required for a single machine to download the file: Time
    = File Size / Download Speed Time = 800 Mb / 100 Mb/s Time = 8 seconds


    Since there are 10 machines, and each machine takes 8 seconds to download the
    file, we can calculate the total time required for all machines to finish downloading:


    Total Time = Time per Machine * Number of Machines Total Time = 8 seconds * 10
    Total Time = 80 seconds


    Therefore, it would take a total of 80 seconds for all 10 machines to download
    100MB from the machine with an upload speed of 10 Mbps, assuming no latency or
    network bottlenecks.'
  merge: -1
