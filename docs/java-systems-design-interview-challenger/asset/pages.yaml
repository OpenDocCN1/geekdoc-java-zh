  md: '# Preface


    The Systems Design interview is a difficult one. You need the knowledge and the
    strategy. You need to know how to handle it. Otherwise, the chances to pass in
    such an interview are very low. Even if you are knowledgeble.


    Understanding the fundamentals of a cloud system is a great step to be better
    equipped for the interview. That''s what we will see in this book, also, we will
    explore strategies to pass in this interview more easily.


    # Motivation


    The Systems Design interview is very popular nowadays. This happened because the
    big companies are doing that with candidates and as it commonly happens, all the
    other companies are doing the same for interviews.


    Therefore, studying Systems Design makes you a better software engineer and also
    prepares you for a job interview.


    Another motivation to write this book is to show you that failing in this interview
    doesn''t mean we are bad software engineers. It means we don''t know how the game
    is played and to beat any game, we need to know the rules.


    In this book I will show you the rules of the game and also the fundamental knowledge
    you need to be able to learn technologies much faster. To be a fast learner in
    the area of software development is crucial because new technologies are launched
    every day.


    Since our brains have many neuroconnections when we have the basic knowledge of
    any subject, our brains make the connection'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Preface


    2


    much faster. That''s why mastering the fundamentals is powerful. We make the connections
    very fast because all technologies are actually based on fundamentals.


    # Objectives


    The main objective of this book is to give you a solid foundational knowledge
    about Systems Design so you can learn any new technology.


    Programmers are not what the market wants anymore. Nowadays, companies are looking
    for software engineers, this means, a developer who can analyze a problem and
    come up with effective solutions.


    The ability of articulating a solution, creating great quality code, talking to
    coworkers, preparing documentation with architecture solutions, designing database,
    create perform and scalable systems are the skills companies are looking for.


    Some years ago, knowing a Java framework was enough for the market but the scenario
    has changed. That''s why the most powerful skill any software engineer can have
    is the ability to learn, the ability to be a software engineer.


    If you study a little bit of the life of one of the greatest engineers on history,
    Leonardo da Vinci, you will realize that one of his most powerful traits was his
    curiosity. He was curious on understanding even when you yawn when we are sleepy.


    As Da Vinci, we need to have a similar mindset, we need to be curious about technologies
    and at the same time focused. Because we don''t really have time to learn random
    things, we want to spend quality time with our families and deliver high-quality
    work.


    Therefore, keep that in mind, be curious to learn, never think you know everything
    that will never happen. We have to accept that in'
