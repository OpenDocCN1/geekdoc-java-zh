  md: '# Passive redundancy


    Imagine you are a student who needs to submit a very important assignment online.
    The submission system is crucial for you to complete your task successfully. In
    this case, passive redundancy is like having a backup plan to ensure that your
    assignment gets submitted even if something goes wrong with the primary submission
    system.


    Here''s how it works:


    Primary Submission System: The primary submission system is the main system you
    use to submit your assignment. It''s the system you rely on and interact with
    initially.


    **Backup Submission System**: The backup submission system is like a spare or
    backup option that is ready to take over if the primary system fails or has a
    problem. It''s not actively processing submissions, but it''s there for standby.


    **Standby Mode**: The backup submission system is in a standby mode, patiently
    waiting for any issues to occur with the primary system. It''s not actively processing
    submissions or doing anything until it''s needed.


    **Failover Process**: If the primary submission system encounters a problem or
    fails, a failover process is triggered. This process involves activating the backup
    system and diverting your assignment to it.


    **Continued Service**: Once the failover process is completed, the backup submission
    system takes over seamlessly, allowing you to submit your assignment without any
    disruption. From your perspective as a student, it appears as if nothing went
    wrong, and your assignment gets successfully submitted.


    **Recovery Time**: In case of a failure or problem with the primary system, the
    recovery time is the time it takes for the backup system to become active and
    start accepting submissions. During this time,'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'you may experience a brief delay or interruption, but the backup system ensures
    that the service is restored as quickly as possible.


    # Active Redundancy


    Imagine that you have an assignment submission system that utilizes active redundancy
    to ensure a smooth and uninterrupted submission process. Here''s how it works:


    **Active Components:** In active redundancy, there are multiple active components
    or systems working simultaneously to handle the assignment submissions. These
    components are actively processing and delivering services concurrently.


    **Load Balancing:** The active components distribute the workload evenly among
    themselves through load balancing. This ensures that each component shares the
    processing load and can handle a portion of the submissions efficiently.


    **Seamless Failover:** If one of the active components fails or experiences an
    issue, the workload is automatically shifted to the remaining active components
    without any interruption or impact on the submission process. The failover process
    is seamless and transparent to you as a student.


    **High Availability:** With active redundancy, the submission system maintains
    high availability, meaning it remains operational and accessible even if one or
    more active components encounter problems. The remaining active components continue
    to process submissions, ensuring that the service remains uninterrupted.


    **Increased Performance:** Active redundancy can also improve the performance
    of the system. By distributing the workload among multiple active components,
    the overall processing capacity and throughput are increased. This allows for
    faster and more efficient handling of assignment submissions.'
  merge: -1
