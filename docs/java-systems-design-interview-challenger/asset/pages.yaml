  md: '# 4 - Protocols


    A protocol is a way for computers to communicate. An analogy to that could be
    the language we use to communicate with each other. A computer will understand
    only a set of pre-defined protocols.


    There are many network protocols. Let''s see the most important ones in depth
    and the others that could be crucial to develop systems. We will explore it in
    a more shallow way.


    # IP - Internet protocol


    IP stands for Internet Protocol. It''s a set of rules that govern data is transmitted
    over the internet. Every device connecting to the internet has an IP address,
    a unique numerical identifier assigned to it. This address allows data to be sent
    over the internet from one device to another.


    We represent IP addresses in either IPv4 or IPv6 format. IPv4 addresses consist
    of four numbers separated by periods, while IPv6 addresses are more extended and
    use hexadecimal notation.


    The IP protocol also governs how data is broken up into packets, how packets are
    addressed and routed, and how they are reassembled into the original data at their
    destination. All internet communication, including email, web browsing, and file
    transfers, rely on the IP protocol.'
  merge: -1
