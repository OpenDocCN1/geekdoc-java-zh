  md: '# 19 - Logging and Monitoring


    Logging and monitoring were important with monoliths, but they’re far more critical
    with Microservices. That’s because debugging with Microservices is difficult since
    they are deployed independently.


    With a robust tool for logging and monitoring, we can quickly know what happened
    by checking what occurred with a specific user. Also, we can measure metrics from
    services such as latency, errors, performance, etc.


    # Logging


    Logging is the process of recording events or messages that happen when a software
    application or system is running. It’s crucial because it helps developers and
    administrators understand how the application behaves, find and fix issues or
    errors, and learn about system performance and usage.


    For example, if a user purchased a product but didn’t receive the product, how
    could we figure this out without logs? By logging in the system, we can quickly
    check the time the customer purchased the product to see if the purchase was executed,
    and then we can deliver the product.


    Another scenario is that a bug might appear in one cloud service for unknown reasons.
    The quickest action we can take to troubleshoot this issue is to check the logs.
    Sometimes, we can discover the problem immediately by looking at the logs.'
