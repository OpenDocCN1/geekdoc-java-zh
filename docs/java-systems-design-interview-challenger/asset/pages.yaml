    Here’s how it works:


    Instead of dividing the servers into fixed ranges like in regular hashing, consistent
    hashing uses a circular ring-like structure. Each server is represented by a point
    on the ring. These points are distributed evenly around the ring.


    When a request comes in, a hash function is used to calculate a hash value for
