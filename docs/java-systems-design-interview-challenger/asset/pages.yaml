  md: '# Types of Peer-to-Peer Network


    Peer-to-peer (P2P) networks are a type of distributed network architecture where
    participants in the network, called peers, can directly communicate and share
    resources without needing a centralized server. There are several types of P2P
    networks, including:


    **Pure P2P Network:** In a pure P2P network, all peers have equal capabilities
    and can act as clients and servers. Each peer can initiate and respond to requests
    for resources or services from other peers, and no central authority or server
    is controlling the network.


    **Hybrid P2P Network:** A hybrid P2P network combines elements of both P2P and
    client-server architectures. It usually includes a central server or a set of
    super-peers that provide indexing, discovery, or coordination services to facilitate
    the functioning of the network. Peers in the network can still communicate directly
    with each other. Still, the central server or super-peers help with tasks such
    as peer discovery, resource indexing, or maintaining network stability.


    **Structured P2P Network:** In a structured P2P network, peers organize themselves
    into a specific structure or overlay network. This enables efficient resource
    discovery and routing by maintaining consistent lookup tables or distributed hash
    tables (DHTs). Examples of structured P2P networks include Chord, CAN (Content-Addressable
    Network), and Pastry.


    **Unstructured P2P Network:** In an unstructured P2P network, there is no specific
    organization or structure among the peers. Peers connect randomly or through some
    form of hoc communication, and resource discovery relies on flooding or random-walk-based
    search algorithms. Examples of unstructured P2P networks include Gnutella and
    Freetet.


    **Overlay P2P Network:** An overlay P2P network is built on top of an existing
    network infrastructure, such as the Internet. It uses'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'the underlying network''s communication capabilities to establish connections
    between peers. The overlay network provides an additional layer of abstraction
    and enables peers to discover and communicate with each other. Examples of overlay
    P2P networks include BitTorrent and Skype.


    These are some common types of P2P networks, each with its own advantages and
    use cases. The choice of network type depends on scalability, efficiency, resource
    requirements, and the specific application or use-case requirements.


    # Technologies that Use Peer-to-peer


    Software engineers have several technologies and frameworks at their disposal
    to implement peer-to-peer (P2P) networks. Here are a few commonly used:


    **Libp2p**: Libp2p is a modular networking stack designed specifically for P2P
    applications. It provides a set of protocols, libraries, and tools that enable
    developers to build decentralized and distributed systems. Libp2p supports various
    transport protocols, peer discovery mechanisms, and secure communication channels.


    **Uber Kraken**: Kraken is a P2P-powered Docker registry that focuses on scalability
    and availability. It is designed for Docker image management, replication, and
    distribution in a hybrid cloud environment. With pluggable backend support, Kraken
    can easily integrate into existing Docker registry setups as the distribution
    layer.


    Kraken has been in production at Uber since early 2018. In our busiest cluster,
    Kraken distributes more than 1 million blobs per day, including 100k 1G+ blobs.
    Kraken distributes 20K 100MB-1G blobs at its peak production load in under 30
    sec.'
