    data.


    With relational databases, it''s only possible to scale vertically, making one
    machine where the database is running more powerful and performant. This is expensive,
    though.


    Using NoSQL databases and cloud technologies makes it possible to scale vertically,
    which is cheaper. Data will be synchronized between all machines, and data will
    be processed in parallel. With modern cloud technologies, this is possible to
    accomplish.


    The CAP theorem is a graphic that demonstrates what we want to prioritize for
    your database. We can choose two of the characteristics between consistency, availability,
    and partition tolerance.'
