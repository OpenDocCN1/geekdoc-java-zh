  md: '# FIFO Cache


    FIFO (First In, First Out) cache is a cache eviction policy that removes the oldest
    inserted item from the cache when it reaches capacity limit. In other words, the
    item in the cache for the longest duration is the first to be evicted when space
    is needed for a new item. Remember, in a real-world queue, if you are the first
    person in the queue, you will be attended first.


    Here''s how FIFO cache eviction works:


    **Insertion of Items:** When a new item is inserted into the cache, it is placed
    at the end of the cache structure, becoming the most recently added item.


    **Cache Capacity Limit:** As the cache reaches its capacity limit and a new item
    needs to be inserted, the cache checks if it is already full. If it is full, the
    FIFO policy comes into play.


    **Eviction Decision:** In FIFO, the item that has been in the cache the longest
    (i.e., the oldest item) is selected for eviction. This item is typically the one
    at the front or beginning of the cache structure, representing the first item
    that entered the cache.


    **Eviction of Oldest Inserted Item:** The selected item is evicted from the cache
    to make room for the new item. Once the eviction occurs, the new item is inserted
    at the end of the cache, becoming the most recently added item.


    FIFO cache eviction ensures items that have been in the cache for a longer time
    are more likely to be evicted first. It is a simple and intuitive eviction policy
    that can be implemented without much complexity.


    However, FIFO may not always be the best choice for cache eviction, as it does
    not consider the popularity or frequency of item accesses. It may result in the
    eviction of relevant or frequently accessed items that were inserted earlier but
    are still in demand.'
