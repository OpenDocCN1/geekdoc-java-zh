    # Redundancy


    Redundancy refers to the duplication of critical components, systems, or processes
    within a larger system or organization. It involves having backup or redundant
    elements to ensure continued operation and mitigate the impact of failures or
    disruptions. The purpose of redundancy is to ensure reliability, fault tolerance,
    and resilience.


    Here are a few points about redundancy:


    Backup and Failover. Redundancy often involves having duplicate components or
    systems that can take the functionality of the primary component or system in
    the event of a failure. For example, in a computer network, redundant switches
    or servers can act as backup devices and seamlessly take over if the primary ones'
  merge: -1
  pgno: 32
- img_proc: true
  md: '2 - Fundamentals of Availability


