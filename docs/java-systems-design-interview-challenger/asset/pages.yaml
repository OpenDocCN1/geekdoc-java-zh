    # Throughput vs. Bandwidth


    Bandwidth and throughput are two terms that are often used interchangeably, but
    they actually have different meanings.


    Bandwidth is the maximum data transfer rate that a network can support. It is
    measured in bits per second (bps). Throughput, on the other hand, is the actual
    data transfer rate that is sent over a network. It is also measured in bits per
    second (bps).


    Bandwidth is determined by the physical characteristics of the network, such as
    the type of cable used and the number of nodes on the network. Throughput, on
    the other hand, is affected by a number of factors, including the amount of traffic
    on the network, the type of applications that are being used, and the distance
    between the sender and receiver.'
