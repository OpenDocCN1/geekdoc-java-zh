  md: '# TLS handshake


    Imagine you want to have a secure conversation with someone over the internet.
    The TLS handshake is like establishing a secret code between the client and the
    other person so you can communicate securely.


    Here’s how it works:


    **Client Hello:** The client (your web browser, for example) starts the handshake
    by sending a “hello” message to the server. This message includes information
    like the supported encryption algorithms and other details.


    **Server Hello:** The server responds with its own “hello” message. It selects
    the strongest encryption algorithm that both the client and server support. The
    server also sends its digital certificate, which includes a public key.


    **Certificate Validation:** The client checks the server’s digital certificate
    to make sure it’s valid. It verifies the certificate’s authenticity by checking
    if it’s signed by a trusted certificate authority (CA). This step ensures that
    the client is communicating with the genuine server.


    **Key Exchange:** The client generates a random session key, which is be used
    to encrypt and decrypt the messages during the session. The client encrypts this
    session key using the server’s public key obtained from the certificate and sends
    it back to the server.


    **Server Key Decryption:** The server receives the encrypted session key from
    the client. It uses its private key (which is paired with the public key in the
    certificate) to decrypt the session key.


    **Session Established:** Now, both the client and server have the same session
    key. They use this key to encrypt and decrypt their messages during the session.
    This ensures that the communication'
