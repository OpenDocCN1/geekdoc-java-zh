    to be inserted, the cache checks if it is already full. If it is full, the LIFO
    policy comes into play.


    **Eviction Decision:** In LIFO, the item that was most recently inserted into
    the cache is selected for eviction. This item is typically the one at the top
    of the cache structure, representing the last item that entered the cache.


    **Eviction of Most Recently Inserted Item:** The selected item is evicted from
    the cache to make room for the new item. Once the eviction occurs, the new item
    is inserted at the top of the cache, becoming the most recently added item.


    LIFO cache eviction is straightforward and easy to implement since it only requires
    tracking the order of insertions. It is commonly used in situations where the
    most recent data has a higher likelihood of being accessed or where temporal locality
    of data is important.'
