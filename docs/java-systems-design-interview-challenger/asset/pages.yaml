  md: '# 5 - Effective API Design


    Besides algorithms and Systems design interviews in many companies, we might also
    have a API (Application Programming Interface) design interview. The knowledge
    of APIs is crucial in the cloud era because Microservices communicate via API.


    Therefore, developer teams will often have an API contract so that services communicate
    effectively. Without further ado, let''s explore the main concepts of an API further!


    # What is an API?


    An API, or Application Programming Interface, is like a messenger, allowing different
    software applications to talk to each other and share information. It serves as
    a point of connection between two systems, enabling them to interact and exchange
    data in a standardized way.


    Think of this way: Imagine you want to order food from a restaurant. The menu
    acts as an API. It provides a list of available dishes, their descriptions, and
    prices. As the client, you can select what you want to order and communicate your
    choices to the restaurant. As the server, the restaurant receives your request,
    prepares the food accordingly, and delivers it back to you. In this analogy, the
    menu is the API that defines how you and the restaurant can communicate and exchange
    information effectively.


    Similarly, in software, an API defines a set of rules and network protocols that
    specify how different applications can interact, what data can be exchanged, and
    what operations can be performed. It simplifies the development process by providing
    a standardized'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'interface, allowing developers to integrate different systems seamlessly and
    leverage the functionalities provided by external services or libraries.


    # What is REST?


    REST (Representational State Transfer) is an architectural style rather than a
    protocol or a standard. It provides a set of principles and constraints for designing
    networked applications and APIs.


    REST is based on a few key concepts:


    **Resources:** In REST, a resource is an entity or piece of information that can
    be identified by a unique URL, often referred to as a “resource endpoint” or “resource
    URI.” For example, a resource could be a user profile, a product listing, or a
    blog post.


    **HTTP Verbs:** RESTful APIs use HTTP verbs (GET, POST, PUT, DELETE, etc.) to
    perform operations on resources. Each HTTP verb has a specific meaning: GET is
    used to retrieve data, POST is used to create new resources, PUT is used to update
    existing resources, and DELETE is used to remove resources.


    **Stateless Communication:** REST is stateless, meaning that each request from
    a client to a server should contain all the necessary information for the server
    to understand and process the request. The server does not store any client-specific
    information between requests. Therefore, it allows for scalability and simplicity
    in the architecture.


    **Uniform Interface:** REST promotes a uniform interface between clients and servers,
    meaning the API follows consistent conventions. It includes using standardized
    HTTP methods, URLs to identify resources, and standard media types (such as JSON
    or XML) for data representation.


    Hypermedia as the Engine of Application State (HATEOAS):'
  merge: -1
  pgno: 54
- img_proc: true
  md: '5 - Effective API Design


    45


    REST APIs can include hyperlinks within the responses, allowing clients to discover
    and navigate related resources. HATEOAS enables a self-descriptive API where clients
    can dynamically explore and interact with the available resources and actions.


    RESTful APIs follow these principles to provide a scalable, stateless, and uniform
    approach to building web services. It emphasizes simplicity, interoperability,
    and leveraging the existing standards and infrastructure of the web, making it
    widely adopted and well-suited for distributed systems.


    # API Most Used Protocols


    We use the following protocols when communicating one service to the other via
    API. Even though we use the most REST APIs, we have many different APIs. Simply
    put, an API is a connection point between systems where there is communication.
    Let’s explore those protocols:


    HTTP (Hypertext Transfer Protocol): HTTP is the primary protocol used for communication
    between clients and servers on the web. It is the foundation of the REST architectural
    style and is widely supported by various programming languages and frameworks.
    HTTP provides a simple, standardized way to request and exchange data between
    clients and servers.


    HTTPS (Hypertext Transfer Protocol Secure): HTTPS is the secure version of HTTP
    that incorporates encryption and authentication mechanisms using SSL/TLS protocols.
    It ensures that data transmitted between clients and servers is encrypted, providing
    confidentiality and integrity. HTTPS is essential for secure communication and
