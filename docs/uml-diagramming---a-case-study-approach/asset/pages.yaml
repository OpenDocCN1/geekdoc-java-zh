  md: '# Chapter 22


    # Design of UML Diagrams for Job Seeker Portal System


    22.1 Problem Statement

    Job seekers work hard to gain the right skills and knowledge to give them an edge
    over others in the role they seek. However, at times, despite their best efforts,
    one may find it difficult to move a step closer to this sought-after job. Hence
    a platform for listing out the availability of jobs irrespective of the field
    is required. Furthermore, a job site serves a dual purpose. On one hand, it lists
    out the availability of jobs to candidates, and on the other, it serves as a database
    of registered candidate''s profiles for companies to shortlist. The objective
    is to develop a software solution to predict the availability of jobs based on
    location, sectors, package, platform, interest and eligibility. As it is important
    to keep the candidates engaged during their job search, it is important to provide
    facets on the above-mentioned criteria that they can narrow down to the jobs of
    their choice (Figures 22.1–22.8).


    22.2 UML Diagrams


    Actor Specification


    +   1. Admin – Verifies the company/seeker and maintains the system.

    2. Recruiter – Posts job vacancies and its requirements.

    3. Seeker – Can apply for a job posting.


    Usecase Specification


    +   1. Approve New Companies

    Description: Checks the credibility of the company and admits the company into
    the system.

    Flow of Events

    Basic Flow: Verifies the Company''s information.

    Pre-Conditions: Checking the proofs submitted.

    Post-Conditions: Background checks.


    DOI: 10.1201/9781003287124-22'
