  md: '# Chapter 6


    # Design of UML Diagrams for Weather Monitoring System


    # 6.1 Problem Statement


    This Weather Monitoring Case study allows people to directly check the weather
    status online. The functionalities are Weather Status, Live Updating, Alert, Graphical
    Representation, Future Prediction and Weekly. Weather Status – With this function,
    temperature, humidity, rainfall, and dew point are measured using sensors. Live
    Updating – Data are updated to be viewed by the user. Alert – This functionality
    provides tips and alerts to the user on certain weather conditions. Graphical
    Representation – Plotting of graphs based on variations for easier analysis. Future
    Prediction – This functionality helps in predicting the weather for the next few
    days. Weekly Analysis – Displaying the average, the highest and lowest temperature
    of the week. The final goal is to provide detailed weather conditions for the
    user based his/her location (Figures 6.1 and 6.2).


