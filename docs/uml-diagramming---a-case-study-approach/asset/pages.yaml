    \ as weather, soil conditions, market conditions, labour availability etcetera,\
    \ which can allow them to make data-driven decisions to get the best possible\
    \ results. Current technologies that solve such issues are either paid services\
    \ or inaccurate. They also tend to be more complex making it really hard for anyone\
    \ to understand and interpret. An application if developed primarily aiming at\
    \ reducing the risks, reducing the costs, improving yield, and most importantly,\
    \ easy for anyone to interpret (Figures 32.1–32.8).\n\n# 32.2 UML Diagrams\n\n\
    Actor Specification\n\n+   1. Admin – The admin has control over the entire system.\
