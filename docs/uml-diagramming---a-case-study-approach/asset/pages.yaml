  md: '# UML Diagramming


    +   2. Change Password

    Description: This allows the users to change the already set password to a new
    one.

    Flow of Events

    Basic Flow: The user enters the old password, new password and retypes the new
    password for confirmation.

    Alternative Flow: The user may not want to change the password and can go back.

    Pre-Conditions: The users should have a user account and an existing password.

    Post-Conditions: The old password is verified with the database and if it is correct,
    the new password is checked with the retyped password and that is set.


    +   3. Add Goods

    Description: This usecase allows the actors to add goods to the inventory.

    Flow of Events

    Basic Flow: The actor enters all the details about a particular good including
    the name, price and quantity added.

    Alternative Flow: No goods would have arrived from the supplier and the actor
    goes back.

    Pre-Conditions: The goods should have arrived and the actor should have known
    all the details about the goods.

    Post-Conditions: The entered details of a particular good will be stored in the
    inventory.


    +   4. Remove Goods

    Description: This usecase allows the actors to remove one or more goods from the
    inventory.

    Flow of Events

    Basic Flow: The actor enters the item''s ID or the item''s name and quantity to
    be removed.

    Alternative Flow: The actor may not want to remove the good or may not know the
    number of goods to be removed and goes back.

    Pre-Conditions: The actor should know which item he/she is going to remove and
    the quantity to be removed.

    Post-Conditions: The item''s id or name is searched for in the inventory and the
    specified number of that is removed.


    +   5. Expired Goods

    Description: This usecase allows the actors to view all the expired goods and
    allow them to remove those goods from the inventory.

    Flow of Events

    Basic Flow: The expired goods are displayed and the actor clicks on the remove
    button to remove them.

    Alternative Flow: The expired goods are displayed but the actor decides to have
    them on the inventory and goes back.

    Pre-Conditions: There should be atleast one expired good for this usecase to function.

    Post-Conditions: The expired good is removed from the inventory.


    +   6. Place Order

    Description: This usecase allows the actors to place an order from the inventory.

    Flow of Events

    Basic Flow: The actor chooses the item he/she wants to buy, specifies the quantity,
    gives the address and contact details and clicks on place order.

    Alternative Flow: The actor may decide not to buy anything at that instant and
    goes back.

    Pre-Conditions: The actor is allowed to choose only between the items that are
    available in the inventory.'
