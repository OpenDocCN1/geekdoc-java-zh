    Figure 25.3 DFD – Level 1.


    # 25.3 UML Diagrams


    Actor Specification


    +   1. Government – The government receives a complete detailed report of analytics
    of any kind of disparities or anomalies based on region, location, history, economy
    and records. The government after receiving the data will take the appropriate
    measures to overcome these disparities.

    2. Health Worker – A health worker belongs to a particular health institution.
    The job of the health worker is to verify the data provided by the patients to
    the records in the hospital. This verified data is then sent to the cloud where
    analytics on the data is performed. The analytics are based on region, location,
    history, economy and records. The health worker also has access to the health
    performance of patients. This health tracking helps the health workers organize
    routine check-ups based on their health.

    3. Patient – The patient is the most important aspect of this project. A patient
    provides or her medical data. This data is then verified by the health workers.
    The patient will be given a detailed description of their health in a patient
    dashboard. The patient dashboard tracks health of each patient. The health tracking
    enables the software to send alerts to the patients on any kind of medical update.

    4. State Agencies – After the government analyses the reports, the government
    takes the help of the state agencies to solve these medical disparities. The state
    agencies have access to the health financing data along with a detailed description
    of how the government wants them to help. The state agencies have no access to
    the private data of the patient.'
