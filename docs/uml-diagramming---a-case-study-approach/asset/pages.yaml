  md: '# Chapter 21


    # Design of UML Diagrams for Smart Traffic Management System


    # 21.1 Problem Statement


    In our modern metropolitan city, people don''t follow the traffic rules. The outcome
    of it is unfortunate. In India, 64.4% of the total deaths are accounted by road
    accidents. As the automobiles get revolutionized the number of vehicles keep increasing.
    Conventional traffic signals are not efficient and smart. Smart traffic system
    aims in minimizing the risks of accidents by precautionary taking actions on people
    who violate the traffic rules. Cameras to monitor the roads with high traffic
    levels in order to facilitate the traffic signal. Helmet and seat belt detection
    using image processing to warn the drivers. Details of the driver are submitted
    to the traffic police, when he/she violates the law more than twice via the number
    plate which is captured by cameras. Street lights are operated based on the population
    density on road at night, thereby saving electricity. License will be cancelled
    as penalty, if the law is violated. Details of the driver will be passed to successive
    signals on account of speeding. Automated traffic lights regulate the traffic
    flow in order to avoid congestions (Figures 21.1–28).


    # 21.2 UML Diagrams


    Actor Specification


    +   - Driver – Driver refers to all the citizens who drive any type of vehicle
    and who doesn''tlow traffic rules.

    - RTO Server – RTO Server is the Database that holds the information (Addresses,
    vehicle details) of all registered vehicles, monitors the traffic signals.

    - Traffic Police – Police officers who regulate the traffic on the ground, patrol
    cars and road safety officers.'
