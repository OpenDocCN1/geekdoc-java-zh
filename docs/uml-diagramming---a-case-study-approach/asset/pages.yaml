  md: '# UML Diagramming


    # 12. Resources


    Description: The resources such as health calculator, ambulance services, symptoms
    checker, find a doctor and insurance guidance are unveiled in this segment.


    Flow of Events


    Basic Flow: Thus the resources are gathered by the users.


    Alternative Flow: Instead of this usecase, the usecases that can be executed:
    HEALTH A–Z, NEWS AND EXPERTS, DRUGS AND SUPPLEMENTS, and FINANCE.


    Pre-Conditions: The availability of the resources should be ensured.


    Post-Conditions: The users have the privileged of accessing the resources (Figure
    2.5).


    The two actors, user and the service providers can access the resources on the
    website. The facilities class consists of the functions news and experts, health
    A-Z and health calculator. The finance class checks if the user has health insurance
    and it alerts the service provider who buys insurance for the user. The realization
    relationship is used to link the user and the service provider with the finance
    class. The payment class involves the payment by the user for drugs and other
    supplements. The payment can either be an online payment or cash on delivery of
    drugs Thus the generalization relationship is used to represent the cash and online
    payment of the payment class. The payment class is loosely related to the user
    class and it is strongly related to the service provider as the service provider
    takes care of all the payment procedures. Resources finding a doctor, which suggests
    a doctor specialized for a disease and purchase of drugs and supplements are the
    resources for which the payment is done. So these resources are common to both
    the facilities class and the payment class. Hence these resources are kept in
    an association class named ‘utilisation’ (Figure 2.6).


    The activity diagram represents the flow of data through the system. It represents
    the flow of data from registration of the user, followed by logging on to the
    username with password. Once the user has logged on to system, the user could
    access all the resources and can navigate through the resources again until the
    user wishes to log out the system. The user needs to pay for the services they
    acquired. The user could also give the feedback for the system if the user opts
    it (Figure 2.7).


    In this activity diagram, the register is a sub-activity. The register has an
    individual flow of control that enables the user to enroll into the system. The
    activity diagram above illustrates the flow that takes place in the register function.
    The service provider generates the random id and receives the password from the
    user and confirms the password. If password and confirm password are the same
    then the user is registered to the system the user is prompted to give the text
    for the confirm password field alone (Figures 2.8 and 2.9).


    The system first checks if the user is a registered user, if yes user is prompted
    to the login state, else the user is asked to register into the system and is
    prompted to the register state. Once logged into the system, the user could access
    the facilities on the choice of the user. Based on the choice of the user, the
    user is prompted to the required state. In this diagram, the login is a substate
    machine that consists of many disjoint states. If the user needs to find a doctor
    or needs to purchase drugs then the user is checked for the availability of insurance.
    If the system buys not an insurance for the user and is allowed to use the services.
    The payment is done for the services consumed using the payment state. Once the
    user has accessed the resources, the user could again loop on all the resources
    if required, else the user could log out of the system. Before logging out of
    the system, the user could also give the feedback for the services provided by
    the system if the user wishes to do so.'
