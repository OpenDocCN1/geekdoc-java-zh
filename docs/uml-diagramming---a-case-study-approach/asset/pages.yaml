  md: "# Chapter 17\n\n# Design of UML Diagrams for National Health ID 2020\n\n# 17.1\
    \ Problem Statement\n\nThe Prime Minister of India has announced a new scheme\
    \ of National Health ID on August 15, 2020. According to this proposal, every\
    \ Indian will get a unique Health ID based on their mobile number or Aadhaar number.\
    \ The National Health ID will be a repository of all health-related information\
    \ of a person. According to the National Health Authority (NHA), every patient\
    \ who wishes to have their health records available digitally must start by creating\
    \ a Health ID. Each Health ID will be linked to a health data consent manager\
    \ – such as National Digital Health Mission (NDHM) which will be used to seek\
    \ the patient’s consent and allow for seamless flow of information from the Personal\
    \ Health Records module. This Health ID prevents insurance frauds committed by\
    \ several health agencies, hospitals including both doctors and patients. This\
    \ will reduce the paper works and help patients easily maintain their health records.\
    \ It can be used for further diagnosis. Children who are born after the implementation\
    \ of the National Health ID will have all their medications recorded including\
    \ the vaccines, etc. (Figures 17.1–17.8).\n\n# 17.2 UML Diagrams\n\nUsecase Specification\n\
    \n+   1. Verification\n   Description: People are verified for Indian citizenship\
    \ through their individual identities such as Aadhaar card or voter id.\n   Flow\
    \ of Events\n   Basic Flow: Collection of data.\n   Pre-Conditions: To have an\
    \ Aadhaar card or voter id.\n   Post-Conditions: Those who do not have unique\
    \ identities will be rejected."
