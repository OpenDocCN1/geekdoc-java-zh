    # 19.2 UML Diagrams


    Actor Specification


    +   1. **Moderator/Admin** – Moderator or admin is responsible for the management
    of the magazine system and the content that is published.

    2. **Editor** – Editor uses the system to make required changes in articles written
    by writers and contributors before sending them for approval to moderator.

    3. **Writer** – Writer is a permanent user of the system (who is part of the team)
    who writes articles for the magazine regularly and sends them to editors for editing
    the same.

    4. **Contributor** – Contributor is a temporary user of the system (not part of
    the team – alumni) who contributes occasionally to the magazine by writing.

    5. **Student** – Student of the college uses the system to read the content published
    by the magazine.

    6. **Faculty** – Faculty of the college uses the system to read the content published
    by the magazine.

    7. **Guest** – Guest is anyone outside the college who uses the system to read
    the content published by the college magazine.'
