    # 24.1 Problem Statement


    The customer goes to the shop and purchases the medicine required. So a lot of
    time is wasted and the person gets tired. If he wants to exchange the product,
    once again he goes to the shop and replaces them. The complete process depends
    on the physical interactions. The Online Pharmacy is easy to use and order. The
    customer selects the required medicines and orders them with a single click. Before,
    if the customer needs to create a login account and fill all the details like
    name, address, any id no, etc. The client can able to view the status of the medicines.
    The business goal for the application is to provide the medicines to all the people
    and admin will provide the supplier details (Figures 24.1–24.20).


