  md: '# UML Diagrams and Its Components ■ 7


    Table 1.4 Components of UML Activity Diagram


    | S. No | Name of the Component | UML Notation and the Purpose of the Component
    |

    |---|---||

    | 1 | Initial state | * It represents the start state of the system under consideration.
    |

    | 2 | Final state | * It represents the termination state of the system under
    consideration. |

    | 3 | Swimlanes | * A swimlane contains two partitions namely a top partition
    representing entities like an actor/usecase/a class, etc., and the second partition
    focuses on the set of activities involved.

    * Swimlane is of two types namely vertical swimlane and horizontal swimlane.

    * Vertical swimlane – represents parallel activities of a particular scenario
    of the system under consideration.

    * Horizontal swimlane – represents sequential activities of a particular scenario
    of the system under consideration. |

    | 4 | Action state | * An action state represents an operation or a business activity
    or a process. |'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Table 1.4 (Continued) Components of UML Activity Diagram


    | S. No | Name of the Component | UML Notation and the Purpose of the Component
    |

    |---|---|---|n| 5 | Object | • An entity that carries data between any two action
    states.<br>![Object] |

    | 6 | Synchronization | • Synchronization represents two or more activities happening
    at the same time or rate.<br>• It is of two types: Fork – divides a single activity
    flow into two or more concurrent activities and Join – combines two or more concurrent
    activities into a single flow by ensuring that only one of the activities is at
    a time.<br>![Actor/ Usecase/Class of the system under consideration/FORK Action
    State/Concurrent Activity 1/Concurrent Activity 2/Actor/ Usecase/Class of the
    system under consideration/Concurrent Activity 1/Concurrent Activity 2/JOIN/Finally
    chosen one out of all concurrent activities |

    | 7 | Decision | • A decision node has one input or two or more outputs depending
    on the condition for which it is designed.<br>• Each output flow has a condition
    attached to it.<br>• If a condition is met, the flow proceeds along with the appropriate
    output.<br>• An ‘else’ output can be defined along which the flow can proceed
    if no other condition is met.<br>![Actor/ Usecase/Class of the system before Condition
    checking/Action State [Condition 1]/Condition 2]/Action State 1/Action State 2/DECISION/[ELSE
    Condition]/Action State 3] |'
  merge: -1
