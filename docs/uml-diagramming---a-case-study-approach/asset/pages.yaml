  md: '# 24 UML Diagramming


    # 2.2 Major Functionalities and Its Description


    The major functionalities of this system along with their description are as follows:


    Register – this functionality acts as a membership functionality that allows the
    users, patients or caregivers to register into this website to access all the
    resources. Login – this functionality authenticates the user to provide access
    permissions. Facilities – this functionality allows us to access all the options
    available on the website. Logout – this allows us to purchase insurance, or to
    pay for healthcare services consumed. Finance – Health A–Z– this functionality
    provides details of all the diseases. Resources – this functionality has sub-functions,
    namely symptoms checker, health calculator, find a doctor, insurance guide and
    ambulance providence. Drugs and supplements – this functionality provides online
    delivery of medicines. This functionality takes the doctor’s statement for the
    issue of medicine and the patient’s willingness to buy online. News and experts
    – this functionality provides health awareness and threats that are prevailing.
    Payment – this functionality deals with payment for the services consumed. This
    functionality is split into two sub-functions namely, payment for doctors, for
    the services issued and payment for online med-delivery. Feedback – this functionality
    collects user reviews for this website.


    System Architecture: System architecture is the conceptual model that defines
    the structure, behaviour and more views of a system. An architecture description
    is a formal description and representation of a system, organized in a way that
    supports reasoning about the structures and behaviours of the system. This architecture
    diagram shown in Figure 2.1 includes all the functionalities of the system in
    an ordered manner based on the sequence of occurrence of these functionalities.
    It represents the complete data flow starting from the register functionality
    through which the user could access the system to the logout functionality that
    ends the access


