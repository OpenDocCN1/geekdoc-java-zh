  md: '# Chapter 36


    # Design of UML Diagrams for Online Quiz System


    # 36.1 Problem Statement


    Online learning is a part of many institution''s course offerings around the world.
    The scope of online quiz systems increased in this pandemic situation. The objective
    of the system is to maintain and improve the education rate by conducting quizzes
    (exams). The system acts as a bridge between student and teacher to gain knowledge
    and monitor it by the institution (admin). This system provides teachers to know
    about the remote education. The delightful features of the system are online teachers,
    remote tests, auto evaluation and feedback from students. Admin is responsible
    for the registration of both teachers and students. Teachers define the number
    of questions, time of the quiz, schedule for the quiz and they can edit it. At
    the end of a quiz, students can see the correct answers and their performance
    (Figures 36.1–36.10).


    # 36.2 UML Diagrams


    Actor Specification


    +   1. Admin – Admin is responsible for registering both teacher and student into
    the system.

    2. Student – Students are opting for the courses and answering the quiz.

    3. Teacher – Teachers create, conduct and evaluate the test.


    Usecase Specification


    +   1. Registration


    Description: It is the process of admitting students and teachers into the course
    by the admin.

    Flow of Events

    Basic Flow: Admitting students and teachers.

    Alternative Flow: Try again with valid details of student and teacher'
