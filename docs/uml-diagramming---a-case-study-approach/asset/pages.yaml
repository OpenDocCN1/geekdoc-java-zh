  md: '# Chapter 1


    # Introduction to UML Diagrams and Its Components


    # 1.1 UP Phases


    An approach that helps a user to build, deploy and maintain a software is termed
    as Software Development Process. Such as a Software Development Process which
    is required to build an Object Oriented System is called as ''Unified Process''.
    Craig Larman states Unified Process as "The Unified Process (UP) combines commonly
    accepted best practices, such as an iterative lifecycle and risk-driven development,
    into a cohesive and well-documented description/process". The inception has four
    phases of the Unified Process, namely Inception, Elaboration, Construction and
    Transition. The inception phase takes a problem statement from a client input.
    It traces answer for the below several questions to generate a report to decide
    about the feasibility of developing the software (Figure 1.1).


    The elaboration phase takes the report generated by the inception phase as input
    to perform its processing. It involves three main activities like developing a
    core architecture for the system, developing a project schedule and finally sketching
    a Unified Modeling Language (UML) Usecase diagram (Figure 1.2).


    The construction phase involves a set of three activities, naming, coding, testing
    and feedback. Notable point is that the construction phase involves Alpha testing,
    i.e. testing a software at the developer site (Figure 1.3).


    | (1) Vision | (2) Is it feasible? | (3) What are the benefits of this project?
    |

    |---|---|--|

    | (7) Risk Involved | Problem Statement | (4) Cost / Budget |

    | (6) Why should the organization should involve in this project? | (5) Schedule
    | |


    ![](img/d57b893f2cab246eeea62e79849bffd0_15_0.png)'
