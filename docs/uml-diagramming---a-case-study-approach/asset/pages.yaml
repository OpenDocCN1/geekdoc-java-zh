  md: '# Chapter 13


    # Design of UML Diagrams for COVID-19 Management System


    13.1 Problem Statement

    -19 management system simplifies the entire process of decreasing the virus load
    in the community by digitalization. It includes tracking and treating COVID-19
    patients and monitoring the spread of the virus. It aims to assist healthcare
    organizations and governments to assess risk profiles and provide awareness to
    common people by connecting them with virtual care capabilities. With the current
    epidemiological situation of COVID-19, there is a high demand to reduce contact
    between persons and digitize the whole process. This will effectively reduce the
    infection rate, help the common people and empower medical professionals across
    the world to help more people through telemedicine and virtual care.


    Functionities:


    +   1. Medical Professionals (Doctors/Nurses): Can monitor the oxygen level, blood
    pressure level, temperature, symptoms, medicine intake and diet of the registered
    patient. All the information of patients from screening to discharge can be viewed.
    Medicines can also be prescribed to a specific patient.

    2. COVID-19 Patients: View the data shared by the doctor, home quarantined patients
    can update data and checklist of medical professionals in their locality.

    3. Common People: Check the number of people infected (symptomatic and asymptomatic)
    and death in their locality ranging from street, 500m, 1km, 5km, 10km and view
    a blog where recovered persons share their experience.

    4. COVID-19 Essentials Seller: Can stock up essentials like masks and gloves according
    to infection in an area. Medical shops near the area will be listed.'
