  md: '# 4 UML Diagramming


    Table 1.1 (Continued) List of UML Diagrams


    | S. No | UML Diagram | Purpose of the UML Diagram |

    |---|---|---|

    | 7 | UML Component Diagram | The purpose of a component diagram is to show the
    relationship between different components in a system. |

    | 8 | UML Deployment Diagram | Deployment diagrams are used for describing the
    hardware components, where software components are deployed. The purpose of deployment
    diagrams can be described as:

    - Visualize the hardware topology of a system.

    - Describe the hardware components used to deploy software components.

    - Describe the runtime processing nodes. |


    # 1.1.2 UML Usecase Diagram


    Table 1.2 contains the details of components of the UML Usecase Diagram. Table
    1.3 contains the various usecase relationships.


    Table 1.2 Components of UML Usecase Diagram


    | S. No | Name of the Component | UML Notation | Purpose |

    |---|---|---|---|

    | 1 | System Boundary | ![System]() | - It represents the scope of the system.

    - It encapsulates the complete set of functionalities of the system. |

    | 2 | Actors | ![Actor]() | - The users that interact with a system.

    - An actor can be a person, an organization or an outside system that interacts
    with your application.

    - An actor in a usecase interacts with a usecase.

    - It is up to the developer to consider what actors make an impact on the functionality
    that they want to model. |

    | 3 | Usecases | ![Usecase]() | - A usecase is a visual representation of a distinct
    business functionality in a system.

    - It ensures that the business process is discrete in nature.

    - List the discrete business functions in given problem statement.

    - Identifying usecases is a discovery. |'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Table 1.3 Usecase Relationships


    | S. No | Usecase Relationship | UML Notation and Its Functionality |

    |---|---||

    | 1 | Association | ![Association](url_to_image)


    * Association represents the relationship between an actor and a usecase. |

    | 2 | Directed Association | ![Directed Association](url_to_image)


    * Directed Association represents the one-way relationship where an actor takes
    the responsibility of influencing a usecase. |

    | 3 | Include | ![Include relationship](url_to_image)


    * Include relationship represents the situation where one usecase includes the
    functionality of one other usecase. |

    | 4 | Extend | ![Extend relationship](url_to_image)


    * Extend relationship between any two usecases implies a meaningful relationship
    that the extended usecase adds up additional behaviour towards the existing functionality
    of the base usecase. |'
