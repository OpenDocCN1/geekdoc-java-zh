  md: '# Chapter 25


    # Design of UML Diagrams for EQUIHEALTH


    # 25.1 Problem Statement


    This case study mainly focusses on developing an application to address the health
    disparities among the various classes of patients and the appropriate medical
    interventions in order to achieve health equity for every individual. The target
    users of the application are patients, caretakers, healthcare providers, medical
    professionals and government officials. One of the main functionalities of the
    system is a patient classification based on social determinants such as economic
    backgrounds, health insurance amount received, medical allowances, demographics,
    age, type of disability and hereditary health information. It has to be ensured
    that appropriate treatment is administered to the people of all categories in
    the application that will be corroborated by the details furnished by the healthcare
    providers and the patient''s public health records. Another important functionality
    is to enable the healthcare providers and health officials to notify the patients
    about the relevant medical events and health schemes available on the system''s
    categorization of the patient''s data. The system must also provide personal health-tracking
    facilities for the patients by means of assessing the patients'' individual medical
    records. The next function is to enable the healthcare providers such as hospitals
    and clinics to plan and schedule worker activity by the patient''s need. Consequently,
    the application should make available the analysis of these data to the government,
    thereby assisting in the implementation of significant intervention schemes to
    offer medical facilities without any conflicts and eliminate the health discrepancies.
    Thus, with a holistic approach, the application should allow patients to register
    and upload social and medical data which get classified based on criteria that
    are then used by the healthcare providers and governments to extend healthcare
    to all individuals without any disparities.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# UML Diagramming


    Functionalities:


    +   Registration: The users of the application are registered with unique credentials
    and categorized as patients, health workers or a government authority.


    +   Login: The login section is for users to login to the application using the
    unique credentials provided during the registration phase.


    +   Logout: The logout option is included in the user''s user interface enabling
    the user to log out of the application at any time the user wants to.


    +   Data Entry: A section to enter all the medical details as well as the various
    social and economic details unique identification details for the patient user
    and registered identification for the health workers.


    +   Validation of Medical Data: The details entered by the patient will be corroborated
    by the details furnished by the respective hospital medical records of the patients.


    +   Patient Dashboard: A catered dashboard for every patient user with articles
    relating to the patient''s present medical conditions and the possible ailments
    that the patient may be prone to, obtained by analysis of the patient''s medical
    records. It also incorporates a search bar to search for specific articles relating
    to a medical term.


    +   Health Worker Dashboard: A dashboard for every health working registered medical
    institution that provides informative articles pertaining to the worker''s area
    of specialization.


    +   Health Tracking: A section that provides a health-tracking facility by means
    of analytics of the patient''s individual health records furnished by the patient
    as well as the healthcare establishments from synchronize the data from other
    health monitoring applications in the user''s device and include them for health
    tracking.


    +   Alerts: Alerts are scheduled for all the users and dispatched to the patients
    whenever an activity is due such as a health checkup or a medical camp and dispatched
    to the health workers to catch up on a scheduled activity.


    +   Activity Scheduling: Activities of the health workers are scheduled according
    to the requirements of the patients based on various medical and social factors
    and the progress of these planned activities can be tracked.


    +   Analytics: All the exhaustive data that goes into the application is analysed
    for patterns of medical disparities based on family and community issues and socio-economic
    determinants and a holistic report of this data is presented in the dashboard
    accessible to the authorized government authority to bring about the appropriate
    health.


    +   Health Financing: Using the application''s analytics data, the government
    should be able to implement substantial schemes to bring forth health equity for
