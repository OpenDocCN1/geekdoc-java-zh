  md: '# # Chapter 34


    # # Design of UML Diagrams for Art Gallery Management System


    # ## 34.1 Problem Statement


    To provide an online platform to manage the buying, selling and storage of artistic
    creations provided by creators/other platforms or auctions and to organize events
    to exhibit these products. The system is a gallery having art pieces with its
    description, price and other information and the order activity, payment activity,
    update order activity and so on. The objective is to provide an online platform
    through which museums and art galleries can make-use to exhibit their collections
    in times of unavailable street galleries. Like times of pandemic also people need
    not going to a museum or art gallery instead they have online shopping and art
    exhibits. The system should be immune to any chances of misuse and unauthorized
    reproduction of works arts and designs. There will be two types of users accessing
    the system: Admin (Creators/authority of the art displayed) and Customer (One
    who looks to buy the art). The main features provided for the admin are that they
    will be able to update, add, delete, input price, description and information
    about an art (stock availability), generate report of gallery and for the customers
    are that they will be able to order (Payment), delete order, view end-user-projected
    art particulars (Figures 34.1–34.8).


    # ## 34.2 UML Diagrams


    Actor Specification


    +   1. **Admin** – The person who has access to the system and is responsible
    for all activities of the system.

    2. **Customer** – People who use the system for either buying or referring.

    3. **Delivery Person** – The person who takes out orders of the customers to them.

    4. **System User** – The people who owe the art is put in the system.'
