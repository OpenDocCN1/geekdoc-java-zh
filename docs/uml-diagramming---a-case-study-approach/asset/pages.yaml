  md: '# Chapter 26


    # Design of UML Diagrams for an OTT-Based System – MINI Reel


    # 26.1 Problem Statement


    An over-the-top (OTT) media service is a streaming media service offered directly
    to viewers via the internet. The OTT media can be streamed anywhere with just
    the use of an internet connection. The scope of this project lies in the maximised
    use of the internet by the current generation. The system aims at providing a
    fun-filled and informative services that they would be able to access easily from
    their place. This system includes streaming of shows and movies that could be
    viewed by the users and an administrator governing the OTT based on the schedule
    of the show or movie release. Users can have a trial package of the services offered
    for 1 month and further subscriptions are based on the amount categorised as normal
    users and premium users. Creating an account involves payment to the services
    provided. Hence trial users could use the trial package for month and create an
    account for them maintaining a secret password that makes their account safe from
    other people accessing it. The premium users have the privilege of providing suggestions
    of the shows in the discussion room. All the users should be provided with the
    facility of a chat room where the users can chat and express their views and comments.
    The administrator will have control over the shows broadcast and maintain a proper
    timeline of the shows, movies and live shows. News feeds highlighting the recent
    updates in the world will also be available in MINIREELS in a brief format. Users
    can also add their favourite videos to LIKES list and watch them whenever needed
    (Figures 26.1–26.8).'
