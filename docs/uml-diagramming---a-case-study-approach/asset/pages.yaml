  md: '# 7.2 UML Diagrams


    Usecase Specification


    +   1. Registration Process

    Description: This process allows new users to register to e-Province Website online
    and verify the account once the user is verified.

    Flow of Events

    Basic Flow: Registering to the e-Province and creating the unique ID in which
    the data are stored in the e-Province database.\Pre-Conditions: Users should possess
    the prerequisites (e.g. Voter ID and Aadhaar card) for registering.

    Post-Conditions: The details are uploaded to the database and the user is provided
    with a unique ID.

    2. Login Process

    Description: This process allows the authorized users to login to the website
    using their unique ID.

    Flow of Events

    Basic Flow: Login with the verified unique ID.

    Alternative Flow: If the unique ID is not present in the database, it shows an
    error message.

    Pre-Conditions: User should possess the unique ID.

    Post-Conditions: Logged in Successfully.

    3. Registration for Certificate Process

    Description: This process creates the forms for the required certificate that
    the user has requested and when the users filled the details with the valid prerequisites,
    the registration for certificate process completes.

    Flow of Events

    Basic Flow: The user can provide the details of the required certificate that
    is requested by him, and the data are stored in-Province database for further
    process.

    Alternative Flow: If the details are not provided correctly it displays an error
    message.

    Pre-Conditions: User should possess the details that are requested by the form
    to be filled (e.g. Aadhaar card, Voter ID).

    Post-Conditions: Form is filled with the required details and he requests the
    certificate from the issuer.

    4. Certificate Issuing Process

    Description: This process validates the details of the form and issues the certificates
    if it is approved.

    Flow of Events

    Basic Flow: The authority validates the details provided by the user and issues
    the required certificate.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: The certificate is issued to the user.'
  merge: -1
