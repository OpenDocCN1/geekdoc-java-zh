    # Design of UML Diagrams for

    GUIDE – Dropshipping

    Website


    # 35.1 Problem Statement


    The students in our college have a lot of unnecessary goods lying around, whereas
    many other

    might be befitted from those things. So I like to put forward a website that can
    be

    u to sell or trade the goods with someone who needs them. It proves to be extremely
    useful in

    cases like buying and trading second-hand books or study materials among students
    and faculties.

    Initially, the website can exclusively be accessed by the students within the
    PSG Tech College

    campus. Later on, if expected demands are met, it shall be expanded to other colleges.
    The sellers

    are given special accounts in which they are rated based on their previous records
    with which the

    buyers can choose their seller.


    Functionalities:


    +   - 1. The buyer can opt for the payment options with which they control the
    risk.

    - 2. User-friendly website layout.

    - 3. The buyer gets to inspect the product in front of the seller which ensures
    customer satisfacion (Figures 35.1-35.8).


    # 35.2 UML Diagrams


    Actor Specification


    +   - 1. Administrator – Admin controls the organization of the products and reports
    the statistics

    ab the movement of products and goods.

    - 2. Customer – Customers get to view the products and can purchase the products
    if they want

    to. They will be asked to rate the product after a successful purchase.


