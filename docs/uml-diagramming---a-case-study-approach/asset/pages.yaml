    with the operations associated with each of them, with respect to classes (Figure
    3.13).

    UML Activity Diagram: The purpose of the activity diagram is to have a visual
    depiction of the flow of events in the system (Figure 3.14).

    UML State Diagram: The purpose of the state machine diagram is to design and understand
    time-critical systems. It helps in understanding the behaviour of the system and
    it expresses the behaviour in terms of series of steps, triggering events and
    the actions that may occur (Figure 3.15).

    UML Sequence Diagram: The purpose of this diagram is to order the events identified
    earlier using sequence, and activity diagram. It is also used to trace the execution
    of the problem domain (Figure 3.16).

    UML Communication Diagram: The diagram focuses on how strongly objects communicate
    with each other with the help of messages (Figure 3.17).

    UML Component Diagram: It focuses on how every component collaborates with every
    other component using available interfaces to provide the major functionalities
    of the system (Figure 3.18).'
