  md: '# UML Diagramming


    # Usecase Specification


    +   1. Accept Application

    Description: Enables the administrator to accept applications submitted by the
    applicants.

    Flow of Events

    Basic Flow: After submitting the form online and making payment, the application
    is accepted.

    Alternative Flow: Nil.

    Pre-Conditions: The details should be filled correctly in the application form
    and the payment for processing the visa should be made.

    Post-Conditions: Nil.


    +   2. Accept Visa

    Description: Enables the Visa Consultant Officer to accept (approve) visa of applicants.

    Flow of Events

    Basic Flow: After verifying the documents to be correct, the Visa Consultant Officer
    accepts the visa.

    Alternative Flow: Nil.

    Pre-Conditions: Valid document proofs should be attached correctly.

    Post-Conditions: Nil.


    +   3. Apply for Visa

    Description: Helps the applicant to apply for a visa by filing an application
    form online.

    Flow of Events

    Basic Flow: Set of details are to be filled correctly before submitting the form
    online.

    Alternative Flow: Nil.

    Pre-Conditions: The applicant should have registered with the system.

    Post-Conditions: The details that are filled by the applicant should be correct.


    +   4. Approve Visa

    Description: Enables the Visa Consultant Officer to either accept or reject the
    visa.

    Flow of Events

    Basic Flow: The visa consultant officer, after verifying the document proofs that
    submitted accepts or rejects the visa.

    Alternative Flow: Nil.

    Pre-Conditions: The document proofs should be checked for correctness.

    Post-Conditions: If the documents are verified to be correct, the visa is accepted.
    Otherwise, it is rejected.


    +   5. Authentication

    Description: Used to verify the credentials when an actor logs in.

    Flow of Events

    Basic Flow: The actor is asked to enter a valid username and password.

    Alternative Flow: The actor is redirected to the login page.

    Pre-Conditions: The user should have entered valid credentials.

    Post-Conditions: The credentials should be correct.


    +   6. Cancel Application

    Description: Enables the user to cancel his/her application.

    Flow of Events

    Basic Flow: The applicant is given an option to cancel his/her application if
    he/she no longer has to apply for the visa.'
