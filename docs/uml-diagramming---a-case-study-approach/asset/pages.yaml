  md: '# Chapter 29


    # Design of UML Diagrams for Student Counselling Management System


    # 29.1 Problem Statement


    The first phase of a person''s life is confined mainly by education and training.
    Hence, counselling is an important aspect for the students of the current technological
    generation as an individual counsellor may remain in contact with all individual
    students as well as parents. Student Counselling Management System will simplify
    the process and reduce the manual paperwork. It is used to smooth the work of
    each counsellor who is facing problems, and making complete atomization of manual
    process to computerized system. The main objective of the Student Counselling
    Management System is to design a system to rationalize the admission to particular
    courses in a university/institution. Through this system, the student will be
    able to register for counselling if he is eligible. If the student is qualifying
    the criteria then he will get the information regarding the colleges and the universities
    in he can apply. The main features are online admission, report generation based
    on students'' merit list and keeping track of counselling procedures and finally
    publishing results. A student can also get the information regarding how many
    seats have been booked vacant seats available in the institution (Figures 29.1–29.8).


    # 29.2 UML Diagrams


    Actor Specification


    +   - **Student** – Student is the one who initiates the process by registering
    and filling choices.

    - **Admin Team** – Admin Team is the one who responds to students'' submissions
    of forms and choice sheets and is also responsible for seat allotment.

    - **College** – College is the one that collects admit from admin team and decides
    whether not to accept the student.'
