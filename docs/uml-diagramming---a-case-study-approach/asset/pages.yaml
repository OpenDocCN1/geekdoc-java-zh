    Actor Specification


    +   1. Administrator – The functionality of this actor is to authenticate users
    who have registered to the system. More importantly, if a change has occurred
    in an inventory such as price update, removing expired goods, these changes are
    made subsequently by the administrator.

    2. Inventory manager – This actor takes care of the inventory, its associated
    goods and the transactions that occur within the inventory.'
