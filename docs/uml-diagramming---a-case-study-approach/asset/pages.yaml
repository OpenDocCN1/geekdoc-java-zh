  md: '# Chapter 16


    # Design of UML Diagrams for Textile Management System


    # 16.1 Problem Statement


    The ‘Textile Management System’ case study is designed to monitor all the processes
    in a textile manufacturing industry. There are various processes such as order
    receiving, purchase of raw materials, classification of raw materials, production
    of goods and selling the products. The main aim of this system is to ensure the
    reliability of data and to ease the process of manufacturing and transportation
    of garments and raw materials. This system ensures that the hardships prevailing
    in the manual systems are overridden by reducing the errors in data handling.
    The major functionalities are customer registration, sampling, stock checking,
    purchasing and processing of raw materials, production of garments, product checking
    and clearance, shipment, billing and report generation (Figures 16.1–16.8).


    # 16.2 UML Diagrams


    Usecase Specification


    +   1. Customer Registration

    Description: Enables a user (customer) to register with the system.

    Flow of Events

    Basic Flow: Details to be correctly filled before completing the registration
    process.

    Alternative Flow: Nil.

    Pre-Conditions: Access to registration platform.

    Post-Conditions: Customers can place the order.

    2. Ordering Garments

    Description: Allows registered customers to place the orders for the garments.

    Flow of Events

    Basic Flow: The particular order is placed and an order ID is generated.'
