    # 4. Read SMS


    Description: This usecase is about the ''My Helper'' application reading SMS sent
    to the phone.

    Flow of Events

    Basic Flow: The system reads the SMS, checks for a password that has been set
    by the user.

    Alternative Flow: If the password in the SMS doesn''t match the password set by
    the user, My Helper sends back an SMS stating invalid details.

    Pre-Conditions: The SMS should have been received and the user should have given
    ''My Helper'' access to read messages.

    Post-Conditions: SMS is read successfully and ''My Helper'' now starts checking
    details of the requirement.


    # 5. Checks Requirement


    Description: Checks for a valid requirement.

    Flow of Events

    Basic Flow: If it is a valid requirement, ''My Helper'' now starts processing
    the requirement.

    Alternative Flow: If the requirement is not valid, My Helper sends back an SMS
    stating invalid details.

    Pre-Conditions: SMS should have been received and successfully read.

    Post-Conditions: The requirement fulfilment process gets started.'
