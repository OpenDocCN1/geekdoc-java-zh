  md: '# UML Diagrams and Its Components ■ 3


    ![](img/d57b893f2cab246eeea62e79849bffd0_17_0.png)


    Figure 1.5 Pyramid of UML diagrams.


    # Table 1.1 List of UML Diagrams


    | S. No | UML Diagram | Purpose of the UML Diagram |

    |---|---|--|

    | 1 | UML Usecase Diagram | It focuses on the identification of functional requirements
    of the system under consideration. |

    | 2 | UML Activity Diagram | It focuses on sequential and parallel activities
    involved in each functional requirement of the system. |

    | 3 | UML Class Diagram | It describes the structure of the system in terms of
    classes and objects. |

    | 4 | UML Sequence Diagram | It depicts the objects involved in the scenario and
    the sequence of messages exchanged between the objects needed to carry out the
    functionality. |

    | 5 | UML Collaboration Diagram or UML Communication Diagram | It shows interactions
    between objects using sequenced messages in a free-form arrangement. |

    | 6 | UML State Machine Diagram | It describes the life of an object using three
    main elements: states of an object, transitions between states and events that
    trigger the transitions. |


    (Continued)'
