  md: "# Chapter 30\n\n# Design of UML Diagrams\for E-Visa Processing andnFollow-Up\
    \ System\n\n# 30.1 Problem Statement\n\nA visa is a document issued by a country\
    \ giving a certain individual permission to enter a country\na a given period\
    \ of time for certain purposes. It is received after several verifications through\n\
    offline mode. It requires the applicant to go to the Passport Verification Centre\
    \ for the verification\nof documents. Sometimes even the cost of getting the visa\
    \ will be as high as there may be middlemen\ninvolved in it. It takes anywhere\
    \ from two weeks to two months to receive the visa if applied in\noffline mode.\
    \ With the use of an online visa processing system, the middlemen entry in gettingnthe\
    \ visa gets reduced and the process of application of visa becomes easier. The\
    \ overall aim of the\nsystem is that the applicant can apply for the visa from\
    \ anywhere and at any time. The applicant\napply for the visa and submit it online.\
    \ There are certain types of visas that the applicant can apply for such\nemployment\
    \ visa, study visa, resident visa, H1 visa, business visa, etc. People who apply\
    \ for the visa\for work, education, etc will be benefited a lot from this system.\
    \ The applicant should register by\nproviding a valid email and a password. The\
    \ applicant has to log in to apply for the visa. The cre-\ndentials are checked\
    \ for correctness and the applicant to log in. Once the applicant logs in,\n/she\
    \ will be shown the application form which asks the applicant to provide the necessary\
    \ details\nand he can also view the details of fair to visa for each country.\
    \ The applicant can view, modify\nde delete the details of applied visa. The system\
    \ will have a provision for the administrator to view the\ndetails of what types\
    \ of visas are required by the applicant. The administrator will also be able\
    \ to\nupdate and delete the details of the applicants. The administrator will\
    \ have a facility to interact\n the document proofs (valid passport, Draft Visa\
    \ Fee I-20 form, letter of admission, aid letter,\netc.) submitted by the applicant\
    \ and can be able to view the purpose of application of visa. He/She\nhas the\
    \ authority to accept/reject the visa application applied by the applicant (\n\
    \nDOI: 10.1201/9781003287124-30\n\n313"
