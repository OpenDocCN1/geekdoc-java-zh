  md: '# # Chapter 3


    # # Design of UML Diagrams for Inventory Management System


    # ## 3.1 Problem Statement


    This chapter aims to create an inventory management system for the efficient management
    of goods. The performance will be guided by clear and concise strategic practices
    for each functional unit by an ongoing quest for perfection. The current systems
    use a manual method to keep track of the records at stores, but the current system
    is difficult to maintain due to the difficulty in searching and retrieving products,
    cost of material, human errors, less data integrity, and feasible loss of records
    and retrieving files. Therefore, by developing such a system, we propose to increase
    sales by creating the complete inventory records of stock, detail of purchasers
    and sellers at the store and also to facilitate salespeople and inventory managers.
    The ever-growing population creates a high demand. Thus, the responsibility of
    delivering goods on time lies in the hands of an effective inventory management
    system. The inventory management system will be installed in both the warehouse
    and at the billing counter enabling the salespersons and the inventory managers
    to get instantaneous information and use it on demand. The customer billing process
    will happen at the main counter and the inventory management will happen in the
    background in the warehouse.


    # ## 3.2 Software Requirements Specification


    The current inventory system is difficult to maintain due to the difficulty in
    searching and retrieving products, cost of material, human errors, less data integrity,
    and feasible loss of records and retrieving files. So there is a need to create
    robust inventory management software that ensures a reduction in customers'' complaints
    as well as the reduction in inventory cost. The demand for goods occurs from the
    growing population. To meet these demands, the inventory managers and salespeople
    require an application with on-demand information retrieval and update. At the
    warehouse, the application will manage the available goods and resources. At the
    billing counter, the application will have the ability to create bills along with
    proper discount and tax evaluations.


    DOI: 10.1201/9781003287124-3'
