  md: '# 37.2 Literature Review


    Existing System: The present system is only some book banks are partially automated,
    that is by storing details in MS Excel Spreadsheets, whereas many other book banks
    are manual. A user has to visit the book bank personally at least thrice to get
    a set of the books are needed. Also, only the user has to give the list of books
    needed with the exact details of the ordered books, such as author''s name, edition,
    name of the publication, etc. Only the list of users registered the books available
    are stored in the database. Due to this manual process and work in the existing
    system are more. A user has to visit the book bank personally to get registered,
    to request and also to receive books, and this time is time-consuming. The bank
    works only for a specific time within which the user should visit and complete
    all the procedures. The staff will have to manually search for the details of
    any particular user and the list of books ordered by the user.


    Proposed System: In our proposed system, the user can register in the system,
    enter his/her personal details, and can fill the registration form with unique
    user Identifier. The user can complete all the procedures such as ordering books
    and confirming the booklist and go to the bank only for receiving the books. The
    system confirms the book list by means of automated email service. The books that
    would be needed by the user predicted by the system to the department and semester
    are chosen in the request books page. Hence the user is given a set of choices
    for selecting a book. Due to all the processes such as requesting, books, etc.
    can be done online and automated. It saves a lot of time for the user and the
    book bank staff save. There is no specific time for the user to register into
    the system and download the registration form. The user need not give the list
    of books needed, and can send only a confirmation for the same (Figures 37.1–37.8).


    # 37.3 UML Diagrams


    # Actor Specification


    +   1. **Admin** – Admin will manage the entire system periodically. The function
    of the admin extends in ways of adding new books, monitoring book issue and book
    order details and finally accepting payment of books.

    2. **Librarian** – Librarian manages the books in the system making available
    the searched books by the members. He is the one who checks and accepts the return
    of books.

    3. **User** – The user or member is the one who gets full access to books either
    buying or borrowing a book. A member is a registered user of the system who can
    search their required books.

    4. **Visitor** – Visitor is an unregistered user of the system. A visitor may
    sign up in order to view and search the books.


    # Usecase Specification


    +   1. **Book Borrow**

    Description: This usecase is used to lend books to the user who wished to borrow.

    Flow of Events

    Basic Flow: The normal flow is that the member borrows a book from this system.

    Alternative Flow: The alternate flow is that if the required book is not available,
    then the member may search for the book with a different author.'
