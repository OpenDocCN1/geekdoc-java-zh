  md: '# 2 UML Diagramming


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_0.png)


    Figure 1.2 Elaboration phase.


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_1.png)


    Figure 1.3 Construction phase.


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_2.png)


    Figure 1.4 Transition phase.


    The transition phase involves Beta testing, i.e. testing a software at the client
    site without the support of developers, followed by deployment, and finally, fine
    tuning is done based on feedback from the client''s side (Figure 1.4).


    # 1.1.1 UML


    It is a standard diagrammatic tool for designing. It is a graphical language for
    specifying, visual-constructing and documenting the artifacts of software systems.
    It helps in better-understanding of the software or system to be developed among
    developers and customers. UML diagrams include major important diagrams like UML
    Usecase Diagram, UML Activity Diagram, UML Class Diagram, UML Sequence Diagram,
    UML Collaboration Diagram or UML Communication Diagram, UML State Machine Diagram,
    UML Component Diagram and UML Deployment Diagram (Figure 1.5 and Table 1.1).'
  merge: -1
