    ![](img/d57b893f2cab246eeea62e79849bffd0_267_0.png)


    图 24.7 UML 时序图 – 快递员。


    ### 9. 更新信息

    描述：客户可以更新地址。

    事件流

    基本流：更新配送信息。

    备用流：跳转到支付页面。

    前提条件：需要支付信息进行更新。

    后条件：跳转到支付页面。


    ![](img/d57b893f2cab246eeea62e79849bffd0_268_0.png)


    图 24.8 UML 协作图 – 客户。


    ![](img/d57b893f2cab246eeea62e79849bffd0_268_1.png)


    图 24.9 UML 协作图 – 管理员。


    ### 10. 跟踪订单

    描述：此页面允许客户跟踪他们的订单。

    事件流

    基本流：需要订单显示跟踪选项。

    备用流：跳转到更新信息页面。

    前提条件：需要订单进行跟踪。

    后条件：跳转到更新信息页面。


    ![](img/d57b893f2cab246eeea62e79849bffd0_269_0.png)


