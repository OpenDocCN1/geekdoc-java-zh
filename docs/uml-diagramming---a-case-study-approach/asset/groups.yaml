    # 276 ■ UML Diagramming


    Flow of Events


    Basic Flow: It performs a continuous tracking of the patient’s medical data and
    provides an insight of this tracking to the patient and the concerned health workers.


    Pre-Conditions: Data Entry usecase must be invoked.


    Post-Conditions: The health-tracking data is displayed in the patient’s dashboard
    and is also sent for analytics.


    # 8. Health Worker Dashboard


    Description: A dashboard for every health worker belonging to every registered
    medical institution that provides informative articles pertaining to the worker’s
    area of specialization.


    Flow of Events


    Basic Flow: It collects the various data regarding the activity schedule and the
    concerned patients’ data for validation and displays them for the health worker.


    Pre-Conditions: Health Tracking and Activity Scheduling usecases must be invoked.


    # 9. Login


    Description: The login section is for the users to login to the application using
    the unique credentials provided during the registration phase.


    Flow of Events


    Basic Flow: It authenticates and allows a registered user to access the facilities
    of the application.


    Alternative Flow: The user is directed to patient dashboard or health worker dashboard
    or government dashboard.


    Pre-Conditions: Registration usecase must be invoked.

    Post-Conditions: The user is able to enter the application.


    # 10. Logout


    Description: The logout option is included in the user’s user interface enabling
    the to log out of the application at any time the user wants to.


    Flow of Events


    Basic Flow: The logged in user is enabled to safely log out of the application.


    Alternative Flow: Nil.


    Pre-Conditions: Login usecase must be invoked.

    Post-Conditions: The user exits the application.


    # 11. Patient Dashboard


    Description: A catered dashboard for every patient user with articles relating
    to the patient’s present medical conditions and the possible ailments that the
    patient may be prone, obtained by analysis of the patient’s medical records.


    Flow of Events


    Basic Flow: It collects the various data that are pertinent to the particular
    patient such as health-tracking records and medical articles and displays them
    to the patient.


    Alternative Flow: Nil.


    Pre-Conditions: Registration and Login usecases must be invoked.

    Post-Conditions: Nil.


    # 12. Registration


    Description: The users of the application are registered with unique credentials
    and categorized as patients, health workers or a government authority.


    Flow of Events


    Basic Flow: It allows new users to register for the application with new credentials.


    Alternative Flow: Nil.


    Pre-Conditions: Internet connectivity is required.

    Post-Conditions: The user is directed to the login page.


    # 13. Validation of Medical Data


    Description: The details entered by the patient will be corroborated by the details
    furnished by the respective hospital medical records of the patients.

    Flow of Events

    Basic Flow: The data obtained from the patients is validated by the health workers
    using the patient''s medical records.

    Alternative Flow: Nil.

    Pre-Conditions: Data entry usecase must be invoked.

    Post-Conditions: The validated medical data is sent to the analytics and health-tracking
    modules.


    # 14. Economy-based


    Description: This usecase is used to do a deep data analysis based on the economic
    data provided by the user.

    Flow of Events

    Basic Flow: Here, the data are classified based on the user''s annual income,
    money previously spent on medical treatments and parent''s income.

    Alternative Flow: Nil.

    Pre-Conditions: Data entry usecase must be invoked.

    Post-Conditions: The report is sent to the analytics.


    # 15. History-based


    Description: This usecase analyzes data based on the medical history of the patient.

    Flow of Events

    Basic Flow: Here, the data is analyzed based on the patient''s medical data along
    with family members.

    Alternative Flow: Nil.

    Pre-Conditions: Data entry usecase must be invoked.

    Post-Conditions: The report is sent to the analytics.


    # 16. Location-based


    Description: This usecase analyzes the data based on the geographical location
    of the patients.

    Flow of Events

    Basic Flow: Here a detailed analysis is done based on demographic details of the
    patients.

    Alternative Flow: Nil.

    Pre-Conditions: Data entry usecase must be invoked.

    Post-Conditions: The report is sent to the analytics.


    # 17. Records-based


    Description: This usecase analyzes the data based on the present medical data
    of the patients.

    Flow of Events

    Basic Flow: Here a collective analysis is done based on current medical data of
    the patients.

    Alternative Flow: Nil.

    Pre-Conditions: Data entry usecase must be invoked.

    Post-Conditions: The report is sent to the analytics.


