    # 第 33 章


    # Green Rides UML 图设计


    ## 33.1 问题描述


    该系统在道路运输和公路领域（交通运输和公路部）非常有用。Green Rides 是一种面向普通公众的技术解决方案，引导他们在旅行时选择污染较少的路径，了解交通堵、识别事故多发点、送餐服务（meals-on-wheel）以及驾驶模式应用的建立。该应用程序主屏幕上包含
    Google 地图视图。用户可以选择起点到终点的路径，该路径将经过处理，给出到达终点的若干路线，以及该路径上各个位置的流量情况和该路线当前的污染状态（随时间更新）。如果发生交通堵塞，用户可以向特定半径内的所有用户鸣笛。根据其当前位置，以小通知的形式显示给特定半径内的人员。特定地点发生的事故将由用户报告给相关机构，机构将进行救援行动，从而让用户在特定地点行驶时缓慢且安全（针对事故多发区域）。道路管理局统计发生的事故数量，系统经常弹出通知。送餐服务提供所选路线上的可用酒店和餐厅的信息，以便用户可以根据特定用餐时间段的可用菜单进行下单，无需在餐厅等待点餐。驾驶模式有助于减少驾驶期间接听手机引发的事故风险。当地理坐标显示驾驶员模式切换低于某些指定的速度限制（例如
    20 km）时，此模块将向拨电者发送短信，告知该人员正在驾驶。在行程开始之前，可以开启此模块。反馈功能允许用户对给定区域的准确性和污染水平提供反馈（图 33.1–33.8）。


