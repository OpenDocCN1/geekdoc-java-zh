    # 19.2 UML Diagrams


    Actor Specification


    1. **Moderator/Admin** – Moderator or admin is responsible for the management
    of the magazine system and the content that is published.

    2. **Editor** – Editor uses the system to make required changes in articles written
    by writers and contributors before sending them for approval to moderator.

    3. **Writer** – Writer is a permanent user of the system (who is part of the team)
    who writes articles for the magazine regularly and sends them to editors for editing
    the same.

    4. **Contributor** – Contributor is a temporary user of the system (not part of
    the team – alumni) who contributes occasionally to the magazine by writing.

    5. **Student** – Student of the college uses the system to read the content published
    by the magazine.

    6. **Faculty** – Faculty of the college uses the system to read the content published
    by the magazine.

    7. **Guest** – Guest is anyone outside the college who uses the system to read
    the content published by the college magazine.


    # Online College Magazine System ■ 205


    # Usecase Specification


    1. Register

    Description: Functionality involves registering into the system with relevant
    details.

    Flow of Events

    Basic Flow: Register into the system with details like name, mail ID, phone.

    Alternative Flow: Nil.

    Pre-Conditions: The registering candidate must be a student, faculty or alumnus.

    Post-Conditions: The registration request is sent to the moderator/admin.


    2. Validate Registration

    Description: Functionality involves the admin validating the request for registration
    after confirming legitimacy.

    Flow of Events

    Basic Flow: If requested registration is from a writer or editor of the magazine
    or from an alumnus, the admin validates the registration.

    Alternative Flow: If the requested registration is not from a legitimate user,
    the admin does not validate the registration.

    Pre-Conditions: The user seeking must be a student or faculty in the team or alumnus.

    Post-Conditions: After validation, the user''s profile is created successfully.


    3. Login

    Description: Refers to changing an existing information in the system to fix errors
    or enhance functionality and deleting outdated information and updating of new
    data into the system.

    Flow of Events

    Basic Flow: Modifying and updating the database based on the various criteria.

    Pre-Conditions: Status of each company/seeker.

    Post-Conditions: Based on the feedback received from recruiters/seekers.


    4. Manage Articles

    Description: Functionality involves organizing approved articles, adding and deleting
    articles in the system''s database by the moderator/admin.

    Flow of Events

    Basic Flow: The articles approved by the moderator/admin is added to the database
    under appropriate categories.

    Alternate Flow: Prevalent articles can be modified or deleted.

    Pre-Conditions: The article must be approved by the admin/moderator.

    Post-Conditions: The article is available for publishing.


    5. Manage Profiles

    Description: Functionality involves managing writers, editors and contributors
    of the system by the moderator with appropriate access, adding, editing and deleting
    profiles, etc.

    Flow of Events

    Basic Flow: Validated registrations are added to the database as writer, editor
    or contributor profiles.

