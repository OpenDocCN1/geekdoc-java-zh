    \nFigure 35.2 UML activity diagram.\n\n- 3. Seller — Seller can add or delete\
    \ the products he posted. This does not deny him from buying products from other\
    \ sellers with the same account.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_373_0.png)\n\
    \nFigure 35.3 UML sequence diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_374_0.png)\n\
    \nFigure 35.4 UML collaboration diagram.\n\n### Usecase Specification\n\n### 1.\
    \ Login\nDescription: Buyer has his/her own username and password. Using this,\
    \ he/she has to log in the system.\nFlow of Events\nBasic Flow: Allows into the\
    \ system.\nAlternative Flow: Throw an error message.\nPre-Conditions: The username\
    \ and password should be correct.\nPost-Conditions: Nil.\n\n### 2. Register\n\
    Description: The buyer and seller can register for a new account.\nFlow of Events\n\
