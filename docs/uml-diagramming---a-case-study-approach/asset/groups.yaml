    \n# 第 6 章\n\n## 天气监控系统的 UML 图设计\n\n### 6.1 问题描述\n\n该天气监控案例研究允许人们直接在线查看天气状态。功能包括天气状态、实时更新、警报、图形表示、未来预测和每周报告。\n\
    \n天气状态 – 通过此功能，使用传感器测量温度、湿度、降水量和露点。\n\n实时更新 – 数据更新供用户查看。\n\n警报 – 该功能提供针对某些天气状况的提示。\n\
    \n图形表示 – 基于变化绘制图表。\n\n未来预测 – 该功能有助于预测未来几天的天气。\n\n每周 – 显示每周的平均和最低温度。\n\n最终目标是根据用户的位置提供详细的天气状况（图\
    \ 6.1 和 6.2）。\n\n### 6.2 数据流图\n\n功能包括：\n\n 1. 天气状态 – 使用传感器测量温度、湿度、降水量和露点。\n 2.\
    \ 实时更新 – 数据更新供用户查看。\n 3. 警报 – 该功能提供针对某些天气状况的提示。\n 4. 图形表示 – 基于变化绘制图表。\n 5. 未来预测\
    \ – 该功能有助于预测未来几天的天气。\n 6. 每周 – 显示每周的平均和最低温度。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_99_0.png)\n\
