    # Chapter 14


    # Design of UML Diagrams for Car Care


    ## 14.1 Problem Statement


    Most of the car owners do not know whether their car is at risk and needs to be
    serviced. This considerably increases the risk of malfunctioning of major parts
    of a car such as the braking system and engine which lead to accidents.


    Car Care is a multi-brand car service and maintenance application that maintains
    the date at which specific part of a car is installed and notifies the expiry
    date of the parts of the car for both the driver and authorized service centre,
    so that the car can be serviced.


    This application enables car owners and service centres to separately login and
    enter their car information. After issuing the car, the service centre employee
    enters the estimated expiry dates of parts of the car in the app.


    This application notifies the car owners and service centres when the expiry date
    for parts of the car is reached. Then the service centre employee contacts the
    owner of a car about service, once the owner accepts service request, the service
    centre employee picks up the car from home, saves the time for owner of car. Then
    service centre employee examines the entire car and prepares the list of damaged
    parts and sends it to the owner through this app, once the owner selects damaged
    parts to be serviced, the employee updates the information about changed parts
    in the app so that car can be serviced on the expiry date of parts. Thus, this
    application allows the car owner and service centre to exchange information. This
    application also enables the online payment for the services (Figures 14.1–14.8).


    ## 14.2 UML Diagrams


    ![](img/d57b893f2cab246eeea62e79849bffd0_172_0.png)


    Figure 14.1 UML usecase diagram.


    # Usecase Specification


    + 1. Registration

    Description: Registration of car owner and service centre is required to use the
    system.

    Flow of Events

    Basic Flow: Profile for car owner and service centre is created.

    Alternative Flow: If the car owner and service centre are already registered,
    they can go with login and get access to the system. ownPre-Conditions: Nil.

    Post-Conditions: Allows car owner and service centre to login into system.


    + 2. Login

    Description: Login is required to get access to the system.

    Flow of Events

    Basic Flow: If the password is correct, then the car owner and service centre
    can get access to the system.

    Alternative Flow: If the password is incorrect, try with the correct password
    and forgot password facility is available.

    Pre-Conditions: Registration is required.


    ![](img/d57b893f2cab246eeea62e79849bffd0_173_0.png)


    Figure 14.2 UML activity diagram.


    Post-Conditions: This allows the car owner and service centre to access the Vehicle
    Information System.


    # 3. Vehicle Information System


    Description: Vehicle Information System maintains the information of the vehicle
    and when the expiry date of parts of car is reached, it notifies both the owner
    and service centre, so that car can be serviced.


    Flow of Events

    Basic Flow: Maintains the information of the vehicle and sends a notification
    when the expiry date of parts of car is reached.

    Alternative Flow: Nil.

    Pre-Conditions: Login is required.

    Post-Conditions: The car owner and service centre can view the information of
