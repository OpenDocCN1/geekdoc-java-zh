    # 第 11 章

    # 律师日志的 UML 图设计


    ## 11.1 问题描述


    在像印度这样人口众多的国家，法律执行的需求。律师在维护大部分数据方面起着重要作用。该项目主要旨在让律师的工作变得简单高效。这是一个响应式应用程序，将为律师提供各种服务（图
    11.1–18）。


    ## 11.2 UML 图图


    用例规范


    + 1. 注册

    描述：允许新律师创建账户。

    事件流

    - 基础流程：用户输入正确的凭据。

    - 备用流程：输入了不正确的凭据。

    - 前置条件：无。

    - 后置条件：输入的数据保存到数据库。允许用户登录。


    + 2. 登录

    描述：允许有效用户登录页面。

    事件流

    - 基础流程：输入用户 ID 和密码。


    130 UML 图


    ![](img/d57b893f2cab246eeea62e79849bffd0_144_0.png)


    11.1 UML 用例图。


    - 备用流程：无效 ID 或密码导致登录失败。

    - 前置条件：用户应该已经注册。

    - 后置条件：无。


    + 3. 查看案件详情和日志

    描述：结合日历显示现有和已完成案件详情。

    事件流

    - 基础流程：允许用户查看和编辑详情。

    - 备用流程：无。

    - 前置条件：无。

    - 后置条件：如果编辑过，提醒将实现在日历中。


    + 4. 添加案件

    描述：允许用户添加新案件。

    事件流

    - 基础流程：用户可以添加新案件的详情。

    - 备用流程：用户可能未添加详情。

    - 前置条件：无。

    - 后置条件：无。


    + 5. 更新详情

    描述：允许用户输入案件的具体详情。

    事件流

    - 基础流程：用户输入正确的详情。

    - 备用流程：用户可能输入错误的详情。

    - 前置条件：用户必须拥有案件详情。

    - 后置条件：详情反映在视图表中。


