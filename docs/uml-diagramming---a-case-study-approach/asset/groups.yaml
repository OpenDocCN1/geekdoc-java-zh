    # 第 20 章


    # 刑事局 UML 图设计


    ## 20.1 问题描述

    规则和制度对生活的各个方面都至关重要。某些支持者断言，犯罪是对社会法律的违反，是人性的本质，因此社会永远无法完全脱离犯罪。在现有系统中，所有工作都在纸质上完成，因此很难确保犯罪报告数据。该系统需要更多的人力来追踪罪犯和外部威胁的记录。现代社会的特点是内部和外部安全威胁带来的风险水平不断增加。这使得开发一个自动化犯罪管理系统变得重要，以记录犯罪和涉及的犯罪分子。拟议的刑事局是一个数据库系统，警察在其中记录已捕、待捕或逃犯的罪犯记录或投诉记录。这将有助于警察部门加强信息管理。流程中的主要实体包括：申请人（提交初次事故报告表
    (FIR) 的人）、受害者、被告或罪犯、案件和侦查官。拟议的犯罪记录管理系统可以克服现有系统的所有局限性。该系统提供了适当的安全并减少了人工工作。该项目有助于维护数据库，通过该数据库可以监控全州的犯罪活动（图
    20.1–28）。


