    \ 2. 注册\n   描述：为每个人在 NHD 中注册。\n   事件流\n   基本流：通过 Aadhaar 注册。\n   替代流：也可以通过手机号码注册。\n\
    \   前置条件：印度公民。\n   后置条件：激活。\n\n+ 3. 激活\n   描述：每个人都通过健康 ID 激活账户。\n   事件流\n   基本流：已创建账户。\n\
    \   前置条件：拥有唯一 ID。\n   后置条件：使用。\n\n. 4. 添加记录\n   描述：只有在激活后才开始记录，旧记录可以添加到存储库。\n\
    \   事件流\n   基本流：纸质版。\n   替代流：如果他们想要，可以跳过此过程。\n   前置条件：拥有旧记录。\n\n+ 5. 权限\n   描述：人员可以向特定医生或机构权限。\n\
    \   事件流\n   基本流：授予医疗工作人员。\n   替代流：账户必须激活。\n   后置条件：医生可以访问存储库。\n\n+ 6. 健康存储库\n\
    \   描述：NHD 在此存储库中维护人员记录。\n   事件流\n   基本流：存储的地方。\n   前置条件：账户必须激活。\n   后置条件：激活后的所有医疗交易将存储在存储库中。\n\
    \n# 第 18 章\n\n# 设备分发系统的 UML 图设计\n\n# 18.1 问题描述\n\n在疫情期间，学生通过智能手机和其他类似设备在在线平台上接受教育。许多贫困儿童无法获得此类设备。此外，由于封锁，愿意帮助的人无法接触需要的人。该系统的最终目标是通过从愿意帮助的人那里收集设备来帮助这些儿童。系统请求捐赠者输入他们愿意捐赠的设备详情。还请求捐赠者的地址以便联系。在成功输入这些详情后，用户必须等待设备的批准。管理员必须验证设备详情并分配给执行人员进行收集。该系统还允许志愿者加入团队，以便他们通过在当地收集设备来提供帮助（图\
    \ 18.1–18.12）。\n\n# 18.2 UML 图表\n\n用例规范\n\n+ 1. 新捐赠者\n   描述：案例中的新捐赠者提供其个人详情。\n\
    \   事件流\n   基本流：在系统中注册。\n   替代流：已注册的作为旧捐赠者继续操作。\n2. 联系详情\n   描述：作为系统新用户，已提供个人详情，继续收集捐赠者的联系详情。\n\
    \   事件流\n   基本流：在系统中注册。\n   前置条件：已提供个人详情。\n\n"
