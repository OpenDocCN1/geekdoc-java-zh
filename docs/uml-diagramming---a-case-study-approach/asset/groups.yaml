    图 4.6 UML 类图。


    ## 4. 修改密码


    描述：这允许您更改密码。

    事件流


    - 基础流程：用户可以出于安全考虑更改密码。

    - 备用流程：他们可以继续使用旧密码。

    - 前置条件：他们应该进入个人资料页面。

    - 后置条件：更改应成功更新到数据库中。


    ## 5. 联系用户


    描述：这提供了用户之间的通信方式。

    事件流


    - 基础流程：允许用户之间进行通信。

    - 备用流程：尝试其他联系方式。

    - 前置条件：用户应有可用的联系详情。

    - 后置条件：无。


    ## 6. 当前交易


    描述：允许用户查看所有的交易。

    事件流


    - 基础流程：用户可以查看他们的待处理和已完成的交易。

    - 备用流程：他们可以联系参与交易的另一个用户。

    - 前置条件：用户至少应有一个交易可以查看。

    - 后置条件：他们可以跟踪待处理交易的进度。


    ## 7. 编辑个人资料


    描述：允许用户编辑他们的个人资料。

    事件流

    - 基础流程：用户可以编辑其个人资料并保存更改。


    ## 64 UML 绘图


    ![](img/d57b893f2cab246eeea62e79849bffd0_78_0.png)


    图 4.7 UML 活动图（部分 1）。


    - 备用流程：他们可以仅查看资料。

    - 前置条件：他们应该进入个人资料页面。

    - 后置条件：更改应成功更新到数据库中。


    ### 8. 按类别筛选


    描述：这是搜索用户的子用用例，用户可以按类别（财务等）对用户进行过滤。


    事件流

    - 基础流程：用户应指定类别类型，该类别将与数据库进行比较以检索所需用户。

    - 备用流程：用户可以按评分过滤，或查看无任何过滤的所有用户。

    - 前置条件：用户应通过在系统中注册拥有已验证的个人资料以搜索其他资料。

    - 后置条件：用户可以联系任何其他用户。


