    ## 第15 章


    ## 网上商店的 UML 图图设计


    ## 15.1 问题描述


    公共配销系统（PDS）是一项粮食安全系统。它由印度消费者事务、食品和公共配销部建立并与州政府共同管理。传统的 PDS 用于向有效的粮票持有者分发食品。粮票的有效性和分配由州政府监控。根据
    PDS 的标准，粮票持有者应获得 35kg 粮食。然而，配送流程的效率存在担忧。为了提高效率并改进目前的 PDS 系统，我们正在实施网上商店。在这里，我们将创建一个购物网站。粮票持有者可以通过该网站在线订购食品。使用该网站的主要目的是使该过程流程化，消除目前基于粮票发放产品的缺点。PDS
    的主要缺点因其偏见未能有效服务贫困群体而受到批评。此外，许多店主在公开市场上出售大量粮食。许多 PDS 经销商由于获取而采取违规行为，通过此项目正在解决这个问题。大多数情况下，用户无法获得权利。为了避免这些缺点，建议案例的各种意义在于：每个商店的地理位置将标记在地图上、关于店主和地区的所有信息、营业时间、分类库存、零售商可以添加、编辑、删除和更新商店的其他商品、零售商可以宣传自己的商店、定期通知库存情况、产品交付功能、用户投诉表、通过
    PayTM、COD 等便捷支付系统、针对政府和店主的管理员功能，以及通过 Aadhaar 号和一次性密码（OTP）的身份验证系统（图 15.1–15.8）。


    ## 15.2 UML 图图


    ![](img/d57b893f2cab246eeea62e79849bffd0_182_0.png)


    图 15.1 UML 用例图。


    ### 用例规范


    ### 1. 邮件通知


    描述：商店的营业时间和其他详细信息将通过邮件发送给客户。


    ### 事件流

    基本流程：发送邮件。

    替代流程：无。


    前置条件：应从数据库检索用户的电子邮件地址。


    后置条件：用户可以从我们作为附件发送的链接进行购买。


