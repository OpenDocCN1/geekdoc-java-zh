    # 第 35 章


    # GUIDE – 直代网站的 UML 图设计


    ## 35.1 问题描述


    我们学院的学生有很多闲置的用物品，而许多其他人可能需要这些物品。因此，我提议建立一个网站，用于与需要这些物品的人进行销售或交易。这在学生和教职员工之间买卖二手书籍或学习材料的情况下，被证明是极其用的。


    最初，该网站仅供 PSG Tech 大学校区内的学生访问。以后，如果达到预期，将将其扩展到其他学院。卖家将获得特殊账户，根据其之前的记录对其进行评分，买家可以据此选择卖家。


    ### 功能：


    - 1. 买家可以选择由其控制风险的支付选项。

    - 2. 用户友好的网站布局。

    - 3. 买家可以在卖家面前检查产品，以确保客户的满意度（图 35.1-35.8）。


    ## 35.2 UML 图


    ### 参与者规范


    - 1. 管理员 – 管理员控制产品的组织，并报告有关产品和货物流动的统计数据。

    - 2. 客户 – 客户可以查看产品，并在愿意时购买产品。在成功购买后，他们将被要求对产品进行评分。


    DOI: 10.1201/9781003287124-35


    ![](img/d57b893f2cab246eeea62e79849bffd0_372_0.png)


    图 35.1 UML 用例图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_372_1.png)


    图 35.2 UML 活动图。


    - 3. 卖家 — 卖家可以添加或删除他发布的产品。这并不阻止他使用同一账户从其他卖家处购买产品。


    ![](img/d57b893f2cab246eeea62e79849bffd0_373_0.png)


    图 35.3 UML 时序图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_374_0.png)


    图 35.4 UML 协作图。


    ### 用例规范


    ### 1. 登录

    描述：买家有自己的用户名和密码。通过这些信息，他必须登录系统。

    事件流

    基本流：允许进入系统。

    替代流：抛出错误消息。

    前置条件：用户名和密码应正确。

    后置条件：无。


    ### 2. 注册

    描述：买家和卖家可以注册新账户。

    事件流

    基本流：为用户添加新账户。

    替代流：可以出于任何实际原因取消注册。

    前置条件：用户名和密码应符合开发者设置的规则和条件。

    后置条件：无。


    ### 3. 消息

    描述：买家和卖家可以通过聊天功能相互联系。

    事件流

    基本流：允许用户之间交换消息。


    ![](img/d57b893f2cab246eeea62e79849bffd0_375_0.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_1.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_2.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_3.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_4.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_5.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_6.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_7.png)

    ![](img/d57b893f2cab246eeea62e79849bffd0_375_8.png)


    图 35.5 UML 状态图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_376_0.png)


    图 35.6 UML 类图。


    ### 4. 查看产品

    描述：买家可以查看他们想要的产品。

    事件流

    基本流：允许访问产品。

    替代流：卖家拒绝。

    前置条件：产品可用。

    后置条件：无。


    ### 5. 验证登录

    描述：在数据库中验证用户提供的详细信息。

    事件流

    基本流：登录成功。

    替代流：显示错误消息。

    前置条件：信息正确。

    后置条件：无。


    ### 6. 错误

    描述：用户提供的信息与数据库不匹配。

    事件流

    基本流：抛出错误消息。

    替代流：无。

    前置条件：信息不正确。

    后置条件：无。


    ### 7. 帮助

    描述：卖家可以向买家提供信息。

    事件流

    基本流：提供信息。

    替代流：无。

    前置条件：卖家处于活跃。

    后置条件：无。


    ### 8. 删除产品

    描述：卖家可以删除他们列表的产品。

    事件流

    基本流：产品从系统中移除。

    替代流：无。

    前置条件：产品存在。

    后置条件：无。


    ### 9. 添加产品

    描述：卖家可以添加新产品。

    事件流

    基本流：产品已添加。

    替代流：无。

    前置条件：卖家已登录。

    后置条件：无。


    ### 10. 购买产品

    描述：买家可以支付产品。

    事件流

    基本流：处理支付。

    替代流：无。

    前置条件：买家有资金。

    后置条件：无。


    ### 11. 评分

    描述：买家可以根据经验对产品进行评分。

    事件流

    基本流：记录评分。

    替代流：无。

    前置条件：买家已购买产品。

    后置条件：无。


    ### 12. 资金交易

    描述：客户通过应用程序向卖家付款。

    事件流

    基本流：完成交易。

    替代流：无。

    前置条件：支付有效。

    后置条件：无。


    ### 13. 分类

    描述：管理员在不同类别之间移动产品。

    事件流

    基本流：产品已移动。

    替代流：无。

    前置条件：类别存在。

    后置条件：无。


    ### 14. 报告统计数据

    描述：管理员根据标准准备统计数据。

    事件流

    基本流：生成统计数据。

    替代流：无。

    前置条件：已收集数据。


    - 15. 消息


    ![](img/d57b893f2cab246eeea62e79849bffd0_377_0.png)


    图 35.7 组件图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_378_0.png)


    图 35.8 部署图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_380_0.png)


