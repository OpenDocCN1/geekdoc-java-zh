    \n基本流程：BPO 组织可以上传必要的文档。\n\n备选流程：联系客户并延长上传最终产品的截止日期。\n\n前提条件：BPO 组织和客户应对该请求达成一致。\n\
    \n后置条件：文档将存储在数据库中。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_88_0.png)\n\n#\
    \ 第 5 章\n\n## 巴士电子票系统的 UML 图设计\n\n### 5.1 问题描述\n\n在该案例研究中，通过软件维护与开发中心 (SMDC) 旅行社制作了一个软件包，用于自动处理手动预订巴士票程序。具体而言，该案例研究的目标包括提供一个基于\
    \ Web 的巴士票预订功能，客户可以通过在线系统购买巴士票，而无需在柜台排队购买，使客户能够在线查看巴士的可用性和类型。客户可以通过系统查询每个印度游客中心\
    \ (ITC) 巴士的出发时间，通过向各个指定银行付款后获取银行 码来简化巴士票付款、客户取消订单的能力，以及管理员用户在更新和取消付款、路线和车辆记录方面的权限（图\
    \ 5.1–11）。\n\n### 5.2 UML 图\n\n76 UML 图绘制\n\n图 5.1 UML 用例图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_90_0.png)\n\
