    \ 3.22 Case 3.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_72_0.png)\n\n# Chapter\
    \ 4: Design of UML Diagrams for Business Process Outsourcing (BPO) Management\
    \ System\n\nThe proposed software will be user-friendly, so that all interactions\
    \ between a BPO (Business outsourcing) organization and clients can be done through\
    \ the software. The required source documents can be easily uploaded and sent\
    \ to the BPO organization and vice versa. One of the problems is the communication\
    \ between the client and the BPO organization being limited to face-to-face interaction,\
    \ which is costly and time-consuming. There are costs due to printing and the\
    \ security of documents, which can be prevented as documents are stored in digital\
    \ form with high security. The system should mainly focus on providing login for\
    \ the source users (client and BPO organization), and a facility to search the\
    \ other party to initiate any project agreements. Source documents can be easily\
    \ uploaded, and the service provided by the BPO organization can also be uploaded\
    \ for quality testing. The core motive of the software is to provide communication\
    \ between the users with the least cost. This is essential because of the growth\
    \ of the BPO segment in the present economy. This system will be crucial when\
    \ organizations wish to outsource their work. It will affect the BPO organization\
    \ and the clients who wish to seek their service. If this software gets implemented,\
    \ conveying information will be easier as it is through the internet.\n\n## 4.1\
    \ Problem Statement\n\n## 4.2 Functional Requirements\n- Login – provides a personalized\
    \ profile for each user, to ensure security.\n- Profile changes – each user can\
    \ personalize their account, and change their password.\n- Post project request\
    \ – clients post their request with requirements for BPO organizations to choose\
    \ from.\n- Search requests – BPO organizations can search and respond to requests.\n\
    - Upload source documents – the documents required by the BPO organization can\
    \ be transferred through the system, and the receiver can download them.\n- Check\
    \ progress – clients should be constantly updated with the progress of the work.\n\
    - Quality check and testing – the clients can check their product and quote any\
    \ modifications.\n- Upload product/service – BPO organization should upload their\
    \ product/service for the further procedure (payment, shipment, etc.).\n- Payment\
    \ – clients should pay the BPO organization at the end of their agreement.\n-\
    \ Shipment – the product/service should be delivered to the clients.\n- Rating\
    \ – the clients can rate the service provided by the BPO organization (Figures\
    \ 4.1–4.19).\n\n## 4.3 Design and Design Constraints\n\n### Usecase Specification\n\
    #### Accept Request\nDescription: It allows BPO organization to accept the request.\n\
    Flow of Events\nBasic Flow: BPO organization accepts the request and thereby initiates\
    \ the deal.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_74_0.png)\nFigure 4.1\
    \ Login page.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_74_1.png)\nFigure 4.2\
    \ Client profile – Upload request.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_75_0.png)\n\
    Figure 4.3 Client profile - Current deals.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_75_1.png)\n\
    Figure 4.4 Client profile – Search BPO Organization.\n\nAlternative Flow: BPO\
    \ organization can search for other clients.\nPre-Conditions: The client should\
    \ post a request.\nPost-Conditions: It should be added into the current deals.\n\
    \n#### Card\nDescription: It is sub-usecase of payment, where this method can\
    \ be chosen in case the client wishes to pay by card.\nFlow of Events\nBasic Flow:\
    \ The final amount of money will be displayed, and once paid, the BPO organization\
    \ can verify the status of the agreement to ‘paid’.\nAlternative Flow: The BPO\
    \ can sue the client using the evidence of their agreement from the database.\n\
    Pre-Conditions: Previous procedures, such as upload the final product and quality\
    \ check must be completed.\nPost-Conditions: The status of the agreement should\
    \ be updated in the database as 'paid' or 'completed'.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_76_0.png)\n\
    Figure 4.5 UML usecase diagram.\n"
