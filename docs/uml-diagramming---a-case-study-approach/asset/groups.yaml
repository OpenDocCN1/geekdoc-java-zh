    # Chapter 27


    # Design of UML Diagrams

    for e-Med Medical Assistance Tool


    ## 27.1 Problem Statement


    e-Med is your perfect medical friend. We often see our grandparents forgetting
    to take their medicines or getting tense when they run out of medical supplies.
    In this fast-paced world with unhealthy lifestyles, a number of young...


    ## 27.2 UML Diagrams


    Actor Specification


    - Customers/Users – The users of this tool are people of all ages with chronic
    issues who need to take medicines regularly to keep healthy. Users must record
    their medical history and update medical history whenever required. They can schedule
    appointments regularly with their doctor. They can press the emergency button
    when a critical situation. They can also write and update medical notes.


    # 288 UML Diagramming


    ![](img/d57b893f2cab246eeea62e79849bffd0_302_0.png)


    Figure 7.1 UML usecase diagram.


    ![](img/d57b893f2cab246eeea62e79849bffd0_302_1.png)


    Figure 7.2 UML activity diagram.


    + 2. Admin (Database) – The database stores all the information about the users,
    medical history, notes, etc. It initiates operations like sending notifications
    when it is time for the users to take their medicine or restock medicines. It
    also sends a message to the receptionist to schedule an appointment and calls
    the emergency contacts as soon as the emergency button is pressed.


    # Diagrams for e-Med Medical Assistance Tool ■ 289


    ![](img/d57b893f2cab246eeea62e79849bffd0_303_0.png)


    Figure 27.3 UML sequence diagram.


    # 290 UML Diagramming


