    wait semantics.<br>- Wait semantics is a situation where the sender needs an acknowledgement
    of each message from the receiver before transmitting the next successive message.<br>-
    The notation of a synchronous message is a solid line with a shaded arrow head.

    ![Object a : Class A, Object b : Class B, 1 : Synchronous Message()] |

