    # Chapter 39


    # Design of UML Diagrams for STARTUP MEET


    # 39.1 Problem Statement


    The policies and guidelines for startups vary from state to state. Also, startups
    related to a particular domain are emphasized in particular areas. The people
    with the startups ideas at different levels of implementation have to approach
    different firms or individuals for investment who are in their nearest business
    circles, if not in the same state. All of these will adversely impact the opportunities
    for the startups. Startup meet is a platform for people to privately approach
    firms or angel investors with their ideas implemented at different levels for
    funding and mentorship. Also, the government policies and loan schemes of different
    states can be known and applied. If people are interested in the idea a virtual
    presentation can be given about it to them. There will be profiles for investors
    and entrepreneurs (people with startup ideas) where they will describing what
    they are looking for. The entrepreneur has to request investors or mentors from
    different states for submitting his ideas. Once accepted he can send an abstract
    about it. If the investors like it, they can call for a presentation of it. The
    mentors can also give mentorship. The government loans and policies can be viewed
    and also applied through the portal. So, startup meet is a comprehensive platform
    for people who are into startups (Figures 39.1–39.8).


    # 39.2 UML Specification


    Actor


    +   1. Investors – Investors will check startup ideas and either accept to invest
    or reject.

    2. Mentors/Consultants – Mentors may/may not accept mentorship based on a startup
    idea.

    3. Entrepreneur – He pitches the startup ideas to investors for investments and
    to mentors for mentorship.

    4. Admin – He maintains all the records of the application users and their credentials.'
