    # Chapter 38


    # Design of UML Diagrams

    for Website Development


    ## 38.1 Problem Statement


    Mega Associates is an evolving architectural firm that is facing a fierce competition.
    The competitors have a modern, well-built website that is pulling some of the
    firm''s clients towards themselves. In order to avoid a situation like this and
    retain all the firm''s clients and to attract new ones, a refreshing website is
    needed. The website of the firm should include the major projects of the firm,
    a brief on all the available departments and collaborations, recent news with
    respect to the firm, the firm''s insights, the history of the firm, mail or chat
    feature, and career opportunities with regard to the firm (Figures 38.1–38.8).


    ## 38.2 UML Diagrams


    ### Actor Specification


    - 1. Customer – Firm’s customer who visits the website to know/contact the firm.

    - 2. Employee Candidate – Any college graduate or other architects who look for
    job opportunities with the firm.

    - 3. Firm’s Employee – He/she is a firm’s employee who is in charge of the updates
    with regards to the firm.


    ### Usecase Specification


    + 1. Display Projects

    Description: Functionality involves displaying all the major projects done by
    the firm.

    Flow of Events

    Basic Flow: Displays the projects of the firm.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    ![](img/d57b893f2cab246eeea62e79849bffd0_404_0.png)


    Figure 38.1 UML usecase diagram.


    + 2. Collaborations

    Description: This functionality tells about the various collaborations of the
    firm with other Companies/firms.

    Flow of Events

    Basic Flow: Explains about the various collaborations of the firm.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: If the customers want to contact the firm for a collaboration,
    they can use the contact from the firm from the details given in the contact functionality.


    + 3. Available Departments

    Description: This functionality talks about the available departments in the firm
    and the services they can offer.

    Flow of Events

    Basic Flow: Displays the departments and the services offered by the firm.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: If the customers want to contact the firm for a project, they
    can use the contact from the firm from the details given in the contact functionality.


    + 4. History of the Firm

    Description: This functionality displays the history of the firm.

    Flow of Events

    Basic Flow: Displays the history of the firm.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    ![](img/d57b893f2cab246eeea62e79849bffd0_405_0.png)


    Figure 38.2 UML activity diagram.


    ## 5. News/Blog


    Description: This functionality gives the recent news with respect to the firm.

    Flow of Events

    Basic Flow: Displays the recent news with respect to the firm.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: It is updated regularly by the update functionality.


    ## 6. Career Opportunities


    Description: This functionality displays all the available job opportunities with
    respect to the firm.

    Flow of Events

    Basic Flow: Displays career opportunities.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: It is updated regularly by the update functionality.


    ## 7. Photos


    Description: This functionality displays the projects to the firm in the form
    of photos.

    Flow of Events

    Basic Flow: Displays pictures of projects.


    ![](img/d57b893f2cab246eeea62e79849bffd0_406_0.png)


    Figure 38.3 UML sequence diagram.


