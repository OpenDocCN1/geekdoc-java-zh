    # 第 23 章


    # AAROGYA SETU – 健康类应用的 UML 图表设计


    ## 23.1 问题描述


    新冠病毒肺炎正在大规模传播。专家建议，社交距离长期以来一直是减少疾病峰发和传染性疾病的方法之一。仅在印度，过去两周的病例就急剧增加，导致了更严厉措施的实施。通过识别“热点地区”，必要的地图绘制有助于处理社区传播问题，即病例开始在人群中扩散，导致人们不知道自己是如何接触病毒的。这被称为爆发的“第
    3 阶段”。Aarogya Setu 应用是一种冠状病毒追踪器，它基于接触者追踪原理工作，可以帮助用户识别其周围的冠状病毒“热点”。它可以帮助人们保持安全，并在病例发生地区采取必要的预防措施，从而在一定程度上帮助停止或防止传播。基于地理标记，它还可以向特定用户提醒其与附近感染病例或热点的距离。该应用还帮助用户进行风险自测并监测其健康状况，考虑到在某些时期出门访问健康诊所可能很困难（最重要的是，出门访问是不特别安全的）。


    Aarogya Setu 应用还帮助人们识别症状，提醒他们最佳的安全预防措施以及有关 COVID-19 传播的相关信息。虽然这是一项高尚的举措，但该应用还为被归为“高风险”类别的人列出了基本的隔离措施。它还可以帮助有旅行史的人进行自我隔离，并防止任何传播风险（图
    23.1–23.8）。


