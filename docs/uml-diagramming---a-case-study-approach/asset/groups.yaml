    ## Chapter 28 Design of UML for Diet Care


    ### 28.1 Problem Statement

    Health is wealth. Health plays a major role in everyone’s life. People consume
    unhealthy food and ruin their health. This application provides nutrients to improve
    health. Users can provide their daily cycle and get recommendations. They can
    also provide their medical reports to get nutrients according to their medical
    state. recommendation is provided by a trained machine model (Figures 28.1–10).


    ### 28.2 UML Diagrams


    1. Data Base – A system that maintains organized data.

    2. Professional Nutritionist – A person who is expert in nutrition science and
    can solve user’s issues.

    3. System – An Interface that accepts the user’s request and provides the result.

    4. Trained Model – Machine learning model that can suggest the healthy diet.

    5. User – People who are making use of this application.


    Usecase Specification

    ### Analysis

    Description: Finding malnutrition and disease/deficiency from users’ data.

    Flow of Events

    Basic Flow: Scan user input and find malnutrition or any disease name.


