    # 第 8 章


    # DigiDocLocker 的 UML 图设计


    ## 8.1 问题描述


    在单一位置物理地维护真实文档被认为是一项挑战性任务。因此，文档数字化使得所有物理文档能够集中存储，从而能够随时随地从任何地方进行检索。它还可以防止由任何此类物理证书带来的麻烦。这可以通过
    DigiDocLocker 实现，它是一个用于数字格式颁发和验证文档及证书的平台，从而消除对物理文档的使用。DigiDocLocker 的目标是通过让公民能够从这些证书的原始颁发处以数字格式访问驾照、车辆登记和学术成绩单等真实文档/证书来受益。DigiDocLocker
    具有以下功能：


    - i. 注册模块允许用户注册，登录模块允许授权用户登录。

    - ii. 上传模块允许用户以各种文件格式上传驾照、车辆登记、学术成绩单和其他相关文档。

    - iii. 资料模块显示用户的完整个人资料。

    - iv. 颁发模块向颁发者显示证书。

    - v. 请求模块向请求者显示文档。

    - vi. 验证模块允许对文档进行验证。


