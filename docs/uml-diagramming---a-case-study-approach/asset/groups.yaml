    \ Boolean | | |\n\n28.8 UML 类图。\n\n## 6. 查找健康食品\n\n描述：查找能对抗对应疾病或缺乏的健康食品。\n事件流\n\
    基本流：搜索具有特定营养以对抗该疾病/缺乏的食物。\n替代流：无。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_315_0.png)\n\
