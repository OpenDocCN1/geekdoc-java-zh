    # 第 24 章


    # 药管理系统的 UML 图设计


    ## 24.1 问题描述


    客户去商店购买所需的药物。这浪费了大量时间并让人感到疲累。如果他想更换产品，则必须再次去商店进行更换。整个过程取决于物理交互。在线药店（Online Pharmacy）易于使用和订购。客户选择所需的药物并点击一下即可下单。在此之前，客户需要创建登录账户并填写姓名、地址、任何
    ID 号等所有详情。客户可以查看药物的状态。应用程序的业务目标是为所有人提供药物，管理员将提供供应商详情（图 24.1–24.20）。


    ## 24.2 UML 图


    ### 参与者规范


    - 1. 客户 – 他/她可以创建账户在线订购/查看药物。

    - 2. 管理员 – 他/她可以根据需要查看、更新药物可用性。他/她查看客户详情并可以更新快递员的考勤情况。

    - 3. 快递员 – 他可以查看配送地址，可以更新/查看自己的个人资料考勤。


    ### 用例规范


    ### 1. 登录

    描述：允许客户登录页面。

    事件流


    ![](img/d57b893f2cab246eeea62e79849bffd0_262_0.png)


    图 24.1 UML 用例图。


    基本流：登录页面。

    备用流：为新客户创建登录账户的请求。

    前提条件：客户应该已经有一个账户可以登录。

    后条件：跳转到主页。


    ### 2. 注册

    描述：允许客户创建账户。

    事件流

    基本流：创建账户。

    备用流：已注册的客户可以直接登录。

    前提条件：创建账户时应填写所有所需的详情。

    后条件：注册后，跳转到登录页面。


    ### 3. 账户/个人信息

    描述：客户可以编辑自己的信息。

    事件流


    ![](img/d57b893f2cab246eeea62e79849bffd0_263_0.png)


    图 24.2 UML 活动图 – 用户。


    ![](img/d57b893f2cab246eeea62e79849bffd0_264_0.png)


    图 24.3 UML 活动图 – 管理员。


    基本流：可以编辑/更新信息。

    备用流：可以查看信息。

    前提条件：客户必须填写有效信息。

    后条件：跳转到主页。


    ### 4. 查看订单

    描述：客户可以查看他们所选择的订单。

    事件流

    基本流：客户可以添加/删除产品。

    备用流：跳转到主页。

    前提条件：显示已添加的订单数量。

    后条件：跳转到愿望清单页面或购物车。


    ### 5. 加入愿望清单

    描述：客户可以将其选择的产品加入愿望清单。

    事件流

    基本流：将客户选择的产品加入愿望清单。

    备用流：跳转到主页。

    前提条件：显示客户选择的愿望清单产品。

    后条件：跳转到主页。


    ### 6. 加入购物车

    描述：显示客户添加到购物车的商品。

    事件流

    基本流：显示购物车中的产品。

    备用流：跳转到查看订单页面。

    前提条件：必须将商品添加到购物车才能订购。

    后条件：跳转到查看订单页面或订单确认/取消选项。


    ![](img/d57b893f2cab246eeea62e79849bffd0_265_0.png)


    图 24.4 UML 活动图 – 快递员。


    ![](img/d57b893f2cab246eeea62e79849bffd0_266_0.png)


    图 24.5 UML 时序图 – 客户。


    ### 7. 订单确认

    描述：显示客户确认的订单。

    事件流

    基本流：显示已确认的订单。

    备用流：跳转到主页。

    前提条件：至少有一个订单可以确认。

    后条件：跳转到主页。


    ### 8. 订单取消

    描述：提供取消客户确认的订单的功能。

    事件流

    基本流：取消订单。

    备用流：跳转到主页。

    前提条件：至少有一个订单可以取消。

    后条件：跳转到主页。


    ![](img/d57b893f2cab246eeea62e79849bffd0_267_0.png)


