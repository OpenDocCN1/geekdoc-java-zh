    # Chapter 40


    # Design of UML Diagrams for Video Suggestion System


    # 40.1 Problem Statement


    The Video Suggestion System is used in social networking platforms such as YouTube
    and Facebook. The ultimate aim of this system is to suggest the videos to the
    users based on the factors such as trending, similar views of the people and the
    Video Suggestion System will be found helpful in place of searching a video based
    on the preference and taste of the user and it also found it can play a role in
    the entertainment sector. The system begins with the collection of the history
    or activities of the users, processing the collected data, creating dataset for
    suggesting videos and finally when people refresh for the suggestion, it loads
    videos based on the dataset (Figures 40.1–40.14).


    # 40.2 UML Diagrams


    Actor Specification


    +   1. **Administrator** – Administrator is the superuser who has the access to
    edit and view all the records in the database.

    2. **Normal User** – Normal user who will be surfing the videos on the internet,
    get suggested videos and whose history recorded will be recorded for further suggestions.


