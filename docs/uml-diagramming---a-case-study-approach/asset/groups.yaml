    # Chapter 27


    # Design of UML Diagrams

    for e-Med Medical

    Assistance Tool


    # 27.1 Problem Statement


    e-Med is your perfect medical friend. We often see our grandparents forgetting
    to take their medicines or getting tense when they run out of medical supplies.
    In this fast-paced world with unhealthy lifestyles, a number of young people also
    have some medical issues. e-Med is a tool that helps keep track of and address
    all your personal medical needs. Once the data is fed regarding the schedule of
    intake of medicines, this tool will provide reminders for taking the medicines.
    It will also send notifications to restock the medicines. It is also programmed
    to schedule monthly or yearly appointments regularly with the family doctor. Another
    interesting feature of this tool is during critical situations, pressing the emergency
    button will automatically contact your near and dear whose contacts are in your
    emergency contact list. The tool helps in keeping a record of your medical history
    such as your blood sugar, pressure levels, etc. by using the Medical Notes feature.
    e-Med is an indispensable tool for people of all ages with medical issues to maintain
    a good health routine (Figures 27,1–28).


    # 27.2 UML Diagrams


    Actor Specification


    +   - Customers/Users – The users of this tool are people of all ages with chronic
    health issues who need to take medicines regularly to keep themselves healthy.
    Users must record their medical history and update medical history whenever required.
    The users can schedule appointments regularly with their doctor. They can press
    the emergency button when a critical situation arises. They can also write and
    update medical notes.'
