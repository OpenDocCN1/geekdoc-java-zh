    事件流程

    备选流程：用户可以使用系统查看画廊中的物品，而不一定购买任何东西。

    前置条件：用户应已正确登录并检查了库存可用性。

    后置条件：无。


    ![](img/d57b893f2cab246eeea62e79849bffd0_365_0.png)


