    事件流\n基本流：将视频保存到 LIKES 列表中。\n备用流：无。\n前置条件：创建账户。试用用户只能使用一个月。\n后置条件：获取与这些点赞视频相关的视频。\n\
    \n+ 10. 观看节目、电影、直播秀和新闻更新\n描述：观看管理员更新的节目、电影、新闻。\n事件流\n基本流：观看视频。\n备用流：无。\n前置条件：创建账户。试用用户只能使用一个月。\n\
    后置条件：将视频保存到 LIKES 列表中并稍后观看。\n\n# 第 32 章\n\n# 农场管理系统 UML 图设计\n\n# 32.1 问题描述\n\n\
    在印度，每四个农民中就有一位人拥有智能手机。但他们并没有利用它来根据实时数据（如天气、土壤状况、市场状况、劳动力可用性等）获取农业见解，而这些数据可以帮助他们做出数据驱动的决策以获得最佳结果。目前解决此类问题的技术要么是付费服务，要么是不准确。它们往往更加复杂，使得任何人都难以理解和解释。如果开发一个应用程序，其主要目标应该是降低风险、降低成本、提高产量，最重要的是让任何人都能于解释（图\
    \ 32.1–32.8）。\n\n# 32.2 UML 图\n\n参与者规范\n\n+ 1. 管理员 – 管理员控制整个系统。他/她能够能够查看、编辑和删除数据库中的记录，还可以更改用户所选查询的结果。还负责用户特定细节/结果的身份验证。\n\
    2. 用户 – 用户创建账户并使用应用的功能帮助他们做出数据驱动的决策。\n\n用例规范\n\n+ 1. 创建账户\n描述：用户可以为自己创建一个账户。管理员也可以为任何人创建账户。\n\
    事件流\n基本流：选择账户选项并输入相关细节。\n\n# 334 UML 图图\n\n![](img/d57b893f2cab246eeea62e79849bffd0_348_0.png)\n\
    \n图 32.1 UML 用例图。\n\n备用流：用户也可以使用其邮箱创建账户。\n前置条件：数据库中不存在具有当前细节的账户。\n后置条件：无。\n\n\
    + 2. 删除账户\n描述：用户可以从系统中删除自己的账户。管理员可以从系统数据库中删除任何账户。\n事件流\n基本流：管理员/用户选择删除账户选项并删除账户。\n\
    备用流：无。\n前置条件：账户必须存在。\n后置条件：不使用的账户被删除。由用户或管理员（在特定时间后）删除。\n\n# 3. 登录\n描述：用户登录系统。\n\
    事件流\n基本流：验证用户身份并授予访问系统的权限。\n备用流：细节无效，输入正确的细节。\n前置条件：账户必须存在。\n后置条件：无。\n\n# 4. 注销\n\
    描述：用户退出系统。\n事件流\n\n 农场管理系统 UML 图 ■ 335\n\n![](img/d57b893f2cab246eeea62e79849bffd0_349_0.png)\n\
    \n图 32.2 活动图。\n\n基本流：用户点击注销选项，账户被终止。\n备用流：无。\n前置条件：已登录。\n后置条件：无。\n\n# 5. 更新细节\n\
    描述：更新/修改账户的细节。\n事件流\n基本流：所有细节均可用。\n备用流：无。\n前置条件：已登录。\n后置条件：细节已更新。\n\n# 336 UML\
    \ 图图\n\n![](img/d57b893f2cab246eeea62e79849bffd0_350_0.png)\n\n图 32.3 序图。\n\n\
    # 农场管理系统 UML 图 ■ 337\n\n![](img/d57b893f2cab246eeea62e79849bffd0_351_0.png)\n\n\
    图 32.4 协作图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_351_1.png)\n\n图 32.5 状态图。\n\
    \n| 管理员 |\n| :--- |\n| #admin_ID: String |\n| #admin_Name: String |\n| #admin_Password:\
