    and reviewed for quality and testing.

    Alternative Flow: Quality and testing can be skipped to the payment procedure
    at the end.

    Pre-Conditions: BPO organization should upload documents of the final product.

    Post-Conditions: Comments from the client should be sent to the BPO organization.


    # 15. Rating


    Description: One user can rate the other user''s service based on their previous
    dealings.

    Of Events

    Basic Flow: At the end of the deal, the two users involved in the agreement should
    rate the other on a rating of 5 based on service.

    Alternative Flow: The user can choose to rate later or ignore.

    Pre-Conditions: The status of agreement should be closed – payment and shipment
    stages should be completed.

    Post-Conditions: The rating given should be averaged with previous ratings and
    stored in database for data retrieval when displaying.


