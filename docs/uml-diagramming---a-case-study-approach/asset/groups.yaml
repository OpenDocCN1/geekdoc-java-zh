    # Design of UML Diagrams for Webmed


    ![](img/d57b893f2cab246eeea62e79849bffd0_47_0.png)


    Figure 2.7 UML activity diagram (2).


    The interaction between the user and the service provider is clearly depicted
    in this diagram. The user is checked if the user is already registered to the
    system or not. If not registered to the system, the register function takes place.
    If registered, the user can log in the system with username and password. For
    this else case, the alternate fragment is used. After logging on to the system,
    the user is correctly prompted to the functionality based on the choice of the
    user. Hence to select the resource, the optional fragment is used. In order to
    access a doctor and the drugs and supplements, the user is checked for the insurance.
    If not, the service provider buys insurance for the user. This insurance is used
    for the payment of the resources utilized. The request from the user is sent as
    a synchronous message as the user needs the response for the request. The response
    is sent as a reply message. The complete flow of messages from the register to
    the payment and delivery of the purchased drugs is clearly depicted in the sequence
    diagram (Figure 2.10).


    It focuses on interaction between the actors in the same system as that of the
    sequence diagram. The collaboration diagram does not consist of any fragments.
    Hence the messages are used to represent the conditional and looping statement.
    The sequence diagram has 34 messages. But the collaboration diagram has 35 messages.
    This extra message (23) is used to prevent the overlapping of messages. Since
    the entire payment function involves overlapping of messages, an extra message
    is used to indicate the start of the payment function. A component is a replaceable
    and executable piece of a system whose implementation details are hidden. A component
    consists of the set of interfaces that a component realizes or implements. Components
    also require interfaces to carry out function. In this diagram, every component
    is an individual module that encompasses all its attributes and operations. The
    user component can access all the resources. The user component consists of the
    resources, health A–Z, news and experts as it can access them directly. The database
    subsystem consists of all the artifacts that are required for the system. The
    service provider is a service that takes care of the processes like financing,
    placing order to buy those drugs that are out of stock. The drug supplier component
    supplies the drugs to the service providers for which the payment is done (Figures
    2.11 and 12).'
