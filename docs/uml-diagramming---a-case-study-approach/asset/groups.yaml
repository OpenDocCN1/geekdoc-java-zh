    ## 第 21 章


    ## 智能交通管理系统 UML 图设计


    ## 21.1 问题描述


    在我们的现代大都市中，人们并不遵守交通规则。其结果是不幸性的。在印度，总死亡人数的 64.4% 归于交通事故。随着汽车的革命化，车辆数量不断增加。传统的交通信号既高效也不智能。智能交通系统旨在通过对违反交通规则的人采取预防性措施来减少事故风险。摄像头监控高流量道路以辅助交通信号。使用图像处理进行头盔和安全带检测以警告驾驶员。当驾驶员违反法律超过两次时，通过摄像头捕获的车牌将驾驶员详情提交给交通警察。路灯根据夜间道路的人口密度进行操作，从而节省电力。如果违反法律，将注销执照作为处罚。由于超速，驾驶员详情将传递给后续信号灯。自动交通灯调节交通流以避免拥堵（图
    21.1–28）。


    ## 21.2 UML 图


    执行者规范


    - 驾驶员：驾驶员指所有驾驶任何类型车辆且不遵守交通规则的公民。

    - RTO 服务器：RTO 服务器是存储所有注册车辆信息（地址、车辆详情）的数据库，监控交通信号。

    - 交通警察：在现场调节交通的警察、巡逻车和道路安全员。


