    # UML Diagramming


    Functionalities:


    - Registration: The users of the application are registered with unique credentials
    and categorized as patients, health workers or a government authority.


    - Login: The login section is for users to login to the application using the
    unique credentials provided during the registration phase.


    - Logout: The logout option is included in the user''s user interface enabling
    the user to log out of the application at any time the user wants to.


    - Data Entry: A section to enter all the medical details as well as the various
    social and economic details unique identification details for the patient user
    and registered identification for the health workers.


    - Validation of Medical Data: The details entered by the patient will be corroborated
    by the details furnished by the respective hospital medical records of the patients.


    - Patient Dashboard: A catered dashboard for every patient user with articles
    relating to the patient''s present medical conditions and the possible ailments
    that the patient may be prone to, obtained by analysis of the patient''s medical
    records. It also incorporates a search bar to search for specific articles relating
    to a medical term.


    - Health Worker Dashboard: A dashboard for every health working registered medical
    institution that provides informative articles pertaining to the worker''s area
    of specialization.


    - Health Tracking: A section that provides a health-tracking facility by means
    of analytics of the patient''s individual health records furnished by the patient
    as well as the healthcare establishments from synchronize the data from other
    health monitoring applications in the user''s device and include them for health
    tracking.


    - Alerts: Alerts are scheduled for all the users and dispatched to the patients
    whenever an activity is due such as a health checkup or a medical camp and dispatched
    to the health workers to catch up on a scheduled activity.


    - Activity Scheduling: Activities of the health workers are scheduled according
    to the requirements of the patients based on various medical and social factors
    and the progress of these planned activities can be tracked.


    - Analytics: All the exhaustive data that goes into the application is analysed
    for patterns of medical disparities based on family and community issues and socio-economic
    determinants and a holistic report of this data is presented in the dashboard
    accessible to the authorized government authority to bring about the appropriate
    health.


    - Health Financing: Using the application''s analytics data, the government should
    be able to implement substantial schemes to bring forth health equity for all
    the affected individuals by initiating health financing schemes with various state-level
    agencies through an authorized section in the application (Figures 25.1–25.12).


    ## 25.2 System Architecture


    ![](img/d57b893f2cab246eeea62e79849bffd0_281_0.png)


    Figure 25.1 System architecture.


    ![](img/d57b893f2cab246eeea62e79849bffd0_281_1.png)


    Figure 25.2 DFD – Level 0.


    ![](img/d57b893f2cab246eeea62e79849bffd0_282_0.png)


    Figure 25.3 DFD – Level 1.


    ## 25.3 UML Diagrams


    ### Actor Specification


    - 1. Government – The government receives a complete detailed report of analytics
    of any kind of disparities or anomalies based on region, location, history, economy
    and records. The government after receiving the data will take the appropriate
    measures to overcome these disparities.

    - 2. Health Worker – A health worker belongs to a particular health institution.
    The job of the health worker is to verify the data provided by the patients to
    the records in the hospital. This verified data is then sent to the cloud where
    analytics on the data is performed. The analytics are based on region, location,
    history, economy and records. The health worker also has access to the health
    performance of patients. This health tracking helps the health workers organize
    routine check-ups based on their health.

    - 3. Patient – The patient is the most important aspect of this project. A patient
    provides or her medical data. This data is then verified by the health workers.
    The patient will be given a detailed description of their health in a patient
    dashboard. The patient dashboard tracks health of each patient. The health tracking
    enables the software to send alerts to the patients on any kind of medical update.

    - 4. State Agencies – After the government analyses the reports, the government
    takes the help of the state agencies to solve these medical disparities. The state
    agencies have access to the health financing data along with a detailed description
    of how the government wants them to help. The state agencies have no access to
    the private data of the patient.


    ![](img/d57b893f2cab246eeea62e79849bffd0_283_0.png)


    Figure 25.4 UML usecase diagram.


    ## Usecase Specification


    - 1. Activity Scheduling


    Description: This is used to schedule activity for the health workers on the basis
    of the analyzed information in order to remove disparities''.


    Flow of Events


    Basic Flow: The activity scheduling usecase makes of data from analytics usecase
    and generates a health worker schedule accordingly.


    Pre-Conditions: Data Entry and Analytics usecases should have been invoked.


    Post-Conditions: The activity is displayed on the health worker dashboard.


    - 2. Alerts


    Description: Alerts are scheduled for all the users and dispatched to the patients
    when an event is due such as a health checkup or a medical camp and dispatched
    to the health workers to catch up on a scheduled activity.


    Flow of Events


    Basic Flow: Based upon the activity schedule and the data analytics, appropriate
    alerts are sent to the users.


    Pre-Conditions: Activity Scheduling and Analytics usecases must be invoked.


    Post-Conditions: The alerts are displayed on the health worker dashboard.


    ![](img/d57b893f2cab246eeea62e79849bffd0_284_0.png)


    Figure 25.5 UML activity diagram – Part (1).


    ![](img/d57b893f2cab246eeea62e79849bffd0_285_0.png)


    Figure 25.6 UML activity diagram – Part (2).


    ### 3. Analytics


    Description: All the exhaustive data that goes into the application is analyzed
    for patterns of medical disparities based on family and community issues and socio-economic
    determinants.


    Flow of Events


    Basic Flow: The data entered into the application is analyzed and categorized
    based on severe factors and sent to the other usescases and results from those
    usescases are combined to obtain a holistic report.


    Alternate Flow: The data is categorized into Economy-, Location-, History-, and
    Records-based classifications.


    Pre-Conditions: Data Entry and Health Tracking usescases must be invoked.


    Post-Conditions: The report of the analyzed data is for activity scheduling and
    health financing alerts and the report details are displayed on the government
    dashboard.


    ### 4. Data Entry


    Description: A section to enter all the medical details as well as the various
    social and economic details including unique identification details for the patient
    user and for registered identification details for the health workers.


    Flow of Events


    Basic Flow: Various fields are provided for the user to feed the medical data
    into the application.


    Pre-Conditions: Login and Registration usescases must be invoked.


    Post-Conditions: The data collected from the patients are sent for validation
    and following the validation, the data is given to health tracking and analytics
    uses.


    ![](img/d57b893f2cab246eeea62e79849bffd0_286_0.png)


    Figure 25.7 UML sequence diagram.

