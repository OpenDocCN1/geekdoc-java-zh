    # 第12 章

    # 律师日记的 UML 图设计


    ## 12.1 问题描述


    本案例研究有助于那些在忙碌的日常生活中忘记手机的人。快节奏生活中，追踪必需品变得非常有挑战性。人们有时会将手机忘在家里。我们需要打一个重要的电话却不记得号码怎么办？手机处于静音模式时是最可怕的。当手机不在身边时，我们有时想锁定手机。这时就需要“律师日记”用场了。如果你在手机上预装了“律师日记”应用程序并完成了设置，上述所有问题都可以轻松快速地解决。你只需要从任何可以使用的手机发送短信……问题就解决了。该系统的范围在全球范围内日益扩大，那里的一切都像F1赛车一样快。该系统的目标是通过先进技术为面临这些问题的人提供即时帮助。该系统的吸引人功能是不联网远程访问。无需验证码和密码，短信即可帮助你在没有网络的情况下更改手机设置（从静音切换为正常）。该系统用户友好，该应用程序适用于基础智能手机（图
    12.1-12.8）。


