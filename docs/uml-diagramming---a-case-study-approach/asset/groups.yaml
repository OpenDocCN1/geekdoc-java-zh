    # Chapter 33


    # Design of UML Diagrams for Green Rides


    ## 33.1 Problem Statement


    This system is useful in the road transport and highways field (Ministry of Road
    Transport and Highways). Green rides is a technical solution for the general public
    to guide them to a less polluted path while travelling, to know about the traffic
    jam, identification of accident-prone spots, meals-on-wheel, the establishment
    of drive-mode applications. This app consists of a Google map view on the main
    screen. A user can select the source to destination path which will then be processed
    to give a number of routes to reach the destination source with amount of traffic
    at various locations in that path with current pollution status in that route
    (which updates overtime). If there exists a traffic jam, a user can blow a horn
    to all users within a specific radius. According to his current location in the
    form of a small notification which the persons in the specific radius will be
    revealed. The accidents that occurred at specific spots will be reported by the
    user to the concerned authority who will do the rescue operations and hence the
    accident-prone areas for the user to drive slow and safe when they are in that
    particular location. The road authority admin the number of accidents taking place
    and a notification appears the system often. Meals-on-wheel provides information
    about hotels and restaurants which are available in the chosen route so that the
    user can place the order as per the available menu at a particular eating place
    time of service that one need not wait at the restaurant for placing the order.
    Drive-mode helps to minimize the risks of accidents while attending mobile phones
    during driving. This module would send an SMS to the caller that the particular
    person is driving when the geo-coordinates show the mode shifting of the driver
    is below some specified speed limit (say, 20 km). Before start of the journey,
    this module can be turned on. The feed-back feature allows the user to give feedbacks
    about the accuracy and pollution levels in a given area (Figures 33.1–33.8).


