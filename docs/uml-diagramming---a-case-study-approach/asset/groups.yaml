    Alternative Flow: The actor may have forgotten the password and clicks on Forgot
    password button.

    Pre-Conditions: The actors should have already registered and should have their
    credentials ready.

    Post-Conditions: The entered credentials will be checked and if the entries are
    correct, the actor is let in.


