    # 第 1 章


    # UML 图介绍及其组件


    ## 1.1 UP 阶段


    帮助用户构建、部署和维护软件的方法称为软件开发过程。用于构建面向对象系统所需的软件开发过程被称为“统一过程”（Unified Process）。Craig
    Larman 将统一过程定义为：“统一过程（UP）将广泛接受的最佳实践（如迭代生命周期和风险驱动开发）整合成一个凝聚且文档良好的描述/过程”。统一过程包含四个阶段，即：启动（Inception）、细化（Elaboration）、构建（Construction）和过渡（Transition）。启动阶段接收客户输入的问题陈述。它通过追踪以下几个问题的答案来生成报告，以决定开发软件的可行性（图
    1.1）。


    细化阶段以启动阶段生成的报告作为输入进行处理。它涉及三项主要活动：开发系统核心架构、制定项目进度计划，以及最后绘制统一建模语言（UML）用例图（图 1.2）。


    构建阶段涉及三项活动：命名、编码、测试和反馈。值得注意的是，构建阶段涉及 Alpha 测试，即在开发者所在处进行软件测试（图 1.3）。


    | (1) 愿景 | (2) 是否可行？ | (3) 该项目的好处是什么？ |

    |---|---|---|

    | (7) 涉及的风险 | 问题陈述 | (4) 成本/预算 |

    | (6) 组织为什么要参与此项目？ | (5) 进度 | |


    ![](img/d57b893f2cab246eeea62e79849bffd0_15_0.png)


