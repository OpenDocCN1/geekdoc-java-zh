    +   16. Search Users


    Description: Among the two user types, client and BPO organization, and they search
    the other.


    Flow of Events


    Basic Flow: All the users of the other user type should be searched and displayed
    from the database.


    Pre-Conditions: User should have an authenticated profile by registering in the
    system to search other profiles.


    Post-Conditions: The user can contact the other user.


    +   17. Shipment


    Description: The product after payment can be shipped from the BPO organization
    to the client as per the client''s wish.


    Flow of Events


    Basic Flow: The status of payment should be verified, then the product is collected
    from the BPO organization and delivered to the client.


    Alternative Flow: The client and BPO organization can have methods of shipment
    and skip this procedure.


    Pre-Conditions: Payment procedure should be done (either by cash or card).


    Post-Conditions: The status of the agreement should be updated in the database
    as ''completed''.


    +   18. Track Progress


    Description: The client can track the progress of their product or service that
    has been service.


    Flow of Events


    Basic Flow: BPO organization should constantly update the status of their progress
    so that the client can view them.


    Alternative Flow: Previous updates of progress should be displayed in case the
    BPO organization fails to give a recent update.


    Pre-Conditions: BPO organization and the client should agree with the request.


    Post-Conditions: The current status of BPO organization with respect to the service
    should be updated in database.


    +   19. Upload Request


    Description: This allows the client to post a request


    Flow of Events


    Basic Flow: The client will have to enter the category, due date and description
    of their request along with an uploaded document.


    Alternative Flow: Contact BPO organization and deal directly.


    Pre-Conditions: Client should be a registered user.


    Post-Conditions: Request information and ID should be stored in the database.'
