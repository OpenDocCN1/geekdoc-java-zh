  - "[PAGE 347]\n\n# Chapter 32\n\n# Design of UML Diagrams for Farm Management System\n\
    \n# 32.1 Problem Statement\n\nIn India, 1 out of 4 farmers own a smartphone. But\
    \ they don't use it optimally for insights on farming based on real-time data\
    \ – such as weather, soil conditions, market conditions, labour availability etcetera,\
    \ which can allow them to make data-driven decisions to get the best possible\
    \ results. Current technologies that solve such issues are either paid services\
    \ or inaccurate. They also tend to be more complex making it really hard for anyone\
    \ to understand and interpret. An application if developed primarily aiming at\
    \ reducing the risks, reducing the costs, improving yield, and most importantly,\
    \ easy for anyone to interpret (Figures 32.1–32.8).\n\n# 32.2 UML Diagrams\n\n\
    Actor Specification\n\n+   1. Admin – The admin has control over the entire system.\
    \ He/she is able to view, edit and delete records from the database and also alter\
    \ the results for the queries we user selects. Also take care of the Authentication\
    \ of the user-specific details/results.\n2. User – Users create an account and\
    \ use the functionality of the app to help them make data-driven decisions.\n\n\
    Usecase Specification\n\n+   1. Create Account\n   Description: User can create\
    \ an account for himself/herself. Admin can also create an account for anyone.\n\
    \   Flow of Events\n   Basic Flow: Selects account option and enter relevant details."
