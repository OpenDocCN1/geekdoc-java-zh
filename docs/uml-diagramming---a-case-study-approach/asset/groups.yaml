    # Chapter 30


    # Design of UML Diagrams for E-Visa Processing and Follow-Up System


    ## 30.1 Problem Statement


    A visa is a document issued by a country giving a certain individual permission
    to enter a country for a given period of time for certain purposes. It is received
    after several verifications through offline mode. It requires the applicant to
    go to the Passport Verification Centre for the verification of documents. Sometimes
    even the cost of getting the visa will be as high as there may be middlemen involved
    in it. It takes anywhere from two weeks to two months to receive the visa if applied
    in offline mode. With the use of an online visa processing system, the middlemen
    entry in getting the visa gets reduced and the process of application of visa
    becomes easier. The overall aim of the system is that the applicant can apply
    for the visa from anywhere and at any time. The applicant apply for the visa and
    submit it online. There are certain types of visas that the applicant can apply
    for such as employment visa, study visa, resident visa, H1 visa, business visa,
    etc. People who apply for the visa or work, education, etc will be benefited a
    lot from this system. The applicant should register by providing a valid email
    and a password. The applicant has to log in to apply for the visa. The credentials
    are checked for correctness and the applicant to log in. Once the applicant logs
    in,/she will be shown the application form which asks the applicant to provide
    the necessary details and he can also view the details of fair to visa for each
