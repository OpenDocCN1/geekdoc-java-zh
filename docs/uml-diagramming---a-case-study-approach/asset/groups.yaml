    # Chapter 37 Design of UML Diagrams for Book Management System


    ## 37.1 Problem Statement


    The book management is a software in which a member can register themselves and
    then can borrow books from the bank or members can buy books from the bank. A
    book bank lends books and magazines to members who are registered in the system.
    It mainly concentrates on providing books for authorized members only. A member
    can reserve a book or magazine that is not currently available in the bank, so
    when it is returned or purchased by the bank, that person is notified. The book
    bank can easily create, delete information about titles, members and reservations.
    The main issue of the system is that only registered members lend books from the
    bank. In the case of lending, we should maintain the database for the status and
    also have to calculate the fine amount with respect to the due date. We should
    maintain the book according to the department and year of study. Another main
    issue of the system is that the user takes the book and misplace it on another
    shelf, then we have to barcode scan the books and indicate to the admin that the
    book has been replaced. All the issues will be satisfied by developing the software
    as a user-friendly system. The main functionality of the system is that Sign in,
    Login, Log out, Book storing, Book retrieval, Book for buying, Stock Updating,
    Due, E-books, Payment, Book maintenance, Sales report. If the software is not
    developed, the members will affect based on criteria like the book is not in stock,
    the book is not arranged in order and maintenance will be more. The software is
    developed to satisfy the needs of members. The software will be very useful in
    the case of institutions, libraries and for general citizens. The software developed
    to act as a useful interface for users to easily access books.


    ## 37.2 Literature Review


    Existing System: The present system has only some banks partially automated by
    storing details in MS Excel spreadsheets, whereas many other banks are manual.
    A user has to visit the bank personally at least thrice to get a set of books
    needed. Also, only the user has to give the list of books needed with the exact
    details of the ordered books, such as author''s name, edition, name of the publication,
    etc. Only the list of users and available books are stored in the database. Due
    to this manual process, work in the existing system is more. A user has to visit
    the bank personally to get registered, to request and also to receive books, and
    this time is time-consuming. The bank works only for a specific time within which
    the user should visit and complete all procedures. The staff will have to manually
    search for the details of any particular user and the list of books ordered by
    the user.


    Proposed System: In our proposed system, the user can register in the system,
    enter personal details, and can fill the registration form with a unique user
    Identifier. The user can complete all procedures such as ordering books and confirming
    the book list and go to the bank only for receiving books. The system confirms
    the book list by means of automated email service. The books that would be needed
    by the user predicted by the system to the department and semester are chosen
    in the request books page. Hence the user is given a set of choices for selecting
    a book. Due to all the processes such as requesting books, etc., can be done online
    and automated. It saves a lot of time for the user and the bank staff save. There
    is no specific time for the user to register into the system and download the
    registration form. The user need not give the list of books needed and can send
    only a confirmation for the same (Figures 37.1–37.8).


    ## 37.3 UML Diagrams


    # Actor Specification


    +   1. **Admin** – Admin will manage the entire system periodically. The function
    of the admin extends in ways of adding new books, monitoring book issue and order
    details and finally accepting payment of books.

    2. **Librarian** – Librarian manages the books in the system making available
    searched books by members. He is the one who checks and accepts the return of
    books.

    3. **User** – The user or member is the one who gets full access to books either
    buying or borrowing a book. A member is a registered user who can search their
    required books.

    4. **Visitor** – Visitor is an unregistered user of the system. A visitor may
    sign up in order to view and search the books.


    # Usecase Specification


    +   1. **Book Borrow**

    Description: This usecase is used to lend books to the user who wished to borrow.

    Flow of Events

    Basic Flow: The normal flow is that the member borrows a book from this system.

    Alternative Flow: The alternate flow is that if the required book is not available,
    then the member may search for the book with a different author.

