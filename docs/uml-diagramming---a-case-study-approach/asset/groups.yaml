    前置条件：发生事故。

    后置条件：处罚驾驶员。


    ### 2. 急救

    描述：针对受伤人员的紧急服务。

    事件流

    - 基础流程：提供救护。

    - 备用流程：无。


    前置条件：紧急事件。

    后置条件：无。


    ### 3. 分析交通

    描述：基于人口密度的智能交通。

    事件流

    - 基础流程：设置绿灯。

    - 备用流程：无。


    前置条件：人口密度已更新。

    后置条件：无。


    ### 4. 行人

    描述：检测正在过马路的行人。

    事件流

    - 基础流程：设置行人信号灯。

    - 备用流程：无。


    前置条件：等待过马。

    后置条件：无。


    ### 5. 头盔违规

    描述：检查未戴头盔的驾驶员。

    事件流

    - 基础流程：识别头盔违规。

    - 备用流程：无。


    前置条件：未戴头盔。

    后置条件：处罚驾驶员。


    ### 6. 车牌

    描述：从 RTO 服务器读取车牌。

    事件流

    - 基础流程：提供车辆信息。

