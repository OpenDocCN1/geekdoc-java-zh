    # Chapter 1


    # Introduction to UML Diagrams and Its Components


    ## 1.1 UP Phases


    An approach that helps a user to build, deploy and maintain a software is termed
    as Software Development Process. Such as a Software Development Process which
    is required to build an Object Oriented System is called as ''Unified Process''.
    Craig Larman states Unified Process as "The Unified Process (UP) combines commonly
    accepted best practices, such as an iterative lifecycle and risk-driven development,
    into a cohesive and well-documented description/process". The inception has four
    phases of the Unified Process, namely Inception, Elaboration, Construction and
    Transition. The inception phase takes a problem statement from a client input.
    It traces answer for the below several questions to generate a report to decide
    about the feasibility of developing the software (Figure 1.1).


    The elaboration phase takes the report generated by the inception phase as input
    to perform its processing. It involves three main activities like developing a
    core architecture for the system, developing a project schedule and finally sketching
    a Unified Modeling Language (UML) Usecase diagram (Figure 1.2).


    The construction phase involves a set of three activities, naming, coding, testing
    and feedback. Notable point is that the construction phase involves Alpha testing,
    i.e. testing a software at the developer site (Figure 1.3).


    | (1) Vision | (2) Is it feasible? | (3) What are the benefits of this project?
    |

    |---|---|---|

    | (7) Risk Involved | Problem Statement | (4) Cost / Budget |

    | (6) Why should the organization should involve in this project? | (5) Schedule
    | |


    ![](img/d57b893f2cab246eeea62e79849bffd0_15_0.png)


    # 2 UML Diagramming


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_0.png)


    Figure 1.2 Elaboration phase.


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_1.png)


    Figure 1.3 Construction phase.


    ![](img/d57b893f2cab246eeea62e79849bffd0_16_2.png)


    Figure 1.4 Transition phase.


    The transition phase involves Beta testing, i.e. testing a software at the client
    site without the support of developers, followed by deployment, and finally, fine
    tuning is done based on feedback from the client''s side (Figure 1.4).


    ## 1.1.1 UML


    It is a standard diagrammatic tool for designing. It is a graphical language for
    specifying, visual-constructing and documenting the artifacts of software systems.
    It helps in better-understanding of the software or system to be developed among
    developers and customers. UML diagrams include major important diagrams like UML
    Usecase Diagram, UML Activity Diagram, UML Class Diagram, UML Sequence Diagram,
    UML Collaboration Diagram or UML Communication Diagram, UML State Machine Diagram,
    UML Component Diagram and UML Deployment Diagram (Figure 1.5 and Table 1.1).


    # UML Diagrams and Its Components ■ 3


    ![](img/d57b893f2cab246eeea62e79849bffd0_17_0.png)


    Figure 1.5 Pyramid of UML diagrams.


    # Table 1.1 List of UML Diagrams


    | S. No | UML Diagram | Purpose of the UML Diagram |

    |---|---|---|

    | 1 | UML Usecase Diagram | It focuses on the identification of functional requirements
    of the system under consideration. |

    | 2 | UML Activity Diagram | It focuses on sequential and parallel activities
    involved in each functional requirement of the system. |

    | 3 | UML Class Diagram | It describes the structure of the system in terms of
    classes and objects. |

    | 4 | UML Sequence Diagram | It depicts the objects involved in the scenario and
    the sequence of messages exchanged to carry out the functionality. |

    | 5 | UML Collaboration Diagram or UML Communication Diagram | It shows interactions
    between objects using sequenced messages in a free-form arrangement. |

    | 6 | UML State Machine Diagram | It describes the life of an object using three
    main elements: states of an object, transitions between states and events that
    trigger the transitions. |


    (Continued)


    # 4 UML Diagramming


    Table 1.1 (Continued) List of UML Diagrams


    | S. No | UML Diagram | Purpose of the Diagram |

    |---|---|---|

    | 7 | Component Diagram | The purpose of a component diagram is to show the relationship
    between different components in a system. |

    | 8 | UML Deployment Diagram | Deployment diagrams are used for describing the
    hardware components, where software components are deployed. The purpose of deployment
    diagrams can be described as:

    - Visualize the hardware topology of a system.

    - Describe the hardware components used to deploy software components.

    - Describe the runtime processing nodes. |


    ## 1.1.2 UML Usecase Diagram


    Table 1.2 contains the details of components of the UML Usecase Diagram. Table
    1.3 contains the various usecase relationships.


    Table 1.2 Components of UML Usecase Diagram


    | S. No | Name of the Component | UML Notation | Purpose |

    |---|---|---|---|

    | 1 | System Boundary | ![System]() | It represents the scope of the system.

    - It encapsulates the complete set of functionalities of the system. |

    | 2 | Actors | ![Actor]() | The users that interact with a system.

    - An actor can be a person, an organization or an outside system that interacts
    with your application.

    - An actor in a usecase interacts with a usecase.

    - It is up to the developer to consider what actors make an impact on the functionality
    that they want to model. |

    | 3 | Usecases | ![Usecase]() | A usecase is a visual representation of a distinct
    business functionality in a system.

    - It ensures that the business process is discrete in nature.

    - List the discrete business functions in given problem statement.

    - Identifying usecases is a discovery. |

