    \ to register.\nPost-Conditions: User can get diet suggestion or interact with\
    \ professionals.\n\n## Chapter 29\n# Design of UML Diagrams for Student Counselling\
    \ System\n\n### 29.1 Problem Statement\nThe first phase of a person's life is\
    \ confined mainly by education and training. Hence, counselling is an important\
    \ aspect for the students of current generation as an counsellor may remain in\
    \ contact with all students as well as parents. Student Counselling System will\
    \ simplify the process and reduce the manual paperwork. It is used to smooth the\
    \ work of each counsellor who is facing problems, making manual process to computerized\
    \ system. The main objective of the Student Counselling System is to design a\
    \ system to automate the admission to particular courses in a university. Through\
    \ this system, the student will be able to register for counselling if he is eligible.\
    \ If the student is qualifying the criteria then he will get information regarding\
    \ colleges and universities. The main features are online admission, report generation\
    \ based on students' merit list, keeping track of counselling procedures and finally\
    \ publishing results. A student can also get information regarding how many seats\
    \ have been vacant available in the institution (Figures 29.1–29.8).\n\n### 29.2\
    \ UML Diagrams\nActor Specification\n- **Student** – Student is the one who initiates\
    \ the process by registering and filling choices.\n- **Admin Team** – Admin Team\
    \ is the one who responds to students' submissions of forms and choice sheets\
