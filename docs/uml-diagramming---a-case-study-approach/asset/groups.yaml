    ## 24 UML Diagramming


    ## 2.2 Major Functionalities and Its Description


    The major functionalities of this system along with their description are as follows:


    - Register – this functionality acts as a membership functionality that allows
    the users, patients or caregivers to register into this website to access all
    the resources.

    - Login – this functionality authenticates the user to provide access permissions.

    - Facilities – this functionality allows us to access all the options available
    on the website.

    - Logout – this allows us to purchase insurance, or to pay for healthcare services
    consumed.

    - Finance – Health A–Z– this functionality provides details of all the diseases.

    - Resources – this functionality has sub-functions, namely symptoms checker, health
    calculator, find a doctor, insurance guide and ambulance providence.

    - Drugs and supplements – this functionality provides online delivery of medicines.
    This functionality takes the doctor’s statement for the issue of medicine and
    the patient’s willingness to buy online.

    - News and experts – this functionality provides health awareness and threats
    that are prevailing.

    - Payment – this functionality deals with payment for the services consumed. This
    functionality is split into two sub-functions namely, payment for doctors, for
    the services issued and payment for online med-delivery.

    - Feedback – this functionality collects user reviews for this website.


    System Architecture: System architecture is the conceptual model that defines
    the structure, behaviour and more views of a system. An architecture description
    is a formal description and representation of a system, organized in a way that
    supports reasoning about the structures and behaviours of the system. This architecture
    diagram shown in Figure 2.1 includes all the functionalities of the system in
    an ordered manner based on the sequence of occurrence of these functionalities.
    It represents the complete data flow starting from the register functionality
    through which the user could access the system to the logout functionality that
    ends the access.


    ![](img/d57b893f2cab246eeea62e79849bffd0_38_0.png)


    Figure 2.1 System architecture.


    of the user to the system. Initially, the user must register onto the system.
    Once registered, the user would be able to log on to the system and access all
    the services offered – finance, news and experts, resources that include finding
    a doctor, health A–Z that includes health calculator and fitness calculator, drug
    and supplements, payment and feedback. The payment is done through the insurance
    for the services consumed. After consuming the services, the user could log out
    of the system.


    ## 2.3 Data-Flow Diagrams


    Data-flow diagram (DFD) is a way of representing a flow of a data of a process
    or a system. The DFD provides information about the outputs and inputs of each
    entity and the process itself. A DFD has no control flow; there are no decision
    rules and no loops. A DFD can dive into progressively more detail using levels
    and layers. DFD levels are numbered 0, 1 and 2.


    DFD Level 0 is also called a Context Diagram. It is a basic overview of the whole
    system or process being analyzed or modelled. It is designed to be an at-a-glance
    view, showing the system as a single high-level process, with its relationship
    to external entities. This level 0 DFD diagram as shown in Figure 2.2 consists
    of the healthcare service system – Webmed and the actors who affect those systems
    – the patients and the service providers who are responsible for the maintenance
    of the system. This is the basic diagram that could easily understood by a wide
    audience. DFD Level 1 as shown in Figure 2.3 provides a more detailed breakout
    of pieces of the Context Diagram. We will highlight the main functions carried
    out by the system, as you break down the high-level process of the Context Diagram
    into its sub-processes.


    These systems have the same external entities – patients who require the service
    and the service providers who offer those services via the system. The Webmed
    system is broken down into a number of sub-processes. These sub-processes represent
    the functionalities of the system – register, login, finance, health A–Z, resources,
    drugs and supplements, news and experts, payment, feedback and logout. Payment
    is done to find a doctor and the drugs and supplements provided. The user could
    also give the feedback for the services available. Table 2.1 describes the comparison
    between the existing system and the proposed system.


    ![](img/d57b893f2cab246eeea62e79849bffd0_39_0.png)


    Figure 2.2 Level 0 DFD.


    ![](img/d57b893f2cab246eeea62e79849bffd0_40_0.png)


    Figure 2.3 Level 1 DFD.


    ## Table 2.1 Comparison of the existing system and the proposed system


    | Existing System | Proposed System |

    | :--- | :--- |

    | Register | The same as that |

    | Login | The same as that |

    | Logout | The same as that |

    | Finance | The same as that |

    | Health A-Z | The same as that |

    | Resources | The same as that |

    | Drugs and supplements | The same as that |

    | News and experts | The same as that |

    | Payment | The same as that |

    | Feedback | The same as that |


    ## Design of UML Diagrams for Webmed


    ### 2.4 Proposed – UML Diagrams


    #### Actor Specification

    - **Patient**: This actor plays the role of a patient who can register on the
    website.

    - **Service Provider**: This actor maintains the system and provides services.
    It receives feedback from the patients.


    #### Usecase Specification


    **1. Drugs and supplements**

    Description: This functionality provides online delivery of medicines.

    Basic Flow: It allows the users to search and purchase medical supplies like bandages,
    dressing, etc.

    Alternative Flow: Alternative flow for this usecase is: Health A–Z, resources,
    finance, news and experts.


    ![](img/d57b893f2cab246eeea62e79849bffd0_41_0.png)


    Figure 2.4.


    **2. Facilities**

    Description: The service provider controls all the facilities on the website and
    the user can utilize these.

    Basic Flow: The user can obtain the services like Health A–Z, resources, drugs
    and supplements, news, and experts.

    Alternative Flow: The user can provide feedback for improvement of the website.


    **3. Feedback**

    Description: This Feedback section helps the users to give honest opinions about
    the quality of services that have been provided. It also helps them to give suggestions
    for further improvements.

    Basic Flow: It verifies whether the feedback is given or not.

    Alternative Flow: LOGOUT.


    **4. Finance**

    Description: Negotiations regarding the financial status are done, eligibility
    for the insurance is checked and the appropriate schemes are issued.

    Basic Flow: It checks if the user has availed insurance for his health if not
    it checks for insurance availability.


    **5. Health A-Z**

    Description: This functionality acts as a dictionary of the diseases along with
    their symptoms and the drugs that can be consumed.

    Basic Flow: It provides catalogue of all the diseases with their symptoms.

