    ## 2. 货到付款 (Cash on Delivery)


    描述：系统的最终阶段。


    事件流程


    备选流程：可以使用任何在线支付模式。


    前置条件：人员应已订单了物品配送。

    后置条件：无。


    ![](img/d57b893f2cab246eeea62e79849bffd0_368_0.png)


    **图 34.8** UML 部署图。


    ## 3. 修改信息 (Change Info)


    描述：允许用户维护更新个人资料。

    事件流程

    备选流程：可以保持信息不变。

    前置条件：之前应已创建账户。

    后置条件：无。


    ## 4. 显示登录错误 (Display Login Error)


    描述：检查用户登录时输入的登录详情，如果错误则显示。

    事件流程

    备选流程：用户可能正确输入了详情。

    前置条件：用户应已输入登录详情。

    后置条件：无。


    ## 5. 登录与注销 (Login & Logout)


    描述：允许用户登录和注销系统。

    事件流程

