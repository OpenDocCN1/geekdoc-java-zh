    # 11.1 Problem Statement


    The need for law and enforcement in a country with a high population like India
    is salient. Lawyers play a major role in maintaining most of their data as hard
    copies. This project is mainly designed for lawyers to make their work easy and
    efficient. It is a responsive web application that would provide lawyers with
    various services that would help them maintain their documents. The services include
    a log that has details about the cases along with a calendar. The lawyers can
    also upload and save documents related to their case. It contains formats of model
    forms and links to online filing. It also provides references of common cases
    and detailed information about laws through e-books. Information about the judicial
    exams for lawyers is also made available. Furthermore, the web application contains
    updates for lawyers, blogs and feedback. This case study will serve as a small
    hand tool for lawyers to maintain the soft copies of their data (Figures 11.1–18).


