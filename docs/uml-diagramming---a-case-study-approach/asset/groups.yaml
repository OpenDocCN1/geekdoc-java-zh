    # 7. 通知 (Notify)


    描述：用作通知道路状况的工具。

    事件流程


    基本流程：如果发生交通拥堵，人员可以虚拟鸣笛而不是实际鸣笛，以避免不必要的噪音。如果发生事故，用户可以通知其他人员。在启用驾驶模式时，用户可以通知呼叫者自己正在驾驶。


    备选流程：用户有时可能不通知。


    前置条件：用户必须正在旅行或目击现场。


    后置条件：用户和管理员可以采取必要操作以确保运行顺畅。


    # 8. 驾驶模式 (Drive Mode)


    描述：开启后，拨打用户电话会在收到相关通知后得知驾驶员正在驾驶。

    事件流程


    基本流程：在驾驶前开启驾驶模式。


    备选流程：可以在不开启模式的情况下驾驶，但由于粗心大意和通话存在事故风险。


    前置条件：无。


    后置条件：到达目的地后驾驶模式关闭。


    # 第 34 章

    # 画廊管理系统的 UML 图设计


    ## 34.1 问题描述


    提供一个在线平台来管理由创作者/其他平台或拍卖提供的艺术创作的购买、销售和存储，并组织展示这些产品的活动。该系统是一个画廊，拥有带有描述、价格和其他信息的画品，以及订单活动、支付活动、更新订单活动等。其目标是提供一个在线平台，使博物馆和画廊在街头画廊无法使用时能够能够展示它们的收藏品。例如在大流行期间，人们不需要去博物馆或艺术画廊，而是进行在线购物和艺术展。系统应能够防止任何艺术品和设计被误用或未经授权复制的可能。将有两类用户访问系统：管理员（所展示艺术品的创作者/权限机构）和客户（想要购买艺术的人）。为管理员提供的主要功能是：他们将能够更新、添加、删除、输入艺术品的价格、描述和信息（库存可用性）、生成画廊报告；为客户提供的是：他们能够下单（支付）、删除订单、查看面向用户投影的艺术品详情（图
    34.1–34.8）。


    ## 34.2 UML 图


    参与者规范


    - 1. **管理员 (Admin)** – 拥有系统权限并负责系统所有活动的人。

    - 2. **客户 (Customer)** – 使用系统进行购买或参考的人。

    - 3. **快递员 (Delivery Person)** – 将客户订单送达他们手中的人。

    - 4. **系统用户 (System User)** – 负责艺术品放入系统的人。


    # UML 图建模


    ![](img/d57b893f2cab246eeea62e79849bffd0_364_0.png)


    图 34.1 UML 用例图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_364_1.png)


    图 34.2 UML 活动图。


