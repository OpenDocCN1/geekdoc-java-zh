    # 用例规范


    + 1. 接受指导

    描述：如果导师喜欢这个创业想法，他将接受指导。

    事件流

    基本流：接受提供指导。

    分支流：之后拒绝指导。

    前置条件：创业想法应当具有说服力。

    后置条件：无。


    + 2. 接受请求

    描述：投资者接受查看创业想法的请求。

    事件流

    基本流：查看创业想法。

    分支流：拒绝请求。

    前置条件：登录账户。

    后置条件：必须查看想法。


    + 3. 接受查看想法请求

    描述：导师接受查看想法的请求。

    事件流

    基本流：查看创业想法。

    分支流：拒绝请求。

    前置条件：登录账户。

    后置条件：查看想法。


    + 4. 交易

    描述：投资者接受投资该风险项目。

    事件流

    基本流：提供投资。

    分支流：未达成交易。


