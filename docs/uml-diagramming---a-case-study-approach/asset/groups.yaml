    # Chapter 32


    # Design of UML Diagrams for Farm Management System


    # 32.1 Problem Statement


    In India, 1 out of 4 farmers own a smartphone. But they don''t use it optimally
    for insights on farming based on real-time data – such as weather, soil conditions,
    market conditions, labour availability etetera, which can allow them to make data-driven
    decisions to get the best possible results. Current technologies that solve such
    issues are either paid services or inaccurate. They also tend to be more complex
    making it really hard for anyone to understand and interpret. An application if
    developed primarily aiming at reducing the risks, reducing the costs, improving
    yield, and most importantly, easy for anyone to interpret (Figures 32.1–32.8).


    # 32.2 UML Diagrams


    Actor Specification


    + 1. Admin – The admin has control over the entire system. He/she is able to view,
    edit and delete records from the database and also alter the results for the queries
    we user selects. Also take care of the Authentication of the user-specific details/results.

    2. User – Users create an account and use the functionality of the app to help
    them make data-driven decisions.


    Usecase Specification


    + 1. Create Account

    Description: User can create an account for himself/herself. Admin can also create
    an account for anyone.

    Flow of Events

    Basic Flow: Selects account option and enter relevant details.


    # 334 UML Diagramming


    ![](img/d57b893f2cab246eeea62e79849bffd0_348_0.png)


    Figure 32.1 UML usecase diagram.


    Alternative Flow: User can also create an account using his/her mail id.

    Pre-Conditions: Account with current details must not exist in the database.

    Post-Conditions: Nil.


    + 2. Delete Account

    Description: User can delete his/her account from the system. Admin can delete
    any account from the system database.

    Flow of Events

    Basic Flow: Admin/user selects delete account option and it deletes the account.

    Alternative Flow: Nil.

    Pre-Conditions: Account must exist.

    Post-Conditions: Accounts not in use, gets deleted. Either by the user or by admin
    (after a specific time).


    # 3. Log In

    Description: User logs into the system.

    Flow of Events

    Basic Flow: Authenticates the user and grants access to the system.

    Alternative Flow: Invalid details, enter correct details.

