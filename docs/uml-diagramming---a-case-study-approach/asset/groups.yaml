    ## Usecase Specification


    ### 1. Accident

    Description: Monitors for accident events.

    Flow of Events

    - Basic Flow: Set signal to red.

    - Alternative Flow: Nil.


    Pre-Conditions: An accident must occur.

    Post-Conditions: Penalty imposed on the driver.


    ### 2. Ambulance

    Description: Emergency service for injured people.

    Flow of Events

    - Basic Flow: Provide ambulance to hospital.

    - Alternative Flow: Nil.


    Pre-Conditions: Emergency event.

    Post-Conditions: Nil.


    ### 3. Analyse Traffic

    Description: Smart traffic based on population density.

    Flow of Events

    - Basic Flow: Set traffic lights to green.

    - Alternative Flow: Nil.


    Pre-Conditions: Population density must be updated.

    Post-Conditions: Nil.


    ### 4. Pedestrian

