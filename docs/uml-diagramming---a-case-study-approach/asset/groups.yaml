    # Chapter 8


    # Design of UML Diagrams for DigiDocLocker


    ## 8.1 Problem Statement

    Maintaining the authentic documents physically in a single location is considered
    to be a challenging task. Thus, digitizing documents enables centralized storage
    of all the physical documents enabling easy retrieval from anywhere at anytime.
    It also prevents the troubles caused by any of those physical certificates. This
    can be achieved through the DigiDocLocker which is a platform for issuance and
    verification of documents and certificates in a digital format, thereby eliminating
    the use of physical documents. DigiDocLocker aims at benefitting the citizens
    of the country by providing to access authentic documents/certificates such as
    driving licence, vehicle registration and academic mark sheet in digital format
    from the original issuers of these certificates. DigiDocLocker has the following
    functionalities:


    - i. A Registration module allows the users to register and a Login module that
    allows the authorized users.

    - ii. An Upload module allows the users to upload documents such as driving licence,
    vehicle registration, academic mark sheet and other relevant documents in various
    file formats.

    - iii. A Profile module displays the complete profile of the user.

    - iv. Issue module displays the certificate to the issuers.

    - v. Requester module displays the documents to the requesters.

    - vi. Verification module allows for the verification of the documents.


    # 8.2 UML Diagrams


    # 106 Diagramming


    ![](img/d57b893f2cab246eeea62e79849bffd0_120_0.png)


    Figure 8.1 UML usecase.


    Usecase Specification


    ### 1. Registration Process

    Description: This process allows new users to register with DigiDocLocker system
    and verify the account once the user is verified.

    Flow of Events

    Basic Flow: Register with DigiDocLocker successfully.

    Alternative Flow: Display an error message if the registration details are not
    valid.

    Pre-Conditions: The user should possess valid identity documents.

    Post-Conditions: The user is registered and reflected in the system.


    ### 2. Login Process

    Description: This process allows the authorized users to login to DigiDocLocker
    system.

    Flow of Events

    Basic Flow: Login into DigiDocLocker.

    Alternative Flow: Display an error message if the credentials are not valid.

    Pre-Conditions: The user should be registered.

    Post-Conditions: The user is successfully logged in to the system.


