    # 第 30 章


    # 签证处理与后续系统的 UML 图设计


    ## 30.1 问题描述


    签证是国家签发的一种文件，允许特定个人在规定时间内为了特定目的进入该国。它是在离线模式通过多次验证后获得的。这要求申请人前往护照验证中心进行文件验证。有时获取签证的成本会很高，因为其中可能涉及中间人。如果通过离线模式申请，获取签证需要两到两个月。使用在线签证处理系统，获取签证的中间环节会减少，签证申请过程变得更加简单。系统的总体目标是让申请人可以随时随地申请签证。申请人在线申请并提交签证申请。申请人可以申请某些类型的签证，例如工作签证、学习签证、居住签证、H1
    签证、商务签证等。申请签证或工作、教育等的人将从该系统中受益良浅。申请人应通过有效的电子邮箱和密码进行注册。申请人必须登录以申请签证。检查凭据的正确性并申请人登录。一旦申请人登录，将向显示申请表，要求申请人提供必要的细节，他还可以查看每个国家的签证费用详情。申请人可以查看、修改和删除已申请签证的详情。系统将为管理员提供查看申请人所需各类型签证详情的功能。管理员还可以更新和删除申请人的详情。管理员将有功能交互申请人提交的证明文件（有效护照、签证费草案、I-20
    表格、录取通知、资助信等），并能够查看申请签证的目的。他/她有权接受/拒绝申请人提交的签证申请。


    DOI: 10.1201/9781003287124-30


