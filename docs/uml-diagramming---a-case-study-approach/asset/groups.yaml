    ## 3. Send SMS


    Description: This usecase allows the user to send SMS to his/her''s mobile number
    from any other mobile phone.

    Flow of Events

    Basic Flow: Sending SMS successfully.

    Alternative Flow: If SMS sending failed due to any issue, the user should resend
    the SMS.

    Pre-Conditions: The user must have completed configuring the ''MY HELPER'' system
    on his phone.

    Post-Conditions: SMS is successfully sent.


    ## 4. Read SMS


    Description: This usecase is about the ''My Helper'' application reading SMS sent
    to the phone.

    Flow of Events

    Basic Flow: The system reads the SMS, checks for a password that has been set
    by the user.

    Alternative Flow: If the password in the SMS doesn''t match the password set by
    the user, My Helper sends back an SMS stating invalid details.

    Pre-Conditions: The SMS should have been received and the user should have given
    ''My Helper'' access to read messages.

    Post-Conditions: SMS is read successfully and ''My Helper'' now starts checking
    details of the requirement.


    ## 5. Checks Requirement


    Description: Checks for a valid requirement.

    Flow of Events

    Basic Flow: If it is a valid requirement, ''My Helper'' now starts processing
    the requirement.

    Alternative Flow: If the requirement is not valid, My Helper sends back an SMS
    stating invalid details.

    Pre-Conditions: SMS should have been received and successfully read.

    Post-Conditions: The requirement fulfilment process gets started.


    ## Design of UML Diagrams for My Helper ■ 145


    ### 6. Error

    Description: If SMS sending fails, it results in an error.

    Flow of Events

    Basic Flow: Error in sending.

    Alternative Flow: Send another SMS or Nil.

    Pre-Conditions: Nil.

    Post-Conditions: Send SMS again (or) Don''t send an SMS.


    ### 7. Fulfillment Requirement

    Description: Performs operations and satisfies user requirements.

    Flow of Events

    Basic Flow: After scanning the requirement, start processing the requirement.

    Alternative Flow: Requirement processing is failed, request another requirement.

    Pre-Conditions: Requirement should be read and valid.

    Post-Conditions: After fetching the requirement, send the requested details back
    to the user.


    ### 8. Requirement Error

    Description: If the requirement cannot be satisfied by ''My helper'', it results
    in an error.

    Flow of Events

    Basic Flow: Requirement has been read, and it resulted in an error.

    Alternative Flow: Request another requirement or satisfy the requirement if it
    is valid.

    Pre-Conditions: Nil.

    Post-Conditions: Send another requirement or Nil.


    ### 9. Send Requested Details

    Description: Fetch user requirements and send them to the user in the form of
    SMS.

    Flow of Events

    Basic Flow: Requirement details have been fetched completely and send it to the
    user.

    Alternative Flow: Requested detail fetching has been failed or Nil.

    Pre-Conditions: Requirement details should have been fetched.

    Post-Conditions: Nil.


    ### 10. Verify Password

    Description: Verifying if the password sent in SMS matches the user-set-password

    Flow of Events

    Basic Flow: Verify password.

    Alternative Flow: Wrong password.

    Pre-Conditions: Should have received SMS.

    Post-Conditions: Password is successfully verified.


