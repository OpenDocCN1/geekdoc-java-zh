    \n# 第 17 章\n\n# 国家健康 ID 2020 的 UML 图设计\n\n# 17.1 问题描述\n\n印度总理于 2020 年 8 月 15 日宣布了一项新的国家健康\
    \ ID 计划。根据这项建议，每位印度人都将根据其手机号码或 Aadhaar 号获得一个唯一的健康 ID。国家健康 ID 将成为一个人所有健康信息的存储库。根据国家健康管理局\
    \ (NHA) 的规定，每个希望以数字形式获取健康记录的患者必须从创建健康 ID 开始。每个健康 ID 将与健康数据同意管理器关联——例如国家数字健康使命\
    \ (NDHM)，它将用于征求患者的同意，并允许信息从个人健康记录模块进行无缝流动。该健康 ID 防止了多家健康机构、医院（包括医生和患者）实施的保险欺诈。这将减少纸质工作并帮助患者轻松地维护其健康记录。它可以用于进一步诊断。在国家健康\
    \ ID 实施后出生的儿童将记录其所有的药物，包括疫苗等（图 17.1–17.8）。\n\n# 17.2 UML 图表\n\n用例规范\n\n+ 1. 验证\n\
    \   描述：通过 Aadhaar 卡或选民证等个人身份对印度公民身份进行验证。\n   事件流\n   基本流：收集数据。\n   前置条件：拥有 Aadhaar\
    \ 卡或选民证。\n   后置条件：没有唯一身份的人将被拒绝。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_200_0.png)\n\
    \n图 17.1 UML 用例图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_200_1.png)\n\n图\
    \ 17.2 UML 活动图。\n\n# 国家健康 ID 2020 的 UML 图\n\n![](img/d57b893f2cab246eeea62e79849bffd0_201_0.png)\n\
    \n图 17.3 UML 序列图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_201_1.png)\n\n图\
    \ 17.4 UML 协作图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_202_0.png)\n\n图 17.5\
    \ UML 状态机图。\n\n![](img/d57b893f2cab246eeea62e79849bffd0_202_1.png)\n\n图 17.6 UML\
