    – the patients and the service providers who are responsible for the maintenance
    of the system. This is the basic diagram that could easily understood by a wide
    audience. DFD Level 1 as shown in Figure 2.3 provides a more detailed breakout
    of pieces of the Context Diagram. We will highlight the main functions carried
    out by the system, as you break down the high-level process of the Context Diagram
    into its sub-processes.


    These systems have the same external entities – patients who require the service
    and the service providers who offer those services via the system. The Webmed
    system is broken down into a number of sub-processes. These sub-processes represent
    the functionalities of the system – register, login, finance, health A–Z, resources,
    drugs and supplements, news and experts, payment, feedback and logout. Payment
    is done to find a doctor and the drugs and supplements provided. The user could
    also give the feedback for the services available. Table 2.1 describes the comparison
    between the existing system and the proposed system.


