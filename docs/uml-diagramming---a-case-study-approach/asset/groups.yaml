    # 第 39 章


    # STARTUP MEET 的 UML 图设计


    ## 39.1 问题描述


    创业的政策和指南因州而异。此外，特定领域的创业项目在特定地区受到重视。具有不同阶段创业想法的人必须接触他们最近业务圈内的不同公司或个人，即使他们不在同一个州。这些都会对创业机会产生负面影响。Startup
    Meet 是一个平台，让人们可以私下就其在不同阶段的创业想法寻求融资和指导。此外，还可以了解并申请不同的政府政策和贷款计划。因此，Startup Meet
    是针对创业者的综合平台（图 39.1–39.8）。


    ## 39.2 UML 规范


    ### 参与者


    - 1. 投资者 – 投资者将检查创业想法并决定投资或拒绝。

    - 2. 导师/顾问 – 导师根据创业想法接受或不接受指导。

    - 3. 创业者 – 他向投资者推销想法以获取投资，向导师推销以获取指导。

    - 4. 管理员 – 他维护所有应用程序用户及其凭据。


