    # 3.5 UML Diagrams


    The purpose of Usecase diagram is to list out all the functional requirements
    of the system. In the following diagram, the functional requirements of Inventory
    are diagrammatically represented (Figure 3.12).


    Actor Specification


    - 1. Administrator – The functionality of this actor is to authenticate users
    who have registered to the system. More importantly, if a change has occurred
    in an inventory such as price update, removing expired goods, these changes are
    made subsequently by the administrator.

    - 2. Inventory manager – This actor takes care of the inventory, its associated
    goods and the transactions that occur within the inventory.

    - 3. Store manager – The store manager would effectively manage the stored goods
    that are obtained from the supplier and dispatch, when requested.

    - 4. Supplier – The work of this actor is to supply the goods that are requested
    by the store, subsequently responding to requests made at regular instants of
    time.


