    Post-Conditions: Nil.


    + 8. Walk-Through

    Description: This functionality displays the walk-through (animated/3D video of
    a building that is to be built) of the projects of the firm.

    Flow of Events

    Basic Flow: Displays walkthroughs of the projects.

    Alternative Flow: Displays pictures of projects.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    + 9. Contact Info

    Description: This functionality displays various forms of contact details/information
