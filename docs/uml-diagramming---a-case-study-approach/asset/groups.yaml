    # Webmed UML 图设计 ■ 29


    ## 事件流程

    基本流程：允许用户访问网站上提供的所有资源。

    替代流程：执行完此用例后，控制将流向以下任何一个用例：财务、健康 A-Z、资源、药物和补充剂、新闻和专家。


    前置条件：用户应已在网站上注册。


    后置条件：用户获得访问网站上所有可用资源的完整权限。


    ### 7. 登录

    描述：此功能结束对网站的访问。因此，用户必须重新登录才能访问所有资源。


    ## 事件流程

    基本流程：结束用户对资源的访问。

    替代流程：无替代流程。

    前置条件：用户应已登录网站。

    后置条件：一旦执行此用例，用户将被拒绝访问本网站提供的资源。


    ### 8. 新闻与专家

    描述：将公开显示有关环境内最新日期的新闻公告、针对传染病和非传染性疾病的专家建议，以及关于疾病的知识普及。


    ## 事件流程

    基本流程：用户接收有关疾病的最新动态。

    替代流程：可以执行以下用例而非此用例：健康 A-Z、资源、药物和补充剂以及财务。

    前置条件：用户应已登录。

    后置条件：用户对流行疾病有了了解。


    ### 9. 支付

    描述：此功能处理对所消费服务的支付。


    ## 事件流程

    基本流程：此功能涉及对医生提供的服务进行支付。

    替代流程：执行此用例后，控制移动到反馈用例。

    前置条件：用户应已消费医生提供的服务或已在线购买了药物。

    后置条件：执行此用例后，用户已完成购买支付，或服务提供者已向医生支付款项。


    ### 10. 注册

    描述：作为会员功能，允许患者或护理人员注册到本网站以访问所有资源。


    ## 事件流程

    基本流程：允许用户在网站上注册。

    替代流程：执行注册用例后，可以执行的用例：登录功能。

    前置条件：无前置条件，因为注册是第一个执行的用例。

    后置条件：执行注册用例后，用户将获得 Webmed 会员身份。


    # UML 图建模


    ## 12. 资源

    描述：在此章节中展示了健康计算器、救护车服务、症状检查、寻找医生和保险指南等资源。


    ## 事件流程

    基本流程：用户借此收集资源。

    替代流程：可以执行以下用例而非此用例：健康 A–Z、新闻与专家、药物和补充剂以及财务。


    前置条件：应确保资源的可用性。


    后置条件：用户拥有访问资源的权限（图 2.5）。


    两个参与者——用户和("提供者可以访问网站上的资源。设施类由新闻与专家、健康 A-Z 和健康计算器功能组成。财务类检查用户是否拥有健康保险，并提醒为用户购买保险的服务提供者。使用实现关系将用户、服务提供者与财务类连接起来。支付类涉及用户对药物和其他补充剂的支付。支付可以是在线支付，也可以是货到付款。因此，使用泛化关系来表示支付类的现金支付和在线支付。支付类与用户类关系松散，但与服务提供者关系很紧密，因为服务提供者负责所有的支付程序。寻找医生（建议专门针对某种疾病的医生）以及购买药物和补充剂是需要支付的资源。因此，这些资源是设施类和支付类共有的。因此，这些资源保留在一个名为“使用”的关联类中（图
    2.6）。


    活动图表示了通过系统的数据流。它表示了从用户注册，到使用用户名和密码登录的数据流。一旦用户登录系统，用户就可以访问所有资源，并反复导航资源，直到用户想要注销系统。用户需要为他们获得的服务付费。如果用户选择的话，用户也可以为系统提供反馈（图
    2.7）。


    在这张活动图中，“注册”是一个子活动。注册有其单独的控制流，允许用户加入系统。上面的活动图说明了在注册功能中发生的流程。服务提供者生成随机 ID，从用户处接收密码并确认密码。如果密码和确认密码相同，则用户注册到系统，系统会提示仅在确认密码字段中输入文本（图
    2.8 和 2.9）。


    系统首先检查用户是否为注册用户，如果是，则提示用户进入登录状态；否则，要求用户注册系统并提示进入注册状态。登录系统后，用户可以根据自己的选择访问设施。根据用户的选择，用户将被提示到所需状态。在此图中，登录是一个由许多不交状态组成的子状态机。如果用户需要寻找医生或购买药物，则会检查其保险可用性。如果系统未购买保险，用户将被拒绝访问本网站提供的资源。一旦执行此用例，用户将被拒绝访问本网站提供的资源。


