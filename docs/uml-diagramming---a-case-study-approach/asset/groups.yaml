    基本流：可以分析并选择不同的政策。

    前置条件：创业者应该登录其账户。

    后置条件：无。


    + 14. **查看创业想法**

    描述：投资者可以查看创业想法。

    事件流

    基本流：想法随后会被查看。

    前置条件：投资者应该喜欢该演示以提供投资。

    后置条件：无。


