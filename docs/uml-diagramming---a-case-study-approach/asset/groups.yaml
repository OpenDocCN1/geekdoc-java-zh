    ![Object a : Class A, Object b : Class B, 1 : Synchronous Message(), 2 : Reply
    Message] |

    | 2.3 | Asynchronous Message | - These type of messages are sent by the sender
    to the receiver which does not require an acknowledgement from the receiver.<br>-
    This feature enables the sender to send any number of messages to the receiver.

    ![Object a : Class A, Object b : Class B, 1 : Asynchronous_Message_1, 2 : Asynchronous_Message_2,
    3 : Asynchronous Message_3] |


