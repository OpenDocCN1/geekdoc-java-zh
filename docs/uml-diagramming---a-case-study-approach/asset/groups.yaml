    ## 5. 个人资料查看流程


    描述：此流程允许用户查看数据库中提供的完整个人资料。


    事件流


    基本流程：显示用户的完整个人资料。


    备用流程：如果用户资料中没有可用文档或为空，则显示错误消息。


    前置条件：用户应预先上传文档。


    后置条件：显示用户的完整个人资料。


    ## 6. 文档签流程


    描述：此流程允许公民在线申请各种认证文件，这些文件将由发行机构（例如税务部门）提供。


    事件流


    基本流程：向相应的机构申请证书。


    备用流程：申请另一份证书或无。


    前置条件：用户必须持有必备文件（例如 Aadhaar 卡）以申请特定的证书。


    后置条件：证书申请过程成功完成。


    ![](img/d57b893f2cab246eeea62e79849bffd0_126_0.png)


    ## 第 9 章


    ## 在线市场平台的 UML 图设计


    ## 9.1 问题描述


    各种新的中小型规模卖家在接触客户以及与市场上的其他竞争产品共同销售方面面临着困难。这增加了他们的总成本，从而减少了利润甚至导致亏损。E-Retail 是一个在线市场应用案例研究，中小型卖家可以在无需实体店的情况下直接向客户列出、展示、广告和销售他们的产品。E-Retail
    的目标是为所有中小型卖家提供一个动态平台，使其能够以竞争性的价格直接向所有范围的客户销售其产品，而不需要任何实体店。这使得卖家能够消除实体店的租金或维护成本，并尽可能地减少其他相关成本。它旨在促进卖家与客户之间的直接沟通，从而在他们之间建立信任关系。新卖家可以轻松验证并注册门户，并在门户中销售他们的产品。该应用程序为卖家和客户提供了单独的登录，卖家和客户可以查看来自各种卖家的所有产品并购买这些产品。它还为购买产品提供了在线支付便利。客户可以对产品和卖家进行评分或评价。如果交付过程中出现任何违规行为或产品不符合指定要求，客户也可以举报卖家。客户在购买产品之前还可以查看卖家的联系信息和评分（图
    9.1–9）。


    ![](img/d57b893f2cab246eeea62e79849bffd0_128_0.png)


    **图 9.1** UML 用例图。


    ## 9.2 UML 图


    参与者规范


    1. **管理员 (Admin)** – 管理员验证登录系统的新客户，并验证注册到系统的新卖家。管理员还验证客户针对卖家发布的报告。

    2. **客户 (Customers)** – 客户是登录系统的用户，用于查看和购买应用程序中卖家销售的产品。

    3. **支付服务提供商 (Payment Service Provider)** – 支付服务提供商充当商家、卡组织网络和其他金融机构之间的调解，处理应用程序中的电子交易。

    4. **卖家 (Sellers)** – 卖家是中小型企业，可以使用应用程序直接向潜在客户销售产品。


    用例规范


    1. **客户登录**

    描述：每个客户都必须使用应用程序的用户名和密码登录系统。

    事件流

    基本流程：验证用户并授予系统访问权限。

    备用流程：用户名和密码无效，尝试正确的用户名和密码。

    前置条件：有效的用户名和密码。

    后置条件：无。


    ![](img/d57b893f2cab246eeea62e79849bffd0_129_0.png)


    图 9.2 UML 活动图（部分1）。


    3. 卖家验证

    - 描述：卖家在销售之前必须经过验证。

    - 事件流

    - 基本流程：卖家通过验证并可以销售产品。

    - 备用流程：卖家验证失败，无法销售产品。

    - 前置条件：卖家已注册。

    - 后置条件：无。


    ![](img/d57b893f2cab246eeea62e79849bffd0_130_0.png)


    图 9.3 付活动图。


    4. 销售产品


    描述：经过验证的卖家可以展示待售的产品。

    事件流

    基本流程：卖家列出带有描述和价格的产品。

    备用流程：卖家无法销售产品。

    前置条件：卖家在列出产品之前经过验证。

    后置条件：无。


    5. 推广产品


    描述：卖家可以推广其待售的产品。

    事件流

    基本流程：卖家推广其待售的产品。

    备用流程：卖家无法销售产品。

    前置条件：卖家在列出产品之前经过验证。

    后置条件：无。


    6. 查看产品


    描述：客户可以查看来自各种卖家的可用产品。

    事件流

    基本流程：客户查看产品。

    备用流程：产品不可用。

    前置条件：客户已登录。

    后置条件：客户可以选择购买的产品。


    ![](img/d57b893f2cab246eeea62e79849bffd0_131_0.png)


    图 9.4 时序图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_132_0.png)


    图 9.5 协作图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_132_1.png)


    图 9.6 状态机图。


    ![](img/d57b893f2cab246eeea62e79849bffd0_133_0.png)


    图 9.7 UML 类图。


