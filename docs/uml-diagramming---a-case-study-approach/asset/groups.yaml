    图 9.8 UML 组件图。


    ## 7. 搜索产品


    描述：客户可以使用关键词搜索产品。

    事件流

    - 基础流程：显示与搜索关键词相关的可用产品列表。

    - 备用流程：关键词无可用产品。

    - 前置条件：客户必须登录。

    - 后置条件：可以选择搜索到的产品进行查看和购买。


    ## 8. 购买产品


    描述：客户可以购买可用的产品。

    事件流

    - 基础流程：结账并购买产品。

    - 备用流程：产品无售卖。

    - 前置条件：客户必须登录。

    - 后置条件：要求客户付款以购买产品。


    ## 9. 支付


    描述：客户在结账后会被要求选择支付方式。

    事件流

    - 基础流程：如果是数字支付，将为客户所选的支付选项提供相应的支付网关。如果是货到付款，将要求客户提供送货地址。

    - 备用流程：所选支付选项不可用。

    - 前置条件：客户必须选择购买产品。

    - 后置条件：更新产品购买并将订单详情发送给客户。


    # 在线市场的 UML 图图


    ![](img/d57b893f2cab246eeea62e79849bffd0_135_0.png)


    图 9.9 UML 部署图。


    ## 10. 信用卡/借记卡


    描述：可以使用信用卡/借记卡购买产品。

    事件流

    - 基础流程：信用卡/借记卡支付成功。

    - 备用流程：信用卡/借记卡支付失败。

    - 前置条件：客户必须选择通过信用卡/借记卡支付。

    - 后置条件：更新支付详情。


    ## 11. 网银


    描述：可以使用网银购买产品。

    事件流

    - 基础流程：网银支付成功。

    - 备用流程：网银支付失败

    - 前置条件：客户必须选择通过网银支付。

    - 后置条件：更新支付详情。


    ## 12. 货到付款


    描述：客户可以在送货时付款。

    事件流

    - 基础流程：选择送货地址并继续。

    - 备用流程：不支持货到付款。

    - 前置条件：客户必须有送货地址并选择货到付款选项。

    - 后置条件：在送货付款后更新支付详情。


    ## 13. 评分与评论


    描述：客户可以对购买的产品分享评价和评分。

    事件流

    - 基础流程：客户对产品进行评分和评价。

    - 备用流程：客户跳过对产品的评分和评价。

    - 前置条件：客户必须已购买产品。

    - 后置条件：更新产品的评分和评价。


    ## 14. 聊天


    描述：客户可以与卖家聊天以咨询产品。

    事件流

    - 基础流程：客户向卖家发送消息，卖家回复消息。

    - 备用流程：无。

    - 前置条件：客户必须登录且卖家必须是经过验证的卖家。

    - 后置条件：无。


    ## 15. 举报卖家


    描述：如果销售的产品不符合要求，客户可以举报卖家。

    事件流

    - 基础流程：客户带描述举报卖家。

    - 备用流程：无。

    - 前置条件：客户必须从被举报的卖家处购买过产品。

    - 后置条件：报告将发送给相应的卖家进行解释。针对特定卖家的频繁举报可能会将其从平台移除。


    # 第 10 章

    # 产品推荐系统的 UML 图设计


    ## 10.1 问题描述


    本案例研究侧重于使用网络爬虫进行跨网站的产品比较，以减少寻找和比较产品所需的时间和精力。旨在帮助并让购物爱好者能够轻松地购买产品（图 10.1–10.8）。


    ## 10.2 UML 图图


    用例规范


    + 1. 注册

    描述：允许用户注册/登录以使用系统。

    事件流

    - 基础流程：进入系统。

    - 备用流程：重试登录。

    - 前置条件：无。

    - 后置条件：进入搜索产品页面。


    2. 搜索产品

    描述：允许用户搜索他们选择的产品，如药品、衣服和机械设备。

    事件流

    - 基础流程：显示产品的搜索结果。

    - 备用流程：无。

    - 前置条件：用户必须已登录。

    - 后置条件：无。


