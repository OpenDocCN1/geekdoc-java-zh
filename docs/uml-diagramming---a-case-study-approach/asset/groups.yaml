    \n# Chapter 17\n\n# Design of UML Diagrams for National Health ID 2020\n\n# 17.1\
    \ Problem Statement\n\nThe Prime Minister of India has announced a new scheme\
    \ of National Health ID on August 15, 2020. According to this proposal, every\
    \ Indian will get a unique Health ID based on their mobile number or Aadhaar number.\
    \ The National Health ID will be a repository of all health-related information\
    \ of a person. According to the National Health Authority (NHA), every patient\
    \ who wishes to have their health records available digitally must start by creating\
    \ a Health ID. Each Health ID will be linked to a health data consent manager\
    \ – such as National Digital Health Mission (NDHM) which will be used to seek\
    \ the patient’s consent and allow for seamless flow of information from the Personal\
    \ Health Records module. This Health ID prevents insurance frauds committed by\
    \ several health agencies, hospitals including both doctors and patients. This\
    \ will reduce the paper works and help patients easily maintain their health records.\
    \ It can be used for further diagnosis. Children who are born after the implementation\
    \ of the National Health ID will have all their medications recorded including\
    \ the vaccines, etc. (Figures 17.1–17.8).\n\n# 17.2 UML Diagrams\n\nUsecase Specification\n\
    \n+ 1. Verification\n   Description: People are verified for Indian citizenship\
    \ through their individual identities such as Aadhaar card or voter id.\n   Flow\
    \ of Events\n   Basic Flow: Collection of data.\n   Pre-Conditions: To have an\
    \ Aadhaar card or voter id.\n   Post-Conditions: Those who do not have unique\
    \ identities will be rejected.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_200_0.png)\n\
    \nFigure 17.1 UML usecase diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_200_1.png)\n\
    \nFigure 17.2 UML activity diagram.\n\n# UML Diagrams for National Health ID 2020\n\
    \n![](img/d57b893f2cab246eeea62e79849bffd0_201_0.png)\n\nFigure 17.3 UML sequence\
    \ diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_201_1.png)\n\nFigure 17.4\
    \ UML collaboration diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_202_0.png)\n\
    \nFigure 17.5 UML machine diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_202_1.png)\n\
    \nFigure 17.6 UML class diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_203_0.png)\n\
    \nFigure 17.7 UML component diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_203_1.png)\n\
    \nFigure 17.8 UML deployment diagram.\n\n+ 2. Registration\n   Description: People\
    \ will be registered in the NHD for everyone.\n   Flow of Events\n   Basic Flow:\
    \ Registration through Aadhaar.\n   Alternative Flow: Registration can also be\
    \ done with Phone number.\n   Pre-Conditions: Indian Citizen.\n   Post-Conditions:\
    \ To activate.\n\n+ 3. Activation\n   Description: Everyone should activate the\
    \ account with Health ID.\n   Flow of Events\n   Basic Flow: The account that\
    \ has been created.\n   Pre-Conditions: To have unique ID.\n   Post-Conditions:\
    \ To use.\n\n. 4. Add a Record\n   Description: Since the Health ID will start\
    \ recording only after activation, old records can be added to repository.\n \
    \  Flow of Events\n   Basic Flow: Hard copies.\n   Alternative Flow: Can skip\
    \ this process if they want.\n   Pre-Conditions: Having old records.\n\n+ 5. Permission\n\
    \   Description: A person can give access to particular doctors or agencies.\n\
    \   Flow of Events\n   Basic Flow: Giving access to Medicare workers.\n   Alternative\
    \ Flow: The account must be activated.\n   Post-Conditions: Doctors can access\
    \ the repository.\n\n+ 6. Health Repository\n   Description: The record of people\
    \ is maintained by NHD in this repository.\n   Flow of Events\n   Basic Flow:\
    \ A place to store the records.\n   Pre-Conditions: The account must be activated.\n\
    \   Post-Conditions: All the medical transactions after activation will be stored\
    \ in the repository.\n\n# Chapter 18\n\n# Design of UML Diagrams for Device Handout\
    \ System\n\n# 18.1 Problem Statement\n\nAmidst this pandemic period, students\
    \ are being educated through online education platforms on smartphones and other\
    \ similar devices. Many underprivileged children are unable to get access to such\
    \ devices. Also, the people who are willing to help aren't able to reach the needy\
    \ due to lockdown. The ultimate aim of this system is to help such children by\
    \ giving the collected devices from the people who were willing to help. The system\
    \ requests the donors to enter the details regarding the device they are willing\
    \ to donate. It also requests the address details of donor in order to reach them.\
    \ On successful entry of these details, the user has to wait for the approval\
    \ of the device. The admin has to verify the details of the device and assign\
    \ it to a pickup executive for collection. This system also allows the volunteers\
    \ to join the team. So that they could be helped by picking up the devices in\
    \ their locality (Figures 18.1–18.12).\n\n# 18.2 UML Diagrams\n\nUsecase Specification\n\
    \n+ 1. New Donor\n   Description: The person in the case, being a new donor gives\
    \ his personal details.\n   Flow of Events\n   Basic Flow: Registers with the\
    \ system.\n   Alternative Flow: Having already registered proceeds as an old donor.\n\
    2. Contact Details\n   Description: Being new to the system, having given the\
    \ personal details, proceeds with the collection of contact details from the donor.\n\
    \   Flow of Events\n   Basic Flow: Registering with the system.\n   Pre-Conditions:\
    \ Has given the personal details.\n"
