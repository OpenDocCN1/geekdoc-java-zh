    ## E-Visa Processing and Follow-Up System ■ 321


    Alternative Flow: Nil.

    Pre-Conditions: The application form should be submitted earlier.

    Post-Conditions: Nil.


    ### 7. Check Status

    Description: Enables the applicant to check the status of his/her application.

    Flow of Events

    Basic Flow: The applicant can check the status of his/her application (in progress,
    approved, rejected).

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: The application should be submitted.


    ### 8. Give Feedback

    Description: Enables the user to give feedback about the visa that is being processed.

    Flow of Events

    Basic Flow: After checking the status, the applicant can give optional feedback.

    Alternative Flow: Nil.

    Pre-Conditions: The status should be checked.

    Post-Conditions: Nil.


    ### 9. Log Out

    Description: enables all the actors to log out of the system.

    Flow of Events

    Basic Flow: After performing all the operations that the actor wants, he/she can
    log out of the system.

    Alternative Flow: Nil.

    Pre-Conditions: The user should have signed in.

    Post-Conditions: Nil.


    ### 10. Make Payment

    Description: Enables the applicant to make payment.

    Flow of Events

    Basic Flow: The applicant will pay for the processing of the visa.

    Alternative Flow: The applicant will be redirected to the home page.

    Pre-Conditions: The application form should be submitted.

    Post-Conditions: The amount paid is checked.


    ### 11. Modify Details

    Description: Enables the applicant to modify the details that were given in the
    application form.

    Flow of Events

    Basic Flow: If the applicant feels that he/she has given the wrong details, he/she
    can modify the details.

    Alternative Flow: Nil.

    Pre-Conditions: The application should be submitted.

    Post-Conditions: The modifications are to be done in database.


    ### 12. Register

    Description: Enables a user to register with the system.

    Flow of Events

    Basic Flow: The actor registers with the system by entering username and password.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: The user should enter valid credentials (email and password).


    ### 13. Reject Visa

    Description: Enables the Visa Consultant Officer to reject the visa.

    Flow of Events

    Basic Flow: The visa consultant rejects the visa if document proofs submitted
    are not verified to correct.

    Alternative Flow: The applicant is shown the next date when he/she can apply.

    Pre-Conditions: The document proofs submitted should be invalid.

    Post-Conditions: Nil.


    ### 14. Update Status

    Description: Updating the status of the visa as per process carried out.

    Flow of Events

    Basic Flow: The administrator updates the status of the applicant''s visa after
    each stage is completed.

    Alternative Flow: Nil.

    Pre-Conditions: The application form should be submitted.

    Post-Conditions: Nil.


    ### 15. Verify Document Proofs

    Description: The document proofs submitted by the applicant are verified for correctness
    by Visa Consultant Officer.

    Flow of Events

    Basic Flow: The visa consultant verifies whether document proofs submitted are
    valid and correct.

    Alternative Flow: Nil.

    Pre-Conditions: The application should be checked by Visa Consultant Officer.

    Post-Conditions: The document proofs submitted should be invalid.


    ### 16. View Details

    Description: Enables the applicant to view the details he/she gave in the form.

    Flow of Events

    Basic Flow: The applicant can view the details that he/she provided in the application
    form.

    Alternative Flow: Nil.

    Pre-Conditions: The form should be submitted.

    Post-Conditions: Nil.


    ### 17. View Applicants'' Details

    Description: Enables the Administrator to view the details provided by the applicants.

    Flow of Events

    Basic Flow: The administrator views the applicants'' details.

    Alternative Flow: Nil.

    Pre-Conditions: The application should be accepted.

    Post-Conditions: It is checked whether the applicants have provided all the details.


    ### 18. View Purpose of Application

    Description: Visa Consultant Officer can view the purpose of visa application
    (tour-visa, study visa, etc.).

    Flow of Events

    Basic Flow: The visa consultant officer views the purpose of the application to
    check documents.

    Alternative Flow: Nil.

    Pre-Conditions: The application should be accepted by the administrator.

    Post-Conditions: The documents needed for getting the particular type of visa
    should be checked.


    ### 19. View Status

    Description: Enables the administrator can view the status of the visa of the
    applicants.

    Flow of Events

    Basic Flow: The administrator views the status of all the applications.

    Alternative Flow: Nil.

    Pre-Conditions: The application should be accepted by the administrator.

    Post-Conditions: The status should be updated if the processing of the visa moves
    to the next state.


