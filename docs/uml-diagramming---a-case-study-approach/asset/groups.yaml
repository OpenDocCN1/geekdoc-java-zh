    # Chapter 28


    # Design of UML Diagrams

    for Diet Care


    # 28.1 Problem Statement


    Health is wealth. Health plays a major role in everyone’s life. People consume
    unhealthy food and ruin their diet. Some medication results in side effects. This
    application benefits people with rich nutrients to improve their health. The application
    provides recommendations of nutrients they need. Users can provide their daily
    diet cycle and get good recommendations to improve it. They can also provide their
    medical reports to get nutrients according to their medical state. The user also
    gets the privilege to enter the disease name and get the nutrient benefit for
    fighting that disease. Users are authenticated and professional nutritionist for
    clarification. recommendation is provided by a trained machine learning model
    (Figures 28.1–28.10).


    # 28.2 UML Diagrams


    Actor Specification


    +   1. Data Base – A system that maintains the collection of organized data.

    2. Professional Nutritionist – A person who is an expert in nutrition science
    and can solve user’s issues.

    3. System – An Interface that accepts the user’s request and provides the result
    to user.

    4. Trained Model – Machine learning model that can suggest the healthy diet.

    5. User – People who are making use of this application.


    Usecase Specification


    +   1. Analysis


    +   Description: Finding the malnutrition and disease/deficiency from users’ data.

    Flow of Events

    Basic Flow: Scan user input and find terms that match malnutrition food or any
    disease name.'
