    ## 1.1.1 UML


    它是一种用于设计的标准图化工具。它是一种用于规范、视觉化构建和记录软件系统产物的图形化语言。它有助于开发者和客户更好地理解要开发的软件或系统。UML 图包括主要的重要的图表，如
    UML 用例图、UML 活动图、UML 类图、UML 序序图、UML 协作图或 UML 通信图、UML 状态机图、UML 组件图和 UML 部署图（图 1.5
    和表 1.1）。


