    for more articles in the system.


    + 12. Search

    Description: Functionality involves readers searching for a particular article
    in the magazine system.

    Flow of Events

    Basic Flow: Reader searches for a particular article or category of articles in
    the system.

    Alternative Flow: Nil.

    Pre-Conditions: The searched article must have been published in the system.

    Post-Conditions: The searched article can be read and shared.


    + 13. Feedback

    Description: Functionality involves readers giving feedback for articles they
    read in the magazine system.

    Flow of Events

    Basic Flow: Reader chooses to give feedback on an article he/she reads.

    Alternative Flow: Reader searches for a new article in the system.

