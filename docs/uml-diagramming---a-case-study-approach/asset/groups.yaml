    描述：导师拒绝提供指导。

    事件流

    基本流：不提供指导。

    分支流：接受指导。

    前置条件：不喜欢创业想法。

    后置条件：无。


    6. 登录创业者账户

    描述：创业者使用用户名和密码登录其账户。

    事件流

    基本流：提供账户访问权限。

    分支流：使用正确的用户名/密码重试。

    前置条件：用户应该拥有账户。

    后置条件：无。


    7. 登录导师账户

    描述：导师使用其用户名和密码登录账户。

    事件流

    基本流：提供账户访问权限。

    分支流：使用正确的用户名/密码尝试。

    前置条件：该用户应该拥有账户。

