    ## 4. Book Order Details


    Description: This usecase function displays the details of the books that have
    been ordered such as the person who ordered the book, its price effect etc.

    Flow of Events

    - Basic Flow: The normal form is that the book has been successfully ordered and
    detailed.

    - Alternative Flow: The alternate way is that the book requested is not available
    then the alternate book is ordered and listed.


    Pre-Conditions: The condition is that the person should be a member and have selected
    his required book.

    Post-Conditions: The condition is that once the book has been ordered the details
    should be removed.


    ## 5. Book Return


    Description: This usecase function is used for updating when the person returns
    the book.

    Flow of Events

    - Basic Flow: The normal form is that the member returns the book borrowed.

    - Alternative Flow: The alternate flow is that when the book has not been returned,
    calculating the appropriate fine amount.


    Pre-Conditions: The condition is that the book should be from the library or the
    system.

    Post-Conditions: The condition is that the book borrowed should be returned on
    time.


    ![](img/d57b893f2cab246eeea62e79849bffd0_397_0.png)


    ![](img/d57b893f2cab246eeea62e79849bffd0_398_0.png)


    Figure 37.6 UML class diagram.


    ## 6. Categories


    Description: This usecase function displays the books under each category for
    fast searching and easy retrieval.


    Flow of Events

    - Basic Flow: The normal flow is that the book has been categorized accordingly.

    - Alternative Flow: The alternate flow is that the book does not belong to any
    of the categories.

    Pre-Conditions: The condition is that the book should belong to a particular category.

    Post-Conditions: The condition is that the book is selected from a category.


