    ## 7. Due Fine Details


    Description: This usecase function displays the details of the members who exceeded
    their return date and displays the fine amount calculated accordingly.


    Flow of Events

    - Basic Flow: The normal flow is that the amount of eligible members is displayed.

    - Alternative Flow: The alternate flow is that the member has not cleared his
    dues.


    Pre-Conditions: The condition is that the member must borrowed a book from the
    system.

    Post-Conditions: The condition is that once the due has been cleared it can be
    removed from the list.


    ## 8. Home Page


    Description: This usecase function is the first screen of the system when the
    user successfully logs in.


    Flow of Events

    - Basic Flow: The normal flow is that the books are displayed once the member
    logs in.

    - Alternative Flow: The alternate flow is that the user can be as a visitor to
    enter.


    Pre-Conditions: The credentials such as user name and password must be provided
    to view the home page

    Post-Conditions: The condition is that the member can search for his/her book
    after the home page.


    ## 9. Login


    Description: This usecase function is used as a prerequisite for a user to enter
    the system.


    Flow of Events

    - Basic Flow: The normal flow is to enter the user name and password to log in.

    - Alternative Flow: The alternate flow is that the user must be a member.


    Pre-Conditions: The condition is that the user must be a member.

    Post-Conditions: The member can select the book if he logs successfully.


    ## 10. Logout


    Description: This usecase function is used to leave the system by clicking the
    logout button available once the member logs in the system.


    Flow of Events

    - Basic Flow: The normal flow is that the member successfully logs out.

    - Alternative Flow: The alternate flow is when a network failure occurs.


    Pre-Conditions: The condition is that the user should have logged in to the system
    first.

    Post-Conditions: The condition is that the member can log in any time.


    ## 11. Payment


    Description: This usecase function is used to buy the book using payment options.


    Flow of Events

    - Basic Flow: The normal flow is that the book has been successfully placed.

    - Alternative Flow: The alternate flow is that the book has not been purchased.


    Pre-Conditions: The condition is that the book must be from the system.

    Post-Conditions: The condition is that the book is successfully bought by the
    member.


    ## 12. Search Books


    Description: This usecase function is used to search books based on author name,
    id, etc.


    Flow of Events

    - Basic Flow: The normal flow is that the searched results of books are displayed.

    - Alternative Flow: The alternate flow is browsing books through various categories.

    Pre-Conditions: The condition is that the searched criteria must be a valid one.

    Post-Conditions: The condition is that the book can be forwarded for buying.


    ## 13. Signup


    Description: This usecase is used for the user to create a membership in the library.

    Flow of Events

    - Basic Flow: It asks the user to input the username, password and email.

    - Alternative Flow: If the user doesn''t provide correct details the user can
    visit the system as a visitor.

    Pre-Conditions: The user must have a unique username, password and email.

    Post-Conditions: The user can enter the system as a member.


    ## 14. User Details


    Description: This functionality deals with the user details. it describes the
    total users who are accessing the systems.

    Flow of Events

    - Basic Flow: When the user details are given the user is taken to the home page
    where he can access the books.

    - Alternative Flow: When the user is not registered the user can visit the system
    as a visitor.

    Pre-Conditions: The user must be a member and must give the perfect details.

    Post-Conditions: Whenever the user logs in to the home page where the user can
    access the books.


    ## 15. With Fine


    Description: This functionality says when the user doesn''t return the book on
    time the user has to pay the fine.

    Flow of Events

    - Basic Flow: The members who exceeded the return date must be displayed with
    their fine amount.

    - Alternative Flow: The members of without fines are displayed.

    Pre-Conditions: The user has to return the book with a fine when the user exceeds
    the due date.

    Post-Conditions: The user must pay a fine in order to access the books.


    ## 16. Without Fine


    Description: This functionality says that the user returns the book without any
    fine.

    Flow of Events

    - Basic Flow: The system doesn''t show any information about the fine details
    with respect to the users.

    - Alternative Flow: Fine amount is displayed if the user doesn''t return the book
    with respect to time.

    Pre-Conditions: The book must belong to the system and it should be returned within
    the given time.

    Post-Conditions: The members can use the book till the due date.

