    ## 26.2 UML Diagrams


    Actor Specification


    - 1. Administrator – Takes care of all updates of shows and movies along with
    database maintenance.

    - 2. Normal User – Watch shows and movies streamed upon creation of an account
    by paying a specified amount.

    - 3. Trial User – Watch shows and movies streamed without account creation and
    use the trial service for a month.

    - 4. Premium User – Watch shows and movies streamed upon creation of an account
    by paying amount higher than the normal user.

    - 5. User – Premium user, trial user and normal user are generalized as users
    who can watch movies, show and use chat room.


    Usecase Specification


    + 1. Maintain Database and Follow Timeline Scheduled

    Description: Maintain a proper database and schedule the update of shows, movies,
    etc.

    Flow of Events

    Basic Flow: Maintain the database.

    Alternative Flow: Nil.

    Pre-Conditions: Nil.

    Post-Conditions: Update shows and movies based on the database.


    + 2. Discussion Room

    Description: A chat room where only premium users can provide suggestions or complaints
    to the administrator directly.

    Flow of Events

    Basic Flow: Discussion Room.


