    the user to refill it.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    + 12. Qualification Verification

    Description: This functionality checks all the necessary requirements in the applicant’s
    application form.

    Flow of Events

    Basic Flow: If the requirements don’t meet, a mail is sent to the applicant stating
    that he/she is not eligible for the post.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    # Chapter 39


    # Design of UML Diagrams for STARTUP MEET


    ## 39.1 Problem Statement


    The policies and guidelines for startups vary from state to state. Also, startups
    related to a particular domain are emphasized in particular areas. The people
    with the startups ideas at different levels have to approach different firms or
    individuals who are in their nearest business circles, if not in the same state.
    All of these will adversely impact the opportunities for the startups. Startup
    meet is a platform for people to privately approach investors or mentors with
    their ideas implemented at different levels for funding and mentorship. Also,
    the government policies and loan schemes of different states can be known and
    applied. So, startup meet is a comprehensive platform for people who are into
    startups (Figures 39.1–39.8).


    ## 39.2 UML Specification


    ### Actor


    - 1. Investors – Investors will check startup ideas and either accept to invest
    or reject.

    - 2. Mentors/Consultants – Mentors may/may not accept mentorship based on a startup
    idea.

    - 3. Entrepreneur – He pitches the startup ideas to investors for investments
    and to mentors for mentorship.

    - 4. Admin – He maintains all the records of the application users and their credentials.

