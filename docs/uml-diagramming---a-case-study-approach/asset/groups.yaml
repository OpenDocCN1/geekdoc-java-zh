    # Design of UML Diagrams for Webmed ■ 37


    The nodes and the Execution Environment Node are used to represent the OS, database
    and the web browser. The attributes and the operations are represented using parts
    as that of the component diagram. The database is maintained in the service provider
    as it needs to search for the details of the patient in the event of register,
    finding a doctor and payment. The drug supplier node is used to illustrate the
    attributes and operations involved in the ordering and purchasing of drugs. The
    protocol that is used between the user and the service provider is Secure and
