    \ in database.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_88_0.png)\n\n# Chapter\
    \ 5\n\n## Design of UML Diagrams for E-Ticketing for Buses\n\n### 5.1 Problem\
    \ Statement\n\nIn this case study, a software package to automate the manual procedures\
    \ of reserving a bus ticket is made through Software Maintenance and Development\
    \ Center (SMDC) Travels. Specifically, the objectives of this case study consist\
    \ of providing a web-based bus ticket reservation function where a customer can\
    \ buy a bus ticket through the online system without a need to queue up at the\
    \ counter to purchase a bus ticket, enabling customers to check the availability\
    \ and types of buses online. Customer can check the time departure for every Indian\
    \ Tourist Centre (ITC) bus through the system, easing bus ticket payment by obtaining\
    \ a bank pin after payments is made to the various designated banks, the ability\
    \ of customers to cancel their reservation, admin user privileges in updating\
    \ and cancelling payment, route and vehicle records (Figures 5.1–11).\n\n### 5.2\
    \ UML Diagrams\n\n76 UML Diagramming\n\nFigure 5.1 UML usecase diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_90_0.png)\n\
