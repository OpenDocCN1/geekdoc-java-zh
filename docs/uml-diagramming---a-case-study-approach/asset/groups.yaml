    Basic Flow: The user enters the old password, new password and retypes the new
    password for confirmation.

    Alternative Flow: The user may not want to change the password and can go back.

    Pre-Conditions: The users should have a user account and an existing password.

    Post-Conditions: The old password is verified with the database and if it is correct,
    the new password is checked with the retyped password and that is set.


    ## 3. Add Goods

    Description: This usecase allows the actors to add goods to the inventory.

    Flow of Events

    Basic Flow: The actor enters all the details about a particular good including
    the name, price and quantity added.

    Alternative Flow: No goods would have arrived from the supplier and the actor
    goes back.

    Pre-Conditions: The goods should have arrived and the actor should have known
    all the details about the goods.

    Post-Conditions: The entered details of a particular good will be stored in the
    inventory.


    ## 4. Remove Goods

    Description: This usecase allows the actors to remove one or more goods from the
    inventory.

    Flow of Events

    Basic Flow: The actor enters the item''s ID or the item''s name and quantity to
    be removed.

    Alternative Flow: The actor may not want to remove the good or may not know the
    number of goods to be removed and goes back.

    Pre-Conditions: The actor should know which item he/she is going to remove and
    the quantity to be removed.

    Post-Conditions: The item''s id or name is searched for in the inventory and the
    specified number of that is removed.


    ## 5. Expired Goods

    Description: This usecase allows the actors to view all the expired goods and
    allow them to remove those goods from the inventory.

    Flow of Events

    Basic Flow: The expired goods are displayed and the actor clicks on the remove
    button to remove them.

    Alternative Flow: The expired goods are displayed but the actor decides to have
    them on the inventory and goes back.

    Pre-Conditions: There should be atleast one expired good for this usecase to function.

    Post-Conditions: The expired good is removed from the inventory.


    ## 6. Place Order

    Description: This usecase allows the actors to place an order from the inventory.

    Flow of Events

    Basic Flow: The actor chooses the item he/she wants to buy, specifies the quantity,
    gives the address and contact details and clicks on place order.

    Alternative Flow: The actor may decide not to buy anything at that instant and
    goes back.

    Pre-Conditions: The actor is allowed to choose only between the items that are
    available in the inventory.

    Post-Conditions: The requested item and the quantity is recorded and the item
    is delivered to the specified address.


    ## Design of UML Diagrams 49


    ## 7. Invoice Generation

    Description: This usecase generates the invoice for the items that are bought
    from the supplier.

    Flow of Events

    Basic Flow: The item''s name, price and quantity are taken and the total amount
    is calculated.

    Alternative Flow: The required details may not be present and thus invoice is
    not generated.

    Pre-Conditions: The requested item by the inventory manager should be available
    with the supplier.

    Post-Conditions: The invoice is generated and it is received.


    ## 8. Search Item

    Description: The usecase allows the actors to search for an item that is present
    in the inventory.

    Flow of Events

    Basic Flow: The actor enters the item''s id or the item''s name and clicks on
    the search button.

    Alternative Flow: The actor may not know which item he/she wants to search and
    goes back.

    Pre-Conditions: The item that is to be searched must be present in the inventory.

    Post-Conditions: The entered item is searched and displayed.


    ## 9. Edit Goods

    Description: This usecase allows the actors to edit the details regarding the
    goods that have been entered already.

    Flow of Events

    Basic Flow: The required item is searched, old details are deleted and the new
    details are entered.

    Alternative Flow: The item that is searched for may not be present in the inventory.

    Pre-Conditions: The searched item should be present in the inventory.

    Post-Conditions: The details that are changed are updated and stored.


    ## 10. Customer Request

    Description: This usecase allows the customers (actors) to place a request for
    the item they need.

    Flow of Events

    Basic Flow: The actor enters the item and the quantity he/she needs.

    Alternative Flow: The actor may not know what he/she needs clearly and can go
    back.

    Pre-Conditions: The requested item should not exist in the inventory.

    Post-Conditions: The requested item is stored and it is placed as an order to
    the supplier.


    ## 11. Receipt Generation

    Description: This usecase generates the receipt for the items that the customers
    buy.

    Flow of Events

    Basic Flow: The item, quantity the customer buys is entered and the bill amount
    is calculated.

    Alternative Flow: The customer may not buy any item.

    Pre-Conditions: The items should be present in the inventory.

    Post-Conditions: The bill amount is generated and the customer is notified.


    # 50 UML Diagramming


    ## 12. Discount and Tax Generation

    Description: This usecase calculates the discount and tax for the total bill amount.

    Flow of Events

    Basic Flow: The net total amount is taken and the corresponding discount and the
    tax is calculated and added to the net total to get the grand total.

    Alternative Flow: There may not be any discounts.

    Pre-Conditions: The net total should be calculated for the items bought.

    Post-Conditions: The grand total is calculated and the customer is notified.


    ## 13. Cancel Receipt

    Description: This allows the actors to cancel a generated receipt.

    Flow of Events

    Basic Flow: The actor enters the bill number and clicks on Cancel button.

    Alternative Flow: The receipt may not be cancelled and it is correct.

    Pre-Conditions: The searched receipt that needs to be cancelled should be generated
    previously.

    Post-Conditions: The selected receipt is cancelled and the respective items are
    added to the inventory.


    ## 14. Replace Item

    Description: This usecase allows the actors to replace an item from the inventory.

    Flow of Events

    Basic Flow: The actor enters the item to be replaced.

    Alternative Flow: The actor does not want to replace and goes back.

    Pre-Conditions: The item to be replaced must be bought beforehand.

    Post-Conditions: The specified item is replaced with another item from the inventory.


    ## 15. View Summary Report

    Description: This usecase allows the actors to view the summary report of all
    transactions.

    Flow of Events

    Basic Flow: The actor views the summary report that is generated.

    Alternative Flow: The actor goes back without viewing.

    Pre-Conditions: There must be some transactions that should have taken place.

    Post-Conditions: The summary report is generated and is viewed by the actors.


    - UML Class Diagram: It focuses on the relationship among various attributes along
    with the operations associated with each of them, with respect to classes (Figure
    3.13).

    - UML Activity Diagram: The purpose of the activity diagram is to have a visual
    depiction of the flow of events in the system (Figure 3.14).

    - UML State Diagram: The purpose of the state machine diagram is to design and
    understand time-critical systems. It helps in understanding the behaviour of the
    system and it expresses the behaviour in terms of series of steps, triggering
    events and the actions that may occur (Figure 3.15).

    - UML Sequence Diagram: The purpose of this diagram is to order the events identified
    earlier using sequence, and activity diagram. It is also used to trace the execution
    of the problem domain (Figure 3.16).

    - UML Communication Diagram: The diagram focuses on how strongly objects communicate
    with each other with the help of messages (Figure 3.17).

    - UML Component Diagram: It focuses on how every component collaborates with every
    other component using available interfaces to provide the major functionalities
    of the system (Figure 3.18).

