    ## Usecase Specification


    + 1. Register

    Description: User should register to get access the application.

    Flow of Events

    Basic Flow: Allows user to undergo the verification process.

    Pre-Conditions: User should be the citizen of India.

    Post-Conditions: Providing details and verification process.


    + 2. Verify OTP Number

    Description: User should enter the OTP number provided by the system for the verification
    process.

    Flow of Events

    Basic Flow: Allows user into the system after authorized by the admin.

    Alternate Flow: Displays error message if the user has entered an OTP number.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    + 3. Access Device Location

    Description: The user must turn on his/her device location and accept the conditions
    of the application.

    Flow of Events

    Basic Flow: Allows user into the system after authorized by the admin.

    Alternate Flow: Displays error message if the location is not turned on.

    Pre-Conditions: Users should be in India.

    Post-Conditions: Nil.


    + 4. Personal Details

    Description: Users should provide all the necessary details asked by the system.

    Flow of Events

    Basic Flow: Allows user into the system after authorized by the admin.

    Alternate Flow: Displays error message if the provided details are wrong.

    Pre-Conditions: Nil.

    Post-Conditions: Nil.


    + 5. Error Message

    Description: If the entered user''s OTP number is wrong.

    Flow of Events

    Basic Flow: Gets out of the system.

    Alternate Flow: Nil.

    Pre-Conditions: User should enter the correct OTP number.

    Post-Conditions: Nil.


    + 6. Author

    Description: Admin authorizes the user into the system after the verification
    process.

    Flow of Events

    Basic Flow: Allows user into the system.

    Alternate Flow: Displays error message if the verification process gets failed.

    Pre-Conditions: Verification process should be done correctly by the user.

    Post-Conditions: Nil.


    + 7. Error Message Again

    Description: If the admin did not authorize the user, users should retry.

    Flow of Events

    Basic Flow: Gets out of the system.

    Alternate Flow: Nil.

    Pre-Conditions: Authorization should be done properly.

    Post-Conditions: Nil.


    + 8. User Status

    Description: To check the users'' health conditions.

    Flow of Events

    Basic Flow: Allows user to take a self-analysis test.

    Alternate Flow: Nil.

    Pre-Conditions: The admin should authorize the user.

    Post-Conditions: User should answer the health questions correctly.


    + 9. Media

    Description: The System provides the users with advices, healthcare tips and trending
    videos.

    Flow of Events

    Basic Flow: Allows user many categories of videos provided by the system.

    Alternate Flow: Nil.

    Pre-Conditions: The admin should authorize the user.

    Post-Conditions: Nil.


    + 10. Covid-19 Updates

    Description: The system provides the users with a daily number of positive cases.

    Flow of Events

    Basic Flow: Allows users to know the number of cases around their area.

    Alternate Flow: Nil.

    Pre-Conditions: The admin should authorize the user.

    Post-Conditions: Nil.


    + 11. Health-Related Questions

    Description: The user should answer the health care questions in order to check
    their health condition.

    Flow of Events

    Basic Flow: Splits the users into feeling well and not feeling categories accordingly.

    Alternate Flow: Nil.

    Pre-Conditions: The admin should authorize the user.

    Post-Conditions: If the user is not feeling well, he/she should consult a doctor.


    + 12. Feeling Well

    Description: The system provides the users with the output of the self-analysis
    test as feeling well.

    Flow of Events

    Basic Flow: Nil.

    Alternate Flow: Nil.

    Pre-Conditions: The users must take the self-analysis test.

    Post-Conditions: Nil.


    + 13. Not Feeling Well

    Description: The system provides the users with the output of the self-analysis
    test as feeling well.

    Flow of Events

    Basic Flow: Suggests users to consult a doctor.

    Alternate Flow: Nil.

    Pre-Conditions: The users must take the self-analysis test.

    Post-Conditions: Nil.


    + 14. Consult Doctor

    Description: If the users are not feeling well, the system suggests the users
    to consult a doctor.

    Flow of Events

    Basic Flow: Suggests users to call healthcare members.

    Alternate Flow: Nil.

    Pre-Conditions: The users must take the self-analysis test.

    Post-Conditions: Nil.


    + 15. Call Helpline

    Description: In case the users are not feeling well, the system suggests the users
    to call helpline.

    Flow of Events

    Basic Flow: Nil.

    Alternate Flow: Nil.

    Pre-Conditions: The users must take the self-analysis test.

    Post-Conditions: Nil.

