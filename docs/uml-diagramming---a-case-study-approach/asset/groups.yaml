    # Chapter 31 Design of UML Diagrams for Placement Automation System


    ## 31.1 Problem Statement


    Placement provides the opportunity for the students to gain Specific Subject skills
    as well as Real employability skills. Placement Offices play a crucial role in
    providing students the necessary training and various opportunities the students
    can effectively evidence their skills and abilities on their resume. Hence, the
    Automation of Placement office provides a more smooth placement process for both
    the companies and the students. This System mainly focuses on flows between the
    company''s activity, Registration, Resumes, Users, Skills and Their Training.
    Hence, the system comprises five modules, namely, User module, Company module,
    Admin module, Registration module and Training module.


    Functionalities:

    - Add a new company

    - Delete/update a company

    - Keeps track of students interested in placements

    - Add a new training for students (which is demanded by many companies)

    - Update/delete a training (which are not demanded by many companies), etc.


    User (Job Seeking Student) can:

    - Register for a particular job

    - Register for a particular company

    - Undertake a training

    - Submit resume

    - Update resume, etc.


    Company can:

    - Register in the placement office

    - View Student resume

    - Recruit a student with good resume and skills

    - Recruit a student trained in a specific area, etc. (Figures 31.1–31.8).


