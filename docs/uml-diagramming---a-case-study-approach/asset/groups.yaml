    ## 14. View Users


    Description: Admin can view the users who logged into the page.

    Flow of Events

    Basic Flow: It allows to view the users who are currently logged in the system.

    Alternative Flow: It directs to the home page.

    Pre-Conditions: He/She must be an admin to view the users.

    Post-Conditions: It directs to the home page.


    ## 15. Update Medicine


    Description: Admin can view the number of medicines available and update them
    on the website.

    Flow of Events

    Basic Flow: It allows to update the medicine.

    Alternative Flow: It directs to the home page.

    Pre-Conditions: Update the medicines.

    Post-Conditions: It directs to the home page.


    ## 16. Add/Delete Medicine


    Description: It allows the admin to add/delete medicines based on the quantity
    available.

    Flow of Events

    Basic Flow: Adding/deleting the medicines.

    Alternative Flow: It redirects to the update medicine page.

    Pre-Conditions: It adds/deletes the medicines.

    Post-Conditions: It redirects to the update medicine page.


