    ## Chapter 9


    ## Design of UML Diagrams for Online Marketplace


    ## 9.1 Problem Statement


    Various new small scale and medium scale sellers face difficulties to reach out
    to the customers and sell their products along with other competing products in
    the market. This increases their overall cost, thus reducing their profit or even
    causing loss. E-Retail is an online marketplace application case study where small
    and medium scale sellers can list, showcase, advertise and sell their products
    directly to the customers without any physical store. E-Retail aims in providing
    a dynamic platform for all small and medium scale sellers to reach out and sell
    their products directly to all range of customers at a competing price without
    the need of any physical store. This enables the sellers to eliminate the cost
    of rent or maintenance of a physical store and to minimize other related costs.
    It also aims in promoting direct communication between the seller and customer,
    hence providing a trusted relationship between them. New sellers can easily authenticate
    and signup to the portal and sell their products in the portal. The application
    offers separate login for sellers and customers, where the sellers and customers
    can view all the products available from various sellers and buy those products.
    It also facilitates online payments for purchasing the products. Customers can
    rate or give a review for the product and seller. Customers can also report a
    seller for any violations in delivery or if the product does not meet the specified
    requirement. Customers can also view the contact information and the rating of
    the seller before buying the product (Figures 9.1–9).


    ![](img/d57b893f2cab246eeea62e79849bffd0_128_0.png)


    **Figure 9.1** UML usecase diagram.


    ## 9.2 UML Diagrams


    Actor Specification


    1. **Admin** – Admin authenticates the new customers logging in to the system
    and verifies the new seller that registers to the system. Admin also verifies
    the reports issued by the customers against the sellers.

    2. **Customers** – Customers are the users who logins into the system, to view
    and buy products sold by sellers in the application.

    3. **Payment Service Provider** – Payment service providers act as a mediator
    between merchants, card brand networks and other financial institutions to process
    the electronic transactions in the application.

    4. **Sellers** – Sellers are small or medium scale businesses, who can sell products
    directly to potential customers using the applications.


    Usecase Specification


    1. **Customer Login**

    Description: Each customer has to login to the system using a username and password
    for the application.

    Flow of Events

    Basic Flow: Authenticates the user and grants access to the system.

    Alternative Flow: Invalid username and password, try correct username and password.

    Pre-Conditions: Valid username and password.

    Post-Conditions: Nil.


    ![](img/d57b893f2cab246eeea62e79849bffd0_129_0.png)


    Figure 9.2 UML activity diagram (part 1).


    3. Seller Verification

    - Description: After registration, each seller is verified before being able to
    sell.

    - Flow of Events

    - Basic Flow: The registered seller is verified and they can sell their products.

    - Alternative Flow: Verification of the seller is failed and they cannot sell
    their products.

    - Pre-Conditions: Each seller must be registered.

    - Post-Conditions: Nil.


    ![](img/d57b893f2cab246eeea62e79849bffd0_130_0.png)


    Figure 9.3 UML activity diagram for sub-activity make payment.


    ## 4. Sale Products


    Description: Verified Sellers can showcase their products for sale.

    Flow of Events

    Basic Flow: Sellers list their products along with their description and price.

    Alternative Flow: Sellers unable to sell the products.

    Pre-Conditions: Sellers must be verified before listing the products for sale.

    Post-Conditions: Nil.


    ## 5. Promote Products


    Description: Sellers can promote their products listed for sale.

    Flow of Events

    Basic Flow: Sellers promoting their products listed for sale.

    Alternative Flow: Sellers unable to sell the products.

    Pre-Conditions: Sellers must be verified before listing the products for sale.

    Post-Conditions: Nil.


    ## 6. View Products


    Description: Customers can view the products available from various sellers.

    Flow of Events

    Basic Flow: Customers viewing the products.

    Alternative Flow: Products unavailable.

    Pre-Conditions: Customer must be logged in.

    Post-Conditions: Customers can select a product to buy.


    ![](img/d57b893f2cab246eeea62e79849bffd0_131_0.png)


