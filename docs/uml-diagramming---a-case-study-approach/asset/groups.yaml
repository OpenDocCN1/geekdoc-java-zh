    ![](img/d57b893f2cab246eeea62e79849bffd0_375_3.png)\n![](img/d57b893f2cab246eeea62e79849bffd0_375_4.png)\n\
    ![](img/d57b893f2cab246eeea62e79849bffd0_375_5.png)\n![](img/d57b893f2cab246eeea62e79849bffd0_375_6.png)\n\
    ![](img/d57b893f2cab246eeea62e79849bffd0_375_7.png)\n![](img/d57b893f2cab246eeea62e79849bffd0_375_8.png)\n\
    \nFigure 35.5 UML state chart diagram.\n\n![](img/d57b893f2cab246eeea62e79849bffd0_376_0.png)\n\
    \nFigure 35.6 UML class diagram.\n\n### 4. View Product\nDescription: The buyer\
