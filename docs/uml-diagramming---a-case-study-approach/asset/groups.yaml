    # 第 38 章


    # 网站开发的 UML 图设计


    ## 38.1 问题描述


    Mega Associates 是一家不断发展的建筑设计事务所，正面临着激烈的竞争。竞争对手拥有现代化且制作良好的网站，这正在将该公司的部分客户引向他们。为了避免这种情况发生并留住公司的所有客户同时吸引新客户，需要一个与目新的网站。该公司的网站应该包括公司的主要项目、所有可用部门和合作的简要、关于公司的最新新闻、公司的见解、公司历史、邮件或聊天功能，以及有关该公司的职业机会（图
    38.1–38.8）。


    ## 38.2 UML 图


    ### 参与者规范


    - 1. 客户 – 访问网站以了解/联系该公司的客户。

    - 2. 员工候选人 – 任何寻找公司工作机会的大学毕业生或其他建筑师。

    - 3. 公司员工 – 他/她是负责公司相关更新工作的的员工。


    ### 用例规范


    + 1. 显示项目

    描述：该功能涉及显示公司完成的所有主要项目。

    事件流

    基本流：显示公司的项目。

    替代流：无。

    前置条件：无。

    后置条件：无。


