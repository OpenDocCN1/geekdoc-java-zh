    后置条件：如果客户想就项目联系公司，可以使用联系功能提供的详细信息中的公司联系方式。


    + 4. 公司历史

    描述：此功能显示公司的历史。

    事件流

    基本流：显示公司的历史。

    替代流：无。

    前置条件：无。

    后置条件：无。


