    ## 30.2 UML 图


    ### 角色说明


    - 1. 管理员 – 可以查看详情、接受申请并更新状态。

    - 2. 申请人 – 可以申请签证、查看详情、取消申请、检查状态并提供反馈（可选）。

    - 3. 签证官 – 查看申请目的、验证证明并接受或拒绝签证。


    # UML 图


    ## 用例说明


    ## 1. 接受申请

    描述：允许管理员接受申请人的的申请。

    事件流

    基本流：在线提交表单并支付后，申请被接受。

    替代流：无。

    前置条件：表单详情应填写正确并已缴纳签证处理费。

    后置条件：无。


    ## 2. 接受签证

    描述：允许签证官接受（批准）学生的签证。

    事件流

    基本流：验证文件正确后，签证官接受签证。

    替代流：无。

    前置条件：附了有效的证明文件。

    后置条件：无。


    ## 3. 申请签证

    描述：帮助申请人通过在线填写申请表申请签证。

    事件流

    基本流：在提交表单前应正确填写一组细节。

    替代流：无。

    前置条件：申请人已注册。

    后置条件：申请人填写的细节应正确。


    ## 4. 批准签证

    描述：允许签证官接受或拒绝签证申请。

    事件流

    基本流：签证官在验证提交的证明文件后接受或拒绝签证。

    替代流：无。

    前置条件：应检查证明文件的正确性。

    后置条件：如果验证文件正确，则接受签证；否则拒绝。


    ## 5. 身份验证

    描述：用于在登录时验证凭据。

    事件流

    基本流：要求用户输入有效的用户名和密码。

    替代流：用户重定向到登录页面。

    前置条件：用户应拥有有效的凭据。

    后置条件：凭据应正确。


    ## 6. 取消申请

    描述：允许用户取消其申请。

    事件流

    基本流：如果申请人不再需要申请签证，则提供取消申请的选项。


