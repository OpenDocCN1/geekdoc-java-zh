    \ When reversing the entry order, Hibernate will update the entry column:\n\n\
    ```\nUPDATE post_tag SET entry = 0 WHERE post_id = 1 AND tag_id = 4\nUPDATE post_tag\
    \ SET entry = 1 WHERE post_id = 1 AND tag_id = 3\n```\n\n> The most efficient\
    \ JPA relationships are the ones where the foreign key side is controlled by a\
    \ child-side @ManyToOne or @OneToOne association. For this reason, the many-to-many\
    \ relationship is best mapped with bidirectional @OneToMany associations. The\
    \ entity removal and the element order changes are more efficient than the default\
    \ @ManyToMany relationship and the junction entity can also map additional columns\
    \ (e.g. created_on, created_by)."
