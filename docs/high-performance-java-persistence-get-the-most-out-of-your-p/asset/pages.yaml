  md: '# Propagation


    To configure the propagation strategy for EJB components, Java EE defines the
    @TransactionAttribute annotation. Java EE 7, even non-EJB components can now be
    enrolled in a transactional context if they are augmented with the @Transactional
    annotation.


    In Spring, transaction propagation (like any other transaction properties) is
    configurable via the @Transactional annotation.


    ```

    http://docs.oracle.com/javaee/7/api/javax/ejb/TransactionAttribute.html

    http://docs.oracle.com/javaee/7/api/javax/transaction/Transactional/annotation/Transactional.html

    http://docs.spring.io/spring-framework/framework/transaction/annotation/Transactional.html#propagation--

    ```


    Table 7.6: Transaction propagation strategies


    | Propagation | Java EE | Spring | Description |

    |---|---|---|---|

    | REQUIRED | Yes | Yes | this is the default propagation strategy, and it only
    starts a transaction unless the current thread isn''t already associated with
    a transaction context |

    | REQUIRES_NEW | Yes | Yes | any current running transaction context is suspended
    and replaced by a new transaction |

    | SUPPORTS | Yes | Yes | if the current thread already runs inside a transaction,
    this method will use it, otherwise it will execute outside of a transaction context
    |

    | NOT_SUPPORTED | Yes | Yes | any current running transaction context is suspended,
    and the current method is out of a transaction context |

    | MANDATORY | Yes | Yes | the current method runs only if the current thread is
    already associated with a transaction context |

    | NESTED | No | Yes | the current method is executed within a nested transaction
    if the current thread is already associated with a transaction, otherwise a new
    transaction is started |

    | NEVER | No | Yes | the current method must always run outside of a transaction
    context, and if the current thread is associated with a transaction, an exception
    is thrown.'
