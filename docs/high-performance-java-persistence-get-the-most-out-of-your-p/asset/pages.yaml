  md: '# 3.3 Queuing theory capacity planning


    Little''s Law³ is a general-purpose equation applicable to any queuing system
    being in a stable state (the arrival rate is not greater than the departure rate).


    According to Little''s Law, the average time for a request to be serviced depends
    only on the long-term request arrival rate and the average number of requests
    in the system.


    ```

    $L = \lambda \times W$

    ```


    +   - L average number of requests in the system (including both the requests
    being serviced and the ones waiting in the queue)

    - $\lambda$- long-term average arrival rate

    - W average time a request spends in a system.


    Assuming that an application-level transaction uses the same database connection
    throughout its whole lifecycle, and the average transaction response time is 100
    milliseconds,


    ```

    $W = 100\ ms = 0.1\ s$

    ```


    if the average connection acquisition rate is 50 requests per second,


    ```

    $$\lambda = 50 \frac{connection requests}{s}$

    ```


    then the average number of connection requests in the system is:


    ```

    $L = \lambda \times W = 50 \times 0.1 = 5 \ connection requests$

    ```


    A pool size of 5 can accommodate the average incoming traffic without having to
    enqueue any connection request. If the pool size is 3, then, on average, 2 requests
    are enqueued and waiting for connections to become available.


    Little''s Law operates with long-term averages and that might not be suitable
    when considering intermittent traffic bursts. In a real-life scenario, the connection
    pool must adapt to short-term traffic spikes, and it''s important to consider
    the actual connection pool throughput.


    In queuing theory, throughput is represented by the departure rate ($\mu$), and
    for a connection pool, it represents the number of connections offered in a given
    unit of time:


    ```

    $$\mu = \frac{Ls}{Ws} = \frac{pool\ size}{connection lease time}$

    ```


    > ³http://en.wikipedia.org/wiki/Little%27s_law'
