  md: '# Why JPA and Hibernate matter


    # The second-level cache


    If the Persistence Context acts as a transactional write-cache, its lifetime is
    bound to that of a logical transaction. For this reason, the Persistence Context
    is also known as the first-level cache, and it cannot be shared by multiple concurrent
    transactions.


    On the other hand, the second-level cache is associated with an EntityManagerFactory,
    and all Persistence Contexts have access to it. The second-level cache can store
    entities as well as entity associations (one-to-many and many-to-many relationships)
    and even entity query results. Because JPA does not make it, each provider takes
    a different approach to caching as opposed to EclipseLink, by default, Hibernate
    disables the second-level cache.


    Most often, caching is a trade-off between consistency and performance. Because
    the cache becomes another source of truth, inconsistencies might occur, and they
    can be prevented only when all database modifications happen through a single
    EntityManager or through a synchronized distributed caching solution. In reality,
    this is not practical since the application might be clustered on multiple nodes
    (each with its own EntityManager) and the database might be accessed by multiple
    applications.


    > Although the second-level cache can mitigate the entity fetching issues, it
    requires a distributed caching implementation, which might not elude the networking
    penalties anyway.


    # 8.6 Wrap-up


    Bridging two highly-specific technologies is always a difficult problem to solve.
    When the enterprise system is built on top of an object-oriented language, the
    object-relational impedance mismatch becomes inevitable. The ORM pattern aims
    to close this gap although it cannot completely abstract it.


    In the end, all the communication flows through JDBC and every execution happens
    in the database engine itself. A high-performance enterprise application must
    resonate with the underlying database system, and the ORM tool must not disrupt
    this relationship.


    Just like the problem it tries to solve, Hibernate is a very complex framework
    with many subtleties that require thorough knowledge of both database systems,
    JDBC and the framework itself. This chapter is only a summary, meant to present
    JPA and Hibernate into a different perspective than what the reader might have
    been previously used. There is no need to worry if some topics are not entirely
    clear because the upcoming chapters will analyze all these concepts in greater
    detail.'
