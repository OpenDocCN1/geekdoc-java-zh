  md: "# Equality-based entity removal\n\nThe helper method for the child entity removal\
    \ relies on the underlying child object equality for matching the collection entry\
    \ that needs to be removed.\n\nIf the application developer doesn't choose to\
    \ override the default equals and hashCode methods, the java.lang.Object identity-based\
    \ equality is going to be used. The problem with this approach is that the application\
    \ developer must supply a child entity object reference that's contained in the\
    \ current child session.\n\nSometimes child entities are loaded in one web request\
    \ and saved in a HttpSession or a Stateful Enterprise Java Bean. Once the Persistence\
    \ Context, which is closed, the entity becomes detached. If the child entity is\
    \ for removal in a new web request, the child must be reattached or merged into\
    \ the Persistence Context. This, if the parent entity is loaded along its child\
    \ entities, the removal operation will work properly since the removing entity\
    \ is already managed and contained in the collection.\n\nIf the entity hasn't\
    \ changed, reattaching this entity is redundant so the equals and the hashCode\
    \ methods must be overridden to express equality in terms of a unique business\
    \ key. In case the child entity has a @Natural or a unique property/properties\
    \ set, the equals and the hashCode methods can be implemented on top of that.\
    \ Assuming the PostComment entity has the following columns whose combination\
    \ render a unique business key, the equality contract can be implemented as follows:\n\
    \n```\nprivate String createdBy;\n\n@Temporal(Temporal.TIMESTAMP)\nprivate Date\
    \ createdOn = new Date();\n\n@Override\npublic boolean equals(Object o) {\n  \
    \  if (this == o) return true;\n    if (o == null || o.getClass() != o.getClass())\
    \ return false;\n    PostComment.that = (PostComment) o;\n    return Objects.equals(createdBy,\
    \ that.createdBy) &&\n           Objects.equals(createdOn, that.createdOn);\n\
    }\n\n@Override\npublic int hashCode() {\n    return Objects.hash(createdBy, createdOn);\n\
    }\n```"
