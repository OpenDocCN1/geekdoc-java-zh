  md: '# 8. Why JPA and Hibernate matter


    Although JDBC does a very good job of exposing a common API that hides the database
    vendor-specific communication protocol, it suffers from the following shortcomings:


    +   - the API is undoubtedly verbose, even for trivial tasks

    - batching is not transparent from the data access layer perspective, requiring
    a specific API than its non-batched statement counterpart

    - lack of built-in support for explicit locking and optimistic concurrency control

    - for local transactions, the data access is tangled with transaction management
    semantics.

    - fetching joined relations requires additional processing to transform the ResultSet
    into Domain Models or DTO (Data Transfer Object) graphs.


    The primary goal of an ORM (Object-Relational Mapping) tool is to automatically
    translate state statements into SQL statements, this chapter aims to demonstrate
    that Hibernate address all the aforementioned JDBC shortcomings.


    > ### Java persistence history

    TheJB 1.1 release offered a higher-level persistence abstraction from scalable
    enterprise components, known as Entity Beans. Although the design looked good
    on paper, in reality, the heavyweight MRI-based implementation proved to be disastrous
    from a performance perspective. Neither the EJB 2.0 support for local interfaces
    could the Entity Beans popularity, and due to high-complexity and vendor-specific
    implementation details, most projects chose JDBC instead.


    Hibernate was born out of all the frustration from the Entity Bean developing
    model. As an open-source project, Hibernate managed to gain a lot of popularity,
    and so it became the facto persistence framework.


    In response to the criticism against Entity Bean persistence, the Java Community
    Process advanced a lightweight POJO-based approach, and the JDO specification
    was. Although JDBC is data source agnostic, capable of operating with relation
    databases as well as NoSQL or flat files, it never managed to hit mainstream popularity.
    For this reason, the Java Community Process decided that EJB3 would be based on
    a new specification, inspired by Hibernate and TopLink, and JPA (Java Persistence
    API) became the standard Java enterprise persistence technology.


    The morale of this is that persistence is a very complex topic, and it demands
    a great deal of knowledge of both the database and the data access usage patterns.'
