  md: '# 6.1 ResultSet scrollability


    The JDBC ResultSet can be traversed using an application-level cursor. The fetching
    mechanism is therefore hidden behind an iterator API which decouples the application
    code from the data retrieval strategy. Some database drivers prefetch the whole
    result set on the client-side, while other implementations retrieve batches of
    data on a demand.


    By default, the ResultSet uses a forward-only application-level cursor, which
    can be traversed only once, from the first position to last one. Although this
    is sufficient for many applications, JDBC also offers scrollable cursors, allowing
    the row-level pointer to be positioned freely (in any direction and on every record).


    The main difference between the two scrollable result sets lays in their selectivity.
    An insensitive cursor uses a static view over the current result set, so the data
    needs to be fetched entirely prior to being iterated. A sensitive cursor allows
    the result set to be fetched dynamically, so it can reflect concurrent changes.


    # Oracle

    Since the database engine doesn''t offer support for scrollable result sets, the
    JDBC driver emulates on top of a client-side caching mechanism. As a consequence,
    the result set shouldn''t be too large as otherwise it can easily fill the client
    application memory.


    > A sensitive scrollable result set is limited to selecting data from a single
    table


    https://docs.oracle.com/database/121/JDBC/resultset.html#JDBCBC28615


    # SQL Server

    All cursor types are supported. An insensitive cursor generates a server-side
    database snapshot, while the client fetches batches in batches. The sensitive
    cursor uses a server-side updateable window and changes are synchronized only
    for the current processing window.


    > The driver suggests using read-only cursors when there is no intent on updating
    the set. The forward-only scroll delivers the best performance for small result
    sets.'
