    First, all junction table rows associated with the parent entity are deleted,
    and then the remaining in-memory records are added back again. The problem with
    this approach is that instead of a single table remove operation, the database
    has way more DML statements to execute.


    Another problem is related to indices. If there is an index on each foreign key
    column (which is the default for many relational databases), the database engine
    must delete the associated index entries only to add back the remaining ones.
    The more elements a collection has, the less efficient a operation will get.'
