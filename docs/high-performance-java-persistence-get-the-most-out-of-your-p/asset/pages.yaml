  md: '# 11.3.1 Bidirectional @OneToMany


    The bidirectional @OneToMany association has a matching @ManyToOne child-side
    mapping that controls the underlying one-to-many table relationship. The parent-side
    is mapped as a collection of child entities.


    | Post | Long | PostComment | Long |

    | :--- | :--- | :--- | :--- |

    | id | String | id | String |

    | title | String | review | String |

    | comments | List<PostComment> | post | Post |

    | getId() | Long | getId() | Long |

    | setLong(Long) | void | setLong(Long) | void |

    | getTitle() | String | getReview() | String |

    | setTitle(String) | void | setReview(String) | void |

    | getComments() | List<PostComment> | getPost() | Post |

    | addComment(PostComment) | void | setPost(Post) | void |

    | removeComment(PostComment) | void | setPost(Post) | void |


    Figure 11.4: Bidirectional @OneToMany relationship


    In a bidirectional association, the @OneToMany mapping, it''s the child-side @ManyToOne
    association in charge of keeping the foreign key column value in sync with the
    in-memory Persistence Context. This is the reason why the bidirectional @OneToMany
    relationship must define the mappedBy attribute, indicating that it only mirrors
    the @OneToMany child-side mapping.


    ```

    @OneToMany(mappedBy = "post", cascade = CascadeType.ALL, orphanRemoval = true)

    private List<PostComment> comments = new ArrayList<>();

    ```


    > Even if the child-side is in charge of synchronizing the entity state changes
    with and the database foreign key column value, a bidirectional association must
    always have both the parent-side and the child-side in sync.'
