  md: 'Connection Management and Monitoring


    # 9.4 Statement logging


    An ORM tool can automatically generate DML statements, and it is the application
    developer responsibility to validate its effectiveness as well as its overall
    performance impact. Deferring the SQL statement validation until the access layer
    starting performance issues is risky, and it can even impact development cost.
    For this reason, SQL statement logging becomes relevant from the early stages
    of application development.


    > When a business logic is implemented, the Definition of Done should include
    a review of all the associated data access layer operations. Following this rule
    can save a lot of hassle when the enterprise system is deployed into production.


    Although the JPA 2.1 doesn''t feature a standard configuration property for logging
    SQL statements, most JPA implementations support this feature through framework-specific
    setups. For this purpose, Hibernate defines the following configuration properties:


    Table 9.4: Connection release modes


    | Property | Description |

    |---|---|

    | hibernate.show_sql | Prints SQL statements to the console |

    | hibernate.format_sql | Formats SQL statements before being logged or printed
    to the console |

    | hibernate.use_sql_comments | Adds comments to the automatically generated SQL
    statement |


    Using the System console for logging is bad practice, a logging framework (e.g.
    Logback or Log4j) being a better alternative for it supports configurable appenders
    and logging levels.


    > Because it prints to the console, the hibernate.show_sql property should be
    avoided.


    Hibernate logs all SQL statements on a debug level in the org.hibernate.SQL logging
    hierarchy.'
