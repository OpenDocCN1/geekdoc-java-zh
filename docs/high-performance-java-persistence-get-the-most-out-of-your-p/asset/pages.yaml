  md: "# 11.4.2 Bidirectional @OneToOne\n\nA bidirectional @OneToOne association allows\
    \ the parent entity to map the child-side as well:\n\n| Post | | | PostDetails\
    \ | |\n|---|---|---|---||\n| id | Long | id | Long |\n| title | String | createdOn\
    \ | Date |\n| details | PostDetails | createdBy | String |\n| m getId() | Long\
    \ | post | Post |\n| m setId(Long) | void | m getId() | Long |\n| m getTitle()\
    \ | String | m setId(Long) | void |\n| m setTitle(String) | void | m getCreatedOn()\
    \ | Date |\n| m getDetails() | PostDetails | m getCreatedBy() | String |\n| m\
    \ setDetails(PostDetails) | void | m getPost() | Post |\n| | | m setPost(Post)\
    \ | void |\n\nFigure 11.12: The bidirectional @OneToOne relationship\n\nThe parent-side\
    \ mappedBy the child-side (which can share the primary key with its parent) is\
    \ still in charge of this JPA relationship:\n\n```\n@OneToOne(mappedBy = \"post\"\
    , cascade = CascadeType.ALL, fetch = FetchType.LAZY)\nprivate PostDetails details;\n\
    ```\n\nBecause this is a bidirectional relationship, the Post entity must ensure\
    \ that both sides of this relationship are set, associating a PostDetails entity\
    \ entity:\n\n```\npublic void setDetails(PostDetails details) {\n    this.details\
    \ = details;\n    details.setPost(this);\n}\n```\n\nEven if the association is\
    \ lazy, when fetching a Post entity, Hibernate fetches the child entity as well:\n\
    \n```\nPost post = entityManager.find(Post.class, 1L);\n```"
