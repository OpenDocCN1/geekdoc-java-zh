- img_proc: true
  md: '# Performance and Scaling


    The number of load generators (database connections), for which the system hits
    its maximum capacity, depends on the USL coefficients solely.


    ```

    $Nmax = \sqrt{\frac{(1 - \alpha)}{\beta}}$

    ```


    The resulting capacity gain is relative to the minimum throughput, so the absolute
    system capacity is obtained as follows:


    ```

    $Xmax = X (1) \times C (Nmax)$

    ```


    # 2.2 Database connections boundaries


    Every connection requires a TCP socket from the client (application) to the server
    (database).


    The total number of connections offered by a database server depends on the underlying
    hardware resources, and finding how many connections a server can handle is possible
    through measurements and proven scalability models.


    +   SQL Server 2016* and MySQL 5.7* use thread-based connection handling.

    * PostgreSQL 9.5* uses one operating system process for each individual connection.

    * On Windows systems, Oracle uses threads, while on Linux, it uses process-based
    connections.

    * Oracle 12c* comes with a thread-based connection model for Linux Linux systems
