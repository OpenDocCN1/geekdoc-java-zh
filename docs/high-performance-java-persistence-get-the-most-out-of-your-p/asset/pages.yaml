  md: '# 7.6.1 Distributed transactions


    The difference between local and global transactions is that the former uses a
    single resource manager, while the latter operates on multiple heterogeneous resource
    managers. The ACID guarantees are still enforced on each individual resource,
    but a global transaction manager is mandatory to orchestrate the distributed transaction
    outcome.


    All transactional resource adapters are registered by the global transaction manager,
    which decides when a resource is allowed to commit or rollback. The Java EE resources
    become accessible through JNDI (Java Naming and Directory Interface) or CDI (Contexts
    and Dependency Injection).


    Spring provides a transaction management abstraction layer which can be configured
    to either local transactions (JDBC or RESOURCE_LOCAL*) JPA or global transactions
    through a stand-alone JTA transaction manager. The dependency injection mechanism
    auto-wires managed resources into Spring beans.


    # 7.6.1.1 Two-phase commit


    JTA makes use of the two-phase commit (2PC) protocol to coordinate the atomic
    resource commit in two steps: a prepare and a commit phase.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_118_0.png)


    In the former phase, a resource manager takes all the necessary actions to prepare
    the transaction for the upcoming commit. Only if all resource managers successfully
    acknowledge the preparation step, the transaction manager will proceed with the
    commit phase. If one resource does not acknowledge the prepare phase, the transaction
    manager proceeds to rolling back all current participants.


    If all resource managers acknowledge the commit phase, the global transaction
    ends successfully. If one resource fails to commit (or times), the transaction
    manager will have to retry this operation in a background thread until it succeeds
    or reports the incident for manual intervention.


    > *http://docs.oracle.com/javaee/7/api/javax/persistence/spi/PersistenceUnitType.htmlRESOURCE_LOCAL'
  merge: -1
  pgno: 118
