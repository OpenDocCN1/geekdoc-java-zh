  md: '# Performance and Scaling 9


    Being built on top of many open source projects (e.g. PHP, MySQL), Facebook³ uses
    a horizontal scaling architecture to accommodate its massive amounts of traffic.


    StackOverflow⁴ is the best example of a vertical scaling architecture. In one
    blog post⁵ Jeff Atwood explained that the price of Windows and SQL Server was
