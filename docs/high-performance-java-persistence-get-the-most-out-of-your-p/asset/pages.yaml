    # 7.2 Consistency


    A modifying transaction can be seen like a state transformation, moving the database
    from one valid state to another. The relational database schema ensures that all
    primary modifications (insert/update/delete statements), as well as secondary
    ones (issued by triggers), obey certain rules on the underlying data structures:


    +   * column types

    * column length

    * column nullability

    * foreign key constraints

    * unique key constraints

    * custom check constraints.


    Consistency is validating the transaction state change, so that all committed
    transactions leave the database in a proper state. If only one constraint gets
    violated, the entire transaction is rolled back and all modifications are going
    to be reverted.


    Although the application must validate user input prior to crafting database statements,
    the application-level checks cannot span over other concurrent requests, possibly
    coming from different web servers. When the database is the primary integration
    point, the advantages of a strict schema become even more apparent.'
