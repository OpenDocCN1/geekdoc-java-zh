  md: '# Connection Management and Monitoring


    For JTA transactions, the default mode might be too strict since not all Java
    EE application servers exhibit the same behavior for managing transactional resources.
    This way, it''s important to check if database connections can be closed outside
    of the EJB component that triggered the connection acquisition event. Spring-based
    enterprise systems don''t use Java Beans, and even when using a stand-alone JTA
    transaction, the after_transaction connection release mode might be just fine.


    It''s somehow intuitive that the after_statement mode incurs some performance
    penalty associated with the frequent acquisition/releasing connection cycles.
    For this reason, the following test measures the connection acquisition overhead
    when using Bitronix in a Spring application context. Each transaction executes
    the same statement (fetching the current timestamp) for a number of times (represented
    on the x-axis). The y-axis captures the recorded transaction response times for
    both after_statement and after_transaction connection release modes.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_147_0.png)


    +   * After statement

    * After transaction


    Figure 9.1: Connection release mode


    The more statements a transaction will execute, the greater the penalty of reacquiring
    the associated database connection from the underlying connection pool. To better
    visualize the connection acquisition overhead, the test runs up to 10 000 statements,
    even if this number is too high for the typical OLTP transaction.


    Ideally, database transactions should be as short as possible, and the number
    of statements shouldn''t be too high either. This requirement stems from the fact
    that the number of pooled connections is limited and locks are better released
    sooner than.'
