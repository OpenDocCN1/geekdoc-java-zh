  md: '# JDBC Connection Management


    The logical connection lifecycle looks like this:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_31_0.png)


    Figure 3.7: DataSource connection


    The connection pool doesn''t return the physical connection to the client, but
    instead it offers a proxy or a handle. When a connection is in use, the pool changes
    its state to *allocated* to prevent two concurrent threads from using the same
    database connection. The proxy intercepts the connection close method, and notifies
    the pool to change the connection state to *unallocated*.


    Apart from reducing connection acquisition time, the pooling mechanism can also
    limit the number of connections an application can use at once.


    The connection pool acts as a bounded buffer for the incoming connection requests.
    If there is a traffic spike, the connection pool will level it, instead of saturating
    all the database resources.


    All these benefits come at a price since configuring the right pool size is not
    a trivial thing to do. Provisioning the connection pool requires understanding
    the application-specific database access patterns and also usage monitoring.


    Whenever the number of incoming requests surpasses the available request handlers,
    there are basically two options to avoid system overloading:


    +   - discarding the overflowing traffic (affecting availability)

    - queuing requests and wait for busy resources to become available (increasing
    response time).


    Discarding the surplus traffic is usually a last resort measure, so connection
    pooling solutions first attempt to enqueue overflowing incoming requests. By putting
    an upper bound on the connection request wait time, the queue is prevented from
    growing indefinitely and saturating application server resources.


    For a given incoming request rate, the relation between the queue size and the
    average enqueuing time is given by one of the most fundamental laws of queuing
    theory.'
