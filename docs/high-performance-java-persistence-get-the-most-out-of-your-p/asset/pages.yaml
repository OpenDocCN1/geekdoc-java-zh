  md: '# 7.3.2 Phenomena


    For reasonable transaction throughput values, it makes sense to imply transaction
    serializability. As the incoming traffic grows, the price for strict data integrity
    becomes too high, and this is the primary reason for having multiple isolation
    levels. Relaxing serializability guarantees may generate data integrity anomalies,
    which are also referred as phenomena.


    The SQL-92 standard introduced three phenomena that can occur when moving away
    from a serializable transaction schedule:


    +   - dirty read

    - non-repeatable read

    - phantom read.


    In reality, there are other phenomena that can occur due to transaction interleaving,
    as the famous paper A Critique of ANSI SQL Isolation Levels describes:


    +   - dirty write

    - read skew

    - write skew

    - lost update.


    > Choosing a certain isolation level is a trade-off between increasing concurrency
    and acknowledging the possible anomalies that might occur.

    Scalability is undermined by contention and coherency costs. The lower the isolation
    level, the less locking (or multi-version transaction abortions), and the more
    scalable application will get.

    But a lower isolation allows more phenomena, and the data integrity responsibility
    is shifted from the database side to the application logic, which must ensure
    that it takes all measures to prevent or mitigate any such anomaly.


    Before jumping to isolation levels, it''s better to understand what''s behind
    each particular phenomenon and how it can affect data integrity. When choosing
    a given transaction isolation level, understanding phenomena becomes fundamental
    to taking the right decision,


    *http://research.microsoft.com/apps/pubs/default.aspx?id=69541'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 7.3.2.1 Dirty write


    A dirty write happens when two concurrent transactions are allowed to modify the
    row at the same time. As previously mentioned, all changes are applied against
    the actual database object structures, which means that the second transaction
    simply overwrites the first transaction pending change.


    | Alice | Database | Bob |

    | --- | --- | --- |

    | --- BEGIN TRANSACTION | post | |

    | | id:1 title:''Transactions'' | |

    | | | --- BEGIN TRANSACTION |

    | UPDATE post | post | |

    | - SET title = ''ACID'' | id:1 | |

    | WHERE id = 1 | title:''ACID'' | |

    | post | | UPDATE post |

    | id:1 | | SET title = ''BASE'' |

    | title:''BASE'' | | WHERE id = 1 |

    | --- ROLLBACK --- | post |

    | | | id:1 |

    | | | title:''Transactions'' |


    Figure 7.4: Dirty write


    If two transactions commit, one will silently overwrite the other transaction,
    causing a lost update. Another problem arises when the first transaction wants
    to roll back. The database engine would have to choose one of the following actions:


    +   - it can restore the row to its previous version (as it was before the first
    transaction changed), but then it will overwrite the second transaction uncommitted
    change

    - it can acknowledge the existence of a newer version (issued by the second transaction),
    but then, if the second transaction has to roll back, its previous version becomes
    the uncommitted change of the first transaction.


    If the database engine didn''t perform dirty writes, guaranteeing rollbacks would
    not be possible. Because atomicity cannot be implemented in the absence of reliable
    rollbacks, all database systems must prevent dirty writes.


    Although the SQL standard doesn''t mention this phenomenon, even at the lowest
    isolation level (Read Uncommitted) is able to prevent it.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# 7.3.2.2 Dirty read


    As previously mentioned, all database changes are applied against the actual data
    structures (memory buffers, data blocks, indexes). A dirty read happens when a
    transaction is allowed to read the uncommitted changes of some other concurrent
    transaction. Taking a business decision on a value that hasn''t been committed
    is risky because uncommitted changes might get rolled back.


    | Alice | Database | Bob |

    | --- | --- | --- |

    | | post | |

    | | id: 1 | |

    | | title:''Transactions'' | | |

    | | ------ BEGIN TRANSACTION ------ | | |

    | | | post | |

    | UPDATE post | id: 1 | |

    | SET title=''ACID'' | | |

    | WHERE id = 1 | title:"ACID'' | |

    | | | SELECT * | |

    | | | FROM post | |

    | | | WHERE id = 1 | |

    | ROLLBACK | post | |

    | | | id:1 | |

    | | | title:''Transactions'' |


    Figure 7.5: Dirty read


    This anomaly is only permitted by the Read Uncommitted isolation level, and because
    of the serious impact on data integrity, most database systems offer a higher
    default isolation level.


    To prevent dirty reads, the database engine must hide uncommitted changes from
    all the concurrent transactions (but the one that authored the change). Each transaction
    is allowed to see its own changes because otherwise the read-your-own-write guarantee
    is compromised.


    A naive approach would be to lock committed rows but this wouldn''t be practical
    at all (if long-running transaction acquired such a lock, no other transaction
    would be allowed to read that until the lock is released). Locks increase contention
    and contention affects scalability.


    Since the undo log captures the previous version of every uncommitted record,
    the database engine can use it to restore the previous value in other concurrent
    transaction queries. Because this mechanism is used by all other isolation levels
    (Read Committed, Repeatable Read, Serializable), most database systems optimize
    the before image restoring process (lowering its overhead on the overall application
    performance).


    Cases for using Read Uncommitted are seldom (non-strict reporting queries where
    dirty reads are acceptable), so Read Committed is usually the lowest practical
    isolation level.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 7.3.2.3 Non-repeatable read


    If one transaction reads a database row without applying a shared lock on the
    newly fetched record, then a concurrent transaction might change this row before
    the first transaction has ended.


    | Alice | Database | Bob |

    | :--- | :--- | :--- |

    | | BEGIN TRANSACTION | | post id:1 title:''Transactions'' |

    | | | | BEGIN TRANSACTION | |

    | | | SELECT * FROM post WHERE id = 1 | | post id:1 title:''Transactions'' |

    | UPDATE post SET title = ''ACID'' WHERE id = 1 | post id:1 title:''ACID'' | |

    | | COMMIT | | SELECT * FROM post WHERE id = 1 | | post id:1 title:''ACID'' |


    Figure 7.6: Non-repeatable read


    This phenomenon is problematic when the current transaction makes a business decision
    based on the first value of the given database row (a client might order a product
    based on a stock quantity value''s no longer a positive integer).


    Most database systems have moved to a Multi-Version Concurrency Control model,
    and shared locks are no longer mandatory for preventing non-repeatable reads.
    By verifying the current row version, a transaction can be aborted if a fetched
    record has changed in the meanwhile.


    Repeatable Read and Serializable prevent this anomaly by default. With Read Committed,
    it''s possible to avoid non-repeatable (fuzzy) reads if the shared locks are acquired
    explicitly (e.g. SELECT FOR SHARE).


    Some OR frameworks (e.g. JPA/Hibernate) offer application-level repeatable reads.
    The first snapshot of any retrieved entity is cached in the current running Persistence
    Context. Any successive query returning the same database row is going to use
    the very same object that was previously cached. This way, the fuzzy reads may
    be prevented even in Read Committed isolation level.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 7.3.2.4 Phantom read


    If a transaction makes a business decision based on a set of rows satisfying a
    given predicate, without predicate locking, a concurrent transaction might insert
    a record matching that particular predicate.


    | Alice | Database | Bob |

    |---|---|--|

    | | post_comment | |

    | | id:1 post_comment | |

    | | id:2 post_comment | |

    | | id:3 post_id: 1 | |

    | | BEGIN TRANSACTION | |

    | SELECT * FROM post_comment WHERE post_id = 1 | |

    | | | post_comment |

    | | | id:1 post_comment |

    | | | id:2 post_comment |

    | | | id:3 post_id: 1 |

    | INSERT INTO post_comment (id, post_id) VALUES (4, 1) | post_comment | |

    | | id:1 post_ | |

    | | id:2 post_ | |

    | | id:3 post_ | |

    | | id:4 post_id: 1 | |

    | COMMIT | post_comment | |

    | | | id:1 post_comment |

    | | | id:2 post_comment |

    | | | id:3 post_comment |

    | | | id:4 post_id: 1 |


    Figure 7.7: Phantom read


    Phantom rows can lead a buyer into purchasing a product without being aware of
    a better offer that was added after the user has finished fetching the offer list.


    Traditionally, the Serializable isolation prevented phantom reads through predicate
    locking. Other MVCC implementations can detect phantom rows by introspecting the
    transaction schedule and aborting any transaction whose serializability guarantees
    were violated.


    > If explicit locking could prevent non-repeatable reads even in Read Committed
    isolation level, there isn''t such SQL construct to permit range locks to be acquired
    explicitly.'
  merge: -1
