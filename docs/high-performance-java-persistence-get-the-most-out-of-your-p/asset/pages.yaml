  md: 'Connection Management and Monitoring


    To enable the statistics gathering mechanism, the following property must be configured:


    ```

    <property name="hibernate.generate_statistics" value="true"/>

    ```


    Once statistics are gathered, in order to print them into the current application
    log, the following logger configuration must be set up:


    ```

    <logger

    name="org.hibernate.engine.internal.StatisticalLoggingSessionEventListener

    level="info" />

