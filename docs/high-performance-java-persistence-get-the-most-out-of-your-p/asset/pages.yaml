  md: 'Transactions


    82


    # 7.3.1.2 Multi-Version Concurrency Control


    Although locking can provide a serializable transaction schedule, the cost of
    lock contention can undermine both transaction response time and scalability.
    The response time can increase because transactions must wait for locks to be
    released, and long-running transactions can slow down the progress of other concurrent
    transactions as well. According to both Amdahl’s Law and the Universal Scalability
    Law, concurrency is also affected by contention.


    To address these shortcomings, the database vendors have opted for optimistic
    concurrency control mechanisms. If 2PL prevents conflicts, Multi-Version Concurrency
    Control (MVCC) uses a conflict detection strategy instead.


    > The promise of MVCC is that readers don''t block writers and writers don''t
    block readers. The only source of contention comes from writers blocking other
    concurrent writers, which would otherwise compromise transaction rollback and
    atomicity.


    To prevent blocking, the database can rebuild previous versions of a database
    record, so an uncommitted change can be hidden away from incoming concurrent readers.
    The lack of locking makes it more difficult to implement a serializable schedule,
    so the database engine must analyze the current interleaving operations and detect
    anomalies that would compromise serializability.


    # Oracle


    Oracle doesn''t implement 2PL at all, relying on MVCC mechanism for managing concurrent
    data. Every query gets a point in time data snapshot and, and depending on the
    isolation level, the timestamp reference be relative to the current statement
    or to the current transaction start time.


    To rebuild previous records, Oracle uses the undo segments, which already contain
    all the necessary data required for rolling back an uncommitted change. The point
    in time is based on the System Change Number (SCN), which is a logical timestamp
    reference and, unlike physical time, it is guaranteed to be incremented monotonically.


    Apart from MVCC, Oracle also supports explicit locking as well, using the SELECT
    FOR UPDATE SQL syntax.


    > https://docs.oracle.com/database/121/CNCP/consist.html#CNCP221'
