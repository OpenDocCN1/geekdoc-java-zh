  md: '# Performance considerations


    While write operations are faster than in the joined table strategy, the read
    operations are only efficient when querying against the actual subclass entities.
    Polymorphic queries can have a considerable performance impact because Hibernate
    must select all subclass tables and use UNION ALL to build the whole inheritance
    tree result set. As a rule of thumb, the more subclass tables, the least efficient
    the polymorphic queries will get.


    # 12.4 Mapped superclass


    If the Topic class is not required to be a stand-alone entity, it’s more practical
    to leave inheritance of the database. This way, the Topic can be made abstract
    and marked with the @MappedSuperclass annotation so that JPA can acknowledge the
    inheritance model on the entity-side only.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_240_0.png)


    Figure 12.5: Mapped superclass class diagram


    Having a single TopicStatistics entity with a @OneToOne Topic association is no
    longer possible because the Topic class is not an entity. In this way, each Topic
    subclass must define its own statistics associations (e.g. PostStatistics, AnnouncementStatistics).'
