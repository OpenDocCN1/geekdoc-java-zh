    \ post | |\n|---||\n| id:1 | |\n| title:'Transactions' |\n\n```\nUPDATE post\n\
    \ title = 'ACID'\nWHERE id = 1\n```\n\n| post_details | |\n|---||\n| id:1 | |\n\
    | updated_by:'Bob' |\n\n```\nUPDATE post_details\nSET updated_by = Bob\nWHERE\
    \ id = 1\n```\n\n| post | |\n|---||\n| id:1 | |\n| title:'ACID' |\n\n```\nCOMMIT\n\
    ```\n\n| post_details | |\n|---||\n| id:1 | |\n| updated_by:'Bob' |\n\n| post_details\
    \ | |\n|---||\n| id:1 | |\n| updated_by:'Bob' |\n\n```\nSELECT *\nFROM post_details\n\
    WHERE id = 1\n```\n\nFigure 7.8: Read skew sneaks in and manages\n\nIn selecting\
    \ the *post* and the *post_details* rows, a second transaction sneaks and manages\
