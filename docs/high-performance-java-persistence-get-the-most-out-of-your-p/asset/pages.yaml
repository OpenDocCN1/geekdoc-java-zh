  md: '# Why JPA and Hibernate matter


    > If JPA is the interface, Hibernate is one implementation and implementation
    details always matter from a performance perspective.


    The JPA implementation details leak and ignoring them might hinder application
    performance or even lead to data inconsistency issues. As an example, the following
    JPA attributes have a peculiar behavior, which can surprise someone who''s familiar
    with the JPA specification:


    +   * FlushModeType.AUTO* doesn''t trigger a flush for native SQL queries, like
    it does for JPQL or Criteria API

    * FetchType.EAGER* might choose an SQL join or a secondary select, whether the
    entity is fetched directly from the EntityManager or through JPQL (Java Persistence
    Query Language) or a Criteria API.


    This''s why we focus on how Hibernate manages to implement the JPA specification
    and its native non-standard features (that are relevant to an efficiency perspective).


    # Portability concerns


    Like other non-functional requirements, portability is a feature and there is
    still a widespread fear of embracing database-specific or framework-specific features.
    In reality, it''s more common to encounter enterprises facing data access performance
    issues than having to migrate from one technology to another (be it a relational
    database or a JPA provider).


    The lowest common denominator of RDBMS is a superset of the SQL-92 standard (although
    not entirely supported). SQL-9 supports Common Table Expressions, but MySQL 5.7
    does not. SQL-2003 introduced MERGE, but PostgreSQL 9.4 doesn''t implement it,
    and 9.5 will support UPSERT. By adhering to a SQL-92 syntax, one could achieve
    a higher degree of database portability, but the price of giving database-specific
    features can take a toll on application performance. Portability can be addressed
    by subtracting non-common features through specialization. By offering different
    implementations, for each supported database system (like the JOOO framework),
    portability can be achieved.


    The same argument is valid for JPA providers too. By layering the application,
    it''s already much easier to swap JPA providers, if there''s a compelling reason
    for switching one mature JPA implementation with another.'
