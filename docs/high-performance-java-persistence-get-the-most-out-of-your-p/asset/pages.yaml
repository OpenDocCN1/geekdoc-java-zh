    # 12.1 Single table


    The single table inheritance is the default JPA strategy, funneling a whole inheritance
    Domain Model hierarchy into a single database table.


    To employ this strategy, the Topic entity class must be mapped with one of the
    following annotations:


    +   * @Inheritance (being the default inheritance model, it''s not mandatory to
    supply the strategy when using single table inheritance)

    * @Inheritance(strategy = InheritanceType.SINGLE_TABLE)


    The Post and the Announcement entities don''t need any extra mapping (the Java
    inheritance semantics being sufficient).


    Preserving the same layout as depicted in the Domain Model class diagram, the
    table relationships associated with this same inheritance strategy like this:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_228_0.png)


    Figure 12.2: Single table


    The topic table contains columns associated with the Topic base class as well
    as columns related to properties from Post and Announcement entities.'
