  md: '# 7.7 Application-level transactions


    So, far, the book focused on database transactions to enforce ACID properties.
    From the application perspective, a business workflow might span over multiple
    database transactions, in which the database ACID guarantees will not be sufficient
    anymore.


    A logical transaction may be composed of multiple web requests, including user
    think time, by which reason it can be visualized as a long conversation.


    In the following example, both Alice and a background process are currently modifying
    the same database record.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_122_0.png)


    Alice logical transaction encloses two web requests, each one associated with
    a separate database transaction, without an additional concurrency control mechanism,
    the strongest isolation level can prevent the update phenomena.


    > Spanning a database transaction over multiple web requests is prohibitive since
    locks would be held during user think time, therefore hurting scalability. Even
    with MVCC, the cost of maintaining previous versions (that can lead to a large
