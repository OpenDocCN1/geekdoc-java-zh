  md: '# Relationships


    When deleting the last element of the collection:


    ```

    post.getComments().remove(2);

    ```


    Hibernate generates the following SQL statements:


    ```

    UPDATE post_comment SET post_id = null WHERE post_id = 1 AND id = 4

    DELETE from post_comment WHERE id = 4

    ```


    Again, there is an additional update statement associated with the child removal
    operation. When a child entity is removed from the parent-side collection, Hibernate
    will set the child table key column to null. Afterwards, the orphan removal logic
    kicks in and it triggers a delete statement against the disassociated child entity.


    Unlike the regular @ToMany association, the @JoinColumn alternative is consistent
    in regard to the collection position after being removed. So, when removing the
    first element of the collection:


    ```

    post.getComments().remove(0);

    ```


    Hibernate still generates an additional update statement:


    ```

    UPDATE post_comment SET post_id = null WHERE post_id = 1 AND id = 2

    DELETE from post_comment WHERE id = 2

    ```


    # Bidirectional @ToMany with @JoinColumn relationship


    The @ToMany with @JoinColumn association can also be turned into a bidirectional
    relationship, but it requires instructing the child-side to avoid any insert and
    update synchronization:


    ```

    @ManyToManyToOne

    @JoinColumn(name = "post_id", insertable = false, updateable = false)

    private Post post.

    ```


    > The redundant update statements are generated for both the unidirectional and
    bidirectional association, so the most efficient foreign key mapping is the @ManyToMany
    association.'
