  md: '# Mapping Types and Identifiers


    Surrogate keys are generated independently of the current row data, so table column
    constraints may evolve with time (changing a user birthday or email address).
    The surrogate key can be generated by a numerical sequence generator (e.g a database
    identity column or a sequence), or it can be constructed by a pseudorandom number
    generator (e. GUID or UUID). Both the numerical and UUID keys have both pros and
    cons.


    The UUID is defined by the RFC 4122* standard and it is stored as a 128-bit sequence.
    The GUID term refers to any globally unique identifier, which might comprise other
    non-standard implementations. For consistency, this chapter will refer to identifiers
    as UUID.


    A UUID takes 128 bits, which is four times more than an INTEGER and twice as BIGINT.
    On the other hand, a UUID has less chance of a conflict in a Multi-Master database
    replication topology. To avoid such conflicts, many relational database systems
    increment the identity or sequence numbers in steps, each node getting its own
    offset. Because UUIDs are not sequential, they induce fragmentation and can really
    affect the performance of clustered indexes.


    > Requiring less space and being more index-friendly, numerical sequences are
    preferred over UUID keys.


    # 10.2.1 UUID identifiers


    Nevertheless, some enterprise systems use UUID primary keys, so it''s worth knowing
    what Hibernate types work best for this task. The UUID key can either be generated
    by the application using the java.util.UUID class or it can be assigned by the
    database system.


    > If the database system doesn''t have a built-in UUID type, a BINARY(16) column
    type is preferred. Although a CHAR(32) column could also store the UUID textual
    representation, the additional space overhead makes it a less favorable pick.'
  merge: -1
