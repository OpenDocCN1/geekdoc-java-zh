  md: "Relationships\n\n205\n\n```\nSELECT p.id AS id1_0_0,\n    p.title AS title2_0_0_\n\
    FROM post p\nWHERE p.id = 1\n\nSELECT pd.post_id AS post_id3_1_0,\n    pd.created_by\
    \ AS created_1_1_0,\n    pd.created_on AS created_2_1_0_\nFROM post_details pd\n\
    WHERE pd.post_id = 1\n```\n\nSo instead of only one query, Hibernate retrieves\
    \ two.\nUnlike the parent-side @OneToMany relationship where Hibernate can simply\
    \ assign a proxy even if the collection is empty, the @OneToOne relationship must\
    \ decide to assign the child reference to null or an Object, which is the actual\
    \ entity type or a runtime proxy.\n\nThis is an issue that affects the parent-side\
    \ @OneToOne association, while the child-side, which has an associated foreign\
    \ key column, knows whether the parent reference should be null or not. For this\
    \ reason, the parent-side must execute a secondary query to find if there’s a\
    \ mirroring key reference on the child-side.\n\nIf the application developer only\
    \ needs parent entities, the additional child-side secondary queries are executed\
    \ unnecessarily and this might affect application performance. The more parent\
    \ entities are needed to be retrieved, the more obvious the secondary queries\
    \ performance impact will be.\n\n# Bytecode enhancement\n\nEven if the foreign\
    \ key is NOT NULL and the parent-side is aware about its non-nullability through\
    \ the optional attribute (e.g. @OneToOne(mappedBy = \"\", fetch = FetchType.LAZY,\
    \ optional = false)), Hibernate generates a secondary select statement. Knowing\
    \ that the child entity is not null, Hibernate can assign it to a Proxy instead\
    \ of an actual child entity reference. But the Persistence Context requires both\
    \ the entity and the identifier of managed entity, so the child entity identifier\
    \ must be known upon loading the parent entity, and the only way to find the associated\
    \ post_details primary key is to execute a secondary query.\n\n> Bytecode enhancement\
    \ is the only viable workaround; the parent Proxy instrumented to fetch the child\
    \ entity upon first access. Because it is much simpler and performs well without\
    \ bytecode enhancement, the unidirectional @OneToOne relationship is often preferred."
