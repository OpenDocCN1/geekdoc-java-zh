    > Using timestamps to order events is rarely a good idea. System time is not always
    incremented, and it can even go backwards, due to network synchronization. Accuracy
    across different database systems varies from nanoseconds (Oracle¹, SQL Server)
    to microseconds (PostgreSQL⁵) and MySQL 5.6.4⁴ and even to seconds (previous versions
    of MySQL). In distributed systems, logical clocks (e.g. vector clocks or Lamport
    timestamps) are always preferred to physical timestamp (wall clocks) when it comes
    to ordering events.


    For this reason, employing a numerical record version is more appropriate than
    assigning timestamps to row updates.'
