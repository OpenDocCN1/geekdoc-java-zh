  md: 'Why JPA and Hibernate matter


    # SQL injection prevention


    By managing the SQL statement generation, the JPA tool can assist in minimizing
    the risk of SQL injection attacks. The less the chance of manipulating SQL statements,
    the safer the application can get. The risk is not completely eliminated because
    the application developer can still recur to concatenating SQL or JPQL fragments,
    so rigour is advised.


    > Hibernate uses PreparedStatement(s) exclusively, so not only it protect against
    SQL injection, but the data access layer can better take advantage of server-side
    and client-side statement caching as well.


    # Auto-generated DML statements


    The enterprise database schema evolves with time, and the data access layer must
    mirror all modifications as we.


    Because the JPA provider auto-generates insert and update statements, the data
    access layer can easily accommodate database table structure modifications. By
    updating the entity model schema, Hibernate can automatically adjust the modifying
    statements accordingly.


    This applies to changing database column types as well. If the database schema
    needs to migrate a postal code from an INT type to a VARCHAR(6), the data access
    layer needs to change the associated Domain Model property type from Integer to
    a String, and all statements are going to be automatically updated. Hibernate
    defines a highly customizable JDBC-to-database type mapping system, and the application
    developer can override a default type association, or even add support for new
    database types (that are not currently supported by Hibernate).


    The entity fetching process is automatically managed by the JPA implementation,
    which auto-generates the select statements of the associated database tables.
    This way, JPA can free the application developer from maintaining entity selection
    queries as well.


    > Hibernate allows customizing all CRUD statements, in which case the application
    developer is responsible for maintaining the associated DML statements.


    Although it takes care of the entity selection process, most enterprise systems
    need to take advantage of the underlying database querying capabilities. For this
    reason, whenever the database schema changes, all the native SQL queries need
    to be updated manually (according to their associated business logic requirements).'
