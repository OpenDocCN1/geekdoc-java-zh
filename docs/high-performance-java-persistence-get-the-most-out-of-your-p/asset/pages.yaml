  md: '# 7.3 Isolation


    If there were only one user accessing the database, there wouldn''t be any risk
    of data conflicts. According to the Universal Scalability Law, if the sequential
    fraction of the data access patterns is less than 100%, the database system can
    benefit from parallelization.


    By offering multiple concurrent connections, the transaction throughput can increase
    and the database system can accommodate more traffic. Parallelization imposes
    additional challenges as the database must interleave transactions in a way that
    conflicts don''t compromise data integrity. The execution of order of all the
    running transaction operations is said to be serializable if its outcome is the
    same as if the underlying transactions were executed one after the other.


    The serializable execution is the only transaction isolation level that doesn''t
    compromise data integrity, while allowing a certain degree of parallelism. In
    1981, Jim Gray described the largest airlines and banks as having 10 000 terminals
    and 100 active transactions, which explains why, until SQL-92, serializable was
    the *de facto* transaction isolation level.


    # 7.3.1 Concurrency control


    To manage data, several concurrency control mechanisms have been developed throughout
    the years. There are basically two strategies for handling collections:


    +   - avoiding conflicts (e.g. *two-phase locking*) requires locking to access
    to shared resources

    - detecting conflicts (e.g. *Multi-Version Concurrency Control*) provides better
    concurrency, at the price of relaxing serializability and possibly accepting various
    anomalies.


    # 7.3.1.1 Two-phase locking


    In 1976, Kapali Everson and Jim Gray (et al.) published the Notions of Consistency
    and Predicate Locks in a Database System², paper which demonstrated that serializability
    can be obtained if all transactions use the *two-phase locking* (2PL) protocol.


    Initially all databases employed 2PL for implementing serializable transactions,
    but with time, many users moved toward MVCC (Multi-Version Concurrency Control)
    architecture. By default, SQL Server still uses locking for the Serializability
    isolation level. Because 2PL guarantees transaction serializability, it''s very
    important to understand the price of maintaining data integrity over the overall
    application scalability and transaction performance.


    But locking isn''t only used in 2PL implementations, and to address both DML and
    DDL statement interaction and contention on resources, relational database systems
    use Multiple granularity³.


    > *https://research.microsoft.com/en-us/people/gray/papers/On%20the%20Notions%20of%20Consistency%20and%20Predicate%20Locks%20in%20Database%20system=ACM.pdf

    ³https://en.wikipedia.org/wiki/Multiple_granularity_locking'
