    # # 2.3 Scaling up and scaling out


    Scaling is the effect of increasing capacity by adding more resources. Scaling
    vertically (scaling up) means adding resources to a single machine. Increasing
    the number of available machines is called horizontal scaling (scaling out).


    Traditionally, adding more hardware resources to a database server has been the
    preferred way of increasing database capacity. Relational databases have emerged
    in the late seventies, and for two half decades, the database vendors take advantage
    of the hardware advancements following the trends in Moore''s Law.


    Distributed systems are much more complex to manage than centralized ones, and
    that''s why horizontal scaling is more challenging than scaling vertically. On
    the other hand, for the price of a dedicated high-performance server, one could
    buy multiple commodity machines whose available resources (CPU, Memory, Disk Storage)
    is greater than the single dedicated server. When deciding which scaling method
    is better one must take into account both the price (hardware and licenses) and
