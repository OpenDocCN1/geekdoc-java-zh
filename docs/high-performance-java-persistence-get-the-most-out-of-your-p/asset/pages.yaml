  md: '# 7.3.2.6 Write skew


    Like read skew, this phenomenon involves disjoint writes over two different tables
    that are constrained to be updated as a unit. Whenever the post row changes, the
    client must update the post_details with the user making the change.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_100_0.png)


    Both Alice and Bob will select the post and its associated post_details record.
    If write skew is allowed, Alice and Bob can update these two records separately,
    therefore breaking the constraint.


    With non-repeatable reads, there are two ways to avoid this phenomenon:


    +   - the first transaction can acquire shared locks on both entries, therefore
    preventing the transaction from updating these records

    - the database engine can detect that another transaction has changed these records,
    and so it can force the first transaction to roll back (under an MVCC implementation
    of Repeatable Read or Serializable).


    Figure 7.9: Write skew'
