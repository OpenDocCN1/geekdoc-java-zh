  md: '# 6.3 ResultSet holdability


    The JDBC 3.0 version added support for result set holdability and, unlike scrollability
    and updatability, the default value is implementation specific.


    Oracle

    The default and the only supported holdability value is HOLD_CURSORS_OVER_COMMIT.
    An exception

    is thrown when trying to change this setting to any other value.


    SQL Server

    By default, the result set is kept open even after the current transaction is
    committed or rolled back. SQL Server supports the CLOSE_CURSORS_AT_COMMIT setting
    as well.


    PostgreSQL

    Unlike other database systems, the default holdability value is CLOSE_CURSORS_AT_COMMIT,
    but the driver also supports the HOLD_CURSORS_OVER_COMMIT setting.


    MySQL

    The default and the only supported holdability value is HOLD_CURSORS_OVER_COMMIT.


    In a enterprise application, database connections are reused from one transaction
    to another, so holding a result set after a transaction end is risky. Depending
    on the underlying database system and the cursor type, a result set might allocate
    system resources, which, for scalability reasons, need to be released as soon
    as possible.


    > Although the CLOSE_CURSORS_AT_COMMIT holdability option is not supported by
    all database engines, the same effect can be achieved by simply closing all acquired
    ResultSet(s) and their associated Statement objects.


    # 6.4 Fetching size


    The JDBC ResultSet acts as an action-level cursor, so whenever the statement is
    traversed, the result must be transferred from the database to the client. The
    transfer rate is controlled by the fetch size.


    ```

    statement.setFetchSize(fetchSize);

    ```


    A custom fetch size gives the driver a hint to the number of rows needed to be
    retrieved in a single database roundtrip. The default value of 0 leaves each database
    choose its own driver-specific fetching policy.'
