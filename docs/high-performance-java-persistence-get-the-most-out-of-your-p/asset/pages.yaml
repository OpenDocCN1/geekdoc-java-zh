  md: '# 8.1 The impedance mismatch


    When a relational database is manipulated through an object-oriented program,
    the two differentndata representations start conflicting.


    In a relational database, data is stored in tables and the relational algebra
    defines how data associations are formed. On the other, an object-oriented programming
    (OOP) language allows object to have state and behavior, and bidirectional associations
    are permitted.


    The burden of converging two distinct approaches generates a lot of tension, and
    it has been haunting enterprise systems for a long time.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_128_0.png)


    > Figure 1: Object/Relational Mapping


    The above diagram portrays the two schemas, the data access layer needs to correlate.
    While the database schema is driven by the SQL standard specification, the Domain
    Model comes with an object-oriented schema representation.


    The Domain Model encapsulates the business logic specifications and captures both
    data structures and the behavior that governs business requirements. OOP facilitates
    Domain Modelling and many modern enterprise systems are implemented on top of
    an object-oriented programming language (e.g. Java, C#).'
  merge: -1
