  md: 'Why JPA and Hibernate matter


    # The distributed commit log


    For very large enterprise systems, where data is split among different providers
    (relational database systems, caches, Hadoop, Spark), it''s no longer possible
    to rely on the relational database to integrate all subsystems.


    In this case, Apache Kafka* offers a fault-tolerant and scalable append-only log
    structure, every participating subsystem can read and write concurrently.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_132_0.png)


    Figure 8.3: Distributed commit log integration


    The commit log becomes the integration point, each distributed node traversing
    it and maintaining client-specific pointers in the sequential log structure. This
    design resembles a database replication mechanism, and so it offers durability
    (the log is persisted on disk), write performance (append-only logs don''t require
    random access) and read performance (concurrent reads don''t require blocking)
    as well.


    > *http://kafka.apache.org/


    No matter what architecture style is chosen, there is still a need to correlate
    the transient Domain Model with the underlying persistent data.


    The data evolves along the enterprise system itself, and so the two different
    schema representations remain congruent at all times.


    Even if the data access framework can auto-generate the database schema, the schema
    must be migrated incrementally and all changes need to be traceable in the VCS
    (Version Control System) as well. Along with table structure, indexes and triggers,
    the database schema is therefore accompanying the Domain Model source code itself.
    A tool like Flywaydb* can automate the database schema migration, and the system
    can be deployed continuously, whether it is a test or a production environment.


    > *http://flywaydb.org/


