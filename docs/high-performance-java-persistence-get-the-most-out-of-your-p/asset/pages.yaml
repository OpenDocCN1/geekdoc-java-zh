  md: '# Oracle


    The Serializable isolation level is in fact MVCC implementation of the Snapshot
    Isolation concurrency control mechanism. Like the Repeatable Read isolation in
    PostgreSQL, Oracle cannot prevent write skews, meaning it cannot provide a truly
    serializable transaction.


    # SQL Server


    The Serializable isolation level is based on 2PL, and all phenomena are therefore
    prevented. The MVCC-based Snapshot isolation is close to Oracle Serializable and
    PostgreSQL Repeatable Read, and so it allows write skews.


    # PostgreSQL


    To overcome the Snapshot Isolation limitations, PostgreSQL has developed the Serializable
    Snapshot Isolation (SSI), which provides true serializable transactions. Because
    SSI is still an MVCC implementation, PostgreSQL monitors the transaction schedule
    and detects possible serializability anomalies.


    +   - The current implementation may detect false positives*, and some transactions
    might get aborted even if they didn''t really break transaction serializability.
    Only the Precisely Serializable Snapshot Isolation (PSSI) model can eliminate
    all false positives, but the performance penalty being too high, the database
    implementers stuck to SSI instead.


    # MySQL


    The Serializable isolation builds on top of Repeatable Read with the difference
    that every record that gets selected is protected with a shared lock as well.
    The locking-based approach allows MySQL to prevent the write skew phenomena, which
    is prevalent among many Snapshot Isolation implementations.'
