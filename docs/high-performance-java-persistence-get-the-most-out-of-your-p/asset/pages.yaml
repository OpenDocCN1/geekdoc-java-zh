  md: '# Oracle


    Every statement has a start timestamp, which is used to create a database snapshot
    relative to this particular point in time. This way, writers can still update
    the current selected records, and the database can simply reconstruct the previous
    versions that were available when the query started. Subsequent query executions
    can return different row versions, or non-repeatable reads are permitted.


    When two transactions attempt to update the same record, the first will lock the
    record to prevent dirty writes. The second transaction must wait until the first
    transaction releases the lock (either commit or rollback), and the statement filtering
    criteria are reevaluated against latest data.


    # PostgreSQL


    Like Oracle, every query sees a database snapshot as the beginning of the current
    running query. Because shared locks are not used to protect previously read records
    from being modified, Read Committed allows a spectrum of data anomalies.


    Exclusive locks prevent write-write conflicts, so when two transactions update
    the same record, the second one waits for the first to release its locks. When
    the second transaction resumes its execution, if the filtering criteria is still
    relevant, it might overwrite the first transaction modifications, therefore causing
    lost updates.


    # MySQL


    Query-time snapshots are used to isolate statements from other concurrent transactions.
    When explicitly acquiring shared or exclusive locks or when issuing update or
    delete statements (which acquire exclusive locks to prevent dirty writes), the
    selected rows are filtered by unique search criteria (e.g. primary key), the locks
    can be applied to the associated index entries.


    > Prior to 5.7, if the modifying statements used a range filter and the search
    criteria took advantage of a unique index scan, then the database could use a
    gap or a next-key lock (therefore protecting against phantom reads as well). Statement-based
    replication is not available for Read Committed, so the application must use the
    row-based binary logging instead.'
