- img_proc: true
  md: '# PostgreSQL


    Unlike all other database systems, PostgreSQL stores both the current rows and
    previous versions (even the ones for the aborted transactions) in the actual database
    table. Like Oracle, PostgreSQL embraces the MVCC data access model, and it doesn''t
    offer a 2PL transaction isolation implementation at all.


    Each row has two additional columns (xmin and xmax), which are used to control
    the visibility of various row versions. When a row is inserted, the current transaction
    identifier is stored in the xmin column.


    Both the update and the delete operations end up creating a new row entry with
    an xmax column storing the current transaction identifier.


    The Vacuum cleaner runs regularly and reclaims storage occupied by deleted entries
    (and successfully committed) or previous versions that are no longer required
    by the current running transactions.


    > Although PostgreSQL is seen as a MVCC model, locking is still required to prevent
    write-write conflicts for explicit locking. SELECT FOR UPDATE is used to acquire
    an exclusive row-level lock, while SELECT FOR SHARE is for applying a shared lock
    instead.


    # MySQL


    The InnoDB storage engine offers support for ACID transactions and uses MVCC for
    controlling access to shared resources. The InnoDB MVCC implementation is very
    similar to Oracle, and previous versions of database rows are stored in the rollback
    segment as well.


    When a transaction demands a previous row, MySQL must reconstruct it from rollback
    segments. Delete operations just mark an entry as being ready for deletion, and
    the purge thread is going to do the actual cleanup.


    Both the transaction rollback and the previous row version restoring processes
    (required by a given transaction visibility guarantees) are very much the same
    thing.


    > Like other database systems, MySQL also offers explicit locking for when MVCC
    is no longer satisfactory. A shared lock is acquired using SELECT LOCK IN SHARE
    MODE, while for exclusive locks the much more common SELECT FOR UPDATE syntax
    is used.'
  merge: -1
