  md: '# Mapping collections


    In a relational database, all table mappings are constructed using foreign keys
    and navigated through SQL queries. JPA allows mapping both the key side (the child
    entity has a reference to its parent), as well as the parent side (the parent
    entity has one or more child entities).


    Although @ElementCollection are convenient from a data access perspective (entity
    state transitions can be cascaded from parent entities to children), they are
    not free of cost. The price for reducing data access operations is paid in terms
    of result fetching flexibility and performance. A JPA collection, either of entities
    or value types (basic or embeddables), binds a parent entity to a query that fetches
    all the associated child records. Because of this, the entity mapping becomes
    sensitive to the number of child entities.


    If the child count is relatively small, the performance impact of retrieving all
    child entities might be unnoticeable. But if the number of child records grows
    too large, fetching the entire collection can become a performance bottleneck.
    Unfortunately, the entity mapping might be done during the early phases of a project
    development, and the development team might be unaware of the number of records
    a production system will exhibit.


    Not just the mere size can be problematic, but also the number of properties of
    the child entity. Because entities are usually fetched as, the result is therefore
    proportional to the number of columns the child table contains. Even if a collection
    is fetched lazily, Hibernate might still require to fully load each entity when
    the collection is accessed for the first time. Although Hibernate supports extra
    lazy collection fetching, this is only a workaround and doesn''t address the root
    problem.


    Alternatively, every collection mapping can be replaced by a data access query,
    which can use SQL projection that''s tailored to the data requirements of each
    business use case. This way, the query can take business case specific filtering
    criteria. Although JPA 2.1 doesn''t support dynamic collection filtering, Hibernate
    offers Session (Persistence Context) bound filters.


    > When handling large data sets, it is good practice to limit the result set size,
    (to increase responsiveness) or batch processing tasks (to avoid long transactions).
    Just because JPA offers collection mapping, it doesn''t mean they are mandatory
    for every domain model mapping. Until there''s a clear understanding of the number
    of child records (or if there''s even a need to fetch child entities entirely),
    it''s better to postpone the collection mapping decision. For high-performance
    systems, a data access query is often a much flexible alternative anyway.'
