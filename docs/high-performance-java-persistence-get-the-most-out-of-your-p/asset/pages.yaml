  md: '# Declarative exception handling


    Since the transaction logic wraps the underlying service and data access call
    chain, the exception handling must also be configured declaratively. By default,
    Java EE and Spring roll back on system exceptions (any RuntimeException) and commit
    on application exceptions (checked exceptions).


    In Java EE, the rollback policy can be customized using the @ApplicationException
    annotation.


    Spring allows each transaction to customize the rolling back policy by listing
    the exception types triggering a transaction failure.


    > docs.oracle.com/javaee/7/api/javadoc/ejb/ApplicationException.html

    https://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/transaction/annotation/Transactional.html#rollbackFor


    # Declarative read-only transactions


    Java EE doesn''t support read-only transactions to be marked declaratively.


    Spring offers the transactional read-only attribute, which can propagate to the
    underlying JPA provider (to optimize the EntityManager flushing mechanism) and
    to the current JDBC Connection.


    > https://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/transaction/annotation/Transactional.html#readOnly


    # Declarative isolation levels


    The Java EE doesn''t offer support for configurable isolation levels, so it''s
    to the underlying DataSource to define it for all database connections.


    Spring supports transaction-isolation levels when using the JTransactionManager
    follows the Java EE standard and allows overriding the default isolation level.
    As a workaround, the Spring framework provides extension points, so the application
    can customize the default behavior and implement a mechanism to set isolation
    levels on a transaction basis.


    > https://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/transaction/annotation/Transactional.html#isolation

    https://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/orm/jpa/JpaTransactionManager.html

    https://docs.spring.io/spring/docs/current/javadoc-api/org/springframework/transaction/jta/JtaTransactionManager.html'
