  md: '# Statement Caching


    During the precompilation phase, the database validates the SQL statement and
    parses it into a syntax tree. When it comes to executing the PreparedparedStatement,
    the driver sends the actual parameter values, and the database can jump to compiling
    and running the actual execution plan.


    # Database Syntax Tree


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_60_0.png)


    Because of index selectivity, in the absence of the actual bind parameter values,
    the Optimizer cannot compile the syntax tree into an execution plan. Since a disk
    access is required for fetching every additional row-level data, indexing is suitable
    when selecting only a fraction of the whole table data. Most database systems
    take this decision based on the index selectivity of the current bind parameter
    values.


    > A covering index bypasses disk access if all requesting columns are scanned
    by the index.


    Because each disk access requires reading a whole block of data, accessing to
    many disparate blocks can actually perform worse than scanning the whole table
    (random access is slower than sequential).


    For prepared statements, the execution plan can either be compiled on every execution
    or it can be cached and reused. Recompiling the plan can generate the best data
    access paths for any given bind variable set while paying the price of additional
    database resources usage. Reusing a plan can spare database resources, but it
    might not be suitable for every parameter value combination.'
