  md: '# JDBC Connection Management


    For a constant throughput, the number of enqueued connection requests (Lq) is
    proportional to the connection acquisition time (Wq).


    The total number of requests in any given spike is calculated as follows:


    ```

    $Lspike = \lambda_{spike} \times W_{spike}$

    ```


    The total time required to process the spike is given by the following formula:


    ```

    $W = \frac{Lspike}{\mu} = \frac{\lambda_{spike} \times W_{spike}}{\lambda}$

    ```


    The number of enqueued connection requests and the time it takes to process them
    is expressed by the following equations:


    ```

    $Lq = Lspike - Ls$

    ```


    ```

    $Wq = W - 1$

    ```


    Assuming there is a traffic spike of 250 requests per second, lasting for 3 seconds.


    ```

    $\lambda_{spike} = \frac{250}{s}$

    ```


    ```

    $W_{spike} = 3 s$

    ```


    The 750 requests spike takes 15 seconds to be fully processed.


    ```

    $Lspike = 250 \frac{requests}{s} \times 3 s = 750 requests$

    ```


    ```

    $W = \frac{750 \frac{requests}}{50 \frac{requests}} = 15 s$

    ```


    The queue size grows to 700 entries, and it requires 14 seconds for all connection
    requests to be serviced.


    ```

    $Lq = Lspike - Ls = 700 requests$

    ```


    ```

    $Wq = W - 1 = 14 s$

    ```'
