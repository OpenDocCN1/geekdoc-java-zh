    # # 6.5 ResultSet size


    Setting the appropriate fetching size can undoubtedly speed up the result set
    retrieval, as long as a statement fetches only the data required by the current
    business logic. All too often, unfortunately, especially with the widespread of
    ORM tools, the statement might select more data than necessary. This issue might
    be caused by selecting many rows or too many columns, which are later discarded
    in the data account or the business layer.


    # # 6.5.1 Too many rows


    Tables tend to grow in size (especially if the application gains more traction),
    and with time, a moderate result set might easily turn into a performance bottleneck.
    These issues are often discovered in production systems, long after the application
    code was shipped.


    A user interface can accommodate as much info as the views displaying. For this
    reason, it''s inefficient to fetch a result set entirely if it cannot fit into
    the user interface. Pagination or dynamic scrolling are common ways of addressing
    this issue, and partitioning data sets becomes unavoidable.


    Limiting result sets is common in batch processing as well. To avoid long-running
    transactions (which might put pressure on the database undo/redo logs), and to
    benefit from parallel execution, a batch processor divides the current work load
    into smaller jobs. This way, a batch job can take only a subset of the whole processing
    data.


    > > When the result size is limited by external factors, it makes no sense to
    select more data than necessary. Placing upper bounds, the result sets grow proportionally
    with the underlying table data. A large result set requires more time to be extracted
    and to be sent over the wire too. Limiting queries can therefore ensure predictable
    response times and database resource utilization. The shorter the processing time,
    the quicker the row-level locks are released, and the more scalable the data access
    layer.


    There are basically two ways of limiting a result set.


    The former and the most efficient strategy is to include the row restriction clause
    in the SQL statement. This way, the Optimizer can come up with an execution plan
    that''s optimal for the current result set size (like selecting an index instead
    of a full scan).


    The latter is to configure a maximum row count at the JDBC Statement. Ideally,
    the driver can adjust the statement to include the equivalent result set restriction
    as an SQL clause, but most often, it only hints the database engine to use a database
    cursor instead.'
