  md: '# 12. Inheritance


    Java, like any other object-oriented programming language, makes heavy use of
    inheritance and polymorphism. Inheritance allows defining class hierarchies that
    offer different implementations of a common interface.


    Conceptually, the Domain Model defines both data (e.g. persisted entities) and
    behavior (business logic). Nevertheless, inheritance is much more useful for varying
    behavior than data (composition is much more suitable for sharing structures).
    Even if the data (persisted entities) and the business logic (transactional services)
    are decoupled, inheritance can still help varying business logic (e.g. Visitor
    pattern¹).


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_224_0.png)


    > ¹https://en.wikipedia.org/wiki/Visitor_pattern'
