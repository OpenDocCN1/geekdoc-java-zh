  md: '# 9.2.1 DriverManagerConnectionProvider


    Hibernate picks this provider when being given the aforementioned JPA 2.0 connection
    properties or the Hibernate-specific configuration counterpart:


    +   - hibernate.connection.driver_class

    - hibernate.connection.url

    - hibernate.connection.username

    - hibernate.connection.password


    > Although it fetches database connections through the underlying DriverManager,
    this provider tries to avoid the connection acquisition overhead by a trivial
    pooling implementation. The Hibernate documentation does not recommend using the
    DriverManagerConnectionProvider in a production setup.


    # 9.2.2 C3P0ConnectionProvider


    C3p0¹ is a mature connection pooling solution that has proven itself in many production
    environments, using the underlying JDBC connection properties, Hibernate can replace
    the built-in connection pool with a c3p0 DataSource. To activate this provider,
    the application developer must set at least one configuration property starting
    with the `hibernate.c3p0` prefix:


    ```

    <property name="hibernate.c3p0.max_size" value="5"/>

    ```


    > C3p0 (released in 2001) and Apache DBCP⁴ (released in 2002) are the oldest and
    the most deployed stand-alone Java connection pooling solutions. Later in 2010,
    BoneCP⁵ emerged as a high-performance alternative for c3p0 and Apache DBCP. Nowadays,
    the BoneCP GitHub page says it''s been deprecated in favor of HikariCP.


    ¹http://www.mchange.com/projects/c3p0/'
