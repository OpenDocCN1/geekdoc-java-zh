  md: '# 10.2 Identifiers


    All database tables must have a primary key column, so each row can be uniquely
    identified (the primary key must be both UNIQUE and NOT NULL).


    > Although the SQL standard doesn''t impose primary keys to be immutable, it''s
    practical* to avoid changing them.


    The primary key can have a meaning in the real world, in which case it''s a natural
    key, or it can be generated synthetically, in which case it''s called a surrogate
    identifier.


    For natural keys, unison is enforced by a real-world unique sequence generator
    (e.g. National Identification Numbers, Social Security Numbers, Vehicle Identification
    Numbers). In reality, natural unique numbers might pose problems when the unique
    constraints do not hold anymore. For example, a National Identification Number
    might yield unique numbers, but if the enterprise system must accommodate users
    coming from multiple countries, it''s possible that two different countries assigned
    the same identifier.


    The natural key can be composed of one or multiple columns. Compound natural keys
    might incur an additional performance penalty because multi-column joins are slower
    than single-column ones, and multi-column indexes have a bigger memory footprint
    too.


    Natural keys must be sufficiently long to accommodate as many identifiers as the
    system needs throughout its lifecycle. Because primary keys are often indexed,
    the longer, the more memory an index entry will require. Each joined table will
    include a foreign key mirroring the parent primary key, and foreign keys are frequently
    indexed as well.


    | Index memory impact | Fixed-size non-numerical keys (e.g. CHAR, VARCHAR) are
    less efficient than numerical ones (e.g. INTEGER, BIGINT) both for joining (a
    simple key performs better than a compound one) or indexing the more compact the
    data type, the less memory space is required by an associated index).

    | A CHAR(17) natural key (e.g. Vehicle Identification Number) requires 17 characters
    (17 bytes when using ASCII characters and a UTF-8 encoding) as opposed to 4 bytes
    (32 bit INTEGER) or 8 bytes (64 bit BIGINT).'
