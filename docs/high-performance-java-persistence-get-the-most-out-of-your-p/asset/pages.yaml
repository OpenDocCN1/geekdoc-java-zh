  md: '# SQL Server


    By default, SQL statements use shared locks to prevent other transactions from
    modifying the currently fetched records. The locks are released by the time the
    query finishes executing. When activating Read Committed Snapshot Isolation, the
    database will not use shared locks anymore, and each query will select the row
    version as it was when the query started.


    # 7.3.3.3 Repeatable Read


    One of the least compliant isolation levels, Repeatable Read implementation details
    leak into its phenomena prevention spectrum:


    Table 7.4: Repeatable Read phenomena occurrence


    | Phenomena | SQL Server | PostgreSQL | MySQL |

    |---|---|---|--|

    | Dirty Write | No | No | No |

    | Dirty Read | No | No | No |

    | Non-Repeatable Read | No | No | No |

    | Phantom Read | Yes | No | No |

    | Read Skew | No | No | No |

    | Write Skew | No | Yes | Yes |

    | Lost Update | No | No | Yes |


    > The Repeatable Read isolation is not supported at all, and the JDBC driver throws
    an exception if the client tries to set it explicitly.


    # SQL Server


    For every row the client reads, the current transaction acquires a shared lock
    that prevents any other transaction from concurrently modifying it. The shared
    locks are released when the transaction either commits or rolls back.'
