  md: '# 3.4 Practical database connection provisioning


    Even if queuing theory provides an insight into the connection pool behavior,
    the dynamics of enterprise systems are much more difficult to express with general-purpose
    equations, and metrics become fundamental for resource provisioning. By continuously
    monitoring the connection usage patterns, it''s much easier to react and adjust
    the pool size when the initial configuration doesn''t hold anymore.


    Unfortunately, many connection pooling solutions only offer limited support for
    monitoring and failover strategies, and that was the main reason for building
    FlexyPool Supporting the most common connection pooling frameworks, this open
    source project offers the following connection usage metrics:


    Table 3.2: FlexyPool metrics


    | Name | Description |

    | --- | --- |

    | concurrent connection requests | How many connections are being requested at
    once |

    | concurrent connections | How many connections are being used at once |

    | maximum pool size | If the target DataSource uses adaptive pool sizing, this
    metric shows how the pool varies with time |

    | connection acquisition time | The time it takes to acquire a connection from
    the target DataSource |

    | overall connection acquisition time | The total connection acquisition interval
    (including retries) |

    | retry attempts | The connection acquisition retry attempts |

    | overflow pool size | How much the pool size can grow over the maximum size until
    timing out the connection request |

    | connection lease time | The duration between the moment a connection is acquired
    and the time it gets released |


