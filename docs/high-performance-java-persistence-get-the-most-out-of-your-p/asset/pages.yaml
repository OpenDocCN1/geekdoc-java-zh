  md: '# 5. Statement Caching


    Being a declarative language, SQL describes the what and not the how. The actual
    database structures and the algorithms used for fetching and preparing the desired
    result set are hidden away from the database client, which only has to focus on
    properly defining the SQL statement. This way, to deliver the most efficient data
    access plan, the database can attempt various execution strategies.


    # 5.1 Statement lifecycle


    The main database modules responsible for processing an SQL statement are the
    Parser, the Optimizer and the Executor.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_54_0.png)


    Figure 5.1: Statement lifecycle'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Statement Caching


    # 5.1.1 Parser


    The Parser checks the SQL statement and ensures its validity. The statements are
    verified both syntactically (the statement keywords must be properly spelled and
    following the SQL language guidelines) and semantically (the referred tables and
    column do exist in the database).


    During parsing, the SQL statement is transformed into a database internal representation,
    called the syntax tree (also known as parse tree or query tree). If the SQL statement
    is a high-level representation (being more meaningful from a human perspective),
    the syntax tree is the logical representation of the database objects required
    for fulfilling the current statement.


    # 5.1.2 Optimizer


    For a given syntax tree, the database must decide the most efficient data fetching
    algorithm. Data is retrieved by following an access path, and the Optimizer needs
    to evaluate multiple data traversing options like:


    +   * the access method for each referencing table (table scan or index scan)

    * for index scans, it must decide which index is better for fetching this result
    set

    * for joining relation (e.g. table, values or Common Table Expression), it must
    choose the best performing join type (e.g. Nested Loops Join, Hash Joins, Sort
    Merge Joins)

    * the joining order becomes very important especially for Nested Loops.


    The list of access path, chosen by the Optimizer, is assembled into an execution
    plan.


    Because of the large number of all the possible action plan combinations, finding
    a good execution plan is not a trivial task. The more time is spent on finding
    the best possible execution plan, the higher the response time will get, so the
    Optimizer has a fixed time for finding a reasonable plan.


    The most common decision-making algorithm is CBO (Cost-Based Optimizer). Each
    access method translates to a physical database operation, and as cost in resources
    can be estimated. The database stores various statistics like table sizes and
    data cardinality (how much the column values differ from one to the other) to
    evaluate the cost of a given database operation. Time is the most common unit
    of cost, and the database estimates based on the number of CPU cycles and I/O
    operations by a particular execution.


    When finding an optimal execution plan, the Optimizer might evaluate multiple
    options, and based on their overall cost, it will choose the one requiring the
    least amount of time to execute.


    By now, it''s clear that finding a proper execution plan is resource intensive,
    and for this purpose, some database vendors offer execution caching (to eliminate
    the time spent on finding the optimal plan). While caching can speed up statement
    execution, it also incurs additional challenges (making sure the plan is optimal
    across multiple executions).'
