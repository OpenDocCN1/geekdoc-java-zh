  md: '# Write-behind cache


    The Persistence Context acts as a transactional write-behind-cache, deferring
    entity state flushing up until the last possible moment.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_136_0.png)


    Because modifying every DML statement requires locking (to prevent dirty writes),
    the behind cache can reduce the database lock acquisition interval, therefore
    increasing concurrency.


    +   - But caches introduce consistency challenges, the Persistence Context requires
    a flush prior to executing any JPQL or native SQL query (otherwise it might break
    the read-your-write consistency guarantee).


    As it will be detailed in the following chapters, Hibernate doesn''t automatically
    flush pending changes when a native query is about to be executed, and the application
    developer must explicitly trust what database tables are needed to be synchronized.


    Figure 8.6: Persistence context'
