  md: "# Batch updates\n\nBecause Hibernate separates the id generation from the actual\
    \ entity insert statement, entities using the identity generator may not participate\
    \ in JDBC batch updates. Hibernate issues the insert statement during the persist()\
    \ method call, thereby breaking the transactional write-behind caching semantic\
    \ used for entity state transitions.\n\nEven if JDBC drivers allow fetching the\
    \ associated generated keys when executing a batch update, Hibernate still needs\
    \ an improvement in this regard.\n\nThe identity generator can be mapped as follows:\n\
    \n```\n@Entity(name = \"post\")\npublic class Post {\n\n  @Id\n  @GeneratedValue(strategy\
    \ = GenerationType.IDENTITY)\n  private Long id;\n}\n```\n\nThe following example\
    \ demonstrates how the transaction write-behind caching model is circumvented\
    \ by the identity column semantics. Although disabled by default, JDBC batching\
    \ was enabled to compare results between identity and sequence generators.\n\n\
    ```\ndoInPA(entityManager) -> {\n  for (int i = 0; i < batchSize; i++) {\n   \
    \ entityManager.persist(new Post());\n  }\n\n  LOGGER.debug(\"Flush is triggered\
    \ at commit-time\");\n}\n```\n\nExecuting the previous test case generates the\
    \ following output:\n\n```\nINSERT INTO post (id) VALUES (DEFAULT)\nINSERT INTO\
    \ post (id) VALUES (DEFAULT)\n```\n\n```\nDEBUG - Flush is triggered at commit\
    \ time\n```\n\nBecause the associated entity identifier can only be known after\
    \ the insert statement is executed, Hibernate will trigger the entity state transition\
    \ prior to flushing the current running Persistence Context."
  merge: -1
