  md: 'So, the execution plan depends on bind parameter value selectivity. If the
    selectivity is constant across the whole bind value domain, the execution plan
    is no longer sensitive to parameter values. A generic execution plan is much easier
    to reuse than a bind-sensitive one.


    The following section describes how well-known database systems implement server-side
    prepared statements in relation to their associated execution plans.


    # Oracle


    Every statement goes through the Parser, where it is validated both syntactically
    and semantically. Next, a hashing function takes the SQL statement, and the resulting
    hash key is used for searching the Shared Pool for an existing execution plan.


    In Oracle terminology, reusing an execution plan is called a soft parse. To reuse
    a plan, the SQL statement must be identical with a previously processed one (even
    the case sensitivity and whitespaces are taken into consideration).


    If no execution plan is found, the statement undergoes a hard parse. The Optimizer
    optimizes multiple execution plans and chooses the one with lowest associated
    cost, which is further compiled into a source tree by the Row Source Generator.
    Whether reused (soft parse) or generated (hard parse), the source tree goes to
    the Executor, which fetches the associated result set.


    # Bind pending


    As previously, the Optimizer cannot determine an optimal access path in the absence
    of actual bind values. Oracle uses bind peering during the hard parse phase.


    The first set of bind parameter values determines the selectivity of the cached
    execution plan. It''s clear that this strategy is feasible for uniformly distributed
    datasets, and a single execution plan cannot perform consistently for bind-sensitive
    predicates.


    As of 11g, Oracle has introduced adaptive cursor sharing, so a statement can utilize
    execution plans. The behavior is reactive to execution times, and bad plans are
    substituted with optimal ones for bind value combinations.


    Both the execution cache and adaptive cursor sharing are enabled by default, and
    for highly concurrent OLTP systems, hard parsing should be avoided as much as
    possible. During execution plan generation, the database uses a latch to avoid
    multiple concurrent statements from accessing the same database domain. Latches
    introduce a serial execution, which, in turn, increases contention and decreases
    concurrency and scalability.


    Prepared(s) optimize the execution cache hit rate and are therefore preferred
    over plain JDBC Statement(s).


    +   * https://docs.oracle.com/database/121/TGSQL/tgsql_proc.html#TGSQL175

    * https://docs.oracle.com/database/121/TGSQL/tgsql_cursor.html#TGSQL848'
