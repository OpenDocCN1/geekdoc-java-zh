    \ owner\n        String ip = rs.getString(0);\n        return ip != null ? new\
    \ IPv4(ip) : null;\n    }\n\n    @Override public void set(PreparedStatement st,\
    \ IPv4 value, int index) throws SQLException {\n        SessionImplementor session,\
    \ Object\n        if (value == null) {\n            st.setNull(index, Types.OTHER);\n\
    \        } else {\n            PGObject holder = new PGObject();\n           \
