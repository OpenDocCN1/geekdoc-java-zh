  md: "# Mapping Types and Identifiers\n\nFor generating UUID identifiers, Hibernate\
    \ offers three generators (assigned, uuid, uuid2), which we will be discussed\
    \ in great detail in the following sections.\n\n# 10.2.1.1 The assigned generator\n\
    \nBy simply omitting the @GeneratedValue annotation, Hibernate will fall back\
    \ to the assigned identifier, which allows the data access layer to control the\
    \ identifier generation process. The following example maps a java.util.UUID to\
    \ a BINARY(16) column type:\n\n```\n@Entity @Table(name = \"post\")\npublic class\
    \ Post {\n    @Id @Column(columnDefinition = \"BINARY(16)\")\n    private UUID\
    \ id;\n\n    public Post() {}\n\n    public Post(UUID id) {\n        this.id =\
    \ id;\n    }\n}\n```\n\nWhen persisting a post, Hibernate generates the insert\
    \ statement:\n\n```\nINSERT INTO post (id) VALUES\n([86, 10, -104, 26, 60, -115,\
    \ 79, 78, -118, -45, 64, 94, -64, -40, 66, 100])\n```\n\nThe UUIDType translates\
    \ the java.util.UUID to an array of byte(s) that is stored in the associated BINARY(16)\
    \ column type.\n\n> Because the identifier is generated in the data access layer,\
    \ the database server is freed from this responsibility, and so it can allocate\
    \ its resources for other data processing tasks.\n\nHibernate can also generate\
    \ a UUID identifier on behalf of the application developer, as described in the\
    \ following sections."
