    default JTA after_statement strategy, and so it should be used if the JTA transaction
    resource management logic doesn''t interfere with this connection releasing strategy.


    # 9.3 Monitoring connections


    As previously concluded, using an externally configured DataSource is preferred
    because the actual DataSource can be decorated with connection pooling, monitoring
    and logging capabilities. Because that''s exactly how FlexPool* works too, the
    following diagram captures the DataSource proxying mechanism:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_148_0.png)


    Figure 9.2: DataSource proxy


    Instead of getting the actual DataSource instance, the data access layer gets
    a proxy reference. The proxy intercepts connection acquisition and releasing requests,
    and, this way, it can monitor its usage.


    When using Spring, setting up FlexPool is fairly easy because the application
    has total control over the DataSource configuration.


    In Java EE, database connections should always be fetched from a managed DataSource,
    and one simple way of integrating FlexPool is to extend the default DataSourceConnectionProviderImpl
    and substitute the original DataSource with the FlexPoolDataSource.'
