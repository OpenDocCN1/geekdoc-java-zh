  md: "# Connection Management and Monitoring\n\nTo enable statement logging, the\
    \ following Logback logger must be added in the associated configuration file:\n\
    \n```\n<logger name=\"org.hibernate.SQL\" level=\"debug\"/>\n```\n\nBecause Hibernate\
    \ uses PreparedStatement(s) exclusively, the bind parameter values are not available\
    \ when the statement gets printed into the log:\n\n```\nINSERT INTO post (title,\
    \ version, id) VALUES (?, ?, ?)\n```\n\n> Although bind parameters might be logged\
    \ separately (e.g. org.hibernate.type.descriptor.sql), the most straight-forward\
    \ way of logging SQL statements along with their runtime bind parameter values\
    \ is to use an external DataSource proxy. Because the proxy intercepts all statement\
    \ executions, the bind parameter values can be introspected and printed as well.\n\
    \n# 9.4.1 Statement formatting\n\nBy default, every SQL statement, no matter how\
    \ long, is written as a single line of text. To increase readability, Hibernate\
    \ can transform SQL statements in a human-readable format that spans over multiple\
    \ lines. This feature can be activated by setting the following configuration\
    \ property:\n\n```\n<property name=\"hibernate.format_sql\" value=\"true\" />\n\
    ```\n\nWith this setting in place, the previous statement can be formatted as\
    \ follows:\n\n```\ninsert\ninto\n  post\n  (title, version, id)\nvalues\n  (?,\
