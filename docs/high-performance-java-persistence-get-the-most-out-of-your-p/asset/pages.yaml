    \ DATETIME |\n| Indexes |\n\n| topic_statistics |\n|--- |\n| id BIGINT(20) |\n\
    | views BIGINT(20) |\n| Indexes |\n\nFigure 12.4: Table-per-class\n\nTo use this\
    \ strategy, the Topic must be annotated with @Inheritance(strategy = InheritanceType.TABLE_PER_CLASS).\n\
    \nInserting the Post and Announcement entities defined in the single table inheritance\
