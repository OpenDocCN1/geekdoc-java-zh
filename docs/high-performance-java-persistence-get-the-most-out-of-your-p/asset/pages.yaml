  md: '# #6. ResultSet Fetching


    Having discussed the SQL statement optimizations (batching and caching), it''s
    time to move on to the response part of a query processing. Unlike the insert,
    update and delete statements, which only return the affected row count, a JDBC
    select query returns a ResultSet instead.


    The database Executor takes an execution plan and fetches data into a result set.
    Rows may be extracted at once or upon being requested by the database client.


    The SQL Standard defines the result set and the cursor descriptor through the
    following properties:


    +   - scrollability (the direction in which the result set can be iterated)

    - sensitivity (when should data be fetched)

    - updateability (available for cursors, it allows the client to modify records
    while traversing the result set)

    - holdability (the result set scope in regard to a transaction lifecycle)


    Following the standard specification, the JDBC ResultSet offers support for all
    the aforementioned properties.


    Table 6.1: JDBC ResultSet properties


    | Property Name | Description |

    | - | - |

    | TYPE_FORWARD_ONLY | The result set can only be iterated from the first to the
    last element. This is the default scrollability value. |

    | TYPE_SCROLL_INSENSITIVE | The result set takes a time snapshot which can be
    iterated both forward and backwards. |

    | TYPE_SCROLL_SENSITIVE | The result is fetched on demand, while being iterated
    without any direction restriction. |

    | CONCUR_READ_ONLY | The result is just a data projection which doesn''t allow
    row-level manipulation. This is the default changeability value. |

    | CONCUR_UPDATABLE | The cursor position can be used to update or delete records,
    or even insert a new one. |

    | CLOSE_CURSORS_AT_COMMIT | The result is closed when the current transaction
    ends. |

    | HOLD_CURSORS_OVER_COMMIT | The result remains open even after the current transaction
    is committed. |'
