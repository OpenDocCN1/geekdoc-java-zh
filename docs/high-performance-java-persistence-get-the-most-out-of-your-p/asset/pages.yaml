    \ similar to the joined table strategy, but instead of storing base class columns\
    \ in the topic table, each subclass table stores columns from the topic table.\
    \ There is no foreign key between the topic and the post or announcement subclass\
    \ tables, and there is no foreign key in the topic_statistics table either.\n\n\
    | topic |\n|--- |\n| id BIGINT(20) |\n| createdOn DATETIME |\n| owner VARCHAR(255)\
    \ |\n| title VARCHAR(255) |\n| board_id BIGINT(20) |\n| Indexes |\n\n| post |\n\
    |--- |\n| id BIGINT(20) |\n| createdOn DATETIME |\n| owner VARCHAR(255) |\n| title\
    \ VARCHAR(255) |\n| board_id BIGINT(20) |\n| content VARCHAR(255) |\n| Indexes\
