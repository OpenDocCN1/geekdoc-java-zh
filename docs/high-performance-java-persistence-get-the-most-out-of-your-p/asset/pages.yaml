  md: '#  2. Performance and Scaling


    An enterprise application needs to store and retrieve as much data and as fast
    as possible. In application performance management, the two most important metrics
    are response time and throughput.


    The lower the response time, the more responsive an application becomes. Response
    time is therefore the measure of performance. Scaling is about maintaining low
    latencies while increasing system load, so throughput is the measure of scalability.


    # 2.1 Response time and throughput


    Because this book is focused on high-performance data access, the boundaries of
    the system test are located at the transaction manager level. The transaction
    response time is measured as the time it takes to complete a transaction, and
    it encompasses the following time segments:


    +   - the database connection acquisition time

    - the time it takes to send all database statements over the wire

    - the execution time for all incoming statements

    - the time it takes for sending the result sets back to the database client

    - the time the transaction is idle due to application-level computations prior
    to releasing the database connection.


    ```

    $T = t_{acq} + t_{req} + t_{exec} + t_{res} + t_{idle}$

    ```


    Throughput is defined as the rate of completing incoming load. Through can be
    calculated as the number of transactions executed within a given time interval.


    ```

    $X = \frac{transaction\ count}{time}$

    ```


    From this definition, we can conclude that by lowering the time it takes to execute
    a transaction, the system can accommodate more requests.


    Testing against a single database connection, the measured throughput becomes
    the baseline for further concurrency-based improvements.


    ```

    $X(N) = X(1) \times C(N)$

    ```'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Performance and Scaling


    Ideally, if the system was scaling linear, adding more database connections would
    yield a proportional throughput. Due to contention on database resources and the
    cost of maintaining coherence across multiple concurrent sessions, the relative
    throughput gain follows a curve instead of a straight line.


    USL (Universal Scalability Law) can approximate the maximum relative throughput
    (system capacity) in relation to the number of load generators (database connections).


    ```

    C(N) = \frac{N}{1 + \alpha(N - 1) + \beta N(N - 1)}$

    ```


    +   - C - the relative throughput gain for the given concurrency level

    - $\alpha$ - the contention coefficient (the serializable portion of the database
    processing routine)

    - $\beta$ - the coherence coefficient (the cost for maintaining consistency across
    all concurrent database sessions).


    When the coherence coefficient is zero, USL overlaps with Amdahl''s Law. Contention
    has the effect of leveling up scalability. On the other hand, coherence is responsible
    for the inflection point in the scalability curve, and its effect becomes more
    significant as the number of concurrent sessions increases.


    The following graph depicts the relative throughput gain when the USL coefficients
    ($\alpha$, $\beta$) are set to the following values (0.1, 0.0001). The x-axis
    represents the number of concurrent sessions (N) and the y-axis shows the relative
    capacity gain (C).


    Amdahl''s Law vs USL


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_15_0.png)


    Figure 2.1: Universal Scalability Law


    > http://www.perfdynamics.com/Manifesto/USLscalability.html


    > http://en.wikipedia.org/wiki/Amdahl%27s_law'
  merge: -1
