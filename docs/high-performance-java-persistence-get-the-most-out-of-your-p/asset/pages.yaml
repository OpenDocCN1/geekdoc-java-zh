  md: '# PostgreSQL


    Prior to 9.2, a prepared statement was planned and compiled entirely during the
    prepare phase, so the execution plan was generated in the absence of the actual
    bind parameter values. Although it attempted to spare database resources, this
    strategy was very sensitive to skewed data. Since PostgreSQL 9.2, the prepare
    phase only parses and rewrites a statement, with the optimization and the planning
    phase deferred until execution time. This way, the rewritten syntax tree is optimized
    according to the actual bind values, and an optimal execution plan is generated.


    For a single execution, a plain statement requires only one database roundtrip,
    while a prepared statement needs two to avoid the networking overhead, by default,
    JDBC PreparedStatement(s) do both and the execute phases over a single database
    request.


    A client-side prepared statement must run at least 5 times for the driver to turn
    it into a server-side statement. The default execution count value is given by
    the prepareThreshold parameter, which is configurable as a connection property
    or through driver-specific API.


    After several executions, if the performance is not sensitive to bind parameter
    values, the Optimizer might choose to turn the plan into a generic one and cache
    it for reuse.


    > https://jdbc.postgresql.org/documentation/publicapi/org/postgresqlStatement.html


    # MySQL


    When preparing a statement, the MySQL Parser generates a syntax tree which is
    further validated and pre-optimized by a resolution mechanism. The syntax tree
    undergoes several data-insensitive transformations and the final output is a permanent
    tree.


    Since MySQL 5.7*, all permanent transformations (reordering orders or subquery
    optimizations) are in the prepare phase, so the execution phase only applies data-sensitive
    transformations. MySQL does not cache execution plans, so every statement execution
    is optimized for the current bind parameter values, avoiding data skew issues.


    Because of some unresolved issues, using version 5.0.5*, the MySQL JDBC driver
    only emulate server-side prepared statements. To switch to server-side prepared
    statements, the useServerPrepStmts and the cachePrepStmts connection properties
    must be true.


    Before activating this feature, it''s better to check the latest Connector/J release
    notes and validate this feature is safe for using.


    > http://mysqlserverteam.com/mysql-performance-schema-prepared-statements-instrumentation/

    http://dev.mysql.com/doc/relnotes/connector-j/en/news-5-0-3.html'
