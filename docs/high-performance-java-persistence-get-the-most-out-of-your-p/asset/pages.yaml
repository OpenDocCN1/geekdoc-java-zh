- img_proc: true
  md: 'Performance and Scaling


    The asynchronous replication topology is also referred as warm standby because
    the election process doesn''t happen instantaneously.


    Most database systems allow one synchronous Slave node, at the price of increasing
    transaction response time (the Master must have block waiting for the synchronous
    Slave node to acknowledge the update). In case of Master node failure, the automatic
    failover mechanism can promote the synchronous Slave node to become the new Master.


    Having one synchronous Slave allows the system to ensure data consistency in case
    of Master node failures since the synchronous Slave is an exact copy of the Master.
    The synchronous Master-Slave replication is also called a hot standby topology
    because the synchronous Slave is readily available for replacing the Master node.


    When only asynchronous Slave are available, the newly elected Slave node might
    lag the Failed Master, in which consistency and durability are traded for lower
    latencies and higher throughput.


    Aside from eliminating the single point of failure, database replication can also
    increase transaction throughput. In a Master-Slave topology, the Slave nodes can
    accept read-only transactions, therefore routing read traffic away from the Master
    node.


    The Slave nodes increase the available read-only connections and reduce Master
    node resource contention, which, in turn, can also lower read-write transaction
    response time. If the Master node can no longer keep up with the ever increasing
    read-write traffic, a Multi-Master replication might be a better alternative.


    # ## 2.3.2 Multi-Master replication


    In a Multi-Master replication scheme, all nodes are equal and can accept both
    read-only and read-write transactions. Splitting the load among multiple nodes
    can only increase transaction throughput and reduce response time as well.


    But because distributed systems are all about trade-offs, ensuring data consistency
    is challenging in a Multi-Master replication scheme because there is no longer
    a single source of truth. The same data can be modified concurrently on separate
    nodes, so there is a possibility of conflicting updates. The replication scheme
    can either avoid conflicts or it can detect them and apply an automatic conflict
    resolution algorithm.'
