  md: '# Transactions


    # 114


    HTTP is stateless by nature, and for very good reasons, stateless applications
    are easier to scale than stateless ones. But application-level transactions cannot
    be stateless as otherwise newer requests would not continue from where the previous
    request left. Preserving state across multiple web requests allows building a
    conversational context, providing application-level repeatable guarantees.


    In the next diagram, Alice uses a stateful conversational context, but in the
    absence of a record versioning system, it''s still possible to lose updates.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_123_0.png)


    The batch process reduces the product quantity. Thinking the product version hasn''t
    changed, Alice attempts to purchase one item which decreases the product quantity
    by one. In the end, Alice has simply overwritten the batch processor modification
    and data integrity has been compromised.


    Figure 7.15: Stateful conversation losing updates


    So the application-level repeatable reads are not self-sufficient (this argument
    is true for database isolation levels as well). To prevent lost updates, a concurrency
    control mechanism becomes mandatory.


    # 7.7.1 Pessimistic and optimistic locking


    Isolation levels entail implicit locking, whether it involves physical locks (like
    2PL) or data anomaly detection (MVCC). To coordinate state changes, application-level
    concurrency control makes use of explicit locking, which comes in two flavors:
    pessimistic and optimistic locking.


    # 7.7.1 Pessimistic locking


    As previously explained, most database systems already offer the possibility of
    manually requesting shared or exclusive locks. This concurrency control is said
    to be pessimistic because it assumes that conflicts are bound to happen, and they
    must be prevented accordingly.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'As locks can be released in a timely fashion, exclusive locking is appropriate
    during the last database transaction of a given low conversation. This way, the
    application can guarantee that, once locks are acquired, no other transaction
    can interfere with the currently locked resources.


    > Acquiring locks on critical records can prevent non-repeatable reads, lost updates,
    as well as read and write skew phenomena.


    # 7.7.1.2 Optimistic locking


    Undoubtedly a misnomer (albeit widespread), optimistic locking doesn''t incur
    any locking at all. A better name would be optimistic concurrency control since
    it uses a totally different approach to managing conflicts with pessimistic locking.


    MVCC is an optimistic concurrency control strategy it assumes that contention
    is unlikely to happen, and so it doesn''t rely on locking for controlling shared
    resources. The optimistic concurrency mechanisms detect anomalies and resort to
    aborting transactions whose invariants are no longer held.


    While the database knows exactly which rows have been issued in a given time interval,
    the application is left to maintaining a happens-before event order. Each database
    row must have an associated version, which is locally incremented by the logical
    transaction. Every modifying SQL statement (update or delete) uses the previously
    loaded version as an assumption that the row hasn''t changed in the meantime.


    Because even the lowest isolation can prevent write-write conflicts, only one
    transaction is allowed to update a row at any given time. Since the database already
    has monotonic updates, the row versions can also be incremented monotonically,
    and the application can detect when an updating record has become stale. The optimistic
    locking concurrency algorithm looks like this:


    +   - when a client reads a particular row, its version comes along with the other
    fields

    - upon updating a row, the client filters the current record by the version it
    previously loaded.


    ```

    UPDATE product

    SET (quantity, version) = (4, 2)

    WHERE id = 1 AND version = 1

    ```


    +   - if the statement update count is zero, the version was incremented in the
    meanwhile, and the current transaction now operates on a stale record version.'
