  md: '# 7. Transactions


    A database system must allow concurrent access to the underlying data. But shared
    data means that read and write operations must be synchronized to ensure that
    data integrity is not compromised.


    To control concurrent modifications, the Java programming language defines the
    synchronized keyword for two purposes:


    +   - it can restrict access to a shared Object (to preserve invariants), so only
    a Thread can execute a routine at any given time

    - it propagates changes from the current Thread local memory to the global memory,
    that''s available to all running threads of executions.


    This behavior is typical for other concurrent programming environments and database
    systems are no different. In a relational database, the mechanism for ensuring
    data integrity is implemented on top of transactions.


    A transaction is a collection of read and write operations that can either succeed
    or fail together, as a unit. All database statements must execute within a transactional
    context, even when the client explicitly defines its boundaries.


    In 1981, Jim Gray has defined the first properties of a database transaction in
    his famous paper: The transaction concept: virtues and limitations. Both this
    paper and the first versions of the SQL standard (SQL-86 and SQL-89) only used
    three properties for defining a database transaction: Atomicity, Consistency and
    Durability.


    With other relation database topics, the transaction research has continued ever
    since, and the SQL-92 version introduced the concept of Isolation Levels. These
    four properties have been assembled in the well-known ACID (Atomicity, Consistency,
    Isolation and Durability) acronym that has become synonym with relation transactions.


    Knowing how database transactions work is very important for many reasons:


    +   - effective data access (data integrity shouldn''t be compromised when aiming
    for high-performance)

    - efficient data access (reducing contention can minimize transaction response
    time which, in turn, increases throughput).


    The next sections will detail each transaction property in relation to high-performance
    data processing.


    > http://research.microsoft.com/en-us/um/people/gray/papers/theTransactionConcept.pdf'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 7.1 Atomicity


    Atomicity is the property of grouping multiple operations into an all-or-nothing
    unit of work, which can succeed only if all individual operations succeed. For
    this reason, the database must be able to roll back all actions associated with
    every executed statement.


    | X=11 | X=11 | X=11 | X=11 | X=10 |

    |---|---|---|---|---|

    | Y=2 | Y=2 | Y=22 | Y=22 | Y=20 |

    | Z=3 | Z=3 | Z=33 | Z=30 | Z=30 |


    Successful Transaction


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_83_0.png)


    Falling Transaction


    | X=1 | X=11 | X=11 |

    |---|---|---|

    | Y=2 | Y=22 | Y=22 |

    | Z=3 | Z=33 | Z=33 |


    Figure 7.1: Atomic units of work


    # Write-write conflicts


    Ideally, every transaction would have a completely isolated branch which could
    easily be discarded in a case of rollback. This scenario would be similar to how
    a Version Control System (e.g. git) implements branching. In case of conflicts,
    the Virtual Control System aborts the commit operation, and the client has to
    manually resolve the conflict. Unlike VCS tools, the relational database engine
    must manage conflicts without any human intervention.


    For this reason, the database prevents write-write conflict situations and only
    one transaction can write a record at any given time.


    All statements are executed against the actual data structures (tables, indexes,
    in-memory buffers), only to be materialized at commit time. In case of rollback,
    the database must revert any pending changed data to its previous state.


    # Oracle


    The undo tablespace stores the previous data versions in undo segments. Upon rolling
    back the database engine searches the associated undo segments that can recreate
    the before image of every datum that was changed by the running transaction.


    > https://docs.oracle.com/database/121/ADMIN/undo.html#ADMIN11460'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# SQL Server


    The transaction log* stores details about the current running transactions and
    their associated modifications. The rollback process scans the transaction log
    backward to find the associated undo records. When the record is found, the database
    engine restores the before image of the affected datum.


    To prevent the transaction log from filling up, the log must be truncated on a
    regular basis. Long-running transactions can delay the truncation process, so
    that that''s another reason to avoid them as much as possible.


    https://msdn.microsoft.com/en-us/library/ms190925.aspx


    # PostgreSQL


    Unlike other database systems, PostgreSQL doesn''t use a dedicated append-only
    undo log. Because of its multi-version nature, every database object maintains
    its own version history. In the absence of the log seek-up phase, the rollback
    process becomes much lighter as it only requires to switch from one version to
    the other.


    The downside is that the previous version space is limited in size, and so it
    must be reused. The process of reclaiming the storage occupied by old versions
    is called VACUUMING.


    Each transaction has an associated XID* and new transactions must have a greater
    XID number than all previous ones.


    The XID is a 32-bit number, so it can accommodate over 4 billion transactions.
    In a high-performance application, the transaction lifespan is very short, and
    if the VACUUM process is disabled, this could be reached. When the XID counter
    reaches its maximum value, it wraps around and start again from zero.


    The transactions issued prior to the XID wraparound will have their identifiers
    greater than newer transactions started after the XID counter reset. This anomaly
    can cause the system to perceive older transactions as they were started in the
    future, which can lead to very serious data integrity issues.'
