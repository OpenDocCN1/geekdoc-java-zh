  md: '# Statement Caching


    # 5.1.3 Executor


    From the Optimizer, the execution plan goes to the Executor where it is used to
    fetch the associated data and build the result set. The Executor makes use of
    the Storage Engine (for loading data according to the current execution plan)
    and the Transaction Engine (to enforce the current transaction data integrity
    guarantees).


    Having a reasonably large in-memory buffer allows the database to reduce the I/O
    contention, therefore reducing transaction response time. The consistency model
    also has an impact on the overall transaction performance since locks may be acquired
    to ensure data integrity, and the more locking, the less chance for parallel execution.


    # 5.2 Caching performance gain


    Before jumping into more server-side and client-side statement caching, it''s
    better to visualize the net effect of reusing statements on the overall application
    performance. The following test calculates the number of queries a database engine
    can execute within one minute span. To emulate a non-trivial execution plan, the
    test executes a statement combining both table joining as well as query nesting.


