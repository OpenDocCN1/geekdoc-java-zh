  md: '# MySQL


    The undo log is stored in the rollback segment* of the system tablespace.

    Each undo log is split into two sections, one responsible for rolling back purposes
    and the other for reconstructing the before image. The first section can be wiped
    out right after the transaction ended, while the other needs to linger for long
    as any current running query or other concurrent transactions need to see a previous
    version of the records in question.


    Behind the scenes, MySQL runs a purge process that cleans up the storage occupied
    by deleted records, and also reclaims the undo log segments that are no longer
    required.


    Long-running transactions delays the purge process execution, causing the undo
    log to grow very large, especially in write-heavy access scenarios.


    ```

