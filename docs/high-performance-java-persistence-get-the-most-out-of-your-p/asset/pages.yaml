  md: '# Performance and Scaling


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_20_0.png)


    Figure 2.3: Multi-Master replication


    To avoid conflicts, the two-phase commit protocol can be used to enlist all participating
    nodes in one distributed transaction. This design allows all nodes to be in-sync
    at all time, at the cost of increasing transaction response time (by slowing down
    write operations).


    If nodes are separated by a WAN (Wide Area Network), synchronization latencies
    can increase dramatically. If one node is no longer reachable, the synchronization
    could fail, and the transaction would roll back on Masters.


    Although avoiding conflicts is better from a data consistency perspective, synchronous
    replication might incur high transaction response times. The asynchronous replication
    can provide better throughput, the asynchronous Multi-Master replication requires
    a conflict detection and an automatic conflict resolution algorithm. When a conflict
    is detected, the automatic resolution tries to merge the two conflicting branches,
    and, in case it fails, manual intervention is required.


    # 2.3.3 Sharding


    When data size grows beyond the overall capacity of a replicated multi-node environment,
    splitting data becomes unscalable. Sharding distributing data across multiple
    nodes so each instance contains only a subset of the overall data.


    Traditionally, relational databases have horizontal partitioning to distribute
    data across multiple tables within the same database server. As opposed to horizontal
    partitioning, sharding requires a distributed system topology so that data is
    spread over multiple machines.


    Each shard must be self-contained because a user transaction can only use data
    from within a single shard. Joining across shards is usually prohibited because
    the cost of distributed locking and the networking overhead would lead to long
    transaction response times.'
