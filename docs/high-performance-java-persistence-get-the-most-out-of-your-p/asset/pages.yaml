  md: '# Oracle


    The default fetch size is set to 10 records, as a consequence of the JDBC driver
    memory model.


    The Oracle 10i and 11g drivers pre-allocate a byte[] and char[] buffers at statement
    creation time, whose lengths are given by the multiplication of the fetch size
    by the maximum memory footprint of each statement created. A VARCHAR2(N) column
    can accommodate at most N characters (or 2N bytes). Storing a field with a maximum
    size of 5 characters in a VARCHAR2(4000) column would pre-allocate 8000 bytes
    on the client-side, which is definitely a waste of memory.


    > Avoiding memory allocation, by reusing existing buffers, is a very solid reason
    for employing statement caching. Only when using the implicit statement cache,
    the 10i and 11g can benefit from recycling client-side memory.


    The 12c implementation defers buffer allocation until the result is ready for
    fetching. This driver version use byte[] arrays instead, allocated lazily. Compared
    to the previous versions, the 12c memory footprint is greatly reduced since, instead
    of allocating maximum possible data, the driver uses the actual extracted data
    size.


    Although the optimal fetch size is application-specific, influenced by the data
    size and the runtime environment concurrency topology, the Oracle JDBC driver
    specification recommends limiting the fetch size to at 100 records.


    Like with any other performance optimization, these indications are suggestions
    at best, and measuring application performance is the only viable way of finding
    the right fetch size.


    *http://www.oracle.com/technet/database/application-development/jdbc-memory-management/12c-1964666.pdf


    # SQL Server


    The SQL JDBC driver uses adaptive buffering, so the result is fetched in batches,
    as needed. The size of a batch is therefore automatically controlled by the driver.


    > Although by default, adaptive buffering is limited to forward-only and read-only
    cursors. Both scrollable and updatable result sets operate on a single block of
    data, whose length is determined by the current statement fetch size.


    *https://msdn.microsoft.com/en-us/library/bb79937%28%29=sql.110%29.aspx'
