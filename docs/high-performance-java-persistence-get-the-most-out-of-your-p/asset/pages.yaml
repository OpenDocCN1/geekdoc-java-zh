  md: '# Inheritance


    To retain the inheritance semantics, the base class properties are going to be
    merged with the subclass ones, so the associated subclass entity table will contain
    both. This is similar to the table-per-inheritance strategy, with the distinction
    that the class is not mapped to a database table (hence, it cannot be used in
    polymorphic queries or associations).


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_242_0.png)


    Figure 12.6: Mapped superclass


    The post and the announcement tables feature columns that were inherited from
    the Topic base class. When persisting the same Post and Announcement entities
    and saving statistics using the newly defined entities:


    ```

    TopicPostStatistics = new PostStatistics(post);

    postStatistics.incrementViews();

    entityManager.persist(postStatistics);

    ```


    ```

    TopicStatistics announcementStatistics =

    new AnnouncementStatistics(announcement);

    announcementStatistics.incrementViews();

    entityManager.persist(announcementStatistics);

    ```


    Hibernate will generate the following SQL statements:


    ```

    INSERT INTO post (board_id, createdOn, owner, title, content, id)

    VALUES (1, ''2016-01-17 09:11:07.525'', ''John Doe'', ''Inheritance'',

    ''Best practices'', 1);

    ```'
