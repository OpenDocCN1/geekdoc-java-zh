    \ is only suitable during the development phase. In a production system, logs\
    \ are often parsed and aggregated in a centralized system, and the multi-line\
    \ statement format impact the log parsing mechanism. Once aggregated, logged queries\
    \ can be formatted prior to being displayed in the application performance monitoring\
