    When removing the first element of the collection:


    ```

    post.getComments().remove(0);

    ```


    Hibernate generates the following DML statements:


    ```

    DELETE FROM post_comment WHERE Post_id = 1

    INSERT INTO post_comment (Post_id, comments_id) VALUES (1, 3)

    INSERT INTO post_comment (Post_id, comments_id) VALUES (1, 4)

    DELETE FROM post_comment WHERE id = 2

