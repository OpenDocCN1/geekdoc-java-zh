  md: "# Inheritance\n\nOne advantage of using inheritance in the Domain Model is\
    \ the support for polymorphic queries. When the application developer issues a\
    \ select query against the Topic entity:\n\n```\nList<Topic> topics = entityManager.createQuery(\n\
    \    \"\"select t from Topic t where t.board.id = :boardId, Topic.class\"\n  \
    \  .setParameter(\"boardId\", 1L)\n    .getResultList());\n```\n\nHibernate goes\
    \ to the topic table, and after fetching the result set, it maps every row to\
    \ its associated subclass instance (e.g. Post or Announcement) by analyzing the\
    \ discriminator column (e.g. DTYPE).\n\n```\nSELECT t.id AS id_1_, t.board AS\
    \ board8_1_, t.created AS created3_1_, t.owner AS owner4_1_, t.title AS title5_1_,\
    \ t.content AS content6_1_, t.validUntil AS valid7_1_, t.DTYPE AS DTYPE1_1_\n\
    FROM topic t\nWHERE t.board_id = 1\n```\n\nDomain model inheritance allows base\
    \ entity associations to be automatically retrieved upon loading a TopicStatistics\
    \ along with its Topic relation:\n\n```\nTopicStatistics statistics = entityManager.createQuery(\n\
    \    \"\"select s from TopicStatistics s join fetch s.topic t where t.id = :topicId\"\
    \n    , TopicStatistics.class)\n    .setParameter(\"topicId\", topicId)\n    .getSingleResult());\n\
    ```\n\nHibernate joins the statistics and the topic table so that it can create\
    \ a TopicStatistics entity with an actual Post or Announcement object reference.\n\
    \n```\nSELECT\nts.id AS id1_2_0_, t.id AS id2_1_1_, ts.views AS views2_2_0,\n\
    t.board AS board8_1_1_, t.createdOn AS created3_1_1,\nt.owner AS owner4_1_, t.title\
    \ AS title5_1_, t.content AS content6_1_,\nt.validUntil AS valid7_1_, t.DTYPE\
    \ AS DTYPE1_1_\nnFROM topic_statistics ts\nINNER JOIN topic t ON ts.id = t.id\n\
    WHERE t.id = 2\n```\n\nEven if not practical in this particular example, @OneToMany\
    \ associations are also possible."
