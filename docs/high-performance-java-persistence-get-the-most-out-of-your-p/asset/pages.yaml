  md: "# 4.2 Batching PreparedStatements\n\nFor dynamic statements (a very common\
    \ enterprise application requirement), the JDBCStatement is a poor fit because\
    \ the only option for varying the SQL statement is through String manipulation.\
    \ Using a String template or concatenating tokens is risky as it makes the access\
    \ logic vulnerable to SQL injection.\n\nTo address this shortcoming, JDBC offers\
    \ the PreparedStatement interface for binding parameters in a safe manner. The\
    \ driver must validate the provided parameter at runtime, therefore discarding\
    \ unexpected input values.\n\nBecause a PreparedStatement is associated with a\
    \ single DML statement, the batch update can group multiple values belonging to\
    \ the same prepared statement.\n\n```\nPreparedStatement postStatement = connection.prepareStatement(\n\
    \  \"INSERT INTO Post (title, version, id) \" + \n  \"VALUES (?, ?, ?)\");\n\n\
    postStatement.setString(1, String.format(\"Post no. %1d\", 1));\npostStatement.setInt(2,\
    \ 0);\npostStatement.setLength(3, 1);\npostStatement.addBatch();\n\npostStatement.setString(1,\
    \ String.format(\"Post no. %1d\", 2));\npostStatement.setInt(2, 0);\npostStatement.setLength(3,\
    \ 2);\npostStatement.addBatch();\n\nint[] updateCounts = postStatement.executeBatch();\n\
    ```\n\n> SQL injection\nFor enterprise application, security is a very important\
    \ technical requirement. The SQL Injection attack exposes data layers that don't\
    \ sanitize the incoming request parameters.\n\nWhen input parameters are passed\
    \ to the underlying database statement without a proper validation, a rogue attacker\
    \ might inject a malicious SQL routine.\n\nThis is usually done by ending the\
    \ current statement with the ; character and continuing with a rogue SQL command,\
    \ like modifying the database structure (deleting a table or modifying authorization\
    \ rights) or even extracting sensitive information."
