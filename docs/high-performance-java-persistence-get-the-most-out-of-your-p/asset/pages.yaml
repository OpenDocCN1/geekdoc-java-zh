  md: '# 7.5.1 Read-only transaction routing


    Setting up a database replication environment is useful for both high-availability
    (a Slave can replace a crashing Master) and traffic splitting. In a Master-Slave
    replication topology, the Master node accepts both read-write and read-only transactions,
    while Slave nodes only take read-only.


    Oracle

    Oracle ADG (Active Data Guard) allows an enterprise application to distribute
    read-write traffic to the Primary node and read-only transactions to a Standby
    database. WebLogic Server GridLink Data Source* provides failover and load balancing
    capabilities over Oracle ADG.


    > *http://www.oracle.com/technet/middleware/weblog/learnmore/1534212


    SQL Server

    The database Availability Group must be configured to use read-only routing, in
    which case the redirection is based on the ApplicationIntent property. This means
    that the application requires separate DataSource(s) for read-write and read-only
    connections, and transaction routing must initiate in the application service
    layer.


    PostgreSQL

    The JDBC driver drives two connection properties*for load balancing purposes:
    loadBalanceHosts (which is disabled by default) and getServerType (master or preferSlave).
    To enable transaction routing, the application must do the routing itself using
    separate DataSource(s).


    > *https://jdbc.postgresql.org/documentation/head/connect.html


    MySQL

    The com.mysql.jdbc.ReplicationDriver* supports transaction routing on a Master-Slave
    topology, the decision being made on the Connection read-only status basis.


    > *https://dev.mysql.com/doc/connector-j/en/connector-j-master-slave-replication-connection.html'
