  md: '# 6.2 ResultSet changeability


    By default, the result set is just a read-only view of the underlying data projection.
    Inspired by database cursors, the JDBC standard offers updatable result sets,
    so the data access logic can modify records while iterating the application-level
    cursor.


    Mixing reading and writing logic into a single database transaction connection
    reminds of two-tier architectures, where holding the result set, even in the user
    think time, was both common and acceptable.


    For web applications, requests should be as short as possible, and most application-level
    transactions span over multiple web requests. The former may use a read-only database
    transaction to fetch data and return to the user, while the latter might use a
    read-write connection to apply data modifications. In such scenario, an updatable
    result set is of little use, especially holding it open (along with the database
    connection) over multiple requests can really hurt application scalability.


    The following test verifies if a forward-only and read-only cursor performs better
    than a sensitive and updatable one. The test executes 10 000 statements, fetching
    100 posts along with details and their associated 1000 comments.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_72_0.png)


    Figure 6.1: ResultSet cursor type


    Every database system under test showed a slight improvement when using forward-only
    and read-only result sets.


    > As a rule of thumb, if the current transaction doesn''t require updating selected
    records, the forward-only and read-only default result set type is the most efficient
    option. Even if it is a reminiscence from JDBC 1.0, the default result set is
    still the right choice in most situations.'
