- img_proc: true
  md: '# SQL Server


    By default, SQL Server uses locks for implementing all the isolation levels stipulated
    by the SQL standard.


    For the Read-Committed isolation level to take advantage of the MVCC model, the
    following configuration must be first set:


    ```

    ALTER DATABASE high_performance_java_persistence

    SET READ_COMMITTED_SNAPSHOT ON;

    ```


    For a higher-level isolation, SQL Server offers the Snapshot isolation mode, which
    must be activated at the database:


    ```

    ALTER DATABASE high_performance_java_persistence

    ALLOW_SNAPSHOT_ISOLATION ON;

    ```


    Because Snapshot is a custom isolation level, it must also be set at the connection
    level prior to starting a new transaction:


    ```

    SET TRANSACTION ISOLATION LEVEL SNAPSHOT;

    GO

    BEGIN TRANSACTION;

    GO

    COMMIT TRANSACTION;

    GO

    ```


    When a row is updated or deleted, the database can track changes in the tempdb
    database. The current row version will have a reference back to the previous version,
    which is recorded in the version store, in the tempdb database. Rows are not deleted
    away right but marked for the removal by the Ghost cleanup task. Old versions
    must be kept for as a current running transaction might need them, which is specified
    by the transaction isolation level.


    The Ghost cleanup task runs periodically and reclaims storage from old versions
    that are no longer necessary.


    > A long-running transaction would require the database engine to keep some old
    version for a very long time, and because version changes are chained in a linked
    list structure, restoring previous version might becomes resource intensive.'
  merge: -1
