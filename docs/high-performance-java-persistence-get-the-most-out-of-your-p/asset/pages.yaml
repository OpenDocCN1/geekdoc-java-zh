- img_proc: true
  md: '# Why JPA and Hibernate matter


    Because the underlying data resides in a relational database, the Domain Model
    must be adapted to the database schema and the SQL-driven communication protocol.
    The ORM design pattern helps bridging these two different data representations
    and close the technological gap between them. Every row is associated with a Domain
    Model object (Entity in JPA terminology), and so the ORM tool can translate the
    entity states into DML statements.


    From an application development point of view, this is very convenient since it''s
    much easier to manipulate Domain Model relationships rather than visualizing the
    business logic through underlying SQL statements.


    # 8.2 JPA vs Hibernate


    JPA is only a specification. It describes the interfaces that the client operates
    with and the standard object-relational mapping metadata (Java annotations or
    XML descriptors). Beyond the API definition, JPA also explains (not exhaustively)
    how these specifications are ought to be implemented by the JPA providers. JPA
    evolves with the Java EE platform (Java EE 6 introducing JPA 2.0 and Java 7 introducing
    JPA 2.1).


    Hibernate was already a full-featured JPA ORM implementation by the time the JPA
    specification was released for the first time. Although it implements the JPA
    specification, Hibernate retains its native API for both backward compatibility
    and to accommodate non-standard features.


    Even if it''s best to adhere to the JPA specification, in reality, JPA providers
    offer additional features targeting a high-performance data access layer requirements.
    For this purpose, Hibernate comes with the following non-JPA compliant features:


    +   - extended identifier generators, implementing a HiLo optimizer that is interoperable
    with other database clients

    - transparent statement batching

    - customizable CRUD (@Insert, @SQLUpdate, @SQLDelete) statements

    - static or dynamic filters (e.g. @FilterDef, @Filter, @Where)

    - entity filters (e.g. @Where)

    - mapping properties to SQL fragments (e.g. @Formula)

    - immutable entities (e.g. @Immutable)

    - more flush modes (e.g. FlushMode.MANUAL, FlushMode.ALWAYS)

    - querying the second-level cache by the natural key of a given entity

    - entity-level cache concurrency strategies (e.g Cache(usage = CacheConcurrencyStrategy.READ_WRITE))

    - versioned bulk updates from HQL

    - exclude fields from optimistic locking check (e.g. @OptimisticLock(excluded
    = true))

    - version-less optimistic locking (e.g. OptimisticLockType.ALL, OptimisticLockType.DIRTY)

    - support for skipping (without waiting) pessimistic lock requests.'
