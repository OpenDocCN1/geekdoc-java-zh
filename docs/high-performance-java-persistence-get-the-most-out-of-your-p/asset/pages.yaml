    ![](img/8a123270ec9380e9de699a1d09b2d7ee_114_0.png)


    If the transaction manager supports declarative read-only transactions, the routing
    decision can be taken based on the current transaction read-only preference. Otherwise,
    the routing must be done manually in each service layer component, and so read-only
    transaction uses a read-only DataSource or a read-only JPA PersistenceContext.


    # 7.6 Transaction boundaries


    Every database statement executes in the context of a database transaction, even
    if the client doesn''t explicitly set transaction boundaries. While there might
    be single statement transactions (usually a read-only query), when the unit of
    work consists of multiple SQL statements, the database should wrap them all in
    a single unit of work.


    > By default, every Connection starts in auto-commit mode, each statement executed
    in a separate transaction. Unfortunately, it doesn''t work for multi-statement
    transactions as it moves atomicity boundaries from the logical unit of work to
    each individual statement.


    Auto-commit should be avoided as much as possible, and even for single statement
    transactions, it''s good practice to mark the transaction boundaries explicitly.'
