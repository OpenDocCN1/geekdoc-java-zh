    # 11.3.3.1 @ElementCollection


    Although it''s not an entity type, the @ElementCollection is very similar to the
    unidirectional @OneToMany relationship. To represent collections of basic types
    (e.g. String, int, BigDecimal) or embeddable types, the @ElementCollection must
    be used. If the previous associations involve multiple entities, this time''s
    only a single Post entity with a collection of String comments.


    | | | |

    |---|---|---|n| id | Long |

    | title | String |

    | comments | List<String> |

    | getid() | Long |

    | setid(Long) | void |

    | getTitle() | String |

    | setTitle(String) | void |

    | getComments() | List<String> |


    Figure 11.7: The @ElementCollection relationship


    The mapping for the comments collection looks as follows:


    ```

    private List<String> comments = new ArrayList<>();

    ```


    Value types inherit the persistent state from their parent entities, so their
    lifecycle is bound to the owner entity. Any operation on the entity collection
    is going to be automatically materialized into a DML statement.


    When it comes to adding or removing child records, the @ElementCollection behaves
    like a unidirectional @OneToMany relationship, annotated with CascadeType.ALL
    and orphanRemoval.'
