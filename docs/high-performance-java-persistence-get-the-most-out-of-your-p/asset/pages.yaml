    > *https://dev.mysql.com/doc/refman/5.7/en/constraint-invalid-data-data.html

    *https://dev.mysql.com/doc/refman/5.7/en/sql-mode.html


    # # Consistency as in CAP Theorem


    According to the CAP theorem*, when a distributed system encounters a network
    partition, the system must choose either Consistency (all changes are instantaneously
    applied to all nodes) or Availability (any node can accept a request), but not
    both. In the definition of ACID, consistency is about obeying constraints, in
    the CAP theorem context, consistency refers to linearizability*, which is an isolation
    guarantee instead.


    > *https://en.wikipedia.org/wiki/CAP_theorem

    *http://www.bailis.org/blog/linearizability-versus-serializability/'
