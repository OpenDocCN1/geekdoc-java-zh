  md: '# 9.2.4 DatasourceConnectionProvider


    This provider is chosen when the JPA configuration file defines a non-jta-data-source
    or a jta-data-source element, or when supplying a hibernate.connection.datasource
    configuration property.


    > Unlike other providers, this one is compatible with JTA transactions, which
    are mandatory in Java EE.


    Spring works with both stand-alone JTA transaction managers (e.g. Bitronix or
    Atomikos) and Java EE DataSource(s), and because it offers the best control over
    the actual DataSource configuration, the DatasourceConnectionProvider is the preferred
    choice (even for HikariCP).


    # 9.2.5 Connection release modes


    Hibernate defers the database connection acquisition until the current transaction
    has to execute its first SQL statement (either triggered by a read or a write
    operation). This optimization allows Hibernate to reduce the physical transaction
    interval, therefore increasing the chance of getting a connection from the pool.


    The connection release strategy is controlled through the hibernate.connection.release_mode
    property which can take the following values:


    | Value | Description |

    | --- | --- |

    | after_transaction | Once acquired, the database connection is release only after
    the current transaction commits or rolls back. |

    | after_statement | The connection is released after each statement execution
    and reacquired prior to running the next statement. Although not required by JDBC
    or JTA specifications, this strategy is meant to prevent application servers from
    mistakenly detecting a connection leak between successive EJB (Enterprise Java
    Beans) calls |

    | after | This is the default value, and for RESOURCE_LOCAL transactions it uses
    the after_transaction mode, while for JTA transactions it falls back to after_statement.
    |'
