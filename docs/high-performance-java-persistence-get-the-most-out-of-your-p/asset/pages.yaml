  md: '# Relationships


    From a database perspective, there''s one child table holding both the foreign
    key and the collection element value.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_207_0.png)


    Figure 1.8: The @ElementCollection table relationship


    To persist three comments, the data access layer only has to add to the parent
    entity collection:


    ```

    post.getComments().add("My first review");

    post.getComments().add("My second review");

    post.getComments().add("My third review");

    ```


    Hibernate will issue the insert statements during Persistence Context flushing:


    ```

    INSERT INTO Post_comments (Post_id, comments) VALUES (1, ''My first review'')

    INSERT INTO Post_comments (Post_id, comments) VALUES (1, ''My second review'')

    INSERT INTO Post_comments (Post_id, comments) VALUES (1, ''My third review'')

    ```


    Unfortunately, the remove operation uses the same logic as the unidirectional
    @OneToMany association, so when removing the first collection element:


    ```

    post.getComments().remove(0);

    ```


    Hibernate deletes all the associated child-side records and re-inserts the in-memory
    ones back into the database table:


    ```

    DELETE FROM Post_comments WHERE Post_id = 1

    INSERT INTO Post_comments (Post_id, comments) VALUES (1, ''My second review'')

    INSERT INTO Post_comments (Post_id, comments) VALUES (1, ''My third review'')

    ```


    > In its simplicity, the @ElementCollection is not very efficient for element
    removal. Just like unidirectional @OneToMany collections, the @OrderColumn can
    optimize the removal operation for entries located near the collection tail.'
