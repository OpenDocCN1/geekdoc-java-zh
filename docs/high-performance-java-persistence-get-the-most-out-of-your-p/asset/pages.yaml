  md: '# 4.2.2 Bulk operations


    Apart from batching, SQL offers bulk operations to modify all rows that satisfy
    a given filtering criteria. Bulk update or delete statements can also benefit
    from indexing, just like select statements.


    To update all records from the previous example, one would have to execute the
    following statements:


    ```

    UPDATE post SET version = version + 1;

    UPDATE post_comment SET version = version + 1;

    ```


    Table 4.1: Bulk update time


    | DB_A time (ms) | DB_B time (ms) | DB_C time (ms) | DB_D time (ms) |

    |---|---|---|--|

    | 26 | 13 | 58 | 9 |


    The bulk update is one of magnitude faster than batching, but even so, batch updates
    are more flexible since each row can take a different update logic. Batch updates
    can prevent lost updates if the data access logic employs an optimistic locking
    mechanism.


    With updates, bulk deleting is also much faster than deleting in batches.


    ```

    DELETE FROM post_comment WHERE version > 0;

    DELETE FROM post WHERE version > 0;

    ```


    Table 4.2: Bulk delete time


    | DB_A time (ms) | DB_B time (ms) | DB_C time (ms) | DB_D time (ms) |

    |---|---|---|--|

    | 3 | 12 | 1 | 2 |


    > Bulk processing caveats

    Processing much data in a single transaction can degrade application performance,
    especially in a highly concurrent environment. Whether if using locks (two-phase
    locking) or MVCC (Multiversion Concurrency Control), writes always block other
    conflicting writes. In case the bulk updated records conflict with other concurrent
    transactions, either the bulk update transaction might have to wait for some row-level
    locks to be released or other transactions might wait for the bulk updated rows
    to be committed.'
