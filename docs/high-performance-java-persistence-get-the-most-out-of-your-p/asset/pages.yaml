  md: '# Why JPA and Hibernate matter


    In both examples, the object-relation transformation takes place either implicitly
    or explicitly. In the JDBC use case, the associations must be manually resolved,
    while JPA does it automatically (based on the entity schema).


    # The fetching responsibility


    Besides mapping database columns to entity properties, the entity associations
    can also be represented in terms of object relationships. More, the fetching behavior
    can be hard-wired to the entity schema itself, which is most often a terrible
    thing to do.


    Fetching one-to-many or many-to-many associations is even more problematic because
    they might require a Cartesian Product, and performance becomes tied to the children
    count. Controlling the hard-wired schema fetching policy is cumbersome as it prevents
    overriding an retrieval with a lazy loading mechanism.


    > Each business use case has different data access requirements, and one policy
    anticipate all possible use cases, so the fetching strategy should always be set
    up on a query basis.


    # Prefer projections for read-only views


    Although it is very convenient to fetch entities along with all their associated
    relationships, it''s better to take into consideration the performance impact
    as well. As previously explained, fetching too much data is not suitable because
    it increases the transaction response time.


    In reality, all use cases require loading entities anyway, and not all read operations
    need to be served by the same fetching mechanism. Sometimes a custom projection
    (selecting only a few columns from an entity) is much more suitable, and the data
    access logic can take advantage of database SQL constructs that might not be supported
    by the JPA query abstraction.


    > As a rule of thumb, fetching entities is suitable when the JPA transaction requires
    modifying them, even if that will only happen in a successive web request. With
    this in mind, it is much easier to reason on which fetching mechanism to employ
    for a given business logic use case.'
