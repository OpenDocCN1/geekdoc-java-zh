  md: '# 1. Preface


    In an enterprise system, a properly designed database access layer can have a
    great impact on the overall application performance. According to AppDynamics†


    More than half of application performance bottlenecks originate in the database


    Data is spread across various structures (table rows, index nodes), and database
    records can be read and written by multiple concurrent users. From a concurrency
    point of view, this is a very challenging task, and, to get the most out of a
    persistence layer, the data access logic must resonate with the underlying database
    system.


    | Hibernate specific features |

    | JPA |

    | Type-safe dynamic queries (jOOQ) | Object-relational structural patterns |

    | JDBC |

    | DB specific SQL enhancement | DB specific concurrency control |

    | SQL Standard | Transactions/ACID |


    Figure 1.1: Data access skill stack


    A typical RDBMS (Relational Database Management System) data access layer requires
    mastering various technologies, and the overall enterprise solution is only as
    strong as the team''s weakest skills. Before advancing to higher abstraction layers
    such as ORM (Object-Relational Mapping) frameworks, it''s better to conquer the
    lower layers first.


    > †http://www.appdynamics.com/solutions/database-monitoring/'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# 1.1 The database server and the connectivity layer


    The database manual is not only meant for database administrators. Interacting
    with a database, without knowing how it works, is like driving a racing car without
    taking any driving. Getting familiar with the SQL standard and the database specific
    features can make the difference between a high performance application and one
    that barely crawls.


    The fear of database portability can lead to avoiding highly effective features
    just because they are not interchangeable across database systems. In reality,
    it''s more common to end-up with a sluggish database layer than to port an already
    running system to a new database solution.


    All data access frameworks rely on JDBC (Java Database Connectivity) API for communicating
    with a database server. JDBC offers many performance optimization techniques,
    aiming to reduce response time and accommodate more traffic.


    The first part of the book is therefore dedicated to JDBC, and it covers topics
    such as database connection management, statement batching, result set fetching
    and database transaction essentials.


    # 1.2 The application data access layer


    There are data access patterns that have proven their effectiveness in many enterprise
    application scenarios. Martin Fowler''s Patterns of Enterprise Application Architecture
    is a must read for every enterprise application developer. Beside the object-relational
    mapping pattern, most ORM frameworks also employ techniques such as Unit of Work,
    Identity Map, Lazy Loading, Embedded Value, Inheritance or Optimistic and Pessimistic
    Locking.


    # 1.2.1 The ORM framework


    ORM tools can boost development speed, but the learning curve is undoubtedly steep.
    The only way to address the inherent complexity of bridging relational data with
    the application domain model is to fully understand the ORM framework in use.


    Sometimes the reference documentation might not be enough, and getting familiar
    with the source code is inevitable when facing performance related problems. JPA
    (Java Persistence API) excels in writing data because all DML (Data Manipulation
    Language) statements are automatically updated whenever the persistence model
    changes, speeding up the iterative development process.


    The second part of this book describes Hibernate-specific optimization techniques
    like identifier generators, effective entity fetching and state transitions, application-level
    transactions and entity caching.


    > http://www.amazon.com/Patterns-Enterprise-Application-Architecture-Martin/dp/0321127420'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 1.2.2 The native query builder never meant to substitute SQL, and native
    queries are unavoidable in any


    JPA and Hibernate de-facto non-trivial enterprise application. While JPA makes
    it possible to abstract DML statements and common entity retrieval queries, when
    it comes to reading and processing data, nothing can beat native SQL.


    JPQL (Java Persistence Querying Language) abstracts the common SQL syntax by subtracting
    database specific query features, so it lacks support for Window Functions, Common
    Table Expressions, Derived tables or PIVOT. As opposed to JPA, jOOQ (Java Object
    Oriented Query) embraces database specific query features, and it provides a type-safe
    query builder which can protect the application against SQL injection attacks
    even for dynamic native queries.


    For this reason, the third part of the book is about advance querying techniques
    with jOOQ.


    # Database performance benchmarks


    Throughout this book, there are benchmarks aimed to demonstrate the relative gain
    of a certain performance optimization. The benchmarks results are always dependent
    on the underlying hardware, operating system and database server configuration,
    database size and concurrency patterns. For this reason, the absolute values are
    not as important as the relative optimization gain. In reality, the most relevant
    benchmark results are the ones as the actual production system anyway.


    To prevent the reader from comparing one database against another and drawing
    a wrong conclusion based on use case specific benchmarks, the database names are
    obfuscated as DB_A, DB_B, DB_C and DB_D.


    > All the source code, for every example that was used in this book, is available
    on GitHub.


    http://www.jooq.org/'
  merge: -1
