  md: 'Why JPA Hibernate matter


    # 8.3 Schema ownership


    Because of data representation duality, there has been a rivalry between taking
    ownership of the underlying schema. Although, theoretically, both the database
    and the Domain Model could drive the schema evolution, for practical reasons,
    the schema belongs to the database.


    An enterprise system might be too large to fit into a single application, so it''s
    not uncommon to split into multiple subsystems, each serving a specific goal.
    As an example, there can be front-end web applications, integration web-services,
    email schedulers, full-text search engines and back-end batch processors that
    need to load data into the system. All these subsystems need to use the underlying
    database, whether it is for displaying content, or dumping data into the system.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_131_0.png)


    Figure 8.2: Database-centric integration


    Although it might not fit any enterprise system, having the database as a central
    integration point still be a choice for many reasonable size enterprise systems.


    The relational database concurrency models offer strong consistency guarantees,
    therefore having a significant advantage to application development. If the integration
    point doesn''t provide transactional semantics, it''s much more difficult to implement
    a distributed concurrency control mechanism.


    Most database systems already offer support for various replication topologies,
    which can provide more capacity for accommodating an increase in the incoming
    request traffic. Even if the demand for more data continues to grow, hardware
    is always getting better and (and cheaper too), and database vendors keep on improving
    their engines to cope with more data.


    For these reasons, having the database as an integration point is still a relevant
    enterprise system design consideration.'
