  md: '# 12.2 Join table


    The join table inheritance resembles the Domain Model class diagram since each
    class is mapped to an individual table. The subclass tables have a foreign key
    column referencing the base class primary key.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_232_0.png)


    To use this inheritance strategy, the Topic entity must be annotated with:


    ```

    @Inheritance(strategy = InheritanceType.JOINED)

    ```


    > The Post and the Announcement entities can use a @PrimaryKeyJoinColumn mapping
    to define the base class foreign key column.


    By default, the subclass table primary key column is used as a foreign key as
    well.'
