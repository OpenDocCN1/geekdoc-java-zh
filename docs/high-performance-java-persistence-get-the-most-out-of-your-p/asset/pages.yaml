  md: '# MySQL cluster auto-sharding


    MySQL Cluster* offers automatic sharding, so data is evenly distributed (using
    a primary key hashing function) over multiple commodity hardware machines. Every
    node accepts both read and write transactions, just like Multi-Master replication,
    conflicts are automatically discovered and resolved.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_22_0.png)


    Figure 2.5: Auto-sharding


    The auto-sharding topology is similar to the Multi-Master replication architecture
    as it can increase throughput by distributing incoming load to multiple machines.
    While in a Multi-Master replicated environment every node stores the whole database,
    the auto-sharding cluster distributes data so that each shard is only a subset
    of the whole database.


    Because the cluster takes care of distributing data, the application doesn''t
    have to provide a data shard routing layer, and SQL joins are possible even across
    different shards. MySQL Cluster 7.3 uses the NDB storage engine, and it lacks
    some features provided by InnoDB* like multiple transaction isolation levels or
    MVCC (Multi Version Concurrency Control).


