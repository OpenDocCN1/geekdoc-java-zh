    The first sequence call is for the first three values, while the second one is
    generated when reaching the entity that needs to be persisted. The more inserts
    a transaction requires, the better the performance gain from reducing the number
    of database sequence calls.


    > Unfortunately, this optimizer has a major limitation. Because the database sequence
    only assigns group values, all database clients must be aware of this algorithm.
    If the DBA must insert a row in the aforementioned table, he must use the hi/lo
    algorithm to determine the range of values that he can safely use.

    For this reason, Hibernate offers other optimizer algorithms that are interoperable
    with external clients, unaware of the application-level optimization technique
    in-use.


    # 10.2.3.4.2 The default sequence identifier generator


    The JPA identifier generator strategy only specifies the identifier type and not
    the algorithm for generating such identifiers.


    For the sequence generator, considering the following JPA mapping:


    ```

    @Id

    @GeneratedValue(generator = "sequence", strategy=GenerationType.SEQUENCE)

    @SequenceGenerator(name = "sequence", allocationSize = 3)

    private Long id;

    ```


    Hibernate will choose the SequenceHiLoGenerator when the hibernate.id.new_generator_mapping
    property is false. This was the default setting for Hibernate 3 and 4. The SequenceHiLoGenerator
    uses the hi/lo algorithm, and, if the allocation size is greater than one, database
    interoperability could be compromised (every insert must be done according to
    the hi/lo rules).


    If the aforementioned configuration is true (the default setting for Hibernate
    5), then the JPA mapping above will use the SequenceStyleGenerator instead.


    Unlike its previous predecessor, the SequenceStyleGenerator uses configurable
    identifier optimizer strategies, and the application developer can even supply
    its own optimization implementation.'
