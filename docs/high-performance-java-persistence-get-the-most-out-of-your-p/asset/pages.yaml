  md: '# Oracle


    There is no UUID type in Oracle, so a RAW(16) column must be used instead. The
    [SYS_GUID()]* database function can generate a globally unique identifier.


    ^[1](http://docs.oracle.com/database/121/SQLLRF/functions2012.htm#SQLLRF)


    # SQL Server


    The [uniqueidentifier]* data type is used for storing GUID identifiers. The [NEWID()]*
    function can generate a UUID compatible with the RFC 4122 standard.


    +   Because by default SQL Server uses clustered indexes for primary keys, to
    avoid the fragmentation effect, the NEWSEQUENTIALID()* can assign pseudo-sequential
    UUID numbers (greater than previously generated ones). This guarantee is kept
    as long as the Windows is not restarted.


    ^[2](https://msdn.microsoft.com/en-us/library/ms18792.aspx)

    ^[3](https://msdn.microsoft.com/en-us/library/ms190348.aspx)


    # PostgreSQL


    The [UUID type]* can store RFC 4122 compliant unique identifiers. The database
    doesn''t offer a built-in UUID generation function, so the identifier must be
    generated by the data access layer.


    ^[4](http://www.postgresql.org/docs/9.5/static/datatype-uuid.html)


    # MySQL


    The UUID must be stored in a BINARY(16) column type. The [UUID()]* functions can
    generate a 128-bit unique identifier. Because the UUID() function might cause
    problems for statement-based replication, passing the identifier [as a variable]*5
    is a workaround to this limitation.


    ^[5](http://dev.mysql.com/doc/refman/5.7/en/miscellaneous-functions.html#function_uuid)

    ^[6](https://dev.mysql.com/doc/refman/5.7/en/replication-features-functions.html)'
