  md: '# Inheritance


    222


    The Board entity can map a bidirectional @OneToMany relationship as follows:


    ```

    @OneToMany(mappedBy = "board")nprivate List<Topic> topics = new ArrayList<>();

    ```


    Fetching the collection lazily generates a separate select, identical to the aforementioned

    Entity query. When fetching the collection eagerly, Hibernate requires a single
    table.


    ```

    Board board = entityManager.createQuery(

    n  "select b from Board b fetch b.topics where b.id = :id", Board.class)

    .setParameter("id", id)

    .getSingleResult();

    ```


    ```

    SELECT b.id AS id1_0_, t.id AS id2_1_, b.name AS name2_0_,

    t.board_id AS id8_1_1_, t.createdAt AS created03_1_,

    t.owner AS owner4_1_, t.title AS title5_1_, t.content AS content6_1_,

    t.validUntil AS valid8_1_, t.DTYPE AS DTYPE1_1_,

    t.board_id AS board_id_0_, t.id AS id2_0__

    FROM board b

    INNER JOIN topic t ON b.id = t.board_id

    WHERE b.id = 1

    ```


    # Performance and data integrity considerations


    Since only one table is used for storing entities, both read and write operations
    are fast. Even when

    using a @ManyToMany or a @OneToMany base class association, Hibernate needs a
    single join between

    the child-side table (e.g. topic_statistics) and the parent-side (e.g. topic).
    The @OneToMany

    base class relationship is also efficient since it generates a secondary select
    or a single

    child-parent table.


    Because subclass properties are collected in a single table, NULL constraints
    are not allowed for

    columns for subclasses. Being automatically inherited by all subclasses, the base

    class properties may be non-nullable. From a data integrity perspective, this
    limitation defines

    the purpose of Consistency (gu the ACID properties).


    Nevertheless, the data integrity rules can be enforced through database trigger
    procedures (a

    column non-nullability is acknowledged based on the class discriminator). Another
    approach is

    to move the check into the data access layer. Bean Validation can validate @NotNull
    properties at

    runtime. JPA also defines callback methods (e.g @PreUpdate, @PreUpdate) as well
    as entity listeners

    (e.g. @EntityListeners) which can throw an exception when a non-null constraint
    is violated.'
