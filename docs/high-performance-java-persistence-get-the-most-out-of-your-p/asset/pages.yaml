  md: '# 11. Relationships


    In a relational database, associations are formed by correlating rows belonging
    to different tables. A relationship is established when a child table defines
    a foreign key referencing the primary key of its parent table. Every database
    association is built on top of foreign keys, resulting three table relationship
    types:


    +   - one-to-many is the most common relationship and associates a row from a
    parent table to multiple rows in a child table

    - one-to-one is a variation of the one-to-many relationship with an additional
    uniqueness constraint on the child-side foreign key

    - many-to-many requires a junction table containing two foreign keys that reference
    two different tables.


    The following diagram depicts all three table relationships:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_194_0.png)


    Figure 11.1: Table relationships because a post row might be referenced by multiple
    comments.


    The post table has a one-to-many relationship with the post_comment. The one-to-many
    relationship is established through the post_id column which has a foreign key
    referencing the post table primary key. Because the post_comment cannot exist
    without post, the post is the parent-side while the post_comment is the child-side.


    The post table has a one-to-one relationship with the post_details. Like the one-to-many
    association, the one-to-one relationship involves two tables and a foreign key.
    The foreign key has a uniqueness constraint, so only one row can reference a parent
    record.'
