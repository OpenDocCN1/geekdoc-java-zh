  md: '# SQL Server


    Like Oracle, the read-only Connection doesn''t propagate to the database engine,
    and the only way to disable SQL modifications is to use a separate account, restricted
    to viewing data only.


    Setting the ApplicationIntent=ReadOnly* connection property doesn''t prevent the
    JDBC driver from executing modifying statements on a read-only Connection. This
    property has the purpose of routing read-write and read-only connections to replica
    nodes instead.


    > *https://msdn.microsoft.com/en-us/library/gg7149a.aspx


    # PostgreSQL


    An exception is thrown when executing a statement on a Connection whose read-only
    status was set to true.


    The database engine optimizes read-only transactions so the false-positives anomaly
    rate is reduced for the Serializable isolation level, and it allows deferrable
    serializable snapshots\*. A deferrable snapshot is activated when executing SET
    TRANSACTION SERIALIZABLE READ ONLY DEFERABLE. The current transaction must wait
    for a safe snapshot to become available, which can be executed without the risk
    of being aborted by a non-serializable anomaly. If the default read-write Serializable
    transactions are problematic when accessing large volumes of data, the deferrable
    snapshots might be a better alternative for long-running transactions.


    > *http://arxiv.org/pdf/1208.4179.pdf


    # MySQL


    If a modifying statement is executed when the Connection is set to read-only,
    the JDBC driver throws an exception.


    InnoDB can optimize read-only transactions\* because it can skip the transaction
    ID generation as it''s not required for read-only transactions.


    > *https://dev.mysql.com/doc/refman/5.7/en/innodb-performance-ro-txn.html'
