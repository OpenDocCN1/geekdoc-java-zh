    # 11.5 @ManyToMany


    @ManyToMany relationship is the trickiest of all JPA relationships as the remaining
    of this chapter will demonstrate. Like the @ToOne relationship, the @ManyToMany
    association can be either unidirectional or bidirectional. From a database perspective,
    the @ManyToMany association mirrors many-to-many table relationship:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_215_0.png)


    Figure 11:13: The many-to-many table relationship


