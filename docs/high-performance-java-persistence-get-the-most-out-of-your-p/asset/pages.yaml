  md: '# Inheritance best practices


    All the aforementioned inheritance mapping models require trading something in
    order to accommodate the impedance mismatch between the relational database system
    and the object-oriented Domain Model.


    The default single table inheritance performs the best in terms of reading and
    writing data, but it forces the application developer to overcome the column nullability
    limitation. This strategy is useful when the database can provide support for
    trigger procedures and the number of subclasses is relatively small.


    The join table is worth considering when the number of subclasses is higher and
    the data access layer doesn''t require polymorphic queries. When the number of
    subclass tables is large, polymorphic queries will require many joins, and fetching
    such a result set will have an impact on application performance. This issue can
    be mitigated by restricting the result set (e.g. pagination), but that only applies
    to queries and not to @ManyToMany or @ManyToOne associations. On the other hand,
    polymorphic @ManyToOne and @OneToOne associations are fine since, in spite of
    joining multiple tables, the result set can have at most one record.


    Table-per-class is the least effective when it comes to polymorphic queries or
    associations. If each subclass is stored in a separate database table, the @mappedSuperclass
    Domain Model inheritance is often a better alternative anyway.


    > Although a powerful concept, Domain Model inheritance should be used sparingly
    and when the benefits supersede trade-offs.'
