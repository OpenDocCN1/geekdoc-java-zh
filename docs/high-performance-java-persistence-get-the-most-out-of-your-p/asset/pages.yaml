  md: "# Connection Management and Monitoring\n\nThe StatisticsImplementor interface\
    \ defines the contract between the Hibernate internal API and the various custom\
    \ statistics gathering implementations. For simplicity sake, the following StatisticsImplementor\
    \ interface implementation extends the default ConcurrentStatisticsImpl, as it\
    \ needs to override the connect() and the endTransaction(boolean success) callback\
    \ methods.\n\n```\npublic class TransactionStatistics extends ConcurrentStatisticsImpl\
    \ {\n    private ConcurrentMap<Long, Long> transactionStartNanos =\n        new\
    \ ConcurrentHashMap<>();\n    private ConcurrentMap<Long, AtomicLong> connectionCounter\
    \ =\n        new ConcurrentHashMap<>();\n    private StatisticsReport report =\
    \ new StatisticsReport();\n\n    @Override\n    public void connect() {\n    \
    \    long threadId = Thread.currentThread().getId();\n        AtomicLong counter\
    \ = connectionCounter.get(threadId);\n        if (counter == null) {\n       \
    \     counter = new AtomicLong();\n            connectionCounter.put(threadId,\
    \ counter);\n        }\n        counter.incrementAndGet();\n        transactionStartNanos.putIfAbsent(threadId,\
    \ System.nanoTime());\n        super.connect();\n    }\n\n    @Override\n    public\
    \ void endTransaction(boolean success) {\n        long threadId = Thread.currentThread().getId();\n\
    \        long startNanos = transactionStartNanos.remove(threadId);\n        if\
    \ (startNanos != null) {\n            report.transactionTime(System.nanoTime()\
    \ - startNanos);\n        }\n        AtomicLong connectionCounter = this.connectionCounter.remove(threadId);\n\
    \        if (connectionCounter != null) {\n            report.connectionCount(connectionCounter.longValue());\n\
    \        }\n        report.generate();\n        super.endTransaction(success);\n\
    \    }\n}\n```\n\nBecause the StatisticsImplementor is a singleton instance, therefore\
    \ being accessed by multiple concurrent running Sessions(s), the context correlation\
    \ is based on the current running Thread identifier. When a transaction ends,\
    \ the report is generated, and both the physical transaction time and the number\
    \ of connections (issued during a particular transaction) are flushed to the log."
