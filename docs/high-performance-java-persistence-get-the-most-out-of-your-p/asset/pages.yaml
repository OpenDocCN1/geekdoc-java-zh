  md: "# Mapping Types and Identifiers\n\naddress needs at most 18 bytes. (e.g. 0.0.0.0/0)\
    \ taking 9 characters, the VARCHAR(18) approach requires between 9 and 18 characters\
    \ for each IPv4 address.\n\nThe inetype is specially designed for IPv4 and IPv6\
    \ network addresses, and it also supports various network address specific operators\
    \ (e.g. <, >, &&), as well as other address transforming functions (e.g. host(inet),\
    \ netmask(inet)). As opposed to the VARCHAR(18) approach, the inetype requires\
    \ only 7 bytes for each IPv4 address.\n\nFor it has more compact size (the index\
    \ can fit into memory) and supporting many specific operators, the inet type is\
    \ a much more attractive choice. Although, by default, Hibernate doesn't support\
    \ inet types, adding a Hibernate Type is a straightforward task. The IPv4 address\
    \ is encapsulated in its own wrapper, which can also define various address manipulation\
    \ functions.\n\n```\npublic class IPv4 implements Serializable {\n    private\
    \ final String address;\n\n    public IPv4(String address) {\n        this.address\
    \ = address;\n    }\n\n    public String getAddress() {\n        return address;\n\
    \    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this\
    \ == o) return true;\n        if (o == null || getClass() != o.getClass()) return\
    \ false;\n        return Objects.equals(o, IPv4.class.cast(o).address);\n    }\n\
    \n    @Override\n    public int hashCode() {\n        return Objects.hash(address);\n\
    \    }\n\n    public InetAddress toInetAddress() throws UnknownHostException {\n\
    \        return Inet4Address.getByName(address);\n    }\n}\n```\n\nWhen an entity\
    \ wants to change an IPv4 field, it must provide a new object instance. An immutable\
    \ type is much easier to handle since its internal state doesn't change throughout\
    \ the current running Persistence Context."
