  md: "# 4. Batch Updates\n\nJDBC 2.0 introduced batch updates, so that multiple DML\
    \ statements can be grouped into a single database request. Sending multiple statements\
    \ in a single request reduces the number of database roundtrips, decreasing transaction\
    \ response time. Even if the reference specification used the terms updates, any\
    \ insert, update or delete statement can be batched, and JDBC supports batching\
    \ for java.sql.Statement, java.sql.PreparedStatement and java.sql.CallableStatement\
    \ too.\n\nNot only each database driver distinct, but even different versions\
    \ of the same driver might require implementation-specific configurations.\n\n\
    # 4.1 Batching Statements\n\nFor executing static SQL statements, JDBC defines\
    \ the Statement interface and batching multiple DML statements is straightforward\
    \ as the following code snippet\n\n```\nstatement.addBatch(\n  \"INSERT INTO post\
    \ (title, version, id)\" + \\\n  \"VALUES (Post no. 1', 0, 1)\");\n\nstatement.addBatch(\n\
    \  \"INSERT INTO post_comment (post_id, review, version, id)\" + \\\n  \"VALUES\
    \ (1, Post comment 1.1', 0, 1)\");\n\nint[] updateCounts = statement.executeBatch();\n\
    ```\n\nThe number of database rows affected by each statement is included in the\
    \ return value of the executeBatch() method.\n\n> OraclenFor Statement and CallableStatement,\
    \ the Oracle JDBC Driver doesn't actually support batching\nFor anything but PreparedStatement,\
    \ the driver ignores batching, and each statement is executed separately.\n\n\
    http://docs.oracle.com/cd/E1182_01/java.112/e16548/oracleapt.html#JDBC28752"
