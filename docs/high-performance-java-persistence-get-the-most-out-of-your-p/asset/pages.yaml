  md: 'Relationships


    The PostDetails@OneToOne mapping is changed as follows:


    ```

    @OneToOne

    @MapsId

    private Post post;

    ```


    This time, the table relationship doesn''t feature any additional foreign key
    column since the post_details table primary key references the post table primary
    key:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_212_0.png)


    Figure 11.11: The shared key one-to-one


    Because PostDetails has the same identifier as the parent entity, it can be fetched
    without having to write a JPQL query.


    ```

    PostDetails details = entityManager.find(PostDetails.class, post.getId());

    ```


    # The shared primary key efficiency


    First of all, the shared primary key approach reduces the memory footprint of
    the child-table indices since it requires a single indexed column instead of two.
    The more records a child table has, the better the improvement gain for reducing
    the number of indexed columns.


    More, the child can now be simply retrieved from the second-level cache, therefore
    preventing a database hit. In the previous example, because the child identifier
    was not known, a query was inevitable. To optimize the previous use, the query
    cache would be required as well, but the query cache is not without issues either.


    > Because of the reduced memory footprint and enabling the second-level cache
    retrieval, the JPA 2.0 derived identifier is the preferred @OneToOne mapping strategy.
    The shared primary key is not limited to unidirectional associations, being available
    for bidirectional @OneToOne relationships as well.'
