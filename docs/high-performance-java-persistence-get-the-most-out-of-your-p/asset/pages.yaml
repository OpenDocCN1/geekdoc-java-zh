  md: "# Oracle auto-generated retrieval gotcha\n\nWhen using Statement.RETURN_GENERATED_KEYS,\
    \ Oracle returns a ROWID instead of the actual generated column value. A workaround\
    \ is to supply the column index or column name, and so the auto-generated value\
    \ can be extracted after executing the statement.\n\nAccording to the JDBC 4.2\
    \ specification, every driver must implement the supportsGetGeneratedKeys() method\
    \ and specify whether it supports auto-generated retrieval. Unfortunately, this\
    \ only applies to single statement updates as the specification does not make\
    \ it mandatory for drivers to support auto-generated key retrieval for batch statements.\
    \ That being said, not all database systems support auto-generated keys from a\
    \ batch of statements.\n\nTable 4.3: Driver support for retrieving keys\n\n| Returns\
    \ keys after calling | Oracle JDBC driver | Oracle JDBC driver | SQL Server JDBC\
    \ driver | PostgreSQL JDBC driver | MySQL JDBC driver |\n|---|---|---|---|---||\n\
    | executeUpdate() | Yes (11.2.0.4) | Yes (12.1.0.1) | No (4.2) | Yes (9.4-1201-jdbc41)\
    \ | Yes |\n| executeBatch() | Yes | Yes | No | Yes | Yes |\n\nIf the JDBC driver\
    \ 11.2.0.4 cannot retrieve auto-generated batch keys, the 12.1.0.1 version works\
    \ fine. When trying to get the auto-generated batch keys, the SQL Server JDBC\
    \ driver throws this: The statement must be executed before any results can be\
    \ obtained.\n\n# 4.3.1 Sequences to the rescue\n\nAs opposed to identity columns,\
    \ database sequences offer the advantage of decoupling the identifier generation\
    \ from the actual row. To use of batch inserts, the identifier must be fetched\
    \ prior to setting the statement parameter values.\n\n```\nprivate long getNextSequenceValue(Connection\
    \ connection)\nthrows SQLException {\n    try(Statement statement = connection.createStatement())\
    \ {\n        try(ResultSet resultSet = statement.executeQuery(\n            callSequenceSyntax());\n\
    \            resultSet.next();\n            return resultSet.getLong(1);\n   \
    \     )\n    }\n}\n```"
