  md: '# SQL Server


    SQL Server always caches execution plans for JDBC Statement(s) and PreparedStatement(s).
    The execution plans are stored in the procedure cache region and they are evicted
    only when the in-memory storage starts out of space.


    Even if SQL Server supports plain statements forced parametrization, preparing
    statements remains the most effective way to increase the likelihood of an execution
    cache hit.


    The catch is that all prepared statements should use the qualified object name,
    thus the schema must always precede the table name.


    So, instead of a query like this:


    ```

    SELECT * FROM task WHERE status = ?;

    ```


    the data access layer should always append the schema to all table names:


    ```

    SELECT * FROM etl.task WHERE status = ?;

    ```


    Without specifying the database object schema, the cache cannot determine statistics
    to consider when analyzing the effectiveness of a given execution plan.


    SQL Server inspects the actual parameter values during the first execution of
    a prepared statement. This process is called parameter sniffing, and its effectiveness
    is relative to predicate value distribution.


    The database engine monitors execution times, and if the existing cache plan doesn''t
    perform efficiently or if the underlying table structure or data distribution
    statistics undergo a conflicting change, the database recompiles the execution
    plan according to the new parameter values.


    For skewed data, reusing plans might be suboptimal, and recompiling plans on every
    execution could be a better alternative. To address the parameter sniffing limitations,
    SQL Server offers the OPTION (RECOMPILE) so the statement can cache and generate
    a fresh plan on every execution.


    ```

    SELECT * FROM task WHERE status = ? OPTION(RECOMPILE);

    ```


    +   https://technet.microsoft.com/en-us/library/ms181055%28v=sql.100%29.aspx


    +   https://msdn.microsoft.com/en-us/library/ms181714.aspx'
