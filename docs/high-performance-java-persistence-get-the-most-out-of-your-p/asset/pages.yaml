  md: '# Inheritance


    218


    > Another approach would be to add this relationship into the Topic class, and
    the topic rows would then reference the topic_statistics records. For the sake
    of demonstrating how entity association polymorphism works, the TopicStatistics
    was chosen to be the child-side.


    As natural as this Domain Model may be represented in an object-oriented programming
    language, transposing it to a relational database is anything but straightforward.
    Relational database systems do not support inheritance, relying on tuples and
    relational algebra for representing and manipulating data. For this reason, mapping
    inheritance in a relational database is one of the most obvious object-relational
    impedance mismatch.


    Without native support from the database system, inheritance can only be emulated
    through table relations. In the Patterns of Enterprise Application Architecture
    book, Martin Fowler defines three ways of mapping inheritance into a relational
    database:


    +   * Single Table Inheritance*, which uses a single table to represent all classes
    in a given inheritance hierarchy

    * Class Table Inheritance*, which maps each class to a table, and the inheritance
    association is resolved through table joins

    * Concrete Table Inheritance*, where each table defines all fields that are either
    defined in the subclass or inherited from a super class.


    The JPA specification defines all three inheritance mapping models through the
    following strategies:


    +   * InheritanceType.SINGLE_TABLE

    * InheritanceType.JOINED

    * InheritanceType.TABLE_PER_CLASS


    JPA also covers the case when inheritance is only available in the Domain Model,
    without being mirrored in the database (e.g. @MappedSuperclass).


    When the data access layer implements functionality without support from the underlying
    database system, care must be taken to ensure that application performance is
    not compromised. This chapter aims to analyze what trade-offs are required for
    employing inheritance as well as its impact on application performance.


    http://martinfower.com/eaCatalog/SingleTableInheritance.html

    http://martinfower.com/eaCatalog/classTableInheritance.html

    http://martinfower.com/eaCatalog/concreteTableInheritance.html'
