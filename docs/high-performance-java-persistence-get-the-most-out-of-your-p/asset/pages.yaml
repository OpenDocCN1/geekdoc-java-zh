- img_proc: true
  md: '# Relationships


    The post and the tag are both independent tables and neither one is a child of
    the other. A post can feature several tag(s), while a tag can also be associated
    with multiple post(s). This is a typical many-to-many association and it requires
    a junction table to resolve the child-side of these two parent entities. The junction
    table requires two foreign keys referencing the parent tables.


    > The foreign key is therefore the most important construct in building a table
    relationship, and in a relation database, the child-side controls a table relationship.


    In a relational database, the foreign key is associated with the child-side only.
    For this reason, the parent-side has no knowledge of any associated child relationships,
    and from a mapping perspective, table relationships are unidirectional (the foreign
    key references the parent primary key).


    # 11.1 Relationship types


    When mapping a JPA entity, the developer map entities either in one direction
    or in a bidirectional way. This is another impedance mismatch between the object-oriented
    Domain Model and relational database system because, when using an ORM tool, the
    parent and child-side reference each other.


    A relationship is unidirectional if only one entity maps the table relationship
    and is bidirectional if the table relationship can be navigated in both directions
    (either from the entity-side or the child-side).


    To properly represent both sides of an entity relationship, JPA defines four association
    mapping constructs:


    +   * @ManyToOne represents the child-side (where the foreign key resides) in
    a database one-to-many table relationship

    * @OneToOne is associated with the parent-side of a one-to-many table relationship

    * @ElementCollection defines a one-to-many association between an entity and multiple
    value types (basic or embeddable)

    * @OneToOne is used for both the child-side and the parent-side in a one-to-one
    table relationship

    * @ManyToMany mirrors a many-to-many table relationship.


    Because the entity relationship choice has a considerable impact on the overall
    application performance, this chapter analyses the data access operation efficiency
    of all these JPA associations.'
  merge: -1
