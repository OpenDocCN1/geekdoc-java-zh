  md: '# 11.4 @OneToOne


    From a database perspective, the one-to-one association is based on a foreign
    key that’s constrained

    to be unique. This, a parent row can be referenced by at most one child record
    only.


    In JPA, the @OneToOne relationship can be either unidirectional or bidirectional.


    # 11.4.1 Unidirectional


    In the following example, the Post entity represents the parent-side, while the
    PostDetails is

    child-side of the one-to-one association.


    As already mentioned, the JPA entity relationship diagram matches exactly the
    one-to-one table

    relationship.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_210_0.png)


    Figure 11.9: The one-to-one table relationship


    Even from the Domain Model side, the unidirectional @OneToOne relationship is
    strikingly similar

    to the unidirectional @ManyToOne association.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_210_1.png)


    Figure 11.10: The unidirectional @OneToOne relationship'
