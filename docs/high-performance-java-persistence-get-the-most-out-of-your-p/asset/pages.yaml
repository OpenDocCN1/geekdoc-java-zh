    rows, while others perform very well when deleting data.


    Compared to the previous Statement batch insert results, it''s clear that, for
    the same data load, the PreparedStatement use performs just better.


    For dynamic statements, PreparedStatement provides better performance (when enabling
    batching) and stronger security guarantees. Most ORM use prepared statements,
    and since entities are inserted/updated/deleted individually, each can take advantage
    of batching.


    # ### 4.2.1 Choosing the right batch size


    Finding the right batch size is not a trivial thing to do as there is no mathematical
    equation to solve the appropriate batch size for any enterprise application.


    Like any other performance optimization technique, measuring the application performance
    gain in response to a certain batch size value remains the most reliable tuning
    option.


    The astute reader has already figured out that even a low batch size can reduce
    the transaction response time, and the performance doesn''t grow linearly with
    batch size. Although a larger batch value can save more database roundtrips, the
    overall performance gain remains relatively flat and can even drop for larger
    batch sizes.


    As a rule of thumb you should always measure the performance improvement for various
    batch sizes. In practice, a relatively low value (between 10 and 30) is usually
    a good choice.'
