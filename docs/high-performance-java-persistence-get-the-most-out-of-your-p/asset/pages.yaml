  md: '# 7.4 Durability


    When purchasing an airline ticket, the money is withdrawn from the bank account
    and a seat is reserved for the given buyer. Assuming that, right after the ticket
    is purchased, the airline reservation system crashes, all the previously processed
    transactions must hold true even after the system restarts. If the system doesn''t
    enforce this requirement, the registered ticket might vanish, and the buyer is
    possibly left with a debit account and no ticket at all.


    > Durability ensures that all committed transaction changes become permanent.


    Durability allows system recoverability, and, to some extent, it''s similar to
    the rolling back mechanism.


    # What about undo logs?


    To support transaction rollbacks and to rebuild previous versions in MVCC systems,
    the database already reads the current modifications (including uncommitted changes)
    in the undo log. For recoverability needs committed changes only, and the obsolete
    undo segments might be frequently recycled, the undo log alone is not suitable
    for recoverability.


    When a transaction is committed, the database persists all current changes in
    an append-only, sequential data structure commonly known as the redo log.


    # Oracle


    The redo log consists of multiple redo records, each containing change vectors,
    which capture the actual data blocks. For performance reasons, the redo records
    are stored in a buffer and the Log Writer flushes the in-memory records to the
    active redo log file. At any given time, Oracle has at least two redo files, but
    only one of them is active and available for collecting the log buffer entries.
    When a transaction is committed, the database flushes the, and changes becomes.


    > If the buffer fills, Oracle flushes it with any uncommitted changes, which can
    be removed if their associated transaction is rolled back.


    *https://docs.oracle.com/database/121/ADMIN/onlinedo.htm#ADMIN11302'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# SQL Server


    Unlike Oracle, SQL Server combines both the undo log and the redo log into a single
    data structure (transaction log). By default, when a transaction is committed,
    all the associated transaction log entries are flushed to the disk before returning
    the control back to the client.


    SQL Server 2014 added support for configurable durability*. The log entry flushing
    can be delayed, which can provide better I/O utilization and lower transaction
    response times. If the system crashes, all unflushed log entries are wiped out
    from memory. Asynchronous flushing is therefore appropriate only when data loss
    is tolerated.


    # PostgreSQL


    Statement changes are captured in the Write-Ahead Log (WAL)*. The log entries
    are buffered in memory and flushed on every transaction commit.


    The cached data pages and index entries need not be flushed for every transaction
    (therefore optimizing I/O utilization), because their state can be restored from
    the WAL during recovery. Ever since 9.1*, PostgreSQL supports configurable durability,
    so the WAL can also be flushed asynchronously.


    > *http://www.postgresql.org/docs/9.5/static/wal-intro.html


    # MySQL


    All the redo log entries associated with a single transaction are stored in the
    mini transaction buffer and flushed at once the global redo buffer. The global
    buffer is flushed to disk during commit. By default, there are two log files which
    are used alternatively.


    Flushing is done synchronously by default, but it can be switched to an asynchronous
    mode via the innodb_flush_log_at_trx_commit*parameter.'
