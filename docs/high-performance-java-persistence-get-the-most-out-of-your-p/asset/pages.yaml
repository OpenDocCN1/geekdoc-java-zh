    No matter how powerful it might be, one dedicated server is still a single point
    of failure, throughput drops to zero if the system is no longer available. Database
    replication is therefore not an option in most enterprise systems.


    # 2.3.1 Master-Slave replication


    For enterprise systems where the read/write ratio is high, a Master-Slave replication
    scheme is suitable for increasing availability.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_18_0.png)


    Figure 2.2: Master-Slave replication


    The Master is the system of record and the only node accepting writes. All changes
    recorded by the Master node are replayed to Slaves as well. A binary replication
    uses the Master node WAL (Write Ahead Log), while a statement-based replication
    on the Slave makes the exact statements executed on Master.


    Asynchronous replication is very common, especially when there are more Slave
    nodes to update. The Slave nodes are eventual consistent as they lag behind the
    Master. In case the Master node crashes, a cluster-wide voting process must elect
    the new Master (usually the node with the most recent update) from the list of
    all available Slaves.


    > ³https://www.facebook.com/node.php?node_id=40988125919

