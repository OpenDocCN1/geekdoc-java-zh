  md: '> Being RFC 4122 compliant and able to operate with BINARY column type, the
    UUIDGenerator is preferred over the legacy UUIDHexGenerator.


    # 10.2.3 Numerical identifiers


    As previously explained, a numerical surrogate key is usually preferred since
    it takes less space and indexes work better with sequential identifiers. To generate
    numerical identifiers, most database systems either offer identity (auto_increment)
    columns or sequence objects.


    JPA defines the GenerationType? enumeration for all supported identifier generator
    types:


    +   - IDENTITY is mapping the entity to a database column

    - SEQUENCE allocates identifiers by calling a given database sequence

    - TABLE is for relational databases that do not support sequences (e.g MySQL 5.7),
    the table generator emulating a database sequence by using a separate table

    - AUTO decides the identifier generation strategy based on the current database
    dialect.


    > As explained in the JDBC part, database sequences work better with batch updates
    and allow various application-side optimization techniques as well.


    # 10.2.3.1 Identity generator


    The identity column type (included in the SQL:2003*) is supported by Oracle 12c*,
    SQL Server12 and MySQL (AUTO_INCREMENT)*, and it allows an integer or a bigint
    column to be auto-incremented on demand.


    The increment process is very efficient since it uses a lightweight mechanism,
    opposed to the more heavyweight transactional coarse-grain locks. One drawback
    is that the newly assigned value can only be known after executing the actual
    insert statement.


    *docs.oracle.com/javaee/7/api/persistence/GenerationType.html

    *https://en.wikipedia.org/wiki/SQL2003

    *http://doc.oracle.com/cd/E16505/user/121/e17209/statements_7002.html#CJAHHJC

    *http://mada.microsoft.com/en-us/library/ma18675.aspx

    *http://dev.mysql.com/doc/refman/5.7/en/example-increment.html'
