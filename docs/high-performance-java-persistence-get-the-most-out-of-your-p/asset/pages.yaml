  md: '# 10.2.3.4.5 The pooled-lo optimizer


    By changing the previous mapping to use the pooled-lo optimizer, the identifier
    generation changes as follows:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_189_0.png)


    Figure 10.4: The pooled-lo optimizer


    If increment size (n) is the number of identifiers within a range, the pooled-lo
    optimizer generates identifiers with the following formula: $id = [lo, (lo + n)
    - 1]$.


    +   - the first sequence calls the lo value, so the first range of identifiers
    is [1, 2, 3]

    - when adding the 4th entity, the pooled-lo optimizer calls the sequence and obtains
    the next lo value, the next identifier range {4, 5, 6}

    - after inserting the 5th entity, an external system adds a post row and assigns
    the primary key with the value returned by the sequence call

    - the Hibernate application thread resumes and inserts the identifier 6

    - the 7th entity requires a new sequence call, and so a new range is allocated
    {10, 11, 12}'
