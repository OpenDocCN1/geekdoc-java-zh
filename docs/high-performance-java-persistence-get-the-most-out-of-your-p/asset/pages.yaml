  md: '# 10.1.4 Numeric types


    Oracle can represent numbers up to 38 digits, therefore only fitting in a BigInteger
    or a BigDecimal (Long and Double can only store up to 8 bytes).


    Table 10.4: Numeric Types


    | Hibernate type | JDBC type | Java type |

    | --- | --- | --- |

    | BigIntegerType | NUMERIC | BigInteger |

    | BigDecimalType | NUMERIC | BigDecimal |


    # 10.1.5 Binary types


    For binary types, most database systems offer multiple storage choices (e.g. RAW,
    VARBINARY, BYTEA, BLOB, CLOB). In Java, the data access layer can use an array
    of byte(s), a JDBC Blob or Clob, or even a Serializable type, if the Java object
    was marshaled prior to being saved to the database.


    Table 10.5: Binary Types


    | Hibernate type | JDBC type | Java type |

    | --- | --- | --- |

    | BinaryType | VARBINARY | byte[], Byte[] |

    | BlobType | BLOB | Blob |

    | ClobType | CLOB | Clob |

    | NClobType | NCLOB | byte[], Byte[] |

    | MaterializedBlobType | BLOB | Clob |

    | ImageType | LONGBINARY | byte[], Byte[] |

    | SerializableType | VARBINARY | Serializable |

    | SerializableToBlobType | BLOB | Serializable |


    # 10.1.6 UUID types


    There are various ways of persisting a UUID (Universally Unique Identifier), and,
    based on the memory footprint, the most efficient storage types are the database-specific
    UUID column types.


    Table 10.6: UUID Types


    | Hibernate type | JDBC type | Java type |

    | --- | --- | --- |

    | UUIDBinaryType | BINARY | UUID |

    | UUIDCharType | VARCHAR | UUID |

    | PostgresUUIDType | OTHER | UUID |'
