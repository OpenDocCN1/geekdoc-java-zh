    Querying for statistics require specifying the Actual Topic subclass:


    ```

    PostStatistics statistics = entityManager.createQuery(

    "select s from PostStatistics join fetch s.topic where t.id = :postId",nPostStatistics.class)

    .setParameter("postId", postId)

    .getSingleResult();

    ```


    This query generates a single SQL join statement:


    ```

    SELECT

    s.id AS id1_0_,

    p.id AS id1_3_,

    s.views AS views2_4_,

    p.board_id AS board_id6_1_,

    p.createdOn AS created0_3_1_,

    p.owner AS owner3_1_,

    p.title AS title4_3_1,

    p.content AS content5_3_1_

    FROM post_statistics s

    INNER JOIN post p ON s.id = p.id

    WHERE p.id = 1

    ```


    Polymorphic queries against the Topic class are no longer permitted, and the Board
    entity cannot define a @OneToMany collection inherited.


    # Performance considerations


    Although polymorphic queries and associations are no longer permitted, the @MappedSuperclass
    yields very efficient read and write operations. Like single and table-per-class
    inheritance, write operations require a single insert statement and reading only
    needs to select from one table only.'
