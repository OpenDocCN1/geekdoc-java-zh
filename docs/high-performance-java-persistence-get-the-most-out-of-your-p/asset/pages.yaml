  md: '# # MySQL


    Traditionally, MySQL constraints are not strictly enforced*, and the database
    engine replaces invalid values with predefined defaults:


    +   * out of range numeric values are set to either 0 or the maximum possible
    value

    * String values are trimmed to the maximum length

    * Incorrect data values are permitted (e.g. 2015-02-30)

    * NOT NULL constraints are only enforced for single INSERT statements. For multi-row
    inserts, 0 replaces a null numeric value, and the empty value is used for a null
    String.


    The 5.0.2 version, strict constraints are possible if the database engine is configured
    to use a custom sql_mode*",


    ```

    SET GLOBAL sql_mode=''POSTRESQL,STRICT_ALL_TABLES'';

    ```


    Because the sql_mode resets on server startup, it''s better to set it up in the
    MySQL configuration file:


    ```

    [mysqlid]

    sql_mode = POSTRESQL,STRICT_ALL_TABLES

