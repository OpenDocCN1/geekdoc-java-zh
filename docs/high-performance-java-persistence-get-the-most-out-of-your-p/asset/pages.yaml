  md: '# # 9. Connection Management and Monitoring


    As previously explained in the JDBC Connection Management chapter, for performance
    reasons, database connections are better off reused. JPA providers generate SQL
    statements on behalf of users, it''s very important to monitor this process and
    acknowledge its outcome. This chapter will explain the Hibernate connection provider
    and ways to monitor statement execution.


    # ## 9.1 JPA connection management


    Like the whole Java EE suite, the JPA 1.0 specification was very much tied to
    enterprise application servers. In a Java EE container, all database connections
    are managed by the application server which provides pooling, monitoring, and
    JTA capabilities.


    Once configured, the Java EE DataSource is located through JNDI. In the persistence.xml
    configuration file, the application developer must supply the JNDI name of the
    associated JTA or RESOURCE_LOCAL. The transaction-type attribute must also match
    the transaction capabilities.


    ```

    <persistence-unit name="persistenceUnit" transaction-type="JTA">

    <provider>org.hibernate.jpa.HibernatePersistenceProvider</provider>

    <jta-data-source>java:global/jdbcbc/flexypool</jta-data-source>

    </persistence-unit>

    ```


    A RESOURCE_LOCAL transaction must use a non-data-source DataSource.


    ```

    <persistence-unit name="persistenceUnit" transaction-type="RESOURCE_LOCAL">

    <provider>org.hibernate.jpa.HibernatePersistenceProvider</provider>

    <non-data-data-source>java:comp/env/jdbc/hsqldb</non-data-data-source>

    </persistence-unit>

    ```


    While for a Java application it''s perfectly fine to rely on the application server
    for providing a full-featured DataSource reference, stand-alone applications are
    usually configured using dependency injection rather than JNDI.


    From the JPA implementation perspective the DataSource can be configured externally
    or by the JPA provider itself. Most often, configuring an external DataSource
    is still the preferred'
