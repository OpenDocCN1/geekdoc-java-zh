  md: 'Why JPA and Hibernate matter


    > The schema ownership goes to the database and the data access layer must assist
    the Domain Model to communicate with the underlying data.


    # 8.4 Write-based optimizations


    JPA shifts the developer mindset from SQL statements to entity state transitions.
    An entity can be in one of the following states:


    Table 8.1: JPA entity states


    | State | Description |

    | --- | --- |

    | New (Transient) | A newly created entity, that is not mapped to any database
    row, is considered to be in the New or Transient state. Once it becomes managed,
    the Persistence Context will issue an insert statement at flush-time. |

    | Managed (Persistent) | A Persistent entity is associated with a database row
    and it''s being managed by the current running Persistence Context. State changes
    are detected by the *dirty checking* mechanism and propagated to the database
    as update statements at flush-time. |

    | Detached | Once the current running Persistence Context is closed, all the previously
    managed entities become detached. Successive changes will no longer be tracked,
    and no automatic database synchronization is going to happen. |

    | Removed | A removed entity is only scheduled for deletion and the actual database
    statement is executed during Persistence Context flushing |


    The Persistence Context captures state changes, and during flushing, translates
    them to SQL statements. The JPA *EntityManager* and the Hibernate *Session* (which
    includes additional methods for moving an entity from one to all the other) interfaces
    are gateways towards the underlying Persistence Context and define all the state
    transition operations.


    *http://docs.oracle.com/javaee/7/api/java/persistence/EntityManager.html#persist-java.lang.Object-

    *https://docs.jboss.org/hibernate/stable/javadoc/hibernate/Session.html'
