- img_proc: true
  md: '# 10.2.3.4.4 The default table identifier generator


    Just like sequences, the JPA table generator mapping can use a legacy or an enhanced
    generator, depending on the current Hibernate configuration settings:


    ```

    @Id

    @GeneratedValue(generator = "table", strategy=GenerationType.TABLE)

    @TableGenerator(name = "table", allocationSize = 3)

    private Long id;

    ```


    If the hibernate.id.new_generator_mappings configuration property is false, Hibernate
    chooses the HiLoPerTableGenerator. This generator requires a single table for
    managing multiple identifiers, and just like SequenceHiLoGenerator, it also uses
    the hi/lo algorithm by default.


    When the enhanced identifier generators are activated, Hibernate will use the
    TableGenerator instead, which can also take configurable optimizer strategies.


    For both the enhanced sequence and the table identifier generator, Hibernate comes
    with the following built-in optimizers:


    | Optimizer | Implementation class | Description |

    | --- | --- | --- |

    | none | NoopOptimizer | Every identifier is fetched using a new roundtrip to
    the database |

    | hi/lo | HiLoOptimizer | It allocates identifiers by using the legacy hi/lo algorithm
    |

    | pooled | PooledOptimizer | It''s an enhanced version of the hi/lo algorithm
    which is interoperable with other systems unaware of this identifier generator
    |

    | pooled-lo | PooledOptimizer | It''s a variation of the pooled optimizer, the
    database sequence representing the lo value inside the hi one


    By default, the StyleGenerator and TableGenerator identifier generators will use
    the pooled optimizer. If the hibernate.id.optimizer.pooled.prefer_lo configuration
    property is set to true, Hibernate will use the pooled-lo optimizer by default.


    Both the pooled and the pooled-lo encode the database sequence value into the
    identifier boundaries, so allocating a new value using the actual database sequence
    call doesn''t interfere with the identifier generator allocation process.'
