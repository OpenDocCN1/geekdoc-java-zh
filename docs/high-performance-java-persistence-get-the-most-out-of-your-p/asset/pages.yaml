  md: '# 7.3.3 Isolation levels


    As previously stated, Serializable is the only isolation level to provide a truly
    ACID transaction interleaving. But serializability comes at a price as locking
    introduces contention, which in turn, limits concurrency and scalability. Even
    in multi-version concurrency models, serializability may require aborting too
    many transactions that are affected by phenomena.


    For this purpose, the SQL-92 version introduced multiple isolation levels, and
    the database client has the option of balancing concurrency against data correctness.
    Each isolation level is defined in terms of the minimum number of phenomena that
    it must prevent, and so the SQL standard introduces the following transaction
    levels:


    Table 7.1: Standard isolation levels


    | Isolation Level | Dirty read | Non-repeatable read | Phantom read |

    | --- | --- | --- | --- |

    | Read Uncommitted | Yes | Yes | Yes |

    | Read Committed | No | No | Yes |

    | Repeatable Read | No | No | Yes |

    | Serializable | No | No | No |


    Without an explicit, the JDBC driver uses the default isolation level, which can
    be inspected using the getDefaultTransactionIsolation() method of the DatabaseMetaData
    object:


    ```

    int level = connection.getMetaData().getDefaultTransactionIsolation();

    ```


    The default isolation level can be changed using the setTransactionIsolation(int
    level) Connection method.


    ```

    connection.setTransactionIsolation(Connection.TRANSACTION_SERIALIZABLE);

    ```


    > Even if ACID properties imply a serializable schedule, most relational database
    systems use a lower isolation level instead:


    * Read Committed (Oracle, SQL Server, PostgreSQL)

    * Repeatable Read (MySQL).


    The following sections will go through each particular transaction isolation level
    and demonstrate the actual list of phenomena that are prevented by a given database
    system.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# 7.3.3.1 Read Uncommitted


    Table 7.2: Read Uncommitted phenomena occurrence


    | Phenomena | SQL Server | PostgreSQL | MySQL |

    |---|---|---|--|

    | Dirty Write | No | No | No |

    | Dirty Read | Yes | No | Yes |

    | Non-Repeatable Read | Yes | Yes | Yes |

    | Phantom Read | Yes | Yes | Yes |

    | Read Skew | Yes | Yes | Yes |

    | Write Skew | Yes | Yes | Yes |

    | Lost Update | Yes | Yes | Yes |


    Oracle

    Dirty reads are not allowed, and so the lowest isolation level is Read Committed.


    > The JDBC driver even throws an exception if the client tries to set the Read
    Uncommitted isolation on the current Connection.


    SQL Server

    Read Uncommitted only protects against dirty writes, all other phenomena being
    allowed. When using Read Uncommitted, there is no exclusive lock associated with
    a given SQL modification, so uncommitted changes are available to other concurrent
    transactions before they get committed. If the risk of dirty reads can be assumed,
    avoiding exclusive locks can speed up reporting queries, especially when scanning
    large amounts of data.


    > For locking-based concurrency control mechanisms, Read Uncommitted is worth
    considering the risk of dirty reads is a much smaller issue than locking a large
    portion of a database table. Because MVCC avoids reader-writer and writer-reader
    locking, it might not exhibit a considerable performance enhancement from permitting
    dirty reads.'
  merge: -1
