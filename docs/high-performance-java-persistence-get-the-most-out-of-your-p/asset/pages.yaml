  md: '# Mapping Types and Identifiers


    Unlike identity columns and sequences, which can increment the sequence in a single
    request, the table generator entails a significant performance overhead. For this
    reason, Hibernate comes with a series of optimizers which can improve performance
    for both database sequences and table generators.


    > Although it is a portable identifier generation strategy, the table generator
    introduces a serializable execution (the row-level lock), which can hinder scalability.
    Compared to this application-level sequence generation technique, identity columns
    and sequences are highly optimized for high-concurrency scenarios and should be
    the preferred choice anyway.


    # 10.2.3.4 Optimizers


    As previously mentioned, both the sequence and the table identifier generator
    have multiple implementations which can improve the performance of the identifier
    generation process. The sequence and table generators can be split into two categories:


    +   - legacy implementations (being deprecated since Hibernate 5.0) like SequenceGenerator,
    SequenceHiLoGenerator and MultipleHiLoPerTableGenerator

    - newer and more efficient implementations such as SequenceStyleGenerator and
    TableGenerator


    These two categories are not compatible, and the application developer must either
    choose the legacy identifiers or the enhanced ones. Prior to Hibernate 5, the
    identity generators were provided by default and the application developer could
    switch to the newer ones by setting the following configuration property:


    ```

    <property name="hibernate.id.new_generator_mappings" value="true"/>

    ```


    Hibernate 5 decided to drop support for the legacy identifiers and to use the
    enhanced ones by default.


    Among the legacy identifier generators, the SequenceGenerator didn''t offer any
    optimization, as every new identifier value would require a call to the underlying
    database sequence. On the other hand, the SequenceHiLoGenerator and the MultipleHiLoTableGenerator
    offered a hi/lo optimization mechanism aimed to reduce the number of calls to
    a database server. Although these generators are deprecated, the legacy hi/lo
    algorithm is still a valid optimizer for the newer identifier generators.'
  merge: -1
  pgno: 182
- img_proc: true
  md: "# 10.2.3.4.1 The hi/lo algorithm\n\nThe hi/lo algorithms splits the sequences\
    \ domain into hi groups. A hi value is assigned chronologically, and every hi\
    \ group is given a maximum number of lo entries, which can be assigned off-line\
    \ without worrying about identifier value conflicts.\n\n![](img/8a123270ec9380e9de699a1d09b2d7ee_183_0.png)\n\
    \n+   1. The hi token is assigned either by the database sequence or the table\
    \ generator, so two consecutive calls are guaranteed to see monotonically increasing\
    \ values\n2. Once a hi token is retrieved, the increment size (n - the number\
    \ of lo entries) defines the range of identifier values a transaction can safely\
    \ allocate. The identifiers range is bounded by the following interval: $Id =\
    \ [n \\times (hi - 1) + 1, n \\times hi]$ and the allocation is done as:\n   \
    \ * the current group values start from $n \\times (hi - 1) + 1$\n    * the *lo*\
    \ value is taken from the following interval: $[0, n - 1]$]$$\n    * by adding\
    \ the *lo* value to the initial group value, a unique identifier number is obtained.\n\
    3. When all *lo* values are used, a new *hi* value is fetched and the cycle continues."
  merge: -1
  pgno: 183
