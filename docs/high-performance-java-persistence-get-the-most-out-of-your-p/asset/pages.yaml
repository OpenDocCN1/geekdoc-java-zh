  md: '# 3.2.1 Why is pooling so much faster?


    To understand why the connection pooling solution performs so much better, it’s
    important to figure out the connection pooling mechanism:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_30_0.png)


    Figure 3.6: Connection acquisition request flow


    +   1. When a connection is being requested, the pool looks for unallocated connections

    2. If the pool finds a free one, it handles it to the client

    3. If there is no free connection, the pool tries to grow to its maximum allowed
    size

    4. If the pool already reached its maximum size, it will retry several times before
    giving up with a connection acquisition failure exception

    5. When the client closes the logical connection, the connection is released and
    returns to the pool without the underlying physical connection.


    Most connection pooling solutions expose a DataSource implementation that either
    wraps an actual database specific DataSource or the underlying DriverManager utility.'
