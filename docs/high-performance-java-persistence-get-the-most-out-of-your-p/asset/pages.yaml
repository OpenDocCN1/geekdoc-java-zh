  md: '# PostgreSQL


    The Repeatable Read is implemented using Snapshot Isolation*, so not fuzzy reads
    are prevented even though phantom reads are prohibited as well. Instead of using
    locking, the PostgreSQL MVCC implementation allows conflicts to occur, and it
    will abort any transaction whose guarantees don''t hold anymore.


    > *https://en.wikipedia.org/wiki/Snapshot_isolation


    # MySQL


    Every transaction can only see rows as if they were the current transaction started.
    It prevents non-repeatable reads, but it still allows last updates and write skews.


    # 7.3.3.4 Serializable


    Serializable is supposed to provide a transaction schedule, whose outcome, even
    in spite of statement interleaving, is equivalent to a serial execution.


    Even if the concurrency control mechanism is locking-based or it manages multiple
    record versions, it must prevent all phenomena to ensure serializable transactions.
    Preventing all phenomena mentioned by the SQL standard (dirty reads, non-repeatable
    reads and phantom reads) is not enough, and Serializable must protect against
    lost update, read skew and write skew as well.


    In practice, the concurrency control implementation details leak, and not all
    relational database systems provide a truly Serializable isolation level (some
    data integrity anomalies might still occur).


    Table 7.5: Serializable phenomenon occurrence


    | Phenomena | Oracle | SQL Server | SQL Server MVCC | PostgreSQL | MySQL |

    |---|---|---|---|---|-|

    | Dirty Write | No | No | No | No | No |

    | Dirty Read | No | No | No | No | No |

    | Non-Repeatable Read | No | No | No | No | No |

    | Phantom Read | No | No | No | No | No |

    | Read Skew | No | No | No | No | No |

    | Write Skew | Yes | No | Yes | No | No |

    | Lost Update | No | No | No | No | No |'
