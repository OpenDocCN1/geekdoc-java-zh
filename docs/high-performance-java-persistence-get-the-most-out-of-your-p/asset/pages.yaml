  md: '# # 10. Mapping Types and Identifiers


    JPA addresses the Object/Relational mismatch by associating Java object types
    to database structures Assuming there is a task database table having four columns
    (e.g. id,created_by, created_on and status), the JPA provider must map it to Domain
    Model consisting of two Java class (e.g. Task and Change).


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_161_0.png)


    JPA uses three main Object-Relational mapping elements: type, embeddable and entity.
    In the previous diagram, the Task object is an entity, while the Change object
    is an embeddable type.


    Both the entity and the embeddable group multiple Domain Model properties by relying
    on Hibernate Type(s) to associate database column types with Java value objects
    (e.g. String, Integer, Date). The major difference between an entity and an embeddable
    is the presence of an identifier, which is used to associate a database table
    unique key (usually the primary key) with a Domain Model object property.'
  merge: -1
  pgno: 161
- img_proc: true
  md: "# Mapping Types and Identifiers\n\n> Although it's common practice to map all\
    \ database columns, this is not a strict requirement. Sometimes it's more practical\
    \ to use a root entity and several sub-entities, so each business case fetches\
    \ as much info as needed (while still benefiting from entity state management).\n\
    \nIdentifiers are mandatory for entity elements, and an embeddable type is forbidden\
    \ to have an row of its own. Knowing the database table and the column that uniquely\
    \ identifies any given row, Hibernate can correlate database rows with Domain\
    \ Model entities.\n\nAn embeddable type groups multiple properties in a single\
    \ reusable component.\n\n```\n```java\n@Embeddable\npublic class Change {\n  \
    \  @Column(name = \"changed_on\")\n    private Date changedOn;\n\n    @Column(name\
    \ = \"changed_by\")\n    private String changedBy;\n}\n```\n```\n\n> The Domain\
    \ Model can share state between multiple entities either by using inheritance\
    \ or composition. Embeddable types can reuse state through composition.\n\nThe\
    \ composition association¹, defined by UML, is the perfect analogy for the relationship\
    \ between an entity and an embeddable. When an entity includes an embeddable type,\
    \ all its properties become part of the owner entity.\n\nThe embeddable object\
    \ cannot define its own identifier otherwise the entity will have more than one\
    \ identities. Lacking an identifier, the embeddable object cannot be managed by\
    \ a Persistence Context, and its state is controlled by its parent entity.\n\n\
    Because they can have a significant impact on the overall application performance,\
    \ the rest of the chapter discusses types and identifiers in great detail.\n\n\
    ¹https://en.wikipedia.org/wiki/Object_composition"
