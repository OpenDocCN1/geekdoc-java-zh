  md: '# Transparent statement batching


    Since all changes are flushed at once, Hibernate may benefit from batching JDBC
    statements. Batch updates can be enabled transparently, even after the data access
    logic has been implemented. Most often, performance tuning is postponed until
    the system is already running in production, and switching to batching statements
    should not require a considerable development effort.


    > With just one configuration, Hibernate can execute all prepared statements in
    batches.


    # Application-level concurrency control


    As previously explained, no database isolation level can protect against losing
    updates when executing a multi-request conversation. JPA supports both optimistic
    and pessimistic locking.


    The JPA optimistic locking mechanism allows preventing lost updates because it
    imposes a happens before event ordering. In multi-request conversations, optimistic
    locking requires maintaining old snapshots, and JPA makes it possible through
    Extended Persistence Contexts or detached entities.


    > A Java EE application server can preserve a given Persistence Context across
    several web requests, therefore providing application-level repeatable reads.
    But this strategy is not free since the application developer must make sure the
    Persistence Context is not bloated with too many entities, apart from consuming
    memory, it can also affect the performance of the Hibernate default dirty checking
    mechanism.


    Even when not using Java EE, the same goal can be achieved with detached entities,
    which provide a fine-grained control over the amount of data needed to be preserved
    from one request to the other. JPA allows merging detached entities, which rebecome
    managed and automatically synchronized with the underlying database system.


    JPA also supports a pessimistic locking query abstraction, which comes in handy
    when using lower-transaction isolation modes.


    > Hibernate has a native pessimistic locking API, which brings support for timing
    out lock acquisition requests or skipping already acquired locks.'
