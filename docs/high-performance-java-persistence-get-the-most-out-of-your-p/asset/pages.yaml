- img_proc: true
  md: '# PostgreSQL


    Like Oracle, PostgreSQL doesn''t allow dirty reads, the lowest isolation level
    being Read Committed.


    > When choosing Read Uncommitted, the JDBC driver silently falls back to Read
    Committed.


    # MySQL


    Although it uses MVCC, InnoDB implements Read Uncommitted so that dirty reads
    are permitted. As an optimization, each query is spared from rebuilding the previous
    committed versions (using the rollback segments) of the currently scanned records
    (in case they have been recently modified).


    # 7.3.3.2 Read Committed


    Read Committed is one of the most common isolation level, and it behaves consistently
    across multiple relational database systems or various concurrency control models.


    Many database systems choose Read Committed as the default isolation level because
    it delivers the best performance, while preventing fatal anomalies such as dirty
    writes and dirty reads. But performance has its price as Read Committed permits
    many anomalies that might lead to data corruption.


    Table 7.3: Read Committed phenomena occurrence

    | Phenomena | Oracle | SQL Server | SQL Server MVCC | PostgreSQL | MySQL |

    |---|---|---|---|---||

    | Dirty Write | No | No | No | No | No |

    | Dirty Read | No | No | No | No | No |

    | Non-Repeatable Read | Yes | Yes | Yes | Yes | Yes |

    | Phantom Read | Yes | Yes | Yes | Yes | Yes |

    | Read Skew | Yes | Yes | Yes | Yes | Yes |

    | Lost Update | Yes | Yes | Yes | Yes | Yes |'
