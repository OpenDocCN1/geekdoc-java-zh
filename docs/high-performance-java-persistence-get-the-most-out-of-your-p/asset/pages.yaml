- img_proc: true
  md: '# Transactions


    Database objects are hierarchical in nature, a logical tablespace being mapped
    to multiple database files, which are built of data pages, each page containing
    multiple rows. For this reason, locks can be acquired on different database object
    types.


    Locking on lower-levels (e.g. rows) can offer better concurrency as it reduces
    the likelihood of contention. Each lock takes resources, holding multiple lower-level
    locks can add up, so the database might decide to substitute multiple lower-level
    locks into a single upper-level one. This process is called escalation and it
    trades off concurrency for database resources.


    Each database system comes with its own lock hierarchy but the most common types
    (even mentioned by the 2PL initial read) remain the following:


    +   - shared (read) lock, preventing a record from being written while allowing
    concurrent reads

    - exclusive (write) lock, disallowed both read and write operations.


    Locks alone are not sufficient for preventing conflicts. A concurrency control
    strategy must define how locks are acquired and released because this also has
    an impact on transaction interleaving.


    For this purpose, the 2PL protocol defines a management strategy for ensuring
    serializability. The 2PL protocol splits a transaction in two sections:


    +   - expanding phase (locks are acquired and no lock is released)

    - shrinking phase (all locks are released and no other lock is further acquired).


    In a locking-based concurrency control implementation, all currently interleaved
    transactions must follow the 2PL protocol as otherwise serializability might be
    compromised, resulting in data anomalies.


    # Transaction schedule


    To recover from failures, the transaction schedule (the sequence of all interleaved
    operations) must be strict. If a write operation, in a first transaction, happens
    before a conflict occurring in a subsequent transaction, in order to achieve strictness,
    the first transaction commit must also happen before the conflict.


    Because operations are properly ordered, strictness can prevent cascading aborts
    (one transaction rollback triggering a chain of other transaction aborts, to preserve
    data consistency). Releasing locks only after the transaction has ended (either
    commit or rollback) is a requirement for having a strict schedule.'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'The following diagram shows how transaction interleaving is coordinated by
    2PL:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_89_0.png)


    Figure 7.2: Two-phase locking


    +   * Alice and Bob select a post record, both acquiring a shared lock on this
    record

    * when Bob attempts to update the post entry, his statement is blocked by the
    Lock Manager because Alice is still holding a shared lock on this database row

    * only after Alice’s transaction ends and all locks are released, Bob can resume
    his update operation

    * Bob’s update will generate a lock upgrade, so the shared lock is replaced by
    an exclusive lock, which will prevent any concurrent read or write operation

    * Alice starts a new transaction and issues a query for the same post entry, the
    statement is blocked by the Lock Manager since Bob owns an exclusive lock on this
    record

    * after Bob’s transaction is committed, all locks are released and Alice’s query
    can be resumed, so she will get the latest value of this database record.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Deadlocks


    Using locking for controlling access to shared resources is prone to deadlocks,
    and the transaction scheduler alone cannot prevent their occurrences.


    A deadlock happens when two concurrent transactions cannot make progress because
    each one waits for the other to release a lock. Because both transactions are
    in the lock acquisition phase, neither will release a lock prior to acquiring
    the next one.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_90_0.png)


    Figure 7.3: Dead lock


    Preserving the lock order becomes the responsibility of the data access layer,
    and the database can only assist in recovering from a deadlock situation.


    The database engine runs a separate process that scans the current conflict graph
    for lock-wait cycles (which are caused by deadlocks). When a cycle is detected,
    the database engine picks one transaction and aborts it, causing its locks to
    be released, so the other transaction can make progress.'
  merge: -1
  pgno: 90
