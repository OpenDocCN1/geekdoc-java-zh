  md: '# JDBC Connection Management 24


    The following exercise demonstrates how queuing theory can help provisioning a
    connection pool to support various incoming traffic spikes.


    Reusing the previous example configuration, the connection pool under test is
    within the following boundaries:


    +   - there are at most 5 in-service requests (Ls), meaning that the pool can
    offer at most 5 connections

    - the average service time (Ws) or the connection lease is 100 milliseconds.


    As expected, the connection pool can deliver up to 50 connections per second.


    ```

    $$\mu = \frac{Ls}{Ws} = 50 \frac{connection\ requests}{s}$

    ```


    When the arrival rate equals departure rate, the system becomes saturated, all
    connections being in use.


    ```

    $$\lambda = \mu = \frac{Ls}{Ws}$

    ```


    If the arrival rate outrows the connection pool throughput, the overflowing requests
    must wait for connections to become available.


    A second traffic burst of 150 requests is handled as follows:


    +   - the first 50 requests can be served in the first second

    - the following 100 requests are first enqueued and processed in the following
    two seconds.


    ```

    $$\mu = \frac{Ls}{Ws} = \frac{5}{0.1} = \frac{Lq}{Wq} = \frac{10}{0.2}$

    ```


