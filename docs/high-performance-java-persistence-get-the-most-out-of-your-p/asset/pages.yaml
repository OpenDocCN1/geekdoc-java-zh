    # Cascading


    For @ManyToMany associations, CascadeType.REMOVE doesn''t make too much sense
    when both sides represent independent entities. In this case, removing a Post
    entity shouldn''t trigger a Tag removal because the Tag can be referenced by other
    posts as well. The same arguments apply to orphan removal since removing an entry
    from the tags collection should only delete the junction record and not the target
    entity.


    > For both unidirectional and bidirectional associations, it''s better to avoid
    CascadeType.REMOVE mapping. Instead of CascadeType.ALL, the cascade attributes
    should be declared explicitly (e.g. CascadeType.PERSIST, CascadeType.MERGE).'
