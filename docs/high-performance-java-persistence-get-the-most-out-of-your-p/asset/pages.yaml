    With these two settings in place, whenever a Hibernate Session (Persistence Context)
    ends, the following report will be displayed in the current running log.


    37125102 nanoseconds spent acquiring 10000 JDBC connections;

    25521714 nanoseconds spent releasing 10000 JDBC connections;

    95242323 nanoseconds spent preparing 10000 JDBC statements;

    923615040 nanoseconds spent executing 10000 JDBC statements;


    The default statistics collector counts the number of times a certain callback
    method was called, and, if that''s not satisfactory, the application developer
    can supply its own custom Statistics implementation.


    # Dropdown Metrics


    In a high-throughput transaction system, the amount of metric data needed to be
    recorded can be overwhelming, so storing all these values in memory is not practical
    at all.


    To reduce the memory footprint, the Dropwizard Metrics project uses various reservoir
    sampling strategies, that either employ a fixed-size sampler or a time-based sampling
    window.


    Not only it support a great variety of metrics (e.g. timers, histograms, gauges),
    but Dropwizard Metrics use multiple reporting channels as well (e.g. SLF4J, JMX,
    Ganglia, Graphite).


    +   For all reasons, it''s better to use a mature framework as Dropwizard Metrics
    instead of building a custom implementation from scratch.


    * https://github.com/dropwizard/metrics

    * https://en.wikipedia.org/wiki/Reservoir_sampling'
