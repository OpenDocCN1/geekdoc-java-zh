    the performance gain is quite substantial.


    > Statement caching plays a very important role in optimizing high-performance
    OLTP (Online transaction processing) systems.


    # 5.3 Server-side statement caching


    Because statement parsing and the execution plan generation are resource intensive
    operations, some database providers offer an execution plan cache. The statement
    string value is used as input to a hashing function, and the resulting value becomes
    the execution plan cache entry. If the statement string value changes from one
    execution to the other, the newly parametrized statement can cannot reuse an already
    generated execution plan. For this purpose, dynamic-generated JDBC Statement(s)
    are not suitable for reusing execution plans.


    # Forced Parameterization


    Some database systems offer the possibility of intercepting SQL statements at
    runtime, so that all value literals are replaced with bind variables. This way,
    the newly parametrized statement can reuse an already cached execution plan.


    To enable this feature, each database system offers a vendor-specific syntax.


    # Oracle


    ```

    ALTER SESSION SET cursor_sharing=force;

    ```


    # SQL Server


    ```

    ALTER DATABASE high_performance_java_persistence SET PARAMETERIZATION FORCED;

    ```


    Server-side prepared statements allow the data access logic to reuse the same
    execution plan for multiple executions. A PreparedStatement is always associate
    with a single SQL statement, and bind parameters are used to vary the runtime
    execution context. Because PreparedStatement(s) take the SQL query at creation
    time, the database can precompile the associated SQL statement prior to executing
    it.'
