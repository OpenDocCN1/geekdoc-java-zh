  md: '# 11.3.4 @OneToMany With @ @JoinColumn


    JPA 2.0 added support for mapping the @OneToMany association with a @JoinColumn
    so that it can map the one-to-many relationship. With the @JoinColumn, the @OneToMany
    association controls the child table foreign key so there is no need for a junction
    table.


    On the JPA side, the class diagram is identical to the aforementioned @OneToMany
    relationship, and the only difference is the JPA mapping which makes the additional
    @JoinColumn:


    ```

    @OneToMany(cascade = CascadeType.ALL, orphanRemoval = true)

    @JoinColumn(name = "post_id")

    List<PostComment> comments = new ArrayList<>();

    ```


    When adding postComment entities, Hibernate generates the following SQL statements:


    ```

    post.getComments().add(new PostComment("My first review"),));

    post.getComments().add(new PostComment("My second review"),));

    post.getComments().add(new PostComment("My third review"),));

    ```


    ```

    INSERT INTO post_comment (review, id) VALUES (''My first review'', 2)

    INSERT INTO post_comment (review, id) VALUES (''My second review'', 3)

    INSERT INTO post_comment (review, id) VALUES (''My third review'', 4)

    UPDATE post_comment SET post_id = 1 WHERE id = 2

    UPDATE post_comment SET post_id = 1 WHERE id = 3

    UPDATE post_comment SET post_id = 1 WHERE id = 4

    ```


    Besides the insert statements, Hibernate issues three update statements for setting
    the post-id column on the newly inserted child records. The child entity doesn''t
    own the post_id foreign key column, so the child entities are inserted without
    any knowledge of their parent entity. After inserting the child entities, the
    parent collection can update each child entity foreign key column with the parent
    entity identifier.


    > Although it''s an improvement over the regular @OneToMany mapping, in practice,
    it''s not as efficient as a regular bidirectional @OneToMany association.'
