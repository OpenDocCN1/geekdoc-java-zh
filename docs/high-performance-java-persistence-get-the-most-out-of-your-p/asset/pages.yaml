  md: '# The one-phase commit (1PC) optimization


    Because Java EE uses JTA transactions exclusively, the extra coordination overhead
    of the database roundtrip may hurt performance in a high-throughput application
    environment. When a transaction enlists only one resource adapter (designating
    a single resource manager), the transaction manager can skip the prepare phase,
    and either execute the commit or the rollback phase. With this optimization, the
    distributed transaction behaves similarly to how JDBC Connection(s) manages local
    transactions.


    > XAResource.commit(Xid xid, boolean onePhase) method takes a boolean flag, which
    the transaction manager will set to true to hint the associated resource adapter
    to initiate the 1PC optimization.


    # 7.6.2 Declarative transactions


    Transaction boundaries are usually associated with a Service layer, which uses
    one or more DAO to fulfill the business logic. The transaction propagates from
    one component to the other within the service-layer transaction boundaries.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_119_0.png)


    Figure 7.13: Transaction boundaries


    The declarative transaction model is supported by both Java EE and Spring. Transaction
    boundaries are controlled through similar propagation strategies, which define
    how boundaries are inherited or disrupted at the borderline between the outermost
    component (in the current call stack) and the current one (waiting to be invoked).'
