    # ## 11.3.3 Ordered unidirectional @OneToMany


    If the collection can store the index of every collection element, the unidirectional
    @OneToMany relationship can benefit for some element removal operations. First,
    an @OrderColumn annotation must be defined along the @OneToMany mapping:


    ```

    @OneToMany (cascade = CascadeType.ALL, orphanRemoval = true)

    @OrderColumn(name = "entry")

    private List<PostComment> comments = new ArrayList<>();

    ```


    At the database level, the entry index is included in the junction table.


    | post | post_comment | post_comment |

    | :--- | :--- | :--- |

    | id BIGINT(20) | id_post_BIGINT(20) | id BIGINT(20) |

    | title VARCHAR(255) | comments_id BIGINT(20) | review VARCHAR(255) |

    | Indexes | entry INT(11) | Indexes |


    Figure 11.6: The unidirectional @OneToMany with an @OrderColumn


    > It’s better not to mistake the @OrderColumn with the @OrderBy JPA annotation.
    While the former allows the JPA provider to materialize the element index into
    a dedicated database column so that the collection is sorted using an ORDER clause,
    the latter does the sorting at runtime based on the ordering criteria provided
    by the @OrderBy annotation.'
