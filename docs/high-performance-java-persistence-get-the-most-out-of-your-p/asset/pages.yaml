  md: '# 5.4 Client-side statement caching


    Not only the database side can benefit from caching statements, but also the JDBC
    driver can reuse already constructed statement objects. The main goals of the
    client-side statement caching can be summarized as follows:


    +   - reducing client-side statement processing, which, in turn, lowers transaction
    response time

    - sparing application resources by recycling statement objects along with their
    associated database-specific metadata.


    In high-performance OLTP applications, transactions tend to be very short, so
    even a minor response time reduction can make a difference on the overall transaction
    throughput.


    > Oracle implicit statement cachingnUnlike server-side plan cache, the client
    is confined to a database connection only. Since the SQLString makes the cache
    entry, PreparedStatement(s) and CallableStatement(s) have a better chance of getting
    reused, the Oracle JDBC driver supports caching only for two statement types.
    When enabling caching (it is disabled by default), the driver returns a logical
    statement, so when the client closes, the logical statement goes back to the cache.

    From a development point of view, there is an implicit caching mechanism as well
    as an explicit one. Both caching options share the same driver storage, which
    needs to be configured according to the current application requirements.

    The implicit cache can only store statement metadata, which doesn''t change from
    one execution to the other. Although it can be set for each individual Connection,
    it''s convenient to configure it at the DataSource level (all connections inheriting
    the same caching properties):


    ```

    connectionProperties.put("oracle.jdbc.implicitStatementCacheSize", Integer.toString(cacheSize));ndataSource.setConnectionProperties(connectionProperties);

    ```


    Setting the implicitStatementCacheSize also enables the cache. By default, executing
    all statements are being implicitly cached, and this might not be desirable (some
    occasional queries might avoid every frequently executed statements). To control
    the statement caching policy, JDBC defines the isPool() and setPool(boolean pooling)
    Statement methods:


    ```

    if (statement.isPoolable()) {

    statement.setPool(false);

    }

    ```'
