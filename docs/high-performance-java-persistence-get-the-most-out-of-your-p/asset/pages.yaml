  md: "# Relationships\n\nThe mapping is done through the @OneToOne annotation, which,\
    \ just like the @ManyToOne mapping, might also take a @JoinColumn as well.\n\n\
    ```\n@OneToOne\n@JoinColumn(name = \"post_id\")\nprivate Post post;\n```\n\nThe\
    \ unidirectional @OneToOne association controls the associated foreign key, so,\
    \ when the post property is:\n\n```\nPost post = entityManager.find(Post.class,\
    \ 1L);\nPostDetails details = new PostDetails(\"John Doe\");\ndetails.setPost(post);\n\
    entityManager.persist(details);\n```\n\nHibernate populate the foreign key column\
    \ with the associated post identifier:\n\n```\nINSERT INTO post_details (created_by,\
    \ created_on, post_id, id)\nVALUES ('John Doe', '2016-01-08 11:28:21.317', 1,\
    \ 2)\n```\n\nEven if this is a unidirectional association, the Post is still the\
    \ parent-side of this relationship. To fetch the PostDetails, a JPQL query is\
    \ needed:\n\n```\nPostDetails details = entityManager.createQuery(\n  \"select\
    \ pd \" + \n  \"from PostDetails pd \" + +\n  \"where pd.post = :post\", PostDetails.class)\n\
    .setParameter(\"post\", post)\n.getSingleResult();\",\n```\n\nIf the Post always\
    \ needs its PostDetails, a separate query is undesirable. To overcome this limitation,\
    \ it's important to know the PostDetails identifier prior to loading the entity.\n\
    One workaround would be to use a @NaturalId which might not require a database\
    \ access if the entity is stored in the second-level cache. Fortunately, there's\
    \ even a simpler approach which is also portable across JPA providers as well.\
    \ The JPA 2.0 specification added support for derived identifiers, making possible\
    \ to link the PostDetails identifier to the table primary key.\n\nThis way, the\
    \ post_details table primary key can also be a foreign key referencing the post\
    \ table identifier."
