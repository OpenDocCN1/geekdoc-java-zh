  md: '# 10.2.3.2 Sequence generator


    A sequence is a database object that generates consecutive numbers. Defined by
    the SQL:2003 standard, database sequences are supported by Oracle, SQL Server
    2012 and PostgreSQL, and compared to identity columns, sequences offer the following
    advantages:


    +   - the same sequence can be used to populate multiple columns, even across
    tables

    - values may be preallocated to improve performance

    - allowing incremental steps, sequences can benefit from application-level optimization
    techniques

    - because the sequence call can be decoupled from the actual insert statement,
    Hibernate doesn''t disable JDBC updates


    To demonstrate the difference between the identity and the sequence identifier
    generators, the previous example will be changed to use a database sequence this
    time.


    ```

    @Entity @Table(name = "post")npublic static class Post {

    ```


    ```

    @Id

    @GeneratedValue(strategy=GenerationType.SEQUENCE)

    private Long id;

    }

    ```


    Running the previous test case generates the following output:


    ```

    CALL NEXT VALUE FOR hibernate_sequence

    CALL NEXT VALUE FOR hibernate_sequence

    ```


    ```

    DEBUG - Flush is triggered at commit-time

    ```


    ```

    INSERT INTO post (id) VALUES (1, 2)

    ```


    When executing the persist() method, Hibernate calls the associated database sequence
    and fetches an identifier for the newly persisted entity. The actual insert statement
    is postponed until flush-time, which allows Hibernate to take advantage of JDBC
    batching.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Mapping Types and Identifiers


    # 10.2.3.3 Table generator


    Because of the mismatch between the identifier generator and the transactional
    write-behind cache, JPA offers an alternative sequence-like generator that works
    when sequences are not natively supported.


    A database table is used to hold the latest sequence value and row-level locking
    is employed to prevent two concurrent connections from acquiring the same identifier
    value.


    # Escaping transactional row-level locking


    A database sequence is a non-transactional object because the sequence value allocation
    happens outside of the transactional context associated with requesting a new
    identifier. Database sequences use dedicated locks to prevent concurrent transactions
    from acquiring the same value, but locks are released as soon as the counter increments.
    This design ensures minimal contention when the sequence is used concomit by multiple
    transactions.


    Using a database table as a sequence is challenging, to prevent two transactions
    from getting the same sequence value, row-level locking must be used. Unlike the
    sequence object locks, the row-level lock is transactional, and, once acquired,
    it can only be released when the current transaction ends (either committing or
    rolling back). This would be a terrible scalability issue because a long-running
    transaction would prevent any other transaction from acquiring a new sequence
    value.


    To cope with this limitation, a separate database transactions is used for fetching
    a new sequence value. This way, the row-level lock associated with incrementing
    the sequence counter value can be released as soon as the sequence update transaction
    ends.


    For local transactions, a new transaction means fetching another database connection
    and committing it after executing the sequence processing logic. This can put
    additional pressure on the underlying connection pool, especially if there is
    already a significant contention for database connections.


    In a JTA environment, the current running transaction must be suspended, and the
    sequence value is fetched in a separate transaction. The JTA transaction manager
    has to accommodate the transaction context switch, and that can also have an impact
    on the overall application performance.


    > Without any application-level optimization, the row-level locking approach can
    become a performance bottleneck if the sequence logic is called too often.'
  merge: -1
  pgno: 180
