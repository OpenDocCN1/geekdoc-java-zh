  md: "# 4.3 Retrieving auto-generated keys\n\nIt's common practice to delegate the\
    \ row identifier generation to the database system. This way, the developer doesn't\
    \ have to provide a monotonically incrementing primary key since the database\
    \ takes care of this upon inserting a new record.\n\nAs convenient as this practice\
    \ may be, it's important to know that auto-generated database identifiers may\
    \ conflict with the batch insert process.\n\nLike many other database features,\
    \ setting the auto incremented identifier strategy is database specific but the\
    \ choice goes between an identity column or a database sequence generator.\n\n\
    # Oracle\n\nPrior to Oracle 12c, an auto incremented generator had to be implemented\
    \ on top of a database sequence.\n\n```\nCREATE SEQUENCE post_seq;\n\nCREATE TABLE\
    \ post (\n  id NUMBER(19,0) NOT NULL,\n  title VARCHAR2(255 CHAR),\n  version\
    \ NUMBER(10,0) NOT NULL,\n  PRIMARY KEY (id));\n\nCREATE OR REPLACE TRIGGER post_identity\n\
    BEFORE INSERT ON post\nFOR EACH ROW\nBEGIN\n  SELECT post_seq.NEXTVAL\n  INTO\
    \ :NEW.id\n  FROM dual;\nend;\n```\n\nOracle 12c adds support for identity columns\
    \ as well, the previous example can be simplified as follows.\n\n```\nCREATE TABLE\
    \ post (\n  id NUMBER(19,0) NOT NULL GENERATED ALWAYS AS IDENTITY,\n  title VARCHAR2(255\
    \ CHAR),\n  version NUMBER(10,0) NOT NULL,\n  PRIMARY KEY (id));\n```"
