  md: '# 7.3.2.7 Lost update


    This phenomenon happens when a transaction reads a row while another transaction
    modifies prior to the first transaction to finish. In the following example, Bob’s
    update is silently overwritten by Alice, who is not aware of the record update.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_101_0.png)


    Figure 7.10: Lost update


    This anomaly can have serious consequences on data integrity (a buyer might purchase
    a product without knowing the price has changed), especially because it affects
    Read Committed, the default isolation level in many database systems.


    Traditionally, Repeatable Read protects against lost updates since the shared
    locks could prevent a concurrent transaction from modifying an already fetched
    record. With MVCC, the second transaction is allowed to make the change, while
    the first transaction is aborted when the database engine detects the row version
    mismatch (during the first transaction commit).


    Most ORM tools, such as Hibernate, offer application-level optimistic locking,
    which automatically integrates the row version whenever a record modification
    is issued. On a row version mismatch, the update count is going to be zero, so
    the application can roll back the current transaction, as the current data snapshot
    is stale.'
  merge: -1
