  md: '# Oracle


    When a ResultSet is being traversed, the client-side cursor fetches data in chunks
    (the fetch size attribute controlling the number of records in a chunk).


    After each batch retrieval, the total number of records is checked against the
    maxRows upper bound, and if the threshold is reached, the driver closes the networking
    stream.


    The maxRows upper bound can prevent the database and the client-side driver from
    wasting resources on fetching records the client doesn''t even need.


    # SQL Server


    When the Statement.setMaxRows(int maxRows) method is called, the driver calls
    the SET ROWCOUNT command:


    +   - SET ROWCOUNT N


    Unlike the TOP or FETCH SQL directives, the ROWCOUNT command is taken into consideration
    only during the execution phase, and because of this, the execution plan might
    not be optimized for the given result set size, so a table scan might be chosen
    over an index.


    > The SQL Server documentation recommends using the SQL directives over the ROWCOUNT
    command.


    https://msdn.microsoft.com/en-us/library/mx37883%28v-sql.110%29.aspx


    # PostgreSQL


    The JDBC driver takes the maxRows statement attribute and sends it along with
    the query executed. With this info, the Optimizer can choose an execution plan
    that is tailored for the given result set size, and it might avoid some expensive
    operations like sorting the whole projection. The Extractor can also close the
    database cursor right after it fetched the desired number of records, therefore
    sparing both database and networking resources.'
