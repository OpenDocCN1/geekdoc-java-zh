  md: '# 3. JDBC Connection Management


    The JDBC (Java Database Connectivity) API provides a common interface for communicating
    to a database server. All the networking logic and the database specific communication
    protocol are hidden behind the vendor-independent JDBC API. For this reason, all
    the JDBC interfaces must be implemented according to the database vendor specific
    requirements. The java.sql.Driver is the main entry point for interacting with
    the JDBC API, defining the implementation version details and providing access
    to a database connection.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_24_0.png)


    Figure 3.1: JDBC plugin architecture


    +   JDBC defines four driver types:

    - Type 1: It''s only a bridge to an actual ODBC driver implementation

    - Type 2: It uses a database specific native client implementation (e.g. Oracle
    Call Interface)

    - Type 3: It delegates call to an application server offering database connectivity
    support

    - Type 4: The JDBC driver implements the database communication protocol solely
    in Java.


    Being easier to setup and debug, the Type 4 driver is usually the preferred alternative.


    To communicate to a database server, a Java program must first obtain a java.sql.Connection.
    Although the java.sql.Driver is the actual database connection provider, it''s
    more convenient to use the java.sql.DriverManager since it can also resolve the
    JDBC driver associated with the current database connection URL.'
