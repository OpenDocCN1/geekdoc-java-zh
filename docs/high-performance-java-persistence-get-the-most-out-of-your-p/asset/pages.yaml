    # 9.4.2 Statement-level comments


    Besides formatting, Hibernate can explain the statement generation process by
    appending SQL-level comments into the statement body. This feature allows the
    application developer to get a better understanding of the following processes:


    +   - the entity state transition that triggered the current executing statement

    - the reason for choosing a join when fetching a given result set

    - the explicit locking mechanism employed by the current statement.


    By default, Hibernate doesn''t append any SQL comment in the automatically generated
    statements, and to enable this mechanism, the following Hibernate property must
    be configured:


    ```

    <property name="hibernate.use_sql_comments" value="true" />

    ```


    When persisting a Post entity, Hibernate explains the entity state transition
    associated with this particular statement through the following comment:


    ```

    /* insert com.vladimhalcea.book.hpjp.util.providers.BlogEntityProvider$Post */

    INSERT INTO post (title, version, id) VALUES (?, ?, ?)

    ```


    > As opposed to SQL statement formatting, SQL comments are not only generated
    during logging, and they propagate to the underlying Driver as well.'
