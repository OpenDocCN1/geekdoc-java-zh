  md: "# Mapping Types and Identifiers\n\nTo continue the previous example, the post\
    \ will use the table generator this time:\n\n```\n@Entity(name = \"post\")\npublic\
    \ class Post {\n    @Id\n    @GeneratedValue(strategy=GenerationType.TABLE)\n\
    \    private Long id;\n}\n```\n\nThe following output is obtained when inserting\
    \ a new post:\n\n```\nSELECT tbl.next_val\nFROM hibernate_sequences tbl\nWHERE\
    \ tbl.sequence_name=default\nFOR UPDATE\n\nINSERT INTO hibernate_sequences (sequence_name,\
    \ next_val)\nVALUES (default, 1)\n\nUPDATE hibernate_sequences SET next_val=2\n\
    WHERE next_val=1 AND sequence_name=default\n\nSELECT tbl.next_val\nFROM hibernate_sequences\
    \ tbl\nWHERE tbl.sequence_name=default\nFOR UPDATE\n\nUPDATE hibernate_sequences\
    \ SET next_val=3\nWHERE next_val=2 AND sequence_name=default\n\nDEBUG - Flush\
    \ is triggered at commit-time\n\nINSERT INTO post (id) values (1, 2)\n```\n\n\
    The table generator benefits from JDBC batching, but every table sequence update\
    \ incurs three steps:\n\n+   - the list statement is executed to ensure that the\
    \ same sequence value is not allocated for two concurrent transactions\n- the\
    \ current value is incremented in the data access layer\n- the new value is saved\
    \ back to the database and the secondary transaction is committed to release the\
    \ row-level lock."
