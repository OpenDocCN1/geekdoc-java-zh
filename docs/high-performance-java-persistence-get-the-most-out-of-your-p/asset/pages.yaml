  md: '# Relationships


    > The bidirectional @OneToMany association generates efficient DML statements
    because @ManyToOne mapping is in charge of the table relationship. Because it
    simplifies data access operations well, the bidirectional @OneToMany association
    is worth considering when the size of the child records is relatively low.


    # 11.3.2 Unidirectional @OneToMany


    The unidirectional @OneToMany association is very tempting because the mapping
    is simpler than its bidirectional counterpart. Because there is only one side
    to take into consideration, there''s no need for helper methods and the mapping
    doesn''t feature a @mappedBy attribute.


    ```

    @OneToMany(cascade = CascadeType.ALL, orphanRemoval = true)

    private List<PostComment> comments = new ArrayList<>();

    ```


    Unfortunately, in its simplicity, the unidirectional @OneToMany association is
    less efficient than the unidirectional @ManyToOne mapping or the bidirectional
    @OneToMany association.


    Against any intuition, the unidirectional @OneToMany association doesn''t map
    to a one-to-many table relationship. Because there is no @ManyToOne side to control
    this relationship, Hibernate uses a separate table to manage the association between
    parent row and its child records.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_202_0.png)


    Figure 1.5: The @OneToMany table relationship


    The table post_post_comment contains two foreign keys, which reference both the
    parent-side row (post_id column is a foreign key to the post primary table) and
    the child-side entity (comments_id references the primary key of the post_comment
    table).


    Without going into analyzing the associated data operations, it is less efficient
    than joining two. Because there are two foreign keys, there needs to be two indexes
    (instead of one), the indexes memory footprint increases.


    But since this is a relational mapping for a many-to-many relationship, the extra
    table and the increased memory footprint is not the biggest performance issue.
    The algorithm for managing the collection state is what makes any unidirectional
    @OneToMany association less attractive.'
