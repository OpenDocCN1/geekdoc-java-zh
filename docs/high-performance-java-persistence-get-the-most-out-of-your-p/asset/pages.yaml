  md: '# 11.2 @ManyToOne


    @ManyToOne relationship is the most common JPA association and it maps exactly
    to the one-to-many table relationship. When using a @ManyToOne association, the
    underlying foreign key is controlled by the child-side, no matter the association
    is unidirectional or bidirectional.


    This section focuses on unidirectional @ManyToOne relationship only, the bidirectional
    case being discussed with the @OneToOne relationship. In this example, the Post
    entity represents the parent-side, while the PostComment is the child-side.


    As mentioned, the JPA entity relationship diagram matches the one-to-many relationship.


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_197_0.png)


    Figure 1.2: The one-to-many table relationship


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_197_1.png)


    Figure 1.3: @ManyToOne relationship


    Instead of mapping the post_id foreign column, the PostComment uses a @ManyToOne
    relationship to the parent Post entity. The PostComment can be associated with
    an existing Post object reference, and the PostComment can also be fetched with
    the Post entity.


    ```

    @ManyToOne

    @JoinColumn(name = "post_id")

    private Post post;

    ```


    Hibernate translates the internal state of the @ManyToOne object reference to
    the post_id foreign key column value.'
