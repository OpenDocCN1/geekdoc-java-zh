  md: '# MySQL


    Although it implements the JDBC specification, by default, the MySQL JDBC driver
    doesn’t send the batched statements in a single request


    For this purpose, the JDBC driver defines the rewriteBatchedStatements connection
    property, so that statements are rewritten into a single String buffer. In order
    to fetch the auto-generated row keys, the batch must contain insert statements
    only.


    For PreparedStatement, this property will rewrite the batched insert statements
    into a multi-value insert. Unfortunately, the driver won’t be able to use server-side
    prepared statements when rewriting.


    Without setting this property, the MySQL driver will simply execute each DML statement
    separately, therefore defeating the purpose of batching.


    > *http://dev.mysql.com/doc/connector-j/en/connector-j-reference-configuration-properties.html


    The following graph demonstrate how statement rewriting performs against the default
    behavior of the MySQL JDBC driver:


    ![](img/8a123270ec9380e9de699a1d09b2d7ee_44_0.png)


    Figure 4.3: MySQL Statement Batching


    Rewriting static statements seems to make a difference, as long as the batch size
    is not too large. In practice, it’s common to use a relatively small batch size,
    to reduce both the client-side memory footprint and avoid congesting the server
    from suddenly processing a huge batch load.'
