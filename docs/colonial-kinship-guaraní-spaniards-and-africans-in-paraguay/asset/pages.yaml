  md: 'The neologism *cuñados* is an elaboration of the word *cuñado* (brother-in-law)
    and meant something like "brother-in-law-ship." All of this suggests that to understand
    colonial relations in Paraguay, kinship must be redefined.


    Historians and anthropologists have theorized kinship in a variety of contexts
    and their work suggests that universal binaries of versus biological constructions
    of kinship are arbitrary. For example, many people use the term *fictive* when
    kinship is kinship-like, but the term is misleading, for there is nothing imaginary
    about the relationship—the renewals are real. Helen Lambert explains that there
    are indeed "social connections between persons that are collectively recognized
    and enduring, extending beyond individual personal relationships, and as carrying
    rights and responsibilities associated with being related." In light of *fictive
    kinship*, Janet Carmen recommends the term *relatedness* to describe these kinds
    of associations. The term *relatedness* certainly describes some dynamics among
    indigenous peoples of Northern Alaska, where anthropologist Barbara Bodenhorn
    suggests individuals move in and out of kinship relationships depending on the
    care with which they maintain these relationships, by virtue of material offerings
    or emotional investment—kinship requires work. Relatedness also can be applied
    to the colonial world. Jane Mangan notes for colonial Peru that the family could
    be defined as any combination of a family tree, bloodlines, kinship ties, god-parentage,
    and households Extended family networks in large households included not only
    blood relatives but servants, tributaries, and slaves.


    Bringing these insights to bear on colonial Paraguay, Colonial Kinship explains
    how Guarani and Spanish modes of relatedness were transposed onto colonial society.
    Guarani kinship combined with early-modern Spanish notions of the expansive family
    to inform a communal valuation of relatedness, or what the anonymous Jesuit called
    "cuñadazgo." Exploring the construction of these categories and the processes
    by which they came into being requires colonialism in a new light. Conquistadors
    are often remembered as agents of violence and afflictions on indigenous communities,
    and this they were. But colonials also fostered relationships with subordinated
    groups. This book asks how it was possible for Spaniards and Guarani'
