  md: 'construction of "indio" and "negro" corporate-racial categories as imbricated
    processes.


    Nandu''s legal troubles stemmed from an entrenched class of encomenderos dependent
    on indio personal servants. Nandu''s predicament was experienced by many other
    Guarani who tried to escape the grasp of encomenderos, but his experience was
    not universal. In fact, as an indio attached to the Jesuit college, Nandu was
    somewhat of a rarity. This study has disaggregated the Guarani experience and
    demonstrates that many Guarani chose to remain among encomenderos because they
    found security on Spanish chacas. Those Guarani who claimed the various farmsteads
    of Asunción their ''pueblo and reduction'' reflected an adoption of the colonial
    project but perhaps their reasons for doing so go beyond hegemony.


    Cuidadaso was a deeply rooted paradigm of colonial interrelation and provides
    an ethical framework for understanding the actions and behaviors of Guarani and
    españoles. Spaniards envisioned families as expansive networks, and given the
    importance of the brother-in-law relationship among Guarani, Spanish families
    came to include their encomados. Personal service included terror, violence, and
    coercion, but it also included intimacies. Many españoles of indigenous descent
    who learned Guarani from their wet nurses or indigenous mothers grew up in close
    social contact with Guarani servants registered sentiments of relatedness when
    describing each other "tojava" or other Guarani terms of affinal kinship suggests
    that universal colonial categories are insufficient to describe the local speciality


    Traditionally, the fringes have been considered spaces of either indigenous desolation
    or indigenous autonomy; historians have left little room for the overlay of colonial
    institutions with indigenous sociopolitical organization. In Paraguay, the overlay
    produced melding and transformation. Spaniards applied tribute obligations to
    the Guarani practice of affinal integration and the result was cuidadaso. In the
    process, Spaniards and Guarani both experienced ethnogenesis. Kinship paradigms
    from distinct cultures, close social contact, violent encounters on the frontiers
    and borderlands, minimal European immigration, and the vitality of Indian communities
    in reductions were the key components of colonial cultural transformation.'
