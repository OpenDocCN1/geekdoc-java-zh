    # Suits and Sailors: Policing Kinship


    A systematic review of court records from the Asunción National Archive reveals
    a spike between the 1570s and the 1640s. During this period, encomenderos frequently
    sued each other over the possession of an individual, usually female, tributary.
    That Spaniards were embroiled in expensive and lengthy legal lawsuits over a single
    female tributary-cuñadazgo system underscores the importance of Guarani women
    in the encomienda-cuñadazgo system, the persistence of Guarani sociocultural norms,
    and Spaniards'' reliance on these norms to create and maintain viable forces.
