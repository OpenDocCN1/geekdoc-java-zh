    law, they also experienced ethnogenesis and became “Guarani.” Powers describes
    ethnogenesis, the process by which distinct ethnic cultures are recreated over
    time, as a constellation of various factors and forces born of colonialism as
    also of indigenous agency and survival strategies. Guarani ethnogenesis was not
    simply determined by Spanish colonialism but was an expression of Guarani cultural
    agency. The binaries of cultural continuity versus cultural loss do not work here.
