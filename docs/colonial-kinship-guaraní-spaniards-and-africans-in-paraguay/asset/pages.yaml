    # The ran Chaco and Guaicurú Dominance


    As a geographical and ecological space, the Gran Chaco is a large alluvial plain
    sloping towards the Paraguay/Paraná River systems and covers parts of Argentina,
    Bolivia, Brazil, and Paraguay. From the south also the Salado and Dulce Rivers,
    the Chaco extends north to the Mato Grosso plateau. From west to east, the Chaco
    is bounded by the foothills of the Andes Mountains and the Paraná-Paraguay Rivers.
    Scholars subdivide the Chaco into three regions by the three rivers that run across
    it. the southern Chaco extends from the Salado River to the Bermejo River and
    is marked by semiarid steppe vegetation. The vegetation in the central Chaco,
    is denser and dotted with large patches of forest. Finally, the Northern Chaco—where
    Asuncenos and Guarani militias most frequently engaged Chaco groups—extended from
    the Pilcomayo River north to the Apa River. The Northern Chaco was perhaps the
    most difficult impassable palm forests and experienced seasonal floods for a good
    portion of the year. Despite the difficulty of the terrain for Spaniards, various
