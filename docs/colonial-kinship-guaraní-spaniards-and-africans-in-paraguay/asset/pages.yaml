  md: 'Perhaps the most disruptive period of Nandu’s life followed the 1676 bandeira
    invasion of el Redcción. As a frontier and border region, Paraguay Guuaicú attacks
    and bandeirante raids contributed to a great deal of human suffering, violence,
    and migration. These frontier dynamics produced unexpected consequences. Guarani
    militias fostered an independence between Spaniards and Indians as they both sought
    to defend themselves and their communities from raids.

    While Spaniards surely coerced Guarani to participate in these defensive activities—especially
    when it came to constructing and maintaining a defensive apparatus—the military
    militias also produced an alliance and independence. Initial Guarani-conquistor
    relations began with creating a common enemy; throughout the colonial period,
    the heightened threats that Guuaicú and bandeirantes represented a sense of colonial
    community. The numerical importance of Guarani militias when compared to spanish
    underscores a reality about the periphery: the colony would not have survived
    without Guarani soldiers.

    Nandu’s wife, Manuela, was a free mulatta no no surprise given the significant
    population of Africans in Paraguay and the Jesuit college specifically. It might
    seem odd that there were so many African slaves in Paraguay, given Spaniards’
    relative poverty, but it affirms other scholars’ findings that African slavery
    was a fundamental aspect of life in Spanish America. Beyond numerical or economic
    significance, this book has analyzed the relationship between black and indio
    social and legal categories. Because most labor relations were understood within
    the framework of personal service and informed by cunazgo, there were few spaces
    between the Spanish and Indian (e.g., tributary) societal spheres. The 1598 legal
    dispute over Antion two mulatto children (reviewed in the previous chapter) underscores
    encomenderos dependence on Native personal service and their attempts to expand
    the category of indio to as many individuals as possible. Freedom serving under
    ample indicates that indigenous tribute shaped the caste category of “negro” and
    the practice of slavery. At the level of African cultural changes, it is clear
    that African ethnogenesis was heavily influenced by Guarani culture, especially
    in Africans’ use of the Guarani languages. These insights contribute to an expanding
    patchwork constructing the histories of the African diaspora in Ibero-America
    and reinforce the need for historians to analyze the'
