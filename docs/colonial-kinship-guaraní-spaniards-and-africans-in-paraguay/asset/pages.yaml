    **cacique:** A term of Caribbean origins meaning “indigenous leader"

    **corregidor:** Top *indio offi* al a *reducción*

    **criada/o:** Servant

    **guará:** A Group of *teko’a*

    **karai:** Spiritual specialist who is renowned and mobile

    **mandamento:** Governor-mandated infrastructure projects that rely on labor

    **mburavicha:** Supravillage leader

    **mita:** Rotational labor draft

    **mitayo/a:** India who pays the mita

    **monteses:** A Spanish term for unconquered Natives who live in the forests

    **originario:** A term that replaced *yacona* and described an encomienda

    indio/a* who resided permanently with *españoles*

    **pajé:** Spiritual specialist

    **teko’a:** Grouping of villages or a single village will multiple *teyý*

    **tecyÿ:** Originally “brother-in-law”, but in the colonial context came to imply
    all male-male, *español*-Guarani affinal kinship relationships

    **tuvichá:** Leader of a village or lineage

    **yaconoma:** A term of Andean origins that in Paraguay describes an encomienda
