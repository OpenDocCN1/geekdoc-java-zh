    eastern frontier, and Guuaicurú on the western frontier, Paraguay was hemmed

    in by enemies. Reducciones and towns retreated from the peripheries to

    occupy places closer to the administrative center of Asunción and the major

    Guarani reducciones of the region. The rapid ascension of Guaicurí power,

