    # The unauthorized authority of Guarani Leaders


    Given the withdrawal of Franciscans from many reductions and the pathetic presence
    of secular priests, much of the administration of the Indian towns was left to
    indigenous leaders. Managing social relations, tributary duties, economic activities,
    and continual religious observances in mission towns averaging around one thousand
    souls required a strong leadership structure. Indigenous leadership in Guarani
    reductions was similar secular, Franciscan, and Jesuit reductions, although future
    studies will surely define the finer points of variation. When a reduction was
    founded, the friars identified the most prominent leader or leaders and attempted
    to overlay the new authority of the reduction onto the traditional authority of
    the tuvihá. As the community developed, priests dispersed power to a variety of
    other indigenous officials. Initially, these leaders negotiated the new relationship
    between the community and the priests, and if priests could advance rapidly. Writing
    about the founding of the San Ignacio Guazú, the Jesuit Father Lorenzana explained
