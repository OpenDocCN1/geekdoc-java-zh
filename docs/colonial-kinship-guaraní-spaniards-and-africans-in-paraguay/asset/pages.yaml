    While male Guarani tributaries are the focus in official records, women also performed
    a tremendous amount of labor. At contact, most agricultural work was performed
    by women, but the gendered division of labor gradually changed as men were incorporated
    as servants on the conquistadors and later encomenderos farmsteads. Spanish law
    stipulated that nonnoble male indios between the ages of eighteen and fifty pay
    tribute. Female indios were ostensibly exempt from tribute in the form of personal
    service because it provided too many opportunities for sexual relationships. The
    legal definition of tribute as male was largely ignored and women followed their
    husbands on the mita and served alongside in agricultural, spinning, and other
    domestic tasks. Female Guarani also acquired labor tasks that, according to Spanish
    officials, were appropriate to their sex, especially cloth production. Spinning
    and weaving became important tasks for women across all the Guarani reductions
    during the colonial period. Officials and overseers called ladies engaged in spinning
    tasks *hilanderas*. Karen Grabaut analyzes the gendered reorganization of labor
    in the colonial Andes and demonstrates that in pre-Columbian society weaving became
    to be gendered as a female activity.^{61} In contrast to Andean societies, weaving—under
    the new colonial order—was not a high priority for the Tupi-Guarani at the time
    of contact and, while they produced cloth, it is unclear if it was strictly gendered
    as female work.^{62} But for Spanish governors who recognized the absolute necessity
    of female labor within the legal framework of the encomienda, which defined tribute
    as male only, spinning was an ideal form of female indigenous labor because women
    would not be required to perform their labor. Spanish officials and encomenderos
