  md: 'tribute in personal service to encomenderos demographically dynamic spaces.
    So, while the reducciones remained spaces of indigenous community, they were not
    fortresses against outside society. In fact, the pueblos were more like magnets
    that could once repel and attract. Indios came and went from the reductions for
    a variety of reasons. The travel in and out of the reductions was not limited
    to india, for espanoles and blacks were also frequent visitors to the pueblos.
    The effect of this movement of people, goods, and capital on the reduction as
    an institution is the subject of this chapter.


    # Surveying the Colonial Economy


    As the yerba market picked up steam in the early seventeenth century producers
    and traders demanded more laborers, Spanish vecinos in Asunción sought to gain
    access to Guarani in. The provincial capital in closest proximity to Mbaracayú,
    Asunción was poised to become a regional powerhouse. By Asunciones'' access to
    labor in the reducciones suffered severe restrictions in the first quarter of
    the seventeenth century. First, don Alfonso''s visit in 1611 initiated a string
    of legislation that restricted encomenderos'' use of mita laborers. Second, in
    1617 the crown divided the Province of Gran Paraguay to create the Province of
    Buenos Aires, which included Corrientes and Santa Fe as its most important cities.
    The governorship of Paraguay was reduced to Asunción. Villa Rica and Ciudad Real.
    These jurisdictional shifts paralleled the shift in economic power from Asunción
    to other key cities in the region. Santa Fe, Buenos Aires, and Tucumán became
    the main hubs for inter- and interregional trade, cattle hides, tobacco, honey,
    wax, wine, and crude cloth Paraguay remained a supplier of raw materials. In the
    sixteenth century, cattle remained destined for regional markets. With their profits,
    Paraguayan vecinos and reducciones purchased iron, tools, slaves fine cloth, clothing,
    and wheat.


    By the seventeenth century, yerba maté had caught on in the Río de Plata and Peru,
    despite weighty warnings against its perceived addictive and degenerative effects
    on Christians. The tea became a staple throughout Paraguay and a desired import
    in places like Potosí, Santiago de Chile, and even Mexico City. By the 1630s,
    yerba maté overtook sugar and wine as'
