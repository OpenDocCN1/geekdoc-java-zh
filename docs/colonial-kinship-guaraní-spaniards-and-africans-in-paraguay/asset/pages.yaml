  md: '# From Regular to Secular


    The development of the regional economy and the rise of the yerba maté trade paralle
    the increasing influence of encomenderos over reducciones in Paraguay. Table 3
    shows the institutional affiliation of the principal reducciones by encomienda
    service. Out of a total of fourteen reducciones founded under Franciscan supervision,
    only four remained Franciscan by the end of the seventeenth century. This secularization
    was the effect of the lack of priests and pressure from the encomender class to
    more pueblos under secular administration. Guarani leaders became embroiled in
    the disputes over the secularization of their reducciones and lobbied to pursue
    their priests.¹¹


    A rare record of a conflict at Yaguarón in 1622 illustrates how actors on different
    sides pursued their interests. Yaguarón was founded by the Franciscan fathers
    Luis de Bolaños and Alonso de Buenaventura in 1586. The pueblo remained under
    Franciscan leadership until Bolaños appointed a trusted priest for the pueblo,
    Hernando de la Cueva, to serve in Yaguarón for a time, presumably before 1600.
    When de la Cueva died in 1622, Franciscan leaders had arranged for one of their
    own to reside in the reducción. Spanish vecinos claimed that the bishop appointed
    a Dominican as interim priest, but the Franciscans had arranged otherwise. Spanish
    neighbors claimed that the Franciscans had "violently and forcibly" taken control
    of Yaguarón and evicted the bishop-appointed interim cleric. The vecinos obviously
    had ties to the bishop-appointed priest while the Franciscans wanted to hold onto
    the reducción. But what did the indigenous leadership think of the matter? A report
    from the pueblo''s indigenous cabildo tells us that the indigenous leaders supported
    Franciscan sponsorship of their community. When de la Cueva died, the Guarani
    cabildo of Yaguarón sent messengers directly to Caazá to petition the Franciscan
    visitador and request a Franciscan priest.¹² In their written petition, the members
    of the cabildo argued because Franciscans had helped found the reducción, a Franciscan
    should remain its priest.


