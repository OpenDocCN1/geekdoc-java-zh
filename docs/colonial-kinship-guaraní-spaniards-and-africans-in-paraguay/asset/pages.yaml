    # Beyond the Missions


    Historians and ethnohistians have generally studied Guarani in colonial Paraguay
    from the perspective of either the Jesuit or the Franciscan religious orders,
    with far greater emphasis on the former. This book takes a different methodological
    tack. Rather studying Guarani under a specific religious umbrella (a paradigm
    that carries its merits) and solely within mission towns, Colonial kinship focuses
    on Guarani in contexts of contact and exchange with Africans, and people of descent
    in reducciones and Spanish cities, especially the provincial capital of Asunción.
    Many Guarani moved “in between” residing with their encounters during periods
    of labor, deciding on their own to leave and reside elsewhere, changing reductions,
    or relocating because frontier violence. Centering on Guarani outside and in between
    the missions demonstrates that colonial Guarani culture was not a phenomenon unique
    to the reductions.


    This does not mean that reductions were unimportant; rather, it means that many
    reductions were permeable and imbricated with cuñadazgo. Liam Hanks shows that
    the noun reduction and the verb reducir(se) reflected a colonial vision of cultural
    change. changing their characters, their societies, and even their languages to
    adhere to Catholic-Spanish values.¹³ In the minds of many colonial administrators
    and priests, reductions were more than Indian towns; they were carefully planned
    “republic-utopias” that would generate Indian-Christian civilization.¹⁴ The crown
    promoted the reduction as the privileged site of Indian sociocultural identity
    and feared that Guarani outside the reduction would degenerate, lose their Indian
    tribute status, and fail to cultivate Catholic virtues. To deflect conflict from
    crown officials, encomenderos and Guarani alike applied “reducción” to the encomienda
    and cuñadazgo.


    This methodology hinges on an incredible body of historical work. It is no'
