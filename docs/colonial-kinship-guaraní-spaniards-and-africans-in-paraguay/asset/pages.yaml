  md: 'wonder that scholars have focused on the Jesuit mission enterprise: at their
    apogee in 1732, the Jesuits oversaw thirty reducciones totaling 141,182 Indians,
    compared with Franciscan and secular reductions from a similar period, which totaled
    eighteen with 20,000 individuals.¹15 The demographic strength of the Guarani-Jesuit
    reducciones was evidence that reduction was a success. Demographically, the Jesuit
    missions are compelling, but a de institutional "tunnel vision" characterizes
    early studies, which draw primarily on Jesuit sources and channel Jesuit perspectives.¹16
    These works focus on political and economic progress in the region of La Plata
    rarely consider how Guarani agents were in the construction of the missions.¹17
    More recently, scholars have paid attention to indigenous peoples, focusing on
    Guarani cultural change.¹18 Emphasizing the power of Guarani in their interethnic
    contexts, others demonstrate that Jesuits deployed spiritual and political authority
    in order to attract adherents. The reductions inhabited a liminal space in which
    Guarani religion and Christianity mirrored each other; priests became shamans,
    shamans became priests.¹¹⁹ Linguists and anthropologists have examined Guarani-language
    records to understand Guarani expressions of power and political identity.¹⁰ Others
    find indigenous actors at the center of the missions reveal that the Jesuits were
    not effective in creating communist paradises but that Guarani worked out their
    own rhythms of daily life in the missions.¹²¹ The reductions revealed the interplay
    between imperial imperatives and ethnogenesis. Under the influence of Jesuits
    and Spanish officials, an indigenous leadership structure developed that only
    partially the cultural practice of leadership. Thus, there was plenty of disagreement
    among Guarani populations over how to manage the reduction communities and differing
    levels of dedication to mission work and life.¹²² Historical work on the period
    after the Jesuit expulsion in 1760 up to independence revealed the ways Guarani
    responded to Bourbon liberal policies and sweeping political changes, which included
    degrees of cooperation, resistance, and migration.¹²³


