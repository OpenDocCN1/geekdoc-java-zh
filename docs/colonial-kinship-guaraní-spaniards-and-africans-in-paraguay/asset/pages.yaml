    On that day, the town bustled with activity and anticipation as encomenderos and
    Guarani servant-tributaries entered the plaza and waited to see the official,
    Juan de Ibarra Velasco. Once the visit got underway, an encomender named Juan
    Cristaldo and the four Guarani of his encomienda called up. Ibarra instructed
    the encomender to step outside in order to take the Indians'' true account of
    his behavior, without fear of retribution. The official spoke over the sound of
    the notary''s incessant scribbling to encourage the Guarani to speak the truth
    and not withhold any information that might be seen as damaging to their encomender.
    After assurances, the official proceeded to ask the Guarani if Cristaldo paid
    them sufficiently and gave Sundays to rest or if he physically abused them. If
    there was a chance to complain about mistreatment who had been under the Spanish
    labor regime was the moment Guarani did not hesitate to voice their grievances.
    On this day, the four Guarani had nothing to report about their encomender. In
    their native tongue and with the help of a translator they explained that they
    were “very content” with their encomender for “he is our kin, treats us like brothers-in-law.”^5
    They further explained that their encomender “divides what has with us,” suggesting
    that material benefits were important to the tributary-kinship relationship.


    The brother-in-law (*tojava*) relationship in Guarani society was important because
    it was the primary way of incorporating outsiders into a kinship group and it
    implied reciprocal benefits. In the colonial period, *tojava* acquired new meaning.
    In one of the first Spanish stories about Paraguay, Ruiz de Guzmán (of Spanish
    and Guarani descent), writing around 1612, noted that since the conquest era,
    conquistadors and their descendants used the word *tojava* to refer to the Indians
    of their encomiendas.^^6 Spaniards’ use of Guarani terminology was the tip of
    the iceberg and represented a long historical experience whereby translated Guarani
    modes of kinship were applied to colonial systems of tribute. Around the same
    time that de Leonoy composed his history, a Jesuit priest, writing anonymously
    to his superiors, concluded that the “founding [of Asunción] was completed by
    means of *cuññados* by conquest.'
