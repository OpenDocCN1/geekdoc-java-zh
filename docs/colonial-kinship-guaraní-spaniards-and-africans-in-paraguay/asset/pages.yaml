    # Border Flux


    Excellent historical scholarship on the Jesuit reductions in the Portuguese-Spanish
    borders of Tapé in the late seventeenth and eighteenth centuries describes the
    many treaties, geopolitical factors, and local actors that made that space a dynamic
    Spanish-Portuguese border. The borderland conflicts in seventeenth-century Guairá
    did not share all the same dynamics, especially when it came to m own interests
    in defining borders. While the 1494 Treaty of Tordesillas provided a vague demarcation
    of imperial territory, local officials on either side largely ignored it. For
    Paulistas, territorial boundaries meant little; the small population of Guairá
    also sought labor, but they pursued it through cunago, not enslavement me. The
    Jesuits, for their part, sought to create fixed communities and navigated these
    three areas to safeguarded from Paulista enslavement, becoming pitted against
    groups each other in order to acquire allies, kin, and metal tools.


