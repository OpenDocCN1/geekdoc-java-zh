  md: '# Chapter 6


    # Beyond the Missions


    Guarani Reducciones in Asunción''s Orbit


    This book has examined the themes of kinship, frontiers, shamanic resistance,
    and militias but has not yet focused on economic, political, and social life in
    the reductions. The vast majority of studies of Guarani treat the Jesuit reductions,
    but this chapter shifts focus to reductions subject to Asunción encomenderos,
    which included Franciscan, secular, and a handful of Jesuit reductions. Analyzing
    missions across jurisdictional boundaries runs the risk of flattening reductions,
    but this is not the intention. Institutional affiliations profoundly affected
    a community''s religious, economic, and social life. However, there is strong
    evidence that encomienda was an enduring aspect of colonial life, and therefore
    all reductions that were touched by it merit consideration together. So, while
    institutional boundaries (e.g., Franciscan, Jesuit, and secular) are a fruitful
    way analyzing reductions, this chapter examines the impact of the economy and
    encomienda on a variety of Guarani communities in Asunción''s political orbit.^1


    This chapter is by no means a comprehensive treatment of reductions within the
    regional economy; instead, it focuses on fluidity and political and social divergence
    within the reductions. Specifically, it addresses the themes of shifting jurisdictional
    status of the reductions, the fraught position of indigenous leaders, absenteeism,
    and mestizaje. Historical work on the Jesuit reductions has tended to describe
    the integration of reductions into the regional economy as the primary factor
    explaining their disintegration, leaving little room for an understanding of how
    Guarani contended with each other and with society outside the reductions to shape
    their communities.^2 All of this change was compounded over time by the fluidity
    of the reductions. Unlike their Jesuit counterparts, the reductions that paid-'
