    # Conclusion


    Africans and their descendants were a common feature in Paraguayan society. They
    mixed with yanaconas on Spanish farmsteads, found partners in the pueblos, labored
    on the religious ranges and workshops, worked on yerba mate transports, and fostered
    royal authorities as. Blacks were integrated into the encomienda yanacona, the
    logic of encomienda, personal service, and relatedness were applied to inform
    how they experienced community. In his analysis of colonial Yucatán, Matthew Restalls
    identifies potential "bases of community" for people of color: culture and religion
    of African origin, Christian identity, ethnic or racial classifications, occupation,
    kinship and family life, and location. Applying these categories to Paraguay,
    the first three are very difficult to analyze given the lack of ecclesiastical
    records. While there is evidence that blacks participated in the parish of San
    Blas with others, there are no extant records that tell us about their participation
    in religious sodalities or other religious activities. When it comes to racial
    and ethnic categories, the data is likewise very thin, but future research based
    on documentation from the eighteenth and nineteenth centuries will certainly shed
    new light on the topic Regarding the last three categories, this chapter has demonstrated
    that blacks were employed in an array of actors alongside indios. Kinship and
    the locations of blacks were linked: Afro-Guarani unions were frequent because
    of their constant interaction with yanaconas and milizos.


