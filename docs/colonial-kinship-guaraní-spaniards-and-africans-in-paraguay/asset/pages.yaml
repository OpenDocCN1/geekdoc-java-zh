  md: '# Introduction


    A little more than kin, and less kind.


    > —Shakespeare, Hamlet el., 1.27


    “He is our kin.” Nearly a century after Spaniards had established a colonial presence
    in Paraguay, a Guarani Indian speaking through a translator said this about his
    Spanish encomienda (a grantee of Indian tribute), but according to Western notions
    of kinship, the encomienda was not a relative to his Indians. What is more, encomenderos
    unequivocally exploited Guarani for their labor and sometimes physically abused
    them, behaviors we would not expect from family. Nonetheless, the Guarani, as
    other Guarani throughout the colonial period, regularly described their encomenderos
    as relatives. Even more surprising is the fact that the encomenderos frequently
    used Guarani kinship terminology to describe the Guarani who served them. Colonial
    Kinship explores the nuances of colonialism and nationalism intertwined in Paraguay
    the multidirectional nature of cultural change and describes the early evolution
    of Guarani ethnic communities in the Spanish city of Asunción and in Indian mission
    towns or reductions from the 1530s to the turn of the eighteenth century. While
    disease, Catholic evangelization, and Spanish labor collectively precipitated
    social and cultural changes among changed Spaniards and their colonial institutions.
    When conquistadors arrived in Paraguay in 1537 Guarani adopted them as brothers-in-law.
    Conquistadors drew on these brothers-in-law networks to acquire female “wives”
    who labored for them and who became their sexual partners and victims. In this
    confluence of'
