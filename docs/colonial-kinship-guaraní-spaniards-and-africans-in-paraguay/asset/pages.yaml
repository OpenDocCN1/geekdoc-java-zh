    Paraguay''s biggest export.⁶ The colonial governorship of Paraguay competed with
    the Jesuit reductions for dominance in this market, but the Jesuits overcame Asunción
    in the eighteenth century. Nevertheless, yerba mate remained the strongest product
    in the Paraguayan economy. In fact, yerba mate served as the primary coinage for
    the royal treasury in Asunción and Paraguay generally. slaves, cattle, and labor
    were all sold in quantities of yerba (one arroa around twenty-five pounds of tea).⁷


    As other export economies in colonial Spanish America, the groups that stood to
    gain the most from any primary export were the intermediaries, not exploiting
    the resources. The vicinos from Asunción, slaves, and Guaraní mitayos from the
    reductions were the ones organized yerba mate expeditions, collected the leaves,
    toasted them, bagged them, and transported them on barges or mules; they received
    only the smaller compensation. As they moved out of Asunción, the gains on the
    tea grew. The yerba mate trade initiated in Asunción moved south, either on the
    Paraguay and Paraná Rivers or overland on mule carts, to Corrientes and Santa
    Fe. From Santa Fe, the tea was sent south to Buenos Aires or to Tucumán, then
    to Peru and beyond. The traders and mercaderes who moved the yerba mate along
    this route for various lengths of its journey were primarily from Buenos Aires,
    Tucumán, Santa Fe, and Corientes. Most Asunños lacked the capital and the social
    connections to break into the trade beyond Asunción. Traders involved in the production
    and transportation of yerba mate at its earliest stages maintained connections
    with the Paraguayan governor and local officials. Many spent a considerable amount
    of time in Asunción, where they owned houses and ran. While most of these were
    residentes, not vicinos, thereby limiting their access to local political office,
    they nevertheless gained important patronage networks with city officials and
    the Paraguayan governor—who frequently resided in Corrientes, Santa Fe, or Buenos
    Aires—these traders gained access to the yerba mate groves.


