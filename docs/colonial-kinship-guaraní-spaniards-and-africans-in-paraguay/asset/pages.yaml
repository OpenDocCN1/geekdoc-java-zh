  md: '# 8 Introduction


    city make Asunción an ideal location for studying Guarani. As the hub for the
    legal and judicial management of the region, the city and its society generated
    litigation, wills, censuses, registers, petitions, and official correspondence,
    providing rich descriptions of interethnic relations in the region. The most underutilized
    of these records in the scholarship is litigation. This book draws on 350 heretofore
    examined litigation files from Asunción and Villa Rica as hundreds of other sociocultural
    records to provide an account of social relations and cultural change. Whereas
    previous narratives have emphasized Spanish violence, litigation reveals Guarani
    actively negotiating, contending, and cooperating with Spaniards. Importantly,
    litigation uncovers Guarani voices in the form of complaints, defenses, and depositions.


    In this rich body of documentation, we hear individuals who have remained relatively
    silent in the priestly sources: women as the link between Guarani Spanish sociopolitical
    worlds, crucial laborers, and mothers to the second generation of mestizo conquistadors.
    Guarani women played a vital role in the history of Paraguay. Like Hassig’s study
    Colonial Kinship asserts that Guarani women were the "dark matter" of Guarani
    history.^33 The dearth of research on Guarani women is largely a result of the
    emphasis on male authority in the ecclesiastical records, for priests commented
    on women they often did so with great moral anxiety.^34 Fixed on eliminating the
    practice of polygyny and creating a male leadership structure in the reducciones,
    Spaniards rarely commented on women.^35 By contrast, Spaniards were constantly
    in contact with women as sexual partners, personal servants, and political allies.
    Litigation reveals that encomineros fought each other for access to Guarani women
    and demonstrates that they were the linchpin of the labor regime until the seventeenth
    century. As Guarani societies experienced changes in the reductions, men replaced
    women as the primary agriculturalists. Even so, women continued to be counted
    in censuses and were, by all accounts, tributaries, serving in Guarani households
    as domestics or as producers of cotton. The transformation of labor among Guarani
    was a gendered process influenced by both Spanish and Guarani cultural logics.


    Apart from constituting a crucial source for the construction of a social history
    of Guarani, litigation records provides insights into colonial'
