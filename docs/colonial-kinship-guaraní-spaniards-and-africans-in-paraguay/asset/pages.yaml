  md: '# Introduction


    coercion and negotiation, Guarani transformed the newcomers into polyg-

    amous\u00conquistadors.


    The scholarship on Guarani peoples subject to the Spanish encomienda has characterized
    their experiences as slave-like, but this assumes that the experience of servitude
    was universal and ignores the ways that indigenous patterns informed colonial
    practice. All forms of servitude and coerced servitude must be understood in its
    local context. In treating indigenous slavery in colonial New Mexico, James Brooks
    outlines a "borderer kinship" which moved slaves in out of New Mexican and Native
    households within networks of violent capture, trade, guardianship, or inheritance.
    In the case of Guarani, colonial tribute of "relatedness" was borrowed from cultural
    degrees of coercion and nuanced gradients. The paradigm of cultural exchange in
    Paraguay, therefore, is not an example of what James Lockhart calls mistaken identity,"
    in which cultural exchange assumes that a given form or concept is the familiar
    way within its own tradition and is unaware or by the other side''s interpretation.ä
    Even if they were anxious about it, most conquistadors knew what they were doing
    when they became kin to Guarani communities. Moreover, the conquistador soci-ety\u9
    rapid adoption of the Guarani language precluded it from remaining ignorant of
    the cultural meanings of these exchanges. In this way, colonists willingly transposed
    the Guarani social meanings of polygamy, or what Spaniards saw as a kind of concubinage,
    onto a colonial institution for tribute extraction, the encomienda. But even encomenderos
    relied on poly-amous Guarani social organization to channel women to affinal kin,
    priests labored to eradicate it and enforce monogamy. The result was that by the
    1640s, an encomienda system emerged that phased out kinship between conquistadors
    and Guarani but was nonetheless bound together by an ideology of relatedness.


    This book tells a story of how kinship became enmeshed with colonial governance.
    The Guarani man cited at the opening of this chapter who identified his encomendero
    as his kin is an important example for it is a snapshot of Spanish-Guarani relations
    within the encomienda after the institution had matured. The Guarani''s statement
    was recorded on March 11, 1652, during a visita or inspection of encomienda Indians
    in the small city of Villa'
  merge: -1
