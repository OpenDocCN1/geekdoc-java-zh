    # The Indio República en Asunción


    Throughout Spanish America, urban indios generated community and shared identity
    through a variety of institutions. These institutions were a result of indios''
    own initiatives, as well as the Spanish crown''s vision of maintaining two segregated
    populations of españoles and indios. Spaniards referred to the corporate identities
    of españoles and indios with the concept of separate republics or sociopolitical
    spheres: *república de los españoles y de los indios*.⁵² The concept of separate
    republics allowed indigenous institutions to continue, albeit in modified forms,
    in colonial spaces and shape colonial identity. The concept of separate republics
    led Spanish officials to try to separate populations in cities and keep indios
    out of reducciones. These efforts largely failed, and mixture became normative.
    Even so, in places Lima and Mexico City, many indios resided in neighborhoods
    and worshipped in parishes assigned to their corporate identity. Indios of higher
    status organized *coffradías* (religious sodalities) to venerate particular saints,
    organize religious festivals, and elevate members'' statuses. Spanish American
    cities also hosted indigenous cabildos and guilds of indigenous artisans. Some
    indigenous communities also organized militias, like la Ciudad vieja community
    in Guatemala, which represented its illustrious status as a coniquistador community
    in Santiago de Guatemala''s Fiesta de Volcán, a celebration of the Spanish victory
    over local Natives.³³ Throughout the Americas, indios maintained an important
    institutional and corporate presence in cities.


    While the indigenous institutions of Asunción are almost completely absent in
    the documentary record, evidentiary fragments suggest an outline.'
