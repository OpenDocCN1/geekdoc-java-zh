  trans: "\n\n决策结构用于在条件为真时必须执行一组指令，而在条件被认为为假时必须执行另一组指令的情况。在 Java 中，有几种结构可以用于此类此类场景。这些结构包括：\n\
    \n### If 语句\n\n该语句用于必须测试条件的情况，如果条件为真，则必须执行该语句后续的代码块。该结构的语法如下：\n\n```\nif (condition)\
    \ {\n//正体\n}\n```\n下面是该结构的实现示例：\n```java\npublic class ifDemo {\n    public static\
    \ void main (String args []) {\n        int i = 10;\n        int j = 1;\n    \
    \    if (i> j) {\n            System.out.print(i);\n        }\n    }\n}\n```\n\
    \n### Else 语句\n\n该语句用于必须测试条件的情况，如果条件为真，则执行该语句之后的代码块，否则将执行 `else` 之后代码块。该结构的语法如下：\n\
    \n```\nif (condition) {\n//正体\n}else {\n//正体\n}\n```\n下面是该结构的实现示例：\n```java\n\
    public class ifElseDemo {\n    public static void main (String args []) {\n  \
    \      int i = 1;\n        int j = 0;\n        if (i> j) {\n            System.out.print(i);\n\
    \        }else {\n            System.out.print(j);\n        }\n    }\n}\n```\n\
    \n### 嵌套 if 语句\n\n该语句用于必须测试条件的情况，如果满足了条件，则执行该语句之后的块，否则将测试下一个条件。如果发现此条件为真，则执行与该条件对应的\
    \ `if` 语句的语句块。如果两个条件都不满足，则执行 `else` 之后的代码块。使用嵌套 `if` 语句可以测试许多条件。该结构的语法如下：\n\n\
    ```\nif (condition1) {\n//正体\n}else if (condition2) {\n//正体\n}else {\n//正体\n}\n\
    ```\n下面是该结构的实现示例：\n```java\npublic class nestedIfDemo {\n    public static void\
    \ main (String args []) {\n        int i = 0;\n        int j = 0;\n        if\
    \ (i> j) {\n            System.out.print(i);\n        }else if (j> i) {\n    \
    \        System.out.print(j);\n        }else {\n            System.out.print (\"\
    Equal\");\n        }\n    }\n}\n```\n\n### Switch\n\n如果你有一个变量，并且需要根据该变量的不同值执行不同的代码块，那么理想的结构是\
    \ `switch` 语句。该结构的语法如下：\n\n```\nswitch (variable) {\n    case <value1>:\n    \
    \    //正体\n        break;\n    case <value2>:\n        //正体\n        break;\n\
    \    case <value3>:\n        //正体\n        break;\n    default:\n        //正体\n\
    \        break;\n}\n```\n下面是该结构的实现示例：\n```java\npublic class switchDemo {\n  \
    \  public static void main (String args []) {\n        int i = 5;\n        switch\
    \ (i) {\n            case 0:\n                System.out.print(0);\n         \
    \       break;\n            case 2:\n                System.out.print(2);\n  \
    \              break;\n            case 5:\n                System.out.print(5);\n\
    \                break;\n            default:\n                System.out.print(99);\n\
    \                break;\n        }\n    }\n}\n```\n\n### 三元运算符\n\nJava 还支持条件运算符，也称为\
    \ `?:` 运算符。该运算符用于替代 `if else` 结构。其语法如下：`expression1?expression2:expression3`，其中\
    \ `expression1` 是要测试的条件。如果条件为真，则执行 `expression2`，否则执行 `expression3`。\n\n### 循环\n\
    \n有几种情况需要重复执行某组指令。例如，如果你想对一组数字进行排序，你必须多次扫描并重新排列该集合，以获得你想要的布局。这种执行流被称为循环。简单的循环是一种允许你多次执行某块代码的结构。Java\
    \ 支持几种可以用于实现循环的结构。这些包括 `while` 循环、`for` 循环和 `do while` 循环。\n\n`while` 循环不断迭代块，直到为\
    \ `while` 循环指定的条件为真。一旦该条件失败，循环就会停止。\n\n`for` 循环允许程序员在同一个结构中操纵条件和循环变量。因此，你可以初始化一个循环变量，增加/减少它，并运行循环，直到该变量上的条件满足为止。\n\
    \n`do while` 循环与 `while` 循环类似。然而，在 `while` 循环中，条件是在执行块之前进行测试的。另一方面，在 `do while`\
    \ 循环中先执行代码块，然后测试条件。如果条件为真，则重新初始化循环执行，否则循环终止。可以说，`do while` 循环一旦实现，至少会执行一次。\n\n\
    ### 循环语句\n\n有两个关键字专门与循环结合使用，它们也被称为控制语句，因为它们允许你将控制权从代码的一个部分转移到另一个部分。这些关键字是：\n\n\
    #### Break\n\n该关键字用于循环内部，位于你想要结束循环的地方。\n\n#### Continue\n\n该关键字用于循环内部，位于你希望跳过循环剩余部分并跳转到下一次的地方。\n\
    \n为了帮助你理解循环是如何执行的，让我们使用三种循环类型来实现。\n\n#### For 循环实现\n```java\npublic class forDemo\
    \ {\n    public static void main (String args []) {\n        int[] numArray =\
    \ {100, 300, 500, 700, 900};\n        for (int i = 0; i < 5; i ++) {\n       \
    \     System.out.print(numArray[i]);\n            System.out.print(\",\");\n \
    \       }\n        System.out.print(\"\\n\");\n    }\n}\n```\n\n#### While 循环实现\n\
    ```java\npublic class whileDemo {\n    public static void main (String args [])\
    \ {\n        int[] numArray = {100, 300, 500, 700, 900};\n        int i = 0;\n\
    \        while (i < 5) {\n            System.out.print(numArray[i]);\n       \
    \     System.out.print(\",\");\n            i++;\n        }\n        System.out.print(\"\
    \\n\");\n    }\n}\n```\n\n#### Do while 循环实现\n```java\npublic class doWhileDemo\
    \ {\n    public static void main (String args []) {\n        int[] numArray =\
    \ {100, 300, 500, 700, 900};\n        int i = 0;\n        do {\n            System.out.print(numArray[i]);\n\
    \            System.out.print(\",\");\n            i++;\n        } while (i <\
    \ 5);\n        System.out.print(\"\\n\");\n    }\n}\n```\n\n### 增强型循环\n\nJava\
    \ 还支持用于数组元素的增强型循环。该循环的语法如下：\n\n```\nfor (declaration:expression) {\n    //正体\n\
    }\n```\n增强型循环的 `declaration` 部分用于声明变量。该变量应该是 \"for\" 局部的，并且必须与数组元素的类型相同。变量的当前值始终等于循环正在遍历的数组元素。`expression`\
    \ 是数组或对返回数组的方法调用。\n\n下面是增强型循环的实现示例：\n\n```java\npublic class arrayDemo {\n   \
    \ public static void main (String args []) {\n        int[] numArray = {100, 300,\
    \ 500, 700, 900};\n        for (int i: numArray) {\n            System.out.print(i);\n\
    \            System.out.print(\",\");\n        }\n        System.out.print(\"\\\
    n\");\n    }\n}\n```\n\n### 异常层次结构\n\nJava 有一个内置类名为 `java.lang.Exception`，所有异常都属于该类。所有的异常类都是该类的子类。\n\
    \n此外，`Throwable` 类是 `Exception` 类的类。\n\n"
- fmt: "\nThe `Exception` class has two subclasses, namely the `RuntimeException`\
    \ class and the `IOException` class. Below is a list of methods for which definitions\
    \ are available in Java as part of the `Throwable` class.\n\n```java\npublic String\
    \ getMessage ()\n```\nWhen invoked, this message returns a detailed description\
    \ of the exception encountered.\n\n```java\npublic throws getCause ()\n```\nThis\
    \ method, when called, returns a message containing the cause of the exception.\n\
    \n```java\npublic String toString ()\n```\nThis method returns a detailed description\
    \ of the exception combined with the class name.\n\n```java\npublic void printStackTrace\
    \ ()\n```\nThe result of the `toString()` method, along with the stack trace,\
    \ can be printed to the standard `System.err` error stream by calling this method.\n\
    \n```java\npublic TraceElement [] getStackTrace ()\n```\nThere may be some scenarios\
    \ where you may need to access different elements of the stack trace. This method\
    \ returns an array where each element of the stack trace is written to different\
    \ elements of the array. The first element of the array contains the top element\
    \ of the stack trace, while the bottom of the stack trace is written to the last\
    \ element of the array.\n\n```java\npublic Throwable fillInStackTrace ()\n```\n\
    Appends the previous information in the stack trace to the current contents of\
    \ the stack trace and returns the same as the array.\n\n### Catching exceptions\n\
    \nThe standard method of catching an exception is to use \"try and catch\" keywords\
    \ along with their code implementations. This try and catch block must be implemented\
    \ in such a way that it contains the code that is to throw the exception. It should\
    \ also be mentioned here that the code that is supposed to raise the exception\
    \ is referred to as protected code. The syntax for implementing a try and catch\
    \ block is as follows:\n\n```java\ntry {\n    /* Protected code */\n} catch (exception\
    \ name ex1) {\n    /* Catch code */\n}\n```\n\nThe code to throw the exception\
    \ is placed in a try block. If an exception is thrown, the appropriate action\
    \ to be performed to handle the exceptions is implemented in the catch block.\
    \ It is imperative that each try block contains a catch block or an end block.\n\
    \nWithin the catch statement, you must declare the exception to be thrown. If\
    \ an exception occurs, execution is transferred to the catch block. If the exception\
    \ thrown matches the exception defined in the catch block, the catch block is\
    \ executed.\n\nAn example implementation of a try and catch block is given below.\
    \ The code implements an array with 2 elements. However, the code tries to access\
    \ a third element that does not exist. As a result, an exception is thrown.\n\n\
    ```java\nimport java.io.*;\n\npublic class DemoException {\n    public static\
    \ void main (String args []) {\n        try {\n            int arr = new int [2];\n\
    \            System.out.println(\"Access to third array element:\" + arr[3]);\n\
    \        } catch (ArrayIndexException ex) {\n            System.out.println(\"\
    Catching exception:\" + ex);\n        }\n        System.out.println(\"reached\
    \ outside of block\");\n    }\n}\n```\n\nImplementing multiple catch blocks can\
    \ lead to many exceptions. In order to meet this requirement, catch blocks are\
    \ also allowed. The syntax for such implementation is given:\n\n```java\ntry {\n\
    \    /* Protected code */\n} catch (Type1 ex1) {\n    /* Catch 1 */\n} catch (Type2\
    \ ex2) {\n    /* Catch 2 */\n} catch (Type3 ex3) {\n    /* Catch 3 */\n}\n```\n\
    \nThe syntax above illustrates the implementation of multiple catch blocks. However,\
    \ you can implement as many catch blocks as you like. When this code is executed,\
    \ protected is executed. If an exception occurs, the exception type is matched\
    \ except the first catch block. However, if the type of exception does not match,\
    \ catch1 is ignored and the exception type for the second catch block is tried\
    \ to match. Whoever catch block has the same type as the exception thrown; the\
    \ appropriate catch block is executed.\n\n![Image](images/image-22.jpeg)\n\n#\
    \ CHAPTER 9: ADT, data structure, and Java collections\n\n### Abstract Data Type\
    \ (ADT)\n\nAn abstract data type (ADT) is a logical description of data and the\
    \ operations allowed on it. ADT is defined as the user's point of view on the\
    \ data. ADT deals with the possible values and the interface and is not concerned\
    \ with the actual implementation of the data structure. For example, you want\
    \ to store some integers and find their mean value. The ADT for this data structure\
    \ supports two functions, one for adding integers and the other for getting the\
    \ mean value. The ADT for this data structure does not say exactly how it will\
    \ be implemented.\n\n### Data structure\n\nData structures are concrete representations\
    \ of data and are defined as the data programmer's point of view. The data structure\
    \ represents how data is stored in memory. All data structures have advantages\
    \ and disadvantages. Depending on the type of problem, we select the data structure\
    \ that best suits it.\n\n![Image](images/image-23.jpeg)\n\nFor example, we can\
    \ store data in an array, linked list, stack, queue, tree, etc.\n\n**Note**: In\
    \ this chapter we will study different data structures and their APIs so that\
    \ the user can use them without knowing their internal implementation.\n\n###\
    \ Java Collection Framework\n\nThe Java programming language provides the Java\
    \ Collection framework which is a set of high-quality, efficient, and reusable\
    \ data structures and algorithms. The following advantages of using Java collection\
    \ framework:\n1. Developers do not have to repeatedly implement basic data structures\
    \ and algorithms. This saves effort.\n2. Java Collection framework is well-tested,\
    \ high-quality, high-performance. Using them increases the quality of programs.\n\
    3. Development cost is reduced as underlying data structures and algorithms are\
    \ implemented through Collections.\n4. Easy to view and understand programs written\
    \ by other developers using Collection platform. In addition, the collection framework\
    \ is well documented.\n\nArray\n\nArray represents a collection of elements of\
    \ the same data type.\n\n#### ADT operations\n\nBelow is the array API:\n1. Adds\
    \ an element at the `k` position. Value can be stored in the array at the `k`\
    \ position at constant time `O(1)`. We just need to store the value in `arr[k]`.\n\
    2. Read the value stored in the `k` position. Accessing a value stored at some\
    \ index in an array is also constant `O(1)` time. Just read the value stored in\
    \ `arr[k]`.\n3. Substitution of the value written in the `k` position with the\
    \ new value. Time complexity: constant `O(1)` time.\n\nExample:\n```java\npublic\
    \ class ArrayDemo {\n    public static void main (String args []) {\n        int\
    \ [] arr = new int [10];\n        for (int i = 0; i <10; i++) {\n            arr[i]\
    \ = i;\n        }\n}\n```\nStandard Java tables have a fixed length. Sometimes\
    \ we don't know how much memory we need, so we create an array with a larger size.\
    \ Thus, it wastes space. If the array is already full and we want to add more\
    \ values to it then we need to create a new array that has enough space and then\
    \ copy the old array to the new one. To avoid this manual reallocation and copying,\
    \ we can use an `ArrayList` from the Java Collection framework or Linked Lists\
    \ for storage.\n\n### ArrayList implementation in Java collections\n\n`ArrayList<E>`\
    \ in Java collections is a data structure that implements the `List<E>` interface,\
    \ which means it can contain duplicate elements. `ArrayList` is implemented as\
    \ a dynamic array that can grow or shrink as needed. (The inner array is used\
    \ when full, the larger array is allocated, and the old array values are copied\
    \ into it.)\n\nExample:\n```java\nimport java.util.ArrayList;\n```\n"
