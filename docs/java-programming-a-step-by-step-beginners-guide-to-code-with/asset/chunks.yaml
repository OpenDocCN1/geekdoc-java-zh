    ## Object creation


    Classes provide a template for objects. Objects are basically created from a class.
    You will use the keyword `new` to create new objects.


    To create a new object from a class, follow these steps:

    - **Declaration**: Refers to a variable declaration in which you must enter the
    variable name and its object type.

    - **Instance**: To create a new object; you will use the keyword `new`.

    - **Initialization**: The constructor is called after the keyword `new` and initializes
    a new object.


    The following examples show the different steps taken to create a new object from
    a class:


    ![Image](images/image-14.jpeg)


    Here is the result:


    The name given is: spotty


    ## How to access instance methods and variables


    The objects you create are used to access the instance methods and variables.
    To access instance variables, follow these steps: First, you need to create an
    object:


    ```

    ObjectName = New Constructor ();

    ```


    Then call a variable like:


    ```

    ObjectName.VariableName;

    ```


    To call a class method:


    ```

    ObjectName.MethodName ();

    ```


    ## Java package


    A package is just a way of grouping interfaces and classes. The Java package serves
    as a container for classes. The typical basis of grouping is functionality. Using
    packages facilitates code reuse. When interfaces and classes are categorized,
    you can easily access them for use in other programs. Using packages also helps
