  trans: "\n`Exception` 类有两个子类，分别是 `RuntimeException` 类和 `IOException` 类。以下是 Java\
    \ 中作为 `Throwable` 类一部分已定义的方法列表。\n\n```java\npublic String getMessage ()\n```\n\
    调用此方法时，该消息将返回对所遇异常的详细描述。\n\n```java\npublic throws getCause ()\n```\n此方法在被调用时，会返回一个包含异常原因的消息。\n\
    \n```java\npublic String toString ()\n```\n此方法返回结合了类名的对异常的详细描述。\n\n```java\npublic\
    \ void printStackTrace ()\n```\n通过调用此方法，可以将 `toString()` 方法的结果以及堆栈跟踪（stack trace）打印到标准\
    \ `System.err` 错误流。\n\n```java\npublic TraceElement [] getStackTrace ()\n```\n\
    在某些场景下，你可能需要访问堆栈跟踪的不同元素。此方法返回一个数组，堆栈跟踪中的每个元素都被写入数组的不同元素中。数组的第一个元素包含堆栈跟踪的顶部元素，而堆栈跟踪的底部被写入数组的最后一个元素。\n\
    \n```java\npublic Throwable fillInStackTrace ()\n```\n将堆栈跟踪中的先前信息附加到当前堆栈跟踪的内容上，并返回与数组相同。\n\
    \n### 捕获异常\n\n捕获异常的标准方法是使用“try and catch”关键字以及它们的代码实现。这个 try and catch 块必须以这种方式实现：包含要抛出异常的代码。在这里也应该提到，旨在引发异常的代码被称为受保护代码（protected\
    \ code）。实现 try and catch 块的语法如下：\n\n```java\ntry {\n    /* 受保护代码 */\n} catch (exception\
    \ name ex1) {\n    /* 捕获代码 */\n}\n```\n\n抛出异常的代码放置在 try 块中。如果抛出异常，则在 catch 块中实现处理异常的适当操作。每个\
    \ try 块必须包含一个 catch 块或结束块（end block），这是至关重要的。\n\n在 catch 语句中，你必须声明要抛出的异常。如果发生异常，执行流将转移到\
    \ catch 块。如果抛出的异常与 catch 块中定义的异常匹配，则执行 catch 块。\n\n下面给出了 try and catch 块的示例实现。该代码实现了一个具有\
    \ 2 个元素的数组。然而，代码尝试访问并不存在的第三个元素。结果是抛出了异常。\n\n```java\nimport java.io.*;\n\npublic\
    \ class DemoException {\n    public static void main (String args []) {\n    \
    \    try {\n            int arr = new int [2];\n            System.out.println(\"\
    Access to third array element:\" + arr[3]);\n        } catch (ArrayIndexException\
    \ ex) {\n            System.out.println(\"Catching exception:\" + ex);\n     \
    \   }\n        System.out.println(\"reached outside of block\");\n    }\n}\n```\n\
    \n实现多个 catch 块可以处理许多异常。为了满足这一要求，允许使用多个 catch 块。此类实现的语法如下：\n\n```java\ntry {\n\
    \    /* 受保护代码 */\n} catch (Type1 ex1) {\n    /* 捕获 1 */\n} catch (Type2 ex2) {\n\
    \    /* 捕获 2 */\n} catch (Type3 ex3) {\n    /* 捕获 3 */\n}\n```\n\n上面的语法说明了多个 catch\
    \ 块的实现。然而，你可以实现任意数量的 catch 块。当这段代码执行时，首先执行受保护代码。如果发生异常，将尝试匹配第一个 catch 块以外的异常类型。但是，如果异常类型不匹配，则忽略\
    \ catch1 并尝试匹配第二个 catch 块的异常类型。哪个 catch 块与抛出的异常类型相同，就执行适当的 catch 块。\n\n![Image](img/image-22.jpeg)\n\
    \n# 第 9 章：ADT、数据结构和 Java 集合\n\n### 抽象数据类型 (ADT)\n\n抽象数据类型（ADT）是对数据及其允许在其上进行的操作的逻辑描述。ADT\
    \ 定义为用户视角下的数据。ADT 处理可能的值以及接口，而不关心数据结构的实际实现。例如，你想存储一些整数并找到它们的平均值。该数据结构的 ADT 支持两个函数：一个用于添加整数，另一个用于获取平均值。该数据结构的\
    \ ADT 并没有具体说明它将如何被实现。\n\n### 数据结构\n\n数据结构是数据的具体表示，被定义为数据程序员的视角。数据结构代表数据在内存中的存储方式。所有数据结构都有其优缺点。根据问题的类型，我们选择最适合它的数据结构。\n\
    \n![Image](img/image-23.jpeg)\n\n例如，我们可以数据存储在数组、链表、栈、队列、树等。\n\n**注意**：在本章中，我们将学习不同的数据结构及其\
    \ API，以便用户可以在不知道其内部实现的情况下使用它们。\n\n### Java 集合框架\n\nJava 语言提供了 Java 集合框架，这是一组高质量、高效且可重用的数据结构和算法。使用\
    \ Java 集合框架的优点如下：\n1. 开发者不需要重复实现基础数据结构和算法。这节省了精力。\n2. Java 集合框架经过良好测试，高质量，高性能。使用它们可以提高程序的质量。\n\
    3. 由于 Collections 实现了底层数据结构和算法，开发成本降低了。\n4. 易于查看和理解使用集合框架的其他开发者编写的代码。集合框架文档齐全。\n\
    \n数组\n\n数组表示相同类型元素的集合。\n\n#### ADT 操作\n\n以下是数组 API：\n1. 在 `k` 位置添加元素。可以在常数时间 `O(1)`\
    \ 将值存储在数组的 `k` 位置。我们只需要 `arr[k]`。\n2. 读取存储在 `k` 位置的值。访问数组中某个索引的值也是常数时间 `O(1)`。只需读取\
    \ `arr[k]` 中的值。\n3. 将写入 `k` 位置的值替换为新值。时间复杂度：常数时间 `O(1)`。\n\n示例：\n```java\npublic\
    \ class ArrayDemo {\n    public static void main (String args []) {\n        int\
    \ [] arr = new int [10];\n        for (int i = 0; i <10; i++) {\n            arr[i]\
    \ = i;\n        }\n    }\n}\n```\n标准的 Java 表有固定长度。有时我们不知道需要多少内存，因此我们创建一个更大的数组。因此，浪费了空间。如果数组已满且我们想向其添加更多值，我们需要创建一个足够空间的新数组，并将旧数组复制到新数组中。为了避免这种手动重新分配和复制，我们可以使用\
    \ Java 集合框架中的 `ArrayList` 或链表进行存储。\n\n### ArrayList 在 Java 集合中的实现\n\nJava 集合中的\
    \ `ArrayList<E>` 是实现 `List<E>` 接口的数据结构，这意味着它可以包含重复元素。`ArrayList` 实现为动态数组，可以根据需要增长或缩小。（当内部数组满时，会使用较大的数组并将旧数组值复制进去。）\n\
    \n示例：\n```java\nimport java.util.ArrayList;\n```\n"
