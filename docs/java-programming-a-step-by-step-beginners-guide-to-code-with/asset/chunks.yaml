    The constructor will also implicitly return void - it just means there is no return
    type. You cannot put a return statement inside the constructor body because it
    will be flagged by the compilers as an error. The only way to call a constructor
    is to use the `new` statement. We''ve already covered a few ways to call constructors
    in the examples above.


    The last difference is that constructors cannot be inherited. Let''s go back to
    the examples given above - the first line contains `Employee();` - that is, the
    default constructor. As you can see, there are no parameters. The job of the default
    constructor is simply to initialize the member variables to a specified default
    value. In the example above, the member variable `pirate1` was initialized to
    the default `wage rate` and `employee status`.


    ### Can constructors also be overloaded?

    Yes they can. Constructors also behave like methods, which means you can overload
    a constructor in the same way that you overload a method. Here are some examples
    of a constructor overload. We use the `Employee` class and overload it with various
    parameters.


    ```

    Employee()

    Employee (int internal)

    Employee (int r, String b)

    ```


    ### How to initialize a variable?

    Now that we know how to declare variables, and we know the different types of
    variables that are available to us, the next thing to do is learn to use these
    variables in something called "expressions". Expressions are the most commonly
    used Java building blocks, usually intended to result in a new value, although
    in some cases expressions are used to assign a new value to a variable. In general,
    expressions consist of things like values, variables, operators, and method calls.
    There are also some expressions that do not produce a result but affect another
    variable.


    One example would be an expression that changes the value of a variable based
    on an operation: there is no new output value, and there is no "assigning" a new
    value, but rather there is a so-called side effect that causes the value of a
    variable to change.


    In the "Hello World" printing program, we entered the raw values into the print
    function, also known as "hard-coding" the output. However, at this point we should
    try incorporate what we learned about the variables. Variables work in the same
    way as raw values in that they simply refer to a value previously stored by the
    computer and as such, a programmer can simply use the variable name instead of
    the value. To demonstrate this, let''s recall the previous "Hello World" program:
    `print ("Hello World"); input ("press return to close this.");` Now, instead of
    hard-coding the string "Hello World", we can simply declare it as and have the
    program display that. It should look like this:


    ```

    String = "Hello World";

    print (string);

    input ("press return to close this.");

    ```

    This should give the same result.


    # CHAPTER 3: Java Basics


    ## Java toolkit

    The JDK provides the tools needed to build, test, and monitor Java applications.
    It allows developers to access software components and compile applications during
    Java operations. For example, a developer needs JDK-based environment to write
    apps implement methods. Since JDK more performs development kit (SDK) operations,
    it is easy to confuse the scope and operation of the two. While the JDK is specific
    to the Java language, the SDK has wider application. But the JDK still works an
    SDK component in the development environment. This means the developer will still
    need the SDK to provide some tools with wider properties that are not available
    in the JDK domain. Developer documentation and debugging tools as well as application
    servers are some of the key tools provided by the SDK for the Java environment.


    The scope of the JDK deployment depends on the nature of the tasks being performed,
    the versions supported, and the Java edition used. For example, the Java Platform
    Standard Edition (Java SE) Development Kit is intended for use with the Java Standard
    Edition. The Java Enterprise Edition (Java EE) and the Java Micro Edition (Java
    ME) platform are the other major subsets of the JDK. The details of each of these
    Java editions are detailed in the following sub-topics. JDK has been a free platform
    since 2007, when it was uploaded to the OpenJDK portal. Its open source status
    makes it easy to collaborate and allows the developer community to clone, hack,
    or contribute ideas for improvements and updates.


    ### Java SE

    Java SE supports a wide variety of desktop and server applications. Supports the
    testing and deployment of the Java programming language in the development environment
    of these applications. Some documents related to recent Java SE releases include
    advanced management console functionality and a renewed set of Java deployment
    rules. Java SE 13.0.1 is the latest version of the JDK for Java SE at the time
    of writing this book. Java SE SDK consists with basic capabilities along with
    a portfolio of tools, libraries, and implementation technologies that are designed
    to be used in desktop application. These tools range from objects and types for
    implementing Java programs to advanced classes that are suitable for developing
    applications with networking capabilities and security. Developers can also use
    this particular JDK when creating applications to simplify access or GUI. The
    Java EE platform is an open source product that was developed through the collaborative
    efforts of members of the Java world. Java EE is closely related to Java SE because
    the former is built on top of the latter. This particular software is integrated
    with transformations designed to be used in enterprise. features and enhancements
    in new releases often reflect the inputs, requirements and requests of the Java
    community. Java EE actually offers twenty implementations compatible with Java
    programming. The Java EE SDK is intended for use in building applications for
    large- operations. The release includes enhanced REST API capabilities provided
    by client APIs, JSON bindings, servlet, and security. As released on Oracle Corporation
    in December 2019, this release also includes the Date and Time API and Streams.


    The Java ME platform uses simplicity, portability, and dynamics to provide a comprehensive
    application development environment for small gadgets and devices. Java ME is
    known for its excellent application development environment, thanks to its interactive
    and user-friendly navigation interfaces, as well as its built-in ability to implement
    network concepts. It is largely associated with the Internet of Things (IoT) and
    is useful for creating applications designed for embedded technologies or connected
    devices that can be used to invent or implement futuristic concepts. The portability
    and attributes of the Java ME Runtime make it suitable for use in wearable gadget
    applications, mobile phones, cameras, sensors and printers.

