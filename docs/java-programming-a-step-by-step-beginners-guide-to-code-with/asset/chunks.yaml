  trans: "\n提供了重构代码的能力。\n它有助于完成代码。\n它拥有广泛的扩展和插件。\n它还支持大多数源代码版本控制系统。\n\n# NetBeans\n\
    \nNetBeans 是一个非常推荐给 Java 初者的 IDE。它是一个强大且快速的 IDE，支持所有 Java 平台以及移动应用程序。它可以在 Windows、Linux、macOS\
    \ X 和 Solaris 等多种平台上运行。它还提供对 HTML5、C/C++ 和 PHP 等语言的支持。\n\n## Java 优点\n\nJava 以编程简单性著称，具有用户友好的界面，便于学习、编写、部署和运行。\n\
    \nJava 核心架构旨在便于开发环境中的集成和易于用性。\n\nJava 是平台无关且易于移植的，适用于多任务处理和各种应用程序。\n\n面向对象的 Java\
    \ 特性支持开发具有标准功能和可重新部署代码的程序。\n\nJava 的网络能力让程序员能够轻松为共享计算环境构建软件。\n\nJava、C++ 和 C 语言之间的紧密关系，使得任何了解另外两种语言的人都能轻松学习\
    \ Java。\n\nJava 的自动垃圾回收提供了持续的内存保护，因此开发者可以在编写代码时方便地关闭安全漏洞。\n\nJava 架构在实现多线程程序方面非常灵活性。\n\
    \n得益于通过接口或继承重新部署类的能力，Java 易于复用。\n\n## Java 缺点\n\n由于 Java 不是原生应用程序，与其他编程语言相比，它的运行速度较慢。\n\
    \nJava 在处理和显示图形方面可能缺乏一致性。例如，基于 Java 的应用程序中图形用户界面（GUI）的通常外观与原生应用程序的 GUI 输出相比完全不同，且标准较低。\n\
    \nJava 垃圾回收是一项管理内存性能的功能，当作为后台程序运行时可能会干扰速度和性能。\n\n# 第 5 章：项与类\n\n最后，我们将查看类和对象；Java\
    \ 中的对象必须有存储在字段中的状态，以及由方法指示的行为。类就像一种地图，或者如果你愿意的话，可以看作是从从它创建对象的计划。下面是该类：\n\n```java\n\
    public class Dog {\n    string breed;\n    int age;\n    Color of the string;\n\
    \    void barking() {}\n    invalid whine() {}\n    invalid sleep() {}\n}\n```\n\
    \n类可以拥有以下任何类型的变量：\n- **局部（Local）**：定义在构造函数、块或方法中。变量被声明，然后初始化，并在方法完成时销毁。\n- **实例（Instance）**：定义在类中但方法之外。在类实例出现时初始化，并可以从任何构造函数、块或方法访问。\n\
    - **类（Class）**：声明在类内部，使用 `static` 关键字且在方法之外。\n\n类可以有许多方法，数量取决于访问所有不同类型的值的需要。在我们的示例中，我们有了方法——`barking()`、`whine()`\
    \ 和 `sleep()`。\n\n## 构造函数\n\n每个类都将有一个构造函数；如果你省略了它，编译器将构建一个。创建一个新对象时，必须至少调用一个构造函数。构造函数的名称必须与类名相同，构造函数的数量可以根据类的需要而定。以下是构造函数的样式：\n\
    \n```java\npublic class Puppy {\n    public pup() {}\n    public pup(string name)\
    \ {} // 这个构造函数有一个参数 name。\n}\n```\n\n## 对象创建\n\n我们已经知道类是创建对象的蓝图的一种，因此无需说对象是从类中创建的。要创建一个新对象，我们需要\
    \ `new` 关键字。从类创建对象需要以下三个步骤：声明——变量必须使用对象的名称和类型声明。创建——使用 `new` 关键字创建对象。初始化——调用构造函数并初始化对象。\n\
    \n下一个示例显示了如何创建对象：\n\n```java\npublic class Puppy {\n    public pup(string name)\
    \ {\n        // 这个构造函数包含一个名为 name 的参数。\n        System.out.println(\"The given\
    \ name is:\" + name);\n    }\n    public static void main(String [] args) {\n\
    \        // 下一条语句将创建一个名为 myPuppy 的对象 Puppy PuppyPuppy = new Puppy(\"fluffy\");\n\
    \    }\n}\n```\n运行它并看看发生了什么。\n\n## 访问实例变量和方法\n\n当我们想要访问实例变量和方法时，可以使用对象；此示例显示了如何访问实例变量：\n\
    \n```java\n/* 首先我们创建一个对象 */\nObjectReference = new constructor ();\n/* 现在我们这样调用变量\
    \ */\nObjectReference.variableName;\n/* 现在这样调用类方法 */\nObjectReference.MethodName\
    \ ();\n```\n\n然后我们就可以在类中看到这些实例变量和方法了：\n\n```java\npublic class Puppy {\n    int\
    \ PuppyAge;\n    public pup(string name) {\n        // 这个构造函数包含一个名为 name 的参数。\n\
    \        System.out.println(\"name is:\" + name);\n    }\n    public void setAge(int\
    \ age) {\n        PuppyAge = age;\n    }\n    public int getAge() {\n        System.out.println(\"\
    Puppy age is:\" + PuppyAge);\n        return PuppyAge;\n    }\n    public static\
    \ void main(String [] args) {\n        /* 创建对象 */\n        myPuppy = new Puppy(\"\
    fluffy\");\n        /* 现在调用类方法设置狗狗的年龄 */\n        myPuppy.setAge(2);\n       \
    \ /* 然后调用另一个类方法获取狗狗的年龄 */\n        myPuppy.getAge();\n        /* 这就是我们访问实例变量的方式\
    \ */\n        System.out.println(\"Variable value:\" + PuppyAge);\n    }\n}\n\
    ```\n\n## 导入语句\n\n需要记住的一点是路径必须完全限定的，这包含了类名。否则，编译器将难以加载源代码和类。为了限定路径，我们需要使用 `import`\
    \ 语句，在示例中我们可以看到将请求的类加载到我们选择的目录中：\n\n接下来，我们需要创建两个类，一个 Employee，一个 EmployeeTest。为了实现，我们使用以下代码——记住\
    \ Employee 是类名且它是一个公共类。这样做并将文件命名为 Employee.java。还要注意这里有四个实例变量——age、name、designation\
    \ 和 salary，还有一个定义清晰并接收参数的构造函数：\n\n```java\npublic class Employee {\n    String\
    \ name;\n    int age;\n    string marking;\n    double salary;\n    // 这是名为 Employee\
    \ 的类的构造函数 public Employee(String name) {\n        this.name = name;\n    }\n \
    \   // 将 Employee 的年龄赋值给变量 age。\n    public void empAge(int empAge) {\n      \
    \  age = empAge;\n    }\n    // 将职位赋值给名为 designation 的变量。\n    public void empDesignation(String\
    \ empDesig) {\n        designation = empDesig;\n    }\n    // 将薪水赋值给变量 salary。\n\
    \    public void empSalary(double empSalary) {\n        salary = empSalary;\n\
    \    }\n    // 打印员工数据\n    public void printEmployee() {\n        System.out.println(\"\
    Name:\" + name);\n        System.out.println(\"Age:\" + age);\n        System.out.println(\"\
    Tag:\" + tag); System.out.println(\"Salary:\" + salary);\n    }\n}\n```\n\n"
