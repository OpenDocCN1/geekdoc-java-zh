    \ add 1 to the end of the list\nal.add(2); // add 2 to the end of the list\nSystem.out.println(\"\
    Array content:\" + al);\nSystem.out.println(\"Array Size:\" + al.size());\nSystem.out.println(\"\
    Array IsEmpty:\" + al.isEmpty());\nal.remove(al.size() -1); // the last element\
