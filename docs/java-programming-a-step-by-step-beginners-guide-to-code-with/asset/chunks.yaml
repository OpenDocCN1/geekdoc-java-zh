  trans: "\n因此，建议对任何它可以读取的读取器包装一个 `BufferedReader`（像 `FileReader` 和 `InputStream`\
    \ 这样的事务开销可能很大）。\n\n例如：\n\n```\nBufferedReader in = new BufferedReader (Reader\
    \ w, int size)\n```\n\n`FileReader`：用于读取字符文档的便利类。该类的构造函数假设默认字符格式和默认字节缓冲区大小是合适的。\n\
    \n`Scanner`：\n一个简单的文本扫描器，使用正则表达式解析基本类型和字符串。扫描器使用分隔符模型将输入拆分为在定义上匹配空白符的标记（tokens）。通过后续的单独技术，可以将生成的标记转换为不同类型的值。\n\
    \n```java\nimport java.io.*;\nimport java.util.Scanner;\n\npublic class ReadFromFileUsingScanner\
    \ {\n    public static void main (String [] args) throws Exception {\n       \
    \ // 文件路径现在设置为参数，以便进行扫描\n        File example = new File (\"C:\\\\Users\\\\username\\\
    \\Desktop\\\\example.txt\");\n        Scanner example1 = new Scanner(file);\n\
    \        while (example1.hasNextLine()) {\n            System.out.println (example1.nextLine());\n\
    \        }\n    }\n}\n```\n\n使用 `Scanner` 类但不使用循环：\n\n```java\nimport java.io.*;\n\
    import java.io.FileNotFoundException;\nimport java.util.Scanner;\n\npublic class\
    \ example {\n    public static void main (String [] args) throws FileNotFoundException\
    \ {\n        File example = new File (\"C:\\\\Users\\\\username\\\\Desktop\\\\\
    example.txt\");\n        Scanner example1 = new Scanner(file);\n        // 我们使用\
    \ [\\\\Z] 作为分隔符\n        sc.useDelimiter(\"\\\\ Z\");\n        System.out.println\
    \ (example1.next());\n    }\n}\n```\n\n### 在 Java io 包中将文本文件读取为 String\n\n```java\n\
    package io;\nimport java.nio.*; ;;\n\npublic class example {\n    public static\
    \ String example (string fileName) throws Exception {\n        String example1\
    \ = \"\";\n        example1 = new String (Files.readAllBytes(Paths.get (fileName)));\n\
    \        return example1;\n    }\n    public static void main (String [] args)\
    \ throws Exception {\n        String example1 = example (\"C:\\\\Users\\\\username\\\
    \\Desktop\\\\example.java\");\n        System.out.println (example1);\n    }\n\
    }\n```\n\n### 保存到文本文件\n\n你可以使用其中一个写入方法将字节或行写入文件。记录方法包括：\n- `Write (Path, byte\
    \ [], OpenOption ...)`\n- `Write (path, Iterable <CharacterSequence>, Character\
    \ set, OpenOption ...)`\n\n### 移除删除文件\n\n在 Java 中，`File` 类中有一个名为 `delete(file)`的方法可以用来删除文件。用\
    \ java 保存的文件将被永久删除，而不会移动到回收箱。使用 `java.io.File.delete` 会移除此抽象路径。`java.nio.file.deleteIfExists`\
    \ 如果文件存在则会删除它。如果文件未打开，它也会删除列出的文件。\n\n在任何软件项目中，错误都是客观事实。细致的规划、编程和测试有助于减少错误的普遍性，但随着新功能的引入和代码复杂性的增加，它们会变得尤为明显。幸运的是，错误比其他问题更容易发现。例如，编译时错误很快就能被识别；可以使用编译器代码来识别问题所在并立即修复。然而，运行时错误可能要困难得多；它们并不总是立即出现，一旦出现，可能在远离问题真实原因的地方。泛型通过在编译时工作以识别更多\
    \ bug 来帮助稳定软件。简而言之，泛型允许在定义类、接口和技术时为类型（类和对象）提供参数。就像方法声明中更熟悉的形式参数一样，类型参数为复用相同代码提供了独立的输出。区别在于，值是形式参数的输入，而类型是对类型参数的响应。使用泛型的代码比代码具有许多优势。通过使用泛型，开发者可以实现可以在不同类型集合上运行通用算法，算法是可以自定义的，并且安全且易于阅读。\n\
    \n泛型类型\n\n泛型是一个带有参数化类型的类别或通用接口。可以通过修改简单的箱类来展示这一思想。考虑一个适用于任何对象的非泛型箱类别。你只需要提供两个技术：set（向箱中添加项目并接收它）、retrieving（获取）。由于它们的方法接受或返回对象，你可以传递任何内容，只要它不是基本类型即可。\n\
    \n在编译时无法检查该类是如何被使用的。一个软件可能会将一个整数放入箱中并期望从其推导出参数，而另一部分软件可能会在某行出错，导致运行时错误。通过括号（`<>`）添加的类型参数部分显示了类别的类型。指示参数（也称为因子）`T1`,\
    \ `T2` 到 `T`。你通过将文件“字段”更改为“field <T>”生成泛型类型，以更新箱类别使用泛型。这代表一个类型为 `T` 的变量，可以在类内部任何地方使用。这会将所有对象转换为\
    \ `T`。任何指定的非基本类型都可以是类型变量：任何类、任何接口、任何数组以及任何其他变量。可以将相同的方法应用于泛型接口。按照惯例，类型标识符为单个字母。这与你已经理解的变量命名规范形成鲜明对比，而且很有道理：如果没有该惯例，很难区分变量与类或对象的普通名称。最常用的参数名是：\n\
    - `E`: Element（Java 集合框架广泛使用）\n- `K`: key\n- `N`: number\n- `T`: Type\n- `S, U,\
    \ V, 等`: 第二、第三、第四种类型\n你会在 JDK 和 API 中看到这些名称。\n\n### 调用和创建泛型类型的实例\n\n要在你的系统中引用字段的通用类别，你应该进行泛型调用，以产生一个具有特定值的\
    \ `T`，例如 Integer：\n\n```\nBox <Integer> integerBox;\n```\n\n你可能会认为泛型调用可以与普通的过程调用相比，但并不是向过程添加断言，而是将参数（在本例中为\
    \ Integer）移动字段本身。\n\n许多设计者交叉使用“类型参数”和“类型语句”这两个词，但定义并不相同。在编码期间，提供参数以生成参数化类型。因此，`Foo<T>`\
    \ 中的 `T` 是类型参数，而字符串 `Foo<String> f` 是类型冲突。使用这些词，该类遵循这一概念。就像任何其他变量语句一样，此软件并没有在箱中生成新项目。它只是声明\
    \ `integerBox` 将引用到一个“整数箱”，这正是 `Box<Integer>` 听起来的意思。泛型类型调用通常被称为参数化类型。\n\n要实例化此类，像往常一样使用\
    \ `new` 关键字，但在类名和括号之间包含 `<Integer>`：\n\n```\nBox <Integer> integerBox = new Box<Integer>();\n\
    ```\n\n"
- fmt: "\nGeneric techniques are techniques that implement parameters of their own\
    \ kind. This is similar to a generic type declaration, but the scope of a type\
    \ parameter is limited to the method in which it is declared. In addition to generic\
    \ class constructors, both static and non-static generic techniques are allowed.\n\
    \nThe syntax for the generic technique includes a list of type parameters in angle\
    \ brackets that appear before the return type of the procedure. The type parameter\
    \ segment must come before the method return type for static generic techniques.\
    \ The `Util` class includes `Compare`, a general technique for comparing two `Pair`\
    \ elements.\n\n```\nPair <Integer, String> ex1 = new Pair <> (49, \"string1\"\
    ); ownPair <Integer, String> ex2 = new Pair <> (64, \"string2\");\nlogical comparison\
    \ = Util.<Integer, String> compare (ex1, ex2);\n```\n\n### Restricted type parameters\n\
    \nSometimes you want to restrict the kinds that can be used in a parameterized\
    \ type as form statements. For example, a technique that works with numbers may\
    \ only recognize numeric cases or their subclasses. This is what these kinds of\
    \ boundary parameters are for.\n\nDisplay the name of the type parameter to point\
    \ to the defined type parameter, including the extension keyword followed by an\
    \ upper bound, which in this instance is `Number`. Note that `extends` is usually\
    \ used in this context to mean \"extensions\" (as in tutorials) or \"implements\"\
    \ (as in interfaces).\n\n#### Lots of boundaries\n\nType parameters can have more\
    \ than one binding. A multi-bounded variable is a subtype of all of the types\
    \ listed in the binding. If one of the constraints is a class, specify them first.\
    \ For example:\n\n```\nclass X { ... }\ninterface Y { ... }\ninterface Z { ...\
    \ }\nclass R <T extends X & Y & Z> { ... }\n```\n\nIf the binding `X` is not specified\
    \ first, you will get a compile-time error: \n```\nclass R <T extends Y & X &\
    \ Z> { ... } // compile-time error\n```\n\n# CHAPTER 11: Collections\n\n### Functionalizing\
    \ collections\n\nWhen we externalize the code, we reveal each step. This is the\
    \ hallmark of imperative programming. However, one of the recurring themes in\
    \ functional programming is the idea of doing the exact opposite: internalizing\
    \ your code. The job of internalizing your code is to hide the details inside\
    \ the function. However, functional programming takes this idea further by transforming\
    \ micro-patterns of everyday programming into functions. For example, iterating\
    \ over data, be it iterators, a `for loop loop, or a `while loop`, is one of these\
    \ micro-patterns. Functional programming is changing the way we think about them.\n\
    \nJava's functional effort wouldn't be complete without a revamp of its `Collections`\
    \ library, namely the `Collection`, `Map`, `List`, and `Set` interfaces. This\
    \ is because collections are iterated frequently, and they are the very fabric\
    \ of Java programs. It is a natural place for the functionalisation effort.\n\n\
    However, making any significant changes, such as adding new methods to the `Collection`\
    \ interface, would disrupt the backward compatibility of all pre-Java 8 programs.\
    \ This includes not only its own JDK hierarchy extending the `Collection` interface\
    \ but also any open or closed source library and internal classes. Designers never\
    \ had and will never adopt such strategy. However, changes were necessary; the\
    \ library was introduced in 1998 and the software industry aged. The motivation\
    \ for introducing default methods was needed to modernize and functionalize the\
    \ library. Default methods are just the right as they allow you to add behavior\
    \ to the base of your hierarchy without dependent classes. Subclasses can inherit\
    \ or override behavior. Unlike adding new methods, subclasses can automatically\
    \ accept default methods without recompiling. Immediate compatibility achieved.\
    \ Default methods are useful on their own but their existence is needed to functionalize\
    \ the library.\n\nThe second recurring theme in functional programming is parallelism.\
    \ Quite simply, functional programming offers a better for parallelism. As consequence,\
    \ collections have been enriched to use multi-core when processing collections.\
    \ Along with streams, collections are at the forefront of introducing functional\
