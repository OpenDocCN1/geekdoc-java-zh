    # Introduction

    Java is a widely used programming language on the web and in computer applications.
    It is a free downloaded solution that allows users to access the latest versions
    and deploy updates. This particular language is present in most modern web applications
    and computer technology. Java''s scalability makes it suitable for deployment
    in wide range of applications, including applications for small electronic devices
    such as phones, and software for large-scale operations such as data centers.
    The growing preference for Java deployment is due to its robust features and robust
    security credentials.


    Java is a programming language developed by Sun Micros, which was later acquired
    by Oracle Corporation. It is designed to run on any operating system that supports
    Java. This is what made the language popular as the programmer only had to write
    a program once and the program could run on any operating system without the programmer
    having to change the code.


    Most modern applications built around the world are written in the Java language.
    Most of the business logic and server-side components of the main applications
    are built in the Java language.


    Throughout this book, you will learn to write programs like the one above, as
    well as learn advanced concepts that will get you started writing application
    programs.


    Some of the design goals for Java are listed below:

    - The language is write-only and can be run on any operating system.

    - The language should support many software engineering principles.

    - Portability is an important factor. This is why Java can run on Windows, Linux,
    and macOS operating systems.

    - Support for internationalization is very important.

    - Java is to be suitable for writing applications for both hosted and embedded
    systems.


    Other design goals discussed below:


    ### Strong typing

    Java is strong type. Each defined variable must be appended to a type. You don''t
    need to understand the entire program for now, but let''s only look 2 lines of
    code:


    ```java

    int i = 5;

    ```

    Here we define something as a variable used to store value. The value that can
    be stored depends on the type. In this example, say "i" is of "int" or integer
    that is the numeric value of the data.


    ### Checking bounds of an array

    At runtime, Java will check that the array has the required number of values defined.
    If someone tries to access a value outside the bounds of the array, an exception
    will be thrown. You don''t need to understand the entire program for now, but
    let''s take the next lines:


    ```java

    int[] array1 = new int[2];

    array1[0] = 1;

    array1[1] = 2;

    array1[2] = 3;

    ```

    With this code, we can see that we are assigning 3 values to an array. You will
    get an error when you run this program because the program will see the array
    exceeded maximum maximum limits of two. You will get the below runtime error:
    `java.lang.ArrayIndexOutOfBoundsException: 2 at HelloWorld.main(HelloWorld:8)`


    Java has syntax and functions that are similar to other programming languages
    like C and C++. If you have previous programming experience, learning Java will
    be very easy for you. Even if you are completely new to programming, you can rest
    assured that Java is designed to be relatively easy to learn. Most programmers
    find it easier to learn Java than, say, C or C++.


    Java is also designed to be platform independent. As mentioned before, Java code
    is first compiled into bytecode that can be run on any machine with a Java virtual
    machine. With Java, you can write code once and run it anywhere.


    ## Why Java?

    Of course, one of the key reasons for using Java is to focus on object-oriented
    programming. Object-oriented or "OOP" programming is a type of programming language
    model that allows you to organize your program code around data, rather than functions
    and logic, in what is known as procedural programming. These "data clusters" are
    organized into things called "objects", hence the nickname "object-oriented programming".


    These objects are made up of what are called "classes," which are understood here
    in the traditional sense of classes: types of objects, which allows the programmer
    to classify them according two main criteria: attributes and methods.


    Class attributes are the raw data that will make up an object: these are its descriptors,
    such as its values and other relevant data which will be the subject. The second
    criterion is the "method" of the object. This "method" is a behavior or logical
    sequence contained in a class that describes how it interacts or can interact
    natively.

