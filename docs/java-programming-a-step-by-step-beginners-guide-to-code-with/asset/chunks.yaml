    ### Final - Used to finalize the implementation of variables, methods, and activities


    - **Final variables**: A trailing variable can only be explicitly initialized
    once. Once you declare a variable as `final`, you''ll never be able to assign
    it to another object. Remember, however, that you can still change the data stored
    in property. This means that while you change the state of an object, you cannot
    change the reference. The `final` modifier is often combined with `static` to
    create a class variable from constant.

    - **Final methods**: The `final` keyword is used to prevent the method from being
    changed by subclasses.

    - **Final classes**: The `final` modifier is used to prevent other classes from
    inheriting any characteristics from the class declared `final`.

    - **Static**: Used to create methods or variables. You can use this keyword to
    create a unique variable (static variable or class variable) that exists independently
