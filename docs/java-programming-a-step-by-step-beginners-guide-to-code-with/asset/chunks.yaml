    ); print(\"_______________________\");\n}\n```\n\n...\n\n在课程期间，除非遇到语法错误，否则请在每次更改代码后保存更改并运行程序。\n\
    \n他打印了正确的行吗？如果没有，请纠正代码并重试。\n\n1. 你认为需要打印什么可以在两个句子之间插入一个空行，如下方截图所示。（提示：你不希望在这一行上打印任何内容。）\n\
    \nHello dear.\nTake me to your leader.\n\n列表 1-7，来自 `HelloWorld.java`：\n\n...\n\
    \n```java\npublic HelloWorld () {\n    print (\"Hello Earthling.\");\n    print(___);\n\
    \    print (\"Take me to your leader.\");\n}\n```\n\n### 关键点及更多\n\nJava 程序由类组成。每个程序都需要在其其中一个类中包含一个\
    \ `main()` 方法。\n\n`main()` 必须写成 `public static void main(String [] args)`。随后的课程将澄清这些单词的含义。\n\
    \n多个类通常被一起使用来创建一个程序。然而，书中的大多数程序都只有一个类。\n\n每个类都必须有一个父类（super）。任何类都可以作为父类。你将在后的课程中创建你自己的父类。\n\
    \n具有相同父类的类被认为是相同类型。例如，你为书中的每个程序创建的 `main` 类将使用 `DIYWindow` 作为其父类。因此，书中的每个程序都是某种\
    \ `DIYWindow`。要创建类，请在 Package Explorer 面板中右键点击。类名可以包含数字、字母、下划线 `$`。类名中不能使用空格和点。类名不能以数字开头。类名通常大写字母开头。如果类名包含多个单词，每个单词的首字母大写，其余字母小写。类可以有一个或多个构造函数。类的构造函数与类名相同，且必须声明为\
    \ public。构造函数将在以后解释。使用 `new` 后接构造函数名和括号来调用。例如，`main()` 方法中的 `new HelloWorld()`\
    \ 调用了 `HelloWorld` 构造函数。代码块包含在大括号 `{}` 中，每行代码以分号结束；任何 Java 程序都会首先运行 `main()` 方法。书书中所有程序的\
    \ `main()` 方法都会调用类的构造函数。因此，`main()` 方法将首先运行，然后是类的构造函数。大括号中的每个语句按它们在代码中出现的顺序逐个执行。代码之间的空行对代码的运行没有影响。添加空行是为了使代码更容易读。`print()`\
    \ 语句将括号内的文本打印到窗口。每个 `print()` 语句都会另行打印。要打印空行，请使用空括号的 `print()`。`print()` 方法是 `DIYWindow`\
    \ 的一部分，它位于 `DIYjar` 中。因此，你向项目添加了外部 JAR 文件 `DIYjar`，并选择 `DIYWindow` 作为 `HelloWorld`\
    \ 类的父类。注释是以 `//` 开头的行或以 `/*` 开头并以 `*/` 结束的一组行。\n\n# 第章：面向对象编程\n\n你之前学过 Java 是一种面向对象的编程语言。因此，它支持这种编程范式的基本原则。对象指的是真实的实体，如包、汽车、椅子或笔。面向对象的编程语言允许程序员设计使用对象和类的程序。它们提供并支持可以简化软件的功能。该范式中最重要的概念是：\n\
    \n#### 对象\n类\n方法\n继承\n抽象\n多态\n封装\n\n在现实世界中，你会遇到如人、狗、汽车等对象。它们具有状态和行为。例如，当你想到猫时，它的状态可能包括颜色，行为可能包括跑步、跳跃。\n\
    \n#### 类\n类是对象的蓝图或模板。类定义了该类型的对象将具有的状态和行为。例如， `Car` 类可能会定义状态如 `color` 和 `model`，以及行为\
    \ `drive()` 和 `brake()`。\n\n#### 方法\n方法是定义在类中的函数。它们定义了对象可以做的事情。例如， `Dog` 类可能有一个打印声音的方法\
    \ `bark()`。方法可以接受参数作为输入并返回值。\n\n#### 继承\n继承允许一个类（子类或子类）获取另一个类（父类或超类）的属性和方法。这促进了代码重用。例如，`SportsCar`\
    \ 类可以继承自通用 `Vehicle` 类，获得它的状态和行为。\n\n#### 抽象\n抽象隐藏复杂的实现细节并显示对象必要特征的过程。它允许程序员关注对象能做什么，而不是它是如何实现的。\n\
    \n#### 多态\n多态允许不同类的对象被视为公共父类的对象。例如，`Dog` 和 `Cat` 都可以是 `Animal` 的子类。当你对它们调用 `makeSound()`\
    \ 方法时，每个都会以自己的方式做出反应。\n\n#### 封装\n封装是将数据（变量）和操作该数据的方法封装在单个单元（类）中的做法，并限制对对象某些组件的直接访问。这通常通过使用访问修饰符（如\
    \ `private` 和 `public`）来实现。\n\n"
