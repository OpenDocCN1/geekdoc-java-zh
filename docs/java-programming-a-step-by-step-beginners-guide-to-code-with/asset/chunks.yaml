    在这种情况下，使用 `computeIfAbsent()` 方法就大材小用了，使用 `putIfAbsent()` 方法会更好：


    ![Image](img/image-35.jpeg)

    ![Image](img/image-36.jpeg)

    ![Image](img/image-37.jpeg)

    ![Image](img/image-38.jpeg)


    该方法不使用 lambda 表达式，并且期望提供值——它不会被求值。尽管没有使用 lambda，这仍然是一种函数式方法。这证明了你可以在不使用 lambda
    的情况下用函数式表达代码。


    如果你仍然需要提取数据，可以使用 `getOrDefault()` 方法这种更具函数式的方法：你也可以使用 `merge()` 方法作为替代方案。这使得检查列表的存在变得简单。在下例示例中，如果键（年份）在
    map 中不存在，它将把值（标题）置于 map 中。如果它存在，则让 `BiFunction` 决定如何处理这两个列表：可以像这样使用：


    `BiFunction` 也可以返回 `null` 值，告诉 `merge` 删除该键。结论是我们已经删除了通用的检查代码。


    ![Image](img/image-39.jpeg)


    项目的存在，现在可以关注真正重要的事情了：定义如何构建列表以及如何向列表添加项目。`map` 接口已通过其他函数方法增强，如 `forEach()`、`replace()`
    和 `replaceAll()`，并使用了相同的代码内部化原则。可以在附录找到找到列表。


    ## 分发器 (Distributor)


    `Collections` 库仍然受到相同的并发访问限制。一如既往，你需要选择适合你的线程安全要求的 `Collections` 库类。这是因为上面显示的新方法仅仅是对相同底层数据结构的函数式抽象。这些方法在函数式编程中并不容易受到并行处理，因为它们仍然依赖于多线程变异集合并同步访问源数据的概念。


    然而，有一个新的 Java 8 抽象是兼容的。它旨在用于数据的并行迭代。该思想体现在 `Splitter` 接口中。该接口的前提是对数据进行分区，并将部分传递给不同的线程。`Splitters`
    可以从 `Collection` 接口获取，包括 `List` 和 `Set` 子接口。


    `Splitter` 接口的主要元素是三个方法：`trySplit()` 方法将数据分为两部分。创建一个带有一半数据的新拆分器，并将另一半保留在原始实例中。它们每一个都可以分配给一个线程，反过来通过
    `forEach()` 遍历分区数据。`next()` 方法是一个单变体，返回下一个项目，如果列表已耗尽则返回 `null`。拆分器本身不支持并行处理，但提供了一种执行该操作的抽象。这里是其概念：


    ![Image](img/image-40.jpeg)


    给定标题和移动列表，`isList()` 方法并行化搜索以确定其是否在列表中。如果找到，则将 `booleanholder` 中的标志设为 `true`。从列表中检索拆分器实例，将其对半，并将其中一半传递给每个线程。`Splitters`
    也可以从其他集合类型以及 JDK 中的其他库获取。有许多设计实现处理各种特性，包括有限/无限、有序/无序、已排序/未排序以及可变/不可变。它们继承了其底层数据结构的特性。`Splitters`
    是一种低层次的抽象，旨在对并行迭代提供更精确的控制。然而，API 缺乏实现函数式友好型算法所需的某些增强。在上面的示例中，我们需要在 `booleanholder`
    中存储用于搜索的状态。


    ## 结语 (End)


    我们对改进后的 Java 8 集合以及标准函数式接口的概述到此结束。由于为了支持函数概念对标准库进行了许多更改，预计外部 API 将发生重大变化。但最大的变化尚未到来。


    ### 关键点


    - 新的 `java.util.function` 包包含一组函数式接口。

    - 它们被分为四类，每类由一个原型表示：`Consumer`、`Function`、`Predicate` 和 `Provider`。

    - 每个函数式接口家族都定义了专门用于类型和参数的变。

    - 函数式接口还定义了允许函数式组合的方法。

    - 多个不同的 lambda 可以组合成表现为一个整体的超函数（superfunctions）。

    - `Collections` 库已重构并函数式化。这是通过在层次结构的顶层使用 `default` 方法实现的，从而确保了向后兼容。

    - 集合、列表、集合和 map 中的新函数式方法设计时考虑了内部迭代。以 lambda 表达式和方法引用的形式的行为参数被传递给遍历集合并对每个元素执行的方法。

    - 内部迭代是声明式编程的一种函数式形式。它减轻了开发者必须描述“如何”做什么的负担，并关注于“做什么”。`Splitters` 设计用于并行遍历集合。数据被分区，每个块被传递给不同的线程进行并行处理。


    ## 应用 (Application)


    JDK 是 Java Development Kit，是编译 Java 程序所需的本质工具。与 JVM 一起，JDK 包含一个解释器或加载器、一个名为 `javac`
    的编译器、一个存档 (JAR)、一个生成器以及成功所需的许多其他工具。JVM 是运行时。它是一个可以执行 Java 字节码的环境，用于实现 Java 虚拟机。


    JVM 代表 Java Virtual Machine（Java 虚拟机）。JVM 是一个抽象机器，该规范为我们提供了一个可以执行字节码的 JVM。JVM
    虚拟机必须符合以下条件：


    - 规范：一份描述如何实现虚拟机的文档。

    - 实现：满足虚拟机要求的程序。

    - 规范：运行时环境的实例。

    - 实例：当命令行显示时创建的虚拟机实例，用于编写 Java 命令和运行类。


    这三者是密不可分的，并且都依赖于对方来发挥作用。在此，感谢你选择我的 Java 编程指南。正如你所见，它是一种简单而复杂的语言，有许多不同的方面需要学习。现在，你应该对
    Java 编程的基本概念和如何使用它有了良好的理解。下一步就是练习。继续练习。我敦促你花时间学习这份指南；遵循教程，在完全理解其含义之前不要离开任何章节。为了帮助你，可以在网上找到一些非常有用的
    Java 论坛，那里充满了准备好并乐意帮助和指点方向的人。还有许多在线课程，有免费的也有付费的，但它们都是有用的并可以帮助你的学习达到下一个水平。你喜欢这个指南吗？希望这正是你所需要的，甚至更多，能带你走通通梦想工作的正确道路！

