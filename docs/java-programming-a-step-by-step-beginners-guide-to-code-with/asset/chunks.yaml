    泛型技术是实现自身类型参数的技术。这与泛型类型声明相似，但类型参数的作用范围仅限于声明它的方法。除了泛型类构造函数外，还允许静态和非静态的泛型技术。


    泛型技术的语法包括一个位于尖括号中的类型参数列表，它们出现在过程返回类型之前。对于静态泛型技术，类型参数段必须在方法返回类型之前。`Util` 类包含了 `Compare`，这是一种用于比较两个
    `Pair` 元素的通用泛型技术。


    ```

    Pair <Integer, String> ex1 = new Pair <> (49, "string1"); ownPair <Integer, String>
    ex2 = new Pair <> (64, "string2");

    logical comparison = Util.<Integer, String> compare (ex1, ex2);

    ```


    ### 受限的类型参数


    有时，你希望通过 form 语句限制参数化类型中可以使用的种类。例如，一个处理数字的技术可能只识别数值类型或其子类。这些边界参数的作用就在于此。显示类型参数的名称以指向定义的类型参数，包括
    `extends` 关键字后跟一个上界，在本例中为 `Number`。注意，`extends` 在此上下文中通常表示“扩展”（如教程所示）或“实现”（如接口所示）。


    #### 多个边界


    类型参数可以有多个一个绑定。多边界变量是绑定中列出的所有类型的子类型。如果其中一个约束是类，请先指定这些类。例如：


    ```

    class X { ... }

    interface Y { ... }

    interface Z { ... }

    class R <T extends X & Y & Z> { ... }

    ```


    如果没有先指定绑定 `X`，你将得到编译错误：

    ```

    class R <T extends Y & X & Z> { ... } // 编译错误

    ```


    # 第 11 章：集合


    ### 集合的函数化


    当我们外部化代码时，我们揭示了每一步。这是命令式编程的标志。然而，函数式编程中反复出现的主题之一是相反的想法：内部化代码。内部化代码的工作是将细节隐藏在函数内部。然而，函数式编程进一步发展了这一理念，将日常编程中的微型模式转换为函数。例如，遍历数据（无论是通过迭代器、`for
    loop` 还是 `while loop`）都是这些微型模式之一。函数式编程正在改变我们思考它们的方式。


    Java 的函数式努力如果不对其 `Collections` 库进行重构（即 `Collection`、`Map`、`List` 和 `Set` 接口）将是不完整的。这是因为集合被频繁迭代，而且它们是
    Java 程序的基石。这是函数化努力的自然场所。


    然而，进行任何重大更改（例如向 `Collection` 接口添加新方法）都会破坏所有 Java 8 之前程序的向后兼容性。这不仅包括扩展 `Collection`
    接口自身的 JDK 层次结构，还包括任何开源或闭源库以及内部类。设计者从未、永远不会采用这种策略。但是变化是必要的；该库引入于 1998 年，软件行业已经老了。引入默认方法的动机是为了使库现代化和函数化。默认方法非常合适，子类可以继承或重写行为。与添加新方法不同，子类可以在无需重新编译的情况下自动接受默认方法。实现了即时兼容。默认方法本身很有用，但它们的存在对于库函数化是必不可少的。


    函数式编程的第二个反复出现的主题是并行性。简单来说，函数式编程为并行性提供了更好的支持。作为结果，集合已经增强，可以在处理集合时使用多核。与流一起，集合是
    Java 引入函数式并行的前沿。现在我们学习了 Java 的标准函数式接口，可以开始将这些知识应用于集合了。让我们看看 Java 8 中的库发生了什么变化。


    #### Collection 接口


    我们首先查看列表和集合可用的集合 接口中的新默认方法。这是 `forEach()` 方法：该方法遍历整个集合，允许消费者决定对每个项做什么。这是内部迭代的概念，也是声明式编程的体现。迭代的细节并未指定。这与外部迭代形成对比，在外部迭代中，迭代的细节以及对每个元素的操作都是在代码中指定的。


    我们将通过三个电影黄金时代的喜剧滑稽演员——“三小士”的 Larry、Mo 和 Curly 来向你展示这些函数化集合的示例。首先，让我们打印集合的内容：


    `forEach()` 方法有非常广泛的适用范围。这是遍历集合的一种方便得的方法，应该成为你的事实标准。然而，作为一种声明式结构，有些事情是你无法完成的。首先，你不能像在
    while 循环那样更改局部变量的状态。算法需要从函数式的角度来思考。目前，只需知道 `forEach()` 非常适合不改变状态的迭代。


    我们现在查看集合中的另一个新方法：`removeIf()` 方法将迭代、测试和删除过程内部化。你只需要说明删除条件是什么。使用熟悉的已函数化谓词接口，我们可以轻松地发现应该使用什么种
    lambda。


    为了替换列表的全部内容，我们可以使用 `replaceAll()`：`replaceAll()` 使用 Operator 作为函数式接口。`replaceIf()`
    和 `replaceAll()` 对子类都可用，前提是基类必须支持，否则将抛出异常。


    这些示例展示了函数式编程的紧凑性。大部分工作已由函数式完成。


