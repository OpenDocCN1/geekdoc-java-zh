    I hope you found my introduction to computer programming helpful. It''s a very
    simple start, but should give you some idea how to get started.


    It should also show that computer programming isn''t all that difficult and can
    be quite exciting, especially when you start seeing your results appear on the
    screen and see, in short, the computer is doing what it''s told!


    If you find that you know what to expect, you can move to more advanced programming
    in your chosen language. A word of caution here: do not try to learn more than
    one language at a time; otherwise you will find yourself in confusion. The only
    advice I will give you at this stage is to keep practicing… and keep practicing.
    The more you do, the more you''ll learn and the more you''ll want to learn.


