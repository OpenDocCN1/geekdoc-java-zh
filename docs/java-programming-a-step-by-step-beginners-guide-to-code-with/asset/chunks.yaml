    \ and packages. If you were to develop Java programs without Eclipse, you would\
    \ probably only use packages.\n\n## Lesson 2 - Classes, subclasses and programs\n\
    \nJava programs are made up of one or more classes. Classes contain the actual\
    \ program statements that run perform the desired task. Each class must have a\
    \ different name. For example, programs designed to run in a window must be some\
