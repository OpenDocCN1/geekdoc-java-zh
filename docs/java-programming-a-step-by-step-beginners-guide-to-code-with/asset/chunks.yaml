    \ (path, Iterable <CharacterSequence>, Character set, OpenOption ...)`\n\n###\
    \ Removing and deleting files\n\nIn Java, there is a method called `delete(file)`\
    \ in the `File` class that we can use to delete file. Files saved with java will\
    \ be permanently deleted without moving to trash. Using `java.io.File.delete`\
    \ removes this abstract path. `java.nio.file.deleteIfExists` will delete the file\
    \ if any. If the file is not open, it also deletes the file listed.\n\nIn any\
    \ software project, errors are simply a fact. Careful planning, programming, and\
