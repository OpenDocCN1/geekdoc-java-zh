    # 第 2 章：变量


    ## 什么是变量？


    另一方面，变量是一个包含特定类型数据并被赋值或接收值的“对象”。它之所以被称为变量，是因为它包含的值可以根据它在代码中的用处、编码器如何声明它的值，甚至程序用户选择如何与其交互而发生变化。简而言之，变量是数据类型的内存单元。


    访问变量允许开发者方便地标记和召回手头存储的值。


    ## Java 中的变量类型


    Java 要求开发者使用声明（用于声明变量的代码行），并通过指定特定的数据类型和名称来定义它们。Java 处理变量有特定的方法，将变量定义为包含特定类型和值的信息的容器，这不像
    python 等语言，后者只需要变量声明且变量可以动态更改其类型；Java 变量是静态的，在声明时保留其类型。


    ```java

    int number = 20;

    Boolean = true;

    Hello hello = "Hello world!"

    ```


    声明语法在之前的示例中显示，其中变量类型在前，然后是变量名，最后是值。还要注意，声明语句可以在单行上包含多个声明，如下例所示：


    ```java

    Int number = 20, Boolean completed = true, string hello = "Hello World!";

    ```


    Java 变量可以先不赋值进行声明；在这些情况下，Java 决定为这些变量分配特定的默认值，例如：


    ```java

    Byte a;

    Short number;

    logical answer;

    ```


    这将导致值分别为 0、0 和 false。更完整的默认值列表如下：所有数据类型 `byte`、`short`、`int` 和 `long` 将默认为 0，而数据类型
    `float` 和 `double` 将默认为 0.0，`char` 将返回 `''\0''`，string 或任何其他对象将为空，所有的布尔值将从 false
    开始。


    在 Java 中，变量是静态声明的，这意味着开发者必须定义变量将包含的数据类型。为了说明这一点，如果我们想使用变量 `num` 来存储一个数字，必须先声明变量：`int
    num`，然后才能赋值如：


    ```java

    num = 10

    ```


    这个过程通常被称为赋值语句，其中变量被赋予了程序员声明的值。然而，Java 和大多数编程语言的主要特征之一是在，像 `num = 10` 这样的赋值语句中，实际存储的值是等号右侧的值，即值
    10，而 `num` 只是用于召回此存储值的标签。这就是为什么有些 Java 程序员倾向于使用“获取”（getting）值的术语而不是“赋值”（assigning），尽管大多数情况下它们可以互换，且在大多数情况下，它们的作用方式相同。


    但是，应该记住，在给变量赋值后，必须执行函数，以便该变量内部的数据更改其类型。


    ### 变量命名


    创建变量是一项简单的任务，特别是考虑到 Java 开发者倾向于根据数据类型或存储变量的目的来创建和命名它们。然而，命名这些变量有若干规则，否则 Java 将无法识别它们并显示错误消息。变量名的主要限制是它们不应以特殊字符（如下划线）或数字开头。然而，变量名可以由字母、数字甚至下划线等字符组成，只要下划线不在开头即可。你不能使用任何其他字符，如
    `#` 或 `$`，因为这些特殊字符在 Java 中不同的用途，因此在变量名中不会被识别。


    虽然这些是主要规则，但这里有一些变量命名的指南。变量名应该是描述性的，因为在较长的代码中，很难记住 `x` 是做什么用的。使用像 `number` 或 `output`
    这样的变量名比使用 `X` 或 `y` 要容易记忆，并有助于避免误解。除了描述性之外，如果保持名称简短，变量也将更容易使用。虽然像 `accountDetails`
    这样的变量名非常有描述性，但在程序中反复输入它会精疲力竭，而且较长的名称增加了拼写错误的概率，导致代码错误，导致运行时错误或代码无法按预期工作但在此过程中引入了
    bug。应该注意的是，使用小写字母变量一直是一项惯例，尽管对大小写没有限制。


    ## 原生类型命名规范


    当你将使用成员方法时，我们将回到 Java 命名规范。Java 编程中的方法执行操作，它们还接收调用者提供的任何参数，并可以将操作结果返回给调用者。以下是声明方法的语法：


    ```java

    [访问控制修饰符] 返回类型 方法名([参数集])

    // 方法体

    ......

    ```


    在命名你编写的方法时，请记住以下规则。方法名始终是动词，更具体说是动词短语（这意味着你可以使用多个单词来命名它们）。方法名的第一个单词应该是小写的，而其余单词应采用驼峰格式。这里有一个例子：`writeMethodNamesThisWay
    ()`。


    现在你应该记住，动词用作方法名表示动作，而名词用作变量名表示特定属性。


    遵循此 Java 构造的方法语法和命名规范，这里有一个用于计算圆面积的示例代码：


    ```java

    public double calculation CircleArea () {

    return radius * radius * Math.PI;

    }

    ```


    ### 在代码中使用构造函数


    我们只涵盖了与面向对象编程的一些额外细节。正如之前提到的，构造函数看起来像方法，你完全可以将其认为并视为 Java 编程中的一种特殊方法。然而，构造函数在许多方面仍然与方法不同。构造函数的名称与类名相同。使用关键字或运算符
    `new` 创建新的构造函数实例并对其初始化。这里有一个使用 "Employee" 类以及在代码中不同初始化方法的示例：


    ```java

    Employee salary1 = new Employee ();

    Employee wage2 = New Employee(2.0);

    Employee wage3 = new Employee(3.0, "regular");

    ```


