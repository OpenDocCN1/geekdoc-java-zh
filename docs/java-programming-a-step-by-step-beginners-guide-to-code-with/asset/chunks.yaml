- fmt: "\nDecision structures are used in situations where a set of instructions must\
    \ execute if the condition is true, and another set of instructions must be executed\
    \ when the condition is considered false. There are several constructs available\
    \ in Java for programming such scenarios. These structures include:\n\n### If\
    \ the statement\n\nThis statement is used in situations where a condition must\
    \ be tested, and if the condition is true, the code block that follows the statement\
    \ must be executed. The syntax for this construct is:\n\n```\nif (condition) {\n\
    //Body\n}\n```\nAn implementation for this construct is given below:\n```java\n\
    public class ifDemo {\n    public static void main (String args []) {\n      \
    \  int i = 10;\n        int j = 1;\n        if (i> j) {\n            System.out.print(i);\n\
    \        }\n    }\n}\n```\n\n### Else statement\n\nThis statement is used in situations\
    \ where a condition must be tested, and if the condition is true, the code block\
    \ following that statement must execute, otherwise the code block following the\
    \ else will be executed. The syntax for this construct is:\n\n```\nif (condition)\
    \ {\n//Body\n}else {\n//Body\n}\n```\nAn implementation for this construct is\
    \ given below:\n```java\npublic class ifElseDemo {\n    public static void main\
    \ (String args []) {\n        int i = 1;\n        int j = 0;\n        if (i> j)\
    \ {\n            System.out.print(i);\n        }else {\n            System.out.print(j);\n\
    \        }\n    }\n}\n```\n\n### Nested if statement\n\nThis statement is used\
    \ in situations where a condition must be tested, and if the condition is satisfied,\
    \ the block following that statement must execute, otherwise the next condition\
    \ is tested. If this condition is found to be true, the block corresponding to\
    \ the if statement for this condition is executed. If neither condition is met,\
    \ the block following the else is executed. Many conditions can be tested with\
    \ nested if statements. The syntax for this construct is:\n\n```\nif (condition1)\
    \ {\n//Body\n}else if (condition2) {\n//Body\n}else {\n//Body\n}\n```\nAn implementation\
    \ for this construct is given below:\n```java\npublic class nestedIfDemo {\n \
    \   public static void main (String args []) {\n        int i = 0;\n        int\
    \ j = 0;\n        if (i> j) {\n            System.out.print(i);\n        }else\
    \ if (j> i) {\n            System.out.print(j);\n        }else {\n           \
    \ System.out.print (\"Equal\");\n        }\n    }\n}\n```\n\n### Switch\n\nIf\
    \ you have a variable and different code blocks have to be executed for different\
    \ values of that variable, the ideal construct that can be used is a switch statement.\
    \ The syntax for this construct is:\n\n```\nswitch (variable) {\n    case <value1>:\n\
    \        //body\n        break;\n    case <value2>:\n        //body\n        break;\n\
    \    case <value3>:\n        //body\n        break;\n    default:\n        //body\n\
    \        break;\n}\n```\nAn implementation for this construct is given below:\n\
    ```java\npublic class switchDemo {\n    public static void main (String args [])\
    \ {\n        int i = 5;\n        switch (i) {\n            case 0:\n         \
    \       System.out.print(0);\n                break;\n            case 2:\n  \
    \              System.out.print(2);\n                break;\n            case\
    \ 5:\n                System.out.print(5);\n                break;\n         \
    \   default:\n                System.out.print(99);\n                break;\n\
    \        }\n    }\n}\n```\n\n### Conditional Operator\n\nJava also supports the\
    \ conditional operator, also known as `?:` operator. This operator is used to\
    \ override the 'if else' construct. Its syntax is as follows: `expression1?expression2:expression3`\
    \ where `expression1` is the condition to be tested. If condition is true, `expression2`\
    \ is executed, otherwise `expression3` is executed.\n\n### Loop\n\nThere are several\
    \ situations that require the set of instructions to be repeated times. For example,\
    \ if you want to sort a set of numbers, you will have to scan and rearrange the\
    \ set several times to get the layout you want. This flow of execution is known\
    \ as loop. Simply loop is a construct that allows you to execute a block of code\
    \ times. Java supports several constructs that can be used to implement loops.\
    \ These include `while` loop, `for` loop, and `do while` loop.\n\nThe `while`\
    \ loop iterates through the block until the condition specified for the `while`\
    \ loop is true. The moment this condition fails the loop stops.\n\nThe `for` loop\
    \ allows the programmer to manipulate the conditions and the loop variable in\
    \ the same construct. Therefore, you can initialize a loop variable, increase\
    \ / decrease it, and run a loop until the condition on that variable is satisfied.\n\
    \nA `do while` loop is similar to `while` loop. However, in `while` loop, the\
    \ condition is tested before the block is executed. On the other hand, a block\
    \ of code is executed in the `do while` loop and then the condition is tested.\
    \ If the condition is true, loop execution is reinitialized, otherwise the loop\
    \ terminates. It wouldn't be wrong to say that a `do while` loop, once implemented,\
    \ will execute at least once.\n\n### Loop statements\n\nThere are two keywords\
    \ that are specifically used in conjunction with loops and are also referred to\
    \ as control statements because they allow you to transfer control from one section\
    \ of code to another. These keywords are:\n\n#### Break\n\nThis keyword is used\
    \ inside the loop where you want the execution flow to end the loop and immediately\
    \ begin execution at the first statement that comes after the loop.\n\n#### Continue\n\
    \nThis keyword is used inside the loop at the point where the programmer wants\
    \ the computer to skip the rest of the loop and move the control to the first\
    \ loop instruction.\n\nTo help you understand how loops are executed, let's take\
    \ an example and implement it using all three types of loop control.\n\n#### For\
    \ implementation of the loop\n```java\npublic class forDemo {\n    public static\
    \ void main (String args []) {\n        int[] numArray = {100, 300, 500, 700,\
    \ 900};\n        for (int i = 0; i <5; i ++) {\n            System.out.print(numArray[i]);\n\
    \            System.out.print(\",\");\n        }\n        System.out.print(\"\\\
    n\");\n    }\n}\n```\n\n#### Implementing while loop\n```java\npublic class whileDemo\
    \ {\n    public static void main (String args []) {\n        int[] numArray =\
    \ {100, 300, 500, 700, 900};\n        int i = 0;\n        while (i < 5) {\n  \
    \          System.out.print(numArray[i]);\n            System.out.print(\",\"\
    );\n            i++;\n        }\n        System.out.print(\"\\n\");\n    }\n}\n\
    ```\n\n#### Implementing do while loop\n```java\npublic class doWhileDemo {\n\
    \    public static void main (String args []) {\n        int[] numArray = {100,\
    \ 300, 500, 700, 900};\n        int i = 0;\n        do {\n            System.out.print(numArray[i]);\n\
    \            System.out.print(\",\");\n            i++;\n        } while (i <\
    \ 5);\n        System.out.print(\"\\n\");\n    }\n}\n```\n\n### Enhanced loops\n\
    \nJava also supports an enhanced loop that can be used for array elements. The\
    \ syntax for this loop is:\n\n```\nfor (declaration:expression) {\n    //Body\n\
    }\n```\nThe `declaration` part of the enhanced loop is used to declare a variable.\
    \ This variable should be local to the \"for\" and must be of the same type as\
    \ the array elements. The variable's current value is always equal to the array\
    \ element the loop is passing through. The `expression` is an array or a call\
    \ to a method that returns an array.\n\nAn implementation of the enhanced loop\
    \ is given below:\n```java\npublic class arrayDemo {\n    public static void main\
    \ (String args []) {\n        int[] numArray = {100, 300, 500, 700, 900};\n  \
    \      for (int i: numArray) {\n            System.out.print(i);\n           \
    \ System.out.print(\",\");\n        }\n        System.out.print(\"\\n\");\n  \
    \  }\n}\n```\n\n### Hierarchy of exceptions\n\nJava has a built-in class called\
    \ `java.lang.Exception` and all exceptions belong to this class. All exception\
    \ classes are subclasses of that class.\n\nMoreover, the `Throwable` class is\
    \ a class of the `Exception` class.\n"
