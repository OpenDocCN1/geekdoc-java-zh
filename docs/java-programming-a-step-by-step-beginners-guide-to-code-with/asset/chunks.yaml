    \ [1, 2]\nBoard size: 2\n![Image](images/image-24.jpeg)\nThe array is empty: false\n\
    The array is empty: true\n\n## Combined list\n\nLists are linked by a dynamic\
    \ data structure and memory is all allocated at runtime. The concept of a linked\
    \ list is not about storing data continuously. The nodes of the linked list contain\
    \ a link that points to the next items in the list.\n\nLinked lists are slower\
    \ than arrays in terms of performance because linked list items cannot be accessed\
    \ directly. A linked list is a useful data structure when you don't know in advance\
    \ the number of items to keep.\n\nThere are many types of linked lists: linear,\
    \ recursive, double, double-cyclic, etc.\n\n### Combined list ADT operations\n\
    \nBelow is the linked list API.\n\n- `Insert(k)`: adds k to the beginning of the\
    \ list. Insert an item at the beginning of the list. Just create a new item and\
    \ move the pointers. Make this new item the first item in the list. This operation\
    \ will take an O (1) fixed time.\n- `Delete()`: Delete item at the top of the\
    \ list. Delete item at the beginning of the list. You only need to move one pointer.\
    \ This operation will also take a constant O (1) time.\n- `PrintList()`: Displays\
    \ all list items. Start with the first item and then follow the directions. This\
    \ operation takes O (N) time.\n- `Find(k)`: Find the position of the element with\
    \ value k. Start with the first item and follow the pointer until you get the\
    \ value you want or reach the end of the list. This operation takes O (N) time.\
    \ Note: Binary search does not work on linked lists.\n- `FindKth(k)`: Find the\
    \ element at position k. Start with the first element and follow the links until\
    \ you reach the kth element. This operation takes O (N) time.\n- `IsEmpty()`:\
    \ Check that the number of items in the list is zero. Just check the list root\
    \ pointer, if it is null then the list is empty otherwise it is not empty. This\
    \ operation takes O (1) time.\n\n### Implementation of LinkedList in JAVA collections\n\
    \n`LinkedList<E>` in Java Collections is a data structure that also implements\
    \ the `List<E>` interface.\n\nExample:\n\n```java\nimport java.util.LinkedList;\n\
    \npublic class LinkedListDemo {\n    public static void main(String[] args) {\n\
    \        LinkedList<Integer> ll = new LinkedList<Integer>();\n        ll.addFirst(2);\
    \ // 8 added to the list\n        ll.addLast(10); // 9 added to the end of the\
    \ list.\n        ll.addFirst(1); // 7 added to the first list.\n        ll.addLast(11);\
    \ // 20 added to the end of the list\n        System.out.println(\"LinkedList\
    \ Contents:\" + ll);\n        ll.removeFirst();\n        ll.removeLast();\n  \
    \  }\n}\n```\n\nExit:\nLinkedList content: [1, 2, 10, 11]\nLinkedList Contents:\
    \ [2, 10]\n![Image](images/image-25.jpeg)\n\n## Stack\n\nStack is a special type\
    \ of data structure that conforms to LIFO (Last-In-First-Out) strategy. This means\
    \ that the item added last will be deleted first. The different uses for stack\
    \ are:\n\n1. Recursion: recursive calls are implemented using stack.\n2. Postfix\
    \ evaluation of expression.\n3. Backtracking means stack.\n4. Deep search of trees\
    \ and graphs.\n5. Convert decimal number to binary etc.\n\n### ADT operations\
    \ on stack\n\n- `Push(k)`: adds the value of k to the top of the stack.\n- `Pop()`:\
    \ removes item from the top of the stack and return its value.\n- `Top()`: returns\
    \ the value of the item at the top of the stack.\n- `Size()`: returns the number\
    \ of items in the stack.\n- `IsEmpty()`: Whether the stack is empty. Returns true\
    \ if the stack is empty, return false otherwise. Note: All stack operations are\
    \ implemented in O (1) time.\n\n### Stack implementation in Java Collection\n\n\
    Stack is implemented by calling the `push` and `pop` methods of the `Stack<T>`\
    \ class.\n\nExample:\n\n```java\npublic class StackDemo {\n    public static void\
    \ main(String[] args) {\n        Stack<Integer> stack = new Stack<Integer>();\n\
    \        stack.push(1);\n        stack.push(2);\n        stack.push(3);\n    \
    \    System.out.println(\"Stack:\" + stack);\n        System.out.println(\"Stack\
    \ Size:\" + stack.size());\n        System.out.println(\"Stack Pop:\" + stack.pop());\n\
    \        System.out.println(\"Top of stack:\" + stack.peek());\n        System.out.println(\"\
    The stack is empty:\" + stack.isEmpty());\n    }\n}\n```\n\nExit:\n![Image](images/image-26.jpeg)\n\
    Stack: [1, 2, 3]\nStack size: 3\nBreak the stack: 3\nTop of stack: 2\nThe stack\
    \ is empty: false\n\nThe stack is also implemented by calling the `push` and `pop`\
    \ methods of the `Deque<T>` class. JDK provides both `Deque<T>` and `Stack<T>`.\
    \ We can use both of these classes. But there are some advantages to `Deque<T>`.\n\
    \n1. The first reason is that the `Stack<T>` does not control from the Collection\
    \ interface.\n2. The second `Stack<T>` goes with `Vector`, so random access is\
    \ possible, so inhibits stack.\n3. The third `Deque` is more efficient compared\
    \ to `Stack<T>`.\n\n## Queue\n\nQueue is FIFO (First-In-First-Out) structure.\
    \ The first item added to the queue will be removed, and so on. Queue has the\
    \ following applications:\n\n1. Access to shared resources (e.g. printers)\n2.\
    \ Multiprogramming\n3. Message queue\n4. BFS, graph traversal implemented using\
    \ queue.\n\n### Operations on the queue\n\n- `add(k)`: adds new item k at the\
    \ back of the queue.\n- `remove()`: removes item from the front of the queue and\
    \ returns its value.\n- `front()`: returns the value of element at the beginning\
    \ of the queue.\n- `size()`: returns the number of items inside queue.\n- `isEmpty()`:\
    \ returns 1 if queue is empty, otherwise returns 0. Note: All queuing operations\
    \ are implemented in O (1) time.\n\n### Queue implementation in Java Collection\n\
    \n`ArrayDeque<T>` is implementation of the double-ended queue. If we use `add()`,\
    \ `remove()` and `peek()` it will act like queue. (Also, if we use `push()`, `pop()`\
    \ and `peek()`, it behaves like stack.) Example:\n\n```java\nimport java.util.ArrayDeque;\n\
    \npublic class QueueDemo {\n    public static void main(String[] args) {\n   \
    \     ArrayDeque<Integer> queue = new ArrayDeque<Integer>();\n        queue.add(1);\n\
    \        queue.add(2);\n        queue.add(3);\n        System.out.println(\"Queue:\"\
    \ + queue);\n        System.out.println(\"Queue Size:\" + queue.size());\n   \
    \     System.out.println(\"Queue peek:\" + queue.peek());\n        System.out.println(\"\
    Removing queue:\" + queue.remove());\n        System.out.println(\"Queue is empty:\"\
    \ + queue.isEmpty());\n    }\n}\n```\n\nExit:\nQueue: [1, 2, 3]\nQueue size: 3\n\
    Queue preview: 1\nDelete the queue: 1\nThe queue is empty: false\n\n# CHAPTER\
    \ 10: File handling\n\nThis chapter covers the details of reading, writing, creating,\
    \ and opening files. You can choose from a wide variety of file I / O classes\
    \ and methods.\n\n### Reading a text file\n\nReading a text file is a crucial\
    \ skill in Java and has many practical uses. `FileReader`, `BufferedReader`, and\
    \ `Scanner` are useful classes for reading a plain text file in Java. Each of\
    \ them has specific characteristics that make them uniquely qualified to deal\
    \ with certain situations.\n\n### BufferedReader\n\nThis technique reads text\
    \ from the character input stream. Caches characters, arrays, and lines for efficient\
    \ reading. You can specify the buffer type or use the standard type.\n"
