    # CHAPTER 6: Examples of proper working code\n\nTraditionally, every first program\
    \ prints \"Hello World\". This first program shows you how to create, save, and\
    \ run a program. It also shows the basic structure used in all Java programs.\n\
    \nHere is a screenshot of a window created by Hello World:\n\n## Lesson 1 - Java\
    \ projects and packages\n\nPrograms are organized first by Java projects and then\
    \ by packages within Java projects. You will create a Java project for each program\
    \ in this book.\n\nPackages contain program files that are typically used together.\
    \ Since the programs in this book will be small, most Java projects you create\
    \ will have only one package.\n\nIn this lesson, you will create one Java project\
    \ and one package for your first program.\n\n### Give it a try\n\nCreate your\
    \ first Java project called Hello World:\n\n1. If Eclipse is no longer open:\n\
