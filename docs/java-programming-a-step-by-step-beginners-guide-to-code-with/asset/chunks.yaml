    descriptors, such as its values and other relevant data that make up the object.


    The second criterion is the "method" of the object.


    To make it clearer, let''s say there is a "Human" class. This class will have
    attributes such as height, weight, gender and race. A class may also have methods
    such as "run", "walk", "talk". These theoretical components make up the "human"
    class, the blueprint of the object.


    Now that the class has been defined, the programmer, if he so wishes, can create
    an object using the "human" class as the blueprint.


    They can invoke the "Human" class and "fill" its attributes, giving it a specific
    height, weight, gender and race. In addition, the object already has built-in
    functions such as "run", "walk" and "talk", so after creating an object, say "Mike"
    from the "Human" class, it already has functions to run, walk and speak without
    having to a developer re-coding these specific functions as they are already there
    "Inherent" in the created object.


    In short, this is object-oriented programming: a way of programming that allows
    the programmer to draw on predefined classes to make them easier to describe and
    use their internal or built-in functions to handle them.


    Assuming the reader is not a complete newbie to programming and has been introduced
    to the programming world via C or some other procedural... heavy language, the
    next logical question would be: why use object oriented programming at all?


    Well, one of its main benefits is that it saves you time in the long run.


    Procedural programming is usually much faster and simpler in simpler algorithms
    and programs; instead of constructing and defining a class and creating an object
    based on that class, the programmer just has to declare the necessary variables
    and write functions and create an algorithm to solve the problem, you need code
    to address.


    However, when it comes to more complex programs that require more complex solutions,
    this is where OOP starts to shine and this is where it begins to show its strength.


    In many programs it will happen that there will be several "Objects" or clusters
    of data that need to be grouped together and the developer will be treated in
    a certain way. This is what "class" is supposed to be.


    Instead of declaring a new set of variables per data, they can just take a predefined
    "class" and create a new "object". Let''s see how it works in practice. If programmer
    were to program a game of chess in a procedural manner, he would have to manually
    describe each pawn, all sixteen pawns, four bishops and four rooks, two queens
    and two kings. In addition, they will have to write functions that will allow
    each element to move separately.


    However, if programmer uses object-oriented programming instead of coding sixteen
    pawns, four bishops, four rooks, two queens, two kings, they simply have to code
    six classes: one class to describe each piece on the board. The programmer can
    now include the move functions in each class, and the attributes describe their
    position: whether it is white king pawn or black queen''s pawn, all of this can
    be inserted through the "attributes" part of the class. Instead of thirty clusters,
    the programmer only needs to make six. Now it is much easier, shorter and also
    more elegant.


    ### Java Tokens


    Java tokens are values smaller than other integers. These numbers will be between
    -3268 and 32767. The code I was using won''t run on short, instead I''ll have
    to use the `short` function to make sure the values stay within the limits you
    set. Large values will be stored inside the `double` value along with floating
    point values. `Double` doesn''t have to be used if I can use a floating number.
    Because I store a floating point variable, I''ll have to put the letter at the
    end of my value. This value should be `f` because it is a floating number.


    In Java, `Boolean` refers to either false or true. finds out if it''s true or
    false using reserved keywords. Therefore, the logical expression type will take
    one of these values. Examples to demonstrate are: There are a few things to note
    about this program. First, `println()` prints a boolean value. Second, `Boolean`
    values control the flow of `if` statements. You don''t have to go the long way
    by writing the boolean type like this:


    ```

    if (b == true)

    ```

    The result shown by an operator such as `<` is a logical value. This is one of
    the reasons why the expression `11 > 8` returns true. Also, the second pair of
    parentheses around `11 > 8` is important because the `+` is in front of `>`.


    ### Identifiers


    The top layer of the diagram above is for an identifier or a name. This top layer
    is the name you give to the class. The name should identify in detail as well
    as describe the type of object experienced by the user. Put simply the name or
    identifier should identify the class.


    ### Operators


    Java has an extensive list of operators. If you are wondering what operator is,
    you can look at it as symbol that tells the compiler specific message to perform
    logical or arithmetic operation. In Java, you will interact with four classes
    of operators. The four classes include:


    - Logical operator own- Bitwise operator

    - Relational operator

    - Arithmetic operator


    Other languages, Java has defined list of additional operators. When it comes
    to learning the Java programming language or any other programming language, there
    are five basic concepts you need to understand before you start. These five basic
    concepts include:


    - Variables

    - Data structures

    - Control structures

    - Syntax


    ### Tools


    Each of these concepts will be carefully explained at beginner level to ensure
    they are understood. Separators are not suitable for high-level abstraction: that
    many of these programs use low-level constructs which are mainly used for low-level
    abstraction. The common approach to these programming languages is that they focus
    on the machine - how to get the computer to do something, not how these features
    can help the user''s problems. In low-level abstraction, data structures and algorithms
    are treated separately, while in high-level abstraction they are treated as a
    whole.


    ### Literals


    When it comes to literals in Java, we mean constant values that appear as humans
    can read. We can say that the number 200 is literal. In most cases, literals can
    be constants. Literals are important in a program. In fact, most Java programs
    use literals. Java literals refer to various primitive data types. The way each
    literal is shown depends on its type. As mentioned ago we enclose string constants
    in single quotation marks, such as ''c'' and ''%''. We define literals as integers
    without the fractional part. For example, 12 and -30 are integer literals. The
    floating point literal should contain the decimal point plus the fractional part.
    12.389 is a floating literal. Java also allows you to apply scientific notation
    to floating point literals.


    ### Remarks


    When that happens, we call gray comments. At the current stages of the program,
    the gray comments are debatable.

