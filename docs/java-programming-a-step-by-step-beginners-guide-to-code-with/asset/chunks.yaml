    ## Java 包


    包只是接口和类的一种分组方式。Java 包作为类的容器。分组的典型依据是功能性。使用包有助于代码重用。当接口和类被分类后，你可以轻松地访问它们 并在其他程序中使用。使用包有助于防止类和接口之间的命名冲突。


    ![Image](img/image-15.jpeg)


    ![Image](img/image-16.jpeg)


    要创建一个包，请在包名之前使用 `package` 语句作为第一条语句。这是一个示例：


    ### 导入声明 (Import declaration)


    你可以使用 `import` 关键字将包导入到源文件中。`import` 语句帮助编译器找到类或源代码的位置。


    你可能只想从一个包中导入一个类。你可以使用点运算符 `.` 来指示包和类。例如：要导入一个包中的所有类，可以在点操作符后使用通配符 `*`。例如：


    ![Image](img/image-17.jpeg)


    ## 修饰符


    修饰符是改变代码中定义含义的关键字。Java 提供了几种修饰符。


    ### 访问修饰符 (Access modifiers)


    访问修饰符定义了方法、变量、类和构造函数的访问级别。


    - **Private (私有)**：仅类内部可用。当方法、变量、类或构造函数声明为 `private` 时，意味着它们只在类内部可用。然而，如果类有公共的
    getter 方法，你可能在类外部访问私有变量。`private` 关键字表示最高限制。注意，你不能将接口和类声明为 `private`。

    - **Public (公共)**：对所有人可见。定义为 `public` 的方法、接口、类等可以从其他类访问。类似于在公共类中定义的方法或字段，你可以访问该
    Java 类。前提是它们在同一个包中。如果你想从另一个包访问公共类，将需要导入该类。根据类继承的概念，子类继承所有的公共变量和方法。应用程序的 `main()`
    方法必须声明为 `public`，Java 解释器才能调用它来运行该类。

    - **Protected (保护性)**：对所有子类和包可用。在父类中将方法、变量或构造函数声明为 `protected`，使其仅对同包中的类或另一个包中的子类可用。如果你允许子类使用辅助变量或方法并防止无关类使用它们，则使用这种访问方式。接口以及下面的字段不应声明为
    `protected`，但接口外的字段和方法可以声明为 `protected`。类不应声明为 `protected`。

    - **Default (默认)**：当未给出修饰符时适用——对包可用。未声明修饰符的方法或变量对包内的其他类可用。


    下表总结了各种访问修饰符及其影响：


    | 修饰符 | 类内部 | 包内部 | 子类（包） | 世界 |

    | :--- | :--- | :--- | :--- | :--- |

    | Private | Y | n | n | n |

    | Public | Y | Y | Y | Y |

    | Protected | Y | Y | Y | n |

    | Default | Y | Y | n | n |


    ### 不可用的修饰符 (Modifiers not available)


    被拒绝的修饰符可以访问 Java 中的各种功能。


    ### Final - 用于确定变量、方法和活动的实现


    - **Final variables (final 变量)**：尾随变量只能显式初始化一次。一旦你将变量声明为 `final`，你将永远无法将其赋值给另一个对象。然而，请记住你仍然可以更改属性中存储的数据。这意味着虽然你可以更改对象的状态，但不能更改引用。`final`
    修饰符通常与 `static` 结合使用，从常量创建一个类变量。

    - **Final methods (final 方法)**：`final` 关键字用于防止方法被子类修改。

    - **Final classes (final 类)**：`final` 修饰符用于防止其他类继承被声明为 `final` 的类的任何特性。

    - **Static (静态)**：用于创建方法或变量。你可以使用此关键字创建一个独立于类实例的唯一变量（静态变量或类变量）。静态方法仅在考虑从变量中获取数据时进行识别并执行操作。你可以通过在类名后输入变量或方法名和点
    (`.`) 来访问类方法和变量。


    ### Abstract (抽象) - 用于创建抽象方法或类


    - **Abstract (抽象)**：当类被声明为 `abstract` 时，意味着你将无法实例化该类。类被声明为 `abstract` 的唯一理由是为了扩展它。你不能将类同时声明为
    `final` 和 `abstract`，因为你不能扩展一个结束性的类。使用抽象方法的类必须声明为 `abstract` 类。这样做会导致编译错误。

    - **Abstract method (抽象方法)**：由于它在声明时没有实现，抽象方法从子类派生其方法的主体。抽象方法不能声明为严格或确定的。除非它本身也是抽象类，否则扩展抽象类的类必须采纳父类的抽象方法。包含一个或多个抽象方法的类必须声明为抽象类。另一方面，抽象类不需要抽象方法。


    示例：


    ![Image](img/image-18.jpeg)


    ![Image](img/image-19.jpeg)


    - **Synchronized (同步)**：`synchronized` 修饰符用于表示一次只有一个线程可以访问该方法。你可以与任何访问级别修饰符一起使用此关键字。


    示例：


    - **Volatile (易变的)**：此关键字用于表示访问 volatile 变量的线程应将其私有副本与内存中的主副本合并。结果是它将所有变量缓存副本与主内存同步。此修饰符只能用于定义私有或对象类型的实例变量。


    示例：


    ![Image](img/image-20.jpeg)


    ![Image](img/image-21.jpeg)


    - **Transient (瞬态)**：`transient` 关键字用于告诉编译器在序列化包含标记变量的对象时跳过该实例变量。


