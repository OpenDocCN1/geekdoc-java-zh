    # CHAPTER 2: Variables


    ## What are the variables?


    On the other hand, a variable is an "object" that contains a particular type of
    data and is assigned or received a value. It''s called a variable because the
    value it contains can change depending on how it''s used in your code, how the
    encoder can declare its value, and even how the user of the program chooses to
    interact with it. In short, a variable is a memory unit for a data type.


    Having access to variables allows developers to conveniently label and recall
    stored values at hand.


    ## Types of variables in Java


    Java requires the developer to use declarations, the lines of code used to declare
    variables, and define them by specifying a specific data type and name. Java has
    a specific way of treating variables, defining variables as containers containing
    a specific type and value of information, unlike some languages, such as python,
    which only requires a variable declaration and a variable can dynamically change
    its type; Java variables are static and retain their type when declared.


    ```java

    int number = 20;

    Boolean = true;

    Hello hello = "Hello world!"

    ```


    The declaring syntax is shown in the previous examples, where the variable type
    is first, then the variable name, then the value. Also note that the declaration
    statement can consist of multiple declarations on a single line, as in the following
    example:


    ```java

    Int number = 20, Boolean completed = true, string hello = "Hello World!";

    ```


    Java variables can be declared without any value first; in these cases, Java decides
    to declare these variables with a specific default value, for example:


    ```java

    Byte a;

    Short number;

    logical answer;

    ```


    This will result in the values of 0, 0, and false, respectively. A more complete
    list of defaults is follows: all data types `byte`, `short`, `int` and long will
    default to 0, while data types float and double will default to 0.0 and char will
    return `''\0''`, string or any other object will have empty and all boolean values
    will start with false.


    In Java, variables are declared static, which means the developer must define
    the type of data the variable will contain. To illustrate this, if we want to
    use the variable `num` to hold a number, we must first declare the variable: `int
    num` before we can assign a value like:


    ```java

    num = 10

    ```


    The process is usually known as an assignment statement in which variable is assigned
    a value declared by programmer. However, one of the main things about Java and
    most programming languages is that in an assignment statement like `num = 10`,
    the actual stored value is the one to the right of the equal sign, the value is
    10, and `num` is just a tag to recall this stored value. This is why there are
    Java programmers who prefer the jargon of "getting" values than "assigning", although
    most can be used interchangeably and except in the case, they work for most the
    same way.


    However, it should be remembered that after assigning values to variables, functions
    must be performed so the data inside that variable change its type.


    ### Naming a variable


    Creating variables is an easy task, especially considering Java developers tend
    to create and name them by data type or the purpose for which variable is stored.
    However, there are several rules for naming these variables, otherwise Java will
    not recognize them and an error message will be displayed. The main restrictions
    on variable names are that they should not start with a special character such
    as an underscore or a number. However, variable names can consist of characters
    such as letters and numbers, and even underscores, as long as the underscore is
    not placed at the beginning. You cannot use any other characters such as `#` or
    even `$` because these special characters have different uses in Java and therefore
    will not be recognized in the variable name.


    While these are the main rules, here are some guidelines for naming your variables.
    The variable name should be descriptive, as in longer codes it can be difficult
    to remember what the `x` is for. Having a variable name such as `number` or `output`
    is much easier to remember compared to having `X` or `y` and will help avoid misunderstandings.
    In addition to being descriptive, variables will also be easier to use if their
    names are kept short. While having a variable name such as accountDetails is very
    descriptive, typing it repeatedly in program will be exhausting, and longer names
    increase the likelihood of typographic errors, leading to errors in the code,
    resulting in run-of-time error or code doesn''t work as intended but introduces
    bugs along the way. It should also be noted that it has always been practice to
    write variables in lowercase, and although there are no restrictions on the case
    of lowercase.


    ## Primitive types naming conventions


    We''ll come back to Java naming conventions you''ll be using member methods. The
    methods in Java programming perform operations, they also receive any argument
    supplied by the caller, and can return the result of the operation to the caller.
    Here is the syntax for declaring a method:


    ```java

    [Access Control Modifier] Return Type methodName([parameter set])

    // method body

    ......

    ```


    Here are some rules to keep in mind when naming the methods you write. Method
    names are always verbs, more specifically verb phrases (meaning you can use multiple
    words to name them). The first word of the method name should be in lowercase,
    while the remaining words should be in camel format. Here is an example: `writeMethodNamesThisWay
    ()`.


    Now you should remember that verbs are used as method names and indicate an action,
    while nouns are used as variable names and denote a certain attribute.


    Following the method declaration syntax and naming convention for this Java construct,
    here is a sample code you can use to calculate the area of a circle:


    ```java

    public double calculation CircleArea () {

    return radius * radius * Math.PI; own}

    ```


    ### Using constructors in code


    We cover just a few additional details related to object-oriented programming.
    As mentioned before, the constructor will look like a method and you can certainly
    think of it and treat it as a special kind of method in Java programming. However,
    the constructor will still differ from the method in several ways. The constructor
    name will be the same as the class name. Use the keyword or operator `new` to
    create a new constructor instance as well as initialize it. Here is an example
    using the "Employee" class and the different ways it was initialized in code:


    ```java

    Employee salary1 = new Employee ();

    Employee wage2 = New Employee(2.0);

    Employee wage3 = new Employee(3.0, "regular");

    ```

