  trans: "\n\n```java\n/* Create two objects with constructor */\nEmployee empOne\
    \ = new Employee (\"Bobby Bucket\"); Employee empTwo = new Employee (\"Shelley\
    \ Mary\");\n\n// Call methods for each of the created objects\nempOne.age(28);\n\
    \nempOne.designation(\"Senior Developer\"); empOne.salary(1500);\n\nempOne.printEmployee();\n\
    \nempTwo.age(22);\n\nempTwo.designation(\"Developer\"); empTwo.salary(850);\n\n\
    empTwo.printEmployee();\n```\n\n现在编译这些类并运行 `EmployeeTest`；执行操作并查看结果。\n\n你应该看到如下：\n\
    \n```text\nExit\nC: > javac Employee.java\nC: > javac EmployeeTest.java\nC: >\
    \ java Employee\nName: Bobby Bucket\nAge: 28\nAppointment: Senior Developer\n\
    Salary: 1,850,000\nName: Shelley Mary\nAge: 22\nDesignation: Programmer\nWage:\
    \ 850.00\n```\n\n![图片](img/image.jpeg)\n\n# 第 6 章：正确工作代码示例\n\n传统上，每个第一个程序都会打印“Hello\
    \ World”。第一个程序将向你展示如何创建、保存和运行程序。它还展示了所有 Java 程序中使用的基本结构。\n\n这是一个由 Hello World\
    \ 创建的窗口截图：\n\n## 第 1 Lesson - Java 项目与包\n\n程序首先通过 Java 项目组织，然后通过 Java 项目内部的包（packages）组织。你将为书中的每个程序创建一个\
    \ Java 项目。\n\n包包含通常会被一起使用的程序文件。由于书中的程序很小，你创建的大多数 Java 项目将只有一个包。\n\n在本节中，你将为你的第一个程序创建一个\
    \ Java 项目和一个包。\n\n### 尝试一下\n\n创建一个名为 Hello World 的你的第一个 Java 项目：\n\n1. 如果 Eclipse\
    \ 尚未打开：\n   a. 双击你在桌面上创建的 Eclipse 快捷方式。\n   b. 点击 OK 使用 Java 工作文件夹作为工作空间。\n2.\
    \ 在 Package Explorer（包管理器）面板中右键点击并选择 New / Java Project（新建 / Java 项目）。\n3. 将项目命名为\
    \ `Java Hello World`，如果版本是 1.7 或更高，则选择 Use default JRE，然后如下所示点击 Next。如果默认 JRE\
    \ 低于 1.7，则选择 Use JRE 1.7 or later。\n![图片](img/image-1.jpeg)\n4. 点击 Libraries（库），然后如下所示点击\
    \ Add External JARs ...（添加外部 JAR 文件）。\n![图片](img/image-2.jpeg)\n5. 搜索并选择你在 Java\
    \ 工作文件夹中安装的 `DIYJava.jar` 文件，然后点击 Open。\n6. 点击 Finish（完成）。\n\nPackage Explorer\
    \ 面板现在包含一个项目（Hello World），并已添加一个 JAR 文件（`DIYJava.jar`），如下所示：\n![图片](img/image-3.jpeg)\n\
    \n### 在 Hello World 项目中为 Hello World 创建包：\n\n1. 右键点击 Hello World 项目并选择 New / Package（新建\
    \ / 包）。\n2. 将包命名为 `thispackage.helloworld`。使用你自己的名字作为包名的一部分，例如 `thispackage.myname.helloworld`。\n\
    3. 点击 Finish。\n\nPackage Explorer 面板现在显示在 Hello World 项目中创建的包。\n\n**关键点及更多：**\n\
    * 在 Package Explorer 中右键点击以创建 Java 项目和包。\n* 为每个程序创建一个不同的 Java 项目。\n* Eclipse 会在电脑上创建一个名称与\
    \ Java 项目同名的文件夹。为你的项目指定你想要的文件夹名称。\n* 现在，你的 Java 文件夹中有一个名为 Hello World 的文件夹。\n\
    * 例如，像 Hello World 项目那样，将每个单词的首字母改为大写，并在单词之间留空格。\n* 在你通过此书创建的 Java 项目中添加 `DIYJava.jar`。\n\
    * `DIYJava.jar` 是一个外部 JAR 文件。\n* `DIYJava.jar` 使得编写在窗口显示文本的程序变得简单。\n* 在 Java 项目中将程序文件组织成包。\n\
    * 将通常一起使用的程序文件放在一个包中。\n* 由于你的程序很小，你的大多数程序将只有一个包。\n\n**包名命名策略：**\n* 确保你的包名与任何其他包名不同。\n\
    * Java 程序员使用他们的姓氏或公司名作为包名的第一部分。\n* 使用全小写字母且不留空格。\n* 在包名的不同类别之间使用点号。例如，如果包名指定了谁创建了包以及它的用途，请在创建者和用途之间加上点号。\n\
    * 确保你正在创建书中描述的 Java 项目时，你选择了 Use JDK-1.7 or later JRE 运行时选项。当你选择此项目创建选项时，Eclipse\
    \ 将在所有未来的 Java 项目中默认使用此选项。\n* Java 项目针对 Eclipse；包是为了 Java 的。\n* 既然你正在使用 Eclipse，你将同时使用\
    \ Java 项目和包。如果你在没有 Eclipse 的情况下开发 Java 程序，可能只会使用包。\n\n## 第 2 Lesson - 类、子类与程序\n\
    \nJava 程序由一个或多个类组成。类包含执行所需任务的实际程序语句。每个类都必须有不同的名称。例如，设计在窗口中运行的程序必须是某种类型的类。\n\n\
    在本节中，你将创建你的第一个类：在 `Window` 中运行的程序。\n\n### 尝试一下\n\n使用 `Window` 类创建你的第一个类：\n\n1.\
    \ 在 Package Explorer 面板中右键点击你的包并选择 New / Class（新建 / 类）。\n2. 在如下所示的类名处输入 `HelloWorld`（提示：\"\
    Hello\" 和 \"World\" 之间没有空格）。\n3. 如下所示输入 `Window` 作为类型，并点击 OK。\n4. 你想要创建哪些方法？选择如下所示选项：\n\
    \   a. `public static void main(String[] args)`\n   b. Constructors（构造函数）。\n \
    \  c. 无论是否选择第三选项抽象方法并不重要。\n![图片](img/image-6.jpeg)\n5. 点击 Finish 创建类。\n\nEclipse\
    \ 将为 `HelloWorld` 类创建如下代码。如果你将阅读字体设置为较小，阅读这些代码可能会更容易。\n\n```java\npackage thispackage.helloworld;\n\
    \npublic class HelloWorld extends Window {\n\n    public HelloWorld() {\n    \
    \    // TODO: generated constructor\n    }\n\n    public static void main(String[]\
    \ args) {\n        // TODO: generated method\n    }\n\n}\n```\n\nEclipse 添加了你不需要的注释。注释是以\
    \ `//` 开头的行，或者是以 `/*` 开头并以 `*/` 结尾的组。\n\n1. 从如下列表中 `(Code was removed from here)`\
    \ 处移除自动生成的注释行。\n\n```java\npackage thispackage.helloworld;\n\nimport com.godsoft.diyjava.Window;\n\
    \npublic class HelloWorld extends Window {\n\n    public HelloWorld() {\n    }\n\
    \n    public static void main(String[] args) {\n\n    }\n\n}\n```\n\n从你为书中创建的任何类的代码中移除自动生成的注释。在后面的课程中，你将添加自己的注释。\n\
    \n点击任何 Completed 链接查看如何完成代码。然而，如果你在找到答案之前尝试自己完成代码，你会学更多。\n\n以 `public static void\
    \ main` 开始的代码块被称为 `main()`。以 `public HelloWorld()` 开始的代码块被称为构造函数。\n\n现在添加你的第一行代码：\n\
    \n1. 按照此处所示所示向构造函数和 `main()` 方法中添加代码。代码更改在目录中始终以粗体显示。\n\n```java\npackage thispackage.helloworld;\n\
    \nimport com.godsoft.diyjava.Window;\n\npublic class HelloWorld extends Window\
    \ {\n\n    public HelloWorld() {\n    }\n\n    public static void main(String[]\
    \ args) {\n    }\n\n}\n```\n\n"
