    Java ME SDK 备有必要的工具，可在应用程序开发、功能测试和设备模拟实现期间在独立环境中使用。正如 Oracle 公司网站上公告的，截至 2019
    年，此 JDK 非常适用于“连接受限设备配置 (CLDC)”和“连接设备配置 (CDC)”。这结果实现了一个单一且多功能的应用程序开发环境。


    还有其他几种 Java ME 解决方案支持在应用程序中实现 Java 编程语言。Java ME Embedded 提供了一个集成了设备 IoT 能力的运行时环境，而嵌入式
    Java ME 客户端则有助于运行和优化嵌入式程序功能的软件开发。Java for Mobile 则使用 CLDC 和 Java ME 开发工具栈为移动设备创建创新功能。


    Java 运行时


    请记住，Java 应用程序要高效运行，必须满足某些条件。`JRE` 包含了创建这些必要条件的要素。这包括 `JVM` 及其相应的类文件和属性。虽然 `JRE`
    作为 `JDK` 的一个组件运行，但它可以独立运行，特别是当任务仅限于运行而非创建应用程序指令时。


    `JRE` 为 Java 编程生态系统中的各种程序提供了重要的操作属性。例如，如果一个程序在其上运行独立的 `JRE`，则该程序被认为是自包含的。这意味着程序对
    `JRE` 的访问不依赖于其他程序。这种独立性使得程序能够与不同的操作系统保持兼容。


    Java 虚拟机


    `JVM` 充当计算机程序中 Java 实现的规范。它是 Java 平台无关特性背后的驱动力。`JVM` 作为由其他程序执行的程序的地位强调了这一点。编写用于与
    `JVM` 交互并运行运行的程序将其视为一台机器。由于由于原因，使用了类似的汇编、库和接口来编写 Java 程序，允许每个 `JVM` 实现都能针对特定的操作系统进行定制。这有助于将
    Java 程序翻译或解释为本地操作系统上的运行时指令，从而消除了 Java 开发中对平台依赖的性。


    作为一名开发者，你必须小心开发环境和应用程序对于网络攻击和其他威胁的脆弱性。`JVM` 提供了增强的安全功能来保护你免受此类威胁。坚固的安全基础源于字节码中内置的语法和结构。但这并不意味着
    `JVM` 容的类数量受到限制。`JVM` 实际上接受不同的类，只要它们能够通过安全验证。因此，`JVM` 是软件开发的一种可行替代方案。


    `JVM` 经常作为端口包含在各种应用程序和硬件安装中。它是使用 Oracle 或其他供应商指定的算法实现的。因此，`JVM` 提供了一个开放平台。事实上，`JVM`
    包含一个运行时实例作为锚定其操作的主要属性。例如，创建一个 `JVM` 实例只需在命令行上编写指令，反而会运行 Java 类。Java 开发者必须熟悉 `JVM`
    的关键领域，例如用于运行时操作的类加载器和数据段，以及负责执行的引擎。还有与性能相关的组件，如垃圾回收器和堆大小工具，它们在实现 `JVM` 时同样重要。`JVM`
    与字节码之间存在着紧密的关系。


    字节码基本上是包含在类文件中的 `JVM` 命令，连同其他包括符号表在内的信息。它们作为后台程序运行，负责促进 `JVM` 操作的解释和执行。字节码实际上是原生代码的替代品，因为
    Java 不提供后者。`JVM` 寄存器的结构使得它包含反过来处理字节码流的方法——即 `JVM` 的指令集。换句话说，每个 Java 类都包含方法，而加载类的过程会为任何方法执行单条字节流。当程序开始运行时，激活方法会自动触发字节码。


    字节码的另一个重要特性是即时编译 (JIT) 编译器，它在运行时操作期间运行以编译执行代码。此功能实际上在 `JVM` 生态系统中以 HotSpot JIT
    器的的形式存在。它与 Java 运行时操作并发执行代码，因为它具有在优化级别执行的能力以及调整指令增量流量的灵活性。以前，JIT 编译器需要频繁调优以消除冗余程序并刷新内存。调优是一个必要的程序，能为
    JIT 编译器提供最佳性能。然而，较新版本 Java 的频繁更新了自动内存刷新机制，消除了定期调优的需求。


    字节码可以是原始的、灵活的或基于栈的。根据 Vickers (1996)，有七种原始类型包括 `byte`、`char`、`double`、`float`、`int`、`long`
    和 `short`。布尔类型也被广泛使用。每种类型旨在帮助程序员实现字节码可以操作的变量。这会将更大、更强大的类型分配给层次结构中的较高级，而较小的类型占据较低级。Java
    操作码（opcodes）同样是类型的成员，因为它们在分类操作数方面的作用。这种作用确保了操作数保留其状态，从而消除了 `JVM` 中对操作数的识别。`JVM`
    能够加速过程，因为它能够在采用多个为堆提供驻留代码的同时实现多任务处理。根据 Vickers (1996)，它可以是一个隐式常量值，来自常量池的操作数值。


    # 第 4 章节：Java 环境


    在编辑器中编写程序


    使用如记事本之类的简单编辑器来编写程序，或者你可以使用功能全集成开发环境 (IDE)。以下是适用于 Java 的一些流行的 IDE 列表，以及它们的一些基本功能。


    Eclipse


    此 IDE 已经存在很长时间，在 Java 开发者社区中非常流行并广泛使用。该 IDE 的一些基本功能包括：


    它是免费开源的。因此，有许多开发者仍在该 IDE 的开发做出贡献。


    它可以开发 C++、Ruby、HTML5 和 PHP 等其他语言的应用程序。


    它具有丰富的客户端平台。


    提供重构代码的能力。


    它可以帮助完成代码。


    拥有大量的扩展和插件。


    它还支持大多数源码版本控制系统。


    IntelliJ IDEA


    这是另一个被 Java 开发者社区流行的 IDE。该 IDE 的一些核心功能包括：


    社区版是免费开源的。付费版本提供了更多的功能，并允许开发者使用 Java 企业版构建企业应用程序。


