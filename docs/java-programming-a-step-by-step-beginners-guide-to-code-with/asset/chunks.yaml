    \ points and more\n\nJava programs are made up of classes. Each program requires\
    \ a `main()` method in one of its classes.\n\n`main()` must be written `public\
    \ static void main(String [] args)`. Later lessons will clarify what all these\
    \ words mean.\n\nMultiple classes are often used together to create a single program.\
    \ However, most of the programs in this book will be of only one class.\n\nEvery\
    \ class must have a super. Any class can be used as a super. You will create your\
    \ own super in later.\n\nClasses with the same super are considered of the same\
    \ type. For example, the `main` class you create for each program in this book\
    \ will use `DIYWindow` as its super. So every program in this book will be kind\
    \ of `DIYWindow`. To create the classes, right-click in the Package Explorer panel.\
    \ Class names can contain numbers, letters, underscores `$`. Spaces and periods\
    \ cannot be used in class names. Class names cannot start with a number. Class\
    \ names usually start with a capital letter. If the class name contains more than\
    \ one word, the first letter of each word is capitalized and the rest of the letters\
    \ are lowercase. Classes can have one or more constructors. The class constructor\
    \ has the same name as the class and must be declared public. Constructors will\
    \ be explained later. The invoked using `new` followed by the constructor name\
    \ and parentheses. For example, `new HelloWorld()` in the `main()` method calls\
    \ the `HelloWorld` constructor. Code blocks are enclosed in curly braces `{}`\
    \ and each line of code ends with a semicolon; Any Java program runs the `main()`\
    \ method first. The `main()` method calls the class's constructor in all the programs\
    \ in this book. Therefore, the `main()` method will be run first, and then the\
    \ class constructor. Each statement in curly braces runs one at a time, in the\
    \ order that they appear in your code. Blank lines between lines of code have\
    \ no effect how the code works. Blank lines are added to make the code easier\
    \ to read. `print()` statements print the text in parentheses to the window. Each\
    \ `print()` statement is printed on a new line. To print a blank line, use `print()`\
    \ with empty parentheses. The `print()` method is part of `DIYWindow`, which is\
    \ in `DIYjar`. Therefore, you added an external JAR file, `DIYjar`, to the project,\
    \ and selected `DIYWindow` as the super for the `HelloWorld` class. Comments are\
    \ lines starting with `//` or a group of lines starting with `/*` and ending with\
    \ `*/`.\n\n# Chapter 7: Object oriented programming\n\nYou learned earlier that\
    \ Java is an object-oriented programming language. As such, it supports the basic\
    \ principles of this programming paradigm. Object refers to real entities such\
    \ as a bag, car, chair, or pen. Object-oriented programming languages enable programmers\
    \ to design programs that use objects and classes. They provide and support features\
    \ that can simplify software. The most important concepts of this paradigm are:\n\
    \n#### Objects\nClasses\nMethods\nInheritance\nAbstraction\nPolymorphism\nEncapsulation\n\
    \nIn the real world, you'll encounter objects such as people, dogs, cars. These\
    \ have state and behavior. For example, when you think of a cat, its state may\
    \ include color, its behavior may include running, jumping.\n\n#### Classes\n\
    Classes are blueprints or templates for objects. A class defines the state and\
    \ behavior that objects of that type will have. For example, a `Car` class might\
    \ define state like `color` and `model`, and behavior like `drive()` and `brake()`.\n\
    \n#### Methods\nMethods are functions defined within a class. They define what\
    \ the object can do. For example, a `Dog` class might have a method `bark()` that\
    \ prints a sound. Methods can take parameters as input and return values.\n\n\
    #### Inheritance\nInheritance allows one class (the subclass or child class) to\
    \ acquire the properties and methods of another class (the superclass or parent\
    \ class). This promotes code reuse. For example, a `SportsCar` class could inherit\
    \ from a general `Vehicle` class, gaining its state and behavior.\n\n#### Abstraction\n\
    Abstraction is the process of hiding complex implementation details and showing\
    \ only the necessary features of an object. It allows programmers to focus on\
    \ what an object does rather than how it does it.\n\n#### Polymorphism\nPolymorphism\
    \ allows objects of different classes to be treated as objects of a common super.\
    \ For example, both `Dog` and `Cat` could be subclasses of `Animal`. When you\
    \ call the `makeSound()` method on both, each will respond in its own way.\n\n\
    #### Encapsulation\nEncapsulation is the practice of wrapping data (variables)\
    \ and the methods that operate on that data into a single unit (class) and restricting\
    \ direct access to some of the object's components. This is often achieved using\
    \ access modifiers like `private` and `public`.\n"
