    ## Modifiers


    Modifiers are keywords that change the meaning of the definition in your code.
    Java provides several modifiers.


    ### Access modifiers


    Access modifiers define the levels of access to methods, variables, classes and
    constructors.


    - **Private**: Only available within the class. When a method, variable, class
    or constructor is declared `private`, it means they are only available within
    the class. However, if a class has public getters, you may have access to private
    variable outside. The `private` keyword indicates the highest restriction. Note
    you cannot declare interfaces and classes `private`.

    - **Public**: Accessible to the world. Method, interface, class, etc. that are
    defined as `public` can be accessed from other classes. Similar to methods or
    fields defined in a public class you can access the Java class. This is so long
    as they are in the same package. If you want to access a public class from another
    package, you will need to import the class. Following the concept of class inheritance,
    subclasses inherit all public variables and methods. Not the application''s `main()`
    method will have to be declared `public` before the Java interpreter can call
    it to run the class.

    - **Protected**: Available to all subclasses and packages. Declaring a method,
    variable or constructor as `protected` in a superclass makes it available only
    to classes in its package or its subclasses in another package. This type of access
    is used if you want to allow a subclass to use auxiliary variables or methods
    and prevent unrelated classes from using them. Interfaces as well as fields below
    should not be declared `protected`, but fields and methods outside the interface
    can be declared `protected`. Classes should not be declared `protected`.

    - **Default**: Applies when no modifier is given - available for package. Method
    or variable declared without a modifier is available to other classes in the package.


    The following table summarizes the various access modifiers and their effects:


    | Modifier | Inside class | Inside package | By subclass package | World |

    | :--- | :--- | :--- | :--- | :--- |

    | Private | Y | n | n | n |

    | Public | Y | Y | Y | Y |

    | Protected | Y | Y | Y | n |

    | Default | Y | Y | n | n |


    ### Modifiers not available


