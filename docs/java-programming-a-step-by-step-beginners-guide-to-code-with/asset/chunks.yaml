    ### 如何初始化变量？

    现在我们已经知道了如何声明变量，并且知道了我们可以使用的不同变量类型，下一步要学习的是如何在所谓的“表达式”中使用这些变量。表达式是 Java 中最常用的构建模块，通常旨在产生一个新值，尽管在某些情况下，表达式用于为变量赋值一个新值。通常，表达式由值、变量、运算符和方法调用等内容组成。某些表达式不产生结果，但会影响另一个变量。


    一个例子是根据操作更改变量值的表达式：它没有新的输出值，也没有“赋值”新值，而是有一种所谓的“副作用”，导致变量的值发生变化。


    在“Hello World”打印程序中，我们将原始值输入到 `print` 函数中，这也称为对输出进行“硬编码”。然而，在此时我们应该尝试结合所学的关于变量的知识。变量的工作方式与原始值相同，它们仅仅是引用之前之前存储的值，因此程序员可以简单地使用变量名代替值。为了演示这一点，让我们回想一下之前的“Hello
    World”程序：`print ("Hello World"); input ("press return to close this.");` 现在，我们不再硬编码字符串
    "Hello World"，而是简单地将其声明并让程序显示它。它看起来应该是这样的：


    ```

    String = "Hello World";

    print (string);

    input ("press return to close this.");

    ```

    这应该产生相同的结果。


    # 第 3 章：Java 基础


    ## Java 工具包

    JDK 提供了构建、测试和监控 Java 所需的工具。它允许开发者在 Java 操作期间访问软件组件并编译应用程序。例如，开发者需要一个基于 JDK 的环境来编写应用和实现方法。由于
    JDK 更多地执行开发工具包 (SDK) 操作，因此很容易混淆这两者的范围和功能。虽然 JDK 特定于 Java 语言，但 SDK 有更广泛的应用范围。但
    JDK 在开发环境中仍然作为 SDK 组件发挥工作。这意味着开发者仍然需要 SDK 来提供某些 JDK 领域不具备的具有广泛属性的工具。开发者文档、调试工具以及应用程序服务器是
    SDK 为 Java 环境提供的一些关键工具。


    JDK 的部署范围取决于所执行任务的性质、支持的版本以及所使用的 Java 版本。例如，Java 平台标准版 (Java SE) 开发工具包旨在用于 Java
    标准版。Java 企业版 (Java EE) 和 Java 微型版 (Java ME) 平台是 JDK 的另外两个主要子集。这些 Java 版本的版本的细节将在接下来的子主题中详细介绍。自
    2007 年上传到 OpenJDK 门户以来，JDK 一直是一个免费平台。其开源状态使其易于协作，并允许开发者社区克隆、修改或为改进和更新贡献想法。


    ### Java SE

    Java SE 支持各种桌面和服务器应用程序。支持在这些应用程序的开发环境中对 Java 编程语言进行测试和部署。近期 Java SE 发布的相关文档包括高级管理控制台功能和一组更新的
    Java 部署规则。Java SE 13.0.1 是编写此书时 Java SE 对应的最新 JDK 版本。Java SE SDK 包含基本能力以及一组设计用于桌面应用程序的工具、库和实现技术。这些工具的范围非常广，从用于实现
    Java 程序的对象的类和类型，到适用于开发具有网络能力和安全性的应用程序的高级类一有。开发者在创建应用程序时也可以使用此特定的 JDK 来简化访问或 GUI。Java
    EE 平台是一个通过 Java 世界成员的共同努力开发的开源产品。Java EE 与 Java SE 紧密相关，因为前者构建在后者之上。此特定软件集成了设计用于企业级的功能转换，新版本中的特性和增强通常反映了
    Java 社区的投入、需求和请求。Java EE 实际上提供了二十种与 Java 编程兼容的实现。Java EE SDK 旨在用于构建大型业务应用程序。该版本包含了由客户端
    API 提供的增强 REST API 能力、JSON 绑定、servlet 和安全性。该版本于 2019 年 12 月由 Oracle 公司发布，还包含了日期和时间
    API 以及流 (Streams)。


    Java ME 平台利用简单性、可移植性和动态性，为小型配件和小设备提供了一个全面的应用程序开发环境。Java ME 以其交互式且用户友好的导航界面，以及实现网络概念的内置能力而闻名。它与物联网
    (IoT) 密切相关，对于创建设计用于嵌入式技术或连接设备设备的应用程序非常有用，这些设备可用于发明或实现未来的概念。Java ME 运行环境的移植性和属性使其适用于可穿戴设备应用、手机手机、相机、传感器和打印机。

