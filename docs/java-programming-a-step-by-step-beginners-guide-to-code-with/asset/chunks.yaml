    \ click Next as shown in the image below. If the default JRE is less than 1.7,\
    \ select Use JRE 1.7 or later.\n![Image](images/image-1.jpeg)\n4. Click Libraries\
    \ then click Add External JARs ... as shown in the picture below.\n![Image](images/image-2.jpeg)\n\
    5. Search for and select the `DIYJava.jar` file you have installed in your Java\
    \ working folder, then click Open.\n6. Click Finish.\n\nThe Package Explorer panel\
    \ now contains one project (Hello World) with a JAR file added (`DIYJava.jar`)\
    \ as shown in the below:\n![Image](images/image-3.jpeg)\n\n### Create a package\
    \ for Hello World in the Hello World project:\n\n1. Right-click Hello World project\
    \ and select New / Package.\n2. Name the package `thispackage.helloworld`. Use\
    \ your own name as part of the package name, e.g., `thispackage.myname.helloworld`.\n\
    3. Click Finish.\n\nThe Package Explorer panel now shows the package created in\
    \ the Hello World project.\n\n**Key points and more:**\n* Right-click in the Package\
    \ Explorer to create Java projects and packages.\n* Create a different Java project\
    \ for each program.\n* Eclipse will create a folder on your computer with the\
    \ name as the Java project. Give your project the name you want for the folder.\n\
    * You now have a folder named Hello World in your Java folder.\n* For example,\
    \ change the first letter of each word to uppercase and put space between each\
    \ word, as in the Hello World project.\n* Add `DIYJava.jar` to the Java projects\
    \ you create with this book.\n* `DIYJava.jar` is an external JAR file.\n* `DIYJava.jar`\
    \ makes it easy to write programs to display text in a window.\n* Organize program\
    \ files into packages in Java projects.\n* Put program files that are normally\
    \ used together in one package.\n* Since your programs will be small, most of\
    \ your programs will only have one package.\n\n**Package Name Policy:**\n* Make\
    \ your package name different from any different package names.\n* Java programmers\
    \ use their last name or company name as the first part of the package name.\n\
    * Use all lowercase letters without spaces.\n* Use periods between different categories\
    \ in the package name. For example, if the package name specifies who created\
    \ the package and what it will be used for, put a period between the creator and\
    \ what it will be used for.\n* Make sure you are creating the Java projects described\
    \ in this book that you selected the Use JDK-1.7 or later JRE runtime option.\
    \ When you select this project creation option, Eclipse will use this option by\
    \ default in all future Java projects.\n* Java projects target Eclipse; packages\
