    ## Distributor


    The `Collections` library is still subject to the same concurrent access restrictions.
    As always, you need to select the `Collections` library class that suits your
    thread safety requirements. This is because the new methods shown above are simply
    functional abstractions over the same underlying data structures. These methods
    are not particularly susceptible to parallel processing in functional programming
    because they still rely on the concept of multiple threads mutating the collection
    and synchronizing access to the source data.


    However, there is a new Java 8 abstraction that is compatible. It is intended
    for parallel iteration of data. The idea is embodied in the `Splitter` interface.
    The premise of this interface is to partition data and pass portions to different
    threads. `Splitters` can be obtained from the `Collection` interface, including
    the `List` and `Set` subinterfaces.


    The main element of the `Splitter` interface are three methods: The `trySplit()`
    method splits the data into two parts. Creates a new splitter with half the data
    and keeps the other half in the original instance. Each of them can be assigned
    to a thread, which in turn iterates over partitioned data with `forEach()`. The
    `next()` method is a single variant that returns the next item, or null if the
    list has been exhausted. Splitters themselves do not support parallel processing
    but provide an abstraction to do so. Here''s the concept in:


    ![Image](images/image-40.jpeg)


    Given the title and the list of moves, the `isList()` method parallelizes the
    search to determine if it is in the list. Sets the flag in booleanholder to true
    if is found. Retrieves splitter instance from the list, splits it in half, and
    passes one half to each thread. `Splitters` can be obtained from other collection
    types as well as other libraries in the JDK. There are many designed implementations
    that deal with a variety of characteristics including finite/infinite, ordered/unordered,
    sorted/unsorted, and variable/immutable. They inherit the characteristics of their
    underlying data structure. `Splitters` are a lower-level abstraction intended
    to provide more precise control over parallel iteration. However, the API lacks
    some of the enhancements needed to implement functionally friendly algorithms.
    In the example above, we needed to store the state in booleanholder for search.


    ## End


    That concludes our overview of the new and improved Java 8 Collections as well
    as standard functional interfaces. As many changes have been made to the standard
    libraries to support functional concepts, expect major changes from external APIs.
    But the biggest change is yet to come.


    ### Key points


    - The new `java.util.function` package includes a set of functional interfaces.

    - They are grouped into four families, each represented by archetype: `Consumer`,
    `Function`, `Predicate`, and `Provider`.

    - Each family of functional interfaces defines variants that specialize in types
    and arguments.

    - Functional interfaces also define methods that enable functional composition.

    - Multiple dissimilar lambdas can be combined to form superfunctions that appear
    as one.

    - The `Collections` library has been rebuilt and functionalized. This was achieved
    by using the `default` methods at the top levels of the hierarchy, thus ensuring
    backward compatibility.

    - The new functional methods in collections, lists, sets, and maps are designed
    with internal iteration in mind. Behavioral parameters in the form of lambdas
    and method references are given to methods that iterate through collections and
    act on each element.

    - Internal iteration is a form of declarative programming that is functional to
    programming. It relieves the developer of having to describe "how" to do and focuses
    on "what" to do. `Splitters` are designed to iterate through collections in parallel.
    Data is partitioned and each chunk is passed to different threads for parallel
    processing.


    ## Application


    The JDK is Java Development Kit and is an essential tool required to compile Java
    programs. Along with the JVM, the JDK includes an interpreter or loader, a compiler
    called `javac`, an archive (JAR), a generator, and many other tools required for
    success. The JVM is the runtime. It is an environment in which Java bytecode can
    be executed and is used to implement the Java virtual machine.


    JVM stands for Java Virtual Machine. JVM is an abstract machine, a specification
    that provides us with a JVM in which bytecode is executed. The JVM virtual machine
    must conform to the following:


    - Specification: a document describing how to implement a virtual machine.

    - Implementation: a program that meets the requirements of the virtual machine.

    - Specification: an instance of the runtime environment.

    - Instance: a virtual machine instance created when the command line is displayed
    is used to write Java command and run the class.


    All three are inextricably linked and each relies on the others to act. At this
    point, I would like to thank you for choosing my Java programming guide. As you
    can see, it''s a simple yet complex language with many different aspects to learn.
    By now, you should have a good understanding of the basic concepts of Java programming
    and how to use it. The next step is just practice. Keep practicing. You can''t
    read this guide once and think you know everything. I urge you to take your time
    with this; follow the tutorials and don''t leave any section until you fully understand
    what it means. To help you out, there are some helpful Java forums you can find
    online full of people ready and willing to help and point out the right direction.
    There are also many online courses, some free and some to pay for, but they are
    all useful and can help your learning to the next level. Did you like this guide?
    Hope this was all you wanted, and even more, to put you on the right path to your
    dream job!

