  - 2. 尽管婚前的居住地社区和女性父亲的受教育程度在该方程中仍然具有显著性，但妻子受教育程度和其婚龄的影响却大幅削弱，并变得不显著（两种情况下的 `p` 值均为
    `.06`，单侧检验）。正如前面提到的，年龄较大时结婚的人往往倾向于是较晚婚姻队列的成员（`婚龄与婚姻持续时间的相关性为 -.518`）。另一个令人感兴趣的事实是，当将婚姻持续时间纳入估算时，衡量结合顺序的变量重新获得了显著性（`p
    = .05`）。虽然婚龄变量的加入削了结合顺序的影响，但婚姻持续时间的加入表明，在持续时间变量的不同类别内结合顺序存在显著差异，而这种差异在跨类别时并不明显。其原因尚不清楚。这可能是由于不同队列之间首次婚姻及后续婚姻时机的差异造成的。
