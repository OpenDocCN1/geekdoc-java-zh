    # 1. 数据未呈现。


    在某些情况下，调查过程中变得明显，“理想”一词对不同的女性具有不同的含义。例如，一个有两个孩子的女性可能想要三个孩子，声称三个是理想的，并声称还想再生一个。另一个同样有两个孩子的女性则可能声称：(1)
    两个孩子是理想的；(2) 她不想停止生育；以及(3) 她想再要两个。因此，似乎当女性的自身偏好与官方方调不符时，她们偶尔会将计划生育计划公布的家庭理想视为其自己的理想。


    流动性变量没有像在“婚姻内部决策权”章节中那样，按结婚四年前后的流动性进行划分。此前预计，搬家的时机对于决定是否使用避孕措施并不重要，初步分析也证实了这一点。


    关于描述本样本中伴侣特征的流动模式回顾，请参阅第 6 章。


    (1) `1` 表示使用了某种形式的避孕，而 `0` 表示未使用。(2) 在进行初步`OLS regression`估计时发现，该方程中引入的变量解释了 34%
    的方差。


    然而，在这一分析中必须避免过度强调收入与避孕之间的关联。当前收入被用作完成生育的预测指标，而这一过程可能发生在几年前。尽管当前收入被用作过去收入的代名词，但因果关系可能向任何方向发展。


    数据未呈现。


    由于这部分分析仅限于调查前一年获得现金收入的女性，因此原始案例中的 25% 被剔除了。我们没有使用均值代入法来替换这些案例，因为该程序要求我们假设没有收入的女性其决策权大致处于平均水平。到目前为止讨论的大部分信息表明，情况可能并非如此。


    顺序已得到控制。而且这显然与政府规划者的意图完全相反。


