- fmt: '

    Despite the fact that most Indonesians prefer large families, the Indonesian government
    has been disenchanted for some time with the country''s high rate of population
    growth. Family planning as a national policy was introduced as part of the Mother
    and Child Health Centers as early as 1957, although official commitment was initially
    very limited. By the middle of the 1960s Indonesia had a crude birth rate of 45/1000,
    and the annual population growth rate between 1961 and 1971 was 2.1 percent (Hull
    and Hull, 1984). As a consequence, by 1967 the new leadership began to focus attention
    on the need for family planning, and in 1968 the National Family Planning Institute,
    later renamed the National Family Planning Coordinating Board (the Badan Koordinasi
    Keluarga Berencana Nasional, or `BKKBN`), was founded.


    The overriding objective of the government''s policy at that time was "population
    management for socioeconomic prosperity," through the increased use of contraception
    and through the creation of "a common national outlook positive to family planning"
    (Suparlan and Sigit, 1980:8). Central to the program philosophy was that the provision
    of information, individual motivation, and continuous reinforcement were essential
    in order for a successful family planning effort to take hold. Of primary importance
    in getting the official message to targeted individuals were increases in education
    for women, along with the introduction of population education for all students
    enrolled in middle schools, high schools, and teacher training schools. The organization
    had as an initial goal to cut the 1971 total fertility rate of 5.2 in half by
    the year 2000, and to increase the number of contraceptors to one quarter of all
    potential users by 1979 (Teachman, 1979).


    With strong support from the government, the `BKKBN` began utilizing the already
    existing health infrastructure to reach the rural population. Soon thereafter,
    the training of field workers for "house-to-house motivation of new acceptors"
    was initiated (Parsons, 1984:6). Together with the integration of family planning
    services into maternal and child health programs, these strategies proved effective
    in meeting or exceeding annual targets.


    The village contraceptive distribution center (`VCDC`), which was the next innovation,
    was aimed at cutting travel time to clinics, making it easier for new acceptors
    to continue using services. In Java, houses were mapped for potential contraceptors,
    while in Central and East Java some households were marked with emblems indicating
    the presence of married couples and their potential for, or use of family planning
    methods (Parsons, 1984). Others in the community were thus made readily aware
    of the contraceptive decisions taking place within individual homes. Once a number
    of households indicated that a particular method had been accepted for use, any
    stigma previously attached to acceptance of that method was greatly reduced. In
    fact, it has been suggested that in some cases the stigma instead became associated
    with the failure to use contraception.


    Both the community and the government have played important roles in the program
    effort. Resources such as "livestock cooperatives, loan cooperatives, irrigation
    schemes, as well as income generating schemes for acceptors," have been provided
    by the government as rewards and incentives to villages with good family planning
    records (Parsons, 1984:14). Among civil servants, current policies limit financial
    support to three children. These policies are expected to evolve further to a
    point at which couples will have to consider carefully the impact of their family
    planning decisions upon the other social services they will receive and the taxes
    they will pay (Suparlan and Sigit, 1980). One central objective is that a "perceptual
    link will be created in the minds of individuals that fertility limitation does
    contribute directly to a higher standard of living for the individual, the family
    and the community" (Parsons, 1984:14). Planners are thus hoping that members of
    the community will exert increasing pressure on their neighbors in order to raise
    village success rates.


    Attention has also focused on constraints faced by different religious groups,
    particularly those in the Moslem community, that limit their participation in
    the family planning program. In order to increase contraceptive acceptance among
    Moslems, the `BKKBN` has stepped up contacts at the village level with "religious
    leaders, schools (pesantren), and youth and women''s organizations; ... [has included]
    Moslem scholars (ulama) on mobile medical team visits and family planning promotional
    drives (safari); and [has increased] cooperation with major Moslem assemblies
    and councils" (Lerman et al., 1989: 35). Available data suggest that all of these
    efforts have met with success.


    As the data in [Table 3.5](#Ch03.xhtml_cap_lbl0006) indicate, significant declines
    in fertility have already occurred throughout Java, and in Indonesia as a whole.
    Further declines are expected in the future, as it is generally the women from
    the younger cohorts who are now limiting their fertility. Since younger and older
    women have been responding differently to different motivating factors, it is
    certainly plausible that a generational component might predict acceleration in
    fertility decreases still ahead. Hull and Hull (1984) contend that the declines
    that have been observed to date have been due largely to changes in two of the
    proximate determinants of overall fertility: the proportions married, and the
    impact of contraceptive use upon the level of fertility within marriage.


    The government''s family planning program has clearly been instrumental in bringing
    about increases in the use of birth control; the state ideology, in both its early
    nationalist vigour and its recent formalized indoctrination, has emphasized the
    complementary themes of individual duty to work for national welfare and individual
    rights to personal fulfillment, both of which have been linked to the practice
    of birth control through the concept of the ''small, happy, prosperous family'',
    which is the explicit goal of the family planning program (Hull and Hull, 1984:101).


    Estimates of contraceptive prevalence across Indonesia and within specific regions
    for 1984, are presented in [Table 3.6](#Ch03.xhtml_cap_lbl0007). To a certain
    extent the statistics mirror the total fertility rates presented in Table 3.5.
    Reported contraceptive prevalence rates are highest in Yogyakarta, while the total
    fertility rate is the lowest there. East Java follows closely on both indicators.
    Excluding Jakarta, Central Java has the third highest contraceptive prevalence
    rate and the third lowest total fertility rate. Western Java lags behind on both
    variables.


    National statistics indicate that the success of programs in the rural portions
    of the country matches that of programs in the urban centers. Current use rates
    as of the 1980 Census varied little between urban and rural areas, as 26.2 percent
    of urban residents and roughly 27 percent of rural residents were currently using
    a method of birth control at the time of that enumeration.


    As has been mentioned, discussions about the use of family planning methods are
    not uncommon in Javanese households. This research examines the potential effects
    of residential mobility and the amount of contact that is maintained with parents
    after marriage, upon the amount of input women have into contraceptive decisions,
    and upon whether or not actual use is ever made of family planning services. It
    is expected that diminished contact with parents on both sides of the family should
    precipitate increases in decision-making power within the family for the wife.
    Women who are able to exercise more control over household decisions should in
    turn be more likely to use contraception, and to have lower overall fertility
    than should those with little to say in determining such matters.


    ## [Summary](#contents.xhtml_bck_ht0034)

