- fmt: '

    Also of interest is the association between the status of women within the household,
    their contraceptive use, and the number of children they eventually have. As was
    discussed in the introductory chapter, it is now commonly argued that major reductions
    in fertility can be achieved in currently developing countries by improving the
    status of the women in those areas. Recognizing that a woman''s status may be
    conceptualized on at least two levels, this research focuses primarily on status
    within households, and secondarily on status between women of different households,
    in attempting to predict contraceptive use and fertility. In both cases, the decision
    outcomes provide a means of operationally testing the decision-making processes
    of interest.


    In studying intra-household status, contraception, and fertility behavior, the
    position of the woman is compared to that of her partner in the decision-making
    unit; essentially, the ability of either actor to influence the eventual decision
    is thought to depend upon the relative status of the two partners (Knodel and
    Van de Walle, 1979). In recent analyses, more egalitarian relationships have been
    argued to yield higher levels of contraception than those in which the wife must
    generally defer to her husband (Mason, 1971). Dyson and Moore (1983) conclude,
    for example, that not only is a woman''s autonomy within the household important
    for fertility control, but it is "probably the single most important element in
    comprehending India''s demographic situation" as a whole (Dyson and Moore, 1983:54).


    Hogan et al. (1985) have found that Thai women who adhere to more modern views
    about the importance of egalitarian relationships between males and females within
    the household "have significantly lower rates of parity progression" than do more
    traditional women (Hogan et al., 1985:28). They contend that this is due in large
    part to lower desired family sizes and higher rates of contraceptive use among
    the more liberated women. These effects are also net of "family modernity," and
    are particularly strong at the extreme ends of the scale measuring the level of
    sexual liberation among the women surveyed.


    One factor that tends to be ignored in studies of within-household status and
    fertility, is the importance of at least the potential for conflicting interests
    of the two partners. Without conflict, much of the discussion pertaining to power
    and fertility outcomes becomes irrelevant. Youssef (1982) cites several other
    assumptions inherent in contraceptive research that can make the investigations
    problematic. For example, it is assumed that there is the desire to limit fertility
    rather than to enhance it, that women wish to adopt contraception but that the
    major barrier is an unwilling husband, and that a joint decision must be made
    before the woman can control her fertility. In the case of the latter assumption,
    differential resource control should obviously play a role in areas in which contraception
    is not free, and the ability of either partner to carry out a strategy without
    the knowledge of the other must certainly come into play as well. (See also Beckman
    (1983)). As a consequence, differences between the fertility preferences of husbands
    and wives are also examined in this research.


    Fortunately, examining the role of women''s status on the second dimension, status
    which can be measured vis-a-vis others in the community in enhancing fertility
    control does not involve as many restrictive assumptions. It has been argued that
    higher status women are more likely to attempt to regulate their fertility because
    they acquire aspirations for goods other than children (Dixon, 1975), and that
    they are more likely to do so effectively because they have the knowledge with
    which to implement their desires (Curtin, 1982). The education, occupation, household
    income, and general socioeconomic status of women usually figure prominently in
    analyses on this topic.


    Education is probably the most frequently cited indicator of female status on
    either dimension, and has been shown to inversely affect fertility via a number
    of mechanisms. For example, it has been found to exert a negative influence on
    infant and child mortality, to positively affect the ages at which women marry,
    and to increase the likelihood that contraception will be used (Cochrane, 1979).
    In addition, women with high levels of education are often better able to gain
    access to resources and knowledge than can their less educated counterparts, and
    can consequently enhance their autonomy within the family unit (Mason, 1985).
    Caldwell (1980) is among those who stress the importance of schooling in influencing
    fertility levels. His view is that as education becomes widespread and modernization
    proceeds, a couple''s basic needs and economic security should become divorced
    from high fertility, and fertility control should then become a matter of joint
    utility for the two partners.


    In cases in which an income is earned by the wife, and in which she is allowed
    at least some control over that money, differential resource control within the
    family should no longer be a factor limiting access to contraception. Furthermore,
    unlike women from the lower socio-economic strata, those in the upper or middle
    classes should not "have to rely on reproduction, the one unique gender-related
    asset of women, in order to diminish their powerlessness and alienation" Safilios-Rothschild
    (1982:121).


    These variables are all intricately related. Where development has proceeded the
    furthest, and where women have access to education and the cash economy, the expectation
    is that their aspirations for goods other than children and activities other than
    childbearing will be more pronounced, and they will be better able to act on their
    desires than will women without similar access. In addition, the influence of
    extended kin on the household should be reduced as development proceeds and families
    become increasingly nucleated.


    ## Summary


    Whereas many writers have viewed industrialization and socioeconomic development
    in general as likely to enhance the overall status of women, both within the household
    and within society as a whole, considerable evidence to the contrary has been
    discussed in the literature. Although awareness of the importance of women''s
    issues in social evolution has at last begun to grow, serious concern over these
    issues has arisen only recently. In this chapter, issues pertaining to the association
    between the social position of women and varying levels of socio-economic development
    have been introduced, and some of the possible links between development, migration,
    and the roles and statuses of women alluded to. How the status of women might
    in turn affect contraception and fertility outcomes has also been briefly discussed.
    In the chapter that follows, an attempt is made to place these and other related
    issues in the context of rural Central Java.


    ## Notes

