    ### 决策权 (5=高, 1=低) | 避孕比例 |

    | --- | --- |

    | 1.0 | 100.0 |

    | 2.0 | 100.0 |

    | 3.0 | 61.6 |

    | 4.0 | 63.4 |

    | 5.0 | 51.4 |


    `Chi-square=6.46`; `d.f.=4`; `significance level=.168`


    表 7.8 婚后流动性的避孕使用情况


    | 谁移动 | 曾使用避孕的比例 |

    | --- | --- |

    | 双方均未移动 | 28.1 |

    | 仅丈夫移动 | 59.0 |

    | 仅妻子移动 | 60.7 |

    | 夫妻均移动 | 63.9 |


    `Chi-square = 14.54`; `d.f.= 3`; `significance level=.002`。


    这种情况发生的原因尚不确定。例如，它并没有反映出不同决策权水平下，现代避孕方法与传统避孕方法使用上的差异。这种可能性已被过但被拒绝了。更有可能的情况是，在家庭内部权力极微的女性，也是最容易受到当地领导或其他家庭成员压力而使用避孕的。这种可能性在第
    6 章中曾简单讨论过。同样可以想象，家庭内部自主权最高的女性往往是受教育程度最高的人，因此也是最近离开学校的人。因此，根据定义，他们几乎是年龄最年轻的群体成员，推测是那些尚未达到生育目标的人。如果使用避孕主要是为了防止生育而非间隔进一步生育，那么这种解释可能具有合理。


    最后，尽管预计流动性变量会主要通过决策权变量来影响避孕使用，但表 7.8 中所示的双变量相关性表明，婚后流动性与避孕之间也存在直接关系^(3)。在婚后夫妻中，双方均未移动的配对中只有
    28.1% 曾使用过避孕，而仅丈夫移动的配对这一比例为 59%，仅妻子移动的比例为 60.7%。当夫妻双方在婚后搬迁时，63.9% 的配对报告曾采用过某种形式的计划生育。这并不意外；在双方均未移动的某些案例中，他们可能尚未共同居住；而在另一些情况下，一方可能在结婚前就通过搬入岳父母家而加入了另一方。在妻子是唯一移动者的情况下，避孕的使用率略高于丈夫是唯一移动者的情况。这可能是因为在少数仅妻子移动的案例中，她搬到了丈夫在结婚前建立的独立家庭中^(4)。


    ## 避孕使用的多因素决定因素](#contents.xhtml_bck_ht0057)


    鉴于这些变量之间关系的复杂性，还进行了多因素分析，以检查该样本女性避孕使用的决定因素。结果列在表 7.9 中。由于因变量（使用或不使用避孕）是二元的，因此进行了逻辑回归估计^(5)。数据表明，即使在控制了所有其他变量的情况下，目前为止描述的许多关联仍然存在。例如，与双方均未移动的案例相比，仅丈夫或妻子移动的案例，以及双方均移动的案例，都更有可能使用过避孕。再次，参考类别中的配对可能是在调查时尚未共同居住的配对，或者那些……


    表 7.9 曾使用避孕的多因素决定因素


