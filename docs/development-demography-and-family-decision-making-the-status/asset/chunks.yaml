    # 迁移与女性视角


    尽管关于迁移的其他后果已有许多论述，包括对迁出地的影响（Connell et al., 1976; Lipton, 1982）、对流入地的影响（Findley,
    1977; Yap, 1976）以及迁移者自身的调整（Goldscheider, 1983; Martine, 1979），但对迁移给女性的具体影响关注相对较少。考虑到人们对大多数迁移流向性质的认知，尤其是那些跨度较长的流向（Ravenstein,
    1885; Shryock, 1964），大多数迁移研究的重点倾向于集中在男性身上。Ware (1981:142) 认为，虽然在某些地区女性迁移“实际上构成了所有迁移活动的大多数”，但此类迁移在很大程度上被忽视了。她认为，这是因为女性迁移在总体上被认为是不重要的；因为写作者们认为女性的活动主要与婚姻有关，因此在经济上是微不足道的；而且由于这些活动中的许多是从一个农村到另一个农村，而不是去城市中心，在目前人们关注那些被认为更紧迫的城市化问题时，它们被淡化了。


    此外，现有的关于女性与迁移的文献“很大程度上是从男性视角撰写的”（Hafkin and Bay, 1976:1），其核心观点是：女性迁移中感兴趣的主要元素仅仅是男性迁移相同组成部分的镜像。有学者认为，特别是在以父系和父居制社会制度为特征的社会中，女性向新居住地的移动往往仅仅反映了她与家庭或大家庭的关联（Connell
    et al., 1976）。根据 Little (1973:17) 的观点，“男人追随金，女人跟随男人”。因此，直到最近，对女性迁移的独立决定因素和后果的研究一直被认为是多余的，且兴趣不足，以支持进行单独的分析（Thadani
    and Todaro, 1979）。


    ## 女性迁移研究的演变


    我们对女性迁移的不同模式、原因和结果的理解似乎正在增加，但这种认识来得太晚了。Thadani 和 Todaro (1979) 认为，男性和女性迁移行为之间存在基本差异，早在
    1966 年 Lee 的通用迁移模型引入时就应该是显而易见的。鉴于 Lee (1966) 的深刻见解，“男性和女性迁移者之间至少在中间障碍和个人因素方面的潜在差异”本应是显而易见的（Thadani
    and Todaro, 1979:1）。


    在有助于决定这些差异程度的变量中，包括政治、经济和社会文化因素，这些因素有时会允许或鼓励男性迁移，同时阻碍或禁止女性进行自主甚至是关联性的迁移（Connell,
    1984; Thadani and Todaro, 1984）。虽然此类限制的极端例子变得越来越不常见，但它们的持续存在确实为理解迄为止迁移文献中盛行的“男性偏见”的起源提供了见解。


    ## 案例研究：伊朗和马来西亚


    例如，在伊朗，特别是在底层阶级中，获取信息和现代部门机会在男女之间的分布极不平等。前往德黑兰的迁移者通常是寻找工作的单身男性，或者是其他伴随他们往往不识字的妻子、女儿和其他女性家庭成员的男性。女性的自主性迁移是不受鼓励的。由于男人的荣誉在很大程度上取决于其家庭女性的品德，这些女性与非亲属男性的互动受到严格限制。旅行受到密切监管，伴随或跟随男性前往德黑兰的女性通常不被允许离开其社区的边界。那些敢于进入此类边界之外的人通常只能在监督下进行（Bauer,
    1984）。对女性流动性的限制，同同她们极匮乏的教育程度，共同使得在家庭之外获得就业非常困难。因此，从整体来看，很清楚，尽管迁移是男性寻求经济进步以实现目标的可行机制，但对于女性来说，这是一个不切现实的选择。


    Stivens (1985) 例如，在马来西亚的稻农中，拖拉机基本上取代了以前锄地所需的男性劳动。稻作长期以来一直被认为是女性的工作，现在越来越多地留给了女性劳动力。男性劳动不再是耕作所必需，虽然外迁现在在年轻女性中越来越流行，但它最初是作为男性的一种适应策略使用的，而男性在大多数情况下仍然构成了农村城乡迁移流的主体。


    ## 地区差异：坦桑尼亚和哥伦比亚


    在其他情况下，女性比男性更容易迁出。例如，直到 1970 年，坦桑尼亚的男性在组成迁首都迁移流中传统多于女性。但从那时起，发现女性多于男性（Sabot, 1979）。Bryceson
    (1985) 认为，迁往达斯萨拉姆的女性比例增加至少可能由于村庄的变化；事实上，“取决于她的婚姻状况，女性获得土地和生产资料的安全性远比男性要低得多”（Bryceson,
    1985:141）。


    如果专门关注特定国家起源地或目的地的条件，而不是更广泛的社会变量，也很明显看出，不同的环境往往会对男性和女性产生截然不同的迁移反应。在某些情况下，起源地的劳工分工导致某一性别对生产的责任远大于另一性。那么，非生产者往往比活跃的生产者更容易离开。在某些实例中，农业创新不成比例地改变了生产过程，使得男性或女性的劳动力变得多余，而对另一性的需求保持相对不变。


    Fields (1979) 证明了这种情况在事实上可能是多么复杂的，即使在表面看起来信息并不少的情况下。他发现，虽然哥伦比亚女性成为迁移者的概率略高于男性，但她们对经济拉力的反应大得多；然而，当从“绝对和相对两个角度”考察工资差异时，“哥伦比亚的男性从迁移中获得的收益比女性更多”（Fields,
    1979:261）。


