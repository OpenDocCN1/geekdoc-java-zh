    根据 Mangkuprawira (1981) 的观点，虽然印尼的大多数女性仅在经济需要时才外出从事计薪工作，但在该国大部分地区，这种需要已成为常态而非例外。尽管农村女性的大部分收入来自农业生产，但土地分配不均、人口密度高以及工业增长缓慢，使得维持生计（每年约
    1200 公斤大米）变得困难。在爪哇及其他地区，女性长期以来在田间与男性并肩工作，承担着主妇和工资收入者的双重角色（Mangkuprawira, 1981）。


    遗憾的是，正如许多发展中国家的情况一样，对女性工作进行精确测量在印尼面临着严峻的挑战。在 Hugo 等人（1987）最近的一项研究综述中，作者认为，劳动力参与定义的改变使得现有数据不适用于衡量女性比例的随时间变化。因为女性的活动往往处于“‘经济性’与‘非经济性’的边缘”，而且由于女性“在这些活动中更有可能从事兼职、不定期或季节性工作……关于如何处理此类活动的惯例，对人口普查或调查所衡量的女性劳动力规模具有重要影响”（Hugo
    et al., 1987: 251）。另一方面，地区差异可以进行更有成的分析，数据表明，“爪哇地区的比例远高于印尼的平均水平”（Hugo et al., 1987:
    252）。


    根据大多数定义，家庭拥有的土地数量与女性从事创收活动的时间比例成负相关，因为来自大土地家庭的女性通常不需要被迫通过外聘就业来补充家庭收入。因此，家庭控制的土地越多，女性分配给家务的时间比例越高。贫困家庭的女性花费更多时间从事计薪劳动，因此分配给家务（或休闲活动）的时间就更少。


    另一方面，尽管许多农业工作具有季节性，且所有社会经济群体投入农业生产的时间从 12 月到 3 月都在减少，但投入家务工作的时间在不同季节间变化不大。通常，无论哪个季节，中产阶级女性在家务上花费的时间以及在劳动力中从事“直接生产性活动”的时间都比底层女性少。跨收入群体来看，孩子多的女性比孩子较少的女性更可能参与计薪工作。孩子越多，维持家庭所需的资金就越多，而某些孩子长大到足以在母亲工作时照顾年幼弟妹的可能性也越大（Mangkuprawira,
    1981）。


    爪哇女性从事的大部分直接生产性工作是水稻种植。尽管从历史上看，这类工作是高度劳动密集型的，但近期农业生产中新技术的增长正在取代劳动。镰刀法的出现降低了收获季节对劳动力的需求，而脱壳和磨粉的机械化也导致了手工捣臼劳动需求的类似下降。由于大多数手工捣臼和收获工作传统由女性完成，这两项新技术对她们在劳动力市场中的地位都具有特别不利的影响（Mangkuprawira,
    1981）。


    由于这些及其他原因，爪哇农村女性劳动的报酬通常很低。考虑到女性农业工作的季节性，她们的大部分时间花在了报酬极低的职业上。因为“‘开放获取’职业的劳动回报低，且其他职业的准入有限，没有任何一种职业能让女性全年的收入远高于其自身的维持养水平……[此外，]几乎没有农村女性能够实现全年
    365 天都有工作，因此女性收入仍远低于贫困线”（Mangkuprawira, 1981:103; White, 1976）。


    ### 性别分工

    在家庭内部，男性估计承担了 62%的农业工作，但女性平均每天工作比丈夫多三小时。尽管男性在直接生产性任务上花费的时间比妻子多（男性每天 7.9 小时，女性
    5.9 小时），但女性在“间接生产性”活动上贡献了更多的小时（White, 1976; Mangkuprawira, 1981）。由于女性获得的就业机会较少，且在就业市场上面临更大的限制，她们对直接生产性工作的参与程度可能不到男性的一半。这种情况在婴儿死亡率和子/女比例较高的地区尤为常见（Mangkuprawira,
    1981; Connell and Lipton, 1977）。


    根据 Geertz (1961) 的观点，印尼家庭内部的夫妻劳动力分配有几种可能的组合。在一种情况下，丈夫工作而妻子留在家。在另一种情况下，夫妻作为一个团队一起在农业上工作；虽然每个配偶承担的任务具有某些性别特殊性，但他们的许多活动是可以互换的。在第三种情况下，夫妻双方可能再次被视为一个团队，但在生意上，通常作为市场交易者。最后，丈夫可能在直接生产性任务中投入更多，而他的妻子在家里做一些不那么“直接生产性”的事。


    在四种可能的组合中，中爪哇的夫妻最常见的做法是作为一个团队一起工作（通常是在农业领域），以维持家庭（Koentjaraningrat, 1967）。这可能为以下观点提供了进一步的支持：中爪哇女性可能正处于
    Boserup (1970) 农业发展的第三阶段。虽然某些任务具有性别特定性，但似乎某些特定工作比其他工作更有价值。


