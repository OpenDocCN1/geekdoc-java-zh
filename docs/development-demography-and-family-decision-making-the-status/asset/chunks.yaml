    \n婚姻时长变量系数也高度显著且为正。夫妻结婚时间越长，丈夫觉得自己对重大家庭决策的控制力就越大。有人认为，结婚时间较早的夫妻往往具有更传统的男性主导模式特征，而最近结婚的夫妻之间应该更盛行更加平等的关系。虽然这种解释可能是合理的，但在过度依赖上述结论之前必须谨慎。例如，也可能是因为婚姻时长较长的男性相对于他们的父母获得了更多权力。婚姻时长的正向影响并非由于年迈父母不在世的结果（因为这些信息已包含在父母接触控制变量中），它可能反映了这样一个事实：一旦父母年龄越来越大，他们对重大决策的投入就开始减少。因此，婚姻时长对丈夫控制家庭事务能力的积极影响，可能源于代际和夫妻间动态的共同作用。\n\
    \n最后，人们认为对妻子自身决策权感知的综合指标进行控制，可以为关于男性如何看待自己的权力提供额外信息。在分析丈夫回答的框架内，预计配偶越认为自己能行使更多权力，另一方配偶感知到自己拥有的权力可能就越少。然而，研究结果并非如此。相反，妻子在家庭中感知的自主性越高，丈夫也越认为自己拥有同样的权力。这可能反映了特定话题讨论程度的差异。例如，如果某个主题被大量讨论，那么对话产生的任何结果可能被视为一个确定的决定，而不是仅仅是默认发生的事件；如果确定某项行动需要大量的对话，那么夫妻双方都可能认为自己对该决策投入了实质性的意见。\n\
