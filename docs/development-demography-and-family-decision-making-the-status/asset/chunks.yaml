    ## [Summary](#contents.xhtml_bck_ht0034)'
  toc: []
  trans: '


    尽管大多数印度尼西亚人倾向于大家庭，但印度尼西亚政府长期以来对该国高的人口增长率感到困扰。计划生育作为一项国家政策，早在 1957 年就作为母婴保健中心的一部分被引入，尽管最初的承诺非常有限。到
    20 世纪 60 年代中期，印度尼西亚的粗出生率已达到每 1000 人 45 人，1961 年至 1971 年间的年人口增长率为 2.1%（Hull and
    Hull, 1984）。因此，到 1967 年，新领导层开始关注计划生育的必要性，并于 1968 建立了国家家庭计划学院（后更名为国家家庭计划委员会，即`Badan
    Koordinasi Keluarga Berencana Nasional`，简称`BKKBN`）。


    当时政府政策的首要目标是通过增加避孕药物的使用以及创造“对家庭计划持积极态度的共同展望”来实现“为了社会经济繁荣的人口管理”（Suparlan and Sigit,
    1980:8）。该计划理念的核心是：提供信息、激发个人动机和持续的强化对于成功的家庭计划工作的开展至关重要。将官方信息传达给目标个人的首要任务是提高女性受教育水平，并向所有在初中、高中和教师培训学校的学生引入人口教育。该机构最初的目标是在
    2000 年之前将 1971 年 5.2 的总生育率减半，并在 1979 年将避孕工具的数量增加到所有潜在用户的四分之一（Teachman, 1979）。


    在政府的大力支持下，`BKKBN`开始利用现有医疗基础设施接触农村人口。不久后，启动了针对“入户动员新避孕者”的实地工作人员培训（Parsons, 1984:6）。通过将家庭计划服务整合到母婴保健计划中，这些策略被证明能够达到或超过年度目标。


    村级避孕发放中心（`VCDC`）是另一项创新，旨在缩短前往诊所的路程，使新接受者更容易继续使用服务。在爪哇岛，对潜在的避孕者房屋进行了绘图；而在中爪哇和东爪哇，一些家庭被标记了符号，表示那里有结婚夫妇以及他们可能或正在使用的计划方法（Parsons,
    1984）。因此，社区中的其他成员可以轻松了解个人家庭内部正在发生的避孕决策。一旦某些家庭表示接受了某种特定方法，此前加在接受该方法上的污名感就会大大减少。事实上，有人认为，在某些情况下，污名感反而与未使用避孕措施联系在一起。


    社区和政府在计划努力中都发挥了重要作用。政府提供了诸如“畜牧合作社、贷款合作社、灌溉计划以及针对接受者的创收计划”等资源，作为对家庭计划记录良好的村的奖励和激励（Parsons,
    1984:14）。在公务员中，目前的政策将财政支持限制在三个孩子。这些政策预计将进一步演变，使夫妻必须仔细考虑其家庭计划决策对他们将获得的其他社会服务以及他们将缴纳的税收的影响（Suparlan
    and Sigit, 1980）。一个核心目标是在个人头脑中建立一种“感知联系”，即“限制生育直接有助于提高个人、家庭和社区的生活水平”（Parsons,
    1984:14）。因此，规划者希望社区成员能对邻居施加越来越大的压力，以提高村的成功率。


    注意力还集中在不同宗教团体面临的限制上，特别是穆斯林社区，这些限制了他们参与家庭计划计划。为了增加穆斯林人对避孕的接受度，`BKKBN`加强了在村级层面与“宗教领袖、学校（pesantren）、青年和妇女组织的接触；……[包括]让穆斯林学者（ulama）参与流动医疗小组的访问和家庭计划宣传活动（safari）；并[增加了]与主要穆斯林集会和议事会的合作”（Lerman
    et al., 1989: 35）。可用数据表明，所有这些努力都取得了成功。


    如表 3.5 中的数据所示，生育率的下降已经在整个爪哇岛和整个印度尼西亚发生。预计未来生育率将进一步下降，因为现在限制生育的通常是年轻一代的女性。由于年轻女性和老年女性对不同动机因素的反应不同，代际因素可能会预测未来生育率下降的加速，这无疑是可能的。Hull
    and Hull（1984）认为，目前观察到的下降在很大程度上归于总生育率的两个近因因素的变化：结婚比例以及避孕使用对婚姻内生育水平的影响。


    政府的家庭计划项目显然在增加避孕措施的使用方面起了重要作用；国家意识形态无论是其早期的民族主义活力还是近期的正式化教导，都强调了个人为国家福利做努力的义务与个人实现个人价值的权利这两个互补主题，这两者都通过“小、幸福、富裕家庭”的概念与避孕实践联系起来，而这正是家庭计划项目的明确目标（Hull
    and Hull, 1984:101）。


    1984 年印度尼西亚全及特定地区的避孕流行率估值见表 3.6。在某种种程度上，这些统计数据反映了表 3.5 中的总生育率。报告的避孕流行率在日加达最高，而总生育率最低。东爪哇在两个指标上紧随其后。排除雅加达后，中爪哇的避孕流行率第三，总生育率第三。西爪在两个变量上落后。


    国家数据显示，农村地区计划的成功与城市中心计划的效果相当。根据 1980 年人口普查，目前的使用率在城市和农村地区差异不大，当时 26.2%的城市居民和约
    27%的农村居民正在使用某种避孕方法。


    如前，关于使用避孕方法的讨论在爪哇家庭中并不罕见。本研究调查了居住流动性以及婚后与父母保持接触的程度，对女性参与避孕决策的程度以及他们是否真正使用家庭计划服务的潜在影响。预计，与父母接触的减少将促使妻子在家庭内的决策权增加。对家庭决策拥有更多控制权的女性反过来可能更有可能避孕，且总生育率低于那些在决定此类事项上没有发言的人。


    ## 摘要


    '
- fmt: '

    In summary, women contribute a substantial amount to the family economy in Indonesia.
    Although the returns to their labor are generally low, they are frequently active
    in the labor force. The more needy the family, the more likely women are to seek
    outside employment, and to work protracted hours. When the combination of directly
    and indirectly productive activities is considered, women work roughly 2.4 more
    hours per day than do their male counterparts. Since men usually spend more hours
    in directly productive work than do their wives, the difference is due largely
    to varying inputs into domestic activities. It is interesting to note, however,
    that both men and women look after their children when the latter are very young.


    For this and other reasons, women are thought to enjoy relatively high status
    within Indonesian households. Decisions are often made jointly, particularly among
    more educated and wealthy couples, and women are especially likely to play an
    active role in decisions about household finances. As a result, some writers have
    argued that any problems pertaining to the status of women in rural Java tend
    to be the result of the local economic environment rather than direct discrimination
    (Mangkuprawira, 1981).


    In the chapters that follow, an attempt will be made to estimate how much control
    women in Central Java actually have over household decisions, and to note how
    different factors affect the decision-making dynamics within the household. Vreede-de
    Stuers (1960:160) claims that the "old attitude of women, based on their dependence
    on protection by men... is now being replaced by a feeling of selfconfidence which
    arises from the fact that the modern woman... knows how to make herself useful
    to her home." Among the goals of this research is to determine whether the traditional
    props for high fertility are overridden by this and other elements of social change,
    in combination with the government''s efforts to raise contraceptive use and lower
    total fertility.


    ## Notes


    1. Data on Java are combined with those in Madura.

    2. Rural unemployment is also higher among women than it is among men (11 and
    7 percent respectively).

    3. In other words, women have a great deal to say about financial matters and
    may be allowed to be chief legal heir.

    4. Islamic law.

    5. According to this view, the effects of modernization were not those commonly
    expected to transpire; i.e., not only did modernization fail to bring about improvements
    in the status of women, but it had the opposite effect.

    6. These customs are all heavily biased in favor of the male.

    7. Forced marriages are still allowed under adat, but it is now also acceptable
    for young couples to elope and to be reconciled with their parents upon their
    return.

    8. "These advantages" are thought to refer to contact with western civilization.

    9. This argument is contradicted by the findings of Mangkuprawira (1981) who contends
    that in rural areas, where most of the jobs available to women involve unskilled
    labor positions, increases in eduction do not appear to improve female labor force
    participation. Instead, the percentage of women employed in the wage economy has
    been found to be inversely correlated with the levels of schooling completed.

    10. The research by Nag et al. is more recent than that of Koentjaraningrat and
    so is more likely to reflect the current situation among Indonesian families.


    # 4 The Sample, Methods, and Variable Definitions


    The data utilized in this research were obtained during a 1985 survey of households
    in rural Central Java. The survey was conducted in conjunction with `LEKNAS/LIPI`
    in Indonesia. Funding was provided by a grant from the Ford Foundation to Brown
    University for the study of comparative urbanization. Living expenses were covered
    in part by a traineeship from the National Institutes of Health.


    ## The Selection of the Sample

