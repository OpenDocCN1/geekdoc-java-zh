  trans: '

    社会经济发展对女性社会地位的影响的确切性质在近年来引发了广泛辩论。尽管 Goode (1982) 认为，发展（特别是工业化）在历史上与女性权利的扩大相关联，但他承认这一观点在女性主义圈内具有极大的争议。然而，他坚持认为，“如果我们把自己局限于工业化之前的时代，以及相对中等或先进的工业化时期，那么女性地位趋于平等的趋势似乎是显而易见的”（Goode.
    1982:184）。


    ### 工业化

    有许多原因解释了为什么工业化和经济发展的最初阶段往往对女性在社会中的整体地位帮助较小。例如，在工业化早期的美国，特别是当改革使得工厂工作在很大程度上成为成年男性的领地后，妻子们仍留在家做家务，而其中许多家务此前是由她们丈夫分担的。在农村地区，当男性开始在其他地方赚钱时，被迫的女性承担了额外的农业劳动。


    随着时间的推移，女性的家务与男性在办公室和工厂的工作之间的界限变得日益明显，而由于男性劳动力带来现金收入，女性的工作通常没有，这一事实进一步加剧了本已明显的性别差异。由于“这种差异化报酬的劳动分工，男性开始与工业世界的价值观——金钱、生产和权力联系在一起”，而女性则“与家庭价值观——爱、抚养和自我牺牲……联系在一起”（Lipman-Blumen,
    1984:106）。


    ### 经济权力的局限性

    然而，作为经济发展和工业化早期阶段特征的女性经济权力局限性，不仅限于美国，也不限于整个西方世界。在大多数地区建立货币经济之前，工作倾向于被简单视为工作；尽管任务可能因性别而异，但某项工作通常不被认为比其他工作更有或更低价值。然而，随着不同类型生产的新奖励制度的引入，只有特定的工人因工作获得现金报酬。结果是他们的劳动变得比没有现金支付的劳动更具价值，而那些带回现金收入的人的地位变得高于没有现金收入的人（Taylor,
    1985）。


    ### 政策与殖民

    在各种文化、经济和社会背景下，尽管引入了表面上改善目标地区整体状况的特定计划，女性一直未能充分分享工业化的成果。从殖民时期和独立后的初期开始，女性问题本身在很大程度上被忽视了，直到最近，几乎没有尝试将女性纳入到更广泛的发展蓝图中。虽然政策制定者投入大量注意力关注农村改进、教育增长、工业化，甚至在某些情况下关注计划生育，但他们倾向于“很少考虑其政策对女性产生的影响”（Duley
    and Diduk, 1986:48-49）。


    结果，许多政策被证明对女性整体而言具有破坏性。殖民时期实施的计划被认为是导致性别分工中引入新元素的原因之一，这些新元素取代了男女之间更公平的关系，取而代之的是“女性在政治决策领域、资源获取与控制，以及法律权利和特权方面的边缘化”（Duley
    and Diduk, 1986:53）。土地所有权和财产权制度经过了广泛修订，这些修订“显著削弱了授予女性的传统准入权”（Duley and Diduk,
    1986:54）。在许多情况下，欧洲殖民者发布了土地改革政策，导致土地所有权直接从女性转移给男性。Boserup (1970: 60) 认为，此类改革在非洲发生是因为“欧洲人似乎到处都反对非洲女性的特殊地位，这种地位与欧洲人习惯的任何事物都大相同”。


    ### 全球视角

    然而，发展政策无法改善甚至维持女性地位的现象，并不局限于殖民时期或独立后的政权。此后，这种现象也没有被限制在社会、地理、政治或时间范围内。社会主义和资本主义国家的规划者往往忽视女性问题，因为他们认为对这类问题的关注要求是“特权诉求，是对西方‘女性解放’的机械模仿，是无必要的分离主义的，甚至是反民族主义的”（Duley
    and Diduk, 1986:49）。


    因此，从过去经验中获得的洞解仍然没有被有效用于改善发展中国家的女性处境，这并不意外。例如在韩国，尽管女性在城市和农村劳动力市场中占相当比例，但社会经济发展的利益继续不成比例地向男性
    1（Soon, 1977; Whyte and Whyte, 1982）。这种局面在亚洲大部分地区以及其他发展中国仍然很常见。


    ### 理论分析

    尽管马克思主义和非马克思主义分析者通常认为资本主义扩张的影响是性别中性的，而且从逻辑上讲，资本主义的增长最终应该“摧毁社会接受和意识形态加强的女性从属”，但这一过程在许多发展中国家并未发生（Afshar,
    198-5: xii）。结果，考虑到证据反驳了 Goode 的观点（即女性处境在中等到先进工业化期间有明显改善），许多学者现在得出结论：虽然尽管女性地位的下降在发展早期阶段尤为剧烈，但在“大多数国家的国家增长过程中”，地位似乎也呈现整体下降的趋势（Loutfi,
    1980:11）。


    ### 案例研究：印度尼西亚

    在某些方面，印度尼西亚提供了一个例子。根据 Mather (1985) 的观点，在工业化过程中，雅加达女性人口的从属地位反而得到了加强。通过与当地担任保安和“劳动力代理”的伊斯兰教家长合作，雅加达的工业管理人员能够支配一支“廉价且顺从”的劳动力，女性员工被视为易于支配的（Mather,
    1985:177）。总的来说，由于工业化和城市化高度相关，发展中国家女性在工业化过程中面临的问题与由于城市化而产生的问题是密不可分的。由于各种原因，从农村向农村的迁移不断发生（Afshar,
    1985）。一旦进入城市，女性的潜在工作往往不成比例地少，且工作时间不灵活，城市就业经常与生育和育儿不兼容，也与关于女性工作性质以及应该放在何处的传统观点不符。根据一些人的说法，底线仍然是雇主倾向于雇佣男性，而且在就业成为可能之前，必须完成以男性为导向的培训计划（Boserup,
    1970; Duley and Diduk, 1986）。


    ### 供给与需求

    这些问题在整个发展世界都是常见的，因为供给和需求因素共同导致了这些地区女性长期低地位。在供给方面，限制包括关于女性在不同生命阶段体面性和适用性的社会规范。由于缺乏社会认可的替代方案，有孩子的女性经常从事在家庭的低工资活动。在需求方面，存在性别分工：按任务和特定的工作领域进行隔离（Standing,
    1985）。女性的工作涉及技能水平较低、工资水平较低、工会化较低，因此工作条件通常低于男性主导的类别（Standing, 1985）。


    印度尼西亚和泰国的情况提供了一个案例。两国男女劳动参与率之间的差异是上述若干因素的结果：制度性隔离、女性人力资本水平较低，以及对男女预期角色的不同规范。结果，女性移民比男性更容易进入服务经济，而男性更有可能进入销售或政府行政部门（Smith,
    1981）。在大多数发展中国家，人口加速增长和城市化共同创造了资本密集型工业无法吸收的剩余劳动力。结果是“形成了异质化的劳动力，并将大量人群排除在某些机会之外”（Jelin,
    1982:254）。由于劳动需求有限，男女都面临潜在的失业或就业不足，但由于认为女性的家庭责任将阻止她们成为有效的工人（Jelin, 1982:254），她们通常被排除在理想工作之外。


    尽管社会经济发展过程中女性的机会明显增加，即使在已经越过工业化和一般发展最初阶段的社会中，女性的整体地位也并不接近男性。无论主要关注的是工业、农业部门还是两者兼顾，许多学者现在认为“发展”本身远非第三世界女性的万良药。事实上，存在一种流行的观点，认为发展中国家女性低地位相关的各种问题并非仅仅由于“忘记在发展计划中包含女性，或者假设她们总是从针对男性的措施中受益。对女性的发展也存在针对性歧视”（Ware,
    1981:11；另见 Jelin, 1982）。


    ### Boserup 框架

    通过借鉴 Boserup (1970) 社会演变三个独立阶段的方案（每个阶段有相应的女性地位水平），Ware (1981) 就女性在社会系统的地位与社会经济发展涉及的各种过程（特别是与农业的关系）之间的性质提出了一些额外见解。在
    Boserup 的第一阶段，人口居住稀疏，耕作处于转型中，女性倾向于负责农业生产。在第二阶段，人口变得更加集中，引入了犁耕，男性负责大部分农耕任务。在第三阶段，男女都在精耕细作的灌溉土地上努力工作。根据
    Boserup 的观点，女性的整体地位在过程的第二阶段往往低于第一阶段或第三阶段。


    Ware (1981:21) 认为，如果 Boserup 的观点是正确的，那么“发展对女性地位的影响因此在很大程度上取决于现代发展在三阶段进展中开始的确切位点”。在第一阶段，女性是整体经济的重要贡献者。在第二阶段，她们对生产的贡献变得不那么重要，她们日益局限于家庭活动，其地位随之下降。然而，Ware
    似乎同意 Goode 的观点；随着工业化，“从远来看，女性从家庭领域重新出现并对大经济做出贡献”（Ware, 1981:24）。Ware 的主张是，到目前为止发展政策的许多缺陷由于它们倾向于将女性限制在“第二阶段农业阶段，即使男性已经进入了工业阶段”（Ware,
    1981:24）。这种政策结果是为讽刺的，因为许多发展计划的陈述目标是减缓人口增长；然而处于第二农业阶段的女性生育率最高。

