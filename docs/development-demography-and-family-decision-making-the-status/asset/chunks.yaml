  trans: '


    在更发达的社会，父母对婚姻决定（以及其他类型的决定）的完全控制在很久以前就开始受到侵蚀。关于哪些因素在西方家庭权力转移中起了最大的作用，解释各不相同（Stone,
    1977; Thadani, 1978），而对于当今发展中国家中看到的这种平行转型，现在也提出了不同的理由。Goode (1963) 认为，城市化和工业化是全球大部分地区发生重新调整的主要原因。随着土地继承可能减少，这种作为父母控制子女手段的继承其重要性也随之下降。相反，随着教育机会的增加，父母试图确保所有孩子都能接受过教育。在某些情况下，教育变成了一种嫁妆或彩礼的形式。一旦分化过程开始落实，随着教育和生产活动越来越多地在家庭之外进行（Smelser,
    1968），父母控制子女未来经济安全的能力就会下降，他们的议价能力也随之下降。


    随着这种家庭转型在更发达国家顺利进行，相关的西方价值观和态度的扩散被认为是不发达地区家庭演变的主要决定因素（Caldwell, 1976）。根据 Smith
    (1980) 的观点，教育和城市化（两者都促进了扩散过程）以及非农业就业机会的增长，在亚洲的过程中起着至关重要的作用。大众教育被认为是重要的，因为它提供了一个基于西方模型的家庭观，这可能是因为教科书直接从西方生产者处获得的，也可能是因为它们的设计是为了模仿西方文本（Caldwell,
    1976）。同样，由于发展转移通常流向发展中国家中更现代的城市部门（Gugler, 1982; Arndt, 1983），对进口西方价值观的接触在城市中心往往比偏远地区更为明显。因此，高等教育和婚前居住在城市社区被认为在做出最终婚姻决定时，相对于子女，降低了父母的相对投入，起了主要作用。


    同样重要的是受访者的结婚年龄。不仅平均初婚年龄随着受教育水平的提高和城市化的发展而有增加的普遍趋势（Smith, 1980; Smith and Karim,
    1980），而且很明显，较年轻的新郎（尤其是年轻的新娘）比更成熟的成年更容易受到年长家庭成员的控制（Caldwell et al., 1983）。如果个体在还几乎是孩子时就结婚，这一决定将几乎完全由他们的长辈执行。随着结婚年龄的增加，父母的控制应该减少。此外，由于男性通常习惯娶比自己年轻的女性（Casterline
    et al., 1986），而且由于男性的受教育程度往往高于女性（世界银行, 1984），因此推断男性报告的对婚姻决定的投入会比他们的妻子多。


    然而，可以预的是，在控制了教育和结婚年龄后，权力感知上的性别差异往往仍然存在。在对爪爪哇岛农村地区的这项分析所涵盖的婚姻群体中，这在不同程度上应该是成立的。在较早群体中，包办婚姻无疑是常态；儿子或女儿将婚姻决定的控制权交给父母，作为“他们对父母心理依赖的象征、对他们晚年未来责任的接受，以及相对于他们地位较低的象征”（Geertz,
    1961:56）。然而，与儿子相比，女儿对于要嫁给谁的话语权更小。根据 Geertz (1961:56)，“父母通常等到他们的儿子觉得‘准备好结婚了并向他们寻求帮助’为止。他们通常允许他指出他想要的女孩，或否决他们的建议。”尽管许多人认为如今印度尼西亚女性在家庭中享有很高的自主权，但并非如此，特别是在较低社会阶层中（Mangkuprawira,
    1981; Hull, 1976），而且这并不等同于婚前的平等地位。


    正如所讨论的，家庭双方父母继续以不同程度参与配偶选择过程，特别是对于第一次婚姻，所选配偶被认为能够加强现有的家庭。另一方面，在选择过程中考虑新娘新郎的偏好变得越来越普遍。当他们的偏好被忽视，或者由于其他原因导致匹配失败时，个体服从父母并与指定的配偶结婚也是可以接受的，然后在下一次离婚后再与更符合自己选择的人（Ihromi
    et al., 1973）。由于儿子和女儿已开始在配偶选择过程中发挥更大的作用，婚姻似乎变得更加稳定，离婚也不那么盛行（Hugo et al., 1987）。


    根据目前提供的信息，假设以下关系成立的：


    * (5.1) 教育程度较高的个体对影响自己婚姻决定的投入会比受教育程度较低的人多。

    * (5.2) 父母教育程度较高的个体，对影响自己婚姻决定的投入会比父母教育程度较低的人多。

    * (5.3) 婚前居住在大城市环境的个体，对影响自己婚姻决定的投入会比居住在小城市或农村地区的人多。

    * (5.4) 最近结婚的受访者对影响其婚姻决定的投入会比结婚时间较久的人多。

    * (5.5) 在年龄较大时结婚的人，对婚姻决定的投入会比在年龄较小时结婚的人多。

    * (5.6) 男性报告的对婚姻决定的投入会比他们的配偶多。

    * (5.7) 目前处于二段或更高次婚姻的人，对涉及当前婚姻决定的投入会比仍处于第一次婚姻的人多。


