    # 她们为何迁移？


    正当关于哪些女性会迁移的问题才开始被解决时，关于她们为何移动的信息也仍然尚无定论。总的来说，女性迁移的原因大致可以分为两类：经济性原因和个人或社会性原因。被归类为经济性的迁移包括与寻找或提升工作、教育或收入相关的迁移。被归类为个人或社会性的迁移包括婚姻迁移、为了获得更大独立性的迁移，以及关联性迁移。在许多情况下，经济和和社会迁移动机小组内部或小组之间的类别可能会出现重叠。


    在最近关于女性与迁移的文献综述中，发现受就业需求驱动的迁移者多于因其他任何原因而迁移的人。按照规律，引用经济影响作为女性迁移决定因素的研究，也多于那些女性声称出于个人或社会原因而迁移的研究（Findley
    and Williams, 1987）。这种情况在发展中国家的各个地区内部及其之间都是如此，而且这与那些认为女性迁移在性质上更多是社会或个人性而非经济性的观点背道而驰。


    另一方面，研究发现关联性迁移是亚洲和非洲女性，以及从欠发达地区向较发达国家迁移的人群中第二常见的迁移原因；而在拉丁美洲、加勒比海和南太平洋的女性中，这种迁移的重要性仅略低。婚姻迁移在亚洲和非洲的重要性上排名第三，这一发现另外另外三个地区也得到了大致的反映（Findley
    and Williams, 1987）。


    无论首要原因是什么，迁移决策都是一个极其复杂的决定，通常涉及多个动机因素，并以不同的程度相互交织。来自马来西亚的证据提供了一个有趣的案例。从历史上看，该国女性迁移的原因几乎全是关联性的。当女性迁移时，要么是为了与家人团聚，要么是为了结婚。否则，她们被期望留在农村地区，预计在那里将远离麻烦、保持美德，并提供农业和家务劳动。父母认为，如果女孩在没有监督的情况下迁移到城市，她们会入歧途，并在进入婚姻市场后遇到麻烦。同时，城市中心除了受过高教育的年轻单身女性，几乎没有工作（Khoo
    and Pirie, 1984）。


    然而，城市和农村部门的最新发展开始产生显著变化。新的节动力技术现在允许女孩比以前更长时间地留在农业之外并在学校上学，如果她们能在农村地区获得足够的教育，她们可能会考虑在城市继续学业。在某些情况下，她们还能获得正式部门就业所需的技能（Khoo
    and Pirie, 1984）。


    与此同时，农村地区的女孩现在看到当地传统受到现代化的化的挑战，她们中的许多人开始迁移到城市以逃避乡村的限制。当她们离开时，是为了寻求更大的个人自由和经济进步。虽然另一些人愿意留在农村地区工作，但许多人也感到被迫接受城市中心的工作，因为她们在出生地没有可行的替代方案。因此，这组人的动机在性质上更多是经济而非社会性的（Ariffin,
    1984）。


    在泰国，推力和拉力也结合影响了迁移过程。在那里，关联性考虑和潜在的就业构成了最大的拉力，而贫困、干旱和季节性失业构成了推力（Arnold and Piampiti,
    1984）。与马来西亚的情况一样，随着农村传统受到挑战、受教育水平提高以及女性参与非农业劳动力比例比例开始增加，向城市的迁移也随之增加。教育和就业机会的不足，加上农村地区不人意的生活条件，为农村外迁提供了进一步的动力（Piampiti,
    1984）。


    在整个发展中世界，迁移的人特别是作为家庭策略一部分而迁移的人，在做最终迁移决策时往往几乎发言权。例如，在韩国，许多女孩在小学或初中后被送到首尔；一些人被送到城市接受额外的教育，想法是她们通过这种投资最终会赚更多钱，而另一些人则被直接送入市场。根据
    Huang（1984）的研究，对迁移决策拥有一定控制权的迁移者声称是为了寻找提高技能、了解更多城市生活、远离乡村生活（特别是艰苦的农作）或逃避父母的控制。然而，无论她们声明的目标是什么，大多数人仍在父母的约束下进行，因为许多人被安排住在亲戚那里，预计他们会照看她们。


    印尼的情况非常相似（Hugo, 1981）。在那里，父母和其他家庭成员对影响男女的迁移决策有相当大的意见投入，尽管对女儿的控制尤为严格。大多数迁移都是为了提高小组的整体福利，家庭预计将提供充足的资金帮助迁移者起步。与其他地方一样，较富的家庭能够更好地资助跨度更远、时间更长的迁移，结果是她们往往能从投资中获得更高的回报。


    根据目前提供的信息，显然，那些认为女性迁移通常是无关紧要且很大程度上是关联性的人，往往会低估一个可能非常复杂的过程。因此，对女性与迁移这一通话题给予更多关注是必要的。然而，这项研究最核心的问题之一尚未得到解决；即，迁移与女性地位，特别是女性在家庭内部的地位有什么关系？


    # 迁移与地位


