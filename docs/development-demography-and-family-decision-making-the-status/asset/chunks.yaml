  trans: '


    ## 背景下的问题


    在本项研究中，这些主题是在印度尼西亚爪哇岛省的背景下讨论的。爪哇岛是一个合适的背景，原因有以下几点：首先，根据所引信息来源的不同，印度尼西亚整个国家内的女性地位评价从非常高到非常低不等。例如，印度尼西亚信息部（1968:5）声称，“今天的印度尼西亚女性在每一个方面、每一个领域已与印度尼西亚男性平等”，但由人口危机委员会编制的
    1988 年《各国妇女地位排名》却将印度尼西亚列为女性地位“非常糟糕”的国家之一。因此，女性在社会和家庭中的地位均值得进一步审查。


    其次，尽管取得了经济进步（许多人认为这是遏制人口快速增长最可靠的催化剂），但直到 1985 年，印度尼西亚的人口增长率仍超过每年 2.0%以上。尽管政府在改善避药途径、降低家庭规模偏好并最终降低生育率方面的努力多年来急剧增加，但在该国大部分地区，个人的生育目标仍维持在每对四到五个孩子（McNicoll
    and Singarimbun, 1983）。


    在爪哇岛，人口增长和人口密度长期以来被认为是严重问题。截至 1980 年，大约 62%的印度尼西亚人居住在该岛上，然而他们居住的土地仅占该国总面积的 7%以下（印度尼西亚国家统计局,
    1982; Leiserson et al., 1980）。如果女性地位与较低的生育率有关，则应该研究这一过程在爪哇岛运作的机制。


    第三，尽管印度尼西亚的个人关注仍次次于家庭和更广泛社区的需求，但在直接影响个人的决策中（包括围绕婚姻和配偶选择的决策），某种程度的控制权已向个人转移。决策权力平衡的类似调整也在发展中国家其他许多地区发生，因为在各种社会环境下的儿童现在可以期待对选择未来丈夫和妻子的决策拥有相当的投入，甚至拥有完全的控制权。正如许多关于生育率和死亡率转变的研究所示，正是像印度尼西亚这样的过渡性国家，能够为婚姻决策过程中的此类变化及其演变的现状提供一些最丰富的信息。


    因此，本研究分析的首要主题涉及印度尼西亚父母在为女儿或儿子选择配偶方面所能行使控制权的差异。重点是围绕婚姻决策的代际动态，以及在配偶选择过程中对权力认知的性别差异。这些问题不仅作为家庭转型过程的一部分本身具有重要性，还因为女性在配偶选择过程中的投入也与她随后控制家庭决策的能力有关联（Conklin,
    1981）。


    在分析的第二阶段，考察了女性自主性的若干预测因素。特别感兴趣的是婚后迁移或居住流动对女性影响决策结果权力的影响。配偶一方或双方的搬迁，是否会影响女性与其丈夫及其他家庭成员相比，在决定重要家庭事务时的投入量？如果是，搬迁的时机是否重要？此外，与双方父母的联系水平是否会影响这种关系？


    在研究的最后部分，评估了妻子自主性与特定结果（在本例中为避孕和生育率）的相关性。总体而言，预计家庭居住地的变化允许夫妇脱离父母的直接监督和控制，应该提高女性在家庭内的地位（家庭内地位），与女性在家庭内地位很低的情况相比，高水平的女性家庭内地位会导致避孕使用的增加和总体生育率的下降。


    预计具有高家庭外地位（或与家庭外个人相比的地位）的女性，比低家庭外地位的女性更容易使用避孕，且总体生育率较低。尽管迁移也可能增强这一维度的地位，但此类措施主要作为控制变量引入；迁移与家庭外地位之间的联系已有记载。


    本研究的目标并非调查印度尼西亚家庭规模或计划生育利用的所有决定因素；也不打算作为一项关于迁移和生育的研究。分析重点在三个特定主题上：


    1. 婚姻决策涉及的代际动态，以及男女在过程中的表现差异。

    2. 扩展家庭的持续影响（这种影响通常随着迁移、居住流动以及与双方父母的联系频率而变化）对女性婚后在家庭中地位的影响。

    3. 这些因素反过来影响避孕使用和生育率，这两者都是印度尼西亚家庭和社区生活的的核心。

    '
- fmt: '

    In order to convey a sense of the context in which this research is framed, a
    number of questions must be addressed at the outset. For example, how has societal
    development in general affected the status of women, both within and outside the
    household? How has socio-economic development influenced migration behavior, and
    how, if at all, has migration in turn contributed to changes in female autonomy?
    A brief introduction to these issues is provided in this chapter.^([1](#Ch02.xhtml_fn0001))


    Before proceeding, however, it is necessary to clarify what is meant by the concept
    of "women''s status". Although it is often discussed in the literature, critics
    argue that the term has been used too loosely, and that its meaning thus far has
    been "highly elusive" (Curtin, 1982:33), "ambiguous and poorly defined" (Powers,
    1985:3). It has recently been suggested, however, that out of the "bewildering
    variety of specific terms and definitions... certain common threads" do emerge
    (Mason, 1985:7). Status definitions usually concentrate on aspects of inequality
    between the sexes, and the inequalities examined tend to be centered around power,
    prestige, and/or resource control or access (Mason, 1985).


    In spite of these common features, status can still be viewed on more than one
    dimension (Safilios-Rothschild, 1982; Williams and Guest, 1985), and the dimensions
    do not always interact predictably (Powers, 1985). It is therefore necessary to
    clarify which dimension is going to be examined in each phase of this research.
    In the following overview of women and socioeconomic development, for example,
    the primary focus is on status on the broader level, status vis-a-vis others in
    the community or society. Status on that dimension must be addressed in order
    to understand the position of women in the overall economy and in the social order
    outside the household.


    The extra-household status of women does differ, however, from status on the inter-personal
    level, often termed "power" (Safilios-Rothschild, 1982), and it is on that dimension
    of status that much of the remainder of this research will concentrate. Of primary
    concern is how women fare visa-vis other household or family members in making
    major household decisions. Determining the intra-household status of women is
    important because variations in distributions of power between household members
    have been found to affect decision outcomes, such as contraception and fertility,
    independent of other more commonly considered variables, including those that
    measure status on the broader dimension (Hull, 1981).


    This chapter was designed to assess the ways in which recent history has produced
    changes in the status of women, both within and between households, and across
    cultures and levels of development.


    ## [Women and Development](#contents.xhtml_bck_ht0013)

