    Thadani 和 Todaro (1979) 曾进行过超越“女性迁移仅仅反映男性流动”这一观点的早期尝试。尽管他们的方法具有创新性，但他们的结论在某些领域也可能被认为是有争议的。他们认为，男性是为了寻求高等教育或更具声望的工作，从而提升其在社区内的社会地位；而对于女性来说，“与一个处于向上流动的男性进行恰当婚姻可能是追求同一目标的另一种替代或额外途径”（Thadani
    and Todaro, 1979:2）。


    尽管 Thadani 和 Todaro 研究中女性所追求的地位是家庭外或社区层面的地位，但此后其他研究人员对这一主题产生了兴趣，并讨论了迁移对女性家庭内部地位的可能影响。例如，Ware
    (1981) 注意到，家庭内部地位的提高可能是迁移逻辑结果之一。她认为，在父系制和夫居制的社会中，离开丈夫家可能通过切断与姻亲的联系（这些亲属的所有资源都由年长男性控制）来帮助妻子。如果没有这种行动，“年轻新娘处于一种极其无力的境地，因为她们是丈夫家中的陌生人”（Ware,
    1981:163）。


    离开大家庭被认为让夫妇有机会发展出一种比以往更亲密、可能更平等的关系。Ware (1981) 主张，女性迁移者在家庭决策过程中应该能够发挥比非迁移者更大的作用，并且“迁移女性在经济任务和公共领域的参与度更高，导致了复杂交流网络的发展和政治化倾向”（Ware,
    1981:172）。


    Conklin (1981) 为这一观点提供了支持。他发现，印度的迁移显著增强了女性控制决策过程的能力。即使在控制了城市与农村居住地的变量后，这一点依然成立。他认为，“妻子独自生活，远离丈夫的亲属，能够比其他情况下更好地进行讨价并获得更多权力”（Conklin,
    1981:17）。


    Warner 等人 (1986:123) 补充道，当考察父系制的居住和血缘制度时，女性的婚姻权力往往远低于其他居住制度下的女性；“女性在结婚后通常成为其丈夫亲属群的事实成员。该群体获得了对其生育能力的权利，因为她的孩子将属于丈夫的群体。”


    Whyte (1978) 的研究是 Warner 等人 (1986) 引用的文献之一。根据 Whyte 的观点，核心家庭中的女性在婚姻中行使的权力可能比大家庭的女性大得多。“大家庭包含许多性别的成年人，这一事实导致或允许了相当僵化的性别分工”（Warner
    et al., 1986:122）。另一方面，在核心家庭中，可供替代并履行关键人物角色的人较少。因此，当离开大家庭时，妻子对家庭的生存变得至关重要，她在制定重大家庭决策中的权力也随之增加。


    最后，Youssef 等人 (1979:123) 断言，迁移的一个重要结果是“传统家庭结构的削弱”，且家庭的碎片化和“新家庭结构的出现”可能是迁移过程的结果。Goldscheider
    (1984) 也同意这一观点，认为“迁移带来的关键变化之一……是消除了原籍家庭对资源和地位的完全控制”（Goldscheider, 1984:11）。从长远来看，这种移动也可能“促进经济结构与家庭结构的分离，并允许它们重新调整”（Goldscheider,
    1984:11）。


    尽管一些作者显然认为迁移与女性地位之间的关联是强大且积极的，但并非所有人都如此乐观。例如，Mueller (1983:280) 认为，在亲属义务通常很强的社会中，离开家庭纽带“可能会剥夺某些女性可靠的支持来源”。她认为，“贫困、失业以及城市化和现代化”在亲属网的侵蚀中都起了作用（Mueller,
    1983:280）。如果一个女性婚后的居住地迁移距离远足以对其支持网络造成破坏，那么这种移动本身不仅可能无法提高她在家庭中的地位，还可能让她感到比一直呆在父母家里时更加无力。


    正如所讨论的其他迁移者特征一样，迁移与女性地位之间的关联尚未被完全阐明。因此，这种关系的性质值得进一步考虑，并在后续章节中进行分析。


    ## 地位、避孕与生育


