- fmt: '

    In more developed societies, complete parental control over the marriage decision
    (and other types of decisions as well) began to erode some time ago. Explanations
    differ as to which factors played the greatest part in bringing about the transfer
    of power within the western family (Stone, 1977; Thadani, 1978), and varying rationales
    for what is seen as the parallel transition in today''s developing countries are
    now also being posited. Goode (1963) has argued that urbanization and industrialization
    have been largely responsible for the realignment throughout much of the world.
    As the possibility for the inheritance of land decreases, the importance of such
    inheritance as a means by which parents control children declines as well. Instead,
    as educational opportunities grow, parents try to ensure that all children attain
    some schooling. In some cases, education then becomes a form of dower or dowry.
    Once the process of differentiation begins to take hold, with educational and
    productive activities increasingly taking place outside the home (Smelser, 1968),
    the ability of parents to control the future economic security of their children
    declines, as does their bargaining power.


    With this type of family transformation well underway in the more developed nations,
    the diffusion of relevant western values and attitudes has been seen as a major
    determinant of family evolution in less developed regions (Caldwell, 1976). According
    to Smith (1980), education and urbanization (both of which facilitate the process
    of diffusion), along with growth in non-agricultural employment opportunities,
    play a vital role in the process in Asia. Mass education is seen as important
    because it provides a view of the family that is based on a western model, either
    because the textbooks are acquired directly from a western producer, or because
    they are designed to emulate western texts (Caldwell, 1976). Again, because development
    transfers usually accrue first to the more modern urban sectors in developing
    countries (Gugler, 1982; Arndt, 1983), exposure to imported western values tends
    to be more pronounced in urban centers than in outlying areas. Both higher education
    and residence in an urban community prior to marriage are therefore thought to
    play primary roles in decreasing the relative inputs of parents compared to children
    in making the final marriage decision.


    Also of importance is the age at which the respondent marries. Not only is there
    a general tendency for the average age at marriage to increase with rising educational
    levels and urbanization (Smith, 1980; Smith and Karim, 1980), but it is fairly
    clear that younger grooms, and especially younger brides, are more easily controlled
    by older family members than are more mature adults (Caldwell et al., 1983). If
    individuals marry when they are still little more than children, the decision
    will be implemented almost exclusively by their elders. As the age at marriage
    increases, parental control should diminish. Further, because it is frequently
    the custom for men to marry women younger than themselves (Casterline et al.,
    1986), and because males tend to be more highly educated than females (The World
    Bank, 1984), it should also follow that men will report having had more input
    into the marriage decision than will their wives.


    It is reasonable to expect, however, that gender differences in perceptions of
    power will often remain after both education and age at marriage are controlled.
    This should be true to varying degrees among the marriage cohorts covered in this
    analysis of rural Java. Among the earlier cohorts, arranged marriages were unquestionably
    the norm; a son or daughter relinquished control of the marriage decision to his
    parents as "a symbol of his psychological dependency on them, of his acceptance
    of his future responsibilities toward them in their old age, and of his lesser
    status in regard to them" (Geertz, 1961:56). Compared to sons, however, daughters
    had even less to say about whom they would marry. According to Geertz (1961:56)
    "parents usually wait until their son feels himself ''ready for marriage and comes
    to them for help. They often allow him to indicate the girl he wants or to veto
    their suggestions." While many believe that women enjoy a high level of autonomy
    within the family in Indonesia today, this is not without exception, particularly
    among lower social classes (Mangkuprawira, 1981; Hull, 1976), and does not necessarily
    translate from equal status prior to marriage.


    As has been discussed, parents on both sides of the family continue to take part
    to varying degrees in the process of mate selection, particularly for a first
    marriage, with the chosen spouse being one who is expected to strengthen the existing
    family. On the other hand, it has become increasingly common for the preferences
    of both the bride and groom to be taken into consideration in the selection process.
    When their preferences are disregarded, or when the match is unsuccessful for
    other reasons, it has also become acceptable for individuals to defer to their
    parents and marry a designated spouse, only to divorce and remarry the next time
    to someone more of their own choosing (Ihromi et al., 1973). Since sons and daughters
    have begun to play an expanded role in the mate selection process, unions have
    become seemingly more stable and divorces less prevalent (Hugo et al., 1987).


    Given the information presented thus far, the following relationships are hypothesized
    to hold:


    * (5.1) Individuals with more education will have had more input into decisions
    affecting their own marriages than will those with less education.

    * (5.2) Individuals with more educated parents will have had more input into decisions
    affecting their own marriages than will those with less educated parents.

    * (5.3) Individuals who lived in a large urban area prior to marriage will have
    had more input into decisions affecting their own marriages than will those who
    lived in small urban or rural areas.

    * (5.4) Respondents who were married recently will have had more input into decisions
    affecting their marriages than will those wed longer ago.

    * (5.5) Those who married at older ages will have had more input into the marriage
    decision than will those who married at younger ages.

    * (5.6) Men will report having had more input into the marriage decision than
    will their spouses.

    * (5.7) Those currently in second or higher order marriages will have had more
    input in the marriage decisions involving the current union than will those still
    in their first marriages.


    ## Spousal Perceptions of Power in the Marriage Decision

