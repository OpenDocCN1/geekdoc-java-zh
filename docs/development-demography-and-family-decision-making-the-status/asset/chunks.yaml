    ### Contraception and Fertility'
  toc: []
  trans: '


    用于衡量被认为是家庭内部决策权估计核心的预测因子之一——夫妻婚后流动性的变量，被操作化为四类。除一种情况外，，如果相关个人在结婚后四年内更改了居住地，则认为发生了移动，这是因为在印度尼西亚农村地区，婚后跨户（可能还跨村）的移动通常发生在四年的规范性期内（Koentjaraningrat,
    1967）。


    创建的五类流动性类别包括：

    1) 双方均未移动的；

    2) 仅妻子搬迁的；

    3) 仅丈夫搬迁的；

    4) 双方均在婚后四年内搬迁的；以及；

    5) 双方都搬迁了，但在四年之后的。双方在婚后四年内均搬迁的类别被用作参考类别，因为预计该类别能为女性带来最大的家庭内部权力。


    另一个流动性变量衡量的是村庄之间的移动以及这些搬迁的时间。如果女性在结婚后四年内迁移到一个新村庄，她被归入其中一个虚拟类别中。如果她完成了跨村移动，但在结婚满四年或以上后才移动，则她属于另一类；如果她在婚后没有参与过任何超出村庄边界的移动，则她属于参考组。引入这些变量是为了确定远距离移动是否对女性具有破坏性，或者它们是否能帮助她们在决策过程中获得不受外部干扰的独立性。该变量的这种概念化也是为了确定此类移动的时间是否影响女性的家庭内部地位。


    为了进一步检查父母对家庭决策的影响，引入了一个衡量受访者与其父母之间接触频率的变量。受访者被问及平均访问每个父母的频率。如果他们与一个或双方父母住在一起，显然会报告与他们有频繁的互动。对于每个父母，受访者被问及平均互动频率为：每周多次、大约每周一次、每月二三次、大约每月一次、每年至少一次但并非每月，或每年少于一次。


    实际的父母接触变量随后构建如下：与父母或双方父母有频繁接触（每周至少一次）的受访者被列为“频繁接触父母”，而双方父母的见面频率未达到每周一次的人被列为“无频繁接触”。构建的虚拟变量如下：

    1) 一组由夫妻组成，其中只有妻子与她的父母有频繁接触；

    2) 另一组仅包含丈夫与他的父母有频繁接触的人；

    3) 第三组包含双方均频繁探望父母的夫妻；以及

    4) 第四组由夫妻组成，其中双方均未与其/她的父母有频繁接触。后一组被用作参考类别。


    这些变量只能近似反映受访者在做出避孕和生育决策时与其父母之间的接触量，因为接触是在调查时衡量的，而不是在决策时。由于某些父母在决策与调查之间可能已经去世，而其他父母子也可能改变了探访模式，因此这些变量存在局限性。然而，预计这些局限性并没有预想的那么大。例如，生育决策仅涉及在接受采访前已完成生育的女性。由于样本的年龄上限是
    50 岁，大多数停止生育的人不会在调查很久以前就停止了。对于涉及资源控制的问题，因果顺序不是问题，因为两个变量都是在调查时衡量的。唯一对时间顺序稍微关注的方程组是涉及是否使用过避孕措施的方程。


    在许多方程中，受访者对婚姻决策的投入作为独立变量引入。其构建方法已经描述过。收入变量也十分直接。妻子收入的对数变换往往能提高其收入与因变量之间线性关系，而对丈夫收入的类似变换通常没有帮助。因此，以卢比亚为单位的妻子收入（对数变换加
    1 以适应收入为零的情况，占病例的 25%）的自然对数值值形成了其收入的独立变量，在适当的情况下，对其丈夫收入也进行了类似的变换。否则，衡量丈夫收入的变量就是他每年赚取的卢比亚数除以
    1000。


    研究发现城市居住地在女性地位估计中并不显著，因此从分析中删除。


    ### 避孕与生育


    '
- fmt: '

    In the final analysis chapter, the dependent variables are the ever-use or non-use
    of contraception, and the number of children ever born to the respondent at the
    time of the survey. In the case of the former, the dependent variable is dichotomous,
    with a one indicating that the couple had used contraceptives during this marital
    union, and a zero indicating that no such use had occurred. The second variable
    is simply the total number of children the woman had ever borne.


    In that chapter, the woman''s decision-making power within the family is introduced
    as an independent predictor of both contraceptive use and fertility. However,
    the resource control variable is utilized as the sole predictor of women''s status
    in lieu of the composite measure, because the other components of status are highly
    related to the dependent variable measuring contraceptive use. Since only women
    who had used contraception were asked questions pertaining to contraceptive decisionmaking,
    all those who were never-users were coded zero on that variable. Further, the
    women in this sample who had used contraception appear to have done so primarily
    for child stopping, rather than spacing purposes. As a consequence, a large proportion
    of women who were ever-users of contraception have non-zero scores on both decision-making
    variables, while many non-users do not have scores (other than zero) for the variable
    measuring input into contraception decisions, and relatively few have nonzero
    scores for the variable measuring power in the childbearing decision. Because
    75 percent of the women in the sample earned a cash income in the year preceding
    the survey, the resource control variable was best suited for this portion of
    the analysis. Although the constraints against using the composite indicator were
    less severe in examining actual fertility, the same procedure was followed for
    the parity estimations.


    The mobility variables utilized in the contraception equations are similar to
    those described above, but the timing of the move is disregarded. Whether the
    wife or the husband moved alone, they moved together, or neither one moved, is
    the central issue. These variables are examined along with the variables measuring
    the educational attainment of each spouse, the woman''s income (logged), and the
    length of time the couple had spent in the current union. Because a slight curvilinear
    association between contraception and marital duration was observed in preliminary
    bivariate analyses, the duration variable was categorized into three dummies.
    The first includes those who had been married for fifteen years or less, the second
    is made up of those married 16 to 25 years, and the third includes those married
    for 26 years or more. The size of the community in which the woman lived prior
    to marriage (as defined earlier) was found to have a significant bivariate association
    with the dependent variable and so has also been included in this part of the
    analysis.


    The only additional variables utilized in [Chapter 7](#Ch07.xhtml_ht0055) include
    one that measures the desire for additional children, and one measuring the frequency
    with which discussions about contraception had taken place between the husband
    and the wife. The former is a simple dichotomy, with a one indicating that the
    wife intended to have additional children (27.7 percent of the sample), and a
    zero indicating that she did not (72.3 percent of the sample). For the variable
    measuring the amount of discussion that had taken place between the wife and her
    husband on the subject of contraception, a zero indicated that no discussion had
    taken place, a one that such discussions had occurred only very rarely, a two
    indicated that they had taken place somewhat more often, a three that they happened
    quite often, and a four indicated that they had occurred very often. The research
    supervisors advised against attempting to get greater detail on this variable.


    Because the dependent variable is dichotomous, all independent variables were
    regressed on the dependent variable using ` regression`. For the final set of
    equations, those estimating children born to the women, the only independent variable
    not already defined is one that measures the number of children the wife believed
    to be ideal. Whether or not the couple had used contraception is included in the
    second of the equations, and is described above.


