    必须意识到，“发展”的定义在不同作者之间存在差异。文献中并没有关于该术语的统一定义，几乎可以肯定，这里引用的许多著作都使用了不同的概念化方案。Ware (1981:7)
    指出，发展定义的共同要素通常包括“增长、进步、潜力的实现”以及对人力和物理原材料的可用性及其利用能力。此外，通常会在富裕国家和贫穷国家之间进行区分。然而，尽管有这些相似之处，不同的作者继续将不同的国家归为不同的发展类别。


    用于衡量发展的指标在不同研究中也各相同。尽管人均国民总值（`GNP`）和国内生产总值（`GDP`）是最常用的衡量指标之一，但这两者都存在固有的问题。这些问题包括：每项指标都未能捕捉发展中国家的非货币化生产性活动、无法整合教育、营养和健康等生活标准要素，以及无法衡量国内的收入分布。在比较富国和穷国时，第一个缺点往往倾向于夸大发达国家的相对优势，而第二点（可能还有第三点）会使测量结果倾向于发展中地区。尽管一些作者试图通过采用如莫里斯生活质量指数（`PQLI`）等衡量来调整这些问题，但人均
    `GNP` 仍然是比较各国发展水平时最常用的指标之一。


    # 印度尼西亚背景


    在本章中，我们将结合印度尼西亚的背景探讨第一章和第二章提出的某些问题。例如，女性在印度尼西亚社会扮演着什么角色？过去是如何看待女性角色的？随着时间的推移是否发生了变化？居住流动和婚后与父母接触的模式是否影响爪哇家庭内部女性的地位？最后，这些问题的答案对于分析中爪农村背景下的个人避孕和生育模式有何帮助？


    ## 印度尼西亚的人口


    `Figure 3.1` 显示了爪哇岛相对于印度尼西亚其他地区的规模和位置。印度尼西亚是世界人口第五大国家。根据人口参考局的估计，截至 1988 年，总人口已达到
    1.74 亿。该国居住着 300 多个不同的族群，每个族群都有自己的文化身份，并且都定义在相对独立的地理边界内。然而，尽管该国具有民族多样性，但各族群中有
    87.5%的人信仰单一宗教——伊斯兰教（Suparlan and Sigit, 1980）。本研究关注一个以穆斯林为主的群体，即中爪爪哇人。


    爪哇及整个印度尼西亚的人口规模和密度的一些基本数据见 `Table 3.1`。数据表明，印度尼西亚最显著的人口特征之一是人口分布不均，以及某些地区人口极密集。例如，根据利用数据来源的不同，1980
    年爪哇的人口密度估计在每平方公里 620 至 680 人之间。


    `TABLE 3.1`: 印度尼西亚人口（百万）及人口密度（1920-1971）


    | | 印度尼西亚整体 | 爪哇和马杜拉 | | |

    | :--- | :--- | :--- | :--- | :--- |

    | 年份 | 人口 | 密度/平方公里 | 人口 | 密度/平方公里 |

    | 1920 | 49.3 | 24 | 35.0 | 259 |

    | 1930 | 60.8 | 30 | 41.7 | 310 |

    | 1961 | 97.0 | 48 | 63.0 | 468 |

    | 1971 | 118.5 | 58 | 76.1 | 565 |

    | 1980 | 146.8 | 72 | 91.2 | 676 |


    表格根据 Suparlan 和 Sigit (1980: 16)的数据以及 1980 年人口普查信息（印度尼西亚国家统计局）构建；仅指爪哇岛的数据。


    因此，土地的可用性日益成为影响新婚夫妇可能居住地、定居后可能生育多少孩子以及家庭劳动力分配的因素。随着土地资源变得越来越稀缺和受限，夫妇们可能发现婚后很难建立独立的家庭。他们可能不得不与父母中的一方住在一起，或者搬到很远的地方。如果他们最终定居的土地非常小，他们的孩子可能比本该的少，或者预期某些孩子在达到工作年龄时迁移。多项研究已经证明了印度尼西亚土地分布是多么不平等且通常难以获得（Mangkuprawira,
    1981）。例如，White（1976）发现，虽然 Kali Loro6%的家庭拥有 50%的 `sawah`（用于水稻生产的土地），但 40%的家庭拥有小于
    0.2 公顷（生产一个普通家庭一年所需大米的大致土地量），37%的家庭完全没有。同样，Hull（1976）发现，Maguwoharjo 的家庭中，70%参与农业的家庭拥有或可获得小于
    0.2 公顷的土地。由于土地获取有限，许多妇女不得不通过寻找外职来补充家庭收入，并因此进入了现金经济（Mangkuprawira, 1981）。


    `FIGURE 3.1`: 印度尼西亚地图：主要岛群、省份和中爪哇


    ## 女性、工作与地位


    '
