    表 7.4： 各村首次使用选择的避孕方法！


    ![图像](img/9.jpeg)


    该样本中夫妻们所选择的避孕方法信息见表 7.4。数据表明，节宫内环（IUD）是最受欢迎的首次使用方法，其次紧随于口药。注射针、女性绝育、传统方法和节欲的使用相对较少，而专门针对男性的方法往往不被广泛接受作为首次使用方法。


    许多不同计划服务的受欢迎程度在各村之间保持基本一致。唯有在诺尔乔（Wonorjo），口药的使用者多于节宫内环的使用者，尽管那里节宫内环的使用也很常见。在一个村庄频繁使用而在其他地方几乎不使用的，只有女性绝育。在乔姆博尔（Jombor），女性绝育占所有方法使用总人数的
    13.2%，而肯内普（Kenep）仅为 6%，曼登（Manden）为 2.6%，诺尔乔则完全为零。


    证据表明，政府的项目在四个村庄中都取得了一定成功。在 58.9% 自称曾使用过避孕的女性中，只有 8.2% 在首次使用避孕时使用了传统方法（包括节欲）。


    表 7.5： 配偶教育程度的避孕使用百分比分布！


