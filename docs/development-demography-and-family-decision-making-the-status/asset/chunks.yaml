    \ changing content of the material presented to them over time.In summary of this\
    \ section, the variables of most importance among women married longer ago are\
    \ the size of their home communities prior to marriage and the ages at which they\
    \ married their current husbands. Variables measuring the amount of education\
    \ attained by both the women and their fathers are more important among women\
    \ married more recently than among those married 15 or more years before the survey,\
    \ and the same is true of the duration of marriage variable.Interestingly, many\
    \ of the variables that are useful in explaining women's perceptions of the marriage\
    \ decision fail to predict males' responses. The results of the analysis focusing\
    \ on husbands' perceptions of the decision-making process are presented in [Table\
    \ 5.5](#Ch05.xhtml_cap_lbl0016). In the first equation, the husband's education,\
    \ union order, and size of community prior to marriage are all found to have no\
    \ bearing on his level of control over the marriage decision. Only the educational\
    \ attainment of the men's fathers is found to be significant. Again, the more\
    \ schooling the father had completed, the more input the respondent perceived\
    \ himself to have had in making the decision to marry his current spouse. This\
    \ effect also holds in the second equation after the variable measuring his age\
    \ at marriage is introduced. As was true for the women, the husband's age at marriage\
    \ is a significant predictor of his level of control over the marriage decision,\
    \ and the coefficient is again positive. Men who married later believe they had\
    \ more input into the mate selection process than do those who married when they\
    \ were younger.In the third equation the marital duration variable is added. The\
    \ significant effects found in Equations 1 and 2 remain, and marital duration\
    \ is again found to be a powerful explanatory variable. As was the case in the\
    \ equations estimating the women's views of the marriage decision, men who were\
    \ married recently perceive themselves to have had more autonomy in choosing a\
    \ mate than do those who were married longer ago.[TABLE 5.5](#Figures.xhtml_bck_cap_lbl0016):\
