    | --- | --- |

    | 流动性变量： | |

    | 双方均移动 | 1.59^(**) |

    | 仅妻子移动 | 1.78^(***) |

    | 仅丈夫移动 | 1.96^(***) |

    | 想要更多孩子 (1=是, 0=否) | -1.73^(***) |

    | 讨论避孕的频率 | 0.65^(***) |

    | 妻子的决策权（资源控制） | -0.44^(***) |

    | 妻子婚前社区规模（得分越高越城市） | 1.15 |

    | 妻子的教育程度 | 0.73 |

    | 丈夫的教育程度 | 0.55 |

    | 妻子的收入（对数） | 0.52^* |

    | 结婚 26 年或以上 | -0.67^* |

    | 结婚 15 年或以下 | 0.76^* |

