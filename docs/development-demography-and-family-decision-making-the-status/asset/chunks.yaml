    | Both sides seen l+/week [(c)](#Ch06.xhtml_fn0002bc) | .080 |

    | Wife''s side seen l+/week [(c)](#Ch06.xhtml_fn0002bc) | -.058 |

    | Husband''s side seen l+/wk. [(c)](#Ch06.xhtml_fn0002bc) | .137 |

    | Husband''s input into marriage decision | .171*** |

    | Wife''s decision-making power | .775*** |

    | Wife''s education | .013 |

    | Husband''s education | -.004 |

    | Wife''s income (logged) | -.101*** |

    | Husband''s income | .089* |

    | Marital duration | .030*** |

