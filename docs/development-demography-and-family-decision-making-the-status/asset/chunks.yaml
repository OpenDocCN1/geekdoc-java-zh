  raw: 'The nature of the relationship between population growth and economic development
    is far from unambiguous. Questions surrounding that topic have generated sporadic
    and sometimes heated debate among scholars since the late 18th century, when Thomas
    Malthus first expressed concern about the impact of population growth on living
    standards. Malthus argued for the existence of a negative feedback mechanism between
    the two processes whereby 1) an increase in the standard of living would precipitate
    population growth (due largely to earlier first marriages), 2) that growth would
    result in diminishing returns to agricultural labor, and 3) the end product would
    be demographic as well as economic decline. "Population, when unchecked, increases
    in a geometrical ratio. Subsistence increases only in an arithmetical ratio. A
    slight acquaintance with numbers will shew the immensity of the first power in
    comparison of the second" (Malthus, 1959: 5, (originally published in 1798)).His
    critics have included among others, Marx and Engels. According to Engels, "even
    if we assume that the increase of output associated with this increase of labor
    is not always proportionate to the latter, there still remains a third element
    - which the economists, however, never consider as important - namely, science,
    the progress of which is just as limitless and at least as rapid as that of population"
    (Engels, quoted in Meek, 1971: 26). Lenin concurred, noting that "the law of diminishing
    returns does not apply at all to cases in which technique is progressing and methods
    of production are changing; it has only an extremely relative and restricted application
    to cases in which technique remains unchanged" (Lenin, quoted in Meek, 1971: 26).History
    ruled against Malthus in the context of Europe, as advances in technology and
    the institutional change that accompanied industrialization helped to ensure that
    some of his more dire predictions would not be realized. In addition, in spite
    of increases in the standard of living and decreases in mortality rates throughout
    much of the 19th and 20th centuries, population growth rates failed to take off
    during that period. Instead, between 1880 and 1910 fertility fell dramatically
    in a variety of social settings and under a wide range of social, demographic,
    and economic conditions. Once begun, the decline in fertility occurred both rapidly
    and irreversibly (van de Walle and Knodel, 1980), and as a consequence, the concern
    about population growth and debate about its relationship to economic development
    largely subsided for the next several decades.Since the 1950s, however, interest
    in the relationships between the two processes has resurfaced. Wide income disparities
    between more developed and less developed nations have become acutely apparent,
    and although recent economic growth in the developing world has been impressive,
    particularly among middle income countries, those gains have very often been offset
    by the speed with which populations have grown. The result has been that increases
    in per capita income and overall standards of living in less developed countries
    (LDCs) have not kept pace with growth in the industrialized world, and rapid population
    growth has again come to be viewed by many as a detriment to development (Coale
    and Hoover, 1958; van der Tak et al., 1979; Merrick et al., 1986).Within the developing
    countries themselves, the problems of rapid population growth have not been limited
    to industrializing sectors: they have often been particularly acute in agricultural
    sectors. Fertility is usually highest in rural areas and among the poorest families.
    As land is subdivided and subdivided again, the result tends to be either out-migration
    or more intensive farming of smaller and smaller plots. In the case of the latter
    "resources are spread too thin to allow for the ''investments'' beyond sheer survival,
    such as education, which might help these families lift themselves out of poverty"
    (van der Tak et al., 1979: 21). Migration has thus frequently become the alternative
    of choice.Migration is not without its own costs, however. The evidence increasingly
    suggests "that problems of population distribution and rural-to-urban migration
    are moving to the forefront of government concerns. Of 116 less developed countries
    surveyed by the United Nations in 1978, 94 percent expressed some degree of dissatisfaction
    with their population distribution patterns, and about 60 percent reported the
    patterns to be highly undesirable" (Goldscheider, 1983: 4). Because economic growth
    at the destination is frequently insufficient to keep pace with migration flows,
    the results often include unemployment, underemployment, housing shortages, and
    inadequate infrastructure. When urban labor markets are unable to absorb the influx
    of rural migrants, political, social, environmental and economic instability can
    arise. "It gives the poor the frustrating choice between growing rural poverty,
    as the per capita land base shrinks, or eking out a miserable urban livelihood"
    (Beier, 1976: 18).Because scientific advances and the social environment enabled
    Europe to escape the economic and demographic downturns predicted by Malthus,
    however, there are a number of writers who claim that technology will also eradicate
    the population-related problems facing today''s LDCs. Proponents of that view
    argue that, given time, the presence of markets will allow for the realignment
    of population, resources, and the environment. They maintain that although population
    growth may initially create imbalances, human ingenuity will again provide a correction.
    "Extra children will eventually cause more inventions than otherwise because of
    the greater ''need,'' which, in turn, may force people to work harder to invent
    new ways to reduce work. (In paradise no one would have an incentive to invent
    anything)" (Simon, 1977: 201). If the correction does not take place, it is because
    markets are constrained and thus unable to stimulate sufficient innovation and
    entrepreneurship (Simon, 1981; Merrick et al., 1986).Simon''s view may be correct
    in the long run. In the meantime, however, the gaps that remain between rich and
    poor nations are considerable, and raising the living standards of those in the
    lower tier to a point at which they can approximate those in the industrialized
    world is presenting policy makers with a formidable challenge. In addition, it
    has become apparent that countries with higher per capita GNPs tend to be those
    with lower levels of fertility and higher life expectancies. And it is clear that
    high rates of population growth are associated with the exacerbation of inequitable
    distributions of income within countries, as well as with the deterioration of
    living standards among lower income groups (Birdsall, 1980).Results from a recent
    report by the National Academy of Sciences (1986) indicate that when the other
    elements involved in production remain constant, population growth is likely to
    reduce the productivity of labor, lower wages in agriculture, and precipitate
    the depletion of renewable resources. In the long run, rapid population growth
    enhances income disparities by causing the returns to labor to fall in comparison
    to the returns from the other factors of production. On the micro level, couples
    who have many children are able to spend less per child on health, nutrition,
    and education, and as a consequence, children from larger families are frequently
    less healthy and less well educated than are those with fewer siblings. The prevention
    of future unwanted births should therefore improve the prospects for children
    within families among whom birth control is either not utilized or not utilized
    successfully (National Research Council, 1986).Given this background, it is not
    surprising that there is again a strong contingent who insist that "one of the
    principal requirements in most less developed countries is clearly the earliest
    possible reduction of high fertility rates" (van der Tak et al., 1979: 21). And
    it is not surprising that programs aimed at fertility decline have become a priority
    among many population pundits. To date, however, the approaches and emphases of
    such programs have varied considerably. For example, because of the range of cultural
    contexts that exist and the variety of philosophies that are espoused throughout
    the different regions of the world, the position of the United Nations Fund for
    Population Activities (UNFPA) has been that "neutrality, innovation and flexibility,"
    must guide their policy initiatives. One of the Fund''s central premises has been
    that "every nation has the sovereign right to determine its own population policy,
    and that individuals have the right to determine freely and voluntarily their
    family size" (Sadik, 1984: 2).Although initially appealing, the potential for
    considerable conflict is inherent in this position, as it assumes that goals of
    nations and individuals coincide. When governments and individuals both desire
    fertility limitation, the establishment of strong family planning programs is
    an obvious first step toward satisfying both parties. In other cases, however,
    program decisions are more complicated. It has been argued, for example, that
    in situations in which reductions in fertility are desired by the policy makers
    but not by the general public, and when the fertility decisions made by couples
    begin to impose "external costs on other families - in overexploitation of common
    resources, congestion of public services, or contribution to a socially undesirable
    distribution of income - a case may be made for policies that go ''beyond family
    planning''" (National Research Council, 1986: 93). Such programs have been instituted
    in a variety of settings and have included more general campaigns to convince
    couples that lower family size norms are desirable, along with specific tax and
    incentive packages aimed at lowering individual fertility targets.Whether or not
    governments and individuals agree, however, most policy makers now recognize that
    because the family is both "the basic unit of society and the primary socializing
    institution and transmitter of social norms" (Salas, 1984: 27), programs must
    address the needs of the family as a unit if they are to be successful. Those
    interested in fertility behavior are becoming increasingly aware of the "relevance
    of family systems and changing familial roles" (Oppong, 1984: 332), and particularly
    the evolving roles of women within the family, for their research and for policy
    outcomes.Because interest in the grassroots actors has developed relatively recently,
    the processes by which the social position of women can be improved within both
    the family and society remain primarily a matter of speculation. It is clear,
    however, that the constraints and discrimination women face in education, employment,
    training programs, credit opportunities, and community life in general restrict
    their power, limit the resources available to them within the context of the family,
    and "strengthen the cultural pressures on women to define themselves as mothers"
    (Safilios-Rothschild, 1982: 328). It is also apparent that especially in societies
    characterized by strict gender stratification, women frequently must rely upon
    the birth of sons for security, power, and prestige (Oppong, 1984), and that this
    situation is aggravated because "there is considerable pressure, sometimes subtle,
    sometimes direct, to remain in this niche" (Salas, 1979: 221).Policy makers interested
    in fertility reduction have therefore concluded that raising the status of women
    within developing societies is essential if they are to be successful in limiting
    population growth. In fact, it is now commonly argued that "little can be accomplished
    in the population fields without the active involvement and full participation
    of women" (Salas, 1979: 223). As a consequence, it is increasingly important to
    determine which factors most clearly define, limit, or enhance the social position
    of women within both the family and society.'
