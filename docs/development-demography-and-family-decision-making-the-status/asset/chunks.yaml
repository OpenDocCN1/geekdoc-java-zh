    The interviewers recruited to conduct the survey were all university students
    from the Universitas Sebelas Maret in Solo, the urban center adjacent to the kabupaten
    (Sukoharjo) in which the survey was to take place. Twelve men and twelve women
    were hired in all. All had rural backgrounds and spoke Javanese. Two days were
    spent at the university for interviewer training, most of which involved going
    over the questionnaire. Upon completion of the training session, the interviewers
    moved to households in the villages selected by village officials.


    The interviewers operated in teams. One male and one female went to each of the
    sampled households. The information on the household schedule was obtained first.
    During that section of the interview it was often helpful to have several household
    members present to fill in gaps in the primary respondent''s answers. Given the
    focus of the this research, however, it was imperative that both male and female
    respondents answer frankly and freely. As a consequence, after the household schedule
    had been completed, interviewers were instructed to conduct interviews of individuals
    separately. The male interviewers were assigned to interview male household members,
    and the female interviewers were assigned to interview the women.


    [TABLE 4.2:](#Figures.xhtml_bck_cap_lbl0010 AGE-SEX DISTRIBUTION OF THE SAMPLE
    BY VILLAGE![Image](Images/5.jpeg)


    Considerable care was taken to interview husbands and wives both separately and
    simultaneously to avoid contamination of the results. In some cases, however,
    that was not possible given the work obligations of the respondents. In Mandan,
    for example, it was harvest time for many households, and family members took
    turns coming in from the fields to be interviewed. Although this system did not
    allow for simultaneous interviews, it did ensure that spouses would be interviewed
    separately. When it was not possible to conduct the interviews simultaneously,
    they were almost always completed within a few hours of one another, minimizing
    the amount of time in which discussion between the two spouses could have taken
    place between interviews.


    The separation of spouses was particularly important for questions involving the
    relative power of individuals in making major household decisions. Those questions
    are central to the analysis of the intergenerational dynamics involved in the
    marriage decision, as well as to the estimation of women''s intra-household status;
    both are among the most complex concepts to be analyzed in this research.


    ## Variable Definitions and Analysis


    The first dependent variable measures the amount of input the respondent felt
    she/he had into the decision that he/she should marry his/her current spouse.
    This variable is categorized one through five, with a five indicating that the
    respondent (and in most cases the spouse) had complete control over the decision
    to marry, a four indicating that the decision was primarily theirs although others
    had some input, a three indicating that they shared equally with others in making
    the decision, a two indicating that the decision was largely made by others, but
    that they were allowed some input, and a one indicating that the respondent had
    no control at all over the marriage decision. Respondents were asked to decide
    which category best fit their recollection of the marriage decision, but their
    answers are meant to be viewed as falling somewhere along a continuum of relative
    power. The median response offered by women to this question is 4.0, and the skewness
    of the distribution is minimal (.049).


    In cases in which the couple was not solely responsible for the marriage decision
    it is certainly possible that women and men were allowed different amounts of
    input into the decision, i.e., that they did not act as equal partners or as a
    unit in the process. Although this variable was designed to measure the extent
    to which parents and other family members controlled the marriage decision, it
    is thus limited in that it fails to capture explicitly the different levels of
    input enjoyed by the brides and the grooms themselves. As the information provided
    in [Chapter 5](#Ch05.xhtml_ht0044) will demonstrate, however, some differences
    in their perceptions of power may nonetheless be analyzed.


    The independent variables introduced into each set of equations aimed at estimating
    this dependent variable are, for the most part, straightforward. Union order is
    a simple dichotomous variable, with a zero indicating that the respondent was
    in his/her first marriage at the time of the survey, and a one indicating a higher-order
    union. Variables measuring the educational attainment levels of the fathers of
    the respondents are categorized one through five, with a one indicating no formal
    schooling and a five indicating completion of at least some college-level education.
    These values are then multiplied by three to approximate the average number of
    years of schooling attained by the fathers at each level of education, and to
    make the coefficients generated more compatible with those measuring the schooling
    levels of the respondents themselves. Respondents'' educational attainment levels
    are measured by the total number of years of formal schooling each completed.


    As is true of the dependent decision-making variable, the categories of these
    independent variables are described only in order to give the reader an understanding
    of the organization of the data. The divisions of the education variables, like
    those that comprise the decision-making variables and many of the others presented
    in this discussion, are meant to be viewed as part of a continuum, and not as
    discrete groups.


    The variable measuring residence prior to marriage is divided into four categories.
    A four indicates residence in Jakarta, a three indicates other metropolitan residence
    (one million plus residents), a two represents life in another large urban area
    (cities of 250,000 to 999,999 residents), and a one indicates residence in a smaller
    urban or rural setting. It would have been preferable to have separate information
    on small urban versus rural locales, and in fact, the questionnaire was designed
    to allow for this distinction. Unfortunately, however, the data were collapsed
    into the groupings listed above during the coding process.


    Age at marriage (for the current union), measured in years, is included as a control
    in several of the equations because younger grooms, and especially younger brides,
    are considered to be more malleable than are more mature adults (Caldwell et al.,
    1983). The age at which individuals marry has also been found to increase with
    rising educational levels, modernization, and urbanization (Smith, 1980; Smith
    and Karim, 1980). The duration of the couple''s marriage is included as an indicator
    of marriage cohort. Considerable emphasis has been placed on the element of time
    in studies of family change, and the inclusion of the duration of marriage variable
    is appropriate to measure its effects. Construction of this variable is also straightforward;
    it measures the number of years the respondent has been married to his/her current
    spouse.


    ### Measurement of Female Status

