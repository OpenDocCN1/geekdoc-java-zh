    Among the most important of those decisions are the ones involving childbearing.
    As is true in other developing countries, the expected economic returns from having
    children have encouraged relatively high levels of fertility in Indonesia. The
    economic benefits expected to accrue to parents are generally manifested in the
    form of additional labor power and the provision of security in old age, and Indonesian
    children appear to be conscientious providers of both.


    For example, among Javanese 15 to 19 year-olds, males contribute an average of
    7.9 hours per day to directly and indirectly productive activities, while their
    sisters each contribute over ten hours. The data presented in [Table 3.3](#Ch03.xhtml_cap_lbl0004)
    demonstrate that even very young children make substantial contributions to the
    functioning household economy. By the time they are between the ages of 12 and
    14, girls average over eight hours of labor a day, while their brothers contribute
    close to five. Even boys and girls between the ages of six and eight provide over
    three hours of labor each day. Javanese girls in that age group have been estimated
    to spend 1.7 hours per day looking after younger siblings, so small children do
    not always constitute a drain on their mothers'' time.


    Nag et al. (1980:256-257) have found, for example, that in "only two of the 20
    Javanese households do mothers spend more time than other household members in
    child care; in the majority of cases, it is the elder siblings who do the majority
    of this work."[ [TABLE 3.3:](#Figures.xhtml_bck_cap_lbl0004) JAVANESE DAILY WORK
    INPUTS BY SEX AND AGE*![Image](Images/3.jpeg)


    [TABLE 3.4:](#Figures.xhtml_bck_cap_lbl0005) AVERAGE TIME SPENT IN SCHOOL AS A
    PERCENTAGE OF AVERAGE TIME SPENT IN ALL WORK FOR CHILDREN OF VARIOUS AGE GROUPS


    | | Hours by Age Groups | | | | |

    | --- | --- | --- | --- | --- |

    | Gender | 6-8 | 9-11 | 12-14 | 15+ |

    | --- | --- | --- | --- | --- |

    | | | | | | |

    | * * * | | | | |

    | Boys | 73 | 112 | 56 | 2 |

    | Girls | 76 | 53 | 20 | 0 |


    Data obtained from Nag et al., (1980:256). As has been noted, Javanese women spend
    more time engaged in indirectly productive activities than do their husbands,
    and that pattern holds across all age groups. Except among the youngest working
    children, girls and women in all age groups spend more time engaged in total work
    activities than do their male counterparts. Conversely, males in most age categories
    spend more hours per day in directly productive activities than do girls or women,
    except when they are between the ages of 9 and 14.


    Nag et al. (1980:257) suggest that that is because "girls of these age groups
    participate in a major way in handicrafts, trade, and wage labor, whereas the
    boys... participate in a major way only in animal care." While boys in these age
    ranges spend virtually no time in the preparation of food for the household, girls
    in the corresponding age group spend an average of 1.3 hours each day.


    Not only are certain tasks gender-specific, but differences in labor allocation
    are also determined by the varying amounts of time girls and boys spend in school.
    As the data in [Table 3.4](#Ch03.xhtml_cap_lbl0005) demonstrate, boys spend a
    higher proportion of their time in school than do girls, relative to their other
    work. This is particularly apparent when they are between the ages of 9 and 14;
    again, those are the only ages during which female participation in directly productive
    activities exceeds that of males. Variation in the labor inputs of boys and girls
    is thus not only the result of the sexual division of labor, but it is also related
    to differences in the amount of time children of both genders spend in school.


    Children from large families reportedly work more hours than do those from smaller
    households. Nag et al. (1980) have argued that this may be either because younger
    children are inspired to work hard by older siblings, or because older children
    are able to engage in directly productive work once the others are able to take
    over their household chores. Whatever the reason, the increased labor contributed
    by children from larger families allows substantial benefits to accrue to those
    families. As a rule, larger families are more successful economically than are
    smaller ones.


