    It is important to recognize that the definition of "development" varies from
    author to author. No single definition for the term exists in the literature,
    and it is virtually certain that a number of the works referenced here have utilized
    different conceptualizations. Ware (1981:7) has noted that the common ingredients
    to a definition of development usually entail "growth, progress, the achievement
    of potential" and the availability of and ability to use human and physical raw
    materials. In addition, there is generally a distinction drawn between rich and
    poor nations. In spite of those similarities, however, different writers continue
    to assign different countries to different development categories.


    The indicators chosen to measure development also vary from study to study. Although
    per capita gross national product (`GNP`) and gross domestic product (`GDP`) are
    among the measures most commonly utilized, there are well known problems inherent
    in both. Such problems include the failure of each indicator to capture nonmonetized
    productive activities in developing countries, their inability to incorporate
    elements of living standards such as education, nutrition, and health, and their
    failure to measure income distribution within countries. When comparing rich and
    poor countries, the first of these shortcomings would tend to overstate the relative
    advantage of the more developed nations, while the second (and probably the third)
    would bias the measure in favor of the developing world. Although some authors
    have attempted to adjust for these problems through the adoption of such measures
    as Morris''s Physical Quality of Life Index (`PQLI`), per capita `GNP` is still
    among the measures used most frequently to compare levels of development between
    countries.


    # The Indonesian Context


    In this chapter, some of the issues raised in Chapters 1 and 2 are examined in
    the context of Indonesia. For example, what is the role of women in Indonesian
    society? How were female roles viewed in the past, and how, if at all, have they
    changed over time? Do the patterns of residential mobility and parental contact
    after marriage influence the status of women within Javanese households? Finally,
    how might the answers to these questions be useful in the analysis of individual
    contraception and fertility patterns in the context of rural Central Java?


    ## Indonesia''s Population


    `Figure 3.1` provides a sense of the size and location of Java in relation to
    the rest of Indonesia. Indonesia is the fifth most populous country in the world.
    According to estimates from the Population Reference Bureau the total population
    had reached 177.4 million as of 1988. The country is inhabited by over 300 different
    ethnic groups, each with its own cultural identity, and each one defined within
    relatively distinct geographical boundaries. In spite of the country''s ethnic
    diversity, however, 87.5 percent of the people in the various ethnic groups adhere
    to a single religion, Islam (Suparlan and Sigit, 1980). This research focuses
    on one of the predominantly Muslim groups, the ethnic Javanese of Central Java.


    Some basic data on the population size and density in Java and Indonesia as a
    whole are presented in `Table 3.1`. As the data suggest, among Indonesia''s most
    distinctive demographic features is the uneven distribution of its population
    and the extreme density of the population in some parts of the country. For example,
    depending upon the source of data utilized, estimates of the population density
    in Java for 1980 range between 620 and 680 people per square kilometer.


    `TABLE 3.1`: TOTAL POPULATION (in millions) AND POPULATION DENSITY IN INDONESIA
    (1920-1971)


    | | Indonesia as a Whole | Java and Madura | |

    | :--- | :--- | :--- | :--- | :--- |

    | YEAR | Population | Density/sq.km | Population | Density/sq.km |

    | 1920 | 49.3 | 24 | 35.0 | 259 |

    | 1930 | 60.8 | 30 | 41.7 | 310 |

    | 1961 | 97.0 | 48 | 63.0 | 468 |

    | 1971 | 118.5 | 58 | 76.1 | 565 |

    | 1980 | 146.8 | 72 | 91.2 | 676 |


    Table constructed from data from Suparlan and Sigit (1980: 16), and from information
    from the 1980 Census (Indonesia, Biro Pusat Statistik); indicates data for Java
    only.


    As a consequence, availability of land has increasingly become a factor affecting
    where a newly married couple might live, how many children they might have once
    settled, and the labor force allocation of the family. As land availability becomes
    more and restricted, couples may find it difficult to establish independent households
    soon after they marry. They may have to live with one or the other set of parents
    or move a considerable distance away. If the plot on which they eventually settle
    is very small, they may have fewer children than they would otherwise have, or
    expect some to migrate when they get old enough to work. Several studies have
    demonstrated how unequally distributed and generally inaccessible land in Indonesia
    can be (Mangkuprawira, 1981). White (1976) has found, for example, that while
    6 percent of the families in Kali Loro own 50 percent of the `sawah` (land used
    in the production of wet rice), 40 percent own fewer than 0.2 hectares (the approximate
    amount of land needed to produce adequate rice for the average household for the
    year), and 37 percent own none at all. Similarly, Hull (1976) has found that among
    households in Maguwoharjo, 70 percent of the families involved in agriculture
    own or have access to fewer than 0.2 hectares. Given limited access to land, many
    women have had to supplement household incomes by seeking outside employment,
    and have entered the cash economy as a result (Mangkuprawira, 1981).


    `FIGURE 3.1`: MAP OF INDONESIA: MAJOR ISLAND GROUPS, PROVINCES, AND CENTRAL JAVA


    ## Women, Work, and Status

