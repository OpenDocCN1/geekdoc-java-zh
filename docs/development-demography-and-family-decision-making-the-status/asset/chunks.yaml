    Extended co-residence with either set of parents is likely to continue to restrict
    the wife''s input into household decisions, as is migration to a distant village
    early in the marriage. If the problem of land scarcity becomes particularly acute,
    the early establishment of independent households within selected villages may
    become less and less feasible.Improvements in the status of women are nevertheless
    likely to continue to occur in Indonesia via such mechanisms as increases in education
    and employment opportunities. The current government has been committed for some
    time to raising women''s status through these and other avenues, although one
    of the primary rationales behind such policies has been that improvements in the
    social position of women should produce increases in contraceptive use and decreases
    in fertility. The results of this analysis suggest, however, that the linkages
    between women''s status, contraception and fertility are not always those anticipated.
    For example, at the time of our survey relatively large families remained attractive
    to many Indonesian women, and the higher status women we interviewed appeared
    to be those who had been best able to resist program pressure to adopt contraception.As
    a result, it appears as though there now exists at least an underlying adversarial
    relationship between the stated goals of the family planning program and the reproductive
    targets of a number of women in Javanese society. Changes in contraceptive behavior
    are at times brought about only after a certain amount of pressure has been exerted
    on the acceptor, since personal values and policy objectives do not always coincide.
    Thus far, it has been the women with comparatively high autonomy who have been
    best able to resist program influence when the latter is contrary to their own
    preferences.On the other hand, despite the fact that increases in the intra-and
    extra-household status of women are not always immediately effective in limiting
    fertility, it is likely that they will eventually play an important role in that
    regard and thus should be encouraged. Women with high intra-household status have
    lower ideal family sizes than do women with less power within the home; they tend
    to marry later, and they are characterized by comparatively high levels of extrahousehold
    status as well.Because continued fertility reduction is desired by the government,
    one immediate priority should be to further reduce family size preferences, a
    factor that is clearly recognized by policy makers in Indonesia as crucial to
    the eventual success of their program, rather than to encourage couples to adopt
    a strategy for which they may not otherwise be ready. Once couples establish lower
    reproductive targets, it is likely that the higher status women will be among
    those with the lowest fertility.


