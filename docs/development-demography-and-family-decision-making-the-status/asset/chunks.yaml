    \ have into household decisions.\n\n# [7\n\nContraception and Fertility](#contents.xhtml_bck_ht0055)\n\
    \nIn this portion of the analysis, the relationships between the status of women\
    \ within the Javanese family and their contraceptive use and fertility behavior\
    \ are assessed. The information presented in [Chapter 2](#Ch02.xhtml_ht0012) suggested\
    \ that women with higher status within the family should be more likely to use\
    \ contraception and to exhibit low levels of fertility than should women with\
    \ less autonomy. In addition, women with high status on a second dimension, that\
    \ which compares individuals across households on indicators such as education\
    \ and income, should be more likely to be ever-users of birth control and to have\
    \ smaller families than should women with lower status on that dimension. Specifically,\
    \ the following hypotheses are suggested:(7.1) Women who have high intra-household\
    \ status will be more likely to be ever-users of contraception than will women\
    \ with low status within the household.(7.2) Women who have high intra-household\
    \ status will have lower fertility than will women with low status within the\
    \ household.(7.3) Women who have high extra-household status will be more likely\
    \ to be ever-users of contraception than will women with low status on that dimension.(7.4)\
    \ Women who have high extra-household status will have lower fertility than will\
    \ women with low status on that dimension.As was discussed in [Chapter 3](#Ch03.xhtml_ht0021),\
    \ over the past twenty years the government of Indonesia has been firmly committed\
    \ to bringing about reductions in overall fertility rates by increasing contraceptive\
    \ use and efficacy throughout the country. Of the major islands, Java now has\
    \ the lowest total fertility rate (the 1980 TFR = 3.89), and of the provinces\
    \ on that island, Central Java has been moderately successful compared to the\
    \ other provinces; (the 1980 TFR = 4.08).The percent distribution of children\
    \ ever born (CEB) to the women in this sample is displayed in [Table 7.1](#Ch07.xhtml_cap_lbl0024).[TABLE\
    \ 7.1:](#Figures.xhtml_bck_cap_lbl0024) PERCENT DISTRIBUTION OF CHILDREN EVER\
    \ BORN\n\n| Number of Childen Ever Born | Percent |\n\n| --- | --- |\n\n|  \n\n\
    * * *\n\n |  |\n\n| 0 | 4.1 |\n\n| 1-2 | 25.9 |\n\n| 3-4 | 30.9 |\n\n| 5-6 | 18.5\
    \ |\n\n| 7 or more | 20.6 |\n\n|  \n\n* * *\n\n |  |\n\n| Total | 100.0 |\n\n\
