    # Factors Affecting Fertility](#contents.xhtml_bck_ht0058)


    * Significant at the .10 level; ** Significant at the .05 level; *** Significant
    at the .01 level : Two-tailed test of significance.


    (a) Reference group-those married 16-25 years.who had begun co-residing with one
    or the other set of in-laws prior to their marriage. It was thought that they
    might also be the couples who married the earliest, and therefore probably those
    from the oldest cohorts. That was found not to be the case through a test of means,
    however. The ages at marriage of spouses who had not moved were not significantly
    different from those in the other mobility categories.


    The couples who comprise the various mobility categories do vary significantly
    across groups as to the amount of schooling the wife had attained and the size
    of her place of residence prior to marriage, however. In cases in which neither
    spouse moved following marriage, wives were found to have completed an average
    of 3.2 years of schooling. When only the husband or the wife moved, the wives
    averaged 3.5 years of education, and in cases in which both spouses moved, women
    generally attained an average of 4.5 years. This may be one reason why the education
    variables weakened and became non-significant in the multivariate analysis. Neither
    the husband''s nor the wife''s level of schooling successfully predicts contraceptive
    use or non-use when the other variables are controlled.


    [TABLE 7.10:](#Figures.xhtml_bck_cap_lbl0033) CHILDREN EVER BORN BY LEVEL OF DECISION-MAKING
    POWER [RESOURCE CONTROL, RESTRICTED SAMPLE]![Image](Images/11.jpeg)


    A similar pattern is observed for the variable measuring the size of the wife''s
    community prior to marriage. Given our sample, every woman in a union in which
    neither spouse had moved following their marriage must, by definition, have lived
    in a rural area before the wedding. Women in unions in which both spouses had
    moved, were obviously much more likely to have lived in a large urban center.
    As is true of the education variables, the size of residence variable fails to
    predict contraceptive use or non-use when the other variables are controlled.


    Still very important in predicting contraceptive use is the frequency with which
    conversations about family planning had taken place between husbands and wives.
    The more often family planning issues had been discussed, the greater the likelihood
    that the couple had used some form of birth control during their marriage.


    Not surprisingly, the desire for additional children is also a significant predictor
    of contraceptive use. Women who wanted to continue childbearing were less likely
    to have used contraception than were those who wanted no more children. Again,
    this suggests that family planning services are particularly popular among women
    who wish to curtail further childbearing entirely.


    Given past research, it is somewhat more surprising that higher incomes among
    the sampled women are associated with lower levels of contraceptive use. Additional
    resources have often been argued to give women more control over household decisions,
    including those pertaining to reproduction, and to provide them with the means
    to obtain birth control when it is they who must do the purchasing. In Indonesia,
    however, aside "from a registration fee charged to most clinic users" contraceptive
    acceptors have long received services free of charge through the government''s
    family planning program (McNicoll and Singarimbun, 1983:84).


    It is also clear that income and actual fertility are positively correlated in
    many parts of the world (Mueller and Short, 1983). The more income a family earns,
    the more children they can afford to have, and vice versa. If, as has already
    been observed, children in Central Java are seen as producing increases in wealth
    for the family, and if the couple is able to afford the initial investment of
    an additional child, they will be relatively unlikely to use contraception^([6](#Ch07.xhtml_fn0030)).
    Probably the most plausible explanation for the negative relationship between
    income and ever-use of contraception in this context is the one offered by McNicoll
    and Singarimbun (1983). They argue that people at the lowest income levels in
    Java are most likely to use contraception because 1) they are particularly susceptible
    to a combination of Malthusian pressures, and 2) because their ability to resist
    government campaigns to reduce fertility is limited. Freedman et al. (1981) have
    found a curvilinear effect of income upon contraception in Indonesia, and have
    posited similar explanations for the behavior of the lower income groups.


    The impact of marital duration upon contraceptive use is more straightforward.
    Everything else being equal, the longer the couple has been married, the less
    likely they are ever to have utilized a method of birth control. Women who had
    been married 15 or fewer years at the time of the survey were significantly more
    likely to have ever used a family planning method than were those married 16-25
    years, while women married longer than 25 years were, in turn, significantly less
    likely to have been ever-users. That is not surprising. Most of the women who
    were married longest are from earlier birth cohorts, are more traditional in general,
    and are less apt to have been targeted for family planning programs than are those
    who were married more recently.


    Finally, the variable measuring the woman''s power to control decisions about
    income expenditures has a negative impact on contraceptive use. The effect is
    independent of the woman''s marital duration and her desire for additional children,
    variables mentioned earlier as possible mediating factors in the relationship
    between intra-household status and contraception. In addition, if the sample is
    split by levels of marital duration or by parity to see whether or not the association
    varies within categories of either of those variables, the relationship remains^([7](#Ch07.xhtml_fn0031)).
    As was the case for the variable measuring the woman''s income, it is therefore
    likely that the negative effect of women''s decision-making power reflects the
    fact that those with the least power within the family are also those most easily
    influenced by government officials hoping to increase contraceptive use.

    '
  raw: '* Significant at the .10 level; ** Significant at the .05 level; *** Significant
    at the .01 level : Two-tailed test of significance.(a) Reference group-those married
    16-25 years.who had begun co-residing with one or the other set of in-laws prior
    to their marriage.It was thought that they might also be the couples who married
    the earliest, and therefore probably those from the oldest cohorts. That was found
    not to be the case through a test of means, however. The ages at marriage of spouses
    who had not moved were not significantly different from those in the other mobility
    categories.The couples who comprise the various mobility categories do vary significantly
    across groups as to the amount of schooling the wife had attained and the size
    of her place of residence prior to marriage, however. In cases in which neither
    spouse moved following marriage, wives were found to have completed an average
    of 3.2 years of schooling. When only the husband or the wife moved, the wives
    averaged 3.5 years of education, and in cases in which both spouses moved, women
    generally attained an average of 4.5 years. This may be one reason why the education
    variables weakened and became non-significant in the multivariate analysis. Neither
    the husband''s nor the wife''s level of schooling successfully predicts contraceptive
    use or non-use when the other variables are controlled.[TABLE 7.10:](#Figures.xhtml_bck_cap_lbl0033)
    CHILDREN EVER BORN BY LEVEL OF DECISION-MAKING POWER [RESOURCE CONTROL, RESTRICTED
    SAMPLE]![Image](Images/11.jpeg)A similar pattern is observed for the variable
    measuring the size of the wife''s community prior to marriage. Given our sample,
    every woman in a union in which neither spouse had moved following their marriage
    must, by definition, have lived in a rural area before the wedding. Women in unions
    in which both spouses had moved, were obviously much more likely to have lived
    in a large urban center. As is true of the education variables, the size of residence
    variable fails to predict contraceptive use or non-use when the other variables
    are controlled.Still very important in predicting contraceptive use is the frequency
    with which conversations about family planning had taken place between husbands
    and wives. The more often family planning issues had been discussed, the greater
    the likelihood that the couple had used some form of birth control during their
    marriage.Not surprisingly, the desire for additional children is also a significant
    predictor of contraceptive use. Women who wanted to continue childbearing were
    less likely to have used contraception than were those who wanted no more children.
    Again, this suggests that family planning services are particularly popular among
    women who wish to curtail further childbearing entirely.Given past research, it
    is somewhat more surprising that higher incomes among the sampled women are associated
    with lower levels of contraceptive use. Additional resources have often been argued
    to give women more control over household decisions, including those pertaining
    to reproduction, and to provide them with the means to obtain birth control when
    it is they who must do the purchasing. In Indonesia, however, aside "from a registration
    fee charged to most clinic users" contraceptive acceptors have long received services
    free of charge through the government''s family planning program (McNicoll and
    Singarimbun, 1983:84).It is also clear that income and actual fertility are positively
    correlated in many parts of the world (Mueller and Short, 1983). The more income
    a family earns, the more children they can afford to have, and vice versa. If,
    as has already been observed, children in Central Java are seen as producing increases
    in wealth for the family, and if the couple is able to afford the initial investment
    of an additional child, they will be relatively unlikely to use contraception.^([6](#Ch07.xhtml_fn0030))Probably
    the most plausible explanation for the negative relationship between income and
    ever-use of contraception in this context is the one offered by McNicoll and Singarimbun
    (1983). They argue that people at the lowest income levels in Java are most likely
    to use contraception because 1) they are particularly susceptible to a combination
    of Malthusian pressures, and 2) because their ability to resist government campaigns
    to reduce fertility is limited. Freedman et al. (1981) have found a curvilinear
    effect of income upon contraception in Indonesia, and have posited similar explanations
    for the behavior of the lower income groups.The impact of marital duration upon
    contraceptive use is more straightforward. Everything else being equal, the longer
    the couple has been married, the less likely they are ever to have utilized a
    method of birth control. Women who had been married 15 or fewer years at the time
    of the survey were significantly more likely to have ever used a family planning
    method than were those married 16-25 years, while women married longer than 25
    years were, in turn, significantly less likely to have been ever-users. That is
    not surprising. Most of the women who were married longest are from earlier birth
    cohorts, are more traditional in general, and are less apt to have been targeted
    for family planning programs than are those who were married more recently.Finally,
    the variable measuring the woman''s power to control decisions about income expenditures
    has a negative impact on contraceptive use. The effect is independent of the woman''s
    marital duration and her desire for additional children, variables mentioned earlier
    as possible mediating factors in the relationship between intra-household status
    and contraception. In addition, if the sample is split by levels of marital duration
    or by parity to see whether or not the association varies within categories of
    either of those variables, the relationship remains.^([7](#Ch07.xhtml_fn0031))
    As was the case for the variable measuring the woman''s income, it is therefore
    likely that the negative effect of women''s decision-making power reflects the
    fact that those with the least power within the family are also those most easily
    influenced by government officials hoping to increase contraceptive use.


