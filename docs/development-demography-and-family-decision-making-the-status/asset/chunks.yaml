    # 前言


    '
- fmt: '

    The shift toward the small nuclear family and the emergence of new roles for women
    have been among the conspicuous changes accompanying economic development and
    social modernization. As the power of the extended family waned, the control exercised
    by others over the status and roles of women and over their decision-making declined
    as well. Cumulative comparative and historical evidence has documented that along
    with increases in educational levels and the greater mobility of persons to new
    expanding economic opportunities, the size of families declines, individual responsibilities
    for making decisions about marriage increases, and, in turn, the roles of women
    and men in and out of marriage change. Altered gender roles do not necessarily
    imply "improvement" in the status of women vis-a-vis men; the shift toward greater
    "equality" between men and women is by no means uniform. Despite increases in
    societal level economic opportunities, the growth in women''s educational attainment
    and occupational achievement, and the shift away from traditional sources of status
    and authority, the status of women within households and families, and in relationship
    to their husbands, does not always increase.


    The importance of changing autonomy for women in the reduction of control over
    women''s lives by the extended family in the process of development raises questions
    about the linkages among these processes in developing nations. What is the relationship
    between the changing roles of women in society and the extent to which women are
    involved in the choices to marry? How do the demographic processes of migration
    affect the autonomy of women? How does autonomy affect fertility behavior and
    contraceptive use? These core issues are addressed systematically and in detail
    in this volume.


    There is a growing recognition of the importance of changes in family and household
    structure as contexts for studying the determinants and consequences of demographic
    shifts in fertility and migration. Moreover, it has been increasingly argued that
    improving the status of women is an important policy direction in the attempt
    to facilitate the reduction of high fertility in developing nations. It has been
    clearly demonstrated that studies of migration in the rural areas of developing
    countries need to examine the role of women, not simply whether women migrate
    more than men, but how migration affects the status of women and what consequences
    migration has for autonomy and decision-making power.


    ### Dr. Linda Williams''s Research


    Dr. Linda Williams''s research is an innovative examination of these issues for
    one developing nation. She traces out the complex interactions among three critical
    processes--migration, fertility, and marriage--in a lucid and compelling analysis
    of rural areas in Central Java. She shows the contribution of women to the family
    economy in Indonesia, the activity of women in the labor force, and the control
    women have over household decisions. Her research focuses on the intergenerational
    dynamics involved in the marriage decision and the socio-demographic processes,
    especially migration, that influence the ability of women to control family decisions
    once they are married. She investigates the role of the extended family and the
    amount of contact maintained between the generations; and she tests directly the
    impact of women''s autonomy on the use of contraception and fertility. This study
    of the linkages among marriage, female autonomy, migration, and fertility in one
    setting is an important contribution to the demography of developing countries
    and to the understanding of development issues, particularly the changing role
    of women and families.


    Her research places these themes in the context of the relationship between population
    and development and the policies related to both processes. Moreover, she includes
    as an integral theme the examination of women in development processes. Her framework
    focuses on how women fare vis-a-vis other household or family members in making
    major household decisions. She carefully outlines the arguments that show that
    development processes may improve or weaken the status of women. She focuses in
    particular on the migration dimension. She convincingly argues against the view
    that the migration of women is insignificant and associational, particularly by
    showing how migration is related to the status of women.


    Dr. Williams addresses these issues in the specific context of the Indonesian
    province of Central Java. As in the examination of demographic processes in general,
    transitional countries like Indonesia can provide some of the richest insights
    about changes in the status of women within the community as a whole as well as
    within families. The members of over 500 households were interviewed in four villages
    in rural Central Java, with a focus on women and their husbands. These originally
    collected data are a rich and unique source of information that probe in-depth
    issues of family decisions, the status of women, migration, fertility and contraceptive
    use.


    ### Major Findings


    Several major findings emerge from the detailed analysis of these data:


    *   Some of the major predictors of decision-making power associated with marriage
    are as expected-parental education, years of schooling particularly for women,
    and exposure to life in a large urban center. There is some evidence, inferred
    from age and marital duration data, that there have been significant increases
    over time in the decision-making power of women in rural areas of Central Java.

    *   Residential mobility after marriage increases the status of the wife within
    her household, suggesting that women gain influence with their husbands through
    residential mobility. However, relocation beyond the borders of their villages
    loosens ties with the social networks of women and their decision-making power
    suffers. Thus, there is a balance between autonomy and the networks that affect
    that status and power of women within the household. Migration at or after marriage
    and the amount of contact maintained with parents on both sides of the family
    influence the amount of control exercised by women over family decisions. The
    more input into the decision to marry, the more control exerted by them in later
    household decisions as well.

    *   Contrary to expectation, women with high levels of status within their households
    were less likely to have ever used any form of contraception. Dr. Williams suggests
    that this finding might reflect responses to the sometimes coercive family planning
    program in Indonesia--women with higher status might be better able to resist
    outside pressure. So autonomy may under certain conditions result in the greater
    receptivity of women to innovative forms of fertility control, while under other
    conditions the increasing autonomy of women''s roles may result in the rejection
    of pressures from agencies to encourage contraceptive usage and fertility control.


    Important policy questions are raised by the analysis, particularly the negative
    response of women to family planning programs and to the general normative climate
    of family intervention. These findings challenge some accepted programs in developing
    nations. The results of this study reinforce the importance of the study of family
    contexts and the autonomy of women in the contraceptive usage patterns and fertility
    of rural women. They also point to the value of linking migration and fertility
    analyses in the investigation of issues of female autonomy.


    ### Methodology and Context


    These and other detailed findings are carefully documented by Dr. Williams using
    the special survey that she designed and the data she collected. The data were
    gathered as part of a 1985 survey of households in rural Central Java, supported
    in part by a Ford Foundation grant to Brown University''s Population Studies and
    Training Center. The survey was integrated into the fieldwork of another researcher
    who was examining issues of labor allocation and migration in these same rural
    areas. The results of that research project were reported in an earlier volume
    in our series--Philip Guest, Labor Allocation and Rural Development: Migration
    in Four Javanese Villages (Westview Press, 1989). Dr. Williams first presented
    the analysis of these data as part of her 1987 doctoral dissertation in the Department
    of Sociology at Brown University. Serving on her doctoral dissertation committee
    were Frances Kobrin Goldscheider, Chair; Alden Speare, Jr.; and Sidney Goldstein.
    This monograph represents a revision of that dissertation following a review by
    a committee of senior demographers at Brown University and an outside reviewer
    expert in the field.


    This volume is one of several in the Brown University Studies in Population and
    Development series published by Westview Press that have focused on various aspects
    of migration in developing nations. It is the first to connect in a systematic
    way the status of women, the decision to marry, fertility, and migration. And
    it carries on the tradition of fieldwork in less developed nations as part of
    the training and research apprenticeship provided by the Population Studies and
    Training Center at Brown University.


    In all, Dr. Williams has provided us with a carefully designed series of tests
    of some of the fundamental questions associated with population and development
    in developing nations. Her findings are not likely to be limited to the rural
    areas of Central Java but are applicable to large parts of the rural developing
    third world. Policy makers and planners as well as demographers and development
    experts, would benefit from a careful consideration of the implications of her
    analysis. Dr. Williams''s research reminds us once again of the importance of
    family and women in population processes and development.


    Calvin Goldscheider

