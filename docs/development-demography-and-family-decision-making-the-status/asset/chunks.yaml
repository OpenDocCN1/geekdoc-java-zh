    When the determinants of children ever born are examined, the effect of the intra-household
    status of the woman is found to disappear entirely. Data measuring the bivariate
    relationship between women''s decision-making power and their fertility are presented
    in [Table 7.10](#Ch07.xhtml_cap_lbl0033). Chi-square tests indicate that the association
    between the two variables is not significant (`p = .90`). Again, this runs counter
    to expectations and suggests that either the indicator of women''s status is not
    adequate, or that women''s decision-making power is simply not relevant to fertility
    behavior in the Indonesian context. Both may be true to varying degrees.^([8](#Ch07.xhtml_fn0032))


    It is also possible that the effect of women''s status on fertility in Indonesia
    is an indirect one, operating primarily through contraceptive use or non-use,
    or through a number of other variables to influence reproductive behavior. If
    so, however, the path through which it operates remains ambiguous. For example,
    women with higher levels of decision-making power are less likely to be ever-users
    of contraception, but more apt to state a preference for smaller families than
    are women with lower status. The indirect effects of status may therefore cancel
    one another out.


    Perhaps most salient is an issue that was raised in [Chapter 2](#Ch02.xhtml_ht0012).
    It has been argued that one problem with many analyses that focus on women''s
    status and fertility is that it is almost invariably assumed that women want to
    limit their childbearing, but that their husbands do not. While that is not assumed
    to be the case in this analysis, it is useful to examine the extent to which the
    reproductive goals of the spouses in this sample actually coincide. Results are
    presented in [Table 7.11](#Ch07.xhtml_cap_lbl0034). The data indicate that there
    is, in fact, very little disagreement between husbands and wives in Java as to
    their family size ideals. The majority of cases (261 couples, or 66.2 percent)
    fall somewhere on the diagonal, indicating that among almost two thirds of the
    respondents, there is exact agreement between the woman and her husband as to
    their reproductive preferences.


    Where disagreement does exist it tends not to be extreme, and the split is fairly
    even between cases in which men desire larger families than do their wives, and
    those in which women desire larger families than do their husbands. In 16.5 percent
    of the cases, men favor having more children than do women, while in 17.3 percent
    of the cases, the reverse is true. This suggests that the topic may be one that
    is often discussed, and that as a result, men and women often come to a shared
    understanding of what their reproductive targets will be.


    [TABLE 7.11:](#Figures.xhtml_bck_cap_lbl0034) HUSBANDS'' AND WIFES'' FAMILY SIZE
    IDEALS

    ![Image](Images/12.jpeg)


    Aside from the lack of association between the woman''s decision-making power
    and her fertility, most of the results of the other bivariate tests are as expected.
    There are, for example, significant inverse linear relationships between children
    ever born and the educational attainment levels of both women and men. Results
    are displayed in [Table 7.12](#Ch07.xhtml_cap_lbl0035).


    Similarly, marital duration is strongly associated with fertility (`p = .000;
    r = .678`). As the number of years a couple has been married increases, so does
    the number of children the woman has borne. This may be due not only to varying
    lengths of exposure to the risk of childbearing, but also to changes in family
    size preferences that have taken place over time. Data are presented in [Table
    7.13](#Ch07.xhtml_cap_lbl0036) below.


    As is evident from the data in [Table 7.14](#Ch07.xhtml_cap_lbl0037), variations
    in family size preferences are clearly related to the number of children ever
    born to the women in this sample. Whether because of rationalization or actual
    targeting, the association is both linear and positive (`p = .000; r = .347`).


    Also considered to be important in predicting overall fertility is the age at
    which women marry. Women who marry later are often thought to be less "traditional"
    than women who marry early, and women who marry later are exposed for shorter
    periods of time to the risk of childbearing. Since pre-marital sexual activity
    is not condoned in rural Java, the age at first marriage should be a particularly
    good predictor of fertility in that setting. Bivariate tests of association demonstrate
    that that is, in fact, the case ([Table 7.15](#Ch07.xhtml_cap_lbl0038)). The relationship
    between fertility and age at first marriage is significant and linear. Women who
    married later were found to have had fewer children than were those who had married
    earlier and vice versa (`p = .000; r = .194`). The average age at marriage among
    women who had had one or two children was 18.8, while the average age at marriage
    of those with seven or more children was considerably less, 15.7.


    [TABLE 7.12:](#Figures.xhtml_bck_cap_lbl0035) MEAN CHILDREN EVER BORN BY EDUCATION
    OF HUSBAND AND WIFE


    | Husband''s Years of Schooling | CEB | Wife''s Years of Schooling | CEB |

    | --- | --- | --- | --- |

    | | | | |

    | * * * | | | |

    | 0 | 5.0 | 0 | 4.9 |

    | 1-3 | 4.8 | 1-3 | 4.2 |

    | 4-6 | 3.5 | 4-6 | 3.6 |

    | 7+ | 3.8 | 7+ | 3.5 |

    | Number of cases | 394 | | 394 |


    Overall mean=4.1; both associations significantly linear: .000. Correlations =
    -.141 and -.177 respectively (Full sample). Correlations = -.122 and -.152 (Restricted
    sample).


    [TABLE 7.13:](#Figures.xhtml_bck_cap_lbl0036) CHILDREN EVER BORN BY MARITAL DURATION

    ![Image](Images/13.jpeg)


    [TABLE 7.14:](#Figures.xhtml_bck_cap_lbl00037) CHILDREN EVER BORN BY IDEAL NUMBER
    OF CHILDREN

    ![Image](Images/14.jpeg)


    ## Multivariate Determinants of Children Ever Born](#contents.xhtml_bck_ht0059)


    When the variable measuring children ever born is regressed on the independent
    variables in a standard OLS regression, most of the results are as anticipated
    ([Table 7.16](#Ch07.xhtml_cap_lbl0039)). For example, larger family size preferences
    and lengthier marital durations are clearly associated with higher fertility among
    the women in this sample. These effects are strong and significant in all equations
    where they are introduced. Duration of marriage is a good predictor of children
    ever born for a number of reasons, some of which have already been discussed.
    Those married longest tend to be the oldest and most traditional, and least exposed
    to western values or non-traditional influences in general.


    [TABLE 7.15:](#Figures.xhtml_bck_cap_lbl0038) WIFE''S MEAN AGE AT MARRIAGE BY
    CHILDREN EVER B


    | Number of Children Ever Born | Mean Age at Marriage |

    | --- | --- |

    | * * * | |

    | 0 | 18.6 |

    | 1-2 | 18.8 |

    | 3-4 | 17.9 |

    | 5-6 | 17.4 |

    | 7+ | 15.7 |

    | * * * | |

    | Overall mean | 17.6 |


    [TABLE 7.16:](#Figures.xhtml_bck_cap_lbl0039) MULTIVARIATE DETERMINANTS OF CHILDREN
    EVER B (Unstandardzed Coefficients)


    | Independent Variable | Equation: 1 | 2 | 3 |

    | --- | --- | --- | --- |

    | Wife''s decisionmaking power | -.056 | .038 | .054 |

    | Ideal family size | n.a. | .241(***) | .319(***) |

    | Wife''s education | .060 | .047 | .012 |

    | Husband''s education | .060* | .053 | .041 |

    | Wife''s income (logged) | -.066 | -.031 | .010 |

    | Contraception (1=use, 0=no use) | n.a. | n.a. | 1,047(***) |

    | Marriage variables: | | | |

    | Age at marriage | .006 | .006 | .022 |

    | Union order | .435 | .378 | .255 |

    | Duration of marriage | .222(***) | .209(***) | .215(***) |

    | Constant | -.168 | -1.096 | -2.503 |

