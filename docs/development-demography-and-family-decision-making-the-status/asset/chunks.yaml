    选取样本的地区被选中，是因为其特征是以水稻农业生产为主的系统，而且它在地理上并不孤立。这两个特质对于参与调查的其他研究人员而言都是必须的，但缺乏地理孤立性对本调查也同样重要。


    预计通往城市中心便利性越好的村庄，往返这些中心的流动率越高（Shaw, 1975），因此与没有类似通达性的村庄相比，它们接触到更多“现代”价值观和态度的机会越大。这些价值观态度涉及女性的角色和地位、避孕、家庭规模偏好以及对婚姻安排程度的看法。


    根据这些标准选定的县（`kabupaten`）是 `Sukoharjo`。（参见[图 4.1]）。中爪爪由 29 个这样的 `kabupaten` 组成，`Sukoharjo`
    似乎最符合项目组织者的需求。对于本研究而言，鉴于其靠近城市中心 `Solo`，这是一个合适的选择。为了满足其他研究人员的需求，所选村庄必须被归类为农村，且必须是以水稻种植为主的地方。选择这些村庄是为了尽量减少主要农业类型、城市设施通达性以及由此产生的流动性的差异，但同时也旨在增强农业系统内部商业化程度的变异。


    ![FIGURE 4.1: MAP OF JAVA SHOWING LOCATION OF PROVINCES AND KABUPATEN SUKOHARJO](img/4.jpeg)


    考虑到这些限制，`Kabupaten Sukoharjo` 的 167 个村庄中有 83 个被认为适用于大型实地项目。24 个村庄因为被归类为城市而被排除，而该县南部和部的许多村庄被排除是因为其山地地形很大程度上阻止了水稻（`sawah`）的生产。由于其他研究人员的限制，选出的村庄倾向于聚集在地区的北部和中部。随后，对所有可能的村庄“根据农业商业化衡量进行排名，并从每个排名的每个四位数中随机选择一个村庄”（Guest,
    1987:56）。


    最终选出的四个村庄来自整个 `Sukoharjo` 内的三个不同乡（或 `kecamatan`）。（参见[图 4.2]，第 66 页）。其中两个村庄 `Mandan`
    和 `Kenep` 位于 `Kecamatan Sukoharjo` 境内。它们都位于县首（也称为 `Sukoharjo`）的西南方。`Mandan` 距离中心大约两公里，`Kenep`
    大约七公里。第三个村庄 `Jombor`不在 `Kecamatan Sukoharjo`，但紧邻县首。它位于 `Sukoharjo` 正北，属于 `Kecamatan
    Bendosari`。最后，`Wonorejo` 位于 `Kecamatan Polokarto`，位于 `Sukoharjo` 县首东北方向约 13 公里处。


    ### 家庭选择


    选定村庄后，在每个村庄内选了 160 户。虽然目标是尽可能扩大样本量，但预算限制最终决定了目标户数。


    家庭被定义为“一组一起吃饭和做饭的人，或者在过去五年内曾这样做过的人们……[该]定义基于之前的研究，被认为是爪哇人社会中的一个经济单位”（Guest, 1987:
    84）。由于户数最少的村庄有 696 户（`Kenep`），而户数最多的有 788 户（`Mandan`），村庄之间的户数差异不大。因此，没有必要对样本进行加权。目标人口包括四个村庄的所有家庭。


    使用村庄登记册来选择家庭。这些登记册包含了所有成员成员。主要职业、受教育程度以及他们所拥有的消费品的信息较不完整。这些列表用于人口普查统计、村庄统计报告以及身份证卡的发放，因此通常被认为维护具有合理的准确性。


