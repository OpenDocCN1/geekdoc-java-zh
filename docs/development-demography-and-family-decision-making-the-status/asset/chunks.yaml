  trans: '

    # 人口增长与经济发展


    人口增长与经济发展之间关系的性质远非明确。自 18 世纪末托马斯·马尔萨斯（Thomas Malthus）首次对人口增长对生活水平的影响表示担忧以来，围绕这一主题的问题在学者中引发了间歇且有时是激烈的辩论。马尔萨斯认为这两个过程之间存在一种负反馈机制，具体如下：

    1) 生活水平的提高会加速人口增长（很大程度上归于初婚年龄的提前），

    2) 这种增长将导致农业劳动的边际收益递减，以及

    3) 最终将是人口和经济的双重下降。


    “人口如果不加抑制，将按几何级数增长。生存资料仅按算术级数增长。对数字略有了解的人就能看出，与后者相比，者的力量是多么巨大”（Malthus, 1959:
    5，最初发表于 1798 年）。


    他的批评者包括马克思和恩格斯等人。根据恩格斯的观点，“即使我们假设与劳动力增加相关的产增加并不总是与后者成比例，仍然存在第三个因素——尽管经济学家们从未认为其重要——即科学，科学的进步与人口增长同样无限制，且至少同样快速”（Engels,
    引自 Meek, 1971: 26）。列宁也表示赞同，并指出“收益递减规律完全不适用于技术不断进步和生产方法不断变化的情况；它只在技术保持不变的情况下具有极强的相对性和局限性”（Lenin,
    引自 Meek, 1971: 26）。


    在欧洲背景下，历史证明了马尔萨斯是错误的，因为技术进步和伴随工业化的制度变迁有助于确保他一些更为严酷的预言不会成真。此外，尽管在 19 世纪和 20 世纪的大部分时间里生活水平提高、死亡率下降，但该期间的人口增长率并没有爆发。相反，在
    1880 年至 1910 年间，生育率在各种社会环境中和广泛的社会、人口及经济条件下急剧下降。一旦开始，生育率的下降既快速又是不可逆转的（van de Walle
    and Knodel, 1980），结果是，对人口增长的担忧以及与其经济发展关系的辩论在随后的几十年里很大程度上平息了。


    ## 兴趣的复兴


    然而，从 20 世纪 50 年代以来，这两个过程之间关系的兴趣再次出现。发达国家与不发达国家之间巨大的收入差距变得异常明显，尽管发展中国家（尤其是中收入国家）的经济增长令人印象，但这些收益往往被人口增长的速度所抵消。结果是，不发达国家（LDCs）人均收入和整体生活水平的未能赶上工业化世界的发展，人口快速增长再次被许多人视为发展的障碍（Coale
    and Hoover, 1958; van der Tak et al., 1979; Merrick et al., 1986）。


    在发展中国家内部，人口快速增长的问题不仅限于工业化部门：它们在农业部门往往尤为严重。生育率通常在农村地区和最贫家庭中最高。随着土地被不断分割，结果往往是向外迁移，或者是对越来越小的土地进行更密集的耕作。在后者的情况下，“资源分配得太薄，无法进行维持生存之外的‘投资’，例如教育，这可以帮助这些家庭摆脱贫困”（van
    der Tak et al., 1979: 21）。因此，迁移频繁成为首选的方案。


    ## 迁移与城市化


    然而，迁移并非没有成本。越来越多的证据表明，“人口分布问题和农村向城市的迁移问题正成为政府关注的前沿。在联合国 1978 年调查的 116 个不发达国家中，94%的国家对其人口分布模式表示了某种程度的不满，约
    60%的人认为这些模式极不理想意”（Goldscheider, 1983: 4）。因为目的地的经济增长往往无法跟上迁移流的速度，结果通常包括失业、就业不足、住房短缺和基础设施不完善。当城市劳动力市场无法吸收流入的农村迁移人口时，可能会出现政治、社会、环境和经济上的动荡。“这让穷人陷入了令人沮丧的选择：要么面对人均土地面积萎缩而加剧的农村贫困，要么过着痛苦的城市生计”（Beier,
    1976: 18）。


    ## 技术乐观主义


    然而，由于科学进步和社会环境使欧洲逃脱了马尔萨斯预言的经济和人口衰退，仍有许多作者声称技术也将消除今天不发达国家面临的人口相关问题。该观点的支持者认为，只要有时间，市场的存在将允许人口、资源和环境的重新调整。他们认为，尽管人口增长最初可能会产生不平衡，但人类的智慧将再次提供修正。“由于更大的‘需求’，额外的孩子最终会导致比其他时候更多的发明，反过来，这可能使人们更努力地发明新方法来减少工作量。（在天堂里，没有人会有动力去发明任何东西）”（Simon,
    1977: 201）。如果修正没有发生，那是因为市场受到限制，因此无法激发足够的创新和创业精神（Simon, 1981; Merrick et al., 1986）。


    西蒙的观点长期来看可能是正确的。但在在此，贫富之间仍然存在的差距是巨大的。

    '
- fmt: '

    ## The Issues in Context


    In this research, these subjects are addressed in the context of the Indonesian
    province of Central Java. Java is an appropriate setting for a number of reasons.
    First, depending upon the source of information cited, the status of women within
    the country as a whole is listed as anywhere from quite high to very low. Whereas
    the Indonesian Department of Information (1968:5) claims, for example, that "the
    Indonesian Woman of Today has become the Equal of the Indonesian Man in every
    aspect, in every field," the 1988 "Country Rankings of the Status of Women" compiled
    by the Population Crisis Committee, place Indonesia among countries in which the
    status of women is "very poor." The position of women, both within the society
    and within the family, thus warrants further scrutiny.


    Second, despite economic advances, thought by many to be the surest catalyst for
    curbing rapid population growth, Indonesia''s population was increasing at a rate
    of over 2.0 percent as recently as 1985. Although government efforts aimed at
    improving access to contraception, and lowering family size preferences and ultimately
    fertility, have intensified dramatically over the years, the reproductive targets
    of individuals still remain at four or five children per couple throughout much
    of the country (McNicoll and Singarimbun, 1983).


    In Java, population growth and population density have been considered serious
    problems for some time. As of 1980, roughly 62 percent of all Indonesians were
    living on that island, yet the land on which they were enumerated comprises less
    than 7 percent of the country''s total area (Indonesia, Biro Pusat Statistik,
    1982; Leiserson et al., 1980). If the status of women is linked to lower levels
    of fertility, the mechanisms through which that process might operate in Java
    should be examined.


    Third, although individual concerns in Indonesia remain secondary to the needs
    of the family and the broader community, a certain amount of control has been
    shifting to individuals in decisions that affect them directly, including those
    surrounding marriage and the process of mate selection. Similar realignments in
    the balance of decision making power are occurring throughout much of the rest
    of the developing world, as children in a variety of social settings can now look
    forward to having considerable input into, if not total control over, decisions
    regarding the selection of their future husbands and wives. As is the case in
    much of the research on fertility and mortality transitions, it is the transitional
    countries like Indonesia that can provide some of the richest information about
    such changes in the marital decision making process and the current state of its
    evolution.


    As a consequence, the first topic for analysis in this research involves variations
    in the level of control Indonesian parents are able to exercise over the choice
    of spouse for either a daughter or a son. The focus is on the intergenerational
    dynamics surrounding the marriage decision, as well as on gender differences in
    perceptions of power in the process of mate selection. These issues are important,
    not only in their own right as part of the family transition process, but also
    because a woman''s input into the spousal selection process has been linked to
    her ability to control later household decisions as well (Conklin, 1981).


    A number of predictors of women''s autonomy are examined in the second stage of
    the analysis. Of particular interest is the impact of migration or residential
    mobility following marriage upon a woman''s power to influence decision outcomes.
    Does the relocation of one spouse or the other, or both, affect the amount of
    input a woman has, compared to that of her husband and other household members,
    in determining important household matters? If so, is the timing of the move important?
    In addition, does the level of contact that is maintained with the parents on
    either side of the family affect this relationship?


    In the final portion of this study, the importance of the wife''s autonomy is
    assessed as it relates to specific outcomes, in this case, contraception and fertility.
    Overall, it is expected that changes in household residence that allow the couple
    to remove themselves from direct supervision and control by their parents should
    produce increases in status for women within the household (intra-household status),
    and that high levels of female intra-household status should result in increases
    in contraceptive use and decreases in overall fertility, compared to cases in
    which women''s status within the household is very low.


    It is also expected that women who have high extra-household status, or status
    compared to individuals outside the household, will be more apt to use contraception
    and have lower overall fertility than will those who have low extra-household
    status. Although migration is also likely to enhance status on this dimension,
    measures of this type are introduced primarily as controls; the connections between
    migration and extra-household status are already documented.


    The goal of this research is not to investigate all of the determinants of family
    size or family planning utilization in Indonesia; nor is it intended as a study
    of migration and fertility. The analysis focuses on three specific topics:


    1. The intergenerational dynamics involved in the marriage decision and how men
    and women fare differently in the process.

    2. The continued influence of the extended family, often varying as the result
    of migration or residential mobility as well as by the amount of contact that
    is maintained with the parents on both sides of the family, upon a woman''s position
    within the household after she is married.

    3. How these factors in turn affect contraceptive use and fertility, both of which
    are central to family and community life in Indonesia.

    '
