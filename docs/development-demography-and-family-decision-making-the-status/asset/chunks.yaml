    同样引起关注的是女性在家庭中的地位、其避药使用以及她们最终子女数量之间的关联。正如引言章节中所讨论的，现在人们普遍认为，通过提高这些发展中国家女性的地位，可以实现生育率的大幅下降。考虑到女性的地位可以在至少两个层面进行概念化，本研究在尝试预测避药使用和生育率时，主要关注家庭内部的地位，次要关注不同家庭间女性之间的地位。在这两种情况下，决策结果都为操作性地测试所关注的决策过程提供了手段。


    在研究家庭内部地位、避孕和生育行为时，会将女性的地位与其决策单位中的伴侣地位进行比较；本质上，任何一方影响最终决策的能力被认为取决于双方的地位（Knodel
    and Van de Walle, 1979）。在近期的分析中，有人认为，更平等的关系比妻子通常必须顺从丈夫的关系产生更高水平的避孕（Mason, 1971）。例如，Dyson
    和 Moore (1983) 得结论认为，女性在家庭内的自主性对生育控制至关重要，而且“可能是理解整个印度人口状况的单一最重要的因素”（Dyson and
    Moore, 1983:54）。


    Hogan 等人 (1985) 发现，认同家庭内部男女平等关系重要性的更现代观点的泰国女性，其“子女数量进展率明显低于”传统的女性（Hogan et al.,
    1985:28）。他们认为，这在很大程度上是因为这些更解放的女性对家庭规模的期望较低，且避孕使用率较高。这些效应也排除了“家庭现代性”的影响，并且在衡量调查女性性解放程度的量表极端处尤为强烈。


    在家庭内部地位和生育率研究中，一个往往被忽略的因素是两个伴侣之间存在潜在利益冲突的重要性。如果没有冲突，许多关于权力和生育结果的讨论将变得无关紧要。Youssef
    (1982) 引用了避孕研究中固有的其他假设，这些假设可能会使调查变得复杂。例如，假设人们有限制生育而非增强生育的愿望，女性希望采取避孕但主要障碍是不愿配合的丈夫，以及在女性控制自己的生育之前必须做出共同决定。在后一种假设的情况下，在避孕并非免费的领域，资源控制的差异显然会起作用，而且任何一方在另一方不知情的情况下执行策略的能力也无疑会发挥作用。（参见
    Beckman (1983)）。因此，本研究还考察了丈夫双方生育偏好之间的差异。


    幸运的是，研究女性地位的第二个维度（即通过与社区其他人进行衡量的地位）在增强生育控制方面的作用，并不涉及许多的限制性假设。有人认为，地位较高的女性更有可能尝试调节自己的生育，因为她们获得了对孩子以外的商品的向往（Dixon,
    1975），并且她们更有可能有效地做到这一点，因为她们拥有实现自己愿望的知识（Curtin, 1982）。教育、职业、家庭收入和女性的总体社会经济地位通常在这一主题的分析中占据重要位置。


    教育可能是两个维度上最常提及的女性地位指标，已被证明可以通过多种机制对生育产生反向影响。例如，研究发现它对婴儿和儿童死亡率有负面影响，对女性结婚年龄有积极影响，并增加了使用避孕的可能性（Cochrane,
    1979）。此外，受过高教育的女性往往比其受教育程度较低的同伴更容易获得资源和知识，因此可以增强她们在家庭中的自主性（Mason, 1985）。Caldwell
    (1980) 是强调教育对影响生育水平重要性的学者之一。他的观点是，随着教育的普及和现代化的进行，夫妻的基本需求和经济安全应该与高生育率脱钩，届时生育控制应成为双方的共同效用问题。


    在女性获得收入并被允许对那笔钱拥有至少控制权的情况下，家庭内部资源控制差异将不再是限制获得避孕药的因素。此外，与低社会经济阶层的女性不同，上层或中产阶级的女性不应该“不得不依靠生育——这一女性唯一的与性别相关的资产——来减轻自己的无力感和异化感”（Safilios-Rothschild
    1982:121)。


    这些变量都是错综复杂的。在发展得最充分的地方，以及女性能够接触教育和货币经济的地方，预计她们对孩子以外的商品和除生育以外的活动的向往将更加明显，她们能够比没有类似途径的女性更好地采取自己的愿望。此外，随着发展的进行和家庭日益日益核心化，扩展亲属对家庭的影响应该会减少。


    ## 总结


    尽管许多作者认为工业化和整体的社会经济发展可能提高女性的整体地位（无论是在家庭内部还是整个社会），但文献中已经讨论了大量相反的证据。尽管人们对社会演变中女性问题重要性的意识终于开始增长，但对这些问题的严重关注才刚刚出现。在本章中，介绍了了有关女性社会地位与不同社会经济发展水平之间关联的问题，并提到了发展、迁移与女性角色和地位之间可能的联系。还简要讨论了女性地位反过来如何影响避孕和生育结果。

