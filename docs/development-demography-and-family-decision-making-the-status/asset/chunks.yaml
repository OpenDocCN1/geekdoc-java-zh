    | Total | 78,228 | 100% | 2,887,867 | 100% |


    Data are from Pusat Jaringan Informasi & Dokumentasi Program, KB Nasiorial (1985),
    pp. 129-130.


    [TABLE 7.4:](#Figures.xhtml_bck_cap_lbl0027) CONTRACEPTIVE METHODS CHOSEN FOR
    FIRST USE BY VILLAGE!


    ![Image](Images/9.jpeg)


    Information about the contraceptive choices made by the couples in this sample
    are presented in [Table 7.4](#Ch07.xhtml_cap_lbl0027). The data indicate that
    the IUD is the most popular first-use method, followed closely by the pill. Use
    of injections, female sterilization, traditional methods, and abstinence is somewhat
    less common, and methods oriented specifically toward males do not tend to be
    widely accepted as first-use methods.


    The relative popularity of many of the different family planning services is fairly
    consistent across villages. Only in Wonorjo are there more pill acceptors than
    IUD users, and IUD use is common there nonetheless. The only method that is used
    fairly frequently in one village and hardly at all elsewhere, is female sterilization.
    Sterilizations among women accounted for 13.2 percent of all method utilization
    in Jombor, compared with only six percent in Kenep, 2.6 percent in Manden, and
    none at all in Wonorjo.


    The evidence thus suggests that the government''s programs have met with some
    success in all four villages. Of the 58.9 percent of the women who claimed to
    be ever-users of birth control, only 8.2 percent used traditional methods (including
    abstinence) when they first used contraception.


    [TABLE 7.5:](#Figures.xhtml_bck_cap_lbl0028) PERGENT DISTRIBUTION OF CONTRACEPTIVE
    USE BY EDUCATION OF EACH SPOUSE!


    ![Image](Images/10.jpeg)


    ## Variables Associated with Contraceptive Use


    ![Image](#contents)


    Not surprisingly, many of the variables commonly cited as predictors of contraception
    are also related to ever-use. For example, there is a significant association
    between educational levels of spouses and whether or not used (See [Table 7.5](#Ch07.xhtml_cap_lbl0028)).
    As the number of years of schooling completed by husbands increases, so does the
    likelihood that she will use. Similarly, the size of community the wife lived
    prior to marriage is also associated. A full 92.9 percent of those who lived in
    cities were ever-users, compared to only 57.8 percent of those who lived in rural
    places.^([2](#Ch07.xhtml_fn0026))


    [TABLE 7.6:](#Figures.xhtml_bck_cap_lbl0029) PERCENT DISTRIBUTIONS OF CONTRACEPTIVE
    USE BY FREQUENCY OF DISCUSSION BETWEEN SPOUSES


    | Discussion Frequency | Contraceptive Users | Row % | Contraceptive Non-Users
    | Row % |

    | --- | --- | --- | --- | --- |

    | | | | | |

    | * * * | | | | |

    | Never | 16.5 | 27.1 | 63.4 | 72.9 |

    | Not often | 18.2 | 72.4 | 9.9 | 27.6 |

    | Somewhat often | 38.5 | 75.4 | 18.0 | 24.6 |

    | Often | 21.2 | 84.5 | 5.6 | 15.5 |

    | Very often | 5.6 | 72.2 | 3.1 | 27.8 |

    | Totals | 100.0 | | 100.0 | |


    Chi-square = 93.03; d.f.=4; significance = .00


    Also correlated with contraceptive use is the desire for additional children.
    Among women in this sample, contraceptive use was much more common among couples
    who wished to have no children than it was among those who hoping to continue
    childbearing. Although 49 couples wanting additional children reported having
    used a method of family planning at some point, most contraceptors were those
    who wished to prevent rather than space births. Among ever-users of birth control,
    78.9 percent claimed to want no children, compared to 21.1 percent who hoped to
    continue childbearing.


    Equally important is whether or not spouses are able to communicate about family
    planning. In this survey, information was gathered about whether or not, and if
    so to what extent such conversations took place. As expected, bivariate tests
    demonstrate that more frequent discussions about family planning and birth control
    are positively associated with the use of contraception. Results are presented
    in Table 7.6](#Ch07.xhtml_cap_lbl0029).


    While the amount of discussion that takes place between spouses may be one indicator
    of inter-spousal dynamics, the variable of primary interest here remains the decision-making
    power of the woman. Given the information presented in Chapters [2](#Ch02.xhtml_ht0012)
    and [3](#Ch03.xhtml_ht0021), it was predicted that women with higher intra-household
    status would be more likely to use contraception than would women with little
    control over household decisions. Contrary to expectations, however, the relationship
    between ever-use of contraception and the woman''s status within the family, as
    measured by her input into decisions about how her income is spent, is not significant.
    Data are presented in Table 7.7](#Ch07.xhtml_cap_lbl0030).


    [TABLE 7.7:](#Figures.xhtml_bck_cap_lbl0030) CONTRACEPTIVE USE BY THE WIFE''S
    DECISION-MAKING POWER WITHIN THE HOUSEHOLD (Measured by Resource Control Variable)

