    | 5.0 | 51.4 |


    `Chi-square=6.46`; `d.f.=4`; `significance level=.168`


    [TABLE 7.8:](#Figures.xhtml_bck_cap_lbl0031) CONTRACEPTIVE USE BY MOBILITY AFTER
    MARRIAGE


    | Who Moves | Percent Ever-Using Contraception |

    | --- | --- |

    | Neither spouse | 28.1 |

    | Husband only | 59.0 |

    | Wife only | 60.7 |

    | Both spouses | 63.9 |


    `Chi-square = 14.54`; `d.f.= 3`; `significance level=.002`.


    Why this is the case is not certain. It does not, for example, reflect variation
    in the use of modern versus traditional methods of contraception at different
    levels of decision-making power. That possibility was explored but rejected. What
    is more likely is that women who have very little power within the household are
    also those most easily pressured by local leaders or other family members to use
    contraception. That possibility was briefly discussed in [Chapter 6](#Ch06.xhtml_ht0049).
    It is also conceivable that the women with the highest intra-household autonomy
    tend to be those with the most education and thus those most recently out of school.
    As such, they would almost by definition be members of the youngest cohorts and
    presumably those who have not yet reached their fertility targets. Where contraception
    is used primarily to prevent rather than space further births that explanation
    could have some merit.


    Finally, although it was expected that the mobility variables would operate primarily
    through the decision-making variable to influence contraceptive use, the bivariate
    association presented in [Table 7.8](#Ch07.xhtml_cap_lbl0031) suggests that there
    is also a direct relationship between post-marriage mobility and contraception.^([3](#Ch07.xhtml_fn0027)).
    Only 28.1 percent of the couples among whom neither spouse moved after marriage
    were ever-users of contraception, compared to 59 percent of those in which only
    the husband moved and 60.7 percent of those among whom only the wife moved. When
    both spouses relocated after their marriage, 63.9 percent of the couples reported
    having ever adopted some form of birth control. This is not surprising; in some
    of the cases in which neither spouse moved they were probably not yet co-residing,
    while in other instances, one spouse was likely to have joined the other by moving
    in with in-laws prior to marriage. In cases in which the wife was the only mover,
    contraceptive usage was just slightly higher than was true if the husband was
    the only mover. This is probably because in a few of the cases in which only the
    wife moved, she moved into an independent household established by her husband
    prior to their marriage.^([4](#Ch07.xhtml_fn0028))


    ## Multivariate Determinants of Contraceptive Use](#contents.xhtml_bck_ht0057)


    Given the complexity of the relationships between these variables, multivariate
    analyses were also undertaken to examine the determinants of contraceptive use
    among the women of this sample. Results are presented in [Table 7.9](#Ch07.xhtml_cap_lbl0032).
    Since the dependent variable (contraceptive use or non-use) is dichotomous, a
    logistic regression was estimated.^([5](#Ch07.xhtml_fn0029)). The data demonstrate
    that many of the associations described thus far are sustained even when ail of
    the other variables are controlled. For example, compared to cases in which neither
    spouse had moved, those in which only the husband or the wife had moved, as well
    as those in which both partners had moved, were all more likely to have ever used
    contraception. Again, couples in the reference category are probably those who
    were not yet sharing a residence at the time of the survey, or those.


