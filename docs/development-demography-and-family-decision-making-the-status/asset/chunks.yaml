- fmt: '

    Not only do couples work together as part of a family survival strategy, they
    also cooperate considerably in making household decisions. According to Bangun
    (1981: 129), they not only "share economic activities, mainly agricultural and
    handicraft, they also discuss all their problems." Women are allowed at least
    an equal say, if not more, into decisions regarding how important household matters
    will be settled, especially in decisions about the control of household resources
    (Mangkuprawira, 1981; Geertz, 1961). Middle-class women in particular have been
    found to engage in detailed discussions about birth control methods and family
    size ideals with their husbands (Hull, 1976).


    In family gatherings the wife has a say in the matter under discussion, no law
    can prevent her from becoming `mamak`, and she is often `kepala waris`. She manages
    her own possessions during the marriage..., and this in complete agreement with
    the `fikh`. She is greatly respected, especially when she is old... Modern influences
    and individualization have [at last] opened up large breaches in the traditionally
    closed way of life (Vreede-de Stuers, 1960:28).


    The ability of Indonesian couples to communicate and to discuss family matters
    is not without exception, however. Many women from the lower end of the socioeconomic
    scale never discuss topics such as contraception or family size preferences with
    their husbands. It has been argued that this is because they are too busy with
    daily activities and because they are socially isolated from organizations through
    which they could learn about and discuss family planning options (Mangkuprawira,
    1981; Hull, 1976). For the most part, however, the decision-making power of women
    within the Indonesian family appears to be relatively high on a range of issues.


    ## Women''s Status in Society in Historical Perspective


    The social position of women within the society as a whole is less clearcut. Some
    writers contend that the status of women in the broader community is relatively
    high, especially when compared to that of women in other Islamic countries (Bangun,
    1981). Others maintain, however, that the power of Indonesian women does not extend
    far beyond the walls of their own households.


    In public and political affairs..., the village women do not play a leading role,
    and, although female landholders have the same voting rights as men, they are
    usually not interested in such matters, preferring to send sons or brothers as
    their representatives to village meetings (Koentjaraningrat, 1967:260-261). Deciding
    which elements within the historical context have most directed the course of
    the evolution of women''s social position has also been a matter of much debate.
    According to governmental reports, women have played important roles in Indonesian
    political life since before the introduction of the Islamic religion and Dutch
    colonial rule. "The history and literature of Indonesia show how high the position
    and how great the role were of women during the periods of kingdoms in Indonesia"
    (Indonesia, Department of Information, 1968:7).


    Under `adat`, or the customary law of the various regions of the country, the
    position of women within society was viewed as no different from that of men,
    and women were frequently found in positions of military and political leadership.


    Some writers have argued that it was with the strengthening of Dutch rule and
    Islamic law that the status of women within the country began deteriorating. According
    to their view colonial policies were highly disruptive to the economy and the
    social structure in general, and the introduction of the Islamic religion, which
    has always officially "regarded women as socially inferior to men" (Vreede-de
    Stuers, 1960: 46), played a major role in undermining the social position of women.
    Although it has been argued that women in Indonesia have suffered from fewer limitations
    than have those from cultures in which `purdah` is followed conscientiously, by
    the turn of the century the position of women within Indonesian society "had become
    anything but enviable" (Vreede-de Stuers, 1960:47).


    On the other side of the argument are those who believe that rather than being
    detrimental, the introduction of Islamic law actually helped bring about improvements
    in the condition of women as individuals within Indonesian society. Proponents
    of this view argue that while `adat` allows for sexual equality in home and society,
    the needs of the individual still remain secondary compared to those of family
    and community. They contend that the introduction of Islamic law precipitated
    improvements in the situation of individuals (both male and female) by teaching
    them to "free themselves from the family group" (Vreede-de Stuers, 1960:41).


    They acknowledge that the situation of women did deteriorate to a point at which
    women became inferior to men, but suggest that this was the result of a combination
    of factors, most of which were unrelated to the growth of Islam. The relaxation
    of traditional customs, the influx of modern ideology and social change, as well
    as women''s "ignorance of their rights according to the `fikh` were all seen as
    contributing to the downturn in women''s status (Vreede-de Stuers, 1960:41). While
    a certain amount of controversy remains as to which factors have been most responsible
    for determining the roles women are expected to play in the Indonesian family
    and society, it is clear that the two legal systems in Indonesia have been among
    the forces central to the process.


    ## Women and Law

