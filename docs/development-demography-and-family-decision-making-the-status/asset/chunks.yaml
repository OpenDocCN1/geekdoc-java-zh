    # 影响生育的因素](#contents.xhtml_bck_ht0058)


    * 在 .10 水平上显著；** 在 .05 水平上显著；*** 在 .01 水平上显著：显著性双侧检验。


    (a) 参考组——那些在 16-25 岁之间结婚，且在结婚前已开始与一方父母同住的人。人们认为，他们也可能是那些结婚最早的夫妇，因此可能来自年龄最年长的人口群体。然而，通过均值检验发现事实并非如此。未搬迁过的配偶的结婚年龄与其他流动类别的配偶相比没有显著差异。


    然而，构成不同流动类别的夫妻在妻子婚前所受的教育程度和居住地规模方面，各组之间存在显著差异。在婚后双方均未移动的情况下，发现妻子平均仅接受了 3.2 年的教育。当只有丈夫或妻子一人移动时，妻子的平均受教育年限为
    3.5 年；而在双方都移动的情况下，女性通常平均接受了 4.5 年教育。这可能是为什么教育变量在多变量分析中减弱并变得不显著的原因之一。在控制其他变量时，丈夫或妻子的受教育程度都无法成功预测避孕药的使用或不使用。


    表格 7.10: 按决策权力水平划分的出生子女数 按照决策权力水平划分的出生子女数 [资源控制，受限样本]![Image](img/11.jpeg)


    在衡量妻子婚前社区规模的变量中也观察到了类似的模式。根据我们的样本，在双方婚后均未移动的结合关系中，每位女性根据定义在婚前都生活在农村地区。在双方都移动的结合关系中，女性显然更有可能居住在大型城市中心。与教育变量一样，在控制其他变量时，居住地变量也无法预测避孕药的使用或不使用。


    丈夫之间之间家庭计划对话的频率对预测避孕药的使用仍然非常重要。家庭计划问题讨论得越频繁，夫妻在婚姻期间使用某种避孕措施的可能性越大。


    出不意外的是，对增加孩子的意愿也是避孕药使用的一个显著预测因素。想要继续生育的女性比那些想要更多孩子的女性更不太可能使用避孕药。这再次表明，家庭计划服务在希望完全停止生育的女性中尤为受欢迎。


    考虑到过去的研究，样本中女性较高的收入与较低的避孕使用率相关，这有些令人惊讶。人们经常认为，额外的资源通常让女性对家庭决策（包括与生育相关的决策）有更多的控制权，并在她们必须购买时提供获得避孕措施的手段。然而，在印度尼西亚，除了“向大多数诊所用户收取的注册费”外，避孕接受者长期以来通过政府的家庭计划获得免费服务（McNicoll
    and Singarimbun, 1983:84）。


    同样明显，收入和实际生育率在世界许多地区呈正相关（Mueller and Short, 1983）。家庭收入越高，他们负担得起的孩子越多，反之亦然。正如已经观察到的，如果中爪哇的孩子被视为增加家庭财富的来源，如果夫妇能够负担得起增加一个孩子的初始投资，他们就不可能使用避孕药^(6)。在这种背景下，收入与曾使用过避孕药之间存在负关系最合理的解释可能是
    McNicoll and Singarimbun (1983) 提出的观点。他们认为，爪哇收入最低水平的人群最可能使用避孕药，因为：1) 他们特别容易受到马尔萨斯压力结合的影响；2)
    因为他们抵制政府减少生育率运动的能力有限。Freedman 等人（1981）发现收入对印度尼西亚避孕情况的影响具有曲线效应，并对低收入群体行为给了类似的解释。


    婚姻持续时间对避孕药使用的影响更为直观。在其他条件相同的情况下，夫妻结婚时间越长，他们曾使用过某种避孕措施的可能性越小。调查时结婚 15 年或更短的女性，曾使用过家庭计划方法的可能性显著高于结婚
    16-25 年的女性，而结婚时间超过 25 年的女性，反过来曾使用过的可能性显著更低。这并不意外。结婚时间最长的女性大多来自较早的出生队列，总体上更传统，而且比最近结婚的女性更不太可能成为家庭计划计划的目标。


    最后，衡量女性控制收入支出决策权力的变量对避孕药使用具有负面影响。这种影响独立于女性的婚姻持续时间及其对增加孩子的意愿（这些变量之前被认为是家庭内部地位与避孕之间可能的的中介因素）。此外，如果将样本按婚姻持续时间或胎数划分，以观察这种关联在这些变量的类别内是否发生变化，这种关系依然存在^(7)。正如女性收入变量的情况一样，女性决策权的负面影响可能反映了这样一个事实：家庭中权力最小的人也是最容易受到希望增加避孕使用率的政府官员影响的人。


