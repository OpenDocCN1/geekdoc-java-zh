    # Why Do They Go?


    Just as many of the questions concerning which women migrate have only begun to
    be addressed, information about why they move also remains inconclusive. In general,
    the reasons cited for female migration may be roughly divided into two groups:
    the economic, and the personal or social. Moves classified as economic include
    those related to finding or upgrading jobs, education, or income. Moves classified
    as personal or social include marriage migration, moves to attain greater independence,
    and associational moves. In many cases, categories within or between groups of
    economic and social motivations for migration may, of course, overlap.


    In a recent review of the literature on women and migration, movers motivated
    by the search for employment were found to outnumber those moving for any other
    reason. As a rule, studies in which economic influences were cited as determining
    women''s moves also outnumbered those in which women claimed to have moved for
    personal or social reasons (Findley and Williams, 1987). This was the case both
    within and across regions of the developing world, and it runs counter to the
    arguments of those who contend that women''s moves are much more commonly social
    or personal than economic in nature.


    On the other hand, associational moves were found to be the second most commonly
    cited moves among women in Asia and Africa, as well as among those moving from
    less developed to more developed countries; and they were only slightly less important
    among women from Latin America, the Caribbean, and the South Pacific. Marriage
    migration was ranked third in importance in Asia and Africa, a finding that was
    again roughly reflected in the other three regions (Findley and Williams, 1987).


    Whatever the primary cause, the migration decision is an extremely complicated
    one, often involving more than one motivating factor, and involving them to varying
    degrees. Evidence from Malaysia provides an interesting case in point. Historically,
    the reasons for women''s migration in that country were almost exclusively associational.
    When women moved it was either to be with their families or to marry. Otherwise
    they were expected to remain in the rural areas where they would presumably stay
    out of trouble, remain virtuous, and provide agricultural and household labor.
    Parents thought that if girls were to migrate to the city without supervision
    they would go astray and subsequently have trouble when they entered the marriage
    market. At the same time, there were virtually no jobs for any but the most highly
    educated young single women in the urban centers (Khoo and Pirie, 1984).


    Recent developments in both urban and rural sectors have begun to produce significant
    changes, however. New labor-saving technology now allows girls to stay out of
    agriculture and in school longer than was previously possible, and if they are
    able to get enough education in the rural areas, they may consider continuing
    their schooling in the city. In some cases they are also able to attain the skills
    necessary for formal sector employment (Khoo and Pirie, 1984).


    At the same time, girls in the rural areas now see local traditions being challenged
    by the spread of modernization, and many of them have begun to move to the city
    to escape the restrictions of the countryside. When they go, they go seeking greater
    individual freedom and economic advancement. Although others would prefer to stay
    and work in rural locales, many of them also feel compelled to accept work in
    an urban center because no viable alternatives exist for them in their places
    of origin. The motivation for that group is therefore more economic than social
    in nature (Ariffin, 1984).


    In Thailand, push and pull factors have also combined to influence the migration
    process. There, associational considerations and potential employment constitute
    the strongest pulls, while poverty, droughts, and offseason unemployment constitute
    the pushes (Arnold and Piampiti, 1984). As in the case of Malaysia, as rural traditions
    are being challenged, levels of education rise, and women''s participation in
    the non-agricultural labor force begins to increase, migration to urban areas
    increases as well. Inadequate schooling and employment opportunities, along with
    unsatisfactory living conditions in the rural areas, provide a further impetus
    for rural out-migration (Piampiti, 1984).


    Throughout the developing world, those who move and particularly those who move
    as part of a family strategy, often have little to say in making the final migration
    decision. In Korea, for example, many young girls are sent to Seoul after primary
    school or junior high school; some are sent to get additional schooling in the
    city, with the idea being that they will eventually make more money as a result
    of that investment, while others are sent into the job market immediately. According
    to Huang (1984), migrants who have some control over the decisions regarding their
    moves claim to go in search of improved skills, to find out more about life in
    the city, to get away from life in the village (especially the difficult agricultural
    work), or to escape parental controls. Whatever their stated objectives, however,
    most still go under parental constraints, as many are sent to live with relatives
    who are expected to keep an eye on them.


    The situation in Indonesia is very similar (Hugo, 1981). There, parents and other
    family members have considerable input into the migration decisions affecting
    both females and males, although control over daughters is particularly strict.
    Most moves are undertaken to improve the general well-being of the group, and
    the families are expected to provide adequate funds to help the migrants get started.
    As is the case elsewhere, wealthier families are better able to finance moves
    covering longer distances and longer durations, and as a consequence, they tend
    to receive a higher rate of return on their investment.


    Given the information presented to this point, it is clear that those who view
    the migration of women as generally insignificant and largely associational are
    apt to underestimate what is potentially a very complex process. More attention
    to the general topic of women and migration is therefore certainly warranted.
    One of the most central questions of this research has yet to be addressed, however;
    that is, how is migration related to the status of women, particularly the status
    of women within the household?


    # Migration and Status

