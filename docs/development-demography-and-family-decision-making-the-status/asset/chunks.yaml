    # 1. Data not presented.


    In some cases it became apparent during the survey that "ideal" meant different
    things to different women, however. For example, a woman with two children might
    want three, state that three is ideal, and claim to want one more. Another woman,
    also with two children, might claim (1) that two are ideal. (2) that she does
    not want to stop childbearing, and (3) that she would like to have two more. It
    therefore appears as though the publicized ideals of the family planning programs
    are occasionally cited as ideal by women when their own preferences do not mesh
    with the official line.


    The mobility variables are not divided by mobility before and after four years
    of marriage as they were in the chapter on decision-making power within marriage.
    It was expected that the timing of the move would be relatively unimportant in
    determining whether or not contraception was used, and that was found to be the
    case in preliminary analyses.


    Refer to Chapter 6 for a review of the mobility patterns that characterize the
    couples in this sample.


    (1) A `1` indicates that some form of birth control was utilized, while a `0`
    indicates that no use took place. (2) The variables introduced in this equation
    were found to explain 34 percent of the variance when a preliminary `OLS regression`
    was estimated.


    In this analysis, care must be taken in making too much of the association between
    income and contraception, however. Current income is utilized as a predictor of
    completed childbearing, a process that may have taken place several years earlier.
    Although current income is used as a proxy for previous earnings, the causality
    may run in either direction.


    Data not presented.


    Since this part of the analysis is restricted to women who earned a cash income
    in the year preceding the survey, 25 percent of the original cases have been excluded.
    They were not replaced using the method of mean substitution because that procedure
    would have required that we assume that women who earn no income have roughly
    average levels of decision-making power. Much of the information discussed thus
    far has suggested that that is probably not the case.


    Union order is controlled. And it is clearly opposite to the one intended by government
    planners.


