    greater equality of women''s status seems clear enough" (Goode. 1982:184).There
    are numerous reasons why the initial stages of industrialization and economic
    development were often much less helpful to the overall position of women in society.
    In the early industrializing United States, for example, and particularly once
    reforms made factory work largely the domain of the adult male, wives remained
    at home doing household chores, many of which had been previously shared by their
    husbands. In rural areas, women of necessity took on additional agricultural work
    when men began earning incomes elsewhere. Over time, the lines between women''s
    domestic work and men''s work in offices and factories became increasingly distinct,
    and what were already noticeable gender differences were heightened by the fact
    that while male labor brought in cash incomes, women''s work generally did not.
    As a result of "this differentially rewarded division of work, men came to be
    associated with the values of the industrial world - money, production, and power",
    while women "were linked to domestic values -love, nurturance, and self sacrifice..."
    (Lipman-Blumen, 1984:106).The limitations on the economic power of women that
    characterized the early stages of economic development and industrialization were
    confined neither to the United States nor to the western world in general, however.
    Prior to the establishment of a cash economy in most settings, work tends to be
    viewed simply as work; although tasks may vary by gender, one job is generally
    not seen as more or less valuable than any other. With the introduction of new
    systems of rewards for different types of production, however, only certain workers
    receive compensation in cash for the work they do. As a result, their labor becomes
    more highly valued than that for which there are no cash payments, and those who
    bring home cash earnings become elevated in status above those who do not (Taylor,
    1985).In a variety of cultural, economic, and social settings, women have continually
    failed to share fully in the benefits of industrialization, despite the introduction
    of specific programs aimed ostensibly at improving overall conditions in the target
    areas. Women''s issues per se have been largely neglected since colonial and early
    post-independence periods, and until recently very little if any attempt has been
    made to integrate women into the broader development picture. While policy-makers
    have focused considerable attention on rural improvements, growth in education,
    industrialization, and even in some cases on family planning, they have tended
    to have "little regard for the consequences of their policies on women" (Duley
    and Diduk, 1986:48-49).As a result, many policies have proved to be disruptive
    to women in general. Programs enacted during colonization are thought to have
    been responsible for the introduction of new elements into the sexual division
    of labor that replaced more equitable relationships between men and women with
    the "marginalization of women in political decision-making spheres, in access
    and control over resources, and in jural rights and privileges" (Duley and Diduk,
    1986:53). Extensive revisions in systems of land tenure and property rights were
    enacted that "significantly undermined traditional rights of access granted to
    women" (Duley and Diduk, 1986:54). In many instances, European colonialists issued
    land reform policies that resulted in the direct transfer of land ownership from
    women to men. Boserup (1970: 60) has argued that such reforms came about in Africa
    because "Europeans everywhere seem to have objected to the peculiar position of
    African women, that was so different from anything the Europeans were accustomed
    to."The frequent inability of development policies to improve or even maintain
    the status of women has not been limited to colonial periods or post-independence
    regimes, however. Nor has it since been contained within social, geographical,
    political, or temporal boundaries. Planners from both socialist and capitalist
    states have often disregarded women''s issues because they have seen requests
    for attention to such issues as "special pleading, a mechanical imitation of Western
    ''women''s lib,'' needlessly divisive and even antinationalistic" (Duley and Diduk,
    1986:49). It is therefore not surprising that the insights that could have been
    gained from past experience are still not being used effectively to improve the
    situation of women in developing countries. In Korea, for example, the benefits
    from socioeconomic development are continuing to accrue disproportionately to
    men, despite the fact that women comprise a sizeable percentage of both urban
    and rural labor markets (Soon, 1977; Whyte and Whyte, 1982). This scenario remains
    common throughout much of Asia, and the rest of the developing world as well.Although
    both Marxist and non-Marxist analysts have generally viewed the effects of the
    expansion of capitalism as gender-neutral, and although logically, the growth
    of capitalism should eventually "destroy the socially accepted and ideologically
    reinforced subordination of women," that process is failing to occur in many developing
    countries (Afshar, 198-5: xii). As a result, and given the evidence contradicting
    Goode''s contention that the situation of women demonstrably improves during moderate
    to advanced industrialization, many writers have now concluded that while the
    decline in women''s status is particularly precipitous in the early stages of
    development, there also appears to be an overall decrease in status throughout
    "the process of national growth in most countries" (Loutfi, 1980:11).In some ways
    Indonesia provides an example. According to Mather (1985), the subordination of
    the female population in Jakarta has been reinforced instead of reduced during
    the process of industrialization. Through cooperation with local "Islamic patriarchs"
    who serve as security guards and "labor agents" for the industries, Jakarta''s
    industrial capital managers have been able to command a labor force that is both
    "cheap and docile." Women and younger employees are viewed as easily dominated,
    and the alliance between the capital managers and the village leaders has enabled
    the growing industries to hire and maintain these more malleable workers at comparatively
    low wages (Mather, 1985: 177).In general, because industrialization and urbanization
    are so highly related, the problems women in developing countries face during
    one process are almost inseparably linked with those that occur as a result of
    the other. For a variety of reasons the numerous rural to urban moves that take
    place as urbanization occurs usually involve resettlement from an agricultural
    to an industrial economy. These moves have been argued to produce an additional
    and critical dependence of women upon men (Afshar, 1985). Once in the city, potential
    jobs for women tend to be disproportionately few and far from where the migrants
    settle. Hours are inflexible and urban employment is frequently incompatible with
    childbearing and childrearing, as well as with traditional views about what the
    nature of women''s work should be and where it should take place. According to
    some, the bottom line remains that employers tend to prefer to hire males anyway,
    and that training programs that are largely male-oriented often have to be completed
    before employment is even a possibility (Boserup, 1970; Duley and Diduk, 1986).These
    problems are familiar to urban women throughout the developing world, as both
    supply and demand factors contribute to the persistent low status of the female
    population in those regions. On the supply side, constraints include social norms
    regarding the respectability and suitability of the work among women at various
    life cycle stages. Because they lack socially acceptable alternatives, women with
    children and no access to child care must frequently engage in low-wage employment
    activities that are done at home. On the demand side, there is the sexual division
    of labor: gender segregation by task and by "discrete areas of waged work" (Standing,
    1985:233). Women''s work involves lower skill levels, lower wage levels, less
    unionization, and therefore generally less satisfactory working conditions than
    is true in male dominated occupational categories (Standing, 1985).The situations
    in Indonesia and Thailand provide a case in point. The disparities that exist
    between male and female labor force participation rates in both countries are
    a function of a number of the factors already cited: institutional segregation,
    lower human capital levels among women, and again, varying norms about the roles
    men and women are expected to play. As a consequence, female migrants are much
    more apt to enter the service economy than are males, while men are more likely
    to end up in positions in sales or government administration (Smith, 1981).In
    most developing countries, accelerated population growth and urbanization have
    combined to create abundant surplus labor that the new capital-intensive industries
    have been unable to absorb. The result has been "the development of a highly heterogeneous
    labour force and the systematic exclusion of large groups of the population from
    certain occupational opportunities" (Jelin, 1982: 254). Because demand for labor
    is limited, both men and women face potential unemployment or underemployment,
    but because of the perception that women''s "domestic responsibilities will prevent
    them from being effective workers" (Jelin, 1982: 254), they are commonly excluded
    from the most desirable jobs.Taken together, these examples demonstrate that despite
    the obvious increases in opportunities for women that become available during
    the process of socioeconomic development, the overall status of women need not
    approach that of men even in societies that have moved beyond the initial stages
    of industrialization and development in general. Whether the primary focus is
    on industry or the agricultural sector or both, many writers now view "development"
    per se as far from a panacea for Third World women. In fact, there exists a vocal
    constituency for the view that the varied problems associated with low status
    among women in developing countries are not simply the result "of forgetting to
    include women in development plans, or of assuming that they will always benefit
    from measures aimed at men. There is also positive discrimination against development
    for women" (Ware, 1981:11; see also Jelin, 1982).In drawing upon Boserup''s (1970)
    scheme of three separate stages of societal evolution, with three matching status
    levels for women at each stage, Ware (1981) has presented some additional insights
    about the nature of the relationship between the position of women within the
    social system and the various processes involved in socioeconomic development,
    particularly as it relates to agriculture.In Boserup''s first stage, the population
    is sparsely settled, cultivation is shifting, and women tend to be in charge of
    agricultural production. At the second level, populations become more concentrated,
    plow agriculture is introduced, and men become responsible for the majority of
    the farming tasks. In the third stage, both men and women work hard on intensively
    farmed irrigated plots. According to Boserup, the overall status of women tends
    to be lower at the second stage of the process than at either the first or the
    third.Ware (1981:21) has suggested that if Boserup''s view is correct "the impact
    of development upon women''s status would [therefore] depend to a great extent
    on the exact point in the three-stage progression at which modern development
    began." At the first level, women are significant contributors to the overall
    economy. At the second, their contributions to production become less important,
    they become increasingly confined to domestic activities, and their status falls.
    Ultimately, however, Ware appears to agree with Goode; with "industrialization,
    in the long run, women re-emerge out of the domestic sphere and make their contribution
    to the general economy" (Ware, 1981:24).Ware''s contention is that many of the
    shortcomings of development policies to date have been the result of to their
    proclivity for confining women to the "second, agricultural stage, even when men
    have been moving into the industrial stage" (Ware, 1981:24). Such policy outcomes
    are particularly ironic since so many development programs have as a stated objective
    the will to slow population growth; yet it is the women in the second agricultural
    stage who have the highest fertility. Essentially, the roles and statuses of women
    in the first and third stages of Boserup''s scheme can be partially defined through
    activities other than childbearing and childrearing, while those in the second
    stage rely on reproduction as their primary function.In Indonesia the total fertility
    rate is still high, at 4.4 (Population Reference Bureau, 1984), yet the women
    in many parts of the country, including the portion of Central Java that is the
    focus of this research, appear to have moved beyond the second agricultural stage
    and into the third. Much of the land in agriculture is now irrigated, and both
    men and women are actively involved in agricultural production. If Ware and Boserup
    are correct, the status of women in Java should therefore be higher than that
    of women from regions still in the second stage of agricultural evolution.Other
    factors are certainly involved in the determination of women''s status, however,
    many of which are also related to social evolution and economic development. Anker
    (1982: 32) has discussed some of the more important of these, noting that the
    prescribed rules governing the behavior of women can be deemphasized and their
    overall status probably enhanced under conditions "where family members have been
    exposed to new ideas and new ways of life, such as occurs as a result of migration
    and formal education, and where social structure is less cohesive..." These issues,
    with particular emphasis on the relationship between migration and the roles and
    statuses of women, are examined in more detail below.'
