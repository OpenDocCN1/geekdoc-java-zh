    # 引言

    在对第三世界女性迁移特征的一项较为全面的研究中，研究人员分析了来自 40 个国家的数据（Youssef et al., 1979）。结果表明，大多数女性是在青少年中后期（即
    20 多岁时）或 50 岁及以上时迁徙的（de Oliveira and Garcia, 1984 **也报告了类似的发现）。从农村迁移到城市的女性通常是单身的，而向相反方向迁移的女性则倾向于与其丈夫一起迁徙。50
    岁以上的女性（其中很大比例为丧偶、离婚或分居状态）既向城市迁移也于城市之间迁移；在某些地区，单身孕妇也往往构成城乡流的另一部分。然而，无论是否怀孕，单身女性一旦进入城市，就不可能成为回流迁移者（Castro
    et al., 1978）。


    基于这些作者的发现，从农村迁往城市的女性往往是那些由于年轻而尚未在原籍地建立婚姻或经济纽带的女性，或者是那些由于年龄增长导致这些纽带已经中断的女性。


    ## 区域迁移模式

    Ranney 和 Kossoudji (1983) 为这一模式提供了一些支持。根据他们对迁往美国的墨西哥移民的研究，大多数女性是在非常年轻或年老增长时迁徙的，而处于育龄黄金期的女性通常留在墨西哥。Arizpe
    (1981) 对两个墨西哥农村村庄内部迁移的研究进一步证明了迁移在未婚（无依）女性中的普遍性，但该研究并未关注双峰年龄分布两端的女性。相反，它集中关注在青少年早期到中期离开前往墨西哥城的女性。这些女性通常是作为改善群体经济状况的家庭策略的一部分而离开的，在工作几年后，她们在青少年晚期或
    20 多岁时回到农村地区组建家庭。


    在马来西亚，Khoo 和 Pirie (1984) 发现，44.5%的从农村地区搬到城区的女性是在 10 岁到 19 岁之间迁移的。此外，根据 Piampiti
    (1984) 的说法，从四个选定农村村庄迁移到曼谷的大多数女性是在青年时期的，通常在 15 岁到 24 岁之间。80%的人在单身时迁移，尽管已婚移民的比例随着年龄增长而增加（Piampiti,
    1984）。


    ## 巴基斯坦的趋势

    巴基斯坦最近的研究支持迁移的双峰年龄模式，但对按婚姻状态迁移的趋势引入了一些矛盾证据。根据 Shah (1984) 的观点，她研究涵盖的女性中约有 60%是在
    25 岁以下时迁移的，尽管年龄较大的单身和离婚女性（45 岁及以上）迁移的人数也很大。年轻的单身女性通常不会独自迁移。Shah 估计，所有单身女性中约有 10%曾在某个时期迁移过；但在
    45 岁及以上的单身女性中，约有 64%曾这样做。总的来说，离婚女性迁移的可能性比已婚或寡妇女性高，但在自 1965 年以来迁移的女性中，68%是已婚的。因此，尽管年龄较大的单身和离婚女性占据了很大


