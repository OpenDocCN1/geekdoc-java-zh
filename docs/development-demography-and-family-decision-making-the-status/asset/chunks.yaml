    在这些决策中，涉及生育的决策最为重要。与其他发展中国家的情况一样，生育所带来的预期经济回报促使印度尼西亚保持了较高的生育率。父母预期获得的经济利益通常表现为额外的劳动力投入和老年生活的保障，而印度尼西亚儿童似乎在这两个方面都是非常尽职的提供者。


    例如，在 15 至 19 岁的爪哇族人中，男性平均每天投入 7.9 小时从事直接和间接的生产性活动，而他们的姐妹们每人的投入都超过了十小时。表 3.3 中显示的数据表明，即使是年幼儿童对家庭经济的运作也做出了巨大贡献。在
    12 到 14 岁之间，女孩平均每天工作超过 8 小时，而他们的兄弟贡献的则接近 5 小时。即使是 6 到 8 岁的男孩和女孩，每天也提供超过 3 小时的劳动。据估计，该年龄段的爪哇族女孩每天花费
    1.7 小时照顾年幼弟妹，因此年幼儿并不总是其母亲时间的负担。


    Nag 等人（1980:256-257）发现，例如，“在 20 户爪哇族家庭中，只有两户母亲在照顾孩子上的时间比其他家庭成员多；在大多数情况下，是由年长承担了大部分工作。”TABLE
    3.3: 爪哇族按性别和年龄划分每日劳动投入*![Image](img/3.jpeg)


    TABLE 3.4: 各年龄段儿童上学时间占总工作时间的百分比


    | | 按年龄组划分的小时 | | | | | |

    | --- | --- | --- | --- | --- | --- |

    | 性别 | 6-8 | 9-11 | 12-14 | 15+ |

    | --- | --- | --- | --- | --- | --- |

    | | | | | | | |

    | * * | | | | | |

    | 男孩 | 73 | 112 | 56 | 2 |

    | 女孩 | 76 | 53 | 20 | 0 |


    数据来源于 Nag 等人，(1980:256)。正如所指出的，爪哇女性从事间接生产性活动的时间比其丈夫多，且这种模式在所有年龄组中都适用。除了最年幼的工作儿童外，所有年龄组的女孩和女性从事总工作活动的时间都比其男性同伴多。相反，在大多数年龄类别中，男性在直接生产性活动上花费的时间比女孩或女性多，除非他们处于
    9 到 14 岁之间时。


    Nag 等人（1980:257）认为，这是因为“这些年龄组的女孩主要参与了手工艺、贸易和计件劳动，而男孩们……主要参与了动物饲养。”虽然这些年龄段的男孩几乎不花时间在准备家庭食物上，但相应年龄段的女孩每天平均花费
    1.3 小时。


    不仅某些任务具有性别特异性，劳动力分配的差异还取决于女孩和男孩在学校花费时间长短的不同。如表 3.4 中的数据所示，相对于其他工作，男孩在学校花费的时间比例比女孩高。这在他们处于
    9 到 14 岁之间时尤为明显；同样，这是女性在直接生产活动中的参与度超过男性的唯一年龄段。因此，男孩和女孩劳动投入的差异不仅是性别分工的结果，也与两种性别儿童在学校花费时间的差异有关。


    据报道，大家庭的孩子工作时间比小家庭的孩子更长。Nag 等人（1980）认为，这可能是因为年幼的孩子受到年长孩子的激励而努力工作，或者因为当其他孩子能够接手家务后，年长的孩子就能从事直接生产性工作。无论原因何在，大家庭儿童增加的劳动使家庭获得了巨大的利益。通常情况下，大家庭在经济上比小家庭更成功。


