    Frequencies pertaining to both male and female respondents'' perceptions of their
    inputs into decisions regarding spousal selections are presented in [Table 5.1](#Ch05.xhtml_cap_lbl0012).
    In general, the spread across categories of the dependent variable is fairly even,
    especially among women. Frequencies of male and female responses for each level
    of input are also quite similar in categories two through four, in which the couple
    shares control over the marriage decision to varying degrees with other family
    members.


    Where men and women do differ, however, is in the extreme categories. Men are
    considerably more likely to feel that they and their spouses had total control
    over the marriage decision than are women. And men are much less likely to feel
    that they had no input into the decision than are their wives. While 20.3 percent
    of the women feel that they had no control over the selection of their spouses,
    only 10.9 percent of the men surveyed fall into that category. Conversely, whereas
    23.6 percent of the husbands feel that the marriage decision was completely in
    the hands of the couple, only 16.8 percent of the wives felt no outside pressure
    in making the decision to marry.


    This suggests that, at least among certain segments of this sample, males did
    have more to say in choosing their spouses than did females. As Geertz (1961)
    indicated, among more traditional couples for whom marriages are arranged, males
    appear to have been completely left out of the decision far less often than females.
    Similarly, among couples at the opposite end of the scale, those who exercise
    considerable freedom in choosing a spouse, men also appear to operate under fewer
    familial constraints than do women.


    Crosstabulated responses of husbands and wives are presented in [Table 5.2](#Ch05.xhtml_cap_lbl0013).
    They indicate that a slight majority of husbands and wives actually agree precisely
    as to the amount of input they had in the decision making process; just over half
    of the pairs (52.6 percent) fall somewhere on the diagonal. For those among whom
    some disagreement does exist, however, males generally report fewer parental constraints
    than do females. Almost twice as many paired respondents fall above the diagonal
    as fall below it, again demonstrating that men at least perceive themselves to
    have had more input into the marriage decision than do women. Couples whose perceptions
    of the decision-making process are radically different are relatively few.


    [TABLE 5.1](#Figures.xhtml_bck_cap_lbl0012): PERCENT DISTRIBUTION OF PERCEIVED
    CONTROL OVER MARRIAGE DECISIONS (WIVES AND THEIR HUSBANDS)


    | Dependent Variable | Women'' s Perceptions | Men''s Perceptions |

    | --- | --- | --- |

    | | | |

    | No Control | 20.3 | 10.9 |

    | Little Control | 23.6 | 25.6 |

    | Shared Control | 15.7 | 17.8 |

    | Primary Control | 23.6 | 22.1 |

    | Complete Control | 16.8 | 23.6 |

    | Total percent | 100.0 | 100.0 |

    | Total number | 394 | 394 |


    ## Multivariate Results](#contents.xhtml_bck_ht0046)


    In order to determine which factors most influence the variations in perceptions
    that do exist, multivariate analyses were conducted for male and female respondents
    separately; then additional equations were estimated using combined data. Results
    showing the effects of the central variables upon the women''s inputs into the
    decision-making process are shown in [Table 5.3](#Ch05.xhtml_cap_lbl0014).


    In `Equation 1`, the dependent variable measuring a woman''s input into the marriage
    decision is regressed on variables measuring her education and that of her father,
    along with her union order and the size of the city/town in which she lived prior
    to marriage. All results from that equation are significant and in the directions
    predicted. As educational attainment rises, so does the amount of control women
    exercise in making the marriage decision. Similarly, as their fathers'' schooling
    increases, so does their input into the process of mate selection. Women in higher-order
    unions experience greater freedom in choosing their mates than do women in their
    first marriages, and women residing in larger urban areas prior to marriage have
    more input into the decision-making process than do women living in smaller urban
    areas or in rural locales.


    [TABLE 5.2](#Figures.xhtml_bck_cap_lbl0013): HUSBANDS'' VERSUS WIVES'' INPUT INTO
    THE MARRIAGE DECISION!

    ![Image](Images/7.jpeg)


    [TABLE 5.3](#Figures.xhtml_bck_cap_lbl0014): FACTORS AFFECTING WOMEN''S PERCEPTIONS
    OF THEIR DECISION-MAKING POWER IN CHOICE OF SPOUSE (Unstandardized Coefficients)


    | Independent Variables | Equation 1 | 2 | 3 |

    | --- | --- | --- | --- |

    | | | | |

    | Education: | | | |

    | Wife''s | .069** | .055* | .036 |

    | Wife''s father''s | .078** | .079** | .073** |

    | Wife''s union order (0-lst union, 1-higher order) | .452* | .291 | .356* |

    | Size of wife''s premarital community | .459* | .443* | .426* |

    | Wife''s age at marriage | n.a. | .041** | .023 |

    | Marital duration | n.a. | n.a. | -.028** |

    | Constant | 3.732** | 3.192** | 3.923** |

    | | | | |

    | R Square | .124 | .142 | .168 |

    | Number of respondents | 386 | 386 | 386 |

