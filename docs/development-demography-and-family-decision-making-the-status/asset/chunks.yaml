    ## Post-Marriage Mobility


    Data on post-marriage mobility are presented in `Table 6.1`. The data indicates
    that most of the individuals did, in fact, change places. As expected, most moved
    within the first four years. Roughly 62 percent of the males and 72 percent of
    the females experienced a post-wedding move, and of those, 81.1 percent of the
    men and 82.1 percent of the women moved within four years.


    Most respondents lived with their parents before marriage. 91.9 percent of the
    women shared a residence, while 80.7 percent of the men did the same. Although
    a slight majority of couples surveyed (56.3 percent) established households separate
    from either parents, post-nuptial co-residence with in-laws was also common. 43.7
    percent of female respondents claimed to have lived with one or the other set
    of parents after they were married. Of those women, 30.1 percent stayed with their
    own than 13.6 percent with the husband''s family. Data on patterns of co-residence
    are presented in `Table 6.2`.


    Among the women who moved after marriage, about half moved beyond the borders
    of their villages, while 41.5 percent of the husbands made an exogamous move.
    Of the women who changed villages, 25.2 percent moved directly into the home of
    their in-laws, while only 12.8 percent of women who moved within their own villages
    did the same.


    ## Parental Contact


    Whether or not a move occurred, however, and if so or not the move involved inter-village
    relocation, most respondents (male and female) continued to maintain regular contact
    with their parents. Roughly one quarter of all couples reported visiting with
    parents on both sides of the family at least weekly, and over 46 percent saw the
    parents of either the husband (21.3 percent) or the wife (24.9 percent) at least
    once a week. The remaining 28.7 percent of the couples reported no weekly visits
    with the parents of either spouse.


    `Table 6.3` provides information about the amount of contact that was maintained
    between individual respondents and each surviving parent at the time of the survey.
    The data demonstrate that visitation patterns in which parental contact is highly
    infrequent are rare in rural Java; fewer than 12 percent of the individuals in
    any given category reported seeing their mothers or fathers less than once a month.
    Men and women were about equally unlikely to visit their parents only sporadically.
    Indeed, the highest percentages of respondents in all groups were those who visited.

