  toc: []
  trans: '


    夫妻之间不仅作为家庭生存策略的一部分共同努力，在做出家庭决策方面也存在着大量的合作。根据 Bangun (1981: 129) 的说法，他们不仅“分享经济活动（主要是农业和手工艺），还讨论他们所有的问题”。在涉及如何处理重要家庭事务的决策中，女性至少拥有平等的话语权，甚至更多，特别是在关于家庭资源控制的决策（Mangkuprawira,
    1981; Geertz, 1961）。特别发现，中产阶级女性经常会与其丈夫就避孕方法和家庭规模理想进行详细讨论（Hull, 1976）。


    在家庭聚会中，妻子对讨论的话题有发言权，没有任何法律可以阻止她成为 `mamak`，而且她通常是 `kepala waris`。在婚姻期间，她管理自己的财产……这完全符合
    `fikh`（伊斯兰法）。她备受尊重，尤其是当她老了的时候……现代影响和个人化已经[终于]在传统的封闭式生活方式中开辟了巨大的缺口（Vreede-de Stuers,
    1960:28）。


    然而，印度尼西亚夫妇沟通和讨论家庭事务的能力并非没有例外。许多处于社会经济阶层底端的女性从未与丈夫讨论过如避孕或家庭规模偏好等话题。有人认为，这是因为他们太忙于日常活动，而且他们在社会上与组织隔绝，无法通过这些组织了解和讨论家庭计划的方案（Mangkuprawira,
    1981; Hull, 1976）。但从大多数范围内，印度尼西亚家庭内部女性的决策权在许多问题上似乎是相对较高的。


    ## 历史视角下女性的社会地位


    女性在整个社会中的社会地位则没有那么明确。一些作者认为，女性在更广泛社区中的地位相对较高，尤其是与其他伊斯兰国家的女性相比（Bangun, 1981）。然而，其他人则认为，印度尼西亚女性的权力并没有超出她们家门墙远。


    在公共和政治事务中……农村女性没有发挥主导作用，尽管女性土地所有拥有与男性相同的投票权，但他们通常对此类事务感兴趣，倾向于派遣儿子或兄弟作为他们的代表参加乡村会议（Koentjaraningrat,
    1967:260-261）。决定历史背景中的哪些元素最直接引导了女性社会地位演变的进程，也是一个备受争议的话题。根据政府报告，自伊斯兰教引入和荷兰殖民统治之前，女性在印度尼西亚政治生活中一直扮演着重要角色。“印度尼西亚的历史和文学显示了在印度尼西亚王国时期，女性的地位有多高，作用有多么伟大”（印度尼西亚信息部,
    1968:7）。


    在 `adat`（即该国各地区的习惯法）指导下，女性在社会中的地位被认为与男性没有区别，女性经常出现在军事和政治领导的岗位上。


    一些作者认为，是随着荷兰统治的加强和伊斯兰法的引入，该国女性的地位才开始恶化。根据他们的观点，殖民政策对经济和整体社会结构具有高度破坏性，而伊斯兰教的引入（其官方上一直“认为女性在社会地位上低于男性”，Vreede-de
    Stuers, 1960: 46）在削弱女性社会地位方面发挥了主要作用。尽管有人认为，印度尼西亚女性所受的限制少于那些遵守 `purdah`（面纱制度）文化中的女性，但到世纪末，女性在印度尼西亚社会中的地位“已变得完全不可向往”（Vreede-de
    Stuers, 1960:47）。


    争论的另一方则认为，引入伊斯兰法实际上并没有害处，反而有助于改善印度尼西亚社会中作为个体的女性的状况。这一观点的支持者认为，虽然 `adat` 允许家庭和社会中的性别平等，但个体的需求仍然次于家庭和社区的需求。他们主张，伊斯兰法的引入通过教会他们“从家庭群体中解脱出来”，促成了个人（无论男性还是女性）状况的改善（Vreede-de
    Stuers, 1960:41）。


    他们承认女性的状况确实恶化到了女性劣于男性的程度，但认为这是多种因素共同的结果，其中大多数因素与伊斯兰教的发展无关。传统习俗的松弛、现代思想的流入和社会变化，以及女性对根据
    `fikh` 权利的“无知”，都被视为导致女性地位下降的原因（Vreede-de Stuers, 1960:41）。虽然对于哪些因素在决定女性在印度尼西亚家庭和社会中被期待的角色方面责任最大仍存在某些争议，但很清楚，印度尼西亚的这两种法律体系一直是这一过程的核心力量之一。


    ## 女性与法律


