    = .025 (单侧检验)`）。


    在第二个方程中，将衡量受访者结婚年龄和夫妇婚姻持续时间的变量加入估计，结果两个系数均高度显著且方向与预测一致。然而，随着这些变量的加入，受访者的性别、教育程度和结合顺序的影响都变得不显著。性别影响的消失可能反映了性别与结婚年龄之间的强相关性，因为样本中约有
    12.7% 的女性在青少年早期就结婚了，而男性仅占 1.5%。


    在第三个方程中，将因变量对所有衡量主效应的变量（结婚年龄除外）以及性别与教育之间、性别与婚姻持续时间之间的交互项进行回归。结婚年龄由于与性别的相关性，从这一最终估计中被剔除。由于模型的修订，受访者的性别重新出现并成为强显著变量，表明女性的决策评分比男性低多达
