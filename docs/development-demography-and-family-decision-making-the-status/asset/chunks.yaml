    \ fact, fewer than four percent of all respondents claimed to have had less than\
    \ a 50-50 share in deciding how their incomes would be spent, and fewer than six\
    \ percent felt they had less than an equal share in making the decision to discontinue\
    \ childbearing. A slightly higher proportion (12.2 percent of women and 9.2 percent\
    \ of men) felt they had little or no control over the decision to use contraception.Men\
    \ are more likely than women to feel that they had total control over the contraceptive\
    \ decision, while women are more likely than men to fall slightly lower on the\
    \ continuum, in the group who believe that they had a majority, but not complete\
    \ control over the contraception decision. The highest percentages of both males\
    \ and females are found in the third group, those who claimed to have shared about\
    \ equally in the decision-making process.[TABLE 6.4:](#Figures.xhtml_bck_cap_lbl0021)\
    \ PERCENT DISTRIBUTIONS OF VARIABLES MEASURING DECISION-MAKING POWER![Image](Images/8.jpeg)Similarly,\
    \ roughly equal proportions of husbands and wives reported that they alone controlled\
    \ the decision to stop having children, but more men than women believe they shared\
    \ equally in the decision, while more wives than husbands claimed that they played\
    \ the dominant role (i.e., had more input into the decision than did the other(s)\
    \ involved). The fact that this pattern parallels the one observed for the contraception\
    \ decision is not surprising, especially where contraception is used more for\
    \ stopping than for spacing pregnancies.The pattern of control over income expenditures\
    \ is more striking, however. Among women, 37.6 percent reported having had complete\
    \ control over decisions about how their incomes would be spent, while only 24.7\
    \ percent of the males believed they had complete control over the allocation\
    \ of their own earnings. Further, although a full 43.2 percent of the men said\
    \ they shared about equally with others in making decisions about income expenditures,\
    \ only 29.2 percent of the women believed they belonged in that category.As a\
    \ rule, these data indicate that decisions are made among the couples in this\
    \ sample much as earlier writers have suggested they are made among the Javanese\
    \ in general. Women have a good deal to say about how important household decisions\
    \ are made, especially those involving financial matters, and the decision-making\
    \ process appears to be largely cooperative in nature.\n\n## [Multivariate Analysis](#contents.xhtml_bck_ht0053)\n\
    \nTo examine the relationships between the dependent variables and the predictors\
    \ of interest, a number of regression equations have been estimated. Included\
    \ among them are estimations in which constructed measures of overall decision-making\
    \ power among women and men are utilized.In the first set of equations, the indicators\
    \ of the woman's decision-making power are regressed on the mobility and contact\
    \ variables, the measures of education and income, the wife's input into the marriage\
    \ decision, and the controls for age at marriage and marital duration. The dependent\
    \ variable in the first equation is the composite measure of the woman's status.\
    \ In the second equation, it is her level of input into decisions about the ever-use\
    \ of contraception. In the third, the dependent variable measures the woman's\
    \ input into the decision to discontinue childbearing, and in the fourth, the\
    \ focus is on the decisions surrounding income expenditures. The results are presented\
    \ in [Table 6.5](#Ch06.xhtml_cap_lbl0022).In all four equations, the reference\
    \ category for the first set of mobility variables contains the group believed\
    \ to be normative in rural Java as a whole, the one in which both spouses move\
    \ within the first four years of marriage. That set of variables was expected\
    \ to demonstrate that women in the reference category fare better in terms of\
    \ their decision-making power than do women in any other group. While almost all\
    \ of the[TABLE 6.5:](#Figures.xhtml_bck_cap_lbl0022) DETERMINANTS OF THE WIFE'S\
