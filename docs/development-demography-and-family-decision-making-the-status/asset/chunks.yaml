    编辑，布朗大学研究

    人口与发展研究


    # 前言


    这份手稿在过去的几年中不断演变，许多人在此过程中做出的贡献值得特别感谢。首先，我要感谢菲利普·盖斯特（Philip Guest）博士，让我加入了他最初关于家庭劳动力分配的研究项目。他的帮助和建议对我来说无价之。此外，我特别想感谢弗朗西斯·科布林·戈德谢德（Frances
    Kobrin Goldscheider）教授，我是布朗大学论文委员会的主席。如果没有她最初的支持，我永远无法去印度尼西亚参与这项研究的实地调查，可能根本不会就这个主题写论文。她在论文每个阶段提供的非常有帮助的意见以及持续的支持，我深表感激。


    我的委员会其他成员西德尼·戈尔德斯坦（Sidney Goldstein）和阿尔登·斯皮尔二（Alden Speare, Jr.）教授对论文的投入也同样巨大的认可和许多感谢。委员会的每位成员都提供了非常不同的见解，他们共同使得这一过程变得既有趣又愉快。他们提供的多样化信息是我与委员会合作时最欣赏的事情之一，我认为自己非常幸运能与他们三位一起工作。


    我想感谢人口研究与培训中心以及福特基金会提供的资金支持，使实地调查成为可能。我非常感谢印度尼西亚 Leknas 的苏哈索（Suharto）博士和他的员工，感谢他们的指导和支持，也感谢他们在与我们交往期间极极高质量的工作。我从他们那里学习了许多关于调查研究的知识，他们让我们在印尼的工作非常愉快。他们雇佣的访访员的技能和理解力，以及我们调查村庄的人的合作，对于项目的成功也至关重要，对此深表感激。


    我要感谢一位外部评审员提供的非常有用的意见，并感谢卡尔文·戈德谢德（Calvin Goldscheider）在出版这份手稿方面提供的帮助和鼓励。此外，我想感谢卡罗尔·沃克（Carol
    Walker）在书籍排版方面的帮助和耐心，感谢贝西·戈尔德（Betsy Gould）在它还是一篇论文时提供的编辑意见，以及斯蒂芬·辛格（Stephen Singer）在进入后期阶段对其编辑的帮助。最后，但同样重要的是，我要感谢我的家人以及在布朗大学及其他地方的朋友多年来的支持。


    琳达·B·威廉姆斯（Linda B. Williams）


    # 1. 女性在社会经济发展中的作用


    关于家庭作为一个实体的性质、其成员之间存在的关系类型以及家庭与社会之间的关联，经常会提出问题。跨越文化，家庭一直是社会结构基石的基础，构成了阶级层级的基础，并承担着几乎所有社会成员的最初社会化责任。随着多样化进程在世界许多地区开始扎根，家庭也成为个人与新兴机构之间的重要纽带（Goode,
    1982）。


    然而，随着时间的推移，参与社会和经济发展的集体因素反过来导致了家庭作为一个单位的形式和功能发生巨大变化。这种演变的程度差异很大，但 Goode（1982）概述了
    14 项对全球范围内大多数家庭转变起过关键作用的因素。这些因素包括母系制度的减少、“宗族群体”权力和声望的下降、彩礼和嫁妆流行程度的下降、夫妻间年龄差的缩小、父母对子女结婚配偶选择控制的减少，以及女性自主性的增加。


    虽然所有这些发展本身都有重要性，但后两项是本研究关注的焦点。第一项引起关注是因为，尽管关于欠发达国家结婚时机已有许多记载（Dixon, 1971; Smith,
    1980），而且关于在选择配偶时，适婚个人与其他家庭成员投入的相对强度存在大量信息（Goode, 1963），但很少有分析来确定哪些因素最影响结婚者与其家庭之间决策权力的平衡。相反，决定适婚个人是否以相对自主的方式行动（即由未婚者在婚姻决定中起主要作用），还是决定通常是在家庭或社区内他人的指导下做出的变量，在文献中很大程度上尚未被探索。


    被忽视的还有影响女性控制家庭内部其他核心事务程度的因素。由于最近关注更多地集中女性角色和地位作为人口变化的决定因素和结果的重要性上，确定哪些社会代理最能增强或削弱其整体地位的需求变得愈发紧迫。


    在本研究中，分析将首先关注婚姻决策涉及的动态，然后关注若干社会和人口统计过程（特别是迁移）如何影响女性在结婚后控制家庭决策的能力。最终，还将评估女性自主性水平差异对特定人口统计结果的影响。然而，在对这些问题进行深入分析之前，有必要将它们放在更广泛的社会背景中。因此，还包括了关于人口增长和社会经济发展相互关联的过程如何随时间推移影响女性角色和地位的讨论。


    此外，由于研究提出的问题相当具体，涉及决策和决策结果的家庭动态，因此关于所调查主题是否会对关注更广泛的政策制定者感兴趣（以及在多大程度上），也值得关注。因此，在随后的讨论中介绍了一些人口增长和经济发展辩论的核心问题，并阐述了本研究探索的主题可能被视为大图的一部分的一些方式。


    ## 人口与发展：概述


