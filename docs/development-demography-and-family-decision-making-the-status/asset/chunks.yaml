- fmt: "\nOne-tailed tests of significance: `*` indicates significance at the .05\
    \ level; `**` indicates significance at the .01 level.\n\nIn Equation 2, the dependent\
    \ variable is again regressed on the education, residence, and union order variables,\
    \ while a control for the age at which the woman married is added. As expected,\
    \ the age at marriage variable is found to be of considerable importance; women\
    \ who marry later have a great deal more to say about whom they will marry than\
    \ do those wed at earlier ages. Although the education variables and the one measuring\
    \ size of community prior to marriage remain significant in this estimation, the\
    \ effects of union order weaken and become non-significant. This is most likely\
    \ because age at entry into higher-order unions is generally greater than age\
    \ at first marriage, and much of the effect of the union order variable is absorbed\
    \ by the one measuring age at marriage. \n\nIn the third equation, the variable\
    \ measuring the duration of the woman's marriage is added to the estimation. This\
    \ variable was expected to be of considerable importance because it indicates\
    \ how long ago the marriage decision actually took place. As predicted, those\
    \ who were married some time ago had considerably less input into the marriage\
    \ decision than did those who were married more recently. Beta coefficients (not\
    \ presented) indicate that the marital duration variable is actually the strongest\
    \ predictor of the woman's input into the mate selection decision of all the variables\
    \ entered into this equation.^([2](#Ch05.xhtml_fn0023)) \n\nTo examine the importance\
    \ of changes over time in greater detail, the sample was split in half at the\
    \ median length of marital duration (15 years). This procedure was undertaken\
    \ to see whether or not the variables of interest were more important for more\
    \ recently married women or for those married longer ago. Because no specific\
    \ hypotheses were introduced for this section of the analysis, a two-tailed test\
    \ of significance was utilized. Results are presented in [Table 5.4](#Ch05.xhtml_cap_lbl0015).\
    \ \n\nAmong the women who had been married for 15 or more years by the time of\
    \ the survey, the variables measuring the ages at which they married their current\
    \ husbands, and the sizes of their communities prior to marriage prove to be the\
    \ factors of central interest. Again, women who got married when they were older\
    \ had more input into the marriage decision than did those who married early,\
    \ while women from smaller locales were able to exert less power in making the\
    \ decision than were those from larger cities. The age at marriage variable is\
    \ especially important to those married 15 or more years ago, probably because\
    \ differences between the ages at which women and men got married were larger\
    \ during that time than has been true more recently.^([3](#Ch05.xhtml_fn0024))\
    \ \n\nThe importance of the variable measuring the size of the community in which\
    \ the woman lived prior to her marriage is more pronounced for women married longer\
    \ ago than it is for those married more recently, probably because 15 years prior\
    \ to the survey, transportation to and from larger urban centers was much less\
    \ well developed, and therefore much less utilized than is true today. As a result,\
    \ exposure to modern values and attitudes was much more likely to occur if the\
    \ respondent lived in the urban centers than if she lived elsewhere and gained\
    \ exposure only by travelling into the city at rare intervals. Conversely, recent\
    \ improvements in roads.\n\n[TABLE 5.4](#Figures.xhtml_bck_cap_lbl0015): FACTORS\
    \ AFFECTING WOMEN'S PERCEPTIONS OF THEIR DECISION-MAKING POWER IN CHOICE OF SPOUSE\
    \ BY MARITAL DURATION (Unstandardardized)\n\n| Independent Variables | Married\
    \ less than 15 years | Married 15 years or more |\n| --- | --- | --- |\n| | |\
    \ | |\n| * * | | | |\n| Education: | | | |\n|  Wife's | | | |\n|  Wife's father's\
    \ | | | |\n|  Wife's union order | | | |\n| Size of | | | |\n|  Wife's age at\
    \ marriage | | | |\n| Marital duration | | | |\n| Constant | | | |\n| R Square\
    \ | | | |\n| Respondents | | | |\n"
