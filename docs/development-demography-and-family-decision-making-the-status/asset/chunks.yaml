    # 第 6 章


    本章关注女性在结婚后其家庭内部地位的决定因素。在该章的分析中，衡量婚姻决策投入的变量被用作衡量家庭内部地位的新因变量的预测变量。


    如前所述，女性地位这一概念有多种不同的定义方式。一个相对全面但宽泛的定义认为，地位包含了以下元素：“女性获取（并控制）物质资源（包括食物、收入、土地和其他形式的财富）以及社会资源（包括知识、权力和声望）的程度……”
    (Dixon, 1978:6)。Safilios-Rothschild (1982) 通过区分不同类型的地位（例如性别和 SES，即社会经济地位）进一步进一步证明了这一概念的复杂性，强调了它们之间相互关系的重要性，并将人际互动层面的地位（称为“权力”）与更广泛范围内的地位区分开来。


    由于这项研究主要关注家庭内部的地位（或权力），将首先处理与这种形式地位相关的概念。这些概念包括但不限于：“控制有关……生产性和经济活动决策的能力，包括行动自由以及对所得工资或收入的控制”
    (Safilios-Rothschild, 1982:128)、指挥那些在家庭责任中协助或替代女性的他人提供服务的权力、控制家庭组成的能力、妻子与其丈夫相比拥有的空闲时间，以及她在重大决策（如家庭规模——包括是否生育，如果生育，则何时生育；迁移和大额购买）中的投入量
    (Safilios-Rothschild, 1982)。


    在这些地位组成部分中，参与重大决策的权力对本研究具有首要意义。在最初考虑的几个要素中，发现与决策过程相关的问题(6) 最容易向受访者表达。因此，女性在家庭中的地位是根据她们生活中几个核心方面的决策权进行索引的。与婚姻决策问题一样，受访者被要求就每个决策说明：1)
    由她独自决定（即她拥有完全控制权）；2) 她拥有决策的主要控制权，但允许他人有一定的投入；3) 她与其他平等共同决策；4) 决策主要由他人做出，但允许她有一定的投入；或
    5) 决策完全由其他个人做出，完全不允许投入。丈夫也被问及他们对重要家庭决策有多大的控制权，针对他们的问题遵循相同的格式。


    在第 6 章中总共分析了五个因变量。其中四个衡量女性自身感知的地位，第五个衡量其丈夫对她们在决策过程中投入的看法。在涉及女性受访者的变量中，一个衡量女性对资源控制决策的投入，一个衡量她们对生育决策的控制，一个衡量关于是否使用过避孕措施的决策，以及一个复合指标。这四个变量中的第一个——资源控制变量，衡量了获得现金收入的女性认为自己对如何利用该收入的决策有多大的控制权。第二个衡量对于声称计划不再生育的女性，停止生育的决策是如何做出的。第三个衡量避孕使用者如何决定第一次采用避孕措施；对于第四个变量，计算了通过其他三个变量衡量的女性权力的平均值和标准化得分。最后，第五个变量是基于相同三个指标计算的丈夫得分复合测量(7)。人们可能预期，夫妻一旦结婚，家庭内部做出的决策应该主要涉及夫妻双方，事实往往也是如此。然而，印度尼西亚的父母经常对成年子女的生活保持活跃的兴趣，并在夫妻结婚后继续参与家庭内部的决策。


    ### 家庭内部地位的预测因子


    '
- fmt: '

    Variables measuring one of the predictors expected to be central to the estimation
    of intra-familial decision-making power, the mobility of the couple following
    their marriage, are operationalized into four categories. In every case but one,
    a move is said to occur if the individual(s) in question changed residence within
    four years following the marriage, as four years is the normative period of time
    in which a post-marriage inter-household (and possibly inter-village) move generally
    takes place in rural Indonesia (Koentjaraningrat, 1967).


    The five mobility categories created include:

    1) that in which neither spouse moved,

    2) that in which only the wife relocated,

    3) that in which only her husband moved,

    4) that in which both moved within four years of marriage, and

    5) that in which they both moved, but only after four years. The category in which
    both moved within four years of marriage is used as the reference category because
    it is expected to be the category yielding the greatest intra-familial power for
    the woman.


    The other mobility variable measures moves between villages and the timing of
    those relocations. If the woman migrated to a new village within four years of
    her marriage, she is represented in one dummy category. If she completed an inter-village
    move, but not until she had been married for four or more years, she is in another,
    and if she did not participate in any move beyond the borders of her village since
    her marriage, she is in the reference group. These variables are included to determine
    whether longer distance moves are disruptive to women, or whether they help them
    gain independence from outside interference in the decision-making process. The
    variable is also conceptualized in this way to determine whether or not the timing
    of such moves affects women''s intra-household status.


    To further examine the importance of parental inputs into familial decisions,
    a variable that measures the amount of contact between the respondent and his
    or her parents is introduced. Respondents were asked how often on average they
    visited with each parent. If they were living with either or both parents, they
    obviously reported frequent interactions with them. For each parent the respondent
    was asked whether interactions occurred on average: more than once a week, about
    once a week, two or three times a month, roughly once a month, at least once a
    year but not every month, or less than once a year.


    The actual parental contact variable was then constructed as follows. Respondents
    who had frequent contact (at least once a week) with either or both of their own
    parents were listed as having frequent parental contact, and those who saw neither
    of their parents as often as once a week were listed as not having frequent contact.
    Dummy variables were constructed such that:

    1) one group was composed of couples among whom only the wife had frequent contact
    with her parents,

    2) another contained only those in which the husband had frequent contact with
    his parents,

    3) a third contained couples in which both spouses frequently saw their parents,
    and

    4) the fourth group was composed of couples among whom neither spouse had frequent
    contact with her/his parents. The latter group was used as the reference category.


    These variables can only approximate the amount of contact that took place between
    the respondents and their parents at the time of the contraception and fertility
    decisions because the contact is measured at the time of the survey, not at the
    time of the decision. Since some parents would have died between the time of the
    decision and the time of the survey, and other sets of parents and children would
    have altered their visitation patterns, there are limitations associated with
    these variables. However, these limitations are expected to be less restrictive
    than might be expected. For instance, the fertility decision involves only women
    who had completed their childbearing before they were interviewed. Because the
    upper age limit on the sample is 50, most who had discontinued childbearing would
    not have done so long prior to the survey. For the question involving control
    of resources, the causal order is not an issue, since both variables were measured
    at the time of the survey. The only set of equations for which the temporal sequence
    is of somewhat greater concern is that involving the ever-use of contraception.


    In many of the equations the respondent''s input into the marriage decision is
    introduced as an independent variable. Its construction has already been described.
    Income variables are also straightforward. Log transformations of the wife''s
    earnings tended to improve the linearity of the relationship between her income
    and the dependent variable, while similar transformations of her husband''s earnings
    were generally not helpful. The natural log value of the wife''s earnings in rupiahs
    (plus one to accommodate the log transformation in cases in which her earnings
    equalled zero (25 percent of the cases)) thus forms the independent variable for
    her income, and a similar transformation was made for her husband''s income where
    appropriate. Otherwise, the variable measuring the husband''s income is simply
    the number of rupiahs he earned per year, divided by 1000.


    Urban residence was not found to be significant in the estimation of women''s
    status and so was dropped from the analysis.


    ### Contraception and Fertility

