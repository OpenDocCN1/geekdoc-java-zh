    ## [Family Planning in Indonesia](#contents.xhtml_bck_ht0033)'
  toc: []
  trans: '

    根据 Hull and Hull (1984) 的数据，儿童为家庭贡献的劳动投入数量与家庭收入与其食品支出之比存在显著相关，且与家庭控制用于水稻生产的土地面积无关（Nag
    et al., 1980）。


    总的来说，男性和女性的平均每日总劳动投入分别为 8.7 小时和 11.1 小时。如果只考虑直接生产性活动，男性的平均时长为八小时，女性为六小时。因此，根据
    Nag 等人（1980:262）的观点，“将这些从事如此大量工作的人归类为失业或就业不足是错误的，尽管许多职业的经济回报确实相当低。”


    他们认为，在水稻和旱稻种植之外到处都是机会，而且参与此类机会与否与其说是取决于土地和资本的可用性，不如说是取决于对劳力的需求、对劳动所产生的产品的需求，以及农村内部可用牲畜和草场的数量。


    因此，每当当地经济状况良好时，每个“家庭都可以从许多职业中获得收入，且收入与家庭能够提供的劳动量成正比（而非递减）”（Nag et al., 1980:263）。因此，家庭规模的扩大应该导致家庭整体生产力的提高，无论这种劳动力的增加是由于生育还是招募额外的家庭成员。结果，Nag
    等人（1980）主张，只要额外的家庭成员仍然能够通过生产性活动来提高家庭福利水平，爪哇答就不应被视为“人口过度”。


    尽管发展中世界其他地区的人可能倾向于生儿子而非女儿，但在爪哇答情况并非如此。父母对男孩和女孩的依赖相当平等，因此倾向于不对其中一方表达偏好。除了两种性别的孩子都提供了大量的家庭劳动外，这可能部分归因于之前提到的婚后居住模式的灵活性。由于儿子和女儿都倾向于住在父母足够近的地方为他们提供长期帮助，因此所有孩子都受到高度重视。


    印度尼西亚父母平均有四个孩子。其中，通常有 1.5 个会离开，2.5 个留留在村子里。在四个孩子全部离开的罕见情况下，他们的可能会来到村子里照顾祖父母，或者被祖父母照顾。如果一对夫妇没有孩子，他们可能会尝试收养，以确保他们年老后能获得一些帮助。同样，他们没有性别偏好（Nag
    et al., 1980）。


    总而言之，大多数夫妇希望生几个孩子，既是因为他们是生产性劳动力的良好来源，也是因为他们提供了老年保障。无论是否控制年龄和婚姻时长，女性和男性对家庭规模的偏好往往相似的；他们平均都喜欢四五个孩子（McNicoll
    and Singarimbun, 1983; Williams, 1988）。在爪哇答，大家庭传统一直是理想的，不仅是因为孩子是经济资产，还因为他们具有内在价值，并通常被认为是一种福祉（Koentjaraningrat,
    1967）。


    ## 印度尼西亚的家庭计划


