    Data from recent censuses can be used to provide an idea of how far the campaign
    to improve educational standards among Indonesian woman has since progressed.
    The data indicate that while female literacy levels in the nation as a whole increased
    from 22 to 32 percent between 1961 and 1971, most Indonesian women were thus still
    illiterate at the time of the 1971 Census. By 1980 that was no longer the case;
    63.6 percent of the female population over age 10 were then classified as literate.
    While literacy rates are still lower for women than for men in Indonesia, (as
    male literacy was over 80 percent by the time of the 1980 Census), the overall
    position of women appears to have improved substantially in recent years.


    In Java, higher proportions of both men and women are literate than is true nationwide.
    Among those over age ten, roughly 75 percent of females and 90 percent of the
    males were literate by the time of the 1980 enumeration. To enhance educational
    opportunities for women, the Community Education Division has instituted 48 courses,
    including literacy, in informal education programs aimed specifically at the female
    population. It has been the view of policy makers that improvements in education
    should increase the number of job opportunities available to women, improve "self-expression
    and independence," raise "knowledge and skills, to a new place in a new social
    order," and provide a "motivating force for change" (Mangkuprawira, 1981:91).


    The more specific objectives of the division''s programs have not always followed
    the traditional western model, however. For example, among its primary goals is
    "educating women in their roles as home-makers" (Mangkuprawira, 1981:91). Also
    emphasized is information about nutrition and health. Because it is commonly believed
    that inadequate education, health, and nutritional practices not only interfere
    with living standards and the general well-being of individuals, but also decrease
    their productivity and therefore their ability to earn adequate support for themselves,
    attempts to improve women''s knowledge in each of these areas have been viewed
    as crucial in recent policy initiatives (Bangun, 1981).


    In addition to courses on health and hygiene, women are also taught basic skills
    such as sewing (Mangkuprawira, 1981). Although increasing education of this sort
    is thought by some to be one way to improve the status of women in Indonesia,
    many women still fail to attend available classes (Bangun, 1981). This is in large
    part because the classes require not only time, but money. Women who are fully
    employed generally lack the time, and those who are not generally lack the money.
    The barriers to success are thus interrelated; low education precludes better
    employment, while the lack of financial resources precludes increases in educational
    attainment.


    For example, many of the women who might be interested in the sewing classes live
    only at subsistence levels and are unable to afford the cloth needed to participate
    in the classes. Those who are able to take part are often left without access
    to credit upon completion of their courses, and as a result the classes prove
    to be of little practical benefit to them. Similarly, the literacy programs are
    often designed inappropriately for the populations at which they are targeted.
    Many of the teaching materials used to convey basic reading and writing skills
    to village women are neither simple enough, nor applicable enough in terms of
    the topics discussed in the readings, to be of use to those in a rural setting
    (Bangun, 1981).


    Finally, it has been found that village women are still reluctant to speak out
    in classes in which village men are present, and they are frequently uncomfortable
    when being taught by males (Epstein, 1981). If education is to be an effective
    tool for raising the status of women in Indonesian society, these problems will
    have to be recognized and addressed.


    The problems of rural education are not limited to the adult female population,
    however. The schooling of children is frequently neglected as well. The reasons
    for this are often financial, although it is also common for relatively wealthy
    families to take their children out of school early. In such cases the school
    facilities may be inadequate or the parents may not sufficiently understand the
    benefits of education for their children. In other cases, parents are fully aware
    of the potential benefits of school for their children, but fear that if the children
    become educated they will become disenchanted with life as peasant farmers and
    take up employment elsewhere (Koentjaraningrat, 1967).


    ## Residence Patterns


    Regardless of the level of schooling completed by a female in Indonesia, it is
    expected that she will eventually marry and raise a family. One of the central
    questions addressed in this research is whether or not the couple''s choice of
    residence upon marriage then influences the amount of control each spouse is able
    to exert in making major household decisions. Accounts vary somewhat as to where
    Javanese couples do tend to live when they get married, but there appear to be
    several common options.


    According to Koentjaraningrat (1967), most couples hope eventually to form their
    own households. Since many marry at very early ages, however, they often must
    live with one or the other set of parents for a few years (usually three to five)
    before relocating to a place of their own. In such cases, the couple is more likely
    to settle with the parents of the wife than with those of her husband, out of
    deference to the feelings of the wife Once the couple becomes independent, they
    are again more likely to establish their new home close to that of the wife''s
    parents, than to move to another village or to a home at a considerable distance
    away within the same village. In fact, it is not uncommon for a married daughter
    to continue to live with her parents throughout her adult life, eventually inheriting
    their home (Koentjaraningrat, 1967).


    Nag et al. (1980) agree that upon marriage, the couple traditionally spends at
    least some time in the home of the bride''s parents, but note that the amount
    of time spent there can range from one night to a number of years. They have also
    found that when a couple eventually moves to a separate residence, they tend either
    to settle close to the home of the husband''s parents or to move in with them.
    Because the woman generally marries a man who lives near the home of her own family,
    she will remain close enough to her parents to maintain contact with them and
    to assist as when they get older, even if she becomes part of her in-laws'' household
    (Nag et al., 1980). There is general agreement that although there are a number
    of possibilities as to where the couple will finally locate, the ideal is the
    establishment of a separate nuclear household. (See also Jay, 1969). Even when
    the couple forms its own household, however, both spouses maintain close ties
    with their own parents. Possibly as a consequence, the parents continue to participate
    in family decisions well after the new household is established (Vreede-de Stuers,
    1960:30).

