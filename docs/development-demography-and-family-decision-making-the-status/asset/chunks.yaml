    much less uniform support was found for that hypothesis. Educational attainment
    was found to be of some importance among women, but only until duration of marriage
    was controlled. Once the variable measuring the length of the current union was
    included in the estimation, the effect of the woman's education was found to weaken
    and become non-significant.This may have been in part because the marital duration
    variable was also measuring other factors associated with change over time, such
    as elements of socioeconomic development or changes in values and attitudes, that
