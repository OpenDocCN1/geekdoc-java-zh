    One-tailed tests of significance: `*` indicates significance at the .05 level;
    `**` indicates significance at the .01 level. It should be noted that the independent
    variables included in the analyses do a considerably better job of explaining
    the variance in the amount of input women claim to have had into the marriage
    decision (17 percent) than is true for their husbands (8 percent). Initially,
    it was thought that part of the explanation for this might be that changes over
    time have been of disproportionate benefit to women in matters concerning the
    choice of a spouse. To examine that possibility, one last set of regression equations
    was estimated. Male and female responses were combined and the dependent variable,
    perceptions of input into the marriage decision, was regressed on the independent
    variables described above. The gender of the respondent was included in the analysis
    to gauge its importance in the marriage decision-making process. In addition,
    in the third equation, interaction terms have been included to determine whether
    the gender of the respondent is a good predictor when entered in combination with
    either the variable measuring the respondent''s education or marital duration.
    The results are presented in [Table 5.6](#Ch05.xhtml_cap_lbl0017).


    In the first equation, the findings are largely as expected. All variables, with
    the exception of the size of the respondent''s community prior to marriage, are
    significant and in the predicted directions. This includes the variable of central
    interest in this portion of the analysis, the gender of the respondent. As hypothesized,
    men reported having had significantly more input into the marriage decision than
    did women (`p = .025 (one-tailed test)`).


    In the second equation, the variables measuring the age at which the respondent
    married and the duration of the couple''s marriage were added to the estimation,
    and once again both coefficients are highly significant and in the predicted directions.
    With the addition of these variables, however, the effects of the respondent''s
    gender, educational attainment, and union order all became non-significant. The
    disappearance of the effect of gender probably reflects the strong relationship
    between gender and age at marriage, as roughly 12.7 percent of the women in this
    sample married when in their early teens, compared with only 1.5 percent of the
    men.


    In the third equation, the dependent variable was regressed on all of the variables
    measuring the main effects (with the exception of age at marriage), and on interactions
    between gender and education, and between gender and marital duration. Age at
    marriage was dropped from this final estimation because of its correlation with
    gender. Given the revisions to the model, the gender of the respondent reemerged
    as a strongly significant variable, indicating that women have decision-making
    scores up to 50 percentage points lower than those of men. In addition, the interaction
    between gender and educational attainment is significant and positive; improvements
    in the level of education do appear to have been of greater benefit to women than
    to men in this sample. This is not surprising. Across cohorts women generally
    complete fewer years of schooling than do their husbands, so each additional increment
    is likely to be of disproportionate benefit to them.


