- fmt: "\nData from Hull and Hull (1984).number of labor inputs children contribute\
    \ to a household is found to be significantly correlated with the ratio of the\
    \ household's income to its expenditures on food, and is independent of the amount\
    \ of land the family controls for wet-rice production (Nag et al., 1980).\n\n\
    Overall, the average total daily labor inputs of males and females are 8.7 and\
    \ 11.1 hours respectively. If only directly productive activities are considered,\
    \ the average is eight hours for males and six for females. According to Nag et\
    \ al. (1980:262), it is therefore \"erroneous to categorize the people doing so\
    \ much work as unemployed or underemployed, even though the economic returns from\
    \ many occupations are indeed quite low.\"\n\nThey have argued that opportunities\
    \ abound outside wet and dry rice cultivation, and that participation in such\
    \ opportunities depends less on availability of land and capital than on the demand\
    \ for the labor, the demand for the product that the labor would produce, and\
    \ the amount of livestock and grass that are available within the rural villages.\
    \ \n\nAs a consequence, whenever the local economic situation is favorable, each\
    \ \"household can obtain income from many occupations, in direct (not declining)\
    \ proportion to the amount of labor that the household can provide\" (Nag et al.,\
    \ 1980:263). Increasing family size -should therefore result in increases in overall\
    \ household productivity, whether the increase in labor power results from reproduction\
    \ or recruitment of additional household members. As a result, Nag et al. (1980)\
    \ contend that as long as additional family members are still able to find productive\
    \ activities through which to raise the level of family well-being, Java should\
    \ not be considered \"overpopulated\".\n\nAlthough individuals from other parts\
    \ of the developing world may prefer sons to daughters, in Java that does not\
    \ appear to be the case. Parents rely fairly equally on boys and girls, and so\
    \ tend not to express a preference for one or the other. In addition to the substantial\
    \ amounts of household labor children of both genders provide, this may be due,\
    \ at least in part, to the flexibility of postmarriage residence patterns described\
    \ earlier. Since both sons and daughters tend to live close enough to their parents\
    \ to provide them with long term assistance, all children are highly valued.\n\
    \nIndonesian parents have an average of four children. Of these, 1.5 generally\
    \ move away and 2.5 stay in the village. In the unlikely event that all four children\
    \ leave, their children may come to the village to care for, or be cared for by\
    \ the grandparents. If a couple has no children, they are likely to try to adopt\
    \ in order to ensure that they will receive some assistance when they get older.\
    \ Again, neither gender is preferred (Nag et al., 1980).\n\nIn summary, most couples\
    \ expect to have several children, both because they are a good source of productive\
    \ labor, and because they provide old age security. Whether or not age and marital\
    \ duration are controlled, the family size preferences of women and men tend to\
    \ be similar; each prefer an average of four or five children (McNicoll and Singarimbun,\
    \ 1983; Williams, 1988). In Java large families have traditionally been desirable,\
    \ not only because children are economic assets, but because they have intrinsic\
    \ value and are generally considered a blessing (Koentjaraningrat, 1967).\n\n\
    ## Family Planning in Indonesia\n"
