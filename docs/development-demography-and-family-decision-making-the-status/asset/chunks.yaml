    ## 女性与迁移

    '
- fmt: '

    # Migration and the Female Perspective


    Although much has been written about other consequences of migration, including
    the impact on the sending area (Connell et al., 1976; Lipton, 1982), effects on
    the receiving area (Findley, 1977; Yap, 1976), and the adjustments of the migrants
    themselves (Goldscheider, 1983; Martine, 1979), relatively little attention has
    been given to the specific impact of migration on women. Given what has been thought
    to be the nature of most migration streams, especially those covering longer distances
    (Ravenstein, 1885; Shryock, 1964), the focus of most migration research has instead
    tended to rest on the male. Ware (1981:142) contends that while in some areas
    female migration "actually constitutes a majority of all migratory moves," such
    moves are still largely ignored. She has argued that this is because female migration
    has been considered unimportant in general, that writers have seen female movements
    as primarily related to marriage and thus insignificant economically, and that
    since many of these moves are from one rural area to another, instead of to an
    urban center, they have been deemphasized in the face of current attention to
    what are seen as the more pressing problems of urbanization.


    In addition, much of the literature that does exist on women and migration "has
    been written largely from a male perspective" (Hafkin and Bay, 1976:1), with the
    idea being that the main elements of interest in female migration are simply mirror
    images of the same components of male migration. It has been argued that especially
    in societies characterized by patrilineal and patrilocal social systems, the movement
    of a woman to a new place of residence tends to be nothing more than a reflection
    of her association with her household or family (Connell et al., 1976). According
    to Little (1973:17), "the men followed the money and the women followed the men."
    Until recently, therefore, investigations into the separate determinants and consequences
    of female migration have been considered redundant and of insufficient interest
    to justify separate analyses (Thadani and Todaro, 1979).


    ## The Evolution of Female Migration Research


    Our understanding of different patterns, causes, and outcomes of female migration
    at last appears to be on the rise, but this recognition is very late in coming.
    Thadani and Todaro (1979) maintain that the existence of basic differences between
    male and female migration behavior should have been evident as early as 1966,
    when Lee''s general migration model was introduced. Given Lee''s (1966) insights,
    the "potential differences between male and female migrants at least as regards
    intervening obstacles and personal factors" should have been obvious (Thadani
    and Todaro, 1979:1).


    Among the variables that help to determine the extent of these differences are
    political, economic, and socio-cultural factors that can, at times, allow or encourage
    male migration, while discouraging or prohibiting autonomous or even associational
    migration among women (Connell, 1984; Thadani and Todaro, 1984). Although extreme
    examples of such restrictions are becoming less and less common, their continued
    existence does provide insights into the origins of the "male bias" that has been
    prevalent in the migration literature to date.


    ## Case Studies: Iran and Malaysia


    In Iran, for example, particularly among the lower classes, access to information
    and modern sector opportunities is extremely unequally distributed between males
    and females. Migrants to Teheran are generally single men seeking employment,
    or other males accompanied by their often illiterate wives, daughters, and other
    female family members. Autonomous female migration is not encouraged. Since a
    man''s honor depends to a great extent upon the virtue of the women in his household,
    the interactions of those women with non-kin males are severely restricted. Travel
    is closely regulated, and women who accompany or follow males to Teheran are often
    not allowed to travel beyond the boundaries of their neighborhoods. Those who
    venture outside such boundaries may generally go only under supervision (Bauer,
    1984). The limitations placed on female mobility, along with their highly deficient
    educational attainment, combine to make procurement of employment outside the
    household very unlikely. When the broad picture is examined, it therefore becomes
    clear that although migration in Iran is a viable mechanism through which males
    seeking economic advancement can attain their goals, it is a much less realistic
    option for women.


    Stivens (1985) has noted, for example, that among rice cultivators in Malaysia,
    tractors have basically replaced male labor once needed for hoeing. Rice farming,
    which has long been considered to be primarily women''s work anyway, is now increasingly
    being left in the hands of the female labor force. Male labor, no longer essential
    for cultivation, has become not only freer to seek opportunities elsewhere, but
    has often had of necessity to do so. As a consequence, although out-migration
    is now growing in popularity among young women, it was initially utilized as an
    adaptive strategy among men, who in most cases still comprise the bulk of rural-urban
    migration streams.


    ## Regional Variations: Tanzania and Colombia


    Under other conditions, women are more likely than men to move out. For example,
    until 1970 males in Tanzania traditionally outnumbered females in comprising migration
    streams to the capital city. Since then, however, women have been found to outnumber
    men (Sabot, 1979). Bryceson (1985) has suggested that the increase in the proportion
    of female migrants to Dar Salaam may be due at least in part to a shift in the
    village; in fact, a woman''s livelihood is far less secure access to land and
    means of production conditional on her marital status" (Bryceson, 1985:141).


    If one focuses specifically on conditions at the origin or the destination in
    a particular country, instead of on broader-based societal variables, it is also
    apparent that different settings frequently produce quite different migration
    responses in males and females. In some situations, the division of labor at the
    origin can be such that the members of one sex hold much greater responsibility
    for production than do those of the other. The non-producers are then often more
    likely than the active producers to move away. In some instances, agricultural
    innovations have been responsible for altering the production process disproportionately,
    making the labor of either males or females superfluous, while leaving the demand
    for the other relatively unchanged.


    Fields (1979) has demonstrated how complicated the scenario may in fact be, even
    in situations in which surface appearances suggest very little. He has found that
    while females in Colombia are only slightly more likely than males to be migrants,
    they are much more responsive to economic pulls; however, when wage differentials
    are examined "both in an absolute and in a relative sense, men in Colombia have
    more to gain from migration than women" (Fields, 1979:261).

