- fmt: "\n- Reference category contains couples in which both spouses moved within\
    \ the first four years of marriage.\n- Reference category refers to women who\
    \ have not moved since marriage.\n- Reference category contains couples who do\
    \ not have frequent contact with either set of parents.\n\n* Significant at the\
    \ .10 level; ** Significant at the .05 level; ***Significant at the .01 level.\
    \ (1-tailed test of significance).\n\nThe coefficients in the four equations prove\
    \ to be negative, only the variable comparing couples in which neither spouse\
    \ moved with those in the reference category is found to be a significant determinant\
    \ of the woman's overall decision-making power. This most likely reflects the\
    \ relative inability of young women, who along with their husbands remained in\
    \ one place before and after marriage, to control central aspects of their lives.\
    \ In the majority of these cases one spouse is apt to have moved in with the other\
    \ spouse's family before their marriage took place. Intergenerational decision-making\
    \ dynamics, and not inter-spousal ones, therefore appear to be most important\
    \ when considering the relationship between this measure of residential mobility\
    \ and the overall status of women within the household in rural Java.\n\nSimilarly,\
    \ only the variable comparing couples in which neither spouse moved and couples\
    \ among whom only the husband moved with those in the reference category, significantly\
    \ predict the woman's ability to control the contraception decision. When only\
    \ the husband moved after the wedding, again commonly into the wife's parents'\
    \ home, the woman's ability to control decisions about the use of birth control\
    \ suffered considerably compared to cases in which both spouses moved. Some support\
    \ is thus attained for Hypothesis `6.1`.\n\nWhether or not a woman's post-marriage\
    \ relocation involved migration to another village is also of importance in predicting\
    \ her power within the household. If she moved to a new village within the first\
    \ four years of marriage, her ability to control decisions about the adoption\
    \ of contraception and the discontinuation of childbearing diminished substantially\
    \ (by 23 percentage points and 37 percentage points respectively). Conversely,\
    \ women who did not make an exogamous move played more dominant roles in making\
    \ contraceptive and childbearing decisions. As has been argued, the negative impact\
    \ of the longer distance move was probably the result of the removal of the migrants\
    \ from important social networks. Support is therefore also attained for Hypothesis\
    \ `6.3`.\n\nIn the case of the childbearing decision, however, it is found that\
    \ if the inter-village relocation occurred after the couple had been married for\
    \ more than four years, the move then significantly enhanced the women's decision-making\
    \ power (by 60 percentage points). This suggests that while new brides may benefit\
    \ from an adjustment period during which they remain in proximity to close social\
    \ contacts, once they become accustomed to married life those contacts diminish\
    \ in importance. Further, since exogamous moves that take place after four years\
    \ are less apt to be directed toward the home of in-laws and more toward independent\
    \ residences, later inter-village mobility can be of particular benefit to women\
    \ as it improves their control over childbearing decisions.\n\nWhether or not\
    \ a move occurs at all, however, and regardless of the timing and direction of\
    \ the move, the actual amount of contact the couple maintains with both spouses'\
    \ parents also proves to be central to the decision-making process. In this sample,\
    \ wives who, along with their husbands, saw parents on both sides of the family\
    \ at least once a week had more decision-making power. \n\n*(Note: The provided\
    \ source text contained a significant amount of repetitive/garbled text in the\
    \ latter half. I have processed the core narrative logic based on the coherent\
    \ first half as per the instructions.)*\n"
  raw: '[(a)](#Ch06.xhtml_bck_fn0002aa) Reference category contains couples in which
    both spouses moved within first four years of marriage.[(b)](#Ch06.xhtml_bck_fn0002ab)
    Reference category refers to women who have not moved since marriage.[(c)](#Ch06.xhtml_bck_fn0002ac)
    Reference category contains couples who do not have frequent contact with either
    set of parents.* Significant at the .10 level; ** Significant at the .05 level;
    ***Significant at the .01 level. (1-tailed test of significance).coefficients
    in the four equations prove to be negative, only the variable comparing couples
    in which neither spouse moved with those in the reference category is found to
    be a significant determinant of the woman''s overall decision-making power.This
    most likely reflects the relative inability of young women, who along with their
    husbands remained in one place before and after marriage, to control central aspects
    of their lives. In the majority of these cases one spouse is apt to have moved
    in with the other spouse''s family before their marriage took place. Intergenerational
    decision-making dynamics, and not inter-spousal ones, therefore appear to be most
    important when considering the relationship between this measure of residential
    mobility and the overall status of women within the household in rural Java.Similarly,
    only the variable comparing couples in which neither spouse moved and couples
    among whom only the husband moved with those in the reference category, significantly
    predict the woman''s ability to control the contraception decision. When only
    the husband moved after the wedding, again commonly into the wife''s parents''
    home, the woman''s ability to control decisions about the use of birth control
    suffered considerably compared to cases in which both spouses moved. Some support
    is thus attained for Hypothesis 6.1.Whether or not a woman''s post-marriage relocation
    involved migration to another village is also of importance in predicting her
    power within the household. If she moved to a new village within the first four
    years of marriage, her ability to control decisions about the adoption of contraception
    and the discontinuation of childbearing diminished substantially (by 23 percentage
    points and 37 percentage points respectively). Conversely, women who did not make
    an exogamous move played more dominant roles in making contraceptive and childbearing
    decisions. As has been argued, the negative impact of the longer distance move
    was probably the result of the removal of the migrants from important social networks.
    Support is therefore also attained for Hypothesis 6.3.In the case of the childbearing
    decision, however, it is found that if the inter-village relocation occurred after
    the couple had been married for more than four years, the move then significantly
    enhanced the women''s decision-making power (by 60 percentage points). This suggests
    that while new brides may benefit from an adjustment period during which they
    remain in proximity to close social contacts, once they become accustomed to married
    life those contacts diminish in importance. Further, since exogamous moves that
    take place after four years are less apt to be directed toward the home of in-laws
    and more toward independent residences, later inter-village mobility can be of
    particular benefit to women as it improves their control over childbearing decisions.Whether
    or not a move occurs at all, however, and regardless of the timing and direction
    of the move, the actual amount of contact the couple maintains with both spouses''
    parents also proves to be central to the decision-making process. In this sample,
    wives who, along with their husbands, saw parents on both sides of the family
    at least once a week had much lower overall decision-making power (by 22 percentage
    points) than did those with no regular contact with either set of parents. This
    effect is significant in the equations estimating women''s input into the decisions
    about childbearing and resource control as well, and it is particularly strong
    in the latter. Maintaining less frequent contact with both spouse''s parents improves
    a woman''s ability to influence decisions about the allocation of her own income
    by almost 43 percentage points. Support is therefore also found for Hypothesis
    6.2.It has been noted that in regions such as Central Java, where marriages are
    frequently arranged, the ability of women to influence decisions about their marriages
    is likely to be associated with their power to control later household decisions
    as well. That is found to be the case here. The coefficient for the variable measuring
    the amount of input the women in this sample perceived themselves to have had
    into the marriage decision is positive and highly significant in all but the resource
    control equation. This is as expected and may reflect variations in levels of
    tradition versus modernity in the backgrounds of the women surveyed. Those who
    have come from more traditional backgrounds may be more likely to allow others
    to guide household decisions over the life course, while those who have been exposed
    to more modern influences may be less willing to relinquish control.If so, the
    level of education attained by the woman would be expected to be closely associated
    with the variable measuring her input into the marriage decision. That appears
    to be the case only in the contraception equation, however. When the variable
    measuring input into the marriage decision is excluded from that estimation, the
    coefficient for the woman''s level of schooling is found to be significant and
    positive (data not presented). In all other estimations her educational attainment
    proves to be unrelated to her decision-making power.The income variables, on the
    other hand, are better predictors of the woman''s autonomy. Female earnings coefficients
    are positive and significant in measuring both the woman''s overall decision-making
    power and her input into the childbearing decision. The more income the wife makes,
    the more she has to say about important household matters. Some support is thus
    provided for the argument that increased access to resources enhances women''s
    control over central elements in their lives, as well as for the view that transfers
    of western or "modern" ideas, such as those espousing increased status for women,
    are apt to accrue first to higher socioeconomic status groups.If that is true,
    however, it is somewhat surprising that this variable fails to predict the woman''s
    input into the contraception decision. Higher earnings were expected to play a
    central role in allowing women greater access to information and services, and
    therefore in allowing them greater input into contraceptive decisions. That is
    not the case when the other variables are controlled, possibly because the earnings
    effects are offset by the intervention of government family planning advisors
    interested in increasing contraceptive prevalence. Low income women may be among
    those least able to resist official pressure to adopt a method of family planning.Also
    not anticipated was the finding that the actual amount of income the wife earns
    is of no statistical importance in enhancing her control over decisions governing
    its use. Instead, what is significant is the amount of money her husband brings
    home; the higher his income, the more she has to say about how the money she earns
    will be spent. While at very low levels of household income every increment must
    be allocated to meet basic needs, higher levels allow for more discretion in targeting
    consumption and investments. That the wife''s earnings are less important than
    her husband''s in this process is probably at least partly because many women
    seek employment in the cash economy only when it becomes necessary to supplement
    the low earnings of their husbands (Mangkuprawira, 1981).Finally, if female status
    has been improving over time in Indonesia, it should follow that the women who
    had been married the longest should be those with the least in-house decision-making
    power, In our sample, however, that is not found to be the case. Any effect of
    change over time as measured through marital duration is therefore probably offset
    by the fact that older women tend to have higher status within the family than
    do younger brides. Older women have had more time to accrue some power, and they
    have had more time to establish independent households as well.Since the two spouses
    are not the only ones involved in making many of these household decisions, as
    parents often continue to influence the decision-making process long after the
    couple is married, the variables that most influence the husband''s perceptions
    of his decision-making power must also be examined.It might be predicted that
    the variables that are most relevant to an inter-spousal dynamic, and that have
    a significant effect on the power of the wives, should have the opposite effect
    on the decision-making power of the husbands, while the variables that pertain
    more to the intergenerational dynamic should affect the two spouses similarly.
    The results presented in [Table 6.6](#Ch06.xhtml_cap_lbl0023) provide only very
    limited support for this argument. For example, all of the mobility variables
    and all of the parental contact variables are statistically unimportant in predicting
    the overall decision-making power of the men in this sample. The amount of input
    males perceive themselves to have in making major household decisions is thus
    unaffected by the timing or distance of post-marriage migration, or by the amount
    of contact that is maintained with the parents on either or both sides of the
    family.A certain element of the intergenerational dynamic does appear to play
    a role in the decision-making process, however. As was the case among women, husbands
    who feel they had a considerable amount of input into the marriage decision also
    tend to be those who feel they have had substantial control over subsequent decisions.In
    the inter-spousal dynamic, it is found that while the education variables fail
    to predict the husband''s relative status within the household, the income variables
    do significantly affect his decision-making power. The higher his earnings, the
    greater his control over household decisions.[TABLE 6.6:](#Figures.xhtml_bck_cap_lbl0023)
    DETERMINANTS OF THE HUSBAND''S DECISION-MAKING POWER WITHIN THE FAMILY'
