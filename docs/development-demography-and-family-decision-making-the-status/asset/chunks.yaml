    # Introduction

    In one of the more comprehensive studies of the characteristics of female migrants
    in the Third World, data from 40 countries were examined (Youssef et al., 1979).
    The results suggest that the majority of women move either as mid-to-late adolescents,
    when in their early twenties, or when aged 50 or above. (Similar findings have
    also been reported by de Oliveira and Garcia, 1984). Women who migrate from rural
    places to cities are generally single, but those going in the opposite direction
    tend to do so in association with their husbands. Women over 50 years of age,
    a large proportion of whom are widowed, divorced, or separated, move both to and
    among cities, and in some areas single pregnant women are apt to comprise another
    part of rural-urban streams. However, single women, pregnant or not, are not likely
    to become return migrants once in the city (Castro et al., 1978).


    Given the findings of these writers, it appears that the women who move from the
    country to the city tend to be those who, due to their youth, have not yet established
    conjugal or economic ties in their places of origin, or those who, due to their
    advancing ages, have had such ties severed.


    ## Regional Patterns of Migration

    Some support for this pattern has been offered by Ranney and Kossoudji (1983).
    According to their study of Mexican migrants to the United States, most women
    move either when they are quite young or much older, while those in their prime
    childbearing years generally stay behind in Mexico. Arizpe''s (1981) study of
    internal migration from two rural Mexican villages has provided further evidence
    of the pervasiveness of migration among unattached women, but that study did not
    focus on women at both ends of the bi-modal age distribution. Instead, it concentrated
    on women who leave for Mexico City while in their early to mid-teens. Those women
    generally go as part of a family strategy to improve the economic well-being of
    the group, work for several years, and then return to the rural areas in their
    late teens or early twenties to raise a family.


    In Malaysia, Khoo and Pirie (1984) found that 44.5 percent of the women who moved
    from rural to urban areas did so between the ages of 10 and 19. In addition, according
    to Piampiti (1984), most of the women who migrated to Bangkok from four selected
    rural villages moved when they were young adults, generally between the ages of
    15 and 24. Eighty percent moved when they were single, although the percentage
    of married migrants did increase with age (Piampiti, 1984).


