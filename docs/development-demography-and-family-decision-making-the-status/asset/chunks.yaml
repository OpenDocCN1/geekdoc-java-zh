    最近的人口普查数据可以让我们了解提高印度尼西亚女性教育水平运动至今进展了多远。数据显示，尽管该国整体女性识字率在 1961 年至 1971 年间从 22%增加到
    32%，但在 1971 年人口普查时，大多数印度尼西亚女性仍然不识字。到了 1980 年，情况已大不相同；当时 10 岁以上的女性人口中有 63.6%被归类为识字人口。尽管印度尼西亚女性的识字率仍低于男性（1980
    年人口普查时，男性识字率已超过 80%），但女性的整体地位在近年来似乎有了显著提高。


    在爪哇，男女的识字比例均高于全国平均水平。在 1980 年的人口中，十岁以上的人群中，约 75%的女性和 90%的男性已识字。为了增加女性的教育机会，社区教育部门针对女性群体在非正式教育计划中设立了
    48 门课程，其中包括识字班。决策制定者认为，教育的提高应该增加女性就业的机会，提高“自我表达和独立性”，将“知识和技能提升到新社会秩序的新高度”，并提供一种“变革的动力”（Mangkuprawira,
    1981:91）。


    然而，该部门项目的更具体目标并不总是遵循传统的西方模式。例如，其主要目标之一是“教育女性作为家庭主者的角色”（Mangkuprawira, 1981:91）。同样被强调的是营养和健康信息。由于人们普遍认为，教育、健康和营养实践的不足不仅会干扰个人的生活水平和整体健康，还会降低他们的生产力，从而降低他们为自己赢得足够支持的能力，因此，提高女性在这些每个领域知识的尝试被视为近期政策倡议中至关重要的（Bangun,
    1981）。


    除了健康和卫生课程外，女性还学习了缝纫等基本技能（Mangkuprawira, 1981）。尽管有些人认为增加这种程度的教育是提高印度尼西亚女性地位的一种方法，但许多女性仍然未能参加现有的课程（Bangun,
    1981）。这在很大程度上是因为这些课程不仅需要时间，还需要钱。全职女性通常缺乏时间，而没有工作的女性通常缺乏金钱。因此，成功的障碍是相互关联的：低教育阻碍了更好的就业，而财务资源的匮乏则阻碍了教育程度的提高。


    例如，许多对缝纫班感兴趣的女性仅维持生计水平生活，无法负担参加课程所需的布料。那些能够参加的人在完成课程后往往无法获得贷款，结果导致这些课程对他们来说几乎没有实际益处。同样，识字计划往往并不适用于目标群体。许多识字计划所使用的材料对于女性来说既不够简单，对她们的生活也不够实用（Bangun,
    1981）。


    最后，人们发现，在男性存在的情况下，女性仍然不愿发声，在接受教学时她们经常感到不适（Epstein, 1981）。如果教育要成为提高女性地位的有效工具，这些问题必须得到解决。


    然而，教育问题不仅局限于成年人。儿童的教育也经常被忽视。其原因通常是财务考虑，尽管富裕家庭经常让孩子辍学。在这种情况下，学校设施可能不足，或者父母可能并不理解教育的益处。在其他情况下，父母意识到教育的潜在益处，但担心如果孩子接受了教育，他们就会对农耕生活厌倦并去其他地方（Koentjaranrat,
    1967）。


    ## 居住模式


    无论印度尼西亚女性完成了什么程度的教育，预计她们最终都会结婚并组建家庭。研究的核心问题之一是，夫妇对居住地的选择是否会影响双方在家庭决策中行使权力。关于爪哇夫妇结婚后倾向于住在哪里说法不，，似乎有几种共同的选择。


    根据 Koentjaranrat（1967）的观点，大多数夫妇最终希望建立自己的家庭。然而，由于很多人结婚时很年轻，他们通常必须先和父母住几年（通常为五年），然后搬到自己的地方。在这种情况下，夫妇更有可能住在妻子父母身边，而不是丈夫父母身边，以考虑到妻子的感受。一旦夫妇变得独立，他们更有可能在妻子父母附近建立新家，而不是搬到另一个村庄或同一村庄较远的地方。事实上，已婚女性在整个生活中继续与父母住在一起并不罕见，并继承他们的房屋（Koentjaranrat,
    1967）。

