    # 1. The Role of Women in Socio-Economic Development


    Research questions are frequently raised about the nature of the family as an
    entity, the types of relationships that exist among its members, and the associations
    between the family and society. Across cultures, the family has been essential
    to the foundation of the social structure, forming the basis for class hierarchies
    and bearing responsibility for the initial socialization of virtually all of society''s
    members. As the process of diversification has begun to take hold in many parts
    of the world, the family has also served as a vital link between individuals and
    emerging institutions (Goode, 1982).


    Over time, however, the collective elements involved in social and economic development
    have in turn precipitated substantial change in the form and function of the family
    as a unit. The extent to which this evolution has occurred varies widely, but
    Goode (1982) has outlined 14 elements that have been instrumental in most family
    transitions worldwide. These include decreasing matriliny, decreasing power and
    prestige of "corporate kin groups," declines in the prevalence of bride prices
    and dowries, a narrowing of the age difference between husbands and wives, decreasing
    control by parents of their children''s choices in marriage partners, and increases
    in autonomy among women.


    While all of these developments are important in their own right, the latter two
    are the focus of attention in this research. The first is of interest because,
    although much has been written about the timing of marriages in less developed
    countries (Dixon, 1971; Smith, 1980), and considerable information exists about
    the relative strength of inputs from the marriageable individual versus other
    family members in the selection of the spouse (Goode, 1963), few analyses have
    been conducted to determine which factors most influence the balance of decision-making
    power between those getting married and their families. Instead, the variables
    that determine whether marriageable individuals act relatively autonomously (with
    the betrothed playing the primary role in the marriage decision), or whether the
    decision is generally made under the direction of others in the family or community,
    have remained largely unexplored in the literature.


    Also neglected have been the factors that affect the extent to which women are
    able to control other central matters within the household. Because increased
    attention has recently focused on the importance of women''s roles and statuses
    as both determinants and consequences of demographic change, the need to determine
    which social agents most enhance or detract from their overall status has become
    all the more pronounced.


    In this research the analysis will focus first on the dynamics involved in the
    marriage decision, and then on how a number of social and demographic processes,
    especially migration, influence the ability of women to control family decisions
    once they are married. Ultimately, the impact of variations in levels of autonomy
    among women upon specific demographic outcomes will also be assessed. Before these
    issues can be analyzed in any depth, however, it is necessary to place them in
    a broader social context. Also included, therefore, is some discussion of how
    the roles and statuses of women appear to have been affected over time by the
    interrelated processes of population growth and socio-economic development.


    In addition, because the issues raised in this research are fairly specific, involving
    the family dynamics surrounding decision-making and decision outcomes, questions
    as to whether or not, and if so to what extent, the topics investigated might
    be of interest to policy makers with a still wider focus, also warrant some attention.
    As a consequence, some of the issues most central to the debate about population
    growth and economic development are introduced in the following discussion, and
    some of the ways in which the topics explored in this study might be seen as part
    of the larger picture are delineated.


    ## Population and Development: An Overview

