- fmt: '

    In summary, some support is found for ail three of the hypotheses tested in this
    chapter. Hypothesis `6.1` predicted that the residential relocation of both spouses
    within four years of marriage would result in increases in the intra-household
    status of the wife, compared to cases in which neither spouse moved, only one
    relocated, or they both moved after more than four years of marriage. The results
    demonstrate that when neither spouse moves within the first four years, or when
    only the husband moves, the wife has considerably less input into decisions about
    initiating contraceptive use than is true when both husband and wife relocate.
    In addition, when the overall decision-making power of the woman is estimated,
    her intra-household status is lower in cases in which neither spouse moves than
    in those in which both relocate within the first four years of their union.


    These findings demonstrate that women can gain influence within the household
    through residential mobility. Because the coefficients remain significant even
    when the amount of contact that is maintained with parents on both sides of the
    family is controlled, it is clear that the actual physical relocation of the couple
    has an independent effect upon the wife''s overall decision-making power, as well
    as on her ability to control the outcome of contraception decisions.


    It is also found that if a woman''s post-nuptial relocation takes her beyond the
    borders of her village, her decision-making power suffers compared to women who
    do not make an exogamous move. This has been argued to be the result of loosening
    ties with important social networks. The effect is significant for the contraception
    decision, as well as for the decision about curtailing childbearing. Support is
    therefore also lent to Hypothesis `6.3`. If, on the other hand, the inter-village
    relocation takes place after the couple has been married for at least four years,
    the wife''s decision-making power is found improve improve. At that point the
    importance of initial support systems seems to diminish, while the establishment
    of an independent residence becomes especially salient in the decision-making
    process.


    In addition to post-marriage mobility, parental contact is a strong predictor
    of a woman''s power to influence decision outcomes. This supports Hypothesis `6.2`.
    When parents on both sides of the family are seen regularly, the wife''s intra-familial
    status suffers compared to cases in which no regular contact is maintained with
    parents on either side. This is the case in the estimation of the woman''s overall
    decision-making power, as well as in decisions regarding the discontinuation of
    childbearing and the allocation of the wife''s earnings.


    Admittedly, several levels of participation are likely to be involved in these
    decisions. That is, in fact, assumed to be the case. Although parents may not
    directly control the final decisions of their children, they are often able to
    exert a great deal of influence over the thought processes that lead up to them,
    as well as over the contexts in which the decisions are made and outcomes implemented.
    This is particularly true as long as sons and daughters continue to co-reside
    with their parents, or to see them several times a week. Indeed, the importance
    of the intergenerational dynamic in the process is confirmed in this analysis,
    as previous input into the decision to marry is found to be significant and positive
    in four of the five equations estimated; the more input either respondent had
    into the decision to marry, the more control she or he is then able to exert in
    later household decisions as well.


    To conclude, migration at or after marriage, the amount of contact that is maintained
    with parents on both sides of the family, prior decision-making power, and to
    a certain extent levels of socioeconomic status, all operate across cohorts to
    influence the amount of control women in Central Java are able to exert over important
    family decisions. Among men in this sample, perceptions of their own decision-making
    power are best predicted by the length of time spent in the current marital union,
    the cash earnings of both spouses, and the amount of input their wives have into
    household decisions.


    # 7 Contraception and Fertility


    In this portion of the analysis, the relationships between the status of women
    within the Javanese family and their contraceptive use and fertility behavior
    are assessed. The information presented in `Chapter 2` suggested that women with
    higher status within the family should be more likely to use contraception and
    to exhibit low levels of fertility than should women with less autonomy. In addition,
    women with high status on a second dimension, that which compares individuals
    across households on indicators such as education and income, should be more likely
    to be ever-users of birth control and to have smaller families than should women
    with lower status on that dimension.


    Specifically, the following hypotheses are suggested:


    - (7.1) Women who have high intra-household status will be more likely to be ever-users
    of contraception than will women with low status within the household.

    - (7.2) Women who have high intra-household status will have lower fertility than
    will women with low status within the household.

    - (7.3) Women who have high extra-household status will be more likely to be ever-users
    of contraception than will women with low status on that dimension.

    - (7.4) Women who have high extra-household status will have lower fertility than
    will women with low status on that dimension.


    As was discussed in `Chapter 3`, over the past twenty years the government of
    Indonesia has been firmly committed to bringing about reductions in overall fertility
    rates by increasing contraceptive use and efficacy throughout the country. Of
    the major islands, Java now has the lowest total fertility rate (the `1980 TFR
    = 3.89`), and of the provinces on that island, Central Java has been moderately
    successful compared to the other provinces; (the `1980 TFR = 4.08`).


    The percent distribution of children ever born (`CEB`) to the women in this sample
    is displayed in `Table 7.1`.


    #### TABLE 7.1 PERCENT DISTRIBUTION OF CHILDREN EVER BORN


    | Number of Children Ever Born | Percent |

    | --- | --- |

    | 0 | 4.1 |

    | 1-2 | 25.9 |

    | 3-4 | 30.9 |

    | 5-6 | 18.5 |

    | 7 or more | 20.6 |

    | **Total** | **100.0** |

    | **Mean** | **4.13** |

    '
