    with female migration, women''s associational moves may be covered in their analyses,
    at least for those in the upper strata. For the others, resources may determine
    whether or not the wife is given the option of accompanying her husband, togetherness
    often being "a luxury beyond reach for the very poor" (Ware, 1981:147).As a rule,
    the literature concerning the migration of women in the Third World probably best
    supports the contentions of Connell et al. (1976); whether the move is autonomous
    or associational, it is not the very poor who are the most apt to move. Although
    a great many migrants come from lower-class families, at least some resources
    are generally required in order to finance their moves. In their study of Thailand,
    for example, Lightfoot et al. (1983) found that most migrants tend to be those
    with enough wherewithal to gather information about their destinations and eventually
    cover the costs of relocation. Arnold and Piampiti (1984) agree, noting that migrants
    to Bangkok generally come from provinces to which at least some of the benefits
    of development have accrued, while the poorest rural dwellers are much less likely
    to move.The educational attainment of the ideal-typical female migrant has also
    been debated. Although higher learning, in and of itself, has frequently been
    found to be an important determinant of migration (Goldstein, 1973; Sabot, 1979),
    Youssef et al. (1979: 4) have asserted that their data fail to substantiate that
    Finding "insofar as women are concerned." It is possible that this is because,
    relative to those who move autonomously in search of employment or advanced degrees,
    many of the women who move assoeiationally do not require the most selective characteristics
    to accomplish the goals of their moves.Despite evidence to the contrary, however,
    female migrants in developing countries do tend to be relatively well-educated.
    For example, although 22.3 percent of the female migrants in one study of Malaysia
    reported having had no formal schooling at all, the educational attainment of
    the migrants as a group compared favorably with that of the women in the general
    population. Both urban and rural non-movers were more apt to report having had
    absolutely no formal education than were the migrants themselves, and the migrants
    were more apt than either group of non-migrants to have completed some years of
    primary school. The only category in which the migrants had less education than
    either group of non-migrants was that measuring completion of secondary education.
    Urban stayers were found to be more likely than in-migrants to have completed
    a high school degree. Otherwise, the migrants in that study of Malaysia appeared
    to be better educated than non-migrants across education categories (Khoo and
    Pirie, 1984).Elsewhere the amount of schooling completed by female migrants generally
    falls somewhere between that of urban and rural stayers. (See, for example, Eviota
    and Smith (1984)). The bulk of available evidence thus suggests that there is
    at least a certain amount of educational selectivity among female migrants. Such
    findings have been reported in Kenya (Knotts, 1979), Chile (Herold, 1979), Lesotho
    (Murray, 1981), Sierra Leone (Byerlee et al., 1977) and Zambia (Chilivumbo. 1985).Even
    in countries in which women attain very little schooling, migrants appear to surpass
    non-migrants on education indicators. For example, although both migrant and non-migrant
    women in Pakistan are often completely illiterate, women who are multiple movers
    clearly have the edge in education over women who do not move at all. Shah (1984)
    has estimated that while 89 percent of female nonmovers in that country are illiterate,
    "only" 62 percent of female multiple movers have completed no schooling. Indeed,
    the association been migration and education holds even when age and marital status
    are controlled (Shah, 1984).Finally, the level of education and the destination
    of the migrant are often related. Eviota and Smith (1984) have found, for example,
    that in the Philippines the women with the most schooling tend to be those most
    likely to move to a metropolitan area. Women who are relatively well educated,
    but who have had noticeably less schooling than their metro-bound counterparts,
    are apt to gravitate toward other urban centers, while the women with the least
    education generally stay in the rural areas.Although numerous exceptions may certainly
    be cited, the association between educational attainment and migration appears
    to be stronger than either the relationship between migration and wealth, or between
    migration and marital status.'
