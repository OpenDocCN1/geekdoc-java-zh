    当对已育子女数量的决定因素进行研究时，发现女性在家庭内部地位的影响似乎完全消失了。衡量女性决策权与其生育率之间二元关系的数据列在表 7.10 中。卡方检验显示，这两个变量之间的相关性并不显著（`p
    = .90`）。这再次与预期相悖，表明要么衡量女性地位的指标不够充分，要么在印度尼西亚的背景下，女性的决策权与生育行为并不相关。这两种可能在不同程度上都是真实的。^(8)


    另一种可能性是，女性地位对印度尼西亚生育率的影响是间接的，主要通过避孕的使用或不使用，或者通过其他许多变量影响生育行为。然而，如果是这样，其发挥作用的路径仍然模糊。例如，决策权水平较高的女性使用避孕的概率较低，但比地位较低的女性更倾向于表达对小家庭的偏。因此，地位的间接影响可能会相互抵消。


    也许最显著的问题是第 2 章中提出的一个。有人认为，许多关注女性地位和生育率的分析中存在一个问题，即几乎无一例外假设女性想要限制生育，而丈夫并不想。虽然这项分析没有假设这种情况，但检查该样本中配偶双方的生育目标在多大程度上实际上一致是很有用的。结果显示在表
    7.11 中。数据表明，事实上，爪哇岛的夫妻之间在家庭规模理想上的分歧非常小。大多数案例（261 对夫妇，占 66.2%）都都落在对角线附近，这表明在几乎三分之二的受访者中，女性与其丈夫的生育偏好是完全一致的。


    在存在分歧的地方，差异往往并不极端，且在男性期望家庭比妻子大、以及女性期望家庭比丈夫大的案例之间，分得较为均匀。在 16.5% 的案例中，男性倾向于比女性多孩子，而在
    17.3% 的案例中，情况反之。这表明该话题可能是一个经常被讨论的话题，结果是，男性和女性往往会对他们的生育目标达成共识。


    TABLE 7.11: 丈夫与妻子的家庭规模理想

    ![Image](img/12.jpeg)


    除了女性决策权与其生育率之间缺乏相关性外，其他二元测试的大多数结果均符合预期。例如，已育子女数量与男女双方的受教育程度之间存在显著的负线性线性关系。结果显示在表
    7.12 中。


    同样，婚姻持续时间与生育率强相关（`p = .000; r = .678`）。随着夫妻结婚年限的增加，女性所生育的孩子数量也随之增加。这可能不仅是因为暴露于生育风险的时间长短不同，还因为随着时间推移发生的家庭规模偏好的变化。数据列在下方的表
    7.13 中。


    从表 7.14 的数据中可以明显看出，家庭规模偏好的变化与该样本中女性已育子女的数量密切相关。无论是因为理性化还是实际的目标设定，这种相关性都是线性且正向的（`p
    = .000; r = .347`）。


    在预测整体生育率的另一个重要因素是女性结婚的年龄。人们通常认为晚婚的女性比早婚的女性更不“传统”，而且晚婚女性暴露于生育风险的时间也更短。由于爪哇农村不容许婚前性行为，初婚年龄应该是该地区生育率特别好的预测指标。二元相关性测试表明，事实确实如此（表
    7.15）。生育率与初婚年龄之间的关系是显著且线性的。发现晚婚的女性生育的孩子数量比早婚的女性少，反之亦然（`p = .000; r = .194`）。生育过一个或两个孩子的女性平均结婚年龄为
    18.8 岁，而生育七个或更多孩子的女性平均结婚年龄则少得多，为 15.7 岁。


