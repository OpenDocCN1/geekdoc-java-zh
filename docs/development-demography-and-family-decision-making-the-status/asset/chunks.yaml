    \ the concept of the status of women has been defined in a number of different\
    \ ways. One relatively comprehensive, but broad definition suggests that status\
    \ includes the elements of \"the degree of women's access to (and control over)\
    \ material resources (including food, income, land, and other forms of wealth)\
    \ and to social resources (including knowledge, power, and prestige)...\" (Dixon,\
    \ 1978:6). Safilios-Rothschild (1982) has further demonstrated the complexity\
    \ of this concept by distinguishing between different types of status, such as\
    \ gender and SES, emphasizing the importance of their interrelationships and separating\
    \ status on the interpersonal level, called \"power,\" from that on a broader\
    \ scale.\n\nSince this research is primarily concerned with status (or power)\
    \ within the family, concepts related to this form of status will be addressed\
    \ first. These include among others: the \"ability to control decisions about...\
    \ productive and economic activities, including the freedom of movement and control\
    \ over the resulting wages or income\" (Safilios-Rothschild, 1982:128), the power\
    \ to direct the services of others who aid or fill in for the woman in her domestic\
    \ responsibilities, the ability to control the composition of the household, the\
    \ amount of leisure time the wife has compared to her husband, and the amount\
    \ of input she has in major decisions such as family size (including whether or\
    \ not, and if so, when to have a child), migration, and large purchases (Safilios-Rothschild,\
    \ 1982).\n\nOf these components of status, the power to have an input in major\
    \ decisions is of primary importance to this research. Of the several elements\
    \ initially considered^([6](#Ch04.xhtml_fn0017)) questions relating to the decision-making\
    \ process were found to be the easiest to convey to the respondents. As a consequence,\
    \ the status of women within the family was indexed on the basis of their decision-making\
    \ power in several central aspects of their lives. As was true of the marriage\
    \ decision questions, the respondent was asked for each decision whether 1) she\
