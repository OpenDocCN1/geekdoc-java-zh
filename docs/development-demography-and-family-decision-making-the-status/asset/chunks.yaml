    ### 1.

    Smith (1982) 对印度尼西亚婚姻模式的研究表明，离婚和再婚在爪哇岛和巴厘岛很常见。他利用 1976 年全国人口普查调查的数据证明，在调查前已婚结婚少于
    5 年的已婚女性中，有 20%在调查时被列为离婚或分居。在这些女性中，有 35%已经再婚。在调查前结婚 15-19 年的女性中，有 38%离婚或分居，且该组人群中有
    85%的人已经再婚。


    ### 2. 尽管婚前的居住地社区和女性父亲的受教育程度在该方程中仍然具有显著性，但妻子受教育程度和其婚龄的影响却大幅削弱，并变得不显著（两种情况下的 `p`
    值均为 `.06`，单侧检验）。正如前面提到的，年龄较大时结婚的人往往倾向于是较晚婚姻队列的成员（`婚龄与婚姻持续时间的相关性为 -.518`）。另一个令人感兴趣的事实是，当将婚姻持续时间纳入估算时，衡量结合顺序的变量重新获得了显著性（`p
    = .05`）。虽然婚龄变量的加入削了结合顺序的影响，但婚姻持续时间的加入表明，在持续时间变量的不同类别内结合顺序存在显著差异，而这种差异在跨类别时并不明显。其原因尚不清楚。这可能是由于不同队列之间首次婚姻及后续婚姻时机的差异造成的。


    ### 3.

    McNicoll 和 Singarimbun (1983) 提供的证据表明，情况确实可能如此。1961 年至 1979 年间，婚龄的性别差异显著缩小，爪哇岛是这种变化最显著的地点之一。


    # 婚后迁移与女性地位


    在延续上一章对婚姻决策中个人投入的评估之后，本章的核心目标是调查女性结婚后在家庭内部整体决策权的决定因素。一些影响配偶选择时投入的因素（如受访者的教育程度和在当前关系中所花费的时间）预计将在整个生育期内继续影响家庭决策过程。此外，诸如婚后或婚后不久的流动或迁移，以及进入婚姻关系后与双方父母保持的联系频率，预计也会影响家庭内部地位的水平。正如所注意到的，与不经常联系的情况相比，夫妻与双方父母之间的频繁接触预计会降低妻子在家庭中的地位。另一个不相关的观点是，双方在结婚后四年内的搬迁应该提高妻子在家庭中的决策权。然而，如果夫妻在结婚时的流动要求女性必须出婚，那么其社会关系的中断可能会抵消迁移带来的收益，并对其地位产生负面影响。


    更正式地说明，结合`第 2 章`和`第 3 章`提供的信息，提出以下假设：


    6.1) 婚后双方的居住地迁移将与双方均未移动或仅有一人移动的情况相比，使妻子获得更高的家庭内部地位。


    6.2) 与一方或双方父母保持频繁联系的女性，其家庭内部地位将低于不与双方家庭父母保持频繁联系的女性。


    6.3) 如果女性婚后的居住地迁移需要她离开村庄，那么与没有更换村庄的女性相比，她的家庭内部地位将下降。


    #### 表 6.1：按性别划分的婚后流动情况


    | 流动指标 | 受访者性别 | |

    | :--- | :--- | :--- |

    | 男性百分比 | 女性百分比 | |

    | 样本百分比： | | |

    | 移动过的人 | 61.9 | 72.3 |

    | 未移动过的人 | 38.1 | 27.7 |

    | 总百分比 | 100.0 | 100.0 |

    | 在移动过的人中，相对于婚姻的时间： | | |

    | 4 年内 | 81.1 | 82.1 |

    | 4 年后后 | 18.9 | 17.9 |

    | 移动者总计 | 100.0 | 100.0 |

    | 在移动过的人中，移动类型： | | |

    | 婚内迁移 | 58.5 | 49.6 |

    | 外婚迁移 | 41.5 | 50.4 |

    | 移动者总计 | 100.0 | 100.0 |

    | 总人数 | 394 | 394 |


    ## 婚后流动


    婚后流动数据见`表 6.1`。数据表明，大多数人实际上更换了地点。正如预期的那样，大多数人在前四年内移动了。大约 62%的男性和 72%的女性经历过婚后迁移，在这些人中，81.1%的男性和
    82.1%的女性在四年内移动了。


    绝大多数受访者在结婚前与父母同住。91.9%的女性共用住处，80.7%的男性也是如此。虽然调查的夫妻中略占多数（56.3%）建立了与双方父母独立的家庭，但婚后与公婆同住也很常见。43.7%的女性受访者声称婚后与一方父母同住。在这些女性中，30.1%与自己父母在一起，13.6%与丈夫家庭在一起。关于同住模式的数据见`表
    6.2`。


    在婚后移动的女性中，约有一半跨越了村庄边界，而 41.5%的丈夫是外婚迁移。在更换村庄的女性中，25.2%直接搬进了公婆家，而只有 12.8%在自己村庄内移动的女性也是如此。


    ## 父母联系


    然而，无论是否移动，以及移动是否涉及跨村迁移，大多数受访者（男女）都继续与他们的父母保持定期联系。大约四分之一的夫妻报告每周至少探望双方父母，且超过 46%的人每周至少探望一次丈夫（21.3%）或妻子（24.9%）的父母。剩余的
    28.7%夫妻报告没有每周探望任何一方父母。


    `表 6.3`提供了有关受访者在调查时与每位健在父母所保持联系频率的信息。数据证明，在爪哇农村，父母联系频率极低的探望模式是罕见的；在任何给定类别中，少于
    12%的个人报告看到母亲或父亲每月少于一次。


