    在最后的分析章节中，因变量是是否使用过避孕措施，以及调查时受访者已育子女的数量。对于前者，因变量是二分类的，标记为 1 表示该夫妇在这段婚姻期间中使用过避孕措施，标记为
    0 表示未发生过此类使用。第二个变量简单来说就是该女性一生生育过的子女总数。


    在该章节中，女性在家庭中的决策权被引入为避孕使用和生育率的独立预测因子。然而，资源控制变量被用作女性地位的唯一预测因子，以替代了综合衡量指标，因为地位的其他组成部分与衡量避孕情况的因变量高度相关。由于只有使用过避孕措施的女性才被问及有关避孕决策的问题，因此所有从未使用避孕者在该变量上的得分均编码为
    0。此外，本样本中使用过避孕措施的女性似乎主要是为了停止生育而非间隔生育。因此，很大比例使用过避孕措施的女性在两个决策变量上均有非零分，而许多未使用者在衡量避孕决策投入的变量上没有得分（0
    除外），且较少人在衡量生育决策权力的变量上具有非零分。由于样本中 75% 的女性在调查前一年有现金收入，因此资源控制变量最适用于这部分分析。尽管在研究实际生育率时对使用综合指标的限制较小，但在分娩估计中遵循了相同的程序。


    避孕方程中使用的流动变量与上述描述的相似，但忽略了移动的时间。是妻子还是丈夫单独移动、他们共同移动、还是两人都没有移动，是核心问题。这些变量与衡量每位配偶受教育程度、女性收入（取对数）以及夫妇在当前婚姻中的持续时间变量一起考察。由于在初步的双变量分析中观察到避孕与婚姻持续时间之间存在微的曲线关联，因此持续时间变量被分为三个虚拟变量。第一组包括结婚
    15 年或更少的人，第二组由婚姻 16 至 25 年的人组成，第三组包括婚姻 26 年或以上的人。研究发现，女性婚前居住的社区规模（如前文定义）与因变量具有显著的二元相关性，因此也被包含在此部分的分析中。


    第 7 章中使用的唯一额外变量包括：一个衡量想要更多孩子意愿的变量，以及一个衡量夫妻之间讨论避孕频率的变量。前者是简单的二分类，标记为 1 表示妻子打算再生一个孩子（占样本的
    27.7%），标记为 0 表示她无此意（占样本的 72.3%）。对于衡量妻子丈夫就避孕话题讨论程度的变量，0 表示未进行讨论，1 表示此类讨论极少发生，2
    表示发生较为频繁，3 表示发生相当频繁，4 表示非常频繁。研究导师建议不要尝试获取该变量的更详细信息。


    由于因变量是二分类的，所有独立变量均通过 `regression`（回归分析）对因变量进行回归。对于最后一组估计女性子女数量的方程，唯一尚未定义的独立变量是衡量妻子认为理想状态下子女数量的变量。夫妇是否使用过避孕措施被包含在第二个方程中，并已在上述文中描述。


