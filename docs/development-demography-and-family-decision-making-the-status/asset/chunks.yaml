    - 参照组包含夫妻双方在结婚后头四年内发生过搬迁的夫妻。

    - 参照组指婚后未曾搬迁的女性。

    - 参照组包含与双方父母均未保持频繁联系的夫妻。


    * 在 .10 水平上显著；** 在 .05 水平上显著；***在 .01 水平上显著。（单侧显著性检验）。


    四个方程中的系数均证明为负，唯有将“夫妻双方均未搬迁的夫妻”与“参照组”进行比较的变量，被发现是女性整体决策能力的显著决定因素。这很可能反映了年轻女性在结婚前后与其丈夫都留在同一地点的情况下，缺乏控制生活核心层面的能力。在大多数此类情况下，一方配偶往往在结婚前就已经搬到了另一方父母的住处。因此，在考虑爪哇岛农村地区这种居住流动性衡量与女性在家庭中整体地位之间的关系时，代际决策动态而非夫妻间动态似乎最为重要。


    同样，只有将“双方均未搬迁的夫妻”以及“仅丈夫搬迁的夫妻”与“参照组”进行比较的变量，能显著预测女性控制避孕决策的能力。当仅丈夫在婚后搬迁（通常是搬到妻子父母家）时，与夫妻双方都搬迁的情况相比，女性控制避孕使用决策的能力遭受了大幅损害。因此，假设
    `6.1` 获得了一定的支持。


    女性婚后搬迁是否涉及迁移到另一个村庄，对于预测她在家庭中的权力也至关重要。如果她在结婚后头四年内搬到了新村庄，她控制采取避孕措施和停止生育决策的能力大幅下降（分别减少了
    23 个百分点和 37 个百分点）。相反，未进行外婚式搬迁的女性在做避孕和生育决策时发挥了更主导的作用。正如所论的，远距离搬迁的负面影响可能是由于迁移者离开了重要的社会网络所致。因此，假设
    `6.3` 也得到了支持。


    然而，在生育决策方面，发现如果村庄间的搬迁发生在夫妻结婚满四年之后，那么这种搬迁会显著增强女性的决策能力（增加了 60 个百分点）。这表明，虽然新娘可能从一段邻近亲密社交圈的调整期中获益，但一旦她们习惯了婚姻生活，这些社交接触的重要性就会下降。此外，由于四年后的外婚式搬迁不太可能指向准姻父母家，而是更多指向独立住所，因此晚期的村庄间流动对女性特别有益，因为它提升了她们对生育决策的控制力。


    然而，无论是否发生搬迁，无论搬迁的时间和方向如何，夫妻与双方父母保持的实际接触量也证明是决策过程的核心。在样本中，那些与丈夫每周至少见双方父母一次的妻子拥有更高的决策权。


    （注：提供的源文本在后半部分包含大量重复/乱码文本。已根据指令，基于连贯的前半部分对核心叙事逻辑进行了处理。）

