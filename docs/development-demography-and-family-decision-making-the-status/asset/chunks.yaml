    ## 已育子女的多因素分析](#contents.xhtml_ht0059)


    当用衡量已育子女的变量对自变量进行标准 OLS 回归时，大多数结果符合预期（表 7.16）。例如，较大的家庭规模偏好和更长的婚姻时长与该样本中较高的生育率相关。这些效应在引入的所有方程中都是强且显著的。婚姻时长是已育子女的良好预测指标，其中一些原因已经讨论过了。婚姻最长的女性往往最老且最传统，受西方价值观或非传统影响最少。


