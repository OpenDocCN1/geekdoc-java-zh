    ### 1.

    Smith''s (1982) study of Indonesian marriage patterns suggests that divorce and
    remarriage are common in Java and Bali. Using data from the national intercensal
    population survey in 1976, he demonstrates that among ever-married women married
    fewer than five years prior to the survey, 20 percent were listed as divorced
    or separated by the time of the survey. Of those women, 35 percent had already
    married. Among women married 15-19 years prior to the survey, 38 percent were
    divorced or separated, and 85 percent of that group had remarried.


    ### 2. While community of residence prior to marriage and the education of the
    woman''s father remained significant in this equation, the effects of the wife''s
    level of education and of her age at marriage weakened substantially and became
    non-significant (`p` in both cases = `.06`, one-tailed test). As has already been
    mentioned, it is likely that those who were married at older ages tend to be members
    of more recent mariage cohorts; (the correlation between age at marriage and marital
    duration is -.518`). Of additional interest is the fact that when marital duration
    is included in the estimation, the variable measuring union order regains significance
    (`p = .05`). While the effect of union order is weakened by the inclusion of the
    age at marriage variable, the addition of marital duration suggests significant
    variation on union order within categories of the duration variable that were
    not evident across categories. Why this is the case is not clear. It may be due,
    in part, to differences in the timing of first and higher-order marriages between
    cohorts.


    ### 3. Evidence provided by McNicoll and Singarimbun (1983), suggests that that
    may indeed by by the case. Gender differences in age at marriage narrowed considerably
    between 1961 and 1979, with Java being one of the locations in which the change
    was most pronounced.


    # Post-Marriage Migration and the Status of Women


    In following the previous chapter''s assessment of individual inputs into the
    marriage decision, the central objective of this chapter is to investigate the
    determinants of women''s overall decision-making power within the household once
    they are married. Some of the factors that affected input into the choice of a
    marriage partner, such as the educational attainment of the respondent and the
    amount of time spent in the current union, are expected to continue to influence
    family decision-making processes throughout the reproductive years. In addition,
    factors such as mobility or migration at or soon after marriage, and the amount
    of contact that is maintained with the parents of either spouse once the marital
    union is entered, are also predicted to affect levels of intra-household status.
    As has been noted, frequent contact between the couple and the parents on either
    side of the family is expected to lower the wife''s status within the household,
    compared to cases in which less regular contact takes place. Not unrelated is
    the view that the relocation of both spouses within the first four years of marriage
    should raise the wife''s decision-making power within the family. If the couple''s
    mobility at marriage requires an exogamous move for the woman, however, the disruption
    of her social ties may override the benefits of the move and have a negative effect
    on her status.


    Stated more formally, and given the information presented in `Chapters 2` and
    `3`, the following hypotheses are suggested:


    6.1) The residential relocation of both spouses after marriage will result in
    higher intra-household status for the wife compared to cases in which neither
    spouse moves, or in which only one relocates.


    6.2) Women who maintain frequent contact with either or both sets of parents will
    have lower intra-household status than will women who do not maintain frequent
    contact with parents on either side of the family.


    6.3) If a woman''s residential relocation after marriage requires that she move
    outside of her village, her intra-household status will decrease compared to women
    who do not change villages.


    #### TABLE 6.1: MOBILITY AFTER MARRIAGE BY GENDER


    | Mobility Measure | Gender of Respondents | |

    | :--- | :--- | :--- |

    | % of Males | % of Females | |

    | Percent of sample: | | |

    | who moved | 61.9 | 72.3 |

    | who did not move | 38.1 | 27.7 |

