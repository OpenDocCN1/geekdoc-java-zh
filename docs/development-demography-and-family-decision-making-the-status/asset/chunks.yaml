    与中爪哇岛其他地区一样，受调查女性的生育率仍然相当高。目前为止，她们平均生下的孩子数为 4.13 个。另一方面，避孕措施在受访女性中也得到了广泛使用；58.9%
    的人自称曾使用过避孕药物。因此，可以预见当较年轻的群体完成生育任务后，其平均家庭规模将比较老群体的女性更小。


    这种情况可能发生的另一个原因是，受调查的女性中约三分之二认为她们理想的孩子数量是三个或更少。理想家庭规模的数据见表 7.2。女性认为理想的孩子数量平均为 3.4
    个，中位数为 3.0 个，大多数女性（86.7%）认为拥有 2 到 4 个孩子是最优的。^(1)


    正如前所提到的，为了让夫妻计划较小的家庭，整个中爪哇岛及整个国家都强烈鼓励使用避孕措施。中爪哇岛省以及苏科霍乔县（Kabupaten Sukoharjo）对特定避孕方法的相对偏好数据见表
    7.3。


    在县级或省级水平上，口药显然是最受欢迎的计划生育方法，尽管节宫内环（IUD）也被广泛使用。这两种方法加起来占该县和全省范围内非传统避孕方法使用的 80% 以上。注射针和避孕套在苏科霍乔的使用率略低于中爪哇岛其他地区，而绝育术在县内的普及率则比全省略高。


