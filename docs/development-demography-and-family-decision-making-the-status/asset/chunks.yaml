    As is true throughout Central Java, fertility among the women surveyed remains
    quite high. The mean number of children born to them thus far is 4.13. On the
    other hand, contraception has also been widely used among the sampled women; 58.9
    percent claim to be ever-users of birth control. It is therefore not unreasonable
    to expect that when more recent cohorts have completed their childbearing they
    will have smaller families, on average, than will the women from older cohorts.


    Another reason why this may come to pass is that roughly two thirds of the women
    surveyed believe that the ideal number of children they could have is three or
    fewer. Data on ideal family size are presented in [Table 7.2](#Ch07.xhtml_cap_lbl0025).
    The mean number of children women consider to be ideal is 3.4, the median is 3.0,
    and most women (86.7 percent) believe that having between two and four is optimal.^([1](#Ch07.xhtml_fn0025))


    As has been noted, in order for couples to plan smaller families, the use of contraception
    has been strongly encouraged throughout Central Java and the nation as a whole.
    Data on relative preferences for particular contraceptive methods in the province
    of Central Java, as well as in Kabupaten Sukoharjo, are presented in [Table 7.3](#Ch07.xhtml_cap_lbl0026).


    The pill is clearly the most popular program method utilized at either the kabupaten
    or province level, although IUDs are also widely used. Together, the two methods
    account for over 80 percent of the nontraditional contraceptive use within both
    the lower administrative district and the province. Injections and condoms are
    slightly less prevalent in Sukoharjo than in the rest of Central Java, while sterilization
    is relatively more common in the kabupaten than in the province as a whole.


    [TABLE 7.2:](#Figures.xhtml_bck_cap_lbl0025) DISTRIBUTION OF IDEAL NUMBER OF CHILDREN


    | Ideal Number of Children | Percent |

    | --- | --- |

    | | |

