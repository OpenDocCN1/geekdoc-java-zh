  trans: '

    为了传达本研究背景的语境，必须在开头解决几个问题。例如，总体社会发展如何影响了女性在家庭内部和外部的地位？社会经济发展如何影响迁移行为，而迁移又如何（如果存在的话）对女性自主性的变化做出了贡献？本章对这些问题进行了简要介绍^(1)。


    在继续之前，有必要澄清“女性地位”这一概念的含义。尽管该概念在文献中经常被讨论，但批评者认为该术语的使用过于松散，其意义到目前为止是“极难捉摸的” (Curtin,
    1982:33)，“模糊且定义不当” (Powers, 1985:3)。然而，最近有人建议，在“令人眼花缭乱的特定术语和定义中……确实出现了一些某些共同的线索”
    (Mason, 1985:7)。地位的定义通常集中在性别之间的不平等方面，而所考察的不平等往往倾向于围绕权力、声望以及/或对资源的控制或获取 (Mason,
    1985)。


    尽管具有这些共同特征，地位仍可以从多个维度进行观察 (Safilios-Rothschild, 1982; Williams and Guest, 1985)，而且这些维度并不总是以可预测的方式相互作用
    (Powers, 1985)。因此，有必要澄清本研究的每个阶段将考察哪一个维度。例如，在以下关于女性和社会经济发展的概述中，主要关注的是更广泛层面的地位，即相对于社区或社会中他人的地位。必须解决该维度的地位，以便理解女性在整体经济和家庭外社会秩序中的处地。


    然而，女性的家庭外地位与人际层面的地位（通常被称为“权力”，Safilios-Rothschild, 1982）有所不同，而本研究的很大一部分将集中在地位的这一维度上。首要关注的问题是女性在做出重大家庭决策时，相对于其他家庭或家族成员的表现如何。确定女性的家庭内部地位是重要的，因为研究发现家庭成员之间权力分配的差异会影响决策结果（如避孕和生育），且这种影响独立于其他更常考虑的变量，包括衡量更广泛维度地位的变量
    (Hull, 19981)。


    本章旨在评估近期历史如何导致了家庭内部、家庭之间以及跨文化和跨发展水平女性地位的变化。


    ## 女性与发展

    '
- fmt: '

    The exact nature of the effects of socioeconomic development on the social position
    of women has generated considerable debate in recent years. Although Goode (1982)
    has argued that development, and particularly industrialization, have historically
    been associated with expanding rights for women, he acknowledges that that view
    is highly controversial in feminist circles. He maintains, however, that "if we
    confine ourselves to the era preceding industrialization, and to the period of
    relatively moderate or advanced industrialization, the trend toward greater equality
    of women''s status seems clear enough" (Goode. 1982:184).


    ### Industrialization

    There are numerous reasons why the initial stages of industrialization and economic
    development were often much less helpful to the overall position of women in society.
    In the early industrializing United States, for example, and particularly once
    reforms made factory work largely the domain of the adult male, wives remained
    at home doing household chores, many of which had been previously shared by their
    husbands. In rural areas, women of necessity took on additional agricultural work
    when men began earning incomes elsewhere.


    Over time, the lines between women''s domestic work and men''s work in offices
    and factories became increasingly distinct, and what were already noticeable gender
    differences were heightened by the fact that while male labor brought in cash
    incomes, women''s work generally did not. As a result of "this differentially
    rewarded division of work, men came to be associated with the values of the industrial
    world - money, production, and power", while women "were linked to domestic values
    -love, nurturance, and self sacrifice..." (Lipman-Blumen, 1984:106).


    ### Economic Power Limitations

    The limitations on the economic power of women that characterized the early stages
    of economic development and industrialization were confined neither to the United
    States nor the western world in general, however. Prior to the establishment of
    a cash economy in most settings, work tends to be viewed simply as work; although
    tasks may vary by gender, one job is generally not seen as more or less valuable
    than any other. With the introduction of new systems of rewards for different
    types of production, however, only certain workers receive compensation in cash
    for the work they do. As a result, their labor becomes more highly valued than
    that for which there are no cash payments, and those who bring home cash earnings
    become elevated in status above those who do not (Taylor, 1985).


    ### Policy and Colonization

    In a variety of cultural, economic, and social settings, women have continually
    failed to share fully in the benefits of industrialization, despite the introduction
    of specific programs aimed ostensibly at improving overall conditions in the target
    areas. Women''s issues per se have been largely neglected since colonial and early
    post-independence periods, and until recently very little if any attempt has been
    made to integrate women into the broader development picture. While policy-makers
    have focused considerable attention on rural improvements, growth in education,
    industrialization, and even in some cases on family planning, they have tended
    to have "little regard for the consequences of their policies on women" (Duley
    and Diduk, 1986:48-49).


    As a result, many policies have proved to be disruptive to women in general. Programs
    enacted during colonization are thought to have been responsible for the introduction
    of new elements into the sexual division of labor that replaced more equitable
    relationships between men and women with the "marginalization of women in political
    decision-making spheres, in access and control over resources, and in jural rights
    and privileges" (Duley and Diduk, 1986:53). Extensive revisions in systems of
    land tenure and property rights were enacted that "significantly undermined traditional
    rights of access granted to women" (Duley and Diduk, 1986:54). In many instances,
    European colonialists issued land reform policies that resulted in the direct
    transfer of land ownership from women to men. Boserup (1970: 60) has argued that
    such reforms came about in Africa because "Europeans everywhere seem to have objected
    to the peculiar position of African women, that was so different from anything
    the Europeans were accustomed to."


    ### Global Perspectives

    The frequent inability of development policies to improve or even maintain the
    status of women has not been limited to colonial periods or post-independence
    regimes, however. Nor has it since been contained within social, geographical,
    political, or temporal boundaries. Planners from both socialist and capitalist
    states have often disregarded women''s issues because they have seen requests
    for attention to such issues as "special pleading, a mechanical imitation of Western
    ''women''s lib,'' needlessly divisive and even antinationalistic" (Duley and Diduk,
    1986:49).


    It is therefore not surprising that the insights that could have been gained from
    past experience are still not being used effectively to improve the situation
    of women in developing countries. In Korea, for example, the benefits from socioeconomic
    development are continuing to accrue disproportionately to men, despite the fact
    that women comprise a sizeable percentage of both urban and rural labor markets
    (Soon, 1977; Whyte and Whyte, 1982). This scenario remains common throughout much
    of Asia, and the rest of the developing world as well.


    ### Theoretical Analysis

    Although both Marxist and non-Marxist analysts have generally viewed the effects
    of the expansion of capitalism as gender-neutral, and although logically, the
    growth of capitalism should eventually "destroy the socially accepted and ideologically
    reinforced subordination of women," that process is failing to occur in many developing
    countries (Afshar, 198-5: xii). As a result, and given the evidence contradicting
    Goode''s contention that the situation of women demonstrably improves during moderate
    to advanced industrialization, many writers have now concluded that while the
    decline in women''s status is particularly precipitous in the early stages of
    development, there also appears to be an overall decrease in status throughout
    "the process of national growth in most countries" (Loutfi, 1980:11).


    ### Case Study: Indonesia

    In some ways Indonesia provides an example. According to Mather (1985), the subordination
    of the female population in Jakarta has been reinforced instead of reduced during
    the process of industrialization. Through cooperation with local "Islamic patriarchs"
    who serve as security guards and "labor agents" for the industries, Jakarta''s
    industrial managers have been able to command a labor force that is both "cheap
    and docile." Women and younger employees are viewed as easily dominated, and the
    alliance between capital managers and village leaders has enabled the growing
    industries to hire and maintain these malleable workers at comparatively low wages
    (Mather,1985 177).


    In general, because industrialization and urbanization are so highly related,
    the problems women in developing countries face during process are almost inseparably
    linked with those that occur as result of the other. For a variety of reasons
    the numerous rural to urban moves that take place as urbanization usually involve
    resettlement from agricultural (Afshar,1985). Once in the city, potential jobs
    for women tend to be disproportionately few and far from where migrants settle.
    Hours are inflexible and urban employment is frequently incompatible with childbearing
    and childrearing, as well as with traditional views about what the nature of women''s
    work should be and where it should place. According to some, the bottom line remains
    that employers tend to prefer to hire males anyway, and that training programs
    that are largely male-oriented have to be completed before employment is even
    a possibility (Boserup,1970; Duley and Diduk,1986).


    ### Supply and Demand

    These problems are familiar to urban throughout the developing world, as both
    supply and demand factors contribute to the persistent low status of the female
    population in those regions. On the supply side, constraints include social norms
    regarding respectability and suitability of work among women at various life cycle
    stages. Because they lack socially acceptable alternatives, women with children
    and no access to care must frequently engage in low-wage employment activities
    that are done at home. On the demand side, there is the sexual division of labor:
    gender segregation by task and by discrete areas of work (Standing,1985:233).
    Women''s work involves lower skill levels, lower wage levels, less unionization,
    and therefore generally satisfactory working conditions than is true in male dominated
    categories (Standing,1985).


    The situations in Indonesia and Thailand provide a case point. The disparities
    that exist between male and female labor participation rates in both countries
    are a function of a number of factors already cited: institutional segregation,
    lower human capital levels among women, and again, varying norms about the roles
    men and women are expected to play. As a consequence, female migrants are much
    more apt to enter the service economy than are males, while men are more likely
    to end up in positions in sales or government administration (Smith,1981). In
    most developing countries, accelerated population growth and urbanization have
    combined to create abundant surplus labor that the new capital-intensive industries
    have been unable to absorb. The result has been "the development of a highly heterogeneous
    labour force and the systematic exclusion of large groups of the population from
    certain opportunities" (Jelin,1982:254). Because demand for labor is limited,
    both men and women face potential unemployment or underemployment, but because
    of the perception that women''s domestic responsibilities will prevent them from
    being effective workers (Jelin,1982:254), they are commonly excluded from the
    most desirable jobs.


    Despite the obvious increases in opportunities for women that become available
    during the process of socioeconomic development, the overall status of women need
    not approach that of men even in societies that have moved beyond the initial
    stages of industrialization and development in general. Whether the primary focus
    is on industry or the agricultural sector or both, many writers now view "development"
    per se as far from a panacea for Third World women. In fact, there exists a vocal
    constituency for the view that the varied problems associated with low status
    among women in developing countries are not simply the result "of forgetting to
    include women in development plans, or of assuming that they will always benefit
    from measures aimed at men. There is also positive discrimination against development
    for women" (Ware,1981:11; see also Jelin,1982).


    ### The Boserup Framework

    In drawing upon Boserup''s (1970) scheme of three separate stages of societal
    evolution, with three matching status levels for women at each stage, Ware (1981)
    has presented some additional insights about the nature of the relationship between
    the position of women within the social system and the various processes involved
    in socioeconomic development, particularly as it relates to agriculture. In Boserup''s
    first stage, the population is sparsely settled, cultivation is shifting, and
    women tend to be in charge of agricultural production. At the second level, populations
    become more concentrated, plow agriculture is introduced, and men become responsible
    for the majority of the farming tasks. In the third stage, both men and women
    work hard on intensively farmed irrigated plots. According to Boserup, the overall
    status of women tends to be lower at the second stage of the process than at either
    the first or the third.


    Ware (1981:21) has suggested that if Boserup''s view is correct "the impact of
    development upon women''s status would [therefore] depend to a great extent on
    the exact point in the three-stage progression at which modern development began."
    At the first level, women are significant contributors to the overall economy.
    At the second, their contributions to production become less important, they become
    increasingly confined to domestic activities, and their status falls. Ultimately,
    however, Ware appears to agree with Goode; with "industrialization, in the long
    run, women re-emerge out of the domestic sphere and make their contribution to
    the general economy" (Ware,1981:24). Ware''s contention is that many of the shortcomings
    of development policies to date have been the result of to their proclivity for
    confining women to the "second, agricultural stage, even when men have been moving
    into the industrial stage" (Ware,1981:24). Such policy outcomes are particularly
    ironic since so development programs have as a stated objective the will to slow
    population growth; yet it is the women in the second agricultural stage who have
    the highest fertility. Other factors are certainly involved in the determination
    of women''s status, however, many of which are also related to social evolution
    and economic development. Anker (1982:32) has discussed some of the more important
    of these, noting that the prescribed rules governing the behavior of women can
    be deemphasized and their overall status probably enhanced under conditions "where
    family members have been exposed to new ideas and new ways of life, such as occurs
    as a result of migration and formal education, and where social structure is less
    cohesive..." These issues, with particular emphasis on the relationship between
    migration and the roles and statuses of women, are examined in more detail below.

    '
