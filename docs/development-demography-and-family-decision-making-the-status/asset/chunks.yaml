    [TABLE 7.3:](#Figures.xhtml_bck_cap_lbl0026) CONTRACEPTIVE METHODS CHOSEN IN SUKOHARJO
    AND CENTRAL JAVA AS A WHOLE (1984)


    | Method Used | Sukoharjo | Central Java | | | |

    | --- | --- | --- | --- | --- |

    | | Number | Percent | Number | Percent |

