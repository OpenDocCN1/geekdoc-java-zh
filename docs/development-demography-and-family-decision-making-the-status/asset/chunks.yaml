  trans: '


    这项研究旨在分析中爪哇中部农村四个村庄代际内部以及代际之间发生的决策过程。此外，研究还试图确定女性控制家庭内部决策的权力差异是否（以及如果是，在何种程度上）影响特定的人口结果，在本例中为避药的使用和整体生育率。


    ### 配偶选择中的代际动态关系


    第一组分析探讨了配偶选择过程中涉及的代际动态关系。近期研究表明，全球大部分地区的决策权力平衡正在发生变化。正在结婚的人在决策过程中获得了更多话语权，而父母的控制力开始削弱。在第
    5 章中，研究试图通过考察爪哇代际之间 `Dower`（嫁妆/彩礼）相对变化的某些决定因素，来对该主题的现有（尽管有限的）文献进行补充。


    根据有关发展中国家地区（特别是印度尼西亚）家庭变迁的可用信息，产生了几个假设。这些假设在不同程度上均得到了支持。例如，研究假设受访者父母的受教育程度越高，受访者本人对婚姻决策的投入也应该越大。第
    5 章中提供的数据清楚地证明了这一点。无论分别研究丈夫或妻子对决策过程的认知，还是将他们的回答合并处理，结果一致显示，个人对配偶选择过程的控制确实随着双方父亲教育水平的提高而增加。


    尽管预计受访者本人受教育程度的提高也会增强他们影响婚姻决策的能力，但对该假设的支持并不十分统一。研究发现，受教育程度对女性具有一定的重要性，但仅在控制了婚姻时长的情况下如此。一旦将衡量当前结合长度的变量纳入估算，女性教育的影响就会被削弱并变得不显著。这部分可能是因为
    `marital duration`（婚姻时长）变量也衡量了其他与随时间变化相关的因素，例如社会经济发展的元素或价值观和态度的变化，而这些因素在分析中并未被测量。然而，如果是如此，这些变化必须是在排除了两代人所经历的教育进步、排除了结婚年龄的增长以及女性在结婚前居住社区规模的影响后所发生的。


    在男性受访者中，未发现高等教育会显著增加他们对结婚决策的投入。当将夫妻双方的数据合并时，女性受教育程度的影响足以维持一个显著系数，但同样仅在控制了 `marital
    duration`（婚姻时长）之前如此。随后，研究试图确定教育程度的增加是否在决策过程中给女性带来了不成比例的收益，结果发现确实如此。教育程度的进一步增加提高了女性在婚姻决策中的决策权力（相对于其父母），其程度超过了对男性的提高。这可能是因为直到最近，男性接受长期教育的情况远比女性普遍得多。


    ### 社区规模与城市化接触


    预计受访者在结婚前居住的社区规模对影响代际间决策权力的平衡起着主要作用。人们经常认为，教育水平和城市化接触的增加通常增加了接触更现代（或西方）思想的机会，例如促进家庭核心化和增加女性在家庭及整个社会权利的理念。正如预测的那样，研究发现结婚前居住在大型城市中心的女性对婚姻决策的控制力比来自较小城市或农村地区的女性要大得多。


    然而，婚前的城市居住地对男性来说重要性低得多。这可能是因为他们平均受教育年限比妻子长，因此通过多种渠道接触了外部影响；也可能是因为在结婚前居住过大型城市中心的男性相对较少。当合并丈夫双方的数据时，即使在没有控制
    `marital duration`（婚姻时长）的情况下，婚居住地的影响也被发现是不显著的。


    ### 年龄与结合顺序


    假设认为年龄较大时结婚的人报告其对婚姻决策的投入比年龄较小时结婚的人多。在丈夫中，这一假设得到了证实。然而，在女性中，只有在不控制 `marital duration`（婚姻时长）时，结婚年龄才会显著影响其决策权力。因此，对她们而言，结婚年龄在
    `marital duration` 水平之间对代际动态是显著，但在水平内部则不然。


    预计处于较高顺序结合的受访者对其当前婚姻决策的控制力，比那些仍在报告第一次婚姻的人要更多。尽管结合顺序未能成功影响男性受访者的决策权力，但女性的结论通常符合预期。在不控制结婚年龄时，仍处于第一段婚姻的女性对与谁结婚的发言权远少于处于较高次序结合的女性。然而，在控制结婚年龄后，结合顺序的系数变得不显著。


    关注结合顺序重要性的假设是根据第 3 章中提出的背景材料生成的。它表明，尽管印度尼西亚人在第一次决定结婚对象时仍然倾向于尊重父母的意愿，但他们离婚并再婚并不罕见，且下一次通常是他们自己选择的人。有趣的是，随着个人对婚姻决策的投入开始增加，该国大部分地区的离婚率已开始下降。


    ### 时间变化与人口趋势


    正如许多人口统计学文献中的观点一样，随时间变化的重要性是整个分析贯穿始终的主题。在排除已讨论变量随时间变化的影响后，假设结婚时间较长的人在选择配偶时面临比近期结婚的人更多的父母限制。在针对男女女性受访者的所有估算中，该假设都得到了强力支持。


    '
