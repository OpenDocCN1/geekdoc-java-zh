  trans: '


    男性和女性受访者对自己在配偶选择决策中投入程度的感知频率见表 5.1。总的来说，因变量在各个类别之间的分布相当均匀，尤其是女性之间。在类别二到类别四中，男性和女性在每个投入水平上的响应也相当相似，在这些类别中，夫妻与其他家庭成员在不同程度上共享对婚姻决定的控制权。


    然而，男女之间的差异体现在极端类别中。男性认为自己及其配偶对婚姻决策拥有完全控制权的可能性远高于女性。而且，男性认为自己对决策没有投入的可能性远低于其妻子。虽然有
    20.3% 的女性认为她们对配偶的选择没有控制权，但受访男性中仅有 10.9% 属于这一类别。相反，尽管 23.6% 的丈夫认为婚姻决定完全在夫妻手中，但只有
    16.8% 的女性认为在做结婚决定时没有外部压力。


    这表明，至少在该样本的某些部分中，男性在选择配偶方面的发言权比女性多。正如格尔茨（Geertz, 1961）指出的，在包办婚姻的较传统的夫妻中，男性被完全排除在决策之外的频率远低于女性。同样，在量表另一端的夫妻中，那些在选择配偶方面拥有相当自由度的人，男性受到的家庭约束似乎也比女性少。


    丈夫和妻子的交叉表响应结果见表 5.2。结果表明，绝大多数丈夫和妻子在决策过程中的投入程度上实际上意见是一致的；略超过一半的配对（52.6%）落在对角线位置。然而，对于那些存在某些分歧的人来说，男性报告的父母约束通常比女性少。落在对角线上方的受访人数几乎是下方的两倍，再次证明男性至少认为自己对婚姻决定的投入比女性多。对决策过程感知截然不同的夫妻相对较少。


    表 5.1：对婚姻决策感知控制权的百分比分布（妻子及其丈夫）


    | 因变量 | 女性感知 | 男性感知 |

    | --- | --- | --- |

    | | | |

    | 无控制 | 20.3 | 10.9 |

    | 较少控制 | 23.6 | 25.6 |

    | 共同控制 | 15.7 | 17.8 |

    | 主导控制 | 23.6 | 22.1 |

    | 完全控制 | 16.8 | 23.6 |

    | 总百分比 | 100.0 | 100.0 |

    | 总人数 | 394 | 394 |


    ## 多变量分析结果](#contents.xhtml_bck_ht0046)


    为了确定哪些因素对现有的感知差异影响最大，对男性和女性受访者分别进行了多变量分析；然后使用合并数据估计了额外的方程。显示核心变量对女性决策过程投入影响的结果见表
    5.3。


    在`Equation 1` 中，衡量女性对婚姻决策投入的因变量对衡量其教育程度、其父亲教育程度的变量，以及她的婚姻顺序和结婚前居住城市/城镇的规模进行了回归。该方程的所有结果均显著，且方向符合预测。随着受教育程度的提高，女性在做出婚姻决定时行使的控制量随之增加。同样，随着其父亲教育水平的增加，她们在择偶过程投入投入随之增加。高序婚姻女性在选择配偶方面比第一段婚姻的女性拥有更大的自由，结婚前居住在较大城市地区的女性在决策过程中的投入比居住在较小城市或农村地区的女性多。


    表 5.2：丈夫与妻子对婚姻决定的投入对比！

    ![Image](img/7.jpeg)


    表 5.3：影响女性对选择配偶决策权力感知的因素（非标准系数）


    | 自变量 | 方程 1 | 2 | 3 |

    | --- | --- | --- | --- |

    | | | | |

    | 教育程度： | | | |

    | 妻子的 | .069** | .055* | .036 |

    | 妻子的父亲 | .078** | .079** | .073** |

    | 妻子的婚姻顺序 (0-最后一次, 1-高序) | .452* | .291 | .356* |

    | 妻子的婚前社区规模 | .459* | .443* | .426* |

    | 妻子结婚时的年龄 | n.a. | .041** | .023 |

    | 婚姻时长 | n.a. | n.a. | -.028** |

    | 常数 | 3.732** | 3.192** | 3.923** |

    | | | | |

    | R Square | .124 | .142 | .168 |

    | 受访人数 | 386 | 386 | 386 |


