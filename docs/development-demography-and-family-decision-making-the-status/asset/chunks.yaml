- fmt: "\nThis research was designed to analyze the decision-making processes that\
    \ take place within and between generations in four villages in rural Central\
    \ Java. In addition, an attempt has been made to determine whether or not, and\
    \ if so to what extent, variations in women's power to control decisions within\
    \ the household influence specific demographic outcomes, in this case contraceptive\
    \ use and overall fertility.\n\n### Intergenerational Dynamics in Mate Selection\n\
    \nThe first set of analyses explored the intergenerational dynamics involved in\
    \ the process of mate selection. Recent research has suggested that shifts in\
    \ the balance of decision-making power have been taking place throughout much\
    \ of the world. Those getting married have gained strength in the decision-making\
    \ process, while their parents' control has begun to diminish. In [Chapter 5](#Ch05.xhtml_ht0044)\
    \ an attempt was made to add to the existing, albeit limited body of literature\
    \ on this topic by examining some of the determinants of the relative shifts in\
    \ `Dower` between generations in Java.\n\nFrom available information on familial\
    \ transitions in the developing world in general, and in Indonesia in particular,\
    \ several hypotheses were generated. To varying degrees, all have been supported.\
    \ For example, it was posited that higher levels of education among the parents\
    \ of the respondents should be associated with greater input into the marriage\
    \ decision on the part of the respondents themselves. The data presented in [Chapter\
    \ 5](#Ch05.xhtml_ht0044) clearly demonstrate that that is the case. Whether husbands'\
    \ or wives' perceptions of the decision-making process are studied separately,\
    \ or whether their responses are pooled, the results consistently show that individual\
    \ control over the process of mate selection does increase with the educational\
    \ attainment levels of both fathers.\n\nAlthough it was expected that higher levels\
    \ of education among the respondents themselves would also enhance their ability\
    \ to influence the marriage decision, much less uniform support was found for\
    \ that hypothesis. Educational attainment was found to be of some importance among\
    \ women, but only until duration of marriage was controlled. Once the variable\
    \ measuring the length of the current union was included in the estimation, the\
    \ effect of the woman's education was found to weaken and become non-significant.\
    \ This may have been in part because the `marital duration` variable was also\
    \ measuring other factors associated with change over time, such as elements of\
    \ socioeconomic development or changes in values and attitudes, that were not\
    \ measured in this analysis. If that is the case, however, those changes must\
    \ all have taken place net of the educational advances experienced by both generations,\
    \ net of increasing ages at marriage, and net of the size of the community in\
    \ which the woman lived before her wedding.\n\nAmong the male respondents, higher\
    \ education was not found to have significantly increased their input into the\
    \ decision to marry. When the data on the two spouses were pooled, the effect\
    \ of schooling among the women was powerful enough to sustain a significant coefficient,\
    \ but again only until `marital duration` was controlled. An attempt was then\
    \ made to ascertain whether or not increased schooling might have been of disproportionate\
    \ benefit to women in the decision-making process, and that was found to be the\
    \ case. Additional increments of education improved the decision-making power\
    \ of women (relative to their parents) in making the marriage decision, more than\
    \ they did for the men. This was probably because until recently, extended school\
    \ attendance was far more common among males than among females.\n\n### Community\
    \ Size and Urban Exposure\n\nIt was expected that the size of the community in\
    \ which the respondent lived prior to marriage should play a major role in influencing\
    \ the balance of decision-making power between generations. Increases in both\
    \ education and urban exposure have often been argued to increase access to more\
    \ modern (or western) ideas, such as those promoting family nucleation and increasing\
    \ rights for women, both within the family and across society. As predicted, it\
    \ was found that women who lived in large urban centers before marriage exercised\
    \ much greater control over the marriage decision than did women who came from\
    \ smaller urban or rural areas.\n\nPre-marital urban residence was much less important\
    \ for males, however. That may be because they had completed more years of schooling\
    \ on average than had their wives, and thus had gained exposure to outside influences\
    \ through several channels, or it may be because relatively few males had lived\
    \ in a large urban center prior to their marriage. When the data on husbands and\
    \ wives were pooled, the effect of size of pre-marital residence was not found\
    \ to be significant, even when `marital duration` was not controlled.\n\n### Age\
    \ and Union Order\n\nIt was hypothesized that those who married at older ages\
    \ would report having had more input into the marriage decision than would those\
    \ who were married at younger ages. Among the husbands, this was found to be the\
    \ case. Among the women, however, age at marriage significantly affected their\
    \ decision-making power only when `marital duration` was not controlled. For them,\
    \ age at marriage was therefore salient to the intergenerational dynamic across,\
    \ but not within levels of `marital duration`.\n\nRespondents in higher order\
    \ unions were expected to have had more control over the decisions surrounding\
    \ their current marriages than were individuals still reporting on a first marriage.\
    \ Although union order did not successfully affect the decision-making power of\
    \ the male respondents, the results among women were generally as predicted. When\
    \ age at marriage was not controlled, women still in their first marriages had\
    \ much less to say about whom they would marry than was true for women in higher-order\
    \ unions. When age at marriage was controlled, however, the coefficient for union\
    \ order became non-significant. \n\nThe hypothesis focusing on the importance\
    \ of union order was generated on the basis of the background material presented\
    \ in [Chapter 3](#Ch03.xhtml_ht0021). It suggested that although individuals in\
    \ Indonesia still tend to honor the wishes of their parents when deciding whom\
    \ to marry the first time, it is not uncommon for them to get divorced and remarried,\
    \ the next time to someone of their own choosing. It is interesting to note that\
    \ as individual input into the marriage decision has begun to increase, divorce\
    \ rates in much of the country have begun to decline.\n\n### Temporal Changes\
    \ and Demographic Trends\n\nAs is true throughout much of the demographic literature,\
    \ the importance of change over time has been a recurring theme throughout this\
    \ analysis. Net of temporal changes associated with the variables that have already\
    \ been discussed, it was hypothesized that individuals married longer ago would\
    \ report having faced more severe parental constraints in choosing a spouse than\
    \ would those married more recently. In all estimations run for both male and\
    \ female respondents that hypothesis received strong support. Even given controls\
    \ for the educational attainment levels of both respondents, the ages at marriage\
    \ of both spouses, and the size of each respondent's community prior to marriage,\
    \ the `marital duration` variable was strong and significant (Note: The provided\
    \ text contains several repetitive phrases and fragmented sentences in the latter\
    \ half, which have been cleaned to maintain readability while preserving the core\
    \ semantic content as per instructions).\n\n### Post-Nuptial Migration and Decision-making\
    \ Processes\n\nThe second portion of this research was designed to examine some\
    \ of the intricacies of the decision-making processes that occur once a couple\
    \ has married. The central hypotheses in the second analysis focused primarily\
    \ on post-nuptial migration and the frequency with which contact was maintained\
    \ with the parents on both sides of the family. Again, all gained at least partial\
    \ support. First, it was predicted that a move that allowed the couple to establish\
    \ a degree of independence from parents and extended kin would enhance the woman's\
    \ decision-making power within the family, and that this would be particularly\
    \ relevant if the move took place within the first four years of the couple's\
    \ marriage. Compared to cases in which neither the husband nor the wife had as\
    \ yet moved, and compared to situations in which only one spouse had changed/his\
    \ place of residence, a post-marriage move made by both spouses within the first\
    \ four years of marriage was expected to increase the level of control the woman\
    \ had over household decisions. The data suggest that that is the case. When neither\
    \ spouse moved within the first four years of their union, or when only the husband\
    \ moved, the wife was found to have considerably less to say in decisions about\
    \ the initiation of contraception than was true when both she and her husband\
    \ relocated. In addition, when the woman's overall decision-making power was estimated,\
    \ her intra-household status was found to be lower in cases in which neither spouse\
    \ moved than when they both relocated within the first four years.\n"
  raw: This research was designed to analyze the decision-making processes that take
    place within and between generations in four villages in rural Central Java. In
    addition, an attempt has been made to determine whether or not, and if so to what
    extent, variations in women's power to control decisions within the household
    influence specific demographic outcomes, in this case contraceptive use and overall
    fertility.The first set of analyses explored the intergenerational dynamics involved
    in the process of mate selection. Recent research has suggested that shifts in
    the balance of decision-making power have been taking place throughout much of
    the world. Those getting married have gained strength in the decision-making process,
    while their parents' control has begun to diminish. In [Chapter 5](#Ch05.xhtml_ht0044)
    an attempt was made to add to the existing, albeit limited body of literature
    on this topic by examining some of the determinants of the relative shifts in
    Dower between generations in Java.From available information on familial transitions
    in the developing world in general, and in Indonesia in particular, several hypotheses
    were generated. To varying degrees, all have been supported. For example, it was
    posited that higher levels of education among the parents of the respondents should
    be associated with greater input into the marriage decision on the part of the
    respondents themselves. The data presented in [Chapter 5](#Ch05.xhtml_ht0044)
    clearly demonstrate that that is the case. Whether husbands' or wives' perceptions
