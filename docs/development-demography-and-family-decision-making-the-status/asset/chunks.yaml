- fmt: "\nThe `adat`, or customary law, governs all members of all religious groups\
    \ in Indonesia, yet the majority of the population are Muslim, and so are also\
    \ governed by the `fikh`. The distinctions between the two legal systems are sometimes\
    \ tenuous, since a certain amount of overlap does exist, but as yet no uniform\
    \ law has evolved. Attempts at codification have been recognized to be in the\
    \ best interests of many groups, including women, since their behavior is governed\
    \ by both sets of laws, but thus far little progress has been made. \n\nAs a result,\
    \ relationships within the group are currently determined by ancestral custom,\
    \ the `adat` - the indivisible entity of unwritten prescriptions which law experts\
    \ have a habit of differentiating into civil law, private law, matrimonial law,\
    \ and law of succession; the indivisible whole that varies within the regions,\
    \ the origins, and the beliefs, and that has evolved with time according to the\
    \ vicissitudes of the social groups concerned (Vreede-de Stuers, 1960:21). In\
    \ essence, the `adat` affects the man or woman as a member of the society, rather\
    \ than as an individual, although it has been argued that the distinction between\
    \ the individual and the society member should not be exaggerated.\n\n### Social\
    \ Systems within Adat\nWithin the `adat`, matrilineal, patrilineal, and bilineal\
    \ social systems all operate. In Java, the bilineal system is most common. The\
    \ children born to a couple thereby belong to both sides of the family, and both\
    \ sons and daughters can inherit property. Among married couples, the \"possessions\
    \ inherited or acquired by either partner during the marriage, the `(gani-gini)`,\
    \ become the common property to which they have equal rights\" (Vreede-de Stuers,\
    \ 1960:30). If the couple decides to separate, all possessions that were brought\
    \ into the marriage by the man remain with his family, while those brought into\
    \ the marriage by the woman remain with her side. Property acquired since marriage\
    \ is split so that the wife receives one third of its value, while her husband\
    \ receives two thirds (Koentjaraningrat, 1967).\n\n### Marriage under Adat\nAccording\
    \ to the `adat`, marriage:\n- is a ritual which symbolizes the passing from both\
    \ the man's and the woman's state of celibacy to the marital one. From this interpretation\
    \ arises, for example, the Javanese custom of changing the name on this occasion.\
    \ The young man and girl who marry take a name new to both of them as a symbol\
    \ of unity\" (Vreede-de Stuers, 1960:33).\n\nLike most aspects of life that are\
    \ governed by `adat`, marriages are determined on the basis of what is considered\
    \ to be good for the group. Marriage is an agreement between two families and\
    \ young people may be denied direct input into the marriage decision. Although\
    \ parents try to take their tastes into account, marriage is not seen as a means\
    \ to make individuals happy (Ihromi et al., 1973). \"Marriage becomes a duty,\
    \ and spinsters are looked upon with contempt. A woman proves her true worth and\
    \ comes into her full rights only on becoming wife and mother\" (Vreede-de Stuers,\
    \ 1960:31).\n\nIn some portions of the country, an individual must be married\
    \ in order to take part in any major decisions that pertain to the family or community.\
    \ In certain cases, only women with children are allowed an input, and in cases\
    \ of strict patriarchy or matriarchy, both of which exist in Indonesia, only those\
    \ with children of the appropriate gender can take part in such decisions (Ihromi\
    \ et al., 1973). Much of Indonesian custom is thus functional and aimed directly\
    \ at ensuring the continuation of the clan. As a result, it is not surprising\
    \ that under both the `adat` and Islamic law, sterility is grounds for divorce\
    \ (Vreede-de Stuers, 1960).\n\n### Comparison: Adat and Islamic Law\nThe extent\
    \ to which the two legal systems agree is in fact considerable, as their roles\
    \ in governing marriage customs provide a case in point. Under Islamic law, marriage\
    \ is seen as an agreement \"by means of which the husband gains certain rights\
    \ over his wife, while she, in exchange, claims proper treatment\" (Vreede-de\
    \ Stuers, 1960). In theory their union constitutes a contract between two individuals\
    \ and requires the consent of each. As is true under the `adat`, however, \"in\
    \ practice the group influences the choice, and the settlement of marriages is\
    \ 'the family's business and not that of the future husband and wife'\" (Gardet,\
    \ 1954:250 cited in Vreede-de Stuers, 1960: 31). \n\nAlso of interest is that\
    \ customs such as forced marriages, polygamy, child marriages, and repudiation\
    \ rights that were initiated under `adat` before the introduction of the Muslim\
    \ religion into Indonesia, are now frequently reinforced using Islamic law.\n\n\
    On the whole, much of individual behavior before, during, and after marriage is\
    \ regulated according to legal precepts. Under Islamic law the husband is bound\
    \ to support his family of procreation. He must not \"leave home for more than\
    \ two years; is obliged, if he has several wives, to treat them equally; and must\
    \ refrain from bad treatment which may lead to bodily harm\" (Vreede-de Stuers,\
    \ 1960:33). If the marriage eventually proves unsuccessful, however, a divorce\
    \ may be awarded at the request of the husband without his wife's consent. Custody\
    \ of non-infant children can be awarded to either spouse, but infants always remain\
    \ with their mothers. Whatever the outcome of the custody decision, however, both\
    \ parents remain responsible for the well-being of all children after a divorce\
    \ (Koentjaraningrat, 1967).\n\n### Summary\nIn summary, there are specific laws\
    \ governing a range of behavior throughout an Indonesian's lifetime. At times\
    \ they are complementary, while at others they are contradictory, but there are\
    \ no set rules specifying which will prevail in the case of a discrepancy. One\
    \ of the primary interests of this research involves the customs surrounding entry\
    \ into marriage. Under `adat`, the rules vary with the family system of the region\
    \ in which they are enforced, and at times by urban versus rural residence. In\
    \ Java, where bilateral systems are the norm, spousal selection is less strictly\
    \ controlled than is the case in many other parts of Indonesia. As has been noted,\
    \ however, members on both sides of the family do take part in the marriage decision,\
    \ with the chosen spouse being one who is expected to strengthen the existing\
    \ family (Ihromi et al., 1973).\n"
