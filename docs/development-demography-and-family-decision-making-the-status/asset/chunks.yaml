    尽管印度尼西亚的法律体系对女性施加了一些限制，但有充分的证据支持这种观点：女性在印度尼西亚的社会地位相对较高（Mangkuprawira, 1981; Bangun,
    1981; Koentjaraningrat, 1967）。根据 Ihromi 等人（1973:32）的观点，女性不仅在家庭经济中发挥核心作用，在更广泛的社会中也同样如此。来自所有社会经济阶层的女性都能够参与“教育和就业，因此女性在家庭之外工作已成为普遍现象，即在办公室和工厂担任医生、律师、法官甚至工程师，此外，她们还参与了社会和政治活动。”


    在 1980 年人口普查时，在城市劳动力市场工作的女性中，比例最高的是从事公共服务工作的（39%），紧随其后的是贸易业（33.6%）和工业/制造业（14.6%）。城市男性的情况也是如此。三分之一的人从事公共服务业（33.3%），其次是贸易业（20.2%）和工业（13.4%）。


    在印度尼西亚农村地区的男女中，从事不同经济部门的比例也具有可比性。大多数（女性的 61.4%，男性的 67.3%）从事农业就业。在女性中，15%是贸易者，10.3%从事工业/制造业，9.8%从事公共服务业。农村男性的服务业比例略高一些，有
    10.8%的人从事此类工作，而 7.5%从事贸易业，5.8%从事工业/制造业。尽管这些数字无法说明男女在这些领域内的相对地位，但它们确实表明，与第 2 章中呈现的某些信息相反，女性至少被允许进入与男性相同的经济部门。


    关于男女职业的一些基本数据列在表 3.2 中。在 1980 年人口普查时，男女从事农业的可能性都高于经济中的任何其他部门，且两者的从事管理或行政工作的可能性都低于任何其他职业类别。男性比女性更可能从事生产、运输或文书及相关工作，而女性比男性更可能从事销售或服务工作。最后，尽管在绝对数量上男性占据了专业人员和技术人员的大多数职位，但从比例来看，女性从事专业或技术工作的可能性略高于其男性同辈。


    ### 女性运动的兴起


    到目前为止，就业状况发生的许多改善都是长期一致努力以带来这些变化的结果，这些努力在某些情况下在 1900 年之前就开始了。引发印度尼西亚女性主义运动的首批人物之一是拉登·阿哲英·卡提尼（Raden
    Adjeng Kartini, 1879-1904）。她与一位荷兰女性的通信记录（她通过一份荷兰女性主义报纸招募作为自己的通讯员）为世纪交替之际印度尼西亚女性的社会地位提供了宝贵信息。她在
    1899 年写的一封信中解释道：


    “我们这些女孩，在教育方面受限于古老传统和习俗的束缚，从这些优势中获益甚微^(8)。我们竟然接受了教育，尤其是离开家上学，这对我们土地的习俗来说是一个巨大的罪过。因为我们国家的习俗以最强的方式禁止女孩出门……当我到达十二岁时，我被留在了家里……我被锁起来，与外界的一切交流都隔绝了，我可能永远无法再次面对外界，除非看到新郎——一个陌生人，一个由我父母为我挑选的未婚男人，而且我在完全不知情的情况下就要与他订婚（引自
    Vreede-de Stuers, 1960:50-51）。”


    卡提尼的经历似乎是那个时代及她所属阶层其他女孩的典型情况。日加雅（Djokjakarta）教师培训学院的导师 N.D. Sewojo 描述了当时四个社会经济阶层的爪哇族女性的情况：首先，贫穷村民的女儿不上学。她们在田里干活、销售农产品，有时还缝纫。她们的生活很艰难，但被允许拥有一定程度的独立。富有村庄的女儿接受家务的培训，并在
    12 到 15 岁之间结婚。她们也没有接受过学校教育。结婚后，她们与丈夫一起从事贸易或农业工作，并且通常得到良好的对待。


    表 3.2： 1980 年人口普查印度尼西亚男女职业


    | 职业类别 | 男性就业百分比 女性 女性百分比 |

    | --- | --- | --- |

    | 专业/技术及相关 | 2.9 | 3.2 |

    | 管理/行政 | 0.2 | 0.1 |

    | 文书及相关 | 4.8 | 1.5 |

    | 销售 | 10.1 | 18.7 |

    | 服务 | 3.1 | 7.8 |

    | 农民和农业工人 | 55.8 | 52.4 |

    | 生产、运输及相关 | 21.0 | 14.3 |

    | 其他 | 0.9 | 0.2 |

    | 未说明 | 1.2 | 1.8 |

    | 总计 | 100.0 | 100.0 |


    桑提（宗教教师）的女儿没有接受正式教育，但在家里学习背诵古兰经。她们在 15 岁时才结婚，并往往受到配偶的高度尊重。最后，贵族官僚（priyayi）的女儿被允许上小学，但只到
    12 岁。之后她们被迫留在家里，那里有很多仆人，过着非常无闲的生活。她们在 15 或 16 岁时结婚，继续过着活动和封闭的生活。所有阶层都存在童婚。促进这种婚姻的逻辑是“防止女孩根据情感而非理智做出选择”（Vreede-de
    Stuers, 1960:52）。并不意外，儿童被认为比成年人更容易被塑造。尽管到 1900 年已经建立了 1200 所村庄（desa）学校，但印度尼西亚底层阶级的女孩尚未获得公共学校。为了改善她国家女孩和女性的状况，卡提尼呼吁增加所有社会经济阶层的教育。她的理由是，女孩的教育是必要的，不是为了让女性与男性竞争或威胁，而是为了让她们能更好地经营家庭，培养高质量的社会成员。这一主题在印度尼西亚女性运动的历史中被反复提起并强调。根据一份政府报告：印度尼西亚女性主义与西方女性主义不同。后者主要针对反对男性的努力，以实现女性的进步……在印度尼西亚，完全是通过女性发起的教育努力，随后通过[女性]大型政党和协会的方式，使得[女性]运动成为民族团结感、国家意识兴起以及反抗荷兰和日本殖民主义的基础，最终这种形势使得女性参加独立斗争的条件完全成熟（信息部,
    1968:11）。



