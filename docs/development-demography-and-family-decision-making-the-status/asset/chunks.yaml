    One relatively early attempt to transcend the view that female migration merely
    reflects the movement of males, was undertaken by Thadani and Todaro (1979). While
    their approach was innovative, their conclusions may also be considered controversial
    in some circles. They argued that while men migrate in search of higher education
    or more prestigious employment, thereby enhancing their social status within the
    community, "an appropriate marriage to an upwardly mobile man may be an alternative
    or additional approach in pursuit of the same goal for women" (Thadani and Todaro,
    1979:2).


    Although the type of status being sought by the women in the Thadani and Todaro
    study is status on the extra-household or community level, other researchers have
    since developed an interest in the subject and discussed the possible impact of
    migration upon women''s status within the household. Ware (1981) has noted, for
    example, that enhanced intra-household status may be one logical outcome of migration.
    She has argued that in patrilineal and patrilocal societies, a move away from
    the husband''s family may aid the wife by severing ties with in-laws among whom
    all resources are controlled by older men. Without such a move "young brides are
    in a singularly powerless position because they are strangers in their husbands''
    families" (Ware, 1981:163).


    A move away from the extended family is thought to give the couple the opportunity
    to develop a more intimate, and perhaps a more egalitarian relationship than would
    otherwise be possible. Ware (1981) contends that female migrants should be able
    to play a greater role in family decision-making processes than should non-migrants,
    and that "the greater participation of migrant women in economic tasks and the
    public sphere leads to the development of complex networks of communications and
    politicization" (Ware, 1981:172).


    Support for this view has been offered by Conklin (1981). He has found that migration
    in India significantly augments women''s capacity to control decision-making processes.
    This is true even when urban versus rural residence is controlled. He has argued
    that "a wife on her own, away from her husband''s relatives, is better able to
    bargain for and receive more power than would otherwise be the case" (Conklin,
    1981:17).


    Warner et al. (1986:123) have added that when patrilateral systems of residence
    and descent are examined, women are apt to have much less marital power than is
    true under other residence systems; "a woman typically becomes a de facto member
    of her husband''s kin group upon marriage. That group acquires the rights to her
    reproductive capacities, since her children will belong to her husband''s group."


    Whyte''s (1978) research is among that referenced by Warner et al. (1986). According
    to Whyte, women in nuclear households are likely to exercise much more power within
    a marriage than are women from extended families. "The fact that extended families
    include a number of adults of each gender leads to or allows a fairly rigid sexual
    division of labor" (Warner et al., 1986:122). In nuclear households, on the other
    hand, there are fewer people available to substitute in and perform the roles
    of the key players. As a result, when a move is made away from the extended family,
    the wife becomes critically important to the survival of the household, and her
    power in making major household decisions increases accordingly.


    Finally, Youssef et al. (1979:123) assert that one important result or migration
    is the weakening of traditional family structures" and that family fragmentation
    and "the emergence of new family structures" are likely outcomes of the migration
    process. Goldscheider (1984) concurs, arguing that "one of the key changes which
    migration brings about...is the removal from the family in the place of origin
    of total control over resources and status" (Goldscheider, 1984:11). In the long
    run, a move may also "facilitate the separation of economic from family structures
    and allow them to be realigned" (Goldscheider, 1984:11).


    Although some writers clearly view the association between migration and women''s
    status as strong and positive, not all are as optimistic. Mueller (1983:280),
    for example, has argued that migration away from family ties "may deprive some
    women of a reliable source of support in societies where kinship obligations are
    normally strong." She maintains that "poverty and unemployment as well as urbanization
    and modernization" all play a role in the erosion of kin networks (Mueller, 1983:280).
    If a woman''s residential relocation after marriage is of a sufficient distance
    to prove disruptive to her support networks, the move itself may not only fail
    to improve her status within the household, but it may cause her to feel even
    more powerless than she would have felt had she stayed right in her parents''
    home.


    As is true of the other migrant characteristics that have been discussed, the
    association between migration and the status of women remains incompletely specified.
    The nature of that relationship thus warrants additional consideration, and is
    analyzed in the following chapters.


    ## Status, Contraception, and Fertility

