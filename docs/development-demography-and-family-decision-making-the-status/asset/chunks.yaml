    ## 与避孕相关的变量


    ![图像](img/contents)


    出乎意料的是，许多作为避孕预测的变量也与使用有关。例如，配偶的教育程度与是否使用之间存在显著关联。表 7.5)。随着丈夫受教育年限的增加，女性使用的概率也会增加。同样，居住在城市的女性中有
    92.9% 是曾使用者，而居住在农村地区的比例仅为 57.8%。^(2)


