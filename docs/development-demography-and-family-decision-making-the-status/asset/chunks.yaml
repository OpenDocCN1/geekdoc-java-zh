    must all have taken place net of the educational advances experienced by both
    generations, net of increasing ages at marriage, and net of the size of the community
    in which the woman lived before her wedding.Among the male respondents, higher
    education was not found to have significantly increased their input into the decision
    to marry. When the data on the two spouses were pooled, the effect of schooling
    among the women was powerful enough to sustain a significant coefficient, but
    again only until marital duration was controlled.An attempt was then made to ascertain
    whether or not increased schooling might have been of disproportionate benefit
    to women in the decision-making process, and that was found to be the case. Additional
    increments of education improved the decision-making power of women (relative
    to their parents) in making the marriage decision, more than they did for the
    men. This was probably because until recently, extended school attendance was
    far more common among males than among females.It was expected that the size of
    the community in which the respondent lived prior to marriage should play a major
    role in influencing the balance of decision-making power between generations.
    Increases in both education and urban exposure have often been argued to increase
    access to more modern (or western) ideas, such as those promoting family nucleation
    and increasing rights for women, both within the family and across society. As
    predicted, it was found that women who lived in large urban centers before marriage
    exercised much greater control over the marriage decision than did women who came
    from smaller urban or rural areas.Pre-marital urban residence was much less important
    for males, however. That may be because they had completed more years of schooling
    on average than had their wives, and thus had gained exposure to outside influences
    through several channels, or it may be because relatively few males had lived
    in a large urban center prior to their marriage. When the data on husbands and
    wives were pooled, the effect of size of pre-marital residence was not found to
    be significant, even when marital duration was not controlled.It was hypothesized
    that those who married at older ages would report having had more input into the
    marriage decision than would those who were married at younger ages. Among the
    husbands, this was found to be the case. Among the women, however, age at marriage
    significantly affected their decision-making power only when marital duration
    was not controlled. For them, age at marriage was therefore salient to the intergenerational
    dynamic across, but not within levels of marital duration.Respondents in higher
    order unions were expected to have had more control over the decisions surrounding
    their current marriages than were individuals still reporting on a first marriage.
    Although union order did not successfully affect the decision-making power of
    the male respondents, the results among women were generally as predicted. When
    age at marriage was not controlled, women still in their first marriages had much
    less to say about whom they would marry than was true for women in higher-order
    unions. When age at marriage was controlled, however, the coefficient for union
    order became non-significant.The hypothesis focusing on the importance of union
    order was generated on the basis of the background material presented in [Chapter
    3](#Ch03.xhtml_ht0021). It suggested that although individuals in Indonesia still
    tend to honor the wishes of their parents when deciding whom to marry the first
    time, it is not uncommon for them to get divorced and remarried, the next time
    to someone of their own choosing. It is interesting to note that as individual
    input into the marriage decision has begun to increase, divorce rates in much
    of the country have begun to decline.As is true throughout much of the demographic
    literature, the importance of change over time has been a recurring theme throughout
    this analysis. Net of temporal changes associated with the variables that have
    already been discussed, it was hypothesized that individuals married longer ago
    would report having faced more severe parental constraints in choosing a spouse
    than would those married more recently. In all estimations run for both male and
    female respondents that hypothesis received strong support. Even given controls
    for the educational attainment levels of both the respondents and their fathers,
    the ages at marriage of both spouses, and the size of each respondent's community
    of residence prior to marriage, the marital duration variable was strong and significant.Given
    the strength of that variable, it was thought that the impact of change over time
    on the dynamics involved in the marriage decision warranted further investigation.
    As a result, the female sample was split by length of marital duration, separating
    those married for fewer than 15 years from those married for 15 years or more.
    The results indicate that both the educational attainment of the respondents themselves
    and the level of schooling of their fathers played much greater roles in improving
    the decision-making power of women married within 15 years of the survey than
    they did for women married longer ago. The same was true of the variable measuring
    marital duration itself. Not only advances in education, but also change over
    time that is independent of the other predictor variables, have therefore had
    a greater impact upon women's status in recent years than was true earlier on.Why
    recent increases in respondents' education have been especially important to the
    decision-making process is fairly easily explained, although why that is also
    the case for their fathers' education is less certain. The fact that the social
    climate has only recently become ripe for variation in the decision-making dynamic
    by level of fathers' schooling is probably related to the timing of earlier advances
    in education for men, however.Unlike education and marital duration, the size
    of the community in which the respondent lived before marriage was found to be
    particularly salient to the decision-making power of women who had been married
    15 or more years before the survey. This was argued to be due, at least in part,
    to the fact that recent improvements in transportation and increases in commuting
    throughout Java have combined to make premarital residence in a city much less
    important than it once was as a means by which exposure to modern or western values
    could be acquired.Age at marriage was also found to be a better predictor of decision-making
    power among older than among younger cohorts. That is probably because women who
    were married longer ago were much more apt to have married very early, sometimes
    when they were little more than children, than were women who were married more
    recently. As the average age at first marriage increased among the early cohorts,
    so did the likelihood that those getting married would be allowed at least some
    input into the decision-making process.Given the results of the analyses discussed
    so far, it was also thought that, net of other factors, change over time might
    have been of disproportionate benefit to women in the decision-making process.
    Unlike the coefficient gauging the interaction between gender and education,·
    however, the coefficient measuring the interaction between gender and marital
    duration was not significant. The data thus suggest that change over time as measured
    by marital duration has not been of particular benefit to women compared to men
    in the process of mate selection in Java.On the other hand, as long as age at
    marriage was not controlled, men did report having had more input into the marriage
    decision than did their wives. (Gender and age at marriage were highly correlated).
    Without that control, and with the inclusion of the variables measuring the interactions
    of gender with level of education and marital duration, women's decision-making
    scores were found to be lower than those of their husbands by 51 percentage points.
    This was important not only within the context of the dynamics involved in the
    marriage decision, but also because it set the stage for the second section of
    the analysis.As a rule, once the decisions leading up to a marriage have been
    made in Indonesia, the intergenerational component does not disappear from the
    decision-making process. Instead, spouses become central to the dynamic, while
    parents retain at least a peripheral interest in decision outcomes. The second
    portion of this research was designed to examine some of the intricacies of the
    decision-making processes that occur once a couple has married.The central hypotheses
    in the second analysis chapter focused primarily on post-nuptial migration and
    the frequency with which contact was maintained with the parents on both sides
    of the family. Again, all gained at least partial support. First, it was predicted
    that a move that allowed the couple to establish a degree of independence from
    parents and extended kin would enhance the woman's decision-making power within
    the family, and that this would be particularly relevant if the move took place
    within the first four years of the couple's marriage. Compared to cases in which
    neither the husband nor the wife had as yet moved, and compared to situations
    in which only one spouse had changed her/his place of residence, a post-marriage
    move made by both spouses within the first four years of marriage was expected
    to increase the level of control the woman had over household decisions.The data
    suggest that that is the case. When neither spouse moved within the first four
    years of their union, or when only the husband moved, the wife was found to have
    considerably less to say in decisions about the initiation of contraception than
    was true when both she and her husband relocated. In addition, when the woman's
    overall decision-making power was estimated, her intra-household status was found
    to be lower in cases in which neither spouse moved than when they both relocated
    within the first four years.It was also expected that, compared to cases in which
    both spouses moved after four years of marriage, women in the reference group
    (in which both spouses moved within the first four years) would have greater overall
    decision-making power. It was thought that couples who established their own homes
    comparatively early in the marriage would develop especially egalitarian relationships.
    That was not found to be the case, however. The status of women in the reference
    category was not significantly different from that of women who made a joint move
    with their husbands later in the marriage.Although the timing of the move was
    not initially found to be important in and of itself, an attempt was also made
    to gauge the salience of the distance covered by the move and the relationship
    between timing and distance. It was predicted that if the couple's relocation
    required that the woman move beyond the borders of her village, her intra-household
    status would suffer compared to that of women who did not make an exogamous move.
    That hypothesis was generated on the basis of information that suggested that
    the benefits of post-nuptial migration could easily be overridden by the disadvantages
    associated with the disruption of the woman's social networks.As expected, it
    was found that exogamous relocation early in a marriage did indeed reduce the
    decision-making power of the women in this sample. The effect was significant
    in the estimation of power in the contraception decision, as well as in that measuring
    control over the decision to limit further childbearing. If, however, the inter-village
    relocation took place after the couple had been married for at least four years,
    the wife's decision-making power was then found to improve. At that point the
    importance of her support systems apparently diminished, while the establishment
    of an independent residence became especially salient to the decision-making process.
    Together these findings demonstrate that, depending upon both the distance and
    the timing of a post-nuptial move, women can gain considerable influence within
    the household through residential relocation.Finally, it was predicted that women
    in marriages in which frequent contact is maintained with either or both sets
    of parents should have lower intra-household status than should women in marriages
    in which frequent contact is not maintained with the parents on either side of
    the family. Support was also attained for that hypothesis. When parents on both
    sides of the family were seen on a regular basis, the wife's intra-familial status
    suffered notably compared to cases in which no regular contact was reported. That
    was found to be the case in the estimation of the woman's overall decision-making
    power, as well as in the analyses pertaining to future childbearing and the allocation
    of the wife's earnings.because residential mobility remained a significant predictor
    even when the level of parental contact was controlled, it is evident that the
    actual physical relocation of the couple can have an independent effect upon the
    decision-making power of women in rural Java. Conversely, regardless of whether
    or not a move takes place, the amount of contact that is maintained with the parents
    on both spouses can have a significant impact upon the decision-making process.As
    has been discussed, several levels of participation are likely to be involved
    in each of these decisions. While parents do not necessarily have direct input
    into the decisions, they certainly help to mold the contexts in which the decisions
    are made. This appears to be particularly important in cases in which sons and
    daughters continue to co-reside with their parents or to see them a number of
    times each week.The salience of intergenerational dynamics to the decision-making
    process was reaffirmed in this analysis, as previous input into the marriage decision
    was found to be significant and positive in four of the five equations estimated
    in [Chapter 6](#Ch06.xhtml_ht0049). The more input both women and men had in the
    decision to marry, the more control they were then able to exercise in later household
    decisions.The impact or the independent variables measuring education and income
    on the woman's decision-making power differed with the analysis being conducted.
    The indicator for the wife's own earnings had an effect on her overall decision-making
    power and on her input into the decision to stop having children, while the level
    of her husband's income affected her ability to govern the use of her own earnings.
    As a rule, however, once the other variables were controlled, the education variables
    were found to be of little importance in affecting a woman's ability to influence
    the decision-making process; only the husband's educational attainment proved
    to be significant in predicting her overall decision-making power.While neither
    education variable significantly affected the husband's ability to control household
    decisions, the levels of both his own income and that of his wife were found to
    influence his overall decision-making power. The more he earned, the more he had
    to say about household matters, while the more she earned, the less control he
    was able to exert in the process. This was argued to reflect the importance for
    women of access to resources in determining their power in household negotiations.
    With less access, their relative power within the household (and probably the
    broader community as well) often becomes very limited.Finally, the impact of the
    variable measuring duration of marriage was somewhat ambiguous. While it failed
    to predict any of the dependent variables gauging women's decision-making power,
    the length of time spent in the current union was found to significantly affect
    males' perceptions of their inputs into the decision-making process. The longer
    the couple had been married, the more control the husband felt he had over important
    household matters. Given the controls for parental contact, this suggests that
    women who were married more recently should have more to say visa-vis their husbands,
    than should those married longer ago. Inter-spousal relationships in rural portions
    of Central Java may therefore be becoming increasingly egalitarian as the intra-household
    status of women in the region improves.This must remain a hypothesis for the time
    being, however, since the complete experience of the younger cohorts cannot yet
    be assessed. Future research will have to take a more in-depth look at these issues
    if more definitive information about that element of the decision-making process
    is to be ascertained.Despite the fact that little substantive evidence was previously
    available on the specific topics investigated in [Chapters 5](#Ch05.xhtml_ht0044)
    and [6](#Ch06.xhtml_ht0049), at least some support was offered for every hypothesis
    tested. Although the issues addressed in [Chapter 7](#Ch07.xhtml_ht0055) have
    been much more commonly researched, the hypotheses introduced in that chapter
    have proved to be much less successful in predicting the outcomes of interest.
    That portion of the analysis focused on the degree to which the status of women,
    both within the household and to a lesser extent throughout the broader community,
    affects contraceptive use and overall fertility.It was predicted that women with
    high levels or intra-household status would be the ones most likely to have ever
    used some form of contraception. Instead, the opposite was found to be true among
    the women in this sample. It was argued that given the sometimes coercive nature
    of Indonesia's family planning program, women with more power to control decisions
    within the household might also be those best able to resist outside pressures
    to adopt contraception when it is not desired. Whereas female decision-making
    power and ideal family size were inversely correlated, once family size was controlled
    the women with more strength to control matters within the household were found
    to be less likely than other women to have ever used contraception.This may help
    explain why women at the bottom of the earnings scale are so much more likely
    than those in the middle tiers to use contraception. Although it was anticipated
    in this analysis that increases in extra-household status, as measured by variables
    such as income and education, would also increase the likelihood that the couple
    would have used contraception at some point during their marriage, that was not
    found to be the case either.The educational attainment levels of both spouses
    were found to be significantly and positively associated with contraceptive use,
    but only at the bivariate level. When other variables that are highly related
    to education, such as the desire for additional children and the frequency with
    which contraception is discussed in the home, were controlled, the education coefficients
    became nonsignificant. In addition, the coefficient for the wife's earnings was
    significant and negative in this analysis. The related hypothesis therefore was
    not supported, as women with lower status on the second dimension were also found
    to be less likely to have ever used contraception than were higher status women.When
    the determinants of the number of children ever born were examined, the dependent
    variable was found to vary predictably with the measures of ideal family size
    and marital duration. In the most simple model estimated, increases in the levels
    of the husbands' education were also found to exert a positive effect on parity.
    Perhaps the most interesting finding, however, was that being an ever-user of
    contraception had a strong positive association with fertility as well. That result
    was not anticipated. Because it is not clear at what point in the parity progression
    contraceptive use actually occurred, however, the causal ordering of the variables
    measuring contraception and fertility is assumed to be backwards. Contraception
    was most likely being used as a means to discontinue childbearing by those who
    had had all the children they desired, while low parity women who had not yet
    reached their fertility targets had not yet used any method of birth control.
