- fmt: '

    In spite of some of the restrictions placed on women by the legal systems in Indonesia,
    a fair body of evidence exists to support the views of those who argue that the
    social position of women is relatively high in Indonesia (Mangkuprawira, 1981;
    Bangun, 1981; Koentjaraningrat, 1967). According to Ihromi et al., (1973:32),
    women now play central roles not only in the economy of the household, but in
    that of the broader society as well. Women from all socioeconomic status groups
    are able to participate in "education and employment so that it is a common phenomenon
    that women have a job outside the household, namely in offices and factories,
    as physicians, lawyers, judges and even as engineers, in addition to their participation
    in social and political activities."


    At the time of the 1980 Census, the highest proportion of women working in the
    urban labor market were employed in public service jobs (39 percent), followed
    closely by those in trade (33.6 percent), and those in the industrial/manufacturing
    sector (14.6 percent). Among urban males, the same was true. A third had jobs
    in public services (33.3 percent), followed by those in trade (20.2 percent) and
    those in industry (13.4 percent).


    Among women and men in rural parts of Indonesia, the proportions employed in different
    sectors of the economy were also comparable. Most (61.4 percent of the females
    and 67.3 percent of the males) were employed in agriculture. Among women, 15 percent
    were traders, 10.3 percent worked in the industrial/manufacturing sector, and
    9.8 percent worked in public services. Service employment was slightly more common
    among rural males, with 10.8 percent holding jobs so designated, while 7.5 percent
    were working in trade and 5.8 percent in industry/manufacturing. Although these
    figures demonstrate nothing about the relative positions of men and women within
    these fields, they do indicate that contrary to some of the information presented
    in [Chapter 2](#Ch02.xhtml_ht0012), women have at least been allowed access to
    the same sectors of the economy as have men.


    Some basic data on female and male occupations are presented in [Table 3.2](#Ch03.xhtml_cap_lbl0003).
    At the time of the 1980 Census, both men and women were more likely to work in
    agriculture than in any other sector of the economy, and both were less likely
    to be in management or administration than in any other occupational category.
    While men were more likely than women to be employed in production, transportation,
    or clerical and related work, women were more likely than men to hold jobs in
    sales or services. Finally, although in absolute numbers men filled the majority
    of positions as professionals and technical workers, as a percentage, women were
    slightly more apt to hold professional or technical jobs than were their male
    counterparts.


    ### The Rise of the Women''s Movement


    Many of the improvements that have occurred in the employment picture to date
    are the result of long concerted efforts to bring about such changes, efforts
    that in some cases were initiated prior to 1900. Among the first to trigger the
    feminist movement in Indonesia was Raden Adjeng Kartini (1879-1904). Records of
    her communications with a Dutch woman, whom she recruited to be her correspondent
    through a Dutch feminist newspaper, have provided invaluable information about
    the social position of Indonesian women at the turn of the century. In one of
    her letters written in 1899, she explains:


    "We girls, so far as education goes, fettered by our ancient traditions and conventions,
    have profited but little by these advantages.^([8](#Ch03.xhtml_fn0009)) It was
    a great crime against the customs of our land that we should be taught at all,
    and especially that we should leave the house to go to school. For the custom
    of our country forbade girls in the strongest manner ever to go outside of the
    house... When I reached the age of twelve, I was kept at home... I was locked
    up and cut off from all communication with the outside world, toward which I might
    never turn again save at the sight of a bridegroom, a stranger, an unknown man
    whom my parent would choose for me, and to whom I should be betrothed without
    my knowledge (quoted in Vreede-de Stuers, 1960:50-51)."


    Kartini''s experience appears to have been typical of that of the other young
    girls of her day and of her social class. N.D. Sewojo, an instructor at Djokjakarta''s
    Teachers'' Training College, has described the situation of Javanese women in
    the four socioeconomic groups of the time as follows. First, daughters of poor
    villagers did not attend school. They worked in the fields, at selling produce,
    and on occasion at sewing. Their lives were difficult but they were allowed a
    certain amount of independence. Daughters of wealthy villagers were taught household
    chores and were married between the ages of 12 and 15. They too received no schooling.
    Once married, they worked in conjunction with their husbands in trade or in agriculture,
    and were generally treated well.


    [TABLE 3.2:](#Figures.xhtml_bck_cap_lbl0003) OCCUPATIONS OF INDONESIAN MEN AND
    WOMEN AS OF 1980 CENSUS


    | Occupational Category | % Males Employed | % Females Employed |

    | --- | --- | --- |

    | Professional/technical, and related | 2.9 | 3.2 |

    | Management/ administrative | 0.2 | 0.1 |

    | Clerical and related | 4.8 | 1.5 |

    | Sales | 10.1 | 18.7 |

    | Service | 3.1 | 7.8 |

    | Farmers and agricultural workers | 55.8 | 52.4 |

    | Production, transportation, and related | 21.0 | 14.3 |

    | Others | 0.9 | 0.2 |

    | Not Stated | 1.2 | 1.8 |

    | Total | 100.0 | 100.0 |


    Daughters of the santri (religious teachers) did not receive formal education
    but were taught to recite the Koran at home. They were not married until age 15
    and tended to be held in high esteem by their spouses. Finally, daughters of the
    priyayi (noble civil servants), were allowed to attend some primary school, but
    only until the age of 12. After that they were forced to stay at home where they
    had many servants and lived very idle lives. They married when they were 15 or
    16 and continued a life of inactivity and confinement. Child marriages were possible
    in all classes. The rationale behind the promotion of such unions was to "prevent
    a girl from choosing according to the dictates of her heart rather than reason"
    (Vreede-de Stuers, 1960:52). Not surprisingly, children were seen as being far
    more malleable than older individuals. Although by 1900, 1200 desa (village) schools
    had been established, no public schools had as yet been made available to girls
    from the lower social classes in Indonesia. In an attempt to improve the situation
    of girls and women in her country, Kartini called for substantial increases in
    education for those from all socioeconomic groups. Her rationale was that education
    for girls was necessary, not so that women would compete with threaten men, but
    so that they could do a better job of raising their families and producing high
    quality members of society. That theme was picked up and reiterated throughout
    the history of the women''s movement in Indonesia. According to one government
    report: Indonesian feminism differs from Western feminism. The latter was mainly
    aimed at opposing the efforts of men, for the sake of the progress of the women...
    In Indonesia it was exclusively by way of educational efforts by women, and afterwards
    by way of [women''s involvement in] large parties and associations, that the [women''s]
    movement became the basis for the rise of national feelings of unity, of nationhood
    and in the resistance of Dutch and Japanese colonialism, so that in the end the
    situation was sufficiently ripe for the participation of women in the struggle
    for independence (Department of Information, 1968:11).


