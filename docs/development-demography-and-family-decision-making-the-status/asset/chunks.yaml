    ## Notes](#contents.xhtml_bck_ht0043)


    [1](#Ch04.xhtml_bck_fn012) For more detailed information about the sample, see
    Guest (1987).[2](#Ch04.xhtml_bck_fn013) Solo''s population in 1980 was 469,532,
    making that city the second most populous in the province of Central Java (Indonesia,
    Biro Statistik, 1983).[3](#Ch04.xhtml_bck_fn014) Sixteen of these comprised or
    abutted the Solo-Kartusoro urban center, and four formed portions of the district
    capital of Sukoharjo.[4](#Ch04.xhtml_bck_fn015) The population of Sukoharjo in
    1980 was 7992 (Indonesia, Biro Pusat Statistik, 1980), but the built-up area around
    Sukoharjo is actually comprised of four villages. For practical purposes, the
    total population of the urban area was 24,006.[5](#Ch04.xhtml_bck_fn016) One household
    also had to be dropped from the sample because of the mental handicaps of its
    members.[6](#Ch04.xhtml_bck_fn017) For example, although the differences in the
    amounts of leisure time available to husband and wife has been argued to be quite
    large in Java (with the man reportedly working two and a half fewer hours per
    day than his spouse (Birdsall and McGreevey, 1983)), leisure time is particularly
    difficult to estimate as Javanese do not have a clear conception of time, and
    the distinction between leisure and work activities is often vague.[7](#Ch04.xhtml_bck_fn018)
    Both composite indicators have been standardized by subtracting the mean from
    each value on the three components, and then dividing by the standard deviation.[8](#Ch04.xhtml_bck_fn019)
    Pre-marital cohabitation is virtually unheard of in rural Javanese populations.[9](#Ch04.xhtml_bck_fn020)
    Parents who were no longer living fell into the last category. They were not excluded
    from the analysis, but rather viewed as an extreme end of the continuum. Since
    older respondents were apt to be those with deceased parents, the exclusion of
    each case of a non-living parent would have meant lost information on an important
    category of respondents, and would have further reduced the number of cases.[10](#Ch04.xhtml_bck_fn021)
    Even after the log transformation, husbands'' income exhibited no significant
    bivariate relationship to decision-making power.

