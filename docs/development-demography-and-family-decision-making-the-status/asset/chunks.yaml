    1 有关样本的更多详细信息，请参见 Guest (1987)。2 1980 年 Solo 的人口为 469,532，使该市成为中爪哇省人口第二多的城市（印度尼，统计局，1983）。3
    其中 16 个村庄构成或邻接 Solo-Kartusoro 城镇中心，有 4 个形成了苏科乔（Sukoharjo）县府的一部分。4 1980 年苏科乔的人口为
    7992（印度尼，中央统计局，1980），但苏科乔周边的建成区实际上由四个村庄组成。出于实际考虑，该城市地区的总人口为 24,006。5 由于一个家庭成员存在精神残疾，该家庭必须从样本中剔除。6
    例如，尽管有人认为爪哇丈夫夫妇之间的可用空闲时间差异很大（据报道，男性每天的工作时间比配偶少两个半小时（Birdsall and McGreevey, 1983)），但空闲时间特别难以估计，因为爪哇人对时间没有清晰的概念，且休闲与工作活动之间的界限往往是模糊的。7
    两个综合指标都通过从每个分量的数值中减去平均值，然后除以标准差进行了标准化处理。8 在爪哇农村人口中，婚前同居几乎闻所未闻。9 已去世的父母归入最后一类。他们没有被排除在分析之外，而是被视为连续体的一个极端。由于年龄较大的受访者往往父母已故，因此排除每个去世父母的案例意味着丢失了重要受访群体的信息，并会进一步减少案例数量。10
    即使在对数转换后，丈夫收入与决策权之间也没有表现出显著的二元关系。

