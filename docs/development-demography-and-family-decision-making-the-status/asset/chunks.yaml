    Women who were married over 25 years prior to the survey were least affected by
    the government''s efforts to bring about reductions in fertility, and many may
    have even completed their childbearing before information about contraception
    and family planning services became available in the villages.


    The ever-use of contraception is also a significant predictor of fertility, but
    the direction of the effect is opposite to that anticipated. In this case, contraceptive
    use is strongly and positively associated with the number of children ever born.
    While promoters of family planning programs generally operate under the assumption
    that increased access to and use of birth control methods will lead to declining
    fertility levels, the causation may at times run in the reverse direction. That
    appears to be the case among the couples in this sample, as contraception is often
    adopted in order to limit fertility after several children have already been born.
    In this research, being a contraceptive user is associated with having had approximately
    one child more, on average, than is true among non-users. Because the temporal
    order may be the opposite of that predicted, contraceptive use or non-use is probably
    a better predictor of whether or not an additional child will be conceived than
    of the number of children already born to the sampled women.


    The only other variable that significantly influences fertility is the husband''s
    education, and it is significant only when ideal family size and contraceptive
    use are not controlled. While higher education is frequently found to have a dampening
    effect on fertility in developing countries, that effect is often indirect. For
    example, increases in women''s education tend to exert upward pressure on the
    age at first marriage, which, in turn, exerts downward pressure on fertility.
    When variables such as age at marriage are controlled, the effect of education
    frequently disappears, or in some cases, reverses.


    There are several reasons why such a reversal can occur, particularly if it is
    the coefficient for the woman''s education that becomes positive. In many parts
    of the world education still enhances a woman''s "ability to have live births,
    probably through improved health, better nutrition, and the abandoning of traditional
    patterns of lactation and postpartum abstinence" (Cochrane, 1979:10). In addition,
    higher levels of education are often associated with more stable unions (and therefore
    with increased marital durations), and ultimately with increased exposure to the
    risk of pregnancy (Ware, 1981).


    The fact that it is the husband''s level of schooling that significantly affects
    fertility in this analysis, is probably as much related to the level of union
    stability as it is to any of the other factors described above. In addition, however,
    men from the upper socioeconomic strata are less likely than others to be constrained
    by the "Malthusian pressures" that have been argued to influence Indonesian contraception
    and fertility patterns.


    All of the other variables included in this portion of the analysis were found
    to be non-significant in all three regressions estimated. The woman''s age at
    marriage, her union order, and her education and income all fail to predict the
    number of children she has had when the other variables are controlled. More important
    for this particular analysis, however, is the fact that the variable measuring
    the woman''s decision-making power remains non-significant in every estimation.
    As a result, `Hypothesis 7.2` is not supported.


    As has been mentioned, this may be due in part to the influence of the government''s
    family planning program. Government officials appear eager to recruit new acceptors
    of all childbearing ages and backgrounds, yet as long as large families remain
    desirable in Java, women with the least power to resist outside pressures (be
    they social or economic), will generally be the ones most easily persuaded to
    join the program.


    ## Summary


    Although the variables measuring parental contact and post-marriage mobility were
    expected to affect contraception and fertility only indirectly via their effects
    on the woman''s decision-making power within the family, the mobility variables
    were found to have separate direct effects on the couple''s contraceptive use
    or non-use. Compared to cases in which neither spouse moved after marriage, if
    either or both relocated, the likelihood that they had ever used contraception
    increased. The frequency with which couples discussed family planning matters
    also positively affected contraceptive use, as did being part of a more recent
    marriage cohort.


    Variables that were found to exert a dampening influence upon contraception include
    the woman''s desire to continue childbearing, membership in an earlier marriage
    cohort, the log value of the wife''s income, and the amount of decision-making
    power she perceives herself to have within the household. Again, the latter was
    not anticipated, but probably reflects the fact that low-income women and those
    with very little control over household decisions might be the ones most susceptible
    to outside pressure to adopt contraception. The only variables not found to be
    significant predictors of contraception include the educational attainment levels
    of both spouses and the size of the community in which the wife lived prior to
    marriage.


    As a consequence, neither hypothesis pertaining to contraceptive use is supported
    by the multivariate analysis. The evidence suggests that women with higher status
    both within and between households are less likely to use contraception than are
    women with lower status on both dimensions. Whereas the amount of discussion that
    takes place about contraception and other household matters can often be a good
    indicator of the level of equality within a relationship, in this case it may
    simply reflect the fact that before contraception is initiated a certain amount
    of discussion on the subject is likely to occur. Education is a good predictor
    of status across but not within categories of the other variables.


    Three `OLS` regression equations were estimated to analyze fertility in rural
    Java, in the first equation, marital duration and the husband''s level of schooling
    were both found to have a positive impact upon fertility. When the variable measuring
    ideal family size was added in the second equation, it too was found to exert
    a positive influence on `CEB`. The addition of that variable caused the coefficient
    measuring the husband''s education to weaken and become non-significant, however.


    In the final equation, the variable measuring contraceptive use was added. The
    effects of ideal family size and marital duration remained significant and positive,
    thus reaffirming that both lengthy marital unions and large family size preferences
    are associated with high levels of fertility. Not anticipated, however, was that
    the ever-use of contraception would also exert a positive effect upon fertility.
    This was argued to be a function of reverse causality, as women who had already
    had several children eventually decided to adopt contraception in order to limit
    further births. Again, neither hypothesis pertaining to the impact of women''s
    status upon fertility was supported. Although the bivariate association between
    education and fertility was significant and in the direction predicted, neither
    education variable was significant when all other variables were controlled.


