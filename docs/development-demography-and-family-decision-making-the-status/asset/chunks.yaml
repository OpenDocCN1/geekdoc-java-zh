    have been utilized as sampling frames in other studies on Indonesia, problems
    have at times arisen from their use; e.g., lists have been out of date or incompiete.
    In spite of the limitations, Hugo (1982) has argued that these problems are apt
    to be less severe in Java than elsewhere in Indonesia, and that village registers
    in that province are probably suitable for use as sampling frames as long as appropriate
    precautions are taken.


    Village registers were available for all four of the villages selected for this
    research, but they varied in level of completeness and method of upkeep. In Jombor
    and Mandan, the registers were maintained by the head of each neighborhood (`ketua
    rukun tetangga (R.T.)`), or administrative unit. Each `R.T.` averages around 30
    households. Officials from both villages claimed that their registers were regularly
    updated, and both sets of listings were approximately one year old. It was discovered,
    however, that three of the `R.T.`s in Mandan had no registers, and the appropriate
    lists had to be constructed in order for those neighborhoods to be included in
    the sampling frame.


    In Kenep separate registers were not kept for each `R.T.`. Instead there were
    three registers, each covering a number of the neighborhoods. Again, all three
    were supposed to be updated on a regular basis, yet one `R.T.` was missing from
    the listings. The official in charge of that register (the `kebayan`, or link
    between the top village office and the neighborhood), explained that `R.T.` was
    too far away to attain the appropriate information. As a result, a special register
    also had to be constructed for that neighborhood. Finally, in Wonorejo there was
    only one register and it had not been updated since the 1980 Census.


    A preliminary survey was conducted in each neighborhood in all four villages in
    order to:

    1) check the accuracy of these registers,

    2) obtain information about household mobility (to further update the registers),

    3) gather insights into local household structures, and 4) accustom people to
    the idea of the upcoming formal survey.


    The data gathered during the informal preliminary survey were then compared with
    those available through the household registers. In Jombor, Kenep, and Mandan
    the results indicated that the registers were of sufficiently high quality to
    allow them to be used in the sampling frame. In Wonorejo, however, the register
    was badly out of date and highly inaccurate. As a result, it was disqualified
    from the sampling frame and a household register maintained by officials in charge
    of family planning was tested. The family planning roster contained data on the
    name, sex, age, and often the family planning status of household members. It
    was found to be quite accurate, and so was also approved for the sampling frame.


    Once the preliminary sampling frame was established, it was updated by the heads
    of each neighborhood. Households that had dissolved because of the death or out-migration
    of its members were eliminated from the sampling frame, and those newly created
    through in-migration or other relocation were added. A preliminary sample of 160
    households was then drawn from each of the updated registers.


    The registers were arranged by `R.T.` so there existed an internal stratification
    by geographic area within the village. The sampling method used was systematic
    sampling with a random start. After the initial sample selection, a further systematic
    sample of 10 households from the original survey was undertaken. These 10 households
    were to serve as replacement if, for any reason, it was not possible to obtain
    interview households from the sample (Guest, 1987:91).


    Unfortunately, however, given the length of the questionnaire administered to
    the household heads, and given limited time and financial resources, it soon became
    apparent that completion of the survey under existing conditions would be unlikely.
    It was therefore necessary to reduce the sample to 130 households per village,
    and to do so by restricting the sample to households in which the household head
    was aged 60 or less. This decision was made for several reasons (e.g., older respondents
    are often more difficult to interview than younger individuals), but was particularly
    important for this research. Since the aim of this investigation was to interview
    women who were still in or close to their childbearing years, most women married
    to men well over 60 years of age would eventually have been excluded from the
    reduced sample utilized in this study. The decision to restrict the sample to
    households headed by younger individuals thus ensured that the specific sub-sample
    utilized for this research would not be radically reduced.


    In cases in which the age restriction lowered the village samples below the targeted
    130 households, substitutes from the replacement sample were used. If all replacements
    were included and the target still fell short of the 130 households needed per
    village, the original households were replaced by the households closest to them.
    When the final sample for the complete field project was drawn, it was viewed
    as a representative sample of households headed by males aged 60 or Jess. Female
    headed households are probably under-represented, however.^([5](#Ch04.xhtml_fn0016))


    Eventually the members of 522 households were interviewed. There was only one
    household refusal. Of the 1348 individuals who were members of the households
    selected, however, 25 were sick or could not be located. As a result, information
    on them as well as on the 240 household members who lived outside the village,
    was obtained from other members of the household.


    In this research, the unit of analysis is the individual woman. The sample has
    been limited to all currently married women aged 50 or less, along with their
    husbands in cases in which interview data are available on them. As a result,
    453 women and approximately 400 husbands comprise the final sample.


    The basic age and sex distribution of the sample utilized in this research (minus
    the men over age 50) is presented by village in [Table 4.2](#Ch04.xhtml_cap_lbl0010).
    As would be anticipated, the women tend to be younger as a group than do the men,
    but there is nothing otherwise striking about this distribution. No major differences
    are observed between villages, and no highly unusual patterns occur within any
    of the groups within villages.


    ## [The Interviewing](#contents.xhtml_bck_ht0038)

