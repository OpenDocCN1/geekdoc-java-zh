    [(a)](#Ch06.xhtml_bck_fn0002ba) Reference category contains couples in which both
    spouses moved within first four years of marriage.

    [(b)](#Ch06.xhtml_bck_fn0002bb) Reference category refers to women who have not
    moved since marriage.

    [(c)](#Ch06.xhtml_bck_fn0002bc) Reference category contains couples who do not
    have frequent contact with either set of parents.** Significant at the .05 level;
    ** Significant at the .01 level; ***Significant at the .001 level. (2 tailed test
    of significance).


    Higher earnings on the part of their wives, however, yield lower levels of decision-making
    power for male respondents; the less their wives earn, the more power the men
    feel they can exert in major household decisions. This supports the view that
    access to resources is important in order for women to be able to exercise some
    control in inter-personal relationships.


    The coefficient for the variable measuring marital duration is also highly significant
    and positive. The longer a couple has been married, the more control the husband
    feels he has over major household decisions. It has been argued that couples married
    longer ago are apt to be those characterized by more traditional patterns of male
    dominance, and that those married more recently should be those among whom more
    egalitarian relationships should prevail. While that explanation may be plausible,
    caution must be exercised before relying to heavily on the conclusion above. It
    could also be, for example, that males at higher marital durations have gained
    power vis-a-vis their parents. While the positive effect of marital duration is
    not the result of the fact that older parents are no longer living (since that
    information would have been picked up in the controls for parental contact), it
    could reflect the fact that once parents become increasingly aged their input
    into major decisions begins to decline. The positive impact of marital duration
    upon a husband''s ability to control household matters therefore probably arises
    out of a combination of intergenerational and inter-spousal dynamics.


    Finally, it was thought that a control for the composite measure for the wife''s
    perceptions of her decision-making power would provide additional information
    about how males view their own power. Given the framework within which the husband''s
    responses are analyzed, it would be expected that the more power one spouse believes
    herself/himself to be able to exercise, the less power the other spouse would
    probably perceive herself/himself to have. This is not found to be the case, however.
    Instead, the greater the wife''s perceived autonomy within the household, the
    more power the husband believes himself to have as well. This may reflect variations
    in the amount of discussion that takes place on particular topics. If, for example,
    a given subject is discussed a great deal, any outcome resulting from the conversation
    may be viewed as a definite decision, rather than as an event that takes place
    simply by default; if a great deal of conversation is needed to determine a course
    of action, both spouses may believe that they had a substantial amount of input
    into the decision in question.


