    它们已被用于其他关于印度尼西亚的研究的抽样框，但在使用过程中有时会产生问题；例如，名单过时或不完整。尽管存在这些局限性，但 Hugo（1982）认为，这些问题在爪哇等地可能比印度尼西亚的其他地区严重，而且只要采取适当的措施，该省的村庄登记可能适用于抽样框。


    本研究选出的四个村庄都有村庄登记，但其完整程度和维护方法各不相同。在 Jombor 和 Mandan，登记由每个社区（`ketua rukun tetangga
    (R.T.)`）或行政单位的负责人维护。每个 `R.T.` 平均有 30 户家庭。这两个村庄的官员都声称他们的登记定期更新，且两组名单大约都是一年前的。然而发现，Mandan
    的三个 `R.T.` 没有登记，为了将这些社区纳入抽样框，必须重新编制相应的名单。


    在 Kenep，并没有为每个 `R.T.` 建立单独的登记。相反，有三个登记，每份登记涵盖若干社区。同样，这三份登记本应定期更新更新，但名单中缺少一个 `R.T.`。负责该登记的官员（`kebayan`，即村委会与社区之间的纽带）解释说，该
    `R.T.` 太远，无法获取相关信息。因此，还必须为该社区编制一份特殊的登记。最后，在 Wonorejo，只有一份登记，且自 1980 年人口普查以来没有更新过。


    在四个村庄的每个社区都进行了一项初步调查，以：

    1) 检查这些登记的准确性，

    2) 获取有关家庭流动性的信息（以进一步更新登记），

    3) 收集有关当地家庭结构的见解，以及 4) 让人们熟悉即将进行的正式调查这一理念。


    随后，将非正式初步调查期间收集的数据与通过家庭登记获得的可用数据进行比较。在 Jombor、Kenep 和 Mandan，结果显示登记的质量足够高，可以将其用于抽样框。然而，在
    Wonorejo，登记严重过时且非常不准确。因此，它被排除在抽样框之外，并测试了由负责计划生育的官员维护的家庭登记。计划生育名单包含了家庭成员的姓名、性别、年龄，通常还有计划生育状况。结果发现它相当准确，因此也被批准纳入抽样框。


    初步抽样框建立后，由每个社区的负责人进行了更新。由于成员死亡或迁出而解散的家庭从抽样框中删除，而通过迁入或其他搬迁新建立的家庭则被加入。随后，从每个更新后的登记中各抽取了
    160 户家庭的初步样本。


    登记按 `R.T.` 排列，因此村庄内部存在地理区域的内部分层。使用的抽样方法是带有随机起点的系统抽样。在初始样本选择之后，从原始调查中又进行了 10 户家庭的进一步系统抽样。这
    10 户家庭将在由于任何原因无法从样本中获得访谈家庭时，作为替补样本使用（Guest, 1987:91）。


    遗憾的是，由于给户主填写的调查问卷很长，且时间和财务资源有限，很快就会发现在现有条件下完成调查是不可能的。因此，有必要将样本减少到每个村 130 户家庭，办法是将样本限制在户主年龄在
    60 岁及以下的家庭中。做出这一决定是出于几个原因（例如，年长受访者通常比年轻人更难访谈），但对于本研究尤为重要。由于这项调查的目的是访谈仍处于或接近生育期的女性，大多数嫁给年龄远超
    60 岁男性的女性最终将排除在本研究所采用的缩减样本之外。因此，将样本限制在由年轻人户主的家庭这一决定，确保了本研究使用的特定子样本不会发生剧性减少。


    在年龄限制导致村庄样本低于目标 130 户家庭的情况下，使用了来自替补样本的替补者。如果包含了所有替补者，目标仍未达到每个村所需的 130 户家庭，则用离原家庭最近的家庭替换原始家庭。在抽取整个实地调查项目的最终样本时，它被视为
    60 岁或以下的男性户主家庭的代表性样本。然而，女性户主的家庭可能代表不足^(5)


    最终，对 522 户家庭的成员进行了访谈。只有一户家庭拒绝了。然而，在选定家庭的 1348 名成员中，有 25 人生病或无法找到。因此，关于他们以及 240
    名住在村子外的家庭成员的信息是从该家庭的其他成员处获取的。


    在这项研究中，分析单位是个体女性。样本局限于所有年龄在 50 岁及以下的已婚女性，在有他们访谈数据的情况下，还包括他们的丈夫。因此，453 名女性和约 400
    名丈夫组成了最终样本。


    本研究使用的样本的基本年龄和性别分布（不包括 50 岁以上的男性）按村庄列在表 4.2 中。正如预期的那样，女性倾向于比男性群体更年轻，但这种分布没有其他引人目的之处。

