    \ research and is considered to define an economic unit in Javanese society\"\
    \ (Guest, 1987: 84). Since the village with the fewest households had 696 (Kenep),\
    \ while that with the most had 788 (Mandan), the number of households varied little\
    \ between villages. As a consequence, it was not necessary to weight the sample.\
    \ The target population included all households in the four villages.Village registers\
    \ were used to select the households. These registers are made up of lists of\
    \ all household members by age, sex, and religion. Less complete information is\
    \ available on the primary occupations and educational attainment levels of household\
    \ members, and on the consumer goods they own. The lists are utilized for Census\
    \ enumerations, village statistical reports, and the issuance of identification\
    \ cards, and so are generally assumed to be maintained with reasonable accuracy.\
