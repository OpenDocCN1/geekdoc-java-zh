    \ equally with others in making the decision, 4) the decision was primarily made\
    \ by others, but she was allowed some input, or 5) the decision was made entirely\
    \ by other individuals, and she was allowed no input whatsoever. Husbands were\
    \ also asked how much control they had over important household decisions, and\
    \ the questions addressed to them followed the same format.\n\nAll together five\
    \ dependent variables are analyzed in [Chapter 6](#Ch06.xhtml_ht0049). Four measure\
    \ the status of women as perceived by the women themselves, and a fifth measures\
    \ their husbands' views of their input into the decision-making process. Of the\
    \ variables that pertain to the female respondents, one measures women's inputs\
    \ into decisions regarding resource control, one measures their control over fertility\
    \ decisions, one measures decisions regarding ever-use of contraception, and one\
    \ is a composite indicator. The first of these four, the resource control variable,\
    \ measures the amount of control women who earn a cash income feel they have over\
    \ decisions regarding how that income is utilized. The second measures how the\
    \ decision to stop childbearing was made, for women who claim they plan to have\
    \ no further children. The third measures how ever-users of birth control decided\
    \ to adopt contraception for the first time, and for the fourth variable, an average\
    \ and standardized score of the woman's power as measured by the other three variables\
    \ was calculated. Finally, the fifth variable is a composite measure for the husband's\
    \ score based on the same three indicators.^([7](#Ch04.xhtml_fn0018))It might\
    \ be expected that once a couple is married, the decisions made within the household\
    \ should primarily involve the two spouses, and indeed that is often the case.\
    \ On the other hand, parents in Indonesia frequently maintain an active interest\
    \ in the lives of their adult children, and continue to take part in intra-household\
    \ decision-making after the couple has married.\n\n### Predictors of Intra-Household\
    \ Status\n"
