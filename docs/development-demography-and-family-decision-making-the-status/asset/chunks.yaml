    those who have low extra-household status. Although migration is also likely to
    enhance status on this dimension, measures of this type of status are introduced
    primarily as controls; the connections between migration and extra-household status
    (Shaw, 1975), as well as those between extra-household status and fertility and
    contraception (United Nations Secretariat, 1984) are already well documented,The
    goal of this research is not to investigate all of the determinants of family
    size or family planning utilization in Indonesia; nor is it intended as a study
    of migration and fertility. The analysis focuses on three specific topics: 1)
    the intergenerational dynamics involved in the marriage decision and how men and
    women fare differently in the process, 2) the continued influence of the extended
    family, often varying as the result of migration or residential mobility as well
    as by the amount of contact that is maintained with the parents on both sides
    of the family, upon a woman''s position within the household after she is married,
    and 3) how these factors in turn affect contraceptive use and fertility, both
    of which are central to family and community life in Indonesia.


    # [2


    Women, Development, and Demographic Processes](#contents.xhtml_bck_ht0012)'
