    According to Mangkuprawira (1981), while most women in Indonesia undertake wage
    work outside the home only when economic necessity demands it, necessity has become
    the rule rather than the exception in most parts of the country. Although the
    bulk of the earnings of women in rural areas comes from agricultural production,
    uneven land distribution, high population density, and lack of industrial growth
    make maintaining a subsistence living (roughly 1200 kgs. of rice per year) difficult.
    In Java and elsewhere, women have long worked side by side with men in the fields
    playing the dual roles of housewife and wage earner (Mangkuprawira, 1981).


    Unfortunately, as is true throughout much of the developing world, precise measurement
    of women''s work presents a formidable challenge in Indonesia. In a recent review
    by Hugo et al. (1987), the authors argue that changing definitions of labor force
    participation have rendered available data unsuitable for measuring temporal changes
    in female rates. Because women''s activities are so often "on the borderline between
    ''economic'' and ''noneconomic''" and because women "are also more likely to work
    part time, erratically or seasonally in those activities... conventions about
    how to treat such activities can have an important bearing on the size of the
    female labour force measured by censuses or surveys" (Hugo et al., 1987: 251).
    Regional differences, on the other hand, can be more fruitfully analyzed and the
    data suggest that rates "in the Javanese areas are always well above the Indonesian
    average" (Hugo et al., 1987:252).


    By most definitions the amount of land owned by the household and the proportion
    of time women spend engaged in income earning activities are inversely correlated,
    as women from households with large landholdings are generally not compelled to
    supplement the family income through outside employment. As a consequence, the
    more land the household controls, the higher the proportion of time women will
    designate for housework. Women from poorer households spend more time engaged
    in wage labor, and thus have fewer hours to allocate to domestic work (or to leisure
    activities).


    On the other hand, although much of the agricultural work is seasonal and the
    hours spent engaged in agricultural production decline from December to March
    among all socioeconomic groups, the hours spent on household work vary little
    across seasons. As a rule, whatever the season, middle-class women spend more
    time on domestic work and less time in the labor force engaged in "directly productive
    activities" than do the women from the bottom strata. Across income groups, women
    with many children are also more apt to be involved in wage work than are those
    with fewer children. The more children there are, the more money is needed to
    support the family, and the greater the likelihood that some of the children will
    be old enough to look after their younger siblings while their mother works (Mangkuprawira,
    1981).


    Much of the directly productive work that is done by Javanese women is in wet
    rice cultivation. Although historically, that type of work has been highly labor
    intensive, the recent growth of new technologies in agricultural production has
    been labor-replacing. The advent of sickle methods has lowered demand for laborers
    during the harvest, while the mechanization of hulling and milling has brought
    about a similar decline in the demand for hand-pounding labor. Since the majority
    of handpounding and harvest work has traditionally been done by women, both new
    technologies have been particularly detrimental to their position in the labor
    force (Mangkuprawira, 1981).


    For this and other reasons, returns to female labor in rural Java are generally
    low. Given the seasonality of women''s agricultural work, much of their time is
    spent in occupations that offer little payoff. Because "of low returns for labor
    of the ''open-access'' occupations and the limited access of the others, there
    is no single occupation in which women can earn much more than their own support
    throughout the year... [In addition,] hardly any rural woman manages to secure
    employment for 365 days a year and thus female incomes remain well below the poverty
    line" (Mangkuprawira, 1981:103; White, 1976).


    ### The Sexual Division of Labor

    Within the household, men do an estimated 62 percent of the agricultural work,
    yet women work an average of three hours more per day than do their husbands.
    Although men spend more time in directly productive tasks than do their wives
    (7.9 hours per day for men and 5.9 hours for women), women contribute more hours
    to activities that are "indirectly productive" (White, 1976; Mangkuprawira, 1981).
    Because women have access to fewer job opportunities and face greater constraints
    in the job market, their participation in directly productive work can be less
    than half that of men. This is especially likely to be the case where infant mortality
    rates and child/woman ratios are high (Mangkuprawira, 1981; Connell and Lipton,
    1977).


    According to Geertz (1961), there are several possible combinations of husband-wife
    labor allocation within the Indonesian household. In one scenario, the man works
    and his wife stays home. In another, husbands and wives work together in agriculture
    as a team; although there is some sex-specificity as to the tasks undertaken by
    each spouse, many of their activities are interchangeable. In the third case,
    the husband and wife may again be viewed as a team, but in business, often as
    market traders. Finally, the husband may provide greater input into directly productive
    tasks, while his wife does something that is less "directly productive" at home.


    Of the four possible combinations, it appears that it is most common for husbands
    and wives in Central Java to work together as a team, generally in agriculture,
    in order to support a family (Koentjaraningrat, 1967). Further support may thus
    be offered for the idea that Central Javanese women may be in Boserup''s (1970)
    third phase of agricultural development. While certain tasks are gender-specific,
    it does not appear that particular jobs are more highly valued than others.

