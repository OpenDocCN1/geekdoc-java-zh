    `adat`（或习惯法）管辖印度尼西亚所有宗教团体的所有成员，但该国人口大多数是穆斯林，因此也受 `fikh`（伊斯兰法）的约束。这两个法律体系之间的区别有时非常微妙，因为它们确实存在某种程度的重叠，但到为止尚未演变出统一的法律。人们承认，将这些成典化符合包括妇女在内的许多群体的利益，因为她们的行为受这两套法律的共同约束，但目前为止进展甚微。


    结果，群体内部的关系目前取决于祖先的习俗，即 `adat`——这是一个由不可分割的非成文规定构成的整体，法律专家习惯于将其区分为民法、私法、婚姻法和继承法；它是一个随地区、起源和信仰而异的不可分割的整体，并随着社会群体的变迁随时间推移而演变（Vreede-de
    Stuers, 1960:21）。从本质上说，`adat`影响的是作为社会成员的男性或女性，而不是作为个人，尽管有人认为个人与社会成员之间的区别不应被夸大。


    ### Adat 内部的社会系统

    在 `adat` 内部，母系、父系和双系社会系统均在运行。在爪哇岛，双系系统最为常见。因此，这对夫妇所生的孩子属于家庭双方，儿子和女儿都可以继承财产。在结婚夫妇之间，“任何一方在婚姻期间继承或获得的财产，即
    `(gani-gini)`，成为共同财产，他们对其拥有平等的权利”（Vreede-de Stuers, 1960:30）。如果夫妻决定分开，男性带入婚姻的所有财产将留在他自己的家庭中，而女性带入婚姻的财产将留在她自己的一方。婚后获得的财产将进行分割，妻子获得其价值的三之一，而丈夫获得二之二（Koentjaraningrat,
    1967）。


    ### Adat 习俗下的婚姻

    根据 `adat` 的规定，婚姻是：

    - 是一种仪式，象征着男性和女性从独身状态进入婚姻状态。从这种解释中，产生了例如爪哇人在这种种场合更改姓名的习俗。“结婚的年轻男孩和女孩取一个对双方来说都是新的名字，作为统一的象征”（Vreede-de
    Stuers, 1960:33）。


    与大多数受 `adat` 管辖的各个方面一样，婚姻是根据对群体认为有利的因素决定的。婚姻是两个家庭之间的协议，年轻人可能被剥夺婚姻决策的直接参与权。尽管父母试图考虑他们的喜好，但婚姻并不被视为让个人快乐的手段（Ihromi
    et al., 1973）。“婚姻变成了一项责任，老女受到蔑视。女性只有在成为妻子和母亲后，才能证明她们的真实价值并获得充分权利”（Vreede-de Stuers,
    1960:31）。


    在国家的某些地区，个人必须结婚才能参与任何涉及家庭或社区的决策。在某些情况下，只有有孩子的女性才被允许提供意见；而在严格的父系制或母系制情况下（这两种在印度尼西亚都存在），只有拥有相应性别孩子的人才能参与此类决策（Ihromi
    et al., 1973）。因此，印度尼西亚的大部分习俗具有功能性，直接旨在确保家族的延续。结果，在 `adat` 和伊斯兰法下，不育都是离婚的理由，这并不令人意外（Vreede-de
    Stuers, 1960）。


    ### 比较：Adat 与伊斯兰法

    这两个法律体系的一致程度实际上是相当大的，它们在管辖婚姻习俗方面的作用提供了一个很好的例子。在伊斯兰法下，婚姻被视为一种“通过这种方式，丈夫获得了对妻子的某些权利，而妻子作为交换，主张获得对待”（Vreede-de
    Stuers, 1960）。在理论上，他们的结合构成了两个个人之间的合同，并需要双方的同意。然而，在 `adat` 下情况也是如此，“在实践中，群体影响了选择，婚姻的安排是‘家庭的事务，而不是未来夫妻双方的事务’”（Gardet,
    1954:250，引自 Vreede-de Stuers, 1960: 31）。


    同样有趣的是，一些在伊斯兰教引入印度尼西亚之前就在 `adat` 之下开始的包迫婚姻、多妻制、童婚和弃妻权等习俗，现在经常使用伊斯兰法来加强。


    总而言之，个人在婚姻前、期间和婚后的许多行为都是根据法律原则进行规范的。在伊斯兰法下，丈夫有义务抚养其繁衍家庭。他不能“离开家超过两年；如果有几位妻子，有义务平等地对待她们；并且必须忍制可能导致身体伤害的恶劣对待”（Vreede-de
    Stuers, 1960:33）。然而，如果婚姻最终证明失败，可以在丈夫请求下在未经妻子同意的情况下判决离婚。非婴儿幼儿的监护权可以判给任何一方，但婴儿始终留在母亲身边。无论监护权决定的结果如何，离婚后父母双方都对所有孩子的健康负责（Koentjaraningrat,
    1967）。


    ### 总结

    简而言之，有特定的法律管辖印度尼西亚人一生中的一系列行为。有时这些法律是互补的，而另一些它们是矛盾的，但没有设定的规定规定在出现差异时哪一个优先有效。本研究的主要兴趣点涉及围绕进入婚姻的习俗。在
    `adat` 下，规则随所执行地区的家庭系统而变化，有时也随城市或农村居住而变化。在以双系系统为常的爪哇岛，配偶的选择不像印度尼西亚其他许多那样受到严格控制。然而，正如所提到的，家庭双方的成员确实参与婚姻决策，所选中的配偶被认为能够加强现有家庭（Ihromi
    et al., 1973）。


