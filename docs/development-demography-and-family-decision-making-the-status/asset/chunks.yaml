    总结来说，女性对印度尼西亚的家庭经济做出了巨大贡献。尽管她们的劳动回报通常较低，但她们频繁活跃于劳动力市场。家庭越贫困，女性就越可能寻求外出就业，并从事长时间工作。当考虑到直接和间接生产性活动的结合时，女性每天的工作时间比其男性同多出约
    2.4 小时。由于男性在直接生产性工作上花费的时间通常比妻子多，这种差异很大程度上归因于家务活动中投入的不同。然而，有趣的是，在孩子非常年幼时，男性和女性都会照顾孩子。


    出于这些及其他原因，女性被认为在印度尼西亚家庭中拥有较高的地位。决策通常是共同做，特别是在受教育程度较高且更富裕的夫妇中，且女性极有可能在家庭财务决策中发挥积极作用。因此，一些作家认为，爪哇农村地区女性地位的任何问题，往往是当地经济环境的结果，而非直接的歧视（Mangkuprawira,
    1981）。


    在接下来的章节中，将尝试估算中爪哇女性实际上对家庭决策拥有有多大的控制权，并注意不同因素如何影响家庭内部的决策动态。Vreede-de Stuers (1960:160)
    声称，“女性基于对男性保护依赖的旧态度……正在被一种自豪感取代，这种自豪源于现代女性……知道如何让自己对家庭有用的事。”这项研究的目标之一是确定高生育率的传统支柱是否被这种及其他社会变化因素，结合政府提高避孕使用率和降低总生育率的努力所取代。


    ## 注释


    1. 爪哇的数据与望杜拉的数据结合在一起。

    2. 农村失业率女性高于男性（分别为 11%和 7%）。

    3. 换句话说，女性对财务事务有很大的发言权，并可能被允许成为首席继承人。

    4. 伊斯兰法。

    5. 根据这种观点，现代化的影响并非人们通常预期的那样；即，现代化不仅未能改善女性的地位，反而产生了相反的影响。

    6. 这些习俗都严重偏向男性。

    7. 惯法（adat）下仍允许强制婚姻，但现在年轻夫妇私奔并在返回后与父母和解也是可以接受的。

    8. “这些优势”被认为是指与西方文明接触。

    9. 这一观点与 Mangkuprawira (1981) 的发现相矛盾，他认为在农村地区，大多数为女性提供的工作涉及非技术劳动岗位，教育的增加似乎并没有提高女性劳动力的参与率。相反，发现工资经济中就业女性的比例与完成的教育年限呈负相关。

    10. Nag 等人的研究比 Koentjaraningrat 的研究更近期，因此更可能反映印度尼西亚家庭的现状。


    # 第 4 章 样本、方法与变量定义


    本研究利用的数据获取于 1985 年对中爪哇农村家庭的一项调查。该调查是与印尼尼西亚的 `LEKNAS/LIPI` 联合进行的。资金由福特基金会资助布朗大学开展比较城市化研究。生活费用部分由美国国立卫生研究院（NIH）的一项实习津贴支付。


    ## 样本的选择


    '
- fmt: '

    The district within which the sample was drawn was selected because it is characterized
    by a system of predominantly wet rice agricultural production, and because it
    is not isolated geographically. Both of these qualities were necessary for the
    purposes of the other researchers involved in the survey, but the lack of geographical
    isolation was also important for this investigation.


    Villages with greater access to urban, centers were expected to experience higher
    rates of mobility to and from those centers (Shaw, 1975), and thus to have greater
    exposure to more "modern" values and attitudes, than were villages not having
    similar access. Such values and attitudes include those pertaining to the roles
    and statuses of women, contraception, family size preferences, and views about
    the extent to which marriages should be arranged.


    The district (`kabupaten`) selected on the basis of these criteria was `Sukoharjo`.
    (See [Figure 4.1]). Central Java is comprised of 29 such kabupaten, and `Sukoharjo`
    appeared to best address the needs of the project organizers. For the purposes
    of this research it was an appropriate choice given its proximity to the urban
    center, `Solo`. In order to meet the needs of the other researchers, the villages
    chosen had to be classified as rural and had to be primarily rice-growing locales.
    They were selected to minimize variation on the predominant type of agriculture,
    access to urban facilities, and thus mobility, but they were also supposed to
    enhance variability on the level of commercialization within the agricultural
    system.


    ![FIGURE 4.1: MAP OF JAVA SHOWING LOCATION OF PROVINCES AND KABUPATEN SUKOHARJO](Images/4.jpeg)


    Given these restrictions, 83 out of the 167 villages in `Kabupaten Sukoharjo`
    were found to be appropriate for the larger field project. Twenty-four were eliminated
    because they were classified as urban, while many of the villages in the southern
    and western sections of the kabupaten were eliminated because their mountainous
    terrain largely precluded wet rice (`sawah`) production. Given the constraints
    of the other researchers, the villages that were selected tended to cluster in
    the northern and central portions of the district. All of the potentially suitable
    villages were then ranked "according to a measure of agricultural commercialization
    and one village from each quartile of the ranking was randomly selected" (Guest,
    1987:56).


    The four villages eventually chosen are from three different subdistricts (or
    `kecamatan`) within `Sukoharjo` as a whole. (See [Figure 4.2], p. 66). Two of
    the villages, `Mandan` and `Kenep`, are contained within `Kecamatan Sukoharjo`.
    Both are located southwest of the district capital, which is also called `Sukoharjo`.
    `Mandan` is roughly two kilometers away from that center, and `Kenep` is about
    seven kilometers away. Although not in `Kecamatan Sukoharjo`, the third village,
    `Jombor`, is directly adjacent to the district capital. It lies just north of
    `Sukoharjo` and is contained within `Kecamatan Bendosari`. Finally, `Wonorejo`
    is in `Kecamatan Polokarto`, and is located roughly 13 kilometers northeast of
    the capital of `Sukoharjo`.


    ### Household Selection


    Once the villages were chosen, 160 households were selected within each one. Although
    the largest possible sample size was the goal, budgetary constraints eventually
    determined the target number of households.


    A household was defined as "a group of persons who eat and cook together, or [who]
    had done so within the last five years... [The] definition was based on previous
    research and is considered to define an economic unit in Javanese society" (Guest,
    1987: 84). Since the village with the fewest households had 696 (`Kenep`), while
    that with the most had 788 (`Mandan`), the number of households varied little
    between villages. As a consequence, it was not necessary to weight the sample.
    The target population included all households in the four villages.


    Village registers were used to select the households. These registers are made
    up of lists of all household members by age, sex, and religion. Less complete
    information is available on the primary occupations and educational attainment
    levels of household members, and on the consumer goods they own. The lists are
    utilized for Census enumerations, village statistical reports, and the issuance
    of identification cards, and so are generally assumed to be maintained with reasonable
    accuracy.


    ### TABLE 4.1: SELECTED VILLAGE CHARACTERISTICS


    | | Jombor | Kenep | Mandan | Wonorejo |

    | --- | --- | --- | --- | --- |

    | Total population | 3,824 | 3,165 | 4,028 | 3,631 |

    | Total land area (km2) | 2.36 | 2.82 | 3.18 | 2.26 |

    | Population density | 1,620 | 1,122 | 1,238 | 1,607 |

