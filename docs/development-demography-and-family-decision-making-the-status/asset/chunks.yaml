  raw: 'The interviewers recruited to conduct the survey were all university students
    from the Universitas Sebelas Maret in Solo, the urban center adjacent to the kabupaten
    (Sukoharjo) in which the survey was to take place. Twelve men and twelve women
    were hired in all. All had rural backgrounds and spoke Javanese. Two days were
    spent at the university for interviewer training, most of which involved going
    over the questionnaire. Upon completion of the training session, the interviewers
    moved to households in the villages selected by village officials.The interviewers
    operated in teams. One male and one female went to each of the sampled households.
    The information on the household schedule was obtained first. During that section
    of the interview it was often helpful to have several household members present
    to fill in gaps in the primary respondent''s answers. Given the focus of the this
    research, however, it was imperative that both male and female respondents answer
    frankly and freely. As a consequence, after the household schedule had been completed,
    interviewers were instructed to conduct interviews of individuals separately.
    The male interviewers were assigned to interview male household members, and the
    female interviewers were assigned to interview the women.[TABLE 4.2:](#Figures.xhtml_bck_cap_lbl0010)
    AGE-SEX DISTRIBUTION OF THE SAMPLE BY VILLAGE![Image](Images/5.jpeg)Considerable
    care was taken to interview husbands and wives both separately and simultaneously
    to avoid contamination of the results. In some cases, however, that was not possible
    given the work obligations of the respondents. In Mandan, for example, it was
    harvest time for many households, and family members took turns coming in from
    the fields to be interviewed. Although this system did not allow for simultaneous
    interviews, it did ensure that spouses would be interviewed separately. When it
    was not possible to conduct the interviews simultaneously, they were almost always
    completed within a few hours of one another, minimizing the amount of time in
    which discussion between the two spouses could have taken place between interviews.The
    separation of spouses was particularly important for questions involving the relative
    power of individuals in making major household decisions. Those questions are
    central to the analysis of the intergenerational dynamics involved in the marriage
    decision, as well as to the estimation of women''s intra-household status; both
    are among the most complex concepts to be analyzed in this research.


