    受聘调查的访谈员全部来自索罗（Solo）塞拉斯拉斯大学（Universitas Sebelas Maret）的学生，该市紧邻调查开展的县（苏科哈乔县，Sukoharjo）。总共聘佣了十二名男性和十二名女性。他们都具有农村背景并会说爪哇语。在大学花费了两天进行访谈员培训，大部分内容是审阅问卷。培训结束后，访谈员进入由村委会选定的村庄家庭。


    访谈员以小组形式开展。每组由一男一女进入每个被抽样的家庭。首先获取家庭调查表上的信息。在访谈的这一部分，通常让几位家庭成员在场填补主要受访者回答中的空白是很有帮助的。然而，考虑到本研究的重点，必须确保男女受访者都能坦诚、自由地回答。因此，在完成家庭调查表后，访谈员被指示分别进行个人访谈。男性访谈员被负责采访家庭中的男性成员，女性访谈员负责采访女性。


    TABLE 4.2:


    为了避免结果受污染，在采访夫妻时采取了分别和同时采访的方法，并非常谨慎。然而，在某些情况下，考虑到受访者的工作职责，这并无法实现。例如，在曼丹（Mandan），许多家庭正值收获季节，家庭成员轮流从田间回来接受采访。虽然这种制度不允许进行同时采访，但它确保了夫妻双方是分开采访的。当无法进行同时采访时，他们几乎总是在彼此的几小时内完成的，从而最大限度地缩短了夫妻双方在采访之间可能进行讨论的时间。


    对于涉及个人在家庭重大决策中相对权力的问题，夫妻的分开显得尤为重要。这些问题是分析婚姻决策中涉及的代际动态的核心，也是估计女性在家庭内部地位的基础；这两者都是本研究中分析的最复杂的概念之一。


    ## 变量定义与分析


    第一个因变量衡量的是受访者认为自己对与现配偶结婚的决策投入了多少主观。该变量分为一到五级，五表示受访者（在大多数情况下包括配偶）对婚姻决定有完全控制权，四表示决策主要由他们做出，尽管其他人有一些意见，三表示他们与其他人平等做出决策，二表示决策很大程度上由他人做出，但允许他们提供一些意见，一表示受访者对婚姻决策完全没有控制权。受访者被要求决定哪一类最符合他们对婚姻决策的记忆，但他们的答案应被视为落在相对权力连续谱的某一点。女性对该问题的中位数回答为
    4.0，分布的偏度极小（.049）。


    在夫妻双方并非对婚姻决策承担唯一责任的情况下，完全可能女性和男性被允许对决策投入不同程度的意见，即在过程中他们并不是作为平等的伙伴或整体在行动的。尽管该变量旨在衡量父母及其他家庭成员对婚姻决定的控制程度，但它具有局限性，因为它未能显式捕捉到新娘和新郎本人所享有的不同投入水平。然而，正如第
    5 章所示所示，他们对权力的感知差异仍然可以进行分析。


    引入每组用于估计该因变量的方程的自变量大部分是简单直接的。婚姻顺序（Union order）是一个简单的二分变量，零表示受访者在调查时处于第一次婚姻，一表示较高阶的婚姻。衡量受访者父亲受教育程度的变量分为一到五级，一表示未受过正式教育，五表示至少完成了某些大学水平的教育。这些值随后乘以三，以近似父亲在每个教育水平所接受的平均教育年限，并使生成的系数与衡量受访者本人受教育水平的系数更具兼容性。受访者的受教育程度通过他们完成的正式教育总年数来衡量。


    与决策因变量一样，这些自变量的类别仅按顺序描述，以便读者理解数据的组织结构。教育变量的划分（构成决策变量以及本讨论中提出的许多其他变量的划分）应被视为连续体的一部分，而不是离散的组。


    衡量婚前居住情况的变量分为四类。四表示居住在雅加达，三表示住在其他大都市（人口百万以上），二代表居住在另一个大城市地区（人口 250,000 至 999,999
    人的城市），一表示居住在较小的城市或农村地区。如果能有关于小城市与农村地区的独立信息会更好，事实上，问卷的设计也允许这种区分。遗憾的是，在编码过程中，数据被合并到了上述列出的分组中。


    年龄（针对当前婚姻）以年为单位，被作为几个方程中的控制变量纳入，因为年轻的新郎（尤其是年轻的新娘）被认为比成熟的成年人更易受影响（Caldwell et al.,
    1983）。研究还发现，结婚年龄随着教育水平的提高、现代化和城市化而增加（Smith, 1980; Smith and Karim, 1980）。婚姻持续时间被作为婚姻队列的指标纳入。在家庭变化的研究中，时间元素被高度强调，纳入婚姻持续变量对于衡量其影响是合适的。该变量的构建同样简单；它衡量的是受访者与现配偶结婚的年数。


    ### 女性地位的测量


