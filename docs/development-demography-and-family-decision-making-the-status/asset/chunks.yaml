    向小型核心家庭的转变以及女性新角色的出现，是经济发展和社会现代化伴随的显著变化之一。随着大家庭权力的衰落，他人对女性地位、角色及其决策的控制也随之减弱。累积的比较研究和历史证据表明，随着教育水平的提高和个人向不断扩张的新型经济机会的流动性增强，家庭规模在缩小，个人对婚姻决策的责任增加，反之，女性在婚姻内和婚姻外的角色也随之变化。性别角色的改变并不意味着女性相对于男性的地位得到了“改善”；男女之间向更趋“平等”的转变绝不是统一的。尽管社会层面的经济机会在增加，女性的受教育程度和职业成就有所增长，且传统的地位和权威来源正在发生转变，但女性在家庭内部的地位以及与丈夫的关系，并不总是会提高。


    在发展过程中，大家庭减少对女性生活的控制，而女性自主性的变化变得至关重要，这引发了人们对发展中国家这些过程之间联系的关注。社会中女性角色的变化与女性参与婚姻选择的程度之间是什么关系？迁移的人口统计过程如何影响女性的自主性？自主性如何影响生育行为和避孕药的使用？本本书系统且详细地探讨了这些核心问题。


    人们越来越意识到，家庭和住户结构的变化作为研究生育和迁移人口变迁决定因素及其结果的背景具有重要意义。此外，越来越多的观点认为，提高女性地位是促进发展中国家降低高生育率的重要政策方向。事实证明，对发展中国家农村迁移的研究需要考察女性的角色，而不仅仅是女性迁移是否多于男性，而是要研究迁移如何影响女性的地位，以及迁移对自主性和决策权产生了什么后果。


    ### 琳达·威廉姆斯博士的研究


    琳达·威廉姆斯博士对一个发展中国家的这些问题进行了创新性研究。她对中爪哇农村地区进行了清晰且引人注目的分析，追踪了迁移、生育和婚姻三个关键过程之间复杂的相互作用。她展示了印度尼西亚女性对家庭经济的贡献、女性在劳动力中的活动，以及女性对家庭决策的控制。她的研究关注涉及婚姻决策的代际动态，以及影响女性婚后控制家庭决策能力的社会人口统计过程（特别是迁移）。她调查了大家庭的作用以及代代代际之间保持的接触频率；并直接测试了女性自主性对避孕药使用和生育的影响。这项关于特定背景下婚姻、女性自主性、迁移和生育之间联系的研究，对发展中国家的人口以及理解发展问题（特别是女性和家庭角色的变化）做出了重要贡献。


    她的研究将这些主题置于人口与发展关系以及相关这两个政策的背景之下。此外，她将发展过程中的女性研究作为一个整体主题包含其中。她的框架关注女性在做出重大家庭决策时，相对于其他住户或家庭成员的表现如何。她仔细概述了相关论点，证明发展过程可能会提高或削弱女性的地位。她特别关注了迁移维度。她有力地反驳了那种认为女性迁移是微不足道且仅具关联性的观点，特别是通过展示迁移如何与女性地位相关联。


    威廉姆斯博士在印度尼西亚中爪哇省的特定背景下探讨了这些问题。正如对一般人口统计过程的考察一样，像印度尼西亚这样的过渡国家，可以为整个社区以及家庭内部女性地位的变化提供最丰富的见解。研究人员对中爪哇农村地区四个村庄的
    500 多个家庭成员进行了访谈，重点关注女性及其丈夫。这些原始收集的数据是一个丰富且独特的信息源，深入探讨了家庭决策、女性地位、迁移、生育和避孕药使用等深度问题。


    ### 主要发现


    通过对这些数据的详细分析，得出了几个主要发现：


    *   与婚姻相关的决策权的一些主要预测因子正如预期那样——父母的教育程度、受教育年限（特别是女性）以及对大城市生活的接触。从年龄和婚姻时长数据中推断出，证据表明，随着时间的推移，中爪哇农村地区女性的决策权显著增加。

    *   婚后的居住地流动提高了妻子在家庭中的地位，这表明女性通过居住地流动获得了丈夫的影响力。然而，搬到村庄边界以外会削弱女性与其社会网络的联系，导致她们的决策权受损。因此，在自主性与影响女性在家庭内地位和权力的网络之间存在着平衡。婚姻期间或婚后的迁移，以及与双方父母保持的接触量，影响了女性对家庭决策的控制程度。对婚姻决策的投入越多，她们在后期家庭决策中行使的控制也越多。

    *   与预期相反，在家庭中地位较高的女性较少使用过任何形式的避孕。威廉姆斯博士认为，这一发现可能反映了对印度尼西亚有时强制性的家庭计划计划的反应——地位较高的女性可能更好地抵御外部压力。因此，在某些条件下，自主性可能导致女性对创新的生育控制形式具有更高的接受度；而在另一些条件下，女性角色自主性的增加可能导致她们拒绝机构鼓励使用避孕药和控制生育的压力。


    分析提出了重要的政策问题，特别是女性对家庭计划计划的负面反应以及对家庭干预的普遍规范性氛围的反应。这些发现挑战了发展中国家一些公认的计划。研究结果强化了研究家庭背景以及女性在避孕模式和生育方面自主性的重要性。它们也了将迁移和生育分析联系女性问题的价值。


    ### 方法论与背景


    这些及其他详细发现由威廉姆斯博士利用她设计的调查和收集的数据进行了仔细记录。这些数据是 1985 年对中爪哇农村家庭进行调查的一部分，该调查部分由福特基金会助布鲁大学的人口研究培训中心。该调查与另一位研究这些相同地区劳动力分配问题的研究人员的野外考察相结合。该研究项目的结果已在我们系列的早期一书中报告——菲利普·盖斯特，《劳动力分配与农村发展：四个爪哇村庄的迁移》（Westview
    Press, 1989）。威廉姆斯博士在其 1987 年布鲁林大学社会学博士论文的一部分展示了这些数据的分析。她的博士论文委员会成员包括弗朗西斯·科布林·戈德斯基德（主席）、阿尔登·斯皮尔（二世）和西德尼·戈德斯坦。这本专著是在布鲁林大学高级人口学家委员会和一位领域外专家评审后，对其论文进行的修订。


    总之，威廉姆斯博士为我们与发展中国家人口和发展相关的一些基本问题提供了一系列精心设计的测试。她的发现可能不仅限于中爪哇农村地区，而是适用于发展中第三世界的大部分地区。政策制定者、规划者以及人口学家和发展专家，都能从仔细考虑其分析的启示中受益。威廉姆斯博士的研究再次提醒我们家庭和女性在人口过程和发展中的重要性。


    卡尔文·戈德斯基德


