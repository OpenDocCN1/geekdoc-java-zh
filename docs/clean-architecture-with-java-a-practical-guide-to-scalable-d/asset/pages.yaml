  md: "When writing integration tests for adapters, it's important to focus on the\
    \ adapter's interface rather than its implementation details. This approach allows\
    \ for greater flexibility in changing the underlying implementation without breaking\
    \ the tests. For example, consider a repository adapter that interfaces with a\
    \ database:\n\n```\npublic interface UserRepository {\n  User findById(String\
    \ userId);\n  void save(User user);\n}\n```\n\n```\npublic class UserRepositoryImpl\
    \ implements UserRepository {\n  private final JdbcTemplate jdbcTemplate;\n\n\
    \  public UserRepositoryImpl(JdbcTemplate jdbcTemplate) {\n    this.jdbcTemplate\
    \ = jdbcTemplate;\n  }\n\n  @Override\n  public User findById(String userId) {\n\
    \    return jdbcTemplate.queryForObject(\n      \"SELECT * FROM users WHERE id\
    \ = ?\",\n      new Object[]{userId},\n      (rs, rowNum) -> {\n        User user\
    \ = new User();\n        user.setId(rs.getString(\"id\"));\n        user.setName(rs.getString(\"\
    name\"));\n        user.setEmail(rs.getString(\"email\"));\n        return user;\n\
    \      });\n  }\n\n  @Override\n  public void save(User user) {\n    jdbcTemplate.update(\n\
    \      \"INSERT INTO users (id, name, email) VALUES (?, ?, ?) ON DUPLICATE KEY\
    \ UPDATE name = ?, email = ?\",\n      user.getId(), user.getName(), user.getEmail(),\
    \ user.getName(), user.getEmail());\n```"
