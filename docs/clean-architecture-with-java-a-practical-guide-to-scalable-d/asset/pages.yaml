    This configuration allows us to easily change the implementation of UserRepository
    without affecting the UserService or any other part of the application that depends
    on UserRepository.


    By adhering to these core concepts of clean architecture - dependency inversion,
    layers, and separation of concerns we create systems that are more modular, testable,
    and maintainable. Each part of the system has a clear responsibility and well-defined
    boundaries, making it easier to understand, modify, and extend the application
    over time.


