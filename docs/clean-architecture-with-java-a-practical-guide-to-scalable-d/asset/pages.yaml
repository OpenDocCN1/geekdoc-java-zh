  md: "The primary goal of OCP is to create systems that are resilient to change and\
    \ can evolve over time without introducing instability or requiring extensive\
    \ modifications to existing, tested code. By adhering to this principle, developers\
    \ can create more maintainable, scalable, and robust software architectures.\n\
    \nTo understand OCP in practice, let us consider a simple example of a shape drawing\
    \ system. Initially, we might have a class that calculates the area of different\
    \ shapes:\n\n```\npublic class AreaCalculator {\n    public double calculateArea(Object\
    \ shape) {\n        if (shape instanceof Rectangle) {\n            Rectangle rectangle\
    \ = (Rectangle) shape;\n            return rectangle.getWidth() * getHeight();\n\
    \        } else if (shape instanceof Circle) {\n            Circle circle = (Circle)shape;\n\
    \            return Math.PI * circle.getRadius() * circle.getRadius();\n     \
    \   }\n        return 0;\n    }\n}\n```\n\nThis implementation violates the Open/Closed\
    \ Principle because adding a new shape (e.g., a Triangle) would require modifying\
    \ the existing AreaCalculator class. Instead, we can refactor this design to adhere\
