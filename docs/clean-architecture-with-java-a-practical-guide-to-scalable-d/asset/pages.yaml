- img_proc: true
  md: "facilitate the flow of data and control between different parts of the system\
    \ while maintaining the independence of the core business logic. This section\
    \ will explore the concept of interface adapters, their implementation in Java,\
    \ and best practices for their effective use in Clean Architecture.\n\nIn Clean\
    \ Architecture, interface adapters occupy the third layer, sitting between the\
    \ use cases and the external world. Their primary responsibility is to convert\
    \ data between the format most convenient for entities and use cases and the format\
    \ required by external agencies such as databases, web services, or user interfaces.\
    \ This conversion ensures that the inner layers remain isolated from the specifics\
    \ of external technologies and frameworks.\n\nThere are typically two types of\
    \ adapters in Clean Architecture: input adapters and output adapters. Input adapters\
    \ handle incoming requests from external sources, while output adapters manage\
    \ outgoing data and interactions with external systems.\n\nLet's starting by examining\
    \ an example of an input adapter, specifically a controller in a web application:\n\
    \n```\npublic class CustomerController {\n    private final CreateCustomerUseCase\
    \ createCustomerUseCase;\n\n    public CustomerController(CreateCustomerUseCase\
    \ createCustomerUseCase) {\n        this.createCustomerUseCase = createCustomerUseCase;\n\
    \    }\n\n    public ResponseEntity<CustomerResponse> createCustomer(CustomerRequest\
    \ request) {\n        try {\n            CreateCustomerCommand command = mapToCommand(request);\n\
    \            Customer customer = createCustomerUseCase.execute(command);\n   \
    \         return ResponseEntity.ok(mapToResponse(customer));\n        } catch\
    \ (BusinessException e) {\n            return ResponseEntity.badRequest(new CustomerResponse(e.getMessage()));\n\
    \        }\n    }\n\n    private CreateCustomerCommand mapToCommand(CustomerRequest\
    \ request) {\n        return new CreateCustomerCommand(\n            request.getName(),\n\
    \            request.getEmail());\n    }\n}\n```"
