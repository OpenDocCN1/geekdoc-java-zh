    \nPoor abstraction is another common pitfall. Abstraction is the process of hiding\
    \ implementation details behind simpler interfaces. When done poorly, it leads\
    \ to leaky abstractions that expose unnecessary details or overly complex interfaces\
    \ that are difficult to use. For instance:\n\n```\npublic interface UserService\
