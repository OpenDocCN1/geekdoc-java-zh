    design that promotes the creation of fine-grained, specific interfaces rather
    than large, monolithic ones. This principle suggests that clients should not be
    forced to depend on interfaces they do not use. In other words, it''s better to
    have many smaller, focused interfaces than a few large, all-encompassing ones.
    The ISP is particularly relevant in Java, where interfaces play a crucial role
    in achieving abstraction and polymorphism.


