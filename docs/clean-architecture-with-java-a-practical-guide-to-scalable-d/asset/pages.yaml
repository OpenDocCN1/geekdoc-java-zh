    # Liskov Substitution Principle (LSP)


    The Liskov Substitution Principle (LSP) is a cornerstone of object-oriented design
    and a crucial component of the SOLID principles. Named after Barbara Liskov, this
    principle states that objects of a superclass should be replaceable with objects
    of its subclasses without affecting the correctness of the program. In essence,
    LSP ensures that inheritance hierarchies are designed in a way that promotes code
    readability and maintains the expected behavior of the system.


    The principle can be formally stated as follows: If S is a subtype of T, objects
