    can only be confirmed when it''s in the CREATED state, enforcing a business rule
    directly within the domain model.


    When applying DDD in a Clean Architecture context, it''s important to consider
    how different DDD concepts map to the architecture layers:


    +   1. Entities Layer: This is where the core domain model resides, including
    entities, value objects, and aggregates.

    2. Use Cases Layer: Domain services and application services typically reside
    here, orchestrating interactions between entities and enforcing higher-level business
    rules.

    3. Interface Adapters Layer: Repositories are often implemented here, providing
    a bridge between the domain model and the persistence mechanism.

    4. Frameworks and Drivers Layer: This is where the actual database or other external
    systems would be integrated.


    One of the challenges in applying DDD is managing the complexity of large domain
    models. This is where concepts like bounded contexts become crucial. Each bounded
    context can have its own domain model, tailored to the specific needs of that
    context. These contexts can then be integrated using various patterns such as
    shared kernels, customer-supplier relationships, or anti-corruption layers.'
