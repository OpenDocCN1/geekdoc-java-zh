  md: "data sources or storage mechanisms without affecting the rest of the\napplication.\n\
    \nConsider a simple example of a UserRepository interface:\n\n```\npublic interface\
    \ UserRepository {\n    User findById(Long id);\n    List<User> findAll();\n \
    \   void save(User user);\n    void delete(User user);\n}\n```\n\nThis interface\
    \ defines basic CRUD (Create, Read, Update, Delete)\noperations for a User entity.\
    \ The implementation of this interface would\ncontain the actual logic for interacting\
    \ with the data source:\n\n```\npublic class JpaUserRepository implements UserRepository\
    \ {\n    private EntityManager entityManager;\n\n    public JpaUserRepository(EntityManager\
    \ entityManager) {\n        this.entityManager = entityManager;\n    }\n}\n\n\
    ```\n\n```\n@Override\npublic User findById(Long id) {\n    return entityManager.find(User.class,\
    \ id);\n}\n```\n\n```\n@Override\npublic List<User> findAll() {\n    return entityManager.createQuery(\"\
    SELECT u FROM User u\", User.class).getResultList();\n}\n```\n\n```\n@Override\n\
    public void save(User user) {\n    entityManager.persist(user);\n}\n```\n\n```\n\
    @Override\npublic void delete(User user) {\n    entityManager.remove(user);\n\
    }\n```"
