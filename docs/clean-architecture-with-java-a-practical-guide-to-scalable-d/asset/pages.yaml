    # Frameworks and Tools


    # Why Frameworks Should Be on the Outer Layer


    Clean Architecture emphasizes the separation of concerns and the independence
    of core business logic from external frameworks and tools. This approach offers
    significant advantages in terms of maintainability, testability, and flexibility.
    A key principle of Clean Architecture is that frameworks should reside on the
    outer layer of the application, effectively decoupling them from the core business
    logic.


    Frameworks are powerful tools that provide pre-built functionality and structure
    to applications. However, they can also introduce dependencies and constraints
    that may limit the flexibility and longevity of a system. By positioning frameworks
    on the outer layer, we create a clear boundary between our application’s core
    functionality and the tools we use to implement it.


    This separation allows the core business logic to remain independent of any specific
    framework or library. The core domain and use cases are implemented using pure
    Java, without any dependencies on external libraries or frameworks. This approach
    offers several benefits:


    Flexibility in Framework Choice: By keeping frameworks on the outer layer, we
    can easily swap out one framework for another without affecting the core business
    logic. This flexibility is particularly valuable as technology evolves and new
    frameworks emerge. For example, if we initially build our application using Spring
    Framework and later decide to switch to a microservices architecture using Quarkus,
    we can do so with minimal impact on our core business logic.'
