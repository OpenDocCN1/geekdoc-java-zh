  md: '+   1. Dependency Injection: This is used extensively to provide implementations
    of interfaces to the inner layers. For instance, the UserRepository implementation
    is injected into the GetUserInfoUseCase .


    +   2. Data Transfer Objects (DTOs): These are used to transfer data between layers
    without exposing the internal structure of objects. DTOs help in decoupling the
    layers and preventing the leakage of implementation details.


    +   3. Mappers: These are used to convert between entity objects and DTOs, ensuring
    that the internal structure of entities is not exposed to outer layers.


    +   4. Interfaces (Ports): As mentioned earlier, interfaces defined in inner layers
    and implemented in outer layers allow for communication without creating dependencies
    on specific implementations.


    +   5. Events: In more complex systems, event-driven architecture can be used
    to further decouple layers. Inner layers can emit events that outer layers listen
    for and react to, without creating direct dependencies.


    It’s important to note that while Clean Architecture prescribes a certain direction
    for dependencies, in practice, there might be situations where strict adherence
    to these rules becomes impractical. In such cases, pragmatic decisions should
    be made, always keeping in mind the overall goals of maintainability and testability.


    For instance, when dealing with complex logic that requires database-specific
    operations, you might need to introduce a specialized repository interface in
    the Use Cases layer that includes these operations. While this creates a small
    dependency on database concepts, it might be necessary for performance or functionality
    reasons.


