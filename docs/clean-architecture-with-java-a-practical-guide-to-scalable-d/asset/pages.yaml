    This interface uses domain types like Payment and Money, which are defined within
    your application''s core business logic. The methods represent the actions you
    need to perform, without any reference to how these actions are implemented.


    Next, create an adapter class that implements this interface and handles the actual
    communication with the third-party API. This adapter should be placed in the interface
    adapters layer of your Clean Architecture. It''s responsible for translating between
    your domain objects and the data'
