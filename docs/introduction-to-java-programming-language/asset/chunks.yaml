  trans: "\n\n当从同一个对象上调用的方法访问该对象的字段或方法时，可以省略对象的名称或用 `this` 关键字替换。`this` 关键字还用于从另一个\
    \ `constructor` 中调用 `constructor` `class`（参见下文示例）。在后者的情况下，此类调用必须是 `constructor`\
    \ 中的第一条语句。\n\n### 示例\n作为一个示例，考虑 `Box` 类（\"box\"），它存储某些箱子的尺寸（三个整数）。`Box` 类拥有具有不同参数的重载构造函数，以及一个计算箱子体积的\
    \ `volume()` 方法。`SimpleBoxDemo` 类演示了 `box` 类的创建和使用。\n\n为了简化示例，没有使用访问控制（参见 3.10）。在实践中，任何程序员都不应该使用这种方法！\n\
    \n```java\n/** Class \"Box\" */\nclass Box\n{\n    /** 尺寸绘制器 */\n    int width,\
    \ height, depth;\n    /** 默认构造函数 */\n    Box() { width = height = depth = 0; }\n\
    \n    /** 基本构造函数 */\n    Box(int width, int height, int depth)\n    {\n      \
    \  this.width = width; this.height = height; this.depth = depth;\n    }\n\n  \
    \  /** 用于立方体的构造函数 */\n    Box(int size)\n    {\n        this (size, size, size);\
    \ // width = height = depth = size;\n    }\n\n    /** 计算体积的方法 */\n    int volume()\
    \ { return width * height * depth; }\n}\n\npublic class SimpleBoxDemo\n{\n   \
    \ static void main(String args[])\n    {\n        Box b1 = new Box(5), b2 = new\
    \ Box(5, 10, 20); b1.width = 10;\n        System.out.println(b1.volume() + \"\\\
    n\" + b2.volume());\n    }\n}\n```\n\n### 对象的移除\n在 Java 中，对象的移除操作不是手动的。在这里，自动垃圾回收机制取代了手动组装。为了确保该机制的工作，`JVM`（Java\
    \ 虚拟机）会跟踪每个被创建对象的引用数量，一旦某个对象不再剩余引用，它就会成为移除候选对象。对象的移除是定期进行的，并且只有在需要释放的内存变得本质时才会进行。\n\
    \n自动垃圾回收允许规避大部分与内存泄漏相关的问题。遗憾的是，在某些情况下，Java 中仍然会出现此类问题。可以在书中找到示例。\n\nJava 不提供析构函数。由于内存管理由\
    \ `JVM` 实现，因此对它们的需求并不常见。如果仍然需要，你应该定义自己的方法并显式地调用它们。这里的例子是内联类中的 `close()` 方法，用于执行\
    \ I/O 的关闭流程（参见第 7.1 页）。\n\n### 静态字段和方法\n静态字段和现有方法存在于每个类的实例，也就是说它们被该类的所有拷贝共享。声明静态字段和方法使用特殊的标识符\
    \ `static`：\n\n```java\nstatic int static_field = ten;\n```\n\n静态字段在类加载时初始化，可以是声明中指定的值（参见章节\
    \ 3.5 的示例），也可以在特殊的 `static` 块中初始化。静态方法无法（在不显式指定对象的情况下）访问类的非静态字段和非静态方法。\n\n调用静态字段和方法可以在没有类实例的情况下进行。在这种情况下，通常使用类名而不是实例名。例如：\n\
    \n```java\ndouble x = Math.sqrt(2.0);\n```\n\n作为所有 Java 程序入口的 `main()` 方法必须声明为\
    \ `static`（参见第 3.5 页的示例）。\n\n带有参数和特殊特性的方法使用对象链接。对象引用的行为类似于 C 中的指针，因此将一个对象引用赋值给另一个不会导致对象的拷贝。要执行对象的拷贝，类通常会实现一个拷贝构造函数以及可能可能的\
    \ `clone()` 方法。\n\n基本类型通过值传递给方法。这同样适用于对象引用，因此对象本身是通过引用传递的（类似于在 C 中拷贝指针）。\n\n让我们考虑使用对象引用时的一个典型错误。假设类\
    \ `point` 的实现如下：\n\n```java\nclass point\n{\n    public double x, y;\n    public\
    \ point(double x, double y) {\n        this.x = x;\n        this.y = y;\n    }\n\
    }\n```\n\n假设我们想要交换两个 `point` 对象：\n\n```java\nvoid swap(point p1, point p2) {\n\
    \    point temp = p1;\n    p1 = p2;\n    p2 = temp;\n}\n```\n\n如果使用以下代码：\n\n```java\n\
    void swap(point p1, point p2)\n{\n    p1.x = p2.x;\n    p1.y = p2.y;\n}\n```\n\
    这是错误的，因为它只交换了内容，而不是对象本身。要交换对象，我们应该使用：\n\n```java\nvoid swap(point p1, point p2)\n\
    {\n    double tempX = p1.x;\n    double tempY = p1.y;\n    p1.x = p2.x;\n    p1.y\
    \ = p2.y;\n    p2.x = tempX;\n    p2.y = tempY;\n}\n```\n\n等待，如果我们想在调用方法中交换引用：\n\
    \n```java\nvoid swap(point p1, point p2)\n{\n    point temp = p1;\n    p1 = p2;\n\
    \    p2 = temp;\n}\n```\n这不起作用，因为变量 `p1` 和 `p2` 是方法的局部变量。为了解决这个问题，我们可以将 point\
    \ 封装在一个类中：\n\n```java\nclass Wrapper {\n    point p;\n    Wrapper(point p) { this.p\
    \ = p; }\n}\n\nvoid swap(Wrapper w1, Wrapper w2) {\n    point temp = w1.p;\n \
    \   w1.p = w2.p;\n    w2.p = temp;\n}\n```\n\n最后，如果我们想交换 `point` 对象的内容：\n\n```java\n\
    void swap(point p1, point p2)\n{\n    double tempX = p1.x;\n    double tempY =\
    \ p1.y;\n    p1.x = p2.x;\n    p1.y = p2.y;\n    p2.x = tempX;\n    p2.y = tempY;\n\
    }\n```\n\n### 包与翻译类模块的结构\n包是 Java 程序中类型（类和接口）的分组手段。每个包可以包含一个或多个类以及其他包。通过包划分类可以解决命名冲突问题，并实现更高效的访问控制。引用包元素时使用完整路径，该路径由由点分隔的子包组成（例如\
    \ `java.util`）。\n\n```java\npackage mypackage.mysubpackage;\n```\n\n如果缺少 `package`语句，类将属于一个没有的默认包，该包没有子包且对其他包可见。\n\
    \n翻译模块可以包含一个或多个 `import` 语句，允许在引用类时省略包名。例如，如果模块中存在行：\n\n```java\nimport java.util.*;\n\
    ```\n\n那么 `java.util` 包中的所有类（但不是其子包中的类！）都可以通过短名称访问。当导入单个类时，例如：\n\n```java\nimport\
    \ java.util.HashSet;\n```\n\n翻译模块必须包含 `main` 类（或接口）模块的源码。该类的名称应与翻译模块的文件匹配。该类是唯一可以声明为\
    \ `public` 的翻译模块类。该模块还可以包含一个或多个辅助类。\n\n"
- fmt: "\nSearch files, containing bytecode classes carried out in subdirectories\
    \ corresponding to the location of the classes in the hierarchy packages, inside\
    \ directories, listed in variable environment `CLASSPATH`.\n\nFor example, for\
    \ Togo to JVM found bytecode class `java.util.HashSet`, it must be in a file named\
    \ `HashSet.class` in a subdirectory `java/util` of any catalog variable environment\
    \ `CLASSPATH`. As a rule, it includes the current directory, as well as the directory\
    \ containing standard Java libraries. Source files are also located in the file\
    \ system in accordance with the hierarchy packages.\n\n### Access Control and\
    \ Encapsulation\n\nAccess control is used in order, on the one hand, to prevent\
    \ unauthorized change of data contained in the objects, as a result of misuse\
    \ or malicious use, and on the other hand to separate the class interface from\
    \ its implementation (hiding implementation). The programmer using the class sees\
    \ only its interface (fields and methods with public access) and may not know\
    \ anything about the internal structure of the class. The latter allows you to\
    \ change the real implementation of a class is transparent to the programmer.\
    \ For example, you can replace the implementation of a more efficient, completely\
    \ restructuring the internal class device, and the program code using the class,\
    \ will work without changes with new version.\n\nPlacing fields and methods inside\
    \ classes along with hiding implementation is called encapsulation. Encapsulation\
    \ is a characteristic trait of object-oriented programming.\n\nAccess control\
    \ is carried out by setting certain access specifier in the description of classes,\
    \ fields and methods. At Java exists two specifier access for classes and four\
    \ - for fields and methods. All of them, together with scopes, correspond to existing\
    \ elements programs listed in tab [3.1](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX), [3.2](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).\
    \ Levels of access are designated their specifiers. Besides level access \"default\"\
    , which does not have any special specifier matches.\n\nHere are some guidelines\
    \ for using control access in Java programs.\n\nThe main thing rule management\
    \ access: at designing for all elements of the program should be set to the most\
    \ limited level access vein that allows these elements to function correctly.\
    \ The less classes know about each other, the more likely they are to have be\
    \ used again.\n\nClass fields use `private` access. To read and change their values\
    \ from the outside, special methods are used (setters and getters), having specifier\
    \ access `public`. For example:\n\n```java\nclass MyClass\n{\n    private int\
    \ value;\n    public void setValue(int value) { this.value = value; }\n    public\
    \ int getValue() { return value; }\n}\n```\n\nThis approach is quite flexible.\
    \ For example, you can always make a certain field a read-only field by deleting\
    \ or simply not re-by aliasing the appropriate setter, or by limiting the possible\
    \ values for fields, inserting relevant check.\n\nMethods of class, having specifier\
    \ access `public`, form interface to data this class. Only through these methods\
    \ external classes will be able to access the data encapsulated by the class,\
    \ and only they determine possible ways of processing these data.\n\nIn the presence\
    \ of inheritance (see clause [4.1](#part0007.xhtml__bookmark34)), access specifiers\
    \ of element `private` and \"default\" are often replaced by a specifier `protected`\
    \ to allow class descendants to access the corresponding class elements. It is\
    \ also possible to use access by default, if the entire descendant hierarchy is\
    \ in the same folder, what and inherited Class.\n\nDefault access can be used\
    \ to create friendly private classes that can access private fields and local\
    \ to each other. Such friend classes are placed in one package. Access control\
    \ capabilities in this case are more flexible than in case of friend classes in\
    \ C++. However, to abuse this possibility is not recommended, since friend classes\
    \ are said to be more strongly related to each other than ordinary ones, so changes\
    \ in one class may require major changes in others.\n\nExample. Consider as an\
    \ example the class \"stack of integers\" with next implementation:\n\n```java\n\
    /** Class \"stack whole numbers\" */\npublic class IntStack\n{\n    private final\
    \ int MAXLEN = 64;  // maximum the size stack\n    private int s[], size;\n\n\
    \    /** Constructor on default */\n    public IntStack()\n    {\n        size\
    \ = 0;\n        s = new int [MAXLEN];\n    };\n\n    /** Constructor copies *\
    \ */\n    public IntStack (IntStack stack)\n    {\n        size = stack.size;\n\
    \        s = new int [MAXLEN]; \n        for ( int i = 0; i < size; ++i)\n   \
    \         s[i] = stack.s[i];\n    }\n\n    /** Receipt size stack */\n    public\
    \ int getSize() { return size; }\n    /** Recording element in stack */\n    public\
    \ void push( int e) { s[size++] = e; }\n    /** Receipt element from stack */\n\
    \    public int pop() { return s[--size]; }\n    /** Examination stack on the\
    \ emptiness */\n    public boolean isEmpty() { return size == 0; }\n}\n```\n\n\
    The state of the stack is determined by its current actual size `size` and the\
    \ content stored in the `s` array. For the field `size` is defined `getSize()`\
    \ method to get the current stack size. There is no means of accessing the array\
    \ `s`. Appeal to him can be available only through the methods `push()`, `pop()`,\
    \ `isEmpty()`, which in combination with the `getSize()` method and two class\
    \ constructors define an interface to stack data. Note that, in order to use a\
    \ class, you only need to have the signatures of these methods and description\
    \ of what operations they carry out. Internal details implementations in this\
    \ approach are hidden and can be easily changed. For example, you can replace\
    \ the array `s` with a doubly linked list, and this will not be reflected on the\
    \ classes using `IntStack`.\n\nComparison objects. Standard operation `==` compares\
    \ object references. However, as a rule, it is required comparison objects not\
    \ on links, a on content. For this intended method `boolean equals(Object obj)`\
    \ defined in `Object` class (see section [4.1](#part0007.xhtml__bookmark34)) and\
    \ therefore contained in all classes. Programmer must redefine this method so,\
    \ to carry out comparison in the required way. For example, for the class `Coords`\
    \ (\"point of the plane\"), containing two integer coordinates `x` and `y`, corresponding\
    \ method can implement next:\n\n```java\npublic boolean equals(Object obj)\n{\n\
    \    if(!(obj instanceof Point))\n        return false;  Point c = (Point)obj;\n\
    \    return x == c.x && y == c.y; own}\n```\n\nIf a in program are used standard\
    \ container classes (see [section 8.1](#part0015.xhtml__bookmark66)), it is usually\
    \ necessary to override not only the `equals()` method, then also method `int\
    \ hashCode()` which returns hash code object. Hash code object — this is a number\
    \ that is calculated based on the state of the object (contain fields). Equal\
    \ objects (t.e. objects, for which method `equals()` returns true) must match\
    \ the same hash code. For unequal objects, hash codes need not be unequal. Neym,\
    \ however, this should be strived for. In addition, one should take into account\
    \ that the more uniform is the distribution of hash codes objects, the better\
    \ will be the performance of built-in collections, them using (sets and associative\
    \ arrays).\n\nFor reviewed above class can define method `hashCode()` next:\n\n\
    ```java\nint hashCode()\n{\n    return x + y;\n}\n```\n"
