    \n# 2. 操作与运算符\n\n操作的一般特征。大多数 Java 操作与 C++ 操作相似，尽管它们中的某些功能略有不同。由于 Java 中没有指针，这是很自然的。没有用于获取地址\
    \ (`&`）、解引用 (`*`）和间接寻址 (`->`）的操作。Java 中的 `.`（点）运算符用于通过对象引用访问对象的字段和方法（详细信息参见第 3.3\
    \ 节）。\n\n接下来的段落描述了基本的 Java 操作。优先级操作在表 2.1 中。\n\n算术操作。算术操作包括以下这些操作：保持和改变符号的一元操作\
    \ (`+` 和 `-`)；一元递、减运算符 (`++` 和 `--`)；加、减、乘、除和取余的二元运算操作 (`+`, `-`, `*`, `/`, `%`)，以及带赋值的操作\
    \ (`+=`, `-=`, `*=`, `/=`, `%=`)。\n\n算术操作适用于数值类型，结果也是数值类型。整数类型的除法操作给出整数类型的结果（整数商），对于实数则如此。\n\
    \n如果在执行整数算术操作时发生溢出，则一个或多个高位结果可能会被截断（同时，由于最高位负责数字符号，可能会改变符号），且不会生成错误消息。整数算术中唯一导致错误的操作是除以\
    \ 0。\n\n比较操作。比较操作包括 `==`, `!=`, `<`, `>`, `<=`, `>=`。它们与相应的 C++ 操作的唯一区别是它们的结果始终是\
    \ `boolean`。\n\n逻辑操作。逻辑操作适用于布尔参数并产生布尔结果。包括：一元操作“非” (`!`)，二元“与” (`&&`, `&`)，“或”\
    \ (`||`, `|`) 和“异或” (`^`)，以及类似于赋值的操作 (`&=`, `|=`, `^=`。\n\n`&&` 和 `||` 只在情况下计算第二个参数的值。相反，`&`\
    \ 和 `|` 总是计算两个参数。例如：\n\n```java\nint x = 10, y = 10;\nif(x == 10 || ++y) System.out.println(y);\n\
    ```\n打印 \"ten\"，如果我们使用 `|`，结果将是 \"eleven\"。\n\n条件操作。Java 有类似于 C++ 的条件运算符 `?:`：\n\
    \n```\ncondition ? expression1 : expression2\n```\n\n如果条件为真，则该操作的结果为 `expression1`，否则为\
    \ `expression2`。在这种情况下，未评估的表达式不会被计算。\n\n赋值运算符与表达式运算符。所有的 Java 语句（与所有语言一样）都有返回值。除此之外，它们（在\
    \ C、C++ 中，但在其他语言中不是）也可以更改其操作数。此类操作包括 `++`, `--`, `=`, 以及所有带赋值的操作。\n\n赋值操作是一种二元操作，将第二个参数的值赋值给第一个。第一个参数的赋值必须是\
    \ `lvalue`，即“允许赋值的”。赋值操作的结果等于第二个参数的值。例如，下一个操作：\n\n```\nx = y = ten;\n```\n将 10\
    \ 赋值给变量 `y`，之后将操作的结果（即 10）赋值给 `x`。\n\n表达式运算符。它的语法为：\n\n```\nexpression ;\n```\n\
    \n因此，在任何表达式后添加分号将其转换为运算符，这种组合操作的可能性允许一个运算符同时更改多个变量，这在使用赋值运算符时是不可能的。\n\n与 C++ 不同，Java\
    \ 有一个额外要求：包含在运算符表达式中的最后一个操作必须更改其操作数。例如，运算符：\n\n```java\nx + 1;\n```\n"
