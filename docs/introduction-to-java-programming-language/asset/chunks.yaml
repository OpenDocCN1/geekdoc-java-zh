    ### Creation and performance requests to base data

    Request to ba- ze data encapsulated classes implementing interface `Statement`
    . To each object such class corresponds not more than one object, representing
    resulting kit data. If a required have more than one result set, each of them
    must to be generated separate `Statement` object. Performance new The SQL query
    closes the existing data set created by the topic same `Statement` object.


    For creation request used method


    ```java

    Statement createStatement() throws SQLException

    Statement createStatement( int resultSetType, int resultSetConcurrency, int resultSetHoldability)
    throws SQLException

    ```


    called on the connection object. The second version of this method allows lays
    install options resulting set data. Possible nye values these parameters given
    in tab. [10.1](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)[ ](cm. also P. [10.5](#part0025.xhtml__bookmark89)
    ). For fulfillment request to DB are used the following methods in--терфейса `Statement`:


    ```java

    boolean execute(String sql) throws SQLException

    ResultSet executeQuery(String sql) throws SQLException

    int executeUpdate(String sql) throws SQLException

    ```


    The first method is usually used for queries that do not return resulting values
    (for example, `DROP` ), the second method is for queries that return a set of
    data (for example, `SELECT`). The third method is applied for `INSERT`, `UPDATE`
    and `DELETE`. It returns the number of added, removed or changed records. After
    processing results request must to be closed through call


    ```java

    void close() throws SQLException

    ```


    If a result was created, he closes automatically.


    The following example demonstrates how to create, populate, and modify "people"
    through SQL queries.


    ```java

    // Loading drivers and With DB

    String dbUrl = "jdbc:mysql://localhost/test?useUnicode=true";

    Class.forName("com.mysql.jdbc.Driver");

    Connection conn = DriverManager.getConnection(dbUrl, "");

    Statement s = conn.createStatement();


    // Создание таблицы и заполнение

    s.execute("CREATE TABLE people (Id INTEGER AUTO_INCREMENT PRIMARY KEY, Name VARCHAR(40),
    Telephone VARCHAR(10), Age INTEGER)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Ivanov'', ''12-02-00'',
    37)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Petrov'', ''43-55-47'',
    26)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Sidorov'', ''43-88-90'',
    59)");


    // Modification and deletion records

    System.out.println("Updated records: " + s.executeUpdate("UPDATE people SET Telephone=
    ''63-16-00'' WHERE Name= '' Petrov '' "));

    System.out.println("Removed entries: " + s.executeUpdate("DELETE FROM people WHERE
    Name=''Иванов''"));


    s.close();


