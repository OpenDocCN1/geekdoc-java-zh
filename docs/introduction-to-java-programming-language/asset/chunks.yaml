  trans: "\n\n```java\nint compare(T o1, T o2)\n```\n\n该方法比较作为参数传递的两个对象，并返回正数、负数或零的整数作为比较结果。\n\
    \n`compare()` 接口属于 `Comparable<T>`。\n\n因此，在上面的示例中，与其使用 `compareTo()` 方法，你可以通过以下方式实现\
    \ `comparator`：\n\n```java\nclass ComplexNumberLenComp implements Comparator<ComplexNumber>\n\
    {\n    public int compare(ComplexNumber c1, ComplexNumber c2)\n    {\n       \
    \ double diff = (c1.re * c1.re + c1.im * c1.im)\n        - (c2.re * c2.re + c2.im\
    \ * c2.im);\n        return ( int )(Math.sign(diff));\n    }\n}\n```\n\n很明显，对于一个类，可以定义任意数量的比较器，因此该方法通常用于程序对对象使用不同排序标准的情况。\n\
    \n许多标准容器处理算法以及自容器都要求你定义对象如何排序。在 P 中介绍了在存储研究机构和处理导入数据时使用多种排序方法的示例。8.8。\n\n### 集合与有序集合\n\
    \n集合（Sets）和有序集合提供了快速添加和删除元素的集合，但不允许对它们进行排序并保留重复。\n\n`Set<E>` 接口以及实现的 `HashSet<E>`\
    \ 类。它们与 `Collection<E>` 接口相比都没有增加新方法。存储类 `HashSet<E>` 使用哈希表，因此存储在集合中的对象必须实现 `equals()`\
    \ 和 `hashCode()` 方法（见第 3.12 节）。由于哈希的存在，执行基本操作（添加、删除和检查元素在集合中的出现）的时间实际上与集合的大小无关。迭代器遍历集合元素的顺序被认为是任意的，因为是由元素的哈希值决定的。创建副本类\
    \ `HashSet<E>` 使用以下构造函数：\n\n```java\nHashSet()\nHashSet(Collection<? extends E>\
    \ c)\n```\n\n集合由 `SortedSet` 接口表示，并使用 `TreeSet<E>` 类实现它。后者使用平衡二叉树进行存储，这可以保证迭代器按升序遍历集合的顺序。添加、删除和检查元素出现的操作的时间复杂度为\
    \ O log N)。\n\n创建副本类 `TreeSet<E>` 使用以下构造函数：\n\n```java\nTreeSet()\nTreeSet(Collection<?\
    \ extends E> c)\nTreeSet(SortedSet<E> s)\nTreeSet(Comparator<? super E> c)\n```\n\
    \n其中最后一个允许你根据构造函数中比较器确定的任意顺序创建集合（见第 [8.4] 节）。在所有其他情况下，集合的排序按照自然顺序进行。在这种情况下，元素类必须实现\
    \ `Comparable<T>` 接口。\n\n### 关联数组\n\n正如前面提到的，关联数组可以被认为是使用任意对象代替索引的数组。我们可以假设它们将一个键对象集合归约化为一个值对象集合。它们并不是传统意义上的集合，因为它们没有实现\
    \ `Collection<E>` 接口。它被 `Map<K, V>` 接口取代，该接口有两个选项。第一个定义了关联数组的键的数据类型，第二个是其值的类型。基本接口方法\
    \ `Map<K, V>` 见表 [8.3]。\n\n关联数组用于存储集合容器的对。因此，两者的层次结构和属性都是匹配的：类 `HashSet` 和 `TreeSet`分别对应类\
    \ `HashMap` 和 `TreeMap`，接口 `SortedSet` 对应接口 `SortedMap`。关联列表主要操作的执行时间与其相关的集合相同。\n\
    \n关联列表没有自己的迭代器。它们的遍历使用通过 `keySet()` 方法返回的键的集合迭代器。以下代码段演示了关联数组的使用：\n\n```java\n\
    V put(K key, V value) // 添加键值对（返回与键关联的旧值，如果该键不存在则返回 null）\nV get(Object key) //\
    \ 获取值（如果键不在关联数组中则返回 null）\nV remove(Object key) // 删除键值对（返回被删除的键值）\nboolean containsKey(Object\
    \ key) // 检查关联数组是否包含该键\nint size() // 获取关联数组的大小\nvoid clear() // 清空关联数组\nboolean\
    \ isEmpty() // 检查关联数组是否为空\nSet<K> keySet() // 获取键集合\n```\n\n表 8.3. `Map<K, V>`\
    \ 的主要方法\n\n```java\nTreeMap<String, String> capitals = new TreeMap<String, String>();\n\
    capitals.put(\"Russia\", \"Moscow\");\ncapitals.put(\"France\", \"Paris\");\n\
    capitals.put(\"Italy\", \"London\"); // 不正确\ncapitals.put(\"Italy\", \"Rome\"\
    ); // 修正\nSystem.out.println(\"Capital Italy: \" + capitals.get(\"Italy\"));\n\
    \nfor (String s : capitals.keySet()) System.out.println(s + \": \" + capitals.get(s));\n\
    ```\n\n### 继承（遗留）类\n\n除了 `ArrayList<E>`、`HashSet<E>` 和 `HashMap<E>` 之外，还有功能类似的类\
    \ `Vector<E>`、`Hashtable<E>` 和 `Dictionary<E>`。这些是所谓的遗留类（legacy classes）。它们的主要目的是提供向后兼容。尽管它们不被视为已过用，但在新程序可能最好避免它们。\n\
    \n```java\nE max(Collection<? extends E> coll)\nE max(Collection<? extends E>\
    \ coll, Comparator<? super T> comp)\nE min(Collection<? extends E> coll)\nE min(Collection<?\
    \ extends E> coll, Comparator<? super T> comp)\nvoid sort(List<T> list)\nvoid\
    \ sort(List<T> list, Comparator super super T> c)\nint binarySearch(List<? extends\
    \ T> list, T key)\nint binarySearch(List<? extends T> list, T key, Comparator<?\
    \ super T> c)\nCollection<T> unmodifiableCollection(Collection<? extends T> c)\n\
    List<T> unmodifiableList(List<? extends T> c)\n```\n\n"
