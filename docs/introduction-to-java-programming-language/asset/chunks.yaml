  trans: "\n\n特别注意工厂方法，它们会返回不可变的容器包装器（`unmodifiableCollection()`、`unmodifiableList()`\
    \ 等）。这些方法返回一个实现相应类型容器接口的对象。在使用返回对象进行估计和获取值的方法时，后者的表现方式与原始对象完全相同。当尝试调用任何容器修改方法时，会抛出\
    \ `UnsupportedOperationException` 类型的异常。\n\n下面的示例演示了本章所描述工具的功能。\n\n```java\nvoid\
    \ sort(int[] a) // Sorting array\nvoid sort(T[] a, Comparator<? super T> c)\n\
    int binarySearch(int[] a, int key)\nint binarySearch(T[] a, T key, Comparator<?\
    \ super T> c) // 对对象数组进行排序，使用指定的比较器\n\n// 在引用行数组中查找元素索引的二分查找。如果未找到元素，则返回一个等于（元素应该插入的位置减去\
    \ 1）的值。\nboolean equals(int[] a, int[] a2) // 数组的相等性比较\nvoid fill(int[] a, int\
    \ val) // 给给定数组的所有元素赋值\nList<T> asList(T[] a)\nList<T> asList(t...a) // 数组/集合转换为列表\n\
    \nimport java.util.*;\n\n/** 类 \"问卷数据人类\" */\nclass person implements Comparable<Person>\
    \ {\n    /** 用于接收的数据字段和方法 */\n    private String name;\n    public String getName()\
    \ { return name; }\n    private int age;\n    public int getAge() { return age;\
    \ }\n\n    /** 构造函数 */\n    public Person(String name, int age) {\n        this.name\
    \ = name;\n        this.age = age;\n    }\n\n    /** 将对象转换为字符串 */\n    public\
    \ String toString() {\n        return name + \" (\" + age + \")\";\n    }\n\n\
    \    /** 等等性比较对象 */\n    public boolean equals(Object obj) {\n        if (!(obj\
    \ instanceof Person))\n            return false;\n        return ((Person)obj).name.equals(name)\
    \ && ((Person)obj).age == age;\n    }\n\n    /** 获取哈希码对象 */\n    public int hashCode()\
    \ {\n        return name.hashCode() + age;\n    }\n\n    /** 姓名的比较对象 */\n    public\
    \ int compareTo(Person p) {\n        return name.compareTo(p.name);\n    }\n}\n\
    \n/** 类 \"用于年龄比较的比较器\" */\nclass PersonAgeComparator implements Comparator<Person>\
    \ {\n    public int compare(Person p1, Person p2) {\n        return p1.getAge()\
    \ - p2.getAge();\n    }\n}\n\npublic class PersonsSortExample {\n    public static\
    \ void main(String[] args[]) {\n        TreeSet<Person> data = new TreeSet<Person>();\n\
    \        data.add(new Person(\"Petrov\", 31));\n        data.add(new Person(\"\
    Ivanov\", 45));\n        data.add(new Person(\"Smirnov\", 20));\n        data.add(new\
    \ Person(\"Smirnov\", twenty)); // 此元素已存在\n        System.out.println(data); //\
    \ 结论：按姓排序\n\n        // 将集合的内容复制到列表\n        ArrayList<Person> data2 = new ArrayList<Person>(data);\n\
    \        Collections.sort(data2, new PersonAgeComparator());\n        System.out.println(data2);\
    \ // 输出：按年龄排序\n    }\n}\n```\n\n这些程序的结论如下：\n[Ivanov (45) Petrov (31), Smirnov\
    \ (twenty)]\n[Smirnov (twenty), Petrov (31), Ivanov (45)]\n\n# 9. 多线程编程\n\n线程的创建与管理。多线程是一种组织程序执行的方法，其中程序的各个部分同时或伪同时地执行。\n\
    \n`Thread` 类封装了一个执行线程。该类的基本方法列于表 9.1。程序中的每个执行线程都对应该类或其子类的一个实例。通常情况下，程序会创建 `Thread`\
    \ 类的子类，并重写作为流入口的方法。\n\n```java\nvoid run()\n```\n\n在创建当前类的实例时，相应的执行线程不会接收管理。要运行流，应该调用与其对应的：\n\
    \n```java\nvoid start()\n```\n\n一旦调用了 `start()` 方法，相应的执行线程就会开始执行 `run()` 方法。这创造了同时执行的错觉。要验证某个流是否已经结束，可以使用对应对象的\
    \ `isAlive()` 方法。还可以暂停当前线程直到另一个线程完成。要实现此点，请使用 `join()` 方法。\n\n```java\nstatic\
    \ void sleep(long millis) throws InterruptedException\nvoid join() throws InterruptedException\n\
    ```\n\n运行中的线程可以通过调用 `sleep()` 方法自行进入睡眠模式。在这种情况下，处理器时间也会通过 `yield()` 重新分配给其他线程。\n\
    \n```java\nvoid run() // 流的入口\nvoid start() // 启动流\nvoid isAlive() // 检查流是否结束\n\
    void interrupt() // 设置中断标记\nboolean isInterrupted() // 获取中断标记状态\nvoid setPriority(int\
    \ newPriority) // 修改流优先级\nint getPriority() // 流优先级\nvoid setDaemon(boolean on)\
    \ // 设置守护线程流\n```\n\n```java\nif (!somethingHappened) yield();\n```\n\n"
