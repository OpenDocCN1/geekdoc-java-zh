    # Java 语言编程介绍


    JERRY HERRERA


    ## 目录


    - 引言

    - 1. 数据类型、字面量、变量

    - 2. 运算与运算符

    - 3. 类与对象

    - 4. 继承与多态

    - 5. 异常处理

    - 6. 字符串处理

    - 7. 输入输出

    - 8. 容器

    - 9. 多线程编程

    - 10. 数据库访问技术 JDBC


    # 引言


    本教材面向雅罗斯斯拉夫尔国立大学（YarGU）信息与计算机技术学院“信息系统支持与管理”专业的四年级学生。它描述了 `Java` 编程语言的以及一些相关技术。书中还包含了一些关于面向对象软件编程和设计的通用信息。


    前两章介绍了语言的基础——类型、运算和运算符。这些章节中的大部分材料通过 Java 语言工具与类似的 `C++` 语言工具进行了对比。


    第 3–5 章阐述了面向对象编程的原理，并描述了实现这些原理的语言工具。特别关注了可能异常情况的处理，以及一些类设计问题。


    第 6-8 章描述了 Java 标准库的特性。包括字符串数据处理、流式输入/输出，以及 Java 容器类的使用——这些应用程序中存储和处理数据的极其强大且方便的手段。


    第 9–11 章对了一些 Java 技术进行了介绍。所提供的材料使我们能够学习相关技术背后的思想，并掌握这些技术的基础知识。


    手册末尾列出了所讨论主题的主要和额外参考文献。在这些列表中，我想重点推荐书籍 [1]，它对语言机制的理解有非常详细且深入的阐述；还有一本可以作为语言主要工具（尤其是库）指南的书籍。我还推荐一本描述
    Java 应用设计的书籍，学习它可能会显著提高程序员的专业水平。


    # 1. 数据类型、字面量、变量


    基本数据类型。Java 定义了 8 种基本数据类型。包括四种整数类型 `byte`、`short`、`int`、`long`，两种实浮型 `float` 和
    `double`，字符类型 `char` 和逻辑类型 `boolean` 类型。其主要特征见表 1.1。与 `C++` 不同，Java 中没有“指针”数据类型。


    Java 中基本数据类型的主要特征是，这些类型的变量不是对象。所有其他类型的变量（包括数组和字符串类型变量 `String`）都是对象引用（object references）。更多细节将在节
    3.3 中讨论。


    字面量。整数字面量可以用十进制、八进制和十六进制指定。十进制字面量直接写入，其余使用类似的前缀：八进制使用 "0"，十六进制使用 "0x"。例如，整数 47
    可以表示为 `0x2F`。


    Long 型常量必须带有 `L` 或 `l`（例如 `47L`）。浮点字面量必须带有 `F` 或 `f`（例如 `3.5F`）。Double 字面量必须带有
    `D` 或 `d`（例如 `3.5D`）。


    符号字面量仅限于引号。也可以使用 Unicode 表示。对于后者，字面量写为 `\u`。


    布尔字面量 `true` 和 `false` 分别定义。


    变量。在 Java 中声明变量与 `C++` 类似。任何变量可以在描述时初始化。与 `C++` 不同，不允许在内部块中使用相同名称进行声明。用 `final`
    修饰符声明的变量是不可变的。例如：`final double PI = 3.14159265358973116`。


    类型转换。Java 中的类型转换分为隐式和显式。隐式转换自动执行。强制转换（Casting）的规则要严格得多。


    赋值时满足以下条件会进行自动类型转换：

    - 整数类型或 `char` 转换为某种数值类型或实型

    - 所需转换的类型范围更大


    表达式中的自动类型转换在参数运算、字符串拼接时执行（更多细节见节 6.3）；

    - 如果二元运算的操作数之一类型为 `double`，则第二个转换为 `double` 类型；

    - 否则：如果操作数之一类型为 `float`，则第二个转换为 `float` 类型；

    - 否则：如果操作数之一类型为 `long`，则第二个转换为 `long` 类型；

    - 否则，两个操作数都转换为 `int` 类型。


    这里需要注意最后一点。在某些情况下，它的应用可能会导致不自然的结果。例如，以下代码段在语言层是错误的：


    ```java

    int x = 2.5;

    ```


    错误是因为在给变量 a 的值加 1 时，结果已转换为 `int` 类型。由于从 `int` 类型到 `short` 的类型转换可能会溢出，因此必须显式地产生：


    ```java

    short a = 5;

    short b = (short)(a + 1); // 错误：需要 short，而不是 int

    ```


