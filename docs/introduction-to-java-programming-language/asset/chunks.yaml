  trans: "\n\n![](img/image00400.jpeg)\n`if(myObject instanceof MyClass) ((MyClass)myObject).doSomethingSpecificForMyClass();`\n\
    \n2. 如果父类的某些方法在子类中被重写，那么在访问这些方法时，即使通过父类对象的引用，也会调用对应的被重写方法。这与 C++ 中的多态实现不同，在上述情况下，只有当相关方法被声明为虚函数（virtual）时才会调用被重写的方法。\n\
    \n考虑一个例子。假设有一个“几何形状”的基类。它包含一个方法 `area()`，设计用于计算图形的面积。“shape”类的每个子类都重写了该方法，以计算相应几何图形的面积。\n\
    \n指向特定形状类实例的引用存储在一个类型为“shape”的引用数组中，然后进行统一的不同的处理：对于每个图形，显示其面积。这不需要任何形状类型检查，因为每个形状都会自动调用所需的方法。\n\
    \n```java\n/**  抽象类 \"Geometric figure\" */\nabstract class figure\n{\n    /**\
    \  计算图形面积的方法 */\n    abstract public double area();\n}\n\n/**  类 \"Rectangle\"\
    \ */\nclass Rectangle extends figure\n{\n    private double a, b;\n    public\
    \ Rectangle(double a, double b) { this.a = a; this.b = b; }\n    public double\
    \ area() { return a * b; }\n}\n\n/**  类 \"Circle\" */\nclass Circle extends Figure\n\
    {\n    private double r;\n    public Circle(double r) { this.r = r; }\n    public\
    \ double area() { return Math.PI * r * r; }\n}\n\n/**  类 \"triangle\" */\nclass\
    \ triangle extends figure\n{\n    private double a, b, c;\n    public Triangle(\
    \ double a, double b, double c)\n    {\n        this.a = a; this.b = b; this.c\
    \ = c;\n    }\n    public double area()\n    {\n        double p = (a + b + c)\
    \ / 2;\n        return Math.sqrt(p * (p – a) * (p – b) * (p – c));\n    }\n}\n\
    \npublic class FiguresPolymorphism\n{\n    public static void main(String args[])\n\
    \    {\n        figure f[] = new Figure[3]; //  引用对象数组\n        f[0] = new Rectangle(2,\
    \ 3); f[1] = new Triangle(3, 4, 5); f[2] = new Circle(1);\n        for(int i =\
    \ 0; i < f.length; ++i) System.out.println(f[i].area());\n    }\n}\n```\n\n接口。Java\
    \ 不允许一个类继承多个类。然而，存在多重继承的局限模拟形式，即“一个类实现多个接口”。函数式接口接近抽象类，但带有某些限制（只允许抽象方法和静态字段），但任何类都可以实现（作为继承的模拟）多个接口。\n\
    \n对于接口的定义，使用以下语法：\n\n`interface interface_name [  extends list_of_interface_ancestors_names\
    \ ]`\n\n接口的所有方法隐式接收修饰符 `abstract public `，所有接口变量都是 `final static public` 修饰符，并且必须在声明时初始化。不允许在接口中使用特定的访问访问符。\n\
    \n任何类都可以实现任意数量的接口。对于一个类，实现一个或多个接口，遵循以下语法：\n\n`[ access_spec ] class class_name\
    \ [ extends superclass_name ] implements list_of_interface_names`\n\n接口名称列表的元素用逗号分隔。如果类被声明实现某些接口，则它必须实现这些接口中声明的所有方法，或者该类必须是抽象类。\n\
    \n接口引用。就像将类对象的引用转换为其父类对象的引用引用，，可以将此类引用转换为该类所实现的任何接口的引用。这种引用的行为与抽象类对象的引用行为完全一致。例如：\n\
    \n```java\ninterface Ifc1\n{\n    void f();\n}\n\ninterface Ifc2\n{\n    void\
    \ g();\n}\n\nclass MyClass implements Ifc1\n{\n    public void f() { };\n    public\
    \ void g() { };\n}\n\npublic class InterfRef\n{\n    public static void main(String\
    \ args[])\n    {\n        MyClass m = new MyClass();\n        Ifc1 ir = m; \n\
    \        ir.f();\n        ((Ifc2)m).g();\n        Ifc2 ir2 = m;\n        ir2.g();\n\
    \    }\n}\n```\n\n使用继承和多态的指南。开发类时应构建层次结构：子类更私有，……抽象类是一个抽象实体，其细节未完全描述。不遵循这一原则会导致严重的设计错误，体现在类中，增加后续阶段设计的难度。\n\
