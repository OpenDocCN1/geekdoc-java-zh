  trans: "\n在 C++ 中是有效的，在 Java 中是无效的，因为它不改变变量的值。\n\n控制流语句。当前的控制运算符包括：条件语句 `if`、选择语句\
    \ `case`、循环运算符 `while`、`do-while` 和 `for`、提前退出循环的运算符 `break` 以及跳转到下一次迭代的 `continue`，以及用于从函数返回\
    \ `return` 运算符。这些运算符的语法与 C++ 相似，但有细小的修改。\n\n特别是，所有执行验证条件的运算符都要求条件具有布尔类型。这意味着，与\
    \ C++ 不同，`if (n)` 和 `if (n != 0)` 结构是不等价的，而且如果变量 `n` 的类型不是布尔类型，第一种写法在语法上是错误的。\n\
    \n`for` 语句就像在 C++ 中一样，可以在循环中声明任何类型的变量。例如：\n\n```cpp\nfor (int i = 0; i < N; ++i)\n\
    ```\n\n以这种方式声明的变量在循环内部有效。你可以在 `for` 运算符的头部中使用多个表达式，并用逗号分隔它们：\n\n```cpp\nfor (i\
    \ = 0, j = 0; i + j < twenty; ++i, ++j)\n```\n\n`case` 语句中的控制表达式必须是整数类型之一。\n\n\
    Java 不包含 `goto` 语句。相反，它扩展了 `break` 语句和 `continue` 语句来退出多个嵌套循环。它们并不常见，因此在这里不被考虑。它们的描述可以在例如\
    \  [2 ] 这样的书书中找到。\n\n需要注意的是，Java 不允许程序中存在不可访问的代码（例如，跟在 `return` 语句后面的代码），这会导致编译错误。\n\
    \n# 3. 类和对象\n\n核心概念——面向对象编程。Java 编程语言支持面向对象编程（OOP）范式。OOP 的核心概念是类。类是由用户定义的共享数据类型。类可以包含字段（变量）和方法（函数）。类型为“类”的变量被称为对象（或类实例）。每个对象都有自己的类中某些字段的副本。字段的内容决定了该对象在任何给定时间的状态。每个类的一个实例存在一个方法，但是调用任何（非静态）方法只能通过指定的类对象执行。通常，该方法处理的是恰好属于被调用实例类的字段（改变它的状态）。因此，类方法决定了该类所有对象的行为。非常重要的一点是，类的字段或方法本身并不存在于该类的对象之外。\n\
    \n类的概念可以看作是结构体概念的演进，在结构体中处理数据的函数被放置在这些结构内部。同时，面向对象编程语言的中介属性允许禁止从外部访问对象数据，并仅通过方法处理数据。在这种情况下，我们说类方法为其数据提供了接口。\n\
    \n之前的介绍从技术角度（即从编程语言手段的角度）描述了类和对象的概念。然而，也可以给出另一种解释。面向对象编程相对于早期范式（结构化编程）的一个特点是，程序员有机会不仅仅为表示领域的数据处理机制选择语言环境，而是在程序内部对领域进行建模。在这种情况下，程序中的对象（大多数情况下）对应于领域的对象，而类则是预定义领域的通用概念，刻画了相同类型对象的属性和行为。这种编程方法通常是高效的（特别是在开发大型软件系统时，以及在集体开发中），因为程序员能够用领域的语言描述对象之间的交互，而不是用反映计算机内部工作细节的语言。\n\
    \n请注意，与开发面向对象应用原则相关的问题极其广泛，但对于任何专业程序员来说，认真处理这些问题都是必要的。为了进一步学习这些问题，建议首选书籍  [6 ]，以及书籍\
    \  [1, 3, 5, 7, 8 ]。\n\n## 类声明\n\n使用以下内容来声明一个类：语法如下：\n\n```java\n[access_spec]\
    \ class class_name\n{\n    [access_spec] datatype field_name [ = initial_value\
    \ ];\n    [access_spec] datatype method_name ( argument_list )\n    {\n      \
    \  // method_body\n    }\n}\n```\n\n类中字段和方法的声明顺序可以是任意的。可能的访问修饰符在 3.10 中描述。\n\n\
    构造函数的名称与类名相同，且没有返回值。如果没有显式声明类构造函数，则创建一个不带参数的空构造函数。\n\n如果一个类有两个同名的方法，则这些方法被称为重载。所需的重载方法的选择由编译器根据传递给方法的参数数量和类型执行。不允许定义两个签名相同的方法（签名是指方法名和参数类型），否则编译器在这种情况下无法确定你应该调用哪种方法。\n\
    \n不支持默认参数。如果需要这种可能性，则你应该显式地实现所有必要参数的方法。\n\nJava 不允许类之外存在代码，即没有不是字段的局部变量，也没有 C++\
    \ 意义上的函数。\n\n## 对象的创建\n\n在 Java 中，所有对象都是动态创建的。在虚拟内存中。在 C++ 中存在的变量对象在 Java 中不存在，类型为某个类的变量实际上不是对象，而是对象的引用。例如：\n\
    \n```java\nMyClass myObject;\n```\n\n这声明了一个名为 myObject 的 MyClass 类型对象引用，但没有创建对象本身（在\
    \ C++ 中对应的将是指针声明：MyClass* myObject）。对象的实际创建通过 `new` 运算符完成：\n\n```java\nmyObject\
    \ = new MyClass();\n```\n\n这里创建了一个 MyClass 的对象（在创建时，调用了无参数构造函数），并将其引用写入变量 myObject。也可以同时完成对象的创建和它的初始化：\n\
    \n```java\nMyClass myObject = new MyClass();\n```\n\n## 访问字段和方法\n\n一旦对象创建，就可以通过\
    \ `.`（点）运算符访问它的字段和方法：\n\n```java\nmyObject.someMethod();\n```\n"
- fmt: "\nWhen accessing a field or method of an object from a method called on the\
    \ same object, the name of the object can be omitted or replaced the `this` keyword.\
    \ The `this` keyword is also used to call `constructor` `class` from another `constructor`\
    \ (cm. example below). In the latter case, such a call must be the first statement\
    \ of `constructor`.\n\n### Example\nAs an example, consider the class `Box` (\"\
    box\"), storing the dimensions of some box (three integers). Class `Box` lives\
    \ overloaded constructors with different arguments, as well as the `volume()`\
    \ method, which calculates the volume of the box. `SimpleBoxDemo` class demonstrates\
    \ creation and usage copies of `box` class.\n\nTo simplify the example, access\
    \ control (see [3.10](#part0006.xhtml__bookmark27)) is not used. In practice,\
    \ this approach should not be used by any programmer!\n\n```java\n/** Class \"\
    Box\" */\nclass Box\n{\n    /** Dimensions drawer */\n    int width, height, depth;\n\
    \    /** Constructor on default */\n    Box() { width = height = depth = 0; }\n\
    \n    /** Basic constructor */\n    Box(int width, int height, int depth)\n  \
    \  {\n        this.width = width; this.height = height; this.depth = depth;\n\
    \    }\n\n    /** Конструктор для куба */\n    Box(int size)\n    {\n        this\
    \ (size, size, size); // width = height = depth = size;\n    }\n\n    /** Method\
    \ calculations volume */\n    int volume() { return width * height * depth; }\n\
    }\n\npublic class SimpleBoxDemo\n{\n    static void main(String args[])\n    {\n\
    \        Box b1 = new Box(5), b2 = new Box(5, 10, 20); b1.width = 10;\n      \
    \  System.out.println(b1.volume() + \"\\n\" + b2.volume());\n    }\n}\n```\n\n\
    ### Removal of objects\nOperation removal objects in Java is not manually looked\
    \ at. Here replaces mechanism automatic assembly garbage collection. To ensure\
    \ work this mechanism the `JVM` (Java Virtual Machine) keeps track of the number\
    \ of object references to each created object and, as soon as there is no reference\
    \ left to the object, it becomes a candidate on removal. Removal of objects is\
    \ carried out periodically and only in the case when the amount of memory that\
    \ needs to be freed becomes essential.\n\nAutomatic garbage collection allows\
    \ bypass a significant part of the number of problems associated with memory leaks.\
    \ Unfortunately, in some cases such problems still arise in Java applications.\
    \ Examples can be found in the book.\n\nDestructors are not provided in Java.\
    \ Since the release of memory management is implemented by the `JVM`, the need\
    \ for them arises not too often. If they are still needed, you should define your\
    \ own methods and call them explicitly. An example here is the `close()` method\
    \ in inline classes, exercising closing flow of I/O (cm. P. [7.1](#part0011.xhtml__bookmark55)).\n\
    \n### Static fields and methods\nStatic fields and existing methods exist in a\
    \ single instance for each class, that is, they are shared for all copies of this\
    \ class. To declare static fields and methods, a special specifier `static`:\n\
    \n```java\nstatic int static_field = ten;\n```\n\nStatic fields are initialized\
    \ at class load time, either with the value specified in the declaration (see\
    \ the example of paragraph [3.5](#part0005.xhtml__bookmark22)), or in a special\
    \ `static` block. Static methods cannot (without explicitly specifying an object)\
    \ access non-static fields and non-static methods of the class.\n\nCalling static\
    \ fields and methods can be carried out without an instance of a class. In this\
    \ case, instead of the instance name the class name is used most of the time.\
    \ For example:\n\n```java\ndouble x = Math.sqrt(2.0);\n```\n\nMethod `main()`,\
    \ which is the entry point in all Java programs, must be declared `static` (cm.\
    \ example P. [3.5](#part0005.xhtml__bookmark22)).\n\nMethods with arguments and\
    \ peculiarities use object links. An object reference behaves like a pointer in\
    \ C, so assigning one object reference to another does not result in copying an\
    \ object. To perform copying of objects, a class usually implements a copy constructor\
    \ and, maybe, the `clone()` method. \n\nPrimitive types are passed to methods\
    \ by value. This applies to object references as well, so the objects themselves\
    \ are passed by reference (similar to copying pointer in C).\n\nLet's consider\
    \ a typical mistake when using object references. Let available class `point`\
    \ be the next implementation:\n\n```java\nclass point\n{\n    public double x,\
    \ y;\n    public point(double x, double y) {\n        this.x = x;\n        this.y\
    \ = y;\n    }\n}\n```\n\nLet's say we want to exchange two `point` objects:\n\n\
    ```java\nvoid swap(point p1, point p2) {\n    point temp = p1;\n    p1 = p2;\n\
    \    p2 = temp;\n}\n```\n\nIf we use the following code:\n\n```java\nvoid swap(point\
    \ p1, point p2)\n{\n    p1.x = p2.x;\n    p1.y = p2.y;\n}\n```\nThis is incorrect\
    \ because it only exchanges the content, not the objects themselves. To exchange\
    \ objects, we should use:\n\n```java\nvoid swap(point p1, point p2)\n{\n    double\
    \ tempX = p1.x;\n    double tempY = p1.y;\n    p1.x = p2.x;\n    p1.y = p2.y;\n\
    \    p2.x = tempX;\n    p2.y = tempY;\n}\n```\n\nWait, if we want to exchange\
    \ the references in the calling method:\n\n```java\nvoid swap(point p1, point\
    \ p2)\n{\n    point temp = p1;\n    p1 = p2;\n    p2 = temp;\n}\n```\nThis does\
    \ not work because the variables `p1` and `p2` are local to the method. To solve\
    \ this, we can wrap the point in a class:\n\n```java\nclass Wrapper {\n    point\
    \ p;\n    Wrapper(point p) { this.p = p; }\n}\n\nvoid swap(Wrapper w1, Wrapper\
    \ w2) {\n    point temp = w1.p;\n    w1.p = w2.p;\n    w2.p = temp;\n}\n```\n\n\
    Finally, if we want to exchange the content of the `point` objects:\n\n```java\n\
    void swap(point p1, point p2)\n{\n    double tempX = p1.x;\n    double tempY =\
    \ p1.y;\n    p1.x = p2.x;\n    p1.y = p2.y;\n    p2.x = tempX;\n    p2.y = tempY;\n\
    }\n```\n\n### Packages and structure of the translation module\nPackages are means\
    \ of grouping types (classes and interfaces) in Java programs. Each package may\
    \ contain one or more classes, as well as other packages. Distribution of classes\
    \ by packages allows you to solve the problem of name conflicts, as well as more\
    \ efficient access control. To refer to elements of a package, the full path is\
    \ used, consisting of a set of subpackages separated by dots (e.g. `java.util.HashSet`).\
    \ To refer to classes in the same package, you can use simply names, omitting\
    \ the package name.\n\n```java\npackage mypackage.mysubpackage;\n```\n\nIf a `package`-statement\
    \ is missing, the classes belong to a default package that has no name, cannot\
    \ have sub-packages and is not visible from other packages.\n\nA translation module\
    \ may contain one or more `import` statements that allow package names to be omitted\
    \ when referring to classes. For example, if in module present line:\n\n```java\n\
    import java.util.*;\n```\n\nthen all classes of the `java.util` package (but not\
    \ to the classes of its subpackages!) can be addressed on short names. When importing\
    \ a single class, for example:\n\n```java\nimport java.util.HashSet;\n```\n\n\
    The translation module must contain the source text of the `main` class (or interface)\
    \ module. Name of this class should match the name of the translation module file.\
    \ This class is the only translation module class that can be declared `public`.\
    \ The module may also contain one or several auxiliary classes.\n"
