    \ str)`: Concatenation lines\n- `String toUpperCase()`: Transformation lines to\
    \ upper register\n- `String toLowerCase()`: Transformation lines to lower register\n\
    - `String trim()`: Remove leading and final gaps in line\n- `String replace(String\
    \ target, String replacement)`: Replacement substrings of another string\n- `boolean\
    \ matches(String regex)`: Lines on the conformity of regular expression\n- `String\
    \ replaceFirst(String regex, String replacement)`: Replacement first substrings\
    \ matching the regular expression\n- `String replaceAll(String regex, String replacement)`:\
    \ Replacement all substrings matching the regular expression\n- `String[] split(String\
    \ regex)`: Split lines on the substrings (once dividers are given regular expressions)\n\
    \n### Regular Expressions\n\nRegular expressions are describing structure of textual\
    \ lines using conventional symbols and metacharacters, determining properties\
    \ of lines as a whole or its individual parts. Standard Library Tools Java allows\
    \ you to check strings against a given regular expression, as well as to replace\
    \ substrings, satisfying regular expressions, other substrings.\n\nBasic metacharacters\
    \ used in regular expressions in Java are given in Table. [6.2](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).\
    \ Examples of regular expressions are given in tab. [6.3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).\n\
    \nTo check if a string matches a given regular expression, used method `boolean\
    \ matches(String regex)` in class `String`. Note that because he checks all string\
    \ on the regular expression, then usage symbols `^` and `$` in this case are unnecessary.\n\
    \nThe following methods replace the first and all occurrences, respectively, relevant\
    \ regular expression:\n- `String replaceFirst(String regex, String replacement)`\n\
    - `String replaceAll(String regex, String replacement)`\n\nFor example, the following\
    \ statement replaces the ellipsis located in end of line, interrogative sign:\n\
    \n```java\nsomeString.replaceFirst(\"\\\\.\\\\.\\\\.$\", \"?\");\n```\n\nSince\
    \ the character `.` is a metacharacter, then in order to use it as a literal,\
    \ it must be escaped as `\\.`. In a replacement string, you can use the character\
    \ `$` followed by number, denoting the group:\n\n```java\nsomeString.replaceFirst(\"\
    (.*)\", \"$1\");\n```\n\nIt should be noted that if a line contains several parentheses,\
    \ they must be escaped: `\\\\(`.\n\nMethod `String[] split(String regex)` allows\
    \ you to split a string into substrings, using regular expressions. The result\
    \ is written as array. For example:\n\n```java\nString[] m = \"abc:de:f\".split(\"\
    :\"); // fill array m with \"abc\", \"de\", \"f\"\n```\n\nIn conclusion, we note\
    \ that regular expressions seem to be the most powerful tool for processing string\
    \ data, and their capabilities are much broader than it was possible to show on\
    \ given examples. More information about regular expressions can get in book [10](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX).\n\
    \n### String conversion and concatenation\n\nClass `String` is in a sense an exclusive\
    \ class in Java, since any data type can be converted to it. For primitive types,\
    \ such conversion gives them natural representation, the `toString()` method is\
    \ called for objects.\n\nFor concatenation operation, denoted by sign `+`. This\
    \ is a binary operation, one of whose arguments must have type `String`. It performs\
    \ automatic conversion of argument to `String` (if needed) and merge the resulting\
    \ lines. Note that this is the only case when transformation to line is done implicitly.\
    \ There is also a concatenation assignment with `+=`, whose first argument must\
    \ be of type `String` (and must be lvalue) and the second one can be arbitrary.\n\
    \nLet's give an example of using the conversion to a string. For the class \"\
    point of the plane\" it is possible to define transformations to line next way:\n\
    \n```java\nclass point {\n    private double x, y;\n\n    public String toString()\
    \ {\n        return \"(\" + x + \", \" + y + \")\";\n    }\n\n    public point(double\
    \ _x, double _y) {\n        x = _x;\n        y = _y;\n    }\n}\n```\n\nHere automatic\
    \ conversion of double values to strings is carried out in the expression of the\
    \ return statement. Defined above `toString()` may be used next way:\n\n```java\n\
    point p = new point(2.0, 5.0);\nSystem.out.println(p); // conclusion on the screen:\
    \ (2.0, 5.0)\n```\n\nFor to get and withdraw on the screen string performance\
    \ object, method `println()` causes method `toString()` class `point`.\n\nSometimes\
    \ required to view string representation. For this maybe to be used static method\
    \ `format()` class `String`:\n\n```java\nstatic String format(String format, Object...\
    \ args)\n```\n"
