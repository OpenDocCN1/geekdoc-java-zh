  trans: "\n\n`String` 类的一个可能出乎意料的特性是，该类的实例在创建后不能被更改（不可变性）。然而，这并没有给它们的使用带来限制，因为所有修改字符串的方法只是创建一个新的修改后的字符串，而保持运行中的字符串不变。让我们通过示例来解释这一机制是如何工作的：\n\
    \n```java\nString s = \"abcd\";\ns = s.toUpperCase();\n```\n\n在这里，`toUpperCase()`\
    \ 方法创建一个包含字符序列 `\"ABCD\"` 的新字符串，并返回该字符串的引用，将其赋值给变量 `s`，变量的旧值被丢弃。原始字符串保持不变，由于没有更多对象引用，它将被汇编器垃圾回收器移除。\n\
    \n### 表中给出的 `String` 类主要方法。6.1\n\n- `int length()`: 获取字符串长度\n- `char charAt(int\
    \ index)`: 提取字符\n- `char [] toCharArray()`: 将字符串转换为字符数组\n- `boolean equals(String\
    \ str)`: 比较字符串相等性\n- `boolean equalsIgnoreCase(String str)`: 忽略区分大小写的字符串比较\n-\
    \ `int compareTo(String str)`: 字典序字符串比较\n- `int compareToIgnoreCase(String str)`:\
    \ 忽略区分大小写的字典序比较\n- `boolean startsWith(String prefix)`: 检查字符串是否以指定的子字符串开头\n- `boolean\
    \ endsWith(String suffix)`: 检查字符串是否以指定的子字符串结尾\n- `int indexOf(String subStr)`:\
    \ 从行开始或从指定位置搜索子字符串的第一次出现的位置\n- `int indexOf(String subStr, int fromIndex)`: 从指定位置搜索子字符串的第一次出现的位置\n\
    - `int lastIndexOf(String subStr)`: 从指定位置搜索子字符串的最后出现的位置\n- `int lastIndexOf(String\
    \ subStr, int fromIndex)`: 从指定位置搜索子字符串的最后出现的位置\n- `String substring(int beginIndex,\
    \ int endIndex)`: 接收子字符串（不包含索引 endIndex!）\n- `String substring(int beginIndex)`:\
    \ 获取尾部字符串\n- `String concat(String str)`: 字符串拼接\n- `String toUpperCase()`: 字符串转换为大写\n\
    - `String toLowerCase()`: 字符串转换为小写\n- `String trim()`: 移除字符串首尾的空格\n- `String replace(String\
    \ target, String replacement)`: 替换另一个字符串中的子字符串\n- `boolean matches(String regex)`:\
    \ 检查字符串是否符合正则表达式\n- `String replaceFirst(String regex, String replacement)`: 替换第一个匹配正则表达式的子字符串\n\
    - `String replaceAll(String regex, String replacement)`: 替换所有匹配正则表达式的子字符串\n- `String[]\
    \ split(String regex)`: 根据正则表达式分割字符串（当分隔符为正则表达式）\n\n### 正则表达式\n\n正则表达式使用约定符号和元字符来描述文本行的结构，确定行的整体或其各个部分的属性。Java\
    \ 标准库工具允许你检查字符串是否符合指定的正则表达式，并替换符合正则表达式的子字符串或其他子字符串。\n\nJava 正则表达式中使用的元字符见表 6.2。正则表达式示例见表\
    \ 6.3。\n\n要检查字符串是否匹配指定的正则表达式，使用 `String` 类中的方法 `boolean matches(String regex)`。注意，由于它检查整个字符串是否符合正则表达式，在这种情况下使用符号\
    \ `^` 和 `$` 是没有必要的。\n\n以下方法分别替换第一个和所有相关的正则表达式匹配：\n- `String replaceFirst(String\
    \ regex, String replacement)`\n- `String replaceAll(String regex, String replacement)`\n\
    \n例如，以下语句替换了位于行尾的省略号为问号：\n\n```java\nsomeString.replaceFirst(\"\\\\.\\\\.\\\\\
    .$\", \"?\");\n```\n\n由于 `.` 是元字符，因此为了将其作为字面量使用，必须将其转义为 `\\.`。在替换字符串中，你可以使用字符\
    \ `$` 后跟数字来表示分组：\n\n```java\nsomeString.replaceFirst(\"(.*)\", \"$1\");\n```\n\
    \n应该注意的是，如果行包含多个括号，它们必须被转义：`\\\\(`。\n\n方法 `String[] split(String regex)` 允许使用正则表达式将字符串拆分为子字符串。结果以数组形式写入。例如：\n\
    \n```java\nString[] m = \"abc:de:f\".split(\":\"); // 数组 m 填充 \"abc\", \"de\"\
    , \"f\"\n```\n\n结论，我们注意到正则表达式似乎是处理字符串数据最强大的工具，它们的能力比给定示例所展示的要广泛得多。关于正则表达式的更多信息可以在书籍\
    \ 10 中找到。\n\n### 字符串转换与拼接\n\n`String` 类在意义上是 Java 中的一个特殊类，因为任何数据类型都可以转换为它。对于原始类型，这种转换赋予了它们自然的表示形式，对于对象，则调用\
    \ `toString()` 方法。\n\n拼接操作由符号 `+` 表示。这是一个二元操作，其中一个参数必须是 `String` 类型。它执行参数到 `String`\
    \ 的自动转换（如果需要）并合并结果行。注意，这是唯一一种隐式进行字符串转换的情况。还有一种带有 `+=` 的拼接赋值，其第一个参数必须是 `String`\
    \ 类型（并且必须是左值），第二个参数可以是任意类型。\n\n让我们给出一个使用字符串转换的示例。对于“平面上的点”类，可以如下方式定义到字符串的转换：\n\
    \n```java\nclass point {\n    private double x, y;\n\n    public String toString()\
    \ {\n        return \"(\" + x + \", \" + y + \")\";\n    }\n\n    public point(double\
    \ _x, double _y) {\n        x = _x;\n        y = _y;\n    }\n}\n```\n\n在这里，双精度值到字符串的自动转换在返回语句的表达式中完成。定义的\
    \ `toString()` 可以按以下方式使用：\n\n```java\npoint p = new point(2.0, 5.0);\nSystem.out.println(p);\
    \ // 屏幕输出结论：(2.0, 5.0)\n```\n\n为了获取并在屏幕上显示对象的字符串表示，`println()` 方法会导致 `point` 类的\
    \ `toString()` 方法。\n\n有时需要查看字符串表示。可以使用 `String` 类的静态方法 `format()`：\n\n```java\n\
    static String format(String format, Object... args)\n```\n\n"
