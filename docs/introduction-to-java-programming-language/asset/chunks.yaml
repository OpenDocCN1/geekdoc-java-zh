  trans: "\n有时有必要提前终止线程，并可能在未来恢复其执行。为了此，在 `Thread` 类中引入了 `stop()`、`suspend()` 和 `resume()`\
    \ 方法，但后来它们被认为是不安全的，因为它们允许在停止线程之前执行诸如（例如）释放指定资源等操作，因此可能导致程序挂起或运行异常。在新程序中不应使用这些方法。控制流的另一种方法是使用\
    \ `Thread` 类的特殊标志位 `interrupted`。为了中断当前执行流，使用了 `setInterrupted()` 方法。如果此时流处于挂起状态（调用了\
    \ `sleep()`、`join()` 等方法），则它将恢复工作，相应的方法抛出处会抛出一个异常。否则，将设置特殊标志位 `interrupted`。线程必须通过调用\
    \ `isInterrupted()` 方法自行检查该标志位状态，并在已安装了 `interrupted` 标志位（即它被设置为 true）的情况下终止工作，例如：\n\
    \n```java\nvoid run()\n{\n    boolean done = false ;\n    while (!done)  // 主循环流\n\
    \    {\n        if (isInterrupted())\n        {\n            // 执行最后的动作\n    \
    \        return ;\n        }\n    }\n}\n```\n\n每次调用方法 `isInterrupted()` 都会重置标志位\
    \ `interrupted`。注意，如果流不检查标志位 `interrupted`，可能会出现其在通常被禁止的情况下被停止的状况。\n\n下面的示例演示了\
    \ `Thread` 类各种方法的使用。在这个示例中，主线程实例化了 `helloThread` 类，在独立的执行线程上于屏幕上输出“Hello, world!”短语，并在完成前制造了延迟。主线程反而在等待子线程完成，完成后显示一条消息，表示子线程已完成。\n\
    \n```java\nclass helloThread extends Thread {\n    /** 流的入口点 */\n    public void\
    \ run() {\n        System.out.println(\"Hello, world!\");\n        try {\n   \
    \         sleep(1000);\n        } catch(InterruptedException e) {\n          \
    \  System.err.println(\"线程 MyHelloThread 被中断了\");\n        }\n    }\n}\n\npublic\
    \ class SimpleThreadsExample {\n    public static void main(String args[]) {\n\
    \        Thread t = new HelloThread(); t.start();  // 启动流\n        try {\n   \
    \         t.join();  // 等待流完成\n        } catch (InterruptedException e) {\n  \
    \          System.err.println(\"主流被中断\");\n        }\n        System.out.println(\"\
    线程 MyHelloThread 结束\");\n    }\n}\n```\n\n`runnable` 接口。有时需要向已有的类添加 `Thread` 类的功能。为了实现对\
    \ `Thread` 类的继承是不允许的，因为该类已经是其他类的子类。在这种情况下，可以使用 `Runnable` 接口。该接口只定义了一个方法 `void\
    \ run()`，与线程类中的同名方法相似。\n\n实现 `runnable` 接口的类如下方式使用：创建该类的实例，并将其传递给线程类的构造函数：\n`MyRunnableClass\
    \ r = new MyRunnableClass(); Thread t = new Thread(r); t.start();`\n\n有时将 `Thread`\
    \ 类对象直接放置在实现 `Runnable` 接口的类内部，并在类的构造函数中初始化：\n\n```java\nclass MyRunnableClass\
    \ implements runnable {\n    private Thread thread;\n    /** 构造函数：创建一个 Thread\
    \ 类对象并启动它 */\n    public MyThread() {\n        thread = new Thread( this ); thread.start();\n\
    \    }\n    /** 流的入口点 */\n    public void run() {\n        // . . .\n    }\n}\n\
    ```\n\n### 同步\n\n在多线程应用程序中，通常不需要让同一个对象或方法只被一个线程使用。为了提供这种可能性，使用了 `sync` 机制。\n\n\
    考虑一个可能需要同步的原始示例。\n\n```java\nclass MyThread extends Thread {\n    /** 构造函数（保存流名并启动流）\
    \ */\n    public MyThread(String name) { super (name); start(); }\n    /** 流的入口点\
    \ */\n    public void run() {\n        try {\n        }\n        System.out.print(\"\
    [\"); Thread.sleep(1); System.out.print(getName()); Thread.sleep(1); System.out.print(\"\
    ]\");\n    } catch(InterruptedException e) {\n        System.err.println(\"线程\
    \ \" + getName() + \" 被中断\");\n    }\n}\n\npublic class SyncExample {\n    public\
    \ static void main(String[] args) {\n        for ( int i = 0; i < ten; ++i)\n\
    \            new MyThread(String.valueOf(i));\n    }\n}\n```\n\n这个示例创建了 10 个线程，每个线程向控制台输出其方括号内的数字并终止。该程序的输出示例：\n\
    `[[[[[[[[[1[4320586]79]]]]]]]]]`\n\n因为所有流都同时使用同一个对象（`System.out`），所以不同流的输出结果会混合在一起。并不难让你理解这种状况，即类似对象的联合使用可能会导致错误。还应该考虑到，由于流之间的时间分布具有非确定性特征，因此错误可能不会在每个程序启动时出现，这增加了发现它们的复杂性。在示例中，如果在如果在上面的示例中去掉\
    \ ( sleep )，这种效果几乎永远不会发生。\n\n同步的核心概念是监视器（monitor）。监视器是一个（隐式的）对象，用于互斥阻塞。在 Java\
    \ 中，每个对象最初都有自己的监视器。当一个线程进入监视器时，会检查相应的块。如果此时另一个线程尝试进入同一个监视器，它将暂停直到第一个线程出来。Java\
    \ 中有两种同步类型：同步方法和同步块。\n\n要使一个方法同步，只需在它的头部添加 `synchronized` 关键字即可。同步块（有时称为临界区）具有如下语法：\n\
    \n```java\nsynchronized (object_name) {\n    // . . .\n}\n```\n\n特别是在给出的示例中，将\
    \ try 内容放在同步块中：\n\n```java\nsynchronized (System.in) {\n    System.out.print(\"\
    [\"); Thread.sleep(1); System.out.print(getName()); Thread.sleep(1); System.out.print(\"\
    ]\");\n}\n```\n\n在这种情况下，进入 `System.in` 对象监视器的线程首先，挂起所有尝试进入同一个监视器的线程，只有在它完全完成结论后才释放监视器。然后监视器包含下一个流并继续。\n\
    \n# 10. 数据库数据访问技术 JDBC 架构。JDBC 是 Java 应用程序的平台无关数据库访问技术。它提供了一组数据访问接口，Java 应用程序通过它们与外部数据库驱动程序交互，并提供了集成这些外部驱动程序到\
    \ Java 中的工具。\n"
