    这种方法足够灵活，因为 Java 应用程序不需要与数据库（DB）的交互细节分离。数据库只需要提供某些 `JDBC` 接口的实现即可，以便与 Java 应用程序兼容。


    `JDBC` 类和接口托管在 `java.sql` 包中。关于 `JDBC` 技术的更多信息可以在书籍中找到 [4, 5]。


    ### 数据库驱动程序

    要连接到数据库，我们必须首先加载与所用数据库对应的驱动程序。Java 的标准发行仅包含这样一个驱动程序 - `JDBC-ODBC` 桥接。该驱动程序桥接了
    `JDBC` 接口与连接 Microsoft 数据库的标准接口 `ODBC`（开放数据库连接）。这种方法虽然足够但通通用，因为对于大多数数据库都有相应的 ODBC
    驱动。然而，首选的连接方式仍然被认为是使用特定数据库的 `JDBC` 驱动，因为此类驱动通常比 `JDBC-ODBC Bridge` 功能更强、速度更快。此外它们还可以提供跨平台的应用程序变性（使用
    `ODBC` 通常只能在 MS Windows 上使用）。`JDBC` 驱动可以在大多数现有 DBMS 的交付中找到，或者通过互联网地址找到：


    `JDBC` 驱动通常以 `jar` 归档的形式提供，必须放在 `CLASSPATH` 列出的任何目录中（cm. P. 3.9），以便 `JVM` 找到所需的驱动程序。


    加载驱动程序通过调用类静态方法完成：


    ```java

    static class forName(String classname) throws ClassNotFoundException

    ```


    在方法参数中传递驱动类名，例如：


    ```java

    Class.forName("sun.jdbc.odbc.JdbcOdbcDriver");  // ODBC-JDBC 桥接驱动

    Class.forName("com.mysql.jdbc.Driver");  // MySQL Connector/J 驱动

    ```


    在无法下载驱动的情况下，将抛出 `classNotFoundException` 。


    ### 连接基础数据

    连接基础数据对应于实现 `connection` 接口的对象类。


    创建这些对象使用了静态方法：


    ```java

    static connection getConnection(String url, String user, String password) throws
    SQLException

    ```


    `DriverManager` 类。该方法的第一个参数定义了连接到数据库的字符串，另外两个是用户名和密码。


    #### 连接字符串

    其格式如下：


    `jdbc:subprotocol_name:data_source_name`


    这里“name subprotocol”定义了数据库的驱动或协议插件，而“data source name”通常是数据库名称。连接字符串还可以包含额外参数
    - 例如。它们的格式，即数据源名称的格式，取决于特定的驱动。例如，以下行可用于 `JDBC-ODBC Bridge` 驱动连接到本地计算机上名为 "Clients"
    的数据库：


    `jdbc:odbc:Clients`


    相关的数据库必须先在 `ODBC` 管理器中注册。另一个示例是：


    `jdbc:mysql://http://mydbserv.ru:3105/Students?useUnicode=true`


    此类连接用于连接到位于地址 [ ](http://mydbserv.ru/) 的服务器 MySQL 上的远程数据库 students。连接将通过端口 3105
    建立，传输的行将使用 Unicode 编码。


    ### 基础数据的创建和性能请求

    对基础数据的请求封装在实现 `Statement` 接口的类中。每个此类对象对应不多于一个对象，表示产生的数据集。如果需要多个结果集，每个结果集都必须由单独的
    `Statement` 对象生成。新的 SQL 查询会关闭由同一 `Statement` 对象创建的现有数据集。


    创建请求使用了方法：


    ```java

    Statement createStatement() throws SQLException

    Statement createStatement( int resultSetType, int resultSetConcurrency, int resultSetHoldability)
    throws SQLException

    ```


    在连接对象上调用。该方法的第二个版本允许设置结果集数据的安装选项。这些参数的可能值见表 10.1  )。为了执行数据库请求，使用了 `Statement`
    接口中的以下方法：


    ```java

    boolean execute(String sql) throws SQLException

    ResultSet executeQuery(String sql) throws SQLException

    int executeUpdate(String sql) throws SQLException

    ```


    第一个方法通常用于不返回结果值的查询（例如，`DROP`），第二个方法用于返回数据集的查询（例如，`SELECT`）。第三个方法用于 `INSERT`、`UPDATE`
    和 `DELETE`。它返回添加、删除或更改的记录数。处理结果后后必须通过调用关闭请求：


    ```java

    void close() throws SQLException

    ```


    如果创建了结果，它将自动关闭。


    下面的示例演示了如何通过 SQL 查询创建、填充和修改“people”表。


    ```java

    // 加载驱动并连接数据库

    String dbUrl = "jdbc:mysql://localhost/test?useUnicode=true";

    Class.forName("com.mysql.jdbc.Driver");

    Connection conn = DriverManager.getConnection(dbUrl, "");

    Statement s = conn.createStatement();


    // 创建表并填充

    s.execute("CREATE TABLE people (Id INTEGER AUTO_INCREMENT PRIMARY KEY, Name VARCHAR(40),
    Telephone VARCHAR(10), Age INTEGER)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Ivanov'', ''12-02-00'',
    37)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Petrov'', ''43-55-47'',
    26)");

    s.execute("INSERT INTO people(Name, Telephone, Age) VALUES ('' Sidorov'', ''43-88-90'',
    59)");


    // 修改和删除记录

    System.out.println("Updated records: " + s.executeUpdate("UPDATE people SET Telephone=
    ''63-16-00'' WHERE Name= '' Petrov '' "));

    System.out.println("Removed entries: " + s.executeUpdate("DELETE FROM people WHERE
    Name=''Иванов''"));


    s.close();


    ### 遍历数据集

    数据集是实现 `ResultSet` 接口的对象类，封装了执行数据库查询的结果。数据集的能力由其参数定义。这些参数在对象创建时设置 - 请求 `createStatement()`
    或 `prepareStatement()` 对象方法（见段落 [10.4], [10.7]）。rsType 参数指定数据集类型，rsConcurrency
    - 更新模式，rsholdability - 事务提交后游标保留模式。


    数据集包含一个游标，允许你在该集的行之间移动。处理游标的技术与处理集合迭代器的技术非常相似（见第 8.2 节）。首先-初始游标放在第一行数据之前。


    ```java

    boolean next() throws SQLException

    boolean previous() throws SQLException

    ```

