    \ (int rows) throws SQLException\nboolean absolute (int row) throws SQLException\n\
    ```\n\n`allow` 允许在数据集中进行 `relative` 和 `absolute` 的光标定位。如果移动成功，指定的方法返回值 `true`；如果请求的元素不存在，则返回\
    \ `false`。注意记录集的实现是基于单位的！为了将光标定位在第一个元素之前和最后一个元素之后，使用了以下方法：\n\n```java\nvoid beforeFirst()\
    \ throws SQLException\nvoid afterLast() throws SQLException\n```\n\n上述列出的方法除 `next()`\
    \ 方法外，都仅在数据集不是单向的情况下（即读取参数 `rsType` 不等于 `TYPE_FORWARD_ONLY`）有效。\n\n为了获取数据集最后几行字段的值，当移动了任何定位方法（`next()`、`previous()`\
    \ 和 `t.` 等），可以使用以下方法：\n\n```java\nget***(int columnIndex) throws SQLException\n\
    get***(String columnName) throws SQLException\n```\n\n在这里，替代 Java 数据类型名称的是与参数对应的\
    \ SQL 数据类型（参见表 10.2）。所需的字段可以通过数据库中的名称或在请求中的编号来指定（字段编号从一开始！）。除了 `get***` 方法，你还可以使用通用方法\
    \ `vat`：\n\n```java\nObject getObject(int columnIndex) throws SQLException\nObject\
    \ getObject(String columnName) throws SQLException\n```\n\n它将请求字段的值作为对应已存在类型的对象返回（参见表\
    \ 10.2）。如果该类型是基本类型，则返回其包装类（例如 `Integer` 代替 `int` 等，参见 P. 3.13）。\n\n以下方法可以在屏幕上显示作为方法参数传递的任意表的内容。示例中使用了\
    \ `ResultSetMetadata` 类对象，它允许你获取数据集字段的数量和名称。关于此类的更多信息可以在 JDBC 的文档中查找到。\n\n```java\n\
    /** 输出数据库表内容 */\npublic static void printDB(Connection conn, String tableName)\n\
    throws SQLException\n{\n    Statement s = conn.createStatement();\n    ResultSet\
    \ r = s.executeQuery(\"SELECT * FROM \" + tableName);\n    // 结果集元数据列 ResultSetMetaData\
    \ md = r.getMetaData();\n    for (int i = 1; i <= md.getColumnCount(); ++i) {\n\
    \        System.out.print(md.getColumnName(i) + \"\\t\");\n        System.out.println();\n\
    \    }\n    // 输出表数据\n    while(r.next()) {\n        for(int i = 1; i <= md.getColumnCount();\
    \ ++i)\n            System.out.print(r.getObject(i) + \"\\t\");\n        System.out.println();\n\
    \    }\n    s.close();\n}\n```\n\n### 可修改的数据集\n\n如果数据集仅包含一个数据库表的字段，且集合中包含该表的主键，同时\
    \ `rsConcurrency` 选项设置为 `CONCUR_UPDATABLE`，则可以使用此类数据调用来修改相应的数据库表，而跳过显式的 SQL 语句。为此使用了以下方法：\n\
    \n```java\nvoid update***(int columnIndex, x) throws SQLException\nvoid update***(String\
    \ columnName, x) throws SQLException\n```\n\n更改通过调用方法记录在数据库中：\n\n```java\nvoid\
    \ updateRow() throws SQLException\n```\n\n要从数据库中删除数据集的当前记录，使用方法：\n\n```java\n\
    void deleteRow() throws SQLException\n```\n\n一种稍微复杂的方法是添加记录。首先，你需要将光标移动到数据集中要插入的特殊行。为此，使用了方法：\n\
    \n```java\nvoid moveToInsertRow() throws SQLException\n```\n\n然后借助方法 `update***()`\
    \ 完成对新增记录字段的填充。在表中产生新增记录的方法是：\n\n```java\nvoid insertRow() throws SQLException\n\
    ```\n\n为了让光标返回到插入之前的位置，使用了方法：\n\n```java\nvoid moveToCurrentRow() throws SQLException\n\
    ```\n\n下一个示例修改了 P. 10.4 示例中从数据库中间修改的集合数据：\n\n```java\nStatement s = conn.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\
    \ ResultSet.CONCUR_UPDATABLE);\nResultSet r = s.executeQuery(\"SELECT Id, Name,\
    \ Telephone, Age \" + \"FROM people\");\n// 为所有人的年龄加 1\nwhile (r.next()) {\n \
    \   r.updateInt(4, r.getInt(4) + 1);\n    r.updateRow();\n}\n// 添加新记录\nr.moveToInsertRow();\n\
    r.updateString(\"Name\", \"Smirnov\");\nr.updateObject(\"Telephone\", \"26-08-58\"\
    );\nr.updateInt(\"Age\", 43);\nr.insertRow();\nr.moveToCurrentRow();\ns.close();\n\
    ```\n\n### 使用预编译查询\n\n在这些场景中，当向数据库执行大量相似但仅参数不同的请求时，为了提高性能，你可以使用预编译查询。预编译请求对应实现\
    \ `PreparedStatement` 类的对象。创建此类对象的方法是：\n\n```java\nPreparedStatement prepareStatement(String\
    \ sql) throws SQLException\nPreparedStatement prepareStatement(String sql, int\
    \ resultSetType, int resultSetConcurrency, int resultSetHoldability) throws SQLException\n\
    ```\n\n在连接对象上。这些方法接受一个包含问号作为参数占位符的请求模式字符串，例如，\n\n"
