    ### Database drivers

    To connect to the database, you need We must first load the driver corresponding
    to the database used. The standard distribution of Java includes only one such
    driver - `JDBC` - `ODBC` Bridge. This driver bridges the `JDBC` interface and
    a standard interface for connecting to Microsoft databases `ODBC` (Open DataBase
    Connectivity). This method is sufficient but universal, since for most databases
    there are There corresponding ODBC drivers. However, the preferred way connection
    is still considered to be the use of `JDBC` drivers specific databases, since
    such drivers are usually are more functional and faster than `JDBC-ODBC Bridge`.
    In addition, they can provide cross-platform application variability (using `ODBC`
    is usually possible only on MS Windows). `JDBC` drivers can be found in delivery
    of most existing DBMS, or on the Internet by the address


    `JDBC` Drivers usually supplied in form `jar` archives, cat- which must be placed
    in any of the directories listed in `CLASSPATH` (cm. P. [3.9](#part0006.xhtml__bookmark26)
    ), to `JVM` could find required driver.


