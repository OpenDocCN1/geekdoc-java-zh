  trans: "\n\n在环境变量 `CLASSPATH` 列出的目录中，搜索包含字节码类的文件，这些类位于与包分级结构中类的位置对应的子目录中。\n\n例如，对于\
    \ JVM  找到的字节码类 `java.util.HashSet`，它必须位于任何目录环境变量 `CLASSPATH` 下的 `java/util` 子目录中名为\
    \ `HashSet.class` 的文件中。通常情况下，它包括当前目录以及包含标准 Java 库的目录。源文件也根据包的分级结构位于文件系统中。\n\n\
    ### 访问控制与封装\n\n访问控制主要用于：一方面，防止由于误用或恶意使用导致对象中包含的数据发生未经授权的更改；另一方面是将类的接口与其实现分离来（隐藏实现细节）。使用该类的程序员只能看到它的接口（具有公共访问权限的字段和方法），而可能对类的内部结构一无所知。这允许你更改类的实际实现，而对程序员是透明的。例如，你可以替换为一种更高效的实现，完全重构类的内部结构，而使用该类的程序代码无需更改即可与新版本共同工作。\n\
    \n将字段和方法放在类内部并隐藏实现细节被称为封装。封装是面向对象编程的一个特征。\n\n访问控制通过在类、字段和方法的描述中设置特定的访问修饰符来实现。在\
    \ Java 中，类有两种访问修饰符，字段和方法有四种。所有这些连同作用域，都对应于表 3.1、3.2 中列出的程序现有元素。访问级别由其修饰符指定。此外还有“默认”（default）访问级别，它没有任何特殊的修饰符。\n\
    \n以下是在 Java 程序中使用访问控制的某些指南。\n\n访问管理的核心规则：在设计程序的所有元素时，应该将访问级别设置为允许这些元素正常运行的最限制级别。类与类之间彼此的信息越少，它们就越可能被重复使用。\n\
    \n类字段使用 `private` 访问权限。为了从外部读取和更改它们的值，使用了特殊方法（setter 和 getter），这些方法具有 `public`\
    \ 访问修饰符。例如：\n\n```java\nclass MyClass\n{\n    private int value;\n    public void\
    \ setValue(int value) { this.value = value; }\n    public int getValue() { return\
    \ value; }\n}\n```\n\n这种方法非常灵活。例如，你可以通过删除或简单地不重写相应的 setter，或者通过插入相关的检查来限制字段的可能值，从而将某个字段设为只读字段。\n\
    \n具有 `public` 访问修饰符的类方法构成了该类数据的接口。只有通过这些方法，外部类才能访问该类封装的数据，并且只有这些方法决定了处理这些数据的可能方式。\n\
    \n在存在继承的情况下（参见条目 4.1），元素的 `private` 和“默认”访问修饰符通常会被 `protected` 修饰符替换，以允许类的后类访问相应的类元素。如果整个后类层级都在同一个文件夹中（即与被继承类相同），也可以使用默认访问。\n\
    \n默认访问可以用于创建“友元”私有类，这些类可以访问彼此的私有字段和本地成员。此类友元类放在同一个包中。在这种情况下，访问控制的能力比 C++ 中的友元类更灵活。然而，不建议滥用这种可能性，因为友元类之间的关系比普通类更紧密，因此一个类中的更改可能需要其他类进行重大更改。\n\
    \n示例。以具有以下实现的“整数栈”类作为示例：\n\n```java\n/** “整数整数栈”类 */\npublic class IntStack\n\
    {\n    private final int MAXLEN = 64;  // 栈的最大尺寸\n    private int s[], size;\n\
    \n    /** 默认构造函数 */\n    public IntStack()\n    {\n        size = 0;\n       \
    \ s = new int [MAXLEN];\n    };\n\n    /** 拷贝构造函数 */\n    public IntStack (IntStack\
    \ stack)\n    {\n        size = stack.size;\n        s = new int [MAXLEN]; \n\
    \        for ( int i = 0; i < size; ++i)\n            s[i] = stack.s[i];\n   \
    \ }\n\n    /** 获取栈的大小 */\n    public int getSize() { return size; }\n    /** 在栈中记录元素\
    \ */\n    public void push( int e) { s[size++] = e; }\n    /** 从栈中弹出元素 */\n  \
    \  public int pop() { return s[--size]; }\n    /** 检查栈是否为空 */\n    public boolean\
    \ isEmpty() { return size == 0; }\n}\n```\n\n栈的状态由其当前的实际大小 `size` 和存储在 `s` 数组中的内容决定。对于字段\
    \ `size`，定义了 `getSize()` 方法来获取当前栈的大小。没有访问数组 `s` 的手段。通过 `push()`、`pop()`、`isEmpty()`\
    \ 方法结合 `getSize()` 方法和两个类构造函数来定义栈数据的接口。注意，为了使用一个类，只需要这些方法的签名以及它们执行的操作的描述。在这种方法中，内部实现细节被隐藏了，并且很容易更改。例如，你可以将数组\
    \ `s` 替换为双链表，这不会影响使用 `IntStack` 的类。\n\n对象比较。标准操作 `==` 比较的是对象的引用。但通常要求对对象的内容进行比较而不是引用。为此，`boolean\
    \ equals(Object obj)` 方法定义在 `Object` 类中（参见节 4.1）并包含在所有类中。程序员必须重写此方法以便按要求的方式进行比较。例如，对于包含两个整数坐标\
    \ `x` 和 `y` 的 `Coords` 类（“平面点”），对应的方法可以实现如下：\n\n```java\npublic boolean equals(Object\
    \ obj)\n{\n    if(!(obj instanceof Point))\n        return false;  Point c = (Point)obj;\n\
    \    return x == c.x && y == c.y;\n}\n```\n\n如果程序中使用了标准容器类（参见节 8.1），通常不仅需要重写 `equals()`\
    \ 方法，还需要重写 `int hashCode()` 方法。哈希值——这是一个根据对象的状态（包含的字段）计算出的数字。相等对象（即 `equals()`\
    \ 方法返回 true 的对象）必须具有相同的哈希值。对于不相等的对象，哈希值不一定不同。然而，应该尽力做到。此外，还应该考虑到哈希值的分布越均匀，所使用的内置集合（集合和关联数组）的性能就越好。\n\
    \n上述上述类可以定义 `hashCode()` 方法如下：\n\n```java\nint hashCode()\n{\n    return x + y;\n\
    }\n```\n\n"
