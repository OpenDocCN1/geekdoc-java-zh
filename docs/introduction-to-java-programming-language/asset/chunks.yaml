    Java No type data "pointer".


    The main feature of primitive data types in Java is that variables of these types
    are not objects. Variables all other types, including arrays and string type variables
    `String`, are object references (object references). Bymore fractional they will
    be considered in P. [3.3](#part0005.xhtml__bookmark20).


    Literals. Integer literals can be specified in ten tic, octal and hexadecimal.
    Literals in decimal form are written directly, the rest they are used prefixes
    similar to prefixes: "0" for octal and "0x" for hexadecimal. For example, integer
    47 can be represented as `0x2F`.


    Long literals must have `L` or `l` (for example, `47L`). Floating point literals
    must have `F` or `f` (for example, `3.5F`). Double literals must have `D` or `d`
    (for example, `3.5D`).


    Symbolic literals are limited to quotes. Unicode representation is also possible.
    For the latter, the literal is written as `\u`.


    Boolean literals `true` and `false` are defined respectively.


    Variables. Declaring variables in Java is similar to `C++`. Any variable can be
    initialized at the time of description. Unlike `C++`, no declaration is allowed
    in inner block with same name. Variables declared with the `final` specifier are
    unchangeable. For example: `final double PI = 3.14159265358973116`.


    Type conversions. Type conversions in Java are divided on implicit and explicit.
    Implicit transformations are carried out automatically. Rules for Casting Casting
    are much more rigid.


    Automatic type conversion when assigning found, if fulfilled the following terms:

    - integer type or `char` to some numerical type or real

    - type of, required cast, It has more the size


    Automatic transformation types in expressions carried out for arguments operations
    concatenation lines (more detail P. [6.3](#part0010.xhtml__bookmark51));

    - if one from arguments binary operations It has type of `double`, second is given
    to type `double`;

    - otherwise: if one from arguments it has type of `float`, second is given to
    type `float`;

    - otherwise: if one from arguments it has type of `long`, second is given to type
    `long`;

    - otherwise both argument are given to type `int`.


    The last point should be noted here. In some cases it application may lead to
    unnatural results. For example, the following snippet is wrong in terms of language:


    ```java

    int x = 2.5;

    ```


    The error is related to the fact that when adding 1 to the value of the variable
    a the result has been converted to type `int`. Since the transformation change
    from type `int` to short can lead to underflow, then it must be produced explicitly:


    ```java

    short a = 5;

    short b = (short)(a + 1); // error: short is required, not int

    ```

