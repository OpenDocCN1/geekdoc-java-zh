    \ is that instances of this class cannot be changed after their creations (immutable).\
    \ However, this does not create restrictions for their use, because all the methods,\
    \ which would change string, just create a new modified string, leaving the running\
    \ string without changes. Let's explain how this mechanism works on the example:\n\
    \n```java\nString s = \"abcd\";\ns = s.toUpperCase();\n```\n\nHere, the `toUpperCase()`\
    \ method creates a new string containing the sequence of characters `\"ABCD\"\
    `, and returns a reference to this string, which is assigned to the variable `s`,\
    \ the old value of the variable rushes away. The original string remains unchanged\
    \ and, since there are no more object references left, will be removed by the\
    \ assembler garbage collector.\n\n### Main methods class `String` given in tab.\
    \ [6.1](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\n- `int length()`: Get length lines\n\
    - `char charAt(int index)`: Extract symbol\n- `char [] toCharArray()`: Getting\
