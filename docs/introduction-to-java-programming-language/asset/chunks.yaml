    # 表 8.1. `Collection<E>` 主要接口方法


    包含任意对象而非索引。它们在 P. 8.6 中详细描述。


    ## 迭代器 (Iterators)


    迭代器用于按某种顺序遍历集合。使用迭代器是遍历集合所有元素的最快方法。迭代器类实现了 `Iterator<E>` 接口，该接口定义了三个方法：`hasNext()`、`next()`
    和 `remove()`。


    通过调用相应集合对象的 `iterator()` 方法可以获取迭代器。初始时，迭代器设置在第一个元素之前。每次调用方法：


    ![](img/image00401.jpeg)


    ```

    E next()

    ```


    返回迭代器在调用之前的元素，并移动迭代器，将其置于返回元素之后。如果迭代器位于集合的最后一个元素之后，则 `next()` 方法将抛出 `NoSuchElementException`
    类型的异常。在使用迭代器之前检查元素可用性的方法：


    ```java

    boolean hasNext()

    ```


    对于删除上一次返回的 `next()` 元素，可以使用方法：


    ```java

    void remove()

    ```


    仅允许在调用 `next()` 方法后调用一次 `remove()` 方法。在其他情况下，或者在完全没有调用 `next()` 的情况下，抛出类似 `IllegalStateException`
    的异常。


    以下质量示例考虑了使用迭代器输出包含 `MyClass` 类型元素集合的用法：


    ```java

    for (Iterator<MyClass> it = collection.iterator(); it.hasNext(); ) System.out.println(it.next());

    ```


    对于集合（以及数组），还有另一种可选方案，用于循环：


    ```java

    for ([ type of data ] variable : collection)

    ```


    它按照 `iterator` 指定的顺序遍历集合内容（对于数组，是从第一个元素到最后一个元素的顺序），而循环头中指定的变量将紧跟指向集合上元素的赋值链接。例如：


    ```java

    for(MyClass e : collection) System.out.println(e);

    ```


    ## 列表与动态数组 (Lists and dynamic arrays)


    列表和动态数组——这些是按给定顺序包含任意元素的集合。此类集合中元素的顺序由它们的索引决定，如下与普通数组相同。所有提供此类集合性质功能的类都实现了 `List<E>`
    接口（`Collection<E>` 的子接口），其方法见表 [8.2]。


    对于所考虑的集合，定义在接口 `Collection<E>` 中的 `add()` 方法在集合末尾执行插入，而 `remove()` 方法删除指定元素的首次出现项。


    标准库包含以下按给定顺序包含任意元素的集合：`LinkedList<E>`、`ArrayList<E>` 和 `Vector<E>`。


    `LinkedList<E>` 类是以双向链表形式组织的集合。它提供了按 O(N) 时间复杂度根据索引获取元素，还提供了按 O(1) 时间复杂度在迭代器位置插入和删除元素。


    为了创建 `LinkedList<E>` 类的副本，可以使用构造函数：


    ```java

    void add(int index, E element) // 在指定位置添加元素

    E get(int index) // 根据索引获取元素

    E set(int index, E element) // 根据索引更改元素（返回旧元素）

    E remove(int index) // 根据索引删除元素（返回被删除的副本）

    int indexOf(Object o)

    int lastIndexOf(Object o)

    ListIterator<E> listIterator()

    ListIterator<E> listIterator(int index) // 搜索第一个/最后一个元素（如果失败，则返回 -1）

    // 接收在给定元素列表开始建立的列表迭代器

    LinkedList()

    LinkedList(Collection<? extends E> c)

    ```


    除了 `List<E>` 接口中声明的方法外，`LinkedList<E>` 类还提供了插入、获取和删除列表第一个和最后一个元素的方法：


    ```java

    void addFirst(Eo)

    void addLast(Eo)

    E getFirst()

    E getLast()

    E removeFirst()

    E removeLast()

    ```


    它们工作的时间复杂度均为 O(1)。`ArrayList<E>` 类表示自己组织为变大小数组的集合。此类数组具有某些初始大小（默认 10），在必要时可以增长。它们以
    O(1) 的复杂度通过索引获取元素。插入和删除元素需要 O(N)。为了创建 `ArrayList<E>` 类的副本，使用了：


    ```java

    ArrayList()

    ArrayList(Collection<? extends E> c)

    ArrayList(int capacity)

    ```


    `ArrayList<E>` 类表示自己组织为变大小数组的集合。此类数组具有某些初始大小（默认 10），在必要时可以增长。它们以 O(1) 的复杂度通过索引获取元素。插入和删除元素需要
    O(N)。为了创建 `ArrayList<E>` 类的副本，使用了：


    ```java

    ArrayList()

    ArrayList(Collection<? extends E> c)

    ArrayList(int capacity)

    ```


    `ArrayList<E>` 类表示自己组织为变大小数组的集合。此类数组具有某些初始大小（默认 10），在必要时可以增长。它们以 O(1) 的复杂度通过索引获取元素。插入和删除元素需要
    O(N)。为了创建 `ArrayList<E>` 类的副本，使用了：


    ```java

    ArrayList()

    ArrayList(Collection<? extends E> c)

    ArrayList(int capacity)

    ```


    ## 对象的排序 (Ordering of objects)


    根据特定的比较操作对对象进行排序的方法在 Java 中称为自然排序（natural-ordering）。每个类最多定义一种自然排序方式。另一种排序方法是定义一个外部类（比较），其对象将实现所需类对象的比较。Comparator
    类必须实现 `Comparator<T>` 接口，其中参数 T 定义了由此比较器比较的对象类型。Comparator<T> 接口定义了方法：


    ```java

    int compare(T obj)

    ```


    Java 有两种标准方法来定义此类操作。在第一种，需要排序的对象类实现 `Comparable<T>` 接口。类型参数 T 必须替换为实现类的类名称。例如，如果有一个具有两个实部
    re 和 im 字段的“复数”类，并且按照对应复数的模的升序或降序对该类对象进行排序，则 `compareTo` 操作可以定义如下：这种方式：


    ```java

    class MyClass implements Comparable<MyClass>


    int compareTo(T obj)

    ```


    它应该比较调用此方法的对象（this）与传递给此方法的对象，如果此对象大于 obj，则返回一个小于零的值；如果 this.equals(obj) 为 true，则返回零；如果
    obj 对象大于此对象，则返回大于零的值。“大于”关系本身可以是任意的，并对应于排序的标准。



