    #### Connection string

    It has next format:


    `jdbc:subprotocol_name:data_source_name`


    Here "name subprotocol" defines driver or protocol plug-in to the database, and
    "data source name" is usually the name of the database. The connection string
    can also contain additional parameters - ry. Them format, equals how and format
    name source data, depends from a specific driver. For example, the following line
    could be used for connections through drivers `JDBC-ODBC Bridge` to DB With name
    "Clients" located on the local car:


    `jdbc:odbc:Clients`


    Relevant DB must must to be previously registered in `ODBC` administrator. Yet
    one example:


    `jdbc:mysql://http://mydbserv.ru:3105/Students?useUnicode=true`


