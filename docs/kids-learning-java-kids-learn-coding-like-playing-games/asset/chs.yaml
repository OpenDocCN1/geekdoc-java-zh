  ## 创建类\nJava 是一种面向对象的编程语言。Java 中的几乎一切都是对象，拥有自己的属性和方法。类就像对象的构造器。在游戏中，飞机、子弹、炸弹和敌机被称为\
  \ `Sprite`。![](img/Image0051.jpg)\n\n### 1. 创建文件 `TestSprite.java`\n\n```java\n\
  // 定义一个 Sprite 类\nclass Sprite {\n    // 定义类的属性\n    String name = \"\" ;\n    String\
  \ color = \"\" ;\n    // 定义必须包含 self 的方法\n    public void draw() {\n        String\
  \ text = this .color + \" \" + this .name + \"�is drawn on canvas\" ;\n        System.out\
  \ .println(text);\n    }\n}\npublic class TestSprite {\n    public static void main(String[]\
  \ args) {\n        // 实例化名称为 sprite 的对象\n        Sprite sprite = new Sprite();\n\
  \        // 使用 sprite 访问属性和方法\n        sprite.name = \"Airplane\" ;\n        sprite.color\
  \ = \"Blue\" ;\n        sprite.draw();\n        sprite.name = \"Airplane\" ;\n \
  \       sprite.color = \"Red\" ;\n        sprite.draw();\n        sprite.name =\
  \ \"Bullet\" ;\n        sprite.color = \"Blue\" ;\n        sprite.draw();\n    \
  \    sprite.name = \"Bullet\" ;\n        sprite.color = \"Red\" ;\n        sprite.draw();\n\
  \    }\n}\n```\n\n**输出：**\nBlue Airplane is drawn on canvas\nRed Airplane is drawn\
  \ on canvas\nBlue Bullet is drawn on canvas\nRed Bullet is drawn on canvas\n\n###\
  \ 构造方法\n构造方法：创建对象时会被自动调用。\n\n### 2. 创建文件 `TestConstructor.java`\n\n```java\nclass\
  \ Sprite {\n    String name = \"\" ;\n    String color = \"\" ;\n    public Sprite(String\
  \ name, String color) {\n        this .name = name;\n        this .color = color;\n\
  \    }\n    public void draw() {\n        String text = this .color + \" \" + this\
  \ .name + \" is drawn on canvas\" ;\n        System.out .println(text);\n    }\n\
  }\npublic class TestConstructor {\n    public static void main(String[] args) {\n\
  \        // 实例化对象构造会被自动调用\n        Sprite blueSprite = new Sprite(\"Airplane\",\
  \ \"Blue\");\n        blueSprite.draw();\n        Sprite redSprite = new Sprite(\"\
  Bullet\", \"Red\");\n        redSprite.draw();\n    }\n}\n```\n\n\n\n\n\n# 结果\n\
  结果：`Blue Airplane` 画在画布上。\n结果：`Blue Bullet` 画在画布上。\n\n# 继承\n所有类 `EnemyPlane`、`BluePane`、`RedPlane`、`Bullet`\
  \ 都继承自 `Sprite1`。`Sprite` 被称为父类。`EnemyPlane`、`BluePane`、`RedPlane`、`Bullet` 被称为子类。子类可以调用父类的属性和方法。\n\
  \n![](img/Image_Image00052.jpg)\n\n## 1. 创建文件：`TestInheritance.java`\n\n```java\n\
  class Sprite {\n    private String name = \"\" ;\n    private String color = \"\"\
  \ ;\n    public Sprite(String name, String color){\n        this .name = name;\n\
  \        this .color = color;\n    }\n    public void draw() {\n        String text\
  \ = this .color + \" \" + this .name + \"  is drawn on canvas\" ;\n        System.out\
  \ .println(text);\n    }\n}\nclass BluePlane extends Sprite{\n    public BluePlane(String\
  \ name, String color) {\n        super (name, color);\n    }\n}\nclass RedPlane\
  \ extends Sprite{\n    public RedPlane(String name, String color) {\n        super\
  \ (name, color);\n    }\n}\nclass Bullet extends Sprite{\n    public Bullet(String\
  \ name, String color) {\n        super (name, color);\n    }\n}\npublic class TestInheritance{\n\
  \    public static void main(String[] args) {\n        BluePlane bluePlane = new\
  \ BluePlane(\"Airplane\" ,\"Blue\" );\n        bluePlane.draw();\n        RedPlane\
  \ redPlane = new RedPlane(\"Airplane\" ,\"Red\" );\n        redPlane.draw();\n \
  \       Bullet redBullet= new Bullet(\"Bullet\" ,\"Red\" );\n        redBullet.draw();\n\
  \    }\n}\n```\n\n# 结果\n结果：`Blue Airplane` 画在画布上。\n结果：`Red Airplane` 画在画布上。\n结果：`Red\
  \ Bullet` 画在画布上。\n\n# 重写\n重写：子类重写父类的方法，子类实例将调用被重写的方法。\n`Sprite` 可以发射子弹，但 `BluePlane`\
  \ 可以发射蓝色子弹，而 `RedPlane` 可以发射红色子弹。\n\n![](img/Image_Image00053.jpg)\n\n## 1. 创建文件：`TestOverride.java`\n\
  \n```java\nclass Sprite{\n    public void shoot(){\n        System.out .println(\"\
  fire bullet\" );\n    }\n}\n// BluePlane 继承 Sprite\nclass BluePlane extends Sprite{\n\
  \    public void  shoot(){\n        System.out .println(\"BluePlane fire blue bullet\"\
  \ );\n    }\n}\n// RedPlane 继承 Sprite\nclass RedPlane extends Sprite{\n    public\
  \ void  shoot(){\n        System.out .println(\"RedPlane fire red bullet\" );\n\
