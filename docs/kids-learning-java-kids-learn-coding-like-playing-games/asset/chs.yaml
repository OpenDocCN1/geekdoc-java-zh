  \    }\n    public static int sub(int a, int b){\n        return a - b;\n    }\n\
  \    public static int multiply(int a, int b){\n        return a * b;\n    }\n \
  \   public static int divide(int a, int b){\n        return a / b;\n    }\n    public\
  \ static void main(String[] args) {\n        int result = add(4, 2); // 调用 add 方法\n\
  \        System.out.println(result); // 6\n        result = sub(4, 2);\n       \
