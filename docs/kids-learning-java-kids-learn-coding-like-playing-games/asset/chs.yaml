  \ {\n        return a + b;\n    }\n    public int add(int a, int b) {\n        return\
  \ a + b;\n    }\n}\n\npublic class TestOverLoad {\n    public static void main(String[]\
  \ args) {\n        Caculator c = new Caculator();\n        int result = c.add(10,\
  \ 20);\n        System.out .println(result);\n        // 使用不同参数类型调用重载方法\n      \
  \  double result2 = c.add(30.5, 40.2);\n        System.out .println(result2);\n\
  \    }\n}\n```\n结果: 3070.7\n\n# 继承\n\n主题：`Student` 继承 `Person`\n\n步骤：\n1. 类：`Student`,\
  \ `Person`\n2. 关系：`Student` 扩展 `Person`\n3. 属性：`Person` 的属性 (`name`, `age`）\n4.\
  \ 方法：`Person` 的动作 (`say`)\n\n```![](img/Image00038.jpg)\n\n1. 创建文件：`TestInheritence.java`\n\
  \n```java\nclass Person {\n    protected String name;\n    protected int age;\n\
  \    public Person() {\n        System.out .println(\"Parent Person() instantiation\"\
  );\n    }\n    public Person(String name, int age) {\n        System.out .println(\"\
  Parent Person(String name, int age) instantiated\");\n    }\n    public void say()\
  \ {\n        System.out .println(\"Person can speaking\");\n    }\n}\n\n/**\n *\
  \ Person 被称为父类或超类\n * Student 被称为 Person 的子类\n */\nclass Student extends Person\
  \ {\n    public Student() {\n        super();\n        System.out .println(\"Subclass\
  \ Student() Instantiation\");\n    }\n    public Student(String name, int age) {\n\
  \        super(name, age);\n        System.out .println(\"Subclass Student(String\
  \ name, age) \" + name + \" instantiated\");\n    }\n}\n\npublic class TestInheritence\
  \ {\n    public static void main(String[] args) {\n        Student s = new Student();\n\
  \        s.name = \"Sumi\";\n        s.age = 22;\n        System.out .println(\"\
  -----------------------------------------\");\n        Student s2 = new Student(\"\
  Isacc\", 23);\n        s2.say();\n    }\n}\n```\n/**\n * 1. 子类无法访问父类的私有属性和方法\n *\
  \ 2. 子类可以访问父类的保护、公有属性和方法\n */\n结果：\nParent Person() instantiation\nSubclass Student()\
  \ Instantiation\nParent Person(String name, age) instantiated\nSubclass Student(String\
  \ name, age) Isacc instantiated\nPerson can speaking\n\n# 方法重写\n\n重写：子类重写了父类的方法，子类的实例将调用子类的方法，而不是调用父类的方法。\n\
  \n![](img/Image00039.jpg)\n\n1. 创建文件：`TestOverride.java`\n\n```java\nclass Person\
  \ {\n    public void say() {\n        System.out .println(\"Person speaking\");\n\
  \    }\n}\n\nclass ChineseStudent extends Person {\n    public void say() {\n  \
  \      System.out .println(\"Speak Chinese\");\n    }\n}\n\nclass AmericaStudent\
  \ extends Person {\n    public void say() {\n        System.out .println(\"Speak\
  \ English\");\n    }\n}\n\npublic class TestOverride {\n    public static void main(String[]\
  \ args) {\n        ChineseStudent s = new ChineseStudent();\n        s.say();\n\
  \        AmericaStudent as = new AmericaStudent();\n        as.say();\n    }\n}\n\
  ```\n结果：\nSpeak Chinese\nSpeak English\n\n# Java 线程\n\n线程：是程序内部单一的顺序控制流。CPU 会为每个线程分配一段时间时间来执行。\n\
  汽车和火车同时运行\n\n![](img/Image00040.jpg)\n\n1. 创建文件：`TestThread.java`\n创建 2 个线程类：`CarThread`\
  \ 扩展 `Thread`，`TrainThread` 扩展 `Thread`\n`start()`：启动一个线程，然后会自动调用 `run()`。\n\n```java\n\
  class CarThread extends Thread {\n    @Override\n    public void run() {\n     \
  \   for (int i=0; i<5;i++) {\n            System.out .println(\"Car Thread Run \"\
  \ + i);\n            try {\n                Thread.sleep (200);\n            } catch\
  \ (InterruptedException e) {\n                e.printStackTrace();\n           \
  \ }\n        }\n    }\n}\n\nclass TrainThread extends Thread {\n    @Override\n\
  \    public void run() {\n        for (int i=0; i<5;i++) {\n            System.out\
  \ .println(\"Train Thread Run \" + i);\n            try {\n                Thread.sleep\
  \ (200);\n            } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n        }\n    }\n}\n\npublic class TestThread {\n    public static\
  \ void main(String[] args) {\n        CarThread carThread = new CarThread();\n \
  \       carThread.start();\n        TrainThread trainThread = new TrainThread();\n\
  \        trainThread.start();\n    }\n}\n```\n输出结果：\nCar Thread Run 0\nTrain Thread\
  \ Run 0\nCar Thread Run 1\nTrain Thread Run 1\nCar Thread Run 2\nTrain Thread Run\
  \ 2\nCar Thread Run 3\nTrain Thread Run 3\nCar Thread Run 4\nTrain Thread Run 4\n\
  从结果可以看出，两个线程是交替执行的。\n\n# Canvas 进度条\n\nCanvas：用于在屏幕上绘制图形，我们可以继承 `JPanel`\n\n![](img/Image00041.jpg)\n\
