  \ 如果 `expression` 继续执行，否则退出循环。\n\n## 1. 创建文件：`WhileLoop.java`\n\n```java\npublic\
  \ class WhileLoop {\n    public static void main(String[] args) {\n        int i\
  \ = 0;\n        while (i < 10) { //如果 (i<10) 真执行循环，否则终止\n            System.out\
  \ .println(i);\n            i = i + 1;\n        }\n    }\n}\n```\n结果：0123456789\n\
  \n# while 循环游戏\n\n模拟游戏：\n`while ( num != 0 )`\n`if num 等 1`: 西瓜\n`else if num 等\
  \ 2`: 香蕉\n`else if num 等 3`: 桃子\n`else if num 等 0`: 游戏结束\n\n## 1. 创建 `WhileLoopGames.java`\n\
  \n```java\nimport java.util.Scanner;\npublic class WhileLoopGames {\n    public\
  \ static void main(String[] args) {\n        System.out .println(\"键盘输入 1: 西瓜, 2:\
  \ 香蕉, 3: 桃子, 0: 雷电\" );\n        Scanner in = new Scanner(System.in );\n       \
  \ int num = 0;\n        while (num != -1) { //如果你输入 -1 则终止游戏\n            num =\
