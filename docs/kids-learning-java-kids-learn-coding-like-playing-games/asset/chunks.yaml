    \n## 3. 创建一个类 `Ball`，通过构造方法传递 `x, y, r, color`，然后创建一个方法 `draw(Graphics g)` 在画布上画\
    \ 1 个圆。![](img/Image00048.jpg)\n`g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING,\
    \ RenderingHints.VALUE_ANTIALIAS_ON)`: 开启 `ANTIALIASING` 以绘制出良好的圆。\n\n```java\n\
    import java.awt.*;\nimport javax.swing.*;\nclass Ball{\n    private int x ;\n\
