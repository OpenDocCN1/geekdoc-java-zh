  trans: "\n\n![](img/Image00000.jpg)\n\n# 少年学 Java\n\n![](img/Image00002.jpg) 杨虎\n\
    \nJava 是一种强大的编程语言，简单易学且有趣！孩子们学习 Java 就像玩游戏一样，这本书为 10 岁以上的儿童教授 Java 核心技能，并逐步引导他们了解编码。在书结束时，孩子们可以创建自己的应用程序和游戏。\n\
    \n[`en.verejava.com`](http://en.verejava.com)\n版权 © 2020 杨虎 版权所有。\nISBN : 979863862462\n\
    \n## 目录\n\n1. Java JDK 安装\n2. 创建第一个 Java 代码，然后点击菜单 -> Run As Java Application\n\
    \n## 2. Java 基础概念\n\n1. 在 Eclipse 中创建文件：`HelloWorld.java`\n```\npublic class HelloWorld\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello World\");\n        System.out.print(\"Good beginning \\t\");\n        System.out.print(\"\
    is the half of success\");\n    }\n}\n```\n`System.out.println()`：将消息打印到控制台并换行\n\
    `System.out.print()`：将消息打印到控制台但不换行\n`\\t`：制表符\n`main(String[] args)`：程序开始执行的入口\n\
    \n### 2.1 HelloWorld 详解\n\n1. 创建文件：`Variable.java`\n`Variable`：系统分配用于存储数据的内存区域。\n\
    `String`：字符序列，如 `\"Apple\"`\n```\npublic class Variable {\n    public static void\
    \ main(String[] args) {\n        String basket = \"Apple\";\n        System.out.println(basket);\n\
    \    }\n}\n```\n结果：Apple\n\n### 2.2 变量\n\n2. 将变量 `basket` 的值从 `\"Apple\"` 改为 `\"\
    Orange\"`\n```\npublic class Variable {\n    public static void main(String[]\
    \ args) {\n        String basket = \"Apple\";\n        System.out.println(basket);\n\
    \        basket = \"Orange\";\n        System.out.println(basket);\n    }\n}\n\
    ```\n结果：Apple Orange\n\n## 3. 算术运算符\n\n1. 在 Eclipse 中创建文件：`ArithmeticOperator.java`\n\
    `int`：整数类型，可以存储正负的非小数数字。\n算术运算：`+`, `-`, `*`, `/`\n```\npublic class ArithmeticOperator\
    \ {\n    public static void main(String[] args) {\n        int a = 1;\n      \
    \  int b = 2;\n        int c = 3;\n        System.out.println(a + b);\n      \
    \  System.out.println(a - b);\n        System.out.println(a * b);\n        System.out.println(a\
    \ / b);\n        System.out.println(c % b); // a / b 后的余数\n    }\n}\n```\n结果：3\
    \ -121\n\n### 3.1 算术运算符\n\n### 3.2 方法\n\n1. 添加 3 个更多关于 `-`、`*`、`/` 的方法\n```java\n\
    public class ArithmeticOperator {\n    public static int add(int a, int b){\n\
    \        return a + b;\n    }\n    public static int sub(int a, int b){\n    \
    \    return a - b;\n    }\n    public static int multiply(int a, int b){\n   \
    \     return a * b;\n    }\n    public static int divide(int a, int b){\n    \
    \    return a / b;\n    }\n    public static void main(String[] args) {\n    \
    \    int result = add(4, 2); // 调用 add 方法\n        System.out.println(result);\
    \ // 6\n        result = sub(4, 2);\n        System.out.println(result); // 2\n\
    \        result = multiply(4, 2);\n        System.out.println(result); // 8\n\
    \        result = divide(4, 2);\n        System.out.println(result); // 2\n  \
    \  }\n}\n```\n结果：6282\n\n### 3.3 类\n\n`class`：是用户定义的蓝图或原型，根据它创建对象。\n```\nclass\
    \ {\n    public static int add(int a, int b){\n        return a + b;\n    }\n\
    \    public static int sub(int a, int b){\n        return a - b;\n    }\n    public\
    \ static int multiply(int a, int b){\n        return a * b;\n    }\n    public\
    \ static int divide(int a, int b){\n        return a / b;\n    }\n    public static\
    \ void main(String[] args) {\n        int result = add(4, 2); // 调用 add 方法\n \
    \       System.out.println(result); // 6\n        result = sub(4, 2);\n      \
    \  System.out.println(result); // 2\n        result = multiply(4, 2);\n      \
    \  System.out.println(result); // 8\n        result = divide(4, 2);\n        System.out.println(result);\
    \ // 2\n    }\n}\n```\n（注：此处示例原文代码结构略有混乱，翻译已按逻辑保留代码块内容）\n\n"
