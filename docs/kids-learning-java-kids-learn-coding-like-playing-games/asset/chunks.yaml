    \        frame.setVisible(true );\n    }\n}\n\n## 5. 小球向上和向下![](img/Image0050.jpg)\n\
    \n```java\nimport java.awt.*;\nimport javax.swing.*;\nclass Ball{\n    private\
    \ int x ;\n    private int y ;\n    private int r ;\n    private Color color ;\n\
    \    public Ball( int x, int y, int r, Color color){\n        this .x = x;\n \
    \       this .y = y;\n        this .r = r;\n        this .color = color;\n   \
    \ }\n    public void draw(Graphics g){\n        Graphics2D g2=(Graphics2D)g;\n\
    \        g2.setRenderingHint(RenderingHints.KEY_ANTIALIASING , RenderingHints.VALUE_ANTIALIAS_ON\
    \ );\n        g2.setColor(this .color );\n        g2.fillOval(this .x ,this .y\
    \ ,2*this .r ,2*this .r );\n    }\n    public void move(int distance){\n     \
    \   this .y = this .y + distance;\n    }\n}\nclass Canvas extends JPanel{\n  \
    \  protected Ball ball ;\n    private boolean isRun = true ;\n    private int\
    \ canvasWidth = 200;\n    private int canvasHeight = 300;\n    CanvasThread CanvasThread\
    \ ;\n    public Canvas(){\n        this .setLayout(null );\n        this .setBackground(Color.WHITE\
    \ );\n        ball =new Ball(50,50,30,Color.BLUE );\n        CanvasThread =new\
    \ CanvasThread();\n        CanvasThread .start();\n    }\n    protected void paintComponent(Graphics\
    \ g){\n        canvasWidth = this.getWidth();\n        canvasHeight = this.getHeight();\n\
    \        super .paintComponent(g);\n        g.clearRect(0, 0, canvasWidth, canvasHeight);\n\
    \        ball .draw(g);\n    }\n}\n class CanvasThread extends Thread{\n    @Override\n\
    \    public void run() {\n        String direction = \"down\";\n        while\
    \ (isRun ){\n            try {\n                if (ball.getY() <= canvasHeight\
    \ && direction.equals(\"down\")){\n                    ball.move(10);\n      \
    \          } else {\n                    direction = \"up\";\n               \
    \ }\n                if (ball.getY() >= 0 && direction.equals(\"up\")){\n    \
    \                ball.move(-10);\n                } else {\n                 \
    \   direction = \"down\";\n                }\n                Canvas.this .repaint();\n\
    \                Thread.sleep (200);\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\npublic class BallGame {\n    public static void main(String[] args) {\n   \
    \     JFrame frame = new JFrame(\"GUI Canvas Application\" );\n        Canvas\
    \ canvas = new Canvas();\n        frame.add(canvas);\n        frame.setSize(200,300);\n\
    \        frame.setVisible(true );\n    }\n}\n```\n\n## 创建类\nJava 是一种面向对象的编程语言。Java\
    \ 中的几乎一切都是对象，拥有自己的属性和方法。类就像对象的构造器。在游戏中，飞机、子弹、炸弹和敌机被称为 `Sprite`。![](img/Image0051.jpg)\n\
    \n### 1. 创建文件 `TestSprite.java`\n\n```java\n// 定义一个 Sprite 类\nclass Sprite {\n\
    \    // 定义类的属性\n    String name = \"\" ;\n    String color = \"\" ;\n    // 定义必须包含\
    \ self 的方法\n    public void draw() {\n        String text = this .color + \" \"\
    \ + this .name + \"�is drawn on canvas\" ;\n        System.out .println(text);\n\
    \    }\n}\npublic class TestSprite {\n    public static void main(String[] args)\
    \ {\n        // 实例化名称为 sprite 的对象\n        Sprite sprite = new Sprite();\n   \
    \     // 使用 sprite 访问属性和方法\n        sprite.name = \"Airplane\" ;\n        sprite.color\
    \ = \"Blue\" ;\n        sprite.draw();\n        sprite.name = \"Airplane\" ;\n\
    \        sprite.color = \"Red\" ;\n        sprite.draw();\n        sprite.name\
    \ = \"Bullet\" ;\n        sprite.color = \"Blue\" ;\n        sprite.draw();\n\
    \        sprite.name = \"Bullet\" ;\n        sprite.color = \"Red\" ;\n      \
    \  sprite.draw();\n    }\n}\n```\n\n**输出：**\nBlue Airplane is drawn on canvas\n\
    Red Airplane is drawn on canvas\nBlue Bullet is drawn on canvas\nRed Bullet is\
    \ drawn on canvas\n\n### 构造方法\n构造方法：创建对象时会被自动调用。\n\n### 2. 创建文件 `TestConstructor.java`\n\
    \n```java\nclass Sprite {\n    String name = \"\" ;\n    String color = \"\" ;\n\
    \    public Sprite(String name, String color) {\n        this .name = name;\n\
    \        this .color = color;\n    }\n    public void draw() {\n        String\
    \ text = this .color + \" \" + this .name + \" is drawn on canvas\" ;\n      \
    \  System.out .println(text);\n    }\n}\npublic class TestConstructor {\n    public\
    \ static void main(String[] args) {\n        // 实例化对象构造会被自动调用\n        Sprite\
    \ blueSprite = new Sprite(\"Airplane\", \"Blue\");\n        blueSprite.draw();\n\
    \        Sprite redSprite = new Sprite(\"Bullet\", \"Red\");\n        redSprite.draw();\n\
    \    }\n}\n```\n\n"
- fmt: "\n# Result\nResult:`Blue Airplane` is drawn on canvas.\nResult:`Blue Bullet`\
    \ is drawn on canvas.\n\n# Inheritance\nAll Class `EnemyPlane`, `BluePane`, `RedPlane`,\
    \ `Bullet` inherit from `Sprite1`. `Sprite` is called `Parent Class`. `EnemyPlane`,\
    \ `BluePane`, `RedPlane`, `Bullet` are called `Child Class`. `Child Class` can\
    \ call the properties and method from `Parent Class`.\n\n![](Image00052.jpg)\n\
    \n## 1. Create file: `TestInheritance.java`\n\n```java\nclass Sprite {\n    private\
    \ String name = \"\" ;\n    private String color = \"\" ;\n    public Sprite(String\
    \ name, String color){\n        this .name = name;\n        this .color = color;\n\
    \    }\n    public void draw() {\n        String text = this .color + \" \" +\
    \ this .name + \"  is drawn on canvas\" ;\n        System.out .println(text);\n\
    \    }\n}\nclass BluePlane extends Sprite{\n    public BluePlane(String name,\
    \ String color) {\n        super (name, color);\n    }\n}\nclass RedPlane extends\
    \ Sprite{\n    public RedPlane(String name, String color) {\n        super (name,\
    \ color);\n    }\n}\nclass Bullet extends Sprite{\n    public Bullet(String name,\
    \ String color) {\n        super (name, color);\n    }\n}\npublic class TestInheritance{\n\
    \    public static void main(String[] args) {\n        BluePlane bluePlane = new\
    \ BluePlane(\"Airplane\" ,\"Blue\" );\n        bluePlane.draw();\n        RedPlane\
    \ redPlane = new RedPlane(\"Airplane\" ,\"Red\" );\n        redPlane.draw();\n\
    \        Bullet redBullet= new Bullet(\"Bullet\" ,\"Red\" );\n        redBullet.draw();\n\
    \    }\n}\n```\n\n# Result\nResult:`Blue Airplane` is drawn on canvas.\nResult:`Red\
    \ Airplane` is drawn on canvas.\nResult:`Red Bullet` is drawn on canvas.\n\n#\
    \ Override\nOverride:the child class overrides the method of the parent class,\
    \ the instance of the child class will call the overrided method.\n`Sprite` can\
    \ fire bullet, but `BluePlane` can fire blue bullet and `RedPlane` can fire red\
    \ bullet.\n\n![](Image00053.jpg)\n\n## 1. Create file: `TestOverride.java`\n\n\
    ```java\nclass Sprite{\n    public void shoot(){\n        System.out .println(\"\
    fire bullet\" );\n    }\n}\n// BluePlane Inherit Sprite\nclass BluePlane extends\
    \ Sprite{\n    public void  shoot(){\n        System.out .println(\"BluePlane\
    \ fire blue bullet\" );\n    }\n}\n// RedPlane Inherit Sprite\nclass RedPlane\
    \ extends Sprite{\n    public void  shoot(){\n        System.out .println(\"RedPlane\
    \ fire red bullet\" );\n    }\n}\npublic class TestOverride{\n    public static\
    \ void main(String[] args) {\n        BluePlane bluePlane = new BluePlane();\n\
    \        bluePlane.shoot();\n        RedPlane redPlane = new RedPlane();\n   \
    \     redPlane.shoot();\n    }\n}\n```\n\n# Result\nResult:`BluePlane fire blue\
    \ bullet`\nResult:`RedPlane fire red bullet`\n\n# Airplane Game\n## 1. Draw a\
    \ image on canvas.\n### 1.1 put the 2 plane image to directory `images/blue_plane.png`,\
    \ `images/red_plane.png`\n![](Image00054.jpg) ![](Image00055.jpg)\n### 1.2 draw\
    \ `images/blue_plane.png`, `images/red_plane.png` on canvas.\n![](Image00056.jpg)\n\
    \nAll images in `KidsLearningJavascript.zip` please find download from this link:[[http://en.verejava.com/download.jsp?id=1`]\n\
    \n## 2. Create a `AirplaneGame.java`\n- `new File(imagePath)`: create a file object\
    \ by image path.\n- `ImageIO.read(file)`: read a image file save to `BufferedImage`.\n\
    - `g.drawImage(image, x, y, null)`: draw a image to canvas.\n\n```java\nimport\
    \ java.awt.image.BufferedImage;\nimport java.awt.*;\nimport java.io.*;\nimport\
    \ javax.imageio.ImageIO;\nimport javax.swing.*;\nclass Canvas extends JPanel {\n\
    \    public Canvas() {\n        this .setLayout(null );\n        this .setBackground(Color.WHITE\
    \ );\n    }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        BufferedImage blueImage=loadImage(\"images/blue_plane.png\" );\n    \
    \    g.drawImage(blueImage, 50, 200, null );\n        BufferedImage redImage=loadImage(\"\
    images/red_plane.png\" );\n        g.drawImage(redImage, 150, 200, null );\n \
    \   }\n    public BufferedImage loadImage(String imagePath) {\n        File file\
    \ = new File(imagePath);\n        BufferedImage bufferedImage = null ;\n     \
    \   try {\n            bufferedImage = ImageIO.read (file);\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n        return bufferedImage;\n\
    \    }\n}\npublic class AirplaneGame {\n    public static void main(String[] args)\
    \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\" );\n       \
    \ Canvas canvas = new Canvas();\n        frame.add(canvas, BorderLayout.CENTER\
    \ );\n        frame.setSize(300, 300);\n        frame.setVisible(true );\n   \
    \ }\n}\n```\n\n## 3. Create `Airplane` class and then create draw method to create\
    \ image on canvas.\n![](Image00057.jpg)\n\n```java\nimport java.awt.*;\nimport\
    \ java.awt.image.BufferedImage;\nimport java.io.*;\nimport javax.imageio.ImageIO;\n\
    import javax.swing.*;\nclass Airplane{\n    protected int x ;\n    protected int\
    \ y ;\n    protected BufferedImage image ;\n    public Airplane(int x, int y,\
    \ BufferedImage image){\n        this .x = x;\n        this .y = y;\n        this\
    \ .image = image;\n    }\n    public void draw(Graphics g){\n        g.drawImage(image\
    \ , this .x , this .y , null );\n    }\n}\nclass Canvas extends JPanel {\n   \
    \ public Canvas() {\n        this .setLayout(null );\n        this .setBackground(Color.WHITE\
    \ );\n    }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        BufferedImage blueImage=loadImage(\"images/blue_plane.png\" );\n    \
    \    Airplane bluePlane = new Airplane(50, 200, blueImage);\n        bluePlane.draw(g);\n\
    \        BufferedImage redImage=loadImage(\"images/red_plane.png\" );\n      \
    \  Airplane redPlane = new Airplane(150, 200, redImage);\n        redPlane.draw(g);\n\
    \    }\n    public BufferedImage loadImage(String imagePath) {\n        File file\
    \ = new File(imagePath);\n        BufferedImage bufferedImage = null ;\n     \
    \   try {\n            bufferedImage = ImageIO.read (file);\n        } catch (IOException\
    \ e) {\n            e.printStackTrace();\n        }\n        return bufferedImage;\n\
    \    }\n}\npublic class AirplaneGame {\n    public static void main(String[] args)\
    \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\" );\n       \
    \ Canvas canvas = new Canvas();\n        frame.add(canvas, BorderLayout.CENTER\
    \ );\n        frame.setSize(300, 300);\n        frame.setVisible(true );\n   \
    \ }\n}\n```\n\n# 4. Keypress Event\n### 4.1 Add key listener `addKeyListener`\
    \ in `Canvas`\nIf click up, down, left, right key the method `keyPressed(KeyEvent\
    \ e)` will be invoked.\n- `static Canvas canvas`: If the `keyPressed` event takes\
    \ effect, it needs to be set to `static`.\n- `canvas.requestFocus()`: If the `keyPressed`\
    \ event takes effect, the focus needs to be obtained.\n![](Image00058.jpg)\n\n\
    ```java\nimport java.awt.*;\nimport java.awt.event.*;\nimport java.io.*;\nimport\
    \ javax.imageio.ImageIO;\nimport javax.swing.*;\nclass Canvas extends JPanel {\n\
    \    public Canvas() {\n        this .setLayout(null );\n        this .setBackground(Color.WHITE\
    \ );\n        this . requestFocus();\n        this .addKeyListener(new KeyAdapter()\
    \ {\n            public void keyPressed(KeyEvent e) {\n                int keyCode\
    \ = e.getKeyCode();\n                if (keyCode == KeyEvent.VK_UP){\n       \
    \             System.out .println(\"up\" );\n                } else if (keyCode\
    \ == KeyEvent.VK_DOWN){\n                    System.out .println(\"down\" );\n\
    \                } else if (keyCode == KeyEvent.VK_RIGHT){\n                 \
    \   System.out .println(\"right\" );\n                } else if (keyCode == KeyEvent.VK_LEFT){\n\
    \                    System.out .println(\"left\" );\n                }\n    \
    \        }\n        });\n    }\n    protected void paintComponent(Graphics g)\
    \ {\n        super .paintComponent(g);\n    }\n}\npublic class AirplaneGame {\n\
    \    private static Canvas canvas ;\n    public static void main(String[] args)\
    \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\" );\n       \
    \ canvas = new Canvas();\n        frame.add(canvas , BorderLayout.CENTER );\n\
    \        frame.setSize(300, 300);\n        frame.setVisible(true );\n        canvas\
    \ .requestFocus();\n    }\n}\n```\n\n## 2. Click Up, Down, Left, Right Key to\
    \ move airplane on canvas.\n![](Image00059.jpg)\n"
