    \        frame.setVisible(true );\n    }\n}\n```\n\n### 2. 将数组名称填入按钮中，并添加按钮点击事件，如果按钮名称为\
    \ 1 则变为 * *，如果按钮名称为 2 则变为 Dog![](img/Image00032.jpg)\n\n1:      `*`\n2:      `Dog`\n\
    \n`String.equals(String str)`：根据字符串的内容比较两个两个字符串\n\n```java\nimport java.awt.GridLayout;\n\
    import java.awt.event.*;\nimport javax.swing.*;\npublic class FindDogGame {\n\
    \    public static void main(String[] args) {\n        JFrame frame = new JFrame(\"\
    Java GUI Application\" );\n        final int [][]  maps ={{ 1, 1, 1, 1 },{ 1,\
    \ 1, 1, 1 },{ 1, 2, 1, 1 },{ 1, 1, 1, 1 }};\n        frame.setLayout(new GridLayout(4,4));\n\
    \        for (int i = 0; i < maps.length ; i++) {\n            for (int j = 0;\
    \ j < maps[i].length ; j++) {\n                final JButton button = new JButton();\n\
    \                button.setName(Integer.toString (maps[i][j]));\n            \
    \    frame.add(button);\n                button.addActionListener(new ActionListener(){\n\
    \                    @Override\n                    public void actionPerformed(ActionEvent\
