    ![](img/Image00066.jpg)\n\n#### 7.1 子弹与敌机碰撞\n当两张图片中心坐标之差的绝对值小于它们宽度和高度一半之和时，我们认为它们发生了交集并产生了碰撞。\n\
    ![](img/Image00067.jpg)\n\n"
