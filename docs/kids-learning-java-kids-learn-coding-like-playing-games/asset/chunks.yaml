    \ y1, x2, y2)`: takes four integers that represent the start (`x1, y1`) and end\
    \ (`x2, y2`) coordinate of the line.\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\
    \nclass Canvas extends JPanel {\n    public Canvas() {\n        this .setLayout(null);\n\
    \        this .setBackground(Color.WHITE);\n    }\n    protected void paintComponent(Graphics\
    \ g) {\n        super .paintComponent(g);\n        g.drawLine(50, 50, 200, 50);\n\
    \    }\n}\n```\n3. Draw a Rectangle on `Canvas`\n![](Image00043.jpg)\n`g.drawRect(x,\
    \ y, width, height)`: draw a rectangle on the canvas.\n\n```java\nimport java.awt.*;\n\
    import javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n\
    \        this .setLayout(null);\n        this .setBackground(Color.WHITE);\n \
    \   }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.drawRect(50, 50, 100, 50);\n    }\n}\n```\n4. Fill a Rectangle on `Canvas`\n\
    ![](Image00044.jpg)\n`g.fillRect(x, y, width, height)`: fill a rectangle on the\
    \ canvas.\n`g.setColor(Color c)`: the color (`Color.RED`, `Color.GREEN`, `Color.BLUE`).\n\
    \n```java\nimport java.awt.*;\nimport javax.swing.*;\n\nclass Canvas extends JPanel\
    \ {\n    public Canvas() {\n        this .setLayout(null);\n        this .setBackground(Color.WHITE);\n\
    \    }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.setColor(Color.RED);\n        g.fillRect(50, 50, 100, 50);\n      \
    \  g.setColor(Color.GREEN);\n        g.fillRect(160, 50, 100, 50);\n        g.setColor(Color.BLUE);\n\
    \        g.fillRect(270, 50, 100, 50);\n    }\n}\n```\n4. Draw Progress Bar Animation\n\
    4.1. Draw an empty rectangle first\n4.2. fill a solid rectangle, open a Thread\
    \ `ProgressBarThread` the width increasing by 10 every 200 milliseconds until\
    \ `width=150`\n\n![](Image00045.jpg)\n`repaint()`: holds instructions to paint\
    \ this component, the `paintComponent(Graphics g)` will be called automatically\
    \ to repaint.\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\nclass Canvas\
    \ extends JPanel {\n    int width = 0;\n    public Canvas() {\n        this .setLayout(null);\n\
    \        this .setBackground(Color.WHITE);\n        new ProgressBarThread().start();\n\
    \    }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.drawRect(50, 50, 150, 50);\n        g.setColor(Color.RED);\n      \
    \  g.fillRect(50, 50, width, 50);\n    }\n}\n\nclass ProgressBarThread extends\
    \ Thread {\n    @Override\n    public void run() {\n        while (width < 150)\
    \ {\n            width = width + 10;\n            try {\n                Thread.sleep\
    \ (200);\n                Canvas.this .repaint();\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n```\n"
