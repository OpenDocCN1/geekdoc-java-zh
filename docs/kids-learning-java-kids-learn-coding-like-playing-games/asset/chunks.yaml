    # Canvas 进度条\n\nCanvas：用于在屏幕上绘制图形，我们可以继承 `JPanel`\n\n![](img/Image00041.jpg)\n\
    \n1. 创建 `ProgressBar.java`\n`Canvas` 扩展 `JPanel`：`Canvas` 继承自 `JPanel`\n`this.setLayout(null)`：必须设置布局为\
    \ null\n`this.setBackground(Color c)`：在 `JPanel` 中设置背景颜色\n\n```java\nimport java.awt.*;\n\
    import javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n\
    \        this .setLayout(null);\n        this .setBackground(Color.WHITE);\n \
    \   }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \    }\n}\n\npublic class ProgressBar {\n    public static void main(String[]\
    \ args) {\n        JFrame frame = new JFrame(\"GUI Canvas Application\");\n  \
    \      Canvas canvas = new Canvas();\n        frame.add(canvas);\n        frame.setSize(300,200);\n\
    \    }\n}\n```\n2. 在 `Canvas` 上画一条线\n![](img/Image00042.jpg)\n`g.drawLine(x1,\
    \ y1, x2, y2)`：接收四个整数表示起点 `x1, y1` 和终点 `x2, y2` 的坐标。\n\n```java\nimport java.awt.*;\n\
    import javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n\
    \        this .setLayout(null);\n        this .setBackground(Color.WHITE);\n \
    \   }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.drawLine(50, 50, 200, 50);\n    }\n}\n```\n3. 在 `Canvas` 上画一个矩形\n![](img/Image00043.jpg)\n\
    `g.drawRect(x, y, width, height)`：在画布上绘制矩形。\n\n```java\nimport java.awt.*;\nimport\
    \ javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n   \
    \     this .setLayout(null);\n        this .setBackground(Color.WHITE);\n    }\n\
    \    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.drawRect(50, 50, 150, 50);\n    }\n}\n```\n4. 在 `Canvas` 上填充一个矩形\n\
    ![](img/Image00044.jpg)\n`g.fillRect(x, y, width, height)`：填充画布上的矩形。\n`g.setColor(Color\
    \ c)`：设置颜色（`Color.RED`、`Color.GREEN`、`Color.BLUE`）。\n\n```java\nimport java.awt.*;\n\
    import javax.swing.*;\n\nclass Canvas extends JPanel {\n    public Canvas() {\n\
    \        this .setLayout(null);\n        this .setBackground(Color.WHITE);\n \
    \   }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \    }\n}\n```\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\nclass\
    \ Canvas extends JPanel {\n    public Canvas() {\n        this .setLayout(null);\n\
    \        this .setBackground(Color.WHITE);\n    }\n    protected void paintComponent(Graphics\
    \ g) {\n        super .paintComponent(g);\n        g.setColor(Color.RED);\n  \
    \      g.fillRect(50, 50, 100, 50);\n    }\n}\n```\n4. 绘制进度条动画\n4.1. 先画一个空矩形\n\
    4.2. 填充一个实矩形，开启一个线程 `ProgressBarThread`，宽度每 200 毫秒增加 10，直到 `width=150`\n\n![](img/Image00045.jpg)\n\
    `repaint()`：持有重绘此组件的指令，`paintComponent(Graphics g)` 将自动调用以重绘。\n\n```java\nimport\
    \ java.awt.*;\nimport javax.swing.*;\n\nclass Canvas extends JPanel {\n    int\
    \ width = 0;\n    public Canvas() {\n        this .setLayout(null);\n        this\
    \ .setBackground(Color.WHITE);\n        new ProgressBarThread().start();\n   \
    \ }\n    protected void paintComponent(Graphics g) {\n        super .paintComponent(g);\n\
    \        g.drawRect(50, 50, 150, 50);\n        g.setColor(Color.RED);\n      \
    \  g.fillRect(50, 50, width, 50);\n    }\n}\n\nclass ProgressBarThread extends\
    \ Thread {\n    @Override\n    public void run() {\n        while (width < 150)\
    \ {\n            width = width + 10;\n            try {\n                Thread.sleep\
    \ (200);\n                Canvas.this .repaint();\n            } catch (InterruptedException\
    \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
    }\n```\n\n"
