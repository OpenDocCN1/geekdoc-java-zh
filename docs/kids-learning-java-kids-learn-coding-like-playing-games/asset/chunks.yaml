    \ HU\n\nJava is a powerful programming language that’s easy to learn and fun to\
    \ use! Kids learning Java like playing games, this book teaches main Java skills\
    \ to kids ages 10+ and step-by-step guidance to know coding. By the end of the\
    \ book kids can create own application and games.\n\n[http://en.verejava.com](http://en.verejava.com)\n\
    Copyright © 2020 Yang Hu All rights reserved.\nISBN : 979863862462\n\n## Table\
    \ of Contents\n\n1. [Java JDK Installation](#\n2. [Basic Concepts of Java](#\n\
    \    - 2.1 [HelloWorld Explanation](#\n    - 2.2 [Variable](#\n3. [Arithmetic\
