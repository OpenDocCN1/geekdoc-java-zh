    ```\n\n# 逻辑运算符\n\n逻辑运算符：`与` (`&&`)，`或` (`||`)，`非` (`!`)\n\n1. `&&` 如果操作的两边都为 `true`\
    \ 则返回 `true`，否则返回 `false`\n2. `||` 当操作的两边都为 `false` 时结果为 `false`，否则为 `true`\n\
    3. `!` 如果返回 `true`，结果为 `false`，否则为 `true`\n\n## 1. 创建 `LogicalOperator.java`\n\
    \n```java\npublic class LogicalOperator {\n    public static void main(String[]\
    \ args) {\n        System.out .println(true && false ); // = false\n        System.out\
    \ .println(false && true ); // = false\n        System.out .println(false && false\
    \ ); // = false\n        System.out .println(true && true ); // = true\n     \
    \   System.out .println(\"---------------\");\n        System.out .println(true\
    \ || false ); // = true\n        System.out .println(false || true ); // = true\n\
    \    }\n}\n```\n## 2. 创建 `LogicalOperator2.java`\n\n```java\npublic class LogicalOperator2\
    \ {\n    public static void main(String[] args) {\n        System.out .println(true\
    \ && false ); // = false\n        System.out .println(false && true ); // = false\n\
    \        System.out .println(false && false ); // = false\n        System.out\
    \ .println(true && true ); // = true\n        System.out .println(\"---------------\"\
    );\n        System.out .println(true || false ); // = true\n        System.out\
    \ .println(false || true ); // = true\n    }\n}\n```\n## 3. 创建 `PocketMoneyGUI.java`\n\
    \n输入分数：\n`if score == 5`: 优秀\n`else if score == 4`: 良好\n`else`: 需要努力追赶\n\n```java\n\
    import java.awt.GridLayout;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    public class PocketMoneyGUI {\n    public static void main(String[] args) {\n\
    \        JFrame frame = new JFrame(\"Java GUI Application\" );\n        final\
    \ JLabel scoreLabel = new JLabel(\"Please input your score:\" );\n        final\
    \ JTextField scoreTextField = new JTextField();\n        final JLabel resultLabel\
    \ = new JLabel(\"\" );\n        JButton submitButton = new JButton(\"Submit\"\
    \ );\n        submitButton.addActionListener(new ActionListener(){\n         \
    \   @Override\n            public void actionPerformed(ActionEvent e) {\n    \
    \            int score = Integer.parseInt (scoreTextField.getText());\n      \
    \          if (score == 5){\n                    resultLabel.setText(\"Excellent\"\
    \ );\n                }else if (score == 4){\n                    resultLabel.setText(\"\
    Good\" );\n                }else {\n                    resultLabel.setText(\"\
    Need to catch up\" );\n                }\n            }\n        });\n       \
    \ frame.setLayout(new GridLayout(2,2));\n        frame.add(scoreLabel);\n    \
