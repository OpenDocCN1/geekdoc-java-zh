    \ 子弹从飞机的顶部中心位置射出\n![](img/Image00060.jpg)\n\n#### 5.2 启动一个 `CanvasThread` 让子弹向上移动\n\
    当子弹移出画布范围时，需要通过设置 `visible = false` 将子弹销毁，子弹可以重新发射。\n![](img/Image00061.jpg)\n\
    \n#### 5.3 飞机和子弹继承自 `Sprite` 以实现复用。\n![](img/Image00062.jpg)\n\n### 6. 敌机持续向下移动。\n\
    \n#### 6.1 敌机随机从画布顶部开始并向下移动\n![](img/Image00063.jpg)\n\n#### 6.2 保持敌机持续向下移动\n\
