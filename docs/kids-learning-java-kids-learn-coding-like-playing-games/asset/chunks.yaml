    ## 1. JDK Installation\n\n1. installation steps please click below link: [http://en.verejava.com/?id=22728879587](http://en.verejava.com/?id=22728879587)\n\
    2. Create First Java Code and then click menu -> Run As Java Application\n\n##\
    \ 2. Basic Concepts of Java\n\n1. Create file: `HelloWorld.java` in Eclipse\n\
    ```\npublic class HelloWorld {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello World\");\n        System.out.print(\"Good\
    \ beginning \\t\");\n        System.out.print(\"is the half of success\");\n \
    \   }\n}\n```\n`System.out.println()`: Print message to the console and wrap a\
    \ new line\n`System.out.print()`: Print message to the console, but not wrap a\
    \ new line\n`\\t`: tab\n`main(String[] args)`: the entry that Program start to\
    \ execute\n\n### 2.1 HelloWorld Explanation\n\n1. Create file: `Variable.java`\n\
    `Variable`: a memory area allocated by the system to store data.\n`String`: a\
    \ sequence of characters like `\"Apple\"`\n```\npublic class Variable {\n    public\
    \ static void main(String[] args) {\n        String basket = \"Apple\";\n    \
    \    System.out.println(basket);\n    }\n}\n```\nResult: Apple\n\n### 2.2 Variable\n\
    \n2. Replace the value of variable `basket` from `\"Apple\"` to `\"Orange\"`\n\
    ```\npublic class Variable {\n    public static void main(String[] args) {\n \
    \       String basket = \"Apple\";\n        System.out.println(basket);\n    \
    \    basket = \"Orange\";\n        System.out.println(basket);\n    }\n}\n```\n\
    Result: Apple Orange\n\n## 3. Arithmetic Operator\n\n1. Create file: `ArithmeticOperator.java`\
    \ in Eclipse\n`int`: An integer type that can hold a positive or negative non-decimal\
    \ number.\nArithmetic operation: `+`, `-`, `*`, `/`\n```\npublic class ArithmeticOperator\
    \ {\n    public static void main(String[] args) {\n        int a = 1;\n      \
    \  int b = 2;\n        int c = 3;\n        System.out.println(a + b);\n      \
    \  System.out.println(a - b);\n        System.out.println(a * b);\n        System.out.println(a\
    \ / b);\n        System.out.println(c % b); // remain number after a / b\n   \
    \ }\n}\n```\nResult: 3 -121\n\n### 3.1 Arithmetic Operator\n\n### 3.2 Method\n\
    \n1. Add 3 more methods about `-`, `*`, `/`\n```\npublic class ArithmeticOperator\
    \ {\n    public static int add(int a, int b){\n        return a + b;\n    }\n\
    \    public static int sub(int a, int b){\n        return a - b;\n    }\n    public\
    \ static int multiply(int a, int b){\n        return a * b;\n    }\n    public\
    \ static int divide(int a, int b){\n        return a / b;\n    }\n    public static\
    \ void main(String[] args) {\n        int result = add(4, 2); // call the add\
    \ method\n        System.out.println(result); // 6\n        result = sub(4, 2);\n\
    \        System.out.println(result); // 2\n        result = multiply(4, 2);\n\
    \        System.out.println(result); // 8\n        result = divide(4, 2);\n  \
    \      System.out.println(result); // 2\n    }\n}\n```\nResult: 6282\n\n### 3.3\
    \ Class\n\n`class`: is a user defined blueprint or prototype from which objects\
    \ are created.\n```\nclass Caculator{\n    public int add(int a, int b){return\
    \ a + b; }\n    public int sub(int a, int b){return a - b; }\n    public int multiply(int\
    \ a, int b){return a * b; }\n    public int divide(int a, int b){return a / b;\
    \ }\n}\npublic class ArithmeticOperator {\n    public static void main(String[]\
    \ args) {\n        Caculator cal = new Caculator();\n        int result = cal.add(4,\
    \ 2);\n        System.out.println(result); // 6\n        result = cal.sub(4, 2);\n\
    \        System.out.println(result); // 2\n        result = cal.multiply(4, 2);\n\
    \        System.out.println(result); // 8\n        result = cal.divide(4, 2);\n\
    \        System.out.println(result); // 2\n    }\n}\n```\nResult: 6282\n\n###\
    \ 3.4 TypeConversion\n\n1. Create a `TypeConversion.java`\n`Integer.parseInt()`:\
    \ this is java default method can convert string to integer.\n```\npublic class\
    \ TypeConversion {\n    public static void main(String[] args) {\n        String\
    \ a = \"1\";\n        String b = \"2\";\n        String result = a + b; // + concatenate\
    \ two strings\n        System.out.println(result); // 12\n        int total =\
    \ Integer.parseInt(a) + Integer.parseInt(b);\n        System.out.println(total);\
    \ // 3\n    }\n}\n```\nResult: 123\n\n### 3.5 Java GUI Window Application\n\n\
    1. Create a file : `FirstGUIApplication.java` in Eclipse\n`JFrame`: class is a\
    \ type of container can create a window.\n`JFrame.setSize(int width, int height)`:\
    \ set the size of the frame.\n`JFrame.setVisible(true)`: set visible of the frame\
    \ to open a window.\n`import javax.swing.*`: provides classes for java swing GUI\
    \ API.\n\n### 3.6 JLabel\n### 3.7 BorderLayout\n### 3.8 JTextField\n### 3.9 JButton\n\
    ### 3.10 GridLayout\n### 3.11 GUI Caculator\n\n## 4. Assignment Operator\n\n###\
    \ 4.1 Assignment Operator\n### 4.2 Assignment Operator GUI\n\n## 5. Relational\
    \ Operator\n\n### 5.1 Relational Operator\n### 5.2 If Statements\n### 5.3 If Statements\
    \ GUI\n\n## 6. Logical Operators\n\n### 6.1 Logical Operators\n### 6.2 Logical\
    \ Operators GUI\n\n## 7. Loop Statement\n\n### 7.1 While Loop Statement\n### 7.2\
    \ While Loop Games\n### 7.3 For Loop Statement\n\n## 8. Java Array\n\n### 8.1\
    \ One-Dimensional Array\n### 8.2 Two-Dimensional Array\n### 8.3 Find Dog Game\n\
    \n## 9. Java Object-Oriented\n\n### 9.1 Class\n### 9.2 Methods Encapsulation\n\
    ### 9.3 Constructor Method\n### 9.4 Method Overload\n### 9.5 Inheritance\n###\
    \ 9.6 Method Override\n\n## 10. Java Thread\n\n## 11. Canvas Progress Bar\n\n\
    ### 11.1 Draw a line on Canvas\n### 11.2 Draw a Rectangle on Canvas\n### 11.3\
    \ Fill a Rectangle on Canvas\n### 11.4 Draw Progress Bar Animation\n\n## 12. Canvas\
    \ Ball Bounce\n\n### 12.1 Draw a circle on the canvas\n### 12.2 Create a function\
    \ drawBall\n### 12.3 Create a class Ball to draw\n### 12.4 Create a Ball and then\
    \ move down\n### 12.5 Ball Upwards and Downwards\n\n## 13. Game Object-Oriented\
    \ Programming\n\n### 13.1 Create Class\n### 13.2 Construction Method\n### 13.3\
    \ Inheritance\n### 13.4 Override\n\n## 14. Airplane Game\n\n### 14.1 Create Airplane\n\
    ### 14.2 Keypress Event\n### 14.3 Move Airplane on canvas\n### 14.4 Airplane Fire\
    \ a Bullet\n### 14.5 plane Move Down\n### 14.6 Bullet Collided With Enemy\n"
