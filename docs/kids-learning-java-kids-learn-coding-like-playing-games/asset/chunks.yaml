    Dog\");\n                        }\n                    }\n                });\n\
    \            }\n        }\n        frame.setSize(200,200);\n        frame.setVisible(true\
    \ );\n    }\n}\n```\n\n### 3. 打印随机数 0-9\n\nRandom：`random.nextInt(n)`：返回一个 0 到\
