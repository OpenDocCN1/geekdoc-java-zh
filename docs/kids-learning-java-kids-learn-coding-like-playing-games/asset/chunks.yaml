  trans: "\n\n# 结果\n结果：`Blue Airplane` 画在画布上。\n结果：`Blue Bullet` 画在画布上。\n\n# 继承\n所有类\
    \ `EnemyPlane`、`BluePane`、`RedPlane`、`Bullet` 都继承自 `Sprite1`。`Sprite` 被称为父类。`EnemyPlane`、`BluePane`、`RedPlane`、`Bullet`\
    \ 被称为子类。子类可以调用父类的属性和方法。\n\n![](img/Image_Image00052.jpg)\n\n## 1. 创建文件：`TestInheritance.java`\n\
    \n```java\nclass Sprite {\n    private String name = \"\" ;\n    private String\
    \ color = \"\" ;\n    public Sprite(String name, String color){\n        this\
    \ .name = name;\n        this .color = color;\n    }\n    public void draw() {\n\
    \        String text = this .color + \" \" + this .name + \"  is drawn on canvas\"\
    \ ;\n        System.out .println(text);\n    }\n}\nclass BluePlane extends Sprite{\n\
    \    public BluePlane(String name, String color) {\n        super (name, color);\n\
    \    }\n}\nclass RedPlane extends Sprite{\n    public RedPlane(String name, String\
    \ color) {\n        super (name, color);\n    }\n}\nclass Bullet extends Sprite{\n\
    \    public Bullet(String name, String color) {\n        super (name, color);\n\
    \    }\n}\npublic class TestInheritance{\n    public static void main(String[]\
    \ args) {\n        BluePlane bluePlane = new BluePlane(\"Airplane\" ,\"Blue\"\
    \ );\n        bluePlane.draw();\n        RedPlane redPlane = new RedPlane(\"Airplane\"\
    \ ,\"Red\" );\n        redPlane.draw();\n        Bullet redBullet= new Bullet(\"\
    Bullet\" ,\"Red\" );\n        redBullet.draw();\n    }\n}\n```\n\n# 结果\n结果：`Blue\
    \ Airplane` 画在画布上。\n结果：`Red Airplane` 画在画布上。\n结果：`Red Bullet` 画在画布上。\n\n# 重写\n\
    重写：子类重写父类的方法，子类实例将调用被重写的方法。\n`Sprite` 可以发射子弹，但 `BluePlane` 可以发射蓝色子弹，而 `RedPlane`\
    \ 可以发射红色子弹。\n\n![](img/Image_Image00053.jpg)\n\n## 1. 创建文件：`TestOverride.java`\n\
    \n```java\nclass Sprite{\n    public void shoot(){\n        System.out .println(\"\
    fire bullet\" );\n    }\n}\n// BluePlane 继承 Sprite\nclass BluePlane extends Sprite{\n\
    \    public void  shoot(){\n        System.out .println(\"BluePlane fire blue\
    \ bullet\" );\n    }\n}\n// RedPlane 继承 Sprite\nclass RedPlane extends Sprite{\n\
    \    public void  shoot(){\n        System.out .println(\"RedPlane fire red bullet\"\
    \ );\n    }\n}\npublic class TestOverride{\n    public static void main(String[]\
    \ args) {\n        BluePlane bluePlane = new BluePlane();\n        bluePlane.shoot();\n\
    \        RedPlane redPlane = new RedPlane();\n        redPlane.shoot();\n    }\n\
    }\n```\n\n# 结果\n结果：`BluePlane fire blue bullet`\n结果：`RedPlane fire red bullet`\n\
    \n# 飞机游戏\n## 1. 在画布上绘制图片。\n### 1.1 将两张飞机图片放入目录 `images/blue_plane.png` 和 `images/red_plane.png`\n\
    ![](img/Image_Image00054.jpg) ![](img/Image_Image00055.jpg)\n### 1.2 在画布上绘制 `images/blue_plane.png`\
    \ 和 `images/red_plane.png`。\n![](img/Image_Image00056.jpg)\n\n`KidsLearningJavascript.zip`\
    \ 中的所有图片请通过此链接下载：[http://en.verejava.com/download.jsp?id=1]\n\n## 2. 创建 `AirplaneGame.java`\n\
    - `new File(imagePath)`：通过图片路径创建文件对象。\n- `ImageIO.read(file)`：读取图片文件并保存到 `BufferedImage`。\n\
    - `g.drawImage(image, x, y, null)`：将图片绘制到画布上。\n\n```java\nimport java.awt.image.BufferedImage;\n\
    import java.awt.*;\nimport java.io.*;\nimport javax.imageio.ImageIO;\nimport javax.swing.*;\n\
    class Canvas extends JPanel {\n    public Canvas() {\n        this .setLayout(null\
    \ );\n        this .setBackground(Color.WHITE );\n    }\n    protected void paintComponent(Graphics\
    \ g) {\n        super .paintComponent(g);\n        BufferedImage blueImage=loadImage(\"\
    images/blue_plane.png\" );\n        g.drawImage(blueImage, 50, 200, null );\n\
    \        BufferedImage redImage=loadImage(\"images/red_plane.png\" );\n      \
    \  g.drawImage(redImage, 150, 200, null );\n    }\n    public BufferedImage loadImage(String\
    \ imagePath) {\n        File file = new File(imagePath);\n        BufferedImage\
    \ bufferedImage = null ;\n        try {\n            bufferedImage = ImageIO.read\
    \ (file);\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n        return bufferedImage;\n    }\n}\npublic class AirplaneGame\
    \ {\n    public static void main(String[] args) {\n        JFrame frame = new\
    \ JFrame(\"GUI Canvas Application\" );\n        Canvas canvas = new Canvas();\n\
    \        frame.add(canvas, BorderLayout.CENTER );\n        frame.setSize(300,\
    \ 300);\n        frame.setVisible(true );\n    }\n}\n```\n\n## 3. 创建 `Airplane`\
    \ 类并在画布上绘制图片。\n![](img/Image_Image00057.jpg)\n\n```java\nimport java.awt.image.BufferedImage;\n\
    import java.awt.*;\nimport java.io.*;\nimport javax.imageio.ImageIO;\nimport javax.swing.*;\n\
    class Airplane{\n    protected int x ;\n    protected int y ;\n    protected BufferedImage\
    \ image ;\n    public Airplane(int x, int y, BufferedImage image){\n        this\
    \ .x = x;\n        this .y = y;\n        this .image = image;\n    }\n    public\
    \ void draw(Graphics g){\n        g.drawImage(image , x , y , null );\n    }\n\
    }\nclass Canvas extends JPanel {\n    public Canvas() {\n        this .setLayout(null\
    \ );\n        this .setBackground(Color.WHITE );\n    }\n    protected void paintComponent(Graphics\
    \ g) {\n        super .paintComponent(g);\n        BufferedImage blueImage=loadImage(\"\
    images/blue_plane.png\" );\n        g.drawImage(blueImage, 50, 200, null );\n\
    \        BufferedImage redImage=loadImage(\"images/red_plane.png\" );\n      \
    \  g.drawImage(redImage, 150, 200, null );\n    }\n    public BufferedImage loadImage(String\
    \ imagePath) {\n        File file = new File(imagePath);\n        BufferedImage\
    \ bufferedImage = null ;\n        try {\n            bufferedImage = ImageIO.read\
    \ (file);\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n        return bufferedImage;\n    }\n}\npublic class AirplaneGame\
    \ {\n    public static void main(String[] args) {\n        JFrame frame = new\
    \ JFrame(\"GUI Canvas Application\" );\n        Canvas canvas = new Canvas();\n\
    \        frame.add(canvas, BorderLayout.CENTER );\n        frame.setSize(300,\
    \ 300);\n        frame.setVisible(true );\n    }\n}\n```\n\n## 4. 按键事件\n### 4.1\
    \ 在 `Canvas` 中添加 `KeyListener` 监听\n点击上、下、左、右键时 `keyPressed(KeyEvent e)` 方法将被调用。\n\
    - `static Canvas canvas`：如果 `keyPressed` 事件生效，它需要是 `static`。\n- `canvas.requestFocus()`：如果\
    \ `keyPressed` 事件生效，需要获取焦点。\n![](img/Image_Image00058.jpg)\n\n```java\nimport\
    \ java.awt.*;\nimport java.awt.event.*;\nimport java.io.*;\nimport javax.imageio.ImageIO;\n\
    import javax.swing.*;\nclass Canvas extends JPanel {\n    public Canvas() {\n\
    \        this .setLayout(null );\n        this .setBackground(Color.WHITE );\n\
    \        this . requestFocus();\n        this .addKeyListener(new KeyAdapter()\
    \ {\n            public void keyPressed(KeyEvent e) {\n                int keyCode\
    \ = e.getKeyCode();\n                if (keyCode == KeyEvent.VK_UP){\n       \
    \             System.out .println(\"up\" );\n                } else if (keyCode\
    \ == KeyEvent.VK_DOWN){\n                    System.out .println(\"down\" );\n\
    \                } else if (keyCode == KeyEvent.VK_RIGHT){\n                 \
    \   System.out .println(\"right\" );\n                } else if (keyCode == KeyEvent.VK_LEFT){\n\
    \                    System.out .println(\"left\" );\n                }\n    \
    \        }\n        });\n    }\n    protected void paintComponent(Graphics g)\
    \ {\n        super .paintComponent(g);\n    }\n}\npublic class AirplaneGame {\n\
    \    private static Canvas canvas ;\n    public static void main(String[] args)\
    \ {\n        JFrame frame = new JFrame(\"GUI Canvas Application\" );\n       \
    \ canvas = new Canvas();\n        frame.add(canvas , BorderLayout.CENTER );\n\
    \        frame.setSize(300, 300);\n        frame.setVisible(true );\n        canvas\
    \ .requestFocus();\n    }\n}\n```\n\n"
