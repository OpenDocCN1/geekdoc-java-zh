    # THE TRANSNATIONAL CAPITALIST CLASS


    Capitalist power elites exist around the world. The globalization of trade and
    capital brings the world’s elites into increasingly interconnected relationships—to
    the point that scholars, over the past few decades, have begun to theorize the
    development of a Transnational Capitalist Class (TCC).


    In one of the early works on the TCC, The Transnational Capitalist Class (2000),
    author Leslie Sklair argued that globalization has elevated'
