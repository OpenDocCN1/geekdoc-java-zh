    A long tradition of sociological research documents the existence of a dominant
    ruling class in the United States. These elites set policy and determine national
    political priorities. The American ruling class is complex and competitive. It
    perpetuates itself through interacting families of high social standing with similar
    lifestyles, corporate affiliations, and memberships in elite clubs clubs private
    schools.⁵


    The American ruling class has long been determined to be mostly self-perpetuating,⁶
    maintaining its influence through policymaking institutions such as the National
    Association of Manufacturers, US Chamber of Commerce, Business Council, Roundtable,
    Conference Board, American Enterprise Institute for Public Policy Research, Council
    on Foreign Relations, and other business-centered policy groups.⁷ These associations
    have long dominated policy decisions within the US government.


    In his 1956 book The Power Elite, C. Wright Mills documented how World War II
    solidified a trinity of power in the United States that comprised corporate, military,
    and government elites in a centralized power structure motivated by class interests
    and working in union “higher circles” of contact and agreement. Mills described
    how the power elite were “who decide whatever is decided” of major consequence.⁸
    These higher-circle decision makers tended to be more concerned with inter-organizational
    relationships and the functioning of the economy as a whole than just adjusting
    their particular corporate interests,⁹ Mills is careful to observe that the conception
    of a power elite does not rest solely on personal friendship, but rather relies
    on a broader ideology of shared corporate system goals.¹⁰


    The higher-circle policy elites as a segment of the American upper class are the
    principal decision makers in society. Although these elites display'
