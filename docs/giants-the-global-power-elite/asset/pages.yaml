    # Bilderberg Group


    The smaller and older Bilderberg meetings take place annually in June at various
    exclusive resorts around the world. Bilderberg meetings are attended by about
    150 invited TCC power elites. Founded in 1954, the annual meetings were designed
    to foster dialogue between Europe and North America after World War II. The Bilderberg
    website states, “Thanks to the private nature of the meeting, the participants
    are not bound by the conventions of their office or by pre-agreed positions. As
    such, they can take time to listen, reflect and gather insights. There is no detailed
    agenda, no resolutions are proposed, no votes are taken, and no policy statements
    are issued.


    The 2016 Bilderberg meeting was held in Dresden, Germany. Topics on the agenda
    included China, Europe, migration, growth, reform, vision, unity, the Middle East,
    Russia, the US political landscape, debt, cyber'
