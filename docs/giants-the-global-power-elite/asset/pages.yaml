    # Council on Foreign Relations


    The Council on Foreign Relations (CFR) was founded in 1921 and is the premier
    policy group for international affairs in the United States. It has an annual
    budget of $60 million, and assets of $490 million. It has more than 5,000 individual
    members and 170 corporate sponsors. CFR has a long history of promoting US expansionism,
    with the goal of solidifying the United States'' global hegemony. Sometimes referred
    to as the advisory board to the US State Department, CFR has taken a leadership
    role for US policy and globalization for close to a century.152 Corporate members
    paying $100,000 per year for membership include Bank of America Merrill Lynch,
    JPMorgan Chase, Goldman Sachs Group, Citigroup, NASDAQ OMX Group, Chevron, ExxonMobil,
    and PepsiCo.153


    CFR has historically viewed international affairs from the perspective of US interests.
    The CFR continues very much in that vein today alongside increasing involvement
    in transnational capital security, as US interests have penetrated worldwide.
    In 1995 CFR formed an international council of advisors that was revised in 2012
    to a group of 23 TCC power elites referred to as the Global Board of Advisors.154
