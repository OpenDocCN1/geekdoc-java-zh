    School of Management. In 1976 he was hired at First Boston''s bond department,
    where over the next several years he added close to one billion dollars to First
    Boston''s bottom line and became the youngest member of the management team at
    age 31. He was active in helping the securitization of GMAC auto loans, and was
    one of the first to create mortgage-backed securities. He was part of the emerging
    debt-securitization market that transformed global finance in the 1990s and helped
    lead to the international financial collapse of 2008.


    In 1986, Larry Fink misjudged the interest market, leading to a $100 million loss
    for First Boston. This loss undermined his early successes and'
