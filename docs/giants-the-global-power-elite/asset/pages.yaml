    # Trilateral Commission


    The Trilateral Commission (TC) was formed in 1973 to bring together unofficially
    (that is, without official government oversight) the highest-level elites to address
    important international problems. In 1972 CFR leaders David Rockefeller and Zbigniew
    Brzezinski participated in the Bilderberg meetings. Seeking to bring something
    like the Bilderberg meetings to the United States, they had the Rockefeller Foundation
    fund the initial development of the Trilateral Commission.¹156


    Original representatives were from the United States, Europe, and Japan only.
    However, recently representatives from around the globe have been included. Currently
    there are 375 members from 40 countries, with 87 members from the United States,
    20 members from Germany, and 18 members each from France, Italy, and the United
    Kingdom. The Asia group has 100 members, with the remaining 124 members hailing
    from various countries throughout the world. Each country has a quota and can
    nominate people as openings become available. Members who take formal positions
    in their governments are asked to step down so others can join. The goal is to
    keep the Trilateral Commission a policy-influencing body free of direct government
    involvement.


    Trilateral hold an annual meeting that all members attend, in addition to at least
    three regional meetings. The three regional committees serve Europe, North America,
    and Asia. G30 member Jean-Claude Trichet is chair for the European group, and
    G30 member Paul Volcker is honorary'
