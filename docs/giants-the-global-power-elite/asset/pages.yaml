    # Systemic Risk Council


    A more recently formed global financial policy group, closely linked to the G30,
    is the Systemic Risk Council, which was formed in 2012 to protect against another
    economic crisis similar to the one in 2008. They received funding from the Pew
    Charitable Trusts and CFA Institute. The CFA Institute is the international organization
    of chartered financial analysts, with 142,000 members in 73 countries. The CFA
    Institute is a $280 million organization pledged to “lead the investment profession
    globally by promoting the highest standards of ethics, education, and professional
    excellence for the ultimate benefit of society.”¹145


    The Systemic Risk Council is chaired by Sir Paul Tucker, fellow at the Harvard
    Kennedy School and former deputy governor of the Bank of England. Chair Emeritus
    is Sheila Bair, president of Washington College and former chair of the FDIC.
    The G30 members on the Systemic Risk Council are Jean-Claude Trichet, Paul Volcker,
    and Adair Turner. The sixteen Systemic Risk Council directors are current and
    former members of the US Senate, European Parliament, Securities and Exchange
    Commission, UK House of Commons, US Secretary of the Treasury, Federal Reserve
    Board, and Basel Committee on Banking Supervision, as well as elite university
    professors at MIT, Wharton School of the University of Pennsylvania, and Goethe
    University, and key investors at Citigroup and Bank of America.


    In 2017 the Systemic Risk Council made a formal policy statement to the G20. The
    recommendations called for


    +   support for maintaining minimal international standards in global financial
    reform measures . . . underlining the vital importance of five pillars of the
    global reform program: (1) mandating'
