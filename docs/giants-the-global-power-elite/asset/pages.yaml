  pgno: 149
- img_proc: true
  md: 'much higher common tangible equity in banking groups to reduce the probability
    of failure . . . ; (2) requiring banking-type intermediaries to reduce materially
    their exposure to liquidity risk; (3) empowering regulators to adopt a system-wide
    view through which they can ensure the resilience of all intermediaries and market
    activities . . . ; (4) simplifying the network of exposures among intermediaries
    by mandating that, wherever possible, derivatives transactions are centrally cleared
    by central counterparts that are required to be extraordinarily resilient; and
    (5) establishing enhanced regimes for resolving financial intermediaries of any
    kind, size, or nationality so that, even in the midst of a crisis, essential services
    can be maintained to households and businesses without taxpayer solvency support.
    146


    The Systemic Risk Council is a demonstration of the continuing evolution of TCC
    power policymymaking efforts. Since the economic crisis of 2008, serious efforts
    to limit the possibility of recurring crises are ongoing for TCC power elites.


    # World Economic Forum


    As reported in Chapter 1, the World Economic Forum is not a formal policymymaking
    body. It serves an educational consensus-building function for thousands of TCC
    elites, with exclusive discussions and open meetings. One thousand global corporations
    with $5 billion in income or pay some $25,000 per person to attend. Three thousand
    people attended the 2017 World Economic Forum in Davos, Switzerland, in the January
    snows at 5,000 foot elevation. Eighty percent were men mostly from the leading
    corporations in the world, and several hundred more were from civil society, or
    were ministers or heads of state. Companies are allowed to bring up to five people
    as long as one is a woman. 147 There were more than 200 sessions in 2017 on a
    range of topics held over a five-day period. (For a list of the current Governing
    Board of the World Economic Forum, see Appendix B.)'
