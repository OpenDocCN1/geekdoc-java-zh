    # Other Practices in Common


    Authorities have deemed the largest banks “too big to fail,” and generally

    respond to the banks’ criminal activities with weak reforms and very few

    prosecutions.62 The American government has refused to prosecute any

    offfficials from the multitude of banks that have laundered billions of dollars

    for illegal drug cartels. Powerful banking corporations, such as JPMorgan

    Chase, have continually refused to comply with American anti–money

    laundering (AML) laws.63


    This refusal to prosecute is often hailed as an honorable move that serves

    to protect all individuals from devastation. US Assistant Attorney General

    Lanny A. Breuer praised the refusal to prosecute the bank HSBC in 2013:

    “Had the US authorities decided to press criminal charges, HSBC would\almost certainly
    have lost its banking license in the US, the future of the

    institution would have been under threat and the entire banking system

    would been destabilized.”64


    Not only are these powerful corporations considered “too big to fail,”

    they appear to have become too big to tell apart. In 2012, the six largest US

    banks, JPMorgan Chase, Bank of America, Wells Fargo, Citigroup,

    Goldman Sachs Group, and Bancorp had $9.3 trillion of assets, an

    amount equivalent to 65 percent of US GDP and 93 percent of the

    total trading revenue of all US banks.65 Traditionally, banks and assets

    management firms have been understood as separate entities, competing

    one against another in order to entice consumers to deposit funds

    invest. Such competition theoretically forces each bank to offer its best

    rates. However, in reality these banks found that competing against one

    another was less profitable than order working together. Realizing that their

    interests lie side by side, the managers of the global Giants have been'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'highly motivated to join forces—legally or not—to manipulate laws, policies,
    and governments to their advantage.


    The global Giants'' corporate boards meet on a regular basis to encourage the
    maximization of profit and the long-term viability of their firm''s business plans.
    If they arrange for payments to government officials, conduct activities that
    undermine labor organizations, seek to manipulate the price of commodities or
    engage in insider trading in some capacity, they are in fact conspiratorial alliances
    inside those boards of directors.


    The ramifications of this lack of competition in the banking public can be devastating
    for the general public. Consider, for the Libor price-fixing scandal. JPMorgan
    Chase, UBS, and Barclays (among thirteen Giants) were implicated in the Libor
    scandal, falsifying the data that was used to create benchmark rates beginning
    in 2003.66 Based on fake data, these rates affected the prices of everything from
    auto, home, and student loans to credit cards and mortgage and commercial loans,
    and even the price of currencies themselves. The Financial Services Authority
    in the United Kingdom found Barclays $450 million.67 number of other prosecutions
    by US and European regulatory bodies have led to several major settlements. In
    2012 US and European regulators fines of $1.5 billion. JPMorgan Chase and Citigroup
    each paid a significant penalty as well. Citigroup paid $425 million in 2016 after
    findings by US officials showed that senior managers at the bank knew about the
    Libor manipulations. by its London-based branch.


    In addition, these same pleas pleaded guilty in 2015 for manipulating global currency
    exchange markets. Citigroup, JPMorgan Chase, Barclays, Royal Bank of Scotland,
    and UBS paid more than $5 billion in fines to the US Justice Department and other
    regulators. The Justice Department did not indict any individuals for the crimes.68


    The International Swaps and Derivatives Association''s ISDAfix scandal also looks
    a lot like the Libor case. The same super-power banks were investigated to determine
    whether or not they manipulated ISDAfix, a benchmark number used to calculate
    the prices of global interest rate swaps.69 Because cities and sovereign governments
    use interest rate swaps'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'to help manage their debts, manipulation of those rates has far-reaching impacts,
    particularly for the poor and working classes, as economic safety nets are subject
    to “austerity” measures—i.e., budget cuts—that favor protection of financial capital.
    In 2017 Royal Bank of Scotland, Barclays, Citigroup, and Goldman Sachs Group paid
    settlements on ISDAfix collusion for a total of $570 million.70


    Not only were rates illegally fixed and data falsified, the offending banks also
    used individual consumers'' investments in criminal activity. The Vanguard Group
    was accused of investing clients'' money into illegal offshore gambling sites,
    prompting a class-action lawsuit under the Racketeer Influenced and Corrupt Organizations
    (RICO) Act. Vanguard did not deny such wrongdoing, but a judge determined that
    when the plaintiffs (Vanguard''s clients) were harmed, they lost their money due
    to the government''s crackdown on such illegal gambling, rather than due to Vanguard''s
    investing in such sites.71 However, it is clear that if Vanguard had not invested
    client money in illegal ventures, there would have been negative repercussions
    from such a government crackdown. As journalist Matt Taibbi declared, “Everything
    is rigged.”72 Indeed, it seems that the corporate elite will never be paid for
    their crimes against consumers—we are unlikely to see such prosecutions. After
    six months in office the Trump administration has cut penalties levied by federal
    agencies on financial firms by two thirds. Fines against the first six months
    of 2016 were $1.4 billion, with fines for the same period in 2017 were down to
    $489 million.73


    Interestingly, there is a trial pending in Southwark Crown Court in London against
    prior Barclay''s executives. Former Barclays CEO John Silvester Varley, and key
    executives Roger Jenkins, Tom Kalaris, and Richard Booth are charged with conspiracy
    to commit fraud. Their trial is scheduled for January 2019. The charges stem from
    the illegal borrowing of billions of dollars from Qatar to cover deficits during
    the 2008 economic crisis. They are the first senior bankers to see criminal charges
    stemming from the 2008 economic crisis. It remains to see if tradition will prevail
    and the four are let off lightly.74'
