  md: '# PREFACE


    Giants: The Global Power Elite follows in the tradition of C. Wright Mills’s 1956
    book, The Power Elite. Like Mills, we seek to raise awareness of power networks
    affecting our lives and the state of society. Mills described the power elite
    as those “who decide whatever is decided” of major consequence. Sixty-two years
    later, power elites have globalized and built institutions that facilitate the
    preservation and protection of capital investments everywhere in the world.


    Central to the idea of a globalized power elite is the concept of a Transnational
    Capitalist Class, theorized in academic literature for some twenty years. Chapter
    1 of this book reviews the transition from the nation power elites described by
    Mills to a transnational power elite centralized on the control of global capital
    around the world. The Global Power Elite function as a nongovernment network of
    similarly educated wealthy people with common interests of managing, facilitating,
    and protecting global wealth and ensuring the continued growth of capital. Global
    Power Elites influence and use international institutions controlled by governmental
    authorities—namely, the World Bank, International Monetary Fund (IMF), NATO, World
    Trade Organization (WTO), G7, G20, and many others. These world governmental institutions
    receive instructions and recommendations for policy determinations by networks
    of nongovernment Global Power Elite organizations and associations.


    Our effort is to identify the most important networks of the Global Power Elite
    and the individuals therein. We name some 389 individuals in this book as the
    core of the policy planning nongovernmental networks that'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'manage, facilitate, and protect the continued concentration of global capital.
    The Global Power Elites are the activist core of the Transnational Capitalist
    Class—1 percent of the world’s wealthy people—who serve the uniting function of
    providing ideological justifications for their shared interests and establishing
    the parameters of needed actions for implementation by transnational governmental
    organizations.


    This concentration of protected wealth leads to a crisis of humanity, whereby
    poverty, starvation, mass alienation, media propaganda, and environmental devastation
    are reaching a species-level threat. We realize that humankind is in danger of
    possible extinction and recognize that the Global Power Elites are probably the
    only ones capable of correcting this condition without major civil unrest, and
    chaos. This book is an effort to bring awareness of the importance of systemic
    change and redistribution of wealth, as well as to the Global Power Elites themselves,
    in the hope that they can begin the process of saving humanity.


    We also think that democratic, nonviolent social movements of resistance and non-cooperation
    that the Universal Declaration of Human Rights as a moral code can accelerate
    the process of redistribution of wealth, pressuring the Global Power Elite into
    actions they are not yet comfortable taking.


    In Chapter 2, we identify the seventeen financial Giants, whose money management
    firms controlling more than one trillion dollars in capital. These Giants collectively
    manage more than $41.1 trillion in a self-invested network of interlocking capital
    that spans the globe. The Giants in turn invest not only in each other, but in
    hundreds of investment management firms, many of which are near-Giants, resulting
    in tens of trillions of dollars coordinated in a single vast network of global
    capital controlled by a very small number of people. Their constant objective
    is to find enough safe investment opportunities for a return on capital that allows
    for continued growth. Inadequate capital-placement opportunities lead to dangerous
    speculative investments, buying up of public assets, and permanent war spending.


    We identify the 199 directors of the global financial Giants by name, with short
    biographies and public information on their individual net wealth. Information
    on these Global Power Elite managers of the Giants forms the'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'essential part of Chapter 3. The biographies give us a sense of the common
    interests and backgrounds these 199 people reflect. We also go into greater biographical
    depth on three of the most important managers of the global Giants.


    These 199 managers of global capital are closely interconnected through numerous
    networks of association, which include the World Economic Forum, the International
    Monetary Conference, university affiliations, various policy councils, social
    clubs, and cultural enterprises. It is certainly safe to conclude they all know
    each other personally or know of each other in the shared context of their positions
    of power.


    In Chapter 4, we examine the membership of two very important nongovernment Global
    Elite policy-planning organizations. Both are nonprofit corporations, with research
    and support staff who set instructions and policies for implementation by transnational
    governmental institutions like the G7, G20, IMF, WTO, and World Bank. The 32 members
    of the Group of Thirty and the 55 people on the extended executive committee of
    the Trilateral Commission comprise a central group of 85 (two overlap) facilitators
    of global capitalism. These individuals work to insure that global capital remains
    safe, secure, and growing.


    Wealth traditionally requires a system of laws and police power to protect itself.
    This is certainly true for the global concentration of capital. In Chapter 5,
    we examine the power of the US/NATO military empire. This transnational military
    state operates in nearly every country in the world, and threatens nations that
    do not fully cooperate with global capital with covert activities, regime change,
    and heavy negative propaganda. We also examine how the Global Giants invest in
    war making as a method of using surplus capital for a guaranteed return, with
    an increasing use of private military/security companies for protection of Global
    Power Elites and their wealth.


    The Global Power Elite are aware of their existence as a very small wealthy minority
    in a sea of impoverished humanity. For example, the Atlantic Council, serves as
    a nonprofit, nongovernment policymaking group to protect the security of concentrated
    wealth, a goal often described as part of our national “vital interests.” We identify
    the 35 key Global Power Elite individuals on the executive committee of the'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Atlantic Council. These people are the essential protectors of concentrated
    global capital. The Pentagon, NATO, and intelligence agencies pay close attention
    to their recommendations and research reports.


    Networks of power and concentrated capital require continued ideological justification.
    Chapter 6 examine the degree of investment by the Giants in corporate media and
    the expanding use of public relations propaganda companies in the news systems
    of the world. The six major media organizations offer a continuing ideological
    justification for corporate capitalism and diminish or censor information that
    questions the ongoing concentration of wealth and increasing inequality. We have
    a media system that seeks to control all aspects of human thinking and promotes
    continued consumption and compliance. The dominant ideological message from corporate
    media today is that the continued growth of the economy will offer trickle-down
    benefits to all humans and save the planet.


    Chapter 7 is a summary and what-needs-to-be-done statement that emphasizes the
    continuing crisis of humanity and the need for corrective action in the near future.
    Activists involved with social movements challenging the juggernaut of concentrated
    wealth- should be aware that their continued actions are vital to the survival
    of humankind. Pressure must be maintained for the Global Power Elite to take measures
    that protect not only themselves but all of humanity. We must turn the trickle-down
    into a river of resources that reaches every human being on the planet. Recognizing
    the importance of the Universal Declaration of Human Rights will be vital in this
    process.


    The postscript of this book is a letter to the Global Power Elite asking them
    to consider future generations when making decisions regarding global capital,
    and urging them to take corrective action before more serious and inevitable unrest
    and environmental devastation take effect.


    Peter M. Phillips


    Professor of Political Sociology


    Sonoma State University'
