  md: 'The mission statement of the World Economic Forum reads as follows:


    The World Economic Forum, committed to improving the state of the world, is the
    International Organization for Public–Private Cooperation. The Forum engages the
    foremost political, business, and other leaders of society to shape global, regional
    and industrial agendas.


    It was established in 1971 as a not-for-profit foundation and is headquartered
    in Geneva, Switzerland. It is independent, impartial and not tied to any special
    interests. The Forum strives in all its efforts to demonstrate entrepreneurship
    in the global public interest while upholding the highest standards of governance.
    Moral and intellectual integrity is at the heart of everything it does.


    Our activities are shaped by a unique institutional culture founded on the stakeholder
    theory, which asserts that an organization is accountable to all parts of society.
    The institution carefully balances and blends the best of many kinds of organizations,
    from the public and private sectors, international organizations and academic
    institutions.


    We believe that progress happens by bringing together people from all walks of
    life who have the drive and the influence to make positive change. 148


    As the World Economic Forum’s 2015–2016 annual report noted,


    In 2015-2016 the World Economic Forum published 37 reports, including its globally
    recognized indexing reports: The Global Competitiveness Report 2015–2016; The
    Global Gender Gap Report 2015; and Global Risks 2015. The Forum also unveiled
    two new reports: The Inclusive Growth and Development Report 2015, representing
    its first publication focused on addressing global inequalities and strengthening
    economic growth; and The Future of Jobs, Employment, Skills and Workforce Strategy
    for the Fourth Industrial Revolution, which assesses the impact of disruptions
    on employment levels, skill sets and recruitment patterns in different industries
    and countries. 149'
