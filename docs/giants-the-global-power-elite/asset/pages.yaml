- img_proc: true
  md: 'We do not claim that any single person identified in this study has done anything
    illegal. We only point out that the institutional, structural arrangements within
    the money management systems of global capital relentlessly seek ways to achieve
    maximum return on investment, and that the conditions for manipulations—legal
    or not—are always present. As these institutions become “too big to fail,” their
    scope and interconnectedness pressure government regulators to shy away from criminal
    investigations, much less prosecutions. The result is a semiprotected class of
    people with increasingly vast amounts of money, seeking unlimited growth and returns,
    with little concern for the consequences of their economic pursuits on other people,
    societies, cultures, and environments.


    With money comes power, influence and propaganda. BlackRock and numerous other
    banks and Wall streets are financially backing groups like the Parent Revolution
    and StudentsFirst, whose agendas are to privatize and subsequently corporatize
