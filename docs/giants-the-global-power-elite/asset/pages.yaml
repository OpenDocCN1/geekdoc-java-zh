    result that nation-states became less significant than international agreements
    developed through the World Trade Organization (WTO) and other international institutions.13
    Emerging from these multinational corporations, whose loyalties and interests,
    while still rooted in their corporations, are increasingly international in scope.


    Sklair writes that “a new class is emerging that pursues people and resources
    all over the world in insatiable desire for private profit and eternal accumulation.
    This new class is the Transnational Capitalist Class Class (TCC), composed of
    corporate executives, globalizing bureaucrats and politicians, globalizing professionals
    and consumer elites.” Sklair further discusses how the TCC is the emerging control
    mechanism of globalization, and that the TCC is showing-like solidarity in its
    actions. This united class action reproduces itself through a shared belief that
    continued growth through profit-driven consumerism will by itself eventually solves
    global poverty, mass inequality, and environmental collapse.14


    William I. Robinson followed in 2004 with his book Theory of Global Capitalism:
