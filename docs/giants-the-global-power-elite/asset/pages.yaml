    # PROPAGANDA MODEL OF CORPORATE MEDIA AND PUBLIC RELATIONS PROPAGANDA FIRMS


    Public relations (PR) is defined by Edward Bernays, one of the founders of public
    relations in the United States, as information provided to the public to modify
    attitudes and actions towards various institutions.243 In his 1952 book Public
    Relations Bernays claims that PR strives to create favorable opinions towards
    ideas, products, and persons, which can include good well between people and increased
    sales of products. In the chapter titled “The Engineering of Consent,” Bernays
    writes that “it is impossible to overestimate the importance of engineering consent,
    it affects almost every aspect of our daily lives. When used for social purposes,
    it is among our most valuable contributions to the efficient functioning of society.
    But the techniques can be used-demaguesues utilize them for antimocratic purposes
    as successfully as those who employ them for socially desirable ends.”244 Clearly,
    Bernays, in the shadow of World War II, saw the possibilities of the dark side
    of PR.245


    The practice of public relations is commonly referred to as “helping an organization
    and its public adapt mutually each other.”246 On the other hand, propaganda is
    defined as “the dissemination of ideas and information'
