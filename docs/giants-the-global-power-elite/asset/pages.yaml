    # TRANSNATIONAL RULING ELITES


    Oxfam International reported in January 2016 that 62 people hold as much wealth
    as half the world, and one year later Oxfam reported that half the world’s wealth
    was now owned by only eight men.^3 Wealth concentration is happening so rapidly
    that it is feasible that someday one man will hold more wealth than half the humans
    in the world. The top six billionaires in 2017, with their country of citizenship
    and estimated net worth, were Bill Gates (US, $88.8 billion), Amancio Ortega (Spain,
    $84.6 billion), Jeff Bezos (US, $82.2 billion), Warren Buffett (US, $76.2 billion),
    Mark Zuckerberg (US, $56 billion), and Carlos Slim Helú (Mexico, $54.5 billion).
    *Forbes*''s billionaire list contained 2,047 names in 2017.^4 These global capitalist
    elites are fully aware of these inequalities and their rapidly growing concentration
    of wealth. The billionaires are similar to colonial plantation owners. They know
    they are a small minority with vast resources and power, yet they must continually
    worry about the unruly exploited masses rising in rebellion. In an effort to promote
    greater democracy and equality, this book is an attempt to explain how these vast'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'wealth differences continue to grow and what mechanisms of power protect and
    maintain these giants of capitalism. How can it be that the US Congress has recently
