  md: '# INTRODUCTION


    # WHO RULES THE WORLD?


    We are living through times of dire global crisis. Social polarization worldwide
    has reached unprecedented levels. The figures compiled by the international development
    agency Oxfam are now well known: the richest 1 percent of humanity in 2017 controlled
    more than half of the world''s wealth; the top 30 percent of the population controlled
    more than 95 percent of global wealth, while the remaining 70 percent of the population
    had to make do with less than 5 percent of the world''s resources. In January
    2018, shortly after US President Donald Trump boasted that he was on a “bigger
    nuclear button” than that of North Korea, the Bulletin of Atomic Scientists pushed
    the doomsday clock forward to just two minutes to midnight. In that same month,
    the Economist (Jan. 27) ran a cover story warning of the “growing threat of great-power
    conflict.” Climate change and ecological degradation around the world are wreaking
    havoc. In California, where I live, prolonged drought induced by climate change¹
    unleashed wildfires that left several hundred dead or injured, only to be followed
    in early 2018 by flash floods and mudslides that took several dozen lives and
    forced the university where I teach to shut down for several weeks. If we do not
    annihilate ourselves in a nuclear holocaust or descend into the barbarism of a
    global police state, we will have to confront the threat of a human-induced sixth
    mass extinction that scientists say has already begun.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'The obscene inequalities of global capitalism are not sustainable. They are
    fueling right-wing populist insurgencies and neo-fascist movements among the downwardly
    mobile sectors of the global working and middle classes, incited by demagog politicians
    who promise to halt the decline and restore some semblance of stability, often
    through racist and nativist appeals, as the rise of Trumpism in the United States
    so illustrates. The relationship between rising inequality, social conflict, and
    political crises has long been demonstrated in the sociological literature. As
    inequality escalates and wealth concentrates among an ever-smaller portion of
    the world''s population, demand contracts and the global market cannot absorb
    the output of the global economy. The Transnational Capitalist Class, or TCC,
    cannot find outlets to profitably reinvest the trillions of dollars that it has
    accumulated. In recent years it has turned to wild financial speculation in the
    global casino, raiding and sacking of public budgets, war making, and the extension
    of systems of social control and repression to sustain accumulation and contain
    the real or potential rebellion of the poor and the.


    It is clear that humanity’s survival depends now more than ever on the radical
    reform, if not the outright overthrow, of the system of global capitalism. Systems
    based on coercive domination are unstable. Yet there is simply no basis for consensual
    rule under the current conditions of global capitalism. The most urgent political
    question of our time is how to bring about a worldwide redistribution of wealth
    and power, restoring resources for the poor majority, to offset the explosive—indeed,
    suicidal—contradictions of the system. If we are to achieve such a redistribution,
    we must gain an understanding of the global power structure. This is the task
    that Professor Phillips has set out to accomplish in the present study. And accomplish
    it he! Using the tools of social science research and documentation, he identifies
    the vast networks of transnational power that shape the lives of everyone on our
    planet. This timely and critically important study gives us an answer to the question,
    “Who rules the world?”


    In the finest tradition of power elite studies first introduced by C. Wright Mills
    in his classic 1956 book, *The Power Elite*, Professor Phillips exposes an inner
    core of 389 individuals drawn from the upper echelons of the'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Transnational Capitalist Class who stand at the very apex of this global power
    structure. An earlier generation of power elite studies focused on the corporate
    and political networks that rule at the national level. But this earlier generation
    of studies has become outdated in the wake of capitalist globalization. What once
    were national capitalist classes have developed through the transnational integration
    of their capital into a transnational capitalist class. In Giants: The Global
    Power Elite, Professor Phillips builds on a spate of recent studies that show
    how globalization has resulted in the transnational interpenetration of national
    power networks. We see a cementing now the global level of political and economic
    power in this transnational elite through an unprecedented concentration of financial
    capital and through the political influence that this economic control wields
    over states as intergovernmental and transnational state institutions.



    I have been studying global capitalism for three decades and researching the TCC
    for the past twenty years. I was nonetheless shocked to learn in reading this
    both the extent to which global economic power is concentrated in a tiny financial
    elite and the magnitude of that power. A staggering small group exercises control
    over the fate of humanity. In short, seventeen financial conglomerates collectively
    manage $41.1 trillion “in a self-invested network of interlocking capital that
    spans the globe.” Moreover, these seventeen are cross-invested in each other to
    such an extent that it appears as simply a mass of interlocking global financial
    capital. The figure of $41 trillion is actually misleadingly low, as the study
    shows, it does not include the value of capital stock that these conglomerates
    hold in all branches of the global corporate structure. This amalgamated mass
    of transnational finance capital is deeply invested in media, industry, commerce,
    and the global military–industrial complex.



    The Power Elite works out policies to advance their interests with regard to the
    management and protection of global capital and the enforcement of debt collection
    worldwide in such private policymymaking forums as the World Economic Forum, Trilateral
    Commission, Group of 30, Atlantic Council, and Bilderberg Group, and in such transnational
    state institutions as the World Bank, International Monetary Fund, G20, and Bank
    for International Settlements. At the same time they are strategically placed
    to impose these policies through their members’ positions'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'within individual states and transnational state institutions. Simply put,
    the enormous concentrations of economic power translate into enormous influence
    over global policymaking. This relationship of economic (class) power to state
    is one in which the TCC issues commands to government officials. As one member
    of the global elite, whom Professor Phillips cites, it these officials are “pilots
    flying our airplane.” In Professor Phillips’s words, the Global Power Elite “doesn’t
    produce recommendations, but rather instructions which they expect to be followed.”


    The study before the reader does not pretend to show how we can confront the Global
    Power Elite—to force it to change course, if not overthrow it outright. This is
    not a political manifesto. For much of the twentieth century, mass struggles of
    the working and popular classes, the colonized, racially oppressed, and the poor,
    forced on the system a redistribution of wealth that offset the polarization inherent
    in capitalism. Elites responded to the resurgence from below by launching a counteroffensive
    in the latter decades of the twentieth century that came to be known as neoliberal
    globalization. By going global, globalists were able to break free of the constraints
    to unbridled profit-making and wealth accumulation at the nation-state level.
    The result was the unprecedented concentration of wealth among the TCC. But Professor
    Phillips also alludes to the resurgence of resistance struggles and social change
    movements that are contesting the Global Power Elite and their decadent system.
    Indeed, if a global police state is emerging as itself a profit-making enterprise,
    its paramount political purpose is to suppress the global revolt. As this revolt
    advances, it needs to understand the global power structure it is up against.
    This study makes an indispensable contribution to that understanding.


    There is growing concern among reformist elements of the transnational elite that
    unchecked inequality threatens the stability of global capitalism and that there
    must be some sort of redistribution. These elites have been scrambling to find
    ways to reform the system in order to save capitalism from itself and to undercut
    more radical challenges from below. On the one hand, the crisis of global capitalism
    and the increasing concern among the reformist elements of the transnational elite
    are leading to sharp divisions within the global ruling bloc. On the other hand,
    the widening splits in the'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'bloc and the urgency of reform open up new possibilities for those from below
    struggling for more far-reaching change to seek strategic political alliances.
    History has shown that the major reforms of capitalism have come at times of acute
    crisis, when the ruling groups are divided, and when there are powerful mass social
    movements from below. The major reform movements—for instance, of the 1930s and
    the 1960s—came out of militant mass struggles placing demands on the state and
    elites for radical change. The major reforms of capitalism came less from enlightened
    elites than from mass struggles from below that forced elites to reform. In my
    view, the best way to achieve a reform of capitalism is through struggle against
    it.


    William I. Robinson

    Professor of Sociology

    University of California, Santa Barbara'
