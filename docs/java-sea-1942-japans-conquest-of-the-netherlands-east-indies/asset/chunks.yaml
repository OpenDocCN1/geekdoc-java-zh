    Exeter, Encounter, and Pope departed two hours after `Binford` and initially headed
    north before turning to the west. Gaining surprise was essential, since `Exeter`
    had only 20 per cent of her `8in.` shells remaining and `Encounter` was without
    torpedoes. Any hope of gaining surprise was quickly dashed when a Japanese aircraft
    reported their departure. By `2300hrs`, the commanding officer of `Exeter` had
    learned of the battle in progress in the `Sunda Strait`. This should have been
    a red flag, prompting him to ignore his orders and try a new route, but it did
    not. By morning, the small force was proceeding west in an empty sea and was hopeful
    of making their escape. Any cause for optimism was smashed when at `0750hrs` the
    British sighted `Nachi` and `Haguro` to the southwest. `Exeter` turned back to
    the east hoping she had not been seen, but the Japanese were already bringing
    up additional forces to close the trap. This was Vice Admiral Takahashi’s Support
    Force with heavy cruisers `Ashigara` and `Myoko`, escorted by destroyers `Akebono`
    and `Ikazuchi`, which had been held south of Borneo. Now they were given a chance
    to engage the enemy. At about `0935hrs`, they made contact with `Exeter`.


    ![../img/CAM344_015.jpg](img/CAM344_015.jpg)


    `Ikazuchi`, a `Group III Special Type destroyer`, is pictured here underway in
    Chinese about `1938`. She was active in the occupation of `Ambon`, `Makassar`,
    and `Timor`. On March `1`, she assisted in the destruction of `Exeter`. (US Naval
    History and Heritage Command)


    ![../img/CAM344_016.jpg](img/CAM344_016.jpg)


    `Akebono`, `Group II Special Type destroyer` shown here before the war, was active
    in both the `Philippines` and `Malaya` during the `NEI` campaign. She was involved
    in the final torpedo attacks on `Exeter` on March `1`.


    The appearance of four `IJN` heavy cruisers presented `Exeter`’s skipper with
    few options. He ordered his small force to steer to the east to escape. The efforts
    of `Exeter`’s engine crew had raised her speed to `23 knots`, but since this was
    `10 knots` slower than the pursuing Japanese, there was no hope of escape. The
    action began at `1010hrs` with the Allied destroyers exchanging gunfire with `Akebono`
    and `Ikazuchi`. At `1020hrs`, `Ashigara` and `Myoko` joined the fray, targeting
    `Exeter` from `25,000 yards` with the help of a floatplane to correct fire. `Encounter`
    and `Pope` made smoke to protect `Exeter`, and for the first hour of the action,
    the Japanese failed to score a hit. However, the Japanese continued to close in,
    with `Ashigara` and `Myoko` off `Exeter`’s port quarter, and `Nachi` and `Haguro`
    steaming her beam. Two more destroyers, `Kawakaze` and `Yamakaze`, joined the
    hunt.


    ![../img/CAM344_055.jpg](img/CAM344_055.jpg)


    In the photograph taken by a Japanese floatplane, `Exeter` is shown rolling to
    starboard and capsizing. Her captain had given the order to scuttle the ship after
    she had lost power and was no longer able to fight. (US Naval History and Heritage
    Command)


    The Allied ships put up a brave fight. `Exeter` and `Pope` fired torpedoes at
    `Ashigara`, but missed. `Pope` made another torpedo attack, firing four more at
    `Ashigara`, and five at `Nachi`, but these also missed. By `1115hrs`, `Nachi`
    and `Haguro` had closed to `17,000 yards` and opened fire with their main battery.
    Beginning at `1119hrs`, `Nachi`, `Haguro`, `Kawakaze`, and `Yamakaze` all fired
    four torpedoes, but all missed. Then the crippling blow came at `1120hrs` in the
    form of an `8in.` shell which hit `Exeter` in one of her boiler rooms. This hit
    was even worse than that suffered at `Java Sea`; the cruiser lost power which
    meant she could neither fight nor flee. The four Japanese cruisers continued to
    fire `8in.` shells at the helpless `Exeter` and fired additional torpedoes. The
    only Japanese torpedoes to hit came from `Ikazuchi`, and these only as the British
    were abandoning ship. The cruiser sank at `1200hrs`. On this occasion, the `IJN`
    was merciful and picked up `65` of the crew.


    ![../img/CAM344_072.jpg](img/CAM344_072.jpg)


    The veteran Dutch destroyer `Witte de With` was lost on March `1` when she was
    scuttled in `Soerabaja`. She was unable to leave with the `Exeter` group the previous
    day because she could not get her orders confirmed in time, another example of
    the weak `RNN` command and control throughout the campaign. (Netherlands Institute
    for Military History)


    ![../img/CAM344_057.jpg](img/CAM344_057.jpg)


    Another disaster to befall the US Navy late in the `NEI` campaign was the loss
    of `Langley` on February `27`. `Langley` was the US Navy’s first aircraft carrier,
    being commissioned in `1922` and later converted to a seaplane tender in `1936`.
    Though only able to make `13 knots` and despite being totally unprotected, she
    was pressed into service as an aircraft ferry to carry fighter planes to the `NEI`.
    Attack by long-range bombers south of `Tjilatjap`, she suffered five hits and
    three near misses in an attack by nine `IJN` bombers. She was abandoned, and was
    later torpedoed by destroyer `Whipple`, as shown here. (US Naval History and Heritage
    Command)


    The two Allied destroyers did not survive. `Encounter` suffered an unfortunate
    near miss by an `8in.` shell at `1135hrs` which led to the evacuation of the engine
    room and the ship going dead in the water. The destroyer’s skipper ordered his
    crew to abandon ship and the ship scuttled. Again, the Japanese were merciful
    and `149` were rescued. `Pope` survived another few hours by heading into a rain
    squall. This succeeded in losing the Japanese surface ships, but at `1300hrs`
    Japanese aircraft located the destroyer heading north to `Borneo`. Ten `F1M` “Pete”
    floatplanes dropped `132-pound bombs, followed by six `B5N1` from `Ryujo` with
    `550-pound bombs`. `Pope` avoided every bomb, but a near miss put one of the propeller
    shafts out of commission and caused progressive flooding. The skipper ordered
    the ship scuttled, which was well under way by the time `Myoko` and `Ashigara`
    showed up. The destroyer sank at `1420hrs`. Two days later, `150` men of her crew
    were picked up by a Japanese destroyer.


    ![../img/CAM344_058.jpg](img/CAM344_058.jpg)


    This Japanese photo shows heavy shells bursting around destroyer `Edsall` on March
    `1`. Under its skipper `Lt. Joshua Nix`, the well-handled ship evaded the gunfire
    of heavy cruisers `Tone` and `Chikuma` (firing `844 8in.` and `62 5in.`) and battleships
    `Hiei` and `Kirishima` (firing `297 14in.` and `132 6in.`) for over an hour until
    the intervention of dive-bombers from the `Kido Butai` sealed the destroyer’s
    fate. (US Naval History and Heritage Command)


    ![../img/CAM344_035.jpg](img/CAM344_035.jpg)

