    # 爪哇海战


    爪哇海战是太平洋战争规模最大的海战之一。共有 32 艘舰船参与了战斗，其中 5 艘沉没（全部为盟军舰），另有 8 艘受损（两艘盟军，六艘日本海军）。除了爪哇海，该战役期间还发生了四次主要水面行动。在只有巴利卡帕潘（Balikpapan）的战斗中，盟军被认为取得了胜利。双方的总体损失说明了一切。荷兰海军在战役开始时拥有三艘巡洋舰和七艘驱逐舰，最终只有轻巡洋舰`Tromp`留在水面上。亚洲舰队的损失相当严重，但并不极端。三艘巡洋舰开始了战争，其中两艘（`Boise`和`Marblehead`）幸存，尽管两者均已受损。舰队
    13 艘驱逐舰中也有 7 艘幸存。两支海军都表现得异常顽，但收效甚微。尽管英国皇家海军并未像荷兰人和美国人那样全力投入对东印度群岛（NEI）的防御，但也遭受了惨重损失。英国损失总计一艘重巡洋舰和四艘驱逐舰。澳大利亚损失了一艘轻巡洋舰。


    日本海军（IJN）完成了快速夺取东印度群岛及其关键资源设施这一至关重要的任务。在此，没有一次日本登陆被阻止甚至推迟。虽然曾出现过糟糕的战术部署为盟军提供了造成局部挫败的机会，但盟军运气太差或实力太弱，未能利用这些机会。战役期间，日本海军的损失较轻。盟军水面部队在战役期间没有击沉任何大型日本海军战斗舰，只有在巴利卡帕潘，盟军水面舰才击沉了目标。荷兰人占了战役期间损失的大多数日本运输船和战斗舰，但这些损失远低于日本人的计划。日本在东印度群岛损失的最主要战斗舰是一艘驱逐舰。共有三艘驱逐舰损失——一艘被美国潜艇击沉，一艘被荷兰潜艇击沉，第三艘被荷兰的飞机击沉。其他损失还包括一艘潜艇、四艘扫雷艇和一艘巡逻。此外，至少有
    14 艘运输船被击沉。


    ![../img/CAM344_040.jpg](img/CAM344_040.jpg)


    ## 潜艇行动与损失


    战役开始时，`RNN`在东印度群岛有 12 艘运行中的潜艇，另有三艘处于维修或预备状态。这是 1924 年拍摄的`K-XIII`，它源于 1918 年的海军计划，仅携带六枚鱼雷。与数量更多的美国潜艇相比，荷兰潜艇在进攻东印度群岛的日本登陆部队时也毫无作为。战役期间损失了四艘荷兰潜艇。在战役的最后几天，`K-X`、`K-XIII`和`K-XVIII`被困在泗水（Soerabaja）并自沉。（美国海军历史与遗产司令）


    ![../img/CAM344_054.jpg](img/CAM344_054.jpg)


    这支喇号是从休斯顿号（`USS Houston`）上发现的。这艘船是一个战争坟墓，但近年来出现了一种令人不安的趋势，印度尼西亚的废金属商正在打捞旧东印度群岛的战骸。虽然`Houston`看起来依然完完好，但其他船只如珀斯号（`Perth`）以及美英驱逐舰几乎完全消失了。（美国海军历史与遗产司令）


    ## 战术失误


    在作战层面，双方都犯了严重的错误。在巴多恩海峡（Badoeng Strait），`Helfrich`措手不及，且他的计划过于复杂。在日本入侵爪哇的前夕，`Helfrich`愚蠢地认为自己可以同时击退来自东、西两个方向对爪哇的进攻，他创建的两个打击力量进一步分散了他本就匮乏的资产。他取得成功的唯一希望是建立单一的强大打击力量，并尽全力为其提供充足的空中侦察和空中掩护。他未能确保爪哇岛上剩余的盟军航空集中在支持联合打击力量上。如果有充足的空中侦察支持加强后的打击力量，或许能够给日本海军带来沉重打击，甚至可能足以推迟或击败一支登陆部队。这并不是说盟军曾真正有机会保护爪哇岛免受海上入侵。无论从数量还是质量上，双方的力量对比都太不均衡。最终分析，盟军海军在战役中的记录（以爪哇海战为高潮）是一场失败的游行。唯一的例外是巴利卡帕潘的战斗战，当时大胆的行动创造了意外并为盟军带来了局部成功。尽管如此，必须指出，即使这种成功也没有推迟日本征服东印度群岛的时间表。


    日本在战役期间的海军部署不当，从而为盟军创造了可能的漏洞。尽管东方部队距离泗水这一主要的盟军海军基地最近，但其实力明显弱于西方部队。日本在战役后期通过分散压倒性的资源加剧了这一错误。山本（`Yamamoto`）字面上接受了巴多恩海峡战斗的报告，认为
    ABDA 联盟不再拥有有效的打击力量。因此，他没有用第一动员队（`Kido Butai`）以及近藤（`Kondo`）支援部队的舰和重巡来支援对爪哇最后的入侵并应对任何潜在的盟军海军干预，而是将这些力量部署到印度洋去拦截逃离爪哇的船只。这导致该地区四支主要的日本力量中最弱的一支要与盟军主要海军力量——多尔曼（`Doorman`）的联合打击力量作斗。在日军优势如此一边倒倾斜的情况下，山本这种分散力量的倾向并没有重大意义，但在几个月后，这成为大失败的主要因素之一。


    在整个战役期间，盟军的战术表现在各方面都很薄弱。他们从未能解决多国部队的协同难题，通信一直是一个致命的弱点。战役期间，水面战斗中没有击沉任何大型日本单位。盟军的炮击极其糟糕，命中寥寥无几。鱼雷的可靠性和性能是一个致命的劣势，这种情况持续了整个
    1942 年。


    从战术上说，东印度群岛的海战展示了日本人的实力。日本舰只在单位水平上更优，这在几次场合证明了至关重要。在巴多恩海峡，仅两艘日本驱逐舰就对规模大得多的盟军取得了战术胜利。在爪哇海，双方实力大致相当，但参战的两艘日本巡洋舰提供了足够的支撑，击败了规模最大的盟军力量之一。


    尽管日本在爪哇海取得了胜利，但也产生了一些令人担忧的原因。首要问题是日本海军所谓的赢得战争的秘密武器——`93 式`鱼雷的性能。在发射的 153 枚鱼雷中，只有三枚命中，而数十枚过早爆炸。这是`93
    式`鱼雷一个糟糕的开始，但由训练良好的船员操作的长程鱼雷这一基础在战争后期带来了丰厚的回报。尽管如此，那三枚命中的武器确实导致了三艘盟军舰船（包括两艘巡洋舰），并负责了战斗的结束。


    ![../img/CAM344_056.jpg](img/CAM344_056.jpg)


    这是埃克塞号（`Exeter`）覆没的另一个视角。电风号（`Inazuma`）救了大部分幸存者，其中包括 44 名军官和 607 名士兵。（美国海军历史与遗产司令）


