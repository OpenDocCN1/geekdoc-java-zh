    in the early morning hours of February 19 and no Allied naval units could arrive
    in time to change that fact. Helfrich should have united his available ships into
    what might have been an overwhelming force. But he did not think time was adequate
    to affect a rendezvous of the ships from several bases, and any such rendezvous
    would have to have been conducted at night, increasing the degree of difficulty.
    In any event, the inclusion of the torpedo boats into a united striking force
    was impossible, due to considerations of speed and endurance. Helfrich seems to
    have viewed his attack as a series of raids, rather than an all-out battle. If
    true, this is also hard to explain, since raids were not going to stop the  Japanese.


    The Japanese landings went off at 0200hrs on February 19 without problems. The
    battle ashore was resolved quickly in favor of the Japanese, who captured the
    airfield intact. However, at daylight, a series of air attacks began which unhinged
    the Japanese plan. By 0800hrs, 12 heavy bombers had attacked the two transports.
    No hits were scored, but the attacks delayed unloading. This was followed by an
    attack by two A-24 dive-bombers (the USAAF version of the Navy’s SBD Dauntless)
    which scored a hit on the transport Sagami Maru. In the afternoon, the Japanese
    admiral in charge of the operation ordered the ship back to Makassar, escorted
    by the destroyers Arashio and  Michishio.


    This left transport Sasago Maru still unloading, escorted by the destroyers Asashio
    and Oshio. Finally, after dark, the group departed the anchorage, but an hour
    later the transport returned to unload its eight landing craft for the use of
    the army detachment ashore. Asashio was steaming near the transport and Oshio
    was located some 3,000 yards to the  northwest.


    ![../img/CAM344_038.jpg](img/CAM344_038.jpg)


    Piet Hein, shown here in drydock in Soerabaja, was one of the seven RNN destroyers
    available at the beginning of the war. Following the fall of the Netherlands in
    May 1940, it was increasingly difficult to keep the ships of the East Indies Squadron
    operational. (US Naval History and Heritage Command)


    The first Allied attack wave arrived in the area of the anchorage just before
    2230hrs. This group was under the command of Doorman. He deployed his two cruisers
    some 5,500 yards ahead of his destroyers. Their orders were to engage with gunfire,
    while the destroyers would attack the disrupted Japanese with torpedoes. This
    was a poor plan, as a surprise torpedo attack, followed up by a gunnery attack,
    would probably have been more effective, just like at Balikpapan. The cruisers
    rushed toward the Japanese at 27 knots. Java sighted Asashio first, but the Dutch
    were slow to open fire. At 2230hrs, Asashio spotted Java and she attempted to
    illuminate the cruiser with her searchlight. The resulting engagement was very
    short and indecisive; giving credence to the notion that Helfrich intended this
    as a raid only. Java engaged the destroyer at 2,200 yards, and a round hit and
    destroyed her searchlight, killing four and wounding 11\. Another round hit Sasago
    Maru. In return, Java took a 5in. shell aft. With this, the Dutch cruisers raced
    off to the north and broke contact. Neither De Ruyter nor Oshio had fired a  shot.


    Minutes later, the Allied destroyers arrived with Piet Hein some 5,000 yards ahead
    of the two American ships. Oshio was the first to gain contact, sighting the Dutch
    destroyer at 2235hrs some 6,000 yards to the south. The Japanese turned to the
    southeast to engage. Piet Hein took Sasago Maru under fire with three torpedoes
    and her 4.7in. main battery. Once clear of the smoke laid by the Dutch destroyer,
    John D. Ford also fired three torpedoes and directed 4in. shells at the transport.
    The last destroyer in line, Pope, fired two more torpedoes at the transport. Both
    American ships claimed hits, but neither scored. At 2240hrs, Asashio engaged Piet
    Hein at a range of only 1,600 yards and subsequently also brought the American
    destroyers under fire. Pope fired two torpedoes at what was probably Asashio,
    but missed. To avoid a collision with the Dutch ship and evade Asashio to the
    east, the two American destroyers swung to the west. This left Piet Hein on her
    own; after launching two more torpedoes at Asashio, she took a 5in. shell in her
    aft boiler room. More hits followed, which set the Dutch destroyer afire and brought
    it to a stop. Before damage control measures could fully restore power, the ship
    was hit by a torpedo from Asashio at 2246hrs. The effect was devastating; the
    Dutch ship quickly capsized to starboard and sank with the loss of 64 crewmen
    including her  skipper.


    After finishing off Piet Hein, Asashio headed north to engage the American destroyers.
    The skippers of the American ships had decided to abandon their orders to proceed
    north through the strait, and headed to the east instead. Both Asashio and Oshio
    regained contact just before 2300hrs and brought the American ships under heavy
    fire with the aid of searchlights. The Americans delayed firing back to make sure
    the two contacts were not the Dutch cruisers, and then engaged the Japanese with
    guns and torpedoes. Neither side hit the other. The Japanese lost the American
    destroyers in a smoke screen, and by 2310hrs the American had escaped to the  southeast.'
