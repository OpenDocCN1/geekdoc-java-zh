  trans: '

    两支侵略船队均由高桥中将指挥。他在爪哇岛北方预留了一支由“芦形”（Ashigara）和“凤木”（Myoko）重巡洋以及两艘驱逐舰组成的预备队。爪哇岛南部是近的支持部队，拥有“龙”（Kongo）和“春云”（Haruna）战舰、三艘重巡洋和几艘驱逐舰。此外，被赋予拦截试图逃离或加强爪哇岛的盟军任务的是“联合机”（Kido
    Butai），它拥有四艘航空母舰、两艘战舰、两艘重巡洋以及一支由轻巡洋领头的驱逐舰中队。


    盟军已知这两支侵略船队的集结，赫尔里希（Helfrich）准备好部队击退这两支日本侵略军。2 月 21 日，他创建了两个独立的打击力量来完成这一任务。他声称这么做是因为两个主要基地已没有足够的燃料来供应整个盟军。西方打击队由澳大利亚皇家海军科林斯（Collins）准将指挥，由一艘重巡洋（“埃克塞特号”Exeter）、三艘轻巡洋（“澳洲号”、“霍巴特号”、“龙号”和“丹娜号”Danae）、五艘英国和一艘荷兰驱逐舰组成。该部队基地位于巴达维亚（Batavia）附近的
    Tandjong Priok。2 月 24 日，它得到了澳大利亚轻巡洋“珀斯号”（Perth）的增援。东方打击队由杜曼（Doorman）指挥，由一艘重巡洋（“休斯顿号”Houston）、两艘轻巡洋（“鲁伊特号”De
    Ruyter 和“爪哇号”Java）、三艘荷兰和四艘美国驱逐舰组成。


    一架美国水机在 2 月 25 日接触到了东方舰队。它是两支侵略船队中靠近爪哇岛的一支，由于它正前往爪哇岛的经济政治中心，因此要求全力应对。赫尔里希命令“埃克塞特”和“珀斯”巡洋舰，以及“电光号”（Electra）、“遭遇号”（Encounter）和“木星号”（Jupiter）驱逐舰从西方打击队抽离，增援杜曼的东方打击队。由于下心阻止侵略，并深知如果日本侵略军登陆，荷兰属东印度陆军将迅速被击败，赫尔里希决定命令杜曼击败日本东方舰队，然后航向爪哇岛的另一端击败西方舰队。这是一个空幻的想法，但杜曼被要求尽尽所能地执行这一愿景。


    杜曼决心积极与日本军交战，但对他们的位置没有足够的情报。2 月 26 日夜，他率领部队在马杜拉岛（Madoera Island）周围进行搜索。一无所获后，他在早晨返回泗水泗（Soerabaja），结果遭遇了每日空袭。盟军对爪哇岛的防御达到了高潮。赫尔里希在
    1155 时收到一份关于日本侵略船队位置的报告。它正向西南方向泗水泗以西的登陆区移动。这份报告于 1250 时发送给杜曼，命令其出击、执行夜袭，然后前往 Tandjong
    Priok。随后在 2055 时，收到赫尔里希的命令：“你们必须继续进攻，直到敌人被消灭。”


    杜曼那天下午召集了部队中所有船只的长官，商讨即将到来的战斗计划。打击舰队将绕过马杜拉岛北方，然后向西航行。英国和荷兰驱逐舰部署在先锋，然后是巡洋舰，最后是美国驱逐舰。与日军接触后，先锋驱逐舰将发动攻击，随后是巡洋舰远距离攻击目标，然后美国驱逐舰将执行鱼雷攻击。


    杜曼的计划留给了美国、澳大利亚和英国参与者很大的想象空间。计划中没有使用他的巡洋舰水机的规定，这些飞机被留在岸上，以防在夜战中成为火灾危险。一个小时的会议没有涵盖通信计划的核心或详细的战术计划。正如一名美国驱逐舰舰长所说：“盟军力量只不过是一支由陌生任务小组组成的列队，带着模糊的总体指令在没有具体任务进入了战斗。”杜曼将在没有连贯战斗计划、几乎无法与部队通信、且对敌人的部署和意图一无所知的情况下，出海与日本军进行一场亡死之战。这并非成功的秘诀。


    联合打击舰队于 1800 时从泗水出发，在马杜拉岛周围进行了搜索。2 月 27 日凌晨 0130 左右到达萨波埃迪海峡（Sapoedi Strait）后，杜曼按计划掉头返回泗水。在没有任何关于日本军的情报且已完成计划中的搜索后，杜曼在
    1240 时决定返回泗水加燃料。1425 时，正当“鲁伊特号”航过保护泗水的荷兰水雷区时，杜曼收到了来自一架荷兰水机的一系列令人震惊的报告——日本侵略船队仅位于泗水西北约
    50 英里处！杜曼立即调头向北，并命令其余部队跟随。如果运气好的话，盟军可以在日本侵略军将部队登陆之前将其拦截。


    ![../img/CAM344_003.jpg](img/CAM344_003.jpg)


    图中“名为号”（Nachi）显示于 1942 年 3 月，即东印度战役刚结束后，它是高木中将的旗舰，在此之前 1942 年 1 月 4 日，“凤木号”在达拉湾（Davao）附近被美国陆军的
    B-17 轰炸机击损。


    接触的过程对双方来说都不顺畅。日本侵略船队正前往泗水以西的甘甘岛（Kagan）。1000 时，侵略船队正经过巴威安岛（Bawean Island）。由于没有预料会有主要抵抗，高木未能集中兵力。最终意识到需要加强船队力量后，高木于
    0930 时命令田中舰队的大部分加入船队。在从西村处得知侵略船队正遭受空袭后，高木命令他的两艘重巡洋和最后四艘驱逐舰向南增援船队。1100 时，高木收到情报，杜曼由五艘巡洋舰和六艘驱逐舰组成的力量位于侵略船队的路径上。高木发射了“名为号”的一架水机获取更多信息，并向南加速。这架飞机在
    1235 时报告敌军力量向东移动，不久后又报告该力量转向南方。期间，西村命令侵略船队向西航行，直到危险被消除。


    日本军一度陷入混乱，但他们不会让杜曼获得攻击船队的机会。一旦杜曼一向南航行，高木便命令继续登陆，并在 1340 时将船队带回西南方向。当杜曼调头向北时，“名为号”的水机迅速将此传给高木。侵略船队再次被命令向西北航行，高木采取了集中兵力的措施，命令巡洋舰向南加速以与田中和西村的驱逐舰中队会合。西村为船队留了两艘驱逐舰，自己带着旗舰和另外六艘驱逐舰与盟军交战。尽管没有完全集中，日军力量总共有两艘重巡洋、两艘轻巡洋和
    14 艘驱逐舰。他们在 8 英寸炮上拥有优势，在 6 英寸炮上火力匮乏，但在鱼雷管上具有显著优势。

