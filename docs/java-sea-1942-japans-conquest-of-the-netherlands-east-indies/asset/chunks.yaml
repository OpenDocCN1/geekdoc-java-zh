  raw: 'Following being damaged on February 4, Marblehead did not arrive at Tjilatjap
    until two days later. In this view, casualties are being taken off the ship for
    treatment. The ship came into port with a hole in her bow and 30 flooded compartments.
    The cruiser was given a temporary patch on her bow, but full repairs could not
    be made at Tjilatjap so she was ordered back to the United States. (US Naval History
    and Heritage Command)


    The weight of Japanese air power made itself felt on February 4. After the detachment
    of three American destroyers to escort oiler Pecos and the addition of the three
    Dutch destroyers, the Combined Striking Force totaled the four cruisers and seven
    destroyers (four American and three Dutch). This force departed Soerabaja and
    transited to the east in an attempt to avoid Japanese air searches. This hope
    was quickly scuttled when at 0949hrs lookouts on Houston spotted the first Japanese
    search aircraft. On this brilliant day with unlimited visibility, the Japanese
    strike force of 36 G4M and 24 G3M aircraft, all from their new base at Kendari,
    had no difficulty spotting their target. The Japanese aviators went for the cruisers.
    The bombers were all armed with 550- and 132-pound bombs; none carried torpedoes.
    Nine bombers devoted their attention to Marblehead. On their third run, they dropped
    their bombs. The cruiser was straddled but not hit. Nine more came after Houston,
    but these also achieved no hits. The third group of seven aircraft dropped their
    bombs on Marblehead at 1027hrs. Though they were only 132-pound bombs, the two
    that hit the lightly armored cruiser caused severe damage. The first hit forward
    and started a fire; the second hit aft on the quarterdeck. It buckled the deck,
    and wrecked the steering room, jamming the rudder in a hard turn to port. A near
    miss near the port bow caused flooding. The cruiser was in bad shape. Fifteen
    crewmen were dead and 34 wounded; the ship was only able to steer in a tight circle,
    had a starboard list, and was on fire. Damage control efforts saved the ship,
    but she was no longer fit for combat  duty.


    ![../img/CAM344_050.jpg](img/CAM344_050.jpg)


    Light cruiser Marblehead at Tjilatjap, Java, after she had been damaged by a Japanese
    high-level bombing attack in the Java Sea on February 4, 1942\. This view shows
    the effect of an enemy bomb which struck her stern. The ship only possessed 1.5in.
    of horizontal armor, which allowed the small 132-pound bombs used by the Japanese
    to penetrate below decks and do critical damage. (US Naval History and Heritage
    Command)


    The next attacks at 1117hrs again focused on Houston, but her captain skillfully
    evaded all bombs. At 1126hrs, it was the turn of De Ruyter, but she also evaded
    all bombs directed at her. The final attack at 1140hrs went after Houston. All
    but the final bomb missed, but the last bomb dropped scored a devastating hit.
    After glancing off the mainmast, it exploded over the main deck aft between the
    mainmast and the No. 3 8in. gun turret. It blew a 12-foot hole in the deck and
    sent fragments into the lightly armored gun turret. These caused the powder bags
    inside to catch fire, killing the crew inside. Damage control efforts prevented
    the fire from spreading, but with 48 dead and 20 wounded, and her after 8in. turret
    out of action, Houston was badly  damaged.


    ![../img/CAM344_059.jpg](img/CAM344_059.jpg)


    During the campaign, US Navy submarines were not effective in defending against
    Japanese amphibious attacks. Perch, shown here, was one of the submarines ordered
    by Helfrich to concentrate off eastern Java to stop the Japanese invasion. Since
    the exact landing area of the Japanese was not known, the submarines were not
    deployed correctly, and they were unable to move quickly to the actual landing
    area. The Japanese and German navies would later learn the same lesson when they
    attempted to deploy submarines to repel amphibious invasions. Perch was detected
    on the night of March 1 some 35 miles north of Soerabaja. After intense attacks
    by as many as four IJN destroyers, the submarine was scuttled on March 3, but
    the entire crew was picked up by the Japanese. (US Naval History and Heritage
    Command)


    At 1225hrs, Doorman cancelled the operation and the Combined Striking Force headed
    west to Soerabaja. The two American cruisers were sent to Tjilatjap, where Hart
    had assembled all of the Asiatic Fleet’s support ships. Hart believed that Doorman
    should have pressed the attack with his undamaged ships, and Doorman was rattled
    by the entire affair. The first operation of the Combined Striking Force ended
    in fiasco, primarily because of the direct route selected for the Allied force
    to use in the face of Japanese airpower. Marblehead was forced to go to Ceylon
    for repairs and would not return. Houston, even with one of her main battery turrets
    permanently out of action, remained in the  fight.


    The action on February 4 temporarily crippled Doorman’s striking force. This meant
    that when a Japanese invasion force departed Staring Bay on February 6 with orders
    to occupy Makassar on southern Celebes, it was unopposed by Allied surface forces.
    The only defending unit in position was the American submarine S-37. She scored
    a rare early-war success for US Navy submarines by putting a torpedo into one
    of the IJN’s most modern destroyers, the Kagero-class Natsushio on 8 February
    off Makassar. The following day, salvage efforts were abandoned, and the destroyer
    sank. On February 9, the Japanese landed at Makassar and quickly occupied this
    key port. The road to Java was  open.


    ### THE INVASION OF SUMATRA


    By mid-February, Japanese plans in Southeast Asia were running ahead of schedule.
    The largest success to date was registered on February 15, when the British garrison
    on Singapore surrendered. This opened the way for the Japanese to invade Sumatra,
    the NEI’s most important island from a resource perspective. The key objective
    was Palembang on southern Sumatra. Not only were there two major airfields nearby,
    but most importantly for the Japanese, it was the site of two major oil refineries
    and large oil fields. Though located well inland, Palembang was vulnerable to
    a seaborne invasion, since it was located on the Moesi River which was navigable
    to large  ships.


    ![../img/CAM344_002.jpg](img/CAM344_002.jpg)


    Carrier Ryujo, launched in 1931, had a checkered early career. By the start of
    the war, she had been modified to address stability issues, but was still considered
    a second-line carrier because of her small flight deck and small elevators which
    made efficient aircraft-handling operations impossible. She was assigned to support
    the Philippines and NEI invasions and embarked 16 A5M4 “Claude” fighters and 18
    B5N1/2 “Kate” attack planes. Despite her limitations, and only being able to launch
    small groups of aircraft at once, Ryujo was effective during the campaign. Her
    Kates accounted for several Allied merchant ships, but when given the chance to
    attack the ABDA striking force on February 15, her aircraft hit nothing in four
    separate strikes. On February 17, her Kates atoned for their earlier poor performance
    and sank the Dutch destroyer Van Nes with three bombs. On March 1, her aircraft
    assisted in the sinking of US Navy destroyer Pope. Ryujo went on to create more
    havoc against Allied shipping in the Indian Ocean in April before being sunk by
    US Navy carrier aircraft near Guadalcanal in August. (Yamato Museum)


    ![../img/CAM344_051.jpg](img/CAM344_051.jpg)


    The Japanese attack on Palembang was spearheaded by 360 IJA paratroopers. Their
    orders were to seize the oil wells, pumps, and refineries before the Dutch could
    destroy them. Fierce initial resistance from Allied troops prevented the paratroop
    drop, shown here, from being entirely successful, but Allied resistance was crushed
    in two days. (US Naval History and Heritage Command)'
