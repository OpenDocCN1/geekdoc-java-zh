    In Southeast Asia, the Japanese quickly disproved the Allied assessment that they
    were capable of only a single invasion at a time. After crippling American airpower
    in the Philippines on the ground on `December 8`, the Japanese turned their attention
    to the Asiatic Fleet’s main base at `Cavite` in Manila Bay on `December 10` with
    a raid by 51 bombers. These proceeded to lay waste to the naval base. The bombs
    destroyed much of the navy yard with its repair and machine shops, parts and other
    stores to keep the fleet in fighting order. Submarine `Sealion`, in overhaul,
    was destroyed, and `Seadragon` was damaged. More importantly, most of the fleet’s
    replacement submarine torpedoes were lost. Destroyers `Pillsbury` and `Peary`,
    also undergoing overhaul, were damaged. Despite the fact that both destroyers
    and all the major auxiliaries were able to depart Manila and head south over the
    next few days, the raid demonstrated clearly that `Hart`’s plans of at least operating
    the submarines out of Manila were impossible. The fleet headed south, not to exposed
    Singapore, but to northwest Australia.


    Having gained control of the air, the Japanese conducted a series of landings
    in the Philippines. These began on `December 8` with a small landing on the island
    of `Batan` some 125 miles north of Luzon. A landing on the island of `Camiguin`,
    between Luzon and `Batan`, and at `Aparri` on northern Luzon followed on the `10th`.
    On `December 12`, a landing at `Legaspi` in southern Luzon went off smoothly.
    The main landing at `Lingayen Gulf` took place on `December 22`. These operations
    completely outmaneuvered the defenders and forced the Americans to retreat into
    the `Bataan Peninsula`. Here, the Americans and Filipinos held out until `April`,
    and the last of the defenders did not surrender until `Corregidor Island` fell
    on `May 6`. Though their actions were ultimately futile, the American defenders
    in the Philippines held out much longer than their British counterparts in Singapore
    or the Dutch in the NEI.


    Concurrently with their opening moves against the Philippines, the Japanese also
    invaded northern Malaya and southern Thailand. On `December 8`, Japanese troops
    conducted landings at `Singora` and `Patani` in southern Thailand and `Kota Bharu`
    in northern Malaya. Once established ashore, the Japanese 25th Army defeated the
    British at the battle of `Jitra` on `December 11`, which decided the fate of northern
    Malaya. By early January, central Malaya was lost when the Japanese smashed two
    Indian brigades at the battle of `Slim River`. By `January 25`, the British had
    decided to retreat back onto Singapore Island. The Japanese attacked across the
    `Johore Strait` on `February 8` and a week later forced the garrison to surrender.


    ### THE DESTRUCTION OF FORCE Z


    On `December 10`, the Allied naval position in Southeast Asia took a dramatic
    turn for the worse. In response to the initial Japanese invasion of northern Malaya
    and southern Thailand, the aggressive `Phillips` decided to commit his small striking
    force to defeat the Japanese invasion. `Phillips` sortied from Singapore after
    dusk on `December 8` with his entire force. He calculated that by using the monsoon
    weather to provide cover, he had a good chance to strike the Japanese landing
    force at `Singora`. The target was later changed to `Kota Bharu`, where `Phillips`
    hoped to engage the Japanese invasion force on the morning of `December 10`. Unfortunately
    for the British, any chance of surprise was quickly lost. A Japanese submarine
    spotted the force at `1345hrs` on `December 9` and Japanese aircraft picked up
    the force at `1740hrs`.


    ![../img/CAM344_046.jpg](img/CAM344_046.jpg)


    The Japanese air raid on `Cavite Navy Yard` on `December 10` eliminated it as
    a facility capable of servicing the Asiatic Fleet. This view shows the result
    of the raids with fires burning and heavy smoke. The submarine bow visible at
    the far right is probably `Sealion`, which had been hit by bombs and had settled
    by the stern. (US Naval History and Heritage Command)


    ![../img/CAM344_045.jpg](img/CAM344_045.jpg)


    This Japanese photograph shows `Force Z` under attack on `December 10`. `Prince
    of Wales` is moving at speed at the bottom of the photograph and `Repulse` at
    the top of the image is surrounded by bomb explosions. The destruction of these
    two capital ships changed the naval balance in Southeast Asia. (US Naval History
    and Heritage Command)


    About two hours later, `Force Z` came within some 22 miles of the IJN force, which
    was searching for it in the hope of engaging the British in a night action. At
    about the same time, `Phillips` decided to abandon the operation and head back
    to Singapore. However, at `2355hrs`, a report reached the admiral that the Japanese
    had landed at `Kuantan`, which was then about 120 miles from `Force Z`’s position.
    `Phillips` changed course to the southwest to investigate the report. Arriving
    at `0800hrs`, `Phillips` sent an aircraft from `Prince of Wales` and a destroyer
    to investigate. They found nothing since the report was entirely false. Instead
    of resuming his transit south to the relative safety of Singapore, `Phillips`
    decided to investigate another false report of some barges off `Kuantan`. This
    proved to be a fatal delay.


    The British were totally ignorant of the threat to `Force Z` posed by land-based
    IJN aircraft. They assessed that if they stayed 400 miles from the nearest Japanese
    airfield they would be beyond the range of effective attack. Even if the Japanese
    managed to hit `Force Z`, it would be only with high-level bombers like the British
    were accustomed to in the Mediterranean, and not the much-more-deadly torpedo
    aircraft. On both accounts, British intelligence was grossly inaccurate. Japanese
    `G3M “Nell"` and `G4M “Betty"` aircraft flying from airfields around the Saigon
    area had the range to strike as far south as Singapore itself. Both types of aircraft
    could carry the `Type 91` torpedo, and their highly trained crews were also capable
    of hitting ships with bombs from `10000ft`. The IJN massed a large force of long-range
    attack aircraft in Indochina with the mission of neutralizing `Force Z`. On `December
    10`, a total of 85 G3M` and `G4M` aircraft took off between `0625` and `0800hrs`
    to find and attack `Force Z`.


    Just as fuel was becoming critical for the Japanese, a reconnaissance aircraft
    sighted `Force Z` at `1015hrs`. The first of the strike groups sighted the British
    ships at `1100hrs` and began the first of a series of attacks. Eight `G3M` bombers
    made a level attack on `Repulse` and scored a single hit, which caused minor damage.
    The next attack by 17 `G3Ms` carrying torpedoes decided the outcome of the battle.
    Eight went after `Prince of Wales` and scored two hits. One of these doomed the
    battleship. It struck abeam the rear `14in` gun turret and caused the outer propeller
    shaft to buckle and several compartments to flood. The resulting flooding caused
    an 11.5-degree list and reduced speed to 15 knots. The other torpedo-carrying
    `G3Ms` went after `Repulse`, but the old battlecruiser dodged all nine torpedoes,
    as well as the bombs from another six aircraft. The next wave featured eight `G3Ms`
    which all launched their torpedoes at `Repulse`; again, the well-handled battlecruiser
    emerged unscathed. The following wave of 26 `G4Ms` with torpedoes delivered the
    coup de grace to `Force Z`. Six attacked `Prince of Wales`, which was unable to
    maneuver; four hits were recorded. Twenty `G4Ms` went after `Repulse`. This time,
    the attackers executed a pincer attack that placed five torpedoes on the battlecruiser.
    Unable to take this type of damage, the ship sank at `1233hrs` with the loss of
    513 men.

