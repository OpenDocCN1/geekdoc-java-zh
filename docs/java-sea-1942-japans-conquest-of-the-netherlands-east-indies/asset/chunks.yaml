    Both invasion convoys were under command of Vice Admiral Takahashi. He held a
    reserve of heavy cruisers `Ashigara` and `Myoko` and two destroyers north of Java.
    South of Java was Kondo’s support force with battleships `Kongo` and `Haruna`,
    three heavy cruisers, and several destroyers. Also assigned the mission of picking
    off Allied units attempting to flee from or reinforce Java was the `Kido Butai`
    with four fleet carriers, two battleships, two heavy cruisers, and a destroyer
    squadron led by a light cruiser.


    The massing of the two invasion convoys was known to the Allies, and Helfrich
    prepared his forces to repel both Japanese invasion forces. On February 21, he
    created two separate striking forces to accomplish this mission. His stated reason
    for doing so was because adequate fuel no longer existed at either of the two
    major bases to supply the entire Allied force. The Western Striking Force was
    commanded by Royal Australian Navy Commodore Collins and consisted of one heavy
    cruiser (`Exeter`), three light cruisers (`Australian`, `Hobart`, `Dragon` and
    `Danae`), five British, and one Dutch destroyers. The force was based at `Tandjong
    Priok` near Batavia. On February 24, it was reinforced by the Australian light
    cruiser `Perth`. The Eastern Striking Force was under Doorman’s command and consisted
    of one heavy cruiser (`Houston`), two light cruisers (`De Ruyter` and `Java`),
    three Dutch, and four American destroyers.


    An American flying boat gained contact on the Eastern Force on February 25. It
    was the closer of the two invasion convoys to Java and since it was headed for
    the economic and political center of Java, it demanded an all-out response. Helfrich
    ordered the cruisers `Exeter` and `Perth`, and destroyers `Electra`, `Encounter`,
    and `Jupiter` to detach from the Western Striking Force to reinforce Doorman’s
    Eastern Striking Force. Determined to stop the invasion, and knowing that if the
    Japanese invasion force got ashore that the Royal Netherlands East Indies Army
    would be quickly defeated, Helfrich decided that he would order Doorman to defeat
    the Japanese Eastern Force, and then to steam to the other end of Java to defeat
    the Western Force. It was a flight of fancy, but Doorman was left to execute this
    vision as best he could.


    Doorman was determined to aggressively engage the Japanese, but possessed no adequate
    intelligence on their location. On the night of February 26, he took his force
    out to make a sweep around `Madoera Island`. Finding nothing, he returned in the
    morning to `Soerabaja` only to be subjected to the daily air attack. The Allied
    defense of Java reached its climactic moment. Helfrich received a report at `1155hrs`
    of the location of the Japanese invasion convoy. It was headed southwest to its
    landing area west of `Soerabaja`. This report was sent to Doorman at `1250hrs`
    with the order to sortie, execute a night attack, and then to head to `Tandjong
    Priok`. This was followed at `2055hrs` with order from Helfrich reading “You must
    continue attacks until the enemy is destroyed.”


    Doorman assembled the skippers of all the ships in his force that afternoon to
    go over the plan for the coming battle. The Striking Force would sweep around
    `Madoera Island` to the north, then steam to the west. The British and Dutch destroyers
    were deployed in the vanguard, then the cruisers, followed by the American destroyers.
    When contact was made with the Japanese, the vanguard destroyers would attack,
    followed by the cruisers engaging targets from a distance, and then the American
    destroyers would execute a torpedo attack.


    Doorman’s plan left much to the imagination of the American, Australian, and British
    participants. No provision was made to use his cruiser floatplanes, which were
    left ashore so as not to become a fire hazard in a night battle. The one-hour
    conference did not cover the essentials of communications plans or detailed tactical
    plans. In the words of an American destroyer skipper, “The Allied Force was little
    more than a column of strange task groups which entered the battle with a vague
    general directive and no specific missions.” Doorman was going to go to sea for
    a do-or-die battle with the Japanese without a coherent battle plan, with little
    ability to communicate with his force, and with little idea as to the enemy’s
    dispositions and intentions. It was not a recipe for success.


    The Combined Striking Force departed `Soerabaja` at `1800hrs` and conducted a
    sweep around `Madoera Island`. After reaching the `Sapoedi Strait` at about `0130hrs`
    on February 27, Doorman turned back to the east to return to `Soerabaja` as planned.
    Without any intelligence on the Japanese, and having completed his planned sweep,
    Doorman decided at `1240hrs` to return to `Soerabaja` to refuel. At `1425hrs`,
    just as `De Ruyter` was steaming through the Dutch minefields protecting `Soerabaja`,
    Doorman received a series of electrifying reports from a Dutch flying boat – the
    Japanese invasion convoy was only some 50 miles northwest of `Soerabaja`! Doorman
    immediately reversed course to the north and ordered the rest of his force to
    follow. With any luck, the Allied force could catch the Japanese invasion force
    before it delivered its troops ashore.


    ![../img/CAM344_003.jpg](img/CAM344_003.jpg)


    `Nachi`, shown here in March 1942 just after the completion of the NEI campaign,
    was Rear Admiral Takagi’s flagship after `Myoko` was damaged on January 4, 1942
    by USAAF `B-17s` near `Davao`, `Mindanao`. For the remainder of the campaign,
    `Nachi` and `Haguro` were the centerpieces of the covering force for a series
    of invasions in the eastern NEI. Given a chance to engage Allied ships on February
    27 at the battle of Java Sea, she sank the Dutch cruiser `Java`. On March 1, she
    participated in the destruction of British `Exeter`. `Nachi` survived until November
    1944, when she was sunk by US Navy aircraft in `Manila Bay`. (Yamato Museum)


    The approach to contact was not smooth for either side. The Japanese invasion
    convoy was making for `Kagan`, located to the west of `Soerabaja`. At `1000hrs`,
    the convoy was passing `Bawean Island`. Since he was not expecting major opposition,
    Takagi had failed to concentrate his forces. Finally realizing that he needed
    to reinforce the convoy, Takagi ordered most of `Tanaka’s` ships to join with
    the convoy at `0930hrs`. Upon hearing from `Nishimura` that the convoy was under
    air attack, Takagi ordered his two heavy cruisers last four destroyers south to
    reinforce the convoy. At `1100hrs`, Takagi received information that Doorman’s
    force of five cruisers and six destroyers was in the path of the invasion convoy.
    Takagi launched one of `Nachi’s` floatplanes to get additional information and
    increased his speed to the south. This aircraft reported that the enemy force
    was headed east at `1235hrs`, and a short time later relayed that the force had
    changed course to the south. In the meantime, `Nishimura` ordered the convoy to
    head west until the danger was neutralized.


    The Japanese were temporarily confused, but were not going to let Doorman get
    a clean shot at the convoy. As soon as Doorman had headed south, Takagi ordered
    the landing to continue and brought the convoy back to the southwest at `1340hrs`.
    When Doorman reversed his course and headed north, the floatplane from `Nachi`
    quickly relayed this to Takagi. The convoy was again ordered to head to the northwest
    and Takagi took measures to concentrate his force by ordering his cruisers to
    increase speed to the south to link up with `Tanaka’s` and `Nishimura’s` destroyer
    squadrons. `Nishimura` left two destroyers with the convoy, but took his flagship
    and six more destroyers to engage the Allies. Though not fully concentrated, the
    Japanese force totaled two heavy cruisers, two light cruisers, and 14 destroyers.
    They held superiority in 8in. guns, were deficient in 6in. guns, but held a considerable
    advantage in torpedo tubes.

