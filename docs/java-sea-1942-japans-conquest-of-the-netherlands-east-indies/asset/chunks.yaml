    well. First, they fought off an attack by two Dutch light cruisers which failed
    to press home their advantage, then they overwhelmed a single Dutch destroyer,
    and finally they chased off two American destroyers. The second wave gained temporary
    surprise but failed to press its advantage. The cost of the battle was considerable
    for the Allies. One destroyer (Piet Hein) was sunk and the light cruiser Tromp
    was forced to Australia for repairs, which took her out of the campaign. The American
    destroyer Stewart was sent to a drydock in Soerabaja for repairs. Unfortunately,
    the drydock collapsed and Stewart’s fighting days were over. She was later salvaged
    by the Japanese and served in the IJN as a patrol boat for the remainder of the
    war. The Japanese believed they had done more damage, claiming two of the three
    destroyers sunk in the first wave with the third heavily damaged. Total Japanese
    claims were two cruisers and three destroyers sunk and two destroyers heavily
    damaged. Yamamoto accepted these claims as ground truth, which seemingly accounted
    for a large proportion of ABDA’s remaining assets. The battle was not without
    loss for the Japanese. Michishio was heavily damaged and was towed to Makassar
    for repairs which took the better part of 1942\. Asashio was lightly damaged,
    and Oshio suffered moderate damage. Overall, the battle was another example of
    Allied naval ineffectiveness. They were caught off balance and reacted too slowly
    to stop another Japanese landing, and when they did show up, they were outfought
    by a smaller Japanese  force.


    ### THE JAPANESE APPROACH TO JAVA


    The Japanese landings on Sumatra in the west and Bali in the east left Java as
    the only major island in the NEI still held by the Allies. The Japanese had maintained
    a quick pace in their advance through the NEI, and with their final prize now
    within reach, they commenced a plan to seize Java before it could be reinforced.
    This called for landings on both the eastern and western parts of the  island.


    The first to move was the Western Force. It departed Cam Ranh Bay on February
    18 with an invasion fleet of 56 transports. On board was the headquarters of the
    16th Army, responsible for the occupation of Java, an entire infantry division,
    and another infantry regiment. A large close escort force was provided which consisted
    of three light cruisers and 13 destroyers. The covering force consisted of Ozawa’s
    flagship heavy cruiser Chokai, the four Mogami-class heavy cruisers of Sentai
    7 under Rear Admiral Kurita, and several destroyers. The light carrier Ryujo remained
    with the Western  Force.


    On February 19, the Eastern Force departed Jolo in the northern Celebes Sea with
    an invasion fleet of 41 transports carrying another complete infantry division.
    The IJN provided an escort built around Rear Admiral Takagi’s two heavy cruisers
    from Sentai 5 and the Destroyer Squadron 2 under Rear Admiral Tanaka. Close escort
    for the invasion convoy consisted of Destroyer Squadron 4 under Rear Admiral Nishimura
    reinforced with four minesweepers, six submarine chasers, and a  minelayer.


    ![../img/CAM344_001.jpg](img/CAM344_001.jpg)


    Seaplane carrier Mizuho was flagship of the 11th Seaplane Tender Division, which
    played an important role in the NEI campaign. Beginning with the occupation of
    Menado in January, she was active for the entire campaign culminating in the landing
    on eastern Java in late February. Against spotty Allied air resistance, these
    ships provided effective air cover, though they carried only floatplanes. On March
    1, together with seaplane carrier Chitose, F1M “Pete” floatplanes gained a near
    miss on destroyer Pope with 132-pound bombs which slowed her down and led to her
    destruction. Following the NEI campaign, Mizuho was sunk on May 1, 1942 in Japanese
    home waters by the American submarine Drum. Had she not been sunk, she would have
    most likely been converted into an aircraft carrier. (Yamato Museum)'
