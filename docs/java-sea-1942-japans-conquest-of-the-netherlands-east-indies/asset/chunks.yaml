  trans: '


    `Exeter`、`Encounter` 和 `Pope` 在 `Binford` 出发两小时后，最初向北行驶，随后向西转向。获得奇袭至关重要，因为 `Exeter`
    仅剩余 20% 的 `8in.` 弹，而 `Encounter` 则没有鱼雷。当一架日本飞机报告了他们的离开时，获得奇袭的希望很快破灭。到 `2300hrs`，`Exeter`
    的指挥官已获悉 `巽他海峡` 正在战斗。这本应是一个危险信号，促使他忽略命令并尝试新路线，但他并没有这样做。第二天早晨，这支小部队在空旷的海域向西行进，并希望能够逃脱。但当
    `0750hrs` 英国军在西南方向发现 `Nachi` 和 `Haguro` 时，任何乐观的理由也随之幻灭。`Exeter` 转向东方，希望自己未被发现，但日本军已经调集援军来合围圈圈。这是高桥中将的支持部队，由重巡巡洋
    `Ashigara` 和 `Myoko` 组成，并由逐舰 `Akebono` 和 `Ikazuchi` 护航，这些舰此前一直守在婆罗洲岛南部。现在他们获得了交战的机会。大约
    `0935hrs`，他们与 `Exeter` 取得了接触。


    ![../img/CAM344_015.jpg](img/CAM344_015.jpg)


    `Ikazuchi` 是一艘 `Group III 特型逐舰`，图中显示的是她在约 `1938` 年航行中的状态。她曾在占领`安汶`、`望加锡`和`提汶`期间活跃。3
    月 `1` 日，她协助摧毁了 `Exeter`。（美国海军历史与遗产司令）


    ![../img/CAM344_016.jpg](img/CAM344_016.jpg)


    图中展示的是战前的 `Akebono`（`Group II 特型逐舰），她在 `NEI`（东印度群岛）战期间在`菲律宾`和`马来亚` 都非常活跃。她参与了
    3 月 `1` 日对 `Exeter` 的最后一次鱼雷攻击。


    四艘 `IJN`（日本海军）重巡洋舰的出现让 `Exeter` 的舰长别无选择。他命令他的小部队向东行驶以逃生。`Exeter` 机舱人员的努力将其速度提升到了
    `23 knots`，但由于这比追击的日本船慢 `10 knots`，因此没有逃脱的希望。战斗于 `1010hrs` 开始，盟军逐舰与 `Akebono`
    和 `Ikazuchi` 火。`1020hrs`，`Ashigara` 和 `Myoko` 加入战斗，在水上上飞机的修正火力帮助下，从 `25,000 yards`
    外攻击 `Exeter`。`Encounter` 和 `Pope` 制造烟幕以保护 `Exeter`，在战斗的第一小时里，日本军未能命中。然而，日本军继续逼近，`Ashigara`
    和 `Myoko` 位于 `Exeter` 的左后方，`Nachi` 和 `Haguro` 在其侧翼航行。另外两艘逐舰 `Kawakaze` 和 `Yamakaze`
    加入了搜捕。


    ![../img/CAM344_055.jpg](img/CAM344_055.jpg)


    在由日本水上飞机拍摄的照片中，可以看到 `Exeter` 正向右舷倾斜并覆没。她的舰长在失去动力且无法继续战斗后下达了自沉命令。（美国海军历史与遗产司令）


    盟军舰舰进行了勇敢的战斗。`Exeter` 和 `Pope` 向 `Ashigara` 发射了鱼雷，但未命中。`Pope` 进行了另一次鱼雷攻击，向 `Ashigara`
    发射了四枚，向 `Nachi` 发射了五枚，但这些也落空。到 `1115hrs`，`Nachi` 和 `Haguro` 已接近到 `17,000 yards`
    并用主炮开火。从 `1119hrs` 开始，`Nachi`、`Haguro`、`Kawakaze` 和 `Yamakaze` 都发射了四枚鱼雷，但全部落空。随后在
    `1120hrs` 遭到了致命打击，一枚 `8in.` 炮弹击中了 `Exeter` 的其中一个锅炉。这一击比在`爪哇海`遭受的还要严重；巡洋舰失去了动力，这意味着她既不能战斗也无法逃。四艘日本巡洋舰继续向无助的
    `Exeter` 射击 `8in.` 并发射了额外的鱼雷。唯一命中的日本鱼雷来自 `Ikazuchi`，而且仅是在英国人弃船时。该巡洋舰于 `1200hrs`
    沉没。这一次，`IJN` 算仁慈，救了 `65` 名人员。


    ![../img/CAM344_072.jpg](img/CAM344_072.jpg)


    老牌的荷兰逐舰 `Witte de With` 于 3 月 `1` 日在`泗水` 自沉。她在前一天之所以没能与 `Exeter` 编队一同离开，是因为她无法及时确认命令，这是整个战役期间
    `RNN`（荷兰海军）指挥与控制薄弱的另一个例子。（荷兰军事历史学会）


    ![../img/CAM344_057.jpg](img/CAM344_057.jpg)


    `NEI` 战役后期美国海军遭遇的另一场灾难是 2 月 27 日 `Langley` 号的损失。`Langley` 是美国海军的第一艘航空母舰，1922 年服役，后于
    `1936` 年改装为水上飞机母舰。尽管航速仅 `13 knots` 且完全没有保护，她仍被征用作为飞机运输舰，将战斗机运往 `NEI`。在 `Tjilatjap`
    南方遭到远程轰炸机的攻击后，她在九架 `IJN` 轰炸机的袭击中遭受了五次命中和三次擦肩。她被遗弃了，随后被逐舰 `Whipple` 鱼雷击中，如图中所示。（美国海军历史与遗产司令）


    两艘盟军逐舰并未幸存。`Encounter` 在 `1135hrs` 遭遇了一次不幸的 `8in.` 炮弹擦肩，导致机舱疏散，船只失去动力。逐舰舰长命令船员弃船，船只自沉。日本军再次表现仁慈，救了
    `149` 人。`Pope` 通过进入雨暴又多生存了几个小时。这成功地摆脱了日本的水面舰艇，但在 `1300hrs`，日本飞机发现了这艘向`婆罗洲` 行进的逐舰。十架
    `F1M`“皮特”水上飞机投掷了 132 磅弹，随后是`龙翔` 的六架 `B5N1` 投放了 550 磅弹。`Pope` 避开了所有的炸弹，但一次擦肩导致一个螺旋轴损坏并引起持续进水。舰长命令船自沉，等
    `Myoko` 和 `Ashigara` 赶到时，船已无法航行。该逐舰于 `1420hrs` 沉没。两天后，她的 150 名船员被一艘日本逐舰救起。


    ![../img/CAM344_058.jpg](img/CAM344_058.jpg)


    这张日本照片显示了 3 月 `1` 日在逐舰 `Edsall` 周围爆炸的重弹。在 `Joshua Nix` 上尉的指挥下，这艘操控良好的船只避开了重型巡洋舰
    `Tone` 和 `Chikuma`（发射了 844 枚 8 英制弹和 62 枚 5 英制弹）以及战 `Hiei` 和 `Kirishima`（发射了 297
    枚 14 英制弹和 132 枚 6 英制弹）的火力了一个多小时，直到“第一舰队”俯冲炸机的介入决定了这艘逐舰的命运。（美国海军历史与遗产司令）


