- fmt: '

    In the remaining daylight, Takagi assessed his next move. Doorman’s force was
    headed to the east, apparently returning to base. The explosions of many torpedoes,
    which were actually `Type 93s` exploding prematurely, indicated heavy Allied losses.
    The Japanese had moved close to the shore of Java, and Takagi wanted to avoid
    running into a Dutch minefield. The battle appeared over, so Takagi ordered his
    combatants north to regroup and for the convoy to head south to its landing area.


    Doorman had taken losses, but remained determined to get at the invasion convoy.
    At `1831hrs`, he changed course to the northeast. He had no information on the
    location of the convoy, but presumed it to be somewhere to his north. His force
    had been whittled down to the four remaining cruisers, the destroyer `Jupiter`
    and the four American destroyers, none of which had any torpedoes remaining and
    all of which were running low on fuel.


    ![../img/9781472831613_Map007.jpg](img/9781472831613_Map007.jpg)


    Battle of the Java Sea: Fourth Phase, `1900–1950hrs`


    #### The night phase


    The change of course by the Combined Striking Force was reported to Takagi within
    minutes of it occurring, this time by an aircraft from `Jintsu`. Takagi tried
    to reassemble his force to meet Doorman’s thrust. This took a while since the
    various destroyer divisions were spread all over in the aftermath of the massed
    torpedo attack. The last of Tanaka’s three divisions were not rounded up until
    `1907hrs`. Two of Nishimura’s destroyers, `Asagumo` and `Minegumo`, both of which
    were damaged, headed off to join the convoy and were out of the fight.


    Doorman’s move to the north temporarily caught Takagi off guard. At `1904hrs`,
    he ordered the convoy to again move to the north to escape danger. More dangerously,
    `Nachi` and `Haguro` were in the process of recovering their floatplanes, which
    meant they had come to a stop and were potentially vulnerable. The Japanese cruisers
    were not spotted in this condition from `1857` to `1922hrs`, and once underway
    again lookouts aboard the cruisers spotted the Allied formation to the southeast.
    Tanaka’s squadron stumbled briefly into a position between the two cruiser forces
    and came under fire at `1933hrs` from `Houston` and `Perth`. `Jintsu` replied
    with four torpedoes, which missed.


    Still determined to get through to the transports, Doorman changed course to the
    east with the intent of coming south toward the coast to get around the Japanese.
    At `2100hrs`, he was headed again to the west. At this point, the commander of
    the four American destroyers, Commander Thomas H. Binford, decided to take his
    ships and head back to `Soerabaja` only some 50 miles to the east. His stated
    reason was that he was out of torpedoes and almost out of fuel. In addition, Binford
    was wary of following Doorman into an impossible fight. Of all the ships which
    began under Doorman’s command on the morning of February 27, only Binford’s four
    destroyers were still afloat on the evening of March 2.


    ![../img/CAM344_075.jpg](img/CAM344_075.jpg)


    The most powerful Allied destroyer in the campaign, the British `Jupiter`, was
    sunk by a drifting Dutch mine. The explosion occurred in one of the ship’s engine
    rooms, which flooded the room and the boilers and caused a loss of power. Slow
    flooding sank the ship four hours later with the loss of 70 crewmen. (Netherlands
    Institute for Military History)


    ![../img/9781472831613_Map008.jpg](img/9781472831613_Map008.jpg)


    Battle of the Java Sea: Fifth Phase, `2300–2400hrs`


    ![../img/CAM344_074.jpg](img/CAM344_074.jpg)


    The crew of `De Ruyter` pictured on the quay at the `Soerabaja` naval base. Of
    her crew of 437, 235 were lost when the ship was hit by a single torpedo. When
    the crew was ordered to abandon ship, it did so in a chaotic way, and many were
    lost even though it took the ship two and a half hours to sink after being torpedoed.
    (Netherlands Institute for Military History)


    The departure of the American destroyers left only five ships under Doorman’s
    command – the four cruisers and `Jupiter`. Destroyer `Encounter` was straggling
    behind, trying to catch up. A floatplane from `Naka` had relieved `Jintsu`’s aircraft
    and used flares to mark the progress of the Allied force. More bad luck dogged
    the Allies. At `2125hrs`, just as Doorman was leading his force north in a final
    attempt to find the transports, `Jupiter` hit a Dutch mine. The ship lost power,
    and foundered hours later.


    The Allied force continued north in its vain search for the invasion convoy. At
    this point both sides were exhausted and low on ammunition. `Perth` had only 160
    6in. rounds remaining, and `Houston` was down to some 300 8in. shells. Doorman
    refused to consider breaking off the action, but the battle would soon come to
    an end whether he wanted it or or not. At `2200hrs`, Takagi lost radio contact
    with `Naka`’s floatplane, leaving him blind for the first time in the battle.
    He nervously steered a course to the south with his two cruisers and ordered his
    destroyer squadrons to join him. Not until `2302hrs` did a lookout on `Nachi`
    spot Doorman’s column some 16000 yards to the southeast. The Japanese cruisers
    turned north to assume a parallel track and prepared to make a torpedo attack.
    The Allied cruisers spotted Takagi’s ships at `2310hrs` and opened fire. The Japanese
    returned a slow fire at `2321hrs`. They had only one-third of their 8in. shells
    remaining, but the Japanese did have enough `Type 93` torpedoes for a final salvo.
    This was launched at `2322hrs` with `Nachi` contributing eight torpedoes and `Haguro`
    four. The range was some 14000 yards. Doorman made an attempt to maneuver in expectation
    of torpedo attack, but it was too late.


    Two of the 12 torpedoes hit. At `2336hrs`, a `Type 93` from `Nachi` hit `Java`
    aft. The impact of the 1078-pound warhead caused the aft magazine to explode which
    blew off some 100 feet of the cruiser’s stern. Given the cruiser’s inadequate
    compartmentation, this was a fatal blow. The crew was ordered to abandon ship,
    and within 15 minutes of being hit, `Java` sank with the loss of all but 19 of
    her crew of 528. Probably thinking that the torpedo threat had passed, `De Ruyter`
    made a turn to starboard exposing her broadside to the four torpedoes from `Haguro`.
    One hit aft and created a large fire that engulfed the entire stern portion of
    the ship. Power was also lost, which made it impossible to put out the fire. De
    Ruyter` sank during the night at `0230hrs` with 344 men. Among the casualties
    was Doorman, who refused to leave the ship.


    With these crushing blows, the battle came to an end. `Houston` and `Perth` changed
    course and headed to the southeast. No attempt was made to rescue the survivors
    of the Dutch cruisers per Doorman’s orders that there should be no attempt made
    to rescue survivors. The Japanese destroyers attempted to engage the remaining
    Allied ships, but were unable to do so in the smoke and confusion. The following
    day at noon, the two surviving ships arrived at `Tanjung Priok`.


    ### THE ALLIED ROUT IS COMPLETE

