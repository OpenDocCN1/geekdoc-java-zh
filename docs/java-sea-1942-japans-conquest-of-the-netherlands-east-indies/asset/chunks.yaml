    Hart’s tenure as `ABDAFLOAT` was brief and was marked by political assaults from
    General Douglas MacArthur and the Dutch authorities. By February 5, Admiral Ernest
    King, Commander-in-chief of the US Fleet, informed Hart that he should ask to
    be relieved on health grounds since he had lost the support of the Dutch, MacArthur,
    Wavell, and even President Roosevelt. His relief was driven by MacArthur and the
    Dutch, who wanted to scapegoat him for the failure to defend the `NEI`. As of
    February 12, the position of `ABDAFLOAT` was held by a Dutch admiral. With the
    departure of Hart, there was not a single American naval officer with a significant
    role in ABDA Command.


    Vice Admiral Conrad E. L. Helfrich was the commander of Dutch naval forces. He
    was born in the `NEI` and so had a special interest in its defense. His sea and
    command time was limited, but he returned to the `NEI` in 1931 and by 1939 he
    was named commander of East Indies Naval Forces and promoted to vice admiral the
    next year. He was bitter when Hart was named `ABDAFLOAT` instead of himself and
    he failed to cooperate with Hart and immediately began a campaign to undermine
    him. Hart’s headquarters was not collocated with Helfrich’s in Batavia, the Dutch
    naval base on western Java, and Hart essentially ignored him. Helfrich could only
    track ABDA naval operations through a liaison officer at Hart’s headquarters.
    Helfrich returned the favor by being as uncooperative as possible with Hart, especially
    when it came to making Dutch ships available for operations. This changed when
    Hart left the `NEI` and turned over command to Helfrich on February 12. Helfrich
    was the key player in the later stages of the naval campaign in the `NEI`. He
    was a complex figure and ranged from being an arrogant bully to a reliable member
    of the Allied command team. His overriding instinct was to be as aggressive as
    possible in attacking the invading Japanese. This aggression became irrational
    in the later part of the campaign when he sacrificed not only Dutch but American,
    British, and Australian lives in a futile defense of Java. After directing much
    futile bloodshed, he escaped from Java by air to assume the paper position of
    Commander of Dutch Naval Forces in the Far East for the remainder of the war.


    Tactical command of Dutch naval forces and later command of ABDA’s Combined Striking
    Force when it was established on February 1 was given to Rear Admiral Karel W.
    F. M. Doorman. He was a 1910 graduate of the Royal Netherlands Naval College and
    became a naval aviator in 1915. After a Naval Staff College tour and various command
    tours on destroyers and cruisers, he was appointed commander of the Naval Air
    Service on the `NEI`. This was followed by a promotion to flag rank in May 1940
    and the assumption of the command of the East Indies Squadron. Doorman is a difficult
    figure to assess, especially in light of his actions during the campaign. He was
    undoubtedly competent and respected by his peers and subordinates in the Royal
    Netherlands Navy. He could be charming and showed obvious care for the men under
    his command.


    ![../img/CAM344_064.jpg](img/CAM344_064.jpg)


    Rear Admiral Doorman was the man charged with executing Helfrich’s orders to attack
    the onrushing Japanese with relentless determination. He was unable to conduct
    an effective attack at any point during his tenure as commander of the Combined
    Striking Force. In his final action, he attacked with the determination that Helfrich
    demanded, but at the cost of his own life and much of the force under his command.
    (Netherlands Institute for Military History)


    Days after being appointed commander of the Combined Striking Force, he led an
    ill-fated operation to attack Japanese shipping at Makassar. In consultation with
    Hart, he selected a direct route to the target and was subjected to intense air
    attack. Two American cruisers were damaged, with heavy casualties and Doorman
    was rattled by the affair. Doorman subsequently aborted another operation to attack
    an invasion convoy after being subjected to air attack. By the eve of the Java
    Sea battle, the other Allied naval commanders were fed up with Doorman. He had
    achieved nothing in his tenure as commander of the Striking Force and had “run
    away” on several occasions. There was even talk of replacing him on the eve of
    the battle, but in the end it was judged unwise to replace the commander at such
    a late stage, so Doorman remained in charge. Under pressure from Helfrich, and
    perhaps determined to allay fears he was not a fighter and to defend his homeland,
    at the battle of the Java Sea he displayed a real tenacity to close with and defeat
    the Japanese, whatever the cost. Few admirals during the war showed the same degree
    of determination. This determination came at the price of the destruction of his
    command which has led to his post-war reputation as being brave but stupid. He
    deserved better then and now, since he was caught in an impossible situation commanding
    an inferior force trying to carry out the orders of his superior officer who had
    little consideration for the men under his command.


    British naval forces were initially under the command of acting Admiral Tom Phillips
    until his death on his flagship Prince of Wales on December 10. Vice Admiral Geoffrey
    Layton took back his old job as commander of the Eastern Fleet upon the death
    of Phillips. British naval units in the ABDA area were technically under the command
    of the Eastern Fleet. Layton remained in this position until March, when Vice
    Admiral Sir James Somerville arrived with reinforcements for the Eastern Fleet.
    Commodore John A. Collins, RAN, exercised actual control of British naval units
    in the `NEI`.


    ## OPPOSING FLEETS


    ### IMPERIAL JAPANESE NAVY


    The primary operational entity of the `IJN` was the Combined Fleet. In turn, the
    Combined Fleet was broken down into a number of fleets. The fleets became the
    basis for major forces allocated operational missions, but the entire structure
    was very flexible, since ships and divisions could be easily shifted from one
    fleet to the other to meet operational requirements.


    For the `NEI` campaign, Japanese naval forces were pulled from the Second and
    Third Fleets. The Second Fleet, also known as the Scouting Force, was based on
    Hainan Island and was assigned 11 heavy cruisers, including the four Atago-class
    ships of `Sentai 4`, three Myoko-class ships of `Sentai 5`, and all four Mogami-class
    ships of `Sentai 7`. Also assigned to the Second Fleet were Destroyer Squadrons
    2 and 4. Each of these was assigned a 5,500-ton light cruiser as a flagship, and
    several divisions of destroyers up to a nominal full strength of 12 ships.


    The Third Fleet, based on Formosa, was also known as the Blockade and Transport
    Force, which well described its wartime missions. Under its direct control was
    a heavy cruiser, two older light cruisers, and Destroyer Squadron 5 with a light
    cruiser flagship and two divisions of older destroyers, totaling eight ships.
    In addition, the First and Second Base Forces were allocated for the conduct of
    landing operations. Each was comprised of a large number of transports and smaller
    combatants including patrol boats, minesweepers, minelayers, submarine chasers,
    and gunboats.


    ![../img/CAM344_014.jpg](img/CAM344_014.jpg)


    The four Mogami-class heavy cruisers of `Sentai 7`, three of which are shown here
    in 1938, were the most powerful ships in Vice Admiral Ozawa’s Malaya Unit. Of
    these, Mogami and Mikuma were active in the battle of the Sunda Strait on March
    1, which resulted in the destruction of two Allied cruisers. (US Naval History
    and Heritage Command)

