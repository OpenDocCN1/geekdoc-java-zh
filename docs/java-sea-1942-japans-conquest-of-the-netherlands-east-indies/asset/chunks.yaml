    # Battle of the Java Sea: First Phase, 1555–1720hrs


    ![../img/9781472831613Art001_battlescene.jpg](img/9781472831613Art001_battlescene.jpg)


    ## HAGURO IN ACTION


    Heavy cruisers `Nachi` and `Haguro` were the backbone of the Japanese force at
    Java Sea. With their powerful `8in.` guns and torpedo batteries, they were the
    most powerful ships present on either side. The initial phase of the battle featured
    a long-range gunnery duel between `Nachi` and `Haguro` and the Allied cruisers.
    In this view, the `8in.` turrets of `Haguro` are elevated (1) and firing at long
    range while splashes from Allied cruisers explode near the Japanese ship (2).
    To supplement the long-range gunnery of his cruisers, Vice Admiral Takagi decided
    to bring the long-range `Type 93` torpedo into play. As part of a massive torpedo
    barrage, `Haguro` prepared to fire her eight starboard side torpedoes. The cruiser
    has trained her two starboard quadruple launchers and has fired her torpedoes
    at `1652hrs` as evident in this scene (3). Not evident in this scene is that fact
    that several of the torpedoes exploded only a few hundred yards from the ship
    creating enormous columns of water. The problem was with the fuzing of the torpedoes
    which was a problem throughout the battle. Cruiser `Nachi`, leading the column,
    was unable to contribute another eight torpedoes because her torpedo crew had
    left a valve open which bled the air pressure required to launch them. Of the
    39 `Type 93` torpedoes fired in this barrage, only one hit. This blow was deadly
    though; at `1713hrs`, one of `Haguro`’s torpedoes hit the Dutch destroyer `Kortenaer`
    amidships sinking the ship in minutes.


    ## THE BATTLE OF THE JAVA SEA


    Doorman elected to place his force into three parallel columns as he headed to
    the northwest to engage the Japanese. The center column consisted of his five
    cruisers, led by his flagship `De Ruyter`. Flanking the main column were two columns
    of destroyers, one comprised of the three British destroyers and the other with
    the six Dutch and American destroyers. The Dutch `Kortenaer` had boiler problems
    which reduced her top speed to `26 knots`, and she fell behind. Also left tagging
    behind were the four American destroyers which had been given an order from Doorman
    not to pass the Dutch destroyers. The inability of the Combined Striking Force
    to exceed `26 knots` became a key factor in the battle. Doorman’s slower speed
    meant he was unlikely to outmaneuver the Japanese and made any uncontested thrust
    against the transport group even more unlikely.


    ### The day phase


    The two sides continued to close. At `1610hrs`, `Electra` spotted the westernmost
    Japanese group, the light cruiser `Jintsu` and her four destroyers. Minutes later,
    `Electra` also reported the two Japanese heavy cruisers. At the same time, the
    Japanese groups spotted Doorman’s force. At `1615hrs`, `Jintsu` began the battle,
    firing her `5.5in.` main battery at `Electra`. The range was `18,000 yards`, close
    to the maximum range for this weapon. Despite this, the Japanese gunners were
    able to straddle their target. This opening salvo was followed by `Nachi` and
    `Haguro` opening fire with their `8in.` guns on the Allied heavy cruisers at `28,000
    yards`. Their initial rounds were well short. Per Japanese doctrine, Takagi was
    content to fight a long-range gunnery duel, since he believed his gunnery was
    more effective at extended ranges and to limit the ability of the Allies to respond
    with the `6in.` guns aboard three of their cruisers. Without waiting for orders,
    `Exeter`’s captain ordered his ship to fire back at `1617hrs`, and he was quickly
    joined by `Houston`’s forward two `8in.` turrets. Both Japanese and Allied long-range
    fire was ineffective. `Houston` claimed hits; at `1631hrs` a Japanese `8in.` shell
    hit `De Ruyter`, but it was a dud. The fire of the Japanese cruisers was accurate
    enough to place the occasional straddle, but at `26,000 yards` or more, the likelihood
    of a hit was small.


    The two cruiser forces continued on generally parallel courses. Takagi was unwilling
    to close the range and continued his tactic of executing long-range gunnery attacks.
    Doorman needed to close the range to bring his `6in.` cruisers into play. With
    `25 6in.` guns on his three cruisers, this was his only area of advantage. But
    once again, his slower speed forced Doorman to react to Japanese maneuvering.
    To avoid the prospect of the Japanese cruisers “crossing his T” (a tactic in which
    one side crosses perpendicular to the other, allowing the passing force to bring
    its entire broadside to bear, while the group being crossed could only bring its
    forward guns to bear), Doorman ordered a course change at `1635hrs` due west.
    This temporarily eased the possibility that the Japanese heavy cruisers would
    “cross his T”, but it also failed to close the range sufficiently for the `6in.`
    cruisers to join the gunnery duel.


    As the heavy cruisers exchanged fire, Takagi planned to bring the IJN’s secret
    weapon into play – the long-range `Type 93` torpedo. The massed torpedo attack
    would be conducted at ranges beyond which the Allies expected an attack, and the
    Japanese expected the results to be devastating. Nishimura maneuvered his light
    cruiser and six destroyers to comply with Takagi’s order to execute a torpedo
    attack. At `1634hrs`, his ships were the first to launch when `Naka` fired four
    torpedoes at `15,000 yards` range. Between `1640` and `1645hrs`, his destroyers
    sent another 23 weapons toward the Combined Striking Force. In addition to Nishimura’s
    ships, light cruiser `Jintsu` fired four at `1635hrs` and `Haguro` fired a salvo
    of eight at `1652hrs` from `22,000 yards`. `Nachi` was unable to contribute another
    eight because her neglectful torpedo crew had left a valve open which bled the
    air pressure required to launch the torpedoes. The 39 torpedoes reaped a disappointing
    return for Takagi. At `1713hrs`, one hit `Kortenaer` amidships. According to a
    nearby American destroyer skipper, the Dutch destroyer disappeared in under two
    minutes.


    ![../img/9781472831613Art002_battlescene.jpg](img/9781472831613Art002_battlescene.jpg)


    ## EXETER IN DISTRESS


    After an hour of inconclusive long-range gunnery, little damage had been done
    to either side. At about `1700hrs`, the Japanese closed the range to seek a decision.
    At the same time, they concentrated fire on `Exeter` and `Houston`, the two largest
    Allied ships. At `1708hrs`, `Exeter` (1) was hit by an `8in.` shell from `Haguro`.
    Japanese gunnery was accurate, as shown by the salvo which bracketed the cruiser
    with the two shell explosions in this view (2) and the third shell which has hit
    the ship. The results of the single `8in.` shell hit were catastrophic and went
    a long way to deciding the battle. The shell hit the shield of one of the `4in.`
    twin mounts before penetrating through an armored hatch into a boiler room ventilator.
    The shell went through `A Boiler Room` flinging shrapnel in all directions and
    then penetrated into `B Boiler Room` causing further damage. The result was to
    place both starboard boilers out of action and damage to a superheater placed
    the four aft boilers out of commission. Superheated steam filled the aft boiler
    room killing all but one of the engine room crew. The loss of six of the ship’s
    eight boilers reduced speed to a mere `six knots`. The reduced power also brought
    her main battery out of action. In this view, `Exeter` is making an emergency
    turn to avoid a collision with the cruisers behind her. Heavy smoke is already
    coming out of both her stacks indicating the damage below in the boiler rooms
    (3). `Exeter` is firing her last `8in.` salvo before her turrets lost power (4).
    `Houston` was some `600 yards` behind `Exeter`, and she is making an emergency
    turn to port (5).

