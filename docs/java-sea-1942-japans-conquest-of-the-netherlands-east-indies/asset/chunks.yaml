    The battle opened with `Fubuki` firing a full salvo of nine `Type 90` torpedoes
    (not all Japanese destroyers were carrying the `Type 93`) at the Allied cruisers
    at 2314hrs. The target angle was poor, and no hits were scored. The destroyer
    also fired 16 rounds of `5in.` shells, all for no effect. A minute later, `Perth`
    sighted destroyer `Harukaze` to the southwest and opened fire. As the two cruisers
    maneuvered, it was apparent that `Hara`’s plan to use `Natori` as bait was not
    working, so he ordered his destroyers to attack. The first to do so were `Hatsuyuki`
    and `Shirayuki` at about 2340hrs. `Perth` hit the charging `Shirayuki` on her
    bridge, but the Japanese destroyers closed to 4,000 yards before each firing nine
    torpedoes. The old destroyers of `Destroyer Division 5` were next. `Harukaze`
    was hit by several shells and forced out of line. `Asakaze` fired six torpedoes
    at 2343hrs, but the last destroyer, `Hatakaze`, was unable to find a target. At
    2344hrs, `Natori` fired four torpedoes and 29 `5.5in.` rounds before withdrawing
    north. Once the Japanese destroyers cleared the area, `Mikuma` and `Mogami` each
    fired six torpedoes at 2346hrs. At 2352hrs, the two Japanese heavy cruisers turned
    on their searchlights and began to engage targets with their ten `8in.` guns.
    `Houston` used the searchlights as an aiming point and hit `Mikuma` at 2355hrs.
    None of this wave of Japanese torpedoes hit their targets, and after the first
    45 minutes of an intense firefight, the two Allied cruisers had suffered little
    damage. However, they were increasingly unable to fire back – `Perth` was reduced
    to firing practice `6in.` shells and `Houston`’s crew was forced to move 260-pound
    `8in.` shells from the aft magazine to the two forward turrets by hand.


    As the rate of fire from the two Allied cruisers decreased, the Japanese closed
    for another torpedo attack. From the east at only 4,200 yards, `Harukaze` fired
    five and `Hatakaze` six torpedoes at 2356hrs. A minute later, `Mogami` fired six
    `Type 93s` from 10,000 yards to the north while opening fire with her `8in.` battery.
    `Shirakumo` and `Murakumo` arrived from the west to each fire nine `Type 90` torpedoes
    from a 5,000 yards range. `Natori` had reloaded her torpedoes and fired at `Houston`
    at a range of some 9,000 yards. This was a deadly barrage, but not entirely in
    the way the Japanese intended. `Mogami`’s torpedoes missed their intended targets
    and headed southwest into `Bantam Bay`. The results against the anchored invasion
    convoy were devastating. Four torpedoes hit transports, and all sank (but were
    eventually raised and returned to service). Aboard transport `Ryujo Maru`, General
    `Imamura Hitoshi`, commander of the `16th Army`, was dumped into the sea and forced
    to swim for his life. A fifth torpedo hit 600-ton minesweeper `W2` which broke
    in two and quickly sank.


    ![../img/CAM344_066.jpg](img/CAM344_066.jpg)


    This fine profile view is of destroyer `Evertsen` in 1928, soon after her completion.
    Note the four single `4.7in.` guns and the two banks of triple torpedo tubes.
    `Evertsen` returned to service in the first week of December with an inexperienced
    crew. The Dutch did not consider her fully operational and the ship was assigned
    convoy escort duty for most of the campaign. In her final action, the destroyer
    attempted to flee from `Soerabaja`. Caught by two Japanese destroyers, her skipper
    did not think the crew was capable of putting up an effective fight, so he elected
    to run his ship aground to avoid a useless loss of life. (Netherlands Institute
    for Military History)


    ![../img/9781472831613_Map010.jpg](img/9781472831613_Map010.jpg)


    ### Action in the Bali Strait, February 28


    ![../img/CAM344_017.jpg](img/CAM344_017.jpg)


    `Wakaba` was one of six ships in the `Hatsuhara` class. Four of these were assigned
    to `Destroyer Division 21` and were active in supporting several invasions in
    the eastern NEI. Their only opportunity to engage Allied ships came on the night
    of February 28–March 1, when they detected the four ships of the US Navy’s `Destroyer
    Division 58` transiting the Bali Strait. Despite having an advantage in speed
    and firepower, the Japanese ships did not pursue aggressively, and all four American
    destroyers escaped. (US Naval History and Heritage Command)


    More explosions followed, and these were at the expense of the Allies. At about
    0005hrs on March 1, a torpedo possibly from `Harukaze` hit `Perth` in her forward
    engine room. Two minutes later, another hit under the bridge. When the barrage
    from `Murakumo` and `Shirakumo` arrived, two more hit. Unable to withstand these
    blows, the cruiser rolled over to port and sank at 0012hrs. Of her crew of 686,
    351 went down with the ship, including her commanding officer. Among the survivors,
    another 106 died in Japanese captivity.


    None of the torpedoes hit `Houston`, but she was now alone. Seeing the way to
    the west blocked, `Houston`’s captain steered south. At 0010hrs, her luck finally
    ran out. Shells from `Mikuma` and `Mogami` began to score, and within minutes
    the ship was reduced to shambles. The crew recorded three torpedo hits, but the
    correct number will never be known since in the final moments it was impossible
    to distinguish shell from torpedo hits. Her commanding officer ordered abandon
    ship at 0025hrs, and then was killed by shrapnel. At 0029hrs, the final hit, and
    five minutes later the cruiser disappeared. Of her crew of 1061, only 368 survived.
    Of these, 102 died in captivity.


    A postscript to the destruction of the two cruisers was the fate of `Evertsen`.
    Seeing the battle in the Sunda Strait from a distance, her commanding officer
    attempted to head north along the coast of Sumatra. At 0130hrs, the Dutch destroyer
    was detected by `Murakumo` and `Shirakumo`. In an uneven gun fight, the Japanese
    destroyers set the Dutch ship afire. Her commanding officer ran the ship aground
    to save the crew.

