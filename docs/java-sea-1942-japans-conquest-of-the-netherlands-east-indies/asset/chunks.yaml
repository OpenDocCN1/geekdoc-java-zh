    此外，日本帝国海军的巡洋舰配备了重型鱼雷武器。在太平洋战争初期，`凤月级`舰艇携带 16 具鱼雷发射管和 18 枚备用鱼雷。`高雄级`中的两艘船也拥有相同配置，但`模写级`仅配备了
    12 具鱼雷发射管及备用。从 1938 年开始，日本巡洋舰配备了一种秘密的新型鱼雷——`93 式 1 号鱼改 2 型`。这是一种极其强大的武器，远优于盟军任何鱼雷。它携带
    1082 磅的弹头，由于采用氧气驱动而不产生尾迹，在 36 节的速度下射程可达 43,746 码。携带此类强武器极大增强了日本帝国海军巡洋舰的火力，但也存在一个潜在的缺点。如果在战斗中未保护的弹头被命中，携带此类武器将带来致命危险。这种情况在战争期间在日本帝国海军巡洋舰上发生过几次，结果是毁灭性的。


    日本帝国海军的巡洋舰战斗力相对较弱，因为它们的主要任务是作为驱逐舰队的旗舰。日本帝国海军在 1920 年至 1925 年间服役了 14 艘 5,500 吨轻巡洋舰。这些船在战争开始时配备了七门
    5.5 英寸单装炮。所有舰船都带有鱼雷发射架，但只有那些被实际分配为驱逐舰旗舰的船才装备了`93 式`鱼雷。这些船包括全部三艘`仙台级`，其中`中号`和`神津号`参加了东印度群岛（NEI）战役。


    正如日本重巡洋舰的设计比盟军对应舰规模更大、火力更猛一样，日本驱逐舰也是如此。日本驱逐舰的设计目标是最大化对水面舰的火力；它们是卓越的鱼雷艇，但在防空和反潜作战方面并非全才。在东印度群岛战役中，这些弱并不致命。从特型型驱逐舰（也称为`吹雪级`）开始，日本帝国海军驱逐舰以高速度和重火力的组合设定了节奏。`吹雪级`舰携带六门
    5 英寸主炮和九枚鱼雷以及三枚备用鱼雷。下一级驱逐舰是六艘级的`若云级`，携带五门 5 英寸主炮和六具鱼雷发射管以及六枚备用鱼雷。`白露级`引入了四联鱼雷发射架；该级配备了五门
    5 英寸主炮和八具鱼雷发射管以及另外八枚备用鱼雷。十艘级的`朝潮级`在东印度群岛战役中发挥了重要作用。这些船最高时速为 35 节，配备了三双装六门 5 英寸炮。每艘船携带八枚鱼雷和另外八枚备用。`朝潮级`之后是`岚风级`，其中几艘舰参加了东印度群岛战役。该级的能力与`朝潮级`相似。一个较旧的`神风级`分队也参加了东印度群岛战役。这些造于
    1922 年的舰船携带四门 4.7 英寸炮和六具 21 英寸（相比已讨论的级别为 24 英寸管）鱼雷发射管，且没有备用鱼雷。


    ### 训练


    日本帝国海军的训练极其激烈，旨在模拟实际战斗状态。这种严苛训练的严肃性在 1927 年得到了体现：在一次夜战鱼雷演习中，一艘驱逐舰因碰撞沉没导致 104 人丧生，另一艘驱逐舰严重损坏导致
    29 人伤亡，两艘巡洋舰也受损。训练节奏是无情的，尤其是当训练年度在 10 月结束时。日本帝国海军军官形容训练比实际战斗还要艰难。结果是，到战争开始时，他们已成为精兵。


    ![../img/CAM344_007.jpg](img/CAM344_007.jpg)


    `神津号`是战争期间日本帝国海军最成功的巡洋舰之一。她在东印度群岛战役中承担了预期的驱逐舰队领导角色，随后在中途海战和整个瓜达加纳岛战役中战斗，直到 1943
    年 7 月在在中部的科隆巴拉岛海战中被美国海军巡洋舰的炮击沉。（大和博物馆）


    ### 夜战能力与战术


    夜战是日本帝国海军战前训练的特别重点。夜战是日本海军战术的核心原则，因为这是经过高度训练的日本海军舰只扭转比规模更大的美国海军局势的主要方法。从 1936
    年`93 式`鱼雷服役开始，夜战战术经过了重新。为了利用这种武器的长射程，巡洋舰接受了在白天或夜间战斗中远程射击的训练。这种“远距离隐蔽射击”有望在敌人意识到处于危险之前就将其击溃。当日本帝国海军驱逐舰获得`93
    式`鱼雷时（并非所有在战争开始前都获得了），它们的战术是类似的。日本人不断演习鱼雷战术，快速装填鱼雷发射管是一项关键技能。训练良好的船员可以在 15 分钟内完成任务。这使得日本巡洋舰和驱逐舰能够发射一轮鱼雷，撤离重装，然后发射第二轮。


    ![../img/CAM344_025.jpg](img/CAM344_025.jpg)


    日本帝国海军在太平洋战争爆发初非常重视其秘密的远射鱼雷。他们设计了利用这些武器能力的战术，使日本人能够对盟军水面舰实施远程打击。在东印度群岛战役中，这种神奇武器的表现令人失望，因为在发射的大量鱼雷中仅有三个命中。（作者收藏）


    夜战不仅仅是演习有素的鱼雷战术。日本人练习使用大型探照灯照射目标。巡洋舰舰上飞机投放的星光弹信号弹也被开发出来。日本另一个关键优势是优质的光学设备，这在雷达时代之前是关重要的。


    ### 盟军海军


    负责防守东印度群岛的盟军海军力量不足以完成任务。简单来说，日本帝国海军拥有更强大的舰船、训练得更好的船员，并拥有与强大海军协同作战的巨大优势。盟军海军在整个战役中面临着巨大的障碍，包括指挥混乱、缺乏战斗机保护以及缺乏空中侦察。战役期间，盟军海军承受着日益增长的压力。后勤支持崩溃，限制了燃料和弹药的供应。通信是一个持续的问题，因为现场甚至没有互通的代码，这让多曼在设计巡逻部署和指挥部队时感到非常头疼。多曼用荷兰语发布命令，由其旗舰上的盟军联络和通信人员传输给部队中的其他舰船。部队之间没有共同的战术，迫使多曼不得不采用基础的战斗计划。


    ![../img/CAM344_047.jpg](img/CAM344_047.jpg)


    `海狮号`于 1939 年 10 月进行试验的照片。她是美国海军在战争期间损失的第一艘潜艇，于 1941 年 12 月 10 日在菲律宾的卡维海军基地遭到轰炸沉没。（美国海军历史与遗产司令）


    #### 亚洲舰队

