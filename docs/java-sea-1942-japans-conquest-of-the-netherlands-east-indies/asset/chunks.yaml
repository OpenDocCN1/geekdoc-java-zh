  raw: "Japanese gunnery was also disappointing. Pre-war doctrine called for long-range\
    \ fire, since the Japanese believed they could deliver punishing blows beyond\
    \ the reach of their enemies. In pre-war exercises, they assessed that 6 percent\
    \ of 8in. shells would hit at long range. This proved wildly optimistic, since\
    \ at Java Sea only five of the 1,619 8in. shells fired hit their target. As was\
    \ the case with the Type 93, the low accuracy rate was mitigated by the fact that\
    \ one of the shells that hit played a major role in determining the battle’s result.\
    \ Light cruiser gunnery by Naka and Jintsu was also poor with only a single round\
    \ of the 221 5.5in. rounds hitting. Destroyer gunnery was better since it was\
    \ conducted at shorter range. Of the 515 5in. rounds expended, several hit Electra\
    \ and led to her loss. Similar results were in evidence in the action against\
    \ Exeter. Of 1,171 8in. rounds fired, two hit. Of 35 torpedoes fired, only one\
    \  hit.\n\n![../img/CAM344_060.jpg](img/CAM344_060.jpg)\n\nUsing this wartime\
    \ shot of the Balikpapan refinery, the Japanese boasted of how quickly their engineers\
    \ managed to restore oil refineries in the NEI. In fact, the Dutch destruction\
    \ of these key facilities was incomplete, and the Japanese were quickly able to\
    \ restore production. (US Naval History and Heritage Command)\n\nThe failure of\
    \ the Combined Striking Force to stop the Japanese invasion forces meant the Japanese\
    \ were able to land at three places on Java on February 28 and March 1\\. Dutch\
    \ attempts to contain the landings were futile. By March 8, Soerabaja was captured,\
    \ and the following day Dutch forces on Java surrendered. With the surrender of\
    \ Dutch troops on Sumatra on March 28, the entire NEI passed to Japanese control.\
    \ The Japanese had succeeded in accomplishing their most important early-war objective.\
    \ The oilfields on Java and Sumatra were quickly brought back on line. They were\
    \ sufficient for Japan’s wartime needs, but as the war dragged on the Japanese\
    \ were increasingly unable to move the oil or refined products to the Home Islands.\
    \ Java and the great majority of the NEI remained in Japanese hands throughout\
    \ the  war.\n\n## BIBLIOGRAPHY AND FURTHER READING\n\nThe NEI campaign used to\
    \ be forgotten when it came to accounts published in English. However, in recent\
    \ years, many new titles have been issued which have gone a long way to redress\
    \ this shortcoming. Among these are several featuring extensive use of Dutch sources.\
    \ Most importantly, the two volumes of the 102-volume Senshi Sosho (War History\
    \ Series – the “official” Japanese history of the war) which deal with the invasion\
    \ of the NEI have been translated into English. This is the first time any volume\
    \ of this series has been translated into English in its  entirety.\n\nAlford,\
    \ Lodwick H., Playing for Time, Merriam Press, Bennington, Vermont (2012)\n\n\
    Boer, P. C., The Loss of Java, NUS Press, Singapore (2011)\n\nCampbell, John,\
