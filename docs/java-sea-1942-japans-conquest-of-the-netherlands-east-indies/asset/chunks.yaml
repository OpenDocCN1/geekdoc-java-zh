  trans: '

    哈特担任 `ABDAFLOAT` 的时期非常短暂，并受到了道格拉斯·麦克阿瑟将军和荷兰当局的政治攻击。2 月 5 日，美国舰队司令官埃内斯特·金海军告知哈特，他应该以健康为由辞职，因为他已经失去了荷兰人、麦克阿瑟、韦威尔甚至罗斯福总统的支持。他的下台是由麦克阿瑟和荷兰人推动的，他们希望将他作为未能守卫
    `NEI` 的替罪羊。截至 2 月 12 日，`ABDAFLOAT` 一职由一位荷兰海军将担任。随着哈特的离开，ABDA 指挥部中没有一名美国海军军官担任重要角色。


    康拉德·E·L·赫尔夫里希中将是荷兰海军的指挥官。他出生于 `NEI`，因此对该地区的防御特别感兴趣。他的航海和指挥时间有限，但他于 1931 年回到 `NEI`，并在
    1939 年被任命为东印度群军司令官，于次年升为中将。当哈特被任命为 `ABDAFLOAT` 而不是自己时，他感到非常愤恨，并拒绝与哈特合作，立即开始了削弱哈特的行动。哈特的总部与位于爪哇岛西部巴达维的荷兰海军基地并不在一起，哈特基本上忽视了希。赫尔夫里希只能通过哈特总部的联络官来跟踪
    ABDA 的海军行动。赫尔夫里希以尽可能不与哈特合作作为回报，特别是在提供荷兰船只参加作战时。当哈特离开 `NEI` 并于月月 12 日将指挥权交给赫尔夫里希时，这种情况发生了变化。赫尔夫里希是
    `NEI` 海战后期的关键人物。他是一个复杂的形象，性格从傲慢的霸凌者到盟军指挥团队中可靠的成员不等。他的首要本是在进攻入侵的日本人时尽可能具有侵略性。这种攻击性在战后期变得不理性，因为他在对爪哇进行的徒劳防御中，牺牲的不只有荷兰人的生命，还有美国、英国和澳大利亚人的生命。在指挥了许多徒劳的流血之后，他乘飞机逃离爪哇，在战争剩余时间里担任远东荷兰海军司令官这一名义职务。


    荷兰海军的战术指挥权，以及后来 2 月 1 日成立的 ABDA 联合打击队的指挥权，交给了卡雷尔·W·F·M·多尔曼少将。他于 1910 年毕业于荷兰皇家海军学院，并在
    1915 年成为一名海军航空兵。在海军军学院进修以及在驱逐舰和巡洋舰上过多次指挥任务后，他被任命为 `NEI` 海军航空部队司令官。随后他在 1940 年
    5 月升任将官，并接管了东印度中队的指挥权。多尔曼是一个很难评价的人物，特别是考虑到他在战中的行动。他无疑是有才干的，深受荷兰皇家海军同僚和下属的尊重。他很有魅力，并对他指挥下的士兵们表现出明显的关心。


    ![../img/CAM344_064.jpg](img/CAM344_064.jpg)


    多尔曼少将是负责执行赫尔夫里希命令的人，要求以不懈的决心进攻冲锋而来的日本人。在他担任联合打击队司令官期间，他未能进行过任何有效的进攻。在最后一次行动中，他以赫尔夫里希要求的决心发动了进攻，但代价是他自己的生命和他指挥下的大部分部队。（荷兰军事史研究所）


    在被任命联合打击队司令几天后，他带领了一次失败的行动，进攻马加锡的日本船。在与哈特商量后，他选择了一条直达目标的路线并遭受了猛烈的空袭。两艘美国巡洋舰受损，人员严重伤亡，多尔曼对此深受震扰。随后，多尔曼在遭受空袭后取消了另外次进攻运输队的行动。在爪哇海战爆发前夕，其他盟军海军指挥官对多尔曼已经厌透了。他在担任打击队司令期间一无所获，而且多次“逃跑”。战斗前夕甚至有人讨论要替换他，但最终认为在如此晚阶段更换指挥官是不智的，因此多尔曼留任了职务。在赫尔夫里希的压力下，或许是为了消除他自己不是战斗员的担心并保卫家园，在爪哇海战中，他表现出了贴近并击败日本人的真正韧性，无论付出多大代价。战争期间很少有将领表现出同程度的决心。这种决心是以他的指挥部队的毁灭为代价的，这导致他在战后被评价为勇敢但愚蠢。他现在和那时都值得更好的评价，因为他处于一种不可能的境地：指挥着一支劣势的部队，试图执行一位几乎不考虑下属的的上级官的命令。


    英国海军部队最初由代理将领汤姆·菲利普斯指挥，直到他在 12 月 10 日在旗舰“威尔士亲王号”舰上去世。菲利普斯去世后，杰弗里·莱顿中将接回了东舰队司令官的旧职。ABDA
    地区的英国海军部队在技术上受东舰队指挥。莱顿一直处于这一职位直到 3 月，当时詹姆斯·索姆维尔爵士中将带着东舰队的增援抵达。澳大利亚皇家海军约翰·A·柯林斯准将行使对
    `NEI` 英国海军部队的实际控制权。


    ## 敌舰队


    ### 日本帝国海军


    `IJN` 的主要作战实体是联合舰队。相应的，联合舰队被分为若干个舰队。这些舰队是分配作战任务的主要力量基础，但整个结构非常灵活，因为船只和分队可以从一个舰队转移到另一个舰队以满足作战需求。


    对于 `NEI` 战役，日本海军力量从第二和第三舰队抽调。第二舰队被称为侦察舰队，基地位于海南岛，分配了 11 艘巡洋舰，包括第四战队的四艘爱宕级巡洋舰、第五战队的三艘妙贺级巡洋舰以及第七战队的所有四艘雾峰级巡洋舰。分配给第二舰队的第二、第四驱逐队分队。每个分队都分配了一艘
    5500 吨巡洋舰作为旗舰，以及若干个驱逐舰分队，名义满额为 12 艘船。


    基地位于台湾的第三舰队被称为封锁和运输部队，这很好地描述了他们的战时任务。其直接控制下有一艘巡洋舰、两艘旧巡洋舰，以及第五驱逐队分队（配备一艘巡洋舰作为旗舰和两个旧驱逐舰分队），共
    8 艘船。此外，第一和第二基地部队被分配用于执行登陆作战。每个部队都由大量运输船和较小的战斗舰组成，包括巡逻艇、扫雷舰、布雷舰、反潜舰和炮舰。


    ![../img/CAM344_014.jpg](img/CAM344_014.jpg)


    第七战队的四艘雾峰级重巡洋舰（其中三艘如图中 1938 年的照片所示）是小泽少将马来亚支队中最强大的舰只。其中，雾峰号和重庆号参加了 3 月 1 日的巽他海峡海战，结果导致两艘盟军巡洋舰被击沉。（美国海军历史与遗产司令）

