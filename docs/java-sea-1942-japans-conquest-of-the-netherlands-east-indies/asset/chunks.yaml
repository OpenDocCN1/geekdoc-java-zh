    当多门（Doorman）的东方打击队被击败时，盟军西方打击队又如何了？由于`Exeter`、`Perth`和三艘驱逐舰的离开，该舰队仅剩下三艘巡洋舰（两艘已过时）和三艘驱逐舰（两艘已过时）。2
    月 26 日，英国空军的一架飞机在巴达维亚北约 100 英里发现了日本入侵军。`Helfrich`命令西方打击队出击并与之交战。该部队于傍晚在`Hobart`舰长的战术指挥下出发，在竭力拦截日本军无果后，于
    2 月 27 日因燃料不足返回基地。此时，爪哇岛的命运已成定局，爪哇岛的英国高级海军军官亚瑟·帕利塞（Arthur Palliser）少将决定，不想在徒劳的防御中牺牲他的舰船。他说服`Helfrich`同意，如果找不到日本军就允许部队撤退。于是，柯林斯（Collins）为其下属制定了命令，要求其在
    2 月 28 日 0430 分之前在无日军行动的区域巡逻，然后经巽宜海峡前往锡里兰。幸运的是，所涉舰只除荷兰驱逐舰外，均成功在日本入侵军抵达之前通过了巽宜海峡。


    多门联合打击队的幸存者面临着非常不确定的未来。日本入侵军的两路火力现在位于爪哇岛的两端，将`Perth`、`Houston`和荷兰驱逐舰`Evertsen`困在丹绒普里奥（Tanjong
    Priok）。在泗水，美国驱逐舰`Pope`已与战斗中其他盟军幸存者加入，包括受损的`Exeter`、荷兰驱逐舰`Witte de With`、英国的`Encounter`以及宾福德（Binford）指挥的四艘驱逐舰。


    ![../img/9781472831613Art003_battlescene.jpg](img/9781472831613Art003_battlescene.jpg)


    # 鲁伊特号之死


    临午夜时，多门拒绝停止战斗。此时，盟军力量仅剩四艘巡洋舰，由多门的旗舰鲁伊特号（De Ruyter）领航。这一场景显示了鲁伊特号正在高速行驶（1）。该舰的四座
    5.9 英寸炮塔指向左舷，并抬高以进行远射击（2）。战斗最终由长波号（Nachi）和比贺号（Haguro）发射的一齐`12 枚 93 型`鱼雷结束。日本鱼雷从
    14,000 码外射向盟军巡洋舰纵列。多门对这一威胁的反应迟缓。`2336hrs`，一枚来自长波号的鱼雷击中了爪哇号（Java），炸掉了这艘巡洋舰的船尾，导致其在约
    15 分钟后在人员损失严重的情况下沉没。约`2340hrs`，来自比贺号的一枚鱼雷击中了鲁伊特号的后部（3）。带有强力战斗部的`93 型`鱼雷如此视图所示击中了右舷后部机舱。该船失去动力并滑行停下。30
    分钟内，船长命令船员弃船。船体右倾日益严重，直到在约两个半小时后沉没。鲁伊特号所中的鱼雷命中为太平洋战争中持续最长的水面战斗之一画上了句号。


    盟军危险的处境意味着脆弱的 ABDA 指挥结构走向了终结。2 月 25 日是 ABDA 的最后一个官方一天。现在，盟军开始追求不同的目标。`Helfrich`保留了该地区所有盟军海军舰只的名义控制权，并固守爪哇岛仍可防御这一日益不现实的想法。他命令所有幸存者前往爪哇岛南岸的地直打（Tjilatjap）继续战斗。3
    月 1 日，帕利塞明确表示，他打算在所有英国舰被摧毁之前命令它们离开该地区。由于没有撤离美国海军剩余舰只的命令，格拉斯福德（Glassford）向`Helfrich`暗示他将让舰只接受荷兰指挥。


    # 巽宜海峡海战


    盟军舰只寻求逃离爪哇海一系列绝望战斗中的第一战于 2 月 28 日在巽宜海峡爆发。`Houston`和`Perth`于 2 月 28 日`1900hrs`离开丹绒普里奥。同样在场的`Evertsen`直到`2045hrs`才出发。这三艘船向西穿过巽宜海峡。但盟军太慢了。规模巨大的日本入侵军已到达巽宜海峡北入口的万丹湾（Bantam
    Bay）。尽管意识到巴达维亚有盟军军舰存在，但护卫队指挥官原（Hara）少将并未准备好应对从东面来的两艘盟军巡洋舰。日本的最初部署仅将吹风号（Fubuki）置于登陆区东侧。轻巡洋舰胜利号（Natori）由吹风级驱逐舰雪号（Hatsuyuki）、白雪号（Shirayuki）以及三艘旧式的神风级驱逐舰提供近卫。重巡洋舰熊云号（Mikuma）、雾峰号（Mogami）以及另一艘吹风级驱逐舰潮波（Shikinami）位于万丹湾北方
    20 英处。爪哇海更北方有重巡洋舰熊野（Kumano）、州守（Suzuya）、另外两艘吹风级驱逐舰以及轻型母战斗机龙号（Ryujo）。如果日本能集中力量，两艘盟军巡洋舰将面临无法逾越的局面。更糟糕的是，`Houston`仅剩一些
    8 英寸炮弹，而`Perth`仅剩 6 英寸炮弹。


    ![../img/CAM44_053.jpg](img/CAM44_053.jpg)


    这张二战时期绘画展示了在巽宜海峡海战中遭受攻击的`Houston`。前景中的日本驱逐舰是神风级舰只之一，画面相对准确地反映了战斗是一场近距离混战。（美国海军历史与遗产）


    ![../img/9781472831613Map009.jpg](img/9781472831613Map009.jpg)


    ## 2 月 28 日至 3 月 1 日巽宜海峡战


    盟军寻求逃离爪哇海的一系列绝望战斗中的首战是 2 月 28 日在巽宜海峡进行的。`Houston`和`Perth`于 2 月 28 日`1900hrs`离开丹绒普里奥。同样在场的`Evertsen`直到`2045hrs`才出发。这三艘船向西穿过巽宜海峡。但盟军太慢了。规模巨大的日本入侵军已到达巽宜海峡北入口的万丹湾。尽管意识到巴达维亚有盟军军舰存在，但护卫队指挥官原（Hara）少将并未准备好应对从东面来的两艘盟军巡洋舰。日本的最初部署非常糟糕，仅将吹风号部署在东侧，尽管日本早早知道有两艘巡洋舰位于丹绒普里奥。最适合处理这种潜在威胁的部队——栗田（Kurita）第七队的四艘重巡洋舰——在登陆区北方巡逻。讽刺的结果是，精疲力竭且弹药不足的盟军巡洋舰发现自己处于进攻主要入侵队规模的理想位置。当报告发现两艘巡洋舰出现时，原被迫仓促应对，但如果盟军舰只能够抓住这个机会，结果对日本人来说可能是灾难性的。当日本人最终对这两艘巡洋舰做出反应时，他们的应对非常混乱，在此过程中击沉了自己的五艘船，并花费了大量时间才最终击沉了这两个入侵者。从表面上看，巽宜海峡海战的结果表明日本又获得了胜利，但事实上，日本海军的表现可能是其战争以来最糟糕的一次。


    盟军巡洋舰船员希望无中通过巽宜海峡的希望破灭了，因为在`2239hrs`，吹风号在东方 11,000 码处发现了盟军舰只。原派遣胜利号、雪号和白雪号做出反应。`2248hrs`，胜利号在东南方向发现两艘船。原判断那两艘船是巡洋舰，因此召唤了熊云号、雾峰号以及驱逐舰春风（Harukaze）、波风（Hatakaze）和朝风号（Asakaze）作为增援。原进一步决定，他将利用胜利号作为目标，将两艘敌方巡洋舰从入侵队中引开。与此同时，吹风号已在`Houston`后方约
    3,000 码处采取了随行位置。


    随着各组日本舰汇聚到两艘巡洋舰周围，盟军舰只从未准确了解过他们所面对的敌军规模。然而，随后的战斗是一场在近距离进行且双方完全陷入混乱的混战。


