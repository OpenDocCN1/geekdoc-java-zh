    在 2 月 4 日受损后，“大理石头号”（Marblehead）直到两天后抵达地里特恰普（Tjilatjap）。据这一观察，伤员正被送离船只接受治疗。该船进港时船头有一个洞，有
    30 个舱室进水。这艘巡洋舰的船头接受了临时补救，但在地里特恰普无法进行全面修理，因此被命令返回美国。（美国海军历史与遗产司令部）


    日本空中力量的力量在 2 月 4 日显露无遗。在派遣三艘美国驱逐舰护护“佩科斯号”（Pecos）油轮并增加三艘荷兰驱逐舰后，联合打击队总计共有四艘巡洋舰和七艘驱逐舰（四艘美国的，三艘荷兰的）。这支力量离开泗水并向东航进，试图躲避日本的空中搜寻。当
    09:49，“休斯顿号”上的望哨员发现第一架日本侦察机时，这种希望很快破灭了。在一个能见度无限的晴朗日子里，来自新甘丹里（Kendari）基地的、拥有 36
    架 G4M 和 24 架 G3M 飞机的日本打击群毫不费力地发现了目标。日本飞行员直扑巡洋舰。轰炸机全部装载了 550 磅和 132 磅的炸弹，没有携带鱼雷。九架轰炸机盯住了“大理石头号”。在第三次进攻中，它们投掷了炸弹。这艘巡洋舰被弹贯中但未命中。另外九架轰炸机追击“休斯顿号”，但这些也没有命中。第三组七架飞机于
    10:27 向“大理石头号”投掷了炸弹。尽管只是 132 磅的炸弹，但有两弹击中这艘轻装甲巡洋舰造成了严重破坏。第一弹命中头部并引发了火灾；第二弹击中后方甲板上。它使甲板弯曲，摧毁了舵室，导致舵卡在向左转的位置。左舷船头附近的近炸导致了进水。这艘巡洋舰状况糟糕。有
    15 名船员死亡，34 人受伤；船只只能在紧密的圆圈内行驶，向右倾斜并正在冒火。损救努力救这艘船，但她已不再适用于战斗任务。


    ![../img/CAM344_050.jpg](img/CAM344_050.jpg)


    轻巡洋舰“大理石头号”在 1942 年 2 月 4 日于爪哇海遭受日本高空轰炸袭击受伤后，位于爪哇岛的地里特恰普。这一视角显示了一枚击中其尾部的敌方炸弹的效果。该船仅有
    1.5 英寸的水平装甲，这使得日本使用的小型 132 磅炸弹能够穿透甲板进入下方并造成致命性破坏。（美国海军历史与遗产司令部）


    11:17 的后续攻击再次针对“休斯顿号”，但其舰长巧妙地避开了了所有炸弹。11:26，轮到了“鲁义特号”（De Ruyter），但她也避开了所有射向她的炸弹。11:40
    的最后一次攻击针对“休斯顿号”。除最后一枚炸弹外，其余全部落空，但最后一枚落下的炸弹造成了毁灭性的命中。它在弹开主桅杆后，在主桅杆和 3 号 8 英寸炮塔之间的主甲板上方爆炸。它在甲板上炸出一个
    12 英尺的大洞，并将碎片射入轻装甲炮塔。这些碎片导致内部火药包起火，害了里面的船员。损救努力阻止了火势蔓延，但由于 48 人死亡、20 人受伤，且后方 8
    英寸炮塔失效，“休斯顿号”遭受了严严重损坏。


    ![../img/CAM344_059.jpg](img/CAM344_059.jpg)


    在战役期间，美国海军潜艇在防御日本两栖攻击方面并不奏效。这里显示的“鲈鱼号”（Perch）是赫尔里希（Helfrich）命令集中在爪哇岛东部以阻止日本入侵的潜艇之一。由于不知道日本人的确切登陆区域，潜艇部署不当，无法迅速移动到实际登陆区域。日本和德国海军后来在尝试部署潜艇击退两栖入侵时也吸取了同样的教训。“鲈鱼号”在
    3 月 1 日晚在泗水以北 35 英处被发现。在遭受多多艘日本海军驱逐舰的猛烈攻击后，该潜艇于 3 月 3 日自沉，但全体船员被日本人救起。（美国海军历史与遗产司令部）


    12:25，多尔曼（Doorman）取消了行动，联合打击队向西返回泗水。两艘美国巡洋舰被送往地里特恰普，哈特（Hart）在那里集结了所有亚洲舰队的支援舰。哈特认为多尔曼本应该用他完好无损的继续进攻，而多尔曼被这整件事搞得心神不定。联合打击队的首次行动以失败告终，主要是因为盟军力量在面对日本空中力量时选择了过于直接的路线。“大理石头号”被迫前往锡锡兰修理且没有回来。“休斯顿号”尽管其中一个主电池炮塔永久失效，但仍坚持战斗。


    2 月 4 日的战斗行动暂时瘫痪了多尔曼的打击队。这意味着当日本入侵军于 2 月 6 日从斯塔林湾（Staring Bay）出发占领塞里伯锡岛南部望加锡时，没有受到盟军水面力量的阻拦。唯一在位的防御单位是美国潜艇“S-37
    号”。她在 2 月 8 日在望加锡海域发射一枚鱼雷击中日本海军最先进的驱逐舰之一——“潮风级”“潮潮号”（Natsushio），为美国海军潜艇在战争早期取得了罕见的成功。次日，打捞工作被放弃，驱逐舰沉没。2
    月 9 日，日本人登陆望加锡并迅速占领了该港。通往爪哇的路开启了。


    ### 侵略苏门答腊


    到 2 月中旬，日本在东南亚的计划领先于进度。迄为止最大的成功发生在 2 月 15 日，当时新加坡的英国守军投降了。这为日本入侵苏门答腊开辟道路，它是从资源角度来看最重要的岛屿。关键目标是苏门答腊南部的巴里答林。那里不仅有两个主要的机场，对日本人来说最重要的是那里有两座炼油厂和大型油田。尽管位于内陆，但巴里答林位于易于大型船只航行的莫西河上，因此极易受到海上入侵。


    ![../img/CAM344_002.jpg](img/CAM344_002.jpg)


    “龙雀号”（Ryujo）于 1931 年下水，早期职业充满波折。战争开始时，她已经经过改装以解决稳定性问题，但由于飞行板和小型升降机无法进行高效的飞机操作，仍被认为是二线航母。她被分配支持菲律宾和东印度群入侵，搭载了
    16 架 A5M4“云雀”战斗机和 18 架 B5N1/2“天鱼”攻击机。尽管存在局限性，且每次只能发射一小小组飞机，“龙雀号”在战役期间是有效的。她的“天鱼”击沉了几艘盟军商船，但在
    2 月 15 日有机会攻击 ABDA 打击队时，她的飞机在四次单独攻击中无一命中。2 月 17 日，她的“天鱼”弥补了之前的糟糕表现，用三枚炸弹击沉了荷兰驱逐舰“范斯号”（Van
    Nes）。3 月 1 日，她的飞机协助击沉了美国海军驱逐舰“波普号”（Pope）。“龙雀号”在 4 月继续对印度洋盟军船只造成更多破坏，随后在 8 月于瓜达加尔附近被美国海军航母飞机击沉。（联合博物馆）


    ![../img/CAM344_051.jpg](img/CAM344_051.jpg)


    日本对巴里答林的进攻是由 360 名日本陆军伞兵先锋的。他们的命令是在荷兰人摧毁之前夺取油井、泵站和炼油厂。盟军部队最初的激烈反抗阻止了伞兵降落（如图所示）取得完全成功，但盟军的抵抗在两天内被粉碎了。（美国海军历史与遗产司令部）

