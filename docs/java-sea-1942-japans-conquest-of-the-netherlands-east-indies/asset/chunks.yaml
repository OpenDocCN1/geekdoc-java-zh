    # 爪哇海海战：第一阶段，1555–1720 时


    ![../img/9781472831613Art001_battlescene.jpg](img/9781472831613Art001_battlescene.jpg)


    ## “贺号”战斗


    重巡舰“级”（Nachi）和“贺号”（Haguro）是日本海军在爪哇海的主力。凭借其强大的`8 英寸`炮和鱼雷群，它们是双方现场最强大的舰只。战斗的初始阶段是“级”、“贺号”与盟军巡洋舰之间的远程火力对决。在图中，“贺号”的`8
    英寸`炮塔已抬高（1）并进行远距离射击，而盟军巡洋舰的水花在日本军舰附近爆炸（2）。为了弥补巡洋舰远程火不足，高木少将决定出动远程的`93 式`鱼雷。作为大规模鱼雷齐射的一部分，“贺号”准备发射其右舷侧的八枚鱼雷。该巡洋舰已经训练了其两个右舷四联发射器，并在`1652
    时`发射了鱼雷，如图中所示（3）。图中未显示的是，几枚鱼雷在距离舰体几百码处即爆炸，形成了巨大的水柱。问题出在鱼雷的信管上，这在整个战斗中都是问题。领先队列的“级”巡洋舰未能再贡献八枚鱼雷，因为其鱼雷乘员离开了一个阀门，导致发射所需的空气压力泄露。在这一轮齐射的
    39 枚`93 式`鱼雷中，仅有一枚命中。但这一击是致命的；`1713 时`，“贺号”的一枚鱼雷击中了荷兰驱逐舰“科尔塔纳号”（Kortenaer）的中部，使其在几分钟内沉没。


    ## 爪哇海海战


    多曼在向西北进攻日军时，选择将部队布置成三列平行纵。中列由他的五艘巡洋舰组成，由旗舰“敌特特号”（De Ruyter）领头。主列两侧是两列驱逐舰，一列由三艘英国驱逐舰组成，另一列由六艘荷兰和美国驱逐舰组成。荷兰的“科尔塔纳号”有锅炉问题，导致最高速度降至`26
    节`，并落了队。同样掉在后面的是四艘美国驱逐舰，它们收到多曼的命令不要超过荷兰驱逐舰。联合打击队速度无法超过`26 节`成为战斗的关键因素。多曼速度较慢意味着他不太可能在机动上超过日军，也使得对运输小组进行任何无阻碍的突击变得更加渺茫。


    ### 白天阶段


    双方继续接近。`1610 时`，“埃莱特拉号”（Electra）发现了最西边的日本军群——轻巡舰“津号”（Jintsu）及其四艘驱逐舰。几分钟后，“埃莱特拉号”也报告了那两个日本重巡舰。与此同时，日本军群也发现了多曼的部队。`1615
    时`，“津号”开始战斗，向“埃莱特拉号”发射其`5.5 英寸`主炮。距离为`18,000 码`，接近该武器的最大射程。尽管如此，日本炮手仍能让弹落落在目标两侧。首发齐射后，“级”和“贺号”在`28,000
    码`处对盟军重巡洋舰开了`8 英寸`炮的火。他们的首发弹明显偏后了。根据日本海军的海战理论，高木乐于进行远程火力对决，因为他认为自己的火力在远距离更有效，并借此限制盟军利用三艘巡洋舰上的`6
    英寸`炮反击的能力。“埃塞特号”（Exeter）舰长没有等命令就下令在`1617 时`还击，随后“休斯顿号”（Houston）的前方两座`8 英寸`炮塔也加入了战斗。日军和盟军的远程火力均无成效。“休斯顿号”声称命中；`1631
    时`，一枚日本的`8 英寸`炮弹击中了“敌特特号”，但那是哑弹。日本巡洋舰的火力足够准确，偶尔能落弹目标，但在`26,000 码`或更远距离处，命中的概率很小。


    两支巡洋舰力量继续保持大致平行航线。高木不愿缩短距离，继续执行远程火力攻击的战术。多曼需要缩短距离以便他的`6 英寸`巡洋舰投入战斗。由于三艘巡洋舰上有 25
    门`6 英寸`炮，这是他唯一的优势领域。但再次，较慢的速度迫使多曼应对日军的机动。为了避免被日本重巡洋舰“过头”（一种战术，一方横穿过另一方，使得通过的一方可以动用全部侧射火力，而被横穿的一方只能动用前部火力），多曼在`1635
    时`命令向正西转弯。这暂时缓解了日本重巡洋舰“过头”的可能性，但未能未能缩短足够的距离以让`6 英寸`巡洋舰加入火力对决。


    当重巡洋舰交火时，高木计划出动日本帝国海军的秘密武器——远程`93 式`鱼雷。大规模鱼雷攻击将在盟军预计受攻击的距离之外进行，而日军预料结果将是毁灭性的。鱼雷齐射攻击在盟军预期攻击范围之外进行，西村操纵他的轻巡舰和六艘驱逐舰以执行高木的鱼雷攻击命令。`1634
    时`，他的舰只率先在`15,000 码`处发射了鱼雷。在`1640`到`1645 时`之间，他的驱逐舰向联合打击队发起了。除了西村的舰只，轻巡舰“津号”在`1635
    时`发射了四枚，“贺号”在`1652 时`在`22,000 码`处发射了八枚。“级”未能再贡献八枚，因为其鱼雷乘员离开了一个阀门，导致发射所需的空气压力泄露。这一轮齐射的
    39 枚鱼雷为高木只换来了令人失望的回报。`1713 时`，一枚鱼雷击中“科尔塔纳号”中部。根据附近美国驱逐舰长的说法，那艘荷兰驱逐舰在不到两分钟内消失了。


    ![../img/9781472831613Art002_battlescene.jpg](img/9781472831613Art002_battlescene.jpg)


    ## 困中的埃塞特号


    在一小时无果的远程炮战后，双方造成的伤害均小。`1700 时`左右，日军缩短距离以寻求决胜。与此同时，他们将火力集中在“埃塞特号”和“休斯顿号”这两艘最大的盟军舰上。`1708
    时`，“埃塞特号”（1）被“贺号”的一枚`8 英寸`炮弹命中。日本海军的火力非常准确，正如那发齐射落在巡洋舰两侧所示，图中可见两次爆炸（2）以及击中舰体的第三枚弹。单枚`8
    英寸`炮弹的后果是毁灭性的，并在很大程度上决定了战斗。炮弹击中了一个`4 英寸`双联炮座的盾罩，然后穿过装甲门进入锅炉室通风口。炮弹穿过“A 锅炉室”，碎片四处飞溅，然后穿入“B
    锅炉室”造成了进一步损害。结果是导致两个右舷锅炉停止工作，由于过热器的损坏导致四台后部锅炉无法使用。过热蒸汽充满了后部锅炉室，导致机舱人员除一人外全部丧生。八个锅炉中损失了六个导致速度降至仅有`6
    节`。功率下降也导致其主炮无法作用。在图中，“埃塞特号”正在进行紧急转弯以避免与后方的巡洋舰碰撞。浓烟已经从两个烟囱冒出，表明下方锅炉室的损坏（3）。“埃塞特号”在炮塔失去动力前发射了最后一发`8
    英寸`齐射（4）。“休斯顿号”在“埃塞特号”后方`600 码`处，它正在向左紧急转弯（5）。


