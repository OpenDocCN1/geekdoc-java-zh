    在剩下的日光时间中，高木评估了他的下一步行动。多尔曼的部队正向东进，显然是准备返回基地。多枚鱼雷的爆炸（实际上是 `Type 93` 提前爆炸）预示着盟军遭受了惨重损失。日本军已靠近爪哇岛岸，高木希望避开荷兰人的水雷区。战斗似乎已经结束，于是高木命令他的战斗舰向北重组，并让护航队向南前往其登陆区域。


    多尔曼遭受了损失，但仍坚持要找到入侵护航队。`1831hrs`，他转向东北方向。他没有关于护航队位置的具体信息，但推测在自己北方的某个地方。他的部队已缩减为剩余的四艘巡洋舰、驱逐舰`Jupiter`
    以及四艘美国驱逐舰，这些船只都没有剩余鱼雷，且燃料都已不足。


    ![../img/9781472831613_Map007.jpg](img/9781472831613_Map007.jpg)


    爪哇海海战：第四阶段，`1900–1950hrs`


    #### 夜战


    联合打击队的转向在发生几分钟内便报告给了高木，这次是来自`Jintsu`的一架飞机。高木试图重新集合他的部队以应对多尔曼的猛攻。这花费了一段时间，因为在规模化鱼雷攻击之后，各个驱逐舰队分散在各地。田中三个分区中的最后一个直到
    `1907hrs` 才集结完毕。西村的两艘驱逐舰`Asagumo` 和`Minegumo` 均受损，前往加入护卫队并离开了战斗。


    多尔曼向北的移动暂时让高木措手不及。在`1904hrs`，他命令护卫队再次向北移动以躲避危险。更危险的是，`Nachi` 和`Haguro` 正在回收浮上飞机，这意味着它们处于停止状态，极易受到攻击。从
    `1857` 到 `1922hrs` 期间，没有发现处于这种状态的日本巡洋舰，一旦再次航行，巡洋舰上的望哨兵发现了东南方向的盟军编制。田中中队短暂地进入了两支巡洋舰力量之间的一个位置，并在
    `1933hrs` 遭到`Houston` 和 `Perth` 的炮击。`Jintsu` 以四枚鱼雷回击，但均未命中。


    多尔曼仍坚持要突破运输舰，他转向东方，意图向南向海岸移动以绕过日本军。`2100hrs`，他再次向西行驶。此时，四艘美国驱逐舰的指挥官托马斯·H·宾福德指挥官决定带着他的船返回仅向东约
    50 英里的`Soerabaja`。他给出的理由是鱼雷已耗尽，燃料也快用完了。此外，宾福德警惕跟随多尔曼进入一场无法获胜的战斗。在 2 月 27 日早晨在多尔曼指挥下出发的所有船只中，只有宾福德的四艘驱逐舰在
    3 月 2 日傍晚仍浮在水面上。


    ![../img/CAM344_075.jpg](img/CAM344_075.jpg)


    该战役中最强大的盟军驱逐舰——英国的`Jupiter` 被一枚漂浮的荷兰水雷击沉。爆炸发生在船的一个机舱内，导致该房间和锅炉被淹没并引起动力中断。缓慢进水导致船在四小时后沉没，损失了
    70 名船员。（荷兰军事史学会）


    ![../img/9781472831613_Map008.jpg](img/9781472831613_Map008.jpg)


    爪哇海海战：第五阶段，`2300–2400hrs`


    ![../img/CAM344_074.jpg](img/CAM344_074.jpg)


    在`Soerabaja`海军基地码头拍摄照片的`De Ruyter`船员。在其 437 名船员中，当船只被一枚鱼雷命中时，有 235 人遇难。当船员被命令弃船时，过程非常混乱，尽管该船在被鱼雷命中后花了两个半小时才沉没，但仍有许多人牺牲。（荷兰军事史学会）


    美国驱逐舰的离开使得多尔曼指挥下仅剩五艘船——四艘巡洋舰和`Jupiter`。驱逐舰`Encounter`掉在后面试图追赶。来自`Naka`的一架浮上飞机取代了`Jintsu`的飞机，并使用信号弹标记盟军部队的进展。更多的厄运困扰着盟军。在`2125hrs`，正当多尔曼带领部队向北最后一次尝试寻找运输舰时，`Jupiter`撞中了一枚荷兰水雷。该船失去动力，并在几小时后沉没。


    盟军部队继续向北，徒劳地寻找入侵护卫队。此时双方都精疲力竭且弹药不足。`Perth`仅剩 160 枚 6 英寸炮弹，`Houston`只剩下约 300 枚
    8 英寸炮弹。多尔曼拒绝考虑停止战斗，但无论他意愿如何，战斗很快就会结束。`2200hrs`，高木失去了与`Naka`的无线电联系。他紧张地命令向南航行，带着两艘巡洋舰并让驱逐舰队加入他。直到`2302hrs`，`Nachi`上的望哨兵发现了东南方向
    16000 处的多尔曼纵队。日本巡洋舰向北转向采取平行航线，准备进行鱼雷攻击。盟军巡洋舰在`2310hrs`发现日本舰只并开火。日本在`2321hrs`回击。他们只剩下三分之一的
    8 英寸弹，但日本人有足够的`Type 93`鱼雷进行最后的齐射。这一轮于`2322hrs`发射，其中`Nachi`提供了八枚鱼雷，`Haguro`提供了四枚。距离约为
    14000 码。多尔曼试图机动以应对鱼雷攻击，但为太晚了。


    12 枚鱼雷中有两枚命中。`2336hrs`，来自`Nachi`的一枚`Type 93`击中`Java`尾部。1078 磅战斗头的冲击导致后部药库爆炸，炸断了巡洋舰尾部约
    100 英尺。考虑到巡洋舰隔水分区不完善，这是一个致命的一击。船员被命令弃船，在命中后 15 分钟内，`Java`便沉没，528 名船员中仅有 19 人幸存。可能认为鱼雷威胁已经过去，`De
    Ruyter`向右转，将侧弦暴露在`Haguro`的四枚鱼雷下。其中一枚击中尾部，产生的大火吞噬了船的整个后部。动力也丢失了，导致无法灭火。`De Ruyter`在深夜`0230hrs`沉没，损失了
    344 人。伤亡中包括多尔曼，他拒绝离开船。


    随着这些毁灭性的打击，战斗结束了。`Houston`和`Perth`改变方向向东南进发。根据多尔曼不尝试救援幸存者的命令，没有尝试救援荷兰巡洋舰的幸存者。日本驱逐舰试图攻击剩余的盟军舰，但在烟雾和混乱中无法实现。第二天中午，两艘幸存舰到达了`Tanjung
    Priok`。


    ### 盟军彻底溃败


