    \n# OPPOSING PLANS\n\n### THE JAPANESE PLAN\nThe most important aspect of Japan’s\
    \ war plans for the initial phase of the war was the seizure of the resources\
    \ of Southeast Asia. The Japanese had to quickly gain and bring back into operation\
    \ the oil fields of Borneo, Java, and Sumatra. Of these, the Sumatran wells were\
    \ the most important. The principal Allied military, air, and naval forces in\
    \ Southeast Asia were the British garrison in Malaya. These had to be neutralized\
    \ concurrent with the drive into the NEI. Furthermore, the Japanese faced the\
    \ strategic imperative to neutralize American forces in the Philippines, since\
    \ they were convinced that the United States would intervene if Japan attacked\
    \ British and Dutch possessions in Southeast Asia. Added to the difficulty for\
    \ the Japanese that the campaign against British, American, and Dutch forces was\
    \ the requirement to move as quickly as possible before the Dutch had the opportunity\
    \ to destroy the economic facilities and before the British and Americans could\
    \ reinforce their possessions.\n\nThe forces available to the Japanese were barely\
    \ sufficient for the expansive operation they were embarking on. The lack of shipping\
    \ to transport the invasion forces meant that the operations would have to be\
    \ conducted in sequence. In five months, the Japanese envisioned completing the\
    \ three phases of the campaign to bring Southeast Asia under their control. In\
    \ the first phase, the forward outposts of the Allied defenses were slated for\
    \ occupation. These included Hong Kong, northern Malaya, British Borneo, Sarawak,\
    \ and the Philippines. The second phase required the occupation of the entire\
    \ Malay Peninsula, including Singapore, and the northern islands of the NEI. Finally,\
    \ in the third phase, Sumatra and Java were to be occupied.\n\nThe key to the\
    \ Japanese plan was maintaining a relentless pace. The Japanese plan was almost\
    \ reckless, but as a planning assumption they made the assessment that the Allies\
    \ would be unable to offer an adequate defense. Despite the bravery of the Allied\
    \ forces, the initial Japanese assessment proved correct and the Japanese were\
    \ able to execute their bold plan on time and with marginal losses. Another key\
    \ was the early seizure of air superiority and the imperative that advances only\
    \ be conducted under friendly air protection. The Japanese planned to seize an\
    \ airfield and move south under the protection of the aircraft. Since all the\
    \ IJN’s fleet carriers were initially supporting the Hawaiian Operation, the burden\
    \ for supporting the invasion of the NEI was placed on land-based 11th Air Fleet\
    \ with its air flotillas. The Japanese made good use of the light carrier `Ryujo`\
    \ and a number of selane carriers to provide local air cover, but the entire plan\
    \ was dependent on land-based air forces gaining air superiority over the next\
    \ objective.\n\nThe maneuver scheme for the principal naval forces was simple.\
    \ Vice Admiral Kondo would provide distant support for the invasion forces with\
    \ his heavy force built around two battleships. The Eastern Force, under Vice\
    \ Admiral Takahashi, was initially based at Palau. After supporting the occupation\
    \ of Mindanao in the Philippines, it would support the occupation of Jolo, Tarakan,\
    \ Balikpapen, and Banjermasin on eastern and southern Borneo; then Menado, Makassar,\
    \ and Kendari in the Celebeas; then Ambon in the Moluccas; then Timor in the Lesser\
    \ Soendas. The final objective was the occupation of Java, for which the Eastern\
    \ and Western Forces would unite. Before reaching Java, the Western Force, under\
    \ Vice Admiral Ozawa, was initially based out of Hainan Island and Cam Ranh Bay\
    \ in French Indochina. This force was initially focused on protecting the landings\
    \ in southern Thailand and northern Malaya. After these, Borneo was next, followed\
    \ by points on Sumatra, principally the oil fields at Palembang. The final seizure\
    \ of Java would mark the end of the campaign.\n\n### THE ALLIED PLAN\n"
