    当第二波援到达时，`Oshio` 和 `Asashio` 正在受损的 `Sasago Maru` 东东岸外巡逻。`Arashio` 和 `Michishio`
    正在向南移动，由巡洋舰 `Nagara` 领导的掩护力量也向该区域驶来。盟军第二波部队由四艘美国驱逐舰领队，荷兰巡洋舰 `Tromp` 在其后五英里跟随。巡洋舰长负责战术指挥，他计划让
    `Tromp` 解决那些因驱逐舰鱼雷攻击而残的船只。


    美国驱逐舰以 `25` 节的速度进入锚港区。他们预料将面对一支规模大得多的日本力量；此前试图与第一波次中的两艘美国驱逐舰接触的努力没有获得任何信息。`0135hrs`，`Stewart`
    在左舷发现了一个可能的接触目标。几分钟内，她和 `Parrot` 向锚港内发射了六枚鱼雷，`Pillsbury` 又发射了三枚。所有 `15` 枚鱼雷全部落空，而且它们可能根本没有针对真实目标发射。`Asashio`
    和 `Oshio` 最终发现了美国人并转向战斗。`0143hrs`，`Stewart` 发现了日本军并使用其探照灯和 `4in.` 炮进行战斗。日本军还击了猛火，并于
    `0145hrs` 在 `3,500` 码处向美国人发射了鱼雷。双方造成的首次损伤发生在 `0146hrs`，当时几枚日本的 `5in.` 弹击中了 `Stewart`。受损的
    `Stewart` 向东北方向转向，扰乱了美国军队的纵队。


    当 `Tromp` 使用探照灯向美国驱逐舰信号时，日本驱逐舰将注意力转移到了 `Tromp`。从约 `3,300` 英里的距离处，`Asashio` 用 `11`
    枚 `5in.` 炮轰击 `Tromp`，导致其上层设备遭受严重损坏。`Oshio` 的齐射鱼雷错过了这艘巡洋舰。`0216hrs`，`Tromp` 一枚
    `5.9in.` 炮弹命中 `Oshio` 的指挥楼，造成七人死亡。`Tromp` 和所有四艘美国驱逐舰继续向东北方向驶去。


    战斗的下一阶段出现了 `Arashio` 和 `Michishio`，它们正沿着炮声向南。`0215hrs`，`Michishio` 发现了两个接触目标，并使用探照灯照亮它们。它们是
    `Stewart` 和 `John D. Edwards`。两艘美国驱逐舰在 `Pillsbury` 的加入下，用其 `4in.` 炮和 `John D.
    Edwards` 的六枚鱼雷对 `Michishio` 实施攻击。`Pillsbury` 又释放了三枚鱼雷。措手不及的日本军陷入了致命的交叉火力中。所有鱼雷全部落空，但一枚
    `4in.` 炮弹击中了驱逐舰的 `2` 号 `5in.` 炮座，将其摧毁并杀死了船员。另一枚炮弹击中指挥楼，伤了 `Michishio` 的舰长。


    `Tromp` 随后向日本驱逐舰的机舱又发射了三枚弹，使其停止了动力。盟军船只没有留下来解决那艘残废的驱逐舰，而是继续向东北方向移动并脱离。


    盟军的第三波攻击完全无效。在命令进攻的九艘鱼雷艇中，只有八艘到达了战斗区域。它们以四四一组的形式进入海峡。一组没有发现任何接触，另一组发现了正在高速移动的可能目标，但无法进入攻击位置。所有鱼雷艇在无所获的情况下返回了
    `Soerabaja`。


    ![../img/CAM344_048.jpg](img/CAM344_048.jpg)


    驱逐舰 `Stewart` 在巴多登海峡战战后被送到 `Soerabaja` 进行修理。`2 月 20 日` 当她所在的干船坞正在排水时，该船由于加固不当发生了倾覆。在日本人占领该市之前，干船坞于
    `3 月 2 日` 被沉。`1943 年 2 月`，该船被日本海军（`IJN`）打捞并作为 `Patrol Boat 102` 服役。这里显示的是她战后的样子，已被归还给美国海军管辖并被授予此处原始船体编号。（美国海军历史与遗产司令部）


    双方都认为自己给对方造成了严重损害。实际上，盟军错失了一个对日本人造成局部击败的绝佳机会。在第一波攻击中，`Doorman` 拙劣的战术计划浪费了盟军赢得胜利的最佳希望。那两艘日本驱逐舰的操作非常激进且出色。首先，他们击退了两个荷兰轻型巡洋舰的攻击，对方未能扩大优势；接着他们压制了单艘荷兰驱逐舰；最后赶走了两艘美国驱逐舰。第二波虽然获得了暂时的奇袭，但未能扩大优势。盟军付出的代价是巨大的。一艘驱逐舰（`Piet
    Hein`）沉没，轻巡洋舰 `Tromp` 迫被迫前往澳大利亚修理，这使她离开了战斗。美国驱逐舰 `Stewart` 被送到 `Soerabaja` 的干船坞修理。不幸的是，干船坞坍塌了，`Stewart`
    的战斗生涯就此结束。她后来被日本人打捞，并在战争剩余时间里作为日本海军的巡逻艇服役。日本人认为他们造成的损害更大，声称第一波攻击中沉没的三艘驱逐舰中有两艘，第三艘受损严重。日本人的总声称是击沉了两艘巡洋舰和三艘驱逐舰，以及两艘驱逐舰受损严重。`Yamamoto`
    接受了这些声称作为事实。


