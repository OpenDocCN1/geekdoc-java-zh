    Before the war, the Allies to be did not possess coherent plans on how to deal
    with Japanese aggression. British defense planning to defend their Far East possessions
    centered on the major naval base at Singapore. As impressive as this base was
    when it was completed, it lacked a fleet. The Royal Navy simply lacked the means
    to assemble a fleet for duty in the Far East as the war raged in Europe. Reflecting
    this reality, London admitted to its military command in Malaya in September 1939
    that it could be as long as six months before a fleet could be assembled and sent
    east. In late 1941, as Great Britain’s war fortunes in Europe were at low ebb,
    it became apparent that it was impossible for the Royal Navy to shift a significant
    force to the Far East. The lack of a naval force to protect or relieve Singapore
    meant that it had to be held by ground and air forces, but in both these areas
    the British forces in Malaya were greatly inadequate. The bottom line was that
    British naval forces were inadequate to defend Singapore, much less to provide
    assistance to the Dutch.


    Dutch defense strategy was clearly dependent upon intervention by the British
    or Americans, or both, to defend the NEI. In spite of this obvious circumstance,
    the Dutch refused to conduct joint defense planning with their prospective allies
    before the war. With a small naval force, supported by a small air force of some
    200 combat aircraft, and with an under-equipped and poorly trained ground force
    of only three divisions, the NEI was virtually undefended. Since the Netherlands
    were occupied by the Germans, there was no source of potential reinforcement for
    the NEI, and keeping the ships and aircraft already deployed to the NEI operational
    was increasingly difficult.


    The only power with the potential capability to defend the NEI was the United
    States. However, the focus of American defense planning in the Far East was the
    defense of the Philippines, then an American possession. The US Navy had a permanent
    presence in the region, a small force given the grandiloquent name of the Asiatic
    Fleet. The Asiatic Fleet was unclear as to its commitments in the period immediately
    before the war. Pre-war plans recognized that the Philippines could not be defended
    and that no major attempt by the Pacific Fleet to relief the garrison there should
    be attempted. This left the Asiatic Fleet on its own. It was tasked with buying
    time in the defense of the Philippines, and when this became impossible, to withdraw
    southward and support the British defense of Malaya or the defense of the NEI.


    When war was imminent, it was confirmed that no naval reinforcements for Southeast
    Asia were forthcoming from the US Navy’s Pacific Fleet. The Royal Navy was able
    to send a small deterrent force to the Far East in the form of `Force Z`. This
    made preservation of Singapore an Allied, not just a British, imperative. It was
    also soon clear that no naval defense could be mounted of the Philippines because
    of its exposed position. In the days before the war, Hart pulled his forces off
    their China stations and from the main naval base at Cavite in Manila Bay, and
    moved his forces south for preservation. For the Asiatic Fleet, force preservation
    from the initial Japanese onslaught was key. Once ejected from its main base in
    Manila Bay, the Asiatic Fleet was ordered to head south and operate out of bases
    in the NEI and Darwin in northwest Australia. Combined with the Dutch, and whatever
    British units were left after the `Force Z` debacle, an Allied striking force
    could be formed to mount a defense of the NEI. The overriding Allied strategy
    was to defend the Malay Barrier and keep the Japanese out of the Indian Ocean.
    The Japanese invasion showed how fragile any Allied plans were.


    ## THE CAMPAIGN


    With the rout of British forces on Malaya well underway, and the withdrawal of
    American forces into the Bataan Peninsula, the battle for the NEI was about to
    begin. Admiral Hart moved to Java by submarine and arrived safely there on January
    1, 1942. Upon his arrival, he learned he had been named commander of ABDA naval
    forces. He was immediately faced with the political intrigues of the Dutch authorities
    on Java and the approaching Japanese  storm.


    ### THE BATTLE OF BALIKPAPAN


    The Japanese campaign to conquer the NEI began on December 25, 1941 with a landing
    on Jolo Island in the Sulu Archipelago. The next move was conducted by the Eastern
    Force on January 11 when Special Naval Landing Force (`SNLF`) troops landed at
    Menado and Kema on the northern Celebes, supported by SNLF paratroopers. The important
    port of Kendari was located further south on Celebes. Hart assessed that this
    was the next Japanese target and made plans to intercept a Japanese thrust in
    that direction. Until now, American naval forces had not engaged the Japanese
    and Hart thought it was past time to do so. While British and Dutch naval forces
    were primarily occupied in escorting convoys, the first significant naval action
    of the campaign would be initiated by the Americans.


    The pace of the Japanese advance increased when on January 12 an invasion force
    under Rear Admiral Nishimura captured Tarakan on northeast Borneo. The Dutch defense
    was weak, and the Japanese captured the airfield intact. The airfield was brought
    into operation within days, which provided air cover for the next operation. This
    was a landing on Balikpapan which was an important port and oil facility on Borneo’s
    southeast coast. Nishimura sortied on January 21 with an invasion force for Balikpapan.


    In response to the Japanese advances on Borneo and in the Celebes, Rear Admiral
    Glassford was ordered to bring `Task Force 5`, the Asiatic Fleet’s striking force,
    to readiness. At various times, the force included cruisers `Houston`, `Boise`,
    `Marblehead`, and as many as eight destroyers. On January 17, Glassford led the
    cruisers, escorted by six destroyers, to attack a Japanese force reported off
    Kema. On this occasion, as on many, the intelligence was faulty. Three days later,
    in response to Dutch reports of Japanese activity in the Makassar Strait, Glassford
    departed Koepang on Timor Island with `Boise` and `Marblehead` escorted by six
    destroyers. While transiting, disaster struck. `Boise`, the most powerful unit
    in the Asiatic Fleet, struck an uncharted reef in the Sape Strait on January 21.
    The cruiser suffered a 120ft-long gash to her hull which caused flooding damage
    to some of her machinery. `Boise` was forced to leave the area for repairs, a
    major loss for the Americans but almost certainly a fortuitous event for the ship
    and its crew. The latest report of Japanese activity was also false, but as a
    precaution, Glassford ordered the four destroyers of `Destroyer Division 59` to
    patrol in the southern Makassar Strait.


    ![../img/9781472831613_Map002.jpg](img/9781472831613_Map002.jpg)


    Battle of Balikpapan, January 24, 1942


    ![../img/CAM344_032.jpg](img/CAM344_032.jpg)


    The US Navy’s flush deck destroyers were bad sea boats, since they had narrow
    hulls and were top heavy and prone to rolling. Of their four 4in. guns, only three
    could be fired broadside. On the positive side, the ships did carry a heavy torpedo
    battery of 12 tubes, which reflected a design emphasis on producing a good torpedo
    boat. This is a photograph of `John D. Ford` soon after her completion. (US Naval
    History and Heritage Command)

