    威尔士亲王号命运已成定局。最后一组进攻的 `G3Ms` 命中了一枚 1,100 磅的炸弹。炸弹穿透主甲板并爆炸，造成了惨重的伤亡。战舰继续下沉，在`1315hrs`，船员接到命令撤离坦克。五分钟后，军舰向左侧倾覆，导致
    327 名船员丧生。作为对这次精彩攻击的回报，日本损失了三架飞机和 21 名机员。`Z 舰队`的覆灭消除了盟军在东南亚唯一的重大海军力量。随着英国海军力量遭到破坏，美国在菲律宾空军被中和，防止日本入侵东印度属群岛（NEI）的唯一力量是一支由美、澳、英、荷水面战斗组成的临时部队。其保卫东尼的能力很快将面临考验。


    # 年表


    ## 1941 年


    ### 12 月 8 日

    日本人在马来亚的哥打巴西峇鲁（`Kota Bharu`）以及泰国的宋卡（`Singora`）和北大叻（`Patani`）登陆。


    ### 12 月 10 日

    `Z 舰队`被日本陆基飞机摧毁。


    ### 12 月 16 日

    日本人在英属波罗洲的美里（`Miri`）登陆。


    ## 1942 年


    ### 1 月 10 日

    建立`ABDA 司令部`。


    ### 1 月 11 日

    日本对东印度属群岛（`NEI`）宣战。

    日本人在望加锡的曼瑙（`Menado`）、肯马（`Kema`）和邦加海峡（`Bangka Roads`）登陆。


    ### 1 月 12 日

    日本占领荷兰属波罗洲的打端（`Tarakan`）。


    ### 1 月 23 日

    日本人在荷兰属波罗洲的巴西立巴潘（`Balikpapan`）登陆。


    ### 1 月 24 日

    `美国海军`驱逐舰对巴西立巴潘的登陆部队进行袭击。

    日本占领望加西岛的肯达里（`Kendari`）。


    ### 1 月 3 日

    日本占领安汶岛（`Ambon Island`）。


    ### 2 月 2 日

    建立`ABDA 出击队`。


    ### 2 月 4 日

    望加锡海峡海战。


    ### 2 月 14 日–17 日

    邦加海峡海战。


    ### 2 月 15 日

    新加坡投降。

    日本占领邦加岛（`Bangka Island`）和苏门答腊的亚民登（`Palembang`）。


    ### 2 月 16 日

    日本占领荷兰属波罗洲的占井马辛（`Bandjermasin`）。


    ### 2 月 18 日

    日本占领巴厘济岛（`Bali`）。


    ### 2 月 19 日

    巴当县海峡海战（`Badoeng Strait`）。

    日本航母舰队对澳大利亚的达文港（`Port Darwin`）进行袭击。


    ### 2 月 20 日

    日本人在帝汶岛（`Timor Island`）登陆。


    ### 2 月 27 日–3 月 1 日

    爪哇海海战。


    ### 2 月 28 日–3 月 1 日

    巽达海峡海战。


    ### 3 月 8 日

    东印度属群岛（`NEI`）投降。


    ### 3 月 28 日

    日本完成对苏门答腊岛的占领。


    # 敌指挥官


    ## 日本指挥结构与指挥官


    控制日本海军（`IJN`）所有重要元素的`联合舰队`由山本五郎中将（`Admiral Yamamoto Isoroku`）指挥。他可能是少数几个清楚预见到`美国`与`日本`战争结果的日本高级指挥官之一，但他完全支持在东南亚的侵略战争，并试图解决那个可能存疑的假设，即攻击英荷殖民地会导致`美国`参战。他的珍珠港袭击确保了`美国`的参战，并杜绝了谈判和平的可能性。山本在东尼属群岛战役后期干预，为虚弱的盟军海军提供了一个他们无法利用的机会。


    山本将`联合舰队`的大部分力量投入东南亚战役。鉴于其名为“南方远征军”，它由近藤信信中将（`Vice Admiral Kondo Nobutake`）指挥。在和平时期，他是第二舰队的指挥官。从所有记录来看，他是一位能干且进取的指挥官。他在领导东南亚战役中的成功使其获得了未来的重要任命，直到他在瓜达加纳尔遭遇失败。在瓜达加纳尔之后，他再也没有获得过任何海上指挥任务。


    ![../img/CAM344_018.jpg](img/CAM344_018.jpg)


    山本中将作为`联合舰队``总司令`监督了东尼属群岛战役。在日军绝对的力量优势下，几乎毫无疑问行动会成功。然而，他在战役后期的那些可疑决定，为盟军提供了让日军遭受局部失败的可能。（美国海军历史与遗产司令部）


    ![../img/CAM344_019.jpg](img/CAM344_019.jpg)


    近藤中将是一位备受信赖且有能力的指挥官，被赋予了进攻马来亚和东尼属群岛的任。日本日本海军“大炮俱乐部”的成员，背景主要是巡洋舰和战舰。他在东南亚的成功使其在
    1942 年后期获得了其他重要任命。（美国海军历史与遗产司令部）


    ![../img/CAM344_022.jpg](img/CAM344_022.jpg)


    田中少将（`Rear Admiral Tanaka`）是日本海军最有成就的驱逐舰指挥官之一。他的战斗生涯始于东尼属群岛战役，随后在瓜达加纳尔战役中取得了更大的成功。（美国海军历史与遗产司令部）


    ![../img/CAM344_020.jpg](img/CAM344_020.jpg)


    西村少将（`Rear Admiral Nishimura`）在东尼属群岛战役中指挥日本海军的一个驱逐逐中队。因此，他被赋予指挥望加锡地区的任务。


    1 月 3 日

    日本占领安汶岛（`Ambon Island`）。


    2 月 2 日

    建立`ABDA 出击队`。


    2 月 4 日

    望加锡海峡海战。


    在瓜达加纳尔之后，他从未再次获得过海上指挥任务。


    西村少将，在东尼属群岛战役中指挥日本海军的一个驱逐逐中队。因此，他被赋予指挥望加锡地区的任务。


    ![../img/CAM344_018.jpg](img/CAM344_018.jpg)


    山本中将作为`联合舰队``总司令`监督了东尼属群岛战役。在日军绝对的力量优势下，几乎毫无疑问行动会成功。然而，他在战役后期的那些可疑决定，为盟军提供了让日军遭受局部失败的可能。（美国海军历史与遗产司令部）


    ![../img/CAM344_019.jpg](img/CAM344_019.jpg)


