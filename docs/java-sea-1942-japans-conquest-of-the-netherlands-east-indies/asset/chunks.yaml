    战争爆发前，盟军尚未对如何应对日本的侵略制定一致的计划。英国保卫其远东领地的防御计划集中在新加坡这一主要的海军基地上。尽管这座基地在建成时非常令人印象深刻，但它缺乏一支舰队。当欧洲战火正酣之时，英国皇家海军根本没有能力集结一支舰队派往远东执行任务。反映这一现实，伦敦于
    1939 年 9 月向其驻守马来亚的军事司令部承认，集结并派遣一支舰队向东移动最可能需要长达六个月的时间。1941 年底，随着英国在欧洲的战争运势处于低谷，事实显而易见：皇家海军无法向远东转移一支兵力力量。缺乏保护或救援新加坡的海军力量，意味着它必须依靠陆军和空军来守卫，但在这两个领域，驻守马来亚的英军都极其匮乏。底线是，英国海军力量不足以保卫新加坡，更不用说向荷兰援助了。


    荷兰的防御策略显然依赖于英国或美国（或两者）的干预来保卫荷属东群岛（NEI）。尽管情况显而易见，荷兰在战前拒绝与其潜在盟友进行联合防御规划。由于只有一支规模较小的海军、一支约
    200 架战斗机的小型空军支持，以及仅三个师装备不精良且训练差的陆军，荷属东群岛几乎处于无防御状态。由于荷兰被德国占领，荷属东群岛失去了潜在的援军来源，且维持已部署在当地的船只和飞机运行变得日益困难。


    唯一具有保卫荷属东群岛潜力能力的力量是美国。然而，美国在远东防御规划的重点是保卫当时作为美国殖民地的菲律宾。美国海军在该地区拥有常驻，那是一支被冠以响亮名称“亚洲舰队”的小规模部队。亚洲舰队在战前直接期间的使命并不明确。战前计划承认，菲律宾无法得到保卫，太平洋舰队不应尝试对那里的守军进行任何大规模救援。这使得亚洲舰队处于孤立无援。它的任务是在保卫菲律宾时争取时间，当这变得不可能时，则向南撤离，支持英国对马来亚或荷属东群岛的防御。


    当战争迫在眉睫时，确认美国海军太平洋舰队将不会为东南亚提供海军援军。皇家海军能够以`Force Z`的形式向远东派遣了一支小规模威慑力量。这使得保卫新加坡成为盟军（不仅仅是英国）的紧迫任务。很快也清楚，由于菲律宾位置的暴露，无法对其建立任何海军防御。在战前的几天里，哈特（Hart）将部队从中国驻地和马尼拉湾的主要海军基地撤出，向南移动以保存实力。对于亚洲舰队来说，从日军的第一波猛攻中保存实力是关键。一旦从马尼拉湾的主基地撤离，亚洲舰队被命令向南移动，并在荷属东群岛基地和澳大利亚西北部的达尔文基地开展行动。联合荷兰人以及在`Force
    Z`惨败后剩余的任何英军部队，可以形成一支盟军打击力量，从而对荷属东群岛筑起防御。盟军的首要战略是保卫马来地，并将日本人隔在印度洋之外。日本的入侵显示了任何盟军计划是多么脆弱。


    ## 战役


    随着英军在马来亚的溃败进行得如火如荼，美军退入巴丹半岛，荷属东群岛的战斗即将开始。哈特海军将乘坐潜艇前往爪哇，并于 1942 年 1 月 1 日安全抵达。抵达后，他得知自己已被任命为
    ABDA 海军部队司令。他立即面临着爪哇荷兰当局的政治勾当以及迫近的日本风暴。


    ### 巴里巴帕潘战役


    日本征服荷属东群岛的战役于 1941 年 12 月 25 日开始，登陆苏鲁群岛的朱洛岛。下一步行动由东方舰队于 1 月 11 日执行，当时海军陆战队（`SNLF`）在海军陆战队空兵的支持下登陆了苏里威斯岛北部的门纳多和肯马。重要的港口肯达里位于苏答望岛更靠南的地方。哈特判断这里是日本人的下一个目标，并制定了拦截该方向日军进攻的计划。到为止，美国海军尚未与日军交战，哈特认为是时候出手了。虽然英、荷兰海军主要忙于护送船队，但这场战役的第一场重大海军行动将由美国人发起。


    当 1 月 12 日，西村（Nishimura）少将率领的入侵军攻占婆罗尼岛东北部的塔拉干时，日本人的推进速度加快。荷兰的防御非常薄弱，日本人完整地占了机场。该机场在几天内就投入运行，为下一次行动提供了空中掩护。这是在巴里巴潘登陆，那里是婆罗尼岛东南岸一个重要的港口和石油设施。西村于
    1 月 21 日率领一支入侵军出击巴里巴潘。


    为了应对日本人在婆罗尼岛和苏答威斯岛的推进，格拉斯福德（Glassford）少将接到命令让亚洲舰队的打击力量`5 号特遣队`做好战斗准备。在不同时期，这支力量包括`休斯顿`、`波伊塞`、`大理石`号巡洋舰以及最多八艘驱逐舰。1
    月 17 日，格拉斯福德在六艘驱逐舰的护卫下带领巡洋舰进攻报告在肯马海域的一支日军。这一次，像很多时候一样，情报是错误的。三天后，响应荷兰关于望加锡海峡日军活动的报告，格拉斯福德在六艘驱逐舰的护卫下，带着`波伊塞`号和`大理石`号离开帝门岛的空邦。途中，灾难发生了。1
    月 21 日，亚洲舰队最强大的`波伊塞`号在萨佩海峡撞击了未标记礁石。这艘巡洋舰的船体产生了一个长 120 英尺的口，导致部分机械进水。`波伊塞`号被迫离开现场进行修理，这对美国人来说是一个重大损失，但对该舰及其船员来说几乎肯定是一件幸事。关于日军活动的最新报告也是假的，但作为预防措施，格拉斯福德命令第
    59 驱逐舰分队的四艘驱逐舰在望加锡海峡南部巡逻。


    '
- fmt: 'The continued advance of the Japanese Eastern Force and Hart’s prodding to
    Glassford to engage the Japanese made a naval clash inevitable. On January 22,
    an American flying boat sighted a large Japanese convoy under heavy escort heading
    toward Balikpapan. Again, Hart ordered `Task Force 5` to engage. By now, `Houston`
    and two destroyers had resumed escort duties, the damaged `Boise` was headed out
    of the area, and `Marblehead` was dealing with a turbine problem which limited
    her to 15 knots. Instead of `Task Force 5`’s original and powerful composition
    of three cruisers and eight destroyers, the nearest American units were the four
    destroyers of `Division 5` under Commander Paul H. Talbot. These moved north,
    beginning on the morning of January 23. The weather and seas during the day were
    bad, which allowed the Americans to make their approach undetected. Talbot intended
    to mount a surprise attack on the anchored Japanese invasion force two hours before
    dawn. He ordered his destroyers to use their torpedoes first; when these were
    expended, then gunfire. `Marblehead` and one destroyer were ordered north to cover
    the withdrawal of the destroyers.


    ![../img/CAM344_036.jpg](img/CAM344_036.jpg)


    Sailors work on one of the triple torpedo launchers in a flush-deck destroyer
    in this pre-war photograph. These launchers fired the `Mark 8` torpedo, which
    dated from World War I and was standard issue on flush-deck destroyers at the
    start of the war. It was riddled with reliability problems, like running too deep
    and failing to explode when it hit a target. This made any success by the Asiatic
    Fleet’s destroyers remarkable, like the raid at Balikpapan when five Japanese
    ships were sunk despite having to use this weapon. (US Naval History and Heritage
    Command)


    Awaiting the four American destroyers was a much more powerful force under Nishimura.
    The invasion force was embarked on 15 transports and escorted by `Destroyer Squadron
    4` with light cruiser `Naka` and ten destroyers. Providing close-in escort were
    three patrol boats (ex-Momi-class destroyers with their torpedo tubes removed
    but still fitted with two `4.7in.` guns), four minesweepers (each with two `4.7in.`
    guns), and three subchasers. During the evening of January 24, one of the transports
    was hit by Dutch aircraft and later abandoned. The remaining 14 transports arrived
    off Balikpapan at `2015hrs` and anchored in two rows. Just before midnight, a
    Dutch submarine launched four torpedoes at `Naka`; these missed their target but
    hit another of the transports. As the American destroyers neared their target,
    Nishimura deployed `Naka` and his destroyers west of the convoy, the three patrol
    boats to the south, and the four minesweepers to the north.


    The American destroyers swept into the anchorage at 27 knots. The anchored transports
    were silhouetted by the fires from the oil facilities ashore which had been set
    afire by the Dutch. Several Japanese ships spotted the American destroyers, but
    none raised a proper alarm. In the minutes before `0300hrs`, minesweeper `W15`
    spotted the approaching Americans. At first they were taken for `Naka`, which
    also had four stacks. Before the Japanese ship could engage, the four destroyers
    disappeared into the night. The Americans identified the minesweeper as a destroyer
    and three of the destroyers fired a total of seven torpedoes at the ship, but
    the angle was unfavorable and none hit.


    Talbot ordered his four destroyers to come around for another slashing attack
    against the anchored convoy. As this maneuver was taking place, `Parrott` fired
    three torpedoes at the northernmost transport in the line closest to shore. At
    least one hit the `Sumanura Maru`, which was carrying ammunition. The resulting
    explosion accounted for the transport and all but nine of her crew.


    As Talbot’s force was steering south, both `John D. Ford` and `Pope` fired a torpedo
    at patrol boat `P38`. Minutes later at `0306hrs`, `Pope` spotted a group of ships
    and fired five torpedoes, followed by `Parrott` and `Paul Jones` firing one each.
    These accounted for transport `Tatsukami Maru`. At `0314hrs`, the American column
    turned to starboard to attack the southern part of the anchorage. `John D. Ford`
    fired a torpedo at a target to port identified as a destroyer; this was followed
    at `0319hrs` by `Pope` firing five and `Parrott` three torpedoes at another “destroyer”
    to port. Three of these eight fish hit the 985-ton `P37` and she sank with the
    loss of 35 men. `Paul Jones` fired two torpedoes at the nearby `Kuretake Maru`,
    and the second one hit its target at `0325hrs`.


    Talbot continued his rampage inside the anchorage, even though two of his destroyers
    were out of torpedoes. `Pope` and `Parrott` now used their `4in.` guns and claimed
    multiple hits on transports and “destroyers.” Up until this point, the American
    column maintained its cohesion, making targeting easier in the smoke and confusion.
    At `0340hrs`, however, Talbot’s flagship `John D. Ford` lost contact with the
    other three destroyers, which headed south out of the action. `John D. Ford` still
    had torpedoes, and fired her last two at `Tsuruga Maru` at `0346hrs`. This was
    the transport hit four hours earlier by the Dutch submarine; the American torpedoes
    finished her off. `John D. Ford` then proceeded to pummel two more transports
    with `4in.` gunfire at close range. Though damaged, neither sank. By `0410hrs`,
    `John D. Ford` was also headed south. The only damage to the American force was
    a small-caliber hit on `John D. Ford`, which wounded four men.


    The American attack had been bold and resulted in a brilliant victory. Even using
    their unreliable torpedoes, the final tally was four transports and a boat sunk.
    By any measure, this was a successful action. The Japanese response was totally
    ineffective despite their prowess at night combat. Nishimura underestimated the
    Americans and for some reason did not believe more than a single destroyer could
    penetrate the anchorage. Even as the battle was drawing to a close, Nishimura
    was still three miles east of the convoy. More concerned about submarine attack,
    he left his convoy to the mercy of the American destroyers.


    Victory at Balikapan did not stop or even delay the Japanese advance. On January
    24, Kendari in the Celebes was captured with its fine port and well-equipped airfield
    complex. From here, the naval base at Soerabaja was within range of Japanese bombers.
    The first raid on the base occurred on February 3 and continued on a virtually
    daily basis until the end of the campaign.


    ### THE ABDA STRIKING FORCE IS FORMED


    Hart established the `ABDA Striking Force` on February 1. Initially, it was comprised
    only of available American and Dutch warships. The following day, he selected
    the Striking Force’s commander – Dutch Admiral Karel Doorman. By February 3, the
    Combined Striking Force was gathered east of Soerabaja. Present was `Houston`,
    `Marblehead`, and seven American destroyers. They were joined for the first time
    by Dutch cruisers `De Ruyter` and `Tromp`, with three more Dutch destroyers on
    their way. Hart was determined to use this powerful force to attack the Japanese
    invasion force headed for Makassar on the southern Celebes In discussion with
    Doorman, they decided to sortie the Striking Force at midnight on February 4 and
    head through the Flores Sea toward Makassar. This plan presented the possibility
    of attacking the Japanese, but to do so they had to transit through the Flores
    Sea in daylight. Furthermore, the Japanese air strike on Soerabaja on February
    3 had sighted the Striking Force in its nearby anchorage. This meant the potential
    for surprise had been eliminated.

