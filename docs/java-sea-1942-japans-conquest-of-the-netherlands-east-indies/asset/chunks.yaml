    发 8 英寸炮弹。最终，这种密集的火力将将取得成效。除了最初对 `De Ruyter` 的命中（那是一发哑弹）外，另一枚炮弹在 1706 时刻命中了 `Houston`——那同样是一发哑弹。1708
    时刻的下一次命中目标是 `Exeter`，这可能是整场战斗中最重要的一击。这枚炮弹可能来自 `Haguro`，穿透了锅炉室并爆炸。最终结果是导致该船八台锅炉中的六台停运，使航速降至
    11 节，并暂时性切断了主火力的电力供应。为了避免与后方的巡洋舰发生碰撞，`Exeter` 舰长命令这艘正烟雾滚滚的巡洋舰立即左转。随后的三艘巡洋舰也效法这样做，因为他们认为自己错过了领队
    `De Ruyter` 发出的信号。盟军纵队解体了；`De Ruyter` 继续向日本军推进，`Perth` 布下烟幕以掩护受伤的 `Exeter`。`Doorman`
    被迫掉头旗舰以重组部队。为了争取他需要的时间，他命令三艘英国驱逐舰执行鱼雷攻击。


    ![../img/CAM344_006.jpg](img/CAM344_006.jpg)


    `Haguro` 是爪哇海战中无可争议的明星。她负责用一颗 8 英寸炮弹击中英国重型巡洋舰 `Exeter`，使其丧失战斗能力，随后鱼雷击中了荷兰驱逐舰 `Kortenaer`。在战斗的最后阶段，她用鱼雷击中了
    `De Ruyter`，导致其沉没并结束了战斗战斗。`Haguro` 漫长的战争生涯于 1945 年 5 月 16 日在马六甲海峡结束于英国驱逐舰之手。（和和博物馆）


    ![../img/CAM344_076.jpg](img/CAM344_076.jpg)


    爪哇海战的首血战是击中驱逐舰 `Kortenaer`。`Type 93` 鱼雷命中中中部，将船体断为两段，两部分在 90 秒内均垂直落下。尾部立即沉没，但船头又过了五分钟才沉没，为船员提供了落水的时间。在
    153 名船员中，有 115 人在鱼雷袭击中幸存。（荷兰军事史学会）


    `Doorman` 直到 1725 时刻才重新建立控制。`De Ruyter` 带领其他巡洋舰（除去 `Exeter` 以及四艘美国驱逐舰向东北方向移动。二十分后，规模缩小的盟军部队向北方，从烟雾中出现，发现自己陷入了更大的麻烦。`Takagi`
    通过他的水上飞机（这些飞机几乎在整个战斗期间都在飞行）得知 `Doorman` 部队的困境。`Takagi` 决定对看起来完全混乱的盟军部队发动最后的进攻。为了彻底消灭盟军，他命令了另外一次大规模鱼雷攻击。这一轮齐射共共有惊人的
    98 枚鱼雷，主要目标是 `Exeter`。攻击从不同距离发起的——`Nachi` 和 `Haguro` 在 1754 时刻从 27,000 码外各贡献了
    8 枚；`Naka` 在 1750 时刻从 18,500 码外发射了 4 枚；`Jintsu` 在 1754 时刻从 20,000 码外发射了 4 枚。`第
    2 驱逐舰中队`的八艘驱逐舰在接近到 15,000 码后，每艘都发射了一个完整的齐次。来自`Nishimura` 第 4 驱逐舰中队`的四艘驱逐舰在 1804
    时刻接近到 10,000 码后发射了全部弹药。`Nishimura` 的最后两艘驱逐舰 `Asagumo` 和 `Minegumo` 在接近到 6,500
    码后，其中一艘发射了，另一艘则无法获得射击解。令人惊讶的是，这 98 枚武器没有一枚命中目标。日本的第二次大规模鱼雷攻击完全失败了。


    当日本驱逐舰接近发动攻击时，三艘英国驱逐舰从烟雾中出现。`Electra` 在前面，很快与 `Tanaka` 第 2 驱逐舰中队交战。`Electra` 经验丰富的船员在巨大的劣势下表现英勇。英国驱逐舰用一颗
    4.7 英寸炮弹击中了 `Tanaka` 的旗舰，导致一人死亡四人受伤。`Encounter` 紧随 `Electra` 走出烟雾，并立即对 `Jintsu`
    开火。`Nishimura` 的领先驱逐舰 `Asagumo` 和 `Minegumo` 离英国船最近；`Encounter` 和 `Minegumo` 在
    1800 至 1810 时刻之间进行近距离交火，日本船受了轻微损伤。与此同时，`Electra` 正忙于对付 `Asagumo`。英国船从 5,000 码外的一发炮弹命中
    `Asagumo` 的锅炉室，导致 4 人死亡 19 人受伤，使这艘日本船暂时停滞。`Electra` 的运气没有持续下去。`Asagumo` 先命中了英国船的指挥塔，随后命中锅炉室，导致电力丢失。`Minegumo`
    随后击了失去电力的 `Electra`，后者在 1816 时刻沉没。只有 54 名人员幸存，他们第二天被美国人救起。


    ![../img/978142831613_Map005.jpg](img/978142831613_Map005.jpg)


    爪哇海战：第二阶段


    在爪哇海战的初期，`Doorman` 的部队在两次鱼雷攻击中损失较小，但日本军击伤了 `Exeter`。重要的是，由于 `Exeter` 的速度无法超过 15
    节（尽管船员付出了巨大努力），`Doorman` 已命令其返回 `Soeraja`。由于日本军水上飞机向 `Takagi` 提供持续情报，`Doorman`
    似乎找到突破口。在与 `De Ruyter`、`Perth` 以及 `Java` 重新组织巡洋舰部队后，他向东移动并将部队置于日本军与 `Exeter` 之间。尽管处于不利局面，`Doorman`
    命令四艘驱逐舰在 1806 时刻进攻。这一命令很快被取消，但美国人随后被命令布置烟幕，最终掩护 `Doorman` 的撤退。`John D. Edwards`
    上的官们决定发动鱼雷攻击。为了避免过于接近 `Nachi` 和 `Haguro`，这四艘驱逐舰以 28 节的速度向日本军推进，从右舷发射了 20 枚鱼雷，然后掉头从左舷发射了
    21 枚。这些鱼雷的发射距离为 10,000 至 13,000 码，接近`Mark 8`的最大射。`Takagi` 谨慎决定让巡洋舰转向北方；所有鱼雷均未命中。


