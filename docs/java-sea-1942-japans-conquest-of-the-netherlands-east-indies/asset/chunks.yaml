    Additionally, IJN heavy cruisers were fitted with a heavy torpedo battery. At
    the start of the Pacific War, `Myoko-class` units carried 16 torpedo tubes and
    18 reload torpedoes. This was matched by two ships in the `Atago` class, but the
    `Mogami` class carried only 12 torpedo tubes with reloads. Beginning in 1938,
    Japanese heavy cruisers were provided with a top secret new torpedo – the `Type
    93 Model 1 Modification 2`. This was a formidable weapon, vastly superior to any
    Allied torpedo. It carried a 1,082-pound warhead, was wakeless since it was oxygen
    propelled, and had a range up to 43,746 yards at 36 knots. Carrying such powerful
    weapons greatly enhanced the firepower of IJN heavy cruisers, but there was a
    potential downside. Carrying such weapons presented a real danger if the unprotected
    warheads were hit during the combat. This occurred aboard IJN heavy cruisers several
    times during the war and the results were devastating.


    Imperial Japanese Navy light cruisers were less formidable, since their primary
    mission was to act as flagships for destroyer squadrons. The IJN commissioned
    14 5,500-ton light cruisers between 1920 and 1925. These were fitted with seven
    5.5in. single mounts at the start of the war. All carried torpedo mounts, but
    only those actually assigned as destroyer squadron flagships were equipped with
    the `Type 93` torpedo. These ships included all three `Sendai` class, two of which,
    `Naka` and `Jintsu`, were active in the NEI campaign.


    Just as Japanese heavy cruisers were designed to be larger and more powerfully
    armed than their Allied counterparts, the same held true for the IJN’s destroyers.
    Japanese destroyers were maximized for offensive punch against surface ships;
    they were superb torpedo boats but were not well-rounded platforms for antiair
    and antisubmarine combat. In the NEI campaign, these weaknesses did not matter.
    Beginning with the `Special Type` destroyer (also known as the `Fubuki` class),
    IJN destroyers set the pace with a combination of high speed and heavy armament.
    `Fubuki-class` ships carried six 5in. guns and nine torpedoes with three reloads.
    The next class of destroyers, the six-ship `Hatsuhara` class, carried five 5in.
    guns and six torpedo tubes with six reloads. The `Shiratsuyu` class introduced
    the quadruple torpedo mount; this class was fitted with five 5in. guns and eight
    torpedo tubes with another eight reloads. The ten-ship `Asashio` class played
    a prominent role in the NEI campaign. These ships had a top speed of 35 knots
    and were armed with six 5in. guns in three dual mounts. Each ship carried eight
    torpedo types and another eight reloads. The follow-on to the `Asashio` class
    was the `Kagero` class, several of which were active in the NEI campaign. This
    class had similar capabilities to the `Asashio` class. A division of the older
    `Kamikaze` class also saw action during the NEI campaign. These ships, dating
    from 1922, carried four 4.7in. guns and six 21in. (compared to the 24in. tubes
    in the classes already discussed) torpedo tubes with no reloads.


    ### Training


    Imperial Japanese Navy training was extremely intense and was meant to simulate
    actual battle conditions. The seriousness of such rigorous training was displayed
    in 1927 when during a night torpedo exercise a destroyer was sunk in a collision
    with the loss of 104 men, another destroyer was heavily damaged with 29 more casualties,
    and two cruisers were also damaged. The pace of training was relentless, especially
    when the training year culminated in October. Imperial Japanese Navy officers
    described the training as tougher than actual combat. The result was a finely
    honed instrument by the beginning of the war.


    ![../img/CAM344_007.jpg](img/CAM344_007.jpg)


    `Jintsu` was one of the IJN’s most successful light cruisers during the war. She
    was used in her intended role as the leader of a destroyer squadron during the
    NEI campaign and then later at Midway and throughout the Guadalcanal campaign,
    until being sunk by US Navy cruiser gunfire in the battle of Kolombangara in July
    1943 in the central Solomons. (Yamato Museum)


    ### Night combat capabilities and doctrine


    Night combat was an area of special emphasis in IJN pre-war training. Night combat
    was a central tenet of Japanese naval doctrine, since it was the primary method
    by which highly trained IJN ships could turn the tables on the larger US Navy.
    Night combat tactics were re-worked after the `Type 93` torpedo entered service,
    beginning in 1936. To use the long range of this weapon, the heavy cruisers were
    trained to fire them at long range in day or night combat. This “long-distance
    concealed firing” was expected to cripple the enemy before he knew he was in danger.
    When the IJN’s destroyers received the `Type 93`, and not all did before the start
    of the war, their tactics were similar. The Japanese constantly rehearsed torpedo
    tactics, and quick reloading of torpedo tubes was a key skill. A well-drilled
    crew could accomplish this in 15 minutes. This allowed Japanese cruisers and destroyers
    to fire a salvo of torpedoes, disengage to reload, and then fire a second salvo.


    ![../img/CAM344_025.jpg](img/CAM344_025.jpg)


    The IJN placed great importance on its top-secret long-range torpedo at the start
    of the Pacific War. It devised tactics to utilize the capabilities of these weapons
    which gave the Japanese the ability to inflict stand-off blows against Allied
    surface ships. During the NEI campaign, the performance of this wonder weapon
    was disappointing, since only three hit out of the large numbers that were expended.
    (Author’s Collection)


    Night combat was more than just well-rehearsed torpedo tactics. The Japanese practiced
    using large searchlights to illuminate targets. Star shells and flares deployed
    by cruiser floatplanes were also developed. Another key Japanese advantage was
    their superior optical equipment, which was critical in the era before radar.


    ### Allied NAVAL FORCES


    Allied naval forces committed to the defense of the NEI were inadequate for the
    task. Simply put, the IJN operated more powerful ships manned by better-trained
    crews and had the massive advantage of operating with a powerful naval arm. Allied
    naval forces operated throughout the campaign with significant handicaps including
    a confusing command situation, lack of fighter cover, and lack of air reconnaissance.
    During the campaign, Allied naval forces were subjected to increasing strain.
    Logistics support broke down, limiting supplies of fuel and ammunition. Communications
    were a constant problem, since four different navies were present. The Allies
    did not possess a set of mutually intelligible codes for even basic maneuvers,
    which was a constant headache for Doorman when he devised his cruising dispositions
    and maneuvered his force. Doorman issued orders in Dutch, and these were transmitted
    by Allied liaison and communication personnel aboard his flagship to the other
    ships in the force. The force did not share a common set of tactics, forcing Doorman
    to resort to a basic battle plan.


    ![../img/CAM344_047.jpg](img/CAM344_047.jpg)


    `Sealion` photographed in October 1939 running trials. She was the first US Navy
    submarine lost during the war, when she was bombed at Cavite Navy Yard in the
    Philippines on December 10. (US Naval History and Heritage Command)


    #### The Asiatic Fleet

