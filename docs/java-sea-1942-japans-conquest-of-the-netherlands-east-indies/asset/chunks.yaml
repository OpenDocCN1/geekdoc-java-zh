    ![../img/9781472831613_Map001.jpg](img/9781472831613_Map001.jpg)


    The Philippines, Malaya, and the Netherlands East Indies, December 1941


    # ORIGINS OF THE CAMPAIGN


    The Japanese conquest of Southeast Asia during the initial period of the Pacific
    War, which included the naval battle of the Java Sea and a number of associated
    engagements, was the culmination of a train of events begun in the previous decade.
    The 1930s witnessed a wave of Japanese expansion in Asia. Japan’s initial focus
    was on China because it was weak. In September 1931, the Japanese Kwantung Army
    occupied Manchuria. The following year, the Japanese prime minister was assassinated
    by a group of naval officers and army cadets which began a string of events leading
    to the end of civilian-controlled governments. This meant there were no internal
    curbs on Japanese expansionist ambitions.


    In July 1937, fighting flared in northern China which led to a Japanese invasion
    of northern and coastal China. Despite massive Japanese gains in 1938 and the
    commitment of 1.5 million soldiers, the war in China became a stalemate. In 1939,
    war broke out in Europe which brought more opportunity and temptation for Japan’s
    military leaders. Japan took a wait-and-see attitude to the European conflict,
    but by 1940 the Allied powers were on the ropes. With France and the Netherlands
    defeated, and the survival of the United Kingdom in doubt, the Japanese began
    to prepare for a war of expansion in the Far East.


    The focus of this renewed war of expansion was Southeast Asia and its resources.
    The Imperial Japanese Army (IJA) supported a move south as a means to complete
    the isolation of China. The Imperial Japanese Navy (IJN) also supported expansion
    into Southeast Asia, because only the resources located there offered the means
    to withstand American economic pressure. Though unwilling to intervene against
    Japanese aggression in China, the United States did ratchet up economic pressure
    in response to continued Japanese expansion in China.


    The virtually defenseless condition of the Netherlands East Indies (NEI) and the
    perilous condition of the British in Southeast Asia seemed to offer the Japanese
    a way out of their predicament with the United States. The Japanese economy was
    heavily dependent on American oil and scrap iron exports. Efforts to break the
    American economic stranglehold by negotiation were doomed to failure, since the
    Japanese would never voluntarily relinquish their conquests in China. Another
    factor driving Japan to war in the near term was the favorable naval balance compared
    to the US Navy in 1941 and 1942. Since the fruits of the United States’ Two-Ocean
    Naval Expansion Act of June 1940 would place the IJN in a position of perpetual
    inferiority by early 1943, the window of opportunity for a successful war was
    fairly small. Thus, the IJN assumed the role as the leading proponent of war against
    Great Britain and its empire, the Dutch, and the United States. In the mind of
    the Japanese, there was no way the United States would remain neutral if Japan
    attacked into Southeast Asia, so any war of aggression would also have to be waged
    against the United States. The groundwork for war in the Pacific was laid.


    The immediate events leading to war are well known. In July 1941, the Japanese
    forced the Vichy French to declare a joint Franco-Japanese protectorate over Southeast
    Asia. In response, the Americans, British, and Dutch imposed a total trade embargo
    on the Japanese and froze all Japanese assets. Since there was no realistic prospect
    that a Japanese government dominated by the military would accede to American
    demands to withdraw from China or Indochina, the countdown to war accelerated.
    Japan had to act before its supplies of oil dwindled. Accordingly, the IJN demanded
    in August that hostilities against the Western Powers begin in October. The IJA
    agreed only two weeks later. A conference between the IJA and IJN on September
    3 set the timeline for war. The rush to war was temporarily suspended by the Emperor’s
    demand that diplomacy be given time to work, but by December 1 an imperial conference
    confirmed the decision for war.


    ## THE NAVAL BALANCE OF POWER


    Underpinning Japanese hopes for a quick victory was the balance of naval power
    which existed in December 1941. As the table below clearly shows, this balance
    favored Japan.


    ![../img/tab_6.jpg](img/tab_6.jpg)


    British and Dutch naval forces, even with the assistance of the US Navy’s Asiatic
    Fleet, were clearly inadequate to defend their Southeast Asian possessions. The
    inferiority of US Navy forces deployed in the Pacific against the IJN is also
    evident, which made any American attempt to move into the Western Pacific to relief
    the Philippines impossible.


    The bedrock of British strategic planning to defend Malaya and Singapore was the
    assumption that significant naval reinforcements would be moved to the Far East
    shortly after the outbreak of hostilities. As hostilities seemed imminent in late
    1941, the British made good on their promise to send naval reinforcements to defend
    Malaya. However, this reinforcement was nothing more than a bluff in an attempt
    to deter the Japanese from opening hostilities. The move was the brainchild of
    Prime Minister Winston Churchill, who contended that the dispatch of a small but
    powerful striking force would give the Japanese pause. The force which finally
    arrived in Singapore on December 2 was comprised of the modern battleship `Prince
    of Wales`, the old battlecruiser `Repulse`, and a mere four destroyers. The force
    was designated as `Force Z` and placed under the command of acting Admiral Sir
    Tom Phillips.


    ![../img/CAM344_034.jpg](img/CAM344_034.jpg)


    This view was taken from John D. Ford of two other Asiatic Fleet destroyers in
    1938 conducting one of the fleet’s few ocean operations. The Asiatic Fleet’s combatants
    were deployed primarily for presence missions and training for their potential
    wartime missions was not a priority. (US Naval History and Command) The US Navy''s
    Asiatic Fleet, under the command of Admiral Thomas Hart, was caught in an exposed
    position when the war began. Its largest unit, the heavy cruiser `Houston` was
    at Panay, beyond the range of air attack, but five destroyers, all but two of
    the submarines, and most of the fleet’s auxiliaries were in Manila Bay on December
    8. Four of Hart’s destroyers were actually on the way to reinforce the British
    in Singapore when war broke, arriving there on the morning of December 10.


    ## THE INITIAL JAPANESE ATTACKS


    The initial scope of the Japanese offensive in the Pacific was breathtaking and
    far beyond what the Allies thought possible. The most audacious was the Pearl
    Harbor operation, in which the six fleet carriers of the Striking Force (`Kido
    Butai`) attacked the US Navy Pacific Fleet’s primary base in Hawaii. Gaining total
    surprise, two waves of Japanese aircraft exacted a terrible toll on the unprepared
    Americans. In total, 18 US Navy ships were sunk or damaged, including all eight
    of the battleships present. None of the Pacific Fleet’s three carriers were present,
    and thus all survived. In the Western Pacific, `Guam` was invaded and quickly
    fell to the Japanese on December 10. The only Japanese misstep occurred on December
    11, when an attempt to invade `Wake Island` in the Central Pacific was repelled
    by the American garrison. The Japanese returned in greater force on December 23
    and successfully occupied the island.


    ![../img/CAM344_044.jpg](img/CAM344_044.jpg)


    The attack on Pearl Harbor was not the most important Japanese naval operation
    at the start of the war. The most important operation was the seizure of the resources
    of the NEI; the Pearl Harbor attack was important in that it contributed to the
    inability of the US Navy to contest Japanese aggression in Southeast Asia. (US
    Naval History and Command)

