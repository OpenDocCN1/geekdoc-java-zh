    ## ABOUT THE AUTHOR


    Mark E. Stille (Commander, US Navy, retired) spent his naval career as intelligence
    officer serving on the Joint Staff, the faculty of the Naval College, and in the
    ship''s company of two carriers. He is the author of over 40 Osprey titles, focusing
    on naval history of the Pacific and now lives in Annapolis, Maryland.


    ## ILLUSTRATOR


    Jim Laurier attended Paier School of Art in Hamden, Connecticut, from 1974 to
    1978, and since graduating with Honors he has been working professionally in the
    field of Fine Art and Illustration. He has been commissioned to paint for the
    US Air Force and has aviation paintings on permanent display at the Pentagon.
    He is a native of New England and lives in New Hampshire.


