    capable of servicing the Asiatic Fleet. This view shows the result of the raids
    with fires burning and heavy smoke. The submarine bow visible at the far right
    is probably Sealion, which had been hit by bombs and had settled by the stern.
    (US Naval History and Heritage Command)


