    小泽少将被选执行进攻马来亚、苏门答腊和爪哇答西部的重要任务。他的马来亚部队在战役中表现出色，他对海军航空力量的熟练运用了他作为航空力量倡导者的背景。他是一位极具能力的军官，后来担任了日本帝国海军航空母战斗队和联合舰队的司令。（美国海军历史与遗产司令部）


    西侧由小泽治三郎少将指挥。他最广为人知的身份是航空力量倡导者，以及 1942 年 11 月至 1944 年 11 月日本帝国海军航空母战斗队的司令，在此期间他在菲律宾海海战中指挥日本军队。战争开始时，由于作为战术家和战斗领袖备受推崇，他被赋予了指挥这支重要部队的任务。小泽是
    1945 年战争结束前联合舰队的最后一位司令。


    在小泽指挥的主要战斗力单元是第 7 战队，由栗田武雄少将指挥。他负责进攻爪哇答的支持部队，在战役最后阶段，当盟军海军逃离该岛屿时，他的部队正处于位置不当的状态。随后他在瓜尔达康纳岛和后来的菲律宾海表现良好，但他最广为人知的是他拒绝在
    1944 年 10 月将日本帝国海军剩余的大型舰艇投入到一次进攻莱特湾美国滩头头的徒劳行动中。原英健三郎少将是第 5 驱逐舰中队司令。他在战役的最后阶段表现不佳，在
    1942 年 3 月放弃中队指挥权后被降至二线位置。


    日本帝国海军的陆基航空在战役中发挥了重要作用。冢原西雄少将指挥第 11 航空队，他于 1941 年 9 月接任该职位。


    ![../img/CAM344_026.jpg](img/CAM344_026.jpg)


    托马斯·哈特将于 1939 年 7 月 25 日在中国上海的“奥斯塔”号重巡洋舰上宣读了担任亚洲舰队司令的任命令。哈特是一位非常有干的指挥官，但他担任 ABDA
    海军部队司令的生涯很短。考虑到他所掌握的部队，他永远无法完成任务。他因为未能成功保卫菲律宾而被麦阿瑟当作替罪羊，并遭到荷兰人的削弱，因为他们认为自己应该拥有
    ABDA 海军部队的指挥权。（美国海军历史与遗产司令部）


    ## 盟军指挥结构与指挥官


    尽管面临共同的威胁，美国人、英国人、荷兰人和人在战前未能建立有效的联合指挥部，即使在战争开始后仍在为此苦战。1941 年 4 月，美国、荷兰和英国人在新加坡举行了参谋会议（澳大利亚和新西兰代表也参加），但这些会谈未能建立有效的合作关系。直到
    1941 年 12 月至 1942 年 1 月丘尔尔与罗斯福之间进行了一次高级会议，才敲定了关于东南亚联合指挥结构的协议。阿卡迪亚会议的协议内容之一是建立一个负责防御盟军在东南亚领土的联合指挥部。美国提出了一个完全指挥该地区所有海军、陆军和空军的结构，并提名英国将军阿奇伯德·韦弗尔担任首任司令。尽管对涵盖如此大区域的指挥的潜在效力以及美国施加的限制存在某些保留，但英国同意在韦弗尔的控制下建立
    ABDA（美、英、荷、澳）司令部。它涵盖了整个东印度群岛（NEI）、菲律宾、马来亚和缅甸。荷兰人和澳大利亚对其创建未征求意见，而美国人和英国占据了几乎所有的指挥职位。


    韦弗尔的副手是美国陆军空军乔治·布雷特中将，参谋长是英国军官亨利·R·鲍纳尔中将爵。美国海军将托马斯·哈特保留了他的国家指挥权，并任命为 ABDA 海军部队司令（也称为
    ABDAFLOAT）。另一位美国人，美国陆军空军刘易斯·H·布雷顿少将被任命为 ABDA 司令，直到另一位英国将军到达。ABDA 陆军由荷兰中将海因·特·波尔滕指挥。ABDA
    司令部从 1942 年 1 月 15 日正式运作起，直到 2 月 25 日韦弗尔辞职最终解散为止，在很大程度上是无效的。


    盟军海军指挥结构看起来是精简的，因为它有一个单一的作战指挥官。实际上，哈特对主要贡献国的海军行使了有限的作战指挥。英国海军仍侧重于保护前往新加坡的护队，而亚洲舰队则侧重于保护东印度群岛部和保护来自澳大利亚的护队。这使得荷兰海军必须守护作战区域的中心，而这超出了他们的能力。


    荷兰人受这种指挥安排的影响尤为严重，因为他们被排除在高级职位之外，经常发现自己的部队被用于护送进入新加坡的护队。在他们看来，他们的损失最大，并贡献了盟军海军的大部分力量，但对其部队如何部署几乎没有话语权。


    哈特将将是亚洲舰队司令。他在战争爆发前 30 个月就任此职，因此他确切知道自己部队能力的局限性。在太平洋战争开始时，他已有 40 多年的兵龄（1897 年毕业于海军学院），是美国海军资历最高的将领之一。他的性格用他的绰号“硬汉汤米”（Tough
    Tommy）来概括。他被认为是一个严格的纪律者，也被认为是公正的。他证明自己擅长处理其指挥范围内保护远远经济和军事利益的战前职责。


    ![../img/CAM344_027.jpg](img/CAM344_027.jpg)


    威廉·格拉斯福德少将（此处为 20 世纪 30 年代）在太平洋战争前接任第 5 任务队司令。哈特认为他没有足够的进攻性，他的许多士兵也是这么认为，但他监督了亚洲舰队在巴利卡潘海战中对日方的唯一胜利。（美国海军历史与遗产司令部）


    ![../img/CAM344_065.jpg](img/CAM344_065.jpg)


    1945 年拍摄的赫尔费希少将。赫尔费希在困难的情况下保卫爪哇的进取决心使其成为战役中最重要且最具争议的盟军海军指挥人物。（荷兰军事历史）


    当哈特接任 ABDA 海军部队司令时，亚洲舰队作战的日常职责交给了他的参谋长威廉·R·珀内尔少将。威廉·格拉斯福德少将被任命为第 5 任务队（亚洲舰队的水面打击部队）司令。由于他在战争早期表现出的犹豫领导，他被冠以“15
    节格拉斯福”。他与哈特关系不和，哈特认为他没有足够的进攻性。当哈特担任 ABDAFLOAT 时，美国海军希望他将亚洲舰队的指挥权交给格拉斯福。哈特一直避而不这样做，直到
    1 月 25 日格拉斯福得知该命令。


