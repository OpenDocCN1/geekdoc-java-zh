- fmt: '

    Vice Admiral Ozawa was selected for the important assignment of conducting the
    invasions of Malaya, Sumatra, and western Java. His Malaya Unit performed well
    during the campaign, and his adept use of naval air power showed his background
    as an airpower advocate. He was an officer of great ability and later assumed
    command of the IJN’s carrier force and the Combined Fleet. (US Naval History and
    Heritage Command)


    The Western Force was under the command of Vice Admiral Ozawa Jisaburo. He is
    most commonly known as an airpower advocate and as the commander of the IJN’s
    carrier force from November 1942 to November 1944, during which he commanded Japanese
    forces at the battle of the Philippine Sea. At the start of the war, he was given
    command of this important force and mission since he was held in high regard as
    a tactician and as a fighting leader. Ozawa was the last commander of the Combined
    Fleet before the end of the war in 1945.


    The principal combatant force element under Ozawa was Sentai 7, commanded by Rear
    Admiral Kurita Takeo. He commanded the support force for the invasion of Java
    and was caught with his forces out of position during the last days of the campaign
    as the Allied naval forces fled the island. He went on to fight well at Guadalcanal
    and later Philippine Sea, but is best known for his refusal to commit the bulk
    of the IJN’s remaining large ships to a futile operation to attack the American
    beachhead at Leyte in October 1944. Rear Admiral Hara Kenzaburo was Commander
    of Destroyer Squadron 5. He performed poorly in the last segment of the campaign
    and was relegated to second-tier positions after he gave up command of his squadron
    in March 1942.


    The IJN’s land-based air force played an important part in the campaign. Vice
    Admiral Tsukahara Nishio commanded the 11th Air Fleet which he assumed command
    of in September 1941.


    ![../img/CAM344_026.jpg](img/CAM344_026.jpg)


    Admiral Thomas Hart reads his orders to assume duties as commander of the Asiatic
    Fleet on July 25, 1939 aboard heavy cruiser Augusta at Shanghai, China. Hart was
    a very capable commander but enjoyed a short career as commander of ABDA naval
    forces. Given the forces at his disposal, it was never possible for him to accomplish
    his missions. He was scapegoated by MacArthur for unsuccessfully defending the
    Philippines and undermined by the Dutch because they felt that they should have
    the role as commander of ABDA naval forces. (US Naval History and Heritage Command)


    ## ALLIED COMMAND STRUCTURE AND COMMANDERS


    Despite their common threat, the Americans, British, Dutch, and Australians were
    unable to establish a working joint command before the war, and even after the
    war began still struggled to do so. In April 1941, the Americans, Dutch, and British
    held staff talks in Singapore (with Australian and New Zealand representatives
    in attendance), but these talks failed to create a working relationship. It took
    a high-level conference between Churchill and Roosevelt in December 1941–January
    1942 to hammer out an agreement on a joint command structure in Southeast Asia.
    One of the agreements of the Arcadia Conference was the establishment of a joint
    command responsible for defending Allied possessions in Southeast Asia. The Americans
    proposed a structure for complete command of all naval, ground, and air forces
    in the region and put forward British General Archibald Wavell as its first commander.
    Despite some reservations on the potential effectiveness of a command covering
    such a large area and with restrictions imposed by the Americans, the British
    agreed to the establishment of ABDA (American, British, Dutch, and Australian)
    Command under Wavell’s control. It covered all of the NEI, the Philippines, Malaya,
    and Burma. The Dutch and Australians were not consulted about its creation and
    Americans and Britons held almost all the important command positions.


    Wavell’s deputy was Lieutenant-General George Brett, US Army Air Force (USAAF)
    and his chief of staff was British officer Lieutenant-General Sir Henry R. Pownall.
    American Admiral Thomas Hart retained his national command and was appointed as
    commander of ABDA naval forces (also called ABDAFLOAT). Another American, Major-General
    Lewis H. Brereton, USAAF, was given the job as the commander of ABDA air forces
    until the arrival of another British general. ABDA ground forces were commanded
    by Dutch Lieutenant-General Hein ter Poorten. ABDA Command was largely ineffective
    from its first official day on January 15, 1942 until its final disbandment on
    February 25, when Wavell resigned.


    The Allied naval command structure had the appearance of being streamlined, since
    it featured a single operational commander. In reality, Hart exercised limited
    operational command over the naval forces of the principal contributors. British
    naval forces remained focused on protecting convoys to Singapore while the Asiatic
    Fleet remained focused on protecting the eastern NEI and protecting convoys from
    Australia. This left the Dutch Navy to guard the center of the operating area
    which was beyond its means.


    The Dutch were especially affected by the command arrangement since they were
    excluded from senior command positions and often found their forces being used
    to escort convoys into Singapore. In their view, they had the most to lose and
    were contributing a major portion of Allied naval forces, but had little say on
    how their forces were employed.


    Admiral Hart was the commander of the Asiatic Fleet. He assumed this post 30 months
    before the war, so he knew exactly how limited his force’s capabilities were.
    At the start of the Pacific War, he had over 40 years of service (being a graduate
    of the Naval Academy in 1897) and was one of the most senior admirals in the US
    Navy. His personality was summed up by his nickname “Tough Tommy.” While seen
    as a strict disciplinarian, he was also viewed as fair. He proved adept at dealing
    with his command’s pre-war responsibilities of protecting US economic and military
    interests in the Far East.


    ![../img/CAM344_027.jpg](img/CAM344_027.jpg)


    Rear Admiral William Glassford, shown here in the 1930s, assumed command of Task
    5 before the Pacific War. Hart did not believe he was aggressive enough, as did
    many of his men, but he did oversee the Asiatic Fleet’s only victory over the
    Japanese at the battle of Balikapan. (US Naval History and Heritage Command)


    ![../img/CAM344_065.jpg](img/CAM344_065.jpg)


    Vice Admiral Helfrich photographed in 1945. Helfrich’s aggressive determination
    to defend Java against tremendous odds made him the most important and controversial
    Allied naval command figure of the campaign. (Netherlands Institute for Military
    History)


    When Hart took over command of ABDA naval forces, day-to-day responsibilities
    for the operations of the Asiatic Fleet were transferred to his chief of staff
    Rear Admiral W. R. Purnell. Rear Admiral William Glassford, Jr. was given command
    of Task 5, the Asiatic Fleet’s surface striking force. He was given the nickname
    “15-knot Glassford” in recognition of his hesitant leadership early in the war.
    He did not get along with Hart who did not think he was aggressive enough. When
    Hart assumed his role as ABDAFLOAT, the US Navy wanted him to hand over command
    of the Asiatic Fleet to Glassford. Hart avoided doing so until January 25, when
    Glassford found out about the order. When he had the opportunity to appoint a
    commander for the new ABDA Striking Force commander, Hart selected somebody else
    besides Glassford.

