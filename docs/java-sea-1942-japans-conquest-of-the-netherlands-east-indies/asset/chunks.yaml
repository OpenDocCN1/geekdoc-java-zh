  raw: 'The continued advance of the Japanese Eastern Force and Hart’s prodding to
    Glassford to engage the Japanese made a naval clash inevitable. On January 22,
    an American flying boat sighted a large Japanese convoy under heavy escort heading
    toward Balikpapan. Again, Hart ordered Task Force 5 to engage. By now, Houston
    and two destroyers had resumed escort duties, the damaged Boise was headed out
    of the area, and Marblehead was dealing with a turbine problem which limited her
    to 15 knots. Instead of Task Force 5’s original and powerful composition of three
    cruisers and eight destroyers, the nearest American units were the four destroyers
    of Division 5 under Commander Paul H. Talbot. These moved north, beginning on
    the morning of January 23\. The weather and seas during the day were bad, which
    allowed the Americans to make their approach undetected. Talbot intended to mount
    a surprise attack on the anchored Japanese invasion force two hours before dawn.
    He ordered his destroyers to use their torpedoes first; when these were expended,
    then gunfire. Marblehead and one destroyer were ordered north to cover the withdrawal
    of the  destroyers.


