    在东南亚，日本人很快反驳了盟军关于他们一次只能进行单次入侵的评估。在`12 月 8 日`于菲律宾地面重创了美国空军后，日本人于`12 月 10 日`出动 51
    架轰炸机，将目标转向位于马尼拉湾`Cavite`的亚洲舰队主基地。这些轰炸机随后对该海军基地造成了毁灭性破坏。炸弹摧毁了造船厂的大部分设施，包括修理厂、机库，以及维持舰队战斗状态所需的零件和其他储物间。正在进行大修的潜艇`Sealion`
    号被摧毁，`Seadragon` 号受损。更重要的是，舰队大部分备用潜艇鱼雷丢失了。同样在进行大修的驱逐舰`Pillsbury` 号和`Peary` 号也受了损坏。尽管这两艘驱逐舰和所有主要辅助舰都能在接下来的几天内离开马尼拉向南出发，但这次袭击地表明，`Hart`
    至少从马尼拉派遣潜艇的计划是不可能的。舰队向南移动，目标并非暴露无遗的新加坡，而是澳大利亚西北部。


    在获得空中优势后，日本人在菲律宾进行了一系列登陆。这些行动于`12 月 8 日`开始，在吕民岛以北约 125 里的`Batan`岛进行小规模登陆。随后在`10
    日`，在吕民岛和 Batan 岛之间的`Camiguin`岛以及吕民北部的`Aparri`进行了登陆。`12 月 12 日`，在吕民南部的`Legaspi`的登陆进展顺利。主登陆于`12
    月 22 日`在林烟湾进行。这些行动完全牵制了防守者，迫使美国人退守`巴丹半岛`。在这里，美国人和菲律宾人坚守到了`4 月`，最后的防守者直到`5 月 6
    日`菲律民岛陷落后才投降。尽管他们的行动最终是徒的，但菲律宾的美国防御者坚守的时间比新加坡的英国人或东印度群岛的荷兰人长得多。


    在对菲律宾发动初期进攻的同时，日本人还入侵了马来亚北部和泰国南部。`12 月 8 日`，日本军队在泰国南部的`Singora`和`Patani`以及马来亚北部的`Kota
    Bharu`登陆。一旦在岸建立，日本第 25 军在`12 月 11 日`的`Jitra`战役中击败了英国人，决定了马来亚北部的命运。到 1 月初，随着日本人在`Slim
    River`战役中击溃了两个印度旅团，马来亚中部失守。到`1 月 25 日`，英国人已决定撤回新加坡岛。日本人于`2 月 8 日`跨越`柔佛海峡`进攻，并在一周后迫使守军投降。


    ### Z 舰队的覆灭


    `12 月 10 日`，盟军在东南亚的海军形势急剧恶化。针对日本最初对马来亚北部和泰国南部的入侵，进取的`Phillips` 决定投入他的小型突击部队来击败日本人的入侵。`Phillips`于`12
    月 8 日`黄昏后带着全体部队从新加坡出击。他计算，通过利用季风天气提供掩护，他有很大机会袭击位于`Singora`的日本登陆部队。目标随后改为`Kota
    Bharu`，`Phillips`希望在`12 月 10 日`早晨在那里与日本入侵部队交战。遗憾英国人的是，任何奇袭的机会很快消失了。一艘日本潜艇于`9 月
    9 日 13:45` 发现了这支部队，日本飞机又在`17:40` 发现了这支部队。


    ![../img/CAM344_046.jpg](img/CAM344_046.jpg)


    `12 月 10 日`日本对`Cavite 海军兵厂`的空袭使其失去了为亚洲舰队提供维修的能力。这张照片展示了袭击后的结果，火光冲天，浓烟滚滚。最右侧可见的潜艇头部可能是`Sealion`
    号，它被炸弹命中并由尾部沉没。（美国海军历史与遗产司令部）


    ![../img/CAM344_045.jpg](img/CAM344_045.jpg)


    这张日本照片显示了`12 月 10 日`遭受攻击的`Z 舰队`。`威尔士王子号`正于照片底部高速移动，而图像顶部的`斥力号`正被炸弹爆炸所包围。这两艘主力舰的覆灭改变了东南亚的海军平衡。（美国海军历史与遗产司令部）


    约两小时后，`Z 舰队`距离日本海军部队约 22 英里，后者正在搜寻它，希望与英国人进行夜战。几乎在同一时间，`Phillips`决定放弃行动并返回新加坡。然而，在`23:55`，一份报告送到了海军将手中，日本人已登陆`关丹`，当时那里距离`Z
    舰队`的位置约 120 英里。`Phillips`转向西南方向调查该报告。`08:00` 达时，`Phillips`从`威尔士王子号`派遣了一架飞机和一艘驱逐舰进行调查。他们一无所获，因为报告完全是虚假的。`Phillips`没有继续向相对安全的新加坡移动，而是决定调查另一个关于关丹附近某些驳的虚假报告。事实证明这是一个致命的延误。


    英国人完全不知道陆基日本海军飞机对`Z 舰队`构成的威胁。他们认为，如果他们距离最近的日本机场保持 400 英里，他们就在有效攻击范围之外。即使日本人成功击中了`Z
    舰队`，那也只是英国人在地中海习惯的俯冲轰炸机，而不是致命得多的鱼雷飞机。从这两个方面来看，英国的情报极其错误。从西贡机场起飞的 G3M“蜜蜂”和 G4M“贝蒂”飞机范围可以到达新加坡。这两种飞机都能携带“91
    式”鱼雷，而且经过训练的机员还能在 10000 英尺高度攻击舰只。日本海军在印度支集结了大量的攻击机，任务是中和`Z 舰队`。`12 月 10 日`，总计
    85 架 G3M 和 G4M 飞机在`06:25`到`08:00`之间出发，以寻找并攻击`Z 舰队`。


