    # The Battle of the Java Sea


    The battle of the Java Sea was one of the largest surface battles of the Pacific
    War. A total of 32 ships took part, and of these five were sunk, all Allied, and
    another eight damaged (two Allied and six Japanese). In addition to Java Sea,
    there were four other major surface actions fought during the campaign. In only
    one of these, Balikpapan, could the Allies be considered victorious. The overall
    losses for each side tell the story. Of the Dutch Navy’s three cruisers and seven
    destroyers available at the start of the campaign, only light cruiser `Tromp`
    remained afloat. The Asiatic Fleet’s losses were considerable, but not as drastic.
    Three cruisers began the war, and two (`Boise` and `Marblehead`) survived, though
    both were damaged. Seven of the fleet’s 13 destroyers also survived. Both navies
    had fought with determination, but for little effect. Though the Royal Navy never
    supported the defense of the NEI with the same dedication as the Dutch and Americans,
    it also suffered heavily. British losses totaled one heavy cruiser and four destroyers.
    The Australians lost a light cruiser.


    The IJN had accomplished the utterly essential mission of seizing the NEI and
    its critical resource facilities quickly. In so doing, no Japanese landing was
    halted or even delayed. There were occasions when sloppy tactical dispositions
    provided the Allies with the chance of inflicting local reverses, but the Allies
    were too unlucky or weak to take advantage of them. Japanese naval losses were
    light during the campaign. Allied surface naval units did not sink a single large
    IJN combatant during the campaign, and only at Balikpapan did Allied surface ships
    sink anything. The Dutch accounted for the majority of the Japanese transports
    and combatants lost during the campaign, but these losses were far below what
    the Japanese planned for. The largest combatant lost by the Japanese in the NEI
    was a destroyer. Three were lost – one to an American submarine, one to a Dutch
    submarine, and the third to Dutch aircraft. Other losses included one submarine,
    four minesweepers, and a patrol boat. In addition, at least 14 transports were
    sunk.


    ![../img/CAM344_040.jpg](img/CAM344_040.jpg)


    ## Submarine Operations and Losses


    At the start of the campaign, the `RNN` had 12 operational subs in the NEI and
    three more in overhaul or reserve. This is `K-XIII` photographed in 1924, which
    dated from the 1918 Naval Program and only carried six torpedoes. Like the more
    numerous US Navy submarines, Dutch subs were also ineffective attacking Japanese
    amphibious forces in the NEI. Four Dutch subs were lost during the campaign. In
    the final days of the campaign `K-X`, `K-XIII`, and `K-XVIII` were trapped in
    Soerabaja and scuttled. (US Naval History and Heritage Command)


    ![../img/CAM344_054.jpg](img/CAM344_054.jpg)


    This trumpet was recovered from the `USS Houston`. The ship is a war grave, but
    in recent years there has been a very disturbing trend of Indonesian scrappers
    salvaging war wrecks in the former NEI. While `Houston` remains apparently in
    good shape, some of the other ships like `Perth` and the American and British
    destroyers are almost entirely gone. (US Naval History and Heritage Command)


    ## Operational Errors


    At the operational level, both sides made serious errors. At the Badoeng Strait,
    `Helfrich` was caught off guard and his plan was too complicated. In the run-up
    to the Japanese invasion of Java, `Helfrich` was foolish to think that he could
    repel both the eastern and western Japanese thrusts against Java, and his creation
    of two striking forces further dissipated his already inadequate assets. His only
    hope for success was to create a single powerful striking force and make all efforts
    to provide it with adequate air reconnaissance and air cover. He failed to ensure
    that the remaining Allied air assets on Java were focused on support of the Combined
    Striking Force. Had adequate aerial reconnaissance supported a strengthened striking
    force, it might have been possible to deliver the Japanese a serious blow, maybe
    even strong enough to delay or defeat one of the landing forces. None of this
    is to say that the Allies ever had a real chance to defend Java from seaborne
    invasion. The balance of forces, both quantitatively and qualitatively, was too
    uneven. In the final analysis, the record of Allied naval forces in the campaign,
    culminating in the battle of the Java Sea, was a parade of defeats. The only exception
    was at the opening battle at Balikpapan, when bold action created surprise and
    delivered the Allies a local success. Even so, it should be pointed out that even
    this success resulted in no delay in the Japanese timetable for conquering the
    NEI.


    The Japanese deployed their naval forces poorly during the campaign, thus creating
    possible openings for the Allies. In spite of the fact that the Eastern Force
    was operating nearest to the principal Allied naval base at Soerabaja, it was
    significantly weaker than the Western Force. The Japanese compounded this error
    in the later stages of the campaign by dissipating their overwhelming resources.
    `Yamamoto` took reports from the battle of the Badoeng Strait literally and assumed
    that `ABDA` no longer possessed a viable striking force. Accordingly, instead
    of supporting the final invasion of Java with the overwhelming force of the `Kido
    Butai` and the battleships and heavy cruisers of `Kondo’s` support force to deal
    with any potential Allied naval intervention, he deployed these forces into the
    Indian Ocean to pick off ships fleeing Java. This left the weakest of the four
    main Japanese forces in the region to contend with the main Allied naval force,
    `Doorman’s Combined Striking Force`. This propensity of `Yamamoto’s` to disperse
    his forces was of no major significance when the odds were so heavily stacked
    in the IJN’s favor, but they would become a major factor in major defeats only
    months later.


    Throughout the campaign, Allied tactical performance was weak in all areas. They
    were never able to address the difficulties of maneuvering a multi-national force
    and communications remained a critical weakness. Not a single major Japanese unit
    was sunk in surface combat during the campaign. Allied gunnery was atrocious,
    resulting in few hits. Torpedo reliability and performance was a crippling disadvantage,
    and this was to continue throughout 1942.


    Tactically, the naval battles for the NEI demonstrated the prowess of the Japanese.
    The Japanese ships were superior on a unit basis, and this proved critical on
    several occasions. The actions of only two Japanese destroyers provided a tactical
    victory against a much larger Allied force at Badoeng Strait. At Java Sea, the
    two sides were at approximate parity, but the two Japanese heavy cruisers engaged
    provided enough backbone to defeat one of the largest Allied forces. Though the
    Japanese emerged victorious at Java Sea, there were some causes for concern. Foremost
    of these was the performance of the IJN’s supposed war-winning secret weapon,
    the `Type 93 torpedo`. Of the 153 torpedoes fired, only three hit with dozens
    detonating prematurely. This was a rough start for the `Type 93`, but the foundation
    of a long-range torpedo operated by well-drilled crews paid rich dividends later
    in the war. Even so, the three weapons that hit did account for three Allied ships,
    including two cruisers, and were responsible for bringing the battle to an end.


    ![../img/CAM344_056.jpg](img/CAM344_056.jpg)


    This is another view of the demise of `Exeter`. Destroyer `Inazuma` picked up
    most of the survivors, which included 44 officers and 607 men. (US Naval History
    and Heritage Command)

