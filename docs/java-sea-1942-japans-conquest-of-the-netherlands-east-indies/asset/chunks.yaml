    \n# 敌方计划\n\n### 日方计划\n日本战争初期战争计划中最重要的方面是夺取东南亚的资源。日本必须快速夺取并恢复婆罗洲、爪哇和苏门答腊油田的运作。其中，苏门答腊的井最为重要。东南亚主要的盟军军事、航空和海军力量是驻守马来的英国驻守军。这些力量必须在向荷属印度群岛（NEI）推进的同时被中和。此外，日本面临着中和菲律宾美国军的战略紧迫任务，因为他们坚信如果日本攻击东南亚的英属和荷兰领地，美国将会干预。日本方面面临的额外困难在于，对英国、美国和荷兰军队的战役要求在荷兰有机会破坏经济设施之前，以及在英国和美国增援其领地之前，尽可能地行动。\n\
    \n日本可用的力量对于他们正开始的这项大规模行动来说仅勉强足够。缺乏运输入侵军的船只意味着行动必须分阶段进行。在五个月内，日本设想完成三个阶段的战役以控制东南亚。第一阶段的目标是占领盟军防御的前哨。这些包括香港、马来、英属婆罗洲、砂拉越和菲律宾。第二阶段要求占领整个马来半岛（包括新加坡）以及荷属印度群岛的岛。最后，第三阶段将占领苏门答腊和爪哇。\n\
    \n日本计划的关键是保持不懈的速度。日本的计划几乎是鲁莽的，但作为一个计划假设，他们认为盟军无法提供足够的防御。尽管盟军表现英勇，但日本的最初判断是正确的，他们能够按时且以极小的损失执行这一大胆计划。另一个关键是早期夺取空权，并要求必须在友军航空的保护下进行推进。日本计划夺取一个机场并在飞机的保护下南下。由于日本海军所有的舰载机母最初支持珍珠港作战，支持荷属印度群岛入侵的任务负担交给了陆基第\
    \ 11 航空队及其飞行队。日本充分利用轻航母`龙凤`和若干山载机母提供局部航空覆盖，但整个计划取决于陆基航空在下一个目标上获得空权。\n\n主要海军力量的机动方案非常简单。近藤信将以两艘战舰为核心的主力舰为入侵军提供远程支援。由高桥直将率领的东舰队最初驻扎在巴留。在支持占领菲律宾棉兰岛后，将支持占领婆罗洲东部的爪禄、打端、巴里板板和三巴井；然后是望加、望加锡和井加里；接着是马古群岛的阿汶；然后是巽他岛的帝汶。最终目标是占领爪哇，届时东舰队和西舰队将汇合。\n\
    \n"
