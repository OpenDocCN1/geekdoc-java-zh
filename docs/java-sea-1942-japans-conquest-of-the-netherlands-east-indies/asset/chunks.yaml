    战斗于 2314 爆发，`Fubuki` 向盟军巡洋舰发射了整发的九枚`Type 90` 鱼弹（并非所有日本驱逐舰都配备了`Type 93`）。由于目标角度不佳，一发未命中。该艘驱逐舰还发射了
    16 发`5in.` 炮弹，也无于事。一分钟后，`Perth` 在西南方向发现驱逐舰 `Harukaze` 并开火。随着两艘巡洋舰机动，显然`Hara` 利用
    `Natori` 作为诱饵的计划并未奏效，于是他命令他的驱逐舰发动进攻。率先出手的是约 2340 左右的 `Hatsuyuki` 和 `Shirayuki`。`Perth`
    击中了冲锋中的 `Shirayuki` 的舰桥，但日本驱逐舰在接近 4,000 码处，每艘船各发射了九枚鱼弹。接下来是第 5 驱逐舰分队的老旧驱逐舰。`Harukaze`
    被数发炮弹命中并被迫离队。`Asakaze` 于 2343 分发射了六枚鱼弹，但最后一艘驱逐舰 `Hatakaze` 未能找到目标。2344 分，`Natori`
    发射了四枚鱼弹和 29 发`5.5in.` 炮弹后向北撤离。一旦日本驱逐舰离开该，`Mikuma` 和 `Mogami` 分别于 2346 分发射了六枚鱼弹。2352
    分，两艘日本重巡洋舰开启搜索灯，开始用它们的`8in.` 主炮攻击目标。`Houston` 利用搜索灯作为瞄准点，于 2355 分命中 `Mikuma`。这一波日本鱼弹没有命中目标，在经历了
    45 分钟的激烈火战后，两艘盟军巡洋舰的损伤较小。然而，它们越来越无法还击——`Perth` 沦为发射练习`6in.` 炮弹，而 `Houston` 的船员被迫手动从后部弹舱将
    260 磅的`8in.` 炮弹移到两个前部炮塔。


    随着两艘盟军巡洋舰射速的下降，日本军再次接近进行另一轮鱼弹攻击。2356 分，`Harukaze` 从距离仅 4,200 码的东侧发射了五枚鱼弹，`Hatakaze`
    发射了六枚。一分钟后，`Mogami` 在北方 10,000 码处发射了六枚`Type 93`，同时用其`8in.` 电池开火。`Shirakumo` 和
    `Murakumo` 从西部到达，各自在 5,000 码范围内发射了九枚`Type 90` 鱼弹。`Natori` 重新装填了鱼弹，并在约 9,000 码射向
    `Houston`。这是一次致命的齐射，但并非完全按照日本人的意图。`Mogami` 的鱼弹错过了目标，向西南进入了 `Bantam Bay`。对锚泊中的入侵船队造成的后果是毁灭性的。四枚鱼弹击中运输船并全部沉没（但最终被打捞并恢复服役）。在运输船
    `Ryujo Maru` 上，第 16 陆军司令 `Imamura Hitoshi`（今村寿）被抛入海中，被迫游泳逃生。第五枚鱼弹击中了 600 吨的扫雷艇
    `W2`，后者断成两段迅速沉没。


    ![../img/CAM344_066.jpg](img/CAM344_066.jpg)


    这幅精美的侧面图是 1928 年建成不久的驱逐舰 `Evertsen`。注意四门单管`4.7in.` 炮和两排三联鱼雷管。`Evertsen` 在 12 月第一周带着经验丰富的船员重新投入使用。荷兰人并未认为其完全作战，该舰在战役的大部分时间内被分配护队护卫任务。在最后的战斗中，这艘驱逐舰试图逃离
    `Soerabaja`。被两艘日本驱逐舰拦截后，舰长认为船员无法进行有效的战斗，因此选择操舰搁浅，以避免无谓的生命损失。（荷兰军事史研究所）


    ![../img/9781472831613_Map010.jpg](img/9781472831613_Map010.jpg)


    ### 2 月 28 日巴厘海峡战斗


    ![../img/CAM344_017.jpg](img/CAM344_017.jpg)


    `Wakaba` 是 `Hatsuhara` 类六艘船之一。其中四艘被分配给第 21 驱逐舰分队，负责支持荷属东印度东北部的多次入侵。它们唯一与盟军作战的机会是在
    2 月 28 日至 3 月 1 日深夜，当时发现了美国海军第 58 驱逐舰分队的四艘船通过巴厘海峡。尽管在速度和火力上拥有优势，日本军舰并未激进进攻，四艘美国驱逐舰全部逃脱。（美国海军历史与遗产司令）


    随后发生了更多爆炸，而这些爆炸是以盟军为代价的。3 月 1 日 0005 左右，一枚可能来自 `Harukaze` 的鱼弹击中了 `Perth` 的前机舱。两分钟后，另一枚击中舰桥下。当
    `Murakumo` 和 `Shirakumo` 的齐射到达时，又有两枚命中。无法承受这些打击，这艘巡洋舰向左倾斜并于 0012 分沉没。在其 686 名船员中，351
    人随舰沉没，其中包括舰长。在幸存者中，又有 106 人在日本俘虏中死亡。


    鱼弹均未命中 `Houston`，但她现在孤立无援。看到西方道路被堵，`Houston` 舰长向南航行。0010 分，她的运气耗尽了。`Mikuma` 和
    `Mogami` 的炮弹开始命中，在几分钟内，该舰就变得支离破碎。船员记录了三枚鱼弹命中，但准确数字将永远无法得知，因为在最后时刻无法区分炮弹命中还是鱼弹命中。舰长于
    0025 分下令弃舰，随后被碎片杀死。0029 分，最后一次命中，五分钟后这艘巡洋舰消失了。在其 1061 名船员中，仅 368 人幸存。在这些幸存者中，102
    人在俘虏中死亡。


    两艘巡洋舰被毁的后记是 `Evertsen` 的命运。舰长从远处看到巽他海峡的战斗，试图沿苏门答腊海岸线北行。0130 分，这艘荷兰驱逐舰被 `Murakumo`
    和 `Shirakumo` 发现。在场不对等的炮击战中，日本驱逐舰点燃了这艘荷兰船。其舰长操舰搁浅以拯救船员。


