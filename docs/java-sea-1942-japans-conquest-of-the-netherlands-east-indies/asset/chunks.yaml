    Action in the Bali Strait, February 28


    ![../img/CAM344_017.jpg](img/CAM344_017.jpg)


    Wakaba was one of six ships in the Hatsuhara class. Four of these were assigned
    to Destroyer Division 21 and were active in supporting several invasions in the
    eastern NEI. Their only opportunity to engage Allied ships came on the night of
    February 28–March 1, when they detected the four ships of the US Navy’s Destroyer
    Division 58 transiting the Bali Strait. Despite having an advantage in speed and
    firepower, the Japanese ships did not pursue aggressively, and all four American
    destroyers escaped. (US Naval History and Heritage Command)


    More explosions followed, and these were at the expense of the Allies. At about
    0005hrs on March 1, a torpedo possibly from Harukaze hit Perth in her forward
    engine room. Two minutes later, another hit under the bridge. When the barrage
    from Murakumo and Shirakumo arrived, two more hit. Unable to withstand these blows,
    the cruiser rolled over to port and sank at 0012hrs. Of her crew of 686, 351 went
    down with the ship, including her commanding officer. Among the survivors, another
    106 died in Japanese  captivity.


    None of the torpedoes hit Houston, but she was now alone. Seeing the way to the
    west blocked, Houston’s captain steered south. At 0010hrs, her luck finally ran
    out. Shells from Mikuma and Mogami began to score, and within minutes the ship
    was reduced to shambles. The crew recorded three torpedo hits, but the correct
    number will never be known since in the final chaotic moments it was impossible
    to distinguish shell from torpedo hits. Her commanding officer ordered abandon
    ship at 0025hrs, and then was killed by shrapnel. At 0029hrs, Shikinami closed
    to short range for a final torpedo hit, and five minutes later the cruiser disappeared.
    Of her crew of 1,061, only 368 survived the sinking. Of these, 102 died in Japanese  captivity.


    A postscript to the destruction of the two Allied cruisers was the fate of Evertsen.
    Seeing the battle in the Sunda Strait from a distance, her commanding officer
    attempted to head north along the coast of Sumatra. At 0130hrs, the Dutch destroyer
    was detected by Murakumo and Shirakumo. In an uneven gun fight, the Japanese destroyers
    set the Dutch ship afire. Her commanding officer ran the ship aground to save
    the  crew.


    Not all was disaster for the Allies. Commander Binford, whose four destroyers
    were in Soerabaja, was not convinced that the best escape route was through the
    Sunda Strait. He convinced Glassford to allow him to make a night run through
    the narrow Bali Strait. Given permission to do so, he departed at 1700hrs on February
    28 and entered the Bali Strait at 0200hrs the next morning. Four Hatsuhara-class
    destroyers were assigned to guard the strait. Hugging the shore along the Java
    side of the strait, Binford’s destroyers were detected and brought under fire
    from the patrolling Japanese destroyers. On this occasion, the Japanese did not
    display a killer instinct. The American destroyers replied with their 4in. guns,
    but neither side hit the other. Binford increased speed to 25 knots, made smoke,
    and broke out into the Indian Ocean without damage. The next day, no Japanese
    aircraft appeared, and the four ships arrived in Fremantle on March  4.


    Binford’s intuition to run the Bali Strait at night had proven correct. After
    his departure from Soerabaja on the 28th, several Allied ships still remained
    in port – Exeter, Encounter, and the American destroyer Pope. Palliser did not
    want to run these through the Bali Strait because of Exeter’s draft, and he did
    not want to use the deep Lombok Strait because an undetected transit seemed unlikely
    since the Japanese held both sides of the strait, and because the prospects of
    air attack were great from the airfield on Bali and from Kendari. Incredibly,
    he ordered the ships to use the Sunda Strait in the hope of catching the Japanese
    off guard. This order was a death sentence since the prospects of transiting the
    length of the Java Sea amidst numerous Japanese ships and constant air patrols
    to even get to the Sunda Strait was  remote.


