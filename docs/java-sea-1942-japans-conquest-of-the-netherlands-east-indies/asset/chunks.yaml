- fmt: "\nIt should be noted that although the attack into Southeast Asia was allocated\
    \ the majority of the `Combined Fleet`’s combatants, there were other operations\
    \ which required significant portions of the `Combined Fleet`. Foremost among\
    \ these was the `Kido Butai` which was allocated to the Pearl Harbor operation,\
    \ and then briefly supported operations in the South Pacific before becoming available\
    \ to support the `NEI` campaign. The `IJN` battleships were retained in home waters\
    \ as a strategic reserve, but one section of `Sentai 3` with two `Kongo`-class\
    \ battleships was allocated to the `Southern Expeditionary Force`. The rest of\
    \ the `Combined Fleet` was occupying operations in the South and Central Pacific\
    \ (mainly the `Fourth Fleet` – watching the `Fifth Fleet`). Most of the `Combined\
    \ Fleet’s` submarines were allocated to support operations against `US Navy` as\
    \ part of the Hawaiian Operation, but older units were allocated to support Southeast\
    \ Asia.\n\n![../img/CAM344_24.jpg](img/CAM344_24.jpg)\n\nOne of the `IJN’s` forgotten\
    \ early-war aircraft was the `G3M` long-range bomber, later given the Allied reporting\
    \ name of `Nell`. Flying in the absence of Allied fighters, this bomber was very\
    \ effective, as was shown by its exploits against `Force Z`, `Cavite`, and naval\
    \ bases, and `ABDA’s Striking Force`. (US Naval History and Command) In all, the\
    \ `Southern Force` was allocated two battleships, heavy cruisers, four light cruisers,\
    \ and some destroyers. On the surface, this was a formidable force, but the pace\
    \ of operations and the breadth of the operating area meant that it was never\
    \ concentrated. Imperial Japanese Navy surface units were inadequate to strongly\
    \ protect all invasion and reinforcement convoys. \n\nVice Admiral `Kondo` retained\
    \ direct command of a powerful force which included two battleships (`Kongo` and\
    \ `Haruna`), three heavy cruisers (`Atago`, `Takao`, and `Maya`), and eight destroyers.\
    \ This force acted in a distant support role. The direct cover for the many landings\
    \ was provided by the two forward groups of the `Southern Expeditionary Force`.\
    \ These were the two pincers which led the advance into the `NEI`. The exact designations\
    \ of these pincers changed over the course of the campaign, but were most often\
    \ referred to as the `Eastern` and `Western Forces`.\n\n![../img/CAM344_23.jpg](img/CAM344_23.jpg)\n\
    \nA small number of `B5N1` attack aircraft, like the one shown here in this pre-war\
    \ photograph, flying from carrier `Ryujo`, played a significant part in the `NEI`\
    \ campaign. These aircraft could employ both torpedoes and bombs, but only used\
    \ bombs during the campaign. They helped repel the Allied Striking Force on February\
    \ 4. (US Naval History and Command)\n\nThe `Eastern Force` was under the command\
    \ of Vice Admiral `Takahashi`. It was allocated the light carrier `Ryujo`, the\
    \ four `Myoko`-class heavy cruisers, `Destroyer Squadron 2` with light cruiser\
    \ `Jintsu` and eight destroyers, and `Destroyer Squadron 4` with light cruiser\
    \ `Naka` and eleven destroyers.\n\nThe `Western Force`, under the command of Vice\
    \ Admiral `Ozawa`, was assigned heavy cruiser `Chokai` as his flagship and the\
    \ four `Mogami`-class heavy cruisers, and `Destroyer Squadron 5` with flagship\
    \ `Sendai` and seven destroyers.\n\nImperial Japanese Navy land-based air forces\
    \ were expected to play a large part in the campaign. The `22nd Air Flotilla`,\
    \ based in French Indochina, was allocated to cover the Malaya operation, and\
    \ the `21st` and `23rd Flotillas` were initially allocated to support the attack\
    \ on the Philippines. All of these were eventually available to support operations\
    \ against the `NEI`. These were very powerful offensive forces, as was demonstrated\
    \ on December 10 when land-based `IJN` aircraft sank `Prince of Wales` and `Repulse`\
    \ off Malaya. The aircrews were very highly trained for maritime strike operations\
    \ and the aircraft they flew were very capable. The mainstay aircraft were the\
    \ `G3M` (later given the Allied reporting name of `Nell`) and the `G4M` (later\
    \ given the reporting name of `Betty`). Both types of aircraft possessed long\
    \ ranges, and could carry 1,870-pound `Type 91` aerial torpedo or 2,200 pounds\
    \ of bombs. Against naval targets, they were capable of conducting level bombing,\
    \ usually from around 10,000ft to avoid most antiaircraft fire, or torpedo bombing.\
    \ High-level attacks against naval bases were also a priority mission. Both the\
    \ `G3M` and `G4M` were vulnerable to interception by Allied fighter aircraft,\
    \ but this was not a concern during the campaign.\n\n### Ships\n\nImperial Japanese\
    \ Navy heavy cruisers were the spearhead of the Japanese naval advance into the\
    \ `NEI`. Japanese heavy cruisers were designed to play several important roles,\
    \ principally as the centerpieces of night-fighting battle groups. The design\
    \ of `IJN` heavy cruisers emphasized firepower, since in order to perform their\
    \ wartime roles they had to be more heavily armed than comparable `US Navy` ships\
    \ and possess the capability to strike at greater ranges than American cruisers.\
    \ They were capable of conducting long-range gunnery attacks with their `8in.`\
    \ gun batteries.\n\nThe `Myoko` class, the first of which was commissioned in\
    \ 1928, was fitted with a main battery of ten `8in.` guns by the time the war\
    \ began. The next class to commission was the four-ship `Atago` class, also fitted\
    \ with ten `8in.` guns. The four-ship `Mogami` class was originally commissioned\
    \ as light cruisers with 15 `6in.` guns, but before the start of the war was upgraded\
    \ to a main battery of ten `8in.` guns. The maximum range of the `8in.` guns fitted\
    \ to these three classes ranged between 31,606 and 32,153 yards. The Japanese\
    \ believed that the fire-control equipment fitted to their cruisers gave their\
    \ `8in.` guns an effective engagement range of 21,873 yards, but they often engaged\
    \ targets at even longer ranges. However, at extended ranges the twin-gun `8in.`\
    \ turret suffered from significant dispersion problems which affected accuracy.\n\
    \n![../img/CAM344_04.jpg](img/CAM344_04.jpg)\n\n`Myoko` was the first ship in\
    \ the first class of the `IJN’s` Treaty cruisers. These ships were well over the\
    \ 10,000-ton treaty limit that assisted Japanese designers in building a balanced\
    \ ship with immense firepower, high speed, and a significant degree of protection.\
    \ The `Myoko` class was superior to `US Navy` and `Royal Navy` Treaty cruisers\
    \ and performed well during the war. (Yamato Museum)\n\n`Ashigara`, shown here\
    \ in December 1942 in drydock at the former `Royal Navy Seletar Naval Base` at\
    \ Singapore, served as Vice Admiral `Takahashi’s` flagship during the invasion\
    \ of the Philippines and the `NEI`. Held in reserve, she did not get an opportunity\
    \ to engage Allied warships until March 1, when she played a leading role in the\
    \ destruction of `Royal Navy` heavy cruiser `Exeter` and destroyer `Encounter`.\
    \ She remained in `NEI` waters for most of the remainder of her career and was\
    \ sunk by the `Royal Navy` submarine `Trenchant` in the Bangka Strait on June\
    \ 7, 1945. (Yamato Museum)\n"
  raw: 'It should be noted that although the attack into Southeast Asia was allocated
    the majority of the Combined Fleet’s combatants, there were other operations which
    required significant portions of the Combined Fleet. Foremost among these was
    the Kido Butai which was allocated to the Pearl Harbor operation, and then briefly
    supported operations in the South Pacific before becoming available to support
    the NEI campaign in early February. The IJN’s battleships were retained in home
    waters as a strategic reserve, but one section of Sentai 3 with two Kongo-class
    fast battleships was allocated to the Southern Expeditionary Force. The rest of
    the Combined Fleet was occupied supporting the operations in the South and Central
    Pacific (mainly the Fourth – or Mandate – Fleet), watching the Northern Pacific
    (the Fifth Fleet). Most of the Combined Fleet’s submarines were allocated to support
    operations against the US Navy as part of the Hawaiian Operation, but 16 older
    units were allocated to support operations in Southeast  Asia.


    ![../img/CAM344_024.jpg](img/CAM344_024.jpg)


    One of the IJN’s forgotten early-war aircraft was the G3M long-range bomber, later
    given the Allied reporting name of “Nell”. Flying in the absence of Allied fighters,
    this bomber was very effective, as was shown by its exploits against Force Z,
    Cavite, and Soerabaja naval bases, and ABDA’s Striking Force. (US Naval History
    and Heritage Command)


    In all, the Southern Expeditionary Force was allocated two battleships, 12 heavy
    cruisers, four light cruisers, and some 52 destroyers. On the surface, this was
    a formidable force, but the pace of operations and the breadth of the operating
    area meant that it was never concentrated. Imperial Japanese Navy surface units
    were inadequate to strongly protect all invasion and reinforcement convoys, leaving
    open the possibility that Allied naval forces could catch a weakly escorted convoy
    or engage a segment of the Southern Force and defeat it  piecemeal.


    Vice Admiral Kondo retained direct command of a powerful covering force which
    included two battleships (Kongo and Haruna), three heavy cruisers (Atago, Takao,
    and Maya), and eight destroyers. This force acted in a distant support role. The
    direct cover for the many amphibious landings was provided by the two forward
    groups of the Southern Expeditionary Force. These were the two pincers which led
    the advance into the NEI. The exact designations of these pincers changed over
    the course of the campaign, but were most often referred to as the Eastern and
    Western  Forces.


    ![../img/CAM344_023.jpg](img/CAM344_023.jpg)


    A small number of B5N1 attack aircraft, like the one shown here in this pre-war
    photograph, flying from carrier Ryujo, played a significant part in the NEI campaign.
    These aircraft could employ both torpedoes and bombs, but only used bombs during
    the campaign. They helped repel the Allied Striking Force on February 4 and 15\.
    (US Naval History and Heritage Command)


    The Eastern Force was under the command of Vice Admiral Takahashi. It was allocated
    the light carrier Ryujo, the four Myoko-class heavy cruisers, Destroyer Squadron
    2 with light cruiser Jintsu and eight destroyers, and Destroyer Squadron 4 with
    light cruiser Naka and 11  destroyers.


    The Western Force, under the command of Vice Admiral Ozawa, was assigned heavy
    cruiser Chokai as his flagship and the four Mogami-class heavy cruisers, and Destroyer
    Squadron 5 with flagship Sendai and seven  destroyers.


    Imperial Japanese Navy land-based air forces were expected to play a large part
    in the campaign. The 22nd Air Flotilla, based in French Indochina, was allocated
    to cover the Malaya operation, and the 21st and 23rd Flotillas were initially
    allocated to support the attack on the Philippines. All of these were eventually
    available to support operations against the NEI. These were very powerful offensive
    forces, as was demonstrated on December 10 when land-based IJN aircraft sank Prince
    of Wales and Repulse off Malaya. The aircrews were very highly trained for maritime
    strike operations and the aircraft they flew were very capable. The mainstay aircraft
    were the G3M (later given the Allied reporting name of “Nell”) and the G4M (later
    given the reporting name of “Betty”). Both types of aircraft possessed long ranges,
    and could carry a 1,870-pound Type 91 aerial torpedo or 2,200 pounds of bombs.
    Against naval targets, they were capable of conducting level bombing, usually
    from around 10,000ft to avoid most antiaircraft fire, or torpedo bombing. High-level
    attacks against naval bases were also a priority mission. Both the G3M and G4M
    were vulnerable to interception by Allied fighter aircraft, but this was not a
    concern during the  campaign.


    #### The ships


    Imperial Japanese Navy heavy cruisers were the spearhead of the Japanese naval
    advance into the NEI. Japanese heavy cruisers were designed to play several important
    roles, principally as the centerpieces of night-fighting battle groups. The design
    of IJN heavy cruisers emphasized firepower, since in order to perform their wartime
    roles they had to be more heavily armed than comparable US Navy ships and possess
    the capability to strike at greater ranges than American cruisers. They were capable
    of conducting long-range gunnery attacks with their 8in. gun batteries. The Myoko
    class, the first of which was commissioned in 1928, was fitted with a main battery
    of ten 8in. guns by the time the war began. The next class to commission was the
    four-ship Atago class, also fitted with ten 8in. guns. The four-ship Mogami class
    was originally commissioned as light cruisers with 15 6in. guns, but before the
    start of the war was upgraded to a main battery of ten 8in. guns. The maximum
    range of the 8in. guns fitted to these three classes ranged between 31,606 and
    32,153 yards. The Japanese believed that the fire-control equipment fitted to
    their cruisers gave their 8in. guns an effective engagement range of 21,873 yards,
    but they often engaged targets at even longer ranges. However, at extended ranges
    the twin-gun 8in. turret suffered from significant dispersion problems which affected  accuracy.


    ![../img/CAM344_004.jpg](img/CAM344_004.jpg)


    Myoko was the first ship in the first class of the IJN’s Treaty cruisers. These
    ships were well over the 10,000-ton treaty limit that assisted Japanese designers
    in building a balanced ship with immense firepower, high speed, and a significant
    degree of protection. The Myoko class was superior to US Navy and Royal Navy Treaty
    cruisers and performed well during the war. (Yamato Museum)


    ![../img/CAM344_005.jpg](img/CAM344_005.jpg)


    Ashigara, shown here in December 1942 in drydock at the former Royal Navy Seletar
    Naval Base at Singapore, served as Vice Admiral Takahashi’s flagship during the
    invasion of the Philippines and the NEI. Held in reserve, she did not get an opportunity
    to engage Allied warships until March 1, when she played a leading role in the
    destruction of Royal Navy heavy cruiser Exeter and destroyer Encounter. She remained
    in NEI waters for most of the remainder of her career and was sunk by the Royal
    Navy submarine Trenchant in the Bangka Strait on June 7, 1945\. (Yamato Museum)'
