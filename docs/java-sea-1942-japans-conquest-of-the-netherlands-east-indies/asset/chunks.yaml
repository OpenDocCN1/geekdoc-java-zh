  raw: 'Released from covering convoys to Malaya to support the campaign against Singapore,
    the IJN’s Western Force prepared a large operation to strike at Palembang. To
    escort the invasion force of 25 transports, Vice Admiral Ozawa collected five
    heavy cruisers, light cruiser Sendai, and 11 destroyers. Light carrier Ryujo (with
    12 fighters and 15 B5N1 “Kate” attack aircraft embarked), was also shifted from
    the Eastern Force to provide support. This invasion force departed Cam Ranh Bay
    in Indochina on February 10 and headed  south.


    The Allies had been watching this major concentration and made plans to stop it.
    A submarine attack by a US Navy submarine on February 11 was unsuccessful, as
    were two British air attacks. Doorman’s Striking Force was also ordered to move
    to the small Dutch naval base of Oosthaven on the southeastern tip of Sumatra
    to prepare to intercept. Vice Admiral Helfrich, who formally took over command
    of ABDA naval forces on February 12, allocated him what on the surface appeared
    to be a formidable force – Dutch cruisers De Ruyter, Java, and Tromp, British
    heavy cruiser Exeter, Australian cruiser Hobart, six US Navy destroyers, and four
    Dutch destroyers. With this significantly reinforced force, Helfrich ordered Doorman
    to attack the Japanese invasion convoy. Accordingly, the Striking Force departed
    Oosthaven on the afternoon of February  14.


    ![../img/CAM344_061.jpg](img/CAM344_061.jpg)


    On February 15, Doorman was taking his striking force to attack the Japanese invasion
    force off Palembang. All five Allied cruisers present were bombed throughout the
    day with the Japanese flying a total of 93 sorties. Here, Java is shown under
    attack. She suffered only minor splinter damage despite being the focus of several
    waves of bombers. (Netherlands Institute for Military History)


    ![../img/CAM344_062.jpg](img/CAM344_062.jpg)


    De Ruyter also suffered no damage from the February 15 air attacks. However, with
    the element of surprise gone and fuel low, Doorman called off the operation. (Netherlands
    Institute for Military History)


    Bad luck dogged the operation from the start. In the early morning hours of the
    15th, the Dutch destroyer Van Ghent ran hard aground in the Stolze Strait between
    Bank and Billiton Islands. The ship was a total loss, and Doorman assigned another
    Dutch destroyer to take off the crew and scuttle the ship. The element of surprise
    was lost hours later, when at 0923hrs a Japanese cruiser floatplane sighted the
    Striking Force. Air attacks soon followed. The first was at 1020hrs when four
    B5N1 “Kates” from Ryujo selected Exeter for attention. The aircraft dropped 550-pound
    bombs from high altitude, but scored no hits. This first attack was followed by
    a much larger effort by 23 G3Ms flying from Borneo. Dropping from high level,
    they only caused minor damage to two American destroyers. Seven more B5N1s made
    an appearance at 1130hrs and attacked Exeter, again causing only minor damage.
    At this point, Doorman cancelled the operation. However, the ordeal of the Striking
    Force was not over. Two more groups of land-based bombers with 44 aircraft in
    total arrived to make high-level attacks. Again, no hits were scored. Also unsuccessful
    were 19 B5N1s from Ryujo in three groups. The day-long encounter between the Striking
    Force and the IJN’s Air Force ended in a draw. No ships were hit except by near
    misses, and no aircraft were shot down. But the largest Allied naval force gathered
    to date was forced to abort its attempt to thwart a Japanese invasion. As a result,
    the invasion of Palembang proceeded unimpeded. Its success forced the Allied evacuation
    of  Sumatra.


    Japanese air power continued to dominate the theater. On February 15, Japanese
    bombers from Kendari attacked an Allied reinforcement convoy bound for Timor.
    Though no hits were scored, mainly because the bombers went after Houston instead
    of the slower and less maneuverable transports, this was the first air attack
    on Allied ships south of the Malay barrier. The convoy was ordered to return to
    Darwin, Australia, which was the main base used to funnel reinforcements and aircraft
    into the NEI. On February 17, land-based bombers and B5N1s from Ryujo sank a Dutch
    transport and destroyer evacuating troops from Billiton Island with heavy loss
    of  life.


    ![../img/CAM344_039.jpg](img/CAM344_039.jpg)


    Dutch destroyer Van Nes was a victim of Japanese naval air power. On February
    17, the destroyer was escorting a Dutch transport sent to evacuate the garrison
    from Billiton Island. After embarking the troops, the two ships were spotted by
    a Japanese cruiser floatplane and then subjected to concentrated air attack by
    15 G3M Nells and ten Kates from Ryujo. The destroyer was hit by three bombs from
    Ryujo’s aircraft and quickly sank with the loss of 68 crewmen. (US Naval History
    and Heritage Command)


    ![../img/9781472831613_Map003.jpg](img/9781472831613_Map003.jpg)


    Battle of the Badoeng Strait, February 19–20, 1942


    ![../img/CAM344_052.jpg](img/CAM344_052.jpg)


    In a remarkable display of marksmanship, Japanese dive-bombers hit the maneuvering
    destroyer Peary five times in Darwin harbor on the morning of February 19\. The
    ship was surrounded by blazing oil, as shown in this view. Only 53 of her crew
    survived; another 80 died. (US Naval History and Heritage Command)


    The threat from Japanese air power increased significantly with the arrival of
    the Kido Butai into the area in mid-February. The force consisted of four of the
    six carriers which had attacked Pearl Harbor – Akagi, Kaga, Hiryu, and Soryu.
    With the help of land-based bombers from Kendari, the Japanese decided to use
    their carrier force to neutralize Darwin. The harbor was full of potential targets
    on 19 February – 47 warships and merchants of various types. The air defenses
    of this important base were minimal and proved ineffective against the 188 aircraft
    sent from the four Japanese carriers. The Japanese aircraft hit the ships in the
    harbor, sinking nine (including the American destroyer Peary), and ravaged the
    shore facilities. Fifty-four land-based bombers completed the devastation, attacking
    the two nearby airfields. The only major link to the NEI had been temporality  neutralized.


    ### THE BATTLE OF THE BADOENG STRAIT


    The Japanese crept closer to Java. On February 20, they landed a regiment on Timor
    Island. The defending garrison was defeated in three days. The loss of the island
    and its airfield meant the transfer route for aircraft flying from Australia to
    the NEI was  cut.


    A more immediate threat to Java was a Japanese operation targeted at Bali, located
    just to the east of Java. If the Japanese could seize the airfield at Denpesar,
    they could ratchet up the pressure on facilities on Java and dominate the southern
    approaches to the island, cutting off all  reinforcement.


    The Japanese plan to deliver the landing force to Sanoer Roads on the southeastern
    coast of Bali on the Badoeng Strait was risky, since it was so close to major
    Allied air and naval bases. The landing force was put aboard two transports, and
    these were escorted by four Asashio-class destroyers. Per Japanese doctrine, the
    landing would take place at night, allowing the transports to leave early in the
    day. Light cruiser Nagara and three more destroyers were positioned to the north
    to provide distant support. This force departed Makassar on February  17.'
