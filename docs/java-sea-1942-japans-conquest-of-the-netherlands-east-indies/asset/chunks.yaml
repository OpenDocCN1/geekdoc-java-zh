    ![封面](img/cover.jpg)


    ![标题页](img/titlepage.jpg)


    ![../img/9781472831613_Map001.jpg](img/9781472831613_Map001.jpg)


    菲律宾、马来亚与荷属东印度群，1941 年 12 月


    # 战役起源


    日本在太平洋战争初期对东南亚的征服（包括爪哇海海战及一系列相关的战斗）是上个世纪开始的一系列事件的顶点。20 世纪 30 年代见证了日本在亚洲的扩张浪潮。日本最初的焦点是中国，因为当时很软弱。1931
    年 9 月，日本关东军占领了满洲。次年，日本首相被一群海军官和陆军学员刺杀，这引发了导致平民统领政府终结的一系列事件。这意味着日本的扩张野心没有受到内部约束。


    1937 年 7 月，中国北方爆发战斗，导致日本入侵中国北方和沿海地区。尽管日本在 1938 获得了巨大收益并投入了 150 万士兵，但中国的战争陷入了僵局。1939
    年，欧洲爆发战争，这为日本军领领带来了更多机会和诱惑。日本对欧洲冲突采取观望态度，但到 1940 年，盟国已处于下风地位。随着法国和荷兰被击败，英国的生存存疑，日本开始准备在远东发动扩张战争。


    这场重启的扩张战争重点是东南亚及其资源。日本陆军（IJA）支持向南移动，以完成对中国的隔离。日本帝国海军（IJN）也支持向东南亚扩张，因为只有那里的资源提供了抵抗美国经济压力的手段。尽管美国不愿干预日本在华侵略，但为了应对日本在中国的持续扩张，加强了经济压力。


    荷属东印度群岛（NEI）几乎毫无防御的状况，以及英国人在东南亚的危险处境，似乎为日本提供了一个摆脱与美国困局的方法。日本经济严重依赖美国的石油和废铁出口。试图通过谈判打破美国经济枷锁的努力注定失败，因为日本永远不会自愿放弃在中国的扩张。另一个驱动日本近期发动战争的因素是
    1941 年和 1942 年与美国海军相比有利的海军平衡。由于美国 1940 年 6 月《两洋海军扩张法案》的成果将导致日本海军在 1943 年初处于永久的劣势地位，成功战争的机会窗口相当小。因此，日本海军承担了对大英及其帝国、荷兰和美国发动战争的主要倡导者角色。在日本人看来，如果日本进攻东南亚，美国绝不可能保持中立，因此任何侵略性战争也必须对美国发动。太平洋战争的基础已经奠定。


    导致战争爆发的直接事件是众所周知的。1941 年 7 月，日本强迫维希法国宣布对东南亚实行法日共同保护国。作为报复，美国人、英国人和荷兰人对日本实施了全面的贸易禁运，并冻结了所有日本资产。由于由军队主导的日本政府没有可能接受美国从中国或印度支那撤军的要求，战争的倒计时加速了。日本必须在石油供应耗尽之前采取行动。因此，日本海军在
    8 月要求于 10 月开始对西方列国的敌对行动。陆军在两周后才同意。9 月 3 日，陆陆海军之间的会议设定了战争时间表。战争的冲刺因天皇要求给外交发挥时间而暂时停止，但到
    12 月 1 日，一次帝国会议确认了战争决定。


    ## 海军力量平衡


    支撑日本快速胜利希望的是 1941 年 12 月存在的海军力量平衡。正如下表所示，这种平衡有利于日本。


    ![../img/tab_6.jpg](img/tab_6.jpg)


    英国和荷兰的海军即使有美国海军亚洲舰队的协助，也显然无法防御其在东南亚的领地。部署在太平洋的美国海军力量相对于日本帝国海军的劣势也是显而易见的，这使得美国任何进入西太平洋营救菲律宾的尝试变得都不可能。


    英国防御马来亚和新加坡的战略规划基石是假设在敌对爆发后不久将大量的海军援军调往远东。由于 1941 年底敌对似乎迫在眉睫，英国履行了派遣海军援军防御马来亚的承诺。然而，这种增援不过是用来震慑日本发动敌对行动的虚张声势。此举是首相温斯顿·丘吉尔的心血，他认为派遣一支规模虽小但强大的打击部队会让日本有所顾。最终于
    12 月 2 日抵达新加坡的部队由现代战列`威尔士王子号`、旧战战巡洋舰`反击号`以及仅四艘驱逐舰组成。这支部队被命名为`Z 支队`，由临时海军将汤姆·菲利斯爵士指挥。


    ![../img/CAM344_034.jpg](img/CAM344_034.jpg)


    这一视角来自约翰·D·福特，另外两艘亚洲舰队驱逐舰在 1938 年执行了舰队少数海洋行动之一。亚洲舰队的战斗舰主要部署用于存在任务，对其潜在战争任务的训练并非首要任务。（美国海军史）由托马斯·哈特将领指挥的美国海军亚洲舰队在战争开始时处于暴露位置。其规模最大的单位巡洋舰`休斯顿号`位于巴丹，处于空袭范围之外，但五艘驱逐舰、除两艘外的所有潜艇以及舰队的大多数辅助舰在
    12 月 8 日的马尼拉湾。哈特的四艘驱逐舰在战争爆发时实际上位于前往新加坡的途中，于 12 月 10 日早晨抵达那里。


    ## 日本最初进攻


    日本在太平洋发起的最初进攻规模令人观止，远超盟国认为的可能范围。最大胆的是珍珠港行动，日本打击部队的六艘舰队母舰（`动大队`）攻击了美国海军太平洋舰队在夏威夷的主要基地。获得完全意外后，两波日本飞机对毫无准备的美国人造成了惨重损失。总共有
    18 艘美国海军舰只被击沉或损坏，包括在场的所有 8 艘战列。太平洋舰队的三艘母舰均不在场，因此全部幸存。在西太平洋，`广岛`遭到入侵，并于 12 月 10
    日迅速被日本占领。日本唯一的失误发生在 12 月 11 日，当时对中太平洋`韦克岛`的入侵尝试被美国驻守部队击回了。日本于 12 月 23 日带着更大的规模返回并成功占领了该岛。


    ![../img/CAM344_044.jpg](img/CAM344_044.jpg)


    珍珠港袭击并非战争开始时日本最重要的海军行动。最重要的行动是夺取荷属东印度群岛的资源；珍珠港袭击的重要性在于，它导致了美国海军无法在东南亚对抗日本的侵略。（美国海军史）


