    The US Navy’s standing Western Pacific force was weak, and it received no reinforcements
    during the campaign. With few exceptions, it was built around expendable ships.
    Its centerpiece was three cruisers and 13 destroyers. The only real source of
    potential strength was the fleet’s 29 submarines. However, their crews lacked
    experience and spent the months leading up to the war exercising exceedingly conservative
    tactics. These called for boats to execute torpedo attacks while submerged to
    as much as 100 feet using only sound bearings. Commanding officers were not allowed
    to make attacks at periscope depth or to expose their periscopes. There was also
    the issue of defective torpedoes, which further lessened their effectiveness.
    The most crippling factor was the lack of aggression among the commanding officers.
    Combined with tactics which emphasized stealth over attack, it made the submarines
    a non-factor in the campaign.


    Heavy cruiser `Houston` was the flagship of the fleet. She was commissioned in
    1930 and was one of the US Navy’s first generation “Treaty” cruisers, which carried
    a strong main battery (nine 8in. guns) but were under-protected compared to IJN
    heavy cruisers. The ship carried a strong antiaircraft battery of eight 5in./25
    guns, along with four newly installed quad 1.1in. mounts. US Navy heavy cruisers
    did not carry torpedoes. Early in February, `Houston` suffered damage which disabled
    her aft 8in. turret and was forced to fight the remainder of the campaign without
    it. Two light cruisers were also assigned to the fleet. `Boise` was a Brooklyn-class
    cruiser and was the fleet’s most modern asset. At 12,207 tons full load, she was
    larger than most Treaty heavy cruisers. Her main battery consisted of 15 6in.
    guns; each of which could fire up to ten rounds per minute. She was well protected
    and carried a comparable antiaircraft fit to `Houston`. `Marblehead` was an Omaha-class
    light cruiser. Commissioned in 1924, her weak protection and the antiquated main
    battery layout of her ten 6in. single guns made her unsuitable for front-line
    duties, hence her assignment to the Asiatic Fleet.


    ![../img/CAM344_028.jpg](img/CAM344_028.jpg)


    `Houston` was a Northampton-class heavy cruiser which was commissioned in 1930.
    Note the ship’s two large masts, the three 8in. triple turrets (two forward and
    one aft), and the aviation facilities between the two stacks. Compared to IJN
    heavy cruisers, she was under-armed and under protected. (US Naval History and
    Heritage Command)


    ![../img/CAM344_029.jpg](img/CAM344_029.jpg)


    Light cruiser `Boise` photographed in early November 1941 off Hawaii in a Measure
    1 camouflage scheme. Note the heavy main armament of 15 6in. guns in five triple
    turrets. She was among the most powerful light cruisers in the world in early
    1942, and possessed fighting power and protection equal to IJN heavy cruisers.
    Forced out of the NEI campaign after being grounded on an uncharted reef, the
    ship returned to service in time for the Guadalcanal campaign, where she was damaged
    in October at the battle of Cape Esperance. After being repaired again, she participated
    in the invasions of Sicily and Salerno in the Mediterranean. Returning to the
    Pacific in late 1943, her last major operation was the invasion of Borneo in 1945.
    (US Naval History and Heritage Command)


    The fleet’s destroyers all dated from the US Navy’s World War I building program.
    The 1,200-ton full-load ships were commissioned with four 4in./50 guns and 12
    21in. torpedo tubes. US Navy destroyer torpedoes were the `Mark 8`. They suffered
    from reliability issues and had a maximum range of 16,000 yards at 26 knots. By
    the start of the Pacific War, these ships retained the same armament with only
    the addition of a totally inadequate single 3in. gun and three to four .50-cal.
    machine guns for antiaircraft protection. Capable of 33–34 knots when commissioned,
    by 1941 they could barely make 28–30 knots. By the end of the campaign, torpedoes
    were in increasingly short supply. At Java Sea, some destroyers carried as few
    as six.


    ![../img/CAM344_030.jpg](img/CAM344_030.jpg)


    Light cruiser `Marblehead`, shown here in this pre-war photograph, was assigned
    to the Asiatic Fleet at the start of the war. Note the archaic arrangement of
    the forward 6in. guns with a twin turret and four in awkward casemate arrangements.
    Designed for scouting, the Omaha-class light cruisers were cramped, poorly protected,
    and were considered second-rate by the start of the Pacific War. Repaired following
    damage in February 1942, `Marblehead` operated primarily in the South Atlantic
    for the remainder of the war, looking for Axis blockade runners. (US Naval History
    and Heritage Command)


    ![../img/CAM344_031.jpg](img/CAM344_031.jpg)


    Destroyer tender `Black Hawk` moored at Chefoo, China, in about 1936, with six
    destroyers alongside. The tender was a converted merchant ship and was assigned
    to the Asiatic Fleet in 1922 and remained there by the start of the war. The Asiatic
    Fleet’s destroyers were assigned to the fleet in 1920s and were retained in the
    Far East and maintained at the Cavite Navy Yard in the Philippines. (US Naval
    History and Heritage Command)


    ![../img/CAM344_033.jpg](img/CAM344_033.jpg)


    Destroyer `Parrott` steaming off Guam in November 1928. She joined the Asiatic
    Fleet in 1925. The Asiatic Fleet’s flush deck destroyers were essentially short-range
    torpedo boats, and possessed minimal antisubmarine and antair capabilities. (US
    Naval History and Heritage Command) The entire fleet was poorly trained in the
    types of operations most likely would be expected to perform. For example, the
    destroyers did not practice night fighting. Maintenance was also a real issue,
    due to the advanced age of almost all ships in the fleet and because spare parts
    were unavailable. The entire air component of the Asiatic Fleet was comprised
    of Patrol Wing 10 with its PBY-4 Catalina flying boats. These were excellent at
    performing reconnaissance but possessed very limited strike capabilities. The
    ships that the Royal Navy committed to the defense of the NEI were also largely
    second. They were led by the heavy cruiser `Exeter`, which was the hero of the
    December 1939 engagement with the German armored ship `Graf Spee` at the battle
    of the River Plate. Damaged during the engagement, she was repaired and modernized
    over the following year. Of the Royal Navy’s 15 heavy cruisers, `Exeter` and her
    sister ship `York` were the smallest (just over 10,000 tons full load) and only
    carried six 8in. guns instead of the usual eight. She did carry six torpedo tubes,
    but was relatively lightly armored with a main belt of 3in. During her modernization,
    she received early warning and fire-control radars, making her the only radar-equipped
    ship in the campaign.


    ![../img/CAM344_070.jpg](img/CAM344_070.jpg)


    Heavy cruiser `Exeter`, photographed following modernization. This profile view
    shows her three dual 8in. turrets and a single bank of 21in. torpedo tubes. Facing
    IJN Myoko-class heavy cruisers, she would be overwhelmed. (Netherlands Institute
    for Military History) ![../img/CAM344_041.jpg](img/CAM344_041.jpg)


    The sister ship of `Perth` was `Hobart`, also a modified Leander-class light cruiser,
    which was transferred to the Royal Australian Navy in 1938. In the final stages
    of the campaign, she was assigned to the Western Striking Force and thus saw no
    action against the Japanese surface forces which ensured her survival beyond the
    fall of the NEI. (US Naval History and Heritage Command)

