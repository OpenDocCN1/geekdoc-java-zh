  raw: 'In Southeast Asia, the Japanese quickly disproved the Allied assessment that
    they were capable of only a single invasion at a time. After crippling American
    airpower in the Philippines on the ground on December 8, the Japanese turned their
    attention to the Asiatic Fleet’s main base at Cavite in Manila Bay on December
    10 with a raid by 51 bombers. These proceeded to lay waste to the naval base.
    The bombs destroyed much of the navy yard with its repair and machine shops, parts
    and other stores to keep the fleet in fighting order. Submarine Sealion, in overhaul,
    was destroyed, and Seadragon was damaged. More importantly, most of the fleet’s
    replacement submarine torpedoes were lost. Destroyers Pillsbury and Peary, also
    undergoing overhaul, were damaged. Despite the fact that both destroyers and all
    the major auxiliaries were able to depart Manila and head south over the next
    few days, the raid demonstrated clearly that Hart’s plans of at least operating
    the submarines out of Manila were impossible. The fleet headed south, not to exposed
    Singapore, but to northwest  Australia.


    Having gained control of the air, the Japanese conducted a series of landings
    in the Philippines. These began on December 8 with a small landing on the island
    of Batan some 125 miles north of Luzon. A landing on the island of Camiguin, between
    Luzon and Batan, and at Aparri on northern Luzon followed on the 10th. On December
    12, a landing at Legaspi in southern Luzon went off smoothly. The main landing
    at Lingayen Gulf took place on December 22\. These operations completely outmaneuvered
    the defenders and forced the Americans to retreat into the Bataan Peninsula. Here,
    the Americans and Filipinos held out until April, and the last of the defenders
    did not surrender until Corregidor Island fell on May 6\. Though their actions
    were ultimately futile, the American defenders in the Philippines held out much
    longer than their British counterparts in Singapore or the Dutch in the  NEI.


    Concurrently with their opening moves against the Philippines, the Japanese also
    invaded northern Malaya and southern Thailand. On December 8, Japanese troops
    conducted landings at Singora and Patani in southern Thailand and Kota Bharu in
    northern Malaya. Once established ashore, the Japanese 25th Army defeated the
    British at the battle of Jitra on December 11, which decided the fate of northern
    Malaya. By early January, central Malaya was lost when the Japanese smashed two
    Indian brigades at the battle of Slim River. By January 25, the British had decided
    to retreat back onto Singapore Island. The Japanese attacked across the Johore
    Strait on February 8 and a week later forced the garrison to  surrender.


    ### THE DESTRUCTION OF FORCE Z


    On December 10, the Allied naval position in Southeast Asia took a dramatic turn
    for the worse. In response to the initial Japanese invasion of northern Malaya
    and southern Thailand, the aggressive Phillips decided to commit his small striking
    force to defeat the Japanese invasion. Phillips sortied from Singapore after dusk
    on December 8 with his entire force. He calculated that by using the monsoon weather
    to provide cover, he had a good chance to strike the Japanese landing force at
    Singora. The target was later changed to Kota Bharu, where Phillips hoped to engage
    the Japanese invasion force on the morning of December 10\. Unfortunately for
    the British, any chance of surprise was quickly lost. A Japanese submarine spotted
    the force at 1345hrs on December 9 and Japanese aircraft picked up the force at  1740hrs.


