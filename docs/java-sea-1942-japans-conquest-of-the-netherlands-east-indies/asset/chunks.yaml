    英国海军派遣队包括几艘轻巡洋。其中最好的是两艘经过改装的利凡德级轻巡洋——`Hobart`和`Perth`号，它们分别于 1938 年和 1939 年移交给澳大利亚皇家海军。这两艘船都是经验丰富的军舰，特别是`Perth`，在
    1940 年至 1941 年间的地中海战中取得了卓越的战绩。两艘船都配装了 8 门 6 英寸主炮和 8 根 21 英寸鱼雷管，但防护较差。当时还有两艘 D
    级巡洋舰`Dragon`和`Danae`可用，但它们援建于 1918 年，不胜任前线任务。这两艘船都携带了 6 门单基座 6 英寸主炮和 12 根 21 英寸鱼雷管。


    ![../img/CAM344_042.jpg](img/CAM344_042.jpg)


    `Perth`最初于 1936 年作为`HMS Amphion`服役，并于 1939 年移交给澳大利亚皇家海军。`Perth`配备了 8 门 6 英寸炮、8
    门 4 英寸炮和 8 根 21 英寸鱼雷管，是一艘平衡良好的巡洋舰设计，在战争早期的地中海地区拥有过活跃且辉煌的战绩。它的性能优于日本轻巡洋舰，但在巽达海峡海战中被日击没。2013
    年，人们发现该船残骸已被拆卸了许多部件，拆解者曾使用炸药炸开了船体。（美国海军历史与遗产司令）


    可用的英国驱逐舰数量较少，且参差不齐。三艘 E 级舰于 1934 年服役。`Electra`和`Express`来到东方作为`威尔士王子号`的护卫，而`Encounter`则从地中海舰队中抽调。这些船的排水量约为
    1,500 吨，比当时所有的现代日本驱逐舰都要小。每艘船都配有 4 门单基座 4.7 英寸炮和 8 根 21 英寸鱼雷管，且都是经验丰富的军舰。`Electra`在战役中幸存下来，是因为它在
    12 月 10 日救援`威尔士王子号`的幸存者时受损，被迫在 2 月上离开该地区前往锡里兰。同样从地中海舰队抽调的`Jupiter`号于 1939 年服役，武装更精良，拥有三座双联
    4.7 英寸炮基座和十枚五管联装 21 英寸鱼雷。它早在 1942 年 1 月 17 日就通过击沉`I-60`号潜艇让日本人吃了苦头。此外，还有几艘满载 1,220
    吨的 S 级驱逐舰被分配给东方舰队。它们于 1918 年至 1919 年间服役，配有 3 门 4 英寸炮和 4 根鱼雷管。战争这一时期英国主要的驱逐舰鱼雷是`Mark
    IX`型，在 35 节的航速下最大射程为 15,000 码。


    ![../img/CAM344_043.jpg](img/CAM344_043.jpg)


    这是战前拍摄的 D 级轻巡洋舰`Danae`号。注意其单基座 6 英寸主炮座和左舷的两个三联装鱼雷架。`Danae`号于 1918 年服役，在太平洋战争爆发时已经过时。它被分配执行护护卫任务，随后进入西线打击部队，这两艘
    D 级巡洋舰从未有机会与日军交战。（美国海军历史与遗产司令）


    #### 荷兰皇家海军


    荷属东群岛（NEI）的荷兰海军力量并未做好战争准备。当时有三艘巡洋舰在役，但其性能均逊于外国同类。最现代的船只`De Ruyter`号于 1935 年下水，配备了
    7 门 5.9 英寸主炮。它没有携带鱼雷，防空火力不足，且装甲薄弱。`Java`号于 1921 年下水，基于第一次世界大战期间巡洋舰的设计，配有 10 门
    5.9 英寸主炮的主力，全部为单基座，其中仅有 7 门可以侧舷齐射。`Tromp`号满载排水仅为 4,215 吨，表明它被设计为驱逐舰队队长；除了巡洋舰外，荷兰还有七艘驱逐舰在役。它们都属于同一级别，基于英国设计，并于
    1925 年开始在荷兰建造。每艘船配有 4 门单基座 4.7 英寸炮和 6 根鱼雷管。荷兰标准的鱼雷是 21 英寸级的武器，在 28 节航速下最大射程为 10,936
    码。荷兰在荷属东群岛还运行着 15 艘潜艇，大部分是 20 世纪 20 年代的产。所有荷兰单位都面临维修和人员问题，因为无法从荷兰获得零件，且荷属东群岛的维修设施不足以维持舰队战斗状态。一艘驱逐舰`Witte
    de With`号缺少船员。当`Van Ghent`号搁浅并自沉时，其全体船员转移到了`Witte de With`号，但这艘驱逐舰直到 2 月才可用。总的来说，荷兰的训练并不强健，但他们强调夜战。没有荷兰船只配备雷达。


    ![../img/CAM344_073.jpg](img/CAM344_073.jpg)


    `De Ruyter`号是荷兰皇家海军东印度中队最强大的单位，但在火力、防护和速度方面，它是一个完全落落的巡洋舰设计。从图中可以看到该船的两座双联 5.9
    英寸炮塔；总共有 7 门 5.9 英寸炮。图中显示了五联装 40 毫米炮座。该船没有重型防空炮。侧舷装甲仅为英寸。最大航速为 32 节。在面对日本巡洋舰时，结果在预料之中。（荷兰军事史）


    ![../img/CAM344_067.jpg](img/CAM344_067.jpg)


    这是战前拍摄的荷兰轻巡洋舰`Java`号。其设计基于第一次世界大战期间的巡洋舰。`Danae`号于 1918 年服役，在太平洋战争爆发时已经过时。它被分配执行护队护卫任务，随后进入西线打击部队，这两艘
    D 级巡洋舰从未有机会与日军交战。（荷兰军事史）


    ![../img/CAM344_037.jpg](img/CAM344_037.jpg)


    `Tromp`号于 1931 年授权作为驱逐舰队队长，满载排水仅为 3,450 吨。配备了 6 门 5.9 英寸炮和 6 根 21 英寸鱼雷管。可见。


    ![../img/CAM344_069.jpg](img/CAM344_069.jpg)


    `Witte de With`号是`Galen`级四艘舰的一员，于 1929 年至 1931 年间服役。这些船在之前的`Galen`级基础上增加了四门 40
    毫米防空炮，替换了前一型号的 75 毫米炮座。虽然这在当时是相当密集的防空配置，但对于荷属东群岛战役中面临的空威胁来说是完全不足的。（荷兰军事史）


