- fmt: '

    By the time the second wave arrived, `Oshio` and `Asashio` were circling off shore
    to the east of the damaged `Sasago Maru`. `Arashio` and `Michishio` were coming
    south, and the covering force led by cruiser `Nagara` was also steaming to the
    area. The Allied second wave was led by the four American destroyers with the
    Dutch cruiser `Tromp` following five miles in the rear. The cruiser’s captain
    was in tactical command, and he planned to have `Tromp` finish off the cripples
    resulting from the destroyers’ torpedo attack.


    The American destroyers steamed into the anchorage area at `25` knots. They expected
    to be facing a much larger Japanese force; efforts to contact the two American
    destroyers in the previous wave provided no information. At `0135hrs`, `Stewart`
    sighted a possible contact to port. Within minutes, she and `Parrot` fired six
    torpedoes into the anchorage with `Pillsbury` adding another three. All `15` torpedoes
    missed, and it’s unlikely they were even fired at a real target. `Asashio` and
    `Oshio` finally spotted the Americans and steered to engage. At `0143hrs`, `Stewart`
    sighted the Japanese and used her searchlight and `4in.` guns to engage. The Japanese
    returned an intense fire, and at `0145hrs` fired torpedoes from `3,500` yards
    at the Americans. The first damage inflicted by either side was at `0146hrs`,
    when a couple of Japanese `5in.` shells hit `Stewart`. The damaged `Stewart` turned
    to the northeast, which disrupted the American column.


    The Japanese destroyers shifted their attention to `Tromp` when she used her searchlight
    to signal the American destroyers. From a range of some `3,300` yards, `Asashio`
    pounded `Tromp` with `11` `5in.` shells causing extensive damage to her topside
    equipment. `Oshio` missed the cruiser with a salvo of torpedoes. At `0216hrs`,
    `Tromp` landed a `5.9in.` shell on `Oshio`’s bridge, killing seven. `Tromp` and
    all four American destroyers continued steaming to the northeast.


    The next phase of the battle featured `Arashio` and `Michishio`, which were headed
    south to the sound of the guns. At `0215hrs`, `Michishio` spotted two contacts,
    and used her searchlight to illuminate them. They were `Stewart` and `John D.
    Edwards`. Both American destroyers, joined by `Pillsbury`, took `Michishio` under
    fire with their `4in.` guns and six torpedoes from `John D. Edwards`. `Pillsbury`
    unleashed three more torpedoes. The surprised Japanese were caught in a deadly
    crossfire. All the torpedoes missed, but a `4in.` shell hit the destroyer’s `Number
    2` `5in.` mount, destroying it and killing the crew. Another shell hit the bridge,
    wounding `Michishio`’s captain. `Tromp` followed this up with three more shells
    in the Japanese destroyer’s engine room, which brought her to a halt. The Allied
    ships did not linger to finish off the crippled destroyer, but continued to the
    northeast and broke contact.


    The Allied third wave attack was totally ineffective. Of the nine torpedo boats
    ordered to attack, only eight made it to the battle area. They entered the strait
    in two groups of four. One group gained no contact and the second sighted possible
    targets proceeding at high speed but could not get into an attack position. All
    the torpedo boats returned to `Soerabaja` having achieved nothing.


    ![../img/CAM344_048.jpg](img/CAM344_048.jpg)


    Destroyer `Stewart` was sent to `Soerabaja` after the battle of the Badoeng Strait
    for repairs. As the drydock she was in was being pumped out on `February 20`,
    the ship capsized because of poor bracing. The drydock was scuttled on `March
    2` before the Japanese occupied the city. In `February 1943`, the ship was raised
    by the `IJN` and put into service as `Patrol Boat 102`. She is shown here after
    the war, having been returned to US Navy custody and given here original hull
    number. (US Naval History and Heritage Command)


    Both sides thought they had inflicted severe damage on the other. In reality,
    the Allies had lost a fine opportunity to inflict a local defeat on the Japanese.
    In the first wave attack, `Doorman`’s inept tactical plan squandered the Allies’
    best hope of victory. The two Japanese destroyers were handled aggressively and
    well. First, they fought off an attack by two Dutch light cruisers which failed
    to press home their advantage, then they overwhelmed a single Dutch destroyer,
    and finally they chased off two American destroyers. The second wave gained temporary
    surprise but failed to press its advantage. The cost of the battle was considerable
    for the Allies. One destroyer (`Piet Hein`) was sunk and the light cruiser `Tromp`
    was forced to Australia for repairs, which took her out of the campaign. The American
    destroyer `Stewart` was sent to a drydock in `Soerabaja` for repairs. Unfortunately,
    the drydock collapsed and `Stewart`’s fighting days were over. She was later salvaged
    by the Japanese and served in the `IJN` as a patrol boat for the remainder of
    the war. The Japanese believed they had done more damage, claiming two of the
    three destroyers sunk in the first wave with the third heavily damaged. Total
    Japanese claims were two cruisers and three destroyers sunk and two destroyers
    heavily damaged. `Yamamoto` accepted these claims as ground truth, which seemingly
    accounted for a large proportion of `ABDA`’s remaining assets. The battle was
    not without loss for the Japanese. `Michishio` was heavily damaged and was towed
    to Makassar for repairs which took the better part of `1942`. `Asashio` was lightly
    damaged, and `Oshio` suffered moderate damage. Overall, the battle was another
    example of Allied naval ineffectiveness. They were caught off balance and reacted
    too slowly to stop another Japanese landing, and when they did show up, they were
    outfought by a smaller Japanese force.


    ### THE JAPANESE APPROACH TO JAVA


    The Japanese landings on Sumatra in the west and Bali in the east left Java as
    the only major island in the NEI still held by the Allies. The Japanese had maintained
    a quick pace in the NEI, and with their final prize within reach, they commenced
    a plan to seize Java. This called for landings on both the eastern and western
    parts of the island.


    The first to move was the Western Force. It departed `Cam R Bay` on `February
    18` with an invasion fleet of `56` transports. On board was the headquarters of
    the `16th Army`, responsible for the occupation of Java, an entire infantry division,
    and another infantry regiment. A large close escort force was provided which consisted
    of three light cruisers and `13` destroyers. The covering force consisted of `Ozawa`’s
    flagship heavy cruiser `Chokai`, the four `Mogami`-class heavy cruisers from `Sentai
    7` under Admiral `Kurita`, and several destroyers. The light carrier `Ryujo` remained
    with the Western Force.


    On `February 19`, the Eastern Force departed `Jolo` in the northern Celebes Sea
    with an invasion fleet of `41` transports carrying another complete infantry division.
    The `IJN` provided an escort built around Admiral `Takagi`’s two heavy cruisers
    from `Sentai 5` and the Destroyer Squadron `2` under Admiral `Tanaka`. Close escort
    for the invasion convoy consisted of Destroyer Squadron `4` under Admiral `Nishimura`
    reinforced with four minesepers, six submarine chasers, and a minelayer.


    ![../img/CAM344_001.jpg](img/CAM344_001.jpg)


    Seaplane carrier `Mizuho` was flagship of the `11th Seaplane Tender Division`,
    which played an important role in the NEI campaign. Beginning with the occupation
    of `Menado` in January, she was active for the entire campaign culminating in
    the landing on eastern Java in late February. Against spotty Allied air resistance,
    these ships provided effective air cover, though they carried only floatplanes.
    On `March 1`, together with seaplane carrier `Chitose`, `F1M` “Pete” floatplanes
    gained a near miss on destroyer `Pope` with `132`-pound bombs which slowed her
    down and led to her destruction. Following the NEI campaign, `Mizuho` was sunk
    on `May 1, 1942` in Japanese home waters by the American submarine `Drum`. Had
    she not been sunk, she would have most likely been converted into an aircraft
    carrier. (Yamato Museum)

