    如果 ABDA（美英荷澳盟）曾有过真正的机会击退日本入侵，或者至少获得局部胜利，那么日本入侵巴厘岛就是那个机会。然而，这次行动的时机让赫尔里希（Helfrich）措手不及，因为像通常一样，他的大部分海军部队被分配护护护队。他必须迅速重新集一支打击力量并将其派往
    `Badoeng Strait`。由于快速完成这一行动非常困难，且不想浪费额外时间将所有可用力量集结成单一力量来压制日军，赫尔里希制定的计划仍然难以理解或辩护。可用的盟军舰船位于苏门答腊东南岸的
    `Soerabaja`、`Tjilatjap` 和 `Rantai Bay`。赫尔里希知道入侵军正在 `Makassar` 集结，但其目标尚不明确。尽管意识到了这一点，当日本人的实际目标暴露为巴厘岛时，赫尔里希仍然感到措手不及。他与多尔曼（Doorman）在
    2 月 17 日商量了处理方法，并制定了 2 月 19 日至 20 日夜间反击的计划。由于舰船来自不同的基地，计划中攻击将分三波进行。第一波由来自 `Tjilatjap`
    的可用舰船组成，它们将从南方进入 `Badoeng Strait` 进行攻击，然后继续向北开往 `Soerabaja`。这支力量包括轻巡洋 `De Rutyer`
    号和 `Java` 号、荷兰驱逐舰 `Kortenaer` 和 `Piet Hein`，以及美国驱逐舰 `Pope` 和 `John D. Ford`。第二波由来自
    `Soerabaja` 和 `Rantai Bay` 的舰船组成。轻巡洋 `Tromp` 将率领来自 `Rantai Bay` 的四艘美军驱逐舰（`Stewart`、`Parrott`、`John
    D. Edwards` 和 `Pillsbury`）从南方向北进入 `Badoeng Strait` 攻击日军，然后经 `Lombok Strait` 回到
    `Soerabaja`。第三波由九艘荷兰鱼雷艇组成，它们也将从南方发动进攻。


    该计划在许多方面都存在缺陷。盟军飞机报告了一支规模大得多的力量——两艘巡洋舰、多达六艘驱逐舰和四艘运输船，使得赫尔里希集结兵力至关重要。登陆已经在 2 月
    19 日凌晨发生，没有任何盟军海军单位能及时赶到改变这一事实。赫尔里希本应将可用舰船集结成一支可能具有压倒性优势的力量。但他认为时间不足让来自几个基地的舰船会合，而且任何此类会合都必须在晚上进行，这增加了难度。无论如何，由于速度和续航能力的考量，将鱼雷艇纳入统一的打击力量中是不可能的。赫尔里希似乎将他的攻击视为一系列突袭，而不是一场决战。如果属实，这也很难解释，因为突袭并不能阻止日军。


    日军登陆于 2 月 19 日 `0200hrs` 顺利进行，没有出现任何问题。陆上战斗很快以日军有利利告终，他们俘获了完整的机场。然而，在天亮时分，一系列空袭开始扰乱了日军的计划。到
    `0800hrs`，12 架重轰炸机攻击了那艘运输船。虽然没有命中，但攻击延迟了卸货。随后，两架 A-24 俯冲炸机（海军 `SBD Dauntless`
    的美国陆军版本）发动攻击，击中了运输船 `Sagami Maru`。下午，负责该行动的日本海军将命令该船在驱逐舰 `Arashio` 和 `Michishio`
    的护航下返回 `Makassar`。


    这导致运输船 `Sasago Maru`仍在卸货，由驱逐舰 `Asashio` 和 `Oshio` 护航。最后，在天黑后，该小组离开了停锚地，但一小时后，运输船返回卸下八艘供陆上分遣队使用的登陆艇。`Asashio`
    在运输船附近航行，`Oshio` 位于西北方约 3000 码处


    ![../img/CAM344_038.jpg](img/CAM344_038.jpg)


    图中显示在 `Soerabaja` 干坞中的 `Piet Hein` 号是战争开始时可用的七艘荷兰皇家海军驱逐舰之一。1940 年 5 月荷兰沦落后，维持东印度群岛舰队舰船的运作变得越来越困难。（美国海军历史与遗产司令部）


    第一波盟军攻击群在 `2230hrs` 之前抵达停锚地区域。该小组由多尔曼指挥。他将他的两艘巡洋舰部署在驱逐舰前方约 5500 码处。他们的命令是进行火射交战，而驱逐舰则用鱼雷攻击受扰乱的日军。这是一个糟糕的计划，因为突袭性的鱼雷攻击随后进行炮击攻击可能更有效，就像在巴厘望板（Balikpapan）一样。巡洋舰以
    27 节的速度冲向日军。`Java` 号先发现 `Asashio` 号，但荷兰人开火缓慢。`2230hrs`，`Asashio` 发现了 `Java` 号并试图用探照灯照亮这艘巡洋舰。随后的战斗非常短暂且没有胜负；这证实了赫尔里希意图这仅仅是一次突袭的观点。`Java`
    号在 2200 码处与驱逐舰交战，一发命中并毁了它的探照灯，导致四死一伤。`Java` 号与该驱逐舰交战，一发命中并毁了其探照灯。另一发击中了 `Sasago
    Maru`。作为回报，`Java` 号后部中了一发 5 英寸炮。此时荷兰巡洋舰向北逃离并断了联系。`De Ryter` 和 `Oshio` 都没有开火。几分钟后，盟军驱逐舰带着
    `Piet Hein` 号抵达两艘船前方 5000 码处。`Oshio` 首先发现目标，在 `2235hrs` 于南方 6000 码处发现了这艘荷兰驱逐舰。日本人转向东南战斗。`Piet
    Hein` 号用三枚鱼雷和 4.7 英寸主炮攻击 `Sasago Maru`。一旦离开荷兰驱逐舰的烟雾，`John D. Ford` 号也发射了三枚鱼雷并向运输船射击了
    4 英寸炮。队列中的最后一艘驱逐舰 `Pope` 号向运输船发射了两枚鱼雷。两艘美军船都声称命中，但均未命中 `2240hrs`，`Asashio` 在仅
    1600 码的距离内与 `Piet Hein` 交战，随后将美军驱逐舰置于火力之下`Pope` 向 `Asashio` 发射了两枚鱼雷，但未命中。为了避免与荷兰船碰撞并避开东方的
    `Asashio`，两艘美军驱逐舰转向西方。这让 `Piet Hein` 陷入孤立；在发射另外两枚鱼雷后，它的锅炉中了一发 5 英寸炮。在损救措施完全恢复动力之前，该船在
    `2246hrs` 被 `Asashio` 的一枚鱼雷命中。后果是毁灭性的；这艘荷兰船迅速向右舷倾斜沉没，包括指挥官在内的 64 名人员牺牲。


    在解决 `Piet Hein` 号后，`Asashio` 向北进入美军驱逐舰。美军驱逐舰的指挥官们已决定放弃通过海峡向北前进的命令，转而向东行驶。`Asashio`
    和 `Oshio` 在 `2300hrs` 之前重新发现目标，并在探照灯的帮助下对美军舰进行了猛烈火力。美军延迟还击以确保这两个目标不是荷兰巡洋舰，然后用火炮和鱼雷与日本人交战。双方均未命中。日人在烟幕中丢失了美军驱逐舰，到
    `2310hrs`，美军已向东南逃离。

