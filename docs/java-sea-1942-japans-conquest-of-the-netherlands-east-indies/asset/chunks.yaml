- fmt: '

    As Doorman’s Eastern Striking Force was being defeated, what became of the Allied
    Western Striking Force? The detachment of `Exeter`, `Perth`, and three destroyers
    left it with only three light cruisers (two obsolete) and three (two obsolete)
    destroyers. On February 26, an RAF aircraft spotted the Japanese invasion force
    some 100 miles north of Batavia. `Helfrich` ordered the Western Striking Force
    to sortie and engage it. The force departed that evening, under the tactical command
    of the skipper of `Hobart`, and after a half-hearted effort to intercept the Japanese,
    headed back to base on February 27 short of fuel. By this point, the fate of Java
    was clear, and the senior British naval officer on Java, Rear Admiral Arthur Palliser,
    decided that he did not want to sacrifice his ships in a futile defense. He persuaded
    `Helfrich` to agree to a withdrawal of his force if it was unable to find the
    Japanese. Accordingly, `Collins` crafted orders for his command to patrol in an
    area where no Japanese were operating until `0430hrs` on February 28, and then
    to depart for Ceylon by the Sunda Strait. Thankfully for the ships concerned,
    all but the Dutch destroyers were able to transit the Sunda Strait just before
    the arrival of the Japanese invasion force.


    The survivors of Doorman’s Combined Striking Force faced a very uncertain future.
    The two pincers of the Japanese invasion force were now located on both ends of
    Java, trapping `Perth`, `Houston`, and the Dutch destroyer `Evertsen` in Tanjong
    Priok. In Soerabaja, the American destroyer `Pope` had been joined by the other
    Allied survivors of the battle, including the damaged `Exeter`, Dutch destroyer
    `Witte de With`, the British `Encounter`, and Commander `Binford`’s four destroyers.


    ![../img/9781472831613Art003_battlescene.jpg](img/9781472831613Art003_battlescene.jpg)


    # DEATH OF DE RUYTER


    Approaching midnight, `Doorman` refused to break off the action. At this point,
    the Allied force consisted of only four cruisers, led by `Doorman`’s flagship
    `De Ruyter`. This scene shows `De Ruyter` steaming at high speed (1). The ship’s
    four 5.9in. turrets are trained to port and are elevated for long-range fire (2).
    The action was finally brought to an end by a salvo of `12 Type 93` torpedoes
    from `Nachi` and `Haguro`. From a range of 14,000 yards, the Japanese torpedoes
    headed toward the Allied cruiser column. `Doorman` was slow to respond to this
    threat. At `2336hrs`, a torpedo from `Nachi` hit `Java` which blew off the cruiser’s
    stern and caused her to sink with heavy loss of life some 15 minutes later. At
    about `2340hrs`, a single torpedo from `Haguro` hit `De Ruyter` aft (3). The `Type
    93` with its powerful warhead hit the starboard aft engine room as shown in this
    view. The ship lost power and coasted to a stop. Within 30 minutes, the captain
    ordered the crew to abandon ship. The starboard list increased until the ship
    sank some two and a half hours later. The torpedo hit on `De Ruyter` brought one
    of the longest surface battles of the Pacific War to an end.


    The perilous Allied situation meant the end to the fragile ABDA command structure.
    February 25 was ABDA’s final official day. Now the Allies began to pursue different
    objectives. `Helfrich` retained nominal control over all Allied naval ships in
    the region, and he clung to the increasingly unrealistic notion that Java could
    still be defended. He ordered all survivors to `Tjilatjap` on Java’s southern
    coast to fight on. On March 1, `Palliser` made clear his intention to order all
    British ships out of the region before they were destroyed. With no orders to
    withdraw the US Navy’s remaining ships, `Glassford` indicated to `Helfrich` that
    he would keep his ships under Dutch command.


    # THE BATTLE OF THE SUNDA STRAIT


    The first of a series of desperate battles fought by Allied ships seeking to flee
    the Java Sea was fought on February 28 in the Sunda Strait. `Houston` and `Perth`
    departed Tanjong Priok at `1900hrs` on February 28. `Evertsen`, also present,
    did not get underway until `2045hrs`. The three ships headed west to transit the
    Sunda Strait. But the Allies were too slow. The large Japanese invasion force
    had already arrived at `Bantam Bay`, which was at the northern entrance of the
    Sunda Strait. Despite their awareness of the presence of Allied warships in Batavia,
    Rear Admiral `Hara`, commander of the convoy screen, was not prepared for the
    two Allied cruisers coming from the east. The Japanese initial deployment placed
    only `Fubuki` to the east of the landing area. Light cruiser `Natori` with `Fubuki`-class
    destroyers `Hatsuyuki` and `Shirayuki` and three older `Kamikaze`-class destroyers
    were providing close escort. Heavy cruisers `Mikuma` and `Mogami`, and another
    `Fubuki`-class destroyer `Shikinami` were located 20 miles north of `Bantam Bay`.
    Further north in the Java Sea were heavy cruisers `Kumano` and `Suzuya`, two more
    `Fubuki`-class destroyers, and light carrier `Ryujo`. If the Japanese could concentrate
    their forces, the two Allied cruisers faced impossible odds. Making matters worse
    was the fact that `Houston` still had only some 300 8in. shells on board, and
    `Perth` only 160 6in. shells.


    ![../img/CAM344_053.jpg](img/CAM344_053.jpg)


    This Japanese wartime painting shows `Houston` under attack at the battle of the
    Sunda Strait. The Japanese destroyer in the foreground is one of the `Kamikaze`
    ships present and the crew is servicing the twin launchers. The image is fairly
    accurate in that the battle was a melee fought at close range. (US Naval History
    and Heritage)


    ![../img/9781472831613Map009.jpg](img/9781472831613Map009.jpg)


    ## Battle of Sunda Strait, February 28 to March 1


    The Japanese initial deployment was poor, and suggested they were already taking
    their enemy lightly following a string of victories. Only `Fubuki` was deployed
    to the east, even though the Japanese knew that two cruisers were located in Tandjongok
    earlier in the day. The ships best suited to handle this potential threat, the
    four heavy cruisers of `Kurita`’s Sentai 7`, patrolled north of the landing area.
    The ironic result was that the exhausted and low on ammunition Allied cruisers
    found themselves in an ideal position to attack a major invasion convoy just as
    it was in the process of landing troops. `Hara` was forced to scramble when first
    contact was reported on the two cruisers, but had the Allied ships been able to
    seize the opportunity, the result could have been disastrous for the Japanese.
    When the Japanese did react to the presence of the two cruisers, they responded
    in a chaotic way, sinking five of their own ships in the process and taking a
    considerable amount of time to finally sink the two intruders. On the surface,
    the result of the battle of the Sunda Strait indicated another Japanese victory,
    but in fact, the IJN’s performance was probably its worst of the war to date.


    The hopes of the Allied cruiser crews to make an undetected transit of the Sunda
    Strait were dashed when at `2239hrs` `Fubuki` spotted the Allied ships 11,000
    yards to the east. `Hara` reacted with `Natori`, `Hatsuyuki`, and `Shirayuki`.
    At `2248hrs`, `Natori` spotted two ships to the southeast. `Hara` decided the
    two ships were cruisers, so he called for additional reinforcements in the form
    of `Mikuma`, `Mogami`, and destroyers `Harukaze`, `Hatakaze`, and `Asakaze`. `Hara`
    further decided he would draw the two enemy cruisers away from the invasion convoy
    using `Natori` as a target before committing his two heavy cruisers. Meanwhile,
    `Fubuki` had assumed a trailing position some 3,000 yards behind `Houston`.


    As the various groups of Japanese ships converged on the two cruisers, the Allied
    ships never got an accurate picture of the size of the force they were facing.
    However, the ensuing fight was a melee fought at close range and in total confusion
    for both sides.

