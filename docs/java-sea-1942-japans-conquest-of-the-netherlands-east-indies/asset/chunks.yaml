    There were other Allied ships trying to flee from Java. One was destroyer Edsall,
    which had the misfortune of being sighted by the Kido Butai on March 1\. It took
    two battleships and two heavy cruisers, assisted by 17 dive-bombers, 84 minutes
    to sink the well-handled destroyer. Eight survivors were rescued, but all were
    beheaded at Kendari after being sent ashore. The following day, heavy cruiser
    Maya and two destroyers sank the British destroyer Stronghold and that evening,
    heavy cruisers Atago and Takao sank American destroyer Pillsbury southeast of
    Tjilatjap. In all, the Japanese sank or captured 20 Allied naval and merchant
    ships fleeing from Java Destroyers Whipple and Parrott, and lesser ships of the
    Asiatic Fleet successfully reached Australia. The naval campaign for the NEI was  over.


