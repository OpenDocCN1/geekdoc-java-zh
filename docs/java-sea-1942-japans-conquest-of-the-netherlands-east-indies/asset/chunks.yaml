    美国海军驻扎西太平洋的海军实力薄弱，在战役期间没有获得任何援军。除少数例外外，该舰队主要由易耗性舰只组成。其核心力量是三艘巡洋舰和 13 艘驱逐舰。唯一的潜在实力来源是该舰队的
    29 艘潜艇。然而，它们的船员缺乏经验，在战争爆发前的几个月里一直进行极其保守的战术训练。这些战术要求潜艇在潜水至深度 100 英尺时，仅依靠声纳方位执行鱼雷攻击。指挥官被禁止在潜望镜深度进行攻击，或暴露其潜望镜。此外还有鱼雷缺陷的问题，这进一步削弱了它们的效能。最致命的因素是指挥官缺乏攻击性，结合强调隐蔽而非进攻的战术，使得潜艇在战役中形同虚设。


    重巡`休斯顿号（Houston）是舰队的旗舰。她于 1930 年服役，是美国海军第一代“条约型”巡洋舰之一，拥有强大的主武器（九门 8 英寸口径），但与日本海军的重巡洋舰相比，装甲防护不足。舰配备了由八门
    5 英寸/25 口径炮组成的强大防空炮群，以及四座新安装的 1.1 英寸四联装炮座。美国海军的重巡洋舰不携带鱼雷。2 月初旬，`休斯顿号`受损，导致后方 8
    英寸炮塔失效，被迫在战役的剩余时间内失去该炮塔进行战斗。舰队还分配了两艘轻巡洋舰。`波伊斯号（Boise）`是一艘布鲁克林级巡洋舰，是该舰队中最现代的资产。她满载排水量
    12,207 吨，比大多数条约型重巡洋舰都要大。她的主武器由 15 门 6 英寸炮组成；每门每分钟可发射十枚。她装甲良好，配备了与`休斯顿号`相当的防空设备。`大理石头号（Marblehead）`是一艘奥马哈级轻巡洋舰。她于
    1924 年服役，其薄弱的装甲和十门 6 英寸单装炮过时的主武器布局使其不适合前线任务，因此被分配到了亚洲舰队。


    ![../img/CAM344_028.jpg](img/CAM344_028.jpg)


    `休斯顿号`是一艘诺福克郡级重巡洋舰，于 1930 年服役。注意该舰的两个根大桅杆、三座 8 英寸三联炮塔（前两座后一座）以及两根烟囱之间的航空设施。与日本海军的重巡洋舰相比，她的武器和防护均不足。（美国海军历史与遗产司令部）


    ![../img/CAM344_029.jpg](img/CAM344_029.jpg)


    轻巡洋舰`波伊斯号`于 1941 年 11 月初在夏威夷海外拍摄，采用了“1 号措施”迷装方案。注意其由五座三联炮塔的 15 门 6 英寸炮组成的强力主武器。在
    1942 年初，她是世界上最强大的轻巡洋舰之一，拥有与日本海军重巡洋舰相当的战斗力和防护能力。由于在未标记的礁石上搁浅而被迫退出东印度群岛战役，该舰及时返回参加参加瓜达加纳尔战役，并在
    10 月的埃望角海战中受损。再次修理后，她参加了地中海的西西里和萨莱诺入侵行动。1943 年底回到太平洋后，她的最后一次主要行动是 1945 年入侵波尔尼岛。（美国海军历史与遗产司令部）


    该舰队的驱逐舰均追溯到美国海军第一次世界大战建造计划。这些满载 1,200 吨的舰只服役时配备四门 4 英寸/50 口径炮和 12 根 21 英寸鱼雷管。美国海军驱逐舰的鱼雷是`Mark
    8`。它们面临可靠性问题，在 26 节时的最大射程为 16,000 码。到太平洋战争开始时，这些舰只保留了同样的武器，仅增加了一门完全不够用的 3 英寸单炮和三到四门.50
    口径机枪用于防空。服役时速度可达 33–34 节，但到 1941 年它们勉强达到 28–30 节。战役结束时，鱼雷供应日益短缺。在爪哇海，某些驱逐舰仅携带了六枚鱼雷。


    ![../img/CAM344_030.jpg](img/CAM344_030.jpg)


    轻巡洋舰`大理石头号`在此战前照片中显示在战争爆发初被分配给亚洲舰队。注意其前方 6 英寸炮的过时布局：一座双联炮塔和四门布局笨拙的�舱炮。奥马哈级轻巡洋舰专为侦察设计，空间狭窄、防护差，在太平洋战争开始时被认为是二流水平。在
    1942 年 2 月受损修理后，`大理石头号`在战争剩余时间内主要在南大西洋作业寻找轴心国的破冰者。（美国海军历史与遗产司令部）


    ![../img/CAM344_031.jpg](img/CAM344_031.jpg)


    驱逐舰辅助舰`黑鹰号（Black Hawk）`约于 1936 年停泊在中国福，旁边有六艘驱逐舰。该辅助舰是一艘改装的商船，于 1922 年分配给亚洲舰队，并一直留在那里直到战争爆发。亚洲舰队的驱逐舰于
    20 世纪 20 年代分配给舰队，并留在远东在菲律宾的卡维地海军造船厂进行维护。（美国海军历史与遗产司令部）


    ![../img/CAM344_033.jpg](img/CAM344_033.jpg)


    驱逐舰`帕罗特号（Parrott）`1928 年 11 月在关门附近航行。她于 1925 加入亚洲舰队。亚洲舰队的平甲板驱逐舰基本上是短程鱼雷艇，反潜和防空能力极小。（海军历史与遗产司令部）整个舰队在最可能执行的行动类型上训练不足。例如，驱逐舰没有进行过夜战斗训练。由于舰队中几乎所有舰只年龄过大且缺乏备件，维护也是一个现实问题。


