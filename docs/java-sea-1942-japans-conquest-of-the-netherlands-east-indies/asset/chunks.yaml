    日本军的炮术水平同样令人失望。战前理论要求远距离射击，因为日本人认为他们可以在敌人攻击范围之外造成毁灭性打击。在战前的演习中，他们评估认为 6%的`8in.`弹药可以在远距离命中。事实证明这是极度乐观的，因为在爪哇海海战中，1619
    枚`8in.`弹药中仅有 5 枚命中目标。正如`Type 93`鱼雷的情况一样，低命中率由于命中的弹药中有一枚对战斗结果起到了决定性作用而有所缓解。`中学`号和`级津`号轻巡洋的炮术表现同样糟糕，221
    发`5.5in.`弹药中仅有一发命中。驱逐舰的炮术稍好一些，因为它们是在较近距离进行的。在消耗的 515 发`5in.`弹药中，有若干发命中`Electra`号并导致其沉没。在对`Exeter`号的战斗中也有类似的表现。在发射的
    1171 枚`8in.`弹药中，有两次命中。在发射的 35 枚鱼雷中，仅有一枚命中。


    ![../img/CAM344_060.jpg](img/CAM344_060.jpg)


    日本人利用这张巴厘巴板炼油厂的战照片，夸耀他们的工程师如何修复荷属东印度（NEI）炼油厂。事实上，荷兰人对这些关键设施的破坏并不彻底，日本人迅速恢复了生产。（美国海军历史与遗产司令部）


    联合打击队未能阻止日本入侵军，意味着日本人能够在 2 月 28 日和 3 月 1 日在爪哇岛三个地点登陆。荷兰人试图围堵登陆的尝试是徒劳的。到 3 月 8
    日，泗水被攻占，第二天位于爪哇岛的荷兰军队投降。随着 3 月 28 日苏门答腊荷兰军队的投降，整个荷属东印度全部落入日本人手中。日本人成功实现了他们战争初期最重要的目标。爪哇岛和苏门答腊的油田很快恢复了。这些油田足以日本日本战时需求，但随着战争持续，日本人越来越无法将石油或精炼产品运回本土。在整个战争期间，爪哇岛和荷属东印度的大部分地区一直处于日本人手中。


    ## 参考文献及延伸阅读


    在英文出版物中，荷属东印度战役曾被人们遗忘。然而，近年来出版了许多新书，这些书在很大程度上弥补了这一缺陷。其中有几本书大量使用了荷兰语资料。最重要的是，全
    102 卷的《战史丛》（`Senshi Sosho`——日本的“官方”战争史）中涉及入侵荷属东印度的两卷已翻译成英文。这是该系列首次有卷册被完整翻译成英文。


