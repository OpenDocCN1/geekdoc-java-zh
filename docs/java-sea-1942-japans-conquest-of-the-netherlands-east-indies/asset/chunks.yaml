    The fate of Prince of Wales was certain. A 1,100-pound bomb hit was scored by
    the last group of `G3Ms` to attack. The bomb penetrated the main deck where it
    exploded causing severe casualties. The battleship continued to settle and at
    `1315hrs`, the crew was ordered to abandon ship. Five minutes later the ship capsized
    to port with the loss of 327 of her crew. In return for this brilliant attack,
    the Japanese lost three aircraft and 21 aircrew. The destruction of `Force Z`
    removed the only significant Allied naval force in Southeast Asia. With British
    naval power crippled and American air power in the Philippines neutralized, the
    only force left to prevent a Japanese invasion of the NEI was a scratch joint
    force of American, Australian, British and Dutch surface combatants. Its ability
    to defend the NEI would soon be tested.


    # CHRONOLOGY


    ## 1941


    ### December 8

    Japanese conduct landings at `Kota Bharu`, `Malaya` and at `Singora` and `Patani`,
    `Thailand`.


    ### December 10

    `Force Z` destroyed by Japanese land-based aircraft.


    ### December 16

    Japanese land at `Miri`, `British Borneo`.


    ## 1942


    ### January 10

    `ABDA Command` established.


    ### January 11

    Japan declares war on `NEI`.

    Japanese land at `Menado`, `Kema`, and `Bangka Roads` in the `Celebes`.


    ### January 12

    Japanese occupy `Tarakan`, `Dutch Borneo`.


    ### January 23

    Japanese land at `Balikpapan`, `Dutch Borneo`.


    ### January 24

    `US Navy` destroyers conduct raid on `Balikpapan` invasion force.

    Japanese occupy `Kendari` in the `Celebes`.


    ### January 3

    Japanese occupy `Ambon Island`.


    ### February 2

    `ABDA Strike Force` established.


    ### February 4

    Battle of the `Makassar Strait`.


    ### February 14–17

    Battle of the `Bangka Strait`.


    ### February 15

    Singapore surrenders.

    Japanese capture `Bangka Island` and `Palembang`, `Sumatra`.


    ### February 16

    Japanese occupy `Bandjermasin`, `Dutch Borneo`.


    ### February 18

    Japanese occupy `Bali`.


    ### February 19

    Battle of the `Badoeng Strait`.

    Japanese carrier force conducts raid on `Port Darwin`, `Australia`.


    ### February 20

    Japanese land on `Timor Island`.


    ### February 27–March 1

    Battle of the `Java Sea`.


    ### February 28–March 1

    Battle of the `Sunda Strait`.


    ### March 8

    `NEI` Surrenders.


    ### March 28

    Japanese complete occupation of `Sumatra`.


    # OPPOSING COMMANDERS


    ## JAPANESE COMMAND STRUCTURE AND COMMANDERS


    The `Combined Fleet`, which controlled all the `IJN`’s important elements, was
    commanded by `Admiral Yamamoto Isoroku`. He may have been one of the few senior
    Japanese command figures who clearly foresaw the outcome of a war between the
    `United States` and `Japan`, but he was fully onboard for a war of aggression
    in Southeast Asia and made no attempt to address the probably dubious assumption
    that an attack against British and Dutch colonies would bring the `United States`
    into the war. His `Pearl Harbor` attack guaranteed that the `United States` would
    enter the war and foreclosed the possibility of a negotiated peace. Yamamoto’s
    meddling late in the `NEI` campaign presented the weak Allied naval forces with
    an opportunity they were unable to exploit.


    Yamamoto allocated the bulk of the `Combined Fleet` to conduct the campaign in
    Southeast Asia. Given the name `Southern Expeditionary Force`, it was commanded
    by `Vice Admiral Kondo Nobutake`. In peacetime, he was the commander of the `Second
    Fleet`. By all accounts, he was a capable and aggressive commander. His success
    in leading the Southeast Asia campaign led to future important assignments until
    his failure at `Guadalcanal`. After `Guadalcanal`, he was never given another
    seagoing command.


    ![../img/CAM344_018.jpg](img/CAM344_018.jpg)


    Admiral Yamamoto oversaw the `NEI` campaign as `Commander in Chief` of the `Combined
    Fleet`. With such a Japanese preponderance of force, there was little doubt that
    the operation would be successful. However, his dubious decisions late in the
    campaign presented the Allies with potential opportunities to inflict local defeats
    on the Japanese. (US Naval History and Heritage Command)


    ![../img/CAM344_019.jpg](img/CAM344_019.jpg)


    Vice Admiral Kondo was a trusted and capable commander who was given the responsibility
    for conducting the invasions of `Malaya` and the `NEI`. He was a member of the
    `IJN`’s “big-gun” club with a background primarily in cruisers and battleships.
    His success in Southeast Asia led to other important assignments later in 1942.
    (US Naval History and Heritage Command)


    ![../img/CAM344_022.jpg](img/CAM344_022.jpg)


    Rear Admiral Tanaka was one of the `IJN`’s most accomplished destroyer commanders.
    His fighting career began in the `NEI` campaign, but he went on to greater success
    during the `Guadalcanal` campaign. (US Naval History and Heritage Command)


    ![../img/CAM344_020.jpg](img/CAM344_020.jpg)


    Rear Admiral Nishimura commanded one of the `IJN` destroyer squadrons in the `NEI`
    campaign. As such, he was given command of some of the many invasion operations
    at various points in the campaign. During the invasion of `Balikpapan`, he was
    responsible for overseeing the only Japanese naval defeat of the campaign. (US
    Naval History and Heritage Command)


    The two pincers of the Japanese attack on the `NEI` were commanded by vice admirals.
    The `Eastern Force` was under the direction of `Vice Admiral Takahashi Ibo`. Takahashi
    is little known among the `IJN` admirals of the Pacific War, but began the war
    as the commander of the `Third Fleet`. Following his lackluster performance in
    the `NEI`, he remained in the region as `Commander of Southwestern Fleet` until
    November 1942 after which he was relegated to lesser commands. He was arrested
    by American authorities in December 1945 as a war criminal.


    Takahashi’s Eastern Force included powerful elements like Rear Admiral Takagi
    Takeo’s Sentai 5. Takagi had a background in cruisers and battleships and had
    assumed flag rank in 1938, taking command of `Sentai 5` in September 1941. He
    commanded the `Eastern Force`’s covering force throughout the `NEI` campaign.
    At `Java Sea`, he was responsible for a sloppy force disposition which showed
    a lack of regard for the enemy, though overconfidence among Japanese admirals
    was not limited to Takagi. Following the conquest of the `NEI`, he commanded the
    `Striking Force` for the `Coral Sea` operation, which resulted in a Japanese defeat,
    and then participated in the disastrous `Midway` operation in June 1942. In June
    1943, he was given command of the `IJN`’s submarine command, the `Sixth Fleet`.
    When the Americans invaded `Saipan` in June 1944, Takagi was caught on the island
    and killed in action.


    The `Eastern Force` was assigned two destroyer squadrons whose commanders were
    given command of invasion convoys during the campaign. Rear Admiral Tanaka Razio
    commanded `Destroyer Squadron 2`. Tanaka went on from the `NEI` campaign to gain
    greater fame as a destroyer commander in the `Guadalcanal` campaign where he performed
    well, especially at the battle of `Tassafaronga` in November 1942. Ironically,
    he was held in higher esteem by the US Navy than by theIJN` and, after being wounded
    in December 1942 when his flagship was sunk on a resupply mission, he was removed
    from command probably because of his pessimistic comments regarding the course
    of the campaign. Even though he was later promoted to vice admiral, he was never
    given another important command. Rear Admiral Nishimura Shoji commanded `Destroyer
    Squadron 4`. He had a poor record during the war and is mostly known for his last
    battle, when he commanded a force of old battleships during the battle of `Leyte
    Gulf` during which he was killed. His background was mostly in destroyers, and
    he assumed command of `Destroyer Squadron 4` on May 1, 1940. His performance during
    the `NEI` campaign was spotty, but he retained his command at `Midway` and later
    commanded heavy cruisers at `Guadalcanal`.


    ![../img/CAM344_021.jpg](img/CAM344_021.jpg)

