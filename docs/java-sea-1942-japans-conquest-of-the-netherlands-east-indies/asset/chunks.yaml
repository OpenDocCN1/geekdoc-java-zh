    The destruction of `Kortenaer` and the increasing effectiveness of Japanese cruiser
    gunnery threw `Doorman`s force into chaos. In the first hour of the battle, the
    two Japanese heavy cruisers fired 1,271 8in. rounds. Eventually, this weight of
    fire would score. In addition to the initial hit on `De Ruyter`, which was a dud,
    another shell hit `Houston` at 1706hrs – it was also a dud. The next hit at 1708hrs
    was on `Exeter` and was probably the most important of the entire battle. The
    shell, probably from `Haguro`, penetrated to a boiler room and exploded. The final
    effect was to force six of the ship’s eight boilers off line, which reduced speed
    to 11 knots and temporarily knocked out power to the main battery. To avoid a
    collision with the cruisers behind him, `Exeter`’s captain ordered the cruiser,
    now billowing smoke, to make an immediate turn to port. The following three cruisers
    followed suit, since they thought they had missed a signal from `De Ruyter` which
    was leading the column. The Allied column disintegrated; `De Ruyter` continued
    toward the Japanese and `Perth` laid a smokescreen to cover the wounded `Exeter`.
    `Doorman` was forced to turn his flagship around to reorganize his force. To give
    him the time he needed, he ordered the three British destroyers to execute a torpedo
    attack.


    ![../img/CAM344_006.jpg](img/CAM344_006.jpg)


    `Haguro` was the undisputed star performer of the battle of the Java Sea. She
    was responsible for hitting the British heavy cruiser `Exeter` with an 8in. shell
    which put her out of action, then torpedoing Dutch destroyer `Kortenaer`. In the
    final phase of the battle, she hit `De Ruyter` with a torpedo that led to her
    sinking which brought the battle to a close. `Haguro`’s long wartime career was
    brought to an end in the Malacca Strait on May 16, 1945 at the hands of British
    destroyers. (Yamato Museum)


    ![../img/CAM344_076.jpg](img/CAM344_076.jpg)


    First blood in the battle of the Java Sea was the torpedoing of destroyer `Kortenaer`.
    The `Type 93` hit amidships broke the ship in two, and both halves were vertical
    within 90 seconds. The stern section sank at once, but the bow section did not
    sink for another five minutes, giving the crew time to get into the water. Of
    the 153 men in the crew, 115 survived the torpedoing. (Netherlands Institute for
    Military History)


    It took until 1725hrs for `Doorman` to reestablish control. `De Ruyter` led the
    other cruisers, less `Exeter`, and the four American destroyers to the northeast.
    Twenty minutes later, the reduced Allied force was headed north and emerged from
    the smoke to find itself in more trouble. `Takagi` was kept informed of the plight
    of `Doorman`s force by his floatplanes, which remained up for almost the entire
    battle. `Takagi` decided to press the attack on the Allied force, which looked
    to be in utter disarray. To finish the Allies off, he ordered another massed torpedo
    attack. This barrage totaled an amazing 98 torpedoes, with their primary target
    being `Exeter`. The attack was launched from various ranges – `Nachi` and `Haguro`
    contributed eight each from 27,000 yards at 1754hrs; `Naka` launched four at 1750hrs
    from 18,500 yards; and `Jintsu` launched four from 20,000 yards at 1754hrs. The
    eight destroyers of `Destroyer Squadron 2` closed to 15,000 yards before each
    launched a full salvo. Four of the destroyers from `Nishimura’s Destroyer Squadron
    4` launched their full loads at 1804hrs after closing to 10,000 yards. `Nishimura’s`
    last two destroyers, `Asagumo` and `Minegumo`, closed to 6,500 yards before one
    launched, with the other being unable to get a firing solution. Amazingly, none
    of these 98 weapons hit their target. The second massed Japanese torpedo attack
    was a complete failure.


    As the Japanese destroyers closed for their attack, the three British destroyers
    emerged from the smoke. `Electra` was in front and was soon engaged with `Tanaka’s
    Destroyer Squadron 2`. `Electra`’s veteran crew fought well against heavy odds.
    The British destroyers hit `Tanaka’s` flagship with a 4.7in. shell which killed
    one and wounded four. `Encounter` followed `Electra` out of the smoke, and immediately
    took `Jintsu` under fire. `Nishimura’s` lead destroyers `Asagumo` and `Minegumo`
    were the closest to the British ships; `Encounter` and `Minegumo` exchanged fire
    at short range between 1800 and 1810hrs with the Japanese ship taking minor damage.
    Meanwhile, `Electra` was busy engaging `Asagumo`. The British ship put a shell
    into `Asagumo’s` engine room from 5,000 yards, which killed four and wounded 19
    and brought the Japanese ship to a temporary halt. `Electra`’s luck did not hold.
    `Asagumo` hit the British ship first on her bridge, and then in a boiler room
    which caused a loss of power. `Minegumo` then finished off the powerless `Electra`,
    which sank at 1816hrs. Only 54 of her crew survived, and these were rescued by
    an American submarine the following day.


    ![../img/9781472831613_Map005.jpg](img/9781472831613_Map005.jpg)


    ### Battle of the Java Sea: Second Phase


    In the opening phases of the battle, `Doorman’s` force had suffered minimal damage
    from the two torpedo attacks, but Japanese had crippled `Exeter` and `Electra`.
    Most importantly, the Allied force made no progress getting to the convoy. Since
    `Exeter` could not exceed 15 knots, even after the best efforts of her engine
    crew, `Doorman` ordered her to return to `Soeraja` with `Witte`. With darkness
    approaching, `Doorman` needed to break contact with the Japanese to find a new
    path to attack the convoy. With the Japanese floatplanes providing constant updates
    to `Takagi`, it appeared unlikely that `Doorman` could find an opening. After
    re-forming cruiser force with `De Ruyter`, `Perth`, ` ``, and `Java`, he headed
    to the east and placed his force between the Japanese and `Exeter`. In spite of
    his unfavorable situation, `Doorman` sent an order to the four destroyers to attack
    at 1806hrs. This order was quickly cancelled, but the Americans were subsequently
    ordered to lay smoke, and finally to cover `Doorman’s` retirement. Thoroughly
    confused, the officers on the flagship `John D. Edwards` decided to make a torpedo
    attack. Unwilling to get too close to `Nachi` and `Haguro`, the four-stackers
    headed toward the Japanese at 28 knots launched 20 torpedoes from their starboard
    tubes, and then reversed course and fired 21 port-side torpedoes. The torpedoes
    were launched at ranges of 10,000–13,000 yards, near maximum range for `Mark 8`.
    `Takagi` cautiously decided to turn his cruisers to the north; all of the torpedoes
    missed.


    ![../img/CAM344_076.jpg](img/CAM344_076.jpg)


    This is light cruiser `Perth` in a pre-war photograph. Along with sister ships
    `Hobart` and `Sydney`, these were well-balanced and modern ships. However, they
    were outclassed by the IJN’s much larger and more powerful heavy cruisers. (Netherlands
    Institute for Military History)


    ![../img/9781472831613_Map006.jpg](img/9781472831613_Map006.jpg)


    ### Battle of the Java Sea: Third Phase (1750–1820hrs)


    ![../img/CAM344_008.jpg](img/CAM344_008.jpg)


    `Naka`, shown here after being torpedoed on April 1, 1942 by US Navy submarine
    `Seawolf` off Christmas Island, served as Rear Admiral `Nishimura’s` flagship
    during the NEI campaign. She missed the battle of Balikpapan because of `Nishimura’s`
    poor force deployment, but did participate in the battle of the Java Sea. She
    was sunk later in the war in February 1944, during the US Navy’s massive carrier
    raid on IJN forces at Truk Atoll. (Yamato Museum)

