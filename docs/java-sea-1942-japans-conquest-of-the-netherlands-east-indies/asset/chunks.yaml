    The British naval contingent included several light cruisers. The best were two
    modified Leander-class light cruisers, `Hobart` and `Perth`, which were transferred
    to the Royal Australian Navy in 1938 and 1939, respectively. Both were veteran
    ships, with `Perth` in particular establishing a fine war record in the Mediterranean
    from 1940 to 1941. Both ships carried eight 6in. guns and eight 21in. torpedo
    tubes, but were poorly protected. Two D-class cruisers, `Dragon` and `Danae`,
    were also available, but dated from 1918 and were unsuited for front-line duties.
    Both carried six 6in. guns in single mounts and 12 21in. torpedo tubes.


    ![../img/CAM344_042.jpg](img/CAM344_042.jpg)


    `Perth` was originally commissioned as `HMS Amphion` in 1936 and transferred to
    the Royal Australian Navy in 1939. Armed with eight 6in. guns, eight 4in. guns,
    and eight 21in. torpedo tubes, `Perth` was a balanced cruiser design which had
    an active and fine war record in the Mediterranean Sea earlier in the war. Superior
    to Japanese light cruisers, she was overwhelmed at the battle of the Sunda Strait.
    In 2013, it was revealed that the wreck had been stripped of many of its parts
    with scrappers using explosives to break up the ship. (US Naval History and Heritage
    Command)


    The small number of British destroyers available was a mixed lot. Three E-class
    ships were commissioned in 1934. `Electra` and `Express` came to the Far East
    as escorts for `Prince of Wales` and `Encounter` was detached from the Mediterranean
    Fleet. These ships displaced around 1,500 tons, making them smaller than all modern
    Japanese destroyers. Each carried four single 4.7in. guns and eight 21in. torpedo
    tubes and all were veteran ships. `Electra` survived the campaign because she
    was damaged when she was rescuing survivors from `Prince of Wales` on December
    10 and was forced to leave the area and go to Ceylon during the first part of
    February. `Jupiter`, also detached from the Mediterranean Fleet, was commissioned
    in 1939 and possessed a heavier armament of three twin 4.7in. mounts and ten 21in.
    torpedoes in quintuple mounts. She had already bloodied the Japanese by sinking
    submarine `I-60` on January 17, 1942. In addition, several 1,220-ton full load
    S-class destroyers were assigned to the Eastern Fleet. Commissioned between 1918
    and 1919, they carried three 4in. guns and four torpedo tubes. The principal British
    destroyer torpedo at this point of the war was the `Mark IX`, with a maximum range
    of 15,000 yards at 35 knots.


    ![../img/CAM344_043.jpg](img/CAM344_043.jpg)


    This is D-class light cruiser `Danae` photographed before the war. Note the individual
    6in. gun mounts and two port-side triple torpedo mounts. Commissioned in 1918,
    `Danae` was obsolescent by the start of the Pacific War. Assigned to convoy escort
    duty and then the Western Striking Force, the two D-class cruisers never had a
    chance to engage the Japanese. (US Naval History and Heritage Command)


    #### The Royal Netherlands Navy


    Dutch naval forces in the NEI were not prepared for the start of the war. Three
    cruisers were in commission, but all were outclassed by their foreign counterparts.
    The most modern ship, `De Ruyter`, was launched in 1935 and armed with seven 5.9in.
    guns. She carried no torpedoes, had an inadequate antiaircraft battery and was
    lightly armored. `Java`, launched in 1921, was based on the design of World War
    I cruisers and carried a main battery of ten 5.9in. guns, all single mounts, of
    which only seven could be broadside. `Tromp` was only 4,215 tons full load, indicating
    she was designed as a destroyer flotilla leader; In addition to the cruisers,
    the Dutch had seven destroyers in commission. They were all of the same class,
    based on a British design, and were constructed in the Netherlands beginning in
    1925. Each carried four 4.7in. guns in single mounts and six torpedo tubes. The
    standard Dutch torpedo was a 21in-built weapon with a maximum range of 10,936
    yards at 28 knots. The Dutch also operated 15 submarines in the NEI. Most were
    dated from the 1920s. All of the Dutch units suffered from maintenance and personnel,
    since parts could not be acquired from the Netherlands and repair facilities in
    the NEI were inadequate to keep the fleet ready. One destroyer, `Witte de With`,
    lacked crew. When `Van Ghent` ran aground and was scuttled, her entire crew was
    moved to `Witte de With`, but the destroyer was not available until February.
    In general, Dutch training was not robust, but they did emphasize night combat.
    No Dutch ship carried radar.


    ![../img/CAM344_073.jpg](img/CAM344_073.jpg)


    `De Ruyter` was the most powerful unit in the RNN East Indies Squadron but was
    a thoroughly inferior cruiser design in terms of firepower, protection, and speed.
    Two of the ship’s twin 5.9in. turrets can be seen in this view; in total, seven
    5.9in. guns were carried. No heavy antiaircraft guns were carried; the cluster
    of five twin 40mm mounts can be seen forward. The main belt was only fitted with
    two inches of armor. Maximum speed was a mediocre 32 knots. When matched against
    Japanese heavy cruisers, the result was predictable. (Netherlands Institute for
    Military History)


    ![../img/CAM344_067.jpg](img/CAM344_067.jpg)


    Dutch light cruiser `Java` shown in this pre-war photograph. Her design was based
    on World War I light cruisers, as is evident in this view. Note the individual
    5.9in. gun mounts. (Netherlands Institute for Military History)


    ![../img/CAM344_037.jpg](img/CAM344_037.jpg)


    `Tromp` was originally authorized as a destroyer flotilla leader in 1931 but was
    completed as a small light cruiser. The ship was relatively heavily armed with
    six 5.9in. guns and six 21in. torpedo tubes on a standard displacement of only
    3,450 tons. She survived the war and was present at the Japanese surrender in
    the NEI in September 1945. (US Naval History and Heritage Command)


    ![../img/CAM344_069.jpg](img/CAM344_069.jpg)


    `Witte de With` was a member of the four-ship `Van Galen` class commissioned between
    1929 and 1931. These ships were modified from the previous four ships of the `Van
    Ghent` class with the addition of four 40mm antiaircraft guns, which replaced
    one of the previous class’s 75mm mounts. Though this was a fairly heavy antiaircraft
    fit for the period, it would prove totally inadequate for the air threat faced
    during the NEI campaign. (Netherlands Institute for Military History)


    ![../img/CAM344_068.jpg](img/CAM344_068.jpg)


    Destroyer `Kortenaer` photographed before the war. The Dutch destroyers were larger
    and more capable than the US Navy’s flush-deck destroyers, but were far inferior
    to the IJN’s modern destroyers in terms of firepower. `Kortenaer` was lost to
    a Japanese torpedo at the battle of the Java Sea. (Netherlands Institute for Military
    History)


    Dutch naval bases on Java were the primary facilities used by Allied naval forces
    during the campaign. The primary base was at `Soerabaja`, which was located on
    Java’s northeast coast. It had modern facilities including a 15,000-ton drydock.
    `Tandjong Priok`, the port for Batavia, was located on northwest Java. This was
    a commercial port, not a naval base. The only base on Java’s southern coast was
    `Tjilatjap`, which became increasingly important during the campaign for funneling
    reinforcements into Java. The port contained few facilities, but in December the
    Dutch moved an 8,000-ton floating drydock there to at least provide some repair
    capability. None of these bases possessed adequate air defenses.


    ![../img/CAM344_063.jpg](img/CAM344_063.jpg)


    This picture was taken on February 1, 1942 from the lookout tower of the naval
    base at `Soerabaja`. A `RNN` minesweeper is exiting the base through the channel.
    `Soerabaja` was the primary naval base on Java and the center of ABDA naval operations.
    (Netherlands Institute for Military History)


