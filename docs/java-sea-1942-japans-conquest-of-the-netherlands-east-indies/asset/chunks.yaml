    日本东方军的持续推进，以及哈特不断敦促拉斯福德与日军作战，使得海战变得不可避免。1 月 22 日，一架美国飞行艇发现了一支在重兵护卫下的大型日本运输队，正朝巴厘巴板进发。哈特再次命令`第
    5 特遣队`交战。此时，`Houston`和两艘驱逐舰已恢复了护卫任务，受损的`Boise`正驶离该区域，而`Marblehead`正面临涡轮机故障，导致速度被限制在
    15 节。并非`第 5 特遣队`最初由三艘巡洋舰和八艘驱逐舰组成的强大编制，最近的美国单位是位于保罗·H·塔尔博特指挥指挥下的`第 5 驱逐队`四艘驱逐舰。这些舰船于
    1 月 23 日早晨开始向北移动。当天的天气和海况不佳，使得美国人能够在未被察觉的情况下接近目标。塔尔博特计划在黎明前两小时对锚泊的日本入侵军发动奇袭。他命令他的驱逐舰先发射鱼雷；在鱼雷耗尽后再进行射击。`Marblehead`和一艘驱逐舰被命令向北，掩护驱逐舰的撤退。


    ![../img/CAM344_036.jpg](img/CAM344_036.jpg)


    这张战前照片显示了水兵正在平直甲板驱逐舰上的联装鱼雷发射器工作。这些发射器发射的是`Mark 8`鱼雷，其起源于第一次大战，是战争初期平驱逐舰的标准配置。它充满了可靠性问题，例如潜深过大以及击中目标后不爆炸。这使得亚洲舰队驱逐舰的任何成功都是非同寻常的，比如巴厘巴板的袭击中，尽管使用了这种武器，仍击沉了五艘日本军舰。（美国海军历史与遗产司令）


    等待这四艘美国驱逐舰的是由西村指挥的一支实力强大得多的力量。入侵军载于 15 艘运输船上，由`第 4 驱逐队`、轻型巡洋舰“中号”和十艘驱逐舰护卫。提供近程护卫的是三艘巡逻艇（原“见”级驱逐舰，拆除了鱼雷管但仍配备了两门`4.7
    英寸`火炮）、四艘扫雷舰（每艘配备两门`4.7 英寸`火炮）和三艘反潜艇。1 月 24 日晚，一艘运输船被荷兰飞机击中后被遗弃。剩下的 14 艘运输船于`2015
    时`到达巴厘巴板外并排排锚泊。午夜前，一艘荷兰潜艇向“中号”发射了四枚鱼雷；这些鱼雷落空但击中了另一艘运输船。当美国驱逐舰接近目标时，西村将“中号”和他的驱逐舰部署在运输队西侧，三艘巡逻艇部署在南方，四艘扫雷舰部署在北方。


    美国驱逐舰以 27 节的速度扫入锚地。锚泊的运输船在岸上被荷兰人点燃的设施火光的映下形成了剪影。几艘日本舰发现了美国驱逐舰，但没有一艘发出正式的警报。在`0300
    时`前的几分钟里，扫雷舰`W15`发现了接近的美国人。起初，他们将其误认为是“中号”，因为“中号”也有四个烟囱。在日本军船交战之前，这四艘驱逐舰已消失在夜色中。美国人识别出该扫雷舰是一艘驱逐舰，其中三艘驱逐舰向该舰发射了总共七枚鱼雷，但角度不利，无一枚命中。


    塔尔博特命令他的四艘驱逐舰调头，对锚泊的运输队发动了另一轮猛攻。在这一动作进行期间，`Parrott`向队中最中最靠岸的一线北端运输船发射了三枚鱼雷。至少有一枚鱼雷击中了载有弹药的“寿丸丸”。随后的爆炸导致了该运输船以及除九名船员以外的所有人员的丧生。


    当塔尔博特的部队向南航行时，`John D. Ford`和`Pope`均向巡逻艇`P38`发射了一枚鱼雷。几分钟后的`0306 时`，`Pope`发现了一组船只并发射了五枚鱼雷，随后`Parrott`和`Paul
    Jones`各发射了一枚。这些鱼雷击中了运输船“龙丸丸”。`0314 时`，美国纵列向右转以攻击锚地的南部。`John D. Ford`向左舷一处被确认为是驱逐舰的目标发射了一枚鱼雷；随后在`0319
    时`，`Pope`向左舷的另一艘“驱逐舰”发射了五枚鱼雷，`Parrott`发射了三枚鱼雷。这八枚“鱼雷”中有三枚击中了 985 吨的`P37`号，其沉没并导致
    35 人遇难。`Paul Jones`向附近的“仓竹丸丸”发射了二枚鱼雷，第二枚在`0325 时`击中目标。


    塔尔博特继续在锚地内进行大肆冲杀，尽管他有两艘驱逐舰已经耗尽了鱼雷。现在`Pope`和`Parrott`开始使用它们的`4 英寸`火炮，并声称对运输船和“驱逐舰”造成多次命中。直到此时，美国纵列仍保持着凝聚力，在烟雾和混乱中更容易锁定目标。然而，在`0340
    时`，塔尔博特的旗舰`John D. Ford`失去了与其他三艘驱逐舰的联系，后者已向南离开了战斗区域。`John D. Ford`仍有鱼雷，并于`0346
    时`向“鹤丸丸”发射了最后两枚。这就是在四小时前被荷兰潜艇击中的那艘运输船；美国鱼雷完成了最后的击杀。随后，`John D. Ford`继续近距离用`4 英寸`火炮猛击另外两艘运输船。尽管受损，但两艘均未沉没。`0410
    时`，`John D. Ford`也向南航行。

