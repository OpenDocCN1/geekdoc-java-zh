    需要注意的是，尽管进攻东南亚的行动分配了大部分`联合舰队`（Combined Fleet）战斗舰，但还有其他行动也需要`联合舰队`的大部分。其中最重要的是`机动部队`（Kido
    Butai），它被分配用于珍珠港行动，随后短暂支持了南太平洋行动，然后投入支持`荷属东印度群岛`（NEI）战役。日本海军（IJN）战舰被留在本土水域作为战略预备队，但第
    3 战队（Sentai 3）中包含两艘`长龙`级战舰的部分被分配给了`南方远征军`。联合舰队的其他部分在南太平洋和中太平洋执行占据任务（主要是`第四舰队`——监视`第五舰队`）。联合舰队的大多数潜艇被分配在夏威夷行动中支持针对`美国海军`（US
    Navy）的行动，但旧型号被分配用于支持东南亚行动。


    ![../img/CAM344_24.jpg](img/CAM344_24.jpg)


    日本海军战争早期被遗忘的飞机之一是`G3M`远程轰炸机，后来被盟军代号为“内尔”（Nell）。在没有盟军战斗机拦截的情况下飞行，这种轰炸机非常有效，其在对`Z
    舰队`、`卡维特`（Cavite）海军基地以及`ABDA`打击队的战斗中证明了这一点。（美国海军历史与司令部）总之，`南方军`被分配了两艘战舰、三艘重巡洋、四艘轻巡洋和一些驱逐舰。从表面上看，这是一支强大的力量，但行动节奏和作战区域的广度意味着它从未过集中。日本海军的海上单位不足以有力地保护所有入侵和援军船队。


    近藤大将（Kondo）保留直接指挥了一支强大的力量，其中包括两艘战舰（`长龙`和`春云`）、三艘重巡洋（`爱宕`、`高雄`和`鸟耶`）以及八艘驱逐舰。这支力量发挥远距离支持作用。多次登陆的直接掩护由`南方远征军`的两个前卫小组提供。这两个小组是进入荷属东印度群岛进攻的两个钳形。这些钳形的具体称呼在战役过程中发生了变化，但最常被称为`东方军`和`西方军`


    ![../img/CAM344_23.jpg](img/CAM344_23.jpg)


    少数的`B5N1`攻击机（如这张战前照片中所示的那样，从航空航母`翔云`起飞）在荷属东印度群岛战役中发挥了重要作用。这些飞机可以同时使用鱼雷和炸弹，但在战役期间仅使用了炸弹。它们在
    2 月 4 日帮助击退了盟军的打击队。（美国海军历史与司令部）


    `东方军`由高桥大将（Takahashi）指挥。它分配了轻型航空航母`翔云`、四艘`妙贺`级重巡洋、拥有轻巡洋`神通`和八艘驱逐舰的第 2 驱逐队中队，以及拥有轻巡洋`中鹿`和十一艘驱逐舰的第
    4 驱逐队中队。


    `西方军`由泽泽大将（Ozawa）指挥，被分配了重巡洋`重庆`作为他的旗舰，以及四艘`级贺`级重巡洋，以及拥有旗舰`仙台`和七艘驱逐舰的第 5 驱逐队中队。


    日本海军的陆基空军预计将在战役中发挥巨大作用。驻扎在法属印支的第 22 飞行队被分配负责负责马来西亚行动，而第 21 和第 23 飞行队最初被分配用于支持对菲律宾的进攻。所有这些力量最终都可用于支持针对荷属东印度群岛的行动。这些是非常强大的进攻力量，这一点在
    12 月 10 日得到了证明，当时日本海军的陆基飞机在马来西亚近岸击沉了`威尔士王子号`和`反击号`。飞行机员对海上打击行动接受过高水平的训练，他们驾驶的飞机也非常出色。主力机型是`G3M`（后来被盟军代号为“内尔”）和`G4M`（后来被代号为“贝蒂”）。这两种飞机都具有长程能力，可以携带
    1870 磅的`91 式`航空鱼雷或 2200 磅的炸弹。针对海军目标，它们能够进行水平轰炸（通常在 10,000 英尺高度以避开大部分防空火力）或鱼雷轰炸。高空攻击海军基地也是优先任务。`G3M`和`G4M`都容易受到盟军战斗机的拦截，但这在战役期间并不是主要担心。


    ### 舰船


    日本海军重巡洋舰是日本海军进军荷属东印度群岛的先锋。日本重巡洋舰的设计是为了扮演几个重要角色，主要作为夜战战斗群的核心。日本重巡洋的设计强调火力，因为为了履行战时角色，它们必须比类似的`美国海军`舰船武装程度，并具备比美国巡洋舰更远距离打击的能力。它们能够利用其
    8 英寸炮群进行远程射击攻击。


    `妙贺`级的首舰舰于 1928 年服役，到战争开始时已配备了十门 8 英寸主炮。下一个服役的级别是四艘的`爱宕`级，同样配备了十门 8 英寸主炮。四艘规模的`高雄`级最初作为轻巡洋舰服役，配备
    15 门 6 英寸炮，但在战争开始前升级为十门 8 英寸炮主电池。这三个级配备的 8 英寸炮的最大射程在 31,606 到 32,153 码之间。日本人认为配备在其巡洋舰上的火控设备使其
    8 英寸炮的有效作战距离达到 21,873 码，但他们经常在更远的距离接触目标。然而，在远距离上，双联 8 英寸炮受到严重的散布问题，影响了准确性。


    ![../img/CAM344_04.jpg](img/CAM344_04.jpg)


    `妙贺`是海军条约巡洋舰的第一级。这些舰远超过 10,000 吨的条约限制，这有助于日本设计师建造出具有巨大火力、高速和相当程度防护的平衡舰船。`妙贺`级优于`美国海军`和英国海军的条约巡洋舰，并在战争期间表现良好。（大和博物馆）


    `足贺`（图中 1942 年 12 月位于新加坡旧英国海军实里达海军基地的干坞中）在入侵菲律宾和荷属东印度群岛期间担任高桥大将的旗舰。由于处于预备役，直到
    3 月 1 日她才有机会接触盟军军舰，当时她在摧毁英国海军重巡`埃克斯塞特号`和驱逐舰`遭遇号`中发挥了领导作用。她在职业生涯剩余的大部分时间里一直留在荷属东印度水域，并于
    1945 年 6 月 7 日在望加海峡被英国海军潜艇`战壕号`击沉。（大和博物馆）


