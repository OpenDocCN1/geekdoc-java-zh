    在从护送前往马来亚的护队以支持进攻新加坡战役的任务中解脱后，日本海军西舰队准备了一场进攻巴淡丹的大规模行动。为了护送由 25 艘运输船组成的侵略军，泽泽少将集结了五艘巡洋舰、巡洋舰“井号”以及
    11 艘驱逐舰。轻型航母“龙凤号”（载有 12 架战斗机和 15 架`B5N1`“鱼罐”攻击机）也从东方舰队调遣提供支援。这支侵略军于 2 月 10 日从印支那的占兰湾向南出发。


    盟军一直在关注这一大规模的集结，并制定了阻止计划。2 月 11 日，美国海军潜艇的一次潜艇攻击未果，两次英国空袭也同样无果。多尔曼的“打击部队”也被命令移动到位于苏门答腊岛东南角的荷兰小型海军基地`Oosthaven`，准备进行拦截。赫尔里希中将于
    2 月 12 日正式接任 ABDA（美墨荷）海军部队指挥，他被分配了一支表面上看起来强大的力量：荷兰巡洋舰“鲁伊特号”、“雅华号”和“特姆普号”、英国重巡洋舰“埃快递号”、澳洲巡洋舰“霍巴特号”、六艘美国海军驱逐舰和四艘荷兰驱逐舰。凭借这支得到显著增兵的力量，赫尔里希命令多尔曼进攻日本侵略护队。因此，“打击部队”于
    2 月 14 日下午离开了`Oosthaven`。


    ![../img/CAM344_061.jpg](img/CAM344_061.jpg)


    2 月 15 日，多尔曼率领打击部队在巴淡丹外海进攻日本侵略军。在场的所有五艘盟军巡洋舰全天都遭到轰炸，日本飞机共出动 93 个架次。图中显示了“雅华号”正遭受攻击。尽管她是几波轰炸机的攻击重点，但她仅遭受了轻微的碎片损坏。（荷兰军事史学会）


    ![../img/CAM344_062.jpg](img/CAM344_062.jpg)


    “鲁伊特号”在 2 月 15 日的空袭中也未受任何损坏。然而，由于失去了意外性且燃料不足，多尔曼取消了此次行动。（荷兰军事史学会）


    不幸从行动伊初就如影随形。15 日凌晨，荷兰驱逐舰“范·亨格特号”在班登岛和比里顿岛之间的斯托尔泽海峡深深搁浅。该船全没，多尔曼指派了另一艘荷兰驱逐舰来撤离船员并击沉该船。几小时后，意外性消失了，在
    09 时 23 分，一架日本巡洋舰水上飞机发现了“打击部队”。空袭随之而来。第一次攻击发生在 10 时 20 分，当时来自“龙凤号”的四架`B5N1`“鱼罐”机选定“埃快递号”作为目标。飞机从高空投下
    550 磅炸弹，但未命中。紧随第一次攻击之后，来自婆罗洲的 23 架`G3Ms`发起了规模更大的进攻。它们从高空投弹，仅对两艘美国驱逐舰造成了轻微损坏。11
    时 30 分，又有七架`B5N1`出现并攻击了“埃快递号”，再次仅造成了轻微损坏。此时，多尔曼取消了行动。然而，“打击部队”的磨炼并未此结束。另外两组共计
    44 架陆基轰炸机到达并进行了高空攻击。同样，没有命中。来自“龙凤号”的 19 架`B5N1`分三组进行的攻击也未成功。“打击部队”与日本海军空军持续一整天的遭遇以平局结束。除近弹炸破外，没有船只被击中，也没有飞机被击落。但迄今为止集结规模最大的盟军海军力量被迫放弃了阻止日本入侵的尝试。结果是，巴淡丹的入侵顺利进行。它的成功迫使盟军撤离了苏门答腊。


    日本空军力量继续主宰该地区。2 月 15 日，来自“肯达里”的日本轰炸机袭击了开往提汶岛的盟军援军护队。虽然没有命中（主要是因为轰炸机针对的是“休斯顿号”而非速度慢且机动性差的运输船），但这是对马来海峡以南的盟军船只的首次空袭。护队被命令返回澳大利亚达尔文，那是向荷属群岛（NEI）输送援军和飞机的主要基地。2
    月 17 日，陆基轰炸机和“龙凤号”的`B5N1`击沉了一艘正在从比里顿岛撤离士兵的荷兰运输船和驱逐舰，伤亡惨。


    ![../img/CAM344_039.jpg](img/CAM344_039.jpg)


    荷兰驱逐舰“范·内斯号”是日本海军航空力量受害者。2 月 17 日，这艘驱逐舰正在护送一艘从比里顿岛撤离守军的荷兰运输船。派遣士兵后，两船被一架日本巡洋舰水上飞机发现，随后遭到
    15 架`G3M`和来自“龙凤号”的十架“鱼罐”机的密集空袭。驱逐舰被“龙凤号”飞机的三枚炸弹击中，迅速沉没，损失 68 名船员。（美国海军历史与遗产司令部）


    ![../img/9781472831613_Map003.jpg](img/9781472831613_Map003.jpg)


    ### 巴杜恩海峡战战，1942 年 2 月 19–20 日


    ![../img/CAM344_052.jpg](img/CAM344_052.jpg)


    2 月 19 日上午，日本俯冲炸机展现了惊人的射术，在达尔文港击中了机动的驱逐舰“珍珠号”五。如图所示，该船被燃烧的燃油包围。其船员中仅 53 人幸存；另
    80 人死亡。（美国海军历史与遗产司令部）


    随着 2 月中旬“第一舰队”的抵达，来自日本空军的威胁显著增加。这支力量由四艘曾攻击过珍珠港的航母组成——“赤城”、“加贺”、“翔鹤”和“庄园”。在来自“肯达里”的陆基轰炸机的帮助下，日本决定利用其航母力量中和达尔文。2
    月 19 日，港口布满了潜在目标——47 艘军舰和各类商船。这一重要基地的防空极其薄弱，面对从四艘日本航母派出的 188 架飞机无效。日本飞机击中了港内的船只（包括美国驱逐舰“珍珠号”），并破坏了岸上设施。54
    架陆基轰炸机完成了破坏，攻击了附近的两个机场。与荷属群岛的主要联系已被暂时中和。


    日本人逼近爪哇。2 月 20 日，他们在提汶岛登陆了一个团。防守军在三天内被击败。岛屿及其机场的损失意味着从澳大利亚飞往荷属群岛的飞机路线被切断。


    对爪哇更直接的威胁是针对紧邻爪哇以东的巴厘岛的日本行动。如果日本人夺占登巴萨机场，他们就能增加对爪哇设施的压力，并主导该岛的南部通道，切断所有援军。


    日本计划在巴杜恩海峡将登陆部队送往巴厘岛东南角的萨诺尔路，这是很有风险的，因为那里离主要的盟军空军基地太近。登陆部队被放在两艘运输船上，并由四艘朝潮级驱逐舰护送。根据日本作战条例，登陆将在晚上进行，以便运输船清晨离开。巡洋舰“浦号”和另外三艘驱逐舰部署在北方提供远程支援。这支部队于
    2 月 17 日从望加锡出发。'
