    Data ingestion involves the process of bringing data into the Hadoop cluster for
    processing and analysis. Here are two commonly used methods for data ingestion
    in Hadoop:


    # ### 8.1.1 Batch Processing


    Batch processing is a method of ingesting and processing large volumes of data
    in batches. In this approach, data is collected over a certain period, and then
    the entire dataset is processed together. Batch processing is suitable for scenarios
    where data latency is not critical, and periodic data updates are sufficient.


    Example Usage: A retail company ingests daily sales transaction data into Hadoop
    at the end of each day for further analysis, such as sales trend analysis or inventory
    management.'
