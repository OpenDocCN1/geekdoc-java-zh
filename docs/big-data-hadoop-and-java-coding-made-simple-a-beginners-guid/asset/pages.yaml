  md: 'Apache Parquet is a columnar storage format designed for efficient analytics
    and query processing. Parquet stores data column-wise, which enables compression
    and encoding techniques specific to each column. It reduces disk I/O and improves
    query performance, especially when dealing with selective projections and column-based
    filters.


    Example Usage: Storing large analytical datasets, data warehouses, or data lakes
    for analytics and reporting.


    # 9.1.3 Apache ORC (Optimized Row Columnar)


    Apache ORC is another columnar storage format that offers a highly efficient and
    compact way to store structured data. ORC optimizes compression techniques, predicate
    pushdown, and other optimizations to accelerate data processing and minimize storage
    requirements. It is well-suited for interactive querying and analytics on large
    datasets.


    Example Usage: Storing and querying log files, clickstream data, or financial
    data.


