  md: '# # Chapter 2: Understanding Hadoop Architecture


    In this chapter, we will dive into the architecture of Hadoop, exploring its various
    components and their functionalities. By understanding the underlying structure
    of Hadoop, you will gain insights into how data is stored, processed, and managed
    in this powerful framework. Through examples, we will illustrate the roles of
    different components and their interactions within a Hadoop cluster.


    # ## 2.1 The Hadoop Ecosystem


    Before we delve into the architecture of Hadoop, let''s take a moment to understand
    the broader Hadoop ecosystem. Hadoop is not just a single tool or framework; rather,
    it consists of a collection of complementary software components that work together
    to form a robust data processing and storage platform.


    Some key components of the Hadoop ecosystem include:


    2.1.1 Hadoop Distributed File System (HDFS): HDFS is the primary storage system
    of Hadoop. It is designed to handle large volumes of data and provides fault tolerance
    by replicating data across multiple machines in a cluster.


    2.1.2 MapReduce: MapReduce is the processing framework of Hadoop. It enables parallel
    and distributed data processing by breaking down tasks into map and reduce phases,
    which are executed across the cluster.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '2.1.3 Yet Another Resource Negotiator (YARN): YARN is the resource management
    and job scheduling framework of Hadoop. It manages cluster resources and allocates
    them to different applications, including MapReduce jobs.


    2.1.4 Hadoop Common: Hadoop Common contains libraries and utilities used by other
    Hadoop components. It provides a common set of functionalities that support the
    entire ecosystem.


    2.1.5 Hadoop Ecosystem Tools: In addition to the core components mentioned above,
    the Hadoop ecosystem includes various tools and frameworks that enhance its capabilities.
    Examples include Apache Hive for SQL-like querying, Apache Pig for data flow scripting,
    real-time read/write access to data, and Apache Spark for in-memory data processing.


    # 2.2 Hadoop Architecture Overview


    Now, let''s explore the architecture of Hadoop and its core components in detail.
    At the heart of Hadoop lies a distributed file system called Hadoop Distributed
    File System (HDFS). HDFS provides reliable and scalable storage for big data.


    # 2.2.1 Hadoop Distributed File System (HDFS)


    HDFS breaks down large datasets into smaller blocks and distributes them across
    multiple machines in a Hadoop cluster. This distribution allows for parallel processing
    and fault tolerance. The key components of HDFS are:'
  merge: -1
  pgno: 11
- img_proc: true
  md: '2.2.1.1 NameNode: The NameNode is the central coordinating node in HDFS. It
    manages the file system namespace and keeps track of where the data blocks are
    stored in the cluster. The NameNode maintains metadata about the files, such as
    file names, directory structures, and block locations.


    2.2.1.2 DataNodes: DataNodes are worker nodes in HDFS that store the actual data
    blocks. They are responsible for storing, retrieving, and replicating data blocks
    as directed by the NameNode. DataNodes also perform data integrity checks and
    report their status to the NameNode.


    # 2.2.2 MapReduce


    MapReduce is the processing framework of Hadoop. It allows for parallel and distributed
    processing of large datasets. The MapReduce architecture consists of two main
    phases:


    2.2.2.1 Map Phase: In the map phase, data is processed in parallel across multiple
    nodes in the cluster. Each node performs a specified computation on a portion
    of the input data and generates key-value pairs as intermediate output.


    2.2.2.2 Reduce Phase: In the reduce phase, the intermediate outputs from the map
    phase are consolidated based on their keys. Reducer nodes receive the intermediate
    key-value pairs, perform further computations, and generate the final output.


    The combination of map and reduce tasks enables efficient processing of large
    datasets by leveraging the parallel processing capabilities of a Hadoop cluster.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# 2.3 Example Scenario: Word Count


    To illustrate the functioning of Hadoop architecture, let''s consider a classic
    example: word count. Suppose we have a large text document and want to count the
    occurrences of each word in that document using Hadoop.


    +   1. The document is stored in HDFS and divided into blocks. The NameNode keeps
    track of the metadata associated with the file.


    +   2. The MapReduce job is initiated, and the map phase begins. Map tasks are
    assigned to different nodes in the cluster, each responsible for processing a
    portion of the document.


    +   3. Each map task reads its assigned block of the document, tokenizes the text,
    and emits key-value pairs where the word is the key, and the count is initially
    set to 1.


    +   4. Intermediate key-value pairs are generated by all the map tasks and shuffled
    across the cluster based on their keys.


    +   5. The reduce phase begins. Reducer tasks receive the intermediate key-value
    pairs and aggregate the counts for each word.


    +   6. The final output is generated, consisting of word-count pairs.


    By leveraging the parallel processing capabilities of Hadoop, the word count job
    can efficiently process even large documents, providing quick and accurate results.'
  merge: -1
  pgno: 13
