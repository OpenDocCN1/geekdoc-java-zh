    enabling efficient utilization of resources and faster processing.


    The MapReduce model consists of two main phases:


    +   - Map Phase: During the map phase, the input data is divided into smaller
    chunks, and each chunk is processed independently by map tasks. The map tasks
    generate intermediate key-value pairs as output. The map phase is highly parallelizable,
    with each map task processing a portion of the input data.


    +   - Reduce Phase: In the reduce phase, the intermediate key-value pairs generated
