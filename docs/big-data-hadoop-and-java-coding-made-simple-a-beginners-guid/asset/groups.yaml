    \n# 第7章：异常处理与文件 I/O\n\n在之前的章节中，我们涵盖了 Java 编程的基础，包括变量、控制流、方法、数组、面向对象编程（OOP）等。现在，在第\
    \ 7 章中，我们将探索重要的主题：异常处理和文件输入输出（I/O）。\n\n## 7.1 异常处理简介\n\n异常处理是 Java 中的一种机制，允许我们处理程序执行过程中可能发生的运行时错误或异常情况。这些异常可能由多种因素引起，例如无效输入、除零错误、文件未找到等。通过处理异常，我们可以优雅地从错误中恢复，向用户提供有意义的错误信息，并防止程序崩溃。Java提供了使用\
    \ `try-catch-finally` 块的内置异常处理机制。\n\n## 7.2 try-catch-finally 块\n\n`try-catch-finally`\
    \ 块用于处理 Java 中的异常`try` 块包含可能触发异常的代码。`catch` 块用于捕获并处理异常，提供备选的方案。`finally` 块是可选的，用于执行无论是否发生异常都应该始终运行的代码。\n\
    \n语法：\n\n```java\ntry {\n  // 可能抛出异常的代码\n} catch (ExceptionType1 exception1) {\n\
    \  // 对 ExceptionType1 的异常处理\n} catch (ExceptionType2 exception2) {\n  // 对 ExceptionType2\
    \ 的异常处理\n} finally {\n  // 始终运行的代码\n}\n```\n\n示例：\n\n```java\ntry {\n  // 可能抛出异常的代码\n\
    \  int result = divide(10, 0); // 除零错误示例\n} catch (ArithmeticException ex) {\n\
    \  // 对 ArithmeticException 的异常处理\n  System.out.println(\"An arithmetic exception\
    \ occurred: \" + ex.getMessage());\n} finally {\n  // 始终运行的代码\n  System.out.println(\"\
    Inside the finally block.\");\n}\n```\n\n在上面的示例中，`try` 块尝试将 `10` 除以 `0`。`catch`\
    \ 块捕获并处理了异常。`finally` 块无论是否发生异常都会执行。\n\n## 7.3 检查异常与未检查异常\n\n在 Java 中，异常被分为两类：检查异常（checked\
    \ exceptions）和未检查异常（unchecked exceptions）。\n\n检查异常是必须在方法签名中声明或使用 `try-catch` 块处理的异常。\n\
    \n未检查异常也称为运行时异常（runtime exceptions），不需要声明或捕获。它们是 `RuntimeException` 的子类。\n\n##\
    \ 7.4 文件输入输出 (I/O)\n\n文件输入输出（I/O）是在计算机系统中从文件读取和写入文件的过程。Java 提供了几个类和方法来执行 I/O 操作，允许我们创建、读取、写入和操作文件。\n\
    \n要从文件中读取数据，通常遵循以下步骤：\n\n- 创建一个表示文件的 `File` 对象。\n- 创建一个 `FileReader` 对象，并将 `File`\
    \ 对象作为参数传递。\n- 将 `FileReader` 对象封装在 `BufferedReader` 中以便高效读取。\n- 使用 `BufferedReader`\
    \ 的 `readLine()` 方法按行读取文件内容。\n\n示例：\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.File;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    \npublic class FileReadingExample {\n    public static void main(String[] args)\
    \ {\n        File file = new File(\"example.txt\"); // 将 \"example.txt\" 替换为实际的文件路径\n\
