    # 7.3 Checked and Unchecked Exceptions


    In Java, exceptions are categorized into two types: checked exceptions and unchecked
    exceptions.


    Checked exceptions are exceptions that must be declared in the method signature
    using the `throws` keyword or handled using a `try-catch` block. Examples of checked
    exceptions include `IOException`, `SQLException`, and `ClassNotFoundException`.


    Unchecked exceptions, also known as runtime exceptions, do not need to be declared
    or caught explicitly. They are subclasses of the `RuntimeException` class. Examples
    of unchecked exceptions include `ArithmeticException`, `NullPointerException`,
    and `ArrayIndexOutOfBoundsException`.


    It is important to handle or declare checked exceptions to ensure proper error
    handling and maintain code robustness. Unchecked exceptions, on the other hand,
    can be handled optionally.


