    \ and setter methods to manipulate the `item` variable.\n\n## 8.5 Wildcards in\
    \ Generics\n\nWildcards are used to represent an unknown type. There are three\
    \ types of wildcards in Java:\n\n- `?`: Unbounded wildcard, represents any type.\n\
    - `? extends T`: Upper bounded wildcard, represents T or any subclass of T.\n\
