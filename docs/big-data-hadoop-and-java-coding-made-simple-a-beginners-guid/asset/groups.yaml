    \ define the behaviors of a car.\n\n### 6.4 Encapsulation and Access Modifiers\n\
    \nEncapsulation is an important concept in OOP that involves bundling data (fields)\
    \ and methods together within a class and controlling their access. It helps in\
    \ hiding the internal implementation. Java provides access modifiers:\n\n- `public`:\
    \ Accessible from anywhere.\n- `private`: Accessible only within the class.\n\
    - `protected`: Accessible within the same package and by subclasses.\n- `default`:\
