    \ 数组简介\n\n数组是一个容器对象，持有固定数量的相同类型的值。数组中的每个值被称为元素，每个元素通过其索引进行访问。数组提供了一种在变量中存储和访问多个相关值的方便方法。\n\
    \n## 5.2 数组的声明和初始化\n\n要使用数组，我们需要对其进行声明和初始化。声明指定了数组将持有的元素类型，初始化则为数组元素分配实际值。\n\n\
