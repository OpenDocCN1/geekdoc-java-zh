    \ providing different implementations while retaining a common interface.\n\n\
    Example:\n\n```java\npublic class Car {\n  // ...\n  public void drive() {\n \
    \   System.out.println(\"Driving a car.\");\n  }\n}\n\npublic class SportsCar\
