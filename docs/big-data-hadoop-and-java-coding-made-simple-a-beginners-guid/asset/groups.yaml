    To create an object (instance) of a class, we use the `new` keyword:\n\n```java\n\
    ClassName objectName = new ClassName();\n```\n\nExample:\n\n```java\nCar myCar\
    \ = new Car();\n```\n\nIn the example above, we create an object `myCar` of the\
    \ `Car` class.\n\n### 6.3 Class Members: Fields and Methods\n\nA class consists\
    \ of two types of members: fields (variables) and methods.\n\nFields represent\
    \ the attributes or properties of an object. They store the state or data associated\
    \ with an object. Fields can be of different types, such as `int`, `double`, `String`,\
    \ or even other objects.\n\nMethods, on the other hand, define the behavior or\
    \ actions that objects can perform. They encapsulate the operations or functionalities\
    \ related to the object. Methods can have parameters and may return values.\n\n\
    Example:\n\n```java\npublic class Car {\n  // Fields\n  String brand;\n  String\
    \ color;\n  int year;\n\n  // Methods\n  public void startEngine() {\n    System.out.println(\"\
    Engine started!\");\n  }\n\n  public void drive(int distance) {\n    System.out.println(\"\
    Driving \" + distance + \" kilometers.\");\n  }\n}\n```\n\nIn the example above,\
