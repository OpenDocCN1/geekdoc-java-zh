  \ \"a\" 链接，即可获取所有以 \"a\" 开头的键的子集。\n\n基于这些思想，我们现在将带你实现一个用 Patricia 字典树实现的映射。我们将这个映射称为\
  \ `PrefixMap`，这意味着它提供了一个方法 `withPrefix` 方法，用于选择所有以给定前缀开头的键的子映射。\n\n我们首先将根据图 25.2\
  \ 中所示的键定义一个前缀映射：\n\n```\nscala> val m = PrefixMap(\"abc\" -> 0, \"abd\" -> 1, \"\
  al\" -> 2,\n  \"all\" -> 3, \"xy\" -> 4)\n  m: PrefixMap[Int] = Map((abc,0), (abd,1),\
  \ (al,2), (all,3),\n  (xy,4))\n```\n\n然后对 `m` 调用 `withPrefix` 将产生另一个前缀映射：\n\n```\n\
  scala> m withPrefix \"a\"\n  res14: PrefixMap[Int] = Map((bc,0), (bd,1), (l,2),\
  \ (ll,3))\n```\n\n代码列表 25.15 和 25.16 显示了 `PrefixMap` 的定义。它将字符串与任何类型的值关联起来，因此它有一个类型参数\
  \ `A` 用于映射的值。在你们之前在 RNA 链示例中见过的模式中，该类扩展了 `mutable.Map` 和 `MapOps`。继承实现类 `MapOps`\
  \ 是为了在使用 `filter` 和 `take` 等转换时获得正确的返回类型。\n\n前缀映射节点有两个可变字段：`suffixes` 和 `value`。`value`\
