  \n# 第 35 章：SCells 表格程序\n\n在之前的章节中，你已经了 Scala 编程语言的许多不同结构。在本章中，你将看到这些结构在实现一个大型应用时是如何协同工作的。任务是编写一个名为\
  \ `SCells` 的电子表格应用程序。\n\n这项任务之所以有趣有几个原因。首先，每个人都熟悉电子表格，因此很容易理解该程序应该做什么。其次，电子表格是执行大量范围内不同计算任务的程序。它有视觉方面，即电子表格被视为一个丰富的\
  \ GUI 应用；它有符号方面，涉及公式以及如何解析和解释公式；有计算方面，处理如何增量地更新可能巨大的表格；有响应方面，电子表格被视为以复杂方式响应事件的程序；最后，还有组件方面，应用程序被构建为一组可重用的组件。这些方面都将在本章中得到深入探讨。\n\
