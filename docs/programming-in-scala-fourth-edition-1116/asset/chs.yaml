- "# Scala 编程指南（第四版）\n\n\n\n\n\n# 对《Programming in Scala》早期版本的赞誉\n\n`Programming in\
  \ Scala` 也许是我读过的最好的编程书籍之一。我喜欢它的写作风格、简洁的笔触以及详尽的解释。这本书似乎能回答我脑海中出现的每一个问题——它总是比我快一步。作者们不仅仅是给你一些代码，并认为一切都是理所当然。他们给了你“干货”，让你真正理解了正在发生什么。我非常喜欢这一点。\n\
  \n- Ken Egervari，首席软件架构师\n\n`Programming in Scala` 编写得清晰、详尽且易于理解。书中随处都有极佳的示例和实用的技巧。它让我们的组织能够快速、高效地上手\
  \ `Scala` 语言。对于任何试图理解 `Scala` 语言的灵活性和优雅性的程序员来说，这本书都是极佳的选择。\n\n- Larry Morroni，Morroni\
  \ Technologies, Inc. 所有者\n\n《Programming in Scala》一书是 `Scala` 语言的极佳教程。阅读这本书时，逻辑非常顺畅，每一章都建立在之前章节所描述的概念和示例之上。书中花心地深入解释了语言结构，并经常提供该语言与\
  \ `Java` 区别的示例。除了主语言外，还涵盖了如 `containers` 和 `actors` 等库。\n\n我发现这本书非常易读，它可能是我最近读过的撰写得最好的技术书籍之一。我非常向任何想要了解更多\
  \ `Scala` 语言知识的程序员推荐这本书。\n\n- Matthew Todd\n\n`Programming in Scala` 作者们所付出的努力令我震惊。这本书是一份无价的指南，用于我所称的\
  \ \"`Scala` 平台”：一个通往更佳代码的工具，可扩展软件设计与实现的永恒灵感来源。如果我在 2003 年共同设计和实现 2004 年雅腊奥运会门户基础设施部分内容时，我的桌上能有目前这种成熟状态的\
  \ `Scala` 和这本书该多好！\n\n致所有读者：无论你们的编程背景如何，我觉得你们会发现在 `Scala` 中编程是解放性的，而这本书将成为你们旅程中的忠实朋友。\n\
  \n- Christos KK Loverdos，软件顾问，研究员\n\n`Programming in Scala` 是对 `Scala` 的极佳深度介绍，它也是一本极佳的参考书。我会说它在我书架上占据着显目的位置，唯一的是我几乎无论去哪里哪里都带着它。\n\
  \n- Brian Clapper，ArdenTex, Inc. 主席\n\n一本好书，写得很好，示例深思熟虑。我会向资深程序员和新手都推荐它。\n\n- Howard\
  \ Lovatt\n\n《Programming in Scala》一书不仅关于“如何做”，更重要的是关于“为什么”用这种新的编程语言来开发程序。书中在介绍面向对象编程与函数式编程结合的力量时，所用的务实方法让读者对\
  \ `Scala` 究竟是什么不再产生任何怀疑。\n\n- Dr. Ervin Varga，CEO/创始人，EXPRO I.T. Consulting\n\n\
  这是一本针对面向对象（OO）程序员的函数式编程的极佳介绍。学习 `FP` 是我的主要目标，但也接触了一些很棒的 `Scala` 惊喜，比如 `case classes`\
  \ 和 `pattern matching`（模式匹配）。`Scala` 是一门引人入胜的语言，这本书涵盖得很好。\n\n在语言介绍书中，提供信息过多或过少之间总有一条微妙的界限。我发现《Programming\
  \ in Scala》实现了完美的平衡。\n\n- Jeff Heon，程序员分析师\n\n我买了一本由 `Odersky`、`Spoon` 和 `Venners`\
  \ 编写的早期电子版《Programming in Scala》，我立刻成了它的粉丝。除了它包含了关于语言最全面的信息外，电子格式的几个关键功能也给我留下了深刻印象。我从未见过\
  \ `PDF` 中的链接用得如此好，不仅用于书签，还提供了从目录和索引的活动链接。我不知道为什么更多作者不使用这个功能，因为这对读者来说真的是一种享受。另一个令我印象深刻的功能是通往论坛（`Discuss`）的链接，以及通过电子邮件向作者发送反馈（`Suggest`）的方法。反馈功能本身并不稀奇，但在发送给作者的生成内容中简单包含页码，这对作者和读者来说都有价值。如果这个过程更繁琐，我贡献的反馈会比现在少。\n\
  \n为了内容请阅读《Programming in Scala》，但如果你读的是电子版，请务必利用作者们精心构建的数字功能！\n\n- Dianne Marsh，SRT\
  \ Solutions 创始人/软件顾问\n\n清晰度和技术完备性是任何一本良好的书籍的标志，我祝贺 `Martin Odersky`、`Lex Spoon`\
  \ 和 `Bill Venners` 做得非常出色！《Programming in Scala》一书首先通过基本概念建立坚实的基础，并将用户提升到中级及以上水平。这本书无疑是任何渴望学习\
  \ `Scala` 的人来说都是必买的。\n\n- Jagan Nambi，GMAC Financial Services 企业架构师\n\n`Programming\
  \ in Scala` 读起来是一种享受。这是这类写得很好的技术书籍之一，它们以极其简洁和优雅的方式对主题进行了深入且全面的涵盖。\n\n这本书的组织方式非常自然且符合逻辑。它既适合那些只想跟上当前趋势的奇奇技术人员，也适合寻求深度理解语言核心特征及其设计原理的专业人士。我强烈地向所有对通用函数式编程感兴趣的人推荐它。对于\
  \ `Scala` 开发者来说，这本书是必读的。\n\n- Igor Khlysov，Greystone. 架构师\n\n《Programming in Scala》流出了作者付出的巨大心血。这是这类写得很好的技术书籍之一，它们以极其简洁和优雅的方式对主题进行了深入且全面的涵盖。（注：此处原文内容重复，已按要求不重复输出译文内容）《Programming\
  \ in Scala》流出了作者付出的巨大心血。这是这类写得很好的技术书籍之一，它们以极其简洁和优雅的方式对主题进行了深入且全面的涵盖。\n\n- Gerald\
  \ Loeffler，Java 架构师\n\n《Programming in Scala》由 `Odersky`、`Lex Spoon` 和 `Venners`\
  \ 编写：在优秀的编程书籍稀缺的时代，这本针对中间程序员的精彩介绍脱颖而出。你在这里找到学习这种语言所需的一切。\n\n- Christian Neukirchen\n\
