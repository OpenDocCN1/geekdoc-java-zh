  # 关于作者\n\nMartin Odersky 是 Scala 语言的创建者。他是瑞士洛桑 EPFL 的教授。自 2001 年以来，他一直专注于 Scala\
  \ 的设计、实现。他是 Java 泛型的原始设计者之一。\n\nLex Spoon 是 Semmle 的软件工程师。他在 EPFL 担任过两年的后博士，研究动态语言的静态分析。除了\
  \ Scala，他还帮助开发了多种语言，包括动态 Smalltalk、科学 X10 以及驱动 Semmle 的逻辑语言。他和妻子住在亚特兰大。\n\nBill\
  \ Venn 是 Artima, Inc. 的总裁，网站（www.artima.com）的出版，并提供咨询、培训和书籍。他是《深入虚拟机》的作者，这是一本关于\
  \ Java 平台架构和内部机制的面向面向者的概述。他在 *JavaWorld* 上的专栏涵盖了 Java 内部机制、面向对象设计和 Jini。他是 Scala\
  \ 中心顾问委员会的社区代表，也是 ScalaTest 框架和用于函数面向对象编程的 Scalactic 库的开发者和设计师。\n\n# 索引\n\na b c\
