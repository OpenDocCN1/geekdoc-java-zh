  \n送给 Nastaran - M.O.\n送给 Fay - L.S.\n送给 Siew - B.V.\n\n# 前言\n\n2004 年，当我处于职业生涯的开端，并选择了一种名为\
  \ `Scala` 的鲜为人知的语言时，我并没有意识到自己即将开启一段怎样的探索与发现之旅程。\n\n起初，我使用 `Scala` 的经验和我尝试过的其他语言大同小异：试错、实验与发现、先是误解后是顿悟。那时，我们几乎没有可以学习的资料：没有教程、博客，也没有经验丰富的用户来教我们。我们确实没有像《`Programming\
  \ in Scala` 这样的资源。我们拥有的只是一个拥有奇妙新功能的语言，但没有人完全确定如何使用它们。它既让人充满力量，又让人感到困惑！\n\n我作为 `Java`\
  \ 程序员的背景让我产生了某些预期，但在 `Scala` 中编写代码的日常感觉却不同。我记得早期在使用 `Scala` 的某些具有影响力的冒险，当时我与另一个人一起负责一个中等规模的项目。我会决定进行重构——通过以稳健的速度发现并学习新功能和模式，这当时非常常见——然后我会经历几次编译迭代。每次，编译器都会向我报告出一份错误列表以及行号。每次我都会跳转到该行号，搞清楚哪里错了，修改代码修复错误（或者更多时候是把它们移动到其他地方）。但在每一步中，编译器都在直接引导我找到问题。有时，经过几天的这种重复，依然没有一次成功的编译。\n\
  \n在 2015 年我举办的第一届 `Scala World` 大会上，Rúnar Bjarnason 在主题演讲中声称：“约束释放了程序员。”\n\n在那之后的几年里，我一直在学习\
  \ `Scala`，直到今天发现了许多可能性、细微差别以及功能之间的相互作用。我不知道还有什么语言能像这样吸引用户多年。`Scala` 即将进入一个变革时期。下一个主版本\
  \ `Scala 3` 对 `Scala 2` 的升级，就像十五年前我从 `Java` 的升级一样。大部分日常编程体验将保持不变，但跨越各个领域的新功能将变得可用。写作时，`Scala\
  \ 2` 的最新版本 2.13（本书有详细介绍）在标准库中引入了新的集合，为了简单而进行了重新设计，吸收了自 `Scala 2.8` 上次重大设计以来的教训。这些新集合可以在\
  \ `Scala 2` 和 `3` 上交叉编译，因此将成为我们未来十年编写代码的基础。目前，`Scala 3` 的广泛普及还需要几年，`Scala 2` 在可预见的未来将继续是\
  \ `Scala` 的事实标准版本。\n\n由于非常非常兴奋 下一个版本的发布，现在是拿起《`Programming in Scala`》并开始学习的最佳时机！\n\
