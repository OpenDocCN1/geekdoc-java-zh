  \n例如，包含少于五个元素的映射被表征为单个对象。相比之下，如第 17.2 节 所述，标准的可变映射是 `HashMap`，即使它是空的，通常也会占用大约 80\
  \ 字节。因此，如果小型集合很常见，那么选择不可变的比可变的更好。在 Patricia 字典树的情况下，我们预计除了树最顶端的节点外，大多数节点只包含少数后继节点。因此，将这些后继节点存储在不可变映射中可能更高效。\n\
  \n现在看看映射需要实现的第一个方法：`get`。算法如下：要获取前缀映射中与空字符串关联的值，只需选择存储在树根节点中的可选值即可。否则，如果键字符串不为空，则尝试选择与字符串第一个字符对应的子映射。如果返回了映射，则紧接着在该映射中查找键字符串第一个字符之后的剩余部分。如果选择失败，则映射中未存储该键，因此返回\
  \ `None`。这种对可选值（option value）的组合选择使用 `flatMap` 优雅地表达。当 `flatMap` 应用于可选值 `ov` 和一个闭包\
  \ `f`（该闭包又返回一个可选值）时，如果 `ov` 和 `f` 都返回了定义的值，则 `ov flatMap f` 将成功。否则，`ov flatMap f`\
  \ 将返回 `None`。\n\n可变映射需要实现的另外两个方法是 `addOne` 和 `subtractOne`。`subtractOne` 方法与 `get`\
  \ 非常相似，区别在于返回任何关联值之前，包含该值的字段被设置为 `None`。`addOne` 方法首先调用 `withPrefix` 导航到需要更新的树节点，然后将该节点的\
  \ `value` 字段设置为给定的值。`withPrefix` 方法遍历树，如果某些字符前缀尚未作为路径包含在树中，则根据需要创建子映射。\n\n可变映射需要实现的最后一个抽象方法是\
  \ `iterator`。此方法需要产生一个迭代器，产生存储在映射中的所有键值对。对于任何给定的前缀映射，该迭代器由以下部分组成：首先，如果映射在其根节点的 `value`\
  \ 字段中包含一个定义的值 `Some(x)`，那么 `(\"\", x)` 就是迭代器返回的第一个元素。此外，迭代器需要遍历 `suffixes` 字段中存储的所有子映射的迭代器，但它需要在这些迭代器返回的每个键字符串前面添加一个字符。更准确地说，如果\
  \ `m` 是通过一个字符从根节点到达的子映射，且 `(s, v)` 是该子映射返回的元素，那么迭代器将返回 `(chr, v)`。\n\n代码列表 25.15\
  \ 和 25.16 显示了 `PrefixMap` 的定义。它将字符串与任何类型的值关联起来，因此它有一个类型参数 `A` 用于映射的值。在你们之前在 RNA\
  \ 链示例中见过的模式中，该类扩展了 `mutable.Map` 和 `MapOps`。继承实现类 `MapOps` 是为了在使用 `filter` 和 `take`\
