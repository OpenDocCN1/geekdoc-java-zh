  Hello, world!\")\n}\n```\n\n当显示交互式 shell 时，来自 shell 的响应将用较浅的字体显示：\n\n```\nscala>\
  \ 3 + 4\n  res0: Int = 7\n```\n\n### 内容概览\n\n*   第 1 章 “可扩展的语言”，概述了 Scala 的设计以及其背后的设计理念、原因和历史。\n\
