  \n### 35.2 解耦数据输入与显示\n\n如果你尝试一下目前编写的电子表格，你会很快注意到在单元格中显示的输出总是你输入到单元格的内容。真实的电子表格并不是这样运行的。在真实的电子表格中，你会输入一个公式并看到它的值。因此，输入到单元格的内容与显示的内容不同。\n\
  \n```scala\npackage org.stairwaybook.scells\n  import swing._\n\n  class Spreadsheet(val\
  \ height: Int, val width: Int) \n      extends ScrollPane {\n\n    val cellModel\
  \ = new Model(height, width)\n    import cellModel._\n\n    val table = new Table(height,\
  \ width) {\n\n      // settings as before... \n\n      override def rendererComponent(isSelected:\
  \ Boolean,\n        hasFocus: Boolean, row: Int, column: Int): Component =\n\n \
  \       if (hasFocus) new TextField(userData(row, column))\n        else\n     \
  \     new Label(cells(row)(column).toString) { \n            xAlignment = Alignment.Right\
  \ \n          }\n\n      def userData(row: Int, column: Int): String = {\n     \
  \   val v = this(row, column)\n        if (v == null) \"\" else v.toString\n   \
  \   }\n    }\n    // rest as before... \n  }\n```\n\n##### 列表 35.3 - 带有 rendererComponent\
  \ 方法的电子表格。\n\n为了尝试列表 35.1 所示的原始电子表格，你只需要定义创建一个 `Spreadsheet` 组件的主程序。这样的程序如列表 35.2\
  \ 所示。\n\n```scala\npackage org.stairwaybook.scells\n  import swing._\n\n  object\
  \ Main extends SimpleSwingApplication {\n    def top = new MainFrame {\n      title\
  \ = \"ScalaSheet\"\n      contents = new Spreadsheet(100, 26)\n    }\n  }\n```\n\
  \n##### 列表 35.2 - 电子表格的主程序。\n\n\n\n\n作为开发真实表格应用的第一步，你应该专注于将数据输入和显示分离。显示的基本机制包含在\
  \ `Table` 类的 `rendererComponent` 方法中。默认情况下，`rendererComponent` 总是显示已输入的内容。如果你想改变这一点，就需要重写\
  \ `rendererComponent` 以实现不同的功能。Listing 35.3 显示了带有 `rendererComponent` 方法的新版电子表格。\n\
  \n`rendererComponent` 方法重写了 `Table` 类中的默认方法。它接受四个参数。`isSelected` 和 `hasFocus` 参数是布尔值，表示单元格是否被选中以及是否拥有焦点（这意味着键盘事件将进入单元格）。另外两个参数\
  \ `row` 和 `column` 提供了单元格的坐标。\n\n新的 `rendererComponent` 方法检查单元格是否具有输入焦点。如果 `hasFocus`\
  \ 为 `true`，则单元格被用于编辑。在这种情况下，你想显示一个可编辑的 `TextField`，其中包含用户目前输入的数据。这些数据由辅助方法 `userData`\
  \ 返回，该方法显示指定行和列的表格内容。内容通过调用 `this(row, column)` 获取[[1]](#the-scells-spreadsheet.html_footnotemain35-1)。`userData`\
  \ 方法还负责将空元素显示为字符串，而不是 \"null\"。\n\n到目前为止一切顺利。但如果单元格没有焦点，应该显示什么呢？在真实的电子表格中，这应该是单元格的值。因此，实际上有两个表格在工作。第一个表格命名为\
  \ `table`，包含用户输入的内容。第二个“影子”表格包含单元格的内部表示以及应该显示的内容。在电子表格示例中，该表是一个名为 `cells` 的二维数组。如果给定行和列的单元格没有编辑焦点，则\
  \ `rendererComponent` 方法将显示元素 `cells(row)(column)`。该元素是编辑的，因此它应该显示在 `Label` 中，而不是可编辑的\
  \ `TextField` 中。\n\n接下来需要定义内部单元格数组。你可以直接在 `Spreadsheet` 类中执行此，但通常将 GUI 组件的视图与其内部模型分离会更好。这就是为什么在上面的示例中，`cells`\
  \ 数组定义在一个名为 `Model` 的独立类中。模型通过定义一个类型为 `Model` 的值 `cellModel` 集成到 `Spreadsheet` 中。该\
  \ `val` 定义之后的导入语句使得 `cellModel` 的成员在 `Spreadsheet` 内部可用，无需加前缀。Listing 35.4 显示了 `Model`\
  \ 类的第一个简化版本。该类定义了一个内部类 `Cell` 以及一个由 `Cell` 元素的二维数组 `cells`。每个元素都被初始化为一个新的 `Cell`。\n\
  \n```\n package org.stairwaybook.scells\n\n  class Model(val height: Int, val width:\
  \ Int) { \n\n    case class Cell(row: Int, column: Int)\n\n    val cells = Array.ofDimCell\
  \ \n\n    for (i <- 0 until height; j <- 0 until width) \n      cells(i)(j) = new\
  \ Cell(i, j)\n}\n```\n\n##### Listing 35.4 - Model 类的第一个版本。\n\n![image images/scells2Gray96.png](img/scells2Gray96.png)\n\
  \n##### Figure 35.2 - 单元格显示自身。\n\n就是这样。如果你带有 `Model` 类编译修改后的 `Spreadsheet` 类并运行\
  \ `Main` 应用程序，你应该看到一个如 Figure 35.2 所示的窗口。\n\n本节的目标是实现一种设计，使得单元格显示的值与其输入的字符串不同。这个目标显然已经实现，尽管方式非常粗糙。在新的电子表格中，你可以向单元格输入任何内容，但一旦它失去焦点，它将始终显示其坐标。显然，我们还没有完成。\n\
  \n### 35.3 公式\n\n在现实中，电子表格单元格持有两个东西：一个实际值和一个计算该值的公式。电子表格中有三类型的公式：\n\n1. 数值，如 1.22、-3\
  \ 或 0。\n2. 文本标签，如 Annual sales（年销售）、Deprecation（折旧）或 total（总量）。\n3. 从单元格内容计算新值的公式，例如\
  \ \"=add(A1,B2)\" 或 \"=sum(mul(2, A2), C1:D16)\"。\n\n计算值的公式总是以等号开头，后跟一个算术表达式。SCells\
  \ 电子表格对算术表达式有一个特别简单且统一的约定：每个表达式都是某些函数对参数列表的应用。函数名是一个标识符，例如用于二元加法的 `add`，或用于任意数量操作数求和的\
  \ `sum`。函数参数可以是数字、单元格引用、单元格范围的引用（如 `C1:D16`）或另一个函数应用。你稍后会看到 SCells 具有开放式架构。\n\n\
  在上一节中，你看到了不同类型的公式以及它们如何作为字符串显示。在本节中，你将看到如何反转这个过程：将用户输入的字符串转换为 Formula 树。本节的其余部分逐一解释\
  \ `FormulaParsers` 类的不同元素，该类包含了执行转换的解析器。该类构建在第 33 章中提供的组合器框架之上。具体来说，公式解析器是该章节解释的\
  \ `RegexParsers` 类的实例。`FormulaParsers` 对象的前两个元素是标识符和数字的辅助解析器：\n\n```\n package org.stairwaybook.scells\n\
  \  import scala.util.parsing.combinator._\n\n  object FormulaParsers extends RegexParsers\
  \ {\n\n    def ident: Parser[String] = \"\"\"[a-zA-Z_]\\w*\"\"\".r\n    def decimal:\
  \ Parser[String] = \"\"\"-?\\d+(\\.\\d*)?\"\"\"\".r\n```\n\n\n\n如你从上面的第一个正则表达式所示，标识符以字母或下划线开头。随后是任意数量的“单词”字符，这些字符由正则表达式代码\
  \ `\\w` 表示，它可以识别字母、数字或下划线。第二个正则表达式描述十进制数字它由一个可选的负号、一个或多个由正则表达式代码 `\\d` 表示的数字，以及一个由句号后跟零或多个数字组成的可选小数部分组成。\n\
  \n`FormulaParsers` 对象的下一个元素是单元格解析器（cell parser），它识别单元格的坐标，例如 `C11` 或 `B2`。它首先调用正则表达式解析器来确定坐标的格式：单个字母后跟一个或多个数字。该解析器返回的字符串通过将字母与数字部分分离，并将这两个部分转换为单元格列和行的索引，从而转换为单元格坐标：\n\
  \n```\n def cell: Parser[Coord] = \n  \"\"\"[A-Za-z]\\d+\"\"\".r ^^ { s => \n  \
  \  val column = s.charAt(0).toUpper - 'A'\n    val row = s.substring(1).toInt\n\
  \    Coord(row, column)\n  }\n```\n\n注意，单元格解析器有一点限制性，因为它只允许由单个字母组成的列坐标。因此，电子表格的列数实际上被限制最多\
  \ 26 列，因为进一步的列无法被解析。将解析器泛化以使其接受具有多个前导字母的单元格是一个好主意。这留给你来练习。\n\n范围解析器（range parser）识别单元格范围。此类范围由两个单元格坐标以及它们之间的的冒号组成：\n\
  \n```\n def range: Parser[Range] = \n  cell~\":\"~cell ^^ { \n    case c1~\":\"\
  ~c2 => Range(c1, c2) \n  }\n```\n\n数字解析器（number parser）识别十进制数字，它被转换为 `Double` 并封装在\
  \ `Number` 类的实例中：\n\n```scala\n def number: Parser[Number] =\n  decimal ^^ (d =>\
  \ Number(d.toDouble))\n```\n\n应用解析器（application parser）识别函数应用。此类应用由一个标识符以及括号内的参数表达式列表组成：\n\
  \n```\n def application: Parser[Application] = \n  ident~\"(\"~repsep(expr, \",\"\
  )~\")\" ^^ { \n    case f~\"(\"~ps~\")\" => Application(f, ps) \n  }\n```\n\n`expr`\
  \ 解析器识别公式表达式——要么是跟在 `=` 后的顶层公式，要么是函数的参数。这种公式表达式被定义为单元格、单元格范围、数字或一个应用：\n\n```\n def\
  \ expr: Parser[Formula] =\n  range | cell | number | application\n```\n\n这个对 `expr`\
  \ 解析器的定义包含了一个轻微的简化，因为单元格范围应该只出现在函数参数中；它们不应该允许作为顶层公式。你可以修改公式语法，使两种表达式的用法分开，并从语法上将单元格范围从顶层公式中排除。在此处展示的电子表格中，这种错误是在表达式求值时才检测到的。\n\
  \n文本解析器（textual parser）识别任意输入字符串，只要它不以等号开头（回想以 `=` 开头的字符串被视为公式）：\n\n```\n def textual:\
  \ Parser[Textual] = \n  \"\"\"[^=].*\"\"\".r ^^ Textual\n```\n\n公式解析器（formula parser）识别输入单元格的所有合法输入。公式要么是数字，或者是文本输入，或者是以等号开头的公式：\n\
  \n```\n def formula: Parser[Formula] = \n  number | textual | \"=\"~>expr\n```\n\
  \n到此，电子表格单元格的语法结束。最后的方法 `parse` 在一个方法中使用此语法将输入字符串转换为 `Formula` 树：\n\n```scala\n\
  \ def parse(input: String): Formula =\n    parseAll(formula, input) match {\n  \
  \    case Success(e, _) => e\n      case f: NoSuccess => Textual(\"[\" + f.msg +\
  \ \"]\")\n    }\n  } //end FormulaParsers\n```\n\n`parse` 方法使用 `formula` 解析器解析所有输入。如果成功，则返回生成的公式。如果失败，则返回一个带有错误消息的\
  \ `Textual` 对象。\n\n```scala\npackage org.stairwaybook.scells\n  import swing._\n\
  \  import event._\n\n  class Spreadsheet(val height: Int, val width: Int) ... {\n\
  \    val table = new Table(height, width) {\n      ...\n      reactions += {\n \
  \       case TableUpdated(table, rows, column) =>\n          for (row <- rows)\n\
  \            cells(row)(column).formula = \n              FormulaParsers.parse(cells(row)(column).text))\n\
  \      }\n    }\n  }\n```\n列表 35.6 - 一个解析公式的电子表格。\n\n\n\n\n我们需要一个名为 `evaluate` 的方法，它接收一个公式并返回该公式在当前电子表格中的值，表示类型为\
  \ `Double`。我们将此方法放置在一个新的 trait `Evaluator` 中。该方法需要访问 `Model` 类中的 `cells` 字段，以获取公式中引用的单元格的当前值。另一方面，`Model`\
  \ 类也需要调用 `evaluate`。因此，`Model` 和 `Evaluator` 之间存在相互依赖。类类之间这种相互依赖的一种良好方法在第 29 章中展示过：你在一个方向使用继承，在另一个方向使用自类型（self\
  \ types）。\n\n在电子表格示例中，`Model` 类继承自 `Evaluator`，从而获得了对其评估方法的访问权限。要反过来，`Evaluator`\
  \ 类将其自类型定义为 `Model`，如下所示：\n\n```scala\npackage org.stairwaybook.scells\ntrait Evaluator\
  \ { this: Model => ... }\n```\n\n这样，`Evaluator` 类内部的 `this` 值被假设为 `Model`，可以通过编写\
  \ `cells` 或 `this.cells` 来访问 `cells` 数组。\n\n现在连接工作已经完成，我们将专注于定义 `Evaluator` 类的内容。代码列表\
  \ 35.7 展示了 `evaluate` 方法的实现。正如你预期的，该方法包含对不同类型公式的模式匹配。对于坐标 `Coord(row, column)`，它返回\
  \ `cells` 数组在该坐标处的值。对于数字 `Number(v)`，它返回值 `v`。对于文本标签 `Textual(s)`，它返回零。最后，对于一个应用\
  \ `Application(function, arguments)`，它计算所有参数的值，从操作表中检索与函数名对应的函数对象，并将该函数应用于所有参数值。\n\
  \n```scala\ndef evaluate(e: Formula): Double = try {\n  e match {\n    case Coord(row,\
  \ column) => \n      cells(row)(column).value\n    case Number(v) => \n      v\n\
  \    case Textual(_) => \n      0\n    case Application(function, arguments) =>\n\
  \      val argvals = arguments flatMap evalList\n      operations(function)(argvals)\n\
  \  }\n} catch {\n  case ex: Exception => Double.NaN\n}\n```\n\n##### 代码列表 35.7 -\
  \ trait Evaluator 的 evaluate 方法。\n\n操作表将函数名映射到函数对象。它的定义如下：\n\n```scala\ntype Op\
  \ = List[Double] => Double\nval operations = new collection.mutable.HashMap[String,\
  \ Op]\n```\n\n从这个定义中可以看出，`operations` 被建模为从值列表到值的函数。`Op` 类型为操作类型引入了一个方便的别名。\n\n\
  `evaluate` 中的计算被封装在 `try-catch` 块中以防止输入错误。在评估单元格公式时，实际上会有很多问题可能发生：坐标可能超出范围；函数名可能未定义；函数的参数数量可能错误；算术运算可能是非法的或溢出的。对这些错误任何一个的反应都是相同的：返回一个“不是数字”（not-a-number）的值。返回的值\
  \ `Double.NaN` 是对没有可表示的浮点值的计算的 IEEE 表示法。这可能是因为溢出或除以零，例如。代码列表 35.7 中的 `evaluate`\
  \ 方法选择对所有其他类型的错误也返回相同的值。这种方案的优点是简单易懂且不需要大量代码即可实现。它的缺点是所有类型的错误都混在一起，因此电子表格用户无法获得关于哪里错误的任何详细反馈。如果你愿意，可以尝试在\
  \ SCells 应用中使用更精细的方法来表示错误。\n\n参数的评估与顶层公式的评估不同。参数可能是列表，而顶层函数可能不是。例如，`sum(A1:A3)`\
  \ 中的参数表达式 `A1:A3` 返回包含单元格 `A1`、`A2`、`A3` 值的列表。然后该列表被传递给 `sum` 操作。在参数表达式中混合列表和单值也是可能的，例如操作\
  \ `sum(A1:A3, 1.0, C7)`，它将对五个值求和。为了处理可能评估为列表的参数，还有另一个评估函数称为 `evalList`，它接收一个公式并返回一个值列表：\n\
  \n```scala\nprivate evalList(e: Formula): List[Double] = e match {\n  case Range(_,\
  \ _) => references(e) map (_.value)\n  case _ => evaluate(e)\n}\n```\n\n如果传递给 `evalList`\
  \ 的公式是 `Range`，返回的值是一个包含该范围引用的所有单元格的列表。对于其他所有公式，结果是一个包含该公式单值值的列表。公式引用的单元格由第三个函数\
  \ `references` 计算。以下是它的定义：\n\n```scala\ndef references(e: Formula): List[Cell] =\
  \ e match {\n  case Coord(row, column) =>\n    cells(row)(column)\n  case Range(r1,\
  \ c1), Coord(r2, c2) =>\n    for (row <- (r1 to r2).toList; column <- c1 to c2)\n\
  \    yield cells(row)\n  case Application(function, arguments) =>\n    arguments\
  \ flatMap references\n  case _ =>\n    List()\n} // end Evaluator\n```\n\n`references`\
  \ 方法现在实际上比需要的更通用，因为它计算由任何类型公式引用的单元格列表，而不仅仅是 `Range` 公式。稍会发现，增加的功能对于计算需要更新的单元格集合是必要的。方法的体是对是对种类的简单模式匹配。对于\
  \ `Coord(row, column)`，它返回一个包含该坐标单元格的单元素列表。对于范围表达式 `Range(coord1, coord2)`，它返回两个坐标之间的所有单元格，通过\
  \ `for` 表达式计算。对于函数应用 `Application(function, arguments)`，它返回每个参数引用的单元格，通过 `flatMap`\
  \ 连接成单个列表。对于其他类型的公式 `Textual` 和 `Number`，它返回一个空列表。\n\n### 35.6 操作库\n\n`Evaluator`\
  \ 类本身没有定义任何可以在单元格上执行的操作：它的 `operations` 表最初是空的。这种思想是在其他 trait 中定义此类操作，然后将它们混入 `Model`\
  \ 类中。代码列表 35.8 展示了一个实现常用算术操作的示例 trait：\n\n```scala\npackage org.stairwaybook.scells\n\
  trait Arithmetic { this: Evaluator =>\n  operations += List(\n    \"add\" -> { case\
  \ List(x, y) => x + y },\n    \"sub\" -> { case List(x, y) => x - y },\n    \"div\"\
  \ -> { case List(x, y) => x / y },\n    \"mul\" -> { case List(x, y) => x * y },\n\
  \    \"mod\" -> { case List(x, y) => x % y },\n    \"sum\" -> { xs => xs.foldLeft(0.0)(_\
  \ + _) },\n    \"prod\" -> { xs => xs.foldLeft(1.0)(_ * _) }\n  )\n}\n```\n\n#####\
  \ 代码列表 35.8 - 算术操作库。\n\n有趣的是，这个 trait 没有导出的成员。它所做的仅仅是在初始化期间填充 `operations` 表。它通过使用自类型\
  \ `Evaluator` 来访问该表，*即*，与 `Arithmetic` 类访问模型的方法相同。\n\n在 `Arithmetic` trait 定义的七个操作中，五个是二元操作，两个接受任意数量的参数。二元操作遵循相同的模式。例如，加法操作\
  \ `add` 是通过以下表达式定义的：\n\n```scala\n { case List(x, y) => x + y }\n```\n\n\n\n也就是说，它期望一个包含两个元素\
  \ `x` 和 `y` 的参数列表，并返回 `x` 和 `y` 的和。如果参数列表中的元素数量不是两个，则抛出一个 `MatchError`。这对应于 SCell\
  \ 评估模型通用的“让其崩溃”（let it crash）哲学，即预期错误的输入会导致运行时异常，该异常会被评估方法内部的 `try-catch` 捕获。\n\n\
  最后两个操作 `sum` 和 `prod` 接收任意长度的参数列表，并在相邻元素之间插入二元操作。因此，它们是“左折”模式的实例，该模式在 `List` 类中通过\
  \ `/` 操作符表示。例如，要对数字列表 `List(x, y, z)` 求和，该操作会计算 `0 + x + y + z`。第一个操作数 `0` 是列表为空时的结果。\n\
  \n你可以通过在 `Model` 类中混合 `Arithmetic` 特性将此操作库集成到电子表格应用程序中，如下所示：\n\n```\npackage org.stairwaybook.scells\n\
  \n  class Model(val height: Int, val width: Int) \n    extends Evaluator with Arithmetic\
  \ { \n\n  case class Cell(row: Int, column: Int) {\n      var formula: Formula =\
  \ Empty\n      def value = evaluate(formula)\n\n      override def toString = formula\
  \ match {\n        case Textual(s) => s\n        case _ => value.toString\n    \
  \  }\n    }\n\n    ... // 其他部分同前\n  }\n```\n\n`Model` 类中的另一个更改涉及单元格显示自身的方式。在新版本中，单元格的显示值取决于它的公式。如果公式是\
  \ `Textual` 字段，则字面显示字段的内容。在所有其他情况下，公式都会被评估并显示该评估的结果值。\n\n![image images/scells4Gray96.png](img/scells4Gray96.png)\n\
  \n##### 图 35.4 - 执行评估的单元格。\n\n如果你编译了更改后的特性和类并重新启动 `Main` 程序，你将得到一个类似于真实电子表格的东西。图\
  \ 35.4 显示了一个示例。你可以向单元格中输入公式并让它们进行自评估。例如，一旦你关闭了图 35.4 中单元格 `C5` 的编辑焦点，你应该能看到 `86.0`，这是公式\
  \ `sum(C1:C4)` 评估的结果。\n\n然而，仍然缺少一个关键元素。如果你将图 35.4 中单元格 `C1` 的值从 `20` 改为 `100`，单元格\
  \ `C5` 中的和不会自动更新为 `166`。你必须手动点击 `C5` 才能看到值的变化。仍然缺失的是一种让单元格在更改后自动重新计算值的方法。\n\n###\
  \ 35.7 变化传播\n\n如果单元格的值发生了变化，所有依赖该值的单元格都应该重新计算并重新显示结果。实现这一点最简单的方法是在每次更改后重新计算电子表格中每个单元格的值。然而，随着电子表格增大，这种方法的扩展性并不好。\n\
  \n更好的方法是只重新计算那些在公式中引用了已更改单元格的单元格的值。其核心思想是使用基于事件的发布/订阅框架进行变化传播：一旦单元格被分配了一个公式，它将订阅该公式所引用的所有单元格的值变化通知。这些单元格中任一个值的变化将触发订阅单元格的重新评估。如果这种重新评估导致单元格值变化，它反过来会通知所有依赖于它的单元格。该过程将持续，直到所有单元格的值都稳定，*即*，任何单元格的值不再发生变化。\n\
  \n发布/订阅框架在 `Model` 类中实现，使用了 Scala `Swing` 框架的标准事件机制。这是该类的新的（也是最终的）版本：\n\n```scala\n\
  package org.stairwaybook.scells\n  import swing._\n\n  class Model(val height: Int,\
  \ val width: Int) \nextends Evaluator with Arithmetic {\n```\n\n与之前的 `Model` 版本相比，此版本增加了对\
  \ `swing._` 的导入，使得 `Swing` 的事件抽象直接可用。\n\n`Model` 类的主要修改涉及嵌套类 `Cell`。`Cell` 类现在继承自\
  \ `Publisher`，因此它可以发布事件。事件处理逻辑完全包含在两个属性的设置器中：`value` 和 `formula`。这是新版本：\n\n```scala\n\
  case Cell(row: Int, column: Int) extends Publisher {\n  override def toString =\
  \ formula match {\n    case Textual(s) => s\n    case _ => value.toString\n  }\n\
  ```\n\n对于外部来说，`value` 和 `formula` 看起来是 `Cell` 类中的变量。它们的实际实现是私有字段，并配备了公共获取器 `value`\
  \ 和 `formula` 以及设置器 `value=` 和 `formula=`。以下是 `value` 的定义：\n\n```scala\n var v:\
  \ Double = 0\n  def value = v\n  def value=(w: Double) = {\n    if (!(v == w ||\
  \ v.isNaN && w.isNaN)) {\n      v = w\n      publish(ValueChanged(this))\n    }\n\
  \  }\n```\n\n`value=` 设置器将新值 `w` 赋值给私有字段 `v`。如果新值与旧值不同，还会发布一个以单元格为参数的 `Changed`\
  \ 事件。注意判断值是否变化有点棘手，因为涉及到 `NaN`。规范规定 `NaN` 与任何其他值（包括它自己）都不同！因此，判断两个值相同的测试必须特殊处理 `NaN`：如果两个值\
  \ `v`, `w` 使用 `==` 相等，或者它们都是 `NaN`。\n\n`value=` 在发布/订阅框架中执行发布，而 `formula=` 执行订阅：\n\
  \n```scala\n var f: Formula = Empty\n  def formula = f\n  def formula=(f: Formula)\
  \ = {\n    for (c <- references(f)) deafTo(c)\n    this.f = f\n    for (c <- references(f))\
  \ listenTo(c)\n    value = evaluate(f)\n  }\n```\n\n修改后 `Cell` 的最后代码指定了如何对 `Changed`\
  \ 事件做出反应：\n\n```scala\n reactions += {\n  case ValueChanged(_) => value = evaluate(formula)\n\
  }\n```\n\n`ValueChanged` 类也包含在 `Model` 类中：\n\n```scala\ncase class ValueChanged(cell:\
  \ Cell) extends event.Event\n```\n\n`Model` 类的其余部分与之前相同：\n\n```scala\n cells = Array.ofDimCell\n\
  \n  for (i <- 0 until height; j <- 0 until width)\n    cells(i)(j) = new Cell(i,\
  \ j)\n```\n\n\n\n\n```scala\n package org.stairwaybook.scells\n  import swing._,\
  \ event._\n\n  class Spreadsheet(val height: Int, val width: Int) \n    extends\
  \ ScrollPane {\n\n    val cellModel = new Model(height, width)\n    import cellModel._\n\
  \n    val table = new Table(height, width) {\n      ... // settings as in Listing\
  \ ???\n\n      override def rendererComponent(\n              isSelected: Boolean,\
  \ hasFocus: Boolean, \n              row: Int, column: Int) =\n      ... // as in\
  \ Listing ???\n\n      def userData(row: Int, column: Int): String = \n        ...\
  \ // as in Listing ???\n\n      reactions += {\n        case TableUpdated(table,\
  \ rows, column) =>\n          for (row <- rows)\n            cells(row)(column).formula\
  \ = \n              FormulaParsers.parse(userData(row, column))\n        case ValueChanged(cell)\
  \ =>\n          updateCell(cell.row, cell.column)\n      }\n\n      for (row <-\
  \ cells; cell <- row) listenTo(cell)\n    }\n\n    val rowHeader = new ListView(0\
  \ until height) {\n      fixedCellWidth = 30\n      fixedCellHeight = table.rowHeight\n\
  \    }\n\n    viewportView = table\n    rowHeaderView = rowHeader\n  }\n```\n\n\
  ##### Listing 35.9 - 完成的电子表格组件。\n\n电子表格代码现在几乎完全完成了。最后缺失的环节是修改后单元格的重新显示。到目前为止，所有的值传递都只涉及内部的\
  \ `Cell` 值；可见的表格不受影响。改变这种状态的一种方法是在 `value_` set 器中添加一个重绘命令。然而，这将会破坏你到目前为止看到的模型与视图之间的严格分离。一种更模块化的解决方案是通知表格所有的\
  \ `ValueChanged` 事件，并让它自己进行重绘。Listing 35.9 显示了最终的电子表格组件，它实现了这种方案。\n\nListing 35.9\
  \ 中的 `Spreadsheet` 类只有两个新修订。首先，表格组件现在通过 `listenTo` 订阅了模型中的所有单元格。其次，表格的反应中新增了一个 case：如果它被通知了一个\
  \ `Changed(cell)` 事件，它会通过调用 `updateCell(cell.row, cell.column)` 请求对相应的单元格进行重绘。\n\
  \n### 35.8 结论\n\n在本章中开发的电子表格功能完备，尽管在某些地方它采用的是最简单的实现方案而不是对用户最方便的方案。这样，它可以用不到 200\
  \ 行代码就完成。尽管如此，电子表格的架构使得修改和扩展变得简单。如果你想对代码进行进一步实验，这里有一些关于你可以更改或添加内容的建议：\n\n1. 你可以让电子表格可缩放，这样就可以交互式地更改行列数。\n\
  2. 你可以添加新类型的公式。\n3. 你可以添加新类型的公式，例如二进制运算。你可以考虑使用 `Range[Int]` 作为 `N`。\n4. 你可以添加新类型的公式，例如错误处理。\n\
  5. 你可以添加新类型的公式，例如消息。\n\n在开始时，我们强调了 Scala 是具有可扩展性的。Scala 的强大在于它将面向对象的编程和函数式编程结合在一起。电子表格展示了如何使用\
  \ Scala 简洁地构建复杂的系统。\n\n* * *\n\n#### 第 35 章脚注：\n\n[1] 尽管 `this(row, column)` 看起来类似于构造函数。\n\
  [2] `Range[Int]` 是该类型。\n[3] 这假设没有循环依赖。我们将在本章结束讨论这个问题。\n\n## 附录 A\n\n# Unix 和 Windows\
  \ 上的 Scala 脚本\n\n如果你在使用某种版本的 Unix，可以在文件开头添加一个“pound bang”指令，将 Scala 脚本作为 shell 脚本运行。例如，在名为\
  \ `helloarg` 的文件中输入以下内容：\n\n```\n#!/bin/sh\n  exec scala \"$0\" \"$@\"\n!\n  //\
  \ 向第一个参数打招呼\n  println(\"Hello, \" + args(0) + \"!\")\n```\n\n初始的 `#!/bin/sh` 必须是文件的第一行。一旦你设置了执行权限：\n\
  \n```bash\n$ chmod +x helloarg\n```\n\n你可以简单地将 Scala 脚本作为 shell 脚本运行：\n\n```bash\n\
  $ ./helloarg globe\n```\n\n如果你在 Windows 上，可以通过将文件命名为 `helloarg.bat` 并并将此内容放在脚本顶部来实现相同的效果：\n\
  \n```batch\n::#!\n  @echo off\n  call scala %0 %*\n  goto :eof\n::!\n```\n\n# 术语表\n\
  \n**代数数据类型 (algebraic data type)**：通过提供几种替代方案定义的类型，每种方案都有其自己的构造函数。它通常带有一种通过模式匹配来解构类型的方法。该概念出现在规范语言和函数式编程语言中。Scala\
  \ 中可以使用 case class 模拟代数数据类型。\n\n**替代方案 (alternative)**：match 表达式的一个分支。它的形式为 `case\
  \ *pattern* => *expression*。alternative 的另一个名称是 *case*。\n\n**注解 (annotation)**：*annotation*\
  \ 出现在源代码中，并附加到语法的某些部分。注解是计算机可处理的，因此可以使用它们来有效地为 Scala 添加扩展。\n\n**匿名类 (anonymous class)**：由\
  \ Scala 编译器从 `new` 表达式生成的合成子类，在该表达式中，`new` 类或 trait 类名后面跟着大括号。大括号包含匿名子类的体，可以是空的。然而，如果\
  \ `new` 后面的名称引用了一个包含抽象成员的 trait 或类，则必须在定义匿名子类体的大括号内部使这些成员具体。\n\n**匿名函数 (anonymous\
  \ function)**：函数字面量的另一个名称。\n\n\n\n\n\n# apply\n你可以将方法、函数或闭包 `apply`（应用）到参数上，这意味着你在这些参数上调用它。\n\
  \n# argument\n当一个函数被调用时，该函数的每个参数都会接收一个 `argument`（实参）。参数是引用该 `argument` 的变量。`argument`\
  \ 是在调用时传递的对象。此外，应用程序可以接收（命令行）参数，这些参数会出现在传递给单例对象 `main` 方法的 `Array[String]` 中。\n\n\
  # assign\n你可以将一个对象 `assign`（赋值）给一个变量。之后，该变量将引用该对象。\n\n# auxiliary constructor\n\
  辅助构造函数定义在类定义的大括号内部的额外构造函数，它们看起来像命名为 `this` 的方法定义，但没有结果类型。\n\n# block\n一个由大括号包围的一个或多个表达式和声明。当块求值时，其所有的表达式和声明都会按顺序处理，然后块将最后一个表达式的值作为其自身的值返回。块通常用作函数体、表达式、`while`\
  \ 循环以及任何你想将一组语句组合在一起的地方。更正式地说，块是一种封装结构，你只能看到它的副作用和结果值。定义类或对象的大括号并不构成一个块，因为字段和方法（定义在这些大括号内部）从外部是可见的。这种大括号构成了一个\
  \ `template`（模板）。\n\n# bound variable\n表达式的 `bound variable`（绑定变量）是指在表达式内部既被使用又定义的变量。例如，在函数字面量表达式\
  \ `(x: Int) => (x, y)` 中，变量 `x` 和 `y` 都被使用了，但只有 `x` 是绑定的，因为它在表达式中被定义为 `Int`，并且是该表达式所描述函数的唯一参数。\n\
  \n# by-name parameter\n在参数类型前标记有 `=>` 的参数，例如 `(x: => Int)`。对应于 by-name（按名传递）参数的\
  \ `argument` 并不是在方法被调用之前求值，而是在方法内部每次 `by name`（按名）引用该参数时都会求值。如果参数不是按名的，它就是 `by-value`（按值传递）的。\n\
  \n# by-value parameter\n在参数类型前没有标记有 `=>` 的参数，例如 `(x: Int)`。对应于 by-value（按值传递）参数的\
  \ `argument` 在方法被调用之前就会求值。by-value 参数与 `by-name` 参数相反。\n\n# class\n用 `class` 关键字定义，`class`\
  \ 可以是抽象的，也可以是具体的，并在实例化时可以用类型和值参数化。在 `\"new ArrayString\"` 中，被实例化的类是 `Array`，结果值的类型是\
  \ `Array[String]`。带有类型参数的类被称为 `type constructor`（类型构造器）。可以说一个类型有一个类，例如：类型 `Array[String]`\
  \ 的类是 `Array`。\n\n# closure\n一种捕获自由变量的函数对象，并被认为对于创建时可见的变量“闭包”了。\n\n# companion class\n\
  与同一源文件中定义的单例对象同名的类。该类就是该单例对象的 `companion class`（伴随类）。\n\n# companion object\n与同一源文件中定义的类同名的单例对象。伴随对象和类可以访问对方的私有成员。此外，在伴随对象定义的任何隐式转换在类被使用的任何地方都是有效的。\n\
  \n# contravariant\n可以通过在类型参数前加上减号 `-` 将 `contravariant`（逆变）注解应用于类或 trait 的类型参数。此时该类或\
  \ trait 就会以逆变的方式（即与被标记参数相反的方向）形成子类型。例如，`Function1` 在其第一个类型参数上是逆变的，因此 `Function1[Any,\
  \ Any]` 是 `Function1[String, Any]` 的子类。\n\n# covariant\n可以通过在类型参数前加上加号 `+` 将 `covariant`（协变）注解应用于类或\
  \ trait 的类型参数。此时该类或 trait 就会以协变的方式（即与被标记参数相同的方向）形成子类型。例如，`List` 在其类型参数上是协变的，过因所以\
  \ `List[String]` 是 `List[Any]` 的子类。\n\n# currying\n一种编写带有多个参数列表函数的方法。例如 `def f(x:\
  \ Int)(y: Int)` 是一个带有两个参数列表的柯里化函数。柯里化函数通过传递多个参数列表来应用，如：`f(3)(4)`。然而，也可以编写柯里化函数的\
  \ `partial application`（偏函数应用），例如 `f(3)`。\n\n# declare\n你可以 `declare`（声明）一个抽象字段、方法或类型，这为实体提供了一个名称但没有提供实现。声明与定义（definition）之间的关键区别在于，定义为命名实体建立了实现，而声明没有。\n\
  \n# define\n在 Scala 程序中 `define`（定义）某个事物是给它一个名称和实现。你可以定义类、trait、单例对象、字段、方法、局部函数、局部变量等等。由于定义总是涉及某种实现，因此抽象成员是被\
  \ `declared`（声明）的而不是定义的。\n\n# direct subclass\n类是其直接父类的 `direct subclass`（直接子类）。\n\
  \n# direct superclass\n类或 trait 立即派生出的类，即其在继承层次结构中上方最近的类。如果在类 `Child` 的可选 `extends`\
  \ 中提到了类 `Parent`，那么 `Parent` 就是 `Child` 的直接父类。\n\n# equality\n在没有限定的情况下，`equality`（相等性）是值之间的关系。参见\
  \ `==`。\n\n# expression\n任何产生结果的 Scala 代码。你也可以说一个表达式 `evaluates to`（求值为）结果或 `results\
  \ in`（产生）值。\n\n# filter\nfor 表达式中紧随 `if` 的布尔表达式。在 `for(i <- 10; if i % 2 == 0)`\
  \ 中，filter 是 `\"if i % 2 == 0\"`。\n\n# filter expression\n`filter expression` 是\
  \ for 表达式中 `if` 之后的布尔表达式。在 `for(i <- 10; if i % 2 == 0)` 中，filter expression 是 `\"\
  i % 2 == 0\"`。\n\n# for comprehension\n`for expression` 的另一种写法。\n\n# free variable\n\
  # function\n`function` 可以通过一组参数来产生结果。函数具有参数列表、体和结果类型。作为类、trait 或单例对象成员的函数称为 *methods*。定义在函数内部的函数称为\
  \ *local functions*。结果类型为 Unit 的函数称为 *procedures*。源代码中的匿名函数称为 *function literals*。\n\
  \n# function literal\nScala 源代码中没有函数，用函数字面量语法指定。例如，`(x: Int, y: Int) => x + 1`。\n\
  \n# first-class function\nScala 支持 *first-class function*（一等函数），这意味着你可以用 *function\
  \ literal* 语法表示函数，即 `(x: Int) => x + 1`，并且函数可以用对象来表示，这些对象被称为 *function values*。\n\
  \n\n\n\n\n### value\n可以像任何其他函数一样调用的函数对象。函数值的类扩展了 `scala` 包中的某个 `FunctionN` 特性（例如\
  \ `Function0`、`Function1`），通常在源代码中通过`函数字面量`（function literal）语法表示。当函数值的 `apply`\
  \ 方法被调用时，它会被“调用”。捕获了自由变量的函数值是一个闭闭包（closure）。\n\n### functional style\n`函数式风格`强调函数和求值结果，并弱化操作发生的顺序。该风格的特点是将函数值传递给循环方法、使用不可变数据以及无副作用的方法。它是\
  \ `Haskell` 和 `Erlang` 等语言的主导范式，与`命令式风格`（imperative style）形成对比。\n\n### generator\n\
  `generator` 定义了一个命名的 `val` 并在 `for` 表达式中为其分配一系列值。例如，在 `for(i <- 1 to 10)` 中，生成器是\
  \ `\"i <- 1 to 10\"`。`<-` 右侧的值是`生成器表达式`（generator expression）。\n\n### generator\
  \ expression\n`generator expression` 在 `for` 表达式中生成一系列值。例如，在 `for(i <- 1 to 10)`\
  \ 中，生成器表达式是 `\"1 to 10\"`。\n\n### generic class\n接受类型参数的类。例如，由于 `scala.List` 接受一个类型参数，因此\
  \ `scala.List` 是泛型类。\n\n### generic trait\n接受类型参数的 trait。例如，由于 `trait scala.collection.Set`\
  \ 接受一个类型参数，因此它是泛型 trait。\n\n### helper function\n其目的是为附近的一个或多个其他函数提供服务的函数。辅助函数通常实现为局部函数。\n\
  \n### helper method\n作为类成员的辅助函数。辅助方法通常是私有的。\n\n### immutable\n如果一个对象在创建后无法以任何对客户端可见的方式更改其值，则该对象是`immutable`的（不可变的）。对象可能是不可变的，也可能是可变的。\n\
  \n### imperative style\n`命令式风格`编程强调操作的仔细排序，以确保效果按正确的顺序发生。该风格的特点是使用循环进行迭代、原地修改数据以及具有副作用的方法。它是\
  \ `C`、`C++`、`C#` 和 `Java` 等语言的主导范式，与`函数式风格`形成对比。\n\n### initialize\n在 Scala 源代码中定义变量时，必须用一个对象对其进行`initialize`（初始化）。\n\
  \n### instance\n`instance`（实例）或类实例是一个对象，这是一个只存在于运行时的概念。\n\n### instantiate\n`instantiate`（实例化）一个类类创建一个新对象，该操作只在运行时发生。\n\
  \n### invariant\n`Invariant`（不变性）有两种用法。它可以指当数据结构构造良好时始终成立的属性。例如，排序二叉树的一个不变性是：如果每个节点有右子节点，则该节点在其右子节点之前有序。`Invariant`\
  \ 有时也用作非变（nonvariant）的同义词：“class Array 在其类型参数上是不变的”。\n\n### invoke\n你可以对参数`invoke`（调用）方法、函数或闭包，这意味着它的体将使用指定的参数进行执行。\n\
  \n### JVM\n`JVM` 是 Java 虚拟机，或`runtime`（运行时），用于托管运行中的 Scala 程序。\n\n### literal\n\
  1、`\"One\"` 和 `(x: Int) => x + 1` 都是`literals`（字面量）的示例。字面量是描述对象的简写方式，这种简写完全镜像了创建对象的结构。\n\
  \n### local function\n`local function`（局部函数）是定义在块内部的 `def`。相比之下，作为类、trait 或单例对象成员定义的\
  \ `def` 被称为方法（method）。\n\n### local variable\n`local variable`（局部变量）是定义在块内部的 `val`\
  \ 或 `var`。虽然与局部变量相似，但函数的参数不被称为局部变量，而简单称为参数或不带“local”前缀的“变量”。\n\n### member\n`member`（成员）是类、trait\
  \ 或单例对象模板的任何命名元素。可以通过其所有者的名称、点和其简单名称来访问成员。例如，定义在类中的顶层字段和方法是该类的成员。定义在类内部的 trait 是其闭包类的成员。在类中用\
  \ `type` 关键字定义的类型是该类的成员。类是其定义所在包的成员。相比之下，局部变量或局部函数不是其周围块的成员。\n\n### message\nActor\
  \ 之间通过互相发送 `messages`（消息）进行通信。发送消息不会中断接收者正在执行的操作。接收者可以等待直到完成当前活动并重新建立其不变性。\n\n###\
  \ meta-programming\n元编程软件是指输入本身是软件的软件。编译器是元程序，`scaladoc` 等工具也是如此。为了对 `annotation`（注解）进行任何操作，需要元编程软件。\n\
  \n### method\n`method`（方法）是作为某些类、trait 或单例对象成员的函数。\n\n### mixin\n当 trait 被用于混入组合时，它被称为\
  \ `Mixin`。换句话说，在 \"trait Hat\" 中，`Hat` 只是一个 trait，但在 \"new Cat extends AnyRef with\
  \ Hat\" 中，`Hat` 可以是一个 mixin。\n\n### mixin composition\n将 trait 混合到类或其他 trait 中的过程。`Mixin\
  \ composition` 与传统的多继承的区别在于，在定义 trait 的点，超类的类型是未知的，而是每次 trait trait 被混合时都会重新确定的。\n\
  \n### modifier\n一种以某种方式限定类、trait、字段或方法的关键字。例如，`private` 修饰符表示类、trait、字段或方法是私有的。\n\
  \n### multiple definitions\n如果使用语法 `val v1, v2, v3 = exp`，可以在 `multiple definitions`（多次定义）中分配同一个表达式。\n\
  \n### nonvariant\n类或 trait 的类型参数默认是非变的（`nonvariant`）。当该参数变化时，类或 trait 不产生子类型。例如，由于类\
  \ Array 是非变的，`Array[String]` 既不是 `Array[Any]` 的子类型也不是超类型。\n\n### operation\n在 Scala\
  \ 中，每个 `operation`（操作）都是方法调用。方法可以在 `operator notation`（运算符符号）中调用，例如 `b + 2`，在这种符号下\
  \ `+` 是一个运算符（operator）。\n\n### parameter\n函数可以接受零到多个 `parameters`（参数）。每个参数都有名称和类型。参数和实的区别在于，实是指函数调用时传递的实际对象。参数是指引用这些传入对象的变量。\n\
  \n### parameterless function\n不接受任何参数的函数，定义时不带任何空括号。无参数函数的调用可以不提供括号。这支持了`uniform\
  \ access principle`（统一访问原则），它允许将 `def`改为 `val` 而无需更改客户端代码。\n\n### parameterless\
  \ method\n`parameterless method`（无参数方法）是作为类、trait 或单例对象成员的无参数函数。\n\n### parametric\
  \ field\n定义为类参数的字段。\n\n### partially applied function\n在表达式中使用但缺少某些参数的函数。例如，如果函数\
  \ `f` 的类型为 `Int => Int => Int`，那么 `f` 和 `f(1)` 都是 `partially applied functions`（部分应用函数）。\n\
  \n### path-dependent type\n如 `swiss.cow.Food` 这样的类型。`swiss.cow` 部分是一个 `path`（路径），形成了对对象的引用。该类型的含义取决于你访问它时使用的路径。例如，`swiss.cow.Food`\
  \ 和 `fish.Food` 是不同的类型。\n\n### pattern\n在 match 表达式的变分支中，`pattern`（模式）跟在每个 `case`\
  \ 关键字之后，并位于 `pattern guard`（模式守卫）或 `=>` 符号之前。\n\n\n\n\n\n### pattern guard\n在匹配表达式的分支中，`pattern\
  \ guard`（模式守卫）可以跟在`pattern`之后。例如，在 `\"case x if x % 2 == 0 => x + 1\"` 中，模式守卫是 `\"\
  if x % 2 == 0\"`。只有当模式匹配且模式守卫返回真时，该分支才会被选中。\n\n### predicate\n`predicate`（谓词）是一个返回布尔值类型的函数。\n\
  \n### primary constructor\n类的主构造函数，它在必要时调用父类构造函数，将字段初始化为传递的值，并执行类类大括号之间定义的任何顶层代码。仅对未传递给父类构造函数的值参数进行初始化，但在类体中未使用且因此可以被优化的字段除外。\n\
  \n### procedure\n`procedure`（过程）是一个结果类型为 `Unit` 的函数，因此它的执行完全是为了产生副作用。\n\n### reassignable\n\
  变量可以是 `reassignable`（可重新赋值的），也可以不是。`var` 是可赋值的，而 `val` 则不是。\n\n### recursive\n如果函数调用自身，则该函数是\
  \ `recursive`（递归的）。如果函数唯一调用自身的地方是函数的最后一个表达式，则该函数是 `tail recursive`（尾递归的）。\n\n###\
  \ reference\n`reference`（引用）是 Java 对指针的抽象，用于唯一标识位于 JVM 堆上的对象。引用类型变量持有指向对象的引用，因为引用类型（`AnyRef`\
  \ 的实例）被实现为位于 JVM 堆上的 Java 对象。相比之下，值类型变量有时可能持有引用（指向装箱后的类型），有时不持有（当对象被表示为原始类型值时）。泛而言之，Scala\
  \ 变量 `refers`（引用）某个对象。“refers”一词比“holds a reference”（持有引用）更抽象。如果一个类型为 `scala.Int`\
  \ 的变量当前被表示为原始 Java int 值，那么该变量仍然 `refers` `Int` 对象，但不涉及任何引用。\n\n### reference equality\n\
  `reference equality`（引用相等性）意味着两个引用指向完全同一个 Java 对象。仅对于引用类型，可以通过调用 `AnyRef` 中的 `eq`\
  \ 方法来确定引用相等性。（在 Java 程序中，可以使用 Java 引用类型上的 `==` 来确定引用相等性。）\n\n### reference type\n\
  `reference type`（引用类型）是 `AnyRef` 的子类。引用类型的实例在运行时始终位于 JVM 堆上。\n\n### referential\
  \ transparency\n函数的一种属性，其独立于时间上下文且没有副作用。这被称为引用透明性。对于特定的输入，引用透明函数的调用可以用其结果来替换，而不会改变程序的语义。\n\
  \n### refers\n运行中的 Scala 程序中的变量始终 `refers`（引用）某个对象。即使该变量被赋值为 `null`，它在概念上也引用 `Null`\
  \ 对象。在运行时，对象可能由 Java 对象或原始类型的值实现，但 Scala 允许程序员以更高抽象层级构构其运行的代码。另参见 `reference`。\n\
  \n### refinement type\n通过在花括号内为基础类型提供若干成员而形成的类型。花括号中的成员精炼了基础类型中存在的类型。例如，“吃草的动物”的类型是\
  \ `Animal { type SuitableFood = Grass }`。\n\n### result\nScala 程序中的表达式会产生一个 `result`（结果）。Scala\
  \ 中每个表达式的结果都是一个对象。\n\n### result type\n方法的 `result type`（结果类型）是调用该方法产生的值的类型。（在 Java\
  \ 中，此概念被称为返回类型。）\n\n### return\nScala 程序中的函数 `returns`（返回）一个值。你可以称这个值为函数的 `result`。你也可以说函数\
  \ `results in`（产生）该值。Scala 中每个函数的结果都是一个对象。\n\n### runtime\n托管运行 Scala 程序的 Java 虚拟机，或\
  \ `JVM`。`Runtime`（运行时）既包含了由 Java 虚拟机规范定义的虚拟机，也包含了了 Java API 和标准 Scala API 的运行时库。短语\
  \ `at run time`（`run` 和 `time` 之间有空格）意味着程序正在运行时，与编译时（compile time）形成对比。\n\n### runtime\
  \ type\n对象在运行时类型。作为对比，`static type`（静态类型）是表达式在编译时的类型。大多数运行时类型仅仅是不带类型参数的裸类。例如，“Hi”的运行时类型是\
  \ `String`，而 `(x: Int) => x + 1` 的运行时类型是 `Function1`。可以使用 `isInstanceOf` 测试运行时类型。\n\
  \n### script\n包含顶层定义和语句的文件，可以直接用 `scala` 运行而无需显式编译。脚本必须以表达式结束，而不是定义。\n\n### selector\n\
  在匹配表达式中被匹配的值。例如，在 `\"s match { case _ => }\"` 中，selector 是 `s`。\n\n### self type\n\
  trait 的 `self type`（自类型）是 `this`（即接收者）的假设类型，用于 trait 内部。任何混入该 trait 的具体类都必须确保其类型符合该\
  \ trait 的自类型。自类型最常见的用法是将一个大类划分为若干 trait，如 第 29 章 所示。\n\n### semi-structured data\n\
  `semi-structured data`（半结构化数据）是 XML。它比扁平文件更有结构，但还没有达到编程语言的完整结构。\n\n### serialization\n\
  你可以将对象 `serialize`（序列化）为字节流，然后将其保存或通过网络传输。稍后可以在不同的计算机上 `deserialize`（反序列化）该字节流，并获得与原始相同的对象。\n\
  \n### shadow\n局部变量的新声明会 `shadow`（遮蔽）闭包作用域中的变量。\n\n### signature\n`Signature` 是 `type\
  \ signature`（类型签名）的缩写。\n\n### singleton object\n用 `object` 关键字定义的对象。每个单例对象只有一个且仅实例。与类同名且定义在同类源文件中的单例对象是该类的\
  \ `companion object`（伴随对象）。该类是它的 `companion class`。没有伴随类的单例对象是 `standalone object`（独立立立对象）。\n\
  \n### statement\n表达式、定义或导入，即 `i.e.`，可以放入 Scala 源代码中的模板或块的内容。\n\n### static type\n\
  参见 `type`。\n\n### subclass\n类是其所有父类和父 trait 的 `subclass`（子类）。\n\n### subtrait\n\
  trait 是其所有父 trait 的 `subtrait`（子 trait）。\n\n### subtype\nScala 编译器允许将某个类型的任何 `subtypes`（子类型）在任何需要该类型的地方作为替代品。对于不带类型参数的类和\
  \ trait，子类型关系反映了子类关系。例如，如果类 `Cat` 是抽象类 `Animal` 的子类，且两者都不带类型参数，那么类型 `Cat` 就是类型 `Animal`\
  \ 的子类型。同样，如果 trait `Apple` 是 trait `Fruit` 的子 trait，且两者都不带类型参数，那么类型 `Apple` 就是类型\
  \ `Fruit` 的子类型。然而，对于带有类型参数的类和 trait，变性会起作用。例如，因为抽象类 `List` 被声明在其单一类型参数上是协变的（i.e.,\
  \ `List` 被声明为 `List[+A]`），所以 `List[Cat]` 是 `List[Animal]` 的子类型，`List[Apple]` 是 `List[Fruit]`\
  \ 的子类型。尽管这些类型的类都是 `List`，这些子类型关系仍然存在。相比之下，由于 `Set` 没有声明在其类型参数上是协变的（i.e., `Set` 被声明为\
  \ `Set[A]` 且没有加号），`Set[Cat]` *不是* `Set[Animal]` 的子类型。子类型应该正确实现其父类型的契约，以符合里氏替换原则，但编译器只在类型检查层面验证这一属性。\n\
  \n### superclass\n类的 `superclasses`（父类）包括其直接父类、其直接父类的直接父类，依此类推，一直到 `Any`。\n\n\n\n\
  \n\n### superpertrait (父级 trait)\n类或 trait 的 `supertraits`（如果有）包含了所有直接混入该类或 trait\
  \ 或其任何父类的 trait，加上这些 trait 的任何父级 superpertrait。\n\n### supertype (父类型)\n一个类型是其所有子类型的\
  \ `supertype`。\n\n### synthetic class (合成类)\n`synthetic class` 是由编译器自动生成的，而不是由程序员手动编写。\n\
  \n### tail recursive (尾递归)\n如果一个函数唯一调用自身的地方是函数的最后一个操作，则该函数是 `tail recursive`（尾递归）。\n\
  \n### target typing (目标类型)\n`Target typing` 是类型推断的一种，它考虑了预期的类型。例如，在 `nums.filter((x)\
  \ => x > 0)` 中，Scala 编译器推断出 `x` 的类型为 `nums` 的元素类型，因为 `filter` 方法会在 `nums` 的每个元素上调用该函数。\n\
  \n### template (模板)\n`template` 是类、trait 或单例对象定义的体。它定义了类、trait 或对象的类型签名、行为和初始状态。\n\
  \n### trait (特征)\n用 `trait` 关键字定义的 `trait` 类似于抽象类，它不能接受任何值参数，并且可以通过被称为 `mixin composition`（混入组合）的过程“混入”类或其他\
  \ trait 中。当一个 trait 被混入类或 trait 时，它被称为 `mixin`。一个 trait 可以用一个或多个类型参数化。当用类型参数化时，该\
  \ trait 会构造出一个类型。例如，`Set` 是一个接受单个类型参数的 trait，而 `Set[Int]` 是一个类型。此外，`Set` 被称为类型 `Set[Int]`\
  \ 的“trait  {”。\n\n### type (类型)\nScala 程序中的每个变量和表达式都有一个在编译时已知的 `type`（类型）。类型限制了变量在运行时可以引用的可能值，或表达式可以产生的可能值。在必要时，为了区别于对象的\
  \ `runtime type`（运行时类型），变量或表达式的类型也可以称为 `static type`（静态类型）。换句话说，“type”本身指的是静态类型。类型与类不同，因为接受类型参数的类可以构造出许多类型。例如，`List`\
  \ 是一个类，但不是一个类型。`List[T]` 是一个带有自由类型参数的类型。`List[Int]` 和 `List[String]` 也是类型（称为 `ground\
  \ types`，因为它们没有自由类型参数）。类型可以拥有一个“类”或“trait”。例如，类型 `List[Int]` 的类是 `List`。类型 `Set[String]`\
  \ 的 trait 是 `Set`。\n\n### type constraint (类型约束)\n某些注解是 `type constraints`（类型约束），意味着它们对类型所包含的值添加了额外的限制或约束。例如，`@positive`\
  \ 可能是类型 `Int` 的一种类型约束，将 32 位整数类型限制为正数。标准的 Scala 编译器不检查类型约束，而是必须由额外的工具或编译器插件进行检查。\n\
  \n### type constructor (类型构造器)\n接受类型参数的类或 trait。\n\n### type parameter (类型参数)\n\
  泛型类或泛型方法的参数，必须由一个类型来填充。例如，`class List` 定义为“class List[T] { ...”，而对象 `Predef` 的成员方法\
  \ `identity` 定义为“def identityT = x”。在这两种情况下，`T` 都是类型参数。\n\n### type signature (类型签名)\n\
  方法的 `type signature` 包括它的名称、参数的数量、顺序和类型（如果有），以及它的结果类型。类、trait 或单例对象的类型签名包括它的名称、所有成员和构造函数的类型签名，以及声明的继承和\
  \ mixin 关系。\n\n### uniform access principle (统一访问原则)\n`uniform access principle`（统一访问原则）规定变量和无参数函数应该使用相同的语法访问。Scala\
  \ 通过不允许在无参数函数的调用处放置括号来支持这一原则。因此，无参数函数的定义可以更改为 `val`，或者*反之亦然*，而不影响客户端代码。\n\n### unreachable\
  \ (不可达的)\n在 Scala 层面，对象可能会变得 `unreachable`（不可达的），此时它们占据的内存可能会被运行时回收。`unreachable`\
  \ 并不意味着未被引用（unreferenced）。引用类型（`AnyRef` 的实例）被实现为位于 JVM 堆上的对象。当一个引用类型的实例变为不可达的时，它确实变成了未被引用，并且可以进行垃圾回收。值类型（`AnyVal`\
  \ 的实例）既实现为原始类型值，也实现为 Java 包装类型（如 `java.lang.Integer`）的实例，它们位于堆上。值类型实例在引用它们的变量的生命周期内，可以被装箱（从原始值转换为包装对象）和解箱（从包装对象转换为原始值）。\n\
  \n### unreferenced (未被引用的)\n见 `unreachable`。\n\n### value (值)\n任何计算或表达式的结果都是 `value`，在\
  \ Scala 中 `value` 指的是对象。\n\n### value type (值类型)\n`value type` 是 `AnyVal` 的任何子类，例如\
  \ `Int`、`Double` 或 `Unit`。\n\n### variable (变量)\n引用对象的命名实体。变量可以是 `val` 或 `var`。所有\
  \ `val` 和 `var` 必须在定义时初始化，但只有 `var` 可以重新赋值引用不同的对象。\n\n### variance (变性)\n类或 trait\
  \ 的类型参数可以用 `variance`（变性）注解标记，即协变 (+) 或逆变 (-)。此类变性注解指示了泛型类的子类型如何工作。例如，泛型类 `List`\
  \ 在其类型参数上是协变的，因此 `List[String]` 是 `List[Any]` 的子类型。默认情况下（即缺失 `+` 或 `-` 注解时），类型参数是不变的（`nonvariant`）。\n\
  \n### wildcard type (通配类型)\n通配类型包括对未知类型的引用。例如，`Array[_]` 是一个通配类型。它是一个元素类型完全未知的数组。\n\
  \n### yield\n表达式可以 `yield` 一个结果。`yield` 关键字指定 `for` 表达式的结果。\n\n# Bibliography\n\n\
