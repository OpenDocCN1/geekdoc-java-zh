  \ 在完成版本方面的帮助。最后，我们感谢 Julien Richard-Foy 为使这本书的第四版保持最新所做的工作。\n\n# 引言\n\n本书是 Scala\
  \ 编程语言的教程，由直接参与开发的人编写。我们的目标是，通过阅读这本书，你可以学习到成为高效 Scala 程序员所需的所有知识。书中的所有示例都可以在 Scala\
  \ `2.13` 中编译。\n\n## 谁应该读这本书\n\n本书的主要目标读者是想要学习用 Scala 编程的程序员。如果你想用 Scala 来完成你的下一个软件项目，那么这本书适合你。此外，这本书对于希望通过学习新概念来开宽视野的程序员来说也应该是有趣的。例如，如果你是一个\
  \ Java 程序员，阅读这本书将让你接触到许多函数式编程的概念以及高级的面向对象思想。我们相信，学习 Scala 及其背后的思想可以帮助你成为更优秀的程序员。\n\
  \n假设读者已具备通用编程知识。虽然 Scala 是一门很好的入门编程语言，但这本书不是用来学习编程的。\n\n另一方面，不需要特定的编程语言知识。尽管大多数人在\
  \ Java 平台上使用 Scala，但本书并不假设你了解任何 Java。然而，我们预计许多读者熟悉 Java，因此我们将 Scala 与 Java 进行比较以帮助这类读者。\n\
  \n## 如何使用这本书\n\n由于本书的主要用途是教程，建议的阅读方式是按章节从头开始。我们努力一次只介绍一个主题，并仅用已介绍的主题解释新主题。因此，如果你跳到最后提前看某个内容，可能会发现它是用你还不完全理解的概念来解释的。只要你按顺序阅读章节，我们认为循序渐进地掌握\
  \ Scala 会非常简单。\n\n如果你看到不熟悉的术语，请务必查看术表和索引。许多读者会扫读书的一部分，这完全没关系。当你快速跳过某些内容时，术表和索引可以帮助你回溯。\n\
  \n\n\n\n\n在你读完这本书后，它也应该可以作为语言参考。Scala 语言有一份正式的规范，但该规范为了追求精确性往往牺牲了可读性。虽然这本书没有涵盖 Scala\
  \ 的每一个细节，但它非常全面，当你变得越来越精通 Scala 编程时，它可以作为一份易于上手的语言参考。\n\n### 如何学习 Scala\n\n仅仅通过从头到尾阅读这本书，你就能学到很多\
  \ Scala 知识。不过，如果你做一些额外的工作，可以更快、更彻底地学习 Scala。\n\n首先，你可以利用书中包含的许多程序示例。手动输入这些示例是强迫大脑思考过每一行代码的方法。尝试变体则是让它们变得更有趣，并确保你真正理解了它们的工作原理。\n\
  \n其次，保持与众多在线论坛的联系。这样，你和其他 Scala 爱好者就可以互相帮助。这里有许多邮件列表、讨论论坛、聊天室、wiki 以及多个针对 Scala\
  \ 的文章订阅。花些时间找到适合你信息需求的平台。你将在细小问题上花费的时间会大大减少，从而可以将精力花在更深层次、更重要的问题上。\n\n最后，当你读了足够的内容后，尝试自己写一个编程项目。从零开始编写一个小型程序，或者为一个更大的程序开发一个插件。仅仅通过阅读取得的进步是有限的。\n\
  \n### 电子书特性\n\n本书有纸质版和 PDF 电子书两种形式。电子书并非纸质版的简单电子副本。虽然内容与纸质版相同，但电子书专门针对电脑屏幕的阅读进行了仔细的设计和优化。\n\
