  \ Patricia 字典树实现的映射。我们将这个映射称为 `PrefixMap`，这意味着它提供了一个方法 `withPrefix` 方法，用于选择所有以给定前缀开头的键的子映射。\n\
  \n我们首先将根据图 25.2 中所示的键定义一个前缀映射：\n\n```\nscala> val m = PrefixMap(\"abc\" -> 0, \"\
  abd\" -> 1, \"al\" -> 2,\n  \"all\" -> 3, \"xy\" -> 4)\n  m: PrefixMap[Int] = Map((abc,0),\
  \ (abd,1), (al,2), (all,3),\n  (xy,4))\n```\n\n然后对 `m` 调用 `withPrefix` 将产生另一个前缀映射：\n\
  \n```\nscala> m withPrefix \"a\"\n  res14: PrefixMap[Int] = Map((bc,0), (bd,1),\
  \ (l,2), (ll,3))\n```\n\n代码列表 25.15 和 25.16 显示了 `PrefixMap` 的定义。它将字符串与任何类型的值关联起来，因此它有一个类型参数\
  \ `A` 用于映射的值。在你们之前在 RNA 链示例中见过的模式中，该类扩展了 `mutable.Map` 和 `MapOps`。继承实现类 `MapOps`\
  \ 是为了在使用 `filter` 和 `take` 等转换时获得正确的返回类型。\n\n前缀映射节点有两个可变字段：`suffixes` 和 `value`。`value`\
  \ 字段包含一个与节点关联的可选值。它初始化为 `None`。`suffixes` 字段包含一个从字符到 `PrefixMap` 值的映射。它初始化为空映射。你可能会问，为什么我们选择不可变映射作为\
  \ `suffixes` 的实现类型？既然 `PrefixMap` 本身也是可变的，使用可变映射不是更符合标准吗？答案是，只包含少数几个元素的不可变映射在空间和执行时间上都是非常高效的。\n\
  \n例如，包含少于五个元素的映射被表征为单个对象。相比之下，如第 17.2 节 所述，标准的可变映射是 `HashMap`，即使它是空的，通常也会占用大约 80\
  \ 字节。因此，如果小型集合很常见，那么选择不可变的比可变的更好。在 Patricia 字典树的情况下，我们预计除了树最顶端的节点外，大多数节点只包含少数后继节点。因此，将这些后继节点存储在不可变映射中可能更高效。\n\
  \n现在看看映射需要实现的第一个方法：`get`。算法如下：要获取前缀映射中与空字符串关联的值，只需选择存储在树根节点中的可选值即可。否则，如果键字符串不为空，则尝试选择与字符串第一个字符对应的子映射。如果返回了映射，则紧接着在该映射中查找键字符串第一个字符之后的剩余部分。如果选择失败，则映射中未存储该键，因此返回\
  \ `None`。这种对可选值（option value）的组合选择使用 `flatMap` 优雅地表达。当 `flatMap` 应用于可选值 `ov` 和一个闭包\
  \ `f`（该闭包又返回一个可选值）时，如果 `ov` 和 `f` 都返回了定义的值，则 `ov flatMap f` 将成功。否则，`ov flatMap f`\
  \ 将返回 `None`。\n\n可变映射需要实现的另外两个方法是 `addOne` 和 `subtractOne`。`subtractOne` 方法与 `get`\
  \ 非常相似，区别在于返回任何关联值之前，包含该值的字段被设置为 `None`。`addOne` 方法首先调用 `withPrefix` 导航到需要更新的树节点，然后将该节点的\
  \ `value` 字段设置为给定的值。`withPrefix` 方法遍历树，如果某些字符前缀尚未作为路径包含在树中，则根据需要创建子映射。\n\n可变映射需要实现的最后一个抽象方法是\
  \ `iterator`。此方法需要产生一个迭代器，产生存储在映射中的所有键值对。对于任何给定的前缀映射，该迭代器由以下部分组成：首先，如果映射在其根节点的 `value`\
  \ 字段中包含一个定义的值 `Some(x)`，那么 `(\"\", x)` 就是迭代器返回的第一个元素。此外，迭代器需要遍历 `suffixes` 字段中存储的所有子映射的迭代器，但它需要在这些迭代器返回的每个键字符串前面添加一个字符。更准确地说，如果\
  \ `m` 是通过一个字符从根节点到达的子映射，且 `(s, v)` 是该子映射返回的元素，那么迭代器将返回 `(chr, v)`。... (Wait, I'll\
  \ just provide the translation of the requested part.)\n\n[content]\nPrefixMap\n\
  \n\n\n\n如果你想将一个新的集合类完全集成到框架中，需要注意以下几点：\n\n1. 决定该集合应该是可变的还是不可变的。\n2. 为集合选择合适的基特征（base\
  \ traits）。\n3. 继承正确的模板特征（template trait）以实现大多数集合操作。\n4. 对于重载所需的、默认情况下不返回集合的操作，应尽可能使返回类型具体化。\n\
  \n### 25.3 结论\n\n你现在已经了解了 Scala` 集合是如何构建的，以及你如何添加新类型的集合。得于 `Scala` 对抽象的丰富支持，每个新的集合类型都拥有大量方法，而无需重新实现它们。\n\
  \n***\n\n#### 第 25 章脚注：\n\n[1] 理想情况下，一切都应该只在一个地方定义，但有少数例外需要重新定义内容。\n\n[2] 类型构造器在第\
  \ 19.3 节中进行了描述。\n\n[3] 视图（Views）在第 24.13 节中进行了描述。\n\n[4] Morrison, \"PATRICIA—Practical\
  \ Algorithm To Retrieve Information Coded in Alphanumeric\" [[Mor68]](#bibliography.html_patricia)\n\
  \n## 第 26 章\n\n# 提取器 (Extractors)\n\n到此时，你可能已经习惯了使用模式匹配分解和分析数据的简洁方式。本章将向你展示如何进一步推广这一概念。到为止，构造器模式与样例类（case\
  \ classes）相关联。例如，`Some(x)` 是一个有效的模式，因为 `Some` 是一个样例类。有时，你可能希望在不创建关联样例类的情况下编写像这样的模式。事实上，你可能希望能够创建自己的某种类型的模式。提取器为你提供了一种实现这一目标的方法。本章将解释什么是提取器，以及你如何使用它们来定义与对象表示形式解耦的模式。\n\
  \n### 26.1 示例：提取电子邮件地址\n\n为了说明提取器所解决的问题，假设你需要分析表示电子邮件地址的字符串。给定一个字符串，你想判断它是否为电子邮件地址，如果是，你想要访问该地址的用户部分和域部分。实现此点的传统方法使用三个辅助函数：\n\
  \n```\ndef isEMail(s: String): Boolean\ndef domain(s: String): String\ndef user(s:\
  \ String): String\n```\n\n使用这些函数，你可以这样解析给定的字符串 `s`：\n\n```\nif (isEMail(s)) println(user(s)\
  \ + \" AT \" + domain(s))\n  else println(\"not an email address\")\n```\n\n这种方法可行，但有点笨拙。此外，如果你结合了多个此类测试，情况就会变得更加复杂。例如，你可能想在列表中找到两个连续的、都是电子邮件地址且具有相同用户的字符串。你可以尝试使用之前定义的访问函数来亲自操作，看看涉及到哪些步骤。\n\
  \n你之前在第 15 章中看到，模式匹配是处理这类问题的理想工具。让我们暂时假设你可以用模式来匹配字符串：\n\n```\nEMail(user, domain)\n\
  ```\n\n如果字符串包含嵌入的 `at` 符号（@），则该模式将匹配成功。在这种情况下，它会将变量 `user` 绑定到字符串 `@` 之前的部分，并将变量\
  \ `domain` 绑定到 `@` 之后的部分。假设这样一个模式，之前的表达式可以更清晰地写成：\n\n```\ns match {\n  case EMail(user,\
  \ domain) => println(user + \" AT \" + domain)\n  case _ => println(\"not an email\
  \ address\")\n}\n```\n\n寻找两个具有相同用户部分的连续电子邮件地址这一更复杂的问题转换为以下模式：\n\n```\nss match {\n\
  \  case EMail(u1, d1) :: EMail(u2, d2) :: _ if (u1 == u2) => ...\n  ...\n}\n```\n\
  \n这比用访问函数可以编写的任何内容都要易读得多。然而，问题在于字符串不是样例类；它们没有符合 `EMail(user, domain)` 的表示形式。这就是\
  \ `Scala` 提取器的用武之地：它们允许你为现有的类型定义新模式，而模式不需要遵循该类型的内部表示形式。\n\n### 26.2 提取器\n\n`Scala`\
  \ 中的提取器是一个对象，其成员之一是名为 `unapply` 的方法。`unapply` 方法的作用是匹配值并将其拆解。通常，提取器对象还会定义一个对立的 `apply`\
  \ 方法来构建值，但这不是强制要求的。例如，列表 26.1 展示了一个用于电子邮件地址的提取器对象：\n\n```\nobject EMail {\n\n  //\
  \ 注入方法（可选）\n  def apply(user: String, domain: String): String = user + \"@\" + domain\n\
  \n  // 提取方法（强制）\n  def unapply(str: String): Option[(String, String)] = {\n    val\
  \ parts = str.split(\"@\")\n    if (parts.length == 2) Some(parts(0), parts(1))\n\
  \    else None\n  }\n}\n```\n\n##### 列表 26.1 - EMail 提取器对象。\n\n这个 `EMail` 定义了 `apply`\
  \ 和 `unapply` 方法。`apply` 方法的意思相同：它将 `EMail` 转换为字符串。为了显式表示，你也可以让 `EMail` 继承自 `Function2[String,\
  \ String]`，如下：\n\n```\nobject EMail extends ((String, String) => String) { ... }\n\
  ```\n\n`unapply` 方法是将 `EMail` 转换为提取器的。在某种意义上，它反转了 `apply` 的构建过程。`apply` 接收两个字符串形成电子邮件地址，而\
  \ `unapply` 接收一个电子邮件地址并返回两个字符串：用户和域。这就是为什么 `unapply` 返回一个字符串的 `Option`。如果 `str`\
  \ 是电子邮件地址，结果为 `Some(user, domain)`；如果不是，则为 `None`。这里是一些例子：\n\n```\nunapply(\"John@epfl.ch\"\
  ) == Some(\"John\", \"epfl.ch\")\nunapply(\"John Doe\") == None\n```\n\n现在，当模式匹配遇到引用提取器对象的模式时，它会在选择器表达式上调用提取器的\
  \ `unapply` 方法。例如，执行代码：\n\n```\nselectorString match { case EMail(user, domain)\
  \ => ... }\n```\n\n会导致调用：\n\n```\nEMail.unapply(selectorString)\n```\n\n正如你之前看到的，对\
  \ `EMail.unapply` 的调用将返回 `None` 或 `Some(u, d)`，其中 `u` 是地址的用户部分`d` 是域部分。在 `None`\
  \ 情况下，模式不匹配，系统将尝试另一个模式或抛出 `MatchError` 异常。在 `Some(u, d)` 情况下，模式匹配，其变量绑定到返回值的元素。在之前的匹配中，`user`\
  \ 将绑定到 `u`，`domain` 将绑定到 `d`。\n\n在 `EMail` 模式匹配示例中，选择器表达式的类型 `String` 符合 `unapply`\
  \ 的参数类型（在示例中也是 `String`）。这很常见，但并非必须。也可以使用 `EMail` 提取器来匹配更通用类型的选择器表达式。例如，为了确定任意值\
  \ `x` 是否为电子邮件地址字符串，你可以写：\n\n```\nval x: Any = ...\nx match { case EMail(user, domain)\
  \ => ... }\n```\n\n\n\n\n给定这段代码，模式匹配器将首先检查给定的值 `x` 是否符合 `String`，即 `EMail` 的 `unapply`\
  \ 方法的参数类型。如果符合，该值将强制转换为 `String` 并像以前一样继续进行模式匹配。如果不符合，模式将立即失败。\n\n在对象 `EMail` 中，`apply`\
  \ 方法被称为**注入**（injection），因为它接收一些参数并产生一个给定集合的元素（在我们的案例中：电子邮件地址的字符串集合）。`unapply` 方法被称为**提取**（extraction），因为它接收相同集合中的一个元素并提取出它的某些部分（在我们的案例中：用户和域名子字符串）。注入和提取通常组合在一个对象中，因为这样你可以使用该对象的名称既作为构造函数又是模式，这模拟了与样例类（case\
  \ classes）模式匹配的约定。然而，也可以在没有相应注入的情况下在对象中定义提取。对象本身被称为**提取器**（extractor），无论它是否具有 `apply`\
  \ 方法。\n\n如果包含注入方法，它应该是提取方法的对偶（dual）。例如，调用：\n\n```\nEMail.unapply(EMail.apply(user,\
  \ domain))\n```\n\n应该返回：\n\n```\nSome(user, domain)\n```\n\n即用 `Some` 封装的相同参数序列。反向操作意味着首先运行\
  \ `unapply` 然后运行 `apply`，如代码代码所示：\n\n```\nEMail.unapply(obj) match { \n  case Some(u,\
  \ d) => EMail.apply(u, d) \n}\n```\n\n在上述代码中，如果对 `obj` 的匹配成功，你会期望从 `apply` 获得那个相同的对象。`apply`\
  \ 和 `unapply` 对偶性的这两个条件是良好的设计原则。Scala 并不强制执行这些原则，但在设计提取器时建议遵循它们。\n\n### 26.3 具有零个或一个变量的模式\n\
  \n上一个示例中的 `unapply` 方法在成功情况下返回了一对元素值。这可以很容易推广到具有两个以上变量的模式。为了绑定 N 个变量，`unapply` 将返回一个包含\
  \ N 个元素的元组，并用 `Some` 封装。\n\n然而，模式仅绑定一个变量的情况处理方式不同。Scala 中没有单元素元组。为了只返回一个模式元素，`unapply`\
  \ 方法只需将元素本身封装在 `Some` 中。例如，Listing 26.2 所示的提取器对象定义了针对连续出现相同子字符串的字符串的 `apply` 和 `unapply`：\n\
  \n```\nobject Twice {\n  def apply(s: String): String = s + s\n  def unapply(s:\
  \ String): Option[String] = {\n    val length = s.length / 2\n    val half = s.substring(0,\
  \ length)\n    if (half == s.substring(length)) Some(half) else None\n  }\n}\n```\n\
  \n####  - Twice 字符串提取器对象。\n\n提取器模式也可能不任何变量。在这种情况下，相应的 `unapply` 方法返回一个布尔值——成功为真，失败为假。例如，Listing\
  \ 26.3 所示的提取器对象描述了由全大写字母组成的字符串：\n\n```\nobject UpperCase {\n  def unapply(s: String):\
  \ Boolean = s.toUpperCase == s\n}\n```\n\n#### - UpperCase 字符串提取器对象。\n\n这次，提取器只定义了\
  \ `unapply`，而没有定义 `apply`。定义 `apply` 是没有意义的，因为没有可以构造的内容。\n\n下面的 `userTwiceUpper`\
  \ 函数在它的模式匹配代码中应用了之前定义的所有提取器：\n\n```\ndef userTwiceUpper(s: String) = s match {\n\
  \  case EMail(Twice(x @ UpperCase()), domain) =>\n    \"match: \" + x + \" in domain\
  \ \" + domain\n  case _ => \n    \"no match\"\n}\n```\n\n该函数的第一个模式匹配符合电子邮件地址的字符串，其用户部分由两个相同的大写字母字符串组成。例如：\n\
  \n```scala\nscala> userTwiceUpper(\"DIDI@hotmail.com\")\n  res0: String = match:\
  \ DI in domain hotmail.com\n\n  scala> userTwiceUpper(\"DIDO@hotmail.com\")\n  res1:\
  \ String = no match\n\n  scala> userTwiceUpper(\"idi@hotmail.com\")\n  res2: String\
  \ = no match\n```\n\n注意 `UpperCase()` 本身并不绑定任何变量。你在 Section 15.2 中看到 `x` 被绑定到了 \"\
  DI\"。\n\n### 26.4 可变参数提取器\n\n到为止遇到的 `unapply` 方法每个返回固定数量的元素。有时，这并不灵活。例如，你可能想匹配一个域名，以便可以使用序列通配符。你曾在\
  \ Section 15.2 中看到参数列表末尾的序列通配符 `*` 匹配任何剩余元素。如果顶级域名在前面，这会更有用。\n\n```\nmatch {\n \
  \ case Domain(\"org\") => println(\"org.org\")\n  case Domain(\"com\", \"sun\")\
  \ => println(\"sun.com\")\n  case Domain(\"net\", _) => println(\"net\")\n}\n```\n\
  \n\n\n你可以使用 `Domain` 提取器来从电子邮件字符串中获取更详细的信息。例如，要在某个 \".com\" 域名下搜索名为 \"tom\" 的电子邮件地址，你可以编写如下函数：\n\
  \n```scala\ndef isTomInDotCom(s: String): Boolean = s match {\n  case EMail(\"tom\"\
  , Domain(\"com\", _*)) => true\n  case _ => false\n}\n```\n\n这会给出一个预期的结果：\n\n```\n\
  scala> isTomInDotCom(\"tom@sun.com\")\n  res3: Boolean = true\n\n  scala> isTomInDotCom(\"\
  peter@sun.com\")\n  res4: Boolean = false\n\n  scala> isTomInDotCom(\"tom@acm.org\"\
  )\n  res5: Boolean = false\n```\n\n也可以从 `unapplySeq` 中返回部分固定元素以及变量部分。这通过在一个元元组中返回所有元素来实现，按照惯例，变量部分放在最后。例如，Listing\
  \ 26.5 显示了一个新的电子邮件提取器，其中域名部分已经展开为序列：\n\n```scala\nobject ExpandedEMail {\n  def\
  \ unapplySeq(email: String)\n        : Option[(String, Seq[String])] = {\n    val\
  \ parts = email split \"@\"\n    if (parts.length == 2) \n      Some(parts(0), parts(1).split(\"\
  \\\\.\").reverse.toSeq)\n    else \n      None\n  }\n}\n```\n\n#### Listing 26.5\
  \ - `ExpandedEMail` 提取器对象。\n\n`ExpandedEMail` 中的 `unapplySeq` 方法返回一个可选的对值（一个 `Tuple2`）。该值对的第一个元素是用户部分。第二个元素是表示域名的名称序列。你可以像\
  \ usual 一样对其匹配：\n\n```\nscala> val s = \"tom@support.epfl.ch\"\n  s: String = tom@support.epfl.ch\n\
  \n  scala> val ExpandedEMail(name, topdom, subdoms @ _*) = s\n  name: String = tom\n\
  \  topdom: String = ch\n  subdoms: Seq[String] = WrappedArray(epfl, support)\n```\n\
  \n### 26.5 提取器与序列模式\n\n你在 Section 15.2 中看到，可以使用序列模式访问列表或数组的元素，例如：\n\n```\nList()\n\
  List(x, y, _*)\nArray(x, 0, 0, _)\n```\n\n事实上，这些序列模式都是在 Scala 标准库中通过提取器实现的。例如，类似\
  \ `List(...)` 的模式之所以可能的，是因为 `scala.List` 伴随对象是一个定义了 `unapplySeq` 方法的提取器。Listing\
  \ 26.6 显示了相关定义：\n\n```scala\npackage scala\n  object List {\n    def applyT = elems.toList\n\
  \    def unapplySeqT: Option[Seq[T]] = Some(x)\n    ... \n  }\n```\n\n#### Listing\
  \ 26.6 - 定义 `unapplySeq` 方法的提取器。\n\n`List` 对象包含一个接收可变参数的 `apply` 方法。这让你能够编写如下表达式：\n\
  \n```\nList()\nList(1, 2, 3)\n```\n\n它还包含一个 `unapplySeq` 方法，将列表的所有元素作为序列返回。这支持了\
  \ `List(...)` 模式。在 `scala.Array` 对象中也存在非常相似的定义。这些定义为数组支持类似的注入和提取。\n\n### 26.6 提取器与类类（case\
  \ classes）\n\n尽管类类非常有用，但它们有一个缺点：它们暴露了数据的具体表示。这意味着构造器模式中的类名对应于选择器对象的具体表示类型。如果对以下内容：\n\
  \n```scala\ncase C(...)\n```\n\n匹配成功，你就知道选择器表达式是类 `C` 的实例。\n\n\n\n\n```\nscala>\
  \ val Decimal = new Regex(\"(-)?(\\\\d+)(\\\\.\\\\d*)?\")\n  Decimal: scala.util.matching.Regex\
  \ = (-)?(\\d+)(\\.\\d*)?\n```\n\n请注意，与之前给出的数字正则表达式相比，上述字符串中的每个反斜线都出现了两次。这是因为在 Java\
  \ 和 Scala 中，单个反斜线在字符串字面量中是转义字符，而不是出现在字符串中的普通字符。因此，你需要编写 `\\\\'` 而不是 `\\'` 才能在字符串中获得单个反斜线。\n\
  \n如果一个正则表达式包含许多反斜线，那么写起来和读起来可能会有些痛苦。Scala 的原始字符串（raw strings）提供了一种替代方案。正如你在第 5.2\
  \ 节中所看到的，原始字符串是位于三引号引号之间的字符序列。原始字符串和普通字符串的区别在于，原始字符串中的所有字符都与输入时完全一致。这包括反斜线，它们不会被视为转义字符。因此，你可以编写等价且更易读的代码：\n\
  \n```scala\nscala> val Decimal = new Regex(\"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\"\")\n\
  \  Decimal: scala.util.matching.Regex = (-)?(\\d+)(\\.\\d*)?\n```\n\n从解释器的输出可以看出，`Decimal`\
  \ 生成的结果值与之前完全相同。\n\n在 Scala 中，编写正则表达式的另一种更短的方法是这样的：\n\n```\nscala> val Decimal =\
  \ \"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\".r\n  Decimal: scala.util.matching.Regex = (-)?(\\\
  d+)(\\.\\d*)?\n```\n\n换句话说，简单地在字符串后附加 `.r` 即可获取正则表达式。这是因为在 `StringOps` 类中有一个名为 `r`\
  \ 的方法，它可以将字符串转换为正则表达式。该方法的定义如列表 26.7 所示：\n\n```scala\npackage scala.runtime\n  import\
  \ scala.util.matching.Regex\n\n  class StringOps(self: String) ... {\n    ...\n\
  \    def r = new Regex(self)\n  }\n```\n\n**列表 26.7 - `StringOps` 中如何定义 `r` 方法。**\n\
  \n## 搜索正则表达式\n\n你可以使用几种不同的运算符在字符串中搜索正则表达式的出现情况：\n\n`regex findFirstIn str`\n\n在字符串\
  \ `str` 中查找正则表达式 `regex` 的第一次出现位置，返回一个 `Option` 类型的结果。\n\n`regex findAllIn str`\n\
  \n在字符串 `str` 中查找正则表达式 `regex` 的所有出现位置，返回一个 `Iterator` 的结果。\n\n`regex findPrefixOf\
  \ str`\n\n在字符串 `str` 的开头查找正则表达式 `regex` 的出现位置，返回一个 `Option` 类型的结果。\n\n例如，你可以定义下面的输入序列，然后在其中搜索数字：\n\
  \n```scala\nscala> val Decimal = \"\"\"(-)?(\\d+)(\\.\\d*)?\"\"\".r\n  Decimal:\
  \ scala.util.matching.Regex = (-)?(\\d+)(\\.\\d*)?\n\n  scala> val input = \"for\
  \ -1.0 to 99 by 3\"     \n  input: String = for -1.0 to 99 by 3\n\n  scala> for\
  \ (s <- Decimal findAllIn input)\n        println(s)\n  -1.0\n  99\n  3\n\n  scala>\
  \ Decimal findFirstIn input\n  res7: Option[String] = Some(-1.0)\n\n  scala> Decimal\
  \ findPrefixOf input\n  res8: Option[String] = None\n```\n\n## 使用正则表达式进行提取\n\n此外，Scala\
  \ 中的每个正则表达式都定义了一个提取器（extractor）。提取器用于识别由正则表达式的组所匹配的子字符串。例如，你可以如下方式解构一个数字字符串：\n\n\
  ```scala\nscala> val Decimal(sign, integerpart, decimalpart) = \"-1.23\"  \n  sign:\
  \ String = -\n  integerpart: String = 1\n  decimalpart: String = .23\n```\n\n在例例中，模式\
  \ `Decimal(...)` 用在 `val` 定义中，正如第 15.7 节 所描述。这里发生的情况是 `Decimal` 正则表达式值定义了一个 `unapplySeq`\
  \ 方法。该方法匹配每个符合数字正则表达式语法的字符串。如果字符串匹配，则返回与正则表达式 `(-)?(\\d+)(\\.\\d*)?` 中的三个组相对应的部分。\n\
  \n### 26.8 结论\n\n在这一章中，你学习了如何使用提取器来泛化模式匹配。提取器允许你对数据定义自己的视图。正如此处演示的，当 `Some` 应用于元组\
  \ `(user, domain)` 时，在将元组传递给接收单个参数的函数时，可以省略一对括号。因此，`Some(user, domain)` 与 `Some((user,\
  \ domain))` 是等价的。\n\n---\n\n# 第 27 章\n\n# 注解 (Annotations)\n\n注解是添加到程序源代码中的结构化信息。与注释一样，它们可以散布在整个程序中，并附着到任何变量、方法、表达式或其他元素上。与注释不同，它们具有结构，因此更容易被机器处理。\n\
  \n本章展示了如何在 Scala 中使用注解。它展示了它们的通用语法以及如何使用一些标准注解。\n\n本章没有介绍如何编写注解处理工具，因为这超出了本书的范围。相反，本章重点关注如何使用注解，因为使用注解比定义新的注解处理器更为常见。\n\
  \n### 27.1 为什么需要注解？\n\n除了编译和运行程序外，你还可以对程序做很多事情。示例包括：\n\n1. 自动生成文档（如 Scaladoc）。\n\
  2. 格式化代码以符合你的偏好风格。\n3. 检查常见错误，例如打开文件但在某些控制路径未关闭。\n4. 实验性类型检查，例如管理副作用或确保所有权属性。\n\n\
  此类工具被称为*元编程`工具，因为它们是以其他程序输入的程序。注解通过允许程序员在源代码中散布工具指令来支持这些工具。这些指令让工具比没有用户输入时更有效。例如，注解可以通过方式改进上述工具：\n\
  \n1. 文档生成器可以指示将某些方法标记为已弃。\n2. 格式化打印程序可以指示跳过经过精心手工格式化的程序部分。\n3. 未关闭文件检查器可以指示忽略某个特定的手动验证已关闭的文件。\n\
  4. 副作用检查器可以指示验证特定方法没有副作用。\n\n\n\n\n在所有这些情况下，理论上编程语言可以提供插入额外信息的方法。事实上，在某些语言中这些是直接支持的。然而，此类工具太多语言无法直接支持。此外，编译器完全忽略这些信息，以便代码运行。\n\
  \n`Scala` 在这种情况下的哲学是在核心语言中提供正交支持，以便各种编程工具可以被编写。在这种情况下，支持的是注解系统。编译器理解注解，但不会为单个注解附加任何含义。每个编程工具然后可以定义并使用它特定的注解。\n\
  \n### 27.2 注解的语法\n\n一个注解的典型用法如下：\n\n```\n @deprecated def bigMistake() = //...\n\
  ```\n\n注解是 `@deprecated` 部分，它作用于整个 `bigMistake` 方法（未显示——这太尴尬了）。在这种情况下，`bigMistake`\
  \ 的作者希望你不要使用。在上一个示例中，方法被标记为 `@deprecated`。注解也允许出现在其他地方。包括 `vals`、`vars`、`defs`、`classes`、`objects`、`traits`\
  \ 和 `types`。注解作用于它的整个声明或定义：\n\n```\n @deprecated class QuickAndDirty {\n  //...\n\
  \  }\n```\n\n注解也可以作用于表达式，例如用于模式匹配的 `@unchecked` 注解（参见第 15 章）。这样做是在表达式后加上冒号（`:`），然后编写注解。在语法上，看起来就像注解被用作一种类型：\n\
  \n```\n (e: @unchecked) match {\n  // exhaustive cases...\n  }\n```\n\n最后，注解可以放在类型上。被注解的类型在本章稍后描述。\n\
  \n到目前为止，所示注解仅仅是 @ 符号后面跟着注解类。这种简单的注解常见且有用，但注解有更丰富的通用形式：\n\n`@annot(exp[1], exp[2],\
  \ ...)`\n\n`annot` 指定注解的类。所有注解必须包含。`exp` 部分是注解的参数。对于像 `@deprecated` 这样不需要任何参数的注解，你通常省略括号，但如果你喜欢也可以写成\
  \ `@deprecated()`。对于带有参数的注解，将参数放在括号中，例如 `@serial(1234)`。\n\n你可以提供注解的参数的精确形式取决于特定的注解类。大多数注解处理器只允许你提供立即常量，如\
  \ `123` 或 `\"hello\"`。然而，编译器本身支持任意表达式，只要它们通过类型检查。某些注解类可以利用这一点，例如允许你引用作用域内的变量：\n\n\
  ```\n @cool val normal = \"Hello\"\n  @coolerThan(normal) val fonzy = \"Heeyyy\"\
  \n```\n\n在内部，`Scala` 将注解表示为注解类的构造函数调用——将 `@` 替换为 `new`，你就有一个有效的实例创建表达式。这意味着命名和默认注解参数是自然支持的，因为\
  \ `Scala` 已经有了方法和构造函数调用的命名和默认参数。稍微棘手涉及到概念上接受其他注解作为参数的注解，这是某些框架要求的。你不能直接将注解作为另一个注解的参数，因为注解不是有效的表达式。在这种情况下，你必须使用\
  \ `new` 而不是 `@`，如下所示：\n\n```\nscala> import annotation._\n  import annotation._\n\
  \n  scala> class strategy(arg: Annotation) extends Annotation\n  defined class strategy\n\
  \n  scala> class delayed extends Annotation\n  defined class delayed\n\n  scala>\
  \ @strategy(@delayed) def f() = {} \n               ^\n  error: illegal start of\
  \ simple expression\n\n  scala> @strategy(new delayed) def f() = {}\n  f: ()Unit\n\
  ```\n\n### 27.3 标准注解\n\n`Scala` 包含了几个标准注解。它们用于那些被广泛使用到足以放入语言规范的特性，但又不够基础到足以需要自己的语法的特性。随着时间的推移，应该会有新的注解不断产生并以相同的方式添加到标准中。\n\
  \n### 废弃\n\n有时你写了一个以后希望没有写过的类或方法。废弃允许你优雅地移除一个方法。你将方法或类标记为废弃，然后任何调用它都会得到废弃警告。这种想法是，过了足够的时间后，你可以安全地删除它。\n\
  \n通过在方法之前编写 `@deprecated` 将方法标记为废弃。例如：\n\n```\n @deprecated def bigMistake() = //...\n\
  ```\n\n这种注解会在 Scala 访问方法时产生警告。你为 `@deprecated` 提供一个字符串，该字符串将与错误消息一起输出。使用此消息向开发者解释他们应该使用什么。\n\
  \n```\n @deprecated(\"use newMethod() instead\")\n  def bigMistake() = //...\n```\n\
  \n现在任何调用者都会得到这样的消息：\n\n```\n$ scalac -deprecation Deprecation2.scala\nDeprecation2.scala:33:\
  \ warning: method bigMistake in object\nDeprecation2 is deprecated: use newMethod()\
  \ instead\n  bigMistake()\n               ^\none warning found\n```\n\n### volatile\
  \ 字段\n\n并发编程与可变状态并不完美。由于原因，Scala 的并发支持重点是 Future 和最少的可变状态。详情请参见第 32 章。\n\n然而，有时程序员想在并发程序中使用可变状态。在这种情况下，注解注解很有帮助。它通知编译器该变量将被多个线程使用。此类变量的实现使得对变量的读写变慢，但多线程的访问更具预测性。\n\
  \n`@volatile` 关键字在不同平台上提供不同的保证。但在 Java 平台上，你获得的行为与你在 Java 代码中编写该字段并用 Java volatile\
  \ 修饰标记相同。\n\n### 二进制序列化\n\n许多语言都包含了二进制序列化框架。序列化框架帮助你将对象转换为字节流反之亦然。如果你想将对象保存到磁盘或通过网络发送，这非常有用。XML\
  \ 可以帮助实现相同的目标（参见第 28 章），但它在速度、空间使用、灵活性可移植性方面有不同的权衡。\n\n`Scala` 没有自己的序列化框架。相反，你应该使用来自你底层平台的框架。Scala\
  \ 做的是提供两个对各种框架都有用的注解。此外，针对 Java 平台的 Scala 编译器以 Java 的方式解释这些注解。\n\n\n\n\n首先，大多数类都是可序列化的，但并非所有类都是。例如，socket\
  \ 或 GUI 窗口的句柄无法被序列化。默认情况下，类不被认为是可序列化的。要使其可序列化，你必须混入 `scala.Serializable` 标记特征（trait），它在\
  \ JVM 上是 `java.io.Serializable` 的别名。\n\n`SerialVersionUID` 注解有助于处理随时间推移而变化的序列化类。你可以通过添加类似\
  \ `@SerialVersionUID(1234)` 的注解为类的当前版本附加一个序列号，其中 `1234` 应该替换为你选择的序列号。框架应该将此数字存储在生成的字节流中。当你之后重新加载该字节流并尝试将其转换为对象时，框架可以检查类的当前版本号是否与字节流中的版本号一致。如果你想对类进行不兼容序列化的更改，就可以更改版本号。此时框架将会自动拒绝加载该类的旧实例。\n\
  \nScala 还为完全不应该被序列化的字段提供了 `@transient` 注解。如果你将一个字段标记为 `@transient`，那么即使周围的对象被序列化了，框架也不应该保存该字段。当对象被加载时，该字段将恢复为被标记为\
  \ `@transient` 的字段类型的默认值。\n\n### 自动的 get 和 set 方法\n\nScala 代码通常不需要为字段显式的 get 和 set\
  \ 方法，因为 Scala 融合了字段访问和方法调用的语法。然而，某些特定平台的框架确实需要 get 和 set 方法。为了这个目的，Scala 提供了 `@scala.reflect.BeanProperty`\
  \ 注解。如果你在字段上添加此注解，编译器将自动为你生成 get 和 set 方法。如果你为名为 `crazy` 的字段添加注解，则 get 方法将命名为 `getCrazy`，set\
  \ 方法将命名为 `setCrazy`。\n\n生成的 get 和 set 方法仅在编译周期完成后才可用。因此，你不能在与注解字段同时编译的代码中调用这些 get\
  \ 和 set 方法。这在实践中通常不是问题，因为在 Scala 代码中你可以直接访问字段。此特性旨在支持期望常规 get 和 set 方法的框架，通常你不会同时编译框架和使用该框架的代码。\n\
  \n### Tailrec\n\n你通常会在需要尾递归的方法上添加 `@tailrec` 注解，例如是因为你预计否则它会递归得非常深。为了确保 Scala 编译器确实对该方法执行第\
  \ 8.9 节所述的尾递归优化，你可以在方法定义前添加 `@tailrec`。如果无法执行优化，你会得到一个警告以及原因的解释。\n\n### Unchecked\n\
  \n`@unchecked` 注解由编译器在模式匹配期间进行解释。它告诉编译器，如果匹配表达式似乎漏掉了某些情况，请不要担心。详情请参见第 15.5 节。\n\n\
  ### Native methods\n\n`@native` 注解告知编译器，方法的实现是由运行时提供的，而不是通过 Scala 代码。编译器将在输出中切换相应的标记，由开发者负责使用如\
  \ Java Native Interface (JNI) 等机制提供实现。\n\n当使用 `@native` 注解时，必须提供方法体，但它不会被发射到输出文件中。例如，这里是方法\
  \ `beginCountdown` 将由运行时提供的示例：\n\n```\n@native\ndef beginCountdown() = {}\n```\n\
  \n### 27.4 结论\n\n本章描述了你最可能需要了解的注解的平台无关方面。首先，它涵盖了注解的语法，因为使用注解比定义新注解常见得多。其次，它展示了如何使用标准\
  \ Scala 编译器支持的几个注解，包括 `@deprecated`、`@volatile`、`@serializable`、`@BeanProperty`、`@tailrec`\
  \ 和 `@unchecked`。\n\n第 31 章提供了关于注解的额外 Java 特定信息。它涵盖了针对 Java 时才可注解、标准注解在针对 Java 时的额外含义、如何与基于\
  \ Java 的注解交互，以及如何使用基于 Java 的机制在 Scala 中定义和处理注解。\n\n# 第 28 章\n\n# 使用 XML\n\n本章介绍了\
  \ Scala 对 XML 的支持。在讨论了一般的半结构化数据后，它展示了 Scala 中操作 XML 的核心功能：如何使用 XML 字面量创建节点，如何将 XML\
  \ 保存和加载到文件，以及如何使用查询方法和模式匹配拆解 XML 节点。本章仅对 XML 的可能性进行了简要介绍，但它展示了足够让你入门的内容。\n\n###\
  \ 28.1 半结构化数据\n\nXML 是一种半结构化数据。它比纯字符串更有结构化，因为它将数据内容组织成树。然而，纯 XML 的结构化程度低于编程语言的对象，因为它允许标签之间存在自由格式的文本，并且缺乏类型系统[[1]](#working-with-xml.html_footnotemain28-1)。\n\
  \n当你需要序列化程序数据以保存到文件或跨网络传输时，半结构化数据非常有帮助。你不需要将结构化数据一直转换为字节，而是将其与半结构化数据之间进行转换。然后你使用现有的库例程在半结构化数据和二进制数据之间进行转换，从而为更重要的问题留出时间。\n\
  \n半结构化数据有很多形式，但 XML 在互联网上使用最广泛。大多数操作系统都有 XML 工具，大多数编程语言都有可用的 XML 库。它的流行性是自我加强的。针对\
  \ XML 开发的工具和库越多，软件工程师越可能选择 XML 作为其格式的一部分。如果你编写在互联网上通信的软件，迟早需要与某些支持 XML 的服务交互。\n\n\
  出于所有这些原因，Scala 包含了处理 XML 的特殊支持。本章将向你展示 Scala 构建 XML、使用常规方法处理 XML 以及使用模式匹配处理 XML\
  \ 的支持。除了这些基础知识，本章还将途中展示在 Scala 中使用 XML 的几种常用习惯。\n\n### 28.2 XML 概述\n\nXML 由两个基本元素构建而成：文本和标签[[2]](#working-with-xml.html_footnotemain28-2)。文本像通常一样，是任何字符序列。标签（写法如\
  \ `<pod>`）由小于号、字母数字标签和大于号组成。标签可以是开始标签或结束标签。结束标签看起来和开始标签一样，只是在标签标签之前有一个斜杠，例如：`</pod>`。\n\
  \n开始标签和结束标签必须匹配，就像括号一样。任何开始标签最终都必须有一个相同标签的结束标签。因此，以下内容是非法的：\n\n```\n// 非法 XML\n\
  One <pod>, two <pod>, three <pod> zoo\n```\n\n此外，任何匹配标签的内容本身必须是有效的 XML。你不能让两对匹配标签相互重叠：\n\
  \n```\n// 也是非法的\n<pod>Three <peas> in the </pod></peas>\n```\n\n然而，你可以这样写：\n\n```\n\
  <pod>Three <peas></peas> in the </pod>\n```\n\n\n\n\n由于标签必须以这种方式匹配，因此 XML 被结构化为嵌套的\
  \ `elements`（元素）。每一对匹配的起始标签和结束标签形成一个元素，元素之间可以相互嵌套。在上面的示例中，`</pod>` 之前的整个 `<pod>Three\
  \ <peas></peas>` 是一个元素，而 `<peas></peas>` 是嵌套在它内部的元素。\n\n这些都是基础知识。你还需要知道的另外两点：首先，起始标签后紧跟其匹配的结束标签有一种简写表示法。只需写一个标签，并在标签名后加上一个斜杠即可。这样的标签称为一个\
  \ `empty element`（空元素）。使用空元素，之前的示例也可以写成如下形式：\n\n```\n<pod>Three <peas/> in the </pod>\n\
  ```\n\n其次，起始标签可以附带 `attributes`（属性）。属性是一个中间用等号连接的键值值对。属性名本身是纯文本、未结构化的文本，而值则被双引号（\"\
  \"）或单引号（''）包围。属性的形式如下：\n\n```\n<pod peas=\"3\" strings=\"true\"/>\n```\n\n### 28.3\
  \ XML 字面量\n\nScala 允许你在任何表达式有效的地方以字面量的形式输入 XML。你只需输入一个起始标签，然后继续编写 XML 内容。编译器将进入\
  \ XML 输入模式，并读取内容作为 XML，直到它看到与你开始的起始标签匹配的结束标签为止：\n\n```scala\nscala> <a>\n      \
  \    This is some XML.\n          Here is a tag: <atag/>\n      </a>\nres0: scala.xml.Elem\
  \ =\n<a>\n  This is some XML.\n  Here is a tag: <atag/>\n</a>\n```\n\n该表达式的结果类型为\
  \ `Elem`，意味着它是一个带有标签（\"a\"）和子节点（\"This is some XML...,\" *etc.* *等*）的 XML 元素。其他一些重要的\
  \ XML 类还有：\n\n* `Node` 类是所有 XML 节点类的抽象父类。\n* `Text` 类是一个仅持有文本的节点。例如，`<a>stuff</a>`\
  \ 中的 \"stuff\" 部分就是 `Text` 类。\n* `NodeSeq` 类持有节点序列。XML 库中的许多方法在你可能预期它们处理单个 `Nodes`\
  \ 的地方处理 `NodeSeqs`。然而，你仍然可以在单个节点上使用此类方法，因为 `Node` 继承自 `NodeSeq`。这听起来可能很奇怪，但对 XML\
  \ 来说效果很好。你可以将单个 `Node` 认为是一个包含一个元素的 `NodeSeq`。\n\n你并不限于逐字符地写出你想要的精确 XML。你可以通过使用大括号（{}）作为转义符，在\
  \ XML 字面量的中间评估 Scala 代码。这里有一个简单的示例：\n\n```scala\nscala> <a> {\"hello\" + \", world\"\
  } </a>\nres1: scala.xml.Elem = <a> hello, world </a> \n```\n\n大括号转义可以包含任意的 Scala\
  \ 内容，包括进一步的 XML 字面量。因此，随着嵌套层级的增加，你的代码可以在 XML 和普通的 Scala 代码之间切换。这是一个示例：\n\n```scala\n\
  scala> val yearMade = 1955\n  yearMade: Int = 1955\n\n  scala>  <a> { if (yearMade\
  \ < 2000) <old>{yearMade}</old>\n                else xml.NodeSeq.Empty }\n    \
  \      </a>\n  res2: scala.xml.Elem =\n  <a> <old>1955</old>\n  </a>\n```\n\n如果大括号内的代码评估结果为\
  \ XML 节点或 XML 节点序列，则这些节点将直接原样插入。在上面的示例中，如果 `yearMade` 小于 2000，它将被封装在 `<old>` 标签中并添加到\
  \ `<a>` 元素中。否则，什么都不添加。注意在上面的示例中，作为 XML 节点的“无”用 `xml.NodeSeq.Empty` 表示。\n\n\n\n大括号转义内部的表达式不必评估为\
  \ XML 节点。它可以被评估为任何 Scala 值。在这种情况下，结果被转换为字符串并作为文本节点插入：\n\n```scala\nscala> <a> {3\
  \ + 4} </a>\nres3: scala.xml.Elem = <a> 7 </a>\n```\n\n文本中的任何 `<`、`>` 和 `&` 字符在重新打印该节点时都会被转义：\n\
  \n```scala\nscala> <a> {\"<a>\"} </a>\nres4: scala.xml.Elem = <a>&lt;/a&gt; </a>\n\
  ```\n\n相比之下，如果你使用低级字符串操作创建 XML，你会遇到诸如下的陷阱：\n\n```scala\nscala> \"<a>\" + \"</a>\"\
  \nres5: String = <a></a>\n```\n\n这里发生的情况是，用户提供的字符串包含了了自己的 XML 标签，在此例中为 `</a>`。这种行为可能会给程序员带来一些意想不到的惊喜，因为它允许用户影响\
  \ `<a>` 元素提供空间之外的生成树结构。你可以通过始终使用字面量而不是追加来构建 XML，从而防止这一整类问题。\n\n### 28.4 序列化\n\n\
  你已经足够了解 Scala 对 XML 的支持，可以编写序列化器的第一部分：从内部结构到 XML 的转换。你只需要 XML 字面量和大括号转义。\n\n举个例子，假设你正在实现一个数据库来跟踪你的复古可口可乐温度计收藏。你可能会创建一个类来持有信息，例如温度计何时制造、何时买入以及花了多少钱。你可能会编写如下类来持有数据：\n\
  \n```scala\nabstract class CTherm {\n  val description: String\n  val yearMade:\
  \ Int\n  val obtained: String\n  val bookPrice: Int\n  val purchasePrice: Int\n\
  \  val condition: Int\n\n}\n```\n\n为了将此类的实例转换为 XML，只需添加一个 `toXML` 方法，使用 XML 字面量和大括号转义：\n\
  \n```scala\nabstract class CTherm {\n  ...\n  def toXML =\n    <ctherm>\n      <description>{description}</description>\n\
  \      <yearMade>{yearMade}</yearMade>\n      <obtained>{obtained}</obtained>\n\
  \      <bookPrice>{bookPrice}</bookPrice>\n      <purchasePrice>{purchasePrice}</purchasePrice>\n\
  \      <condition>{condition}</condition>\n    </ctherm>\n}\n```\n\n这里是该方法的实际应用：\n\
  \n```scala\nscala> val therm = new CTherm {\n          val description = \"hot dog\
  \ #5\"\n          val yearMade = 1952\n          val obtained = \"March 14, 2006\"\
  \n          val bookPrice = 2199\n          val purchasePrice = 500\n          val\
  \ condition = 9\n        }\n  therm: CTherm = hot dog #5\n\n  scala> therm.toXML\n\
  res6: scala.xml.Elem =\n<ctherm>\n    <description>hot dog #5</description>\n  \
  \  <yearMade>1952</yearMade>\n    <obtained>March 14, 2006</obtained>\n    <bookPrice>2199</bookPrice>\n\
  \    <purchasePrice>500</purchasePrice>\n    <condition>9</condition>\n</ctherm>\n\
  ```\n\n#### 注意\n\n上示例中的 `new CTherm` 表达式即使 `CTherm` 是一个抽象类也是有效的，因为这种语法实际上实例化了一个\
  \ `CTherm` 的匿名子类。匿名类在 20.5 节 中介绍过。\n\n顺便说，如果你想作为 XML 文本包含大括号（`{` 或 `}`），而不是使用它们转义到\
  \ Scala 代码，只需连续写两个大括号即可：\n\n```scala\nscala> <a> {{{brace yourself!}}}} </a>\nres7:\
  \ scala.xml.Elem = <a> {{brace yourself!}} </a>\n```\n\n### 28.5 拆解 XML\n\n在 XML\
  \ 类提供的许多方法中，有三个特别值得注意的方法。它们允许你拆解 XML，而无需过多考虑 XML 在 Scala 中的精确表示方式。这些方法基于处理 XML 的\
  \ XPath 语言。按照 Scala 的习惯，你可以直接在 Scala 代码中编写它们，而不需要调用外部工具。\n\n**提取文本。通过对获取的任何 XML\
  \ 节点调用 `text` 方法，你可以获取该节点内的所有文本，但排除任何元素标签：\n\n```scala\nscala> <a>Sounds <tag/>\
  \ good</a>.text\nres8: String = Sounds good\n```\n\n任何编码字符都会被自动解码：\n\n\n\n\n\n```scala\n\
  scala> <a> input --->output </a>.text\n  res9: String = \" input ---> output \"\n\
  ```\n\n### 提取子元素\n\n如果你想通过标签名查找子元素，只需调用 `\\` 并传入标签名即可：\n\n```scala\nscala> <a><b><c>hello</c></body></a>\
  \ \\ \"b\"\n  res10: scala.xml.NodeSeq = NodeSeq(<b><c>hello</c></b>)\n```\n\n你可以通过使用\
  \ `\\\\` 代替 `\\` 运算符来执行“深度搜索”，并查找子子子元素，*等等*：\n\n```scala\nscala>  <a><b><c>hello</c></body></a>\
  \ \\ \"c\"\n  res11: scala.xml.NodeSeq = NodeSeq()\n\n  scala>  <a><b><c>hello</c></body></a>\
  \ \\\\ \"c\"\n  res12: scala.xml.NodeSeq = NodeSeq(<c>hello</c>)\n\n  scala>  <a><b><c>hello</c></body></a>\
  \ \\ \"a\"\n  res13: scala.xml.NodeSeq = NodeSeq()\n\n  scala>  <a><b><c>hello</c></body></a>\
  \ \\\\ \"a\"\n  res14: scala.xml.NodeSeq = \n  NodeSeq(<a><b><c>hello</c></body></a>)\n\
  ```\n\n#### 注意：\n\nScala 使用 `\\` 和 `\\\\` 代替 XPath 中的 `/` 和 `//`。这是因为 `//` 在 Scala\
  \ 中是注释的起始符号！因此，必须使用其他符号，而使用另一种斜杠效果良好。\n\n### 提取属性\n\n你可以使用相同的 `\\` 和 `\\\\` 方法来提取标签属性。只需在属性名前前加一个\
  \ @ 符号（`@`）即可：\n\n```scala\nscala> val joe = <employee\n          name=\"Joe\"\n\
  \          rank=\"code monkey\"\n          serial=\"123\"/>\n  joe: scala.xml.Elem\
  \ = <employee name=\"Joe\" rank=\"code monkey\"\n  serial=\"123\"/>\n\n  scala>\
  \  joe \\ \"@name\"\n  res15: scala.xml.NodeSeq = Joe\n\n  scala>  joe \\ \"@serial\"\
  \n  res16: scala.xml.NodeSeq = 123\n```\n\n### 28.6 反序列化\n\n利用之前拆解 XML 的方法，你现在可以编写序列化的对逆操作——一个从\
  \ XML 解析回你内部数据结构的解析器。例如，你可以使用以下代码解析回 `CCTherm` 实例：\n\n```scala\n def fromXML(node:\
  \ scala.xml.Node): CCTherm =\n  new CCTherm {\n    val description   = (node \\\
  \ \"description\").text\n    val yearMade      = (node \\ \"yearMade\").text.toInt\n\
  \    val dateObtained  = (node \\ \"dateObtained\").text\n    val bookPrice    \
  \ = (node \\ \"bookPrice\").text.toInt\n    val purchasePrice = (node \\ \"purchasePrice\"\
  ).text.toInt\n    val condition     = (node \\ \"condition\").text.toInt\n  }\n\
  ```\n\n此代码遍历名为 `node` 的输入 XML 节点，以查找指定 `CCTherm` 所的六部分数据。文本类型的数据通过 `.text` 提取并保持原样。以下是该方法的实际应用：\n\
  \n```scala\nscala> val node = therm.toXML\n  node: scala.xml.Elem =\n  <cctherm>\n\
  \              <description>hot dog #5</description>\n              <yearMade>1952</yearMade>\n\
  \              <dateObtained>March 14, 2006</dateObtained>\n              <bookPrice>199</bookPrice>\n\
  \              <purchasePrice>500</purchasePrice>\n              <condition>9</condition>\n\
  \  </cctherm>\n\n  scala> fromXML(node)\n  res17: CCTherm = hot dog #5\n```\n\n\
  ### 28.7 加载与保存\n\n编写数据序列化器还需要最后一部分：XML 与字节流之间的转换。这部分是最容易的，因为有现成的例程为你完成这一切。你只需要在正确的数据上调用正确的例程即可。\n\
  \n要将 XML 转换为字符串，你需要 `toString`。正因为存在可用的 `toString`，你可以在 shell 中对 XML 进行实验。然而，使用库例程并将所有转换为字节更好。这样，生成的\
  \ XML 就可以包含一个指定所用编码的指令。\n\n要从 XML 转换为字节字节文件，你可以使用 `XML.save` 命令。你必须指定文件名和一个要保存的节点：\n\
  \n```scala\nscala.xml.XML.save(\"therm1.xml\", node)\n```\n\n运行上述命令后，生成的句 `therm1.xml`\
  \ 如下所示：\n\n```xml\n<?xml version='1.0' encoding='UTF-8'\n<cctherm>\n  <description>hot\
  \ dog #5</description>\n  <yearMade>1952</yearMade>\n  <dateObtained>March 14, 2006</dateObtained>\n\
  \  <bookPrice>199</bookPrice>\n  <purchasePrice>500</purchasePrice>\n  <condition>9</condition>\n\
  </cctherm>\n```\n\n加载更简单（*此处原文似乎存在逻辑中断或重复，已根据上下文补全翻译*）。\n\n### 28.8 对 XML 进行模式匹配\n\
  \n到目前为止，你已经看到了如何通过 `\\` 和 `\\\\` 拆解 XML。有时，你可能需要对 XML 结构进行模式匹配。Scala 的模式匹配看起来就像\
  \ XML 字面量，如下所示：\n\n```scala\ndef proc(node: scala.xml.Node): String =\n  node match\
  \ {\n    case <a>{contents}</a> => \"It's an a: \" + contents\n    case <b>{contents}</b>\
  \ => \"It's a b: \" + contents\n    case _ => \"It's something else.\"\n  }\n```\n\
  \n\n\n\n\n# 29 使用对象的模块化编程\n\n在第 13 章中，我们接触了包和访问修饰符如何帮助组织程序。虽然将程序划分为包已经很有帮助，但它的局限性，因为它没有提供抽象的方法。\n\
  \n在本章中，我们将讨论如何使用 Scala 的面向对象特性使程序更具模块化。首先，我们将展示如何使用一个简单的对象用作模块。然后，我们将解释如何使用特征（traits）和类（classes）作为模块的抽象。这些抽象可以被重新配置为多个模块，甚至对应到多个文件。\n\
  \n### 29.1 问题\n\n随着程序规模的扩大，以模块化的方式组织程序变得越来越重要。首先，能够编译构成系统的不同模块有助于不同的团队独立工作。此外，能够卸载一个模块的实现并插入另一个实现是有用的，因为这允许在不同的上下文中使用系统的配置，例如在桌面上的单元测试、集成测试、预发布环境（staging）和部署。\n\
  \n例如，你可能有一个使用数据库和消息服务的应用程序。在编写代码时，你可能希望在桌面上运行单元测试，使用数据库和消息服务的模拟版本（mock versions），这些版本能够充分模拟这些服务以供测试，而无需跨网络与共享资源通信。在集成测试期间，你可能想使用模拟的消息服务但使用真实的数据库。在预发布阶段，尤其在部署期间，你的组织可能会希望使用数据库和消息服务的真实版本。\n\
  \n任何旨在促进这种模块化的技术都需要提供几个基本要素。首先，应该有一个能够提供良好的接口与实现分离的模块结构。其次，应该有一种方法可以将一个模块替换为具有相同接口的模块，而无需更改或重新编译依赖于被替换模块的模块。最后，应该有一种方法将模块连接在一起。这种接线任务可以被视为对系统的*配置*。\n\
  \n解决这一问题的方法之一是依赖注入（dependency injection），这是一种在 Java 平台上由 `Spring` 和 `Guice` 等框架支持的技术，它们在企业\
  \ Java 社区中非常流行。[[2]](#modular-programming-using-objects.html_footnotemin29-2) 例如，`Spring`\
  \ 本质上允许你将模块的接口表示为 Java 接口，将模块的实现表示为 Java 类。你可以指定模块之间的依赖关系，并通过外部 XML 配置文件将应用程序“连接”在一起。虽然你可以在\
  \ Scala 中使用 `Spring` 并从而利用 `Spring` 的方法来实现 Scala 程序系统级的模块化，但通过 Scala 语言本身，你拥有了一些替代方案。\n\
  \n## 29.2 一个食谱应用程序\n\n\n\n\n想象你正在构建一个企业级 Web 应用，允许用户管理食谱。你希望将软件分为若干层，包括`domain layer`（领域层）和`application\
  \ layer`（应用层）。在领域层中，你将定义`domain objects`（领域对象），它们将捕业务概念和规则，并封装将持久化到外部关系型数据库的状态。在应用层中，你将提供按照应用程序向客户端（包括用户界面层）提供的服务来组织的\
  \ API。应用层将通过协调任务并将工作委托给领域层对象来实现这些服务。[[3]](#modular-programming-using-objects.html_footnotemain29-3)\n\
  \n你希望能够在这这些每一层中插入某些对象的真实版本或模拟（mock）版本，以便你能够更轻松地为应用程序编写单元测试。为了实现这一目标，你可以将想要模拟的对象视为模块。在\
  \ Scala 中，对象不需要是“微小”的，也不需要使用其他类型的构造结构来处理像模块这样的“大”实体。Scala 作为一种可扩展语言的特性之一，是它对小型和大型结构使用了相同的构造结构。\n\
  \n例如，由于你在领域层中想要模拟的“实体”之一是代表关系型数据库的对象，因此你将其作为其中一个模块。在应用层中，你将一个“数据库浏览器”对象视为一个模块。数据库将保存一个人收集的所有食谱。浏览器将帮助搜索和浏览该数据库，例如，找到包含你手头食材的每份食谱。\n\
  \n要做的第一件事是对食物和食谱进行建模。为了保持简单，食物只需有一个名称，如 Listing 29.1 所示。食谱将有一个名称、一份配料列表和一些指令，如 Listing\
  \ 29.2 所示。\n\n```scala\npackage org.stairwaybook.recipe\n\nabstract class Food(val\
  \ name: String) {\n  override def toString = name\n}\n```\n\n##### 示例 29.1 - 一个简单的\
  \ Food 实体类。\n\n```scala\npackage org.stairwaybook.recipe\n\nclass Recipe(\n  val\
  \ name: String,\n  val ingredients: List[Food],\n  val instructions: String\n) {\n\
  \  override def toString = name\n}\n```\n\n##### 示例 29.2 - 简单的 Recipe 实体类。\n\nListings\
  \ 29.1 和 29.2 所示的 `Food` 和 `Recipe` 类代表了将持久化在数据库中的`entities`（实体）。[[4]](#modular-programming-using-objects.html_footnotemain29-4)\
  \ Listing 29.3 显示了这些类的的一些单例实例，可以在编写测试时使用。\n\n```scala\npackage org.stairwaybook.recipe\n\
  \nobject Apple extends Food(\"Apple\")\nobject Orange extends Food(\"Orange\")\n\
  object Cream extends Food(\"Cream\")\nobject Sugar extends Food(\"Sugar\")\n\nobject\
  \ FruitSalad extends Recipe(\n  \"fruit salad\",\n  List(Apple, Orange, Cream, Sugar),\n\
  \  \"Stir it all together.\"\n)\n```\n\n##### 示例 29.3 - 用于测试的 Food 和 Recipe 示例。\n\
  \n```scala\npackage org.stairwaybook.recipe\n\nobject SimpleDatabase {\n  def allFoods\
  \ = List(Apple, Orange, Cream, Sugar)\n\n  def foodNamed(name: String): Option[Food]\
  \ =\n    allFoods.find(_.name == name)\n\n  def allRecipes: List[Recipe] = List(FruitSalad)\n\
  }\n\nobject SimpleBrowser {\n  def recipesUsing(food: Food) =\n    SimpleDatabase.allRecipes.filter(recipe\
  \ =>\n      recipe.ingredients.contains(food))\n}\n```\n\n##### 示例 29.4 - 模拟数据库和模块。\n\
  \nScala 使用对象作为模块，因此你可以通过创建两个对象作为测试期间的模拟来开始你的程序的模块化。由于它是模拟的，数据库由简单的内存内存支持。你可以像 Listing\
  \ 29.4 所示那样使用这个数据库和浏览器。\n\n```scala\nscala> val apple = SimpleDatabase.foodNamed(\"\
  Apple\").get\napple: Food = Apple\n\nscala> SimpleBrowser.recipesUsing(apple)\n\
  res: List[Recipe] =\n```\n\n为了让事情变得更有趣一点，假设数据库将食物分为类别。为了实现这一点，你可以添加`FoodCategory`类和类别列表，如\
  \ Listing 29.5 所示。注意在例例中，`private` 关键字（对于实现类非常有用）对于模块也同样有用。这并不是什么大新闻，但你明白这个意思。\n\
  \n```scala\npackage org.stairwaybook.recipe\n\ncase class FoodCategory(name: String,\
  \ foods: List[Food])\n\nobject SimpleDatabase {\n  def allFoods = List(Apple, Orange,\
  \ Cream, Sugar)\n\n  def foodNamed(name: String): Option[Food] =\n    allFoods.find(_.name\
  \ == name)\n\n  def allRecipes: List[Recipe] = List(FruitSalad)\n\n  private categories\
  \ = List(\n    FoodCategory(\"fruits\", List(Apple, Orange)),\n    FoodCategory(\"\
  misc\", List(Cream, Sugar))\n  )\n\n  def allCategories = categories\n}\n\nobject\
  \ SimpleBrowser {\n  def recipesUsing(food: Food) =\n    SimpleDatabase.allRecipes.filter(recipe\
  \ =>\n      recipe.ingredients.contains(food))\n\n  def displayCategory(category:\
  \ SimpleDatabase.FoodCategory) = {\n    println(category)\n  }\n}\n```\n\n#####\
  \ 示例 29.5 - 添加类别后的数据库和浏览器模块。\n\n### 29.3 抽象\n\n尽管到为止所示的示例成功地将应用程序划分为数据库和浏览器模块，但这种设计尚未非常“模块化”。问题在于浏览器模块到数据库模块之间本质上存在“硬链接”：\n\
  \n```\nSimpleDatabase.allRecipes.filter(recipe => ...)\n```\n\n由于 `SimpleBrowser`\
  \ 模块通过名称提到了 `SimpleDatabase`，你无法在不修改和重新编译浏览器模块的情况下插入不同的数据库实现。此外，尽管 `SimpleDatabase`\
  \ 模块到 `SimpleBrowser` 模块之间没有硬链接，[[5]](#modular-programming-using-objects.html_footnotemain29-5)但还没有清晰的方法来让用户界面层（例如）配置为使用浏览器模块的不同实现。\n\
  \n然而，在使这些模块更具可插拔性时，避免重复代码是非常重要的，因为同一模块的不同实现可能会共享许多代码。例如，假设你希望同一个代码库支持多个食谱数据库，并且你希望为这些每个数据库创建一个独立的浏览器。你希望为每个实例复用浏览器代码，因为浏览器之间唯一的区别在于它们引用的数据库。除了数据库实现之外，其余代码可以逐字地复用。应该如何安排程序以减少重复代码？如何使代码变得可配置，以便你可以使用任何数据库实现进行配置？\n\
  \n\n\n\n答案是熟悉的那个：如果一个模块是一个对象，那么模块的模板就是一个类。就像类描述其所有实例的共同部分一样，类也可以描述模块中在所有可能的配置中都共有的部分。\n\
  \n```\n abstract class Browser {\n  val database: Database\n\n  def recipesUsing(food:\
  \ Food) =\n    database.allRecipes.filter(recipe =>\n      recipe.ingredients.contains(food))\n\
  \n  def displayCategory(category: database.FoodCategory) = { \n    println(category)\n\
  \  }\n}\n```\n\n#### 列表 29.6 - 一个带有抽象数据库 val 的 Browser 类。\n\n因此，浏览器的定义变成了一个类而不是对象，而要使用的数据库被指定为类的类的抽象成员，如\
  \ 列表 29.6 所示。数据库也变成了一个类，包含了尽可能多的所有数据库之间共有的部分，并声明了数据库必须定义的缺失部分。在这种情况下，所有数据库模块都必须为\
  \ `allFoods`、`allRecipes` 和 `allCategories` 定义方法，但由于它们可以使用任意定义，因此这些方法必须在 `Database`\
  \ 类中保持抽象。相比之下，`foodNamed` 方法可以在抽象的 `Database` 类中定义，如 列表 29.7 所示。\n\n```\n abstract\
  \ class Database {\n  def allFoods: List[Food]\n  def allRecipes: List[Recipe]\n\
  \n  def foodNamed(name: String) =\n    allFoods.find(f => f.name == name)\n\n  case\
  \ class FoodCategory(name: String, foods: List[Food])\n  def allCategories: List[FoodCategory]\n\
  }\n```\n\n#### 列表 29.7 - 一个带有抽象方法的 Database 类。\n\n`SimpleDatabase` 对象必须更新以继承抽象的\
  \ `Database` 类，如 列表 29.8 所示。\n\n```\n object SimpleDatabase extends Database {\n\
  \  def allFoods = List(Apple, Orange, Cream, Sugar)\n\n  def allRecipes: List[Recipe]\
  \ = List(FruitSalad)\n\n  private var categories = List(\n    FoodCategory(\"fruits\"\
  , List(Apple, Orange)),\n    FoodCategory(\"misc\", List(Cream, Sugar)))\n\n  def\
  \ allCategories = categories\n}\n```\n\n#### 列表 29.8 - 作为 Database 子类的 SimpleDatabase\
  \ 对象。\n\n然后，通过实例化 `Browser` 类并指定要使用哪个数据库来创建一个特定的浏览器模块，如 列表 29.9 所示。\n\n```\n object\
  \ SimpleBrowser extends Browser {\n  val database = SimpleDatabase\n}\n```\n\n####\
  \ 列表 29.9 - 作为 Browser 子类的 SimpleBrowser 对象。\n\n你可以像以前一样使用这些更具插拔性的模块：\n\n```\nscala>\
  \ val apple = SimpleDatabase.foodNamed(\"Apple\").get\n  apple: Food = Apple\n\n\
  \  scala> SimpleBrowser.recipesUsing(apple)\n  res1: List[Recipe] = List(fruit salad)\n\
  ```\n\n但是，现在你可以创建第二个模拟数据库，并配合它使用同一个浏览器类，如 列表 29.10 所示：\n\n```\n object StudentDatabase\
  \ extends Database {\n  object FrozenFood extends Food(\"FrozenFood\")\n\n  object\
  \ HeatItUp extends Recipe(\n    \"heat it up\",\n    List(FrozenFood),\n    \"Microwave\
  \ the food' for 10 minutes.\")\n\n  def allFoods = List(FrozenFood)\n  def allRecipes\
  \ = List(HeatItUp)\n  def allCategories = List(\n    FoodCategory(\"edible\", List(FrozenFood)))\n\
  \n  object StudentBrowser extends Browser {\n    val database = StudentDatabase\n\
  \  }\n}\n```\n\n#### 列表 29.10 - 一个学生数据库和浏览器。\n\n### 将模块拆分为特征（traits）\n\n通常情况下，一个模块太大，无法舒适地放入单个文件中。当发生这种情况时，你可以使用特征将模块拆分到单独的文件。例如，假设你想将分类代码从主\
  \ `Database` 文件中移出并它自己的文件中。你可以为这些代码创建一个特征，如 列表 29.11 所示。\n\n```\n trait FoodCategories\
  \ {\n  case class FoodCategory(name: String, foods: List[Food])\n  def allCategories:\
  \ List[FoodCategory]\n}\n```\n\n#### 列表 29.11 - 用于食品分类的特征。\n\n现在，`Database` 可以混入\
  \ `FoodCategories` 特征，而不是自己定义 `FoodCategory` 和 `allCategories`，如 列表 29.12 所示：\n\n\
  ```\n abstract class Database extends FoodCategories {\n  def allFoods: List[Food]\n\
  \  def allRecipes: List[Recipe]\n  def foodNamed(name: String) =\n    allFoods.find(f\
  \ => f.name == name)\n}\n```\n\n#### 列表 29.12 - 一个混入 FoodCategories 特征的 Database\
  \ 类。\n\n你可能尝试将 `SimpleDatabase` 分为两个特征，一个用于食物，一个用于食谱。这将允许你如 列表 29.13 所示所示定义 `SimpleDatabase`：\n\
  \n```\n object SimpleDatabase extends Database\n  with SimpleFoods with SimpleRecipes\n\
  ```\n\n#### 列表 29.13 - 完全由混入组成的 SimpleDatabase 对象。\n\n`SimpleFoods` 特征可以如 列表 29.14\
  \ 所示：\n\n```\n trait SimpleFoods {\n  object Pear extends Food(\"Pear\")\n  def\
  \ allFoods = List(Apple, Pear)\n  def allCategories = Nil\n}\n```\n\n#### 列表 29.14\
  \ - SimpleFoods 特征。\n\n到为止还好，但如果你尝试这样定义 `SimpleRecipes` 特征，遗憾会出现问题：\n\n```\n trait\
  \ SimpleRecipes { // 无法编译\n  object FruitSalad extends Recipe(\n    \"fruit salad\"\
  ,\n    List(Apple, Pear), // 噢\n    \"Mix it all together.\"\n  )\n  def allRecipes\
  \ = List(FruitSalad)\n}\n```\n\n问题在于 `Pear` 位于另一个特征中，因此它不在作用范围内。编译器不知道 `SimpleRecipes`\
  \ 只与 `SimpleFoods` 混合在一起。\n\n然而，有一种方法可以告诉编译器。Scala 提供了自类型（self type） 来处理这种情况。从技术上讲，自类型是在类中提到它时的假设类型。从实践上讲，自类型指定了混入该特征的任何具体类的要求。如果你有一个特征在与另一个或多个特征混合时才使用，那么你可以指定假设那些其他特征。在当前情况下，只需指定\
  \ `SimpleFoods` 的自类型，如 列表 29.15 所示：\n\n```\n trait SimpleRecipes {\n  this: SimpleFoods\
  \ =>\n\n  object FruitSalad extends Recipe(\n    \"fruit salad\",\n    List(Apple,\
  \ Pear), // 现在 Pear 在作用范围内\n    \"Mix it all together.\"\n  )\n  def allRecipes\
  \ = List(FruitSalad)\n}\n```\n\n#### 列表 29.15 - 带有自类型的 SimpleRecipes 特征。\n\n###\
  \ 29.5 运行时链接\n\nScala 模块可以在运行时链接在一起，你可以根据运行时计算决定哪些模块链接到哪些模块。例如，列表 29.16 展示了一个小型程序，它在运行时选择数据库，然后打印出其中所有的苹果食谱：\n\
  \n\n\n\n\n```scala\nobject GotApples {\n  def main(args: Array[String]) = {\n  \
  \  val db: Database =\n      if(args(0) == \"student\")\n        StudentDatabase\n\
  \      else\n        SimpleDatabase\n\n    object browser extends Browser {\n  \
  \    val database = db\n    }\n\n    val apple = SimpleDatabase.foodNamed(\"Apple\"\
  ).get\n\n    for(recipe <- browser.recipesUsing(apple))\n      println(recipe)\n\
  \  } \n}\n```\n\n##### 列表 29.16 - 一个能够动态选择模块实现的应用程序。\n\n现在，如果你使用 `simple-database`，你会发现一个水果沙拉的食谱。如果你使用\
  \ `student-database`，你将发现没有任何一个使用苹果的食谱：\n\n```\n $ scala GotApples simple\n  fruit\
  \ salad\n  $ scala GotApples student\n  $\n```\n\n### 使用 Scala 代码进行配置\n\n你可能会疑惑，自己是否又退回了本章原始示例中的硬链接问题，因为在列表\
  \ 29.16 所示的 `GotApples` 对象中包含了对 `StudentDatabase` 和 `SimpleDatabase` 的硬链接。这里的区别在于，这些硬链接被局部化在一个可以替换的文件中。\n\
  \n每个模块化应用程序都需要某种方式来指定在特定情况下使用的实际模块实现。这种“配置”应用程序的行为按照定义将涉及对具体模块实现类的命名。例如，在 `Spring`\
  \ 应用程序中，你通过在外部 XML 文件中命名实现类来配置。在 Scala 中，你可以通过 Scala 代码本身进行配置。使用 Scala 源码而非 XML\
  \ 进行配置的一个优势是，在通过 Scala 编译器运行你的配置文件时，应该在实际使用之前就发现其中的任何拼写错误。\n\n### 29.6 跟踪模块实例\n\n\
  尽管使用了相同的代码，但上一节创建的不同的 `browser` 和 `database` 模块实际上是相互独立的模块。这意味着每个模块都有其自己的内容，包括任何嵌套类。例如，`SimpleDatabase`\
  \ 中的 `FoodCategory` 与 `StudentDatabase` 中的 `FoodCategory` 是不同的类！\n\n```scala\nscala>\
  \ val category = StudentDatabase.allCategories.head\n  category: StudentDatabase.FoodCategory\
  \ = \n  FoodCategory(edible,List(FrozenFood))\n\nscala> SimpleBrowser.displayCategory(category)\n\
  \                                 ^\n  error: type mismatch;\n  found    : StudentDatabase.FoodCategory\n\
  \  required: SimpleBrowser.database.FoodCategory \n```\n\n如果你希望所有的 `FoodCategory`\
  \ 是同一个类，可以通过将 `FoodCategory` 的定义移出任何类或 trait 之外来实现。\n\n由于示例所示的两个 `FoodCategory`\
  \ 类确实是不同的，编译器报错是正确的。然而，你可能会遇到某些类型相同但编译器无法识别的情况。\n\n在这种情况下，你通常可以使用单例类型（singleton\
  \ types）来解决问题。例如，在 `GotApples` 程序中，编译器不知道 `db` 和 `browser.database` 是相同的。当你尝试在对象之间传递类别时会导致类型错误：\n\
  \n```scala\nobject GotApples {\n  // 其他定义...\n  for (category <- db.allCategories)\n\
  \    browser.displayCategory(category)\n  // ...\n}\nGotApples2.scala:14: error:\
  \ type mismatch;\n  found    : db.FoodCategory\n  required: browser.database.FoodCategory\n\
  \                               ^\n  browser.displayCategory(category)\n```\n\n\
  为了避免此错误，你需要告知编译器它们是相同的。你可以通过如下所示修改 `browser` 的定义来实现：\n\n```scala\nobject browser\
  \ extends Browser {\n  val database = db\n}\n```\n\n##### 列表 29.17 - 使用单例类型。\n\n\
  单例类型是非常具体的且仅包含一个；但在这种，单例类型允许编译器知道 `db` 和 `browser.database` 是相同的。\n\n### 29.7 总结\n\
  \n本章展示了如何使用 Scala 对象作为模块。除了简单的模块外，这种方法提供了创建抽象、可配置模块的多种方式。如既往，使用多少这些功能取决于口味。尽管如此，在阅读本章后，你知道在编写自己的程序时应该使用哪些\
  \ Scala 特性。模块是大型项目的一部分，因此难以实验。\n\n* *\n\n#### 第 29 章脚注：\n\n[1] 该术语由 DeRemer, *et.\
  \ al.* 在“Programming-in-large versus programming-in-small”中引入。DeR75\n\n[2] Fowler，“Inversion\
  \ of control containers and the dependency injection pattern.” Fow04\n\n[3] 这些分层的命名遵循了\
  \ Evans 的《领域驱动设计》。Eva03\n\n[4] 这些类经过了简化，以保持不被真实世界的细节干扰。但是，将这些类转换为可以使用 Hibernate\
  \ 或 Java 持久化体系持久化的实体，只需要少数修改，例如添加一个私有的 `Long id` 字段和一个无参构造函数，在字段上放置 `scala.reflect.BeanProperty`\
  \ 注解，通过注解或或单独的 XML 文件指定适当的映射等。\n\n[5] 这是很好的，因为这些架构层中的每一层都应该只依赖于下方的层。\n\n\n\n\nScala\
  \ 也有一个表示对象标识性（object identity）的相等方法，但并不常用。这种写为 `x eq y` 的相等性在 `x` 和 `y` 引用同一个对象时为真。Scala\
  \ 将 `==` 等等性预留给每种类型的“自然”相等。对于值类型，`==` 是值比较，就像 Java 一样。对于引用类型，`==` 与 Scala 中的 `equals`\
  \ 相同。你可以通过重写 `equals` 方法为新类型重新定义 `==` 的行为，该方法始终继承自 `Any` 类。除非被重写，否则继承的 `equals`\
  \ 起作用的是对象标识性，这与 Java 的相同。因此，默认情况下 `equals`（以及随之来的 `==`）与 `eq` 相同，但你可以通过在定义的类中重写\
  \ `equals` 方法来改变它的行为。无法直接重写 `==`，因为它在 `Any` 类中被定义为 `final` 方法。这意味着，Scala 处理 `==`\
  \ 的方式就像在 `Any` 类中如下定义所示：\n\n```scala\nfinal def == (that: Any): Boolean = \n  if\
  \ (null eq this) {null eq that} else {this equals that}\n```\n\n### 30.2 编写相等方法\n\
  \n`equals` 方法应该如何定义？事实证明，在面向对象的语言中，编写一个正确的相等方法出奇地困难。事实上，在研究了大量的 Java 代码后，2007 年某论文的作者得出结论：几乎所有的\
  \ `equals` 方法实现都是错误的[[1]](#object-equality.html_footnotemain30-1) 这是一个问题，因为相等性是许多其他事情的基础。例如，类型\
  \ `C` 的错误相等方法可能意味着你无法可靠地将类型为 `C` 的对象放入集合。\n\n例如，你可能有两个类型为 `C` 的元素 `elem1` 和 `elem2`，它们是相等的（即“elem1\
  \ equals elem2”返回真）。尽管如此，由于 `equals` 方法常见的错误实现，你仍然可能看到如下行为：\n\n```scala\nvar hashSet:\
  \ Set[C] = new collection.immutable.HashSet\nhashSet += elem1\nhashSet contains\
  \ elem2    // 返回 false!\n```\n\n以下是四个在重写 `equals` 时可能导致行为不的常见陷阱[[2]](#object-equality.html_footnotemain30-2)：\n\
  \n1. 使用错误的签名定义 `equals`。\n2. 在不更改 `hashCode` 的情况下更改了 `equals`。\n3. 根据可变字段定义 `equals`。\n\
  4. 未将 `equals` 定义为等价关系。\n\n这四个陷阱将在本节的剩余部分进行讨论。\n\n#### 陷阱 #1：使用错误的签名定义 equals\n\n\
  考虑为以下简单的点类添加一个相等方法：\n\n```scala\nclass Point(val x: Int, val y: Int) { ... }\n```\n\
  \n一种显而易见但错误的方法是这样定义：\n\n```scala\n// 一个完全错误的 equals 定义\ndef equals(other: Point):\
  \ Boolean =\n  this.x == other.x && this.y == other.y\n```\n\n这个方法有什么问题？从表面上看，它似乎运行正常：\n\
  \n```scala\nscala> val p1, p2 = new Point(1, 2)\n  p1: Point = Point@37d7d90f\n\
  \  p2: Point = Point@3beb846d\n\nscala> val q = new Point(2, 3)\n  q: Point = Point@e0cf182\n\
  \nscala> p1 equals p2\n  res0: Boolean = true\n\nscala> p1 equals q\n  res1: Boolean\
  \ = false\n```\n\n然而，一旦你开始将点放入集合，问题就开始了：\n\n```scala\nscala> import scala.collection.mutable\n\
  import scala.collection.mutable\n\nscala> val coll = mutable.HashSet(p1)\ncoll:\
  \ scala.collection.mutable.HashSet[Point] = \nSet(Point@37d7d90f)\n\nscala> coll\
  \ contains p2\n  res2: Boolean = false\n```\n\n如何解释 `coll` 不包含 `p2`，尽管 `p1` 已添加到其中，且\
  \ `p1` 和 `p2` 是相等的对象？原因在接下来的交互中变得明朗，其中一个被比较点的精确类型被掩盖了。将 `p2a` 定义为 `p2` 的别名，但类型为\
  \ `Any` 而不是 `Point`：\n\n```scala\nscala> val p2a: Any = p2\n  p2a: Any = Point@3beb846d\n\
  ```\n\n现在，如果你重复第一次比较，但使用别名 `p2a`，你将得到：\n\n```scala\nscala> p1 equals p2a\n  res1:\
  \ Boolean = false\n```\n\n\n\n\n`p1` 和 `p2` 的哈希值几乎肯定是不同的，尽管这两个点的字段是相同的。不同的哈希值意味着在高概率下，它们在集合中处于不同的哈希桶（hash\
  \ bucket）。`contains` 测试将会在与 `p2` 哈希值对应的桶中查找匹配的元素。在大多数情况下，点 `p1` 会在另一个桶中，因此它永远不会被找到。`p1`\
  \ 和 `p2` 也可能碰巧落入同一个哈希桶中。在这种情况下，测试将返回 `true`。问题在于，`Point` 的上一个实现违反了为 `Any` 类定义的 `hashCode`\
  \ 约。\n\n如果两个对象根据 `equals` 方法是相等的，那么对这两个对象中的每一个调用 `hashCode` 方法必须产生相同的整数结果。\n\n事实上，Java\
  \ 中众所周知的是 `hashCode` 和 `equals` 应该始终一起重定义。此外，`hashCode` 只能依赖于 `equals` 所依赖的字段。对于\
  \ `Point` 类，以下是 `hashCode` 的一个合适定义：\n\n```\n class Point(val x: Int, val y: Int)\
  \ {\n  override def hashCode = (x, y).##\n  override def equals(other: Any) = other\
  \ match { \n    case that: Point => this.x == that.x && this.y == that.y \n    case\
  \ _ => false \n  }\n}\n```\n\n这只是 `hashCode` 的许多可能实现之一。请记住 `##` 方法是计算哈希值的简写，它适用于原始值、引用类型和空。当在集合或元组上调用时，它会计算一个混合哈希，该哈希对集合中所有元素的哈希值敏感。我们将在本章稍后的部分提供更多关于编写\
  \ `hashCode` 的指导。\n\n添加 `hashCode` 解决了定义像 `Point` 等类时的等效性问题；然而，还有其他需要注意的问题点。\n\n\
  ### 陷阱 #3：基于可变字段定义 equals\n\n考虑 `Point` 类的以下细微变体：\n\n```\n class Point(var x: Int,\
  \ var y: Int) { // 有问题\n  override def hashCode = (x, y).##\n  override def equals(other:\
  \ Any) = other match { \n    case that: Point => this.x == that.x && this.y == that.y\
  \ \n    case _ => false \n  }\n}\n```\n\n唯一的区别是字段 `x` 和 `y` 现在是 `vars` 而不是 `vals`。`equals`\
  \ 和 `hashCode` 方法现在基于这些可变字段定义的，因此当字段改变时，它们的结果也会改变。一旦你将点放入集合，这可能会产生奇怪的影响：\n\n```\n\
  scala> val p = new Point(1, 2)\n  p: Point = Point@5428bd62\n\n  scala> val coll\
  \ = collection.mutable.HashSet(p)\n  coll: scala.collection.mutable.HashSet[Point]\
  \ = \n  Set(Point@5428bd62)\n\n  scala> coll contains p\n  res5: Boolean = true\n\
  ```\n\n现在，如果你改变点 `p` 中的一个字段，集合还包含该点吗？我们试一下：\n\n```\nscala> p.x += 1\n\n  scala>\
  \ coll contains p\n  res7: Boolean = false\n```\n\n这看起来很奇怪。`p` 去去哪儿了？如果你检查集合的迭代器是否包含\
  \ `p`，会得到更奇怪的结果：\n\n```\nscala> coll.iterator contains p\n  res8: Boolean = true\n\
  ```\n\n所以这里有一个不包含 `p` 的集合，但 `p` 却是集合的元素之一！发生的情况是在修改了 `x` 字段后，点 `p` 最终落在集合 `coll`\
  \ 错误的哈希桶中。也就是说，它的原始哈希桶不再与其哈希值的新值对应。从某种意义上说，尽管点 `p` 仍然属于它的元素，它已经在集合 `coll` 中“消失了”。\n\
  \n从这个例子中得到的教训是，当 `equals` 和 `hashCode` 依赖于可变状态时，会给潜在用户带来麻烦。如果你将此类对象放入集合，你必须小心不要修改所依赖的状态，这是困难的。如果你需要一个考虑对象当前状态的比较，通常应该给它起另一个名字，而不是\
  \ `equals`。\n\n考虑到 `Point` 的最后一个定义，最好省略重定义 `hashCode`，并将比较方法命名为 `equalContents`\
  \ 或其他不同于 `equals` 的名称。这样 `Point` 将继承 `equals` 和 `hashCode` 的默认实现；即使在修改了 `x` 字段后，`p`\
  \ 在 `coll` 中仍然是可以找到的。\n\n### 陷阱 #4：未能将 equals 定义为等价关系\n\n`scala.Any` 中 `equals`\
  \ 方法的约规定 `equals` 必须对非空对象实现等价关系：\n\n- 它是自反的：对于任何非空值 `x`，表达式 `x.equals(x)` 应返回 `true`。\n\
  - 它是对称的：对于任何非空值 `x` 和 `y`，仅当 `y.equals(x)` 返回 `true` 时，`x.equals(y)` 应返回 `true`。\n\
  - 它是传递的：对于任何非空值 `x, y, 和 z`，如果 `x.equals(y)` 返回 `true` 且 `y.equals(z)` 返回 `true`，那么\
  \ `x.equals(z)` 应返回 `true`。\n- 它是一致的：对于任何非空值 `x` 和 `y`，只要用于对象 `equals` 比较的信息没有被修改，多次调用\
  \ `x.equals(y)` 应该一致返回 `true` 或一致返回 `false`。\n- 对于任何非空值 `x`，`x.equals(null)` 应返回\
  \ `false`。\n\n到目前为止 `Point` 类的 `equals` 定义符合该约。然而，一旦考虑到子类，情况就会变得复杂。假设有一个子类 `ColoredPoint`，它添加了一个字段\
  \ `color`。假设 `Color` 被定义为枚举：\n\n```\nobject Color {\n  Red, Orange, Green, Blue,\
  \ Indigo, Violet\n}\n```\n\n`ColoredPoint` 重写了 `equals` 以考虑新字段：\n\n```\nclass ColoredPoint(x:\
  \ Int, y: Int, val color: Color) extends Point(x, y) {\n  override def equals(other:\
  \ Any) = other match {\n    case that: ColoredPoint => this.color == that.color\
  \ && super.equals(that)\n    case _ => false\n  }\n}\n```\n\n这是许多程序员可能会写的代码。注意，在这种情况下，`ColoredPoint`\
  \ 不需要重写 `hashCode`。由于 `ColoredPoint` 上新的 `equals` 定义比 `Point` 更严格（意味着它等等的对象对更少），因此\
  \ `hashCode` 的约仍然有效。如果两个彩色点相等，它们具有相同的坐标，因此它们的哈希值保证相等。\n\n单单看 `ColoredPoint` 类，它的\
  \ `equals` 定义看起来是好的。然而，一旦混合了点和彩色点，`equals` 的约就被破坏了。考虑：\n\n```\nscala> val p = new\
  \ Point(1, 2)\n  p: Point = Point@5428bd62\n\n  scala> val cp = new ColoredPoint(1,\
  \ 2, Color.Red)\n  cp: ColoredPoint = ColoredPoint@5428bd62\n\n  scala> p equals\
  \ cp\n  res9: Boolean = true\n\n  scala> cp equals p\n  res10: Boolean = false\n\
  ```\n\n`p equals cp` 调用了 `p` 的 `equals` 方法，该方法定义在 `Point` 类中。它只考虑两个点的坐标。因此，比较结果为\
  \ `true`。另一方面，`cp equals p` 调用了 `cp` 的 `equals` 方法，该方法定义在 `ColoredPoint` 类中。由于 `p`\
  \ 不是 `ColoredPoint`，该方法返回 `false`。所以由 `equals` 定义的关系不是对称的。\n\n对称性的丢失会对集合产生意想不到的后果。这里有一个用例：\n\
  \n```\nscala> collection.mutable.HashSetPoint contains cp\n  res11: Boolean = true\n\
  \n  scala> collection.mutable.HashSetPoint contains p\n  res12: Boolean = false\n\
  ```\n\n尽管 `p` 和 `cp` 相等，一个 `contains` 测试成功了而另一个失败了。\n\n\n\n\n你如何修改 `equals` 的定义使其具有对称性呢？本质上有两种方法。你可以让关系变得更通用，也可以变得更严格。变得更通用意味着：如果对两个对象\
  \ `x` 和 `y` 比较 `x` 与 `y` 或比较 `y` 与 `x` 任一个为真，则认为它们相等。这里是实现此点的代码：\n\n```scala\n class\
  \ ColoredPoint(x: Int, y: Int, val color: Color.Value) \n  extends Point(x, y) {\
  \ // 问题：equals 不具有传递性\n\n  override def equals(other: Any) = other match {\n   \
  \ case that: ColoredPoint =>\n      (this.color == that.color) && super.equals(that)\n\
  \    case that: Point =>\n      that equals this\n    case _ =>\n      false\n \
  \ }\n}\n```\n\n`ColoredPoint` 中 `equals` 的新定义比旧多了一个情况：如果另一个对象是 `Point` 但不是 `ColoredPoint`，该方法将转发给\
  \ `Point` 的 `equals` 方法。这达到了让 `equals` 对称的预期效果。现在，`cp equals p` 和 `p equals cp`\
  \ 的结果均为真。然而，`equals` 的契约仍然被破坏了。问题在于新的关系不再具有传递性！\n\n这里是一组演示此点的语句序列。定义一个点和两个不同颜色的彩色点，它们位于相同的位置：\n\
  \n```scala\nscala> val redp = new ColoredPoint(1, 2, Color.Red)\n  redp: ColoredPoint\
  \ = ColoredPoint@5428bd62\n\n  scala> val bluep = new ColoredPoint(1, 2, Color.Blue)\n\
  \  bluep: ColoredPoint = ColoredPoint@5428bd62\n```\n\n单独来看，`redp` 等于 `p` 且 `p`\
  \ 等于 `bluep`：\n\n```scala\nscala> redp == p\n  res13: Boolean = true\n\n  scala>\
  \ p == bluep\n  res14: Boolean = true\n```\n\n然而，比较 `redp` 和 `bluep` 却为假：\n\n```scala\n\
  scala> redp == bluep\n  res15: Boolean = false\n```\n\n因此，`equals` 契约中的传递性条款违反了。\n\
  \n让 `equals` 关系更通用似乎导致了死胡同。我们将尝试让它更严格。让 `equals` 更严格的一种方法是始终将不同类的对象视为不同的对象。这可以通过修改\
  \ `Point` 和 `ColoredPoint` 类中的 `equals` 方法来实现。在 `Point` 类中，你可以添加一个额外的比较，检查另一个 `Point`\
  \ 的运行时类是否与此 `Point` 的类完全相同：\n\n```scala\n // 一个技术上有效但令人不满的 equals 方法\n class Point(val\
  \ x: Int, val y: Int) {\n  override def hashCode = (x, y).##\n  override def equals(other:\
  \ Any) = other match {\n    case that: Point => \n      this.x == that.x && this.y\
  \ == that.y && \n      this.getClass == that.getClass\n    case _ => false\n  }\n\
  }\n```\n\n然后你可以将 `ColoredPoint` 的实现恢复到之前那个违反对称性要求的版本：\n\n```scala\n class ColoredPoint(x:\
  \ Int, y: Int, val color: Color.Value) \n  extends Point(x, y) {\n\n  override def\
  \ equals(other: Any) = other match {\n    case that: ColoredPoint =>\n      (this.color\
  \ == that.color) && super.equals(that)\n    case _ => false\n  }\n}\n```\n\n在这里，`Point`\
  \ 类的实例被认为等于同类的某些实例，仅当这些对象具有相同的坐标且具有相同的运行时类时（即任意一个对象上的 `getClass` 返回相同的值）相等。新定义满足了对称性和传递性，因为现在不同类对象之间的每次比较都返回假。因此，彩色点永远不会等于一个点。这种约定看起来是合理的，但人们可能会认为这个新定义太严格了。\n\
  \n考虑以下定义坐标为 (1, 2) 点的迂回方法：\n\n```scala\nscala> val pAnon = new Point(1, 1) { override\
  \ val y = 2 }\n  pAnon: Point = $anon$1@5428bd2\n```\n\n`pAnon` 等于 `p` 吗？答案是否，因为与\
  \ `p` 和 `pAnon` 关联的 `java.lang.Class` 对象是不同的。对于 `p` 它是 `Point`，而对于 `pAnon` 它是匿名子类。但显然，`pAnon`\
  \ 另一个位于 (1, 2) 的点。将它视为与 `p` 不同似乎是不合理的。\n\n所以我们似乎被住了。有没有一种合理的方法可以在类的多个层次上重新定义相等，同时保持其契约？事实上，有这样的方法，但它需要另外一个方法来共同重新定义\
  \ `equals` 和 `hashCode`。其思想是：一旦一个类重新定义了 `equals`（以及 `hashCode`），它也应该声明该类的对象永远不会等于某些父类的对象。这通过向每个重新定义了\
  \ `equals` 的类添加一个 `canEqual` 方法来实现。该方法的签名如下：\n\n```scala\ndef canEqual(other: Any):\
  \ Boolean\n```\n\n如果另一个对象是 `canEqual` 所在类的实例，该方法应返回真；否则返回假。它由 `equals` 方法调用，以确保对象是可比较的。30.1\
  \ 展示了 `Point` 的这种实现：\n\n```scala\nclass Point(val x: Int, val y: Int) {\n  override\
  \ def hashCode = (x, y).##\n  override def equals(other: Any) = other match {\n\
  \    case that: Point =>\n      this.canEqual(that) && this.x == that.x && this.y\
  \ == that.y\n    case _ => false\n  }\n  def canEqual(other: Any): Boolean =\n \
  \   other.isInstanceOf[Point]\n}\n```\n\n#### 列表 30.1 - 父类的 equals 方法\n\n`Point`\
  \ 的这个版本包含了额外的要求，即另一个对象可以等于它。30.2 展示了相应的实现：\n\n```scala\n class ColoredPoint(x: Int,\
  \ y: Int, val color: Color.Value) \n  extends Point(x, y) {\n\n  override def equals(other:\
  \ Any) = other match {\n    case that: ColoredPoint =>\n      (this.color == that.color)\
  \ && super.equals(that)\n    case _ => false\n  }\n  override def canEqual(other:\
  \ Any): Boolean =\n    other.isInstanceOf[ColoredPoint]\n}\n```\n\n#### 列表 30.2\
  \ - 子类的 equals 方法\n\n可以证明 `Point` 和 `ColoredPoint` 的新定义保持了 `equals` 的契约。相等性是对称且传递的。比较\
  \ `Point` 和 `ColoredPoint` 总是返回假。事实上，对于任何点 `p` 和彩色点 `cp`，`p equals cp` 将返回假，因为 `cp\
  \ canEqual p` 返回假。相反比较 `cp equals p` 也会返回假，因为 `p` 不是 `ColoredPoint`，所以 `ColoredPoint`\
  \ 中 `equals` 体的第一个模式匹配将失败。\n\n另一方面，`Point` 不同子类的实例可以是相等的，只要这些类中没有类重新定义相等方法。例如，使用新的类定义，`p`\
  \ 和 `pAnon` 的比较将产生真。这里是一些例子：\n\n```scala\nscala> val p = new Point(1, 2)\n  p: Point\
  \ = Point@5428bd62\n\n  scala> val cp = new ColoredPoint(1, 2, Color.Indigo)\n \
  \ cp: ColoredPoint = ColoredPoint@e62308f\n\n  scala> val pAnon = new Point(1, 1)\
  \ { override val y = 2 }\n  pAnon: Point = $anon$1@5428bd2\n\n  scala> val coll\
  \ = List(p)\n  coll: List[Point] = List(Point@5428bd62)\n\n  scala> coll contains\
  \ p \n  res16: Boolean = true\n\n  scala> coll contains cp\n  res17: Boolean = false\n\
  \n  scala> coll contains pAnon\n  res18: Boolean = true\n```\n\n\n\n这些示例表明，如果一个父类的等等性定义并调用了\
  \ `canEqual`，那么实现子类的程序员就可以决定他们的子类是否可以与父类的实例相等。例如，由于 `ColoredPoint` 重写了 `canEqual`，一个彩色点可能永远不会与一个普通点相等。但由于从\
  \ `pAnon` 中引用的匿名子类没有重写 `canEqual`，它的实例可以与一个 `Point` 实例相等。\n\n`canEqual` 方法的一个潜在批评是它违反了里氏基夫替换原则（LSP）。例如，这种通过比较运行时类来实现\
  \ get `equals` 的技术，导致了无法定义一个实例可以与父类实例相等的子类，这种技术被描述为对 LSP 的违背。[[7]](#object-equality.html_footnotemain30-7)。LSP\
  \ 规定，你应该能够在需要父类实例的地方使用（替换）子类实例。\n\n然而，在上一个例子中，尽管 `cp` 的 `x` 和 `y` 值与集合中的点匹配，但 `\"\
  coll contains cp\"` 仍然返回了 `false`。因此，这看起来像是违反了 LSP，因为你无法在期望 `Point` 的地方使用 `ColoredPoint`。我们认为这种解释是错误的，因为\
  \ LSP 并不要求子类的行为与其父类完全相同，只要它的行为符合其父类的契约。\n\n编写一个比较运行时类的 `equals` 方法的问题不在于它违反了 LSP，而在于它没有为你提供一种方法创建一个实例可以与父类实例相等的子类。例如，如果在上一个例子中使用运行时类技术，`\"\
  coll contains pAnon\"` 将返回 `false`，而这并不是我们想要的。相比之下，我们确实希望 `\"coll contains cp\"\
  ` 返回 `false`，因为通过在 `ColoredPoint` 中重写 `equals`，我们基本上是在说坐标为 (1, 2) 的靛色点*不是*与 (1,\
  \ 2) 的未着点是同一种东西。因此，在上一个例子中，我们能够将两个不同的 `Point` 子类实例传递给集合的 `contains` 方法，并得到了两个不同的答案，两者都是正确的。\n\
  \n### 30.3 为泛型类型等等性\n\n之前示例中的 `equals` 方法都以一个模式匹配开始，测试操作数的类型是否符合包含 `equals` 方法的类的类型。当类被参数化时，这种方案需要稍微调整。\n\
  \n例如，考虑二叉树。Listing 30.3 所示的类层次定义了一个用于二叉树的抽象类 `Tree`，具有两种替代实现：`EmptyTree` 对象和代表非空树的\
  \ `Branch` 类。非空树由某个元素 `elem` 以及左子树和右树组成。它的元素类型由类型参数 `T` 给出。\n\n```scala\ntrait Tree[+T]\
  \ {\n  def elem: T\n  def left: Tree[T]\n  def right: Tree[T]\n}\n\nobject EmptyTree\
  \ extends Tree[Nothing] {\n  def elem =\n    throw new NoSuchElementException(\"\
  EmptyTree.elem\")\n  def left =\n    throw new NoSuchElementException(\"EmptyTree.left\"\
  )\n  def right =\n      throw new NoSuchElementException(\"EmptyTree.right\")\n\
  }\n\nclass Branch+T extends Tree[T]\n```\n\n##### Listing 30.3 - 二叉树的层次结构。\n\n现在我们为这些类添加\
  \ `equals` 和 `hashCode` 方法。对于 `Tree` 类本身，不需要做什么，因为我们假设这些方法是为抽象类的每个实现单独实现的。对于 `EmptyTree`\
  \ 对象，仍然不需要做什么，因为 `EmptyTree` 继承自 `AnyRef` 的 `equals` 和 `hashCode` 默认实现运行良好。毕竟，一个\
  \ `EmptyTree` 只与自己相等，所以等等性应该是引用相等性，这正是从 `AnyRef` 继承而来的。\n\n但在 `Branch` 中添加 `equals`\
  \ 和 `hashCode` 需要一些工作。一个 `Branch` 值只应该与其他 `Branch` 值相等，并且仅当两个值具有相同的 `elem`、`left`\
  \ 和 `right` 字段时才相等。应用在本章之前节中开发的 `equals` 方案是自然的。这将给你：\n\n```scala\nclass BranchT\
  \ extends Tree[T] {\n\n  override def equals(other: Any) = other match {\n    case\
  \ that: Branch[T] => this.elem == that.elem && \n                           this.left\
  \ == that.left &&\n                           this.right == that.right\n    case\
  \ _ => false\n  }\n}\n```\n\n然而，编译此示例表明发生了“未检查（unchecked）”警告。使用 `-unchecked` 选项再次编译会显示以下问题：\n\
  \n```bash\n$ fsc -unchecked Tree.scala\n  Tree.scala:14: warning: non variable type-argument\
  \ T in type\n  pattern is unchecked since it is eliminated by erasure\n    case\
  \ that: Branch[T] => this.elem == that.elem && \n                      ^\n```\n\n\
  正如警告所示，有一个针对 `Branch[T]` 类型的模式匹配，但系统只能检查另一个引用是 `Branch`，由于类型擦除，该模式是未检查的。\n\n比较运行时类的方法的问题不在于它违反了\
  \ LSP，而在于它没有为你提供一种方法创建一个实例可以与父类实例相等的子类。例如，如果在上一个例子中使用运行时类技术，`\"coll contains pAnon\"\
  ` 将返回 `false`，而这并不是我们想要的。相比之下，我们确实希望 `\"coll contains cp\"` 返回 `false`，因为通过在 `ColoredPoint`\
  \ 中重写 `equals`，我们基本上是在说坐标为 (1, 2) 的靛色点*不是*与 (1, 2) 的未着点是同一种东西。因此，在上一个例子中，我们能够将两个不同的\
  \ `Point` 子类实例传递给集合的 `contains` 方法，并得到了两个不同的答案，两者都是正确的。\n\n正如警告所示，有一个针对 `Branch[T]`\
  \ 类型的模式匹配，但系统只能检查另一个引用是 `Branch`，由于类型擦除，该模式是未检查的。\n\n编写一个比较运行时类的 `equals` 方法的问题不在于它违反了\
  \ LSP，而在于它没有为你提供一种方法创建一个实例可以与父类实例相等的子类。例如，如果在上一个例子中使用运行时类技术，`\"coll contains pAnon\"\
  ` 将返回 `false`，而这并不是我们想要的。相比之下，我们确实希望 `\"coll contains cp\"` 返回 `false`，因为通过在 `ColoredPoint`\
  \ 中重写 `equals`，我们基本上是在说坐标为 (1, 2) 的靛色点*不是*与 (1, 2) 的未着点是同一种东西。因此，在上一个例子中，我们能够将两个不同的\
  \ `Point` 子类实例传递给集合的 `contains` 方法，并得到了两个不同的答案，两者都是正确的。\n\n所以你可以做什么？幸运的是，事实证明你不需要检查两个\
  \ Branch 是否具有相同的类型。只要字段相同，不同类型的 Branch 也可以相等。一个简单的例子就是：\n\n```scala\nscala> val\
  \ b1 = new BranchString\nb1: Branch[String]@d5fa4\n\nscala> val b2 = new BranchInt\n\
  b2: Branch[Int]@56cd29\n\nscala> b1 == b2\nres1: Boolean = true\n```\n\n上述比较的结果是通过之前显示的\
  \ `equals` 实现获得的。这表明 Branch 的元素类型没有被检查——如果检查了，结果将是 `false`。\n\n我们可以对两种比较结果哪一种更自然产生意见。最终，这取决于对类的心理模型。\n\
  \n等等，为了制定一个不产生未检查警告的 `equals` 方法，只需要一个微小的改动。不要使用元素类型 `T`，而是使用小写字母，如 `t`：\n\n```scala\n\
  case that: Branch[t] => this.elem == that.elem && \n                       this.left\
  \ == that.left &&\n                       this.right == that.right\n```\n\n从 15.2\
  \ 节 回忆，模式中以小写字母开头的类型参数代表未知类型。现在模式匹配：\n\n```scala\ncase that: Branch[t] =>\n```\n\
  \n将对任何类型的 Branch 值成功。类型参数 `t` 代表 Branch 未知的元素类型。它也可以被替换为下划线，如下所示，这与上一个用等效：\n\n```scala\n\
  case that: Branch[_] =>\n```\n\n\n\n\n剩下的工作是为 `Branch` 类定义另外两个方法：`hashCode` 和 `canEqual`，它们与\
  \ `equals` 配合使用。这里是 `hashCode` 的一种可能实现方式：\n\n```scala\n override def hashCode: Int\
  \ = (elem, left, right).##\n```\n\n这只是许多可能实现方式之一。如前所示，原则是获取所有字段的 `hashCode` 值并将它们组合。这里是\
  \ `Branch` 类中 `canEqual` 方法的实现方式：\n\n```scala\n def canEqual(other: Any) = other\
  \ match {\n  case that: Branch[_] => true\n  case _ => false\n }\n```\n\n`canEqual`\
  \ 方法的实现使用了带类型的模式匹配。也可以使用 `isInstanceOf` 来编写：\n\n```scala\n def canEqual(other: Any)\
  \ = other.isInstanceOf[Branch[_]]\n```\n\n如果你想吹吹牛毛——我们非常鼓励你这样做！——你可能会奇奇上述类型中下划线的出现代表了什么。毕竟，`Branch[_]`\
  \ 在技术上是一个方法的类型参数，而不是一个类型模式。那么，为什么可能让它的部分部分未定义呢？\n\n这个问题的答案将在下一章讨论。`Branch[_]` 是所谓的通配符类型（wildcard\
  \ type）的缩写，简单来说，它是一个包含某些未知部分的类型。因此，尽管下划线在模式匹配和方法调用的类型参数中代表代表两种不同的含义，但本质上它们的意义是相同的：它允许你标记某个未知的事物。`Branch`\
  \ 的最终版本见 Listing 30.4。\n\n```scala\n class BranchT extends Tree[T] {\n\n    override\
  \ def equals(other: Any) = other match {\n      case that: Branch[_] => (that canEqual\
  \ this) && \n                              this.elem == that.elem && \n        \
  \                      this.left == that.left &&\n                             \
  \ this.right == that.right\n      case _ => false\n    }\n\n    def canEqual(other:\
  \ Any) = other.isInstanceOf[Branch[_]]\n\n    override def hashCode: Int = (elem,\
  \ left, right).##\n  }\n```\n\n##### Listing 30.4 - 带有 equals 和 hashCode 的泛型类型。\n\
  \n### 30.4 equals 和 hashCode 的配方\n\n在本节中，我们将提供创建 `equals` 和 `hashCode` 方法的逐步配方，这应该适用于大多数情况。作为示例，我们将使用\
  \ `Rational` 类的方法，该类见 Listing 30.5。\n\n为了创建这个类，我们从 Listing 6.5 此处所示的 `Rational`\
  \ 类版本中删除了数学运算符方法。我们还对 `toString` 进行了微小的改进，并修改了 `numer` 和 `denom` 的初始化器，以将所有分数归一化为正分母（即将\
  \ ¹/[-2] 转换为 -1/[2]）。\n\n#### equals 配方\n\n这里是重写 `equals` 的配方：\n\n1. 在非 final 类中重写\
  \ `equals` 时，创建一个 `canEqual` 方法。如果继承的 `equals` 定义来自 `AnyRef`（即 `equals` 在类层次结构的上层没有被重定义），则\
  \ `canEqual` 的定义应该是新的；否则，它将覆盖之前同名方法的定义。该要求的唯一例外是重定义了从 `AnyRef` 继承的 `equals` 方法的\
  \ final 类。对于这些类，不会出现 30.2 节中描述的子类异常；因此它们不定义 `canEqual`。`canEqual` 接收的对象类型应该是 `Any`：\n\
  ```scala\n def canEqual(other: Any): Boolean =\n```\n2. 如果参数对象是当前类的实例（即定义 `canEqual`\
  \ 的类），`canEqual` 方法应返回 `true`，否则返回 `false`：\n```scala\n other.isInstanceOf[Rational]\n\
  ```\n3. 在 `equals` 方法中，确保将对象的类型为 `Any`：\n```scala\n override def equals(other: Any):\
  \ Boolean =\n```\n4. 将 `equals` 方法体写为一个单一 `match` 表达式。`match` 的选择器应该是传递给 `equals`\
  \ 的对象：\n```scala\n match {\n  //...\n }\n```\n5. `match` 表达式应该有两个分支。第一个 `case` 应该为你正在定义\
  \ `equals` 方法的类声明一个带类型的模式：\n```scala\n case that: Rational =>\n```\n6. 在该 `case`\
  \ 的体中，编写一个逻辑与（and）连接的表达式，这些表达式对象对象相等必须为真。如果你重写的 `equals` 方法不是 `AnyRef` 类型，你可能想要包含对父类\
  \ `equals` 方法的调用：\n```scala\n super.equals(that) &&\n```\n如果你正在为第一个引入了 `canEqual`\
  \ 的类定义 `equals`，你应该在参数上调用 `canEqual`，并将 `this` 传递给参数：\n```scala\n (that canEqual\
  \ this) &&\n```\n重写 `equals` 的重新定义也应该包含 `canEqual` 的调用，除非它们包含了对 `super.equals` 的调用。在后者的情况下，`canEqual`\
  \ 测试将由父类调用完成。最后，对于每个与等效性相关的字段，验证此对象中的字段是否与传递对象的相应字段相等：\n```scala\n numer == that.numer\
  \ &&\n  denom == that.denom\n```\n7. 对于第二个 `case`，使用返回 `false` 的通配符模式：\n```scala\n\
  \ case _ => false\n```\n如果你遵循这个 `equals` 配方，则等效性保证是一个等价关系，正如 `equals` 约所要求的。\n\n\
  ```scala\n class Rational(n: Int, d: Int) {\n  require(d != 0)\n  private val g\
  \ = gcd(n.abs, d.abs)\n  val numer = (if (d < 0) -n else n) / g\n  val denom = d.abs\
  \ / g\n\n  private def gcd(a: Int, b: Int): Int =\n    if (b == 0) a else gcd(b,\
  \ a % b)\n\n  override def equals(other: Any): Boolean =\n    other match {\n  \
  \    case that: Rational =>\n        (that canEqual this) &&\n        numer == that.numer\
  \ &&\n        denom == that.denom\n      case _ => false\n    }\n\n  def canEqual(other:\
  \ Any): Boolean =\n    other.isInstanceOf[Rational]\n\n  override def hashCode:\
  \ Int = (numer, denom).##\n\n  override def toString =\n    if (denom == 1) numer.toString\
  \ else s\"$numer/$denom\"\n  }\n```\n\n##### Listing 30.5 - 带有 equals 和 hashCode\
  \ 的 Rational 类。\n\n#### hashCode 配方\n\n对于 `hashCode`，如果你使用以下配方，通常可以获得满意的结果，该配方类似于《Effective\
  \ Java》[[8]](#object-equality.html_footnotemain30-8)对 Java 类的建议。在计算中包含 `equals`\
  \ 方法用于确定相等性的对象的每个字段（“相关”字段）。创建一个包含这些字段值的元组。然后，对生成的元组调用 `##`。\n\n例如，为具有五个相关字段 `a`、`b`、`c`、`d`\
  \ 和 `e` 的对象实现哈希码，你可以写：\n\n```scala\n override def hashCode: Int = (a, b, c, d, e).##\n\
  ```\n\n如果 `equals` 方法在计算时调用了 `super.equals`，那么你应该在开始 `hashCode` 计算时包含对 `super.hashCode`\
  \ 的调用。例如，如果 `Rational` 的 `equals` 方法调用了 `super.equals(that)`，那么它的 `hashCode` 应该是：\n\
  \n```scala\n override def hashCode: Int = (super.hashCode, numer, denom).##\n```\n\
  \n\n\n\n\n在使用这种方法编写 `hashCode` 方法时，需要记住的一点是：你的哈希值的好坏取决于你由此构建的哈希值，即你通过调用对象相关字段的 `hashCode`\
  \ 所获得的哈希值。有时，为了给该字段获取用的哈希值，你可能需要在调用字段的 `hashCode` 之外进行额外操作。例如，如果其中一个字段是一个集合（collection），你可能希望该字段的哈希值基于集合中包含的所有元素。如果该字段是\
  \ `Vector`、`List`、`Set`、`Map` 或 `tuple`，你可以直接将其包含在进行哈希处理的项目列表中，因为这些类重写了 `equals`\
  \ 和 `hashCode`，以考虑包含的元素。然而，对于 `Arrays` 则并非如此，它们在计算哈希值时不会考虑元素。因此，对于数组，你应该将数组的每个元素视为对象的每个独立字段，显式地对每个元素调用\
  \ `hashCode`，或者将数组传递给单例对象 `java.util.Arrays` 中的某一个 `hashCode` 方法。\n\n最后，如果你发现某个特定的哈希值计算影响了程序的性能，可以考虑缓存哈希值。如果对象是不可变的，你可以在对象创建时计算哈希值并将其存储在字段中。你可以通过使用\
  \ `val` 代替 `def` 来重写 `hashCode`，如下：\n\n```\noverride val hashCode: Int = (numer,\
  \ denom).hashCode\n```\n\n这种方法是用内存换取计算时间，因为不可变类的每个实例都将多出一个字段来存储缓存的哈希值。\n\n### 30.5\
  \ 结论\n\n回溯来说，定义一个正确的 `equals` 实现出奇地微妙。你必须小心类型签名；你必须重写 `hashCode`；你应该避免对可变状态的依赖；如果你的类不是类的（final），则应该实现并使用\
  \ `canEqual` 方法。\n\n鉴于实现正确的等价方法如此困难，你可能倾向于将可比较对象的类定义为样例类（case classes）。这样，Scala\
  \ 编译器会自动添加具有正确属性的 `equals` 和 `hashCode` 方法。\n\n***\n\n#### 第 30 章脚注：\n\n[1] Vaziri,\
  \ *et. al.*, \"Declarative Object Identity Using Relation Types\" [[Vaz07]](#bibliography.html_vaziri-tip-2007)\n\
  \n[2] 除了第三个陷阱外，其余都在 Joshua Bloch 编写的 *Effective Java Second Edition* 一书中在 Java 背景下进行了描述。[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n[3] 如果你编写大量的 Java，你可能会期望该方法的参数类型是 `Object` 而不是 `Any`。不用担心；它是同一个 `equals` 方法。编译器只是让它看起来类型是\
  \ `Any`。\n\n[4] `Any` 的 `hashCode` 合约文本灵感来源于 `java.lang.Object` 类的 Javadoc 文档。\n\
  \n[5] 与 `hashCode` 一样，`Any` 的 `equals` 方法合约基于 `java.lang.Object` 的 `equals` 方法合约。\n\
  \n[6] 鉴于 `Point` 中 `equals` 实现，此版本的 `ColoredPoint` 不再违反对称性要求。\n\n[7] Bloch, *Effective\
  \ Java Second Edition*, p. 39 [[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n[8] Bloch, *Effective Java Second Edition*. [[Blo08]](#bibliography.html_bloch-effective-java)\n\
  \n# 第 31 章\n\n# 结合 Scala 和 Java\n\nScala 代码通常与大型 Java 程序和框架配合使用。由于 Scala 与 Java\
  \ 具有高度兼容性，大多数情况下你可以结合这两种语言，而无需过多担心。例如，标准框架如 `Swing`、`Servlets` 和 `JUnit` 经证明与 Scala\
  \ 正常工作。尽管如此，你偶尔会遇到一些结合 Java 和 Scala 的问题。\n\n本章描述了结合 Java 和 Scala 的两个方面。首先，它讨论了 Scala\
  \ 如何翻译为 Java，这在你从 Java 运行 Scala 代码时尤为重要。其次，它讨论了在 Scala 中使用 Java 注解，如果你想将 Scala 用于现有的\
  \ Java 框架，这是一个重要特性。\n\n### 31.1 从 Java 使用 Scala\n\n大多数情况下，你可以在源码层面考虑 Scala。然而，如果你了解它的翻译机制，你将对系统如何工作有更深入的理解。此外，如果你从\
  \ Java 运行 Scala 代码，你需要知道从 Java 的视角看 Scala 代码是什么样的。\n\n#### 通用规则\n\nScala 的实现是翻译为标准的\
  \ Java 字节码。Scala 特性尽可能地直接映射到等效的 Java 特性。例如，Scala 的类、方法、字符串和异常在 Java 字节码中的编译结果都与其对应的\
  \ Java 版本相同。\n\n为了实现这一点，Scala 在设计中需要偶尔做出艰难的选择。例如，如果能在运行时（使用运行时类型）解析重载方法，而不是在编译时解析，可能会很好。然而，这种设计会与\
  \ Java 的机制冲突，使得 Java 和 Scala 的融合变得棘棘。在这种情况下，Scala 保留了 Java 的重载解析机制，因此 Scala 方法和方法调用可以直接映射到\
  \ Java 方法和方法调用。\n\nScala 对其他特性有自己的设计。例如，特征（traits）在 Java 中没有等效物。同样，虽然 Scala 和 Java\
  \ 都有泛型类型，但两个系统的细节存在冲突。对于此类语言特性，Scala 代码无法直接映射到 Java 构造体，因此必须使用某些结构的组合进行编码。\n\n对于这些间接映射的特性，编码并不是固定的。目前正努力让翻译尽可能简单，以至于当你读到这里时，细节可能与编写时有所不同。你可以通过\
  \ `javap` 等工具检查 `.class` 文件来查看当前编译器使用的翻译。\n\n以上是通用规则。现在考虑一些特殊情况。\n\n#### 值类型\n\n\
  像 `Int` 这样的值类型可以有两种不同的方式翻译为 Java。只要可能，编译器会将 Scala `Int` 翻译为 Java `int` 以获得更好的性能。但有时这是可能的，因为编译器不确定它是\
  \ Int 还是其他数据类型。例如，特定的 `Array[Any]` 可能包含 `Int`，但编译器无法确定。\n\n在编译器不确定对象是否为值类型的情况下，编译器使用对象并依赖包装类。例如，`java.lang.Integer`\
  \ 等包装类允许将值类型封装在 Java 对象内部，从而让需要对象的代码进行操作。[1]](#combining-scala-and-java.html_footnotemain31-1)\n\
  \n#### 单例对象\n\nJava 没有单例对象的精确等效物，但它有静态方法。Scala 对单例对象的翻译使用了静态和实例方法的组合。每一个 Scala 单例对象，编译器都会创建一个末尾带有美元符号的\
  \ Java 类。对于名为 `App` 的单例对象，编译器生成一个名为 `App$` 的 Java 类。\n\n作为一个完整的示例，假设你编译了以下单例对象：\n\
  \n```\nobject App {\n  def main(args: Array[String]) = {\n    println(\"Hello, world!\"\
  )\n  }\n}\n```\n\nScala 将生成一个包含以下字段和方法的 Java `App$` 类：\n\n```\n$ javap App$\n  Compiled\
  \ from \"App.scala\"\n  public final class App$ {\n    public static final App$\
  \ MODULE$;\n    public static {};\n    public void main(java.lang.String[]);\n \
  \ }\n```\n\n\n\n这是针对通用情况的翻译。一个重要的特殊情况是如果你有一个“独立的”单例对象，即一个不带有同名类的对象。例如，你可能有一个名为 `App`\
  \ 的单例对象，但没有任何名为 `App` 的类。在这种情况下，编译器将创建一个名为 `App` 的 Java 类，该类为 Scala 单例对象的每个方法提供一个静态转发方法：\n\
  \n```\n $ javap App\n  Compiled from \"App.scala\"\n  public class App {\n    public\
  \ static void main(java.lang.String[]);\n    public App();\n  }\n```\n\n与之对比的是，如果你确实有一个名为\
  \ `App` 的类，Scala 将创建一个相应的 Java `App` 类，以存放你定义的 `App` 类的成员。在这种情况下，它将不会为同名的单例对象添加任何转发方法，Java\
  \ 代码必须通过 `MODULE$` 字段来访问该单例。\n\n### 作为接口的 Trait\n\n编译任何 `trait` 都会创建一个同名的 Java 接口。该接口可以作为\
  \ Java 类型使用，并允许你通过该类型的变量调用 Scala 对象上的方法。\n\n在 Java 中实现 `trait` 是另一一回事。在通用情况下，这并不切实际；但有一个特殊情况非常重要。如果你编写的\
  \ Scala `trait` 只包含抽象方法，那么该 `trait` 将直接翻译为 Java 接口，无需担心其他代码。本质上说，这意味着如果你愿意，可以使用\
  \ Scala 语法编写 Java 接口。\n\n### 31.2 注解\n\nScala 的通用注解系统在第 27 章 中讨论。本节讨论了注解的 Java 特有方面。\n\
  \n#### 标准注解的额外影响\n\n当目标为 Java 平台时，某些注解会导致编译器产生额外信息。当看到此类注解时，它首先根据通用的 Scala 规则对其进行处理，然后为\
  \ Java 执行额外的操作。\n\n**废弃（Deprecation）**：对于任何标记为 `@deprecated` 的方法或类，编译器会在生成的代码中添加\
  \ Java 自身的废弃注解。由于这一点，当 Java 代码访问被弃用的 Scala 方法时，Java 编译器可以发出弃用警告。\n\n**volatile 字段（volatile\
  \ fields）**：同样，Scala 中任何标记为 `@volatile` 的字段在生成的代码中都会赋予 Java 的 `volatile` 修饰符。因此，Scala\
  \ 中的 volatile 字段的行为完全符合 Java 的语义，且对 volatile 字段的访问根据 Java 内存模型为 volatile 字段指定的规则精确排序。\n\
  \n**序列化（Serialization）**\n\nScala 的两个标准序列化注解都翻译为 Java 等价物。`@serializable` 类会被添加\
  \ Java 的 `Serializable` 接口。`@SerialVersionUID(1234L)` 注解会被转换为以下 Java 字段定义：\n\n```\
  \ // Java serial version marker\n  private final static long SerialVersionUID =\
  \ 1234L\n```\n\n任何标记为 `@transient` 的变量都会赋予 Java 的 `transient` 修饰符。\n\n#### 抛出的异常\n\
  \nScala 并不检查抛出的异常是否被捕获。也就是说，Scala 方法没有等于 Java 方法的 `throws` 声明。所有的 Scala 方法都被翻译为不声明任何抛出异常的\
  \ Java 方法[[2]](#combining-scala-and-java.html_footnotemain31-2)。\n\nScala 省略这一功能的原因是\
  \ Java 对此的体验并非完全正向。因为使用 `throws` 子句对方法标记是一项沉重的负担，许多开发者会编写吞吞并丢弃异常的代码，只需让代码通过编译而无需添加所有那些\
  \ `throws` 子句。他们可能打算以后改进异常处理，但经验表明，时间紧迫的程序员往往永远不会回过头来添加适当的异常处理。这种扭曲的结果是，这个初衷良好的功能往往会导致代码变得更不可靠。大量的生产环境\
  \ Java 代码吞噬并隐藏了运行时异常，其原因是为了满足编译器的要求。\n\n然而，在与 Java 交互时，你可能需要编写带有 Java 友好注解的 Scala\
  \ 代码，以描述你的方法可能抛出哪些异常。例如，RMI 远程接口中的每个方法都要求在其 `throws` 子句中提到 `java.io.RemoteException`。因此，如果你想用带有抽象方法的\
  \ Scala `trait` 编写 RMI 远程接口，你需要在这些方法的 `throws` 子句中列出 `RemoteException`。为了实现这一点，你只需要用\
  \ `@throws` 注解标记你的方法即可。例如，列表 31.1 所示的 Scala 类有一个被标记为抛出 `IOException` 的方法。\n\n```\n\
  \ import java.io._\n  class Reader(fname: String) {\n    private val in =\n    \
  \  new BufferedReader(new FileReader(fname))\n\n    @throws(classOf[IOException])\n\
  \    def read() = in.read()\n  }\n```\n\n##### 列表 31.1 - 一个声明了 Java throws 子句的 Scala\
  \ 方法。\n\n在 Java 看来它是这样的：\n\n```\n $ javap Reader\n  Compiled from \"Reader.scala\"\
  \n  public class Reader {\n  public int read() throws java.io.IOException;\n  public\
  \ Reader(java.lang.String);\n  }\n```\n\n#### Java 注解\n\n现有的 Java 注解可以直接用于 Scala\
  \ 中。许多框架都使用注解。例如，考虑 JUnit 4。其想法是编写许多测试，并发现你的更改是否引入了 Bug，你会立即发现。\n\n编写测试很容易。你只需要在顶层类中写一个执行你代码的方法即可。它看起来像：\n\
  \n```\n import org.junit.Test\n import org.junit.Assert.assertEquals\n\nclass SetTest\
  \ {\n\n  @Test\n  def testMultiAdd = {\n    val set = Set() + 1 + 2 + 3 + 1 + 2\
  \ + 3\n    assertEquals(3, set.size)\n  }\n}\n```\n\n`testMultiAdd` 方法是一个测试。该测试向集合添加了多个项，并确保每个项只被添加一次。作为\
  \ JUnit API 一部分的 `assertEquals` 方法检查其两个参数是否相等。如果它们不同，则测试失败。\n\n该测试使用注解 `org.junit.Test`\
  \ 进行标记。注意该注解已导入，因此可以简单地写为 `@Test` 而不是更繁琐的 `@org.junit.Test`。就是这样了。可以使用任何 JUnit 测试运行器运行该测试。这里使用命令行测试运行器运行它：\n\
  \n```\n $ scala -cp junit-4.3.1.jar:. org.junit.runner.JUnitCore SetTest\n  JUnit\
  \ version 4.3.1\n  .\n  Time: 0.023\n\n  OK (1 test)\n```\n\n#### 编写你自己的注解\n\n要编写一个对\
  \ Java 反射可见的注解，你必须使用 Java 语法并用 `javac` 编译。对于这种用例，在 Scala 中编写注解似乎没有帮助，因此标准编译器不支持它。理由是，Scala\
  \ 的支持将不可避免地无法达到 Java 注解的全部可能性，而且，Scala 可能有一天拥有自己的反射，届时你会希望使用 Scala 反射访问 Scala 注解。\n\
  \n这里是一个示例注解：\n\n```java\n import java.lang.annotation.*; // 这是 Java\n  @Retention(RetentionPolicy.RUNTIME)\n\
  \  @Target(ElementType.METHOD)\n  public @interface Ignore { }\n```\n\n用 javac 编译上述内容后，你可以如下使用该注解：\n\
  \n\n\n\n```\nobject Tests {\n  @Ignore\n  def testData = List(0, 1, -1, 5, -5)\n\
  \n  def test1 = {\n    assert(testData == (testData.head :: testData.tail))\n  }\n\
  \n  def test2 = {\n    assert(testData.contains(testData.head))\n  }\n}\n```\n\n\
  在这个示例中，`test1` 和 `test2`  intended 应该是测试方法，但尽管 `testData` 的名字以 \"test\" 开头，它也应该被忽略。\n\
  \n要查看这些注解是否存在，你可以使用 Java 反射 API。这里是展示其如何工作的示例代码：\n\n```\nfor {\n  method <- Tests.getClass.getMethods\n\
  \  if method.getName.startsWith(\"test\")\n  if method.getAnnotation(classOf[Ignore])\
  \ == null\n} {\n  println(\"found a test method: \" + method)\n}\n```\n\n在这里，使用了反射方法\
  \ `getClass` 和 `getMethods` 来检查输入对象类的所有字段。这些是标准的反射方法。特定注解的部分是使用了方法 `getAnnotation`。许多反射对象都有一个\
  \ `getAnnotation` 方法用于搜索特定类型的注解。在这种情况下，代码在寻找我们新定义的类型 `Ignore` 的注解。由于这是一个 Java API，成功与取决于结果是\
  \ `null` 还是一个实际的注解对象。\n\n以下是代码的运行结果：\n\n```bash\n$ javac Ignore.java\n$ scalac Tests.scala\n\
  $ scalac FindTests.scala\n$ scala FindTests\nfound a test method: public void Tests$.test2()\n\
  found a test method: public void Tests$.test1()\n```\n\n顺便提一下，注意在使用 Java 反射查看时，方法是在\
  \ `Tests$` 类中而不是 `Tests` 类中。正如章节开头描述的，Scala 单例对象的实现被放置在一个在名称末尾添加了美元符号的 Java 类中。在这种情况下，`Tests`\
  \ 的实现在 Java 类 `Tests$` 中。\n\n请注意，当你使用 Java 注解时，必须在它们的局限性工作。例如，在注解的参数中你只能使用常量而不能使用表达式。你可以支持\
  \ `@serial(1234)`，但不支持 `@serial(x * 2)`，因为 `x * 2` 不是常量。\n\n### 31.3 通配符类型\n\n所有的\
  \ Java 类型都有对应的 Scala 类型。这是必要的，以便 Scala 代码可以访问任何合法的 Java 类。大多数时候，这种转换是直观的。Java 中的\
  \ `Pattern` 在 Scala 中是 `Pattern`，Java 中的 `Iterator<Component>` 在 Scala 中是 `Iterator[Component]`。但对于某些情况，你目前拥有的\
  \ Scala 类型还不够用。对于 Java 通配符类型（如 `Iterator<?>` 或 `Iterator<? extends Component>`）可以做什么呢？对于省略了类型参数的原始类型如\
  \ `Iterator` 可以做什么呢？对于 Java 通配符类型和原始类型，Scala 使用了一种名为通配符类型的额外类型。\n\n通配符类型使用占位符语法编写，类似于短函数字面量。在短函数字面量中，你可以使用下划线\
  \ `_` 代替表达式；例如 `(_ + 1)` 等同于 `(x + 1)`。通配符类型使用了相同的想法，只是针对类型而不是表达式。如果你编写 `Iterator[_]`，那么下划线替换了一个类型。这种类型表示一个元素类型未知的\
  \ `Iterator`。\n\n你还可以使用这种占位符语法插入上界和下界。只需在下划线后添加边界即可，使用与类型参数相同的 `<:` 语法。例如，`Iterator[_\
  \ <: Component]` 是一个元素类型未知的迭代器，但无论它是什么类型，都必须是 `Component` 的子类型。\n\n这就是你编写通配符类型的方法，但如何使用它呢？在简单的情况下，你可以忽略通配符并在基本类型上调用方法。例如，假设你有以下这个\
  \ Java 类：\n\n```java\n// 这是一个带有通配符的 Java 类\nimport java.util.*;\nclass Wild {\n\
  \  public Collection<?> contents() {\n    Collection<String> stuff = new Vector<String>();\n\
  \    stuff.add(\"a\");\n    stuff.add(\"b\");\n    stuff.add(\"see\");\n    return\
  \ stuff;\n  }\n}\n```\n\n如果你在 Scala 代码中访问它，你会发现它有一个通配符类型：\n\n```scala\nscala> val\
  \ contents = (new Wild).contents\ncontents: java.util.Collection[_] = List(a, b,\
  \ see)\n```\n\n如果你想知道这个集合中有多少元素，你可以简单地忽略通配符部分并像正常一样调用 `size` 方法：\n\n```scala\nscala>\
  \ contents.size()\nres: Int = 3\n```\n\n在更复杂的情况下，通配符类型可能会更别扭。由于通配符类型没有名称，因此没有办法在两个单独的地方使用它。例如，假设你想创建一个可变集合，并用\
  \ `contents` 中的元素初始化它：\n\n```scala\nimport scala.collection.mutable\nval iter =\
  \ (new Wild).contents.iterator\nval set = mutable.Set.empty[???] // 这里放什么类型？\nwhile\
  \ (iter.hasNext)\n  set += iter.next()\n```\n\n在第三行发生了问题。没有办法为 Java 集合中的元素命名，因此你无法为\
  \ `set` 写下一个令人满意的类型。为了解决这类问题，这里有两个你应该考虑的技巧：\n\n1. 当将通配符类型传递给方法时，为方法提供一个参数作为占位符。\n\
  2. 不要从方法返回通配符类型，而是返回一个具有抽象成员的对象。（请参见第 20 章关于抽象成员的内容。）\n\n结合这两个技巧，之前的代码可以写如下：\n\n\
  ```scala\nimport scala.collection.mutable\nimport java.Collection\n\nabstract class\
  \ SetAndType {\n  type Elem\n  val set: mutable.Set[Elem]\n}\n\ndef javaSet2ScalaT:\
  \ SetAndType = {\n  val sset = mutable.Set.empty[T] // 现在 T 可以命名了！\n\n  val iter\
  \ = jset.iterator\n  while (iter.hasNext)\n    sset += iter.next()\n\n  new SetAndType\
  \ {\n    type Elem = T\n    val set = sset\n  }\n}\n```\n\n你可以看到为什么 Scala 代码通常不使用通配符类型。为了对其进行复杂的处理，你往往将其转换为使用抽象成员。所以从一开始就可以使用抽象成员。\n\
  \n### 31.4 编译 Scala 和 Java\n\n通常当你编译依赖 Java 的 Scala 代码时，首先构建 Java 代码的类文件。然后构建 Scala\
  \ 代码，并将 代码的类文件放在类路径上。然而，如果 Java 代码引用了 Scala 代码，这种方法就不灵了。在这种情况下，无论你以什么顺序编译代码，总有一方会有未满足的外部引用。这种情况并不罕见；只需要在一个主要是\
  \ Java 的项目中替换一个 Java 源文件为 Scala 源文件。\n\n为了支持这种构建，Scala 允许针对 Java 源代码以及 Java 类文件进行编译。你只需要将\
  \ Java 源文件放在命令行上，就像它们是 Scala 文件一样。Scala 编译器不会编译这些 Java 文件，但它会扫描它们以查看它们包含什么。要使用此功能，你首先使用\
  \ Java 源代码编译 Scala 代码，然后使用 Scala 类文件编译 Java 代码。\n\n这里是一组典型的命令序列：\n\n```bash\n$ scalac\
  \ -d bin InventoryAnalysis.scala InventoryItem.java Inventory.java\n$ javac -cp\
  \ bin -d bin Inventory.java InventoryItem.java InventoryManagement.java\n$ scala\
  \ -cp bin InventoryManagement\nMost expensive item = sprocket($4.99)\n```\n\n###\
  \ 31.5 Java 8 集成\n\n\n\n\nJava 8 对 Java 语言和字节码进行了一些改进，Scala 从 2.12 版本开始利用了这些改进。通过利用\
  \ Java 8 的新特性，Scala 编译器可以生成更小尺寸的类文件和 jar 文件，并提高 trait 的二进制兼容性。\n\n### Lambda 表达式与\
  \ \"SAM\" 类型\n\n从 Scala 程序员的角度来看，Scala 2.12 中最可见的 Java 8 相关增强是：Scala 函数字面量（function\
  \ literals）可以像 Java 8 lambda 表达式一样使用，作为匿名类实例表达式的更简洁的形式。在 Java 8 之前，为了向方法传递行为，Java\
  \ 程序员通常会定义匿名内部类实例，如下所示：\n\n```\nJButton button = new JButton(); // 这是 Java 代码\n\
  \  button.addActionListener(\n  new ActionListener() {\n    public void actionPerformed(ActionEvent\
  \ event) {\n      System.out.println(\"pressed!\");\n    }\n  }\n  );\n```\n\n在这个示例中，创建了一个\
  \ `ActionListener` 的匿名实例并将其传递给 Swing `JButton` 的 `addActionListener` 方法。当用户点击按钮时，Swing\
  \ 将调用该实例上的 `actionPerformed` 方法，从而打印 \"pressed!\"。\n\n在 Java 8 中，在任何需要包含单个抽象方法（SAM）的类或接口实例的地方，都可以使用\
  \ lambda 表达式。`ActionListener` 就是这样一种接口，因为它包含一个抽象抽象方法 `actionPerformed`。因此，可以使用 lambda\
  \ 表达式在 Swing 按钮上注册动作监听器。这是一个示例：\n\n```\nJButton button = new JButton(); // 这是 Java\
  \ 8 代码\n  button.addActionListener(\n  event -> System.out.println(\"pressed!\"\
  )\n  );\n```\n\n在 Scala 中，在相同的情况下你也可以使用匿名内部类实例，但你可能更倾向于使用函数字面量，如下：\n\n```scala\n\
  val button = new JButton\n  button.addActionListener( \n    _ => println(\"pressed!\"\
  )\n  )\n```\n\n正如你已经在第 21.1 节中看到的，你可以通过定义从 `ActionEvent => Unit` 函数类型到 `ActionListener`\
  \ 的隐式转换来支持这种编码风格。\n\n即使在没有这种隐式转换的情况下，Scala 也允许在 ways 情况下使用函数字面量。与 Java 8 类似，Scala\
  \ 允许在需要声明单个抽象方法（SAM）的类或 trait 实例的地方使用函数类型。这在 Scala 2.12 及更高版本中适用于任何 SAM。例如，你可以定义一个带有单个抽象方法\
  \ `increase` 的 trait `Increaser`：\n\n```scala\nscala> trait Increaser {\n      \
  \    def increase(i: Int): Int\n        }\ndefined trait Increaser\n```\n\n然后你可以定义一个接受\
  \ `Increaser` 的方法：\n\n```scala\nscala> def increaseOne(increaser: Increaser): Int\
  \ =\n          increaser.increase(1)\n  increaseOne: (increaser: Increaser)Int\n\
  ```\n\n要调用你的新方法，可以传递一个 trait `Increaser` 的匿名实例，如下所示：\n\n```scala\nscala> increaseOne(\n\
  \          new Increaser {\n            def increase(i: Int): Int = i + 7\n    \
  \      }\n        )\n  res0: Int = 8\n```\n\n但在 Scala 2.12 中，你也可以选择直接使用函数字面量，因为\
  \ `Increaser` 是一个 SAM 类型：\n\n```scala\nscala> increaseOne(i => i + 7) // Scala 2.12\n\
  \  res1: Int = 8\n```\n\n### 在 Scala 中使用 Java 8 Streams\n\nJava 的 `Stream` 是一种函数数据结构，它提供了一个接受\
  \ `java.util.function.IntUnaryOperator` 的 `map` 方法。在 Scala 中你可以调用 `Stream.map` 来增加\
  \ `Array` 中每个元素的值如下：\n\n```scala\nscala> import java.util.function.IntUnaryOperator\n\
  \  import java.util.function.IntUnaryOperator\n\n  scala> import java.util.Arrays\n\
  \  import java.util.Arrays\n\n  scala> val stream = Arrays.stream(Array(1, 2, 3))\n\
  \  stream: java.util.stream.IntStream = ...\n\n  scala> stream.map(\n    new IntUnaryOperator\
  \ {\n      def applyAs(i: Int): Int = i + 1\n    }\n  ).toArray\n  res3: Array[Int]\
  \ = Array(2, 3, 4)\n```\n\n然而，由于 `IntUnaryOperator` 是一个 SAM 类型，在 Scala 2.12 及更高版本中，你也可以使用函数字面量更简洁地调用它：\n\
  \n```scala\nscala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream: java.util.stream.IntStream\
  \ = ...\n\n  scala> stream.map(i => i + 1).toArray // Scala 2.12\n  res4: Array[Int]\
  \ = Array(2, 3, 4)\n```\n\n注意，只有函数字面量会被适配为 SAM 类型，而不是具有函数类型的任意表达式。例如，考虑以下 `f`，它的类型为\
  \ `Int => Int`：\n\n```scala\nscala> val f = (i: Int) => i + 1\n  f: Int => Int =\
  \ ...\n```\n\n尽管 `f` 的类型与传递给 `stream.map` 的函数字面量类型相同，但你不能在需要 `IntUnaryOperator`\
  \ 的地方使用 `f`：\n\n```scala\nscala> val stream = Arrays.stream(Array(1, 2, 3))\n  stream:\
  \ java.util.stream.IntStream = ...\n\n  scala> stream.map(f).toArray\n  <console>:16:\
  \ error: type mismatch\n    found: Int => Int\n    required: java.util.function.IntUnaryOperator\n\
  ```\n\n\n\n相比之下，你可以对 Scala Future 指定转换，而无论它是否已经完成。每次转换都会产生一个新的 Future，代表了原始 Future\
  \ 经过函数转换后的异步结果。执行计算的线程由隐式提供的执行上下文（execution context）决定。这允许你将异步计算描述为对不可变值的一系列转换，而无需对共享内存和锁进行逻辑推理。\n\
  \n### 32.1 乐园中的麻烦\n\n在 Java 平台上，每个对象都关联一个逻辑 `monitor`（监视器），它可以用于控制对数据的多线程访问。要使用这种模型，你需要决定哪些数据将由多个线程共享，并将访问或控制访问共享数据的代码段标记为“synchronized”（同步）区域。Java\
  \ 运行时采用锁定机制来确保一次只有一个线程进入由同一把锁保护的同步区域，从而允许你编排对共享数据的多线程访问。\n\n出于兼容性考量，Scala 提供了对 Java\
  \ 并发原语的访问方法。在 Scala 中可以调用 `wait`、`notify` 和 `notifyAll` 方法，它们的含义与 Java 中相同。Scala\
  \ 在技术上没有 `synchronized` 关键字，但它包含一个预定义的 `synchronized` 方法，可以如下所示进行调用：\n\n```\nvar\
  \ counter = 0\nsynchronized {\n  // 每次只有一个线程在这里\n  counter = counter + 1\n}\n```\n\
  \n遗憾的是，程序员们发现，使用共享数据和锁模型很难可靠地构建健壮的多线程应用程序，特别是当应用程序规模和复杂性不断增加时。问题在于，在程序的任意一点，你都必须推理你正在修改或访问哪些数据（而这些数据可能被其他线程修改或访问），以及正持有哪些锁。在每个方法调用处，你都必须推理它将尝试持有哪些锁，并说服自己它尝试获取这些锁时不会发生死锁。更糟糕的是，你所推理的锁在编译时并不是固定的，因为程序在运行过程中可以自由地在运行时创建新锁。\n\
  \n糟糕的是，多线程代码的测试是不可靠的。由于线程是非确定性的，你可能成功地测试了程序一千次——但该程序在客户机器上第一次运行时仍可能出错。使用共享数据和锁时，你必须仅通过推理来确保程序的正确性。\n\
  \n此外，你无法通过过度同步（over-synchronizing）来解决问题。同步所有内容与什么都不同步一样具有问题性。虽然新的锁操作可能会消除竞态条件可能，但它们同时也增加了死锁的可能性。一个正确使用锁的程序既没有竞态条件，也没有死锁，因此你不能通过在任何一个方向上过度来确保稳妥。\n\
  \n`java.util.concurrent` 库为并发编程提供了更高层次的抽象。使用并发工具类使得多线程编程比使用 Java 的低级同步原语自己实现抽象要容易得多。尽管如此，这些并发工具类也基于共享数据和锁模型，因此它们并没有解决使用该模型时的根本性困难。\n\
  \n### 32.2 异步执行与 Trys\n\n虽然 Future 并不是万灵药，但 Scala 的 Future 提供了一种处理并发问题的方法，这种方法可以减少（通常是消除）对共享数据和锁的推理需求。当你调用一个\
  \ Scala 方法时，它会在“你等待时”执行计算并返回一个结果。如果该结果是一个 Future，那么这个 Future 代表了另一个要异步执行的计算，通常由另一个完全不同的线程执行。因此，许多对\
  \ Future 操作需要一个隐式的执行上下文，该上下文提供了异步执行函数的策略。例如，如果你尝试通过 `Future.apply` 工厂方法创建一个 Future\
  \ 但没有提供隐式执行上下文（即 `scala.concurrent.ExecutionContext` 实例），你将得到编译错误：\n\n```\nscala>\
  \ import scala.concurrent.Future\nimport scala.concurrent.Future\n\nscala> val fut\
  \ = Future { Thread.sleep(10000); 21 + 21 }\n<console>:11: error: Cannot find an\
  \ implicit ExecutionContext.\n    You might pass an (implicit ec: ExecutionContext)\n\
  \    parameter to your method or import\n    scala.concurrent.ExecutionContext.Implicits.global.\n\
  \      val fut = Future { Thread.sleep(10000); 21 + 21 }\n                ^\n```\n\
  \n错误信息给你了一种解决问题的方法：导入 Scala 自身提供的全局执行上下文。在 JVM 上，全局执行上下文使用线程池。一旦你将隐式执行上下文引入作用域，你就可以创建一个\
  \ future：\n\n```\nscala> import scala.concurrent.ExecutionContext.Implicits.global\n\
  import scala.concurrent.ExecutionContext.Implicits.global\n\nscala> val fut = Future\
  \ { Thread.sleep(10000); 21 + 21 }\nfut: scala.concurrent.Future[Int] = ...\n```\n\
  \n上一个示例中创建的 future 使用全局上下文执行代码块，然后带有值 42 完成。一旦它开始，该线程将睡眠十秒。Future 上的两个方法允许你轮询：`isCompleted`\
  \ 和 `value`。在尚未完成的 future 上调用它们时，`isCompleted` 将返回 false，`value` 将返回 None：\n\n```\n\
  scala> fut.isCompleted\nres0: Boolean = false\n\nscala> fut.value\nres1: Option[scala.util.Try[Int]]\
  \ = None\n```\n\n一旦 future 完成（在本例中，在十秒之后），`isCompleted` 将返回 true，`value` 将返回一个 Some：\n\
  \n```\nscala> fut.isCompleted\nres2: Boolean = true\n\nscala> fut.value\nres3: Option[scala.util.Try[Int]]\
  \ = Some(Success(42))\n```\n\n`value` 返回的选项包含一个 `Try`。如图 32.1 所示，`Try` 要么包含类型为 `T`\
  \ 的 `Success`，要么包含一个异常（`java.lang.Throwable` 实例）的 `Failure`。`Try` 的目的是为异步计算提供 `try`\
  \ 表达式为同步计算提供的功能：它允许你处理计算以异常完成而非返回结果的可能性。\n\n对于同步计算，你可以使用 `try/catch` 来确保调用方法的线程捕获并处理该方法抛出的异常。然而，对于异步计算，启动计算的线程通常会处理其他任务。随后如果该异步计算因异常失败，原始线程已无法在\
  \ catch 子句中处理该异常。因此，当处理代表异步活动的 Future 时，你使用 `Try` 来处理活动未能产生值而导致异常异常的可能性。这里有一个示例展示了异步活动失败时发生的情况：\n\
  \n```\nscala> val fut = Future { Thread.sleep(10000); 21 / 0 }\nfut: scala.concurrent.Future[Int]\
  \ = ...\n\nscala> fut.value\nres4: Option[scala.util.Try[Int]] = None\n```\n\n然后，十秒之后：\n\
  \n```\nscala> fut.value\nres5: Option[scala.util.Try[Int]] =\nSome(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n### 32.3 与 Future 协作\n\nScala 的 Future 允许你对 Future 结果指定转换，并获取一个新的\
  \ future，代表了两个异步计算的组合：原始计算和转换。\n\n\n\n\n\n## 使用 map 转换 Future\n\n最基础的此类操作是 `map`。与其阻塞后进行另一个计算，只需将下一次计算\
  \ `map`（映射）到 future（未来）上即可。结果将是一个新的 future，它代表原始异步计算的结果，且该结果已通过传递给 `map` 的函数进行了异步转换。\n\
  \n例如，以下 future 将在 10 秒后完成：\n\n```scala\nscala> val fut = Future { Thread.sleep(10000);\
  \ 21 + 21 }\n  fut: scala.concurrent.Future[Int] = ...\n```\n\n使用一个加 1 的函数对此 future\
  \ 进行映射将得到另一个 future。这个新 future 将代表一个包含原始加法以及后续加 1 的计算：\n\n```scala\nscala> val result\
  \ = fut.map(x => x + 1)\n  result: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ result.value\n  res5: Option[scala.util.Try[Int]] = None\n```\n\n一旦原始 future 完成并且函数已应用到其结果，由\
  \ `map` 返回的 future 就会完成：\n\n```scala\nscala> result.value\n  res6: Option[scala.util.Try[Int]]\
  \ = Some(Success(43))\n```\n\n注意，在此示例中执行的操作——future 的创建、`21 + 21` 的和计算以及 `42 + 1`\
  \ 的加增——可能由三个不同的线程执行。\n\n## 使用 for 表达式转换 Future\n\n由于 Scala 的 future 也声明了 `flatMap`\
  \ 方法，你可以使用 `for` 表达式来转换 future。例如，考虑以下两个 future，它们将在 10 秒后产生 42 和 46：\n\n```scala\n\
  scala> val fut1 = Future { Thread.sleep(10000); 21 + 21 }\n  fut1: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val fut2 = Future { Thread.sleep(10000); 23 + 23 }\n  fut2:\
  \ scala.concurrent.Future[Int] = ...\n```\n\n给定这两个 future，你可以像这样获取一个代表它们结果异步之和的新\
  \ future：\n\n```scala\nscala> for {\n          x <- fut1\n          y <- fut2\n\
  \    } yield x + y\n  res7: scala.concurrent.Future[Int] = ...\n```\n\n一旦原始 future\
  \ 完成且后续的加法完成，你就能看到结果：\n\n```scala\nscala> res7.value\n  res8: Option[scala.util.Try[Int]]\
  \ = Some(Success(88))\n```\n\n由于 `for` 表达式会序列化它们的转换，如果你没有在 `for` 表达式之前创建 future，它们将不会并行运行。例如，虽然之前的\
  \ `for` 表达式大约需要 10 秒完成，但接下来的 `for` 表达式至少需要 20 秒：\n\n```scala\nscala> for {\n   \
  \       x <- Future { Thread.sleep(10000); 21 + 21 }\n          y <- Future { Thread.sleep(10000);\
  \ 23 + 23 }\n    } yield x + y\n  res9: scala.concurrent.Future[Int] = ...\n\n \
  \ scala> res9.value\n  res27: Option[scala.util.Try[Int]] = None\n\n  scala> //\
  \ 将至少需要 20 秒才能完成\n\n  scala> res9.value\n  res28: Option[scala.util.Try[Int]] =\
  \ Some(Success(88))\n```\n\n## 创建 Future: Future.failed, Future.successful, Future.fromTry\
  \ 和 Promises\n\n除了早期示例中用于创建 future 的 `apply` 方法外，`Future` 伴随对象还包含了三个用于创建已完成 future\
  \ 的工厂方法：`successful`、`failed` 和 `fromTry`。这些工厂方法不需要 `ExecutionContext`。\n\n`successful`\
  \ 工厂方法创建一个已经成功的的 future：\n\n```scala\nscala> Future.successful { 21 + 21 }\n  res2:\
  \ scala.concurrent.Future[Int] = ...\n```\n\n`failed` 方法创建一个已经失败的 future：\n\n```scala\n\
  scala> Future.failed(new Exception(\"bummer!\"))\n  res3: scala.concurrent.Future[Nothing]\
  \ = ...\n```\n\n`fromTry` 方法从一个 `Try` 创建一个已完成的 future：\n\n```scala\nscala> import\
  \ scala.util.{Success,Failure}\n  import scala.util.{Success, Failure}\n\n  scala>\
  \ Future.fromTry(Success { 21 + 21 }) \n  res4: scala.concurrent.Future[Int] = ...\n\
  \n  scala> Future.fromTry(Failure(new Exception(\"bummer!\"))) \n  res5: scala.concurrent.Future[Nothing]\
  \ = ...\n```\n\n创建 future 最通用的方法是使用 `Promise`。给定一个 promise，你可以获取一个由该 promise 控制的\
  \ future。当你完成 promise 时，future 就会完成。这里有一个示例：\n\n```scala\nscala> val pro = Promise[Int]\n\
  \  pro: scala.concurrent.Promise[Int]\n\n  scala> val fut = pro.future\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> fut.value\n  res8: Option[scala.util.Try[Int]] = None\n```\n\
  \n你可以使用 `success`、`failure` 和 `complete` 来完成 promise。`Promise` 上的这些方法与为 future 的方法相似。例如，`success`\
  \ 方法将成功完成 future：\n\n```\n\npro.success(42)\n  res9: Option[scala.util.Try[Int]]\
  \ = Some(Success(42))\n```\n\n`failure` 方法会让 future 失败。`complete` 方法可以完成 future。\n\
  \n```\npro.failure(new Exception(\"bummer!\"))\n  res10: Option[scala.util.Try[Int]]\
  \ = Some(Failure(Exception(bummer!)))\n\npro.complete(42)\n  res11: Option[scala.util.Try[Int]]\
  \ = Some(Success(42))\n```\n\n## Filtering: filter 和 collect\n\nScala's future 提供了两个方法\
  \ `filter` 和 `collect`，允许你验证 future 的属性。`filter` 方法验证 future，如果它是有效的则保持不变：\n\n```scala\n\
  scala> val fut = Future(42)\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ val valid = fut.filter(_ > 0)\n  valid: scala.concurrent.Future[Int] = ...\n\n\
  \  scala> valid.value\n  res1: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n如果 future 无效，`filter` 返回的 future 将失败：\n\n```scala\nscala> val fut = Future(-42)\n\
  \  fut: scala.concurrent.Future[Int] = ...\n\n  scala> val invalid = fut.filter(_\
  \ > 0)\n  invalid: scala.concurrent.Future[Int] = ...\n\n  scala> invalid.value\n\
  \  res2: Option[scala.util.Try[Int]] = Some(Failure(Exception(-42)))\n```\n\n由于\
  \ Future 还提供了 `withFilter` 方法，你可以使用 `for` 表达式执行相同的操作：\n\n```scala\nscala> val fut\
  \ = Future(42)\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala> val valid\
  \ = for {\n          res <- fut\n          if res > 0\n    } yield res\n  valid:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> valid.value\n  res3: Option[scala.util.Try[Int]]\
  \ = Some(Success(42))\n\nscala> val fut = Future(-42)\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val invalid = for {\n          res <- fut\n          if res\
  \ > 0\n    } yield res\n  invalid: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ invalid.value\n  res4: Option[scala.util.Try[Int]] = Some(Failure(Exception(-42)))\n\
  ```\n\n`collect` 方法允许你在一次操作中验证 future 值并对其转换。如果传递给 `collect` 的部分函数在未来结果上有定义，则 `collect`\
  \ 返回的 future 将通过函数转换后的值成功：\n\n```scala\nscala> val fut = Future(42)\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val valid = fut.collect { case res if res > 0 => res + 46 }\n\
  \  valid: scala.concurrent.Future[Int] = ...\n\n  scala> valid.value\n  res5: Option[scala.util.Try[Int]]\
  \ = Some(Success(88))\n```\n\n否则，future 将以 `NoSuchElementException` 失败：\n\n```scala\n\
  scala> val fut = Future(-42)\n  fut: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ val invalid = fut.collect { case res if res > 0 => res + 46 }\n  invalid: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> invalid.value\n  res6: Option[scala.util.Try[Int]] = Some(Failure(NoSuchElementException(partial\
  \ function is not defined at: -42)))\n```\n\n## 处理失败: failed, fallbackTo, recover,\
  \ and recoverWith\n\nScala 的 future 提供了处理失败 future 的方法，包括 `failed`、`fallbackTo`、`recover`\
  \ 和 `recoverWith`。`failed` 方法将任何类型的失败 future 转换为一个成功的 `Future[Throwable]`，该未来持有导致失败的异常。这里有一个示例：\n\
  \n```scala\nscala> val fut = Future(new Exception(\"bummer!\"))\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val failed = fut.failed[Throwable]\n  failed: scala.concurrent.Future[Throwable]\
  \ = ...\n\n  scala> failed.value\n  res7: Option[scala.util.Try[Throwable]] = Some(Success(Exception(bummer!)))\n\
  ```\n\n\n\n\n\n```scala\nscala> val failure = Future { 42 / 0 }\n  failure: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> failure.value\n  res23: Option[scala.util.Try[Int]] =\n    Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n\n  scala> val expectedFailure = failure.failed\n  expectedFailure:\
  \ scala.concurrent.Future[Throwable] = ...\n\n  scala> expectedFailure.value\n \
  \ res25: Option[scala.util.Try[Throwable]] =\n    Some(Success(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n如果调用 `failed` 方法的 future 最终成功，则由 `failed` 返回的 future 本身将以\
  \ `NoSuchElementException` 失败。因此，`failed` 方法只有在你预期该 future 会失败时才是适用的。这里有一个示例：\n\n\
  ```scala\nscala> val success = Future { 42 / 1 }\n  success: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> success.value\n  res21: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  \n  scala> val unexpectedSuccess = success.failed\n  unexpectedSuccess: scala.concurrent.Future[Throwable]\
  \ = ...\n\n  scala> unexpectedSuccess.value\n  res26: Option[scala.util.Try[Throwable]]\
  \ =\n    Some(Failure(java.util.NoSuchElementException:\n  Future.failed not completed\
  \ with a throwable))\n```\n\n`fallbackTo` 方法允许你在调用 `fallbackTo` 的 future 失败时提供一个备选的\
  \ future 以使用。这里有一个失败的 future 回退到成功 future 的示例：\n\n```scala\nscala> val fallback\
  \ = failure.fallbackTo(success)\n  fallback: scala.concurrent.Future[Int] = ...\n\
  \n  scala> fallback.value\n  res27: Option[scala.util.Try[Int]] = Some(Success(42))\n\
  ```\n\n如果调用 `fallbackTo` 的原始 future 失败，则传递给 `fallbackTo` 的 future 的失败将本质上被忽略。`fallbackTo`\
  \ 返回的 future 将以初始异常失败。这里有一个示例：\n\n```scala\nscala> val failedFallback = failure.fallbackTo(\n\
  \          Future { val res = 42; require(res < 0); res }\n        )\n  failedFallback:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> failedFallback.value\n  res28:\
  \ Option[scala.util.Try[Int]] =\n    Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n`recover` 方法允许你将失败的 future 转换为成功的 future，允许成功 future 的结果保持原样地通过。例如，对于一个因\
  \ `ArithmeticException` 失败的 future，你可以使用 `recover` 方法将失败转换为成功，如下所示：\n\n```scala\n\
  scala> val recovered = failedFallback recover {\n          case ex: ArithmeticException\
  \ => -1\n        }\n  recovered: scala.concurrent.Future[Int] = ...\n\n  scala>\
  \ recovered.value\n  res32: Option[scala.util.Try[Int]] = Some(Success(-1))\n```\n\
  \n如果原始 future 没有失败，则 `recover` 返回的 future 将以相同的值完成：\n\n```scala\nscala> val unrecovered\
  \ = fallback recover {\n          case ex: ArithmeticException => -1\n        }\n\
  \  unrecovered: scala.concurrent.Future[Int] = ...\n\n  scala> unrecovered.value\n\
  \  res33: Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n同样，如果传递给 `recover`\
  \ 的部分函数没有在原始 future 最终失败的异常处定义，则原始失败将传递通过：\n\n```scala\nscala> val alsoUnrecovered\
  \ = failedFallback recover {\n          case ex: IllegalArgumentException => -2\n\
  \        }\n  alsoUnrecovered: scala.concurrent.Future[Int] = ...\n\n  scala> alsoUnrecovered.value\n\
  \  res34: Option[scala.util.Try[Int]] =\n    Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n`recoverWith` 方法与 `recover` 类似，不同之处在于它不像 `recover` 那样恢复到一个值，而是\
  \ `recoverWith` 允许你恢复到一个 future 值。这里有一个示例：\n\n```scala\nscala> val alsoRecover =\
  \ failedFallback recoverWith {\n          case ex: ArithmeticException => Future\
  \ { 2 + 46 }\n        }\n  alsoRecover: scala.concurrent.Future[Int] = ...\n\n \
  \ scala> alsoRecover.value\n  res35: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n与 `recover` 一样，如果原始 future 没有失败，或者传递给 `recoverWith` 的部分函数没有在原始 future 最终失败的异常处定义，原始的成功（或失败）将传递通过。\n\
  \n### Mapping 转换：transform\n\n`Future` 的 `transform` 方法接受两个用于转换 future 的函数：一个用于成功情况，另一个用于失败情况：\n\
  \n```scala\nscala> val first = success.transform(\n          res => res * -1,\n\
  \          ex => new Exception(\"see cause\", ex)\n        )\n  first: scala.concurrent.Future[Int]\
  \ = ...\n```\n\n如果 future 成功，则使用第一个函数：\n\n```scala\nscala> first.value\n  res42:\
  \ Option[scala.util.Try[Int]] = Some(Success(42))\n```\n\n如果 future 失败，则使用第二个函数：\n\
  \n```scala\nscala> val second = failure.transform(\n          res => res * -1,\n\
  \          ex => new Exception(\"see cause\", ex)\n        )\n  second: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> second.value\n  res43: Option[scala.util.Try[Int]] =\n    Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n注意，在之前所示的 `transform` 方法中，你无法将成功的 future 转换为失败的，无法将失败的 future\
  \ 转换为成功的。为了让这种转换更容易，Scala 2.12 引入了 `transform` 方法的形式，它可以接受从 `Try` 到 `Try` 的函数。这里是一些示例：\n\
  \n```scala\nscala> val firstCase = success.transform { // Scala 2.12\n         \
  \ case Success(res) => Success(res * -1)\n          case Failure(ex) => Failure(new\
  \ Exception(\"see cause\", ex))\n        }\n  firstCase: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> firstCase.value\n  res6: Option[scala.util.Try[Int]] = Some(Success(-42))\n\
  \nscala> val secondCase = failure.transform {\n          case Success(res) => Success(res\
  \ * -1)\n          case Failure(ex) => Failure(new Exception(\"see cause\", ex))\n\
  \        }\n  secondCase: scala.concurrent.Future[Int] = ...\n\n  scala> secondCase.value\n\
  \  res8: Option[scala.util.Try[Int]] =\n    Some(Failure(java.lang.ArithmeticException:\
  \ / by zero))\n```\n\n这是一个使用新的 `transform` 方法将失败转换为成功的示例：\n\n```scala\nscala> val\
  \ nonNegative = failure.transform { // Scala 2.12\n          case Success(res) =>\
  \ Success(res.abs + 1)\n          case Failure(_) => Success(0)\n        }\n  nonNegative:\
  \ scala.concurrent.Future[Int] = ...\n\n  scala> nonNegative.value\n  res11: Option[scala.util.Try[Int]]\
  \ = Some(Success(0))\n```\n\n### 合并 futures：zip, Future.foldLeft, Future.reduceLeft,\
  \ Future.sequence 和 Future.traverse\n\n`Future` 及其伴对象提供了允许组合多个 future 方法。`zip` 方法将两个成功的\
  \ future 转换为包含两个值的未来元组。这里有一个示例：\n\n```scala\nscala> val zippedSuccess = success\
  \ zip recovered\n  zippedSuccess: scala.concurrent.Future[(Int, Int)] = ...\n\n\
  \  scala> zippedSuccess.value\n  res46: Option[scala.util.Try[(Int, Int)]] =\n \
  \   Some(Success((42,-1)))\n```\n\n然而，如果任何一个 future 失败，`zip` 返回的 future 也以相同的异常失败：\n\
  \n```scala\nscala> val zippedFailure = success zip failure\n  zippedFailure: scala.concurrent.Future[(Int,\
  \ Int)] = ...\n\n  scala> zippedFailure.value\n  res48: Option[scala.util.Try[(Int,\
  \ Int)]] =\n    Some(Failure(java.lang.ArithmeticException: / by zero))\n```\n\n\
  如果两个 future 都失败，结果失败 future 将包含初始 future（即调用 `zip` 的 future）中存储的异常。\n\n\n\n\n`Future`\
  \ 的伴随对象提供了一个 `foldLeft` 方法，允许你跨越一个 `Iterable` future 集合来累积结果，并产生一个 future 结果。如果集合中的所有\
  \ future 都成功了，则生成的 future 将带有累积的结果成功。如果集合中的任何 future 失败了，则生成的 future 将失败。如果有多个 future\
  \ 失败，结果将以第一个失败的 future（在 `Iterable` 集合中最早的）所抛出的的相同异常而失败。这里有一个示例：\n\n```scala\nscala>\
  \ val fortyTwo = Future { 21 + 21 }\n  fortyTwo: scala.concurrent.Future[Int] =\
  \ ...\n\n  scala> val fortySix = Future { 23 + 23 }\n  fortySix: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val futureNums = List(fortyTwo, fortySix)\n  futureNums: List[scala.concurrent.Future[Int]]\
  \ = ...\n\n  scala> val folded =\n          Future.foldLeft(futureNums)(0) { (acc,\
  \ num) =>\n            acc + num\n          }\n  folded: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> folded.value\n  res53: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n`Future.reduceLeft` 方法执行一个不带零值的折叠（fold），使用初始 future 结果作为起始值。这里有一个示例：\n\n\
  ```scala\nscala> val reduced =\n          Future.reduceLeft(futureNums) { (acc,\
  \ num) =>\n            acc + num\n          }\n  reduced: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> reduced.value\n  res54: Option[scala.util.Try[Int]] = Some(Success(88))\n\
  ```\n\n如果你向 `reduce` 传递一个空集合，生成的 future 将会以 `NoSuchElementException` 失败。\n\n`Future.sequence`\
  \ 方法将一个 future 的 `TraversableOnce` 集合转换为一个包含值的 future `TraversableOnce`。例如，在下面的示例中，`sequence`\
  \ 被用于将 `List[Future[Int]]` 转换为 `Future[List[Int]]`：\n\n```scala\nscala> val futureList\
  \ = Future.sequence(futureNums)\n  futureList: scala.concurrent.Future[List[Int]]\
  \ = ...\n\n  scala> futureList.value\n  res55: Option[scala.util.Try[List[Int]]]\
  \ =\n  Some(Success(List(42, 46)))\n```\n\n`Future.traverse` 方法将一个任何元素类型的 `TraversableOnce`\
  \ 转换为 future 的 `TraversableOnce`，并将其“序列化”为一个包含值的 future `TraversableOnce`。例如，这里\
  \ `List[Int]` 通过 `Future.traverse` 转换为 `Future[List[Int]]`：\n\n```scala\nscala>\
  \ val traversed =\n          Future.traverse(List(1, 2, 3)) { i => Future(i) }\n\
  \  traversed: scala.concurrent.Future[List[Int]] = ...\n\n  scala> traversed.value\n\
  \  res58: Option[scala.util.Try[List[Int]]] = \n  Some(Success(List(1, 2, 3)))\n\
  ```\n\n### 执行副作用：foreach, onComplete 和 andThen\n\n有时，你可能需要在 future 完成后执行副作用。`Future`\
  \ 为此目的提供了几个方法。最基本的方法是 `foreach`，如果 future 成功完成，它将执行副作用。例如，在下面的示例中，如果 future 失败，则不会执行\
  \ `println`，只有成功的 future 才会执行：\n\n```scala\nscala> failure.foreach(ex => println(ex))\n\
  \n  scala> success.foreach(res => println(res))\n  42\n```\n\n由于不带 `yield` 的 `for`\
  \ 会被重写为 `foreach` 的调用，你也可以使用 `for` 表达式来实现相同的效果：\n\n```scala\nscala> for (res <-\
  \ failure) println(res)\n\n  scala> for (res <- success) println(res)\n  42\n```\n\
  \n`Future` 还提供了两个方法来注册“回调”函数。`onComplete` 方法无论 future 最终成功还是失败都会被执行。该函数将接收一个 `Try`——如果\
  \ future 成功，则是一个持有结果的 `Success`；否则是一个持有导致 future 失败的异常的 `Failure`。这里有一个示例：\n\n```scala\n\
  scala> import scala.util.{Success, Failure}\n  import scala.util.{Success, Failure}\n\
  \n  scala> success onComplete {\n          case Success(res) => println(res)\n \
  \         case Failure(ex) => println(ex)\n        }\n  42\n\n  scala> failure onComplete\
  \ {\n          case Success(res) => println(res)\n          case Failure(ex) =>\
  \ println(ex)\n        }\n  java.lang.ArithmeticException: by zero\n```\n\n`Future`\
  \ 不保证通过 `onComplete` 注册的回调函数的执行顺序。如果你想强制执行回调函数的顺序，则必须使用 `andThen`。`andThen` 方法返回一个新的\
  \ future，该 future 与你调用的 `andThen` 的原始 future 镜像（以相同的方式成功或失败），但在回调函数执行之前，它不会完成：\n\
  \n```scala\nscala> val newFuture = success andThen {\n          case Success(res)\
  \ => println(res)\n          case Failure(ex) => println(ex)\n        }\n  2\n \
  \ newFuture: scala.concurrent.Future[Int] = ...\n\n  scala> newFuture.value\n  res76:\
  \ Option[scala.util.Try[Int]] = Some(Success(88))\n```\n\n注意，如果传递给 `andThen` 的回调函数抛出异常，该异常将传递给后续的\
  \ future。\n\n### 32.4 使用 Future 进行测试\n\nScala future 的优势在于它们有助于你避免阻塞。在大多数 JVM 实现中，创建几千个线程后，线程间上下文切换的成本会将性能降低到无法接受的程度。通过避免阻塞，你可以保持用于工作的有限线程处于忙碌状态。尽管如此，当你需要时\
  \ Scala 确实允许你阻塞 future 结果。Scala 的 `Await` 对象方便了等待 future 结果的阻塞。这里有一个示例：\n\n\n\n\n\
  \n```scala\nscala> import scala.concurrent.Await\n  import scala.concurrent.Await\n\
  \n  scala> import scala.concurrent.duration._\n  import scala.concurrent.duration._\n\
  \n  scala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> val x = Await.result(fut, 15.seconds) // blocks\n  x: Int =\
  \ 42\n```\n\n`Await.result` 接收一个 `Future` 和一个 `Duration`。该 `Duration` 表示 `Await.result`\
  \ 在超时之前应该等待 `Future` 完成多长时间。在例示例中，`Duration` 被指定为十五秒。因此，`Await.result` 方法在 `future`\
  \ 完成并 get 最终值 42 之前不会发生超时。\n\n阻塞通常被广泛接受的场景之一是异步代码的测试。现在 `Await.result` 已经返回，你可以使用该结果进行计算，例如测试中的断言：\n\
  \n```scala\nscala> import org.scalatest.matchers.should.Matchers._\n  import org.scalatest.matchers.should.Matchers._\n\
  \n  scala> x should be (42)\n  res0: org.scalatest.Assertion = Succeeded\n```\n\n\
  或者，你也可以使用 `ScalaTest` 的 trait `ScalaFutures` 提供的阻塞结构。例如，由 `ScalaFutures` 隐式添加到 `Future`\
  \ 中的 `futureValue` 方法将一直阻塞直到 future 完成。如果 future 失败，`futureValue` 将抛出一个描述该问题的 `TestFailedException`。如果\
  \ future 成功，`futureValue` 将返回 future 的成功结果，这样你就可以对该值执行断言：\n\n```scala\nscala> import\
  \ org.scalatest.concurrent.ScalaFutures._\n  import org.scalatest.concurrent.ScalaFutures._\n\
  \n  scala> val fut = Future { Thread.sleep(10000); 21 + 21 }\n  fut: scala.concurrent.Future[Int]\
  \ = ...\n\n  scala> fut.futureValue should be (42) // futureValue blocks\n  res1:\
  \ org.scalatest.Assertion = Succeeded\n```\n\n虽然在测试中使用阻塞通常没问题，但 `ScalaTest` 3.0\
  \ 增加了“异步”测试样式，允许你在不阻塞的情况下测试 futures。给定一个 future，与其阻塞并对结果执行断言，不如你可以将断言直接映射到该 future\
  \ 上，并将生成的 `Future[Assertion]` 返回给 `ScalaTest`。示例在代码列表 32.1 中所示。当 future 断言完成后，`ScalaTest`\
  \ 将异步地触发事件（测试成功、测试失败等）并发送测试报告器。\n\n```scala\nimport org.scalatest.funspec.AsyncFunSpec\n\
  \  import scala.concurrent.Future\n\n  class AddSpec extends AsyncFunSpec {\n\n\
  \    def addSoon(addends: Int*): Future[Int] =\n          Future { addends.sum }\n\
  \n    describe(\"addSoon\") {\n      it(\"will eventually compute a sum of passed\
  \ Ints\") {\n        val futureSum: Future[Int] = addSoon(1, 2)\n        // 你可以将断言映射到\
  \ Future 上，然后\n        // 将生成的 Future[Assertion] 返回给 ScalaTest:\n        futureSum\
  \ map { sum => assert(sum == 3) }\n      }\n    }\n  }\n```\n\n##### 代码列表 32.1 -\
  \ 将 future 断言返回给 ScalaTest。\n\n异步测试用例说明了处理 futures 的通用原则：一旦进入“未来空间”，就尽量留在未来空间内。不要在\
  \ future 上阻塞，然后使用结果继续计算。通过执行一系列变换来保持异步状态，每个变换都返回一个新的用于转换的 future。若要从未来空间获取结果，请注册在\
  \ futures 完成后异步执行的副作用。这种方法将帮助你最大限度地利用你的线程。\n\n### 32.5 结论\n\n并发编程赋予了你巨大的力量。它让你能够简化代码并从中获益。\n\
  \n\n\n\n\n| `term` | ::= | `factor` {\"*\" `factor` | \"/\" `factor`}. |\n| `factor`\
  \ | ::= | `floatingPointNumber` | \"(\" expr \")\" | |\n\n在这里，`|` 表示备选产生式，而 `{ ...\
  \ }` 表示重复（出现 0 次或多次）。虽然在这个示例中没有用到它，但 `[ ... ]` 表示可选的出现次数。\n\n这个上下文无关文法正式地定义了一种算术表达式的语言。每个表达式（由\
  \ `expr` 表示）都是一个 `term`，其后面可以紧跟一系列 `+` 或 `-` 运算符以及更多的 `term`。一个 `term` 是一个 `factor`，后面可能紧跟一系列\
  \ `*` 或 `/` 运算符以及更多的 `factor`。一个 `factor` 要么是一个数字字面量，要么是括号中的表达式。注意，文法已经编码了运算符的相对优先级。例如，`*`\
  \ 的绑定优先级比 `+` 更紧，因为 `*` 操作产生一个 `term`，而 `+` 操作产生一个 `expr`，`expr` 可以包含 `term`，但 `term`\
  \ 只有在后者被括号包裹时才能包含 `expr`。\n\n现在你已经定义了文法，下一步是什么？如果你使用 Scala 的组合解析器（combinator parsers），你基本上就完成了！你只需要执行一些系统的文本替换，并将解析器封装在一个类中，如列表\
  \ 33.1 所示：\n\n```scala\n import scala.util.parsing.combinator._\n\nclass Arith extends\
  \ JavaTokenParsers {   \n  def expr: Parser[Any] = term~rep(\"+\"~term | \"-\"~term)\n\
  \  def term: Parser[Any] = factor~rep(\"*\"~factor | \"/\"~factor)\n  def factor:\
  \ Parser[Any] = floatingPointNumber | \"(\"~expr~\")\"\n}\n```\n\n##### 列表 33.1\
  \ - 一个算术表达式解析器。\n\n算术表达式的解析器包含在一个继承自 `JavaTokenParsers` 特性的类中。该特性提供了编写解析器的基本机制，还提供了一些识别某些词类的原始解析器：标识符、字符串字面量和数字。在列表\
  \ 33.1 的示例中，你只需要原始的 `floatingPointNumber` 解析器，它是继承自该特性的。\n\n`Arith` 类中的三个定义代表了算术表达式的产生式。如你所见，它们紧遵循上下文无关文法的产生式。事实上，你可以通过执行许多简单的文本替换从上下文无关文法自动生成这部分内容：\n\
  \n1. 每个产生式都变成一个方法，因此你需要在它前面加上 `def` 前缀。\n2. 每个方法的结果类型都是 `Parser[Any]`，因此你需要将 `::=`\
  \ 符号更改为 `: Parser[Any] =`。你将在本章的晚些时候发现 `Parser[Any]` 类型代表什么，以及如何让它更精确。\n3. 在语法（注：此处应为文法）中，顺序组合是隐式的，但在程序中它通过一个显式运算符表示：`~`。因此，你需要在产生式的每两个连续符号之间插入\
  \ `~`。在列表 33.1 的示例中，我们选择不在 `~` 运算符周围写任何空格。这样，解析器代码就保持了与文法的视觉外观——它只是将空格替换为 `~` 字符。\n\
  4. 重复使用 `rep( ... )` 代替 `{ ... }`。类似地（尽管示例中未显示），可选使用 `opt( ... )` 代替 `[ ... ]`。\n\
  5. 每个产生式末尾的句号（`.`）被省略了——不过如果你愿意，也可以写分号（`;`）。\n\n就是这些了。生成的类 `Arith` 定义了三个解析器 `expr`、`term`\
  \ 和 `factor`，它们可以用于解析算术表达式及其部分。\n\n### 33.2 运行你的解析器\n\n你可以使用以下小程序测试你的解析器：\n\n```scala\n\
  \ object ParseExpr extends Arith {\n  def main(args: Array[String]) = {\n    println(\"\
  input : \" + args(0))\n    println(parseAll(expr, args(0)))\n  }\n}\n```\n\n`ParseExpr`\
  \ 对象定义了一个 `main` 方法，用于解析传递给它的第一个命令行参数。它打印原始输入参数，然后打印解析后的版本。解析是通过表达式完成的：\n\n```\n\
  parseAll(expr, input)\n```\n\n该表达式将解析器 `expr` 应用于给定输入。它期望所有输入都匹配，即解析后的表达式后面没有多余的字符。还有一个\
  \ `parse` 方法，允许你解析输入前缀，留下一些剩余部分未读取。\n\n你可以使用以下命令运行算术解析器：\n\n```bash\n $ scala ParseExpr\
  \ \"2 * (3 + 7)\"\n  input: 2 * (3 + 7)\n```\n\n### 33.3 基础表达式解析器\n\n算术表达式解析器是由另一个解析器\
  \ `floatingPointNumber` 组成的。这个解析器继承自 `Arith` 的父特性 `JavaTokenParsers`，用于识别 Java 格式的浮点数。如果你需要解析与\
  \ Java 格式不同的数字该怎么办？\n\n思路是你可以使用任何正则表达式作为解析器。例如，列表 33.2 所示的正则表达式描述了 Java 的标识符：\n\n\
  ```scala\n object MyParsers extends RegexParsers {\n  val ident: Parser[String]\
  \ = \"\"\"[a-zA-Z_]\\w*\"\"\".r\n}\n```\n\n##### 列表 33.2 - 标识符的正则表达式解析器。\n\n列表 33.2\
  \ 中的 `MyParsers` 对象继承自 `RegexParsers`，而 `Arith` 继承自 `JavaTokenParsers`。Scala 的解析组合器组织在特性层次中，它们都包含在\
  \ `scala.util.parsing.combinator` 包中。顶级特性是 `Parsers`，它为各种输入提供了通用的解析框架。底层是 `RegexParsers`，要求输入是字符序列并提供正则表达式解析。更专门的是\
  \ `JavaTokenParsers`，它实现了 Java 定义的基础词类（或标记）的解析器。\n\n### 33.4 另一个示例：JSON\n\nJSON（JavaScript\
  \ 对象表示）是一种流行的数据交换格式。在本节中，我们将展示如何为它编写解析器。这里有一个描述 JSON 语法的文法：\n\n| `value` | ::= |\
  \ `obj` | `arr` | `stringLiteral` | |\n|  |  | `floatingPointNumber` | | |\n|  |\
  \  | \"null\" | \"true\" | \"false\". |\n| `obj` | ::= | \"{\" `[members]` \"}\"\
  . | | |\n| `arr` | ::= | \"[\" `[values]` \"]\". | | |\n| `members` | ::= | `member`\
  \ `{,` `member`}. | | |\n| `member` | ::= | `stringLiteral` `:` `value`. | | |\n\
  | `values` | ::= | `value` `{,` `value`}. | | |\n\n\n\n\n\nJSON 值是一个对象、数组、字符串、数字，或者三个保留字之一：`null`、`true`\
  \ 或 `false`。JSON 对象是一个（可能可能为空的）成员序列，由逗号分隔并包含在大花括号中。每个成员都是一个字符串/值对，其中字符串和值之间用冒号分隔。最后，JSON\
  \ 数组是一个由逗号分隔的值序列，并包含在方括号中。例如，列表 33.3 包含一个格式为 JSON 对象的地址簿。\n\n```json\n {\n  \"address\
  \ book\": {\n      \"name\": \"John Smith\",\n      \"address\": {\n        \"street\"\
  : \"10 Market Street\",\n        \"city\"  : \"San Francisco, CA\",\n        \"\
  zip\"   : 94111\n      },\n      \"phone numbers\": [\n        \"408 338-4238\"\
  ,\n        \"408 111-6892\"\n      ]\n  }\n}\n```\n\n##### 列表 33.3 - JSON 格式的数据。\n\
  \n使用 Scala 的解析器组合器（parser combinators）解析此类数据是非常直接的。完整的解析器如列表 33.4 所示。该解析器遵循与算术表达式解析器相同的结构。它再次是\
  \ JSON 语法产生式的直接映射。这些产生式使用了一个简化语法的快捷径方式：`repsep` 组合器解析一个由给定的分隔符字符串分隔的（可能为空的）项序列。例如，在列表\
  \ 33.4 的示例中，`repsep(member, \",\")` 解析一个由逗号分隔的成员项序列。否则，解析器中的产生式与语法中的产生式完全对应，就像算术表达式解析器的情况一样。\n\
  \n```scala\n import scala.util.parsing.combinator._\n\n  class JSON extends JavaTokenParsers\
  \ {   \n\n    def value : Parser[Any] = obj | arr | \n                         \
  \     stringLiteral | \n                              floatingPointNumber | \n \
  \                             \"null\" | \"true\" | \"false\"\n\n    def obj   :\
  \ Parser[Any] = \"{\"~repsep(member, \",\")~\"}\"\n\n    def arr   : Parser[Any]\
  \ = \"[\"~repsep(value, \",\")~\"]\"\n\n    def member: Parser[Any] = stringLiteral~\"\
  :\"~value\n}\n```\n\n##### 列表 33.4 - 一个简单的 JSON 解析器。\n\n为了尝试这些 JSON 解析器，我们将稍微修改框架，使解析器在文件上运行而不是在命令行运行：\n\
  \n```scala\n import java.io.FileReader\n\n  object ParseJSON extends JSON {\n  def\
  \ main(args: Array[String]) = {\n    val reader = new FileReader(args(0))\n    println(parseAll(value,\
  \ reader))\n  }\n  }\n```\n\n该程序中的 `main` 方法首先创建一个 `FileReader` 对象。然后根据 JSON 语法的\
  \ `value` 产生式解析该读取器返回的字符。注意，`parseAll` 和 `parse` 存在重载变：它们都可以接收字符序列或输入读取器（input reader）。\n\
  \n如果你将列表 33.3 中的“地址簿”对象存储到名为 `address.json` 的文件中并在其上运行 `ParseJSON`，你应该得到：\n\n```\n\
  $ ParseJSON address.json\n[3.4] parsed: ((List(\"address book\"~((List(\"name\"\
  ~\"John Smith\"),(\"address\"~((List(\"street\"~\"10 Market Street\"),(\"city\"\
  ~\"San Francisco, CA\"),(\"zip\"~94111))))(\"phone numbers\"~(List(\"408 338-4238\"\
  ,\"408 111-6892\"))))))))\n```\n\n### 33.5 解析器输出\n\n`ParseJSON` 程序成功解析了地址簿。然而，解析器的输出看起来很奇怪。它似乎是一系列用\
  \ `~` 粘在一起的碎片。这种输出没有用。对于人类来说，它比输入更不可读，但对于计算机来说又太杂乱，难以于分析。是时候对此做些处理了。\n\n要决定做什么，你首先需要知道每个解析器返回什么结果（假设它们成功了）。以下是规则：\n\
  \n1. 每个写为字符串的解析器（例如 `\"{\"` 或 `\"null\"`）返回解析后的字符串。\n2. 正则表达式解析器如 `\"\"\"[a-zA-Z]\\\
  w*\"\"\".r` 也返回解析后的字符串。继承自 `JavaTokenParsers` 的 `stringLiteral` 或 `floatingPointNumber`\
  \ 正则表达式解析器也是如此。\n3. 顺序组合 `P~Q` 返回 `P` 和 `Q` 的结果。这些结果在一个也写为 `~` 的类实例中返回。因此，如果 `P`\
  \ 返回 `\"true\"` 且 `Q` 返回 `\"?\"`，那么顺序组合 `P~Q` 返回 `\"true~?\")`。\n4. 选择性组合 `P|Q`\
  \ 返回 `P` 或 `Q` 的结果，以哪个成功为准。\n5. 重复 `rep(P)` 或 `repsep(P, separator)` 返回 `P` 的结果列表。\n\
  6. `opt(P)` 返回 Scala `Option` 类型的实例。如果 `P` 成功并获得结果 `R`，则返回 `Some(R)`；如果 `P` 失败，则返回\
  \ `None`。\n\n通过这些规则，现在可以推断出为什么解析器输出是那样。然而，这种输出仍然不方便。更自然的方法是将 JSON 对象映射为如下 Scala\
  \ 表示：\n\n- JSON 对象表示为类型 `Map[String, Any]`。每个成员表示为映射中的键值对。\n- JSON 数组表示为类型 `List[Any]`。\n\
  - JSON 字符串表示为 Scala `String`。\n- JSON 数字字面量表示为 Scala `Double`。\n- `true`、`false`\
  \ 和 `null` 值表示为相应的 Scala 值。\n\n为了产生这种表示，你需要使用解析器的另一种形式：`^^`。\n\n`^^` 运算符转换解析器的结果。使用该运算符的表达式形式为\
  \ `P^^`，其中 `P` 是一个解析器，`f` 是一个函数。`P^^` 解析与 `P` 相同的句子。每当 `P` 返回结果 `R` 时，`P^^` 的结果就是\
  \ `f(R)`。\n\n作为一个示例，这里有一个解析浮点数并将其转换为 `Double` 值的解析器：\n\n```scala\nfloatingPointNumber^(toDouble)\n\
  ```\n\n这里有一个解析字符串 `\"true\"` 并返回 Scala 布尔值 `true` 的解析器：\n\n```scala\n\"true\"^(x\
  \ => true)\n```\n\n现在是更高级的转换。这里有一个返回 Scala `Map` 的 JSON 对象解析器的新版本：\n\n```scala\n\
  def obj: Parser[Map[String, Any]] = // 可以改进\n  \"{\"~repsep(member, \",\")~\"}\"\
  \ ^^ \n  { case \"{\"~ms~\"}\" => Map() ++ ms }\n```\n\n记住 `~` 运算符产生的结果是一个同名类类的实例：`~`。这里是该类的定义——它是\
  \ `trait Parsers` 的一个内部类：\n\n```scala\ncase class ~A, +B {\n  override def toString\
  \ = \"(\" + x + \"~\" + y + \")\"\n}\n```\n\n该类的名称特意设计为与顺序组合器方法名 `~` 相同。这样，你就可以用与解析器结构相同的模式来匹配解析结果。例如，模式\
  \ `\"{\"~ms~\"}\"` 匹配结果字符串 `\"{\"`，后跟着一个结果变量 `ms`，随后又跟着一个结果字符串 `\"}\"`。这个模式与 `^^`\
  \ 左侧解析器返回的内容完全对应。在其 `~` 运算符先前的反反编译版本中，相同的模式读取为 `~(~(\"{\", ms), \"\")`，但这可读性低得多。\n\
  \n\n\n\n\n`{\"~ms~\"}` 模式的目的是去掉括号，以便你可以获取由 `repsep(member, \",\")` 解析器生成的成员列表。在这些情况下，还有另一种替代方案，可以避免产生会被模式匹配立即丢弃的不必要的解析器结果。这种替代方案利用了\
  \ `~>` 和 `<~` 解析器组合器。两者都表达了与 `~` 相同的顺序组合，但 `~>` 只保留其右操作数的结果，而 `<~` 只保留其左侧操作数的结果。使用这些组合器，JSON\
  \ 对象解析器可以写得更简洁：\n\n```scala\n def obj: Parser[Map[String, Any]] =\n  \"{\"~> repsep(member,\
  \ \",\") <~\"}\" ^^ (Map() ++ _)\n```\n\nListing 33.5 显示了一个返回有意义结果的完整 JSON 解析器。如果你在\
  \ `address-book.json` 文件上运行此解析器，你将得到以下结果（在添加了一些换行符和缩进后）：\n\n```scala\n $ scala JSON1Test\
  \ address-book.json\n  [14.1] parsed: Map(\n  address book -> Map(\n    name ->\
  \ John Smith, \n    address -> Map(\n      street -> 10 Market Street, \n      city\
  \ -> San Francisco, CA, \n      zip -> 94111), \n    phone numbers -> List(408 338-4238,\
  \ 408 111-6892)\n    )\n  )\n```\n\n这就是你开始编写自己的解析器时需要了解全部知识。为了方便记忆，Table 33.1 列出了迄为止讨论过的解析器组合器。\n\
  \n```scala\nimport scala.util.parsing.combinator._\n\n  class JSON1 extends JavaTokenParsers\
  \ {   \n\n    def obj: Parser[Map[String, Any]] = \n      \"{\"~> repsep(member,\
  \ \",\") <~\"}\" ^^ (Map() ++ _)\n\n    def arr: Parser[List[Any]] =\n      \"[\"\
  ~> repsep(value, \",\") <~\"]\" \n\n    def member: Parser[(String, Any)] = \n \
  \     stringLiteral~\":\"~value ^^ \n        { case name~\":\"~value => (name, value)\
  \ }\n\n    def value: Parser[Any] = (\n      obj\n      | arr \n      | stringLiteral\n\
  \      | floatingPointNumber ^^ (_.toDouble) \n      | \"null\"  ^^ (x => null)\
  \ \n      | \"true\"  ^^ (x => true) \n      | \"false\" ^^ (x => false)\n    )\n\
  \  }\n```\n\n#####  33.5 - 返回有意义结果的完整 JSON 解析器。\n\n##### 表 33.1 - 解析器组合器总结\n\n|\
  \ \"...\" | 字量 |\n| :--- | :--- |\n| \"...\".r | 正则表达式 |\n| P~Q | 顺序组合 |\n| P <~\
  \ Q, P ~> Q | 顺序组合；仅保留左侧/右侧 |\n| P | Q | 备 |\n| opt(P) | 选项 |\n| rep(P) | 重复 |\n\
  | repsep(P, Q) | 交替重复 |\n| P ^^ f | 结果转换 |\n\n### 关闭分号推断\n\n注意，Listing 33.5 中 `value`\
  \ 解析器的体被包含在括号中。这是一个禁用分号推断的小技巧。你在 Section 4.2 中看到，Scala 会在任何两个可以在语法上分离的行之间假设存在一个分号，除非第一行以中缀运算符结尾，或者两行被包含在括号中。现在，你可以在每个备选方案的末尾写\
  \ `|` 运算符，而不是在下一个备选方案的开头，如下所示：\n\n```scala\ndef value: Parser[Any] =\n  obj\n  |\
  \ arr\n  | stringLiteral\n  | ...\n```\n\n在这种情况下，不需要在 value 解析器的体周围加括号。然而，有些人更倾向于在第二个备选方案的开头看到\
  \ `|` 运算符，而不是在第一个方案的结尾。通常情况下，这会导致两行之间出现一个意外的分号，如下：\n\n```scala\nobj; // 插入了分号\n\
  \  | arr\n```\n\n分号改变了代码的结构，导致其失败。将整个表达式放在括号中可以避免分号并使代码通过编译。\n\n#### 符号名称与字母数字名称\n\
  \nTable 33.1 中的许多解析器组合器使用了符号名称。这既有优点也有缺点。缺点是，符号名称需要时间来学习。不熟悉 Scala 组合器库的用户可能困惑 `~`、`~>`\
  \ 或 `^^` 是什么。优点是，符号名称很短，并且可以选择它们使其具有“正确”的优先级和结合性。例如，解析器组合器 `~`、`^^` 和 `|` 是刻意按照优先级从高到低的顺序选择的。一个典型的文法产生式由具有解析部分和转换部分的备选方案组成。解析部分通常包含几个由\
  \ `~` 运算符分隔的项。通过所选的 `~`、`^^` 和 `|` 的优先级，你可以编写这样的文法产生式，而不需要任何括号。\n\n此外，符号运算符比字母运算符占据的视觉空间更少。这对于解析器很重要，因为可以让你专注于语法本身，而不是组合器本身。\n\
  \n想象一下，如果顺序组合 `~` 被称为 `andThen`，而备选 `|` 被称为 `orElse`，那么 Listing 33.1 中的算术表达式解析器将如下所示：\n\
  \n```scala\nclass Arithothetical extends JavaTokenParsers {\n  def expr: Parser[Any]\
  \ =\n    term andThen(\"+\" andThen term) orElse (\" andThen term))\n  def term:\
  \ Parser[Any] =\n    factor andThen(\"*\" andThen factor) orElse (\" andThen factor))\n\
  \  def factor: Parser[Any] =\n    floatingPointNumber orElse (\" andThen expr\n\
  ```\n\n你会发现代码变得很长，在运算符中很难看出语法。另一方面，新接触组合器的人可能更容易理解代码的意图。\n\n### 符号名称与字母数字名称的选择\n\
  \n关于符号名称和字母数字名称的选择，我们的建议指南如下：\n\n* 在符号已具有通用含义的情况下使用符号名称。例如，没有人建议在进行数值加法时用 `add`\
  \ 代替 `+`。\n* 否则，如果你希望代码对普通读者是易于理解的，请优先使用字母数字名称。\n* 在特定领域的库中，你仍然可以选择符号名称，如果这具有明显的清晰度优势，并且你并不预期没有该领域基础的读者能够立即理解代码。\n\
  \n在我们观察组合器的情况下，面对的是一种高度特定领域的语言，即使使用字母数字名称，普通读者可能有困难。此外，对于专家来说，符号名称具有明显的清晰度优势。因此，我们认为在这种应用中使用它们是必要的。\n\
  \n###  实现组合器解析器\n\n之前的章节展示了 Scala 的组合器解析器提供了构建自定义解析器的方便方法。由于它们只是 Scala 库，因此可以无缝集成到你的\
  \ Scala 程序中。因此，很容易将解析器与处理其结果的代码相结合，或者调整解析器使其从特定源（例如文件、字符串或字符数组）获取输入。\n\n这是如何实现的呢？在本章的剩余部分，你将查看组合器解析器的“内部”。你将看到什么是解析器，以及之前节中遇到的原始解析器和解析器组合器是如何实现的。如果你只想编写一些简单的组合器解析器，可以安全地跳过这些部分。另一方面，阅读本章剩余部分应该让你对组合器解析器有更深层次的理解，对组合器领域特定语言的设计原理有更一般的了解。\n\
  \n\n\n\nScala 组合器解析框架的核心位于 `scala.util.parsing.combinator.Parsers` 这一 trait 中。该\
  \ trait 定义了 `Parser` 类型以及所有基础组合器。除非另有明确说明，以下两个子节中解释的定义都存在于该 trait 中。也就是说，它们被假设包含在如下所示的\
  \ trait 定义中：\n\n```\n package scala.util.parsing.combinator\n  trait Parsers {\n\
  \  ... // 除非另有说明，代码在此处\n}\n```\n\n`Parser` 本质上只是一个从某种输入类型到解析结果的函数。作为初步近似，该类型可以写如下：\n\
  \n```\n type Parser[T] = Input => ParseResult[T]\n```\n\n### Parser 输入\n\n有时，解析器读取的是标记流（token\
  \ stream），而不是原始字符序列。此时使用一个单独的词法分析器将原始字符流转换为标记流。解析器输入的类型定义如下：\n\n```\n type Input\
  \ = Reader[Elem]\n```\n\n`Reader` 类来自 `scala.util.parsing.input` 包。它类似于 `Stream`，但还会跟踪它所读取的所有元素的位置。类型\
  \ `Elem` 代表单个输入元素。它是 `Parsers` trait 的一个抽象类型成员：\n\n```\n type Elem\n```\n\n这意味着\
  \ `Parsers` 的子类和子 trait 需要将类 `Elem` 实例化正在解析的输入元素类型。例如，`RegexParsers` 和 `JavaTokenParsers`\
  \ 将 `Elem` 固定为 `Char`。但也可以将 `Elem` 设置为其他类型，例如从单独的词法分析器返回的标记类型。\n\n### Parser 结果\n\
  \n解析器在某些给定输入上可能会成功或失败。因此，`ParseResult` 类有两个子类来表示成功和失败：\n\n```\n sealed abstract\
  \ class ParseResult[+T] \n  case class SuccessT \n  extends ParseResult[T]\n  case\
  \ class Failure(msg: String, in: Input) \n  extends ParseResult[Nothing]\n```\n\n\
  `Success` 案例通过其 `result` 参数携带了解析器返回的结果。解析结果的类型是任意的；这也就是为什么 `ParseResult`、`Success`\
  \ 和 `Parser` 都带有一个类型参数 `T`。该类型参数表示给定解析器返回的结果类型。`Success` get 接受第二个参数 `in`，它指向紧随解析器消耗的部分之后的输入。该字段对于解析器链是必要的，以便一个解析器可以在另一个解析器之后运行。注意，这是一种纯函数式的解析方法。`Input`\
  \ 不是作为副作用读取的，而是保留在流中。解析器分析输入流的一部分，然后并在其结果中返回剩余部分。\n\n`ParseResult` 的另一个子类是 `Failure`。该类接受一个消息作为参数，描述解析器失败的原因。像\
  \ `Success` 一样，`Failure` 也接受剩余输入流作为第二个参数。这并不是为了链式（解析器在失败后不会继续），而是为了将错误消息放置在输入流中的正确位置。\n\
  \n注意，解析结果被定义为类型参数 `T` 协变。也就是说，一个返回 `Strings` 结果的解析器，与一个返回 `AnyRefs` 的解析器是兼容的。\n\n\
  ### Parser 类\n\n之前将解析器描述为从输入到解析结果的函数的定义过于简单了。之前的示例显示，解析器还实现了诸如用于两个解析器顺序组合的 `~` 以及用于它们备选组合的\
  \ `|` 等方法。因此，`Parser` 实际上是一个继承自函数类型 `Input => ParseResult[T]` 的类，并额外定义了这些方法：\n\n\
  ```\n abstract class Parser[+T] extends (Input => ParseResult[T]) \n  { p =>\n \
  \   // 一个未指定的的方法，用于定义\n    // 此解析器的行为。\n    def apply(in: Input): ParseResult[T]\n\
  \n    def ~ ...\n    def | ...\n    ...\n  }\n```\n\n由于解析器是（即继承自）函数，它们需要定义一个 `apply`\
  \ 方法。你在 `Parser` 类中看到了一个抽象的 `apply` 方法，但这仅仅是为了文档，因为该方法在任何情况下都是从父类型 `Input => ParseResult[T]`\
  \ 继承的（记住该类型是 `scala.Function1[Input, ParseResult[T]]` 的缩写）。在继承自抽象 `Parser` 类的具体解析器中仍需要实现\
  \ `apply` 方法。这些解析器将在关于此别名的后续节之后进行讨论。\n\n#### 对此进行别名 (Aliasing this)\n\n`Parser`\
  \ 类的体开始于一个奇特的表达式：\n\n```\n abstract class Parser[+T] extends ... { p =>\n```\n\n\
  类模板左大括号之后紧跟的如 `\"id =>\"` 子会将标识符 `id` 定义为类中 `this` 的别名。这就像是你写了：\n\n```\n val id\
  \ = this\n```\n\n在类体内，但 Scala 编译器知道 `id` 是 `this` 的别名。例如，你可以使用 `id.m` 或 `this.m`\
  \ 访问类的对象私有成员 `m`；两者是完全等价的。如果 `id` 仅被定义为以 `this` 为右侧的 `val`，那么第一个表达式将无法编译，因为在这种情况下，Scala\
  \ 编译器会将 `id` 视为一个普通的标识符。\n\n你在 第 29.4 节 中见过这样的语法，那里它被用于给 trait 提供一个 self 类型。当你需要访问外部类的\
  \ `this` 时，别名也可以是一个很好的缩写。这里有一个例子：\n\n```\n class Outer { outer =>\n  class Inner\
  \ {\n    println(Outer.this eq outer) // prints: true\n  }\n}\n```\n\n该示例定义了两个嵌套类\
  \ `Outer` 和 `Inner`。在 `Inner` 内部，Outer 类的值被引用两次，使用了不同的表达式。第一个表达式显示了 Java 处理问题的方法：你可以用类名前名前缀。第二个表达式显示了\
  \ Scala 提供的替代方案。通过在类中为此 引入一个名为 `outer` 的别名，你可以直接引用此。参见示例 此处 和 此处。\n\n#### 单标记解析器\n\
  \nTrait `Parsers` 定义了一个通用泛型解析器 `elem`，可以用于解析任何单个标记：\n\n```\n def elem(kind: String,\
  \ p: Elem => Boolean) = \n  new Parser[Elem] {\n    def apply(in: Input) =\n   \
  \   if (p(in.first)) Success(in.first, in.rest)\n      else Failure(kind + \" expected\"\
  , in)\n  }\n```\n\n此解析器接受两个参数：一个描述应该解析的标记类型的 `kind` 字符串，以及一个对 `Elem` 的谓词 `p`，指示元素是否符合要解析的标记类。\n\
  \n当解析器 `elem(kind, p)` 应用于输入 `in` 时，会对输入流的首元素测试谓词 `p`。如果 `p` 返回 `true`，解析器成功。其结果是元素本身，其剩余输入是从解析元素之后之后开始的输入流\
  \ `in.rest`。另一方面，如果 `p` 返回 `false`，解析器失败并带有指示预期标记类型的消息。\n\n#### 顺序组合\n\n`elem` 解析器只消耗一个元素。为了解析更有的语句，可以使用顺序组合运算符\
  \ `~` 将解析器连接起来。正如你之前看到的，`P~Q` 是一个首先将 `P` 解析器应用于给定输入字符串的解析器。然后，如果 `P` 成功，则将 `Q` 解析器应用于\
  \ `P` 完成工作后留下的输入。\n\n\n\n\n`~` 组合器被实现为 `Parser` 类中的一个方法。其定义如列表 33.6 所示。该方法是 `Parser`\
  \ 类的成员。在该类内部，`p` 通过 `\"p =>\"` 部分指定为该类的别名，因此 `p` 指定了 `~` 的左操作数（或：接收者）。它的右操作数由参数\
  \ `q` 表示。现在，如果在某些输入 `in` 上运行 `p~q`，首先在 `in` 上运行 `p` 并在模式匹配中分析结果。如果 `p` 成功，则在剩余的输入\
  \ `in1` 上运行 `q`。如果 `q` 也成功，则整个解析器执行成功。其结果是一个 `~` 对象，包含了 `p` 的结果（即 `x`）和 `q` 的结果（即\
  \ `y`）。另一方面，如果 `p` 或 `q` 一个失败，`p~q` 的结果就是 `p` 或 `q` 返回的 `Failure` 对象。\n\n```\nabstract\
  \ class Parser[+T] ... { p =>\n  ...\n  def ~ U = new Parser[T~U] {\n    def apply(in:\
  \ Input) = p(in) match {\n      case Success(x, in1) => \n        q(in1) match {\n\
  \          case Success(y, in2) => Success(new ~(x, y), in2)\n          case failure\
  \ => failure\n        }\n      case failure => failure\n    }\n  }\n}\n```\n\n#####\
  \ 列表 33.6 - ~-组合器方法。\n\n`~` 的结果类型是一个解析器，它返回一个带有类型 `T` 和 `U`元素的样例类实例。类型表达式 `T~U`\
  \ 只是参数化类型 `~[T, U]` 的更易读的简写。通常，Scala 总是将二进制类型操作（如 `A op B`）解释为参数化类型 `op[A, B]`。这与模式的情况类似，二进制模式\
  \ `P op Q` 也被解释为一种调用，即 `op(P, Q)`。\n\n另外两个顺序组合操作符 `<~` 和 `~>` 可以像 `~` 一样定义，只需在计算结果的方式上进行微小的调整。不过，更优雅的技术是根据\
  \ `~` 如下定义它们：\n\n```\ndef <~ U: Parser[T] = \n  (p~q) ^^ { case x~y => x }\ndef\
  \ ~> U: Parser[U] = \n  (p~q) ^^ { case x~y => y }\n```\n\n#### 替代组合\n\n另一种组合方式\
  \ `P | Q` 对给定的输入应用 `P` 或 `Q`。它首先尝试 `P`。如果 `P` 成功，整个解析器以 `P` 的结果成功。否则，如果 `P` 失败，则在与\
  \ `P` 相同的输入上尝试 `Q`。`Q` 的结果就是整个解析器的结果。\n\n这里是 `|` 作为 `Parser` 类方法的定义：\n\n```\ndef\
  \ | (q: => Parser[T]) = new Parser[T] {\n  def apply(in: Input) = p(in) match {\n\
  \    case s1 @ Success(_, _) => s1\n    case failure => q(in) \n  }\n}\n```\n\n\
  注意，如果 `P` 和 `Q` 都失败，则失败信息由 `Q` 决定。这个微妙的选择将在稍后的第 33.9 节 中讨论。\n\n#### 处理递归\n\n注意，方法\
  \ `~` 和 `|` 中的参数 `q` 是按名（by-name）的——其类型前面有 `=>`。这意味着实际的解析器参数只有在需要 `q` 时才会求值，而这应该发生在\
  \ `p` 运行之后。这使得编写递归解析器成为可能，例如下面这个解析任意数量括号的数字：\n\n```\ndef parens = floatingNumber\
  \ | \"(\"~\")\"\n```\n\n如果 `|` 和 `~` 采用按值参数，此定义将立即导致栈溢出，因为 `parens` 的值出现在其右侧部分的中间。\n\
  \n#### 结果转换\n\n`Parser` 的 `^^` 方法转换解析器的结果。当 `P` 成功时，解析器 `P ^^` 成功。在这种情况下，它使用函数 `f`\
  \ 返回 `P` 的结果。这里是实现：\n\n```\ndef ^^ U: Parser[U] = new Parser[U] {\n  def apply(in:\
  \ Input) = p(in) match {\n    case Success(x, in1) => Success(f(x), in1)\n    case\
  \ failure => failure\n  }\n}\n```\n\n#### 不读取任何输入的解析器\n\n还有两个不消耗任何输入的解析器：`success`\
  \ 和 `failure`。解析器 `success(result)` 总是带有给定结果成功。解析器 `failure(msg)` 总是以错误 `msg` 失败。两者都实现为\
  \ trait `Parsers` 中的方法，该 trait 是包含 `Parser` 类的外部 trait：\n\n```\ndef successT = new\
  \ Parser[T] {\n  def apply(in: Input) = Success(v, in)\n}\ndef failure(msg: String)\
  \ = new Parser[Nothing] {\n  def apply(in: Input) = Failure(msg, in)\n}\n```\n\n\
  #### Option 和重复\n\n在 trait `Parsers` 中还定义的可选和重复组合器 `opt`、`rep` 和 `repsep`。它们都是基于顺序组合、备选和结果转换实现的：\n\
  \n```\ndef optT: Parser[Option[T]] = (\n  p ^^ Some(_)\n| success(None)\n)\ndef\
  \ repT: Parser[List[T]] = (\n  p~rep(p) ^^ { case x~xs => x :: xs }\n| success(List())\n\
  )\ndef repsepT: Parser[List[T]] = (\n  p~rep(q~> p) ^^ { case r~rs => r :: rs }\n\
  | success(List())\n)\n```\n\n### 33.7 字符串字面量和正则表达式\n\n你目前看到的解析器使用了字符串字面量和正则表达式来解析单个单词。对这些支持来自\
  \ `RegexParsers`，它是 `Parsers` 的子 trait：\n\n```\ntrait RegexParsers extends Parsers\
  \ {\n```\n\n该 trait 比 trait `Parsers` 更专门，因为它仅适用于作为字符序列的输入：\n\n```\ntype Elem =\
  \ Char\n```\n\n它定义了两个方法，`literal` 和 `regex`，签名如下：\n\n```\nimplicit def literal(s:\
  \ String): Parser[String] = ...\nimplicit def regex(r: Regex): Parser[String] =\
  \ ...\n```\n\n注意，两个方法都有 `implicit` 修饰符，因此每当给出 `String` 或 `Regex` 但期望得到 `Parser`\
  \ 的时候，它们都会被自动应用。这就是为什么你可以直接在语法中写出字符串字面量和正则表达式，而无需用这些方法中的一个来封装它们。例如，解析器 `\"(\"~expr~\"\
  )\"` 将自动展开为 `literal(\"(\")~expr~literal(\")\")`。\n\n`RegexParsers` trait 还负责处理符号之间的空白。为了做到这一点，它在运行字面量或正则解析器之前会调用一个名为\
  \ `handleWhiteSpace` 的方法。`handleWhiteSpace` 方法跳过符合 `whiteSpace` 正则表达式的最长输入序列，其默认定义如下：\n\
  \n```\nprotected val whiteSpace = \"\"\"\\s+\"\"\".\n```\n\n如果你对空白字符有不同的处理方式，可以重写\
  \ `whiteSpace` 值。例如，如果你完全不想跳过空白字符，可以使用空正则表达式重写 `whiteSpace`：\n\n```\nobject MyParsers\
  \ extends RegexParsers {\n  override val whiteSpace = \"\".r\n  ...\n}\n```\n\n\
  ### 33.8 词法和解析\n\n语法分析的任务通常分为两个阶段。词法阶段识别输入中的单个单词并将其分类为某些标记类。这一阶段也被称为词法分析。随后是语法分析阶段，它分析标记序列。\n\
  \n上一节描述的 `Parsers` trait 可用于任何阶段，因为它的输入元素是抽象类型 `Elem`。对于词法分析，`Elem` 将实例化为 `Char`，意味着组成单词的单个字符正在被解析。语法分析器反会将\
  \ `Elem` 实例化为词法器返回的标记类型。\n\nScala 的解析组合器提供了几个用于词法和语法分析的工具类。它们包含在两个子包中，每种分析一个：\n\n\
  ```\nscala.util.parsing.combinator.lexical\n  scala.util.parsing.combinator.syntactical\n\
  ```\n\n\n\n\n如果你想将解析器拆分为独立的词法分析器和语法分析器，你应该咨询这些包的 Scaladoc 文档。但对于简单的解析器，本章之前展示的基于正则表达式的方法通常足够了。\n\
  \n### 33.9 错误报告\n\n还有一个最后一个尚未涵盖的主题：解析器如何发布错误消息？解析器的错误报告在某种程度上是一门“黑术”。问题之一是，当解析器拒绝某些输入时，它通常遇到了许多不同的失败。每种备选解析都可能失败了，并且在每个选择点都递归地失败。在通常有很多的失败中，应该将哪一个作为错误消息发布给用户？\n\
  \nScala 的解析库实现了一种简单的启发式策略：在所有失败中，选择发生在输入中较晚位置的那个失败。换句话说，解析器选择了最长的有效前缀，并发布一条描述为什么无法继续解析该前缀的错误消息。如果该最新位置有多个失败点，则选择最后访问的那个。\n\
  \n例如，考虑在一个错误的地址簿上运行 JSON 解析器，该地址簿以以下行开头：\n\n```\n { \"name\": John,\n```\n\n该短语最长的合规前缀是\
  \ `\"{ \"name\":`。因此 JSON 解析器会将单词 `John` 标记为错误。JSON 解析器在此处期望一个值，但 `John` 是一个标识符，它不被视为值（推测文档作者忘记将名称包含在引号中）。解析器为该文档发布的错误消息是：\n\
  \n```\n [1.13] failure: \"false\" expected but identifier John found\n\n  { \"name\"\
  : John,\n               ^\n```\n\n期望出现 `\"false\"` 的部分是因为 `\"false\"` 是 JSON 语法中值（value）产生式的最后一个备选方案。因此，这是该点的最后一次失败。详细了解\
  \ JSON 语法的用户可以重建该错误消息，但对于非专家来说，这个错误消息可能会令人惊讶，而且可能具有误导性。\n\n通过在值产生式的最后一个备选方案添加一个“全部”失败点，可以设计出更好的错误消息：\n\
  \n```scala\n def value: Parser[Any] =\n  obj | arr | stringLit | floatingPointNumber\
  \ | \"null\" |\n  \"true\" | \"false\" | failure(\"illegal start of value\")\n```\n\
  \n此添加并没有改变接受为有效文档的输入集。它的作用是改进错误消息，因为现在显式添加的失败将作为最后一个备选方案并因此被报告：\n\n```\n [1.13]\
  \ failure: illegal start of value\n\n  { \"name\": John,\n               ^\n```\n\
  \n“最后可能”错误报告方案的实现使用了 `Parsers` 特性中一个名为 `lastFailure` 的字段来标记发生在输入中较晚位置的失败：\n\n```scala\n\
  \ var lastFailure: Option[Failure] = None\n```\n\n该字段被初始化为 `None`。它在 `Failure` 类的构造函数中更新：\n\
  \n```scala\n case class Failure(msg: String, in: Input) \n  extends ParseResult[Nothing]\
  \ {\n\n  if (lastFailure.isDefined && \n      lastFailure.get.in.pos <= in.pos)\n\
  \    lastFailure = Some(this)\n}\n```\n\n该字段由 `phrase` 方法读取，如果解析器失败，该方法会发布最终错误消息。以下是\
  \ `Parsers` trait 中 `phrase` 的实现：\n\n```scala\n def phraseT = new Parser[T] {\n\
  \  lastFailure = None\n  def apply(in: Input) = p(in) match {\n    case s @ Success(out,\
  \ in1) =>\n      if (in1.atEnd) s \n      else Failure(\"end of input expected\"\
  , in1)\n    case f : Failure => \n      lastFailure\n  }\n}\n```\n\n`phrase` 方法运行其参数解析器\
  \ `p`。如果 `p` 成功，则返回 `p` 的成功结果。如果 `p` 成功但输入未完全读取，则返回“end of input expected”失败。如果\
  \ `p` 失败，则返回存储在 `lastFailure` 中的失败。\n\n### 33.10 回溯与 LL(1)\n\n组合器框架允许使用一个新运算符 `~!`\
  \ 来表达语法是 LL(1)。该运算符类似于顺序组合 `~`，但它不会回溯。通常可以通过修改语法来避免回溯。例如，在算术表达式的情况下，以下产生式之一均可行：\n\
  \n- `expr ::= term [+ expr]`\n- `expr ::= term {+ term}`\n\n许多语言允许所谓的“LL(1)”语法。当从这种语法形成组合器解析器时，它永远不会回溯，即输入位置永远不会重置。例如，本章之前的算术表达式和\
  \ JSON 语法都是 LL(1)，所以解析组合器的回溯功能从未被触发。LL(1) 解析器的优点之一是可以使用更简单的输入技术。输入可以顺序读取，并在读取后可以丢弃。这也是\
  \ LL(1) 解析器通常比回溯解析器高效的另一个原因。\n\n回溯可能是昂贵的，因为同一个输入可能会被多次解析。使用 `~!` 运算符，算术表达式解析器可以改写为：\n\
  \n```scala\n def expr: Parser[Any] =\n  term ~! rep(\"+\" ~ term | \"-\" ~ term)\n\
  \  def term: Parser[Any] =\n  factor ~! rep(\"*\" ~ factor | \"/\" ~ factor)\n \
  \ def factor: Parser[Any] =\n  \"(\" ~! expr ~ \")\" | floatingPointNumber\n```\n\
  \n### 33.11 总结\n\n你已经学习了 Scala 组合器解析框架的所有要素。对于一个真正用的工具来说，代码量少得惊人。通过该框架，你可以为很大类无关无关的文法构建解析器。该框架让你快速上手，也可以自定义以适应新类型的文法和输入方法。由于它是一个\
  \ Scala 库，它与语言的其余部分无缝集成。因此，在较大的 Scala 程序中集成组合器解析器非常容易。\n\n\n\n组合器解析器（combinator\
  \ parsers）的一个缺点是它们的效率不高，至少与从 `Yacc` 或 `Bison` 等特殊用途工具生成的解析器相比是如此。这有两个原因。首先，组合器解析使用的回溯方法本身并不高效。取决于语法和解析输入，它可能会由于重复回溯导致指数级的速度变慢。这可以通过将语法设为\
  \ `LL(1)` 并使用提交式顺序组合操作符 `~!` 来解决。\n\n第二个影响组合器解析器性能的问题是，它们将解析器的构建和输入分析混合在同一组操作中。实际上，对于每个被解析的输入，都会重新生成一个解析器。\n\
  \n这个问题是可以克服的，但它对解析器组合器框架有不同的实现方式。在一个优化框架中，解析器将不再被表示为从输入到解析结果的函数。相反，它将被表示为一个树，其中每个构建步骤都表示为一个样例类（case\
  \ class）。例如，顺序组合可以用样例类 `Seq` 表示，备选组合用 `Alt` 表示，以此此类推。“最外层”的解析器方法 `phrase` 就可以接收这种解析器的符号表示，并使用标准的解析器生成算法将其转换为高效的解析表。\n\
  \n这一切的妙之处在于，从用户的角度来看，与普通的组合器解析器相比没有任何变化。用户仍然使用 `ident`、`floatingPointNumber`、`~`、`|`\
  \ 等项来编写解析器。他们不需要意识到这些方法生成的是解析器的符号表示而不是解析器函数。由于 `phrase` 组合器将这些表示转换为真实的解析器，因此一切都像以前一样工作。\n\
  \n这种方案在性能方面的优势是双倍的。首先，你现在可以将解析器的构建从输入分析中分离出来。如果你编写：\n\n```\nval jsonParser = phrase(value)\n\
  ```\n\n然后将 `jsonParser` 应用于几个不同的输入上，`jsonParser` 只会被构建一次，而不是每次读取输入时都构建。\n\n其次，解析器生成可以使用高效的解析算法，如\
  \ `LALR(1)`。[3]](#combinator-parsing.html_footnotemain33-3) 这些算法通常会导致产生比回溯运行的解析器快得多的解析器。\n\
  \n目前，Scala 还没有编写这样的优化解析器生成器。但这样做是完全可能的。如果有人贡献这样的生成器，它将很容易集成到 Scala 标准库中。然而，即使假设这种生成器在未来的某个时刻会存在，保留当前的解析器组合器框架也有其理由。它比解析器生成器更容易理解和适应，而且速度上的差异在实践中通常并不重要，除非你想解析非常大的输入。\n\
  \n***\n\n#### 第 33 章脚注：\n\n[1] 即使在存在左递归的情况下，也有方法可以避免栈溢出，但这需要一个更精细的解析器组合器框架，该框架到目前尚未实现。\n\
  \n[2] Aho, *et. al.*, *Compilers: Principles, Techniques, and Tools*. [[Aho86]](#bibliography.html_aho-sethi-ullman)\n\
  \n[3] Aho, *et. al.*, *Compilers: Principles, Techniques, and Tools*. [[Aho86]](#bibliography.html_aho-sethi-ullman)\n\
  \n# 第 34 章\n\n# GUI 编程\n\n在本章中，你将学习如何开发使用图形用户界面（GUI）的 Scala 应用。我们将开发的应用程序基于一个 Scala\
  \ 库，该库提供了对 Java Swing GUI 类的访问。从概念上讲，Scala 库类似于底层的 Swing 类，但隐藏了它们的大部分复杂性。你会发现使用该框架开发\
  \ GUI 应用程序实际上非常简单。\n\n即使有了 Scala 的简化，像 Swing 这样的框架也非常丰富，包含许多不同的类，每个类中都有许多方法。在这样一个丰富的库中找到方向，使用如\
  \ Scala 的 Eclipse 插件之类的 IDE 会很有帮助。其优势在于 IDE 可以通过其命令补全交互式地向你显示包中有哪些类，以及你引用的对象中有哪些方法。当你第一次探索未知的库空间时，这会显著加快你的学习。\n\
  \n| ![image images/firstSwingAppLittleGray96.png](img/firstSwingAppLittleGray96.png)\
  \ | ![image images/firstSwingAppBigGray96.png](img/firstSwingAppBigGray96.png) |\n\
  \n##### 图 34.1 - 一个简单的 Swing 应用程序：初始（左）和调整大小（右）。\n\n### 34.1 第一个 Swing \n\n作为第一个\
  \ Swing 应用，我们将从一个包含单个按钮的窗口开始。要使用 Swing 编程，你需要从 Scala 的 Swing API 包导入各种类：\n\n```\n\
  import scala.swing._\n```\n\n列表 34.1 显示了你在 Scala 中第一个 Swing 应用程序的代码。如果你编译并运行该文件，你应该看到如\
  \ 图 34.1 左侧所示的窗口。窗口可以调整为更大的尺寸，如 图 34.1 右侧所示。\n\n```\nimport scala.swing._\n\n  object\
  \ FirstSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame {\n\
  \      title = \"First Swing App\"\n      contents = new Button {\n        text\
  \ = \"Click me\"\n      }\n    }\n  }\n```\n\n##### 列表 34.1 - 一个简单的 Swing 应用程序。\n\
  \n如果你逐行分析 列表 34.1 中的代码，你会注意到以下元素：\n\n```\nobject FirstSwingApp extends SimpleSwingApplication\
  \ {\n```\n\n在导入后的第一行，`FirstSwingApp` 对象继承自 `scala.swing.SimpleSwingApplication`。该应用程序与传统的命令行应用程序不同，后者可能继承自\
  \ `scala.App`。`SimpleSwingApplication` 类已经定义了一个 `main` 方法，其中包含用于 Java 框架的一些设置代码。随后，`main`\
  \ 方法调用你提供的 `top` 方法：\n\n```\ndef top = new MainFrame {\n```\n\n下一行实现了 `top` 方法。该方法包含了定义你的顶层\
  \ GUI 组件的代码。这通常是某种类型的 Frame——*即*，一个可以包含任意数据的窗口。在 列表 34.1 中，我们选择了一个 `MainFrame` 作为顶层组件。`MainFrame`\
  \ 就像一个普通的 Swing Frame，区别在于关闭它也会关闭整个 GUI 应用程序。\n\nFrame 有许多属性。其中最重要的两个是框架的标题（将写在标题栏中）和它的内容（将显示在窗口本身）。在\
  \ Scala 的 Swing API 中，此类属性被建模为属性。你从 第 18.2 节 知道属性在 Scala 中被编码为对的 getter 和 setter\
  \ 方法。例如，`Frame` 对象的 `title` 属性被建模为一个 getter 方法：\n\n```\ndef title: String\n```\n\
  \n和一个 setter 方法：\n\n```\ndef title_(s: String)\n```\n\n正是这个 setter 方法在上述对 `title`\
  \ 的赋值时被调用。赋值的影响是将所选的标题显示在窗口的头部。如果你省略了它，窗口将没有标题。\n\n```\ncontents = new Button {\n\
  ```\n\n\n\n顶层框架是 Swing 程序的根组件。它是一个 `Container`，意味着可以在其中定义进一步的组件。每个 Swing 容器都有一个\
  \ `contents` 属性，允许你获取和设置它包含的组件。该属性的访问器 `contents` 类型为 `Seq[Component]`，表示一个组件通常可以有多个对象作为其内容。然而，框架（Frames）始终只有一个组件作为其内容。该组件通过设置器\
  \ `contents_` 进行设置并可能更改。例如，在代码列表 34.1 中，单个 `Button` 构成了顶层框架的内容。\n\n```\ntext = \"\
  Click me\"\n```\n\n按钮也获得了一个标题，在此情况下为 \"Click me。\"\n\n### 34.2 面板与布局\n\n作为下一步，我们将一些文本作为第二个内容元素添加到应用程序的顶层框架中。图\
  \ 34.2 的左部分显示了应用程序应该的样子。\n\n| ![image images/noClicks2Gray96.png](img/noClicks2Gray96.png)\
  \ | ![image images/sevenClicks2Gray96.png](img/sevenClicks2Gray96.png) |\n\n#####\
  \ 图 34.2 - 响应式 Swing 应用：初始（左侧），点击后（右侧）。\n\n```scala\nimport scala.swing._\n\n  object\
  \ SecondSwingApp extends SimpleSwingApplication {\n    def top = new MainFrame {\n\
  \      title = \"Second Swing App\"\n      val button = new Button {\n        text\
  \ = \"Click me\"\n      }\n      val label = new Label {\n        text = \"No button\
  \ clicks registered\"\n      }\t\n      contents = new BoxPanel(Orientation.Vertical)\
  \ {\n        contents += button\n        contents += label\n        border = Swing.EmptyBorder(30,\
  \ 30, 10, 30)\n      }\n    }\n  }\n```\n\n##### 代码列表 34.2 - 面板上的组件组合。\n\n你在上一节中看到框架恰好包含一个子组件。因此，为了创建一个同时包含按钮和标签的框架，你需要创建一个不同的容器组件来同时持有这两者。这就是面板（Panels）的用途。`Panel`\
  \ 是一种容器，它根据某些固定的布局规则显示它包含的所有组件。有许多可能的布局，由 `Panel` 类的各种子类实现，从简单到非常复杂。事实上，复杂 GUI 应用中最难的部分之一就是获得正确的布局——要设计出一个在所有类型设备和所有窗口尺寸下显示都良好的界面并不是容易的。\n\
  \n代码列表 34.2 显示了一个完整的实现。在这个类中，顶层框架的两个子组件命名为 `button` 和 `label`。按钮像之前一样定义。标签是一个不可编辑的显示文本字段：\n\
  \n```scala\nval label = new Label {\n  text = \"No button clicks registered\"\n\
  }\n```\n\n代码列表 34.2 中的代码选择了一种简单的垂直布局，组件在 `BoxPanel` 中堆叠在一起：\n\n```scala\ncontents\
  \ = new BoxPanel(Orientation.Vertical) {\n```\n\n`BoxPanel` 的 `contents` 属性是一个（初始为空的）缓冲区，通过\
  \ `+=` 运算符将按钮和标签元素添加到其中：\n\n```scala\ncontents += button\ncontents += label\n```\n\
  \n我们还通过为面板的 `border` 属性赋值为这两个对象周围添加了边框：\n\n```scala\nborder = Swing.EmptyBorder(30,\
  \ 30, 10, 30)\n```\n\n与其他 GUI 组件一样，边界是以对象表示的。`EmptyBorder` 是 `Swing` 对象中的一个工厂方法，它接受四个参数，表示要绘制的对象顶、右、下、左侧边框宽度。\n\
  \n尽管简单，该示例已经展示了构建 GUI 应用的基本方法。它已经构建完成。\n\n### 34.3 处理事件\n\n顶层框架是 Swing 程序的根组件。它是一个\
  \ `Container`，意味着可以在其中定义进一步的组件。每个 Swing 容器都有一个 `contents` 属性，允许你获取和设置它包含的组件。该属性的访问器\
  \ `contents` 类型为 `Seq[Component]`，表示一个组件通常可以有多个对象作为其内容。然而，框架（Frames）始终只有一个组件作为其内容。该组件通过设置器\
  \ `contents_` 进行设置并可能更改。例如，在代码列表 34.1 中，单个 `Button` 构成了顶层框架的内容。\n\n按钮也获得了一个标题，在此情况下为\
  \ \"Click me。\"\n\n### 34.2 面板与布局\n\n作为下一步，我们将一些文本作为第二个内容元素添加到应用程序的顶层框架中。图 34.2\
  \ 的左部分显示了应用程序应该的样子。\n\n你在上一节中看到框架恰好包含一个子组件。因此，为了创建一个同时包含按钮和标签的框架，你需要创建一个不同的容器组件来同时持有这两者。这就是面板（Panels）的用途。`Panel`\
  \ 是一种容器，它根据某些固定的布局规则显示它包含的所有组件。有许多可能的布局，由 `Panel` 类的各种子类实现，从简单到非常复杂。\n\n代码列表 34.2\
  \ 显示了一个完整的实现。在这个类中，顶层框架的两个子组件命名为 `button` 和 `label`。按钮像之前一样定义。标签是一个不可编辑的显示文本字段。\n\
  \n代码列表 34.2 中的代码选择了一种简单的垂直布局，使用 `BoxPanel`。\n\n`BoxPanel` 的 `contents` 属性是一个（初始为空的）缓冲区，通过\
  \ `+=` 运算符将按钮和标签元素添加到其中。\n\n我们还通过为面板的 `border` 属性赋值为这两个对象周围添加了边框。\n\n`EmptyBorder`\
  \ 是 `Swing` 对象中的一个工厂方法，它接受四个参数，表示要绘制的对象顶、右、下、左侧边框宽度。\n\n### 34.3 处理事件\n\n在 Java\
  \ 中，信号事件意味着在实现某些接口的对象中调用“notify”方法。通常，这涉及到大量的间接和样板代码，使得事件处理程序难以编写。相比之下，在 Scala 中，事件是一个真实的对象，就像消息发送给\
  \ Actor 一样发送给订阅者。例如，按下按钮将创建一个事件，该事件是以下类类的实例：\n\n```scala\ncase class ButtonClicked(source:\
  \ Button)\n```\n\n类类的参数引用被点击的按钮。与其他所有 Swing 事件一样，此事件类包含在名为 `scala.swing.event` 的包中。\n\
  \n要让你的组件对传入的事件做出响应，你需要向名为 `reactions` 的属性中添加一个处理器。例如：\n\n```scala\nvar nClicks =\
  \ 0\nreactions += {\n  case ButtonClicked(b) =>\n    nClicks += 1\n    label.text\
  \ = \"Number of button clicks: \" + nClicks\n}\n```\n\n通常，处理器是一个 `PartialFunction`，它匹配事件并执行某些操作。也可以通过使用多个\
  \ `case` 在单个处理器中匹配 hơn 一种类型的事件。\n\n\n\n\n```scala\n import scala.swing._\n  import\
  \ scala.swing.event._\n\n  object ReactiveSwingApp extends SimpleSwingApplication\
  \ {\n    def top = new MainFrame {\n      title = \"Reactive Swing App\"\n     \
  \ val button = new Button {\n        text = \"Click me\"\n      }\n      val label\
  \ = new Label {\n        text = \"No button clicks registered\"\n      }\t\n   \
  \   contents = new BoxPanel(Orientation.Vertical) {\n        contents += button\n\
  \        contents += label\n        border = Swing.EmptyBorder(30, 30, 10, 30)\n\
  \      }\n      listenTo(button)\n      var nClicks = 0\n      reactions += {\n\
  \        case ButtonClicked(b) =>\n          nClicks += 1\n          label.text\
  \ = \"Number of button clicks: \" + nClicks\n      }\n    }\n  }\n```\n\n#### 列表\
  \ 34.3 - 实现响应式 Swing 应用程序。\n\n`reactions` 属性实现了一个集合，就像 `contents` 属性一样。某些组件带有预定义的反应。例如，`Frame`\
  \ 有有一个预定义的反应，当用户点击右上角的关闭按钮时，它会关闭。如果你通过使用 `+=` 将自己的反应添加到 `reactions` 属性来安装你自己的反应，那么你定义的反应将与标准反应一起被考虑。从概念上讲，安装在\
  \ `reactions` 中的处理器形成了一个栈。在当前示例中，如果顶层框架接收到事件，第一个尝试的处理器将是匹配 `ButtonClicked` 的那一个，因为它是为框架安装的最后一个处理器。如果收到的事件类型为\
  \ `ButtonClicked`，则将调用与模式关联的代码。在该代码执行完成后，系统将在事件栈中搜索其他可能适用的后续处理器。如果收到的事件不是 `ButtonClicked`\
  \ 类型，则事件将立即传播到其余已安装的处理器栈。你还可以使用 `-=` 运算符从 `reaction` 属性中移除处理器。\n\n列表 34.3 显示了完整的应用程序，包括反应。代码说明了\
  \ Scala Swing 框架中 GUI 应用程序的核心元素：应用程序由一个组件树组成，从顶层框架开始。代码中显示的组件是 `Frame`、`BoxPanel`、`Button`\
  \ 和 `Label`，但在 Swing 库中定义了许多其他类型的组件。每个组件都通过设置属性进行自定义。两个重要的属性是 `contents`（它固定了组件树中的子节点）以及\
  \ `reactions`（它决定了组件对事件的反应）。\n\n![image images/tempConverterGray112.png](img/tempConverterGray112.png)\n\
  \n#### 图 34.3 - 摄氏度和华华度之间的转换器。\n\n```scala\n import swing._\n  import event._\n\n\
  \  object TempConverter extends SimpleSwingApplication {\n    def top = new MainFrame\
  \ {\n      title = \"Celsius/Fahrenheit Converter\"\n      object celsius extends\
  \ TextField { columns = 5 }\n      object fahrenheit extends TextField { columns\
  \ = 5 }\n      contents = new FlowPanel {\n        contents += celsius\n       \
  \ contents += new Label(\"Celsius = \")\n        contents += fahrenheit\n      \
  \  contents += new Label(\"Fahrenheit\")\n        border = Swing.EmptyBorder(15,\
  \ 10, 10, 10)\n      }\n      listenTo(celsius, fahrenheit)\n      reactions +=\
  \ {\n        case EditDone(`fahrenheit`) =>\n          val f = fahrenheit.text.toInt\n\
  \          val c = (f - 32) * 5 / 9\n          celsius.text = c.toString\n     \
  \   case EditDone(`celsius`) =>\n          val c = celsius.text.toInt\n        \
  \  val f = c * 9 / 5 + 32\n          fahrenheit.text = f.toString\n      }\n   \
  \ }\n  }\n```\n\n#### 列表 34.4 - 温度转换器的实现。\n\n### 34.4 示例：摄氏度/华氏度转换器\n\n作为另一个示例，我们将编写一个在摄氏度和华氏度温度之间转换的\
  \ GUI 程序。程序的用户界面如图图 34.3 显示了实现此应用程序的完整代码。代码顶部的导入使用了简写：\n\n```\n import swing._\n\
  \  import event._\n```\n\n这实际上等同于之前使用的导入：\n\n```scala\n import scala.swing._\n \
  \ import scala.swing.event._\n```\n\n你之所以可以使用这种简写，是因为 Scala 中的包是嵌套的。因为包 `scala.swing`\
  \ 包含在包 `scala` 中，该包中的所有内容都会自动导入，因此你只需要写 `swing` 来引用该包。同样，包 `scala.swing.event` 作为子包\
  \ `event` 包含在包 `scala.swing` 中。由于你在第一个导入中导入了 `scala.swing` 中的所有内容，之后你只需用 `event`\
  \ 来引用事件包。\n\n`TempConverter` 中的两个组件 `celsius` 和 `fahrenheit` 是 `TextField` 类的对象。Swing\
  \ 中的 `TextField` 是一个允许你编辑单行文本的组件。它有一个默认宽度，由 `columns` 属性给出（以字符为单位）。\n\n`TempConverter`\
  \ 的 `contents` 被组合在一个面板中，该面板包含了两个文本字段以及两个标签。该面板是 `FlowPanel` 类型，这意味着它会根据框架宽度将其所有元素排列在一行或多行。\n\
  \n`TempConverter` 的 `reactions` 由一个包含两个 case 的处理器定义。每个 case 匹配两个文本字段之一的 `EditDone`\
  \ 事件。当用户编辑文本字段时，就会发布此类事件。注意这些模式的形式，它们对元素名称使用了反引号：\n\n```\ncase EditDone(`celsius`)\n\
  ```\n\n正如 15.2 节所述，反引号 `celsius` 确保模式仅在事件源为 `celsius` 对象时才匹配。如果你省略了反引号并只写 `case\
  \ EditDone(celsius)`，该模式将匹配所有 `EditDone` 事件。更改后的字段将被存储在模式变量 `celsius` 中。显然，这不是你想要的。或者，你可以使用大写字母定义两个\
  \ `TextField` 对象，*即* `Celsius` 和 `Fahrenheit`。在这种情况下，你可以直接匹配它们而无需使用反引号，例如 `case\
  \ EditDone(Celsius)`。\n\n`EditDone` 事件的两个操作将一种数量转换为另一种。每个操作都从读取被修改字段的内容并将其转换为 `Int`。然后它应用将一种温度转换为另一种温度的公式，并将结果作为字符串存回另一个文本字段中。\n\
  \n### 34.5 总结\n\n本章让你初步体验了 GUI 编程，使用了 Scala 对 Swing 框架的封装。它展示了如何组装 GUI 组件、如何自定义它们的属性以及如何处理事件。由于空间原因，我们只能讨论少数简单的组件。还有许多其他类型的组件。你可以通过查阅\
  \ `scala.swing` 包的 Scala 文档来了解它们。下一节将开发一个更复杂的 Swing 应用程序示例。\n\n\n\n\n\n有很多关于原始 Java\
  \ Swing 框架的教程，Scala 包装器正是基于此开发的.[[1]](#gui-programming.html_footnotemain34-1) Scala\
  \ 包装器与底层的 Swing 类相似，但尽可能简化了概念并使其更加统一。这种简化大量地利用了 Scala 语言的特性。例如，Scala 对属性的模拟和操作符重载允许使用赋值和\
  \ `+=` 操作方便地定义属性。其“万物皆对象”的哲学使得继承 GUI 程序的 `main` 方法成为可能。因此，该方法可以对用户应用程序隐藏，包括随之而来的设置样板代码。最后，也是重要的一点是，Scala\
  \ 的一等函数和模式匹配使得将事件处理建模为响应组件属性成为可能，这极大地简化了应用程序开发者的工作。\n\n***\n\n#### 第 34 章脚注：\n\n\
