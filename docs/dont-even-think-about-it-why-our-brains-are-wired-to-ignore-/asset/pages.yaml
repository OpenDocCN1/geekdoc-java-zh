  md: '# A Note on The Author


    George Marshall is the co-founder of the Climate Outreach and Information Network,
    the first British nonprofit organization to specialize in public communication
    around climate change. COIN''s international reputation is built on its commitment
    to reaching new audiences, including its pioneering communications work with trade
    unions, human rights organizations, and political conservatives.


    Over the past twenty-five years George has worked at all levels of environmental
    and social rights campaigning; from direct action protests to governmental policy
    consultancies, with senior positions at Greenpeace USA and the Rainforest Foundation
    in between.


    He is also the author of Carbon Detox (www.carbondetox.org), a slow-selling book
    offering “fresh ways to think about personal action to climate change,” and he
    blogs every so often at www.climatedenial.org. He lives in mid-Wales with his
    family and several thousand comic books.'
