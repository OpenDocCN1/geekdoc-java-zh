  md: '# Familiar Yet Unimaginable


    # Why Climate Change Does Not Feel

    Dangerous


    Five years ago, when I was living in Oxford, England, a cell phone company applied
    for planning permission to install a cell phone tower on the side of the local
    pub. The area was full of liberal professionals of the kind that congregate in
    university cities. When prompted, they would agree unanimously that climate change
    was a serious problem that someone really should do something about . . . sometime.
    Otherwise they really didn''t think about it.


    And yet the threat of the cell phone tower galvanized them into immediate personal
    action. Within a week of the application, two hundred people gathered in the local
    school hall to express their resistance to the tower, which, they said, was going
    to spread microwave radiation across the school playground. Some were determined
    to lay their bodies down in front of the installation van, if necessary.


    There are some interesting similarities between the issues of climate change and
    cell phone towers. Both threaten uncertain impacts that are drawn out long into
    the future. And in both cases we contribute, through our consumption choices,
    to the problem we decry. My neighbors in the audience that night all had cell
    phones in their pockets. In retrospect,'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'regret not having called them up during the meeting, just to see what would
    happen.


    However, there is one important difference: Climate change poses a vast and unparalleled
    threat. Cell phone towers, though, are virtually harmless. Applying even the most
    cautious estimates, it would take more than seventy thousand of these towers to
    generate enough radiation to cause any health problems. This experience found
    me asking why highly educated people would become agitated about an intangible
    and unproven risk like cell phone radiation and yet be oblivious to the equally
    intangible far better-proven risk of climate change.


    Paul Slovic, professor of psychology at the University of Oregon, is well positioned
    to answer this question. Slovic is the world''s leading expert on the social amplification
    of risk. He is also a modest, soft-spoken man who might be shy of such accolades.
    He is also, though, impossible to find a single research document on the topic
    that is not peppered with references to his work.


    Slovic faced an uphill struggle to persuade scientists that our perception of
    risk is socially formed and to overcome their prejudice that, in words, social
    science was soft and squishy. It was the issue of radiation—and in particular
    the question why people were so much more concerned about nuclear power than they
    were the dangers of medical X-rays—that launched his career in the 1970s.


    Slovic identified two main drivers of risk perception: a sense of powerlessness
    in involuntary and catastrophic impacts, which he called dread risk, and an anxiety
    that comes from the uncertainty of new and unforeseen dangers, which he called
    unknown risk. Dread risk is reinforced by being intergenerational and irreversible.
    Unknown risk is emphasized by being invisible and unprecedented. Radiation is
    so feared because it involves both types.


    Through social testing, Slovic mapped a wide range of threats against these criteria
    for dread and unknown risk. Chemicals, food additives, and microwave ovens score
    highly for their unknown risk. Nuclear weapons and nerve gas accidents score highly
    for their dread risk. The more mundane dangers of bicycle accidents, indoor smoke,
    alcohol, and home swimming pools have low scores by both criteria though they
    are all major sources of fatalities.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'Slovic’s research explains all too well why my friends and neighbors could
    become agitated about a cell phone tower. It contained a near-perfect mixture
    of threats: a new technology, dread fears of radiation, a threat to our children
    as they played innocently in their school playground. It also had exceptional
    proximity: visible, local, immediate, and with a clearly defined deadline. Finally,
    the coup de grâce: It had an external enemy, the faceless T-Mobile phone corporation,
    which had, for its own nefarious reasons, disguised this dangerous radiation-emitting
    tower as a flagpole.


    So I ask Slovic when climate change would sit sit on his scales and why it is
    not capable of raising the same level of concern. After all, it is also catastrophic,
    irreversible, new, related to technology, threatening to children, and it makes
    people feel powerless. Surely, I suggest, this is a royal flush of both dead and
    unknown risks.


    Slovic is not persuaded. He fully accepts that climate change is a massive problem.
    Indeed, he says he would work on himself but he is now specializing in genocide
    and “only works on one impossible problem from hell at a time.


    However, he says, it does not feel threatening, and that is the critical distinction.
    People’s resistance to nuclear power, toxic chemicals, or vaccination tends to
    emerge at the point when something is about to change: when they take their child
    for a vaccination or when a nuclear plant (or cell phone tower) may be placed
    in their neighborhood.


    But once things are accepted into its status quo and assumed to be part of normal
    life, it requires a higher level of threat to have them removed. People might
    well mobilize against a new energy technology that causes climate change, but
    not against the cars, planes, and power plants that are already woven into the
    fabric of their lives.


    Slovic argues that extreme weather, even highly visible ones as Hurricanes Katrina
    and Sandy, are also part of our accepted wave of life—our status quo—in ways that
    can lead us to accept rather than resist them. He suggests that extreme events
    seem familiar, and we are accustomed—in the developed world at any rate—to regard
    them as manageable. “Even when they do happen to us,” he says, “the storm goes
    over. You look out the window, and hey, it’s a beautiful day.” As I found in'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Bastrop suggests New Jersey, people are initially traumatized but dust themselves
    off and focus on reconstruction and moving forward.


    In language theory, the term “false friends” recognizes the trap posed by words
    that look and sound the same but have developed entirely different meanings—as
    anyone shopping for clothes on the other side of the Atlantic will find when they
    ask for pants, knickers, vests, or jumpers. Climate change has plenty of linguistic
    false friends and, as I will show, there is endless potential for misunderstanding
    scientific terms when they are used in a wider context. But the weather is also
    a kind of false friend: It looks and feels familiar, and we have a wide range
    of available experience to draw on that can mislead us.


    Paul Slovic suggests that the third major problem is that climate change is not
    readily imaginable. “With threats of graphic imaginability, such as terrorism
    after the 9/11 attacks, you lose all sense of proportion and respond with high
    alarm to low probabilities. The availability bias that draws on recent experience
    keeps the threat alive, and the uncertainty of when the next attack might come
    does not diminish that fear; it amplifies it.”


    But because climate change does not have the same stigma, and extreme weather
    events have a degree of familiarity, the uncertainty of its impacts do not instill
    dread but rather, Slovic says, “give you the leeway to believe what you want to
    believe.”


    Believe what you want to believe? This is a telling phrase. Slovic is saying that
    even though it involves so many of the characteristics of dread and unknown risk,
    climate change does not feel frightening unless you actively choose to see it
    that. If you are already inclined (by your values, politics, or social group)
    to see climate change as dangerous, then it looks really dangerous. If you are
    not inclined that way, then it looks exaggerated. Once again, the perception of
    climate change is being determined by the social lenses you see it through, and
    once again, there is a powerful feedback that tends to pull people apart.'
