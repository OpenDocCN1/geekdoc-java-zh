    experiment in testing different presentation styles and narratives.


    The vote showed that before the debate, the advocates of mainstream science were
    comfortably in the lead. By the end of the debate, they had lost a third of their
    support. They had the best-qualified team and a position supported by every scientific
    institution and government in the world. And somehow they lost.


