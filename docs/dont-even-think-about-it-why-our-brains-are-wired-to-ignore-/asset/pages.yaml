  md: '# The Power of the Mob


    # How Bullies Hide in the Crowd


    People not only identify strongly with their own social group but also believe
    that it has a distinctive identity that makes it superior to other groups. Self-categorization
    theory recognizes that there are two processes at work. First, we seek to establish
    closeness and similarity with people with whom we feel an identity and kinship:
    our in-group. Then we seek to establish our differences from the people who are
    not like us: the out-groups. Our attitudes and behaviors are shaped by the people
    around us who we want to be like as well as the people beyond us who we want to
    be unlike.


    The effect of this on environmental attitudes was shown in a clever experiment
    in Britain. When participants compared themselves with people in Sweden—who are
    generally considered to be highly environmentally aware—they showed less interest
    in energy conservation. In contrast, when they compared themselves with Americans,
    who regarded as energy wasters (sorry about this—we are talking about cultural
    stereotypes), they suddenly found a zeal for all things green. In other words,
    people in the in-group sought to move in the opposite direction to the out-group.
