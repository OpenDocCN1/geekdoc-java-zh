  md: '# 21


    # # Powerful Words


    # ## How the Words We Use Affect the Way We Feel


    Words are powerful. Every time a word is used, it brings into play a cluster of
    interlocking frames and associations. Sarah Palin’s offhand phrase “death panels”
    generated such a powerful frame that it nearly derailed Obama’s healthcare plan.
    Progressives play this game too, and the insertion of their own language, such
    as gay, same-sex, and African American, into their opponents’ vocabulary is a
    lasting campaign achievement.


    George Lakoff, the U.C. Berkeley cognitive linguist, argues that the goal of good
    communications is to use “the words that trigger your frames and inhibit your
    opponents’ frames.” Once words become ingrained in common usage, they carry around
    their frames.


    An example that Lakoff often gives of political refram is the phrase “tax relief,”
    which replaced “tax cuts” and was inserted, quite deliberately, into the early
    speeches of George W. Bush. The word “relief” activates the frame that taxation
    is an affliction, the person who believes that affliction is a hero.


    As a result, “tax” has become a deeply problematic word for many conservatives.
    In one experiment, Republicans were five times more willing to pay a 2 percent
    climate change surcharge on an airline ticket when it was'
