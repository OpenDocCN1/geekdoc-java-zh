  md: 'Environmentalism has its own unfulfilled prophecies. The Club of Rome’s Limits
    to Growth report, which became a founding text of modern environmentalism, predicted
    imminent global collapse from “overshoot.” It included, even in 1972, two pages
    dedicated to climate change. It sold an astonishing twelve million copies and
    prompted a torrent of pessimistic prose. Time magazine’s story on the report,
    headlined “The Worst Is Yet to Be,” told us that “in Los Angeles a few survivors
    of a plague desperately till freeway center strips, backyards and outlying fields,
    hoping to raise a subsistence crop.


    And the warnings come. There is mad cow disease, bird flu, swine Y2K, Iraqi weapons
    of mass destruction, terrorist scares that never eventuate, and various health,
    nutritional, and economic “time bombs.” All of these are entirely plausible and
    many are as valid as ever. It is just that they never seem to happen when anyone
    says they will, and people have only a limited capacity for staying on red alert.


    The commonly used story for failed prophecies, which has appeared regularly in
    the climate denier since the early 1990s, is the fable of Chicken Little, who,
    after being hit on the head by a falling acorn, persuades his fellow animals that
    the sky is falling. The crafty wolf exploits these fears and persuades the gullible
    animals to find safety in his cave, where he then eats them.


    This is actually an ancient story that first appeared in Buddhist scriptures some
    2500 years ago. It has been constantly reinvented with updated moral conclusions
    to fit the values of society that: the evils of panic (India), the need to find
    your own evidence (Tibet), individual stupidity (Europe), and in 1943 Disney cartoon,
    the dangers of wartime rumors. In all of its manifestations, though, it is a marvelous
    display of the social norm at work, and how, repetition between peers, the lie
    can gain social proof. It is, then, a story that is highly relevant to climate
    change.


    But the more appropriate metaphor for failed climate change predictions is Aesop’s
    fable of the boy who cried wolf. A boy is asked to guard over sheep repeatedly
    cries that the wolves are coming. After he has been found to be lying three times
    in a row, no one pays any further attention. Then the wolves really do come. Aesop
    says that the moral is, don’t lie, because no one will believe you when you are
    telling the truth.'
