    seek, in their own jargon “lunatic-proof” their lives and protect their families,
    and inevitably, this will determine what they study.


    Ignorance is also generated by the academic process itself. As academics become
    ever more specialized and bury deeper into their silos, it becomes harder for
    them to acquire more generalized knowledge. There is a knowledge-ignorance paradox
    that the ever-increasing growth in knowledge leads to a simultaneous growth in
    what is not known.


    By reckoning, there is a great deal that is not known about climate change. As
    noted throughout this book, the people who take ownership of climate change consistently
    attempt to shape it in their own image, defined by their own discipline. Climate
    change, though, requires a much more creative and flexible approach that also
    considers what is not known or not said. It is not surprising that the vast majority
    of the specialists I have interviewed for this book are creative pioneers who
    resist easy categories and explore the boundaries between disciplines.'
