  md: 'Fred Luskin


    I found talking with Hunter and other evangelicals invigorating aside the immediate
    context of evangelical Christianity—and here I will openly admit that I respect
    do not share their religious faith—that I outline a vocabulary and methodology
    for overcoming our cognitive obstacles that is absent from discussions around
    climate change.


    In this book I have shown that scientific data, although undoubtedly for alerting
    our rational brain to the existence of a threat, does not galvanize our emotional
    brain into action. Indeed, climate change contains enough inherent uncertainty
    and distance that we can quite deliberately keep what we know contained and detached
    from what we believe and what we do.


    Learning from religions, I suggest that we could find a different approach to
    climate change that recognizes the importance of conviction: the point at which
    the rational crosses into the emotional, the head into the heart, and we can say,
    “I’ve heard enough, I’ve seen enough—now I am convinced.


    Applied to climate change we could accept that this is a process of steadily growing
    awareness, though it may also progress through personal revelation or moments
    of informed choice and public commitment. Conviction need not remove questioning
    and doubt—and it is essential that climate science is never above challenge—and
    these uncertainties, anxieties, and fears need to be openly recognized within
    a supportive community of shared conviction.'
