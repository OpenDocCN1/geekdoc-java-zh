  md: '# The Jury of Our Peers


    # How We Follow the People Around Us


    In the early hours of the morning of March 13, 1964, Kitty Genovese was assaulted
    and then stabbed repeatedly in a densely populated residential area of Queens,
    New York. Thirty-eight people (one of them ironically named Joseph Fink) said
    they had heard her screams and done nothing to intervene. One man merely shouted,
    “Let that girl alone,” out of his window before going back to bed. Another pulled
    a chair up to the window and turned out the light to see what was happening. No
    one thought to call the police until it was too late.


    Rather than being a sad testament of a broken society—as the newspapers of the
    day suggested—this lack of response actually revealed the strength of social conformity.
    They say that no one else was taking any action and decided that it was in their
    best interest to keep out of a potentially dangerous situation. Knowing that others
    heard the cries, they diffused responsibility, assuming quite wrongly, as it turned
    out, that someone else had called the police.


    The tragic Genovese incident launched a rich and still expanding body of research
    into the importance of social cues in defining what issues people respond to and
    what they ignore. It is a fascinating feature of this bystander effect—as it was
    subsequently named—that the more people we assume know about a problem, the more
    likely we are to ignore our own'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'judgment and watch the behavior of others to identify an appropriate response.


    A string of experiments confirmed the power of the bystander effect. In one particularly
    entertaining experiment, an actor faked having a seizure over the laboratory intercom.
    The last words heard from him were “I really—er—use some help, so if somebody
    would—er—give me a little help us er... . I''m gonna die,” followed by a choking
    noise and silence. Of fifteen participants in the experiment, six never got out
    of their boots, and five others only came out after the “seizure victim” apparently
    choked.


    Of course, you can only run kinds of experiments for a few years before your subjects
    start to get wise to the trick, especially if they are psychology students. Years
    later, when a subject in a psychology experiment had a real epileptic fit, the
    other participants were convinced that it was being faked for the experiment and
    refused to get off their chairs.


    Climate change is a global problem that requires a collective response and is
    especially prone to this bystander effect. When we become aware of the issue,
    we scan the people around us for social cues to guide our response: looking for
    evidence of what they do, what they say, and, conversely, what they do not and
    do not say. These cues can also be codified into rules that define the behaviors
    that are expected or are inappropriate—the social norm. If we see that other people
    are alarmed or taking action, we follow that cue. If they are indifferent or inactive,
    we will follow that cue.


    This social conformity is not some preference or choice. This is a strong behavioral
    instinct that is built into our core psychology, and most of the time we are not
    even aware that it is operating. It originated as a defense mechanism during our
    evolutionary development, when our survival depended entirely on the protection
    and security of our social group. Under such conditions, being out of sync with
    the people around carried a potentially life-threatening danger of ostracism or
    abandonment.


    There are, therefore, real and serious risks involved with holding views that
    are out of step with your social group and your brain is wired to give them greater
    weight than other risks, even those that directly threaten you. In experiments
