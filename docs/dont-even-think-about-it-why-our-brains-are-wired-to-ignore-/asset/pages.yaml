  md: 'It was not long before governments started picking up on the theme. In the
    United States, lists of simple actions to prevent climate change were promoted
    by the Environmental Protection Agency, the Federal Highway Administration, state
    programs such as Cool California, and school curricula. The New York Times reported
    that kids, fired up on school ecopro, had become “the little conscience sitting
    in the back seat,” lecturing their parents about their behaviors and chanting,
    “Every day is Earth Day.”


    The unlikely leaders in this field were the thoroughly ungreen governments of
    Canada, Ireland, and Australia. In the early 2000s all three were intoxicated
    by an economic boom built on new roads, airports, and fossil fuel development.
    They duly ripped up their international commitments to the Kyoto Protocol or,
    in the case of Australia, refused to ratify it at all. And yet, strangely, all
    three countries launched high-profile national campaigns to empower their citizens
    to take personal action against the global threat of climate change.


    In Ireland, the Power of One campaign promoted the “breathtakingly simple idea
    that each individual can “make a difference.” In Australia, a twenty-million-dollar
    Clever Climate campaign targeted every household in the country. The Canadian
    government poured forty-five million dollars into national television ads for
    its One-Tonne Challenge, in which the comedian Rick Mercer harangued ordinary
    citizens to reduce their carbon dioxide emissions, shouting, “C’mon! We’re Canadian!
    We’re up for a challenge!


    On the face of it, these small steps appeared to be a method to avoid the political
    partisanship that bedevils climate change. Political action is messy and participatory.
    This seemed much more benign—speaking to values of national unity enabling consumers
    to make well-informed decisions. We will fight it in the malls, we will fight
    it in the catalogs.


    But that does not mean that the governments focused on personal responsibility,
    they were not being political: They were extremely political and framing climate
    change within a wider neo-liberal ideology that promotes private property rights
    and free markets. As the left-wing sociologist Ulrich Beck said, “We are all now
    moral entrepreneurs laden with personal responsibility but no access to the actual
    decisions.”'
