  md: 'psychology, Leda Cosmides and John Tooby, like to say that “our modern skulls
    house a Stone Age mind,” which developed to address the specific threats in what
    they call the “environment of evolutionary adaptedness.”


    In this primeval environment, the main avoidable risks were in our immediate surroundings,
    and it was this that led us to give such a high priority to proximity and certainty
    in our judgment of risk. This also makes us innately conservative and defensive
    of our current circumstances—what cognitive psychologists call our status quo.
    After all, survival prospects were poor for an animal that is not suspicious of
    novelty.


    Cosmides and Tooby describe the brain as being a “Swiss Army knife” containing
    specialized tools designed to deal with different tasks. Thus, they argue, we
    are relatively poor at dealing with large issues (like climate change) and can
    engage with them only by breaking them down into individual-oriented tasks.


    Like a Swiss Army knife, the brain also contains things that you never need or
    even know what they are. Evolutionary psychologists call these “expectations”:
    behaviors that have been selected in the past for completely different reasons
    and become co-opted into their present role following a change in environmental
    circumstances.


    Without entering into the intense debate surrounding exaptation, suffice to say
    that it contains a highly relevant core concept: that we apply to climate change
    the psychological tools we have evolved to cope with previous challenges, and
    that these may turn out to be inappropriate for this new threat. The in-group
    loyalties and defensiveness that evolved to support small hunter-gatherer groups
    may be an obstacle when dealing with a universal threat. As I suggest, our avoidance
    of the issue of climate change may be driven by still-deeper mechanisms evolved
    to cope with our fears of death.


    But of greatest relevance to our decision around climate change is the discovery
    that this long evolutionary journey has led us to develop two distinct information
    processing systems. One is analytical, logical, and encodes reality in abstract
    symbols, words, and numbers. The other is driven by emotions (specifically fear
    and anxiety), images, intuition, and experience. Language operates in both processes,
    but in the analytical system, it is used to describe and define; in the emotional
    system, it is used to communicate meaning, especially in the form of stories.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'Brain scanning has confirmed that these systems are built into the physical
    architecture of the brain—the former in the cortex and posterior parietal cortex,
    the latter in the amygdala at the base of the brain. The neuroscientist Joseph
    LeDoux argues in his book The Emotional Brain that, as our analytic systems evolved,
    the amygdala allowed to maintain its dominance in decision making because of its
    ability to rapidly assess threats. So, while the analytic system is slow and deliberate,
    rationally weighing the evidence and probabilities, the emotional system is automatic,
    impulsive, and quick to apply mental shortcuts that it can quickly reach conclusions.


    There has been a very strong interest in these findings in recent years and many
    attempts to name them. Seymour Epstein, who first identified them as two parallel
    systems, called them analytic processing and experiential processing. Others call
    them enlightenment and real reason, or the reflective system and the automatic
    system, or System 1 and System 2. I find it easy to call them the rational brain
    and the emotional brain. These are not ideal names but they are easy to follow.


    One of reasons there have been so many different attempts to name them is that
    the systems are not separate and isolated but rather in constant communication.
    Attempting to capture this relationship, Jonathan Haidt, a psychologist at New
    York University, hit on the image of an elephant and a rider. The rational rider
    does his best to steer the emotional elephant. He appears to be in control, though
    reality, a six-ton elephant is going to have the last say.


    It is a nice image, and the second of many metaphorical elephants to appear in
    this book. However, this, too, is not entirely satisfactory because it underplays
    the communication between the two. The research shows that our rational rider
    will want to convince our emotional elephant and will deliberately shape arguments
    into stories and images that will appeal to the elephant. The elephant is no dullard
    either. It is extremely adept at creating elaborate intellectual rationalizations
    for the rider to let go on a path it had already decided to take. The image shows
    the rider sitting under a little tent, pulling the reins, but the reality is more
    like Tarzan riding bareback and talking elephant (perhaps explaining why Hollywood
    thinks that the African jungle is full of Asian bananas).'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'Our perception of risk is dominated by our emotional brain. It favors proximity,
    draws on personal experience, and deals with images and stories that speak to
    existing values. As I will show later, threats that conjure strong images or that
    are communicated in personal stories have disproportional sway over our decision
    making.


    However, because the emotional brain is poorly suited to dealing with uncertain
    long-term threats of the kind that constitute climate change, the rational brain
    sometimes actively intervenes, with its abstract tools of planning and forward
    thinking. Indeed, experiments show that people deliberately enhance this process
    by making an issue more distant in order to see it in rational perspective and
    then developing the short-term goals that give it emotional proximity. It is like
    a little dance—moving far away to admire your partner and then moving in close
    enough to kiss.


    And this is exactly what we do with climate change, both personally and culturally.
    The theories, graphs, projects, and data speak almost entirely to the rational
    brain. That helps us to evaluate the evidence and, for most people, to recognize
    that this is a major problem. But it does not spur us to action. The divide between
    the rational brain and the emotional brain is embedded in the historical boundaries
    between science, the arts, and religion, and it is a particular risk for an issue
    that originates strongly in just one cultural domain—as climate change does with
    science—that finds it hard to engage our entire cognition. The view held by every
    specialist I speak to is that we still not found a way to effectively engage our
    emotional brains in climate change. Even if the rider is fascinated by the article
    in *Scientific American*, the elephant wandered off looking for a banana.


    So, advocates for action on climate change have to do everything they can speak
    to both. They need to maintain enough of the data and evidence to satisfy the
    rational brain that they are a credible source. They need to translate that data
    into a form that will engage and motivate the emotional brain using the tools
    of immediacy, proximity, social meaning, stories, and metaphors that draw on experience.
    Every piece of climate change communication from the National Academy of Sciences
    to a direct-action protest outside a power station is an experiment in the alchemy
    of turning base data into emotional gold.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Those opposing action are playing the same game but working backward. They
    begin with the arguments that can appeal to the emotional brain based around the
    values, concerns, and emotional triggers of their audiences. They then seek the
    data and evidence to support these arguments, because, like the advocates, they
    need to satisfy both the emotional and the rational brains of the people they
    want to convince. Of course, they don''t see it like this. They are convinced
    that they have built their emotional argument on the back of a rational evaluation
    of the data. And so it seems to them.


    The people in between are not passive in this process either. They, too, are deliberately
    making a calculation about how they wish to interpret these arguments, knowing
    very well that if their emotional brain becomes too involved, they are likely
    to feel anxious and worried. As I argue later, they tend to adopt a position of
    wait and see: Their rational brain is sufficiently aware that they know there
    is a problem; their emotional brain is sufficiently engaged that it is looking
    out for social cues about how they should respond. And both of their brains are
    sufficiently detached that they do not have to deal with the problem unless actively
    compelled to do so.'
