    organizations flew so often for her work that she could take regular long-distance
    holidays using her air miles with an automatic upgrade to business class.


    All of them felt uncomfortable discussing their leisure flying, and I have found
    that there is a norm of silence—a meta-silence even—around this topic. Nonetheless,
    when prompted, all of them could present complex narratives to justify their own
    behaviors, often containing a moral license or deferring to the social norm among
    their fellow middle-class professionals. They argued that they would gladly stop
