  md: 'Worse still, these campaigns did not actually work. People were not up for
    the challenge at all and were certainly keeping well away from that virtuous escalator.
    Independent evaluations, now buried deep in the archives, found that the Power
    of One campaign was “capturing those who were already converted” and the One-Tonne
    Challenge had achieved no change at all in overall energy use. In Australia, people
    became even less climate clever and a few people considered climate change to
    be their most important issue after the campaign than they had before.


    No one paid much attention to these brutal evaluations because these campaigns
    had never really been concerned with reducing emissions. In reality, they were
    a narrative gambit to define climate change as a problem that lay at the very
    furthest end of the tailpipe in the purchasing decisions of the individual. Behind
    their uplifting slogans, and their appeal to national unity, what they were really
    saying was “climate change is your fault.”


    And here lies the problem. As soon as one creates responsibility, one creates
    blame. Blame creates resentment, and all of responsibility in the home makes that
    resentment very personal. What of us fully appreciated at the time was how these
    anodyne messages would be mobilized to fuel people’s sectarian prejudices.


    Conservatives in particular loathed what to do by governments and liberal environmentalists.
    In one revealing experiment by a team at the University of Pennsylvania, many
    conservatives refused to buy a low energy bulb the packaging carried a sticker
    reading “protect the environment.” At my Texas Party meeting, Craig called how
    he challenged an environmentalist by saying, “You’re on this computer and you’re
    using electricity from the coal that you claim out of the ground by the man you
    are telling he isn’t allowed to eat meat.” He received the loudest cheer of the
    night.


    There is a deep irony in this. Research by the psychologist Jonathan Haidt into
    moral foundations of different worldviews found that it is conservatives who have
    the greatest moral emphasis on personal responsibility and that it is liberal
    environmentalists, with their highly individualized values, who are actually the
    group suited to working together for a shared goal.


    It was not just conservatives—left-wing trade unionists were just as repelled.
    Running focus groups with activists from one of Britain’s largest trade unions,
    I found that few things irritated them more than the phrase'
