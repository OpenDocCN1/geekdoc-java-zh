  md: 'If words are frames and stories are the medium, then the person who communicates
    them becomes the most important and potentially the weakest link in the chain
    between scientific information and personal conviction. This sense of trustworthiness
    is a powerful bias and is entirely driven by the emotional brain and our intuitive
    ability to separate friends from foes. We ask ourselves: “Is this someone I can
    trust on this issue?” “Is he or she honest and knowledgeable?” “Does this person
    appear to share my concerns and worldview?” and “Is this person approaching me
    with openness and friendliness?”


    This is why, even though three-quarters of Americans still trust climate scientists
    as a source of information on global warming, they are nearly inclined to trust
    television weather forecasters who are greatly less qualified as scientists but
    have a far more friendly, familiar, and approachable public profile. Unfortunately
    they also have a disconcertingly high level of climate denial. In a 2010 survey,
    only half of television weathercasters surveyed believed that climate change is
    occurring and more than a quarter believed it is a “scam.”


    So what qualities are we looking for in a communicator who can trust? Integrity
    appears to be the key, according to the political scientist Arthur Lupia. This,
    he argues, is directly related to our perception of what the communicator receives
    or risks from the communication. Thus we tend not to trust a communicator who
    is self-serving or unaccountable compared to someone who has taken a personal
    risk or would face penalties if he or she lied.


    People who confound our expectations also become correspondingly more persuasive,
    especially when they cross sides, which we perceive as an act of great social
