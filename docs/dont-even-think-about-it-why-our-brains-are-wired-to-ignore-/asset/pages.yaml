    # Why Disaster Victims Do Not Want to Talk About Climate Change


    Wendy Escobar remembers feeling slightly nervous as she set off with her children
    to pick up groceries and saw the distant spiral of smoke on the horizon. But she
    says never, ever, could have anticipated the speed or intensity of the disaster
    that followed. By the time she returned an hour later, the police had erected
    barricades across Texas State Highway 21. She had nothing but the clothes on her
    back; her daughter, she recalls, was still in her slippers. Two weeks later, when
    the road was finally reopened, the only family possession she could find in the
    ashes of the house was her great-grandfather’s Purple Heart medal. It was melted
    almost beyond recognition.


    The Bastrop wildfire of October 2011 was exceptional by any standards. Supercharged
    by thirty-mile-per-hour winds during a period with the lowest annual rainfall
    ever recorded, it killed two people, burned fifty-four miles of forest, and could
    be seen from outer space. It destroyed 1,600 houses; ten times more than any previous
    wildfire in Texan history.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'What was curious, though, was that, when I visited Bastrop a year later not
    one person, in a string of formal interviews, could recall for me a single conversation
    in which they had discussed climate change as a potential cause of the drought
    or the fire.


    As one would expect in rural Texas, many people were unconvinced about the issue:
    many people, but not all. Wendy Escobar, for example, laughed about “us being
    rednecks out here,” is an intelligent and thoughtful woman who has seen the changes
    in the weather and concluded that there is definitely something going on that
    science can explain. The mayor of Bastrop, Terry Orr, accepted the science that
    the climate is changing, though he was understandably wary of an issue that can
    be politically divisive. Neither could recall it ever being discussed.


    Cyndi Wright


    If climate change had a direct impact on us? This is surprising, that a journalist
    could not see any possible connection to the wildfire that had burned down her
    own house and an issue that scientists had, for twenty years, been warning would
    lead to increasing droughts and wildfires. Even Texas state climatologist John
    Nielsen-Gammon, who chose his words carefully, suggested the link and regarded
    the combination of extreme drought and record-breaking temperatures that fueled
    the fires as “off the charts."


    Of course no scientist will ever be able to say with total certainty that any
    single weather event is caused by climate change. Why does this prevent all discussion?
    What other topic is shut down because of a lack of total scientific certainty?
    Newspapers usually engage debate, often uninformed. Conversations are fueled by
    hunch and rumor. As I explore later, the lack of certainty is invariably an excuse
    for silence rather than the cause of it.


    Nor were the people of Bastrop short of other things to say about the fire, including
    some highly conjectural opinions about who started it. Above all though, what
    they really wanted to share with me was their pride in their'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'community and their capacity to overcome challenges. They spoke of the many
    acts of kindness, altruism, and generosity from strangers. Wendy Escobar told
    me how a customer at her cousin''s hair salon in Longview sent her a thousand-dollar
    check in the mail. “The coolest thing to come out of the fire,” she said, “was
    finding out how many people really cared, and how it''s made people pull together
