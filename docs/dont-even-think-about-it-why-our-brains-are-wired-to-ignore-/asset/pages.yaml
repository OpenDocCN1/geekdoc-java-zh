    Bob Inglis, former Republican representative for South Carolina, asks how we can
    enable this kind of life-changing conversion. Drawing on the church experience,
    he formulates this way to me: “You go to them with a credible messenger and affirm
    their truth. And you help them to see that this fits within their story and you
    honor them by being there with them. You then get conversions.


    Conversions? Affirm? Witness? Epiphany? These words never appear in the discussions
    of how we mobilize action on climate change. Acceptance of climate change is assumed
    to be transferred, as though osmosis, by reading a book or watching a documentary.
    When it is acquired, it is assumed, like the data that it is based on, to be solid
