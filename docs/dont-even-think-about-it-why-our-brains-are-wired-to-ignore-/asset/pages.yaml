  md: 'For example, it is extremely fortunate that climate change is occurring now,
    during the longest prolonged peace in the developed world since the emergence
    of the modern nation state, and at a time when we have the combination of technology,
    wealth, education, and international cooperation that might be able to respond
    to it. This is not perfect timing, but it is just about as good as it could be.
    What is more, the countries causing climate change will also be impacted by it.
    While this clearly has its own misfortune, one positive result is the increased
    likelihood of action by these countries. If that self-interest did not exist—if,
    the extreme impacts were concentrated entirely in Africa—I fear that developed
    countries would do absolutely nothing.


    Climate change is very difficult, but not perfectly difficult. In theory we can
    deal with this—it is all a matter of degree. Humans are smart, but are we smart
    enough? We are cooperative, but are we cooperative enough? Those who understand
    and get passionate about this issue are numerous, but are they numerous enough?
    We have a little time, but it is enough.


    If there are any grounds at all regarding climate change as a “perfect” cognitive
    challenge, it is not because of its specific qualities but because it is so multivalent—that
    is to say, it is so open to multiple meanings and interpretations. It provides
    us with none of the defining qualities that would give it a clear identity—no
    deadlines, no geographic location, no single cause, solution, or enemy. Our brains,
    constantly scanning for the cues we need to process and categorize information,
    find none, and we are left grasping at air. But we still need these cues—we cannot
    deal with it otherwise—and so we create and impose our own. This is a dangerous
    situation, leaving climate change open for miscategorization, confirmation bias,
    and the opportunity for us to “believe what we want to believe.”


    This is the reason, when asked why we are taking so little action on climate change,
    that everyone seems to shape the problem in his or her image. Climate scientists
    say that people don''t understand the science. Environmental campaigners say that
    the political process is corrupted by oil companies. Oil companies say that the
