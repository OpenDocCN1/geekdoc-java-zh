  md: '# # References, Sources, and Further Reading


    A full list of line-by-line references and sources is posted on the book website,
    www.climateconviction.org. There is a lively and continuing discussion and the
    references are regularly updated with new comments and clarifications.


    From more than seven hundred sources, I have chosen a short selection of those
    I have found most useful and stimulating. Those indicated with a * can be found
    and downloaded on the Internet. I have shortened some of the titles for ease of
    searching.


    # Overviews on the Psychology of Climate Change


    Clive Hamilton has given years of thought to the issues I cover and his book,
    Requiem for a Species (2010, Routledge), was a major inspiration. His insights
    can also be found online in his 2009 paper with Tim Kasser, *“Psychological Adaptation
    to the Threats and Stresses of a Four Degree World.


    There are two major online summaries of climate change psychology. *The Psychology
    of Climate Change Communication: A Guide by Sabine Marx is a very nicely produced
    overview. *Psychology and Global Climate Change, produced by an expert task force
    at the American Psychological Association.


    Kari Norgaard''s pioneering analysis of climate denial and silence in her book
    Living in Denial (2011, MIT Press) is very readable. She summarizes'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'her ideas in an online report for the World Bank, *Cognitive and Behavioral
    Challenges in Responding to Climate Change.*


    Another innovative analysis of the underlying psychology of climate change—this
    time from the psychoanalytic tradition—comes in a selection of essays, some highly
    insightful, in Engaging with Climate Change: Psychoanalytic and Interdisciplinary
    Perspectives, edited by Sally Weintrobe (2012, Routledge).


    On cognitive psychology and decision making I strongly recommend Daniel Kahneman’s
    *Thinking, Fast and Slow* (2011, Penguin). Eviatar Zerubel’s *The Elephant in
    the Room* (2007, OUP) is an excellent introduction to thinking about socially
    constructed silence. I have also been strongly influenced by the writings of Jonathan
    Haidt and Daniel Gilbert.


    A summary of the research on narrative formation and the resistance of deeply
    held beliefs to be found in Stefan Lewandowski and colleagues’ little-known paper
    *Misinformation and Its Correction: Continued Influence and Successful Debasing.*
    Despite its intimidating title, this is actually a very accessible and fascinating
    study. Dan Kahan’s research and blog posts can be found on www.culturalcognition.net
    and a good starting point is for Nature, *Why We Are Poles Apart on Climate Change.*


    In *Why We Disagree About Climate Change* (CUP, 2009) Mike Hulme discusses the
    “wicked” influence of cultural bias on our perceptions of risk and climate narratives,
    drawing on his twenty-five years of experience as a senior climate scientist,
    and, interestingly, his strong Christian faith.


    There are good books on the psychology of risk by David Garner and David Ropeik,
    and for a synthesis of the academic research, I can recommend *Risk: A Very Short
    Introduction* (2011, OUP). A summary of research on climate risk is contained
    in the paper *“Why Global Warming Does Not Scare Us (Yet)”* by Elke Weber.


    # The Climate Issue and Arguments For and Against Action


    There is so much writing on climate change, much of it online, that I cannot pick
    out any single source, though I am consistently stimulated by George Monbiot,
    Bill McKibben, Naomi Klein, Joe Rome, Dave Roberts,'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'and Sharon Astyk. At the disaster end McKibben’s 2012 Rolling Stone article,
    “Global Warming’s Terrifying New Math” is deservedly famous.


    The arguments for a more positive technocratic message are presented in *Sizzle
    by Futera Communications, Sustainia, and the many publications of the Breakthrough
    Institute, starting with its deliberately provocative report, *The Death of Environmentalism.


    Theda Skopcol’s*Naming the Problem: What It Will Take to Counter Extremism and
    Engage Americans in the Fight Against Global Warming is a challenging critique
    of the campaign to bring about climate change legislation. Skopcol does not pull
    any punches, which led to some lively wrangling with climate activists.


    A detailed analysis of the climate denial campaign as an ideological movement
    can be found online at wwwdesmobblog.com and in two good books: Naomi Oreskes’
    *Merchants of Doubt* (2012, Bloomsbury) and James Hoggan’s *Climate Cover-Up*
    (2009, Greystone). Two Greenpeace reports expose Koch Industries: Secretly Funding
    the Climate Denial Machine and Still Fighting Climate Denial. For a discussion
    of the personalities of professional deniers, I recommend the very enjoyable Washington
    Post article“The Tempest” by Joel Achenbach.


    For a better understanding of the moral universe of radical conservatism see *The
    Tea Party and the Remaking of Republican Conservatism by Vanessa Williamson and
    others COIN’s report *A New Conversation with the Centre-Right about Climate Change.


    One of the few detailed proposals for an international climate policy that controls
    wellhead production is contained in Oliver Tickell’s important book Kyoto2 (2008,
    Zed Books), based on the auction of permits to extract carbon.


    I avoided discussing the science itself, but for my money, Mark Lynas’s Six Degrees
    (National Geographic, 2008) has still to be bested by a highly readable summary
    of future impacts. My main sources were the somewhat opaque World Bank report
    *Turn Down the Heat: Why a 4°C Warmer World Must Be Avoided and the online papers
    from the 2009 “Four Degrees and Beyond” conference.


    There are numerous books criticizing climate science, usually very dull, but the
