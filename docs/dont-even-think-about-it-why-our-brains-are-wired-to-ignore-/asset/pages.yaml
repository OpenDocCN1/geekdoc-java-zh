    were asked to write down their thoughts as they considered their choice, and it
    was clear that the word “tax” had triggered a cascade of negative thoughts that
    had biased their entire decision making.


    Knowing this, the lobbyists for a climate change bill in the U.S. Senate deliberately
    excised the word “tax” and replaced it with the more an “fee on polluters.” Then
    Fox News brought it back into play with an online article opposing the bill that
