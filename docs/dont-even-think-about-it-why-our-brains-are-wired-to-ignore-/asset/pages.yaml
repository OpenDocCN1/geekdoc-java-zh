    According to the Canadian sociologist Erving Goffman, we manage our attention
    through "schemata of interpretation," which, thankfully, he also described using
    the far more memorable term: frames.


    Goffman explained that frames are constructed of our values, our life experience,
    and the social cues of the people around us. We decide what information we wish
    to pay attention to—placing what is relevant, important, familiar, or rewarding
    to know inside the frame.


    Frames are active too. They seek out, scan, and select new information. George
    Lakoff, a linguist at U.C. Berkeley, argues that frames have a physical presence
    in our brains, are embodied in our neural circuitry, and are strengthened through
    use. This is, he stresses, a dynamic process in which new frames build onto existing,
    established frames to form a coherent system.


