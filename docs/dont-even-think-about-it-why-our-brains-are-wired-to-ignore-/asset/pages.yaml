  md: '“lifestyle change,” which for them was poisoned by an association with middle-class
    environmentalism and government buck-passing. There was something very wrong here:
    Surely, I thought, trade unionists, of all people, would respond to a call for
    collective action against a common threat?


    Some, this was all the wrong way around. Campaigns urging people to take personal
    responsibility and work together to “save the planet” were saying the wrong things
    to the right audience and the right things to the wrong audience. So for much
    the hope that personal lifestyle changes might shift people’s attitudes and bring
    people together; if anything, they seem to reinforce people’s prejudices and drive
    them apart.


    This is because our willingness to make a personal sacrifice is entirely bound
    up with our sense of social identity. If we feel an affinity with the group, then
    we will willingly make a contribution to prove our loyalty. In times of conflict,
    we may even sacrifice our life. But this strengthened sense of in-group identity,
    and our socially wired sense of fairness, makes us deeply resentful of moral rules
    laid down by outsiders that they do not appear to follow.


    Nor do small changes in lifestyle necessarily lead on the virtuous escalator to
    larger commitments. Further research has found that even those people who accepted
    the threat of climate change were all too ready to adopt a simple action as a
    token of their concern and then go further. Columbia University psychologist Elke
    Weber has respond to a problem with what she calls “single action bias.” She argues
    that this may be another bias derived from our evolutionary past when threats
    were simpler and a single short-term action could safely relieve us from danger
    and the anxiety of worry.


    People then use that act as a personal justification—what psychologists call moral
    license—to offset further damaging behavior, just as people order a supervise
    Diet Coke as an antidote to their double cheeseeburger. So, research has found
    repeatedly, people who buy energy-efficient lights and appliances tend to use
    them more. People who insulate their houses then turn up the thermostat.


    They transfer the moral license to other areas too. When residents in a Boston
    apartment building were sent notes (with pretty leaf graphics)'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'asking them to save water to “help preserve the environment,” they used 7 percent
    less water. And they then used 6 percent more electricity.


    Researchers at the University of Toronto found that this moral licensing effect
    was so powerful that people who had just bought environmentally friendly products
    in an experiment became markedly more willing to take up an opportunity to cheat
    the university and even steal money.


    Within the issue of climate change, people use moral licensing as part of a deliberate
    process to write narratives that diminish their own responsibility. In interviews,
    people exaggerate their own small actions and portray them in heroic terms. One
    participant in a British focus group boasted that he recycled everything and could
    that not one piece of paper went into his garbage. This, he added, “makes me feel
    guilty about flying as much as I do.”


    So, once again, climate change has become wickedly defined by its solutions. For
    people who accept climate change just might be a major threat, providing solutions
    based on small lifestyle changes makes it seem far less dangerous and carbon comes
    to seem like another form of that they really shouldn’t drop.


    For people who doubt that climate change exists, demands to change their lifestyle
    confirm their suspicion that the real threat comes from the environmental liberals
    who want to control their lives.


    What is missing, and what is urgently required, is a coherent policy framework
    that provides a contract for shared participation—whether through voluntary measures
    or, as many campaigners now demand, some form of tax, ration, or dividend—within
    which personal actions are recognized and rewarded alongside important contributions
    from government, business, and fossil fuel companies. Not the power of one, but
    the power of all.'
