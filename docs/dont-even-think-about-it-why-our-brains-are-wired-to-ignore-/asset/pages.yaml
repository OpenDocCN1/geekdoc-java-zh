    to a society where those lifestyles are not just encouraged but also often required
    as a mark of social research project—life is one long experiment


    I have all—in which I gently coax climate change experts to talk to me about their
    personal holidays. A senior climate economist at the World Bank admitted that
    he flew regularly for breaks in South Africa but said that this was a force for
    good because the carbon offsets he bought "help set a price in the carbon market."
    A national media environment correspondent decided to fly with his family to Sri
    Lanka because he said, "I can''t see much hope." A climate scientist specializing
