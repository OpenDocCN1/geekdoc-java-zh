  md: '# Moral Imperatives


    # How We Diffuse Responsibility for Climate Change


    When Dick Cheney, former U.S. vice president, accidentally shot his languages
    friend Harry Whittington in the face, he drew on his forty years in politics and
    the oil industry to create four stages to the process. “Ultimately,” he said,
    “I’m the guy who pulled the trigger that fired the round that hit Harry.” His
    boss, George W. Bush, added yet further levels of detachment—He heard a bird flush,
    and he turned and pulled the trigger, and saw his friend get wounded.


    Even when they shot their friends, it seems, politicians will do everything to
    create multiple stages between themselves and responsibility. It is a peculiarity
    of English that it doesn’t distinguish intentional events and accidental events.
    In many languages, you would say “I broke my arm” only if you went mad and broke
    it. But English makes up for this weakness with the ingenious passive voice, which
    removes intentionality: My arm was broken; my friend got wounded; the climate
    got fried.


    And so it is with climate change. We diffuse the responsibility into multiple
    stages, each one protected by the passive voice. The oil is produced. It is burned
    in the car. The climate is changed. Someone’s life is'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'destroyed in a climate disaster on TV. Or, as the Wall Street Journal says,
    “climate concerns cannot and must not be ignored”—this, incidentally, in a quotation
    from a report arguing for the production of Canadian tar sands.


    So where in chain does responsibility for climate change lie? Stephen Gardiner,
    professor of philosophy at the University of Washington, argues that all the decisions
    concerning action or inaction on climate change are ethical issues—especially
    in regard to intergenerational ethics.


    Which, for Gardiner, raises an interesting question: Why is there so little discussion
    of the ethics of climate change? The answer is that this is yet another area in
    which people shape the issue to avoid the discussion. Certainly no one is in a
    hurry to invite ethicists into the policy discussions. In 2010, the United Nations
    considered a Universal Declaration of Ethical Principles in Relation to Climate
    Change. After ten international consultation meetings, its ad hoc working group
    concluded that the U.N. “should be given the opportunity to review the desirability
    of preparing a draft declaration.” I don’t think that was yes, even by U.N. standards.


    This is exactly the kind of obfuscation that prompts Gardiner to suggest what
    he calls “a very unpleasant thought” that politicians deliberately needlessly
    complex treaties and unworkable processes to draw attention away from the nest
    to do something. This observation is not lost on other commentators. Guardian
    journalist George Monbiot argues that “government policy is not contained within
    the reports and reviews it commissions; government policy is the reports and reviews.”
    He says, “Government creates the impression that something is being done, while
    simultaneously preventing anything from happening.”


    The key factor that determines moral responsibility is intentionality. Humans
    are acutely alert to interpreting people’s intentions—even children as young as
    three respond differently to identical harmful acts depending on whether they
    regard them as intentional or not intentional.


    The reason that an enemy narrative motivates the emotional brain is because an
    enemy has clear intention to harm us. If scientists had discovered that North
    Korea was pumping greenhouse gases into the atmosphere with the intent to destabilize
    the world’s climate, there would be immediate political consensus to take action,
    regardless of the cost. Of course, would be a very big problem but, crucially,
    a tame problem, and far more easily solved.'
