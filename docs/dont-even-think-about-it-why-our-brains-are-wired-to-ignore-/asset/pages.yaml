  md: '# # The Two Brains

    ## Why We Are So Poorly Evolved to Deal with Climate Change


    The idea that our evolutionary psychology makes it hard for us to deal with climate
    change is widespread. Paleoanthropologist Ian Tattersall in the coda to his book
    The Masters of the Planet: The Search for Our Human Origins reflects that “we
    are notably at assessing risk. Inside our skulls are fish, reptile and shrew brains.”
    This, he says, is why we can ignore climate change and think that we won''t have
    to face its consequences. Professor Paul Ehrlich, the outspoken population biologist
    at Stanford University, argues that we cannot deal with climate change because
    “the forces of genetic and cultural selection were not creating brains capable
    of looking generations ahead.


    Evolutionary psychology is much contested, debated, and fought over on political
    and ideological grounds. Climate deniers argue that it underestimates the speed
    of evolution and that constant environmental and climate changes during evolutionary
    history have actually left us remarkably adapted and prepared for the changes
    of the modern world.


    Daniel Gilbert, a professor of psychology at Harvard, disagrees. He tells me that
    climate change is “a threat that our evolved brains are uniquely unsuited to do
    a damned thing about.” Gilbert has given this some thought:'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'He is an expert, now a bestselling author, on the psychology of happiness,
    and he has the kind of free-roving hyperactive mind that is fascinated by everything.

    Gilbert argues that our long psychological evolution has prepared us to respond
    strongly to four key triggers that he neatly summarizes with the acronym PAIN:


    **Personal:** Our brains are most highly attuned to identifying friends, enemies,
    defectors, and human agency.


    **Abrupt:** We are most sensitive to sudden relative changes and tend to ignore
    slow-moving threats.

    **Immoral:** We respond to things that we find to be indecent, impious, repulsive,
    and disgusting.

    **Now:** Our ability to look into the future is one of our most stunning abilities,
    but he says, is “still in the early stages of R&D.”


    As Gilbert sees, the problem with climate change is that it doesn’t trigger any
    of These. Of the four, he is more inclined to emphasize the lack of Abrupt and
    Now, which “are things that even a rabbit understands.” But he would not underestimate
    the importance of Immoral. While we recognize that climate change is bad, it does
    not make us feel noxious or disgraced. He adds, “If global warming was caused
    by eating puppies, millions of Americans would be massing in the streets.”


    Unless, Americans already eat puppies. The taboo is socially constructed, and
    one could readily imagine an alternative culture in which, following the lead
    of the hungry settlers, it was roast puppy that had become the centerpiece of
    the Thanksgiving table.


    Gilbert connects the point but not the distinction. “To me,” he says, “socially
    constructed and evolutionary are different ways of spelling the same thing. The
    most interesting thing about us as a species from an evolutionary standpoint is
    not really ourable thumb or our ability with language; it’s our social life.”
    It is this that determines the social cues, norms, enemies, and in-group, out-group
    dynamics, as I have already argued, are so important in shaping our response to
    climate change.


    Gilbert draws on a large body of research, some of it own, in the field of evolutionary
    psychology. The founders of modern evolutionary'
  merge: -1
  pgno: 53
