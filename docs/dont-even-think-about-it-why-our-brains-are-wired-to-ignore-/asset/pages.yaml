  md: '# Wellhead and Tailpipe


    # Why We Keep Fueling the Fire We Want to Put Out


    In some ways, climate change is actually quite simple. We find fossil fuels. We
    dig and pump them out of the ground. We process them and sell them. Then we burn
    them. The waste gases include carbon dioxide, which traps the heat in the atmosphere
    that leads to global warming. There is, of course, much more to it—other gases,
    sources, and sinks—but this is the basic carbon cycle, which represents the majority
    of the problem and appears in every textbook and informs every policy.


    So, there is a chain, or if you prefer, a pipeline. At the one end is exploration,
    development, and production—what I call the wellhead (a term which will include
    the maine). And at the other is the sale and combustion that leads to emissions—what
    I call the tailpipe. Policies to manage climate change should, one would think,
    consider interventions at both ends and all in-between.


    However, they do not. The focus on tailpipe gases and disregard for wellhead fuels
    has the single most important factor in all government and policy framings. Radical
    environmentalists alone have attempted to connect two issues that, in the minds
    of most mainstream experts, operate in entirely independent realms. This does
    not, on its own, explain why we'
