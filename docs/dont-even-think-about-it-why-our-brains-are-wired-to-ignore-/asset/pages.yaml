    One year later, Hurricane Sandy, the largest Atlantic hurricane on record, damaged
    or destroyed nearly 350,000 homes as it hit the New Jersey seashore. When I visited
    five months later, the destruction could still be everywhere in the small towns
    that line the shore.


    In Seaside Heights the tangled remains of a roller coaster still out to sea, where
