  md: '# Degrees of Separation


    # How Climate Experts Cope with What They Know


    Sitting on a panel at the 2012 annual assembly of the Tyndall Centre for Climate
    Change Research, I remember vividly the palpable unease that entered the room
    when the discussion turned to four degrees. There was a hesitation in broaching
    the subject. Voices became quieter and less confident. Nevertheless, everyone
    in the room talked about four degrees Celsius of warming as being entirely probable
    if not unavoidable.


    At the reception later that evening, the scientists chatted amiably in pairs and
    small groups, clutching their glasses of warm white wine and balancing plates
    of canapés. With their slightly ruffled old-fashioned clothes and their polite,
    intense demeanor, they looked like any other group of highly educated professionals—to
    my eyes, rather like the audience for a concert of somewhat challenging chamber
    music.


    However, listening to the detail of their conversations reminded me that this
    gathering was far from ordinary. The people in this room constituted a large part—may
    even the majority—of those in Britain who truly understood why a global temperature
    increase of two degrees might, just, be manageable, and why one of four degrees
    would be an utter catastrophe. This, after all, is what they have spent their
    lives studying. Of all people,'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'they know too well that the phrase four degrees is shorthand for environmental,
    social, and economic collapse. And, as their models keep telling them, we are
    heading straight for it and could well reach it within sixty years.


    According to Professor Lonnie Thompson, a climatologist at Ohio State University,
    those in his profession are a stolid group, not given to “theatrical rants about
    falling skies.” However, they say, now feel compelled to speak out about the dangers
    because “virtually all of us are now convinced that global warming poses a clear
    and present danger to civilization.” Extraordinary this statement is, even extraordinary
    that it appears in an otherwise sober report in the journal of a respected international
    science association.


    Every year their warnings have become clearer and more serious. And, it seems,
    every year they have become less believed. Returning to the quote with which I
    started this book, these scientists are, I fear, uncomfortably similar to the
    handful of people in 1942 who knew what was happening to the Jews of Europe, who
    carried the weight of dreadful knowledge but struggled to persuade anyone of the
    existence of a crime of such immense.


    One scientist told me that he was so disturbed by the latest findings that he
    wrote to few close friends—he named some of the world’s most senior scientists—and
    asked them: the future of humanity depends on this, is there any chance—please
    any chance—that we could be wrong? They replied immediately, saying that they
    constantly worried about this and (contrary to what the skeptics claim) were always
    open to the possibility of being wrong. However, whenever they went back over
    the evidence, they could not avoid the uncomfortable conclusion that they had
    indeed gotten this right. “We are fatalists,” he told me.


    Activists and campaigners also struggle with this sense of anxiety, sleepless
    nights and panic attacks. Dorian Williams, an anthropology senior at Brandeis
    University who leads the campus divestment campaign for 350.org, says that she
    experiences “very serious, very low states of being for hours to days to weeks
    at a time.” It’s never going to go away, she says, but “you just have to work
    through it so that you can keep fighting.”'
