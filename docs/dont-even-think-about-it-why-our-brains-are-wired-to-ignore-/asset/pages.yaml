    issue.


    Formal science is also subject to its own norms of attention about what it seeks
    to know or not. A growing field of study is the “sociology of ignorance,” which
    explores the field of “non-knowledge”—information that is deliberately not acquired
    because it is considered too sensitive, dangerous, or taboo to process.


    In-depth interviews by Joanna Kempner at Rutgers University found that scientists
    were committed to a heroic narrative of their pursuit of knowledge. “Our job,”
    one said, “is to explore truth, not determining whether truth is dangerous or
    that truth is unpleasant.” However, while they welcomed controversy in their fields,
    they all wanted to avoid public controversy, which would take up their time and
