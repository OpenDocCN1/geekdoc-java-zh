  md: '# Two Billion Bystanders


    # How Live Earth Tried and Failed to Build a Movement


    From his office in Beverly Hills, aptly named the Control Room, Kevin Wall organizes
    the largest public events around the globe: the World Cup opening ceremonies,
    rock concerts for Bob Dylan, Michael Jackson, Prince, and Elton John. He deals
    in mind-bogglingly big numbers. “Look,” he tells me, “how many people saw Al Gore’s
    documentary An Inconvenient Truth? Two million people, ten million people? That’s
    a real success. It’s the biggest documentary in history. I could create a twenty-four-hour
    show that touches on all the Inconvenient Truth stuff, and maybe one billion people,
    two billion people could see.


    And so Live Earth was born—simultaneous concerts in eleven cities, seven continents
    (including Antarctica), the the largest and most ambitious ever dared to mobilize
    a mass audience around climate change.


    Wall freely admits that when he first saw Al Gore’s presentation, he had walked
    out halfway through because he found it so depressing. When the movie came out,
    his first thought was “Oh shit, it’s the same slideshow.” It did convert him to
    the issue, but he still had a big problem with the slideshow—Wall wanted to make
    an impact and that meant thinking big—big names, big venues, as aspirations, and
    putting his company on the line.'
