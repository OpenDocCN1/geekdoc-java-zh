  md: '# 12


    # Uncertain Long-Term Costs


    # Why Our Cognitive Biases Line Up Against Climate Change


    “This is not what you might want to hear,” says Professor Daniel Kahneman. “I
    am very sorry, but I am deeply pessimistic. I really see no path to success on
    climate change.”


    I assure him that this indeed what I want to hear and the reason why I wanted
    to talk to him. Kahneman, after all, received a Nobel Prize for his pioneering
    work on the psychology of decision making, and his bestselling book, Thinking
    Fast and Thinking Slow, has been a major influence on my own thinking.


    In our packed cafe in downtown New York, the background noise is painfully high,
    and Kahneman delivers his argument a few words at a time between long pauses for
    another spoonfulful of his seemingly bottomless bowl of tomato soup. Piece by
    piece, he meticulously outlines the reasons why he thinks that climate change
    is a hopeless problem and why it doesn’t have the necessary characteristics for
    seriously mobilizing people’s sense of threat.


    His concerns are threefold. First, climate change lacks salience—by which he means
    the qualities that mark it as prominent and demanding attention. Like Daniel Gilbert,
    Kahneman argues that the greatest salience'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'belongs to threats that are concrete, immediate, and indisputable—for instance,
    a car out of control driving right at you. By contrast, climate change is, he
    says, abstract, distant, invisible, and disputed.


    The second problem, he notes, is that dealing with climate change requires people
    accept certain short-term costs and reductions in their living standards in order
    to mitigate higher but uncertain losses that are far in the future. This is a
    a combination that, he fears, is exceptionally hard for us to accept.


    Third, information about climate change seems uncertain and contested. As long
    as that remains the case, he says, "people will score it as a draw, even if there
    is a National Academy on one side and cranks on the other."


    The "bottom line," Kahneman says, "is that I''m extremely skeptical that we can
    cope with climate change. To mobilize people, this has to become an emotional
    issue. It has to have the immediacy and salience. A distant, abstract, and disputed
    threat doesn''t have the necessary characteristics for seriously mobilizing public
    opinion.


    This combination of short-term and long-term decision making under conditions
    of uncertainty is the essence of Kahneman’s lifework. During his twenty-year collaboration
    with the psychologist Amos Tversky, Kahneman challenged the prevailing economic
    assumption, called utility theory, that choices are made with a rational evaluation
    of future benefits.


    They argued instead that our decisions are more likely to be directed by a set
    of inbuilt and intuitively mental shortcuts—what they called cognitive biases.
    Biases help us to apply our previous experience to new information, enabling us
    to decide what to heed and what to ignore. They are an invaluable tool when dealing
    with simple day-to-day decisions but can generate serious systematic errors when
    applied to complex decision making. Kahneman and Tversky found that people are
    consistently far more averse to losses than gains, are far more sensitive to short-term
    costs than long-term costs, and privilege certainty over uncertainty.


    Kahneman sees climate change as a near perfect lineup of these biases. An issue
    is challenging enough if it concerns losses and no gains. And it is challenging
    if those losses are long-term not short-term. And it is challenging if it has
    substantial uncertainty. Climate change appears to be'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'the perfect combination of all three factors. I will examine each of them,
    in turn, in the following chapters.

    I ask him whether these cognitive barriers could be overcome if people understood
    them better—this is, after all, one of my hopes for this book. Professor Kahneman
    pauses for another contemplative spoonful of tomato soup. “Actually,” he says,
    “I’m not very optimistic about that either. No amount of psychological awareness
    will overcome people’s reluctance to lower their standard of living. So’s my bottom
    line: There is not much hope. I’m thoroughly pessimistic. I’m sorry.”'
