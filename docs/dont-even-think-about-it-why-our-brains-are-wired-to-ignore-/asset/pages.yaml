    of this of apocalyptic messaging. The idea that they could be subject to arbitrary
    impacts upsets their belief that the worthy are rewarded and that only wrongdoing
    is punished. In an experiment people with these “just worldviews” were presented
    with apocalyptic messages, their belief in climate change fell dramatically.


    One of the videos they shown in the experiment is worth mentioning in detail:
    A man is standing on a railroad track as a speeding train comes ever behind him.
    “Some people say the irreversible consequences of global warming are thirty years
    away,” says the man. “Thirty years? That won’t affect me.” He steps off the track,
    and we can see that hidden behind him the time was a young girl. With the train
    now more feel away, up comes the slogan “There’s still time—fight global warming.


    This television commercial was made in 2006 by the Environmental Defense Fund.
    I doubt that anyone other than dedicated greens (and possibly even not them) would
    respond well to it. Certainly it is powerful and grabs one’s attention, but it
    generates no sense of efficacy—the best thing you can do in the face of a runaway
    train is to jump the track, pulling the little girl behind you.


    I have already shown that people evaluate new information in the light of their
    recent experience. In rich Western countries they will have little available experience
    of environmental or social collapse, but they will have a large mental library,
    often in the form of polished stories, of failed prophecies of collapse. It is
    that most easily come to mind.


    The greatest, and longest-sustained, postwar fear was of imminent nuclear apocalypse,
    and the early environmental movement. As an article in the Age, a skeptical Australia
    newspaper said, under the heading “A Climate of Fear,” “The Bomb was back, like
    the ghost at a banquet of anxiety. From Al Gore to the Intergovernmental Panel
    on Climate Change, everyone had grim news for the planet.'
