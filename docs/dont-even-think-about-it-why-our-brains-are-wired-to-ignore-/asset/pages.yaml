  md: '# Bright-siding


    # The Dangers of Positive Dreams


    The climate apocalypse narrative has a positive, optimistic, and altogether bouncier
    twin: the bright side. It provides a far more coherent narrative than apocalypse
    and so can be summed up in a paragraph:


    Climate change is a challenge, but it is also a great opportunity. Humans have
    always triumphed over adversity and come through stronger. Our ingenuity, technology,
    and capitalism have created unbelievable progress and will continue to do so.
    We can be anything we want to, so the real enemy is negativity and despair, which
    must not be allowed to poison this positive vision.


    In cognitive terms, the bright side appeals directly to the emotional brain and
    passes through its biases with flying colors. It replaces uncertainty with confidence.
    It replaces short-term sacrifice with the offer of immediate rewards of wealth
    and status. And it compensates for the taint of failure and self-doubt that hangs
    around climate change with an overstated confidence in technology and economic
    growth.


    Americans are particularly prone to bright-siding. The journalist Barbara Ehrenreich,
    who helped popularize the word, argues that “positivity is a quintessentially
    American activity, associated in our minds with both'
