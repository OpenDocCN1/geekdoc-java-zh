  md: '# Them, There, and Then


    # How We Push Climate Change Far Away


    Politicians constantly describe climate change as a long-term issue and a threat
    to future generations. In his keynote speech on climate policy in June 2013, President
    Obama spoke of how we have to be caretakers of the future, stand up for the future,
    look after the future, not fear the future but embrace the sustainable energy
    future. Christine Lagarde, head of the International Monetary Fund, is more blunt—coming
    from the land of French cuisine, she shears that “future generations will be roasted,
    toasted, fried, and grilled.


    The public duly regards climate change in the same light. In surveys, the most
    revealing answer comes when people are asked whether they think climate change
    will affect them or future generations. In both America and Britain they give
    the same answer: A large majority (usually around two-thirds) say it will not
    affect them personally. And a large majority—often of exactly the same size—say
    that it will affect future generations. Time is an innate feature of our mental
    categorizing that we define things in terms of their closeness: prioritizing the
    things that affect us, and here and now, and disregarding those that affect others,
    there and then. In experiments, people tend to amplify this bias by deliberately
    choosing to regard something that is distant in one aspect as distant in other
    ways too.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'People’s perception of the risk posed by climate change duly ratchets up in
    steady increments the further away its victims lie. With each remove, it becomes
    more hazardous: first for other members of their family, then for their community,
    then for other Americans, then for other people in rich countries, then for poor
    people abroad, then for other species, and finally—the most distant category of
    all—for people in the future.


    This tendency to distance potential impacts works in close partnership with another
    bias identified by Daniel Kahneman and Amos Tversky: the tendency for people to
    assume that they face lower risks than others. This “optimism bias,” as named
    it, has been found in many different situations: people believing that other smokers
    are more at risk of a heart attack than they do, that other housing estates have
    more crime, that other drivers are more likely to have an accident, and, as I
    have already mentioned, that the near hurricane will hit somewhere else.


    This also applies to the environment. There is a near-universal belief that the
    environment is in better condition in one’s own area—indeed, in a study in eighteen
    countries, people in sixteen were convinced that they had the best environmental
    conditions.


    Climate change has other timing problems. Daniel Kahneman argues that when impacts
    come in intervals—such as business cycles—people’s availability bias leads them
    to focus on the most recent event and miss the longer trend. Like Slovic, Kahneman
    is concerned that each successive extreme weather event then becomes accepted
    into our status quo and become the new baseline against which we measure change.
    A heat wave or flood is judged against the level set in the last heat wave or
    flood and we may not notice the overall scale of change over the longer term.


    This is why lesser problems that deliver a single exceptional impact at a predictable
    moment can galvanize a far higher level of attention. Take, for example, a threat
    that combined an unprecedented technological cause (what Paul Slovic would call
    an unknown risk) with a precise and deeply symbolic timing: the prediction that
    the world’s computer systems would collapse when the date changed on New Year’s
    Eve 1999.


    I remember vividly my local bookshop building an entire display of the opportunist
    books warning of the coming social collapse from the “Y2K computer time bomb,”
    after which law and order would break down, starving mobs would roam the streets,
    and as the antuclear campaigner'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'Helen Caldicott warned, accidental missile launches could lead to “Armageddon.”


    And, of course, nothing happened in either the United States, which poured estimated
    $134 billion into the pockets of software analysts and computer programmers, or
    in South Korea, Italy, or Ukraine, countries that had done next to nothing. On
    January 1, a few slot machines and cash registers became momentarily confused,
    that was all.


    Campaigners have always struggled with climate change''s un-engaging timeline
    and tried to find ways to generate the same compelling sense of urgency and symbolism
    as Y2K. In 1947, the *Bulletin of Atomic Scientists* hit on the novel image of
    the Doomsday Clock, which is always close to striking midnight, to dramatize the
    risks of nuclear weapons. In 2012, the hands were moved to five minutes to midnight
    to recognize the coming climate catastrophe, and Rajendra Pachauri, the head of
    the Intergovernmental Panel on Climate Change, announced its latest report with
    the “We have five minutes before midnight.”


    Environmental campaigns around climate also manufacture deadlines to create urgency.
    Back in 1990, I was an intern in the smoke-filled offices of the *Ecologist* magazine
    as the editorial staff pulled together a new book warning of environmental collapse
    with the title *5000 Days to Save the Planet*. The deadline ran out in the same
    year that the British think tank Institute for Public Policy released its own
    deadline report: “Ten Years to Save the Planet.”


    And the baton kept being passed. In 2007, an international team of celebrities
    united under the banner Global Cool said ten years was “save the planet.” That
    year, the World Wildlife Fund warned that five years was the “small window of
    time in which we can plant the seeds of change.” Each successive climate conference
    provides a countdown, and I am already receiving action alerts on the run-up to
    the Paris conference in telling how many months we have left to save the world.


    In 2008, the London-based New Economics Foundation launched the campaign 100 Months
    to Save the World. Prince Charles became a strong supporter of the deadline, declaring
    shortly after, from a podium in his modestly appointed pad in St. James’s Palace,
    that there were now only'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'ninety-six months left to reverse what he calls “de-souled consumerism” and
    that the “age of convenience” was over.


    But it was not at all. Charles may have converted his fleet of cars to run on
    wine-ethanol, but in every other respect, life appears to be largely unchanged.
    I ask Andrew Simms, who invented that campaign slogan, what happens in 2016 when,
    as Slavic says, we open up the windows and find that its still a beautiful day.
    “Of course,” Simms says, “we never said that the sky would set fire and all forests
    burn. What happens is that it becomes more, rather than less, likely that we go
    over the safe threshold and positive feedbacks kick in.”


    And here lies the problem. Without an explanation, the deadline can seem to be
    arbitrary and however, as soon as it has an explanation, the campaign is immersed
    back into the tangle of probabilities, uncertainties, and cost-benefit analysis
    that it originally sought to avoid. No one is ever going to march under a banner
    of “100 Minutes Before the Shift into a Greater Likelihood of Feedbacks,” especially
    given that many experts fear that we may have already crossed that line.


    But even if climate change has no pressing deadlines, this does not mean that
    the anticipation of future will not motivate us and enable us to overcome any
    tendency to discount the future.


    For the past twenty years, George Loewenstein, professor of psychology at Carnegie
    Mellon University, has been exploring the effect of anticipation on our attitudes
    to future loss. Fearful anticipation, he says, highly motivating. We agree that
    we tend to discount the future but feels that it is “easy” to exaggerate its importance.”
    His research suggests that the anticipation effect is likely to be even stronger
    in a case, like climate change, in which people anticipate a deteriorating condition,
    what he calls a “decline sequence.”


    Anticipation was, for example, a major factor in people’s fear of nuclear war,
    another issue whose future impacts face great uncertainty. Risk specialists talk
    of the signal value of individual incidents, such as nuclear accidents, which
    portent future disaster. In this extreme weather events offer a string of signal
    events that feed the anticipation of future loss, which explains why climate disasters
    can heighten concern among those already disposed to accept the threats of climate
    change.'
