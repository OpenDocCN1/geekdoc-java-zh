    # Why Climate Science Does Not Move People


    Climate change is a complex and technical issue that emerges from the theories,
    data, and predictions of scientific specialists. The problem is not just that
    scientists emphasize uncertainty and use obscure abstractions, but that they also
    often excite the very images, stories, and metaphors that might engage our emotional
    brain and galvanize us into action. Sometimes there seems to be a near-perfect
    mismatch between message and messenger—like those comedies where all the roles
    get mixed up: the homeless con swaps places with the commodities broker, or the
    I Love Lucy episode where Lucy and Ethel get jobs in the candy factory while husbands
    Ricky and Fred stay at home.


    This is not coincidental. The division between the emotional brain and the rational
    brain runs deep in our culture and is clearly expressed in the cultural divide
    between religion and science that first emerged during the European Enlightenment.
    It is, in the words of Tony Leiserowitz at the Yale'
