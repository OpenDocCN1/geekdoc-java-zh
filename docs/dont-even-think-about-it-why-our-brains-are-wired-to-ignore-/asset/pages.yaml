  md: '# Precedents and Presidents


    # How Climate Policy Lost the Plot


    It is fortunate that the issue of climate change emerged at a time of unusual
    optimism, when there were three very recent precedents of proven success and international
    cooperation on which to draw. In retrospect, it is also extremely unfortunate
    that these issues had such strong similarities to climate change that policy makers
    failed to notice the glaring and important differences.


    The first was the Strategic Arms Reduction Reduction Treaty (START), negotiated
    between the USA and the USSR between 1982 and 1991. START established the use
    of targets and timetables in the cause of mutually verifiable reductions, which
    was carried directly over greenhouse gas emissions reductions. Al Gore, then a
    senator, was a very active member of the bipartisan group of lawmakers that pressured
    President Ronald Reagan to moderate his stance in the START negotiations, and
    Gore refers to it regularly as along a metaphor for decisive political action
    on climate change.


    Gore, along with Tim Wirth, a Colorado Democrat, also led congressional efforts
    in the mid-1980s to mobilize U.S. support for a control on the production of ozone-depleting
    chemicals. This global struggle provided the second precedent and the mental model
    for the fight against climate change.


    The ozone issue had first emerged in the mid-1970s, when satellites reported an
    extreme thinning of the stratospheric ozone layer over'
