  md: 'individual and national success, but it is driven by a terrible insecurity
    which requires a constant effort to repress or block out unpleasant possibilities
    and ‘negative’ thoughts.


    The bright side is the narrative of choice for business entrepreneurs and politicians
    and reflects their disposition to risk taking and optimism bias. Barack Obama
    said during a 2008 presidential debate, “This is not just a challenge; it''s an
    opportunity.


    This balance between challenge and opportunity is nicely represented for bright-siders
    by the Chinese ideogram for “crisis”—weiji, which, they like to claim, combines
    the character for “disaster” (wei) with the character for “opportunity” (ji).
    And here they are neatly tethered together: Every crisis, they argue both a disaster
