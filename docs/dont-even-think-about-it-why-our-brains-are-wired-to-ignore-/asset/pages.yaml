  md: '# Winning the Argument


    # How a Scientific Discourse Turned into a Debating Slam


    I’m sitting in the cafe in Union Station in Washington, D.C., watching Marc Morano
    demolish a plate of oysters. While Daniel Kahneman managed to make drinking tomato
    soup into a Taoist meditation exercise, Morano has found a way to ingest oysters
    without stopping talking, like a grazing shark. And boy, this fellow opinionated—I
    find him kind of fun and kind of appalling in equal measure.


    Morano is one of the key communicators in anti-warming activism, constantly in
    demand for TV and other media and also as an informal media service to enable
    access to other deniers. So I was interested in obtaining his perspective as a
    communications specialist, rather than a campaigner, on how he shapes the story
    to make it more appealing.


    His strategy is entirely reactive, waiting to see what evidence and narrative
    the other side comes up with and, he says, “knocking it down.” The journalist
    Ross Gelspan, has interviewed almost all the professional contrarians, has concluded
    that they are “detached internally from the substance of what they are naysaying
    and motivated by the gamesmanship of showing how clever they are—as though it
    is all a game'
