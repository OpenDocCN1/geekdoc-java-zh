  md: "# In a Nutshell\n\n# Some Personal and Highly Biased Ideas\n Digging Our Way\
    \ Out of This Hole\n\nClimate change is a scientific fact. Scientists have become\
    \ so bruised by their political battles that they have come to use much weaker\
    \ language, declaring that climate change is \"very likely\" or \"unequivocal.\"\
    . Let’s just call it a fact, because that is what it is. There is plenty of uncertainty\
    \ around how the climate is responding to these enormous changes, but being uncertain\
    \ is not the same as being unsure.\n\nScientists are remarkably sure that climate\
    \ change is bringing major impacts—they simply cannot with absolute certainty\
    \ disentangle the web of cause and effect. The word *certain* is one of many false\
    \ friends of words that scientists use in a particular and unusual meaning. In\
    \ regard to climate change, we are frequently divided by our common language.\n\
    \nOur psychological obstacles are also a scientific fact. The large body of rigorous\
    \ research-based evidence suggests that climate change struggles to overcome numerous\
    \ biases against threats that appear to be distant in time and place. We need\
    \ to make these explicit and recognize that many may be subconscious.\n\nTo create\
    \ proximity we need to **EMPHASIZE THAT CLIMATE CHANGE IS HAPPENING AND NOW**.\
    \ In particular, we should"
  merge: -1
  pgno: 245
- img_proc: true
  md: 'BE WARY OF CREATING DISTANCE by framing climate change as a future threat for
    people far away and, and especially, as a threat for non-humans, however cute
    they might be.


    Our sense of loss looks backward rather than forward, and research suggests that
    people are more motivated to restore lost environmental quality than improve current
    environmental quality. There is therefore a potential to express climate change
    as an opportunity to RESTORE PAST LOSS, whether it is social (lost community,
    values, purpose) or environmental (lost ecosystems, species, or beauty). The growing
    movement for the weeding of degraded landscapes is an interesting response to
    the uncertainties of future loss.


    We are very well adapted to respond to immediate threats but slow to accommodate
    moving change. Climate change is a process, not an event, so it requires that
    we RECOGNIZE MOMENTS OF PROXIMITY that can demand attention. These may be moments
    of political decision making, collective action, or generated conflict. In my
    view, the Keystone XL pipeline is a legitimate attempt to create a historic moment.
    Those critics who argue that the pipeline will only be a small part of U.S. emissions
    are missing the point. Their complaint is liking that the locations of seats at
    the lunch counter of the Greensboro Woolworth''s or on the Montgomery buses were
    trifling examples of racial segregation. Sometimes the act of CREATING THE SYMBOLIC
    MOMENT is far more important than its overall relevance.


    Extreme weather events create a moment of proximity and heightened awareness,
    but also of the increased in-group loyalty and anxiety that can readily expose
    consideration of climate change. Even when confronted with direct evidence of
    climate extremes, the main influence on people''s attitudes will still be the
    views of the people they know and trust.


    The interference of outsiders will likely be counterproductive in such situations,
    and the best option for building conviction lies with providing the information
    for trusted local communicators to OPEN UP A CONVERSATION ABOUT LONG-TERM PREPAREDNESS.
    Preparedness and adaptation are routes for people to accept that climate change
    is real and already under way—and to build a discussion around these topics even
    when it is politically taboo to talk about the wider issues.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'However, these approaches will always be specific to each context. Whatever
    the findings of psychology experiments with their WEIRD experimental subjects,
    we need to remember that not everyone wants to protect the status quo, especially
    if they are already struggling against economic and social injustice. So we need
    a NARRATIVE OF POSITIVE CHANGE, in which our adaptation to climate change does
    not protect what is already here but also creates a more just and equitable world.


    Climate change is a narrative, shaped through social negotiations and transmitted
    between peers. People form their response to the narratives, not the science,
    and so it needs to FOLLOW NARRATIVE RULES, WITH RECOGNIZABLE ACTORS, MOTIVES,
    CAUSES, AND EFFECTS. People will be inclined to follow the most compelling narrative,
    so be careful: DON''T LET THE NARRATIVE TAKE OVER the way we think or talk about
    it.


    We interpret climate change through frames, which focus our attention but limit
    our understanding—they allow us to exclude or ignore meanings that lie outside
    the frame. Most of the factors that allow us to ignore climate change derive from
    attempts to limit its meaning; that is an environmental issue, a threat or an
    opportunity (but not both), a wellhead problem or a tailpipe problem (but not
    both). So, RESIST SIMPLE FRAMINGS AND BE OPEN TO NEW MEANINGS.


    Because climate change is a wicked problem, it can easily become defined entirely
    by its own framings and the solutions we propose, and policy makers can easily
    become locked into the simple one-off solutions that solve tamer problems. We
    need to ENSURE THAT A WIDE RANGE OF SOLUTIONS IS CONSTANTLY UNDER REVIEW—a process
    that planners call iterative risk management.


    Frames define battlegrounds, and so limited frames can lead to false debates.
    Arguments that renewable energy brings greater energy security encourage the expansion
    of domestic fossil fuels. Arguments that the carbon economy will bring jobs more
    vulnerable to evidence that the high-carbon economy might bring more jobs. As
