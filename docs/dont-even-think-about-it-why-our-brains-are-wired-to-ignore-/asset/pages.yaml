- img_proc: true
  md: 'After Hurricane Sandy


    After a disaster like Sandy or the Bastrop wildfires, people are presented with
    a stark choice about whether to admit defeat or whether to stay and rebuild. When
    they decide to stay, most people do, they are taking a gamble, and like any game,
    it predisposes them to undue optimism about the future and their own chances.


    Psychological research finds that people who survive climate disasters, unscathed,
    are prone to a false sense of their own future invulnerability. A large field
    study in an Iowa town that had been hit by a Force 2 hurricane found that most
    people had become convinced that they were less likely to be affected by a future
    hurricane than people in other towns. The people in the areas that had suffered
    the most damage were often the most optimistic. So it is hardly surprising, following
    the extreme floods in 2012 in Queensland, Australia, that few people made any
    attempt to reduce their vulnerability to flooding, and many residents chose instead
    to spend their disaster relief and insurance premiums on general home improvements
    such as installing new kitchens.


    Revealingly, then, extreme weather events provide an initial insight into why
    and how people come to ignore climate change. At every stage their perceptions
    are shaped by their individual psychological coping mechanisms and the collective
    narratives that they shape with the people around them.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'People yearn for normality and safety, and no one wants to be reminded of a
    growing global threat. As they rebuild their lives, they invest their hopes along
    with their savings in the belief that the catastrophe was a rare natural aberration.


    At a community level they collectively choose to tell the positive stories of
    shared purpose and reconstruction and to suppress the divisive issue of climate
    change which would require them to question their values and way of life.


    On reflection, it is hard to imagine any social environment in which a narrative
    of responsibility, austerity and future hardship would be less welcome than a
    community recovering from a climate disaster.'
