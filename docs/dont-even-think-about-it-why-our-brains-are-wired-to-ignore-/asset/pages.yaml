  md: 'People who deal every day with climate change as a reality provide important
    insight into the ways that humanity as a whole will cope with its psychological
    and moral challenges. Almost all analysis concerns the psychology of people who
    refuse to accept the science—which, understandably, they resent. But what about
    the people who are already convinced? Are they the advance party and, as climate
    impacts build, everyone will follow their lead.


    Their internal dilemma comes to be a head as they struggle to square what they
