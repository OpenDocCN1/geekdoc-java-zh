    Every one of these elements and players was remarkably similar to those of climate
    change and remarkably unlike those of any previous global threat. How could the
    two issues become inextricably associated with each other?


    Scientists learned the first lessons. In early 1992, ozone depletion over the
    Arctic turned out to be far less than NASA scientists had predicted. They were
    roasted by the conservative press for promoting a politicized environmental agenda.
    This chastening experience made the scientific community excessively cautious
