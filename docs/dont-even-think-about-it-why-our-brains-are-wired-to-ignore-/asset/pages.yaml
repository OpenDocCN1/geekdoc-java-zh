  md: 'Professor Walter Fisher, a theorist in communications theory at the University
    of Southern California, has argued that non-experts make sense of complex technical
    issues, they make their decisions based on the quality of the story—what he calls
    it “narrative fidelity”—rather than the quality of the information it contains.
    Fisher says that when we encounter a new issue, we ask: Does it hang together?
    Does it contain a linear sequence of events from past to future? Do the characters
    behave as we would expect them to behave, with clear and understandable goals
    and motives? Does it match our beliefs and values?


    So, story strips away, seeking what is most narratively satisfying, what''s most
    important or truthful. They can be regarded as facts in their own right, gaining
    weight through repetition and social proof as a proof of social norm—as happens
    in rumors.


    People will maintain their belief in an engaging story even if they are told that
    it is a fiction. In one psychology experiment, people were invited to read stories
    that, were warned false. Later on, when they were given a general knowledge quiz,
    this incorrect information reappeared in people''s answers. They internalized
    this information so effectively that some people could not remember that it had
    come from the stories they had first heard a few hours earlier.


    For twenty-five years, psychologists have been repeating variations of another
    storytelling experiment. Participants are told the story of a warehouse fire in
    the style of life, rolling news coverage. First they hear of toxic smoke, then
    explosions, and then they are told that it may have been caused by gas cylinders
    and oil paints were negligently stored in a closet.


    The final story is so complete that many people refuse to accept any further variation
    that might weaken it. If they are subsequently told that there was no gas or paint
    in the closet, the repetition of the phrase leads some people to become more convinced
    that gas and paint were responsible. Only if they are supplied with an even more
    compelling replacement story—for example, that arson materials were found in the
    closet—will they abandon the original version.


    This experiment provides strong clues about what makes a compelling narrative—cause,
    effect, a perpetrator, and a motive (ideally one that is consistent with our assumptions
    about how we believe they might act). The'
