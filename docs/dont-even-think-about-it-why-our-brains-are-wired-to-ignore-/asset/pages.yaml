  md: 'In this context, it is not surprising that there are multiple similarities
    between the mechanisms of climate change denial and the socially constructed silence
    found around human rights abuses.


    The late Stanley Cohen, a sociologist at the London School of Economics, drew
    strongly on his own experience as a Jewish South African to document the processes
    by which entire societies avoid dealing with collective human rights abuses. He
    highlighted the difference between ignorance (not knowing), denial (the refusal
    to know), and disavowal (the active choice not to notice). Of the latter, he argued
    applied especially well to climate change, he wrote, "We are vaguely aware of
    choosing not to look at the facts, but not conscious of just what it is we are
    evading." Cohen pointed out, we notice that our neighbors disappeared in the night,
    or that cattle trucks are heading full of people but returning empty, but somehow
    we also know that we should not talk about it.


    Such comparisons are useful for the light they throw on human behavior, but we
    need to be careful of applying such historical experience too literally to climate
    change. There were real dangers in challenging the Gestapo or NKVD. Even within
    the Tea Party, the worst that would come from acknowledging climate change would
    be a degree of social estrangement.


    It is, though, revealing that human rights organizations, which should be alert
    to the processes of social disavowal, have been so slow to acknowledge climate
    change, especially given security analysts regard it to be a key driver of future
    conflict and forced migration. In 2006, the year An Inconvenient Truth came out,
    I found that Amnesty International did not mention one of climate change on its
    website. It consistently received less than five mentions on the websites of many
    other progressive organizations—Physicians for Human Rights, the AFL-CIO, Oxfam
    America, CARE, World Vision, and the YWCA among them.


    By way of comparison, I searched for two control terms that had no reason at all
    for being on these groups'' websites: "donkey" and "ice cream." On each site,
    these irrelevant terms appeared far often. Human Rights Watch mentioned donkeys
    four times more than climate change. Refugees International mentioned ice cream
    nearly eight times more.'
