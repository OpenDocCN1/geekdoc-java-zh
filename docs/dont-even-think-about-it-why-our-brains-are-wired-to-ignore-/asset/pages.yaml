    This is essentially true in Britain, where for inexplicable reason, variations
    in our brand, damp weather are the subject of intense public interest. In his
    weekly opinion column in the Daily Telegraph, a national conservative newspaper,
    London mayor Boris Johnson pontified on his own climate expertise:'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Two days ago I was cycling through Trafalgar Square and saw icicles on the
    traffic lights; and though I am sure plenty of readers will say I am just unobservant,
    I don’t think I have seen that before. Something appears to be up with it our
    winter weather, and to call it “warming” is obviously to strain the language.


    Johnson likes to cycle around town noticing things. When Franny Armstrong, director
    of the climate change documentary The Age of Stupid, was attacked by muggers,
    she was astonished to see the huge wild-haired bulk of the London mayor cycling
    into view, shouting, “Clear off, you oks!” Johnson’s public persona, you see,
    is that of a decent, up-for-a-laugh sort of fellow who makes up his own mind on
    the basis of common sense.


    Johnson concluded his column, no doubt resonating like a tuning fork with the
    middle-age conservative readership of the Telegraph, by writing, “I am speaking
    only as a layman who wonders whether it be time for government to start taking
    seriously the possibility—however remote—that the skeptics are right.


    Because weather events can never be ascribed with certainty to climate change,
    we are therefore prone to interpret in light of our prior assumptions and prejudices.
    If we regard climate change as a myth, we regard variable and extreme weather
    as proof that weather can be naturally variable and extreme. If we are disposed
    to accept that climate change is a real and growing threat, we are liable to regard
    extreme weather as evidence of a growing destabilization.


    These selective processes are called biases by cognitive psychologists because
    they draw on predefined assumptions and intuitions to influence decisions. Confirmation
    bias is the tendency to actively “cherry-pick” the evidence that can support our
    existing knowledge, attitudes, and beliefs. These create a mental map—what psychologists
    would call a schema—and when we encounter new information we modify it to squeeze
    into this existing schema, a process psychologists call biased assimilation. We
    exercise both of these biases of selection and modification compulsively: to confirm
    our choice of restaurant, the attractiveness of our partner, the cleverness of
    our children, and to prove to ourselves that we have been “right all along” or
    that some personal mistake is “not as bad as all.”'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'These two terms are subtly different in their academic usage, but for easy
    reading, I will use just one term for both: "confirmation bias."


    Research finds that both of these cognitive biases are guiding our interpretation
    of extreme weather events and climate science as a whole. When asked about recent
    weather in their own area, people who are already disposed to believe in climate
    change will tend to say it''s warmer. People who are unconvinced about climate
    change will say it''s colder. Farmers in Illinois, invited to report their recent
    experiences of the weather, emphasized or played down extreme events depending
    on whether or not they accepted climate change.


    Researchers discovered similar patterns in Britain. Interviews with flood victims
    in England found that their interpretation of the event largely depended on their
    views on climate change, and a wider poll found that Labour Party voters were
    twice as likely as Conservative voters to ascribe extreme weather to climate change.
    Consistent with my observations in Texas and New Jersey, people who had been personally
    affected significantly less overall to ascribe it to climate change than those
    who were far away from the flooding.


    Attitudes toward climate change are so politically polarized that it is not surprising
    that independents are the most likely to form views drawn from their direct experience
    of the weather. Sociologists at the University of New Hampshire found 70 percent
    of independents were inclined to believe in human-caused climate change when they
    were asked about it on an unseasonably warm day. On abnormally cold days, that
    fell to 40 percent.


    These contextual decisions display yet another form of bias—availability bias—that
    disputes people to make up their minds on the basis of the evidence that is most
    readily at hand. It can be just as misleading as any other form of confirmation
    bias, leading people to hugely overestimate the dangers of recent events and disregard
    the threat posed by more distant ones that they have not experienced.


    Despite these biases, Tony Leiserowitz at Yale remains convinced that the teachable
    moment of changing weather is changing attitudes over the long term. He cites
    his own research showing that around two-thirds of Americans believe that global
    warming made specific extreme events worse. The highest number, not surprisingly,
    agree that the heat'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'wave of 2011 and the warm winter of 2010–11 were linked to global warming.


    These polls show that extreme weather is affecting ever-larger numbers of people
    and prompting them to consider climate change when the subject is raised. The
    larger question, though, is whether the growing experience of extreme weather
    will bring people together in a shared commitment to action, or whether their
    confirmation bias will push them even further apart. And if the weather extremes
    continue to intensify, whether the experience of coping with loss and anxiety
    will make people push it aside as something they would rather not think about.


    As the changes in the climate accelerate, new opportunities are emerging for us
    to engage or deny. Extreme weather events of entirely unprecedented scale and
    duration are now occurring regularly. Climatologists may be reluctant to ascribe
    a single weather event to climate change but are far more willing to agree that
    it is influencing widespread patterns of more extreme and bizarre weather.


    As I complete this book, hail is falling in Cairo, snow in Israel, Syria, and
    Jordan. The United States has the most extreme arctic cold it has ever experienced.
    Meanwhile Scandinavia has record-high temperatures, and Australia is entering
    its second year of unprecedented drought after temperatures reached so high that
    weather forecasters created a new color scale for the weather maps to accommodate
