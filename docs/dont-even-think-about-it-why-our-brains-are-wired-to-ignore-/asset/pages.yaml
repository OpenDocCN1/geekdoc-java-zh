    # Communicator Trust

    Why the Messenger Is More Important than the Message


    In 2007, Greg Craven, a science teacher at an Oregon high school, posted a nine-minute
    video on YouTube with the teasing title “The Most Terrifying Video You Will Ever
    See.” Craven is the unlikely successor to the seventeenth-century philosopher
    Blaise Pascal, who sought to “weigh” the gain and the loss in wagering that God
    is.” With his clipart and marker pens, Craven weighs the pros and cons of action
    on climate change and concludes that we should all believe in it because, as Pascal
    said, if you gain, you gain all; if you lose, you lose nothing.


    Craven, though, is no highbrow. He comes across as entirely relaxed, friendly,
    sincere, somewhat goofy, and utterly trustworthy, chatting in his light cheerful
    with the kitchen clutter clearly visible behind him. Craven tells his viewers
    that in the Internet age, they can take immediate action by simply passing on
    his video to their friends. This simple admonition not only promoted his homemade
    video but also anointed it with the social proof of peer referral. It has now
    had more than six million views, making Craven one of the most successful climate
    change communicators of all time.'
