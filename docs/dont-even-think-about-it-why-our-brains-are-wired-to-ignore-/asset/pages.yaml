    In Sea Bright, just south along the coast, every shop on the main street was gutted.
    Two-thirds of the permanent residents were still homeless when I visited, and
    only eight of the hundred registered local businesses were back up and running.


    Certainly, people were more inclined to accept climate change exists in the Democrat
    territory of New Jersey than they were in Republican Texas. Long, the charismatic
    mayor of Sea Bright, agreed that the frequency and power of the storms is changing
    and that the sea level is rising. Nonetheless, she could not recall anyone in
    her community discussing climate change in regards to the storm.


    When I suggested to Long that she might bind together with the leaders of other
    affected communities and demand federal action on climate change, she rolled her
    eyes. “Have you seen Sandy did?” she demanded. “Climate change, duh, of course
    it is happening. But it is bigger than anything we could make a difference on.
    We just want to go home, and we will deal with all that lofty stuff some other
    day.”'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'As Bastrop, Texas, the dominant narrative all along the Jersey Shore was one
    of community cohesion and resilience. As Dina Long Donovan warmed to this theme,
    she flourished a small piece of plastic salvaged from Donovan''s Reef, a landmark
    beachside bar. It is all that remains of the sign that used to hang over the door—a
    small fragment with two letters on it: “DO.” Long brings out this talisman in
    every talk she makes to the townfolk, media, and investors. And it became the
    slogan of the Sea Bright Rising campaign and duly appears on T-shirts and posters
    around the town.


    The strong sense of local pride I found in Bastrop and Sea Bright is entirely
    consistent with that found in other areas after disasters. Contrary to expectations,
    people rarely respond to natural disasters with panic, and there is often a marked
    fall in crime and other forms of antisocial behavior. People consistently tend
    to pull together, displaying unusual generosity and a sense of purpose.


    These are times when people are more inclined to seek common ground and actively
    suppress the divisive and partisan issue of climate change. To talk about it seems
    inappropriate and exploitative, just as many people—President Obama’s spokesman
    among them—refused to talk about control after the Sandy Hook shooting.


    The pain and loss of the event generates an intensified desire that there be a
    “normal” state to which one can return, making it even harder for people to accept
    that there are larger changes under way. The decision to stay, rebuild, reinvest
    in that normality is accordingly validated by the community.


    After losing all of his stock during Hurricane Sandy, Brian George, the owner
    of Northshore Menswear in Sea Bright, a huge sign outside his shop saying, “We
    love Sea Bright—we’ll be back.” After he reopens, business was great, with many
    people buying simply to thank him for staying. He accepted that climate change
    could bring more disasters but said he is resigned to it. “This is my home,” he
    said, “and I guess we’re just hoping another one doesn’t come along any soon.


    Across the road, Frank Bain of Bain’s Hardware lost all of his stock—and found
    that his insurance did not cover floods. “I would have been off if I’d burned
    the building down,” he said bitterly. Bain, a much-loved pillar of his community,
    is a Republican and “no fan of Al Gore or his spotted owl,” so he had always been
    unconvinced about climate change.'
