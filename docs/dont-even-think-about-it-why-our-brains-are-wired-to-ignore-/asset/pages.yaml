    Policy makers and campaigners on all sides understand very well the importance
    of uncertainty in regard to action. This is why the U.N. Framework Convention
    on Climate Change expressly states, in its third principle, that a “lack of full
    scientific certainty should not be used as a reason for postponing measures” to
    minimize the causes of climate change. And this is why President George W. Bush
    excused his inaction on the issue by saying that “no one can say with any certainty
    what constitutes a dangerous level of warming, and, therefore, what level must
    be avoided.”


    The main source of public uncertainty, though, relates to the widespread perception
    that scientists are themselves divided on the issue. In the United States, more
