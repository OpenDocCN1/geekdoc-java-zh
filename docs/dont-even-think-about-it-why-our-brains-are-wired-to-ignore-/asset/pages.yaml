  md: 'When pressed two thirds of people admit that they rarely or never talk about
    it, even inside the close circle of their friends and family members. Women talk
    about it far less than men do, and as a group, younger women talk about it less
    than anyone, especially as I will explain later, with children. Another survey
    found that a quarter of people have never discussed climate change with anyone
    at all. In real life, it seems that the most influential climate narrative of
    all may be the non-narrative of collective silence.


    None of this is of any surprise to Eviatar Zerubavel, a professor of sociology
    at Rutgers University. Zerubavel is an expert on the sociology of socially constructed
    silence, which, he says, is as much a part of our communication as speech, “like
    a substance that fills in the pauses and cracks and crannies of our discourse.”


    I ask Zerubavel how we can study a silence—how we can measure something that people
    do not recognize as being absent. He puts it this way: “We have not talked about
    all zoological gardens. The subject is not because we are deliberately avoiding
    it; it simply did not come up in our conversation. I would call this *inattention*
    because we can easily explain why we have not talked about it. But *disattention*
    is something very different. That is when we deliberately fail to notice something
    and cannot explain that silence.”


    “So,” he continues, “what I look for is about the silence—what we call a meta-silence.
    The meta-silence is that we don’t talk about the elephant in the room, and we
    don’t talk about the fact that we don’t talk about it.” And that, as Zerubavel
    points out with glee, means that the refusal to talk about the elephant becomes
    an even bigger elephant. Presumably, both have escaped from the zoological gardens
    we have been not talking about.


