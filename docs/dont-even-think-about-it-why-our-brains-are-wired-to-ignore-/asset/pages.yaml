  md: '# The Power of One


    # How Climate Change Became Your Fault


    What climate change stand out from all other global problems is that our individual
    contributions can be measured down to the last gram. We cannot identify our contribution
    to any other wicked problem, such as poverty, terrorism, or drug abuse—let alone
    quantify it. But with climate change, we can say with confidence whether our contribution
    is going up or down, how it compares with that of other people, and what changes
    would be needed to reduce it. Even though we do not make our cars, we still choose
    where to drive them. Even though we do not grow beef or asparagus, we still have
    the choice where and when to buy them, or whether to buy them at all.


    The emissions that cause climate change result from decisions taken at multiple
    stages negotiated through the market. Ignoring wellhead production is a foolish
    error, but it is no less foolish to ignore the role of consumer decisions. People
    often feel powerless in the face of climate change, when, in fact, there is no
    other issue over which they have more personal control or involvement. Two-thirds
    of people in the United States and the United Kingdom and even more in Australia
    agree that individuals can and should actively reduce their personal contribution
    to climate change.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'What is more, changing these personal behaviors may be the key to changing
    attitudes. According to “self-perception theory,” behaviors are an important cue
    for self-image. So, if someone can be persuaded to adopt environmental behaviors,
    she may over time come to identify herself as someone with an environmental worldview.
    Green is as green as green. And green does as green.


    On this basis, the early 2000s, environmental organizations began to focus increasingly
    on the personal responsibility of consumers for climate change. It was a natural
    step for them, combining their long-held interests in consumer advocacy, personal
    responsibility, and ethical lifestyles.


    To bring it home, they distilled personal actions into lists of household hints:
    some of them significant (reducing commuting, installing insulation and efficient
    heating), some of them marginal (not idling the car and turning appliances off
    standby), some of them wildly irrelevant (not using plastic bags and unplugging
    cell chargers). The inclusion of some minor changes was supported by a large and
    verbose academic literature that, in its own, argued that these “easy” steps could
    “spill over” into larger behaviors and that “hooking people with a small request
    provides a “foot in the door,” whereby they can be ushered onto the “virtuous
    escalator.


    Books proliferated telling people to Measure their Carbon Footprint, get Low-Carbon,
    become Eco-Friendly, Save the Earth for a Fever, Tread Lightly on the Earth, Kick
    the Fossil Fuel Habit, go on a Climate Diet. Or go on a Carbon Detox—the title
    of my own contribution to this short-lived and rapidly remainedered eco-toxic
    subgenre.


    Maybe we all went too far and, in our eagerness to find homey messages that would
    engage people, we fell into the wicked trap of limiting climate change through
    the solutions we proposed. An Inconvenient Truth posited climate change as an
    existential threat yet peered out into a string of small options—changing lightbulbs,
    inflating tires, and driving a bit less. The Live Earth concerts in 2007 sought
    to fuel a global movement yet ended up promoting handy household tips. Six months
    after the concerts, I received a perky email from the Live Earth team telling
    me how I could “re-use the heart-shaped candy boxes left over from Valentine’s
    Day as picture frames, earring holders, or backpacks for dolls.'
