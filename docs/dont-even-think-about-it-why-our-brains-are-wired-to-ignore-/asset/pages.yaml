- img_proc: true
  md: 'Because there is no recognition of climate change conviction, there is no language
    of climate change doubt, no one is offering to give us encouragement or to help
    us to “walk though that together.” There is no defense against backsliding and
    denial, and there is no mechanism for coping with grief.


    And so, outside the circles of dedicated environmental activists, is no community
    of belief. There is no social mechanism for sharing it, least of all witnessing.
    People deal with their hopes and fears in isolation, constrained by the socially
    policed sense and given no encouragement other than a few energy-saving consumer
    choices. If Christianity were promoted like climate change, it would amount to
    no more than reading a Gideon’s Bible in a motel chalet and trying to be nice
    to people. The critics are right in this regard—if climate change really were
    a religion, it would be a wretched one, offering guilt and blame and fear but
    no recourse to salvation or forgiveness.


    Guilt is a word that appears all the time around climate change. “Is it me, or
    everyone else feel guilty for being alive too?” wrote Jeremy Burgess in an opinion
    piece in New Scientist. What is missing, Burgess noted, is forgiveness, and failing
    this, “we can only look forward to punishment.


    Sally Weinentre, a psychotherapist, agrees. Without forgiveness, she writes, our
    feelings about climate change will “become stuck in a climate of hatred, bitter
    recrimination and relentlessness, feeling harshly judged and not moving towards
    the reality of the loss.”


    Mechanisms for personal forgiveness are a critical component of the Abrahamic
    religions. In the Christian faith it is the power of God to forgive that leaves
    the door open for personal change. In Judaism the ritual of Al Chet, held on the
    eve of the Day of Atonement, Yom Kippur, enables the recital of sins against oneself,
    and God. Most relevant to climate change, the ritual explicitly regards inaction
    and silence as the moral equivalents of active sin.


    The climate change narrative contains no language of forgiveness. It requires
    people to accept their entire guilt and responsibility with no option for a new
    beginning. Not surprisingly, what happens is that people either reject the entire
    moralistic package or generate their own self-forgiveness through ingenious moral
    licensing.'
