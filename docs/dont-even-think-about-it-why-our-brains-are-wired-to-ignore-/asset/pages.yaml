  md: '# 14


    # Costing the Earth


    # Why We Want to Gain the Whole World

    Yet Lose Our Lives


    Arguments around climate change have always been based on the short-term and long-term
    costs. Advocates of action tend to emphasize the long-term costs of inaction,
    and taking a leaf from the book of health campaigners, stress that there are immediate
    economic benefits from moving to a sustainable economy. Opponents of action play
    the same game in reverse, emphasizing the short-term costs and the painful disruption
    to the status quo while playing down the long-term costs of climate change impacts,
    or rejecting the existence of the problem altogether.


    When the issue first emerged in the early 1990s, arguments for government action
    were often phrased in terms of a cost-benefit analysis. In retrospect, these were
    read as rationalist and almost deliberately evasive of any emotional or ethical
    component. One influential report from 1993 argued that “a comparison between
    the costs of greenhouse prevention and the benefits of avoided warming is the
    backbone of an economically rational greenhouse response.” Another, released around
    the same time by the British Royal Society, argued for an “optimal level of safety
    where the extra cost of any extra reduction [in emissions] just equals its benefits
    but goes no further.”'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'In 2006 Sir Nicholas Stern, the former chief economist of the World, wrote
    the hugely influential *Review of the Economics of Climate Change*, which claims—though
    his critics argue otherwise—to provide a balanced economic evaluation of the short-
    and long-term costs of climate change. From his seven hundred pages of dense analysis,
    Stern produced a key finding: that reducing the greenhouse gas emissions that
    cause climate change will cost us 1 percent of our annual income for the next
    fifty years. However, he warned, if we do not do this, the annual costs from extreme
    climate events will rise to anything from 5 percent to 20 percent of our annual
    income—indefinitely.


    This sounds like an unassailable argument for immediate action—and indeed it would
    be if we evaluated costs in the same way that we weigh benefits. However Daniel
    Kahneman’s research found that we are far more prepared to take risks on losses
    than gains, especially if the losses lie in the future.


    For example, to paraphrase one of Kahneman’s experiments, imagine that you have
    been offered nine hundred dollars. Would you be prepared to take a 90 percent
    chance of boosting it to one thousand dollars with a 10 percent chance of losing
    it? The majority of people say no, then, that is a loss and you are required to
