  md: 'First, that belief is held socially and shared through testimony and witnessing
    with your peers and community. Hunter describes this as “the huge one”: “You have
    the fellowship of fellow believers. That is the encouragement that we need, to
    be around people who have the same interests, the same goals, the same values
