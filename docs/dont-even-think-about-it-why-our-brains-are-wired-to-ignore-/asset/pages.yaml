    # Public Opinion


    Matthew Nisbet and Teresa Myers conducted an exhaustive overview of polling from
    1987–2007, charting the rise and falls in *“Twenty Years of Public Opinion about
    Global Warming.” More recent research can be found in the regular publications
    of the Yale Project on Climate Change Communication, especially its American Mind
    project. Models for segmenting public attitudes can be found in the regular research
    of Yale’s *Six Americas project and the *American Climate Attitudes reports by
    the Social Capital Project.


    # Climate Communications


    On the general communication of climate change, the *Climate Crossroads guide
    by Climate Access is a good introduction. There are a good range of online materials
    at www.talkingclimate.org and www.climatenexus.org, *From Hot Air to Happy Endings
    by Green Alliance is a collection of essays from leading theorists.


    In writing this book I was especially intrigued by Judith Williamson’s masterful
    analysis of the semiotics of climate change in her lecture *“Unfreezing the Truth:
    Knowledge and Denial in Climate Change Imagery” and Gill Eraut’s examination of
    climate change narratives in *Warm Words: How Are We Telling the Climate Story?


    # Other Works by George Marshall and COIN


    My first book, Carbon Detox (2007, Octopus), presents some of my ideas in this
    book in a digital self-help format. The themes are further explored in technical
    reports by my organization, the Climate Outreach Network. Our website, www.talkingclimate.org,
    includes briefings on social norms and metrics, behavior change, and science communication.
    Recent reports include *Climate Silence (and How to Break It) and *After the Floods:
    Communicating Climate Change around Extreme Weather. Regular reports are posted
    at www.climateoutreach.org.uk/resources/'
