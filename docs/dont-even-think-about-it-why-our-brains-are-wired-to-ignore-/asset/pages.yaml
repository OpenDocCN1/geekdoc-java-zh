  md: '# What Did You Do in the Great Climate War, Daddy?


    # Why We Don’t Really Care What Our Children Think


    In 1915 Arthur Gunn, a London printer, was debating whether to join the army.
    He said to his wife, “If I don’t join the forces, whatever will I say to Paul
    if he turns round to me and says: ‘What did you do in the Great War, Daddy??’
    Gunn suddenly realized he had a marvelous slogan for a recruiting poster and passed
    a sketch onto a propaganda artist he had worked with, Savile Lumley. Lumley did
    a fine job, choosing to make the interrogator a little girl. Sitting on her father’s
    lap, a history book on her knee, she asks him this probing question as he stares
    wistfully into the middle distance.


    The moral dilemma that inspired this iconic poster is one of the recurring ethical
    themes in climate change communication. Caring for the welfare of our children
    is one of our strongest evolutionary drives and one of the few concerns that consistently
    overcomes self-interest. On the face of it, giving those children a voice in our
    decisions, especially imagining how they might confront us in the future, should
    be a powerful spur to action.'
  merge: -1
  pgno: 198
- img_proc: true
