    Following the inspiration of John F. Kennedy, who used it in his 1960 presidential
    speeches, Al Gore used weiji as the central theme in his testimony to the U.S.
    Senate on climate change and then in his book Inconvenient Truth. The characters
    for we dominate the front cover of The Death of Environmentalism, a revisionist
    critique of environmentalism by the Breakthrough Institute. The report''s central
