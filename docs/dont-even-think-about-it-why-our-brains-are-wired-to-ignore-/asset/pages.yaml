    The problem is that, in a field normally dominated by technical specialists, weather
    events appear to be well within the range of laypeople''s personal expertise.
    We might be in no position to judge the levels of trace greenhouse gases in the
    atmosphere, or sea levels, or the extent of glaciers, but we all think we know
