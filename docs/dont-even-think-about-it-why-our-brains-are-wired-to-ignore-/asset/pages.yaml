    # # Don’t Even Talk About It!


    # ## The Invisible Force Field of Climate Silence


    I am constantly dropping the term climate change into conversations with strangers.
    I may talk about my own work or relate it to the weird weather or some other issue
    that is hogging a prime spot in their pool of worry. I am very relaxed and casual
    about it—after all, no one wants to find herself sitting next to a zealot on a
    long-distance train journey.


    Really, though, it doesn’t seem to matter how I say it, because the result is
    almost always the same: The words collapse, sink, and die in midday, and the conversation
    suddenly changes course. It is like an invisible force field that you discover
    only when you barge right into it. Few people go that far, because, without ever
    having been told, they have somehow learned that this topic is out-of-bounds.
    This is why they know that if someone else enters this zone, it is a good idea
    to find something new to talk about.


    In America I find that the native friendliness dissipates the instant words climate
    change enter a conversation. If I am talking to a couple, one person will continue
    to talk with me (if it would be rude not to) the other will instantly turn away
    and find some adjacent distraction.'
