    are everywhere; in myths, fables, epics, histories, tragedies, comedies, dances,
    stained-glass windows, films, social histories, fairy tales, novels, science schemata,
    comic strips, conversations, and journal articles. Before we can read and write,
    we have learned more than three hundred stories.


    In his book The Storytelling Animal, Jonathan Gottschall says, "We are, as a species,
    addicted to story. Story is for a human as water is for a fish." The author Phillip
    Pullman, has been among the handful of writers struggling to build stories around
    climate change, says, "After nourishment, shelter, and companionship, stories
    are the thing we need most in the world.


    Stories perform a fundamental cognitive function: They are the means by which
    the emotional brain makes sense of the information collected by the rational brain.
    People may hold information in the form of data and figures, but their beliefs
