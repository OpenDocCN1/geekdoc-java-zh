  md: 'statistical thinking.” And communications specialists such as myself—lo and
    behold—that the main reason why people have not responded to this threat has been
    because of failed communications. If climate change really is the “elephant in
    the room,” it is a pitch-black room, and, like the blind men in the ancient fable,
    we are all feeling different parts of it and drawing our own, culturally biased
    conclusions about what they might be.


    But the ambiguity of climate change extends even wider and threatens to infect
    those things that already seemed most safe, secure, and familiar. It suggests
    that the way of life that we associate with our comfort and the protection of
    our families is now a menace: that our well-meaning actions might hurt the ones
    we love, that gases we have believed to be benign are poisonous, that our familiar
    environment is becoming dangerous and uncertain.


    Drawing on folktales and horror stories, Sigmund Freud, the father of psychoanalysis,
    recognized the destabilizing psychological impact of something that seems to be
    almost familiar, yet is not. He called this das Unheimliche, usually translated
    into English as the “uncanny condition.” Climate change is inherently uncanny:
    Weather conditions, and the highcarbon lifestyles that are changing, are extremely
    familiar and yet have been given a new menace and uncertainty.


    So we have a dangerous combination. Climate change is exceptionally multivalent,
    enabling a limitless range of self-serving interpretation. And it is uncanny,
    creating a discomfort and unease we seek to resolve by framing it in ways that
    give a familiar shape and form. These two factors combine, to add a third term
    to the mix, to make it an exceptionally wicked problem.


    The concept of a “wicked problem” was first formulated in 1973 by Horst Rittel
    and Melvin Webber, urban planners at U.C. Berkeley. Originally they applied the
    concept to policy planning, though in recent years it has gained much wider currency
    it fits so well with intractable global issues such as terrorism, financial crises,
    and of course, climate change, which has often been called the “ultimate” wicked
    problem.


