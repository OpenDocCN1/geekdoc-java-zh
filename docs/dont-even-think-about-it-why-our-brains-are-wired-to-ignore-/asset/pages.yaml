    change.


    Brightiders are particularly prone to this kind of selective quotation. Al-Naimi,
    the Saudi Arabian minister of petroleum, responds to concerns about climate change
    with a quote from bright-side Winston Churchill: “A pessimist sees the difficulty
    in every opportunity; an optimist sees the opportunity in every difficulty.” Martin
    King Jr. is another model of charismatic leadership, and they frequently point
    out that his appeal to the American conscience started with the upbeat beats “I
    have a dream” not “I have a nightmare.”


    Bright-siding, then, is not just an alternative view; it is a narrative antidote
    to the negativity of the apocalypse, in which the real problem is pessimism itself.
    Loving quotes and strong leadership, bright-siders frequently cite FDR’s inaugural
    speech in 1933: “The only thing we have to fear is fear itself.”'
