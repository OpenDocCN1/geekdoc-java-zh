  md: 'So, what are the features of the great religions and how might they be mobilized
    to create sacred values around climate change?

    First—and I do not wish to be an apologist for the violence and coercion that
    often accompanied this process—they have invested heavily in gaining new audiences
    through missionary outreach and proselytizing. Much of the growth of Mormonism
    is due to the high status given to missionary service. Churches have constantly
    experimented with ways to engage new cultures. Consider, for example, how Catholic
    missionaries adopted different tactics for working in China. The Franciscans charged
    in, declaring, "Here is new God." The Jesuits, under the instructions of their
    leader, Matteo Ricci, wore Chinese robes, adopted the Chinese language, and avoided
    all contact with Europeans.


    As religions recruited new members, they developed institutions to maintain a
    community of shared belief through ritual and shared worship. For the pioneering
    sociologist Émile Durkheim, religion was not just a social creation; it was, he,
    society made divine. The reward for belief comes from belonging to the community
    of belief—and the cost of disbelief is social rejection.


    Lakewood Church, by any standards a roaring success in the cultural marketplace,
    is fueled by the irresistible enthusiasm of its mass gatherings. Its critics,
    of which there are many among traditional Christians, see it as being more than
    a weekly rock concert. But it is more intelligent than that. Pastor Joel Osteen
    focuses on relevance—giving people something to take away. He preaches simple
    themes that are directly relevant to people’s lives. Above all, he is upbeat:
    talking about self-esteem, confidence, and, taking a line from Jesus, how you
    can "become what you believe." Go higher in life, he urges, rise above your obstacles,
    live in health, abundance, healing, and victory. And this is why Bob from Nashville
    loves him so much—“you always feel so much better afterward,” he says.


    Receiving God’s blessing and feeling good not exclude talk of environmental responsibility
    or climate change. Northland Church in Longwood, Florida, approaches the scale
    and showmanship of Lakewood while embracing the message of climate change and
    caring for God’s creation. Under the leadership of his charismatic pastor, Joel
    Hunter, Northland has grown into one of the thirty largest churches in the country.
    It'
