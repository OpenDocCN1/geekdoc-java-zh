    # # Speaking as a Layman


    # # Why We Think That Extreme Weather

    Shows We Were Right All Along


    “Unprecedented, unthinkable. The devastation is staggering. I struggle to find
    words.” Choking back his tears, Yeb Saño, head of the Philippine government delegation,
    told the opening session of the November 2013 Warsaw Climate Change Conference
    of the devastation caused when Typhoon Haiyan hit his country three days earlier.
    He announced that he would fast in solidarity with the orphaned, the dead, and
    his own brother, who, had said, still not eaten and had been gathering the bodies
    of the dead with his own hands. “To anyone who continues to deny the reality that
    is climate change, I dare you to get off your ivory tower and away from the comfort
    of your armchair and pay a visit to the Philippines right now.


    Climate change can seem distant, uncertain, and incomprehensible. Saño made it
    seem real, immediate, and deeply moving. These personal stories and strong images,
    compounded by the constant repetition they received though the news media, spoke
    far more strongly to our sense of empathy and direct threat than the abstract
    data of graphs and scientific reports.


    This is why climate change communicators are convinced that extreme weather events
    can, in the words of Elke Weber, an environmental risk specialist at Columbia
    University, “be counted on an extremely'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'effective teacher motivator.” Tony Leiserowitz, director of the Yale Project
    on Climate Change Communication, calls them “teachable moments.” Michael Brune,
    the executive director of the Sierra Club, tells me he sees severe weather as
    a kind of direct action. “Obviously,” he stresses, “not in an organized or manipulative
    way—these are tragic events—but with the same capacity to change consciousness
    and political direction.


    Extreme weather events have already played a major role in the political momentum
    on climate change. In 1988, a severe drought and heat wave across Midwestern states
    provided the backdrop for Dr. James Hansen of NASA to declare in a congressional
    hearing that there was a 99 percent certainty that global warming had already
    started. The rise of consciousness about climate change in Europe led to the signing
    of the Framework Convention on Climate Change in 1992 was helped enormously by
    severe storms in the spring of 1991, which were freely interpreted by the media
    as a warning of the climate change to come.


    Those campaigning for action on climate change do everything they can to keep
    these connections alive in the public’s minds. As mayor of New York City, Michael
    Bloomberg personally approved the cover of the November 1, 2012, *Bloomberg Businessweek*,
    with a picture of Hurricane Sandy and bold text reading, “IT’S GLOBAL WARMING,
    STUPID.” Referring to Hurricane Sandy, Al Gore said, “These storms—it’s like a
    native hike through the Book of Revelation on the news every day now. People are
    now connecting the dots.


    Environment America global warming program director Nathan Wilcox is also convinced
    that “the more Americans see extreme weather events in their backyards, the more
    they will reach out to their politicians for action.” However, his own research
    suggests that the relationship between experience and conviction is far from straightforward.
    In the seven years until 2012, the Great Plains was consistently, and by a wide
    margin, the region most affected by climate-related disasters. Nonetheless in
    the 2010 Senate elections, all the winning Republican candidates for the Plains
    states publicly refuted climate science or opposed action to reduce greenhouse
    emissions.


    Across the entire United States, the state most consistently affected by extreme
    weather has been Oklahoma. In 2008, voters were offered a'
