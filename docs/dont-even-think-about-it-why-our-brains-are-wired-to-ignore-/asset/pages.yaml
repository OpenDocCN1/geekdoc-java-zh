  md: 'Conviction in climate change depends, like the warning of the wolf attack,
    on the perceived authority and honesty of the communicator. No warning will be
    believed once the trust in the communicator is lost. But timing is also essential—after
    all, the boy was not lying; the wolves really were there, they were a real risk,
    and they did come and eat the sheep, but just not when he said they would.


    In 1989 NASA climate scientist James Hansen asked, “Must we wait until the prey,
    in this case the world’s environment, mangled by the wolf’s grip?” He disagreed
    with the wider scientific community that a few cool years might discredit the
    whole issue. “The time to cry wolf is here,” he said.


    Hansen has proven both right and wrong. He was right because “crying wolf” put
    the issue on the international agenda. But the concern that a few cool years could
    undermine trust was well founded. Surface temperatures appear (although the measurements
    are debated) to have leveled off since 2000. Conveniently ignoring the complex
    scientific explanations of what might be happening, this has been widely reported
    to suggest that the original fears were without foundation, often by the same
    newspapers and news programs that reported the original fears lurid exaggerated
    headlines.


    The media is fickle and inconsistent in its coverage. It happily stakes up fears
    on the tried and tested principle “if it bleeds, it leads.” A study of news stories
    about a 2006 Intergovernmental Panel on Climate Change report frequent use of
    the adjectives catastrophic, shocking, terrifying, and devastating, even though
    not one of these words was present in the original document. It is not surprising
    that 40 percent of Americans believe the media exaggerates the threat of climate
    change.


    The climate scientist Michael Mann sees this overstatement as part of the media
    cycle that then denies. “Saying climate change is really bad became state. And
    so journalists felt they had to find a new narrative that they ironically had
    helped create, that the science had been overstated.”


    Talking to scientists, I sense they are not concerned with the distortion of the
    data but also feel deeply uncomfortable with the construction of the disaster
    narrative itself. Their definition of professional integrity requires the production
    of a well-balanced product stripped of all'
