  md: 'However


    The impacts of climate change are hardly in the future either. I write this after
    the 350th month in a row that is warmer than that month’s historical average.
    Although temperatures vary from year to year, the trend is also very clear.


    Scientists, though, always stress the importance of natural variability in climate
    systems and only start to express confidence in their models in the time horizon
    most people see as being beyond their immediate concerns—typically 2050, a date
    that researchers have found to be so far in the future as to be “almost hypothetical”
    for the general public.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Politicians are all too happy to talk about climate change in these terms so
    that they can postpone difficult decisions as far into the future possible. Western
    governments, in particular, wish to look forward and have no desire to remind
    anyone of their historical responsibility for two hundred years of emissions from
    industrial growth and land clearance.


    So climate change is a future problem. But it is also a past problem and a present
    problem. It is better thought of as a developing process of long-term deterioration,
    called, by some psychologists, a “creeping problem.” The lack of a definite beginning,
    end, or deadline requires that we create our own timeline. Not surprisingly, we
    do so in ways that remove the compulsion to act. We allow just enough history
    to make it seem familiar but not enough to create a responsibility for our past
    emissions. We make it just current enough to accept that we need to do something
    about it but put it just too far in the future to require immediate action.'
