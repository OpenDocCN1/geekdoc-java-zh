    The church then becomes a safe place to admit to personal problems and struggles
    with belief and doubt. “We have to make an environment—excuse the pun—where we
    fully acknowledge that everything is going to have doubts and struggles, and everybody
    is going to have encouragement. We see if we can help with that and we walk through
    together.”


    Second, that people can be brought to a commitment at a moment of choice. As God
    says to the people of Israel, “I have set before you life and prosperity, death
    and destruction, blessings and curses . . Now choose life, so that you and your
    children may live.” Evangelism seeks to generate a moment when people actively
    choose to commit themselves to their faith in a public context that sets a social
    norm for others. The outreach crusades of the greatest evangelist Billy Graham
    would culminate in an altar call in which new people were invited to step forward
    to receive a special blessing. It’s a simple but very effective device to break
    the bystander effect. As Hunter says, “Even if you are a little tentative, you
    see all these people going forward and you think, ‘I have nothing to fear. I will
    be with them. I’m not left to my own devices. I want to join the movement.”


    And, Hunter need not the altar, call is also a point at which the church can identify
    potential new members and then welcome and support them. Evangelical outreach,
    as the highly successful ‘I Found It’ advertising campaign in the 1970s, always
    directs people to make personal contact through their local church. Environmental
    outreach around climate change, on the other hand, invariably directs people to
