  \n}\n\npublic BloodSugarLevel(String exam, Date date){\n\nsuper(exam, date);\n\n\
  }\n\n}\n```\n\n`BloodPressure` 类：\n\n```java\npublicclass BloodPressure extends\
  \ LaboratoryExamination{\n\nprivate int upperValue;\nprivate int lowerValue;\nprivate\
  \ int pulse;\n\npublic BloodPressure(String exam, Date date, int upper, int lower,\
  \ int pulse){\n\nsuper(exam, date);\nthis.upperValue = upper;\nthis.lowerValue =\
  \ lower;\nthis.pulse = pulse;\n\n}\n\npublic BloodPressure(String exam, Date date){\n\
  \nsuper(exam, date);\n\n}\n\n}\n```\n\n在我们制作最后的用于操作检查的方法之前，我们需要一个持有 `Patient`、`Doctor`\
  \ 和 `LaboratoryExamination` 类引用的类。你稍后会看到为什么，所以创建一个 `PatientDoctorExamination` 类：\n\
  \n```java\nprivate Doctor doctor;\n\nprivate Patient patient;\nprivate LaboratoryExamination\
  \ labExam;\n\npublic PatientDoctorExamination(Doctor doc, Patient pat, LaboratoryExamination\
  \ ladExamination){\n\nthis.doctor = doc;\nthis.patient = pat;\nthis.labExam = ladExamination;\n\
  \n}\n```\n\n\n\n\n\n让我们完成 `Hospital` 类。像处理人员类一样，我们需要 `HashMap` 来处理检查项目：\n\n```java\n\
  private Map<Integer, PatientDoctorExamination>examinations = new HashMap<Integer,\
  \ PatientDoctorExamination>();\n```\n\n在这里你可以看到之前定义的 `PatientDoctorExamination`\
  \ 类的用法。此外，我们还需要一个能够存储检查项目的结构。为了这一点，让我们在 `Hospital` 类中使用 `enum`：\n\n```java\npublic\
  \ enum laboratoryExaminations{\n    bloodPressure,\n    bloodSugarLevel,\n}\n```\n\
  \n好了，但像往常一样，我们需要对我们的数据（即检查项目）进行一些操作。方法需要根据输入将检查项目放入 `HashMap` 中。我们将使用之前涵盖过的另一个点\
  \ `switch`，因此为 `Hospital` 类中添加该方法：\n\n```java\nprivate int examID;\n\npublic int\
  \ ScheduleExamination(Doctor doctor, Patient patient, Date date, laboratoryExaminations\
  \ examinationsLab){\n    LaboratoryExamination examination = null;\n    switch(examinationsLab){\n\
  \        case bloodPressure:\n            examination = new BloodPressure(examID,\
  \ date);\n            break;\n        case bloodSugarLevel:\n            examination\
  \ = new BloodSugarLevel(examID, date);\n            break;\n    }\n    examinations.put(examID,\
  \ new PatientDoctorExamination(doctor, patient, examination));\n    examID++;\n\
  \    return examination.examinationID;\n}\n```\n\n为了使 `Hospital` 类具备功能，我们需要做的最后一件事就是以某种方式创建最终执行检查的方法。这将在下面的代码中展示：\n\
  \n```java\npublic void FillBloodSugarLevelExamination(int examinationID, double\
  \ value, Date date){\n    PatientDoctorExamination patientDoctorExamination = null;\n\
  \    patientDoctorExamination = examinations.get(examinationID);\n    if(patientDoctorExamination\
  \ != null){\n        if(patientDoctorExamination.getLabExam() instanceof BloodSugarLevel){\n\
  \            BloodSugarLevel bloodSugarLevel = (BloodSugarLevel)patientDoctorExamination.getLabExam();\n\
  \            bloodSugarLevel.setValue(value);\n            bloodSugarLevel.setLastMealTime(date);\n\
  \            log.info(\"Examination is successfully done! \\n\" +\"=======\\n\"\
  + \"value: \" + value + \", last meal time: \" + date);\n        }else\n       \
  \     log.info(\"Selected examination is not for blood sugar level!\");\n    }else\n\
  \        log.info(\"Selected examination does not exist!\");\n}\n\npublic void FillBloodPressureExamination(int\
  \ examinationID, int upperValue, int lowerValue, int pulse){\n    PatientDoctorExamination\
  \ patientDoctorExamination = null;\n    patientDoctorExamination = examinations.get(examinationID);\n\
  \    if(patientDoctorExamination != null){\n        if(patientDoctorExamination.getLabExam()\
  \ instanceof BloodPressure){\n            BloodPressure bloodPressure = (BloodPressure)patientDoctorExamination.getLabExam();\n\
  \            bloodPressure.setUpperValue(upperValue);\n            bloodPressure.setLowervalue(lowerValue);\n\
