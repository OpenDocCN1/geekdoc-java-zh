  \        log.info(\"Selected examination does not exist!\");\n}\n```\n\n现在，当所有特征和条件都满足后，剩下的工作就是创建一个包含\
  \ `main` 方法的类，以查看程序的输出。希望你没有忘记除了 `Hospital` 之外的所有类都应该在 `model` 包中。`Hospital` 类和现在创建的\
  \ `ProgramHospital` 类放在 `program` 包中。在创建此类时，添加 `main` 方法以及以下内容：\n\n```java\norg.apache.log4j.BasicConfigurator.configure();\n\
