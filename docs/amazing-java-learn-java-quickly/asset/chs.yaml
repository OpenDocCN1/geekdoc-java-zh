  \ assignToPatient(Doctor doctor, Patient patient){\n\npatient.assignDoctor(doctor);\n\
  \n}\n```\n\n### 检查\n\n现在是处理检查了。每个检查都有 ID 和 `date` 共同属性，因此在这种情况下可以使用抽象类的概念。`LaboratoryExamination`\
  \ 将是我们的抽象类：\n\n```java\npublicabstract class LaboratoryExamination {\n\npublic String\
  \ examinationID;\npublic Date date;\n\npublicLaboratoryExamination(String exam,\
  \ Date date){\n\nthis.examinationID = exam;\nthis.date = date;\n\n}}\n\n不要忘记生成 getter\
  \ 和 setter，还要导入 `java.util.Date` 类。我们还没有讨论这个，但编译器会提示导入 `Map`、`HashMap` 和 `Hospital`\
  \ 类到 `Doctor` 和 `Patient` 类中。只需执行。\n\n`BloodSugarLevel` 类：\n\n```java\npublicclass\
  \ BloodSugarLevel extends LaboratoryExamination{\n\nprivate double value;\nprivate\
  \ Date lastMealTime;\n\npublic BloodSugarLevel(String exam, Date date, double value,\
