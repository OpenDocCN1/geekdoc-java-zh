    x = 2


    y = 4Operator        Result


    ((x< 1) && (y > 3))false


    ((x< 5) || (y = 5))true


    !(x > y)true


    # Chapter 2\. Java Output


    Class System is used for printing to console some text. Let`s try it on most famous
    example of your first Java program, Hello World! To do this we need to set up
    our Java project. First open Eclipse. Creating project in Eclipse is very simple
    File ->New ->Java Project. Name project as FirstJavaProject and then click Finish.


    In our project press right click on src folder and create a new package by New
    ->Package. Name package as first.pack.


    Note: Packages are used for better organization of Java classes. In this case
    we build our own classes, but there are many build-in classes which need some
    packages to import (java.io, java.util etc).


    All operations in Java are made in classes. To create them, right click on package
    New ->Class and name it as JavaClass. Check public static void main (String[]args)
    and click Finish.


    Note: public static void main (String[]args) is method which will be explained
    later. For now, it is enough to know that in main method are called all other
    methods in your Java application. This and every other code is supposed to be
    putinside main method.


    System.out.println("Hello World!");


    Our program should look like this:


    ![](images/00007.jpeg)


    Note: There is a one little trick to print this faster. Type syso, hold ctrl and
    press space. Then press Enter.


    Ok, now this need somehow to be started. To do that pressRun ->Run As ->Java Application.


    expected: Hello World! will be printed to console


    We learned how to print some massages to console. Let`s now use what we already
    covered and make some mix with primitive types.  Create a new class called PrintPrimitiveTypes
    and add main method.


    Add following lines inside main method:


    inta = 2;


    doubleb = 3.14;


    System.out.println("1\. Old value of b = " +b);


    b = a;


    System.out.println("2\. New value of b = " +b);


    Run application.


    expected: 1. Old value of b = 3.14 will be printed to console.


    2\. New value of b = 2.0


    Note: Try it with other operators. For example:


    intc = 4;


    b = c * 3.14;


    System.out.println("3\. New value of b = " +b);


    As you can see here is used + operator to chain text with integer. Try to make
    new examples on your own to feel more comfortable with code writing.


    ## Control Flow Statements


    ### IF


    if(condition)


    action


    else


    another action


    Now we will do some simple example of IF usage. Make a new class ControFlow and
    add following lines:


    inta = 10;


    if(a< 11) {


    System.out.println("A is less than 10");


    }


    else {


    System.out.println("A is not less than 10");


    }


    expected: A is less than 10 will be printed to console.


    Let`s make it a little more difficult. Just like in a real life, you can provide
    more than one condition for any situation. In this case, it is made by adding
    else if statement. Add following lines to current classand run it :


    intb = 15;


    if (b == 13)


    System.out.println("b == 13");


    elseif ((b<=17) && (b>= 12))


    System.out.println("b is less than or equal to 17 and greater than or equal to
    12");


    else


    System.out.println("b is not any from this");


    expected: b is less than or equal to 17 and greater than or equal to 12 will be
    printed to console.


    Program first checks if b == 13, it is not, then checks another condition which
    is true and print it to console. If this condition was also false, then last one
    sentence will be printed. Try to make another condition on your own to see output.
    You can see that statement works fine also without curly braces.


    Now we got idea how to make a simple program in Java. Let`s solve this problem.
    Imagine that you had test in your school. You got some score and grade. Try to
    make program, using if statement, to check which grade you got based on your score.


    Note: First you need to declare two variables score and grade, like this:


    intgrade;


    intscore = 85;


    Try it yourself firstly, think about conditions. Here is solution:


    if (score>= 95)


    grade = 10;


    elseif (score>= 85)


    grade = 9;


    elseif (score>= 75)


    grade = 8;'
