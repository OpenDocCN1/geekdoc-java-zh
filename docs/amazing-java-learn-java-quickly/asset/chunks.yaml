  trans: "\n\n![](img/00014.jpeg)\n\n```\nb = a;\n```\n\n![](img/00015.jpeg)\n\n`Operator=`\
    \ 只是复制引用，而不是对象。\n\n## 构造函数 (Constructors)\n\n构造函数用于初始化对象。构造函数在创建对象时被自动调用，并且名称必须与类名相同。构造函数有两种类型：\n\
    \n- 默认构造函数（无参构造函数）\n\n对于我们的代码，我们需要一个带有 `main` 方法的新类 `Student`。在该方法内部，像这样创建一个新的\
    \ `Student` 对象：\n\n```java\nStudent stud = new Student();\n```\n\n构造函数是特殊方法，所以我们在\
    \ `main` 方法之外创建它们：\n\n```java\nStudent() {\n\n}\n```\n\n注意：如果没有创建默认构造函数，编译器将默认创建一个。为了确保构造函数被调用，让我们在它内部留一些信息并运行程序：\n\
    \n```java\nStudent() {\n    System.out.println(\"Student is created!\");\n}\n\
    ```\n\n预期：控制台将打印 `Student is created!`。\n\n- 参数化构造函数\n\n为了这个目的，我们需要 `Professor`\
    \ 类（不带 `main` 方法）和 `Faculty` 类（带有 `main` 方法）。`Professor` 类将包含属性、方法以及参数化构造函数：\n\
    \n```java\nString name;\nint age;\nString city;\n\nProfessor(String n, int a,\
    \ String c) {\n    this.name = n;\n    this.age = a;\n    this.city = c;\n}\n\n\
    void print() {\n    System.out.println(name + \" \" + age + \" \" + city);\n}\n\
    ```\n\n注意：`this` 关键字意味着我们在引用当前对象。当前对象是我们正在使用的类中的对象。\n\n现在我们想让它运行起来。你记得方法和构造函数什么时候被调用吗？当然是在创建对象时。所以在\
    \ `Faculty` 类中这样做并运行程序：\n\n```java\nProfessor prof = new Professor(\"Ivan\", 35,\
    \ \"Moscow\");\nprof.print();\n```\n\n预期：控制台将打印 `Ivan 35 Moscow`。\n\n这个示例地展示了参数化构造函数的用法。尝试删除\
    \ `Professor` 对象的参数。这会导致某些错误：构造函数 `Professor()` 未定义。\n\n### 方法 (Methods)\n\n```\n\
    modifier return_type name (parameters) {\n    body\n}\nreturn\n```\n\n我们已经涵盖了方法并学会了如何编写大部分方法。但并不是所有方法都是相同的。对于这一点，我们需要一个带有\
    \ `main` 方法的 `Area` 类。首先解释带有 `return` 关键字的方法：\n\n```java\npublic static int countArea(int\
    \ width, int height) {\n    return width * height;\n}\n```\n\n`public static`\
    \ – 修饰符，稍后会解释。\n`int` – 返回类型。\n\n这个方法需要被调用。在这种情况下，我们的目标是打印 `width * height` 的结果。为了做到，`println`\
    \ 将帮助我们，所以这段代码将放在 `main` 方法内部：\n\n```java\nSystem.out.println(countArea(3, 5));\n\
    ```\n\n预期：控制台将打印 `15`。\n\n### Void\n\n正如我们看到的，带有 `return` 关键字的方法会返回某个值。该值以后可以用于某些操作。但如果我们不想返回任何内容呢？只是为了打印任何消息或类似的内容。如何制作这种方法？我们需要一个实现了\
    \ `main` 方法的 `VoidMethods` 类。我们的方法将检查输入并根据该条件打印相关结果。尝试自己制作，如果你卡住了，请看这段代码：\n\n\
    ```java\nstatic void seasonOfYear(String s) {\n    if(s == \"Spring\") {\n   \
    \     System.out.println(\"It is spring!\");\n    } else if (s == \"Summer\")\
    \ {\n        System.out.println(\"It is summer!\");\n    } else if (s == \"Autumn\"\
    ) {\n        System.out.println(\"It is autumn!\");\n    } else if (s == \"Winter\"\
    ) {\n        System.out.println(\"It is winter!\");\n    } else {\n        System.out.println(\"\
    You made mistake, sorry\");\n    }\n}\n```\n\n并不难发现我们有一个 `String` 参数，它在方法被调用时根据输入被。因此，在我们的\
    \ `main` 方法内部，我们需要调用 `seasonOfYear(String s)` 方法：\n\n```java\nseasonOfYear(\"\
    Summer\");\n```\n\n预期：控制台将打印 `Summer`。\n\n# 第 6 章 访问修饰符 (Access Modifiers)\n\n\
    - `public` – 对所有类可见\n- `protected` – 在包和子类内可见\n- `private` – 仅在类内部可见\n- `default`\
    \ (默认) – 当没有修饰符时，被视为默认，并在包内可见\n\n从这里我们可以得出，我们的方法（例如 `public` 方法）在整个项目中是可以访问的。但其他修饰符呢？如何处理它们？现在我们将看一个\
    \ `private` 修饰符的示例。\n\n首先添加两个类 `PrivateClass` 和 `TestClass`（带有 `main` 方法）。在第一个类中，我们创建一个会被调用的简单方法：\n\
    \n```java\nprivate void methodOne() {\n    System.out.println(\"Method is called!\"\
    );\n}\n```\n\n在第二个类中调用此方法首先需要一个对象。在这种情况下，我们将创建一个 `PrivateClass` 类的对象，就像这样：\n\n\
    ```java\nPrivateClass pc = new PrivateClass();\npc.methodOne();\n```\n\n报错：类型\
    \ `PrivateClass` 的方法 `methodOne()` 不可见。\n\n这就是我们所说的。方法是私有的，所以只在类内部可见。我们无法从另一个类访问它。要解决这个问题，点击错误并将\
    \ `methodOne()` 的可见性改为 `package`：\n\n```java\nvoid methodOne() {\n    System.out.println(\"\
    Method is called!\");\n}\n```\n\n这是 `default` 修饰符。如果我们将其改为 `public` 会发生什么？\n\n\
    ```java\npublic void methodOne() {\n    System.out.println(\"Method is called!\"\
    );\n}\n```\n\n没有变化。公共方法在整个项目中都是可见的。现在改为 `protected`。\n\n```java\nprotected void\
    \ methodOne() {\n    System.out.println(\"Method is called!\");\n}\n```\n\n一样。保护方法在包内可见。\n\
    \n## this\n\n在我们之前的章节“构造函数”中，如果你记得 `this` 关键字被使用了。我们有几个属性 name、age 和 city。`this.name\
    \ = n;` `this.age = a;` `this.city = c;` `static` 字段属于类 `prof = new Professor();`\
    \ 静态字段属于我们将讨论的类。\n\n# 第 7 章 静态 (Static)\n\n我们涵盖的所有属性和方法都属于某个对象，例外。你记得 `seasonOfYear()`\
    \ 方法吗？区别在哪里？当然，方法带有 `static` 修饰符，但这意味着什么？是否有任何对象被调用该方法？没有。所以，静态字段和方法属于类，而不是对象。\n\
    \n如果一个变量需要被 Java 类的所有对象共用，那么它应该是静态变量（类变量）。所有实例共享同一个变量副本。静态变量只初始化一次。\n\n就像静态变量一样，静态方法属于类而不是对象。静态方法通过类名调用。是时候看一些静态的示例了。创建一个\
    \ `StaticClass`，它将包含这些字段：\n\n```java\nint val = 3;\nstatic int val2 = 4;\n\nstatic\
    \ void changeValue() {\n    val2 = 6;\n    System.out.println(val2);\n}\n\nstatic\
    \ void print() {\n    System.out.println(\"Static method calling!\");\n}\n```\n\
    \n"
- fmt: "\nSo, in our main method we will call static methods:\n\n```\nStaticClass.print();\n\
    StaticClass.changeValue();\n```\n\nexpected: Static method calling! Will be printed\
    \ to console 6\n\nLet`s now change `val2` to `val` inside `changeValue()` method.\
    \ What will happen? It is complaining: `Cannot make a static reference to the\
    \ non-static field `val`. It is because static method can only access static fields.\
    \ There is also another way for calling static methods, result will be same:\n\
    \n```\nprint();\nchangeValue();\n```\n\nNow when we covered everything that is\
    \ needed, our famous `main` method can be explained in total.\n\n- `public` –\
    \ method is visible in whole project.\n- `static` – method belong to class. Reason\
    \ why `main` is static is because it can be ambiguity, compile doesn`t know which\
    \ constructor to call.\n- `void` – method doesn`t return any value.\n\nOk, let`s\
    \ see now one very interesting example:\n\n```\nstatic{\n    System.out.println(\"\
    static\");\n}\n\npublicstaticvoid main(String[] args) {\n    System.out.println(\"\
    main\");\n}\n```\n\nexpected: static will be printed to console\nmain\n\nHow this\
    \ happens? Aren`t we said that methods are executing in main method? This is called\
    \ static block. Static block will be executed when a class is first loaded into\
    \ the [JVM](https://crunchify.com/how-to-change-jvm-heap-setting-xms-xmx-of-tomcat/),\
    \ even before main method.\n\nOutput of this program will be random number from\
    \ 0 to 1:\n\n```\nSystem.out.println(\"Random number: \" + Math.random());\n```\n\
    \nBut, how is this working? Just like `System.out.println();`.\n\n`java.lang.System`\n\
    \n`java.land.Math`\n\nBoth classes have their static methods that can be called.\
    \ They don`t need object so it is simplified. So, methods that we already commonly\
    \ used, `out()`, is static method from class `System`, on which class name is\
    \ called. It is same with `random()` method from `Math` class. Try to use other\
    \ methods like this:\n\n```\nint a = 4;\nint b = 2;\ndouble c = 2.4;\nSystem.out.println(\"\
    Minimum is: \" + Math.min(a, b));\nSystem.out.println(\"Maximum is: \" + Math.max(a,\
    \ b));\nSystem.out.println(\"Pow of c is: \" + Math.round(c));\n```\n\n# Chapter\
    \ 8. Collections\n\nCollections are used to store and manipulate the group of\
    \ objects. Here is shown hierarchy of Collection classes and interfaces. We will\
    \ cover ones that are commonly used.\n\n![](images/00016.jpeg)\n\nArrays have\
    \ one disadvantage. Ones they are create, it is impossible to change their size.\
    \ This problem are solving Collections.\n\n- `List` – list of objects which is\
    \ ordered. Objects are accessible by index. It is possible to have two same objects.\n\
    - `Queue` – is ordered just like List, difference is that new elements are added\
    \ at the end and removed from the beginning from the queue.\n- `Set` – all elements\
    \ are unique.\n- `Map` – is not type of Collection interface. Elements are mapped\
    \ by key/value.\n\nMost of this Collections are located in `java.util` package.\n\
    \nCommon methods for all Collections are:\n- Adding elements\n- Removing elements\n\
    - Iteration through elements\n\nOnce we cover a few Collections it would be easier\
    \ to look at JavaDoc and figure out how rest of them works. For now we will focus\
    \ on `List` and `Map`, it is biggest chance to have need for them. `Queue` and\
    \ `Set` are not that usually used, but from experience with this both it would\
    \ be easy to handle them. Also, don`t get confused, interfaces are covered in\
    \ one of next sections.\n\n### ArrayList\n\n`ArrayList` represents dynamic Collection.\
    \ Methods for manipulating elements are:\n\n- `add()` – for adding element to\
    \ `ArrayList`\n- `remove()` – for removing elements from `ArrayList`\n- `get()`\
    \ – for getting elements from `ArrayList`\n\nIt is time to see some example of\
    \ `ArrayList`. So, let`s create a new package `third.pack` and class `Array` inside.\n\
    \n```\nArrayList<Integer> ar = new ArrayList<Integer>();\nar.add(1);\nar.add(2);\n\
    ar.add(3);\nSystem.out.println(\"Size of ArrayList is: \" + ar.size());\nar.remove(0);\n\
    int num = ar.get(0);\nSystem.out.println(num);\nSystem.out.println(\"New size\
    \ of ArrayList is: \" + ar.size());\n```\n\nexpected: Size of ArrayList is: 3\
    \ will be printed to console\n2\nNew size of ArrayList is: 2\n\nSo, in our code\
    \ is used everything that is mentioned about `ArrayList`. First it is declared.\
    \ We said that arrays have one big disadvantage, they are not supposed to change\
    \ they size. But as you can see, our `ArrayList` is dynamic, three elements are\
    \ added(Size of ArrayList is: 3). Compiler count elements from 0, so `1 = 0`,\
    \ `2 = 1`, `3 = 2`. It is important to remember that because of manipulation of\
    \ elements. Another operation is removing first element from our array. Variable\
