  trans: "\n\n检查异常：需要被 `try/catch` 块捕获。例如：`FileNotFoundException`、`SQLException`。\n\
    \n错误：表示某些严重问题。例如：`OutOfMemoryError`。我们不应该尝试处理它们。\n\n## 封装\n\n封装与访问修饰符相关的术语。假设你有一个带有属性的类。一切都可以运行得很好，但在数据不安全方面可能会出现问题。这是因为别人可以访问你的类并进行更改。因此，为了使这种情况不再并对类内部的数据进行完全控制，`getters`\
    \ 和 `setters` 将对你有帮助。看示例，首先创建一个新的 `fourth.pack` 包，并在其中创建 `Person` 类。我们的 `Person`\
    \ 类将拥有 `name` 和 `age` 属性，它们被声明为 `private`。\n\n```java\nprivate String name;\n\
    private int age;\n```\n\n现在我们需要打开 `Source -> Generate Getters and Setters`。\n\n\
    最后一步是检查 `name` 和 `age` 字段并按 `OK`。\n\n预期：将生成 Getters 和 Setters。\n\n所以，如你所见，我们的属性保持为\
    \ `private`（仅类内部可见），而我们生成的方法（`getters` 和 `setters`）是 `public`。我们让我们的类更安全了。\n\n\
    ```java\npublic String getName() {\n    return name;\n}\n\npublic void setName(String\
    \ name) {\n    this.name = name;\n}\n```\n\n查看 `getName()` 方法。如果由于原因我们需要 `name`，我们将调用此方法，它会返回\
    \ `name`。我们的属性没有被碰。`setName(String name)` 方法也是如此。它通过 `this` 关键字引用来更改 `name` 的值。\n\
    \n## 抽象类\n\n你还记得我们提到过 `Professor` 和 `Student` 这样的类吗？它们是相关的实体，并且我们的示例中有一些共同属性，如\
    \ `name`、`age` 和 `city`。那么，为什么要反复声明这些属性呢？难道拥有一个包含所有数据、属性和方法的基类，并将其共享给所有需要的类不是更好吗吗？当然是。做到点的类被称为\
    \ `abstract class`（抽象类）。要让之前的 `Professor` 类变成抽象类，在它的名称上添加 `abstract` 声明：\n\n```java\n\
    public abstract class Person\n```\n\n抽象类不能实例化。此外，如果类中至少有一个抽象方法，该类就会自动成为抽象类。抽象方法是没有实现且被声明为\
    \ `abstract` 的方法：\n\n```java\nabstract void run();\n```\n\n注意：为类 `Person` 创建带参数的构造函数，包含上述属性并生成\
    \ getters 和 setters。还不要忘记添加 `run()` 方法。\n\n现在我们有了第一个抽象类。下一步是创建一个使用来自 `Person`\
    \ 类字段的类。再次让它成为 `Student` 类。为了让 `Person` 类可用，我们需要 `extends` 声明：\n\n```java\npublic\
    \ class Student extends Person\n```\n\n现在我们的 `Student` 类继承（共享）了 `Person` 的所有字段，但我们也可以为\
    \ `Student` 添加一些特定的属性。此外，构造函数现在看起来像这样：\n\n```java\nprivate int[] grades;\n\nStudent(String\
    \ name, int age) {\n    super(name, age);\n    this.grades = new int[5];\n}\n\
    ```\n\n这里对我们来说是新的`super` 关键字意味着我们的构造函数引用了它的父类。所以我们扩展了 `Person` 类，它拥有 `name` 和\
    \ `age` 属性。这些属性在类中没有再次声明。此外，你现在可以识别出一个数组接收 `int` 值且大小为 5。\n\n注意：你可以看到编译器一直在报错：`The\
    \ type Student must implement the inherited abstract method Person.run()`。\n\n\
    这是因为我们还需要实现来自父类（`Person`）的 `run()` 方法。\n\n```java\n@Override\nvoid run() {\n \
    \   System.out.println(\"Student runs!\");\n}\n```\n\n注意：`@Override` 声明意味着方法派自父类。非常重要的一点是，类只能继承一个抽象类。\n\
    \n# 第 9 章 接口\n\n接口不是类。它们只包含实现该接口的类需要具备的方法和属性。你可以看出与抽象类的第一个区别是，接口是通过 `implements`\
    \ 关键字实现的，而不是 `extends`。所有方法都是隐式的 `public`，所有属性都是隐式的 `public static final`。现在让我们通过右键点击当前包\
    \ `New -> Interface` 来创建我们的第一个接口并将其命名为 `House`。我们将添加以下行：\n\n```java\nString bed\
    \ = \"My bed\";\nvoid sleep();\n```\n\n```\n\n如你所见，我们的方法 `sleep()` 没有实现。这是因为我们目前不需要知道方法必须如何实现。为了更好地理解，假设你有一个接口\
    \ `Vehicle`，其中包含 `start()` 和 `stop()` 等方法，以及实现该接口的类如 `Car`、`Bicycle` 和 `Airplane`。在创建\
    \ `Vehicle` 接口时，你只知道未来会有某些不同类型（正如我们提到的），但你实际上不知道它们是如何工作的，因为所有工作方式都不同。可以这样去思考接口。\n\
    \n但是，从 Java 8 开始，接口发生了变化。现在你可以拥有 `default` 方法：\n\n```java\ndefault void watchTV()\
    \ {\n    System.out.println(\"I am watching TV\");\n}\n```\n\n正如你所料的，这意味着现在接口更类似于抽象类。一个非常重要的一点是，你可以实现多个接口，而只能继承一个类。\n\
    \n抽象类和接口都使用继承。继承是代码复用的类型。这非常有用，因为在开发中你会遇到某些具有某些属性的情况。当类被扩展或接口被实现时，子类需要重写所有方法。为什么我们说只能继承一个类？\n\
    \n![](img/0018.jpeg)\n\n类 `A` 是父类，类 `D` 继承了类 `B` 和类 `C`，它们具有相同的签名 `doStuff()`\
    \ 但编译器应该选择哪一个？这种情况是 Java 创建者没有//多重继承的原因。这被称为菱问题。\n\n注意：继承是一种关系，`Student` 是 `Person`；`Car`\
    \ 是 `Vehicle`。\n\n## 关联、聚合与组合\n\n![](img/0019.jpeg)\n\n当两个对象相互关联时，它们处于关联状态。组合和聚合都是关联的类型。\n\
    \n## 组合\n\n继承并不是代码复用的唯一类型。组合是另一种，它是类之间的关系。在继承中，组合是代码复用的主要技术。组合是一种部分无法离开整体的关系。\n\
    \n```java\npublic class Thought {\n}\n\npublic class Brain {\n    Thought thought\
    \ = new Thought();\n}\n```\n\n`Brain` 拥有一个 `thought`。`Thought` 无法离开 `brain` 而存在。组合的关系比聚合强。\n\
    \n## 聚合\n\n聚合的关系比组合要弱。在聚合中，部分可以脱离主对象存在。例如：`Bed` 和 `Pillow`。\n\n```java\npublic\
    \ class Pillow {\n}\n\npublic class Bed {\n    public List<Pillow> pillows = new\
    \ ArrayList<Pillow>();\n}\n```\n\n## 重写与重载\n\n### 重写\n\n重写是我们在示例中已经见过的术语。如果子类中的方法与父类方法具有相同的名称和相同的输入参数，那么我们就拥有重写。它的用途是更改我们子类中的实现。你还记得车辆的示例吗？当\
    \ `start()` 方法派生到子类 `Car` 或 `Airplane` 时，实现是不同的。`Car` 和 `Airplane` 的引擎完全不同。\n\n\
    ```java\nvoid start() {\n    System.out.println(\"Starting car engine\");\n}\n\
    \nvoid start() {\n    System.out.println(\"Starting airplane engine\");\n}\n```\n\
    \n注意：当方法体内部只有 `println` 时，可能可能会让人有点困惑。这些只是简单的示例，在实际开发中会有一些逻辑之类的内容。\n\n### 重载\n\
    \n"
- fmt: "\nIn overriding section we said that derived methods have same input parameters.\
    \ If you didn`t figured out input parameters are inside curly braces of method\
    \ declaration like: `(String n, int a)`. That is not case with overloading. Methods\
    \ are overloaded when they have same signature but different input parameters,\
    \ of course in same class. We will explain this on constructor overloading. For\
    \ example, make class `StudentClass` and add attributes `name`, `age` and `diploma`:\n\
    \n```java\nprivate String name;\nprivate int age;\nprivate String diploma;\n\n\
    StudentClass(String n, int a) {\n    this.name = n;\n    this.age = a;\n}\n\n\
    StudentClass(String n, int a, String d) {\n    this.name = n;\n    this.age =\
    \ a;\n    this.diploma = d;\n}\n```\n\nConstructors are overloaded. But what is\
    \ usage of this? Imagine that you have class `Faculty` that manages with students.\
    \ Not all students are same. Until finishing studies student don`t have diploma,\
    \ so if you need some operations with students like this constructor without diploma\
    \ parameter will be used. On another hand, if you want to store students that\
    \ are finished studies to some document, constructor with diploma parameter will\
    \ be useful. Beside constructors, methods also could be overloaded:\n\n```java\n\
    void doSomething(String a) {\n    System.out.println(\"Print a: \" + a);\n}\n\n\
    void doSomething(String a, String b) {\n    System.out.println(\"Print both a\
    \ and b: \" + a + b);\n}\n```\n\nBoth overriding and overloading are types of\
    \ polymorphism. Polymorphism means that one method can do different things based\
    \ on used object. Polymorphism in Java have two types:\n\n### Compile time polymorphism\n\
    As we already sad, compile time is time while you type your code and compiler\
    \ automatically recognized if you have some errors. So, compile time is decided\
    \ in that time. Perfect example of this type of polymorphism is overloading. Compile\
    \ time polymorphism is also called static binding.\n\n### Runtime polymorphism\n\
    \nOverriding is type of runtime polymorphism. Unlike static binding, this type\
    \ of polymorphism is called dynamic binding. From name you can guess that an overridden\
    \ method is recognized at runtime. Upcasting is when reference variable of parent\
    \ class refers to the object of child class we. `JVM` decides about overriding\
    \ methods, not compiler.\n\nNote: `JVM` (Java Virtual Machine) is an abstract\
    \ machine that enables you to run a Java program on computer.\n\n## Subheading\
    \ 1\nChapter Text\n\n### Sub Subheading\nChapter Text\n\n# Chapter 10. Design\
    \ Patterns\n\n## Singleton Pattern\n\nSingleton pattern is one of most commonly\
    \ used design patterns. He belongs to creational pattern category. Pattern restrict\
    \ object creations and ensures that only one instance of class exists. Imagine\
    \ that you only need one garage at home, only one HR at company, only one captain\
    \ at team. That are examples from real life in whose you will need singleton pattern.\
    \ For implementation of pattern we need some conditions:\n\n*   `private constructor`\
    \ - We didn`t explained in constructor section, but in short private constructor\
    \ doesn`t give class to be instantiated from another class\n*   `private static\
    \ instance` – only instance of the class\n*   `public static method` – method\
    \ which returns instance of class\n\nThere are two types of making class singleton:\n\
    \n### Lazy initialization\nTo better figure out what exactly means this three\
    \ conditions, let`s see out code below:\n\n```java\nprivate SingletonOne() {\n\
    }\n\nprivate static SingletonOne instance;\n\npublic static SingletonOne getInstance()\
    \ {\n    if(instance == null) {\n        instance = new SingletonOne();\n    }\n\
    \    return instance;\n}\n```\n\nCreation of Class object is derived to `getInstance()`\
    \ method. As public static method have global access and there is no need for\
    \ object for calling, static method is called by class name. This type of singleton\
    \ pattern is called lazy because instance of Class is not created until `getInstance()`\
    \ method is called. `getInstance()` method checks if there is already instance,\
    \ is it is false (null) method creates new one (`new Class()`) and return it.\
    \ With lazy initialization you crate instance only when its needed and not when\
    \ the class is loaded. So you escape the unnecessary object creation.\n\n### Eager\
    \ initialization\n\n```java\nprivate static final SingletonTwo instance = new\
    \ SingletonTwo();\n\nprivate SingletonTwo() {}\n\npublic static SingletonTwo getInstance()\
    \ {\n    return instance;\n}\n```\n\nUnlike lazy initialization, eager initialization\
    \ is done when class is loaded. So, difference is that in first approach you get\
    \ instance of singleton class only when you actually need it.\n\n## MVC Pattern\n\
    \nMVC pattern is maybe most common used pattern in making Java applications. As\
    \ name tells, this is acronym of Model – View – Controller\n\n*   `Model` – represents\
    \ data or POJO classes. POJO is just declaration which must match some conditions\
    \ like: public default no-arg constructor, private attributes and getters and\
    \ setters.\n*   `View` – represents view of mentioned attributes.\n*   `Controller`\
    \ – controller behaves between both model and view, it updates view based on changes\
    \ from model.\n\nFor our explanation we need classes below:\n\n```java\npublic\
    \ class Doctor {\n    private String name;\n    private int age;\n\n    Doctor()\
    \ {}\n\n    public String getName() {\n        return name;\n    }\n\n    public\
    \ void setName(String name) {\n        this.name = name;\n    }\n\n    public\
    \ int getAge() {\n        return age;\n    }\n\n    public void setAge(int age)\
    \ {\n        this.age = age;\n    }\n}\n```\n\nClass `Doctor` represents our model.\
    \ If you remember, default no-arg constructor will be made by default by compiler,\
    \ but we did it just to don`t make confusion.\n\n```java\npublic class ShowDoctor\
