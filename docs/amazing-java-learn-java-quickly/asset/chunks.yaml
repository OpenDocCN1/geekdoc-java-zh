  raw: 'In overriding section we said that derived methods have same input  parameters.
    If you didn`t figured out input parameters are inside curly braces of method declaration
    like: (String n, inta). That is not case with overloading. Methods are overloaded
    when they have same signature but different input parameters, of course in same
    class. We will explain this on constructor overloading. For example, make class
    StudentClass and add attributes name, age and diploma:


    private String name;


    privateintage;


    private String diploma;


    StudentClass(String n, inta) {


    this.name = n;


    this.age = a;


    }


    StudentClass(String n, inta, String d) {


    this.name = n;


    this.age = a;


    this.diploma = d;


    }


    Constructors are overloaded. But what is usage of this? Imagine that you have
    class Faculty that manages with students. Not all students are same. Until finishing
    studies student don`t have diploma, so if you need some operations with students
    like this constructor without diploma parameter will be used. On another hand,
    if you want to store students that are finished studies to some document, constructor
    with diploma parameter will be useful.  Beside constructors, methods also could
    be overloaded:


    void doSomething(String a){


    System.out.println("Print a: " + a);


    }


    void doSomething(String a, String b){


    System.out.println("Print both a and b: " + a + b);


    }


    Both overriding and overloading are types of polymorphism. Polymorphism means
    that one method can do different things based on used object. Polymorphism in
    Java have two types:


    *   Compile time polymorphism


    As we already sad, compile time is time while you type your code and compiler
    automatically recognized if you have some errors. So, compile time is decided
    in that time. Perfect example of this type of polymorphism is overloading. Compile
    time polymorphism is also called static binding.


    *   Runtime polymorphism


    Overriding is type of runtime polymorphism. Unlike static binding, this type of
    polymorphism is called dynamic binding. From name you can guess that an overridden
    method is recognized at runtime.Upcasting is when reference variable of parent
    class refers to the object of child class we. JVM decides about overriding methods,
    not compiler.


    Note: JVM (Java Virtual Machine)  is an abstract machine that enables you to run
    a Java program on computer.


