    \ © 2017\n\n# 目录\n\n- 目录\n- 所有权利保留\n- 第 1 章 原始数据类型\n- 第 2 章 Java 输出\n- 第 3 章 字符串\n\
    - 第 4 章 Java IO\n- 第 5 章 对象\n- 第 6 章 访问修饰符\n- 第 7 章 静态\n- 第 8 章 集合\n- 第 9 章 接口\n\
    - 第 10 章 设计模式\n- Andrei Besedin 的其他书籍\n\n# 所有权利保留\n\n在不限制根据版权保留的权利的前提下，未经版权所有者事先书面许可，本出版物的任何部分均不得被复制、存储或引入检索系统，亦禁以任何形式或通过任何手段（电子、机械、复印、录制或其他）进行传输。\n\
    \n# 第 1 章 原始数据类型\n\n原始数据类型是 Java 中最基础的数据类型。它们存储在变量中。变量本质上就是预留的内存。内存的大小取决于原始类型。所有原始类型都有其默认值。大小如下：\n\
    \n| 原始类型 | 大小 | 最小值 | 最大值 |\n| :--- | :--- | :--- | :--- |\n| Boolean | 1 位 |\
    \ - | - |\n| char | 16 位 | Unicode 0 | Unicode 216-1 |\n| byte | 8 位 | -128 |\
    \ +127 |\n| short | 16 位 | -2¹⁵ | +2¹⁵–1 |\n| int | 32 位 | -2³¹ | +2³¹–1 |\n|\
    \ long | 64 位 | -2⁶³ | +2⁶³–1 |\n| float | 32 位 | IEEE754 | IEEE754 |\n| double\
    \ | 64 位 | IEEE754 | IEEE754 |\n\n## 原始类型的声明与初始化\n\n```java\nint a;\na = 1;\n\
    int a,b;\na = 2; int b = 2;\nfinal int a = 15;//常量\n```\n\n声明意味着为变量提供类型和名称：`int\
    \ a;`。所以，我们的变量是整数类型，名称为 `a`；初始化是给原始类型添加值的过程，在此例中：`int a = 0;`。在此之前 `int` 有一个默认值。boolean\
    \ 的默认值为 false，char 的默认值为 `'\\u0000'`，其余的均为零 (0)。\n\n## 原始类型的转换\n\n### 隐式转换\n\n\
    ```java\nint a = 1;\ndouble b;\nb = a;\n```\n\n### 显式转换\n\n```java\nlong a = 4l;\n\
    int b = a;// 错误\nint c = (int)a;\n```\n\n注意：这被称为强制转换运算符。接下来将介绍运算符。\n\n# 运算符\n\n\
    ### 算术运算符\n\n主要的运算符有：`+`, `-`, `*`, `/`, `%`\n\n| 运算符 | 表达式 | 结果 |\n| :--- | :---\
    \ | :--- |\n| `x = y + 1` | `y = 5` | `x = 6` |\n| `x = y - 1` | `y = 5` | `x\
    \ = 4` |\n| `x = y % 2` | `y = 5` | `x = 1` |\n| `x = ++y` | `y = 5` | `x = 6;\
    \ y = 6` |\n| `x = y++` | `y = 5` | `x = 5; y = 6` |\n| `x = --y` | `y = 5` |\
    \ `x = 4; y = 4` |\n\n| 运算符 | 表达式 | 结果 |\n| :--- | :--- | :--- |\n| `x = y` |\
    \ `y = 3` | `x = 3` |\n| `x += y` | `y = 3` | `x = 6` |\n| `x -= y` | `y = 3`\
    \ | `x = 3` |\n| `x *= y` | `y = 3` | `x = 9` |\n| `x /= y` | `y = 3` | `x = 2`\
    \ |\n| `x %= y` | `y = 3` | `x = 0` |\n\n### 关系运算符\n\n主要的运算符有：`<`, `>`, `<=`,\
    \ `>=`, `==`, `!=`\n\n| 运算符 | 表达式 | 结果 |\n| :--- | :--- | :--- |\n| `x < y` |\
    \ `x = 3, y = 2` | `false` |\n| `x > y` | `x = 3, y = 2` | `true` |\n| `x <= y`\
    \ | `x = 3, y = 2` | `false` |\n| `x >= y` | `x = 3, y = 2` | `true` |\n| `x ==\
    \ y` | `x = 3, y = 2` | `false` |\n| `x != y` | `x = 3, y = 2` | `true` |\n\n\
    正如你所周到的，算术运算符通常用于数学运算。取模（`%`）可以检查数字是偶数还是奇数。关系运算符非常简单。`==` 和 `!=` 常用于比较。`+` 可用于连接。\n\
    \n### 逻辑运算符\n\n主要的运算符有：`&&`（逻辑与）、`||`（逻辑或）、`!`（逻辑非）\n\n| 运算符 | 表达式 | 结果 |\n| :---\
    \ | :--- | :--- |\n| `x < y` | `x = 3, y = 2` | `false` |\n| `x > y` | `x = 3,\
    \ y = 2` | `true` |\n| `x <= y` | `x = 3, y = 2` | `false` |\n| `x && y` | | `false`\
    \ |\n| `x \\| y` | | `true` |\n| `!x` | `x = false` | `true` |\n\n# 第 2 章 Java\
    \ 输出\n\n`System.out.println` 用于向控制台输出文本。让我们尝试最著名的例子。为了这样做我们需要设置我们的 Java 程序。\n\n\
    ```java\nSystem.out.println(\"Hello World!\");\n```\n\n我们学习了如何打印一些消息。现在让我们使用已经学过的内容并混合原始类型。创建一个名为\
    \ `PrintTypes` 的类并添加 main 方法。\n\n```java\nint a = 2;\ndouble b = 3.14;\nSystem.out.println(\"\
    1 b 的旧值 = \" + b);\nb = a;\nSystem.out.println(\"2 b 的新值 = \" + b);\n```\n\n尝试其他运算符。例如：\n\
    \n```java\nint c = 4;\nb = c * 3.14;\nSystem.out.println(\"3 b 的新值 = \" + b);\n\
    ```\n\n# 控制语句\n\n### IF\n\n```java\nif(条件)\n    动作\nelse\n    另一个动作\n```\n\n现在我们将做一个\
    \ IF 的简单示例。创建一个名为 `ControlFlow` 的类并添加以下行：\n\n```java\nint a = 10;\nif(a < 11)\
    \ {\n    System.out.println(\"A 小于 10\");\n} else {\n    System.out.println(\"\
    A 不小于 10\");\n}\n```\n\n让它变得复杂一点。就像现实生活中一样，你可以为任何情况提供多个条件。在这种情况下，通过添加 `else if`\
    \ 语句来实现。将以下行添加到当前类中并运行：\n\n```java\nint b = 15;\nif (b == 13)\n    System.out.println(\"\
    b == 13\");\nelse if ((b <= 17) && (b >= 12))\n    System.out.println(\"b 小于或等于\
    \ 17 且大于或等于 12\");\nelse\n    System.out.println(\"b 不属于以上任何一个\");\n```\n\n现在我们有了了如何编写简单\
    \ Java 程序的思路。让我们解决这个问题。假设你在学校参加了一次考试。你得到了一些分数和等级。尝试使用 if 语句编写程序，根据你的分数检查你得到了什么等级。\n\
    \n```java\nint grade;\nint score = 85;\n\nif (score >= 95)\n    grade = 10;\n\
    else if (score >= 85)\n    grade = 9;\nelse if (score >= 75)\n    grade = 8;\n\
    ```\n\n"
