    Class A is super class and class D extends both class B and class C which have
    method with same signaturedoStuf() but they have different implementation. Which
    one should compiler choose? Situations like this are reason why creators of Java
    left out multiple inheritance. This is called a Diamond problem.


    Note: Inheritance is is – a relationship, Student is a Person; Car is a Vehicle.


    ## Association vs Aggregation vs Composition


    ![](images/00019.jpeg)


    When two objects are related to each other they are in association. Both composition
    and aggregation are types of association.


    ## Composition


    Inheritance is not only type of code reusing. Composition is another one, whose
    is has – a relationship between classes. With inheritance, composition is main
    technique for code reusing. Composition is relationship where part can`t exists
    without a whole.


    publicclass Thought {


    }


    publicclass Brain {


    Thought thought = newThought();


    }


    Brain has a thought. Thought can`t exists without brain. Composition has a stronger
    relationship then aggregation. Code reusing is here implemented by using object
    reference, thought, to use class which you need. Composition is special case of
    aggregation, it is more restricted.


    ## Aggregation


    Aggregation is weaker relationship then composition. In aggregation one part can
    exists without main object. For example: Bed and Pillow. Bed have many pillows
    and without pillow bed is functional. Also, without bed, pillow can exists for
    another purpose.


    publicclass Pillow {


    }


    publicclass Bed {


    public List<Pillow>pillows = new ArrayList<Pillow>();


    }


    ## Overriding vs Overloading


    ### Overriding


    Overriding is term that we already saw in our examples. If in subclass is method
    that have same name and same input parameters like method in super class, then
    we have overriding. Usage of this is to change implementation in our subclasses.
    Do you remember example with vehicles? When method start() is derived to subclass
    Car or Airplane, implementation is different. Car and Airplane have totally different
