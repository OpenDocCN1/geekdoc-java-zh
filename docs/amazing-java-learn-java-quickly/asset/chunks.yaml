  trans: "\n在重写部分，我们提到派生类方法具有相同的输入参数。如果你还没有发现输入参数是在方法声明的圆括号内，例如：`(String n, int a)`。那么重载的情况并非如此。当方法具有相同的签名但不同的输入参数时（当然是在同一个类中），这些方法就构成了方法重载。我们将通过构造函数重载来解释这一点。例如，创建一个\
    \ `StudentClass` 类并添加属性 `name`、`age` 和 `diploma`：\n\n```java\nprivate String name;\n\
    private int age;\nprivate String diploma;\n\nStudentClass(String n, int a) {\n\
    \    this.name = n;\n    this.age = a;\n}\n\nStudentClass(String n, int a, String\
    \ d) {\n    this.name = n;\n    this.age = a;\n    this.diploma = d;\n}\n```\n\
    \n这些构造函数是重载的。但这种用法有什么用呢？假设你有一个管理学生的 `Faculty` 类。并不是所有学生都是一样的。在完成学业之前学生还没有毕业证，所以如果你需要对学生进行某些操作，将使用这个没有\
    \ `diploma` 参数的构造函数。另一方面，如果你想将完成学的学生存储到某个文档中，带有 `diploma` 参数的构造函数将有用。除了构造函数，方法也可以被重载：\n\
    \n```java\nvoid doSomething(String a) {\n    System.out.println(\"Print a: \"\
    \ + a);\n}\n\nvoid doSomething(String a, String b) {\n    System.out.println(\"\
    Print both a and b: \" + a + b);\n}\n```\n\n重写和重载都是多态的形式。多态意味着一个方法可以根据使用的对象执行不同的事情。Java\
    \ 中的多态有两种类型：\n\n### 编译时多态\n正如我们所说的，编译时是你编写代码时，编译器会自动识别你是否存在某些错误。因此，编译时是在那个时候决定的。这种类型多态的完美例子就是重载。编译时多态也被称为静态绑定。\n\
    \n### 运行时多态\n\n重写是运行时多态的一种。与静态绑定不同，这种多态被称为动态绑定。从名称你可以猜出被重写的方法是在运行时识别的。向上转型是指父类的引用变量指向子类对象的情况。`JVM`\
    \ 决定重写方法，而不是编译器。\n\n注意：`JVM`（Java 虚拟机）是一个抽象机器，它允许你在计算机上运行 Java 程序。\n\n## 小标题 1\n\
    章节文本\n\n### 子子标题\n章节文本\n\n# 第 10 章 设计模式\n\n## 单例模式\n\n单例模式是最常用的设计模式之一。它属于创建型模式的范畴。该模式限制了对象的创建，并确保类只存在一个实例。假设你家里只需要一个车库，公司只需要一个人力资源部门，团队只需要一个队长。这些都是现实生活中你可能需要单例模式的例子。为了实现该模式，我们需要满足一些条件：\n\
    \n*   `private constructor` - 我们在构造函数部分没有解释，但简而言之，私有构造函数不会允许从另一个类实例化该类。\n*   `private\
    \ static instance` – 类的唯一实例。\n*   `public static method` – 返回类实例的方法。\n\n使类单例有两种类型：\n\
    \n### 懒性初始化\n为了更好地理解这三个条件具体意味着什么，让我们看看下面的代码：\n\n```java\nprivate SingletonOne()\
    \ {\n}\n\nprivate static SingletonOne instance;\n\npublic static SingletonOne\
    \ getInstance() {\n    if(instance == null) {\n        instance = new SingletonOne();\n\
    \    }\n    return instance;\n}\n```\n\n类对象的创建被交给了 `getInstance()` 方法。由于公共静态方法具有全局访问权限，且不需要对象即可调用，因此通过类名调用静态方法。这种单例模式被称为“懒加载”（lazy），因为在调用\
    \ `getInstance()` 方法之前，类的实例不会被创建。`getInstance()` 方法检查是否已经存在实例，如果为假（`null`），方法会创建一个新的（`new\
    \ Class()`）并返回它。通过懒性初始化，你只在需要实例时才创建它，而不是在类加载时。这样你就避免了不必要的对象创建。\n\n### 饿性初始化\n\n\
    ```java\nprivate static final SingletonTwo instance = new SingletonTwo();\n\n\
    private SingletonTwo() {}\n\npublic static SingletonTwo getInstance() {\n    return\
    \ instance;\n}\n```\n\n与懒性初始化不同，饿性初始化是在类加载时完成的。所以区别在于，在第一方法方法，只有当你真正需要时才会获取单例类的实例。\n\
    \n## MVC 模式\n\nMVC 模式可能是构建 Java 应用中最常用的模式。正如名称所示，它是 Model – View – Controller\
    \ 的缩写。\n\n*   `Model` – 表现表示数据或 POJO 类。POJO 只是一个声明，必须符合某些条件，如：公共默认无参构造函数、私有属性以及\
    \ getter 和 setter。\n*   `View` – 代表上述属性的视图。\n*   `Controller` – 控制器介于模型和视图之间，它根据模型的变化来更新视图。\n\
    \n为了我们的解释，我们需要下面的类：\n\n```java\npublic class Doctor {\n    private String name;\n\
    \    private int age;\n\n    Doctor() {}\n\n    public String getName() {\n  \
    \      return name;\n    }\n\n    public void setName(String name) {\n       \
    \ this.name = name;\n    }\n\n    public int getAge() {\n        return age;\n\
    \    }\n\n    public void setAge(int age) {\n        this.age = age;\n    }\n\
    }\n```\n\n`Doctor` 类代表我们的模型。如果你还记得，默认无参构造函数将由编译器默认生成，但我们这样做只是为了避免混淆。\n\n```java\n\
    public class ShowDoctor {\n    public void showDoctor(String name, int age) {\n\
    \        System.out.println(\"Doctor with name: \" + name + \" and age: \" + age);\n\
    \    }\n}\n```\n\n这个类代表了 `Doctor` 属性 `name` 和 `age` 的展示，视图。\n\n```java\npublic\
    \ class Controller {\n    private Doctor doctor;\n    private ShowDoctor showD;\n\
    \n    Controller(Doctor d, ShowDoctor s) {\n        this.doctor = d;\n       \
    \ this.showD = s;\n    }\n\n    public Doctor getDoctor() {\n        return doctor;\n\
    \    }\n\n    public void setDoctor(Doctor doctor) {\n        this.doctor = doctor;\n\
    \    }\n\n    public ShowDoctor getShowD() {\n        return showD;\n    }\n\n\
    \    public void setShowD(ShowDoctor showD) {\n        this.showD = showD;\n \
    \   }\n\n    void shomMeDoctor() {\n        showD.showDoctor(doctor.getName(),\
    \ doctor.getAge());\n    }\n}\n```\n\n你可以看到，我们的控制器获取了模型和视图的引用。现在我们需要一个类来管理这一切。\n\
    \n```java\npublic class Program {\n    Doctor doctor = setDoctorAttributes();\n\
    \    ShowDoctor show = new ShowDoctor();\n    Controller controller = new Controller(doctor,\
    \ show);\n\n    private static Doctor setDoctorAttributes() {\n        Doctor\
    \ doc = new Doctor();\n        doc.setName(\"Bob\");\n        doc.setAge(50);\n\
    \        return doc;\n    }\n\n    void printDoctor() {\n        controller.shomMeDoctor();\n\
    \    }\n\n    public static void main(String[] args) {\n        Program program\
    \ = new Program();\n        program.printDoctor();\n    }\n}\n```\n\n## 项目\n\n\
    我们为止涵盖的所有内容都有其特定的用途，并且 Java 编程中非常重要的部分。但它们只是一个大故事的一部分。学习某些东西（Java 也是如此）的最佳方法将其应用于实际问题，在本例中就是通过项目。在最后部分，我们将尝试根据所学（几乎是所有）内容创建一个功能性项目。通过此你将更清楚地了解如何以及何时使用某些\
    \ Java 特性。想法是做一个医院项目。\n\n医院的特点是：\n\n*   `Doctor`（名、姓、专科）有许多 `Patient`（名、姓、病历号）\n"
- fmt: "\n- Patient can have only one Doctor\n- Doctor assigns laboratory examination\
    \ to Patient\n- Examination have date and time\n- Types of examinations:\n   \
    \ - Blood sugar level (upper value, lower value, pulse)\n    - Blood pressure\
    \ (value, last time meal)\n\nMake script that simulates next:\n\n1. Create Doctor\
    \ `Bob Williams`\n2. Create Patient `Fill Kane`\n3. Patient `Fill` chooses `Bob`\
    \ to be his Doctor\n4. Doctor `Bob` calls Patient `Fill` for blood sugar level\
    \ examination\n5. Doctor `Bob` calls Patient `Fill` for blood pressure examination\n\
    6. Examinations have `examinationID` and `date` values\n7. Show results for both\
    \ examinations\n\nStart to think about project with entities, `Doctor` and `Patient`,\
    \ are they have something similar? Do we maybe need abstract class? Is this also\
    \ case with examinations? How to derive only one doctor to patient? `Singleton\
    \ pattern`?\n\nLet's start making our project to better figure out all of this.\n\
    \nIn `Eclipse` create a new project `Hospital`. Our entities will be placed inside-`model`\
    \ package. Every hospital has entities like `Doctor` and `Patient`, our also will.\
    \ First, we will make abstract class `Person`:\n\n```java\nprotected String nin;\n\
    \nprotected String name;\nprotected String surname;\n\npublic Person(String n,\
    \ String name, String surname){\n\nthis.nin = n;\n\nthis.name = name;\nthis.surname\
    \ = surname;\n\n}\n```\n\nGenerate getters and setters for `nin`, `name` and age\
    \ attributes also. `nin` stands for National Identity Number. Next class is `Doctor`:\n\
    \n```java\npublicclass Doctor extends Person{\n\nprivate String specialty;\n\n\
    public Doctor(String n, String name, String surname, String spec){\n\nsuper(n,\
    \ name, surname);\nthis.specialty = spec;\n\n}\n\n}\n```\n\n### The Patient Class\n\
    \nAlso, generate getters and setters for `specialty` attribute. `Patient` class:\n\
    \n```java\npublicclass Patient extends Person{\n\nprivateintmedicalRecordNumber;\n\
    \npublic Patient(String n,String name, String surname, intmedRecNum){\n\nsuper(n,\
    \ name, surname);\nthis.medicalRecordNumber = medRecNum;\n\n}\n\n}\n```\n\nGetters\
    \ and setters for `medicalRecordNumber`.\n\n### The Hospital Class\n\nOur next\
    \ job to do is to assign doctor to patient. We have condition, our patient can\
    \ have only one doctor. You can guess, `singleton pattern` need to be implemented.\
    \ Use lazy initialization in `Hospital` class:\n\n```java\nprivate Hospital(){\n\
    \n}\n\nprivatestatic Hospital instance;\n\npublicstatic Hospital getInstance(){\n\
    \nif(instance == null){\n\ninstance = new Hospital();\n\n}\n\nreturninstance;\n\
    \n}\n```\n\nDoctor and patients need to be stored somewhere. We will use `HashMap`\
    \ for that. Add this to `Hospital` class:\n\n```java\nprivate Map<String, Person>persons\
    \ = new HashMap<String, Person>();\n```\n\nOur `Hospital` also needs methods for\
    \ manipulationg with persons:\n\n```java\nprivate Person TryGetPerson(String nin){\n\
    \nreturnpersons.get(nin);\n}\n\npublic Doctor TryGetDoctor(String nin){\n\nDoctor\
    \ doct;\ndoct = (Doctor)TryGetPerson(nin);\nreturndoct;\n}\n\npublic Patient TryGetPatient(String\
    \ nin){\n\nPatient patient;\npatient = (Patient)TryGetPerson(nin);\n\nreturnpatient;\n\
    \n}\n```\n\n`TryGetPerson()` returns person with his `nin`. To decide if that\
    \ person is doctor or patient, we need `TryGetDoctor()` and `TryGetPatient()`\
    \ methods.\n\n**Note**: Look at script. At 7. it says we need to show results.\
    \ For this purpose, we will use `log4j`, new for us but very simple feature. Download\
    \ jar file from this site: [http://www.java2s.com/Code/Jar/l/Downloadlog4jjar.htm](http://www.java2s.com/Code/Jar/l/Downloadlog4jjar.htm)\n\
    \nExtract file and add jar file to project by Right click ->Properties ->Java\
    \ Build Path ->Add External JARs ->`log4j`\n\nBelow class name `Hospital`, add\
    \ our `Logger`:\n\n```java\nstatic Logger log = Logger.getLogger(Hospital.class);\n\
    ```\n\nNow is order to make methods which actually create doctor and patient:\n\
    \n```java\npublicvoid createDoctor(String nin, String name, String surname, String\
    \ spec){\n\nif(TryGetDoctor(nin) == null&& !persons.containsKey(nin)){\n\nDoctor\
    \ doctor = newDoctor(nin, name, surname, spec);\npersons.put(nin, doctor);\nlog.info(\"\
    Doctor \" + name + \" \" + surname + \" with speciality \" + spec + \"is created!\"\
    );\n\n}else{\n\nlog.info(\"Doctor \" + name + \" \" + surname + \" already exists!\"\
    );\n\n}\n\n}\n\npublicvoid createPatient(String nin, String name, String surname,\
    \ intmedRecNum){\n\nif(TryGetPatient(nin) == null&& !persons.containsKey(nin)){\n\
    \nPatient patient = newPatient(nin, name, surname, medRecNum);\npersons.put(nin,\
    \ patient);\nlog.info(\"Patient \" + name + \" \" + surname + \" with medical\
    \ record \" + medRecNum + \" is created!\");\n\n}else{\n\nlog.info(\"Patient \"\
    \ + name + \" \" + surname + \" already exists!\");\n\n}\n\n}\n```\n\nBoth methods\
    \ are doing same thing. `HashMap` takes input by key/value. In this case `nin`\
    \ is key, so in our methods we are checking if person doesn`t exists. If it is\
    \ true, then we are creating a new one. If it is false we are printing some massage.\
    \ `containsKey()` method isn't covered, it checks if map contains a mapping for\
    \ the specified key.\n\n### Assignment Logic\n\nNext step is to assign patient\
    \ to doctor. First we need some method in `Patient` class for assigning to doctor.\
    \ Method is similar like this two above:\n\n```java\nprivate Doctor assign;\n\n\
    publicvoid assignDoctor(Doctor doc){\n\nif(Hospital.getInstance().TryGetDoctor(doc)\
    \ != null){\n\nassign = doc;\nlog.info(\"Patient is assigned to \" + doc.getName());\n\
    \n}else{\n\nlog.info(\"Doctor \" + doc.getName() + \" doesn`t exists!\");\n\n\
    }\n\n}\n```\n\nOur method is using reference of `Doctor` to itself.\n\n**Note**:\
