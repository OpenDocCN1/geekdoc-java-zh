    ## Encapsulation


    Encapsulation is term that is connected with access modifiers. Imagine that you
    have some class with attributes. Everything can work well, but problem may occur
    in context of insecurity of your data. It is because someone can to reach to your
    class and make changes. So, to make this impossible and to have full control of
    your data inside class, getters and setters will help you.  To see on example,
    first make new fourth.pack package and Person class inside. Our Person would have
    name and age attributes, which are declared as private.


    private String name;


    privateintage;


    Now we need to open Source ->Generate Getters and Setters


    Final move is to check name and age fields and press OK.


    expected: Getters and Setters will be generated


    So, as you can see, out attributes remain private (accessible only within class)
    and methods (getters and setters) that we generated are public. We made our class
    safer.


    public String getName() {


    returnname;


    }


    publicvoid setName(String name) {


    this.name = name;


    }


    Look at getName() method. If we need our name for some reason we will call this
    method, which return name. Our attributes is untouched. Same is with setName(String
    name) method. It changes values of our name by referring to it with this keyword.


    ## Abstract Classes


    Do you remember that we mentioned classes like Professor and Student? They are
    related entities and have some common attributes like name, age and city in our
    example. So, why to always declare that attributes again and again? Isn`t would
    be easier to have some base class that contains all data, attributes and methods,
    and to share to all classes whose need them? Of course it would be. Class that
    do it is called abstract class. To make previous class Professor abstract, add
    abstract declaration to it`s name:


    publicabstractclass Person


    Abstract class can`t be instantiated. Also, if there is at least one abstract
    method in class, class is automatically abstract. Abstract method is method without
    implementation and declared abstract:


    abstractvoidrun();


    Note: Make parameterized constructor for class Person that includes mentioned
    attributes and generate getters and setters. Also don`t forget to add run() method.


    Now we have our first abstract class. Another step is to make class that will
    use fields from Person class. Let it be class Student, again. To make Person class
    useable, we need extends declaration:


    publicclass Student extends Person


    Now our class Student extends (shares) all fields with Person, but also we can
    add some specific attributes for Student. Beside that, constructor will looks
    like this now:


    privateint[] grades;


    Student(String name, intage) {


    super(name, age);


    this.grades = newint[5];


    }


    Something new is here for us. super keyword means that our constructor refers
    to it`s superclass. So, we extended Person class, which has name and age attributes.
    That attributes aren`t declared again in class. Also, you can now recognize that
    there is an array which takes int values and size is 5\.


    Note: you can see that all the time compiler is complaining: The type Student
    must implement the inherited abstract method Person.run()


    That is because we need also to implement run() method from our superclass (Person).


    @Override


    void run() {


    System.out.println("Student runs!");


    }


    Note: @Overridedeclaration means that method is derived from super class.


    One thing that is very important is that class can only extends one abstract class.


    # Chapter 9. Interfaces


    Interfaces are not classes. They only contain methods and attributes whose class
    that implements that interfaces need to have. You can recognize first difference
    from abstract classes, interfaces are implementing by keyword implements, not
    extending. All methods are implicit public and all attributes are implicit public
    static final. Let`s now make out first interface by right click on current package
    New ->Interface and name it House. We will add following lines:


    String bed = "My bed";


    void sleep();


    So, as you can see our method sleep() don`t have implementation. That is because
    we don`t need to know how method must be implemented at this moment. To understand
    better, imagine that you have interface Vehiclewith methods like start() and stop(),
    and classes which implement that interface like Car, Bicycle and Airplane. At
    the moment of creation of Vehicle interface you only know that you would have
    some different type in future, that we mentioned, but you actually don`t know
    how they work because all work different. Think in that way about interfaces.


    But, from Java 8, interfaces are changed. Now you can have default method:


    defaultvoid watchTV() {


    System.out.println("I am wathcing TV");


    }


    As you can guess, this means that now interfaces are more similar to abstract
    classes. One thing that is very important is that you can implement multiple interfaces,
    rather that only one class.


    Both, abstract classes and interfaces use inheritance. Inheritance is type of
    code reusing. This is very useful because in development you will be in situations
    where there are some classes with some methods and attributes that you may need.
    When class is extended and interface implemented, subclass need to override all
    their methods. Why we told that only one class can be extended?


