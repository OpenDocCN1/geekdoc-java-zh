    \ + \" \");\n}\n```\n预期：控制台打印 `1.6 2.8 4.54`\n\n## 嵌套循环\n\n现在我们将通过使用嵌套循环让事情变得复杂一点。嵌套循环是位于另一个内部的循环。对于初学者来说可能会令人困惑，但当你开始理解它们的概念时，你会发现它们有多强大。让我们从这个示例开始：\n\
