    # Chapter 4\. Java IO


    Buffered Reader


    As we saw, System.out is output stream. Opposite of that is System.in,input stream.
    In new class JavaIO inside main method add following lines:


    BufferedReader in = newBufferedReader(new InputStreamReader(System.in));


    System.out.print("Type your name: ");


    String name = in.readLine();


    System.out.println("Your name is: " + name);                           


    System.out.print("Type your height: ");


    intheight = Integer.parseInt(in.readLine());


    System.out.println("Your height is: " + height);


    There will be some errors. It says: “Unhandled exception type IOException”


    Note: To fix this problem click on red alert and Add throws declaration. Now main
    method will throw exception if it occurs.


    Run program.


    expected: Type your name:    will be printed to console


    Type your height:


    Also, we can see import section between package and class name. Java packages
    are used for better organization of java libraries and classes. In this case we
    can see that java.io package is imported from whose are derived methods inside
    our current class.


    ### Wrapper Classes


    Wrapper classes are used when something is typed that is nota String. Every primitive
    type has his own Wrapper class.


    *   int -> Integer


    *   long -> Long


    *   boolean -> Boolean


    Wrapper classes are doing automatic boxing and unboxing (conversion primitive
    types to objects and vice versa) using XXXparseXXX method. For example:


    inti = Integer.parseInt("10");


    longl = Long.parseLong("10");


    ### Scanner


    Alternative for this is class Scanner, which can read both primitive types and
    Strings. Scanner is using delimiter to break input into tokens. Delimiter is whitespace
    by default. Try to run this code:


    StringyourName;


    intyourHeight;


    Scanner sc = newScanner(System.in);


    System.out.print("Enter your name: ");


    yourName = sc.nextLine();


    System.out.println("Your name is: " + yourName);


    System.out.print("Enter your height: ");


    yourHeight = sc.nextInt();


    System.out.println("Your height is: " + yourHeight);


    expected: Enter your name    will be printed to console


             Enter your height


    Good practice is to close operations at the end of program using:


    sc.close();


    Try to make something different on your own. Use other primitive types, first
    for Buffered Reader and then for Scanner. Which method will be for float?


    Did you figured out that Buffered Reader and Scanner have different methods,


    readLine() and nextLine()?


    # Chapter 5. Objects


    OOP


    Object-oriented programming is a way of thinking for solving programming problems.
    Everything about this is connected with concept of object. Our mission is to somehow
    recognize relationships between objects(entities) from real world and “transfer”
    them to our code.


    In Java, all starts with classes. Variable, methods and objects are placed inside
    classes. Objects are created by instantiating classes. Every entity has attributes
    and methods.


    How we can group our data? Using arrays.


    String[][] person = new String[1][3];


    person[0][0] ="Name";


    person[0][1] ="Surname";


    person[0][3] ="Birthdate";


    Using classes? Much more natural.


    Let`s do some programming. In our current project make new package called second.pack.
    Inside that package add class called Car, but without main method. Our Car class
    will contain one attribute activate, and two methods start and stop.


    booleanactivate;


    void start() {


    activate = true;


    }


    void stop() {


    activate = false;


    }


    We said that default value for boolean primitive type is false. Usage of start()
    and stop() methods is to change value of activatevariable.


    Now we need another class for making this more interactive. In new class Test
    will be created Car object and called method.


    Note: Just like it is mentioned, methods are supposed to be called inside main
    method. So, we need to place this code inside that method. Main method does not
    need to be implemented by default, it could be written just like any other method.
    Also, void keyword will be explained a little later.


    Car bmw = newCar();//Car object created by keyword new


    bmw.start();//reference of Car object used to call start() method


    By calling start() method on our Car object value of activate attribute is set
    to true. But calling stop() method on same object value will be false. This program
    won`t print anything to console, don`t get confused.


    Try it out. Make your own simple project. Imagine that you are in classroom for
    example. Make object of yourself, add attributes and methods. Methods could be
    based on condition if you are passed exam or not.


    ![](images/00013.jpeg)


    It is possible to initiate reference which doesn`t point to any object. Reference
    still exists on stack, but there is no new object created on heap.nullis not object,
    You cannot instantiate or create variables of this type though. Method invocation
    on a nullresults in a NullPointerException.


    Car opel = null;


    What if we have this situation:


    Car a = newCar();


    Car b = newCar();


