  trans: "\n\n让我们完成 `Hospital` 类。像处理人员类一样，我们需要 `HashMap` 来处理检查项目：\n\n```java\nprivate\
    \ Map<Integer, PatientDoctorExamination>examinations = new HashMap<Integer, PatientDoctorExamination>();\n\
    ```\n\n在这里你可以看到之前定义的 `PatientDoctorExamination` 类的用法。此外，我们还需要一个能够存储检查项目的结构。为了这一点，让我们在\
    \ `Hospital` 类中使用 `enum`：\n\n```java\npublic enum laboratoryExaminations{\n  \
    \  bloodPressure,\n    bloodSugarLevel,\n}\n```\n\n好了，但像往常一样，我们需要对我们的数据（即检查项目）进行一些操作。方法需要根据输入将检查项目放入\
    \ `HashMap` 中。我们将使用之前涵盖过的另一个点 `switch`，因此为 `Hospital` 类中添加该方法：\n\n```java\nprivate\
    \ int examID;\n\npublic int ScheduleExamination(Doctor doctor, Patient patient,\
    \ Date date, laboratoryExaminations examinationsLab){\n    LaboratoryExamination\
    \ examination = null;\n    switch(examinationsLab){\n        case bloodPressure:\n\
    \            examination = new BloodPressure(examID, date);\n            break;\n\
    \        case bloodSugarLevel:\n            examination = new BloodSugarLevel(examID,\
    \ date);\n            break;\n    }\n    examinations.put(examID, new PatientDoctorExamination(doctor,\
    \ patient, examination));\n    examID++;\n    return examination.examinationID;\n\
    }\n```\n\n为了使 `Hospital` 类具备功能，我们需要做的最后一件事就是以某种方式创建最终执行检查的方法。这将在下面的代码中展示：\n\n\
    ```java\npublic void FillBloodSugarLevelExamination(int examinationID, double\
    \ value, Date date){\n    PatientDoctorExamination patientDoctorExamination =\
    \ null;\n    patientDoctorExamination = examinations.get(examinationID);\n   \
    \ if(patientDoctorExamination != null){\n        if(patientDoctorExamination.getLabExam()\
    \ instanceof BloodSugarLevel){\n            BloodSugarLevel bloodSugarLevel =\
    \ (BloodSugarLevel)patientDoctorExamination.getLabExam();\n            bloodSugarLevel.setValue(value);\n\
    \            bloodSugarLevel.setLastMealTime(date);\n            log.info(\"Examination\
    \ is successfully done! \\n\" +\"=======\\n\"+ \"value: \" + value + \", last\
    \ meal time: \" + date);\n        }else\n            log.info(\"Selected examination\
    \ is not for blood sugar level!\");\n    }else\n        log.info(\"Selected examination\
    \ does not exist!\");\n}\n\npublic void FillBloodPressureExamination(int examinationID,\
    \ int upperValue, int lowerValue, int pulse){\n    PatientDoctorExamination patientDoctorExamination\
    \ = null;\n    patientDoctorExamination = examinations.get(examinationID);\n \
    \   if(patientDoctorExamination != null){\n        if(patientDoctorExamination.getLabExam()\
    \ instanceof BloodPressure){\n            BloodPressure bloodPressure = (BloodPressure)patientDoctorExamination.getLabExam();\n\
    \            bloodPressure.setUpperValue(upperValue);\n            bloodPressure.setLowervalue(lowerValue);\n\
    \            bloodPressure.setPulse(pulse);\n            log.info(\"Examination\
    \ is successfully done! \\n\" +\"=======\\n\"+\"upper value: \" + upperValue +\
    \ \", lower value: \" + lowerValue + \", pulse: \" + pulse);\n        }else\n\
    \            log.info(\"Selected examination is not for blood pressure!\");\n\
    \    }else\n        log.info(\"Selected examination does not exist!\");\n}\n```\n\
    \n现在，当所有特征和条件都满足后，剩下的工作就是创建一个包含 `main` 方法的类，以查看程序的输出。希望你没有忘记除了 `Hospital` 之外的所有类都应该在\
    \ `model` 包中。`Hospital` 类和现在创建的 `ProgramHospital` 类放在 `program` 包中。在创建此类时，添加 `main`\
    \ 方法以及以下内容：\n\n```java\norg.apache.log4j.BasicConfigurator.configure();\nHospital.getInstance().createDoctor(\"\
    1234\", \"Bob\", \"Williams\", \"surgeon\");\nHospital.getInstance().createPatient(\"\
    2345\", \"Fill\", \"Kane\", 25);\nDoctor doctor = Hospital.getInstance().TryGetDoctor(\"\
    1234\");\nPatient patient = Hospital.getInstance().TryGetPatient(\"2345\");\n\
    ```\n\n注意：不要被第一行代码搞混，它只是在配置我们的 `log4j`。\n\n如你所见，当类是单例时，其内部的方法只能通过 `getInstance()`\
    \ 静态方法调用。首先，我们创建了医生和患者，所以他们现在位于 `HashMap` 中。下一步是将我们的医生和患者存储到医生和患者的引用中。最后，我们将它们相互赋值。最后一部分是将检查任务委托给患者：\n\
    \n```java\nint examination1 = Hospital.getInstance().ScheduleExamination(doctor,\
    \ patient, new Date(), laboratoryExaminations.bloodSugarLevel);\nint examination2\
    \ = Hospital.getInstance().ScheduleExamination(doctor, patient, new Date(), laboratoryExaminations.bloodPressure);\n\
    Hospital.getInstance().FillBloodSugarLevelExamination(examination1, 12, new Date());\n\
    Hospital.getInstance().FillBloodPressureExamination(examination2, 120, 90, 32);\n\
    ```\n\n之前你就可以清楚地识别出这些方法的作用了。它们负责填充检查计划。\n\n运行程序。\n\n## 谢谢，但我可以请你个忙吗？\n\n感谢你下载并阅读我的书。书中中全是关于\
    \ Java 的内容。希望你喜欢，但你需要不断学习才能趋于完美！\n\n如果你能在 Amazon 上发表简短的评论，我将不胜感激。\n\n[`www.amazon.com/Amazing-JAVA-Learn-Quickly-ebook/dp/B0737762M8/ref=zg_bs_8624232011_f_23?_encoding=UTF8&psc=1&refRID=W8F9B0G980WACSXY1G8P`](https://www.amazon.com/Amazing-JAVA-Learn-Quickly-ebook/dp/B0737762M8/ref=zg_bs_8624232011_f_23?_encoding=UTF8&psc=1&refRID=W8F9B0G980WACSXY1G8P)\n\
    \n我会亲自阅读每一条评论，以便不断写出你需要的内容。谢谢。\n\n"
