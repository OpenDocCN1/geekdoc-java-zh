  trans: "\n所以，在我们的 `main` 方法中我们将调用静态方法：\n\n```\nStaticClass.print();\nStaticClass.changeValue();\n\
    ```\n\n预期：静态方法调用！将打印到控制台 6\n\n现在让我们在 `changeValue()` 方法内部将 `val2` 改为 `val`。会发生什么？它报错了：`Cannot\
    \ make a static reference to the non-static field `val`。这是因为静态方法只能访问静态字段。调用静态方法还有另一种方法，结果是一致的：\n\
    \n```\nprint();\nchangeValue();\n```\n\n现在我们已经涵盖了所有需要的内容，就可以对我们著名的 `main` 方法进行总的解释了。\n\
    \n- `public` – 方法在整个项目中可见的。\n- `static` – 方法属于类。`main` 是静态的，因为它可能会产生歧义，编译器不知道该调用哪个构造函数。\n\
    - `void` – 方法不返回任何值。\n\n好了，现在让我们来看一个非常有趣的例子：\n\n```\nstatic{\n    System.out.println(\"\
    static\");\n}\n\npublicstaticvoid main(String[] args) {\n    System.out.println(\"\
    main\");\n}\n```\n\n预期：static 将打印到控制台\nmain\n\n这是如何发生的？我们不是说方法是在 `main` 方法中执行的吗？这被称为静态块（static\
    \ block）。当类首次被加载到 [JVM](https://crunchify.com/how-to-change-jvm-heap-setting-xms-xmx-of-tomcat/)\
    \ 时，静态块会在 main 方法之前执行。\n\n这个程序的输出将是 0 到 1 之间的随机数：\n\n```\nSystem.out.println(\"\
    Random number: \" + Math.random());\n```\n\n但是，它是如何工作的？就像 `System.out.println();`\
    \ 一样。\n\n`java.lang.System`\n\n`java.land.Math`\n\n这两个类都有可以调用的静态方法。它们不需要对象，所以更加简单。因此，我们已经常用的使用的方法\
    \ `out()` 是来自 `System` 类的静态方法，通过该类名进行调用。这与 `Math` 类中的 `random()` 方法是一样的。尝试使用其他这样的方法：\n\
    \n```\nint a = 4;\nint b = 2;\ndouble c = 2.4;\nSystem.out.println(\"Minimum is:\
    \ \" + Math.min(a, b));\nSystem.out.println(\"Maximum is: \" + Math.max(a, b));\n\
    System.out.println(\"Pow of c is: \" + Math.round(c));\n```\n\n# 第 8 章 集合 (Collections)\n\
    \n集合用于存储和操作一组对象。这里展示了 Collection 类和接口的层级结构。我们将涵盖常用的部分。\n\n![](img/00016.jpeg)\n\
    \n数组（Arrays）有一个缺点。一旦创建，就无法更改它们的大小。这个问题通过集合（Collections）得到了解决。\n\n- `List` – 有序的对象列表。可以通过索引访问对象。可以有两个相同的对象。\n\
    - `Queue` – 像 List 一样是有序的，区别是新元素添加到队列末尾，并从队列头部移除。\n- `Set` – 所有元素都是唯一的。\n- `Map`\
    \ – 不是 Collection 接口的一种。元素通过键/值（key/value）映射。\n\n大部分集合位于 `java.util` 包中。\n\n所有集合的常用方法有：\n\
    - 添加元素\n- 移除元素\n- 遍历元素\n\n一旦我们涵盖了几个集合，查看 JavaDoc 并弄懂其余集合是如何运作的就会变得更容易。现在我们将关注\
    \ `List` 和 `Map`，它们最可能被需要。`Queue` 和 `Set` 并不那么常用，但根据对这二者的经验，将很容易处理它们。此外，不要困惑，接口将在接下来的章节中被涵盖。\n\
    \n### ArrayList\n\n`ArrayList` 代表动态集合。操作元素的方法有：\n\n- `add()` – 用于向 `ArrayList`\
    \ 添加元素\n- `remove()` – 用于从 `ArrayList` 移除元素\n- `get()` – 用于从 `ArrayList` 获取\n\n\
    是时候看一些 `ArrayList` 的示例了。那么，让我们创建一个新的包 `third.pack` 并在里面创建一个类 `Array`。\n\n```\n\
    ArrayList<Integer> ar = new ArrayList<Integer>();\nar.add(1);\nar.add(2);\nar.add(3);\n\
    System.out.println(\"Size of ArrayList is: \" + ar.size());\nar.remove(0);\nint\
    \ num = ar.get(0);\nSystem.out.println(num);\nSystem.out.println(\"New size of\
    \ ArrayList is: \" + ar.size());\n```\n\n预期：Size of ArrayList is: 3 将打印到控制台\n\
    2\nNew size of ArrayList is: 2\n\n所以，在我们的代码中使用了所有关于 `ArrayList` 提到的内容。首先是声明它。我们说过数组有一个很大的缺点，它们不应该改变大小。但如你所见，我们的\
    \ `ArrayList` 是动态的，增加了三个元素（Size of ArrayList is: 3）。编译器从 0 开始计算元素，所以 `1 = 0`，`2\
    \ = 1`，`3 = 2`。记住这一点很重要，因为涉及到元素的操作。另一个操作是从我们的数组中移除第一个元素。变量 `num` 通过 `get(0)` 方法持有第一个元素，并且\
    \ `println` 将其打印到控制台（2）。此外，大小不再是 3 了，现在是 2 了。\n\n如果我们有一个更大的 `ArrayList` 并想要打印所有值怎么办？使用\
    \ `for` 循环：\n\n```java\nfor (int counter = 0; counter < ar.size(); counter++)\
    \ {\n    System.out.println(ar.get(counter));\n}\n```\n\n```java\nfor (Integer\
    \ n : ar) {\n    System.out.println(n);\n}\n```\n\n### HashMap\n\n`Map` 派自 `Collection`\
    \ 接口，它的行为有些不同。操作方法有：\n\n- `put()` – 添加键值对\n- `get()` – 找到值\n\n创建一个类并开始：\n\n```java\n\
    HashMap<Integer, String> hm = new HashMap<Integer, String>();\nhm.put(1, \"numOne\"\
    );\nhm.put(2, \"numTwo\");\nhm.put(3, \"numThree\");\nSystem.out.println(\"Print\
    \ me value of key 1: \" + hm.get(1));\n```\n\n预期：Print me value of key 1: numOne\n\
    \n`Map` 不是有序的，这意味着它不按照插入顺序返回键。`HashMap` 允许任意的值。\n\n现在让我们讨论一下。在 `ArrayList` 和 `HashMap`\
    \ 的示例中，我们看到了类似 `<Integer>`, `<Integer, String>` 内容。这些类被称为泛型（Generics）。在 `Map`\
    \ 中尝试添加这段代码：\n\n```java\nhm.put(\"four\", \"numFour\");\n```\n\n编译器报错。这是因为我们将键声明为整数（`Integer`\
    \ 包装类），而 `\"four\"` 是字符串。`ArrayList` 也是一样：\n\n```java\nar.add(\"four\");\n```\n\
    \n`ArrayList` 只允许整数。\n\n`Enum` 是一种特殊的集合。它是常量集合。`Enum` 对我们之后的工作很有用，现在了解这些足够。\n\n\
    ```java\npublic enum Person {\n    name,\n    age,\n    city\n}\n```\n\n# 异常处理\
    \ (Exception Handling)\n\n处理发生时的异常是 Java 编程非常重要的一部分。假设你没有处理运行时错误的机制。会发生什么？谁知道呢。但大多数项目将会失败。所以，让我们从这里开始。\n\
    \n异常的分类基于编译时的检查。\n\n- 编译时：在你编写代码时。例如：如果你还记得 `ArrayList` 和 `Map` 的那些由于编译器报错而产生的问题。\n\
    - 运行时：在你运行程序/项目时。\n\n让我们来看一个常用的 `try/catch` 块的示例：\n\n```java\ntry {\n    int num\
    \ = 2 / 0;\n} catch (ArithmeticException e) {\n    System.out.println(\"Error:\
    \ Don't divide a number by zero\");\n}\nSystem.out.println(\"Out of try/catch\"\
    );\n```\n\n预期：Error: Don't divide a number by zero 将打印到控制台\nOut of try/catch\n\
    \n尝试将 0 改为 1。错误不会发生。在“现实生活中”，处理异常比这复杂得多。但对于入门，弄清楚异常之间的区别以及我们需要捕获它们是很重要的。\n\n未检查异常（Unchecked\
    \ exceptions）：不需要捕获，因为它们在编码时可以被移除。例如：`NullPointerException`、`IndexOutOfBoundsException`、`ArithmeticException`。\n\
    \n"
- fmt: "\nChecked exceptions: need to be caught by `try/catch` block. Example: `FileNotFoundException`,\
    \ `SQLException`.\n\nErrors: indicate some serious problem. Example: `OutOfMemoryError`.\
    \ We shouldn't try to deal with them.\n\n## Encapsulation\n\nEncapsulation is\
    \ a term that is connected with access modifiers. Imagine that you have some class\
    \ with attributes. Everything can work well, but problem may occur in context\
    \ of insecurity of your data. It is because someone can reach to your class and\
    \ make changes. So, to make this impossible and to have full control of your data\
    \ inside class, `getters` and `setters` will help you. To see on example, first\
    \ make new `fourth.pack` package and `Person` class inside. Our `Person` would\
    \ have `name` and `age` attributes, which are declared as `private`.\n\n```java\n\
    private String name;\nprivate int age;\n```\n\nNow we need to open `Source ->\
    \ Generate Getters and Setters`.\n\nFinal move is to check `name` and `age` fields\
    \ and press `OK`.\n\nexpected: Getters and Setters will be generated.\n\nSo, as\
    \ you can see, out attributes remain `private` (accessible only within class)\
    \ and methods (`getters` and `setters`) that we generated are `public`. We made\
    \ our class safer.\n\n```java\npublic String getName() {\n    return name;\n}\n\
    \npublic void setName(String name) {\n    this.name = name;\n}\n```\n\nLook at\
    \ `getName()` method. If we need our `name` for some reason we will call this\
    \ method, which return `name`. Our attributes is untouched. Same is with `setName(String\
    \ name)` method. It changes values of our `name` by referring to it with `this`\
    \ keyword.\n\n## Abstract Classes\n\nDo you remember that we mentioned classes\
    \ like `Professor` and `Student`? They are related entities and have some common\
    \ attributes like `name`, `age` and `city` in our example. So, why to always declare\
    \ that attributes again and again? Isn't would be easier to have some base class\
    \ that contains all data, attributes and methods, and to share to all classes\
    \ whose need them? Of course it would be. Class that does it is called `abstract\
    \ class`. To make previous class `Professor` abstract, add `abstract` declaration\
    \ to it's name:\n\n```java\npublic abstract class Person\n```\n\nAbstract class\
    \ can't be instantiated. Also, if there is at least one abstract method in class,\
    \ class is automatically abstract. Abstract method is method without implementation\
    \ and declared `abstract`:\n\n```java\nabstract void run();\n```\n\nNote: Make\
    \ parameterized constructor for class `Person` that includes mentioned attributes\
    \ and generate getters and setters. Also don't forget to add `run()` method.\n\
    \nNow we have our first abstract class. Another step is to make class that will\
    \ use fields from `Person` class. Let it be class `Student`, again. To make `Person`\
    \ class usable, we need `extends` declaration:\n\n```java\npublic class Student\
    \ extends Person\n```\n\nNow our class `Student` extends (shares) all fields with\
    \ `Person`, but also we can add some specific attributes for `Student`. Beside\
    \ that, constructor will looks like this now:\n\n```java\nprivate int[] grades;\n\
    \nStudent(String name, int age) {\n    super(name, age);\n    this.grades = new\
    \ int[5];\n}\n```\n\nSomething new is here for us. `super` keyword means that\
    \ our constructor refers to it's superclass. So, we extended `Person` class, which\
    \ has `name` and `age` attributes. That attributes aren't declared again in class.\
    \ Also, you can now recognize that there is an array which takes `int` values\
    \ and size is 5.\n\nNote: you can see that all the time compiler is complaining:\
    \ The type Student must implement the inherited abstract method Person.run()`.\n\
    \nThat is because we need also to implement `run()` method from our superclass\
    \ (`Person`).\n\n```java\n@Override\nvoid run() {\n    System.out.println(\"Student\
    \ runs!\");\n}\n```\n\nNote: `@Override` declaration means that method is derived\
    \ from super class. One thing that is very important is that class can only extends\
    \ one abstract class.\n\n# Chapter 9. Interfaces\n\nInterfaces are not classes.\
    \ They only contain methods and attributes whose class that implements that interfaces\
    \ need to have. You can recognize first difference from abstract classes, interfaces\
    \ are implementing by keyword `implements`, not extending. All methods are implicit\
    \ `public` and all attributes are implicit `public static final`. Let's now make\
    \ out first interface by right click on current package `New -> Interface` and\
    \ name it `House`. We will add following lines:\n\n```java\nString bed = \"My\
