    \ without the prior written permission of the copyright owner.\n\n# Chapter 1.\
    \ Primitive Types\n\nPrimitive types are most basic data types that are used in\
    \ Java. They are stored in variables. Variable is nothing but reserved memory.\
    \ Size of memory depends of primitive type. All primitive types have their default\
    \ value. Sizes are:\n\n| Primitive type | Size | Minimum | Maximum |\n| :--- |\
    \ :--- | :--- | :--- |\n| Boolean | 1-bit | - | - |\n| char | 16-bit | Unicode\
    \ 0 | Unicode 216-1 |\n| byte | 8-bit | -128 | +127 |\n| short | 16-bit | -215\
    \ | +215–1 |\n| int | 32-bit | -231 | +231–1 |\n| long | 64-bit | -263 | +263–1\
    \ |\n| float | 32-bit | IEEE754 | IEEE754 |\n| double | 64-bit | IEEE754 | IEEE754\
    \ |\n\n## Declaration and initialization of primitive types\n\n```java\nint a;\n\
    a = 1;\nint a,b;\na = 2; int b = 2;\nfinal int a = 15;//constant\n```\n\nDeclaration\
    \ means to give variable type along with name: `int a;`. So, our variable is type\
    \ of integer and have name `a`;Initialization is process of adding value to primitive\
    \ type, in this case: `int a = 0;`. Before this `int` have default value. For\
    \ boolean default value is false, for char is `'\\u0000'`, for rest is zero (0).\n\
    \n## Conversation of primitive types\n\n### Implicit\n\n```java\nint a = 1;\n\
    double b;\nb = a;\n```\n\n### Explicit\n\n```java\nlong a = 4l;\nint b = a;//mistake\n\
    int c = (int)a;\n```\n\nNote: This is called cast operator. Operators will be\
    \ covered next.\n\n# Operators\n\n### Arithmetic Operators\n\nMain operators are:\
    \ `+`, `-`, `*`, `/`, `%`\n\n| Operator | Expression | Result |\n| :--- | :---\
    \ | :--- |\n| `x = y + 1` | `y = 5` | `x = 6` |\n| `x = y - 1` | `y = 5` | `x\
    \ = 4` |\n| `x = y % 2` | `y = 5` | `x = 1` |\n| `x = ++y` | `y = 5` | `x = 6;\
    \ y = 6` |\n| `x = y++` | `y = 5` | `x = 5; y = 6` |\n| `x = --y` | `y = 5` |\
    \ `x = 4; y = 4` |\n\n| Operator | Expression | Result |\n| :--- | :--- | :---\
    \ |\n| `x = y` | `y = 3` | `x = 3` |\n| `x += y` | `y = 3` | `x = 6` |\n| `x -=\
    \ y` | `y = 3` | `x = 3` |\n| `x *= y` | `y = 3` | `x = 9` |\n| `x /= y` | `y\
    \ = 3` | `x = 2` |\n| `x %= y` | `y = 3` | `x = 0` |\n\n### Relational Operators\n\
    \nMain operators are: `<`, `>`, `<=`, `>=`, `==`, `!=`\n\n| Operator | Expression\
    \ | Result |\n| :--- | :--- | :--- |\n| `x < y` | `x = 3, y = 2` | `false` |\n\
    | `x > y` | `x = 3, y = 2` | `true` |\n| `x <= y` | `x = 3, y = 2` | `false` |\n\
    | `x >= y` | `x = 3, y = 2` | `true` |\n| `x == y` | `x = 3, y = 2` | `false`\
    \ |\n| `x != y` | `x = 3, y = 2` | `true` |\n\nArithmetic operators are commonly\
    \ used, as you guess, in math operations. Modulo (`%`) can be used to check if\
    \ number is even or odd for example. Relational operators are very simple. `==`\
    \ and `!=` are common used for comparisons. `+` can be used to concatenate two\
    \ Strings also.\n\n### Logical Operators\n\nMain operators are: `&&` (logical\
    \ AND), `||` (logical OR), `!` (logical NOT)\n\n| Operator | Expression | Result\
    \ |\n| :--- | :--- | :--- |\n| `x < 1` | `x = 2, y = 4` | `false` |\n| `x > 3`\
    \ | `x = 2, y = 4` | `false` |\n| `x < 5` | `x = 2, y = 4` | `true` |\n| `x &&\
    \ y` | | `false` |\n| `x \\| y` | | `true` |\n| `!x` | `x = false` | `true` |\n\
    \n# Chapter 2. Java Output\n\n`System.out.println` is used for printing to console\
    \ some text. Let's try it on most famous example of your first program, `Hello\
    \ World!`. To do this we need to set up our Java project.\n\n```java\nSystem.out.println(\"\
    Hello World!\");\n```\n\nWe learned how to print some messages to console. Let's\
    \ now use what we already covered and make some mix with primitive types. Create\
    \ a new class called `PrintTypes` and add main method.\n\n```java\nint a = 2;\n\
    double b = 3.14;\nSystem.out.println(\"1 Old value of b = \" + b);\nb = a;\nSystem.out.println(\"\
    2 New value of b = \" + b);\n```\n\nTry it with other operators. For example:\n\
    \n```java\nint c = 4;\nb = c * 3.14;\nSystem.out.println(\"3 New value of b =\
    \ \" + b);\n```\n\n# Control Flow Statements\n\n### IF\n\n```java\nif(condition)\n\
    \    action\nelse\n    another action\n```\n\nNow we will do some simple example\
    \ of IF usage. Make a new class `ControlFlow` and add following lines:\n\n```java\n\
    int a = 10;\nif(a < 11) {\n    System.out.println(\"A is less than 10\");\n} else\
    \ {\n    System.out.println(\"A is not less than 10\");\n}\n```\n\nLet's make\
    \ it a little more difficult. Just like in a real life you can provide more than\
    \ one condition for any situation. In this case, it is made by adding `else if`\
    \ statement. Add following lines to current class and run it:\n\n```java\nint\
    \ b = 15;\nif (b == 13)\n    System.out.println(\"b == 13\");\nelse if ((b <=\
    \ 17) && (b >= 12))\n    System.out.println(\"b is less than or equal to 17 and\
    \ greater than or equal to 12\");\nelse\n    System.out.println(\"b is not any\
    \ from this\");\n```\n\nNow we got idea how to make a simple program in Java.\
    \ Let's solve this problem. Imagine that you had test in your school. You got\
    \ some score and grade. Try to make program, using if statement, to check which\
    \ grade you got based on your score. \n\n```java\nint grade;\nint score = 85;\n\
    \nif (score >= 95)\n    grade = 10;\nelse if (score >= 85)\n    grade = 9;\nelse\
    \ if (score >= 75)\n    grade = 8;\n```\n"
