- fmt: "\n![](images/00014.jpeg)\n\n```\nb = a;\n```\n\n![](images/00015.jpeg)\n\n\
    `Operator=` is only copying a reference, not object.\n\n## Constructors\n\nConstructor\
    \ is used to initialize object. Constructor is automatically called by creation\
    \ of object and must have same name as class. There is a two type of constructors:\n\
    \n- Default constructor (no-arg constructor)\n\nFor our coding we need new class\
    \ `Student`with `main` method. Inside that method create new `Student` object\
    \ like this:\n\n```java\nStudent stud = new Student();\n```\n\nConstructors are\
    \ special methods, so we are creating them outside main method:\n\n```java\nStudent()\
    \ {\n\n}\n```\n\nNote: If default constructor is not created, compiler will do\
    \ that by default. To be sure that constructor is called let's leave some message\
    \ inside him and run program:\n\n```java\nStudent() {\n    System.out.println(\"\
    Student is created!\");\n}\n```\n\nexpected: `Student is created!` will be printed\
    \ to console.\n\n- Parameterized constructor\n\nFor this purpose, we need class\
    \ `Professor` (without `main` method) and class `Faculty` (with `main` method).\
    \ Class `Professor` will contain attributes and method along with parameterized\
    \ constructor:\n\n```java\nString name;\nint age;\nString city;\n\nProfessor(String\
    \ n, int a, String c) {\n    this.name = n;\n    this.age = a;\n    this.city\
    \ = c;\n}\n\nvoid print() {\n    System.out.println(name + \" \" + age + \" \"\
    \ + city);\n}\n```\n\nNote: `this` keyword means that we are referring to current\
    \ object. Current object is object in class which we are using.\n\nNow we want\
    \ to make this functional. Do you remember when method and constructor are called?\
    \ By creation of object, for sure. So, let's do that in `Faculty` class and run\
    \ program:\n\n```java\nProfessor prof = new Professor(\"Ivan\", 35, \"Moscow\"\
    );\nprof.print();\n```\n\nexpected: `Ivan 35 Moscow` will be printed to console.\n\
    \nOn this example is clearly shown usage of parameterized constructor. Try to\
    \ delete parameters from `Professor` object. It will make some error: The constructor\
    \ `Professor()` is undefined.\n\n### Methods\n\n```\nmodifier return_type name\
    \ (parameters) {\n    body\n}\nreturn\n```\n\nWe already covered methods and learned\
    \ how to write most of them. But, not all methods are the same. For this we need\
    \ `Area` class with `main` method. First method with `return` keyword will be\
    \ explained:\n\n```java\npublic static int countArea(int width, int height) {\n\
    \    return width * height;\n}\n```\n\n`public static` – modifier, what will be\
    \ explained a bit latter.\n`int` – return type.\n\nThis method need to be called\
    \ somehow. In this case, we are aiming to print out result of `width * height`.\
    \ To do that, `println` will help us, so this code will be put inside `main` method:\n\
    \n```java\nSystem.out.println(countArea(3, 5));\n```\n\nexpected: `15` will be\
    \ printed to console.\n\n### Void\n\nAs we saw, methods that have `return` keyword\
    \ return some value. That value could be later on used for some operation. But\
    \ what if we don't want to return anything. Just to print any message or something\
    \ like that. How to make that method? We need class `VoidMethods` with `main`\
    \ implemented. Our method will check input and based on that condition will print\
    \ relevant result. Try to make it on your own, it you got stuck see this code:\n\
    \n```java\nstatic void seasonOfYear(String s) {\n    if(s == \"Spring\") {\n \
    \       System.out.println(\"It is spring!\");\n    } else if (s == \"Summer\"\
    ) {\n        System.out.println(\"It is summer!\");\n    } else if (s == \"Autumn\"\
