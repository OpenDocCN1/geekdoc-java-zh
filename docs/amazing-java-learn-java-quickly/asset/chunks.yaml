  trans: "\n\n-   病人只能拥有一位医生\n-   医生为病人分配实验室检查\n-   检查有日期和时间\n-   检查类型：\n    -   血糖水平（上限、下限、脉搏）\n\
    \    -   血压（数值、上一次进食时间）\n\n编写一个脚本模拟以下过程：\n\n1. 创建医生 `Bob Williams`\n2. 创建患者 `Fill\
    \ Kane`\n3. 患者 `Fill` 选择 `Bob` 为其医生\n4. 医生 `Bob` 叫病人 `Fill` 进行血糖检查\n5. 医生 `Bob`\
    \ 叫病人 `Fill` 进行血压检查\n6. 检查具有 `examinationID` 和 `date` 值\n7. 显示两项检查的结果\n\n开始思考这个项目，对于\
    \ `Doctor` 和 `Patient` 实体，它们之间有相似之处吗？我们是否可能需要抽象类？检查也是如此情况吗？如何将一个医生派给一个病人？`单例模式\
    \ (Singleton pattern)`？\n\n让我们开始构建我们的项目，以更好地理解所有这些。\n\n在 `Eclipse` 中创建一个新项目 `Hospital`。我们的实体将放在\
    \ `model` 包中。每家医院都有像 `Doctor` 和 `Patient` 这样的实体，我们的也会。首先，我们将创建一个抽象类 `Person`：\n\
    \n```java\nprotected String nin;\n\nprotected String name;\nprotected String surname;\n\
    \npublic Person(String n, String name, String surname){\n\nthis.nin = n;\n\nthis.name\
    \ = name;\n\nthis.surname = surname;\n\n}\n```\n\n为 `nin`、`name` 和 `age` 属性生成\
    \ getter 和 setter。`nin` 代表国家身份号码 (National Identity Number)。下一个类是 `Doctor`：\n\n\
    ```java\npublicclass Doctor extends Person{\n\nprivate String specialty;\n\npublic\
    \ Doctor(String n, String name, String surname, String spec){\n\nsuper(n, name,\
    \ surname);\nthis.specialty = spec;\n\n}\n\n}\n```\n\n### Patient 类\n\n同样，为 `specialty`\
    \ 属性生成 getter 和 setter。`Patient` 类：\n\n```java\npublicclass Patient extends Person{\n\
    \nprivateintmedicalRecordNumber;\n\npublic Patient(String n,String name, String\
    \ surname, intmedRecNum){\n\nsuper(n, name, surname);\nthis.medicalRecordNumber\
    \ = medRecNum;\n\n}\n\n}\n```\n\n为 `medicalRecordNumber` 生成 getter 和 setter。\n\
    \n### Hospital 类\n\n我们的下一次工作是将医生分配给病人。我们有一个条件，我们的病人只能拥有一位医生。你可以猜到，需要实现 `单例模式 (singleton\
    \ pattern)`。在 `Hospital` 类中使用懒初始化：\n\n```java\nprivate Hospital(){\n\n}\n\nprivatestatic\
    \ Hospital instance;\n\npublicstatic Hospital getInstance(){\n\nif(instance ==\
    \ null){\n\ninstance = new Hospital();\n\n}\n\nreturninstance;\n\n}\n```\n\n医生和病人需要存储在某个地方。我们将使用\
    \ `HashMap`。在 `Hospital` 类中添加此内容：\n\n```java\nprivate Map<String, Person>persons\
    \ = new HashMap<String, Person>();\n```\n\n我们的 `Hospital` 还需要用于操作人的方法：\n\n```java\n\
    private Person TryGetPerson(String nin){\n\nreturnpersons.get(nin);\n}\n\npublic\
    \ Doctor TryGetDoctor(String nin){\n\nDoctor doct;\ndoct = (Doctor)TryGetPerson(nin);\n\
    returndoct;\n}\n\npublic Patient TryGetPatient(String nin){\n\nPatient patient;\n\
    patient = (Patient)TryGetPerson(nin);\n\nreturnpatient;\n\n}\n```\n\n`TryGetPerson()`\
    \ 根据其 `nin` 返回人。为了判断该人是医生还是病人，我们需要 `TryGetDoctor()` 和 `TryGetPatient()` 方法。\n\n\
    **注意**：查看脚本。在第 7 点，提到我们需要显示结果。为了这个目的，我们将使用 `log4j`，这对我们来说是新的，但是一个非常简单的功能。从此网站下载\
    \ jar 文件：[`www.java2s.com/Code/Jar/l/Downloadlog4jjar.htm`](http://www.java2s.com/Code/Jar/l/Downloadlog4jjar.htm)\n\
    \n提取文件并通过右键点击 -> Properties -> Java Build Path -> Add External JARs -> `log4j`\
    \ 将 jar 文件添加到项目。\n\n在 `Hospital` 类名下方，添加我们的 `Logger`：\n\n```java\nstatic Logger\
    \ log = Logger.getLogger(Hospital.class);\n```\n\n现在是编写实际创建医生和病人的方法了：\n\n```java\n\
    publicvoid createDoctor(String nin, String name, String surname, String spec){\n\
    \nif(TryGetDoctor(nin) == null&& !persons.containsKey(nin)){\n\nDoctor doctor\
    \ = newDoctor(nin, name, surname, spec);\npersons.put(nin, doctor);\nlog.info(\"\
    Doctor \" + name + \" \" + surname + \" with speciality \" + spec + \"is created!\"\
    );\n\n}else{\n\nlog.info(\"Doctor \" + name + \" \" + surname + \" already exists!\"\
    );\n\n}\n\n}\n\npublicvoid createPatient(String nin, String name, String surname,\
    \ intmedRecNum){\n\nif(TryGetPatient(nin) == null&& !persons.containsKey(nin)){\n\
    \nPatient patient = newPatient(nin, name, surname, medRecNum);\npersons.put(nin,\
    \ patient);\nlog.info(\"Patient \" + name + \" \" + surname + \" with medical\
    \ record \" + medRecNum + \" is created!\");\n\n}else{\n\nlog.info(\"Patient \"\
    \ + name + \" \" + surname + \" already exists!\");\n\n}\n\n}\n```\n\n两个方法都在做相同的事情。`HashMap`\
    \ 通过键值对接收输入。在这种情况下 `nin` 是键，所以在我们的方法中，我们检查该人是否存在。如果为真，我们就创建一个新的。如果假，我们就打印。\n\n\
    两个方法都在做相同的事情。`HashMap` 通过键值对接收输入。在这种情况下 `nin` 是键，所以在我们的方法中，我们检查该人是否存在。如果为真，我们就创建一个新的。如果假，我们就打印。\n\
    \n### 分配逻辑\n\n下一步是将医生分配给病人。我们有一个条件，我们的病人只能拥有一位医生。首先，在 `Patient` 类中需要一个分配医生的方法，如下：\n\
    \n```java\nprivate Doctor assign;\n\npublicassignDoctor(Doctor doc){\n\nif(Hospital.getInstance().TryGetDoctor(doc)\
    \ != null){\n\nassign = doc;\nlog.info(\"Patient is assigned to \" + doc.getName());\n\
    \n}else{\n\n}\n\n}}\n```\n\n**注意**：同样为 `Patient` 类添加 logger。\n\n```java\nstatic\
    \ Logger log = Logger.getLogger(Hospital.class);\n```\n\n在开始时医生可以有很多病人，所以在 `Doctor`\
    \ 类中需要一个 `HashMap`：\n\n```java\nprivate Map<String, Patient>patients = new HashMap<String>();\n\
    ```\n\n这个 map 需要一个添加病人的方法：\n\n```java\npublicvoid addPatient(Patient patient){\n\
    \nif(Hospital.getInstance().TryGetPatient(patient.nin) != null){\n\npatients.put(patient.nin,\
    \ patient);\n\n}\n\n}\n```\n\n`Hospital` 现在需要一个方法来实现分配给病人：\n\n```java\npublicvoid\
    \ assignToPatient(Doctor doctor, Patient patient){\n\npatient.assignDoctor(doctor);\n\
    \n}\n```\n\n### 检查\n\n现在是处理检查了。每个检查都有 ID 和 `date` 共同属性，因此在这种情况下可以使用抽象类的概念。`LaboratoryExamination`\
    \ 将是我们的抽象类：\n\n```java\npublicabstract class LaboratoryExamination {\n\npublic\
    \ String examinationID;\npublic Date date;\n\npublicLaboratoryExamination(String\
    \ exam, Date date){\n\nthis.examinationID = exam;\nthis.date = date;\n\n}}\n\n\
    不要忘记生成 getter 和 setter，还要导入 `java.util.Date` 类。我们还没有讨论这个，但编译器会提示导入 `Map`、`HashMap`\
    \ 和 `Hospital` 类到 `Doctor` 和 `Patient` 类中。只需执行。\n\n`BloodSugarLevel` 类：\n\n```java\n\
    publicclass BloodSugarLevel extends LaboratoryExamination{\n\nprivate double value;\n\
    private Date lastMealTime;\n\npublic BloodSugarLevel(String exam, Date date, double\
    \ value, Date last){\n\nsuper(exam, date);\nthis.value = value;\nthis.lastMealTime\
    \ = last;\n\n}\n\npublic BloodSugarLevel(String exam, Date date){\n\nsuper(exam,\
    \ date);\n\n}\n\n}\n```\n\n`BloodPressure` 类：\n\n```java\npublicclass BloodPressure\
    \ extends LaboratoryExamination{\n\nprivate int upperValue;\nprivate int lowerValue;\n\
    private int pulse;\n\npublic BloodPressure(String exam, Date date, int upper,\
    \ int lower, int pulse){\n\nsuper(exam, date);\nthis.upperValue = upper;\nthis.lowerValue\
    \ = lower;\nthis.pulse = pulse;\n\n}\n\npublic BloodPressure(String exam, Date\
    \ date){\n\nsuper(exam, date);\n\n}\n\n}\n```\n\n在我们制作最后的用于操作检查的方法之前，我们需要一个持有\
    \ `Patient`、`Doctor` 和 `LaboratoryExamination` 类引用的类。你稍后会看到为什么，所以创建一个 `PatientDoctorExamination`\
    \ 类：\n\n```java\nprivate Doctor doctor;\n\nprivate Patient patient;\nprivate LaboratoryExamination\
    \ labExam;\n\npublic PatientDoctorExamination(Doctor doc, Patient pat, LaboratoryExamination\
    \ ladExamination){\n\nthis.doctor = doc;\nthis.patient = pat;\nthis.labExam =\
    \ ladExamination;\n\n}\n```\n\n"
- fmt: "\nLet's finish with our `Hospital` class. Like with persons, we need `HashMap`\
    \ for examinations:\n\n```java\nprivate Map<Integer, PatientDoctorExamination>examinations\
    \ = new HashMap<Integer, PatientDoctorExamination>();\n```\n\nHere you can see\
    \ usage of previous `PatientDoctorExamination` class. Also, we need something\
    \ that will store our examinations. For this, let's use `enum` in `Hospital` class:\n\
    \n```java\npublic enum laboratoryExaminations{\n    bloodPressure,\n    bloodSugarLevel,\n\
    }\n```\n\nOk, but as always, we need something to do with our data, examinations.\
    \ Method need to put our examination to `HashMap` based on input. One more thing\
    \ that we covered earlier will be used, `switch`, so add method to `Hospital`\
    \ class:\n\n```java\nprivate int examID;\n\npublic int ScheduleExamination(Doctor\
    \ doctor, Patient patient, Date date, laboratoryExaminations examinationsLab){\n\
    \    LaboratoryExamination examination = null;\n    switch(examinationsLab){\n\
    \        case bloodPressure:\n            examination = new BloodPressure(examID,\
    \ date);\n            break;\n        case bloodSugarLevel:\n            examination\
    \ = new BloodSugarLevel(examID, date);\n            break;\n    }\n    examinations.put(examID,\
    \ new PatientDoctorExamination(doctor, patient, examination));\n    examID++;\n\
    \    return examination.examinationID;\n}\n```\n\nLast one thing that we need\
    \ to do in `Hospital` class to make it functional is to somehow make methods that\
    \ are finally making examinations. This will be shown is code below:\n\n```java\n\
    public void FillBloodSugarLevelExamination(int examinationID, double value, Date\
    \ date){\n    PatientDoctorExamination patientDoctorExamination = null;\n    patientDoctorExamination\
    \ = examinations.get(examinationID);\n    if(patientDoctorExamination != null){\n\
    \        if(patientDoctorExamination.getLabExam() instanceof BloodSugarLevel){\n\
    \            BloodSugarLevel bloodSugarLevel = (BloodSugarLevel)patientDoctorExamination.getLabExam();\n\
    \            bloodSugarLevel.setValue(value);\n            bloodSugarLevel.setLastMealTime(date);\n\
    \            log.info(\"Examination is successfully done! \\n\" +\"=======\\n\"\
    + \"value: \" + value + \", last meal time: \" + date);\n        }else\n     \
    \       log.info(\"Selected examination is not for blood sugar level!\");\n  \
    \  }else\n        log.info(\"Selected examination does not exist!\");\n}\n\npublic\
    \ void FillBloodPressureExamination(int examinationID, int upperValue, int lowerValue,\
    \ int pulse){\n    PatientDoctorExamination patientDoctorExamination = null;\n\
    \    patientDoctorExamination = examinations.get(examinationID);\n    if(patientDoctorExamination\
    \ != null){\n        if(patientDoctorExamination.getLabExam() instanceof BloodPressure){\n\
    \            BloodPressure bloodPressure = (BloodPressure)patientDoctorExamination.getLabExam();\n\
    \            bloodPressure.setUpperValue(upperValue);\n            bloodPressure.setLowervalue(lowerValue);\n\
    \            bloodPressure.setPulse(pulse);\n            log.info(\"Examination\
    \ is successfully done! \\n\" +\"=======\\n\"+\"upper value: \" + upperValue +\
    \ \", lower value: \" + lowerValue + \", pulse: \" + pulse);\n        }else\n\
    \            log.info(\"Selected examination is not for blood pressure!\");\n\
    \    }else\n        log.info(\"Selected examination does not exist!\");\n}\n```\n\
    \nNow when all characteristics and conditions are satisfied, only thing that is\
