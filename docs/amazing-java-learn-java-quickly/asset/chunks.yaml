    # Chapter 10. Design Patterns


    ## Singleton Pattern


    Singleton pattern is one of most commonly used design patterns. He belongs tocreational
    pattern category. Pattern restrict object creations and ensures that only one
    instance of class exists. Imagine that you only need one garage at home, only
    one HR at company, only one captain at team. That are examples from real life
    in whose you will need singleton pattern. For implementation of pattern we need
    some conditions:


    *   private constructor - We didn`t explained in constructor section, but in short
    private constructor doesn`t give class to be instantiated from another class


    *   private static instance – only instance of the class


    *   public static method – method which returns instance of class


    There are two types of making class singleton:


    *   Lazy initialization


    To better figure out what exactly means this three conditions, let`s see out code
    below:


    private SingletonOne(){


    }


    privatestatic SingletonOne instance;


    publicstatic SingletonOne getInstance(){


    if(instance == null){


    instance = new SingletonOne();


    }


    returninstance;


    }


    Creation of Class object is derived to getInstance() method. As public static
    method have global access and there is no need for object for calling, static
    method is called by class name. This type of singleton pattern is called lazy
    because instance of Class is not created until getInstance() method is called.
    getInstance() method checks if there is already instance, is it is false (null)
    method creates new one (new CLass())and return it.With lazy initialization you
    crate instance only when its needed and not when the class is loaded. So you escape
    the unnecessary object creation.


    *   Eager initialization


    privatestaticfinal SingletonTwo instance = new SingletonTwo();


    private SingletonTwo(){}


    publicstatic SingletonTwo getInstance(){


    returninstance;


    }


    Unlike lazy initialization, eager initialization is done when class is loaded.
    So, difference is that in first approach you get instance of singleton class only
    when you actually need it.


    ## MVC Pattern


    MVC pattern is maybe most common used pattern in making Java applications. As
    name tells, this is acronym of Model – View – Controller


    *   Model – represents data or POJO classes. POJO is just declaration which must
    match some conditions like: public default no-arg constructor, private attributes
    and getters and setters.


    *   View – represents view of mentioned attributes.


    *   Controller – controller behaves between both model and view, it updates view
    based on changes from model.


    For our explanation we need classes below:


    publicclass Doctor {


    private String name;


    privateintage;


    Doctor() {}


    public String getName() {


    returnname;


    }


    publicvoid setName(String name) {


    this.name = name;


    }


    publicint getAge() {


    returnage;


    }


    publicvoid setAge(intage) {


    this.age = age;


    }


    }


    Class Doctor represents our model. If you remember, default no-arg constructor
    will be made by default by compiler, but we did it just to don`t make confusion.


    publicclass ShowDoctor {


    publicvoid showDoctor(String name, intage) {


    System.out.println("Doctor with name: " + name + " and age: " + age);


    }


    }


    This class represent String presentation, view, of our Doctor with attributes
    name and age.


    publicclass Controller {


    private Doctor doctor;


    private ShowDoctor showD;


    Controller(Doctor d, ShowDoctor s) {


    this.doctor = d;


    this.showD = s;


    }


    public Doctor getDoctor() {


    returndoctor;


    }


    publicvoid setDoctor(Doctor doctor) {


    this.doctor = doctor;


    }


    public ShowDoctor getShowD() {


    returnshowD;


    }


    publicvoid setShowD(ShowDoctor showD) {


    this.showD = showD;


    }


    void shomMeDoctor() {


    showD.showDoctor(doctor.getName(), doctor.getAge());


    }


    }


    As you can see, our controller takes references from both model and view classes.
    Now we need one class to manage with all this classes.


    publicclass Program {


    Doctor doctor = setDoctorAttributes();


    ShowDoctor show = newShowDoctor();


    Controller controller = newController(doctor, show);


    privatestatic Doctor setDoctorAttributes(){


    Doctor doc = newDoctor();


    doc.setName("Bob");


    doc.setAge(50);


    returndoc;


    }


    void printDoctor(){


    controller.shomMeDoctor();


    }


    publicstaticvoid main(String[] args){


    Program program = newProgram();


    program.printDoctor();


    }


    }


    Program is class with main method, you remember that main method is used for calling
    other methods. Our whole program would not be possible to start without it, so
    we needed to create object of current class. We provided references of Doctor,
    ShowDoctor and Controller to current class. Association is here used for code
    reusing. Because we don`t have doctor, method setDoctorAttributes() is made to
    set values. It is done by using doc reference and setName() and setAge() method,
    in other words setters. This method is derived to doctor reference. We don’t create
    new doctor by newDoctor();Output is: Doctor with name: Bob and age: 50


    ## Project


    Everything that we covered until now have his own usage and it is very important
    part of Java programing. But they are only parts of one big “story”. Best way
    for learning something, Java also, is to use it on real problems, in this case
    in project. In this last section, we will try to make from all (almost all) that
    we learned, one functional project. Based on this you will have clearerpicture
    how and when to use some features of Java. Idea is to make a project Hospital.


    Characteristics of Hospital are:


    *   Doctor (name, surname, specialty) have many Patient (name, surname, medical
    record number)'
