  Output\n\n## 6.2 结构型\n\n### 6.2.1 Fac 面 (Facade)\n\n为子系统中的一组接口提供统一的接口。Facade 定义了一个更高层次的接口，使得子系统更容易使用。\n\
  \n![](img/images----Facade1.png)\n\n**用例：**\n\n*   将复杂系统划分为几个简单的子系统。\n*   Facade\
  \ 促进了松耦合。\n*   将系统划分为不同的层，并通过 facade 进行这些通信。\n*   减少客户端与所用子系统之间的依赖关系。\n\n![](img/images----Facade2.png)\n\
  \n#### 6.2.1.1 示例：[`旅行](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/facade/travel)\n\
  \n```java\n1 public class HotelBooker {\n2     public List<Hotel> hotels(LocalDate\
  \ from, LocalDate to) {\n3         // 返回特定日期范围内的可用酒店\n4    }\n5 }\n```\n\nHotelBooker\n\
  \n```java\n1 public class FlightBooker {\n2     public List<Flight> flights(LocalDate\
  \ from, LocalDate to) {\n3         // 返回特定日期范围内的可用航班\n4     }\n5 }\n```\n\nFlightBooker\n\
  \n```java\n 1 public class TravelFacade {\n2     private HotelBooker hotelBooker;\n\
  3     private FlightBooker flightBooker;\n4 \n5     public Travels availableTravels(LocalDate\
  \ from, LocalData to) {\n6         List<Flight> flights = flightBooker.flights(from,\
  \ to);\n7         List<Hotel> hotels = hotelBooker.hotels(from, to);\n8 \n9    \
  \     // 处理\n10      }\n11 }\n```\n\nTravelFacade\n\n```java\n1 public class Client\
  \ {\n2      public static void main(String[] args) {\n3          TravelFacade facade\
  \ = new TravelFacade();\n4          facade.availableTravels(from, to);\n5      }\n\
  6 }\n```\n\nClient\n\n**优点：**\n\n*   **简化的接口**。通过减少客户端需要了解的对象数量，客户端可以更容易地使用复杂系统。\n\
  *   **解耦**客户端与子系统。由于客户端面向 facade 工作，因此它独立于子系统的变化。\n*   对子系统的**维护**和修改仅意味着系统内部的变化，而对外部的\
  \ facade 接口最多可以保持不变。\n\n### 6.2.2 装饰器 (Decorator)\n\n动态地为对象附加额外的职责。装饰器为通过子类扩展功能提供了一种灵活的替代方案。\n\
  \n![](img/images----Decorator1.png)\n\n**用例：**\n\n*   静态子类化（继承）对象的替代方案。\n*   动态添加或删除功能。\n\
  *   对 `final` 类的扩展（因为 `final` 类是不可继承的）。\n*   如果通过静态继承实现功能不可行（例如，由于类的数量多到无法管理，如果考虑每种可能的组合将会导致类的数量激增），则应使用装饰器。\n\
  *   实际示例：\n    *   Java IO API，`BufferedInputStream` 对缓冲器接口进行了扩展。\n    *   具有不同特征的不同类型的汽车（低底、尾翼）。\n\
  \    *   带有各种配菜的菜。\n    *   具有不同行为（震动、铃声、静音、灯）的不同类型的电话（手机、智能手机、经典电话）。\n\n![](img/images----Decorator2.png)\n\
  \n#### 6.2.2.1 示例：[`消息](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/decorator/message)\n\
  \n```java\n1 public interface Message {\n2     void print(String text);\n3 }\n```\n\
  \nMessage\n\n```java\n1 public class DefaultMessage implements Message {\n2 \n3\
  \     @Override\n4     public void print(String text) {\n5         System.out.println(text);\n\
  6     }\n7 }\n```\n\nDefaultMessage\n\n```java\n 1 public class TimeStampMessage\
  \ implements Message {\n2 \n3     private final Message message;\n4 \n5     public\
  \ TimeStampMessage(Message message) {\n6         this.message = message;\n7    \
  \ }\n 8 \n9     @Override\n10     public void print(String text) {\n11         this.message.print(String.format(\"\
  %s %s\", LocalDateTime.now(), text));\n12     }\n13 }\n```\n\nTimeStampMessage\n\
  \n\n\n\n```java\npublic class Client {\n    public static void main(String[] args)\
  \ {\n        new DefaultMessage().print(\"DefaultMessage\");\n        new UpperCaseMessage(new\
  \ DefaultMessage()).print(\"DefaultMessage\");\n        new TimeStampMessage(new\
  \ DefaultMessage()).print(\"DefaultMessage\");\n        new UpperCaseMessage(new\
  \ TimeStampMessage(new DefaultMessage())).print(\"DefaultMessage\");\n    }\n}\n\
  ```\n\n`Client`\n\n```\nDefaultMessage\nDEFAULTMESSAGE\n2020-12-29T13:04:38.388325800\
  \ DefaultMessage\n2020-12-29T13:04:38.416309600 DEFAULTMESSAGE\n```\n\n输出\n\n####\
  \ 6.2.2.2 示例 [`Window`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/decorator/window)\n\
  \n![](img/images----Decorator3.png)\n\n```java\npublic interface Window {\n    void\
  \ renderWindow();\n}\n```\n\n`Window`\n\n```java\npublic class SimpleWindow implements\
  \ Window {\n    public void renderWindow() {\n        // 细节的实现\n    }\n}\n```\n\n\
  `SimpleWindow`\n\n```java\npublic class DecoratedWindow implements Window {\n  \
  \  private Window window = null;\n\n    public DecoratedWindow(Window window) {\n\
  \        this.window = window;\n    }\n\n    public void renderWindow() {\n    \
  \    window.renderWindow();\n    }\n}\n```\n\n`DecoratedWindow`\n\n```java\npublic\
  \ class ScrollableWindow extends DecoratedWindow {\n    private Object scrollBar\
  \ = null;\n\n    public ScrollableWindow(Window window) {\n        super(window);\n\
  \    }\n\n    public void renderWindow() {\n        super.renderWindow();\n    \
  \    renderScrollBar();\n    }\n\n    private void renderScrollBar() {\n       \
  \ scrollBar = new Object(); // 准备滚动条\n        // 渲染滚动条\n    }\n}\n```\n\n`ScrollableWindow`\n\
  \n```java\npublic class Client {\n    public static void main(String[] args) {\n\
  \        Window window = new SimpleWindow();\n        window.renderWindow();\n\n\
  \        // 在之后的某个时刻，文本大小可能会比窗口大\n        // 因此，必须添加滚动行为\n\n        // 装饰旧的窗口，现在\
  \ window 对象具有了额外的行为\n        window = new ScrollableWindow(window);\n\n        window.renderWindow();\n\
  \    }\n}\n```\n\n`Client`\n\n**优点：**\n\n*   装饰器比继承提供了`更多可能性`，因为它不是静态的，因此它定义了子类的行为。\n\
  *   `精简、高内聚的类`。每个装饰器恰好表示一个功能，且无其他。这增加了类的内聚性，并使相应的代码更容易维护和扩展。\n*   避免了冗长且混乱的继承层次结构。\n\
  *   通过组合几个装饰器对象，可以极大地扩展对象的功能。\n\n**缺点：**\n\n*   被装饰的对象被实际的装饰器封装。这使得确定对象的身份变得困难。\n\
  *   对象`数量较多`。每个额外的功能都需要一个新的装饰器对象。许多微小、相似的对象及其初始化代码可能会迅速变得混乱。可以通过工厂模式来解决。\n*   装饰器模式是一个`动态过程`，因此通常情况下运行时性能优于经典的继承。\n\
  \n### 6.2.3 适配器\n\n将类的接口转换为客户端期望的另一个接口。适配器允许那些因接口不兼容而无法工作的类共同工作。\n\n**适配器模式定义了四个角色：**\n\
  \n*   `被适配者 (Adaptee)`需要被适配到目标接口。\n*   `适配器 (Adapter)`执行适配。\n*   `目标接口 (Target interface)`客户端使用的接口。\n\
  *   `客户端 (Client)`通过适配器使用被适配者。\n\n**类适配器使用多重继承：**\n\n在类适配器的情况下，适配器继承了我们的被适配类并实现了目标接口。当客户端对象调用类适配器的方法时，适配器在内部调用它所继承的适配器的方法。\n\
  \n![](img/images----Adapter1.png)\n\n**对象适配器依赖于对象组合：**\n\n在对象适配器的情况下，适配器委托给被适配者的实例。适配器实现目标接口，但没有继承需要适配的类。当客户端调用对象适配器的方法时，对象适配器调用它引用的被适配者实例上的对应方法。\n\
  \n![](img/images----Adapter2.png)\n\n#### 6.2.3.1 示例 [`Sorter`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/adapter/sorter)\n\
  \n![](img/images----Adapter3.png)\n\n```java\npublic interface Sorter {\n    int[]\
  \ sort(int[] numbers);\n}\n```\n\n`Sorter` - 目标接口\n\n```java\npublic class SortListAdapter\
  \ implements Sorter {\n    public int[] sort(int[] numbers) {\n        List<Integer>\
  \ numberList = convertToList(numbers);\n        return numberSorter.sort(numberList);\n\
  \    }\n}\n```\n\n`SortListAdapter` - 适配器\n\n```java\n// 处理列表而不是数组的第三方实现。\npublic\
  \ class NumberSorter {\n    public List<Integer> sort(List<Integer> numbers) {\n\
  \        // 实现\n    }\n}\n```\n\n`NumberSorter` - 被适配者\n\n```java\npublic class\
  \ Client {\n    public static void main(String[] args) {\n        Sorter sorter\
  \ = new SortListAdapter();\n        sorter.sort(new int[]{1, 2, 3});\n    }\n}\n\
  ```\n\n`Client`\n\n#### 6.2.3.2 示例 [`TextFormatter`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/adapter/textformatter)\n\
  \n![](img/images----Adapter4.png)\n\n```java\npublic interface Textattable {\n \
  \   String formatText(String text, String separator);\n}\n```\n\n`Textattable` -\
  \ 目标接口\n\n```java\npublic class NewlineFormatter implements Textattable {\n    @Override\n\
  \    public String formatText(String text, String separator) {\n        if (text\
  \ != null && separator != null) {\n            return Stream.of(text.split(Pattern.quote(separator)))\n\
  \                    .map(String::strip)\n                    .collect(Collectors.joining(System.lineSeparator()));\n\
  \        }\n        return null;\n    }\n}\n```\n\n`NewlineFormatter` - 适配器\n\n\
  ```java\npublic interface Csvattable {\n    String formatCsv(String text, String\
  \ separator);\n}\n```\n\n`Csvattable` - 目标接口\n\n```java\npublic class CsvFormatter\
  \ implements Csvattable {\n    @Override\n    public String formatCsv(String text,\
  \ String separator) {\n        if (text != null && separator != null) {\n      \
  \      return Stream.of(text.split(Pattern.quote(separator)))\n                \
  \    .collect(Collectors.joining(\", \"));\n        }\n        return null;\n  \
  \  }\n}\n```\n\n`CsvFormatter` - 被适配者\n\n```java\npublic class CsvAdapter implements\
  \ Textattable {\n    private final CsvFormatter csvFormatter;\n\n    public CsvAdapter(CsvFormatter\
  \ csvFormatter) {\n        this.csvFormatter = csvFormatter;\n    }\n\n    @Override\n\
  \    public String formatText(String text, String separator) {\n        return this.csvFormatter.formatCsv(text,\
  \ separator);\n    }\n}\n```\n\n`CsvAdapter` - 适配器\n\n```java\npublic class Client\
  \ {\n    public static void main(String[] args) {\n        String text = \"Adapter\
  \ Pattern 1\\. Adapter Pattern 2\\. Adapter Pattern 3.\";\n\n        Textattable\
  \ tf = new NewlineFormatter();\n        System.out.println(tf.formatText(text, \"\
  .\"));\n\n        tf = new CsvAdapter(new CsvFormatter());\n        System.out.println(tf.formatText(text,\
  \ \".\"));\n    }\n}\n```\n\n`Client`\n\n### 6.2.4 组合\n\n将对象组合成树形结构以表示部分-整体层次。组合允许客户端以统一的方式处理单个对象和对象的组合。\n\
  \n![](img/images----Composite1.png)\n\n**用例：**\n\n\n\n\n\n* 对一组简单和复杂对象的层次级集合进行操作。\n\
  * 对对象的树形结构进行建模\n    * **文件系统**。文件和文件夹可以使用组合模式进行建模。文件代表叶子节点，文件夹代表组合节点，因为它们可能包含其他文件和文件夹。\n\
  \    * **菜单**。菜单由一个根节点（组合节点）和命令（叶子节点）组成。\n    * 图形对象的层次结构，例如在 Java / AWT 中的 (`Container`\
  \ & `Component`)。\n\n![](img/images----Composite2.png)\n\n#### 6.2.4.1 示例：[`Graphic`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/behavioral/composite/graphic)\n\
