  , \"US\", \"Carson City\"));\n        new Person(\"Nevin\", \"Roddell\", \"5 Del\
  \ Sol Alley\", \n            factory.of(\"United States\", \"US\", \"Carson City\"\
  ));\n        new Person(\"Hunter\", \"Lewins\", \"33733 Heffernan Circle\", \n \
  \           factory.of(\"United States\", \"US\", \"Carson City\"));\n\n       \
  \ new Person(\"Reube\", \"Gregoretti\", \"08 Melrose Street\", \n            factory.of(\"\
  Japan\", \"JP\", \"Mutsu\"));\n    }\n}\n```\n\nEmployee\n\n### 优点\n\n*   通过减少对象的数量来提高性能。\n\
  *   由于内省属性在对象之间共享公共属性，减少了内存占用。\n\n### 缺点\n\n*   如果对象中没有可共享的属性，该模式将毫无用处。\n*   可能会引入与传输、查找和/或计算外部状态相关的运行时开销，特别是当这些状态以前作为内省状态存储时。\n\
  \n### 6.2.7 代理 (Proxy)\n\n为另一个对象提供代理或占位符，以控制对其的访问。\n\n![](img/images----Proxy1.png)\n\
  \n#### 用例：\n\n*   代理通常用于需要更复杂的对象引用而非普通指针的情况。通常区分以下几种类型的代理：\n    *   **远程代理 (Remote\
  \ proxy)**：为另一个远程对象或资源提供本地表示。\n    *   **虚拟代理 (Virtual proxy)**：封装昂贵的对象并按需加载。\n\
  \    *   **保护性代理 (Protection proxy)**：为原始对象提供访问控制。\n    *   **智能引用 (Smart reference)**：在访问对象时执行额外的操作。\n\
  \n#### 6.2.7.1 示例：[`太空飞 Spaceship`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/proxy/spaceship)\n\
  \n```java\ninterface Spaceship {\n    void fly();\n}\n```\n\nSpaceship\n\n```java\n\
  public final class Pilot {\n\n    private final String name;\n\n    public Pilot(String\
  \ name) {\n        this.name = name;\n    }\n\n    public String name() {\n    \
  \    return this.name;\n    }\n}\n```\n\nPilot\n\n```java\npublic final class MillenniumFalcon\
  \ implements Spaceship {\n\n    @Override\n    public void fly() {\n    }\n}\n```\n\
  \nMillenniumFalcon\n\n```java\npublic final class MillenniumProxy implements Spaceship\
  \ {\n\n    private final Pilot pilot;\n    private final Spaceship ship;\n\n   \
  \ public MillenniumProxy(Pilot pilot) {\n        this.pilot = pilot;\n    }\n\n\
  \    @Override\n    public void fly() {\n        if (\"Han Solo\".equals(this.pilot.name()))\
  \ {\n            ship.fly();\n        } else {\n            System.out.printf(\"\
  Sorry %s, only Solo can fly!\\n\", this.pilot.name());\n        }\n    }\n}\n```\n\
  \nMillenniumProxy\n\n```java\npublic class Client {\n\n    public static void main(String[]\
  \ args) {\n        Spaceship ship = new MillenniumProxy(new Pilot(\"Han Solo\"));\n\
  \        ship.fly();\n\n        ship = new MillenniumProxy(new Pilot(\"Darth Vader\"\
  ));\n        ship.fly();\n    }\n}\n```\n\nClient\n\n#### 6.2.7.2 示例：[`图片查看器 ImageViewer`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/proxy/imageviewer)\n\
  \n```java\ninterface ImageViewer {\n    void display();\n}\n```\n\nImageViewer\n\
  \n```java\npublic final class DefaultImageViewer implements ImageViewer {\n\n  \
  \  private final Image image;\n\n    public DefaultImageViewer(String path) {\n\
  \        this.image = Image.load(path);\n    }\n\n    @Override\n    public void\
  \ display() {\n        this.image.display();\n    }\n}\n```\n\nDefaultImageViewer\n\
  \n```java\npublic interface Image {\n    void display();\n\n    static Image load(String\
  \ path) {\n        // 未实现\n        return null;\n    }\n}\n```\n\nImage\n\n```java\n\
  public final class ImageViewerProxy implements ImageViewer {\n\n    private final\
  \ String path;\n    private ImageViewer viewer;\n\n    public ImageViewerProxy(String\
  \ path) {\n        this.path = path;\n    }\n\n    @Override\n    public void display()\
  \ {\n        if (this.viewer == null) {\n            this.viewer = new DefaultImageViewer(this.path);\n\
  \        }\n\n        this.viewer.display();\n    }\n}\n```\n\nImageViewerProxy\n\
  \n```java\npublic class Client {\n\n    public static void main(String[] args) {\n\
  \        ImageViewer beer = new ImageViewerProxy(\"./img/beer.png\");\n        ImageViewer\
  \ hammock = new ImageViewerProxy(\"./img/hammock.png\");\n\n        beer.display();\n\
  \        beer.display(); // DefaultImageViewer 将调用并执行一次\n\n        hammock.display();\n\
  \    }\n}\n```\n\nClient\n\n## 6.3 行为 (Behavioral)\n\n### 6.3.1 状态 (State)\n\n允许对象在其内部状态改变时改变其行为。该对象看起来改变了自己的类。\n\
  \n![](img/images----State1.png)\n\n\n\n\n\n- `状态机`，例如 `解析器`。许多文本解析器的功能不可避免地基于状态的。因此，编译器在解析源代码时必须根据之前读取的字符来解释当前字符。\n\
  - 网络连接状态的表示\n\n#### 6.3.1.1 示例: [`MP3Player`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/behavioral/state/mp3player)\n\
  \n![](img/images----State-Mp3Player.png)\n\n```\n 1 public class MP3Player {\n 2\
  \     private State state;\n 3 \n 4     private MP3Player(State state) {\n 5   \
  \      this.state = state;\n 6     }\n 7     public void play() {\n 8         state.pressPlay(this);\n\
  \ 9     }\n10     public void state(State state) {\n11         this.state = state;\n\
  12     }\n13     public State state() {\n14         return state;\n15     }\n16\
  \ }\n```\n\nMP3Player\n\n```\n1 public interface State {\n2     void pressPlay(MP3Player\
  \ player);\n3 }\n```\n\nState\n\n```\n1 public class PlayingState implements State\
  \ {\n2     public void pressPlay(MP3Player player) {\n3         player.state(new\
  \ StandByState());\n4     }\n5 }\n```\n\nPlayingState\n\n```\n1 public class StandByState\
  \ implements State {\n2     public void pressPlay(MP3Player player) {\n3       \
  \  player.state(new PlayingState());\n4     }\n5 }\n```\n\nStandByState\n\n```\n\
  \ 1 public class Client {\n 2     public static void main(String[] args) {\n 3 \
  \        MP3Player player = new MP3Player(new PlayingState());\n 4         player.play();\n\
  \ 5         player.play();\n 6         player.play();\n 7         player.play();\n\
  \ 8         player.play();\n 9         player.play();\n10     }\n11 }\n```\n\nClient\n\
  \n```\n1 Play state\n2 Standby state\n3 Play state\n4 Standby state\n5 Play state\n\
  6 Standby state\n7 Play state\n```\n\nOutput\n\n#### 6.3.1.2 示例: [`Door`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/behavioral/state/door)\n\
  \n![](img/images----State-Door.png)\n\n```\n 1 public class Door {\n 2 \n 3    \
