  Output\n\n#### 6.1.5.3 示例：[`Person - 拷贝构造函数 / 工厂方法`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/creational/prototype/copy/person)\n\
  \n根据《Effective Java》，`clone` 和 `java.lang.Cloneable` 是复杂的，且重写 `clone` 的规则非常棘手，难以正确实现。\n\
  \n\n\n\n\n`Object` 的 `clone` 方法非常棘手。它是基于字段复制的，并且是跨语言边界的。它在不调用构造函数的情况下创建一个对象。它无法保证能保持由构造函数建立的变不变性。如果该状态是可变的，那么你并没有拥有两个独立的对象。如果你修改了其中一个，另一个也会随之改变。突然，你会得到随机的行为。更好的方法是提供一个`拷贝构造函数`或`拷贝工厂`。^(2)\n\
  \n```java\n 1 public class Person {\n 2 \n3     private String name;\n 4     private\
  \ Address address;\n 5 \n6     // 拷贝构造函数\n 7     public Person(Person person) {\n\
  \ 8         this(person.name(), new Address(person.address()));\n 9     }\n10 \n\
  11     public Person(String name, Address address) {\n12         this.name = name;\n\
  13         this.address = address;\n14     }\n15 \n16     public String name() {\n\
  17         return this.name;\n18     }\n19 \n20     public void name(String name)\
  \ {\n21         this.name = name;\n22     }\n23 \n24     public Address address()\
  \ {\n25         return this.address;\n26     }\n27 \n28     public void address(Address\
  \ address) {\n29         this.address = address;\n30     }\n31 \n32     // 拷贝工厂\n\
  33     public static Person newInstance(Person person) {\n34         return new\
  \ Person(person.name(), new Address(person.address()));\n35     }\n36 }\n```\n\n\
  Person\n\n```java\n 1 public class Address {\n 2 \n3     private String city;\n\
  \ 4     private String street;\n 5 \n6     // 拷贝构造函数\n 7     public Address(Address\
