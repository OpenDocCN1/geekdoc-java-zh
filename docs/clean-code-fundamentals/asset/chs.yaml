  \ {\n        if (isPortFree()) {\n           ....\n        }\n    }\n\n    public\
  \ int port() {\n        return this.port;\n    }\n\n    public void stop() {\n \
  \   ...\n        destroyThreadPool();\n        ...\n    }\n\n    private boolean\
  \ isPortFree() { ... }\n\n    private void destroyThreadPool() { ... }\n}\n```\n\
  \nBad code\n\n```java\npublic class WebServer {\n    \n    private final int port;\n\
  \    private final String hostname;\n\n    public WebServer() {\n        this(8080,\
