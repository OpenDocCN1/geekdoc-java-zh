  ```\n\n良好的代码\n\n#### 5.3.2.3 示例：[`HumanResourceDepartment`](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/ocp/humanresource)\n\
  \n**不符合规范的代码示例**\n\n```java\npublic class HumanResourceDepartment {\n    private\
