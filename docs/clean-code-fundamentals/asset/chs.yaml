  \ void useSamsung() {\n        Television television = new Samsung();\n        SmartRemoteControl\
  \ remoteControl = new SmartRemoteControl(television);\n\n        remoteControl.on();\n\
  \        remoteControl.nextChannel();\n        remoteControl.nextChannel();\n  \
  \      remoteControl.previousChannel();\n        remoteControl.off();\n    }\n\n\
  \    private static void usePhilips() {\n        Television television = new Philips();\n\
  \        SmartRemoteControl remoteControl = new SmartRemoteControl(television);\n\
  \n        remoteControl.on();\n        remoteControl.nextChannel();\n        remoteControl.nextChannel();\n\
  \        remoteControl.previousChannel();\n        remoteControl.off();\n    }\n\
  }\n```\n\n### 客户端\n\n#### 优势\n- 抽象与实现之间是`解耦`且`独立`的。\n- 提高了了`扩展性`，你可以独立地扩展抽象和实现层次结构。\n\
  - 实现也可以在`运行时动态更改`。\n- 对客户端`隐藏`了实现细节。\n\n### 6.2.6 享量模式\n\n*通过共享高效地支持大量的细粒度对象。*\n\
  \n![](img/images----Flyweight1.png)\n\n#### 用例\n- 当内存成本是限制时，需要创建`大量`对象。\n- 当许多对象的属性可以变为`外部且共享`时。\n\
  - 避免不必要的对象`初始化`。\n- 当对象的`标识性`不是关注点，且所需的操作可以在共享对象上执行时。\n\n根据 GoF 的定义，对象可以有两种状态：内部状态和外部状态：\n\
  \n##### 内部状态\n存储在享量对象中；它由独立于享量模式上下文的信息组成，因此是可共享的。\n\n##### 外部状态\n依赖于并随享量模式的上下文而变化，因此不能共享。客户端对象负责在必要时将外部状态传递给享量模式对象。\n\
  \n#### 6.2.6.1 示例：[字体](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/flyweight/font)\n\
  \n```java\npublic final class Font {\n    private final String name;\n    private\
  \ final int size;\n\n    public Font(String name, int size) {\n        this.name\
  \ = name;\n        this.size = size;\n    }\n\n    public String name() {\n    \
  \    return name;\n    }\n\n    public int size() {\n        return size;\n    }\n\
  \n    @Override\n    public int hashCode() {\n        return Objects.hash(name,\
  \ size);\n    }\n\n    @Override\n    public boolean equals(Object obj) {\n    \
  \    if (this == obj) {\n            return true;\n        }\n        if (obj ==\
  \ null) {\n            return false;\n        }\n        if (getClass() != obj.getClass())\
  \ {\n            return false;\n        }\n        Font other = (Font) obj;\n  \
  \      return Objects.equals(name, other.name()) && size == other.size();\n    }\n\
  }\n```\n\n### 字体工厂\n\n```java\npublic final class FontFactory {\n    private final\
  \ Set<Font> fonts = new HashSet<>();\n\n    public Font of(String name, int size)\
  \ {\n        for (Font font : fonts) {\n            if (font.name().equals(name)\
  \ && font.size() == size) {\n                return font;\n            }\n     \
  \   }\n        Font font = new Font(name, size);\n        fonts.add(font);\n   \
  \     return font;\n    }\n}\n```\n\n### 字体工厂\n\n```java\npublic class Client {\n\
  \    public static void main(String[] args) {\n        FontFactory factory = new\
  \ FontFactory();\n        System.out.println(factory.of(\"Helvetica\", 12));\n \
  \       System.out.println(factory.of(\"Arial \", 10));\n\n        // 将是相同的对象\n\
  \        System.out.println(factory.of(\"Helvetica\", 12));\n    }\n}\n```\n\n####\
  \ 6.2.6.2 示例：[城市](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/structural/flyweight/city)\n\
  \n```java\npublic final class Person {\n    private final String firstName;\n  \
  \  private final String lastName;\n    private final String street;\n    private\
  \ final City city;\n\n    public Person(String firstName, String lastName, String\
  \ street, City city) {\n        this.firstName = firstName;\n        this.lastName\
  \ = lastName;\n        this.street = street;\n        this.city = city;\n    }\n\
  \n    public String firstName() {\n        return firstName;\n    }\n\n    public\
  \ String lastName() {\n        return lastName;\n    }\n\n    public String street()\
  \ {\n        return street;\n    }\n\n    public City city() {\n        return city;\n\
  \    }\n\n    @Override\n    public int hashCode() {\n        return Objects.hash(city,\
  \ firstName, lastName, street);\n    }\n\n    @Override\n    public boolean equals(Object\
  \ obj) {\n        if (this == obj) {\n            return true;\n        }\n    \
  \    if (obj == null) {\n            return false;\n        }\n        if (getClass()\
  \ != obj.getClass()) {\n            return false;\n        }\n        Person other\
  \ = (Person) obj;\n        return Objects.equals(this.city, other.city)\n      \
  \          && Objects.equals(this.firstName, other.firstName)\n                &&\
  \ Objects.equals(this.lastName, other.lastName)\n                && Objects.equals(this.street,\
  \ other.street);\n    }\n}\n```\n\n### 人\n\n\n\n\n\n```java\npublic final class\
  \ City {\n\n    private final String country;\n    private final String countryCode;\n\
  \    private final String name;\n\n    public City(String country, String countryCode,\
  \ String name) {\n        this.country = country;\n        this.countryCode = countryCode;\n\
  \        this.name = name;\n    }\n\n    public String country() {\n        return\
  \ this.country;\n    }\n\n    public String countryCode() {\n        return this.countryCode;\n\
  \    }\n\n    public String name() {\n        return this.name;\n    }\n\n    @Override\n\
