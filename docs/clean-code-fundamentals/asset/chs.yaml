  \ + 1);\n10 }\n```\n\n### Bad code\n\n- 其他看到这段注释代码的人没有勇气删除它。\n\n- 他们会认为代码在那里是有原因的，而且它太重要了不能删除。\n\
  \n### 3.2.9 注释规则\n\n## 3.3 类与对象\n\n根据 *Clean Code*（整洁代码）作者 Robert C. Martin 的观点，以下最佳实践可以帮助你写出易读且易于修改的类、函数和变量：\n\
  \n### 3.3.1 类\n\n- 应该使用名词或名词短语。\n\n- 类名应该明确。\n\n- 隐藏内部实现并最小化范围。\n\n- 使用依赖注入。\n\n\
  - 遵循迪米特法则（LoD）。\n    - 类只知道其直接依赖。\n\n- 尽可能倾向于不可变性。\n\n### 3.3.2 函数\n\n- 应该使用动词命名。\n\
  \n- 应该是短小的。\n\n- 函数的第一条规则是它们应该很小。\n    - 函数的第二条规则是它们应该尽可能小。\n\n- 只做一件事。\n\n    -\
  \ 它们应该被做好。\n    - 遵循单一职责原则（SRP）。\n\n- 每个函数应该有一个抽象层。\n\n- 不要重复自己（DRY）。\n\n- 无副作用。\n\
  \n- 相似的函数应该靠在一起。\n\n- 按照向下方向放置。\n\n- 每个概念使用一个单词。\n    - 避免为相同的概念使用不同的单词，例如使用 `find`,\
  \ `fetch`, `get`, `lookup`, `retrieve` 来表示相同的职责。\n\n- 参数应少于三个。\n    - 函数的理想参数数量是零。接下来是一个、两个。三个参数应尽量避免。三个以上需要特殊的理由——而且也不应该使用。\n\
  \    - 不要使用标记参数。将方法拆分为多个可以从客户端调用的方法。\n\n- `private` 函数可以更具描述性且名称更长。可以通过“童子军”进行改进。\n\
  \n- 函数的可见性越高，名称应该越短。\n\n![](img/Method-Name-Length.png)\n\n方法名称长度\n\n### 3.3.3 变量\n\
  \n- 尽可能靠近使用处声明变量。\n\n- 遵循规则：变量范围越大，名称越长。这样，全局变量拥有长描述性名称，而范围限制的内容（如循环索引变量）可以是单个字母。\n\
  \n![](img/Variable-Name-Length.png)\n\n变量名称长度\n\n\n\n\n你清楚算法是按步骤执行的，并且知道这些步骤在代码所在的位置。\n\
  \n### 对重构的优势：\n\n由于步骤之间应该是相互区分的，因此每个步骤都是将其代码外包到函数的良好候选者。生成的代码将是一系列函数调用。这将提高抽象层次并使代码更具表达力。\n\
  \n### 3.4.3 带有标题的段落\n\n![](img/images----Paragraphs-With-Headers.png)\n\n**对理解的优势：**\n\
  \n与段落一样。编写此代码的人通过为每个步骤添加信息，让你的任务更容易。\n\n**对重构的优势：**\n\n与段落一样。可以使用注释中的某些术语作为函数名的灵感。重构后，注释将变得多余并可以删除。\n\
  \n### 3.4.4 可疑的注释\n\n![](img/images----Suspicious-Comments.png)\n\n**对理解的优势：**\n\
  \n并不是所有注释都是优势，而且代码往往不是好的。\n\n**对重构的优势：**\n\n使用注释中的术语来重命名函数及其参数，并删除注释。\n\n### 3.4.5\
  \ 密集使用对象\n\n![](img/images----Intensive-Use-Of-An-Object.png)\n\n**对理解的优势：**\n\n\
  这段代码的作用是设置该对象。\n\n**对重构的优势：**\n\n该函数承担了多个职责，其中之一就是与该对象协作。将此职责重构到一个函数中，以减少主函数的职责数量（理想情况下减少到一个）。\n\
  \n## 3.5 避免工具类的实例化\n\nJava 为每个没有显式定义至少构造函数的类添加一个隐式的 `public` 构造函数。\n\n对于工具类（静态方法的集合），不需要实例化。定义一个\
  \ `private` 构造函数以防止实例化。该显式构造函数在类外是不可可见的。该类也应该是 `final` 的，除非该私有构造函数被内部类调用。\n\n```\n\
  1 public final class FileNameUtils {\n2     public static String extension() {\n\
  3     }\n4 \n5     public static String baseName() {\n6     }\n7 }\n```\n\n### 坏代码\n\
  \n```\n 1 public final class FileNameUtils {\n 2 \n3     // 不可实例化的工具类\n 4     private\
  \ FileNameUtils() {\n5     }\n 6 \n 7     public static String extension () {\n\
  8     }\n 9 \n10     public static String baseName() {\n11     }\n12 }\n```\n\n\
  #### 好代码\n\n在需要保证类不能从类内部调用的情况下，可以在构造函数中抛出一个 `AssertionError`.^(1)\n\n```\n1 public\
  \ final class FileNameUtils {\n2 \n3     // 不可实例化的工具类\n4     private FileNameUtils()\
  \ {\n5         throw new AssertionError();\n6     }\n7     ...\n8 }\n```\n\n####\
  \ 好代码\n\n查看这些类，你会发现也有私有构造函数：\n\n* `java.lang.Math`\n* `java.util.Arrays`\n* `java.util.Collections`\n\
  \n## 3.6 使用不可变对象\n\n除非有充分理由，否则始终优先使用不可变类而非可变类。\n\n* 不可变对象是线程安全的。\n* 使用不可变对象可以避免同步访问。\n\
  * 当对象一起使用时，不可变性始终起着作用。\n* 不可变对象可以安全地传递给不可信的代码。\n\n### 基本数据类型与 `final`\n\n声明为 `final`\
  \ 的变量的内容不能更改。对于基本数据类型变量，这意味着变量的值在初始化后不再改变。因此，`final` 变量只能赋值一次。\n\n```\n1 final int\
  \ max = 256;\n2 max = 0; // error：无法编译\n```\n\n### Final 变量\n\n### 引用变量与 `final`\n\
  \n对于引用变量，这意味着存储在引用变量中的地址不会改变。这个 `final` 引用变量指向初始化时分配给它的对象，永远不会引用另一个对象。然而，这并不意味着被引用的对象不受修改的影响。\n\
  \n```\n1 final Date deadline = new Date();\n2 deadline = new Date(100,0,1,0,0,0);\
  \     // error：无法编译\n3 deadline.set(new Date(100,0,1,0,0,0));  // fine：可以编译\n```\n\
  \n### Final 引用变量\n\n**遵循以下五个规则使类变为不可变**^(2):\n\n* 不要提供修改状态的方法，状态在创建后不应该是可更改的。\n\
  * 通过将类标记为 `final` 防止子类的。\n* 将所有字段标记为 `final`，这样它们在构造函数初始化后不可更改。\n* 将所有字段标记为 `private`\
  \ 并尽可能降低可见性。\n* 确保对任何可变组件的排他访问，必要时进行防御性拷贝。\n\n```\n 1 public final class ImmutableRGB\
  \ {\n 2     private final int red, green, blue;\n 3 \n 4     public ImmutableRGB(int\
  \ red, int green, int blue) {\n 5         this.red = red;\n 6         this.green\
  \ = green;\n 7         this.blue = blue;\n 8     }\n 9     public ImmutableRGB invert()\
  \ {\n10    }\n11 }\n```\n\n#### 好代码\n\n```\n 1 public final class ImmutableRGB {\n\
  \ 2     private final int red, green, blue;\n 3 \n 4     public ImmutableRGB(int\
  \ red, int green, int blue) {\n 5         this.red = red;\n 6         this.green\
  \ = green;\n 7         this.blue = blue;\n 8     }\n 9     public ImmutableRGB invert()\
  \ {\n10    }\n11 }\n```\n\n\n\n\n由于不可变对象的状态无法改变，我们已经预知了对它的预期。我们可以预期对象的状态在整个生命周期内都是有效的。\n\
  \n如果实现正确，该状态在代码的任何点都无法被修改，从而可能引入不一致性。因此，不可变对象应该在构造时对状态进行验证。这意味着没有人能创建一个无效状态的不可变对象的实例。所有这些验证都应该在不可变对象内部完成。因此，我们不仅可以预期的不可变对象在整个生命周期内具有相同的状态，而且预期的其状态是有效的。\n\
  \n### 3.7 优先使用 records 实现不可变性\n\n`Records` 是 Java 16 中引入的新类型类，并且它们是不可变的。对于只需要包含字段并访问这些字段的类，它们非常有用。这里是一个用于\
  \ `ImmutableRGB` 对象的简单 record。\n\n```java\n1 public record ImmutableRGB(int red,\
  \ int green, int blue) {\n2 }\n```\n\n#### Records\n\n必须使用 `record` 关键字而不是 `class`\
  \ 关键字。字段在类声明中定义。该声明创建了一个带有这些字段的 record。由于字段是 `final` 的，因此 record 不会生成 setter 方法。`equals`、`hashCode`\
  \ 和 `toString` 方法将自动生成。此外，还会为定义的字段创建访问方法。然而，如果你需要，也可以重写任何内容或添加额外的方法。\n\n```java\n\
  \ 1  public record ImmutableRGB(int red, int green, int blue) {\n 2 \n 3     ImmutableRGB(int\
  \ red) {\n 4         this(red, 0, 0);\n 5     }\n 6 \n 7     @Override\n 8     public\
  \ String toString() {\n 9         StringBuilder builder = new StringBuilder();\n\
  10         builder.append(\"ImmutableRGB [red=\")\n11                 .append(this.red)\n\
  12                 .append(\", green=\")\n13                 .append(this.green)\n\
  14                 .append(\", blue=\")\n15                 .append(this.blue)\n\
  16                 .append(\"]\");\n17         return builder.toString();\n18  \
  \   }\n19 }\n```\n\n#### 在 records 中重写\n\n`Records` 可以像普通类一样实例化。对于 `ImmutableRGB`\
  \ record，写法如下：\n\n```java\n1 ImmutableRGB rgb = new ImmutableRGB(0, 128, 240);\n\
  2 rgb.red();\n```\n\n#### 初始化 records\n\n`Records` 会生成访问方法，但它们不以 `get` 前缀开头。相反，访问方法名与构造函数中定义的字段名相同。`Records`\
  \ 可以包含注解和 JavaDoc。体内部还可以声明静态字段以及构造函数和实例方法。在 record 头部之外不允许有实例字段。\n\n`Records` 是\
  \ `final` 的且不能是 `abstract` 的，它们不能继承自其他类或 record，因此无法实现继承。但是支持对接口的实现。\n\n只有当构造函数定义的所有字段都是不可变的时，`Records`\
  \ 才是不可变的。如果你有像 `java.util.Date` 这样的对象，你需要像前面*使用不可变对象*项所示样，为此类字段提供拷贝或克隆方法。\n\n```java\n\
  \ 1 public record Stamp(Date date, String author) {\n 2 \n 3     public Stamp(Date\
  \ date, String author) {\n 4         this.date = new Date(date.getTime());\n 5 \
  \        this.author = author;\n 6     }\n 7 \n 8     @Override\n 9     public Date\
  \ date() {\n10         return new Date(this.date.getTime());\n11     }\n12 }\n```\n\
  \n#### 带有类似 Date 的可变字段的 records\n\n```java\n1 public record Stamp(LocalDate date,\
  \ String author) {\n2 }\n```\n\n#### 全是不可变字段的 records\n\n### 3.8 为敏感的可变类提供不可变装饰器\n\
  \n如果你使用了可修改的第三方库类并希望为它们提供不可变性，你可以用不可变装饰器类来装饰它们。这个装饰器可以在你的代码库中使用，并且对修改是安全的。\n\n```java\n\
  1 public interface Principal {\n2     String name();\n3     Set<String> roles();\n\
  4 }\n```\n\n#### Principal - 第三方代码\n\n```java\n 1  public final class DefaultPrincipal\
  \ implements Principal, Serializable {\n 2 \n 3     private static final long serialVersionUID\
  \ = 5439751315621189928L;\n 4 \n 5     private final String name;\n 6     private\
  \ final Set<String> roles;\n 7 \n 8     public DefaultPrincipal(String name, Set<String>\
  \ roles) {\n 9         this.name = name;\n10         this.roles = roles;\n11   \
  \  }\n 12 \n13     @Override\n14     public String name() {\n15         return this.name;\n\
  16     }\n 17 \n18     @Override\n19     public Set<String> roles() {\n20      \
  \   return this.roles;\n21     }\n22 }\n```\n\n#### 可变的 DefaultPrincipal - 第三方代码\n\
  \n```java\n 1  public final class ImmutablePrincipal implements Principal {\n 2\
  \ \n 3     private final Principal principal;\n 4 \n 5     public ImmutablePrincipal(Principal\
  \ principal) {\n 6         this.principal = principal;\n 7     }\n 8 \n 9     @Override\n\
  10     public String name() {\n11         return this.principal.name();\n12    \
  \ }\n 13 \n14     @Override\n15     public Set<String> roles() {\n16         return\
  \ Collections.unmodifiableSet(this.principal.roles());\n17     }\n18 }\n```\n\n\
  ### 3.9 避免常量接口\n\n**根据《Effective Java》(08-constant-interfaces)：**\n\n*   常量接口模式是对接口的糟糕使用。\n\
  *   类在内部使用某些常量是一个实现细节。\n*   实现常量接口会导致该实现细节泄露到类的导出 API 中。\n*   如果一个非 final 类实现了常量接口，则其所有子类都将受到接口中常量命名空间的污染。\n\
  \n```java\n1 interface JobStatus {\n2      int WAITING = 1;\n3      int RUNNING\
  \ = 2;\n4      int FINISHED = 3;\n5      int ERROR = 4;\n6 }\n```\n\n糟糕的代码\n\n```java\n\
  \ 1 enum JobStatus {\n 2 \n 3     WAITING(1), RUNNING(2), FINISHED(3), ERROR(4);\n\
  \ 4 \n 5     private final int id;\n 6 \n 7     private JobStatus(int id) {\n 8\
  \         this.id = id;\n 9     }\n 10 \n11     public int id() {\n12         return\
  \ this.id;\n13     }\n14 }\n```\n\n更好的代码\n\n### 3.10 避免全局常量类\n\n全局常量是有问题的，因为它们在代码中引入了大量不必要的依赖并增加了耦合。\n\
  \n此外，扩展代码的行为更加困难，如下例。假设你必须支持新的 Unix 换行符。\n\n```java\n1 public final class Constants\
  \ {\n2      private Constants(){}\n3 \n4      public static final String CRLF =\
  \ \"\\r\\n\"; // Windows\n5 }\n```\n\n糟糕的代码\n\n```java\n1 public class Records {\n\
  2      public void write(Writer out) {\n3           for (Record record: this.records)\
  \ {\n4                out.write(record.data());\n5                out.write(Constants.CRLF);\n\
  6           }\n7      }\n8 }\n```\n\n糟糕的代码\n\n```java\n1 public class Rows {\n2\
  \      public void print(PrintStream ps) {\n3           for (Row row: this.rows)\
  \ {\n4                ps.print(row.cells());\n5                ps.print(Constants.CRLF);\n\
  6           }\n7      }\n8 }\n```\n\n将常量放在一个单独的类中会更好，这允许行为发生改变。常量不会作为公共常量分布在代码中，从而增强内聚性并减少耦合。\n\
  \n\n\n\n\n```java\n 1 public class LineEnding {\n 2      private final String origin;\n\
  \ 3 \n 4      public LineEnding(String origin) {\n 5           this.origin = origin;\n\
  \ 6      }\n 7 \n 8      @Override\n 9      public String toString() {\n10     \
  \      return String.format(\"%s\\r\\n\", this.origin); // Windows\n11      }\n\
  12 }\n```\n\n良好的代码\n\n```java\n1 public class Records {\n2      public void write(Writer\
  \ out) {\n3           for (Record record: this.records) {\n4                out.write(new\
  \ LineEnding(record.data()));\n5           }\n6      }\n7 }\n```\n\n良好的代码\n\n```java\n\
  1 public class Rows {\n2      public void print(PrintStream ps) {\n3           for\
  \ (Row row: this.rows) {\n4                ps.print(row.cells());\n5           \
  \     ps.print(Constants.CRLF);\n6           }\n7      }\n8 }\n```\n\n良好的代码\n\n\
  ```java\n 1 public class LineEnding {\n 2 \n 3      private static final String\
  \ WINDOWS_LINE_ENDING = \"\\r\\n\";\n 4      private static final String UNIX_LINE_ENDING\
  \ = \"\\n\";\n 5 \n 6      private final String origin;\n 7 \n 8      public LineEnding(String\
  \ origin) {\n 9           this.origin = origin;\n10      }\n 11 \n12      @Override\n\
  \ 13      public String toString() {\n14           if (isUnix()) {\n15         \
  \       return String.format(\"%s%s\", this.origin, UNIX_LINE_ENDING);\n16     \
  \      }\n 17 \n18           return String.format(\"%s%s\", this.origin, WINDOWS_LINE_ENDING)\n\
  19      }\n 20 }\n```\n\n良好的代码\n\n## 3.11 优先使用组合而非继承\n\n**根据《Effective Java}(5)**：\n\
  \n- 继承并不是实现代码复用的最佳方法。它可能导致软件变得不恰当的脆弱。\n- 对于实现继承（即一个类扩展另一个类），当子类依赖于父类的实现细节才能实现其正常功能时，继承就违反了封装。\n\
  \n此外，重写方法应当维护父类契约中与里氏替换原则（Liskov Substitution Principle）相关的方面。\n\n在示例中 `ZippedDocument`\
  \ 使用了 `PlainDocument` 的 `length()` 方法，这真的如此吗？还是 `length()` 也应该被重写？你必须分析你继承的类以便以正确的方式实现它。\n\
  \n```java\n1 interface Document {\n2     int length();\n3     byte[] content();\n\
  4 }\n```\n\n糟糕的代码\n\n```java\n 1 public class PlainDocument implements Document\
  \ {\n 2     private final byte[] content;\n 3 \n 4     public PlainDocument(byte[]\
  \ content) {\n 5         this.content = content;\n 6     }\n 7 \n 8     @Override\n\
  \ 9     public int length() {\n10         return this.content.length;\n11     }\n\
  \ 12 \n13     @Override\n14     public byte[] content() {\n15         return this.content;\n\
  16     }\n17 }\n```\n\n糟糕的代码\n\n```java\n 1 public class ZippedDocument extends\
  \ PlainDocument {\n 2 \n 3     public ZippedDocument(byte[] content) {\n 4     \
  \    super(content);\n 5     }\n 6 \n 7     // 使用了 PlainDocument 的 length()\n 8\
  \ \n 9     @Override\n10     public byte[] content() {\n11         return zip(super.content());\n\
  12     }\n 13 \n14     private byte[] zip(byte[] content) {\n15         return /*\
  \ Zip the raw content */\n16     }\n 17 }\n```\n\n糟糕的代码\n\n与其扩展 `PlainDocument`\
  \ 类，你可以使用组合代替继承来解决继承的某些缺点。\n\n```java\n 1 public class ForwardingDocument implements\
  \ Document {\n 2 \n 3     private final Document document;\n 4 \n 5     public ForwardingDocument(Document\
  \ document) {\n 6         this.document = document;\n 7     }\n 8 \n 9     @Override\n\
  10     public int length() {\n11         return this.document.length();\n12    \
  \ }\n 13 \n14     @Override\n15     public byte[] content() {\n16         return\
  \ this.document.content();\n17     }\n 18 }\n```\n\n良好的代码\n\n```java\n 1 public\
  \ final class ZippedDocument extends ForwardingDocument {\n 2 \n 3     public ZippedDocument(Document\
  \ document) {\n 4         super(document);\n 5     }\n 6 \n 7     @Override\n 8\
  \     public int length() {\n 9         return this.content().length;\n10     }\n\
  \ 11 \n12     @Override\n13     public byte[] content() {\n14         return zip(super.content());\n\
  15     }\n 16 \n17     private byte[] zip(byte[] content) {\n18         return content;\
  \  /* Zip the raw content */\n19     }\n 20 }\n```\n\n良好的代码\n\n避免构建大型的继承层级，优先使用**拥有**（has-a）关系而非**是**（is-a）关系。通过组合来实现多态和代码复用。\n\
  \n**继承的缺点：**\n\n- 构建良好的继承层级很困难。\n- 会导致代码难以理解。\n- 缺乏活性。\n- 通常只能继承一个父类。\n\n**组合的优点：**\n\
  \n- 比大型继承层级更易理解。\n- 可以在运行时替换组件。\n- 组件可以进行独立测试。\n\n## 3.12 使用 @Override 注解\n\n如果打算重写父类中的方法，请使用\
  \ `@Override` 注解。\n\n**优点：**\n\n- 如果在重写时出现任何错误（如方法名写错），编译器会报错。\n- 它改进了代码的可读性。\n\
  - 如果你更改了父类方法的签名，所有重写该方法的都会产生编译错误。\n\n```java\n1 public class User {\n2     private\
  \ final String name;\n3 \n4     public User(String name) {\n5         this.name\
  \ = name;\n6     }\n 7\n8     public int hashcode() // 这里有错误\n9     }\n10 \n11 \
  \    public boolean equals(Object obj) {\n12     }\n13 }\n```\n\n糟糕的代码\n\n```java\n\
  1 public class User {\n2     private final String name;\n3 \n4     public User(String\
  \ name) {\n5         this.name = name;\n6     }\n 7\n8     @Override\n9     public\
  \ int hashCode() {\n10     }\n 11 \n12     @Override\n13     public boolean equals(Object\
  \ obj) {\n14     }\n15 }\n```\n\n良好的代码\n\n## 3.13 使用 @FunctionalInterface 注解\n\n\
  使用 `@FunctionalInterface` 并强制编译器在添加额外的非重写抽象方法时报错，这会破坏 Lambda 实现的使用。\n\n- 一种信息性注解类型，用于指示接口设计为函数接口。\n\
  - 概念上，函数接口只有一个抽象方法，也称为单抽象方法（SAM）。\n- 函数接口的实例可以通过 Lambda 表达式、方法引用或构造函数引用创建。\n- 应用于防止意外扩展导致不再满足函数接口的要求。\n\
  \n**Java 充满了这种类型的接口，例如：**\n\n- `java.lang.Runnable`\n- `java.util.Comparator`\n\
  - `java.util.concurrent.Callable`\n- `java.io.FileFilter`\n\n```java\n 1 @FunctionalInterface\n\
  \ 2 public interface Runnable {\n 3 \n 4      * 当实现 Runnable 接口的对象被用于\n 5      *\
  \ 创建线程时，启动线程会导致该对象的\n 6      * <code>run 方法在那个单独执行的\n 7      * 线程中被调用。\n 8     \
  \ * <p>\n 9      * <code>run 方法的通用契约是它可以执行任何\n10      * 操作。\n11      *\n12     \
  \ * @see     java.lang.Thread#run()\n13      */\n14     public abstract void run();\n\
  \ 15 }\n```\n\n良好的代码 - Java 中的 `Runnable` 接口\n\n## 3.14 优先返回空对象而非 `null`\n\n\n\n\
  \n\n对于使用数组或集合返回值集合的方法，返回空数组或空集合比返回 `null` 是更好的替代方案，因为大多数调用者处理空对象的能力比处理 `null` 值更强。如果客户端缺少\
  \ `null` 检查，将在运行时抛出 `NullPointerException`。\n\n*   通过使用**空对象（Null-Objects）**，你可以避免方法返回\
  \ `null`。\n*   减少 `NullPointerException` 的数量。\n*   `Null-Objects` 是不可变的。\n\n###\
  \ Collection API 已经有了实现：\n\n*   `Collections.EMPTY_LIST`, `EMPTY_MAP`, `EMPTY_SET`\n\
  *   `Collections.emptyList()`, `emptyMap()`, `emptySet()`\n\n`Collections.EMPTY_LIST`、`EMPTY_MAP`、`EMPTY_SET`\
  \ 字段返回原始类型（raw types），而较新的 `Collections.emptyList()`、`emptyMap()`、`emptySet()` 方法返回泛型，因此应该使用它们。\n\
  \n当返回数组而不是集合时，避免尝试访问长度为零的数组的元素。这可以防止抛出 `ArrayOutOfBoundsException`。\n\n```\n1 public\
  \ List<Book> findBooksByAuthor(String author) {\n2     if (author != null || author.isEmpty())\
  \ {\n3         return null;\n4     }\n5     ...\n6 }\n```\n坏代码\n\n```\n1 public\
  \ List<Book> findBooksByAuthor(String author) {\n2     if (author != null || author.isEmpty())\
  \ {\n3         return Collections.emptyList();\n4     }\n5     ...\n6 }\n```\n好代码\n\
  \n在下例示例中，将使用自定义的空对象 `NullUser`，以避免在这种情况下强制要求客户端 `AdministrationController` 进行 NPE\
  \ 检查。\n\n```\n1 public class AdministrationController {\n2     private Session session;\n\
  3 \n4     public boolean hasRights() {\n5         User user = session.user();\n\
  6 \n7         return user != null && user.isSuperUser(); // 需要 NPE 检查\n8     }\n\
  9 }\n```\n坏代码\n\n```\n 1 public class User {\n 2     private final int id;\n 3 \
  \    private final boolean isSuperUser;\n 4 \n 5     public User(int id, boolean\
  \ isSuperUser) {\n 6         this.id = id;\n 7         this.isSuperUser = isSuperUser;\n\
  \ 8     }\n 9 \n10     public int id() {\n11         return this.id;\n12     }\n\
  13 \n14     public boolean isSuperUser () {\n15         return this.isSuperUser;\n\
  16     }\n17 }\n```\n坏代码\n\n```\n1 public class AdministrationController {\n2  \
  \   private Session session;\n3 \n4     public boolean hasRights() {\n5        \
  \ return session.user().isSuperUser(); // 不需要 NPE 检查\n6     }\n7 }\n```\n好代码\n\n\
  ```\n1 public class NullUser extends User {\n2     @Override\n3     public boolean\
  \ isSuperUser () {\n4         return false;\n5     }\n6 }\n```\n好代码\n\n```\n 1 public\
  \ class Session {\n 2     private User user;\n 3 \n 4     public Session() {\n 5\
  \         this.user = new NullUser(); // 使用 NullUser 初始化，而不是 null\n 6     }\n 7\
  \ \n 8     public User user() {\n 9         return user;\n10     }\n11 }\n```\n\
  好代码\n\n### 3.15 避免将 `null` 作为方法参数\n\n永远不要允许 `null` 作为方法的参数。将 `null` 参数作为有效参数传递给方法是一种坏实践。\n\
  \n假设你实现了一个方法，在传递 `null` 时检索所有文件的列表，并根据文件扩展名检索该扩展名的文件列表。\n\n### 这看起来像是这两个方法的方便的替代方案：\n\
  \n*   `public List<File> findAllFiles() {}`\n*   `public List<File> findByExtension(String\
  \ extension) {}`\n\n将这些逻辑合并到一个方法中并通过 `null` 参数来控制行为是糟糕的方法，因为每个方法应该只做一件事。更优的方法是将这个方法拆分为两个具有有意义名称的方法。\n\
  \n更灵活的解决方案是使用过滤器（如下例所示），或者更好地使用 Java 的 `Predicate`。\n\n```\n1 public List<File>\
  \ findFiles(String extension) {\n2     if (extension == null) {\n3          // 查找所有文件\n\
  4     } else {\n5          // 根据文件扩展名查找文件\n6     }\n7 }\n```\n坏代码\n\n```\n1 interface\
  \ FileFilter {\n2      boolean accept(File file);\n3 }\n```\n好代码\n\n```\n1 public\
  \ class AllFileFilter implements FileFilter {\n2     @Override\n3     public boolean\
  \ accept(File file) {\n4         return true;\n5     }\n6 }\n```\n好代码\n\n```\n 1\
  \ public List<File> findFiles(FileFilter filter) {\n 2     List<File> foundFiles\
  \ = new ArrayList<>();\n 3 \n 4     for (File file: files) {\n 5         if (filter.accept(file))\
  \ { // 通过过滤器查找文件\n 6             foundFiles.add(file);\n 7         }\n 8     }\n\
  \ 9 \n10     return foundFiles;\n11 }\n```\n好代码\n\n```\n1 public List<File> files(Predicate<File>\
  \ filter) {\n2     return files.stream()\n3             .filter(filter)\n4     \
  \        .toList();\n5 }\n```\n更具通用性的匠心代码\n\n### 3.16 优先使用增强循环而非 for 循环\n\n对于只使用索引变量访问列表或数组元素的\
  \ `for` 循环，请将其替换为 `foreach` 语法。这样不容易出错。\n\n```\n1 List<String> cars = List.of(\"\
  BMW\", \"VW\", \"Porsche\");\n2 \n3 for (Iterator<String> i = cars.iterator(); i.hasNext();)\
  \ {\n4     System.out.println(i.next());\n5 }\n```\n坏代码\n\n```\n1 for (int i = 0;\
  \ i < cars.size(); i++) {\n2     System.out.println(cars.get(i));\n3 }\n```\n坏代码\n\
  \n```\n1 for (String car : cars) {\n2     System.out.println(car);\n3 }\n```\n好代码\n\
  \n```\n1 cars.forEach(System.out::println); // Lambdas\n```\n好代码\n\n```\n1 cars.stream().forEach(System.out::println);\
  \ // Streams\n```\n好代码\n\n### 3.17 针对接口编程\n\n声明应该使用接口而不是实现类。这样如果需要，你就可以轻松更改该实现。\n\
  \n```\n1 // 坏 – 使用类作为类型\nArrayList<String> bikes = new ArrayList<>();\n```\n坏代码\n\
  \n```\n1 // 好 – 使用接口作为类型\nList<String> bikes = new ArrayList<>();\n```\n好代码\n\n\
  ```\n1 // 坏 – 使用类作为类型\n2 public void buy(ArrayList<String> bikes) {\n3 ...\n4 }\n\
  ```\n坏代码\n\n```\n1 // 好 – 使用接口作为类型\n2 public void buy(Collection<String> bikes)\
  \ {\n3 ...\n4 }\n```\n好代码\n\n### 3.18 使用现有的异常\n\nJava API 提供了许多异常类，因此没有必要为每种情况单独声明异常类。\n\
  \n| Exception | 描述 |\n| --- | --- |\n| `IllegalArgumentException` | 非空参数值不合适 |\n\
  | | |\n| `IllegalStateException` | 对象状态不适用于方法调用 |\n| | |\n| `NullPointerException`\
  \ | 在禁止的情况下参数值为 null |\n| | |\n| `IndexOutOfBoundsException` | 索引参数值超出范围 |\n| |\
  \ |\n| `ConcurrentModificationException` | 在禁止的情况下检测到并发修改 |\n| | |\n| `UnsupportedOperationException`\
  \ | 对象不支持该方法 |\n\n### 3.19 验证方法参数\n\n验证方法参数以确保它们符合方法的设计范围。这种做法确保了对参数的操作产生有效的结果。\n\
  \n跨信任边界的方法必须对其参数进行验证。这种预防措施适用于类的所有公共方法。其他方法（包括私有方法）如果这些参数是从公共方法传递的且未经过验证，则应对其参数进行验证。\n\
  \n```\n1 public void concat(String source, List<String> concats, int startIndex)\
  \ {\n2     if (source == null || concats == null) {\n3         throw new IllegalArgumentException(\"\
  source cannot be null\");\n4     }\n5     if (startIndex >= concats.size() || startIndex\
  \ < 0) {\n6         throw new IllegalArgumentException(\"startIndex exceeds bounds\
  \ of concats\");\n7     }\n8     ...\n9 }\n```\n好代码\n\n*   `Objects.requireNonNull(obj)`\n\
  *   `Objects.requireNonNull(obj, message)`\n*   `Objects.requireNonNull(obj, messageSupplier)`\n\
  *   `Objects.requireNonNullElse(obj, defaultObj)`\n*   `Objects.requireNonNullElseGet(obj,\
  \ supplier)`\n*   `Objects.checkIndex(index, length)`\n\n\n\n\n\n* `Objects.checkFromIndexSize(fromIndex,\
  \ size, length)`\n* `Objects.checkFromToIndex(fromIndex, toIndex, length)`\n\n##\
  \ 3.20 防止 `String` 比较时出现 `NullPointerException`\n\n将字符串字面量放在 `equals()` 或 `equalsIgnoreCase()`\
  \ 方法的左侧。这可以防止 NPE 的产生，因为字符串字面量不为 `null`。\n\n```java\n1 private static final String\
  \ COMPARE_VALUE = \"Bad programmer\";\n2 \n3 public boolean compareIt(String input)\
  \ {\n4     return input.equals(COMPARE_VALUE);\n5 }\n```\n\n### 坏代码\n\n```\n1 private\
  \ static final String COMPARE_VALUE = \"Rockstar programmer\";\n2 \n3 // equals\
  \ 对 NPE 有检查\n4 public boolean compareIt(String input) {\n5     return COMPARE_VALUE.equals(input);\n\
  6 }\n```\n\n### 好的代码\n\n```\n1 String firstName = null;\n2 \n3 boolean e1 = firstName.equals(\"\
  Bad programmer\");                         // 抛出 NPE\n4 boolean e2 = firstName !=\
  \ null && firstName.equals(\"Better programmer\"); // 可以移除 NPE 检查\n5 boolean e3\
  \ = \"Good programmer\".equals(firstName);                        // 无 NPE\n```\n\
  \n### 逐步重构\n\n## 3.21 安全地将 `long` 强制转换为 `int`\n\n使用 `Math` 类中定义的溢出安全方法，这些方法是在 Java\
  \ 8 中引入的。它们要么返回数学上的正确值，要么在结果溢出时抛出 `ArithmeticException`。否则，超出其基本整数数据类型提供范围的数学运算将产生错误的结果。\n\
  \n**根据 [Java 语言规范 (JLS)](https://docs.oracle.com/javase/specs/jls/se15/html/jls-4.html#jls-4.2.2)：**\n\
  \n* 整数运算符不会指示溢出或下溢。\n* 整数运算符出于以下原因可能会异常：\n    * 如果需要对空引用拆箱转换，任何整数运算符都可能抛出 `NullPointerException`。\n\
  \    * 如果右侧操作数为零，整数除法运算符 `/` 和整数取模运算符 `%` 可能会抛出 `ArithmeticException`。\n    * 如果需要装箱转换且没有足够的内存执行转换，自增和自减运算符\
  \ `++` 和 `--` 可能会抛出 `OutOfMemoryError`。\n\n```java\n1 long foo = 10L;\n2 int bar\
  \ = (int) foo;\n```\n\n### 坏代码\n\n```\n1 long foo = 10L;\n2 int bar = Math.toIntExact(foo);\n\
  ```\n\n### 好的代码\n\n当你使用 `Math.toIntExact` 时，该方法返回 `long` 参数的值，如果该值溢出 `int` 范围则抛出\
  \ `ArithmeticException`。\n\n```java\n1     public static int toIntExact(long value)\
  \ {\n2         if ((int)value != value) {\n3             throw new ArithmeticException(\"\
  integer overflow\");\n4         }\n5         return (int)value;\n6     }\n```\n\n\
  ### Java 15 中的 Math.toIntExact\n\n`Math` 类中还有其他方法可以防止溢出：\n\n* `Math.incrementExact(long)`\n\
  * `Math.subtractExact(long, long)`\n* `Math.decrementExact(long)`\n* `Math.negateExact(long)`\n\
  * `Math.subtractExact(int, int)`\n\n## 3.22 将整数转换为浮点数以进行浮点运算\n\n整数与浮点值之间不正确的转换会导致意外的结果。这些意外结果可能包括溢出或其他异常行为。当对整数进行算术运算时，结果将始终是整数。它会丢弃可能的小数部分信息。\n\
  \n通过将结果赋值给 `long`、`double` 或 `float` 并使用自动类型转换，防止在将基本整数转换为浮点数时丢失精度。如果你是从 `int` 或\
  \ `long` 开始的，结果可能不是你预期的。\n\n```java\n 1 short a = 111;\n2 int b = 1978;\n3 \n4 float\
  \ d = a / 8;   // 13.0\n5 double e = b / 20; // 98.0\n6 \n7 float f = 7 / 8;   \
  \                 // 0.0\n8 long g = 7 / 8;                     // 0\n9 float h\
  \ = 7f / 8f;                  // 0.875\n```\n\n### 坏代码\n\n```\n 1 short a = 111;\n\
  2 int b = 1978;\n3 \n4 float d = a / 8;   // 13.0\n5 double e = b / 20; // 98.0\n\
  6 \n7 float f = 7 / 8;                    // 0.0\n8 long g = 7 / 8;            \
  \         // 0\n9 float h = 7f / 8f;                  // 0.875\n```\n\n### 好的代码\n\
  \n```java\n 1 short a = 111;\n2 int b = 1978;\n3 \n4 float d = (float)a / 8;   \
  \        // 13.0\n5 double e = (double)b / 20;         // 98.0\n6 \n7 float f =\
  \ (float)7 / 8;           // 0.875\n8 long g = (long)7 / 8;             // 0\n```\n\
  \n## 3.23 使用泛型代替原始类型\n\n### 3.23 使用泛型代替原始类型\n\n使用泛型代替原始类型可以提供更好的类型安全性和清晰度。\n\n**使用泛型的优势：**\n\
  \n* 强类型检查在编译编译时确保了类型安全。\n* 避免运行时出现 `ClassCastException`。\n* 自文档化且更易读。\n* 允许编写通用的泛型算法。\n\
  \n### 坏代码\n\n```java\n1 List cars = new ArrayList();\n```\n\n### 好的代码\n\n```java\n\
  1 List<String> cars = new ArrayList<>();\n```\n\n\n\n\n\n```java\npublic enum JobPosition\
  \ {\n    JUNIOR(2, 1.2f) {\n        @Override\n        public float pay(float hours)\
  \ {\n            return (factor() * hours) * 0.8f;\n        }\n    },\n    SENIOR(3,\
  \ 1.5f) {\n        @Override\n        public float pay(float hours) {\n        \
  \    return (factor() * hours) * 0.95f;\n        }\n    },\n    PRINCIPAL(4, 1.7f)\
  \ {\n        @Override\n        public float pay(float hours) {\n            return\
  \ factor() * hours;\n        }\n    };\n\n    private final int level;\n    private\
  \ final float factor;\n\n    JobPosition(int level, float factor) {\n        this.level\
  \ = level;\n        this.factor = factor;\n    }\n\n    public int level() {\n \
  \       return this.level;\n    }\n\n    public float factor() {\n        return\
  \ this.factor;\n    }\n\n    public abstract float pay(float hours);\n\n    public\
  \ static JobPosition valueOf(int level) {\n        return Stream.of(JobPosition.values())\n\
  \                .filter(p -> p.level() == level)\n                .findFirst()\n\
  \                .orElseThrow(() ->\n                    new IllegalArgumentException(String.format(\"\
  Unknown job position: %d\", level)));\n    }\n}\n```\n\n枚举非常灵活\n\n## 3.25 注意 `equals`\
  \ 和 `hashCode` 之间的约定\n\n### Java 中基于哈希的容器：\n\n- 基于哈希的容器的组织方式是创建不同的桶（buckets），对象按顺序存储在其中。\n\
  - 桶可以被看作对象引用的数组或列表。\n- 对不同桶的访问通过整数索引完成，因此具有高性能性；它是在常数时间内完成的，即无论容器中包含多少元素，访问桶的时间总是相同的。\n\
  - 然而，在桶内部，对元素的访问是缓慢的，因为它们是顺序的。这里的依赖关系是线性的，即桶越大，耗时越长。因此，一个包含许多小桶的的哈希容器比一个包含少数大桶的容器更划算。\n\
  - `hashCode` 为被调用的对象计算一个哈希值。\n- 哈希值是一个整数值，用于在基于哈希的容器中存储对象或在其中查找对象。\n- Java 中基于哈希的容器有\
  \ `java.util.Hashtable`、`java.util.HashMap`、`java.util.HashSet` 及其子类。\n\n基于哈希容器的结构：\n\
  \n![](img/images----Buckets.png)\n\n基于哈希容器的结构\n\n### `equals` / `hashCode` 的实现：\n\
  \n- 如果你对 `equals` 进行了重写，则必须重写 `hashCode`。\n- 如果两个对象根据 `equals` 方法相等，那么对这两个对象中的每一个调用\
  \ `hashCode` 方法必须产生相同的结果。\n- 不需要要求如果两个对象根据 `equals` 方法不相等，对 `hashCode` 方法的调用必须为每个对象返回唯一的整数结果。然而，程序员应该意识到，为不相等的对象生成不同的整数结果可以提高哈希表的性能。\n\
  - 如果在执行期间多次调用同一个对象，除非该对象上用于 `equals` 比较的信息发生了变化，否则 `hashCode` 方法必须一致地返回相同的整数。\n\n\
  ### 性能：\n\n- 对哈希容器中元素的访问是通过索引（=哈希值）快速识别桶，然后在希望较小的桶内进行相对缓慢的顺序搜索完成的。因此，基于哈希的容器的优势在于可以通过索引快速访问桶。如果现在计算哈希值花费了很长时间，那么通过哈希值进行快速访问带来的性能提升就会被抵消。因此，哈希值的计算应该尽可能高效。\n\
  - 因此，哈希值的计算不仅应该快，而且应该导致容器拥有许多小桶。\n- 目标是实现一种尽可能快的实现，并使所计算的哈希值在 -2147483648 到 2147483647\
  \ 的可能整数值范围内实现均匀分布。\n\n```java\npublic final class Name {\n    private final String\
  \ first;\n\n    public Name(String first) {\n        this.first = first;\n    }\n\
  \n    @Override\n    public boolean equals(Object obj) {\n        if (this == obj)\
  \ {\n            return true;\n        }\n        if (obj == null) {\n         \
  \   return false;\n        }\n        if (getClass() != obj.getClass()) {\n    \
  \        return false;\n        }\n        Name other = (Name) obj;\n    }\n}\n\
  ```\n\n\n\n\n对于所有如 `if`、`for` 和 `while` 等语句请使用大括号。即使语句体只包含一行，也应该这样做。你可以获得更好的可读性，并防止误导性的执行流。\n\
  \n```\n1 List<String> roles = new ArrayList<>();\n2 \n3 if (isUser())\n4     roles.add(\"\
  USER\");\n5 else if(isAdmin())\n6     roles.add(\"ADMIN\");\n```\n\n### 坏代码\n\n\
  上面的示例按照预期工作，但如果开发者如下所示扩展代码且没有在体周围添加大括号怎么办？在这种情况下，语句 `roles.add(\"ADMIN\")` 将始终被执行。\n\
  \n```\n1 List<String> roles = new ArrayList<>();\n2 \n3 if (isUser())\n4     roles.add(\"\
  USER\");\n5 else if(isAdmin())\n6     log.warn(\"Logged as admin!\");\n7     roles.add(\"\
  ADMIN\"); // 将始终被执行\n```\n\n### 坏代码，运行不符合预期\n\n```\n1 List<String> roles = new ArrayList<>();\n\
  2 \n3 if (isUser()) {\n4     roles.add(\"USER\");\n5 } else if(isAdmin()) {\n6 \
  \    log.warn(\"Logged as admin!\");\n7     roles.add(\"ADMIN\"); // 将始终被执行\n8 }\n\
  ```\n\n### 好的代码\n\n## 3.28 在循环中预计算长度\n\n```\n1 // expensiveComputation() 将被调用 n\
  \ 次\n2 for (int i = 0; i < expensiveComputation(); i++) {\n3     doSomething(i);\n\
  4 }\n```\n\n### 坏代码\n\n```\n1 // expensiveComputation() 将被调用一次\n2 for (int i = 0,\
  \ n = expensiveComputation(); i < n; i++) {\n3     doSomething(i);\n4 }\n```\n\n\
  ### 好的代码\n\n## 3.29 避免 `String` 的低速实例化\n\n```\n1 //慢速实例化\n2 String slow = new String(\"\
  Yet another string object\");\n```\n\n### 坏代码\n\n```\n1 //快速实例化\n2 String fast =\
  \ \"Yet another string object\";\n```\n\n### 好的代码\n\n## 3.30 使用 `StringBuilder`\
  \ 进行拼接\n\n字符串是不可变的，因此拼接并不是简单地将新的 `String` 追加到现有字符串的末尾。在每次循环迭代中，`String` 被转换为中间对象类型，追加第二个\
  \ `String`，然后将中间对象转换回新的 `String`。随着迭代次数的增加，这会导致纯性能上的下降。\n\n通过显式使用 `StringBuilder`\
  \ 可以获得更好的性能，这应该应该是你几乎所有代码中的默认做法。尽量避免使用 `+` 运算符。\n\n```\n1 public String concat()\
  \ {\n2     String result = \"\";\n3 \n4     for (int i = 0; i < numItems(); i++)\
  \ {\n5         result += lineForItem(i); // String 拼接\n6     }\n7 \n8     return\
  \ result;\n9 }\n```\n\n### 坏代码\n\n```\n1 public String concat() {\n2     StringBuilder\
  \ sb = new StringBuilder(numItems() * LINE_WIDTH);\n3 \n4     for (int i = 0, n\
  \ = numItems(); i < n; i++) {\n5         sb.append(lineForItem(i));\n6     }\n7\
  \ \n8     return sb.toString();\n9 }\n```\n\n### 好的代码\n\n## 3.31 减少集合容器中的查找\n\n\
  如果可能，减少对集合内元素的查找次数。在例例中，搜索了一个元素，如果存在则将使用该值。冗余操作可以减少到一次。\n\n```\n 1 Map<String, User>\
  \ users = new HashMap<>();\n 2 ...\n3 \n4 User user;\n5 \n6 if (this.users.get(key)\
  \ != null) { // 调用一次\n7     user = this.users.get(key);    // 调用两次\n8     String\
  \ password = user.password();\n9     ...\n10 }\n```\n\n### 坏代码\n\n```\n1 Map<String,\
  \ User> users = new HashMap<>();\n2 ...\n3 \n4 User user;\n5 \n6 if ((user = this.users.get(key))\
  \ != null) { // 仅调用一次\n7     String password = user.password();\n8     ...\n9 }\n\
  ```\n\n### 好的代码\n\n## 3.32 使用 `valueOf` 包装对象\n\n如果不需要新实例，通常应优先使用此方法而不是构造函数，因为该方法通过缓存频繁请求的值，可能会显著提高空间和时间性能。\n\
  \n在 `Integer` 和 `Long` 的情况下，此方法将始终缓存 -128 到 127（包含）之间的值，并可能缓存此范围之外的值。缓存的大小可以通过 `-XX:AutoBoxCacheMax`\
  \ 选项控制。\n\n```\n1 new Boolean(true);\n2 new Long(1);\n3 new Integer(2);\n```\n\n\
  ### 坏代码\n\n```\n1 Boolean.valueOf(true);\n2 Long.valueOf(1);\n3 Integer.valueOf(2);\n\
  ```\n\n### 好的代码\n\n```\n1 // 内存中有 4 个对象\n2 Boolean b1 = new Boolean(true);\n3 Boolean\
  \ b2 = new Boolean(false);\n4 Boolean b3 = new Boolean(false);\n5 Boolean b4 = new\
  \ Boolean(false);\n```\n\n### 坏代码\n\n```\n1 // 内存中有 2 个对象\n2 Boolean b1 = Boolean.TRUE;\n\
  3 Boolean b2 = Boolean.FALSE;\n```\n\n### 好的代码\n\n## 3.33 使用 `entrySet` 遍历\n\n当只需要键和值时，使用\
  \ `entrySet()` 更好。如果只需要键，则 `keySet()` 更好。\n\n```\n1 Map<String, User> users = new\
  \ HashMap<>();\n2 ...\n3 \n4 User user;\n5 \n6 if (this.users.get(key) != null)\
  \ { // 调用一次\n7     user = this.users.get(key);    // 调用两次\n8     String password\
  \ = user.password();\n9     ...\n10 }\n```\n\n### 坏代码\n\n```\n1 Map<String, User>\
  \ users = new HashMap<>();\n2 ...\n3 \n4 User user;\n5 \n6 if ((user = this.users.get(key))\
  \ != null) { // 仅调用一次\n7     String password = user.password();\n8     ...\n9 }\n\
  ```\n\n### 好的代码\n\n## 3.34 为 `String` 使用 `isEmpty()`\n\n```\n1 if (text != null\
  \ && text.equals(\"\")) {\n     // 操作\n}\n```\n\n### 坏代码\n\n```\n1 if (text != null\
  \ && !text.isEmpty()) {\n     // 操作\n}\n```\n\n### 好的代码\n\n## 3.35 减少类型转换次数\n\n\
  ```\n1 Integer io = new Integer(0);\n2 Object obj = (Object) io;\n3 \n4 for (int\
  \ i = 0; i < 100000; i++) {\n5     if (obj instanceof Integer) {\n6         byte\
  \ x = ((Integer) obj).byteValue();\n7         double d = ((Integer) obj).doubleValue();\n\
  8         float f = ((Integer) obj).floatValue();\n9     }\n10 }\n```\n\n### 坏代码\n\
  \n```\n1 Integer io = new Integer(0);\n2 Object obj = (Object) io;\n3 \n4 for (int\
  \ i = 0; i < 100000; i++) {\n5     if (obj instanceof Integer) {\n6         Integer\
  \ icast = (Integer) obj;\n7         byte x = icast.byteValue();\n8         double\
  \ d = icast.doubleValue();\n9         float f = icast.floatValue();\n10     }\n\
  11 }\n```\n\n### 好的代码\n\n## 3.36 在循环中避免 `get()`\n\n```\n1 Map<String, User> users\
  \ = new HashMap<>();\n2 ...\n3 \n4 for (Map.Entry<String, User> entry : users.entrySet())\
  \ {\n5     String key = entry.getKey();\n6     User user = entry.getValue();\n7\
  \     String password = user.password();\n8     ...\n9 }\n```\n\n# 4 软件质量保证\n\n\
  ## 4.1 测试金字塔\n\nMike Cohn 在他的书籍《成功的 Agile》中介绍了测试金字塔。它是可视化不同级别测试的一种极佳方法。它告诉你在每一层应该做多少测试。原始测试金字塔由三层组成：*单元测试*、*服务测试*和*界面测试*。\n\
  \n![](img/Test-Pyramid.png)\n\n### 测试金字塔\n\n根据这个金字塔，编写许多快速的单元测试。编写一些粗粒度的集成测试，以及极少数从顶到部的高级测试。小心不要变成[测试金字塔与冰淇淋](https://alisterbscott.com/kb/testing-pyramids/)，那是完全在浪费时间和维护精力。\n\
  \n**单元测试**\n\n单元测试关注单个类，而且是最容易、最便宜且完成最快的。单元测试在早期编写，以便我们获得即时反馈并确切知道错误在哪里。\n\n**集成\
  \ / 组件 / 验收测试**\n\n集成测试关注不同类和模块的正确集成。与单元测试相比，它们可能需要专业的工具来准备测试环境或进行交互。\n\n**UI 测试**\n\
  \nUI 测试关注从客户端的角度验证系统。整个应用程序将在真实场景中测试，例如与数据库、网络、硬件和其他应用程序的通信。\n\n## 4.2 测试分类\n\n\n\
  \n\n测试可以根据其信息状态进行分类。主要有三种测试策略：`White-Box-Test`白盒测试、`Black-Box-Test`黑盒测试和和`Grey-Box-Test`灰盒测试。WBT\
  \ 由开发团队在编码完成后通过测试代码的内部行为进行。BBT 由专业测试工程师通过观察应用程序进行。他们无法访问代码的逻辑和执行流。GBT 是 WBT 和 BBT\
  \ 的结合，在不了解实现的情况下进行。\n\n![](img/images----Test-Classification.png)\n\n## WBT、GBT\
  \ 和 BBT 的区别\n\n| | WBT | BBT |\n| --- | --- | --- |\n| **优点** | 对子组件和内部功能的测试 | 对整体系统更好的验证\
  \ |\n| | 组织工作量较少 | 使用适当的规范对语义属性进行测试 |\n| | 通过良好的工具支持实现自动化 | 系统创建的测试序列到平台无关实现的可移植性\
  \ |\n| | | |\n| **缺点** | 未验证是否符合规范 | 组织工作量较大 |\n| | 可能在“错误周围”进行测试 | 实现期间添加的额外功能仅偶然被测试\
  \ |\n| | | 规范不足的测试序列不可用 |\n| | | |\n\n## 4.3 测试驱动开发 (TDD)\n\n*当我们编写测试时……我们正在向自己讲述一个关于操作外部看起来如何的故事*\
  \ – Kent Beck\n\n### 什么是测试驱动开发？\n\n*   测试驱动编程\n    *   通过自动化测试驱动代码的任何行为变化。\n*  \
  \ 重构\n    *   在编程过程中保持代码的`simple form`，并逐步开发设计。\n*   频繁集成\n    *   根据需要频繁集成代码。\n\
  \n![](img/images----TDD-Workflow.png)\n\n### 测试驱动开发流程\n\n### 为什么要用测试驱动开发？\n\n* \
  \  TDD 确保了软件的质量和可维护性。\n*   测试确保了在扩展和修订时现有功能得以保留。\n*   重构延长了软件的生产周期。\n*   代码之后通常很难进行测试。\n\
  *   测试优先强调用户视角。\n*   没有测试的软件开发就像没有绳子和钩爪的爬山。\n\n### 为什么测试驱动开发能提高质量？\n\n#### 如果你不理解某东西，就无法为它编写测试\n\
  \n在实现之前编写测试的做法迫使人们更深入地处理要解决的问题，从而产生更高质量的代码，代码对其他开发者来说也更容易理解。作为副作用，TDD 还迫使人们处理客户对编写软件的期望问题。因此，TDD\
  \ 基本上不是一种测试方法，而是一种设计方法。\n\n#### 没有回归测试你就无法清理代码\n\n如果没有快速测试的可能性，你通常就不敢修改现有代码。最好是将类的代码（例如）复制到一个新类中，然后扩展额外的功能。结果是导致一个过载、混乱的项目，包含大量冗余代码。\n\
  \n#### 快速反馈循环节省时间和金钱\n\n如果你先写测试，就可以立即检查功能实现的正确性。结果是你始终能确定自己何时完成了一个功能的开发。\n\n![](img/images----DLP.png)\n\
  \n### 事后调试编程\n\n如果没有这些快速反馈循环，你经常会迷失在寻找 bug 原因的过程中。TDD 帮助将一个大问题分解为更小、可管理且可测试的问题。\n\
  \n#### 反正你都要测试，不如花时间正确去做\n\n回归测试是不可或缺的。如果不定期执行它们，测试大型应用程序几乎是不可能的。当然，回归测试也可以在之后编写，但这样就无法从\
  \ TDD 提供的更好的设计中受益。其次，随着截止日的临近，时间往往变得有限，导致随后的测试经常不足。\n\n#### 它让我的工作更加愉快\n\n每个成功的测试都带给你创造了价值之的感觉：一段你可以自豪地展示给其他开发者的执行软件。\n\
  \n## 4.4 使用 JUnit 5 进行单元测试\n\n### 4.4.1 单元测试\n\n**单元测试的好处：**\n\n*   可以立即检查代码更改\n\
  *   更好的代码质量/稳定性或安全性\n*   修改核心组件前的犹豫减少\n*   尽管需要实现额外的测试，但开发时间更短\n*   更容易重构\n*   简化实现的文档\n\
  \n**单元测试的要求：**\n\n*   测试易于实现\n*   快速且自动的执行\n*   对测试结果进行彻底分析\n\n### 4.4.2 JUnit 5\n\
  \n[JUnit 5](https://junit.org/junit5/) 是一个简单的 Java 单元测试框架，帮助在 JVM 上进行测试，专注于 Java\
  \ 8 语言特性、扩展性和现代编程 API。\n\n**JUnit 5 的目标是什么？**\n\n*   将测试创建的努力降到最低\n*   易于学习和使用\n\
  *   避免重复工作\n*   测试必须：\n    *   是重复应用的\n    *   可以单独生成的\n    *   是增量的\n    *   可以自由组合的\n\
  \    *   对于作者以外的人也是可行的\n    *   也可以由作者以外的人评估\n*   允许使用测试数据\n    *   测试数据的重用性\n \
  \   *   测试数据的生成通常比……复杂\n\n**我们应该测试什么？**\n\n单元测试最好的点是，你可以为所有的生产代码类编写测试，无论其功能、复杂性或内部结构如何。你可以对控制器、服务、仓库、领域类执行单元测试。遵循每个生产类一个测试类的规则。这是一个良好的开始，但不是必须的。\n\
  \n单元测试类应该测试类的公共接口。如果你这样做，所有其他方法将被自动测试。\n\n如果你的测试类的包结构与生产类相同，则 `protected` 和包私有方法在测试类中是可见的，也可以进行测试，但测试这些方法可能太深入了。私有方法是无法测试的，因为你无法从另一个测试类调用它们。\n\
  \n**如何组织测试？**\n\n常见的模式如 [Arrange, Act, Assert](https://xp123.com/articles/3a-arrange-assert/)\
  \ 和 [Given, When, Then](https://martinfowler.com/bliki/GivenWhenThen.html)，后者是作为[行为驱动开发](https://dannorth.net/introducing-bdd/)\
  \ (BDD) 的一部分开发的。\n\n**项目结构和命名规范如何？**\n\n现在所有都使用标准工具构建项目，如 [Maven](https://maven.apache.org/)\
  \ 或 [Gradle](https://gradle.org/)。因此，所有生产源代码位于 `src/main/java`，所有测试源文件位于 `src/test/java`。\n\
  \n```\n1 └── src\n2     └── main\n3         ├── java\n4         │   └── HelloWorld.java\n\
  5         └── test\n6             └── java\n7             └── HelloWorldTest.java\n\
  ```\n\n典型的项目目录结构\n\n\n\n\n\n像上面的测试类名通常会带有 `Test` 前缀。这是一个非常常见的命名规范，应该一致地遵守。它让开发者能够立即看出哪个类正在被测试。此外，某些工具也依赖于这一约定。\n\
  \n### 4.4.3 第一个单元测试\n\n```\n 1 class SimpleTest {\n 2 \n 3     private Collection<String>\
  \ collection = new ArrayList<>();\n 4 \n 5     @Test\n 6     void testEmptyCollection()\
  \ {\n 7         assertTrue(collection.isEmpty());\n 8     }\n 9 \n10     @Test\n\
  11     void testOneItemCollection() {\n12         collection.add(\"First JUnit Test\"\
  );\n13 \n14         assertEquals(1, collection.size());\n15     }\n16 }\n```\n\n\
  第一个简单的 JUnit 5 测试\n\n```\n1 setUp()\n2 testEmptyCollection()\n3 \n4 setUp()\n5 testOneItemCollection()\n\
  ```\n\n执行顺序\n\n**测试执行[顺序](https://junit.org/junit5/docs/current/user-guide/#writing-tests-test-execution-order)：**\n\
  \n默认情况下，测试方法将使用一种确定性但故意不直观的算法进行排序。这确保了测试套件的后续运行将以相同的顺序执行测试方法，从而允许可重复的构建。即使单元测试通常不应该依赖于执行顺序，但在某些情况下，必须强制执行测试方法的特定顺序。要指定测试方法的执行顺序，请在你的测试类或测试接口上使用\
  \ `@TestMethodOrder` 注，并提供首选的 `MethodOrder` 实现。\n\n### 4.4.4 断言 (Assertions)\n\n\
  [断言](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assertions.html)\
  \ 是一个支持在测试中断言条件的工具方法集合。JUnit 5 包含了 JUnit 4 的许多断言以及几个有趣的新断言。\n\n它还提供了对断言中使用 Lambda\
  \ 表达式的支持。在断言消息中使用 Lambda 表达式的优势是它是惰性求值的（lazy evaluated），这可以通过避免构建复杂消息来节省时间和资源。\n\
  \n测试的断言结果会提供特定的值。失败的断言将抛出 `AssertionFailedError` 或其子类。\n\n#### 4.4.4.1 `assertEquals()`\
  \ / `assertArrayEquals()`\n\n断言期望值和实际值相等。\n\n```\n 1 @Test\n 2 void equality() {\n\
  \ 3     Calculator calculator = new Calculator();\n 4 \n 5     assertEquals(2, calculator.add(1,\
  \ 1));\n 6     assertEquals(4, calculator.multiply(2, 2), \"可选的失败消息\");\n 7 \n 8\
  \     char[] expected = {'J','u','n','i','t'};\n 9     char[] actual = \"Junit\"\
  .toCharArray();\n10 \n11     assertArrayEquals(expected, actual);\n12 }\n```\n\n\
  等性\n\n#### 4.4.4.2 `assertSame()` / `assertNotSame()`\n\n断言期望值和实际值指向同一个对象。\n\n```\n\
  1 @Test\n2 void identity() {\n3     User john = new User(1, \"John\", \"Rambo\"\
  );\n4     User rocky = new User(2, \"Rocky\", \"Balboa\");\n5 \n6     assertSame(john,\
  \ john);\n7     assertNotSame(john, rocky);\n8 }\n```\n\n标识性\n\n#### 4.4.4.3 `assertTrue()`\
  \ / `assertFalse()` / `assertAll()`\n\n断言所提供的条件为真或假。`assertAll()` 断言所有提供的可执行体都不会抛出异常。可以将断言分组，并将所有失败的断言一起报告。\n\
  \n```\n 1 @Test\n 2 void truth() {\n 3     assertTrue('a' < 'b', () -> \"断言消息可以惰性求值\"\
  \n 4             + \"以避免不必要的构建复杂消息。\");\n 5 }\n 6 \n 7 @Test\n 8 void groupedTruth()\
  \ {\n 9     Person person = new Person(\"Jane\", \"Doe\");\n10 \n11     assertAll(\"\
  person\",\n12         () -> assertEquals(\"Jane\", person.firstName()),\n13    \
  \     () -> assertEquals(\"Doe\", person.lastName())\n14     );\n15 }\n```\n\n真值\n\
  \n#### 4.4.4.4 `assertNull()` / `assertNotNull()`\n\n断言实际值为 `null` 或不是。\n\n```\n\
  \ 1 @Test\n 2 void existence() {\n 3     assertNotNull(new Calculator());\n 4  \
  \   assertNull(null);\n 5 }\n```\n\n存在性\n\n#### 4.4.4.5 `assertThrows()`\n\n断言执行提供的可执行体会抛出预期类型的异常并返回该异常。\n\
  \n```\n 1 @Test\n 2 void exceptions() {\n 3     Calculator calculator = new Calculator();\n\
  \ 4 \n 5     Exception exception = assertThrows(ArithmeticException.class, () ->\
  \ calculator.divide(1, 0));\n 6     assertEquals(\"/ by zero\", exception.getMessage());\n\
  \ 7 }\n```\n\n异常\n\n#### 4.4.4.6 `assertTimeout()`\n\n断言执行提供的可执行体在超过给定超时之前完成。\n\n\
  ```\n 1 @Test\n 2 void timeout() {\n 3     assertTimeout(Duration.ofSeconds(5),\
  \ () -> TimeUnit.SECONDS.sleep(1));\n 4 }\n```\n\n超时\n\n#### 4.4.4.7 `fail()`\n\n\
  使测试失败。\n\n```\n 1 @Test\n 2 void failing() {\n 3     fail(\"a test\");\n 4 }\n```\n\
  \n失败\n\n### 4.4.5 注解 (Annotations)\n\nJUnit 支持以下[注解](https://junit.org/junit5/docs/current/user-guide/#writing-tests-annotations)\
  \ 来**配置测试：**\n\n`@BeforeAll` 在测试类开始前执行所有测试。方法必须是 `static` 的。\n\n`@AfterAll` 在测试类结束后执行所有测试。方法必须是\
  \ `static` 的。\n\n`@BeforeEach` 在每个测试之前执行。\n\n`@AfterEach` 在每个测试之后执行。\n\n`@Test`\
  \ 标记要测试的方法。\n\n`@Disabled` 禁用测试方法。\n\n`@Tag` 用于过滤，可以在类级别或方法级别声明。类似于 JUnit 4 的 [Categories](https://github.com/junit-team/junit4)。\n\
  \n`@DisplayName` 测试类和方法的自定义名称。\n\n`@Timeout` 如果其执行超过特定持续时间将失败。\n\n`@Nested` 表示被标记的类是嵌套类，意味着它与其包含类共享状态。由于嵌套类不能有静态字段和方法，这禁止在嵌套类中使用\
  \ `@BeforeAll` 和 `@AfterAll`。\n\n`@ParameterizedTest` 用于表示被标记的方法是参数化测试。你必须至少选择一个参数源。有多种参数类型。\n\
  \n`@TempDir` 可用于注解测试类中的私有字段或类型为 `Path` 或 `File` 的方法的参数，解析到临时目录。\n\n#### 4.4.5.1\
  \ `@Test`\n\n*   [`@Test`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Test.html)\
