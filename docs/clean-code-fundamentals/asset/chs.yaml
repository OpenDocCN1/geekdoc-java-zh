  \n**优点：**\n\n- 可以在不改变现有代码的情况下**轻松添加**新命令。\n- 有可能实现**撤销**和**重做**操作。\n- 你可以实现一系列**序列**操作。\n\
  \n**缺点：**\n\n- 需要**大量**类和对象共同工作来实现所需的目标。\n\n## 6.3.7 解释器\n\n*给定一种语言，定义其语法的表示法，并定义一个使用该表示法解释语言中句子的解释器。*\n\
  \n![](img/images----Interpreter1.png)\n\n## 6.3.8 迭代器\n\n*提供一种顺序访问聚合对象元素的方法，而不暴露其底层表示法。*\n\
  \n![](img/images----Iterator1.png)\n\n## 6.3.9 中介者\n\n*定义一个封装一组对象如何相互作用的对象。中介者通过防止对象之间显式相互引用来促进松耦合，并允许你独立地改变它们的交互方式。*\n\
  \n![](img/images----Mediator1.png)\n\n## 6.3.10 备忘录\n\n*在不违反封装的情况下，捕获并外部化对象的内部状态，以便该对象可以恢复。*\n\
  \n![](img/images----Memento1.png)\n\n## 6.3.11 访问者\n\n*表示在对象结构上执行的操作。*\n\n**用例：**\n\
  \n- 在不改变操作涉及的对象类的情况下定义新操作。\n- 当需要在不同类型上执行相似的操作。\n\n\n\n\n\n\n```java\n 1 public\
  \ class Circle implements Figure {\n 2 \n 3     private final double radius;\n 4\
  \ \n 5     public Circle(double radius) {\n 6         this.radius = radius;\n 7\
  \     }\n 8 \n 9     public double radius() {\n10         return this.radius;\n\
  \ 11     }\n 12 \n13     @Override\n 14     public <T> T accept(Visitor<T> visitor)\
  \ {\n 15         return visitor.visit(this);\n 16     }\n 17 }\n```\n\n`Circle`\n\
  \n```java\n 1 public class Rectangle implements Figure {\n 2 \n 3     private final\
  \ double weight;\n 4     private final double height;\n 5 \n 6     public Rectangle(double\
  \ weight, double height) {\n 7         this.weight = weight;\n 8         this.height\
  \ = height;\n 9     }\n10 \n11     public double weight() {\n 12         return\
  \ this.weight;\n 13     }\n 14 \n15     public double height() {\n 16         return\
  \ this.height;\n 17     }\n 18 \n19     @Override\n 20     public <T> T accept(Visitor<T>\
  \ visitor) {\n 21         return visitor.visit(this);\n 22     }\n 23 }\n```\n\n\
  `Rectangle`\n\n```java\n 1 public class Square implements Figure {\n 2 \n 3    \
  \ private final double side;\n 4 \n 5     public Square(double side) {\n 6     \
  \    this.side = side;\n 7     }\n 8 \n 9     public double side() {\n10       \
  \  return this.side;\n 11     }\n 12 \n13     @Override\n 14     public <T> T accept(Visitor<T>\
  \ visitor) {\n 15         return visitor.visit(this);\n 16     }\n 17 }\n```\n\n\
  `Square`\n\n```java\n 1 public class AreaVisitor implements Visitor<Double> {\n\
  \ 2 \n 3     @Override\n 4     public Double visit(Square square) {\n 5        \
  \ return square.side() * square.side();\n 6     }\n 7 \n 8     @Override\n 9   \
  \  public Double visit(Circle circle) {\n10         return Math.PI * circle.radius()\
  \ * circle.radius();\n 11     }\n 12 \n13     @Override\n 14     public Double visit(Rectangle\
  \ rectangle) {\n 15         return rectangle.height() * rectangle.weight();\n 16\
  \     }\n 17 }\n```\n\n`AreaVisitor`\n\n```java\n 1 public class PerimeterVisitor\
  \ implements Visitor<Double> {\n 2 \n 3     @Override\n 4     public Double visit(Square\
  \ element) {\n 5         return 4 * element.side();\n 6     }\n 7 \n 8     @Override\n\
  \ 9     public Double visit(Circle element) {\n10         return 2 * Math.PI * element.radius();\n\
  \ 11     }\n 12 \n13     @Override\n 14     public Double visit(Rectangle element)\
  \ {\n 15         return 2 * element.height() + 2 * element.height();\n 16     }\n\
  \ 17 }\n```\n\n`PerimeterVisitor`\n\n```java\n 1 public class Client {\n 2 \n 3\
  \     public static void main(String[] args) {\n 4         List<Figure> figures\
  \ = List.of(\n 5                 new Circle(3),\n 6                 new Square(4),\n\
  \ 7                 new Rectangle(2, 8));\n 8 \n 9         calculateArea(figures);\n\
  10         calculatePerimeter(figures);\n 11     }\n 12 \n13     private static\
  \ void calculateArea(List<Figure> figures) {\n 14         Visitor<Double> visitor\
  \ = new AreaVisitor();\n 15 \n16         double totalArea = figures.stream()\n 17\
  \                 .mapToDouble(f -> f.accept(visitor))\n 18                 .sum();\n\
  \ 19 \n20         System.out.println(String.format(\"Total area: %f \", totalArea));\n\
  \ 21     }\n 23\n23     private static void calculatePerimeter(List<Figure> figures)\
  \ {\n 24         Visitor<Double> visitor = new PerimeterVisitor();\n 25 \n26   \
  \      double totalPerimeter = figures.stream()\n 27                 .mapToDouble(f\
  \ -> f.accept(visitor))\n 28                 .sum();\n 29 \n30         System.out.println(String.format(\"\
  Total perimeter: %f\", totalPerimeter));\n 31     }\n 32 }\n```\n\n`Client`\n\n\
  ```\n Total area: 60,274334\n Total perimeter: 66,849556\n```\n\n`Client` 输出\n\n\
  ### 优点\n- 可以**轻松添加**新操作。\n- 操作逻辑**集中**在访问者中，而不是分散。\n- 访问者模式允许在**不改变集合中任何对象的类**的情况下定义操作。\n\
  \n### 缺点\n- 访问者具体类的实现可能会**破坏被访问对象的封装性**。这是因为新的访问者类需要访问这些对象的公共成员。\n\n"
