  \n#### 缺点：\n\n- **对于新产品族成员缺乏灵活性**。如果要向产品族中添加新产品，则必须更改 `Abstract Factory` 接口。然而，这会导致所有具体工厂代码的破坏。工作量很大。\n\
  - 即使是与现有实现具有高度相似的新实现，仍然需要一个新的工厂。\n\n### 6.1.5 原型模式 (Prototype)\n\n*使用原型实例来指定要创建的对象的类型，并通过克隆该原型来创建新对象。*\n\
  \n![](img/images----Prototype1.png)\n\n#### 用例：\n\n- 创建原型对象的副本并进行必要的修改。\n\nJava\
  \ 了一了一些复制对象以创建新对象的方法。一种是使用 `java.lang.Cloneable` 标记接口。你需要实现 `java.lang.Cloneable`\
  \ 接口，并重写每个对象都继承自 `Object` 类的 `clone` 方法。\n\n关于克隆有两种类型：**浅拷贝**和**深拷贝**。\n\n浅拷贝会复制所有引用类型或值类型，但不会复制引用所引用的对象。新对象中的引用指向原始对象中引用指向相同的对象。Java\
  \ 中默认的 `clone` 方法实现创建的是浅拷贝克隆。\n\n深拷贝会复制元素以及直接或间接引用这些元素的所有内容。\n\n#### 6.1.5.1 示例：[`Person\
  \ - 浅拷贝`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/creational/prototype/shallow/person)\n\
  \n```\n 1 public class Person implements Cloneable {\n 2 \n3     private String\
  \ name;\n 4     private Address address;\n 5 \n 6     public Person(String name,\
  \ Address address) {\n 7         this.name = name;\n 8         this.address = address;\n\
  \ 9     }\n10 \n11     public String name() {\n12         return this.name;\n13\
  \     }\n14 \n15     public void name(String name) {\n16         this.name = name;\n\
  17     }\n18 \n19     public Address address() {\n20         return this.address;\n\
  21     }\n22 \n23     public void address(Address address) {\n24         this.address\
  \ = address;\n25     }\n26 \n27     @Override\n28     public Person clone() {\n\
  29         try {\n30             return (Person) super.clone();\n31         } catch\
  \ (CloneNotSupportedException e) {\n32             throw new AssertionError();\n\
  33         }\n34     }\n35 }\n```\n\nPerson\n\n```\n 1 public class Address implements\
