  \n```java\npublic class FileSystem {\n    \n    public void create(File file) {\n\
  \        System.out.println(String.format(\"Create %s\", file.getName()));\n   \
  \ }\n\n    public void delete(File file) {\n        System.out.println(String.format(\"\
  Delete %s\", file.getName()));\n    }\n\n    public void move(File source, File\
  \ target) {\n        System.out.println(String.format(\"Move %s to %s\", source.getName(),\
  \ target.getName()));\n    }\n}\n```\n\nFileSystem\n\n```java\npublic class BatchFileSystemExecuter\
  \ {\n    \n    private final FileSystem fs;\n\n    public BatchFileSystemExecuter(FileSystem\
  \ fs) {\n        this.fs = fs;\n    }\n\n    public void execute(List<Command> commands)\
  \ {\n        commands.forEach(c -> c.execute(this.fs));\n    }\n}\n```\n\nBatchFileSystemExecuter\n\
  \n```java\npublic class Client {\n    \n    public static void main(String[] args)\
  \ {\n        FileSystem fs = new FileSystem();\n        BatchFileSystemExecuter\
  \ executer = new BatchFileSystemExecuter(fs);\n\n        List<Command> commands\
  \ = List.of(\n                new CreateCommand(new File(\"file.tmp\")),\n     \
  \           new DeleteCommand(new File(\"file.tmp\")),\n                new CreateCommand(new\
  \ File(\"secret.txt\")),\n                new MoveCommand(new File(\"secret.txt\"\
  ), new File(\"topsecret.txt\")));\n\n        executer.execute(commands);\n    }\n\
  }\n```\n\nClient\n\n```\nCreate file.tmp\nDelete file.tmp\nCreate secret.txt\nMove\
  \ secret.txt to topsecret.txt\n```\n\n\n\n\n\n# 输出\n\n## 6.3.6.2 示例 [`电视`](https://github.com/mnhock/swcs/tree/master/swcs-gof/src/main/java/swcs/gof/behavioral/command/television)\n\
