  \ {\n    private int channel;\n\n    public SmartRemoteControl(Television television)\
  \ {\n        super(television);\n    }\n\n    public void nextChannel() {\n    \
  \    this.channel++;\n        channel(this.channel);\n    }\n\n    public void previousChannel()\
  \ {\n        this.channel--;\n        channel(this.channel);\n    }\n}\n```\n\n\
  ### 智能遥控器\n\n```java\npublic class Client {\n    public static void main(String[]\
