  Pay %f\", price));\n 23         }\n 24     }\n 25 }\n```\n\n良好的代码\n\n### 5.3.4 [接口隔离原则](https://drive.google.com/file/d/0BwhCYaYDn8EgOTViYjJhYzMtMzYxMC00MzFjLWJjMzYtOGJiMDc5N2JkYmJi/view)\n\
  \n编写客户端特定的细粒度接口。\n\n- 避免`接口污染`和“肥胖”接口。\n- 不要使用包含客户端可能需要的所有方法的接口，而应该有涵盖每个客户端类型特定需求的独立接口。\n\
  - 单个接口的方法应该具有低耦合。\n- 客户端不应依赖于完全不需要的方法。\n- 应该根据客户端对接口的需求进行发布。\n- 因此，客户端必须操作那些只能完成其所需的接口。\n\
  - 使得软件能够被划分为解耦且灵活的类。\n- 未来可能的专业或技术需求只需要对软件本身进行微小的更改。\n\n#### 5.3.4.1 示例：[多功能设备](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/isp/printer)\n\
  \n**不规范的代码示例**\n\n![](img/images----ISP1.png)\n\n```\n1 public interface MultiFunctionDevice\
  \ {\n2     void print();\n3     void fax();\n4     void scan();\n5 }\n```\n\n糟糕的代码\n\
  \n```\n 1 class AllInOnePrinter implements MultiFunctionDevice {\n 2     @Override\n\
  \ 3     public void print() {\n 4     }\n 5 \n 6     @Override\n 7     public void\
  \ fax() {\n 8     }\n 9 \n10     @Override\n11     public void scan() {\n12    \
  \ }\n 13 }\n```\n\n糟糕的代码\n\n```\n 1 class InkjetPrinter implements MultiFunctionDevice\
  \ {\n 2 \n 3     @Override\n 4     public void print() {\n 5     }\n 6 \n 7    \
  \ @Override\n 8     public void fax() {\n 9         throw new UnsupportedOperationException();\n\
  10     }\n 11 \n12     @Override\n 13     public void scan() {\n14         throw\
  \ new UnsupportedOperationException();\n15     }\n 16 }\n```\n\n糟糕的代码\n\n**符合规范的解决方案**\n\
  \n![](img/images----ISP2.png)\n\n```\n1 public interface Printer {\n2     void print();\n\
  3 }\n```\n\n良好的代码\n\n```\n1 public interface Fax {\n2     void fax();\n3 }\n```\n\
  \n良好的代码\n\n```\n1 public interface Scanner {\n2     void scan();\n3 }\n```\n\n良好的代码\n\
  \n```\n1 class InkjetPrinter implements Printer {\n 2 \n 3     @Override\n 4   \
