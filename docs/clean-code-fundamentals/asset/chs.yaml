  \ implements Printer, Fax, Scanner {\n 2 \n 3     @Override\n 4     public void\
  \ print() {\n 5     }\n 6 \n 7     @Override\n 8     public void fax() {\n 9   \
  \  }\n10 \n11     @Override\n12     public void scan() {\n13     }\n 14 }\n```\n\
  \n良好的代码\n\n#### 5.3.4.2 示例：[技术员工](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/isp/techemployee)\n\
