  \ person) {\n22         System.out.println(String.format(\"%s: %s, %s\",\n23   \
  \              object,\n24                 person.name(),\n25                 person.address().city()));\n\
  26     }\n27 }\n```\n\nClient\n\n```\n1 Orginal: Orginal name, Orginal city\n2 Clone:\
