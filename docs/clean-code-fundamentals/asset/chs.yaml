  *   `@ArgumentsSource`\n*   `@NullSource`\n*   `@EmptySource`\n*   `@NullAndEmptySource`\n\
  \n#### 4.4.7.1 `@ValueSource`\n\n*   [`@ValueSource`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.params/org/junit/jupiter/params/provider/ValueSource.html)\
  \ 提供对数组的访问。\n\n*   支持的类型有 `shorts`、`bytes`、`ints`、`longs`、`floats`、`doubles`、`chars`、`booleans`、`strings`\
  \ 和 `classes`。\n\n*   每个 `@ValueSource` 声明只能指定一种的支持类型。\n\n```\n 1 @ParameterizedTest\n\
  \ 2 @ValueSource(strings = { \"otto\", \"level\", \"radar\", \"rotor\", \"kayak\"\
  \ })\n 3 palindromes(String candidate) {\n 4     assertTrue(StringUtils.isPalindrome(candidate));\n\
  \ 5 }\n 6 \n 7 @ParameterizedTest\n 8 @ValueSource(ints = { 1, 2, 3 })\n 9 testWithValueSource(int\
  \ argument) {\n10     assertTrue(argument > 0 && argument < 4);\n11 }\n```\n\n####\
  \ 4.4.7.2 `@MethodSource`\n\n\n\n\n*   [`@MethodSource`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.params/org/junit/jupiter/params/provider/MethodSource.html)\
  \ 提供访问从注解声明的类的工厂方法返回的值，或通过完全限定的方法名从外部类的静态工厂方法返回的值的值。\n\n*   每个工厂方法必须生成参数流。\n\n*\
  \   流可以是 JUnit 可以转换为 `Stream` 的任何内容，例如 `Stream`、`DoubleStream`、`LongStream`、`IntStream`、`Collection`、`Iterator`、`Iterable`、对象数组或原始类型数组。\n\
  \n*   工厂方法必须是 `static` 且不声明任何参数。\n\n```\n1 @ParameterizedTest\n2 @MethodSource(\"\
  stringProvider\")\n3 void testWithExplicitLocalMethodSource(String argument) {\n\
  4     assertNotNull(argument);\n5 }\n6 \n7 static Stream<String> stringProvider()\
  \ {\n8     return Stream.of(\"JUnit 5\", \"rocks!\");\n9 }\n```\n\n`@MethodSource`\
  \ - `Stream<String>`\n\n```\n1 @ParameterizedTest\n2 @MethodSource(\"range\")\n\
  3 void testWithRangeMethodSource(int argument) {\n4     assertNotEquals(9, argument);\n\
  5 }\n6 \n7 static IntStream range() {\n8     return IntStream.range(0, 20).skip(10);\n\
  9 }\n```\n\n`@MethodSource` - `IntStream`\n\n```\n 1 @ParameterizedTest\n 2 @MethodSource(\"\
  stringIntAndListProvider\")\n 3 void testWithMultiArgMethodSource(String str, int\
  \ num, List<String> list) {\n 4     assertEquals(5, str.length());\n 5     assertTrue(num\
  \ >=1 && num <=2);\n 6     assertEquals(2, list.size());\n 7 }\n 8 \n 9 static Stream<Arguments>\
  \ stringIntAndListProvider() {\n10     return Stream.of(\n11         arguments(\"\
  apple\", 1, Arrays.asList(\"a\", \"b\")),\n12         arguments(\"lemon\", 2, Arrays.asList(\"\
  x\", \"y\"))\n13     );\n14 }\n```\n\n`@MethodSource` - `Stream<Arguments>`\n\n\
  #### 4.4.7.3 `@CsvSource`\n\n*   [`@CsvSource`](https://junit.org/junit5/docs/current/api/org.junit.jupiter.params/org/junit/jupiter/params/provider/CsvSource.html)\
  \ 从一个或多个提供的 CSV 行中读取逗号分隔的值 (CSV)。\n\n```\n 1 @ParameterizedTest\n 2 @CsvSource({\n\
  \ 3     \"Bischofsmais,         1\",\n 4     \"Osternohe,            2\",\n 5  \
  \   'Leogang, Austria', 0xF1\",\n 6     'Porte du Soleil, France',        4\",\n\
  \ 7 })\n 8 void testWithCsvSource(String bikepark, int rank) {\n 9     assertNotNull(bikepark);\n\
  10     assertNotEquals(0, rank);\n11 }\n```\n\n`@CsvSource`\n\n#### 4.4.7.4 `@CsvFileSource`\n\
  \n```\n1 @ParameterizedTest\n2 @CsvFileSource(resources = \"/two-column.csv\", numLinesToSkip\
  \ = 1)\n3 void testWithCsvFileSource(String country, int reference) {\n4     assertNotNull(country);\n\
  5     assertNotEquals(0, reference);\n6 }\n```\n\n`@CsvFileSource`\n\n```\n1 #two-column.csv\n\
  2 Country, reference\n3 Sweden, 1\n4 Germany, 2\n5 Australia, 3\n6 \"United States\
  \ of America\", 4\n```\n\n`@CsvFileSource`\n\n#### 4.4.7.5 `@ArgumentsSource`\n\n\
  ```\n1 @ParameterizedTest\n2 @ArgumentsSource(BikeArgumentsProvider.class)\n3 void\
  \ testWithArgumentsSource(String argument) {\n4     assertNotNull(argument);\n5\
  \ }\n```\n\n`@ArgumentsSource`\n\n```\n1 public class BikeArgumentsProvider implements\
  \ ArgumentsProvider {\n2 \n3 @Override\n4     public Stream<? extends Arguments>\
  \ provideArguments(ExtensionContext context) {\n5         return Stream.of(\"Specialized\"\
  , \"Cube\").map(Arguments::of);\n6     }\n7 }\n```\n\n`ArgumentsProvider`\n\n##\
