  \ {}\n2 @Test newAccountShouldHaveZeroBalance() {}\n3 @Test withdrawShouldReduceBalanceByAmount()\
  \ {}\n4 @Test withdrawNegativeAmountShouldThrowException() {}\n5 @Test withdrawNegativeAmountShouldNotChangeBalance()\
  \ {}\n```\n\n以名称命名的预期行为\n\n### 4.5.3 对象母亲 (Object Mother)\n\n[对象母亲](https://martinfowler.com/bliki/ObjectMother.html)\
  \ 是一种可以用于测试的类，它允许我们为测试提供预先配置的对象。这里的示例相当简单，但请想象一下在真实的应用程序中，类可能具有许多属性和/或组合关系。\n\n\
  大多数测试不再由自己实例化对象，而是通过工厂进行。在未来的演进中，如果给类添加了新的强制性属性，你只需要修改工厂，所有测试都将通过。。\n\n构建器（Builders）的结合使得对象母亲生成的对象可以根据测试需求进行定制。否则，将需要为每种需求创建多个工厂，并使用一个接收测试用例所需所有信息参数的方法。\n\
  \n```\n1 User user = new User(\"user\", \"password\", \"USER\")\n2 Authentication\
  \ auth = new UsernamePasswordAuthenticationToken(user, null, user.authorities());\n\
  ```\n\n#### 传统方法\n\n```\n1 Authentication user = TestAuthentications.authenticatedUser();\n\
  2 Authentication admin = TestAuthentications.authenticatedAdmin();\n3 Authentication\
  \ tester = TestAuthentications.authenticated(new User(\"user\", \"password\", \"\
  TESTER\"));\n```\n\n#### 对象母亲模式\n\n```\n 1 public final class TestAuthentications\
  \ {\n 2 \n 3     private static final User USER = new User(\"user\", \"password\"\
  , \"USER\");\n 4     private static final User ADMIN = new User(\"admin\", \"password\"\
  , \"USER, ADMIN\");\n 5 \n 6     private TestAuthentications() {\n 7     }\n 8 \n\
  \ 9     public static Authentication authenticatedAdmin() {\n10         return authenticated(ADMIN);\n\
  11     }\n12 \n13     public static Authentication authenticatedUser() {\n14   \
  \      return authenticated(USER);\n15     }\n16 \n17     public static Authentication\
  \ authenticated(User user) {\n18         return new UsernamePasswordAuthenticationToken(user,\
  \ null, user.authorities());\n19 }\n20 }\n```\n\n#### 对象母亲模式实现\n\n### 4.5.4 测试数据构建器\
  \ (Test Data Builder)\n\n对象母亲和构建器模式分别为我们的测试带来了各自优势，但也可以结合起来进一步增强测试的可读性和维护性。对于复杂对象，书中《由测试引导的面向对象软件》（*Growing\
  \ Object-Oriented Software, Guided by Tests*）描述的测试构建器模式是创建测试对象的完美解决方案。\n\n```\n\
  1 Invoice anInvoice = new InvoiceBuilder().build();\n```\n\n#### 测试数据构建器的用法\n\n\
  ```\n 1 public class InvoiceBuilder {\n 2 \n 3     Recipient recipient = new RecipientBuilder().build();\n\
  \ 4     InvoiceLines lines = new InvoiceLines(new InvoiceLineBuilder().build());\n\
  \ 5     PoundsShillingsPence discount = PoundsShillingsPence.ZERO;\n 6 \n 7    \
  \ public InvoiceBuilder withRecipient(Recipient recipient) {\n 8         this.recipient\
  \ = recipient;\n 9         return this;\n10     }\n11     public InvoiceBuilder\
  \ withInvoiceLines(InvoiceLines lines) {\n12         this.lines = lines;\n13   \
  \      return this;\n14     }\n15     public InvoiceBuilder withDiscount(PoundsShillingsPence\
  \ discount) {\n16         this.discount = discount;\n17         return this;\n18\
  \     }\n19     public Invoice build() {\n20         return new Invoice(recipient,\
  \ lines, discount);\n21     }\n22 }\n```\n\n#### 构建器模式\n\n```\n1  Invoice invoiceWithNoPostcode\
  \ = new InvoiceBuilder()\n2     .withRecipient(new RecipientBuilder()\n3       \
  \  .withAddress(new AddressBuilder()\n4             .withNoPostcode()\n5       \
  \      .build())\n6         .build())\n7     .build();\n```\n\n#### 组合构建器模式\n\n\
  ```\n1  Invoice invoice = new InvoiceBuilder()\n2     .withRecipient(new RecipientBuilder().withAddress(new\
  \ AddressBuilder().withNoPostcode())))\n3     .build();\n```\n\n#### 组合构建器模式，更短的版本\n\
  \n```\n1 Invoice invoice = anInvoice()\n2     .fromRecipient(aRecipient().withAddress(anAddress().withNoPostcode()))\n\
  3     .build();\n```\n\n#### 组合构建器模式，更短的版本\n\n```\n1 Invoice invoice = anInvoice()\n\
  2     .from(aRecipient().with(anAddress().withNoPostcode()))\n3     .build();\n\
  ```\n\n#### 组合构建器模式，最短的版本\n\n### 4.5.5 F.I.R.S.T\n\n遵循有助于编写整洁测试的五个规则，这些规则定义了 `F.I.R.S.T`^(1)\
  \ 缩写。\n\n**快速 (Fast)**\n\n* 测试应该是快速的。\n* 如果测试缓慢，运行频率就会降低，因此无法尽早发现问题。\n\n**独立 (Independent)**\n\
  \n* 测试不应该相互依赖，而应该独立执行。\n* 测试不应该为下一个测试设置条件，并且应该以任何顺序执行。\n* 如果测试相互依赖，第一个失败的测试将触发下游后续测试的级联失败。\n\
  \n**可重复 (Repeatable)**\n\n* 测试在任何环境中都应该是重复的。\n* 测试应该可以在生产环境中执行。\n\n**自验证 (Self-Validating)**\n\
  \n* 测试应该具有布尔输出。\n* 测试要么通过，要么失败。\n* 应该避免手动研究日志。\n* 如果测试没有自验证，可能需要长时间的人工评估。\n\n**及时\
  \ (Timely)**\n\n* 测试必须及时编写。\n* 测试应该在编写生产代码之前，以确保它们能够通过。\n* 如果测试是在生产代码后开发的，代码可能难以测试。\n\
  \n## 4.6 使用 Mockito 进行 Mock\n\n[Mockito](https://site.mockito.org/) 是一个用于为 Java\
  \ 程序创建测试双对象的 Mock 框架。\n\n**为什么我们需要测试双对象？**\n\n大多数我们编写的代码依赖于其他依赖。当我们使用单元测试时，代码通常会将工作委托给其他类的方法，我们的测试必须依赖这些方法。\n\
  \n测试双对象有助于我们隔离代码单元并单独测试。替换 `DOCs`（依赖组件）并控制 `SUT`（被测系统）运行的环境，从而测试状态并验证交互。\n\n###\
  \ 4.6.1 测试双对象的类型\n\nTest Double 是一个通用术语，由 *Gerard Meszaros* 在他的书《xUnit 测试模式》中提出，指任何为了测试目的而替换生产对象的情况。\n\
  \n![](img/images----Test-Doubles-Overview.png)\n\n#### 测试双对象的类型\n\n测试桩 (Test stub)\
  \ 用于为测试代码提供*间接输入*。\n\nMock 对象 (Mock object) 用于验证测试代码的*间接输出*，通过在执行测试代码之前先定义预期。\n\n\
  测试探针 (Test spy) 用于验证测试代码的*间接输出*，通过在执行后断言预期，而不是在执行之前定义预期。它有助于记录创建的间接对象的信息。\n\n伪对象\
  \ (Fake object) 作为更简单的实现，例如在测试中使用内存数据库而不是进行真实的数据库访问。\n\n哑对象 (Dummy object) 用于需要方法参数但不需要使用该参数的情况。\n\
  \n哑对象和桩用于为测试**准备环境**。探针和 Mock 则用于**验证通信的正确性**。\n\n\n\n\n\n关于 Mock 测试，有[两种样式](https://martinfowler.com/articles/mocksArentStubs.html#ClassicalAndMockistTesting)：传统的和\
  \ Mock 主义的（mockist）TDD 风格。传统的 TDD 风格是尽可能使用真实对象，在使用真实对象不方便时使用双倍体（double）。然而，Mock\
  \ TDD 实践者会始终使用 Mock。\n\n## 4.6.2 激活\n\n激活 Mockito 可以通过 JUnit 5 的 `@ExtendWith` 注解或通过编程方式调用\
  \ `MockitoAnnotations.openMocks()` 来。\n\n```\n1 @ExtendWith(MockitoExtension.class)\n\
  2 class MockitoAnnotationTest {\n3   ...\n4 }\n```\n\n@ExtendWith\n\n```\n1 class\
  \ MockitoTest {\n2 \n3   @BeforeEach\n4   void init() {\n5       MockitoAnnotations.openMocks(this);\n\
  6   }\n7 }\n```\n\n`MockitoAnnotations.openMocks()`\n\n## 4.6.3 注解\n\nMockito 支持以下用于配置\
  \ Mock 测试的[注解](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/Mockito.html)：\n\
  \n`@Mock`\n\n将为指定的类创建一个新的 Mock 实现。它不会创建真实对象。\n\n`@Spy`\n\n在真实实例周围创建一个包装器并对该真实对象进行监视。\n\
  \n`@InjectMocks`\n\n将创建的 Mock 注入到指定的类实例中。\n\n`@Captor`\n\n用于创建 [ArgumentCaptor](https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/ArgumentCaptor.html)\
  \ 实例，用于捕获方法参数值以便进一步断言。\n\n### 4.6.3.1 `@Mock`\n\n使用 `@Mock` 将创建一个类的 Mock 实例。\n\n\
  * 该实例被完全插桩以跟踪与其交互。\n* 这不是一个真实对象，且不维护状态变化。\n\n```\n 1 @Test\n 2 void whenNotUsingMockAnnotation()\
  \ {\n 3     List mock = Mockito.mock(ArrayList.class);\n 4 \n 5     mock.add(\"\
  Java\");\n 6     Mockito.verify(mock).add(\"Java\");\n 7     assertEquals(0, mock.size());\n\
  \ 8 \n 9     Mockito.when(mock.size()).thenReturn(2020);\n10     assertEquals(2020,\
  \ mock.size());\n11 }\n```\n\n手动使用 `Mockito.mock()`\n\n```\n 1 @Mock\n 2 List<String>\
  \ mock;\n 3 \n 4 @Test\n 5 void whenUsingMockAnnotation() {\n 6     mocked.add(\"\
  Java\");\n 7     Mockito.verify(mock).add(\"Java\");\n 8     assertEquals(0, mock.size());\n\
  \ 9 \n10     Mockito.when(mock.size()).thenReturn(2020);\n11     assertEquals(2020,\
  \ mockedList.size());\n12 }\n```\n\n`@Mock` 注解\n\n### 4.6.3.2 `@Spy`\n\n使用 `@Spy`\
  \ 将创建一个类的真实实例。\n\n* 你可以跟踪与其的所有交互。\n* 它维护状态变化。\n\n```\n 1 @Test\n 2 void whenNotUsingSpyAnnotation()\
  \ {\n 3     List<String> spy = Mockito.spy(new ArrayList<>());\n 4 \n 5     spy.add(\"\
  Java\");\n 6     Mockito.verify(spy).add(\"Java\");\n 7     assertEquals(1, spy.size());\n\
  \ 8 \n 9     Mockito.doReturn(2020).when(spy).size();\n10     assertEquals(2020,\
  \ spy.size());\n11 }\n```\n\n手动使用 `Mockito.spy()`\n\n```\n 1 @Spy\n 2 List<String>\
  \ spy = new ArrayList<>();\n 3 \n 4 @Test\n 5 void whenUsingMockAnnotation() {\n\
  \ 6     mocked.add(\"Java\");\n 7     Mockito.verify(mock).add(\"Java\");\n 8  \
  \   assertEquals(0, mock.size());\n 9 \n10     Mockito.doReturn(2020).when(spy).size();\n\
  11     assertEquals(2020, spy.size());\n12 }\n```\n\n`@Spy` 注解\n\n### 4.6.3.3 `@Captor`\n\
  \n```\n1 @ExtendWith(MockitoExtension.class)\n2 class MockitoCaptorTest {\n3 \n\
  4   @Captor\n5   ArgumentCaptor<String> captor;\n6 \n7   @Test\n8   void whenUsingCaptorAnnotation()\
  \ {\n9     List mock = Mockito.mock(ArrayList.class);\n10    mock.add(\"Java\");\n\
  11    Mockito.verify(mock).add(\"Java\");\n12    assertEquals(\"Java\", captor.getValue());\n\
  13  }\n14 }\n```\n\n@Captor\n\n## 4.7 代码覆盖率\n\n代码覆盖率是一种在运行时衡量哪些代码行被执行的指标。它通过执行测试用例进行测量，并提供关于代码被测试程度的说明。它通过提高测试用例的质量来提高质量。\n\
  \n测试覆盖率绝不被理解为唯一的指标。\n\n测量技术：\n\n**语句覆盖率（Statement Coverage）**\n* 衡量行是否被处理。\n* 问题：它只是一个指标。\n\
  \n**分支覆盖率（Decision/Branch Coverage）**\n* 衡量分支（if, while）是否发生。\n* 问题：它很大取决于项目。\n\n\
  **路径覆盖率（Path Coverage）**\n* 衡量所有可能的流是否已运行。\n* 问题：可能性呈指数级增长。\n\n**函数覆盖率（Function\
  \ Coverage）**\n* 衡量函数是否被调用。\n\n**竞态覆盖率（Race Coverage）**\n* 衡量代码部分是否并行运行。\n\n挑战：\n\
  \n达到 100%的覆盖率是幻觉！代码覆盖率应该根据项目进行定义并在构建过程中自动检查。\n\n所需的努力：\n\n提高覆盖率需要努力。通常为了人为提高它们而编写愚蠢的测试。测试纯\
  \ setter 和 getter 通常没有意义。\n\n测试的价值：\n\n再次，代码覆盖率不应被视为质量的表示！\n\n工具：\n\n基于 Java 的代码覆盖率框架，支持语句覆盖和分支覆盖。提供文本、HTML\
  \ 和 XML 报告的生成，是 Eclipse 的一部分。\n\n\n\n\n\nPMD 是一个静态源代码分析器。它能发现常见的编程缺陷，如未使用的变量、空的\
  \ catch 块、不必要的对象创建等。包含 CPD，一个复制粘贴检测器。\n\n[UCDetector](http://www.ucdetector.org/)\n\
  \n不必要代码检测器（Unnecessary Code Detector）搜索未引用的方法和类，并对方法和类的可见性提供建议。\n\n## 4.9 持续集成\n\
  \n持续集成描述了对应用程序进行定期、完整的构建、测试和发布的过程。有云提供商如 [CircleCI](https://circleci.com/) 或 [Travis](https://travis.ci.org/)，也有本地服务器如\
  \ [Jenkins](https://www.jenkins.io/), [GitLab CI](https://docs.gitlab.com/ee/ci/),\
  \ [TeamCity](https://www.jetbrains.com/teamcity/) 和 [Bamboo](https://www.atlassian.com/software/bamboo)。\n\
  \n![](img/images----CI-Overview.png)\n\n### 持续集成\n\n#### 理念\n* 尽且频繁地将更改提交到版本管理系统中。\n\
  * 将大型更改替换为增量的、功能性的小更改。\n* 当更改提交到版本管理系统时，整个系统将重新构建并进行自动测试。\n* 尝试尽快对开发者提供的更改提供反馈。\n\
  * 通过持续测试和快速反馈取代传统的测试方法来提高质量。\n\n#### 组成和步骤\n* 编译\n* 测试执行（单元测试、集成测试、验收测试等）\n* 集成（数据库、第三方系统）\n\
  * 静态分析（代码与架构）\n* 自动部署\n* 文档生成\n\n#### 解决的风险\n* 后期故障排除\n* 缺乏团队协作\n    * 你的更改和我的不匹配\n\
  \    * 你两个月前不是才修复过这个吗？\n* 代码质量差\n    * 为什么三个不同的类在做同样的事情？\n    * XY 团队的代码看起来完全不同\n\
  * 缺乏透明度/可见性\n    * 哪些测试没有运行？\n    * 构建版本 1.2.3 包含什么？\n    * 我们的代码覆盖率如何？\n* 软件不可用\n\
  \    * 我没问题\n    * 它正运行着\n    * 我需要另一个构建版本来测试\n    * 老板明天要来，我们需要一个演示\n\n## 4.9.1\
  \ CI、CD 和 CD 的区别\n\n![](img/images----CI-CD.png)\n\n### CI、CD 和 CD 的区别\n\n#### 持续集成\
  \ (CI)\n* 通过 CI，代码更改在提交后立即进行测试，以便新包含的更改可以被持续测试。\n* 其基本思想是在开发过程中频繁测试代码，以便尽早发现并修复潜在问题。\n\
  * 通过 CI，大部分工作由自动化测试和构建服务器完成。\n* 由于 CI 对软件状态提供持续反馈，所出现的代码问题通常不那么复杂，且更容易解决。\n\n####\
  \ 持续交付 (Continuous Delivery)\n* 持续交付是 CI 的扩展。它涉及到在开发者完成开发后立即将开发的代码持续交付到测试环境。\n*\
  \ 它包含了持续集成、测试自动化和部署自动化过程，以最少的人工干预实现快速可靠的软件开发和部署。\n* 核心思想是将代码交付给 QA、客户或任何用户群体，以便对其进行持续和定期的审查。\n\
  * 这使得在开发周期早期识别问题成为可能，并确保它们能够尽早解决。\n\n#### 持续部署 (Continuous Deployment)\n* 持续部署是持续交付之后的下一个逻辑步骤。\n\
  * 它是代码开发完成后直接将其交付到生产环境的过程。\n* 通过持续部署，所有通过自动化测试的更改都会自动传输到生产环境。\n* 成功实施需要持续集的自动化，以及持续交付到测试环境的自动化。最后，它还需要自动部署到生产环境的能力。\n\
  \n## 4.9.2 CI 工作流\n\n![](img/images----CI-Workflow.png)\n\n### 持续集成工作流\n\n在你的 CI\
  \ 工作流中，你可以根据目标集成许多实用的工具。在这种情况下，以下工具是 CI 工作流的一部分。\n\n[Nexus](https://www.sonatype.com/nexus)\n\
  管理跨整个软件供应链的二进制文件和构建产物。\n\n[SonarQube](http://www.sonarqube.org/)\n技术质量静态代码分析平台。不仅支持\
  \ Java，还支持其他编程语言的分析。针对不同的质量范围分析代码并以图形化显示结果。\n\n[Renovate](https://github.com/renovatebot/renovate)\n\
  多平台和多语言的自动化依赖更新。\n\n[DependencyTrack](https://dependencytrack.org/)\n允许组织识别并减少使用第三方和开源组件带来的风险的平台。\n\
  \n## 4.9.3 前提条件\n\n#### 通用代码库\n* 为了能在团队内部进行有意义的集成，必须存在一个版本管理系统，开发者可以在其中持续集成他们的更改。\n\
  \n#### 自动化编译\n* 每个更改在集成之前必须通过统一定义的测试。\n* 这需要自动化编译。\n\n#### 持续测试开发\n* 如果可能，每个更改都应带有测试进行开发。\n\
  * 新开发的测试应成为自动化测试套件的一部分。\n* 使用代码覆盖率来记录和控制测试覆盖率。\n\n#### 频繁集成\n* 尽可能频繁地将更改集成到公共代码库。\n\
  * 小增量可以将集成失败的风险降至最低。\n* 开发者的工作通常在代码库中。\n\n#### 短测试周期\n* 集成前的测试周期应该是短的，以鼓励频繁集成。\n\
  \n#### 镜像生产环境\n* 更改应该在真实生产环境的副本上进行测试。\n\n#### 便于访问\n* 即使是非开发者也需要方便访问软件开发的结果。\n\n\
  #### 自动化报告\n* 上次成功集成是什么时候？\n* 自上次交付以来引入了哪些更改？\n* 版本质量如何？\n\n#### 自动化发布\n\n## 4.9.4\
  \ 优点与缺点\n\n#### 优点\n* 集成问题被不断识别和解决，而不仅仅是在里程碑节点之前\n* 组件不匹配的早期预警\n* 通过立即执行单元测试快速检测错误\n\
  * 始终有一个可用于演示、测试或发布目的的可执行标准版本\n* 对提交错误或不完整的代码提供快速反馈\n* 早期且频繁的测试，能更早发现错误\n* 测试与开发并行进行\n\
  * 在最早、最有利的时间修正错误\n* 对关键指标做出做出反应\n* 审查编码规范和最佳实践\n\n#### 缺点\n* 搭建搭建\n* 硬件和软件成本\n\n\
  ## 4.9.5 最佳实践\n* 使用版本管理系统\n* 将更改提交到主分支应自动触发构建\n* 尽早频繁提交，优先选择[基于主干开发](https://trunkbaseddevelopment.com/)\n\
  * 不要提交未运行的代码\n* 立即修复构建错误\n* 测试应作为 CI 过程的一部分运行，测试失败会导致构建失败\n* 尽早解决问题并快速失败\n* 代码质量检查应作为\
  \ CI 过程的一部分运行\n* 根据指标采取行动和做出\n* 为每个构建创建产物\n* 使用配置即代码，CI 服务器配置应作为代码维护\n* 提供快速构建，以便开发者经常在本地运行这些测试\n\
  \n\n\n\n\n# 5 设计原则\n\n## 5.1 设计原则的目标\n\n代码必须遵循 `KISS`、`DRY` 和 `YAGNI`！\n\n* [设计原则](http://butunclebob.com/ArticleS.UncleBob.PrinciplesOfOod)\
  \ 应该引导良好的面向对象设计。\n* 代码和架构异味（smells）是基于对公认设计原则的违反。\n* 提供如何修复代码和架构异味的重要信息。\n* 如果能识别出被违反的设计原则，它为系统可能更好的结构提供了首要线索。\n\
  * 由 Robert C. Martin、Bertrand Meyer 和 Barbara Liskov 等人发布并传播。\n\n## 5.2 设计原则概览\n\
  \n![](img/images----Design-Principles-Overview.png)\n\n设计原则概览\n\n### SOLID 原则\n\n\
  * `SOLID` 缩写是由 Robert C. Martin 为这一组原则创建的。\n* 根据 Robert C. Martin 的观点，应用这些原则可以提高软件的可维护性，从而延长软件的使用寿命。\n\
  * 处理如何将类组合成模块和包的问题。\n* 实现模块内部的高内聚和模块之间的低耦合。\n\n![](img/images----SOLID.png)\n\n\
  SOLID 设计原则\n\n### 封装原则 - 内聚\n\n![](img/images----Packaging-Principles-Cohesion.png)\n\
  \n封装原则 - 内聚\n\n### 封装原则 - 耦合\n\n![](img/images----Packaging-Principles-Coupling.png)\n\
  \n封装原则 - 耦合\n\n### 进一步的设计原则\n\n![](img/images----Packaging-Principles-Other.png)\n\
  \n进一步的设计原则\n\n## 5.3 SOLID 原则\n\n### 5.3.1 [单一职责原则](https://drive.google.com/file/d/0ByOwmqah_nuGNHEtcU5OekdDMkk/view)\n\
  \n一个类应该且只有一个变化的理由。\n\n* 每个类都只定义了一个任务要完成。\n* 类应该只包含直接有助于完成该任务的函数。\n* 编写永远不需要更改的类的简单方法之一是编写只服务于单一目的的类。\n\
  * 每个类应该实现一组一致且相关的函数。\n* 在类中拥有多个职责会导致紧耦合，并导致脆弱的设计。\n* 遵循单一职责原则是反复问自己：类的每个方法和过程是否与该类的名称直接相关。\n\
  * 对于与类名匹配的方法，将这些方法移动到其他类中。\n\n#### 5.3.1.1 示例：[`Modem`](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/srp/modem)\n\
  \n**不合规范的代码示例**\n\n![](img/images----SRP1.png)\n\n```\n1 public interface Modem\
  \ {\n2     // 连接管理职责\n3     void dial(String phoneNumber);\n4     void hangup();\n\
  5 \n6     // 数据管理职责\n7     void send(char c);\n8     char receive();\n9 }\n```\n\
  糟糕的代码\n\n**合规范的解决方案**\n\n![](img/images----SRP2.png)\n\n```\n1 public interface\
  \ DataChannel {\n2     void send(char c);\n3     char receive();\n4 }\n```\n良好的代码\n\
  \n```\n1 public interface Connection {\n2     void dial(String phoneNumber);\n3\
  \     void hangup();\n4 }\n```\n良好的代码\n\n```\n 1 public class Modem implements Connection,\
  \ DataChannel {\n 2     private final Connection connection;\n 3     private final\
  \ DataChannel dataChannel;\n 4 \n 5     public Modem(Connection connection, DataChannel\
  \ dataChannel) {\n 6          this.connection = connection;\n 7          this.dataChannel\
  \ = dataChannel;\n 8     }\n 9 \n10     @Override\n11     public void dial(String\
  \ phoneNumber) {\n 12          this.connection.dial(phoneNumber);\n 13     }\n 14\
  \ \n15     @Override\n16     public void hangup() {\n 17          this.connection.hangup();\n\
  \ 18     }\n 19 \n20     @Override\n21     public void send(char c) {\n 22     \
  \     this.dataChannel.send(c);\n 23     }\n 24 \n25     @Override\n26     public\
  \ char receive() {\n 27          return this.dataChannel.receive();\n 28     }\n\
  \ 29 }\n```\n良好的代码\n\n#### 5.3.1.2 示例：[`Book`](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/srp/book)\n\
  \n**不合规范的代码示例**\n\n```\n 1 public final class Book {\n 2 \n 3     private final\
