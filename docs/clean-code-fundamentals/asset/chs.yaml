  \        managers.add(manager);\n    }\n}\n```\n\n坏代码\n\n**合规解决方案** (resources/images----OCP4.png)\n\
  \n```java\npublic interface Employee {\n    void signContract();\n}\n```\n\n良好的代码\n\
  \n```java\npublic class Developer implements Employee {\n    public void signContract()\
  \ {}\n}\n```\n\n良好的代码\n\n```java\npublic class Manager implements Employee {\n \
  \   public void signContract() {}\n}\n```\n\n良好的代码\n\n```java\npublic class Secretary\
  \ implements Employee {\n    public void signContract() {}\n}\n```\n\n良好的代码\n\n\
  ```java\npublic class HumanResourceDepartment {\n    private final List<Employee>\
  \ employees;\n\n    public HumanResourceDepartment() {\n        employees = new\
  \ ArrayList<>();\n    }\n\n    public void hire(Employee employee) {\n        employee.signContract();\n\
  \        employees.add(employee);\n    }\n}\n```\n\n良好的代码\n\n#### 5.3.2.4 示例：[`Calculator`](https://github.com/mnhock/swcs/tree/master/swcs-dp/src/main/java/swcs/dp/ocp/calculator)\n\
  \n**不符合规范的代码示例**\n\n```java\npublic class Calculator {\n    public double calculate(double\
  \ x, double y, String operator) {\n        double result;\n\n        if (\"plus\"\
  .equals(operator)) {\n            result = x + y;\n        } else if (\"minus\"\
  .equals(operator)) {\n            result = x - y;\n        } else if (\"multiply\"\
  .equals(operator)) {\n            result = x * y;\n        } else if (\"divide\"\
  .equals(operator)) {\n            result = x / y;\n        } else {\n          \
  \  throw new IllegalArgumentException(String.format(\"Operator %s not supported!\"\
  , operator));\n        }\n\n        return result;\n    }\n}\n```\n\n坏代码\n\n**合规解决方案**\n\
  \n```java\npublic enum Operation {\n    PLUS((x, y) -> x + y),\n    MINUS((x, y)\
  \ -> x - y),\n    MULTIPLY((x, y) -> x * y),\n    DIVIDE((x, y) -> x / y);\n\n \
  \   private final DoubleBinaryOperator operator;\n\n    Operation(DoubleBinaryOperator\
  \ operator) {\n        this.operator = operator;\n    }\n\n    public double apply(double\
  \ x, double y) {\n        return this.operator.applyAsDouble(x, y);\n    }\n}\n\
  ```\n\n良好的代码\n\n```java\npublic class Calculator {\n    public double calculate(double\
  \ x, double y, Operation operation) {\n        return operation.apply(x, y);\n \
  \   }\n}\n```\n\n### 5.3.3 [Liskov 替换原则](https://drive.google.com/file/d/0BwhCYaYDn8EgNzAzZjA5ZmItNjU3NS00MzQ5LTkwYjMtMDJhNDU5ZTM0MTlh/view)\n\
  \n*派生类必须能够其基类。*\n\n*假设 q(x) 是类型 T 的对象 x 可证明的属性。那么对于类型 S 的对象 y（其中 S 是 T 的子类型），q(y)\
  \ 也应该为真。*\n\n\n\n\n\n- 在良好的面向对象设计（OOD）中，父类与子类之间的派生关系代表了所谓的**is-a**（是一个））关系，即子类对象在类型上与父类对象兼容，并可以在任何需要父类对象的地方使用。\n\
  - 这确保了应用于子类对象的父类类型操作能够正确执行。\n-在这种情况下，将父类类型对象替换为子类类型对象总是安全的。\n- 继承时不要只关注数据，还要考虑类方法的行为。\n\
