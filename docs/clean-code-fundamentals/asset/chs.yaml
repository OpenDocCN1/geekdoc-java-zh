  \ int year;\n3 String firstName\n4 public class ConvertStrategy {}\n5 Set cars;\n\
  ```\n\n良好的代码\n\n```\n1 Customer Customer = new Customer(\"Darth Vader\");\n2 ...\n\
  3 Customer.name() // 静态访问？\n```\n\n坏代码\n\n```\n1 Customer customer = new Customer(\"\
  Darth Vader\");\n2 ...\n3 customer.name()\n```\n\n良好的代码\n\n### 3.1.2 选择具有表现力的名称并避免心理映射\n\
  \n```\n1 int d; // 生日以过的天数\n2 String n; // 用户名\n```\n\n坏代码\n\n```\n1 int daysSinceBirthday;\n\
  2 String name;\n```\n\n良好的代码\n\n### 3.1.3 使用有意义的变量名使差异清晰\n\n```\n1 public boolean\
  \ isFileOlder(File s1, File s2) {};\n2 \n3 public static String replaceFirst(String\
  \ string, Pattern pattern, String with) {};\n```\n\n坏代码\n\n```\n1 public boolean\
  \ isFileOlder(File file, File referenceFile) {};\n2 \n3 public static String replaceFirst(String\
  \ text, Pattern regex, String replacement) {};\n```\n\n良好的代码\n\n### 3.1.4 使用可发音的名称\n\
  \n```\n1 class DRcd {\n2      private int rtd;\n3      private String stna;\n4 \
  \     private LocalDateTime genymdhms;\n5      private LocalDateTime modymdhms;\n\
  6 }\n```\n\n坏代码\n\n```\n1 class Student {\n2      private int registrationId;\n\
  3      private String name;\n4      private LocalDateTime generated;\n5      private\
  \ LocalDateTime modified;\n6 }\n```\n\n良好的代码\n\n### 3.1.5 不要伤害读者\n\n我们阅读的代码比编写的代码要多，所以不要伤害读者。用有用的常量声明类变量。这样，每个字面量的值含义或意图用法就能清楚地表示出来。如果常量需要更改，则更改也局限于声明处。不需要为了这个字面量去搜索并修改代码。\n\
  \n```\n1 // 86400000 是什么？\n2 setTokenTimeout(86400000);\n```\n\n坏代码\n\n```\n1 private\
  \ static final int MILLISECONDS_IN_A_DAY = 24 * 60 * 60 * 1000;\n2 \n3 setTokenTimeout(MILLISECONDS_IN_A_DAY);\n\
  ```\n\n良好的代码\n\n```\n 1 public final class Sphere {\n 2 \n 3     private Sphere()\
  \ {\n 4     }\n 5 \n 6     public static double area(double radius) {\n 7      \
  \   return 3.14 * radius * radius;\n 8     }\n 9 \n10     public static double volume(double\
  \ radius) {\n11         return 4.19 * radius * radius * radius; // 为什么是 4.19？\n\
  12     }\n13 }\n```\n\n坏代码\n\n```\n 1 public final class Sphere {\n 2 \n 3     private\
  \ Sphere() {\n 4     }\n 5 \n 6     public static double area(double radius) {\n\
  \ 7         return Math.PI * radius * radius;\n 8     }\n 9 \n10     public static\
  \ double volume(double radius) {\n11         return 4.0 / 3.0 * Math.PI * radius\
  \ * radius * radius;\n12     }\n13 }\n```\n\n良好的代码\n\n### 3.1.6 不要添加冗余的上下文\n\n```\n\
  1 class CarData {\n2      private String carManufacturer;\n3      private String\
  \ carModel;\n4 }\n```\n\n坏代码\n\n```\n1 class Car {\n2      private String manufacturer;\n\
  3      private String model;\n4 }\n```\n\n良好的代码\n\n```\n 1 public interface UserRepository\
