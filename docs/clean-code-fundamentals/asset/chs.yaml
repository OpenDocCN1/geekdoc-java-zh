  \ 7             response.closeAll();\n 8         } catch (Exception e1) {\n 9  \
  \           // 谁在乎！？\n10         }\n 11     }\n12 }\n```\n\n### Bad code\n\n- 这些注释太啰嗦了，我们学会了忽略它们。\n\
  \n- 当我们阅读代码时，眼睛直接跳过它们。\n\n- 在某个时刻，当周围的代码改变时，注释就开始说谎了。\n\n### 3.2.6 位置标识符\n\n```\n\
  1 // 方法 //////////////////////////////////////\n```\n\n### Bad code\n\n```\n1 //################################################\n\
  2 //###   getter 和 setter\n3 //################################################\n\
  ```\n\n### Bad code, 在真实项目中的\n\n### 3.2.7 记记与随笔备注\n\n```\n1 // 由 Bad Programmer\
  \ 添加\n```\n\n### Bad code\n\n- 这些信息可以在版本管理系统中看到。\n\n### 3.2.8 不要在代码库中留下注释掉的代码\n\n\
  ```\n 1 public static String extension(String filename) {\n 2    // if (filename\
  \ == null) { return null; }\n 3 \n 4    String name = new File(filename).getName();\n\
