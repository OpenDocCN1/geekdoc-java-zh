  13         this.street = street;\n14     }\n15 \n16     public String city() {\n\
  17         return this.city;\n18     }\n19 \n20     public void city(String city)\
  \ {\n21         this.city = city;\n22     }\n23 \n24     public String street()\
  \ {\n25         return this.street;\n26     }\n27 \n28     public void street(String\
  \ street) {\n29         this.street = street;\n30     }\n31 \n32     // 拷贝工厂\n33\
  \     public static Address newInstance(Address address) {\n34         return new\
  \ Address(address.city(), address.street());\n35     }\n36 }\n```\n\nAddress\n\n\
