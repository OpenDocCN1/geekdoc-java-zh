- md: "\n- BooleanExpression class, resides in javafx.beans.binding package, is an\
    \ abstract class that implements ObservableBoolean, an interface that extends\
    \ Observable<java.lang.Boolean>. Convenience methods that perform logical operations\
    \ like AND, OR, and NOT are provided in BooleanExpression class.\n(See here)\n\
    \n- Some convenience methods from BooleanExpression class:\n`BooleanBinding not()`\n\
    performs the logical NOT operation on this BooleanExpression, and returns an object\
    \ of type BooleanBinding which is a direct subclass of BooleanExpression\n\n`BooleanBinding\
    \ or(ObservableBooleanValue other)`\nperforms the logical OR operation on BooleanExpression\
    \ and the given ObservableBooleanValue, and returns an object of type BooleanBinding\
    \ which is a direct subclass of BooleanExpression\n\n(See here)\n\n- Worker<V>\
    \ is an interface resides in javafx.concurrent package, it defines common APIs\
    \ for implementation of concurrency.\n(See section Execute Slide Show on Thread)\n\
    \n- Classes for concurrency, reside in javafx.concurrent package:\n  - Task: An\
    \ abstract class implements Worker<V> interface, is a one-time Worker object.\n\
    \  - Service: An abstract class implements Worker<V> interface, is a reusable\
    \ Worker object.\n  - ScheduledService: A direct subclass of Service class, allows\
    \ specifying the duration of delay to start and restart a service automatically.\n\
    \  - WorkerStateEvent: A subclass of javafx.event.Event, defines static fields\
    \ of event type such as WORKER_STATE_CANCELLED, WORKER_STATE_FAILED, WORKER_STATE_READY,\
    \ WORKER_STATE_RUNNING, WORKER_STATE_SUCCEEDED, etc. A WorkerStateEvent occurs\
    \ when the state of a Worker is twisted.\n(See section Execute Slide Show on Thread)\n\
    \n- protected abstract V call() method, in Task class, must be overridden, invoked\
    \ when the task is executed. ([here](#) [here](#) [here](#))\n\n- protected abstract\
    \ Task<V> createTask() method, in Service class, must be overridden, invoked when\
    \ the service is started. ([here](#) [here](#) | [here](#))\n\n- Some of convenience\
    \ methods provided in Service class to register EventHandlers to handle Worker\
    \ State:\n```java\npublic void setEventHandler(EventHandler<WorkerStateEvent>\
    \ value)\npublic void setOnSucceeded(EventHandler<WorkerStateEvent> value)\npublic\
    \ void setOnFailed(EventHandler<WorkerStateEvent> value)\npublic void setOnCancelled(EventHandler<WorkerStateEvent>\
    \ value)\n```\n(See section [Configure Slide Show Service Object](#))\n\n- Worker.State,\
    \ nested class from javafx.concurrent.Worker interface, is an enumerated type\
    \ defines constants for states of a Worker, they are: CANCELLED, FAILED, READY,\
    \ RUNNING, SCHEDULED, and SUCCEEDED.\n(See [here](#) and [here](#))\n\n- Some\
    \ of methods provided in Service class, reside in javafx.concurrent package:\n\
    ```java\npublic void start()\nStart this service; a service can only be started\
    \ successfully if it is in READY state.\n\npublic void reset()\nReset this service;\
    \ the state of service is transitioned to READY state as a result.\n\nWorker.State\
    \ getState()\nDefined in Worker interface, get the value of state property which\
    \ represents the current state of the Worker.\n\npublic boolean cancel()\nDefined\
    \ in Worker interface, cancel this service, return true if the service is cancelled\
    \ successfully.\n```\n(See section [Implement Event Handlers of Action Events\
    \ for Start Slideshow and Stop Slideshow Menu Items](#))\n\n- Some of classes\
    \ from javafx.animation package for conducting transition\n\n![](img/27e7b2efbff71bf5e123da46e585606e_193_0.png)\n\
    \nanimations of fade in and fade out effects between slides in parallel:\n| Animation\
    \ | Transition |\n| :--- | :--- |\n| | FadeTransition |\n| | ParallelTransition\
    \ |\n(See section Add Fade Transition between Slides)\n\n- javafx.util.Duration\
    \ class, implements java.lang.Comparable<Duration>, holds the duration of time.\
    \ (See here)\n\n- public void playFromStart() method, provided in Animation class,\
    \ plays an animation from the starting position. (See here)\n\n# EPILOGUE\n\n\
    The authors are working on the rest of volumes of this book series, to be released\
    \ one by one soon. Let's have a sneak peek of coming features besides others revealed\
    \ in the PREFACE section:\n\n- More interactive sketching tools: Free Hand Drawer,\
    \ Rubber Band Drawer, Text Writer, Color Gradienter, Arc Drawer, Cursor Key Mover,\
    \ etc.\n- Color palette tools\n- Image clipping tools\n- Path transition animater\n\
    - Dynamic context menu controller\n- And more...\n\nWish you a happy, healthy,\
    \ and prosperous year of the Monkey.\n"
  mdcn: "\n\n- `BooleanExpression` 类位于 `javafx.beans.binding` 包中，是一个实现 `ObservableBoolean`\
    \ 的抽象类，`ObservableBoolean` 是扩展了 `Observable<java.lang.Boolean>` 的接口。`BooleanExpression`\
    \ 类提供了如 AND、OR 和 NOT 等逻辑操作的便利方法。\n（[此处](#)\n\n- `BooleanExpression` 类的一些便利方法：\n\
    `BooleanBinding not()`\n对此 `BooleanExpression` 执行逻辑 NOT 操作，并返回一个 `BooleanBinding`\
    \ 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n\n`BooleanBinding or(ObservableBooleanValue\
    \ other)`\n对 `BooleanExpression` 和给定的 `ObservableBooleanValue` 执行逻辑 OR 操作，并返回一个\
    \ `BooleanBinding` 类型的对象，该对象是 `BooleanExpression` 的直接子类。\n\n（[此处](#)\n\n- `Worker<V>`\
    \ 是一个位于 `javafx.concurrent` 包的接口，它定义了并发实现的通用 API。\n（参见“在线程上执行幻灯片”章节）\n\n- 并发类位于\
    \ `javafx.concurrent` 包中：\n  - Task: 一个实现 `Worker<V>` 接口的抽象类，是一个单次使用的 Worker 对象。\n\
    \  - Service: 一个实现 `Worker<V>` 接口的抽象类，是一个可重用的 Worker 对象。\n  - ScheduledService:\
    \ `Service` 类的直接子类，允许指定延迟时长以自动启动和重启服务。\n  - WorkerStateEvent: `javafx.event.Event`\
    \ 的子类，定义了事件类型的静态字段，例如 `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
    \ 等。当 Worker 的状态发生变化时会触发 `WorkerStateEvent`。\n（参见“在线程上执行幻灯片”章节）\n\n- `Task` 类中的\
    \ `protected abstract V call()` 方法必须被重写，在任务执行时调用。（[此处](#) [此处](#) [此处](#) ）\n\n\
    - `Service` 类中的 `protected abstract Task<V> createTask()` 方法必须被重写，在服务启动时调用。（[此处](#)\
    \ [此处](#) | [此处](#) ）\n\n- `Service` 类提供了一些用于注册 EventHandler 以处理 Worker 状态的方法：\n\
    ```java\npublic void setEventHandler(EventHandler<WorkerStateEvent> value)\npublic\
    \ void setOnSucceeded(EventHandler<WorkerStateEvent> value)\npublic void setOnFailed(EventHandler<WorkerStateEvent>\
    \ value)\npublic void setOnCancelled(EventHandler<WorkerStateEvent> value)\n```\n\
    （参见章节 [配置幻灯片服务对象](#)）\n\n- `Worker.State` 是 `javafx.concurrent.Worker` 接口的嵌套类，是一个枚举类型，定义了\
    \ Worker 状态的常量，它们是：`CANCELLED`、`FAILED`、`READY`、`RUNNING`、`SCHEDULED` 和 `SUCCEEDED`。\n\
    （参见 [此处](#) 和 [此处](#)）\n\n- `Service` 类中提供的一些方法：\n```java\npublic void start()\n\
    启动此服务；只有当服务处于 READY 状态时才能成功启动。\n\npublic void reset()\n重置此服务；结果服务的状态将转换到 READY\
    \ 状态。\n\nWorker.State getState()\n定义在 Worker 接口中，获取状态属性的值，该值代表 Worker 的当前状态。\n\
    \npublic boolean cancel()\n定义在 Worker 接口中，取消此服务，如果服务取消成功则返回 true。\n```\n（参见章节\
    \ [为启动幻灯片和停止幻灯片菜单项实现动作事件的处理器](#)）\n\n- `javafx.animation` 包中用于执行切换的一些类：\n\n![](img/27e7b2efbff71bf5e123da46e585606e_193_0.png)\n\
    \n在幻灯片之间并行执行淡入和淡出效果的动画：\n| 动画 | 切换 |\n| :--- | :--- |\n| | FadeTransition |\n\
    | | ParallelTransition |\n（参见“在幻灯片之间添加淡入切换”）\n\n- `javafx.util.Duration` 类实现了\
    \ `java.lang.Comparable<Duration>`，持有持续时间。（[此处](#)）\n\n- `Animation` 类提供的 `public\
    \ void playFromStart()` 方法，从起始位置播放动画。（[此处](#)）\n\n# 结语\n\n作者正在编写该系列书籍的其他卷册，并将很快陆续发布。让我们预览一下除“前言”部分中介绍的内容之外的即将推出的特性：\n\
    \n- 更多交互绘图工具：自由手绘制器（Free Hand Drawer）、橡皮带绘制器（Rubber Band Drawer）、文本写入器（Text Writer）、颜色渐变器（Color\
    \ Gradienter）、弧绘制器（Arc Drawer）、光标移动器（Cursor Key Mover）等。\n- 色调板工具\n- 图像裁剪工具\n\
    - 路径切换动画器\n- 动态上下文控制器\n- 以及更多……\n\n祝您在猴年快乐、健康、万事如意。\n\n"
