    \nFigure 1-9. Snapshot of rendering an image scaled up to fit available viewing\
    \ space of scene height.\n\n## 1.4.2 Approach Two: Change Values for fitWidth\
    \ Property and fitHeight Property\n\nImageView class provides two properties that\
    \ allow us to scale the viewing size of image:\n\n- fitWidth\n- fitHeight\n\n\
    To change value for these two properties, we use the setFitWidth method and the\
    \ setFitHeight method.\n\nIf Fit Width viewing option is selected, the viewing\
    \ width will be set in accordance with the current width of scene. Here's snippet\
    \ of codes:\n\n**Listing 1-17.** Call setFitWidth method to set image width same\
