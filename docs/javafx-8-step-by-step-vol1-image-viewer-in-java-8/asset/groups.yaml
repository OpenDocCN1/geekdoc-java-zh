    \ 属性的值，提供当 Worker 状态变为 `SUCCEEDED` 时调用的 `handle` 方法实现。\n\n- `public final void\
    \ setOnFailed(EventHandler<WorkerStateEvent> value)`\n- 设置 `onFailed` 属性的值，提供当\
    \ Worker 状态变为 `FAILED` 时调用的 `handle` 方法实现。\n\n- `public final void setOnCancelled(EventHandler<WorkerStateEvent>\
    \ value)`\n- 设置 `onCancelled` 属性的值，提供当 Worker 状态变为 `CANCELLED` 时调用的 `handle` 方法实现。\n\
    \n`Worker.State` 是 `javafx.concurrent.Worker` 接口的一个内部类，是一个枚举类型，定义了 Worker 状态的常量，它们是：`CANCELLED`、`FAILED`、`READY`、`RUNNING`\
