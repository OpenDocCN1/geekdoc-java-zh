    Reference to Oracle Online Documentation "Skinning JavaFX Applications with CSS":

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm


    ## Creating User Interfaces using FXML


    FXML is a markup language which coincides with the XML (Extensible Markup Language)
    format, with additional rules, for creating user interfaces of JavaFX applications.
    Considering hand coding FXML is error prone, a feasible approach is to generate
    FXML codes by means of GUI builders.


    It is considered a good programming practice to separate application''s GUIs (the
    View) from its business logic (the Model). The FXML file represents the view,
    while controller is a java class which passes information between view and model.
    Constructing GUIs using FXML enables application developers to adopt the MVC (Model-View-Controller)
    architecture effectively.


    Reference to Oracle Online Documentation "JavaFX: Mastering FXML":

    http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html


    ## Appealing Capacities of Properties and Binding


    The concept of Properties featured in JavaFX follow the design conventions introduced
    in the JavaBeans component, it works well in connection with Binding mechanism,
    as providing a powerful sleek and succinct solutions to a variety of programming
    needs.


    In the JFXDrawTools application presented in this book series, we demonstrate
    the usage of Properties and Binding considerably. In the implementation of Properties
    Window, suitable UI controls, such as text field, choice box, combo box, etc.,
    are used for viewing the properties of a concerned object. Binding mechanism is
    employed to bidirectionally link the UI controls to their respective properties
    of the object, and when users changed data displayed in UI controls, the changes
    instantly reflect the corresponding properties of the related object.


    Reference to Oracle Online Documentation "JavaFX: Properties and Binding Tutorial":

    http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html


    ## Sophisticated Mechanism of Transformations and Transitions


    The JavaFX build-in capacity of transformations for nodes are so convenient for
    developing graphics packages such as graphics editors, drawing tools, image viewing
    applications, GUI builders.


    Here are the classes that have dealings with transformations: Translate, Rotate,
    Scale and Shear. They are all derived from Transform class and located in javafx.scene.transform
    package.


    The JavaFX provide concise approaches for creating animations. There are a host
    of applications in animation features, there are some cases: to draw attention
    in an alert situation, to draw objects into recycle bin during the removing operation,
    to indicate intermediate state during a data loading,...


    In the ImageViewer application presented in this book series, we apply FadeTransition
    and ParallelTransition onto image objects in a slideshow function fade the new
    and the old image simultaneously.


    Here are the classes that have dealings with transitions: FadeTransition, RotateTransition,
    ScaleTransition, TranslateTransition, FillTransition, StrokeTransition, PathTransition,
    ParallelTransition, SequentialTransition, PauseTransition. They are all derived
    from Transform class, an abstract class defines basic functionality of animations,
    and located in javafx.animation package.


    Reference to Oracle Documentation "JavaFX: Transformations, Animations, and Visual
    Effects":

    http://docs.oracle.com/javafx/8/javafx/visual-effects-tutorial/index.html


    ## 2D Geometric Primitives and Text Are JavaFX Nodes


    JavaFX provides a Shape class which extends javafx.scene.Node class and is the
    superclass of basic forms of 2D geometry. The object-oriented concept imposed
    on the geometric primitives facilitates the development of graphics applications.


    Here are classes derived from Shape class: Arc, Circle, CubicCurve, Ellipse, Line,
    Path, Polygon, Polyline, QuadCurve, SVGPath, Text. Except the Text class, all
    the others are located in javafx.scene.shape package.


    Please note that Text class, located in javafx.scene.text package, considered
    a shape as well, the development of text drawing tools. All features common to
    Java nodes can be applied to text objects. You handle it like any geometric. Text
    objects can be placed in a layout pane to utilize the automatic placement abilities,
    applying transformations and transitions, as well as customizing the presentation
    style using CSS, etc.


    Reference to Oracle Documentation "Using Text in JavaFX":

    http://docs.oracle.com/javafx/8/javafx/user-interface-tutorial/text-settings.htm


    ## Other Prominent Capabilities That Carry Out Many Complex Issues To Shorten
    Development Time


    - ImageView Class for Loading and Displaying Images

    The ImageView class which extends javafx.scene.Node is used along with Image class
    to load and display images. JavaFX also provides APIs for performing operations
    over bitmap images, PixelReader defines the interface methods to read pixels from
    an Image object, while PixelWriter defines methods to write pixels to an Image
    object. All of these are located in javafx.scene.image package.


    Reference to Oracle Documentation "Using the Image Ops API"

    http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm


    - WebView Class for Managing Web Pages

    There is a web engine embedded in JavaFX architecture and providing a set of APIs,
    located in javafx.scene.web package, for developing applications with functionality
    of a web browser. To view a page, you create a WebView object which extends javafx.scene.Parent
    and inherits all the features of a node, then obtain the WebEngine that associates
    with it. The WebEngine provides relevant methods to manipulating a web page, such
    as: loading/displaying the web page, either by given a url or content of the page,
    accessing the Document Object Model (DOM) created by WebEngine for the loaded
    web page, handling a variety of events from JavaScript,...


    Reference to Oracle Documentation "JavaFX: Adding HTML Content to JavaFX Applications"

    http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html


    - HTMLEEditor for Editing HTML Pages

    The full support of HTML editing comes from HTMLE, extends javafx.scene.control.Control,
    resides in javafx.scene.web package. To embed an HTMLEd into your JavaFX application,
    you simply create an instance of HTMLEd, add it to a scene graph, and it is ready
    to interact with users. The following two methods are useful to get and set the
    HTML content of the editor: getHTML(), setText(java.lang.String htmlText).

    Unlike the similar control TextArea handles multiple lines of plain text, the
    HTMLEd formats text that complies with HTML syntax.

    The usage of the HTML editor is widely required in various fields of software,
    for example, bloggers writing articles to post (content management system), users
    of an Email System composing messages (messaging system), online sellers preparing
    product descriptions for listing (e-commerce management system)...


    Reference to Oracle Documentation "JavaFX: Working with JavaFX UI Components —
    HTML Editor"

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.html


    - Chart Components for Rendering Data

    The following classes are located in javafx.scene.chart packages for drawing various
    types of charts:


    - AreaChart, StackedAreaChart

    - BarChart, StackedBarChart

    - BubbleChart

    - LineChart

    - PieChart

    - ScatterChart


    Chart class, the class for all chart components, extends javafx.scene.layout.Region
    class, and thus inherits all applicable features from javafx.scene.Node class.


    Reference to Oracle Online Documentation "JavaFX: Working with JavaFX UI Components
    — Working with JavaFX":

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm


    ## MediaView Class for Playing Media


    The MediaView class which extends javafx.scene.Node is used along with MediaPlayer
    and Media classes to play media in your JavaFX applications. All media related
    classes resides in javafx.scene.media package.


    Reference to Oracle Online Documentation "JavaFX: Incorporating Media Assets Into
    JavaFX Applications":

    http://docs.oracle.com/javase/8/javafx/media-tutorial/

