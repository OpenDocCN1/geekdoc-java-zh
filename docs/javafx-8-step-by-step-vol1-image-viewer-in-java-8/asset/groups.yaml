    \ are abundant and unfeasible to be managed into one book, chapters are organized\
    \ among many volumes:\n\n+   1. VOLUME I: DEVELOPING IMAGE VIEWING COMPONENTS\n\
    \   Chapter 1: Basic Image Viewer\n   Chapter 2: Enhanced Image Viewer with Browsing\
    \ Buttons\n   Chapter 3: Enhanced Image Viewer with Slide Show Capacity\n\n+ \
    \  2. VOLUME II: DEVELOPING INTERACTIVE SHAPE DRAWING TOOLS\n   Chapter 1: Line\
    \ Drawer\n      Draw lines from mouse events on a drawing board.\n   Chapter 2:\
    \ Polyline Drawer\n      Draw polylines from mouse events on a drawing board.\n\
    \   Chapter 3: Polygon Drawer\n      Draw polygons from mouse events on a drawing\
    \ board.\n   Chapter 4: Path Drawer\n      Draw paths from mouse events on a drawing\
    \ board.\n   Chapter 5: Quadratic Bézier Curve Drawer\n      Draw paths composed\
    \ of quadratic Bézier curves from mouse events on a drawing board.\n   Chapter\
    \ 6: Basic Draw Tool\n      Create integral classes in a package named drawtool\
    \ to facilitate developments of various shape drawers — Rectangle Drawer, Circle\
    \ Drawer and Ellipse Drawer.\n   Chapter 7: Enhanced Draw Tool with Predefined\
    \ Drawers\n      Enhance drawtool package and implement a variety of drawers,\
    \ reside in drawtool.drawer, containing these predefined shape drawers — LineDrawer,\
    \ PolylineDrawer, PolygonDrawer, PathDrawer, BezierCurveDrawer, RectangleDrawer,\
    \ CircleDrawer, EllipseDrawer, and ShapeMover — which are subclasses of ShapeDrawer.\n\
    \   Chapter 8: Initial JFXDrawTools Application\n      Develop initial version\
    \ of JFXDrawTools by integrating with all predefined shape drawers as well as\
    \ utilizing enhanced shape drawing APIs.\n\n+   3. VOLUME III: DEVELOPING INTERACTIVE\
    \ REGULAR POLYGON TOOLS\n   Chapter 1: Enhanced Draw Tool with Regular Polygon\
    \ Shape Capacity\n      Introduce RegularPolygon class"
