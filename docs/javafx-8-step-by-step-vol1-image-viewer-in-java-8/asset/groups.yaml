    \n```\nvoid set(T value)\n  Set the wrapped value.\n```\n(See here)\n\n# Chapter\
    \ 3\n\n## Enhanced Image Viewer with Slide Show: Capacity—Developing Image Viewer\
    \ V1.2\n\n## Preface\n\nAt this stage, the ImageView application has contained\
    \ adequate abilities as an effective image viewing tool. Based on the fundamental\
    \ structure built so far, more functionality may be incrementally developed with\
    \ ease.\n\nThis chapter features the implementation of slide show capabilities\
    \ as well as fine-tuning overall look and feel of GUIs. We will demonstrate how\
