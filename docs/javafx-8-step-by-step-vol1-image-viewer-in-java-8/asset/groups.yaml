- md: "\n## Chapter 2\n## Enhanced Image Viewer with Browsing Buttons\nDeveloping\
    \ Image Viewer V1.1\n\n## Preface\n\nIn previous chapter, we have demonstrated\
    \ the incremental development of a JavaFX application, ImageView V1.0. So far\
    \ it contains minimum capabilities, nevertheless it is a ready-to-use and convenient\
    \ accessory, easily bundled with a variety of software. Additional functions will\
    \ be added gradually throughout this chapter and the next chapter.\n\nThis chapter\
    \ features the implementation of actions as well as proper placement for two buttons,\
    \ Next and Previous, two custom-made buttons to open and view the next or previous\
    \ available image.\n\nThe version number is upgraded to 1.1. From detailed descriptions\
    \ and well-documented examples coded from ImageView V1.1, you will become familiar\
    \ with fundamental capabilities of JavaFX library recounted in the Summary section.\n\
    \nThe complete development process of ImageView V1.1 is characterized by the following\
    \ steps:\n\n- *2.1 Add Next Button*\n  - 2.1.1 Use Group as Parent Container\n\
    \  - 2.1.2 Shape Class for Rendering 2D Geometric Primitives\n  - 2.1.3 Use Rectangle\
    \ Shape as Bounding Box of Custom-Made Button\n  - 2.1.4 Paint Background and\
    \ Border of Shape\n  - 2.1.5 Set Value of arcHeight and arcWidth Properties to\
    \ Rounded Rectangle\n  - 2.1.6 Polygon Shape as Visual Sign of Next Icon\n  -\
    \ 2.1.7 Set Value of Cursor Property for Node\n  - 2.1.8 Convenience Methods to\
    \ Register Event Handlers to Handle Mouse Events\n  - 2.1.9 Complete Source Codes\
    \ of createNextButton() Method\n  - 2.1.10 Install Tooltip for Node\n- 2.2 Adjust\
    \ Next Button's Default Position in StackPane\n- 2.3 Add Previous Button and Adjust\
    \ Its Position in StackPane\n- 2.4 Implement On Mouse Clicked Event Handlers\n\
    \n- *2.4.1 Configure FileChooser*\n- 2.4.2 Create List Iterator to Iterate Existing\
    \ Files in the Current Directory\n- 2.4.3 Define Properties in ImageView Class\n\
    \n- *2.5 Complete Source Codes of Image Viewer V1.1*\n- 2.5.1 Complete Source\
    \ Codes of FileUtils Class\n- 2.5.2 Complete Source Codes of ImageView Class\n\
    \n- *2.6 Summary*\n\n## 2.1 Add Next Button\n\nInstead of using Button class from\
    \ built-in JavaFX controls, we implement our own utilities to design a custom-made\
    \ button by employing the below classes:\n\n- Group\n  Served as the parent container.\n\
    \n- Shape\n  - Rectangle\n    Served as the bounding box.\n  - Polygon\n    Served\
    \ as the visual sign of Next icon.\n\n- LinearGradient and Color\n  Paints to\
    \ fill background and to stroke border.\n\n- EventHandler and MouseEvent\n  Used\
    \ for handling mouse entering, clicking, and exiting events.\n\n### 2.1.1 Use\
    \ Group as Parent Container\n\nGroup class, resides in javafx.scene package, is\
    \ a subclass of javafx.scene.Parent. The capability of Group is straightforward.\
    \ It allows you to group various nodes together without imposing automatic layout.\
    \ The following snippet shows how to add nodes to Group:\n\n```\nGroup buttonGroup\
    \ = new Group();\nRectangle rect = new Rectangle(0, 0, 25, 35);\nPolygon polygon\
    \ = new Polygon();\nbuttonGroup.getChildren().addAll(rect, polygon);\n```\n\n\
    Learn more about the characteristics of Group in Volume II: DEVELOPING INTERACTIVE\
    \ SHAPE DRAWING TOOLS Chapter 1 Line Drawer Section 1.1.1 Add Pane as Drawing\
    \ Board in the Center of BorderPane.\n\n### 2.1.2 Use Shape Class for Rendering\
    \ 2D Geometric Primitives\n\nJavaFX provides a very enticing class, Shape, for\
    \ rendering 2D geometric primitives. It is an abstract class which extends javafx.scene.Node\
    \ and serves as the base class of some basic forms of 2D geometry. Its direct\
    \ subclasses: Arc, Circle, CubicCurve, Ellipse, Line, Path, Polygon, Polyline,\
    \ QuadCurve, Rectangle, SVGPath. The Shape class defines common properties of\
    \ 2D geometric primitives, such as fill, stroke, strokeType, strokeWidth, etc.\n\
    \nIt is very common to set value of fill and stroke properties respectively for\
    \ a shape. The setFill method is used to specify a color to render the background\
    \ of a shape, and setStroke method is used to specify a color to render the border\
    \ of a shape. Please notice the default value of fill property is null for Line,\
    \ Polyline, and Path, while Color.BLACK for the others; default value of stroke\
    \ property is Color.BLACK for Line, Polyline, and Path, while null for the others.\n\
    \nNow we'll show you how to exploit capacities of Shape to implement our custom-made\
    \ Next button.\n\n### 2.1.3 Use Rectangle Shape as Bounding Box of Custom-Made\
    \ Button\n\nHere are codes to accomplish this: a Rectangle is created using the\
    \ constructor with parameters: x, y, width and height, and proper value is set\
    \ for each desired property.\n\nListing 2-1. Create a Rectangle and set value\
    \ of these properties: fill, stroke, arcHeight, arcWidth:\n\n```\nRectangle rect\
    \ = new Rectangle(0, 0, 25, 0, 35);\nLinearGradient lg = new LinearGradient(0,\
    \ 0, 1, 0, true,\nCycleMethod.NO_CYCLE, new Stop[]{\nnew Stop(0, Color.web(\"\
    #B5173A8\")),\nnew Stop(0.6, Color.web(\"#A8B9D4\")),\nnew Stop(1, Color.web(\"\
    #87A7C6\"))\n});\nrect.setFill(lg);\nrect.setStroke(Color.web(\"#ACD7FF\"));\n\
    rect.setArcHeight(6.5);\nrect.setArcWidth(6.5));\n```\n\nThe following snapshot\
    \ shows the rendering of a Rectangle from the above codes:\n\nFigure 2-1. Snapshot\
    \ of a rounded rectangle filled with LinearGradient color.\n\n![](img/27e7b2efbff71bf5e123da46e585606e_79_0.png)\n\
    \n### 2.1.4 Paint Background of Shape\n\nLinearGradient and Color, reside in javafx.scene.paint\
    \ package, are two of direct subclasses of Paint class, the base class of colors\
    \ and gradients, for painting background and border of a Shape or a Region.\n\n\
    In Listing 2-1. we use LinearGradient to fill the background of a Rectangle. The\
    \ first 4 parameters in the constructor of LinearGradient specify coordinates\
    \ of start point and end point for processing color value: 0, 0, 1, 0.\n\n###\
    \ 2.1.5 Set Value of arcHeight and arcWidth Properties to Rounded Rectangle\n\n\
    arcHeight and arcWidth are properties defined in Rectangle class, for specifying\
    \ height and width diameters of arcs at corners corners of a rectangle. Their\
    \ default value is 0.0.\n\nThe following figure illustrates how to set correct\
    \ value for arcHeight and arcWidth properties for rendering rounded rectangles.\
    \ The circles and ellipses, overlapping with the arcs at the corner of rounded\
    \ rectangles, are for easy comparison.\n\nFigure 2-2. Snapshot of illustrations\
    \ of rounded rectangles with circles and ellipses placed at the corner of.\n\n\
    ![](img/27e7b2efbff71bf5e123da46e585606e_81_0.png)\n\n### 2.1.6 Use Polygon Shape\
    \ as Visual Sign of Next Icon\n\nInstead using image as visual sign of Next button,\
    \ a Polygon of arrow shape is instantiated. The getPoints() method is used to\
    \ obtain a list which is type of Observable<Double>, then the basic units, defined\
    \ in Collection interface, is used to manipulate the content of the list. A series\
    \ of x and y coordinates, stored in an array of Double value, are added to the\
    \ list, representing points of the Polygon.\n\nColor.WHITE, of many static fields\
    \ of type Color, defined in Color class, is the color we picked to fill the background\
    \ of the Polygon, and a dark blue color is created, using the static method Color.web,\
    \ to paint the border of the Polygon.\n"
  mdcn: "\n\n## 第 2 章\n## 带有浏览按钮的增强图像查看器\n开发 Image Viewer V1.1\n\n## 前言\n\n在上一章中，我们演示了\
    \ JavaFX 程序的增量开发——ImageView V1.0。到目前，它包含了基本的功能，尽管它是一个开箱即用且方便的配件，很容易与各种软件打包。在本章和下一章中我们将逐步添加额外的功能。\n\
    \n本章重点是动作的实现，以及两个按钮——“下一个”和“上一个”的合理布局，这两个自定义按钮用于打开并查看下一张或上一张可用图像。\n\n版本号升级到了 1.1。通过对\
    \ ImageView V1.1 代码的详细描述和文档良好的示例，你将熟悉“总结”部分中所述的 JavaFX 库的基本功能。\n\nImageView V1.1\
    \ 的完整开发过程包含以下步骤：\n\n- *2.1 添加“下一个”按钮*\n  - 2.1.1 使用 Group 作为父容器\n  - 2.1.2 使用\
    \ Shape 类渲染 2D 几何基元\n  - 2.1.3 使用 Rectangle 形状作为自定义按钮的边界框\n  - 2.1.4 绘制 Shape\
    \ 的背景和边框\n  - 2.1.5 设置圆矩形的 arcHeight 和 arcWidth 属性值\n  - 2.1.6 使用 Polygon 形状作为下一个图标的视觉标识\n\
    \  - 2.1.7 设置 Node 的 Cursor 属性值\n  - 2.1.8 用于注册事件处理器以处理鼠标事件的便利方法\n  - 2.1.9 createNextButton()\
    \ 方法的完整源码\n  - 2.1.10 为 Node 安装 Tooltip（提示框）\n- 2.2 调整“下一个”按钮在 StackPane 中的默认位置\n\
    - 2.3 添加“上一个”按钮并调整其在 StackPane 中的位置\n- 2.4 实现 On Mouse Clicked 事件处理器\n\n- *2.4.1\
    \ 配置 FileChooser*\n- 2.4.2 创建列表迭代器以遍历当前目录下的现有文件\n- 2.4.3 在 ImageView 类中定义属性\n\n\
    - *2.5 Image Viewer V1.1 的完整源码*\n- 2.5.1 FileUtils 类的完整源码\n- 2.5.2 ImageView 类的完整源码\n\
    \n- *2.6 总结*\n\n## 2.1 添加“下一个”按钮\n\n我们没有使用内置 JavaFX 控件中的 Button 类，而是通过使用以下类来实现自己的工具类来设计自定义按钮：\n\
    \n- Group\n  作为父容器。\n\n- Shape\n  - Rectangle\n    作为边界框。\n  - Polygon\n    作为“下一个”图标的视觉标识。\n\
    \n- LinearGradient 和 Color\n  用于填充背景和描边边框。\n\n- EventHandler 和 MouseEvent\n  用于处理鼠标进入、点击和离开事件。\n\
    \n### 2.1.1 使用 Group 作为父容器\n\nGroup 类位于 javafx.scene 包中，是 javafx.scene.Parent\
    \ 的子类。Group 的功能非常直观。它允许你将各种节点组合在一起，而不施加自动布局。以下代码段显示了如何将节点添加到 Group 中：\n\n```\n\
    Group buttonGroup = new Group();\nRectangle rect = new Rectangle(0, 0, 25, 35);\n\
    Polygon polygon = new Polygon();\nbuttonGroup.getChildren().addAll(rect, polygon);\n\
    ```\n\n更多关于 Group 特性的信息，请参阅卷二：《开发交互式形状绘图工具》第 1 章 Line Drawer 节 1.1.1 在 BorderPane\
    \ 中心添加 Pane 作为绘板。\n\n### 2.1.2 使用 Shape 类渲染 2D 几何基元\n\nJavaFX 提供了一个非常有吸引力的类 Shape，用于渲染\
    \ 2D 几何基元。它是一个继承自 javafx.scene.Node 的抽象类，作为某些基本 2D 几何形状的基类。它的直接子类包括：Arc, Circle,\
    \ CubicCurve, Ellipse, Line, Path, Polygon, Polyline, QuadCurve, Rectangle, SVGPath。Shape\
    \ 类定义了 2D 几何基元的通用属性，如 fill（填充）、stroke（描边）、strokeType（描边类型）、strokeWidth（描边宽度）等。\n\
    \n为形状分别设置 fill 和 stroke 属性的值是非常常见的。setFill 方法用于指定用于渲染形状背景的颜色，setStroke 方法用于指定用于渲染形状边框的颜色。请注意，Line、Polyline\
    \ 和 Path 的 fill 属性默认值为 null，而其他形状为 Color.BLACK；stroke 属性的默认值 Line、Polyline 和 Path\
    \ 为 Color.BLACK，而其他为 null。\n\n现在我们将向你展示如何利用 Shape 的能力来实现我们自定义的“下一个”按钮。\n\n###\
    \ 2.1.3 使用 Rectangle 形状作为自定义按钮的边界框\n\n以下是实现此目的的代码：使用参数 x, y, width 和 height 的构造创建一个\
    \ Rectangle，并为每个所需的属性设置正确的值。\n\n列表 2-1. 创建一个 Rectangle 并设置这些属性的值：fill, stroke,\
    \ arcHeight, arcWidth：\n\n```\nRectangle rect = new Rectangle(0, 0, 25, 0, 35);\n\
    LinearGradient lg = new LinearGradient(0, 0, 1, 0, true,\nCycleMethod.NO_CYCLE,\
    \ new Stop[]{\nnew Stop(0, Color.web(\"#B5173A8\")),\nnew Stop(0.6, Color.web(\"\
    #A8B9D4\")),\nnew Stop(1, Color.web(\"#87A7C6\"))\n});\nrect.setFill(lg);\nrect.setStroke(Color.web(\"\
    #ACD7FF\"));\nrect.setArcHeight(6.5);\nrect.setArcWidth(6.5);\n```\n\n下面的快照显示了上述代码渲染的\
    \ Rectangle：\n\n图 2-1. 填充了 LinearGradient 颜色的矩形。\n\n![](img/27e7b2efbff71bf5e123da46e58560e_79_0)\n\
    \n### 2.1.4 Shape Shape 背景\n\nLinearGradient 和 Color 位于 javafx.scene.paint 包，是\
    \ Paint 类的两个直接子类，用于绘制 Shape 或 Region 的背景和边框。\n\n在列表 2-1 中，我们使用 LinearGradient\
    \ 填充 Rectangle 的背景。LinearGradient 构造函数的前四个参数指定了处理颜色值的起点和终点坐标：0, 0, 1, 0。\n\n###\
    \ 2.1.5 设置 arcHeight 和 arcWidth 属性值为圆矩形\n\narcHeight 和 arcWidth 是 Rectangle 类中定义的属性，用于指定矩形角处弧的高度和宽度直径。它们的默认值为\
    \ 0.0。\n\n下面的图说明了如何设置 arcHeight 和 arcWidth 属性的值来渲染圆矩形。与圆矩形角处重叠的圆和椭圆是为了方便比较。\n\n\
    图 2-2. 角处放置了圆和椭圆的圆矩形说明图。\n\n![](img/27e7b2efbff71bf5e123da46e5856e_81_0)\n\n###\
    \ 2.1.6 使用 Polygon 形状作为下一个图标的视觉标识\n\n没有使用图像作为“下一个”按钮的视觉标识，而是实例化了一个箭头形状的 Polygon。使用\
    \ getPoints() 方法获取类型为 Observable<Double> 的列表，然后使用 Collection 接口定义的基本单元来操作列表的内容。存储在\
    \ Double 数组中的一系列 x 和 y 坐标被列表中，代表 Polygon 的点。\n\nColor.WHITE 是 Color 类中定义的许多类型为\
    \ Color 的静态字段，它是我们选择填充 Polygon 背景的颜色，我们使用静态方法 Color.web 创建了一个深蓝色来绘制 Polygon 的边框。\n\
    \n"
