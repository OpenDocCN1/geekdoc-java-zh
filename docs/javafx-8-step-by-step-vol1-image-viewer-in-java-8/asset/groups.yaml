    \ Snapshot of The Image Viewer in JavaFX 8.\n\n![](img/27e7b2efbff71bf5e123da46e585606e_15_0.png)\n\
    \n## Why Choose This Book\n\nThis book is for software developers who are interested\
    \ in developing GUIs using JavaFX library for rich client applications.\n\nImportant\
    \ features in JavaFX are illustrated by step-by-step development of real world\
    \ Java applications.\n\nInstructive diagrams are used to help readers capture\
    \ abstract concepts instantly. And all diagrams used in each chapter are created\
    \ using the graphics tools developed in this book series.\n\nThis book is for\
    \ you if you are:\n\n- A Java GUI programmer, novice or professional, who is new\
    \ to JavaFX.\n- A Java programmer who has preliminary knowledge of JavaFX and\
    \ would like to learn how to develop interactive sketch drawing tools.\n- A professional\
    \ software engineer who is interested in JavaFX and practical applications.\n\n\
    ## What You Need for This Book\n\nIf you want to compile and run applications,\
    \ you need to download JDK http://www.oracle.com/java/javase/downloads/index.html.\n\
    \n1. Install JDK 8.\n2. Use JavaFX 8.\n3. JavaFX 8 is part of Java™ SE Development\
    \ Kit 8 (JDK 8).\n\n## JavaFX History\n\nNow let us glance through the timeline\
    \ of JavaFX evolving history:\n\n- Chris Oliver of SeeBeyond Technology developed\
    \ a script language called F3, the acronym for Form Follows Function; it allows\
    \ developers accessing Swing classes and creating graphics user interfaces (GUIs)\
    \ for rapid development of rich internet applications.\n\n- Sun Microsystems acquired\
    \ SeeBeyond in September 2005, F3 renamed to JavaFX Script in May 2007.\n\n- In\
    \ December 2008, JavaFX 1.0 released, developers relied on JavaFX Script to develop\
    \ JavaFX applications until three years later JavaFX 2.0 released.\n\n- In January\
    \ 2010, Oracle completed the acquisition of Sun Microsystems, and continued maintaining\
    \ JavaFX.\n\n- In September 2010 JavaOne conference, Oracle announced JavaFX Script\
    \ would be discontinued.\n\n- In October 2011, JavaFX 2.0 released, developers\
    \ began to engage in standard Java language, instead of JavaFX Script, to access\
    \ APIs of JavaFX library. However, JavaFX SDK and JavaFX Runtime, in addition\
    \ to Java SE JDK and JRE, must be installed for developing and executing applications\
    \ compiled with JavaFX 2.0.\n\n- In February 2013, JavaFX 2.2.7 released, JavaFX\
    \ SDK and JavaFX Runtime are included within JDK/JRE 7. The integration of JavaFX\
    \ and JDK results in great convenience for JavaFX developers. No additional installations\
    \ are needed for JavaFX applications compiled with JDK 7 and later releases.\n\
    \n- On March 18, 2014, JavaFX 8 released as part of Java™ SE Development Kit 8\
    \ (JDK 8), a major feature release.\n\nAs of the publishing of this book on March,\
    \ 2016, the latest JDK releases are: JDK 8u66 on October 20, 2015, and JDK 8u72\
    \ on January 2016.\n\nThe schedule of general availability (GA) for JDK 9 is March\
    \ 23rd, 2017.\n"
