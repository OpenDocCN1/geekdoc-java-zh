    #436B8B\"));\n        }\n    });\n\n    // Mouse exited handler\n    // Recover\
    \ to original appearance when mouse exited\n    EventHandler<MouseEvent> exited\
    \ = new EventHandler<MouseEvent>() {\n        @Override\n        public void handle(MouseEvent\
