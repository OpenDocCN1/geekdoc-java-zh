    # ABOUT THE AUTHORS


    Shufen Kuo


    Shufen Kuo relocated to San Francisco Bay Area in summer of 1988, and has been
    a software engineer ever since. She has extensive hands-on experience with various
    platforms, from PC DOS to numerous Unix/Linux workstations, and from PC Linux
    to PC Windows.


    She started writing Java programs in 2001. She has been using Abstract Windowing
    Toolkit (AWT) and Swing, the GUI Components of Java Foundation Classes (JFC),
    to develop GUIs for her Java projects for years. And since 2012, she has immersed
    herself in JavaFX; exploring its essence inspires her to write books publicizing
    the strength of JavaFX.


    Before developing Java applications, she had more than 12 years experience in
    the development of C/C++ applications on UNIX/Linux/Solaris W system.


    Shufen Kuo got her M.S. in Computer Science from Washington State University in
