    \ open.\n\n![](img/27e7b2efbff71bf5e123da46e585606e_138_1.png)\n\n## 3.2.2 Change\
    \ Button Appearance When Mouse Is Pressed\n\nNow, we’ll change buttons’ background\
    \ paint when mouse pressed event occurred on them. In the meantime codes for creating\
