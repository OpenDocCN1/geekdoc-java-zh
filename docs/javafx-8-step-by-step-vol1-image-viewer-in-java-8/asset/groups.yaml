    +   - HBox class, of built-in JavaFX layout panes , resides in javafx.scene.layout
    package, is a direct subclass of javafx.layout.Pane, placing its children in one
    row horizontally.

    (See Add Status Bar at the Bottom of BorderPane)

    - Text class, resides in javafx.scene.text package, is one of direct subclasses
    of javafx.scene.Shape class which takes care of common needs for rendering geometric
    primitives.

    (See Add Status Bar at the Bottom of BorderPane)

    - void setPadding(Insets value) method, provided in Region class, defines the
    top, right, bottom, left padding for a region. (See here)

    - void setSpacing(double value) method, provided in HBox class, specifies the
    horizontal space between children in an HBox pane. (See here)

    - void setStyle(String value) method, provided in Node class, specifies CSS style
    for this node. (See here)

    - static Font font(java.lang.String family, FontWeight weight, double size) method
    is provided in javafx.scene.text.Font, for obtaining a font to render text. (See
    here)

    - Scene(Parent root, double width, double height, Paint fill) is one of constructors
    of Scene class for creating a Scene with the specified background color. (See
    here)

    - Some of Classes reside in javafx.beans.property package: StringProperty is an
    abstract class, derived from javafx.beans.binding.StringExpression class, implements
    Property<java.lang.String> and WritableStringValue. WritableStringValue extends
    WritableObjectValue<java.lang.String>


    SimpleStringProperty

    is derived from StringProperty class.


    (See here)


    +   - void bind(ObservableValue<? extends T> observable) method defined in Property
    interface, resides in javafx.beans.property package, to bind this property unidirectionally
    to the given ObservableValue.

    (See here | here | here)'
