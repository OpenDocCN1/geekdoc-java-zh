    参考 Oracle 在线文档“使用 CSS 为 JavaFX 应用程序皮肤”：

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm


    ## 使用 FXML 创建用户界面


    FXML 是一种标记语言，它与 XML（可扩展标记语言）格式一致，但带有额外的规则，用于创建 JavaFX 应用程序的用户界面。考虑到手动编写 FXML 容易出错，一种可行的方法是通过
    GUI 构建器生成 FXML 代码。


    将应用程序的 GUI（视图）与其业务逻辑（模型）分离来被认为是一种良好的编程实践。FXML 文件表示视图，而控制器（controller）是一个在视图和模型之间传递信息的
    Java 类。使用 FXML 构建 GUI 使得应用程序开发者能够有效地采用 MVC（模型-视图-控制器）架构。


    参考 Oracle 在线文档“JavaFX：精通 FXML”：

    http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html


    ## 属性与绑定的强大能力


    JavaFX 中引入的属性（Properties）概念遵循了 JavaBeans 组件中引入的设计规范，它与绑定（Binding）机制结合良好，为各种编程需求提供了强大、流畅且简洁的解决方案。


    在系列书籍介绍的 JFXDrawTools 应用程序中，我们演示了属性和绑定的用法。在属性窗口（Properties Window）的实现中，使用了合适的
    UI 控件（如文本字段、选择框、组合框等来查看相关对象的属性。绑定机制用于将 UI 控件与其对象的属性进行双向链接，当用户更改 UI 控件中显示的数据时，更改会立即反映在相关对象的属性上。


    参考 Oracle 在线文档“JavaFX：属性与绑定教程”：

    http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html


    ## 变换与过渡的复杂机制


    JavaFX 内置的节点变换（transforms）能力对于开发图形编辑器、绘图工具、图像查看器、GUI 构建器等图形包非常方便。


    以下是处理变换的类：Translate（移动）、Rotate（旋转）、Scale（缩放）和 Shear（倾斜）。它们都继承自 Transform 类并位于
    javafx.scene.transform 包中。


    JavaFX 为创建动画提供了简洁的方法。动画功能有很多应用场景，例如：在警报情况下引起注意、在删除操作期间将对象移入回收桶、在数据加载期间指示中间状态等等……


    在本系列介绍的 ImageViewer 应用程序中，我们将 FadeTransition（淡入过渡）和 ParallelTransition（并行过渡）应用于图像对象，在幻灯片功能中同时淡化新图像。


    以下是处理过渡（transitions）的类：FadeTransition、RotateTransition、ScaleTransition、TranslateTransition、FillTransition（填充过渡）、StrokeTransition（描边过渡）、PathTransition（路径过渡）、ParallelTransition、SequentialTransition（顺序过渡）、PauseTransition（暂停过渡）。它们都继承自
    Transform 类（一个定义了动画基本功能的抽象类），并位于 javafx.animation 包。


    参考 Oracle 文档“JavaFX：变换、动画和视觉效果”：

    http://docs.oracle.com/javafx/8/javafx/visual-effects-tutorial/index.html


    ## 2D 几何图形与文本都是 JavaFX 节点


    JavaFX 提供了一个 Shape 类，它继承自 javafx.scene.Node 类，是 2D 几何基本形状的父类。在几何图形上施加面向对象的概念有助于图形应用程序的。


    以下是派自 Shape 类的类：Arc（弧）、Circle（圆）、CubicCurve（三次曲线）、Ellipse（椭圆）、Line（线段）、Path（路径）、Polygon（多边形）、Polyline（折线）、QuadCurve（二次曲线）、SVGPath、Text（文本）。除了
    Text 类外，其他类都位于 javafx.scene.shape 包。


    请注意，位于 javafx.scene.text 包的 Text 类也被视为形状，用于开发文本绘制工具。Java 节点的所有通用特征都可以应用于文本对象。你可以像处理任何几何图形一样处理它。文本对象可以放置在布局面板中以利用自动布局能力、应用变换和过渡，并使用
    CSS 自定义呈现样式等。


    参考 Oracle 文档“在 JavaFX 中使用文本”：

    http://docs.oracle.com/javafx/8/javafx/user-interface-tutorial/text-settings.htm


    ## 其他处理许多复杂问题以缩短开发时间的其他显著功能


    - 用于加载和显示图像的 ImageView 类

    继承自 javafx.scene.Node 的 ImageView 类与 Image 类配合使用，用于加载和显示图像。JavaFX 还提供了对位图图像执行操作的
    API，PixelReader 定义了从 Image 对象读取像素的接口方法，而 PixelWriter 定义了向 Image 对象写入像素的方法。所有这些都位于
    javafx.scene.image 包中。


    参考 Oracle 文档“使用 Image Ops API”：

    http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm


    - 用于管理网页的 WebView 类

    JavaFX 架构中嵌入了一个网络引擎，并提供了一系列位于 javafx.scene.web 包的 API，用于开发具有 浏览器功能的应用程序。要查看页面，你需要创建一个继承自
    javafx.scene.Parent 并继承节点所有特征的 WebView 对象，然后获取与它关联的 WebEngine。WebEngine 提供了操纵网页的相关方法，例如：通过给定的
    url 或页面内容加载/显示网页、访问由 WebEngine 为加载的网页创建的文档对象模型 (DOM)、处理来自 JavaScript 的各种事件等等……


    参考 Oracle 文档“在 JavaFX 应用程序中添加 HTML 内容”：

    http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html


    - 用于编辑 HTML 页面的 HTMLEEditor

    对 HTML 编辑的完整支持来自 HTMLEd，它继承自 javafx.scene.control.Control，位于 javafx.scene.web
    包。要将 HTMLEd 嵌入到 JavaFX 应用程序中，只需创建 HTMLEd 实例并将其添加到场景图中，它就可以与用户交互。以下两个方法用于获取和设置编辑器的
    HTML 内容：getHTML(), setText(java.String)。

    与类似的控件 TextArea 处理多行纯文本不同，HTMLEd 处理符合 HTML 语法的文本。

    HTML 编辑器的用法在软件领域广泛需要，例如博客撰写文章（内容管理系统）、电子邮件系统编写消息（消息系统）、在线卖家准备产品描述进行列表（电子商务管理系统）……


    参考 Oracle 文档“JavaFX UI 组件：HTML 编辑器”：

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.html


    - 用于渲染数据的图表组件

    以下类位于 javafx.scene.chart 包，用于绘制各种图表：


    - AreaChart（面积图）、StackedAreaChart（堆叠面积图）

    - BarChart（柱状图）、StackedBarChart（堆叠柱状图）

    - BubbleChart（气泡图）

    - LineChart（折线图）

    - PieChart（饼图）

    - ScatterChart（散点图）


    Chart 类是所有图表组件的类，继承自 javafx.scene.layout.Region 类，因此继承了来自 javafx.scene.Node 的所有可用特征。


    参考 Oracle 在线文档“JavaFX UI 组件：使用 JavaFX”：

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm


    ## 用于播放媒体的 MediaView 类


    继承自 javafx.scene.Node 的 MediaView 类与 MediaPlayer 和 Media 类配合使用，在你的 JavaFX 应用程序中播放媒体。所有媒体相关的类位于
    javafx.scene.media 包。


    参考 Oracle 在线文档“在 JavaFX 应用程序中整合媒体资产”：

    http://docs.oracle.com/javase/8/javafx/media-tutorial/


    '
