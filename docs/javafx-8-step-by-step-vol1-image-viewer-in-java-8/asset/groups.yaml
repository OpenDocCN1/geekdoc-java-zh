- md: "\n## 3.3.2 Execute Slide Show on Another Thread\n\nIt’s a good programming\
    \ practice to delegate a long-running task to another thread so that the UI thread\
    \ (also called Java Application thread) is always responsive to user’s actions.\n\
    \njavafx.concurrent package provides classes, Task and Service both of which implement\
    \ Worker interface, for developing multi-threaded JavaFX applications with ease.\n\
    \nHere are classes for concurrency, reside in javafx.concurrent package:\n\n###\
    \ Task\n\nAn abstract class that extends java.util.concurrent.FutureTask and implements\
    \ Worker<V> interface, is a one-time Worker object, cannot be reused. It is also\
    \ a Runnable object since its superclass FutureTask implements Runnable interface.\n\
    \nBy starting executing a Task, you use either APIs from java.lang.Thread class\
    \ or APIs that are derived from Executor and ExecutorService interfaces, both\
    \ which reside in java.util.concurrent package. You create a Thread object given\
    \ a Task as parameter, and call start() method to start this thread. Or, use the\
    \ submit(Runnable task) method defined in ExecutorService to submit a task.\n\n\
    Override the call() method while creating a Task object, or creating a subclass\
    \ of Task. The call() method is invoked when a task is started.\n\n### Service\n\
    \nAn abstract class that extends java.lang.Object and implements Worker<V> interface,\
    \ a reusable Worker object. The Service class provides methods such as start(),\
    \ cancel(), reset(), and restart() to manipulate this service when needed.\n\n\
    Override the createTask() method while creating a Service object, or creating\
    \ a subclass of Service. The createTask() method is invoked when a service is\
    \ started.\n\n### ScheduledService\n\nA direct subclass of Service class, allows\
    \ specifying the duration of delay to start and restart a service automatically.\n\
    \n### WorkerStateEvent\n\nA subclass of javafx.event.Event, defines static fields\
    \ of EventTypes such as WORKER_STATE_CANCELLED, WORKER_STATE_FAILED, WORKER_STATE_READY,\
    \ WORKER_STATE_RUNNING, WORKER_STATE_SUCCEEDED, etc. A WorkerStateEvent occurs\
    \ when the state of a Worker is changed.\n\nConsider our situation: a file list\
    \ is created when a file is loaded, suppose the file list contains one or more\
    \ file(s) to view, the Start Slideshow menu item is enabled, a user can start\
    \ a slide show, cancel it while the slide show is on, and later restart it again.\
    \ To fulfill this scenario, we prefer a reusable Service object to a one-time\
    \ Task object.\n\n#### 3.3.2.1 SlideshowService Class that Extends Service Class\n\
    \nWe need to create a class that extends Service<V> class. When a Service is started,\
    \ it executes a Task. The createTask() method below must be overridden:\n\n```\n\
    protected abstract Task<V> createTask()\n```\n\nIn the createTask() method, the\
    \ call() method is overridden while a Task object is created to be returned to\
    \ the caller.\n\nThe call() method in a Task, undertakes the task of a slide show,\
    \ basically contains a while loop that loads images one by one until either one\
    \ of the following conditions becomes true: there’s no next image in the file\
    \ list, or the slide show is canceled by a user.\n\nThe following listing demonstrates\
    \ how to create a reusable SlideshowService, a subclass of Service class, to carry\
    \ on a slide show task.\n\n#### Listing 3-15. Create SlideshowService class:\n\
    \n```java\npackage imageviewer;\n\nimport java.nio.file.Path;\nimport java.util.ListIterator;\n\
    import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.property.SimpleStringProperty;\n\
    import javafx.beans.property.StringProperty;\nimport javafx.beans.value.ChangeListener;\n\
    import javafx.beans.value.ObservableValue;\nimport java.util.concurrent.Service;\n\
    import javafx.util.concurrent.Task;\nimport javafx.scene.image.Image;\n\n/**\n\
    \ * File Name: SlideshowService.java\n * (directory: ImageViewer1.2/src/example4/imageviewer/)\n\
    \ * @Author Shufen Kuo\n * */\n\npublic class SlideshowService extends Service<Void>\
    \ {\n    private ObjectProperty<Image> image;\n    private ObjectProperty<ListIterator<Path>>\
    \ iterator;\n    private StringProperty imageName;\n    private ListIterator<Path>\
    \ it;\n\n    public SlideshowService() {\n        this(new SimpleObjectProperty<ListIterator<Path>>(),\n\
    \             new SimpleObjectProperty<Image>(),\n             new SimpleStringProperty());\n\
    \    }\n\n    public SlideshowService(ObjectProperty<ListIterator<Path>> iterator,\n\
    \                             ObjectProperty<Image> image, StringProperty imageName)\
    \ {\n        this.image = image;\n        this.imageName = imageName;\n      \
    \  this.iterator = iterator;\n        this.iterator.addListener(new ChangeListener<ListIterator<Path>>()\
    \ {\n            @Override\n            public void changed(ObservableValue<?\
    \ extends ListIterator<Path>> o,\n                                ListIterator<Path>\
    \ oldVal, ListIterator<Path> newVal) {\n                it = newVal;\n       \
    \     }\n        });\n    }\n\n    public Image getImage() {\n        return image.get();\n\
    \    }\n\n    public void setImage(Image value) {\n        image.set(value);\n\
    \    }\n\n    public ObjectProperty<Image> imageProperty() {\n        return image;\n\
    \    }\n\n    public ListIterator<Path> getIterator() {\n        return iterator;\n\
    \    }\n\n    public void setListIterator(ListIterator<Path> value) {\n      \
    \  iterator.set(value);\n    }\n\n    public ObjectProperty<ListIterator<Path>>\
    \ iteratorProperty() {\n        return iterator;\n    }\n\n    public String getImageName()\
    \ {\n        return imageName.get();\n    }\n\n    public void setName(String\
    \ value) {\n        imageName.set(value);\n    }\n\n    public String imageNameProperty()\
    \ {\n        return imageName;\n    }\n\n    @Override\n    protected Task<Void>\
    \ createTask() {\n      return new Task<Void>() {\n        @Override\n       \
    \ protected Void call() {\n          if (it == null) return null;\n          while\
    \ (it.hasNext()) {\n            if (isCancelled()) {\n              updateMessage(\"\
    Cancelled\");\n              break;\n            }\n            String url = it.next().toUri().toString();\n\
    \            setImage(new Image(url));\n            setName(url.substring(url.lastIndexOf(\"\
