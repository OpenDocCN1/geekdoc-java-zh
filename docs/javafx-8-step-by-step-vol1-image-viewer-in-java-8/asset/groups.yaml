- md: "\n# Graphics Toolkit with Source Codes\n\n# JavaFX 8 Step by Step\n\n# VOLUME\
    \ I\nIMAGE VIEWER in Java 8\n\nShufen Kuo\nBing-Chao Huang\n\nOffers Reusable\
    \ Classes and Graphics Applications Including Complete Source Codes\n\n# Coding\
    \ in JavaFX\nStep by Step\nBuild Graphics Toolkit\n\nVOLUME I\nIMAGE VIEWER\n\
    in Java 8 (JDK 8u66)\n\n# Shufen Kuo\n\n# Bing-Chao Huang\n\nCopyright© 2016 Shufen\
    \ Kuo & Bing-Chao Huang.\n\nAll rights reserved.\n\nNo part of this book may be\
    \ reproduced or distributed in any form or by any means, or stored in a database\
    \ or retrieval system, without the prior written permission from the authors (Shufen\
    \ Kuo & Bing-Chao Huang), with the exception that the source codes that come with\
    \ the book may be entered and executed in a computer system for learning purpose,\
    \ but they may not be reproduced or modified for publication or commercial use\
    \ without prior written permission from the authors.\n\n# TABLE OF CONTENTS\n\n\
    - *ABOUT THE AUTHORS*\n- ACKNOWLEDGMENT\n- PREFACE\n    - How this book is organized\n\
    \    - Why Choose This Book\n    - What You Need for This Book\n- INTRODUCTION\n\
    - VOLUME 1: DEVELOPING IMAGE VIEWING COMPONENTS\n    - Chapter 1: Basic Image\
    \ Viewer\n        - 1.1 Create ImageView as Subclass of Application\n        \
    \    - 1.1.1 JavaFX Application Thread vs. Java Launcher Thread\n            -\
    \ 1.1.2 Catch Resize Event of Image Rendering Area\n        - 1.2 Create Menu\
    \ Bar\n            - 1.2.1 Add File Menu to Menu Bar\n            - 1.2.2 Select\
    \ Image File from File Open Dialog and Display Image on StackPane\n        - 1.3\
    \ Create Option Menu and View Submenu\n            - 1.3.1 Create Toggle Group,\
    \ Radio Menu Items and Add Listener for selectedToggleProperty\n        - 1.4\
    \ Implement Fit, Height and Original Size Viewing Options\n            - 1.4.1\
    \ Approach One: Bind ImageView's fitWidth/fitHeight Properties to Scene's width/height\
    \ Properties Respectively\n            - 1.4.1.1 Implement Width Viewing Option\n\
    \            - 1.4.1.2 Implement Fit Height Viewing Option\n            - 1.4.1.3\
    \ Implement Original Size Viewing Option\n            - 1.4.1.4 Complete Source\
    \ Codes of ImageView Class\n            - 1.4.2 Approach Two: Change Values for\
    \ fitWidth Property and fitHeight property\n            - 1.4.2.1 Catch Resize\
    \ Event of Scene to Adjust Viewing Size of Image\n            - 1.4.2.2 Complete\
    \ Source Codes of ImageView Class\n        - 1.5 Summary\n- Chapter 2: Enhanced\
    \ Image Viewer with Browsing Buttons\n    - 2.1 Add Next Button\n        - 2.1.1\
    \ Use Group as Parent Container\n        - 2.1.2 Use Shape Class for Rendering\
    \ 2D Primitives\n        - 2.1.3 Use Rectangle as Bounding Box of Custom-Made\
    \ Button\n        - 2.1.4 Paint Background and Border of Shape\n        - 2.1.5\
    \ Set Value of arcHeight and arcWidth Properties to Render Rounded Rectangle\n\
    \        - 2.1.6 Use Polygon Shape as Visual Sign of Next\n        - 2.1.7 Set\
    \ Value of Cursor Property for Node\n        - 2.1.8 Use Convenience Methods to\
    \ Register Event Handlers for Mouse Events\n        - 2.1.9 Complete Source Codes\
    \ of createNextButton()\n        - 2.1.10 Install Tooltip for Node\n    - 2.2\
    \ Adjust Next Button's Default Position in StackPane\n    - 2.3 Add Previous Button\
    \ and Adjust Its Position in StackPane\n    - 2.4 Implement On Mouse Clicked Event\
    \ Handlers\n        - 2.4.1 Configure FileChooser\n        - 2.4.2 Create List\
    \ Iterator to Iterate Existing Files in the Current Directory\n        - 2.4.3\
    \ Define Properties in ImageView Class\n    - 2.5 Complete Source Codes of Image\
    \ Viewer V1.1\n        - 2.5.1 Complete Source Codes of FileUtils\n        - 2.5.2\
    \ Complete Source Codes of ImageView Class\n    - 2.6 Summary\n- Chapter 3: Enhanced\
    \ Image Viewer with Slide Show Capacity\n    - 3.1 Add Status Bar at the Bottom\
    \ of Border\n        - 3.1.1 Create HBox as Status and Text Node to Show Name\n\
    \        - 3.1.2 Set Value of imageName Property\n    - 3.2 Improve Button's Reaction\n\
    \        - 3.2.1 Disable Button to Indicate No More Image\n        - 3.2.2 Change\
    \ Button Appearance When Mouse Is Pressed\n    - 3.3 Add Slide Show Capabilities\n\
    \        - 3.3.1 Add Slideshow and Stop Menu Items\n        - 3.3.2 Bind Property\
    \ of Menu Item\n        - 3.3.3 Execute Slide Show on Another Thread\n       \
    \ - 3.3.4 Create SlideshowService that Extends Service Class\n        - 3.3.5\
    \ Configure Slide Show Object\n        - 3.3.6 Implement Event Handlers of Action\
    \ for Slideshow and Stop Menu Items\n        - 3.3.7 The start(Stage) Method of\
    \ ImageView\n        - 3.3.8 Coordinate with Event Handlers of Load Item and Previous\
    \ Button\n    - 3.4 Add Fade Transition\n        - 3.4.1 Complete Source Codes\
    \ of SlideshowService\n    - 3.5 Complete Source Codes of Viewer V1\n    - 3.6\
    \ Summary\n- EPILOG\n\n# ABOUT THE AUTHORS\n\nShufen Kuo\n\nShufen Kuo relocated\
    \ to San Francisco Bay Area in summer 1988, and has been a software engineer ever\
    \ since. She started writing Java programs in 2001. She has been using Abstract\
    \ Window Toolkit (AWT) and Swing, the GUI Foundation Classes (JFC), to develop\
    \ GUIs for numerous years. And since 2012, she has immersed herself in JavaFX;\
    \ exploring its essence inspires her to write books publicizing the strength of\
    \ JavaFX.\n\nShufen Kuo got her M.S. in Computer Science from Washington State\
    \ University in 1987. Currently, she is developing Java applications with rich\
    \ GUIs using JavaFX as well as writing tutorials about coding JavaFX, utilizing\
    \ her expertise on designing object oriented graphics tools.\n\nHer publications:\n\
    - \"A Two-Step Matching Procedure,\" Pattern Recognition, 24(7), 711-716, 1991.\n\
    - \"An Improved Algorithm to Find the Length of the Longest Common Subsequence\
    \ of Strings,\" ACM SIGIR Forum, Spring/Summer 1989, Volume 23, 3-4, 89-99\n\n\
    Bing-Chao Huang\n\nBing-Chao Huang received his Ph.D. in Computer Science from\
    \ Washington State University in 1977. He completed an M.S. degree in Computer\
    \ Science from Stanford University in 1984.\n\nHis publications:\n- Algorithm\
    \ I in D.E. Knuth 's book “The Art of Computer Programming,” Volume 1 Fundamental\
    \ Algorithms, Third Edition (1997), 176-675\n- \"Fast Stable Merging and Sorting\
    \ in Constant Extra Space,\" The Computer Journal 35(1992), 643-650\n- \"Stable\
    \ Set and Multiset Operations in Optimal Time and Space,\" Information Processing\
    \ Letters 16(1991), 131-136\n- \"Stable Duplicate-Key Extraction with Optimal\
    \ Time and Space Bounds,\" Acta Informat 26(1989), 473-484\n- \"Practical In-Place\
    \ Merging,\" CACM 31(1988), 348-352\n- \"Stable Set and Multiset Operations in\
    \ Optimal Time and Space,\" Seventh ACM SIGACT-SIGMOD-SIGART Symposium on Principles\
    \ of Database Systems (1987)\n- \"Practical In-Place Merging,\" ACM-IEEE/CS Fall\
    \ Joint Computer Conference (1987)\n- \"A One-Way, Stackless Quicksort Algorithm,”\
    \ BIT 26(1986), 127-130, with D.E. Knuth\n- \"An Algorithm for Inverting A Permutation,”\
    \ Information Processing Letters 12(1981), 237-238\n\n# ACKNOWLEDGMENT\n\nSpecial\
    \ thanks to:\nDr. Tan and his family,\nmy brother-in-law Dr. Jacob Chung,\nmy\
    \ sister Dr. Shuching Chung,\nmy two cats Mimi & Maomao.\n—Shufen Kuo\n\n# PREFACE\n\
    \n# How this book is organized\n\nThis book is VOLUME I of the book series, Coding\
    \ in JavaFX Step by Step Build Graphics Toolkit. Since contents are abundant and\
    \ unfeasible to be managed into one book, chapters are organized among many volumes:\n\
    \n1. VOLUME I: DEVELOPING IMAGE VIEWING COMPONENTS\n   Chapter 1: Basic Image\
    \ Viewer\n   Chapter 2: Enhanced Image Viewer with Browsing Buttons\n   Chapter\
    \ 3: Enhanced Image Viewer with Slide Show Capacity\n\n2. VOLUME II: DEVELOPING\
    \ INTERACTIVE SHAPE DRAWING TOOLS\n   Chapter 1: Line Drawer\n      Draw lines\
    \ from mouse events on a drawing board.\n   Chapter 2: Polyline Drawer\n     \
    \ Draw polylines from mouse events on a drawing board.\n   Chapter 3: Polygon\
    \ Drawer\n      Draw polygons from mouse events on a drawing board.\n   Chapter\
    \ 4: Path Drawer\n      Draw paths from mouse events on a drawing board.\n   Chapter\
    \ 5: Quadratic Bézier Curve Drawer\n      Draw paths composed of quadratic Bézier\
    \ curves from a drawing board.\n   Chapter 6: Basic Draw Tool\n      Create integral\
    \ classes in a package named drawtool to facilitate developments of various shape\
    \ drawers — Rectangle Drawer, Circle Drawer and Ellipse Drawer.\n   Chapter 7:\
    \ Enhanced Draw Tool with Predefined Drawers\n      Enhance drawtool package and\
    \ implement a variety of drawers, reside in drawtool.drawer, containing these\
    \ predefined shape drawers — LineDrawer, PolylineDrawer, PolygonDrawer, PathDrawer,\
    \ BezierCurveDrawer, RectangleDrawer, CircleDrawer, EllipseDrawer, and ShapeMover\
    \ — which are subclasses of ShapeDrawer.\n   Chapter 8: Initial JFXDrawTools Application\n\
    \      Develop initial version of JFXDrawTools by integrating with all predefined\
    \ shape drawers as well as utilizing enhanced shape drawing APIs.\n\n3. VOLUME\
    \ III: DEVELOPING INTERACTIVE REGULAR POLYGON TOOLS\n   Chapter 1: Enhanced Draw\
    \ Tool with Regular Polygon Shape Capacity\n      Introduce RegularPolygon class\n"
  mdcn: "\n\n# 带源码的图形工具包\n\n# JavaFX 8 循序渐\n\n# 第一卷\nJava 8 图像查看器\n\nShufen Kuo\n\
    Bing-Chao Huang\n\n提供可重用类和图形应用程序，包括完整的源代码\n\n# JavaFX 编程\n循序渐\n构建图形工具包\n\n第一卷\n\
    图像查看器\n基于 Java 8 (JDK 8u66)\n\n# 郭淑 Shufen\n\n# 黄冰 Bing-Chao\n\n版权所有 © 2016 Shufen\
    \ Kuo & Bing-Chao Huang.\n\n保留所有权利。\n\n未经作者（Shufen Kuo & Bing-Chao Huang）事先书面许可，不得以任何形式或通过手段复制或分发本书的任何部分，或将其存储在数据库或检索系统中；但书中附带的源代码可以为了学习目的在计算机系统中输入和执行，但未经作者事先书面许可，不得为了出版或商业用途进行复制或修改。\n\
    \n# 目录\n\n- *作者简介*\n- 致谢\n- 前言\n    - 本书的组织结构\n    - 为什么选择这本书\n    - 本本书所需的准备\n\
    - 引言\n- 第一卷：开发图像查看组件\n    - 第1章：基础图像查看器\n        - 1.1 创建作为 Application 子类的 ImageView\n\
    \            - 1.1.1 JavaFX 应用程序线程对比 Java 启动线程\n            - 1.1.2 捕获图像渲染区域的缩放事件\n\
    \        - 1.2 创建菜单栏\n            - 1.2.1 为菜单栏添加文件菜单\n            - 1.2.2 从文件打开对话框中选择图像文件并显示在\
    \ StackPane 上上\n        - 1.3 创建选项菜单和视图子菜单\n            - 1.3.1 创建切换组、单选菜单项并为选中的ToggleProperty\
    \ 添加监听器\n        - 1.4 实现自适应、高度自适应和原始大小查看选项\n            - 1.4.1 方案一：分别将 ImageView\
    \ 的 fitWidth/fitHeight 属性绑定到 Scene 的 width/height 属性\n            - 1.4.1.1 实现宽度查看选项\n\
    \            - 1.4.1.2 实现高度自适应查看选项\n            - 1.4.1.3 实现原始大小查看选项\n       \
    \     - 1.4.1.4 ImageView 类的完整源代码\n            - 1.4.2 方案二：更改 fitWidth 属性和 fitHeight\
    \ 属性的值\n            - 1.4.2.1 捕获 Scene 的缩放事件以调整图像查看大小\n            - 1.4.2.2 ImageView\
    \ 类的完整源代码\n        - 1.5 总结\n    - 第2章：带有浏览按钮的增强图像查看器\n    - 2.1 添加“下一页”按钮\n \
    \       - 2.1.1 使用 Group 作为父容器\n        - 2.1.2 使用 Shape 类渲染 2D 原形\n         \
    \   - 2.1.3 使用 Rectangle 作为自定义按钮的边界框\n            - 2.1.4 绘制 Shape 的背景和边框\n  \
    \          - 2.1.5 设置 arcHeight 和 arcWidth 属性的值以渲染圆矩形\n            - 2.1.6 使用\
    \ Polygon Shape 作为“下一页”的视觉标识\n            - 2.1.7 为 Node 设置 Cursor 属性值\n     \
    \       - 2.1.8 使用便捷方法为鼠标事件注册事件处理程序\n            - 2.1.9 createNextButton() 的完整源代码\n\
    \            - 2.1.10 为 Node 安装工具提示\n    - 2.2 调整“下一页”按钮在 StackPane 中的默认位置\n \
    \   - 2.3 添加“上一页”按钮并调整其在 StackPane 中的位置\n    - 2.4 实现鼠标点击事件处理程序\n        - 2.4.1\
    \ 配置 FileChooser\n        - 2.4.2 创建列表迭代器以遍历当前目录下的现有文件\n        - 2.4.3 在 ImageView\
    \ 类中定义属性\n    - 2.5 图像查看器 V1.1 的完整源代码\n        - 2.5.1 FileUtils 类的完整源代码\n   \
    \     - 2.5.2 ImageView 类的完整源代码\n    - 2.6 总结\n    - 第3章：带有幻灯片功能的增强图像查看器\n   \
    \ - 3.1 在 Border 底部添加状态栏\n        - 3.1.1 创建 HBox 作为状态和文本节点以显示名称\n        - 3.1.2\
    \ 设置 imageName 属性的值\n    - 3.2 改进按钮响应\n        - 3.2.1 禁用按钮以表示没有更多图像\n       \
    \ - 3.2.2 鼠标按下时更改按钮外观\n    - 3.3 添加幻灯片功能\n        - 3.3.1 添加幻灯片和停止菜单项\n      \
    \  - 3.3.2 绑定菜单项的属性\n        - 3.3.3 在另一个线程上执行幻灯片\n        - 3.3.4 创建扩展自 Service\
    \ 类的 SlideshowService\n        - 3.3.5 配置幻灯片对象\n        - 3.3.6 实现幻灯片和停止菜单项的 Action\
    \ 的事件处理程序\n        - 3.3.7 ImageView 的 start(Stage) 方法\n        - 3.3.8 与加载项和“上一页”按钮的事件处理程序协同\n\
    \    - 3.4 添加淡入切换效果\n        - 3.4.1 SlideshowService 的完整源代码\n    - 3.5 查看器 V1\
    \ 的完整源代码\n    - 3.6 总结\n    - 结语\n\n# 作者简介\n\n郭淑 Shufen\n\n郭淑于 1988 年搬到旧金山，自那时起致力于\
    \ GUI 开发。她在 2001 年开始使用 Java 编写程序。她在 2012 年在华盛顿大学获得计算机科学硕士学位。目前她正在使用 JavaFX 编写应用程序。JavaFX\
    \ 的精髓启发了她编写了大量的 GUI 工具。\n\n黄冰 Bing-Chao Huang\n\n黄冰在 1977 年在华盛顿大学获得计算机科学博士学位。他在\
    \ 1984 年在斯坦福大学获得计算机科学硕士学位。自那时起，他一直一直在深入研究 JavaFX 并编写了大量教程。郭淑在 1987 年在华盛顿大学获得计算机科学硕士学位。自那时起她一直在使用\
    \ JavaFX 开发丰富的 GUI 应用程序。\n\n# 致谢\n\n特别感谢：\n陈博士及其家人，\n我的姐夫陈杰博士，\n我的妹妹陈淑博士，\n我的两只猫\
    \ Mimi 和 Maomao。\n——郭淑\n\n# 前言\n\n# 本书的组织结构\n\n本书是《JavaFX 循序渐构建图形工具包》系列书籍的第一卷。由于内容丰富，无法在一本书中管理，因此章节按卷组织如下：\n\
    \n1. 第一卷：开发图像查看组件\n    - 第1章：基础图像查看器\n    - 第2章：带有浏览按钮的增强图像查看器\n    - 第3章：带有幻灯片功能的增强图像查看器\n\
    \n2. 第二卷：开发交互式形状绘制工具\n    - 第1章：线条绘制器\n      在画布上通过鼠标事件绘制线条。\n    - 第2章：多线绘制器\n\
    \      在画布上通过鼠标事件绘制多线。\n    - 第3章：多边形绘制器\n      在画布上通过鼠标事件绘制多边形。\n    - 第4章：路径绘制器\n\
    \      在画布上通过鼠标事件绘制路径。\n    - 第5章：二次贝塞尔曲线绘制器\n      在画布上绘制绘制由二次贝塞尔曲线组成的路径。\n \
    \   - 第6章：基础绘制工具\n      在名为 drawtool 的包中创建积分类，以方便各种绘制器——矩形绘制器、圆形绘制器和椭圆绘制器的开发。\n\
    \    - 第7章：带有预定义绘制器的增强绘制工具\n      增强 drawtool 包并在 drawtool.drawer 中实现一系列预定义形状绘制器，包含\
    \ LineDrawer、PolylineDrawer、PolygonDrawer、PathDrawer、BezierCurveDrawer、RectangleDrawer、CircleDrawer、EllipseDrawer\
    \ 和 ShapeMover，它们都是 ShapeDrawer 的子类。\n    - 第8章：初始 JFXDrawTools 应用程序\n      通过集成所有预定义绘制器并利用增强的形状绘制\
    \ API，开发 JFXDrawTools 的初始版本。\n\n3. 第三卷：开发交互式正多边形工具\n    - 第1章：具有正多边形形状能力的增强绘制工具\n\
    \      引入 RegularPolygon 类\n\n"
