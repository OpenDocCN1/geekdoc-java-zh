    # 1.3 Create Option Menu and View Submenu


    We need an Option menu allowing a user to choose preferred viewing criteria. The
    Option Menu contains a View submenu which contains three mutually exclusive choices,
    as follows:


    Fit Width


    +   Render an image on an area by scaling fitWidth property of an ImageView, while
    preserving original width/height ratio, to fit the width of current available
    image viewing space.


    Fit Height


    +   Render an image on an area by scaling fitHeight property of an ImageView,
    while preserving original width/height ratio, to fit the height of current available
    image viewing space.


    Original Size


    +   Render an image in its original size, the outer portion of image that exceeds
    the boundary of available viewing space will be blocked. This is set as the initial
    viewing option.


    Please note that the available image viewing space is determined by current width
    and height of the application window, called a Stage, which subsequently is subject
    to the current size of a Scene, the container of a scene graph. Initially the
    scene is set to 600 pixels by 400 pixels, thus, the size of available image rendering
    space will be same as the size of the scene. After we added a menu bar at the
    top of BorderPane, which is the root node of the scene, the height of available
    image rendering space becomes height of scene minus height of menu bar, while
    the width remains the same.


    # 1.3.1 Create Toggle Group, Radio Menu Items and Add Listener for selectedToggle
    Property


    To implement mutually exclusive choices in a menu, we create RadioMenuItem objects
    and a single ToggleGroup object, then associate each RadioMenuItem to the same
    ToggleGroup.


    To watch the change of selected radio menu, we use:


    ```

    void addListener(ChangeListener<? super T> listener)

    ```


    to register a ChangeListener for selectedToggle property of ToggleGroup object.
    The following snippets of codes show how to accomplish these tasks.


