    and border of a Shape or a Region.


    In Listing 2-1. we use LinearGradient to fill the background of a Rectangle. The
    first 4 parameters in the constructor of LinearGradient specify coordinates of
    start point and end point for processing color value: 0, 0, 1, 0 means the direction
    of gradient is horizontal, starting from (0,0) to (1,0) relative to the top left
    corner of the bounding box of a node. The last parameter is an array of Stop objects,
    providing a series of colors. A Stop object is instantiated by given an offset
    value and a Color object. We pick 3 colors from the extent of blue darker blue,
    bluish white and lighter blue to render a gradient.


    There are various ways to construct a Color object, besides the constructor below:


    ```

    public Color(double red, double green, double blue, double opacity)

    ```


    In Listing 2-1. we use Color.web("#ACD7FF") to paint the border of a Rectangle.
    The static method,


    ```

    public static Color web(java.lang.String colorString)

    ```


    is one of many static methods provided in Color class for easily creating Color
    objects. These are examples of some of the supported format for the colorString
    parameter, they all create the same color


    ```

    "#5173A8"

    "0x5173A8"

    "rgb(81, 115, 168)",

    ```


    The color string "#5173A8", or "0x5173A8" is the hex representation of RGB value
    (81, 115, 168).


    A Color has a default alpha value, 1.0, representing completely opaque. You can
    explicitly specify alpha value, in the range of 0.0 to 1.0, when constructing
    a Color. An alpha value of 0.0 means the color is completely transparent. There
    are many ways to create the same color with alpha value 0.5:


    ```

    Color color = Color.rgb(81, 115, 168, 0.5);

    Color color = Color.web("#5173A8", 0.5);

    Color color = Color.web("rgba(81, 115, 168, 0.5)")

    ```


    Learn more about the topic of Color in later volumes of this book series.


