    \ second argument in newDirectoryStream method is\n* glob pattern for filtering\
    \ files matching the pattern:\n* \"*.(bmp, gif, jpeg, jpg, png)\"\n* we are only\
    \ interested in files ending with:\n* .bmp, .jpeg, .jpg and .png.\n* @param file\n\
    * @return\n* @throws IOException\n*/\n\n```\nstatic ListIterator<Path>(Path file)\
    \ throws IOException {\n    Path dir = file.getParent();\n    List<Path> list\
    \ = new ArrayList<>();\n\n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n\
    \            \"*{bmp, gif, jpeg, jpg, png}\")) {\n        for (Path entry : stream)\
    \ {\n            // ignore subdir inside dir\n            if (Files.isDirectory(entry,\
    \ LinkOption.NOFOLLOW_LINKS)) {\n                continue;\n            }\n  \
    \          list.add(entry);\n        }\n    } catch (DirectoryIOException e) {\n\
    \        throw de.getCause();\n    }\n\n// compare method in Path compares two\
    \ abstract paths lexicographical\nCollections.sort(list, new Comparator<Path>()\
