    \n## 2.1.7 设置节点的光标属性（Cursor Property）\n\n`cursor` 属性定义在 `Node` 类中，允许你更改此节点及其所有后代节点的鼠标光标。`Cursor`\
    \ 类位于 `javafx.scene` 包中并继承自 `java.lang.Object`，它以 `Cursor` 类型的静态字段定义了一些可选鼠标光标，如\
    \ `CLOSED_HAND`、`CROSSHAIR`、`DEFAULT`、`HAND`、`OPEN_HAND`、`TEXT`、`WAIT` 等。如果没有显式设置\
    \ `cursor` 属性的值，将使用箭头形状的默认鼠标光标。\n\n我们使用 `Cursor.OPEN_HAND` 作为“下一个”按钮的光标。以下是代码片段：\n\
    \n```java\nbuttonGroup = new Group();\nbuttonGroup.setCursor(Cursor.OPEN_HAND);\n\
    ```\n\n## 2.1.8 使用便捷方法注册事件处理器来处理鼠标事件\n\n`EventHandler<T extends Event>` 是一个扩展自\
    \ `java.util.EventListener` 的接口，它定义了 `handle(T event)` 方法，当指定的事件发生时会调用该方法。\n\n\
    我们将使用 `Node` 类提供的便捷方法来注册事件处理器，以处理鼠标事件的事件类型，如 `MOUSE_CLICKED`、`MOUSE_ENTERED` 和\
    \ `MOUSE_EXITED`。这些是 `MouseEvent` 类中定义的 `Types` 的静态字段，`MouseEvent` 是 `javafx.scene.input.InputEvent`\
    \ 的子类。\n\n以下是用于注册上述事件处理器的便捷方法：\n\n- * public final void setMouseClicked(EventHandler<?\
    \ super MouseEvent> value)\n  设置 `Node` 类中定义的 `MouseClicked` 属性的值，提供 `handle`\
    \ 方法的实现，当鼠标点击此节点时会调用。\n- * public final void setOnMouseEntered(EventHandler<?\
    \ super MouseEvent> value)\n  设置 `Node` 类中定义的 `OnMouseEntered` 属性的值，提供 `handle`\
    \ 方法的实现，当鼠标进入此节点时会调用。\n- * public final void setOnMouseExited(EventHandler<? super\
    \ MouseEvent> value)\n  设置 `Node` 类中定义的 `OnMouseExited` 属性的值，提供 `handle` 方法的实现，当鼠标离开此节点时会调用。\n\
