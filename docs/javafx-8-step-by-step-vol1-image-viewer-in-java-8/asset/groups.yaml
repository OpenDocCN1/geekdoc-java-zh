  - "[PAGE 24]\n\n+   * You may not add children to these nodes:\n  * The following\
    \ classes are always employed as leaf nodes: Canvas, ImageView, MediaView, and\
    \ all direct subclasses of Shape such as Rectangle, Circle, Ellipse, etc."
  - '[PAGE 25]


    # JavaFX and Swing


    Now, here is an intriguing issue. For years Java developers have been building
    GUIs of Java applications using Swing APIs, the GUI Components of Java Foundation
    Classes (JFC), why do we need JavaFX in addition to Swing?


    If you possess multitudes of legacy codes written in Swing and would like to incorporate
    JavaFX features into Swing codes, JDK 8 provides mechanism to do so, and vice
    versa, you can include Swing components in JavaFX applications.


    The topic of JavaFX-Swing Interoperability is not covered in this book. If you
    are interested in this topic, visit Oracle Online Documentation “JavaFX: Interoperability
    — JavaFX-Swing Interoperability” at:

    http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm


    JavaFX is the next generation of Java GUIs. To account for the benefits of employing
    JavaFX capabilities, besides the Interoperability between JavaFX and Swing, we
    present the significant features of JavaFX in the section below.'
  - '[PAGE 26]


    # Essence of JavaFX


    JavaFX not only allows you to create applications with visual user interfaces
    rapidly, but also contains enticing and distinctive abilities. They are enumerated
    as follows:


    # Build-in Layout Panes


    JavaFX''s layout panes are containers that automatically perform various types
    of placement on nodes. You can place any number of nodes in a layout pane, which
    is a node itself and thus can be nested in another layout pane as well. The major
    advantage of using layout panes is to avoid the tediousness of manually specifying
    size and location of each node. As these nodes in a scene graph are managed in
    a tree structure, the layout algorithm recursively computes size and location
    of each node based on its layout type and specified layout properties, and the
    re-calculation is set off dynamically as the window''s resize events.


    There are 8 types of built-in layout panes, located in javafx.scene.layout package:


    # BorderPane


    +   - An BorderPane places nodes in five locations respectively to create a classic
    look-and-feel of windows, typically the top region for a main bar or a toolbar,
    the bottom region for a status bar, left and right regions for navigation panels,
    and the center region for a working area.


    # HBox


    +   - An HBox places nodes in one row (horizontally).


    # VBox


    +   - A VBox places nodes in one column (vertically).


    # GridPane


    +   - A GridPane places nodes in a grid with multiple rows and columns. This is
    a handy user interface for displaying a series of name-value pair properties.


    # StackPane


    +   - A StackPane places all nodes in a stack with default alignment. All children
    overlap each other in the center of the container, with the later created node
    placed on top of previous ones. But you can use static methods, StackPane.setAlignment(Node
    child, Pos value) and StackPane.setMargin(Node child, Insets value), to adjust
    the mandatory position of each node.


    # FlowPane


    You can specify orientation property of a FlowPane. For a horizontal FlowPane,
    nodes are placed in rows, from left to right, wrapping at the boundary of its
    container''s width. For a vertical FlowPane, nodes are placed in columns, from
    top'
  - "[PAGE 27]\n\nto bottom, wrapping at the boundary of its container's height.\n\
    \n# TilePane\n\nA TilePane is similar to a FlowPane except each cell in the grid\
    \ of a TilePane\nhas the same size.\n\n# AnchorPane\n\nAn AnchorPane places nodes\
    \ relative to their specified anchor points, there are\nof of them: topAnchor,\
    \ rightAnchor, bottomAnchor and leftAnchor.\n\n> Reference to Oracle Online Documentation\
    \ \"Working with Layouts in JavaFX\"\nhttp://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html\n\
    \n# Customization using CSS\n\nJavaFX allows the usage of CSS (Cascading Style\
    \ Sheet) to describe the presentation\nstyles of application's user interfaces.\
    \ Defining the presentation attributes—such as color,\nfont, margins, padding,\
    \ width, height, lines, background images, etc., using CSS,\nseparated from application\
    \ click reveals convenience in many ways:\n\n+   - Customization from software\
    \ provider's:\n  Applications compiled from the same set of codes can bear a variety\
    \ of\n  presentation styles, each of them complying with different customer's\n\
    \  requirements.\n\n+   - Customization from application user's:\n  Even after\
    \ the software has been released, in case application users have\n  preferences\
    \ for the look of UIs, it is also applicable to modify the presentation\n  attributes,\
    \ defined in CSS files, at customer site.\n\n+   - Benefits for designers of presentation\
    \ styles:\n  The separation of application codes from definitions of presentation\
    \ styles\nimproves readability of code and simplifies the tasks for graphics designers\
    \ by\nfocusing on dealing with CSS only.\n\n+   - Benefits for software developers:\n\
    \  During the course of testing, developers may frequently change style attributes\n\
    \  defined in CSS file in order to evaluate the variety looks GUIs. If the application\n\
    has to quit and restart for each change, it is a very tiresome task. To facilitate\n\
    this evaluation process, the best strategy is to design a makeshift Load button,\
    \ and\n  whenever any style is changed, click on the button to re-load the CSS,\
    \ thus saving tremendous\ntime spending on testing.\n\n+   - Similarity between\
    \ CSS in JavaFX and CSS in HTML:\n  The syntax of CSS in JavaFX is as that of\
    \ CSS in HTML, thus any designer\nhas experience with CSS for browsers can do\
    \ the styling for JavaFX application's\n  UIs with little learning effort."
