    an Image object, while PixelWriter defines methods to write pixels to an Image
    object. All of these are located in javafx.scene.image package.


    Reference to Oracle Documentation "Using the Image Ops API"

    http://docs.oracle.com/javase/8/javafx/graphics-tutorial/image_ops.htm


    +   • WebView Class for Managing Web Pages

    There is a web engine embedded in JavaFX architecture and providing a set of APIs,
    located in javafx.scene.web package, for developing applications with functionality
    of a web browser. To view a page, you create a WebView object which extends javafx.scene.Parent
    and inherits all the features of a node, then obtain the WebEngine that associates
    with it. The WebEngine provides relevant methods to manipulating a web page, such
    as: loading/displaying the web page, either by given a url or content of the page,
    accessing the Document Object Model (DOM) created by WebEngine for the loaded
    web page, handling a variety of events from JavaScript,...


    Reference to Oracle Documentation "JavaFX: Adding HTML Content to JavaFX Applications"

    http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html


    +   • HTMLEEditor for Editing HTML Pages

    The full support of HTML editing comes from HTMLEd, extends javafx.scene.control.Control,
    resides in javafx.scene.web package. To embed an HTMLEd into your JavaFX application,
    you simply create an instance of HTMLEd, add it to a scene graph, and it is ready
    to interact with users. The following two methods are useful to get and set the
    HTML content of the editor: getHTML(), setText(java.lang.String htmlText).

    Unlike the similar control TextArea handles multiple lines of plain text, the
    HTMLEd formats text that complies with HTML syntax.

    The usage of the HTML editor is widely required in various fields of software,
    for example, bloggers writing articles to post (content management system), users
    of an Email System composing messages (messaging system), online sellers preparing
    product descriptions for listing (e-commerce management system)...


    Reference to Oracle Documentation "JavaFX: Working with JavaFX UI Components —
    HTML Editor"

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.html


    +   • Chart Components for Rendering Data

    The following classes are located in javafx.scene.chart packages for drawing'
  - '[PAGE 31]


    various types of charts:


    +   - AreaChart, StackedAreaChart

    - BarChart, StackedBarChart

    - BubbleChart

    - LineChart

    - PieChart

    - ScatterChart


    Chart class, the class for all chart components, extends javafx.scene.layout.Region
    class, and thus inherits all applicable features from javafx.scene.Node class.


    > Reference to Oracle Online Documentation "JavaFX: Working with JavaFX UI Components
    — Working with JavaFX":

    http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm


    # MediaView Class for Playing Media


    The MediaView class which extends javafx.scene.Node is used along with MediaPlayer
    and Media classes to play media in your JavaFX applications. All media related
    classes resides in javafx.scene.media package.


    > Reference to Oracle Online Documentation "JavaFX: Incorporating Media Assets
    Into JavaFX Applications":nhttp://docs.oracle.com/javase/8/javafx/media-tutorial/'
- md: "\n# JavaFX Fundamental UI Components\n\nIn addition to the Essence of JavaFX\
    \ described above, JavaFX provides fundamental UI components, reside in javafx.scene.control\
    \ package, and are derived from javafx.scene.control.Control class; they are called\
    \ UI controls often.\n\nHere are available UI controls, the ones that are not\
    \ marked with asterisk (*) have their resemblant counterparts in Swing:\n\n- Label,\
    \ Button, RadioButton, ToggleButton,\n- CheckBox, ChoiceBox,\n- ComboBox, ListView,\
    \ TableView,\n- TextField, TextArea, PasswordField, HTMLEEditor(*),\n- ScrollBar,\
    \ ScrollPane, Slider, ProgressBar, ProgressIndicator(*), Toolbar,\n- MenuBar,\
    \ MenuButton, SplitMenuItem(*),\n- ColorPicker, DatePicker(*), Separator, Pagination(*),\
    \ SplitPane,\nTabPane, TitledPane(*), Accordion(*), TreeView, TreeTableView(*),\
    \ Hyperlink(*).\n\nThe following UI components are usually described in the same\
    \ category with the above UI controls.\n\n- Tooltip\n  resides in javafx.scene.control\
    \ package, but is derived from javafx.scene.control.PopupControl class.\n- MenuItem,\
    \ Menu, CheckMenuItem, RadioMenuItem\n  resides in javafx.scene.control package.\
    \ The MenuItem extends java.lang.Object is the base class of the rest three.\n\
    - FileChooser\n  resides in javafx.stage package and extends java.lang.Object.\n\
    \n# Chapter 1\nBasic Image Viewer\n—Developing Image Viewer V1.0\n\n# Preface\n\
    \nIn this chapter, we'll illustrate usages of JavaFX APIs by means of step-by-step\
    \ development of an image viewing application, ImageView V1.0. From detailed descriptions\
    \ and well-documented code examples excerpted from ImageView V1.0x, you will become\
    \ familiar with fundamental capabilities of JavaFX library recounted in the Summary\
    \ section.\n\n- 1.1 Create ImageView Class as Subclass of Application\n  - 1.1.1\
    \ JavaFX Application Thread vs. Java Launcher Thread\n  - 1.1.2 Catch Resize Event\
    \ of Image Rendering Area\n\n- 1.2 Create Menu Bar\n  - 1.2.1 Add File Menu to\
    \ Menu Bar\n  - 1.2.2 Select Image File from File Open Dialog and Display Image\
    \ on StackPane\n\n- 1.3 Create Option Menu and Submenu\n  - 1.3.1 Create Toggle\
    \ Group, Radio Menu Items and Add Listener for selectedToggleProperty\n\n- 1.4\
    \ Implement Fit Width, Fit Height and Original Size Viewing Options\n  - 1.4.1\
    \ Approach One: Bind ImageView's fitWidth/fitHeight Properties to Scene’s width/height\
    \ Properties Respectively\n    - 1.4.1.1 Implement Fit Width Viewing Option\n\
    \    - 1.4.1.2 Implement Fit Height Viewing Option\n    - 1.4.1.3 Implement Original\
    \ Size Viewing Option\n    - 1.4.1.4 Implement Source Codes of ImageView Class\n\
    \  - 1.4.2 Approach Two: Change values for fitWidth Property and fitHeight property\n\
    \    - 1.4.2.1 Catch Resize Event of Scene to Adjust Viewing Size of Image\n \
    \   - 1.4.2.2 Complete Source Codes of ImageViewClass\n\n- 1.5 Summary\n\n# 1.1\
    \ Create ImageViewer Class as Subclass of Application\n\nThe graphical interfaces\
    \ of a JavaFX application are managed in hierarchical tree structure, called a\
    \ scene graph. In ImageViewer application, we employ a BorderPane as the root\
    \ node of a scene graph, and place a StackPane in the center of BorderPane as\
    \ image rendering. Both BorderPane and StackPane are among build-in layout panes,\
    \ in javafx.scene.layout package and are direct subclasses of javafx.scene.layout.Pane\
    \ class.\n\nBorderPane class allows you to create graphical user interfaces featuring\
    \ classic look-and-feel main means. In the next section you'll see a menu bar\
    \ at the top of BorderPane, and in the later a status bar at the bottom.\n\nStackPane\
    \ lays out its children in a stack, placing the later child at the top of previous\
    \ one. In ImageViewer application, since only image is viewed at one time, the\
    \ StackPane has only one child. If the size of an image is smaller than the size\
    \ of StackPane, the image is placed in the center of StackPane. If the size of\
    \ an image is larger than that of StackPane, StackPane is expanded automatically\
    \ to accommodate the whole image, and if the viewing space in the application\
    \ window is not large enough, only center portion of the image is visible by default.\
    \ Later we'll demonstrate how to avoid a StackPane being resized by its content,\
    \ here.\n\nA Scene object is created as the container of a scene graph, given\
    \ a parameter. In ImageViewer application, the root node is a BorderPane, and\
    \ initial width and height of the Scene is set to 600 pixels and 400 pixels. Both\
    \ BorderPane and StackPane are sizeable layout panes; therefore, if the application\
    \ window is dynamically resized by a user, the scene is resized and a resize event\
    \ is passed to its root node, re-calculating of the size of image rendering accordingly.\n\
    \nYou place a scene on a Stage to make it alive, using the setScene method defined\
    \ in Stage class. Stage is a direct subclass of javafx.stage.Window; it is the\
    \ top-level window of a JavaFX application.\n\nJavaFX system creates a Stage object,\
    \ referred as primary stage, and passed to the start method, an abstract method\
    \ defined in Application class. Developers can construct additional Stage objects\
    \ as needed for their applications.\n\nThe following codes demonstrate how to\
    \ create ImageViewer class\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * ImageViewer application - V1.0\n */\npublic\
    \ class ImageViewer extends Application {\n\n    @Override\n    public void start(Stage\
    \ stage) {\n        BorderPane rootPane = new BorderPane();\n        StackPane\
    \ imageArea = new StackPane();\n        rootPane.setCenter(imageArea);\n\n   \
    \     Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageViewer V1.0\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n## 1.1.1 JavaFX Application Thread vs. Java Launcher Thread\n\
    \nApplication class is the entry point of JavaFX. It defines the following significant\
    \ methods:\n\n```java\npublic void init() throws Exception;\npublic abstract void\
    \ start(Stage primaryStage) throws Exception;\npublic void stop() throws Exception;\n\
    ```\n\nThe init method, which does nothing, is called from Java thread. While\
    \ the start method, abstract and must be overridden, is called from JavaFX Application\
    \ after init method has returned. If you need to do some initial works before\
    \ start method, you can do that by overriding init method; however it is crucial\
    \ to notice that nodes that are members of scene must be accessed from JavaFX\
    \ Thread. And the construction of Scene object or Stage object must be accessed\
    \ from JavaFX Thread as well.\n\n## 1.1.2 Catch Resize Event of Image Rendering\n\
    \nFor debugging and testing purpose at this point, we register a ChangeListener\
    \ providing a changed method to be notified whenever width or height of image\
    \ area is changed when a user resizes the application window.\n\nTo register a\
    \ ChangeListener to observe change of value for a property, we use this method:\n\
    \n```java\nvoid addListener(ChangeListener<? super T> listener);\n```\n\ndefined\
    \ in javafx.beans.value.ObservableValue interface, providing implementation of\
    \ changed(ObservableValue<? extends T> observable, oldValue, T newValue) method,\
    \ to be invoked when this property's value is changed.\n\nThe same ChangeListener\
    \ is allowed to be registered to multiple ObservableValues. To avoid memory leak,\
    \ it is a good programming practice to un-register a listener when the value is\
    \ no longer needed by using removeListener(ChangeListener<? super T> listener)\
    \ method, which removes the link between an observable value and a listener.\n\
    \nStackPane inherits width and height properties from javafx.scene.layout.Region\
    \ class. Both properties are type of ReadOnlyProperty, an abstract class implements\
    \ ObservableValue. As the name reveals, ObservableValue holds a value that are\
    \ observable, you can listen to the change of value and take actions as necessary.\n\
    \nThe following code demonstrates how to resize event of image rendering area,\
    \ a StackPane placed in the center of a BorderPane.\n\nImport Statements:\n\n\
    ```java\nimport javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
    ```\n\nListing 1-2. Add listeners to width and height property of image rendering\
    \ area:\n\n```java\nimageArea.widthProperty().addListener(new ChangeListener<Object>(){\n\
    \    public void changed(ObservableValue o, Object oldVal,\n        Object newVal)\
    \ {\n        System.out.format(\"imageArea width changed from %f to %f%n\",\n\
    \            oldVal, newVal);\n    }\n});\n```\n"
  mdcn: "\n\n# JavaFX 基础 UI 组件\n\n除了上述描述的 JavaFX 核心之外，JavaFX 还提供了基础 UI 组件，它们位于 `javafx.scene.control`\
    \ 包中，并派自 `javafx.scene.control.Control` 类；它们通常被称为 UI 控件。\n\n以下是可用 UI 控件，未标记星号\
    \ (*) 的控件在 Swing 中有对应的实现物：\n\n- Label（标签）,Button（按钮）,RadioButton（单选按钮）,ToggleButton（切换按钮）,\n\
    - CheckBox（复选框）,ChoiceBox（选择框）,\n- ComboBox（组合框）,ListView（列表视图）,TableView（表格视图）,\n\
    - TextField（文本字段）,TextArea（文本区域）,PasswordField（密码字段）,HTMLEEditor(*)\n- ScrollBar（滚动条）,ScrollPane（滚动面板）,Slider（滑动条）,ProgressBar（进度条）,ProgressIndicator（进度指示器*）,Toolbar（工具栏）,\n\
    - MenuBar（菜单栏）,MenuButton（菜单按钮）,SplitMenuItem（分割菜单项）\n- ColorPicker（颜色选择器）,DatePicker（日期选择器*）,Separator（分隔符）,Pagination（分页器*）,SplitPane（分割面板）,\n\
    TabPane（选项卡面板）,TitledPane（标题面板*）,Accordion（手风琴组件*）,TreeView（树视图）,TreeTableView（树表格*）,Hyperlink（超链接*）。\n\
    \n以下 UI 组件通常与上述 UI 控件属于同一类别。\n\n- Tooltip（工具提示）\n  位于 `javafx.scene.control` 包，但派自\
    \ `javafx.scene.control.PopupControl` 类。\n- MenuItem（菜单项）,Menu（菜单）,CheckMenuItem（复选菜单项）,RadioMenuItem（单选菜单项）\n\
    \  位于 `javafx.scene.control` 包。`MenuItem` 派自 `java.lang.Object` 是另外三者的基类。\n- FileChooser（文件选择器）\n\
    \  位于 `javafx.stage` 包并派自 `java.lang.Object`。\n\n# 第 1 章\n基础图像查看器\n——开发图像查看器 V1.0\n\
    \n# 前言\n\n在本章中，我们将通过分步开发一个图像查看器应用程序（ImageView V1.0）来演示 JavaFX API 的用法。通过从 ImageView\
    \ V1.0x 中提取的详细描述和文档良好的代码示例，你将熟悉“总结”部分中所述的 JavaFX 库的基础功能。\n\n- 1.1 创建 Application\
    \ 的子类 ImageView 类\n  - 1.1.1 JavaFX 线程与 Java 启动线程\n  - 1.1.2 捕获图像渲染区域的调整事件\n\n\
    - 1.2 创建菜单栏\n  - 1.2.1 向菜单栏添加文件菜单\n  - 1.2.2 从文件打开对话框选择图像文件并在 StackPane 上显示图像\n\
    \n- 1.3 创建选项菜单和子菜单\n  - 1.3.1 创建 ToggleGroup（切换组）、单选菜单项并为选中的 selectedToggleProperty\
    \ 添加监听器\n\n- 1.4 实现自适应宽度、自适应高度和原始尺寸查看选项\n  - 1.4.1 方法一：分别将 ImageView 的 fitWidth/fitHeight\
    \ 属性绑定到 Scene 的 width/height 属性上\n    - 1.4.1.1 实现自适应宽度查看选项\n    - 1.4.1.2 实现自适应高度查看选项\n\
    \    - 1.4.1.3 实现原始尺寸查看选项\n    - 1.4.1.4 实现 ImageView 类的源码\n  - 1.4.2 方法二：更改 fitWidth\
    \ 属性和 fitHeight 属性的值\n    - 1.4.2.1 捕获 Scene 的调整事件以调整图像的显示大小\n    - 1.4.2.2 完成\
    \ ImageView 类的源码\n\n- 1.5 总结\n\n# 1.1 创建 Application 的子类 ImageView 类\n\nJavaFX\
    \ 应用程序的图形界面在分级树结构中管理，称为场景图（scene graph）。在 ImageViewer 应用程序中，我们使用 BorderPane 作为场景图的根节点，并将\
    \ StackPane 放在 BorderPane 的中心作为图像渲染区域。BorderPane 和 StackPane 都是内置布局面板，位于 `javafx.scene.layout`\
    \ 包中，并是 `javafx.scene.layout.Pane` 类的直接子类。\n\nBorderPane 类允许你创建具有经典外观和主布局方式的图形用户界面。在下一节中，你将看到\
    \ BorderPane 顶部的菜单栏，稍后会在底部状态栏。\n\nStackPane 将其子元素堆叠布局，将后一个子元素放置在前一个元素之上。在 ImageViewer\
    \ 应用程序中，由于一次只查看图像，因此 StackPane 只有一个子元素。如果图像的大小小于 StackPane 的大小，则图像被放置在 StackPane\
    \ 的中心。如果图像的大小大于 StackPane，则 StackPane 将自动扩展以容纳整个图像，如果应用程序窗口中的查看空间不够，默认只能看到图像的中心部分。稍后我们在这里演示如何避免\
    \ StackPane 被内容重新调整大小。\n\nScene 对象根据给定参数被创建为场景图的容器。在 ImageViewer 应用程序中，根节点是 BorderPane，Scene\
    \ 的初始宽度和高度设置为 600 像素和 400 像素。BorderPane 和 StackPane 都是可调整大小的布局面板；因此，如果用户动态调整应用程序窗口的大小，场景将调整大小并将调整事件传递给其根节点，相应地重新计算图像渲染的大小。\n\
    \n使用 Stage 类中定义的 `setScene` 方法将场景置于 Stage 上以使其运行。Stage 是 `javafx.stage.Window`\
    \ 的直接子类；它是 JavaFX 应用程序的顶层窗口。\n\nJavaFX 系统会创建一个 Stage 对象（称为主阶段 primary stage），并传递给\
    \ `start` 方法，这是 `Application` 类中定义的抽象方法。开发者可以根据需要为应用程序构建额外的 Stage 对象。\n\n以下代码演示了如何创建\
    \ ImageViewer 类\n\n```java\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * ImageViewer 应用程序 - V1.0\n */\npublic class\
    \ ImageViewer extends Application {\n\n    @Override\n    public void start(Stage\
    \ stage) {\n        BorderPane rootPane = new BorderPane();\n        StackPane\
    \ imageArea = new StackPane();\n        rootPane.setCenter(imageArea);\n\n   \
    \     Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageViewer V1.0\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n## 1.1.1 JavaFX 线程与 Java 启动线程\n\nApplication 类是 JavaFX 的入口点。它定义了以下重要方法：\n\
    \n```java\npublic void init() throws Exception;\npublic abstract void start(Stage\
    \ primaryStage) throws Exception;\npublic void stop() throws Exception;\n```\n\
    \n`init` 方法不执行操作，从 Java 线程调用。而 `start` 方法是抽象的且必须重写，它在 `init` 方法返回后从 JavaFX 线程调用。如果你需要在\
    \ `start` 方法之前执行一些工作，可以通过重写 `init` 方法来实现；但至关重要的是，场景成员的节点必须从 JavaFX 线程访问。此外，Scene\
    \ 对象或 Stage 对象的构造也必须从 JavaFX 线程访问。\n\n## 1.1.2 捕获图像渲染的调整事件\n\n出于调试和测试目的，我们在此注册了一个\
    \ ChangeListener，每当用户调整应用程序窗口导致图像区域的宽度或高度发生变化时，就会通知提供的 `changed` 方法。\n\n要注册 ChangeListener\
    \ 来观察属性值的变化，我们使用此方法方法：\n\n```java\nvoid addListener(ChangeListener<? super T>\
    \ listener);\n```\n\n该方法定义在 `javafx.beans.value.ObservableValue` 接口中，提供了 `changed(ObservableValue<?\
    \ extends T> observable, oldValue, T newValue)` 方法实现，当此属性的值发生变化时调用。\n\n同一个 ChangeListener\
    \ 允许注册到多个 ObservableValues。为了避免内存泄漏，当值不再需要时，使用 `removeListener(ChangeListener<?\
    \ super T> listener)` 方法取消监听器是一种良好的编程习惯，该方法会移除可观测值与监听器之间的链接。\n\nStackPane 从 `javafx.scene.layout.Region`\
    \ 类继承了宽度和高度属性。这两个属性的类型都是 `ReadOnlyProperty`，它是一个实现 `ObservableValue` 的抽象类。正如名称所示，`ObservableValue`\
    \ 持有一个可观察的值，你可以监听值的变化并根据需要采取行动。\n\n以下代码演示了如何处理图像渲染区域的调整事件，该 StackPane 位于 BorderPane\
    \ 的中心。\n\n导入语句：\n\n```java\nimport javafx.beans.value.ChangeListener;\nimport\
    \ javafx.beans.value.ObservableValue;\n```\n\n列表 1-2. 为图像渲染区域的宽度和高度属性添加监听器：\n\n\
    ```java\nimageArea.widthProperty().addListener(new ChangeListener<Object>(){\n\
    \    public void changed(ObservableValue o, Object oldVal,\n        Object newVal)\
    \ {\n        System.out.format(\"imageArea width changed from %f to %f%n\",\n\
    \            oldVal, newVal);\n    }\n});\n```\n\n"
