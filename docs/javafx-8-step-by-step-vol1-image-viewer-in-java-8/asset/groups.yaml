    \ fitHeight, original);\n```\n\n```\n// Set Original Size as default choice\n\
    original.setSelected(true);\n```\n\n```\n// Add option menu to menu bar\nmenuOption.getItems().add(menuView);\n\
    menuBar.getMenus().add(menuOption);\n```"
