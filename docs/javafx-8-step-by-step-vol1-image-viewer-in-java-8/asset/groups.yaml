    \ 3.5 图像查看器 V.2\n  - 3.6 总结\n\n**图 1.** JavaFX 8 的快照。![](img/27b2ef71bf5e12345615)\n\
    \n## 为什么选择这本书\n\n本书适用于希望使用 JavaFX 开发丰富功能应用程序的开发者。书中通过由浅入深的图解展示了 JavaFX 的重要特性。\n\
    \n如果你是以下人员，本书非常适合你：\n\n- Java GUI 程序员，初学者或专业人士。\n- 具备 JavaFX 基础知识并想学习开发交互式 Java\
    \ 工具。\n- 对 JavaFX 应用感兴趣的软件工程师。\n\n## 本书所需的环境\n\n如果你想编译和运行应用程序，需要下载 http://www.oracle.com/java/javase/index.html。\n\
    \n1. 安装 JDK 8。\n2. 使用 JavaFX 8。\n3. JavaFX 8 是 Java SE 开发包（JDK 8）的一部分。\n\n## JavaFX\
    \ 历史\n\n现在让我们回顾 JavaFX 的演进时间线：\n\n- SeeBeyond Technology 的 Chris Oliver 开发了一种名为\
    \ F3 的脚本语言，它是“形式跟随功能”（Form Follows Function）的缩写；它允许开发者访问 Swing 类并创建图形界面（GUI），用于快速开发互联网应用程序。\n\
    \n- Sun Microsystems 在 2005 年 9 月收购了 SeeBeyond，F3 在 2007 年 5 月更名为 JavaFX Script。\n\
    \n- 2008 年 12 月，JavaFX 1.0 发布，开发者依靠 JavaFX Script 开发应用程序，直到三年后 JavaFX 2.0 发布。\n\
    \n- 2010 年 1 月，Oracle 完成对 Sun Microsystems 的收购并继续维护 JavaFX。\n\n- 2010 年 9 月 JavaOne\
    \ 大会上，Oracle 宣布停止 JavaFX Script。\n\n- 2011 年 10 月，JavaFX 2.0 发布，开发者开始使用标准 Java\
    \ 语言而非 JavaFX Script 来访问 JavaFX 库 API。然而，编译和运行使用 JavaFX 2.0 的应用程序除了 Java SE JDK\
    \ 和 JRE 之外，还需要安装 JavaFX SDK 和 JavaFX Runtime。\n\n- 2013 年 2 月，JavaFX 2.2.7 发布，JavaFX\
    \ SDK 和 JavaFX Runtime 包含在 JDK/JRE 7 中。JavaFX 与 JDK 的集成为 JavaFX 开发者带来了极大便利。使用\
    \ JDK 7 及更高版本编译的 JavaFX 应用程序不再需要额外安装。\n\n- 2014 年 3 月 18 日，JavaFX 8 作为 Java™ SE\
    \ 开发包（JDK 8）的一部分发布，这是一个重大版本更新。\n\n"
