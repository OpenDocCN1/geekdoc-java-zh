    # 3.3.2 Execute Slide Show on Another Thread


    It’s a good programming practice to delegate a long-running task task to another
    thread so that the UI thread (also called Java Application thread) is always responsive
    to user’s actions.


    javafx.concurrent package provides classes, Task and Service both of which implement
    Worker interface, for developing multi-threaded JavaFX applications with ease.


    Here are classes for concurrency, reside in javafx.concurrent package:


    # Task


    An abstract class that extends java.util.concurrent.FutureTask and implements
    Worker<V> interface, is a one-time Worker object, cannot be reused. It is also
    a Runnable object since its superclass FutureTask implements Runnable interface.


    By starting executing a Task, you use either APIs from java.lang.Thread class
    or APIs that are derived from Executor and ExecutorService interfaces, both which
    reside in java.util.concurrent package. You create a Thread object given a Task
    as parameter, and call start() method to start this thread. Or, use the submit(Runnable
    task) method defined in ExecutorService to submit a task.


    Override the call() method while creating a Task object, or creating a subclass
    of'
  - '[PAGE 151]


    which. The call() method is invoked when a task is started.


    # Service


    An abstract class that extends java.lang.Object and implements Worker<V> interface,
    a reusable Worker object. The Service class provides methods such as start(),
    cancel(), reset(), and restart() to manipulate this service when needed.


    Override the createTask() method while creating a Service object, or creating
    a subclass of class. The createTask() method is invoked when a service is started.


    # ScheduledService


    A direct subclass of Service class, allows specifying the duration of delay to
    start and restart a service automatically.


    # WorkerStateEvent


    A subclass of javafx.event.Event, defines static fields of EventTypes such as
    WORKER_STATE_CANCELLED, WORKER_STATE_FAILED, WORKER_STATE_READY, WORKER_STATE_RUNNING,
    WORKER_STATE_SUCCEEDED, etc. A WorkerStateEvent occurs when the state of a Worker
    is changed.


    Consider our situation: a file list is created when a file is loaded, suppose
    the file list contains one or more file(s) to view, the Start Slideshow menu item
    is enabled, a user can start a slide show, cancel it while the slide show is on,
    and later restart it again. To fulfill this scenario, we prefer a reusable Service
    object to a one-time Task object.


    3.3.2.1 SlideshowService Class that Extends Service Class


    We need to create a class that extends Service<V> class. When a Service is started,
    it executes a Task. The createTask() method below must be overridden:


    ```

    protected abstract Task<V> createTask()

    ```


    In the createTask() method, the call() method is overridden while a Task object
    is created to be returned to the caller.


    The call() method in a Task, undertakes the task of a slide show, basically contains
    a while loop that loads images one by one until either one of the following conditions
    becomes true: there’s no next image in the file list, or the slide show is canceled
    by a user.


    The following listing demonstrates how to create a reusable SlideshowService,
    a subclass of Service class, to carry on a slide show task.'
