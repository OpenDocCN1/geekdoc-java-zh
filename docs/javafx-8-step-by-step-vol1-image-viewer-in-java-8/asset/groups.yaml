    In this section, we will demonstrate how to place a child node of a StackPane
    in the desired location.


    A StackPane places all its children in a stack with the center as default alignment.
    That is, by default StackPane’s children overlap each other in the center of the
    pane.


    Placing a Next button in the center of a StackPane is not feasible in our application.
    Fortunately, StackPane provides two static methods:


    ```

    public static void setAlignment(Node child, Pos value)

    public static void setMargin(Node child, Insets value)

    ```


    allowing us to adjust individual child node’s position. The preferred position
