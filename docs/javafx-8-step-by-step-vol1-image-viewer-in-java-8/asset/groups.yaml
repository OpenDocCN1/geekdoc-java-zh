  - "[PAGE 147]\n\n# 3.3 Add Slide Show Capabilities\n\nOnce an image file is opened\
    \ from a FileChooser's directory, the application obtains a list of image files\
    \ that exist in the current directory. One favorable feature is to allow users\
    \ to browse over these images one by one without manually clicking the Next button.\
    \ The steps to implement slide show mechanism are illustrated as follows.\n\n\
    # 3.3.1 Add Start Slideshow and Stop Slideshow Menu Items\n\nThe simplest GUI\
    \ employed here is MenuItem. Two menu items, Start Slideshow and Stop Slideshow,\
    \ are added to Option menu of a menu bar, initially they are both disabled. To\
    \ distinguish if there is a slide show running or not, a variable isSlideShowOn\
    \ of type BooleanProperty is defined as class field of ImageView and is initialized\
    \ to false. The following snippets of codes show how to accomplish\n\nImport Statements:\n\
    \n```\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
    ```\n\nListing 13-14. Add Start Slideshow and Stop Slideshow menu items:\n\n```\n\
    public class ImageViewer extends Application {\n  ...\n  final BooleanProperty\
    \ isSlideShowOn = new SimpleBooleanProperty(false);\n  ...\n  @Override\n  public\
    \ void start(final Stage stage) {\n    // Create start/stop slideshow menu items\n\
    \    final MenuItem startSlideshow = new MenuItem(\"Start Slideshow\");\n    final\
    \ MenuItem stopSlideshow = new MenuItem(\"Stop Slideshow\");\n    startSlideshow.disableProperty().bind(isSlideShowOn.or(nextButton.disableProperty()));\n\
    \    stopSlideshow.disableProperty().bind(isSlideShowOn.not().or(nextButton.disableProperty()));\n\
    \n    // Add action handler for Start slideshow menu item\n    startSlideshow.setOnAction(new\
    \ EventHandler<ActionEvent>() {\n      @Override\n      public void handle(ActionEvent\
    \ event) {\n        System.out.println(\"Start Slideshow...\");\n      }\n   \
    \ });\n```"
  - "[PAGE 148]\n\n```\n}\n));\n// Add action handler for Stop Slideshow menu item\n\
    stopSlide.setOnAction(new EventHandler<ActionEvent>() {\n  @Override\n  public\
    \ void handle(ActionEvent event) {\n    System.out.println(\"Stop Slideshow...\"\
    );\n  }\n});\n// Add option menu to menu bar\nmenuOption.getItems().addAll(menuView,\
    \ startSlide, stopSlide);\n...\n```\n\n# 3.3.1.1 Bind Disable Property of Menu\
    \ Item\n\nInitially startSlide and stopSlide menu items are disabled because of\
    \ the following binding statements.\n\n```\nstartSlide.disableProperty().bind(isSlideshowon.or(\n\
    nextButton.disableProperty()));\nstopSlide.disableProperty().bind(isSlideshowon.not().or(\n\
    nextButton.disableProperty()));\n```\n\nIn binding statements, two logical operations—or\
    \ and not—are used to compute value for disable property. The javafx.beans.binding.BooleanExpression\
    \ class, an abstract class that implements ObservableBooleanValue, provides these\
    \ methods:\n\npublic BooleanBinding not() method\nperforms a logical NOT operation\
    \ on this BooleanExpression, and returns an object of type BooleanBinding which\
    \ is a direct subclass of BooleanExpression.\n\npublic BooleanBinding or(ObservableBooleanValue)\
    \ method\nperforms a logical OR operation on this BooleanExpression and a given\
    \ ObservableBooleanValue, and returns an object of type BooleanBinding which is\
    \ a direct subclass of BooleanExpression.\n\nThe Slideshow menu item is disabled\
    \ if either a slide is currently running or the Next button is disabled. Similarly,\
    \ the Stop Slideshow menu item is disabled if either a slide is not running or\
    \ the Next button is disabled. Remember that the Next button is disabled when\
    \ there is no next image to view."
