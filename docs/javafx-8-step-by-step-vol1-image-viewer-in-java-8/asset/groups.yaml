  mdcn: "\n\n## 3.3.2 在另一个线程上执行幻灯片\n\n将耗时任务委托给另一个线程是一个良好的编程习惯，这样 UI 线程（也称为 Java 应用线程）就可以始终对用户的操作做出响应。\n\
    \njavafx.concurrent 包提供了 `Task` 和 `Service` 类，它们都实现了 `Worker` 接口，用于方便地开发多线程 JavaFX\
    \ 。\n\n以下是位于 `javafx.concurrent` 包中的并发类：\n\n### Task\n\n这是一个继承自 `java.util.concurrent.FutureTask`\
    \ 并实现 `Worker<V>` 接口的抽象类，它是一个一次性的 Worker 对象，不可复用。由于它的父类 `FutureTask` 实现了 `Runnable`\
    \ 接口，它也是一个 `Runnable` 对象。\n\n通过开始执行一个 Task，你可以使用 `java.lang.Thread` 类的 API 或派自\
    \ `Executor` 和 `ExecutorService` 接口的 API（它们都位于 `java.util.concurrent` 包中）。你可以以\
    \ Task 为参数创建一个 `Thread` 对象，并调用 `start()` 方法启动该线程。或者，使用 `ExecutorService` 中定义的\
    \ `submit(Runnable task)` 方法来提交任务。\n\n在创建 Task 对象或创建 Task 的子类时，重写 `call()` 方法。当任务开始时，会调用\
    \ `call()` 方法。\n\n### Service\n\n这是一个继承自 `java.lang.Object` 并实现 `Worker<V>` 接口的抽象类，是一个可复用的\
    \ Worker 对象。`Service` 类提供了 `start()`、`cancel()`、`reset()` 和 `restart()` 等方法，以便需要时操作该服务。\n\
    \n在创建 Service 对象或创建 Service 的子类时，重写 `createTask()` 方法。当服务启动时，会调用 `createTask()`\
    \ 方法。\n\n### ScheduledService\n\n`Service` 类的直接子类，允许指定延迟时间自动启动和重启服务。\n\n### WorkerStateEvent\n\
    \n`javafx.event.Event` 的子类，定义了 `EventTypes` 的静态字段，例如 `WORKER_STATE_CANCELLED`、`WORKER_STATE_FAILED`、`WORKER_STATE_READY`、`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`\
    \ 等。当 Worker 的状态发生变化时，会触发 `WorkerStateEvent`。\n\n考虑我们的情况：加载文件时会创建一个文件列表，假设文件列表包含一个或多个待查看文件，此时“开始幻灯片”菜单项被启用，用户可以启动幻灯片，在幻灯片运行时取消它，并在稍后再次重启。为了满足这一场景，我们更倾向于使用可复用的\
    \ Service 对象而不是一次性的 Task 对象。\n\n#### 3.3.2.1 继承 Service 类的 SlideshowService 类\n\
    \n我们需要创建一个继承 `Service<V>` 类的类。当 Service 启动时，它会执行一个 Task。必须重写下面的 `createTask()`\
    \ 方法：\n\n```\nprotected abstract Task<V> createTask()\n```\n\n在 `createTask()`\
    \ 方法中，在创建要返回给调用者的 Task 对象时重写 `call()` 方法（此处应为在 Task 类内部）。\n\n`Task` 中的 `call()`\
    \ 方法承担了幻灯片的任务，它基本上包含一个 `while` 循环，逐个加载图像，直到满足以下任一条件：文件列表中没有下一张图像，或者幻灯片被用户取消了。\n\
    \n下面的列表演示了如何创建一个可复用的 `SlideshowService`（Service 类的子类），来执行幻灯片任务。\n\n#### 列表 3-15.\
    \ 创建 SlideshowService 类：\n\n```java\npackage imageviewer;\n\nimport java.nio.file.Path;\n\
    import java.util.ListIterator;\nimport javafx.beans.property.SimpleObjectProperty;\n\
    import javafx.beans.property.SimpleStringProperty;\nimport javafx.beans.property.StringProperty;\n\
    import javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
    import java.util.concurrent.Service;\nimport javafx.util.concurrent.Task;\nimport\
    \ javafx.scene.image.Image;\n\n/**\n * File Name: SlideshowService.java\n * (directory:\
    \ ImageViewer1.2/src/example4/imageviewer/)\n * @Author Shufen Kuo\n * */\n\n\
    public class SlideshowService extends Service<Void> {\n    private ObjectProperty<Image>\
