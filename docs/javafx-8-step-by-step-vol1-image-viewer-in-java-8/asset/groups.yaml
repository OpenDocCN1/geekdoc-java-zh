  - '[PAGE 20]


    # JavaFX History


    Now let us glance through the timeline of JavaFX evolving history and obtain glimpses
    of the predecessor of JavaFX:


    Chris Oliver of SeeBeyond Technology Corporation developed a script language called
    F3, the acronym for Form Follows Function; it allows developers accessing Swing
    classes and creating graphics user interfaces (GUIs) for rapid development of
    rich internet applications.


    Sun Microsystems acquired SeeBeyond in September 2005, F3 renamed to JavaFX Script
    in May 2007.


    In December 2008, JavaFX 1.0 released, developers relied on JavaFX Script to develop
    JavaFX applications until three years later when JavaFX 2.0 released.


    In January 2010, Oracle completed the acquisition of Sun Microsystems, and continued
    maintaining JavaFX.


    In September 2010 JavaOne conference, Oracle announced JavaFX Script would be
    discontinued.


    In October 2011, JavaFX 2.0 released, developers began to engage in standard Java
    language, instead of JavaFX Script, to access APIs of JavaFX library. However,
    JavaFX SDK and JavaFX Runtime, in addition to Java SE JDK and JRE, must be installed
    for developing and executing applications compiled with JavaFX 2.0.


    In February 2013, JavaFX 2.2.7 released, JavaFX SDK and JavaFX Runtime are included
    within JDK/JRE 7. The integration of JavaFX and JDK results in great convenience
    for JavaFX developers. No additional installations are needed for JavaFX applications
    compiled with JDK 7 and later releases.


    On March 18, 2014, JavaFX 8 released as part of Java™ SE Development Kit 8 (JDK
    8), a major feature release.


    As of the publishing of this book on March, 2016, the latest JDK releases are:
    JDK 8u66 on October 20, 2015, and JDK 8u72 on January 2016.


    The schedule of general availability (GA) for JDK 9 is March 23rd, 2017.'
- md: "\n# Prerequisite\n\nJavaFX applications presented in this book using APIs provided\
    \ in Java packages to build GUIs. Knowledge of Swing packages is not a must, however,\
    \ readers must be familiar with the basics of Java programming language. If you\
    \ are new to Java, visit this this website, http://docs.oracle.com/javase/tutorial/index.html,\
    \ to obtain preliminary knowledge of Java technologies. Read Oracle Java online\
    \ documentation in this order:\n\n- 1. Getting Started with Simple Java Application\
    \ \"Hello World!\" and Installations:\n  Visit http://docs.oracle.com/javase/tutorial/getStarted/index.html\n\
    - 2. Concepts and features of the Java Programming Language:\n  Visit http://docs.oracle.com/javase/tutorial/java/index.html\n\
    - 3. Java Collections Framework:\n  Visit http://docs.oracle.com/javase/tutorial/collections/index.html\n\
    - 4. Essential Java Classes:\n  Visit http://docs.oracle.com/javase/tutorial/essential/index.html\n\
    \n# A Glimpse of JavaFX Applications\n\nThe following example is for readers who\
    \ are new to JavaFX to have a quick preview of how to create a JavaFX application.\n\
    \nTo get started, create a class that extends javafx.application.Application,\
    \ the entry point of JavaFX applications, and override the start method that is\
    \ abstract but overridden. Here's a typical start method looks like:\n\n```\n\
    package imageviewer;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n    @Override\n\
    \    public void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.getChildren().add(imageArea);\n\
    \n        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageView V1.0\");\n        stage.setScene(scene);\n        stage.show();\n  \
    \  }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n# Scene and Stage\n\nThere are two important classes, Scene\
    \ and Stage, appears within the start method. In general, the main task is to\
    \ create graphical user interfaces (GUIs) managed in hierarchical tree structure\
    \ called a scene graph, associate the root node of the scene graph to a Scene\
    \ object, then place the scene on a Stage object which stands for the top-level\
    \ container of the JavaFX application, acting as the window of the scene graph\
    \ to interact with application users.\n\nFollowing snapshot gives you an initial\
    \ idea of how the GUIs of a Java application we are going to build likes like:\n\
    \n**Figure 1.** Snapshot of a JavaFX application.\n\n![](img/27e7b2efbff71bf5e123da46e585606e_23_0.png)\n\
    \n# Nodes\n\nJavaFX introduces a basic class, javafx.scene.Node which extends\
    \ java.lang.Object and provides common properties and methods useful to all user\
    \ interfaces. Very often we are using the term nodes to reference GUIs.\n\nA scene\
    \ graph may contain nodes of sorts. A node is either a parent (a node with children)\
    \ or a leaf (a node without children); each node can have one parent, and the\
    \ root node has no parent. All nodes in a scene graph are derived from javafx.scene.Node\
    \ class.\n\nFor quickly catch the essential about the types of nodes in a scene\
    \ graph, we'll differentiate them by the ability to add children or not.\n\n-\
    \ You may add children to these nodes:\n  The following classes are frequently\
    \ employed as parent nodes: Group, Pane, and build-in layout panes (which are\
    \ subclasses of Pane). Typically, you call the getChildren() method to obtain\
    \ a list of type ObservableList<Node> (it is a subinterface of java.util.List),\
    \ then you use the basic utilities, defined in Collection interface, which java\
    \ developers are familiar with, to manipulate the content of the list.\n\n- You\
    \ may not add children to these nodes:\n  The following classes are always employed\
    \ as leaf nodes: Canvas, ImageView, MediaView, and all direct subclasses of Shape\
    \ such as Rectangle, Circle, Ellipse, etc.\n\n# JavaFX and Swing\n\nNow, here\
    \ is an intriguing issue. For years Java developers have been building GUIs of\
    \ Java applications using Swing APIs, the GUI Components of Java Foundation Classes\
    \ (JFC), why do we need JavaFX in addition to Swing?\n\nIf you possess multitudes\
    \ of legacy codes written in Swing and would like to incorporate JavaFX features\
    \ into Swing codes, JDK 8 provides mechanism to do so, and vice versa, you can\
    \ include Swing components in JavaFX applications.\n\nThe topic of JavaFX-Swing\
    \ Interoperability is not covered in this book. If you are interested in this\
    \ topic, visit Oracle Online Documentation “JavaFX: Interoperability — JavaFX-Swing\
    \ Interoperability” at:\nhttp://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm\n\
    \nJavaFX is the next generation of Java GUIs. To account for the benefits of employing\
    \ JavaFX capabilities, besides the Interoperability between JavaFX and Swing,\
    \ we present the significant features of JavaFX in the section below.\n\n# Essence\
    \ of JavaFX\n\nJavaFX not only allows you to create applications with visual user\
    \ interfaces rapidly, but also contains enticing and distinctive abilities. They\
    \ are enumerated as follows:\n\n## Build-in Layout Panes\n\nJavaFX layout panes\
    \ are containers that automatically perform placement of nodes. The major advantage\
    \ of using layout panes as in scene graph, the layout algorithm computes size\
    \ and location of each node. There are 8 types of built-in layout panes in javafx.scene.layout:\n\
    \n- BorderPane: A BorderPane places nodes in five locations: top, bottom, left,\
    \ right and center.\n- HBox: An HBox places nodes in one row (horizontally).\n\
    - VBox: A VBox places nodes in one column (vertically).\n- GridPane: A GridPane\
    \ places nodes in a grid with multiple rows and columns.\n- StackPane: A StackPane\
    \ places all nodes on top of other with default alignment in the center of the\
    \ container.\n- FlowPane: You can specify orientation property of FlowPane. For\
    \ a horizontal FlowPane, nodes are placed in rows from left to right, wrapping\
    \ at the boundary of its width. For a vertical FlowPane, nodes are placed in columns\
    \ from top to bottom, wrapping at the boundary of its height.\n- TilePane: A TilePane\
    \ is similar to FlowPane except each cell in the grid has the same size.\n- AnchorPane:\
    \ An AnchorPane places nodes relative to their specified anchor points, there\
    \ are topAnchor, rightAnchor, bottomAnchor and leftAnchor.\n\n> Reference to Oracle\
    \ Online Documentation \"Working with Layouts\"\nhttp://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html\n\
    \n# Customization using CSS\n\nJavaFX allows the usage of CSS to describe the\
    \ presentation styles of application's user interfaces. Defining the presentation\
    \ attributes—such as color, font, margins, width, height, lines, background images,\
    \ etc., using CSS, separated from application reveals convenience in many ways:\n\
    \n- Customization from software provider's:\n  Applications compiled from the\
    \ same set of codes can bear a variety of presentation styles, each of them complying\
    \ with different customer's requirements.\n- Customization from application user's:\n\
    \  Even after the software has been released, in case application users have preferences\
    \ for the look of U, it is also applicable to modify the presentation attributes,\
    \ defined in CSS files, at customer site.\n- Benefits for designers of presentation\
    \ styles:\n  The separation of application codes from definitions of presentation\
    \ styles improves readability of code and simplifies the tasks for graphics designers\
    \ by focusing on dealing with CSS only.\n- Benefits for software developers:\n\
    \  During the course of testing, developers may frequently change style attributes\
    \ defined in CSS file in order to evaluate the variety GUIs. If the application\
    \ has to quit and restart for each change, it is a very tiresome task. To facilitate\
    \ this evaluation process, the best strategy is to design a makeshift Load button,\
    \ and whenever any style is changed, click on the button to re-load the CSS, thus\
    \ saving tremendous time spending on testing.\n\n- Similarity between CSS in JavaFX\
    \ and CSS in HTML:\n  The syntax of CSS in JavaFX is as that of CSS in HTML, thus\
    \ any designer has experience with CSS for browsers can do the styling for JavaFX\
    \ application's UIs with little learning effort.\n"
  mdcn: "\n\n# 前提条件\n\n本书介绍的 JavaFX 使用 Java 包中提供的 API 来构建图形用户界面（GUI）。虽然不要求熟悉 Swing\
    \ 包，但读者必须熟悉 Java 编程语言的基础知识。如果你是 Java 初学者，请访问此网站 http://docs.oracle.com/javase/tutorial/index.html\
    \ 获取 Java 技术的初步知识。请按照以下顺序阅读 Oracle Java 在线文档：\n\n- 1. 从简单的 Java 应用程序“Hello World!”入门与安装：\n\
    \  访问 http://docs.oracle.com/javase/tutorial/getStarted/index.html\n- 2. Java\
    \ 编程语言的概念和特性：\n  访问 http://docs.oracle.com/javase/tutorial/java/index.html\n-\
    \ 3. Java 集合框架：\n  访问 http://docs.oracle.com/javase/tutorial/collections/index.html\n\
    - 4. 核心 Java 类：\n  访问 http://docs.oracle.com/javase/tutorial/essential/index.html\n\
    \n# JavaFX 概览\n\n以下示例旨在为 JavaFX 初学者准备的，以便他们快速预览如何创建一个 JavaFX 应用程序。\n\n要开始，请创建一个扩展\
    \ `javafx.application.Application` 的类（这是 JavaFX 应用程序的入口），并重写抽象但被重写的 `start` 方法。一个典型的\
    \ `start` 方法如下：\n\n```\npackage imageviewer;\n\nimport javafx.application.Application;\n\
    import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n    @Override\n\
    \    public void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.getChildren().add(imageArea);\n\
    \n        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageView V1.0\");\n        stage.setScene(scene);\n        stage.show();\n  \
    \  }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n# 场景（Scene）与阶段（Stage）\n\n在 `start` 方法中有两个重要的类：`Scene` 和 `Stage`。通常，主要任务是创建在称为场景图（scene\
    \ graph）的层级树结构中管理的图形用户界面（GUI），将场景图的根节点与 `Scene` 对象关联，然后将场景放置在 `Stage` 对象上。`Stage`\
    \ 代表 JavaFX 应用程序的顶层容器，作为场景图的窗口，与应用程序用户进行交互。\n\n接下来的快照让你对我们将构建的 Java 应用程序的 GUI\
    \ 样式有一个初步了解：\n\n**图 1.** JavaFX 应用程序的快照。\n\n![](img/27e7b2efbff71bf5e123da46e585606e_23_0.png)\n\
    \n# 节点（Nodes）\n\nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自 `java.lang.Object` 并提供了对所有用户界面都有用的常用属性和方法。我们经常使用“节点”一词来指代\
    \ GUI。\n\n场景图可能包含各种节点。节点可以是父节点（有子节点的节点）或叶子节点（没有子节点的节点）；每个节点可以有一个父节点，而根节点没有父节点。场景图中的所有节点都派自\
    \ `javafx.scene.Node` 类。\n\n为了快速掌握场景图中节点类型的要点，我们将根据是否可以添加子节点来区分它们。\n\n- 你可以向这些节点添加子节点：\n\
    \  以下类经常被用作父节点：`Group`、`Pane` 以及内置布局面板（是 `Pane` 的子类）。通常，你调用 `getChildren()` 方法来获取类型为\
    \ `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用 Java 开发者熟悉的在 `Collection`\
    \ 接口中定义的set工具类来操作列表的内容。\n\n- 你不能向这些节点添加子节点：\n  以下类始终被用作叶子节点：`Canvas`、`ImageView`、`MediaView`\
    \ 以及 `Shape` 的所有直接子类，如 `Rectangle`、`Circle`、`Ellipse` 等。\n\n# JavaFX 与 Swing\n\
    \n现在，这里有一个有趣的问题。多年来，Java 开发者一直使用 Swing API（Java 基础类 JFC 的 GUI 组件）来构建 Java 应用程序的\
    \ GUI，为什么我们除了 Swing 之外还需要 JavaFX 呢？\n\n如果你有很多用 Swing 编写遗留代码并希望将 JavaFX 特性整合到 Swing\
    \ 代码中，JDK 8 提供了机制；反之，你可以在 JavaFX 应用程序中包含 Swing 组件。\n\n本书未涵盖 JavaFX-Swing 互操作性（Interoperability）主题。如果你对该主题感兴趣，请访问\
    \ Oracle 在线文档“JavaFX: Interoperability — JavaFX-Swing Interoperability”：\nhttp://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm\n\
    \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节中介绍了\
    \ JavaFX 的重要特性。\n\n# JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建具有视觉用户界面的应用程序，还包含吸引且独特的能力。它们列举如下：\n\
    \n## 内置布局面板\n\nJavaFX 布局面板是自动执行节点放置的容器。在场景图中使用布局面板的主要优势是布局算法会计算每个节点的大小和位置。`javafx.scene.layout`\
    \ 中有 8 种类型的布局面板：\n\n- `BorderPane`：将节点放在顶部、底部、左、右和中心。\n- `HBox`：将节点放置在一行中（水平）。\n\
    - `VBox`：将节点放置在一列中（垂直）。\n- `GridPane`：在多行列网格中放置节点。\n- `StackPane`：将所有节点堆叠在一起，默认在容器对齐。\n\
    - `FlowPane`：你可以指定 `FlowPane` 的方向属性。对于水平 `FlowPane`，节点从左到右排列，在宽度边界换行；对于垂直 `FlowPane`，节点从上到下排列，在高度边界换列。\n\
    - `TilePane`：类似于 `FlowPane`，但网格中的每个单元大小相同。\n- `AnchorPane`：相对于指定的锚点放置节点，有 `topAnchor`、`rightAnchor`、`bottomAnchor`\
    \ 和 `leftAnchor`。\n\n> 参考 Oracle 在线文档“Working with Layouts”\nhttp://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html\n\
    \n# 使用 CSS 自定义\n\nJavaFX 允许使用 CSS 来描述应用程序用户界面的样式。使用 CSS 定义显示属性（如颜色、字体、间距、宽度、高度、线条、背景图像等）在许多方面为应用程序提供了便利：\n\
    \n- 软件提供者的自定义：从同一组代码编译的应用程序可以采用各种样式，以满足不同的客户需求。\n- 应用程序用户的自定义：即使在软件发布后，如果应用程序用户对界面外观有偏好，也可以在客户现场修改\
    \ CSS 文件中定义的显示属性。\n- 样式设计者的利益：应用程序代码与样式定义的分离提高了代码的可读性，并让图形设计师专注于处理 CSS，简化了任务。\n\
    - 软件开发者的利益：在测试过程中，开发者可能会频繁更改 CSS 文件中定义的样式以评估各种 GUI。如果每次更改都需要退出并重启应用程序，将是一项非常痛苦的任务。为了方便这种评估过程，最佳策略是设计一个临时加载按钮，每当样式发生变化时，点击按钮重新加载\
    \ CSS，从而节省大量的测试时间。\n\n"
