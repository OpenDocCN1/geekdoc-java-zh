    # 3.1 Add Status Bar at the Bottom of BorderPane


    Prior to the implementation of slide show feature, we''ll add a status bar at
    the bottom of the root pane which is a BorderPane. The status bar is for displaying
    image name, the file name of the current image.


    # 3.1.1 Create HBox Pane as Status Bar and Text Node to Show Image Name


    An HBox, one of build-in layout panes, placing its children in one row horizontally,
    is created as status bar. And a Text node is created to display image name. Here''s
    the snippet of code to do:


    ```

    BorderPane rootPane = new BorderPane();

    HBox statusBar = new HBox();

    Text statusText = new Text("");

    statusBar.getChildren().add(statusText);

    rootPane.setBottom(statusBar);

    ```


    Please note that Text class derives from Node class, and is one of direct subclasses
    of Shape class that carries out nodes for rendering primitives.


    A Text being considered a Node as well as a Shape comes with significant benefits.
    All features in JavaFX can be applied to Text objects. They can be placed in a
    layout pane utilizing the automatic placement capabilities, applying transformations
    and transitions, customizing the presentation style using CSS, etc. Also they
    possess common properties defined in Shape class as fill, stroke, strokeType,
    strokeWidth, etc.


    We''d like to set preferred value of properties as below for the HBox created
    as a status bar:


    padding


    The padding property, inherited from Region class, defines padding of top, right,
    bottom and left for a region. The void setPadding(Insets value) method is called
    to set value for this property.


    spacing


    The spacing property, defined in HBox class, specifies the horizontal space between
    children in an HBox pane. The void setSpacing(double value) method is called to
    set value for this property.


    style


    The style property, defined in Node class, specifies CSS style for this node.
    The value of this property is a string complying with the format used in the style'
  - '[PAGE 127]


    attribute of a HTML element. The void setStyle(String value) method is called
    to set the background color of a status bar, specifying a property-value pair
    in a string with format like this:


    ```

    "-fx-background-color: linear-gradient(#FFFF, #708090)"

    ```


    Here''s the snippet of codes to do these:


    ```

    HBox statusBar = new HBox();

    statusBar.setPadding(new Insets(4, 12, 4, 12));

    statusBar.setSpacing(4);

    statusBar.setStyle("-fx-background-color: linear-gradient(#FFFF, #708090)");

    ```


    As for the Text, values for font and fill property are set. Here''s the snippet
    of codes to do these:


    ```

    Text statusText = new Text("");

    statusText.setFont(Font("Verdana", FontWeight.BOLD, 12));

    statusText.setFill(Color.DARKSLATEBLUE);

    ```


    To make a scene in vivid contrast against an image rendered in a StackPane, we
    prefer the background of the scene to Color.BLACK. The constructor that allows
    specifying color is employed:


    ```

    Scene scene = new Scene(rootPane, 600, 400, Color.BLACK);

    ```


    Notice that, there''s an unusual aspect in JavaFX 8 (JDK 8u66 running on Windows
    8.1), regarding background of a Scene; to see we set root pane''s background color
    to transparent. Here''s the line of code:


    ```

    rootPane.setStyle("-fx-background-color: transparent;");

    ```


    The status bar, a region added at the bottom of the root pane, affects the height
    of image rendering area, a StackPane. Thus the line of code binds fitHeight property
    of an ImageView with height property of a Scene need to be changed to:


    ```

    imageView.fitHeightProperty().bind(

    scene.heightProperty().subtract(

    menuBar.getHeight() + statusBar.getHeight()));n

    ```


    In previous chapters, we have demonstrated uses of Properties and Binding in various
    situations. Here''s one more case. The text property of the Text node binds with
    imageName, a class field of type StringProperty defined in ImageView class.

