    \ oldVal, ListIterator<Path> newVal) {\n                it = newVal;\n       \
    \     }\n        });\n    }\n\n    public Image getImage() {\n        return image.get();\n\
    \    }\n\n    public void setImage(Image value) {\n        image.set(value);\n\
    \    }\n\n    public ObjectProperty<Image> imageProperty() {\n        return image;\n\
    \    }\n\n    public ListIterator<Path> getIterator() {\n        return iterator;\n\
    \    }\n\n    public void setListIterator(ListIterator<Path> value) {\n      \
    \  iterator.set(value);\n    }\n\n    public ObjectProperty<ListIterator<Path>>\
    \ iteratorProperty() {\n        return iterator;\n    }\n\n    public String getImageName()\
    \ {\n        return imageName.get();\n    }\n\n    public void setName(String\
    \ value) {\n        imageName.set(value);\n    }\n\n    public StringProperty\
    \ imageNameProperty() {\n        return imageName;\n    }\n\n    @Override\n \
    \   protected Task<Void> createTask() {\n      return new Task<Void>() {\n   \
    \     @Override\n        protected Void call() {\n          if (it == null) return\
    \ null;\n          while (it.hasNext()) {\n            if (isCancelled()) {\n\
    \              updateMessage(\"Cancelled\");\n              break;\n         \
    \   }\n            String url = it.next().toUri().toString();\n            setImage(new\
    \ Image(url));\n            setName(url.substring(url.lastIndexOf(\"/\") + 1));\n\
    \            // 暂停 3000ms\n            try {\n              Thread.sleep(3000);\n\
    \            } catch (InterruptedException ex) {\n              if (isCancelled())\
    \ {\n                updateMessage(\"Cancelled\");\n                break;\n \
    \             }\n            }\n          }\n          return null;\n      };\n\
    \    }\n}\n```\n\n下面的语句创建了一个 `SlideshowService` 对象：\n\n```java\n// 创建可复用的 Worker\
    \ 对象\nfinal SlideshowService service = new SlideshowService(listIterator, curImage,\
    \ imageName);\n```\n\n三个参数传递给 `SlideshowService` 类的构造函数：\n\n- `listIterator`:\
    \ `ObjectProperty<ListIterator<Path>>` 类型，指定从 FileChooser 打开时创建的文件列表。\n- `curImage`:\
    \ `ObjectProperty<Image>` 类型，绑定到 `ImageView` 对象的图像属性。\n- `imageName`: `StringProperty`\
    \ 类型，绑定到 Text 对象的文本属性，用于在状态栏中显示图像名称。\n\n#### 3.3.2.2 配置幻灯片对象\n\n我们定义了一个 `configureSlideshow`\
    \ 方法来进行配置。一旦创建了服务对象，就会调用该方法执行以下工作：\n\n- 将 `ImageView` 类中 `isSlidesOn` 属性绑定到服务的\
    \ `running` 属性。当且仅当服务运行时，`isSlidesOn` 属性的值为 `true`。\n\n```java\nBooleanProperty\
    \ isSlideshowOn = new SimpleBooleanProperty(false);\nSlideshowService service\
    \ = new SlideshowService(listIterator, curImage, imageName);\nisSlideshowOn.bind(service.runningProperty());\n\
    ```\n\n- 注册事件处理器来处理以下类型的 WorkerEvents：`WORKER_STATE_RUNNING`、`WORKER_STATE_SUCCEEDED`、`WORKER_STATE_FAILED`\
    \ 和 `WORKER_STATE_CANCELLED`。\n\n以下是 `Service` 类中定义的便利方法，用于为上述事件类型注册处理器：\n\n-\
    \ `public final void setOnRunning(EventHandler<WorkerStateEvent> value)`\n- 设置\
    \ `onRunning` 属性的值，提供当 Worker 状态变为 `RUNNING` 时调用的 `handle` 方法实现。\n\n- `public\
