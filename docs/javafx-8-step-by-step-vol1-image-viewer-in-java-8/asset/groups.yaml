    \ me) {\n            System.out.println(\"Mouse entered\");\n            // Check\
    \ if button is pressed\n            rect.setFill(me.isButtonDown() ? pressed :\
    \ entered);\n            polygon.setStroke(Color.web(\"#436B8B\"));\n        }\n\
    \    });\n\n    // Register mouse pressed event\n    // Change the appearance\
