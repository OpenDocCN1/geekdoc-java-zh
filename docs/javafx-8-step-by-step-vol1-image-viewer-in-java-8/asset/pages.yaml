    top, right, bottom, left padding for a region. (See here)

    - void setSpacing(double value) method, provided in HBox class, specifies the
    horizontal space between children in an HBox pane. (See here)

    - void setStyle(String value) method, provided in Node class, specifies CSS style
    for this node. (See here)

    - static Font font(java.lang.String family, FontWeight weight, double size) method
    is provided in javafx.scene.text.Font, for obtaining a font to render text. (See
    here)

    - Scene(Parent root, double width, double height, Paint fill) is one of constructors
    of Scene class for creating a Scene with the specified background color. (See
    here)

