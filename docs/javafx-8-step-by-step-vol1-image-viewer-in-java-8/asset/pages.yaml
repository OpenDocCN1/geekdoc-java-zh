  md: '# JavaFX and Swing


    Now, here is an intriguing issue. For years Java developers have been building
    GUIs of Java applications using Swing APIs, the GUI Components of Java Foundation
    Classes (JFC), why do we need JavaFX in addition to Swing?


    If you possess multitudes of legacy codes written in Swing and would like to incorporate
    JavaFX features into Swing codes, JDK 8 provides mechanism to do so, and vice
    versa, you can include Swing components in JavaFX applications.


    The topic of JavaFX-Swing Interoperability is not covered in this book. If you
    are interested in this topic, visit Oracle Online Documentation “JavaFX: Interoperability
    — JavaFX-Swing Interoperability” at:

    http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm


    JavaFX is the next generation of Java GUIs. To account for the benefits of employing
    JavaFX capabilities, besides the Interoperability between JavaFX and Swing, we
    present the significant features of JavaFX in the section below.'
  merge: -1
