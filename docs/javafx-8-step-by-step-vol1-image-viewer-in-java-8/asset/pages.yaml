  md: "```\n/**\n * Using Files.newDirectoryStream(Path, String) to read directory,\n\
    \ * add files to a list, return the listIterator that points to\n * the file specified\
    \ in argument, that is, the first call of next()\n * returns the specified file,\n\
    \ * the list is sorted in alphabetical order,\n * the second argument in newDirectoryStreams\
    \ method is\n * a glob pattern for filtering files matching the pattern:\n * \
    \ \"..*.bmp,.gif,.jpeg,.jpg,.png\"\n * we are only interested in files ending\
    \ with:\n *  .bmp, .gif, .jpeg, .jpg and .png.\n*\n * @param file\n * @return\n\
    \ * @throws IOException\n */\npublic static ListIterator<Path> listIterator(Path\
    \ file) throws IOException {\n    Path dir = file.getPath();\n    List<Path> list\
    \ = new ArrayList<>();\n\n    try (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n\
    \            \"*.bmp,.gif,.jpeg,.jpg,.png\")) {\n        for (Path entry : stream)\
    \ {\n            if (!Files.isDirectory(entry, LinkOption.NOFOLLOW_LINKS)) {\n\
    \                continue;\n            }\n            list.add(entry);\n    \
    \    }\n    } catch (DirectoryStreamException de) {\n        throw de.getCause();\n\
    \    }\n\n    // compare method in Path compares two abstract paths lexicographical\n\
    \    Collections.sort(list, new Comparator<Path>() {\n        public int compare(Path\
    \ o1, Path o2) {\n            return o1.getFileName().compareTo(o2.getFileName());\n\
    \        }\n    });\n\n    int index = 0; // index in the list for the current\
    \ file\n    // Search index for selected file\n    for (Path entry : list) {\n\
    \        if (entry.equals(file)) break;\n    }\n    if (index == list.size())\
    \ {\n        // file not in the list\n        index = 0;\n    }\n    return list.listIterator(index);\n\
    }\n```"
