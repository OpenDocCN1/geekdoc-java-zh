  md: "# A Glimpse of JavaFX Applications\n\nThe following example is for readers\
    \ who are new to JavaFX to have a quick preview of how to create a JavaFX application.\n\
    \nTo get started, create a class that extends javafx.application.Application,\
    \ the entry point of JavaFX applications, and override the start method that is\
    \ abstract but overridden. Here's a typical start method looks like:\n\n```\n\
    package imageviewer;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
    import javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
    import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n * @author\
    \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n    @Override\n\
    \    public void start(Stage stage) {\n        BorderPane rootPane = new BorderPane();\n\
    \        StackPane imageArea = new StackPane();\n        rootPane.getChildren().add(imageArea);\n\
    \n        Scene scene = new Scene(rootPane, 600, 400);\n        stage.setTitle(\"\
    ImageView V1.0\");\n        stage.setScene(scene);\n        stage.show();\n  \
    \  }\n\n    public static void main(String[] args) {\n        launch(args);\n\
    \    }\n}\n```\n\n# Scene and Stage\n\nThere are two important classes, Scene\
    \ and Stage, appears within the start method. In general, the main task is to\
    \ create graphical user interfaces (GUIs) managed in hierarchical tree structure\
    \ called a scene graph, associate the root node of the scene graph to a Scene\
    \ object, then place the scene on a Stage object which stands for the top-level\
    \ container of the JavaFX application, acting as the window of the scene graph\
    \ to interact with application users."
  merge: -1
  pgno: 22
- img_proc: true
  md: "Following snapshot gives you an initial idea of how the GUIs of a Java application\
    \ we are going to build likes like:\n\n**Figure 1.** Snapshot of a JavaFX application.\n\
    \n![](img/27e7b2efbff71bf5e123da46e585606e_23_0.png)\n\n# Nodes\n\nJavaFX introduces\
    \ a basic class, javafx.scene.Node which extends java.lang.Object and provides\
    \ common properties and methods useful to all user interfaces. Very often we are\
    \ using the term nodes to reference GUIs.\n\nA scene graph may contain nodes of\
    \ sorts. A node is either a parent (a node with children) or a leaf (a node without\
    \ children); each node can have one parent, and the root node has no parent. All\
    \ nodes in a scene graph are derived from javafx.scene.Node class.\n\nFor quickly\
    \ catch the essential about the types of nodes in a scene graph, we'll differentiate\
    \ them by the ability to add children or not.\n\n+   - You may add children to\
    \ these nodes:\n  The following classes are frequently employed as parent nodes:\
    \ Group, Pane, and build-in layout panes (which are subclasses of Pane). Typically,\
    \ you call the getChildren() method to obtain a list of type ObservableList<Node>\
    \ (it is a subinterface of java.util.List), then you use the basic utilities,\
    \ defined in Collection interface, which java developers are familiar with, to\
    \ manipulate the content of the list."
  merge: -1
  pgno: 23
- img_proc: true
  md: "+   * You may not add children to these nodes:\n  * The following classes are\
    \ always employed as leaf nodes: Canvas, ImageView, MediaView, and all direct\
    \ subclasses of Shape such as Rectangle, Circle, Ellipse, etc."
