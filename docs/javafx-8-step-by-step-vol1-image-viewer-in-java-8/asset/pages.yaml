  md: "# 2.1 Add Next Button\n\nInstead of using Button class from built-in JavaFX\
    \ controls, we implement our own utilities to design a custom-made button by employing\
    \ the below classes:\n\n+   - Group\nServed as the parent container.\n\n+   -\
    \ Shape\n  - Rectangle\n    Served as the bounding box.\n  - Polygon\n    Served\
    \ as the visual sign of Next icon.\n\n+   - LinearGradient and Color\nPaints to\
    \ fill background and to stroke border.\n\n+   - EventHandler and MouseEvent\n\
    Used for handling mouse entering, clicking, and exiting events.\n\n# 2.1.1 Use\
    \ Group as Parent Container\n\nGroup class, resides in javafx.scene package, is\
    \ a subclass of javafx.scene.Parent. The capability of Group is straightforward.\
    \ It allows you to group various nodes together without imposing automatic layout.\
    \ The following snippet shows how to add nodes to Group:\n\n```\nGroup buttonGroup\
    \ = new Group();\nRectangle rect = new Rectangle(0, 0, 25, 35);\nPolygon polygon\
    \ = new Polygon();\nbuttonGroup.getChildren().addAll(rect, polygon);\n```\n\n\
    Learn more about the characteristics of Group in Volume II: DEVELOPING INTERACTIVE\
    \ SHAPE DRAWING TOOLS Chapter 1 Line Drawer Section 1.1.1 Add Pane as Drawing\
    \ Board in the Center of BorderPane.\n\n# 2.1.2 Use Shape Class for Rendering\
    \ 2D Geometric Primitives\n\nJavaFX provides a very enticing class, Shape, for\
    \ rendering 2D geometric primitives. It is an abstract class which extends javafx.scene.Node\
    \ and serves as the base class of some basic forms of 2D geometry. Its direct\
    \ subclasses: Arc, Circle, CubicCurve, Ellipse, Line, Path, Polygon, Polyline,\
    \ QuadCurve, Rectangle, SVGPath. The Shape class defines common properties of\
    \ 2D geometric primitives, such as fill, stroke, strokeType, strokeWidth, etc."
