  md: '+   - public final void setOnRunning(EventHandler<WorkerStateEvent> value)

    - Set value of onRunning property, providing the implementation of handle method
    which is called when Worker''s state is transitioned to RUNNING.


    +   - public final void setOnSucceeded(EventHandler<WorkerStateEvent> value)

    - Set value of onSucceeded property, providing the implementation of handle method
    which is called when Worker''s state is transitioned to SUCCEEDED.


    +   - public final void setOnFailed(EventHandler<WorkerStateEvent> value)

    - Set value of onFailed property, providing the implementation of handle method
    which is called when Worker''s state is transitioned to FAILED.


    +   - public final void setOnCancelled(EventHandler<WorkerStateEvent> value)

    - Set value of onCancelled property, providing the implementation of handle method
    which is called when Worker''s state is transitioned to CANCELLED.


    Worker.State, a nested class from javafx.concurrent.Worker interface, is an enumerated
    type defines constants for states of a Worker, they are: CANCELLED, FAILED, READY,
    RUNNING, and SUCCEEDED.


    Initially, a Worker object is in READY state. And when the Worker starts executing
    a task, it is transitioned to SCHEDULED state, enters RUNNING state shortly after,
    and stays in RUNNING state until one of the following occasions occurs:


    The task is accomplished successfully:


    The Worker is transitioned to SUCCEEDED state.


    An exception is thrown:


    The Worker is transitioned to FAILED state.


    The task is canceled:


    The Worker is transitioned to CANCELLED state. A Worker can be canceled by calling
    the boolean cancel() method defined in Worker interface. It returns true if the
    canceling is successful.


    The tasks performed in an event handler that handles WORKER_STATE_RUNNING event
    type is trivial:


    +   1. Set value of lastClickedButton property as NEXT since a slide being running
    implies that the Next button is clicked automatically and continuously.'
