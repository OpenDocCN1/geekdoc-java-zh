  md: '# 1.4 Implement Fit Width, Fit Height and Original Size Viewing Options


    In this section, we demonstrate how to adjust viewing size of an image to fit
    the application window. The ImageView is created as a child of a StackPane, and
    according to StackPane default layout strategy, an image is positioned in the
    center of StackPane; therefore, if the size of an image is larger than the current
    available viewing space, which is subject to the size of a scene, outer portion
    of the image will be blocked, thus a user will not be able to view the whole image.


    In last section, we created an Option containing three viewing choices: Fit Width,
    Fit Height, and Original Size. An image is rendered based on the viewing option
    currently selected, initially it is set to Original Size. By default, we''d like
    to preserve the original width to height ratio of image when scaling is in. To
    do so, we set value of preserveRatio property to true as:


    +   Listing 1-11. list of preserveRatio property to true:


    ```

    final ImageView imageView = new ImageView();\imageView.setPreserveRatio(true);

    ```


    Now, let''s explore two approaches to render image according to the viewing option
    selected.


    # 1.4.1 Approach One: Bind ImageView’s fitWidth/fitHeight Properties to Scene’s
    width/height Properties Respectively


    We bind and unbind methods defined in Property interface to implement Fit Width,
    Fit Height, and Original Size viewing options.


    What entering here is, once the binding becomes effective, an image’s viewing
    and/or height will be changed accordingly whenever width and/or height of Scene
    is changed dynamically.


    1.4.1.1 Implement Fit Width Viewing Option


    If a user selects Fit Width as viewing option, we''ll have fitWidth property of
    ImageView bind with width property of Scene, and unbind fitHeight property. Here
    are codes:


    +   Listing 1-12. Bind fitWidth property of ImageView object with width property
    of Scene:


    ```

    imageView.fitWidthProperty().bind(scene.widthProperty());

    imageView.fitHeightProperty().unbind();

    // Besides unbind, must also set height to 0

    ```'
