  md: "+   - fromValue\n  Type of DoubleProperty, holds the starting value of opacity\
    \ for this fade transition.\n- toValue\n  Type of DoubleProperty, holds the end\
    \ value of opacity for this fade transition.\n\nHere's the snippet of codes to\
    \ create a FadeTransition for an image to fade in, the value of opacity for this\
    \ image is changing from 0 to 1 through the duration of 2000 milliseconds:\n\n\
    ```\nFadeTransition fadein = new FadeTransition(Duration.millis(2000));\nfadein.setFromValue(0.0);\n\
    fadein.setToValue(1.0);\n```\n\nSimilarly, here is the snippet of codes to create\
    \ a FadeTransition for an image to fade out, the value of opacity for this image\
    \ is changing from 1 to 0 through the duration of 2000 milliseconds:\n\n```\n\
    FadeTransition fadeout = new FadeTransition(Duration.millis(2000));\nfadeout.setFromValue(1.0);\n\
    fadeout.setToValue(0.0);\n```\n\nNow, we have two FadeTransition objects, one\
    \ for performing a fade in transition, another for performing fade out transition,\
    \ we prefer both transitions to process in parallel. Since each transition has\
    \ its own target node, the constructor of ParallelTransition is employed:\n\n\
    ```\npublic ParallelTransition(Animation... children)\n```\n\nHere's the snippet\
    \ of codes to create a ParallelTransition and start the animation using the playFromStart()\
    \ method provided in Animation class:\n\n```\nTransition animate = new ParallelTransition(fadein,\
    \ fadeout);\nanimate.playFromStart();\n```\n\nThe requester of a SlideshowService\
