  md: "Thread. And the construction of a Scene object or a Stage object must be accessed\
    \ from JavaFX Application Thread as well.\n\n# 1.1.2 Catch Resize Event of Image\
    \ Rendering\n\nFor debugging and testing purpose at this point, we register a\
    \ ChangeListener providing a changed method to be notified whenever width or height\
    \ of image rendering area is changed when a user resizes the application window.\n\
    \nTo register a ChangeListener to observe change of value for a property, we use\
    \ this method:\n\n```\nvoid addListener(ChangeListener<? super T> listener);\n\
    ```\n\ndefined in javafx.beans.value.ObservableValue interface, providing implementation\
    \ of changed(ObservableValue<? extends T> observable, oldValue, T newValue) method,\
    \ to be invoked when this property's value is changed.\n\nThe same ChangeListener\
    \ is allowed to be registered to multiple ObservableValues. To avoid memory leak,\
    \ it is a good programming practice to un-register a listener when the value is\
    \ no longer needed by using removeListener(ChangeListener<? super T> listener)\
    \ method, which removes the link between an observable value and a listener.\n\
    \nStackPane inherits width and height properties from javafx.scene.layout.Region\
    \ class. Both properties are type of ReadOnlyProperty, an abstract class implements\
    \ ObservableValue interface. As the name reveals, ObservableValue holds a value\
    \ that are observable, you can listen to the change of value and take actions\
    \ as necessary.\n\nThe following code demonstrates how to resize event of image\
    \ rendering area, a StackPane placed in the center of a BorderPane.\n\nImport\
    \ Statements:\n\n```\nimport javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
    ```\n\nListing 1-2. Add listeners to width and height property of image rendering\
    \ area:\n\n```\nimageArea.widthProperty().addListener(new ChangeListener<Object>(){\n\
    \    public void changed(ObservableValue o, Object oldVal,\n        Object newVal)\
    \ {\n        System.out.format(\"imageArea width changed from %f to %f%n\",\n\
    \            oldVal, newVal);\n    }\n});\n```"
