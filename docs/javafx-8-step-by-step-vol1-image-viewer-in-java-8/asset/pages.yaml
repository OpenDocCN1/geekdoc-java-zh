  md: '# 1.1 Create ImageViewer Class as Subclass of Application


    The graphical interfaces of a JavaFX application are managed in hierarchical tree
    structure, called a scene graph. In ImageViewer application, we employ a BorderPane
    as the root node of a scene graph, and place a StackPane in the center of BorderPane
    as image rendering. Both BorderPane and StackPane are among build-in layout panes,
    in javafx.scene.layout package and are direct subclasses of javafx.scene.layout.Pane
    class.


    BorderPane class allows you to create graphical user interfaces featuring classic
    look-and-feel main means. In the next section youll see a menu bar at the top
    of BorderPane, and in the later a status bar at the bottom.


    StackPane lays out its children in a stack, placing the later child at the top
    of previous one. In ImageViewer application, since only image is viewed at one
    time, the StackPane has only one child. If the size of an image is smaller than
    the size of StackPane, the image is placed in the center of StackPane. If the
    size of an image is larger than that of StackPane, StackPane is expanded automatically
    to accommodate the whole image, and if the viewing space in the application window
    is not large enough, only center portion of the image is visible by default. Later
    we''ll demonstrate how to avoid a StackPane being resized by its content, here.


    A Scene object is created as the container of a scene graph, given a parameter.
    In ImageViewer application, the root node is a BorderPane, and initial width and
    height of the Scene is set to 600 pixels and 400 pixels. Both BorderPane and StackPane
    are sizeable layout panes; therefore, if the application window is dynamically
    resized by a user, the scene is resized and a resize event is passed to its root
    node, re-calculating of the size of image rendering accordingly.


    You place a scene on a Stage to make it alive, using the setScene method defined
    in Stage class. Stage is a direct subclass of javafx.stage.Window; it is the top-level
    window of a JavaFX application.


    JavaFX system creates a Stage object, referred as primary stage, and passed to
    the start method, an abstract method defined in Application class. Developers
    can construct additional Stage objects as needed for their applications.


    The following codes demonstrate how to create ImageViewer class as a direct subclass
    of Application, and override the start method. Here are codes:


    Listing 1-1. Create ImageViewer class which extends Application class, override
    start method, create BorderPane as the root node of a scene, and place StackPane
    in the center of BorderPane as image rendering area:


    ![](img/27e7b2efbff71bf5e123da46e585606e_35_0.png)'
