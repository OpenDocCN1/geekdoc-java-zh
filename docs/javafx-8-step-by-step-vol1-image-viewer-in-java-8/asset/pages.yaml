  md: "# 3.3.2.3 Implement Event Handlers of Action Events for Start Slideshow and\
    \ Stop Slideshow Menu Items\n\nThe scenario follows the action of Start Slideshow\
    \ is like this: when a user clicks the Start Slideshow menu item, the service\
    \ is started, its state transits from READY to SCHEDULED to RUNNING, the value\
    \ ofisSlideshow property is changed to true as soon as the service is transitioned\
    \ to RUNNING(here), and Stop Slideshow menu item's disable status is changed to\
    \ false as a result(here)\n\nWe are using the void start() method provided in\
    \ Service class to start a service. It is called from the event handler that handles\
    \ action event of Start Slideshow menu item. It is important to check the state\
    \ of a service before invoking start() method, this is to ensure a service is\
