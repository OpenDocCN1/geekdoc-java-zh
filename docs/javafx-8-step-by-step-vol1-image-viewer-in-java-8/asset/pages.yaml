  md: '+   BooleanExpression class, resides in javafx.beans.binding package, is an
    abstract class that implements ObservableBoolean, an interface that extends Observable<java.lang.Boolean>.
    Convenience methods that perform logical operations like AND, OR, and NOT are
    provided in BooleanExpression class.

    (See here)


    +   Some convenience methods from BooleanExpression class:

    BooleanBinding not()

    performs the logical NOT operation on this BooleanExpression, and returns an object
    of type BooleanBinding which is a direct subclass of BooleanExpression


    BooleanBinding or(ObservableBooleanValue other)

    performs the logical OR operation on BooleanExpression and the given ObservableBooleanValue,
    and returns an object of type BooleanBinding which is a direct subclass of BooleanExpression


    (See here)


    +   Worker<V> is an interface resides in javafx.concurrent package, it defines
    common APIs for implementation of concurrency.

    (See section Execute Slide Show on Thread)


    +   Classes for concurrency, reside in javafx.concurrent package:

    Task

    An abstract class implements Worker<V> interface, is a one-time Worker object.


    Service

    An abstract class implements Worker<V> interface, is a reusable Worker object.


    ScheduledService

    A direct subclass of Service class, allows specifying the duration of delay to
    start and restart a service automatically.


    WorkerStateEvent

    A subclass of javafx.event.Event, defines static fields of event type such as
    WORKER_STATE_CANCELLED, WORKER_STATE_FAILED, WORKER_STATE_READY, WORKER_STATE_RUNNING,
    WORKER_STATE_SUCCEEDED, etc. A WorkerStateEvent occurs when the state of a Worker
    is twisted.


    (See section Execute Slide Show on Thread)'
