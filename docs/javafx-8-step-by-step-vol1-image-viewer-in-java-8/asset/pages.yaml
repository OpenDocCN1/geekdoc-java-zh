    # # Creating User Interfaces using FXML


    FXML is a markup language which coincides with the XML (Extensible Markup Language)
    format, with additional rules, for creating user interfaces of JavaFX applications.
    Considering hand coding FXML is error prone, a feasible approach is to generate
    FXML codes by means of GUI builders.


    It is considered a good programming practice to separate application''s GUIs (the
    View) from its business logic (the Model). The FXML file represents the view,
    while controller is a java class which passes information between view and model.
    Constructing GUIs using FXML enables application developers to adopt the MVC (Model-View-Controller)
    architecture effectively.


