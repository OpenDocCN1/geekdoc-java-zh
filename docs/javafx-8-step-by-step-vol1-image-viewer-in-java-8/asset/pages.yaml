  md: "# 1.2 Create Menu Bar\n\nIn this section, we are creating a Menu, adding it\
    \ at the top of BorderPane which is the root node of a scene graph.\n\nGenerally\
    \ a Menu object contains multiple Menu laying out horizontally, and each Menu\
    \ contains multiple MenuItems. Since Menu class extends MenuItem class, you can\
    \ place a Menu within a Menu, the nested one is called a submenu. As a Menu is\
    \ rendered on a window, that a user sees names of menus only, the content of each\
    \ menu is hidden until the mouse's left button clicked on a menu name, or the\
    \ mnemonic key combination which defined as shortcut keys for the menu is.\n\n\
    The benefits for employing menu user interface include the following:\n\n+   -\
    \ Require less space\n  A menu only occupies the space for its name when it is\
    \ not in need by a user.\n- Organizable capability\n  To facilitate the accessibility,\
    \ you organize menu items in a structure according to functionality, grouping\
    \ the menu items that are alike in a same menu, avoiding overcrowding one menu\
    \ by submenus, and placing the most frequently requested menu items in upper levels.\
    \ on the top level of the tree.\n- Invoke action by one keystroke\n  You can use\
    \ mnemonic mechanism to navigate menus within a MenuBar and define shortcut keys\
    \ to enable users to invoke the action of a MenuItem by one keystroke. For example,\
    \ press Alt and F keys at the same time to show File menu and press Ctrl and S\
    \ keys at the same time to perform file action.\n\nAdd a Menu to a MenuBar, first\
    \ we call the getMenus() method, which returns an ObservableList of Menus. The\
    \ ObservableList is a subinterface of java.util.List, then we use the add method,\
    \ one of the basic utilities in Java Collection interface, to add a menu to the\
    \ list. The codes are as follows:\n\nListing 1-4. Add a Menu to a MenuBar:\n\n\
    ```\nMenuBar menuBar = new MenuBar();\nMenu menuItem = new Menu(\"File\");\nmenubar.getMenus().add(menuFile);\n\
