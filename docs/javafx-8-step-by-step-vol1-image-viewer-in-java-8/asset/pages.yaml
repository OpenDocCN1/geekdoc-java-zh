  md: "# 3.4 Add Fade Transition between Slides\n\nTo accent the movement of a slide\
    \ show, we'll add fade transition between slides. Here are classes from javafx.animation\
    \ package for animations of fade transitions:\n\n+   - Animation\n  An abstract\
    \ class extends java.lang.Object, provides common properties and methods required\
    \ among animations.\n\n+   - Transition\n  An abstract class extends Animation,\
    \ provides common properties and methods required among transition animations.\
    \ Here are available transitions: FadeTransition, FillTransition, ParallelTransition,\
    \ PathTransition, PauseTransition, RotateTransition, ScaleTransition, SequentialTransition,\
    \ StrokeTransition, TranslateTransition.\n\n+   - FadeTransition\n  A direct subclass\
    \ of Transition . changes the opacity of a node over the given duration.\n\n+\
    \   - ParallelTransition\n  A direct subclass of Transition, conducts transitions\
    \ over a list of Animation objects, type of ObservableList<Animation>, in a parallel\
    \ manner.\n\nThis is the constructor we'll use to create FadeTransition objects:\n\
    \n```\npublic FadeTransition(Duration duration, Node node)\n```\n\nDuration class,\
    \ resides in javafx.util package, provides several factory methods for creating\
    \ duration objects. Here's the one employed:\n\n```\npublic static Duration millis(double\
    \ ms)\n```\n\nThe above method creates a Duration of given milliseconds for a\
    \ FadeTransition. A FadeTransition looks into the following properties:\n\n+ \
    \  - duration\n  Type of ObjectProperty<Duration>, holds the duration of transitioning\
    \ the opacity fromValue toValue. The value of this property is specified as the\
    \ first argument of the constructor.\n\n+   - node\n  Type of ObjectProperty<Node>,\
    \ holds the target node conducted for this fade transition. The value of this\
    \ property is specified as the second argument of the constructor."
