  md: "# 2.4.2 Create List Iterator to Iterate Existing Files in the Current Directory\n\
    \nTo establish a list of files exists in the current directory whenever an image\
    \ file is opened from a File Open Dialog, we'll use API's provided in java.nio.file\
    \ package which is introduced in the JDK 7 release.\n\nThe following static method\
    \ provided in java.nio.file.Files,\nstatic DirectoryStream<Path> newDirectoryStream(Path\
    \ dir, String glob) opens a given directory, returning a DirectoryStream<Path>.\
    \ The type DirectoryStream is an interface which extends iterable, thus can be\
    \ applied with the for-each syntax to iterate files in a directory.\n\nHere's\
    \ the snippet of code to read a directory and add one by one to list:\n\n```\n\
    List<Path> list = new ArrayList<>();\n\ntry (DirectoryStream<Path> stream = Files.newDirectoryStream(dir,\n\
    \      \"*.bmp,gif,jpeg,jpg,png\")) {\n  for (Path entry : stream) {\n    // ignore\
    \ subdir inside dir\n    if (Files.isDirectory(entry, LinkOption.NOFOLLOW_LINKS))\n\
    \      continue;\n    list.add(entry);\n  }\n} catch (DirectoryIteratorException\
    \ de) {\n  throw de.getCause();\n}\n```\n\nThe followings are the complete codes\
    \ of the static method listIterator which reads the files, adds one by one to\
    \ a List, sorts files in alphabetical order, and return a ListIterator that points\
    \ to the next available file in the directory. The method is in FileUtils class.\n\
    \n# Import Statements:\n\n```\nimport java.io.IOException;\nimport java.nio.file.DirectoryIteratorException;\n\
    import java.nio.file.DirectoryStream;\nimport java.nio.file.Files;\nimport java.nio.file.LinkOption;\n\
    import java.nio.file.Path;\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    import java.util.Comparator;\nimport java.util.List;\nimport java.util.ListIterator;\n\
