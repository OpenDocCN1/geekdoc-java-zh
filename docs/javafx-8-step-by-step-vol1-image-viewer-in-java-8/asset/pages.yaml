  md: '# 2.2 Adjust Next Button’s Default Position in StackPane


    In this section, we will demonstrate how to place a child node of a StackPane
    in the desired location.


    A StackPane places all its children in a stack with the center as default alignment.
    That is, by default StackPane’s children overlap each other in the center of the
    pane.


    Placing a Next button in the center of a StackPane is not feasible in our application.
    Fortunately, StackPane provides two static methods:


    ```

    public static void setAlignment(Node child, Pos value)

    public static void setMargin(Node child, Insets value)

    ```


    allowing us to adjust individual child node’s position. The preferred position
    of a Next button is on the right side of the window, within the visible boundary
    of a scene. The following snippets of codes adjust the default location of a next
    button.


    Import Statement:


    ```

    import javafx.geometry.Insets;

    import javafx.geometry.Pos;

    ```


    **Listing 2-6.** Use StackPane’s static methods setAlignment and setMargin to
    adjust the default position of a Next button:


    ```

    StackPane.setAlignment(nextButton, Pos.CENTER_RIGHT)

    StackPane.setMargin(nextButton, new Insets(8));

    ```


    The following snapshot shows a Next button positioned on the right side of application
    window.


    **Figure 2-6.** Snapshot of a Next button on the right side of window, within
    the visible boundary of a scene.'
