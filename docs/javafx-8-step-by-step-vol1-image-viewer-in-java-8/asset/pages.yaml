    # 1.4.1.2 Implement Fit Height Viewing option


    If Fit Height is selected as viewing option, we''ll have fitHeight property of
    ImageView with height property of Scene, subtracting height of menu bar, and unbind
    fitHeight property.


    We are using subtract method to calculate the available viewing height for an
    image. The subtract(double other) method, which inherited from DoubleExpression
    class by DoubleProperty class, returns a new NumberBinding object that calculates
    the difference of this NumberExpression and the given constant value. Here are
    codes:


    **Listing 1-13.** bind FitHeight property of ImageView with height property of
    Scene, subtracting height of menu bar:


    ```

    // Available height for rendering image

    // subtract menubar''s height from scene

    imageView.fitHeightProperty().bind(scene.heightProperty().subtract(menuBar.getHeight()));nView.fitWidthProperty().unbind();

    // Besides unbind, must also set width to 0

    imageView.setWidth(0);

    ```


    # 1.4.1.3 Implement Original Size Viewing Option


    If Original Size is selected as viewing option, we''ll have fitWeight property
    as well as fitHeight property of the ImageView unbind. Here are codes:


    **Listing 1-14.** Unbind fitWidth property as well as fitHeight property of the
    ImageView object:


    ```

    imageView.fitWidthProperty().unbind();

    imageView.fitHeightProperty().unbind();

    // Besides unbind, must also set fit height/height to 0

    imageView.setWidth(0);

    imageView.setHeight(0);

    ```


    Please note that, changing values of fitWidth/fitHeight properties of an ImageView
    object doesn''t affect width/height properties of the underlying object. Properties
    of the Image object, as width and height, are staying intact while properties
    relevant to viewing options of the ImageView are altering dynamically by a user.


    The advantage of one approach is that you don''t need to register an event handler
    to response to resizing event of a Scene. When the application window is resized
    dynamically, the Scene is resized, accordingly the corresponding properties of
    the'
