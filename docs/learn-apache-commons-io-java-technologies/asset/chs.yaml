- "# Learn Apache Commons IO [Java 技术]\n\n\n\n![](img/cover.jpeg)\n\n\n我想将这本书献给使用它的学生们。祝愿你们未来职业成功，并希望你们永停止学习。\n\
  \n# 目录\n\n- 概述\n- 环境搭建\n- IOUtils\n- FileUtils\n- FilenameUtils\n- FileSystemUtils\n\
  - IOCase\n- LineIterator\n- NameFileFilter\n- WildcardFileFilter\n- SuffixFileFilter\n\
  - PrefixFileFilter\n- OrFileFilter\n- AndFileFilter\n- FileEntry\n- FileAlterationObserver\n\
  - FileAlterationMonitor\n- NameFileComparator\n- SizeFileComparator\n- LastModifiedFileComparator\n\
  - TeeInputStream\n- TeeOutputStream\n\n# 概述\n\nApache Commons IO 库提供了各种工具类，用于涵盖广泛用例的常见文件\
  \ I/O 操作。它可以帮助避免编写样板代码。Apache Commons IO 库提供了以下类别的类：\n\n## 类\n\nApache Commons IO\
  \ 库提供了以下类别的类：\n\n字体 工具类\n\n`org.apache.commons.io` 包下的这些类提供了文件和字符串比较。以下是某些示例。\n\n\
  * `IOUtils` ― 提供了读取、写入和拷贝文件的工具方法。这些方法适用于 `InputStream`、`OutputStream`、`Reader` 和\
  \ `Writer`。\n* `FilenameUtils` ― 提供了在不使用 `File` 对象的情况下处理文件名的方法。它在不同的操作系统上以类似的方式工作。\n\
  * `FileUtils` ― 提供了操作文件的方法，如移动、打开、检查存在性、读取文件等。这些方法使用 `File` 对象。\n* `IOCase` ― 提供了字符串操作和比较的方法。\n\
  * `FileSystemUtils` ― 提供了获取磁盘驱动器上可用空间的方法。\n* `LineIterator` ― 提供了一种了一种处理基于行的文件的灵活方式。\n\
  \n### 过滤器类\n\n`org.apache.commons.io.filefilter` 包下的过滤器类提供了根据逻辑标准过滤文件的方法，而不是基于字符串的繁琐比较。以下是某些示例。\n\
  \n* `NameFileFilter` ― 根据名称过滤文件名。\n* `WildcardFileFilter` ― 使用提供的通配符过滤文件。\n* `SuffixFileFilter`\
  \ ― 根据后缀过滤文件。这用于检索所有特定类型的文件。\n* `PrefixFileFilter` ― 根据前缀过滤文件。\n* `OrFileFilter`\
  \ ― 在文件过滤器列表之间提供条件或（OR）逻辑。如果列表中的任何过滤器返回 true，则返回 true。否则，返回 false。\n* `AndFileFilter`\
  \ ― 在文件过滤器列表之间提供与（AND）逻辑。如果列表中的任何过滤器返回 false，则返回 false。否则，返回 true。\n\n### 文件监控类\n\
  \n`org.apache.commons.io.monitor` 包下的文件监控类提供了跟踪特定文件或文件夹变化的控制，并允许根据更改采取相应。以下是某些示例。\n\
  \n* `FileEntry` ― 提供了文件或目录在某一时刻的状态，即 `File` 属性。\n* `FileAlterationObserver` ― 代表根目录下的文件状态，检查文件系统并通知监听器创建、更改或删除事件。\n\
  * `FileAlterationMonitor` ― 代表一个产生监控线程的线程，触发任何已注册的 `FileAlterationObserver`。\n\n\
  ### 比较器类\n\n文件监控类跟踪特定的文件或文件夹。以下是示例。\n\n* `NameFileComparator` ― 比较文件名。\n* `SizeFileComparator`\
  \ ― 比较文件大小。\n* `LastModifiedFileComparator` ― 比较最后修改时间。\n\n### 输入流类\n\n`org.apache.commons.io.input`\
  \ 包下的这些类提供了多种实现。以下是某些示例。\n\n* `NullInputStream` ― 吸收所有数据。\n* `TeeInputStream` ―\
  \ 将输出发送到两个流。\n* `ByteArrayInputStream` ― JDK 的版本。\n* `CountingInputStream` ― 计数字节数。\n\
  * `CountingInputStream` ― 计数字节数。\n* `ProxyInputStream` ― 更改代理流。\n* `LockableInputStream`\
  \ ― 创建锁并。\n\n# 环境搭建\n\n在本章中，我们将学习 Apache Commons IO 的本地设置以及如何设置 Windows 2000/XP、Windows\
  \ ME 等。我们还将了解一些 Java 编辑器以及如何下载 Commons IO。\n\n## 本地设置\n\n如果你仍然愿意为 Java 设置环境，本节将指导你如何设置。请按照下面的步骤设置。\n\
  \nJava SE 可以从 https://www.oracle.com/java/technologies/archiveddownloads.html 免费获取，根据你的操作系统下载。按照说明运行\
  \ `.exe` 在你的机器上安装 Java。一旦在机器上安装了 Java，你需要设置环境变量指向正确的目录 ―\n\n### Windows 2000/XP\n\
  \n我们假设你将 Java 安装在 `C:\\Program Files\\java\\jdk` 目录下\n\n* 右键点击“我的电脑”，选择“属性”。\n*\
  \ 点击“高级”选项卡下的“环境变量”按钮。\n* 现在，修改 `Path` 变量，使其也包含 Java 可执行文件的路径。例如，如果路径当前设置为 `C:\\\
  WINDOWS\\SYSTEM32`，请将路径更改为 `C:\\WINDOWS\\SYSTEM32;C:\\Program Files\\java\\jdk\\\
  bin`。\n\n### Windows 95/98/ME\n\n我们假设你将 Java 安装在 `C:\\Program Files\\java\\jdk`\
  \ 目录下\n\n* 编辑 `C:\\autoexec.bat` 文件，并在末尾添加以下行 `SET PATH=%PATH%;C:\\Program Files\\\
  java\\jdk\\bin`\n\n### Linux, UNIX, Solaris, FreeBSD\n\n环境变量 `PATH` 应指向 Java 安装位置。如果这样做有问题，请参考你的\
  \ shell 文档。\n\n例如，如果你使用 bash 作为你的 shell，那么你会在 `.bashrc` 的末尾添加以下行：\n\n```bash\nexport\
  \ PATH=/path/to/java:$PATH\n```\n\n## 流行的 Java 编辑器\n\n要编写 Java 程序，你需要一个文本编辑器。市场上有很多先进的集成开发环境\
  \ (IDE)。但目前，你可以考虑以下以下之一 ―\n\n* `Notepad` ― 在 Windows 机器上，你可以使用任何简单的文本编辑器，如记事本（本教程推荐）、TextPad。\n\
  \n\n\n\n\n* **Netbeans** — 这是一个开源且免费的 Java IDE，可以从 `https://www.netbeans.org/index.html`\
  \ 下载。\n* **Eclipse** — 同样也是一个由 eclipse 开源社区开发的 Java IDE，可以从 `https://www.eclipse.org/`\
  \ 下载。\n\n## 下载 Common IO 归包\n\n从 `commons-io-2.8.0-bin.zip` 下载最新版本的 Apache Common\
  \ IO jar 文件。在编写本教程时，我们已经下载了 `commons-io-2.8.0-bin.zip` 并将其复制到 `C:\\>Apache` 文件夹。\n\
  \n| OS | 存档名称 |\n| :--- | :--- |\n| Windows | `commons-io-2.6-bin.zip` |\n| Linux\
  \ | `commons-io-2.6-bin.tar.gz` |\n| Mac | `commons-io-2.6-bin.tar.gz` |\n\n## 设置\
  \ Apache Common IO 环境\n\n将 `APACHE_HOME` 环境变量指向机器上存储 Apache jar 文件的基础目录位置。假设我们已经在不同的操作系统上按如下方式解压了\
  \ `commonsio-2.8.0-bin.zip`。\n\n| OS | 输出 |\n| :--- | :--- |\n| Windows | 设置环境变量\
  \ `APACHE_HOME` 为 `C:\\Apache` |\n| Linux | `export APACHE_HOME=/usr/local/Apache`\
  \ |\n| Mac | `export APACHE_HOME=/Library/Apache` |\n\n## 设置 CLASSPATH 变量\n\n将 `CLASSPATH`\
  \ 环境变量指向 Common IO jar 位置。假设你已经在不同的操作系统上按如下方式存储了 `commons-io-2.8.0-bin.zip`。\n\n\
  | OS | 输出 |\n| :--- | :--- |\n| Windows | 设置环境变量 `CLASSPATH` 为 `%CLASSPATH%;%APACHE_HOME%\\\
  commons-io-2.6.jar;.;` |\n| Linux | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-io-2.6.jar:.`\
  \ |\n| Mac | `export CLASSPATH=$CLASSPATH:$APACHE_HOME/commons-io-2.6.jar:.` |\n\
  \n# IOUtils\n\n提供了读取、写入和复制文件的实用方法。这些方法适用于 `InputStream`、`OutputStream`、`Reader`\
  \ 和 `Writer`。\n\n## 类声明\n\n以下是 `org.apache.commons.io.IOUtils` 类的声明——\n\n```java\n\
  public class IOUtils\nextends Object\n```\n\n## IOUtils 的特性\n\n`IOUtils` 的特性如下：\n\
  \n* 提供输入/输出操作的静态实用方法。\n* `toXXX()` — 从流中读取数据。\n* `write()` — 将数据写入流。\n* `copy()`\
  \ — 将所有数据从一个流复制到另一个流。\n* `contentEquals` — 比较两个流的内容。\n\n## IOUtils 类示例\n\n这是我们需要解析的输入文件——\n\
  \nWelcome to TutorialsPoint. Simply Easy Learning.\n\nIOTester.java\n\n```java\n\
  import java.io.BufferedReader;\nimport java.io.FileInputStream;\nimport java.io.IOException;\n\
  import java.io.InputStream;\nimport java.io.InputStreamReader;\nimport org.apache.commons.io.IOUtils;\n\
  \npublic class IOTester {\n    public static void main(String[] args) {\n      \
  \  try {\n            //Using BufferedReader\n            readUsingTraditionalWay();\n\
  \            //Using IOUtils\n            readUsingIOUtils();\n        } catch (IOException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n    }\n\n  \
  \  // 使用 buffered reader 逐行读取文件\n    public static void readUsingTraditionalWay()\
  \ throws IOException {\n        try (BufferedReader bufferReader = new BufferedReader(new\
  \ InputStreamReader(\n                new FileInputStream(\"input.txt\")))) {\n\
  \            String line;\n            while ((line = bufferReader.readLine()) !=\
  \ null) {\n                System.out.println(line);\n            }\n        }\n\
  \    }\n\n    // 使用 IOUtils 一性读取文件\n    public static void readUsingIOUtils() throws\
  \ IOException {\n        try (InputStream in = new FileInputStream(\"input.txt\"\
  )) {\n            System.out.println(IOUtils.toString(in, \"UTF-8\"));\n       \
  \ }\n    }\n}\n```\n\n## 输出\n\n它将打印以下结果：\n\nWelcome to TutorialsPoint. Simply Easy\
  \ Learning.\nWelcome to TutorialsPoint. Simply Easy Learning.\n\n# FileUtils\n\n\
  提供了操作文件的方法，如移动、打开、检查存在性、读取文件等。这些方法使用 `File` 对象。\n\n## 类声明\n\n以下是 `org.apache.commons.io.FileUtils`\
  \ 类的声明——\n\n```java\npublic class FileUtils\nextends Object\n```\n\n## FileUtils\
  \ 的特性\n\n`FileUtils` 的特性如下：\n\n* 写入文件的方法。\n* 从文件读取的方法。\n* 创建包含父目录在内的目录的方法。\n* 复制文件和目录的方法。\n\
  * 删除文件和目录的方法。\n* 与 URL 方法的方法。\n* 按过滤器和扩展名列出文件和目录的方法。\n* 比较文件内容的方法。\n* 设置文件修改日期的方法。\n\
  * 计算校验和的方法。\n\n## FileUtils 类示例\n\n这是我们需要解析的输入文件——\n\nWelcome to TutorialsPoint.\
  \ Simply Easy Learning.\n\nIOTester.java\n\n```java\nimport java.io.BufferedReader;\n\
