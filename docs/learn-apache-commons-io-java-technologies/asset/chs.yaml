  \ on: Mon Nov 20 19:27:55 IST 2017\n\n# TeeInputStream\n\n它是一个 `InputStream` 代理，可以透明地将从代理流中读取的所有字节的副本写入给定的\
  \ `OutputStream`。当调用此此代理的 `close()` 方法时，被代理的输入流会被关闭。它可以同时共同操作两个流。\n\n## 类声明\n\n\
  以下是 `org.apache.commons.io.input.TeeInputStream` 类的声明−\n\n```java\npublic class\
  \ TeeInputStream\nextends ProxyInputStream\n```\n\n## `TeeInputStream` 类示例\n\n在此示例中，关闭一个\
  \ `TeeInputStream` 会同时关闭 `TeeInputStream` 和 `TeeOutputStream` 对象。\n\nIOTester.java\n\
  \n```java\nimport java . io . ByteArrayInputStream ;\nimport java . io . ByteArrayOutputStream\
  \ ;\nimport java . io . IOException ;\nimport org . apache . commons . io . input\
  \ . TeeInputStream ;\nimport org . apache . commons . io . output . TeeOutputStream\
  \ ;\n\npublic class IOTester {\n    private static final String SAMPLE = \"Welcome\
  \ to TutorialsPoint. Simply Easy Learning.\" ;\n    public static void main ( String\
  \ [] args ) {\n        try {\n            usingTeeInputStream ();\n        } catch\
  \ ( IOException e ) {\n            System . out . println ( e . getMessage ());\n\
  \        }\n    }\n\n    public static void usingTeeInputStream () throws IOException\
  \ {\n        TeeInputStream teeInputStream = null ;\n        TeeOutputStream teeOutputStream\
  \ = null ;\n        try {\n            ByteArrayInputStream inputStream = new ByteArrayInputStream\
  \ ( SAMPLE . getBytes ( \"US-ASCII\" ));\n            ByteArrayOutputStream outputStream1\
  \ = new ByteArrayOutputStream ();\n            ByteArrayOutputStream outputStream2\
  \ = new ByteArrayOutputStream ();\n            teeOutputStream = new TeeOutputStream\
  \ ( outputStream1 , outputStream2 );\n            teeInputStream = new TeeInputStream\
  \ ( inputStream , teeOutputStream , true );\n            teeInputStream . read (\
  \ new byte [ SAMPLE . length ()]);\n            System . out . println ( \"Output\
  \ stream 1: \" + outputStream1 . toString ());\n            System . out . println\
  \ ( \"Output stream 2: \" + outputStream2 . toString ());\n        } catch ( IOException\
  \ e ) {\n            System . out . println ( e . getMessage ());\n        } finally\
  \ {\n            //teeIn.close() closes teeIn and teeOut which in turn closes the\
  \ out1 and out2.\n            try {\n                teeInputStream . close ();\n\
  \            } catch ( IOException e ) {\n                System . out . println\
  \ ( e . getMessage ());\n            }\n        }\n    }\n}\n```\n\n## 输出\n\n它将打印以下结果。\n\
  \nOutput stream 1: Welcome to TutorialsPoint. Simple Easy Learning.\nOutput stream\
  \ 2: Welcome to TutorialsPoint. Simple Easy Learning.\n\n# TeeOutputStream\n\n`TeeOutputStream`\
