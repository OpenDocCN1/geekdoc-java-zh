  \ 对文件名是不区分大小写的，而 Unix 是区分大小写的。`IOCase` 捕获了这种差异，提供了一个枚举来控制如何执行文件名比较。它还提供了使用该枚举来执行比较的方法。\n\
  \n## 枚举声明\n\n以下是 `org.apache.commons.io.IOCase` 枚举的声明 −\n\n```java\npublic enum\
  \ IOCase\nextends Enum < IOCase > implements Serializable\n```\n\n## IOCase 枚举示例\n\
  \n以下是 `IOCase` 枚举的示例 −\n\n```java\nIOTester.java\n\nimport java . io . IOException\
  \ ;\n\nimport org . apache . commons . io . IOCase ;\n\npublic class IOTester {\n\
  \    public static void main ( String [] args ) {\n        try {\n            usingIOCase\
  \ ();\n        } catch ( IOException e ) {\n            System . out . println (\
  \ e . getMessage ());\n        }\n    }\n\n    public static void usingIOCase ()\
  \ throws IOException {\n        String text = \"Welcome to TutorialsPoint. Simply\
  \ Easy Learning.\" ;\n        String text1 = \"WELCOME TO TUTORIALSPOINT. SIMPLY\
  \ EASY LEARNING.\" ;\n        System . out . println ( \"Ends with Learning (case\
  \ sensitive): \" +\n        IOCase . SENSITIVE . checkEndsWith ( text1 , \"Learning.\"\
  \ ));\n        System . out . println ( \"Ends with Learning (case insensitive):\
  \ \" +\n        IOCase . INSENSITIVE . checkEndsWith ( text1 , \"Learning.\" ));\n\
  \        System . out . println ( \"Equality Check (case sensitive): \" +\n    \
  \    IOCase . SENSITIVE . checkEquals ( text , text1 ));\n        System . out .\
  \ println ( \"Equality Check (case insensitive): \" +\n        IOCase . INSENSITIVE\
  \ . checkEquals ( text , text1 ));\n    }\n}\n```\n\n## 输出\n\n它将打印以下结果。\n\nEnds\
  \ with Learning (case sensitive): false\nEnds with Learning (case insensitive):\
  \ true\nEquality Check ( case sensitive): false\nEquality Check ( case insensitive):\
  \ true\n\n# LineIterator\n\n提供了一种处理基于行的文件的灵活方法。\n\n## 类声明\n\n以下是 `org.apache.commons.io.LineIterator`\
