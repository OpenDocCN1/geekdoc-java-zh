    # LastModifiedFileComparator


    Compare the last modified dates of two files/directory. LastModifiedFileComparator
    can be used to sort lists or arrays of files/directories using their last modified
    dates.


    ## Class Declaration


    Following is the declaration for **org.apache.commons.io.comparator.LastModifiedFileComparator**
     Class −


    public class LastModifiedFileComparator


    extends Object implements Serializable


    ## Example of LastModifiedFileComparator Class


    Here is the input file we need to parse −


    Welcome to TutorialsPoint. Simply Easy Learning.


    IOTester.java


    import java . io . File ;


    import java . io . FileFilter ;


    import java . io . IOException ;


    import java . util . Date ;


    import org . apache . commons . io . comparator . LastModifiedFileComparator ;


    import org . apache . commons . io . filefilter . FileFileFilter ;


    public class IOTester {


    public static void main ( String [] args ) {


    try {


    usingLastModifiedFileComparator ();


    } catch ( IOException e ) {


    System . out . println ( e . getMessage ());


    }


    }


    public static void usingLastModifiedFileComparator () throws IOException {


    //get the current directory


    File currentDirectory = new File ( "." );


    LastModifiedFileComparator comparator = new LastModifiedFileComparator ();


    File [] sortedFiles = comparator . sort ( currentDirectory . listFiles (( FileFilter
    ) FileFileFilter . FILE ));


    System . out . println ( "Sorted By Last Modified date: " );


    for ( File file : sortedFiles ) {


    System . out . println ( file . getName () + ", Modified on: " + new Date ( file
    . lastModified ()));


    }


    }


    }


    ## Output


