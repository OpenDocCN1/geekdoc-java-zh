    # Overview


    Apache Commons IO library provides various utility classes for common operations
    for File IO covering wide range of use cases. It helps avoid writing boilerplate
    code. Apache Commons IO library provides classes for following categories −


    ## Classes


    Apache Commons IO library provides classes for following categories −


    ### Utility classes


    These classes under `org.apache.commons.io` package provides file and string comparison.
    Following are some of the examples.


    * `IOUtils` ― Provides utility methods for reading, writing and copying files.
    The methods works with `InputStream`, `OutputStream`, `Reader` and `Writer`.

    * `FilenameUtils` ― Provides method to work with file names without using `File`
    Object. It works on different operating systems in similar way.

    * `FileUtils` ― Provides method to manipulates files like moving, opening, checking
    existence, reading of file etc. These methods use `File` Object.

    * `IOCase` ― Provides method for string manipulation and comparison.

    * `FileSystemUtils` ― Provides method to get the free space on a disk drive.

    * `LineIterator` ― Provides a flexible way to work with a line-based file.


    ### Filter classes


    Filter classes under `org.apache.commons.io.filefilter` package provides methods
    to filter files based on logical criteria instead of string based tedious comparisons.
    Following are some of the examples.


    * `NameFileFilter` ― Filters file-names for a name.

    * `WildcardFileFilter` ― Filters files using the supplied wildcards.

    * `SuffixFileFilter` ― Filters files based on suffix. This is used in retrieving
    all the files of a particular type.

    * `PrefixFileFilter` ― Filters files based on prefix.

    * `OrFileFilter` ― Provides conditional OR logic across a list of file filters.
    Returns true if any filters in the list return true. Otherwise, it returns false.

    * `AndFileFilter` ― Provides conditional And logic across a list of file filters.
    Returns false if any filters in the list return false. Otherwise, it returns true.


    ### File Monitor classes


    File monitor classes under `org.apache.commons.io.monitor` package provides control
    to track changes in a specific file or folder and allows to do action accordingly
    on the changes. Following are some of the examples.


    * `FileEntry` ― Provides the state of a file or directory, `File` attributes at
    a point in time.

    * `FileAlterationObserver` ― Represents the state of files below a root directory,
    checks the filesystem and notifies listeners of create, change or delete events.

    * `FileAlterationMonitor` ― Represents a thread that spawns a monitoring thread
    triggering any registered `FileAlterationObserver` at a specified interval.


    ### Comparator classes


    File monitor classes under `org.apache.commons.io.comparator` allow to compare
    and sort files and directories easily.


    * `NameFileComparator` ― Compare the names of two files.

    * `SizeFileComparator` ― Compare the size of two files.

    * `LastModifiedFileComparator` ― Compare the last modified dates of two files.


    ### Stream classes


    There are multiple implementation of `InputStream` under `org.apache.commons.io.input`
    package and of `OutputStream` under `org.apache.commons.io.output` package to
    do useful tasks on streams. Following are some of the examples.


    * `NullOutputStream` ― Absorbs all data sent with any error.

    * `TeeOutputStream` ― Sends output to two streams.

    * `ByteArrayOutputStream` ― Faster version of JDK.

    * `CountingOutputStream` ― Counts the number of bytes through the stream.

    * `CountingOutputStream` ― Counts the number of bytes through the stream.

    * `ProxyOutputStream` ― Changes the calls to proxied stream.

    * `LockableFileWriter` ― A FileWriter to create lock and allow cross thread.


    # Environment Setup


    In this chapter, we will learn about the local setup of Apache Commons IO and
    how to set the path for Windows 2000/XP, Windows 95/ME etc. We will also understand
    about some java editors and how to download Commons IO.


    ## Local Environment Setup


    If you are still willing to set up your environment for Java programming, then
    this section guides you on how to set up. Please follow the steps below to set
    up the environment.


    Java SE is freely available from the link https://www.oracle.com/java/technologies/archiveddownloads.html
    you download a version based on your operating system. Follow the instructions
    to download Java and run the `.exe` to install Java on your machine. Once you
    have installed Java on your machine, you would need to set environment variables
    to point to correct directories ―


    ### Path for Windows 2000/XP


    We are assuming that you have installed Java in `C:\Program Files\java\jdk` directory
    ―


    * Right-click on ''My Computer'' and select ''Properties''.

    * Click on the ''Environment variables'' button under the ''Advanced'' tab.

    * Now, alter the `Path` variable so that it also contains the path to the Java
    executable. Example, if the path is currently set to `C:\WINDOWS\SYSTEM32`, then
    change your path to `C:\WINDOWS\SYSTEM32;C:\Program Files\java\jdk\bin`.


    ### Path for Windows 95/98/ME


    We are assuming that you have installed Java in `C:\Program Files\java\jdk` directory
    ―


    * Edit the `C:\autoexec.bat` file and add the following line at the end ― `SET
    PATH=%PATH%;C:\Program Files\java\jdk\bin`


    ### Path for Linux, UNIX, Solaris, FreeBSD


    Environment variable `PATH` should be set to point to where the Java binaries
    have been installed. Refer to your shell documentation if you have trouble doing
    this.


    Example, if you use bash as your shell, then you would add the following line
    to the end of your `.bashrc`:


    ```bash

    export PATH=/path/to/java:$PATH

    ```


    ## Popular Java Editors


    To write your Java programs, you need a text editor. There are many sophisticated
    integrated development environment (IDEs) available in the market. But for now,
    you can consider one of the following ―


    * `Notepad` ― On Windows machine you can use any simple text editor like Notepad
    (Recommended for this tutorial), TextPad.

