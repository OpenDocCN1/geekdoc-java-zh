    \ teeOutputStream = null ;\n        try {\n            ByteArrayInputStream inputStream\
    \ = new ByteArrayInputStream ( SAMPLE . getBytes ( \"US-ASCII\" ));\n        \
    \    ByteArrayOutputStream outputStream1 = new ByteArrayOutputStream ();\n   \
    \         ByteArrayOutputStream outputStream2 = new ByteArrayOutputStream ();\n\
    \            teeOutputStream = new TeeOutputStream ( outputStream1 , outputStream2\
