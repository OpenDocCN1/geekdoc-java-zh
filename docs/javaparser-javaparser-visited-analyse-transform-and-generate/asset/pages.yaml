  md: '# Pretty Printing and Lexical Preservation


    You can use JavaParser for different purposes. Two of the most common are are
    code generation and code transformation. In both cases you end generating Java
    code, probably to store it in a file with the `java` extension.


    A simple call to `toString()` on your `CompilationUnit` will return a `String`
    that you can use to write your source. The question we are posed is: *how will
    it format the code from your AST*?


    The answer is one of two ways:


    +   - using pretty-printing

    - lexical-preserving printing


    So let''s consider how they differ.


    # What is Pretty-Printing?


    Pretty-printing means that when we write our code out as source, the textual representation
    is printed in a nicely formatted and standard way.


    For example, if you were to parse an existing java class that looks like:


    ```

    class A {

    int a;

    }

    ```


    Then later you decide to pretty-print it using JavaParser you would get following
    representation of the code:


    ```

    class A {

    int a;

    }

    ```'
  merge: -1
