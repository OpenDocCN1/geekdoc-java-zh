  md: "Comment parsing is enabled by default, if you decide you wish to disable it,\
    \ you can provide an instance of a ParserConfiguration with setAttributeComments\
    \ to false. Doing so will lead to faster parsing, although this will be unnoticed\
    \ when working with single source files, but is worth remembering if you are looking\
    \ to parse large numbers of files.\n\n```\nParserConfiguration parserConfiguration\
    \ = new ParserConfiguration()\n.setAttributeComments(false);\nStaticJavaParser.setConfiguration(parserConfiguration);\n\
    ```\n\n# ConfigurationOptions.java\n\nThe second option available to allows you\
    \ to control whether or not to consider comments precede a line space.\nConsider\
    \ the following code:\n\n```\nclass A {\n  // Blah\n  boolean f() { return false\
    \ }\n}\n```\n\nIn this instance the comment // Blah will be attributed to the\
    \ method f providing comment attribution is enabled.\nDoes it belong to the method,\
    \ or is it describing what is going to happen in subsequent lines? Like many things,\
    \ the answer is probably “it depends”.\nThe alternative behaviour offered by JavaParser\
    \ is to attribute the comment to the containing node. In the case for the Class\
    \ A, and will appear as an entry in the orphanComments list.\nBy default, the\
    \ parser will use the former behaviour of attributing the comment to the next\
    \ node. If you would prefer it to be considered as an orphan, use the following\
    \ configuration.\n\n```\nParserConfiguration parserConfiguration = new ParserConfiguration()\n\
    .setDoNotAssignCommentsPrecedingEmptyLines(true);\n```\n\n# ConfigurationOptions.java"
