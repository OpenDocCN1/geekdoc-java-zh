    \ class which takes a InputStream using the file path previously defined.\n\n\
    Although there is no output, if you have completed all the previous steps correctly,\
    \ executing main successfully. Try it now.\n\nOnce we have a compilation unit\
    \ to work with we can define our first visitor. Our visitor is to extend a class\
    \ named VoidVisitorAdaptor.\n\nAlthough that sounds like an odd name we can break\
    \ down into its constituent parts. The Void we're not expecting the visitor to\
    \ return, i.e. this visitor may produce a side effect, but will not operate on\
    \ the underlying tree. There are other types of visitors that will do this, which\
    \ we will come to.\n\nThe Adaptor refers to the class being part of an adapter\
    \ pattern, which provides default implementations of the Visitor interface, which\
    \ accepts around 90 different types as arguments (Appendix B for the list). So\
    \ defining your own visitor you will need to override the visit method for the\
    \ type you are interested in. In practice, this means you only need to define\
    \ the methods for nodes you are interested in (e.g. field declarations); the functions\
    \ inherited from VoidVisitorAdaptor will handle the recursion through the tree\
    \ of the compilation unit's abstract syntax tree. If you were instead to implement\
