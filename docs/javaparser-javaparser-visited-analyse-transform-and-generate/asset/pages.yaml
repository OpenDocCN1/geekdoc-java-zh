    Each of these is an instance of ReferenceTypeDeclaration. That class has many
    methods to access a rich model of the type. You can find all the ancestors, inherited
    methods and fields, annotations, which types it can be assigned to and manage.


    Note that it does not matter which TypeSolver you are using: if your class has
    been found through reflection from parsing a source file or from a JAR, JavaSymbolSolver
