  md: '# A Brief Introduction to Abstract Syntax Trees


    There are a few simple rules that govern what a tree is. With the exception of
    the root node, all nodes will have exactly one incoming relationship. The root
    node will have zero. All nodes can have to many outgoing relationships. Those
    nodes with zero outgoing relationships are considered to be leaf nodes and not
    parents. Conversely, those nodes with outgoing relationships are considered to
    be both a branch and a parent of one or more child nodes.


    When a node has children, in the case of the object model created by JavaParser,
    this is simply represented as a List<Node> called childNodes on the Node class.


    The vocabulary of trees also leaves further on definitions: nodes with the same
    parents are siblings. Ancestor and descendant are also used when nodes can be
    related by navigating up or down the tree. Thus all nodes are a descendant of
    the root node.


    In order to model this within the Java language concepts you work with MethodDeclaration,
    Statement, Parameter etc. will be descendants (in the object oriented sense) of
    the Node class in the JavaParser library. For the most part, JavaParser has tried
    to remain true to the names defined within the official grammar specification
    for the naming of the classes.


    # When is a node, and not a node?


    Usually when it is a property of another node.


    In addition to having a particular type to describe the language concept they
    represent e.g. MethodDeclaration nodes should have properties to describe their
    characteristics. Line numbers are a good example of this, for all the nodes in
    an AST, when parsing the library will document the line number of each node.


    If we consider a MethodDeclaration, it will have child nodes that represent its
    name, its argument parameters (if it has), its type, what it returns and its body.
    About other language keywords we can use to define a method e.g. final, static,
    abstract etc? Well, these are defined as a modifier property on the MethodDeclaration
    itself.


    Could we separate node entities in their own right, rather than a property? Yes.
    Like most things it was a design choice to represent them in this way, and you
    will find supporters to argue either case.


    # Growing our first tree


    In order to firm up the intuition for what has been a fairly abstract discussion,
    we''re going to look at a graphical representation of what will be created by
    parsing simple class with JavaParser.


    > *https://docs.oracle.com/java/specs/jsp/se7/html/ls-18.html'
  merge: -1
