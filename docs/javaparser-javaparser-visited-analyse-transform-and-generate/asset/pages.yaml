  md: '# A Flying Visit


    In most cases, you will be working with complete class files, and in this instance
    the .parse method is overloaded to accept a Path, a File, InputStream and a String
    will return a CompilationUnit for you to work with.


    It is also possible to work with source fragments as, although in order to parse
    a String you will need to know the resulting type to avoid a parsing error.


    For example:


    ```

    Statement statement = StaticJavaParser.parseStatement("int a = 0;");

    ```


    # CompilationUnit Class


    The CompilationUnit is the Java representation of source code from a complete
    and syntactically correct class file you have parsed.


    In the context of an AST as mentioned, you can think of the class as the root
    node.


    From here you can access all the nodes of the tree to examine its properties,
    manipulate the underlying Java representation or use as an entry point for a Visitor
    you have defined.


    # Visitor Classes


    Although it is feasible to hand roll code to directly traverse the AST in the
    CompilationUnit this tends to be laborious and error prone. This is largely due
    to the process relying on recursion and frequent type checking to attain your
    goal.


    In most cases you will want to determine what you are looking for, then define
    a visitor that will operate on it. Using a visitor is very easy to find all nodes
    of a certain kind, like the method declarations or all the multiplication expressions.


    # A Simple Visitor


    As mentioned it is usually a good idea to define a Visitor that will traverse
    the AST and operate on the concepts within the code you are interested in. So
    it makes good sense that we start with a simple Visitor as our first example.


    All the code found in this book is available in the accompanying repository*,
    you are welcome to check out the working example from there. We do recommend writing
    the code yourself as the best way to gain intuition into the subject.


    In this example we are creating a Visitor that examines all the methods in our
    class and prints their name and line length to the console. So let''s get started!


    > *https://github.com/javaparser/javaparser-visited'
