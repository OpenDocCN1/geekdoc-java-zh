  md: '# A Flying Visit


    In this chapter, we''re going to take a whistle stop tour of the key features
    the JavaParser library offers. You can think of it as a a quick start guide that
    will get you up on running on your local machine.


    We are going to analyze the code of an interesting, although basic calculator
    takes input into the Reverse Polish Notation format and calculates the result
    (wikipedia). It also has a simple memory feature that can store a single number,
    similar to what you would find a regular calculator.


    The class is of a reasonable length so it can be found in Appendix A.


    # Travelling Companions


    Firstly we should introduce you to your main travelling companions while journeying
    with the JavaParser.


    In addition to the numerous classes provided to represent language concepts, there
    are a few principal classes that support working with Java AST''s namely the JavaParser,
    StaticJavaParser and CompilationUnit, in addition, there are a variety of Visitor
    classes. We''ll look at all of these in detail over the course of this book, but
    here is a brief introduction.


    In a few words:


    +   * The JavaParser class provides a full API for producing an AST from code

    * The StaticJavaParser class provides a quick and simple API for producing an
    AST from code.

    * The CompilationUnit is the root of the AST

    * The Visitors are classes which are used to find specific parts of the AST


    As always JavaDoc* is your friend when using Java libraries, although this book
    will endeavour to cover as much as possible it will inevitably skip over some
    areas.


    # JavaParser Class


    As you might imagine this class allows you to parse Java source code into Java
    objects you can interact with.


    > *https://en.wikipedia.org/wiki/Reverse_Polish_notation

    *http://www.javadoc.io/doc/com.github.javaparser/javaparser-core'
