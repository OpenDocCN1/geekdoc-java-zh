  md: '# A Flying Visit


    will come to why this is useful in the second example, however, as we''re not
    going to use the feature here we have made the parameter type a Void.


    Once the class is defined we define our overriding implementation of visit, we''re
    interested in method declarations so the first argument is of the type MethodDeclaration.
    If we were interested in something else, say occurrences of ImportDeclaration
    we would use that as an argument instead. The second argument is the VoidVisitorAdaptors
    parametrised type.


    Although in this particular it will not affect the behaviour of our visitor we
    make a call to super include children nodes of the node are also visited. This
    is typically recommended to additional visits accrue little overhead, however
    not visiting the whole tree is more likely inclined to result in unwanted behaviour.


