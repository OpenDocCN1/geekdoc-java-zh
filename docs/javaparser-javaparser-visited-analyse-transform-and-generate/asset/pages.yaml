  md: '# Calculating the difference between CSMs


    At this point, a difference between the two computed CSMs is obtained and it basically
    looks like:


    +   1. keep: child(void)

    2. keep: child(name)

    3. keep: token(lparen)

    4. keep: child(param#0)

    5. add: token(comma)

    6. add: token(space)

    7. add: child(param#1)

    8. keep: token(rparen)

    9. keep: token(space)

    10. keep: child(body)


    Finally this difference is applied to the NodeText stored for the Node: we traverse
    the NodeText until we find the point where we have to add or remove new elements.
    We apply the changes we need. In this case, we add a comma, a space and a placeholder
    for a child (the second parameter). Applying the difference is not straightforward
    because we want to ignore some of the whitespace and comments which are present
    in the NodeText.


    # Summary


    For a long time JavaParser supported only pretty-printing, and for many uses,
    it was and still is a reasonable choice.


    Some users will instead perform modifications while preserving the format of existing
    code: keeping the exact whitespace, leaving comments exactly where they are. This
    layout information can be meaningless for a compiler but it is important for developers.
    For those usages, we created the lexical preservation, introduced for the first
    time in version 3.1.1.


    These two alternatives should cover all of your needs. If not, come talk to us
    or create a new issue on GitHub.'
