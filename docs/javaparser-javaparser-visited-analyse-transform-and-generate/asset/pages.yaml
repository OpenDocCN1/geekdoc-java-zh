  md: "# Solving Symbols and References\n\nJavaParser, like other parsers, take information\
    \ present in source code and it organizes it into a tree, an Abstract Syntax Tree.\n\
    \nIn many situations, the information present in the AST is sufficient for a user's\
    \ needs. In other cases however you need to elaborate the AST and calculate additional\
    \ information. In particular, you may want to resolve references and find relations\
    \ between nodes. In a sense, tracing new links and transforming a tree to a graph.\n\
    \nWhen we find a name used in Java code we recognize it as a symbol. Symbol is\
    \ the term we use to indicate any possible element that could be represented by\
    \ a name. A symbol could be a variable, but also a field or a type.\n\nWhen we\
    \ encounter this expression:\n\n```\ncontainer.element\n```\n\nWhat is the container?\
    \ What is the element? Perhaps container is a variable and element is a field\
    \ of that variable. Or maybe container is a class name and element is a static\
    \ field of that class. At this stage we do not know, so we speak generally of\
    \ symbols.\n\nThe JavaParser Solver is the part of the library that examines those\
    \ symbols and tells us what they really are, finding for us the variable declaration,\
    \ parameter declaration or type declaration that they are represented by symbol.\n\
    \nConsider for example case:\n\n```\nvoid aMethod() {\n  int a;\n  a = a + 1;\n\
    }\n```\n\nBy looking at the AST we know that a = a + 1 corresponds to an assignment.\
    \ We also know that we are assigning the result of the adding 1 to the value of\
    \ a.\n\nThere are things that we do know:\n\n+   * Is there a symbol a in that\
    \ context?\n* Can that symbol be assigned?\n* What is the type of that symbol?"
