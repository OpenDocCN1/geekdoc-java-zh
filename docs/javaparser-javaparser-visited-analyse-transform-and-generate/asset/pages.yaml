    # Comment Attribution


    A node can have at most one comment associated with it, which is referenced in
    its comment field. Then the type of comment, as you might expect will be one of
    either LineComment, BlockComment or JavadocComment.


    The relationship between node and comment is bi-directional, so comment maintains
    a commentedNode reference.


    When trying to determine where a comment should be attributed, first consider
    what type of comment it is; block and Javadoc styles behave the same, but line
    comments are slightly different.


    During attribution the comments parser will look to assign block or Javadoc style
    comments to the following node: either on the same line or subsequent line. On
    the other hand will be assigned to the node preceding them when they appear on
    the same line as another node or the following node when they''re on one of their
    own.


    The above only holds true when the comment is placed "sensibly" between two tokens.


    # Orphan Comments


    We have touched on this concept in other chapters in the book, but it bears repeating.
    Comments that can''t be attributed to a particular node in the tree are deemed
    to be orphaned. More than not, if you can''t find a comment attributed to the
    node you expect, it will be an orphan elsewhere. Most likely in the parent of
    the node you would expect.


    Consider the following:


    ```

    1 // Orphaned 1

    2 // Attributed 1

    3 public class TimePrinterWithComments {

    4

    5 // Orphaned 2

    6 // Attributed 2

    7 public static void main(String args[]){

    8     System.out.print(LocalDateTime.now());

    9 }

    10 // Orphaned 3

    11 }

    ```'
