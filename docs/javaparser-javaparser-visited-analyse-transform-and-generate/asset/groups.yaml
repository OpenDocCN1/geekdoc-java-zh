- md: "\n# Solving Symbols and References\n\n## Resolving a Type in a context\n\n\
    TypeSolver alone can only find types when their qualified names are provided;\
    \ however, JavaSolver can use the context to find which actual qualified name\
    \ corresponds to a certain declaration. Consider this:\n\n```java\npackage org.javaparser.examples.chapter5;\n\
    import org.javaparser.examples.chapter4.*;\nclass Foo {\n  Bar;\n}\n```\n\nFoo.java\n\
    \nWhat is the type of the field?\nIt could be org.javaparser.examples.chapter5.Bar\
    \ or org.javaparser.examples.chapter4.Bar. JavaSolver will figure this out for\
    \ you by looking at the context and considering things like:\n\n- Name of the\
    \ classes in which the type is used\n- Import directives\n- the current package\n\
    \nHow do you tell JavaSolver which context to use? Well, it determines this by\
    \ looking at the AST in which the node you are interested in is contained.\n\n\
    ```java\npublic class ResolveTypeInContext {\n  private static String FILE_PATH\
    \ = \"src/main/java/javaparser/examples/chapter5/Foo.java\";\n  private static\
    \ String SRC_PATH = \"src/main/java\";\n  public static void main(String[] args)\
    \ throws Exception {\n    TypeSolver reflectionTypeSolver = new ReflectionSolver();\n\
    \    TypeSolver JavaParserTypeSolver = new JavaParserTypeSolver(\n      new File(SRC_PATH));\n\
    \    CombinedTypeSolver combinedSolver = new CombinedTypeSolver();\n    combinedSolver.add(reflectionTypeSolver);\n\
    \    combinedSolver.add(javaParserSolver);\n\n    JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(combinedSolver);\n    StaticJavaParser\n      .getParser()\n\
    \      .setSymbolResolver(symbolSolver);\n\n    CompilationUnit cu = StaticJavaParser.parse(new\
    \ File(FILE_PATH));\n\n    FieldDeclaration fieldDeclaration = Navigator.demandNodeOfGivenClass(\n\
    \      cu, FieldDeclaration.class);\n\n    System.out.println(\"Field type: \"\
    \ + fieldDeclaration.getVariables().get(0)\n      .getType().resolve().asReferenceType().getQualifiedName());\n\
    \  }\n}\n```\n\n# ResolveTypeInContext.java\n\nWhat are we doing here?\n\n- we\
    \ get the type of the first (and only) variable defined in the FieldDeclaration\n\
    - we translate that type to a JavaSymbolSolver type, to that we pass the JavaParser\
    \ type and the context to use\n\nThe JavaSymbolSolver ResolvedType is a type containing\
    \ all the information you may need on the type.\n\nIn this case, the context we\
    \ use is the fieldDeclaration. This means we want JavaSymbolSolver to consider\
    \ what a reference type Bar when used to point to that particular node is defined\n\
    \nConsider this:\n\n```java\nclass Foo {\n  Bar;\n}\nclass Zum {\n  Bar;\n  class\
    \ Bar {\n  }\n}\n```\n\nFrom the point of view of JavaParser, both the FieldDeclarations\
    \ have the same type: type named Bar. But that name in different contexts means\
    \ different things. By passing that JavaParser type and the context (the first\
    \ or the second FieldDeclaration) JavaSymbolSolver will give us different answers\
    \ and figure out the real type being used in each case.\n\nPretty neat, eh?\n\n\
    ## Resolving method calls\n\nAnother thing that JavaSymbolSolver can help you\
    \ with is resolving method calls. As you probably know Java permits the overloading\
    \ of methods, i.e. different methods having the same name but a different signature.\
    \ This, however, can make it unobvious which method is called by a particular\
    \ invocation.\n\nConsider this case:\n\nA.java\n\nWe have three calls and those\
    \ three calls refer to three different methods that just happen to have the same\
    \ name.\n\nHere is how we can use JavaSymbolSolver to find out which method is\
    \ invoked in each case:\n\n```java\npublic class ResolveMethodCalls {\n    private\
    \ static final String FILE_PATH\n        = \"src/main/java/javaparser/examples/chapter5/A.java\"\
    ;\n    public static void main(String[] args) throws Exception {\n        TypeSolver\
    \ typeSolver = new ReflectionTypeSolver();\n\n        JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n        StaticJavaParser\n            .getParserConfiguration()\n\
    \            .setSymbolResolver(symbolSolver);\n\n        CompilationUnit cu =\
    \ StaticJavaParser.parse(new File(FILE_PATH));\n\n        cu.findAll(MethodCallExpr.class).forEach(mce\
    \ ->\n            System.out.println(mce.resolve().getQualifiedSignature());\n\
    \        );\n    }\n}\n```\n\n# ResolveMethodCalls.java\n\nThis will print:\n\n\
    ```\njava.io.PrintStream.println(int)\njava.io.PrintStream.println(java.lang.String)\n\
    java.io.PrintStream.println(java.lang.Object)\n```\n\nNote that also TypeSolver\
    \ figures out which methods are visible in a certain context, it determines the\
    \ type of the scope of the method calls (in this case System.out) and so on. It\
    \ is quite some work and you probably do not want to do it yourself, especially\
    \ when you can use this library and move on to the next problem.\n\n## Using the\
    \ CombinedTypeSolver\n\nWhen examining real applications you are typically going\
    \ to use the CombinedTypeSolver to group other TypeSolver into one.\n\nSuppose\
    \ for example that the application you want to examine classes from:\n\n- the\
    \ standard libraries\n- different jars\n- directories containing source code\n\
    \nThe code could look like this:\n\n```java\npublic class CombinedSolver {\n \
    \   public static void main(String[] args) throws IOException {\n        TypeSolver\
    \ mySolver = new CombinedTypeSolver(\n            new ReflectionSolver(),\n  \
    \          new JarTypeSolver(\"jars/library1.jar\"),\n            new JarTypeSolver(\"\
    jars/library2.jar\"),\n            new JarTypeSolver(\"jars/library3.jar\"),\n\
    \            new JavaParserTypeSolver(new File(\"generated_code\"))\n        );\n\
    \        // using mySolver\n    }\n}\n```\n\n# Using the MemoryTypeSolver\n\n\
    As we anticipated this TypeSolver is typically not used in real applications;\
    \ it is instead intended to be used in tests. Let's consider one real test from\
    \ the JavaSolver project:\n\n```java\npublic class MemoryTypeSolverComplete {\n\
    \    private static String FILE_PATH =\n        \"src/main/java/javaparser/examples/chapter5/Foo.java\"\
    ;\n\n    @Test\n    public void solveTypeInPackage() throws Exception {\n    \
    \    CompilationUnit cu = StaticJavaParser.parse(new File(FILE_PATH));\n\n   \
    \     ResolvedReferenceDeclaration otherClass =\n            EasyMock.createMock(ResolvedReferenceDeclaration.class);\n\
    \n        EasyMock.expect(otherClass.getQualifiedName())\n        .andReturn(\"\
    org.javaparser.examples.chapter5.Bar\");\n\n        /* Start of the relevant part\
    \ */\n        MemoryTypeSolver memorySolver = new MemoryTypeSolver();\n      \
    \  memorySolver.addDeclaration(\n            \"org.javaparser.examples.chapter5.Bar\"\
    , otherClass);\n        Context context = new CompilationUnitContext(cu, memorySolver);\n\
    \        /* End of the relevant part */\n\n        EasyMock.replay(otherClass);\n\
    \n        SymbolReference<ResolvedTypeDeclaration> ref = context\n        .solveType(\"\
    Bar\", null);\n        assertTrue(ref.isSolved());\n        assertEquals(\"org.javaparser.examples.chapter5.Bar\"\
    ,\n            ref.getCorrespondingDeclaration());\n    }\n}\n```\n\n# MemoryTypeSolverComplete.java\n\
    \nIn this case, we want to verify that the rest of the code looks for one specific\
    \ type (com.foo.OtherClassInSamePackage) Instead of creating a JAR to use it in\
    \ the text we use the MemoryTypeSolver and instruct it to return a specific TypeDeclaration\
    \ when the name com.foo.OtherClassInSamePackage is used.\n\nIt could be possible\
    \ to use it to analyze applications using special class loaders, generating classes\
    \ on the fly or in worst situations. In most cases, you can just ignore the existence\
    \ of the MemoryTypeSolver.\n\n# Summary\n\nAt this point, you should have an idea\
    \ of what kind of problems JavaSymbolSolver can solve for you. We do not expect\
    \ to have answered all your questions on the library and we did not explore the\
    \ whole API, but we should have provided you with a starting point. The Javadoc\
    \ can also help you some of your remaining questions. For the others free to contact\
    \ us.\n\nKeep in mind JavaSymbolSolver is young compared to JavaParser and its\
    \ API could evolve to become easier to use over time. However, it is a project\
    \ which is growing fast, thanks to the wonderful JavaParser community and is already\
    \ being used in commercial products.\n"
  mdcn: "\n\n# 解决符号与引用\n\n## 在上下文中解析类型\n\nTypeSolver 仅在提供全限定名时才能找到类型；然而，JavaSolver\
    \ 可以利用上下文来查找哪个实际的全限定名对应特定的声明。考虑以下情况：\n\n```java\npackage org.javaparser.examples.chapter5;\n\
    import org.javaparser.examples.chapter4.*;\nclass Foo {\n  Bar;\n}\n```\n\nFoo.java\n\
    \n字段的类型是什么？\n它可能是 `org.javaparser.examples.chapter5.Bar`，也可能是 `org.javaparser.examples.chapter4.Bar`。JavaSolver\
    \ 将通过查看上下文并考虑以下因素为你解决这个问题：\n\n- 使用该类型的类名\n- 导入指令\n- 当前包\n\n你如何告诉 JavaSolver 使用哪个上下文呢？嗯，它是通过查看包含你感兴趣的节点所在的\
    \ AST（抽象语法树）来确定的。\n\n```java\npublic class ResolveTypeInContext {\n  private static\
    \ String FILE_PATH = \"src/main/java/javaparser/examples/chapter5/Foo.java\";\n\
    \  private static String SRC_PATH = \"src/main/java\";\n  public static void main(String[]\
    \ args) throws Exception {\n    TypeSolver reflectionTypeSolver = new ReflectionSolver();\n\
    \    TypeSolver JavaParserTypeSolver = new JavaParserTypeSolver(\n      new File(SRC_PATH));\n\
    \    CombinedTypeSolver combinedSolver = new CombinedTypeSolver();\n    combinedSolver.add(reflectionTypeSolver);\n\
    \    combinedSolver.add(javaParserSolver);\n\n    JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(combinedSolver);\n    StaticJavaParser\n      .getParser()\n\
    \      .setSymbolResolver(symbolSolver);\n\n    CompilationUnit cu = StaticJavaParser.parse(new\
    \ File(FILE_PATH));\n\n    FieldDeclaration fieldDeclaration = Navigator.demandNodeOfGivenClass(\n\
    \      cu, FieldDeclaration.class);\n\n    System.out.println(\"Field type: \"\
    \ + fieldDeclaration.getVariables().get(0)\n      .getType().resolve().asReferenceType().getQualifiedName());\n\
    \  }\n}\n```\n\n# ResolveTypeInContext.java\n\n我们在这里做什么？\n\n- 我们获取在 FieldDeclaration\
    \ 中定义的第一个（也是唯一的）变量的类型\n- 我们将该类型转换为 JavaSymbolSolver 类型，为此我们传递了 JavaParser 类型和要使用的上下文\n\
    \nJavaSymbolSolver ResolvedType 是包含你可能需要的关于该类型的所有信息的类型。\n\n在这种情况下，我们使用的上下文是 `fieldDeclaration`。这意味着我们希望\
    \ JavaSymbolSolver 考虑当引用类型 `Bar` 用于指向该特定节点时，它是如何定义的。\n\n考虑以下情况：\n\n```java\nclass\
    \ Foo {\n  Bar;\n}\nclass Zum {\n  Bar;\n  class Bar {\n  }\n}\n```\n\n从 JavaParser\
    \ 的角度来看，两个 FieldDeclaration 具有相同的类型：名为 `Bar` 的类型。但该名称在不同的上下文中含义不同。通过传递该 JavaParser\
    \ 类型和上下文（第一个或第二个 FieldDeclaration），JavaSymbolSolver 将为我们不同的答案，并确定每种情况下实际使用的真实类型。\n\
    \n很酷，对吧？\n\n## 解析方法调用\n\nJavaSymbolSolver 可以帮助你解决的另一个问题是解析方法调用。正如你可能知道的，Java 允许方法重载，即不同的方法具有相同的名称但不同的签名。然而，这使得特定的调用执行了哪个方法变得不再直观。\n\
    \n考虑这种情况：\n\nA.java\n\n我们有三个调用，这三个调用指向三个恰好具有相同的不同方法。\n\n以下是我们可以使用 JavaSymbolSolver\
    \ 查找每种情况下调用的方法的方法：\n\n```java\npublic class ResolveMethodCalls {\n    private\
    \ static final String FILE_PATH\n        = \"src/main/java/javaparser/examples/chapter5/A.java\"\
    ;\n    public static void main(String[] args) throws Exception {\n        TypeSolver\
    \ typeSolver = new ReflectionTypeSolver();\n\n        JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n        StaticJavaParser\n            .getParserConfiguration()\n\
    \            .setSymbolResolver(symbolSolver);\n\n        CompilationUnit cu =\
    \ StaticJavaParser.parse(new File(FILE_PATH));\n\n        cu.findAll(MethodCallExpr.class).forEach(mce\
    \ ->\n            System.out.println(mce.resolve().getQualifiedSignature());\n\
    \        );\n    }\n}\n```\n\n# ResolveMethodCalls.java\n\n这将打印：\n\n```\njava.io.PrintStream.println(int)\n\
    java.io.PrintStream.println(java.lang.String)\njava.io.PrintStream.println(java.lang.Object)\n\
    ```\n\n注意，TypeSolver 也会确定在特定上下文中哪些方法是可见，它确定了方法调用作用域的类型（在此情况下为 `System.out`）等。这是一项大量工作，你可能不想自己完成它，尤其是当你可以使用这个库并继续处理下一个问题时。\n\
    \n## 使用 CombinedTypeSolver\n\n在检查实际应用程序时，你通常会使用 `CombinedTypeSolver` 将其他 `TypeSolver`\
    \ 组合在一起。\n\n假设你想检查的应用程序类来自：\n\n- 标准库\n- 不同的 jar 包\n- 包含源代码的目录\n\n代码可能像这样：\n\n\
    ```java\npublic class CombinedSolver {\n    public static void main(String[] args)\
    \ throws IOException {\n        TypeSolver mySolver = new CombinedTypeSolver(\n\
    \            new ReflectionSolver(),\n            new JarTypeSolver(\"jars/library1.jar\"\
    ),\n            new JarTypeSolver(\"jars/library2.jar\"),\n            new JarTypeSolver(\"\
    jars/library3.jar\"),\n            new JavaParserTypeSolver(new File(\"generated_code\"\
    ))\n        );\n        // 使用 mySolver\n    }\n}\n```\n\n# 使用 MemoryTypeSolver\n\
    \n正如我们预期的，这种 TypeSolver 通常不用于实际应用程序；它而是旨在用于测试。让我们考虑 JavaSolver 项目中的一个真实测试：\n\n\
    ```java\npublic class MemoryTypeSolverComplete {\n    private static String FILE_PATH\
    \ =\n        \"src/main/java/javaparser/examples/chapter5/Foo.java\";\n\n    @Test\n\
    \    public void solveTypeInPackage() throws Exception {\n        CompilationUnit\
    \ cu = StaticJavaParser.parse(new File(FILE_PATH));\n\n        ResolvedReferenceDeclaration\
    \ otherClass =\n            EasyMock.createMock(ResolvedReferenceDeclaration.class);\n\
    \n        EasyMock.expect(otherClass.getQualifiedName())\n        .andReturn(\"\
    org.javaparser.examples.chapter5.Bar\");\n\n        /* 相关部分开始 */\n        MemoryTypeSolver\
    \ memorySolver = new MemoryTypeSolver();\n        memorySolver.addDeclaration(\n\
    \            \"org.javaparser.examples.chapter5.Bar\", otherClass);\n        Context\
    \ context = new CompilationUnitContext(cu, memorySolver);\n        /* 相关部分结束 */\n\
    \n        EasyMock.replay(otherClass);\n\n        SymbolReference<ResolvedTypeDeclaration>\
    \ ref = context\n        .solveType(\"Bar\", null);\n        assertTrue(ref.isSolved());\n\
    \        assertEquals(\"org.javaparser.examples.chapter5.Bar\",\n            ref.getCorrespondingDeclaration());\n\
    \    }\n}\n```\n\n# MemoryTypeSolverComplete.java\n\n在这种情况下，我们想要验证代码的其他部分查找的是一个特定类型\
    \ (`com.foo.OtherClassInSamePackage`)，而不是在正文中创建一个 JAR 来使用它，我们使用 `MemoryTypeSolver`\
    \ 并指示它在使用 `com.foo.OtherClassInSamePackage` 名称时返回一个特定的 `TypeDeclaration`。\n\n\
    可能可以使用它来分析使用特殊类加载器、动态生成类或在最坏情况下运行时生成类的应用程序。在大多数情况下，你只需要忽略 `MemoryTypeSolver` 的存在即可。\n\
    \n# 总结\n\n到此时，你应该对 JavaSymbolSolver 可以为你解决什么类型的问题有了了解。我们并不期望已经回答了你关于该库的所有问题，而且还没有探索整个\
    \ API，但我们应该为你提供了一个起点。Javadoc 也可以帮助你解决剩余的一些问题。对于其他问题，请随时联系我们。\n\n请记住，与 JavaParser\
    \ 相比，JavaSymbolSolver 还很年轻，它的 API 可能会随着时间的推移而演变变得更易使用。然而，这是一个增长非常快速的项目，得益于出色的\
    \ JavaParser 社区，并且已经在商业产品中使用。\n\n"
