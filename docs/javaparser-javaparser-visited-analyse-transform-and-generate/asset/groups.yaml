    \n只有当注释“合理”地放置两个标记之间时，上述情况才成立。\n\n# 孤儿注释\n\n我们在书的其他章节提到过这个概念，但值得重复强调。无法归属于树中特定节点的注释被认为是孤儿注释。通常情况下，如果你无法找到归属于你预期的节点的注释，它会在别处成为孤儿。最可能是在你预期节点的父节点中。\n\
