    \ | @Counters(15) |\n| MemberValuePair | |\n| MethodCallExpr | circle.circumference()\
    \ |\n| MethodDeclaration | public int abet() [return 1]: |\n| MethodReferenceExpr\
    \ | System.out.println |\n| Name | |\n| NameExpr | |\n| NodeList | A List of Nodes\
    \ |\n| NormalAnnotationExpr | @Mapping(...) |\n| NullLiteralExpr | null |\n| ObjectCreationExpr\
