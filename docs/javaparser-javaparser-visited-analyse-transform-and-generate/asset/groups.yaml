    and when should we use the other?


    From what we have seen, many cases involve JavaParser being used to perform transformations
    on large codebases. In this instance, you will typically want to use Lexical-Preserving
    Printing. The reason being, that all the code that is not modified by your transformation
    will remain completely unchanged. Typically this is more reassuring to developers,
    that get nervous when large (even safe) changes are submitted. This permits us
    to have much smaller diff files, making it easy when it comes to manual code reviews.
    Finally, it allows us to preserve complex layout or formatting that has a meaning.


    When generating code or transforming code that is not intended for manual reviews
    you could instead opt for pretty-printing. Pretty-printing is also a good choice
    if you want to enforce a specific code style: every time you save code you are
    assured that it is well formed, without any exception.


    These are our considerations we consider common but bear in mind that JavaParser
    and JavaScript are intended to be used in many different contexts. You, as the
    developer, have to analyze your context and make the appropriate choice for you.


    We have seen what the differences between pretty-printing and lexical-preserving
    printing are. Now let''s look how to use those and how they work.'
