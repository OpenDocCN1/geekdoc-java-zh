    distinction''


    # # Everything is a node


    The tree metaphor only takes us so far, however.


    In the classical computer science sense when talking about graphs with vertices
    and edges, directed graphs in the case of trees. Depending on the literature you''re
    reading these can also be synonymous with nodes and relationships. For the purpose
    of this book, we use node as it is considered less convoluted, and in line with
    the library classes.


    > *Adding the connections between related elements, like method calls to method
    declarations or field references to a field is the job done by a Symbol Solver.
    The JavaSymbolSolver is the Symbol Solver created to work with JavaParser.'
