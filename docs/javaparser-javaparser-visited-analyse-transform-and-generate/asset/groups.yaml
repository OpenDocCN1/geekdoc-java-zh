    Pretty Printing and Lexical Preservation


    ```

    package org.javaparser.lexicalpreservation.examples;


    // Hey, this is a comment


    // Another one


    public class MyNewClassName {}

    ```


    The idea is that aside from initial setup, you just use the JavaParser normally
    and behind the scenes, the original text is updated using lexical preservation
    in a totally transparent way.


    You do not need to understand how it works internally unless of course, are you
    curious; in which case the next section is for you.


    # How it works: the NodeText and the Concrete Syntax Model


    We previously described the lexical preservation stores the initial text, that
    is somewhat of a simplification of what happens. What the lexical preservation
    actually does is create a NodeText for each node. A NodeText is basically a list
    of other tokens or placeholders for children.


    For example, if you consider this method declaration:


    ```

    void foo(int a) { }

    ```


    Its NodeText would look like this:


    ![](img/ff30983b7326e5199d4352dda9432912_41_0.png)


    Fig. 6.1 - A NodeText


    If we order the different elements:


    +   - child(void)'
  - '[PAGE 42]


    Pretty Printing and Lexical Preservation


    +   2. token(space)

    3. child(name)

    4. token(lparen)

    5. child(param#0)

    6. token(rparen)

    7. token(space)

    8. child(body)


    Now suppose that you add a parameter to this method. What will happen? We will
    need to update the NodeText.associated to the MethodDeclaration.


    The Lexical Preservation setup attaches observers to all nodes. At every change,
    we get notified and we calculate how node should look like after the change and
    update these modifications to the NodeText.


    To understand how the Node should look like after the change we use a ConcreteSyntaxModel.


    # # What is the Concrete Syntax Model?


    You may wonder what the Concrete Syntax Model (CSM) is: it is the definition of
    what a node should typically look like. The Concrete Syntax Model explains how
    to use to "unparse" an AST and transform it into text.


    The ConcreteSyntaxModel for a MethodDeclaration looks like this:


    ```

    concreteSyntaxModelByClass.put(MethodDeclaration.class, sequence(

    orphanCommentsBeforeThis(),

    comment(),

    memberAnnotations(),

    modifiers(),

    conditional(ObservableProperty.DEFAULT, FLAG, sequence(GeneratedJavaPa\nrserConstants._DEFAULT),
    space)),

    typeParameters(),

    child(ObservableProperty.TYPE,

    space(),

    child(ObservableProperty.NAME),

    token(GeneratedJavaParserConstants.LPAREN),

    list(ObservableProperty.PARAMETERS, sequence(comma, space()), none, none\

    ),

    token(GeneratedJavaParserConstants.RPAREN),

    list(ObservableProperty.THROWN_EXCEPTIONS, sequence(comma, space()),

    sequence(space), token(GeneratedJavaParserConstants.THROWS), space(\n)), none()),

    conditional(ObservableProperty.BODY, IS_PRESENT,

    ```'
  - '[PAGE 43]


    # Pretty Printing and Lexical Preservation


    sequence(space(), child(ObservableProperty.BODY), semicolon());

    ));


    This is quite complicated because it considers all the potential elements that
    can compose a MethodDeclaration and how to present all of them.


    Consider this line, for example:


    ```

    list(ObservableProperty.PARAMETERS, sequence(comma(), space()), none(), none()),

    ```


    This tells us that the parameters of the MethodDeclaration should be ideally separated
    by one comma and one space.


    Or these lines:


    ```

    conditional(ObservableProperty.BODY, IS_PRESENT,

    sequence(space()), child(ObservableProperty.BODY)), semicolon())

    ```


    This tells us that if the body of the method is present we print it, with a preceding
    space and follow it with a semicolon.


    If we use the CSM to calculate how the node should look like before the change
    we would get this:


    +   1. child(void)

    2. child(name)

    3. token(lparen)

    4. child(param#0)

    5. token(rparen)

    6. token(space)

    7. child(body)


    while after the change it would look like this:


    +   1. child(void)

    2. child(name)

    3. token(lparen)

    4. child(param#0)

    5. token(comma)

    6. token(space)

    7. child(param#1)

    8. token(rparen)

    9. token(space)

    10. child(body)'
  - '[PAGE 44]


    # Calculating the difference between CSMs


    At this point, a difference between the two computed CSMs is obtained and it basically
    looks like:


    +   1. keep: child(void)

    2. keep: child(name)

    3. keep: token(lparen)

    4. keep: child(param#0)

    5. add: token(comma)

    6. add: token(space)

    7. add: child(param#1)

    8. keep: token(rparen)

    9. keep: token(space)

    10. keep: child(body)


    Finally this difference is applied to the NodeText stored for the Node: we traverse
    the NodeText until we find the point where we have to add or remove new elements.
    We apply the changes we need. In this case, we add a comma, a space and a placeholder
    for a child (the second parameter). Applying the difference is not straightforward
    because we want to ignore some of the whitespace and comments which are present
    in the NodeText.


    # Summary


    For a long time JavaParser supported only pretty-printing, and for many uses,
    it was and still is a reasonable choice.


    Some users will instead perform modifications while preserving the format of existing
    code: keeping the exact whitespace, leaving comments exactly where they are. This
    layout information can be meaningless for a compiler but it is important for developers.
    For those usages, we created the lexical preservation, introduced for the first
    time in version 3.1.1.


    These two alternatives should cover all of your needs. If not, come talk to us
    or create a new issue on GitHub.'
- md: "\n# Solving Symbols and References\n\nJavaParser, like other parsers, take\
    \ information present in source code and it organizes it into a tree, an Abstract\
    \ Syntax Tree.\n\nIn many situations, the information present in the AST is sufficient\
    \ for a user's needs. In other cases however you need to elaborate the AST and\
    \ calculate additional information. In particular, you may want to resolve references\
    \ and find relations between nodes. In a sense, tracing new links and transforming\
    \ a tree to a graph.\n\nWhen we find a name used in Java code we recognize it\
    \ as a symbol. Symbol is the term we use to indicate any possible element that\
    \ could be represented by a name. A symbol could be a variable, but also a field\
    \ or a type.\n\nWhen we encounter this expression:\n\n```\ncontainer.element\n\
    ```\n\nWhat is the container? What is the element? Perhaps container is a variable\
    \ and element is a field of that variable. Or maybe container is a class name\
    \ and element is a static field of that class. At this stage we do not know, so\
    \ we speak generally of symbols.\n\nThe JavaParser Solver is the part of the library\
    \ that examines those symbols and tells us what they really are, finding for us\
    \ the variable declaration, parameter declaration or type declaration that they\
    \ are represented by symbol.\n\nConsider for example case:\n\n```\nvoid aMethod()\
    \ {\n  int a;\n  a = a + 1;\n}\n```\n\nBy looking at the AST we know that a =\
    \ a + 1 corresponds to an assignment. We also know that we are assigning the result\
    \ of the adding 1 to the value of a.\n\nThere are things that we do know:\n\n\
    - Is there a symbol a in that context?\n- Can that symbol be assigned?\n- What\
    \ is the type of that symbol?\n\nThink about the last point: if a is an int then\
    \ the result of a + 1 is going to be an int. However a could be a String, in that\
    \ case, we are not summing 1 but we are concatenating its string representation\
    \ to that String represented by a. In other words, by simply looking at the AST\
    \ we cannot say what kind of operation we are performing: an algebraic sum or\
    \ a string concatenation? It depends on the type of a. To answer these questions\
    \ we have to resolve references. We have to connect the reference to a in a +\
    \ 1 to the declaration of a that is being referred.\n\nNow consider the following\
    \ case:\n\n```\nclass Bar {\n  private String a;\n\n  void aMethod() {\n    while\
    \ (true) {\n      int a;\n      a = a + 1;\n    }\n  }\n}\n```\n\nBar.java\n\n\
    There are many symbols. Solving a reference means finding the correct one and\
    \ it can be difficult. And trust us, things can get very complex. Luckily for\
    \ you, you can just use the JavaParser Solver to solve references between elements\
    \ of a JavaParser AST.\n\n# How to setup the JavaParser Symbol Solver?\n\nFrom\
    \ this point forward we will refer to the JavaParser Symbol Solver as the 'JavaSymbolSolver',\
    \ naming things is hard and we don't always get it right first time. Future versions\
    \ may be refactored the class name\n\nJavaSymbolSolver comes bundled with the\
    \ JavaParser core library. This is because each version of the JavaSymbolSolver\
    \ is guaranteed to work with a specific version of JavaParser. Historically this\
    \ was not the case, and the libraries were distributed separately.\n\nIf you previously\
    \ elected not to include the JavaSymbolSolver and just included the javaparser-core\
    \ artifact in your dependencies you will have to update to the bundled version.\n\
    \n# Solving Symbols and References\n\n43\n\n```\ndependencies {\n  compile group:\
    \ 'com.github.javaparser', name: 'javaparser-symbol-solver-core',\n  version:\
    \ 'LATEST'\n}\n```\n\nOr if you feel more comfortable with the verbosity of Maven\
    \ here you go:\n\n```xml\n<dependency>\n  <groupId>com.github.javaparser</groupId>\n\
    \  <artifactId>javaparser-symbol-solver-core</artifactId>\n  <version>LATEST</version>\n\
    </dependency>\n```\n\n# How to get the type of references: a first example\n\n\
    Let's consider our initial example. How do we get the type of the value being\
    \ assigned?\nThis is the code we want to parse:\n\n```\nclass Bar {\n  private\
    \ String a;\n  void aMethod() {\n    while (true) {\n      int a = 0;\n      a\
    \ = a + 1;\n    }\n  }\n}\n```\n\n![](img/ff30983b7326e5199d4352dda9432912_47_0.png)\n\
    \nThis is the code to get the type:\n\n```java\npublic class GetTypeOfReference\
    \ {\n  private static final String FILE_PATH =\n      \"src/main/java/org/javaparser/examples/chapter5/Bar.java\"\
    ;\n  public static void main(String[] args) throws FileNotFoundException {\n \
    \     TypeSolver typeSolver = new CombinedSolver();\n      JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n      StaticJavaParser\n          .getParserConfiguration()\n\
    \          .setSymbolResolver(symbolSolver);\n      CompilationUnit cu = StaticJavaParser.parse(new\
    \ File(FILE_PATH));\n      cu.findAll(AssignExpr.class).forEach(ae -> {\n    \
    \      ResolvedType resolvedType = ae.calculateResolvedType();\n          System.out.println(ae\
    \ + \" is a: \" + resolvedType);\n      });\n  }\n}\n```\n\nGetTypeOfReference.java\n\
    \nThe output would be: Type of a + 1 is a: PrimitiveType(name='int')\nThis line\
    \ could look mysterious to:\n\n```java\nTypeSolver typeSolver = new CombinedSolver();\n\
    ```\n\nWe'll take a look at what TypeSolver is in the next.\n\n# Specifying where\
    \ to look for types\n\nIn the previous example, we have seen references between\
    \ elements in the same AST i.e. in the source file. Life tends to be more complex\
    \ than that and references typically involve other files. Consider this:\n\n```java\n\
    class MyClass extends SuperClass {\n    public void returnSomeValue() {\n    \
    \    System.out.println(aField.size());\n    }\n}\n```\n\nWhere does aField come\
    \ from? We do not know, it could be a field in SuperClass. So we need to check.\
    \ Well, this is what JavaSolver will do for us. In order to do that, however,\
    \ JavaSolver will need to know where to look. Classes could be:\n\n- in source\
    \ files, if we are compiling right now\n- in class files or JARs from some library\n\
    - in the J, for classes\n\nDepending on above, there are different TypeSolvers\
    \ that you need to pass to JavaSolver.\nJarTypeSolver: this TypeSolver looks for\
    \ classes inside a JAR file. You just need to specify where the JAR file is located.\n\
    \nJavaParserSolver: this TypeSolver looks for classes defined in source files.\
    \ You just need to specify the root directory. For example src directory. It will\
    \ look for source files in a directory corresponding to the package. So it would\
    \ look for class a.b.C in the directory b under directory a.\n\nReflectionTypeSolver:\
    \ there are some classes that are defined as part of the language and for which\
    \ there is no JAR. Classes like java.lang.Object. For finding the definition of\
    \ such classes we can use reflection.\n\nMemoryTypeSolver: this TypeSolver returns\
    \ the classes we have recorded in it. It is mostly intended for tests.\n\nCombinedTypeSolver:\
    \ You want typically to combine multiple TypeSolver into one. To do that you use\
    \ the CombinedSolver.\n\n# Resolving a type using an absolute name\n\nYou can\
    \ use a TypeSolver directly if you want. What will this do is find an element\
    \ given its qualified name.\n\nConsider this example:\n\nIn this example we get\
    \ the definition of three types:\n\n- java.lang.Object\n- java.lang.String\n-\
    \ java.util.List\n\nEach of these is an instance of ReferenceTypeDeclaration.\
    \ That class has many methods to access a rich model of the type. You can find\
    \ all the ancestors, inherited methods and fields, annotations, which types it\
    \ can be assigned to and manage.\n\nNote that it does not matter which TypeSolver\
    \ you are using: if your class has been found through reflection from parsing\
    \ a source file or from a JAR, JavaSymbolSolver will provide a model of it with\
    \ the same interface, i.e. it will always return you an instance of ReferenceTypeDeclaration.\n"
  mdcn: "\n\n# 解析符号与引用\n\nJavaParser 与其他解析器一样，会获取源代码中存在的信息并将其组织成一棵树，即抽象语法树（Abstract\
    \ Syntax Tree）。\n\n在很多情况下，AST 中存在的信息已经足够满足用户需求。但在其他情况下，你需要详化 AST 并计算额外信息。特别是，你可能想要解析引用并找到节点之间的关系。从某种意义上说，这是在追踪新的链接并将树转换为图。\n\
    \n当我们在 Java 代码中发现一个使用的名称时，我们将其识别为一个符号（symbol）。符号是我们用来指代任何可能由名称表示的元素的术语。符号可以是一个变量，也可以是一个字段或类型。\n\
    \n当我们遇到这个表达式时：\n\n```\ncontainer.element\n```\n\ncontainer 是什么？element 是什么？也许\
    \ container 是一个变量，而 element 是该变量的字段。或者 container 是一个类名，element 是该类的静态字段。在这一阶段我们并不知道，所以我们泛泛地谈论符号。\n\
    \nJavaParser Solver 是库的一部分，它负责检查这些符号并告诉我们它们究竟是什么，为我们找到这些符号所代表的变量声明、参数声明或类型声明。\n\
    \n考虑以下示例：\n\n```\nvoid aMethod() {\n  int a;\n  a = a + 1;\n}\n```\n\n通过查看 AST，我们知道\
    \ a = a + 1 对应于一个赋值。我们还知道正在将加 1 的结果赋值给 a 的值。\n\n有些事情是我们明确知道的：\n\n- 在该上下文中是否存在符号\
    \ `a`？\n- 该符号可以被赋值吗？\n- 该符号的类型是什么？\n\n考虑最后一点：如果 `a` 是一个 `int`，那么 `a + 1` 的结果将是一个\
    \ `int`。然而 `a` 也可能是一个 `String`，在这种情况下，我们不是在相加 1，而是将其字符串表示连接到由 `a` 表示的字符串上。换句话说，仅通过\
    \ AST 无法判断我们正在执行什么样的操作：代数和还是字符串拼接？这取决于 `a` 的类型。为了回答这些问题，我们必须解析引用。我们必须将 `a + 1`\
    \ 中对 `a` 的引用连接到被引用的 `a` 的声明上。\n\n现在考虑以下情况：\n\n```\nclass Bar {\n  private String\
    \ a;\n\n  void aMethod() {\n    while (true) {\n      int a;\n      a = a + 1;\n\
    \    }\n  }\n}\n```\n\nBar.java\n\n有很多符号。解析引用意味着找到正确的符号，这可能很困难。请相信我们，情况可能会变得非常复杂。幸运的是，你只需要使用\
    \ JavaParser Solver 来解析 JavaParser AST 中元素之间的引用即可。\n\n# 如何设置 JavaParser符号解析器？\n\
    \n从现在开始，我们将 JavaParser Symbol Solver 称为 'JavaSymbolSolver'，命名是一件困难的事，而且我们并不总是第一次就能做对。未来的版本可能会重构该类名。\n\
    \nJavaSymbolSolver 与 JavaParser 核心库捆绑。这是因为每个版本的 JavaSymbolSolver 都能保证与特定版本的 JavaParser\
    \ 兼容。在历史上，并非如此，库是分开分发的。\n\n如果你之前选择不包含 JavaSymbolSolver 而仅在依赖中引入了 `javaparser-core`\
    \ get，那么你需要更新到捆绑的版本。\n\n# 解析符号与引用\n\n43\n\n```\ndependencies {\n  compile group:\
    \ 'com.github.javaparser', name: 'javaparser-symbol-solver-core',\n  version:\
    \ 'LATEST'\n}\n```\n\n或者如果你更习惯 Maven 的冗长写法，这里有提供：\n\n```xml\n<dependency>\n  <groupId>com.github.javaparser</groupId>\n\
    \  <artifactId>javaparser-symbol-solver-core</artifactId>\n  <version>LATEST</version>\n\
    </dependency>\n```\n\n# 如何获取引用的类型：第一个示例\n\n让我们考虑我们的初始示例。我们如何获取被赋值值的类型？\n这是我们想要解析的代码：\n\
    \n```\nclass Bar {\n  private String a;\n  void aMethod() {\n    while (true)\
    \ {\n      int a = 0;\n      a = a + 1;\n    }\n  }\n}\n```\n\n![](img/ff30983b7326e5199d4352dda9432912_47_0.png)\n\
    \n这是获取类型的代码：\n\n```java\npublic class GetTypeOfReference {\n  private static final\
    \ String FILE_PATH =\n      \"src/main/java/org/javaparser/examples/chapter5/Bar.java\"\
    ;\n  public static void main(String[] args) throws FileNotFoundException {\n \
    \     TypeSolver typeSolver = new CombinedSolver();\n      JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n      StaticJavaParser\n          .getParserConfiguration()\n\
    \          .setSymbolResolver(symbolSolver);\n      CompilationUnit cu = StaticJavaParser.parse(new\
    \ File(FILE_PATH));\n      cu.findAll(AssignExpr.class).forEach(ae -> {\n    \
    \      ResolvedType resolvedType = ae.calculateResolvedType();\n          System.out.println(ae\
    \ + \" is a: \" + resolvedType);\n      });\n  }\n}\n```\n\nGetTypeOfReference.java\n\
    \n输出将是：a+1 is a: PrimitiveType(name='int')\n这一行可能是：\n\n```java\nTypeSolver typeSolver\
    \ = new CombinedSolver();\n```\n\n我们将接下来查看 TypeSolver 是什么。\n\n# 指定查找类型的位置\n\n\
    在之前的示例中，我们看到了同一个 AST 中的元素引用。即在源文件中。情况通常比这复杂，并且涉及到其他文件。考虑这个：\n\n```java\nclass\
    \ MyClass extends SuperClass {\n    public void returnSomeValue() {\n        System.out.println(aField.size());\n\
    \    }\n}\n```\n\n`aField` 来自哪里？我们不知道，它可能是 `SuperClass` 中的一个字段。所以我们需要检查。嗯，这就是\
    \ JavaSolver 为我们所做的。为了实现，JavaSolver 需要知道去哪里查找。类可能位于：\n\n- 在源文件中，如果我们正在编译它们\n-\
    \ 在某些库的类文件或 JAR 中\n- 在 JDK 中\n\n根据上述情况，有不同的 TypeSolver 需要传递给 JavaSolver。\nJarTypeSolver：该解析器在\
    \ JAR 文件内部查找类。你只需要指定 JAR 文件的位置。\n\nJavaParserSolver：该解析器在源文件中查找类。你只需要指定根目录。例如\
    \ `src` 目录。它将在与包对应的目录中查找源文件。因此，它会在 `a/b` 目录下查找类 `C`。\n\nReflectionTypeSolver：某些类是作为语言的一部分定义的，没有\
    \ JAR。例如 `java.lang.Object` 等类。为了查找此类类的定义，我们可以使用反射。\n\nMemoryTypeSolver：该解析器返回我们记录在其中的类。它主要用于测试。\n\
    \nCombinedTypeSolver：你通常想要将多个 TypeSolver 合并为一个。为了这一点，你使用 `CombinedSolver`。\n\n\
    # 使用绝对名称解析类型\n\n如果你愿意，可以直接使用 TypeSolver。它执行的操作是根据给定的限定名称查找元素。\n\n考虑这个示例：\n\n在这个示例中，我们获取了三种类型的定义：\n\
    \n- java.lang.Object\n- java.lang.String\n- java.util.List\n\n这些每一个项都是 `ReferenceTypeDeclaration`\
    \ 的实例。该类有许多方法可以访问丰富的类型模型。你可以找到所有的祖类、继承的方法和字段、注解、它可以赋值的类型并进行管理。\n\n注意，无论你使用哪种 TypeSolver：如果你的类是通过反射、解析源文件或从\
    \ JAR 中找到的，JavaSymbolSolver 都会提供一个具有相同接口的模型，即它总是返回一个 `ReferenceTypeDeclaration`\
    \ 实例。\n\n"
