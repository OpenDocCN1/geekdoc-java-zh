    答案有两种方式之一：


    - 使用美化打印（pretty-printing）

    - 使用词法保留打印（lexical-preserving printing）


    所以让我们考虑它们之间的区别。


    # 什么是美化打印？


    美化打印意味着当我们把代码写源码时，文本表示将以良好格式化且标准的方式打印。


    例如，如果你解析了一个现有的 java 类，如下：


    ```java

    class A {

    int a;

    }

    ```


    那么之后你决定使用 JavaParser 对其进行美化打印，你将得到如下的代码表示：


    ```java

    class A {

    int a;

    }

    ```


    # 什么是词法保留打印？


    词法保留打印意味着打印时保留原始布局。当我们编写代码时，有些信息对于编译器来说没有严格意义，但对人类来说非常重要。即：空格的位置和注释。


    如果你解析了一些代码并使用词法保留打印将其打印回来，你将得到解析时相同的代码。


    如果你解析了一些代码，修改它，然后使用词法保留打印将其打印回来，你将得到非常接近原始代码，更改仅限于你显式修改的节点。


    你可以使用词法保留打印，即使是在一个你通过程序构建而非从源码解析而的 AST 上。在这种情况下，没有原始布局需要保留，且代码将默认为美化打印形式。当你解析代码并在
    AST 中添加一些程序化创建的新节点时也是如此：你解析的代码部分将附带布局信息，而你创建的节点将不会，它们将被美化打印。


