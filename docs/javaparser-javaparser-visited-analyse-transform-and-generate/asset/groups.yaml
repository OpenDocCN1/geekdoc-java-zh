    \n# 美化打印与词法保留\n\n```java\npublic static void main(String[] args) {\n    String\
    \ code = \"// Hey, this is a comment\\n\\n// Another one\\n\\nclass A ( )\";\n\
    \    CompilationUnit cu = StaticJavaParser.parse(code);\n    LexicalPreservingPrinter.setup(cu);\n\
