    \ comments do not constitute part of the abstract syntax tree for a language.\
    \ The abstract part meaning that it omits the elements of the syntax tree that\
    \ are uninteresting to the compiler.\n\nAs such they're really covered by the\
    \ Java language specification, beyond a single page; in a document that is 800\
    \ pages that barely consists as a footnote.\n\nFor the most part what you include\
