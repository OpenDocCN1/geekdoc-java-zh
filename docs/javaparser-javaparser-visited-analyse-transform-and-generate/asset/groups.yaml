- md: "\n## A Brief Introduction to Abstract Syntax Trees\n\nIt is not really possible\
    \ to consider how a Java language parser will be useful without first understanding\
    \ the concept of syntax trees.\n\nLet's start by trying to imagine that source\
    \ code can be represented as a tree. Both have a single starting point, from here\
    \ branches form independently from one another, as code statements or in case\
    \ of a tree, actual limbs. With a real tree's branches, the process of breaking\
    \ complex statements will continue until we hit a terminal or a leaf.\n\nA tree\
    \ representing Java code will have a root representing a whole file, with nodes\
    \ connected to the root for all the top elements of a file, like import or class\
    \ declarations. From a single class declaration, we could reach multiple nodes,\
    \ representing the fields and the methods of the class.\n\n![](img/ff30983b7326e5199d4352dda9432912_9_0.png)\n\
    \nFig. 1.1 - A first glance to an Abstract Syntax Tree\n\nIn the way that a branch\
    \ on a real tree has no connection to other branches other through its origin,\
    \ the same is true for a tree that represents source code. As a human, or a compiler\
    \ understand that a variable reference or a method call relates to another part\
    \ of the code, a syntax tree does not, and this is an important distinction.\n\
    \n## Everything is a node\n\nThe tree metaphor only takes us so far, however.\n\
    \nIn the classical computer science sense when talking about graphs with vertices\
    \ and edges, directed graphs in the case of trees. Depending on the literature\
    \ you're reading these can also be synonymous with nodes and relationships. For\
    \ the purpose of this book, we use node as it is considered less convoluted, and\
    \ in line with the library classes.\n\n> *Adding the connections between related\
    \ elements, like method calls to method declarations or field references to a\
    \ field is the job done by a Symbol Solver. The JavaSymbolSolver is the Symbol\
    \ Solver created to work with JavaParser.*\n\n## A Brief Introduction to Abstract\
    \ Syntax Trees\n\nThere are a few simple rules that govern what a tree is. With\
    \ the exception of the root node, all nodes will have exactly one incoming relationship.\
    \ The root node will have zero. All nodes can have to many outgoing relationships.\
    \ Those nodes with zero outgoing relationships are considered to be leaf nodes\
    \ and not parents. Conversely, those nodes with outgoing relationships are considered\
    \ to be both a branch and a parent of one or more child nodes.\n\nWhen a node\
    \ has children, in the case of the object model created by JavaParser, this is\
    \ simply represented as a List<Node> called childNodes on the Node class.\n\n\
    The vocabulary of trees also leaves further on definitions: nodes with the same\
    \ parents are siblings. Ancestor and descendant are also used when nodes can be\
    \ related by navigating up or down the tree. Thus all nodes are a descendant of\
    \ the root node.\n\nIn order to model this within the Java language concepts you\
    \ work with MethodDeclaration, Statement, Parameter etc. will be descendants (in\
    \ the object oriented sense) of the Node class in the JavaParser library. For\
    \ the most part, JavaParser has tried to remain true to the names defined within\
    \ the official grammar specification for the naming of the classes.\n\n## When\
    \ is a node, and not a node?\n\nUsually when it is a property of another node.\n\
    \nIn addition to having a particular type to describe the language concept they\
    \ represent e.g. MethodDeclaration nodes should have properties to describe their\
    \ characteristics. Line numbers are a good example of this, for all the nodes\
    \ in an AST, when parsing the library will document the line number of each node.\n\
    \nIf we consider a MethodDeclaration, it will have child nodes that represent\
    \ its name, its argument parameters (if it has), its type, what it returns and\
    \ its body. About other language keywords we can use to define a method e.g. final,\
    \ static, abstract etc? Well, these are defined as a modifier property on the\
    \ MethodDeclaration itself.\n\nCould we separate node entities in their own right,\
    \ rather than a property? Yes. Like most things it was a design choice to represent\
    \ them in this way, and you will find supporters to argue either case.\n\n## Growing\
    \ our first tree\n\nIn order to firm up the intuition for what has been a fairly\
    \ abstract discussion, we're going to look at a graphical representation of what\
    \ will be created by parsing simple class with JavaParser.\n\n> *https://docs.oracle.com/java/specs/jsp/se7/html/ls-18.html*\n\
    \n## A Brief Introduction to Abstract Syntax Trees\n\n```java\npackage com.github.javaparser;\n\
    import java.time.LocalDateTime;\npublic class TimePrinter {\n    public static\
    \ void main(String[] args) {\n        System.out.println(LocalDateTime.now());\n\
    \    }\n}\n```\n\n## Example: TimePrinter\n\nThe above shows:\n\n![](img/ff30983b7326e5199d4352dda9432912_11_0.png)\n\
    \nFig. 1.2 - Compilation Unit\n\nThe figure shows that the compilation unit has\
    \ three children: one for the package declaration, one for import and the last\
    \ being for the class declaration. The tree above represents a significant portion\
    \ of the ClassDeclaration which can be branched further.\n\n![](img/ff30983b7326e5199d4352dda9432912_11_1.png)\n\
    \nFig. 1.3 - Method Declaration\n\nFinally, we can now see the name, the return\
    \ type and the parameter along with a BlockStmt, which again represents a single\
    \ line.\n\n## A Brief Introduction to Abstract Syntax Trees\n\n![](img/ff30983b7326e5199d4352dda9432912_12_0.png)\n\
    \nFig. 1.4 - Block Statement\n\nIn a few words, we hope you can see from this\
    \ example that syntax trees can get complex quickly!\n\n## Beyond Abstract\n\n\
    We should also consider what makes an AST Abstract rather say a Concrete Tree\
    \ or Parse Tree. As with its meaning in the wider area of computer science, it\
    \ is the omission of information.\n\nDuring the support of the JavaParser library,\
    \ we have however come to the realisation that many people desire comments. By\
    \ default, while parsing, the JavaParser library will record comment information\
    \ and include it the tree. The team are also working on ways to provide support\
    \ for whitespace preserving when writing a class.\n\n## A Flying Visit\n\nIn this\
    \ chapter, we're going to take a whistle tour of the key features the JavaParser\
    \ library offers. You can think of it as a quick start guide that will get you\
    \ up running on your local machine.\n\nWe are going to analyze the code of an\
    \ interesting, although basic calculator takes input into the Reverse Polish Notation\
    \ format and calculates the result. It also has a simple memory feature that can\
    \ store a single number, similar to what you would find a regular calculator.\n\
    \nThe class is of a reasonable length so it can be found in Appendix A.\n\n##\
    \ Travelling Companions\n\nFirstly we should introduce you to your main travelling\
    \ companions while journeying with the JavaParser.\n\nIn addition to the numerous\
    \ classes provided to represent language concepts, there are a few principal classes\
    \ that support working with Java ASTs namely the JavaParser, StaticJavaParser\
    \ and CompilationUnit, in addition, there are a variety of Visitor classes. We'll\
    \ look at all of these in detail over the course of this book, but here is a brief\
    \ introduction.\n\nIn a few words:\n\n- The JavaParser class provides a full API\
    \ for producing an AST from code\n- The StaticJavaParser class provides a quick\
    \ and simple API for producing an AST from code.\n- The CompilationUnit is the\
    \ root of the AST\n- The Visitors are classes which are used to find specific\
    \ parts of the AST\n\nAs always JavaDoc is your friend when using Java libraries,\
    \ although this book will endeavour to cover as much as possible it will inevitably\
    \ skip over some areas.\n"
  mdcn: "\n\n## 抽象语法树简析\n\n如果不是先理解语法树的概念，实际上无法考虑 Java 语言解析器将如何发挥作用。\n\n让我们从尝试想象源代码可以被表示为一棵树开始。它们都有一个单一的起点，从这里开始，分支独立地形成，就像代码语句或者在树中，实际的树枝一样。就像真实树的分支一样，拆解复杂语句的过程将持续，直到我们遇到终结节点（terminal）或叶子节点（leaf）。\n\
    \n代表 Java 代码的树将有一个代表整个文件的根节点，连接到根节点的节点是文件中所有的顶级元素，如 `import` 或 `class` 声明。从一个单一的类声明，我们可以到达多个节点，代表该类的字段和方法。\n\
    \n![](img/ff30983b7326e5199d4352dda9432912_9_0.png)\n\n图 1.1 - 抽象语法树初探\n\n正如真实树上的分支除了其起源外，与其他分支之间没有连接一样，表示源代码的树也是如此。人类或编译器可以理解变量引用或方法调用与代码的另一个部分相关，但语法树并不能，这是一个重要的区别。\n\
    \n## 一切皆为节点\n\n然而，树的隐喻只能带我们到这里。\n\n在经典计算机科学的意义上，当我们谈论具有顶点和边的图时（在树的情况下是有向图），取决于你所阅读的文献，这些也可以是节点和关系的同义词。为了本书的目的，我们使用“节点”（node）一词，因为它被认为不复杂，并且与库类保持一致。\n\
    \n> *添加相关元素之间的连接（例如方法调用到方法声明，或字段引用到字段）是“符号解析器”（Symbol Solver）完成的工作。JavaSymbolSolver\
    \ 是为了与 JavaParser 配合而创建的符号解析器。*\n\n## 抽象语法树简析\n\n有几个简单的规则规定了什么是树。除了根节点外，所有节点将恰好有一个入度关系。根节点将为零。所有节点可以有多个出度关系。那些零出度关系的节点被认为是叶子节点而不是父节点。相反，那些具有出度关系的节点被认为既是分支也是一个或多个子节点的父节点。\n\
    \n当节点拥有子节点时，在 JavaParser 创建的对象模型中，这简单地表示为 `Node` 类中名为 `childNodes` 的 `List<Node>`。\n\
    \n树的词汇还留下了进一步的定义：具有相同父节点的节点是兄弟。当节点可以通过向上或向下遍历树建立联系时，也会使用祖先（ancestor）和后代（descendant）。因此，所有节点都是根节点的后代。\n\
    \n为了在常用的 Java 语言概念中建模，`MethodDeclaration`、`Statement`、`Parameter` 等将是 JavaParser\
    \ 库中 `Node` 类的后代（面向对象的意义上）。在大多数情况下，JavaParser 试图在类命名上保持与官方语法规范中定义的名称一致。\n\n##\
    \ 节点什么时候是节点，什么时候不是节点？\n\n通常当它是另一个节点的属性时。\n\n除了具有特定的类型来描述它们所代表的语言概念（例如，`MethodDeclaration`\
    \ 节点应该具有描述其特征的属性），行号就是一个很好的例子，对于 AST 中的所有节点，解析库在解析时会记录每个节点的行号。\n\n如果我们考虑一个 `MethodDeclaration`，它将拥有子节点，代表它的名称、参数（如果有的话）、它的类型、返回值和正体。至于用于定义方法的其他语言关键字（例如\
    \ `final`、`static`、`abstract` 等）？嗯，这些被定义为 `MethodDeclaration` 自身的修饰符属性（modifier\
    \ property）。\n\n我们可以将节点实体单独分离出来，而不是作为一种属性吗？可以。像大多数事情一样，以这种方式表示它们是一种设计选择，你会发现支持这两种论点的支持者。\n\
    \n## 构建我们的第一棵树\n\n为了巩固对这一相当抽象讨论的直觉，我们将查看使用 JavaParser 解析简单类时创建内容的图形化表示。\n\n> *https://docs.oracle.com/java/specs/jsp/se7/html/ls-18.html*\n\
    \n## 抽象语法树简析\n\n```java\npackage com.github.javaparser;\nimport java.time.LocalDateTime;\n\
    public class TimePrinter {\n    public static void main(String[] args) {\n   \
    \     System.out.println(LocalDateTime.now());\n    }\n}\n```\n\n## 示例：TimePrinter\n\
    \n上面的内容显示：\n\n![](img/ff30983b7326e5199d4352dda9432912_11_0.png)\n\n图 1.2 - 编译单元\n\
    \n该图显示编译单元有三个子节点：一个用于包声明，一个用于导入，最后一个用于类声明。上面的树代表了 `ClassDeclaration` 的很大一部分，它可以进一步分叉。\n\
    \n![](img/ff30983b7326e5199d4352dda9432912_11_1.png)\n\n图 1.3 - 类声明\n\n最后，我们可以看到名称、返回类型和参数以及\
    \ `BlockStmt`，后者再次代表了单行。\n\n## 抽象语法树简析\n\n![](img/ff30983b7326e5199d4352dda9432912_12_0.png)\n\
    \n图 1.4 - 语句\n\n在几句话中，我们希望通过这个例子看到语法树会很快变得复杂！\n\n## 超抽象\n\n我们还应该考虑是什么让 AST 是抽象的，而不是具体树（Concrete\
    \ Tree）或解析树（Parse Tree）。\n\n在支持 JavaParser 库的过程中，我们却意识到许多人需要注释。默认情况下，在解析时，JavaParser\
    \ 库会记录注释信息并包含在树中。团队还在研究在编写类时保留空白的方法。\n\n## 快速巡览\n\n在本章中，我们将对 JavaParser 库提供的关键功能进行快速巡览。你可以将其视为一个快速上手指南，让你在本地机器上运行起来。\n\
    \n我们将分析一个有趣的但基础的计算器代码，它接收逆波尔表达式（Reverse Polish Notation）格式并计算结果。它还有一个简单的内存功能，可以存储单个数字。\n\
    \n该类长度适中，可以在附录 A 中找到。\n\n## 旅行伙伴\n\n首先，我们应该向你介绍在在使用 JavaParser 旅程中的主要旅行伙伴。\n\n\
    除了用于表示语言概念的众多类外，还有几个支持处理 Java AST 的主要类，即 `JavaParser`、`StaticJavaParser` 和 `CompilationUnit`，此外还有各种\
    \ `Visitor` 类。我们将在本书中详细讨论这些内容，但这里有一个简要介绍。\n\n用几句话来说：\n\n- `JavaParser` 类提供了从代码生成\
    \ AST 的完整 API。\n- `StaticJavaParser` 类提供了从代码生成 AST 的快速简单的 API。\n- `CompilationUnit`\
    \ 是 AST 的根。\n- `Visitor` 类是用于查找 AST 特定部分的类。\n\n一如既常，在使用 Java 库时，JavaDoc 是你的好朋友，尽管本书将尽可能涵盖，但不可避免地会跳过某些领域。\n\
    \n"
