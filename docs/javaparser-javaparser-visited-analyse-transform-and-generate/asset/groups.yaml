  - "[PAGE 45]\n\n# Solving Symbols and References\n\nJavaParser, like other parsers,\
    \ take information present in source code and it organizes it into a tree, an\
    \ Abstract Syntax Tree.\n\nIn many situations, the information present in the\
    \ AST is sufficient for a user's needs. In other cases however you need to elaborate\
    \ the AST and calculate additional information. In particular, you may want to\
    \ resolve references and find relations between nodes. In a sense, tracing new\
    \ links and transforming a tree to a graph.\n\nWhen we find a name used in Java\
    \ code we recognize it as a symbol. Symbol is the term we use to indicate any\
    \ possible element that could be represented by a name. A symbol could be a variable,\
    \ but also a field or a type.\n\nWhen we encounter this expression:\n\n```\ncontainer.element\n\
    ```\n\nWhat is the container? What is the element? Perhaps container is a variable\
    \ and element is a field of that variable. Or maybe container is a class name\
    \ and element is a static field of that class. At this stage we do not know, so\
    \ we speak generally of symbols.\n\nThe JavaParser Solver is the part of the library\
    \ that examines those symbols and tells us what they really are, finding for us\
    \ the variable declaration, parameter declaration or type declaration that they\
    \ are represented by symbol.\n\nConsider for example case:\n\n```\nvoid aMethod()\
    \ {\n  int a;\n  a = a + 1;\n}\n```\n\nBy looking at the AST we know that a =\
    \ a + 1 corresponds to an assignment. We also know that we are assigning the result\
    \ of the adding 1 to the value of a.\n\nThere are things that we do know:\n\n\
    +   * Is there a symbol a in that context?\n* Can that symbol be assigned?\n*\
    \ What is the type of that symbol?"
  - "[PAGE 46]\n\n# Solving Symbols and References\n\nThink about the last point:\
    \ if a is an int then the result of a + 1 is going to be an int. However a could\
    \ be a String, in that case, we are not summing 1 but we are concatenating its\
    \ string representation to that String represented by a. In other words, by simply\
    \ looking at the AST we cannot say what kind of operation we are performing: an\
    \ algebraic sum or a string concatenation? It depends on the type of a. To answer\
    \ these questions we have to resolve references. We have to connect the reference\
    \ to a in a + 1 to the declaration of a that is being referred.\n\nNow consider\
    \ the following case:\n\n```\nclass Bar {\n  private String a;\n\n  void aMethod()\
    \ {\n    while (true) {\n      int a;\n      a = a + 1;\n    }\n  }\n}\n```\n\n\
    Bar.java\n\nThere are many symbols. Solving a reference means finding the correct\
    \ one and it can be difficult. And trust us, things can get very complex. Luckily\
    \ for you, you can just use the JavaParser Solver to solve references between\
    \ elements of a JavaParser AST.\n\n# How to setup the JavaParser Symbol Solver?\n\
    \nFrom this point forward we will refer to the JavaParser Symbol Solver as the\
    \ 'JavaSymbolSolver', naming things is hard and we don't always get it right first\
    \ time. Future versions may be refactored the class name\n\nJavaSymbolSolver comes\
    \ bundled with the JavaParser core library. This is because each version of the\
    \ JavaSymbolSolver is guaranteed to work with a specific version of JavaParser.\
    \ Historically this was not the case, and the libraries were distributed separately.\n\
    \nIf you previously elected not to include the JavaSymbolSolver and just included\
    \ the javaparser-core artifact in your dependencies you will have to update to\
    \ the bundled version."
