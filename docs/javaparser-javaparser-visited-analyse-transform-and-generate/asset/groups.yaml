    \ whitespace and comments. it is more detailed than the AST, which only contains\
    \ the structural elements of the code. For each node in the AST, the CSM stores\
    \ a list of tokens that represent that node.\n\n| AST Element | CSM Element |\n\
    | :--- | :--- |\n| 1 | child(void) |\n| 2 | token(space) |\n| 3 | child(name)\
    \ |\n| 4 | token(lparen) |\n| 5 | child(param#0) |\n| 6 | token(rparen) |\n| 7\
    \ | token(space) |\n| 8 | child(body) |\n\nNow suppose that you add a parameter\
    \ to this method. What will happen? We will need to update the NodeText.\n"
