  - "[PAGE 49]\n\n# Solving Symbols and References\n\n```\nclass MyClass extends MySuperClass\
    \ {\n    public void returnSomeValue() {\n        System.out.println(aField.size());\n\
    \    }\n}\n```\n\nWhere does aField come from? We do not know, it could be a field\
    \ in MySuperClass. Or maybe MySuperClass extends another class named MyExtraSuperClass\
    \ and that class defines the field name aField.\n\nSo we need to check MySuperClass\
    \ to figure it out. Well, this is what JavaSolver will do for us. In order to\
    \ do that, however, JavaSolver will need to know where to look for classes. Classes\
    \ could be:\n\n+   - in Java source files, if they are classes we are compiling\
    \ right now\n- in class files or JARs from some library\n- in the J, for classes\
    \ like java.Object or java.lang.String\n\nDepending on above, there are different\
    \ TypeSolvers that you need to pass to JavaSolver.\nJarTypeSolver: this TypeSolver\
    \ looks for classes inside a JAR file. You just need to specify where the JAR\
    \ file is located.\n\nJavaParserSolver: this TypeSolver looks for classes defined\
    \ in source files. You just need to specify the root directory. For example a\
    \ src directory. It will look for source files in a directory corresponding to\
    \ the package. So it would look for class a.b.C in the directory b under a directory\
    \ a root directory specified.\n\nReflectionTypeSolver: there are some classes\
    \ that are defined as part of the language and for which there is no JAR. Classes\
    \ like java.lang.Object. For finding the definition of such classes we can use\
    \ reflection.\n\nMemoryTypeSolver: this TypeSolver returns the classes we have\
    \ recorded in it. It is mostly intended for tests.\n\nCombinedTypeSolver: You\
    \ want typically to combine multiple TypeSolver into one. To do that you use the\
    \ CombinedTypeSolver.\n\n# Resolving a type using an absolute name\n\nYou can\
    \ use a TypeSolver directly if you want. What will this do is find an element\
    \ given its qualified name.\n\nConsider this example:"
