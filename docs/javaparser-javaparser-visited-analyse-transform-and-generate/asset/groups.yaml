- md: "\n[content]\n\n## Appendix A - ReversePolishNotation.java\n\nThe sample Reverse\
    \ Polish Notation Calculator source code use in Part 1 examples.\n\n```java\n\
    package com.github.javaparser;\n\nimport java.util.Stack;\nimport java.util.stream.Stream;\n\
    \n/**\n * A Simple Reverse Polish Notation calculator with memory function.\n\
    \ */\npublic class ReversePolishNotation {\n\n    // What does this do?\n    public\
    \ static final int ONE_BILLION = 1000000000;\n\n    private double memory = 0;\n\
    \n    /**\n     * Takes reverse polish notation style string and returns the resulting\
    \ calculation.\n     * @param input matmatical expression in the reverse Polish\
    \ notation format\n     * @return the calculation result\n     */\n    public\
    \ Double calc(String input) {\n        String[] tokens = input.split(\" \");\n\
    \        Stack<Double> numbers = new Stack<>();\n\n        Stream.of(tokens).forEach(t\
    \ -> {\n            double a;\n            double b;\n            switch(t) {\n\
    \                case \"+\":\nb = numbers.pop();\na = numbers.pop();\nnumbers.push(a\
    \ + b);\nbreak;\ncase \"/\":\nb = numbers.pop();\na = numbers.pop();\nnumbers.push(a\
    \ / b);\nbreak;\ncase \"-\":\nb = numbers.pop();\na = numbers.pop();\nnumbers.push(a\
    \ - b);\nbreak;\ncase \"*\":\nb = numbers.pop();\na = numbers.pop();\nnumbers.push(a\
    \ * b);\nbreak;\ndefault:\nnumbers.push(Double.valueOf(t));\n}\n));\nreturn numbers.pop();\n\
    }\n/**\n * Memory Recall uses the number in stored memory, defaulting to 0.\n\
    \ * @return the double\n */\npublic double memoryRecall(){\n  return memory;\n\
    }\n/**\n * Memory Clear sets the memory to 0.\n */\npublic void memoryClear(){\n\
    \  memory = 0;\n}\n```\n\n```java\npublic void memoryStore(double value){\n  \
    \  memory = value;\n}\n/* EOF */\n```\n\n## Appendix B - Visitable Nodes\n\nThe\
    \ following provides a quick reference for all the visible types, for more detailed\
    \ information please consult the JavaDoc¹¹ for each class.\n\n| Parser Type |\
    \ Source Example |\n| --- | --- |\n| AnnotationDeclaration | @interface X { ...\
    \ } |\n| AnnotationMemberDeclaration | @interface X { int i(); } |\n| ArrayAccessExpr\
    \ | getName() { 15*15 } |\n| ArrayCreationExpr | new int[5] |\n| ArrayCreationLevel\
    \ | new int[1][2] |\n| ArrayInitializerExpr | new int[][] { 1, 1, 2, } |\n| ArrayType\
    \ | int[] |\n| AssertStmt | assert |\n| AssignExpr | a=5 |\n| BinaryExpr | a &&\
    \ b |\n| BlockComment | /* My Comment */ |\n| BlockStmt | { ... } |\n| BooleanLiteralExpr\
    \ | false |\n| BreakStmt | break |\n| CastExpr | (long)15 |\n| CatchClause | catch\
    \ (Exception e) { ... } |\n| CharLiteralExpr | 'a' |\n| ClassExpr | Object.class\
    \ |\n| ClassOrInterfaceDeclaration | class X { ... } |\n| ClassOrInterfaceType\
    \ | Object HashMap<String, String> |\n| CompilationUnit | if(a) |\n| ConditionalExpr\
    \ | X { X0 { } } |\n| ConstructorDeclaration | continue |\n| ContinueStmt | do\
    \ { ... } while (a==0) |\n| DoStmt | 100.1 |\n| DoubleLiteralExpr | X { : } |\n\
    | EmptyMemberDeclaration | (1+1) |\n| EnclosedExpr | X { A(1), B(2) } |\n| EnumDeclaration\
    \ | enum X { ... } |\n| ExplicitConstructorInvocationStmt | class X { X() { super(15);\
    \ } } class X { X() { this(1, 2); } } |\n\n| JavaParser Type | Source Example\
    \ |\n| --- | --- |\n| ExpressionStmt | person.name |\n| FieldAccessExpr | private\
