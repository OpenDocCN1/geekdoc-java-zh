  md: "# Chapter 2: Input and Output\n\nIn this chapter we're going to look more closely\
    \ at input and output, which are perhaps the two most critical activities in any\
    \ program. In the previous chapter we looked closely at the output we produced\
    \ with the println command. With println we were able to output three types of\
    \ data to the command line screen: strings, integers, and floating point numbers.\
    \ programs we wrote, however, had no capacity to take input and process data.\n\
    \nIn this chapter we're going to look closely at two types of input. First input\
    \ statements will allow us to programmatically request input from the user. We'll\
    \ then use command line parameters to provide inputs to our program.\n\nAs we\
    \ look output, we'll also look at directing our output to a file instead of back\
    \ to the command line.\nSo now it's time to use your favorite programming music\
    \ (I suggest The Cure), open nano, vi or your favorite text editor and start coding....\n\
    \n# Input Statements\n\nWe're going to start with a program that calc ut the area\
    \ of a rectangle based on a sideA input and a sideB input. Key the following Java\
    \ code into your text editor:\n\n```\nimport java.util.Scanner;\npublic class\
    \ Square {\n    public static void main (String[] args) {\n        System.out.println(\"\
    RECTANGLE AREA CALCULATOR\");\n        Scanner input = new Scanner(System.in);\n\
    \        System.out.println(\"What's the length of side A?\"); float sideA = input.nextFloat();\n\
    \        System.out.println(\"What's the length of side B?\"); float sideB = input.nextFloat();\n\
    \        float area = sideA*sideB;\n        System.out.println(\"The area of your\
    \ rectangle is: \" + area);\n    }\n}\n```\n\nOnce you are sure you have keyed\
    \ in the program correctly and saved it, go ahead and run the program on the command\
    \ line. I saved mine as Square.java. Your output should look similar to figure\
    \ 2.1:"
