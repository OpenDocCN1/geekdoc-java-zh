    There are definitely a few new things here. The first is that we don''t have a
    public static void main. This is because this program doesn''t run in the way
    that we''ve been seeing so far. The main method is generally the entrance point
    for the JVM to start executing our code. It will be in our driver class, which
    we''ll write later. We start our definition of the class with the public class
    keywords and the name of the class—in this case, “Animal.” The public keyword
    gives information about visibility. It tells the JVM that any class is allowed
    to make objects from this class. The Class keyword informs Java as to what this
    file is. Next, you''ll notice I declare a variable named numAnimals variable is
    designed to do some internal housekeeping in the class. Its job, is to track how
    many instances of Animal we create. The static keyword between the datatype and
    the visibility level (which is private) enables us to use this variable as a tracker.
    Static means that you don''t have to create an instance of a class in order to
    access or modify this information. This means that each object doesn''t have an
    instance of “numAnimals” rather it exists in the class.


    After numAnimals I simply create a number of variables detailing information about
    our animals: things as weight, color, length and if it has fur or not.


    A keyword is a reserved word that cannot be used for anything other than its intended
    functions. Examples include: public, private, for, and so. Generally keywords
    will be highlighted by your text editor. The I''m using Coding colors to turn
    purple or class names, as seen on the left side of figure 6.1. Keywords cannot
    be used as variable, function or class names, due to the fact that they''re already
    reserved.


    We then define with the publickeyword in the Animal file what''s known as a “constructor”.
    This method is very important. It does three things: details the information that
    we need in order to make an object based on this class, preforms any internal
    housekeeping and assigns initial values to the fields. It will be executed every
    time that an object is created based on your class.

    The constructor is called by the driver class below.


