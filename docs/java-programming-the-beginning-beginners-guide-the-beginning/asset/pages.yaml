  md: '# Chapter 3: Variables


    In the previous chapter, we looked at input and output, which allow us to get
    data into and out of our Javaprogram. In this chapter we''ll take a closer look
    at one of the most important aspects of programming—variables. You may not equate
    variables with computer programming, but you''ve likely been using variables since
    high school if you took courses in Algebra, Chemistry, and Physics. In classic
    "solve for x" problems, x is a variable.


    Let''s take a look at how the Java programming environment handles variables.


    # Declaring and Initializing Variables


    Java is what is known as a strongly-typed language. This means that variables
    need to be declared before they can be used. In Java, variables are differentiated
    by the type of data they hold. The type of data is referred to as the variable''s
    datatype.


    There are two types of variables in Java: primitive type and class (also reference)
    type.


    # Primitive Variables


    In Java, there are eight primitive data types. They are the byte, short, int,
    long, float, double, boolean and chars.


    The declaration and initialization statements are generally very short, and reserve
    a specific amount of memory depending on what type the variable is. Here''s an
    example of a declaration and initialization for an integer, done in one line:


    ```

    int name = 93;

    ```


    # Class Variables


    Class type variables, also called reference type variables, are generally more
    complex than primitive types. In most cases primitive types are the building blocks
    of class type variables. When you declare and initialize a class variable, the
    name doesn''t represent the object itself, rather it points to the memory location
    that has all the parts of information that make the object.


    There are hundreds of different class type variables out, and they all do different
    things. One you''ve already encountered is a Scanner.

    Here''s the declaration and initialization, one more time:


    ```

    Scanner name = new Scanner(<parameters>);

    ```


    # Strings


    Strings are actually class or reference type variables. They can, however, be
    declared like primitives. This was a sort of short cut put by the Java developers
    to make dealing with strings a bit easier, as they''re one of the most common
    datatypes and are used just as much as the primitives. (Think about how much you''ve
    used them all!)


    If you like, can declare strings like you would class type variables, but there''s
    really no advantage in doing so.

    It would look like:


    ```

    String blogName = new String("Edukwest!");

    ```


    NOTE: Due to strings being class, they cannot be compared like primitive types'
