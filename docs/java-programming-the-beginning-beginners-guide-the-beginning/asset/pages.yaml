- img_proc: true
  md: "encountered. This type of error is known as a Runtime error. It’s one of three\
    \ types of errors that can occur when writing Java code.\n\nThese three types\
    \ are:\nSyntax errors:\n\nSyntax errors are issues with the formatting of your\
    \ code. Examples include forgetting semicolons, not closing your brackets or misspelling\
    \ method names. Text editors generally do a good job of pointing these out, so\
    \ fixing them is rather simple.\n\nRuntime errors:\n\nRuntime errors are a bit\
    \ trickier to catch. Syntactically, all runtime errors are correct, so your text\
    \ editor won’t point them out to you. The issue occurs when something unexpected\
    \ happens and results in the program failing to compile or execute at runtime.\
    \ The result is your program failing Examples include trying to divide by zero\
    \ or trying to call a file that doesn’t exist. Javanon encounter the error until\
    \ you attempt to execute the code.\n\nLogic errors:\n\nThese are errors in the\
    \ actual logic behind the program. They are the most challenging errors to fix,\
    \ because the code isn’t technically wrong, it’s not just giving the correct result.\
    \ Some logical errors go undetected even after the program is released. Examples\
    \ include things like dividing when you should be multiplying, printing the wrong\
    \ output, or opening the wrong file. If you have a logic error, you’re having\
    \ a PICNIC. (Problem In Chair, Not In Computer.)\n\n# Parameterized Input\n\n\
    Your workflow forces you to compile and then run your code before passing input.\
    \ Including parameters with your Java command passes input and executes your code\
    \ in tandem. The resulting command looks like this:\n\n$ java className arg1 arg2\
    \ arg\n\nIn the example above, we still use the Java command and the class name\
    \ of the program we’d like to run. We follow the command with arguments which\
    \ get as input to the program. This could be advantageous in situations where\
    \ we want to run our program without unattendedlike when we’re crunching numbers.\
    \ For example, if we wanted a program to receive the user name and age as input,\
    \ the parameters might look something like this:\n\n$ java moreInput Keshav 17\
    \ The values “Keshav” and “17”, which are separated by a single space, are passed\
    \ to the program. Let’s see how. Key in the following example and save it as MoreInput.java:\n\
    \n```\npublic class MoreInput{\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Your name is: \" + args[0]); System.out.println(\"\
    Your age is: \" + args[1]);\n        System.out.println(\"All the arguments: \"\
    \ + args[0] + \", \" + args[1]);\\ \n    }\n}\n```"
