    # With a for-each loop


    The second method of printing is through the use of a modified loop called a for-each
    loop. The syntax for this loop is simpler than that of the regular loop.


    Add the following code to the end of your PrintingArrays program:


    ```

    System.out.println("With a for each loop_");

    for(int i=0;i<len;i++){System.out.println(array[i]);};

    ```


    The first line in snippet of code produces a separator, so we know which loop
    is generating the output.


    Next is the for loop. The statement within the for''s parentheses is shorter,
    consisting of two components rather than three. This statement also fails to conform
    to what we''ve learned about traditional for loops, as it lacks iterator and conditional.
    This different statement is what makes this a for-each loop rather than a regular
    loop. Whatever code is put inside the loop will be performed for each member of
    the array. In this case we''re printing the array.


    The statement within the parentheses of the loop consists of a variable declaration,
    whose type must match the type of the array you intended to call the loop on and
    the name of the array you intend to use on the loop.


    If, for example, want to print our grocery list array, the for-each loop would
    look like this:

    for(String item: groceries){

    System.out.println(item);

    }


    Because groceries are an array of strings, the variable ‘item’ is a string as
    well.


    This needs to be true for all variables and datatypes declared for use in a for-each
    loop. If you intend to print an array of integers, the holder variable that is
    declared within the parentheses must have a type of integer.


    Arrays are objects and you can use number of methods associated with the Array
    object. You might want to take a look at the official Java documentation and see
    the functions that you can use with arrays. The documentation is available


    http://docs.oracle.com/javase/7/docs/api/util/Arrays.html


    Remember: Learning to read documentation is a valuable skill.


