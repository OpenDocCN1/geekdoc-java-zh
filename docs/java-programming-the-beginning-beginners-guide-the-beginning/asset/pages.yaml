    ```

    System.out.println(3.0/(6+4));

    ```


    In the expression above, the part of the expression in parenthesis will be evaluated
    first due to the order of operations. The result printed is 0.3.


    We’ll look at expressions more closely in our next chapter.


    As a side note, it’s good to understand that the println function is a version
    of the print()function. The ‘Ln’ at the end stands for line. This means after
    printing what you place in the parentheses the function will make a new line to
    print the next expression. The ‘print’ function will simply print whatever you
    put in the parenthesis without introducing its own formatting.'
