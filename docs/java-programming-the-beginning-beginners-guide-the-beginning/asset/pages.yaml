  md: '# Chapter 6: Putting It All Together


    Classes and objects represent not just a programming concept, but a way of looking
    at the world and solving problems. Classes and objects, at a high level, represent
    a process of classification—an activity that is as old as science. When we create
    a class, we create a model of an object that breaks the object down to its core
    activities and attributes. Java is an Object Oriented language, meaning that it
    is completely dependent on the Class and Object structure everything must be contained
    in one. Java isn''t the only language that supports objects. It''s good to have
    an understanding of objects as they are a very common occurrence in programming.


    # Class Versus Objects


    I often tell my students to think of a class as a blueprint of an object. From
    that blueprint, many instances of the class (objects) can be created. From planned
    housing communities: a single blueprint may be used to build many different homes.
    These homes may vary in substantial ways—they may be different colors, have different
    kitchen counters, and different fixtures in the bathrooms—but they are all based
    on the same blueprint.


    In programming, a class defines how an object of the class is described and what
    it can do. It might be useful to think of classes as a set of adjectives and a
    set of verbs. The adjectives give us a way to describe the class, while the verbs
    tell us what the class can do. The set of adjectives used to describe a class
    are known as fields. The set of verbs associated with a class are known as methods.


    If we were describing a class “vehicle” we might include the following methods
    and properties:


    Fields (Adjectives) Methods (Verbs)


    +   color accelerate()

    weight decelerate()

    height turnLeft()

    topSpeed turnRight()

    vehicle startIgnition()

    stopIgnition()


    Obviously this model is greatly simplified. If we were truly trying to represent
    a vehicle in code, we''d likely have to use several interrelated classes. In Java
    we also have to declare the type of each property it would hold. For example,
    the color property would hold a string... When we create an instance of the Vehicle
    Class that we defined in the previous table, we might assign a value to all of
    the properties, like:


    ```

    String color = "blue"; double weight = 5565.3; int height = 48;

    topSpeed = 90;

    String vehicleType = "car";

    ```


    This example assumes an instance (object) created the Vehicle.


    # Coding a Class in Java


    Let''s write the code that represents an Animal class in Java. We''ll create an
    instance'
