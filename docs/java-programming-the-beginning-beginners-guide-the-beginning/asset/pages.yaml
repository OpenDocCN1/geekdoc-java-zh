    ![](img/e5a8dc568f1f48bb56665e2d6b74cfce_9_0.png)


    Figure 1.5: The nano text editor.


    You can start nano by typing nano and hit enter on the command line.


    vi is a slightly more complex (and even "old school") text editor. The most important
    thing to understand about vi is that there are two modes: command mode and insert
    mode. To enter insert mode, press ''i'' on your keyboard. When you want to move
    into command mode to issue commands like write and quit, hit the ESC key. If you
    screw up and find yourself in the wrong mode, press ESC a lot and that seems to
    get you back into command mode from wherever you are.


    There''s an old joke about vi that goes like this: vi has two modes, and you''re
    in the wrong one. (One if you don''t think that''s funny right now, you will use
    vi for a bit!)


    When you enter vi, type i into insert mode and you''ll be able to type your code.
    When you''re done, hit ESC to move into command mode. All commands must be preceded
    by a colon. To write your file you''ll enter :w. To quit you''ll enter :q vi also
    lets combine commands. For example, the combination :wq will write your file and
    then quit to the command line.


    Figure 1.6: vi wants to help you children in Uganda. It offers limited help for
    new programmers worldwide.


    You can start vi by typing vi and hitting return on the command line.


    So now you should have your text editor started and be ready to enter your code.
