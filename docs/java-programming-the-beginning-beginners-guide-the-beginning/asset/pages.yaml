  md: "So what happened? Instead of compiling allowing the code to run, the program\
    \ exited with an error. Luckily the error is easy to fix. the nextFloat() function\
    \ is designed to accept the float datatype and only datatype. When you enter anything\
    \ that isn't a floating number, it causes you an error in figure 2.2. We have\
    \ a different function that is intended for string use, call nextLine().\n\nEdit\
    \ your code as follows:\n\n```\nimport java.util.Scanner; class StringInput{\n\
    public static void main(String[] args) {\n  Scanner input = new Scanner(System.in);\n\
    \  System.out.println(\"What's your name?\");\n  String name = input.nextLine();\n\
    \  System.out.println(\"Hello \" + name);\n}\n```\n\nNote: The scanner has a function\
    \ to obtain every kind of data type.\nHere are some examples:\n\n+   nextLine()\
    \ : Strings\nnextInt() : Integers\nnextFloat() : Floating point numbers nextDouble()\
    \ : Doubles\nYou can probably recognize the pattern. The documentation of the\
    \ methods for the Scanner object is available:\n\nhttp://docs.oracle.com/Java/7/docs/api/Java/util/Scanner.html\n\
    \nLearning how to read the Java documentation is an important skill itself.\n\n\
    ![](img/e5a8dc568f1f48bb56665e2d6b74cfce_17_0.png)\n\nFigure 2.3:\n\nSo much better\
    \ with nextLine()!\n\nWhen you're working with strings, you should use the nextLine()\
    \ function which does not scan for a datatype other than Strings. It'll always\
    \ return whatever the user enter into the prompt as a string, including numbers\
    \ or symbols.\n\n# Errors\n\nThe preceding example was probably one of the first\
    \ examples of an error that you've"
