    The first line of this code is slightly different from what you’re used to use
    from this chapter. There is the addition of the "extends" keyword followed by
    Vehicle. This notifies Java that GroundVehicle is a child of Vehicle. In other
    words GroundVehicle is derived from Vehicle.


    In Java, all classes, regardless of whether they extend the keyword, are an extension
    of the Object class. As a result of the every hierarchical tree sets the Object
    class.


    Our tree appears as follows:

    GroundVehicle is a Vehicle which is an Object.


    **Talk the Talk:** In object programming when a programmer references the child
    they say the class shares an "is/an" relationship with the parent class.


    The next lines of code add two new fields to our object. The VehicleType variable
    allows us to pass in a string "car", "motorcycle" or "truck". Both of these new
    variables exist in addition to all of the variables in the Vehicle class. Vehicle’s
    variables can be accessed through the "super" keyword. Since GroundVehicle is
    a subclass of Vehicle, GroundVehicle has inherited Vehicle’s attributes and functionality.


    The super keyword allows you to reference fields, constructors and methods of
    the direct parent (class after the "extends" keyword) class.'
