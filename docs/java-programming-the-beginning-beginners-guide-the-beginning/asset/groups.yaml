    \ You'll note that the values() function returns all of the values in the dictionary,\
    \ while the keySet() function returns all of the keys. This chapter gives you\
    \ a broad introduction to working with data. Almost every program, to some degree,\
    \ works with data. Being effective at working with data is an important part of\
    \ any programmer's toolbox.\n\n## Chapter 6: Putting It All Together\n\nClasses\
    \ and objects represent not just a concept, but a way of looking at the world\
    \ and solving problems. Classes and objects, at a high level, represent a process\
    \ that is as old as science. When we create a class, we create a model of an object\
    \ that breaks the object down to its core attributes. Java is an Object Oriented\
    \ language, meaning that Class and Object structure must be contained in one.\
    \ Java is not the only language that supports objects. It's good to have an understanding\
    \ of objects as they are a common occurrence in programming.\n\n## Class Versus\
    \ Objects\n\nI often tell my students to think of a class as a blueprint of an\
    \ object. From that blueprint, many instances of the class (objects) can be created.\
    \ These instances may vary in substantial ways—they may be different colors, have\
    \ different counters, and different fixtures—but they are all based on the same\
    \ blueprint.\n\nIn programming, a class defines how an object is described and\
    \ what it can do. It might be useful to think of classes as a set of adjectives\
    \ and a set of verbs. The adjectives give us a way to describe the class, while\
    \ the verbs tell us what it can do. The set of adjectives used to describe a class\
    \ are known as fields. The set of verbs associated with a class are known as methods.\n\
    \nIf we were describing a class “vehicle” we might include the following methods:\n\
    \n| Fields (Adjectives) | Methods (Verbs) |\n| :--- | :--- |\n| color | accelerate()\
    \ |\n| weight | decelerate() |\n| height | turnLeft() |\n| topSpeed | turnRight()\
    \ |\n\nThis model is greatly simplified. If we were truly trying to represent\
    \ a vehicle in code, wed likely have to use several classes. In Java we also have\
    \ to declare the type of each property it would hold. For example, the color property\
    \ would hold a string... When we create an instance of the Class that we defined\
    \ in the previous table, we might assign a value to all of the properties, like:\n\
    \n```\nString color = \"blue\"; double weight = 55.3; int height = 48;\ntopSpeed\
    \ = 90;\nString vehicleType = \"car\";\n```\n\nThis example assumes an instance\
    \ (object) created the Vehicle.\n\n## Coding a Class in Java\n\nLet's write the\
    \ code that represents an Animal class in Java. We'll create an instance of that\
    \ class called myDog in another file, a bit later.\n\n```java\npublic class Animal\
    \ {\n    private static int numberOfAnimals = 0; \n    public int length;\n  \
    \  public String color;\n    public double weight;\n    public boolean hasFur;\n\
    ```\n\n```java\npublic Animal(int Length, double Weight, String Color, boolean\
    \ Fur) {\n    color = Color;\n    weight = Weight;\n    hasFur = Fur;\n    length\
    \ = Length;\n    numberOfAnimals++;\n}\n```\n\nThere are definitely a few new\
