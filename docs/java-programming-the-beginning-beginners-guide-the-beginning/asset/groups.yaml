    # Chapter 5: Dealing with Data


    In the last chapter we examined control structures, conditionals, and loops, which
    are critical in some programming languages. They allow your programs to make decisions
    based on the criteria that you set as the developer. In this chapter, we''re going
    to switch gears and examine data and how it''s stored. We''ll take a close look
    at four data structures: Arrays, ArrayLists, Immutables, and HashTables. You may
    not have given much thought to data before. The easiest way to conceptualize data
    is as organized information.


    Different types of information lend itself to being organized in different ways.
    For example, if your data is a grocery list, then an Array would be the optimal
    way to organize your data. However, if you wanted to store student grades on assignments
    over a period of time, an Array wouldn''t work well at all. There are many different
    data structures used by programmers and each is optimized for a different type
    of data.


    Let''s start with a simple grocery list.


