    Your age is: 17\nAll the arguments: Keshav, 17\npatel: ~ $\n```\n\n图 2.4：命令行参数在\
    \ Koding 命令行上作为输入处理。\n\n**注意：** 参数进入 Java 时是按顺序编号的，因此在我们的情况下，用户名是参数 0，年龄是参数 1。在代码中，我们分别调用\
    \ **args[0]** 和 **args[1]**。是因为 Java 从 0 开始，而不是 1。\n\n# 输出到文件\n\n到目前为止，代码的输出只重定向到了命令行。并不总是如此。输出可以重定向到文件中进行更持久的存储。能够存储（或或）数据是程序员需要学习的一项重要技能。让我们写一个程序，让用户输入几条数据并将其存储在文件中。\n\
