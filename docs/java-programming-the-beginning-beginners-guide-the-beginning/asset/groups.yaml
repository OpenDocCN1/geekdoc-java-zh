    \ casting）来避免这个问题。这会在进行数学运算和打印之前更改变量的类型，这意味着我们将得到真实的答案而不是近似值。\n\nJava 要求你识别变量的类型。当使用不同类型的变量时，你可能需要显式地说明你希望结果是什么种类型的变量。根据经验法则：较小的变量会自动向上转换，但较大的变量必须手动向下转换。\n\
    \n以下是层级结构：\nbyte < short < int < long < float < double\n\n配合 `float` 使用 `int`\
    \ 不需要类型转换。但使用 `float` 和 `int` 获取一个 `int` 类型的答案则**需要**你显式地转换变量。\n\n最后的打印语句在表达式中使用了模运算语句。当你使用\
