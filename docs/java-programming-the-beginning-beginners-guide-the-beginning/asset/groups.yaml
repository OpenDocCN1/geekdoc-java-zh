    We’re going to be using a language called Java in this book. Installing Java on
    your machine is rather simple and the process is generally the same for most major
    operating systems. With your browser you’re going to navigate to oracle.com. Oracle
    is the company that maintains Java, the JDK (Java Development Kit) that you need
    to download to write code in Java.


    Once on Chrome, find “Downloads” on the menu bar and click on “Java for Developers”
    under “Popular Downloads”.

    Figure 1.2: Oracle.com with the Downloads menu.


    After clicking that link you will see a download page. A dialog box will appear
    that reads JDK, with a download button under. When you click, it will redirect
    you to a page where you can select your operating system. The website will provide
    a set of instructions detailing how to install the JDK onto your computer. Figure
    1.3: The terminal in the author’s computer. Note that the author changed the default
    colors through the terminal’s preferences


    In the event that you’d rather go through the process of installing a JDK to your
    machine I recommend you use the Linux server provided by my friends at Koding.
    Point your browser to www.Koding.com and register for their free account. The
    free account gives you a virtual Linux machine you can access through your web
    browser—and it can compile and run Java right out of the box! No downloads required.It’s
    what I used to write code that we’ll be using in this book.


    Once you have your account, click the button to turn on your VirtualMachine(VM)
    and get coding.You’ll be using a text editor on Koding to write Java files and
    the terminal to run them.


    Figure 1.4: Command Line (or Terminal) in Koding.com.


    # Writing and Running Your Code


    Now that you have your environment setup, it’s time to (finally) write some code.
    We’ll write code in a text editor. A text editor is different than a word processor.
    A word processor will introduce invisible formatting into code. If you were to
    write code in a word processor it would likely cause an error due to the embedded
    formatting.


    A text editor, on the other hand, saves the text you enter as pure text — without
    introducing unnecessary formatting. The text produced by a text editor can be
    easily processed by the Java compiler. Within the command line environments in
    the Koding.com virtual machine and on the Mac there are two text editors you can
    use. They are known as nano and vi. These text editors have a heritage that goes
    back to the 1970s—so as you can truly call them “old school!” The other option
    is to use the default text editor on Koding, TextEdit on a Mac or Notepad on Windows.
    They’re all self-explanatory, although some may need a few settings changed to
    highlight Java code. As a side note, make that whenever you save your code files,
    you save them as “filename.java”.


    nano


    Nano is an easy to use Linuxbased editor. It’s pretty intuitive. You can simply
    start typing your code when the nano environment loads. Nano has a number of control
    codes which'
