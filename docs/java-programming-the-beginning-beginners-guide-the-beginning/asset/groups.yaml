    # 第1章：编写你的第一个程序


    欢迎。如果这是你第一次编程，那么恭喜你！你即将开始一段冒险。如果你是在之前的尝试失败后尝试学习的，你理应获得认可。应对编程并不总是容易——但它并不是普通人的能力范围之外。


    多年来，我通过在线和线下教授了超过 50 万人的编程。我多年来遇到的程序员——无论是初学者还是资深老手——都来自不同的背景。我发现博士学位和高中中辍的学生都能成为优秀的程序员。我的班级多年来一直出现过数学家、精神科医生和
    12 岁的孩子，他们都学会了一些编程。


    你会学会的。在本介绍章节中——专为略微疑虑的初学者设计——我将带你一步到位。


