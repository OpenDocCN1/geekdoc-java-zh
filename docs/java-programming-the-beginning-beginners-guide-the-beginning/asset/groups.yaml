    All the arguments: \" + args[0] + \", \" + args[1]); \n    }\n}\n```\n\n接下来，让我们运行程序并提供命令行参数作为输入：\n\
    $ java StringInput Keshav 17\n\n你应该得到一个与图 2.4 所示的结果：\n\n```\nMoreInput.j...  \
