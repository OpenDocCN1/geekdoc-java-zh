    # For loops


    So we''ve determined that forgetting to use a proper iterator can be bad for your
    program. How can we avoid an endless loop? The answer is a for loop. For loops
    do the same as while loops, however they will only execute a set of times you
    are forced to iterate an iterator and as part of the loop''s syntax in addition
    to a conditional. As a result it extremely difficult to create for a for loop
    that executes endlessly.


    Here''s an example of a very simple for loop. It does the same thing as our first
    loop: Prints 0 to 100, counting by fives.


    ```

    This loop is in a file called Loop3;

    public static void main(String[] args) {

    for(int x = 0; x<100; x+=5) { System.out.println(x); }

    }

    ```'
