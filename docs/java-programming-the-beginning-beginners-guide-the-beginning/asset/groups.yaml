    # # Chapter 1: Writing Your First Program


    Welcome. If this is your first time programming, congratulations! You’re about
    to start an adventure that If you are trying to learn after a previous abortive
    attempt, you deserve recognition as. Tackling programming isn’t always easy—but
    it’s not outside the grasp of the average person, either.


    Over the years, I’ve taught programming to over 500,000 people both online and
    in person. The programmers I’ve met over years—both beginners and seasoned vets—have
    come from a variety of backgrounds. I’ve found that PhDs and high school dropouts
    can make good programmers. I’ve had mathematicians, psychiatrists, and 12 year
    olds in my classes the years and all have been able to learn some programming.


    You will learn. In this introductory chapter—which is specially designed for the
    slightly apprehensive beginner—I am going to take you step-by-step through the
    process of writing your first program. You don’t need any special equipment except
    a laptop or desktop computer.


    So without furtherdelay, let’s get started!


    # ## What You’re Going to Learn


    This first chapter will serve as an introduction to setting up your programming
    environment and getting started. Each chapter following is designed to take you
    through the basics of a certain aspect of development and give you a foundation
    for greater learning. Just to give you some context, here’s what is coming up
    in the rest of the book:


    Chapter 2: Input and Output


    Input and output are key to any program. In this chapter we’ll look at how to
    get data into and out of a program.


    Chapter 3: Understanding Variables


    Variables are key building blocks in any program. This chapter takes readers through
    declaring and utilizing variables in expressions. Video tutorial included.


    Chapter 4: Conditionals and Loops


    Conditionals and Loops allow programs to make decisions that alter the execution
    of the program and result. These will be demonstrated and explained in the chapter


    Chapter 5: Dealing with Data


    Almost every useful program, to some extent, deals with data. In this chapter
    you’ll learn how to store various forms of data in a program.


    Chapter 6: Putting it All Together


    In this final chapter, readers will learn how to create a useful program that
    processes and stores data, using the skills developed in the previous chapters.


    Before we write any programs, we have to get your development environment set
    up. I won’t make you buy anything and you’ll have a few options to choose from.


    Figure 1.1: The Author’s Development Environment. Doobie Brothers’ music not included


    # ## Setting Up Your Development Environment'
