    \ examples of an error that you've encountered. This type of error is known as\
    \ a Runtime error. It’s one of three types of errors that can occur when writing\
    \ Java code.\n\nThese three types are:\n\n### Syntax errors:\nSyntax errors are\
    \ issues with the formatting of your code. Examples include forgetting semicolons,\
    \ not closing your brackets or misspelling method names. Text editors generally\
    \ do a good job of pointing these out, so fixing them is rather simple.\n\n###\
    \ Runtime errors:\nRuntime errors are a bit trickier to catch. Syntactically,\
    \ all runtime errors are correct, so your text editor won’t point them out to\
