    \ | | | |\n\n图 6.4 输出是我们在 `VehicleDriver` 类中输入的字符串，因为那是我们放在 `return` 语句之后的内容。\n\
    \n```\nkpatel: ~ $ javac VehicleDriver.java\nkpatel: ~ $ java VehicleDriver\n\
    Vehicle is moving.\nHorse and Buggy is driving\nkpatel: ~ $ \n```\n\n图 6.5：我们在\
    \ `GroundVehicle` 类中更具体的方法导致了更具体的输出。\n此代码段的第一行是 `GroundVehicle` 对象的实例化，我们用它制作了一辆马车（horse\
    \ and buggy）。下一行创建了一个字符串，并将其设置为 `startMoving` 方法的输出。最后一行打印结果。\n\n最后，让我们看看类扩展能够实现的另一种功能。\n\
    \n将最后几行复制到驱动类中：\n`Vehicle goKart = new GroundVehicle(25,\"Yellow\", 3, true, 4,\
    \ \"GoKart\");`\n`System.out.println(goKart.startMoving());`\n\n观察对象的声明和实例化。它们并不匹配。然而当我们编译并运行这段代码时没有问题，因为\
    \ `GroundVehicle` 是 `Vehicle` 的一种类型。由于 `GroundVehicle` 类派自 `Vehicle` 类，可以使用 `Vehicle`\
    \ 变量。\n\n"
