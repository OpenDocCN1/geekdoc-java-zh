  mdcn: "\n\n通过扩展车辆类（vehicle class），我们创建了子类。子类继承了父类（在本例中为 `Vehicle` 类）的字段、方法甚至是构造函数。\n\
    \n在你的文本编辑器中打开一个新文件，并将以下代码保存为 `GroundVehicle.java`：\n\n```java\npublic class GroundVehicle\
    \ extends Vehicle{\n    int numWheels; String vehicleType;\n\n    public GroundVehicle(int\
    \ setSpeed, String setColor, double setWeight, boolean tellIfMoving, int setNumWheels,\
    \ String type) {\n        super(setSpeed, setColor, setWeight, tellIfMoving);\n\
    \        numWheels = setNumWheels;\n        vehicleType = type;\n    }\n\n   \
    \ public String startingMoving(){\n        isMoving = true;\n        return vehicleType\
    \ + \" driving\";\n    }\n\n    public String stopMoving(){\n        isMoving\
    \ = false;\n        return vehicleType + \" isn driving\";\n    }\n\n    public\
    \ String getColor(){\n        return color;\n    }\n}\n```\n\n这段代码的第一行与你在本章中使用的略有不同。它增加了\
    \ `extends` 关键字，后面跟着 `Vehicle`。这通知 Java `GroundVehicle` 是 `Vehicle` 的子类。换句话说，`GroundVehicle`\
    \ 派自 `Vehicle`。\n\n在 Java 中，所有类无论是否使用了 `extends` 关键字，都是 `Object` 类的扩展。结果是，每个层次树都以\
    \ `Object` 类为根。\n\n我们的树结构如下所示：\nGroundVehicle 是一个 Vehicle，而 Vehicle 是一个 Object。\n\
    \n**专业术语：** 在面向对象的编程中，当程序员引用子类时，他们说该类与父类之间存在“是”（is/an）的关系。\n\n接下来的代码行为我们的对象添加了两个新字段。`VehicleType`\
    \ 变量允许我们传入字符串“car”（汽车）、“motorcycle”（摩托车）或“truck”（卡车）。这两个新变量与 `Vehicle` 类中的所有变量共同存在。Vehicle\
    \ 的变量可以通过 `super` 关键字访问。由于 `GroundVehicle` 是 `Vehicle` 的子类，因此 `GroundVehicle`\
    \ 继承了 `Vehicle` 的属性和功能。\n\n`super` 关键字允许你引用直接父类（`extends` 关键字之后的类）的字段、构造函数和方法。\n\
    \n我们已经在 `GroundVehicle` 类的构造函数中使用 `super` 关键字引用了构造函数。我们将 `super` 关键字视作 `Vehicle`\
    \ 的实例化语句。\n\n正常的实例化看起来如下：\n\n```\nnew Vehicle(100,\"Orange\",1034.2, false);\n\
    ```\n\n在构造函数内部，“new Vehicle”已被“super”取代，结果由于调用了父类的构造函数，`GroundVehicle` 中所有的隐藏字段在构造时都将得到填充。\n\
    \n构造函数之后，我们有三个方法。它们更改了车辆类中的一个变量，然后返回一个确认该更改的字符串。阅读 `GroundVehicle` 中前两个方法的名称，然后看\
    \ `Vehicle` 中的两个方法。当子类中的方法与其父类方法同名时，它们会重写（override）父类方法。我们只是更改了方法的功能，仅此而已。如果我们更改了任何其他内容，例如返回类型，我们就是重载（overloading）了该方法。\n\
    \n记住，我们需要一个驱动类来使用我们的对象。\n\n将以下代码复制到名为 `VehicleDriver.java` 的文件中：\n\n```java\n\
