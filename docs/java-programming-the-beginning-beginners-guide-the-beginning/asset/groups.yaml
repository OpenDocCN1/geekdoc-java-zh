    \ The child class inherits the fields, methods and even the constructor of the\
    \ parent (Vehicle in our case) class.\n\nOpen a new file in your text editor,\
    \ and save the following code as GroundVehicle.java:\n\n```java\npublic class\
    \ GroundVehicle extends Vehicle{\n    int numWheels; String vehicleType;\n\n \
    \   public GroundVehicle(int setSpeed, String setColor, double setWeight, boolean\
    \ tellIfMoving, int setNumWheels, String type) {\n        super(setSpeed, setColor,\
    \ setWeight, tellIfMoving);\n        numWheels = setNumWheels;\n        vehicleType\
    \ = type;\n    }\n\n    public String startingMoving(){\n        isMoving = true;\n\
    \        return vehicleType + \" driving\";\n    }\n\n    public String stopMoving(){\n\
    \        isMoving = false;\n        return vehicleType + \" isn driving\";\n \
    \   }\n\n    public String getColor(){\n        return color;\n    }\n}\n```\n\
    \nThe first line of this code is slightly different from what you’re used to use\
    \ from this chapter. There is the addition of the \"extends\" keyword followed\
    \ by Vehicle. This notifies Java that GroundVehicle is a child of Vehicle. In\
    \ other words GroundVehicle is derived from Vehicle.\n\nIn Java, all classes,\
    \ regardless of whether they extend the keyword, are an extension of the Object\
    \ class. As a result of the every hierarchical tree sets the Object class.\n\n\
    Our tree appears as follows:\nGroundVehicle is a Vehicle which is an Object.\n\
    \n**Talk the Talk:** In object programming when a programmer references the child\
    \ they say the class shares an \"is/an\" relationship with the parent class.\n\
    \nThe next lines of code add two new fields to our object. The VehicleType variable\
    \ allows us to pass in a string \"car\", \"motorcycle\" or \"truck\". Both of\
    \ these new variables exist in addition to all of the variables in the Vehicle\
    \ class. Vehicle’s variables can be accessed through the \"super\" keyword. Since\
    \ GroundVehicle is a subclass of Vehicle, GroundVehicle has inherited Vehicle’s\
    \ attributes and functionality.\n\nThe super keyword allows you to reference fields,\
    \ constructors and methods of the direct parent (class after the \"extends\" keyword)\
    \ class.\n\nWe already referenced constructor using the super keyword in the constructor\
    \ of our GroundVehicle class. We treated the super keyword like the instantiation\
    \ statement of Vehicle.\n\nThe normal instantiation would look like this:\n\n\
    ```\nnew Vehicle(100,\"Orange\",1034.2, false);\n```\n\n“new Vehicle\" has been\
    \ replaced by “super” within the constructor and as a result all the hidden fields\
    \ within GroundVehicle will be populated upon construction due to invoking the\
    \ parent’s class constructor.\n\nAfter the constructor we have three methods.\
    \ They change one variable within the vehicle class and then return a string that\
    \ confirms their change. Read the name of the first two methods in GroundVehicle\
    \ and then the two methods in Vehicle. When methods in a child class share the\
    \ same name as their superclass, they override the super method. We are changing\
    \ the functionality of the method and nothing more. If we changed anything more,\
    \ such as the return type, we would be overloading the method.\n\nRemember, we\
    \ need a driver class in order to use our objects.\n\nCopy the following code\
    \ to a file named VehicleDriver.java:\n\n```java\npublic class VehicleDriver{\n\
    \  public static void main(String[] args) {\n    Vehicle transportationMachine\
    \ = new Vehicle(50,\"Blue\",210,false);\n    System.out.println(transportationMachine.startMoving());\n\
    \  }\n}\n```\n\nThe output of this code is:\n\n| Terminal | Vehicle.Java | VehicleDri...\
    \ | + |\n| --- | --- | --- | --- |\n| kpath: - $ javac VehicleDriver.java | |\
    \ | |\n| kpath: - $ Java VehicleDriver | | | |\n| Vehicle is moving. | | | |\n\
    | kpath: - $ [] | | | |\n\nFigure 6.4 The output is the string we typed in the\
    \ Vehicle Driver class, as that is what we put after the return statement.\n\n\
    ```\nkpatel: ~ $ javac VehicleDriver.java\nkpatel: ~ $ java VehicleDriver\nVehicle\
    \ is moving.\nHorse and Buggy is driving\nkpatel: ~ $ \n```\n\nFigure 6.5: The\
    \ more specific method in our GroundVehicle class resulted in a more specific\
    \ output.\nThe first line of this code snippet is the instantiation for the GroundVehicle\
    \ object which we use to make a horse and buggy. The next line makes a string,\
    \ and sets it to the output of the startMoving method. The final line prints results.\n\
    \nFinally let's look at one more that class extensions are capable of.\n\nCopy\
    \ these last line into the driver class:\nVehicle goKart = new GroundVehicle(25,\"\
    Yellow\", 3, true, 4, \"GoKart\");\nSystem.out.println(goKart.startMoving());\n\
    \nLook at the declaration and instantiation of the object. They do not match.\
    \ However when we compile and run this code, there are no issues due the the fact\
    \ that GroundVehicle is a type of Vehicle. Since the GroundVehicle class is derived\
    \ from the Vehicle class, a Vehicle variable can be used to hold a GroundVehicle\
    \ type object, which we’ve done in our code.\n\nHowever a GroundVehicle type variable\
    \ cannot be used to hold a Vehicle type object! A GroundVehicle is a Vehicle,\
    \ but a Vehicle is not necessarily a GroundVehicle.\nGroundVehicle has parameters\
    \ that not all Vehicles have, an example being number of wheels.\n\nThis is true\
    \ in all programming techniques. The less vague objects can be contained within\
    \ vague variables. Vaguer objects cannot be contained within a more specific variable.\n\
    \nThis also means you can place a GroundVehicle, or a Vehicle within an Object\
    \ type variable, as all reference type objects are derived from the Object class.\
    \ (Everything is an object.)\n\nAt this point you may be wondering what happens\
