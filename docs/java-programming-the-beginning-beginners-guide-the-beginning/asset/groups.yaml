    Congratulations! You’ve written a program that stores data permanently. You are\
    \ well on your way to being a programmer!\n\n# Chapter 3: Variables\n\nIn the\
    \ previous chapter, we looked at input and output, which allow us to get data\
    \ into and out of our Java program. In this chapter we'll take a closer look at\
    \ one of the most important aspects of programming—variables. You may not equate\
    \ variables with computer programming, but you've likely been using variables\
    \ since high school if you took courses in Algebra, Chemistry, and Physics. In\
    \ classic \"solve for x\" problems, x is a variable.\n\nLet's take a look at how\
    \ the Java programming environment handles variables.\n\n## Declaring and Initializing\
    \ Variables\n\nJava is what is known as a strongly-typed language. This means\
    \ that variables need to be declared before they can be used. In Java, variables\
    \ are differentiated by the type of data they hold. The type of data is referred\
    \ to as the variable's datatype.\n\nThere are two types of variables in Java:\
    \ primitive type and class (also reference) type.\n\n## Primitive Variables\n\n\
    In Java, there are eight primitive data types. They are the byte, short, int,\
    \ long, float, double, boolean and char.\n\nThe declaration and initialization\
    \ statements are generally very short, and reserve a specific amount of memory\
    \ depending on what type the variable is. Here's an example of a declaration and\
    \ initialization for an integer, done in one line:\n\n```\nint name = 93;\n```\n\
    \n## Class Variables\n\nClass type variables, also called reference type variables,\
    \ are generally more complex than primitive types. In most cases primitive types\
    \ are the building blocks of class type variables. When you declare and initialize\
    \ a class variable, the name doesn't represent the object itself, rather it points\
    \ to the memory location that has all the parts of information that make the object.\n\
    \nThere are hundreds of different class type variables out, and they all do different\
    \ things. One you've already encountered is a Scanner.\nHere's the declaration\
    \ and initialization, one more time:\n\n```\nScanner name = new Scanner(<parameters>);\n\
    ```\n\n## Strings\n\nStrings are actually class or reference type variables. They\
    \ can, however, be declared like primitives. This was a sort of shortcut put by\
    \ the Java developers to make dealing with strings a bit easier, as they're one\
    \ of the most common dataatypes and are used just as much as the primitives. (Think\
    \ about how much you've used them all!)\n\nIf you like, can declare strings like\
    \ you would class type variables, but there's really no advantage in doing so.\n\
    It would look like:\n\n```\nString blogName = new String(\"Edukwest!\");\n```\n\
    \nNOTE: Due to strings being class, they cannot be compared like primitive types\
    \ using the general comparison operators like < > or ==.\n\nHere, we've created\
    \ a variable **blogName** and initialized it with the string value **Edukwest**.\
    \ The equals sign in this context is the assignment operator. The string value\
    \ **Edukwest** is being assigned to the variable **blogName**.\n\nOnce a variable\
    \ has been declared, generally you can do a lot with it. Here's an example of\
    \ using variables to change what is printed in a sentence. In the following code.\
    \ (Feel free to substitute your own values for the variables.) Notice that comments\
    \ are indicated by two slashes (//). Multi-line comments can be made with a slash\
    \ and an asterisk and with an asterisk.\n\n```\npublic class Variables {\n   \
    \ public static void main(String[] args) {\n        float gpa = 3.95f;\n     \
    \   int age = 17;\n        String name = \"Keshav\";\n        Note:\n        System.out.println(name\
    \ + \" is \" + age + \" \" + gpa);\n    }\n}\n```\n\nSave this code as Variables.java\
    \ and run it. Your output should be similar.\n\n## String\n\n## Integer\n\nInteger\
    \ variables contain whole numbers.\n\n## Floating Point Values\n\nFloating point\
    \ variables contain decimal points.\n\n```java\nimport java.util.*;\npublic class\
    \ Var {\n    public static void main(String[] args) {\n        Scanner names =\
    \ new Scanner(System.in);\n        String firstName, lastName, middleName;\n \
    \       System.out.println(\"What's first name?\");\n        firstName = names.nextLine();\n\
    \        System.out.println(\"What's last name?\");\n        lastName = names.nextLine();\n\
    \        System.out.println(\"What's middle name?\");\n        middleName = names.nextLine();\n\
    \        System.out.println(firstName + \" \" + lastName + \" \" + middleName);\n\
    \    }\n}\n```\n\nFigure 3.1: Variables.java\n\nFigure 3.2: MathDemo\n\nEntering\
    \ the code and running the following yields:\n\n```\npublic class MathDemo {\n\
    \    public static void main(String[] args) {\n        int alpha = 3;\n      \
