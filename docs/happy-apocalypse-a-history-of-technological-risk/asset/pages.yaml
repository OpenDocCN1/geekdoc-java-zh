    This chapter, then, has two goals. The first is to identify, through a focus on
    steam engines, the material infrastructure of legal liberalism; that is, the technical
    devices that made it possible to maintain the simulacrum of a liable individual.
    The second is to show that the theories of occupational risk and compulsory insurance
    were far from a break with liberal economic principles, but, instead, followed
    in line with Chaptal''s old project of providing security to industrial capital.


    # 1. Standards, responsibility and self-discipline


    Liability is based on predictability: an accident is grounds for compensation
    insofar as the judge can apportion blame, is, show that an individual failed to
    foresee the consequences of his own action. To produce responsible human beings,
    technology thus had to be made predictable as the laws of nature. At first sight,
    in the technological context of the 1820s, this ought to have posed no difficulty.
    Steam obeys linear mathematical laws (PV = nRT) and seems emblematic of a predictable
    and controllable technical system.


    Yet, throughout the century, steam would, in fact, pose resolvable problems. While
    most explosions could be explained by an overloaded valve or damaged sheet metal,
    others remained complete mysteries. For example, boilers sometimes exploded when
    the valve opened. The explanation ventured by the engineers was the following:
    the sheet metal built up heat and the water under pressure did not boil. When
    the valve opened, the pressure dropped and the boiling water hit the overheated
    metal and evaporated, thus causing the explosion. The theory of the spheroidal
    state of water explained the explosions that occurred when the boiler cooled down:
    the water suspended on a cushion of superheated steam suddenly fell onto the burning-hot
    metal sheets. Other hypotheses cited the formation of hydrogen gas upon the water''s
    contact with the metal, a delay in boiling due to the lack of gas in the water,
    or even electrical phenomena. In the technical literature of the time, there were
    so many theories on sudden explosions that they made a genre unto themselves.'
