  md: 'We cannot think about the modern destruction of the environment without thinking
    about the history of power. The chemical industrialisation that took place between
    1800 and 1830 was made possible by the political transformations that followed
    the French Revolution. These extraordinarily polluting factories and the new environmental
    regulations they necessitated were imposed by the government, in the name of national
    prosperity, against the interests of residents and for the benefit of a small
    clique of manufacturers close to those who held power. It was from the exception
    that the norm was born, at a time when traditional forms of regulation were suspended
    and the capital invested seemed to make it impossible to ‘turn back the clock’.


    After the initial coup of the 1810 decree, two different logics clashed: that
    of the administration, which authorised factories in accordance with a nationwide
    industrial programme; and that of the civil courts, which arbitrated on the value
    of the local damages this programme caused.


    On the one hand, by decreeing that a factory was deemed harmless, the authorities
    took decisions that were binding on the future. On the other, the civil courts
    regulated the consequences of administrative decisions a posteriori. Technology
    was caught up in these power relations; the forms that it closely depended on
    society’s ability to mobilise to ensure that the price of pollution was paid


    Of course, the fact that a financial form of pollution regulation was already
    established in the early nineteenth century calls into question the pertinence
    of the current dominant approach to environmental problems. Neoclassical economics
    formalised the idea that nature has a price, or that a price must be set for it
    in order to reach an economically optimal point of pollution — that is, a fair
    allocation of resources, answering the search for economic efficiency and the
    demands of environmental protection. Yet this idea corresponds to an old, indeed
    long-generalised, practice of compensation for environmental damage.


