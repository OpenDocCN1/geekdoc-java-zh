  md: '# Introduction: Little Modern Disinhibitions


    This book examines the historical roots of the contemporary environmental crisis.
    It investigates the past record of technological action – how its intervention
    was thought about, questioned, regulated and, most importantly, imposed as the
    only legitimate form of life. This study dissects the forms of power, the subtle
    twists of reality and the moral dispositions which, at the turn of the eighteenth
    and nineteenth centuries, started us down the road towards the abyss. It shows
    that the so-called ‘century of progress’ was never simply technophile. The history
    that this book tells is not that of humanity becoming conscious of the risks of
    technology; rather, it is the history of a certain kind of modernising unconsciousness,
    produced by political and scientific means.


    In April 1855, as crowds flocked to the Universal Exhibition in Paris to admire
    machines, locomotives and inventions, there appeared a little book with an enigmatic
    title: La Fin du monde par la science (The End of the World through Science).
    Written by a lawyer called Eugène Huzar, its originality in the fact that this
    was the first critique of progress based on a catastrophist vision of the future.¹
    Huzar was neither a romantic critic of the the ugliness of the industrial world,
    nor a reactionary denouncing the hedonism of his times. No, Huzar loved his century,
    its science, and its new techniques. But he posed the problem of what type of
    progress was desirable: ‘I am not waging war on science or progress, but I am
    the implacable enemy of an ignorant, unprescript science, of a progress that proceeds
    blindly without criterion or compass.’² According to Huzar, since'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'experimental science is a posteriori knowledge, it cannot foresee the long-term
    consequences of its ever more powerful products. For Huzar, this gap between technical
    capacities and humanity’s foresight would lead inexorably to the apocalypse.


    Huzar had a swarming, apocalyptic imagination: who could tell whether extracting
    tonne of coal risked shifting the Earth’s centre of gravity and tilting its axis?
    Who knew whether inter-oceanic canals would disrupt seas currents, causing devastating
    floods? Who could predict whether vaccination would bring even more serious illnesses
    than the ones it claimed to fight? Who was to say that the carbon dioxide produced
    by industry would not lead to a catastrophe?


    In the course of one or two hundred years, a world now crosscrossed by railways
    and steam ships covered with mills and factories would release billions of cubic
    meters of carbon dioxide and carbon monoxide. And since the forests were also
    destroyed, these hundreds of billions of cubic meters of carbon dioxide and carbon
    monoxide could not much disturb the world’s harmony.


    In their embrace of industrial development, humans believed that at most they
    were leaving scratches on the Earth – not realising that, according to the law
    of small causes and large effects, these scratches could kill entirely. To delay
    the final catastrophe, Huzar proposed the establishment of a ‘planetary edility’:
    a global scientific government for studying major construction projects, deforestation
    and all scientific experiments that could ‘disturb the world’s harmony’. As five
    million visitors shuffled through the Palais de Huzar’s aim was clearly to provoke.
    In this sense, he succeeded: all the major journals published reviews of his book,
    most of them glowing. Writers such as Alphonse de Lamartine, Charles Dickens,
    Gustave Flaubert and Jules Verne read Fin du monde par la science and cited it
    in their writings.


    If Huzar was not the despised Cassandra he claimed to be, if his work in fact
    widely read and debated, this was because it captured essential aspects of the
    techno-scientific revolution of the early nineteenth century. Huzar anchored his
    thinking in the controversies raised by the technologies of his time: deforestation
    and its climatic consequences, vaccination and the degeneration of the human species,
    the chemical industry and the transformation of the atmosphere, the railways and
    near-random disasters. Huzar’s originality lay in the fact that he brought these
    debates together into'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'one vast narrative, allowing him to present what his contemporaries called
    progress in a new and different way. While his theoretical approach was doubtless
    original, each of the arguments he used was based on debates that were already
    well known in the nineteenth century.


    If the arguments of La Fin du monde par la science seem surprising, this reflects
    our unfamiliarity with the techno-sciences of the past and the controversies which
    they gave. While we might imagine that proponents of a positivist modernity ra
    unanimously about new techniques while ignoring their long-term effects, Huzar’s
    work offers ample evidence that such a vision was already considered retrograde
    during the Industrial Revolution. The men who brought about this revolution and
    lived through it were well aware of the huge risks they were taking. They willfully
    decided to ignore them.


    The sociologists and philosophers who have reflected on environmental crisis and
    in the last four decades have run into a series of false oppositions between modernity
    and reflexive modernity, the society of progress and the ‘society of risk’ (Anthony
    Giddens, Ulrich Beck). Out of their concern to emphasise our own capacity to reflect
    on technological choices, they present a uniformly technophile past. As if we
    were today the first to detect the shadow of danger amid the dazzling lights of
    science.


    The existential stakes of the environmental crisis encouraged them to write a
    grandiose and rather idealist narrative of modern blindness and postmodern enlightenment.
    The ecological crisis is said to be the legacy of modernity itself: first, Greek
    science, which conceives of nature as subject to laws external to divine intentions;
    second, Christianity, which invented the singularity of mankind and the rest of
    creation; and finally, the scientific revolution, which replaced an organicist
    vision of nature with that of an inert mechanism that has to be dominated.⁴


    After three centuries of fren modernity, transforming the world and ignoring the
    environment, crisis has finally arrived. The moment of reckoning comes we: the
    ‘postmoderns’, who have opened our eyes to the consequences of modernity. In this
    narrative, the notion of risk occupies an important place as it captures the ‘reflexivity’
    or involution of modernity which is now confronted with its own creations. If
    we follow the German sociologist Ulrich Beck, risks have undergone a sudden metamorphosis;
    they are no longer natural, but products of modernisation; they are no'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'longer localised, but have evolved into global uncertainties; they are no longer
    side-effects of progress, but represent the foremost challenge facing our societies.
    So, it is said that modernity has become reflexive – in other words, it is now
    questioning its own dynamics.⁵


    The problem with this narrative is not that it is false, as that it is so specific.
    Its claim to reveal the deep sources of its ills makes it both intellectually
    seductive and politically offensive. Since it calls everything into question,
    it strikes at no actual acts. The anthropological categories on which it relies
    lack any political teeth – indeed, they conceal the forms of production, power
    and thought that, at the turn of the nineteenth century, led us down to the abyss.
    To build a serious political ecology, it is essential not to confuse the logic
    of the environmental crisis with that of modernity.


    As for the idea that we are only today seeing an ecological awakening, this, too,
    produces a political impasse. Because it erases the reflexivity that existed in
    past societies, it politicises the long history of environmental degradation.
    Rather, in its emphasis on our contemporary awareness, tends to naturalise ecological
    concern and overlook the social conflicts that lie behind it. By presenting a
    largely hypothetical reflexivity as a latter-day norm, the ‘risk society’ thesis
    has blurred the connections between past and present, and replaced historical
    analysis with abstract typologies. This book aims to combat such an abstraction
    of the past.


    As historians pay greater attention to these questions, they are finding that
    modernity never had a one-sided mechanistic vision of the world, and never shared
    a unanimous project of technical mastery. Rather, a variety of cosmologies emerged,
    in which mastering nature did not mean contempt for it, but an understanding of
    its laws and a willingness to submit to them in order to act in an efficient and
    sustainable way.


    For example, the notion of climate is essential for understanding modern societies’
    reflexivity. During the sixteenth century, the concept of climate gained a certain
    plasticity; while it remained largely determined by people’s respective geographical
    positions, natural philosophers became interested in its local variations, its
    transformations and the role of human action in its improvement or degradation.
    Since the climate retained its capacity to determine human and political constitutions
    the became the terrain on which the consequences of technical action on the environment
    were thought. The determinants of health and social organisation were no longer'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'simply a matter of one’s place on the planet, but of seemingly ordinary realities
    (the atmosphere, forests, urban forms, and so on) that it was possible to influence
    in one way or another.6


    Historians have also shown the importance of the environmental thinking which
    emerged from the discipline of chemistry, concerned with the exchange of matter
    between human society and nature. The nineteenth century was coloured by deep
    concerns over the metabolic rift between town and country: urbanisation – in other
    words the concentration of people and their excrement – preventing mineral substances
    essential to the fertility of the earth from being returned to the land. All the
    greatest thinkers, from Justus von Liebig to Karl Marx, as well as agronomists,
    hygienists and chemists, warned of the dangers of soil exhaustion and air pollution.
    In the third volume of Capital, Marx criticised the environmental consequences
    of capitalist agriculture’s great spaces, empty of human beings, which broke the
    matter circulation between society and nature. According to Marx, there could
    be no ‘getting away’ from nature: whatever the mode of production, society remained
    dependent on a historically deterministic regime; what was peculiar to the capitalist
    metabolism was its unsustainable character.7


    There is no reason to look down on these theories as a kind of protoenvironmentalism
    that would prefigure our current concern for the environment. After all, they
    determined modes of production that were far respectful of the environment than
    our own.


    For example, historians are also beginning to understand the fundamental importance
    of recycling in the past. Chiffonnage, that is, the collection of abandoned objects
    and materials, employed nearly 100,000 people in 1860s France. Bones, rags, metals
    – everything resold and reused. Until the end of the nineteenth century, urban
    excreta were systematically recycled for agricultural purposes.8 The city police
    of the Ancient Regime provide another example. Since their work was rooted in
    neo-Hippocratic medical notions that made ‘airs, waters, and places’ the determinants
    of health, they paid close attention to alterations in the urban environment.
    Similarly, the regulations on forests and fisheries (Jean-Baptiste Colbert’s statute
    on water and forests, the Marine Ordinance of 1681 remind us of the state’s involvement
    in conserving resources and the severe penalties (fines, imprisonment and corporal
    punishment) that were attached to these environmental rules. Finally, the existence
    of ‘commons without tragedy’ –'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'the significant fact that communities managed to preserve natural resources
    (fisheries, forests, pastures) for centuries – bears witness to the ecological
    intelligence of past societies.9


    So, when it comes to writing history, it is misleading to tell a story of the
    Industrial Revolution in which societies unconsciously altered their environments
    and ways of life, and only later understood the dangers this brought and the mistakes
    they had made. Past societies did not cause environmental havoc inadvertently,
    or without contemplating the consequences of their decisions. Confidence in the
    future could not be taken for granted, and at each strategic point in modernity,
    at each point of conflict, ignorance and/or inhibiting knowledge had to be produced
    in a calculated way.


    Considered in terms of their effects, the disinhibitions, whose history this book
    follows, generally include all sorts of devices that made possible, acceptable
    and ever desirable the technical transformation of bodies, environments or modes
    of production. For any innovation of real significance to establish itself, it
    has to overcome moral retence, social opposition, vested interests, suspicions,
    and criticisms of its material and environmental consequences. The confidence
    that presides over the technical transformation of world requires requires that
    blur its meaning and cushion its traumatic impact. After disasters, there is a
    need for discourses and moral dispositions that will neutralise their effects,
    playing down their ethical dimensions in order to ensure the continuation of the
    technological project.


    The word disinhibition encapsulates the two distinct phases of technological action:
    reflexivity and disregard, contemplating danger and normalising it. Modernity
    was a process of reflexive disinhibition: we shall see how the regulations, consultations,
    safety standards, authorisation procedures and health surveys that purported to
    understand and contain risk generally had the effect of legitimising technological
    feats.


    Finally, the insistence on the smallness and ad hoc nature of these disinhibitions
    is intended to point out that modernity is not the majestic and spiritual movement
    that philosophers claim it is. Rather, I would like to think of it as a mass of
    coups de force, imposed situations and normalised exceptions. Modernity was an
    endeavour that had to be brought to fruition. Those who made this happen produced
    knowledge and ignorance, legal norms and discourses which aimed to establish new'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'sensibilities and new ways of conceiving our lives, our bodies and our relations
    with environments and objects.


    This book also takes a fresh look at the so-called Industrial Revolution. Historians
    concerned with the causes of European (or rather, British) exceptionalism have
    related it to various historical events. It is connected to a transformation in
    industry or to a slow transformation of agriculture and the existence of efficient
    markets, to the protection of private and intellectual property, to a growth in
    demand and an intensification of work, to the exploitation of new sources of energy
    or to the ecological assistance drawn from the New World.¹ Through these preoccupations,
    the technological dimension of the transformations that took place between 1750
    and 1850 has – for the most part appropriately left the historiographical centre
    stage. This book turns the focus back to innovation – not to make it the cause,
    but to pose it as a problem. How was the acceptance of technology achieved? How
    were technophilic subjects and new understandings of reality created, such as
    could make the world compatible with the needs of the Industrial Revolution?


    When the history of innovation causes naturalise its object of study, it can also
    be politically liberating. Instead of reducing opposition to a simple resistance,
    imagined to be self-interested or irrational and unable to propose any alternative,
    it can, instead, show the often indeisive and sometimes contingent nature of past
    technological choices. The first approach I took in this book was to reconsider
    the technologies emblematic of the medical and industrial revolutions – inoculation
    and vaccination against smallpox, the chemical industry and gas lighting, steam
    and rail technology – as cases, in the casistic and moral sense of the word. I
    wanted to show that these technologies were, in their own time, objects of dispute,
    misgivings and perplexity, as much as contemporary neuroscience can be. To give
    a sense of the original indeterminacy of these controversies, I have taken seriously
    seriously each of the players therein – all of them, those who may seem most obviously
    mistaken. This approach, which has the merit of giving a voice back to the losers
    of history, is also a heuristic choice. For making sense of out-of-the-ordinary
    arguments also forces us to reconstruct frameworks of intelligibility that their
    defeat rendered invisible. In doing, it becomes clear that the opponents of these
    projects were not against'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'innovation, but rather for their environment, their safety, their jobs, and
    for the preservation of forms of life they considered valuable.


    When we get into the complexities of these disputes, the notions of innovation
    and resistance become rather blurred, and our concept of a single line of technological
    time goes haywire.¹¹ For example, in 1819, in the early days of gas lighting,
    the chemist Nicolas Clément-Desmos explained that the axis of time punctuated
    by innovations was not an axis of their steadily rising value. Gas lighting, with
    its profusion of underground pipes, was merely a costly imitation of the marvellous
    simplicity of the oil lamp, which also had had the merit of being portable, of
    using renewable resources and preserving individual autonomy. Clément-Desmos turned
    on its head the very notion of innovation: ‘Let’s suppose that gas lighting was
    the first [technology], that it was in everywhere, and that some man of genius
    presented us with an Argand lamp or a simple lit candle. What admiration we would
    have for such an astonishing simplification.¹² In fact, rather than discussing
    innovation and resistance, we would better speak of the competition between different
    technological projects: the choice for improved oil lamps, rather than gas lighting;
    systems of animal traction, than the steam engine; quarantines and hygiene measures
    rather than inoculation and vaccination; plant-based materials rather than chemicals;
    and so on.


    Despite everything, the techniques which I had studied did eventually come to
    the fore (albeit, on a mass scale, only towards the end of the nineteenth century).
    The advantage of going off track and focusing on the indeterminacy of these disputes
    is, by relativising the intrinsic superiority of the innovations in question,
    we are able to consider power and the means by which it operates. This book explains
    in detail the forces that led to the victory of these technical systems, despite
    their dangers, despite the opposition they faced, and despite awareness of their
    dangers. I have sought to understand why the technologies that have produced our
    modern and contemporary environmental crisis came into being – for whom and against
    whom, based on what knowledge and despite


    This book’s second goal is to re-examine the question of risk in terms of paths
    of technological development. The emergence of the precautionary principle at
    the end of the last century and the hope for a democratic governance of techno-sciences
    have led sociologists to pose the problem of'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'risk within a decisional framework. In this view, the crucial question would
    be of the choice of technology, the assessment of risks and the (democratic and
    transparent) procedures that need to be established to guide this choice and these
    evaluations. The problem is that, historically, technology has never been the
    subject of a shared choice. Some actors have actively brought it into being, and
    then it had to be regulated. Contrary to the sociological dream of a controlled
    techncience, the history of technology is one of innovations being forced through,
    and the subsequent efforts to normalise these faits accomplis. By taking a long-term
    perspective, the question of risk can be grasped in a completely different way.
    The relevant question is no longer so much about choice and the right processes
    for making the correct choice, but rather, the path of technological development
    and the various ways of influencing it. I propose to take advantage of history''s
    ability to consider forms of technology in a long-term perspective. This allows
    me to write a comparative history of the different ways in which risk has been
    regulated by technological standards, by recourse to the courts, by administrative
    oversight, by insurance) and their effects on knowledge and the paths of technological
    development.


    The first chapter looks at the famous controversy around smallpox inoculation
    to describe the historical context in which risk emerged.¹⁴ Risk, understood here
    as the application of probabilities to human life, arose in the 1720s to persuade
    individuals to get inoculated. In particular, I explain the theological and political
    frameworks that justified this extension of the geometry of chance to life itself.
    But the question of inoculation remained inextricably moral, religious, political
    and corporal, and statistical arguments failed to produce a quorum of brave subjects
    prepared to risk their lives in order to preserve them.


    In contrast, the case of smallpox vaccination, the success of the next chapter,
    provides an opportunity to study the techniques of proof that ensured the success
    of the imperial policy of the 1800s. Napoleon''s administration, which saw the
    public as incapable of devising risk-minimisation strategies, set out to demonstrate
    that the vaccine was perfectly safe. Human experimentation, the clinic, the graphic
    definition of'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'disease and the statistical management of medical information made it possible
    to impose the improbable definition of a non-virulent virus, a perfectly benign
    virus that would keep smallpox at bay forever. the government intervened in a
    reasoned way in the medical field so as to disseminate statements that it deemed
    strategically important for the national good. In this case, modern disinhibition
    was indeed a form of manipulation and imposition of perceptions, seeking to capture,
    mobilise and align behaviour as the new techniques required. Here science was
    primarily a form of disciplinary enterprise, and not so much a method for exploring
    reality.


    The following chapters are also about bodies, but this time, in connection to
    the environment. Contrary to common assumptions, the environment is not at all
    a recent preoccupation. It has a long genealogy, part of which I characterise
    through the notion of circumfusa (‘surrounding things’ in Latin). This category
    of eighteenth-century hygiene had extremely broad reach: it included all natural
    and artificial entities (waters, climate, artisanal odours and smokes . .) that
    determined the health and even the shape of bodies. The paradox, then, is that
    industrialisation and the alteration of surroundings that brought with its tail
    of pollution, took place not in an intellectual void, but despite the dominance
    of medical theories that considered the environment as the decisive force shaping
    human’s health and constitution.


    In France, the 1800s were once again crucial. We will see how chemical capitalism
    presided over a radical transformation in environmental regulation. Instead of
    urban police of the Ancien Regime, who had been concerned with health protection
    and could readily read or punish artisans, the Napoleonic administration set up
    a liberal framework for regulating conflict, based on simple financial compensation
    for environmental damage. At the same time environments were being commodified,
    hygienism was reshaping medical theories: it was now social factors that determined
    the health of populations, rather than environmental ones. So, in increasing society’s
    wealth, industrialisation was meant ultimately to produce a healthier population.


    The last two chapters are devoted to industrial risk and its management. Contrary
    to sociologists’ assumptions, the risks of the industrial age were immediately
    major ones. It has never been possible to externalise risk and delegate its management
    to insurance companies. Risk has always'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'been a political question of spatial and social distribution. Through a case
    study of the beginnings of gas lighting in Paris, I show that the safety norm
    – that is, the new project to make the world of production safety by defining
    the right technological forms – appeared in order to legalise the risks of gas,
    despite the complaints of city dwellers. Such norms were also essential in order
    to maintain the principle of individual responsibility in a technological society:
    they were supposed to bring about perfect technologies whose failures would be
    entirely attributable to human error.


    We let conclude this introduction with an anecdote that shows the importance of
    historical narrative in our current understanding of innovation. Everyone knows,
    or thinks they know, the famous story of how our ancestors were afraid of trains.
    This fable is always cited in order to discredit irrational fears about science.
    In 2004, at the height of the GMO controversy in France, the CEO of a biotech
    start-up explained in the pages of *Le Monde* ‘the countless articles written
    to terrify public opinion could call a catalogue of howlers, of the same level
    as was written at the time the railways first appeared’¹⁵ The previous year, the
    philosopher of science Dominique Lecunc denounced ‘biocatastrophes’, by referring
    to the irrational fears spurred by the first railways: ‘In 1835, the members of
    the Lyon academy medicine solemnly warned: we risk damage to the retina and breathing
    problems at high speed, and won''t pregnant women being tossed under suffer miscarriages?¹⁶
    History makes it possible to ridicule anxieties by a kind of technological induction:
    just as past fears about well-established technologies seem absurd to today, our
    present fears about innovation will seem ridiculous to our descendants. The importance
    that this argument has assumed is well dwelling on.


    In fact, it is a myth. In 1863, Louis Figier, the great nineteenth-century science
    populariser, reviewed a paper by the doctor Pietra Santa on the health consequences
    of the railways.¹⁷ Figier took the opportunity to write a little compendium of
    fake nonsense. He mentioned, without giving any references, accusations which
    had supposedly been levelled by learned doctors: the railways were said to strain
    the eyesight, cause miscarriages and nervous disorders. It is true that doctors
    in the 1850s questioned the effects of the railways on health. Obstetrics textbooks
    contain brief references to the dangers of long journeys (by horse carriage or
    train) and excessive vibrations for pregnant women nearing term.¹⁸ The'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'supposed influence of the railway on eyesight is more mysterious. Pietra Santa
    advised readers to rest their eyesight regularly, but made no specific claims
    regarding the railways. Whatever Figuer’s sources, there is, in any case, no trace
    of the report which Dominique Lecourt mentions, published by the Lyon academy
    of medicine – an institution which, incidentally, never existed.


    The construction of this myth continued in Germany. In 1889, Heinrich von Troitschke
