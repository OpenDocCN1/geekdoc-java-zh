    # The Mechanics of Fault


    Technical safety standards responded to two distinct political requirements. One,
    as we saw with gas lighting, was to protect industrial capital by circumscribing
    risk and setting it on a stable legal footing. The second concern, which will
    be the focus of this chapter, was to integrate the new products of the Industrial
    Revolution into a liberal legal anthropology based on the distinction between
    the responsible individual and the passive object.


    The French Civil Code of 1804 resulted from a project for less government: the
    legislator sought to constitute society as a set of individuals whose behaviour
    would be harmonised through their judicial interactions. In this context, accidents
    were conceived as private matters involving a responsible party and a victim.
    These were wrongs subject to the law and had to be combated as such through the
    obligation to provide compensation. Following a long legal tradition, the quasi-tort
    liability defined by Article 1382 of the Civil Code made compensation conditional
    on the existence of fault. But, for this self-regulating system to work, it was
    still necessary to be able to identify fault, that is, toのである human causes to
    each accident. This required being able to distinguish clearly between two ontological
    orders: that of individuals who could be apportioned blame, and of passive objects.¹


