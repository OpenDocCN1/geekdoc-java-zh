  md: 'Many historians have analysed the transformations that took place through the
    ways that societies managed accidents at the end of the nineteenth century. Legislation
    on workplace accidents (1884 in Germany, 1898 in France) introduced a system of
    no-fault liability: workers no longer had to prove to the courts that their employer
    was at fault before they could secure compensation. As François Ewald explained,
    accidents were removed from the logic of the justice system and subjected to the
    different logic of occupational risk; they were no longer the result of human
    fault, the inevitable downside of the industrial production which all society
    benefited. If these were the inherent costs of progress, it was only right that
    society as a whole foot the bill, through insurance mechanisms. In this reading,
    making the law ‘social’ consisted in its adaptation to the development of the
    world of production and its mechanisation.


    The problem with this account is that it amounts to presenting the socialisation
    of professional risk (in France, meaning the 1898 law) as if it created a regulation
    laissez-faire at the expense of the worker. In doing so, it overlooks the vast
    legal and technical efforts that had gone into preserving the principle of liability
    throughout the nineteenth century. It is to note, in this regard, that liability
    for fault was erected as a fundamental principle of civil law at precisely the
    moment when the technologies of the Industrial Revolution made its application
    a source of injustice. What requires historical explanation then, is not only
    the recognition of occupational risk that came at the end of the nineteenth century
    but also the legal application of the principle of liability that preceded this
    point.


    This is especially true given that France’s Civil Code tolerated a degree of flexibility.
    While Articles 1382 and 1383 emphasised the link between fault and reparation,
    the ones that followed acknowledged instances of liability in which fault was
    wholly presumed. Hence, an animal’s owner was liable for any damage caused. Accidents
    in the army, in the civilian navy and in public works led to the payment of a
    penalty without any need to prove fault. Finally, the Civil Code introduced liability
    for damage caused by ‘things in one’s custody’. The courts could have equated
    machines with the horses they replaced or invoked the ‘custody of things’ to make
    the owners pay. This was, indeed, what they did, but not until the end of the
