  md: '# Afterword: History as a Smoke Detector


    Walter Benjamin spoke of history as a ‘fire alarm’: the historical premonition
    of threats should help to ‘cut the lighted fuse before the spark reaches the dynamite.
    What is the role of history in the face of the Anthropocene? What use it when
    there is neither fuse nor dynamite but a generalised conflagration? When prescience
    becomes useless and all that’s missing is the courage to act? Happy Apocalypse
    offers no fire hose, no philosophy, no utopia: all it offers is a simple smoke
    detector. This book is helpful in understanding how contemporary discourse and
    measures that claim to extinguish the blaze (risk, standards, administrative authorisations,
    the ‘polluter pays’ principle, recycling, transition, and so on) fill the air
    with smoke, rendering it opaque and concealing its source.


    In Paris in 2002, when I began the research that led to this book, intellectual
    debate still stood in the rubble of the Berlin Wall. Despite 11 September, the
    mood was one of optimism: ‘sustainable development’ was on everyone’s lips, the
    ‘precautionary principle’ was fiercely debated and people were enthusiastic about
    the UN climate summits. The prevailing feeling was one of environmental awakening.
    Hence the success of the these capturing this zeitgeist: Ulrich Beck announcing
    the entry into a ‘reflexive modernity’, or Bruno Latour – whose work in the sociology
    of science was nevertheless important for me–predicting the end of the modern
    parenthesis().


    This slightly grandiloquent discourse simply renamed the common idea of ‘environmental
    awareness’. It endorsed the hypothesis that we had'
