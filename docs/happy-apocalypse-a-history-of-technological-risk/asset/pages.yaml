  md: '# Conclusion


    Liberal capitalism is marked by a curious contradiction. On the one hand, it proclaims
    that it is impossible to change society. On the other, it happily goes on with
    a radical transformation of nature. It combines a supposedly realistic acceptance
    of human goals and social organisation such as they are, with a deeply utopian
    project of mastering and transforming the world. The cosmos of consists of individuals
    whose drive to pursue wealth is deemed unchanging, and who are situated within
    a world of infinite technological adaptation. When George Bush Sr declared at
