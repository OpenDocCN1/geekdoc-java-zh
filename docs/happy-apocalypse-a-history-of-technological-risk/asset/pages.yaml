    Lighting Up France after Waterloo


    The idea of a technical safety standard purports to make the world safe by defining
    technical forms that must be followed. Yet such a standard presupposes the ability
    to discipline and control the varied world of objects. If, today, such a practice
    is commonplace, it also needed reprimands. More specifically, it was invented
    at the intersection of the French administrative and academic worlds in the 1820s,
    in response to the breakthroughs which British technologies had made during during
    the Industrial Revolution. In 1823, the French government determined that steam
    engines and gasolders (which had not yet caused any accidents in France) would
    have to obey a special form defined by the Académie des sciences. This was a new
    and radical political act: the government believed that science could make the
    world of production safe by defining radical technical forms in advance.


    In the eighteenth century, safety standards, as stipulated by the police or guilds,
    had been based on the experience of communities of trades. They applied at a local
    level, since they were linked to the institutions and customs of particular towns;
    and they were developed through case law, in response to accidents or reprimands
    for shoddy workmanship. Specifying what should *not* be done, regulations were
    based on the observation of malpractice rather than on any theory of how things
    ought to be. The 1820s brought a considerable change in this regard: risk, which
    had previously'
