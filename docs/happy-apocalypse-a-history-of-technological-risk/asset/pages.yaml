  md: 'governing all sorts of behaviour? Smallpox inoculation, a medical technique
    that appeared in Europe in the eighteenth century, provided the decisive opportunity
    to extend probabilistic rationality to the government of life.


    Inoculation is a minimalist medical technique: some pus of variola, an incision,
    a few days'' fever, and the hope of being finally exempt from a terrible disease.
    In exchange for a few pustoles, one could escape smallpox—an illness that often
    led to death, or left one in disgrace, sometimes blind, or deaf, or debilitated,
    or all of these things at once. Low-tech, inoculation was, nevertheless, one of
    the most important innovations of its age: not only because it played a certain
    role in the demographic revolution, but above all, because it heralded a new way
    of living with viruses. Rather than resorting to an embargo strategy (quarantine,
    isolation, disinfection), humans made a deal with their nemesis: in exchange for
    immunity, they gave sanctuary to a few viruses that were kind enough not to harm
    their hosts too much.


    Inoculation played a key role in the Enlightenment project of an autonomous individual
    guided by reason: it was the emblematic technique of a moral philosophy that valued
    rational self-government.² Those who had inoculated, or who hesitated to do so,
    had to deal with the same doubts: was it legitimate to run the risk of death deliberately,
