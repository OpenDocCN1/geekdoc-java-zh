- img_proc: true
  md: 'because they were close to built-up areas. They certainly damaged crops, but
    they also relieved pressure on the forests of the Baltic and the kelp fields of
    Normandy and Spain, and therefore on wild animals and fish. Happy Apocalypse is
    heavily influenced by the history of science and the Foucauldian analysis of power.
    It is not a truly material history of industrialisation, which largely remains
    to be written.


    Finally, there is another way of reading this book: forget the historiography,
    the theses and counter-theses, and simply get to know the people who populate
    its pages. The Norman fishermen in the 1770s taught the Académiciens des sciences
    in Paris what kel was and how young fish lived in it. The alkali waters of Widnes
    and St Helens licked the corneas of their acid-sprayed comrades. Mothers and fathers
    filled with fear – a legitimate fear – at the idea of inoculating or vaccinating
    their children. Or orphaned children, fatherless and motherless, subjected to
    the sordid experiments of the first vaccinators or carted from village to serve
    as a source of vaccine lymph. There are also the few doubting modernisers: the
    chemist Clément-Désarmes, who (rightly) praised the candle against gas lighting,
    and Dr Henri-Marie Husson, the man who, more than anyone else, worked to spread
    vaccination in France and who, in 1803, in his private correspondence, explained
    that this medical innovation was doomed to failure. When it comes to technology,
    nothing is ever certain, and this is perhaps the only optimistic conclusion to
    be drawn from this book. Benjamin also said that history enabled us ‘to seize
    on a memory as it flashes up at a moment of danger’. I hope that Happy Apocalypse
    illuminates some useful memories in these dangerous times.


    Paris, October 2019'
