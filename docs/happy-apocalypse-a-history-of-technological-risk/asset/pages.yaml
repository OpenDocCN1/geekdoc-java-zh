  md: 'of new knowledge, reassurance devices or social engineering (for example, the
    confinement of risks to certain populations). It was not so much the silence surrounding
    technological accidents as safety norms and later occupational insurance. And
    not so much ignorance of the dangers of the chemical industry as the employment
    of a lumpenproletariat in these plants and the belief that increased wealth would
    ultimately improve health. In relation to climate change, it is no longer much
    climate skepticism as the revival of processes of disattribution: carbon credits,
    sustainable development, green finance, energy transition, and so on.


    A third, more pointed debate concerned the true nature of the regulation of industrial
    pollution in nineteenth-century France. One of the original aspects of my research
    was the use of civil court archives to address the issue of industrial pollution.
    Compared with existing work on the subject (André Guillermo, Geneviève Massard-Guilbaud
    and the work of Thomas Le Roux then in progress), which focused on the actions
    of the administration, this archival shift led me to emphasise the liberal nature
    of the new post-1810 regulations.9 Liberal not in the general sense that it was
    in favour of industrialists (the ultra-raists in power in the 1820s were not at
    all favourable to a clique of entrepreneurs that had emerged in the previous decade),
    but in the precise sense that these regulations gave a fundamental role to the
    courts and to compensation for damages. This thesis, which was based on a precise
    study of the case of industrial chemistry in the early nineteenth century, deserves
    to be examined in greater depth in other fields. It is an important question,
    touching the technical and social effects of the ‘polluter pays’ principle, its
    effects on the improvement — or otherwise of industrial processes and on the construction
    of environmental segregation.


    With insight, what would have been worth debating was my basic premise, never
    made explicit but always present in the background, that the first wave of industrialisation
    worsened environmental destruction, that it was basically the first step towards
    the contemporary abyss. Yet the players at the time perhaps sincerely believed
    that coal would help save the forests and therefore the climate, that it was in
    short an ‘ecological’ solution to the impasses of a wood-based economy. Or if
    we take the case of soda ash, the Leblanc manufacturing process based on sea salt
    and sulphuric acid replaced truly staggering quantities of vegetable ash. Alkali
    plants did indeed produce massive pollution, but it was'
