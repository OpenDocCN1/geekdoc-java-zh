    Beck''s position in a review by proposing the idea of a gradient of reflexivity.^3
    In Facing Gaia, Bruno Latour accepted my objection and also pointed out his interest
    in the notion of disinhibition, while making James Lovelock a new Galileo and
    the ‘irruption of the Earth into politics’ a new reflexive epiphany.^4 The success
    of the notion of the Anthropocene has also revived the illusion of a cosmological
    revolution. My book Chaos in the Heavens (with Fabien Locher) will perhaps dispel
    this misunderstanding.


    Among historians, the idea of a technological modernity achieved with eyes wide
    open has been taken up by several colleagues with significant modifications. In
    their work, reflexivity is often thought of as the prerogative of specific groups,
    precursors, romantics, ‘technocrats.’^5 For example, Serge Audier, in his book
    La Société écologique et ses ennemis, marries red and (in my opinion forcibly)
    by making ‘environmental consciousness’ an attribute of nineteenth-century social
    thinkers marginalised by liberals and the productivist left.^6 In general, recent
    environmental history (the example of Charles-François Mathis, Rémi Luglia, Caroline
    Ford and Paul Warde) prefers to consider the question of reflexivity from the
    angle of a general emergence linked to industrialisation and the realisation of
    its damage, the advance of science, the formation of nation-states managing their
    resources, or the Romantic movement.^7 In my book, however, reflexivity is a ‘default
    setting’ for societies faced with technological change. The issue is not so much
    one of ‘awareness’ – which produces teleological narratives or intellectual genealog
    – but rather the opposite: the production of a form of modernising unconsciousness.


    My project was therefore closer to ‘agnology’, a neologism coined by the historian
    Robert Proctor to designate the production of ignorance. In my work, these interesting
    and rich as they are – I’m thinking of Robert Proctor’s formidable Golden Holocaust,
    which details the strategies of the tobacco industry – give ignorance too important
    a role and, conversely, are too confident in the power of science and reason.^8
    In the nineteenth century, what mattered for industrialisation was not so much
    the production of ignorance or false controversies as the manufacture'
