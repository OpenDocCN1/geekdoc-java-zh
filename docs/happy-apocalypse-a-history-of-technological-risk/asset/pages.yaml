  md: '# 1 Inoculated with Risk


    Risk – the application of the probabilities to matters of life, death and health
    – is the most generally used tool to guide individual behaviour. Confronted, for
    example, with the question of whether or not to be vaccinated, we have to rely
    on simple fractions and subsume our lives and our bodies into statistics. Risk
    calculations tell us to behave like rational individuals seeking to maximise our
    life expectancy.


    For a long time, the use of risk remained confined to the world of commerce and
    insurance. In the mid-twelfth century, Pisan and Genoese merchants borrowed the
    Arabic word rizq (the share that God assigns to each man) to refer, in their contracts,
    to the losses and profits associated with unpredictable events. Risk, along with
    account-keeping and maritime insurance, contributed to the growth of merchant
    capitalism. It also contributed to its moral legitimisation: commercial profit,
    that is, the merchant’s gain from reselling an unchanged good, was justified in
    theological terms through reference to the ‘price of risk’. In the seventeenth
    century, with the development of statistics (or political arithmetic) and insurance
    (for fire and life), risk was a tool to compensate financially for the world’s
    dangers.


