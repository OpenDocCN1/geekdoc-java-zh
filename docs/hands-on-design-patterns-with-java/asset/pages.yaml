  md: '# Understanding the broker pattern


    The broker architectural pattern is used to architect distributed systems. These
    systems make use of a middleman component to coordinate and communicate between
    components. This decoupling of components removes dependencies and can result
    in greater system-wide efficiencies.


    The middleman component''s mission means that it is essential for it to be able
    to receive requests and broker the proper service or request. As illustrated by
    the following diagram, the middleman brokers requests from both the Server and
    the Client:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_196_0.png)


    The broker architectural pattern is similar to the facade design pattern covered
    in Chapter 5, Structural Design Patterns. The facade design pattern established
    an interface to serve as a medium between the system and its subsystems.


    There is an option in the broker architectural pattern for the middleman to permit
    direct communication between the Client and the Server. As shown in the following
    diagram, the middleman still manages the communication, but the two components
    (Client and Server) communicate directly:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_196_1.png)'
