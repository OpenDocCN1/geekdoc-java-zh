    # Understanding the service-oriented pattern


    The service-oriented architectural pattern, also referred to as **Service-Oriented
    Architecture (SOA)**, establishes interoperable services through methodologies
    and rules. Web services are typically designed with an SOA pattern. These interoperable
    services consist of organized, deployable services with the following characteristics:


    +   - Runs services independently of other services

    - Handles a specific computational task

    - Has access to other services


    The SOA pattern can be used to design a group of organized services to provide
    a cohesive set of services. There are several benefits to adopting this pattern,
    some of which are listed here:


    +   - Since the architecture comprises several services, each service can be modified
    in isolation of the others

    - Increased system flexibility and adaptability

    - The system is easier to maintain because of its modularity

    - Individual services can be used in multiple systems'
