  md: '# Use case diagrams


    Use case diagrams document the interactions between your users and your system.
    This is typically done with text, but UML does support use cases.


    Let''s start by looking at use cases in text, and then review a UML diagram representing
    the same use cases. We will use an example of a grade book for an online education
    institution.


    The student logs on to the system and selects their class. The student then selects
    the assignment and uploads their document. Next, the student enters text and selects
    the submit button.


    The instructor logs on to the system and selects their class. The instructor then
    selects the assignment, and the student. They grade the assignment, enter a grade,
    and select the submit button.


    These use cases are pretty basic and easy to understand in text. There are only
    a few constructs for the use case diagram in UML:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_28_0.png)'
