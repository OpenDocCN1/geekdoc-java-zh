    executeKnowledgeSource() |


    ![](img/bcdf8abab5e2de6d67770104d49e5070_195_0.png)


    The **Intr Identification, Navigation, and Ballistics** components in the UML
    class diagram are the knowledge sources in the warehouse security bot implementation.


    This section provided two implementation examples of the blackboard architectural
    pattern.'
