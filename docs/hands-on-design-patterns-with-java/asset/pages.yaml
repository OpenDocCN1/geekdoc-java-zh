    # Using the interpreter pattern


    The interpreter design pattern is used to establish a grammatical representation
    and an interpreter that interprets language. That might sound a bit complex and,
    although the concept is simple, their implementation often is not. This design
    pattern can be used for the interpretation of interpreted programming languages
    or languages that are compiled in byte code or other intermediate languages such
    as the Microsoft Intermediate Language (MSIL).


    We will look at an example use case, the UML class diagram, and the source code
    necessary to implement the interpreter design pattern for this scenario.


    # Use case


    We will demonstrate the interpreter design pattern by using a simple number-to-character
    scenario. Our Code Interpreter program will accept numeric input and translate
    it to a series of characters. For example, an input of 319 might return a value
    of YES. We will use an expression interface and three classes to demonstrate this
    relatively simple case.


