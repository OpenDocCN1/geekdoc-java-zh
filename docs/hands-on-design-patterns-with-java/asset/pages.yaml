    # Exploring the command design pattern


    The purpose of the command design pattern is to send requests as objects. This
    pattern, also referred to as the transaction or action design pattern, permits
    the sending of requests without knowing any details about the receiver or even
    about what is being requested. This might sound counter-intuitive, and requires
    that it be looked at from a systems perspective and not a human-managed operation.
    With the command pattern, we encapsulate requests as objects and transmit them
    to a receiver.


    We will look at an example use case, the UML class diagram, and the source code
    necessary to implement the command design pattern for this scenario.


    # Use case


    A common use of the command pattern is with user interfaces and related frameworks.
    This can be extended to both hardware and software interfaces. To demonstrate
    the command pattern, we will model a hardware control box that contains an on/off
    toggle, a slider that has a range between 0 and 100, and a digital display for
    the slider value. Key to our example is that the hardware control box is manufactured
    without knowing what specifically it will be used for. The following diagram depicts
    this:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_75_0.png)'
