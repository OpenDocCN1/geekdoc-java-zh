  md: '# Encapsulation


    Encapsulation refers to the hidden nature of an object''s data components. We
    know that the data is there, but cannot access it directly because external entities
    cannot directly interact with that data:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_39_0.png)


    The illustration above demonstrates how a Bicycle class protects its data from
    external methods and functions. The object''s own methods are the only mechanism
    that can directly view or alter its data.


    # Polymorphism


    Polymorphism is not a word that non-OOP programmers are likely familiar with.
    The term polymorphism is generally defined as appearing in multiple forms. In
    OOP, polymorphism states that different types of objects can be accessed via a
    common interface. This can be achieved by writing overloaded constructors and
    methods and is covered later in this chapter. Polymorphism can also be achieved
    by having subclasses override superclass methods.


    Let''s take a simple look at this using Java code:


    +   1. First, we create a Vehicle class that, by default, extends the Object class.

    2. Next, we create a TwoWheled class that extends the Vehicle class.

    3. Then, we create a Bicycle class that extends the TwoWheled class.'
