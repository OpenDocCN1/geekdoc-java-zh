  md: '# Soaring with the flyweight design pattern


    The flyweight design patterns offer great efficiency and improved processing when
    dealing with a large number of similar objects. The pattern uses sharing of identical
    object components. Consider programming a video game that has thousands of tile
    objects that are used to build architectural structures. The tile objects will
    likely only have a color attribute. So repeating the tile = new Tiles("beige")
    line of code 1000 times is not efficient, especially since all of the objects
    will contain the same attribute value. The flyweight design pattern addresses
    this issue by permitting the reference of numerous same-type objects that have
    the same state.


    # Use case


    We will create a Mattress Manufacturing Factory Demo application to implement
    the flyweight design pattern. We will create an interface, a Mattress class, a
    MattressFactory class, and a Driver class. Our application will facilitate the
    ability to create mattresses of size crib, twin, and If a Mattress already exists,
    then new objects will not be created; instead, MattressFactory will provide the
    size and then the mattress firmness be determined.


