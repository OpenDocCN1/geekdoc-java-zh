  md: '# Building with the builder design pattern


    The builder design pattern is used to create a separation between object instantiation
    and representation. The purpose is to permit different representations with the
    same instantiation process.


    In this context, representation refers to the description of an object.


    ![](img/bcdf8abab5e2de6d67770104d49e5070_127_0.png)


    This design pattern is typically only used for complex objects. Using the builder
    design pattern, complex objects are created in separate steps. This allows us
    to build different objects based on the building steps taken.


    We will look at an example use case, the UML class diagram, and the source code
    that''s necessary to implement the builder design pattern for this scenario.


    # Use case


    To demonstrate the builder design pattern, we will implement a coffee roaster
    manufacturing application. This app will facilitate the creation of two different
    coffee roaster models: personal and commercial. There are a total of eight components;
    some components are used for both roaster models, and the components indicated
    as are different for each roaster model. Additionally, the platform component
    is only required for the commercial roaster model. The following table provides
    an overview of these components:


    | Component | Personal Roaster | Commercial Roaster |

    | Cooling tray | Model-Specific | Model-Specific |

    | Exhaust system | Model-Specific | Model-Specific |

    | Gas burner | Model-Specific | Model-Specific |

    | Inner drum | Model-Specific | Model-Specific |

    | Main body | Model-Specific | Model-Specific |

    | Motor | Standard | Standard |

    | Platform | Not required | Standard |

    | Thermocouples | Standard | Standard |


    As you can see from the preceding table, five of the components are unique to
    the roaster model and three are standard. One of the components, the platform,
    is not required for a personal roaster build.'
