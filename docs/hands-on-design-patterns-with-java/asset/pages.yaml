  md: '# Combining objects with the composite design pattern


    The composite design pattern allows us to create an object tree structure. We
    can then treat both objects and the tree structures in the same manner, as individual
    objects. Without this design pattern, we can run into problems when we create
    structures from multiple objects. The problems stem from the need to treat primitive
    objects and the composite differently. The composite design pattern was created
    to overcome the aforementioned problem.


    In order to implement the composite design pattern, we first create an abstract
    class to represent the primitive and tree structures.


    # Use case


    To implement the composite design pattern, we will create a kitchen staff management
    system that includes a KitchenStaff interface and a Chef class. We will use the
    following chef hierarchy in our implementation—Executive Chef, Head Chef, Sous
    Chef, Line Chef, and Commis Chef. Using the composite design pattern, we will
    be able to treat the chef tree structure as if it were a single object.


    # UML class diagram


    The following UML class diagram illustrates the relationships between the three
    classes in our implementation of the composite design pattern. The KitchenStaff
    interface is implemented by the Chef class.'
