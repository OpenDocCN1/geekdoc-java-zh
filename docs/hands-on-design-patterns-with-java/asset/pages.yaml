    # Summary


    In this chapter, Creational Design Patterns, we explored the creational design
    pattern category and its individual design patterns: abstract factory, builder,
    factory method, prototype, simple factory, and singleton. We learned that creational
    design patterns are used to manage object instantiation. The purposes of creational
    design patterns are to separate object creation from the system, support reliance
    on object creation via inheritance, encapsulate information regarding which classes
    are used by a system, and to protect object creation details.


    In the next chapter, Structural Design Patterns, we will explore the structural
    design pattern category and its individual design patterns of adapter, bridge,
    composite, facade, flyweight, and proxy.


