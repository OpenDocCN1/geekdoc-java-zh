  md: '# Introduction to structural design patterns


    Structural design patterns focus on how objects and classes are combined to form
    a system. There are two categories of structural design patterns:


    +   - **Object design patterns**: Structural object design patterns are used to
    describe how to create objects with new functionality

    - **Class design patterns**: Structural class design patterns utilize inheritance
    to create interfaces and combine multiple classes to form a larger structure


    Examples of both of the approaches are presented in this chapter.


    The seven structural design patterns presented in this chapter all have an object
    scope, with the exception of the adapter design pattern. The adapter design pattern
    has both object and class scope, as illustrated in the following table:


    | Object scope | Class scope |

    |---|-|

    | Adapter object pattern | Adapter class pattern |

    | Bridge pattern | |

    | Composite pattern | |

    | Decorator pattern | |

    | Facade pattern | |

    | Flyweight pattern | |

    | Proxy pattern | |


    The structural design patterns listed in the preceding table are detailed in the
    remaining sections of this chapter. They are presented in alphabetical order to
    illustrate that one is not more important than the others.


    # Understanding the adapter design pattern


    The adapter design pattern is used to convert an interface of one class into another
    interface expected by the system. This design pattern empowers classes to work
    in concert with another regardless of the compatibility of their interfaces.


    Consider the real-world case of a motorhome. an electric cord is plugged into
    the motorhome. The other end of cord is plugged into a power source receptacle.
    If the power receptacle does not fit the plug, an adapter is required. We can
    translate The motorhome and power source receptacles are both classes with their
    own interfaces. These interfaces restrict the two classes from communicating with
    each other without the use of an adapter.'
