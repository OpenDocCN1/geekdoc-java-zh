  md: '# Implementing the singleton design pattern


    The singleton design pattern is perhaps the easiest of the creational design patterns
    to understand and implement. The purpose of this design pattern is to ensure there
    is only one instance of the class, and it must be externally accessible. It is
    common for security-based systems to implement the singleton design pattern. An
    example would be a banking system that creates new account numbers. It is important
    that these account numbers are only generated by a single system.


    We will implement the singleton design pattern simply by making the singleton
    class constructor private.


    We will look at an example use case, the UML class diagram, and the source code''s
    necessary to implement the singleton design pattern for this scenario.


    # Use case


    To demonstrate the singleton design pattern, we will create a bank account number
    generation system. This system will consist of a singleton class that can only
    be instantiated once. Our system will attempt to create more than one instance
    of the singleton class to verify our application''s functionality.


    # UML class diagram


    As indicated by the UML class diagram, two classes are required to demonstrate
    our singleton design pattern implementation:


    | AccountDriver | CreateBankAccount |

    | --- | --- |

    | main() | newAccount |

    | | CreateBankAccount() |


    UML class diagram—singleton design pattern implementation


    The UML class diagram aptly indicates that the AccountDriver class contains the
    main() method and will be used to drive the program''s execution.'
