  md: '# Understanding the model-view-controller pattern


    The model-view-controller architectural pattern is one of the most commonly used
    patterns in modern software design and development. It is used in desktop and
    mobile applications. The pattern segments systems into model, view, and controller
    components. The model component is used to store application data and logic. The
    view is where visual elements are provided to the user. The controller processes
    input and communicates, as appropriate, to the model and view components.


    The model-view-controller pattern is most commonly referred to as MVC throughout
    the software industry.


    The View is used to present data to the user. This enables the user to interact
    with, or use, the Controller. The Controller manipulates the Model, which updates
    the View:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_223_0.png)


    As illustrated, the user is viewed as the most important part of this pattern,
    even though it is not an official part of the MVC pattern. With a user-centric
    purpose, the MVC architectural pattern is often used for UI-rich applications
    such as mobile apps.'
  merge: -1
