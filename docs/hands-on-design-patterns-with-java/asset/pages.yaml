  md: '# Preface


    This book was written to provide software engineers, system architects, and software
    developers a timeless reference and guide on over 60 design patterns. While the
    examples are provided in Java, the explanations and examples are programming language-agnostic.


    In addition to covering behavioral, creational, structural, architectural, functional,
    and reactive design patterns, this book provides the reader with an introduction
    to the Unified Modeling Language (UML) and Object-Oriented Programming (OOP).
    UML is covered with specific focus on behavioral and structural diagrams, as they
    are used throughout the book to provide a deeper understanding of the featured
    design-pattern implementations. OOP is covered to provide an overview or refresher,
    depending on their experience. Understanding OOP principles is key to understanding
    how to program in Java.


    # Who this book is for


    This book is for software engineers, system architects, and software developers
    that want to understand the different design patterns and how they can be used
    to create more efficient and resilient systems. Familiarity with the fundamentals
    of the Java programming language is expected.


    # What this book covers


    Chapter 1, Unified Modeling Language Primer, provides an introduction to UML and
    explains how it is used to communicate class structures, objects, and interactions.
    Four behavioral diagrams and six structural diagrams are explained, along with
    examples to help solidify your understanding of these important components in
    design, and their applicability to the design patterns featured in this book.


    Chapter 2, Object-Oriented Design Patterns, explores fundamental, intermediate,
    and advanced concepts and approaches to OOP and their applicability to design
    patterns. OOP approaches are explained and a complete OOP class as an example
    of how to implement OOP concepts. The principles of design patterns are explored,
    which will prime you to dive into the design patterns featured in the rest of
    the book.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preface


    Chapter 3, Behavioral Design Patterns, explores behavioral design patterns with
    a specific focus on the chain of responsibility, command, interpreter, mediator,
    memento, null object, observer, state, strategy, template method, and visitor
    design patterns. This chapter demonstrates how behavioral design patterns focus
    on how system components interact to form a system.


    Chapter 4, Creational Design Patterns, takes a thorough look at the abstract factory,
    builder, factory method, prototype, simple factory, and singleton design patterns.
    The exploration of these six creational design patterns demonstrates how they
    are used to manage objects as they are instantiated.


    Chapter 5, Structural Design Patterns, provides detailed information on the adapter,
    bridge, composite, decorator, facade, flyweight, and proxy structural design patterns.
    These patterns either have an object scope or class scope to relate to how objects
    and classes are combined to form a system.


    Chapter 6, Architectural Design Patterns – Part I, examines the blackboard, broker,
    client-server, event-driven, transform-load, layered, master-slave, and microkernel
    architectural design patterns. These design patterns are explained, as is their
    applicability to system-level design.


    Chapter 7, Architectural Design Patterns – Part II, continues our coverage of
    architectural design patterns with a specific look at the microservices, model-view-controller,
    naked objects, peer-to-peer, pipe-filter, serverless, service-oriented, and space-based
    design patterns.


    Chapter 8, Functional Design Patterns, takes a look at functional design and functional
    programming. The execute around, lambda, MapReduce, memoization, streams, and
    tail call patterns are examined. The chapter also reviews how functional design
    patterns use functional programming to solve computational problems and system
    design challenges.


    Chapter 9, Reactive Design Patterns, examines the responsive, resilient, elastic,
    and message-driven characteristics of reactive design patterns. Specific design
    patterns covered in this chapter include asynchronous communication, autoscaling,
    bounded queue, bulkhead, caching, circuit breaker, event-driven communication,
    fast fail, failure handling, fan-out and quick reply, idempotency, monitoring,
    publisher-subscriber, self-containment, and stateless patterns.'
  merge: -1
