  md: '# Functional Design Patterns


    Consider a system that processes electronic files, maybe for a banking application.
    Each of these files represents an individual transaction. There are a vast number
    of different types of transactions, each governed by a separate class in the system.
    Thousands of these files are processed every hour. Including the preProcessing()
    and postProcessing() as part of the individual classes is wasteful and should
    be avoided. To accomplish this, we can implement our bank transaction system with
    syntax displayed here:


    ```

    Transaction preProcessDuring: [this performBankingOperation: Transaction]

    ```


    We can use the execute design pattern to encapsulate a pair of actions in the
    actual objects that require a pair of actions instead of encapsulating the actions
    in a code that uses the object. The goal of this design pattern is to avoid duplicated
    code in classes.


    This section provided an overview of the execute functional design pattern along
    with representative sample implementation code.


    # Understanding the lambda design pattern


    Lambda functionality was introduced in Java 8 and has forever changed the landscape
    of programming in Java. The lambda functional design pattern uses lambda functions,
    also referred to as anonymous functions. These functions are passed as arguments
    to other functions.


    Lambda functions have three parts:


    +   - A single parameter: (argument)

    - The Arrow operator: ->

    - The body: (body)


    As with anything else in Java, there are a bunch of rules associated with even
    this seemingly simple:


    +   - If the parameter on the left has its explicitly stated, and the parameter
    must be encased in parenthesis, for example, (String a)

    - The body can only call a single method

    - The body must return a result

    - For bodies with only one parameter, you do not need braces or a semicolon

    - For bodies with more than one parameter, you do need braces and a semicolon

    - You cannot re-declare a local variable'
