  md: "# Object-Oriented Design Patterns\n\n# Chapter 2\n\nWe use encapsulation as\
    \ an approach to data protection in OOP. Encapsulating too much data into a class\
    \ is an anti-pattern—something should be avoided. With the create concise approaches,\
    \ we should identify all data copies of an object have in common and only encapsulate\
    \ those data elements. Other data might be better suited for an ancillary class.\n\
    \n# Being purposeful with inheritance\n\nInheritance is a powerful OOP construct.\
    \ We can model objects effectively, as was illustrated with the bicycle. We know\
    \ that the following relationships exist:\n\n+   * Bicycle is a two wheeled\n\
    * Bicycle is a vehicle\n* Bicycle is an object\n\nWhen we program inheritance,\
    \ we should perform the \"IS A\" Checks using the following pseudo-code logic\n\
    \n```\nif <child object> is a <parent object> then relationship = True;\nelse\
    \ relationship = False\n```\n\nOur \"IS A\" Checks fails, then inheritance should\
    \ be avoided. This is an important test that, with dedicated use, can help ensure\
    \ that inheritance lines between objects are valid.\n\nLet's create the \"IS A\"\
    \ Checks for our Bicycle class. We will do this using Java's instanceof operator.\
    \ Here is the code in three sections. The first section runs the checks for myBicycle6\
    \ and to see whether it is an instance of Bicycle, TwoWheled, Vehicle, and Object:\n\
    \n```\n// IS A Checks\nSystem.out.println(\"n\\IS A\\\" CHECKS\");\n\n// focus\
    \ on myBicycle6\nBicycle myBicycle6 = new Bicycle();\n\nif (myBicycle6 instanceof\
    \ Bicycle)\n    System.out.println(\"myBicycle6 Instance of Bicycle: True\");\n\
    else\n    System.out.println(\"myBicycle6 Instance of Bicycle: False\");\n\nif\
    \ (myBicycle6 instanceof TwoWheeled)\n    System.out.println(\"myBicycle6 Instance\
    \ of TwoWheeled: True\");\nelse\n    System.out.println(\"myBicycle6 Instance\
    \ of TwoWheeled: False\");\n```"
