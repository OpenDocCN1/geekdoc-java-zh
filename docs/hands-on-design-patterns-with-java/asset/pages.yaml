  md: '# # Unified Modeling Language Primer


    This book features several design patterns and covers their implementation using
    Java. We can use **Unified Modeling Language (UML)** to help communicate class
    structures, objects, and interactions. This chapter provides an overview of UML,
    with a specific focus on diagrams applicable to the hands-on activities in this
    book.


    The following topics will be covered in this chapter:


    +   - Introducing UML

    - Behavior diagrams

    - Structural diagrams


    # ## Technical requirements


    This chapter does not have any technical requirements. In order to create UML
    diagrams, the following open source software tool is recommended:


    +   - Modelio, which is available at https://www.modelio.org'
  merge: -1
