  md: 'Architectural Patterns - Part 1


    Chapter 6


    # Introducing architectural patterns


    Traditional design patterns, which have been categorized as behavioral, creational,
    and structural, remain valid in modern programming, including with Java. Architectural
    patterns differ from design patterns in scope—architectural patterns, as you might
    surmise from its name, with a broader scope. Generally speaking, architectural
    patterns take a holistic view of systems and group components for illustrative
    purposes. The visual depiction of architectural patterns does not use UML class
    diagrams like the aforementioned design patterns do. Instead, a nonprescriptive
    approach is taken for visually documenting architectural patterns.


    Architectural patterns work at the system level, and it is common for design to
    be dropped from the architectural design pattern title. Regardless of which label
    is used, architectural or design patterns, provide the design of an entire system
    or group of system components.


    We will cover eight architectural patterns in this chapter. They have been presented
    alphabetically, as there is no order of importance. Let''s begin with the first
    one.


    # Understanding the blackboard pattern


    The blackboard architectural pattern is used for large systems that do not have
    a definitive solution. This pattern is often used to design frameworks for speech
    recognition, computer games, and dynamic systems with artificial intelligence
    or machine learning.


    We will now look at the following implementations of the blackboard architectural
    pattern:


    +   - Coffee shop automation

    - Warehouse security bot


    # Coffee shop automation example


    Our first example of the blackboard architectural pattern features coffee shop
    automation. Let''s say that we want to program an android (robot) to run a coffee
    shop. This android will be on duty for 24 hours each day and will have multiple
    tasks, as shown in the following list:


    +   - Taking and filling customer orders

    - Handling payments

    - Bussing tables


    [ 178 ]'
