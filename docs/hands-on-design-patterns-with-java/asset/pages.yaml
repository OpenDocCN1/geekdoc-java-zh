    #  Introducing UML


    UML was developed in 1994 to document object-oriented systems. Since that time,
    UML has become a standard tool for software engineers, software developers, and
    businesses. UML is used to design software and, after programming, also provides
    a visual record for the system which can be be included as part of formal software
    documentation.


    There are two types of UML diagrams—behavioral and structural. Both are described
    in the sections that follow.


    # Understanding behavioral UML diagrams


    Behavioral diagrams illustrate how system components interact to form a system.
    The four diagrams listed here are behavioral, and are briefly described in the
    subsections that follow:


    +   * Activity diagrams

    * Interaction diagrams

    * State machine diagrams

    * Use case diagrams'
  merge: -1
