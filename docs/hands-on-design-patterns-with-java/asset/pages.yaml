    # # Understanding the naked object pattern


    The naked objects architectural pattern mandates domain object encapsulation of
    object data. In addition, a user interface has to be created for the following
    actions:


    +   - Instantiating objects

    - Object retrieval

    - Object data retrieval

    - Method invocation


    An additional requirement of the naked objects architectural pattern is that the
    aforementioned user interface must be auto-generated based on the domain object
    definitions. The core goal is to create behaviorally complete objects, with their
    attributes and behaviors encapsulated, and for the view and controllers to be
    generic in nature:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_228_0.png)


    [ 214 ]'
  merge: -1
  pgno: 228
