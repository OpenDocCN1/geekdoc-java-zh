    # Chapter 9


    ![](img/bcdf8abab5e2de6d67770104d49e5070_288_0.png)


    Now that we have some knowledge of autoscaling, let’s look at the two types of
    autoscaling:


    +   * Horizontal scaling

    * Vertical scaling


    We will review both of these autoscaling types in the next two sections.


    # Horizontal scaling


    An example of horizontal scaling is when we increase or decrease our processing
    load such with more servers or database servers. Since we only scale when our
    system requires it, we only pay for what we use. This underscores the importance
    of never having too much nor too little processing capability.


    When we horizontally scale, we are scaling out. An easy way to remember this is
    that we would need to zoom out of your system’s diagrams to see the additional
    servers on the same horizontal level.


