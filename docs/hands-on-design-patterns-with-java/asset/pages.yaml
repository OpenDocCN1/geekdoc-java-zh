  md: '# Introduction to object-oriented programming


    Object-Oriented Programming (OOP) has been around for a couple of decades now,
    and most software developers are familiar with at least one OOP language, such
    as C or Java. The introduction of OOP represented a significant programming paradigm
    shift from the prevailing procedural programming technique. With OOP programming,
    the focus is on objects, and the focus of procedural programming is on procedures.
    For example, a procedural programming approach to a bicycle management information
    system would focus on the procedures that the system might perform. The OOP approach
    would focus on the bicycle and model it as an object. With the physical bicycle
    represented as an OOP object, we can define characteristics of the object and
    what behaviors can be taken with respect to the bicycle object.


    In this section, we will cover the basics of OOP and use the bicycle object as
    a common reference. This section is subdivided as follows:


    +   * Primary benefits of OOP

    * Sample OOP class

    * Instance variables

    * The This reference


    # Primary benefits of OOP


    There are many benefits of OOP. Chief among them are the following:


    +   * Portability

    * Inheritance

    * Encapsulation

    * Polymorphism


    Each of these aspects is detailed in the following sections.


    # Portability


    Portability, also referred to as modularity, is the primary benefit of OOP. With
    OOP, we program in a series of classes. For example, we would have a bicycle class
    and other classes for a complete bicycle management system. If there was a problem
    with a bicycle method, we immediately know to check the bicycle class. That makes
    source code troubleshooting efficient.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Object-Oriented Design Patterns


    # Chapter 2


    The class structure lends itself well to portability. Our example bicycle class
    can easily be used in other programs as it is a self-contained object. As mentioned
    previously, the class contains all the components of a physical bicycle.


    # Inheritance


    Inheritance in programming is the same as in real life. A girl inherits from her
    mother, who inherits from her mother, and so on. The following diagram shows inheritance
    in the real world and how it relates to OOP:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_38_0.png)


    On the left-hand side of the preceding diagram, a Grandmother passes down traits
    to the Daughter, who passes down traits to the Granddaughter. So, the Granddaughter
    inherits from both the Daughter and Grandmother. The same inheritance concept
    applies to our Bicycle class, which inherits from the Two-Wheeled class and the
    Vehicle class. This is a powerful schema as it avoids class bloating. As an example,
    if the Vehicle class has data elements such as year, make, and model, those elements
    are automatically part of the Two-Wheeled and Bicycle classes. We will see an
    example of this later on in this chapter.'
  merge: -1
