    # Understanding the fan-out and quickest-reply design pattern


    The fan-out and quickest-reply reactive design pattern emphasizes rapid processing.
    Financial software that provides real-time, or near real-time, stock information
    instances uses this design pattern. The concept is to provide sufficient processing
    instances so requests can be processed without waiting in a queue.'
