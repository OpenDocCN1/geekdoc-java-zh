  md: "# Accessor and mutators\n\nAccessor methods are those that allow an object's\
    \ data to be accessed. These methods can get the data, but not change it. This\
    \ is a great way to protect the data from being changed. Accessor methods are\
    \ also referred to as Getters methods.\n\nMutator methods, also known as setter\
    \ methods, allow the object's instance variables to be changed.\n\nHere is a complete\
    \ set of accessories and mutators for our Bicycle class:\n\n```\n// Accessors\
    \ (Getters)\npublic int getGears() {\n    return this.gears;\n}\n\\public double\
    \ getCost() {\n    return this.cost;\n}\npublic double getWeight() {\n    return\
    \ this.weight;\n}\npublic String getColor() {\n    return this.color;\n}\n\n//\
    \ Mutators (Setters)\npublic void setGears(int nbr) {\n    this.gears = nbr;\n\
    }\npublic void setCost(double amt) {\n    this.cost = amt;\n}\npublic void setWeight(double\
    \ lbs) {\n    this.weight = lbs;\n}\npublic void setColor(String theColor) {\n\
    \    this.color = theColor;\n}\n```"
