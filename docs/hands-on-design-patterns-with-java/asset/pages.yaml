  md: '# Observing the observer pattern


    The observer design pattern requires a one-to-many object dependency. The purpose
    of the dependency is to update subscriber objects when a change is made to the
    publisher''s state. An example is an online university course discussion forum.
    There is one forum and many subscribers. When an update to the forum is made,
    the subscribers are notified. Subscribers have the option of unsubscribing when
    they no longer want to be notified of changes to the discussion forum.


    We will look at an example use case, the UML class diagram, and the source code
    necessary to implement the observer design pattern for this scenario.


    # Use case


    We will utilize the discussion forum example to demonstrate the observer design
    pattern. Our example will consist of one discussion forum and multiple subscribers.
    We can also refer to these subscribers as **observers**.


    # UML class diagram


    The UML class diagram illustrates a basic implementation of the observer design
    pattern:


    | << interface >> |

    | Observer |

    | |

    | StudentDashboard | ForumMonitor |

    | unreadMessages UNREAD, ALERT LEVEL |

    | setUnreadMessages() update() |

    | getUnreadMessages() |

    | Observable |


    UML class diagram—observer design pattern implementation


    As shown in the UML class diagram, the `StudentDashboard` class extends the `Observable`
    class, and the `ForumMonitor` implements the `Observer` interface.'
