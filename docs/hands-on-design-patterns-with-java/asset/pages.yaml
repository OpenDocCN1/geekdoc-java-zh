  md: '# Structural Design Patterns


    # Chapter 5


    This design pattern is commonly used with graphical software that includes layering
    objects over one another. For example, building a Graphical User Interface (GUI)
    or creating a Heads Up Display (HUD) for a game.


    The decorator design pattern is occasionally referred to as a wrapper design pattern
    because the decorator essential wraps around the object and its dynamically created
    responsibilities.


