    # Implementing the facade design pattern


    The facade design pattern creates an interface that is served as an interface
    to other interfaces within a system or subsystem. The benefits of using this design
    pattern are that subsystems are less complex, the reliance components is reduced,
    and communication between system components is minimized.


    Consider the following illustrations. The image on the left shows the organization
    of a system and subsystems without a facade interface. The right-hand image shows
    the facade interface layered between the main classes and the subsystem:


