  md: '# Package diagrams


    Package diagrams are used to provide a high-level visual depiction of large systems.
    These diagrams are simplistic and simply show how a system''s components are grouped.
    The following example illustrates nested packages, starting with Java and drilling
    down to the ArrayList:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_34_0.png)


    # Summary


    The Universal Modeling Language (UML) is used to create visual documentation of
    our systems. This can be used to design a system as well as document a system.
    UML is widely used by software engineers, software developers, and other professionals.


    Two of the 14 UML diagrams are behavioral and structural. Behavioral diagrams
    illustrate how system components interact to form a system and include activity
    diagrams, interaction diagrams, state machine diagrams, and use case diagrams.
    There are several types of interaction UML diagrams, including sequence diagrams,
    communication diagrams, and timing diagrams.


    Structural diagrams illustrate components of a system and include class diagrams,
    component diagrams, composite structure diagrams, deployment diagrams, object
    diagrams, and package diagrams.'
