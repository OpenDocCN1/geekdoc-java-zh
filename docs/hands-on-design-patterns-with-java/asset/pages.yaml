    # Understanding the extract-transform-load pattern


    The extract-transform-load architectural pattern, as the name suggests, has the
    following three stages:


    +   1. Extract data from external sources

    2. Transform the extracted data as needed

    3. Load the newly transformed data into a repository specific to the current system


    The most common uses of extract-transform-load pattern is in business intelligence,
    data warehousing, knowledge management systems, and customer relationship management
    systems.


    We will look at the extract, transform, and load steps as they apply to the similarly-named
    architectural pattern in the next sections. We will use the example of a sales
    tool that mines various sources of customer leads, transforms data into a common
    form, and then loads the data into a central database.


    [ 189 ]'
  merge: -1
