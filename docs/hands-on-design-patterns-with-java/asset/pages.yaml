  md: '# Understanding the self-containment design pattern


    Systems that employ the self-containment reactive design pattern are not reliant
    on non-system components. This design pattern can also be applied at the system
    component level. In instance, a system component would be self-contained and not
    rely on other system components.


    To examine the self-containment reactive design pattern, let''s first consider
    a system diagram depicting a lack of self-containment. As you can see from the
