    An initiating event starts the process, and the chain of events continues until
    there are no published events that exist for that specific initiating event.


    # Event-driven architectural pattern – mediator


    The mediator form of the event-driven architectural pattern is usually employed
    for multiple-step events, with each step requiring coordination.


    The following diagram shows the mediator form of the event-driven architectural
