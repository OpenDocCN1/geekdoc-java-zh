  md: '# Unified Modeling Language Primer


    # Chapter 1


    There are several visual components to the UML use case diagram:


    +   * **Actor:** The stick figure is referred to as an actor. In our example,
    student and instructor were both actors. These are the users that use your system.
    Often, there are multiple user roles in a system.

    * **Relationship:** The solid lines indicate which actors interact with which
    use case items.

    * **System:** The overall system is represented by a rectangle. Actors are placed
    outside of the system and use case items are placed within the system.

    * **Use Case Item:** Use case items are represented in ovals, as seen in our preceding
    Online Grade Book example. These are the components of your use case.


    These visual components are further illustrated as follows:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_29_0.png)


    # Understanding structural UML diagrams


    Structural diagrams illustrate components of a system. The six diagrams listed
    here are structural, and are briefly described in the subsections that follow:


    +   * Class diagrams

    * Component diagrams

    * Composite structure diagrams'
