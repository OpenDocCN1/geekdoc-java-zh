    # # Understanding the serverless pattern


    The implementation of serverless architectural patterns is becoming more prevalent
    due to the advent of Infrastructure as a Service (IaaS), Platform as a Service
    (PaaS), Software as a Service (SaaS), Backend as a Service (BaaS), Mobile Backend
    as a Service (MBaaS), and Functions as a Service (FaaS) cloud-based offerings.
    Serverless architectural patterns are simply patterns that do not incorporate
    dedicated on-premises servers.


    > > The term on-premises refers to components that physically reside at an organization’s
    actual location.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Architectural Patterns - Part II


    # Chapter 7


    This does not indicate typical server-side scripting, and that functionality does
    not exist; rather, these components are managed by third-party services such as
    cloud-based services. The largest providers of these services are Amazon, Google,
    Microsoft, IBM, and Oracle.


    The benefits of implementing a serverless architectural pattern include the following:


    +   * Cost-effectiveness

    * High scalability

    * High flexibility

    * Faster upgrades, changes, deployments

    * Benefit from applications running closer to the end-user''s region


    Some of the disadvantages include the following:


    +   * A sense of loss of control

    * Inability to easily switch between cloud-service solutions (for example, AWS
    to Microsoft Azure)

    * Potential performance issues (that is, multi-latency)


    In the following sections, we will explore the following example implementations
    of the serverless architectural pattern.


    # IaaS implementation


    A typical Infrastructure as a Service (IaaS) implementation involves a clear separation
    of responsibilities between the on-premises organization and the IaaS provider:


    | On-Premise Management | IaaS Provider Management |

    |---|---|

    | Applications | Data | Servers | Networking |

    | Operating System | Middleware | Virtualization | Storage |


    Serverless pattern—example IaaS implementation


    It is important that for appropriate responsibility division that the servers
    and networking are taken care of by the IaaS provider.'
