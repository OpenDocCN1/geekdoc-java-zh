  md: '# Using the null object pattern


    The null object design pattern is relatively straightforward. It is a common task
    to check for null values during routine programming. We check for null so that
    we do not receive a null exception from the Java Virtual Machine (JVM) at runtime.


    The null object design pattern negates the need to search for the null condition.
    This is accomplished by creating a null object class. The null object class is
    designed to implement the same interface as other classes in the package. No functionality
    is included in the null object class.


    We will look at an example use case, the UML class diagram, and the source code
    necessary to implement the null object design pattern for this scenario.


    # Use case


    We will demonstrate the null object design pattern with a simple TrainStatus interface
    that has three methods to activate, deactivate, and check whether the object is
    currently activated. Five classes will be used, each implementing the TrainStatus
    interface. The NorthernTrain, EasternTrain, and WesternTrain classes will be identical.
    The NullObjectTrain class will be similar to the other classes in that it will
    implement the TrainStatus interface, but it will have no functionality. This is
    illustrated with the UML class diagram in the next section and then again with
    the source code in an additional section.'
  merge: -1
