  md: 'Object-Oriented Design Patterns


    Chapter 2


    # Principles of design patterns


    So far, we have discussed taking a multi-class approach to designing object-oriented
    programs. We also used examples to demonstrate the use of accessors, mutators,
    constructors, and driver classes. There are three key principles to bear in mind
    when studying the design patterns presented in subsequent chapters of this book:


    +   * Creating concise objects

    * Encapsulating to protect

    * Being purposeful with inheritance


    These principles are explored in the subsequent sections.


    # Creating concise objects


    Objects are at the core of OOP. This principle aims to remind software designers
    and developers to isolate objects to a specific model. Using our Bicycle class
    as an example, we would create Bicycle objects that contained the appropriate
    attributes and behaviors. The bicycle attributes used the gears, cost, weight,
    and color. We created accessors and mutators for each of those attributes. We
    also created a method that echoed the object''s attributes to the output console.
    No behaviors were added to the Bicycle object, but we could have included behaviors
    such as upgrade().


    What we did not include in the Bicycle class were attributes and behaviors that
    were ancillary to the Bicycle object. Examples of these include the owner''s address,
    vacation details, and more. While the data might be somewhat related to a specific
    Bicycle, it is not part of a real-world bicycle that we need to model.


    Adhering to this principle helps ensure our code is concise, easy to maintain,
    and portable.


    # Encapsulating to protect


    Earlier in this chapter, we defined encapsulation as the hidden nature of an object''s
    data. Granting access to an object''s data via its own accessors and mutators
    is a great approach to data protection.


    [ 37 ]'
