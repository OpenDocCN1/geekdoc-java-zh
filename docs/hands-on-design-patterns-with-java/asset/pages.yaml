  md: '# Understanding the client-server pattern


    The client-server architectural pattern is one of the more commonly known architectural
    patterns, especially with network architectures. This architectural pattern consists
    of two component types—client components and server components. Simply stated,
    the server listens to requests from clients and provides the requested services.


    The following diagram provides a high-level view of the client-server pattern.
    The connections between clients and the server can vary and include common connections
    as TCP/IP:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_199_0.png)


    We will look at the following implementations of the client-server architectural
    pattern:


    +   - Coffee shop

    - Three-tier network


