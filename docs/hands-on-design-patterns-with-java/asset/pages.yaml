  md: '# Functional Design Patterns


    # Chapter 8


    The advantages to using a functional approach include easier debugging and the
    ability to pass functions as parameters. You will explore the latter advantage
    in the Understanding lambda design pattern section. Additional advantages include
    the high applicability to mathematical, statistical, concurrency, and parallelism
    applications.


    The general disadvantages of implementing the functional design patterns include
    code complexity, code readability, and application performance.


    The functional design patterns listed in the table you have just seen are detailed
    in the remaining sections of this chapter. They are presented in alphabetical
    order to illustrate that one is not more important than the others.


    # Understanding the execute around design pattern


    The execute around functional design pattern is used when processes have pre-
    and post-processing that always occurs. This allows us to focus on the core function
    and not on the processing that comes before or after. The pre- and post-processing
    code can exist once, instead of being part of each code process. This can result
    in a big win.


    Consider a system with hundreds of individual classes that are run on an ad hoc
    nature based on business logic. Instead of each of those hundreds of processes
    including the pre- and post-processing code, that code can be located in one class.


    The pre- and post-processing actions are paired and included in the object that
    requires those actions. This is done instead of including those actions in a class
    that uses the object. So, we are including the actions in the class that uses
    the object.


    # Demonstrated implementation


    At a high level, we can consider the following routine flow of generic operations.
    We start with a preProcessing() method followed by a commonTask() method and,
    finally, a postProcessing() method:


    ```

    preProcessing();

    commonTask();

    postProcessing();

    ```'
