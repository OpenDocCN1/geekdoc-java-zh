  md: '# Creational Design Patterns


    # Chapter 4


    The abstract factory design pattern creates an interface that is used to create
    multiple objects without knowledge of the concrete class. A concrete class in
    Java is a non-abstract class that implements all of the methods in its hierarchy.
    This is a high-powered demonstration of encapsulation. This design pattern allows
    us to change implementations without changing source code.


    We will look at an example use case, the UML class diagram, and the source code
    necessary to implement the abstract factory design pattern for this scenario.


    # Use case


    We will use a motor-home manufacturing example to demonstrate the abstract factory
    design pattern. When motor homes are manufactured, there are many details that
    must be determined. At a high level, the manufacturer must decide on the type
    (type A, type B, or type C), the style (for example, camper van, bus, truck),
    the frame, engine, and kitchen. Our example will support type A, type B, and type
    C motorhomes, all of which require a style, frame, engine, and kitchen.


    The abstract factory design pattern will be used to create object sets, one for
    each motor-home type.


