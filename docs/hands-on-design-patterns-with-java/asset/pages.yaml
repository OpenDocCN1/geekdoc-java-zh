  md: '# Functional Design Patterns


    # Chapter 8


    Big-data processing and detailed analysis of the MapReduce functional design pattern
    are complex concepts and are beyond the scope of this chapter. In order to appreciate
    the MapReduce design pattern, we will briefly cover the following implementation
    approaches:


    +   - Input-Map-Output

    - Input-Map-Reduce-Output

    - Input-Multiple Maps-Reduce-Output

    - Input-Map-Combiner-Reduce-Output


    # Input-Map-Output


    The Input-Map-Output form of the MapReduce functional design pattern can be used
    without the reduce component. It will be implemented when there is a need to change
    data formats and not perform aggregate calculations. An overview of the process
    is provided in the following diagram:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_258_0.png)


    To demonstrate this approach, we will use the scenario of a faculty registry system
    that is being cleaned up. We will handle each step in this pattern in the following
    sections.


    # Input


    For our example, let''s assume that we have a faculty registry containing over
    4,000 full-time and adjunct instructors for a non-specific university. The registry
    names have become corrupted over the years, mostly due to poor data entry controls.
    For example, here are several different forms of current faculty entries (displayed
    here for a single member for comparison). The faculty member listed next has the
    full name Thomas A. Anderson and a nickname of Neo:


    ```

    Thomas Anderson\Thomas A. Anderson

    ```'
