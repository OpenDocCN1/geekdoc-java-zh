  md: '# Understanding the failure-handling design pattern


    When we consider the resilient characteristic of reactive systems, systems and
    component failures are of utmost concern. It is important to handle these failures
    in a manner that we determine, which suggests we need to take a purposeful approach
    to failure-handling. The design pattern has two major components:


    +   - Failure isolation

    - Controlled failure


    We will look at each of these components next.


    # Failure isolation


    Isolating failure is ensuring that one component''s failure does not impact other
    components. As an example, assume that you are developing an information system
    for an auto dealer. There are a lot of departments and functions used by the auto
    dealer they hope to have their system operational as close to 100% of the time
    as possible.


    Consider the following diagram. There are several components that rely on others.
    For example, the Parts Procurement service cannot be used if the Payment Gateway
    is down, nor can Service Orders be processed. If the Parts Procurement and Service
    Orders services were reliant on the Payment Gateway, they could still be used
    by the auto dealer. When the Payment Gateway is down, jobs will be queued from
    the Parts Procurement and Service Order services. Once the Payment Gateway is
    back online, these jobs will be processed:


    | Admin Portal | APIs | Data Services |

    | --- | --- | --- |

    | | Payment Gateway | Parts Procurement |

    | Internet Gateway | Service Orders |

    | | Service Scheduler | Customer Database |


    ![](img/bcdf8abab5e2de6d67770104d49e5070_305_0.png)'
  merge: -1
  pgno: 305
