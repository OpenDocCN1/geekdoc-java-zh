  md: '# Understanding the microservices pattern


    The microservices architectural pattern is used for breaking a system into smaller
    services, or microservices, that have limited interdependencies. The benefits
    of this pattern includes the following:


    +   - The modular nature of the pattern permits individual microservices to be
    used elsewhere

    - Processing efficiency

    - Easily maintainable code


    As illustrated next, there is a central point that interfaces with the microservices
    comprise the system. In this example, the central point is the System Interface:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_220_0.png)


    The previous diagram also indicates how some microservices can communicate with
    other microservices. This architectural pattern mandates that the microservices
    be loosely coupled, so the true interdependency should be communications.


    Software development using the microservices pattern consists of developing each
    microservice separately, which is a preferred approach, especially for large systems.
    This also permits the development of multiple microservices simultaneously by
    different teams, accelerating delivery time. Systems designed with this pattern
    are also apt to be highly scalable. Additional microservices can be added, and
    for those that are heavily used, they can be replicated.'
  merge: -1
