    # # Understanding the template method pattern


    The method design pattern involves creating an algorithm template with processing
    steps relegated to child classes. The purpose is to give the child classes the
    ability to specify their own steps while remaining true to the algorithm structure.


    As the design pattern''s name suggests, we create a template that can be followed
    by subordinate classes. An example is a recipe template that bakers following
    the steps to create the shell and then adding their own pie filling based on their
    preference. At the end of the process, all the pies will look similar but will
    have different fillings.


    Another example is creating a syllabus or resume template. Each use of the template
    can be used for unique content and would still not alter the template.


    # # Understanding the visitor pattern


    The visitor design pattern allows us to perform operations on an object without
    altering its structure. Essentially, we can add functionalities to an object with
    changing the original object structure. An example is when a person goes to a
    hair salon and asks for a haircut. Once in the chair, the parameters of what is
    desired are changed. This does not change the structure of the operation; it just
    adds new functionality such as having hair colored as well as cut and styled.


    [ 98 ]'
