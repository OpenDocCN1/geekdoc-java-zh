  md: '# Summary


    In this chapter, we reviewed seven structural design patterns that focus on how
    objects and classes are combined to form a system. The two structural design pattern
    catories were identified as object design patterns and class design patterns.
    The structural object design patterns are used to describe how to create objects
    with new functionality. Structural class design patterns utilize inheritance to
    create interfaces and combine multiple classes to form a larger structure. Examples
    of both approaches are provided in this chapter with multiple design pattern implementations.


    In the next chapter, we will shift our focus to architectural design patterns.
    The chapter starts with an overview of architectural design patterns and covers
    the application, layered, and microservice design patterns.


