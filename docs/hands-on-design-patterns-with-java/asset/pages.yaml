    # Understanding the stateless design pattern


    When we implement the stateless design pattern, we create classes and objects
    that do not retain state changes. In this approach, each use of the object, as
    an example, uses the object in its organic form. In our context, *state* refers
    to the values of the object''s variables. So, there is no definitive list of states.
    The state of an object is specific to a moment in time.


    Implementing the stateless design pattern is appropriate for the following cases:


    +   * When we want to clone services

    * When the current state of an object dictates object''s behavior

    * When object behavior is a runtime decision and that behavior is state-dependent

    * When you want to process the state of an object as if it were an object


    In the next section, we will review the UML class diagram for an implementation
    of the stateless reactive design pattern.'
