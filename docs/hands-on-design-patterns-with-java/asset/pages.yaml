  md: '# Responsive


    When a system is responsive, it is said to be able to respond to events quickly.
    This does not\simply refer to processing data or objects; it is more significant
    than that. The desired level

    of responsiveness includes rapid identification of issues, a determination of
    what type of

    response is necessary, and then the actual response.


    We will highlight the responsive nature of the reactive design patterns featured
    in this

    chapter.


    # Resilient


    Resilient systems are ones that have a tremendous up-time and are impervious to
    errors.

    Designing a system to be resilient involves extensive error-handling, data redundancy,

    distributed processing, and other concepts that will be further explored in this
    chapter.

    Resilient systems do not have a single point of failure. For example, instead
    of having a\single database, a resilient system might employ replication of a
    database. Labeling a

    system as resilient not only signifies that the overall system is resilient but
    that the

    components and sub-components are as well overall.


    We will highlight the resilient nature of the reactive design patterns featured
    in this

    chapter.


    # Elastic


    An elastic system has the ability to upscale and downscale based on system needs.
    An

    example of this might be when an eCommerce site needs additional servers, gateways,
    and

    other system components to react to an exponential increase in site visits during
    a holiday

    season.


    It is important to highlight that the elasticity of a system includes the ability
    to upscale

    downscale system resources. Depending on the system used, this elasticity can
    be

    controlled using predictive analysis and specialized algorithms to detect when
    specific

    system components reach specific high and low levels.


    We will highlight the elastic nature of the reactive design patterns featured
    in this chapter.'
