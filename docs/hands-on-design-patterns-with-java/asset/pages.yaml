    that the knowledge systems will learn from the android’s interactions with customers
    and the environment. Examples of this could include learning a custom drink, remembering
    the orders of repeat customers, knowing how to clean the mugs, and so on.


    In this implementation of the blackboard architectural pattern, the blackboard
    resides in memory and has read and write access to the knowledge systems.


