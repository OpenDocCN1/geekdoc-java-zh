  md: '# Contributors


    # About the author


    Dr. Edward Lavieri is a veteran software engineer and developer with a strong
    academic background. He earned a Doctorate of Computer Science from Colorado Technical
    University, an MS in Management Information Systems (Bowie State University),
    an MS in Education (Capella University), and an MS in Operations Management (University
    of Arkansas). He has been creating and teaching computer science courses since
    2002. Edward retired from the U.S. Navy as a Command Master Chief after 25 years
    of active service. He is the founder and creative director of three19, a software
    design and development studio. Edward has authored more than a dozen technology
    books, including several on Java.'
