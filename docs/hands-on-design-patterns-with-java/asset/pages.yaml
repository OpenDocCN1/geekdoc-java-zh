  md: '# Summary


    In this chapter, we explored the reactive design pattern category and its individual
    design patterns of asynchronous communication, autoscaling, bounded queue, bulkhead,
    caching, circuit breaker, event-driven communication, fail-fast, failure-handling,
    fan-out, quickest reply, idempotency, monitoring, publisher-subscriber, self-containment,
    and stateless. We also reviewed use cases for the design patterns and how they
    can contribute to well-designed-and-developed systems that are reactive to internal
    and external changes.


    You now have the necessary knowledge of the Universal Modeling Language (UML),
    Object-Oriented Programming (OOP), and over 60 design patterns to enhance your
    software design and development capabilities.


    The design patterns in this book are not time-bound and will remain valid for
    several decades to come.


    # Questions


    +   1. What are the main purposes of reactive design patterns?

    2. What are the four characteristics of reactive design patterns?

    3. Which design pattern allows the client to send multiple request messages to
    the server and not dedicate processing resources and anticipate a response from
    the server?

    4. What are the two types of autoscaling relevant to the autoscaling design pattern?

    5. What type of queues has a fixed number of elements?

    6. Which design pattern uses open, closed, and half-open states?

    7. Which design pattern includes failure isolation?

    8. Which design pattern includes elements whose value remains unchanged after
    repeated calculation?

    9. Which design pattern is event-based and relies on subscribers?

    10. Which design pattern employs self-sufficiency?'
