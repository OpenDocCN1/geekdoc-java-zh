    # Understanding the tail call design pattern


    The tail call functional design pattern is a subroutine, or a tail-recursive function,
    that is executed at the end of a procedure. This design pattern is also referred
    to as the Tail Call Optimization (TCO). The concept of this pattern is straightforward.
    The tail call is the last performed by a method.


    In the next section, we will implement the tail call functional design pattern.


    # Programming the tail call design pattern


    To demonstrate the tail call functional design pattern, we will implement a Lucky
    7 application consisting of a single TailCallExample class. This class will prompt
    the user for a number and perform multiple mathematical on the number that will
    result in 7, regardless of the input.


