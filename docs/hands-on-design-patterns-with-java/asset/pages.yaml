    # Map


    The map component might consist of creating keys based on the last name. Given
    our scenario, we might need to reference an additional data field to ensure we
    properly identify the last name.


    We would do the same for the first name. For the middle name, we might allow middle
    initials as well as middle names, as it might be difficult to obtain any missing
    data.


    # Output


    Our final output would be a list of names in the proper format to include capitalization.
    Our selected format might be this:


    ```

    Last name, First Name <Middle initial OR Middle name>

    ```


    The final results would be an updated faculty registry with each entry in the
    same format.


