  md: '# # Architectural Patterns - Part II


    In the previous chapter, Architectural Patterns – Part I, we explored the architectural
    pattern category and eight specific patterns—blackboard, broker, client-server,
    event-driven, extract-transform-load, layered, master-slave, and microkernel.
    Each of these eight architectural patterns was explained along with diagrams.


    In this chapter, we will continue our exploration of the architectural patterns.
    Specifically, we will review the architectural patterns listed next, along with
    an examination of programming challenges and the architectural patterns to solve
    them:


    +   * Microservices pattern

    * Model-view-controller pattern

    * Naked objects pattern

    * Peer-to-peer (P2P) pattern

    * Pipe-filter pattern

    * Serverless pattern

