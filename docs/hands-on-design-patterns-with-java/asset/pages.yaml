  md: "# Introducing functional design patterns\n\nFunctional design patterns are\
    \ not the same as functional programming. While they can both be considered programming\
    \ paradigms, functional programming can be defined as an approach to structuring\
    \ computer programs that model computational functionality as mathematical functions.\
    \ The term functional design patterns refers to the use of functional programming\
    \ to solve computational problems.\n\nThe following table provides an overview\
    \ of how functional programming fits into the general programming approach landscape,\
    \ especially when compared to object-oriented programming:\n\n| Programming Approach\
    \ | Description |\n|--- |--- |\n| Functional programming | Uses a similar style\
    \ to mathematical functions. |\n| Object oriented programming | Uses an object-centric\
    \ approach. Objects contain attributes and behaviors. |\n| Parallel-programming\
    \ | Uses shared memory. Processes can be executed several times at once. |\n\n\
    ![](img/bcdf8abab5e2de6d67770104d49e5070_245_0.png)\n\nA key concept of functional\
    \ design is that the individual functions have a set of rules. For example, functions\
    \ in a functional programming approach honor the following:\n\n+   - They do not\
    \ mutate any data\n- They provide consistent results, given the same set of arguments\n\
    - They exist to provide a return value\n\nLet's look at two short examples. This\
    \ first example shows how a variable is mutated:\n\n```\nvoid calculateAge(int\
    \ years) {\n  years = years + 1;\n}\n```\n\nThe next example accepts the same\
    \ argument as the previous example but does not mutate it. Instead, it returns\
    \ a value based on the argument and a calculation:\n\n```\nint calculateAge(int\
    \ years) {\n  return years + 1;\n}\n```"
