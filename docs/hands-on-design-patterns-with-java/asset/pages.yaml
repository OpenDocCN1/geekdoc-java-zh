  md: '# Understanding the asynchronous communication design pattern


    Earlier in this chapter, we identified one of the reactive design principles as
    asynchronous message-driven communication. That principle is core to the asynchronous
    communication design pattern:


    +   1. First, the client sends a request message to a server

    2. Next, the server sends an acknowledgement message to the client immediately
    and then takes whatever time is necessary to process the request

    3. Once the request is fully processed, the response message is sent from the
    server to the client


    This diagram illustrates three components of asynchronous communication:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_280_0.png)


    This method of communication is efficient because it allows the client to send
    multiple request messages to the server and not dedicate processing resources,
    and anticipate a response message from the server. The client understands that
    the server will eventually send the response message and it can allocate the processing
    resources at that time.'
