  md: '# Exploring the factory method design pattern


    The factory method design pattern allows subclasses to determine which class to
    create. This is achieved by removing details about which class to create away
    from the framework. Instead, the subclasses are given the responsibility for object
    creation. This design pattern is useful when the framework is unaware of what
    is to be instantiated.


    We will look at an example use case, the UML class diagram, and the source code
    that''s necessary to implement the factory method design pattern for this scenario.


    # Use case


    To demonstrate the factory method design pattern, we will create a Mower Selection
    Helper implementation. The system will provide helpful information to aid users
    in their selection of a lawnmower type. The types that are supported are riding
    and push. We will create an abstract Factory class with a method to retrieve the
    mower type. We will also create a factory method for the concrete classes for
    the instantiation of specific mower objects.


    # UML class diagram


    The UML class diagram for the Mower Selection Helper implementation of the factory
    method design pattern consists of an interface that is implemented by two classes.'
