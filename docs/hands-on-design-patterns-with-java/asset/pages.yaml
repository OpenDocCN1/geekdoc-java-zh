  md: '# Understanding the loan design pattern


    The loan functional design pattern can be used to create resource-aware applications.
    With this pattern, we are not creating code that has to manage resources such
    as memory; rather, we want to control how the resources are used. Of key significance
    is ensuring that garbage collection occurs on our terms rather than waiting for
    Java''s default garbage collection system to kick into action. In this section,
    we will look at an implementation example regarding file processing. Our example
    will include a look at file-processing source code before the loan design pattern
    is implemented, and then we will modify the code using the loan design pattern.
    We will see how the two approaches can be used with the same results.


    # Implementing file processing


    In order to understand the power of the loan design pattern, we will implement
    a file-processing application demonstrating source code before and after using
    the loan pattern. Our application will simulate the opening and closing of a file
    with an additional four processing steps. The workflow is as depicted in this
    diagram:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_253_0.png)'
