    # Crossing the bridge design pattern


    The bridge design pattern simply separates abstraction from implementation. This
    design pattern involves creating a bridge between abstraction and implementation.
    Before exploring this design pattern further, it is important to thoroughly understand
    how abstraction works in Java.


    # Learning about abstraction


    Abstraction is one of the principles of Object-Oriented Programming (OOP) and
    is used to hide implementation details. It is important to understand abstraction
    to support correct implementation.


    An example of abstraction is when we have an abstract User class and multiple
    subclasses that inherit from it. For example, we might have a Learning Management
    System (LMS) User class and three subclasses—Student, Teacher, and Administrator.
    We can implement a method overiding the inherited methods that would otherwise
