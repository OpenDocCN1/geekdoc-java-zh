    In this example of the blackboard architectural pattern, we will consider an automated
    warehouse security bot. This bot will use a stun gun to shoot intruders. Our bot
    will have three basic responsibilities:


    +   * Correctly identify intruders and authorized warehouse workers

    * Navigate the warehouse

    * Move to within the stun gun''s effective range


    Each of these responsibilities can be viewed as a component in our system. These
    components will be **Intr Identification, Navigation, and Ballistics**. The following
    UML class diagram illustrates the relationship between the Bot, the control component,
    and the rest of the system:


    | Intruder Identification | Navigation | Ballistics |

    | :--- | :--- | :--- |

    | updateBlackboard() executeAction() executeTriggeringCondition() | updateBlackboard()
    executeAction() executeTriggeringCondition() | updateBlackboard() executeAction()
    executeTriggeringCondition() |

