    # # Understanding the space-based pattern


    The space-based architectural pattern is designed to avoid functional collapse
    under a high load and maximize scaling. Cloud-based architectures typically implement
    the space-based architectural pattern. Key to the success of this pattern is the
    use of distributing shared memory.


    This complex approach involves the following:


    +   - Eliminating central database constraints

    - Implementing data grids

    - Replicating data grids in memory

    - Maintaining application data in the replicated memory'
  merge: -1
