    So, you can see that there can be a lot of handlers in a system. Moreover, there
    can be a plethora of initiating events happening at the same time. This underscores
    the significance of ensuring exceptions are handled so processes do not fail.


    This section provided an overview of the event-driven communication reactive design
    pattern.


    # Understanding the fail-fast design pattern


    The fail-fast reactive design pattern stipulates that if something is going to
    fail, let it happen as fast as possible. The intention is not to perform any unnecessary
    processing because something is going to fail. We should also be mindful of wasting
    time. A scenario would be if a user was given the opportunity to complete a survey
    and receive a gift card for completing it. If the user answered the first 25 questions
    and then the survey indicated the user was not eligible for the survey or the
    gift card, the result would be dreadful. In this scenario, the disqualifying determination
    should be made much earlier.


    [ 287 ]'
