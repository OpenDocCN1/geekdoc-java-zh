  md: '# Understanding the example is used to permit mediator interactions


    The mediator design pattern is used to permit mediator interactions without using
    explicit object references. This is an advanced use of the object-oriented programming
    encapsulation concept. Mediators manage the interactions between two or more objects.
    A real-world example is a legal mediator where both sides of a lawsuit communicate
    to the mediator, but not directly to each other.


    We will look at an example case, the UML class diagram, and the source code necessary
    to implement the mediator design pattern for this scenario.


    # Use case


    To demonstrate the mediator design pattern, we will emulate a widget production
    system that includes a hopper for parts, a starter to start the system, an assembly
    system to combine hopper components, an accelerator, and an emergency break to
    manage the speed of the system.


    There are inter-relations between the various components for our mediator to manage.
    These inter-relationships are detailed here:


    | Components in the left column have the listed impact on the components listed
    in two columns through six. |

    | Starter | Assembly System | Hopper | Accelerator | Decelerator |

    | Starter | N/A | Powers this component | Powers this component | Powers this
    component | Powers this component |

    | Assembly System | Starter must be on for the assembly system to function | N/A
    | Engages Hopper | N/A | N/A |

    | Hopper | Starter must be on for the hopper to function | Hopper must be on for
    the assembly system to function | N/A | N/A | N/A |

    | Accelerator | Starter must be on for the accelerator to function | Increases
    speed of this component | Increases speed of this component | N/A | When accelerator
    is engaged, component is not available |'
