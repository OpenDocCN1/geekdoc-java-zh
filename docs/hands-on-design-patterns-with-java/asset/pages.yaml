  md: '# Understanding the microkernel pattern


    The microkernel architectural pattern is also referred to as a plug-in architectural
    pattern. We typically use this pattern when we create systems with interchangeable
    components, illustrated in the following diagram as a plug-in:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_214_0.png)


    The general framework of the microkernel architectural pattern is illustrated
    in the previous diagram. The microkernel contains a system''s core logic and functionality.
    The plug-ins each have a specific functionality and contain application programming
    interfaces (APIs) for the microkernel to reference.


    There are five components involved in the microkernel pattern, as shown in the
    following list:


    +   **The microkernel**: The microkernel is the core of this architectural pattern.
    It provides core processing and serves as the middleman between other parts of
    the architecture. All resources are managed by the microkernel, which also manages
    communications with the system''s remaining components.


    +   **One or more clients**: The client represents the entity using the system.
    This can be a person or a system. The client uses external plug-ins to interface
    with the microkernel.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# Architectural Patterns - Part 1


    # Chapter 6


    +   - **Internal plug-ins**: The internal plug-ins are called by the microkernel
    when their specific services are required. They are internal to the microkernel,
    so the microkernel controls access to them.

    - **External plug-ins**: The external plug-ins are external to the microkernel,
    which means they can be accessed directly by the clients. The microkernel API
    empowers the external plug-ins to process client requests.

    - **Adap**: The adapters are used to create an interface between the client and
    external plug-ins. As previously indicated, these adapters permit external plug-ins
    to process client requests.


    This pattern results in tremendous extensibility and flexibility. Like object-oriented
    programming, each plug-in can be developed by different development teams, decreasing
    the overall development time.


    We will look at the following implementations of the microkernel architectural
    pattern:


    +   - Construction quote

    - Optical disk player


