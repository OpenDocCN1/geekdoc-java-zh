    # Understanding the layered pattern


    The layered architectural pattern decomposes a system so that it is layered into
    subtasks. A system''s layers have a defined set of responsibilities, specific
    to the implementation. This is a commonly used pattern and can be found in most
    robust systems, especially those that take advantage of distributed computing,
    such as cloud computing or cloud storage.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Architectural Patterns - Part 1


    The layered pattern is core to much modern computing infrastructure. The International
    Standards Organization (ISO) Open Systems Interconnection (OSI) has a seven-layer
    model. This OSI model has been widely implemented and remains relevant in modern
    software architectures.


    You can learn more about the ISO OSI seven-layer model from Microsoft''s online
    documentation at https://docs.microsoft.com/en-us/windows-hardware/drivers/network/windows-network-architecture-and-the-osi-model.


    The seven-layer model consists of two parallel stacks, each with seven layers.
    The bottom-most layer is a physical layer with direct communication between the
    two stacks. The stacks in the following list, in top-down order, represent the
    communication between two computers:


    +   * Application

    * Presentation

    * Session

    * Application

    * Network

    * Data link

    * Physical


    Here are a few key concepts about these layers:


    +   * A change to one layer does not impact other layers

    * Layers can have different protocols

    * Each layer has unique responsibilities

    * Calls between layers flow downward


    We will look at the following implementations of the layered architectural pattern:


    +   * Traditional operating system layers

    * Mobile operating system layers

    * Business application layers'
  merge: -1
