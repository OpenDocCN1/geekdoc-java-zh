    # Understanding the master–slave pattern


    The master–slave architectural pattern is used to improve system reliability and
    performance by dividing work between the master and slave components. Each component
    has distinct responsibilities. All slave components have identical or at least
    similar work, and that work must be defined prior to runtime. This pattern is
    not a divide-and-conquer approach to architecture; rather, it is one where the
    slaves'' work is predefined and must be coordinated. The goal of the master–slave
    architectural pattern is to improve software efficiency.


    The following diagram provides an overview of how the master–slave architectural
    pattern works. There are one or more Clients that can submit requests or initiate
    events with the Master:'
  merge: -1
  pgno: 210
- img_proc: true
  md: '![](img/bcdf8abab5e2de6d67770104d49e5070_211_0.png)


    The master performs the following functions:


    +   * Maintains a list of slaves

    * Divides the work

    * Tasks slaves

    * Accepts completed work from slaves

    * Compiles results

    * Provides feedback to clients


    Distributing the workload among multiple slaves inherently results in **greater
    efficiency**. Processing multiple workloads at the same time is referred to as
    **parallel processing**. Another benefit of this pattern is that changes to the
    slaves do not impact the master. The same is true when a master needs to be updated—the
    slaves are not impacted.


    We will now look at the following implementations of the master–slave architectural
    pattern:


    +   * Single client example

    * Cloud storage example'
