    | main() |


    | Mattress | << interface >> | MattressFactory |

    | mattressSize | MattressInterface | size |

    | mattressFirmness | | numberOfMattresses(

    | Mattress() | | getFactoryMattress()

    | setMattressFirmness() |

    | print() |


    Illustrated, the MattressDriver class—flyweight design pattern implementation
    is used to drive the application and contains the main() method.'
