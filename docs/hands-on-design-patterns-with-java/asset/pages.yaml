  md: '# Input-Multiple Maps-Reduce-Output


    The Input-Multiple Maps-Reduce-Output implementation of the MapReduce functional
    design pattern is similar to the Input-Map-Reduce-Output implementation. With
    multiple maps, there would be multiple sources of input, each with different formats.


    An overview of the workflow is illustrated in this diagram:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_262_0.png)


