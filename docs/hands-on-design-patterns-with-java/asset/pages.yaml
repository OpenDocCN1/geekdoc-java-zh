- img_proc: true
  md: '# Reactive Design Patterns


    # Chapter 9


    To implement the fan-out and quickest-reply design pattern, we send each request
    to multiple processing modules. Each of those modules would process the request
    and send the results back to the requestor. The requestor would use the quickest
    reply, the first received, and simply ignore the rest:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_309_0.png)


    Fan-out and quickest-reply design pattern


    As you would expect, the extra processing could make it a costly use of resources,
    so this approach should only be used when quick replies are of utmost importance.


    This section provided an overview of the fan-out and quickest-reply design pattern.


    # Understanding the idempotency design pattern


    In computer science, the term idempotent means an element whose value remains
    unchanged after repeated calculation. Consider the example of a hospital information
    system that adds one day to the length of stay for a patient record. It would
    be important that the system performs the addition the first time and ignore other
    requests within the calendar day.


    To provide an example of this design pattern, we will create a hospital information
    system that maintains patient records. Each time an event occurs with a patient,
    a message is sent to update the number of days the patient has been in the hospital.
    It is important that we not count the patient as being at the hospital more than
    once per day, to avoid overcharges.'
