    # Introducing behavioral design patterns


    In Chapter 1, Unified Modeling Language Primer, we learned behavioral diagrams
    illustrate how system components interact to form a system. We examined the following
    behavioral diagrams—activity diagram, interaction diagram, state Machine diagram,
    and use case diagram. It follows that behavioral design patterns are focused on
    the interaction of objects and classes in a system. The key component here is
    the interaction, also referred to the communication between objects and classes.


    The twelve behavioral design patterns presented in this chapter can be grouped
    into two subcategories—those that focus on classes and those that focus on objects.
    The following table details the subcategories:


    | Object Scope | Class Scope |

    | :--- | :--- |

    | Chain of responsibility pattern | Interpreter pattern |

    | Command pattern | Template method pattern |

    | Iterator pattern | |

    | Mediator pattern | |

    | Memento pattern | |

    | Null object pattern | |

    | Observer pattern | |

    | State pattern | |

    | Strategy pattern | |

    | Visitor pattern | |


    The behavioral design patterns listed in the preceding table are detailed in the
    remaining sections of this chapter. They are presented in alphabetical order to
    illustrate that one is not more important than the others. Here is a brief description
    of each design pattern''s applicability to the behavioral design category. These
    are further detailed in subsequent sections of this chapter:


    +   - **Chain of responsibility pattern**: An object submits a request to multiple
    objects without knowing which object will handle the request'
