  md: '# Behavioral Design Patterns


    # Chapter 3


    +   * **Command pattern**: Permits the sending of requests without knowing details
    about the receiver or even what is requested

    * **Interpreter pattern**: Used to establish a grammatical representation and
    an interpreter that interprets language

    * **Iterator pattern**: Grants access to an object''s members without sharing
    the encapsulated data structures

    * **Mediator pattern**: Used to permit object interactions without explicit object
    references

    * **Memento pattern**: Saves an object''s current internal state as a memento
    so that it can be referred to and restored to

    * **Null pattern**: Negates the need to search for the null condition

    * **Observer pattern**: Updates subscriber objects when a change is made to the
    publisher object''s state

    * **State pattern**: Allows an object to change its behavior based on internal
    state

    * **Strategy pattern**: Allows us to individually encapsulate a set of interchangeable
    algorithms

    * **Template method pattern**: Involves creating an algorithm template with processing
    steps relegated to child classes

    * **Visitor pattern**: Performs operations on an object without altering its structure


    # # Understanding the chain of responsibility pattern


    The purpose of the chain of responsibility design pattern involves senders and
    receivers. Specifically, the chain of responsibility design pattern calls for
    the decoupling of the sender and receiver. Objects can be sent to a series of
    receivers without the sender being concerned about which receiver handles the
    request. The request is sent along a chain of receivers and only one of them will
    process the request. Let''s look at some examples of this.


    Consider a large customer service agency that handles thousands of incoming emails
    each day. Instead of having a person or personally review each one to determine
    which department should process the email, we can write a Java program using the
    chain of responsibility design pattern to send the emails along the chain so that
    they are processed by the appropriate department.


