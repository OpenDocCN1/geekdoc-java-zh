    # # Understanding the pipe-filter pattern


    The pipe-filter, or pipe and filter, architectural pattern is a robust architecture
    that can contain any number of filters. The pattern starts by taking data from
    multiple sources and then passes them through sequential filters to transform
    the data from one format to another. The filters are connected via pipes. The
    next diagram shows an overview of the pipe-filter pattern with three sequential
    filters:


    ![](img/bcdf8abab5e2de6d67770104d49e5070_232_1.png)'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Architectural Patterns - Part II


