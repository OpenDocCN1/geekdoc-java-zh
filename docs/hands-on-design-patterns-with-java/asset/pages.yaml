  md: '# Behavioral Design Patterns


    # Chapter 3


    Another example is a call center. Many call centers now ask the caller to briefly
    describe what they are calling and then the caller is placed in a queue. The caller''s
    brief descriptions are recorded and then analyzed for key words. The calls are
    routed along the chain and then processed by the appropriate agent. In cases an
    agent receives a call that is not appropriate for them, say it is regarding billing
    and the agent handles shipping, then the caller can be sent further down the chain.


    We will further explore third example that involves incoming emails to a university.
    The university has several functional areas and wants to ensure the emails are
    routed to the appropriate team. We will look at use case, UML class diagram, and
    the source code necessary to implement the chain of responsibility design pattern
    for this scenario.


    # Use case


    To demonstrate the chain of responsibility design pattern, we will use the university
    email scenario briefly mentioned in the previous section. For our example, we
    design a system that takes incoming emails and searches for specific keywords
    to help determine which university team the email should be routed to. We will
    account for the following:


    | Keywords | University Team | Java Handler |

    |---|---|---|n| academic | Academic Team | AcademicEmailHandler () |

    | alumni, transcript | Alumni Affairs | AlumniEmailHandler () |

    | advising, schedule, course | Advising Staff | AdvisingEmailHandler () |

    | financial, student, tuition | Finance Staff | FinanceEmailHandler () |

    | career, job, faculty | Human Resources | HREmailHandler () |

    | other | Admin Team | AdminEmailHandler () |


    As you can see from the table, we identified handler classes to be implemented
    in Java. Having individual handlers for each type of email request will improve
    our application''s efficiency.'
