    \ which inherits from Vehicle, which inherits from Object:\n\n![](img/bcdf8abab5e2de6d67770104d49e5070_55_0.png)\n\
    \nFor our Bicycle class to work with the intended hierarchy, we created classes\
    \ for Vehicle and TwoWheeled. Here are those classes:\n\n```\npublic class Vehicle\
    \ {\n}\npublic class TwoWheeled extends Vehicle {\n}\n```\n\nThe Vehicle and TwoWheeled\
    \ classes do not offer anything to the Bicycle class. Normally, each would have\
