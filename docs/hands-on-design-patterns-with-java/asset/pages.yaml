  md: '# Message-driven


    The fourth characteristic of reactive design patterns is that they are message-driven.
    This characteristic means that reactive design systems have a reliance on the
    messages that are passed between system components. This message passing is asynchronous
    and enables a system to isolate system failures. The strong reliance on message
    passing enables elasticity, node-control, and processing load control.


    We will highlight the message-driven nature of the reactive design patterns featured
    in this chapter.


    > The four characteristics of reactive design patterns (responsive, resilient,
    elastic, and message-driven) are also the four principles of reactive programming
    and reactive design patterns.


    Each of the reactive design patterns in this chapter can be assigned to one or
    more of the four characteristics defined previously.


    The following table provides that categorical grouping:


    | Responsive | Resilient | Elastic | Message-driven |

    | Asynchronous communication | Bounded queue | Autoscaling | Event-driven communication
    |

    | Caching | Bulkhead | Self-contained | Idempotency |

    | Fail-fast | Circuit breaker | Stateless | Publisher-subscriber |

    | Fan-out and quickest reply | Failure-handling Monitoring | |


    Reactive design pattern groupings


    The reactive design features in the remainder of this chapter are presented in
    alphabetical order to illustrate that one is not more important than the others.'
