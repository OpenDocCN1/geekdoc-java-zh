    illustrates the data flow and the utility of the pipes connecting the filters:


    | Original Data | Filter 1 | Pipe | Filter 2 | Pipe | Filter 3 | Transformed Data
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | read data | | write data | | read data | write data | | read data | | filter
    |


    Pipe-filter pattern—UML sequence diagram


    In the next sections, we will explore the following example implementations of
    the pipe-filter architectural pattern:


    +   * Simple transformation

    * Complex transformation


    # Simple transformation example implementation


    A simple transformation of data might consist of collecting data from various
    sources, each in a different format, passing it through two filters before the
    data is considered final. An example would be data sources from different systems
    or in different languages. In order for any business logic to process the data,
    it must first be transformed into a common, standard format expected by the system.'
