    \     onClick={() => onDismiss(item.objectID)}\n          className=\"button-inline\"\
    \n        >\n          Dismiss\n        </Button>\n      </span>\n    </div>\n\
    \  ))\n</div>>)\n```\n\nThe style is inlined now. You could define style objects\
    \ outside of elements to make it cleaner.\n\n# Code Playground\n\n```javascript\n\
    const largeColumn = {\n  width: '40%',\n}\n```\n\n```javascript\nconst midColumn\
    \ = {\n  width: '30%',\n}\n```\n\n```javascript\nconst smallColumn = {\n  width:\
    \ '10%',\n}\n```\n\nAfter that you would use them in your columns: `<span style={smallColumn}>`.\n\
    \nIn general, you will find different opinions and solutions for style in React.\
    \ You used pure CSS and inline style now. That’s sufficient to get started. I\
    \ don't want to be opinionated, but I want to leave you some options. You can\
    \ read them and apply them on your own. But if you are new to React, I would recommend\
    \ to stick to pure CSS and inline style for now.\n\n- styled-components\n- Modules\n\
    \nYou have learned the basics to write your own application! Let's recap the last\
    \ chapters:\n\n- React\n- setState() to manage your internal state\n- pass functions\
    \ or class methods to your handler\n- forms and events in React to add interactions\n\
    - unidirectional data flow is an important concept in React\n- controlled components\n\
    - compose with children and reusable components\n- usage and implementation of\
    \ ES6 class components and functional components\n- approaches to style components\n\
    - ES6\n- functions that are bound to class methods\n- destructuring of objects\
    \ and arrays\n- default parameters\n- General\n- higher-order functions\n\nAgain\
    \ it makes sense to take a break. Internalize the learnings and apply them on\
    \ your own. You can experiment with the source code you have written far. You\
    \ can find the source code in the official repository: https://github.com/the-road-to-learn-react/hackernews-client/tree/5.2\n\
    \n# Getting Real with an API\n\nNow it's time to get real with an API because\
    \ it can get boring to deal with sample data. If you are not familiar with APIs,\
    \ I encourage you to read where I got know it's a great aggregator over tech topics.\
    \ In this book, you will use the Hacker News API to fetch stories from the platform.\
    \ There is a basic API to get data from the platform. The latter makes sense in\
    \ the case of this application to search on Hacker News. You can visit the API\
    \ specification to get an understanding of the data structure.\n\n- https://www.robinwieruch.de/what-is-an-api-javascript\n\
    - https://news.ycombinator.com/\n- https://github.com/HackerNews/API\n- https://hn.algolia.com/api\n\
    \n# Lifecycle Methods\n\nYou will need to know about React lifecycle methods before\
    \ you can start to fetch data in your components using an API. These methods hook\
    \ into the lifecycle of a React component. They can be used in ES6 class components,\
    \ but not in functional components.\n\nDo you remember when a previous chapter\
    \ taught you about JavaScript ES6 classes and how they are used in React? Apart\
    \ from the render() method, there are several methods that can be overridden in\
    \ a React ES6 class component. All of these are the lifecycle methods. Let's dive\
    \ into them:\n\nYou already know two lifecycle methods that can be used in an\
    \ ES6 class component: `constructor()` and `render()`.\n\nThe constructor is only\
    \ called when an instance of the component is created and inserted into the DOM.\
    \ The component is mounted. The render() method is called during the mount process,\
    \ but also when the component updates. Each time the state or the props of a component\
    \ change, the render() method of the component is called.\n\nNow you know more\
    \ about the two lifecycle methods and when they are called. You already know them\
    \ as well. But there are more of them.\n\nThe mounting of a component has two\
    \ lifecycle methods: `componentWillMount()` and `componentDidMount()`. The constructor\
    \ is called first, `componentWillMount()` gets called before the render() method\
    \ and `componentDidMount()` is called after the render() method.\n\nOverall the\
    \ mounting process has 4 lifecycle methods. They are invoked in the following\
    \ order:\n\n- `constructor()`\n- `componentWillMount()`\n- `render()`\n- `componentDidMount()`\n\
    \nBut what about the update lifecycle of a component that happens when the state\
    \ or the props change? Overall it has 5 lifecycle methods in the following order:\n\
    \n- `componentReceiveProps()`\n- `shouldComponentUpdate()`\n- `componentWillUpdate()`\n\
    - `render()`\n- `componentDidUpdate()`\n\n# Getting Real with an API\n\nLast but\
    \ not least there the unmounting lifecycle. It has only one lifecycle method:\
    \ `componentWillUnmount()`.\n\nAfter all, you don't need to know all of these\
    \ lifecycle methods from the beginning. It can be intimidating yet you will not\
    \ use all of them. Even in a React application you will only use a few of them\
    \ around `constructor()` and the `render()` method. Still, it is good to know\
    \ that each lifecycle method can be used for specific cases:\n\n- **constructor(props)**\
    \ - It is called when the component gets initialized. You can set an initial component\
    \ state and bind class methods during that lifecycle method.\n- **componentWillMount()**\
    \ - It called before the `render()` lifecycle method. That's why it could be used\
    \ to set internal component state, because it will trigger a rendering of the\
    \ component.\n- **render()** - This method is mandatory and returns the elements\
    \ as output of the component. The method should be pure and therefore shouldn't\
    \ modify the component state. It gets input as props.\n- **componentDidMount()**\
    \ It is called only when the component mounted. The perfect time to do an asynchronous\
    \ request to fetch data from API. The fetched data would get stored in the internal\
    \ state to display it in the `render()` lifecycle method.\n- **componentReceiveProps(nextProps)**\
    \ - The lifecycle method is called during update lifecycle. As you get the next\
    \ props, you can diff the next props with the previous props, using this props,\
    \ to apply a different behavior. Additionally, you can set state on the next props.\n\
    - **shouldComponentUpdate(nextProps, nextState)** - It is always called when the\
    \ component updates to state or props. You will use it in React applications for\
    \ performance optimizations. Depending on a boolean that you return from this\
    \ lifecycle, the component and all its children will render or not render on an\
    \ update lifecycle. You can prevent the render method of a component.\n- **componentWillUpdate(nextProps,\
    \ nextState)** - The lifecycle method is immediately invoked before the `render()`\
    \ method. You have the next props and state at your disposal. You can use the\
    \ method as last opportunity to perform preparations before the render method\
    \ gets executed. Note that you cannot trigger `setState()` anytime. If you want\
    \ to compute state on the next props, you have to use componentWillReceiveProps().\n\
    - **componentDidUpdate(prevProps, prevState)** - The lifecycle method is immediately\
    \ invoked after the `render()` method. You can use it as opportunity to perform\
    \ DOM operations or to perform further asynchronous requests.\n- **componentWillUnmount()**\
    \ - It is called before you destroy your component. You can use the lifecycle\
    \ method to perform any cleanup tasks.\n\nThe `constructor()` and `render()` lifecycle\
    \ methods are already used by you. These are commonly used lifecycle methods for\
    \ ES6 class components. Actually the `render()` method is required, otherwise\
    \ you wouldn't return a component instance.\n"
