    # Taming the State


    The previous chapters have shown you that state management can be a crucial topic
    in larger applications. In general, not only React but lot of SPA frameworks struggle
    with it. Applications get more complex in the recent years. One big challenge
    in web applications nowadays is to tame and control the state.


    Compared to other solutions, React already made a big step forward. The unidirectional
    data flow and a simple API to manage state in component are indispensable. These
    concepts make it easier to reason about your state and your state changes. It
    makes it easier to reason about it on a component level and to a certain degree
    on an application level.


    In a growing application, it gets harder to reason about state changes. You can
    introduce bugs by operating on state when using an object over function in setState().
    You have to lift state around share necessary or hide unnecessary state across
    components. It can happen that a component is far away in the component tree and
    its sibling depends on. Perhaps you have to share the state across the whole component
    tree. In conclusion components get involved to a greater extent in state management.
    But after all, the main responsibility of components should be representing the
    UI, shouldn''t it?


    Because of all these reasons, there exist standalone solutions to take care of
    the state management. A powerful place. You can use different solutions to solve
    your problems. To address the problem of scaling state management, you might have
    heard of the libraries Redux¹³⁷ or MobX¹³⁸. You can use either of these solutions
    in a React application. With them, come with extensions, react-redux¹³⁹ and mobx-react¹⁴⁰,
    integrate them into the React view layer.


    Redux and MobX are outside the scope of this book. When you have finished the
    book, you will get guidance on how you can continue to learn React and its ecosystem.
    One learning path could be learn React. Before you dive into the topic of external
    state management, I can recommend to read this article¹⁴¹. It aims to give you
    a better understanding of how to learn external state management.


    # Exercises:


    +   - read about external state management and how to learn it¹⁴²

    - check out my second ebook about state management in React¹⁴³


    ¹³⁷ https://redux.js/docs/introduction/

    ¹³⁸ https://mobx.js/

    ¹³⁹ https://github.com/reactjs/react-redux

    ¹⁴⁰ https://github.com/mobjs/mobx-react

    ¹⁴¹ https://www.robinwierch.de/redux-mobx-confusion/

    ¹⁴² https://www.robinwierch.de/redux-mobx-confusion/

    ¹⁴³ https://roadoreact.com/'
