    \  return {\n    ...results,\n    [searchKey]: { hits: updatedHits, page }\n \
    \   isLoading: false\n  };\n};\n\nclass App extends Component {\n  ...\n};\n```\n\
    \nThat's it. The function over an object approach in setState() fixes potential\
    \ bugs yet increases readability and maintainability of your code. Furthermore,\
