    \n[content]\n## Installation\n\nThere are multiple approaches to get started with\
    \ a React application.\n\nThe first one is to use a CDN. That may sound more complicated\
    \ than it is. A CDN is a [content delivery network*](https://en.wikipedia.org/wiki/Content_delivery_network*).\
    \ Several companies have CDNs that host files publicly for people to consume them.\
    \ These files can be libraries like React, because after all the bundled React\
    \ library is only a react.js JavaScript file. It can be hosted somewhere and where\
    \ you include in your application.\n\nHow to use a CDN to get started in React?\
    \ You can inline the `<script>` tag in your HTML that points to a CDN URL. To\
    \ start in React you need two files (libraries): `react` and `react-dom`.\n\n\
    ## Code Playground\n\n```\n<script crossorigin src=\"https://unpkg.com/react@16/umd/react.development.js\"\
    ></script>\n<script crossorigin src=\"https://unpkg.com/react-dom@16/umd/react-dom.development.js\"\
    ></script>\n```\n\nBut why should you use a CDN when you have npm to install packages\
    \ like React?\nWhen your application uses a `package.json` file, you can install\
    \ `react` and `react-dom` from the command line. The requirement is that the folder\
    \ is initialized as npm project by using `npm init -y` with a `package.json` file.\
    \ You can install multiple node packages in one line with npm.\n\n## Command Line\n\
    \n```\nnpm install react react-dom\n```\n\nThat approach is often used to add\
    \ React to an existing application that is managed with npm.\nUnfortunately that's\
    \ not everything. You would have to deal with [Babel^45](https://babeljs.io/)\
    \ to make your application of JSX (the React syntax) and JavaScript ES6. Babel\
    \ transpiles your code so that browsers can interpret JavaScript ES6 code and\
    \ JSXX. Not all browsers are capable of interpreting the syntax. The setup includes\
    \ a lot of configuration and tooling. It can be overwhelming for React novices\
    \ to both with all the configuration.\n\nBecause of this reason, Facebook introduced\
    \ `create-react-app` as a zero-configuration React solution. The next chapter\
    \ will show you how to set up your application using this bootstrapping tool.\n\
