    }\n```\n\n现在你可以使用 API 的当前页码。扩展该功能以添加新数据，而不是覆盖它。练习：\n\n- 阅读分页事件：react.dev/docs/events\n\
    - 实验分页数据：algolia.com/api\n- 使用默认参数：reactjs.org/docs/html\n\n## 分页获取\n\nsrc/App.js\n\
    \n```\nconst DEFAULT_QUERY = 'query';\nconst PATH_BASE = 'api/';\nconst PATH_SEARCH\
