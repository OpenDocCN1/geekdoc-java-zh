    # Outline


    tooling around it. It enables you to set up your project without create-react-app.
    I can recommend to follow a minimal setup with Webpack and Babel¹158. Afterward,
    you can apply more tooling on your own. For instance, you could use ESLint¹159
    to follow a unified code style in your application.


    - **React Component Syntax:** The possibilities and best practices to implement
    React components evolve over time. You will find many ways to write your React
    components, especially React components, in other learning resources. You can
    checkout this GitHub repository¹160 to find out an alternative to write React
    class components. By using the field declarations, you can write them even more
    concise in the future.


    - **Other Projects:** After learning React, it is always good to apply the learnings
    in your projects before learning something new. There are plenty of tutorials
    that you can use only React to build something exciting like tic-tac-toe or a
    simple calculator in React. Check out about building a paginated and infinite
    scrolling list¹161 or connecting your React to Stripe for charging money¹162.
    Experiment with these mini applications to get comfortable in React.


    - **UI Components:** You shouldn''t make the mistake to introduce too early a
    UI library in your project. You should first learn how to implement and use a
    dropdown, checkbox or dialog in React with standard HTML elements from scratch.
    The major part of these components will manage their own state. A checkbox has
    to know whether it is checked or not checked. You should implement them as controlled
    components. After you went through all the foundational implementations, can introduce
    a UI library which uses checkboxes and dialogs as React components.


    - **Code Organization:** When reading the book, you may come across one chapter
    about code organization. You could apply these changes now, if you haven''t done
    it. It will help you organize your projects in structured files and folders (modules).
    In addition, it helps you to understand and learn the principles of code splitting,
    reusability, maintainability and module API design. Eventually your application
    will grow in size and you will need to structure it in modules. So it''s better
    you got started now.


    - **Testing:** The book only scratched the surface of testing. If you are not
    familiar with the general topic, you could dive deeper into the concepts of unit
    testing and integration testing, in context of React applications. On an implementation
    level, I would recommend to stick to Enzyme and Jest to refine your approach of
    testing with unit and snapshot tests in React.


    - **Routing:** You can implement routing for your application with react-router¹164.
    So far, you only have one page in your application. React Router helps you to
    have multiple pages across URLs. When you introduce routing to your application,
    you can not make any requests to your web server to request the next page. The
    router will do everything for you on the client-side. Get your hands dirty and
    introduce routing in your application.


    - **Type Checking:** In one chapter, you have used React PropTypes to define component
    interfaces. It is a general good practice to prevent bugs. But the PropTypes are
    only checked on runtime. You can go one step further to introduce static type
    checking on compile time. TypeScript¹165 is one popular approach. But in the React
    ecosystem, people often use Flow¹166, I recommend to give a shot, if you are interested
    to make your application more robust.


    - **React Native:** React Native¹167 brings your application on mobile devices.
    You can apply your learnings from React to iOS and Android applications. The learning
    curve, once you have learned React, shouldn''t be steep in React Native. Both
    share the same principles. You will only encounter different layouts of mobile
    components than what are used in web applications.


    In general, I invite you to visit my website¹168 to find more interesting topics
    about web development and software engineering. You can subscribe to my Newsletter¹169
    to get updates about articles, books, and courses. Furthermore the course platform
    Road to React¹170 offers more advanced courses to learn about the React ecosystem.
    You should check it out!


    Last but not, I hope to find more Patrons¹171 who are able to support my content.
