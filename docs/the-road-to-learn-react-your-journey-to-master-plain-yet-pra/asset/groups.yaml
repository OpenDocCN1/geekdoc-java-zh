    \        </form>\n        {this.state.list.filter(...).map(item =>\n         \
    \ \n        ))}\n      </div>\n    );\n  }\n}\n```\n\nLet's approach the filter\
    \ function in a different way this. We want to define the filter argument, the\
    \ function that is passed to the filter function, outside of the ES6 class component.\
    \ We don't have access to the state of the component and thus we have no access\
    \ to the searchTerm property to evaluate the filter condition. We have to pass\
    \ the searchTerm to the filter function and have to return a new function to evaluate\
    \ the condition. That's called a higher-order function.\n\nNormally I wouldn't\
    \ mention higher-order functions, but in a React book it makes total sense. It\
    \ makes sense to know about higher-order functions, because React deals with a\
    \ concept called higher-order components. You will get to know the concept later\
    \ in the book. Now again, let's focus on the filter functionality.\n\nFirst, you\
    \ have to define the higher-order function outside of your App component.\n\n\
    ### src/App.js\n\n```javascript\nfunction isSearched(searchTerm) {\n  return function(item)\
    \ {\n    // some condition which returns true or false\n  }\n}\n\nclass App extends\
    \ Component {\n  ...\nn\n```\n\nThe function takes the searchTerm and returns\
    \ another function, after all the filter function takes a function as its input.\
    \ The returned function has access to the item object it is the function that\
    \ is passed to the filter function. In addition, the returned function will be\
    \ used to filter the list based on the condition defined in the function. Let's\
    \ define the condition.\n\n### src/App.js\n\n```javascript\nfunction isSearched(searchTerm)\
    \ {\n  return function(item) {\n    return item.title.toLowerCase().includes(searchTerm.toLowerCase());\n\
    \  }\n}\n```\n\nThe condition says that you match the incoming searchTerm pattern\
    \ with the title property of the item from your list. You can do that with the\
    \ built-in JavaScript functionality. Only when the pattern matches, you return\
    \ true and the item stays in the list. When the pattern doesn't match the item\
    \ is removed from the list. Be careful with pattern matching: You shouldn't forget\
    \ to lower case strings. Otherwise there will be mismatches between a search term\
    \ 'redux' and an item title 'Redux'. Since we are working on an immutable list\
    \ and return a new list using the filter function, the original list in the local\
    \ state is not modified at all.\n\nOne thing is left to mention: We cheated a\
    \ bit by using the built-in includes JavaScript functionality. It is already an\
    \ ES6 feature. How would that look in JavaScript ES5? You would use the `indexOf()`\
    \ function to get the index of the item in the list. When the item is in the list,\
    \ `indexOf()` will return its index in the array.\n\n## Code Playground\n\n//\
    \ ES5\n\n```javascript\nstring.indexOf(pattern) !== -1\n```\n\n// ES6\n\n```javascript\n\
    string.includes(pattern)\n```\n\nAnother neat refactoring can be done with an\
    \ ES6 arrow function again. It makes the function more concise:\n\n## Code Playground\n\
    \n// ES5\n\n```javascript\nfunction isSearched(searchTerm) {\n  return function(item)\
    \ {\n    return item.title.toLowerCase().indexOf(searchTerm.toLowerCase()) ===\
    \ -1;\n  }\n}\n```\n\n// ES6\n\n```javascript\nconst isSearched = searchTerm =>\
    \ item =>\n  item.title.toLowerCase().includes(searchTerm.toLowerCase());\n```\n\
    \nOne could argue which function is more readable. Personally I prefer the second\
    \ one. The React ecosystem uses a lot of functional programming concepts. It happens\
    \ often that you will use a function that returns a function (higher-order function).\n\
    \n## Basics in React\n\n### src/App.js\n\n```javascript\nclass App extends Component\
    \ {\n  ...\n\n  render() {\n    return (\n      <div className=\"App\">\n    \
    \    <form>\n          <input\n            type=\"text\"\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        {this.state.list.filter(...).map(item\
    \ =>\n          \n        ))}\n      </div>\n    );\n  }\n}\n```\n\nWait, the\
    \ OCR text has some repetitions and artifacts. Let me re-clean the final logical\
    \ flow based on the provided text.\n\nThe search functionality should work. Try\
    \ it yourself.\n\n## Exercises:\n\n- read more about React events\n- read more\
    \ about higher-order functions\n\n## ES6 Destructuring\n\nThere is a way in JavaScript\
    \ ES6 for easier access to objects and arrays. It's called destructuring. Compare\
    \ the following snippet in ES5 and ES6.\n\nCode Playground\n\n```javascript\n\
    const user = {\n  firstname: 'Robin',\n  lastname: 'Wieruch'\n}\n\n// ES5\nvar\
    \ firstname = user.firstname;\nvar lastname = user.lastname;\n\nconsole.log(firstname\
    \ + ' ' + lastname);\n// output: Robin Wieruch\n\n// ES6\nconst { firstname, lastname\
    \ } = user;\n\nconsole.log(firstname + ' ' + lastname);\n// output: Robin Wieruch\n\
    ```\n\nWhile you have to add an extra line each time you want to access an object\
    \ property in ES5, you can do it in one line in ES6. A best practice for readability\
    \ is to use multilines when you destructure an object into properties.\n\nCode\
    \ Playground\n\n```javascript\nconst {\n  firstname,\n  lastname\n} = user;\n\
    ```\n\nThe same goes for arrays. You can destructure them too. Again, multilines\
    \ will keep your code scannable and readable.\n\n## Basics in React\n\n### Code\
    \ Playground\n\n```javascript\nconst users = ['Robin', 'Andrew', 'Dan'];\nconst\
    \ [\n  userOne,\n  userTwo,\n  userThree\n] = users;\n\nconsole.log(userOne, userTwo,\
    \ userThree);\n// output: Robin Andrew Dan\n```\n\nPerhaps you have noticed that\
    \ the local state in the App component can get destructured the same way. You\
    \ can shorten the filter and map line of code.\n\n```javascript\nsrc/App.js\n\
    ```\n\n```javascript\nrender() {\n  const { searchTerm, list } = this.state;\n\
    \  return (\n    <div className=\"App\">\n      ...\n      {list.filter(isSearched(searchTerm)).map(item\
    \ =>\n        ...\n      )}\n    </div>\n  );\n}\n```\n\nYou can do it ES5 or\
    \ ES6 way:\n\n## Code Playground\n\n```javascript\n// ES5\nvar searchTerm = this.state.searchTerm;\n\
    var list = this.state.list;\n```\n\n```javascript\n// ES6\nconst { searchTerm,\
    \ list } = this.state;\n```\n\nBut since the book uses JavaScript ES6 most of\
    \ the time, you should stick to it.\n\n## Exercises:\n\n- read more about ES6\
    \ destructuring\n"
