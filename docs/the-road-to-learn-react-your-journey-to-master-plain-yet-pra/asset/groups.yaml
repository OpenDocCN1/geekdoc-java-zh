    \     <h2>{helloWorld}</h2>\n      </div>\n    );\n  }\n}\n\nexport default App;\n\
    ```\n\nIntroduction to React\n\nIt should work when you start your application\
    \ on the command line with `npm start` again.\n\nAdditionally you might have noticed\
    \ the `className` attribute. It reflects the standard class attribute in HTML.\
    \ Because of technical reasons, JSX had to replace a handful of internal HTML\
