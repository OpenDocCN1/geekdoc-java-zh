    \ They all follow the camelCase convention. On your way to learn React, you will\
    \ come across some more JSX attributes.\n\n# Exercises:\n\n- define more variables\
    \ and render them in your JSX\n- use a complex object to represent a user with\
    \ a first name and last name\n- render the user properties in your JSX\n- read\
