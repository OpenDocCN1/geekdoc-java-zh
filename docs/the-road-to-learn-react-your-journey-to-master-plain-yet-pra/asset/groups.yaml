    \ 函数进行防抖（延迟）并省去按钮，但这现在会增加复杂性，可能不是你想要的效果。让我们保持简单，暂时不使用防抖。\n\n首先，将 `onSearchSubmit()`\
    \ 方法传递给你的 Search 组件。\n\nsrc/App.js\n\n```\nclass App extends Component {\n  ...\n\
    \n  render() {\n    const { searchTerm, result } = this.state;\n    return (\n\
