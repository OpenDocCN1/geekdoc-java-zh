  - "[PAGE 81]\n\n# Reusable Components\n\nReusable and composable components empower\
    \ you to come up with capable component hierarchies. They are the foundation of\
    \ React's view layer. The last chapters mentioned the term reusability. You can\
    \ reuse the Table and Search components by now. Even the App component is reusable,\
    \ because you could instantiate somewhere else again.\n\nLet's define one more\
    \ reusable component, a Button component, which gets reused more often eventually.\n\
    \nsrc/App.js\n\n```\nclass Button extends Component {\n  render() {\n    const\
    \ {\n      onClick,\n      className,\n      children,\n    } = this.props;\n\n\
    \    return (\n      <button\n        onClick={onClick}\n        className={className}\n\
    \        type=\"button\"\n      >\n        {children}\n      </button>\n    );\n\
    \  }\n}\n```\n\nIt might seem redundant to declare such a component type=\"button\"\
    . You will use a Button component instead of a button element. Except for the\
    \ type attribute you have to define everything else when you want to use the Button\
    \ component. But you have to think about the long term investment here. Imagine\
    \ you have several buttons in your application, but want to change an attribute,\
    \ style or behavior for the button. Without the component you would have to refactor\
    \ every button. Instead the Button component ensures to have only one source of\
    \ truth. One to refactor all buttons at once. One to rule them all.\n\nSince you\
    \ already have a button element, you can use the Button component instead. It\
    \ omits the type attribute, because the Button component specifies it."
