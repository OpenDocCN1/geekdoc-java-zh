- md: "\n## Client- or Server-side Search\n\nWhen you use the Search component with\
    \ its input field now, you will filter the list. That's happening on the client-side\
    \ though. You are now going to use the Hacker News API to search on the server-side.\
    \ Otherwise you would deal with the first API response which you got on componentDidMount()\
    \ with the default search term parameter.\n\nYou can define an onSubmit() method\
    \ in your App component which fetches results from the Hacker News API when executing\
    \ a search in the Search component.\n\nsrc/App.js\n\n```\nclass App extends Component\
    \ {\n  constructor(props) {\n    super(props);\n\n    this.state = {\n      result:\
    \ null,\n      searchTerm: DEFAULT_QUERY,\n    };\n\n    this.setSearchTopStories\
    \ = this.setSearchTopStories.bind(this);\n    this.onSearchChange = this.onSearchChange.bind(this);\n\
    \    this.onSearchSubmit = this.onSubmit.bind(this);\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n\n  ...\n\n  onSubmit() {\n    const { searchTerm } = this.state;\n  }\n\
    \n  ...\n}\n```\n\nThe onSubmit() method should use the same functionality as\
    \ the componentDidMount() lifecycle method, but this time with a modified search\
    \ term from the local state and not with the initial default search term. Thus\
    \ you can extract the functionality as a reusable class method.\n\n## Getting\
    \ Real with an API\n\nsrc/App.js\n\n```\nclass App extends Component {\n\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      result: null,\n      searchTerm:\
    \ DEFAULT_QUERY,\n    }\n\n    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n\
    \    this.fetchSearchTopStories = this.fetchSearchTopStories.bind(this);\n   \
    \ this.onSearchChange = this.onSearchChange.bind(this);\n    this.onSearchSubmit\
    \ = this.onSearchSubmit.bind(this);\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n\n  fetchSearchTopStories(searchTerm) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}${searchTerm}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n\n  componentDidMount() {\n    const { searchTerm\
    \ } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n  }\n\n  onSearchSubmit()\
    \ {\n    const { searchTerm } = this.state;\n    this.fetchSearchTopStories(searchTerm);\n\
    \  }\n}\n```\n\n## Getting Real with an API\n\nNow the Search component has to\
    \ add an additional button. The button has to explicitly trigger the search request.\
    \ Otherwise you would fetch data from the Hacker News API every time when your\
    \ input changes. But you want to do it explicitly in a `onClick()` handler.\n\n\
    As alternative you could debounce (delay) the onChange() function and spare the\
    \ button, but it would add more complexity at this time and maybe wouldn't be\
    \ the desired effect. Let's keep it simple without a debounce for now.\n\nFirst,\
    \ pass the onSearchSubmit() method to your Search component.\n\nsrc/App.js\n\n\
    ```\nclass App extends Component {\n  ...\n\n  render() {\n    const { searchTerm,\
    \ result } = this.state;\n    return (\n      <div className=\"page\">\n     \
    \   <div className=\"interactions\">\n          <Search\n            value={searchTerm}\n\
    \            onChange={this.onSearchChange}\n            onSubmit={this.onSearchSubmit}\n\
    \          />\n          <Search />\n        </div>\n        { result && (\n \
    \         <Table\n            list={result.hits}\n            pattern={searchTerm}\n\
    \            onDismiss={this.onDismiss}\n          />\n        )}\n      </div>\n\
    \    );\n  }\n}\n```\n\nSecond, introduce a button in your Search component. The\
    \ button has the type=\"submit\" and the form uses its onSubmit() attribute to\
    \ pass the onSubmit() method. You can reuse the children property, but this time\
    \ it will be used as the content of the button.\n\n## Getting Real with an API\n\
    \nsrc/App.js\n\n```\nconst Search = ({\n  value,\n  onChange,\n  onSubmit,\n \
    \ children\n}) => (\n  <form onSubmit={onSubmit}>\n    <input\n    type=\"text\"\
    \n    value={value}\n    onChange={onChange}\n    />\n  <button type=\"submit\"\
    >\n    {children}\n  </button>\n  </form>\n);\n```\n\nIn the Table, you can remove\
    \ the filter functionality, because there will be no client-side filter (search)\
    \ anymore. Don't forget to remove the isSearched() function as well. It will not\
    \ be used anymore. The result comes directly from the Hacker News API now after\
    \ you have clicked the \"Search\" button.\n\nsrc/App.js\n\n```\nclass App extends\
    \ Component {\n  ...\n  render() {\n    const { searchTerm, result } = this.state;\n\
    \    return (\n      <div className=\"page\">\n        { result &&\n        <Table\n\
    \          list={result.hits}\n          onDismiss={this.onDismiss}\n        />\n\
    \        }\n      </div>\n    );\n  }\n}\n```\n\nGetting Real with an API\n\n\
    ```\n}\n\n...\n\nconst Table = ({ list, onDismiss }) => (\n<div className=\"table\"\
    >\n  {list.map(item => (\n    ))}\n</div>\n```\n\nWhen you try to search, you\
    \ will notice the browser reloads. In HTML form you use preventDefault() to suppress\
    \ this behavior.\n\nsrc/App.js\n\n```\nonSearchSubmit(event) {\n  const { searchTerm\
    \ } = this.state;\n  this.fetchSearchTopStories(searchTerm);\n  event.preventDefault();\n\
    }\n```\n\nNow you can use the current page from the API. Let's extend the functionality\
    \ to add the new data rather than to override it. Exercises:\n\n- read about paginated\
    \ events: react.dev/docs/events\n- experiment with paginated data: algolia.com/api\n\
    - use the default parameter: reactjs.org/docs/html\n\n## Paginated Fetch\n\nsrc/App.js\n\
    \n```\nconst DEFAULT_QUERY = 'query';\nconst PATH_BASE = 'api/';\nconst PATH_SEARCH\
    \ = '/search';\nconst PARAM_PAGE = 'page=';\n```\n\nGetting Real with an API\n\
    \nsrc/App.js\n\n```\nclass App extends Component {\n  \n  fetchSearchTopStories(searchTerm,\
    \ page = 0) {\n    fetch(`${PATH_BASE}${PATH_SEARCH}${searchTerm}&${PARAM_PAGE}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n}\n```\n\nThe page uses ES6 default parameter\
    \ in case no argument is provided. Now you can use the current page from the API.\
    \ Let's extend the functionality to add the new data rather than to override it.\n\
    \nsrc/App.js\n\n```javascript\nclass App extends Component {\n  \n  render() {\n\
    \    const { searchTerm, result } = this.state;\n    const page = (result.page)\
    \ || 0;\n    return (\n      <div className=\"page\">\n        <div className=\"\
    interactions\">\n          ...\n          { result &&\n            <Table\n  \
    \            list={result.hits}\n              onDismiss={this.onDismiss}\n  \
    \          />\n          }\n        </div>\n      </div>\n    );\n  }\n}\n```\n\
    \n## Getting Real with an API\n\n```\n/>\n<div className=\"interactions\">\n \
    \ <Button onClick={() => this.fetchSearchTopStories(searchTerm, page + 1)}>\n\
    \    More\n  </Button>\n</div>\n);\n  }}\n```\n\n```javascript\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n\n  const oldHits = page === 0\n    ? this.state.hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  this.setState({\n    result: { hits: updatedHits, page }\n  });\n}\n```\n\n\
    A couple of things happen in the setSearchTopStories() method now. First, you\
    \ get the hits and page from the result.\n"
  mdcn: "\n\n## 客户端或服务器端搜索\n\n当你现在配合 `Search` 组件及其输入字段使用时，你将过滤列表。不过，这是发生在客户端的。现在你将使用\
    \ Hacker News API 在服务端进行搜索。否则，你将处理在 `componentDidMount()` 中获取的第一个 API 响应（带有默认搜索词参数）。\n\
    \n你可以在 App 组件中定义一个 `onSubmit()` 方法，当在 Search 组件中执行搜索时，它可以从 Hacker News API 获取结果。\n\
