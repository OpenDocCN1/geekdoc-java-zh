    ## Introduction to node and npm


    This chapter gives you an introduction to node and npm Both are used to manage
    libraries you will need along the way. In this book, you will install external
    node packages via npm (node package manager). These node packages can be libraries
    or frameworks.


    You can verify your versions of node and npm on the command line. If you don''t
    get any output in the terminal, you need to install node and npm first. These
    are only my versions during the time writing this book:


    ## Command Line


    ```

    node --version

    npm --version

    ```


    > ³⁸https://nodejs.org/

    > ³⁹https://www.zohwiearch.de/

    > ⁰https://www.zohwiearch.de/

    > ³¹https://www.zohwiearch.de/

