    - **UI 组件：** 你不应该犯过早在项目中引入 UI 库的错误。你应该首先学习如何使用标准 HTML 元素从零实现并使用下拉菜单、复选框或对话框。这些组件的大部分将管理它们自己的状态。复选框必须知道自己是否选中。你应该将其实现为受控组件。在你完成所有基础实现后，可以引入使用复选框和对话框作为
    React 组件的 UI 库。


    - **代码组织：** 在阅读本书时，你可能会遇到关于代码组织的章节。如果你还没有这样做，现在应用这些更改。它将帮助你通过结构化的文件和文件夹（模块）来组织项目。此外，它还能帮助你理解和学习代码分割、可重用性、可维护性和模块
    API 设计的原则。你的应用程序将会增大，你需要对其进行模块化结构处理。因此，现在开始会更好。


    - **测试：** 本书对测试仅浅了皮角。如果你不熟悉这个通用话题，可以深入研究 React 应用程序背景下的单元测试和集成测试概念。在实现层面，我建议坚持使用
    Enzyme 和 Jest，以完善你在 React 中通过单元测试和快照测试进行的方法。


    - **路由：** 你可以使用 [react-router¹164](https://github.com/ReactTraining/react-router)
    为你的应用程序实现路由。到目前，你的应用程序中只有一个页面。React Router 帮助你实现跨 URL 的多个页面。当你为应用程序引入路由时，你无法向
    Web 服务器发送请求来下一页。路由器将在客户端为你完成一切。动手实践，并在你的应用程序中引入路由吧。


    - **类型检查：** 在一个章节中，你使用了 React PropTypes 来定义组件接口。这是防止 bug 的通用良好实践。但 PropTypes 仅在运行时检查。你可以更进一步，在编译时引入静态类型检查。[TypeScript¹165](https://www.typescriptlang.org/)
    是一种流行的方法。但在 React 生态系统中，人们经常使用 [Flow¹166](https://flow.org/)，如果你兴趣让你的应用程序更健壮，我建议尝试一下。


    - **React Native：** [React Native¹167](https://facebook.github.io/react-native/)
    将你的应用程序带到移动设备上。你可以将从 React 学到的知识应用于 iOS 和 Android 应用程序。一旦你学会了 React，React Native
    的学习曲线不应该是陡峭的。两者共享相同的原理。你只会遇到与 Web 应用程序不同的移动组件布局。


    总的来说，我邀请你访问我的[网站¹168](https://www.rwieruch.de)查找更多关于 Web 开发和软件工程的有趣话题。你可以订阅我的[Newsletter¹169](https://getreact.dev/profile/rwieruch)
    以获取文章、书籍和课程的更新。此外，课程平台 Road to React¹170](https://roadtreact.com）提供了更高级的课程来学习
    React 生态系统。你应该去看看！


    最后但同样重要，我希望能找到更多能够支持我内容的[赞助者¹171](https://www.patreon.com/rwieruch)。有很多学生负担不起教育内容的费用。这就是为什么我的很多内容是免费的。通过成为我的赞助者来支持我的工作，我可以为他人维持这些努力。


    一旦，如果你喜欢这本书，我希望你花一点时间思考一个适合学习 React 的人。联系那个人并分享这本书。这对对我意义重大。这本书的意图是给别人的。随着更多人阅读它并向我分享反馈，它会随着时间不断改进。我也希望看到你的反馈、评论或评分！


    感谢阅读《学习 React 之之路》。Robin


