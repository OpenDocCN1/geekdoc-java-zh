    \n在书中，你不会引入 Flow 或 TypeScript，而是使用另一种在组件中检查类型的方法。React 自带了一个类型检查器以防止错误。你可以使用 PropTypes\
    \ 来描述你的组件接口。从父组件传递到子组件的所有 props 都将在分配给子组件的 PropTypes 接口上进行验证。\n\n本章将展示如何使用 PropTypes\
    \ 让所有的类型都安全。我将省略后续章节的更改，因为它们添加了不必要的代码重构。但你应该在此过程中保留并更新它们，以保持你的组件接口安全。\n\n首先，你需要为\
    \ React 安装一个单独包。\n\n# 命令行\n\n```\nnpm install prop-types\n```\n\n现在，你可以导入 PropTypes。\n\
