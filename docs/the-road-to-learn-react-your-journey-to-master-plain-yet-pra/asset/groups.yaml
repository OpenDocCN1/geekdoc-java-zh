    ## React 简介


    本章将为你介绍 React。你可能会问自己：起初为什么要学习 React？本章可能会为你提供该答案。之后，你将通过从零开始构建你的第一个 React 应用程序来深入其生态系统。在此过程中，你将学习到
    JSX 和 ReactDOM。所以，请准备好迎接你的第一个 React 组件。


    ## 你好，我叫 React。


    你为什么要费力学习 React 呢？近年来，单页应用（SPA³¹）变得非常流行。Angular、Ember 和 Backbone 等框架帮助 JavaScript
    开发者构建了超越原生 JavaScript 和 jQuery 使用的现代 Web 应用程序。这些流行解决方案的列表并非详尽。目前存在大量的 SPA 框架。考虑到发布日期，它们大多数属于第一代
    SPA：Angular（2010年）、Backbone（2010年）和 Ember（2011年）。


    React 的最初版本是由 Facebook 在 2013 年发布的。React 并不是 SPA 框架，而是一个视图库（view library）。它是 MVC³
    中的 V，允许你将组件渲染为浏览器中的可见元素。而 React 的整个生态系统使得构建单页应用成为可能。


    但是，为什么你应该考虑使用 React 而不是第一代 SPA 框架？虽然第一代框架试图一次解决很多问题，但 React 只帮助你构建视图层。它是一个库，而不是框架。它背后的理念是：你的视图是一个可组合组件的分层结构。


    在 React 中，你可以在为应用程序引入更多方面之前专注于你的视图层。其他任何方面都是你 SPA 的另一个构建块。这些构建块对于构建成熟的应用程序至关重要。你可以获得两个优势：


    首先，你可以一步步学习这些构建块。你不需要担心一次性理解它们所有内容。这与从开始就给你提供每个构建块的框架不同。本书重点将 React 作为第一个构建块。最终会有更多构建块出现。


    其次，所有的构建都是可交换的。这使得 React 周围的生态系统成为了一个创新的地方。多种解决方案正在相互竞争。你可以根据自己的用例选择最吸引你的解决方案。


    第一代 SPA 框架已经达到了企业级水平。它们更加僵化。React 则保持着创新，并被 Airbnb、Netflix 以及 Facebook³⁵ 等多家技术领先公司采用。它们对
    React 的未来投入投入，并对 React 及其生态系统本身感到满意。


    React 可能是现在构建 Web 应用程序的最佳选择之一。现在它交付视图层，但 React 生态系统是灵活且可交换的框架³⁴React 拥有精简的 API、惊人的生态系统和优秀的社区。你可以阅读关于我为什么从
    Angular 转向 React³⁵ 的经验。我强烈建议你理解为什么选择 React 而不是其他框架或库。毕竟，每个人都渴望体验 React 在未来几年将把我们带向何方。


