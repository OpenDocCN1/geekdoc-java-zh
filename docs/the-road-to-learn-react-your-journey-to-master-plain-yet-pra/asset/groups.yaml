    const Button = ({\n  onClick,\n  className = '',\n  children,\n}) => (\n<button\n\
    \  onClick={onClick}\n  className={className}\n  type=\"button\"\n```\n\n> ¹¹⁹https://www.typescript.org/\n\
    ¹²⁰https://flowtype.org/\n\n```javascript\n{children}\n\nButton.propTypes = {\n\
    \  onClick: PropTypes.func,\n  className: PropTypes.string,\n  children: PropTypes.node,\n\
    };\n```\n\n基本上就是这样。你从函数签名中获取每个参数并为它分配一个 PropType。基本类型和复杂对象的基本 PropTypes 有：\n\n\
    - PropTypes.array\n- PropTypes.bool\n- PropTypes.func\n- PropTypes.number\n- PropTypes.object\n\
    - PropTypes.string\n\n此外，你还有两个 PropTypes 用于定义一个可渲染的片段（节点），例如字符串和 React 元素：\n\n\
    - PropTypes.node\n- PropTypes.element\n\n你已经已经在 Button 组件中使用了 `node` PropType。总的来说，你可以在\
    \ React 官方文档中查阅更多 PropType 定义。\n\n目前，所有为 Button 定义的 PropTypes 都是可选的。参数可以是 `null`\
