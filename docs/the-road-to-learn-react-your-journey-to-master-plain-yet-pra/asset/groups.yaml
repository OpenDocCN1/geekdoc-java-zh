    \ [\n    { title: '1', author: '1', num_comments: 1, points: 2, objectID: 'y'\
    \ },\n    { title: '2', author: '2', num_comments: 1, points: 2, objectID: 'z'\
    \ },\n  ]\n}\n```\n\n```javascript\nit('shows two items in list', () => {\n  const\
    \ element = shallow(\n    <Table { ...props } />\n  );\n\n  expect(element.find('.table-row').length).toBe(2);\n\
    });\n```\n\nShallow renders the component without its child components. That way,\
    \ you can make the test very dedicated to one component.\n\nEnzyme has overall\
    \ three rendering mechanisms in its API. You already know shallow(), but there\
    \ also exist mount() and render(). Both instantiate instances of the parent component\
    \ and all child components. Additionally mount() gives you access to the component\
    \ lifecycle methods. But when to use which mechanism? Here some rules of thumb:\n\
    \n- Always begin with a shallow test\n- If ComponentDidMount() or componentDidUpdate()\
    \ should be tested, use mount()\n- If you want to test component lifecycle and\
    \ children behavior, use mount()\n- If you want to test a component's rendering\
    \ with less overhead than mount() and you are not interested in lifecycle methods,\
    \ use render()\n\nYou could continue to test your components. But make sure to\
    \ keep the tests simple and maintainable. Otherwise you will have to refactor\
    \ them once you change your components. That's why Facebook introduced snapshot\
    \ tests with Jest in the first place.\n\n# Exercises:\n\n- write a unit test for\
    \ Enzyme for your Button component\n- keep your unit tests up to date during the\
    \ following chapters\n- read more about enzyme and its rendering API¹¹⁸\n\n> ¹1⁸\
    \ https://github.com/airbnb/enzyme\n\n# Component Interface with PropTypes\n\n\
    You may know TypeScript¹¹⁹ Flow¹²⁰ to introduce a type interface to JavaScript.\
    \ A typed language is less error prone, because the code gets validated on its\
    \ program text. Editors and other utilities can catch these errors before the\
    \ program runs. It makes your program more robust.\n\nIn the book, you will not\
    \ introduce Flow or TypeScript, but another way to check your types in components.\
    \ React comes with a built-in type checker to prevent bugs. You can use PropTypes\
    \ to describe your component interface. All the props that get from a parent component\
    \ to a child component get validated on the PropTypes interface assigned to the\
    \ child component.\n\nThe chapter will show how you can make all your types safe\
    \ with PropTypes. I will omit the changes for the following chapters, because\
    \ they add unnecessary code refactors. But you should keep and update them along\
    \ the way to keep your components interface safe.\n\nFirst, you have to install\
    \ a separate package for React.\n\n# Command Line\n\n```\nnpm install prop-types\n\
    ```\n\nNow, you can import the PropTypes.\n\n```javascript\nsrc/App.js\n```\n\n\
    ```javascript\nimport React, { Component } from 'react';\nimport axios from 'axios';\n\
    import PropTypes from 'prop-types';\n```\n\nLet's start to assign a props interface\
    \ to the components:\n\n```javascript\nsrc/App.js\n```\n\n```javascript\nconst\
    \ Button = ({\n  onClick,\n  className = '',\n  children,\n}) => (\n<button\n\
    \  onClick={onClick}\n  className={className}\n  type=\"button\"\n```\n\n> ¹¹⁹https://www.typescript.org/\n\
    ¹²⁰https://flowtype.org/\n\n```javascript\n{children}\n\nButton.propTypes = {\n\
    \  onClick: PropTypes.func,\n  className: PropTypes.string,\n  children: PropTypes.node,\n\
    };\n```\n\nBasically that's it. You take every argument from the function signature\
    \ and assign a PropType to it. The basic PropTypes for primitives and complex\
    \ objects are:\n\n- PropTypes.array\n- PropTypes.bool\n- PropTypes.func\n- PropTypes.number\n\
    - PropTypes.object\n- PropTypes.string\n\nAdditionally you have two more PropTypes\
    \ to define a renderable fragment (node), e.g. a string, and a React element:\n\
    \n- PropTypes.node\n- PropTypes.element\n\nYou already used the node PropType\
    \ for the Button component. Overall there are more PropType definitions that you\
    \ can read up on the official React documentation.\n\nAt the moment all of the\
    \ defined PropTypes for the Button are optional. The parameters can be null or\
    \ undefined. But for several props you want to enforce that they are defined.\
    \ You can make it a requirement that these props are passed to the component.\n\
    \n# Code Organization and Testing\n\nsrc/App.js\n\n```javascript\nButton.propTypes\
    \ = {\n  onClick: PropTypes.func.isRequired,\n  className: PropTypes.string,\n\
    \  children: PropTypes.node.isRequired,\n};\n```\n\nThe className is not required,\
    \ because it can default to an empty string. Next you will define a PropType interface\
    \ for the Table component:\n\nsrc/App.js\n\n```javascript\nTable.propTypes = {\n\
    \  list: PropTypes.array.isRequired,\n  onDismiss: PropTypes.func.isRequired,\n\
    };\n```\n\nYou can define the content of an array PropType more explicitly:\n\n\
    src/App.js\n\n```javascript\nTable.propTypes = {\n  list: PropTypes.arrayOf(\n\
    \    shape({\n      objectId: PropTypes.string.isRequired,\n      author: PropTypes.string,\n\
    \      url: PropTypes.string,\n      num_comments: PropTypes.number,\n      points:\
    \ PropTypes.number,\n    })\n  ).isRequired,\n  onDismiss: PropTypes.func.isRequired,\n\
    };\n```\n\nThe objectId is required, because you know that some of your code depends\
    \ on it. The other properties are only displayed, thus they are not necessarily\
    \ required. Moreover you cannot be sure that the Hacker News API always has a\
    \ defined property for each object in the array.\n\nThat's for PropTypes. But\
    \ there is one more aspect. You can define default props in your component. Let's\
    \ take again the Button component. The className property has an ES6 default parameter\
    \ in the component signature.\n\n# src/App.js\n\n```javascript\nconst Button =\
    \ ({\n  onClick,\n  className = '',\n  children\n}) => (\n  ..\n```\n\nYou could\
    \ replace it with the internal React default prop:\n\n# src/App.js\n\n```javascript\n\
    const Button = ({\n  onClick,\n  className,\n  children\n}) => (\n  <button\n\
    \    onClick={onClick}\n    className={className}\n    type=\"button\"\n  >\n\
    \    {children}\n  </button>\n)\n```\n\n```javascript\nButton.defaultProps = {\n\
    \  className: '',\n};\n```\n\nSame as the ES6 default parameter, the default prop\
    \ ensures that the property is set to a default value.\n\nWhen the application\
    \ renders the first time, the input field should be focused. That's one use case\
    \ where you would need access to the DOM API. This chapter will show you how it\
    \ works, but it is not very useful for the application itself, we will omit the\
    \ changes after the chapter. You can keep it for your own application though.\n\
    \nIn general you can use the ref attribute in both functional stateless components\
    \ and ES6 class components. In the example of the use case you will need a lifecycle\
    \ method. That's why the approach is first showcased by using the ref attribute\
    \ with an ES6 class component.\n\nThe initial step is to refactor the functional\
    \ stateless component to an ES6 class component.\n\n```javascript\nclass Search\
    \ extends Component {\nrender() {\n  const {\n    value,\n    onChange,\n    onSubmit,\n\
    \    children\n  } = this.props;\n\n  return (\n    <form onSubmit={onSubmit}>\n\
    \    <input\n      type=\"text\"\n      value={value}\n      onChange={onChange}\n\
    \    />\n    <button type=\"submit\">\n```\n\n# Advanced Components\n\nThe chapter\
    \ will focus on the implementation of advanced components. You will learn about\
    \ higher-order components and how to implement them. In addition, you will dive\
    \ into more advanced topics in React and implement complex interactions with it.\n\
    \n# Ref a DOM Element\n\nSometimes you need to interact with DOM nodes in React.\
    \ The ref attribute gives you access to a node. Usually that is an anti pattern\
    \ in React, because you should use your declarative way of doing things and its\
    \ unidirectional flow. You have learned about it when you have introduced your\
    \ search input field. But there are certain cases where you need access to the\
    \ DOM node. official documentation mentions three use cases:\n\n- to use the DOM\
    \ API (focus, media playback etc.)\n- to invoke imperative node animations\n-\
    \ to integrate with a third-party library that needs the DOM node (e.g. D3.js)¹²³\n\
    \nLet's do it by the Search component. When the application renders the first\
    \ time, the input field should be focused. That's one use case where you would\
    \ need access to the DOM API. This chapter will show you how it works, but it\
    \ is not very useful for the application itself, we will omit the changes after\
    \ the chapter. You can keep it for your own application though.\n\nExercises:\n\
    \n- define the PropTypes interface for the Search component\n\n> ¹¹https://reactjs.org/docs/typechecking-with-ptypes.html\n\
    \nYou have learned how to organize your code and how to test it! Let’s recap the\
    \ last chapters:\n\n- React\n- PropTypes let you define type checks for components\n\
    - Jest allows you to write snapshot tests for components\n- Enzyme allows you\
    \ to write unit tests for components\n- ES6\n- import and export statements help\
    \ you organize your code\n- General\n- code organization allows you to scale your\
    \ application\n\nYou can find the source code in the official repository¹².\n\n\
    ¹²²https://github.com/the-to-react/hackernews-client/tree/5.4\n\n> ¹²³https://d3js.org/\n"
  mdcn: "\n\n# 代码组织与测试\n\n```javascript\nconst props = {\n  list: [\n    { title:\
    \ '1', author: '1', num_comments: 1, points: 2, objectID: 'y' },\n    { title:\
    \ '2', author: '2', num_comments: 1, points: 2, objectID: 'z' },\n  ]\n}\n```\n\
    \n```javascript\nit('shows two items in list', () => {\n  const element = shallow(\n\
    \    <Table { ...props } />\n  );\n\n  expect(element.find('.table-row').length).toBe(2);\n\
    });\n```\n\nShallow 会渲染组件而不包含其子组件。这样，你可以让测试非常专注于某一个组件。\n\nEnzyme 在其 API 中总共有三种渲染机制。你已经熟悉了\
    \ `shallow()`，但也存在 `mount()` 和 `render()`。它们都会实例化父组件及其所有子组件的实例。此外，`mount()` 让你访问组件的生命周期方法。但什么时候应该使用哪种机制呢？这里有一些经验法则：\n\
    \n- 始终从 shallow 测试开始\n- 如果应该测试 `ComponentDidMount()` 或 `componentDidUpdate()`，请使用\
    \ `mount()`\n- 如果你想测试组件生命周期和子组件行为，请使用 `mount()`\n- 如果你想以比 `mount()` 更小的开销测试组件渲染，且你对生命周期方法感兴趣，请使用\
    \ `render()`\n\n你可以继续测试你的组件。但请确保保持测试简单且易于维护。否则，一旦你更改了组件，就必须重构它们。这就是为什么 Facebook\
    \ 最初在 Jest 中引入了快照测试的原因。\n\n# 练习：\n\n- 为你的 Button 组件编写一个 Enzyme 单元测试\n- 在接下来的章节中保持你的单元测试更新\n\
    - 阅读更多关于 enzyme 及其渲染 API¹¹⁸\n\n> ¹¹⁸ https://github.com/airbnb/enzyme\n\n# 使用\
