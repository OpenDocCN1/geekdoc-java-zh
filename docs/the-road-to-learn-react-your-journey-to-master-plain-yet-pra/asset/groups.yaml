    \ 对象并将它们传递给元素的 `style` 属性。\n\n让我们使用内联样式来固定 Table 的宽度。\n\n```javascript\nsrc/App.js\n\
    const Table = ({ list, pattern, onDismiss }) => (\n<div className=\"table\">\n\
