    \ as a variable. A variable can be used in your JSX using curly braces.\n\nsrc/App.js\n\
    \n```javascript\nimport React, { Component } from 'react';\nimport './App.css';\n\
    \nclass App extends Component {\n  render() {\n    var helloWorld = 'Welcome to\
