    > ⁷https://www.zohwiearch.de/

    > ⁸https://www.zohwiearch.de/


    ## Global packages


    The -g flag tells npm to install globally. Global packages are accessible from
    everywhere. You can install them globally by typing:


    ```

    npm install -g <package>

    ```


    ## Local packages


    The -g flag tells npm to install globally. Local packages are used in your application.
    For instance, React would be a local. You can install it locally by typing:


    ```

    npm install <package>

    ```


    In React, when you install a package locally, it will be added to your `package.json`
    file under `dependencies`.


    ## Initializing a project


    The -y flag is a shortcut to initialize all the defaults in `package.json`. If
    you don''t use the flag, you have to configure the file. You can initialize your
    project by typing:


    ```

    npm init -y

    ```

