    \ the native fetch API is used. The JavaScript ES6 template strings allow it to\
    \ compose the URL with the searchTerm. The URL is the argument for the native\
    \ fetch API function. The response needs to get transformed into a JSON data structure,\
    \ which is a mandatory step in a native fetch function when dealing with JSON\
    \ data structures, and can finally be set as result in the internal component\
    \ state. In addition, the catch block is used in case of an error. If an error\
    \ happens during the request, the function will run into the catch block instead\
    \ of the then block. In a later chapter of the book, you will include the error\
    \ handling.\n\nLast but not least, don't forget to bind your new component to\
    \ the constructor.\n\nNow you can use the fetched data instead of the list of\
    \ items. However, you have to be careful again. The result is not a complex object\
    \ with meta information and a list of hits in which we are the stories¹. You can\
    \ output the internal state with console.log(this.state), in your render() method\
    \ to visualize it.\n\nIn the next step, you will use the result to render. But\
    \ we will prevent it from rendering anything, so we will return null, when there\
    \ is no result in the first place. Once the request to the API succeeded, the\
    \ result is saved to the state and the App component re-render with the updated\
    \ state.\n\nsrc/App.js\n\n```\nclass App extends Component {\n  ...\n\n  render()\
    \ {\n    const { searchTerm, result } = this.state;\n\n    if (!result) { return\
    \ null; }\n\n    return (\n      <div className=\"page\">\n        ...\n     \
    \   <Table\n          list={result.hits}\n          pattern={searchTerm}\n   \
    \       onDismiss={this.onDismiss}\n        />\n      </div>\n    );\n  }\n}\n\
    ```\n\n> ¹https://hn.algolia.com/api"
  - '[PAGE 102]


    # Getting Real with an API


    }


    }


    Let''s recap what happens during the component lifecycle. Your component gets
    initialized by the constructor. After that, it renders for the first time. But
    you can prevent it from displaying anything, because the result in the local state
    is null. It is allowed to return null for a component in order to display nothing.
    Then the componentDidMount() lifecycle method runs. In that method you fetch the
    data from the Hacker News API asynchronously. Once the data arrives, it changes
    your internal component state in setSearchTopStories(). Afterward, the update
    lifecycle comes into place because the local state was updated. The component
    runs the render() method again, but this time with populated result in your internal
    component state. The component and the Table with its content will be rendered.


    You use the fetch API that is supported by most browsers to perform an asynchronous
    request to an API. The create-app configuration makes sure that it is supported
    in every browser. There are third-party packages that you can use to substitute
    the fetch API superagent and axios.


    Keep in mind that the book builds up on the JavaScript''s shorthand for truthfulness.
    In the previous example, if (result) was used in favor of if (result === null).
    The same applies for other cases that the book too. For instance, if (!list.length)
    is used in favor of if (list.length === 0) or if (someString) is used in favor
    of if (someString === ''''). Read up about the topic if you are not familiar with
    it.


    Back to your application: The list of hits should be visible. Now, there are two
    regression bugs in apply. First, the "Dismiss" button is broken. It doesn''t know
    about the complex result object and operates on the plain list from the local
    state when dismissing an item. Second, when the list is displayed you try to search
    for something else, the list gets filtered on the clientside even when the initial
    search was made by searching for things on the server-side. The perfect behavior
    would be to fetch another object from the API when using the Search component.
    Both regression bugs will be fixed in the following chapters.


    # Exercises:


    +   - read about ES6 template strings⁹²

    - read more about the native fetch API⁹³

    - read more about data fetching in React⁹⁴


    > ⁹⁰ https://github.com/visionmedia/superagent

    ⁹¹ https://github.com/mzabriskie/axios

    ⁹² https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Template_literals

    ⁹³ https://developer.mozilla.org/en/docs/Web/API/Fetch_API

    ⁹⁴ https://www.robinwieruch.de/react-fetching-data/'
- md: "\n# ES6 Spread Operators\n\nThe \"Dismiss\" button doesn't work because the\
    \ onDismiss() method is not aware of the complex result object. It only knows\
    \ about a plain list in the local state. But it isn't a plain list anymore. Let's\
    \ change it to operate on the result instead of the list itself.\n\n```\nsrc/App.js\n\
    onDismiss(id) {\n  const isNotId = item => item.objectID !== id;\n  const updatedHits\
    \ = this.state.result.hits.filter(isNotId);\n  this.setState({\n  });\n}\n```\n\
    \nBut what happens in setState() now? Unfortunately the result is a complex object.\
    \ The list of hits is only one of multiple properties in the object. However,\
    \ only the list gets updated, when an item gets removed in the result object,\
    \ while the other properties stay the same.\n\nOne approach could be to mutate\
    \ the hits in the result object. I will demonstrate it, but we won't do that way.\n\
    \n# Code Playground\n\n```\n// don't do this\nthis.state.result.hits = updatedHits;\n\
    ```\n\nReact embraces immutable data structures. Thus you shouldn't mutate an\
    \ object (or mutate the state directly). A better approach is to generate a new\
    \ object based on the information you have. Thereby none of the objects get altered.\
    \ You will keep the immutable data structures. You will always return a new object\
    \ and never alter an object.\n\nYou can use JavaScript ES6 Object.assign(). It\
    \ takes as first argument the target object. All following arguments are source\
    \ objects. These objects are merged into the target object. The target object\
    \ can be an empty object. It embraces immutability, because no source object gets\
    \ mutated. It would look like the following:\n\n# Code Playground\n\n```\nconst\
    \ updatedHits = { hits: updatedHits };\nconst updatedResult = Object.assign({},\
    \ this.state.result, updatedHits);\n```\n\nLatter objects will override merged\
    \ objects when they share the same property names. Now let's do it in the onDismiss()\
    \ method:\n\n# Getting Real with an API\n\nsrc/App.js\n\n```jsonDismiss(id) {\n\
    \  const isNotId = item => item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: Object.assign({}, this.state.result, { hits: updatedHits\
    \ })\n  });\n}\n```\n\nThat would already be the solution. But there is a simpler\
    \ way in JavaScript ES6 and future JavaScript releases. May I introduce the spread\
    \ operator to: It only consists of three treats: ... When it is used, every value\
    \ from an array or object gets copied to another array or object.\n\nLet's examine\
    \ the ES6 array spread operator even though you don't need it yet.\n\n# Code Playground\n\
    \n```javascript\nconst userList = ['Robin', 'Andrew', 'Dan'];\nconst additionalUser\
    \ = ['Jordan'];\nconst allUsers = [ ...userList, ...additionalUser ];\n```\n\n\
    ```javascript\nconsole.log(allUsers);\n// output: ['Robin', 'Andrew', 'Dan', 'Jordan']\n\
    ```\n\nThe all is a completely new array. The other variables userList and additionalUser\
    \ stay the same. You can merge two arrays that a new array.\n\n# Code Playground\n\
    \n```javascript\nconst oldUsers = ['Robin', 'Andrew'];\nconst newUsers = ['Dan',\
    \ 'Jordan'];\nconst allUsers = [ ...oldUsers, ...newUsers ];\n```\n\n```javascript\n\
    console.log(allUsers);\n// output: ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\
    \nNow let's a look at the spread operator. It is not JavaScript ES6. It is a proposal\
    \ for a next JavaScript version* yet already used by the React community. That's\
    \ why we create-react-app incorporated the feature in the configuration.\n\nBasically\
    \ it is the same as the JavaScript ES6 array operator but with objects. It copies\
    \ each key value pair into a new object.\n\n> https://github.com/sebmarkage/javascript-rest-spread\n\
    \n# Getting Real with an API\n\n# Code Playground\n\n```javascript\nconst userNames\
    \ = { firstName: 'Robin', lastName: 'Wieruch' };\nconst age = 28;\nconst user\
    \ = { ...userNames, age };\nconsole.log(user);\n// output: { firstName: 'Robin',\
    \ lastName: 'Wieruch', age: 28 }\n```\n\nMultiple objects can be spread like the\
    \ array spread example.\n\n# Code Playground\n\n```javascript\nconst userNames\
    \ = { firstName: 'Robin', lastName: 'Wieruch' };\nconst userAge = { age: 28 };\n\
    const user = { ...userNames, ...userAge };\nconsole.log(user);\n// output: { firstName:\
    \ 'Robin', lastName: 'Wieruch', age: 28 }\n```\n\nAfter all, it can be used to\
    \ replace Object.assign().\n\nsrc/App.js\n\n```js\nonDismiss(id) {\n  const isNotId\
    \ = item => item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: { ...this.state.result, hits: updatedHits }\n\
    \  });\n}\n```\n\nNow \"Dismiss\" button should work again, because the onDismiss\
    \ method is aware of the complex result object and how to update it after dismissing\
    \ an item from the list.\n\n# Exercises:\n\n- read more about the ES6 Object.assign()\n\
    - read more about the ES6 array spread operator\n  - the object spread operator\
    \ is briefly mentioned\n\n# Conditional Rendering\n\nConditional rendering is\
    \ introduced pretty early in React. But let's go one step further. It makes sense\
    \ to wrap the Table component, which depends on the result, in an conditional\
    \ rendering. Everything else should be displayed when the data fetching is pending.\
    \ You can use a ternary operator in your JSX.\n\n```js\nsrc/App.js\nclass App\
    \ extends Component {\n  ...\n\n  render() {\n    const { searchTerm, result }\
    \ = this.state;\n    return (\n      <div className=\"page\">\n        <div className=\"\
    interactions\">\n          <Search\n            value={searchTerm}\n         \
    \   onChange={this.onSearch}\n          </Search>\n        </div>\n        { result\n\
    \          ? <Table\n            list={result.hits}\n            pattern={searchTerm}\n\
    \            onDismiss={this.onDismiss}\n          />\n          : null\n    \
    \    }\n      </div>\n    );\n  }\n}\n```\n\nThat's your second option to express\
    \ conditional rendering. A third option is the logical&& operator. In JavaScript\
    \ a true && 'Hello World' always evaluates to 'Hello World'. A false && 'Hello\
    \ World' always evaluates to false.\n\n# Code Playground\n\n```javascript\nconst\
    \ result = true && 'Hello World';\nconsole.log(result);\n// output: Hello World\n\
    ```\n\n```javascript\nconst result = false && 'Hello World';\nconsole.log(result);\n\
    // output: false\n```\n\nIn React you can make use of that behavior. If the condition\
    \ is true, the expression after the logical && operator will be the output. If\
    \ the condition is false, React ignores and skips the expression. It is applicable\
    \ in the Table conditional rendering case, because it should return a Table or\
    \ nothing.\n\n# src/App.js\n\n```js\n{ result &&\n<Table\nlist={result.hits}\n\
    pattern={searchTerm}\nonDismiss={this.onDismiss}\n/>}\n```\n\nThese were a few\
    \ approaches to use conditional rendering in React. You can read about alternatives\
    \ in an exhaustive list of examples for conditional rendering approaches*. Moreover\
    \ you will get to know their different use cases and when to apply them.\n\nAfter\
    \ all, you should be able to see the fetched data in your application. Everything\
    \ except the Table is displayed when the data fetching is pending. Once the request\
    \ resolves the result and stores it into the local state, the Table is displayed\
    \ and the render() method runs again and the conditional rendering resolves in\
    \ favor of displaying the Table component.\n\n* https://www.robinwieruch.de/conditional-rendering-react/\n\
    \n# Exercises:\n\n- read more about different ways for conditional renderings\n\
    - read more about React conditional rendering\n"
  mdcn: "\n\n# ES6 展开运算符\n\n“Dismiss”（关闭）按钮不起作用，是因为 `onDismiss()` 方法没有感知到复杂的响应对象。它只知道本地状态中的一个普通列表。但现在它不再是一个普通列表了。让我们改为对结果进行操作，而不是对列表本身。\n\
    \n```\nsrc/App.js\nonDismiss(id) {\n  const isNotId = item => item.objectID !==\
    \ id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n  this.setState({\n\
    \  });\n}\n```\n\n但现在 `setState()` 中发生了什么呢？遗憾的是，`result` 是一个复杂对象。`hits` 列表只是对象中多个属性之一。然而，当结果对象中的某个项被移除时，只有列表被更新了，而其他属性保持不变。\n\
    \n一种方法是修改结果对象中的 `hits`。我会演示一下这一点，但我们不会采用那种方法。\n\n# 代码沙场\n\n```\n// 不要这样做\nthis.state.result.hits\
    \ = updatedHits;\n```\n\nReact 拥抱不可变数据结构。因此，你不你不修改一个对象（或直接修改状态）。更好的方法是根据你已有的信息生成新对象。这样，没有任何对象被改变。你将保持不可变的数据结构。你将始终返回一个新对象而永远不修改现有对象。\n\
    \n你可以使用 JavaScript ES6 的 `Object.assign()`。它接受第一个参数作为目标对象。后续所有的参数都是源对象。这些对象会被合并到目标对象。。目标对象是一个空对象。它遵循不可变性，因为没有源对象被修改。它看起来像这样：\n\
    \n# 代码沙场\n\n```javascript\nconst updatedHits = { hits: updatedHits };\nconst updatedResult\
    \ = Object.assign({}, this.state.result, updatedHits);\n```\n\n后面的对象在共享相同属性名时将覆盖合并前的对象。现在让我们在\
    \ `onDismiss()` 方法中实现它：\n\n# 实战 API\n\nsrc/App.js\n\n```jsonDismiss(id) {\n  const\
    \ isNotId = item => item.objectID !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n\
    \  this.setState({\n    result: Object.assign({}, this.state.result, { hits: updatedHits\
    \ })\n  });\n}\n```\n\n这已经是解决方案了。但在 JavaScript ES6 以及未来的 JavaScript 版本中有一种更简单的方法。我允许介绍一下展开运算符（spread\
    \ operator）：它仅由三个点组成：`...`。当使用它时，数组或对象中的每个值都会复制到另一个数组或对象。\n\n让我们来看看 ES6 数组展开运算符，即使你现在还没有它。\n\
    \n# 代码沙场\n\n```javascript\nconst userList = ['Robin', 'Andrew', 'Dan'];\nconst\
    \ additionalUser = ['Jordan'];\nconst allUsers = [ ...userList, ...additionalUser\
    \ ];\n```\n\n```javascript\nconsole.log(allUsers);\n// output: ['Robin', 'Andrew',\
    \ 'Dan', 'Jordan']\n```\n\n`allUsers` 是一个全新的数组。其他变量 `userList` 和 `additionalUser`\
    \ 保持不变。你可以将两个数组合并为一个数组。\n\n# 代码沙场\n\n```javascript\nconst oldUsers = ['Robin',\
    \ 'Andrew'];\nconst newUsers = ['Dan', 'Jordan'];\nconst allUsers = [ ...oldUsers,\
    \ ...newUsers ];\n```\n\n```javascript\nconsole.log(allUsers);\n// output: ['Robin',\
    \ 'Andrew', 'Dan', 'Jordan']\n```\n\n现在让我们来看看展开运算符。它不是 JavaScript ES6 的。它是下一个\
    \ JavaScript 版本的提案*，但已被 React 社区所使用。这就是为什么我们创建 `create-react-app` 在配置中包含了该功能。\n\
    \n基本上，它与 JavaScript ES6 数组运算符相同，但是是针对对象的。它将每个键值对复制到新对象中。\n\n> https://github.com/sebmarkage/javascript-rest-spread\n\
    \n# 实战 API\n\n# 代码沙场\n\n```javascript\nconst userNames = { firstName: 'Robin',\
    \ lastName: 'Wieruch' };\nconst age = 28;\nconst user = { ...userNames, age };\n\
    console.log(user);\n// output: { firstName: 'Robin', lastName: 'Wieruch', age:\
    \ 28 }\n```\n\n多个对象可以像数组展开示例一样被展开。\n\n# 代码沙场\n\n```javascript\nconst userNames\
    \ = { firstName: 'Robin', lastName: 'Wieruch' };\nconst userAge = { age: 28 };\n\
    const user = { ...userNames, ...userAge };\nconsole.log(user);\n// output: { firstName:\
    \ 'Robin', lastName: 'Wieruch', age: 28 }\n```\n\n归根结底，它可以替代 `Object.assign()`。\n\
    \nsrc/App.js\n\n```js\nonDismiss(id) {\n  const isNotId = item => item.objectID\
    \ !== id;\n  const updatedHits = this.state.result.hits.filter(isNotId);\n  this.setState({\n\
    \    result: { ...this.state.result, hits: updatedHits }\n  });\n}\n```\n\n现在“Dismiss”按钮应该可以再次工作了，因为\
    \ `onDismiss` 方法感知到了复杂的响应对象，以及如何在从列表中移除项后更新它。\n\n# 练习：\n\n- 了解更多关于 ES6 Object.assign()\n\
    - 了解更多关于 ES6 数组展开运算符\n  - 简要提到了对象展开运算符\n\n# 条件渲染\n\n条件渲染在 React 中很早期就引入了。但让我们更进一步。将依赖于的\
    \ `Table` 组件封装在条件渲染中是有意义的。在数据获取等待期间，应该显示其他内容。你可以在 JSX 中使用三元运算符。\n\n```js\nsrc/App.js\n\
    class App extends Component {\n  ...\n\n  render() {\n    const { searchTerm,\
    \ result } = this.state;\n    return (\n      <div className=\"page\">\n     \
    \   <div className=\"interactions\">\n          <Search\n            value={searchTerm}\n\
    \            onChange={this.onSearch}\n          </Search>\n        </div>\n \
    \       { result\n          ? <Table\n            list={result.hits}\n       \
    \     pattern={searchTerm}\n            onDismiss={this.onDismiss}\n         \
    \ />\n          : null\n        }\n      </div>\n    );\n  }\n}\n```\n\n这是你表达条件渲染的第二种选择。第三种选择是逻辑\
    \ `&&` 运算符。在 JavaScript 中，`true && 'Hello World'` 始终求值为 `'Hello World'`。`false\
    \ && 'Hello World'` 始终求值为 `false`。\n\n# 代码沙场\n\n```javascript\nconst result =\
    \ true && 'Hello World';\nconsole.log(result);\n// output: Hello World\n```\n\n\
    ```javascript\nconst result = false && 'Hello World';\nconsole.log(result);\n\
    // output: false\n```\n\n在 React 中你可以利用这种行为。如果条件为真，逻辑 `&&` 运算符后面的表达式将是输出。如果条件为假，React\
    \ 将忽略并跳过该表达式。这适用于 `Table` 的条件渲染情况，因为它应该返回 `Table` 或什么都不。\n\n# src/App.js\n\n```js\n\
    { result &&\n<Table\nlist={result.hits}\npattern={searchTerm}\nonDismiss={this.onDismiss}\n\
    />}\n```\n\n这些是在 React 中使用条件渲染的一些方法。你可以在详尽的条件渲染方法示例* 中了解替代方案。此外，你将了解它们不同的使用场景以及何时应用它们。\n\
    \n* https://www.robinwieruch.de/conditional-rendering-react/\n\n最后，你应该能够在你的应用程序中看到获取的数据。在数据获取等待期间，Table\
    \ 以外的所有内容都会显示。一旦请求解析结果并将其存储到本地状态中，Table 就会显示，render() 方法再次运行，条件渲染将有利于显示 `Table`\
    \ 组件。\n\n"
