  - '[PAGE 4]


    # Foreword


    The Road to learn React teaches you the fundamentals of React. You will build
    a real world application along the way in plain React without complicated tooling.
    Everything from project setup to deployment on a server will be explained for
    you. The book comes with additional referenced reading material and exercises
    with each chapter. After reading the book, you will be able to build your own
    applications in React. The material is kept up to date by me and the community.


    In the Road to learn React, I want to offer a foundation before you start to dive
    into the broader React ecosystem. It has less tooling and less external state
    management, but a lot of information about React. It explains general concepts,
    patterns and best practices in a real world React application.


    You will learn to build your own React application. It covers real world features
    like pagination, client-side caching and interactions such as searching and sorting.
    Additionally, you will transition from JavaScript ES5 to JavaScript ES6 along
    the way. I hope this book captures my enthusiasm for React and JavaScript and
    helps you to get started with it.'
  - '[PAGE 5]


    # About the Author


    Robin Wieruch is a german software and web engineer who is dedicated to learn
    and teach programming in JavaScript. After graduating from university with a masters
    degree in computer science, he hasn''t stopped learning every day on his own.
    His experiences from the startup world, where he used JavaScript excessively during
    his professional time and spare time, gave him opportunity to teach others about
    these topics.


    For a few years, Robin worked closely with a great team of engineers at a company
    called Small Improvements on a large scale application. The company builds a SaaS
    product enabling customers to create a feedback framework. Under the hood, the
    application worked with JavaScript in the frontend and Java in the backend. In
    the frontend, the first iteration was written in Java with the Widget Framework
    and jQuery. When the first generation of SPAs became popular, the company migrated
    to Angular 1.X for the frontend application. After using Angular for more than
    2 years, it became clear that Angular wasn''t the best solution to work with such
    intense applications back in the days. That''s why the company made the final
    jump to React and Redux that has enabled it to operate on a large scale successfully.


    During his time in the company, Robin regularly wrote articles about web development
    on his personal website. He noticed that people would give him feedback on his
    articles that allowed him to improve his writing and teaching style. After each
    article, Robin grew in his ability to teach others. Whereas the first article
    was packed with so much stuff that could be overwhelming for students, the articles
    improved over time by focusing and teaching only one subject.


    Nowadays, Robin is self-employed to teach others. He finds it a fulfilling activity
    to see students thrive by giving them clear objectives and a short feedback loop.
    But one thing you would learn at a feedback company, wouldn''t you? Without coding
    himself he wouldn''t be able to teach things. That''s why he invests his remaining
    time in programming. You can find more information about Robin and ways to support
    and work with him


    https://www.robinwieruch.de/about'
