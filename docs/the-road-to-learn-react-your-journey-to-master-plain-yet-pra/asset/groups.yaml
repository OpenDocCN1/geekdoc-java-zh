    # Outline


    # Foreword


    The Road to React teaches you the fundamentals of React. You will build a real
    world application along the way without complicated tooling. Everything from project
    setup to deployment on server will be explained for you. The book comes with additional
    material and exercises with each chapter. After reading the book, you will be
    able to build your own applications in React. The material is kept up to date
    by me and the community.


    In The Road to React, I want to offer a foundation before you dive into the broader
    ecosystem. It has less tooling and state management, but a lot of information
    about React. It explains general concepts, patterns and best practices in a real
    world application.


    You will learn to build your own React application. It covers real world features
    like pagination, client-side caching and interactions such as sorting. Additionally,
    you will transition from ES5 to ES6. I hope this book captures your enthusiasm
    for React and helps you get started.


    # About the Author


    Robin Wier is a German software and web engineer dedicated to learning programming
    every day. After graduating from university with a masters degree in computer
    science, Robin spent several years working closely with a great team of engineers
    at a company called Small Improvements building SaaS products. Under the hood,
    the application worked with JavaScript in the frontend. The first iteration was
    written with Angular and jQuery. When the first generation of SPAs became popular,
    the company migrated to React. During his time at the company, Robin regularly
    wrote articles about web development on his personal website. He noticed that
    people would give him feedback that allowed him to improve his writing style.
    Each article was packed with much stuff that could be overwhelming for students.
    Nowadays Robin is self-employed to teach others. He finds it a fulfilling activity
    to see students thrive by giving them clear objectives and a short loop. But one
    thing you would learn: without coding himself he wouldn''t be able to teach things.
    That''s why he invests his remaining time in programming. You can find more information
    about Robin and ways to support and work with him: https://www.robinwieruch.de/about


    # Testimonials


    There are many testimonials², ratings³, and reviews⁴ about the book which should
    confirm its quality. I am so proud of it, because I never expected such feedback.
    If you enjoy the book as well, I would love to find your rating/review somewhere
    as it helps to spread the word. The following shows a short excerpt of these good
    voices:


    Muhammad Kashif: "The Road to Learn is a unique book that I recommend to any student
    or professional interested in learning React basics to advanced level. It is packed
    with insightful tips and techniques that are hard to find elsewhere, and remarkably
    thorough in its use of examples and references to sample problems. I have 17 years
    of experience in web and desktop app development, and before reading this book
    I was having trouble learning React but this book works like magic."


    Andre Vargas: "The Road to Learn React by Robin Wier is an awesome book! Most
