    # Testimonials


    **Student:** “The best book to start learning ReactJS. The project moves along
    with the concepts being learnt which helps to grasp the subject. I have found
    ‘Code and learn’ as best way to master programming and this book exactly does
    that."


    **Thomas Lockney**¹²: “Pretty solid introduction to React that doesn''t try to
    be comprehensive. I just wanted a taste to understand what it was about and this
    book gave me exactly. I didn''t follow all the little footnotes to learn about
    the new ES6 features I''ve missed (“I wouldn''t say I''ve been missing it, Bob.”).
    But I''m sure for those of you who have fallen behind and are diligent about following
    those, you can probably learn a lot more than just what the book teaches.”


    ¹²https://www.goodreads.com/review/show/188067388


    # Education for Children


    The book should enable everyone to learn React. However, not everyone is privileged
    to use those resources, because not everyone is educated in the English language
    in the first place. Thus I want to use the project to support projects that teach
    children English in the developing world.


    - 1. April to 18. April, 2017, Giving Back, By Learning React¹³


    > ¹³https://www.robinwieruch.de/giving-back-by-learning-react/


    # FAQ


    **How do I get updates?** You can subscribe^14 to the Newsletter or follow me
    on Twitter^15 for updates. Once you have a copy of the book, it will stay updated
    when a new edition gets released. But you will have to grab the copy again when
    an update is announced.


    **Does it use the React version?** The book always receives an update when the
    React version got updated. Usually books are outdated pretty soon after their
    release. Since this book is self-published, I will update it whenever I want.


    **Does it cover Redux?** It doesn''t. Therefore I have written a second book.
    The Road to learn React should give you a solid foundation before you dive into
    advanced topics. The implementation of the sample application in the book will
    show you that you''t need Redux to build an application in React. After you have
    read the book, you will be able to implement a solid application without Redux.
    Then you can read my second book to learn Redux^16.


    **Does it use JavaScript ES6 ES7?** But don''t worry. You will be fine if you
    are familiar with JavaScript ES5. All JavaScript ES6 features, that I describe
    on the journey to learn React, will transition from ES5 to ES6 in the book. Every
    feature along the way will be explained. The book does not only teach React, but
    also useful JavaScript features for React.


    **Will you add more chapters in the future?** You can have a look at the Change
    Log chapter for major updates that have already happened. There will be announced
    improvements in between two. In general, depends on the community we continue
    to work on the book. If there is an acceptance for the book, I will deliver more
    chapters and improve the old material. I will keep the content up to date with
    best practices, concepts and patterns.


    **How can I get help while reading the book?** The book has a Slack Group^17 for
    people who are reading the book. You can join the channel to get help or to help
    help others. After all, helping others can improve your learnings too.


    **Is there any troubleshooting area?** If you run into problems, please solve
    the Slack Group. In addition, you could have a look into the open issues on GitHub^18
    for the book. Perhaps your problem was already mentioned and you can find the
    solution for it. If your problem wasn''t mentioned, don''t hesitate to open a
    new issue (e.g. book page, node version). After you explain your problem, please
    provide a screenshot, and some more details. After, I try to ship fixes in next
    editions of the book.


