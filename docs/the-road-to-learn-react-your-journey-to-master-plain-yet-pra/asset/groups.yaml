  - '[PAGE 136]


    # ES6 Modules: Import and Export


    In JavaScript ES6 you can import and export functionalities from modules. These
    functionalities can be functions, classes, components, and constants. Basically
    everything that you can assign to a variable. The modules can be single files
    or folders with one index file as entry point.


    In the beginning of the book, after you bootstrapped your application with create-react-app,
    you already had several import and export statements across your initial files.
    Now it is the appropriate time to explain these.


    The import and export statements help you to share code across multiple files.
    Before there were already several solutions for this in the JavaScript environment.
    It was a mess, because you would want to find one standardized way than having
    several approaches for the same thing. Now it is a native behavior since JavaScript
    ES6.


    Additionally these statements embrace code splitting. You distribute your code
    across multiple files to keep it reusable and maintainable. The former is true
    you can import the piece of code in multiple files. The latter is true because
    you have one source where you maintain the piece of code.


    Last not least, it helps you to think about code encapsulation. Every functionality
    needs to be exported from a file. Some of these functionalities should only be
    used in the file where they have been defined. The exports of the file are basically
    the public API to the file. Only the exported functionalities are available to
    be reused somewhere else. It follows the best practice of encapsulation.


    But let''s get practical. How do these import and export statements work? The
    following examples showcase the statements by sharing one or multiple variables
    across two files. In the end, the approach can scale to multiple files and share
    much more than simple variables.


    You can export one or multiple variables. It is called a named export.


    # Code Playground: file.js


    ```

    const firstname = ''robin'';

    const lastname = ''wieruch'';


    export { firstname, lastname };

    ```


    And import them in another file with a relative path to the first file.'
- md: "\n## Code Playground: file2.js\n\n```javascript\nimport { firstname, lastname\
    \ } from './file1.js';\nconsole.log(firstname);\n// output: robin\n```\n\nYou\
    \ can import all exported variables from another file as one object.\n\n## Code\
    \ Playground: file2.js\n\n```javascript\nimport * as person from './file1.js';\n\
    console.log(person.firstname);\n// output: robin\n```\n\nImports can have an alias.\
    \ It can happen that you import functionalities from multiple files that have\
    \ the same name export. That's why you can use an alias.\n\n## Code Playground:\
    \ file2.js\n\n```javascript\nimport { firstname as foo } from './file1.js';\n\
    console.log(foo);\n// output: robin\n```\n\nLast but not least there exists the\
    \ default statement. It can be used for a few use cases:\n\n- to export and import\
    \ a single functionality\nto highlight the main functionality of the exported\
    \ API of a module\n- to have a fallback import functionality\n\n## Code Organization\
    \ and Testing\n\nCode Playground: file1.js\n\n```javascript\nconst robin = {\n\
