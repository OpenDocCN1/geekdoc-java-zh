    \ object initialization:\n\nCode Playground\n\n```\nconst name = 'Robin';\n\n\
    const user = {\n  name: name,\n};\n```\n\nWhen the property name in your object\
    \ is the same as your variable name, you can do the following:\n\nCode Playground\n\
    \n```\nconst name = 'Robin';\n\nconst user = {\n  name,\n};\n```\n\nIn your application,\
    \ you can do the same. The list variable name and the state property name share\
    \ the same name.\n\nCode Playground\n\n```\n// ES5\nthis.state = {\n  list: list,\n\
    };\n\n// ES6\nthis.state = {\n  list,\n};\n```\n\nAnother neat helper are shorthand\
    \ method names. In JavaScript ES6, you can initialize methods in an object more\
    \ concisely."
