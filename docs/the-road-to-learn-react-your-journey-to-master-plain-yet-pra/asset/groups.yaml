  mdcn: "\n在第 3 步。即使源代码发生，它也会保持应用程序状态。应用程序本身会加载，但不会刷新页面。\n\n# 练习：\n\n- 更改你的 `src/App.js`\
    \ 源代码几次以查看 HMR 的效果\n- 观看 Dan Abramov 提供的《Live React: Hot Reloading with Time Travel^58\
    \ 的前 10 分钟\n\n# JSX 中的复杂 JavaScript\n\n让我们回到你的 App 组件。到为止，你在 JSX 中渲染了一些原始变量。现在，你将开始渲染一个项目列表。该列表最初是示例数据，但之后你将从外部\
    \ API⁹ 获取数据。那将要有趣得多。\n\n首先，你必须定义项目列表。\n\n```\nsrc/App.js\nimport React, { Component\
    \ } from 'react';\nimport './App.css';\n\nconst list = [\n{\n    title: 'React',\n\
    \    url: 'https://facebook.github.io/react/',\n    author: 'Jordan Walke',\n\
    \    num_comments: 3,\n    points: 4,\n    objectID: 0,\n},\n{\n    title: 'Redux',\n\
    \    url: 'https://github.com/reactjs/redux',\n    author: 'Dan Abramov, Andrew\
    \ Clark',\n    num_comments: 2,\n    points: 5,\n    objectID: 1,\n}\n];\n\nclass\
    \ App extends Component {\n}\n```\n\n示例数据将反映我们稍后从 API 获取的数据。列表中的一个项目包含标题、URL 和作者。此外，它还带有一个标识符、积分（指示文章的热度）和评论计数。\n\
    \n现在你可以在 JSX 中使用内置的 JavaScript `map` 功能。它允许你遍历项目列表以显示它们。同样，你将使用大括号来封装 JSX 中的 JavaScript\
    \ 表达式。\n\n> https://www.robinswieruch.de/what-is-an-api-javascript/\n\n# React\
    \ 简介\n\nsrc/App.js\n\n```\nclass App extends Component {\n  render() {\n    return\
    \ (\n      <div className=\"App\">\n        {list.map(function(item) {\n     \
    \     return <div>{item.title}</div>\n        })}\n      </div>\n    );\n  }\n\
    }\n\nexport default App;\n```\n\n在 HTML 中使用 JavaScript 在 JSX 中是非常强大的。通常，你可能用过\
    \ `map` 将一个项目列表转换为另一个项目列表。而这一次，你使用 `map` 将项目列表转换为 HTML 元素。\n\n因此，每个项目只会显示标题。让我们显示更多一些项目属性。\n\
    \nsrc/App.js\n\n```\nclass App extends Component {\n  render() {\n    return (\n\
    \      <div className=\"App\">\n        {list.map(function(item) {\n         \
    \ return (\n            <div>\n              <span>\n                <a href={item.url}>{item.title}</a>\n\
    \              </span>\n              <span>{item.author}</span>\n           \
    \   <span>{item.num_comments}</span>\n              <span>{item.points}</span>\n\
    \            </div>\n          )\n        })}\n      </div>\n    );\n  }\n}\n\
    ```\n\n# React 简介\n\n你可以看到 `map` 函数是如何简单地内联（inlined）在 JSX 中的。每个项目属性都显示在 `<span>`\
    \ 标签中。此外，项目属性的 `url` 属性被用于锚点标签的 `href` 属性。React 将为你完成所有工作并显示每个项目。但你应该为 React 添加一个辅助工具以充分发挥其潜力并提高其性能。你必须为每个列表元素分配一个\
    \ `key` 属性。这样 React 在列表变化时能够识别被添加、更改和删除的项目。示例列表项已经带有一个标识符。\n\nsrc/App.js\n\n```\n\
    {list.map(function(item) {\n  return (\n    <div key={item.objectID}>\n      <span>\n\
    \        <a href={item.url}>{item.title}</a>\n      </span>\n      <span>{item.author}</span>\n\
    \      <span>{item.num_comments}</span>\n      <span>{item.points}</span>\n  \
    \  </div>\n  );\n})}\n```\n\n你应该确保 `key` 属性是一个稳定的标识符。不要犯使用数组中项目索引（index）的错误。数组索引完全是不稳定的。例如，当列表顺序发生变化时，React\
    \ 将很难正确地识别项目。\n\nsrc/App.js\n\n```javascript\n// 不要这样做\n{list.map(function(item,\
    \ key) {\n  return (\n    <div key={key}>\n      </div>\n  );\n})}\n```\n\n你现在正在显示两个列表项。你可以启动应用，打开浏览器并看到列表中的的两个项。\n\
    \n# 练习：\n\n- 阅读更多关于 React 列表和键⁶⁰\n- 回习 JavaScript 中标准的内置数组功能⁶¹\n- 在 JSX 中自己尝试使用更多\
    \ JavaScript 表达式\n\n⁶¹https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map\n\
    \n# ES6 箭头函数\n\nJavaScript ES6 引入了箭头函数。箭头函数表达式比函数表达式短。\n\nCode Playground\n\n\
    ```javascript\n// function expression\nfunction() { ... }\n\n// arrow function\n\
    () => { ... }\n```\n"
