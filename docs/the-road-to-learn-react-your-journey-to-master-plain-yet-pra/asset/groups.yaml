    \ a database is using Firebase. In this comprehensive tutorial¹157 you will find\
    \ a step by step guide on how to use Firebase authentication (sign up, sign in,\
    \ ...) in React. Beyond that you will use Firebase's realtime database to store\
    \ entities. After that, it is up to store more data which is needed by your application.\n\
    - Tooling with Webpack and Babel: In the book you have used create-react-app to\
    \ set up your application. At some point, when you have learned React, you might\
    \ want to learn the to.\n\nIf you liked this book, it would mean a lot to me if\
