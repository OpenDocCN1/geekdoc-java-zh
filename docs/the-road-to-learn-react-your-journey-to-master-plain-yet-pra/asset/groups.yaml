    ¹⁴³ https://roadoreact.com/\n\nReact 状态管理及进阶领域\n\n你已经学习了 React 中的高级状态管理！让我们回顾一下最后几章：\n\
    - React\n- 将状态管理提升或降低到合适的组件\n- `setState` 可以使用函数来防止过状态（stale state）bug\n- 现有的帮助你驯服状态的外部解决方案\n\
    \n> ¹⁴⁴https://github.com/the-road-to-learn-react/hackernews-client/tree/5.6\n\
    \n# 生产环境最后步骤\n\n最后几章将向你如何将应用程序部署到生产环境。你将使用免费的托管服务 Heroku。在部署应用程序的过程中，你将学习更多关于\
    \ `create-react-app` 的知识。\n\n# Eject\n\n以下步骤和知识对于将应用程序部署到生产环境**并不是必要的**。尽管如此，我想向你解释它。`create-react-app`\
    \ 自带一个功能以保持可扩展性并防止厂商锁定（vendor lock-in）。厂商锁定通常发生在你投入某项技术，但未来没有退路时。幸运的是，在 `create-react-app`\
    \ 中你有这样一个名为“eject”的退路。\n\n在 `package.json` 中，你会找到启动、测试和构建应用程序的脚本。最后一个脚本是 **eject**。你可以尝试它，但没有回头路。**这是一次单向操作。一旦你\
    \ eject，就无法回去了！** 如果你刚开始学习 React，离开 `create-react-app` 方便的环境是没有意义的。\n\n如果你运行 `npm\
    \ run eject`，该命令会将所有配置和依赖拷贝到你的 `package.json` 和新的 `config/` 文件夹中。你会将整个项目转换为带有包含\
