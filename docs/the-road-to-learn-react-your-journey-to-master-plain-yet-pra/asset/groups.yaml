    \ 中，组件开始发送请求，但由于你的应用程序引入了某种导航，你离开了此页面跳转到其他页面。你的组件卸载了，但此时你的 `componentDidMount()`\
    \ 生命周期方法仍然有一个待处理的请求。它将尝试在 promise 的 `then()` 或 `catch()` 块中使用这个 `setState`。也许这时你会在第一次在命令行或浏览器开发者工具中看到以下警告：\n\
