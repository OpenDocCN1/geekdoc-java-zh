  mdcn: '

    ## 安装


    有多种方法可以启动 React 应用。


    第一种是使用 CDN。这听起来可能比实际要复杂。CDN 是一个[内容交付网络](https://en.wikipedia.org/wiki/Content_delivery_network*)。许多公司都拥有
    CDN，公开托管文件供人们使用。这些文件可以是像 React 这样的库，因为毕竟打包后的 React 库只是一个 react.js JavaScript 文件。它可以被托管在某处，然后将其包含在你的应用程序中。


    如何使用 CDN 启动 React？你可以在 HTML 中内联指向 CDN URL 的 `<script>` 标签。要启动 React，你需要两个文件（库）：`react`
    和 `react-dom`。


    ## 代码沙场


    ```

    <script crossorigin src="https://unpkg.com/react@16/umd/react.development.js"></script>

    <script crossorigin src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>

    ```


    但是既然你可以使用 npm 来安装 React 这样的包，为什么要用 CDN 呢？

    当你的应用程序使用 `package.json` 文件时，你可以从命令行安装 `react` 和 `react-dom`。要求是使用 `npm init -y`
    将带有 `package.json` 文件的文件夹初始化为 npm 项目。你可以使用 npm 一行命令安装多个 node 包。


    ## 命令行


    ```

    npm install react react-dom

    ```


    这种方法通常用于将 React 添加到由 npm 管理的现有应用中。

    遗憾的是，这并不是全部。你需要处理 [Babel](https://babeljs.io/) 来让你的应用程序支持 JSX（React 语法）和 JavaScript
    ES6。Babel 编译你的代码，以便浏览器可以解释 JavaScript ES6 代码和 JSX。并不是所有的浏览器都能解释这些语法。设置包含大量的配置和工具。对于
    React 初学者来说，处理所有的配置可能会让他们措手不及。


    由于这个原因，Facebook 引入了 `create-react-app` 作为零配置的 React 解决方案。下一章将向你如何使用这个引导工具来设置应用程序。


    ## 练习：


    - 了解更多关于 [React 安装](https://en.wikipedia.org/wiki/Content_delivery_network*)


    ## 零配置设置


    在学习 React 的道路上，你将使用 `create-react-app` 来引导你的应用程序。它是 Facebook 在 2016 年引入的针对 React
    的内置零配置启动器。96% 的人会向学者推荐它。在 `create-react-app` 中，工具和配置在后台演进，而重点在于应用程序的实现。


    要开始，你必须将该包安装到你的全局 node 包中。之后，你始终可以在命令行中使用它来引导新的 React 应用。


    ## 命令行


    ```

    npm install -g create-react-app

    ```


    你可以检查 `create-react-app` 的版本以验证是否在命令行中成功安装：


    ## 命令行


    ```

    create-react-app --version

    *v1.5.1

    ```


    现在你可以引导你的第一个 React 应用了。我们称其为 hackernews，但你可以选择不同的名称。引导只需要几秒钟。之后，只需进入该文件夹：


    ## 命令行


    ```

    create-react-app hackernews

    cd hackernews

    ```


    现在你可以在编辑器中打开该应用程序。你应该会看到以下文件夹结构（或取决于 `create-react-app` 版本的变体）：


    > ⁷https://github.com/facebookincubator/create-react-app

    > ⁸https://twitter.com/dan_abramov/status/806988584099062785


    ## 文件夹结构


    ```

    hackernews/

    README.md

    node_modules/

    package.json

    .gitignore

    public/

    favicon.ico

    index.html

    manifest.json

    src/

    App.css

    App.js

    App.test.js

    index.css

    index.js

    logo.svg

    registerServiceWorker.js

    ```


    这是文件夹和文件的简要说明。在开始时你不理解它们的所有内容也没关系。


    - README.md：md 扩展名表示该文件是一个 Markdown 文件。Markdown 是一种带有纯文本格式的轻量级标记语言。带有 `README.md`
    文件的项目会为你提供关于项目的的初始说明。当你最终将项目推送到 GitHub 等平台时，访问仓库时 `README.md` 文件将正确显示其内容。由于你使用了
    `create-react-app`，你的 `README.md` 将与官方的 `create-react-app` 仓库中的相同。

    - node_modules/：该文件夹包含通过 npm 安装的所有包。由于你使用了 `create-react-app`，你的项目应该安装了一些 node
    模块。你通常不会触碰这个文件夹，只从命令行安装和卸载 node 包。

    - package.json：该文件向你显示 node 包依赖列表和其他项目配置。

    - .gitignore：该文件指示了在使用时哪些文件和文件夹不应该被添加到你的远程仓库。`node_modules/` 文件夹就是如此。与同事共享 `package.json`
    文件是足够的，让他们能够独立安装所有依赖，而无需共享整个依赖文件夹。


    > ⁹https://github.com/facebookincubator/create-react-app


    ## React 简介


    - 返回的元素是在 `render()` 方法中指定的。元素是由组件构成的。理解组件、实例和元素之间的区别是有用的。

    '
