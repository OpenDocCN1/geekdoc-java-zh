    > ¹153 https://twitter.com/riwich\n> ¹154 https://www.robwiuch.com/learn-react-before-using-redux/\n\
    > ¹155 https://www.robinwierch.de/redux-mobx-confusion/\n> ¹156 https://roadtoreact.com/\n\
