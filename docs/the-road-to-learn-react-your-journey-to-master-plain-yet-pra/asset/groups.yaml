    \ React 中这是一种最佳实践，可以保持应用程序的整洁并避免任何烦人的警告。然而，目前的 promise API 并没有实现中止请求的功能。因此，你需要自己解决这个问题。这可能也是为什么没有多少开发者遵循这一最佳实践的原因。下面的实现看起来更像是一个权宜之计，而不是持久的实现。因此，你可以决定是否要实现它来绕过卸载组件引起的警告。尽管如此，如果该警告在本书的后续章节或你未来的应用程序中出现，请记住它。到时候你就知道如何处理它了。\n\
