  mdcn: "\n\n# React 简介\n\nsrc/App.js\n\n```javascript\nimport React, { Component\
    \ } from 'react';\n\n...\n\nclass App extends Component {\n  render() {\n    ...\n\
    \  }\n}\n```\n\nApp 类继承了 Component。基本上，你声明了 App 组件，但它继承自另一个组件。`extend`（扩展）意味着什么？在面向对象编程中，你有继承原则。它被用于将功能从一个类传递到另一个类。\n\
    \nApp 类扩展了 `Component` 类的功能。具体来说，它继承了 `Component` 类的功能。`Component` 类用于将基础的 ES6\
    \ 类扩展为 ES6 组件。它拥有 React 组件所需的所有功能。`render` 方法就是你已经使用过的功能之一。你将在稍后学习其他组件方法。\n\n\
    `Component` 类封装了 React 组件的所有实现细节。它允许开发者在 React 中将类作为组件。\n\nReact 组件暴露的方法是公共接口。这些方法中，有一个必须被重写（override），其他的则不需要重写。你将在书中后续章节介绍生命周期方法时学习后者。`render()`\
    \ 方法必须被重写，因为它定义了 React 组件的输出。它必须被定义。\n\n现在你了解了 JavaScript ES6 类的基础知识，以及它们如何在 React\
    \ 中被用于扩展为组件。你将在书籍描述 React 生命周期方法时学习更多关于 `Component` 方法的内容。\n\n# 练习：\n\n- 更多了解\
    \ ES6 类⁶³\n\n你已经学会了启动自己的 React 应用！让我们回顾一下前面的章节：\n\n- React\n  - create-react-app\
    \ 初始化一个 React 应用\n  - JSX 混合了 HTML 和 JavaScript 来定义 React 组件渲染方法中的输出\n  - 组件（components）、实例（instances）和元素（elements）在\
