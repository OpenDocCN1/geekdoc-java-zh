  mdcn: "\n\n# 练习：\n\n- 阅读更多关于如何正确使用 React state 的内容¹³⁶\n- 从文件中导出 `updateSearchTopStoriesState`\n\
    - 为其编写一个测试，传递负载 (hits, page) 和一个伪造的上一个状态，最后期望一个新的状态\n- 重构你的 `setState()` 方法以使用函数\n\
