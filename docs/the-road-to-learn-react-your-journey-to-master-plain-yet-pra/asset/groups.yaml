  - '[PAGE 30]


    # ReactDOM


    Before you continue with the App component, you might want to see where it is
    used. It is located in your entry point to the React world: the *src/index.js*.


    src/index.js


    ```

    import React from ''react'';

    import ReactDOM from ''react-dom'';

    import App from ''./App'';

    import ''./index.css'';

    ```


    ```

    ReactDOM.render(

    <App />,

    document.getElementById(''root'')

    );

    ```


    Basically ReactDOM.render() uses a DOM node in your HTML to replace it with your
    JSX. That''s how you can easily integrate React in every application. It is not
    forbidden to use ReactDOM.render() multiple times across your application. You
    can use it at multiple places to bootstrap JSX syntax, a React component, multiple
    React components or a whole application. But in plain React you will use only
    once to bootstrap your whole component tree.


    ReactDOM.render() expects two arguments. The first argument is JSX that gets rendered.
    The second argument specifies the place where the React application hooks into
    your HTML. It expects an element with an id=''root''. You can open your public/index.html
    file to find the id attribute.


    In the implementation ReactDOM.render() already takes your React component hooks
    into your HTML. However, it would be fine to pass simpler JSX as long as it is
    JSX. It doesn''t have to be an instantiation of a component.


    # Code Playground


    ```

    ReactDOM.render(

    <h1>Hello World</h1>,

    document.getElementById(''root'')

    );

    ```


    # Exercises:


    +   - open the public/index.html to see where the React applications hooks into
    your HTML

    - read more about rendering elements in React⁵⁷


    > ⁵⁷ https://reactjs.org/docs/rendering-elements.html'
  - "[PAGE 31]\n\n# Hot Module Replacement\n\nThere is one thing that you can do in\
    \ the src/index.js file to improve your development experience as a developer.\
    \ But it is optional and shouldn't overwhelm you in the beginning when learning\
    \ React.\n\nIn create-react-app it is an advantage that the browser automatically\
    \ refreshes the page when you change your source code. Try by changing the hello\
    \ variable in your src/App.js file. The browser should refresh the page. But there\
    \ is a better way of doing it.\n\nHot Module Replacement (HMR) is a tool to reload\
    \ your application in the browser. The browser doesn't perform a page refresh.\
    \ You can easily activate it in create-react-app. In your src/index.js, your entry\
    \ point to React, you have add one little configuration.\n\nsrc/index.js\n\n```\n\
    import React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from\
    \ './App';\nimport './index.css';\n\nReactDOM.render(\n  <App />,\n  document.getElementById('root')\n\
    );\n\nif (module.hot) {\n  module.hot.accept();\n}\n```\n\nIt's that. Try again\
    \ changing the hello variable in your src/App.js file. The browser shouldn't perform\
    \ a page refresh, but the application reloads and shows the correct output. HMR\
    \ comes with multiple advantages:\n\nImagine you are debugging with console.log()\
    \ statements. These statements will stay in your developer console, even though\
    \ you change your code, because the browser doesn't refresh the page anymore.\
    \ That can be convenient for debugging purposes.\n\nIn a growing application page\
    \ refresh demeans your productivity. You have to wait until the page loads. A\
    \ page reload can take several seconds in a large application. HMR takes away\
    \ this disadvantage.\n\nThe biggest benefit is that you can keep the application\
    \ state with HMR. Imagine you have a dialog in your application with multiple\
    \ steps and you are at step 3. Basically it is a wizard. Without HMR you would\
    \ change the source code and your browser refreshes the page. You would have to\
    \ open the dialog again and would have to navigate from step 1 to step 3. With\
    \ HMR your dialog stays open"
- md: "\nat step 3. It keeps the application state even though the source code changes.\
    \ The application itself reloads, but not the page.\n\n# Exercises:\n\n- change\
    \ your `src/App.js` source code a few times to see HMR in action\n- watch the\
    \ first 10 minutes of Live React: Hot Reloading with Time Travel^58 by Dan Abramov\n\
    \n# Complex JavaScript in JSX\n\nLet's get back to your App component. So far\
    \ you rendered some primitive variables in your JSX. Now you will start to render\
    \ a list of items. The list will be sample data in the beginning, but later you\
    \ will fetch the data from an external API⁹. That will be far more exciting.\n\
    \nFirst you have to define the list of items.\n\n```\nsrc/App.js\nimport React,\
    \ { Component } from 'react';\nimport './App.css';\n\nconst list = [\n{\n    title:\
    \ 'React',\n    url: 'https://facebook.github.io/react/',\n    author: 'Jordan\
    \ Walke',\n    num_comments: 3,\n    points: 4,\n    objectID: 0,\n},\n{\n   \
    \ title: 'Redux',\n    url: 'https://github.com/reactjs/redux',\n    author: 'Dan\
    \ Abramov, Andrew Clark',\n    num_comments: 2,\n    points: 5,\n    objectID:\
    \ 1,\n}\n];\n\nclass App extends Component {\n}\n```\n\nThe sample data will reflect\
    \ the data we will fetch later from the API. An item in the list has a title,\
    \ an url and an author. Additionally it comes with an identifier, points (which\
    \ indicate how popular an article is) and a count of comments.\n\nNow you can\
    \ use the built-in JavaScript map functionality in JSX. It enables you to iterate\
    \ over your list of items to display them. Again you will use curly braces to\
    \ encapsulate the JavaScript expression in your JSX.\n\n> https://www.robinswieruch.de/what-is-an-api-javascript/\n\
    \n# Introduction to React\n\nsrc/App.js\n\n```\nclass App extends Component {\n\
    \  render() {\n    return (\n      <div className=\"App\">\n        {list.map(function(item)\
    \ {\n          return <div>{item.title}</div>\n        })}\n      </div>\n   \
    \ );\n  }\n}\n\nexport default App;\n```\n\nUsing JavaScript in HTML is pretty\
    \ powerful in JSX. Usually you might have used map to convert one list of items\
    \ to another list of items. This time you use map to convert a list of items to\
    \ HTML elements.\n\nSo, only the title will be displayed for each item. Let's\
    \ display some more of the item properties.\n\nsrc/App.js\n\n```\nclass App extends\
    \ Component {\n  render() {\n    return (\n      <div className=\"App\">\n   \
    \     {list.map(function(item) {\n          return (\n            <div>\n    \
    \          <span>\n                <a href={item.url}>{item.title}</a>\n     \
    \         </span>\n              <span>{item.author}</span>\n              <span>{item.num_comments}</span>\n\
    \              <span>{item.points}</span>\n            </div>\n          )\n \
    \       })}\n      </div>\n    );\n  }\n}\n```\n\n# Introduction to React\n\n\
    You can see how the map function is simply inlined in the JSX. Each item property\
    \ is displayed in a `<span>` tag. Moreover the url property of the item is used\
    \ in the `href` attribute of the anchor tag. React will do all the work for you\
    \ and display each item. But you should add one helper for React to embrace its\
    \ full potential and improve its performance. You have to assign a key attribute\
    \ to each list element. That React is able to identify added, changed and removed\
    \ items when the list changes. The sample list items come with an identifier already.\n\
    \nsrc/App.js\n\n```\n{list.map(function(item) {\n  return (\n    <div key={item.objectID}>\n\
    \      <span>\n        <a href={item.url}>{item.title}</a>\n      </span>\n  \
    \    <span>{item.author}</span>\n      <span>{item.num_comments}</span>\n    \
    \  <span>{item.points}</span>\n    </div>\n  );\n})}\n```\n\nYou should make sure\
    \ that the key attribute is a stable identifier. Don’t make the mistake of using\
    \ index of the item in the array. The array index isn't stable at all. For instance,\
    \ when the list changes its order, React will have a hard time identifying the\
    \ items properly.\n\nsrc/App.js\n\n```\n// don’t do this\n{list.map(function(item,\
    \ key) {\n  return (\n    <div key={key}>\n      </div>\n  );\n})}\n```\n\nYou\
    \ are displaying both list items now. You can start your app, open your browser\
    \ and see both items of the list displayed.\n\n# Exercises:\n\n- read more about\
    \ React lists and keys⁶⁰\n- recap the standard built-in array functionalities\
