- md: "\n# Controlled Components\n\nYou already learned about the unidirectional data\
    \ flow in React. The same law applies for the input field, which updates the local\
    \ state with the searchTerm in order to filter the list. When the state changes,\
    \ the render() method runs again and uses the recent searchTerm from the local\
    \ state to apply the filter condition.\n\nBut didn't we forget something in the\
    \ input element? A HTML input tag comes with a value attribute. The attribute\
    \ has the value that is shown in the input field. In this case it would be the\
    \ searchTerm property. However, it seems like we don't need that in React.\n\n\
    That's wrong. Forms elements as <input>, <textarea> and <select> hold their own\
    \ state in plain HTML. They modify the value internally when someone changes it\
    \ from the outside. In React that should make sure to make those elements controlled\
    \ components.\n\nHow should you do that? You only have to set the value attribute\
    \ of the input field. The value is already saved in the searchTerm state property.\
    \ Why not access it from there?\n\n```\nsrc/App.js\n\nclass App extends Component\
    \ {\n  ...\n  render() {\n    const { searchTerm, list } = this.state;\n    return\
    \ (\n      <div className=\"App\">\n        <form>\n          <input\n       \
    \     type=\"text\"\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        ...\n      </div>\n    );\n  }\n}\n```\n\
    \nThat's it. The unidirectional data flow loop for the input field is self-contained\
    \ now. The internal component state is the single source of truth for the input\
    \ field.\n\nThe whole internal state management and unidirectional data flow might\
    \ be new to you. But once you are used to it, it will be your natural flow to\
    \ implement things in React. In general, React brought a novel pattern with the\
    \ unidirectional data flow to the world of single page applications. It is adopted\
    \ by several frameworks and libraries by now.\n\n# Exercises:\n\n- read more about\
    \ React forms^{71}\n- learn more about different controlled components^{72}\n\n\
    > 71 https://reactjs.org/docs/forms.html\n> 72 https://github.com/the-road-to-learn-react/react/react-controlled-components-examples\n\
    \n# Split Up Components\n\nYou have one large App component now. It keeps growing\
    \ and can become confusing eventually. You can start to split it up into chunks\
    \ of smaller components.\n\nLet's start to use a component for the search input\
    \ and a component for the list of items.\n\n```\nsrc/App.js\nclass App extends\
    \ Component {\n  ...\n  render() {\n    const { searchTerm, list } = this.state;\n\
    \    return (\n      <div className=\"App\">\n        <Search />\n        <Table\
    \ />\n      </div>\n    );\n  }\n}\n```\n\nYou can pass those components properties\
    \ which they can use themselves. In the case of the App component it needs to\
    \ pass the properties managed in the local state and its class methods.\n\n```\n\
    src/App.js\nclass App extends Component {\n  ...\n  render() {\n    const { searchTerm,\
    \ list } = this.state;\n    return (\n      <div className=\"App\">\n        <Search\n\
    \          value={searchTerm}\n          onChange={this.onSearchChange}\n    \
    \    />\n        <Table\n          list={list}\n        />\n      </div>\n   \
    \ );\n  }\n}\n```\n\n```\npattern={searchTerm}\nonDismiss={this.onDismiss}\n/>\n\
    </div>\n);\n}\n}\n```\n\nNow you can define the components next to your App component.\
    \ Those components will be ES6 class components as well. They render the same\
    \ elements like before.\n\nThe first one is the Search component.\n\n```\nsrc/App.js\n\
    class App extends Component {\n  ...\n}\n\nclass Search extends Component {\n\
    \  render() {\n    const { value, onChange } = this.props;\n    return (\n   \
    \   <form>\n        <input\n          type=\"text\"\n          value={value}\n\
    \          onChange={onChange}\n        />\n      </form>\n    );\n  }\n}\n```\n\
    \nThe second one is the Table component.\n\n# Basics in React\n\nsrc/App.js\n\n\
    ```\nclass Table extends Component {\n  render() {\n    const { list, pattern,\
    \ onDismiss } = this.props;\n    return (\n    <div>\n      {list.filter(isSearched(pattern)).map(item\
    \ => (\n        <div key={item.objectId}>\n          <span>\n            <a href={item.url}>{item.title}</a>\n\
    \          </span>\n          <span>{item.author}</span>\n          <span>{item.num_comments}</span>\n\
    \          <span>{item.points}</span>\n          <span>\n            <button\n\
    \              onClick={() => onDismiss(item.objectId)}\n              type=\"\
    button\">\n              Dismiss\n            </button>\n          </span>\n \
    \       </div>\n      ))}\n    </div>\n    );\n  }\n}\n```\n\nYou now have there\
    \ three ES6 class components. Perhaps you have noticed the props object that is\
    \ accessible via the class instance by using this. The props, short form for properties,\
    \ have all the values you have passed to the components when you used them in\
    \ your App component. That way, components can pass properties down the component\
