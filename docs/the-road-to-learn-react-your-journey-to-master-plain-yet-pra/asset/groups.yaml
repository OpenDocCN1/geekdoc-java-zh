    \n# 部署你的应用\n\n最后，没有任何应用程序应该停留在 localhost 上。你想上线。Heroku 是一个平台即服务（PaaS），你可以在那里托管应用程序。他们提供了与\
    \ React 的无缝集成。几分钟内即可部署你的应用。\n\n在部署它之前，你需要满足两个要求：\n- 安装 Heroku¹46\n- 创建免费的 Heroku\
    \ 账号¹47\n\n# 命令行\n\n现在你可以使用 CLI 了：\n\n```bash\nbrew install\n```\n```bash\ngit\
    \ init\n```\n```bash\ngit add\n```\n```bash\ngit commit -m \"your\"\n```\n```bash\n\
    git push master\n```\n```bash\nheroku open\n```\n就是这些。如果你的应用程序运行正常，查看以下资源：\n-\
    \ Git 和 GitHub⁴⁸\n- 零配置部署⁴⁹\n- Heroku¹⁵⁰\n\n> ¹⁴⁶ https://www.robinwierch.de/redux-mobx-confusion/\n\
    > ¹⁴⁷ https://www.robinwierch.de/redux-mobx-confusion/\n> ¹⁴⁸ https://github.com/\n\
    > ¹⁴⁹ https://www.robinwierch.de/zero-configuration/\n> ¹⁵⁰ https://github.com/\n\
    \n# 大纲\n\n这是本书的最后一章。希望你读得愉快，并帮助你上手 React。如果你喜欢这本书，请分享给朋友。如果你正在寻找进一步的扩展，我推荐：\n\n\
    - 状态管理：你使用了 `setState()` 和 state 来管理本地状态。然而，在较大的应用程序中，你会遇到本地状态的局限性¹⁵⁴。因此，你可以使用第三方状态管理库如\
    \ Redux 或 MobX¹⁵⁵。在 Road to Redux¹⁵⁶ 课程中你将找到关于 React、Redux 和 MobX 的高级状态。课程还附带电子书，但我建议大家也深入源码。\n\
    - 连接数据库或认证：在一个不断增长的应用程序中，你可能需要持久化数据。数据应该存储在数据库中，以便跨浏览器生存并在使用应用程序的用户之间共享。引入数据库简单的方法是使用\
    \ Firebase。在这份综合教程¹⁵⁷ 中你将找到如何在 React 中使用 Firebase 身份验证（注册、登录等）的逐步指南。此外，你将使用 Firebase\
    \ 的实时数据库存储实体。之后，取决于存储应用程序所需的更多数据。\n\n如果你喜欢这本书，能在 Amazon 上写评论¹⁵¹对我来说意义重大。我很好奇你读完书后会构建什么。\n\
