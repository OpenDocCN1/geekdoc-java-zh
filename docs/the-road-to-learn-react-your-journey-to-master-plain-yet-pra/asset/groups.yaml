  - "[PAGE 153]\n\n# Code Organization and Testing\n\n```\nconst props = {\nlist:\
    \ [\n{ title: '1', author: '1', num_comments: 1, points: 2, objectID: 'y' },\n\
    { title: '2', author: '2', num_comments: 1, points: 2, objectID: 'z' },\n]\n}\n\
    ```\n\n```\nit('shows two items in list', () => {\n  const element = shallow(\n\
    <Table { ...props } />\n);\n\n  expect(element.find('.table-row').length).toBe(2);\n\
    });\n```\n\nShallow renders the component without its child components. That way,\
    \ you can make the test very dedicated to one component.\n\nEnzyme has overall\
    \ three rendering mechanisms in its API. You already know shallow(), but there\
    \ also exist mount() and render(). Both instantiate instances of the parent component\
    \ and all child components. Additionally mount() gives you access to the component\
    \ lifecycle methods. But when to use which mechanism? Here some rules of thumb:\n\
    \n+   • Always begin with a shallow test\n• If ComponentDidMount() or componentDidUpdate()\
    \ should be tested, use mount()\n• If you want to test component lifecycle and\
    \ children behavior, use mount()\n• If you want to test a component's rendering\
    \ with less overhead than mount() and you are not interested in lifecycle methods,\
    \ use render()\n\nYou could continue to test your components. But make sure to\
    \ keep the tests simple and maintainable. Otherwise you will have to refactor\
    \ them once you change your components. That's why Facebook introduced snapshot\
    \ tests with Jest in the first place.\n\n# Exercises:\n\n+   • write a unit test\
    \ for Enzyme for your Button component\n• keep your unit tests up to date during\
    \ the following chapters\n• read more about enzyme and its rendering API¹1⁸\n\n\
    > ¹1⁸ https://github.com/airbnb/enzyme"
  - "[PAGE 154]\n\n# Component Interface with PropTypes\n\nYou may know TypeScript¹¹⁹\
    \ Flow¹²⁰ to introduce a type interface to JavaScript. A typed language is less\
    \ error prone, because the code gets validated on its program text. Editors and\
    \ other utilities can catch these errors before the program runs. It makes your\
    \ program more robust.\n\nIn the book, you will not introduce Flow or TypeScript,\
    \ but another way to check your types in components. React comes with a built-in\
    \ type checker to prevent bugs. You can use PropTypes to describe your component\
    \ interface. All the props that get from a parent component to a child component\
    \ get validated on the PropTypes interface assigned to the child component.\n\n\
    The chapter will show how you can make all your types safe with PropTypes. I will\
    \ omit the changes for the following chapters, because they add unnecessary code\
    \ refactors. But you should keep and update them along the way to keep your components\
    \ interface safe.\n\nFirst, you have to install a separate package for React.\n\
    \n# Command Line\n\n```\nnpm install prop-types\n```\n\nNow, you can import the\
    \ PropTypes.\n\n```\nsrc/App.js\n```\n\n```\nimport React, { Component } from\
    \ 'react';\nimport axios from 'axios';\nimport PropTypes from 'prop-types';\n\
    ```\n\nLet's start to assign a props interface to the components:\n\n```\nsrc/App.js\n\
    ```\n\n```\nconst Button = ({\n  onClick,\n  className = '',\n  children,\n})\
    \ => (\n<button\n  onClick={onClick}\n  className={className}\n  type=\"button\"\
    \n```\n\n> ¹¹⁹https://www.typescript.org/\n¹²⁰https://flowtype.org/"
  - "[PAGE 155]\n\n```\n```javascript\n{children}\n\nButton.propTypes = {\n  onClick:\
    \ PropTypes.func,\n  className: PropTypes.string,\n  children: PropTypes.node,\n\
    };\n```\n```\n\nBasically that's it. You take every argument from the function\
    \ signature and assign a PropType to it. The basic PropTypes for primitives and\
    \ complex objects are:\n\n+   * PropTypes.array\n* PropTypes.bool\n* PropTypes.func\n\
    * PropTypes.number\n* PropTypes.object\n* PropTypes.string\n\nAdditionally you\
    \ have two more PropTypes to define a renderable fragment (node), e.g. a string,\
    \ and a React element:\n\n+   * PropTypes.node\n* PropTypes.element\n\nYou already\
    \ used the node PropType for the Button component. Overall there are more PropType\
    \ definitions that you can read up on the official React documentation.\n\nAt\
    \ the moment all of the defined PropTypes for the Button are optional. The parameters\
    \ can be null or undefined. But for several props you want to enforce that they\
    \ are defined. You can make it a requirement that these props are passed to the\
    \ component."
  - "[PAGE 156]\n\n# Code Organization and Testing\n\nsrc/App.js\n\n```\nButton.propTypes\
