- md: "\n## Basics in React\n\nin the onClick handler is enclosed by another function.\
    \ It is an arrow function. That way, you can sneak in the object property of the\
    \ item to identify the item that will be dismissed. An alternative way would be\
    \ to define the function outside of the onClick handler and only pass the defined\
    \ function to the handler. A later chapter will explain the topic of handlers\
    \ in elements more detail.\n\nDid you notice the multiline for the button element?\
    \ Note that elements with multiple attributes get messy as one line at some point.\
    \ That's why the button element is used with multilines and indentations to keep\
    \ it readable. It is not mandatory. It is only a code style recommendation that\
    \ I highly recommend.\n\nNow how to implement the onDismiss() functionality. It\
    \ takes an id to identify the item to dismiss. The function is bound to the class\
    \ and becomes a class method. That's why you access it with this.onDismiss() and\
    \ not onDismiss(). In order to define the onDismiss() as class method, you have\
    \ to bind it in the constructor. Bindings are explained in another chapter later.\n\
    \n### src/App.js\n\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      list,\n    };\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n  render() {\n    ...\n  }\n}\n```\n\nIn\
    \ the next step, you have to define its functionality, the business logic, in\
    \ your class. Class methods can be defined the following way.\n\n### src/App.js\n\
    \n```javascript\nclass App extends Component {\n  constructor(props) {\n    super(props);\n\
    \n    this.state = {\n      list,\n    };\n\n    this.onDismiss = this.onDismiss.bind(this);\n\
    \  }\n\n  onDismiss(id) {\n    ...\n  }\n\n  render() {\n    ...\n  }\n}\n```\n\
    \nNow you are able to define what happens inside of the class method. Basically\
    \ you want to remove the item identified by the id from the list and store an\
    \ updated list to your local state. Afterward, the updated list will be used in\
    \ the re-running render() method to display it. The removed item shouldn't appear\
    \ anymore.\n\nYou can remove an item from a list using the JavaScript built-in\
    \ filter functionality. The filter function takes a function as input. The function\
    \ has access to each value in the list, because it iterates over the list. That\
    \ way, you can evaluate each item in the list based on a filter condition. If\
    \ the evaluation for an item is true, the item stays in the list. Otherwise it\
    \ will be filtered from the list. Additionally, it is good to know that the function\
    \ returns a new list and doesn't mutate the old list. It supports the convention\
    \ in React of having immutable data structures.\n\n## Basics in React\n\n### src/App.js\n\
    \n```javascript\nonDismiss(id) {\n  const updatedList = this.state.list.filter(function\
    \ isNotId(item) {\n    return item.objectID !== id;\n  });\n}\n```\n\nIn the next\
    \ step, you can extract the function and pass it to the filter function.\n\n###\
    \ src/App.js\n\n```javascript\nonDismiss(id) {\n  function isNotId(item) {\n \
    \   return item.objectID !== id;\n  }\n\n  const updatedList = this.state.list.filter(isNotId);\n\
    }\n```\n\nIn addition, you can do it more concisely using a JavaScript ES6 arrow\
    \ function.\n\n### src/App.js\n\n```javascript\nonDismiss(id) {\n  const isNotId\
    \ = item => item.objectID !== id;\n  const updatedList = this.state.list.filter(isNotId);\n\
    }\n```\n\nYou could even inline it again, like you did in the onClick handler\
    \ of the button, but it might get less readable.\n\n### src/App.js\n\n```javascript\n\
    onDismiss(id) {\n  const updatedList = this.state.list.filter(item => item.objectID\
    \ !== id);\n}\n```\n\nThe list removes the clicked item now. However the state\
    \ isn't updated yet. Therefore you can finally use the setState() method to update\
    \ the list in the internal component state.\n\n### src/App.js\n\n```javascript\n\
    onDismiss(id) {\n  const isNotId = item => item.objectID !== id;\n  const updatedList\
    \ = this.state.list.filter(isNotId);\n  this.setState({ updatedList });\n}\n```\n\
    \nNow you are able to define what happens inside of the class method. Basically\
    \ you want to remove the item identified by the id from the list and store an\
    \ updated list to your local state. Afterward, the updated list will be used in\
    \ the re-running render() method to display it. The removed item shouldn't appear\
    \ anymore.\n\nYou can remove an item from a list using the JavaScript built-in\
    \ filter functionality. The filter function takes a function as input. The function\
    \ has access to each value in the list, because it iterates over the list. That\
    \ way, you can evaluate each item in the list based on a filter condition. If\
    \ the evaluation for an item is true, the item stays in the list. Otherwise it\
    \ will be filtered from the list. Additionally, it is good to know that the function\
