    \ `render()` 方法中使用并进行显示。被移除的项不应该再次出现。\n\n现在你能够定义类方法内部发生了什么。基本上，你想要从列表中移除由 `id`\
    \ 标识的项，并将更新后的列表存储到本地状态中。之后，更新后的列表将在重新运行的 `render()` 方法中使用并进行显示。被移除的项不应该再次出现。\n\
    \n## 绑定 (Bindings)\n\n为什么你需要绑定？在 React 中，类方法不会自动绑定到实例上。\n\n```javascript\nclass\
