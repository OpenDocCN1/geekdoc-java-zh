  - '[PAGE 96]


    # Lifecycle Methods


    You will need to know about React lifecycle methods before you can start to fetch
    data in your components using an API. These methods are a hook into the lifecycle
    of a React component. They can be used in ES6 class components, but not in functional
    stateless components.


    Do you remember when a previous chapter taught you about JavaScript ES6 classes
    and how they are used in React? Apart from the render() method, there are several
    methods that can be overridden in a React ES6 class component. All of these are
    the lifecycle methods. Let''s dive into them:


    You already know two lifecycle methods that can be used in an ES6 class component:constructor()
    and render().


    The constructor is only called when an instance of the component is created and
    inserted into the DOM. The component is called mounting of component.


    The render() method is called during the mount process, but also when the component
    updates. Each time the state or the props of a component change, the render()
    method of the component is called.


    Now you know more about the two lifecycle methods and when they are called. You
    already know them as well. But there are more of them.


    The mounting of a component has two lifecycle methods:componentWillMount() and
    componentDidMount(). The constructor is called first, componentWillMount() gets
    called before the render() method and componentDidMount() is called after the
    render() method.


    Overall the mounting process has 4 lifecycle methods. They are invoked in the
    following order:


    +   * constructor()

    * componentWillMount()

    * render()

    * componentDidDidMount()


    But what about the update lifecycle of a component that happens when the state
    or the props change? Overall it has 5 lifecycle methods in the following order:


    +   * componentWillReceiveProps()

    * shouldComponentUpdate()

    * componentWillUpdate()

    * render()

    * componentDidDidUpdate()'
  - '[PAGE 97]


    # Getting Real with an API


    Last but not least there the unmounting lifecycle. It has only one lifecycle method:
    componentWillUnmount().


    After all, you don''t need to know all of these lifecycle methods from the beginning.
    It can be intimidating yet you will not use all of them. Even in a React application
    you will only use a few of them around `constructor()` and the `render()` method.
    Still, it is good to know that each lifecycle method can be used for specific
    cases:


    +   * **constructor(props)** - It is called when the component gets initialized.
    You can set an initial component state and bind class methods during that lifecycle
    method.

    * **componentWillMount()** - It called before the `render()` lifecycle method.
    That''s why it could be used to set internal component state, because it will
    trigger a second rendering of the component. Generally it is recommended to use
    the `constructor()` to set the initial state.

    * **render()** - This method is mandatory and returns the elements as an output
    of the component. The method should be pure and therefore shouldn''t modify the
    component state. It gets input as props and returns an element.

    * **componentDidMount()** It is called only when the component mounted. The perfect
    time to do an asynchronous request to fetch data from an API. The fetched data
    would get stored in the internal state to display it in the `render()` lifecycle
    method.

    * **componentWillReceiveProps(nextProps)** - The lifecycle method is called during
    an update lifecycle. As you get the next props. You can diff the next props with
    the previous props, using this props, to apply a different behavior based on the
    diff. Additionally, you can set state on the next props.

    * **shouldComponentUpdate(nextProps, nextState)** - It is always called when the
    component updates to state or props changes. You will use it in React applications
    for performance optimizations. Depending on a boolean that you return from this
    lifecycle, the component and all its children will render or not render on an
    update lifecycle. You can prevent the render lifecycle method of a component.

    * **componentWillUpdate(nextProps, nextState)** - The lifecycle method is immediately
    invoked before the `render()` method. You have the next props and state at your
    disposal. You can use the method as last opportunity to perform preparations before
    the render method gets executed. Note that you cannot trigger `setState()` anytime.
    If you want to compute state on the next props, you have to usecomponentWillReceiveProps().

    * **componentDidUpdate(prevProps, prevState)** - The lifecycle method is immediately
    invoked after the `render()` method. You can use it as opportunity to perform
    DOM operations or to perform further asynchronous requests.

    * **componentWillUnmount()** - It is called before you destroy your component.
    You can use the lifecycle method to perform any cleanup tasks.


    The `constructor()` and `render()` lifecycle methods are already used by you.
    These are commonly used lifecycle methods for ES6 class components. Actually the
    `render()` method is required, otherwise you wouldn''t return a component instance.'
- md: "\n## Getting Real with an API 85\n\nThere is one more lifecycle method: `componentDidCatch(error,\
    \ info)`. It was introduced in React 16 and is used to catch errors in components.\
    \ For instance, displaying the sample list in your application works fine. But\
    \ there could be a case when the local state is set to null by accident (e.g.\
    \ when fetching the list from an external API, but the request failed and you\
    \ set the local state of it to null). Afterward, it wo wouldnt be possible to\
    \ filter and map the list anymore, because it is null and not an empty list. The\
    \ component would be broken and the whole application would fail. Now, by using\
    \ `componentDidCatch()`, you can catch the error, store it in your local state,\
    \ and show an optional message to your application user that an error has happened.\n\
    \n## Exercises:\n\n- read more about lifecycle methods in React⁸⁵\n- read more\
    \ about the state related to lifecycle methods in React⁸⁶\n- read more about error\
    \ handling in components ⁸⁷\n\n> ⁴https://www.robinwieuerch.de/what-is-new-in-react-16/\n\
    ⁸⁵https://reactjs.org/docs/react-component.html\n⁸⁶https://reactjs.org/docs/state-and-lifecycle.html\n\
    ⁸⁷https://reactjs.org/blog/2017/07/26/error-handling-in-react-16.html\n\n## Fetch\
    \ Data\n\nNow you are prepared to fetch data from the Hacker News API. There was\
    \ one lifecycle method mentioned that can be used to fetch data: `componentDidMount()`.\
    \ You will use the native fetch API in JavaScript to perform the request.\n\n\
    Before we use it, let's set up the URL constants and default parameters to breakup\
    \ the request into chunks.\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport './App.css';\n```\n\nIn JavaScript ES6, we use template strings\
    \ to concatenate strings. You will use it to concatenate your URL for the API\
    \ endpoint.\n\n## Code Playground\n\n```javascript\n// ES6\nconst url = `${PATH_BASE}${PATH_SEARCH}$${PARAM_SEARCH}${DEFAULT_QUERY}`;\n\
    \n// ES5\nvar url = PATH_BASE + PATH_SEARCH + '?' + PARAM_SEARCH + DEFAULT_QUERY;\n\
    \nconsole.log(url);\n// output: https://hn.algolia.com/api/v1/search?query=redux\n\
    ```\n\nThat will keep your URL composition flexible in the future. But let's get\
    \ to the API request where you will use the url. The whole data fetch process\
    \ will be presented at once, but each step will be explained afterwards.\n\n##\
    \ src/App.js\n\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      result: null,\n      searchTerm:\
    \ DEFAULT_QUERY,\n    };\n\n    this.setSearchTopStories = this.setSearchTopStories.bind(this);\n\
    \    this.onSearchChange = this.onSearchChange.bind(this);\n    this.onDidDismiss\
    \ = this.onDidDismiss.bind(this);\n  }\n\n  setSearchTopStories(result) {\n  \
    \  this.setState({ result });\n  }\n\n  componentDidMount() {\n    const { searchTerm\
    \ } = this.state;\n\n    fetch(`${PATH_BASE}$${PARAM_SEARCH}$${searchTerm}`)\n\
    \      .then(response => response.json())\n      .then(result => this.setSearchTopStories(result))\n\
    \      .catch(error => error);\n  }\n}\n```\n\nA lot of things happen in the code.\
    \ I thought about breaking it into smaller pieces. Then again it would be difficult\
    \ to grasp the relations of each piece to each other. Let me explain each step\
    \ in detail.\n\nFirst, you can remove the sample list of items, when you return\
    \ a real list from the Hacker News API. The sample data is not used anymore. The\
    \ initial state of your component has an empty list and default search term now.\
    \ The same default search term is used in the input field of the Search component\
    \ and in your first request.\n\n## Getting Real with an API\n\nSecond, you use\
    \ the `componentDidMount()` lifecycle method to fetch the data after the component\
    \ did mount. In the very first fetch, the default search term from the local state\
    \ is used. It will fetch \"redux\" related stories, because that is the default\
    \ parameter.\n\nThird, the native fetch API is used. The JavaScript ES6 template\
    \ strings allow it to compose the URL with the searchTerm. The URL is the argument\
    \ for the native fetch API function. The response needs to get transformed into\
    \ a JSON data structure, which is a mandatory step in a native fetch function\
    \ when dealing with JSON data structures, and can finally be set as result in\
    \ the internal component state. In addition, the catch block is used in case of\
    \ an error. If an error happens during the request, the function will run into\
    \ the catch block instead of the then block. In a later chapter of the book, you\
    \ will include the error handling.\n\nLast but not least, don't forget to bind\
    \ your new component to the constructor.\n\nNow you can use the fetched data instead\
    \ of the list of items. However, you have to be careful again. The result is not\
    \ a complex object with meta information and a list of hits in which we are the\
    \ stories¹. You can output the internal state with `console.log(this.state)`,\
    \ in your `render()` method to visualize it.\n\nIn the next step, you will use\
    \ the result to render. But we will prevent it from rendering anything, so we\
    \ will return null, when there is no result in the first place. Once the request\
    \ to the API succeeded, the result is saved to the state and the App re-renders.\n\
    \nsrc/App.js\n\n```javascript\nclass App extends Component {\n  // ...\n\n  render()\
    \ {\n    const { searchTerm, result } = this.state;\n\n    if (!result) {\n  \
    \    return null;\n    }\n\n    return (\n      <div className=\"page\">\n   \
    \     <Table\n          list={result.hits}\n          pattern={searchTerm}\n \
    \         onDismiss={this.onDismiss}\n        />\n      </div>\n    );\n  }\n\
    }\n```\n\n## Getting Real with an API\n\nLet's recap what happens during the component\
    \ lifecycle. Your component gets initialized by the constructor. After that, it\
    \ renders for the first time. But you can prevent it from displaying anything,\
    \ because the local state is null. It is allowed to return null in order to display\
    \ nothing. Then `componentDidMount()` lifecycle method runs. In that method you\
    \ fetch the data from the Hacker News API. Once the data arrives, it changes your\
    \ internal state in `setSearchTopStories()`. Afterward, the update lifecycle comes\
    \ into place because the state was updated. The component runs the `render()`\
    \ method again, but this time with populated result in your internal component\
    \ state.\n\nThere are third-party packages you can use to substitute the fetch\
    \ API: superagent and axios.\n\nKeep in mind that the book builds up on JavaScript's\
    \ truthfulness. In the previous example, `if (result)` was used in favor of `if\
    \ (result === null)`. The same applies for other cases that the book too. For\
    \ instance, `if (!list.length)` is used in favor of `if (list.length === 0)` or\
    \ `if (someString)` is used in favor of `if (someString === '')`. Read up about\
    \ the topic if you are not familiar with it.\n\nBack to your application: The\
    \ list of hits should be visible. Now, there are two regression bugs in apply.\
    \ First, the \"Dismiss\" button is broken. It doesn't know about the complex result\
    \ object and operates on the plain list from the local state when dismissing an\
    \ item. Second, when the list is displayed you try to search for something else,\
    \ the list gets filtered on the clientside even when the initial search was made\
    \ by searching for things on the serverside. The perfect behavior would be to\
    \ fetch another object from the API when using the Search component. Both regression\
    \ bugs will be fixed in the following chapters.\n\n## Exercises:\n\n- read about\
    \ ES6 template strings⁹²\n- read more about the native fetch API⁹³\n- read more\
    \ about data fetching in React⁹⁴\n\n> ⁹⁰ https://github.com/visionmedia/superagent\n\
    ⁹¹ https://github.com/mzabriskie/axios\n⁹² https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Template_literals\n\
    ⁹³ https://developer.mozilla.org/en/docs/Web/API/Fetch_API\n⁹⁴ https://www.robinwieruch.de/react-fetching-data/\n"
