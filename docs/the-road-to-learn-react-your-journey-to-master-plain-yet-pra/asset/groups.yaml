    interactions\">\n          ...\n          { result &&\n            <Table\n  \
    \            list={result.hits}\n              onDismiss={this.onDismiss}\n  \
    \          />\n          }\n        </div>\n      </div>\n    );\n  }\n}\n```\n\
    \n```\n/>\n<div className=\"interactions\">\n  <Button onClick={() => this.fetchSearchTopStories(searchTerm,\
    \ page + 1)}>\n    More\n  </Button>\n</div>\n);\n  }}\n```\n\n```javascript\n\
    setSearchTopStories(result) {\n  const { hits, page } = result;\n\n  const oldHits\
    \ = page === 0\n    ? this.state.hits\n    : [];\n\n  const updatedHits = [\n\
