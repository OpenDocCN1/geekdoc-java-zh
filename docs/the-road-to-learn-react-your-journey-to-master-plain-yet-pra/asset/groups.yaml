    # Snapshot Tests with Jest


    The book will not dive deeply into the topic of testing, but it shouldn''t be
    unmentioned. Testing your code in programming is essential and should seen as
    mandatory. You want to keep the quality of your code high and an assurance that
    everything works.


    Perhaps you have heard about the testing pyramid. There are end-to-end tests,
    integration tests and unit tests. If you are not familiar with these, the book
    gives you a quick and basic overview. A unit function is used to test an isolated
    and small block of code. It can be a single function that is tested by an unit
    test. However, sometimes the units work well in isolation don''t work in combination
    with other units. Where integration tests can help out covering which units work
    well together. Last not least, the end-to-end test is the simulation of a real
    user scenario. It is an automated setup in a browser simulating the login flow
    of an user in a web application. While unit tests are fast and easy to write and
    to maintain, end-to-end tests are the opposite of this spectrum.


    How many tests of each type? You want many unit tests to cover your functions.
    After that, you can have several integration tests to cover the most important
    functions work in combination, you might want to have only a few end-to-end tests
    to simulate critical scenarios in your web application. That''s it for the general
    excursion in the world of testing.


    So how do you apply this knowledge in testing your React application? The foundation
    for testing in React are components which can be generalized as unit tests and
    a part of it as snapshot tests. You will conduct unit tests for your components
    in the next chapter by using a library called Enzyme. In this chapter, you will
    focus on another kind of tests: snapshot tests. That''s were Jest comes into.


    Jest¹¹⁵ is a JavaScript testing framework that is used at Facebook. In the React
    community, it is used for React component tests. Fortunately create-react-app
    already comes with Jest, so you don''t need to worry about setting it up.


    Let''s start to test your first components. Before you can do that, you have to
    export the components, which you are going to test, from your src/App.js file.
    Afterward you can test them in a different file. You have learned about this in
    the code organization chapter.


    > ¹¹⁵https://facebook.github.io/jest/'
- md: "\n# Code Organization and Testing\n\nsrc/App.js\n\n```javascript\nclass App\
    \ extends Component {\n  \n}\n```\n\n```javascript\nexport default App;\n\nexport\
    \ {\n  Button,\n  Search,\n  Table,\n};\n```\n\nIn your App.test.js file, you\
    \ will find a first test that came with create-react-app. It verifies that the\
    \ App component would render without any errors.\n\nsrc/App.js\n\n```javascriptimport\
    \ React from 'react';\nimport ReactDOM from 'react-dom';\nimport App from './App';\n\
    \nit('renders without crashing', () => {\n  const div = document.createElement('div');\n\
    \  ReactDOM.render(<App />, div);\n  ReactDOM.unmountComponentAtNode(div);\n});\n\
    ```\n\nThe \"it-blocks describes one test case. It comes with a test description\
    \ and when you test it, it can either succeed or fail. Furthermore, you could\
    \ wrap it into a \"describe\" block that defines your test suite. A test suite\
    \ could include a bunch of the \"it-blocks\" for specific component. You will\
    \ see those \"describe-blocks\" later on. Both blocks are used to separate and\
    \ organize your test cases.\n\nNote that the it function is acknowledged in the\
    \ JavaScript community as the function where you run a single test. However, in\
    \ Jest it is often found as an alias function.\n\nYou can run your test cases\
    \ using the interactive create-react-app test script on the command line. You\
    \ will get the output for all test cases on your command line interface.\n\n#\
    \ Command Line\n\n```\nnpm test\n```\n\nJest enables you to write snapshot tests.\
    \ These tests make a snapshot of a rendered component and run this snapshot against\
    \ future snapshots. When a future snapshot changes, you will get notified in the\
    \ test. You can either accept the snapshot change, because you changed the implementation\
    \ on purpose, or deny the change and investigate for the error. It complements\
    \ tests very well, because you only test the diffs of the rendered output. It\
    \ doesn't add maintenance costs, because you can simply changed snapshots when\
    \ you changed something for the rendered output in your component.\n\nJest stores\
    \ the snapshots in a folder. Only that way can it validate the diff against a\
    \ future snapshot. Additionally, the snapshots can be shared across teams by having\
    \ them in one folder.\n\nBefore writing your first snapshot test with Jest, you\
    \ have to install a utility library.\n\n# Command Line\n\n```\nnpm install --save-dev\
    \ react-test-renderer\n```\n\nYou can extend the App component test with your\
    \ first snapshot test. Import the new functionality from the node package and\
    \ wrap your previous \"it\" block for the App component into a descriptive \"\
    describe\" block. In this case, the test suite is only for the App component.\n\
    \nsrc/App.test.js\n\n```javascript\nimport React from 'react';\nimport ReactDOM\
    \ from 'react-dom';\nimport renderer from 'react-test-renderer';\nimport App from\
    \ './App';\n```\n\n```javascript\ndescribe('App', () => {\n\n  it('renders without\
    \ crashing', () => {\n    const div = document.createElement('div');\n    ReactDOM.render(<App\
    \ />, div);\n    ReactDOM.unmountComponentAtNode(div);\n  });\n});\n```\n\nNow\
    \ you can implement your first snapshot test by using a \"test-block\".\n\nsrc/App.test.js\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import renderer from 'react-test-renderer';\nimport App from './App';\n\ndescribe('App',\
    \ () => {\n  it('renders without crashing', () => {\n    const div = document.createElement('div');\n\
    \    ReactDOM.render(<App />, div);\n    ReactDOM.unmountComponentAtNode(div);\n\
    \  });\n\n  test('has a valid snapshot', () => {\n    const component = renderer.create(\n\
    \      <App />\n    );\n    let tree = component.toJSON();\n    expect(tree).toMatchSnapshot();\n\
