  - "[PAGE 49]\n\n# Basics in React\n\nin the onClick handler is enclosed by another\
    \ function. It is an arrow function. That way, you can sneak in the object property\
    \ of the item to identify the item that will be dismissed. An alternative way\
    \ would be to define the function outside of the onClick handler and only pass\
    \ the defined function to the handler. A later chapter will explain the topic\
    \ of handlers in elements more detail.\n\nDid you notice the multiline for the\
    \ button element? Note that elements with multiple attributes get messy as one\
    \ line at some point. That's why the button element is used with multilines and\
    \ indentations to keep it readable. It is not mandatory. It is only a code style\
    \ recommendation that I highly recommend.\n\nNow how to implement the onDismiss()\
    \ functionality. It takes an id to identify the item to dismiss. The function\
    \ is bound to the class and becomes a class method. That's why you access it with\
    \ this.onDismiss() and not onDismiss(). In order to define the onDismiss() as\
    \ class method, you have to bind it in the constructor. Bindings are explained\
    \ in another chapter later.\n\nsrc/App.js\n\n```\nclass App extends Component\
    \ {\n  constructor(props) {\n    super(props);\n    this.state = {\n      list,\n\
    \    };\n    this.onDismiss = this.onDismiss.bind(this);\n  }\n  render() {\n\
    \    ...\n  }\n}\n```\n\nIn the next step, you have to define its functionality,\
    \ the business logic, in your class. Class methods can be defined the the following\
    \ way."
