    );\n```\n\n# Exercises:\n\n- open the dialog with React\n- read more about rendering\
    \ elements⁷\n\n> 7 https://reactjs.org/docs/dom-elements.html#all-supported-html-attributes\n\
    \n# Hot Module Replacement\n\nThere is one thing that you can do in your file\
    \ to improve your development experience as a developer. But it is optional and\
    \ shouldn't overwhelm you when learning.\n\nIn create-react-app it is an advantage\
    \ that the browser automatically refreshes when you change your code. Try by changing\
    \ the variable in your App.js file. The browser should refresh the page. But there\
    \ is a better way of doing it.\n\nHot Module Replacement (HMR) is a tool to reload\
