  - "[PAGE 39]\n\n# ES6 Classes\n\nJavaScript ES6 introduced classes. A class is commonly\
    \ used in object-oriented programming languages. JavaScript was and is very flexible\
    \ in its programming paradigms. You can do functional programming and object-oriented\
    \ programming side by side for their particular use cases.\nEven though React\
    \ embraces functional programming, for instance with immutable data structures,\
    \ classes are used to declare components. They are ES6 class components. React\
    \ mixes the good of both programming paradigms.\n\nLet's consider the following\
    \ Developer class to examine a JavaScript ES6 class without thinking about component.\n\
    \n# Code Playground\n\n```\nclass Developer {\n  constructor(firstname, lastname)\
    \ {\n    this.firstname = firstname;\n    this.lastname = lastname;\n  }\n\n \
    \ getName() {\n    return this.firstname + ' ' + this.lastname;\n  }\n}\n```\n\
    \nA class has a constructor to make it instantiable. The constructor can take\
    \ arguments to assign it to the class instance. Additionally a class can define\
    \ functions. Because the function is associated with a class, it is called a method.\
    \ Often it is referred as a class method.\n\nThe Developer class is only the class\
    \ declaration. You can create multiple instances of the class by invoking it.\
    \ It is similar to the ES6 class component, that has a declaration, but you have\
    \ to use it somewhere else to instantiate it.\n\nLet's see how you can instantiate\
    \ the class and how you can use its methods.\n\n# Code Playground\n\n```\nconst\
    \ robin = new Developer('Robin', 'Wieruch');\nconsole.log(robin.getName());\n\
    // output: Robin Wieruch\n```\n\nReact uses JavaScript ES6 classes for ES6 class\
    \ components. You already used one ES6 class component."
- md: "\n# Introduction to React\n\nsrc/App.js\n\n```javascript\nimport React, { Component\
    \ } from 'react';\n\n...\n\nclass App extends Component {\n  render() {\n    ...\n\
    \  }\n}\n```\n\nThe App class extends Component. Basically you declare the App\
    \ component, but it extends from another component. What does extend mean? In\
    \ object-oriented programming you have the principle of inheritance. It is used\
    \ to pass over functionalities from one class to another.\n\nThe App class extends\
    \ functionality from the Component class. To be more specific, it inherits functionalities\
    \ from the Component class. The Component class is used to extend a basic ES6\
    \ class to a ES6 component. It has all the functionalities that a component in\
    \ React needs to have. The render method is one of these functionalities that\
    \ you have already used. You will learn about other component methods later on.\n\
    \nThe Component class encapsulates all the implementation details of a React component.\
    \ It enables developers to use classes as components in React.\n\nThe methods\
    \ a React Component exposes is the public interface. One of these methods has\
    \ to be overridden, others you don't need to be overridden. You will learn about\
    \ the latter ones when the book arrives at lifecycle methods in a later chapter.\
    \ The render() method has to be overridden, because it defines the output of a\
    \ React Component. It has to be defined.\n\nNow you know the basics around JavaScript\
    \ ES6 classes and how they are used in React to extend them to components. You\
    \ will learn more about the Component methods when the book describes React lifecycle\
    \ methods.\n\n# Exercises:\n\n- read more about ES6 classes⁶³\n\nYou have learned\
    \ to bootstrap your own React application! Let’s recap the last chapters:\n\n\
    - React\n  - create-react-app bootstraps a React application\n  - JSX mixes up\
    \ HTML and JavaScript to define the output of React components in their render\
    \ methods\n  - components, instances and elements are different things in React\n\
    \  - ReactDOM.render() is an entry point for a React application to hook React\
    \ into the DOM\n  - built-in JavaScript functionalities can be used in JSX\n \
    \ - map can be used to render a list of items as HTML elements\n- ES6\n  - variable\
    \ declarations with const and let can be used for specific use cases\n  - use\
    \ const over let in React applications\n  - arrow functions can be used to keep\
    \ your functions concise\n  - classes are used to define components in React by\
    \ extending them\n\nIt makes sense to take a break at this point. Internalize\
    \ the learnings and apply them on your own. You can experiment with the source\
    \ code you have written so far. You can find the source code in the official repository⁴.\n\
    \n> ⁴https://github.com/the-road-to-react/hackernews-client/tree/5.1\n\n# Basics\
    \ in React\n\nThe chapter will guide you through the basics of React. It covers\
    \ state and interactions in components, because static components are a bit dull,\
    \ aren't they? Additionally, you will learn about the different ways to declare\
    \ a component and how to keep components composable and reusable. Be prepared\
    \ to breathe life into your components.\n\n# Internal Component State\n\nInternal\
    \ component state, also known as local state, allows you to save, modify and delete\
    \ properties that are stored in your component. The ES6 class component can use\
    \ a constructor to initialize internal component state later on. The constructor\
    \ is called only once when the component initializes.\n\nLet's introduce a class\
    \ constructor.\n\nsrc/App.js\n\n```javascript\nclass App extends Component {\n\
    \n  constructor(props) {\n    super(props);\n  }\n\n  ...\n\n}\n```\n\nWhen having\
    \ a constructor in your ES6 class component, it is mandatory to call super();\
    \ because the App component is a subclass of Component. Hence the extends Component\
    \ in your component declaration. You will learn more about ES6 class components\
    \ later on.\n\nYou can call super(props); as well. It sets this.props in your\
    \ constructor in case you want to access them in the constructor. Otherwise, when\
    \ accessing this.props in your constructor, it would be undefined. You will learn\
    \ more about the props of a React component later on.\n\nNow, in your case, the\
    \ initial state in your component should be the sample list of items.\n\nsrc/App.js\n\
    \n```javascript\nconst list = [\n  {\n    title: 'React',\n    url: 'https://facebook.github.io/react/',\n\
    \    author: 'Jordan Walke',\n    num_comments: 3,\n    points: 4,\n    objectID:\
    \ 0,\n  },\n  ...\n];\n```\n\n# Basics in React\n\n```javascript\nclass App extends\
    \ Component {\n  constructor(props) {\n    super(props);\n\n    this.state = {\n\
    \      list: list,\n    };\n  }\n}\n```\n\nThe state is bound to the class by\
    \ using this object. Thus you can access the local state in your whole component.\
