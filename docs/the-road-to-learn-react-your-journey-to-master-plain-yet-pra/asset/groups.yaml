  mdcn: "\n\n## React 基础\n\n在 `onClick` 处理器中被另一个函数包裹。这是一个箭头函数。通过这种方式，你可以悄悄传入项对象的属性，以识别要移除的项。另一种方法是在\
    \ `onClick` 处理器之外定义该函数，并仅将定义的函数传递给处理器。后面的章节将更详细地介绍元素中处理器的主题。\n\n你注意到 `button`\
    \ 元素使用了多行写法吗？注意，具有多个属性的元素如果写成一行，会变得混乱。这就是为什么 `button` 元素使用了多行和缩进来保持可读性。这不是强制性的，这只是我强烈推荐的一种代码风格建议。\n\
    \n现在如何实现 `onDismiss()` 功能。它接收一个 `id` 来标识要移除的项。该函数绑定到类并成为一个类方法。这就是为什么你通过 `this.onDismiss()`\
    \ 而不是 `onDismiss()`。为了将 `onDismiss()` 定义为类方法，你必须在构造函数中对其进行绑定。绑定将在后面的章节中解释。\n\n\
    ### src/App.js\n\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = {\n      list,\n    };\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n  render() {\n    ...\n  }\n}\n```\n\n在下一步中，你必须在类中定义它的功能，即业务逻辑。类方法可以按照以下方式定义。\n\
    \n### src/App.js\n\n```javascript\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      list,\n    };\n\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n\n  onDismiss(id) {\n    ...\n  }\n\n  render()\
    \ {\n    ...\n  }\n}\n```\n\n现在你能够定义类方法内部发生了什么。基本上，你想要从列表中移除由 `id` 标识的项，并将更新后的列表存储到本地状态中。之后，更新后的列表将在重新运行的\
    \ `render()` 方法中使用并进行显示。被移除的项不应该再次出现。\n\n你可以使用 JavaScript 内置的 `filter` 功能从列表中移除项。`filter`\
    \ 函数接收一个函数作为输入。该函数可以访问列表中的每个值，因为它遍历了列表。通过这种方式，你可以根据过滤条件评估列表中的每个项。如果某个项的评估结果为 `true`，则该项保留在列表中；否则，它将从列表中过滤掉。此外，重要的是，该函数返回一个新列表，而不是修改旧列表。它支持\
    \ React 中关于不可变数据结构的约定。\n\n## React 基础\n\n### src/App.js\n\n```javascript\nonDismiss(id)\
    \ {\n  const updatedList = this.state.list.filter(function isNotId(item) {\n \
    \   return item.objectID !== id;\n  });\n}\n```\n\n在下一步中，你可以提取该函数并将其传递给 `filter`\
    \ 函数。\n\n### src/App.js\n\n```javascript\nonDismiss(id) {\n  function isNotId(item)\
    \ {\n    return item.objectID !== id;\n  }\n\n  const updatedList = this.state.list.filter(isNotId);\n\
    }\n```\n\n此外，你可以使用 JavaScript ES6 箭头函数更简洁地实现。\n\n### src/App.js\n\n```javascript\n\
    onDismiss(id) {\n  const isNotId = item => item.objectID !== id;\n  const updatedList\
    \ = this.state.list.filter(isNotId);\n}\n```\n\n你甚至可以再次将其内联，就像你在 `button` 的 `onClick`\
    \ 处理器中做的那样，但可能会降低可读性。\n\n### src/App.js\n\n```javascript\nonDismiss(id) {\n  const\
    \ updatedList = this.state.list.filter(item => item.objectID !== id);\n}\n```\n\
    \n现在列表移除了被点击的项。但状态还没有更新。因此，你终于可以使用 `setState()` 方法来更新组件内部状态中的列表。\n\n### src/App.js\n\
    \n```javascript\nonDismiss(id) {\n  const isNotId = item => item.objectID !==\
    \ id;\n  const updatedList = this.state.list.filter(isNotId);\n  this.setState({\
    \ updatedList });\n}\n```\n\n现在你能够定义类方法内部发生了什么。基本上，你想要从列表中移除由 `id` 标识的项，并将更新后的列表存储到本地状态中。之后，更新后的列表将在重新运行的\
