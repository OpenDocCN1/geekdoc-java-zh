    \ React';\n    return (\n      <div className=\"App\">\n        <h2>{helloWorld}</h2>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n# Exercises:\n\n\
    - read more about JSX55\n- read more about ES656\n- why do they use\n- why are\
