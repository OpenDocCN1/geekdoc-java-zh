  - "[PAGE 68]\n\n# src/App.js\n\n```\nfunction isSearched(searchTerm) {\n  return\
    \ function(item) {\n    // some condition which returns true or false\n  }\n}\n\
    \nclass App extends Component {\n  ...\nn\n```\n\nThe function takes the searchTerm\
    \ and returns another function, after all the filter function takes a function\
    \ as its input. The returned function has access to the item object it is the\
