    \n# 驯服状态\n\n之前的章节已经向你展示了在大型应用程序中，状态管理可能是一个至关重要的话题。通常情况下，不仅是 React，许多 SPA（单页应用）框架都为此苦恼。近年来，应用程序变得越来越复杂。如今\
    \ Web 应用程序面临的一个大挑战是如何驯服并控制状态。\n\n与其他解决方案相比，React 已经迈出了大步。单向数据流和在组件中管理状态的简单 API\
    \ 是不可或缺的。这些概念让你更容易理解你的状态以及状态的变化。它使得在组件层面以及在一定程度上的应用层面进行推理变得更容易。\n\n在一个不断增长的应用程序中，理解状态变化变得越来越困难。在\
    \ `setState()` 中使用对象而非函数来操作状态时可能会引入 bug。你必须在组件之间提升状态以共享必要的状态，或者隐藏不必要的状态。可能会出现这种情况：一个组件在组件树中离得非常远，而它的兄弟组件又依赖于它。你可能需要在整个组件树中共享状态。结论是，组件对状态管理的参与程度更高了。但根结底，组件的主要职责应该是表示\
    \ UI，不是吗？\n\n正因为所有这些原因，存在一些独立的解决方案来处理状态管理。这是一个强大的领域。你可以使用不同的解决方案来解决你的问题。为了解决状态管理扩展的问题，你可能听过\
    \ Redux¹³⁷ 或 MobX¹³⁸ 。你可以在 React 应用中使用其中任何一种解决方案。随之而来的是扩展程序 `react-redux`¹³⁹ 和\
    \ `mobx-react`¹⁴⁰，将它们集成到 React 视图层中。\n\nRedux 和 MobX 不在本本书的涵盖范围内。当你读完这本书后，将获得关于如何继续学习\
    \ React 及其生态系统的指导。一条学习路径可以是学习 React。在你深入研究外部状态管理话题之前，我建议阅读这篇文章¹⁴¹。它旨在让你对如何学习外部状态管理有更好的理解。\n\
    \n# 练习：\n\n- 阅读外部状态管理以及如何学习它¹⁴²\n- 查看我关于 React 状态管理的第二本电子书¹⁴³\n\n¹³⁷ https://redux.js/docs/introduction/\n\
