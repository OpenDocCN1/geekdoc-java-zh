    \ with Time Travel^58 by Dan Abramov\n\n# Complex JavaScript in JSX\n\nLet's get\
    \ back to your App component. So far you rendered some primitive variables in\
    \ your JSX. Now you will start to render a list of items. The list will be sample\
    \ data in the beginning, but later you will fetch the data from an external API.\
    \ That will be far more exciting.\n\nFirst you have to define the list of items.\n\
    \n```\nsrc/App.js\nimport React, { Component } from 'react';\nimport './App.css';\n\
    \nconst list = [\n{\n    title: 'React',\n    url: 'https://facebook.github.io/react/',\n\
    \    author: 'Jordan Walke',\n    num_comments: 3,\n    points: 4,\n    objectID:\
    \ 0,\n},\n{\n    title: 'Redux',\n    url: 'https://github.com/reactjs/redux',\n\
    \    author: 'Dan Abramov, Andrew Clark',\n    num_comments: 2,\n    points: 5,\n\
    \    objectID: 1,\n}\n];\n\nclass App extends Component {\n}\n```\n\nThe sample\
    \ data will reflect the data we will fetch later from the API. An item in the\
    \ list has a title, an url and an author. Additionally it comes with an identifier,\
    \ points (which indicate how popular an article is) and a count of comments.\n\
    \nNow you can use the built-in JavaScript map functionality in JSX. It enables\
    \ you to iterate over your list of items to display them. Again you will use curly\
    \ braces to encapsulate the JavaScript expression in your JSX.\n\n> https://www.robinswieruch.de/what-is-an-api-javascript/\n\
    \n# Introduction to React\n\nsrc/App.js\n\n```\nclass App extends Component {\n\
    \  render() {\n    return (\n      <div className=\"App\">\n        {list.map(function(item)\
    \ {\n          return <div>{item.title}</div>\n        })}\n      </div>\n   \
    \ );\n  }\n}\n\nexport default App;\n```\n\nUsing JavaScript in HTML is pretty\
    \ powerful in JSX. Usually you might have used map to convert one list of items\
    \ to another list of items. This time you use map to convert a list of items to\
    \ HTML elements.\n\nSo, only the title will be displayed for each item. Let's\
    \ display some more of the item properties.\n\nsrc/App.js\n\n```\nclass App extends\
    \ Component {\n  render() {\n    return (\n      <div className=\"App\">\n   \
    \     {list.map(function(item) {\n          return (\n            <div>\n    \
    \          <span>\n                <a href={item.url}>{item.title}</a>\n     \
    \         </span>\n              <span>{item.author}</span>\n              <span>{item.num_comments}</span>\n\
    \              <span>{item.points}</span>\n            </div>\n          )\n \
    \       })}\n      </div>\n    );\n  }\n}\n```\n\n# Introduction to React\n\n\
    }\n\nexport default App;\n\nYou can see how the map function is simply inlined\
    \ in the JSX. Each item property is displayed in a `<span>` tag. Moreover the\
    \ url property of the item is used in the `href` attribute of the anchor tag.\
    \ React will do all the work for you and display each item. But you should add\
    \ one helper for React to embrace its full potential and improve its performance.\
    \ You have to assign a key attribute to each list element. That React is able\
    \ to identify added, changed and removed items when the list changes. The sample\
    \ list items come with an identifier already.\n\nsrc/App.js\n\n```\n{list.map(function(item)\
    \ {\n  return (\n    <div key={item.objectID}>\n      <span>\n        <a href={item.url}>{item.title}</a>\n\
    \      </span>\n      <span>{item.author}</span>\n      <span>{item.num_comments}</span>\n\
    \      <span>{item.points}</span>\n    </div>\n  );\n})}}\n```\n\nYou should make\
    \ sure that the key attribute is a stable identifier. Don’t make the mistake of\
    \ using index of the item in the array. The array index isn't stable at all. For\
    \ instance, when the list changes its order, React will have a hard time identifying\
    \ the items properly.\n\nsrc/App.js\n\n```\n// don’t do this\n{list.map(function(item,\
    \ key) {\n  return (\n    <div key={key}>\n      </div>\n  );\nn}}\n```\n\nYou\
    \ are displaying both list items now. You can start your app, open your browser\
    \ and see both items of the list displayed.\n\n# Exercises:\n\n- read more about\
