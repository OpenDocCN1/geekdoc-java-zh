    \n# Taming the State\n\nThe previous chapters have shown you that state management\
    \ can be a crucial topic in larger applications. In general, not only React but\
    \ lot of SPA frameworks struggle with it. Applications get more complex in the\
    \ recent years. One big challenge in web applications nowadays is to tame and\
    \ control the state.\n\nCompared to other solutions, React already made a big\
    \ step forward. The unidirectional data flow and a simple API to manage state\
    \ in component are indispensable. These concepts make it easier to reason about\
    \ your state and your state changes. It makes it easier to reason about it on\
    \ a component level and to a certain degree on an application level.\n\nIn a growing\
    \ application, it gets harder to reason about state changes. You can introduce\
    \ bugs by operating on state when using an object over function in setState().\
    \ You have to lift state around share necessary or hide unnecessary state across\
    \ components. It can happen that a component is far away in the component tree\
    \ and its sibling depends on. Perhaps you have to share the state across the whole\
    \ component tree. In conclusion components get involved to a greater extent in\
    \ state management. But after all, the main responsibility of components should\
    \ be representing the UI, shouldn't it?\n\nBecause of all these reasons, there\
    \ exist standalone solutions to take care of the state management. A powerful\
    \ place. You can use different solutions to solve your problems. To address the\
    \ problem of scaling state management, you might have heard of the libraries Redux¹³⁷\
    \ or MobX¹³⁸. You can use either of these solutions in a React application. With\
    \ them, come with extensions, react-redux¹³⁹ and mobx-react¹⁴⁰, integrate them\
    \ into the React view layer.\n\nRedux and MobX are outside the scope of this book.\
    \ When you have finished the book, you will get guidance on how you can continue\
    \ to learn React and its ecosystem. One learning path could be learn React. Before\
    \ you dive into the topic of external state management, I can recommend to read\
    \ this article¹⁴¹. It aims to give you a better understanding of how to learn\
    \ external state management.\n\n# Exercises:\n\n- read about external state management\
    \ and how to learn it¹⁴²\n- check out my second ebook about state management in\
    \ React¹⁴³\n\n¹³⁷ https://redux.js/docs/introduction/\n¹³⁸ https://mobx.js/\n\
    ¹³⁹ https://github.com/reactjs/react-redux\n¹⁴⁰ https://github.com/mobjs/mobx-react\n\
    ¹⁴¹ https://www.robinwierch.de/redux-mobx-confusion/\n¹⁴² https://www.robinwierch.de/redux-mobx-confusion/\n\
    ¹⁴³ https://roadoreact.com/\n\nState Management in React and beyond\n\nYou have\
    \ learned advanced state management in React! Let’s recap the last chapters:\n\
    - React\n- lift state management up and down to suitable components\n- setState\
    \ can use a function to prevent stale state bugs\n- existing external solutions\
    \ that help you to tame the state\n\n> ¹⁴⁴https://github.com/the-road-to-learn-react/hackernews-client/tree/5.6\n\
    \n# Final Steps to Production\n\nThe last chapters will show you how to deploy\
    \ your application to production. You will use the free hosting service Heroku.\
    \ On the way to deploy your application, you will learn more about create-react-app.\n\
    \n# Eject\n\nThe following step and knowledge is **not necessary** to deploy your\
    \ application to production. Still, I want to explain it to you. create-react-app\
    \ comes with one feature to keep it extensible also to prevent a vendor lock-in.\
    \ A vendor lock-in usually happens when you buy into a technology but there is\
    \ no escape hatch having it in the future. Fortunately in create-react-app you\
    \ have such an escape hatch with \"eject\".\n\nIn your package.json you will find\
    \ the scripts to start, test and build your application. The last script is **eject**.\
    \ You could try it, but there is no way back. **It is a one-way operation. Once\
    \ you eject, you can't go back!** If you just started to learn React, it makes\
    \ no sense to leave the convenient environment of create-react-app.\n\nIf you\
    \ run npm run eject, the command would copy all the configuration and dependencies\
    \ to your package.json and a new config/ folder. You would convert the whole project\
    \ into a custom setup with tooling that includes Babel and Webpack. After all,\
    \ you would have full control over these tools.\n\nThe official documentation\
    \ says create-react-app is suitable for small to mid size projects. You shouldn't\
    \ feel obligated to use the \"eject\" command.\n\n# Exercises:\n\n- read more\
    \ about eject¹145\n\n> ¹145 https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup\n\
    \n# Deploy your App\n\nIn the end, no application should stay on localhost. You\
    \ want to go live. Heroku is a platform as a service where you host your application.\
    \ They offer a seamless integration with React. It's possible to deploy your-app\
    \ in minutes.\n\nYou need to fulfill two requirements before you can deploy it:\n\
    - install the Heroku¹46\n- create a free Heroku account¹47\n\n# Command Line\n\
    \nNow you can use the CLI:\n\n```bash\nbrew install\n```\n```bash\ngit init\n\
    ```\n```bash\ngit add\n```\n```bash\ngit commit -m \"your\"\n```\n```bash\ngit\
    \ push master\n```\n```bash\nheroku open\n```\nThat's it. If your application\
    \ is up and running, check the following resources:\n- Git and GitHub¹48\n- Deploying\
    \ with Zero Configuration¹49\n- Heroku¹150\n\n> ¹46 https://www.robinwierch.de/redux-mobx-confusion/\n\
    > ¹47 https://www.robinwierch.de/redux-mobx-confusion/\n> ¹48 https://github.com/\n\
    > ¹49 https://www.robinwierch.de/redux-mobx-confusion/\n> ¹150 https://github.com/\n\
    \n# Outline\n\nThat was the last chapter of the book. I hope you enjoyed reading\
    \ it and that it helped you get traction in React. If you liked the book, share\
    \ it with your friends. If you are looking for further extensions, I recommend:\n\
    \n- State Management: You have used setState() and this state to manage local\
    \ state. However, in a larger application you will experience the limits of React's\
    \ local state¹154. Therefore you can use a third-party state management library\
    \ like Redux or MobX¹155. On the course Road to Redux¹156 you will find the \"\
    Taming the State\" that teaches advanced state in React, Redux and MobX. The course\
    \ comes with an ebook as well, but I recommend everyone to dive into the source\
    \ code and screenshots too.\n- Connecting to a Databaseor Authentication: In a\
    \ growing application, you might want to persist data eventually. The data should\
    \ be stored in a database so that it can survive a browser session and be shared\
