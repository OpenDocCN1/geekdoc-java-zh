  mdcn: "\n\n# 受控组件\n\n你已经学习了 React 中的单向数据流。同样的规则也适用于输入字段，它通过用 `searchTerm` 更新本地状态来过滤列表。当状态变化时，`render()`\
    \ 方法会再次运行，并使用来自本地状态的最新 `searchTerm` 来应用过滤条件。\n\n但我们不是在输入元素中遗漏了什么吗？HTML 的 `input`\
    \ 标签带有一个 `value` 属性。该属性具有在输入字段中显示的值。在这种情况下，它将是 `searchTerm` 属性。然而，在 React 中我们似乎不需要它。\n\
    \n那是错的。在原生 HTML 中，`<input>`、`<textarea>` 和 `<select>` 表单元素拥有自己的状态。当人们从外部更改它时，它们会在内部修改该值。在\
    \ React 中，应该确保让这些元素成为受控组件。\n\n你应该如何做？你只需要设置输入字段的 `value` 属性。该值已经保存在 `searchTerm`\
    \ 状态属性中了。为什么不从那里访问它呢？\n\n```\nsrc/App.js\n\nclass App extends Component {\n  ...\n\
    \  render() {\n    const { searchTerm, list } = this.state;\n    return (\n  \
    \    <div className=\"App\">\n        <form>\n          <input\n            type=\"\
    text\"\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        ...\n      </div\n    );\n  }\n}\n```\n\
    \n就是这样。输入字段的单向数据流循环现在是自包含的。内部组件状态是输入字段的单一事实源（single source of truth）。\n\n整个内部状态管理和单向数据流对你来说可能是全新的。但一旦你习惯了，它将成为你在\
    \ React 中实现功能的自然流程。通常来说，React 将单向数据流的新模式引入了单页应用世界。现在它已经被多个框架和库采用。\n\n# 练习：\n\n\
    - 了解更多关于 React 表单^{71}\n- 了解更多关于不同的受控组件^{72}\n\n> 71 https://reactjs.org/docs/forms.html\n\
    > 72 https://github.com/the-road-to-learn-react/react/react-controlled-components-examples\n\
    \n# 分拆组件\n\n你现在有一个大型的 `App` 组件。它会不断增长，最终可能会变得混乱。你可以开始将其拆分为若干个较小的组件块。\n\n让我们开始为搜索输入使用一个组件，为项目列表使用一个组件。\n\
    \n```\nsrc/App.js\nclass App extends Component {\n  ...\n  render() {\n    const\
