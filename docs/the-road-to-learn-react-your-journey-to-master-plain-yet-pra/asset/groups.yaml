    \          className=\"button-inline\"\n        >\n          Dismiss\n       \
    \ </Button>\n      </span>\n    </div>\n  ))\n</div>>)\n```\n\n现在样式是内联的。你可以在元素外部定义样式对象以使代码更整洁。\n\
    \n# 代码游场\n\n```javascript\nconst largeColumn = {\n  width: '40%',\n}\n```\n\n\
    ```javascript\nconst midColumn = {\n  width: '30%',\n}\n```\n\n```javascript\n\
    const smallColumn = {\n  width: '10%',\n}\n```\n\n之后，你将在列中使用它们：`<span style={smallColumn}>`。\n\
    \n总来说，你会发现关于 React 样式的不同观点和解决方案。你现在已经使用了纯 CSS 和内联样式。这对于入门来说足够了。我不想带有偏见，但我想为你留一些选择。你可以阅读它们并根据自己的情况进行应用。但如果你是\
    \ React 初学者，我建议目前先坚持纯 CSS 和内联样式。\n\n- styled-components\n- Modules\n\n你已经学习了编写自己应用程序的基础知识！让我们回顾一下最后几章：\n\
    \n- React\n- 使用 `setState()` 管理内部状态\n- 将函数或类方法传递给你的处理器\n- React 中的表单和事件以添加交互\n\
    - 单向数据流是 React 中的一个重要概念\n- 受控组件\n- 使用 children 和可复用组件进行组合\n- ES6 类组件和函数组件的使用与实现\n\
    - 样式方法\n- ES6\n- 绑定到类的方法\n- 对象和数组的解构\n- 默认参数\n- 通用\n- 高阶函数\n\n再次强调，休息一下是有意义的。内化所学内容并将其应用于你自己的。你可以在官方仓库找到你编写的代码：https://github.com/the-road-to-learn-react/hackernews-client/tree/52\n\
    \n# 实战 API\n\n现在是时候实战 API 了，因为处理数据可能会很枯燥。如果你不熟悉 API，我鼓励你阅读相关主题。在本书中，你将使用 Hacker\
    \ News API 从平台获取故事。基础 API 是为了从平台获取数据。获取的数据将（存储在内部状态中，以便在 `render()` 生命周期中显示。你可以访问以下链接以了解数据结构：\n\
    \n- https://www.robinwier.de/what-is-api-javascript\n- https://news.combinator.com/\n\
    - https://github.com/HackerNews/API\n- https://algolia.com/api\n\n# 生命周期方法\n\n\
    在开始使用 API 获取组件数据之前，你需要了解 React 生命周期方法。这些方法钩入 React 组件的生命周期。它们可以用于 ES6 类组件，但不能用于函数组件。你还记得上一章关于\
    \ JavaScript ES6 类以及它们如何使用的部分吗？除了 `render()` 方法，还有几个方法可以被重写。让我们深入了解它们：\n\n你已经知道了用于\
    \ ES6 类组件的两个生命方法：`constructor()` 和 `render()`。`constructor` 只在组件实例创建并插入 DOM 时调用。`render()`\
    \ 方法在挂载过程中调用，也会在组件更新时调用。每当组件的状态或 props 变化时，`render()` 方法就会被调用。现在你更多关于这些生命方法以及它们何时被调用的知识。组件的挂载（mounting）有两个生命方法：`componentWillMount()`\
    \ 和 `componentDidMount()`。`constructor` 首先调用，`componentWillMount()` 在 `render()`\
    \ 方法之前调用，而 `componentDidMount()` 在 `render()` 方法之后调用。总来说，挂载过程有 4 个生命方法，它们按以下顺序执行：\n\
    \n- `constructor()`\n- `componentWillMount()`\n- `render()`\n- `componentDidMount()`\n\
    \n但是状态或 props 变化时的组件更新生命周期呢？总来说它有 5 个生命方法，顺序如下：\n\n- `componentReceiveProps()`\n\
    - `shouldComponentUpdate()`\n- `componentWillUpdate()`\n- `render()`\n- `componentDidUpdate()`\n\
    \n# 实战 API\n\n最后但同样重要的是卸载（unmounting）生命周期。它只有一个生命方法：`componentWillUnmount()`。\n\
    \n最后，你不需要一开始就了解所有这些生命方法。这可能令人生望畏，但你不会使用所有的它们。即使在 React 应用中，你只会在 `constructor()`\
    \ 和 `render()` 方法周围使用其中的几个。尽管如此，了解每个生命方法可以用于特定情况：\n\n- **constructor(props)**\
    \ - 在组件初始化时调用。你可以在该生命方法期间设置初始组件状态并绑定类方法。\n- **componentWillMount()** - 在 `render()`\
    \ 生命周期之前调用。这就是它可以用于设置内部组件状态，因为它将触发组件的渲染。\n- **render()** - 该方法是强制的，并将元素作为输出。方法应该是纯的，因此不应修改组件状态。它接收\
    \ props 作为输入。\n- **componentDidMount()** 它只在组件挂载时调用。这是从 API 请求异步数据的完美时机。获取的数据将存储在内部状态中，以便在\
    \ `render()` 生命周期中显示。\n- **componentReceiveProps(nextProps)** - 该生命方法在更新生命周期期间调用。当你获取下一个\
    \ props 时，你可以将下一个 props 与之前的 props 进行对比，使用这些 props 来应用不同的行为。此外，你可以在 next props\
    \ 上设置状态。\n- **shouldComponentUpdate(nextProps, nextState)** - 组件更新状态或 props 时总是会被调用。你将在\
    \ React 应用中使用来进行性能优化。根据你从此生命周期返回的布尔值，组件及其所有子组件将在更新生命周期上渲染或不渲染。你可以阻止组件的 render\
    \ 方法。\n- **componentWillUpdate(nextProps, nextState)** - 该生命方法在 `render()` 方法之前立即调用。你可以使用\
    \ next props 和状态。你可以使用该方法作为执行 render 方法之前进行准备工作的最后机会。注意，你不能随时触发 `setState()`。如果你想在\
    \ next props 上计算状态，必须使用 `componentReceiveProps()`。\n- **componentDidUpdate(prevProps,\
    \ prevState)** - 该生命方法在 `render()` 方法之后立即调用。你可以利用它执行 DOM 操作或执行进一步异步请求的机会。\n- **componentWillUnmount()**\
    \ - 在销毁组件之前调用。你可以使用该生命方法执行任何清理任务。\n\n`constructor()` 和 `render()` 生命周期方法已经由你使用了。这些是\
    \ ES6 类组件中常用的生命方法。实际上，`render()` 方法是必须的，否则你将无法返回组件实例。\n"
