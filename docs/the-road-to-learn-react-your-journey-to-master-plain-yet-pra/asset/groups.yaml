    \ you can keep the application state with HMR. Imagine you have a dialog in your\
    \ application with multiple steps and you are at step 3. Basically it is a wizard.\
    \ Without HMR you would change the source code and your browser refreshes the\
    \ page. You would have to open the dialog again and would have to navigate from\
    \ step 1 to step 3. With HMR your dialog stays open\n"
  mdcn: "\n\n# React 简介\n\n渲染块中的内容看起来与 HTML 非常相似，但它是 JSX。JSX 允许你将 HTML 和 JavaScript\
    \ 混合使用。当你习惯了将 HTML 和 JavaScript 分离，这会让你感到困惑。这就是为什么一个好的起点是在 JSX 中使用基础 HTML。刚开始，删除文件中所有干扰性的的内容。\n\
    \nsrc/App.js\n\n```javascript\nimport React, { Component } from 'react';\nimport\
    \ './App.css';\n\nclass App extends Component {\n  render() {\n    return (\n\
    \      <div className=\"App\">\n        <h2>Welcome to the Road to learn React</h2>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n现在，你只在 `render()`\
    \ 方法中返回 HTML 而不包含 JavaScript。让我们把 \"Welcome to the Road to learn React\" 定义为一个变量。你可以使用大括号在\
    \ JSX 中使用变量。\n\nsrc/App.js\n\n```javascript\nimport React, { Component } from\
    \ 'react';\nimport './App.css';\n\nclass App extends Component {\n  render() {\n\
    \    var helloWorld = 'Welcome to the Road to learn React';\n    return (\n  \
    \    <div className=\"App\">\n        <h2>{helloWorld}</h2>\n      </div>\n  \
    \  );\n  }\n}\n\nexport default App;\n```\n\nReact 简介\n\n当你再次在命令行中使用 `npm start`\
    \ 启动应用程序时，它应该可以工作。\n\n此外，你可能已经注意 `className` 属性。它反映了 HTML 中标准的类属性。由于技术原因，JSX 必须替换一些内部\
    \ HTML 属性。你可以在 React 文档52 中找到所有支持的 HTML 属性。它们都遵循驼峰命名法（camelCase）。在学习 React 的过程中，你会遇到更多的\
    \ JSX 属性。\n\n# 练习：\n\n- 定义更多变量并在 JSX 中渲染它们\n- 使用复杂对象来表示具有名字和姓氏的用户\n- 在 JSX 中渲染用户属性\n\
    - 了解更多关于 JSX53\n- 了解更多关于 React 组件、元素和实例54\n\n> 52 https://reactjs.org/docs/dom-elements.html#all-supported-html-attributes\n\
    > 53 https://reactjs.org/docs/introducing-jsx.html\n> 54 https://facebook.github.io/react/blog/2015/12/18/react-components-elements-and-instances.html\n\
    \n# ES6 const 和 let\n\n我想你已经注意到我们用 `var` 声明了变量 `hello`。JavaScript ES6 提供了另外两个选项来声明变量：`const`\
    \ 和 `let`。在 JavaScript ES6 中，你很少能再看到 `var`。\n\n用 `const` 声明的变量不能被重新赋值或重新声明。它不能被变异（改变、修改）。通过使用它，你拥了不可变的数据结构。一旦定义了数据结构，你就无法更改它。\n\
    \n代码沙场\n\n```javascript\n// not allowed\nconst helloWorld = 'Welcome to the Road\
    \ to learn React';\nhelloWorld = 'Bye Bye React';\n```\n\n用 `let` 声明的变量可以变异。\n\
    \n代码沙场\n\n```javascript\n// allowed\nlet helloWorld = 'Welcome to the Road to\
    \ learn React';\nhelloWorld = 'Bye Bye React';\n```\n\n当你需要重新赋值变量时可以使用它。\n\n然而，你必须小心使用\
    \ `const`。用 `const` 声明的变量不能被修改。但当变量是一个数组或对象时，它所持的值是可以更新的。它所持的值不是不可变的。\n\n代码沙场\n\
    \n```javascript\nconst helloWorld = {\n  text: 'Welcome to the Road to learn React';\n\
    };\nhelloWorld.text = 'Bye Bye React';\n```\n\n但是什么时候使用每种声明呢？关于用法有不同的意见。我建议尽可能使用\
    \ `const`。它表示你想要保持数据结构的不可变性，尽管对象和数组中的值可以被修改。如果你想修改你的变量，可以使用 `let`。\n\n不可变性在 React\
    \ 及其生态系统中是被推崇的。这就是为什么在定义变量时，`const` 应该是你的默认选择。尽管如此，在复杂对象内部的值是可以修改的。请注意这种行为。\n\n\
    在你的应用程序中，你应该使用 `const` 而不是 `var`。\n\nReact 简介\n\nsrc/App.js\n\n```javascript\n\
    import React, { Component } from 'react';\nimport './App.css';\nclass App extends\
    \ Component {\n  render() {\n    const helloWorld = 'Welcome to the Road to learn\
    \ React';\n    return (\n      <div className=\"App\">\n        <h2>{helloWorld}</h2>\n\
    \      </div>\n    );\n  }\n}\n\nexport default App;\n```\n\n# 练习：\n\n- 了解更多关于\
    \ JSX55\n- 了解更多关于 ES656\n- 它们为什么要使用\n- 它们为什么被推崇\n\n> 55 https://reactjs.org/docs/dom-elements.html#all-supported-html-attributes\n\
    > 56 https://reactjs.org/docs/introducing-jsx.html\n\n# ReactDOM\n\n在你继续操作之前，你可能需要它。它是：\n\
    \nsrc/index.js\n\n```javascript\nimport React from 'react';\nimport ReactDOM from\
    \ 'react-dom';\nimport App from './App';\nimport './App.css';\n```\n\n```javascript\n\
    ReactDOM.render(\n  <App />,\n  document.getElementById('root')\n);\n```\n\n代码沙场\n\
    \n```javascript\nReactDOM.render(\n  <h1>Hello World</h1>\n  document.getElementById('root')\n\
    );\n```\n\n# 练习：\n\n- 打开对话框\n- 了解更多关于元素⁷\n\n> 7 https://reactjs.org/docs/dom-elements.html#all-supported-html-attributes\n\
    \n# 热模块替换\n\n你可以在文件中做一件事来提升你的开发体验。但它是可选的，不至于在你学习时感到压力。\n\n在 create-react-app 中，当你更改代码时浏览器会自动刷新，这是一个优势。尝试更改\
    \ App.js 文件中的变量。浏览器应该刷新页面。但有一种更好的方法。\n\n热模块替换（HMR）是一种在浏览器中重新加载应用程序的工具。浏览器不再执行页面刷新。你可以在\
    \ create-react-app 中轻松激活它。在你的 React 入口 src/index.js 中，你添加一个配置：\n\nsrc/index.js\n\
    \n```javascript\nimport React from 'react';\nimport ReactDOM from 'react-dom';\n\
    import App from './App';\nimport './App.css';\n\nReactDOM.render(\n  <App />,\n\
    \  document.getElementById('root')\n);\n\nif (module.hot) {\n  module.hot.accept();\n\
    }\n```\n\n"
