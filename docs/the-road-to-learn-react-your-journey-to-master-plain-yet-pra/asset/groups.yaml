    # How to read it?


    The book is my attempt to teach React while you will write an application. It
    is a practical guide to learn React and not a reference work about React. You
    will write a Hacker News application that interacts with a real world API. Among
    several interesting topics, it covers state management in React, caching and interactions
    (sorting and searching). On the way you will learn best practices and patterns
    in React.


    In addition, the book gives you a transition from JavaScript ES5 to JavaScript
    ES6. React embraces a lot of JavaScript ES6 features and I want to show you how
    you use them.


    In general, each chapter of the book will build up on the previous chapter. Each
    chapter will teach you something new. Don''t rush through the book. You should
    internalize each step. You could apply your implementations and read more about
    the topic. After each chapter I give you some reading material and exercises.
    If you really want to learn React, I highly recommend read the extra material
    and do some hands on exercises. After you have read a chapter, make yourself comfortable
    with the learnings before you continue.


    In the end, you will have a complete React application in production. I am very
    keen to see your results, please text me when you have finished the book. The
    final chapter of the book will give you a handful of options to continue your
    React journey. In general you will find a lot of React topics on my personal website^{28}.


    Since you are reading the book, I guess you are new to React. That''s perfect.
    In the end, I hope to get your feedback to improve the material to everyone to
    learn React. You can have a direct impact on GitHub^{29} or text me Twitter^{30}.


    28https://www.robinwuerch.de/


    29https://github.com/rwuerch/the-road-to-learn-react


    30https://twitter.com/rwuerch'
