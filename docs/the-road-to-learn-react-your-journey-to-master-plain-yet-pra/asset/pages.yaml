  md: 'Getting Real with an API


    # Axios instead of Fetch


    In one of the previous chapters, you have introduced the native fetch API to perform
    a request to the Hacker News. The browser enables you to use this native fetch
    API. However, not all browsers, especially older browsers, support it. In addition,
    once you start to test your application in a headless browser environment (there
    is no browser, it is only mocked), there can be issues regarding the fetch API.
    Such a headless browser environment can happen when writing and executing tests
    for your application that doesn''t run in a real browser. There are a couple of
    ways to make fetch work in older browsers (polyfills) and in tests (isomorphic-fetch¹⁰⁸),
    but we won''t go down this rabbit hole in this book.


    An alternative way to solve it would be to substitute the native fetch API with
    a stable library like axios¹⁰⁹. Axios is a library solves only one problem, but
    it solves it with a high quality: performing asynchronous requests to remote APIs.
    That''s why you will use it. On a concrete level, the chapter should show how
    you can substitute a library (which is a native API of the browser in this case)
    with another library. On an abstract level, it should show you how you can find
    a solution for the quirks (e.g. old browsers, headless browser tests) in web development.
    So never stop to look for solutions if anything gets in your way.


    Let''s see how the native fetch API can be substituted with axios. Everything
    said before sounds difficult than it is. First, you have to install axios on the
    command line:


    # Command Line


    ```

    npm install axios

    ```


    Second, you can import axios in your App component''s file:


    ```

    src/App.js


    import React, { Component } from ''react'';

    import axios from ''axios'';

    import ''./App.css'';


    ...

    ```


    And but not last, you can use fetch(). Its usage looks almost identical to the
    native fetch API. It takes the URL as argument and returns a promise. You don''t
    have to transform the returned response to JSON anymore. Axios is doing it for
    you and wraps the result into a data object in JavaScript. Make sure to adapt
    your code to the returned structure.'
