  md: "# State Management in React and beyond\n\nover an object. The function can\
    \ live outside of the component. But you have to use a higher-order function to\
    \ pass the result to it. After all, you want to update the state based on the\
    \ fetched result from the API.\n\n```\nsrc/App.js\nsetSearchTopStories(result)\
    \ {\n  const { hits, page } = result;\n  this.setState(updateSearchTopStoriesState(hits,\
    \ page));\n}\n```\n\nThe updateSearchTopStoriesState() function has to return\
    \ a function. It is a higher-order function. You can define this higher-order\
    \ function outside of your App component. Note how the function signature changes\
    \ slightly now.\n\n```\nsrc/App.js\nconst updateSearchTopStoriesState = (hits,\
    \ page) => (prevState) => {\n  const { searchKey, results } = prevState;\n\n \
    \ const oldHits = results && results[searchKey]\n    ? results[searchKey].hits\n\
    \    : [];\n\n  const updatedHits = [\n    ...oldHits,\n    ...hits\n  ];\n\n\
    \  return {\n    ...results,\n    [searchKey]: { hits: updatedHits, page }\n \
    \   isLoading: false\n  };\n};\n\nclass App extends Component {\n  ...\n};\n```\n\
    \nThat's it. The function over an object approach in setState() fixes potential\
    \ bugs yet increases readability and maintainability of your code. Furthermore,\
    \ it becomes testable outside of the App component. You could export it and write\
    \ a test for it as exercise."
