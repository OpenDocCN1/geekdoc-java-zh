  md: '# Client Cache


    Each search submit makes a request to the Hacker News API You might search for
    "redux", followed by "react" and eventually "redux" again. In total it makes 3
    requests. But you searched for "redux" twice and times it took a whole asynchronous
    roundtrip to fetch the data. In a client-sided cache you would store each result.
    When a request to the API is made, it checks if a result is already there. If
    it is, the cache is used. Otherwise an API request is made to fetch the data.


    In order to have a client cache for each result, you have to store multiple results
    rather than one result in your internal component state. The results object will
    be a map with the search term as key and result as value. Each result from the
    API will be saved by search term (key).


    At the moment, your result in the local state looks similar to the following:


    # Code Playground


    ```

    result: {

    hits: [ ... ],

    page: 2,

    }

    ```


    Imagine you have made two API requests. One for the search term "redux" and another
    one for "react". The results object should look like the:


    # Code Playground


    ```

    results: {

    redux: {

    hits: [ ... ],

    page: 2,

    },

    react: {

    hits: [ ... ],

    page: 1,

    },

    }

    }

    ```


    Let''s implement a client-side cache with React useState(). rename the result
    object to results in the initial component state. Second, define a temporary searchKey
    which is used to store each result.'
