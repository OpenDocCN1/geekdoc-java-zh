  md: "# ES6 Destructuring\n\nThere is a way in JavaScript ES6 for an easier access\
    \ to properties in objects and arrays. It's called destructuring. Compare the\
    \ following snippet in JavaScript ES5 and ES6.\n\nCode Playground\n\n```\nconst\
    \ user = {\n  firstname: 'Robin',\n  lastname: 'Wieruch'\n}\n\n// ES5\nvar firstname\
    \ = user.firstname;\nvar lastname = user.lastname;\n\nconsole.log(firstname +\
    \ ' ' + lastname);\n// output: Robin Wieruch\n\n// ES6\nconst { firstname, lastname\
    \ } = user;\n\nconsole.log(firstname + ' ' + lastname);\n// output: Robin Wieruch\n\
    ```\n\nWhile you have to add an extra line each time you want to access an object\
    \ property in JavaScript ES5, you can do it in one line in JavaScript ES6. A best\
    \ practice for readability is to use multilines when you destructure an object\
    \ into multiple properties.\n\nCode Playground\n\n```\nconst {\n  firstname,\n\
    \  lastname\n} = user;\n```\n\nThe same goes for arrays. You can destructure them\
    \ too. Again, multilines will keep your code scannable and readable."
  merge: -1
