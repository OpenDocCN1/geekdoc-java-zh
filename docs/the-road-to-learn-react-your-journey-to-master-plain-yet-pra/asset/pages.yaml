  md: "# Introduction to React\n\n}\n\nexport default App;\n\nYou can see how the\
    \ map function is simply inlined in the JSX. Each item property is displayed in\
    \ a `<span>` tag. Moreover the url property of the item is used in the `href`\
    \ attribute of the anchor tag. React will do all the work for you and display\
    \ each item. But you should add one helper for React to embrace its full potential\
    \ and improve its performance. You have to assign a key attribute to each list\
    \ element. That React is able to identify added, changed and removed items when\
    \ the list changes. The sample list items come with an identifier already.\n\n\
    src/App.js\n\n```\n{list.map(function(item) {\n  return (\n    <div key={item.objectID}>\n\
    \      <span>\n        <a href={item.url}>{item.title}</a>\n      </span>\n  \
    \    <span>{item.author}</span>\n      <span>{item.num_comments}</span>\n    \
    \  <span>{item.points}</span>\n    </div>\n  );\n})}}\n```\n\nYou should make\
    \ sure that the key attribute is a stable identifier. Don’t make the mistake of\
    \ using index of the item in the array. The array index isn't stable at all. For\
    \ instance, when the list changes its order, React will have a hard time identifying\
    \ the items properly.\n\nsrc/App.js\n\n```\n// don’t do this\n{list.map(function(item,\
    \ key) {\n  return (\n    <div key={key}>\n      </div>\n  );\nn}}\n```\n\nYou\
    \ are displaying both list items now. You can start your app, open your browser\
    \ and see both items of the list displayed."
