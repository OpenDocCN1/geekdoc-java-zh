  md: "# src/App.js\n\n```\nfunction isSearched(searchTerm) {\n  return function(item)\
    \ {\n    // some condition which returns true or false\n  }\n}\n\nclass App extends\
    \ Component {\n  ...\nn\n```\n\nThe function takes the searchTerm and returns\
    \ another function, after all the filter function takes a function as its input.\
    \ The returned function has access to the item object it is the function that\
    \ is passed to the filter function. In addition, the returned function will be\
    \ used to filter the list based on the condition defined in the function. Let's\
    \ define the condition.\n\n# src/App.js\n\n```\nfunction isSearched(searchTerm)\
    \ {\n  return function(item) {\n    return item.title.toLowerCase().includes(searchTerm.toLowerCase());\n\
    \  }\n}\n```\n\nThe condition says that you match the incoming searchTerm pattern\
    \ with the title property of the item from your list. You can do that with the\
    \ built-in JavaScript functionality. Only when the pattern matches, you return\
    \ true and the item stays in the list. When the pattern doesn't match the item\
    \ is removed from the list. Be careful with pattern matching: You shouldn't forget\
    \ to lower case strings. Otherwise there will be mismatches between a search term\
    \ 'redux' and an item title 'Redux'. Since we are working on an immutable list\
    \ and return a new list using the filter function, the original list in the local\
    \ state is not modified at all.\n\nOne thing is left to mention: We cheated a\
    \ bit by using the built-in includes JavaScript functionality. It is already an\
    \ ES6 feature. How would that look in JavaScript ES5? You would use the indexOf()\
    \ function to get the index of the item in the list. When the item is in the list,\
    \ indexOf() will return its index in the array."
