    \nShallow renders the component without its child components. That way, you can\
    \ make the test very dedicated to one component.\n\nEnzyme has overall three rendering\
    \ mechanisms in its API. You already know shallow(), but there also exist mount()\
    \ and render(). Both instantiate instances of the parent component and all child\
    \ components. Additionally mount() gives you access to the component lifecycle\
    \ methods. But when to use which mechanism? Here some rules of thumb:\n\n+   •\
    \ Always begin with a shallow test\n• If ComponentDidMount() or componentDidUpdate()\
    \ should be tested, use mount()\n• If you want to test component lifecycle and\
    \ children behavior, use mount()\n• If you want to test a component's rendering\
    \ with less overhead than mount() and you are not interested in lifecycle methods,\
    \ use render()\n\nYou could continue to test your components. But make sure to\
    \ keep the tests simple and maintainable. Otherwise you will have to refactor\
