    \ = ['Robin', 'Andrew'];\nconst newUsers = ['Dan', 'Jordan'];\nconst allUsers\
    \ = [ ...oldUsers, ...newUsers ];\n```\n\n```\nconsole.log(allUsers);\n// output:\
    \ ['Robin', 'Andrew', 'Dan', 'Jordan']\n```\n\nNow let's a look at the spread\
    \ operator. It is not JavaScript ES6. It is a proposal for a next JavaScript version*\
    \ yet already used by the React community. That's why we create-react-app incorporated\
    \ the feature in the configuration.\n\nBasically it is the same as the JavaScript\
    \ ES6 array operator but with objects. It copies each key value pair into a new\
