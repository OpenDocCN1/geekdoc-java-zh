  md: '# Folder Structure


    ```

    hackernews/

    README.md

    node_modules/

    package.json

    .gitignore

    public/

    favicon.ico

    index.html

    manifest.json

    src/

    App.css

    App.js

    App.test.js

    index.css

    index.js

    logo.svg

    registerServiceWorker.js

    ```


    A short break down of the folder and files. It is fine if you don''t understand
    all of them in the beginning.


    +   - README.md: The md extension indicates that the file is a markdown file.
    Markdown is used as a lightweight markup language with plain text formatting syntax.
    When source code projects with a README.md file give you initial instructions
    about the project. When pushing your project to a platform such as GitHub eventually,
    the README.md file will show its content properly when you access the repository.
    Because you have used create-react-app, your README.md should be the same as one
    in the official create-react-app GitHub repository⁴⁹.

    - node_modules/: The folder holds all packages that were installed via npm. Since
    you have used create-react-app, there should be a couple of node modules installed
    for your project. Usually you will never touch this folder, but only install and
    uninstall node packages from the command line.

    - package.json: The file shows you a list of node package dependencies and other
    project configuration.

    - .gitignore: The file indicates all files and folders that shouldn''t be added
    to your remote repository when using it. The node_modules/ folder is such a case.
    It is sufficient to share the package.json file with your peers to enable them
    to install all dependencies on their own without sharing the whole dependency
    folder.


    > ⁴⁹https://github.com/facebookincubator/create-react-app'
