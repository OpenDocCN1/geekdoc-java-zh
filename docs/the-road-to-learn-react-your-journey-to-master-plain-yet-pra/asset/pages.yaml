    \ the data we will fetch later from the API. An item in the list has a title,\
    \ an url and an author. Additionally it comes with an identifier, points (which\
    \ indicate how popular an article is) and a count of comments.\n\nNow you can\
    \ use the built-in JavaScript map functionality in JSX. It enables you to iterate\
    \ over your list of items to display them. Again you will use curly braces to\
