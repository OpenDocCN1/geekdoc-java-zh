  md: "# Unidirectional Data Flow\n\nNow you have some internal state in your App\
    \ component. However, you have not manipulated the local state. The state is static\
    \ and thus is the component. A good way to experience state manipulation is to\
    \ have some component interaction.\n\nLet's add a button for each item in the\
    \ displayed list. The button says “Dismiss” and is going to remove the item from\
    \ the list. It could be useful eventually when you only want to keep a list of\
    \ unread items and dismiss the items that you are not interested in.\n\n```\n\
    src/App.js\nclass App extends Component {\n  ...\n  render() {\n    return (\n\
    \      <div className=\"App\">\n        {this.state.list.map(item => (\n     \
    \     <div key={item.id}>\n            <span>\n              <a href={item.url}>{item.title}</a>\n\
    \            </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
    \            <span>{item.points}</span>\n            <span>\n              <button\n\
    \                onClick={() => this.onDismiss(item.id)}\n                type=\"\
    button\">\n              Dismiss\n            </button>\n            </span>\n\
    \          </div>\n        ))}\n      </div>\n    );\n  }\n}\n```\n\nThe onDismiss()\
    \ class method is not defined yet. We will do it in a moment, but for now the\
    \ focus should be on the onClick handler of the button element. As you can see,\
    \ the onDismiss() method"
