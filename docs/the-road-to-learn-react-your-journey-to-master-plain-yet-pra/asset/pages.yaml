  md: "# Interactions with Forms and Events\n\nLet's add another interaction for the\
    \ application to experience forms and events in React. The interaction is a search\
    \ functionality. The input of the search field should be used to temporarily filter\
    \ your list based on the title property of an item.\n\nIn the first step, you\
    \ are going to define a form with an input field in your JSX.\n\n```\nsrc/App.js\n\
    \nclass App extends Component {\n  ...\n  render() {\n    return (\n      <div\
    \ className=\"App\">\n        <form>\n          <input type=\"text\" />\n    \
    \    </form>\n        {this.state.list.map(item => (\n          ...\n        ))}\n\
    \      </div>\n    );\n  }\n}\n```\n\nIn the following scenario you will type\
    \ into the input field and filter the list temporarily by the search term that\
    \ is used in the input field. To be able to filter the list based on the value\
    \ of the input field, you need to store the value of the input field in your local\
    \ state. But how do you access the value? You can use synthetic events in React\
    \ to access the event payload.\n\nLet’s define an onChange handler for the input\
    \ field."
