    \ => this.onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n</button>\n\
    ```\n\nThat's already a complex use case, because you have to pass a value to\
    \ the class method and thus you\nhave to wrap it into another (arrow) function.\
    \ So basically, it has to be a function that is passed to the\nevent handler.\
    \ The following code wouldn't work, because the class method would be executed\n\
    immediately when you open the application in the browser.\n\nsrc/App.js\n\n```\n\
    <button\n  onClick={this.onDismiss(item.objectID)}\n  type=\"button\"\n>\n  Dismiss\n\
    </button>\n```\n\nWhen using onClick={doSomething()}, the doSomething() function\
    \ would execute immediately\nwhen you open the application in your browser. The\
    \ expression in the handler is evaluated.\nthe returned value of the function\
    \ isn't a anymore, nothing would happen when you click\nthe button. But when using\
    \ onClick={doSomething()} whereas doSomething is a function, it would\nbe executed\
    \ when clicking the button. The same rules apply for the onDismiss() class method\
    \ that\nis used in your application."
