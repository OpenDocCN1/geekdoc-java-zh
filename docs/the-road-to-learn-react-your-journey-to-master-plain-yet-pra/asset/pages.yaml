  md: "# Controlled Components\n\nYou already learned about the unidirectional data\
    \ flow in React. The same law applies for the input field, which updates the local\
    \ state with the searchTerm in order to filter the list. When the state changes,\
    \ the render() method runs again and uses the recent searchTerm from the local\
    \ state to apply the filter condition.\n\nBut didn't we forget something in the\
    \ input element? A HTML input tag comes with a value attribute. The attribute\
    \ has the value that is shown in the input field. In this case it would be the\
    \ searchTerm property. However, it seems like we don't need that in React.\n\n\
    That's wrong. Forms elements as <input>, <textarea> and <select> hold their own\
    \ state in plain HTML. They modify the value internally when someone changes it\
    \ from the outside. In React that should make sure to make those elements controlled\
    \ components.\n\nHow should you do that? You only have to set the value attribute\
    \ of the input field. The value is already saved in the searchTerm state property.\
    \ Why not access it from there?\n\n```\nsrc/App.js\n\nclass App extends Component\
    \ {\n  ...\n  render() {\n    const { searchTerm, list } = this.state;\n    return\
    \ (\n      <div className=\"App\">\n        <form>\n          <input\n       \
    \     type=\"text\"\n            value={searchTerm}\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        ...\n      </div>\n    );\n  }\n}\n```\n\
    \nThat's it. The unidirectional data flow loop for the input field is self-contained\
    \ now. The internal component state is the single source of truth for the input\
    \ field."
  merge: -1
