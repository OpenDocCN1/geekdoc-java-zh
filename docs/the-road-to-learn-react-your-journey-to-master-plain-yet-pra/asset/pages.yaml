  md: "# Basics in React\n\nsrc/App.js\n\n```\nclass App extends Component {\n  ..\n\
    \n  render() {\n    return (\n      <div className=\"App\">\n        <form>\n\
    \          <input\n            type=\"text\"\n            onChange={this.onSearchChange}\n\
    \          />\n        </form>\n        {this.state.list.filter(...).map(item\
    \ =>\n          \n        ))}\n      </div>\n    );\n  }\n}\n```\n\nLet's approach\
    \ the filter function in a different way this. We want to define the filter argument,\
    \ the function that is passed to the filter function, outside of the ES6 class\
    \ component. We don't have access to the state of the component and thus we have\
    \ no access to the searchTerm property to evaluate the filter condition. We have\
    \ to pass the searchTerm to the filter function and have to return a new function\
    \ to evaluate the condition. That's called a higher-order function.\n\nNormally\
    \ I wouldn't mention higher-order functions, but in a React book it makes total\
    \ sense. It makes sense to know about higher-order functions, because React deals\
    \ with a concept called higher-order components. You will get to know the concept\
    \ later in the book. Now again, let's focus on the filter functionality.\n\nFirst,\
    \ you have to define the higher-order function outside of your App component."
