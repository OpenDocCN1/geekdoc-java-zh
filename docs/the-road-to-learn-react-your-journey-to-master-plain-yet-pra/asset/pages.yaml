  md: "# Component Interface with PropTypes\n\nYou may know TypeScript¹¹⁹ Flow¹²⁰\
    \ to introduce a type interface to JavaScript. A typed language is less error\
    \ prone, because the code gets validated on its program text. Editors and other\
    \ utilities can catch these errors before the program runs. It makes your program\
    \ more robust.\n\nIn the book, you will not introduce Flow or TypeScript, but\
    \ another way to check your types in components. React comes with a built-in type\
    \ checker to prevent bugs. You can use PropTypes to describe your component interface.\
    \ All the props that get from a parent component to a child component get validated\
    \ on the PropTypes interface assigned to the child component.\n\nThe chapter will\
    \ show how you can make all your types safe with PropTypes. I will omit the changes\
