  md: "# Lifting State\n\nOnly the App component is a stateful ES6 component in your\
    \ application. It handles a lot of application state and logic in its class methods.\
    \ Maybe you have noticed that you pass a lot of properties to your Table component.\
    \ Most of these props are only used in the Table component. In conclusion one\
    \ argued that it makes no sense the App component knows about them.\n\nThe whole\
    \ sort functionality is only used in the Table component. You could move it into\
    \ the Table component, because the App component doesn't need to know about it\
    \ all. The process of refactoring substate from one component to another is known\
    \ as lifting state. In your case, you want to move state that isn't used in the\
    \ App component into the Table component. The state moves down from parent to\
    \ child component.\n\nIn order to deal with state and class methods in the Table\
    \ component, it has to become an ES6 class component. The refactoring from functional\
    \ stateless component to ES6 class component is straightforward.\n\nYour Table\
    \ component as a functional stateless component:\n\n```\nsrc/App.js\nconst Table\
    \ = ((\nlist,\nsortKey,\nisSortReverse,\nonSort,\nonDismiss\n)) => {\n  const\
    \ sortedSortedList = SORTS[sortKey](list);\nconst reverseSortedList = isSortReverse\n\
    \  ? sortedList.reverse()\n  : sortedList;\n\nreturn(\n  ...\n);\n}\n```\n\nYour\
    \ Table component as an ES6 class component:"
