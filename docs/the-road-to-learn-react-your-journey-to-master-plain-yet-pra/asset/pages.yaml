  md: "# Code Playground\n\n```\n// ES5\nvar userService = {\n  getUserName: function\
    \ (user) {\n    return user.firstname + ' ' + user.lastname;\n  }\n};\n\n// ES6\n\
    const userService = {\n  getUserName(user) {\n    return user.firstname + ' '\
    \ + user.lastname;\n  }\n};\n```\n\nLast but not least, you are allowed to use\
    \ computed property names in JavaScript ES6.\n\n# Code Playground\n\n```\n// ES5\n\
    var user = {\n  name: 'Robin',\n};\n\n// ES6\nconst key = 'name';\nconst user\
    \ = {\n  [key]: 'Robin'\n};\n```\n\nPerhaps computed property names make no sense\
    \ for you yet. Why should you need them? In a later chapter, you will come to\
    \ a point where you can use them to allocate values by key in a dynamic way in\
    \ an object. It's neat to generate lookup tables in JavaScript.\n\n# Exercises:\n\
    \n+   - experiment with ES6 object initializer\n- read more about ES6 object initializer⁶⁶"
