  md: '# Component Declarations


    By now you have four ES6 class components. But you can do better. Let me introduce
    functional stateless components as alternative for ES6 class components. Before
    you refactor your components, let''s introduce the different types of components
    in React.


    +   - **Functional Stateless Components**: These are functions which get an input
    and return an output. The input are the props. The component is an instance thus
    plain JSX. So far it is quite similar to an ES6 class component. However, functional
    stateless components are (functional) and they have no local state (stateless).
    You cannot access or update the state with this.state or this.setState() because
    there is no object. Additionally, they have no lifecycle methods. You didn''t
    learn about lifecycle methods, but you already used two: constructor() and render().
    Whereas the constructor runs once in the lifetime of a component, the render()
    class runs once in the beginning and every time the component updates. Keep in
    mind that functional stateless components have no lifecycle methods, when you
    arrive at lifecycle methods later on.

    - **ES6 Class Components**: You already used this type of declaration in your
    components. In the definition, they extend from the React component. The extends
    all the lifecycle methods, available in the React component API, to the component.
    What you were able to use the render() class method. Additionally, you can store
    and manipulate state in ES6 class components using this.state and this.setState().

    - **React.create**: The component declaration was used in older versions of React
    and still in JavaScript ES5 applications. But Facebook declared it as deprecated
    in favor of JavaScript ES6. They even added a deprecation warning in version 15.5.
    You will not use it in the book.


    So basically there are only two component declarations left. But when to use functional
    stateless components over ES6 class components? A rule of thumb is to use functional
    stateless components when you don''t need local state or lifecycle methods. Usually
    that to implement your components as functional stateless components. Once you
    access to the state or lifecycle methods, you to refactor it to an ES6 class component.
    In our application, we started the other way around for the sake of learning React.


    Let''s get back to your application. The App component uses internal state. That''s
    why it has to stay as an ES6 class component. The other three of your ES6 class
    components are stateless. They don''t need to access this.state or this.setState().
    Even more, they have no lifecycle methods. Let''s refactor the Search component
    to a stateless functional component. The Table and Button refactoring will be
    main your exercise.'
