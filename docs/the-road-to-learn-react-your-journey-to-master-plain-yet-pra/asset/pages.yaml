  md: '# # Fetch Data


    Now you are prepared to fetch data from the Hacker News API. There was one lifecycle
    method mentioned that can be used to fetch data: componentDidMount(). You will
    use the native fetch API in JavaScript to perform the request.


    Before we use it, let''s set up the URL constants and default parameters to breakup
    the request into chunks.


    ```

    import React, { Component } from ''react'';

    import ''./App.css'';

    ```


