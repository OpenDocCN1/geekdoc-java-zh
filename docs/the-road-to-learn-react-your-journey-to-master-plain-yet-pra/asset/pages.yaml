  md: "# Code Organization and Testing\n\n134\n\n# Command Line\n\n```\nnpm test\n\
    ```\n\nJest enables you to write snapshot tests. These tests make a snapshot of\
    \ a rendered component and run this snapshot against future snapshots. When a\
    \ future snapshot changes, you will get notified in the test. You can either accept\
    \ the snapshot change, because you changed the implementation on purpose, or deny\
    \ the change and investigate for the error. It complements tests very well, because\
    \ you only test the diffs of the rendered output. It doesn't add maintenance costs,\
    \ because you can simply changed snapshots when you changed something for the\
    \ rendered output in your component.\n\nJest stores the snapshots in a folder.\
    \ Only that way can it validate the diff against a future snapshot. Additionally,\
    \ the snapshots can be shared across teams by having them in one folder.\n\nBefore\
    \ writing your first snapshot test with Jest, you have to install a utility library.\n\
    \n# Command Line\n\n```\nnpm install --save-dev react-test-renderer\n```\n\nYou\
    \ can extend the App component test with your first snapshot test. Import the\
    \ new functionality from the node package and wrap your previous \"it\"block for\
    \ the App component into a descriptive \"describe\"block. In this case, the test\
    \ suite is only for the App component.\n\nsrc/App.test.js\n\n```\nimport React\
    \ from 'react';\nimport ReactDOM from 'react-dom';\nimport renderer from 'react-test-renderer';\n\
    import App from './App';\n```\n\n```\ndescribe('App', () => {\n\nitit('renders\
    \ without crashing', () => {\n  const div = document.createElement('div');\n \
    \ ReactDOM.render(<App />, div);\n  ReactDOM.unmountComponentAtNode(div);\n});\n\
    \n});\n```\n\nNow you can implement your first snapshot test by using a \"test-block."
