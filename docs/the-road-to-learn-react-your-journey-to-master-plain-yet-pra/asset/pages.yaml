  md: "# Introduction to React\n\nThe -y flag is a shortcut to initialize all the\
    \ defaults in your `package.json`. If you don't use the flag, you have to decide\
    \ how to configure the file. After initializing the npm project you are good to\
    \ install new packages via npm install `<package>`.\n\nOne more word about the\
    \ `package.json`. The file enables you to share your project with other developers\
    \ without sharing all the node packages. The file has all the references of node\
    \ packages used in your project. These packages are called dependencies. Everyone\
    \ can copy your project without the dependencies. These dependencies are references\
    \ in the `package.json`. Someone who copies your project can simply install all\
    \ packages by using npm install on the command line. The `npm install` takes all\
    \ the dependencies listed in the `package.json` file and installs them in the\
    \ `node_modules/` folder.\n\nI want to cover one more npm command:\n\n# Command\
    \ Line\n\n```\nnpm install --save-dev <package>\n```\n\nThe `--save-dev` flag\
    \ indicates that the node package is only used in the development environment.\
    \ It will not be used in production when you deploy your application on a server.\
    \ What kind of node package could that be? Imagine you want to test your application\
    \ with the help of a node package. You need to install that via npm, but want\
    \ to exclude it from production environment. Testing should only happen during\
    \ the development process but not when your application is already running in\
    \ production. There don't want to test your application anymore. It should be\
    \ tested already and work out of the box for your users. That's only one use case\
    \ where you would want to use the `--save-dev` flag.\n\nYou will encounter more\
    \ npm commands on your way. But these will be sufficient for now.\n\n# Exercises:\n\
    \n+   - setup throw away npm project\n  - create a new folder with mkdir <folder_name>\n\
    \  - navigate to the folder with cd <folder_name>\n  - execute npm init -y or\
    \ npm init\n  - install a local package like React with npm install react\n  -\
    \ have a look into the `package.json` file and the `node_modules/` folder\n  -\
    \ find out on your own how to install the `react` node package again\n- read about\
    \ npm³\n\n> https://docs.npmjs.com/"
