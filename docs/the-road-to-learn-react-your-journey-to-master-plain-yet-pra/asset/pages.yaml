  md: "# Basics in React\n\n```\nclass App extends Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      list: list,\n    };\n  }\n\
    }\n```\n\nThe state is bound to the class by using this object. Thus you can access\
    \ the local state in your whole component. For instance, it can be used in the\
    \ render() method. Previously you have mapped a static list of items in your render()\
    \ method that was defined outside of your component. You are about to use the\
    \ list from your local state in your component.\n\nsrc/App.js\n\n```\nclass App\
    \ extends Component {\n  ...\n  render() {\n    return (\n      <div className=\"\
    App\">\n        {this.state.list.map(item => (\n          <div key={item.id}>\n\
    \            <span>\n              <a href={item.url}>{{item.title}</a>\n    \
    \        </span>\n            <span>{item.author}</span>\n            <span>{item.num_comments}</span>\n\
