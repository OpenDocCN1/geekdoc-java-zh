  md: "# Higher-Order Components\n\nHigher-order components (HOC) is an advanced concept\
    \ in React. HOCs are an equivalent to higher-order functions. They take any input\
    \ - most of the time a component, but also optional arguments - return a component\
    \ as output. The returned component is an enhanced version of the input component\
    \ and can be used in your JSX.\n\nHOCs are used for different use cases. They\
    \ can prepare properties, manage state or alter the representation of a component.\
    \ One use case could be use a HOC as a helper for a conditional rendering. Imagine\
    \ you have a List component that renders a list of items or nothing, because the\
    \ list is empty or null. On the other hand, the plain List component doesn't need\
    \ to bother anymore about an non existent list. It only cares about rendering\
    \ the list.\n\nLet's do in your src/App.js which takes a component as input and\
    \ returns a component. You can place it in your src/App.js file.\n\n```\nsrc/App.js\n\
    nfunction withFoo(Component) {\n  return function(props) {\n    return <Component\
    \ {...props} />;\n  }\n}\n```\n\nOne neat convention is to prefix the naming of\
    \ a HOC with with. Since you are using JavaScript ES6, you can express the HOC\
    \ more concisely with an ES6 arrow function.\n\n```\nsrc/App.js\nconst withFoo\
    \ = (Component) => (props) => (\n  <Component {...props} />)\n```\n\nIn the example,\
    \ the input component would stay the same as the output component. Nothing happens.\
    \ It renders the component instance and passes all of props to the output component.\
    \ But that's useless. Let's enhance the output component. The output component\
    \ should show the Loading component, when the loading state is true, otherwise\
    \ it should show the input component. A conditional rendering is a great use case\
    \ for a HOC."
  merge: -1
  pgno: 169
- img_proc: true
  md: "# Advanced React Components\n\nsrc/App.js\n\n```\nconst withLoading = (Component)\
    \ => (props) =>\n  props.isLoading\n    ? <Loading />\n    : <Component {...props}\
    \ />\n```\n\nBased on the property you can use a conditional rendering. The function\
    \ will return the Loading component or the input component.\n\nIn general it can\
    \ be very efficient to spread an object, like the props object in the previous\
    \ example, as input for a component. See the difference in the following code\
    \ snippet.\n\n# Code Playground\n\n```\n// before you would have to destructure\
    \ the props before passing them\nconst { foo, bar } = props;\n<SomeComponent foo={foo}\
    \ bar={bar} />\n\n// but you can use the object spread operator to pass all object\
    \ properties\n<SomeComponent { ...props } />\n```\n\nThere is one little thing\
    \ that you should avoid. You pass all the props including the isLoading property,\
    \ by spreading the object, into the input component. However, the input component\
    \ may not care about the isLoading property. You can use the ES6 rest destructuring\
    \ to avoid it.\n\n# src/App.js\n\n```\nconst withLoading = (Component) => ({ isLoading,\
    \ ...rest }) =>\n  isLoading\n    ? <Loading />\n    : <Component {...rest} />\n\
    ```\n\nIt takes one out of the object, but it takes the remaining object. It works\
    \ with properties as well. You might have already read about it in the destructuring\
    \ assignment¹²⁷.\n\nNow you can use the HOC in JSX. An use case in the application\
    \ could be show either the “More” button or the Loading component. The Loading\
    \ component is already encapsulated in the HOC, in the case of showing a Button\
    \ component or a Loading button, the Button is the input component of the HOC.\
    \ The enhanced component is a ButtonWithLoading component.\n\n> ¹²⁷ https://developer.mozilla.org/en-US/docs/Web/JavaScript/Operators/Destructuring_assignment"
  merge: -1
  pgno: 170
