  md: '# Eject


    The following step and knowledge is **not necessary** to deploy your application
    to production. Still, I want to explain it to you. create-react-app comes with
    one feature to keep it extensible also to prevent a vendor lock-in. A vendor lock-in
    usually happens when you buy into a technology but there is no escape hatch having
    it in the future. Fortunately in create-react-app you have such an escape hatch
    with "eject".


    In your package.json you will find the scripts to start, test and build your application.
    The last script is **eject**. You could try it, but there is no way back. **It
    is a one-way operation. Once you eject, you can''t go back!** If you just started
    to learn React, it makes no sense to leave the convenient environment of create-react-app.


    If you run npm run eject, the command would copy all the configuration and dependencies
    to your package.json and a new config/ folder. You would convert the whole project
    into a custom setup with tooling that includes Babel and Webpack. After all, you
    would have full control over these tools.


    The official documentation says create-react-app is suitable for small to mid
    size projects. You shouldn''t feel obligated to use the "eject" command.


    # Exercises:


    +   - read more about eject¹145


    > ¹145 https://github.com/facebookincubator/create-react-app#converting-to-a-custom-setup'
