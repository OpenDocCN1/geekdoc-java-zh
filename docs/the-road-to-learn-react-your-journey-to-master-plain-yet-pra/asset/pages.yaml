    \ Me\n      </button>\n    );\n  }\n}\n```\n\nWhen trying the button again, this\
    \ object, to be more specific the class instance, should be defined and you would\
    \ be able to access this.state, or as you will later this. props, now.\n\nThe\
    \ class method binding can happen somewhere else too. For instance, it can happen\
    \ in the render() class method."
