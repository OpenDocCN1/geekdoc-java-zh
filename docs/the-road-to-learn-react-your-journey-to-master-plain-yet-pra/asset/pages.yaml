  md: "# Hot Module Replacement\n\nThere is one thing that you can do in the src/index.js\
    \ file to improve your development experience as a developer. But it is optional\
    \ and shouldn't overwhelm you in the beginning when learning React.\n\nIn create-react-app\
    \ it is an advantage that the browser automatically refreshes the page when you\
    \ change your source code. Try by changing the hello variable in your src/App.js\
    \ file. The browser should refresh the page. But there is a better way of doing\
    \ it.\n\nHot Module Replacement (HMR) is a tool to reload your application in\
    \ the browser. The browser doesn't perform a page refresh. You can easily activate\
    \ it in create-react-app. In your src/index.js, your entry point to React, you\
    \ have add one little configuration.\n\nsrc/index.js\n\n```\nimport React from\
    \ 'react';\nimport ReactDOM from 'react-dom';\nimport App from './App';\nimport\
    \ './index.css';\n\nReactDOM.render(\n  <App />,\n  document.getElementById('root')\n\
    );\n\nif (module.hot) {\n  module.hot.accept();\n}\n```\n\nIt's that. Try again\
    \ changing the hello variable in your src/App.js file. The browser shouldn't perform\
    \ a page refresh, but the application reloads and shows the correct output. HMR\
    \ comes with multiple advantages:\n\nImagine you are debugging with console.log()\
    \ statements. These statements will stay in your developer console, even though\
    \ you change your code, because the browser doesn't refresh the page anymore.\
    \ That can be convenient for debugging purposes.\n\nIn a growing application page\
    \ refresh demeans your productivity. You have to wait until the page loads. A\
    \ page reload can take several seconds in a large application. HMR takes away\
    \ this disadvantage.\n\nThe biggest benefit is that you can keep the application\
    \ state with HMR. Imagine you have a dialog in your application with multiple\
    \ steps and you are at step 3. Basically it is a wizard. Without HMR you would\
    \ change the source code and your browser refreshes the page. You would have to\
    \ open the dialog again and would have to navigate from step 1 to step 3. With\
    \ HMR your dialog stays open"
