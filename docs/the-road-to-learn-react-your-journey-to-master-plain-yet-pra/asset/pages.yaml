  md: '# Introduction to React


    +   * public/: The folder holds all your files when building your project for
    production. Eventually all your written code in the src/ folder will be bundled
    into a couple of files when building your project and placed in the public folder.

    * manifest.json and registerServiceWorker.js: don''t worry about what these files
    do at this stage, we won''t be needing them in this project.


    After all, you don''t need to touch the mentioned files and folders. In the beginning
    everything you need is located in the src/ folder. The main focus is on the src/App.js
    file to implement React components. It will be used to implement your application,
    but you might want to split up your components into multiple files whereas each
    file maintains one a few components on its own.


    Additionally, you will find a src/App.js file for your tests and src/index.js
    as entry point to the React world. You will get to know both files in a later
    chapter. In addition, there is a src/index.css and a src/App.css file to style
    your general application and your components. They all come with default style
    when you open them.


    The create-react-app application is an npm project. You can use npm to install
    and uninstall packages to your project. Additionally it comes with the following
    npm scripts for your command line:


    # Command Line


    ```

    // Runs the application in http://localhost:3000

    npm start

    ```


    ```

    // Runs the tests

    npm test

    ```


    ```

    // Builds the application for production

    npm run build

    ```


    The scripts are defined in your package.json. Your boilerplate React application
    is bootstrapped. The exciting part comes in the exercises to finally run your
    bootstrapped application in the browser.


    # Exercises:


    +   * npm start your application and visit the application in your browser (you
    can exit the command by pressing Control + C)

    * run the interactive npm test script

    * run the npm run build script and verify that a build/ folder was added to your
    project (you can remove it again afterward; note that the builder folder can be
    used later on to deploy your application^{50)


    > 50https://www.robinwieruch.de/deploy-applications-digital-ocean/'
