  md: "# Basics in React\n\nsrc/App.js\n\n```\nclass App extends Component {\n  ...\n\
    \  render() {\n    return (\n      <div className=\"App\">\n        {this.state.list.map(item\
    \ => (\n          <div key={item.objectID}>\n            <span>\n            \
    \  <button\n                onClick={() => this.onDismiss(item.objectID)}\n  \
    \              type=\"button\">\n                Dismiss\n              </button>\n\
    \            </span>\n          </div>\n        ))}\n      </div>\n    );\n  }\n\
    }\n```\n\nAnother performance relevant topic, that is often mentioned, the implications\
    \ of using arrow functions in event handlers. For instance, the onClick handler\
    \ for the onDismiss() method is wrapping the method in another arrow function\
    \ to be pass to the item identifier. Every time the render() method runs, the\
    \ handler instantiates the higher-order function. It can have an impact on your\
    \ application performance, but in most cases you will not notice it. Imagine you\
    \ have a huge table of data with 1000 items and each row or column has such an\
    \ arrow function in an event handler. Then it is worth to think the performance\
