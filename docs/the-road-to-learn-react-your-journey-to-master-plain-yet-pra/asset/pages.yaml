    \ of these utility libraries, but you can use whatever library suits you. Let's\
    \ install Lodash and use it for the sort functionality.\n\n# Command Line\n\n\
    ```\nnpm install lodash\n```\n\nNow you can import the sort functionality of Lodash\
    \ in your src/App.js.\n\n```\nsrc/App.js\nimport React, { Component } from 'react';\n\
    import axios from 'axios';\nimport { sortBy } from 'lodash';\nimport './App.css';\n\
    ```\n\nYou have several columns in your Table. There are title, author, comments\
    \ and points columns. You can define sort functions whereas each function takes\
    \ a list and returns a list of items sorted by a specific property. Additionally,\
    \ you will need one default sort function which doesn't sort but only returns\
    \ the unsorted list. That will be your initial state.\n\n```\nsrc/App.js\n...\n\
    const SORTS = {\nNONE: list => list,\nTITLE: list => sortBy(list, 'title'),\n\
    AUTHOR: list => sortBy(list, 'author'),\nCOMMENTS: list => sortBy(list, 'num_comments').reverse(),\n\
    POINTS: list => sortBy(list, 'points').reverse(),\n};\n\nclass App extends Component\
    \ {\n  ...\n}\n...\n```"
