  md: '# node and npm


    This chapter gives you a little course in node and npm. It is not exhaustive,
    but you will get all the necessary tools. If you are familiar with both of them,
    you can skip the chapter.


    The node package manager (npm) allows you to install external node packages from
    the command line. These packages can be a set of utility functions, libraries
    or whole frameworks. They are the dependencies of your application. You can either
    install these packages to your global node package folder or to your local project
    folder.


    Global node packages are accessible from everywhere in the terminal and you have
    to install them only once to your global directory. You can install a global package
    by typing in your terminal:


    # Command Line


    ```

    npm install -g <package>

    ```


    The -g flag tells npm to install the package globally. Local packages are used
    in your application. For instance, React as a library will be a local package
    which can be required in your application for usage. You can install it via the
    terminal by typing:


    # Command Line


    ```

    npm install <package>

    ```


    In the case of React it would be:


    # Command Line


    ```

    npm install react

    ```


    The installed package will automatically appear in a folder called node_modules/
    and will be listed in the package.json file next to your dependencies.


    But how to initialize the node_modules/ folder and the package.json file for your
    project in the first place? There is a npm command to initialize a npm project
    and thus a package.json file. Only when you have that, you can install new local
    packages via npm.


    # Command Line


    ```

    npm init -y

    ```'
