  md: '# # Paginated Fetch


    Did you have a closer look at the returned data structure yet? The Hacker News
    API¹⁰³ returns more than a list of hits. Precisely it returns a paginated list.
    The page property, which is ø in the first response, can be used to fetch paginated
    sublists as result. You only need to pass the next page with the same search term
    to the API.


    Let''s extend the composable API constants that it can deal with paginated data.


    src/App.js


    ```

    const DEFAULT_QUERY = ''redux'';


    const PATH_BASE = ''https://hn.algolia.com/api/v1'';

    const PATH_SEARCH = ''/search/'';

    const PARAM_SEARCH = ''query=;

    const PARAM_PAGE = ''page='';

    ```


    Now you can use the new constant to add the page parameter to your API request.


    # Code Playground


    The fetchSearchTopStories() method will take the page as the second argument.
    If you don''t provide the second argument, it will fallback to the ø page for
    the initial request. The componentDidMount() and onSearch() methods fetch the
    first page on the first request. Every additional fetch should fetch the next
    page by providing the second argument.'
