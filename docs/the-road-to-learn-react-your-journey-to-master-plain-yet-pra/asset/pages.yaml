  md: "# src/App.js\n\n```\nclass App extends Component {\n  constructor(props) {\n\
    \    super(props);\n\n    this.state = {\n      list,\n    };\n\n    this.onDismiss\
    \ = this.onDismiss.bind(this);\n  }\n\n  onDismiss(id) {\n    ...\n  }\n\n  render()\
    \ {\n    ...\n  }\n```\n\nNow you are able to define what happens inside of the\
    \ class method. Basically you want to remove the item identified by the id from\
    \ the list and store an updated list to your local state. Afterward, the updated\
    \ list will be used in the re-running render() method to display it. The removed\
    \ item shouldn't appear anymore.\n\nYou can remove an item from a list using the\
    \ JavaScript built-in filter functionality. The filter function takes a function\
    \ as input. The function has access to each value in the list, because it iterates\
    \ over the list. That way, you can evaluate each item in the list based on a filter\
    \ condition. If the evaluation for an item is true, the item stays in the list.\
    \ Otherwise it will be filtered from the list. Additionally, it is good to know\
    \ that the function returns a new list and doesn't mutate the old list. It supports\
    \ the convention in React of having immutable data structures."
