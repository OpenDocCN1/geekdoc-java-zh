    +   UI Components: You shouldn''t make the mistake to introduce too early a UI
    library in your project. You should first learn how to implement and use a dropdown,
    checkbox or dialog in React with standard HTML elements from scratch. The major
    part of these components will manage their own state. A checkbox has to know whether
    it is checked or not checked. You should implement them as controlled components.
    After you went through all the foundational implementations, can introduce a UI
    library which uses checkboxes and dialogs as React components.


    +   Code Organization: When reading the book, you may come across one chapter
    about code organization. You could apply these changes now, if you haven''t done
