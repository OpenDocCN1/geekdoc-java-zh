    That''s your second option to express conditional rendering. A third option is
    the logical&& operator. In JavaScript a true && ''Hello World'' always evaluates
    to ''Hello World''. A false && ''Hello World'' always evaluates to false.


    # Code Playground


    ```

    const result = true && ''Hello World'';

    console.log(result);

    // output: Hello World

    ```


    ```

    const result = false && ''Hello World'';

    console.log(result);

    // output: false

    ```


    In React you can make use of that behavior. If the condition is true, the expression
    after the logical && operator will be the output. If the condition is false, React
    ignores and skips the expression. It is applicable in the Table conditional rendering
    case, because it should return a Table or nothing.


    # src/App.js


    ```

    { result &&

    <Table

    list={result.hits}

    pattern={searchTerm}

    onDismiss={this.onDismiss}

    />}

    ```


    These were a few approaches to use conditional rendering in React. You can read
    about alternatives in an exhaustive list of examples for conditional rendering
    approaches*. Moreover you will get to know their different use cases and when
    to apply them.


    After all, you should be able to see the fetched data in your application. Everything
    except the Table is displayed when the data fetching is pending. Once the request
    resolves the result and stores it into the local state, the Table is displayed
    and the render() method runs again and the conditional rendering resolves in favor
    of displaying the Table component.


    > * https://www.robinwieruch.de/conditional-rendering-react/'
