  md: '# Lifecycle Methods


    You will need to know about React lifecycle methods before you can start to fetch
    data in your components using an API. These methods are a hook into the lifecycle
    of a React component. They can be used in ES6 class components, but not in functional
    stateless components.


    Do you remember when a previous chapter taught you about JavaScript ES6 classes
    and how they are used in React? Apart from the render() method, there are several
    methods that can be overridden in a React ES6 class component. All of these are
    the lifecycle methods. Let''s dive into them:


    You already know two lifecycle methods that can be used in an ES6 class component:constructor()
    and render().


    The constructor is only called when an instance of the component is created and
    inserted into the DOM. The component is called mounting of component.


    The render() method is called during the mount process, but also when the component
    updates. Each time the state or the props of a component change, the render()
    method of the component is called.


    Now you know more about the two lifecycle methods and when they are called. You
    already know them as well. But there are more of them.


    The mounting of a component has two lifecycle methods:componentWillMount() and
    componentDidMount(). The constructor is called first, componentWillMount() gets
    called before the render() method and componentDidMount() is called after the
    render() method.


    Overall the mounting process has 4 lifecycle methods. They are invoked in the
    following order:


    +   * constructor()

    * componentWillMount()

    * render()

    * componentDidDidMount()


    But what about the update lifecycle of a component that happens when the state
    or the props change? Overall it has 5 lifecycle methods in the following order:


    +   * componentWillReceiveProps()

    * shouldComponentUpdate()

    * componentWillUpdate()

    * render()

    * componentDidDidUpdate()'
  merge: -1
