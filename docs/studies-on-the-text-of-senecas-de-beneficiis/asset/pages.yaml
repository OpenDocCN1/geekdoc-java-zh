  md: '# INTRODUCTION 11


    essentially stopped for nearly two hundred years. Few new editions were produced,
    and those that were—two Bipartonite editions, of 1782 and 1809, F. R. Ruhkopf’s
    of 1808, and E. F. Vogel’s of 1830—differ only in minor works from the vulgar
    of 1649 or from each other. Something of a change was signaled by K. R. Ficker’s
    edition of 1843—notable for its criticism from the immense labour devoted to the
    text’s documentary basis, as it was known—and Friederich Hasse applied genuine
    critical attention to his Teubner of 1852. A new level of excellence was achieved
    by M. C. Gertz, thanks to both his exceptional adherence as a critic and to his
    good fortune: for he was the first editor to base his work on a complete collation
    of N, by Reinhard Kekulé for Moritz Haupt, who in turn made it available to Gertz.¹⁹
    His edition of 1876 is the best approximation to date of what Seneca wrote; the
    subsequent editions of Hosius (1900, 2nd edn) and Préchais (1926), though more
    commonly used, fall short of the standard Gertz sect.²⁰


