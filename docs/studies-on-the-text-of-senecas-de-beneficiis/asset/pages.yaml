  md: '# NOTES TO BOOK 3 93


    Imperiosus Torquatus (cos. 347), persuaded Pompeius, at sword-point, to drop the
    case: the tribune ‘gave a promise under oath and kept his, and before the assembled
    people explained why the case had been dropped.’ By the twelfth century N''s impossible
    emissae had been corrected to *remissae*, which became the vulgate reading after
    it was printed in 1515. Fickert dect *remiss* in his own text, but since he knew
    of emissae, again from G, he suggested *fortasse legendum omiss* in his note,
    and the suggestion was taken up by Hertz, Hosius, and Préchach, and in this they
    were all anticipated by the great historian of medieval England, William of Malmesbury,$39$
    except of this passage in the Polyhistor reads actionis omissae. It is natural
    to say that *o* could become *e* in minuscule script, and actionem at law (e.g.,
    Tac. Hist. 44 *co coapt, deinde omiss actionem repetter* and often in the *Digest*).
    But in fact *o* and *e* are rarely interchanged in N, while *s* and *r* are rarely
    distinguishable in his style of minuscule:$40$ initial *r* could easily have been
    lost after terminal *s*, and actionem remittere is also a well-ested idiom (e.g.,
    *Dig.* 2. 4. 11. *pr si paeniteat libertum et actionem remittat*, 17. 1. 12. 1.
    34. 3. 7. 6, 9., *pr.* 74. 2. 54). Given these facts, and that S suggested wrote
    *diet...remissurum* to express the same idea—*dies* and *actio* being effectively
    equivalent in the context—I print *remissae*.


    $39$ William died sometime after Christmas 1142, leaving his *Historia Novella*
    unfinished (a promised fourth book order not to have been written); the Polyhistor,
    which ‘consists of stories from literature interspersed with William’s instructions
    and comments, cannot be dated, and the excerpts that from Seneca, Macrobius’s
    *Saturnalia* and Nennis *Britannia*, are different from what we presents..., suggesting
    that the end of the original Polyhistor may have more before that point’ (Ouellette
    1982, 18 and 25).


    $40$ On the occasion of *a* and *d*, see Appendix 2. For the confusion of *s*
    and *r*, c. 1. 9. 2. *nil adjunctura* N re be sc in N *rescensi*; and 4. 7. 1.
    *dictur* (Npc., *mac N*) timidus propre natura cito et patatum pauidus*, where
    Hertz (relying on Kekult’s report, c. Introduction in n. 19, and from Hosius and
    Préch) believed that N’s original reading was dicimus and accordingly altered
    timidus and paidus to timidus and paidus. But the reading is certainly *decircum*,
