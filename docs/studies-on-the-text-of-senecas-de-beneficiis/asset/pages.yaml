  md: '# # APPENDIX 1


    # # N and Q


    In an early study of the transmission of De beneficiis and De clementia Giancarlo
    Mazzoli argued that one of the manuscripts of German origin, **M**, represented
    a line of descent from **N** independent of **R** (1978, 98–109). Four years later
    he extended his argument to include **Q**, another product of Germany, with a
    text very similar to **M**''s (1982, 20–104). Reviewing the history of these texts
    in Texts and Transmission (1983, 63–5), and responding only to Mazzoli''s earlier
    paper, Reynolds dismissed the contention in a footnote. In 2001 Ermanno Malaspina
    responded to the question, concentrating on **Q** in *De clementia* (which **M**
    lacks), and adopted a modified form of Mazzoli''s manuscript: the script now with
    **N** independent of **R** that is not the result of descent, but of contamination
    with a source that had had access to **N**''s. Having reviewed the evidence that
    Mazzoli marshalled, now with a view to *De beneficiis* and concentrating again
    on **Q**—because of whatever it shares with **M**, and because **M** is lacking
    after **R**. 4. 22. 2–1—I conclude that Malaspina was correct.


    In his paper of 1982 Mazzoli listed seventy-six classes in *De beneficiis* that
    demonstrate the *''Accordo NQ contro R e sempre contro Rp''* (2006). I have examined
    these passages, adding others of the same sort (which are marked by an asterisk
    as follows), each case asking the question that I believe must be answered in
    the affirmative if a passage to serve as evidence correlating Mazzoli''s thesis:
    does **Q** here have a certain reading that could not be the product of independent
    conjecture?


    In a handful of passages were here in one or another way irrelevant to Mazzoli''s
    argument. In several cases the agreement of **N** and **Q** was produced by correction
