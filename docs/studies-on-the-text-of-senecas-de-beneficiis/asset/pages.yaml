    ut omnia minima delectant, ut omnia decedent, found in varsigma varsigma and thereafter
    in all the printed editions down through Haase''s.¹⁶ The interpolated clause was
    ejected by Gertz, the first editor with full knowledge of N:¹⁷ Hosius followed
    him in his first edition until uncontrollably reintroduced in his second.


    The more serious difficulty lies in the second locus. Gertz obelized N adnoscere,
    but that forms merely to be a stutter for agnoscere or adno⁻¹⁸ tibi is another
    matter. Apart from the earliest editions and Préchács, which simply replaced N''s
    impossible text, and apart from Gruter, who despaired, editors and critics who
    would retain tibi introduce some supplement (Haase and Madvig, Krucziewicz, Alexander)
    or change the infinitive (Gertz, Gundermann): of these, Haase''s solution is the
    cleanest, like the other supplements it does not imply an obvious ratio corruptellae.
    But why retain tibi, instead of supposing that part ostendis, by that so often
    takes the dative, some daydreaming wrote tibi inside of te? (Granted, reading
    a couple of words farther along would show that tibi cannot serve, but reading
