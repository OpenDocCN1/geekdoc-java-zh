    Skutsch; read *qui for* and *datur for dat* (a medieval fix found in *M*, subsequent
    to the learnt vogue); or read (*si*) with Hiosius. The last is least acceptable,
    since *qui* (for *quis*) is vanishingly rare in S.$^{31}$ Both of the other options
    imply a two-stage corruption, and I cannot see that either is obviously more likely
    than the other: both imply error of anticipation before *quiblibet*, and one that
