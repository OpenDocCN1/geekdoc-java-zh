  md: '# STUDIES ON THE TEXT OF SENECA’S BENEFICIIS


    The next major advances were made by two scholars who did not produce editions.
    In 1536 Hernán Núñez de Toledo y Guzmán—known as ‘Pincianus’ from the Latin name
    of Valladolid, his birthplace in north-west Spain—published in Omnia L. Annaeei
    Senecae philosphi scripta.—castigations, including many hundreds of comments on
    De beneficiis alone that acknowledged or recommended new readings relative to
    the edition of 1529, which he largely drew his lemmata. The readings he promoted—some
    his own conjectures, others drawn (as he says in his prefatory letter) *exemplaria
    scripta et perpetuat decincim*—are clearly clear and regularly without reflection.¹18
    Accordingly, powerfully influenced the next two editions that appeared: Curio
    enthusiastically incorporated many Pincianus’ suggestions in his edition of 1557,
    with selections from Erasmus and Pincianus’s notes inserted after each book, and
    Muretus appropriated much of Pincianus’s work, while leaving unmerited scorn on
    Erasmus. Muretus’ knowledge of Latin was unsurpassed in his day, but his edition—which
    produced while dying and did not live to see published in 1585—does not do justice
    to his talents.


    The more voluminous Anastasius Janus Gruter published in 1594 were even more influential,
    both because of his penetration as a critic and because his notes—in which the
    name ‘Nazarianus’ appears N’s readings far more copious than Erasmus had able
    to do, from one end of De beneficiis to the other. Gruter gained access to N because
    he was the professor of ancient history in Heidelberg, where his connections to
    the court of the Elector Palatine of the Rhine gave him access to his fabulous
    library, and to four of the five manuscripts he regularly cited throughout his
    commentary (the fifth, from Cologne, which cannot be identified). The wealth of
    new knowledge that Gruter made available was readily seized by the two estimate
    critics whose editions followed, Gruter’s former teacher Justus Lipius, and decades
    later, J. E. Gronovius, who now and again says very much like a nineteenth-century
    critic embracing the doctrine of the codex optimus: ‘nihil lubrici, nulla tationibus
    opus, modo adhaereamus Naz(ariano)’ (Notate p. 19).


    For generations, starting with Erasmus’ work, improvements in the text (along
    with a smaller number of new deformations) were passed along augmented from one
    edition to the next, producing a vulgate text that, with the appearance of Gronovius’
    edition in 1649, contained more than two thousand readings—the vast majority of
    them—that had not stood in the *editio precips*: roughly one every twenty-two
    words. And then the work on the text


    *Epistulae Morales* had already been printed in 1529, 271–3, in Ben); though he
    does not use the Ephet Lombardus, at least of the thirty-six notes on Books 1–4
    that cite a *uetastus* or *uetistissimus* codex rely only on N (e.g., 1. 12. 3
    *obseret personas nac, obseret et personas Npc* (superscript & added); ‘Uetastus
    [usc. codex] habet et personas, as perpta scripta super uircomancion; 4; 13. I
    facer nac, I facire N; *in uetistissimo codice… pro facere, subnotatum erat factire*).


    > ¹⁸ On Pincianus, see Kieiebusch 1912, who demonstrated that the manuscripts
    he cited by what we now call the ψ-branch.'
