    quam in manibus est—shows that quam should stand before (pace Feldman, Préchac,
    and Mazzoli); it is more economic to assume that a comparative adjective has been
    lost than a tam...quam expression, and to assume that it stood immediately before
    quam, the two being together; placing a comparative adjective (or tam +adj) after
    nihil propemodem (or before directix) and quam before two independent errors.
    Approaches that avoid a comparative form seem to me strained (Préchac) or inadequate
