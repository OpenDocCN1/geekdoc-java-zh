  md: '# Preface


    This book emerges from my work on a new edition of De beneficiis for the Oxford
    Classical Text series, to appear in a volume that will also include De clementia
    and Apocolocyntosis. Unlike the latter two works, De beneficiis has not benefited
    from sustained attention more recently than the editions published by Martin Gertz
    (1876), Karl Hius (1900, 2nd edn 1914), and François Préchac (1926), a fact that
    provides the rationale for this fresh review. Because the survival of the tradition''s
    archetype, Palatinus Latinus 1547 = N eliminates the need for a detailed reconstruction
    of the text''s history, the Introduction simply surveys the documentary resources
    on which my edition will be based. Seven chapters follow, one for each of the
    work''s books: as in the companion volumes (Studies on the Text of...) that have
    been paired with my earlier editions, the primary aim is to explain and (I hope)
    justify many of the textual choices I have made; secondly, the full apparatus
    accompanies each discussion will often make it possible to provide in the sort
    of breuis adnotatio characteristic of the OCT series while yet making the information
    available to other scholars.¹ There are three appendices: the first discusses
    the relation between N and a German manuscript of the twelfth century (Q) that
    has been a matter of controversy; the second catalogues many of the scribal lapses
    that are especially characteristic of N; the third lists a number of previously
    unreported manuscripts of De beneficiis.

    As always, there is reason to give thanks, in the first instance to the institutions
    that provided the digitized copies of manuscripts that made these studies possible:
    the Bail College Library (Oxford), Bayerische Staatsbibliothek (Munich), Bibliothea
    Apostolica Vaticana, Biblioteca del monastero di San Lorenzo (El Escorial), Bibliothe
