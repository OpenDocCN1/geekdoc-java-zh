    the many god-given benefitia in nature: the list begins at 4. 5. 1—‘Non dat deus
    benefitia. Vnde ergo ista quae possides, quae das, quae negas suas, quae raapis’—continues
    as one item after another is added, with a noun in the nominative or near the
    start of each sentence. The point here is twofold: first, aestatis is ostio, quae
