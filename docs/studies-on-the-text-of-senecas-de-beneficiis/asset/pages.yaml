  md: '# STUDIES ON THE TEXT OF SENECA''S DE BENEFICIIS


    An editor of De beneficiis de dementia, is in much the same position as an editor
    of Tacitus'' Histories and Annals, and that is a very different position from
    an editor of, say, Suetonius'' Lives of the Caesars. The latter must try to reconstruct
    the text of the transmission in the extant manuscripts with the aim either of
    reconstructing the lost archetype (as can be done in case of Suetonius) or of
    determining that no archetype be reconstructed (as in the case of the Aeneid).
    For the editor of the Seneca manuscripts—close to three hundred—come play so far
    as their readings that are helpful when the archetype''s text is possibly or certainly
    faulty. How specific manuscripts, or groups of manuscripts, can have specific
    readings is, at most, of secondary importance.


    # MANUSCRIPTS OF THE TWELTH CENTURY


    That said, any worker in this field owes a very large debt of gratitude to Giancarlo
    Mazzoli, whose immense labour made the later tradition navigable. By surveying
    and sampling some of the extant manuscripts, he demonstrated that they descend
    from R in two main branches, π and ϕ, and that the latter, in turn, turned into
    sub-families, π and γ: of ϕ are least numerous and most sincere, of γ, most and
    least reliable; it is also likely that an intermediary, ρ, stood between R and
    pq. None of the witnesses to these branches antedates the twelfth century; apart
    from excerpts and epitomes, which I have generally ignored as


    Brugnoli 1998, 79–81, surveys ancient and medieval fortuna. That R originated
    in Italy (1975, 81, cf. Mazzoli 1982, 170–1); Pellegrin 1978, 252 (Auxerre or
    Fleury), and Mosterg 1989, 365–43) (Fleury?), remains it the question. What text
    from a copy of most easily explains the unanswerable on the basis of the evidence
    of the two pleonastica we have: Malaspina 2006, xiii–xiv, completes the reviews,
    with references to earlier disciples. Whatever the answer, it has practical bearing
    on the job of an editor: cf. Mazzoli 1982, 172 (a) not tutto quanto testa il testo
    di sorta: non sempre tanto da non ammettere intermediario di sorta: a tutto di
    immagine questo simile al modello da rendere pleonastica la sua funzione


    +   * See Mazzoli 1982, 34 (as lat on pp. 21–23), with supplements to Malaspina
    2001, 50–1, and Appendix 3 of which lists precepts down to the end of the twelfth
    century, the survey of Mullen Open (365–473) is indispensable.

    * That ϕ are not directly derived from R but from a copy of most easily explains
    the innovations they share to R; see, e.g., 1. 30 domnomen clatori CMMGW, unnamorsable
    Naci clatori R; 3, 3. intitens NR; 4, 5. 22 accipier pqm; 12; 44 aq; Nicaccines
    R; Accipere pq; 4, 28 24 ad coq; atiqun, n R, q; 5, 22 4 abacertion pq; te nr,
    5, 2, 12 doolet N (by comparison, see Appendix 1); d role R, cip; 6, 7. 2 coq;
    suit; NR, with Malaspina (1998, 78–79, 2000) which are instances to be relatively
    close in Clem, in Ben; or q corrects R, the improvements generally involve minor
    adjustments of the source found where R corrects N. It is the ubiquity of agreements
    that points more probably to a common source than to coincidence or contamination.
    For the sake of formal precision I include ρ in the statement presented on p.
    5, but for simplicity''s sake I refer to R in the discussions in Chapters 1–7,
    since that has been the convention familiar for over a century.'
