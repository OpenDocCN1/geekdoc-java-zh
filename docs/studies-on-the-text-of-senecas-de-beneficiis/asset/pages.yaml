    As I have already hinted, the De beneiciis published in Naples in 1475 was a very
    poor product, even judged against the generally low standard set by incunabular
    editions of Latin texts. As the work of publishing—it can be called editing—moved
    north in the course of the next generation, the text passed along virtually unchanged,
    and in the handful of places where the four editions introduced a change—from
    Treviso 1478 to Venice 1503—it was a change for the worst often until as it was
    a change for the better. The real work of criticism did not begin until Erasmus
    undertook to edit Seneca, the same time that he was producing enormous editions
    of St. Jerome and the New Testament. The edition of 1515 was produced while Erasmus
    was in England, from whom he sent drafts and notes to Beatus Rhenanus, serving
    as proxy-editor in Basel, and the proofreader Wilhelm Nesse. Then the edition
    produced a much improved text of De beneiciis and the philosophica more generally,
    Erasmus dissatisfied with it, in the belief that his notes and directions had
    been ignored or betrayed. There he began to work on a new edition in 1525, and
    its appearance years later brought hundreds of further improvements to the text.
    While most of these were attributable to Erasmus'' immense skill as a critic,
    a number of them mark the first impact of archaeology on Seneca’s modern reception:
    for as he reached the end of De beneiciis he began to refer in his annotations
    to a new source that he called the ‘Lombard book’ (codex Lombogardicus), from
    its distinctive northern Italian script, and to introduce readings that clearly
    are derived from N.¹⁷


    ¹ The first such appears in the note on 4. 36 (Appendix 1 n. 5), and there are
    twenty-six more references that sort down to the end of Book 7. Erasmus was to
    bring N to bear on the earlier books only in the critical appendix that he inserted
    after the text of De beneiciis'
