    # # Orthographica


    This appendix gathers much of the most characteristic blunders embedded in N.''s
    text and the environments in which they appear. As blunders, usually obviously
    so, most readings reported here will be omitted from my edition''s critical apparatus.
    But this appendix, combined with the Appendix critica that will also appear in
    the edition, will provide the most complete account yet of this uniquely important
    manuscript.


    The appendix begins with the most common interchanges of vowels (e/i, o/u), then
    the most common interchanges of consonants (c/g, t/c, t/d, consonantal u/b), then
    familial categories or causes of error: dichotomy, haplography, anticipation,
    perseverance, errors of aspiration and an illustrative selection of corruptions
    caused by a large selection of errors, under the heading ''Miscellaneous'', that
    not belonging to the preceding categories and cannot be explained by the presence
    of some visual cue or other widely recognized cause.¹ For the vocalic instances,
    I thought it useful—if only for clarity''s sake—to list separately those that
    occur in word-stems and those that occur in inflectional ends. Unless otherwise
    indicated, the preceding entry''s square bracket is the reading of N after correction.


    The lists show that vocal and consonantal interchanges are not random events but
    tend to cluster in certain environments.


