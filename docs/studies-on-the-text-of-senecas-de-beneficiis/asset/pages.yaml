    In S13. S explained that though stulti mali are incapable of receiving a benefitium
    truly so-called—a thing that benefits them—they can receive material commodo in
    common parlance are called beneficia (S13. 2 Quadam, etiam si uera non sunt, similititudinem
    eodem uacoblo comprehenda), and will be ingratif if they do not make a suitable
    return for such advantages.


    At the beginning of S14, S turns to a different argument, argued with Cleanthes:
    stulti cannot receive a benefitium truly, they would not make a return if they
    were to receive one, just because they are stulti mali and so dispositionally
    inclined to ingratitude; so, in the two examples that follow, the latro is a and
    the sacrilegus sacrilegus just because they have the inclination for robbery,
    or actually laying hands on the gods, at any given moment. But they are not actually
    engaged in robbery, or N the clause in bold above stands between these two examples
    and addresses a different point entirely, concerning things that are not true
    beneficia but are so in common parlance. Buck and Alexander claimed that the clause
    represents an interlocutor’s response to the preceding example, the inconsequence
    seems to imply: not does it address a different point, but the subject of acceptit
    could only be taken as last-person singular entity mentioned, the latro—an absurdity,
    since the bandit is not introduced as a receiver of beneficia but as an example
    of a dispositionally vicious person. Either the clause is an interpolation and
    should be deleted (so Feldman) or it has been shifted from its proper place in
    the text, presumably because it was at some point omitted and then ineptly reinserted
    (so Gertz).


    In favour of the explanation is the fact that it is a complete thought, not a
