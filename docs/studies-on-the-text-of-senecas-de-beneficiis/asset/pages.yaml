  md: '# 52 STUDIES ON THE TEXT OF SENECA’S BENEFICII


    Among these candidates, I much doubt the version introduced by Madvig, and still
    more the elaborations of Préchac and Mazzoli, which represent the speaker as expressing
    indifference to the self-harm the other party might incur: in effect, ‘I’ll be
    fine with the thought (patiar) of hurting yourself, just don’t expect any help
    from me.’ This approach to the text obviously follows from the disavage of Seneca’s
    n semed ipsa, which is—along with the absence of an infinite complementing patiar—the
    problem posed by the archetype text.³ But such indifference to another’s harm
    is fundamentally at odds with the tenor of 2.14 (as to say nothing of Stoic ethics
    more generally), where the lesson has focused entirely on adopting the paternalistic
    stance of looking out for the other’s good from a position of superior understanding.³⁴


    The remaining proposals—in chronological order, those of Gertz, Hozius, and Kronenberg——dealt
    with these issues in fairly radical ways. Gertz salvaged a semed ipsa (with a
    semet ipso) but avoided the appearance of indifference by replacing patiar and
    introducing adhesum.³⁵ Hozius took that verily, replacing a semed with me sumerum
    but let ipsat at an awkward reward from the text itself ostensibly stresses. Kronenberg
    replaced a semed ipsa with a me peti, which provides the expected sense but leaves
    unexplained the latter series of letters morphed into the former, suggesting that
    ipsa (i.e., *ipa*) was produced by ditography before.²⁶ Given that semet is very
    uncommon in S’s works, I do not find very acute the need to salvage it.²⁷ But
    need I find any of these three options attractive enough to place it in the text
    as a plausible stop-gap; nor can I devise a better solution of my own. I will
    oblize a semed ipsa, consol myself with that passage defeated Janus Gruter, and
    cite Gertz, Hozius, and Kronenberg in the apparatus, to suggest the thrust of
    S’s thought.


