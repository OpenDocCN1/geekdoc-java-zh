  md: 'Repetam itaque, quia hoc aut ex magna necessitate [NQ, necessitate RC\psi]
    facturus ero aut illius causa a quo repetam.


    I wager that it would be very rare reader who would feel the need, unprompted,
    to add ex before the blameless-causing ablative necessitate, parallel with causa.
    I wager further that not one in ten thousand would be moved to put magna between
    ex and necessitate with the prompting, specifically, of N.


    I believe that these last cases, especially, particular, put it beyond reasonable
    doubt that Q’s text bears the mark of N’s influence independent of R. But I also
    believe it to be beyond reasonable doubt that is nothing in a manuscript that
    otherwise so clearly bears the impress of R, and their distribution—Clustering
    densely in Books 5 and 6—is hardly what one expects to see in one manuscript that
    is descended from another. I take it, then in one manuscript that is descended
    from another. I take it, then, the evidence points to corrections, of a not very
    systematic sort, entered at one or more points in Q’s lineage from one or more
    sources that had access to N. If you ask at what points these corrections occurred
    and from what sources, I frankly say that I have no idea. But the three hundred
    years that separate the writing of Q from the writing of R—years for which the
    paradosis has left no record at all—were time enough for far stranger things to
    happen.'
