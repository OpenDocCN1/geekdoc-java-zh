  md: '# Introduction


    # The Text’s Documentary Basis


    What follows is not a complete history of the text of *De beneficiis* but an overview
    of the sources cited in the textual notes that constitute Chapters 1–7. The aim
    is simply to introduce readers to the persons, editions, and manuscripts that
    they will see cited many times the real work of the monograph graphs.


    # THE ARCHETYPE AND THE APOGRAPH


    The treatises *De beneficiis* and *De clementia* share two distinctions: among
    Seneca’s *philosophica* which emerged early in the passage from antiquity to the
    Middle Ages; and they emerged together in a manuscript that still survives. Vatican,
    Palatinus latinus 1547, is the extant archetype of the tradition: copied in northern
    Italy c.800, it received early sets of corrections, one by the original scribe,
    presumably catching his own slips as he wrote, and one by a careful contemporary
    who perhaps had access to the book’s exemplar.¹ Within a generation the book was
    taken to Lorsch, where it spent the rest of the Middle Ages in the Church of St.
    Nazarius, which gave it the name, *Nazarianus*, by which it is commonly known
    and the *siglum, N*, by which it has been designated in *apparatus critici* since
    the middle of the nineteenth century. Within another generation a copy of N was
    made, incorporating the early corrections to its text.² That copy, or a copy of
    it, is also extant: Vatican, Regenensis latinus 1529 (R)—written in the second
    quarter of the fourteenth century, probably in France, which spent the Middle
    Ages in Flery or Auxerre—is the source of all copies of these two works.³


    > ¹ There were two later correcting hands, Reinhard Kekuló, who produced the collation
    used by Martin Lenz (n. 19), that he deemed three later hands, the earliest of
    which he dated to the thirteenth or fourteenth century (Gertz 1876, iv-v), chap.
    4 n. 24. On the possibility that he had capital manuscript of *De beneficiis*
    in its proximate century, see Appendix 2 n. 2.


    > ² Corrections in N not reflected in R are essentially the work of the later
    corrector, for that it appears the odd suspension stroke or exception point added
    by an later corrector was here and there missed: in my critical apparatus *Npc*
    denotes a correction found in R, with ‘*man. post.*’ added in those cases that
    I feel confident in attributing to a later hand.


    > ³ Gertz first recognized N’s unique value, and Buck 1908, 1–38, first analyzed
    the relationship between N and R, which has again been meticulously studied by
    Busonero 2000; the shape of the tradition was further elaborated by Préchac 1921,
    vi-xlii, 1926; i-xlii; and esp. Mazzoli 1982;'
