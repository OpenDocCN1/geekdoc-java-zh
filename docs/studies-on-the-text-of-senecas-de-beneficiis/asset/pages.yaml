    Explicating a Stoic paradox central to the doctrine of benefits and gratitude—that
    the person who gladly received a beneficium has facto made a stable return (23.
    1. ex paradoxis Stoicae sectae minima mirabile… est: eum qui libenter accipit
    beneficium reddisse)—S. examines the matter from the perspective of the benefactor
    acting, asking the question, what is him, what does he look for in making the
    grant? Accordingly, the verbs and other operations that he uses— proposuit… propon…
    uoluit… petit… uoluit… destinaut… pet…… ult… uolat—are all goal-oriented and forward-looking,
    ending with speraut. One way of approaching the textual issue here, then, is to
    regard all the verbs as functionally equivalent to uolat and if S he had written,
    Beneficium qui dat, uulti excip: habet, quod uolat, si bene acceptum est. Sed
    uolat et emolimenti, I doubt that one reader in a thousand would blink at emolamenti.
    If that is so—if the structure of the passage stands in uolat for the sake of
    uariation—we would probably not blink at speraut et emolimenti, Whether the motive
    of the reader (or readers) of N who first cancelled and then erased it, it was
    very likely a mistake.


