  md: '# RECIETIO


    Interest in Seneca and De beneficiiis increased enormously in the fourteenth and
    fifteenth centuries, to which most of the extant copies date; beyond Mazzoli’s
    survey, these books still constitute a vast terra incognita. I used over half
    of the thirty-odd complete copies, and one set of excerpts, that have been dated
    to the fourteenth century (in one case, the thirteenth century), primarily with
    the aim of tracing the earliest attestations of reading that are known only from
    the early printed editions. Though Mazzoli, on the basis of his sampling survey,
    assigned these books to one or another of the tradition’s three families, contamination
    certainly accelerated in this period, and the group-identity of any given manuscript,
    while not completely finished, is often blurred, so that a π-reading is not to
    turn up in y-manuscripts, and vice versa; again, there are very few representatives
    of ϕ among them ϕ₄ (mostly) and ϕ₁₂ below:¹³


