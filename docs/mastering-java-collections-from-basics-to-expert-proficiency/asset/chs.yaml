  \n### 性能考虑\n\n`TreeSet` 由 `TreeMap` 支持，为基本操作——`add`、`remove` 和 `contains` 提供了保证的\
  \ log(n) 时间代价。这种性能特性使得 `TreeSet` 适用于需要快速检索和维护排序顺序的用例。元素必须是互可比较的，这意味着元素需要实现 `Comparable`\
  \ 接口或提供适当的 `Comparator`。\n\n*(此处由于原文代码块存在乱码，已按要求跳过代码内部翻译)*\n\n#### 自定义比较器示例\n\n\
  当自然排序不适用时，使用自定义 `Comparator` 是必要的。此示例展示了一个根据自定义比较器排序的 `TreeSet`。\n\n```java\nimport\
  \ java.util.Comparator; \nimport java.util.TreeSet; \n\nclass Person { \n    String\
  \ name; \n    int age; \n    Person(String name, int age) { \n      this.name =\
  \ name; \n      this.age = age; \n    }\n    @Override\n    public String toString()\
  \ { \n      return name + \": \" + age; \n    } \n}\n\npublic class CustomComparatorExample\
  \ { \n    public static void main(String[] args) { \n      Comparator<Person> personComparator\
  \ = Comparator.comparingInt(p -> p.age); \n      TreeSet<Person> personSet = new\
  \ TreeSet<>(personComparator); \n      personSet.add(new Person(\"Alice\", 30));\
  \ \n      personSet.add(new Person(\"Bob\", 25)); \n      personSet.add(new Person(\"\
  Charlie\", 35)); \n      for (Person person : personSet) { \n        System.out.println(person);\
  \ \n      } \n    } \n}\n```\n\n```\nOutput: \nBob: 25 \nAlice: 30 \nCharlie: 35\n\
  ```\n\n`TreeSet` 类是 Java 集合框架中一个强大的工具，为维护全排序集合提供了有效手段。自然排序或比较器的灵活性确保了 `TreeSet`\
  \ 可以适应许多不同的情况。\n\n\n\n\n\n`ConcurrentSkipListSet` 以排序的顺序维护所有元素，这使其能够高效地实现 `NavigableSet`\
  \ 接口。该接口提供了非常有用的方法，用于遍历集合、查找与给定键相关的条目以及检索集合的子集。示例包括 `headSet(E toElement)`、`tailSet(E\
  \ fromElement)` 和 `subSet(E fromElement, E toElement)` 等方法。\n\n```java\nimport java.util.concurrent.ConcurrentSkipListSet;\n\
  \npublic class NavigableSetExample {\n\n    public static void main(String[] args)\
  \ {\n        ConcurrentSkipListSet<Integer> set = new ConcurrentSkipListSet<>();\n\
  \        set.add(1);\n        set.add(3);\n        set.add(5);\n        set.add(7);\n\
  \        System.out.println(\"HeadSet (less than 5): \" + set.headSet(5));\n   \
  \     System.out.println(\"TailSet (greater than or equal to 5): \" + set.tailSet(5));\n\
  \        System.out.println(\"SubSet (3 to 7): \" + set.subSet(3, 7));\n    }\n\
  }\n```\nOutput:\n```\nHeadSet (less than 5): [1, 3]\nTailSet (greater than or equal\
  \ to 5): [5, 7]\nSubSet (3 to 7): [3, 5]\n```\n\n由于其并发性质，`ConcurrentSkipListSet`\
  \ 在多线程环境中特别有用，在这些环境中，读写操作需要并发执行而无需显式锁。例如，实时分析平台等高吞吐系统可以从 `ConcurrentSkipListSet`\
  \ 的并发能力中极大受益。\n\n在设计利用 `ConcurrentSkipListSet` 的算法时，理解其性能特性和潜在局限性至关重要。在通常情况下，预期的\
  \ `log(n)` 时间复杂度成立，但在最坏情况下会退化为线性时间。然而，由于跳表的概率性平衡机制，这种情况极少发生。\n\n此外，`ConcurrentSkipListSet`\
  \ 不支持 `null` 元素。尝试添加 `null` 将导致 `NullPointerException`。这种设计选择确保了跨并发操作的行为是可靠且可预测的。\n\
  \n为了说明 `ConcurrentSkipListSet` 的并发性质，考虑多个线程同时向集合插入元素的场景。以下示例展示了一个简单的多线程插入过程。\n\n\
  ```java\nimport java.util.concurrent.ConcurrentSkipListSet;\n\npublic class ConcurrentInsertionExample\
  \ {\n\n    public static void main(String[] args) throws InterruptedException {\n\
  \        ConcurrentSkipListSet<Integer> set = new ConcurrentSkipListSet<>();\n \
  \       Runnable inserter = () -> {\n            for (int i = 0; i < 5; i++) {\n\
  \                set.add(i);\n                System.out.println(Thread.currentThread().getName()\
  \ + \" added: \" + i);\n            }\n        };\n        Thread t1 = new Thread(inserter);\n\
  \        Thread t2 = new Thread(inserter);\n        t1.start();\n        t2.start();\n\
  \        t1.join();\n        t2.join();\n        System.out.println(\"Final set:\
  \ \" + set);\n    }\n}\n```\nOutput:\n```\nThread-0 added: 0\nThread-1 added: 0\n\
  Thread-0 added: 1\nThread-1 added: 1\nThread-0 added: 2\nThread-1 added: 2\nThread-0\
  \ added: 3\nThread-1 added: 4\nFinal set: [0, 1, 2, 3, 4]\n```\n\n上述示例证明 `ConcurrentSkipListSet`\
  \ 可以处理并发插入，同时维护集合的线程安全排序属性。每个线程的输出都指示了它添加的元素，而最终集合反映了一个合并后的排序集合。诸如 `ConcurrentSkipListSet`\
  \ 这样的线程安全集合对于设计多线程应用程序是不可或缺的。它们抽象了同步的复杂性，允许开发人员关注更高层次的问题。跳表结构提供了一个高效且可扩展的基础，确保了集合上的操作在并发访问下依然保持高性能。\n\
  \n### 4.6 EnumSet: 针对枚举的特殊集合\n\n`EnumSet` 是一个专门为枚举类型（enum types）设计的特殊 `Set` 实现。它提供了一种高效且紧凑的表示方式，利用了枚举的独特属性。与\
  \ `HashSet` 或 `TreeSet` 等其他集合实现不同，`EnumSet` 要求所有元素必须是相同枚举类型，这使其既是类型安全的又经过了高度优化。本节将深入探讨\
  \ `EnumSet` 的细节、用法及其提供的优势。\n\n`EnumSet` 是 `java.util` 包的一部分，并实现了 `Set` 接口。它是一个抽象类，有两个具体的实现类：`RegularEnumSet`\
  \ 和 `JumboEnumSet`。这些实现之间的选择根据枚举类型的大小自动决定。\n\n```java\nimport java.util.EnumSet;\n\
  \nenum Day {\n    MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY\n\
  }\n\npublic class EnumSetExample {\n\n    public static void main(String[] args)\
  \ {\n        EnumSet<Day> weekend = EnumSet.of(Day.SATURDAY, Day.SUNDAY);\n    \
  \    System.out.println(\"Weekend days: \" + weekend);\n\n        EnumSet<Day> workdays\
  \ = EnumSet.range(Day.MONDAY, Day.FRIDAY);\n        System.out.println(\"Workdays:\
  \ \" + workdays);\n\n        EnumSet<Day> allDays = EnumSet.allOf(Day.class);\n\
  \        System.out.println(\"All days: \" + allDays);\n\n        EnumSet<Day> noDays\
  \ = EnumSet.noneOf(Day.class);\n        System.out.println(\"No days: \" + noDays);\n\
  \    }\n}\n```\nOutput:\n```\nWeekend days: [SATURDAY, SUNDAY]\nWorkdays: [MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]\nAll days: [MONDAY, TUESDAY, WEDNESDAY,\
  \ THURSDAY, FRIDAY, SATURDAY, SUNDAY]\nNo days: []\n```\n\n#### 创建 EnumSet\n\n有多种创建\
  \ `EnumSet` 的方法，以满足不同的需求：\n\n* `EnumSet.of(E first, E... rest)`: 创建指定元素的 `EnumSet`。\n\
  * `EnumSet.noneOf(Class<E> elementType)`: 创建空的 `EnumSet`。\n* `EnumSet.allOf(Class<E>\
  \ elementType)`: 创建包含枚举类型所有元素的 `EnumSet`。\n* `EnumSet.range(E from, E to)`: 创建包含范围内所有元素的\
  \ `EnumSet`。\n* `EnumSet.copyOf(Collection<E> c)`: 创建与指定集合元素相同的 `EnumSet`。\n\n####\
  \ EnumSet 的优势\n\n`EnumSet` 提供了许多优势：\n\n* **紧凑表示**：由于 `EnumSet` 内部使用位向量，与其它 `Set`\
  \ 实现相比，它非常节省内存。\n* **高性能**：`EnumSet` 上的操作（如 `add`, `remove`, `contains`）是常数时间 `O(1)`，且通常比\
  \ `HashSet` 快。\n* **类型安全**：`EnumSet` 确保所有元素属于同一枚举类型，在编译时即可类型错误。\n\n#### EnumSet\
  \ 使用场景\n\n由于其特殊性，`EnumSet` 特适用于涉及枚举类型的场景，例如：\n\n* **状态管理**：在有限状态机或 UI 组件中表示并管理状态。\n\
  * **功能标记**：在软件应用程序中启用或禁用功能。\n* **权限与角色**：在安全/认证模块中表示用户权限或角色。\n\n#### EnumSet 中的常用操作\n\
  \n`EnumSet` 中的枚举操作与其他集合相似。以下是说明性示例：\n\n```java\nimport java.util.EnumSet;\nimport\
  \ java.util.Arrays;\n\nenum Feature {\n    LOGIN, REGISTER, SEARCH, EDIT, DELETE\n\
  }\n\npublic class FeatureFlags {\n\n    public static void main(String[] args) {\n\
  \        EnumSet<Feature> enabledFeatures = EnumSet.of(Feature.LOGIN, Feature.SEARCH);\n\
  \        // 添加功能\n        enabledFeatures.add(Feature.REGISTER);\n        System.out.println(\"\
  Enabled features: \" + enabledFeatures);\n\n        // 功能\n        enabledFeatures.remove(Feature.LOGIN);\n\
  \        System.out.println(\"Enabled features after removal: \" + enabledFeatures);\n\
  \n        // 检查某功能是否启用\n        boolean isSearchEnabled = enabledFeatures.contains(Feature.SEARCH);\n\
  \        System.out.println(\"Is SEARCH enabled? \" + isSearchEnabled);\n\n    \
  \    // 遍历功能\n        for (Feature feature : enabledFeatures) {\n            System.out.println(\"\
  Enabled feature: \" + feature);\n        }\n    }\n}\n```\n\n\n\n\n} \n\n} \n\n\
  }\n\n```java\nEnabled features: [LOGIN, SEARCH, REGISTER] \nEnabled features after\
  \ removal: [SEARCH, REGISTER] \nIs SEARCH enabled? true \nEnabled feature: SEARCH\
  \ \nEnabled feature: REGISTER\n```\n\n这些示例强调了 `EnumSet` 在管理枚举类型集合方面的多功能性和高效性。它专门适用于这一用途而脱颖而出，提供了其他\
  \ `Set` 实现所无法比拟的性能增强和类型安全保障。\n\n理解 `EnumSet` 的底层机制和适当的使用场景，可以使人们掌握充分利用其全部潜能所需的细致技能，使其成为\
  \ Java 集合框架中不可或缺的工具。这种知识超出了基本用法，能够支持开发出复杂、优化且易于维护的代码。\n\n### 4.7 常用集合操作\n\n`Java\
  \ Collections Framework` 中的集合提供了多种操作，允许对唯一元素进行高效的操控和查询。理解这些常用的集合操作对于有效使用集合至关重要。本节将涵盖集合可用的基本方法，并结合详细的\
  \ Java 代码示例进行说明。\n\n**添加元素：** 要向集合中添加元素，使用 `add` 方法。该操作返回一个布尔值，表示集合之前是否包含指定的元素。\n\
  \n```java\n// 创建一个 `HashSet` 来存储 `Integer` 值 \nSet<Integer> integerSet = new HashSet<>();\
  \ \n\n// 向集合添加一个元素 \nboolean isAdded = integerSet.add(10); // 返回 true, 10 已添加 \n\
  boolean isAddedAgain = integerSet.add(10); // 返回 false, 10 已经存在\n```\n\n**移除元素：**\
  \ 要移除元素，使用 `remove` 方法。它也返回一个布尔值，表示移除操作是否成功。\n\n```java\n// 从集合中移除一个元素\nboolean\
  \ isRemoved = integerSet.remove(10); // 返回 true, 10 已移除 \nboolean isRemovedAgain\
  \ = integerSet.remove(10); // 返回 false, 10 不再存在\n```\n\n**检查包含性：** `contains` 方法检查集合中是否存在某个元素，并返回布尔结果。\n\
  \n```java\n// 检查元素是否在集合中 \nboolean containsElement = integerSet.contains(10); //\
  \ 返回 false, 因为 10 已被移除\n```\n\n**大小与空性：** 要获取集合中的元素数量，使用 `size` 方法；要检查集合是否为空，可以使用\
  \ `isEmpty` 方法。\n\n```java\n// 检查集合的大小 \nint setSize = integerSet.size(); // 返回\
  \ 0, 因为集合是空的 \n// 检查集合是否为空 \nboolean isSetEmpty = integerSet.isEmpty(); // 返回 true\n\
  ```\n\n**清空集合：** `clear` 方法移除集合中的所有元素。\n\n```java\n// 向集合添加元素 \nintegerSet.add(20);\
  \ \nintegerSet.add(30); \n\n// 清空集合 \nintegerSet.clear(); // 移除所有元素 \nint clearedSetSize\
  \ = integerSet.size(); // 返回 0, 因为集合现在为空\n```\n\n**批量操作：** 集合支持批量操作以同时对多个元素执行任务。这些包括\
  \ `addAll`、`retainAll` 和 `removeAll` 方法。\n\n```java\n// 向集合批量添加元素 \nSet<Integer>\
  \ anotherSet = new HashSet<>(); \nanotherSet.add(40); \nanotherSet.add(50); \nintegerSet.addAll(anotherSet);\
  \ // 将 anotherSet 中的所有元素添加到 integerSet \nboolean containsAll = integerSet.containsAll(anotherSet);\
  \ // 返回 true \n\n// 从集合中批量移除元素 \nintegerSet.removeAll(anotherSet); // 从 integerSet\
  \ 中移除存在于 anotherSet 的元素 \nboolean containsAfterRemoval = integerSet.containsAll(anotherSet);\
  \ // 返回 false \n\n// 保留共同元素 \nSet<Integer> anotherSet = new HashSet<>(); \nanotherSet.add(60);\
  \ \nanotherSet.add(70); \nintegerSet.retainAll(anotherSet); // 只保留共同元素\n```\n\n\
  **比较与子集：** `equals` 和 `containsAll` 方法有助于比较集合。\n\n```java\nSet<Integer> set1 = new\
  \ HashSet<>();\nset1.add(1);\nset1.add(2);\n\nSet<Integer> set2 = new HashSet<>();\n\
  set2.add(1);\nset2.add(2);\n\nboolean isEqual = set1.equals(set2); // 返回 true\n\
  boolean isSubset = set1.containsAll(set2); // 返回 true\n```\n\n**遍历元素：** 集合可以使用增强型\
  \ for 循环或 `iterators`（迭代器）进行遍历。\n\n```java\n// 使用增强 for 循环遍历 \nfor (Integer element\
  \ : integerSet) {\n    System.out.println(element);\n} \n\n// 使用迭代器遍历 \nIterator<Integer>\
  \ iterator = integerSet.iterator();\nwhile (iterator.hasNext()) {\n    Integer element\
  \ = iterator.next();\n    System.out.println(element);\n}\n```\n\n### 4.8 性能考虑\n\
  \n理解不同 `Set` 实现的性能影响对于优化 Java 至关重要。`Java Collections Framework` 中的每个实现都具有不同的特性。\n\
  \n**HashSet：** 由于底层的哈希表，该实现为 `add`、`remove` 和 `contains` 操作提供了最佳性能。在假设有良好的哈希函数可以将对象分布到桶中的情况下，这些操作的时间复杂度通常为\
  \ O(1)。但在最坏情况下（即所有元素都哈希到同一个桶），时间复杂度可能会退化为 O(n)。对 `HashSet` 的遍历取决于哈希表的容量而非实际集合的大小。\n\
  \n```java\nHashSet<Integer> hashSet = new HashSet<>(); \nhashSet.add(1); \nhashSet.add(2);\
  \ \nhashSet.add(3); \nSystem.out.println(hashSet.contains(2)); // 返回 true \nhashSet.remove(3);\n\
  ```\n\n**LinkedHashSet：** 该实现扩展了 `HashSet`，并在所有条目维护了一个双向链表以保留插入顺序。`add`、`remove`\
  \ 和 `contains` 操作的时间复杂度与 `HashSet` 相同均为 O(1)，因为它也使用了哈希表。然而，维护链表的额外开销可能会导致性能略低于 `HashSet`。\n\
  \n```java\nLinkedHashSet<Integer> linkedHashSet = new LinkedHashSet<Integer>();\
  \ \nlinkedHashSet.add(1); \nlinkedHashSet.add(2); \nlinkedHashSet.add(3); \nSystem.out.println(linkedHashSet.contains(2));\
  \ // 返回 true \nlinkedHashSet.remove(3);\n```\n\n**TreeSet：** `TreeSet` 采用红黑树存储其元素，确保集合保持排序状态。这使得\
  \ `add`、`remove` 和 `contains` 操作的时间复杂度为 O(log n)。`**TreeSet 的排序特性**使其成为对顺序要求场景的理想选择。虽然\
  \ `TreeSet` 提供了对数性能，但与常数时间复杂度集合相比引入了更多的开销。\n\n```java\nTreeSet<Integer> treeSet\
  \ = new TreeSet<>(); \ntreeSet.add(1); \ntreeSet.add(2); \ntreeSet.add(3); \nSystem.out.println(treeSet.contains(2));\
  \ // 返回 true \ntreeSet.remove(3);\n```\n\n\n\n\n`ConcurrentSkipListSet`: 该实现专为并发环境设计，提供了线程安全的访问，无需外部同步。内部，`ConcurrentSkipListSet`\
  \ 采用跳表实现，为 `add`、`remove` 和 `contains` 操作提供 `O(log n)` 的时间复杂度，与 `TreeSet` 类似，但针对并发修改进行了优化。这使得它适用于高并发级别的应用，多个线程可以在集合上操作而不会产生性能下降。\n\
  \n```java\nConcurrentSkipListSet<Integer> concurrentSet = new ConcurrentSkipListSet<>();\n\
  concurrentSet.add(1);\nconcurrentSet.add(2);\nconcurrentSet.add(3);\nSystem.out.println(concurrentSet.contains(2));\
  \ // true\nconcurrentSet.remove(3);\n```\n```true\n```\n\n`EnumSet`: 专门为枚举（enums）设计，`EnumSet`\
  \ 提供了极高性能的实现。`EnumSet` 在底层使用位向量（bit vector），这使其能够对所有基本操作提供接近常数时间的性能。`EnumSet` 的性能通常优于其他集合实现，在处理枚举类型时是最佳选择。\n\
  \n```java\nenum Days { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY }\nEnumSet<Days>\
  \ enumSet = EnumSet.of(Days.MONDAY, Days.FRIDAY);\nSystem.out.println(enumSet.contains(Days.FRIDAY));\
  \ // true\nenumSet.remove(Days.MONDAY);\n```\n```\ntrue\n```\n\n选择合适的集合实现取决于具体的应用需求和限制，例如顺序保持、并发性以及存储元素的性质。对于无序集合，`HashSet`\
  \ 提供了良好的性能。如果插入顺序很重要，则优先选择 `LinkedHashSet`。当需要排序时，`TreeSet` 很有帮助，而对于高并发需求，`ConcurrentSkipListSet`\
  \ 是理想选择。对于枚举类型，`EnumSet` 是最高效的选择。\n\n### 4.9 遍历集合\n\n在 Java 中处理集合时，遍历集合中的元素是一项基础操作。Java\
  \ 提供了几种遍历集合的方法，每种方法都有特定的使用场景和优势。理解这些方法对于执行高效的数据处理任务至关重要。\n\n遍历集合的主要方法有：\n\n* `Iterator`\n\
  * 增强型 for 循环（Enhanced for loop）\n* 使用 Lambda 表达式的 `forEach` 方法\n\n#### 使用 Iterator\n\
  \n`Iterator` 接口提供了一种遍历集合的标准方式。`iterator()` 方法返回一个 `Iterator` 实例，允许你使用 `hasNext()`\
  \ 和 `next()` 方法遍历集合。下面的示例演示了这种方法。\n\n```java\nimport java.util.HashSet;\nimport\
  \ java.util.Iterator;\nimport java.util.Set;\n\npublic class SetIterationExample\
  \ {\n    public static void main(String[] args) {\n        Set<String> set = new\
  \ HashSet<>();\n        set.add(\"Element1\");\n        set.add(\"Element2\");\n\
  \        Iterator<String> iterator = set.iterator();\n        while (iterator.hasNext())\
  \ {\n            String element = iterator.next();\n            System.out.println(element);\n\
  \        }\n    }\n}\n```\n```\nElement1\nElement2\n```\n\n使用 `Iterator` 的主要优势是它允许你在遍历过程中使用\
  \ `remove` 方法安全地从集合中删除元素。这在其他遍历方法中是无法实现的，可能会导致 `ConcurrentModificationException`。\n\
  \n#### 使用增强型 for 循环\n\n增强型 for 循环（也称为 \"foreach\" 循环）是遍历集合的一种更简单、更易读的方法。这种循环是 `Iterator`\
  \ 方法的语法糖，适用于大多数遍历期间不需要修改集合的场景。\n\n```java\nimport java.util.HashSet;\nimport java.util.Set;\n\
  \npublic class SetIterationExample {\n    public static void main(String[] args)\
  \ {\n        Set<String> set = new HashSet<>();\n        set.add(\"Element1\");\n\
  \        set.add(\"Element2\");\n        for (String element : set) {\n        \
  \    System.out.println(element);\n        }\n    }\n}\n```\n```\nElement1\nElement2\n\
  ```\n\n这种方法简洁且具有表现力，使得代码更容易读取和维护。然而，增强型 for 循环没有提供在遍历期间删除元素的直接方法，因为它缺乏对 `Iterator`\
  \ 实例的直接访问。\n\n#### 使用 Lambda 表达式的 forEach 方法\n\nJava 8 在 `Iterable` 接口中引入了 `forEach`\
  \ 方法，允许使用 Lambda 表达式或方法引用进行更多函数风格的操作。该方法接受一个 `Consumer` 函数式接口作为参数。\n\n```java\n\
  import java.util.HashSet;\nimport java.util.Set;\n\npublic class SetIterationExample\
  \ {\n    public static void main(String[] args) {\n        Set<String> set = new\
  \ HashSet<>();\n        set.add(\"Element1\");\n        set.add(\"Element2\");\n\
  \        set.forEach(element -> System.out.println(element));\n    }\n}\n```\n```\n\
  Element1\nElement2\n```\n\n#### 在遍历期间删除元素\n\n如前所述，`Iterator` 方法是遍历期间删除元素的安全方式。接下来的示例说明了这一点：\n\
  \n```java\nimport java.util.HashSet;\nimport java.util.Iterator;\nimport java.util.Set;\n\
  \npublic class SetIterationExample {\n    public static void main(String[] args)\
  \ {\n        Set<String> set = new HashSet<>();\n        set.add(\"Element1\");\n\
  \        set.add(\"Element2\");\n        set.add(\"RemoveMe\");\n        Iterator<String>\
  \ iterator = set.iterator();\n        while (iterator.hasNext()) {\n           \
  \ String element = iterator.next();\n            if (element.equals(\"RemoveMe\"\
  )) {\n                iterator.remove();\n            }\n        }\n    }\n}\n```\n\
  ```\nElement1\nElement2\n```\n\n#### 遍历排序集合\n\n对于 `TreeSet` 或 `ConcurrentSkipListSet`\
  \ 这样的排序集合实现，遍历顺序由元素的自然排序或自定义比较器保证。遍历技术保持不变，但顺序的可预测性对某些应用很有用。\n\n```java\nimport\
  \ java.util.Set;\nimport java.util.TreeSet;\n\npublic class SortedIterationExample\
  \ {\n    public static void main(String[] args) {\n        Set<String> sortedSet\
  \ = new TreeSet<>();\n        sortedSet.add(\"Banana\");\n        sortedSet.add(\"\
  Apple\");\n        sortedSet.add(\"Cherry\");\n        for (String element : sortedSet)\
  \ {\n            System.out.println(element);\n        }\n    }\n}\n```\n```\nApple\n\
  Banana\nCherry\n```\n\n\n\n\n\n# 差集\n两个集合之间的差集是一个包含第一个集合中但不在第二个集合中的元素的集合。与并集和交集不同，差运算不满足交换律也不满足结合律。\n\
  \n以下是 Java 代码示例，展示了如何使用 `HashSet` 类（最常用的集合实现之一）执行这些操作。\n\n```java\nimport java.util.HashSet;\
  \ \n\nimport java.util.Set; \n\npublic class SetOperations { \n    public static\
  \ void main(String[] args) { \n      Set<Integer> setA = new HashSet<>(); \n   \
  \   Set<Integer> setB = new HashSet<>(); \n      setA.add(1); \n      setA.add(2);\
  \ \n      setA.add(3); \n      setB.add(3); \n      setB.add(4); \n      setB.add(5);\
  \ \n      // 并集 \n      Set<Integer> union = new HashSet<>(setA); \n      union.addAll(setB);\
  \ \n      System.out.println(\"Union: \" + union); \n      // 交集 \n      Set<Integer>\
  \ intersection = new HashSet<>(setA); \n      intersection.retainAll(setB); \n \
  \     System.out.println(\"Intersection: \" + intersection); \n      // 差集 \n  \
  \    Set<Integer> difference = new HashSet<>(setA); \n      difference.removeAll(setB);\
  \ \n      System.out.println(\"Difference (setA - setB): \" + difference); \n  \
  \  } \n}\n```\n\n```\nUnion: [1, 2, 3, 4, 5] \nIntersection: [3] \nDifference (setA\
  \ - setB): [1, 2]\n```\n\n## 并集运算\n要执行并集运算，使用了 `addAll` 方法。在这里，`union.addAll(setB);`\
  \ 将 `setA` 和 `setB` 的元素合并。此操作产生一个包含两个集合中所有唯一元素的集合。\n\n## 交集运算\n对于交集运算，应用 `retainAll`\
  \ 方法。行 `intersection.retainAll(setB);` 修改 `intersection` 集合，使其仅包含同时存在 `setA` 和 `setB`\
  \ 中的元素。\n\n## 差集运算\n差集运算利用 `removeAll` 方法。在 `difference.removeAll(setB);` 中，`difference`\
  \ 集合被更新以排除任何也存在 `setB` 中的元素。\n\n## 算法实现\n虽然 Java 的内置方法高效地执行这些操作，但理解它们的底层机制是有益的。以下是这些操作的简化算法方法，使用伪代码以便更好地理解：\n\
  \n**算法 2：并集、交集和差集算法**\n**输入：** 两个集合 A 和 B\n**输出：** 并集集合 U, 交集集合 I, 差集集合 D\n1 U ←\
  \ new set;\n2 I ← new set;\n3 D ← new set;\n4 foreach element e in A\ndo\n5\n6\n\
  7 U.add(e);\n8 D.add(e);\n9 end\n10 foreach element e in B\ndo\n11\n12\n13 U.add(e);\n\
  14 end\n15 foreach element e in A\ndo\n16\n17\n18 if B.contains(e) then\n19\n20\n\
  21 I.add(e);\n22 end\n23 end\n24 foreach element e in B\ndo\n25\n26\n27 D.remove(e);\n\
  28 end\n29 return U, I, D\n\n此伪代码演示了前述的步骤——通过遍历集合来手动构建并集、交集和差集。\n\n## 特殊情况与注意事项\n\
  * 空集合：与空集合进行的任何操作都会产生可预测的结果，例如，一个集合与空集合的并集返回该集合本身。\n* 重复项：由于集合本质上不允许重复，并集运算通过包含每个元素一次来处理多重性。\n\
  * 性能：这些操作的时间复杂度很大程度上取决于集合的大小和底层实现的效率（对于基于哈希的集合通常为 `O(1)`）。\n\n读者应该练习实现和测试这些操作以理解它们的行为。这些基础集合操作构成了复杂数据处理任务的骨干，并广泛应用于各种问题。高效且正确地使用它们对于健壮的\
  \ Java 应用至关重要。\n\n### 4.1 自定义实现\n当 Java 框架（JCF）提供的标准实现无法满足特定的性能或功能需求时，创建一个自定义集合可能会很有帮助。本节介绍了如何通过扩展\
  \ `AbstractSet` 类并遵循 `Set` 接口来设计和实现自定义集合。深入理解 `equals(Object o)` 和 `hashCode()`\
  \ 方法也至关重要，因为这些方法确保了集合操作的完整性，特别是对于唯一性。\n\n为了说明这一过程，我们将实现一个使用简单数组的自定义集合。这个示例虽然对于实际应用并非最优，但它突显了创建自定义集合的基本原理。\n\
  \n```java\nimport java.util.AbstractSet; \nimport java.util.Iterator; \nimport java.util.NoSuchElementException;\
  \ \n\npublic class ArraySet<E> extends AbstractSet<E> { \n  private Object[] elements;\
  \ \n  private int size; \n  public ArraySet() { \n    elements = new Object[10];\
  \ \n    size = 0; \n  }\n  public boolean add(E e) { \n    if (contains(e)) { \n\
  \        return false; \n      }\n    if (size == elements.length) { \n        Object[]\
  \ newElements = new Object[size * 2];\n        System.arraycopy(elements, 0, newElements,\
  \ 0, size);\n        elements = newElements;\n      }\n    elements[size] = e; \n\
  \    size++; \n    return true; \n  }\n  // 其他方法省略\n}\n```\n\n在上面的初始实现中，`ArraySet`\
  \ 类扩展了 `AbstractSet` 并提供了添加元素的基本支持。支撑集合的数组 `elements` 长度为 10，满时会自动扩展。这种扩展对于处理任意数量的元素至关重要。\n\
  \n为了确保只添加唯一元素，`add` 方法首先使用 `contains` 方法检查元素是否已在集合中。接下来需要实现 `contains` 方法。\n\n```java\n\
  @Override\npublic boolean contains(Object o) { \n  for (int i = 0; i < size; i++)\
  \ { \n    if (elements[i].equals(o)) { \n        return true; \n      }\n  }\n \
  \ return false;\n}\n```\n\n`contains` 方法遍历当前元素以检查对象 `o` 是否。这种简单的遍历适用于小集合，但对于大数据集，建议使用更高效的搜索机制来优化性能。\n\
  \n接下来，我们将实现 `iterator` 方法以遍历集合中的元素。\n\n```java\n@Override\npublic Iterator<E> iterator()\
  \ { \n  return new Iterator<E>() { \n    private int index = 0; \n    @Override\n\
  \    public boolean hasNext() { \n      return index < size; \n    }\n    @Override\
  \ \n    public E next() { \n      if (!hasNext()) { \n          throw new NoSuchElementException();\
  \ \n      }\n      return (E) elements[index++]; \n    }\n  }; \n}\n```\n\n`ArraySet`\
  \ 类提供的迭代器实现了 `Iterator` 接口，提供了正确迭代所需的 `hasNext` 和 `next` 方法。它简单地遍历数组，按照添加顺序返回元素。\n\
  \n最后，`size` 方法返回集合中的元素数量，确保了符合 `Set` 接口。\n\n```java\n@Override\npublic int size()\
  \ { \n  return size; \n}\n```\n\n完整的自定义集合实现必须处理许多其他细节，例如删除元素、确保线程安全以及提供高效的存储和检索机制。提供的\
  \ `ArraySet` 类是一个演示基本原理的简化示例。更高级的实现（如基于哈希表或平衡树的实现）具有更好的性能特性，应该在更具要求的应用中进行探索。\n\n\
  \n\n\n在设计自定义集合实现时，考虑元素顺序、线程安全和内存开销的影响至关重要。使用 `HashMap` 等数据结构或 `java.util.concurrent`\
  \ 中提供的并发结构可以缓解许多与手动管理相关的挑战。\n\n以下是一个基于哈表的集合实现的高级骨架，它展示了从概念设计到在性能和可扩展性关键的环境中实际应用的跨越。\n\
  \n```java\npublic class HashTableSet<E> extends AbstractSet<E> { \n\n    private\
  \ static final int DEFAULT_CAPACITY = 16; \n\n    private LinkedList<E>[] table;\
  \ \n\n    private int size; \n\n    public HashTableSet() { \n      table = new\
  \ LinkedList[DEFAULT_CAPACITY]; \n      size = 0; \n    } \n\n    private int hash(Object\
  \ o) { \n      return (o == null) ? 0 : Math.abs(o.hashCode() % table.length); \n\
  \    } \n\n    @Override \n    public boolean add(E e) { \n      int index = hash(e);\
  \ \n      if (table[index] == null) { \n        table[index] = new LinkedList<E>();\
  \ \n      } else if (table[index].contains(e)) { \n        return false; \n    \
  \  } \n      table[index].add(e); \n      size++; \n      return true; \n    } \n\
  \n    @Override \n    public boolean contains(Object o) { \n      int index = hash(o);\
  \ \n      return table[index] != null && table[index].contains(o); \n    } \n\n\
  \    @Override \n    public Iterator<E> iterator() { \n      return new HashTableIterator();\
  \ \n    } \n\n    @Override \n    public int size() { \n      return size; \n  \
  \  } \n\n    private class HashTableIterator implements Iterator<E> { \n      private\
  \ int index = 0; \n      private Iterator<E> current; \n\n      @Override \n   \
  \   public boolean hasNext() { \n          if (current != null && current.hasNext())\
  \ { \n            return true; \n          } \n          while (index < table.length\
  \ && (table[index] == null || !table[index].iterator().hasNext())) { \n        \
  \    index++; \n          } \n          if (index < table.length) { \n         \
  \   current = table[index].iterator(); \n            return current.hasNext(); \n\
  \          } \n          return false; \n      } \n\n      @Override \n      public\
  \ E next() { \n          if (!hasNext()) { \n            throw new NoSuchElementException();\
  \ \n          } \n          return current.next(); \n      } \n    }\n}\n```\n\n\
  开发自定义集合实现允许针对特定需求进行定制处理，并在默认 Java 框架无法满足需求时优化性能。理解并应用这些概念对于高级开发至关重要，特别是在高性能领域。\n\
  \n# 第 5 章：探索 Map：键值对\n\n本章深入介绍了 Java 框架中的 Map，它用于处理键值对的关联。内容涵盖了 `HashMap`、`LinkedHashMap`、`ConcurrentHashMap`、`WeakHashMap`\
  \ 和 `EnumMap`。本章概述了常见的 Map 操作、性能考量和迭代技术。它还讨论了实际用例和自定义 Map 实现，为如何在 Java 中有效利用不同类型的\
  \ Map 提供了全面的理解。\n\n## 5.1 Map 简介\n\nMap 是 Java 框架 (JCF) 中的核心组件，旨在处理唯一键与其对应值之间的关联。Map\
  \ 的概念允许高效的检索、插入和删除，使其与列表和集合等集合类型区分开来。理解 Map 的基础对于利用其能力解决各种挑战至关重要。\n\nJava 中的 `Map`\
  \ 是一个接口，表示键值对集合，其中每个键恰好对应一个值。键在 Map 中必须是唯一的，但值可以重复。`Map` 的主要目标是提供一种根据其键高效查找值的机制。\n\
  \nJava 框架提供了 `Map` 接口的多种实现，每种实现都有独特的特征和用场景。最常用的包括 `HashMap`、`LinkedHashMap`、`ConcurrentHashMap`、`WeakHashMap`\
  \ 和 `EnumMap`。这些实现中的都提供了不同的权衡和内存占用。\n\n`Map` 接口支持的基本操作包括：\n\n*   `put(K key, V value)`：将指定的值与\
  \ Map 中的指定键关联。如果键已存在，则旧值将被新值替换。\n*   `get(Object key)`：返回指定键映射到的值；如果 Map 不包含该键的映射，则返回\
  \ `null`。\n*   `remove(Object key)`：如果存在，则从 Map 中移除指定键的映射。\n*   `containsKey(Object\
  \ key)`：如果 Map 包含指定键的映射，则返回 `true`。\n*   `containsValue(Object value)`：如果此 Map 将一个或多个键映射到指定的值，则返回\
  \ `true`。\n*   `keySet()`：返回 Map 中包含的键的 `Set` 视图。\n*   `values()`：返回 Map 中包含的值的\
  \ `Collection` 视图。\n*   `entrySet()`：返回 Map 中包含的映射的 `Set` 视图。\n\n这里是一个演示 `HashMap`\
  \ 类使用的示例，`Map` 接口的一个广泛使用的实现。\n\n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\
  \npublic class MapExample { \n  public static void main(String[] args) { \n    //\
  \ 创建一个 HashMap\n    Map<String, Integer> map = new HashMap<>(); \n      // 向 map\
  \ 中添加键值对\n    map.put(\"Alice\", 30); \n    map.put(\"Bob\", 25); \n    map.put(\"\
  Carol\", 35); \n      // 根据键检索值\n    Integer age = map.get(\"Alice\"); \n    System.out.println(\"\
  Alice 的年龄: \" + age); \n      // 检查键是否存在于 map 中\n      boolean hasKey = map.containsKey(\"\
  Dave\");\n      System.out.println(\"Dave 在 map 中吗? \" + hasKey);\n      // 从 map\
  \ 中移除一个键值对\n      map.remove(\"Bob\");\n      // 遍历节点\n      for (Map.Entry<String,\
  \ Integer> entry : map.entrySet()) {\n        System.out.println(entry.getKey()\
  \ + \": \" + entry.getValue());\n      }\n  }\n}\n```\n\n当执行此代码时，输出将是：\n\n```\n\
  Alice 的年龄: 30 \nDave 在 map 中吗? false \nAlice: 30 \nCarol: 35\n```\n\n\n\n\n\n###\
  \ 5.2 HashMap: 无序的键值对\n\n在 Java Collections 中，`HashMap` 类是管理键值对的关键数据结构。`HashMap`\
  \ 在 Java 1.2 中引入，提供了 `Map` 接口的非同步、高效且基于哈希表的实现。它方便了快速的插入、删除和查找，使其成为许多应用程序的流行选择。\n\
  \n`HashMap` 根据键的哈希值（hash code）来组织条目。尽管 `HashMap` 中键的顺序是不保证的，但它利用哈希值来优化性能，通常在基本操作上可以达到常数时间复杂度。理解\
  \ `HashMap` 的内部机制和细微差别对于有效使用它至关重要。\n\n```java\nimport java.util.HashMap; \n\nimport\
  \ java.util.Map; \n\npublic class HashMapExample { \n\n    public static void main(String[]\
  \ args) { \n      // 创建 HashMap 实例 \n      Map<Integer, String> map = new HashMap<>();\
  \ \n      // 向 HashMap 添加键值对 \n      map.put(1, \"Value1\"); \n      map.put(2,\
  \ \"Value2\"); \n      map.put(3, \"Value3\"); \n      // 通过键检索值 \n      String\
  \ value = map.get(1); \n      System.out.println(\"Key 1: \" + value); \n      //\
  \ 检查键是否存在 \n      boolean containsKey = map.containsKey(2); \n      System.out.println(\"\
  Contains key 2: \" + containsKey); \n      // 一个键值对 \n      String removedValue\
  \ = map.remove(3); \n      System.out.println(\"Removed key 3 with value: \" + removedValue);\
  \ \n      // 遍历 HashMap 的条目 \n      for (Map.Entry<Integer, String> entry : map.entrySet())\
  \ { \n          System.out.println(\"Key: \" + entry.getKey() + \", Value: \" +\
  \ entry.getValue()); \n      } \n    } \n}\n```\n\n在这个示例中，我们实例化了一个带有 `Integer` 键和\
  \ `String` 值的 `HashMap`。`put` 方法用于插入条目，`get` 通过键检索值，而 `remove` 根据键删除条目。`containsKey`\
  \ 方法检查特定键是否存在，`entrySet` 方法允许对映射条目进行遍历。\n\n`HashMap` 操作的一个关键方面是处理哈希冲突（hash collisions）。当两个键产生相同的哈希值时，`HashMap`\
  \ 使用链表来管理同一个桶（bucket）中的条目。Java 8 及更高版本进一步优化了这一点，当一个桶中的条目数量超过某个阈值时，会将这些链表转换为平衡树，将最坏情况性能从\
  \ `O(n)` 提高到 `O(log n)`。\n\n```java\nimport java.util.HashMap; \n\nimport java.util.Map;\
  \ \n\nclass Key { \n    private int id; \n    public Key(int id) { \n      this.id\
  \ = id; \n    } \n\n    @Override \n    public int hashCode() { \n      // 自定义的哈希值实现导致冲突\
  \ \n      return id % 10; \n    } \n\n    @Override \n    public boolean equals(Object\
  \ obj) { \n      if (this == obj) return true; \n      if (obj == null || getClass()\
  \ != obj.getClass()) return false; \n      Key key = (Key) obj; \n      return id\
  \ == key.id; \n    } \n}\n\npublic class HashCollisionExample {\n    public static\
  \ void main(String[] args) { \n      Map<Key, String> map = new HashMap<>(); \n\
  \      map.put(new Key(1), \"Value1\"); \n      map.put(new Key(1), \"Value1\");\
  \ \n      map.put(new Key(2), \"Value2\"); \n      System.out.println(\"Entries\
  \ in HashMap:\"); \n      for (Map.Entry<Key, String> entry : map.entrySet()) {\
  \ \n          System.out.println(\"Key: \" + entry.getKey() + \", Value: \" + entry.getValue());\
  \ \n      } \n    } \n}\n```\n\n这段代码演示了 `HashMap` 发生哈希冲突的可能。自定义的 `Key` 类通过返回 `id\
  \ % 10` 强制产生冲突，说明了多个键如何落入同一个桶中。\n\n在使用 `HashMap` 时，理解它的容量（capacity）和负载因子（load factor）同样重要。容量是哈希表中桶的数量，而负载因子是决定何时调整大小的指标。当条目数量超过容量与负载因子的积时，`HashMap`\
  \ 会自动调整大小。默认情况下，初始容量为 `16`，负载因子为 `0.75`。可以通过以下方式优化调整：\n\n```java\nimport java.util.HashMap;\
  \ \n\nimport java.util.Map; \n\npublic class CustomHashMap { \n    public static\
  \ void main(String[] args) { \n      // 自定义初始容量和负载因子 \n      Map<String, String>\
  \ map = new HashMap<>(32, 0.5f); \n      map.put(\"Key1\", \"Value1\"); \n     \
  \ map.put(\"Key2\", \"Value2\"); \n      System.out.println(\"Map: \" + map); \n\
  \    } \n}\n```\n\n将初始容量设置为 `32` 负载因子设置为 `0.5`，可以确保 `HashMap` 调整大小的频率比默认设置更低。\n\n\
  最后，意识到 `HashMap` 的非线程安全是非常重要的。多线程同时修改 `HashMap` 可能会导致问题。对于并发操作，使用 `ConcurrentHashMap`\
  \ 或进行同步是必要的。\n\n```java\nimport java.util.Collections; \n\nimport java.util.HashMap;\
  \ \n\nimport java.util.Map; \n\npublic class SynchronizedHashMap { \n    public\
  \ static void main(String[] args) { \n      // 使用 Collections 工具类的同步 HashMap \n\
  \      Map<String, String> map = Collections.synchronizedMap(new HashMap<>()); \n\
  \      map.put(\"Key1\", \"Value1\"); \n      map.put(\"Key2\", \"Value2\"); \n\
  \      synchronized (map) {\n        for (Map.Entry<String, String> entry : map.entrySet())\
  \ { \n            System.out.println(\"Key: \" + entry.getKey() + \", Value: \"\
  \ + entry.getValue()); \n        } \n      }\n    } \n}\n```\n\n### 5.3 LinkedHashMap:\
  \ 有序的键值对\n\n`LinkedHashMap` 是 `Map` 接口的一种实现，它扩展了 `HashMap` 并增加了可预测的顺序。这种特性在需要插入顺序或维护最近未使用（LRU）顺序时，`LinkedHashMap`\
  \ 特别有用。以下是 `LinkedHashMap` 创建和使用的示例：\n\n```java\nimport java.util.LinkedHashMap;\
  \ \n\nimport java.util.Map; \n\npublic class LinkedHashMapExample { \n    public\
  \ static void main(String[] args) { \n      Map<Integer, String> linkedHashMap =\
  \ new LinkedHashMap<>(); \n      // 向 LinkedHashMap 添加元素 \n      linkedHashMap.put(1,\
  \ \"One\"); \n      linkedHashMap.put(2, \"Two\"); \n      linkedHashMap.put(3,\
  \ \"Three\"); \n      // 打印元素观察顺序 \n      System.out.println(linkedHashMap); \n\
  \      // 访问元素观察顺序保持情况\n      linkedHashMap.get(2); // 在插入顺序 LinkedHashMap 中，访问不会改变顺序\
  \ \n      System.out.println(linkedHashMap); \n    } \n}\n```\n\n```\n输出: \n{1=One,\
  \ 2=Two, 3=Three} \n{1=One, 2=Two, 3=Three}\n```\n\n**可预测的顺序**\n\n`LinkedHashMap`\
  \ 的定义特征之一是它确保了对键、值或条目的迭代顺序是可预测的。默认情况下，`LinkedHashMap` 维护插入顺序迭代，这意味着条目是按照它们被插入的顺序进行迭代的。\n\
  \n\n\n\n此外，`LinkedHashMap` 可以配置为维护访问顺序（access-order）迭代，这意味着项按照它们最后被访问的顺序进行迭代，从最久未访问到最近访问。这对于缓存机制特别有用，可以使用访问顺序模式来实现\
  \ `LRU`（最近最少使用）缓存。以下是一个演示访问顺序 `LinkedHashMap` 的示例：\n\n```java\nimport java.util.LinkedHashMap;\
  \ \n\nimport java.util.Map; \n\npublic class LRUCacheExample { \n\n  public static\
  \ void main(String[] args) { \n      // 设置 accessOrder=true 以实现 LRU 访问顺序 \n\n  \
  \    LinkedHashMap<Integer, String> lruCache = new LinkedHashMap<>(16, 0.75f, true);\
  \ \n      // 向 LinkedHashMap 添加元素 \n      lruCache.put(1, \"One\"); \n      lruCache.put(2,\
  \ \"Two\"); \n      lruCache.put(3, \"Three\"); \n      System.out.println(lruCache);\
  \ \n      // 访问元素 \n      lruCache.get(2); \n      lruCache.get(1); \n      System.out.println(lruCache);\
  \ \n      // 添加另一个元素 \n      lruCache.put(4, \"Four\"); \n      System.out.println(lruCache);\
  \ \n  } \n}\n```\n输出： \n```\n{1=One, 2=Two, 3=Three} \n{3=Three, 2=Two, 1=One} \n\
  {3=Three, 2=Two, 1=One, 4=Four}\n```\n\n访问元素 `get(2)` 和 `get(1)` 会移动它们在迭代顺序中的位置，展示了\
  \ `LRU` 的特性。\n\n## 移除旧节点\n\n`LinkedHashMap` 类还提供了一种移除“最旧”项的机制。可以通过重写 `removeEldestEntry`\
  \ 方法来实施移除旧项的策略。该方法会在 `put` 和 `putAll` 操作在插入新项后被调用。\n\n以下是一个演示如何通过自定义缓存大小限制来扩展 `LinkedHashMap`\
  \ 的示例：\n\n```java\nimport java.util.LinkedHashMap; \n\nimport java.util.Map; \n\n\
  public class LRUCacheWithSizeLimit<K, V> extends LinkedHashMap<K, V> { \n\n  private\
  \ final int maxSize; \n\n  public LRUCacheWithSizeLimit(int maxSize) { \n      super(16,\
  \ 0.75f, true); \n      this.maxSize = maxSize; \n  } \n\n  @Override \n  protected\
  \ boolean removeEldestEntry(Map.Entry<K, V> eldest) { \n      return size() > maxSize;\
  \ \n  } \n\n  public static void main(String[] args) { \n      LRUCacheWithSizeLimit<Integer,\
  \ String> cache = new LRUCacheWithSizeLimit<>(3); \n      cache.put(1, \"One\");\
  \ \n      cache.put(2, \"Two\"); \n      cache.put(3, \"Three\"); \n      System.out.println(cache);\
  \ \n      cache.get(1); \n      cache.get(2); \n      cache.put(4, \"Four\"); \n\
  \      System.out.println(cache); \n      cache.put(5, \"Five\"); \n      System.out.println(cache);\
  \ \n  } \n}\n```\n输出： \n```\n{1=One, 2=Two, 3=Three} \n{3=Three, 1=One, 2=Two, 4=Four}\
  \ \n{2=Two, 4=Four, 5=Five}\n```\n在此实现中，缓存的最大最大限制为 3。当添加第四个项时，根据 LRU 策略，最旧的项会被移除。\n\
  \n### 性能考虑\n\n由于增加了维护双向链表的额外开销，`LinkedHashMap` 的性能略逊于 `HashMap`。然而，对于许多应用程序来说，这种性能差异是可以忽略不计的。迭代顺序的高预测性提供了显著优势，这些优势超过了这种开销。在实践中，`LinkedHashMap`\
  \ 对于许多需要迭代顺序的场景非常有用，例如创建对顺序有要求的缓存或序列。\n\n## 5. TreeMap：排序的键值对\n\n`TreeMap` 是 Java\
  \ 框架的一部分，实现了 `Map` 接口。与以无序方式存储键值对的 `HashMap` 不同，`TreeMap` 保持其键的排序状态。内部，`TreeMap`\
  \ 使用 `红黑树`（一种自平衡二叉树）来存储数据。这确保了 map 保持排序状态，并允许插入、删除和查找操作的时间复杂度达到 `log(n)`。\n\n为了说明\
  \ `TreeMap` 的基本用法，请考虑以下示例：\n\n```java\nimport java.util.TreeMap;\n\npublic class\
  \ TreeMapExample { \n  public static void main(String[] args) { \n      TreeMap<String,\
  \ Integer> map = new TreeMap<>(); \n      // 向 TreeMap 添加元素 \n      map.put(\"Apple\"\
  , 5); \n      map.put(\"Orange\", 7); \n      map.put(\"Banana\", 3); \n      map.put(\"\
  Pineapple\", 8); \n      // 显示 TreeMap 中的元素 \n      for (Map.Entry<String, Integer>\
  \ entry : map.entrySet()) { \n          System.out.println(\"Key: \" + entry.getKey()\
  \ + \", Value: \" + entry.getValue()); \n      } \n  } \n}\n```\n在示例中，`\"Apple\"\
  , \"Orange\", \"Banana\", \"Pineapple\"` 键按自然顺序排序。该程序的输出如下：\n\n```\nKey: Apple,\
  \ Value: 5\nKey: Banana, Value: 3\nKey: Orange, Value: 7\nKey: Pineapple, Value:\
  \ 8\n```\n\n\n\n\n```java\n// 向 TreeMap 中添加元素\nmap.put(\"A\", 1); \nmap.put(\"B\"\
  , 2); \nmap.put(\"C\", 3); \nmap.put(\"D\", 4); \n\n// 使用导航方法查找元素\nMap.Entry<String,\
  \ Integer> lowerEntry = map.lowerEntry(\"C\"); // key < \"C\" 的 Entry\nMap.Entry<String,\
  \ Integer> floorEntry = map.floorEntry(\"C\"); // key <= \"C\" 的 Entry\nMap.Entry<String,\
  \ Integer> ceilingEntry = map.ceilingEntry(\"C\"); // key >= \"C\" 的 Entry\nMap.Entry<String,\
  \ Integer> higherEntry = map.higherEntry(\"C\"); // key > \"C\" 的 Entry \n\n// 显示导航结果\n\
  System.out.println(\"Lower Entry: \" + lowerEntry); \nSystem.out.println(\"Floor\
  \ Entry: \" + floorEntry); \nSystem.out.println(\"Ceiling Entry: \" + ceilingEntry);\
  \ \nSystem.out.println(\"Higher Entry: \" + higherEntry); \n} \n}\n```\n\n该程序的输出将是：\n\
  \n```\nLower Entry: A=1 \nFloor Entry: C=3 \nCeiling Entry: C=3 \nHigher Entry:\
  \ D=4\n```\n\n根据其特性，当排序迭代顺序或需要对键进行范围查询时，应该使用 `TreeMap`。然而，需要考虑到由于其排序属性，`TreeMap`\
  \ 的开销比 `HashMap` 高。因此，如果不需要特定的顺序或范围查询，其他 map 实现可能更高效。\n\n### 5.5 ConcurrentHashMap:\
  \ 线程安全的 Map\n\n并发编程涉及多个线程同时操作共享数据的场景，这需要使用能够处理并发访问的数据结构以确保数据完整性。`ConcurrentHashMap`\
  \ 是 `java.util.concurrent` 包的一部分，提供了一个 `HashMap` 的线程安全替代方案，且不需要显式同步。\n\n`ConcurrentHashMap`\
  \ 通过将 map 分为多个部分（或段）来实现高并发性，每个部分由自己的锁控制。这种分段机制允许多个线程并发地读写 map 的不同部分，显著提高了多线程应用程序中的吞吐量。\n\
  \n```java\nimport java.util.concurrent.ConcurrentHashMap; \nimport java.util.concurrent.ExecutorService;\
  \ \nimport java.util.concurrent.Executors; \n\npublic class ConcurrentHashMapExample\
  \ { \n    public static void main(String[] args) { \n        ConcurrentHashMap<Integer,\
  \ String> map = new ConcurrentHashMap<>(); \n        ExecutorService executor =\
  \ Executors.newFixedThreadPool(2); \n        Runnable task1 = () -> { \n       \
  \     for (int i = 0; i < 50; i++) { \n                map.put(i, \"Value\" + i);\
  \ \n            } \n        }; \n        Runnable task2 = () -> { \n           \
  \ for (int i = 50; i < 100; i++) { \n                map.put(i, \"Value\" + i);\n\
  \            } \n        }; \n        executor.submit(task1); \n        executor.submit(task2);\
  \ \n        executor.shutdown();\n        while (!executor.isTerminated()) { \n\
  \            // 等待两个任务完成\n        } \n        System.out.println(map); \n    }\n\
  }\n```\n\n上面的示例演示了在多个线程向 map 写入时使用 `ConcurrentHashMap`。map 的内部结构允许这些操作在不产生竞争的情况下进行，导致\
  \ map 中填充了来自两个任务的键值对，而无需额外的锁或同步。\n\n`ConcurrentHashMap` 的关键属性确保了线程安全和性能：\n- **强一致性**：每个单独原子操作（如\
  \ `put()`、`get()` 和 `replace()`）都保证了一致性。\n- **无锁读取**：多个线程可以并发地从 map 中读取而无需锁定。对 map\
  \ 内容的迭代使用“快照”方法，它反映的是迭代过程中某个时刻的状态。\n- **高并发性**：内部分段锁（通常称为分段锁/striping）通过允许并发修改来最小化竞争。\n\
  - **不允许空（null）**：`ConcurrentHashMap` 不允许 null 键或 null 值。尝试插入 null 键或 null 值将导致 `NullPointerException`。\n\
  \n分段机制对于 `ConcurrentHashMap` 的设计至关重要。它通过隔离单个段有效地减少了竞争。每个段包含哈希桶的子集并拥有自己的锁，允许线程独立地在不同部分进行操作。以下是关于其实现的更深入的见解：\n\
  \n**算法：ConcurrentHashMap 中的基本操作**\n- **输入**：键值对 (K, V)\n- **输出**：线程安全的 `ConcurrentHashMap`\n\
  \n1. `put(K, V)`：\n   - 定位合适的段\n   - 获取段锁\n   - 计算 `K` 的哈希值\n   - 索引段的桶数组\n   -\
  \ 插入新的 `K, V` 键对\n   - 释放段锁\n2. `get(K)`：\n   - 定位合适的段\n   - 计算 `K` 的哈希值\n   - 索引段的桶数组\n\
  \   - 返回与 `K` 关联的值\n3. `remove(K)`：\n   - 定位合适的段\n   - 获取段锁\n   - 计算 `K` 的哈希值\n\
  \   - 索引段的桶数组\n   - 移除 `K` 及关联的值\n   - 释放段锁\n4. `replace(K, V)`：\n   - 定位合适的段\n\
  \   - 获取段锁\n   - 计算 `K` 的哈希值\n   - 索引段的桶数组\n   - 替换现有的值 `V`\n   - 释放段锁\n\nJava 8\
  \ 的语法改进是引入了利用 lambda 表达式更具表达力的方法。这些方法包括 `computeIfAbsent`、`merge` 等，促进了在 map 内部进行线程安全的计算。\n\
  \n```java\npublic class ConcurrentHashMapLambda { \n    public static void main(String[]\
  \ args) { \n        ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();\
  \ \n        map.put(\"a\", 1); \n        map.put(\"b\", 2); \n        // computeIfAbsent\
  \ \n        map.computeIfAbsent(\"c\", key -> 3); \n        // merge \n        map.merge(\"\
  b\", 2, (existingVal, newVal) -> existingVal + newVal); \n        // forEach \n\
  \        map.forEach((key, value) -> System.out.println(key + \": \" + value));\
  \ \n    }\n}\n```\n\n`ConcurrentHashMap` 的用例常见的需要高吞吐量和低延迟的场景。例如，设计一个多个线程采集数据并更新共享数据结构的实时分析仪表盘，将受益于\
  \ `ConcurrentHashMap` 保证的高并发性。\n\n### 5.6 WeakHashMap: 弱引用键的 Map\n\nJava 中的 `WeakHashMap`\
  \ 是 `Map` 接口的一种实现，它使用 `java.lang.ref.WeakReference` 保存键。这允许在键不再被使用时由垃圾回收器移除，使得 `WeakHashMap`\
  \ 对于内存敏感的应用（如缓存）特别有用。\n\n在 `HashMap` 中，键是强引用的，这意味着只要 map 持有键，该键就无法被垃圾回收。如果 map 持有了应用程序其他部分不再需要的键，会导致内存泄漏。相反，`WeakHashMap`\
  \ 允许在键没有其他引用时对其进行垃圾回收。当垃圾回收器回收键时，`WeakHashMap` 中对应的条目也会从 map 中移除。\n\n```java\nimport\
  \ java.util.Map; \nimport java.util.WeakHashMap; \n\npublic class WeakHashMapExample\
  \ { \n    public static void main(String[] args) { \n        Map<Object, String>\
  \ weakHashMap = new WeakHashMap<>(); \n        Object key1 = new Object(); \n  \
  \      Object key2 = new Object(); \n        weakHashMap.put(key1, \"value1\");\
  \ \n        weakHashMap.put(key2, \"value2\"); \n        System.out.println(\"置空引用前:\
  \ \" + weakHashMap); // {key1=value1, key2=value2} \n        key1 = null; // 可被\
  \ GC \n        System.gc(); \n    } \n}\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  After nulling key1 reference and GC: \" + weakHashMap); // {key2=value2} or {key1=value1,\
  \ key2=value2} \n\nkey2 = null; // Eligible for GC \n\nSystem.gc(); \n\nSystem.out.println(\"\
  After nulling key2 reference and GC: \" + weakHashMap); // {} \n\n} \n}\n\n上面的示例演示了\
  \ `WeakHashMap` 的简单用法。映射中添加了两个键（`key1` 和 `key2`）。在将 `key1` 设为空并请求垃圾回收后，`key1` 及其关联的值可以从映射中移除。同样，将\
  \ `key2` 设为空并强制进行垃圾回收可以确保 `key2` 及其关联的值也会被移除。\n\n`WeakHashMap` 特别适用于规范化映射（canonicalizing\
  \ mappings）等场景，在这些场景中，只要应用程序还能访问到键，值就会被存储。规范化映射对于那些即当键不再被任何线程可访问时，就没有必要在映射中保留条目的情况非常有用。\n\
  \n`WeakHashMap` 的一个独特属性是它处理键被垃圾回收条目时的行为。这些条目会自动从映射中移除，无需手动清理。然而，这意味着 `WeakHashMap`\
  \ 不提供可预测的迭代行为，因为条目可能会由于垃圾回收而被异步移除。\n\n```java\nimport java.util.Iterator; \n\nimport\
  \ java.util.Map; \n\nimport java.util.WeakHashMap; \n\npublic class WeakHashMapIterationExample\
  \ { \n\n    public static void main(String[] args) { \n\n        Map<Object, String>\
  \ weakHashMap = new WeakHashMap<>(); \n        Object key1 = new Object(); \n  \
  \      Object key2 = new Object(); \n        weakHashMap.put(key1, \"value1\");\
  \ \n        weakHashMap.put(key2, \"value2\"); \n        key1 = null; // Eligible\
  \ for GC \n        System.gc(); \n        Iterator<Map.Entry<Object, String>> iterator\
  \ = weakHashMap.entrySet().iterator(); \n        while(iterator.hasNext()) { \n\
  \            Map.Entry<Object, String> entry = iterator.next(); \n            if\
  \ (entry.getValue().equals(\"value2\")) { \n                iterator.remove(); \n\
  \            } \n        } \n        System.out.println(\"After iteration and removal:\
  \ \" + weakHashMap); // (May vary depending on GC timing) \n\n    } \n}\n```\n\n\
  在上面的示例中，在垃圾回收可能异步发生的同时对 `WeakHashMap` 进行迭代会导致非确定性行为。注意的是，条目可以在迭代期间被移除，导致在任何时间点正在迭代的元素集产生潜在的不一致性。\n\
  \n对于对可预测行为至关重要的用例，特别是在迭代期间或必须维护特定映射状态保证时，`WeakHashMap` 可能不是最佳选择。可能更倾向于使用 `ConcurrentHashMap`\
  \ 或带有手动清理机制的传统 `HashMap` 作为替代。\n\n与其他映射类型一样，`WeakHashMap` 的键必须具有正确的 `equals()` 和\
  \ `hashCode()` 实现。然而，由于弱引用的性质，键必须考虑自然标识性（natural identity），以避免意外的垃圾回收或过早移除条目。\n\n\
  正确使用 `WeakHashMap` 可以实现高效的内存管理，而不会牺牲特定工作负载的性能。理解其优点和固有的缺陷，可以确保开发者在为应用程序需求选择合适的映射类型时做出明智的决策。\n\
  \n### 5.7 IdentityHashMap：通过引用比较键\n\n`IdentityHashMap` 是 Java 集合框架中 `Map` 接口的一种特殊实现。与更常用的\
  \ `HashMap` 不同，`HashMap` 使用 `equals()` 方法来比较键，而 `IdentityHashMap` 依赖引用相等性（`==`）来进行比较。这种独特的方法在引用至关重要的某些特殊场景下可能特别有益。\n\
  \n`IdentityHashMap` 定义在 `java.util` 包中，并继承自 `AbstractMap`。\n\n```java\nimport java.util.IdentityHashMap;\n\
  \npublic class IdentityHashMapExample { \n    public static void main(String[] args)\
  \ { \n        IdentityHashMap<String, String> identityMap = new IdentityHashMap<>();\
  \ \n        String key1 = new String(\"key\"); \n        String key2 = new String(\"\
  key\"); \n\n        identityMap.put(key1, \"value1\"); \n        identityMap.put(key2,\
  \ \"value2\"); \n\n        System.out.println(identityMap.containsKey(key1)); //\
  \ true\n        System.out.println(identityMap.containsKey(key2)); // false\n  \
  \      System.out.println(identityMap.size()); // 1\n    } \n}\n```\n\n#### 实现细节\n\
  \n`IdentityHashMap` 使用基于数组的结构来存储键值对。它随着条目的添加而增长。以下是其内部表示的简化视图：\n\n```java\nObject[]\
  \ table = new Object[32]; \ntable[0] = key1; \ntable[1] = value1; \ntable[2] = key2;\
  \ \ntable[3] = value2; \n```\n\n#### IdentityHashMap 与 HashMap HashMap\n\n`IdentityHashMap`\
  \ 和 `HashMap` 之间的主要区别在于它们的键比较策略：\n\n*   `HashMap` 使用 `equals()` 和 `hashCode()` 进行比较，适用于通用用途。\n\
  *   `IdentityHashMap` 使用引用相等性（`==`）和系统标识哈码（`System.identityHashCode()`），适用于需要引用比较的情况。\n\
  \n## 用例\n\n*   在需要缓存键的精确引用时实现备化（memoization）。\n*   在需要保留符号标识性的语言中的符号表。\n*   在 JVM\
  \ 操作期间（如垃圾回收或序列化/反序列化过程）唯一地跟踪对象引用。\n\n### 5.8 EnumMap：针对枚举的特殊映射\n\n`EnumMap` 是用于枚举类型键的特殊实现。作为\
  \ `java.util` 包的一部分，当键为枚举类型时，`EnumMap` 提供了一种高性能的通用映射替代方案。`EnumMap` 内部表示为数组，确保了高效的存储和快速的访问速度。\n\
  \n\n\n\n\n```java\nEnumMap<DayOfWeek, String> dayPlan = new EnumMap<>(DayOfWeek.class);\n\
  ```\n\n在这里，`dayPlan` 是一个 `EnumMap`，其中类型为 `DayOfWeek` 的枚举是键，值类型是 `String`。\n\n##\
  \ 基本操作\n\n与其他 map 一样，`EnumMap` 支持所有基本操作，如 `put`、`get` 和 `remove`。\n\n```java\ndayPlan.put(DayOfWeek.MONDAY,\
  \ \"Go to the gym\"); \nSystem.out.println(dayPlan.get(DayOfWeek.MONDAY)); // Output:\
  \ Go to the gym \ndayPlan.remove(DayOfWeek.MONDAY); \nSystem.out.println(dayPlan.get(DayOfWeek.MONDAY));\
  \ // Output: null\n```\n\n## 迭代\n\n`EnumMap` 中的迭代可以使用键集或项集（entry sets）进行，类似于其他 map。然而，需要注意的是，`EnumMap`\
  \ 中的迭代遵循枚举常量的自然顺序，即它们声明的顺序。\n\n```java\nfor (DayOfWeek day : dayPlan.keySet()) {\
  \ \n    System.out.println(day + \": \" + dayPlan.get(day)); \n}\n```\n\n## 效率考虑\n\
  \n由于其可预测的键集和基于数组的实现，对于枚举键，`EnumMap` 比 `HashMap` 更高效。主要的性能优势包括：\n\n*   **速度：** `EnumMap`\
  \ 为 `put`、`get` 和 `remove` 操作提供常数级性能。\n*   **内存效率：** 它使用非常紧凑的表示方法，仅为实际用键的枚举常量分配空间。\n\
  *   **无需哈希：** 键在内部表示为枚举常量的序值（ordinal values），消除了对昂贵的哈希计算的需求。\n\n## 限制与特性\n\n尽管 `EnumMap`\
  \ 具有显著优势，但开发者应该注意某些局限性：\n\n*   `EnumMap` 的键必须是单一枚举类型。\n*   不支持 `Null` 键，尝试使用 `null`\
  \ 作为键将导致 `NullPointerException`。\n*   `EnumMap` 不是同步的，这意味着在没有外部同步的情况下，不应由多个线程并发访问。\n\
  \n## 用例\n\n`EnumMap` 非常适用于枚举常量自然映射到值的场景。常见用例包括查找按类型枚举的配置或设置。\n\n```java\npublic\
  \ enum ConfigOption { \n    MAX_THREADS, CONNECTION_TIMEOUT, ENABLE_LOGGING \n}\
  \ \n\nEnumMap<ConfigOption, Object> configurations = new EnumMap<>(ConfigOption.class);\
  \ \nconfigurations.put(ConfigOption.MAX_THREADS, 10); \nconfigurations.put(ConfigOption.CONNECTION_TIMEOUT,\
  \ 5000); \nconfigurations.put(ConfigOption.ENABLE_LOGGING, true); \nSystem.out.println(configurations.get(ConfigOption.MAX_THREADS));\
  \ // Output: 10 \nSystem.out.println(configurations.get(ConfigOption.CONNECTION_TIMEOUT));\
  \ // Output: 5000 \nSystem.out.println(configurations.get(ConfigOption.ENABLE_LOGGING));\
  \ // Output: true\n```\n\n## 与其他 Map 类型对比\n\n与 `HashMap`、`TreeMap` 和其他 map 实现相比：\n\
  \n*   `EnumMap` 在处理枚举键时内存开销较低。\n*   `TreeMap` 提供了排序 map 功能，但是以增加复杂性和内存占用为代价的。\n\
  *   `HashMap` 更通通用，但对于枚举键，`EnumMap` 更快且更节省空间。\n\n`EnumMap` 针对枚举的专门设计确保了当键的领域为枚举类型时，它仍然是最优且推荐的选择。\n\
  \n## 5.9 常见 Map 操作\n\n在 Java 中，map 是强大且多功能的数据结构，允许键和值之间建立关联。它们支持许多操作，便于处理和使用键值对。本节将阐明最常用的\
  \ map 操作，并对每个操作及其典型用例提供基础性理解。我们将通过详细示例探索 `put`、`get`、`remove`、`containsKey`、`containsValue`、`size`、`isEmpty`\
  \ 和 `clear` 函数。\n\n### 1. 添加键值对：put\n\n`put` 方法用于向 map 中添加或更新键值对。如果指定的键已存在，则对应的值用传递给方法的新值更新。\n\
  \n```java\nimport java.util.HashMap; \nimport java.util.Map; \n\npublic class MapPutExample\
  \ { \n    public static void main(String[] args) { \n        Map<String, Integer>\
  \ map = new HashMap<>(); \n        map.put(\"apple\", 1); // 添加键 ‘apple’ 值为 1 \n\
  \        map.put(\"banana\", 2); // 添加键 ‘banana’ 值为 2 \n        map.put(\"apple\"\
  , 3); // 更新 ‘apple’ 的值为 3 \n        System.out.println(map); \n    }\n}\n```\n输出：`{banana=2,\
  \ apple=3}`\n\n### 2. 获取值：get\n\n`get` 方法检索与指定键关联的值。如果 map 中不存在该键，则该方法返回 `null`。\n\
  \n```java\nimport java.util.HashMap; \nimport java.util.Map; \n\npublic class MapExample\
  \ { \n    public static void main(String[] args) { \n        Map<String, Integer>\
  \ map = new HashMap<>(); \n        map.put(\"apple\", 1); \n        map.put(\"banana\"\
  , 2); \n        Integer value = map.get(\"apple\"); // 获取 ‘apple’ 的值 \n        System.out.println(\"\
  apple: \" + value); \n    }\n}\n```\n\n### 3. 删除键值对：remove\n\n`remove` 方法删除 map\
  \ 中的指定键值对。它返回与键关联的值，如果键不存在则返回 `null`。\n\n```java\nimport java.util.HashMap; \nimport\
  \ java.util.Map; \n\npublic class MapRemoveExample { \n    public static void main(String[]\
  \ args) { \n        Map<String, Integer> map = new HashMap<>(); \n        map.put(\"\
  apple\", 1); \n        map.put(\"banana\", 2); \n        Integer removedValue =\
  \ map.remove(\"apple\"); // 删除 ‘apple’\n        System.out.println(\"Removed: \"\
  \ + removedValue);\n    }\n}\n```\n\n### 4. 检查键是否存在：containsKey\n\n`containsKey`\
  \ 方法检查 map 是否包含特定键。如果包含则返回 `true`，否则返回 `false`。\n\n```java\nimport java.util.HashMap;\
  \ \nimport java.util.Map; \n\npublic class MapKeyExample { \n    public static void\
  \ main(String[] args) { \n        Map<String, Integer> map = new HashMap<>(); \n\
  \        map.put(\"apple\", 1); \n        System.out.println(\"contains apple: \"\
  \ + map.containsKey(\"apple\")); \n        System.out.println(\"contains banana:\
  \ \" + map.containsKey(\"banana\")); \n    }\n}\n```\n\n### 5. 检查值是否存在：containsValue\n\
  \n`containsValue` 方法确定 map 中是否包含指定值。如果存在则返回 `true`，否则返回 `false`。\n\n```java\nimport\
  \ java.util.HashMap; \nimport java.util.Map; \n\npublic class MapValueExample {\
  \ \n    public static void main(String[] args) { \n        Map<String, Integer>\
  \ map = new HashMap<>(); \n        map.put(\"apple\", 1); \n        System.out.println(\"\
  contains 1: \" + map.containsValue(1)); \n        System.out.println(\"contains\
  \ 3: \" + map.containsValue(3)); \n    }\n}\n```\n\n### 6. 获取 map 大小：size\n\n`size`\
  \ 方法返回 map 中键值对的数量。\n\n```java\nimport java.util.HashMap; \nimport java.util.Map;\
  \ \n\npublic class MapSizeExample { \n    public static void main(String[] args)\
  \ { \n        Map<String, Integer> map = new HashMap<>(); \n        map.put(\"apple\"\
  , 1); \n        map.put(\"banana\", 2); \n        System.out.println(\"size: \"\
  \ + map.size()); \n    }\n}\n```\n\n### 7. 检查 map 是否为空：isEmpty\n\n`isEmpty` 方法检查\
  \ map 是否包含任何键值对。如果 map 为空则返回 `true`，否则返回 `false`。\n\n```java\nimport java.util.HashMap;\
  \ \nimport java.util.Map; \n\npublic class MapIsEmptyExample { \n    public static\
  \ void main(String[] args) { \n        Map<String, Integer> map = new HashMap<>();\
  \ \n        System.out.println(\"is empty: \" + map.isEmpty()); \n        map.put(\"\
  apple\", 1); \n        System.out.println(\"is empty: \" + map.isEmpty()); \n  \
  \  }\n}\n```\n\n### 8. 清空 map：clear\n\n`clear` 方法从 map 中移除所有键值对。\n\n```java\nimport\
  \ java.util.HashMap; \nimport java.util.Map; \n\npublic class MapClearExample {\
  \ \n    public static void main(String[] args) { \n        Map<String, Integer>\
  \ map = new HashMap<>(); \n        map.put(\"apple\", 1); \n        map.put(\"banana\"\
  , 2); \n        map.clear(); \n        System.out.println(\"size after clear: \"\
  \ + map.size()); \n    }\n}\n```\n\n\n\n\n\n```java\npublic static void main(String[]\
  \ args) {\n    Map<String, Integer> map = new HashMap<>();\n    System.out.println(\"\
  Is map empty? \" + map.isEmpty());\n    map.put(\"apple\", 1);\n    System.out.println(\"\
  Is map empty? \" + map.isEmpty());\n}\n```\nOutput:\n```\nIs map empty? true\nIs\
  \ map empty? false\n```\n\n## 8. 清空 Map：clear\n\n`clear` 方法会移除 map 中所有的键值对。\n\n\
  ```java\nimport java.util.HashMap;\nimport java.util.Map;\n\npublic class MapClearExample\
  \ {\n    public static void main(String[] args) {\n        Map<String, Integer>\
  \ map = new HashMap<>();\n        map.put(\"apple\", 1);\n        map.put(\"banana\"\
  , 2);\n        map.clear();\n        System.out.println(\"Map after clear operation:\
  \ \" + map);\n    }\n}\n```\nOutput:\n```\nMap after clear operation: {}\n```\n\n\
  理解这些常见的 map 操作为有效操作 map 提供了基础知识。每个方法都具有特定的功能，能够对键值关联中存储的数据进行精确控制。掌握这些操作对于充分利用 Java\
  \ 应用中 map 的所有功能至关重要。\n\n### 5.10 Map 的性能考虑\n\n理解不同 map 实现的性能特征对于为特定应用选择合适的 map 至关重要。Java\
  \ 集合框架中 map 的性能取决于底层数据结构和所执行操作的性质。本节探讨了在处理 map 时需要考虑的关键性能方面，包括时间复杂度、空间复杂度和并发影响。\n\
  \n#### 时间复杂度\n\n不同的 map 实现为插入、删除和检索等基本操作提供了不同的时间复杂度。\n\n- **HashMap**: 在假设哈希函数能够均匀分布键的情况下，`HashMap`\
  \ 为 `get`、`put` 和 `remove` 操作提供了平均为 O(1) 的时间复杂度。然而，在最坏情况下，如果许多键哈希到同一个桶，时间复杂度可能会退化为\
  \ O(n)。\n- **LinkedHashMap**: `LinkedHashMap` 维护一个贯穿其条目的双向链表，这为操作增加了微小的开销。尽管如此，`get`、`put`\
  \ 和 `remove` 的平均时间复杂度仍为 O(1)。\n- **TreeMap**: `TreeMap` 被实现为红黑树，保证了 `get`、`put`\
  \ 和 `remove` 操作具有 O(log n) 的时间复杂度，提供了可预测的性能。\n- **ConcurrentHashMap**: `ConcurrentHashMap`\
  \ 旨在为并发访问提供具有高吞吐量的线程安全操作。其性能通常与 `HashMap` 相当，平均时间复杂度为 O(1)。\n- **WeakHashMap**:\
  \ `WeakHashMap` 上的操作性能与 `HashMap` 相似，平均时间复杂度为 O(1)。然而，垃圾回收的开销可能会轻微影响性能。\n- **IdentityHashMap**:\
  \ `IdentityHashMap` 的性能与 `HashMap` 相似，平均时间复杂度为 O(1)，但它使用的是引用等等性而非对象等等性。\n- **EnumMap**:\
  \ `EnumMap` 专门为枚举类型设计，提供了非常高效的常数时间操作。\n\n#### 空间复杂度\n\n不同 map 实现消耗的内存量也是一个关键因素。\n\
  \n- **HashMap 和 LinkedHashMap**: 两者都实现了基于哈表的结构。`HashMap` 需要额外的空间来存储桶数组和条目。`LinkedHashMap`\
  \ 额外维护了用于保持顺序的指针，导致略高的空间复杂度。\n- **TreeMap**: `TreeMap` 的红黑树结构由于需要为每个节点存储额外的指针和平衡信息，具有更高的开销。\n\
  - **ConcurrentHashMap**: `ConcurrentHashMap` 具有大量的开销，因为它维护了多个段或更复杂的数据结构来管理并发写入。\n\
  - **WeakHashMap**: `WeakHashMap` 对于在未引用时可以被垃圾回收的条目可能会使用较内存。这在键集很大的场景下是有的。\n- **IdentityHashMap**:\
  \ `IdentityHashMap` 通常是空间高效的，因为它避免了对象检查，只需要更精简的哈表结构。\n- **EnumMap**: `EnumMap` 内部使用数组将常量映射到其值，这对于预期用途来说是空间高效。\n\
  \n#### 并发与同步\n\n如果应用涉及对 map 的并发访问，考虑线程安全和同步是关重要的。\n\n- **HashMap**: 不是线程安全的。在多线程环境中使用没有外部同步的\
  \ `HashMap` 可能会导致数据损坏。\n```java\nMap<String, Integer> map = Collections.synchronizedMap(new\
  \ HashMap<>());\n```\n- **LinkedHashMap, TreeMap, WeakHashMap 和 IdentityHashMap**:\
  \ 与 `HashMap` 类似，这些不是线程安全的，并发访问需要外部同步。\n- **ConcurrentHashMap**: 为并发使用设计，它采用了一种复杂的锁机制，允许并发读取和高水平的并发写入，从而实现高吞吐量。\n\
  - **EnumMap**: 不是线程安全的。如果在并发设置中使用，需要外部同步。\n```java\nConcurrentHashMap<String, Integer>\
  \ concurrentMap = new ConcurrentHashMap<>();\n```\n\n#### Map 选择的实际指南\n\n选择合适的 map\
  \ 实现取决于你应用的具体需求：\n\n- 对于通用用途，且不考虑线程安全时，`HashMap` 通常是性能更好的选择。\n- 如果保持插入顺序至关重要，应该考虑\
  \ `LinkedHashMap`。\n- 当需要维护键的排序顺序时，尽管其时间复杂度较高，但 `TreeMap` 是恰的。\n- 在涉及并发访问且需要高吞吐量的应用中，`ConcurrentHashMap`\
  \ 是推荐的选择。\n- 对于出现键的垃圾回收问题的场景，`WeakHashMap` 可能会很有益。\n- 对于需要按引用比较键的情况，`IdentityHashMap`\
  \ 提供了最高效的解决方案。\n- 使用枚举作为键时，`EnumMap` 提供了无与伦比的效率和性能。\n\n考虑这些因素可以确保 map 操作的最优性能和资源。\n\
  \n### 5.11 遍历 Map\n\n为了在 Java 集合框架中熟练地操作和遍历 map，理解遍历 map 条目、键和值的各种技术是重要的。\n\n**使用\
  \ Entry Set**: 人可以使用 map 的 entry set 遍历键值对。entrySet 提供了 map 的 `Set<Map.Entry<K,\
  \ V>>` 视图，可以使用增强 for 循环或 `iterator` 进行遍历。这种方法是高效的，适用于大多数用例。\n\n```java\nMap<String,\
  \ Integer> map = new HashMap<>();\nmap.put(\"One\", 1);\nmap.put(\"Two\", 2);\n\
  map.put(\"Three\", 3);\nfor (Map.Entry<String, Integer> entry : map.entrySet())\
  \ {\n    System.out.println(\"Key: \" + entry.getKey() + \", Value: \" + entry.getValue());\n\
  }\n```\n\n**使用 Key Set**: 方法是遍历键集，然后获取这些键对应的值。这种方法通过键访问每个值，比使用 entry set 效率略低，因为需要额外的查找。\n\
  \n```java\nMap<String, Integer> map = new HashMap<>();\nmap.put(\"One\", 1);\nmap.put(\"\
  Two\", 2);\nmap.put(\"Three\", 3);\nfor (String key : map.keySet()) {\n    System.out.println(\"\
  Key: \" + key + \", Value: \" + map.get(key));\n}\n```\n\n\n\n\n\n## 使用值\n可以通过 `values()`\
  \ 方法实现对 map 中包含的值迭代。该方法提供了一个包含 map 中所有值的 `Collection<V>`。然而，该方法具有局限性，因为它不提供对键的访问。\n\
  \n```java\nMap<String, Integer> map = new HashMap<>();\nmap.put(\"One\", 1);\nmap.put(\"\
  Two\", 2);\nmap.put(\"Three\", 3);\nfor (Integer value : map.values()) {\n    System.out.println(\"\
  Value: \" + value);\n}\n```\n\n## 使用 Java 8 的 forEach\nJava 8 引入了 `forEach` 方法，允许使用\
  \ lambda 表达式进行更加函数式的编程。\n\n```java\nMap<String, Integer> map = new HashMap<>();\n\
  map.put(\"One\", 1);\nmap.put(\"Two\", 2);\nmap.put(\"Three\", 3);\nmap.forEach((key,\
  \ value) -> System.out.println(\"Key: \" + key + \", Value: \" + value));\n```\n\
  \n## 使用 Stream API\nJava 8 中的 Stream API 也可以用于迭代 map 以执行各种任务，包括过滤（filtering）、映射（mapping）和规约（reducing）。\n\
  \n```java\nMap<String, Integer> map = new HashMap<>();\nmap.put(\"One\", 1);\nmap.put(\"\
  Two\", 2);\nmap.put(\"Three\", 3);\nmap.entrySet().stream()\n    .forEach(entry\
  \ -> System.out.println(\"Key: \" + entry.getKey() + \", Value: \" + entry.getValue()));\n\
  ```\n\n## 并发迭代\n在处理并发 map（如 `ConcurrentHashMap`）时，可以在没有外部同步的情况下安全地执行迭代。ConcurrentHashMap\
  \ 的 `keySet`、`entrySet` 和 `values` 视图返回的迭代器设计用于处理并发修改。\n\n```java\nimport java.util.concurrent.ConcurrentHashMap;\n\
  import java.util.Map;\nConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();\n\
  map.put(\"One\", 1);\nmap.put(\"Two\", 2);\nmap.put(\"Three\", 3);\nfor (Map.Entry<String,\
  \ Integer> entry : map.entrySet()) {\n    System.out.println(\"Key: \" + entry.getKey()\
  \ + \", Value: \" + entry.getValue());\n}\n```\n\n## 在迭代期间删除项\n在迭代过程中修改 map 时必须小心。使用\
  \ `iterator` 可以安全地删除条目；例如通过使用 `iterator.remove()` 方法。\n\n```java\nMap<String, Integer>\
  \ map = new HashMap<>();\nmap.put(\"One\", 1);\nmap.put(\"Two\", 2);\nmap.put(\"\
  Three\", 3);\nIterator<Map.Entry<String, Integer>> iterator = map.entrySet().iterator();\n\
  while (iterator.hasNext()) {\n    Map.Entry<String, Integer> entry = iterator.next();\n\
  \    if (entry.getValue() == 2) {\n        iterator.remove();\n    }\n}\n```\n\n\
  `ConcurrentHashMap` 允许并发修改（包括删除），而不会抛出 `ConcurrentModificationException`。\n\n通过采用这些技术，开发者可以高效地遍历和操作\
  \ map，并选择最适合其上下文需求的方法。所选择的方法通常取决于所执行操作的具体需求以及所用 map 实现的特性。\n\n### 5.12 自定义 Map 实现\n\
  扩展 Java `Map` 接口的基本功能以适应特定需求涉及创建自定义的 map 实现。虽然标准库 map（如 `HashMap`、`LinkedHashMap`\
  \ 和 `TreeMap`）涵盖了大部分需求，但在某些场景下需要对键值对进行独特的处理。创建自定义 map 可能涉及对现有 map 的简单扩展，也可能对 `Map`\
  \ 接口进行从零实现。\n\n在以下情况下通常优选自定义 map：\n* 对于不寻的键访问模式需要特定的性能特性。\n* 需要自定义的键比较逻辑。\n* 需要增强\
  \ map 行为，例如在插入或删除时触发事件的操作。\n\n为了说明这一过程，我们将创建一个记录每个键值对插入操作的自定义 map。这个 map `LoggingHashMap`\
  \ 是 `HashMap` 的扩展，展示了直接的继承和方法重写。\n\n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\
  public class LoggingHashMap<K, V> extends HashMap<K, V> {\n    @Override\n    public\
  \ V put(K key, V value) {\n        System.out.println(\"key: \" + key + \", value:\
  \ \" + value);\n        return super.put(key, value);\n    }\n}\n```\n\n在 `LoggingHashMap`\
  \ 中，我们重写了 `put` 方法来插入键值对并记录操作。对 `super.put(key, value)` 的调用确保了插入操作遵循 `HashMap` 的标准行为。扩展现有\
  \ map 时，理解基类的行为至关重要。调用 `super` 方法可以确保在添加额外行为的同时维护 map 的完整性。\n\n### 从零实现\n从头实现自定义\
  \ map 需要遵循 `Map` 接口。新类必须实现的基本方法有：\n* `put(K key, V value)`：插入键值对。\n* `get(Object\
  \ key)`：返回与键关联的值。\n* `remove(Object key)`：移除该键的映射关系。\n* `size()`：返回 map 中键值对的数量。\n\
  * `clear()`：移除所有映射。\n* `containsKey(Object key)`：判断 map 是否包含该键的映射。\n* `containsValue(Object\
  \ value)`：判断 map 是否包含映射到指定值的一个或多个键。\n\n我们将创建一个使用内部列表存储条目的最小化自定义 map 示例。该实现仅用于教学目的，对于大数据集无法提供最优性能。\n\
  \n```java\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Map;\n\
  import java.util.Set;\nclass SimpleListMap<K, V> implements Map<K, V> {\n    private\
  \ List<Entry<K, V>> entries = new ArrayList<>();\n    @Override\n    public V put(K\
  \ key, V value) {\n        for (Entry<K, V> entry : entries) {\n            if (entry.getKey().equals(key))\
  \ {\n                V oldValue = entry.getValue();\n                entry.setValue(value);\n\
  \                return oldValue;\n            }\n        }\n        entries.add(new\
  \ SimpleEntry<>(key, value));\n        return null;\n    }\n    @Override\n    public\
  \ V get(Object key) {\n        for (Entry<K, V> entry : entries) {\n           \
  \ if (entry.getKey().equals(key)) {\n                return entry.getValue();\n\
  \            }\n        }\n        return null;\n    }\n    @Override\n    public\
  \ V remove(Object key) {\n        for (Entry<K, V> entry : entries) {\n        \
  \    if (entry.getKey().equals(key)) {\n                V value = entry.getValue();\n\
  \                entries.remove(entry);\n                return value;\n       \
  \     }\n        }\n        return null;\n    }\n    @Override\n    public int size()\
  \ {\n        return entries.size();\n    }\n    @Override\n    public void clear()\
  \ {\n        entries.clear();\n    }\n    @Override\n    public boolean containsKey(Object\
  \ key) {\n        for (Entry<K, V> entry : entries) {\n            if (entry.getKey().equals(key))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n    @Override\n    public boolean containsValue(Object value) {\n      \
  \  for (Entry<K, V> entry : entries) {\n            if (entry.getValue().equals(value))\
  \ {\n                return true;\n            }\n        }\n        return false;\n\
  \    }\n    @Override\n    public Set<Entry<K, V>> entrySet() {\n        // 方法实现省略以保持简洁\n\
  \        return null;\n    }\n    // Map 接口的其他其他要求的方法将在此实现\n}\n```\n\n\n\n\n从零开始实现一个\
  \ map（映射）时，有几个考虑因素至关重要，包括在需要并发访问时确保线程安全、通过适当的数据结构对性能进行优化，以及遵守 `Map` 接口文档定义的契约。\n\
  \n自定义 map 实现可以显著增强标准 map 提供的功能，允许对它们的行为进行精确控制。通过理解底层原理并仔细规划实现，可以为特殊用例定制 map 行为。\n\
  \n# 第 6 章 队列与双端队列：处理有序集合\n\n本章探讨了 Java 集合框架中用于处理有序集合的队列（Queue）和双端队列（Deque）。解释了 `Queue`\
  \ 和 `Deque` 接口的基本操作，并探索了各种实现，例如 `PriorityQueue`、`ArrayBlockingQueue`、`LinkedBlockingQueue`、`PriorityBlockingQueue`、`ArrayDeque`、作为双端队列的\
  \ `LinkedList` 以及 `ConcurrentLinkedDeque`。本章还涵盖了这些数据结构的常见操作、性能考虑和现实应用场景，为 Java 编程中的应用提供全面的理解。\n\
  \n## 6.1 队列与双端队列简介\n\n队列和双端队列是 Java 集合框架中的核心组件，有助于有序集合的管理和操作。理解这些结构背后的基本概念，为利用其强大功能并优化它们在\
  \ Java 编程应用中的用法提供了基础。\n\n`Queue`（队列）是一种用于在处理前持有元素的集合。队列中的元素通常按照先进先出（FIFO）的方式排序。这意味着先添加的元素将是被移除的元素。`Queue`\
  \ 接口扩展了 `Collection` 接口，包含了若干适用于队列典型操作的方法，如插入、提取和检查元素。\n\n`Deque`（读作 \"deck\"，代表\
  \ Double-Ended Queue 双端队列）通过允许从两端添加或移除元素来扩展了队列的功能。因此，双端队列既可以作为 FIFO 队列工作，也可以作为后进先出（LIFO）栈，在元素处理和操纵方面提供了更大的灵活性。`Deque`\
  \ 接口扩展了 `Queue` 接口，并包含了一更广泛的方法来支持这种双向操作。\n\n以下概述了队列和双端队列的核心操作和特征：\n\n*   **入队操作（Enqueue\
  \ Operation）**：向队列添加元素。这通常在队列的末尾（尾）完成。在双端队列的上下文中，此操作也可以在前端（头）发生。\n*   **出队操作（Dequeue\
  \ Operation）**：从队列中移除元素。这通常是队列前端（头）的元素。对于双端队列，元素可以从头和尾被移除。\n*   **查看操作（Peek Operation）**：检索但不移除队列前端（头）的元素。双端队列支持对两端进行查看操作。\n\
  *   **元素排序（Element Ordering）**：队列通常遵循 FIFO 排序，而双端队列则同时支持 FIFO 和 LIFO 排序。\n\nJava\
  \ 集合框架提供了 `Queue` 和 `Deque` 接口的多种实现，每种都对应不同的场景和性能需求。以下是一些常见的实现：\n\n*   `PriorityQueue`：该类实现了优先级队列，根据元素的自然顺序或自定义的比较器对元素进行排序。它不允许包含空元素。\n\
  *   `ArrayBlockingQueue`：一种基于数组的健壮实现，其容量在创建队列时即固定。它支持线程安全的操作。\n*   `LinkedBlockingQueue`：提供一个由链式节点支持的潜在无限容量队列（受\
  \ `Integer.MAX_VALUE` 限制），提供线程安全的操作。\n*   `ArrayDeque`：实现了一个可调整大小的数组双端队列，提供了 FIFO\
  \ 和 LIFO 操作但不保证线程安全。\n*   `LinkedList`：实现双向链表，可以同时作为队列和双端队列。它提供了 `Deque` 和 `List`\
  \ 接口的所有方法。\n*   `ConcurrentLinkedDeque`：提供由链节点实现支持的线程安全的双端队列，支持高性能并发访问。\n\n通过理解这些基本概念并识别不同的实现，开发者可以更有效地设计和优化他们的\
  \ Java 程序，选择最符合特定需求和性能要求的数据结构。\n\n在随后的章节中，我们将深入探讨这些接口的操作和特殊之处，详细探索它们各自的类，以精练掌握 Java\
  \ 中的队列和双端队列主题。\n\n### 6.2 Queue 接口：基本操作\n\nJava 集合框架中的 `Queue` 接口定义了一个用于在处理前持有元素的集合。队列通常（但并不一定）按照\
  \ FIFO（先进先出）的方式对元素排序。然而，存在例外，例如 `PriorityQueue`，它根据元素的自然顺序或指定的比较器对元素排序。\n\n```\n\
  public interface Queue<E> extends Collection<E> { \n    boolean add(E e);\n    boolean\
  \ offer(E e);\n    E remove();\n    E poll();\n    E element();\n    E peek();\n\
  }\n```\n\n`Queue` 接口的基本操作包括：\n\n*   `add(E e)`：如果可以在不违反容量限制的情况下立即执行，则将指定的元素插入此队列中。\n\
  *   `offer(E e)`：如果可以在不违反容量限制的情况下立即执行，则将指定的元素插入此队列中。在使用受容量限制的队列时，此方法通常优于 `add` 方法。\n\
  *   `remove()`：检索并移除此队列的头。\n*   `poll()`：检索并移除此队列的头，如果此队列为空则返回 `null`。\n*   `element()`：检索但不移除此队列的头。\n\
  *   `peek()`：检索但不移除此队列的头，如果此队列为空则返回 `null`。\n\n让我们详细探索这些操作。\n\n`add(E e)` 和 `offer(E\
  \ e)`：`add` 是 `Collection` 接口中熟悉方法，而 `offer` 专门设计用于受容量限制的队列。如果超过容量，`add` 方法将抛出 `IllegalStateException`，而\
  \ `offer` 返回 `false`。\n\n```\nQueue<String> queue = new LinkedList<>();\nqueue.add(\"\
  Element1\"); // 溢时抛出 IllegalStateException\nboolean wasAdded = queue.offer(\"Element2\"\
  ); // 溢时返回 false\n```\n\n`remove()` 和 `poll()`：这两个方法都会检索并移除队列头。如果队列为空，`remove` 方法将抛出\
  \ `NoSuchElementException`，而 `poll` 方法返回 `null`。\n\n```\nQueue<String> queue = new\
  \ LinkedList<>();\nqueue.add(\"Element1\");\nString head = queue.remove(); // 空时抛出\
  \ NoSuchElementException\nString headOrNull = queue.poll(); // 空时返回 null\n```\n\n\
  `element()` 和 `peek()`：`element` 方法检索但不移除队列头。与 `remove` 一，如果队列为空会抛出 `NoSuchElementException`。相反，`peek`\
  \ 检索头，如果队列为空则返回 `null`。\n\n```\nQueue<String> queue = new LinkedList<>();\nqueue.add(\"\
  Element1\");\nString head = queue.element(); // 空时抛出 NoSuchElementException\nString\
  \ headOrNull = queue.peek(); // 空时返回 null\n```\n\n为了理解队列及其接口操作的行为，请考虑以下示例：\n\n```\n\
  Queue<Integer> queue = new LinkedList<>();\n// 向队列添加元素\nqueue.offer(10);\nqueue.offer(20);\n\
  queue.offer(30);\n// 查看头元素\nSystem.out.println(\"Head element: \" + queue.peek());\
  \ // 输出: Head element: 10\n```\n\n\n\n\n```java\n// 从队列中移除元素\nSystem.out.println(\"\
  Removed element: \" + queue.poll()); // 输出: Removed element: 10 \nSystem.out.println(\"\
  Removed element: \" + queue.poll()); // 输出: Removed element: 20 \n\n// 队列的最终状态\n\
  System.out.println(\"Queue after removals: \" + queue); // 输出: Queue after removals:\
  \ [30]\n```\n\n该示例演示了如何使用 `offer`、`peek` 和 `poll` 方法来管理队列操作，并理解以先进先出（FIFO）方式处理元素的序列顺序。\n\
  \n对这些基础操作的认知和合理利用，为实现依赖队列的复杂数据结构和算法奠定了坚实的基础。理解抛异常的方法与返回特殊值的方法之间的细微差别，允许开发者编写更健壮、可预测的代码。\n\
  \n## 6.3 PriorityQueue: 自然排序队列\n\nJava 中的 `PriorityQueue` 类是 `Queue` 接口的一个具体实现，设计用于根据元素的自然顺序或指定的\
  \ `comparator` 来处理元素。本节将深入探讨 `PriorityQueue` 的结构、操作和实际应用。\n\n要实例化一个 `PriorityQueue`，可以使用以下语法：\n\
  \n```java\n// 创建一个自然排序的 PriorityQueue\nPriorityQueue<Integer> pq = new PriorityQueue<>();\
  \ \n\n// 创建一个带有自定义 Comparator 的 PriorityQueue\nComparator<String> stringLengthComparator\
  \ = Comparator.comparingInt(String::length); \nPriorityQueue<String> pqWithComparator\
  \ = new PriorityQueue<>(stringLengthComparator);\n```\n\n`PriorityQueue` 依赖于堆数据结构（通常是二叉堆），这使其能够高效地支持优先级排序的操作。如果没有提供比较器，`PriorityQueue`\
  \ 中的元素将根据其自然顺序（即 `Comparable` 中的 `compareTo` 方法）进行排序。否则，元素将根据所提供的 `comparator` 进行排序。\n\
  \n### PriorityQueue 上的操作\n\n与 `PriorityQueue` 常见的操作包括添加、移除和检查元素。以下是重要操作及其影响的描述：\n\
  \n1. `add(E e)`：将指定的元素插入此优先级队列。如果指定的元素无法与队列中当前的元素进行比较，则抛出 `ClassCastException`。\n\
  2. `offer(E e)`：将指定的元素插入此优先级队列，如果成功则返回 `true`，如果队列已满则返回 `false`。\n3. `peek()`：获取但不移除此队列的头部元素，如果队列为空，则返回\
  \ `null`。\n4. `poll()`：获取并移除此队列的头部元素，如果队列为空，则返回 `null`。\n5. `remove()`：获取并移除此队列的头部元素。如果队列为空，则抛出\
  \ `NoSuchElementException`。\n\n以下代码演示了 `PriorityQueue` 的基本操作：\n\n```java\nPriorityQueue<Integer>\
  \ pq = new PriorityQueue<>(); \npq.add(10); \npq.offer(20); \npq.add(15); \n\n//\
  \ 检查队列头部\nSystem.out.println(\"Head of the queue: \" + pq.peek()); \n\n// 移除元素\n\
  System.out.println(\"Removed: \" + pq.poll()); // 10 \nSystem.out.println(\"Removed:\
  \ \" + pq.poll()); // 15 \n\n// 添加另一个元素\npq.add(5); \nSystem.out.println(\"Head\
  \ of the queue: \" + pq.peek()); // 5\n```\n\n```\nHead of the queue: 10 \nRemoved:\
  \ 10 \nRemoved: 15 \nHead of the queue: 5\n```\n\n### 内部结构与性能\n\n`PriorityQueue`\
  \ 内部使用最小堆实现，其中最小元素存储在堆的根部。这确保了获取最小元素（通过 `peek()` 或 `poll()`）在时间上是高效的，在逻辑上也是简单的。从\
  \ `PriorityQueue` 中添加和移除元素的操作复杂度为 `O(log(n))`，其中 `n` 是队列中的元素数量。\n\n以下是元素在 `PriorityQueue`\
  \ 内部组织的示例：\n- 假设 `PriorityQueue` 持有元素：`[20, 15, 10, 30, 50]`。内部，二叉堆确保最小元素 (10)始终位于根部，使其可以在常数\
  \ `O(1)` 内访问。\n\n### Comparator 示例\n\n使用 `Comparator` 允许对元素进行自定义排序。当需要根据自然顺序以外的标准来优先考虑元素时，这特别有用。考虑按长度对字符串进行优先级的自定义比较器：\n\
  \n```java\nComparator<String> stringLengthComparator = Comparator.comparingInt(String::length);\
  \ \nPriorityQueue<String> pqWithComparator = new PriorityQueue<>(stringLengthComparator);\n\
  pqWithComparator.add(\"apple\"); \npqWithComparator.add(\"banana\"); \npqWithComparator.add(\"\
  cherry\"); \nSystem.out.println(\"Head of the queue: \" + pqWithComparator.peek());\n\
  ```\n\n### 潜在用例\n\nPriorityQueue 应用于需要优先级的应用程序：\n- **任务调度**：管理任务执行。\n- **Dijkstra\
  \ 算法**：用于在图中寻找最短路径。\n- **事件模拟**：按时间处理事件。\n\n理解并利用 PriorityQueue 允许开发者管理复杂的数据结构。\n\
  \n## 6.4 BlockingQueue: 线程队列\n\n`BlockingQueue` 接口扩展了 `Queue` 接口，支持在检索元素时等待队列变为非空，在存储时等待空间。它是\
