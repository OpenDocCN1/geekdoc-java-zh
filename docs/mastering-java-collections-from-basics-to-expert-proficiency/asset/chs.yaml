  \n- `put(E e)`：将元素插入此队列，必要时会等待。\n- `take()`：获取并移除此队列的头部元素，必要时会等待。\n- `offer(E e,\
  \ long timeout, TimeUnit unit)`：将元素插入此队列，必要时等待指定的时间。\n- `poll(long timeout, TimeUnit\
  \ unit)`：获取并移除此队列的头部元素，必要时等待指定的时间。\n- `remainingCapacity()`：返回在阻塞之前可接受的额外元素数量。\n\
