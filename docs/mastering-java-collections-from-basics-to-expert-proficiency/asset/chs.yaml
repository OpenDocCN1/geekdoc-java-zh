  `LinkedBlockingQueue` 是一个基于链节点节点的可选有界队列。它可以使用定义的容量创建，也可以不指定界限，在这种情况下，它仅受可用内存的限制。与\
  \ `ArrayBlockingQueue` 相比，这种实现在竞争较小时提供了更高的吞吐量：\n\n```java\nimport java.util.concurrent.BlockingQueue;\
