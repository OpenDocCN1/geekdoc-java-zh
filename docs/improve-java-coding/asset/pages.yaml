  md: 'The reason that Java doesn''t allow multiple inheritance is because of the
    ambiguity it causes. One of the common problems that occurs in numerous inheritance
    is the diamond problem.


    # The Diamond Problem


    In the following diagram, Class A extends Class B and Class C. Both mentioned
    classes extend Class D. Suppose a method in Class D that both classes B and C
    override in their way. Suppose Class A overrides the same method. Which method
    should class A override the method in class B or class C? That is the main reason
    that Java doesn''t support multiple inheritance.'
