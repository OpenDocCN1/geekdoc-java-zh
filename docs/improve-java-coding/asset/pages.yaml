  md: '# 2. User Input in Java


    The concept of input and output is well known in programming. The input is the
    data unknown by the program, while the output is the result of the program''s
    conclusion based on the input.


    Suppose a website allows subscribers to register based on their ages and annual
    income. A program can only decide whether a user is accepted or rejected if the
    program receives the user''s data.


    Once the user enters the required information, the program processes the information
    and makes a decision based on that. The information that the user enters is known
    as input, while the conclusion that the program comes with is called the program''s
    output.


    In this book, two Java input classes are covered, namely, the classes Scanner
    and BufferedReader.


    # Java Scanner Input Types


    The scanner is a class in the Java util package used for acquiring the input of
    primitive data types like int, boolean, double, and objects like strings. Using
    the Scanner class in Java allows reading a user input in a Java program.


    Scanner class allows a programmer to take the standard input stream in Java. Several
    methods are offered to extract data from the stream.


    > Notice'
