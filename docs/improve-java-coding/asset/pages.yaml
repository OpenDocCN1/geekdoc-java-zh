  md: '# # 4. Arrays and Java Collections


    # ## Arrays


    An array is a collection of elements of the same type. The number of the elements
    of arrays is fixed, and each element has a position in the array. The position
    of the elements is indicated by an integer value called index, which starts from
    0. The number of elements that can fit in an array is called length. An array
    in Java is not a primitive data type but an object.


    You can define an array as follows:


    +   1. Declare a name for the array.

    2. You can create an array object as usual with the keyword new.

    3. Specify the data type of the array.

    4. Specify the length of the array.

    5. Add elements to the array.


    See the following example:


    Here, below, we define an array of integer-type data. The size of the array is
