    An exception is an abnormal condition that might occur during the execution of
    a program.

    The exception objects in Java contain information about the errors. There are
    two types of Exceptions: **checked** and unchecked Exceptions.


    The keywords handle exceptions: **try, catch, throw, throws,** and finally.


    Exceptions might be caused by several reasons, for example:


    +   - Entering letters in a field that is designed for calculating numbers.

    - Trying to access the seventh element of an array of five elements

    - Trying to access a file that doesn''t exist.


    All exceptions in Java are derived from the class Throwable. The following methods
    of the class Throwable are used to get information about the cause of the errors.


    Diagram 1 shows the Exception class hierarchy in Java.


    For further information about the class Throwable, see the online documentation
