  md: '# 6. Packages and Access Modifiers


    The main reasons for using packages are:


    +   - Using a class name more than once in one package is not allowed, but using
    the same class name is possible if they exist in different packages.

    - Package and access modifiers allow more control and visibility by accessing
    other parts of the program.

    - A package allows to categorize the classes that are logically related. For example,
    if you have different classes to manipulate images, you can put them in one package
    and reuse that package in other applications.


    # Organize Your Code


    Usually, a statement is at the top of a Java class, such as a "package. application".

    Java classes must be saved in a file with a ".java" extension. Packages are essentially
    directories, and they are separated from subdirectories with a dot ".". The "import"
    statement is required to access classes in different packages.


    ```

    import java.util.List;

    ```


    # Access Modifiers


    Java supports the accessibility of the classes and class members with the following
    keywords. All group members are accessible from classes in which they exist, regardless
    of their keywords.'
