    # Constructors


    A constructor is a particular method with the same name as the class in which
    it exists. Constructors don''t return values; unlike methods, you can use a constructor
    to instantiate objects and initialize their instance variables. Sometimes, creating
    more than one constructor in a class is practical. That will be covered later
    in this chapter.


    # Constructors With Arguments


    It is essential to understand that the default (no-argument) constructor can only
    be called if the class has no constructor. You can no longer invoke the default
    constructor when you define a constructor with one or more arguments. You can
    use a constructor with parameters to assign values to the instance variables.
    In the following class, Movie, three constructors are defined: the first one is
    a no-argument constructor, the second one is a constructor with two, and the third
    one is a constructor with three arguments. Therefore, you can no longer call the
    default constructor to instantiate objects if you remove the no-argument one in
    the following example.


    # Why Use Multiple Constructors?


    Using multiple constructors is very practical because we often need to display
    only some of the object''s attributes and ignore the rest. Suppose that users
    search for only the title of a movie and its price. Why bother with all the attributes
    of the objects when they are unnecessary at that moment?'
