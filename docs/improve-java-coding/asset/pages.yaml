    # Static Methods


    There are different types of methods with similarities between them. If a method
    depends on objects, you must instantiate an object from the class in which it
    exists. However, some methods are independent of objects and could be invoked
    using the class name directly. Those methods are known as static methods and should
    be declared as static. Examples of such methods are finding an average of numbers
    and calculating the sum of two or more numbers.


    You can call static members with the class name, which applies to the static methods.
    You can call static methods with the name of the class as well as the name of
    the objects.


    There are some essential rules which apply to static methods.'
