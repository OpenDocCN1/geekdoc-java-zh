  md: "# The Keywords Throw and Throws\n\nA Java code can throw an exception with\
    \ the keywords throw and throws. You can catch these exceptions with a catch block.\
    \ The keyword throws is used in the header of the methods, but the keyword throw\
    \ is used in the body of the methods.\n\nIn the following program, a new object,\
    \ IllegalArgumentException(\"Division by zero\"), is thrown if the denominator\
    \ is 0.\n\n# Example 2E: Division by Zero Throws, Throw\n\n```\nCalculator.java\n\
    ```java\npublic class Calculator\n{\n    public static double divide(double x,\
    \ double n) throws IllegalArgumentException\n    {\n        if(n == 0)\n     \
    \   {\n            throw new IllegalArgumentException(\"Division by zero\");\n\
    \        }\n        return x / n;\n    }\n    public static void main(String[]\
    \ args)\n{\\}\n```\n```"
