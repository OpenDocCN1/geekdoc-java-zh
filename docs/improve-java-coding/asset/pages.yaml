  md: '# 14. Writing clean code


    Programs obediently follow a programmer''s commands, lacking the ability to determine
    whether they are written correctly or incorrectly. Once they successfully pass
    through the compiler''s requirements, the code functions. However, mere functionality
    does not naturally mean professionalism or lack thereof. Professionals commonly
    evaluate code based on specific criteria.


    When writing code, it''s crucial to consider that software projects evolve endlessly
    over time. They often reuse the same logical structures and methods to process
    input and generate output.


    Failure to attach to some particular principles that I explain in this chapter
    indicates to experts that your code may lack a professional touch. This, in turn,
    could open the door to issues such as bugs, memory leaks, hacks, maintainability
    problems, a lack of reusability, and security vulnerabilities.


    # Modularization


    The process of breaking software into smaller manageable components is known as
    modularization. The advantage of this process is improving maintainability, reusability,
    and debugging issues faster and more efficiently. Another advantage of modularization
    is the ability of a team of programmers to work simultaneously to update the program
    without conflicts.


    # Appropriate Data Types and Names


    By choosing the names of objects and attributes, use the camel case. The rule
    of the camel case is by multiple words; the first word begins in lowercase, but
    the other words are in uppercase; examples are age, itemValue, and myShoppingCart.'
