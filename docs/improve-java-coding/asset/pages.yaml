  md: '# # 13. Java Memory Management


    # ## Stack and heap memory


    The memory in Java is divided into two types: the stack and the heap.


    The stack memory is used for local primitive variables such as int double and
    object references. On the other hand, objects such as String and others created
    by programmers are stored on the heap.


    # ## The Life Cycle of Objects


    The lifetime of an object In Java starts from the moment the object is created
    to the moment it is destroyed. The life cycle of objects concerns their creation
    and their existence in the memory until they are finally destroyed. Understanding
    this process helps developers to create objects at the right moment and understand
    the life process of the objects in the memory.


    Here below are the steps of the life cycle of objects.


    +   1. The process starts with saving the bytecode in a class file with the name
    of the class and the extension ".class."

    2. In the next step, the class is loaded into the memory.

    3. The following step looks for the initialized static members: fields, methods,
    or blocks. Remember that static members belong to the class, and only one copy
    of them is shared by all the class objects.

    4. A class is initialized when an object is created from it, or a static class
    member is accessed.'
