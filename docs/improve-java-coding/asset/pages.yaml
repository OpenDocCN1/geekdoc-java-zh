    \ void.\n\nThe attribute's name, age, and salary values are not initialized in\
    \ the following example. Therefore, the values are the standard in Java, respectively\
    \ null, 0, and 0.0.\n\nOnce you call the method setData(), all the variables(attributes)\
    \ are set to the data assigned in the method.\n\n# Example 1: Void Method\n\n\
    ```\nPerson.java\npublic class Person {\n    String name;\n    int age;\n    double\
