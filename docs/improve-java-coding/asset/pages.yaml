  md: '# 10. Abstract Classes, Interfaces & Enum


    An abstract class is a class in which one or more methods are abstract. All abstract
    classes and methods are marked with the "abstract" keyword. An abstract method
    has no body and is not defined, only declared. In the following example, the method
    "getArea" is abstract; therefore, it has no body:


    ```

    protected abstract double getArea();

    ```


    An abstract class cannot be instantiated because it is incomplete. A subclass
    of an abstract class must override all its abstract methods; otherwise, it cannot
    be instantiated either.


    # Abstract Classes and Methods


    Several concepts are essential for understanding abstract classes and methods:


    +   - Abstract classes cannot be instantiated because they are incomplete.

    - The primary purpose of abstract classes is to use them as superclasses and override
    their methods.

    - When a class contains one or more abstract methods, it should be declared abstract.

    - An abstract method does not have a body.

    - A class can be declared abstract even if it does not contain abstract methods.'
