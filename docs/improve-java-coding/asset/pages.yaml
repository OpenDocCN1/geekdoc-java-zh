    common data of the students and professors, we need to add extra statements to
    both classes. To avoid this redundancy in the methods, we override the method
    printData in the subclasses Student and Professor. To apply that, we need to add
    the method printData to the superclass Person and print its attributes inside
    that method. Then, we can override method in the subclasses using the statement
    super(name, email);


    # Example 3: Overriding Methods


