  md: '# Upcasting


    According to the rules of casting, you can always put an object into a more general
    type. So, you can implicitly cast up the hierarchy.


    A subclass is always a superclass, while a subclass is not always a subclass.


    A student is always a person, while a person is not always a student.


    The statement in the following example is valid because Sub extends Super. The
    Sub object created by the new Sub() must also be a Super object.


    ```

    Super mySuper = new Sub();

    --

    ```


    > Notice

    By upcasting, the variable depends on the type of the object reference mySuper,
    while the method depends on the type of the created object.

    --


    > Notice

    A simple way to think about it is that a subclass does have access to all the
    members of the superclass, while a superclass doesn''t necessarily access the
    details of the subclass.'
