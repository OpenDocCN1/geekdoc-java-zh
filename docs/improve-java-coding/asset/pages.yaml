  md: '# Notice


    Copying and pasting code in software is not a good practice.

    The above code is not flexible for reusability, and the method cannot be overridden.
    Therefore, it lacks reusability and maintainability.


    # Explanation


    The program requires the programmer to apply the same style to display all the
    object''s data. In the previous example, there is one object, but you must remember
    that the program grows over time and will contain tens or even hundreds of objects.

    This code is implemented poorly for the following reasons:


    +   - By applying the previous display, the programmer needs to manually implement
    the display style to other objects, which consumes a lot of time.

    - Furthermore, the code is only suitable for copying and pasting and changing
    the name of the attributes, values, and number of dots based on the length of
    the attributes. The programmer must count each dot to get the object data to look
    as required.

    - Suppose the client requires an update of the style; for example, change all
    the dots to asterisk or another symbol. For that minor update, a programmer should
    open all the implementations of the code everywhere to make those simple changes.

    - Suppose a programmer makes some mistakes and uses more numbers of dots than
    the objects require. Over time, the implementation of the style changes.'
