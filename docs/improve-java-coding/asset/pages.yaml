  md: '· Can you override the method if the vehicle, for example, becomes a superclass
    of other subclass objects that implement that method? I will expand the code later
    in this chapter by using a subclass to answer this question.


    · All the classes in this program have their copy of the display method. By changing
    any parts of this implementation, programmers should open the entire class and
    make the changes everywhere manually.


    # Example 2B: Reusable Methods


    The client wants to expand the program and add the data of their cars and trucks.
    The principle of IS-A is already explained in the inheritance chapter.


    By applying the principle of IS-A, the programmer knows that cars inherit from
    vehicles because a car is a vehicle. So, he applies the inheritance principle
    to reuse the code as follows.


    The car class inherits the attributes of brand, color, and fuel from the class
    vehicle and keeps its own attribute number of passengers.


    The truck class inherits the attributes of brand, color, and fuel from the class
    vehicle and keeps its own attribute, the loading weight.


