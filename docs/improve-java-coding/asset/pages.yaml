  md: '# Iteration (Loop) Statements


    Iteration or loop statements are used to handle processes that are repeated more
    than once. There are three types of loops in Java, namely, for, while, and do
    while.


    A loop consists of two parts:


    +   1. A control part: the repetitions are determined in the control part.

    2. A body: the body contains the statements that have to be repeated.


    # For Loop


    The for-loop is used very frequently in Java. The for-loop is a good choice if
    you know how often a loop must be repeated.


    # While Loop


    The while loop begins with an evaluation of a condition. If the condition returns
    true, the body will be executed. The execution of the loop’s body is repeated
    as long as the condition returns true. If the condition returns false, the loop
    will be terminated.


    # Do-While Loop


    The body of the do-while loop is executed at least once because the condition
    is evaluated after executing the body. The execution of the loop is continued
    until the condition returns false. When the condition is false, the loop is terminated.'
