  md: '# 7. Encapsulation


    Encapsulation is one of the pillars of object-oriented programming. Applying encapsulation
    offers more control of the data and attributes of the classes by hiding their
    access directly. The data is hidden from other classes to prevent unintentional
    mistakes. Encapsulation offers to restrict the direct access to data and controls
    the visibility of it.


    As mentioned earlier in this book, the concept of Object Oriented Programming
    (OOP) is that objects interact and communicate. The question is how an attribute
    could be helpful while not accessible in other classes.


    The answer is to make it read-only, write-only, or modified based on a specific
    rule.


    An example is the code that restricts access to a balance of code to customers.


    +   * By using the access modifier "private" for the balance, you forbid changing
    the balance without giving any details of how the balance is altered. The bank
    should know when and how the customer''s balance is changed.

    * Other classes can change the amount, but only through a public set method, which
    applies specific rules of the change.

    * The following examples show that other classes can access the public read-only
    get-method.


