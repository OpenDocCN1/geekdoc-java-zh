  md: '# # Overloading Methods


    Overloading of methods is the possibility of reusing the same method name in a
    class as often as needed. To overload a method, the method should comply with
    the following requirements:


    +   - The methods can have the same name but with a different number of parameters,
    such as the following method: getNetSalary()

    - double getNetSalary()

    - double getNetSalary(double grossSalary)

    - double getNetSalary(double grossSalary, int taxRate)


    The methods can have the same number of parameters, but their parameters may not
    have the same data types. Below is the method name getNetSalary reused, and that
    is correct because the data types of the parameters are different.


    +   - double getNetSalary(double grossSalary)

    - double getNetSalary(int taxRate)


    The methods can have the same number of parameters and the same data types, provided
    that the order of the parameters variable type is different.


    +   - double getNetSalary(double grossSalary, int taxRate)

    - double getNetSalary(int taxRate, double grossSalary)'
