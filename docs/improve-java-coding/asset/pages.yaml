  md: 'and Professor in the program''s design.


    Suppose the university has an application in which professors and students have
    different access levels. For example, professors can upload teaching materials
    and determine the student''s grades. However, the students can only display and
    download the teaching materials.


    Once a user logs in to the system, we need to review a list of the users to determine
    whether the user exists.


    Creating two arrays for the students and professors is impractical because we
    must search in both lists until we find the user.


    Adding all the students, professors, and other staff members to one list saves
    time and achieves that with less code. The way to do that is to create a Java
    list for Person.


    ```

    List<Person> persons = new ArrayList<Person>();


    Person student = new Student("Boris");

    Person professor = new Professor("David");


    persons.add(student);

    persons.add(professor);

    ```


    Since students and professors are persons, the list accepts adding both of them
    to it. If you make a list for the student-type objects, you cannot add professors,
    as shown below.


    If you don''t define any types of objects for the list, that would open the door
    for unrelated objects to be added to the list.


    ```

    List<Student> persons = new ArrayList<Student>();


    Student student = new Student("Boris");

    Professor professor = new Professor("David");

    ```'
