    # Reusability


    The logic repeated in programming is that a piece of code is often needed in many
    parts and components of the program. Therefore, copying the code in each part
    where it is required increases the risk of making mistakes and spreading the possible
    errors in many places in the entire program. That raises the possibility of bugs
    and makes it hard to find them. Meanwhile, you can write a single logic and reuse
    it repeatedly. Once you find a bug in the logic or want to update it, you can
    fix it and update it in fewer places, and it will be set in all the other components
    that implement it. That will also eliminate the necessity of updating the code
    and working on it everywhere in the program.


    Let''s apply the principles explained here and convert them into pieces of code.'
