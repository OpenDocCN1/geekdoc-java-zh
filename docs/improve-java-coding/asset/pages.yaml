  md: '# #9. Polymorphism


    Polymorphism is one of the essential concepts in object-oriented programming,
    primarily concerning handling an object''s behaviors. Two crucial terms need to
    be grasped to understand polymorphism: overriding and overloading methods.


    # ## Overriding Methods


    Overriding methods is the ability of a subclass to inherit behaviors of the superclass
    or implement a method already written in its superclass. The Inheritance chapter
    presents how the subclasses Student and Teacher override the method print data
    in the superclass.


    Some rules apply to method overriding.


    +   - The overriding method has the same name as the name of the inherited method.

    - The overriding method has the same number and types of parameters as the inherited
    method.

    - The overriding method has the same return or covariant type as the inherited
    method.

    - The overriding method''s access level must maintain the inherited method''s
    visibility in the superclass.

    - If the superclass method is declared public, it is not allowed to declare the
    overriding method private, protected, or default.


    In the following example, the subclass Laptop overrides the method getSpecification
    in the superclass Computer. We can use the following statement by overriding the
    method getSpecification in the subclass.

    super.getSpecicification(); as shown in the code'
