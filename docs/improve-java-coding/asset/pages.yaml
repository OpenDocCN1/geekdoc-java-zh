    \ to remember the exceptions' order. In the following example, the catch-block\
    \ Exception is under the catch-block IndexOfBoundsException because the class\
    \ Exception, in general, is higher than the class IndexOfBoundsException in the\
    \ hierarchy of the exception classes. For the same reason, the catch block of\
    \ IndexOfBoundsException is under the catch block of ArrayIndexOutOfBoundsException.\
    \ See the above diagram.\n\n# ## Example 1: Exception Hierarchy\n\n```\npublic\
    \ class ArrayException {\n    public static void main(String[] args) {\n     \
    \   try {\n            // A code which may cause an exception\n        } catch(ArrayIndexOutOfBoundsException\
    \ ae) {\n            // catch the exception ArrayIndexOutOfBoundsException\n \
    \       } catch(IndexOutOfBoundsException ae) {\n            // catch the exception\
    \ IndexOfBoundsException\n        } catch(Exception e) {\n            // catch\
    \ all other possible exceptions\n        }\n    }\n}\n```"
