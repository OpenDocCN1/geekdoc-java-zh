  md: '# 5. Methods


    Every class in Java has members, namely, variables and methods. Variables or attributes
    determine the object''s state, while methods determine the behavior of the objects.
    You can only create a practical Java class by using methods. In this chapter,
    different types of methods are introduced.


    +   - A method''s name in Java starts with a lowercase letter and ends with open
    and closed parentheses. For example: getNetSalary(), setPrice(), getPrice(). The
    empty parentheses indicate that no values are passed to the method.

    - Each method contains a block of code enclosed by curly braces.

    - Methods allow you to specify what you want to do with objects.

    - To call a method, you use the object''s name followed by the method''s name,
    separated by a dot.


    In the following class Person, we define the method setData(). You can call this
    method by creating an object of the class Person as follows:


    ```

    Person p = new Person();

    p.setData();

    ```


    > ### Notice

    There are two types of methods: methods that return a value and methods that don''t
    return any value.'
