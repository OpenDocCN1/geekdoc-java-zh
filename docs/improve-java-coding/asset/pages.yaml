  md: '# # Conditional Statements


    # ## If... Statements


    The if statement tells the program to execute a particular code block only if
    the condition is true.


    # ## If... Else Statements


    The if statement allows executing a particular code block only if the condition
    is evaluated as true. If the condition returns false, the else block is executed.


    By working with a chain of if statements, the program checks all the conditions
    of the if blocks. When the if block''s condition returns true, the block is executed;
    otherwise, the block is ignored.


    > > Notice

    If the chain of the if conditions ends with an else statement, the else block
    is only executed if the condition of the last block returns false.


    # ## If... Else if Statements


    By working with a chain of if/ else-if statements, the program starts with the
    first if statement. If the condition is evaluated as true, the block associated
    with that statement is executed. The program ignores the remaining part of the
    chain. If the condition returns false, the block is ignored, and the program continues
    with the following else-if statement. As soon as the condition of a particular
    block returns true, the block is executed, and the rest of the program is ignored.'
