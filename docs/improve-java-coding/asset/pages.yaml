  md: "# Answer Exercise 3\n\nDeclaring a list private in Java indicates that the\
    \ list is only accessible within that class. However, a method that returns the\
    \ private list allows other classes to access a reference to the list and potentially\
    \ modify its content.\n\nThis behavior is not a bug in Java but rather a consequence\
    \ of how object references work in the language. By returning a reference to a\
    \ list from a method, access is provided to that list object. Any changes made\
    \ in that reference will change the original object.\n\nIf you want to restrict\
    \ the modification access to the list within the same class, returning a copy\
    \ or an unmodified list will prevent other classes from modifying it.\n\n# Answer\
    \ 1\n\nAdding and removing elements from the list can be prevented by returning\
    \ a copy of the list as follows. Replace the statement \"return laptops;\" with\
