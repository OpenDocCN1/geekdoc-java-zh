  \ sedan\n```\n\n## 8.6 行为 (Behaviors)\n\n我们之前提到构造函数是一种特殊的行为。但什么是行为呢？\n\n我们将 `behavior`（行为）定义为对象方法。（我们将交替“行为”和“对象方法”）。行为定义了对象能够做的事情。例如，我们可能会为\
  \ `Car` 添加行为，允许它通过行驶消耗燃料、切换指示灯、鸣笛等。\n\n行为与我们目前为止看到的方法不同之处在于，它们在方法头中没有写 `static`。`static`\
  \ 方法是 `class methods`（类方法），这些方法直接与类关联，而不是与对象关联。\n\n以下展示了我们如何引用对象方法（行为）与类方法的区别：\n\
  \n```\n// 对象方法 - behavior() 是方法\nClassName object = new ClassName(); // 先实例化对象\n\
  object.behavior() // 使用对象上的点符号语法调用方法\n\n// 类方法 - behavior() 是（静态）方法\nbehavior()\
  \ // 如果你在同一个类中调用（直接调用）则使用这种\nClassName.behavior() // 如果你从不同的类调用则使用这种\n```\n\n目前，我们将关注对象方法。请注意，对象方法只能通过\
  \ `object` 上的点符号语法来访问。Java 初学者程序员经常会直接从静态方法访问对象的行为，而没有使用对应对象的点符号语法。`你不能直接从静态方法调用对象方法。你必须使用对象上的点符号语法来调用对象方法。`\n\
  \n然而，你*可以*从另一个对象方法或构造函数调用对象方法。这是因为当你处于对象方法内部时，你已经在对象内部了，因此通过在当前对象方法中调用另一个对象方法来进一步深入对象的属性是完全没有问题的。\n\
  \n让我们为 `Car` 类添加一些行为。\n\n### `drive()` 方法\n\n我们首先实现一个带有 `double` 类型参数 `miles` 的\
  \ `drive()` 行为。在这个方法中，我们想要模拟一个 `Car` 对象行驶并消耗燃料。\n\n列表 8.14：为 `Car` 添加行为。\n\n```java\n\
