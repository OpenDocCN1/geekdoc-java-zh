  \n二进制计数和十进制计数之间的区别在于，在 2 基中，在在我们所有的数字都是 1 之后，我们会增加另一个位值（1 ![epub/OEBPS/images/texmath/605575864c00abe7d78d98ad65404e3e9c121d1f](img/image00400.jpeg)\
