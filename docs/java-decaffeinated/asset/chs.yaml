  \n## 1.2 编写你的第一个代码](#part0001.xhtml_aid-UGL2)\n\n将类命名为 `Main`。现在，弹出一个代码编辑器并显示以下代码：\n\
  \n```\npublic class Main {\n}\n```\n\n我们需要在类内部包含一个 `main()` 方法。这告诉 Java 要执行哪些代码。在大花括号之间添加以下内容：\n\
  \n```\npublic class Main {\n    public static void main(String[] args) {\n     \
  \   System.out.println(\"Hello world!\");\n    }\n}\n```\n\n这应该输出“Hello world!”。现在，我们必须编译并执行代码。为了做到这一点，点击\
  \ *Run* 菜单栏按钮，然后点击出现的“Run…”选项。之后，点击“Main”表示你想运行来自 `Main` 类的 `main()` 方法。\n\n![images/figures/GETTINGSTARTED_10](img/image00395.jpeg)图\
  \ 1.10：运行你的代码。\n\n几秒钟，窗口底部会弹出一个控制台，显示 `Hello world!`。\n\n![images/figures/GETTINGSTARTED_11](img/image00396.jpeg)图\
  \ 1.11：控制台中的“Hello world!”。\n\n恭喜！你刚刚编写了你的第一个 Java 程序！\n\n让我们来看看我们的代码刚刚做了什么。\n\n\
  列表 1.1：分析我们的代码。\n\n```\n1public class Runner {\n2    public static void main(String[]\
  \ args) {\n3        System.out.println(\"Hello world!\");\n4    }\n5}\n```\n\n在第一行，我们写了类头，这是一个用于声明我们正在创建一个新类的类头。类本质上是对象的蓝图，我们可以通过\
  \ Java 创建并操作这些对象。\n\n在第二行，我们为我们的 `main()` 方法写了方法头。方法头用于标记一个函数或代码块，我们稍后可以多次使用。这个特定的方法\
  \ `main()` 是 Java 在尝试执行代码时查找的内容。我们必须精确地编写 `public static void main`，并带有类型为 `String[]`\
  \ 的参数 `args`，以便 Java 正确运行我们的代码。没有这个方法，Java 不一定会按顺序运行。\n\n在第三行，我们通过使用 `System.out`\
  \ 下的 `println` 打印 `\"Hello world!\"`。`System.out` 是控制台的引用，通过调用 `println`，我们可以将任何数据写入标准输出。\n\
  \n在第四行和第五行，我们分别用花括号关闭了函数和类。\n\n## 1.1 使用分号\n\n我们可以看到，在单个语句之后有一个分号，而在每个体头之后都有多个语句。这告诉我们，对于单个语句，我们用分号结束，而对于包含多个语句的代码块，我们将该代码块放在花括号内。我们将在后续学习中探索这一概念。现在，在每个语句后包含一个分号是重要的。\n\
  \n让我们再添加几个打印语句。在你的第一个打印语句之后，打印你的名字，然后以数字形式打印你的年龄。要打印你的名字，必须将其包含在双引号中。对于你的年龄则不需要这样做，因为它仅仅是一个数字而不是文本。\n\
  \n列表 1.2：打印我们的名字和年龄。\n\n```\n1public class Runner {\n2    public static void main(String[]\
  \ args) {\n3        System.out.println(\"Hello world!\");\n4        System.out.println(\"\
  Your Name\");\n5        System.out.println(25);\n6}\n7\n```\n\n在运行程序之前，不要忘记保存文件。\n\
  \n列表 1.3：列表 1.2 的输出\n\n```\nHello world!\nYour Name\n25\n```\n\n我们可以看到，与第 3 行和第\
  \ 4 行相比，第 5 行没有包含分号。这是因为第 5 行打印的内容与第 3 行和第 4 行完全不同。第 5 行打印的是一个数字，即 `int`。我们可以对数字进行各种操作。\n\
  \n让我们加减一些数字。\n\n列表 1.4：加减数字。\n\n```\n1public class Runner {\n2    public static\
  \ void main(String[] args) {\n3        System.out.println(\"Hello world!\");\n4\
  \        System.out.println(\"Johnny Appleseed\");\n5        System.out.println(30);\n\
  6        System.out.println(\"Let's do math!\");\n7        System.out.println(45\
  \ + 15);\n8        System.out.println(98 - 26);\n9        System.out.println(1002\
  \ + 9384 - 56);\n10   }\n11}\n```\n\n在上面的代码中，我们将 45 加 15。之后，我们从 98 中减去 26，然后从 1002\
  \ 和 9384 的和中减去 56。我们可以看到这里适用于基础数学和运算顺序，并且得到了预期结果。\n\n列表 1.5：列表 1.4 的输出\n\n```\n\
  Hello world!\nJohnny Appleseed\n30\nLet's do math!\n60\n72\n10330\n```\n\n目前，我们知道在各自行打印数据。但如果我们想让数据相邻打印呢？\n\
  \n在这种情况下，我们将使用 `System.out` 的 `print()` 方法，而不是 `println()`。该函数将数据写入标准输出而不移动文本光标到下一行。\n\
  \n我们可以使用 `print()` 方法在控制台上打印一些字母。\n\n列表 1.6：使用 `System.out.print()`\n\n```\n 1public\
  \ class Runner {\n2    public static void main(String[] args) {\n3        System.out.println(\"\
  Hello world!\");\n4        System.out.println(\"Johnny Appleseed\");\n5        System.out.println(30);\n\
  6        System.out.println(\"Let's do math!\");\n7        System.out.println(45\
  \ + 15);\n8        System.out.println(98 - 26);\n9        System.out.println(1002\
  \ + 9384 - 56);\n10        System.out.print(\"A\");\n11        System.out.print(\"\
  B\");\n12        System.out.print(\"C\");\n13        System.out.println(\"soup\"\
  );\n14        System.out.println(\"Done\");\n15   }\n16}\n```\n\n\n\n\n在第 10 到 12\
  \ 行中，我们使用 `print()` 函数将 `\"A\"`、`\"B\"` 和 `\"C\"` 打印到控制台，它们紧紧挨在一起。然后，我们调用 `println()`\
  \ 函数来打印 `\"soup\"`。这会将 `\"soup\"` 打印在 `\"ABC\"` 旁边，然后将文本光标移动到下一行。这样，当打印 `\"Done\"\
  ` 时，它就不会与 `\"ABCsoup\"` 在同一行。\n\n列表 1.7：Listing 1.6 的输出\n\n```\nHello world!\nJohnny\
  \ Appleseed\n30\nLet's do some math!\n60\n72\n10330\nABCsoup\nDone\n```\n\n干得好！你创建了可以打印文本并进行数学运算的有效代码！\n\
  \n## 1.3 注释\n\n有时，在编写代码时，我们希望对算法中特定点正在发生的情况进行简短描述。在其他情况下，我们只是不想运行某些代码，但又不想删除它们，因为我们以后可能对其进行使用或重构。\n\
  \n解决这一问题的方法是使用**注释**。注释允许我们在代码中编写纯文本，而不会被 Java 求值。我们通过编写双反斜杠（`//`）后跟我们的文本来编写单行注释。\n\
  \n列表 1.8：编写单行注释\n\n```\n// I am a comment\n```\n\n如果我们想写跨越多行的注释，则可以将所有纯文本放在 `/*`\
  \ 和 `*/` 之间，就像大括号一样。\n\n列表 1.9：编写多行注释\n\n```\n/*\nI am a comment\nthat can stretch\n\
  across multiple lines\n*/\n```\n\n作为一个使用注释的示例，假设我们是 Java 编程的初学者，并且被给了一段代码。\n\n列表\
  \ 1.10：分析陌生代码\n\n```java\npublic class Runner {\n    public static void main(String[]\
  \ args) {\n        int sum = 0;\n        for(int i = 1; i <= 10; i++) {\n      \
  \      sum += i;\n        }\n        System.out.println(\"The sum of 10 numbers\
  \ is \" + sum);\n    }\n}\n```\n\n我们完全不知道这个程序是要做什么的。然而，如果开发者包含了注释，我们就能对代码将做什么有一个大致的概念。\n\
  \n列表 1.11：在陌生代码中添加注释\n\n```java\npublic class Runner {\n    public static void main(String[]\
  \ args) {\n        // Creating a sum variable\n        int sum = 0;\n\n        //\
  \ Adding every number from 1 to 10 to sum\n        for(int i = 1; i <= 10; i++)\
  \ {\n            sum += i;\n        }\n\n        // Printing sum\n        System.out.println(\"\
  The sum of 10 numbers is \" + sum);\n    }\n}\n```\n\n现在我们可以承认，我们的代码的作用是找到前 10 个连续整数之和。这是注释派用之处的完美例子。当我们运行这段代码时，我们会发现执行的成功没有受到我们注释的影响。\n\
  \n列表 1.12：Listing 1.11 的输出\n\n```\nThe sum of 10 numbers is 55\n```\n\n## 1.4 保留关键字\n\
  \n在 Java 中，以下关键字是**保留的**，这意味着它们被 Java 语言使用，因此不能作为变量标识符。\n\n| abstract | continue\
  \ | for | new | switch |\n| :--- | :--- | :--- | :--- | :--- |\n| assert | default\
  \ | goto | package | synchronized |\n| boolean | do | if | private | this |\n| break\
  \ | double | implements | protected | throw |\n| byte | else | import | public |\
  \ throws |\n| case | enum | instanceof | return | transient |\n| catch | extends\
  \ | int | short | try |\n| char | final | interface | static | void |\n| class |\
  \ finally | long | strictfp | volatile |\n| const | float | native | super | while\
  \ |\n\n## 1.5 本书使用的约定\n\n本书对图像、表格和代码块等内容使用了许多约定。\n\n### 1.5.1 图片\n\n图片将被称为“Figures”（图）。例如，Figure\
