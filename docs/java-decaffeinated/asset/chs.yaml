  \ 的余数。这提取了 `num` 的最后一位，这也是为什么我们反向遍历 `digits`（为了保持数组的正确顺序）。然后我们可以通过除以 10 来移除 `num`\
  \ 的最后一位。\n\n列表 9.26：从 `num` 中提取数字。\n\n```java\npublic static int[] splitDigits(int\
  \ num) {\n    int[] digits = new int[(\"\"+num).length()];\n    for (int d = digits.length-1;\
