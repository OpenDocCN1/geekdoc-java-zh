  \ 1000）。另一方面，在 10 基中，在我们所有的数字都是 9 之后，我们会增加另一个位值（99 ![epub/OEBPS/images/texmath/605575864c00abe7d78d98ad65404e3e9c121d1f](img/image00400.jpeg)\
