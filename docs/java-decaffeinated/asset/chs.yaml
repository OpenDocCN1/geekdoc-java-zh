  目前，如果我们想检查某些值是否相等，可以使用 `==` 运算符。\n\n```\n4 == 4.0\ntrue == true\n'a' == 97\n```\n\
  \n然而，对于字符串来说，情况略有不同。`String` 是一个对象而不是基本数据类型，因此当比较两个对象而不是基本数据类型时，`==` 运算符检查的是对象引用是否相同。存在一个独立的方法\
  \ `equals()` 用于比较两个对象。\n\n考虑以下代码：\n\n```\n1String one = new String(\"abc\");\n2String\
  \ two = new String(\"abc\");\n3String three = one;\n4System.out.println(one == two);\n\
  5System.out.println(one.equals(two));\n6System.out.println(one == three);\n7System.out.println(one.equals(three));\n\
  8System.out.println(two == three);\n9System.out.println(two.equals(three));\n```\n\
  \n我们期望这些结果都是 `true`，对吧？然而我们得到了下面的结果：\n\n```\nfalse\ntrue\ntrue\ntrue\nfalse\ntrue\n\
  ```\n\n让我们来分析一下。\n\n*   **第 1 行**：我们将变量 `one` 赋值为字面量 `\"abc\"`。\n*   **第 2 行**：我们使用\
  \ `String` 构造函数将变量 `two` 赋值为 `\"abc\"`（更多细节请参见第 8 章）。这将为该字面量创建一个新的内存引用。\n*   **第\
  \ 3 行**：我们将变量 `three` 赋值为 `one`。这使得 `three` 的引用与 `one` 相同。\n*   **第 4 行**：由于 `one`\
  \ 和 `two` 位于不同的内存位置，因此引用方式不同（尽管它们的字符串值相同），`==` 产生 `false` 值。\n*   **第 5 行**：当我们使用\
  \ `equals()` 方法时，Java 比较的是两个对象的值而不是引用。因此，结果为 `true`。\n*   **第 6 行**：`one` 和 `three`\
  \ 引用存储 `\"abc\"` 的同一个内存位置，因此 `==` 产生 `true`。\n*   **第 7 行**：当我们使用 `equals()` 方法时，Java\
  \ 比较的是两个对象的值而不是引用。因此结果为 `true`。\n*   **第 8 行**：由于 `two` 和 `three` 位于不同的内存位置且引用方式不同（尽管它们的字符串值相同），`==`\
  \ 产生 `false`。\n*   **第 9 行**：当我们使用 `equals()` 方法时，Java 比较的是两个对象的值而不是引用。因此结果为 `true`。\n\
  \n## 7.6 字符串格式化\n\n目前，如果我们想在字符串中添加数据，不需要使用拼接（此处原文逻辑似乎应为“需要使用拼接”），因为这可能很冗长且繁琐。此外，我们可能需要格式化小数数字。\n\
  \n考虑以下代码：\n\n```\nString name = \"John Appleseed\";\nint age = 20;\nString product\
  \ = \"coffee\";\ndouble initialPrice = 4.99;\ndouble finalPrice = initialPrice *\
  \ 1.06;\nSystem.out.println(\"Product: \" + name + \", Age: \" + age\n    + \",\
  \ purchased: \" + product + \", Final price: $\" + finalPrice);\n```\n\n注意这一行有多长；我们不得不将其分成两行！显然，当我们在\
  \ `initialPrice` 上增加 6% 的税费时，得到了一串 0（精度问题）。此外，价格通常保留两位小数。最好的解决方案是使用 `String.format()`\
  \ 静态方法，其如下：\n\n```\nString.format(str, args)\n```\n\n*   `String.format()` 是我们用于格式化\
  \ `str` 的方法。\n*   `str` 是我们要格式化的字符串。\n*   `args` 是用逗号分隔的值和或变量。\n\n在 `str` 中，我们必须包含某些格式化符，如\
  \ `%s`、`%d` 和 `%f`，它们指示填充数据的位置。这意味着 `str` 本质是一个模板字符串。格式化符的典型格式为：\n\n```\n%[argument_index$][flags][width][.precision]conversion\n\
  ```\n\n这看起来可能很复杂，但不用担心；大多数情况下，括号内的内容是不必要的，对于浮点数，我们有时只使用精度参数。\n\n### 7.6.1 将字符串格式化\n\
  \n常用的格式化符是 `%s`，它指示该位置将由字符串或任何数据类型填充。\n\n**示例 1**\n\n假设我们有以下代码，并想用 `String.format()`\
  \ 格式化字符串替换第 4 行。\n\n```java\nString name = \"John Appleseed\";\nString residence\
  \ = \"Geneva, Switzerland\";\nint age = 20;\nString formattedString = \"My name\
  \ is \" + name + \", I am \" + age\n    + \" years old, and I live in \" + residence\
  \ + \".\";\nSystem.out.println(formattedString);\n```\n\n\n\n\n```\nMy name is John\
  \ Appleseed, I am 20 years old, and I live in Geneva, Switzerland.\n```\n\n我们可以将其重写为：\n\
  \n```java\nString name = \"John Appleseed\";\nString residence = \"Geneva, Switzerland\"\
  ;\nint age = 20;\nString formattedString = String.format(\n    \"My name is %s,\
  \ I am %s years old, and I live in %s.\",\n    name, age, residence);\nSystem.out.println(formattedString);\n\
  ```\n\n在更新后的示例中，我们的模板字符串在每个需要填充外部数据的地方都包含了 `%s` 格式占位符。然后，我们按照填充格式占位符的顺序列出了变量。我们并不局限于字符串；我们在中间包含了一个整数。结果如下：\n\
  \n```\nMy name is John Appleseed, I am 20 years old, and I live in Geneva, Switzerland.\n\
  ```\n\n在大多数情况下，我们将使用 `%s` 来将任何数据输入到格式化字符串中，因为它只向字符串提供强制转换为字符串类型的数据；它不会像我们将要探索的其他格式占位符那样强制执行特定类型，也不会进行任何额外的格式化。\n\
  \n### 7.6.2 将整数格式化为字符串\n\n如果我们想专门强制将整数格式化为字符串，我们将使用 `%d` 格式占位符代替。假设我们采用之前的例子：\n\n\
  ```java\nString name = \"John Appleseed\";\nString residence = \"Geneva, Switzerland\"\
  ;\nint age = 20;\nString formattedString = String.format(\n    \"My name is %s,\
  \ I am %s years old, and I live in %s.\",\n    name, age, residence);\nSystem.out.println(formattedString);\n\
  ```\n\n我们将第二个 `%s` 替换为 `%d`，得到相同的输出。\n\n```java\nString name = \"John Appleseed\"\
  ;\nString residence = \"Geneva, Switzerland\";\nint age = 20;\nString formattedString\
  \ = String.format(\n    \"My name is %s, I am %d years old, and I live in %s.\"\
  ,\n    name, age, residence);\nSystem.out.println(formattedString);\n```\n\n在这些情况下，可能偏好\
  \ `%d` 的原因是可以使用我们之前看到的额外参数进行格式化。然而，我们不会探索这些内容，因此对于整数，你可以使用 `%s` 或 `%d`。\n\n### 7.6.3\
  \ 将浮点数格式化为字符串\n\n即使对于浮点数，我们也可以简单地使用 `%s`，但在某些情况下，更精细的 `%f` 可能更符合我们需要。\n\n考虑在本节开头介绍的示例。\n\
  \n```java\nString name = \"John Appleseed\";\nint age = 20;\nString product = \"\
  Java coffee\";\ndouble initialPrice = 4.99;\ndouble finalPrice = initialPrice *\
  \ 1.06;\nSystem.out.println(\"Product: \" + name + \", Age: \" + age + \", Product\
  \ purchased: \"\n    + product + \", Final price: $\" + finalPrice + \".\");\n```\n\
  \n如果我们使用 `String.format()` 修改此，我们将得到下面的代码：\n\n```java\nString name = \"John Appleseed\"\
  ;\nint age = 20;\nString product = \"Java coffee\";\ndouble initialPrice = 4.99;\n\
  double finalPrice = initialPrice * 1.06;\nSystem.out.println(\n    String.format(\"\
  Product: %s, Age: %s, Product purchased: %s, Final price: $%s.\",\n        name,\
  \ age, product, finalPrice));\n```\n\n然而，我们仍然得到相同的输出：\n\n```\nProduct: John Appleseed,\
  \ Age: 20, Product purchased: Java coffee, Final\n    price: $5.2894000000000005.\n\
  ```\n\n为了修复这个问题，我们必须将最后一个 `%s` 替换为 `%f`。这将小数点位数减少到六位。\n\n```java\nString name =\
  \ \"John Appleseed\";\nint age = 20;\nString product = \"Java coffee\";\ndouble\
  \ initialPrice = 4.99;\ndouble finalPrice = initialPrice * 1.06;\nSystem.out.println(\n\
  \    String.format(\"Product: %s, Age: %s, Product purchased: %s, Final price: $%f.\"\
  ,\n        name, age, product, finalPrice));\n```\n\n```\nProduct: John Appleseed,\
  \ Age: 20, Product purchased: Java coffee, Final\n    price: $5.289400.\n```\n\n\
  正如我们早之前所述，金额通常在小数点后保留两位数字。为了格式化此，我们可以在 `%` 和 `f` 之间包含 `.2`。这是 `precision`（精度）参数；它表示我们想要小数点后有两位数字。如果有更多数字，Java\
  \ 将对数字进行四舍五入。如果较少，Java 将在末尾补 0。\n\n```java\nString name = \"John Appleseed\";\n\
  int age = 20;\nString product = \"Java coffee\";\ndouble initialPrice = 4.99;\n\
  double finalPrice = initialPrice * 1.06;\nSystem.out.println(\n    String.format(\n\
  \        \"Product: %s, Age: %s, Product purchased: %s, Final price: $%.2f.\",\n\
  \        name, age, product, finalPrice));\n```\n\n### 7.6.4 格式化字符串\n\n在大多数情况下，我们将使用\
  \ `%s` 来将任何数据输入到格式化字符串中，因为它只向字符串提供强制转换为字符串类型的数据；它不会像我们将要探索的其他格式占位符那样强制执行特定类型，也不会进行任何额外的格式化。\n\
  \n### 7.7 其他字符串方法\n\n除了 `charAt()`、`length()` 和 `substring()`，字符串对象还有其他有用的方法。\n\n\
  #### 7.7.1 `indexOf()`\n\n`indexOf()` 方法实现与我们之前的代码非常相似：它返回子字符串首次出现的索引。有四种版本的 `indexOf()`：\n\
  \n```\nstr.indexOf(char)\nstr.indexOf(char, fromIndex)\nstr.indexOf(substring)\n\
  str.indexOf(substring, fromIndex)\n```\n\n*   `str` 是应用 `indexOf()` 方法的字符串对象。\n\
  *   **行 1**: `indexOf()` 接收 `char` 作为参数，返回 `str` 中 `char` 首次出现索引的整数值。\n*   **行 2**:\
  \ `indexOf()` 接收 `char` 和 `int` `fromIndex` 作为参数，返回 `str` 中从 `fromIndex` 之后（包含该索引）`char`\
  \ 首次出现索引的整数值。\n*   **行 3**: `indexOf()` 接收 `substring`（子字符串）作为参数，返回 `str` 中 `substring`\
  \ 首次出现索引的整数值。\n*   **行 4**: `indexOf()` 接收 `substring` 和 `int` `fromIndex` 作为参数，返回\
  \ `str` 中从 `fromIndex` 之后（包含该索引）`substring` 首次出现索引的整数值。\n\n**示例 1**\n\n假设我们想在字符串\
  \ `\"Hello world\"` 中搜索字母 `o` 的首次出现。我们可以写如下代码：\n\n```java\nSystem.out.println(\"\
  Hello world\".indexOf('o'));\n```\n\n我们将收到以下输出：\n\n```\n4\n```\n\n**示例 2**\n\n假设我们想写一个函数\
  \ `nfind()`，它返回字符串第 n 次出现的索引，如果第 n 次不存在则返回 -1。我们可以写下下面的方法头。\n\n列表 7.32：`nfind()`\
  \ 的方法头。\n\n```java\npublic static int nfind(String str, char ch, int n) {\n\n}\n\
  ```\n\n在此例中，`str` 是我们正在搜索的字符串，`ch` 是我们正在搜索的字符，而 `n` 告诉我们我们想要 `ch` 的第 n 次出现。\n\n\n\
  \n\n接下来，我们将添加一个变量 `lo_bound`，它代表 `indexOf` 开始搜索 `ch` 的索引。添加该变量后，我们将使用一个 `for` 循环迭代\
  \ `n` 次，在每次迭代中，如果从上一次找到 `ch` 的索引开始的 `indexOf()` 未返回 -1，则我们将继续搜索。由于我们想从开头开始搜索，但始终使用比上次找到的\
  \ `ch` 索引大 1 的 `indexOf()`，我们将让 `lo_bound` 等于 -1。\n\nListing 7.33：添加 `lobound` 变量。\n\
  \n```\npublic static int nfind(String str, char ch, int n) {\n    int lo_bound =\
  \ -1;\n}\n```\n\n我们现在可以添加 `for` 循环了。\n\nListing 7.34：添加一个 `for` 循环。\n\n```\npublic\
  \ static int nfind(String str, char ch, int n) {\n    int lo_bound = -1;\n    for\
  \ (int i = 0; i < n; i++) {\n\n    }\n}\n```\n\n在 `for` 循环内部，我们将 `lo_bound` 赋值为在\
  \ `str` 上调用 `indexOf()` 的结果，其中 `ch` 是字符，`lo_bound+1` 是搜索的起始点（而不是 `lo_bound`，因为如果我们写成那样，如果在索引\
  \ `lo_bound` 处有一个有效的 `ch`，那么 `lo_bound` 可能永远不会改变，因为 `indexOf` 将从该参数（包含该位置）开始搜索）。然后，我们检查\
  \ `lo_bound` 是否等于 -1。如果是，则不存在第 n 次出现的 `ch`，我们返回 -1。\n\nListing 7.35：更新 `lobound`\
  \ 并确保它不等于 -1。\n\n```\npublic static int nfind(String str, char ch, int n) {\n  \
  \  int lo_bound = -1;\n    for (int i = 0; i < n; i++) {\n        lo_bound = str.indexOf(ch,\
  \ lo_bound+1);\n        if (lo_bound == -1) {\n            return -1;\n        }\n\
  \    }\n}\n```\n\n最后，如果我们在完成循环而没有返回，说明我们成功在 `str` 中找到了第 n 次出现的 `ch`，因此可以在循环外返回 `lo_bound`。\n\
  \nListing 7.36：更新 `lobound` 并确保它不等于 -1。\n\n```\npublic static int nfind(String str,\
  \ char ch, int n) {\n    int lo_bound = -1;\n    for (int i = 0; i < n; i++) {\n\
  \        lo_bound = str.indexOf(ch, lo_bound+1);\n        if (lo_bound == -1) {\n\
  \            return -1;\n        }\n    }\n    return lo_bound;\n}\n```\n\n我们现在可以通过在\
  \ `main()` 中调用它来对其进行测试。\n\nListing 7.37：在 `main()` 中测试 `nfind()`。\n\n```java\npublic\
  \ static void main(String[] args) {\n    String phrase = \"mississippi\";\n    for\
  \ (int n = 1; n <= 5; n++) {\n        System.out.println(nfind(phrase, 'i', n));\n\
  \    }\n}\n```\n\n由于 `phrase` 中只有四个 `'i'`，只有前四次方法调用应该产生正整数。第五次将产生 -1。\n\nListing\
  \ 7.38：Listing 7.37 的输出。\n\n```\n1\n4\n7\n10\n-1\n```\n\n### 7.7.2 `compareTo()`\n\
  \n`compareTo()` 方法按字典顺序比较两个字符串。换句话说，它根据 Unicode 表格中的顺序对两个字符串中对应的字符进行比较。\n\n`compareTo()`\
  \ 的编写方式如下：\n\n```\nstr1.compareTo(str2);\n```\n\n* `str1` 和 `str2` 都是 `String` 对象。\n\
  * 如果 `str1` 在字典顺序上在 `str2` 前，则返回一个负的 `int` 值。\n* 如果 `str1` 与 `str2` 的值相同，则返回 0。\n\
  * 如果 `str1` 在字典顺序上在 `str2` 后，则返回一个正的 `int` 值。\n\n以下解释了 `compareTo()` 是如何实现的：\n\n\
  * 一个迭代变量 `i` 将遍历从 0 到较短字符串末尾的索引。\n* 在每次迭代中，将比较 `str1` 和 `str2` 中的第 i 个字符。如果 `str1`\
  \ 中的字符在 `str2` 相同位置的字符之前，则函数以负的返回值结束。如果 `str1` 中的字符在 `str2` 相同位置的字符之后，则函数以正的返回值结束。如果两个字符相同，则函数继续循环。\n\
  * 如果函数完成了较短字符串范围内索引的循环且没有返回，那么如果 `str1` 是较短字符串而 `str2` 是较长字符串，将返回一个负值；反之，则将返回一个正值。\n\
  * 如果两个字符串完全相同，则返回 0。\n\n假设我们有以下代码：\n\n```\nString str1 = \"aabb\";\nString str2\
  \ = \"bb\";\nString str3 = \"aabb\";\nString str4 = \"aaaa\";\nSystem.out.println(str1.compareTo(str2));\n\
  System.out.println(str1.compareTo(str3));\nSystem.out.println(str2.compareTo(str3));\n\
  System.out.println(str1.compareTo(str4));\n```\n\n我们将得到以下输出：\n\n```\n-1\n0\n1\n\
  1\n```\n\n* 在第 1 行，`str1` 在字典顺序上在 `str2` 前，因此返回一个负整数。\n* 在第 2 行，`str1` 与 `str3`\
  \ 的值相同，因此返回 0。\n* 在第 3 行，`str2` 在字典顺序上在 `str3` 后，因此返回一个正整数。\n* 在第 4 行，`str1` 在字典顺序上在\
  \ `str4` 后，因此返回一个正整数。（等待，文本中的逻辑说 \"aabb\" 在 \"aaaa\" 之后，这是正确的）。\n\n### 7.7.3 `toLowerCase()`\
  \ 和 `toUpperCase()`\n\n`toLowerCase()` 和 `toUpperCase()` 两个字符串方法正如它们的名字一样工作：它们返回字符串的小写和大大写版本。\n\
  \n```\nSystem.out.println(\"Hello world!\".toLowerCase());\nSystem.out.println(\"\
  Hello world!\".toUpperCase());\nSystem.out.println(\"Hello world!\".equals(\"hello\
  \ world!\"));\nSystem.out.println(\"Hello world!\".toLowerCase().equals(\"hello\
  \ world!\"));\n```\n\n我们将得到以下输出：\n\n```\nhello world!\nHELLO WORLD!\nfalse\ntrue\n\
  ```\n\n* 在第 1 和第 2 行，我们分别将 \"Hello world!\" 转换为小大写。\n* 在第 3 行，`equals()` 方法返回 `false`。\n\
  * 在第 4 行，通过忽略大小写，方法返回 `true`。\n\n\n\n\n我们已经看到类与对象之间存在一种相似的关系，就像我们使用的原始类型（包括 `int`、`char`、`double`\
  \ 和 `boolean`）与属于这些类型的值之间的关系。正如类型之于它们可能的值（例如 `int` 之于 `5` 或 `8`），类之于它们的对象。那么，类与原始类型之间的区别在于，类是使用原始类型构建的。将其想象成一个人类细胞；细胞内部有许多特征如细胞核、线粒体和细胞器。\n\
  \n在本章中，我们将探索类和对象的基础，包括它们如何工作以及如何创建它们。\n\n## 8.1 类\n\n正如我们之前所说的，**类**是对象的**蓝图**，定义了它的特征和能力。对象是使用类创建的。同一类的对象可能具有不同的*具体*特征，但仍保持相同的*类型*特征。这些特征分为两类：**属性**和**行为**。\n\
  \n类属性是类内部的变量，定义了由该类创建的任何对象的特征，或者说是将其与其他类区分开来的特征。例如，如果我们创建了一个 `Person` 类，我们可以添加 `name`、`age`\
  \ 和 `height` 属性/变量，以描述使用该类创建的任何对象的相应数据。\n\n类行为是类内部的方法（函数的另一种说法），它们定义了由该类创建的对象可以做什么。例如，如果我们创建了一个\
  \ `Car` 类，我们可以添加 `honk()`、`useGas()` 和 `playRadio()` 作为不同的方法实现，因为这些都是汽车的一些能力。注意，`static`\
  \ 方法不是类的行为；因此，当我们想给类添加行为时，我们不会在相应的方法头中包含此关键字。\n\n属性和行为在几个方面是不同的。首先，属性是类变量（不是函数内部的变量，而是在函数外部且类内部；我们稍后会看到这些），而行为是方法。其次，属性可以存储不同的值（正如我们已经通过变量所知的那样），而行为通常保持不变（因为来自同一类的任何两个对象虽然特征不同，但能够执行相同的事情）。\n\
  \n## 8.2 创建类\n\n在本章中，我们将重点介绍单个文件 `Car.java` 中类和对象的核心概念，该文件包含了 `Car` 类，这是一个表示 `Car`\
  \ 对象的类。请记住，类通常存在于自己的文件中，文件名与类名匹配。\n\n创建此文件并为 `Car` 添加类头。使用 `public` 关键字作为前缀。\n\n\
  Listing 8.1：创建一个新文件 `Car.java` 并添加类头。\n\n```java\npublic class Car {\n}\n```\n\n\
  我们可以向此类添加 `main()` 方法。\n\nListing 8.2：创建一个新文件 `Car.java` 并添加类头。\n\n```java\npublic\
  \ class Car {\n    // Runner\n    public static void main(String[] args) {\n   \
  \ }\n}\n```\n\n注意，由于 `main()` 是 `static` 的（并且是必须静态的），它不是 `Car` 类的行为。\n\n## 8.3 创建对象\n\
  \n现在我们已经创建了 `Car` 类（尽管是空的），我们可以从这个类中创建或**实例化**（instantiate）新对象。实例化对象的通用结构如下：\n\n\
  ```java\nClassName objectVariable = new ClassName();\n```\n\n*   `ClassName` 是类的名称（例如\
  \ `Car`）。\n*   `objectVariable` 是类型为 `ClassName` 的变量名。\n*   `new` 是我们用于从类中**实例化**新对象的关键字。\n\
  *   对于 `=` 符号后的 `ClassName`，我们添加 `()` 就像是在调用一个没有参数的方法一样；正如我们稍后看到的，我们可以为类添加功能，以便在初次实例化新对象时提供参数。\n\
  *   `=` 符号之前的部分是声明新 `ClassName` 变量的地方， `=` 符号之后的部分是实例化 `ClassName` 对象实例并将其赋值给 `objectVariable`\
  \ 的地方。\n\n我们已经在 `String` 上见过这种用法，例如在 Listing 7.1 中，那里我们演示了如何创建新的 `String` 变量。\n\n\
  ```java\nString one = \"\";\nString two = new String(); // 使用实例化\nString three =\
  \ \"Hello\";\nString four = new String(\"Hello\"); // 使用实例化\n```\n\n让我们尝试在我们的 `main()`\
  \ 方法中实例化 `Car` 的新对象实例。\n\nListing 8.3：创建一个新文件 `Car.java` 并添加类头。\n\n```java\npublic\
  \ class Car {\n    // Runner\n    public static void main(String[] args) {\n   \
  \     Car myCar = new Car();\n        Car yourCar = new Car();\n        Car thatCar\
  \ = myCar;\n        System.out.println(myCar + \" \" + yourCar + \" \" + thatCar);\n\
  \        System.out.println(myCar == yourCar);\n        System.out.println(myCar\
  \ == thatCar);\n    }\n}\n```\n\n在第 4 行，我们实例化了一个新的 `Car` 并将其赋值给 `myCar`。在第 5 行，我们实例化另一个\
  \ `Car` 对象并将其赋值给 `yourCar`。在第 6 行，我们将现有的 `Car` 对象赋值给 `thatCar`。在输出的第一行中，我们打印了 `myCar`、`yourCar`\
  \ 和 `thatCar`，用空格隔开。由于 `myCar` 和 `yourCar` 是不同的对象，它们具有不同的内存地址（3fb647 和 79bd0f）。在输出的第二行中，我们打印了\
  \ `myCar` 是否等于 `yourCar`。当我们对对象使用 `==` 运算符时，比较的是内存地址，因此结果为 `false`。但在输出的第三行中，我们使用\
  \ `==` 运算符打印了 `myCar` 和 `thatCar` 是否相等，因为当我们声明 `thatCar` 时，直接将其初始化为 `myCar`，这意味着\
  \ `myCar` 和 `thatCar` 指向同一个对象。\n\n```\nCar@3fb647 Car@79bd0f\nfalse\ntrue\n```\n\
  \n## 8.4 属性\n\n在类中，**属性**是在类体内部但在任何方法之外声明（有时也会初始化）的变量。属性描述了对象的特征；例如，一个假设的 `Phone`\
  \ 对象可能有 `RAM`、`Storage`、`OperatingSystem` 和 `Version` 作为可能的属性（我们也可以有其他属性）。这些描述了对象的“外观”或“组成”。就像任何变量一样，我们需要为这些每个变量提供类型。\n\
  \n让我们通过向 `Car.java` 中添加一些属性来评估这一点。我们将添加：`color`、`numberSeats`、`mpg`、`gasAmount`\
  \ 和 `carType`，它们分别代表 `Car` 对象的颜色、汽车座椅数、汽车的每英里油耗、汽车当前的油量以及汽车类型（例如轿车、SUV、面包车）。请注意我们为这些每个属性声明的类型。\n\
  \nListing 8.5：为 `Car` 类添加属性。\n\n\n\n\n\n```java\npublic class Car {\n    // Attributes\n\
  \    String color;\n    int numberSeats;\n    double mpg;\n    double gasAmount\
  \ = 10;\n    String carType;\n\n    // Runner\n    public static void main(String[]\
  \ args) {/* ... */}\n}\n```\n\n让我们注意几点：`color`、`numberSeats`、`mpg` 和 `carType` 都已声明但未初始化。另一方面，`gasAmount`\
  \ 既被声明了也进行了初始化。这意味着当我们创建一个新的 `Car` 对象时，需要为未初始化的变量赋值。\n\n通常情况下，我们可以通过先实例化对象，然后使用\
  \ `dot notation`（点符号表示法）来访问对象的属性。\n\n```java\n// Accessing attributes\nobject.this_attribute\n\
  object.that_attribute\n```\n\n当我们访问属性时，本质上我们是将其视为变量来处理。因此，我们可以像对待变量一样为属性赋值，或者在表达式中使用属性。让我们看看下面将如何应用这一点。\n\
  \n列表 8.6：实例化 `Car` 对象。\n\n```java\npublic class Car {\n    // Attributes\n    String\
  \ color;\n    int numberSeats;\n    double mpg;\n    double gasAmount = 10;\n  \
  \  String carType;\n\n    // Runner\n    public static void main(String[] args)\
  \ {\n        // Instantiating car1\n        Car car1 = new Car();\n\n        //\
  \ Modifying car1's attributes\n        car1.color = \"blue\";\n        car1.numberSeats\
  \ = 4;\n        car1.mpg = 52;\n        car1.carType = \"sedan\";\n\n        //\
  \ Printing car1 attributes\n        System.out.println(car1.color);\n        System.out.println(car1.numberSeats);\n\
  \        System.out.println(car1.mpg);\n        System.out.println(car1.gasAmount);\n\
  \        System.out.println(car1.carType);\n    }\n}\n```\n\n我们首先修改了新对象 `car1` 的属性。注意，我们没有修改\
  \ `gasAmount` 属性。我们可以修改它，但没有必要，因为如果我们稍后想访问它的值，我们不会遇到任何错误（因为它在类本身中已经初始化了）。\n\n接下来，我们打印了\
  \ `car1` 的所有属性。同样，我们使用了点符号表示法来访问这些属性。\n\n因此，Java 将输出以下内容：\n\n列表 8.7：列表 8.6 的输出\n\
  \n```\nblue\n4\n52.0\n10.0\nsedan\n```\n\n## 8.5 构造函数与 `this` 关键字\n\n在转向行为（behaviors）之前，我们应该考虑一种特殊的行为/方法。`构造`（constructor）是在对象实例化时立即被调用的方法。它类似于：\n\
  \n```java\n// Example of a constructor with parameters\npublic ClassName(params)\
  \ {\n    // Do stuff here\n}\n\n// Example of a constructor without parameters\n\
  public ClassName() {\n    // Do stuff here\n}\n```\n\n注意，构造函数的头部看起来和方法头部几乎完全一样，区别在于我们没有包含类型（例如\
  \ `int`、`boolean`）。此外，我们不允许编写 `static`（没有静态构造函数），否则，你学到的任何关于方法的知识都适用于这里。这意味着以下内容成立：\n\
  \n* 我们可以为构造函数添加参数，也可以简单没有构造函数参数。\n* 我们可以执行 `构造函数重载`（constructor overloading），只要方法签名不同，我们就可以有多个构造函数；更多细节请参见第\
  \ 4.5 节。\n\n构造函数用于在对象创建后立即执行某些代码，作为对象使用的“准备”阶段。构造函数的一个重要用途是为已声明但未初始化的属性赋值。\n\n有一点重要的需要注意：在构造函数（或任何行为中，我们将在下一节探讨）中，如果我们想访问属性，应该使用点符号表示法和\
  \ `this` 关键字的组合（注意我们说的是“应该”，而不是“必须”；对此将解释）。\n\n```java\n// Example\npublic ClassName(params)\
  \ {\n    this.someAttribute = something;\n    this.someOtherAttribute = somethingElse;\n\
  \    System.out.println(this.aThirdAttribute);\n}\n```\n\n`this` 指向对象本身，因此可以使用它来访问属性或方法。`除非我们有一个局部变量（行为或构造函数内部的变量），它与属性同名，但意指一个不同的变量，否则是不要求的。`\n\
  \n让我们为我们的类添加一个构造函数。\n\n列表 8.8：为 `Car` 添加构造函数。\n\n```java\npublic class Car {\n \
  \   // Attributes\n    String color;\n    int numberSeats;\n    double mpg;\n  \
  \  double gasAmount = 10;\n    String carType;\n\n    // Constructor\n    public\
  \ Car(String color, int numSeats, double mpg, String carType) {\n        this.color\
  \ = color;\n        numberSeats = numSeats;\n        this.mpg = mpg;\n        this.carType\
  \ = carType;\n    }\n\n    // Runner\n    public static void main(String[] args)\
  \ {/* ... */}\n}\n```\n\n在这里，我们这样命名了参数，然后将我们的属性赋值为这些值。我们注意几点：\n\n* 我们没有为 `gasAmount`\
  \ 属性赋值任何值。我们不需要这样做，因为 `gasAmount` 已经赋值为 10。但是，如果我们想要也可以这样做。\n* `color`、`mpg` 和 `carType`\
  \ 属性被赋值了构造函数中的对应值。无论怎么强调都不为过分`this.color` 不同于 `color`！因为两者同名，当我们引用 `color` 时，Java\
  \ 会自动查找局部变量，所以构造函数没有局部变量，它指的是类属性。当我们赋值 `numberSeats = numSeats` 时，我们不需要写 `this.numberSeats`。\n\
  \n要使用构造函数实例化新对象，我们写：\n\n```java\nClassName object = new ClassName(params);\n```\n\
  \n让我们使用这种方法创建一个新的 `Car` 对象。\n\n列表 8.9：使用自定义构造函数实例化 `Car` 对象。\n\n```java\npublic\
  \ class Car {\n    // Attributes\n    String color;\n    int numberSeats;\n    double\
  \ mpg;\n    double gasAmount = 10;\n    String carType;\n\n    // Constructor\n\
  \    public Car(String color, int numSeats, double mpg, String carType) {\n    \
  \    this.color = color;\n        numberSeats = numSeats;\n        this.mpg = mpg;\n\
  \        this.carType = carType;\n    }\n\n    // Runner\n    public static void\
  \ main(String[] args) {\n        // Instantiating car1\n        Car car1 = new Car(\"\
  blue\", 4, 52, \"sedan\");\n        // Printing car1 attributes\n        System.out.println(car1.color);\n\
  \        System.out.println(car1.numberSeats);\n        System.out.println(car1.mpg);\n\
  \        System.out.println(car1.gasAmount);\n        System.out.println(car1.carType);\n\
  \        // Changing car1's color\n        car1.color = \"red\";\n        System.out.println(\"\
  Changed car1's color to \" + car1.color);\n    }\n}\n```\n\n列表 8.10：列表 8.9 的输出\n\
  \n```\nblue\n4\n52.0\n10.0\nsedan\nChanged car1's color to red\n```\n\n仅仅为了练习，我们可以添加另一个构造函数。注意在这个新的构造函数头部，类型的顺序必须是不同的。也就是说，我们不能使用以下顺序：`String`、`int`、`double`、`String`。\n\
  \n列表 8.11：为 `Car` 添加另一个构造函数。\n\n\n\n\n```java\npublic class Car {\n    // Attributes\n\
