  \ line numbers\");\n}\n```\n\n### 1.5.4 Notes\n\n偶尔会出现“注释”，它们讨论有趣的实或主题，但偏离了概念的主旨。这些框并非必读，但很有帮助。它们将出现在阴影块中，并带有所讨论概念的标题。\n\
