  \ `int` 开始。同样，如果你的整数不断减小，它最终将循环并从最大的正 `int` 开始。\n\n### 2.1.2 整数数学运算\n\n就像在现实生活中一样，你可以在\
  \ Java 中对整数进行简单的算术运算。表 2.2 显示了你可以与数字使用的不同运算符。\n\n| 运算符 | 定义 | 示例 |\n| :--- | :---\
