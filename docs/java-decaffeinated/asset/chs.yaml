  \ 4;\n    }\n\n    // Runner\n    public static void main(String[] args) {/* ...\
  \ */}\n}\n```\n\n我们的新构造函数由参数 `color`、`mpg` 和 `carType` 组成。这意味着在构造函数的体内，我们为 `numberSeats`\
