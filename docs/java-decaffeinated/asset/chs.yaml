  \n最后，每章末尾会有编程问题。除非另有说明，否则将你从 `main()` 方法或 `main()` 调用的另一个静态方法中编写并运行代码。\n\n> **Problem\
  \ 1**\n\n> 编写一个程序使用 `for` 循环打印从 1 到 100 的所有数字。\n\n练习和问题的解答都位于书末。\n\n\n\n\n## 1.6\
  \ 复习\n\n在本节中，我们开始了 Java 编程之旅，首先安装了用于调试和执行的 JDK。接下来，我们安装了 Eclipse IDE，并创建并运行了第一个“Hello\
  \ world”程序。最后，我们学习了如何打印更多数据，并分析了注释、重要的关键字以及本书中使用的规范。\n\n# 第 2 章 类型\n\nJava 是一种`object-oriented`（面向对象）语言，这意味着我们使用\
  \ Java 来操作`objects`（对象）。现实中的对象可以是任何东西，从汽车网球。以后我们将能够创建自己的对象。然而，在此之前，我们必须处理 Java 处理的最基本内容，即`types`（类型）。\n\
  \n我们可以处理许多不同类型的数据，包括数字和文本。事实上，我们有八种可以使用的`primitive types`（原始类型），或最基本的类型：`int`、`long`、`short`、`float`、`double`、`boolean`、`char`\
  \ 和 `byte`。我们将重点关注 `int`、`double` 和 `boolean`，但偶尔也要使用其他类型。\n\n除了这些原始类型，我们可以在更大规模上处理对象，例如\
  \ `Strings`、`StringBuilders`、`Integers`、`Doubles` 等。这些对象不是原始类型，因为它们的整个基础都是基于原始类型的工作原理。例如，一个\
  \ `String` 对象仅仅是 `char` 数据序列。\n\n让我们从学习如何操作数字开始。\n\n## 2.1 数字\n\nJava 允许我们在很大程度上处理数字。例如，2、5.6\
  \ 和 -93 都是数字的例子。\n\n数字虽然本身不是对象，但可以拆分为 `int`、`long`、`short`、`byte`、`float` 和 `double`。让我们先探索整数的不同类型。\n\
  \n### 2.1.1 Java 整数的类型\n\n在进入整数之前，我们需要复习一个重要的计算机科学概念。我们必须面对现实：一切都是由`binary numbers`（二进制数）组成的，这意味着我们使用\
  \ 0 和 1 来表示所有类型的数据。特别是整数，表示为 0 和 1 的组合。\n\n区块 2.1. 二进制与十进制\n\n如果我们从 2 基（二进制格式）开始计数，我们将从这里\n\
