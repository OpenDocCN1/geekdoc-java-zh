  \ 5.21 的输出\n\n```\n1.0\n2.9\n```\n\n## 5.3 `else if` 子句\n\n条件语句的用处在于，如果第一个条件失败，那么我们可以在尝试评估\
  \ `else` 子句（如果存在的话）之前，先评估后续的条件。\n\n例如，假设我们想构建一个评分标准，其中应用以下规则将数字成绩转换为字母等级：\n\n* \
