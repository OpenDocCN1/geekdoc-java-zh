  mdcn: "\n\n# Android Studio 移动应用开发初指南\n\n例如，让我们尝试找到从 1 到 50 的数字和。如果不使用循环，我们将按照如下方式操作：\n\
    \n```java\nint sum = 0\nsum = sum + 1\nsum = sum + 2\nsum = sum + 3\n// .... (这里还有\
    \ 44 行代码)\nsum = sum + 48\nsum = sum + 49\nsum = sum + 50\n```\n代码 4.20\n\n点号所在的行必须还有额外的\
    \ 44 行代码（上面已省略）。如你所见，这个简单的任务如果不使用循环将需要 51 行代码。而且，它很容易出错。请记住，我们要在编程中尽可能用最短的代码完成任务，以防止错误。\n\
    \nJava 中有三种循环：for 循环、while 循环和 do-while 循环。\n\n1. **for 循环**：当我们知道某个操作将执行多少次时，我们使用\
    \ for 循环。for 循环的通用结构如下：\n\n```java\nfor (type counter = initial value; counter\
    \ check; counter increment/decrement statement) {\n    要重复执行的代码\n}\n```\n代码 4.21\n\
    \n- 计数器是一个整数变量。\n- 在每个循环结束后，计数器变量会根据 `(counter increment/decrement statement)`\
    \ 中的表达式进行递加或递减。\n- 每次递加或递减后，检查 `(counter check)` 是否仍然满足。如果满足，循环继续；如果不满足，循环结束。\n\
    \n# 第 4 章. Java 基础\n\n让我们使用 for 循环来计算 1 到 50 的数字之和，以便更好地理解这些内容：\n\n```java\npackage\
    \ com.helloworld.quantum.helloworld;\npublic class JavaFor {\n    public static\
    \ void main(String args[]) {\n        int sum = 0;\n        for (int counter =\
    \ 0; counter<=50; counter++) {\n            sum = sum + counter;\n        }\n\
    \        System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n代码 4.22\n\n在这段代码中，创建了一个变量\
    \ `sum` 来存储和。定义了一个 for 循环，在其中创建了一个名为 `counter` 的整数变量，并从 0 循环到 50。在 for 循环中，循环变量在每次迭代中通过表达式\
    \ `counter++` 递加 1。因此，随着循环的进行，`counter` 变量取值为 0, 1, 2, 3, ..., 50。当它取值为 51 时，循环条件\
    \ `counter <= 50`（即小于或等于 50）不再满足，因此循环结束，不会对 `counter = 51` 执行循环操作。\n\n变量 `sum`\
    \ 初始化为 0，然后通过表达式 `sum=sum+counter` 将计数器加到循环块中。这种方法将 0 到 50 的数字加到 `sum` 变量中。最后，`sum`\
    \ 变量将打印在终端屏幕上，如图 4.21 所示。从 0 到 50 的数字之和计算为 1275。\n\n# 2. **while 循环**：当我们不知道循环将在哪次迭代结束时，可以使用\
    \ while 循环。for 循环和 while 循环的主要区别在于，循环变量的递加方法是在循环内部指定的，因此它提供了更大的灵活性。使用 while 循环计算\
    \ 0 到 50 的数字之和见代码 4.23。\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_71_0.png)\n\
    图 4.21. Java 中的 for 循环示例\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
    public class JavaWhile {\n    public static void main(String args[]) {\n     \
    \   int sum = 0;\n        int counter = 0;\n        while (counter <= 50) {\n\
    \            sum = sum + counter;\n            counter++;\n        }\n       \
    \ System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n\n如上所示，循环变量 `counter`\
    \ 定义在 while 循环之前。while 循环检查条件 `counter<=50` 是否满足。如果满足，则执行 while 循环内部的表达式，否则 while\
    \ 循环结束。计数器变量在 while 循环内部通过表达式 `counter++` 递加。输出再次为 1275，如图 4.22 所示。\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_72_0.png)\n\
    图 4.22. Java 中的 while 循环示例\n\n**do-while 循环**：do-while 的执行与 **while** 循环相似，但循环变量是在循环块结束时检查的，如下：\n\
    \n```java\npackage com.example.atomic.javabasics1;\npublic class JavaDoWhile {\n\
    \    public static void main(String args[]) {\n        int sum = 0;\n        int\
    \ counter = 0;\n        do {\n            sum = sum + counter;\n            counter++;\n\
    \        }while (counter<=50);\n        // do-while 循环结束\n        System.out.println(\"\
    The sum is \" + sum);\n    }\n}\n```\n\n"
