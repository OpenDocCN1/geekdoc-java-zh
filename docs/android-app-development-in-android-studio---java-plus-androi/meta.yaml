    - Create Test

    - Create subclass

    - Insert Indexing API Code

    - Unimplement Interface

    - Make package-local

    ```


    Figure 9.8. Selecting Implement methods for correcting the callbacks


    The dialog shown in Figure 9.9 appears after choosing to implement methods. Please
    leave the selected methods and click OK in this window. Then, the required methods
    will be added to MapsActivity.java and the error marks will disappear.'
- md: "\n# BEGINNER'S GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_167_0.png)\n\
    \n**Figure 9.9.** Selecting the methods to implement for the callbacks\n\nAfter\
    \ implementing these methods, MapsActivity.java looks like follows:\n\n```java\n\
    package com.example.atomic.myapplication;\n\nimport android.location.Location;\n\
    import android.location.LocationListener;\nimport android.support.annotation.NonNull;\n\
    import android.support.annotation.Nullable;\nimport android.support.v4.app.FragmentActivity;\n\
    ```\n\n```java\nimport android.os.Bundle;\n\nimport com.google.android.gms.common.ConnectionResult;\n\
    import com.google.android.gms.common.api.GoogleApiClient;\nimport com.google.android.gms.maps.CameraUpdateFactory;\n\
    import com.google.android.gms.maps.GoogleMap;\nimport com.google.android.gms.maps.OnMapReadyCallback;\n\
    import com.google.android.gms.maps.SupportMapFragment;\nimport com.google.android.gms.maps.model.LatLng;\n\
    import com.google.android.gms.maps.model.MarkerOptions;\n```\n\n```java\npublic\
    \ class MapsActivity extends FragmentActivity\nimplements OnMapReadyCallback,\n\
    \    GoogleApiClient.ConnectionCallbacks,\n    GoogleApiClient.OnConnectionFailedListener,\n\
    \    LocationListener() {\n\n    private GoogleMap mMap;\n\n    @Override\n  \
    \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_maps);\n        // On the SupportMapFragment\
    \ and get\n        // notified when the map is ready to be used.\n        SupportMapFragment\
    \ mapFragment =\n            (SupportMapFragment) getSupportFragmentManager()\n\
    \            .findFragmentById(R.id.map);\n        mapFragment.getMapAsync(this);\n\
    \    }\n```\n\n```java\n/**\n * Manipulates the map once available.\n * This callback\
    \ is triggered when the map is\n * ready to be used.\n * This is where we can\
    \ add markers or lines,\n * add listeners or move the camera. In this case,\n\
    \ * we just add a marker near Sydney, Australia.\n * If Google Play services is\
    \ not installed on\n * the device, the user will be prompted to install\n * it\
    \ inside the SupportMapFragment. This method will be only be triggered once the\
    \ user has\n * installed Google Play services and returned\n```\n\n```java\n@Override\n\
    public void onMapReady(GoogleMap googleMap) {\n    mMap = googleMap;\n\n    //\
    \ Add a marker in Sydney and move the camera\n    LatLng sydney = new LatLng(-34,\
    \ 151);\n    mMap.addMarker(MarkerOptions().position(sydney).title(\"Marker in\
    \ Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n}\n\
    \n@Override\npublic void onLocationChanged(Location location) {\n}\n\n@Override\n\
    public void onStatusChanged(String provider, int status, Bundle extras) {\n}\n\
    \n@Override\npublic void onMarkerEnabled(String provider) {\n}\n\n@Override\n\
    public void onProviderDisabled(String provider) {\n}\n\n@Override\npublic void\
    \ onConnected(@Nullable Bundle\nbundle) {\n\n    @Override\n    public void onConnectionSuspended(int\
    \ i) {\n\n    }\n\n    @Override\n    public void onConnectionFailed(@NonNull\
    \ ConnectionResult connectionResult) {\n\n    }\n}\n```\n\n## 9.6. Populating\
    \ the Implemented Methods\n\nLet’s start populating the implemented methods. First\
    \ of all, we’ll declare the objects that will be used in our code as follows:\n\
    \nLocation myLastLocation;\nLocationRequest myLocationRequest;\nGoogleApiClient\
    \ myGoogleApiClient;\nMarker myCurrLocationMarker;\n\nCode 9.6 (cont’d from the\
    \ previous page)\n\nIn these declarations, myLastLocation holds the location info\
    \ itself. The remaining objects will be responsible to manage the location request,\
    \ api related processes and the marker showing the current location, respectively.\n\
    \nThe onCreate() method contains the jobs to be done when the activity first starts\
    \ as we learned before. We need to modify it as follows to check the tracking\
    \ permission and create a SupportMapFragment object that will be used to do things\
    \ related to the MapFragment object of the user interface:\n\n```java\nprotected\
    \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
    \    setContentView(R.layout.activity_maps);\n}\n```\n\n```java\nif (android.os.Build.VERSION.SDK_INT\
    \ >=\nBuild.VERSION_CODES.M) {\n    checkLocationPermission();\n}\nSupportMapFragment\
    \ mapFragment =\n(SupportMapFragment) getSupportFragmentManager()\n    .findFragmentById(R.id.map);\n\
    \    mapFragment.getMapAsync(this);\n```\n\nCode 9.7 (cont'd from the previous\
    \ page)\n\nThe next method to modify is the onMapReady() method. This method deals\
    \ with the manipulation of the map once it is available. In this method, the app\
    \ will check whether the device has Google Play Services installed and if not,\
    \ the app will prompt to install it. Please remember that map related functions\
    \ can not run if Google Play Services is not installed. We do this as follows:\n\
    \n```java\npublic void onMapReady(GoogleMap googleMap) {\n    mMap = googleMap;\n\
    \    mMap = googleMap; //Checking Google Play Services\n    if (android.os.Build.VERSION.SDK_INT\
    \ >=\nBuild.VERSION_CODES.M) {\n        if (ContextCompat.checkPermission(this,\
    \ Manifest.permission.ACCESS_FINE_LOCATION) ==\nPackageManager.PERMISSION_GRANTED)\
    \ {\n            mMap.MyLocationEnabled(true);\n        } else {\n           \
    \ mMap.MyLocationEnabled(false);\n        }\n    }\n}\n```\n\nCode 9.8\n\nThe\
    \ Google api used in this method is built using the following:\n\n```java\nprotected\
    \ synchronized void buildGoogleApiClient()\n{\n    myGoogleApiClient = new GoogleApiClient.Builder(this)\n\
    \        .addOnCallbacks(this)\n        .addOnConnectionFailedListener(this)\n\
    \        .build();\n    myGoogleApiClient.connect();\n}\n```\n\nCode 9.9\n\nWhen\
    \ the required permissions are taken and Google api is ready, the app will start\
    \ tracking the current location inside the onConnected() method as follows:\n\n\
    ```java\npublic void onConnected(Bundle bundle) {\n    myLocationRequest = new\
    \ LocationRequest();\n    myLocationRequest.setInterval(1000);\n    myLocationRequest.setFastestInterval(1000);\n\
    \    myLocationRequest.setPriority(LocationRequest.PRIORITY_BALANCED_POWER_ACCURACY);\n\
    \    if (ContextCompat.checkPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)\
    \ ==\nPackageManager.PERMISSION_GRANTED) {\n        LocationServices.FusedLocationApi.requestLocationUpdates(myGoogleApiClient,\
    \ this);\n    }\n}\n```\n\nCode 9.10\n\nIn this code, the time intervals are shown\
    \ in milliseconds. Therefore, the location data is gathered in 1 second. If the\
    \ intervals get more frequent, the location data will be gathered but will drain\
    \ the battery faster. The setPriority() method is also used to manage the power\
    \ consumption. In this code, balanced power usage is selected.\n\nWhen the location\
    \ changes, the app will move the marker to the new location. This is done inside\
    \ the onLocationChanged() method:\n\n```java\npublic void onLocationChanged(Location\
    \ location) {\n    myLastLocation = location;\n    if (myCurrLocationMarker !=\
    \ null) {\n        myCurrLocationMarker.remove();\n    }\n\n    //Move the marker\n\
    \    LatLng latLng = new\n    LatLng(location.getLatitude(),\n    location.getLongitude());\n\
    \n    MarkerOptions markerOptions = new\n    MarkerOptions();\n    markerOptions.position(latLng);\n\
    \    markerOptions.title(\"My Position\");\n\n    markerOptions.icon(BitmapDescriptorFactory.defaultMarker(BitmapDescriptorFactory.HUE_MAGENTA));\n\
    \    myLocationMarker =\n    mMap.addMarker(markerOptions);\n\n    //Move the\
    \ map view\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(latLng)\n);\n}\n\
    ```\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomTo(11));\n\n//Stop\
    \ the updates\nif (myGoogleApiClient != null) {\n    LocationServices.FusedLocationApi.removeLocationUpdates(myGoogleApiClient,\
    \ this);\n}\n```\n\nCode 9.11\n"
  mdcn: "\n\n# ANDROID STUDIO 移动应用开发入门指南\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_167_0.png)\n\
    \n**图 9.9.** 选择要实现的的回调方法\n\n在实现这些方法后，MapsActivity.java 如下所示：\n\n```java\npackage\
    \ com.example.atomic.myapplication;\n\nimport android.location.Location;\nimport\
    \ android.location.LocationListener;\nimport android.support.annotation.NonNull;\n\
    import android.support.annotation.Nullable;\nimport android.support.v4.app.FragmentActivity;\n\
    ```\n\n```java\nimport android.os.Bundle;\n\nimport com.google.android.gms.common.ConnectionResult;\n\
    import com.google.android.gms.common.api.GoogleApiClient;\nimport com.google.android.gms.maps.CameraUpdateFactory;\n\
    import com.google.android.gms.maps.GoogleMap;\nimport com.google.android.gms.maps.OnMapReadyCallback;\n\
    import com.google.android.gms.maps.SupportMapFragment;\nimport com.google.android.gms.maps.model.LatLng;\n\
    import com.google.android.gms.maps.model.MarkerOptions;\n```\n\n```java\npublic\
    \ class MapsActivity extends FragmentActivity\nimplements OnMapReadyCallback,\n\
    \    GoogleApiClient.ConnectionCallbacks,\n    GoogleApiClient.OnConnectionFailedListener,\n\
    \    LocationListener() {\n\n    private GoogleMap mMap;\n\n    @Override\n  \
    \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_maps);\n        // 在 SupportMapFragment\
    \ 上获取并在\n        // 地图准备好使用时通知。\n        SupportMapFragment mapFragment =\n  \
    \          (SupportMapFragment) getSupportFragmentManager()\n            .findFragmentById(R.id.map);\n\
    \        mapFragment.getMapAsync(this);\n    }\n```\n\n```java\n/**\n * 在地图可用后对其进行操作。\n\
    \ * 当地图准备好\n * 使用时会触发此回调。\n * 在此处我们可以添加标记或线条、\n * 添加监听器或移动相机。在这种情况下，\n * 我们只是在澳大利亚悉尼附近添加一个标记。\n\
    \ * 如果设备上没有安装 Google Play 服务，\n * 用户将在 SupportMapFragment 内部\n * 提示安装它。此方法仅在用户安装\n\
    \ * Google Play 服务并返回后才会被触发\n```\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
    \ googleMap) {\n    mMap = googleMap;\n\n    // 在悉尼添加标记并移动相机\n    LatLng sydney\
    \ = new LatLng(-34, 151);\n    mMap.addMarker(MarkerOptions().position(sydney).title(\"\
    Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
    }\n\n@Override\npublic void onLocationChanged(Location location) {\n}\n\n@Override\n\
    public void onStatusChanged(String provider, int status, Bundle extras) {\n}\n\
    \n@Override\npublic void onMarkerEnabled(String provider) {\n}\n\n@Override\n\
    public void onProviderDisabled(String provider) {\n}\n\n@Override\npublic void\
    \ onConnected(@Nullable Bundle\nbundle) {\n\n    @Override\n    public void onConnectionSuspended(int\
    \ i) {\n\n    }\n\n    @Override\n    public void onConnectionFailed(@NonNull\
    \ ConnectionResult connectionResult) {\n\n    }\n}\n```\n\n## 9.6. 填充已实现的方法\n\n\
    让我们开始填充已实现的方法。首先，我们将按照所示声明代码中将使用的对象：\n\nLocation myLastLocation;\nLocationRequest\
    \ myLocationRequest;\nGoogleApiClient myGoogleApiClient;\nMarker myCurrLocationMarker;\n\
    \n代码 9.6（接上一页）\n\n在这些声明中，`myLastLocation` 保存位置信息本身。其余对象将分别负责管理位置请求、API 相关的进程以及显示当前位置的标记。\n\
    \n正如之前所学的，`onCreate()` 方法包含了 Activity 启动时要执行的任务。我们需要按照所示修改它，以检查跟踪权限并创建一个 `SupportMapFragment`\
    \ 对象，该对象将用于与用户界面 MapFragment 对象相关的操作：\n\n```java\nprotected void onCreate(Bundle\
    \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_maps);\n\
    }\n```\n\n```java\nif (android.os.Build.VERSION.SDK_INT >=\nBuild.VERSION_CODES.M)\
    \ {\n    checkLocationPermission();\n}\nSupportMapFragment mapFragment =\n(SupportMapFragment)\
    \ getSupportFragmentManager()\n    .findFragmentById(R.id.map);\n    mapFragment.getMapAsync(this);\n\
    ```\n\n代码 9.7（接上一页）\n\n下一个要修改的方法是 `onMapReady()` 方法。该方法处理地图可用后对其进行操作。在此方法中，应用将检查设备是否安装了\
    \ Google Play 服务，如果没有，应用将提示安装。请记住，如果没有安装 Google Play 服务，地图相关的函数将无法运行。我们按照如下方式执行：\n\
    \n```java\npublic void onMapReady(GoogleMap googleMap) {\n    mMap = googleMap;\n\
    \    mMap = googleMap; // 检查 Google Play 服务\n    if (android.os.Build.VERSION.SDK_INT\
    \ >=\nBuild.VERSION_CODES.M) {\n        if (ContextCompat.checkPermission(this,\
    \ Manifest.permission.ACCESS_FINE_LOCATION) ==\nPERMISSION_GRANTED) {\n      \
    \      mMap.MyLocationEnabled(true);\n        } else {\n            mMap.MyLocationEnabled(false);\n\
    \        }\n    }\n}\n```\n\n代码 9.8\n\n此方法使用的 Google API 如下方式构建：\n\n```java\n\
    protected synchronized void buildGoogleApiClient()\n{\n    myGoogleApiClient =\
    \ new GoogleApiClient.Builder(this)\n        .addOnCallbacks(this)\n        .addOnConnectionFailedListener(this)\n\
    \        .build();\n    myGoogleApiClient.connect();\n}\n```\n\n代码 9.9\n\n当获取权限且\
    \ Google API 准备就绪后，应用将在 `onConnected()` 方法中按照所示跟踪当前位置：\n\n```java\npublic void\
    \ onConnected(Bundle bundle) {\n    myLocationRequest = new LocationRequest();\n\
    \    myLocationRequest.setInterval(1000);\n    myLocationRequest.setFastestInterval(1000);\n\
    \    myLocationRequest.setPriority(LocationRequest.PRIORITY_BALANCED_POWER_ACCURACY);\n\
    \    if (ContextCompat.checkPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)\
    \ ==\nPERMISSION_GRANTED) {\n        LocationServices.FusedLocationApi.requestLocationUpdates(myGoogleApiClient,\
    \ this);\n    }\n}\n```\n\n在这段代码中，时间间隔以毫秒为单位。因此，每秒收集一次位置数据。如果间隔变得频繁，将收集更多位置数据，但会更快消耗电池。`setPriority()`\
    \ 方法也用于管理功耗。在这段代码中，选择了平衡功耗。\n\n当位置改变时，应用将标记移动到新位置。这是在 `onLocationChanged()` 方法中完成的：\n\
    \n```java\npublic void onLocationChanged(Location location) {\n    myLastLocation\
    \ = location;\n    if (myCurrLocationMarker != null) {\n        myCurrLocationMarker.remove();\n\
    \    }\n\n    // 移动标记\n    LatLng latLng = new\n    LatLng(location.getLatitude(),\n\
    \    location.getLongitude());\n\n    MarkerOptions markerOptions = new\n    MarkerOptions();\n\
    \    markerOptions.position(latLng);\n    markerOptions.title(\"My Position\"\
    );\n\n    markerOptions.icon(BitmapDescriptorFactory.defaultMarker(BitmapDescriptorFactory.HUE_MAGENTA));\n\
    \    myLocationMarker =\n    mMap.addMarker(markerOptions);\n\n    // 移动地图视图\n\
    \    mMap.moveCamera(CameraUpdateFactory.newLatLng(latLng)\n);\n}\n```\n\n```java\n\
    mMap.animateCamera(CameraUpdateFactory.zoomTo(11));\n\n// 停止更新\nif (myGoogleApiClient\
    \ != null) {\n    LocationServices.FusedLocationApi.removeLocationUpdates(myGoogleApiClient,\
    \ this);\n}\n```\n\n代码 9.11\n\n"
