    Code 9.4


    In this code snippet, we implemented these additional callbacks: LocationListener,
    GoogleApiClient.ConnectionCallback and GoogleApiClient.OnConnectionFailedListener.
    The functions of these callbacks are as follows:


    +   - LocationListener: Activated when the location changes.

    - GoogleApiClient.ConnectionCallback: Activated when the device''s connection
    status changes.

    - GoogleApiClient.OnConnectionFailedListener: Activated when the connection to
    the map data server fails.",


    When we add these callbacks in the class definition in MapsActivity.java, Android
    Studio gives errors in the callback definition lines. When we click on the red
