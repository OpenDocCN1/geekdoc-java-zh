    sendsms.example.com.sendsms\">\n\n  <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
    \ />\n  <uses-permission android:name=\"android.permission.SEND_SMS\" />\n\n \
    \ <application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
    \n    android:label=\"@string/app_name\"\n    android:supportsRtl=\"true\"\n \
    \   android:theme=\"@style/AppTheme\">\n    <activity android:name=\".MainActivity\"\
    >\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
    \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n\
    \      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n```\n\
    \n代码 10.2（接上一页）\n\n# 10.2 设计用户界面\n\n现在让我们设计用户界面。如图 10.1 所示，activity_main.xml 文件中的\
    \ `layout_width` 和 `layout_height` 默认设置为 `wrap_content`。这意味着按钮将仅覆盖内容区域。我们将 `layout_width`\
    \ 和 `layout_height` 设置为 `match_parent`。我们还将按钮 ID 设置为 SOS。\n\n# 第 10 章。安卓应用 S.O.S.\
    \ 信息发送器\n\n让我们更改按钮的背景颜色。为了这一点，首先点击如图 10.3 所示的“查看所有属性”按钮。在属性列表中，找到 `background`\
    \ 属性。\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_186_0.png)\n\n**图 10.1.** UI\
    \ 中的按钮\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_186_1.png)\n\n**图 10.2.** 设置按钮的尺寸\n\
    \n# Android Studio 移动应用开发入门\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_187_0.png)\n\
    \n图 10.3. 查看按钮的属性\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_187_1.png)\n\n图\
    \ 10.4. 右侧面板中显示的按钮的所有属性\n\n# 第 10 章。安卓应用 S.O.S. 信息发送器\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_188_0.png)\n\
    \n**图 10.5.** 设置按钮的背景颜色\n\n一个允许我们输入背景十六进制色的框将如下所示：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_188_1.png)\n\
    \n**图 10.6.** 设置按钮的尺寸\n\n# Android 移动应用开发入门\n\n在我看来，将 S.O.S. 按钮设置为红色是一个很好的选择，因此我在框中输入了\
    \ #FF0000 的十六进制代码。然而，这仅仅是个人选择，你可以输入任何喜欢的颜色。你可以在许多网站（如 http://www.color-hex.com/）找到颜色代码。输入颜色代码后，记得按下键盘上的回车键，然后按钮将更改如下所示：\n\
    \n# 10.3. 开发主代码\n\n我们现在已经完成了应用的简单 UI。现在让我们进入代码部分，这更有趣。\n"
