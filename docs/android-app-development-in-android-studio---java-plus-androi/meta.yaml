    ## 第 5 章 Android 应用 #1：红/蓝灯


    在我们的应用中，按钮控件的默认 ID 设置为 Android Studio **button**。我们可以通过点击 ID 框并替换 **button** 来更改它。


    接两个框指的是按钮控件的 **layout width**（布局宽度）和 **layout height**（布局高度）属性。它们的设置决定了 GUI 中按钮对象的宽度和高度。它们默认设置为
    **wrap_content**（包裹内容）。这意味着按钮的宽度高度将调整为包裹（覆盖）按钮内部的文本（即按钮标签）。这些参数的其他可用选择是 **match_parent**（匹配父布局），如图
    5.15 所示。如果选择此项，相应的属性（宽度或高度）将等于其父容器的宽度或高度（在本例中是覆盖整个屏幕的 GridLayout）。


