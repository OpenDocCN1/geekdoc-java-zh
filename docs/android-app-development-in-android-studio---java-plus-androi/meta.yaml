- md: "\n# BEGINNER'S GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO\n\nexample,\
    \ let's try to find the sum of numbers from 1 to 50. Without loops, what would\
    \ we do as follows:\n\n```java\nint sum = 0\nsum = sum + 1\nsum = sum + 2\nsum\
    \ = sum + 3\n// .... (44 more lines of code here)\nsum = sum + 48\nsum = sum +\
    \ 49\nsum = sum + 50\n```\nCode 4.20\n\nThere has to be 44 more lines of code\
    \ in the line shown by dots (shortened above). As you can see, this simple task\
    \ would require 51 lines of code without loops. Moreover, it's error prone. Please\
    \ remember that we want to perform things in programming with shortest code possible\
    \ to prevent errors.\n\nThere are three types of loops in Java: for loop, while\
    \ loop and do-while loop.\n\n1. for loop: We use for loops when we know how many\
    \ times an operation will be performed. The general structure of a for loop is\
    \ as follows:\n\n```java\nfor (type counter = initial value; counter check; counter\
    \ increment/decrement statement) {\n    Code to be performed repeatedly\n}\n```\n\
    Code 4.21\n\n- The counter is an integer variable.\n- The counter variable is\
    \ incremented or decremented to the expression in (counter increment/decrement\
    \ statement) after each cycle.\n- After each increment/decrement, the counter\
    \ is checked if the (counter check) is still satisfied. If it is satisfied, the\
    \ loop continues; if not satisfied, the loop ends.\n\n# CHAPTER 4. JAVA BASICS\n\
    \nLet’s calculate the sum of numbers from 1 to 50 using a for loop to understand\
    \ these better:\n\n```java\npackage com.helloworld.quantum.helloworld;\npublic\
    \ class JavaFor {\n    public static void main(String args[]) {\n        int sum\
    \ = 0;\n        for (int counter = 0; counter<=50; counter++) {\n            sum\
    \ = sum + counter;\n        }\n        System.out.println(\"Sum is \" + sum);\n\
    \    }\n}\n```\nCode 4.22\n\nIn this code, a variable sum is created to hold the\
    \ sum. A for loop is defined in which an integer variable named counter is created\
    \ and looped from 0 to 50. In the for loop, the loop variable is incremented by\
    \ 1 in each iteration by the expression counter++. Therefore, the counter variable\
    \ takes the values of 0, 1, 2, 3, ..., 50 as the loop continues to cycle. When\
    \ it takes the value 51, the loop condition counter<50, which means equal or lower\
    \ than 50, is not satisfied therefore the loop ends without performing the loop\
    \ operation for counter = 51.\n\nThe variable sum is initialized to 0 and then\
    \ the counter is added to the loop block by the expression: sum=sum+counter. This\
    \ method adds the numbers from 0 to 50 to the sum variable. In the end, the sum\
    \ variable is printed on the terminal screen as in Figure 4.21. The sum of the\
    \ numbers from 0 to 50 is calculated as 1275.\n\n# 2. while loop: while loops\
    \ can be used when we don’t know at which iteration the cycle will end. The main\
    \ difference of for and while loops is that the incrementing method of the loop\
    \ variable is specified inside the loop therefore it provides a bit more flexibility.\
    \ The calculation of the sum of numbers from 0 to 50 using a while loop is shown\
    \ in Code 4.23.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_71_0.png)\nFigure\
    \ 4.21. for loop example in Java\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
    public class JavaWhile {\n    public static void main(String args[]) {\n     \
    \   int sum = 0;\n        int counter = 0;\n        while (counter <= 50) {\n\
    \            sum = sum + counter;\n            counter++;\n        }\n       \
    \ System.out.println(\"Sum is \" + sum);\n    }\n}\n```\n\nAs you can see above,\
    \ the loop variable counter is defined before the while loop. The while loop checks\
    \ the condition counter<=50 is satisfied. When it is satisfied, the expressions\
    \ inside the while loop are executed, otherwise the while loop ends. The counter\
    \ variable is incremented inside the while loop by the expression counter++. The\
    \ output is again 1275 as shown in Figure 4.22.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_72_0.png)\n\
    Figure 4.22. while loop example in Java\n\n**do-while loop:** do-while performs\
