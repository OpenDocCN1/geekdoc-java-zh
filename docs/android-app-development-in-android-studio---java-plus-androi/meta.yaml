- md: "\n## Chapter 3\n\n## TEST DRIVE: THE HELLO WORLD APP\n\n### 3.1. General Procedure\
    \ for Developing an App\n\nA good method for testing the installation of a compiler\
    \ or a development environment is to try a “Hello World” example. It just displays\
    \ a text such as “Hello World” on the screen. OK, I know it is not an app that\
    \ you’d be proud of showing to your family or friends but uselessness stems from\
    \ testing whether your programming environment is working properly and to see\
    \ if you’re ready for real projects. In our very first Android project, we will\
    \ develop an app in which the “Hello, World!” text will be shown in the middle\
    \ of the device screen. We will test it on the emulator we created before; if\
    \ you have access to an Android device, you can test your “Hello World” app on\
    \ it too.\n\nI'd like to point out general steps of app development before setting\
    \ up for developing our first app:\n\n- 1. Creating an Android Studio project,\n\
    - 2. Setting up the User Interface (UI) of the app.\n- 3. Connecting the UI components\
    \ such as buttons, textboxes, etc. to the Java code,\n- 4. Coding in Java – the\
    \ actual programming language\n- 5. Building the project: this means creating\
    \ the executable (file that actually runs on device or the emulator). This is\
    \ not as difficult as it sounds; Android Studio does the entire job with a single\
    \ click,\n- 6. Trying the app on an emulator,\n- 7. Running the app on a real\
    \ Android device (optional),\n- 8. Publishing the app on Google Play (optional).\n\
    \n### 3.2. Creating a New Android Studio Project\n\nWhen we run Android Studio\
    \ for the first time, we are presented by the dialog shown in Figure 3.1 where\
    \ several options are available: i) Start a new Android Project, ii) Open an existing\
    \ project, iii) Check out a project from a version control website (like GitHub),\
    \ iv) Import a project created in a different development environment (like Eclipse)\
    \ or v) Import an Android code sample (where code samples are downloaded from\
    \ version control websites). We’ll develop our first Android project therefore\
    \ select the first option shown by the arrow in Figure 3.1.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_23_0.png)\n\
    \nFigure 3.1. Creating a new Android Studio project for our first app\n\nAfter\
    \ selecting to create a new project, a dialog box for entering the project settings\
    \ will appear in Figure 3.2. In the first textbox (shown by “1” in the figure),\
    \ we are required to enter the project name, which will also be the name of the\
    \ app. I entered “Hello World” but you can enter another name as you wish. The\
    \ company domain is given in the next textbox shown by “2”. This is a similar\
    \ string to a web address that is used to distinguish among developers in the\
    \ Google Play market. You can use any unique domain here. If you won’t upload\
    \ your app to Google Play (as in this example where we’re just developing for\
    \ the basics), you can use any domain you like. I used the one shown in the figure.\
    \ Then, we need to select the location on the computer to save the project files\
    \ (shown by “3”). You can select any place you like to save your project files.\n\
    \n![](img/5d944ea19245e0e2eac1ff6961a61518_24_0.png)\n\nFigure 3.2. New project\
    \ settings\n\nAfter clicking “Next”, the Target Android Devices window shown in\
    \ Figure 3.3 will appear. I selected the Phone and Tablet checkbox and then set\
    \ the Minimum SDK as API 15 – Android 4.0.3. This means that the app we’ll develop\
    \ will be able to run on devices having Android version 4.0.3 or higher. After\
    \ selecting the target, please click “Next”.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_25_0.png)\n\
    \nFigure 3.3. Selecting target devices\n\nThe template of the user interface is\
    \ selected in the following dialog. As you can see from Figure 3.4, there are\
    \ several templates including a login activity, maps activity, etc. However, since\
    \ our aim is just writing a text on the screen, it is OK to select the Empty Activity\
    \ as shown in Figure 3.4. So, what does an activity mean? Activities can be defined\
    \ as screens shown to the user with user interfaces. Therefore, we have to include\
    \ an activity to have an app as you know Android apps are visual programs that\
    \ have one or more user interfaces.\n\nAfter selecting the default activity, Android\
    \ Studio asks us to give names to the activity and the related layout file as\
    \ shown in Figure 3.5. Since we will have a single activity in this app, it is\
    \ perfectly OK to leave their names as defaults. When we click “Finish”, Android\
    \ Studio will create the project files and folders automatically (this may take\
    \ a while) and then the IDE will appear as in Figure 3.6.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_26_0.png)\n\
    \n# Figure 3.4. Adding an activity template to the app\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_26_1.png)\n\
    \n# Figure 3.5. Customizing the activity\n\n### 3.3. Main Sections \n\nAndroid\
    \ Studio is a sophisticated tool therefore it has dozens of properties to make\
    \ development easier. Instead of giving every detail at once, I prefer to explain\
    \ the sections way so that the reader can grasp the app by referring to Figure\
    \ 3.6.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_27_0.png)\n\nFigure 3.6. Basics\
    \ of Android Studio\n\nThe sections of Android Studio in the figure can be summarized\
    \ as follows:\n\n- 1. The project files and folders can be viewed here. In addition,\
    \ new files can be added from here.\n- 2. The active tab is shown in the middle\
    \ pane.\n- 3. This is the middle pane where the opened files can be changed.\n\
    - 4. This section is also controlled via tabs.\n- 5. The current compilation,\
    \ building or debugging processes are shown here.\n- 6. This is the **Run** button.\
    \ When we set up the user interface and write the Java code of a project, we click\
    \ this button to make Android Studio build the project (which means creating the\
    \ executable file from project files) and then we can run it on an emulator or\
    \ on a real device.\n\n### 3.4. Folder and File Structure of an Android Project\n\
    \nThe file structure of an Android project can be viewed in various forms in Android\
    \ Studio. The button just above the left pane (shown by the arrow) is used to\
    \ open the selection box for choosing the preferred method of viewing the hierarchy\
    \ as shown in Figure 3.7. The default file viewer is the “Android” mode which\
    \ is the easiest way of grouping files and folders in my opinion. When the selection\
    \ is the “Android” mode, the default files and folders shown in Figure 3.8 are\
    \ shown in the left pane. You can use the arrows (shown inside the circle in the\
    \ figure) for viewing the contents of folders.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_29_0.png)\n\
    \nFigure 3.7. Switching among different ways of viewing files and folders\n\n\
    The default folders (shown inside the rectangles in Figure 3.8) and their contents\
    \ are explained as follows:\n\n- 1. manifests folder: This folder has the AndroidManifest.xml\
    \ file inside. This file contains the configuration parameters of the project\
    \ such as permissions, services and additional libraries.\n- 2. java folder: The\
    \ source code files written in Java reside in this folder. You can see that the\
    \ java file of the activity named “MainActivity.java” is automatically created\
    \ in this folder.\n- 3. res folder: The resource files are contained in this folder.\
    \ Resources basically mean all needed files except the source code. For example,\
    \ if we want to include an mp3 file in our project, we place this file inside\
    \ the “res” folder.\n"
  mdcn: '


    ## 第 3 章


    ## 试运行：Hello World 应用


    ### 3.1. 开发应用的通用流程


    测试编译器或开发环境安装的一种良好方法是尝试运行“Hello World”示例。它只是在屏幕上显示如“Hello World”之类的文本。好的，我知道这不是一个让你愿意向家人或朋友展示的应用，但它的“无用”之处在于测试你的编程环境是否正常工作，并查看你是否准备好进行真实项目。在我们的第一个
    Android 项目中，我们将开发一个应用，其中“Hello, World!”文本将位于设备屏幕中央。我们将在之前创建的模拟器上对其进行测试；如果你有 Android
    设备，也可以在上面测试你的“Hello World”应用。


    在准备开发我们的第一个应用之前，我想指出应用阶段的通用步骤：


    - 1. 创建 Android Studio 项目，

    - 2. 设置应用的用户界面 (UI)。

    - 3. 将按钮、文本框等 UI 组件连接到 Java 代码，

    - 4. 使用 Java 进行编码 – 实际实际的编程语言

    - 5. 构建项目：这意味着创建可执行文件（实际上在设备或模拟器上运行的文件）。这听起来并不难；Android Studio 只需点击即可完成所有工作，

    - 6. 在模拟器上尝试应用，

    - 7. 在真实的 Android 设备上运行应用（可选），

    - 8. 在 Google Play 上发布应用（可选）。


    ### 3.2. 创建新的 Android Studio 项目


    当我们第一次运行 Android Studio 时，会看到图 3.1 所示的对话框，其中有几个可用选项：i) 启动一个新的 Android 项目，ii) 打开现有项目，iii)
    从版本控制网站（如 GitHub）检出项目，iv) 导入在不同开发环境（如 Eclipse）中创建的项目或 v) 导入 Android 代码示例（代码示例从版本控制网站下载）。由于我们要开发第一个
    Android 项目，因此我们将选择图 3.1 中箭头所示的第一个选项。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_23_0.png)


    图 3.1. 为我们的第一个应用创建新的 Android Studio 项目


    在选择创建新项目后，将出现图 3.2 所示的输入项目设置的对话框。在第一个文本框（图中用“1”所示）中，我们需要输入项目名称，这也是应用的名称。我输入了“Hello
    World”，但你可以根据意愿输入其他名称。公司域名在“2”所示的下一个文本框中。这是一个类似于网页地址的字符串，用于在 Google Play 市场中区分开发者。你可以在这里使用任何唯一的域名。如果你不将应用上传到
    Google Play（如本例所示，我们只是为了开发基础知识），可以使用任何你喜欢的域名。我使用了图中所示的。然后，我们需要在计算机上选择保存项目文件的位置（图中用“3”所示）。你可以选择任何你喜欢的地方来保存项目文件。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_24_0.png)


