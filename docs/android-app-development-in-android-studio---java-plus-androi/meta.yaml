    由于我们不希望按钮具有填充整个 GUI 的宽度或高度，因此我们需要让这些参数的值为 **wrap_content**。


    在我们的应用中，按钮旨在更改屏幕的背景颜色，因此相应地更改按钮的标签是很好的。按钮标签（按钮上的文本）默认为 **Button**。让我们将其更改为“Change!”，如图
