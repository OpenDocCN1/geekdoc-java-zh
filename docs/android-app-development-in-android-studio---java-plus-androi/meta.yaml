    **we’re telling a computer to do a task, then we have to do this in exact terms.**
    Let’s try to explain this by an example: imagine you had a tiring workday and
    going home with your stomach rumbling. While you’re on the way to M4 motorway,
    the traffic got crowded near Oxford and you had some time to think what you’ll
    have for the dinner. You suddenly remembered that there is frozen chicken korma
    in the fridge. You ring your wife (with hands–free of course!) and will ask her
    to cook that meal.


    You – Hi darling, hope you’re OK.


    Your wife – Thanks, a bit tired. You?


    You – Me too. And also very hungry. Could you please cook a frozen chicken korma
    for me? There should be some in the fridge. I’m sure you’ll also have one, I know
    you love it.


    Your partner – Yummy yummy. I’ll darling, be sizzling when you arrive. See you
    in a while, bye. (A caring wife!)


    You – Thanks darling, bye.'
