    \n图 9.11. 向模拟器发送自定义坐标\n\n# 第 10 章\n\n# 安卓应用 # 6：S.O.S. 消息发送器\n\n# 10.1. 引言\n\n\
    大多数安卓设备都具备 GSM 连接能力，因此学习 Android 中的 SMS 消息发送非常有用。名为 `SmsManager` 的类允许我们设计能够通过编程发送和接收\
    \ SMS 的应用。你将在本章看到如何使用这个类。\n\n我们将开发一个应用，通过 SMS 将当前位置发送给预定义的接收者。这个应用在沙漠遇到紧急情况，或者当你在迪厅喝醉了无法在消息字段中打字，需要将位置发送给朋友带你回家时，将非常有用。\n\
    \n# 10.1. 添加所需的权限\n\n首先，请创建一个标准的 Android 项目，包含一个空 Activity 目标 SDK 版本为 22 或低。我将我的项目命名为\
