    We have developed out drive app, “Hello World”, and learned


    - i) Creating an Android Studio project,

    - ii) Using user interfaces and widgets,

    - iii) Creating emulators,

    - iv) Building the app,

    - v) Running our app on the emulator,

    - vi) Running our app on a real device.


    But as you may have noticed, we didn’t have any interaction with our app. It just
    writes a text on the screen and that’s it. In order to make an app to do something,
    we need to program it. Java is the main programming language used for developing
    Android apps. We’ll learn the basics of Java in the next chapter which will enable
    us to transform our ideas to working Android apps. Let’s have a coffee break (a
    3-in1 coffee is recommended since we’ll need glucose) before starting our Java
    lecture.


    # CHAPTER 4

    ## JAVA BASICS


    ## 4.1. What is Java?


    We have developed our first app. That’s great. However, it just writes a text
    on the screen and that’s it. The user doesn’t have any interaction with our app.
    In order to make an app to be interactive and do something real, we need to tell
    it what to do. And we need to tell it exactly. We do this by using programming
    languages.


    As an old saying states: “Computers are actually rather stupid”. This is because:
    **we’re telling a computer to do a task, then we have to do this in exact terms.**
    Let’s try to explain this by an example: imagine you had a tiring workday and
    going home with your stomach rumbling. While you’re on the way to M4 motorway,
    the traffic got crowded near Oxford and you had some time to think what you’ll
    have for the dinner. You suddenly remembered that there is frozen chicken korma
    in the fridge. You ring your wife (with hands–free of course!) and will ask her
    to cook that meal.


    You – Hi darling, hope you’re OK.


    Your wife – Thanks, a bit tired. You?


    You – Me too. And also very hungry. Could you please cook a frozen chicken korma
    for me? There should be some in the fridge. I’m sure you’ll also have one, I know
    you love it.


    Your partner – Yummy yummy. I’ll darling, be sizzling when you arrive. See you
    in a while, bye. (A caring wife!)


    You – Thanks darling, bye.


    ## BEGINNER GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    Then, she''ll find the frozen korma wherever it is in the fridge, unpack it, remove
    the sleeve and pierce film lid in several places. Set the timer, power on the
    microwave (or oven) and cook it. She''ll cook the included pilau rice without
    a need to ask you. That''s However, if you had a robot wife with a computer brain,
    the dialog would be more like this:


    You – Hi darling, you''re OK.


    Robot wife – Tired. You OK? (not in a romantic tone!)


    You – Very tired. And very hungry. Could you please frozen chicken korma for me?
    There should be some in the fridge.


    Robot wife – Where is the frozen korma in fridge, do you want to cook pilau rice
    too? Do you want them normal or overcooked? Do you want a garlic bread too? When
    do you want it to be ready?....


    You – Stop, stop please. I''ll drive to a restaurant.


    Robot wife – I don''t understand, you are no nonsense....


    Well, any programmable digital device is more or less the same. **We have to tell
    exact things to them.** Because of these reasons, in order to learn Android development,
    we have to grasp Java programming language. After learning Java, we''ll use Android
    libraries and develop Android apps.


    ## 4.2. Using Android Studio for Java


    First of all, we need to launch Android Studio and create an Android project as
    we did in the previous chapter. We can name the project as we want and select
    any Android version and screen layout for now. When the project loads, the project
    files and folders will be like the following in the left pane of Android Studio:


    ![](img/5d944ea19245e0e2eac1ff6961a61518_46_0.png)


    Figure 4.1. Default file structure of a new Android project


    We''ll create a new Java file in order to try Java codes. For this, right click
    on one of the java folders such as com.example.javabasics1 in the above figure
    (or another Java folder in the project you created, your folder names will be
    different because your project name is different) and then Select New Java Class
    as shown in Figure 4.2.


    ## BEGINNER''S GUIDE TO MOBILE APP DEVELOPMENT IN ANDRIOD STUDIO


    ![](img/5d944ea19245e0e2eac1ff6961a61518_47_0.png)


    In Java, all programs are classes before we create a new Java Class. (We''ll learn
    classes later in this chapter.) Please name the new class without spaces and special
    characters (I named it JavaBasics) and then click “OK” as shown below:


    ![](img/5d944ea19245e0e2eac1ff6961a61518_47_1.png)


    Figure 4.2. Creating a new Java Class


