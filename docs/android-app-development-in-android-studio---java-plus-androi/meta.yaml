    \ file. The default google_maps_api.xml is as follows:\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_160_0.png)\n\
    \nFigure 9.3. google_maps_api.xml file\n\n```xml\n<resources>\n<!--\nTODO: Before\
    \ you run your application, you need a\nGoogle Maps API key.\n\nTo get one, follow\
    \ this link, follow the directions\nand press \"Create\" at the end:\n\nhttps://console.developers.google.com/flows/enable-api\n\
    ?apiid=maps_android_backend&keyType=CLIENT_SIDE_ANDROIDID&rF=72:42:43:B5:F0:19:50:79:4B:EC:69:D2:1A:27:30:7D:E4:44:47:EC:6D:3bcm.example.myapplication\n\
    \n<string name=\"google_maps_key\"\ntemplateMergeStrategy=\"preserve\"\ntranslatable=\"\
    false\">YOUR_KEY_HERE</string>\n</resources>\n```\n\n# BEGINNER'S GUIDE TO MOBILE\
    \ APP DEVELOPMENT IN ANDROID STUDIO\n\nWe have to enter the api key to the place\
    \ indicated by YOUR_KEY_HERE in the file above. So, where should we obtain this\
    \ key? We just need to go to the website indicated in our google_maps_api.xml\
    \ file which starts with https://console.developers.com. When we navigate to this\
    \ site, we need to select Create a new project and hit Continue as follows:\n\n\
    ![](img/5d944ea19245e0e2eac1ff6961a61518_161_0.png)\n\n**Figure 9.4.** Creating\
    \ a new project to obtain a new api key for the maps app\n\nIn the next dialog,\
    \ please hit the **Create API Key**:\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_161_1.png)\n\
    \n**Figure 9.5.** Creating the api key\n\nGoogle console will then display the\
    \ generated api key as shown below:\n\n# CHAPTER 9. ANDROID APP #5: SHOW MY LOCATION\n\
    \nCredentials\n\n| API key |\n| :--- |\n| This API key can be used in this project\
    \ and with any API that supports it. To use this key in your application, pass\
    \ it with the key=API_KEY_parameter. |\n| Creation date | 21 Jan 2017, 21:02:13\
    \ |\n| Created | @gmail.com (you) |\n| API key | AIzaSyBICCm62mCYYhXVFd4 |\n\n\
    # Figure 9.6. The generated api key\n\nPlease copy the generated api key and paste\
    \ it to the place indicated in the google_maps_api.xml file:\n\n```xml\n<resources>\n\
    \nTODO: Before you run your application, you need a\nGoogle Maps API key.\n\n\
    To get one, follow this link, follow the directions\nand press \"Create\" at the\
    \ end:\n\nhttps://console.developers.google.com/flows/enable-api\n?maps_android_backend&keyType=CLIENT_SIDE_ANDROIDID&rF=77:42:43:B5:F0:19:50:79:4E:0E:69:2D:2A:27:30:7D:\n\
    E4:47:6D&3Bcom.example.atomic.myapplication\n\n<string name=\"google_maps_key\"\
    \ntemplateMergeStrategy=\"preserve\"\ntranslatable=\"false\">AIzaSyBICCm62mCYYhXVFfedpcdppxxxxxx\n\
    xxxx</string>\n</resources>\n```\n\nCode 9.2\n\nPlease note that you need to generate\
    \ and paste your own key otherwise the app won't work.\n\n# BEGINNER GUIDE TO\
    \ MOBILE APP DEVELOPMENT IN ANDROID STUDIO\n\n## 9.3. The Default MapsActivity.java\
    \ File\n\nLet's now view the automatically generated MapsActivity.java file where\
    \ we'll write the main code:\n\n```java\npackage com.example.atomic.myapplication;\n\
    import android.support.v4.app.FragmentActivity;\nimport android.os.Bundle;\nimport\
    \ com.google.android.gms.maps.CameraUpdateFactory;\nimport com.google.android.gms.maps.GoogleMap;\n\
    import com.google.android.gms.maps.OnMapReadyCallback;\nimport com.google.android.gms.maps.SupportMapFragment;\n\
    import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
    \npublic class MapsActivity extends AppCompatActivity\nimplements OnMapReadyCallback\
    \ {\n\n    private GoogleMap mMap;\n\n    @Override\n    protected void onCreate(Bundle\
    \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n       \
    \ setContentView(R.layout.activity_maps);\n        // Obtain the SupportMapFragment\
    \ and get\n        // notified when the map is ready to be used.\n        SupportMapFragment\
    \ mapFragment = (SupportMapFragment) getSupportFragmentManager().findFragmentById(R.id.map);\n\
    \        mapFragment.getAsync(this);\n    }\n\n    /**\n     * Manipulates the\
    \ map once available.\n     * This callback is triggered when the map is ready\
    \ to be used.\n     * This is where we can add markers or lines, add listeners\
    \ or move the camera. In this case,\n     * we just add a marker near Sydney,\
    \ Australia.\n     */\n```\n\n# CHAPTER 9. ANDROID APP #5: SHOW MY LOCATION\n\n\
    - If Google Play services is not installed on the device, the user will be prompted\
    \ to install\n- it inside the SupportMapFragment. This method will only be triggered\
    \ once the user has\n- installed Google Play services and returned to the app.\n\
    \n```java\n@Override\npublic void onMapReady(GoogleMap googleMap) {\n    mMap\
    \ = googleMap;\n\n    // Add a marker in Sydney and move the camera\n    LatLng\
    \ sydney = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
    Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
    }\n```\n\nCode 9.3 (cont.)\n\nIn this code, mapFragment.getAsync(this) adds the\
    \ map component. LatLng sydney = new LatLng(-34, 151) declares the coordinates\
    \ of Sydney. mMap.addMarker(new MarkerOptions().position(sydney).title(\"Marker\
    \ in Sydney\")) places the marker on Sydney. mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney))\
    \ moves the camera to this point.\n\n## 9.4. Running the App for the First Time\n\
    \nWe're now ready to try the current state of the app. Please hit Run in Android\
    \ Studio and then you should see our app in the emulator as shown in Figure 9.7.\n\
    \nIf you see the map with the marker, congratulations. If you cannot see the map,\
    \ please check the api key above. Most errors are caused from a wrong api key\
    \ unless there’s another error indicated by the gradle system.\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_165_0.png)\n\
    \nFigure 9.7. Current state of our app\n\n## 9.5. Implementing the Required Callbacks\n\
    \nWe now need to take data from the GPS receiver and then show our current location\
    \ on the map rather than the default marker. For this, we first implement the\
    \ required callbacks in the main class definition as follows:\n\n```java\npublic\
    \ class MapsActivity extends FragmentActivity\nimplements OnMapReadyCallback,\
    \ LocationListener,\nGoogleApiClient.ConnectionCallbacks,\nGoogleApiClient.OnConnectionFailedListener\n\
    ```\n\nWhen we add these callbacks in the class definition in MapsActivity.java,\
    \ Android Studio gives errors in the callback definition lines. When we click\
    \ on the red bulb, the option Implement methods should be selected as follows:\n\
    \n```\npublic class MapsActivity extends FragmentActivity implements OnMapReadyCallback,\
    \ GoogleApiClient.ConnectionCallbacks, GoogleApiClient.OnConnectionFailedListener\n\
    - implement methods\n- Make MapsActivity() abstract\n- Add on demand static info\
    \ for 'com.google.android.gms.com.api.GoogleApiClient'\n- Create Test\n- Create\
    \ subclass\n- Insert Indexing API Code\n- Unimplement Interface\n- Make package-local\n\
    ```\n\nFigure 9.8. Selecting Implement methods for correcting the callbacks\n"
  mdcn: "\n\n## 9.2. 创建并添加 Api Key\n\n为了使用 Google Maps，我们需要将 api（应用程序接口）密钥输入到 `google_maps_api.xml`\
    \ 文件中。默认的 `google_maps_api.xml` 如下：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_160_0.png)\n\
    \n图 9.3. google_maps_api.xml 文件\n\n```xml\n<resources>\n<!--\nTODO: 在运行你的应用程序之前，你需要一个\n\
    Google Maps API key。\n\n要获取密钥，请点击此链接，按照指示操作\n并在最后点击“Create（创建）：\n\nhttps://console.developers.google.com/flows/enable-api\n\
    ?apiid=maps_android_backend&keyType=CLIENT_SIDE_ANDROIDID&rF=72:42:43:B5:F0:19:50:79:4B:EC:69:D2:1A:27:30:7D:E4:44:47:EC:6D:3bcm.example.myapplication\n\
    \n<string name=\"google_maps_key\"\ntemplateMergeStrategy=\"preserve\"\ntranslatable=\"\
    false\">YOUR_KEY_HERE</string>\n</resources>\n```\n\n# ANDROID STUDIO 移动应用开发初学者指南\n\
    \n我们必须在上方文件中 `YOUR_KEY_HERE` 所在的位置输入 api 密钥。那么，我们应该从哪里获取这个密钥呢？我们只需要访问 `google_maps_api.xml`\
    \ 文件中指定的网站，该网址以 `https://console.developers.com` 开头。当我们导航到该网站时，我们需要选择“Create a\
    \ new project（创建新项目）”并如所示点击 Continue（继续）：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_161_0.png)\n\
    \n**图 9.4.** 创建新项目以获取地图应用所需的新 api key\n\n在下一个对话框中，请点击 **Create API Key（创建 API\
    \ 密钥）**：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_161_1.png)\n\n**图 9.5.**\
    \ 创建 api 密钥\n\nGoogle 控制台随后将按所示显示生成的 api 密钥：\n\n# 第 9 章. ANDROID 应用 #5：显示我的位置\n\
    \n凭据\n\n| API key |\n| :--- |\n| 此 API 密钥可用于此项目以及任何支持它的 API。要在你的应用程序中使用此密钥，请通过\
    \ `key=API_KEY_parameter` 参数传递它。 |\n| 创建日期 | 2017年1月21日，21:02:13 |\n| 创建者 | @gmail.com（你）\
    \ |\n| API key | AIzaSyBICCm62mCYYhXVFd4 |\n\n# 图 9.6. 生成的 api 密钥\n\n请复制生成的 api\
    \ 密钥并将其粘贴到 `google_maps_api.xml` 文件中指定的位置：\n\n```xml\n<resources>\n\nTODO: 在运行你的应用程序之前，你需要一个\n\
    Google Maps API key。\n\n要获取密钥，请点击此链接，按照指示操作\n并在最后点击“Create（创建）：\n\nhttps://console.developers.google.com/flows/enable-api\n\
    ?maps_android_backend&keyType=CLIENT_SIDE_ANDROIDID&rF=77:42:43:B5:F0:19:50:79:4E:0E:69:2D:2A:27:30:7D:\n\
    E4:47:6D&3Bcom.example.atomic.myapplication\n\n<string name=\"google_maps_key\"\
    \ntemplateMergeStrategy=\"preserve\"\ntranslatable=\"false\">AIzaSyBICCm62mCYYhXVFd4</string>\n\
    </resources>\n```\n\n9.2 代码\n\n请复制生成的 api 密钥并将其粘贴到 `google_maps_api.xml` 文件中指定的位置：\n\
    \n注意，在运行应用程序之前，你需要一个密钥 密钥才能工作。\n\n# ANDROID STUDIO 移动应用开发初学者指南\n\n## 9.3. 默认 MapsActivity.java\n\
    \n编写主代码：\n\n```java\npackage com.example.atomic;\nimport android.support.v4.app.FragmentActivity;\n\
    import android.os.Bundle;\nimport com.google.android.gms.maps.CameraUpdateFactory;\n\
    import com.google.android.gms.maps.GoogleMap;\nimport com.google.android.gms.maps.OnReadyCallback;\n\
    import com.google.android.gms.maps.SupportMapFragment;\nimport com.google.android.gms.maps.model.LatLng;\n\
    import com.google.android.gms.maps.model.MarkerOptions;\n\npublic class MapsActivity\
    \ extends AppCompatActivity\nimplements OnReadyCallback {\n\n    private GoogleMap\
    \ mMap;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
    \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_maps);\n\
    \        // 获取 SupportMapFragment\n        SupportMapFragment mapFragment = (SupportMapFragment)\
    \ getSupportFragmentManager().findFragmentById(R.id.map);\n        // 当地图准备就绪时触发此回调方法。\n\
    \        // 在这里我们可以添加标记、线条或移动相机。\n    }\n\n    @Override\n    public void onMapReady(GoogleMap\
    \ googleMap) {\n        mMap = googleMap;\n\n        // 在悉尼添加标记\n        LatLng\
    \ sydney = new LatLng(-34, 151);\n        mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
    Sydney\"));\n    }\n}\n```\n\n## 9.4. 首次运行应用程序\n\n```java\n\n# 第 9 章. ANDROID\
    \ 应用 #5：显示我的位置\n\n- 如果设备上未安装 Google Play 服务，将提示用户安装它。此方法只有在地图准备就绪后才会触发。\n\n```java\n\
    @Override\npublic void onMapReady(GoogleMap googleMap) {\n    mMap = googleMap;\n\
    \n    // 在悉尼添加标记\n    LatLng sydney = new LatLng(-34, 151);\n    mMap.addMarker(new\
    \ MarkerOptions().position(sydney).title(\"Sydney\"));\n}\n```\n\n9.3 代码（续）\n\n\
    在此代码中，`mapFragment.getAsync(this)` 添加了地图。`LatLng sydney = new LatLng(-34, 151)`\
    \ 声明了悉尼的坐标。`mMap.addMarker(new MarkerOptions().position(sydney).title(\"Sydney\"\
    ))` 在地图上放置标记。`mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney))` 将相机移动到该点。\n\
    \n## 9.5. 实现所需的回调\n\n现在我们需要从 GPS 接收器获取数据，然后在地图上显示我们的当前位置而不是默认标记。为此，我们首先在主类定义中实现所需的回调：\n\
    \n```java\npublic class MapsActivity extends FragmentActivity\nimplements OnMapReadyCallback,\
    \ LocationListener,\nGoogleApiClient.ConnectionCallbacks,\nGoogleApiClient.OnConnectionFailedListener\n\
    ```\n\n当我们在 MapsActivity.java 类定义中添加这些回调时，Android Studio 在回调定义行处报错。当我们点击红色灯泡时，应选择“Implement\
    \ methods（实现方法）”选项，如下：\n\n```\npublic class MapsActivity extends FragmentActivity\
    \ implements OnMapReadyCallback, GoogleApiClient.ConnectionCallbacks, GoogleApiClient.OnConnectionFailedListener\n\
    - implement methods\n- Make MapsActivity() abstract\n- Add on demand static info\
    \ for 'com.google.android.gms.com.api.GoogleApiClient'\n- Create Test\n- Create\
    \ subclass\n- Insert Indexing API Code\n- Unimplement Interface\n- Make package-local\n\
    ```\n\n图 9.8. 为修正回调选择实现方法\n\n"
