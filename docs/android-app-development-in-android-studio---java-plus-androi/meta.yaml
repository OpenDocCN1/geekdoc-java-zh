    # BEGINNER’S GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    ## Chapter 1


    ## INTRODUCTION


    Welcome to your guide to Android™ app development!


    This book aims to teach the basics of Android app development in Android Studio
    using Java programming language. I assume that you don''t have any Java® or Android
    programming experience at the start of this book. I am going to explain every
    bit of app development in simple terms. You''ll start from scratch and will be
    able to convert your ideas to your own apps after completing this book. A single
    book obviously cannot make you the best expert on a platform or programming language
    however you''ll have a solid background and hands-on experience on Android app
    development with this book.


    Android apps have been developed using Eclipse integrated development environment
    (IDE) with Android Development Tools (ADT) plugin in the past. However, Google
    introduced Android Studio as the official IDE for Android app development in 2014
    and this IDE became the standard. The latest stable release is Android Studio
    2.2, which will be used in this book.


    Let''s overview the fundamentals of Android operating system and the related concepts
    before starting our programming journey.


    ## 1.1. The Android Operating System


    Android is an open-source mobile operating system. It is a variant of Linux hence
    providing extensive security, modularity and productivity at the mobile device
    level. Android is developed and maintained by the organization called “Open Handset
    Alliance” (OHA). OHA was established in 2007 with Google being its foremost member.
    OHA includes a lot of prominent hardware and software companies.


    Originally, Android was created by a company called Android Inc. Google acquired
    this company in 2005. After then, Google made it open-source and Android gained
    a big momentum. Android has the market share of around 85% in 2016 as shown in
    Figure 1.1 (data source: http://www.idc.com/). Considering this market share,
    it is obviously rewarding to invest in Android app development.


    ![](img/5d944ea19245e0e2eac1ff6961a61518_9_0.png)


    **Figure 1.1.** Market shares of mobile operating systems between 2015-Q4 and
    2016-Q3


    Android has seven major releases each having several revisions. In order to follow
    these versions earlier, developers name them with cookie names. The popular versions
    of Android are Kitkat (Android 4.4), Lollipop (Android 5.1) and Marshmallow (Android
    6.0) (https://www.statista.com/statistics/271774/share-of-android-platforms-on-mobile-devices-android-os/).
    Nougat (Android 7.0) is also gaining popularity. Android becomes more capable
    as the version goes up. However, we have to be careful about selecting the version
    during app development because not every device uses the latest version. If we
    develop an app for the Lollipop, it may not run on a device which has Froyo installed.
    Fortunately, Android Studio enables us to select the compatibility.


    Android is utilized not only in smartphones but also in tablets, netbooks, digital
    television boxes, handheld game devices and even in single board computers such
    as UDOO. Therefore we first need to select the target device(s) and version(s)
    before developing an app.


    ## 1.2. How do Android Apps Work?


    There are different ways the programs run on various platforms. The lowest level
    software can be written in machine code that runs directly on the microprocessor.
    This is shown in Figure 1.2. Since it is difficult to develop complex applications
    in machine code, operating systems provide a communication and control layer between
    the application software and the hardware as shown in Figure 1.3. If we want to
    develop a native application for running on a specific hardware/operating system,
    we have to do this using a compiler and linker. Compiler and linker takes the
    source code and creates the executable file that actually runs on the operating
    system as shown in Figure 1.4. For example, if we want to develop an application
    in C++ programming language, we have to utilize the compilation/linking process.


    ![](img/5d944ea19245e0e2eac1ff6961a61518_10_0.png)


    Figure 1.2. Machine code – hardware relation


    The main advantage of native applications is their speed. However, the disadvantage
    is the incompatibility across different platforms. For example, we cannot run
    a native Windows application on Ubuntu and vice versa. Virtual machine concept
    is developed to overcome this limitation. Virtual machine is software that runs
    on the operating system and provides an abstraction to the developer as shown
    in Figure 1.5. The application software runs on top of the virtual machine.


    ![](img/5d944ea19245e0e2eac1ff6961a61518_11_0.png)


    **Figure 1.3.** Operating system layer between the hardware and the app


    ![](img/5d944ea19245e0e2eac1ff6961a61518_11_1.png)


    **Figure 1.4.** Creating a native executable from the source code


    Therefore, as long as a computer has the virtual machine running, the application
    software can run on that computer independent of the hardware and the operating
    system. A good example is the Java Virtual Machine (JVM), JVM runs on almost all
    operating systems and platforms. Therefore, when we develop Java software, it
    will be run on the JVM independent of the operating system/platform.


    The obvious advantage of developing apps that run on virtual machines can then
    be stated as “develop once and run anywhere”. However, applications on virtual
    machines are slower than native apps.


    General development of virtual machine is summarized in Figure 1.6.


    ![](img/5d944ea19245e0e2eac1ff6961a61518_12_0.png)


    **Figure 1.5.** Virtual machine between the app and the operating system


    ![](img/5d944ea19245e0e2eac1ff6961a61518_12_1.png)


    **Figure 1.6.** Creating intermediate code from the source code


    Similar to Java applications, Android applications also run on JVM. There are
    two virtual machines used in Android: Dalvik Virtual Machine (DVM) and Android
    Runtime (ART). These are specialized JVMs which can run on low resources. DVM
    has been the default runtime until the Lollipop release. ART is introduced by
    Android 5.0 and has been the default since then. DVM and ART basically do the
    same job: running Android apps independent of platform. The main advantage of
    ART over DVM is the utilization of a concept called Ahead of Time (AOT) compilation
    instead of Just in Time (JIT) approach. In AOT, apps are compiled during installation
    hence they load faster with lower CPU usage. On the other hand, JIT compilation
    provides lower storage consumption with relatively longer loading times.


    ## 1.3. Programming Languages Used For Developing Apps


    The recommended and convenient way of developing Android apps is using Java programming
    language. Although Java is a general purpose tool, it is used in conjunction with
    Android Software Development Kit (SDK) in Android Studio to develop apps. Another
    official way is using C++ with the Native Development Kit (NDK). This option is
    used for developing apps with low level instructions such as timing sensitive
    drivers. With C++ and NDK, we can directly run the app on the Android kernel increasing
    efficiency in code length and development cost. There also exist third-party tools
    like Xamarin, Cordova and React Native.


    We''ll use the standard and official way of developing Android apps: Java with
    Android SDK and we''ll use Android Studio Integrated Development Environment (IDE)
    for this job. You don''t need to know Java to start following this book because
    the basics of Java are also explained in Chapter 4.

