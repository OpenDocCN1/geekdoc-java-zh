    \ onStatusChanged(String s, int i,\nBundle bundle) {\n}\n\n@Override\npublic void\
    \ onProviderEnabled(String s) {\n  Toast.makeText(getApplicationContext(), \"\
    GPS Enabled!\", Toast.LENGTH_LONG).show();\n}\n\n@Override\npublic void onProviderDisabled(String\
    \ s) {\n  Toast.makeText(getApplicationContext(),\n  \"Please enable GPS!\", Toast.LENGTH_LONG).show();\n\
    }\n```\n\n10.11 (cont’d from the previous pages)\n\n# 10.4. Building and Running\
    \ the App\n\nSince this app uses SMS functionality, it needs a GSM connection\
    \ therefore it cannot be simulated in an emulator. Please connect a real Android\
    \ device to your computer and select it for running this app after hitting the\
    \ Run button in Android Studio as follows:"
  - '[PAGE 198]


    # CHAPTER 10. ANDRIOD APP #6: S.O.S. MESSAGE SENDER


    ![](img/5d944ea19245e0e2eac1ff6961a61518_198_0.png)


    **Figure 10.11.** Selecting a real Android device with GSM functionality


    When the app starts, please wait a moment to see the **READY TO SEND!** message
    on the screen and then if you click on the giant **S.O.S.** button, the phone
    will send your current location to the hardcoded phone number. In the receiving
    phone, you''ll see a text such as **Please take me from longitude: -1.985401 and
    latitude 52.397618.** The coordinates will obviously be different depending on
    your location.


    It is again worth noting that you can download the complete project files, images,
    etc. from the book’s companion website: [www.android-java.website](http://www.android-java.website).'
  - '[PAGE 199]


    <!-- no content -->'
  - '[PAGE 200]


    # EPILOGUE AND FUTURE WORK


    I really hope that you enjoyed this book and got some confidence for developing
    Android apps. If you would like to share your complaints and suggestions, please
