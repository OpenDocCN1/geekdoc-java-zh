  md: '# # Chapter 4


    # JAVA BASICS


    # ## 4.1. What is Java?


    We have developed our first app. That’s great. However, it just writes a text
    on the screen and that’s it. The user doesn’t have any interaction with our app.
    In order to make an app to be interactive and do something real, we need to tell
    it what to do. And we need to tell it exactly. We do this by using programming
    languages.


    As an old saying states: “Computers are actually rather stupid”. This is because:
    **we’re telling a computer to do a task, then we have to do this in exact terms.**
    Let’s try to explain this by an example: imagine you had a tiring workday and
    going home with your stomach rumbling. While you’re on the way to M4 motorway,
    the traffic got crowded near Oxford and you had some time to think what you’ll
    have for the dinner. You suddenly remembered that there is frozen chicken korma
    in the fridge. You ring your wife (with hands–free of course!) and will ask her
    to cook that meal.


    You – Hi darling, hope you’re OK.


    Your wife – Thanks, a bit tired. You?


    You – Me too. And also very hungry. Could you please cook a frozen chicken korma
    for me? There should be some in the fridge. I’m sure you’ll also have one, I know
    you love it.


    Your partner – Yummy yummy. I’ll darling, be sizzling when you arrive. See you
    in a while, bye. (A caring wife!)


    You – Thanks darling, bye.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# BEGINNER GUIDE TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO


    Then, she''ll find the frozen korma wherever it is in the fridge, unpack it, remove
    the sleeve and pierce film lid in several places. Set the timer, power on the
    microwave (or oven) and cook it. She''ll cook the included pilau rice without
    a need to ask you. That''s However, if you had a robot wife with a computer brain,
    the dialog would be more like this:


    You – Hi darling, you''re OK.


    Robot wife – Tired. You OK? (not in a romantic tone!)


    You – Very tired. And very hungry. Could you please frozen chicken korma for me?
    There should be some in the fridge.


    Robot wife – Where is the frozen korma in fridge, do you want to cook pilau rice
    too? Do you want them normal or overcooked? Do you want a garlic bread too? When
    do you want it to be ready?....


    You – Stop, stop please. I''ll drive to a restaurant.


    Robot wife – I don''t understand, you are no nonsense....


    Well, any programmable digital device is more or less the same. **We have to tell
    exact things to them.** We do this by using programming languages. There are a
    lot of different programming languages used to develop software for different
    platforms. You can check the widely used programming languages and their rankings
    at the TIOBE index website: http://www.tioobe.com/tioobe-index/. It is sometimes
    to choose which programming language to use. There is not a universally excellent/complete
    programming language; they have strong and weak sides.


    When we check the TIOBE index, we see that Java is consistently the most used
