    \n![](img/5d944ea19245e0e2eac1ff6961a61518_63_0.png)\n\n我们的下一个小节是关于 Java 中的逻辑决策结构，让我们休息喝一下咖啡，然后继续学习\
    \ if-else 和 switch-case 语句。\n\n## 4.4. Java 中的逻辑决策语句\n\n决策在编程中和日常生活问题中一样被广泛使用。我们在日常生活中经常做出逻辑决策，例如：\n\
    \n- “如果他们的咖啡很好喝，我就再来一个，否则我就去买茶”\n- “如果下雨了我就带伞，否则我就不带”。\n\n在编程语言中，决策语句控制现实生活中是否满足某个条件。Java\
    \ 中有两种决策语句：if–else 和 switch–case 块。\n\n**If-else 结构：** 在此条件判断中，如果满足条件，则执行 **if\
