- md: "\n## CHAPTER 10. ANDROID APP: S.O.S. MESSAGE SENDER\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_190_0.png)\n\
    Figure 10.8. Switching back to common properties\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_190_1.png)\n\
    Figure 10.9. Setting the text size and type\n\n## BEGINNER'S GUIDE TO MOBILE APP\
    \ DEVELOPMENT IN ANDROID STUDIO\n\nThe app will take longitude and latitude data\
    \ from the GPS receiver. This data is a floating point number, therefore let's\
    \ declare two double variables to hold the location data as:\n\n```java\ndouble\
    \ latitude = 0;\ndouble longitude = 0;\n```\n\nLet's define a GPSReceiver class\
    \ to manage the GPS part with the LocationListener implementation as we did in\
    \ the previous chapter:\n\n```java\npublic class GPSReceiver implements LocationListener\n\
    {}\n```\n\nAndroid Studio will warn us for implementing the required methods at\
    \ this point:\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_191_0.png)\n**Figure\
    \ 10.10.** The required methods for the LocationListener\n\n## CHAPTER 10. ANDROID\
    \ APP #6: S.O.S. MESSAGE SENDER\n\nHit OK in this dialog and the methods onChanged(),\
    \ onStatus(), onProviderEnabled() and onProviderDisabled() will be added to the\
    \ MainActivity.java. onStatusChanged() is called when a change in the location\
    \ occurs. Similarly, onProviderEnabled() and onProviderDisabled() methods are\
    \ called when the GPS receiver is enabled and disabled, respectively. onStatusChanged()\
    \ is called if the GPS status is changed.\n\nWe can populate the onProviderEnabled()\
    \ and onProviderDisabled() methods as follows:\n\n```java\n@Override\npublic void\
    \ onProviderEnabled(String s) {\n    Toast.makeText(getApplicationContext(), \"\
    GPS Enabled!\", Toast.LENGTH_LONG).show();\n}\n\n@Override\npublic void onProviderDisabled(String\
    \ s) {\n    Toast.makeText(getApplicationContext(), \"Please enable GPS!\", Toast.LENGTH_LONG).show();\n\
    }\n```\nCode 10.5\n\nThe Toast class is used to show a temporary message on the\
    \ screen. Therefore, if the GPS is disabled, it will display \"Please enable GPS!\"\
    \ whereas the GPS is enabled by the user, it will inform that \"GPS is enabled!\"\
    .\n\nThe actual location receiving happens inside the onChanged() method. Firstly,\
    \ let's define a location object which will hold the location data just after\
    \ the longitude and latitude variable declarations as follows:\n\n```java\nprivate\
    \ LocationManager manager;\n```\nCode 10.6\n\nNow, we can populate the onChanged()\
    \ method as follows:\n\n```java\npublic void onLocationChanged(Location location)\
    \ {\n    if (location != null) {\n        latitude = location.getLatitude();\n\
    \        longitude = location.getLongitude();\n        Toast.makeText(getApplicationContext(),\n\
    \        \"READY TO SEND!\", Toast.LENGTH_LONG).show();\n    } else {\n      \
    \  Toast.makeText(getApplicationContext(),\n        \"NOT READY YET...\", Toast.LENGTH_LONG).show();\n\
    \    }\n}\n```\nCode 10.7\n\nIf the location data isn't null, i.e. if the location\
    \ data is received successfully, the longitude and latitude variables, respectively.\
    \ getLongitude() and getLatitude() methods extract the longitude and latitude\
    \ data from the location object. If the location data is received without any\
    \ problem, a dialog will display \"READY TO SEND!\" text on the screen otherwise\
    \ it will write \"NOT READY YET...\".\n\nWe've declared our custom method for\
    \ handling the GPS operations. Now it's time to define a GPSReceiver object as\
    \ follows:\n\n```java\nprivate GPSReceiver receiver;\n```\nCode 10.8\n\nWe can\
    \ define it below the LocationManager object definition shown in Code 10.6 so\
