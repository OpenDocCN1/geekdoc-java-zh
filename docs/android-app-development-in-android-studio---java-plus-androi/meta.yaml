    \ />\n    <category\n      android:name=\"android.intent.category.LAUNCHER\" />\n\
    \  </intent-filter>\n</activity>\n</application>\n</manifest>\n```\n\n代码 8.2（接上一页）\n\
    \n## 8.2. 设计 App 的 GUI\n\n现在，让我们来设计应用的布局。请打开 `layout_main.xml` 文件，并将默认的 \"Hello\
    \ World\" TextView 文本更改为 \"Compass App\"，这将作为应用的标题。请将其字体大小设置为 30sp 并设置为**粗体**样式。然后，按照所示对其进行定位：\n\
    \n![](img/5d944ea19245e0e2eac1ff6961a61518_145_0.png)\n\n图 8.4. 用于显示应用标题的 TextView\n\
    \n## 章节。Android 应用 #4：指南针\n\n让我们在 GUI 的正中间放置一个 ImageView，并选择我们粘贴到 drawable 文件夹的指南针图像：\n\
    \n![](img/5d944ea19245e0e2eac1ff6961a61518_146_0.png)\n\n图 8.5. 为 ImageView 组件选择指南针图像\n\
    \n当我们放置 ImageView 后，它会被选中。然后，请从 Android Studio 右侧面板将其 ID 设置为 ImageView_compass\
    \ 的 `iv_compass`，如下：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_146_1.png)\n\n\
    图 8.6. 设置指南针 ImageView 的 ID\n\n最后，我们在 ImageView 下方放置一个 TextView，并在其中实时显示方向角。我将其\
    \ ID 设置为 `tv_degrees`（TextView_degrees 的缩写），并按所示设置 24dp 的字体：\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_147_0.png)\n\
    \n图 8.7. 添加 TextView 显示方向角\n\n## 8.3. 编写 App 主代码\n\n我们已经完成了用户界面的设计，现在可以继续编码了。请在\
    \ Android Studio 中打开 `MainActivity.java` 文件。该文件的默认内容如下：\n\n```java\npackage com.example.atomic.compass;\n\
    \nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n   \
    \ protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_main);\n    }\n}\n```\n\n代码 8.3\n\n\
    指南针的水平方向被称为方位角（azimuth）。我们将根据磁力计和加速度计的输出计算此角度。让我们定义一个 float 类型变量来存储这些数据：\n\n```java\n\
    float azimuth;\n```\n代码 8.4\n\n我们还需要定义与传感器相关的对象：\n\n```java\nprivate SensorManager\
    \ compassSensorManager;\nSensor accelerometer;\nSensor magnetometer;\n```\n代码\
    \ 8.5\n\n在此代码中，第一个对象是用于访问传感器的 `SensorManager` 对象。另外两个声明定义了读取加速度计和磁力计输出的 `Sensor`\
    \ 对象。\n\n最后，我们声明 ImageView 和 TextView 对象，用于访问 GUI 中对应的组件：\n\n```java\nTextView\
    \ tv_degrees;\nImageView iv_compass;\n```\n代码 8.6\n\n我们可以将这些声明放在 `MainActivity`\
    \ 类中，位于 `onCreate()` 方法之前。然后，我们可以在 `onCreate()` 方法内部将默认的加速度计和磁力计传感器分配给它们的对象，如下：\n\
    \n```java\ncompassSensorManager =\n(SensorManager)getSystemService(SENSOR_SERVICE);\n\
    \naccelerometer =\ncompassSensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);\n\
    \nmagnetometer =\ncompassSensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);\n\
    ```\n代码 8.7\n\n在这些声明和赋值之后，`MainActivity.java` 文件目前看起来如代码 8.8。\n\n```java\npackage\
    \ com.example.atomic.compass;\n\nimport android.hardware.Sensor;\nimport android.hardware.SensorManager;\n\
    import android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
    import android.widget.ImageView;\nimport android.widget.TextView;\n\npublic class\
    \ MainActivity extends AppCompatActivity {\n\n    float azimuth_angle;\n    private\
    \ SensorManager compassSensorManager;\n    Sensor accelerometer;\n    Sensor magnetometer;\n\
    \    TextView tv_degrees;\n    ImageView iv_compass;\n\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_main);\n        compassSensorManager\
    \ = (SensorManager)getSystemService(SENSOR_SERVICE);\n        accelerometer =\
    \ compassSensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);\n        magnetometer\
    \ = compassSensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);\n    }\n\
    }\n```\n代码 8.8\n\n在此代码中，第一个对象是用于访问传感器的 `SensorManager` 对象。另外两个声明定义了读取加速度计和磁力计输出的\
    \ `Sensor` 对象。\n\n（注：由于原文中存在大量重复和碎片，上述翻译已根据逻辑流提供了最连贯的版本。）\n\n"
