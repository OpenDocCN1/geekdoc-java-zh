  mdcn: "\n\n# ANDROID STUDIO 移动应用开发入门指南\n\n所有在点击按钮时运行的代码行都放在 `onClick(View v)` 方法内部。\n\
    \n**注意：** 你会注意到 Android Studio 会以智能的方式自动补全你的代码。在我看来，Android Studio 在这一功能上非常出色。\n\
    \n我们的目标是在点击按钮时将背景颜色从红色变为蓝色，反之亦然。在 `activity_main.xml` 文件中，我们看到 GUI 有一个 `RelativeLayout`\
    \ 元素作为填充整个屏幕的主布局。由于这个原因，我们可以通过以下代码访问背景：\n\n```\nRelativeLayout bgElement = (RelativeLayout)\n\
    ViewById(R.id.activity_main);\n```\n\n在在这段代码中，我们生成了一个名为 `bgElement` 的 `RelativeLayout`\
    \ 对象，通过它我们可以访问应用背景的所有属性。\n\n现在我们需要检查 `bgElement` 的颜色。这是因为我们将根据它当前的颜色来改变它的颜色。如果现在是红色，按钮将变为蓝色；如果现在是蓝色，点击按钮后将变为红色。\n\
    \n```\nint color = ((ColorDrawable)\nElement.getBackground()).getColor();\n```\n\
    \n在这段代码中，应用布局的背景颜色通过 `bgElement.getBackground().getColor()` 获取，然后转换为 `Drawable`\
    \ 类型，该类型以整数形式表示颜色。然后，这个整数值被赋值给 `color` 变量。简而言之，背景颜色将以整数的形式存储在变量 `color` 中。\n\n\
    现在我们将利用一个决策语句来更改颜色，例如：\n\n## 第 5 章。安卓应用 #1：红蓝灯效果\n\n如果颜色是红色，则变为蓝色；否则（如果颜色是蓝色）则变为红色。\n\
    \n我们可以通过以下代码实现：\n\n```\nif (color == Color.RED) {\n    bgElement.setBackgroundColor(Color.BLUE);\n\
    } else {\n    bgElement.setBackgroundColor(Color.RED);\n}\nCode 5.5\n```\n\nAndroid\
    \ SDK 中有一个名为 `Color` 的特殊类用于进行颜色操作。`Color.RED` 和 `Color.BLUE` 表达式分别代表红色和蓝色对应的整数值。因此，包含整数的\
