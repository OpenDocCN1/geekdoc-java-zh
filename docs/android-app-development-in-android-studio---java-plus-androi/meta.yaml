    ### 2.2. 安装模拟器


    模拟器是模拟真实设备行为的软件。当我们开发应用时，显然无法手头所有可能的设备（Android 手机、平板电脑等）。正因如此，我们在模拟器上运行应用程序以便在各种设备上进行测试。在
    Android Studio 中，模拟器被称为“Android Virtual Devices (AVDs)”。当首次安装 Android Studio 时，没有默认的
    AVD。我们需要在测试应用之前创建一个。为此，请如图 2.6 所示选择 Tools -> AVD Manager。


