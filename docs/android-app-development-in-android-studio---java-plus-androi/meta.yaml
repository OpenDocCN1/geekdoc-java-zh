    # Chapter 6


    # ANDRIOD APP#2: BODY MASS INDEX (BMI)

    CALCULATOR


    # 6.1. General Information


    Body mass index (BMI) is a figure of merit that is used for assessing the thickness-thinness
    of a person. BMI is defined as the ratio of the mass and height-squared with the
    formula below:


    ```

    $$BMI = \frac{mass(kg)}{height(m)^2}$$

    ```


    After the calculation of the BMI, the following table is used for assessing the
    weight category:


    | Weight category | from BMI | to BMI |

    |---|---|---|

    | Very severely underweight | 0 | 15 |

    | Severely underweight | 15 | 16 |

    | Underweight | 16 | 18.5 |

    | Normal (healthy weight) | 18.5 | 25 |

    | Overweight | 25 | 30 |

    | Obese Class I (Moderately obese) | 30 | 35 |

    | Obese Class II (Severely obese) | 35 | 40 |

    | Obese Class III (Very severely obese) | 40 | $\infty$ |


    Table 6.1. BMI categories


    (source: https://en.wikipedia.org/wiki/Body_mass_index)'
