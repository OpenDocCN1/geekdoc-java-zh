    \nWe now need to check the colour of the bgElement. This is because we will change\
    \ its colour according to its current colour. If it is red now, the button will\
    \ change to blue. If it is blue now, the button click will turn to red.\n\n```\n\
    int color = ((ColorDrawable)\nElement.getBackground()).getColor();\n```\n\nIn\
    \ this code, the colour of the background of the layout of the app is taken by\
