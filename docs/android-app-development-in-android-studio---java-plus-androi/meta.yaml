    AVD 命名。在图 2.10 所示的下一个屏幕，我没有更改默认设置。点击“Finish”（完成）后，AVD 已创建并如图 2.11 所示显示在 AVD Manager
    中。你可以在 AVD 上运行你的 Android 应用，它将准确模拟真实 Nexus 5 手机的行为。


    我们可以通过点击图 2.11 中方框内的“Play”（播放）按钮来运行 AVD。虚拟设备将如图 2.12 所示出现，你可以像真实的 Nexus 5 手机一样使用它。


