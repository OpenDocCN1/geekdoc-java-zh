    \n```\nif it’s rainy\nI'll take my umbrella.\n}\nelse {\nI'll not take my umbrella.\n\
    }\n```\n\n让我们看看如何使用 if-else 语句在 Java 中检查两个数字是否相等：\n\n```java\npackage com.helloworld.quantum.helloworld;\n\
