    # Android Studio 移动应用开发入门指南


    ## 第一章


    ## 导言


    欢迎阅读你的 Android™ 应用开发指南！


    本书旨在教你如何使用 Java 编程语言在 Android Studio 中进行 Android 应用开发的基础知识。我假设在读本书开始之前，你没有任何 Java®
    或 Android 编程经验。我将用通俗易懂的语言解释应用开发的每一个细节。你将从零开始，并在读完这本书后，能够能够将你的想法转化为你自己的应用程序。显然，单本书并无法让你成为某个平台或编程语言的顶级专家，但通过这本书，你将在
    Android 应用开发方面拥有坚实的基础和实践经验。


    过去，Android 应用是使用 Eclipse 集成开发环境（IDE）配合 Android 开发工具（ADT）插件进行开发的。然而，Google 在 2014
    年引入了 Android Studio 作为 Android 应用开发的官方 IDE，该 IDE 逐渐成为了标准。最新的稳定版本是 Android Studio
    2.2，本书将使用该版本。


    在开始编程之旅之前，让我们先概述 Android 操作系统的基础知识和相关概念。


    ## 1.1. Android 操作系统


    Android 是一个开源移动操作系统。它是 Linux 的一个变体，因此在移动设备层面提供了广泛的安全性、模块化和生产力。Android 由一个名为“开放手机联盟”（OHA）的组织开发和维护。OHA
    建立于 2007 年，Google 是其核心成员。OHA 包含了许多著名的硬件和软件公司。


    最初，Android 由一家名为 Android Inc. 的公司创建。Google 在 2005 年收购了这家公司。之后，Google 将其开源，Android
    随之获得了巨大的动力。如图1.1 所示（数据来源：http://www.idc.com/），2016 年 Android 的市场份额占约 85%。考虑到这一市场份额，投资
    Android 应用开发显然是有回报的。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_9_0.png)


    **图 1.1.** 2015-Q4 至 2016-Q3 移动操作系统市场份额


    Android 有七个主要版本，每个版本都有若干修订。为了及早跟进这些版本，开发者用饼干名称来命名它们。流行的 Android 版本有 Kitkat (Android
    4.4)、Lollipop (Android 5.1) 和 Marshmallow (Android 6.0)（https://www.statista.com/statistics/271774/share-of-android-platforms-on-mobile-devices-android-os/）。Nougat
    (Android 7.0) 也在变得流行。随着版本的提升，Android 变得越来越强大。然而，在开发应用期间我们必须小心选择版本，因为并不是每个设备都使用最新版本。如果我们为
    Lollipop 开发应用，它可能无法在安装了 Froyo 的设备上运行。幸运的是，Android Studio 允许我们选择兼容性。


    Android 不仅用于手机，还用于平板电脑、笔记本电脑、数字电视盒、手持游戏设备甚至像 UDOO 这样的单板计算机。因此，在开发应用之前，我们首先需要选择目标设备和版本。


    ## 1.2. Android 应用是如何工作的？


    程序在不同平台上运行有不同的方式。最低级别的软件可以用机器码编写，直接运行在微处理器上。如图1.2 所示。由于很难在机器码中开发复杂的应用程序，操作系统在应用软件和硬件之间提供了一个通信和控制层，如图1.3
    所示。如果我们想为特定的硬件/操作系统开发运行的原生应用程序，我们必须使用编译器和链接器来完成。编译器和链接器获取源代码并创建实际运行在操作系统上的可执行文件，如图1.4
    所示。例如，如果我们想用 C++ 编程语言开发应用程序，就必须利用编译/链接过程。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_10_0.png)


    图 1.2. 机器码 – 硬件关系


    原生应用的主要优势是速度快。然而，缺点是不同平台之间不兼容。例如，我们无法在 Ubuntu 上运行原生 Windows 应用，反之亦然。虚拟机的概念开发是为了克服这一局限性。虚拟机是运行在操作系统上的软件，为开发者提供了一种抽象，如图1.5
    所示。应用软件运行在虚拟机之上。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_11_0.png)


    **图 1.3.** 硬件与应用之间的操作系统层


    ![](img/5d944ea19245e0e2eac1ff6961a61518_11_1.png)


    **图 1.4.** 从源代码创建原生可执行文件


    因此，只要计算机运行着虚拟机，应用软件就可以在该计算机上运行，而独立于硬件和操作系统。一个很好的例子是 Java 虚拟机（JVM），JVM 运行在几乎所有的操作系统和平台上。因此，当我们开发
    Java 软件时，它将在 JVM 上运行，而独立于操作系统/平台。


    开发在虚拟机上运行的应用明显优势可以总结为“一次编写，随运行”。然而，虚拟机上的应用比原生应用慢。


    虚拟机的通用开发总结在图1.6 所示。


    ![](img/5d944ea19245e0e2eac1ff6961a61518_12_0.png)


    **图 1.5.** 应用与操作系统之间的虚拟机


    ![](img/5d944ea19245e0e2eac1ff6961a61518_12_1.png)


    **图 1.6.** 从源代码创建中间代码


    与 Java 应用类似，Android 应用也运行在 JVM 上。Android 中使用了两个虚拟机：Dalvik 虚拟机（DVM）和 Android Runtime（ART）。这些是可以在低资源上运行的专用
    JVM。在 Lollipop 发布之前，DVM 一一直是默认运行时。ART 从 Android 5.0 开始引入并从那以后一直是默认运行时。DVM 和 ART
    基本上在做相同的工作：独立于平台运行 Android 应用。ART 相比 DVM 的主要优势是利用了名为“提前编译”（AOT）的概念，而不是“即时编译”（JIT）方法。在
    AOT 中，应用在安装期间进行编译，因此它们加载速度更快，CPU 占用更低。相反，JIT 编译提供了较低的存储消耗，但加载时间较长。


    ## 1.3. 开发应用使用的编程语言


    推荐且方便的 Android 应用的方法是使用 Java 编程语言。虽然 Java 是一种通用工具，但它与 Android Studio 中的 Android
    软件开发包（SDK）结合使用开发应用。另一种官方方法是使用带有原生开发包（NDK）的 C++。此选项用于开发具有低级指令的应用，如对时间敏感的驱动程序。通过
    C++ 和 NDK，我们可以直接在 Android 内核上运行应用，提高代码长度和开发成本的效率。还存在第三方工具，如 Xamarin、Cordova 和
    React Native。


    我们将使用标准的官方 Android 应用开发方法：Java 配合 Android SDK，并使用 Android Studio 集成开发环境（IDE）完成这项工作。你不需要了解
    Java 就可以开始学习这本书，因为 Java 的基础知识在第四章中也进行了解释。


