    \ 9.14 (cont'd from the previous page)\n\nThe Internet and GPS permissions are\
    \ added because the map uses both coarse and fine location tracking.\n\n# 9.8.\
    \ Running Our App and Sending Custom Coordinates to the Emulator\n\nPlease hit\
    \ the Run button in Android Studio to run our Show My Location app. You can run\
    \ the app in an emulator or on an actual device. The app running in the Nexus\
    \ 4 emulator is shown in Figure 9.10. If you cannot see the map on your app, most\
    \ probably it's an error regarding the api key. Please review that section again.\n\
    \nPlease note that I have sent custom coordinates to the emulator using its options\
    \ button as shown in Figure 9.11. The latitude and longitude of the coordinates\
    \ I've entered are 41.3809 N and 2.11287 E. Can you guess what this famous location\
    \ is? Hint: You can zoom in and out out on the emulator's map by double-clicking\
    \ at a point and then moving the mouse up or down.\n\nIt is worth noting that\
    \ I've tried the app on a real device and it works as expected.\n\n# CHAPTER 9.\
    \ ANDROID APP #5: SHOW MY LOCATION\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_182_0.png)\n\
    \n**Figure 9.10.** Our Show My Location app in the emulator\n\n# BEGINNER'S GUIDE\
    \ TO MOBILE APP DEVELOPMENT IN ANDROID STUDIO\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_183_0.png)\n\
    \nFigure 9.11. Sending custom coordinates to the emulator\n\n# Chapter 10\n\n\
    # ANDROID APP # 6: S.O.S. MESSAGE SENDER\n\n# 10.1. Introduction\n\nMost of the\
    \ Android devices have the capability of GSM connection so it is useful to learn\
    \ SMS messaging in Android. A class called SmsManager enables us to design apps\
    \ that can easily send and receive SMS programmatically. You'll see how this class\
    \ is used in this chapter.\n\nWe'll develop an app which sends the current location\
    \ to pre-defined recipients using SMS. This app can be useful in case of an emergency\
    \ in deserts or if you're boozed in a disco when you cannot type text in the message\
    \ field and need to send your location to a mate to take you home.\n\n# 10.1.\
    \ Adding the Required Permissions\n\nFirstly, please create a standard Android\
    \ Project having an empty activity and a target SDK version of 22 or lower. I\
    \ named my project as S.O.S. Sender. We'll use the location taken from the GPS\
    \ sensor and send it with SMS. Wherever, we need to add GPS usage and SMS sending\
    \ permissions to the AndroidManifest.xml file as follows:\n\n```xml\n<uses-permission\
    \ name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission name=\"\
    android.permission.SEND_SMS\" />\n```\n\nAfter inserting these permissions, AndroidManifest.xml\
    \ file looks as shown below:\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n```\n\n```xml\n<manifest\n  xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \n  package=\"sendsms.example.com.sendsms\">\n\n  <uses-permission android:name=\"\
    android.permission.ACCESS_FINE_LOCATION\" />\n  <uses-permission android:name=\"\
    android.permission.SEND_SMS\" />\n\n  <application\n    android:allowBackup=\"\
    true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
    \n    android:supportsRtl=\"true\"\n    android:theme=\"@style/AppTheme\">\n \
    \   <activity android:name=\".MainActivity\">\n      <intent-filter>\n       \
    \ <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
    android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n\
    \  </application>\n</manifest>\n```\n\nCode 10.2 (cont'd from the previous page)\n\
    \n# 10.2 Designing the User Interface\n\nLet's design the user interface now.\
    \ The S.O.S. button placed in the activity_main.xml file in Figure 10.1 layout_width\
    \ and layout_height are set to wrap_content by default. This means the button\
    \ will just cover the user interface. Let's set the layout_width and layout_height\
    \ to match_parent. We've set the button ID as SOS as also.\n\n# CHAPTER 10. ANDROID\
