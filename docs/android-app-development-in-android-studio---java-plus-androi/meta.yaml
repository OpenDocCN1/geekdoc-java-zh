    \    int a = 4;\n        int b = 4;\n        if (a == b){\nSystem.out.println(\"\
    a and b are equal\");\nelse {\nSystem.out.println(\"a and b are not equal\");\n\
    }\n}\n}\n```\nCode 4.17（接上一页）\n\n让我们分析这段代码：\n\n- 在这段代码中，创建了两个整数类型变量 a 和 b，并将其初始化为\
    \ 4。\n- 下一行 if 语句检查了相等性。\n- 如果此比较的结果为真，则执行 if 块内部的代码 System.out.println(\"a and\
