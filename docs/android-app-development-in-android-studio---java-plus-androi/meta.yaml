    Activity 是可以的。那么，activity（活动）意味着什么？Activity 可以定义为显示给用户的带有用户界屏幕。因此，我们需要包含一个 activity
    来拥有应用，正如你所知，Android 应用是具有一个或多个用户界面的视觉程序。


    选择默认 activity 后，Android Studio 要求我们如图 3.5 所示为 activity 和相关的布局文件命名。由于此应用中只有一个 activity，所以将它们的名称保持默认值是完全可以的。当我们点击“Finish”时，Android
    Studio 将创建项目（这可能需要一些时间），然后如图 3.6 所示创建项目文件和文件夹。


