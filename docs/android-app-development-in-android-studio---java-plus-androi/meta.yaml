    \nFigure 8.6. Setting the ID of the compass ImageView\n\nFinally, let's place\
    \ a TextView below the ImageView in which we'll display the orientation angle\
    \ in real time. I set its ID as tv_degrees (short for TextView_degrees), and set\
    \ 24dp with a font as shown below:\n\n![](img/5d944ea19245e0e2eac1ff6961a61518_147_0.png)\n\
    \nFigure 8.7. Adding the TextView to display the orientation angle\n\n## 8.3.\
    \ Writing the Main Code of the App\n\nWe completed the design of the user interface\
    \ and now ready to continue with the coding. Please open the MainActivity.java\
    \ file in Android Studio. This file will have the default contents as follows:\n\
    \n```java\npackage com.example.atomic.compass;\n\nimport android.support.v7.app.AppCompatActivity;\n\
    import android.os.Bundle;\n\npublic class MainActivity extends AppCompatActivity\
    \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
    \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
    \    }\n}\n```\n\nCode 8.3\n\nThe horizontal direction of a compass bearing is\
    \ called as azimuth. We'll calculate this angle from the magnetometer and accelerometer\
    \ outputs. Let's define a float type variable to hold this data:\n\n```java\n\
    float azimuth;\n```\nCode 8.4\n\nWe also need to define objects related to the\
    \ sensors as follows:\n\n```java\nprivate SensorManager compassSensorManager;\n\
    Sensor accelerometer;\nSensor magnetometer;\n```\nCode 8.5\n\nIn this code, the\
    \ first object is a SensorManager object that is used to access the sensors. The\
    \ other two declarations define Sensor objects for reading the outputs of the\
    \ accelerometer and the magnetometer.\n\nFinally, let's declare ImageView and\
    \ TextView objects which will be used to access the corresponding components in\
    \ the GUI:\n\n```java\nTextView tv_degrees;\nImageView iv_compass;\n```\nCode\
    \ 8.6\n\nWe can place these declarations inside the MainActivity class just before\
    \ the onCreate() method. Then, we can assign the default accelerometer and magnetometer\
    \ sensors to their objects inside the onCreate() method as follows:\n\n```java\n\
    compassSensorManager =\n(SensorManager)getSystemService(SENSOR_SERVICE);\n\naccelerometer\
    \ =\ncompassSensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);\n\nmagnetometer\
    \ =\ncompassSensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD);\n```\n\
    Code 8.7\n\nAfter these declarations and assignments, the MainActivity.java file\
    \ currently looks like Code 8.8.\n\n```java\npackage com.example.atomic.compass;\n\
    \nimport android.hardware.Sensor;\nimport android.hardware.SensorManager;\nimport\
    \ android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
    \ android.widget.ImageView;\nimport android.widget.TextView;\n\npublic class MainActivity\
