    \ main activity because sensors are hungry components therefore it is important\
    \ to pause and resume the sensor listeners when the activity pauses and resumes.\
    \ For this, we simply add the following code just below the end of the onCreate()\
    \ method:\n\n```\nprotected void onResume() {\n  super.onResume();\n  mSensorManager.registerListener(this,\n\
    \  accelerometer, SensorManager.SENSOR_DELAY_UI);\n  mSensorManager.registerListener(this,\n\
    \  magnetometer, SensorManager.SENSOR_DELAY_UI);\n}\n\nprotected void onPause()\
    \ {\n  super.onPause();\n  mSensorManager.unregisterListener(this);\n}\n```\n\n\
    8.11\n\nIn the onResume() method, the sensor listeners are registered meaning\
    \ the sensors are powered on again when the activity resumes. Similarly, the sensors\
    \ are unregistered (disconnected) in the onPause() method when the activity pauses."
