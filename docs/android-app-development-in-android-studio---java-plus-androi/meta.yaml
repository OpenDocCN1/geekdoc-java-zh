    below:


    ![](img/5d944ea19245e0e2eac1ff6961a61518_17_0.png)


    > Figure 2.5. Standalone SDK Manager


    After you install the packages, you''ll have the latest SDK and be ready to develop
    apps. However, before our test drive app one more step is needed: setting up the
    emulators.


    # 2.2. Installation of Emulators


    Emulators are software that mimics the behaviour of real devices. When we develop
    an app, we obviously won''t have all the possible devices (Android phones, tablets,
    etc.) available at hand. Because of this, we run the apps on emulators for testing
    on various devices. Emulators are also called “Android Virtual Devices (AVDs)”
    in Android Studio. When Android Studio is first installed, there is no default
    AVD. We need to create one before testing our apps. For this, select Tools ->
    Android -> AVD Manager as shown in Figure 2.6.'
