  md: "# Listing 245. Testing Rest Endpoint Without a URL\n\n```\n@QuarkusTest\n@TestHTTPEpoint(ArtistResource.class)\n\
    public class ArtistHTTPResourceTest {\n\n@Test\npublic void shouldGetAllArtists()\
