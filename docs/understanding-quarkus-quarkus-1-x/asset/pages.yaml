  md: 'On the other hand, if you want to prevent transactions from being marked for
    rollback by the interceptor when you have IllegalStateException (unchecked exception)
    or any of its subclasses is caught, you can use the dontRollbackOn as follows:


    ```

    @Transactional(dontRollbackOn = IllegalStateException.class)

