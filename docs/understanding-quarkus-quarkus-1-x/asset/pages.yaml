  md: '# Listing 279. The Proxy Interface


    ```

    @Path("/api/numbers")

    @Produces(MediaType.APPLICATION_JSON)

    @RegisterResourceClient

    public interface NumberResourceProxy {


    @GET

    IsbnNumbers generateIsbnNumbers();

    }

    ```


    The generateIsbnNumbers() method gives our code the ability to get ISBN numbers
    from the Number microservice. Eclipse MicroProfile REST Client will handle all
    the networking and marshalling, leaving our clean code of such technical details.


    But where is the Number microservice located? In order to determine the base URL
    to REST calls will be made, the REST Client uses a configuration from the application.properties
    file. The name of the property needs to follow a generic convention which is displayed
    in the following code:


    org.agoncal.fascicle.quarkus.NumberResourceProxy/mp-

    rest/url=http://localhost:8081

    org.agoncal.fascicle.quarkus.NumberResourceProxy/mp-

    scope=java,Singleton


    Having this configuration means that all requests performed using the NumberResourceProxy
    interface will use http://localhost:8081 as the base URL. Using this configuration
    and the code in Listing 279, calling the generateIsbnNumbers() method of NumberResourceProxy
    would result in an HTTP GET request made to http://localhost:8081/api/numbers.


    # 12.2.6. Falling Back


    Getting random books works great... until we hit the Number microservice. What
    happens? Well, the Book microservice cannot invoke the Number microservice anymore
    and breaks with a ConnectionException.


    ```

    ERROR [io.qua.ver.htt.run.QuarkusErrorHandler] HTTP Request to /api/books failed

    org.jboss.resteasy.UnhandledException: java.ws.rs.ProcessingException:

    RESTEASY004655: Unable to invoke request: java.net.ConnectException: Connection

    refused (Connection refused)

    ```


    One of the challenges posed by the distributed nature of microservices is that
    communication with external systems is inherently unreliable. Distribution increases
    the demand for resilient applications. So let''s provide a fallback for getting
    ISBN numbers in case of failure. For example, we could serialise the JSON representation
    of a book into a file so it can be processed later. Or store a temporary book
    into a database, or send a message to an event-bus. We will just be sending dummy
    data to make it simple.'
