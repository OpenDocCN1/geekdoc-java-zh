    # Creating Topics


    Messages (also called events or records) are durably stored in topics. A topic
    is a feed to which messages are published. Topics are always multi-producer and
    multi-subscriber: a topic can have zero, one or many producers that write to it,
    as well as zero, one, or many consumers that subscribe to these messages. Topics
    have a name and are partitioned, meaning that one topic is spread over a number
    of "buckets" located on different Kafka brokers.


    The set of commands below list the available topics and creates one topic called
    vinyl-topic that has three partitions:'
  merge: -1
