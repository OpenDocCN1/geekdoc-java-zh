    of the java 8 date and time API (JSR 310) | The annotated element must be a date
    in the future or in the past, including the present or not |

    | @Email | CharSequence | The string has to be a well-formed email address |

    | @Pattern | CharSequence | The element must match the specified regular expression
    |


