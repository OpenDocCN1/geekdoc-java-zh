  md: "# Listing 123. Author Endpoint with OpenAPI Annotations\n\n```\n@Path(\"/authors\"\
    )\n@Produces(MediaType.TEXT_PLAIN)\npublic class AuthorResource {\n\n    String[]\
    \ scifiAuthors = {\"Isaac Asimov\", \"Nora Jemisin\", \"Douglas Adams\"};\n\n\
    \    @GET\n    @Path(\"/index\")\n    @Operation(summary = @PathParam Returns\
    \ an author for a given index\")\n    @ApiResponse(responseCode = \"204\", description\
    \ = \"Author not found\")\n    @ApiResponse(responseCode = \"200\",\n        description\
    \ = \"Author returned for a given index\")\n    public String getScifiAuthor(@PathParam(\"\
    index\") int index) {\n        return scifiAuthors[index];\n    }\n}\n```\n\n\
    As you can see below, the summary of the @Operation annotation is reflected into\
    \ the OpenAPI v3 contract.\n\n```\n# Without annotation\npaths:\n  /authors/{index}:\n\
    \    get:\n\n# With the @Operation annotation\npaths:\n  /authors/{index}:\n \
    \   get:\n      summary: Returns an author for a given index\n```\n\nAdding the\
    \ @ApiResponse annotations to the code also makes the contract clearer so all\
    \ the returned status codes are listed and documented."
