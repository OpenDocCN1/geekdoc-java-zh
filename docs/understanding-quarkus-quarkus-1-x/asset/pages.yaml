    Customising Applications


    Having a documented contract for a given REST endpoint is not enough. It is also
    important to document the entire application. The difference is that OpenAPI annotations
    are not just on the endpoint itself, but instead on another Java class configuring
    the entire application (see the BookApplication in Listing 124). To define a class
    that globally defines a JAX-RS application, the BookApplication needs to extend
    the JAX-RS javax.ws.rs.core.Application class. This allows the application and
    supplies additional meta-data. For example, the @OpenAPIDefinition annotation.
    This annotation is used to add extra information to the root document of the contract.
    It contains several fields such as the description of the application, its version,
    the team to contact or the license used.'
