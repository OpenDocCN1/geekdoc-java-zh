    \ a PDF, or an image showing a number of types that can represent a resource as\
    \ String, InputStream and JAXB beans. A javax.ws.rs.Consumes and javax.ws.rs.Produces\
    \ annotations can be applied to a resource where several representations are possible.\
    \ The define types of representation exchanged between the client and the server.\
    \ JAX-RS has a javax.ws.rs.core.MediaType class that acts as an abstraction for\
    \ a MIME type. It has several methods and the constants listed in Table 30.\n\n\
    # Table 30. MIME Types Defined in MediaType\n\n| Constant name | MIME type |\n\
    | --- | --- |\n| APPLICATION_ATOM_XML | application/atom+xml |\n| APPLICATION_FORM_URLENCODED\
    \ | application/x-www-form-urlencoded |\n| APPLICATION_JSON | application/json\
    \ |\n| APPLICATION_OCTET_STREAM | application/octet-stream |\n| APPLICATION_SVG_XML\
    \ | application/svg+xml |\n| APPLICATION_XHTML_XML | application/xhtml+xml |\n\
    | APPLICATION_XML | application/xml |\n| MULTIPART_FORM_DATA | multipart/form-data\
    \ |\n| TEXT_HTML | text/html |\n| TEXT_PLAIN | text/plain |\n| TEXT_XML | text/xml\
    \ |\n| WILDCARD | /* |"
