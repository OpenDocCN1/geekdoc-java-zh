    # Passing Parameters


    Hibernate ORM with Panache is based on JPA which is based on JDBC (Java Database
    Connectivity). In So Panache you can pass parameters to a query using positional
    parameters (e.g. ?71, ?72, etc.), name parameters (e: :min, :max) or the Panache
    Parameters class. Listing 102 shows how to pass parameters to a query using these
    techniques.


    # 102. Query Parameters


    ```

    // Hard coded parameters

    cheapBooks = Book.list("unitCost between 0 and 30");


    // Positional parameters

    cheapBooks = Book.list("unitCost between ?71 and ?72", min, max);


    // Named parameters

    Map<String, Object> params = Map.of("min", min, "max", max);

    cheapBooks = Book.list("unitCost between :min and :max", params);


    // Using the Parameters class

    cheapBooks = Book.list("unitCost between :min and :max",

    Parameters.with("min", min).and("max", max));


    // Passing an enumeration

    List<Book> englishBooks = Book.list("language", Language.ENGLISH);

    ```


