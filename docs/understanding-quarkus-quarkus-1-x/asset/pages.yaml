    # 2.5. Understanding GraalVM


    Quarkus targets the HotSpot VM, of course, it was built with GraalVM in mind.
    GraalVM is an extension of the Java Virtual Machine (JVM) to support more languages
    and several execution modes.[9] It is itself implemented in Java. GraalVM supports
    a large set of languages: Java, of course, other JVM-based languages (such as
    Groovy, Kotlin etc.) but also JavaScript, Python, R and C/++.


    But it also includes a high performance Java compiler, itself called Graal. Running
    your application inside Java comes with startup and footprint costs. GraalVM has
    a feature to create native images for existing JVM-based applications. The image
    generation process employs static analysis to find any code reachable from the
    main java method and performs full Ahead-Of-Time (AOT) compilation on the Substrate
    VM.[...] The resulting native binary contains the whole program in machine code
    for its immediate execution. This improves the performance of Java to match the
    performance of native languages for fast startup and low memory footprint.


    HotSpot''s execution engine has a Just-in-Time (JIT) compiler. HotSpot starts
    interpreting the code, the methods are compiled at the client level and then move
    to the server compilation level. Even with improvements in the compilation levels,
    HotSpot starts interpreting its bytecode and moves to JIT-ing it.


    On the other hand, the Ahead-of-Time (AOT) compilation improves the startup time
    by loading compiled classes.[...] This avoids running those classes in the interpreted
    mode or at a sub-optimised compilation level.


    # 2.5.1. Architecture


    The major differentiators of GraalVM compared to the base JDK are:


    +   * Sulong: Guarantees memory safety for C/C++ and other LLVM-based languages
    (e.g. Fortran).'
