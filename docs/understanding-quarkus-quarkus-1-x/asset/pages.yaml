  md: '# Chapter 4. Core Quarkus


    In the previous Getting Started chapter, you made sure you could run a Quarkus
    application. This means that your environment is up and running and you''ve already
    caught a glimpse of Quarkus. As explained in the Understanding Quarkus chapter,
    Quarkus has a powerful extension mechanism for integrating many technologies.
    The chapters coming up will show you some of these extensions and how to use them.


    This Core Quarkus chapter focuses on the core technologies that you need to know
    because they will be used throughout this faisant. First, Context and Dependency
    Injection, because Quarkus makes heavy use of injection. Injection is actually
    used in EclipseMicroProfile which configures most parts of Quarkus, including
    its profile mechanism or logging. This chapter will explain the lifecycle of a
    Quarkus application and how it initializes and terminates.


    The code in this chapter can be found at https://github.com/agonal/agonal-fascicle-quarkus/tree/1.0/core


    # 4.1. Context and Dependency Injection


    Injection is at the core of Quarkus. From injecting a bean into another one, injection
    configuration into a component, or injecting a resource to a component, injection
    is everywhere. CDI is the MicroProfile specification taking care of dependency.
    CDI comes with other features that are heavily used in Quarkus: scopes or event
    management.


    > Quarkus is based on a CDI implementation called Arc [165] Arc does not fully
    implement CDI, only the most common subset of the specification is implemented.
    Therefore, there are a few limitations that you need to take into account if you
    come from a full-CDI world [166]


    Context and Dependency Injection (CDI) is a central technology in Jakarta EE or
    in MicroProfile [167] Its programming model turns nearly every component into
    an injectable, interceptable and manageable bean. CDI is built on loose coupling,
    strong typing, which means beans are loosely coupled, but in a strongly-typed
    way. Decoupling goes by further interceptors, decorators and extends to the entire
    platform. CDI homogenises scopes among beans, as well as in context and life cycle
    management.


    Context and Dependency Injection APIs and annotations are defined under root packages:
    java.inject, java.enterprise and java.interceptor. Table 3 lists the main subpackages
    in CDI 2.0.


    Table 3. Main CDI Subpackages


    | Subpackage | Description |

    |---|---|

    | jakarta.inject | Root package of the CDI APIs |

    | jakarta.enterprise.inject | Core dependency injection APIs |

    | jakarta.enterprise.context | Scope and contextual APIs |'
  merge: -1
  pgno: 80
