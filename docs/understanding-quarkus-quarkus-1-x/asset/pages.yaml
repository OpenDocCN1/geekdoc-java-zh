    # ### Relational Databases


    The relational model organises data into one or more tables made of columns and
    rows, with a unique key identifying each row. Rows are also called records or
    tuples. Generally, each table represents one entity type (such as a book, author
    or purchase order). The rows represent instances of that type of entity (such
    as the book “H2G” or “Design Patterns”) with the columns representing values attributed
    to that instance (such as the title of the book or the price).


    How would you store data representing a book in a relational database? Listing
    76 shows an SQL script that creates such a table.'
