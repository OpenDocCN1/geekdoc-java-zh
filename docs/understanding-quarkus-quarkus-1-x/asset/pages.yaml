    # 2.4. Understanding Cloud Native Computing


    The way to deploy applications was to use physical hardware. Once this physical
    hardware was purchased, it wouldn''t matter if we used all the machine resources
    or just a small amount. In most cases, we wouldn''t care that much, as long as
    we could run the application. If we needed to scale, we could either buy more
    physical hardware or install several copies of the same application in the same
    box.


    However, in the Cloud, we would pay exactly for what we use. Since we become pickier
    with our hardware usage, If the application takes 10 seconds to start, or consumes
    a lot of memory or CPU, we have to pay for these resources. And if we need to
    scale, we will pay for these 10 seconds, memory and CPU again.


    Cloud Native Computing is an approach that utilises cloud computing to build and
    run scalable applications in modern, dynamic environments such as public, private,
    and hybrid clouds. Technologies such as containers, microservices, serverless
    functions, service meshes and immutable infrastructure are common elements of
    this architectural style. These techniques enable loosely coupled systems that
    are resilient, manageable, and observable. The Cloud Native Computing Foundation
