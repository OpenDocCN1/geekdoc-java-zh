  md: 'Both Uni and Multi are said to be lazy. The code in Listing 175 constructs
    a pipeline of actions (i.e. transforming a String to uppercase), but it''s not
    until the subscribe() method is invoked that the pipeline is actually executed.


    # 175. Lazily Creating a Uni From Item


    ```

    // Lazily creates a Uni

    Uni<String> uni = Uni.createFrom(item).("Terri Lyne Carrington")

    onItem().transform(s -> s.toUpperCase() + " ");


    // Subscribes to it

    uni.subscribe().with(System::println);

    ```


    If a Uni handles a stream of items, the Multi handles more than one. You can see
    how we create a Multi out of a stream of Strings in Listing 176. We have an array
    of items, and for each item, we execute the pipeline of actions.


    # 176. Creating a Multi From Several Items


    ```

    Multi.createFrom(items).("Carla Bley", "John Coltrane", "Juliette Gréco")

    onItem().transform(i -> i.toUpperCase())

    subscribe().with(System::println);

    ```


    Notice in Listing 176 the with() method only takes one callback (here a System.out.println)
    which is invoked when the item is received. In this case, the method does not
    handle failure. In Listing 177, the with() takes two callbacks: callback invoked
    when the item is received successfully, and a second callback invoked when a failure
    event is received.


    # 177. A Uni Handling Success and Failure


    ```

    Uni.createFrom(item).("Terri Lyne Carrington")

    onItem().transform(s -> s.toUpperCase() + " ")

    subscribe().with(

    item -> System.out.println("Received: " + item),

    failure -> System.out.println("Failed with " + failure.getMessage()));

    ```


    You can convert Unis to Multi and vice-versa. In Listing 178, a Multi made of
    three items, but because we convert it to a Uni (with the toUni() method), only
    the first item is processed (or, the String "Carla Bley" will be transformed to
    uppercase).


    # 178. Transforms a Multi to a Uni


    ```

    Multi.createFrom(items).("Carla Bley", "John Coltrane", "Juliette Gréco")

    onItem().transform(i -> i.toUpperCase())

    .toUni()

    subscribe().with(System::println);

    ```'
