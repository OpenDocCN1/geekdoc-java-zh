  md: '# Table 31. The Response API


    | Method | Description |

    | --- | --- |

    | accepted() | Creates a new ResponseBuilder with a 202-Accepted status |

    | created() | New ResponseBuilder for a 201-Created resource (with URI) |

    | noContent() | New ResponseBuilder for an empty response (204-No Content) |

    | notModified() | New ResponseBuilder with a 304-Modified status |

    | ok() | New ResponseBuilder with a 200-OK status |

    | serverError() | New ResponseBuilder with a 500-Internal Server Error status
    |

    | status() | New ResponseBuilder with the supplied status |

    | temporaryRedirect() | Temporary redirection (307- Temporary Redirect) |

    | getCookies() | Gets the cookies from the response message |

    | getHeaders() | Gets the header from the response message |

    | getLinks() | Gets the links attached to the message as the header |

    | getStatus() | Gets the status code associated with the response |

    | readEntity() | Reads the message entity |


    The Response and ResponseBuilder follow the fluent API design pattern. You can
    easily write a response by concatenating methods. This makes the code more readable.
    Here are some examples of how you can write with this API:


    ```

    Response.ok().build();

    Response.ok().cookie(new Cookie("SessionID", "567GDIFY09")).build();

    Response.ok("Plain Text").expires(new Date())).build();

    Response.ok(new Customer("Ennio", "Smith"), APPLICATION_JSON).build();

    Response.noContent().build();

    Response.accepted(new Customer("Ligia", "Smith")).build();

    Response.notModified().header("User-Agent", "Mozilla").build();

    ```


    # 6.1.3. Invoking RESTful Web Services


    JAX-RS has a client API that you can make HTTP requests to your RESTful web services
    easily (despite all the low-level details of the HTTP protocol). It is a fluent
    request building API (i.e. using the Builder design pattern) that uses a small
    number of classes and interfaces (see Table 32 to have an overview of the: Client,
    WebTarget, and Response. The Client interface (obtained with the ClientBuilder)
    is a builder of WebTarget instances. A WebTarget represents a distinct URI from
    which you can invoke requests to obtain a Response. From this Response you can
    check status, length or cookies but more importantly, you can get its content
    (a.k.a. entity, message body or payload) through the Entity class.


    Table 32. Main Classes and Interfaces of the javax.ws.rs.client Package'
  merge: -1
