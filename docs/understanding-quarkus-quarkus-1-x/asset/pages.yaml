  md: '# Chapter 5. Data, Transactions and ORM


    The previous Quarkus chapter gave you a good understanding of what makes up the
    basis for Quarkus. From what you''ve already read in the previous chapters, Quarkus
    is about microservices, Kubernetes, Cloud Native or GraVM. Not only is Quarkus
    by the open source community that created transaction management in JBoss, the
    object-relational mapping tool Hibernate ORM, and specified Bean Validation from
    their Hibernate Validator implementation. So Quarkus integrates well with all
    these tools.


    Your applications usually manipulate data, validate data and store it in relational
    databases in a transactional way. You can use Quarkus as a runtime environment
    for data centric applications. This chapter starts with Bean Validation and shows
    how to constrain data it''s valid. Java Persistence API with Java Transaction
    API and datasources a perfect environment to map objects into relation transactions.
    But not least, this chapter will illustrate how Hibernate ORM with Panache makes
    database access easier.


    > The code in this chapter can be found at https://github.com/agoncal/agonal-fascicle-quarkus/tree/1/data


    # 5.1. Bean Validation


    As you will see in this chapter, JPA, JTA and Hibernate ORM with Panache are about
    accessing data from a relational database. Bean Validation has nothing to do with
    databases, but it does with data: valid data. You want REST endpoints to validate
    data or your databases to store valid data. So let''s start this chapter with
    Bean Validation.


    Validating data is a common task that developers have to do and it is spread throughout
    all layers of an application (from client to database). This common practice is
    time-consuming, error prone, and hard to maintain in the long run. Besides, some
    of these constraints are so frequently used that they could be considered standard
    (checking for a null value, size, range, etc.). It would be good to centralise
    these constraints in one place and share them across layers. That''s where Bean
    Validation comes into play.


    Bean Validation allows you to write a constraint and reuse it in different application
    layers. It is layer agnostic, meaning that the same constraint can be used from
    the presentation to the business model layer. Bean Validation is available for
    server-side applications as well as rich Java graphical interfaces (Swing, Android,
    JavaFX).


    Bean Validation allows you to apply already-defined constraints to your application,
    and also to write your own validation rules for beans, attributes, constructors,
    method return values and parameters. The API is very easy to use and flexible
    as it encourages you to define your constraints using annotations or XML descriptors.


    The Bean Validation APIs and annotations are all defined under the javax.validation
    package. Table 13 lists the main subpackages defined in Bean Validation 2.0 (under
    the root javax.validation package).


    Table 13. Main javax.validation Subpackages'
