    view in order to practically use entities instead of tables. It also comes with
    a query language (Java Persistence Query Language, or JPQL), allowing complex
    queries over objects.


    The Java Persistence APIs are all defined under the javax.persistence package.
    Table 17 lists the main subpackages defined in JPA 2.2 (under the javax.persistence
    package).


    Table 17. Main javax.persistence Subpackages

    | Subpackage | Description |

    | --- | --- |

    | root | Root package of the JPA APIs |

    | criteria | Java Persistence Criteria API, allowing the writing of queries in
    an object-oriented way |

    | metamodel | Java Persistence Metamodel API, bringing type safety to the queries
    |

    | spi | Internal SPI (Service Provider Interfaces) implemented by the provider


