  md: '# # Chapter 6. HTTP Microservices


    As we''ve seen in the previous Data, Transactions and ORM chapter, Quarkus is
    not only about microservices. It has deep core functionalities such as injection
    or configuration, and a set of extensions to deal with validating or mapping data
    to relational databases. By Hibernate ORM with Panache we can easily leverage
    JPA and JTA to access data in a transactional manner.


    But if Quarkus is *not only about* microservices, it has been strongly influenced
    by microservices. When it comes to microservices, we can distinguish between HTTP
    and reactive microservices (Chapter 8 for reactive microservices). This chapter
    focuses on RESTful microservices which are based on HTTP. Quarkus relies on the
    JAX-RS specification which goes hand in hand with JSON Binding and JSON Processing.
    There is another specification when it comes to document a REST endpoint, and
    that''s OpenAPI V3. As you see, Quarkus transparently enables REST documentation
    with Eclipse MicroProfile OpenAPI.


    The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-quarkus/tree/1.0/http


    #  6.1. API for RESTful Web Services


    Let''s start at the beginning. In Java, RESTful web services can be implemented
    using different frameworks or APIs. MicroProfile has JAX-RS and has a long history
    of exposing web services within the Jakarta EE platform. Quarkus implements JAX-RS
    through the RESTEasy implementation.


    *Representational State Transfer (REST)* is an architectural style based on how
    the Web works. Applied to services, it tries to put the Web back into web services.
    To design a RESTful web service, you need to know Hypertext Transfer Protocol
    (HTTP) and Uniform Resource Identifiers (URIs), and to observe a few design principles.
    This basically means that each URI is a representation of some resource. You can
    interact with that resource using an HTTP GET (to get its content), DELETE (to
    delete it), POST (to create it), or PUT (to update it).


    RESTful architectures quickly became popular because they rely on a very robust
    protocol: HTTP. Stateless-server coupling makes it much easier to evolve a REST
    interface over time without breaking existing clients. Like the protocol they
    based on, RESTful web services are stateless and can make use of HTTP cache and
    proxy servers to help you handle load and scale better. Furthermore, they are
    easy to build without any special toolkit is required.


    Java API for RESTful Web Services is a specification that provides support for
    creating services according to the Representational State Transfer (REST) architectural
    style.[140] JAX-RS provides a set of annotations and classes/interfaces to simplify
    the development and deployment of REST endpoints. It also brings a client API
    to programmatically invoke REST.


    The Java API for RESTful Web Services and annotations are all defined under the
    jakarta.ws.rs. Table 28 lists the subpackages defined in JAX-RS 2.1 (under the
    root jakarta.ws.rs package).[141]


    Table 28. Main java.ws.rs Subpackages'
