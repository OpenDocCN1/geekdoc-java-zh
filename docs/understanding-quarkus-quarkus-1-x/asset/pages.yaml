  md: '# A.6. Docker


    Docker is a set of platform-as-a-service (PaaS) products that use OS-level virtualisation
    to deliver software.[1] It makes it easier to create, deploy and run applications
    by using containers. Containers are isolated from one another and bundle their
    own software, libraries and configuration files; they can communicate with each
    other through well-defined channels. Containers allow developers to package an
    application with all its dependencies and ship it out as one package.


    # A.6.1. A Brief History of Docker


    Docker was founded by Solomon Hykes and Sebastian Hahn during the Y Combinator
    Summer 2010 startup incubator group and launched in 2011.[2 Hykes started the
    Docker project in France as an internal project within dotCloud (a Platform-as-A-Service
    company). Docker debuted to the public in Santa Clara at PyCon 2013. It was released
    as open source in March 2013. At the time, it used LXC as its default execution
    environment. One year later, with the release of version 0.9, Docker replaced
    LXC with its own component, which was written in the Go programming language.


