  md: "```\n$ java -jar target/packaging-rest-1.0-SNAPSHOT-runner.jar\n```\n\n# Fast-JAR\n\
    \nIf you package your code into a Fast-JAR format mvn package -Dquarkus.package.type=fast-jar,\
    \ then Quarkus generates a JAR for fast startup. The Fast-JAR format was introduced\
    \ as an alternative to the default JAR packaging. The main goal of this format\
    \ is to bring faster startup. The idea is, at build time, Quarkus knows all the\
    \ classes that are used by the application. So it creates an index at build time\
    \ to know which class is under which JAR. The speedup happens because there is\
    \ no need to go through each JAR to figure out which contains the class being\
    \ loaded. The regular JAR does not have this kind of information and therefore\
    \ needs to iterate over all the jars on the ClassPath using URLClassLoader. As\
    \ shown in Listing 214, the application and its dependencies are located under\
    \ the target/quarkus-app directory as well as the index (the file quarkus-application.dat).\n\
    \nListing 214. Thin JAR with Dependencies and Index\n\n```\ntarget/\nquarkus-app/\n\
    \  app/\n    packaging-rest-1.0-SNAPSHOT.jar\n  lib/\n    boot/\n      io.quarkus.quarkus-bootstrap-runner-1.7.0.Final.jar\n\
    \      io.quarkus.quarkus-development-mode-spi-1.7.0.Final.jar\n    main/\n  \
    \    io.quarkus.arc-1.7.0.Final.jar\n      io.quarkus.quarkus-core-1.7.0.Final.jar\n\
