    # A.6.4. Building, Running, Pushing and Pulling Images


    Let''s see the typical flow of how to get started on using Docker images and containers.
    Basically you create a Dockerfile, build it into a local Docker image and run
    it inside a container. To make your local image available to others (external
    developers but also tools such as Kubernetes), push the image to a remote registry
    (the default one being Docker Hub). Then, if your local image has been removed,
    pull it from the remote repository and execute it.


    But first, you need to create an account on a remote Docker repository. Let''s
    take the default one: Docker Hub.


    # Remote Docker Repository


    Docker Hub is a service provided by Docker for finding and sharing container images.
    [233] It will be used to push and pull our Docker images.


    To create a Docker account, sign up on https://hub.docker.com/signup. The name
    of the account is very important as it will be used to name the Docker images
    so they can be pushed to your remote repository (the image name and account name
    have to be the same). Figure 68 shows a Docker hub called agoncal (you should
    have your own).'
