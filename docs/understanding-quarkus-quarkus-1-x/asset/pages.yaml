    # 3.5. Going Native


    Let''s now produce a executable for the REST endpoint. Thanks to GraalVM, Quarkus
    is to generate native executables. Like Go, native executables don''t need a Virtual
    Machine (VM) to run, they contain the whole application, like an .exe file on
    Windows. Native executables improve the startup time of the application, memory
    consumption, and produce a minimal disk footprint. The executable has everything
    to run the application including the JVM (shrunk to be just enough to run the
    application), and the application itself.


    # 3.5.1. Building a Native Executable


    Building an executable JAR, as we just did, is one thing. But Quarkus, with the
    help of GraalVM, can go even further; it can build a native executable. Before
    building the executable, verify that you have set GRAALVM_HOME in your environment,
    as described in Appendix A.


    Thanks to the built-in Maven native profile, you can easily create a native executable
    using the following command.


    ```

    getting-started$ ./mvnw -PNative

    ```


    The plugin will start analysing the classes and packaging what''s used by the
    application. By executing this command, you should have a similar output:'
