    # 8.2. Reactive Messaging


    Chapter 9, Observability, you saw that one of the goals of Quarkus is to unify
    imperative and reactive programming. So Mutiny is heavily used under the hood
    without noticing or having to deal with Multis if you don''t need to. This is
    also true for Reactive Messaging which is based on Mutiny.


    Eclipse Messaging is for building event-driven, data streaming, and event-sourcing
    applications. It lets your application interact with various messaging technologies
