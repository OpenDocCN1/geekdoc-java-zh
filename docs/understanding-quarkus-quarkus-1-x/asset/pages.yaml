  md: '# About the Author


    ![](img/b367e296ed76005032fc73f31e5a1c75_17_0.png)


    Antonio Goncalves is a senior software architect living in Paris. Having focused
    on Java development since the late 1990s, his career has taken him to many different
    countries and companies where he works as a recognised consultant. As a former
    employee of BEA Systems (acquired by Oracle), he developed a very early expertise
    on distributed systems. He is particularly fond of open source and is a member
    of the OSGTP (Open Source Solution Get Together Paris). Antonio loves to create
    bonds with the community. So, he created the Paris Java User Group in 2008 and
    co-created Devox France in 2012 and Voxed Microservices in 2018.[^1]


    Antonio wrote his first book on Java EE 5, in French, in 2007. He then joined
    the JCP to become an Expert Member of various JSR (Java EE 8, Java EE 7, Java
    EE 6, CDI 2.0, JPA 2.0, and EJB 3.1) and wrote Beginning EE 7 and Beginning EE
    8 with Apress.[^2] Still hooked on sharing his knowledge, Antonio Goncalves decided
    to self-publish his later facets.


    For the last few years, Antonio has given talks at international conferences,
    mainly on Java, distributed systems and microservices, including JavaOne, Devox,
    GeeCon, The Server Side Symposium, Jazoon, and many Java User Groups. He has also
    written numerous technical papers and articles for IT websites (DevX) and magazines
