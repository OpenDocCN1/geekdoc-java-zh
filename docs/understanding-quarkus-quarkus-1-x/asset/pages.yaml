    # 2.6.4. Augmentation


    If you come from the Jakarta EE or Spring world, you know that most of the work
    of an application is performed at runtime. You compile and package an application
    into a JAR file, deploy it, and then wait for the application server to do all
    the XML parsing, annotation discovery, classpath scanning, and so on. Then, the
    application is ready.


    Quarkus goes the other way round and proposes to generalise ahead-of-time techniques.[19]
    When a Quarkus application is built, some work that usually happens at runtime
    is moved to the build time. Thus, when the application runs, most of it has been
    pre-computed, and all the annotation scanning, XML parsing, and so on won''t be
    executed anymore. This is called "augmentation" as shown in Figure 14. This means
    Quarkus brings an infrastructure for other frameworks to embrace build time metadata
    discovery (like annotations), declares classes need reflection at runtime and
    generates static proxies to avoid reflection (not to be confused with dynamic
    proxies that are created by traditional servers at runtime). This has two direct
    benefits: faster startup time and lower memory consumption.'
