  md: '# Chapter 9. Observability


    As you''ve seen in the previous chapters, your architecture can easily mix HTTP
    Microservices and Event-Driven Microservices. When it comes to HTTP microservices,
    the chapter Communication and Fault Tolerance showed that synchronous communication
    is not reliable, that why we need Eclipse MicroProfile Fault Tolerance with fallbacks
    or circuit breakers.


    With all these microservices interacting with each other, over HTTP or messages,
    it is essential to allow microservice to report and publish its health status.
    This information can then be collected by a service orchestrator which can take
    decisions based on the health of the system. Reporting health status can be achieved
    with Eclipse MicroProfile Health.


    Knowing the health of our microservices is a first step. But that doesn''t tell
    us if they are processing correctly in a correct amount of time or with good throughput.
    Eclipse MicroProfile Metrics brings a unified view of exporting statistics, such
    as the number of times and the rate at which a service has been requested, the
    duration of each request, and so on.


    > The code in this chapter can be found at https://github.com/agonal/fascicle-quarkus/tree/1.0/observability


    # 9.1. Eclipse MicroProfile Health


    Eclipse MicroProfile Health provides the ability to state the state of a computing
    node from another machine.[177] The Eclipse MicroProfile Health APIs allows applications
    to provide information about their state to external views which is typically
    used in cloud environments where automated processes must be able to determine
    whether the application should be discarded or restarted. Quarkus implements the
    Eclipse MicroProfile Health specification through the SmallRye Health.


    The Eclipse MicroProfile Health APIs and annotations are all defined under the
    org.eclipse.microprofile.health package. Table 55 lists the main subpackages in
    Eclipse MicroProfile Health version 2.2 (under the root org.eclipse.microprofile.health
    package).[178]


    Table 55. Main org.eclipse.microprofile.health Subpackages


    | Subpackage | Description |

    | --- | --- |

    | root | Root package of the Health APIs |

    | spi | Internal APIs (Service Provider Interfaces) implemented by the provider
    |


    Along with APIs, Health comes with a set of annotations. Table 56 lists a subset
    of the commonly used annotations.


    Table 56. Main Health Annotations


    | Annotation | Description |

    | --- | --- |

    | @Liveness | Used to define a liveness health check procedure |

    | @Readiness | Used to define a readiness health check procedure |'
