  md: '# Asynchronous Messages


    Asynchronous messages mean that you can execute multiple things at a time and
    you don''t have to finish executing the current thing in order to move to the
    next one. In Java, asynchronous programming can be done at a very low-level, such
    as manipulating threads, or through higher-level Java APIs (e.g. CompletableFuture
    or CompletionStage). But you can also use messaging.


    Sending messages asynchronously allows temporal decoupling between components
    so the system can do several tasks in parallel. If we take back our example where
    one component takes time to complete, this is what happens now. In the Figure
    47, we send messages back and forth between components. If the BankService had
    validated the credit card, a po-validated is sent to several subscribers. These
    subscribers then execute their task at their own pace, depending on the execution
    of other components. If the InventoryService takes too long, the ShippingService
    does not have time for its completion and cannot prepare the shipping.


    | PurchaseOrder Resource | PurchaseOrder Service | Bank Service | Inventory Service
    | Shipping Service |

    | :--- | :--- | :--- | :--- | :--- |

    | | purchase-orders | | | |

    | | | po-prepared | | |

    | | | bank-validated | | |

    | | | Credit Card Valid | | |

    | | | po-validated | | |

    | | | po-validated | | |

    | | | Credit Card Invalid | | |

    | | | po-invalidated | | |

    | PurchaseOrder Resource | PurchaseOrder Service | Bank Service | Inventory Service
    | Shipping Service |


    Figure 47. Sending and receiving asynchronous messages


    # Broker Architecture


    A Broker is a software that enables the exchange of messages asynchronously between
    heterogeneous systems. It can be seen as a buffer system that produces and consumes
    messages at their own pace (e.g. one system is 24/7, the other runs only at night).
    It is inherently loosely coupled, as producers don''t know who is at the other
    end of the communication channel to consume the message and perform actions. The
    producer and the consumer do not have to be available at the same time to communicate.
    In fact, they do not know about each other, as they use an intermediate buffer.
    In this respect, a broker differs completely from synchronous technologies which
    require an application to know the signature of remote application''s methods.'
  merge: -1
  pgno: 251
- img_proc: true
  md: "A broker (a.k.a. message provider or provider) uses a special vocabulary. The\
    \ message sender is called a producer (or an emitter), and the location where\
    \ the message is sent is called a topic (or a channel or destination). The component\
    \ receiving the message is called a consumer (or a subscriber). What's exchanged\
    \ between the producer and the consumer is called a message, an event, or a record.\
    \ A message is an envelope wrapping a payload. A message is sent to a specific\
    \ topic and, when received and processed successfully, acknowledged. Figure 48\
    \ illustrates these concepts.\n\n![](img/b367e296ed76005032fc73f31e5a1c75_252_0.png)\n\
    \nIn a microservice architecture, messages can be exchanged within the microservice\
    \ itself, or, between remote microservices (see Figure 49). Having local exchanges\
    \ allows components to use reactive programming to react to messages. Remote exchanges\
    \ allow us to decouple microservices.\n\n![](img/b367e296ed76005032fc73f31e5a1c75_252_1.png)\n\
    \nThere are several frameworks and APIs used to send and receive messages: Quarkus\
    \ Eclipse Reactive Messaging. There are several brokers and, as of today, Quarkus\
    \ interacts with Kafka, AMQP and MQTT through connectors (more on connectors in\
    \ the Kafka section below).\n\n# 8.2.2. Sending Messages\n\nThere are two ways\
    \ of sending messages with Eclipse Reactive Messaging. One is by using `@Outgoing`\
    \ annotation and another by programmatically emitting messages into a channel.\n\
    \nThe `@Outgoing` annotation is used to annotate a method to indicate that the\
    \ method publishes messages to a specified channel. Inside the application, messages\
    \ transit on channels that are identified by a name. In Listing 184, the message\
    \ containing a conversion rate of type Float is sent to a channel called euro-rate.\
    \ Somewhere, a subscriber listening to the channel will receive the message asynchronously.\n\
    \nListing 184. Sending a Message with @Outgoing\n\n```\n@Outgoing(\"euro-rate\"\
    )\npublic Message<Float> sendEuroRate() {\n    return Message.of(euroRate);\n\
    }\n```"
