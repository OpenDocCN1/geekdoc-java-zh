  md: '# 5.4. DataSource


    We''ve seen how to map and query entities, and how to access them in a transactional
    way. But there is still one piece of the puzzle missing: a relational database.
    The usual way of obtaining connections to a database is to use a datasource and
    configure a JDBC driver. [135]


    In Quarkus, the datasource and connection pooling implementation is called Agroal.[139]
    Agroal is a modern, lightweight connection pool implementation designed for very
    high performance and scalability, and features first-class integration with the
    other components in Quarkus, such as security, transaction management components
    and health metrics. To configure the datasource, you just have to configure in
    the application.properties, for example:


    ```

    quarkus.datasource.db-kind=h2

    quarkus.datasource.jdbc.driver=org.h2.Driver

    quarkus.datasource.jdbc.url=jdbc:h2:mem:vintageStoreDB

    ```


    The database kind (property db-kind) defines which type of database you will connect
    to. Currently Quarkus supports these built-in kinds:


    +   - derby

    - H2: h2

    - MariaDB: mariadb

    - Microsoft SQL Server: mssql

    - MySQL: mysql

    - PostgreSQL: postgresql, pg or pg


    By installing a JDBC driver in your dependencies (e.g. for PostgreSQL by adding
    the quarkus-jdbc-postgresql dependency in the pom.xml) and setting it in the configuration,
    Quarkus resolves the JDBC driver automatically, so you don''t need to configure
    it yourself. So the datasource configuration is the same as the previous one,
    we just skip the JDBB driver:


    ```

    quarkus.datasource.db-kind=h2

    quarkus.datasource.jdbc.url=jdbc:h2:mem:vintageStoreDB

    ```


    And because there is a good chance you will need to define some credentials to
    access your database, you can use the following configuration:


    ```

    quarkus.datasource.db-kind=h2

    quarkus.datasource.jdbc.url=jdbc:h2:mem:vintageStoreDB

    quarkus.datasource.username=app

    quarkus.datasource.password=app

    ```'
