  md: "add multiple checks, you need to give every check a dedicated name. The HealthCheckResponse.named(method)\
    \ is used to indicate what service the health check is done for.\n\nThe liveness\
    \ check is accessible at /health/live. Access this URL (browser or cURL) and you\
    \ should see JSON output similar to Listing 198.\n\n```\n{\n  \"status\": \"UP\"\
    ,\n  \"checks\": [\n    {\n      \"name\": \"Ping Number REST Endpoint\",\n  \
    \    \"status\": \"UP\"\n    }\n  ]\n}\n```\n\nListing 198. Liveness Check Result\
    \ in JSON\n\n# Readiness Checks\n\nOnce we know a microservice is alive, we need\
    \ to know if it is actually ready to process requests. Generally, the readiness\
    \ procedures determine whether the microservice should be restarted, readiness\
    \ procedures determine whether it makes sense to contact the microservice with\
    \ requests. As shown in Listing 199, a readiness check is very similar to a liveness\
    \ check. You need a Java class that implements HealthCheck and is annotated with\
    \ @Readiness. Here, the call()method checks that the environment variable server.name\
    \ is set. If not, the service is down and is not ready to process requests.\n\n\
    Listing 199. Readiness Check\n\n```\n@Readiness\n@ApplicationScoped\npublic class\
    \ ServerVariableCheck implements HealthCheck {\n\n  @Override\n  public HealthCheckResponse\
    \ call() {\n    if (System.getProperty(\"server.name\") == null) {\n      return\
    \ HealthCheckResponse.named(\"System Variable Check\").down().build();\n    }\
    \ else {\n      return HealthCheckResponse.named(\"System Variable Check\").up().build();\n\
    \    }\n  }\n}\n```\n\nWhen the ServerVariableCheck class in Listing 199 is deployed\
    \ with the microservice, you can access the health/ready endpoint. You will get\
    \ the health checks defined with the @Readiness qualifier (see Listing 200)."
