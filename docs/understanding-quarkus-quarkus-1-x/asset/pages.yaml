  md: '# Chapter 7. Communication and Fault Tolerance


    The previous chapter presented the technologies around HTTP Microservices. The
    main one is Java API for RESTful Web Services which allows us to expose and invoke
    REST endpoints. Often those endpoints produce and/or consume JSON. For that, Quark
    integrates with JSON Binding and JSON Processing. Eclipse MicroProfile OpenAPI
    is used to document an endpoint so external clients know how to invoke it.


    But in a microservice architecture, there is not one microservice but several,
    and they need to talk to each other. They can use messaging (as you will see in
    Chapter 8) or HTTP. When we need an HTTP microservice to invoke another one, we
    can use Eclipse MicroProfile REST Client. It is based on the JAX-RS Client API
    and simplifies HTTP vocations. But when this is synchronous, we quickly realise
    that our microservices need to handle communication failure. That''s when Eclipse
    MicroProfile Fault Tolerance becomes very useful. Services can also be accessed
    by user interfaces, browsers, mobile devices, etc. in this case, we need to deal
    with CORS issues. And once again, Quarkus is here to help.


    > The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-quarkus/tree/1/communication


    # 7.1 CORS


    In a microservice architecture, you easily end up with several REST endpoints
    interacting with each other, crossing different servers, different domains. And
    you usually want to have a graphical interface so your users can interact with
    the system. That''s when you hit CORS! Cross-origin Resource Sharing (CORS) is
    a mechanism that allows restricted resources on a web page to be requested from
    another domain outside the domain from which the first resource was served. [150]


    # 7.1.1. Understanding CORS


    In a nutshell, CORS allows web clients to make HTTP requests to servers hosted
    on different origins. By origin, we mean a combination of the URI scheme, hostname,
    and port number. It is a mechanism that uses additional HTTP headers to tell browsers
    to give a web application running at one origin, for example, the front-end JavaScript
    code is served from Figure 39 https://domain-a.com and makes a request on https://domain-b.com,
    then the browsers restrict the access. For security reasons, a web application
    can only request resources from the same origin the application was loaded from,
    unless the response from others includes the right CORS headers. CORS defines
    a way in which a browser and server can interact to determine whether it is safe
    to allow the cross-origin request.'
