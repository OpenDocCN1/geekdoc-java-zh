  md: "Along APIs, OpenAPI comes with a set of annotations. Table 35 lists a subset\
    \ of the most commonly used annotations.\n\n# Table 35. Main OpenAPI Annotations\n\
    \n| Annotation | Description |\n| @APIResponse | Describes the endpoint's response\
    \ (response code, data structure, types, etc.) |\n| @Operation | Describes a single\
    \ API operation on a path |\n| @OpenAPIDefinition | Root document object of the\
    \ OpenAPI document |\n| @Parameter | The name of the method parameter |\n| @RequestBody\
    \ | A brief description of the request body |\n| @Schema | Allows the definition\
    \ of input and output data types |\n| @Tag | Used to add tags to the REST endpoint\
    \ contract to provide more description |\n\nThe Eclipse Micro OpenAPI extension\
    \ shown in time, Listing 120 is one of these extensions that, added once to your\
    \ pom.xml brings you new functionalities without having to invoke APIs. Add this\
    \ extension, and Quark will automatically generate an OpenAPIv3 documentation\
    \ for your REST endpoints.\n\n# Listing 120. OpenAPI Extension\n\n```\n<dependency>\n\
    \  <groupId>io.quarkus</groupId>\n  <artifactId>quarkus-smallrye-openapi</artifactId>\n\
    </dependency>\n```\n\nBefore digging more into OpenAPI, we need to define some\
    \ terminology, such as the OpenAPI v3 Specification.\n\n# Swagger\n\nThe term\
    \ Swagger UI takes its roots from Swagger. Let's explain it. At first, there was\
    \ no specific way to describe a RESTful service. Some developers were not documenting\
    \ their APIs or were using an in-house property format. That's Swagger came into\
    \ play.\n\nSwagger is an open source software framework created in 2011 that helps\
    \ developers, build, document, and consume RESTful web services. REST APIs typically\
    \ did not have a machine-readable description at time, so Swagger became very\
    \ popular among developers and also companies (Apigee, Intuit, Microsoft, IBM,\
    \ etc.). Shortly after Swagger was created, alternative structures for describing\
    \ RESTful APIs were introduced, In 2015, under the sponsorship of the Linux Foundation,\
    \ Swagger was donated to the OpenAPI Initiative. In 2016, the Swagger specification\
    \ was renamed OpenAPI Specification."
  merge: -1
