  md: "# Client Proxies\n\nOne of the central ideas in Eclipse MicroProfile REST Client\
    \ is the good-old distributed object communication that we implemented in Java\
    \ RMI, for example. To invoke a remote object, we use a proxy. Consider the REST\
    \ endpoint in Listing 162. As you can see, this is a simple JAX-RS web service\
    \ that generates ISBN. There is only one method, accessible through HTTP GET,\
    \ and returns ISBN (made up of a GS1 code and an ISBN 13 number).\n\nListing 162,\
    \ Endpoint Taking a Query Parameter and Returning an Object\n\n```\n@Path(\"/api/isbn\"\
    )\n@Produces(MediaType.APPLICATION_JSON)\n@ApplicationScoped\npublic class IsbnResource\
    \ {\n\n    @GET\n    public Isbn generateIsbn(\n        @DefaultValue(\"true\"\
    )\n        @PathParam(\"separator\") boolean separator) {\n        Isbn isbnNumber\
    \ = new Isbn();\nisbnNumber.isbn13 = new Faker().code().isbn13(separator);\nisbnNumber.gs1\
    \ = new Faker().code().isbn6s1();\n        return isbnNumber;\n    }\n}\n\npublic\
    \ class Isbn {\n    public String gs1;\n    public String isbn13;\n}\n```\n\n\
    > Listing 162, you might wonder what Faker is. The Java Faker library is a port\
    \ of Ruby's faker gem that generates fake data.[164] It's useful when you're developing\
    \ a project and need some pretty data for a showcase. Here, we use it to generate\
    \ some random data.\n\nThis web service takes a query parameter. So, depending\
