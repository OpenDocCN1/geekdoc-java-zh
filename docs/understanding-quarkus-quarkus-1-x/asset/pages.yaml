    1999-04-28\"\n}\n```\n\n# Customising Binding\n\nLike we saw previously with JPA\
    \ or OpenAPI, if you need to customise the default binding, you use annotations.\
    \ In JSON-B, you can add a binding annotation either on a field, getter or setter.\
    \ If the annotation is specified on a field, the binding is used for both serialisation\
    \ and deserialisation. If it annotates a getter, it is used only for serialisation,\
    \ and used only for deserialisation if it annotates a setter.\n\nListing 140 uses\
    \ several JSON-B annotations on fields:\n\n+   * @JsonbProperty is used to change\
    \ the name of a particular property (e.g. book_title instead of the default title).\
    \ The nickable attribute switches on or off the serialisation of null values.\n\
    * By default, JSON-B uses ISO format to serialise and deserialise dates and numbers.\
    \ If it's required to override these settings, this can be done using @JsonbDateFormat\
    \ and @JsonbNumberFormat. These annotations take a parameter following the java.time.format.DateTimeFormatter\
    \ and java.text.DecimalFormat.\n* Also note that the property description is annotated\
    \ with @JsonbTransient, therefore, it will be ignored by the JSON binding engine."
