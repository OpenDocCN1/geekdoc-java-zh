    # Build and Execute


    Let''s quickly recap the commands that we''ve used. Table 62 summarises the Maven
    commands to build each executable, while Table 63 shows the command to run the
    generated executable.


    Table 62. Command to Build


    | Packaging Format | Command |

    | --- | --- |

    | JAR | mvn package -Darkus.package.type=jar |

    | Fast-JAR | mvn package -Darkus.package.type=fast-jar |

    | Uber-JAR | mvn package -Darkus.package.type=uber-jar |

    | Native | mvn package -Pnative |

    | Linux Native | mvn package -Pnative -Darkus.native.container-build |


    Table 63. Command to Execute


    | Packaging Format | Command |

    | --- | --- |

    | JAR | java -jar target/<name>-runner.jar |

    | Fast-JAR | java -jar target/quarkus-app/quarkus-run.jar |

    | Uber-JAR | java -jar target/<name>-runner.jar |

    | Native | target/<name>-runner |

    | Linux Native | target/<name>-runner |


    # Executable Size


    One easy metric to get the size of the executable: you package your application
    picking up a format, and you get the size in megabytes. Of the more complex your
    application is, the more dependencies it needs and the larger the executable will
    be. So in order to compare, Table 64 shows the size of the executable for two
    different types of application:


    +   - A REST:: A JSON REST endpoint.

    - A complex application: A JSON REST endpoint with validation, Hibernate ORM with
    Panache, transactions, injection and an H2 database.


    Table 64. Executable Size


    | Packaging Format | REST App | Complex App |

    | --- | --- | --- |

    | JAR (thin jar + target/lib) | 200 Kb + 10 Mb | 400 Kb + 30 Mb |

    | Fast-JAR (target/quarkus-app) | 11 Mb | 31 Mb |

    | Uber-JAR | 10 Mb | 30 Mb |'
