    # CDI


    Context and Dependency Injection CDI is a central technology in Jakarta EE or
    in MicroProfile.[1] Its programming model turns nearly every component into an
    injectable, interpretable and manageable bean. CDI is built on the concept of
    "loose coupling, strong typing", which means beans are loosely coupled. Decoupling
    goes further by intercepting injectors, decorators and extends to the entire platform.
    CDI homogenises scopes among beans, as well as context and life cycle management.
    Quarkus uses CDI extensively. However, it is not a full CDI implementation verified
    by TCK. CDI being runtime based and not compile time, Quarkus decided to only
    implement the most useful CDI features that could be generated at compile time.
    Chapter 4 covers how to use CDI injection within Quarkus.'
