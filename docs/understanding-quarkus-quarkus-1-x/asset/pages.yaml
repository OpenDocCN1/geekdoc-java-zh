    # 5.3.3. Programmatic Transaction Management


    With @Transactional, you leave the container to do the transaction demarcation
    just by specifying a transaction attribute and the exceptions for rollback or
    not. In some cases, transaction demarcation may not provide the granularity that
    you require (e.g. a method cannot generate more than one transaction). To address
    this issue, JTA offers a programmatic way to explicitly manage transaction boundaries
    (begin, commit, rollback).


    The main interface used to manage a transaction is javax.transaction.UserTransaction.
    It allows the bean to demarcate a transaction, get its status, set a timeout,
    and so on.


    Listing 93 shows how to manage a transaction. First of all, we get a reference
    to the UserTransaction using injection. The onItemSold() method begins the transaction,
    does some business processing, and then, depending on some business logic, commits
    or rolls back the transaction. Notice also that the transaction is marked for
    rollback in the catch block (I''ve simplified exception handling for better readability).'
