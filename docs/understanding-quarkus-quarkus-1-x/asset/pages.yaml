  md: "# JAX-B\n\nThere is an XML equivalent called JAX-B (Java Architecture for XML\
    \ Binding) that does the binding between an XML document and a Java object. To\
    \ have XML binding in Quarkus, first need to add the quarkus-resteasy-jaxb Maven\
    \ dependency. Then, you need to annotate your POJOs with JAX-B annotations as:\n\
    \n```\n@XmlRootElement\npublic class CD {\n}\n```\n\nIf you need your RESTful\
    \ web service to produce XML, then it's a matter of using the appropriate media\
    \ type:\n\n```\n@GET\n@Produces(MediaType.APPLICATION_XML)\npublic CD getRandomBook()\
    \ {\n  return service.findRandomBook();\n}\n```\n\n# 6.3.3. Serialising and Deserialising\n\
    \nSerialization is when the content of an object tree is written to a JSON document,\
    \ and deserialisation is the inverse, the process of reading a JSON document and\
    \ constructing an object tree. JAX-B has an API to programmatically serialise\
    \ and deserialise content. The beauty of it is the integration with other technologies,\
    \ such as JAX-RS, which makes serialisation and deserialisation transparent.\n\
    \n# Programmatic Serialisation and Deserialising\n\nThe main entry point in JAX-B\
    \ is the javax.json.bind.Jsonb API. It provides a facade over the JSON Binding\
    \ operations. As seen in Listing 144, an instance of Jsonb is created using a\
    \ JsonbBuilder. It provides a toJson() method to serialise Java objects to a String\
    \ and deserialises them back with the fromJson() method."
