  md: '# Foreword


    Hi there, I''m Emmanuel Bernard, co-founder of Quarkus. I am Chief Architect at
    Red Hat overseeing the Middleware portfolio. But, at heart, I''m an Open Developer
    of (projects and communities). I contributed to, and led, the Hibernate projects
    as well as many others. Recently, I was lucky enough to be in the right place
    at the right time with the right people in order to co-found Quarkus. Since then,
    I have been leading it since on its mission to deliver Java for the cloud era.


    I''ve known Antonio for a long time now. We have watched the evolutions of the
    Java ecosystem together over the years. I trust his expertise in figuring out
    where technology is going and avoiding the latest shiny object. So when a seasoned
    developer like him jumps on Quarkus, loves it and wants to invest his time in
    that, to me, is a ringing endorsement that the project is doing something right
    and addressing key problems.


    I''m really pleased Antonio embarked on this Quarkus book adventure. He has a
    deep understanding of the developer community: from customers to community members,
    freelancers to big enterprise development teams. I trust his ability to explain
    technology in a practical way and he offers the knowledge and building blocks
    to solve their problems.


    Fun fact about Quarkus: we needed to strike a balance between “new - revolutionary”
    and One key of Quarkus is how it offers very many APIs and programming concepts
    but it''s packaged with boosted usefulness. Antonio is one of the most people
    I know on the APIs and technologies Quarkus exposes: CDI, RESTeasy, Hibernate,
    Eclipse MicroProfile and many more.


    One of Quarkus'' philosophies is “Developer Joy”. This is realised, in part, by
    making developers deliver applications faster, by being more practical. But it
    is also built on a very solid technological foundation. This book is written with
    the same philosophy, it gets you to solve the concrete problems while still distilling
    the fundamental knowledge you need to go to the next level.


    When we released Quarkus to the community, we went onto something. But what you
    think and what the world thinks are often distinctly different. I am really happy
    when I hear users telling me how Quarkus has addressed their Cloud Native needs
    and concerns: short development cycles, the need for high density deployments
    (less RAM instance), and the need for fast startup times - for microservices or
    functions. Even better, they love the experience of using it.


    The future of Java as a solution for writing Cloud Native applications deployed
    in Kubernetes has been questioned. This is no longer the case and I think Quarkus
    is the answer. I hope this book will spread the word far and help more developers
    and more teams be productive with Java and our new way of writing modern applications.


    Emmanuel Bernard

    Co-founder of Quarkus at Red Hat

    @emmanuelbernard


    [1] KDP https://kdp.amazon.com'
