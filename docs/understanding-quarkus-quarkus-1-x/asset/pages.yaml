    Now that we have the interface, we just need to build the implementation and then
    invoke it. There are two ways to build the implementation: programmatically using
    the RestClient API or declaratively using CDI and Eclipse MicroProfile Configuration.


    # Programmatic Invocation


    Let''s start with the org.eclipse.microprofile.rest.client.RestClientBuilder.
    It is a little more verbose but can come handy in environments where CDI is not
    available. As shown in Listing 166, to create a new instance of the RestClientBuilder
    we first specify the baseURL value for the remote endpoint. Then we build the
    client, parsing in the interface class. After, we can invoke methods on the client
    like it was any other Java object.


    # Listing 166. Programmatic HTTP Invocation


    ```

    IsbnProxy = RestClientBuilder.newBuilder()

    .baseUri(new URI("http://localhost:9081"))

    .build(IsbnProxy.class);


    IsbnNumber isbnNumber = IsbnProxy.generateIsbn(false);

    ```


    # Declarative Invocation


    In addition to programmatic invocation, it is also possible to register the Java
    interface declaratively with annotations. For example, thanks to the @RegisterRestClient
    annotation on the interface, it makes the client usable through CDI.


    As you can see in Listing 167, the BookResource needs to invoke two external microservices:
    one returning an ISBN book number (using the IsbnProxy interface), and another
    one an ISBN number (the IssnProxy in Listing 168). These two interfaces are injected
    using the MicroProfile @RestClient annotation. By injecting the interfaces as
    @RestClient, we will be able to proxy the remote REST endpoint.'
