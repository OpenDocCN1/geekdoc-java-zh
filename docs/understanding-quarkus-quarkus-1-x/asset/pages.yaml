    On the JVM mode, JAR formats have the same size (around 10 Mb for a simple REST
    application, 30 Mb for a complex one). The same happens for Native mode: a Linux
    executable is more or less the size as the executable for your operating system.
    The main difference is the size between JVM and Native modes. The native executables
    are bigger because they embed the part of the Java runtime environment needed
    to execute the application. But in all scenarios, the more dependencies an application
    has (i.e. the complex application) the bigger the executable.


    # Time to First Request


    Another useful measure is to take the time to serve the first request. It is more
    accurate than just measuring the startup time as some frameworks can use aggressive
    lazy initialisation techniques. It is important to measure the time to serve the
    first request to accurately reflect how a framework needs to start. Table 65 shows,
    for each executable format, the time, in milliseconds, it to serve the first request
    of the complex application.


    Table 65. Time to First Request


    | | REST App | Complex App |

    |---|---|--|

    | JAR | 165 ms | 170 ms |

    | Fast-JAR | 160 ms | 160 ms |

    | Uber-JAR | 185 ms | 190 ms |

    | Native | 10 ms | 25 ms |


    > The startup time includes the time that Quarkus needs to start also the time
    to first request. The numbers in Table 65 were made on macOS with a JVM 11 with
    no optimisation. To get these numbers I followed a recipe described on the Quarkus
    guide:[1]


    +   - Loop a GET curl on a REST endpoint;

    - Startup the application;

    - Startup starts when Quarkus starts, finish counting when the first request is
    served;

    - Repeat 10 times and calculate the average time.


    Depending on your hardware and JVM version you will get different results. What''s
    important here is to be able to compare startup times depending on the packaging
    format.


    # Pros and Cons


    So, which format to use? Well, it depends if you want a JVM or Native mode and
    if you target deploying the executable on a container or not. Table 66 gives you
    some pros and cons on each'
