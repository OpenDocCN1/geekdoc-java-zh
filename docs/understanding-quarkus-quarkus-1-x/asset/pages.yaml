    # Customising Mappings


    @Entity and @Id are the only required annotations to map an entity to a relational
    database. Then, Hibernate applies the mapping rules, also known as configuration
    by exception. This allows you to write the minimum amount of code to get your
    application running, relying on the provider''s defaults. For example, the entity
    name is mapped to a relational name (e.g. the Book entity is mapped to a BOOK
    table). Attribute names are mapped to a column name (e.g. the id attribute, or
    the getId() method, is mapped to an ID column). If you don''t want the provider
    to apply the default rules, you can customise the mapping to your needs using
    metadata as shown in Listing 78.'
