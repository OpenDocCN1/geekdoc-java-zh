  md: '# Table 49. Main io.smallry.mutiny Subpackages


    | Subpackage | Description |

    |---|---|

    | root | Root package of the Mutiny APIs |

    | converters | Converters Uni and Multi from/to several formats |

    | operators | Operations that can be done on Uni and Multi |


    # Table 50. Main Mutiny APIs


    | API | Description |

    |---|---|

    | Uni | Lazy asynchronous action that follows the subscription pattern: the action
    is only triggered once a subscriber subscribes to it |

    | Multi | Publishes an unlimited number of sequenced elements according to the
    demand received from its subscriber


    Because Quarkus brings imperative and reactive programming together transparently,
    the Mutiny extension is offset by several extensions and you don''t have to declare
    it explicitly. But if you want to use it in a standalone application, you will
    have to add the Mutiny extension as seen in Listing 173.


    # Listing 173. Mutiny Extension


    ```

    <dependency>

    <groupId>io.quarkus</groupId>

    <artifactId>quarkus-mutiny</artifactId>

    </dependency>

    ```


    # 8.1.1. Uni and Multi


    Mutiny provides two types that are used everywhere: a Uni and Multi. Both Uni
    and Multi are asynchronous types. They receive and fire events, at any time. You
    can see this as:


    +   - A Uni handles a stream of 0.1 item.

    - A Multi handles a stream of 0.* items (potentially unlimited). You can think
    of a Multi as being a publisher.


    Understand the difference between these two types, let''s create them. On both
    Uni and Multi, Mutiny comes with a set of createFrom methods allowing you to create
    these types based on items, an array of items, a range, etc. Listing 174 shows
    how to create a Uni based on a single type of type String. You will soon see how
    this code works, but let for now that this item of type String is transformed
    to upper case and displayed on the console.


    # Listing 174. Creating a Uni From an Item


    ```

    Uni.createItem("Terri Lyne Carrington")

    .transform(s -> s.toUpperCase() + " ")

    .subscribe().with(System.out::println);

    ```'
