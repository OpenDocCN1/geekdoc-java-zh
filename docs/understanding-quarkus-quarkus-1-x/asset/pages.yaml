    # 5.2.4. Querying Entities


    The relational database relies on Structured Query Language, or SQL. This programming
    language is designed for managing relational data (retrieval, insertion, updating
    and deletion), and its syntax is table oriented. You can select columns from tables
    of rows, join tables together, combine the results of two SQL queries through
    unions, and so. There are objects here, only rows, columns, and tables. In the
    Java world, where we manipulate objects, a language for tables (SQL) has to be
    tweaked to suit a language made of objects (Java). This is where Persistence Query
    comes into play.


    JPQL (Java Persistence Query Language) is the language defined in JPA to query
    entities stored in a relational database. JPQL syntax represents SQL but operates
    against objects rather than directly working with database tables. JPQL does not
    use the underlying database structure or deal with columns or rows but objects
    and attributes. And, for that, it uses the dot (.) notation that Java developers
    are familiar with.


