  md: '# 7.3.4. Circuit Breaker


    Having fallback and a timeout is a good start. But it doesn''t solve the problem
    that the client could still be doing HTTP requests on a resource. Invocations
    will timeout and fall back, but the client could just keeping sending load in
    the network and hammering the resource which could be overloaded. A circuit breaker
    is useful for stopping sending load to the system, when part of the system becomes
    temporarily unstable.


    A circuit breaker prevents repeated failures, so that dysfunctional services or
    APIs fail fast. As shown in Figure 45, a circuit breaker is similar to an electrical
    circuit breaker since it has the following states:


    +   * Closed: A closed-circuit represents a functional system available to its
    clients. When some failures are detected, the state changes to half-open.


    +   * Half-open: In this state, it checks whether the failed component is restored.
    If so, it closes back the circuit. Otherwise, it moves to an open state.


    +   * Open: An open state means the service is temporarily disabled. After checks
    have been made, it verifies whether it''s safe to switch to a half-open state.


    ![](img/b367e296ed76005032fc73f31e5a1c75_241_0.png)


    Figure 45. Closed and open circuit'
  merge: -1
