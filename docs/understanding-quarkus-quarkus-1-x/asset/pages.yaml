  md: '# 10.4. Summary


    Cloud native is all about pushing an application or a microservice to the cloud.
    Quarkus allows you to very easily package Docker images and deploy them to different
    Kubernetes platforms. That''s what Quarkus means with its tagline "Cloud Native
    Ready". It comes with all the required extensions to make our cloud experience
    easy.


    GraalVM, Docker and Kubernetes are very complex tools. Compiling a Java application
    with several dependencies on GraalVM is tricky. Writing Dockerfiles can be difficult
    but nothing compared to writing a set of Kubernetes manifest files. Of course
    you have different tools to help you, but Quarkus makes it easy by integrating
    them and they ease our pain (such as Decorate for Kubernetes files).


    The next chapter is about Tests. If you liked the way Quarkus simplifies deployment,
    then you will love the way it helps you with testing and mocking.


