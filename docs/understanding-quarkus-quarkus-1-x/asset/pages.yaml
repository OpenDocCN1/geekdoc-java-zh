    a method, regardless of whether the client is executed within a transaction. If
    the client is running within a transaction, the container suspends that transaction
    temporarily, creates a second one, commits or rolls it back, and then resumes
    the first transaction. This means that the success or failure of the second transaction
    has no effect on the existing client transaction. You should use REQUIRES_NEW
    when you don''t want a rollback to affect the client |

    | SUPPORTS | The transactional method inherits the client''s transaction context.
    If a transaction context is available, it is used by the method; if not, the container
    invokes the method with no transaction context. You should use SUPPORTS when you
    have read-only access to the database table. |'
