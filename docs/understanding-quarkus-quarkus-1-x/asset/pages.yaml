  md: '![](img/b367e296ed76005032fc73f31e5a1c75_85_0.png)


    Figure 20. Class diagram with @Default


    But sometimes you have to choose between several implementations. That''s when
    you need to use Qualifiers.


    # Injecting Qualified Beans


    At system initialise the container must validate that exactly one bean satisfying
    each injection point exists. Meaning that, if no implementation of NumberGenerator
    is available, the container will inform you of an unsatisfied dependency and will
    not deploy the application. If there is only one implementation, injection will
    work using the @Default qualifier. If one or more default implementations were
    available, the container would inform you of an ambiguous dependency and will
    not deploy the application. Because the typesafe resolution algorithm fails when
    the container is unable to identify exactly one bean to inject.


    So does a component choose which implementation IsbnGenerator or IssGenerator
    is to be injected? Most frameworks rely on external XML annotations to declare
    and inject beans. CDI uses qualifiers, which are basically Java annotations that
    bring typesafe injection and disambiguate a type without having to fall back on
    String-based names.


    There are several book formats, the most common are:


    +   - ISBN (International Standard Book Number): Thirteen-digit book identifier
    which is intended to be unique.

    - ISSN (International Standard Serial Number): Eight-digit serial number used
    to uniquely identify a serial publication.


    Let''s say we have an application with a BookService that creates books with a
    13-digit ISBN number and a LegacyBookService that creates books with an 8-digit
    ISSN number. As you can see in Figure 21, both services inject a reference of
    the same NumberGenerator interface. The services distinguish between the two implementations
    by using qualifiers.'
