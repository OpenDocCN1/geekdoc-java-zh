  md: '# Creating a Deployment


    In Kubernetes, the idea is to describe a desired state of the cluster. Here, we
    want to have a single instance of a Java application running on a node. This desired
    state is called a Deployment and it manages one or more Pods. A Kubernetes pod
    is a group of one or more containers (in our case it is the container running
    the agoncal/hello-fascicle image), tied together for the purposes of administration
    and networking. The deployment checks on the health of the pods and restarts the
    pod''s container if it terminates. Deployments are the recommended way to make
    the creation and scaling of pods.


    The following kubectl command creates a deployment called fascicle-deployment.
    This deployment manages a pod that runs a container based on the provided Docker
    image.


    ```

    kubectl create deployment fascicle-deployment --image=agoncal/hello-fascicle

    deployment.apps/fascicle-deployment created

    ```


    View the Deployment:


    ```

    $ kubectl get deployments


    NAME               READY   UP-TO-DATE   AGE

    fascicle-deployment   0/1     15s          13s

    ```


    View the Pod:'
  merge: -1
  pgno: 396
- img_proc: true
