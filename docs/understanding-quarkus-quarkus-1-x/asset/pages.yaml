  md: '# 12.2. Developing the REST Book Microservice


    Now, it''s time to develop a microservice that returns books. The Book microservice
    returns random book data such as the book''s title, the author, the genre and
    the publisher. The Book microservice also needs to interact with the ISBN Number
    microservice to get an ISBN. In this section, we:


    +   * Implement a Book REST API using JAX-RS and Quarkus

    * Generate the JSON Output with JSON-P

    * Invoke the ISBN Number microservice thanks to REST Client

    * Handle fault tolerance

    * Add metrics.


    # 12.2.1. Bootstrapping the Book Microservice


    To bootstrap the Book microservice we use the following Maven command (remember
    that you also go to https://code.quarkus.io if you prefer):


    Listing 274. Command to Bootstrap the Book Microservice


    ```

