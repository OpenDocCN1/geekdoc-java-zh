  md: '# 2.4.2. Kubernetes


    Kubernetes (a.k.a. K8s) is an orchestrator for containerised applications.[60]
    It takes its name from a Greek word meaning helmsman, captain: Docker packages
    applications inside containers, Kubernetes is the captain sailing those containers.
    Kubernetes can schedule, scale, heal, update, or stop several containers.


    Kubernetes is platform agnostic (bare metal, VM, cloud, etc.): as long as you
    can install an agent, it works! Package your application in a container, declare
    the desired state of your application on a manifest file, give all lot to Kubernetes
    and it will manage it. It will decide which node to run the container (depending
    if the container needs a lot of CPU or ram) and also how many instances of the
    container. That''s because Kubernetes is watching the state of the cluster, and
    instantiates more containers (without a human getting involved) if the instances
    are under heavy load. The load gets lower, if a node fails, it instantiates another
    one.


    For this reason, as shown in Figure 10, a Kubernetes cluster is made up of a master,
    one or several nodes where one or several pods are deployed. Kubernetes runs your
    application by placing containers into Pods on Nodes. A pod is a sandbox to run
    multiple containers and contains a network, kernel namespaces, volumes, etc. All
    containers in a single pod share the pod environment.


    A node may be a virtual or physical machine, depending on the cluster.


    ![](img/b367e296ed76005032fc73f31e5a1c75_43_0.png)


    Figure 10. Kubernetes cluster


    A Kubernetes cluster has a minimum of one Master. A master (a.k.a. master node)
    is not supposed to run workload but, instead, it controls and manages a set of
    nodes (a.k.a. worker nodes). A master is made of:


    +   * API Server: Front controller to which we talk to (through a rest API, or
    command-line interface) when managing the entire cluster.'
