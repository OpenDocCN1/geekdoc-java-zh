  md: 'document. The entry point is the java.json.Json class, which provides a createParser
    method that returns a java.stream.JsonParser from a specified input source (such
    as a Reader or InputStream). Listing 157 shows how to create a JSON parser without
    any configuration, or by passing properties to the createParserFactory() method.


    # Listing 157. Getting a JSON Parser


    ```

    String reader = new StreamReader("hello\":world\");

    JsonParser parser = Json.createParser(reader);


    // Configuring the parsing factory

    String reader = new StreamReader("hello\":world\");

    JsonParserFactory factory = Json.createParserFactory(config);

    JsonParser parser = factory.createParser(reader);

    ```


    The JsonParser offers a low-level access to the JSON object based on a pull streaming
    model. The parser generates events when a JSON name/value is reached or the beginning/end
    of an array is. Table 42 lists all of the events triggered by the parser.


    | Event | Description |

    | --- | --- |

    | START_OBJECT | Event for start of a JSON object (fired when { is reached) |

    | END_OBJECT | Event for end of an object (fired when ) is reached) |

    | START_ARRAY | Event for start of an array array (fired when [ is reached) |

    | END_ARRAY | Event for end of an array (fired when ] is reached) |

    | KEY_NAME | Event for a name in name(key)/value pair of a JSON object |

    | VALUE_STRING | Event for a string value |

    | VALUE_NUMBER | Event for a number value |

    | VALUE_TRUE | Event for a true value |

    | VALUE_FALSE | Event for a false value |

    | VALUE_NULL | Event for a null value |


    Let''s take a simple example to explain how events work. The code in Listing 158
    creates a parser based on a very simple JSON document that contains only one key
    hello and one value world. Then, the parser loops (parser.hasNext()) until reaching
    the last event of the document (END_OBJECT) and displays the start and the end
    of the JSON object, the keys and the values.'
