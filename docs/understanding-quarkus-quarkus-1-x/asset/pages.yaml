  md: "```\nopenapi: 3.0.3\ninfo:\n  title: Generated API\n  version: \"1.0\"\npaths:\n\
    \  /authors/{index}:\n    get:\n      parameters:\n        - name: index\n   \
    \       in: path\n          required: true\n          schema:\n            format:\
    \ int32\n            type: integer\n      responses:\n        \"200\":\n     \
    \     description: OK\n          content:\n            text/plain:\n         \
    \     schema:\n                type: string\n```\n\nThe default contract described\
    \ in Listing 122 is comprehensive enough, but it lacks documentation. We could\
    \ give some description of the API, or an example of how to use it and if you\
    \ could say that the index parameter is required or not, etc. The Eclipse MicroProfile\
    \ OpenAPI allows you to customise some of your REST endpoints thanks to annotations.\n\
    \nWhen you expose RESTful web services with Quarkus, you can get the OpenAPI contract\
    \ under the URL /openapi. You can access it with your browser, or you can use\
    \ CURL. With CURL, by changing the HTTP header, you can retrieve the OpenAPI document\
    \ in several formats:\n\n+   - YAML: curl http://localhost:8080/openapi\n- JSON:\
    \ curl -H \"Accept: application/json\" http://localhost:8080/openapi\n\n# Customising\
    \ OpenAPI Contracts\n\nRelying on the JAX-RS mapping is usually not enough. You\
    \ want to document your APIs, and for that, Eclipse MicroProfile OpenAPI has a\
    \ set of annotations. For example, in Listing 123 we add extra information to\
    \ the JAX-RS annotations. The getScifiAuthor() method we add an @Operation annotation\
    \ so we can give a summary to the endpoint. This is very useful for a third-party\
    \ partner to understand what your API does. The @APIResponse gives some information\
    \ about the response returned by the API. Here, we express that the API can return\
    \ a 200-OK and a 204-No Content."
