  md: "# 9.2.3. Metrics Format\n\nSo far we've seen metrics representation in JSON.\
    \ In fact, data exposed via the REST endpoints under /metrics can be expressed\
    \ in two different data formats:\n\n+   - JSON format: Used when the HTTP Accept\
    \ header matches application/json.\n- OpenMetrics format: Used when the HTTP Accept\
    \ header matches text/plain. If the Accept header is not present, or equally accepts\
    \ text/plain and application/json, then this format is returned.\n\nThe metrics\
    \ are exposed either in JSON or OpenMetrics format so that they can be processed\
    \ by additional tools such as Prometheus, and stored for analysis and visualisation.\n\
    \nWhen using JSON, the REST API will respond GET requests. You just need to pass\
    \ the right Accept header:\n\n```\n$ curl -X GET -H \"Accept: application/json\"\
    \ http://localhost:8080/metrics/application\n```\n\nThis returns the metrics data:\n\
    \n```\n{\n  \"BookResource.meteredgetBook\": {\n    \"count\": 278,\n    \"meanRate\"\
    : 0.6579704184186,\n    \"oneMinRate\": 0.6481905990593267,\n    \"fiveMinRate\"\
    : 0.6436398552008425,\n    \"fifteenMinRate\": 0.6214981180132817\n  }\n}\n```\n\
    \nBut there is also a shadow tree that provides OPTIONS provides the metadata\
    \ associated to a metric. The following cURL command changes the GET verb to OPTIONS:\n\
    \n```\n$ curl -X -H \"Accept: application/json\"\nhttp://localhost:8080/metrics/application\n\
    ```\n\nThe result is different. The output doesn't give you any measures, but\
    \ instead, the metadata associated with a metric (here you can see the type of\
    \ the metric and the description that we've set in our annotation in Listing 211):"
