    $ mvn -Dplugin=io.quarkus:quarkus-maven-plugin help:describe


    This plugin has 12 goals:

    quarkus:add-extension

    quarkus:add-extension

    quarkus:analyze-call-tree

    quarkus:build

    quarkus:create

    quarkus:create-extension

    quarkus:dev

    quarkus:generate-config

    quarkus:help

    quarkus:list-extensions

    quarkus:native-image

    quarkus:remote-dev

    ```


    Another way to bootstrap a Quarkus application is to use the Quarkus blueprint
    for the JHipster generator [1]. This is a community-driven effort to be able to
    generate an entire application, the JHipster way, using Quarkus.


    # 3.2.4. Generating Some Code


    As you''ve seen, we have several choices to bootstrap a Quarkus application, but
    let''s use the Maven plugin from the command line. The following command uses
    the Quarkus Maven plugin to generate a REST endpoint called ArtistResource located
    at the /artists path. Because we will need some JSON Binding, add the JSON-B extension:


    ```

    mvn io.quarkus:quarkus-maven-plugin:1.9.0.Final:create \

    -DPlatformVersion=1.9.0.Final \

    -DProjectGroupId=org.agonal.fascicle \

    -DProjectArtifactId=getting-started \

    -DProjectVersion=1.0-SNAPSHOT \

    -DClassName="org.agonal.fascicle.quarkus.gettingstarted.ArtistResource" \\

    -Dpath="/artists" \

    -DExtensions="resteasy-json"

    ```


