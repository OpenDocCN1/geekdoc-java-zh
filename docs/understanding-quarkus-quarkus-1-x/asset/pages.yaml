    # # 7.4. Summary


    By design, in a microservice architecture, microservices have to talk to each
    other. Being RESTful web services, they use the HTTP protocol to target specific
    URLs, with given parameters, verbs and passing payloads following different formats
    (a.k. media types or mime types) with headers, responses. Consuming HTTP can be
    cumbersome, your JAX-RS comes with a client API. But Eclipse MicroProfile REST
    goes further and simplifies the consumption of a remote microservice response.
    By using interfaces, the client invokes a method on an interface without worrying
    about the underlying complexity.


    In this chapter, we have also looked at Cross-Origin Resource Sharing (CORS).
    It is a way to prevent browsers'' requests from different domains. Quarkus allows
    us to configure CORS so requests can be accepted or not, depending on the level
    of security you need.


    But requests start to fail from domain to domain, from microservice failures start
    to appear. Eclipse MicroProfile Fault Tolerance allows us to improve the resilience
    of our applications, without having an impact on the complexity and result of
    our business logic. Fault tolerance is about leveraging different strategies to
    guide the execution and result of some logic. Fallbacks, timeouts and circuit
    breakers are popular patterns in this area of distributed systems.


    Even if REST is a very common architectural style when it comes to microservices,
    it''s not the only one. In the next chapter, Event-Driven Microservices, you will
    see how reactive programming and reactive messaging can be used to decouple microservices.


