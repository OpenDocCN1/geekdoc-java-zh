  md: "@ThirteenDigits implements NumberGenerator {...}\n\nScopes can be mixed. A\
    \ @SessionScoped bean can be injected into a @RequestScoped or @ApplicationScoped\
    \ bean and vice versa.\n\n# ## 4.4. Events\n\nIn a few sections, you will learn\
    \ about Quarkus life cycle, which is based on CDI events. Let's first discover\
    \ CDI events. CDI events allow beans to interact with compile time dependency\
    \ at all. One bean can define an event (using the jakarta.enterprise.event.Event\
    \ interface), another bean can fire the event (using the fire() method), and yet\
    \ another bean can handle the event (using @Observes annotation). These beans\
    \ can be in separate packages and even in separate JARs of the application. This\
    \ basic schema follows the observer/observable design pattern from the Gang of\
    \ Four[110].\n\nEvent producers fire events using the jakarta.enterprise.event.Event\
    \ interface. A producer raises events by calling the fire() method, passes the\
    \ event, and is not dependent on the observer. Listing 33, the BookService fires\
    \ an event (bookAddedEvent) each time a bean is created. The bookAddedEvent.fire(book)\
    \ fires the event and notifies any observer methods observing this particular\
    \ event. The content of this event is the Book object itself that will be carried\
    \ from the producer to the consumer.\n\nListing 33. The BookService Fires Each\
    \ Time a Bean Is Created\n\n```\n@ApplicationScoped\npublic class BookService\
    \ {\n\n  @Inject\nNumberGenerator numberGenerator;\n\n  @Inject\nEvent<Book> bookAddedEvent;\n\
    \n  public Book createBook(String title, Float price, String description) {\n\
    \    Book book = new Book(title, price, description);\n    book.setIsbn(numberGenerator.generateNumber());\n\
    \    bookAddedEvent.fire(book);\n    return book;\n  }\n}\n```\n\nEvents are fired\
    \ by the event producer and subscribed to by event observers. An observer is a\
    \ bean with one or more observer methods. Each of these methods takes an event\
    \ as a parameter that is annotated with the @Observes annotation and optional\
    \ qualifiers. The observer method is notified if an event matches the event type\
    \ and all the qualifiers. Listing 34 shows the inventory service whose job is\
    \ to keep the inventory of available books by increasing the book stock. It has\
    \ an addBook() method that observes any event typed with"
