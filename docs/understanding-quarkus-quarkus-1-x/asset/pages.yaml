  md: "| Subpackage | Description |\n| --- | --- |\n| javafx.enterprise.event | Event\
    \ and observer APIs |\n| javafx.enterprise.util | Utility package |\n| javafx.interceptor\
    \ | Interceptor APIs (JSR 318) |\n\nAlong with APIs, CDI comes with a set of annotations.\
    \ Table 4 lists a subset of the most commonly used annotations.\n\nTable 4. Main\
    \ CDI Annotations\n\n| Annotation | Description |\n| --- | --- |\n| @Inject |\
    \ Identifies injectable constructors, methods, and fields |\n| @Qualifier | Identifies\
    \ qualifier annotations |\n| @ApplicationScoped, @SessionScoped, @RequestScoped,\
