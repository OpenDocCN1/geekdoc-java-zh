  md: "proper JAX-RS and MicroProfile annotations.\n\nFirst, we start off an interface\
    \ that provides calls to the remote service. The methods of the interface should\
    \ match the RESTful APIs of the endpoint (annotations, return type, list of arguments\
    \ and exception declarations). In fact, the client is similar to the web service\
    \ itself that you can basically copy/paste the resource and make it an interface.\
    \ If we want to access the endpoint in Listing 162, we create an interface that\
    \ looks like Listing 165.\n\n# Listing 165. Client Interface\n\n```\n@Path(\"\
    /api/isbn\")\n@Produces(MediaType.APPLICATION_JSON)\n@RegisterRestClient\npublic\
    \ interface IsbnProxy {\n\n    @GET\n    IsbnNumber generateIsbn(@PathParam(\"\
    separator\") boolean separator);\n}\n```\n\nThe purpose of the annotations in\
    \ Listing 165 is the following:\n\n+   - @RegisterRestClient Quark Quark that\
    \ this interface is meant to be available for CDI injection as a REST Client.\n\
    - @Path, @GET and @PathParam are the standard J-RS annotations used to define\
    \ how to access the service.\n- @Produces defines the expected content-type. While\
    \ @Consumes and @Produces are optional auto-negotiation is supported, it is recommended\
    \ to annotate your interface with them to define precisely the expected content-types.\n\
    \nBy using a Java interface as the contract, you will be able to have direct access\
    \ to the methods within the client and with mistakes or not following the contract\
    \ won't happen. Eclipse MicroProfile REST automatically generates a client instance\
    \ based on what is defined in the interface. The sequence of invocation is better\
    \ described in the diagram shown in Figure 41. The client (here BookResource)\
    \ invokes a method on the Java interface IsbnProxy and Eclipse MicroProfile REST\
