    # ## 5.5. Hibernate ORM with Panache


    As you''ve seen, Quarkus supports JPA and JTA. This means you can use these two
    APIs. If you want to ease your development life, you can also use Hibernate ORM
    with Panache. Hibernate ORM is the Quarkus JPA implementation and offers you the
    full breadth of a JPA object-relational mapper. It makes complex mappings and
    queries possible, but it does not make simple and common mappings trivial. Hibernate
    ORM with Panache (pronounced *pa-nash*) focuses on simplifying your JPA entities
    as well as your repositories.'
