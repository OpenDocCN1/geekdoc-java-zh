  md: '# 4.4. Logging


    When developing an application, we know that there are chances that it won''t
    work as expected. In order to check what went wrong, we can use debuggers while
    developing, but not in production (most debuggers won''t be available in production).
    Hence, adding logging statements in the source code to help find potential bugs
    is handy.


    Logging is so common, that Java provides a built-in framework in the java.util.logging
    package. But throughout the history of the Java platform, many logging frameworks
    have appeared, making it difficult sometimes to integrate with each other. Quarkus
    acknowledges this diversity and integrates the following APIs for logging:


    +   * JDK JUL (Java Logging).[114]

    * JBoss Logging.[115]

    * SLF4J.[110]

    * Apache Commons Logging.[117]


    Listing 55 shows some code that all these supported logging frameworks.


