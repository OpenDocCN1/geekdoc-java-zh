- img_proc: true
  md: "# 6.2.1. Understanding OpenAPI v3 Specification\n\nOpenAPI specification (formerly\
    \ known as the Swagger Specification) is an API description format for REST APIs.\
    \ It is a specification for machine-readable interfaces for describing, producing,\
    \ consuming, and visualizing RESTful web services. An OpenAPI file allows you\
    \ to describe your own API:\n\n+   - Available endpoints and operations on each\
    \ endpoint (GET, POST, etc.),\n- Input and output parameters for each operation,\n\
    - Authentication methods,\n- Contact information, license, terms of use and other\
    \ information.\n\nThe specifications can be written in YAML or JSON. The format\
    \ is easy to learn and readable to both humans and machines.\n\nEvery API definition\
    \ must include the version of the OpenAPI Specification that this definition is\
    \ based on:\n\n```\nopenapi: 3.0.1\n```\n\nThe info section contains API information:\n\
    \n+   - title: the API name.\n- description (optional) is extended information\
    \ about the API. It can be inline and supports CommonMark and HTML syntax for\
    \ rich text representation.\n- version: an arbitrary string that specifies the\
    \ version of the API.\n\n```\ninfo:\n  title: Generated API\n  version: \"1.0\"\
    \n  tags:\n    name: Author Endpoint\n```\n\nThe paths section defines individual\
    \ endpoints (or paths) of the API, and the HTTP methods (or operations) supported\
    \ by these endpoints (GET, POST, PUT, DELETE, etc.). For example, return a specific\
    \ author can be described as an HTTP GET operation on the /authors/{index} path:\n\
    \n```\npaths:\n  /authors/{index}:\n    get:\n      summary: Returns an author\
    \ for a given index\n```\n\nOperations can have parameters passed via URL path\
    \ (/authors/{index}), query string (/authors?name=Adams), headers (X-CustomHeader:\
    \ Value) or cookies (Cookie: debug=0). You can define the parameter data types,\
    \ format, whether they are required or optional, and other details:"
  merge: -1
  pgno: 190
- img_proc: true
  md: "```\nparameters:\n  - name: index\n    in: path\n    description: Author index\n\
    \    required: true\n    schema:\n      format: int32\n      type: integer\n```\n\
    \nFor each operation, you can define possible status codes, such as 200-OK or\
    \ 404-Not Found, and the response body. Schemas can be defined inline or referenced\
    \ via $ref. You can also provide example responses for different content types:\n\
    \n```\nresponses:\n  \"204\":\n    description: The author is not found for a\
    \ given index\n  \"200\":\n    description: OK\n    content:\n      text/plain:\
    \ {}\n```\n\n# 6.2.2. Exposing OpenAPI Contracts\n\nEclipse MicroProfile OpenAPI\
    \ integrates with Java API for RESTful Web Services. That means that OpenAPI processes\
    \ all the relevant JAX-RS annotations (such as @Path, @Consumes, etc.) as well\
    \ as objects used as input or output to JAX-RS annotations. Without any additional\
    \ annotation or configuration, you get your API documentation out-of-the-box.\
    \ The JAX-RS classes and annotations are scanned so that a default documentation\
    \ is generated. The RESTful web service described in Listing 121 has only JAX-RS\
    \ annotations.\n\nListing 121. Author Endpoint with no OpenAPI Annotations\n\n\
    To the integration of JAX-RS, Eclipse MicroProfile OpenAPI is capable of generating\
    \ a default contract as described in Listing 122."
  merge: -1
