    # 10.3.1. Kubernetes Manifest Files


    Deploying a Docker image to a Kubernetes cluster implies several steps. You need
    to create a Deployment, associate it Services, several Pods, etc. All these steps
    can be done separately using the command line interface kubectl (see Appendix
    A if you want to know more about creating a deployment on the command line). But
    this can be cumbersome and error prone. The other way to deploy on Kubernetes
    is using manifest files.


    A Kubernetes manifest file describes the desired state of the cluster, not how
    we want to achieve this state, for example, the desired state would be "I want
    three instances of Quarkus, so that''s 3 pods". K8s installs the desired state
    in the actual state. If something goes wrong, and the actual state differs from
    the desired state (e.g. one instance of Quarkus fails), Kubernetes will do everything
    to get back the desired state in the actual state. It is very common to define
    manifests in the form of YAML files and send them to Kubernetes via commands as
    kubectl apply -f vintagestore.yaml or kubectl delete -f vintagestore.yaml. Let''s
    see how to write manifests to deploy one of the Docker images we previously built.


    First, we need to define a deployment as shown in Listing 223. Remember that Kubernetes
    manages container-based resources. In the case of a Deployment, we are creating
    a set of resources to be managed (in our case, agonal/quarkus-jar Docker image).
    The manifest file starts with the apiVersion. Next, we specify some metadata and
    give a name to the Deployment. Finally, we get into the spec object where we describe
    the state of the deployment that we expect. We start in this case, by saying that
    whatever Pods we deploy, we want to have 1 replica (one instance). And then we
    select (the selector object) the Pods affected by this Deployment, the ones that
    match certain labels (matchLabels) which are defined in Listing 224.'
