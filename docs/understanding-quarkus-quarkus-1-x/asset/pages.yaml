  md: 'That''s when Quarkus comes into play.


    In this fascicle, you will learn Quarkus but also its ecosystem. You will discover
    Quarkus internals and how you can use it to build REST and reactive microservices,
    bind and process JSON or datastores in a transactional way. With Cloud Native
    and GraalVM in mind, Quarkus makes packaging and orchestrating your microservices
    with Docker and Kubernetes easy.


    This fascle has a good mix of theory and practical examples. It is the companion
    book of Practising Quarkus where you learn how to develop an entire microservice
    architecture.


    # E.4. Practising Quarkus


    Microservices is an architectural style that structures an application as a collection
    of distributed services. Microservices are certainly appealing but there are many
    questions that should be asked prior to diving into this architectural style:
    How do I deal with an unreliable network in a distributed architecture? How do
    I test my services? How do I monitor them? How do I package and execute them?


    That''s when Quarkus comes into play.


    In this fascicle you will develop an entire microservice application using Quarkus
    as well as MicroProfile. You will expose REST endpoints using JAX-RS and OpenAPI,
    customise the JSON output thanks to JSON-B and deal with persistence and transaction
    with Hibernate ORM with Panache and JTA. Having distributed microservices, you
    will implement health checks and add some metrics so you can monitor your microservice
    architecture. Finally, thanks to GraalVM you will build native executables, and
    package and execute them with Docker.


    This article is very practical. It is the companion book of the more theoretical
    Understanding Quarkus where you will learn more about Quarkus, MicroProfile, REST
    and reactive microservices, as well as Cloud Native and GraalVM.'
