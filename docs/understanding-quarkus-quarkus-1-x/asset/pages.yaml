  md: '# # Chapter 3. Getting Started


    In the previous Understanding Quarkus chapter, you learnt about Quarkus, Microservices,
    MicroProfile, GraalVM and Cloud Native. You''ve also looked at what Quarkus is
    and where it comes from. From time to see.


    To start with a new technology, there is nothing better than a simple "Hello World"
    kind of example. In this Getting Started chapter, you will be developing your
    first Quarkus application. It is a simple application made up of only few classes
    with not much technical complexity. The idea is to develop something simple to
    understand and set up so that you are sure you have the base to follow the chapters
    coming up.


    Make sure your development environment is set up to execute the code in this chapter.
    You can go to Appendix A to check that you have all the required tools installed,
    in particular JDK 11.0.8 or higher, GraalVM 20.2.0, Maven 3.6.x and Docker. In
    this code you can be found at https://github.com/agonal/agonal-fascalicle-quark/tree/1.0/getting-started


    # ## 3.1. Developing Your First Quarkus Application


    Let''s develop a simple application that highlights the key features of Quarkus.
    In this chapter, we''ll use the Maven Plugin to generate a simple Quarkus application.
    We will end-up with a Maven directory structure with a set of test classes and
    business classes that define a RESTful web service which produces a JSON representation
    of an Artist. We''ll use cURL to interact with this RESTful web service (see Appendix
    A for more information on cURL). Finally, to GraalVM, we will build an executable
    out of our code and containerize it with Docker. With Maven to build this project
    because it is the most commonly used build system these days. Plus, we can use
    Maven in the command line and most IDEs support it.


    # ## 3.2. Bootstrapping the Application


    Let''s bootstrap a Quarkus application. For that, we have different ways to start
    a project with a minimum amount of code: a web interface, an IDE plugin, or a
    Maven plugin. Let''s quickly see these options before bootstrapping the application
    with the Maven plugin.


    # ### 3.2.1. Web Interface


    If you want to use a web interface, go to https://code.quarkus.io. As shown in
    Figure 16, you can choose your tool (Maven or Gradle), set the groupId and artifactId,
    but most importantly, select the extensions you need. For our first application,
    we just need a REST endpoint and JSON Binding, so we can tick two boxes, set all
    the Maven coordinates, and click on the "Generate your application" button. This
    action will download a zip file containing enough code to bootstrap an application.'
  merge: -1
  pgno: 55
