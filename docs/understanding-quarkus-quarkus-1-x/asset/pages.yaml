    ));\n}\n```\n\n# 11.2.2. Hamcrest\n\nHamcrest is a framework for writing matcher\
    \ objects allowing \"match\" rules to be defined declaratively[1]. When writing\
    \ tests it is difficult to get the balance right between overspecifying the test,\
    \ and not specifying enough. Hamcrest allows you to pick out precisely the aspect\
    \ being tested and to describe the values it should have.\n\nListing 246 shows\
    \ a very simple JUnit test. Instead of using JUnit's assertEquals() methods, we\
    \ use Hamcrest's assertThat construct and the standard set of matchers, both of\
    \ which we statically import."
