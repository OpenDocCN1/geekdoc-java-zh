  md: "![](img/b367e296ed76005032fc73f31e5a1c75_86_0.png)\n\nFigure 21. Services represents\
    \ some qualifiers for non-ambiguous injection\n\nA qualifier represents some semantics\
    \ with a type that is satisfied by some implementation of that type. It is a user-defined\
    \ annotation, itself annotated with @javax.inject.Qualifier. For example, we could\
    \ introduce qualifiers to represent 13- and 8-digit number generators, both shown\
    \ in Listing 23 and Listing 24.\n\nListing 23. The ThirteenDigits Qualifier\n\n\
    ```\n@Qualifier\n@Retention(RUNTIME)\n@Target({FIELD, TYPE, METHOD})\npublic @interface\
    \ ThirteenDigits {\n}\n```\n\nListing 24. The EightDigits Qualifier\n\n```\n@Qualifier\n\
    @Retention(RUNTIME)\n@Target({FIELD, TYPE, METHOD})\npublic @interface EightDigits\
