  md: '# Network Fallacies


    When talking about network issues, it''s always interesting to refer to the network
    fallacies. The fallacies of distributed computing are a set of false assumptions
    that programmers make microservice. And what distributed applications invariably
    make.^[160]} The fallacies are:


    +   - The network is reliable;

    - Latency is zero;

    - Bandwidth is infinite;

    - The network is secure;

    - Topology doesn''t change;

    - There is one administrator;

    - Transport cost is zero;

    - The network is homogeneous.


    # 7.3.2. Falling Back


    If a service A calls service B, what happens when service B is down? What is the
    fallback plan in such scenario? A fallback is an alternative plan that may be
    used in case part of the system is unavailable.


    To illustrate fallbacks, let''s have a look at BookResource in Listing 170. This
    REST endpoint has a method to generate book numbers (ISBN and ISSN) on the /books/numbers
    path. Thanks to the @RestClient annotation from Eclipse MicroProfile REST Client,
    the BookResource delegates the number generation to the NumberProxy which ends-up
    invoking the remote NumberException. And what if NumberResource is not available?
    What should we throw? Exception or hang until the microservice becomes available
    again?


    Instead let''s provide a fallback way for generating numbers in case of failure.
    For that, we one fallback method to the BookResource called fallbackGenerateBookNumbers
    and a @Fallback annotation to the generateBookNumbers() method (see Listing 170).'
