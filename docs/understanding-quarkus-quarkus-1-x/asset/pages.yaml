- img_proc: true
  md: "you can see, this class implements the generateIsbnNumbers() method and returns\
    \ fake data. With this fake data, testing the BookResource becomes easier and\
    \ doesn't depend on any remote microservice.\n\nListing 252. Mocking ISBN Microservice\
    \ for Testing\n\n```\n@Mock\n@ApplicationScoped\n@RestClient\npublic class MockIsbnResourceProxy\
    \ implements IsbnResourceProxy {\n    @Override\n    public IsbnNumbers generateIsbnNumbers()\
    \ {\n        IsbnNumbers isbnNumbers = new IsbnNumbers();\n        isbnNumbers.setIsbn13(\"\
    Mock isbn 13\");\n        isbnNumbers.setIsbn10(\"Mock isbn 10\");\n        return\
    \ isbnNumbers;\n    }\n}\n```\n\nIf you look under the hood, the @Mock annotation\
    \ is in fact a CDI alternative (refer back to Chapter 4 if you want to know more\
    \ about CDI alternatives). So the code in Listing 253 is the same as in Listing\
    \ 252. We declare the class as being an @Alternative of @Priority(1) and it has\
    \ the same effect as @Mock.\n\nListing 253. Mocking with Alternative\n\n```\n\
    @Alternative\n@Priority(1)\n@ApplicationScoped\n@RestClient\npublic class MockIsbnResourceProxy\
    \ implements IsbnResourceProxy {\n    //...\n}\n```\n\nThis is one way we can\
    \ provide a global mock that all Quarkus tests can use. But if we don't want to\
    \ have a globally defined mock, but would rather have our mock only within the\
    \ scope of one test? We can achieve that using @Inject. @Mock results in a mock\
    \ implementation in a test class.\n\nIn Listing 254, the BookResourceTest injects\
    \ a mock implementation of the IsbnResourceProxy thanks to @Inject. Then, in the\
    \ @BeforeEach method we use Mockito to return fake data when the generateIsbnNumbers()\
    \ is invoked. This means that when the shouldRandomBook test is executed, the\
    \ BookResource endpoint is invoked and the fake data returned from the mocked\
    \ IsbnResourceProxy implementation."
