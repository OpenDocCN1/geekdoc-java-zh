  md: "You can rename your implementations to whatever you want and rename your qualifier\
    \ - the injection point will not change (that's loose coupling). As you can see,\
    \ CDI is an elegant way to have typesafe injection.\n\nAs shown in Listing 29,\
    \ Quarkus simplifies the CDI by allowing you to inject qualified beans without\
    \ the @Inject annotation.\n\n# Listing 29. Injecting Qualified Beans without @Inject\n\
    \n```\n@ApplicationScoped\npublic class LegacyBookService {\n\n@EightDigits\n\
    Generator numberGenerator;\n\npublic Book createBook(String title, Float price,\
    \ String description) {\n    Book book = new Book(title, price, description);\n\
    \    book.setIsbn(numberGenerator.generateNumber());\n    return book;\n}\n}\n\
    ```\n\n# Injecting Alternative Beans\n\nQualifiers let you choose between multiple\
    \ implementations of an interface at development time. But sometimes you want\
    \ to inject an implementation depending on a particular deployment scenario. For\
    \ example, you may want to use a mock number generator in a testing environment.\n\
    \nAlternatives are annotated with the special qualifier javax.enterprise.inject.Alternative.\
    \ By default, alternatives are disabled and need to be enabled to make them available\
    \ for instantiation and injection. Listing 30 shows a mock number generator alternative.\n\
    \n# Listing 30. A Mock Generator Alternative\n\n```\n@Alternative\n@ApplicationScoped\n\
    public class MockGenerator implements NumberGenerator {\n\n    public String generateNumber()\
    \ {\n    return \"MOCK\";\n}\n}\n```\n\nAs you can see in Listing 30, the MockGenerator\
    \ implements the NumberGenerator interface as usual. It is annotated with @Alternative,\
    \ meaning CDI treats it as the default alternative of the NumberGenerator. This\
    \ default alternative could have used the @Default built-in qualifier as shown\
    \ in Listing 31."
