    # A.9.4. Publishing and Receiving Events


    Now that Kafka and ZooKeeper are up and running, let''s publish and receive messages.
    Before that, we need to start the Kafka cluster and create the topics.


    # Starting Kafka


    Before starting Kafka we need to start ZooKeeper. You can do so using the zookeeper-server-start
    command and passing a property file. Let''s use the default zookeeper.properties
    file that is available under the Kafka directory. The following command starts
    ZooKeeper in a standalone mode, listening on port 2181 (as configured in the zookeeper.properties
    file):'
