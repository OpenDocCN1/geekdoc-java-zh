  md: '# Matchers


    # Description


    | | |

    |---| greaterThan, greaterThanOrEqualTo, lessThan, lessThanEqualTo | Tests ordering
    |

    | equalToIgnoringCase | Tests equality ignoring case |

    | equalToIgnoringWhitespace | Tests equality ignoring differences in runs of whitespace
    |

    | containsString, endsWith, startsWith | Tests string matching |


    When you test your REST endpoints with REST Assured, there is no need to add the
    Hamcrest dependency to your pom.xml as REST Assured pushes the Hamcrest dependency
    recursively.


    # 11.2.3 Testing Resources


    A common need is to start some services on which your application depends, before
    Quarkus starts for testing. For example, you might want to start a Postgres database,
    a Kafka broker or an external microservice before executing integration tests.
    For such cases, Quarkus integrates with TestContainers and also provides a few
    annotations to easily manage external resources during testing.


    # TestContainers


    TestContainers is a Java library that supports JUnit tests, providing lightweight,
    throwaway instances of common Docker images. It allows us to use Docker containers
    within our tests. For example, it can use a containerised instance of a PostgreSQL
    database to test a data access layer without requiring a complex setup on the
    developer''s machine. The pre-requisites of using TestContainers are to have Docker
    installed and to use a supported JVM framework (such as JUnit or TestNG).


    Let''s say our application uses PostgreSQL as a relational database and we want
    to run some tests with a running PostgreSQL. With TestContainers it''s easy to
    make such a test. As you can see in Listing 247, JUnit integration is provided
    by means of the @Testcontainers annotation. This extension finds all fields that
    are annotated with @Container and calls their life cycle methods. Containers declared
    as static fields will be shared between tests. They will be started once before
    any test method is executed and stopped after the last test method has executed.
    Containers declared as instance fields will be started and stopped for every test
    method.'
