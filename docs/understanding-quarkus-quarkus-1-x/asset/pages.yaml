  md: "# 6.1. Understanding Processing\n\nJSON-P provides two different programming\
    \ models to process JSON documents: the *Object Model API*, and the Streaming\
    \ API.\n\nSimilar to the DOM API for XML, the Object Model API provides `classes`\
    \ to model JSON objects and arrays (using `JsonObject` and `JsonArray` APIs) in\
    \ a tree structure that represents JSON data in memory. With the DOM API, the\
    \ Object Model API provides flexible navigation and queries to the whole content\
    \ of the tree. It also allows you to read and write JSON files to the `JsonReader`\
    \ and `JsonWriter` APIs.\n\nThe Streaming API (under the `stream` package) is\
    \ a low-level API designed to process large amounts of JSON data efficiently.\
    \ The Streaming API is much like the StAX API for XML. It provides a way to stream\
    \ JSON without maintaining the document in memory. Streaming API provides an event-based\
    \ parser on a pull streaming model (using `JsonParser`), enabling the user to\
    \ process or discard the event, and ask for the next event (the pull event). The\
    \ `JsonGenerator` can also generate and write JSON by streaming.\n\n# 6.2. Building\
    \ JSON\n\nThe object and array structures in JSON are represented by the `javax.json.JsonObject`\
    \ and `javax.json.JsonArray` APIs. The API lets navigate and query the tree structure\
    \ of data.\n\n`JsonObject` provides a Map to access the unordered collection of\
    \ zero or more name/value pairs. `JsonArray` provides a list to access the ordered\
    \ sequence of zero or more values. The API uses builders to create the tree representation\
    \ of `JsonObject` and `JsonArray` through the `javax.json.JsonObjectBuilder` and\
    \ `javax.json.JsonArrayBuilder` interfaces.\n\nListing 149 shows how to build\
    \ a JSON object representation as a customer. You can see, the `Json` class is\
    \ the facade used to create a `JsonObjectBuilder` object that will build up a\
    \ `JsonObject` (using the final `build()` method). `JsonObject` provides a map\
    \ to the JSON name/value mappings. Invoking the `add()` method will add a name/value\
    \ to the JSON object.\n\nListing 149. Building a JSON Object\n\n```\n@GET\n@Produces(APPLICATION_JSON)\n\
    public JsonObject getCustomer() {\n  JsonObject customer = Json.createObjectBuilder()\n\
    \    .add(\"firstName\", \"Antonio\")\n    .add(\"lastName\", \"goncalves\")\n\
    \    .add(\"email\", \"agoncal.fascicle@gmail.com\")\n    .build();\n  return\
    \ customer;\n}\n```\n\nThe REST endpoint `endpoint` in Listing 149 returns the\
    \ `JsonObject`. In fact, if you print the JSON object you get a valid JSON document,\
    \ so you can return it straight from a JAX-RS endpoint or it as an HTTP request\
    \ body:"
