  md: "| Attribute | Description |\n| --- | --- |\n| MANDATORY | The container requires\
    \ a transaction before invoking the business method but should not create a new\
    \ one. If the client has a transaction context, it is propagated; if not, a java.transaction.TransactionalException\
    \ is thrown.\n| NOT_SUPPORTED | The transactional method cannot be invoked in\
    \ a transaction context. If the client has no transaction context, nothing happens;\
    \ if it does, the container suspends the client's transaction, invokes the method,\
    \ and then resumes the transaction when the method returns.\n| NEVER | The transactional\
    \ method must not be invoked from a transactional context. If the client is running\
    \ within a transaction context, the container throws a java.transaction.TransactionalException.\n\
    \nTo apply one of these demarcation attributes to your service, you have to use\
    \ the @Transactional annotation. This annotation can be applied either to individual\
    \ methods or to the entire bean. Listing 91 shows how the PublisherService uses\
    \ a SUPPORT transaction demarcation policy and overrides the update(update) method\
    \ with REQUIRED.\n\nListing 91. A Custom Transaction Service\n\n```\n@ApplicationScoped\n\
    @Transactional(SUPPORTS)\npublic class PublisherService {\n\n  @Inject\n  EntityManager\
    \ em;\n\n  public List<Publisher> findAll() {\n    return em.createQuery(\"SELECT\
    \ * FROM Publisher\", Publisher.class).getResultList();\n  }\n\n  public Optional<Publisher>\
    \ findById(Long id) {\n    Publisher publisher = em.find(Publisher.class, id);\n\
    \    return publisher != null ? Optional.of(publisher) : Optional.empty();\n \
    \ }\n\n  @Transactional(REQUIRED)\n  public Publisher update(Publisher publisher)\
    \ {\n    return em.merge(publisher);\n  }\n\n}\n```\n\nIf you look at the PublisherService\
    \ in Listing 91, then you'll understand that the update() method is transactional.\
    \ If the caller hasn't created a transaction, the container will create a one.\
    \ On the other hand, when the find methods are invoked, it hasn't been invoked\
    \ in a transactional context, then the container will not create a new one."
