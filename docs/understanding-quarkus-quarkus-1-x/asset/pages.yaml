  md: "> You should not programmatically call methods annotated with @Incoming and/\
    \ @Outgoing directly from your code. They are invoked by the framework. Your code\
    \ invoking them would have an unexpected outcome.\n\n# 8.2.4. Connectors\n\nSo\
    \ far we've seen that Reactive Messaging can handle messages generated from within\
    \ the application. In this case, everything is in-memory, and the streams are\
    \ created by chaining methods all. Each chain is still a reactive stream and enforces\
    \ the backpressure protocol. If you need to send messages to microservices, you\
    \ need a message broker such as Kafka, AMQP or MQTT. For that, Reactive Messaging\
    \ uses connectors. A connector is an extension managing the communication with\
    \ a specific transport technology:\n\n+   - It receives messages from the broker\
    \ and propagates them to the application;\n- It sends messages provided by the\
    \ application to the broker.\n\nFrom a developer's point of view, whether the\
    \ messages come from co-located beans or from a remote broker, it is transparent.\
    \ All that we need is to add a Quarkus extension depending on the connector's\
    \ technology. Let's see an example with Kafka.\n\nKafka (or Apache Kafka) is an\
    \ open distributed event streaming platform.[74] It provides a unified, high-throughput,\
    \ low-latency platform for handling real-time data feeds thanks to its optimised\
    \ TCP-based protocol. To be able to connect to Kafka, we need to add the Kafka\
    \ extension described in Listing 191.\n\nListing 191. Reactive Messaging and Kafka\
    \ Extensions\n\n```\n<dependency>\n  <groupId>io.quarkus</groupId>\n  <artifactId>quarkus-smallrye-reactive-messaging-kafka</artifactId>\n\
    </dependency>\n```\n\nQuarkus connects with connectors other than Kafka, such\
    \ as AMQP or MQTT. Each connector has its own dedicated extension targeting a\
    \ specific technology.\n\nAMQP (or Advanced Message Queuing Protocol) is an open\
    \ standard layer protocol for message-oriented middleware.[75] The defining features\
    \ of AMQP are message orientation, queuing (including point-to-point and publish-subscribe),\
    \ reliability and security.\n\nMQTT (or Message Queuing Telemetry Transport) is\
    \ the standard messaging protocol for the Internet of Things (IoT).[76] It is\
    \ designed as an extremely lightweight publish/subscribe messaging transport that\
    \ is ideal for connecting remote devices with minimal network bandwidth.\n\nLet's\
    \ take our example of a REST endpoint sending a message to a remote broker. As\
