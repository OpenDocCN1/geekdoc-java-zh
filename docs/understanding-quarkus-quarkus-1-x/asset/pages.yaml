    Listing 179. Creates a Multi From Another Multi


    ```

    Multi<Long> ticks = Multi.createFrom().ticks.every(Duration.ofSeconds(1));


    Multi.createFrom().publisher(ticks)

    .transform(bytakingFirstItems(3))

    .subscribe().with(System.out::println);

    ```


    # 8.1.2. Events


    Creating Unis and Multis is the first step. Once created, asynchronous types react
    to different kinds of events. Four types of events can flow:


    +   - onItem: This event is triggered per item. It contains the item itself.

    - onCompletion: This event is triggered only when no more items are emitted.

    - onFailure: This event happens zero or once. If there is a failure, no onCompletion
    event is sent indicating that a failure has been encountered.

    - subscribe: Indicates that the upstream has taken into account the subscription.


    Notice that failure and completion are terminal events. Once they are, no more
    items are emitted.


    Let''s see how these events work. In Listing 180, we create a Multi with three
    items of type String. Then, on each event display a message (Received when onItem
    is triggered, Completed when onCompletion is triggered, and so on.


    Listing 180. Multi Reacting to Events


    ```

    Multi.createItems("Carla B"

    ```


    The result shows what happens. Each item triggers an onItem and subscribe event.
    In the end, the onCompletion event is triggered only once. In case of failure,
    we would have received an onFailure event instead.'
