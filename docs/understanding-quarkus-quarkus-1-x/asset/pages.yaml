    # 6.1.1. Understanding RESTful Web Services


    REST web services are HTTP-centric and make the most of this very rich protocol.
    In the REST architectural style, every piece of information is a resource, and
    these resources are addressed using Uniform Resource Identifiers (URIs), typically
    links on the Web. The resources are acted upon by a set of simple, well-defined
    operations. The REST client-server architectural style is designed to exchange
    representations of these resources using a defined interface and protocol (see
    Figure 34). These principles encourage RESTful applications to be simple and lightweight,
    and to have high performance.'
