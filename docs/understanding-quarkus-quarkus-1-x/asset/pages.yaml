    # 3.3.1. The Artist Resource


    The ArtistResource in Listing 10 uses some JAX-RS annotations (see Java API for
    RESTful Web Services in Chapter 6). You can see, ArtistResource is a very simple
    REST endpoint, returning a JSON representation of artists on the /artists path
    (that we previously defined in the Quarkus Maven plugin). It declares an ArrayList
    of four artists, and then defines few methods:


    +   - getAllArtists(): Returns the entire list of artists in a JSON format.

    - countArtists(): Returns the number of artists in a text format.'
