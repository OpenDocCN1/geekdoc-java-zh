  md: "# Chapter 10. Native\n\nWith Chapter 6, HTTP Microservices and Chapter 8, Event-Driven\
    \ Microservices, we know how to develop microservices. A microservice architecture\
    \ is made up of several microservices accessing data stores (Chapter 5, Data,\
    \ Transactions and ORM), communicating with each other (Chapter 7, Communication\
    \ and Fault Tolerance) and (Chapter 9, Observability). So far we've executed all\
    \ these code samples using the development mode (mvn quarkus:dev). That's the\
    \ easiest way to develop microservices with Quarkus as you can change the code\
    \ and see your changes. But when going to production, you need to package your\
    \ code so it can be executed either on a server, a VM or a container. And that's\
    \ a different story.\n\nWith Quarkus, you can package an application using different\
    \ formats (a.k.a. JVM mode and Native mode) depending on your needs. And because\
    \ Quarkus comes with Cloud Native in mind, it has some extensions to build a container\
    \ image and execute with an orchestrator. The container used in this chapter is\
    \ Docker, and the orchestrator Kubernetes.\n\n> Make your development environment\
    \ is set up to execute the code in this chapter. You can go to Appendix A to check\
    \ that you have all the required tools installed, in particular Docker, VirtualBox\
    \ and Kubernetes. The code in this chapter can be found at https://github.com/agonal/agonal-fascicle-quarkus/tree/1.0/cloud\n\
    \n# 10.1. Packaging Quarkus Applications\n\nBefore building a Docker image and\
    \ executing it with Kubernetes, you need to package the code of your application\
    \ or microservice. If you come from the Jakarta EE world, you might already be\
    \ familiar with various packaging formats (all being simple zip files):\n\n+ \
    \  - JAR: A Java Archive (.jar extension) is used to package Java code, property\
    \ files, XML descriptors, etc. that make up a Java application. It requires a\
    \ JVM to run.\n- WAR: A Web Archive (.war extension) packages a web application\
    \ and requires a Jakarta EE Web profile server to run.\n- EAR: An Enterprise Archive\
    \ (.ear extension) packages an enterprise application and requires a full Jakarta\
    \ EE application server.\n\nQuarkus does not support WAR or EAR packaging, only\
    \ JARs and native executables: we call the JVM mode and the Native mode. The different\
    \ formats are then:\n\n+   - JVM mode\n  - JAR,\n  - Fast JAR,\n  - Uber JAR.\n\
    - Native mode\n  - Native Executable (OS dependent),\n\n![](img/b367e296ed76005032fc73f31e5a1c75_281_0.png)"
  merge: -1
  pgno: 281
- img_proc: true
  md: "+   • Linux Native Executable.\n\nTo choose between these packaging formats,\
    \ it's a matter of changing the quarkus.package.type configuration property. As\
    \ usual, you can either change its value in the command line when packaging (mvn\
    \ package -Dquarkus.package.type-jar) or in the application.properties file:\n\
    \n```\n# Possible values are jar, fast-jar, uber-jar and native\nquarkus.package.type=fast-jar\n\
    ```\n\nLet's see these formats in detail.\n\n# 10.1.1. JVM Mode\n\nQuarkus is\
    \ first and foremost Java framework that lets you package and run it with classic\
    \ JAR applications. In JVM mode, Quarkus generates an executable JAR and you execute\
    \ it with the java -jar command. In this mode, you need a Java runtime environment\
    \ installed. There are several JAR formats you can choose from depending on your\
    \ needs. Some are easier to package and distribute, some are better suited for\
    \ containers, others faster to startup, etc. Let's have a closer look at these\
    \ JAR formats.\n\n# JAR\n\nWhen you package your code into a JAR file (either\
    \ with the default mvn package or mvn package -Dquarkus.package.type=jar), Quarkus\
