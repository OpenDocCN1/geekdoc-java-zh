  md: "Book. The annotated parameter is called the event parameter. So once the event\
    \ is fired from the BookService bean, the CDI carries the execution and passes\
    \ the event to any registered observer. In our case, the addBook() method in Listing\
    \ 34 will be invoked and the inventory updated, and the container will then continue\
    \ the code execution where it paused in the Service bean. This means that events\
    \ in CDI are not treated asynchronously.\n\nListing 34. Service Observing the\
    \ Book Event\n\n```\n@Singleton\npublic class InventoryService {\n\n    List<Book>\
    \ inventory = new ArrayList<>();\n\n    public void addBook(@Observes Book book)\
    \ {\n        inventory.add(book);\n    }\n}\n```\n\nLike with most of CDI, event\
    \ production and subscription are typesafe and allow qualifiers to determine which\
    \ events observers will be observing. An event may be assigned one or more qualifiers,\
    \ which allow observers to distinguish it from other events of the same type.\
