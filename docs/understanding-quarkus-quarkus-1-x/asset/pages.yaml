  md: '# A.10.1. A Brief History of Git


    Git development began in April 2005, after many developers in the Linux kernel
    gave up access to BitKeeper, a proprietary source-control management (SCM). Linus
    Torvalds wanted a distributed system that he could use, like BitKeeper, none of
    the available free systems met his needs. Linus started the development of Git
    on 3rd April 2005, announced the project on 6th April and the first merge of multiple
    branches took place on 18th April. On 29th April, the nascent Git was benchmarked,
    reaching patches to the Linux kernel tree at the rate of 7 patches per second.[24-7]


    # A.10.2. Installing Git on macOS


    On macOS, if you have installed Homebrew, then installing git is just a matter
    of a single command.[24]

    Open your terminal and install git with the following command:


    ```

    $ brew install git

    ```


    # A.10.3. Checking for Git Installation


    Once installed, check for Git by running git --version in the terminal. It should
    display the git version:


    ```

    $ git --version

    git version 2.25.0

    ```


    # A.10.4. Cloning Repository


    Once Git is installed, you can clone the code of the repository with a git clone
    on https://github.com/agonal/agonal-fascicle-quark.git


