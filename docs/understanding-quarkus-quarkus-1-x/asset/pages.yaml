    public class InventoryService {\n  @Inject\n  UserTransaction tx;\n\n  @Inject\n\
    \  InventoryRepository repository;\n\n  public void itemSold(Item item) throws\
    \ Exception {\n    try {\n      tx.begin();\n      repository.add(item);\n   \
    \   repository.decreaseAvailableStock(item);\n      sendShippingMessage();\n\n\
    \      if (inventoryLevel(item) == 0) {\n        tx.rollback();\n      } else\
