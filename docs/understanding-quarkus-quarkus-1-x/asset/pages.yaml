    # Cleaning Up


    To clean up, we can delete our topic. For that use the --delete parameter. Once
    you issue the delete command, the topic will be "marked for deletion" and you''ll
    have to wait until it gets deleted.


    ```

    $ kafka-topics --zookeeper localhost:2181 --delete --topic vinyl-topic

    Topic vinyl-topic is marked for deletion.


    $ kafka-topics --zookeeper localhost:2181 --list

    ```


    # Stopping Kafka


    To stop Kafka you need to do it with two commands: one to stop Kafka itself, and
    another one to stop ZooKeeper.


    ```

    $ kafka-server-stop

    $ zookeeper-server-stop

    ```


    # A.9.5. Some Kafka Commands


    Kafka has several commands where you can use several parameters and options. To
    get some help use the following commands:


    +   - kafka-configs --help: Manipulates and describes the configuration for a
    topic, client, or broker.

    - kafka-console-consumer --help: Reads data from Kafka topics and outputs it to
    standard output.

    - kafka-console-producer --help: Reads data from standard input and publish it
    to Kafka.

    - kafka-topics --help: Creates, deletes, or changes any topic.


    # A.10. Git


    Git is free and open source distributed version control system designed for tracking
    changes in computer files and coordinating work among multiple people.[1]. It
    is primarily used for source code management in software development, but can
    be used to keep track of changes in any set of files. Git was created by Linus
    Torvalds in 2005 for the development of the Linux kernel, with other kernels contributing
    to its initial development.


    Git is not really needed to run the samples in this fascicle. Even if the code
    is hosted on a Git repository (https://github.com/agoncal/agoncal-fascicle-quarkus/tree/1.0),
    you can download the code as a zip file, or clone the repository. Only if you
    clone the repository you will need to have Git installed.'
