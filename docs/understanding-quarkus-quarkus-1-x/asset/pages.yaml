    # Dynamic Queries


    You''ve just seen the JPQL syntax and how to describe statements using different
    clauses (SELECT, FROM, WHERE). But how do you integrate a JPQL statement in your
    application? Through queries, JPA has different types of queries that can be used
    in code, for a different purpose (Named queries, Criteria API). But, in this facile,
    I''ll focus on Dynamic queries. It is the simplest form of query, consisting of
    nothing more than a JPQL query string, dynamically specified at runtime.


    The central point for choosing these types of queries is the EntityManager interface,
    which has several factory methods returning either a Query or a TypedQuery. The
    interface is used in cases when the result is Object, TypedQuery is used when
    a typed result is returned. The methods that are mostly used in this API are ones
    that execute the query. To execute a SELECT query, you have to choose between
    two methods, depending on the required result.


    +   - getList() executes the query and returns a list of results (entities, attributes,
    expressions etc.).

