    ```


    Here are some commands that you will be using to start/stop containers in this
    workshop.


    +   - docker login: Logs into a Docker registry.

    - docker image ls: Lists images.

    - docker image push: Pushes a local Docker image to the remote Docker repository.

    - docker image pull: Pulls a Docker image from the remote Docker repository to
    the repository.

    - docker container ls: Lists containers.

    - docker container run <CONTAINER>: Starts one or more running containers.

    - docker container stop <CONTAINER>: Stops one or more running containers.

    - docker-compose -f docker-compose.yaml up -d: Starts all containers defined in
    a Docker Compose file.

    - docker-compose -f docker-compose.yaml down: Stops all containers defined in
    a Docker Compose file.


    # A.7. VirtualBox


    Depending on the version of Minikube or Docker that you have installed, you might
    need VirtualBox to make Minikube run on your machine. Recent versions of Minikube
    can work straight with Docker, but older versions need a hypervisor to be installed.
    There are several hypervisors running on macOS (xhyve, VMware Fusion or Parallels
    Desktop) but VirtualBox is the most popular one. VirtualBox is an open source
    virtualization product that runs on Windows, Linux, MacOS, and Solaris hosts and
    supports a large number of operating systems.


    # A.7.1. A Brief History of VirtualBox


    VirtualBox was first offered by the German company Innotek GmbH under a proprietary
    software license. In January 2007, Innotek released VirtualBox Open Source Edition
    (OSE) as free and open source. Sun Microsystems acquired Innotek in February 2008.
    Oracle Corporation rebranded the product as "Oracle VM VirtualBox".


