    https://antoniogalves.org\").name(\"Blog Check\");\n  }\n}\n```\n\n# 9.1.3. Constructing\
    \ a Response\n\nLiveness and readiness health checks implement the call() method\
    \ that returns a HealthCheckResponse. Up to now, we've seen that a response contains\
