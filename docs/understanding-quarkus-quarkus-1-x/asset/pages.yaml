    profiles, logging and life cycle). Data, Transactions and ORM use these fundamentals
    to add extensions that deal with data validation, object-relational mapping or
    transactions.


    Microservices fall into two categories: HTTP Microservices and Event-Driven Microservices.
    HTTP-related technologies use synchronous communication and therefore need to
    deal with invocation failure (Chapter 7, Communication and Fault Tolerance). They
    can be synchronous or asynchronous, and with many microservices, observability
    becomes mandatory as explained in Chapter 9, Observability.


