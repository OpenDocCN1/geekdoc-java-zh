  md: "But why would you create tests especially for the native image? Because when\
    \ building a native executable, GraalVM operates with a closed world assumption.\
    \ It analyses the tree and removes all the classes/methods/fields that are not\
    \ used directly. The elements used reflection are not part of the tree are dead-code\
    \ eliminated (if not called directly in others). To avoid such code being eliminated\
    \ by GraalVM, you need to annotate your beans with @RegisterForReflection.\n\n\
    For example, Listing 238 shows a bean with JSON-B annotations. JSON libraries\
    \ use reflection to serialise objects to JSON. Graal gets rid of reflection. If\
    \ we were to use the Artist without the @RegisterForReflection, we would get an\
    \ exception in native mode. To include these elements in your native executable,\
    \ you would need to register your bean for reflection explicitly. This means that\
    \ the JVM mode test would succeed, but the native mode test would fail.\n\nListing\
    \ 238. Register a Bean for Reflection\n\n```\n@RegisterForReflection\npublic class\
    \ Artist {\n    private Integer id;\n    @JsonProperty(\"first_name\")\n    private\
    \ String firstName;\n    @JsonProperty(\"last_name\")\n    private String lastName;\n\
    \n    // Constructors, getters, setters\n}\n```\n\n# 11.1.4. Transactional Tests\n\
    \nIn Chapter 5, you saw how you could use Java Persistence API (JPA) and Panache\
    \ to map entities to a relational database. Thanks to JTA (Java Transaction API)\
    \ we can insert, update or delete entities in a transactional way. So, if we want\
    \ to execute tests within a transactional context, we can simply apply the @Transactional\
    \ annotation to the test method (or class as shown in Listing 239) and the transaction\
    \ interceptor will handle it."
  merge: -1
  pgno: 321
- img_proc: true
  md: "# Listing 239. Transactional Test\n\n```\n@QuarkusTest\n@Transactional\nclass\
    \ MusicianTest {\n\n    @Test\n    void shouldPersistAMusician() {\n        Musician\
    \ musician = new Musician();\n        musician.firstName = \"Janis\";\n      \
    \  musician.lastName = \"Joplin\";\n        musician.dateOfBirth = LocalDate.of(1943,\
    \ 01, 19);\n        musician.preferredInstrument = \"Voice\";\n\n        musician.persist(musician);\n\
    \n        assertNotNull(musician.id);\n    }\n}\n```\n\nWithout this annotation,\
    \ the test would fail. That's because the `persist()` method requires running\
    \ within the context of a transaction.\n\n# 11.1.5. Configuring Quarkus Tests\n\
    \nSome of the JVM and native tests can be configured in Quarkus. One common property\
    \ that you might find useful to configure is the listening port used during the\
    \ tests (quarkus.http.test-port property). The default is 8081 if you set it to\
    \ 0, it will result in the use of a random port (assigned by the operating system).\
    \ Table 76 shows other common test properties.\n\nTable 76. Some Quarkus Test\
    \ Configuration Properties\n\n| Property | Default |\n| --- | --- |\n| quarkus.http.test-port\
    \ | 8081 |\n| The HTTP port used to run tests | |\n| quarkus.http.test-ssl-port\
    \ | 8444 |\n| The HTTPS port used to run tests | |\n| quarkus.test.profile | test\
    \ |\n| The profile to use when testing using @Quarkus | |\n| quarkus.native.graalvm-home\
    \ | ${GRAALVM_HOME} |\n| The location of the Graal distribution | |\n| quarkus.native.java-home\
    \ | ${java.home} |\n| The location of the JDK | |\n| quarkus.test.native-image-wait-time\
    \ | PT5M |\n| Duration to wait for the native image to be built during testing\
    \ | |"
