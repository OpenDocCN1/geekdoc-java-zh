  md: '# 2.5.2. A Brief History of GraalVM


    The history of GraalVM dates back to the research on MaxineVM in 2013, also known
    as a metacircular virtual machine because JVM is actually written in Java itself.[1]
    Oracle invested in this research project and then released it under the name of
    GraalVM. GraalVM is a production-ready software and is available as a Community
    Edition (open source license) and as an Enterprise Edition (OTN License). Oracle
    Corporation announced the release of Oracle GraalVM Enterprise Edition in May
    2019. GraalVM has become an important part of the Quarkus story, and Red Hat has
    committed to its success. Therefore, Red sits sits on GraalVM Project Advisory
    Board and regularly contributes features and fixes to GraalVM.[2]


    # 2.5.3. Mandel


    The history of GraalVM does not stop here. In 2020 Red Hat announced the project
    Mandel.[3] Mandel is a distribution of a regularJDK with a specially-packaged
    GraalVM native image. On the technical side, Mandel''s GitHub repository represents
    a fork of GraalVM.[4] It is a downstream distribution of GraalVM where Red Hat
    can continue to innovate with an "upstream-first" mentality, preferring not to
    deviate from the upstream GraalVM. The primary driver behind Red Hat''s investment
    in Mandel is to drive the speed and efficiency of the Quarkus framework, especially
    on the native-image feature.


    # 2.6. Quarkus Overview


    Java was born in 1995 and at the time was mostly used to write GUI applications
    and Applets. The language was based on the available hardware using single cores
    and multi-threads. Quickly, the language moved to the servers, and we started
    developing monolithic applications, to run on huge machines 24/7 for months (years),
    with lots of CPU and memory. The JVM startup time was not an issue, the memory
    used by the JVM was, but we let the JIT optimise the execution over time and left
    the GC manage the memory efficiently. Slow startup time and resource consumption
    don''t fit well in our new environment where we need to deploy hundreds of microservices
    in the cloud, they move around and start them quickly. Instead of scaling an application
    by adding more CPU and memory, we now scale microservices dynamically by adding
    more instances. That''s where Quarkus, GraalVM, Kubernetes and other projects
    come into play.


    Quarkus tailors applications for GraalVM and HotSpot. The result is that your
    application will have amazingly fast boot time and low RSS memory offering high
    density memory utilisation in container orchestration platforms like Kubernetes.


    From a developer''s point of view, Quarkus proposes a nicer developer experience:
    it gives you fast live reload, unified configuration and hides the complexity
    of GraalVM, allowing you to generate native executables. Quarkus leverages your
    experience in standard libraries that you already know (e.g. CDI, JPA, Bean Validation,
    JAX-RS, etc.) as well as many popular frameworks (e.g. Eclipse Vert.x, Apache
    Camel, etc.).'
