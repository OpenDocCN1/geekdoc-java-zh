  md: '# 2.1. Pros and Cons


    Like any architectural style, microservices bring costs and benefits [1] So before
    diving into microservices, you have to understand these and apply them to your
    specific context. Microservices provide the following benefits:


    +   - Strong Module Boundaries: Microservices reinforce modular structure, which
    is particularly important for large teams.

    - Independent Deployment: Simple services are easier to deploy, and since they
    are autonomous, are less likely to cause system failures when they go wrong.

    - Technology Diversity: You can mix multiple languages, development frameworks
    and data-storage technologies (i.e. each team working on a microservice has more
    flexibility to employ different technologies without affecting other teams).


    Microservices also come with costs:


    +   - Distribution: Distributed systems are harder to program since remote calls
    are slow and always at risk of failure.

    - Eventual Consistency: Maintaining strong consistency is extremely difficult
    for a distributed system, which means everyone has manage eventual consistency.

    - Operational Complexity: You need a mature operations team to manage lots of
    services which are being redeployed regularly.


    That''s Quarkus comes into play. Quarkus brings a set of functionalities to reduce
    these costs and lets you focus on the benefits of a microservice architecture.
    When reading about microservices, you might come across the word Reactive Systems
    which embeds a few other techniques. That''s because microservices and reactive
    systems go hand in hand. To help you in building reactive microservices, Quarkus
    integrates reactive messaging and reactive programming.


    # 2.2. Understanding Reactive


    +   - Reactive systems: Systems that are modelled to react to a stimulus, such
    as a message, a request, a metric, etc.

    - Reactive streams: Stream processing with non-blocking backpressure.

    - Reactive programming: Programming model (based on Reactive streams) on which
    systems depend on.


    Before defining these concepts, let''s introduce the Reactive Manifesto.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 2.2.1. Reactive Manifesto


    The Reactive Manifesto is a document that defines the core principles of reactive
    systems.[27] It was first released in 2013 by a group of developers explaining
    the reasons behind the manifesto.[28] The four properties of reactive systems
    are: responsive, resilient, elastic and message-driven as shown in Figure 6.


    ![](img/b367e296ed76005032fc73f31e5a1c75_33_0.png)


    Figure 6. Reactive Manifesto


    The manifesto defines each property as:


    +   * **Elastic**: Is the ability of an application to work with a variable number
    of instances. This is useful as elasticity allows responding to traffic spikes
    by starting new instances, and load-balancing traffic across instances.

    * **Resilient**: When one instance in a group of elastic instances crashes, traffic
    is redirected to other instances (and a new instance can be started).

    * **Responsive**: Is the result of combining elasticity and resiliency to respond
    in a timely manner.

    * **Message-Driven**: Using asynchronous messages is the key enabler for elasticity
    and resiliency, and this leads to responsiveness.


    # Reactive Principles


    The Reactive Principles is also an important source of inspiration for designing
    distributed applications.[29] This document is a companion to the Reactive Manifesto
    as it incorporates the ideas, paradigms, methods and patterns from both Reactive
    Programming and Reactive Systems into a set of practical principles.


    With these definitions in mind, let''s see why and how we can apply them to an
    entire system.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 2.2. Reactive Systems


    Our world is changing! In 2005, an application would use a dozen servers hosted
    internally, the response time would be counted in seconds, we would use a few
    hours a year for offline maintenance, and we would handle a few gigabytes of data.
    Today we handle thousands of multicore processors somewhere in a datacentre, response
    time is in milliseconds, we need 100% uptime, and we have changed our metrics
    to petabytes for data. This demands that applications written in a fundamentally
    different way than most programmers were used to. Today, systems are designed
    with multicore and cloud computing architectures, as well as user requirements,
    low latency and higher throughput in mind. That''s when reactive systems can help.


    ![](img/b367e296ed76005032fc73f31e5a1c75_34_0.png)


    Figure 7. Reactive microservices


    As shown in Figure 7, reactive systems rely on asynchronous messages (a.k.a. events)
    to communicate between microservices. This ensures loose coupling between microservices,
    but also isolation and location transparency. Employing coupling enables load
    management, elasticity, and flow control by managing the message queues in the
    system and applying backpressure when necessary. Messages can be dispatched to
    more instances (making the system elastic), and we can control the flow between
    message producers and message consumers (this is backpressure). Location transparency
    makes it possible for the management of failure to work either across a cluster
    or within a single host. Non-blocking communication allows recipients to only
    consume resources while active, leading to less system overhead. This has an interesting
    impact on the code where reactive systems and reactive programming are needed.


    # 2.2.3. Reactive Streams


    Everything in the reactive world is accomplished with the help of Reactive Streams.
    Reactive Streams is a standard specification created in 2013 as the reactive programming
    model was beginning to spread, and more frameworks for reactive programming were
    starting to emerge in'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'various languages. It is now implemented across various frameworks and platforms.
    The core goal is to standardise the exchange of asynchronous data between software
    components with non-blocking backpressure.


    Reactive streams are a very low-level contract, expressed as a handful of concepts
    applicable in many languages, including Java:


    +   * Publisher: Publishes an unlimited number of sequenced messages according
    to the demand received from its subscriber(s).


    +   * Subscriber: Subscribes to a given publisher and then receives messages.


    +   * Subscription: Represents a one-to-one lifecycle of a subscriber subscribing
    to a publisher.


    +   * Processor: If an entity is both a publisher and a subscriber, it is called
    a processor. A processor often acts as an intermediary between another publisher
    and subscriber.


    Figure 8 shows the sequence of interactions between a subscriber and a publisher.
    A subscriber informs the publisher that it is willing to accept a given number
    of messages (a.k.a. events, items, records). Then, the publisher notifies the
    subscriber of the subscription that was created. Once this notification process
    is completed, the subscriber can inform the publisher that it is ready to receive
    n number of messages. The publisher pushes the maximum receivable number of messages
    to the subscriber. The process of restricting the number of messages that a subscriber
    is willing to accept is called backpressure: it is essential in prohibiting overloading
    the subscriber.


    ![](img/b367e296ed76005032fc73f31e5a1c75_35_0.png)


    Figure 8. Subscriber and publisher interacting


    > Reactive Streams interfaces have been added to the Java platform since version
    9. They include basic interfaces for each of the fundamental Reactive Stream concepts
    in the Flow concurrency library.[22] This allows all Java applications to depend
    on these interfaces rather than using a specific implementation.'
  merge: -1
