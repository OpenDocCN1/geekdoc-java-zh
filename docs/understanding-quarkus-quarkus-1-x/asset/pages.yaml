  md: "# Quarkus Test Resource\n\nIn some scenarios you don't need TestContainers\
    \ to start and stop a resource before and after the test suite. Some simple hooks\
    \ do. To address this, Quarkus provides the @QuarkusResource annotation and a\
    \ QuarkusTestResourceLifecycleManager interface. The idea is that, you implement\
    \ QuarkusTestResourceLifecycle to start and stop a resource, and you annotate\
    \ your test with @QuarkusTestResource with the implementation. Quarkus provides\
    \ a few implementations out of the box to start and stop resources:\n\n+   - H2\
    \ database: H2DatabaseTestResource\n- Derby database: DerbyDatabaseTestResource\n\
    - Kubernetes: KubernetesMockServerTestResource\n- LDAP server: LdapServerTestResource\n\
    \nFor example, the transactional test in Listing 249 uses the @QuarkusTestResource\
    \ to start and stop an H2 database 249 before and after running the test.\n\n\
    Listing 249. Testing with an H2 Database\n\n```\n@Quarkus\n@QuarkusTestResource(H2DatabaseTestResource.class)\n\
    @Transactional\nclass MusicianTest {\n\n    @Test\n    void shouldPersistAMusician()\
    \ {\n        // ...\n    }\n}\n```\n\nQuarkus has several extensions for testing\
    \ resources. In fact, as you can see in Listing 250, each resource has its own\
    \ extension."
  merge: -1
