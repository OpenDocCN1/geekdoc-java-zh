  md: '# Chapter 2. Understanding Quarkus


    In the previous First Step with Quarkus you''ve already seen some code. Before
    going further into more code, we need to step back and define some concepts. This
    Understanding chapter will use some terminology that will be used in the rest
    of the fascile you don''t get lost.


    Quarkus is A Kubernetes Native stack tailored for OpenJDK HotSpot & GraalVM, crafted
    from the best of breed Java libraries and standards.[1] In practice, Quarkus is
    an Open Source for for writing Java applications, specifically back end applications.
    So Quarkus is not limited to microservices, even though it is highly suited for
    it.


    Just by reading the definition of Quarkus, you can see that there are many technologies
    involved: Java, of course, but also GraalVM, Reactive Systems and Kubernetes.
    For the standards, Quarkus supports some Jakarta EE and MicroProfile specifications.
    Let''s have a look at all these pieces.


    # 2.1. Understanding Microservices


    Microservices are the most popular architecture style when creating cloud native
    applications. significantly shortens the time to market of new application features
    by changing, testing and deploying each service, individually, without affecting
    other services. A well-designed and right-sized microservice architecture can
    help engineer an application that is stable, scalable and fault tolerant.


    # 2.1. Monolith


    When talking about microservices, we need to understand its counterpart: the monolith.
    A few decades ago, it was common to develop an application that could fulfill
    all your business needs while running isolated on a single machine. Such applications
    had a graphical interface, processed business operations, stored data in a local
    database, accessed custom files, but also took advantage of various remote code
    operations (e.g. accessing remote data stores, remote services, etc.). These Monoliths,
    as shown in Figure 3, are built as a single unit and deployed as a single logical
    executable.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '![](img/b367e296ed76005032fc73f31e5a1c75_30_0.png)


    Figure 3. Monolith


    # ## 2.1.2. Microservices


    The difficulties associated with developing, testing, fixing, and updating applications
    have relegated big monolithic applications to the past. Today, application architecture
    must support agile and continuous development by decomposing systems into smaller
    services focused on specific business domains. These domain-specific services
    can then be developed and modified independently according to evolving business
    needs, without impacting the system as a whole.


    Decomposing a monolith into independent microservices (see Figure 4), on the whole
    or only partially while leaving the remaining functionality unchanged, has many
    advantages. For example, each microservice is easy to understand and maintain.
    A microservice can be deployed, scaled and run independently to one microservice.
    Changes to one microservice can be done without the risk of side effects on other
    microservices. Such advantages help shorten the time to market by facilitating
    advanced agility.'
  merge: -1
