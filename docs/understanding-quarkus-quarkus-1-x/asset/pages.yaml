  md: "To communicate, publishers and subscribers exchange messages. They can either\
    \ be messages that are represented by the Message interface, or just the content\
    \ of the message (a.k.a. payload). Message interface is kept minimal so that connectors\
    \ can provide their own implementations with additional metadata that is relevant\
    \ to that connector. For instance, a KafkaRecord implements the Message interface\
    \ and provides access to Kafka specific information (such as the topic or the\
    \ partition).\n\nWe below see some examples of code manipulating the Message interface.\
    \ Plain messages are created using the of() method which wraps a payload with\
    \ optional metadata (withMetadata()) method. The getPayload() method retrieves\
    \ the wrapped payload while ack() acknowledges the message.\n\n```\n// Creating\
    \ with different datatypes\nMessage<Integer> msg = Message.of();\nMessage<String>\
    \ msg = Message.of(\"Janis Joplin sold\");\nMessage<CreditCard> msg = Message.of(new\
    \ CreditCard(\"1234 5678\", AMERICAN_EXPRESS));));\n\n// Getting the payload\n\
    Message<String> msg = Message.of(\"Euro rate: 1.345\");\nassertEquals(\"Euro rate:\
    \ 1.345\", msg.getPayload());\n\n// Creating with metadata\nMetadata metadata\
    \ = Metadata.of(LocalDate.now());\nMessage<String> msg = Message.of(\"Jimi Hendrix\
    \ vinyl sold\", metadata);\nMessage<String> msg = Message.of(\"Jimi Hendrix vinyl\
    \ sold\").withMetadata(metadata);\n\n// Acknowledging a message\nMessage<String>\
    \ msg = Message.of(\"Ella vinyl sold\");\nmsg.ack();\n```\n\nManipulating messages\
    \ can be cumbersome if you don't use metadata or programmatic acknowledgement.\
    \ If you are only interested in the payload, you can just pass it to the channel\
    \ (Float instead of Message<Float>). So, the code in Listing 185 is equivalent\
    \ to the one in Listing 184.\n\nListing 185. Sending a Payload\n\n```\n@Outgoing(\"\
    pound-rate\")\npublic Float sendPoundRate() {\n    return poundRate();\n}\n```\n\
    \nIt is not rare to combine in a single application imperative parts (JAX-RS,\
    \ CDI beans) and reactive parts (beans with @Incoming and @Outgoing annotations).\
    \ And sometimes you need to send messages from the imperative part to the reactive\
    \ part. In this scenario, you can't use the @Outgoing annotation on the imperative\
    \ part but use the Emitter class and @Channel annotation.\n\nAs shown in Listing\
    \ 186, the REST endpoint is invoked through HTTP POST request, not a message (so\
    \ @Incoming cannot be used). To be able to send a message, it injects an Emitter"
