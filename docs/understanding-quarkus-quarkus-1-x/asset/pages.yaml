  md: '# Chapter 12. Putting It All Together


    Now that you''ve read all the previous chapters on Quarkus, it''s time to put
    some of these concepts all together with a slightly more complex example. In this
    chapter, we will write an application made of two microservices that generate
    books with ISBN numbers. The architecture diagram in Figure 56 describes the interaction
    between the two microservices.


    ![](img/b367e296ed76005032fc73f31e5a1c75_338_0.png)


    Figure 56. Architecture diagram


    Each microservice has a defined scope:


    +   * The ISBN Number microservice has a REST endpoint that returns ISBN numbers.
    It is used by the Book microservice when it needs to return a new book.

    * The Book microservice has one endpoint that returns a random book.


    > Make sure your development environment is set up to execute the code in this
    chapter. You can go to Appendix A to check that you have all the required tools
    installed, in particular JDK 11.0.8 or higher, Maven 3.6.x or higher and GraalVM.
    The code in this chapter can be found at https://github.com/agonal/agonal-facascile-quarkus/tree/1.0/putting-together


    # 12.1. Developing the REST ISBN Number Microservice


    A book has ISBN (International Standard Book Number). To return a random book
    (with a title, author, genre, etc.), the Book microservice needs to interact with
    the ISBN Number microservice. We need to expose a REST API that generates ISBN
    numbers of 10 and 13 digits. In this section, we will:


    +   * Implement a REST API using JAX-RS and Quarkus,

    * Inject external configuration,

    * Customise the JSON Output with JSON-B,

    * Enable OpenAPI and Swagger UI,

    * Check the health of the REST endpoint,

    * Configure Quarkus HTTP port listening.


