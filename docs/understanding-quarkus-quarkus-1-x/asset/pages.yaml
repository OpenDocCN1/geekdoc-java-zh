  md: "# Listing 250. Some Dependencies for Testing Resources\n\n```\n<dependency>\n\
    \  <groupId>io.quarkus</groupId>\n  <artifactId>quarkus-test-h2</artifactId>\n\
    \  <scope>test</scope>\n</dependency>\n<dependency>\n  <groupId>io.quarkus</groupId>\n\
    \  <artifactId>quarkus-test-derby</artifactId>\n  <scope>test</scope>\n</dependency>\n\
