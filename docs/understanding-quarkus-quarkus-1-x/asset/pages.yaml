  md: "# 11.1.1. JUnit 5\n\nJUnit is an open source framework to write and run repeatable\
    \ tests.[198] JUnit features include: assertions for testing expected results,\
    \ fixtures for sharing common test data, and runners for running tests. The integration\
    \ with Quarkus is done through a runner. But let's first see some JUnit features\
    \ through a simple example without Quarkus specific code.\n\nListing 227 represents\
    \ a Customer POJO. It has some attributes, including a date of birth, constructors,\
    \ getters and setters. It also provides two utility methods to clear the date\
    \ of birth and to calculate the age of the customer (calculateAge()).\n\nListing\
    \ 227. A Customer Class\n\n```\npublic class Customer {\n    private String firstName;\n\
    \    private String lastName;\n    private LocalDate dateBirth;\n    private Integer\
    \ age;\n\n    public void calculateAge() {\n        if (dateBirth == null) {\n\
    \            age = null;\n            return;\n        }\n\n        age = Period.between(dateBirth,\
    \ LocalDate.now()).getYears();\n    }\n\n    public void clear() {\n        this.dateBirth\
    \ = null;\n    }\n\n    // Constructors, getters, setters\n}\n```\n\nthe calculateAge\
    \ method uses the dateBirth attribute to set the customer's age. It has some business\
    \ logic and we want to make the algorithm calculates the age accurately. We want\
    \ to test this business logic. For that, we need a test class with JUnit test\
    \ methods and assertions.\n\n# Test Class\n\nIn JUnit, test classes do not have\
    \ to extend anything. To be executed as a test case, a JUnit class needs at least\
    \ one method annotated with @Test. If you write a class without at least one @Test\
    \ method, you will get an error when trying to execute it (java.lang.Exception:\
    \ No runnable methods).\n\nListing 228 shows the CustomerTest class that initializes\
    \ the Customer object."
  merge: -1
