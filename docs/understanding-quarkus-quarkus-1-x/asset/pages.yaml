  md: '# 5.1.1. Understanding Constraints


    Application developers spend a considerable amount of time making sure the data
    they process and store is valid. They write data constraints, apply these constraints
    to their logic and model, and make sure the different layers validate these constraints
    in a consistent manner. This means applying these constraints in their client
    application (e.g. web browser, JavaFX etc.), presentation layer, business logic
    layer, domain model (a.k.a. business model), database schema, and, to some degree,
    the interoperability layer (see Figure 23). And, of course, for consistency, they
    have to keep all these rules synchronised across all layers.


    ![](img/b367e296ed76005032fc73f31e5a1c75_118_0.png)


    Figure 23. Validation occurs in several layers


    In heterogeneous applications, developers have to deal with several technologies
    and languages. So even a simple validation rule, such as "this piece of data is
    mandatory and cannot be null," has to be expressed differently in Java, JavaScript,
    database schema, or XML schema.


    # 5.1.2. Constraining Data


    Bean Validation solves the problem of code duplication by allowing developers
    to write a constraint once, use it, and validate it in any layer. Bean Validation
    implements a constraint in plain Java code and then defines it by an annotation
    (metadata). This annotation can be used on your bean, properties, constructors,
    method parameters, and return value. In a very elegant powerful way, Bean Validation
    exposes a simple API to help developers write and reuse business logic constraints.


    # Built-in Constraints


    Bean Validation is a specification that allows you to write your own constraints
    and validate them. But it also comes with some common built-in constraints. Table
    15 gives you an exhaustive list of all'
  merge: -1
  pgno: 118
