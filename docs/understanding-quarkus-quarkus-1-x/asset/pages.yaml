  md: "You can use CURL to change the HTTP header and to retrieve the OpenAPI document\
    \ in several formats:\n\n+   - YAML: curl http://localhost:8080/openapi\n- JSON:\
    \ curl -H \"Accept: application/json\" http://localhost:8080/openapi\n\nBut this\
    \ contrast lacks documentation. Eclipse MicroProfile OpenAPI allows us to customise\
    \ the methods' description of our REST endpoints and as to the entire application.\n\
    \n# Customising the OpenAPI Contract of the REST Endpoint\n\nThe Eclipse MicroProfile\
    \ OpenAPI has a set of annotations to customise the REST endpoint class, methods\
    \ and parameters to make the OpenAPI contract richer and cleaner for consumers.\
    \ Listing 265 shows what the NumberResource endpoint looks once annotated.\n\n\
    Listing 265. Customising the OpenAPI Contract of the REST endpoint\n\n```\n@Path(\"\
    /api/numbers\")\n@Produces(MediaType.APPLICATION_JSON)\npublic class NumberResource\
    \ {\n\n    private final static Logger LOGGER = Logger.getLogger(\"NumberResource\"\
    );\n\n    @ConfigProperty(name = \"number.separator\", defaultValue = \"false\"\
    )\n    boolean separator;\n\n    @GET\n    @Operation(\n        summary = \"Generates\
    \ ISBN numbers\",\n        description = \"These ISBN numbers have several formats:\
    \ ISBN 13 and ISBN 10\")\n    @APIResponse(responseCode = \"200\",\n        content\
    \ = @Content(mediaType = MediaType.APPLICATION_JSON, schema = @Schema(implementation\
    \ = IsbnNumbers.class)))\n    public Response generateIsbnNumbers() {\n      \
    \  Faker faker = new Faker();\n        IsbnNumbers isbnNumbers = new IsbnNumbers();\n\
    \        isbnNumbers.setIsbn10(faker.isbn10(separator));\n        isbnNumbers.setIsbn13(faker.isbn13(separator));\n\
    \        LOGGER.info(\"ISBN numbers generated \" + isbnNumbers);\n        return\
    \ Response.ok(isbnNumbers).build();\n    }\n}\n```\n\n@Operation annotation describes\
    \ the method while @APIResponse gives information about the HTTP status code (here,\
    \ a 200 when the method is invoked successfully) and the content of the Response\
    \ (which is an IsbnNumbers class)."
