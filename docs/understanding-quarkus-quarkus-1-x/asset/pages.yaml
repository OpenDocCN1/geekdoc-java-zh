    quarkus.log.format=%d %-p [%c{2}] %s%n

    ```


    # 4.4.3. Logging Categories


    Logging is done on a per-category basis and each category can be independently
    configured. The root logger category quarkus.log sits at the top of the logger
    hierarchy, and then you can have zero several categories, depending on your needs.
    For example, the configuration below sets a different level for every category
    (note the quotes shown in the property name are required, as categories normally
    contain '' '' which must be escaped):


    ```

    quarkus.log.level=TRACE

    quarkus.log.category="org.agconal".level=INFO

    quarkus.log.category="io.quarkus.resteasy".level=DEBUG

    quarkus.log.category="io.quarkus.arc".level=DEBUG

    quarkus.log.category="org.jboss".level=WARN

    ```


    A configuration which applies to a category will also apply to all sub-categories
    of that category, unless there is a more specific matching sub-category configuration.


    # 4.4.4. Logging Format


    By default, the log entry displays the timestamp, the log level, the class name,
    the thread id and the message. This logging string can be customised through a
    set of symbols. Only subset of these symbols is listed in Table 12 (you can find
    the entire list on the Quarkus website).[221]


    Table 12. Some Logging Format Symbols


    | Symbol | Description |

    | %c | Category name |

    | %C | Source class name |

    | %d{xxx} | Date with the given date format string defined by java.text.SimpleDateFormat
    [222] |

    | %e | Renders the thrown exception, if any |

    | %h | System host name |

    | %i | Current process PID |

    | %l | Source location (source file name, line number, class name, and method
    name) |

    | %L | Source line number |

    | %m | Renders the log message plus exception (if any) |

    | %M | Source method name |

    | %n | Renders the platform-specific line separator string |'
