  md: '# A.8. Kubernetes


    Kubernetes (a.k.a. Ks) is an orchestrator for containerised applications.[237]
    It takes its name from a Greek word meaning helmsman, or captain: if Docker packages
    applications inside containers, Kubernetes is the captain sailing those containers.
    Kubernetes can schedule, scale, heal, update, start or stop containers.


    # A.8.1. A Brief History of Kubernetes


    Back in the beginning, Google was already using containers way before Docker.
    They built in-house tools to orchestrate their millions of servers: Borg and Omega.[238]
    They sourced their orchestration technology and called it Kubernetes. It is now
    maintained by the Cloud Native Computing Foundation (CNCF).[239]


    # A.8.2. Different Kubernetes Flavours


    There are several ways to jump into Kubernetes. You can install it manually from
    scratch on your Linux machines with tools such as kubeadm.[240] But this is pretty
    advanced and you might want to use already packaged Kubernetes distributions for
    local development (Minikube, Minish, Kind, etc.) or hosted for a production environment
    (Google Container Engine, OpenShift, Amazon Elastic Container Service for Kubernetes,
    etc.). In this fascicle, I use Minikube as it is the most widely used Kubernetes
    distribution for local development.


    # A.8.3. Installing Minikube on macOS


    Minikube allows you to run Kubernetes locally on a developer''s machine.[241]
    It focuses on making Kubernetes easy to learn and develop by easily setting up
    and managing a local Kubernetes cluster.


    ![](img/b367e296ed76005032fc73f31e5a1c75_391_0.png)


    Figure 70. Launching VirtualBox'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'Minikube is a single node Kubernetes cluster that runs on a hypervisor on your
    local machine. All you need is Docker, a hypervisor and Kubernetes. Before installing
    Minikube, make sure you have Docker and VirtualBox up and running. Then, it''s
    just a matter of installing Minikube and kubectl, the command line interacting
    with Minikube.


    # Installing Kubectl


    kubectl is the command line interface that lets you interact with your Minikube
    Kubernetes cluster. It sends requests to the Kubernetes API server running on
    the cluster to manage your environment.


