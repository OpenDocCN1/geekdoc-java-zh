  md: '# Chapter 11. Tests


    The previous chapters focused on presenting different technologies and APIs and
    how they work together. But what about testing them? If you come from the Jakarta
    EE world, you might remember how painful it was to test your components inside
    an application server. If you come from the Spring world, you know how tests can
    be executed in the application context. This time takes but is far more efficient
    than testing in Jakarta EE. As you''ve seen up to now, Quarkus has some amazing
    features (live reload, native compilation, etc.) and testing is one of


    Quarkus makes testing easy and fast. When a test is executing, the application
    is started before the test is run. So your tests run with the entire application
    and running. And as you know by now, applications tend to start really quickly
    with Quarkus: so do your tests.


    This chapter shows how Quarkus can run tests within the JVM mode as Native mode.
    It integrates with JUnit, but also several frameworks such as Rest Assured, Hamcrest
    or TestContainers and offers mocking capabilities. This allows your tests to be
    as expressive as possible, easy to write, being rich, complex and able to interact
    with external resources. And Quarkus makes it easy to mock these dependencies
    by integrating Mockito.


    > The code in this chapter can be found at https://github.com/agoncal/agoncal-fascicle-quarkus/tree/1.0/testing


    # 11.1. Quarkus Tests


    Quarkus integrates with JUnit 5 (JUnit 4 is not supported). In fact, Quarkus depends
    on JUnit tests don''t even work with other frameworks (such as TestNG, for example).
    Tests can be executed in JVM mode (this is the default), but also in Native mode:
    it''s just a matter of using the appropriate Quarkus runner.


    Quarkus tests come with a set of annotations. Table 75 lists a subset of the most
    used annotations.


    Table 75. Main Quarkus Annotations


    | Annotation | Description |

    |---|---|

    | @QuarkusTest | Indicates that a test should be run using the JVM mode of Quarkus
    |

    | @NativeImageTest | Indicates that a test should be run using a native image,
    rather than in the JVM |

    | @QuarkusTestProfile | Defines a test profile that has different configuration
    options to other tests |

    | @InjectMock | When used on a field of a test class, the field becomes a Mockito
    mock |'
  merge: -1
