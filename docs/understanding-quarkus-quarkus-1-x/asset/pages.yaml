    SELECT b FROM Book b\", Book.class).getResultList();\n  }\n\n  public Book createBook(Book\
    \ book) {\n    em.persist(book);\n    statistics.add(book);\n    return book;\n\
    \  }\n}\n```\n\nYou might ask how the code in Listing 90 work? The answer is that\
