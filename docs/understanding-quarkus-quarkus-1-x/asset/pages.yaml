    # A.6.5. Some Docker Commands


    Docker is a line utility where you can use several parameters and options to start/stop
    a container. You invoke docker with zero, or one or command-line options with
    the container or image ID you want to work with. Docker comes with several options
    that are described in the documentation if you need more help.[13-14] To get help
    on the commands and options, you can use the following command:'
