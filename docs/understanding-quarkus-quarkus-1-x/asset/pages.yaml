  md: '# Chapter 8. Event-Driven Microservices


    The theory of microservices is simple and we''ve seen it in the previous chapters:
    break a monolith into small, purpose-specific microservices (Chapter 2, Understanding
    Quarkus), and have them communicate through HTTP (Chapter 6, HTTP Microservices).
    But in practice, with the network being unreliable and the microservices having
    to be up and running, we need to deal with fault-tolerance (Chapter 7, Communication
    and Fault Tolerance).


    Event-driven architecture (also called reactive architecture or reactive systems)
    is another way of having our microservices talking to each other. It is about
    microservices sending events (a.k.a. messages or records) between them. This decouples
    and brings reliability: events are sent to the event/messaging platform (e.g.
    a JMS or a Kafka broker) which distributes them to the microservices. So, instead
    of thinking "which microservice will I invoke", you should think of "what events
    will my microservice process? and "what events will my microservice emit".


    In this chapter, you will see two major technologies used for event-driven microservices
    in Quarkus. Reactive Programming (with Mutiny) allows your code to react using
    a very fluent API. As Reactive Messaging, it allows microservices to interact
    through messages in a very easy way.


    ![](img/b367e296ed76005032fc73f31e5a1c75_244_0.png)


    > Make sure your development environment is set up to execute the code in this
    chapter. You can go to Appendix A to check if you have all the required libraries
    installed, in Kafka. The code in this chapter can be found at https://github.com/agonal/fascicle-quarkus/tree/1.0/reactive


    # 8.1. Reactive Programming


    Java is not a "reactive language" in the sense that it doesn''t support reactive
    models natively, but Java itself does not finish until version 9 with the Flow
    API. For Java on the JVM (Scala and Clojure) several frameworks have emerged throughout
    the years to allow reactive programming: RxJava or Reactor Mutiny is a reactive
    programming library designed after having difficulties with these libraries.


    Eclipse Mutiny is a reactive programming library. Mutiny provides a guided API,
    making reactive programming easy. It allows having with hundreds of methods that
    are not always explicit (e.g. map() or flatmap()) on other reactive frameworks.
    But Mutiny has many converters from and to other reactive programming libraries,
    so you can always use and use the map() method if you wish.


    Mutiny was designed years after existing reactive programming libraries. It is
    based on the experience of many developers, lost in an endless sequence of map
    and flatMap operators. Mutiny does not provide as many as the other reactive frameworks,
    focusing on the most used operators. Furthermore, it helps developers by providing
    a more guided API, which avoids having hundreds of methods to choose from.


    The Eclipse Mutiny APIs and annotations are defined under the main io.smallrye.mutiny
    package, either at the root, or under the other subpackages. Table 49 lists the
    main packages defined in Mutiny version 0.7 (under the root io.smallrye.mutiny
    package).


    232'
