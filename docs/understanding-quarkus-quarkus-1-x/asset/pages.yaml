  md: 'Truffle Framework: A language implementation framework for creating languages
    and instrumentations for GraalVM (e.g. R, Ruby, Python, NodeJS, etc.).


    Graal Compiler: Written in Java and supports both dynamic and static compilation.


    JVM Compiler Interface (JVMCI): Is part of the JDK and allows us to plug-in additional
    compilers (as from Graal) to the JVM.


    Java HotSpot VM: Runtime with the GraalVM compiler enabled as the top tier JIT
    compiler for JVM-based languages.


    Substrate VM: Allows AOT compilation for applications in various languages.


    Figure 11 depicts a high-level view of the GraalVM stack. The Graal Compiler is
    a high performance JIT compiler written in Java. It accepts the JVM bytecode and
    produces the machine code. It uses the new JVM Compiler Interface (JVMCI) to communicate
    with the Java HotSpot VM[2]. On top of that, you will find the Truffle framework
    that enables us to build interpreters and implementations for other languages
    except JVM-based languages (such as Java, Groovy, Scala). If you want to run a
    new programming language, you will just have to integrate with Truffle and the
    framework will produce the optimised machine code for. As you can see, there are
    already language implementations for R, Ruby, or JavaScript. For LLVM-based languages
    (e.g. C++, Fortran, Sulong) guarantees memory safety.


    ![](img/b367e296ed76005032fc73f31e5a1c75_45_0.png)


    Figure 11. GraalVM architecture


    GraalVM allows you to ahead-of-compile Java code to a standalone executable, called
    a native image. This executable includes the application classes, classes from
    its dependencies, runtime library classes from the JDK and statically linked native
    code from the JDK. It does not run on the Java VM, but includes necessary components
    like memory management and scheduling from a different virtual machine, called
    Substrate VM. Substrate VM is the name for the runtime components. Chapter 10
    will cover native compilation. You will also see a glimpse of compilation in action
    in Chapter 3 and in more depth in Chapter 12.'
