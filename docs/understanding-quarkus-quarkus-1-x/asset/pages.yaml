    \  <artifactId>quarkus-test-ldap</artifactId>\n  <scope>test</scope>\n</dependency>\n\
    ```\n\n# 11.3. Mocking\n\nMocking is very often used in testing. Let's say you\
    \ have an object, a microservice or an entire system, that has dependencies on\
    \ other (complex) objects/microservices/systems. During the test phase, to isolate\
    \ the behaviour of these dependencies, you might want to replace these dependencies\
    \ by mocks that simulate their real behaviour. Mocking is a way to only test the\
    \ functionality of an object/microservice/system and not its dependencies. In\
    \ Java there are a few mocking frameworks such as: Mockito [204], EasyMock [205]\
    \ or JMock [206]. Quarkus integrates with Mockito.\n\nAs you've seen in Chapter\
    \ 7, it's easy to ease microservices communicating with each other through the\
    \ Eclipse MicroProfile REST Client. A few annotations (@RestClient, @RegisterClient),\
    \ an interface acting like a proxy (IsbnResourceProxy), some configuration (e.g.\
    \ the URL of the remote microservice) and you have the BookResource invoking a\
    \ IsbnResource REST endpoint to get an ISBN number."
