  md: "# 4.2.3. YAML Support\n\nYou might want to use YAML properties for configuration.\
    \ In fact, Quarkus will choose an application.yaml over application.properties\
    \ (but make sure to keep just one configuration type to avoid errors). Listing\
    \ 51 shows an example of YAML file to configure the application.\n\nListing 51.\
    \ application.yaml File\n\n```\napp:\n  invoice:\n    vatRate: 10\n    allowsDiscount:\
    \ false\n    terms: Payment upon receipt\n  penalties: Penalty in case of late\
    \ payment\n```\n\nThen, as shown in Listing 52, it's just a matter of using @ConfigProperty\
    \ to inject a property (or programmatic configuration).\n\nListing 52. Injecting\
    \ YAML Configuration\n\n```\npublic class Invoice {\n  Float subtotal;\n  @ConfigProperty(name\
    \ = \"app.invoice.vatRate\", defaultValue = \"10\")\n  Float vatRate;\n  Float\
    \ vatAmount;\n  Float total;\n  @ConfigProperty(name = \"app.invoice.allowsDiscount\"\
    , defaultValue = \"true\")\n  Boolean allowsDiscount;\n  @ConfigProperty(name\
    \ = \"app.invoice.discountRate\", defaultValue = \"2.5\")\n  Float discountRate;\n\
    \  @ConfigProperty(name = \"app.invoice.terms\")\n  String terms;\n  @ConfigProperty(name\
    \ = \"app.invoice.penalties\")\n  String penalties;\n}\n```\n\n# 4.2.4. Configuration\
    \ Sources\n\nBy default, Quarkus reads the configuration of an application by\
    \ reading the application.properties file located under the src/main/resources\
    \ directory. Eclipse MicroProfile also allows you to configure the application\
    \ using several sources for configured values, a.k.a.ConfigSource. AConfigSource\
    \ provides configuration values from a specific place, from files to system properties.\
    \ Each configuration source has a specified ordinal, which is used to determine\
    \ the importance of the values from this source will override values with a lower\
    \ priority. Properties can be (in decreasing order priority):\n\n+   - System\
    \ properties (-Dvoice.vatRate=50)"
