  md: "| Subpackage | Description |\n|---||\n| spi | Internal SPIs (Service Provider\
    \ Interfaces) implemented by the provider |\n\nAlong APIs, JSON-B comes with a\
    \ set of annotations. Table 39 lists a subset of the commonly used annotations.\n\
    \nTable 39. Main JSON-B Annotations\n\n| Annotation | Description |\n|---||\n\
    |@JsonbDateFormat | Customises the date format of a field |\n|@JsonbProperty |\
    \ Allows customisation of a field name |\n|@JsonbNumberFormat | Customises the\
    \ number format of a field |\n|@JsonbTransient | Prevents mapping of a field |\n\
    \nTo be able to bind JSON objects, you need JSON Binding. JSON-B comes with the\
    \ RESTEasy extension shown in Listing 137.\n\nListing 137. JSON-B Extension\n\n\
    ```\n<dependency>\n  <groupId>io.quarkus</groupId>\n  <artifactId>quarkus-resteasy-jsonb</artifactId>\n\
    </dependency>\n```\n\n# Jackson\n\nMay you not know JSON-B but have heard of,\
    \ or used, Jackson. Inspired by the quality and variety of XML tooling, Jackson\
    \ was created in 2009 as a multi-purpose Java library for processing JSON.[159]\
    \ It is a high-performance JSON processor including the streaming JSON parser\
    \ / generator library and matching data-binding library (POJOs to and from JSON).\n\
    \nJSON-B is analog to Jackson, and in fact, Quarkus comes with a Jackson extension.\
    \ This facile uscles JSON-B instead of Jackson because JSON-B is part of Eclipse\
    \ MicroProfile. Just make not to mix Jackson and JSON-B in the same project, since\
    \ this might introduce unwanted beans.\n\n# 6.3.1. Understanding Binding\n\nAs\
    \ shown in Figure 37, data binding is the process of defining the representation\
    \ of a JSON document into an object instance, and vice versa. So, deserialisation\
    \ is the process of reading a JSON document and constructing a tree of content\
    \ objects, where each object corresponds to a part of the JSON document. Thus\
    \ the content reflects the document's content. The inverse process to deserialisation\
    \ is serialisation. This is when the content of the object tree is written a JSON\
    \ document that reflects the tree's content."
