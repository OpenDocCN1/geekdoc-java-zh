    to point to the directory where GraalVM is installed (e.g. on macOS it will be
    /Library/Java/JavaVirtualMachines/graalvm-ce-java11-20.2.0/Contents/Home).


    # A.3.2. Installing the Native Image Generator


    The Native Image Generator, or native-image, is a utility that processes the classes
    of your application and dependencies, including those from the JDK [223] It statically
    analyses these classes to determine which classes and methods are reachable during
    application execution (a.k.a. closed-of-world). It then passes all this reachable
    code as the input to the GraalVM compiler which ahead-of-time compiles it to the
    native binary.


    So we need to use the native-image tool. This can be done by running the following
    command from your GraalVM directory (inside the bin directory).


    ```

    $GRAALVM_HOME/bin $ ./native install native-image

    ```


