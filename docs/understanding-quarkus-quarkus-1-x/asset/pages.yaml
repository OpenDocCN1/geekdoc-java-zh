  md: '# Description.type


    Packages a Quarkus application into a jar, fast-jar or native executable

    quarkus.container-image.build


    Builds a Docker image either based on Dockerfile or using the Jib extension

    quarkus.container-image.push


    Pushes the Docker image to a remote registry (default to Docker Hub)

    quarkus.kubernetes.deploy


    Deploys to the Kubernetes cluster


