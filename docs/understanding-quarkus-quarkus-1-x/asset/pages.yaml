  md: "As you can in Listing 172, the Eclipse MicroProfile Fault Tolerance API uses\
    \ the @CircuitBreaker annotation to control invocations. This annotation records\
    \ successful and failed invocations of the createLegacyBook() method, and when\
    \ the ratio of failed invocations reaches the specified threshold, the circuit\
    \ opens and blocks all invocations of that method for a given time. In closed\
    \ state, the requestVolumeThreshold and failureRatio parameters can be configured\
    \ in order to specify the conditions under which the breaker will transition the\
    \ circuit to open.\n\n# Listing 172. Circuit Breaker on the Book Resource\n\n\
    ```\n@Path(\"/books\")\n@Produces(MediaType.APPLICATION_JSON)\n@ApplicationScoped\
    \ class BookResource {\n\n  @RestClient\n  NumberProxy numberProxy;\n\n  @POST\n\
    \  @Fallback(method=\"fallbackCreateLegacyBook\")\n  @CircuitBreaker(requestVolumeThreshold\
    \ = 4, failureRatio = 0.5,\n      delay = 2000, successThreshold = 2)\n  public\
    \ Book createLegacyBook() {\n\n    // Invoking microservice\n    JsonObject isbnNumber\
    \ = numberProxy.getIssn();\n\n    Book book = new Book();\n    book.title = faker.book().title();\n\
    \    book.isbn = isbnNumber.getString(\"isbn10\");\n    book.generatedAt = Instant.now();\n\
    \    return book;\n  }\n\n  private Book fallbackCreateLegacyBook() {\n    Book\
    \ book = new Book();\n    book.title = \"dummy legacy title\";\n    book.isbn\
    \ = \"dummy legacy issn\";\n    book.generatedAt = Instant.now();\n    return\
    \ book;\n  }\n}\n```\n\nIn Listing 172, if within the last four invocations (requestVolumeThreshold),\
    \ 50% failed (failureRatio), then the circuit transits to an open state. The circuit\
    \ will stay open for 2,000 ms (delay). After 2 consecutive successful invocations\
    \ (successThreshold), the circuit will be back to closed again."
