  md: "When you add the Health extension in your pom.xml (see Listing 196), then some\
    \ Quarkus components can automatically expose their health. That's the case for\
    \ datasources or reactive messaging.\n\nListing 196. Health Extension\n\n```\n\
    <dependency>\n  <groupId>io.quarkus</groupId>\n  <artifactId>quarkus-smallrye-health</artifactId>\n\
    </dependency>\n```\n\n# 9.1.1. Understanding Health Checks\n\nIn a microservice\
    \ architecture, we quickly end-up having hundreds or thousands of processes running\
    \ on several servers. If we use a hybrid cloud, we might have a few microservices\
    \ in-house and others in different clouds and different datacentre locations.\
    \ It is important to know the health of the entire system as well as each individual\
    \ microservice as shown in Figure 50. So, it may seem obvious, but a microservice\
    \ must report its health so it can be collected by a service orchestrator, which\
    \ can then use the health to make decisions. For that, there's a need for standardisation\
    \ in how to log health events that ultimately end up collected for querying and\
    \ viewing.\n\n![](img/b367e296ed76005032fc73f31e5a1c75_262_0.png)\n\nFigure 50.\
    \ Microservices up and down.\n\n# 9.1.2. Checks\n\nA service checks its own health\
    \ by performing necessary self-checks. A self-check can be a check on anything\
    \ that the service needs: enough disk space, a successful database connection,\
    \ a system"
  merge: -1
  pgno: 262
- img_proc: true
  md: "property, etc. A service reports UP if it is available and reports DOWN if\
    \ it is unavailable. Although a service might currently be unhealthy, the service\
    \ might still be operational. Therefore, Eclipse MicroProfile handles two types\
    \ of checks:\n\n+   - Liveness: Checks if the microservice is alive, if it's able\
    \ to accept requests and respond.\n- Readiness: Checks if the microservice's dependencies\
    \ (database, queue services, etc.) are themselves ready, so the microservice can\
    \ do what it's supposed to do.\n\nEclipse MicroProfile allows services to report\
    \ their health, and it publishes the overall health status to defined endpoints:\n\
    \n+   - /health/live: Returns the result of all liveness checks and determines\
    \ whether or not your application is up and running.\n- /health/ready: Returns\
    \ the result of all readiness checks and determines whether or not your application\
    \ can process requests.\n- /health: Accumulates the result of both health check\
    \ types.\n\nThese endpoints are linked to health check procedures annotated respectively\
    \ with @Liveness and @Readiness annotations.\n\n# Liveness Checks\n\nA liveness\
    \ check determines if the microservice is running. This means that if this procedure\
    \ fails, the microservice can be discarded and restarted. For example, in Listing\
    \ 197, to check that our endpoint is live, we make sure it can generate numbers\
    \ (by invoking the generateIss()) method and making sure it doesn't throw an exception).\
    \ For that, the check procedure must implement the HealthCheck interface and be\
    \ annotated with the CDI qualifier @Liveness.\n\n# Listing 197.iveness Check\n\
    \n```\n@Liveness\n@ApplicationScoped\npublic class NumberResourceCheck implements\
    \ HealthCheck {\n\n    @Inject\n    NumberResource numberResource;\n\n    @Override\n\
    \    public HealthCheckResponse call() {\n        numberResource.generate();\n\
    \        return HealthCheckResponse.named(\"Ping Number REST Endpoint\").up().build();\n\
    \    }\n}\n```\n\nHealthCheck is a functional interface whose single method call\
    \ returns a HealthResponse object which can be easily constructed by the builder\
    \ API. The call() method is used to return the health status of a particular service.\
    \ So, in Listing 197, we invoke the generateIss() method. If it throws an exception,\
    \ the response will be DOWN. If it succeeds, the response will be UP."
