  md: "# Listing 77. Simple Example of a Book Entity\n\n```\n@Entity\npublic class\
    \ Book {\n\n  @Id\n  @GeneratedValue\n  private Long id;\n  private String title;\n\
    \  private Float price;\n  private String description;\n  private String isbn;\n\
    \  private Integer nbOfPages;\n  private Boolean illustrations;\n\n  // Constructors,\
    \ getters, setters\n}\n```\n\nThe example in Listing 77 represents a Book entity\
    \ from which I have omitted the getters and setters for clarity. As you can see,\
    \ except for these annotations, (id, title, price etc.) of different types (like\
    \ any Java class: it has (Long, String, Integer, and Boolean), a default constructor,\
    \ and getters and setters for each attribute. How does this map to a table? The\
    \ answer is: thanks to mapping.\n\n# 5.2.2. Mapping Entities\n\nThe principle\
    \ of Object-Relational Mapping (ORM) is to delegate the task of creating a correspondence\
    \ between objects and tables, to external tools or frameworks (in our case, JPA).\
    \ The world of objects, and attributes can then be mapped to relational databases\
    \ which are made up of tables containing rows and columns. Mapping gives an object-oriented\
    \ view to developers who can transparently use entities instead of tables. And\
    \ how does JPA map objects to a database? This is done through metadata.\n\nAssociated\
    \ with every entity are metadata that describe the mapping. The metadata enable\
    \ the persistence provider to recognise an entity and interpret the mapping. The\
    \ metadata can be written in two different formats:\n\n+   - Annotations: The\
    \ code of the entity is directly annotated with all sorts of annotations.\n- XML\
    \ descriptors: Instead of (or in addition to) annotations, we can use XML descriptors.\
    \ The mapping is defined in an external XML file that will be deployed with the\
    \ entities.\n\nThese entities, once mapped, can be managed by JPA. You can persist\
    \ an entity in the database, remove it, and query it. An ORM lets you manipulate\
    \ entities while, the database is accessed.\n\nThe Book entity (shown in Listing\
    \ 77) uses JPA annotations so the persistence provider can synchronise the data\
    \ between the attributes of the Book entity and the columns of the BOOK table.\
    \ Therefore, if the attribute isbn is updated by the application, the ISBN column\
    \ will be synchronised (see Figure 25)."
