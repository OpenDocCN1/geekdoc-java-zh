    to invoke URLs. You invoke curl with zero, or several command lines and a URL
    (or set of URLs) to which the data should be transferred. curl supports over hundred
    different options and I would recommend reading the documentation for more help.
    To get some help on the commands and options, you can use the following command:


    ```

