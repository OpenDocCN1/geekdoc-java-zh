    Then came visualisation. With visualisation, we could have multiple applications
    deployed on a single server, totally isolated from one another. If a new application
    was coming along, we didn''t need to buy a new server, we could just reuse an
    existing one. Servers were now more used (80% instead of 5%) On a virtual machine,
    each application gets a percentage of the server''s resources and each virtual
    machine needs an operating system with a licence. When you have several virtual
    machines, you end up with operating systems that need to be administered, patched,
    etc.


    A container runs on a physical server, it doesn''t need visualisation (even if
    it can technically run on a virtual machine, but doesn''t need to). Instead of
    installing several operating systems per application, we install only one operating
    system per server, and then a container per application. Therefore, each application
    starts quickly because there is no need to start the operating system, it''s already
    started.


    Docker has its own terminology when talking about packaging and running an application.
    A Docker Image is a read-only template with instructions for creating a Docker
    container. It is a combination of file system and parameters. Often, an image
    is based on another image with additional customisation. We can use existing images
    or create our own images. A Docker Container is a runnable instance of an image.
    We can create as many containers as we want from an image. A container is isolated
    from the host. We can modify its behaviour using network, volume, etc. When a
    container is created, we can stop, restart or remove it.


    Executing a container on a single machine is one thing, but having to execute
    dozens, hundreds of containers, manage them, restart if they fail, scale them
    if needed, that is another story. That''s why you need an orchestrator such as
