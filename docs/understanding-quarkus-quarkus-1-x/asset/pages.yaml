    \ \"Several formats of book numbers\")\npublic class IsbnNumbers {\n    @Schema(required\
    \ = true)\n    @JsonProperty(isbn=\"10\")\n    private String isbn10;\n    @Schema(required\
    \ = true)\n    @JsonProperty(isbn=\"13\")\n    private String isbn13;\n\n    //\
    \ Getters and setters\n}\n```\n\n# Customising the OpenAPI Contract of the Application\n\
    \nThe previous annotations allow you to customise the contract for a given REST\
    \ endpoint. But it's also important to customise the contract for the entire microservice.\
    \ Eclipse MicroProfileAPI also has a set of annotations to serve that purpose.\
    \ The difference is that these annotations cannot be used on the endpoint itself\
    \ but, instead, on another Java class which is meant to be configuring the entire\
    \ application. For this, the NumberApplication described in Listing 267 needs\
    \ to extend javax.ws.rs.core.Application and be annotated with OpenAPI annotations."
