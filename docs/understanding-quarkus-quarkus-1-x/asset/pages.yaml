    \ can have several alternatives enabled in the application.properties configuration\
    \ file.\n\n# 4.1.3. Scopes\n\nBy now you've seen a few @ApplicationScoped annotations\
    \ and you might wonder what it means. CDI is Dependency Injection but also Context\
    \ (the \"C\" in CDI). Every bean has a well-defined scope and life cycle that\
    \ is bound to a specific context. In Java, the scope of a POJO is simple: you\
    \ create an instance of a class using the new keyword and rely on the garbage\
    \ collection to get rid of it and free memory. With CDI, a bean is bound to a\
    \ context and remains in context until the bean is destroyed by the container.\
    \ There is no way to manually remove a bean from a context. CDI defines the following\
    \ scopes:\n\n+   - Normal scopes:"
