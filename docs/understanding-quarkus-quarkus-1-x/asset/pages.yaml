  md: "# Listing 158. Getting a JSON Parser\n\n```\nStringReader string = new StringReader(\"\
    {\\hello\\\":world\\}\");\nJsonParser parser = Json.createParser(string);\n\n\
    while (parser.hasNext()) {\n  JsonParser.Event event = parser.next();\n  switch\
    \ (event) {\n    case START_OBJECT:\n    case END_OBJECT:\n      System.out.println(event.toString());\n\
    \      break;\n    case KEY_NAME:\n      System.out.print(\"KEY_NAME \" + parser.getString()\
    \ + \" - \");\n      break;\n    case VALUE_STRING:\n      System.out.println(\"\
    VALUE_STRING \" + parser.getString());\n      break;\n  }\n}\n```\n\nThe result\
    \ of the code in Listing 158 is displayed below. A START_OBJECT event is sent\
    \ when the root object is detected. Then, the KEY_NAME event with the value hello\
    \ is followed by the VALUE_STRING event world. Finally, the END_OBJECT is thrown\
    \ once the parser has reached the end of the JSON document.\n\n```\nSTART_OBJECT\n\
    KEY_NAME hello - VALUE_STRING world\nEND_OBJECT\n```\n\nThis technique of listening\
    \ to events is very low-level, but it allows you to parse huge JSON documents\
    \ without filling the memory. For example, the class in Listing 159 parses a JSON\
    \ file and extracts the customers' email. The parser moves forward until until\
