    # A.8.6. Kubernetes Manifest Files


    So, we''ve been working exclusively on the command line to create a deployment
    with a service and a pod. But imagine doing so when you have several pods and
    complex deployments? There is an easier and more useful way to do it: creating
    configuration files using YAML and applying the entire file to a Minikube cluster
    (using the kubectl command).


    For example, Listing 286 shows the YAML file that describes our fascicle-deployment.
    This file describes some metadata (apiVersion, kind and metadata) and then the
    object spec describes the desired state of the deployment. This is basically deploying
    the agonal/hello-fascicle Docker image and setting the port 8080.'
  merge: -1
  pgno: 399
- img_proc: true
  md: "# Listing 286. Deployment Definition\n\n```\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  labels:\n    app.kubernetes.io/name: fascicle-deployment\n    app.kubernetes.io/version:\
    \ latest\nname: fascicle-deployment\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app.kubernetes.io/name: fascicle-deployment\n      app.kubernetes.io/version:\
    \ latest\n  template:\n    metadata:\n      labels:\n        app.kubernetes.io/name:\
    \ fascicle-deployment\n        app.kubernetes.io/version: latest\n    spec:\n\
    \      containers:\n        - env:\n            name: KUBERNETES_NAMESPACE\n \
    \           valueFrom:\n              fieldRef:\n                fieldPath: metadata.namespace\n\
    \          image: agonal/hello-fascicle/latest\n          imagePullPolicy: IfNotPresent\n\
    \          name: fascicle-deployment\n        ports:\n            - containerPort:\
    \ 8080\n              name: http\n              protocol: TCP\n```\n\nThen we\
    \ have another YAML file to describe the service. As you can see in Listing 287,\
    \ the file starts with some metadata again, and describes the desired state of\
    \ the service (the spec object). It sets the type of service to NodePort (which\
    \ opens a port on the node of the cluster) and configures the external (30574)\
