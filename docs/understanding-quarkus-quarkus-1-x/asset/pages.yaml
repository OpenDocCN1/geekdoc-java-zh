  md: '# # Appendix B: Quarkus Versions


    Quarkus evolves at a fast pace. Below you will find a short recap of the latest
    major versions and their content. If you want to have more details on each release,
    you can browse the GitHub account.


    # ## B.1. Quarkus 1.9 (October 2020)


    Quarkus 1.9 comes with a lot of improvements on top of our existing feature set:


    +   - The Micrometer is maturing

    - Kafka now has metrics

    - Multiple Redis clients are supported (as well as Sentinel connections)

    - Bean Validation is supported by Reactive Routes

    - SmallRye Messaging upgraded to 2.4.0 and Mutiny to 0.9.0

    - Creation of the Quarkiverse initiative, the extension ecosystem.


    # ## B.2. Quarkus 1.8 (September 2020)


    Quarkus 1.8 comes with bug fixes, improvements, as well as some notable new features:


    +   - Multiple persistence units support for the Hibernate ORM extension

    - A new Micrometer extension

    - jbang integration for easy Quarkus-based scripting

    - An update to GraalVM 20.2


    # ## B.3. Quarkus 1.7 (August 2020)


    Quarkus 1.7, with more than 300 pull requests merged, was released with Elasticsearch
    and Redis clients, Reactive routes and Funqy improvements. The most prominent
    new features are:


    +   - New extensions for the low-level and high level Elasticsearch REST clients

    - An extension for the Vert.x Redis client

    - An Hibernate Envers extension

    - Support for the JDBC Db2 driver

    - A lot of improvements to the Reactive routes feature

    - The Funqy serverless framework got some interesting new features


    # ## B.4. Quarkus 1.6 (July 2020)


    Quarkus 1.6 released with AppCDS, Google Cloud Functions, GraalVM 20.1.0 and more.'
