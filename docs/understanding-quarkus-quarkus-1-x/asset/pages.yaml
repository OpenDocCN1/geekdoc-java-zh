    # 9.2.2. Metrics


    Eclipse MicroProfile Metrics handles three types of metrics:


    +   * Base Metrics: Metrics that all MicroProfile vendors have to provide.

    * Vendor Metrics: Vendor specific metrics (optional).

    * Application Metrics: Application-specific metrics (optional).


    Each metric has a different endpoint. The Eclipse MicroProfile Metrics architecture
    consists of four endpoints:


    +   * /metrics/base: Set of metrics that all MicroProfile-compliant servers have
    to provide.

    * /metrics/vendor: Vendor-specific metrics on top of the basic set of required
    metrics.

    * /metrics/application: Metrics provided by the application at runtime.

    * /metrics: Aggregates all the metrics.


