    # 6.2. Eclipse MicroProfile OpenAPI


    JAX-RS lets consume and expose REST APIs. But it doesn''t help you in documenting
    your APIs, you need to use external tools. What Quark allows you to. By default,
    a Quarkus application exposes its API description through an OpenAPI specification.
    It even let you test it via a user-friendly UI named Swagger UI.


    Exposing REST APIs has become an essential part of all modern applications. From
    the microservices developer''s point of view, it is important to understand how
    to interact with these APIs and how to test that they are still valid and backward
    compatible. For that, there needs to be a clear and complete contract. Therefore
    a standard API documentation mechanism is required and can also be used for API
    testing. That''s when OpenAPI comes along.[1-2]


    Eclipse MicroProfile OpenAPI provides a Java API for the OpenAPI v3 specification
    that all application developers can use to expose their API documentation.[3]
    It aims to provide a set of Java interfaces and programming models that allow
    Java developers to natively produce OpenAPI v3 documents from their JAX-RS endpoints.


    The Eclipse MicroProfile OpenAPI APIs and annotations are defined under the main
    org.eclipse.microprofile.openapi package, either at the root, or under the other
    subpackages. Table 34 lists the main subpackages defined in Eclipse MicroProfile
    OpenAPI version 1.1 (under the root org.eclipse.microprofile.openapi package).[3-4]


    | Subpackage | Description |

    | --- | --- |

    | root | Root package of the OpenAPI APIs |

    | annotations | Set of annotations to produce a valid OpenAPI document |

    | models | Interfaces to define OpenAPI document programmatically |

    | spi | Internal SPIs (Service Provider Interfaces) implemented by the provider
    |'
  merge: -1
  pgno: 188
