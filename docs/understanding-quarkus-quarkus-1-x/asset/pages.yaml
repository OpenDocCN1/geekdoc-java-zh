    Figure 29. Transaction Management


    Transactions must guarantee a degree of reliability and robustness and follow
    the ACID properties. ACID refers to the four properties that define a reliable
    transaction: *Atomicity, Consistency, Isolation, and Durability* (described in
    Table 24).


    Table 24. ACID Properties


    | Property | Description |

    | Atomicity | A transaction is composed of one or more operations grouped in a
    unit of work. At the conclusion of the transaction, either these operations are
    performed successfully (commit) or none is performed at all (a rollback) or something
    unexpected or irrecoverable happens. |

    | Consistency | At the conclusion of the transaction, the data are left in a consistent
    state. |

    | Isolation | The intermediate state of a transaction is not visible to external
    applications. |

    | Durability | Once the transaction is committed, the changes made to the data
    are visible to other applications. |


    To explain these properties, I''ll take the classic example of a bank transfer:
    you need to debit your savings account to credit your current account.


    When you transfer money from one account to the other, you can imagine a sequence
    of database accesses: the savings account is debited using an SQL statement, the
    current account is credited using an update statement, and a log is created in
    a different table to keep track of the transfer. These operations have to be done
    in the same unit of work (*Atomicity*) because you don''t want the debit to occur
    but not the credit. From the perspective of an external application querying the
    accounts, only when both operations have been successfully performed are they
    visible (*Isolation*), the external application cannot see the interim state when
    one account has been debited and the other is still not credited (if it could,
    it would think the customer has less money than they really do). *Consistency*
    is when transaction operations (either with a commit or a rollback) are performed
    within the constraints of the database (such as primary keys, relationships, or
    fields). Once the transaction is completed, the data can be accessed from other
    applications (*Durability*).'
