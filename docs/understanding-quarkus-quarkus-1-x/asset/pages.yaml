  md: "file. But it goes beyond that. SmallRye Config implements EclipseMicroProfile\
    \ Configuration for configuring applications (and profiles as you'll see in next\
    \ section). In a microservice architecture, the fact that there is no central\
    \ runtime implies there is no single point of configuration, but several points.\
    \ But sometimes microservices might want to share a common configuration. In that\
    \ case, it could be helpful to access configurations from multiple sources homogeneously\
    \ and transparently. EclipseMicroProfile Configuration provides applications and\
    \ microservices with the means to obtain configuration properties through several\
    \ sources (internal and external to the application), through dependency injection\
    \ or lookup.[112]\n\nThe Eclipse MicroProfile Configuration APIs and annotations\
    \ are all defined under the org.eclipse.microprofile.config package. Table 6 lists\
    \ the main subpackages in Eclipse MicroProfile Configuration version 1.4 (under\
    \ the root org.eclipse.microprofile.config package).[113]\n\n# Table 6. Main org.eclipse.microprofile.config\
    \ Subpackages\n\n| Subpackage | Description |\n| --- | --- |\n| root | Root package\
    \ of the Configuration APIs |\n| inject | CDI support |\n| spi | Internal SPIs\
    \ (Service Provider Interfaces) implemented by the provider |\n\nAlong with APIs,\
    \ Configuration comes with a set of annotations. Table 7 lists a subset of the\
    \ most used annotations.\n\n# Table 7. Main Configuration Annotations\n\n| Annotation\
    \ | Description |\n| --- | --- |\n| @ConfigProperty | Binds the injection point\
    \ with a configured value |\n\nThere is no Quarkus extension per-se for configuration\
    \ as it is part of its core. But Quarkus comes with configuration for free in\
    \ all Quarkus extensions and supports the extension defined in Listing 37 to be\
