    # A.3. GraalVM 2.0.0


    GraalVM is an extension of the Java Virtual Machine (JVM) to support more languages
    and execution modes. It is implemented in Java. GraalVM supports a large set of
    languages: Java, of course, other JVM-based languages (such as Groovy, Kotlin
    etc.) but also JavaScript, Ruby, Python, R and C/C++.


    But also includes a new high performance Java compiler, called Graal. Running
    your application inside a JVM comes with startup and footprint costs. GraalVM
    has a feature to create native images for existing JVM-based applications. The
    image generation process employs analysis to find code reachable from the main
    method and then performs Ahead-Of-Time AOT compilation on the Substrate. The resulting
    binary contains the whole program in machine code for its immediate execution.
    This improves the performance of Java to match the performance of native languages
    for fast startup and low memory footprint.


    HotSpot execution has a Just-In-Time (JIT) compiler. HotSpot starts interpreting
    the code, the methods are compiled at the client compilation level and then finally
    move to the server compilation level. Even with the improvements in the compilation
    levels, HotSpot starts interpreting its bytecode and then moves to jit


    On the other hand, the Ahead-of-Time (AOT) compilation improves the startup time
    by loading compiled classes. This helps avoiding those classes in the interpreted
    mode or at a sub-optimal compilation level.


