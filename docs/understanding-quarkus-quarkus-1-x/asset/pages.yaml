  md: "# Listing 223. Deployment Definition\n\n```\napiVersion: apps/v1\nkind: Deployment\n\
    metadata:\n  labels:\n    app.kubernetes.io/name: quarkus-jar\n    app.kubernetes.io/version:\
    \ latest\n  name: quarkus-jar\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app.kubernetes.io/name: quarkus-jar\n      app.kubernetes.io/version: latest\n\
    \  template:\n    metadata:\n      labels:\n        app.kubernetes.io/name: quarkus-jar\n\
    \        app.kubernetes.io/version: latest\n    spec:\n      containers:\n   \
    \     - env:\n            - valueFrom:\n                fieldRef:\n          \
    \        fieldPath: metadata.namespace\n          image: agoncal/quarkus-jar:latest\n\
    \          imagePullPolicy: IfNotPresent\n          name: quarkus-jar\n```\n\n\
    An important thing to note about the Deployment is that it uses agoncal/quarkus-jar:latest\
    \ as the container image of the Pod. In Listing 224, we're specifying that we\
    \ want to create a Service (a Service is an abstraction that defines a logical\
    \ set of Pods). The spec property includes any containers, network port, or other\
