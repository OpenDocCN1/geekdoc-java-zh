  md: '# A.4.6. Some Maven Commands


    Maven is a command line utility where you can use several parameters and options
    to build, test or package your code. To get some help on the commands you can
    type, use the following commands:


    ```

    $ mvn --help


    uusage mvn [options] [goal(s)] [phase(s)]

    ```


    Here are some commands that you will be using to run the examples in the fascicle.
    Each invokes a different phase of the project life cycle (clean, compile, install
    etc.) and uses the pom.xml to download libraries, continue the compilation, or
    extend some behaviours using plugins:


    +   - mvn clean: Deletes all generated files (compiled classes, generated code,
    artifacts etc).

    - mvn compile: Compiles the main Java classes.

    - mvn test-compile: Compiles the test classes.

    - mvn test: Compiles the main Java classes as the test classes and executes the
    tests.

    - mvn package: Compiles, executes the tests and packages the code into an archive
    (e.g. a war file).

    - mvn install: Builds and installs the artifacts in the local repository.

    - mvn clean install: Cleans and installs (note that you can add several commands
    separated by spaces, like mvn clean compile test).


    > Maven allows you to compile, run, and package the examples of this fascicle.
    It decouples the fact that you need to write your code (within an IDE) and build
    it. To develop you need an Integrated Development Environment (IDE). I use IntelliJ
    IDEA from JetBrains, but you can use any IDE because this fascicle only relies
    on Maven and not specific IDEA features.


    # A.5. cURL 7.x


    To invoke the REST Web Services described in this fascicle, we use cURL.


    cURL is a command-line tool for transferring files with url syntax via protocols
    such as HTTP, FTP, SFTP, SCP, and many more. It is free, open source (available
    under the MIT Licence) and has been ported to several operating systems. You can
    send HTTP commands, change HTTP headers, and so on. It is a good tool for simulating
    a user''s actions at a web browser.


    # A.5.1. A Brief History of cURL


    cURL was first released in 1997. The name stands for Client URL, that''s why you
    can stumble on the spelling cURL instead of Curl or CURL. The original author
    and lead developer is the Swedish developer Daniel Stenberg.


