    # ### 5.5.3. Transactions


    Panache entities and repositories allow you to easily map attributes to a relational
    database, and access them through queries. But what about transactions? What about
    persisting or removing data in a transactional way? For that, we just need to
    use transactional boundaries (services or REST endpoints) using JTA. These transactional
    boundaries can either directly use the Panache entities, or inject the repositories.


    **Using Panache Entities**


    Listing 109 shows a transactional service that persists, deletes and retrieves
    publisher entities in a transactional way. For that, it marks methods with the
    JTA declarative transaction management annotation `@Transactional`. Then, it directly
    uses the Panache entity methods (e.g. invoking `Publisher.persist()`) to persist
    a publisher.'
