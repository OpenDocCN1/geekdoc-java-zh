    # 4.4.1. Log Levels


    Log levels provide a way to categorise logs by their severity, their impact on
    the overall health and stability of the application. JBoss Logger provides different
    levels described in Table 10.


    Table 10. JBoss Logger Levels


    | Level | Description |

    |---|---|

    | FATAL | A critical service failure/complete inability to service requests of
    any kind |

    | ERROR | A significant disruption in a request or the inability to service a
    request |

    | WARN | A non-critical service error or problem that may require immediate correction
    |

    | INFO | Service lifecycle events or important related low-frequency information
    |

    | DEBUG | Messages that convey extra information regarding lifecycle or non-request-events
    which may help debug |

    | TRACE | Messages that convey extra per-request debugging information that may
    be very high frequency


    The way to use these levels is quite simple. The API has several methods (e.g.
    fatal(), info(), etc.), each one corresponding to one level (e.g. FATAL, INFO,
    etc.). As shown in Listing 56, it''s a matter of invoking these methods and passing
    a message (with or without parameters).


    Listing 56. Using Log Levels Methods


    ```

    Logger LOGGER = Logger.getLogger(LoggingResource.class);


    LOGGER.fatal("Fatal", exception);

    LOGGER.error("Error");

    LOGGER.warn("Warning");

    LOGGER.info("Information");

    LOGGER.debug("Debug");

    LOGGER.trace("Trace");

    ```


