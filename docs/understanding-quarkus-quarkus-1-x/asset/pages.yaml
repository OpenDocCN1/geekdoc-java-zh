  md: "# Listing 246. Simple Hamcrest Assertion\n\n```\nclass BookTest {\n  @Test\n\
    \  public void shouldEquals() {\n    Book oneBook = new Book(\"H262\");\n    Book\
    \ anotherBook = new Book(\"H262\");\n    assertThat(oneBook, equalTo(anotherBook));\n\
    \  }\n}\n```\n\nThe `assertThat` method is a stylised sentence for making a test.\
    \ You can write assertions that are easy to read such as:\n\n```\nassertThat(book.getTitle(),\
    \ equalTo(\"H262\"));\nassertThat(book.getYearOfPublication(), equalTo(1979));\n\
    assertThat(book, equalTo(anotherBook));\n```\n\nIf you want to be more expressive,\
    \ you can use some syntax. For example, Hamcrest has is matcher that doesn't add\
    \ any extra behaviour to the underlying matcher. So the following assertions are\
    \ equivalent to the previous ones:\n\n```\nassertThat(book.getTitle(), isEqualTo(\"\
    H262\"));\nassertThat(book.getYearOfPublication(), isEqualTo(1979));\nassertThat(book,\
    \ is(anotherBook));\nassertThat(book.getTitle(), is(not(nullValue())));\nassertThat(book.isbn10,\
    \ is(nullValue())));\nassertThat(book.getNumberOfPages(), isGreaterThan(100));\n\
    ```\n\nHamcrest comes with a library of useful matchers. Table 77 shows some of\
    \ the most important ones.\n\nTable 77. Main Hamcrest Matchers\n\n| Matchers |\
    \ Description |\n| --- | --- |\n| anything | Always matches, useful if you don't\
    \ care what the object under test is |\n| is | Decorator to improve readability\
    \ |\n| allOf | Matches if all matchers match (like Java 8) |\n| anyOf | Matches\
    \ if any matcher match (like Java ||) |\n| not | Matches if the wrapped matcher\
    \ doesn't match and vice versa |\n| equalTo | Tests object equality using Object.equals()\
    \ |\n| notValue, nullValue | Tests for null |"
