  md: '+   - Environment variables (INVOICE_VATRATE=50)


    +   - Environment file named .env placed in the current working directory (INVOICE_VATRATE=50)


    +   - External config directory under the current working directory (config/application.properties)


    +   - Resources src/main/resources/application.properties


    If the same property is defined in multiple configuration sources, a policy to
    specify which one of the values will be effectively used is applied. Therefore,
    the default values can be specified in a file packaged with the application, and
    the value can be overwritten for each deployment, using system properties for
    example. And of course, you can create your own source. Eclipse MicroProfile Configuration
    has a set of APIs for that.


