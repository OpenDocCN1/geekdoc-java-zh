    # 2.6.3. Imperative and Reactive Programming


    One of the goals of Quarkus is to unify both imperative and reactive models seamlessly.
    Thanks to its reactive core based on Netty and Eclipse Vert.x, everything in Quarkus
    is non-blocking. This means that the same thread can handle multiple concurrent
    requests: when a process is waiting for some IO, the thread is released and can
    be used to handle another request. With non-blocking IO, the number of cores becomes
    the essential setting as it defines the number of IO threads you can run in parallel.
    Used properly, efficiently dispatches the load on the different cores, handling
    more with fewer resources.


    But that requires the application code to be non-blocking and avoid blocking the
    IO thread. This is a very different development model and would mean that you
    would not be able to use any of your legacy imperative code as non-imperative
    such as REST endpoints, database access or file systems. So having the ability
    to mix both reactive and imperative code is essential for Quarkus.


    The secret behind is to use a reactive engine for both imperative and reactive
    code as shown in Figure 13. Quarkus uses Eclipse Vert.x and Netty at its core.
    Netty is an asynchronous event-driven framework. This means that every request
    is handled by an event loop (the IO thread) and then, depending on the destination,
    it can invoke the imperative code on a worker thread (e.g. servlet, Jax-RS) or
    the reactive code on an IO thread (reactive). Thus, Quarkus is also a'
