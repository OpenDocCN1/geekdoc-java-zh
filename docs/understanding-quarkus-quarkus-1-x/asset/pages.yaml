  md: "# Listing 124. Application Information\n\n```\n@OpenAPIDefinition(\ninfo =\
    \ @Info(\n  title = \"Book API\",\n  description = \"This API allows CRUD operations\
    \ on books\",\n  version = \"1.0\",\n  contact = @Contact(name = \"@agoncal\"\
    , url = \"https://twitter.com/agoncal\",\n  license = @License(\n    name = \"\
    MIT\",\n    url = \"https://opensource.org/licenses/MIT\")\n  )externalDocs =\
    \ @ExternalDocumentation(url = \"https://github.com/agoncal/agoncal-fascicle-quarkus\"\
    , description = \"All the Quarkus fascicle code\"),\ntags = {\n  @Tag(name = \"\
    api\", description = \"Public API that can be used by anybody\",\n  @Tag(name\
    \ = \"books\", description = \"Anybody interested in books\")\n}\n)\npublic class\
    \ BookApplication extends Application {\n}\n```\n\nThe result is that the root\
    \ of the OpenAPI v3 contract is now fully documented (see Listing 125). The documentation\
    \ is not about an endpoint per-se, but the entire application.\n\n# Listing 125.\
    \ Root of the OpenAPI v3 Contract\n\n```\nopenapi: 3.0.1\ninfo:\n  title: Book\
