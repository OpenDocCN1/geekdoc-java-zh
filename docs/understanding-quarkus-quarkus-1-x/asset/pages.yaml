  md: "# Listing 76. SQL Script Creating a BOOK Table Structure\n\n```\nCREATE TABLE\
    \ BOOK\n(\n  ID BIGINT NOT NULL,\n  DESCRIPTION VARCHAR(255),\n  ILLUSTRATIONS\
    \ BOOLEAN,\n  ISBN VARCHAR(255),\n  NBOFPAGES INTEGER,\n  PRICE FLOAT,\n  TITLE\
    \ VARCHAR(255),\n  PRIMARY KEY (ID)\n)\n```\n\nA Data Definition Language (DDL,\
    \ or description language) uses a syntax for defining database structures. The\
    \ table BOOK is we will find all the books of our application. Each book is identified\
    \ by a primary key column (PRIMARY KEY (ID)) and each attribute is stored in a\
    \ column (e.g. TITLE, PRICE, ISBN etc.). A column in a table has a type (e.g.\
    \ VARCHAR, INTEGER, BOOLEAN etc.) and can accept not null values or not (NOT NULL).\n\
    \n# Entities\n\nWhen talking about mapping objects to relational database, persisting\
    \ objects, querying objects, the term entity should be used rather than object.\
    \ Objects are instances that live in memory. Entities are objects that live for\
    \ a short time in memory and persistently in a relational database. They have\
    \ the ability to be mapped to a database; they can be concrete or abstract; and\
    \ they support inheritance, relationships, and so on.\n\nIn the JPA persistence\
    \ model, an entity is a Plain Old Java Object (POJO). This means an entity is\
    \ declared, instantiated and used just like any Java class. An entity usually\
    \ has attributes (its state), can have business methods (its behaviour), constructors,\
    \ getters and setters. Listing 77 shows a simple entity."
