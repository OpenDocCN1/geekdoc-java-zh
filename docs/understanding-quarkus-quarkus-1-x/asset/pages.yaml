  md: "Quarkus is designed with GraalVM VM in mind it can build native executables.\
    \ One of the limitations of GraalVM is the use of reflection. Reactive operations\
    \ are supported in Quarkus, but all relevant members must be explicitly registered\
    \ for reflection (which results in a bigger native executable). And if you use\
    \ injection in a private member, reflection is used. For this reason, we are encouraged\
    \ to use package-private scope instead of private when using injection.\n\n# Injection\
    \ Points\n\nThe @Inject annotation defines an injection point that is injected\
    \ during bean instantiation. Injection can occur via three different mechanisms:\
    \ property, setter, or constructor.\n\nProperty injection is when you annotate\
    \ an attribute (a.k.a. property) with @Inject.\n\n```\n@Inject\nNumberGenerator\
    \ numberGenerator;\n```\n\nNotice that it's not necessary to create a getter and\
    \ a setter method on an attribute to injection. CDI can access an injected field\
    \ directly (even if it's private), which sometimes helps eliminate some wasteful\
    \ code. But instead of annotating the attributes, you can add the @Inject annotation\
    \ on a constructor as follows:\n\n```\n@Inject\npublic LegacyBookService(NumberGenerator\
    \ numberGenerator) {\n    this.numberGenerator = numberGenerator;\n}\n```\n\n\
    But the rule is that you can only have one constructor injection point. The container\
    \ is the one doing, not you (you cannot invoke a constructor in a managed environment);\
    \ therefore, there is only one constructor allowed so that the container can do\
    \ its work and inject the right references.\n\nThe other choice is to use setter\
    \ injection, which looks like constructor injection. You just need to annotate\
    \ the setter with @Inject.\n\n```\n@Inject\npublic void setNumberGenerator(NumberGenerator\
    \ numberGenerator) {\n    this.numberGenerator = numberGenerator;\n}\n```\n\n\
    You may ask, \"When should I use a field over a constructor or setter injection?\"\
    \ There is no real technical answer to that question; it's a matter of your personal\
    \ taste. In a managed environment, the container is the one doing all the injection's\
    \ work; it just needs the right injection\n\nQuarkus simplifies the injection\
    \ model even more. When using constructor or setter injection, you"
