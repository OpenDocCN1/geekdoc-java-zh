  md: "# Listing 132. Operation with Request Body\n\n```\npost:\n  summary: Creates\
    \ a book\n  requestBody:\n    content:\n      application/json:\n        schema:\n\
    \          $ref: '#/components/schemas/Book'\n        required: true\n```\n\n\
    When the same annotation is used on a class and on a method, the values from the\
    \ method instance takes precedence for that particular method. This commonly occurs\
    \ with the @Server and @Tag annotations, for example.\n\n# Customising Responses\n\
    \nA REST endpoint can return a datatype (e.g. String, int, Book, etc.) or a Response.\
    \ In that case, if we don't specify the type of the response, the contract is\
    \ unclear. @Schema can also be used on a response, as seen in Listing 133. As\
    \ the response may contain several books, schema type is set to an array.\n\n\
    # Listing 133. Operation Returning an Array\n\n```\n@GET\n@Operation(summary =\
    \ \"Returns all the books from the database\")\n@ApiResponse(responseCode = \"\
    200\",\n  content = @Content(mediaType = APPLICATION_JSON,\n    schema = @Schema(implementation\
    \ = Book.class, type = SchemaType.ARRAY)))\n@ApiResponse(responseCode = \"204\"\
    , description = \"No books\")\npublic Response getAllBooks() {\n```\n\nThe result\
    \ is that, type of the response is a reference to Book (see Listing 134). Being\
    \ of type array and of media type application/json, the consumer of this API knows\
    \ what to expect when invoking getAllBooks()."
