- img_proc: true
  md: "| Property | Default |\n|---|---|\n| quarkus.test.native-image-profile | prod\
    \ |\n| The profile to use when testing the native image | |\n\n# # 11.2. Testing\
    \ Frameworks\n\nIntegrating JUnit and having one annotation for JVM mode tests\
    \ (@QuarkusTest) and another one for native tests (@NativeTest) is just the tip\
    \ of the iceberg. Quarkus goes further by integrating several frameworks so that\
    \ tests can be richer and more explicit without much effort: REST Assured for\
    \ expressive expressions, REST Assured for testing REST endpoints and TestContainers\
    \ for running Docker images during the test lifecycle. Let's have a look at these\
    \ frameworks and see how Quarkus integrates them.\n\n# ## 11.2.1. REST Assured\n\
    \nREST Assured is an open source Java library that provides a Domain Specific\
