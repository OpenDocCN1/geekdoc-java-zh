  md: "# Exceptions handling and Transactions\n\nException handling in Java has been\
    \ confusing since the creation of the language (as it involves both checked and\
    \ unchecked exceptions). Associating transactions and exceptions is also quite\
    \ intricate. Before going further, I just want to say that throwing an exception\
    \ in a business method will not mark the transaction for rollback. It depends\
    \ on the type of exception or the metadata defining the exception\n\n+   - Application\
    \ exceptions: Exceptions related to business logic. For example, an application\
    \ exception might be raised if invalid arguments are passed to a method, the inventory\
    \ level is too low, or if credit card number is invalid. Throwing an exception\
    \ does not automatically result in marking the transaction for rollback. That's\
    \ because the container doesn't roll back when checked exceptions (which extend\
    \ java.lang.Exception) are thrown, but it does for unchecked exceptions (which\
    \ extend RuntimeException).\n- System exceptions: Exceptions caused by system-level\
    \ faults, such as JVM errors, failure to acquire a database connection, and so\
    \ on. A system exception must be a subclass of RuntimeException. Throwing a system\
    \ exception results in marking the transaction for rollback.\n\nWith this, we\
    \ now know that if the container detects a system exception, such as ArithmeticException,\
    \ ClassCastException, IllegalArgumentException, or NullPointerException, it will\
    \ rollback the transaction. This default behaviour can be overridden in the annotation\
    \ using rollback and dontRollback attributes. As shown in Listing 92, persist()\
    \ will rollback if the StatisticsService throws StatisticsException.\n\nListing\
    \ 92. Transaction Rollbacks on Exception\n\n```\n@ApplicationScoped\npublic class\
    \ PublisherService {\n\n    @Inject\nEntityManager em;\n\n    @Inject\nStatisticsService\
    \ statistics;\n\n    @Transactional(value = REQUIRED, rollbackOn = StatisticsException.class)\n\
    public void persist(Publisher publisher) throws Exception {\n        em.persist(publisher);\n\
    \        statistics.addNew(publisher);\n        return publisher;\n    }\n}\n\
    ```\n\nTo override the default behaviour and cause transactions to be marked for\
    \ rollback for all application exceptions, you need to write the following:\n\n\
    ```\n@Transactional(rollbackOn = Exception.class)\n```"
