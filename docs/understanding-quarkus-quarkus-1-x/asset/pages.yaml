  md: '# 2.7. Summary


    This understanding gave you most of the required terminology around Quarkus. There
    is less code in this chapter than the following ones, but we needed to make sure
    you understand all the concepts around Quarkus before going any further.


    Quarkus is not just about microservices but it was built with microservices in
    mind. So this chapter started introducing this architectural style, its pros and
    cons, and put in perspective with the monolithic approach. Microservices are not
    just HTTP (more in [Chapter 6, HTTP Microservices](https://example.com)), so this
    chapter also had to introduce reactive systems that you will be developing in
    [Chapter 8, Event-Driven Microservices](https://example.com).


    When it comes to microservices, Quarkus tends to integrate with the MicroProfile
    set of specifications. Supported by the independent Eclipse Foundation, MicroProfile
    adopts a subset of Jakarta EE standards (CDI, JAX-RS, JSON-B and JSON-P), and
    adds new ones to common common patterns (Configuration, Fault Tolerance, Metrics,
    etc.).


