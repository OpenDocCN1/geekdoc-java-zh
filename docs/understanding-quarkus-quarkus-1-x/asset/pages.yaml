    # 2.3. Understanding MicroProfile


    Having an extension mechanism (described below), Quarkus implements many features
    and integrates with many external frameworks. Furthermore, being microservices-oriented,
    Quarkus integrates the entire set of specifications of Eclipse MicroProfile through
    SmallRye.


    Eclipse MicroProfile addresses the need for enterprise Java microservices.[1]
    Eclipse MicroProfile enables EE developers to leverage their existing skill while
    shifting their focus from traditional monolithic applications to microservices.
    MicroProfile APIs establish an optimal foundation for developing microservices-based
    applications by adopting a subset of Jakarta EE standards and extending them to
    address common microservices patterns. Eclipse MicroProfile is specified under
    the Eclipse Foundation and is implemented by SmallRye.


    # Jakarta EE


    Even if Quarkus does not rely on Jakarta EE, it supports some of its specifications,
    and so does Eclipse MicroProfile. So it''s worth mentioning.


    Created in 1998, Java EE (Java Enterprise Edition) can be seen as an extension
    of the Java Standard Edition (Java SE).[2] It is a set of specifications intended
    for enterprise applications in order to facilitate the development of distributed,
    transactional, and secure applications. It is developed by the Java Community
    Process, with contributions from industry experts and commercial and open source
    organisations.[3]


    In 2017, with version 8 of the platform, Java EE was donated to the Eclipse Foundation
    and renamed Jakarta EE.[4] Jakarta EE is the name of the platform governed by
    the Jakarta EE Working Group.[5] The first version is Jakarta EE 8, which is based
    on the Java EE 8 technologies. Future versions will be driven by the JCP but through
    the open Eclipse Foundation.


    # 2.3.1. Eclipse Foundation


    The Eclipse Foundation is an independent, non-profit entity that acts as a steward
    for the Eclipse open source software development community.[6] The Foundation
    focuses on key services such as: intellectual property management, ecosystem development,
    development process, and IT infrastructure. It was created by IBM in 2001 and
    is now supported by a consortium of software vendors (Red Hat, Huawei, Bosch,
    Fujitsu, SAP, Oracle, etc.).


    # 2.3.2. SmallRye


    SmallRye is an open source project that implements the Eclipse MicroProfile specifications.[7]
    It is community-driven and everyone is welcome to contribute to. SmallRye implementations
    are tested against the Eclipse MicroProfile TCKs (Technology Compatibility Kits).
    Several open source'
