    # 3.2.3. Maven Plugin


    We can also bootstrap a Quarkus application by means of its Maven plugin.[11]
    This plugin provides a set of goals that can be executed to create an application,
    compile, build it and even extend the project with some features. The Quarkus
    plugin is based on the following Maven coordinates: io.quarkus:quarkus-maven-plugin.
    You can check the available goals and the latest version of it with the following
    command:'
