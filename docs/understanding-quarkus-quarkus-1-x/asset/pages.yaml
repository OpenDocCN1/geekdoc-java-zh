    Figure 37. Binding between a JSON document and Java classes\n\n# 6.3.2. Binding\
    \ POJOs\n\nSo far we see how JPA maps objects to a relational database: it uses\
    \ a default mapping mechanism (a.k.a. programming by exception or convention over\
    \ configuration) and gives you a set of annotations to customise the default.\
    \ OpenAPI works the same: an OpenAPI v3 contract is generated based default endpoint\
    \ annotations, or Eclipse MicroProfile OpenAPI gives you a set of annotations\
    \ to add extra information to the contract if needed. The same occurs with JSON-B.\n\
    \n# Default Binding\n\nDefault mapping is a set of rules used by JSON-B to map\
    \ default objects without any annotations or any configuration. For JSON-B, the\
    \ default mapping rules are:\n\n+   - Attribute names are bound to the same JSON\
    \ key name (e.g. the title key).\n- All the basic Java types (String, Integer,\
    \ int, etc.), standard Java types (BigDecimal, URL, Optional, etc.) or datas have\
    \ their value bound to the JSON value. These values have to follow the RFC 7159\
    \ standard (the JSON Data Interchange Format) and be encoded in UTF-8[156].\n\n\
    So let we have a look at the default binding in a simple example. Listing 138\
    \ represents a Book object from which I've omitted the getters and setters for\
    \ clarity. As you can see, this object has several attributes (title, price etc.)\
    \ of different types (String, float, Integer, and Boolean), a default constructor,\
    \ and getters and setters for each attribute."
