  md: '# GraalVM Community Edition 20.2.0


    released on Aug 18

    GraalVM is a high performance runtime for Java, JavaScript, LLVM-based languages
    such as C and C++, and other dynamic languages. Additionally, GraalVM allows effortless
    interoperability between programming languages and Java applications ahead-of-time
    into native executables for faster startup and lower memory overhead.


    This distribution of GraalVM Community includes:


    +   - Runtime with the GraalVM compiler

    - Node.js runtime with the GraalVM JavaScript interpreter

    - LLVM bytecode runtime

    - Developer monitoring and debugging tools


    The GraalVM environment can be extended with optionally available components such
    as Native Image, Ruby, R, Python, LLVM Toolchain, and WASM using the GraalVM Updater
    tool.

