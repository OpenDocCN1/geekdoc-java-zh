- img_proc: true
  md: "# Listing 228. A Unit Test Class for Customer\n\n```\npublic class CustomerTest\
    \ {\n    private Customer customer = new Customer();\n}\n```\n\n# Fixtures\n\n\
    Fixtures are methods to initialise and release any common object during tests.\
    \ JUnit @BeforeEach and @AfterEach annotations to execute code before or after\
    \ each test. These methods can be given any name (clearCustomer()) in Listing\
    \ 229), and you can have multiple methods in one test. JUnit uses @Before and\
    \ @AfterAll annotations to execute specific code once, or after the test is executed.\
    \ These methods must be unique and static. @BeforeAll and @AfterAll can be very\
    \ useful if you need to allocate and release expensive resources.\n\n# Listing\
    \ 229. Fixture Executed Before Each Test\n\n```\n@BeforeEach\npublic void clearCustomer()\
    \ {\n    customer.clear();\n}\n```\n\nA test method must use the @Test annotation,\
    \ return void, and take no parameters. This is controlled at runtime and throws\
    \ an exception if not respected. In Listing 230, the test method ageShouldBeGreaterThanThanZero\
    \ creates a new Customer and sets a specific date of birth. Then, using the assertion\
    \ mechanism of JUnit (explained in the next section), it checks that the age is\
    \ greater than zero.\n\n# Listing 230. Method Testing Age Calculation\n\n```\n\
    @Test\npublic void ageShouldBeGreaterThanZero() {\n    customer = new Customer(\"\
    Rita\", \"Navalhas\");\n    customer.setDateOfBirth(LocalDate.of(1975, 5, 27));\n\
    \n    customer.calculateAge();\n    assert(customer.getAge() >= 0);\n}\n```\n\n\
    JUnit also allows us to check for exceptions. In Listing 231, we are trying to\
    \ calculate the age of a null customer object so the call to calculateAge() method\
    \ should throw a NullPointerException. If it does, the test succeeds. If it doesn't,\
    \ or if it throws a different type of exception than the one declared, the test\
    \ fails."
