- img_proc: true
  md: '| Class/Interface | Description |

    | --- | --- |

    | Client | Main entry point to the fluent API used to build and execute client
    requests in order to consume responses returned |

    | ClientBuilder | Entry point to the fluent API used to bootstrap Client instances
    |

    | Configurable | Side configuration from Client, WebTarget, and Invocation |

    | Entity | Encapsulates message entity including the associated variant information
    |

    | Inocation | A request that has been prepared and is ready for execution |

    | Inocation.Builder | A client request invocation builder |

    | WebTarget | A resource target identified by the resource URI


    In Chapter 7, you will see how an HTTP microservice invokes another one. Basically,
    it will use the Eclipse MicroProfile REST Client which is part of MicroProfile.
    Eclipse MicroProfile REST Client is based on the JAX-RS 2.0 client API, so it''s
    important that you know the base before diving into REST Client.


    # Bootstrapping the Client


    The main entry point for the API is the Client interface. The Client interface
    manages and configures HTTP connections. It is also a factor for WebTargets and
    has a set of methods for creating resource links and invocations. The Client instances
    are created using one of the static class ClientBuilder


    ```

    Client client = ClientBuilder.newClient();

    ```


    # Targets and Invocations


    Once you have a Client you target a RESTful web service URI and invoke some HTTP
    methods on it. That''s what the WebTarget and Invocation interfaces allow you
    to do. The Client.target() methods are factories for web targets that represent
    a specific URI. You can execute requests from a WebTarget instance. You can create
    a WebTarget with the String representation of a URI:


    ```

    WebTarget target = client.target("http://localhost:8081/customers");

    ```


    You can also obtain a WebTarget from a java.net.URI, javax.ws.rs.core.Builder
    or javax.ws.rs.core.Link:


    ```

    URI uri = new URI("http://localhost:8081/customers");

    WebTarget target = client.target(uri);

    ```


    Now that you have a URI target, you need to build your HTTP request. The WebTarget
    allows you to do that by using the Invocation.Builder. To build a simple HTTP
    GET on a URI just write:'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'Invocation invocation = target.request().buildGet();


    Invocation.Builder allows you to build a GET method as well as POST, PUT and DELETE
    methods. You can also build a request for different MIME types and even add path,
    query and matrix parameters. For PUT and POST methods you need to pass an Entity,
    which represents the payload to send to your Restful service base:


    ```

    target.request().buildDelete();

    target.queryParam("author", "Else").request().buildGet();

    target.path(bookId).request().buildGet();

    target.request(MediaType.APPLICATION_XML).buildGet();

    target.request(MediaType.APPLICATION_XML).acceptLanguage("pt").buildGet();

    target.request().buildPost(Entity.entity(new Book()));

    ```


    The code below joins Invocation. You then need to call the invoke() method to
    actually invoke your remote Restful web service and get a Response object back.
    The Response is what defines the contract with the returned instance and is what
    you will consume:


    ```

    Response response = invocation.invoke();

    ```


    So if you are putting together, there are the lines of code to invoke a GET method
    on a remote Restful web service located at http://localhost:8081/customers and
    return a text/plain value:


    ```

    Client client = ClientBuilder.newClient();

    WebTarget target = client.target("http://localhost:8081/customers")

    Invocation invocation = target.request(MediaType.TEXT_PLAIN).buildGet();

    Response response = invocation.invoke();

    ```


    Thanks to the API and some shortcuts, you can write the same behaviour in a single
    line of code:


    ```

    Response response = ClientBuilder

    .newClient())

    .target("http://localhost:8081/customers")

    .request(MediaType.TEXT_PLAIN)

    .get();

    ```


