    # 3.4.1. Building an Executable JAR


    To execute our endpoint in production mode, first we need to package it with the
    /.mvnw package command. If we do so, it produces 2 files in the target directory:


    ```

    getting-started$ ls -lh target/getting-started*

    -rw-r--r-- 222K getting-started-1.0-runner.jar

    -rw-r--r-- 5.7K getting-started-1.0.jar

    ```


    As you can see, these two JAR files have different sizes (more on executable JARs
    in Chapter 10), therefore their content is different:


    +   - getting-started-1.0.jar: Contains the classes and resources of the projects,
    it''s the real artifact produced by the Maven build.

    - getting-started-1.0-runner.jar: Is an executable jar.


    # 3.4.2. Executing the Executable JAR


    With an executable JAR, you can run the application using the following command:


    ```

    getting-started$ java -jar target/getting-started-1.0-runner.jar

    ```


    But be aware that getting-started-1.0-runner.jar is an executable jar, not an
    Uber-JAR¹¹¹ An Uber-JAR contains both the code of our application and all its
    dependencies in one single JAR file. This is not the case. Quarkus copies all
    the dependencies to the target/lib directory and getting-started-1.0-runner.jar
    depends on this target/lib directory. If you remove the target/lib and re-run
    the application with java -jar target/getting-started-1.0-runner.jar it won''t
    work (as you will get a ClassNotFoundException).


    By executing the executable JAR, you will get traces that look like the ones in
    Listing 16.'
