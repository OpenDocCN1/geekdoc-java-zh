  md: 'But if we need have different values depending on the environment, profiles
    are here to help. Let''s say we want a different prefix in development mode. When
    executing mvn quarkus:dev, the dev profile is automatically enabled, so we prefix
    all the configuration keys with %dev. Notice how we can use profiles to have different
    levels as needed.


    ```

    %dev.isbn.prefix=Dev

    %dev.quarkus.log.category="org.argoncal".level=INFO

    ```


    Accordingly, when you run your tests, the test profile is enabled, and the prod
    profile is enabled when building an executable JAR or a native executable.


    ```

    %test.isbn.prefix=TST

    %test.quarkus.log.category="org.argoncal".level=DEBUG


    prod.isbn.prefix=PRD

    ```


    Quarkus comes with 3 profiles (dev, test, prod) but you might need other profiles.
    This is quite easy to do as Quarkus will simply use the quarkus.profile system
    property (or QUARKUS_PROFILE environment variable). Let''s say you have a staging
    environment and want to set some specific values for it. It''s just a matter of
    adjusting these variables with the prefix %staging in the application.properties:


    ```

    %staging.isbn.prefix=STAG

    %staging.quarkus.log.category="org.argoncal".level=INFO

    ```


    Then, you set the system variable depending on your needs:


    +   - Use mvn -Dquarkus.profile=staging quarkus:dev

    - Or java -Dquarkus.profile=staging -jar profiles-1.0-runner.jar if you are running
    your executable JAR.


    # 4.3.1. Configuring Profiles


    Quarkus being really highly configurable, you can even tweak some profiles so
    the configuration strategy is changed accordingly. Table 9 Some Quarkus Profile
    Configuration Properties


    | Property | Default |

    |---|---|

    | quarkus.profile | prod Profile that will be active when Quarkus launches |

    | quarkus.test.native-image-profile | prod The profile to use when testing the
    native image |

    | quarkus.test.profile | test The profile to use when testing using @QuarkusTest
    |'
