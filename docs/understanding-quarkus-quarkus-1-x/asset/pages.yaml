  md: 'Application scope @ApplicationScoped: Spans for the entire duration of an application.
    The bean is created only once for the duration of the application and discarded
    when the application is shut down. This scope is useful for utility or helper
    classes, or objects that store data shared by the application (but you should
    be careful about concurrency issues when the data is accessed by several threads).


    Session scope @SessionScoped: Spans across several HTTP requests or method invocations
    for a user session. The bean is created for the duration of an HTTP session and
    is discarded when the session ends. This scope is for objects that are needed
    throughout the session, such as user preferences or login credentials.


    Request scope @RequestScoped: Corresponds to a single HTTP request or a method
    invocation. The bean is created for the duration of the method invocation and
    is discarded when the method ends. It is used for service classes that are only
    needed for the duration of an HTTP request.


    +   Pseudo scopes:


    +   Dependent scope @Dependent: The lifecycle is the same as that of the client.
    A dependent bean is created when it is injected and the reference is removed when
    the target is removed. This is the default scope for CDI.


    +   Singleton scope @Singleton: Identifies a bean that CDI only instantiates once.


    ```

    @SessionScoped

    public class ShoppingCart implements Serializable {...}

    ```


    An instance of the ShoppingCart bean is bound to a user session and is shared
    by all requests that execute in the context of that session. If you don''t want
    the bean to sit in the session indefinitely, consider using another scope with
    a shorter life span, such as the request scope.


    If a scope is not explicitly specified, then the bean belongs to the dependent
    pseudo-scope @Dependent. Beans with this scope are never shared between different
    clients or injection points. They are dependent on some other bean, which means
    their life cycle is bound to the life of that bean. A dependent bean is instantiated
    when the object it belongs to is created, and destroyed when the object it belongs
    to is destroyed. The code that follows shows a dependent scoped with a qualifier:


    ```

    @Dependent @ThirteenDigits

    public class IsbnGenerator implements NumberGenerator {...}

    ```


    Being the default scope, you can omit the @Dependent annotation and write the
    following:'
