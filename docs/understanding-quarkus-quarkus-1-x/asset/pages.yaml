    # 9.3. Summary


    One of the challenges of distributed architecture is monitoring. You end up with
    microservices deployed in different locations, they communicate using an unreliable
    network, the logs are distributed over all and some processes might take longer
    to accomplish than expected. Without monitoring, you can''t easily react to a
    malfunctioning system.


    The first thing to know about a microservice is: "Is the service running, and
    how well is it doing?" To differentiate between these states, the Eclipse MicroProfile
    Health API has the concept of liveness and readiness. You develop a class that
    tests the health of your component, service, or runtime, add'
