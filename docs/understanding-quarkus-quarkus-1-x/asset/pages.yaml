  md: "Listing 144. Serialising and Deserialising JSON using an API\n\n```\n// Creates\
    \ a book instance\nBook book = new Book().title(\"H2G2\").price(12.5F).isbn(\"\
    1-84023-742-2\");\n```\n\n```\n// Creates Jsonb instance\nJsonb jsonb = JsonBuilder.create();\n\
    ```\n\n```\n// Serialises\nString json = jsonb.toJson(book);\n```\n\nIn Listing\
    \ 144, the toJSON method serialises a Book object to a String. If you want to\
    \ return this String from a JAX-RS endpoint, you have two possibilities as shown\
    \ in Listing 145: you either return a String (getBookAsResponse()) or return a\
    \ Response and embed the String to it (getBookAsString()).\n\nListing 145. Serialising\
    \ JSON in a REST Endpoint\n\n```\n@GET\n@Produces(APPLICATION_JSON)\npublic String\
