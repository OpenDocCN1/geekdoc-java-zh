  md: "Using the @Consumes @Produces annotations on a method overrides any annotations\
    \ on the resource class for a method argument or return type. In the absence of\
    \ these annotations, for any media type (/*) is assumed. By default, CustomerRestService\
    \ produces plain text representations that are overridden in some methods (see\
    \ Listing 118). Note that the getJsonAndXML produces an array of representations\
    \ (XML or JSON).\n\n# Listing 118. A Customer Resource with Several Representations\n\
    \n```\n@Path(\"/api/customers\")\npublic class CustomerResource {\n\n@GET\n@Produces(MediaType.TEXT_PLAIN)\n\
    public Response getAsPlainText() {\n    // ...\n}\n\n@GET\n@Produces(MediaType.TEXT_HTML)\n\
    public Response getAsHtml() {\n    // ...\n}\n\n@GET\n@Produces((MediaType.APPLICATION_JSON,\
    \ MediaType.APPLICATION_XML)\npublic Response getAsAndXML() {\n    // ...\n}\n\
    \n@PUT\n@Consumes(MediaType.TEXT_PLAIN)\npublic void putName(String customer)\
    \ {\n    // ...\n}\n}\n```\n\nA RESTful web service is capable of producing more\
    \ than one media type, the targeted method will correspond to the most acceptable\
    \ media type, as declared by the client in the Accept header of the HTTP request.\
    \ For example, if the Accept header is Accept: text/plain and the URI is /api/customers,\
    \ the getAsPlainText() method is invoked.\n\n# Returned Types\n\nSo far you've\
    \ seen how to invoke a method (using parameters, media type, HTTP methods etc.)\
    \ without caring about the returned type. What can a RESTful web service return?\
    \ Like any Java class, a method can return any standard Java type, a bean or any\
    \ other object as long as it has a textual representation that can be transported\
    \ over HTTP. In this case, the runtime determines the MIME type of the object\
    \ being returned and invokes the appropriate Entity Provider to get its representation.[2].\
    \ The runtime also determines the HTTP return code to send to the consumer (204-No\
    \ Content if the resource method's return type is void or null; 200-OK if returned"
