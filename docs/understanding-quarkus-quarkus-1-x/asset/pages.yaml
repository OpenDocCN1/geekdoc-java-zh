    # # A.9. Kafka


    Kafka (or Apache Kafka) is an open source distributed event streaming platform.
    It provides a unified, high-throughput, low-latency platform for handling real-time
    data feeds thanks to its optimised binary TCP-based protocol. Kafka uses ZooKeeper
    to manage and coordinate the cluster topology. ZooKeeper is a centralised service
    for maintaining configuration information, naming, providing distributed synchronization,
    and group services. All of these kinds of services are used in some form or another
    by distributed applications. ZooKeeper enables this distributed coordination in
    a highly reliable way.


    # # A.9.1. A Brief History of Kafka


    Kafka was originally developed by Jay Kreps at LinkedIn, and was subsequently
    opened in early 2011. Graduation from the Apache Incubator occurred in 2012. Jay
    Kreps chose to name the software after the author Franz Kafka because it is "a
    system optimised for writing", and he liked Kafka''s work. He then created the
    company Confluent in 2014 to give support and professional resources around Kafka.


    # # A.9.2. Installing Kafka on macOS


    First of all, check if you already have the Kafka and the ZooKeeper formulae installed
    on your machine:


    ```

    $ brew list kafka

    Error: No such keg: /usr/local/Cellar/kafka


    $ brew list zookeeper

    Error: No such keg: /usr/local/Cellar/zookeeper

    ```


    If both formulae are not installed, just install Kafka with the following Homebrew
    command. Kafka depending on ZooKeeper, Homebrew will automatically install it:


    ```

    $ install kafka

    ==> Installing dependencies for kafka: zookeeper

    ==> Installing kafka dependency: zookeeper

    ...

    ==> Installing kafka

    ...

    ```


    You should now see both formulae in Homebrew:'
