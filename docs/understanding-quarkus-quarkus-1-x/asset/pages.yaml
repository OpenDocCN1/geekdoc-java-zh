    </dependency>\n```\n\n# ## 5.5.1. Panache Entities\n\nHibernate ORM with Panache\
    \ provides an active record pattern implementation for JPA.[137] In the active\
    \ record pattern, the entity is an object that wraps a row in a database table\
    \ (or view), encapsulates the database access, but also adds domain logic on that\
    \ data. So entity carries both data and behaviour. Listing 95 shows a Panache\
    \ entity carrying data and behaviour.\n\nListing 95. A Panache Entity\n\n```\n\
    @Entity\npublic class Publisher extends PanacheEntity {\n\n@Column(length = 30)\n\
    \  public String name;\n\n  public static Optional<Publisher> findByName(String\
    \ name) {\n    return find(\"name\", name).firstResultOptional();\n  }\n\n  public\
    \ static long deleteByName(String name) {\n    return delete(\"name\", name);\n\
    \  }\n}\n```\n\nIf you compare the Panache entity in Listing 95 with its JPA counterpart,\
    \ you will notice a few differences:\n\n+   - Public attributes with no getters\
    \ and setters (here name): Since Java lacks support for properties in the language,\
    \ we have to create fields, then generate getters and setters for those fields.\
