  md: "value is not null. Sometimes you want finer control over all you are returning:\
    \ the response body (a.k.a. an entity) of course, but also the response code and/or\
    \ response headers or cookies. That's when you return a Response object. It is\
    \ good practice to return a javax.ws.rs.Response with an entity it would guarantee\
    \ a return content type. Listing 119 shows you different return types.\n\nListing\
    \ 119. A Customer Service Returning Data Types, a Bean, and a Response\n\n```\n\
    @Path(\"/customer\")\npublic class CustomerResource {\n\n@GET\npublic String getAsPlainText()\
    \ {\n    return new Customer(\"John\", \"Smith\").toString();\n}\n\n@GET\n@Path(\"\
    max\")\npublic Integer getMaximumAge() {\n    return 42;\n}\n\n@GET\n@Produces(MediaType.APPLICATION_XML)\n\
    public Customer getAsXML() {\n    Customer customer = new Customer(\"John\", \"\
    Smith\");\n    return customer;\n}\n\n@GET\n@Produces(MediaType.APPLICATION_JSON)\n\
    public Response getAsJSON() {\n    Customer customer = new Customer(\"John\",\
    \ \"Smith\");\n    return Response.ok(customer).encoding(\"utf-8\").build();\n\
    }\n```\n\nThe getAsPlainText() method returns a String representation of a customer\
    \ and the getMaximumAge() returns a numerical constant. The defaults will so return\
    \ the HTTP status on both methods will be 200-OK (if no exception occurs). The\
    \ getAsXML() returns a Customer object that the runtime will marshal as XML.\n\
    \nThe getAsJSON() method does not return an entity but instead a javax.ws.rs.core.Response\
    \ object wraps the entity that is created and instantiated using the ResponseBuilder\
    \ as a factory. In this example, we want to return an object (the Customer) with\
    \ a 200-OK status status (the ok() method), but we also want to specify the encoding\
    \ to be UTF-8. Calling the ResponseBuilder.build() method creates the final Response\
    \ instance.\n\nTable 31 shows a subset of the Response API."
