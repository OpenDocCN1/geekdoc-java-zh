    Topic: vinyl-topic Partition: 1 Leader: 0 Replicas: 0 Isr: 0

    Topic: vinyl-topic Partition: 2 Leader: 0 Replicas: 0 Isr: 0


    # Publishing Events


    Now, time to send messages to the topic. When we use the kafka-console-producer
    allows us to type messages on the console and send to the topic. Open one terminal,
    execute the command and start typing some messages (here I use JSON but you can
    send any format to a topic):


    ```

    $ kafka-console-producer --bootstrap-server localhost:9092 --topic vinyl-topic

    > {"id": 1,"artist": "Ella Fitzgerald","album": "Sings the Cole Porter Song Book"}

    > {"id": 2,"artist": "Billie Holiday","album": "Lady In Satin"}

    > {"id": 3,"artist": "Sarah Vaughan","album": "In the Land of Hi-Fi"}

    > {"id": 4,"artist": "Nina Simone","album": "Pastel Blues"}

    ```


    # Receiving Events


    Open a second terminal and use the kafka-console-consumer to consume the messages.
    The --from beginning parameter allows us to start consuming with the earliest
    message present in the topic rather than the latest message. You should see the
    following:


    ```

    $ kafka-console-consumer --bootstrap-server localhost:9092 --topic vinyl-topic
    --from

    beginning


    {"

    ```'
