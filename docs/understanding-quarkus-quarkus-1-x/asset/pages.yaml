  md: '# State and Behaviour on Panache Entities


    A typical JPA entity has private attributes with getters and setters, and sometimes
    a few business methods (e.g. a method that calculates the customer age based on
    his/her date of birth). But that''s it. We don''t encapsulate JPQL queries or
    CRUD operations on a JPA entity.


