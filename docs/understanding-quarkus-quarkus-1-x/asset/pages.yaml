  md: '+   - Identifier in the parent class: Entities a technical identifier to be
    able to map a primary key column in the database. Being a technical id, it''s
    not relevant to our model and can be inherited from a parent class (the id attribute
    is declared in the PanacheEntity class).


    +   - State and behaviour in the same class (name attribute and findByName()):
    Traditional patterns allow to split entity definition (the model) from the operations
    you can do (using DAOs or Repositories). You don''t have to use Panache Entities,
    but if you really want to, you can also have repositories in Hibernate ORM with
    Panache (see below).


    +   - Simplified queries: JQL is a very rich and powerful query language. It''s
    also very verbose for common operations, requiring you to write queries when you
    don''t need all the statements.


    Hibernate ORM with Panache takes an opinionated approach to tackle all these problems
    and makes your code as concise as possible. For that, you need to follow rules:


    +   - Make your entities extend PanacheEntity: It has an identifier field that
    is auto-generated. If you require a custom ID strategy, you can extend PanacheEntityBase
    instead and handle the ID yourself (see class diagram in Figure 31).


    +   - Use public fields: Get rid of boilerplate getter and setters: under the
    hood, Hibernate ORM with Panache generates all getters and setters that are missing,
    and rewrite access to these fields to the accessor methods. This way you can still
    write useful accessors when you need them, which will be used even when you use
    field accesses.


    +   - Use the active record pattern: Put all your entity logic in static methods
    in your entity class. The PanacheEntityBase superclass already comes with lots
    of useful static methods, and you can add your own in your entity class.


    Figure 31 shows the class diagram of the entity hierarchy. To be a Panache entity,
    your entity needs to extend from the PanacheEntity mapped superclass that gives
    you an identifier. PanacheEntity extends from the abstract class PanacheEntityBase
    that gives you most of the common CRUD operations, plus a few queries.'
