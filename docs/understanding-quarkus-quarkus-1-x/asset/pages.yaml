    Figure 1. Use case diagram of the Vintage Store application


    The Vintage Store application manipulates a few domain objects that are described
    in Figure 2. Vinyl, tapes, books and CDs, of course, but also chapters, authors,
    purchase orders, invoices and shopping carts. Don’t spend too much time on this
    diagram for now as you will come across most of these objects throughout this
    fascicle.'
