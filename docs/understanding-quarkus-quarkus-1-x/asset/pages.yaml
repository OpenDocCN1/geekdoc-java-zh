  md: "Listing 251. Book Microservice Invoking the ISBN Microservice\n\n```\n@Path(\"\
    /api/books\")\n@Produces(MediaType.APPLICATION_JSON)\npublic class BookResource\
    \ {\n\n    @Inject @RestClient\n    IsbnResourceProxy isbnService;\n\n    @GET\n\
    \    public Response getRandomBook() {\n        IsbnNumbers isbnNumbers = isbnService.generateIsbnNumbers();\n\
    \        // ...\n    }\n}\n\n@Path(\"/api/numbers\")\n@RegisterRestClient\npublic\
    \ interface IsbnResourceProxy {\n\n    @GET\n    IsbnNumbers generateIsbnNumbers();\n\
    }\n```\n\nBut now, with such coupling, we have a problem: to run the tests of\
    \ the BookResource REST endpoint to be up and running. Of course, if the IsbnResource\
    \ Docker image is available on registry, we could use TestContainers to download\
    \ and run it. But we want to avoid this and just test the BookResource in isolation.\
    \ For this, as shown in Figure 55, we need to mock the IsbnResourceProxy interface.\n\
    \n| Book Microservice | Isbn Microservice |\n| :--- | :--- |\n| @Path <br> BookResource\
    \ | @Mock @RestClient <br> MockIsbnResourceProxy |\n| @Inject @RestClient <br>\
    \ generateIsbn0() | |\n| @Path <br> BookResource | @RegisterRestClient <br> IsbnResourceProxy\
    \ | @Mock @RestClient <br> MockIsbnResourceProxy | @Path <br> IsbnResource |\n\
    \nFigure 55. Mocking microservice invocation\n\nQuarkus supports the use of mock\
    \ objects using the io.quarkus.Mock annotation. To use it, simply override the\
    \ bean you wish to mock with a class in the src/test/java directory, and associate\
    \ it with @Mock. So, to mock the invocation to the remote IsbnResource, we implement\
    \ the IsbnResourceProxy interface in src/test/java with the class MockIsbnResourceProxy\
    \ in Listing 252. As"
  merge: -1
