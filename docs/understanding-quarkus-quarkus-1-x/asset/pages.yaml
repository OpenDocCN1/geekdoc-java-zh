    know how to find an entity by id, persist it, remove it, and so on. But finding
    an entity by id is quite limiting, as you only retrieve a single entity by its
    unique identifier. In practice, you may need to retrieve an entity by criteria
    other than the Id (name, ISBN etc.) or retrieve a set of entities based on different
    criteria (e.g. all customers living in the United States). This possibility is
    inherent to relational databases, and JPA has a language that allows this interaction:
    Java Persistence Query Language (JPQL).


    JPQL is used to define searches for persistent entities independent of the underlying
    database. JPQL is a query language that takes its roots in the syntax of SQL,
    which is the standard language for'
