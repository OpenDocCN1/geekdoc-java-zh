    # # 6.3. JSON Binding


    Most of the examples of REST endpoint examples that you''ve seen so far, consume
    or produce JSON. In fact, a REST endpoint can consume or produce any kind of media
    type: from plain text to XML, images or PDFs. But JSON has become a common data
    format exchanged between microservices. That''s why Quarkus implements the two
    MicroProfile specifications dealing with: JSON Binding and JSON Processing.


    JSON Binding (JSON-B) is a standard binding layer for converting Java objects
    to/from JSON documents.[13] It defines a default mapping algorithm for converting
    Java classes to JSON while enabling developers to customise the mapping process
    through the use of Java annotations.


    The JSON Binding APIs are all defined in the javafx.json.bind package, Table 38
    lists the main subpackages defined in JSON-B 1.0 (under the root jakarta.json.bind
    package).[14-5]


    Table 38. Main java.json.bind Subpackages


    | Subpackage | Description |

    | --- | --- |

    | root | Root package of the JSON-B APIs |

    | adapter | APIs to define a custom mapping for a Java type |

    | annotation | JSON-B mapping annotations |

    | config | Classes and interfaces to configure the mapping provider |

    | serializer | JSON-B internals for custom serialisers |'
