    Figure 2. Class diagram of the Vintage Store application


    The code you''ll see in this fascicle gets its inspiration from the Vintage Store,
    but it''s not the original application per-se. You can download the code of the
    original application if you want, but it''s not necessary in order to follow the
    code of this fascicle.[24]


    # # Downloading and Running the Code


    The source code of the examples in the fascicle is available from a Git repository
    and can be cloned, downloaded or browsed online at https://github.com/agonal/agonal-fascicle-quarkus/tree/1.0.
    The code has been developed and tested on the macOS platform but should also work
    on Windows or Linux. The examples used in this fascicle are designed to be compiled
    with Java 11, to be built with Maven 3.6.x and to be tested with JUnit 5.x and
