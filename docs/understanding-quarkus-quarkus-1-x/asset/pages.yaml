  md: '# Appendix E: Fascicles by the Same Author


    The agoncal series contains two types of fascicles. The Understanding collection
    is all fascicles that divide into a specific technology, explain it, and show
    different aspects of it as well as integrating it with other external technologies.
    On the other hand, the Practising collection is all coding. So you are supposed
    to already know a little of this technology and be ready to code in order to build
    a specific application.


    # E.1. Understanding Bean Validation 2.0


    Validating data is a common task that Java developers have to do and it is spread
    throughout all layers (from client to database) of an application. This common
    practice is time-consuming, error prone, and hard to maintain in the long run.
    Besides, some of these constraints are so frequently used that they could be considered
    standard (checking for a null value, size, range, etc.). It would be good to be
    able to centralise these constraints in one place and share them layers.


    That''s when Quark comes into play.


    In this fascicle, you will learn Quark and its different APIs to apply constraints
    on a bean, validate all sorts of constraints, write your own constraints and few
    advanced topics such as integrating Bean Validation with other frameworks (JPA,
    JAX-RS, CDI, Spring).


    ISBN: 9781803990225 | ASIN B07B2KJ41R


    # E.2. Understanding JPA 2.2


    Applications are made up of business logic, interaction with other systems, user
    interfaces etc. and data. Most of the data that our applications manipulate have
    to be stored in datastore, retrieved, processed and analysed. If this datastore
    is a relational database and you use an object-oriented programming language as
    Java, then you might want to use an Object-Relational Mapping tool.


    That''s when Quark comes into play.


    In this fascicle, you will learn Quark, the standard ORM that maps Java objects
    to relational databases. You will discover its annotations for mapping entities,
    as well as the Java Persistence Query Language, entity life cycle and a few advanced
    topics such integrating JPA with other frameworks (Bean Validation, JTA, CDI,
    Spring).


    ISBN: 9781093918977 | ASIN B07RWXPXPS6


    # E.3. Understanding Quarkus


    Microservices is an architectural style that scales an application as a collection
    of distributed services. Microservices are certainly appealing but there are many
    questions that should be asked prior to diving into this architectural style:
    How do deal with an unreliable network in a distributed architecture? How do I
    test my services? How do I monitor them? How do I package and execute them?'
