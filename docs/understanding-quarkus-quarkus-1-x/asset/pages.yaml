  md: "# Customising Parameters\n\nThere are several ways to pass parameters to an\
    \ endpoint operation. For example, JAX-RS uses the @PathParam annotation to pass\
    \ parameters to the URL path, or passes data straight into the request body. Thanks\
    \ to the OpenAPI @Parameter annotation in Listing 129, you can add a description\
    \ to the parameter to tell what this parameter is about.\n\nListing 129. Operation\
    \ with Parameters\n\n```\n@GET\n@Path(\"{id}\")\npublic Response getBook(@Parameter(description\
    \ = \"Book identifier\", required = true)\n@PathParam(\"id\") Long id) {\n```\n\
    \nAs shown in Listing 130, thanks to @Parameter, the contract is enriched with\
    \ a description and expresses that the parameter can be required or not.\n\nListing\
    \ 130. Contract Describing Operation Parameters\n\n```\n/api/books/{id}:\nget:\n\
    \  summary: Returns a book for a given identifier\n  parameters:\n    name: id\n\
    \    in: path\n    description: Book identifier\n    required: true\n    schema:\n\
    \      format: int64\n      type: integer\n```\n\nFor POST or PUT operations,\
    \ MicroProfile OpenAPI has a @RequestBody annotation to describe the data passed\
    \ in the body (see Listing 131). In fact, the @Parameter annotation, @RequestBody\
    \ takes a @Content that describes the content passed in or out. So it specifies\
    \ the formats passed in the body (here JSON).\n\nListing 131. Operation with Request\
    \ Body\n\n```\n@POST\npublic Response createBook(@RequestBody(\n  required = true,\n\
    \  content = @Content(mediaType = APPLICATION_JSON,\n  schema = @Schema(implementation\
    \ = Book.class)))\nBook book, @Context UriInfo) {\n```\n\nThanks to @Schema, the\
    \ contract has a reference (the keyword ref) to #components/schemas/Book. In fact,\
    \ the Book structure being a reference, it is used in Listing 132 as an input\
    \ parameter to the createBook() method as well as in Listing 134."
  merge: -1
