- img_proc: true
  md: '```

    $ kafka-topics --zookeeper localhost:2181 --list


    $ kafka-topics --zookeeper localhost:2181 --create --topic vinyl-topic --partitions
    3

    --replication-factor 1

    Created topic vinyl-topic.


    $ kafka-topics --zookeeper localhost:2181 --list

    vinyl-topic

    ```


    The kafka-topics command has a `--describe` parameter to get all the details and
    configuration of a topic:


    ```

    $ kafka-topics --zookeeper localhost:2181 --describe --topic vinyl-topic

    ```


    Topic: vinyl-topic PartitionCount: 3 ReplicationFactor: 1

