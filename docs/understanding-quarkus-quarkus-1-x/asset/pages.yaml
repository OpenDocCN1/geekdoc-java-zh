    # # 7.3. Eclipse MicroProfile Fault Tolerance


    CORS is about allowing, or not allowing, client invocations to cross different
    origins. But once the invocations start to go, you''ll need to handle communication
    failure and make resilient applications. For that, Quarkus has an implementation
    of the Eclipse MicroProfile Fault Tolerance specification. As the number of services
    grows, the odds of any service failing grows. If one of the involved services
    does not respond as expected, e.g. because of fragile network communication, we
    have to compensate for this exceptional situation. Eclipse MicroProfile Fault
    Tolerance allows us to build up our microservice architecture to be resilient
    and fault tolerant by design. This means we will not only be able to detect any
    issue but also handle it automatically.


    The Eclipse MicroProfile Fault Tolerance APIs and annotations are defined under
    the main org.eclipse.microprofile.faulttolerance package, either at the root,
    or under the subpackages. Table 47 lists the main subpackages defined in Eclipse
    MicroProfile Fault Tolerance version 2.1 (using the org.eclipse.microprofile.faulttolerance
    package). [16]


    Table 47. Main org.eclipse.microprofile.faulttolerance Subpackages


    | Subpackage | Description |

    | --- | --- |

    | root | Root package of the Fault Tolerance APIs |

    | exceptions | Exceptions for Fault Tolerance |


    With APIs, Fault Tolerance comes with a set of annotations. Table 48 lists a subset
    of the commonly used annotations.


    Table 48. Main Fault Tolerance Annotations


    | Annotation | Description |

    | --- | --- |

    | @Timeout | Defines a duration for timeout |

    | @Retry | Defines a criteria on when to retry |

    | @Fallback | Provides an alternative solution for a failed execution |

    | @Bulkhead | Isolates failures in part of the system while the rest of the system
    can still function |

    | @CircuitBreaker | Offers a way to fail fast by automatically failing the execution
    to prevent the system overloading and an indefinite wait or timeout by the clients'
