    # A.2. Java 11


    Essential for the development and execution of the examples in the fascicle is
    the Java Development Kit (JDK). The JDK includes several tools as a compiler (javac),
    a virtual machine, a documentation generator (javadoc), monitoring tools (Visual
    VM) and so on. The code in this fascicle uses Java 11 (JDK 11.0.8).


    # A.2.1. Architecture


    One design goal of Java is portability, which means that programs written for
    the Java platform must run similarly on any combination of hardware and operating
    system with adequate runtime support. This is achieved by compiling the Java language
    code to an intermediate representation called bytecode, instead of directly to
    a specific machine code. This bytecode is then analysed, interpreted and executed
    by the Java Virtual Machine (JVM).


    The Interpreter is the one interpreting the bytecode. It is the disadvantage of
    the interpreter that, when one method is called multiple times, a new interpretation
    is required every time. When it''s Just In Time (JIT) compiler compiles code,
    JIT is basically the component that translates the JVM bytecode (generated by
    your javac command) into machine code which is the language that your underlying
    execution environment (i.e. your'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'processor) can understand—and all that happens dynamically at runtime! The
    JIT then finds repeated code, it compiles the bytecode and changes it to native.
    This native code will then be used directly for repeated method calls, which improves
    the performance of the system. JIT is also called the Java HotSpot (a.k.a. Java
    Performance Engine, or HotSpot VM). Then, the Garbage Collector will collect and
    remove unreferenced objects.


    When using GraalVM you have the choice of just-in-time or ahead-of-time compilation.
    GraalVM has a high performance Java compiler, called Graal, which can be used
    in the HotSpot VM.


    # A.2.2. A Brief History of Java


    James Gosling, Mike Sheridan, and Patrick Naughton initiated the Java language
    in June 1991. Java was originally designed for interactive television, but it
    was too advanced for the digital cable television industry at the time. The language
    was initially called Oak an oak tree that stood outside Gosling''s. Later, the
    project went by the name Green and was finally renamed Java, from coffee. Gosling
    designed Java with a C++-style syntax that system and application programmers
    would find familiar. Sun Microsystems released the first public implementation
    as Java 1.0 in 1996. Following Oracle''s acquisition of Sun Microsystems in 2009–2010,
    Oracle has described it as the "steward of java technology" since.


    # A.2.3. Installing the JDK on macOS


    To install the JDK 11.0.8, to go to the official website, select the appropriate
    platform and language, and download the distribution. For example, on macOS, download
    the file jdk-11.0.8_osx-x64_bin.dmg shown in Figure 61 (you should check out the
    Accept License agreement box before hitting the download link to download start).
