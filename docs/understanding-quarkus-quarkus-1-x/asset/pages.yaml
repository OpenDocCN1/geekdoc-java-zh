  md: '# Introduction


    In the late 90s, I was working on J2EE 1.2: the first release of the Java Enterprise
    Edition. It was also the time where companies started to realise the potential
    of the Internet for their business. For a few months, I worked for a famous English
    airline company setting up their e-commerce website. Yes, it was a time where
    you usually buy a flight or train ticket at a travel agency. This revolutionary
    movement (buying online) came at a technical cost: a cluster for static content
    (HTML, CSS, images), a cluster for the web tier (Servlets and JSPs), a cluster
    for Stateless EJBs, a cluster for Entity Beans, and a cluster for the database.
    And as you can imagine, load balancing failover and sticky sessions for every
    tier loaded with application servers. This e-commerce website went live... and
    it worked!


    Then came Struts, Spring and Hibernate. Full J2EE application servers shrunk down
    to servlet containers such as Tomcat and Jetty. We see things moving, as architectures
    becoming stateless, fellow being abandoned, migrations from SOAP to REST and mobile
    devices taking over web crawling. Then came the Internet of Things (IoT), the
    cloud, microservices, Function as a Service (FaaS) and it never stops. Other things
    didn''t change, like the some Gang of Fire design patterns, architecture design
    patterns, using testing frameworks and building tools. We reinvented some wheels
    and gave them names, but we also learned dozens of promising programming languages
    (running on top of the JVM or not) and agile techniques. Thanks to these evolutions
    that I have witnessed, today you can sit down, read this fascicle and write some
    code.


    # Where Does This Come From?


    Involved in J2EE since 1998, I followed its evolution and the Java EE expert group
    from version 6 to 8. During that time, I wrote a book in French "Java EE 5"[1].
    The book was published by a French editor and got noticed. I was then contacted
    by Press, an American editor, to work on an English version. I liked the challenge.
    So I changed the structure of the book, updated it, translated it, and ended up
    with "Beginning Java EE 6 book". A few years later, Java EE 7 was released, so
    I updated my book, adding a few extra chapters, and ended up with "Beginning Java
    EE 7" that was 500 pages long[2]. This process of writing got quite a painful
    (some text editors shouldn''t be used to write books, inflexible) and I also had
    some arguments with my editor[3].


    Parallel to that, the history of Java EE 8 was somewhat painful and long[4]. I
    was still part of the Expert Group, but nobody really knew the we''s mailing list
    was so quiet. No real exchange, no real vision, no real challenges. When I decided
    not to work on a Java EE 8 book, the community said otherwise. I started receiving
    emails about updating my book. I used to always meet someone at a conference going
    "Hey, Antonio, when is your next book coming out?" My answer was "No"


    I decided to take stock. What was holding me back from writing? It was my editor
    and Java EE 8. So, I decided to get rid of it, extracted the chapters I wanted
    from my Java EE 7 book and updated them. That''s where the idea of writing "fascicles",
    instead of an entire book, came from. Then, I looked at self-publishing, and here
    I am at Kindle Publishing[5].


    After-publishing a few fascicles, I saw that Red was working on a game changer:
    Quarkus. I started to look at it at a very early stage, and got the idea of creating
    a workshop. I contacted the'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Quarkus team to submit my idea: Emmanuel Bernard and Clement Cofflier liked
    it, and we put together a workshop and gave it at a few conferences.1 This workshop
    introduced a first fascicle: Practising Quarkus. I liked Quarkus so much that
    I started it at customers for proof of concepts and bringing it to production.
    I started to write a few blogs, a few articles and I decided to create a fascicle
    on Quarkus. The fascicle you have in your hands is for you to have an understanding
    of what Quarkus is and how you can use it for your microservice architecture.


    I hope you''ll find this fascicle useful.


    # Who Is This Fascicle?


    Quarkus has its genesis in the JBoss community. JBoss has long expertise on running
    application servers (JBoss EAR, WildFly) or building reactive applications on
    the JVM (Eclipse Vert.x for example). Due to its extension mechanism, Quarkus
    supports several Java frameworks (e.g. Hibernate, Camel, etc.) as well as specifications
    (e.g. a subset of Jakarta EE, MicroProfile which is a set of specifications to
    develop microservices in Java.


    So, this fascicle is for the Java community as a whole and for those of you interested
    in microservice architectures. The only requirement to follow and understand this
    fascicle is to know Java and have some knowledge of relational databases and Docker.


    # How Is This Fascicle Structured?


    This fascicle concentrates on Quarkus 1.9.0.Its structure will help you to discover
    this technology as well as helping you to further dive into it if you already
    have some experience of it.


    This fascicle starts with Chapter 1, First Step with Quarkus by showing a few
    lines of Quarkus code. That''s because, as developers, we like to read code first
    when learning a new technology.


    Chapter 2, Understanding Quarkus sets up some terminology (Microservices, Reactive
    Systems, MicroProfile, Cloud Native, GraalVM) and briefly presents Quarkus, the
    problems it addresses and explains the common concerns discussed throughout the
    fascicle.


    Chapter 3, Getting Started is all about showing some basic code running on Quarkus
    and explaining how to run and use such application before building and packaging
    a native executable version of it.


    Quarkus has a powerful extension mechanism for integration with many technologies.
    Chapter 4, Core Quarkus focuses on the core technologies of Quarkus such as injection,
    configuration and profiles.


    Microservices are trendy and use all sorts of design patterns. But in all, most
    microservices need to interact with data. Chapter 5, Data, Transactions and ORM
    covers data validation, objectrelational mapping and transactions. In this chapter,
    you will also see ORM with Panache is an easy way to manipulate persistent data.


    When it comes to the first thing that comes to our minds is: HTTP microservices.
    Chapter 6, HTTP Microservices presents most of the HTTP-related technologies such
    as RESTful web services, OpenAPI v3 and JSON manipulation.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'One microservice does not make a microservice architecture. You need several
    of them talking to each other. Chapter 7, Communication and Fault Tolerance is
    all about microservices invoking each other through HTTP and making sure they
    can fallback if microservice does not work.


    Reactive programming and reactive messaging are covered in Chapter 8, Event-Driven
    Microservices.


    When you have several microservices, observability becomes a real challenge. You
    need to know which microservices are alive and ready, and expose some metrics
    so you know they are performing as expected. Chapter 9, Observability covers the
    MicroProfile specifications dealing with observability: Health and Metrics.


    When there are many microservices, you need to package them into containers and
    orchestrate them with an orchestrator. Chapter 10, Cloud Native you''ll see the
    different formats used by Quarkus to package your code, and how Quarkus extensions
    make it easy to interact with Docker and Kubernetes.


    One thing that Quarkus is really good at, is testing. Chapter 11, Tests digs into
    JVM and Native Mode testing, as well as all the testing and mocking frameworks
    it supports.


    In Chapter 12, Putting It All Together, you''ll build a more complex application
    with several concepts that have been introduced throughout this fascicle.


    Chapter 13, Summary wraps up with a summary of what you''ve learnt in this fascicle.


    Appendix A, Setting up the Development Environment on macOS highlights the tools
    used throughout the fascicle and how to install them.


    Appendix B, Quarkus Versions lists all the Quarkus releases.


    Appendix C, Eclipse MicroProfile Specification Versions lists all the revisions
    of the MicroProfile specification.


    Appendix D points to some external references which are worth reading if you want
    to know more about Quarkus.


    This is not the only fascicle I have written. You''ll find a description of the
    other fascicles in Appendix E:


    +   - Understanding Bean Validation 2.0

    - Understanding JPA 2.2

    - Understanding Quarkus

    - Practicing Quarkus


    # Conventions


    This fascicle uses a diverse range of languages, mostly Java, but JSON, XML, YAML
    or shell scripts. Each code example is displayed appropriately and appears in
    fixed-width font. All the included code comes from a public Git repository and
    is continuously tested. Therefore, you'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'shouldn''t have any problem with code that is syntactically correct. In some
    cases, the original source code has been specially formatted to fit within the
    allowable page space, with additional line breaks or modified indentation. To
    increase readability, some examples code where it is seen as unnecessary. Always
    remember that you can find the entire code online at https://github.com/agoncal/agoncal-fascicle-quarkus/tree/1.0.


    Italics are used to highlight an important word for the first time, or to give
    the definition of an abbreviation or acronym. Bold is **rarely used**.


    Some useful information.


    Something you should really do if you want the code to work properly.


    Warns you of a possible technical problem.


    # # The Sample Application


    Throughout the book, you will see snippets of code all belonging to the Vintage
    Store application. I created this application for my very first book, and I still
    use it as an example. This application is an e-commerce website allowing users
    to browse a catalogue of vintage stuff (vinyl, tapes, books and CDs). Using a
    shopping cart, they can add or remove items as they browse the catalogue and then
    check out so that they can pay and obtain a purchase order. The application has
    external interactions with a bank system to validate credit card numbers.


    The actors interacting with the system are:


    +   * Employees of the company who need to manage both the catalogue of items
    and the customers'' details. They can also browse the purchase orders.

    * Users who are anonymous persons visiting the website and are consulting the
    catalogue of books and CDs. If they want to buy an item, they need to create an
    account to become customers.

    * Customers who can login to the system, browse the catalogue, update their account
    details, and buy items online.

    * The external Bank to which the system delegates credit card validations.


    Figure 1 depicts the use case diagram which describes the system''s actors and
    functionalities.'
