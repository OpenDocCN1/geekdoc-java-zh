    all the concepts around Quarkus. Chapter 2, Understanding Quarkus defined Microservices,
    Reactive Systems, MicroProfile, Cloud Native, GraalVM, and briefly presented Quarkus.


    Then, thanks to Chapter 3, Getting Started, you bootstrapped a simple example
    and made sure your development environment up and running: developing, debugging,
    testing some code, but also using live reload or QuarkVM to build native executable
    and containerising it.


