    \ swipe gesture on a MacBook or the vertical swipe along the far-right edge of\
    \ the trackpad on most Windows laptops.\n\nJava interprets either kind of scroll\
    \ event as a MouseEvent. We can add a mouseWheelMoved() listener to the BubbleListener\
    \ to handle mouse wheel events or trackpad scroll gesture events on systems that\
