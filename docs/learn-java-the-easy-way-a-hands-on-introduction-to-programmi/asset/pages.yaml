    \ method, add the following code after the closing brace of onCreate() but before\
    \ the final brace for MainActivity.\n\n```\npublic boolean onCreateOptionsMenu(Menu\
    \ menu) {\n    MenuInflater inflater = getInflater();\n    inflater.inflate(R.menu.menu_main,\
    \ menu);\n    return true;\n}\n```\n\nThe onCreateOptionsMenu() method does exactly\
    \ what its name implies—it tells Android what to do when creating the options\
    \ menu for our app. In this case, we will tell Android we to expand the menu_main.xml\
    \ file to serve as our options menu. The menu_main.xml file is not a menu yet,\
    \ so we need to convert it into a menu using a class called MenuInflater. We'll\
    \ create a MenuInflater instance, which we call inflater, by using the getInflater()\
    \ method. Once we have it, we call the inflate() method and pass the XML file\
    \ (R.menu.menu_main) and the menu we want items to inflate into (menu). You may\
    \ need to press ALT-ENTER (on macOS, OPT-ENTER) to correct any missing import\
    \ statements as you add the code to your file.\n\nAfter making this change, save\
    \ and run the app. Android lets you know there's an options menu available by\
