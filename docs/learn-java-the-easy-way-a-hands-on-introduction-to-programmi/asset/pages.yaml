  md: '# JAVA WITHOUT THE HEADACHE


    Java is the world''s most popular programming language, but it''s known for having
    a steep learning curve. Learn the Easy Way that takes the out of learning Java
    with hands-on projects that will get you building real, functioning apps right
    away.


    You''ll start by familiarizing yourself with JShell, Java''s interactive command
    line shell that allows programmers to run single lines of code and get immediate
    feedback. Then, you''ll be creating a guessing game, a secret message encoder,
    and a multitouch bubble-drawing app for both desktop and mobile devices using
    Eclipse, an industry-standard IDE, and Android Studio, the development environment
    for making Android apps.


    As you build these apps, you''ll learn how to:


    +   * Create functions to reuse code and save time


    +   * Build graphical user interface (GUI) elements, including buttons, menus,
    pop-ups, and sliders


    +   * Take advantage of Eclipse and Android Studio features to debug your code
    and find, fix, and prevent common mistakes


    If you''ve been thinking about learning Java, Learn the Easy Way will bring you
    up to speed in no time.


    # ABOUT THE AUTHOR


    +   * Perform calculations, manipulate text strings, and generate random colors


    +   * Use conditions, loops, and methods to make your programs responsive and
    concise


    Bryson Payne is a professor of computer science at the University of North Georgia,
    where he has taught for more than 17 years. He previously taught middle-school
    math and programming and continues to work extensively with K–12 schools to promote
    technology education. He is the author of Teach Your Kids to Code, also from No
    Starch Press.


    COVERS JAVA 8 AND 9


