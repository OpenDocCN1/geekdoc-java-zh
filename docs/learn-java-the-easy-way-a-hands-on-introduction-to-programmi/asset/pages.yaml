  md: "Inside the actionPerformed() method that we added to the BubbleList class,\
    \ adding the following three lines of code to repaint the screen:\n\n```\npublic\
    \ void actionPerformed(ActionEvent e) {\n    for (Bubble b : bubbleList) {\n \
    \       b.update();\n    }\n    repaint();\n}\n```\n\nAt, we're using the for-each\
    \ version of a statement to loop through each bubble b in bubbleList. Remember\
    \ that bubbleList is the ArrayList containing all the bubbles we created by clicking\
    \ and dragging the mouse on the screen.\n\nAs we loop through each bubble in bubbleList,\
    \ we call a new function named update() on all the bubbles. Eclipse underlines\
