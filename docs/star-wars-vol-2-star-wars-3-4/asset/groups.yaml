    当我们只靠副反应堆运行时，想要进行任何冲撞都会很困难。


    嘿，如果你有在不被发现的情况下偷走一艘死星的更好计划，我们我们就去偷了，当我们在这个空间抛弃主反应堆的时候你本该大声说的！


    指挥桥呼叫机舱。

    丘维，你已经有一周时间了。现在我都能从零开始造出一艘新的探测器了。照这个速度下去，在我们到达——之前，我们就会老死。


    呜呜呜！！


    丘维需要帮助！我们得派个人下去……


    他在说什么？


    我们空间并不充足，你难道一直没在听吗？


    嘿，你不想知道他说了什么。


    这艘船通常由数千名船员运行。而我们只有十几个反抗军，而且他们一个都没踩过死星的脚。


    我去过机舱了。反应堆爆炸时我们很幸运才得以溜掉，但那次反馈完全烧坏了跳跃引擎。


    而且我们还没有船长。维特将军的穿梭器依然没有消息。


    “船长？你正盯着船长看呢，甜心。我们不是在走私香料。如果还有人要掌舵这艘船，我们没戏了。”


    伙计们，伙计们！我们有一艘装满灵魂的半死之船，有一支用来运行它的骨干船员，而且通往我们要的地方还有很长的光年要走。


    反正，我们都知道到达那里后什么在等着我们。


    很有可能……这是“先驱号”的最后一次航程。


    所以，让它成为难忘的一程吧。


    噢，它已经难忘了，完全是因为错误的理由。


    丘维！这玩意儿不能再快点吗？！


    呜呜呜！！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_210_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_211_0.png)


    几天前……


    警告！反应堆即将过载。请立即撤离。


    公主，死法多得的是。我很快就能想出几个。


    伙计们……进展如何？


    事实证明，炸毁一艘帝国军舰船比拯救一艘容易得多。


    呜呜呜呜！！


    丘维说没时间了，反应堆随时都会爆炸。如果我们现在不抛弃它……


    我们不能，汉。在还没准备好之前不行。


    阿尔-图，拜求你告诉我们准备好了！


    呜呜喔！！


    我们必须完美地把握时机，否则——


    太晚了！韦奇！让大家都后退！它要——


    阿尔-图！现在，你这个呆头机器人！快做——


    呜


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_213_0.png)


    哈哈！我们进入超空间空间了！我们做到了！


    没关系的，殿下，你可以抱我一下……如果你还在害怕就抱久一点。


    呜呜呜


    现在放开我。


    好了，我想我们该祝贺自己一下。我们刚刚偷了一艘我们自己的帝国死星级。


    那是肯的。


    那么，现在怎么办？


    现在……


    ……是艰难的部分了。


    # 几天前……


    图瑞恩七世正处于围困之中


    自从死星被毁以来，图瑞恩七世的人民一直在秘密向反抗军提供援助。现在轮到我们报答了。


    由于某种原因，帝国已经得知这个世界对我们的事业同情。他们在行星周围设立了封锁！


    那里的人们正在挨饿。


    # 阿克巴将军


    # 杜多纳将军


    # 蒙·莫斯玛


    我们无法突破他们的封锁吗？


    三次尝试都失败了。


    非常壮观。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_215_0.png)


    “帝国人在行星的双生卫星上建立了基地。”

    “它的轨道上布满了提战战斗机。”

    “我们需要一个大家伙来冲撞过去，同时我们的战斗机去消灭基地。”

    “我担心我们无法冒险冒险。”

    “我指的不是舰队，我是指大的。非常大。像一艘死星级。”


    这太疯狂了。即使对我们来说也是。

    我们做了。


    怎么做？


    去什么样的什么方法？你在说什么？

    我们在讨论什么什么什么的方法。

    我们在讨论拯救图瑞恩七世。

    我们没有办法。

    我们还没准备好之前。

    这种主想法太疯狂了。

    我们还没准备好之前。

    我们被包围了。

    我们必须这样做。

    我们需要一艘死星级。

    我们不听你的要求。

    我们还没准备好之前。

    我们没有准备好之前。

    我们建议这样做。

    “愿力与你同在，也许。”

    我们我们运气运气了。

    '
