    > 肯定是把他丢了……在食堂里。

    希望那锅炖汤没太烫！


    > ……你以前开过 T 翼战斗机吗？


    > 让开！走道！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_223_0.png)


    靠边！船长来了——


    呃。


    你们听见她的了吗。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_223_1.png)


    船长路过。


    奥加纳公主？你还好吗？


    我会没事的。只要你告诉我我们把航天服放在哪里。


    只是为了适应一下，这些控制设备需要一点时间来习惯。


    好了，我想我搞懂了。你说过你以前在哪儿飞过战斗机？


    科斯尚特。我不会说那是“飞过”，不如说是“偷来并坠毁”。


    但我飞得很有风格。


    很拥挤，每个方向都是人，甚至放眼望及之处都是建筑。


    那感觉有点像战争，像格奥诺斯那样，只是没那么脏兮。


    科斯尚特，那里感觉怎么样？


    如果非让我选的话，我会选那个脏兮、有个性的地方。


    这么多人，哈？我这辈子都没见过这么多人。


    你可能从来没听过那里。那叫塔图因。


    你说得，但那不是……我在这儿了。


    你是从哪来的，孩子？


    噢，我听过……难怪你加入了反抗军，如果不喜欢摇滚，我什么都愿意。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_225_0.png)


    我本就该在这里。


    我在塔科的一整生感觉就像……这一切都是为了让我来到这一刻，为了与反抗军并肩战斗。


    我是你，我就不会去找汉·索罗的，他不那种待人的人。相信我。


    现在这是我的家人。


    你虽这么说……但你仍然在这儿，不是吗？


    你知道为什么吗？我在这里，并不是因为我相信什么事业，除了我自己的目标。


    在拿到汉欠我的东西之前，我不会离开。


    你是个走私者，如果这只是金钱告诉我有有更容易赚钱的方法。


    这是原则问题，你不会理解。但你们这些人人确实没让事情变得简单，这一点我承认。


    “先驱号”巡逻。我们发现了目标。确实是一艘船，但看起来不像我……熟悉的任何帝国舰船。


    等一下……是一艘联盟军船。一定是将军的穿梭机。但奇怪为什么他们不回答我们的呼叫。


    我知道那是为什么，孩子。


    月之母。很难确定。但……我很确定他找到了我们失踪的将军。


    没有生命迹象。船上有迹象。我们必须把它拖进来。“先驱号”巡逻。准备好——


    萨娜，你到底干了什么——


    你在说什么？我们为什么要——


    “先驱号”巡逻。进入高度戒备。我们正在返回途中。


    睁大你的眼睛，孩子。我们在这里并不孤单。


    你们那个小将军要么是个警告，或者更糟……是个干扰。


    稳住电梯！


    注意，我们处于高度戒备状态。全体人员进入战斗位。或者至少，部分人员进入战斗位。所有我们能调动的人员。


    还有 VM？有人知道船长在哪吗？


    她正在路上。


    好了，船长在这了，告诉我大叫是为了……什么。


    别担心，船长会处理好的。


    萨娜，你本该拖那个穿梭机的。我们也许能从上面中学到什么。


    它后面绑着一个死尸。公主，这已经告诉我我需要的一切。我们正受到攻击吗？也许吧。什么样的蠢货会攻击一艘歼星级战？如果他们和我们一样疯……那我们就真的完了。


    我们确定他们没看到我们吗？他们的扫描仪有一半都没上线。他们一定只有极精简的人员在运作。那走吧。我们不该也许……报备一下？我的意思是，我们的任务是什么？你觉得呢？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_230.png)


    反叛军开了这艘船……


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_231.png)


    ……我们偷了它


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_232.png)


    超速引擎坏了。这艘歼星级最烂。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_233.png)


    我们的引擎坏了。船长，我们了。


