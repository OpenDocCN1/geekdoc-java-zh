    作家 JASON AARON 与艺术家 Cameron Stewart 在 DCVert 的《The Other Side》上的早期合作被评为《华盛顿邮报》的“2007年度最佳漫画”之一。他的下一个项目《Scalped》赢得了业界赞誉，并使他在《金狼》中获得客串机会，开始了
    Aaron 在不同作品中与罗根的长期合作。在他的限量系列漫画《X 战士：分歧》之后，他在《金狼与 X 战士》以及《惊奇 X 战士》中页上帮助漫威的变异人开启了一个新时代。Aaron
    凭借《原罪》震撼了漫威宇宙，并在《强力索神》和《不配之索神》中继续讲述一部颠覆现状的阿斯加德史诗。他是引导《星球大战》反抗军团队回归漫威开启新冒险的理想人选。


    一本《以漫威方式画漫画》的拷贝在 11 岁时就让 LEINIL FRANCIS YU 对漫画产生了兴趣。而 Portacio 的教程帮助他在 1997 年获得了《金狼》的第一部主流作品。在获得成功后，Yu
    接手了《奇诡 X 战士》、《X 战士》、《超级人：诞生之路》以及《终极金狼大战哈尔克》等作品。在《新复仇者》中长时间铺垫基础后，他与作家 Brian Michael
    Bendis 通过大规模的《秘密入侵》联动彻底颠覆了漫威宇宙，这位漫威常青随后参与了包括《复仇者与 X 战士：轴心》和 IVX 在内的活动漫画。


    墨西哥艺术家 JORGE MOLINA 的漫威作品包括与 Mark Waid 合作的《美国队长：时空之外的人》、《模型公司》、《如果……秘密大战》以及《复仇者：倡议计划》中“围攻战”的联动、《哈尔克世界大战：蜘蛛侠与索神》、《X
    战士》以及《金狼与 X 战士》。Molina 帮助将“A 女军”建立为漫威最强大的团队之一，并绘制了最初的限量系列以及连载书的前四期。


