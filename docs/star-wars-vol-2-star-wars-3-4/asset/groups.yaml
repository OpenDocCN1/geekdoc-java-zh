  mdcn: '

    跳吧，宝贝，你大可以跳下去的，因为没了我，那些讨厌船体的人死和没没区别。


    我会让你见识一下什么叫死无疑！


    萨娜，住手！


    这所监狱正受到一股未知力量的围攻。他们决心杀死我们能杀的每一个囚犯。


    我们的任务是确保每个人都能活着离开这里。


    而我们正在失败。


    这个监牢区的人全死了。所以我们去下一个区域。走吧。


    这太荒谬了。你比她还要疯狂。


    我们为什么要去救一群囚犯？我们需要到达对接舱然后离开这里。


    还是去武器库？如果能去武器库我也没意见，只要那里够大就行。


    我们不会离开的，医生，我连一把步枪都不知道怎么信任你，更别说更大的东西了。


    下一个隔间的舱门锁在移动。


    我也想你你了，宝贝。


    在这一切结束之前，我一定要杀了你。


    这些肉袋子，总是觉得自己很聪明。


    传输已取消。


    # 1 看起来某个区块里有人正试图发送传输。


    BWOOP

    TWEET BWWIP

    WURUU


    阿图-德图，你别敢做任何蠢事。我最近刚把手臂接回去。


    而且，只要我们不挡路，这些事情总是会自己解决的。


    这里是控制室。我们的机器人快用完了。


    老板，你能听见我说话吗？


    老板？


    打开十七号监牢。


    他们把你关在最高安全监牢里一定有原因。


    告诉我原因是什么。


    三个理由。


    - 那三个被我割了喉的绝地武士。


    我唯一的遗憾是杀得不够多。


    还应该是什么？


    还有一件事你会后悔的。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_0.png)


    嘿。没有你后悔的多。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_1.png)

    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_2.png)


    HRRH！


    GUGGH！


    你的皇帝帕尔帕廷……是一个西斯领主。什么？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_3.png)

    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_4.png)

    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_93_5.png)


    HURRGH！


    终于能向某人说出……我的秘密（注：此处为秘密）这种感觉真好。谢谢你。


    控制室。


    打开十八号监牢。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_95_0.png)


    你正在

    输掉。

    这场战斗，

    公主。


    这就是为什么

    你会

    输掉战争。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_95_1.png)


    AAAAARGH！！

    AAAAARRGH！！


    你听到了吗，

    公主？

    那是怪物的尖叫声。


    我们应该

    让大家都

    尖叫起来。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_95_2.png)


    我会带路。


    我是由你造就的，

    公主。我是真正的

    反军士兵。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_95_3.png)


    我正是银河系需要的。


    这个扇区有行动！


    你和你！外面！守住门！


    你看，我告诉过你。无疑莉娅是来救我们的。


    为什么总是由我来当乐观的人？


    # BUDA BARRRP


    你们两个！站在门口。


    如果有人冲进来，确保他们先中弹。我撤退。我们死定了。


    BWOOP BWOOP


    小心，你笨蛋！


    嘿！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_97_0.png)


    - 永远把那些门打开！这是个糟糕的计划！

    - 有个计划？

    - 继续射击！

    - 我的这种计划！

    - 最后一个机器人，但它把我们压制住了！

    - 最后一个机器人？那不是最后一个。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_97_1.png)


    呃-噢。看到了吗？告诉过我正在重新接线。


    不准动！你再也不会动了。


    我不是反军，但我还是会射你。


    嗯……啊啊，救命！我在拼命了！


    把这个蠢东西从我身上拿开！


    ![](img/d98cc18c088fa6da8e5280d2f5bb97a_99_0.png)


    噢，我的天！手铐是这样的吗？我宁愿被赦免。接入并控制监狱。


    不用立刻谢我。在我射那个东西的脸之后。让开，医生。是谁在背后？他在哪？


    他正试图教你一些东西。你曾教过他。这意味着什么？


    嘿，如果我被设定了笑，我会像考瓦基猴猴蜥一样大笑。他是谁？


    我说让开。别了，萨娜。这和机器人无关。我们之间发生的是很久以前的事。


    你应该长点胆量并学会捅人。最后警告：靠开。大家停止尖叫！听起来我们赶得及时。什么？卢克？卢克和我收到了你的信息。所以放松吧，殿下？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_102_0.png)


    星球大战 变体

    作者：LEINIL FRANCIS YU


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_104_0.png)


    # 太阳点监狱。


    - 让开！我们必须在他之前到达对接舱——

    - 在他之前？让我们看起来都像傻瓜？看来我们太晚了。

    - 放了他们。现在。

    - 抱歉，公主。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_105_0.png)


    这简直是……哇。你们竟然还没死光？真的是银河系最大的谜团。……这不是这样结束的。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_106_0.png)


    这是你接受我一直试图向你展示的东西机会，莉娅公主。


    我希望你赢得这场战争。我是认真的。我想看到帝国倒塌。我想给你提供赢得胜利所需的工具。你这里的朋友是否会在这场战争中伤亡，完全取决于你。


    不要这样做。不要伤害他们。卢克，我会放下步枪，然后我们可以谈谈……

    '
