- md: '

    A SPY, THINKING OF THE GAMES IS PART OF THE JOB.


    BUT I''M ALSO A REALIST.


    AND THE REALIST PART KNOWS HOW HARD THIS IS.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_1.png)


    IF THERE''S MORE THAN SIX AGENTS ON CORUSCANT...


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_2.png)


    ...I''D BE SURPRISED.


    HUH


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_3.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_4.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_5.png)


    WHY IS IT HARD?


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_6.png)


    IT''S THE STRENGTH OF WILL TO BE AS RUTHLESS AS YOUR COVER REQUIRES.


    TO GET THE JOB DONE, NO MATTER WHAT.


    OCCASIONALLY, CHARMINGLY.


    SENATORS...


    I''M AFRAID YOUR EXECUTION HAS BEEN DELAYED INDEFINITELY.


    OH, MY. THIS IS AN INCREDIBLE OPPORTUNITY.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_20_0.png)


    IT IS. TO SAVE YOUR LIVES.


    LET''S GO.


    ...HE''S COMING HERE.


    YOU DON''T UNDERSTAND THE EMPEROR


    TELL ME EVERYTHING.


    I''M NOT A HERO.


    SO IT''S LUCKY I''M HERE.


    GOOD EVENING. I''M A REBEL AGENT.


    DON''T MOVE.


    WHILE YOU''RE ALL INVOLVED IN A TYRANNOUS AND GENOCIDAL ORGANIZATION, I UNDERSTAND
    THAT YOUR CHOICES ARE LIMITED BY THE CRUEL AND SAD REALITIES OF LIFE.


    AS SUCH, I''D DEEPLY REGRET HAVING TO SHOOT ANY OF YOU.


    THIS IS A LIE.


    ONE AT A TIME, FROM LEFT TO RIGHT, UNFASTEN YOUR HOLSTER AND LET IT DROP.


    I WOULDN''T REGRET IT AT ALL.


    WHICH ISN''T TO SAY I WON''T.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_21_0.png)


    > WELL DONE. I GUESS WE''RE ALL GOING TO BE ALIVE TOMORROW.


    > EVERYONE GET BACK IN HERE...


    > I NEED TO STAY.


    > YOU''RE TRYING TO SEND A MESSAGE. IF YOU''RE GOING TO CONTACT THE PRINCESS,
    YOU''RE GOING TO REVEAL HER LOCATION.


    > I CAN RUN THE SCRAMBLER.


    > I''M ENE RAY. YOU''RE THE MOLE. YOU''VE JUST BLOWN YOUR COVER.


    > WHY?


    > I''M COELET. YOU''VE JUST BLOWN MY COVER.


    > I HAVE NO IDEA WHAT YOU''RE TRYING, BUT IT BETTER BE WORTH IT.


    > ENEB! WHAT''S WRONG?


    > NOTHING THE EMPEROR''S JUST WALKED INTO OUR CROSS PATH.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_22_0.png)


    HE WILL BE HAVING A FINAL CONVERSATION WITH THE SENATORS, IN AN HOUR''S TIME.


    IF WE GET A TEAM HERE, WE HAVE OUR BEST CHANCE TO END HIM, AND ALL OF THIS...


    I HAVE A PLAN. WE OWN THE BATTLEGROUND. WE HAVE SECURITY CONTROL.


    FOR ONCE, WE GET A CHANCE AT THE EMPEROR IN A PLACE OF OUR CHOOSING...


    WHAT DO YOU NEED?


    WHAT CAN WE GET HERE, IN TIME?


    I NEED THAT.


    IF THIS FAILS, WE''LL HAVE NO AGENTS LEFT ON CORUSCANT.


    THIS IS AN ENORMOUS RISK.


    SO WAS YAVIN.


    AH SENATOR TURAL.

    GOOD TO SEE YOU AGAIN.


    STEP CLOSER.


    I THOUGHT A GOODBYE ORDER AFTER SO MANY FOND YEARS.


    GLAD WE AGREE.


    FOR THE RECORD, I WAS SURPRISED.


    THERE WEREN''T SIX AGENTS ON CORUSCANT.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_26_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_27_0.png)


    SIX OF US HERE...


    ...AND COLEET RUNNING SUPPORT.


    OKAY, ENEB WE''RE SHOWING UP AS AN INTRUSION NOW THIS ISN''T EVEN SLIGHTLY. FINISH
    HIM.


    THERE''S THOSE WHO''LL JUDGE US FOR THIS.


    > A POLITICAL ASSASSINATION IS NEVER ACCEPTABLE!


    TO STOP SOMEONE AS BAD THE EMPEROR?


    YOU NEED SOMEONE WILLING TO BE AS BAD AS HE IS.


    IF ONLY FOR THE TIME IT TAKES TO PULL A TRIGGER WITH THE COMP OF ALDERA, MY EMPEROR.


    OH MY REBELS.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_28_0.png)


    HOW UNEXPECTED.


    GET EVERYONE OUT.


    HE''S GOING TO GET AWAY HE--


    HE''S NOT.


    I''LL FINISH THIS.


    AT THIS POINT, YOU MAY THINK THIS IS STARTING TO LOOK LIKE HEROISM.


    YOU''D BE WRONG.


    THIS IS COLD-BLOODED MURDER.


    A SHAME.


    A GOOD DECOY IS HARD TO FIND


    A BODY I COULD UNDERSTAND.


    BUT WHY COME HERE AT ALL?


    NO TIME TO THINK.


    STILL A CHANCE TO MAKE THIS MATTER.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_32_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_32_1.png)


    STILL A CHANCE


    LOOK BEHIND YOU.


    A MOMENT OF TERRIBLE REALIZATION.


    I''M FOOLING MYSELF.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_33_0.png)


    THERE WAS NEVER A CHANCE.


    I''M NOT ANYTHING LIKE THE EMPEROR.


    I''M NOT EVEN THE SAME SPECIES OF MONSTER.


    THE ONLY THING WE HAVE IN COMMON IS KNOWING WHAT''S KEY TO ANY PLAN...


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_34_0.png)


    # REDUNDANCY


    NADEA TURAL.


    COLEET


    THE SENATORS.


    THE SPIES.


    ALL THE OTHER PRISONERS.


    ALL THOSE STORMTROOPERS.


    HIS PERSONAL GUARD.


    HIS DUPLICATE BATH.


    ME. NEARLY.


    ALL DEAD.


    I THOUGHT OF THE ONCE- LIVING ASH FLOATING UP AND THE MAN RESPONSIBLE...


    ...AND I REALIZED HOW PERFECT HE WAS.


    THE SENATORS WERE BEING TRANSPORTED TO THEIR LONG-AWAITED TRIAL WHERE WE ARE HOW
    THEY WERE CORRECT (IN RETRIBUTION) THE EMPIRE WOULD HAVE REVEALED.


    BUT THE REBELS HAVE NO INTEREST IN TRUTH, JUSTICE OR THE RULE OF LAW THEY USED
    THESE SENATORS UP AND DISCARDED THEM IN THIS ACT OF SHOCKING TERROR.


    THE CUSTORIAL COMPLEX LIES IN RUINS, TESTAMENT TO THEIR MONSTROSITY.


    IT IS HARD TO UNDERSTAND SUCH SENSELESS BRUTALITY.


    HE WAS WRONG. I UNDERSTOOD IT.


    A PROPAGANDA COUP AND THE FALL PERMANENTLY REMOVED SENATORS. A TRAP SO IRRESISTIBLE
    TO LURE ALL THE SPIES ON CONSPIRANT. A TOTAL MATERIAL WIN...


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_36_0.png)


    ...AND HE CAME ALONG. JUST TO WATCH US BURN.


    HE''S SO GOOD, IN EVERY WAY BUT ETHICALLY.


    YOU''VE GOT TWO SECONDS TO IDENTIFY YOURSELF...


    MAY THE FORCE BE WITH YOU.


    I SAW THE BROADCASTS. WHAT WENT WRONG?


    I WAS NAIVE.


    I WAS A HERO PRETENDING TO BE THE MAN WILLING TO MAKE HARD DECISIONS.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_37_0.png)


    THE LAST TIME I MAKE THAT MISTAKE.


    CITIZENS MUST ALL REST ASSURED THAT THERE WILL BE VENGEANCE FOR THIS HEINOUS,
    UNFORGIVABLE CRIME.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_39_0.png)


    # REBEL JAIL


    It is an era of renewed hope for the Rebellion.


    After narrowly escaping another frightening encounter with Darth Vader, rebel
    heroes Luke Skywalker, Princess Leia, and Han Solo take the evil Sith Lord''s
    secret ally, droid and weapon specialist Dr. Aphra, captive aboard the Millennium
    Falcon.


    Now their mission to free the galaxy as Luke and Han pair together.

    '
  mdcn: '


    作为一名间谍，考虑计策是工作的一部分。


    但我也是个现实主义者。


    而现实主义的一面知道这有多难。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_1.png)


    如果科鲁斯圣地上有超过六名特工……


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_2.png)


    ……那我会感到惊讶的。


    呵。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_3.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_4.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_5.png)


    为什么这么难？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_19_6.png)


    这取决于意志力，要像你的身份要求的那样冷酷。


    无论如何，都要完成任务。


    偶尔，也要很有魅力。


    议员们……


    我恐怕你们的处决被无限推迟了。


    噢，天哪。这是一个不可置信的机会。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_20_0.png)


    是的。为了救你们的命。


    走吧。


    ……他正往这来。


    你们并不了解皇帝。


    告诉我一切。


    我不是英雄。


    所以我在这里是庆幸的。


    晚上好。我是一名反抗军特工。


    别动。


    当你们都处于一个暴政且种族灭绝组织中时，我理解你们的选择受限于残酷而悲惨的生活现实。


    因此，如果必须射击你们中的任何一个，我将深表遗憾。


    这是谎言。


    一个一个，从左到右，解开枪套并让它掉地上。


    我完全不会后悔。


    但这并不是说我不这样做。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_21_0.png)


    > 干得好。我猜我们明天都能活下来。


    > 大家都回到这里来……


    > 我需要留下来。


    > 你们正试图传达信息。如果你打算联系公主，你就会暴露她的位置。


    > 我可以运行干扰器。


    > 我是恩·雷（E Ray）。你是那个内鬼。你刚刚暴露了自己的身份。


    > 为什么？


    > 我是科莱特（Coelet）。你刚刚暴露了我的身份。


    > 我不知道你想做什么，但最好是值得的。


    > 恩内布（Eneb）！怎么了？


    > 没什么，只是皇帝走进了我们的交叉路。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_22_0.png)


    他将在一小时后与议员们进行最后的谈话。


    如果我们能带一支小组来这里，我们就有最好的机会终结他，结束这一切……


    我有一个计划。我们拥有战场。我们拥有安全控制权。


    难得我们可以在一个我们选择的地方对付皇帝……


    你需要什么？


    我们能及时带回什么？


    我需要那个。


    如果失败了，我们在科鲁斯圣地将无任何特工留存。


    这是一个巨大的风险。


    雅文也是如此。


    啊，图拉尔议员（Tural）。

    很高兴再次见到你。


    再近一点。


    我以为在经历了多年美好的时光后，会有一个告别指令。


    很高兴我们达了共识。


    记录在案，我很惊讶。


    科鲁斯圣地并没有六名特工。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_26_0.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_27_0.png)


    这里有六个人……


    ……还有科莱特提供支持。


    好了，恩内布，我们现在是以入侵者的身份出现的。这并不是这样。我们要终结他。


    > 意志要像你的身份要求的那样冷酷。


    > 这种意想不到的处决。


    > 这种会审判我们。


    > 政治刺杀是不可接受的！


    > 需要一个像皇帝一样邪恶的人。


    > 只有在阿尔德拉（Aldera）的时刻，为了扣动扳机。


    > 这种反抗军的。


    > 这种暴行是不可接受的。这种遗憾的。


    > 在这个时候，这看起来像是英雄主义。


    > ![](img/d98cc18c088fa6da8e52820d2f5bb97a_28_0.png)


    > 这种冷血的。


    > 这种痛苦的。


    > 这种为了。


    > 这种荒谬的。


    > 这种死亡。


    > 这种为了。


    > 这种被彻底的。


    > ![](img/d98cc18c088fa6da8e52820d2f5bb97a_32_0.png)


    > 这种机会。


    > ![](img/d98cc18c088fa6da8e52820d2f5bb97a_32_1.png)


    > 这种机会。


    > 看看你们身后。


    > 这种可怕的领悟。


    > 我在欺骗自己。


    > 这种反抗军。


    > 这种时刻。


    > 这种计划。


    > ![](img/d98cc18c088fa6da8e52820d2f5bb97a_33_0.png)


    > 这种没有机会。


    > 我完全不像皇帝。


    > 我甚至不是那种种类的怪物。


    > 我们唯一的共同点是知道这种……


    > ![](img/d98cc18c088fa6da8e52820d2f5bb97a_34_0.png)


    > 冗余。


    > 纳德亚（Nade）。


    > 科莱特。


    > 议员们。


    > 特工们。


    > 所有的囚犯。


    > 那些冲锋兵。


    > 他的私人卫队。


    > 他的替身。


    > 我。几乎。


    > 所有的死亡。


    > 我想到了那些浮动的灰烬和那个男人……


    ……我意识到他是多完美。


    > 议员们正被送往他们期待已久的审判，正如我们如何被这种帝国会揭露的。


    > 这种建筑群是一片废墟，是他们残暴的证明。


    > 很难理解这种无意义的残忍。


    > 他是错了。我理解了。


    > 一场宣传政变和永久移除了议员们。一个无法抗拒的陷阱，用来引诱科鲁斯所有的特工。总体的胜利……


    ……他也过来了。只是为了看着我们毁灭。


    '
