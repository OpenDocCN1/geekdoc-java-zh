    > “用光剑的话会容易得多，但我想我本可以避免这种尴尬的。”


    > “我不应该去干涉的。我知道我的目标是保护那个男孩并让他隐藏起来。”


    但我不是尤达大师。我知道我无法留在这里 800 年来守护他。


    在未来的某个时刻，卢克·天行者将必须学会自力更生，某种预感告诉我，当那一天到来时，他需要学会如何飞行。


    奔跑


    这花了一整晚晚上，但我想象塔斯肯掠夺者很快就会再次找到他们。尽管我想起需要发出某种信号来将他们引离高处，当我们看着男孩跑入那片几乎无尽的自然黑暗时，我的背感到沉重，但这是值得的。


    还有多少人能像蜂群一样开辟道路？我希望我这种感觉并不孤单。


    我们带那个机械机器人吧。


    波奇，你有什么会说话的吗？


    尤提尼！


    哈？那是怎么——


    不。我们只买机器人。我们买不起任何东西。


    嘿，什么？你在干什么？我告诉过你……你就打算把这留在这儿？


    记得我以前抱怨西地神庙的食物吗，大师？


    那是在我每天都要吃一年蛇之前。


    BLMRGH，幸好我的原力很强，否则我没法强迫咽下去。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_139_0.png)


    咚咚


    马上就到。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_139_1.png)


    我们在沙海很少有客人。我该如何……


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_139_2.png)


    你可以离我的家人远点！


    欧恩，请进。你喜欢你的蛇吗？


    我不傻，肯比。仅仅因为我没有像你一样横跨银河，并不代表我是一个无知的乡下佬。我知道你在做什么。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_140_0.png)


    自从你出现后，我的房子是唯一一间从未被沙民人袭击过的库尔特人房子。它从未被贾巴的暴匪掠夺过。


    而现在，贾维人甚至在免费送零件给我们。


    听起来你一直很幸运，欧恩。原力的运作是不可测的。


    不，是你运气，你这个疯子西地神！但现在结束了！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_140_1.png)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_140_2.png)


    我告诉过他，我不会让你像你那样毁掉那个男孩的，他父亲说。


    你带他来是为了保护他，而我正是这么做的。保护他免受你的伤害。


    我不要求训练那个男孩。关于这一点你已经说得很清楚了。但就像他一样，他拥有成为……真正非凡之人的潜力。正如他父亲一样，在他之前——


    你杀掉的天行者还不够多吗，肯比？


    在你害死他之前！


    这孩子只是个男孩，一个鲁莽的男孩，他已经太像他父亲了。


    我只是想提供帮助。


    我们都很清楚，如果他离开，他就再也不会回来了。至少活不回来。


    我相信我已经说得很清楚，我们不需要你的帮助。


    > “你是个危险的人，欧比-旺·肯比。无论你是否意识到。”


    > “麻烦总会有办法找上你，不是吗？虽然我想也不必太费力了。”


    > “那个麻烦有一天会让某些人受重伤。”


    > “大家都帮个忙吧……”


    > “‘并且把麻烦留给你自己。’”


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_142_0.png)


    我并不擅长躲避麻烦，即使在沙漠中也是如此。但我活了下来，如果说这些年来我在某方面变得出奇擅长，那就是找麻烦……死。


    去问西达斯·莫尔或杜库伯爵、格维斯将军。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_143_0.png)


    去问贾巴·那个汉克。


    噢噢！伟大的贾巴说……他想先看到你的技巧展示，才同意支付那离谱的费用。你现在就可以开始展示。否则你会死。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_145_0.png)


    把这个人活着送过来，这样贾巴就可以亲自看着他，你将获得一笔丰厚的奖金。或者你可以直接带他的头。


    你觉得这些可以接受吗，黑肯塔（注：此处原文疑似有误，推测为译名）？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_147_0.png)


    这一切发生在这里。大约一年前的大干旱期间。贾巴的五名战士在这里被夺走了。被巨大的岩石砸碎了。但没有人看到是谁。没有人看到任何东西！至少他们是这样叫的！贾巴把他们喂了萨纳兽。我们没有找到他的踪迹。你好？你知道这意味着什么吗？谁抓到他就会死。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_149_0.png)


    卢克，听着，我在托斯站弄了一些零件。它们状况不太好，但我想也许……我们可以一起修理那台破飞器……并希望得到……算了，卢克，我真的很抱歉，好吗？


    卢克？


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_149_1.png)


    贝鲁，你看到…………！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_149_2.png)


    我还不知道。但卢克·天行者不是第一次离家，也不是最后一次。上船吧。去银河中除了这里的任何地方。我去摩斯埃斯利。贝鲁和欧恩可以留下塔图因。我会带走……星辰。至少这一次，他没走多远。哼？欧恩！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_150_0.png)


    欧恩！贝鲁！


    贝鲁在哪里……贝鲁！发生了什么？欧恩在哪里？卢克，你必须离开这里……他带他走了。朝着峡谷去了。我们必须去找帮助，去找其他农民。去找……是什么带他走了？满身皮毛的。卢克，你把自己锁在维修间里。在听到我的声音之前不要出来。明白吗？维修间……


    RRRRARRGGGHH！RRROOOOGGGHH！


    我……我不明白。我不知道你想要什么，你为什么……RRRRRROGGGHH！等等，请。我无法回答你的问题。我不说话——他没有在问你任何问题。


    > 当我在沙海的蛮兽中冥想时，感受到了原力中的不协调。


    > 在悬崖顶，我试图放慢呼吸，以掩盖爬山后的气喘力竭。


    > 肯比！


    > RRRGGHHH？


    > 我的胃里有一种多年多年未有过的紧绷感。


    > 恐惧。


    > 显然，身体的酸痛并不是唯一随着年龄增长而恶化的东西。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_153_0.png)


    你是黑肯塔，臭名昭彰的族族赏金猎人。我听过你。我知道你为什么被迫离开卡希克，以及自从贾巴雇佣你以后你是如何给同族蒙耻的，不是吗？


    好吧，我在这儿，赏金猎人。或者我不是？你离开这个地方时——我是你要找的人。


    哈呜！


    RRRWWWWWH！


