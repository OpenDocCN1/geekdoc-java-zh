    # MARVEL


    AARON YU MOLINA MAYHEW


    # STAR WARS


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_0_0.png)


    # NOVEL


    If you love the films, there''s no reason you should be missing out on this comic.

    — ComicVine.com


    # “A winning blend of iconic heroes and new elements.”

    — IGN.com


    # WILL NEW HOPE GIVE WAY TO DESPAIR?


    It is a time of renewed optimism for the Alliance — but also one of danger, as
    a wounded Empire rebuilds and prepares to strike. After bringing down the Death
    Star, rebel heroes Luke Skywalker, Princess Leia and Han Solo narrowly escaped
    a harrowing encounter with a vengeful Darth Vader! And in doing so, they delivered
    a blow to the Imperial enforcer, seizing one of his prime assets: the weapons
    expert Dr. Aphra! But as the Rebellion considers its next move, new enemies will
    surface to wreak havoc with their plans.


    As Leia and her ally of sorts, the smuggler Sana Starros, deliver Aphra to the
    Alliance’s hidden Sunspot Prison; the facility comes under attack by a ruthless
    invader with his own ideas about rebellion! If Leia is to survive, she’ll have
    to take an old adage to heart— Something about the enemy of her enemy...


    But an even greater threat lies in wait for our heroes. For the crew of the Millennium
    Falcon hijacks the imperial Star Destroyer Harbinger, an elite group of stormtroopers
    is tasked with taking them down — hard! Luke has faced their leader Sergeant Kreel
    before, and he barely escaped with his life. Now, the young Jedi and his friends
    will feel Kreel’s fury — and the wrath of the Scar Squadron!


    Plus: Meet rebel spy Eneb Ray — just don’t call him a hero! Obi-Wan Kenobi is
    the target of Wookie bounty hunter Black Kris as more of the Jedi’s past is revealed!
    And R2-D2 goes solo!


    Marvel continues to explore the galaxy far, far away!


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_4_0.png)


