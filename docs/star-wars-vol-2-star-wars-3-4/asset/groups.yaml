    # ANNUAL 1


    # STAR WARS


    It is an era of renewed hope for the Rebellion. The evil Empire’s greatest weapon,
    the Death Star, has been destroyed by the young rebel pilot, Luke Skywalker. But
    Imperial forces still stand strong.


    Rebel spy Eneb Ray has infiltrated Coruscant, working under an Imperial guise
    and the name Tharius Demo. He quickly learns that some missions prove to be much
    complicated than others...


    # Coruscant. SOME PEOPLE GET TO BE HEROES. NOW, SIR, AS WE CAN SEE, YOUR EXPORT
    BUSINESS HAS CONSIDERABLE TAKES IN ARREARS...


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_9_0.png)


    YOU DON''T UNDERSTAND. WE MADE THE RUN BASED ON THE PREVIOUS EXPORT TAX. THARIUS
    DEMO DOES''T GET THAT LUXURY. WE NEVER RECEIVED AN UPDATE THAT HAD CHANGED! I
    CAN''T PAY THIS! I''M SORRY, SIR. THAT ISN''T MY PROBLEM. MY FAMILY IS GOING TO
    STARVE! WHEN THE REBELLION COMES INTO TOWN, YOU''RE-- DON''T SAY THAT, SIR IF
    YOU SAY THAT, I''LL HAVE TO FILE A REPORT.


    YOUR FAMILY''S ABILITY TO PAY YOUR TAXES WILL BE NEGATIVELY IMPACTED BY INCARCERATION.
    IN MY EXPERIENCE, HAVING CHILDREN SOLD INTO SLAVERY TO COVER YOUR LOSSES TENDS
    TO BE AN EMOTIONALLY DISTRESSING TIME. DON''T SAY ANYTHING. I''M TRYING TO SAVE
    YOUR LIFE. YOU''LL GET YOUR MONEY. NOT MY MONEY, SIR. THAT? THAT WAS AS GOOD AS
    IT GETS WHEN I''M THARIUS DEMO.


    IT WOULD BE SO EASY TO BE A LITTLE SOFT CHANGE A FEW NUMBERS, SHOW SOME HEART...
    BUT THAT''D RISK THE IMPERIALS REALIZING I''M NOT THARIUS DEMO. I''M ENEB RAY.
    BRING ME ALDERAAN TWIST, EH? THE REBELLION HAS HEROES. I DON''T GET TO BE ONE
    OF THEM. I DO WHAT NEEDS TO BE DONE. LINK 24-7-2: CODE EPSILON BLUE. BLEEP! I''VE
    JUST UPLOADED SHIPPING AND PROCUREMENT DATA FOR THE CORE SECTORS. I''LL NEVER
    MATCH A BOTHAN, BUT I HOPE IT''LL BE OF SOME USE.


    YOU DO WHEN THE BOTHANS REPORT THEY SAY, "I''LL NEVER MATCH ENEB RAY... BUT THIS
    WILL BE OF SOME USE." THE PRINCESS IS YOUNG... BUT SHE HAS YEARS OF TRAINING FOR
    THIS. SHE JUST DIDN''T THINK SHE''D BE DOING IT YET... YOU FLATTER ME AS IN, YOU''RE
    FLATTERING ME YOU WANT SOMETHING. SENATOR WADER TURAL AND THE ANTI-IMPERIAL SENATORS
    ARE ABOUT TO BE EXECUTED. WE NEED YOU TO EXTRACT THEM FROM ARKKTH-ENO. I''M SORRY,
    YOUR IMPOSSIBLE MAJESTY.


    WE HAVE MAPS, RELEVANT ACCESS CODES AND A SHIP WILLING TO SMUGGLE THEM OFF CORUSCANT.
    MY MISTAKE, YOUR MAESTY, NOT IMPOSSIBLE. THIS IS A TIRED INFORMATION. DO WE HAVE
    ANOTHER AGENT EMBEDDED? YOU DON''T NEED TO KNOW THAT. OF COURSE, FORGIVE ME, YOUR
    MAJESTY, PRY SPIES. HOW CAN I APOLOGIZE? JUST DO WHAT YOU BEST, ENEB. SAVE THE
    SENATORS. SHE TREATS ME AS A HERO. IT''S JUST POLITENESS, SHE KNOWS BETTER.


    # Arrth-Eno Prison Complex, Coruscant. SHE KNOWS ABOUT TOLET III. THE RINGS OF
    ALL BODIES FLOATING IN THE APPROACH... SHE KNOWS. I''LL DO WHATEVER IS REQUIRED..


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_15_0.png)


    HOW MANY REBEL SPIES ARE THERE ACTALLY ON CORUSANT? I DON''T KNOW. I KNOW IT''S
    FEW. NONE OF US CAN AFFORD TO DIE. ESPECIALLY LIKE THIS.


    PART OF ME HOPES I''VE BEEN LIED TO. THAT THERE''RE HUNDREDS OF US DOWN HERE...
    AND I''VE JUST BEEN TOLD TO WE''RE SCARCE. SO IF I''M CAPTURED AND TAKEN TO A
    PLACE LIKE THIS COMPLEX... ...SEWN INTO THE EMPIRE''S TORTURE MACHINES... ...WELL,
    I KNOW I''LL RESIST AS LONG AS I CAN...


    BUT THEY HAVE THEIR WAYS. THEY KNOW EVERY TRICK I DO.


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_18_0.png)


    EVENTUALLY, I''LL BREAK AND SPILL ALL THE SECRETS... AND MY BELIEF THAT THERE''S
    ONLY A FEW OF US DOWN HERE IS JUST MISINFORMATION TO BE FED TO THE IMPERIALS.
    I''D LIKE THAT TO BE TRUE. I KNOW IT''S NOT

    '
