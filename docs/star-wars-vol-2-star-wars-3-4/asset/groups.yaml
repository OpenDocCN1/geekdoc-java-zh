    # 来自老肯比的日记


    在为了成为绝地的过程中寻找答案时，卢克·天行者发现了一本由绝地大师欧比旺·肯比撰写的日记。日记详细记录了肯比在塔图因期间的冒险——包括在大旱期间，欧比旺从贾巴的暴徒手中救了年幼卢克。


    以下是该日记的节选。


    自从大旱已经过去一年了。即使在最恶劣的气候下……蒸气器再次嗡嗡运转。沙漠之花盛开了。


    ![](img/d98cc1c08fa6dae5280d2f5bb97a_127_0.png)


    ……生活继续。


    ![](img/d98cc1c08fa6dae5280d2f5bb97a_127_1.png)


    一如往常一样。加油，卢克！你可以的！


    ![](img/d98cc1c08fa6dae5280d2f5bb97a_127_2.png)


    哇。


    你说过我永远无法通过蘑菇平地，比格斯。


    别太傲慢了，天空小子。


    我是为此而生的。


    还有时间取消，你知道的，也许在……之前在深峡谷再进行几次测试飞行……


    不行，比格斯。


    是，好吧……


