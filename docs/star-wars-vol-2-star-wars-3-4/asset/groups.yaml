    但你是在和掌权人物说话。


    现在控制室是我的了。这意味着这座监狱现在也是我的了。


    你是谁？你对典监做了什么？


    目前还没时候，他可能是个蠢货，但他不是个坏人。


    你才是蠢货，如果你认为你能——


