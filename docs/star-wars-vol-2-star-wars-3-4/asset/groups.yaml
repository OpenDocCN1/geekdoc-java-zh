    我同意这个家伙的想法。现在加入他的阵营太晚了。


    你想让我读读他们的罪名名单吗？那会花很长一段时间。我恐怕你没有那么时间。


    我不想和你辩论。我只想阻止你。你不像别人。


    我不会让你这么做的。我不会让你用枪扫射他们所有人。


    我知道你不会这么做，因为你仍然相信高尚的战斗，不是吗？


    但战争中没有任何高尚可言，公主，如果你想赢的话。


    你是对的。


    确实。


    我刚刚从牢房里释放了17个冷血杀人犯，公主。


    也许你可以和他们进行那种辩论。


    尽管如果你更想活命……


    我建议你忙着杀掉他们。


    > “我正在找一个飞行员。”

    > “一个不会问问题的人。”

    > “如果你不问，我不问。坐下。”

    > “时间非常关键。需要一艘快船，但这里的其他飞行员，他们……他们看到我是什么样就拒绝了我。”

