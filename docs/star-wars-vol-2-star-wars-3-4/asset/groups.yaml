    # 漫威 (MARVEL)


    亚伦·尤·莫利纳·梅修


    # 星际大战 (STAR WARS)


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_0_0.png)


    # 小说 (NOVEL)


    如果你喜欢这些电影，没有任何理由错过这部漫画。

    — ComicVine.com


    # “标志性英雄与新元素的完美融合。”

    — IGN.com


    # 新希望会让绝望让路吗？


    对于反抗军来说，这是一个重燃乐观的时代——也是一个充满危险的时代，因为伤痕累累的帝国正在重建并准备反击。摧毁死星后，反抗军英雄卢克·斯凯尔沃克、莉娅公主和汉·索罗险之从与心怀报仇的达斯斯·维德的恐怖遭遇中死里逃生！通过这种方式，他们对帝国的执行者造成了沉击，夺夺了他的一项核心资产：武器专家阿芙芙拉博士！但当反抗军考虑下一步行动时，新的敌人将浮出水面破坏他们的计划。


    当莉娅和她的盟友（某种意义）走私者萨娜·星罗斯将阿芙拉拉送到反抗军隐藏的太阳黑点监狱时；该设施遭到了对反抗有自己见解的残暴入侵者的袭击！如果莉娅想要生存，她必须把一句古语铭记心中——关于敌之敌人……


    但一个更大的威胁正等待着我们的英雄。当千年隼号的船员劫持了帝国级歼星舰“先驱号”时，一支精锐的风暴兵被指命消灭他们——而且非常困难！卢克曾面对过他们的领袖克里尔军士，当时仅仅逃生。现在，这位年轻的绝地武士和朋友们将感受到克里尔的愤怒——以及疤卫队的怒火！


    此外：结识反抗军间谍恩内布·雷——千万别叫他英雄！随着更多绝地武士过去被揭开，欧比旺·肯诺比成为了沃基人赏金猎人黑客·克里斯的目标！而R2-D2将单独作战！


    漫威将继续探索那个遥远的星系！


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_4_0.png)


