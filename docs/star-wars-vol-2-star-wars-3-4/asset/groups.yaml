    # STAR WARS


    It is an era of renewed hope for the Rebellion.


    The evil Galactic Empire’s greatest weapon, the Death Star, has been destroyed
    by the young rebel pilot, Luke Skywalker. But Imperial forces still stand strong.


    Rebel spy Eneb Ray has infiltrated Coruscant, working under an Imperial guise
    and the name Tharius Demo. He quickly learns that some missions prove to be much
    more complicated than others...'
  - '[PAGE 9]


    # Coruscant.


    SOME PEOPLE

    GET TO BE

    HEROES.


    NOW, SIR,

    AS WE CAN

    BOTH SEE, YOUR

    EXPORT BUSINESS

    HAS CONSIDERABLE

    TAKES IN

    ARREARS...


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_9_0.png)'
  - '[PAGE 10]


    YOU DON''T UNDERSTAND. DEMO WE MADE THE RUN BASED ON THE PREVIOUS EXPORT TITHE.


    THARIUS DEMO DOESN''T GET THAT LUXURY.


    WE NEVER RECEIVED AN UPDATE THAT IT HAD CHANGED! I CAN''T PAY THIS!


    I''M SORRY, SIR. THAT ISN''T MY PROBLEM.


    MY FAMILY IS GOING TO STARVE!


    WHEN THE REBELLION COMES INTO TOWN, YOU''RE--


    DON''T SAY THAT, SIR


    IF YOU SAY THAT, I''LL HAVE TO FILE A REPORT.'
  - '[PAGE 11]


    YOUR FAMILY''S ABILITY TO PAY YOUR TAXES WILL BE NEGATIVELY IMPACTED BY INCARCERATION.


    IN MY EXPERIENCE, HAVING CHILDREN SOLD INTO SLAVERY TO COVER YOUR LOSSES TENDS
    TO BE AN EMOTIONALLY DISTRESSING TIME.


    DON''T SAY ANYTHING.


    I''M TRYING TO SAVE YOUR LIFE.


    YOU''LL GET YOUR MONEY.


    NOT MY MONEY, SIR.


    THAT? THAT WAS AS GOOD AS IT GETS WHEN I''M THARIUS DEMO.'
  - '[PAGE 12]


    IT WOULD BE SO EASY TO BE A LITTLE SOFT CHANGE A FEW NUMBERS, SHOW SOME HEART...


    BUT THAT''D RISK THE IMPERIALS REALIZING I''M NOT THARIUS DEMO. I''M ENEB RAY.


    BRING ME ALDERAAN TWIST, EH?


