    Writer JASON AARON''s early collaboration with artist Cameron Stewart on DCVert''s
    The Other Side was named one of the Washington Post''s "Best Comics of 2007."
    His next project, Scalped, garnered industry-wide praise and led to a guest spot
    on Wolverine, beginning Aaron''s long association with Logan on various titles.
    In the wake of his limited series X-Men: Schism, he helped usher in a new era
    for Marvel''s mutants in the pages of Wolverine & the X-Men and Amazing X-Men.
    Aaron rocked the Marvel Universe with Original Sin and continues to unfold a status-quo-shattering
    Asgardian epic in the pages of Mighty Thor and Unworthy Thor. He was the ideal
    choice to steer the rebel crew of Star Wars into new adventures on the series''
    return to Marvel.


    A copy of How to Draw Comics the Marvel Way sparked LEINIL FRANCIS YU''s interest
    in comics when he was 11. While Portacio''s tutorial helped him land his first
    mainstream work on Wolverine in 1997. Following a successful run, Yu took on such
    titles as Uncanny X-Men, X-Men, Superman: Birthright and Ultimate Wolverine vs.
    Hulk. After an extended period laying the groundwork in New Avengers, he and writer
    Brian Michael Bendis turned the Marvel Universe upside down with the massive Secret
    Invasion crossover, and the Marvel mainstay has subsequently worked on event comics
    including Avengers & X-Men: Axis and IVX.


    Mexican artist JORGE MOLINA''s Marvel credits include Captain America: Man Out
    of Time with Mark Waid, Models, Inc., What If Secret Wars, the Siege tie-in of
    Avengers: The Initiative, World War Hulks: Spider-Man & Thor, X-Men and Wolverine
    & The X-Men. Molina helped establish A-Force as one of Marvel''s most powerful
    teams, illustrating both the initial limited series and the first four issues
    of the ongoing book,


