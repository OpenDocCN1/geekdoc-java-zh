    好好看着我，公主！


    我就是道路！


    我感觉……这并不是战斗。我们应该在战斗。


    唔！


    搞笑得怎么了？在我手掐住你脖子之前，你可没这么说过。


    而且你又不想战斗吗？我只想杀了你。


    好了，好了，你赢了。对不起，萨娜。萨娜。我是真的对不起。


    对于我离开的方式我感到抱歉。


    如果你是个发射手，我本该知道如何对付你的。我认得发射手，但人——


    啊。你还在掐着我的脖子。你听见我说——


    你道歉了，哈？我会让你见识什么叫道歉，博士。


    哇啊！


    你真是个傻瓜，公主。你的一生都在你父亲的城堡和元老院的大厅里度过，受着银河系各种报复的保护。


    你怎么可能认为自己能赢得这场战争？


    他们炸了我父亲的城堡，连同整个阿尔德兰。


    但我们不会因为我而赢得这场战争。


    呃！


    我们会赢得……因为我们的人比你数得过的多得多……


    呃！


    唔！


    而且我们已经听够了被别人指手画脚。


    “监狱系统已经恢复。”


    “疏散已经开始。”


