    代码清除。你可以继续了。


    如果刚才对你粗鲁了，请抱歉。沃尔特·眼镜蛇（VOLT COBRA）在这样的地方没法太谨慎。


    欢迎来到一个官方上并不存在的地方。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_47_0.png)


    这是联盟所提供的最大、最凶残的监狱。


    愿你在此停留的时间越短越好。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_48_0.png)


    > 欢迎来到太阳点监狱。

    > 除了我们其中的一个，所有人都将留在这里。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_48_1.png)


    如你所见，我们对安全非常敏感。我们不能冒帝国发现这个地方风险。联盟的大多数人甚至不知道它的存在。


    这里有战争罪犯、帝国间谍、佣兵，甚至还有一两个领主（MOFF）。


    在某些监狱，囚犯抱怨被关在深邃、黑暗的地牢里，永远见不到阳光。那是我们从没听过的抱怨。


    这里确实会变得有点热，但过几年之后你就会习惯。


    嘿，相信我，我不会在这里留那么久的。


    他们都是这么说的。


    阿法博士（DR. APHA），是吧？你的故事又是什么？


    阿法博士是一位专门研究军火的流浪考古学家——


    我的故事是……我要把这个地方化为灰地，连同你一起，典长。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_50_0.png)


    那是如果你运气好的。


    如果你没那么幸运，我的好朋友达斯斯·维达（DARTH VADER）可能会亲自来拜访你。


    她关于和维达的关系没在撒谎。帝国会搜遍整个河系寻找她。


    即使他们能找到我们（尽管他们找不到），这里的防御也相当到位。我们背后有恒星，面前有炮火之海。


    相信我，虽然离开这个地方非常困难……


    希望他真的来。我们这里也有房间供他住。


    把她带到九号牢房。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_50_1.png)


    “闯进来也同样不可能。”


    这已经是我们在不被他们的扫描器发现的情况下，能冒险的最远距离了。


    把她留在这里，等我的信号。


    长，你意识到考虑到我们离恒星这么近，你在到达监狱且不被活活死之前，容错空间将微乎其微吗？


    死法有很多糟糕的。相信我，我什么都见过了。

    出发。


    ![](img/d98cc18c088fa6da8e52820d2f5bb97a_51_0.png)


    她说了什么吗？


    除了那些详尽残忍的威胁和我我听过的最色彩丰富的辱骂之外？没有。


    她被联盟情报官审问了好几周。她什么也没给。


    哼。


    我敢打赌那审讯相当激烈。他们会怎么做？在她脸上照强光？大声播放他们的音乐？


    人性并不等同于软弱。


    帝国不会止于此，这也是我们与他们战斗的原因之一。


    当你的生命命悬一线时，它是——

    我不接受那个。


    下次见到暴风兵（STORROOPER）时，如果他拒绝杀了你。


    我敢打赌你会输的。


    啊，如果你听我的，女士们，我会看着那个囚犯（PRISONER）。


