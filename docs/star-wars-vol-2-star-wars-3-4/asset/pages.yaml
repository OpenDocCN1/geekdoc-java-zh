    The rebel heroes have taken a high-value captive: Darth Vader''s ally, the rogue
    archaeologist Dr. Aphra! But the simple mission of delivering her to the Alliance''s
    highly secret Sunspot Prison will turn into a nightmare for Princess Leia — one
    that will force her into an uneasy alliance with Sana Starros and Aphra herself.
    Meanwhile, Han Solo tries to teach Luke Skywalker a little something about life
    as a smuggler. That could come in handy when the rebels launch their next ambitious
    plan: to seize control of an Imperial Star Destroyer! But standing in their way
    are Sergeantel and his elite stormtroopers, Squad Squadron — and they specialize
    in killing rebels! If you have a bad feeling about this, you''d be right! Plus:
    more tales from the journal of Obi-Wan Kenobi — including Ben''s showdown with
    Black Ackandar the killer Wookiee!


