  \ 现在包含两个元素：一个 `MoveTo` 和紧随其后的 `QuadCurveTo`。\n\n`MoveTo` 元素是鼠标点击的结果（在图 5-1 步骤 1\
  \ 的结束处）。\n\n而 `QuadCurveTo` 元素在拖动开始时创建（在图 5-1 步骤 3 的开始）。二次贝塞尔曲线从上一个元素指定的坐标绘制到鼠标按下的位置。\n\
