  import javafx.scene.shape.HLineTo;\nimport javafx.scene.shape.LineTo;\nimport javafx.scene.shape.MoveTo;\n\
  import javafx.scene.shape.Path;\nimport javafx.scene.shape.QuadCurveTo;\nimport\
  \ javafx.scene.shape.StrokeLineCap;\nimport javafx.scene.shape.StrokeLineJoin;\n\
  ```\n\n### 列表 4-3. 创建由 4 个 `PathElement` 组成的 `Path`（共 3 笔画）：\n\n```\n Path path\
  \ = new Path();\n\n    // 第 1 笔：从 (120, 87) 到 (195, 87) 绘制一条水平线\n    MoveTo moveTo\
  \ = new MoveTo();\n    moveTo.setX(120.0f);\n    moveTo.setY(87.0f);\n    HLineTo\
  \ hLineTo = new HLineTo();\n    hLineTo.setX(195.0f);\n\n    // 第 2 笔：从 (195, 87)\
  \ 到 (205, 170) 绘制一条二次曲线\n    // 控制点在 (36, 201)\n    // (195, 87) 是第一笔画的终点\n    QuadCurveTo\
  \ quadCurveTo = new QuadCurveTo();\n    quadCurveTo.setControlX(36.0f);\n    quadCurveTo.setControlY(201.0f);\n\
  \    quadCurveTo.setX(205.0f);\n    quadCurveTo.setY(170.0f);\n\n    // 第 3 笔：从\
  \ (205, 170) 到 (209, 149) 绘制一条线\n    // (205, 170) 是第 2 笔画的终点\n    LineTo lineTo\
  \ = new LineTo();\n    lineTo.setX(209.0f);\n    lineTo.setY(149.0f);\n\n    path.getElements().addAll(\n\
  \      moveTo, hLineTo, quadCurveTo, lineTo);\n\n    // 设置某些属性的值\n    path.setStrokeLineCap(StrokeLineCap.ROUND);\n\
  \    path.setStrokeLineJoin(StrokeLineJoin.BEVEL);\n    path.setStrokeWidth(8.0);\n\
  \    path.setStroke(Color.web(\"#A0522D\"));\n```\n\n请注意，为了使路径与独特，我们设置了 `Shape`\
  \ 类中定义的几个属性的值：\n\n`strokeLineCap`\n这是一个类型为 `ObjectProperty<StrokeLineCap>` 的属性，用于指定线的端点样式。`StrokeLineCap`\
  \ 是一个枚举类型，定义了常量：`BUTT`、`ROUND` 和 `SQUARE`。在代码中尝试这些值以理解它们之间的差异。默认值为 `SQUARE`。\n\n\
  `strokeLineJoin`\n这是一个类型为 `ObjectProperty<StrokeLineJoin>` 的属性，用于指定笔画之间的连接样式。`StrokeLineJoin`\
  \ 是一个枚举类型，定义了常量：`BEVEL`、`MITER` 和 `ROUND`。在代码中尝试这些值以理解它们之间的差异。默认值为 `MITER`。\n\n\
  `strokeWidth`\n这是一个类型为 `DoubleProperty` 的属性，用于指定笔画的宽度。默认值为 `0.0`。\n\n`stroke`\n\
  这是一个类型为 `ObjectProperty<Paint>` 的属性，用于指定绘制形状边界的颜色。对于 `Line`、`Polyline` 和 `Path`，默认值为\
  \ `Color.BLACK`；对于其他形状为 `null`。\n\n以下快照显示了列表 4-3 代码中 `Path` 的渲染结果：\n\n图 4-3. 根据列表\
  \ 4-3 代码创建的路径快照；它是一个由 3 个笔画组成的汉字![](img/00014.jpeg \"example_path_2.jpg\")\n\n以下快照说明了列表\
  \ 4-3 代码中 `Path` 的笔画绘制顺序：\n\n图 4-4. 根据列表 4-3 代码的 `Path` 笔画绘制顺序图![](img/00015.jpeg\
  \ \"stroke_order_2.jpg\")\n\n现在，我们将演示如何开发一个 `PathDrawer` 应用程序来交互式地绘制 `Path` 对象。组装\
  \ `Path` 的每个 `PathElement` 中点的 (X, Y) 坐标是通过鼠标按下和鼠标拖动事件动态获取的。为了简化此阶段的方法，我们只实现了两种类型的\
  \ `PathElement`：`MoveTo` 和 `LineTo`。在下一章，我们将演示如何交互式绘制由 `MoveTo` 和 `QuadCurveTo`\
  \ 组成的 `Path`。\n\n为了创建 `PathDrawer` 类，我们采用了 `PolylineDrawer` 类的完整源代码，并进行了细小修改。关键区别在于两个方法\
  \ `onMouseDragStarted()` 和 `onMouseDragFinished()` 的实现，它们将在后章节中进行描述。\n\n\n\n\nListing\
  \ 4-4. 创建继承 `Application` 类的 `PathDrawer` 类，重写 `start` 方法，创建 `BorderPane` 作为 `Scene`\
  \ 的根节点，并将 `Pane` 于 `BorderPane` 的中心作为绘板：\n\n```\n package drawtool;\n\nimport javafx.application.Application;\n\
  import javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.Pane;\nimport\
  \ javafx.scene.paint.Color;\nimport javafx.scene.Scene;\nimport javafx.stage.Stage;\n\
  \n/**\n * File Name: PathDrawer.java\n * @author: Shufen Kuo\n *\n */\npublic class\
  \ PathDrawer extends Application {\n\n  @Override\n  public void start(Stage stage)\
  \ {\n    BorderPane rootPane = new BorderPane();\n    Pane drawPane = new Pane();\n\
  \    rootPane.setCenter(drawPane);\n\n    Scene scene = new Scene(rootPane, 600,\
  \ 400, Color.FLORALWHITE);\n    stage.setScene(scene);\n    stage.setTitle(\"PathDrawer\
  \ V1.0 Shufen Source Code\");\n    stage.show();\n  }\n\n  public static void main(String[]\
  \ args) {\n    launch(args);\n  }\n}\n```\n\n### 4.1.1 创建 `Path` 实例\n\n通常情况下，`Polyline`\
  \ 和 `Path` 都被识别为具有多个元素的 `Shape`。`Polyline` 是一种具有多条线的形状，通过按给定顺序连接一系列点来构建；相邻的两条线始终是连接的。然而，由于\
  \ `MoveTo` 元素的存在，`Path` 中的两个相邻元素可能是不连接的。`MoveTo` 元素仅仅是将路径移动到指定的 X、Y 坐标，而不执行任何绘制。`Path`\
  \ 在 JavaFX 动画 `PathTransition` 中也起着有趣的角色，该动画沿着指定的 `Path` 切换 JavaFX `Node`。\n\n要了解如何使用\
  \ `Node` 类提供的便利方法注册事件处理器来处理鼠标事件和按键事件，请阅读第 1 章中的第 1.2.1 节 使用便利方法注册事件处理器 和第 1.4 节\
  \ 获取按键事件的键码。\n\n以下代码显示了检测到第一个鼠标拖拽事件时，在 `MOUSE_DRAGGED` 事件处理器内部创建一个 `Path` 对象：\n\n\
  导入语句：\n\n```\n import javafx.scene.shape.Path;\n```\n\nListing 4-5. 注册 `MOUSE_DRAGGED`\
  \ 事件的处理器，在检测到第一个鼠标拖拽事件时创建 `Path` 实例：\n\n```\n drawPane.setOnMouseDragged(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        // 计算鼠标位置到起始位置的距离\n\
  \        double x2 = me.getX();\n        double y2 = me.getY();\n        translateX.set(x2\
  \ - startX.get());\n        translateY.set(y2 - startY.get()); \n        if (!dragged)\
  \ {\n          // 只执行了一次\n          if (getShape() == null)\t{\n            Shape\
  \ tmpShape = new Path();\n            tmpShape.setStroke(Color.BLUE);\n        \
  \    shape.set(tmpShape);\n          } \n          dragged = true;\n          onMouseDragStarted();\n\
  \        }\n      }\n    });\n```\n\n### 4.1.2 实现 `onMouseDragStarted()` 方法\n\n\
  `onMouseDragStarted()` 方法在发生第一次拖拽事件时，从 `MOUSE_DRAGGED` 事件的处理器被调用。它执行以下任务：\n\n* \
  \  创建一个 `MoveTo` 对象：\n    将此 `MoveTo` 元素的 x、y 坐标设置为鼠标按下的位置；这是稍后将引用的起始位置。\n*   创建一个\
  \ `LineTo` 对象：\n    将此 `LineTo` 元素的 x、y 坐标绑定到一个 `DoubleBinding` 对象上，该对象计算起始位置和位移距离之和。\n\
  *   将 `MoveTo` 和 `LineTo` 添加到路径：\n    获取此路径的 `PathElement` 列表，并将 `MoveTo` 和 `LineTo`\
  \ 添加其中。\n\n以下是 `onMouseDragStarted()` 方法的初始实现。\n\n导入语句：\n\n```\n import javafx.scene.shape.LineTo;\n\
  import javafx.scene.shape.MoveTo;\n```\n\nListing 4-6. 实现 `onMouseDragStarted()`\
  \ 方法，从 `MOUSE_DRAGGED` 事件的处理器被调用：\n\n```\n void onMouseDragStarted() {\n    MoveTo\
  \ moveTo = new MoveTo();\n    moveTo.setX(startX.get());\n    moveTo.setY(startY.get());\n\
  \n    LineTo lineTo = new LineTo();\n    lineTo.xProperty().bind(startX.add(translateX));\n\
  \    lineTo.yProperty().bind(startY.add(translateY));\n\n    Path path = (Path)getShape();\n\
  \    path.getElements().addAll(moveTo, lineTo);\n  }\n```\n\n现在，让我们花一点努力来改进上面的代码。\n\
  \n并不一定为每个 `MOUSE_PRESSED`—`MOUSE_DRAGGED`—`MOUSE_RELEASED` 事件周期都添加 `MoveTo` 元素。首先，我们将检查这是否是一个新路径的开始，因为\
  \ `Path` 需要一个 `MoveTo` 元素来开始绘制。如果是现有路径，我们检查最后一个 `LineTo` 的坐标是否发生了变化。\n\n这里是增强后的\
  \ `onMouseDragStarted()` 方法实现：\n\n导入语句：\n\n```\n import javafx.scene.shape.LineTo;\n\
  import javafx.scene.shape.MoveTo;\nimport javafx.scene.shape.Path;\nimport javafx.scene.shape.PathElement;\n\
  ```\n\nListing 4-7. 增强 `onMouseDragStarted()` 方法：\n\n```\n void onMouseDragStarted()\
  \ {\n    Path path = (Path)getShape();\n    ObservableList<PathElement> list = path.getElements();\n\
  \n    if (list.size() > 0) {\n      LineTo lineTo = (LineTo) list.get(list.size()\
  \ - 1);\n      if (lineTo.getX() != startX.get() || lineTo.getY() != startY.get())\
  \ {\n        MoveTo moveTo = new MoveTo();\n        moveTo.setX(startX.get());\n\
  \        moveTo.setY(startY.get());\n        path.getElements().add(moveTo);\n\n\
  \        LineTo lineTo = new LineTo();\n        lineTo.xProperty().bind(startX.add(translateX));\n\
  \        lineTo.yProperty().bind(startY.add(translateY));\n        path.getElements().add(lineTo);\n\
  \      }\n    } else {\n      MoveTo moveTo = new MoveTo();\n      moveTo.setX(startX.get());\n\
  \      moveTo.setY(startY.get());\n      path.getElements().add(moveTo);\n\n   \
  \   LineTo lineTo = new LineTo();\n      lineTo.xProperty().bind(startX.add(translateX));\n\
  \      lineTo.yProperty().bind(startY.add(translateY));\n      path.getElements().add(lineTo);\n\
  \    }\n  }\n```\n\n### 4.1.3 实现 `onMouseDragFinished()` 方法\n\n`onMouseDragFinished()`\
  \ 方法从 `MOUSE_RELEASED` 事件的处理器被调用。它执行以下任务：\n\n*   获取此路径的 `PathElement` 列表。\n*   检索最后一个\
  \ `LineTo` 元素。\n*   取消最后一个 `LineTo` 元素的 x、y 坐标绑定。\n\n一系列 `MOUSE_DRAGGED` 事件后一个 `MOUSE_RELEASED`\
  \ 事件完成了 `Path` 中一个 `PathElement` 的绘制。\n\nListing 4-8. 实现 `onMouseDragFinished()`\
  \ 方法，从 `MOUSE_RELEASED` 事件的处理器被调用：\n\n```\n void onMouseDragFinished() {\n    Path\
  \ path = (Path)getShape();\n    if (path != null) {\n      ObservableList<PathElement>\
  \ list = path.getElements();\n      if (list.size() > 1) {\n        LineTo lineTo\
  \ = (LineTo) list.get(list.size() - 1);\n        lineTo.xProperty().unbind();\n\
  \        lineTo.yProperty().unbind();\n      }\n    }\n  }\n```\n\n\n\n\n\n```java\n\
  \ package drawtool;\n\nimport javafx.application.Application;\nimport javafx.beans.property.DoubleProperty;\n\
  import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleDoubleProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\nimport javafx.collections.ObservableList;\n\
  import javafx.event.EventHandler;\nimport javafx.event.EventType;\nimport javafx.scene.input.KeyCode;\n\
  import javafx.scene.input.KeyEvent;\nimport javafx.scene.input.MouseEvent;\nimport\
  \ javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.Pane;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.LineTo;\nimport javafx.scene.shape.MoveTo;\nimport javafx.scene.shape.Path;\n\
  import javafx.scene.shape.PathElement;\nimport javafx.scene.shape.Shape;\nimport\
  \ javafx.scene.Scene;\nimport javafx.stage.Stage;\n\n/**\n * 文件名: PathDrawer.java\n\
  \ * (目录: PathDrawer1.0/src/example1/drawtool/)\n * 此 JavaFX 实现了通过连续的鼠标拖动事件绘制路径，\n\
  \ * 之后将集成到综合绘制工具 JFXDrawTools 中\n * \n * 对于每个 MOUSE_PRESSED-MOUSE_DRAGGED-MOUSE_RELEASED\
  \ 事件循环，\n * 仅当鼠标按下事件的位置与上一个 LineTo 元素的 x, y 坐标不符时，\n * 才会创建一个 MoveTo 元素，并且始终会创建一个\
  \ LineTo 元素。\n * 当你完成此路径的所有元素时，按下 ENTER 键将其最终确定，\n * 下一个 MOUSE_PRESSED 事件将开始新路径的第一个元素\n\
  \ * 要取消此路径，按下 ESCAPE 键\n *\n * @author: Shufen Kuo\n */\npublic class PathDrawer\
  \ extends Application {\n\n  // 在发生鼠标事件时跟踪光标位置位置\n  // startX, startY 存储鼠标按下事件的位置\n\
  \  DoubleProperty startX = new SimpleDoubleProperty();\n  DoubleProperty startY\
  \ = new SimpleDoubleProperty();\n\n  // translateX, translateY 存储从拖动/移动位置到 startX,\
  \ startY 的距离\n  DoubleProperty translateX = new SimpleDoubleProperty();\n  DoubleProperty\
  \ translateY = new SimpleDoubleProperty();\n\n  // 此用于持有当前绘制的形状\n  ObjectProperty<Shape>\
  \ shape = new SimpleObjectProperty<>();\n\n  // 此变量在鼠标拖动事件处理程序内部被设置为 true\n  //\
  \ 当第一次鼠标拖动事件发生时，\n  // 当鼠标释放事件发生时重置为 false。\n  boolean dragged = false;\n\n  @Override\n\
  \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
  \    // 我们不能在这里使用 Group 对象作为 drawPane，因为\n    // 当 rootPane 尺寸改变时，group 的大小不会动态调整\n\
  \    final Pane drawPane = new Pane();\n    rootPane.setCenter(drawPane);\n\n  \
  \  drawPane.setOnMousePressed(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        // 获取起始鼠标位置\n        startX.set(me.getX());\n\
  \        startY.set(me.getY());\n      }\n    });\n\n    drawPane.setOnMouseDragged(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 计算从鼠标位置到起始位置的距离\n        double x2 = me.getX();\n        double\
  \ y2 = me.getY();\n        translateX.set(x2 - startX.get());\n        translateY.set(y2\
  \ - startY.get()); \n        if (!dragged) {\n          // 只执行了一次\n          if\
  \ (getShape() == null)\t{\n            Shape tmpShape = new Path();\n          \
  \  tmpShape.setStroke(Color.BLUE);\n            shape.set(tmpShape);\n         \
  \ } \n          dragged = true;\n          onMouseDragStarted();\n        }\n  \
  \    }\n    });\n\n    drawPane.setOnMouseReleased(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        if (dragged)\
  \ {\n          dragged = false;\n          onMouseDragFinished();\n        }\n \
  \     }\n    });\n\n    // 必须将 focusTraversable 设置为 true 以处理 KeyEvent，\n    // 默认为\
  \ false。\n    drawPane.setFocusTraversable(true);\n    drawPane.setOnKeyPressed(new\
  \ EventHandler<KeyEvent>() {\n      @Override\n      public void handle(KeyEvent\
  \ ke) {\n        KeyCode kc = ke.getCode();\n        switch (kc) {\n          case\
  \ ENTER : \n            // 按下回车键完成此形状\n            System.out.format(\"Enter key\
  \ hit%n\");\n            // 必须调用 dragged finished 方法来解除绑定\n            onMouseDragFinished();\n\
  \            setShape(null);  // 完成此形状\n            break;\n          case ESCAPE:\n\
  \            // 按下 Esc 键清除此形状\n            System.out.format(\"Esc key hit%n\");\n\
  \            Shape s = getShape();\n            if (s != null) {\n             \
  \ // 必须调用 dragged finished 方法来解除绑定\n              onMouseDragFinished();\n     \
  \         drawPane.getChildren().remove(s);\n              setShape(null);  // 清除此形状\n\
  \            }\n            break;\n        }       \n      }\n    });\n\n    //\
  \ 监听 shape 属性的值的变化，\n    // 如果则将形状添加到绘制板\n    shape.addListener(new ChangeListener<Shape>()\
  \ {\n      @Override\n      public void changed(ObservableValue extends Shape> observable,\
  \ Shape oldVal, Shape newVal) {\n        // 观察 shape 属性的值变化，\n        // 如果 newVal\
  \ 不为空\n        // 如果按下回车键或 Esc 键则解除绑定\n        if (newVal != null) {\n         \
  \ // 将形状添加到绘制板\n          System.out.format(\"shape changed: %s%n\", newVal);\n\
  \          drawPane.getChildren().add(newVal);\n        }\n      }\n    });\n\n\
  \    Scene scene = new Scene(rootPane, 600, 400);\n    stage.setTitle(\"PathDrawer\
  \ V1.0 Shufen\");\n    stage.show();\n  }\n\n  public ObjectProperty<Shape> shapeProperty()\
  \ {\n    return shape;\n  }\n\n  public void setShape(Shape value) {\n    shape.set(value);\n\
  \  }\n\n  public Shape getShape() {\n    return shape;\n  }\n\n  void onMouseDragStarted()\
  \ {\n    Path path = (Path)getShape();\n    // 是否是路径的开始\n    ObservableList<PathElement>\
  \ list = path.getElements();\n    if (list.size() == 0) {\n      // 需要一个 MoveTo\n\
  \      MoveTo moveTo = new MoveTo();\n      moveTo.setX(startX.get());\n      moveTo.setY(startY.get());\n\
  \      path.getElements().add(moveTo);\n    } else {\n      // 不是路径的开始\n      //\
  \ 获取最后一个 LineTo 并检查 x,y 坐标\n      LineTo lineTo = (LineTo) list.get(list.size()\
  \ - 1);\n      if (lineTo.getX() != startX.get() || lineTo.getY() != startY.get())\
  \ {\n        // 需要一个 MoveTo\n        MoveTo moveTo = new MoveTo();\n        moveTo.setX(startX.get());\n\
  \        moveTo.setY(startY.get());\n        path.getElements().add(moveTo);\n \
  \     }      \n    }\n\n    // 创建 LineTo 并添加到列表\n    LineTo lineTo = new LineTo();\n\
  \    lineTo.xProperty().bind(startX.add(translateX));\n    lineTo.yProperty().bind(startY.add(translateY));\n\
  \n    path.getElements().add(lineTo);\n  }\n\n  void onMouseDragFinished() {\n \
  \   Path path = (Path)getShape();\n    // 此处必须验证 shape 是否不空\n    if (path != null)\
  \ {\n      ObservableList<PathElement> list = path.getElements();\n      // 解除绑定列表中最后一个\
  \ lineTo 元素的 x, y 位置\n      if (list.size() > 1) {\n         LineTo lineTo = (LineTo)\
  \ list.get(list.size() - 1);\n         lineTo.xProperty().unbind();\n         lineTo.yProperty().unbind();\n\
  \      }\n    }\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n\
  \  }\n}\n```\n\n图 4-5. 使用 `Path Drawer` 模块绘制各种图标的截图。\n\nimages/00016.jpeg\n\n编译并运行应用程序。尝试以下步骤进行测试：\n\
  \n1. 将鼠标移动到绘制板上的某个位置。\n2. 按住鼠标并在绘制板周围拖动。\n3. 释放鼠标在路径中创建一条线。\n4. 在相同位置按下鼠标并在周围拖动。\n\
  5. 释放鼠标创建与前一个连接的另一条线。\n\n\n\n\n6. 重复之前的两个步骤几次，以创建更多条逐一连接的线。\n\n7. 将鼠标移动到远离上一条线段终点的新位置。\n\
  \n8. 按住鼠标并在画板上拖动。\n\n9. 松开鼠标创建一条与前一条不连接的线。\n\n10. 重复之前的三个步骤几次，以创建多条互不连接的线。\n\n11.\
  \ 按 `Enter` 键完成一个路径的绘制。\n\n12. 尝试重复类似的移动-按下-拖动-释放步骤几次，然后按 `Esc` 键取消该路径的绘制。\n\n在命令行中编译和运行程序的输出：\n\
