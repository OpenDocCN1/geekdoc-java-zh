  \ of this line binds to the position of MOUSE_DRAGGED event,\n * this line is completed\
  \ as MOUSE_RELEASE event occurs,\n * repeat MOUSE_PRESSED, MOUSE_DRAGGED, MOUSE_RELEASED\
  \ event cycles until you are\n * satisfied with the rendering of this line\n * To\
  \ finalize this line, hit ENTER key,\n * the next MOUSE_PRESSED event will start\
  \ a new line\n * To cancel this line, hit  ESCAPE key\n *\n * @author: Shufen Kuo\n\
  \ */\npublic class LineDrawer extends Application {\n\n  // Keep track of the cursor\
  \ locations while mouse event occurs\n  // startX, startY hold locations of mouse\
  \ pressed event\n  DoubleProperty startX = new SimpleDoubleProperty();\n  DoubleProperty\
  \ startY = new SimpleDoubleProperty();\n\n  // translateX, translateY hold the distance\
  \ from dragged/moved location to the startX, startY\n  DoubleProperty translateX\
  \ = new SimpleDoubleProperty();\n  DoubleProperty translateY = new SimpleDoubleProperty();\n\
  \n  // This is to hold the shape of current drawing \n  ObjectProperty<Shape> shape\
  \ = new SimpleObjectProperty<>();\n\n  // This variable is set to true inside mouse\
  \ dragged event handler\n  // when the first mouse dragged event occurs,\n  // and\
  \ reset to false when mouse released event occurs.\n  boolean dragged = false;\n\
  \n  @Override\n  public void start(Stage stage) {\n    BorderPane rootPane = new\
  \ BorderPane();\n    // We can't use Group object as drawPane here because\n   \
  \ // the size of group is not dynamically adjusted when size of rootPane changed\n\
  \    final Pane drawPane = new Pane();\n    rootPane.setCenter(drawPane);\n\n  \
  \  drawPane.setOnMousePressed(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        // Get the starting mouse location\n\
  \        startX.set(me.getX());\n        startY.set(me.getY());\n      }\n    });\n\
  \n    drawPane.setOnMouseDragged(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        // Compute distance from mouse\
  \ location to starting location\n        double x2 = me.getX();\n        double\
  \ y2 = me.getY();\n        translateX.set(x2 - startX.get());\n        translateY.set(y2\
  \ - startY.get()); \n        if (!dragged) {\n          // Did this only once\n\
  \          if (getShape() == null)\t{\n            Shape tmpShape = new Line();\n\
  \            tmpShape.setStroke(Color.BLUE);\n            shape.set(tmpShape);\n\
  \          } \n          dragged = true;\n          onMouseDragStarted();\n    \
  \    }\n      }\n    });\n\n    drawPane.setOnMouseReleased(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        if (dragged)\
  \ {\n          dragged = false;\n          onMouseDragFinished();\n        }\n \
  \     }\n    });\n\n    // Must set focusTraversable to true in order to handle\
  \ KeyEvent, \n    // default is false.\n    drawPane.setFocusTraversable(true);\n\
  \    drawPane.setOnKeyPressed(new EventHandler<KeyEvent>() {\n      @Override\n\
  \      public void handle(KeyEvent ke) {\n        KeyCode kc = ke.getCode();\n \
  \       switch (kc) {\n          case ENTER : \n            // Hit Enter key to\
  \ finalize this line\n            System.out.format(\"Enter key hit%n\");\n    \
  \        // Must call dragged finished method to unbind\n            onMouseDragFinished();\n\
  \            setShape(null);  // complete this line\n            break;\n      \
  \    case ESCAPE:\n            // Hit Esc key to clear this line\n            System.out.format(\"\
  Esc key hit%n\");\n            Shape s = getShape();\n            if (s != null)\
  \ {\n              // Must call dragged finished method to unbind\n            \
  \  onMouseDragFinished();\n              drawPane.getChildren().remove(s);\n   \
  \         }\n            break;\n        }       \n      }\n    });\n\n    // Listen\
  \ to the value changed of shape,\n    // add the shape to drawing board if a new\
  \ shape is created.\n    shape.addListener(new ChangeListener<Shape>() {\n     \
  \ @Override\n      public void changed(ObservableValue o, Shape oldVal, Shape newVal)\
  \ {\n        System.out.format(\"shape changed: %s%n\", newVal);\n        if (newVal\
  \ != null) {\n          // add to drawing board\n          drawPane.getChildren().add(newVal);\n\
  \        } else {\n          // clear this line\n          drawPane.getChildren().remove(oldVal);\n\
  \        }\n      }\n    });\n\n    Scene scene = new Scene(rootPane, 600, 400);\n\
  \    stage.setTitle(\"LineDrawer V1.0 Shufen\");\n    stage.setScene(scene);\n \
  \   stage.show();\n  }\n\n  public Shape getShape() {\n    return shape.get();\n\
  \  }\n\n  public void setShape(Shape value) {\n    shape.set(value);\n  }\n\n  public\
  \ ObjectProperty<Shape> shapeProperty() {\n    return shape;\n  }\n\n  void onMouseDragStarted()\
  \ {\n    Line line = (Line)getShape();\n    line.setStartX(startX.get());\n    line.setStartY(startY.get());\n\
  \    line.endXProperty().bind(startX.add(translateX));\n    line.endYProperty().bind(startY.add(translateY));\n\
  \  }\n\n  void onMouseDragFinished() {\n    Line line = (Line)getShape();\n    //\
  \ verify shape is not null\n    if (line != null) {\n      // unbind properties\
  \ endX, endY\n      line.endXProperty().unbind();\n      line.endYProperty().unbind();\n\
  \    }\n  }\n\n  public static void main(String[] args) {\n    launch(args);\n \
