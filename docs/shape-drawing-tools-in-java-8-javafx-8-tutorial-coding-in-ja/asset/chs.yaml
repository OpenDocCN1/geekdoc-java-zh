  \n##8.4 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按它们在本文出现的顺序列出：\n\n* 来自 `javafx.beans.property`\
  \ 包的两个类：\n    * `StringProperty`：这是一个继承自 `javafx.beans.binding.StringExpression`\
  \ 的抽象类，实现了 `Property<java.lang.String>` 和 `WritableStringValue`。\n    * `WritableStringValue`：继承自\
  \ `WritableValue<java.lang.String>`。\n    * `SimpleStringProperty`：派自 `StringProperty`\
  \ 类。\n    （参见创建菜单栏)\n* `HBox` 类：内置 JavaFX 布局之一，位于 `javafx.scene.layout` 包，是 `javafx.scene.layout.Pane`\
  \ 的直接子类，将其子元素水平排列。\n    （参见创建菜单栏)\n* `Text` 类：位于 `javafx.scene.text` 包，是 `javafx.scene.shape.Shape`\
  \ 类的一个直接子类，处理几何图形渲染的共同需求。\n    （参见创建菜单栏)\n* `void setPadding(Insets value)` 方法：由\
  \ `Region` 类，定义区域的上、右、下、左内边距。\n    （参见此处)\n* `void setSpacing(double value)` 方法：由\
  \ `HBox` 提供，指定 HBox 子元素之间的水平间距。\n    （参见此处)\n* `void setStyle(String value)` 方法：由\
  \ `Node` 提供，指定此节点的 CSS 样式。\n    （参见此处)\n* `static Font font(java.lang.String family,\
  \ FontWeight weight, double size)` 方法：由 `javafx.scene.text.Font` 提供，用于获取渲染文本的字体。\n\
  \    （参见此处)\n* `void bind(ObservableValue<? extends T> observable)` 方法：定义 `Property`\
  \ 接口，位于 `javafx.beans.property` 包，将此属性单向绑定到给定的 `ObservableValue`。\n    （参见此处)\n\
  * `MenuBar`、`Menu` 和 `MenuItem` 是基础 JavaFX UI 组件，位于 `javafx.scene.control` 包，用于用更少的空间设计紧凑的图形界面。\n\
  \    （参见创建菜单栏)\n* `RadioMenuItem` 和 `ToggleGroup`：位于 `javafx.scene.control` 包，用于在菜单中创建互斥选择。\n\
  \    （参见创建菜单栏)\n* `void addListener(ChangeListener<? super T> listener)` 方法：定义 `ObservableValue`\
  \ 接口，通过提供 `changed(ObservableValue<? extends T> observable, T oldValue, T newValue)`\
  \ 方法添加 `ChangeListener`，当此属性值改变时调用。\n    （参见此处)\n* `EventHandler<T extends Event>`：扩展\
  \ `java.util.EventListener` 的接口，定义了 `handle(T event)` 方法，当指定事件发生时调用。\n    （参见设置菜单项的加速器)\n\
  * `void setOnAction(EventHandler<ActionEvent> value)` 方法：由 `MenuItem` 提供，注册一个 `EventHandler`\
  \ 在发生 `ActionEvent` 时进行通知。\n    （参见设置菜单项的加速器)\n* `accelerator` 属性：由 `MenuItem` 定义，指定一个\
  \ `KeyCombination` 来触发 `MenuItem` 的 `ActionEvent`。\n    （参见设置菜单项的加速器)\n* `KeyCombination`：位于\
  \ `javafx.scene.input` 包的抽象类，定义了 `KeyCombination.Modifier` 类型的静态字段，例如 `CONTROL_DOWN`、`META_DOWN`、`SHIFT_DOWN`\
  \ 等，这些在构造 `KeyCharacterCombination` 实例时有用。\n    （参见设置菜单项的加速器)\n* `KeyCharacterCombination`：位于\
  \ `javafx.scene.input` 包，是 `javafx.scene.input.KeyCombination` 的直接子类，用于创建触发 `ActionEvent`\
  \ 的快捷键。\n    （参见设置菜单项的加速器)\n\n# 结语\n\n作者们正在编写该书丛的其他卷册，并将很快陆续发布。让我们提前看看除前言部分披露的其他功能之外，即将推出的特性：\n\
  \n* 更多交互式绘图工具：自由绘制器、橡皮带绘制器、文本写入器、颜色渐变器、弧绘制器、光标键移动器等。\n* 色板工具\n* 图像裁剪工具\n* 路径过渡动画器\n\
  * 动态上下文菜单控制器\n* 以及更多……\n\n祝您猴年快乐、健康、万事如意。\n"
