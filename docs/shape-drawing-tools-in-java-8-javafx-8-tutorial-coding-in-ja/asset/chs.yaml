  \ Drawer` 的源代码与 `Polyline Drawer` 非常相似，这两个方法不需要修改任何行代码。\n\n从用'用户的角度来看，在画板上交互式绘制多边形的方法与上一章描述的绘制折线的方法相同。当检测到首次鼠标拖动事件时，会创建一个\
  \ `Polyline` 对象，这与 `Polyline Drawer` 完全相同；其实现上的细微差异描述如下：\n\n## 创建 `Polygon` 实例\n\
