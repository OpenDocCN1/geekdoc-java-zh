  *   `Rectangle` 类位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape` 的直接子类。它提供了绘制具有指定属性（如\
  \ `x`、`y`、`width`、`height` 等）的矩形形状的功能。\n\n    （查看章节实现 `RectangleDrawer` 类）\n\n*\
  \   `Circle` 类位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape` 的直接子类。它提供了绘制具有指定属性（如\
  \ `centerX`、`centerY` 和 `radius`）的圆形形状的功能。\n\n    （查看章节实现 `CircleDrawer` 类）\n\n\
  *   `Ellipse` 类位于 `javafx.scene.shape` 包，是 `javafx.scene.shape.Shape` 的直接子类。它提供了绘制具有指定属性（如\
