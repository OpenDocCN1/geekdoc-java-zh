  \ 类通过实现两个抽象方法扩展了 `ShapeDrawer`：\n\n```\n public abstract void onMouseDragStarted(DrawPane\
  \ drawPane)\n  public abstract void onMouseDragFinished(DrawPane drawPane) \n```\n\
  \n在父类 `ShapeDrawer` 中定义的 `polySegment` 属性需要在构造函数中被设置为 `true`。要完成一个多折线对象的绘制，必须按下\
  \ `Enter` 键。\n\n关于绘制 `Polyline` 对象的详细描述，请参考 第 2 章 Polyline Drawer--开发 Polyline Drawer\
  \ V1.0。\n\n以下是 `PolylineDrawer` 类的源代码。\n\n列表 7-6. 实现 `PolylineDrawer` 类，它是 `ShapeDrawer`\
  \ 的直接子类：\n\n```java\npackage drawtool.drawer;\n\nimport javafx.beans.property.ObjectProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.collections.ObservableList;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.shape.Line;\nimport javafx.scene.shape.Polyline;\n\
  \nimport drawtool.*;\n\n/**\n * File Name: PolylineDrawer.java\n * (in directory:\
  \ DrawTool1.1/src/example1/drawtool/drawer)\n *\n * @author: Shufen Kuo\n */\n\n\
  public class PolylineDrawer extends ShapeDrawer {\n  // 此用于持有一个临时线条，代表多折线的一个线段\n\
  \  ObjectProperty<Line> line = new SimpleObjectProperty<>();\n\n  public PolylineDrawer()\
  \ {\n    super(Polyline.class);\n    setPolySegment(true); // 默认为 false\n    setFillColor(null);\n\
  \    setStrokeColor(Color.BLUEVIOLET);\n  }\n\n  @Override\n  public void onMouseDragStarted(DrawPane\
  \ drawPane) {\n    Line tmpLine = new Line();\n    drawPane.getChildren().add(tmpLine);\n\
  \    // 将此 tmpLine 设置为 line 属性的值，\n    // 结果它将会在添加到绘板的子列表中，\n    // 在 line 属性的监听器内部。\n\
  \    line.set(tmpLine);\n    tmpLine.setStroke(getStrokeColor());\n    tmpLine.setStartX(drawPane.getStartX());\n\
  \    tmpLine.setStartY(drawPane.getStartY());\n    tmpLine.endXProperty().bind(\n\
  \      drawPane.startXProperty().add(drawPane.dragXProperty()));\n    tmpLine.endYProperty().bind(\n\
  \      drawPane.startYProperty().add(drawPane.dragYProperty()));\n\n    Polyline\
  \ polyline = (Polyline)getShape();\n    // 验证此线条的起点是否与\n    // 上一条线条的终点相同\n    //\
  \ 如果它们不相同，意味着此线段\n    // 没有与上一个线段连接，\n    // 我们将此线段的起点添加到 polyline 的点列表中。\n    ObservableList<Double>\
  \ list = polyline.getPoints();\n    if (list.size() > 1) {\n      // 检查最后一个点是否与此线条的起点相同\n\
  \      double lastX = list.get(list.size()-2);\n      double lastY = list.get(list.size()-1);\n\
  \      // 如果线段的起点与 polyline\n      // 点列表中的最后一个点重合，\n      // 则无需将起点添加到起点\n    \
  \  if (lastX != drawPane.getStartX() && lastY != drawPane.getStartY()) {\n     \
  \   // 将起点添加到 polyline\n        polyline.getPoints().addAll(drawPane.getStartX(),\
  \ drawPane.getStartY());\n      }        \n    } else {\n      // 点列表中还没有点，\n  \
  \    // 将起点添加到点列表中，\n      // 这是多折线的起始点。\n      polyline.getPoints().addAll(drawPane.getStartX(),\
  \ drawPane.getStartY());\n    }\n  }\n\n  @Override\n  public void onMouseDragFinished(DrawPane\
  \ drawPane) {\n    Line tmpLine = line.get();\n    if (tmpLine != null) {\n    \
  \  tmpLine.endXProperty().unbind();\n    }\n  }\n}\n```\n\n### 7.2.3 实现 `PolygonDrawer`\
  \ 类\n\n\n\n\n\n在父类 `ShapeDrawer` 中定义的 `polySegment` 属性需要在构造函数中被设置为 `true`。要完成一个多边形对象的绘制，必须按下\
  \ `Enter` 键。\n\n以下是 `PolygonDrawer` 类的完整源代码，它们与 `PolylineDrawer` 几乎相同，不同部分已用**粗体**显示。\n\
  \nListing 7-8。实现 `PolygonDrawer` 类，它是 `ShapeDrawer` 的直接子类：\n\n```java\npackage drawtool.drawer;\n\
  \nimport javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.collections.ObservableList;\nimport javafx.scene.paint.Color;\nimport\
  \ javafx.scene.shape.Line;\nimport javafx.scene.shape.Polygon; \n\nimport drawtool.*;\n\
  \n/**\n * File Name: PolygonDrawer.java\n * (in directory: DrawTool1.1/src/example1/drawtool/drawer)\n\
  \ *\n * @author: Shufen Kuo\n */\n\npublic class PolygonDrawer extends ShapeDrawer\
  \ {\n  // 用于存储一个临时线条，代表多边形的一个条段\n  ObjectProperty<Line> line = new SimpleObjectProperty<>();\n\
  \n  public PolygonDrawer() {\n    super(Polygon.class);\n    setPolySegment(true);\
  \ // 默认为 false\n    setStrokeColor(Color.MEDIUMBLUE);\n    setFillColor(Color.AQUA);\n\
  \  }\n\n  @Override\n  public void onMouseDragStarted(DrawPane drawPane) {\n   \
  \ Line tmpLine = new Line();\n    drawPane.getChildren().add(tmpLine);\n    // 将\
  \ tmpLine 设置为 line 属性的值，\n    // 结果是它会被添加到绘制板的子列表中\n    // 在 line 属性的监听器内部。\n  \
  \  line.set(tmpLine);\n    tmpLine.setStroke(getStrokeColor());\n    tmpLine.setStartX(drawPane.getStartX());\n\
  \    tmpLine.setStartY(drawPane.getStartY());\n    tmpLine.endXProperty().bind(\n\
  \      drawPane.startXProperty().add(drawPane.dragXProperty()));\n    tmpLine.endYProperty().bind(\n\
  \      drawPane.startYProperty().add(drawPane.dragYProperty()));\n\n    Polygon\
  \ polygon = (Polygon)getShape();\n    // 验证此线条的起点是否\n    // 等于上一个线条的终点\n    // 如果它们不相同，意味着该条段\n\
  \    // 没有与上一个段连接，\n    // 我们将此条段的起点添加到多边形的点列表中\n    ObservableList<Double> list\
  \ = polygon.getPoints();\n    if (list.size() > 1) {\n      // 检查最后一个点是否与此线条的起点相同\n\
  \      double lastX = list.get(list.size()-2);\n      double lastY = list.get(list.size()-1);\n\
  \      // 如果此条段的起点与多边形点\n      // 列表中的最后一个点重合，\n      // 则不需要将起点添加到多边形\n      if\
  \ (lastX != drawPane.getStartX() && lastY != drawPane.getStartY()) {\n        //\
  \ 将起点添加到多边形\n        polygon.getPoints().addAll(drawPane.getStartX(), drawPane.getStartY());\n\
  \      }        \n    } else {\n      // 点列表中目前还没有点，\n      // 将起点添加到点列表中，\n   \
  \   // 这是多边形的起始点。\n      polygon.getPoints().addAll(drawPane.getStartX(), drawPane.getStartY());\n\
  \    }\n  }\n\n  @Override\n  public void onMouseDragFinished(DrawPane drawPane)\
  \ {\n    Line tmpLine = line.get();\n    if (tmpLine != null) {\n      tmpLine.endXProperty().unbind();\n\
  \      tmpLine.endYProperty().unbind();\n      line.set(null); // 清除此临时线条\n    \
  \  drawPane.getChildren().remove(tmpLine);\n    }\n\n    Polygon polygon = (Polygon)getShape();\n\
  \    // 在此处必须验证 shape 是否为空\n    // 如果按下 Enter 键或 Esc 键，shape 设置为 null\n    if (polygon\
  \ != null) {\n      // 将当前线条的终点添加到多边形\n      polygon.getPoints().addAll(drawPane.getStartX()\
  \ + drawPane.getDragX(),\n        drawPane.getStartY() + drawPane.getDragY());\n\
  \    }\n  }\n\n}\n```\n\n### 7.2.3.1 创建多边形绘制器应用程序\n\n为了测试 `PolygonDrawer` 类，我们创建了一个简单的绘制应用程序，它可以在绘制板上动态地绘制多边形。以下是完整的源代码。\n\
  \nListing 7-9. 多边形绘制应用程序的源代码：\n\n```java\npackage drawerapp;\n\nimport javafx.application.Application;\n\
  import javafx.scene.layout.BorderPane;\nimport javafx.scene.paint.Color;\nimport\
  \ javafx.scene.Scene;\nimport javafx.stage.Stage;\n\nimport drawtool.*;\nimport\
  \ drawtool.drawer.*;\n\n/**\n * File Name: PolygonDrawerApp.java\n * (in directory:\
  \ DrawTool1.1/src/example1/drawerapp/)\n * 该应用程序在绘制板上动态绘制多边形。\n * 一个测试 PolygonDrawer\
  \ 类的简单应用程序。\n *\n * @author: Shufen Kuo\n */\n\npublic class PolygonDrawerApp extends\
  \ Application {\n\n  @Override\n  public void start(Stage stage) {\n    BorderPane\
  \ rootPane = new BorderPane();\n    DrawPane drawPane = new DrawPane(new PolygonDrawer());\n\
  \    rootPane.setCenter(drawPane);\n\n    Scene scene = new Scene(rootPane, 600,\
  \ 400, Color.ALICE);\n    stage.setScene(scene);\n    stage.setTitle(\"PolygonDrawerApp\
  \ V1.0 Shufen Source Code\");\n    stage.show();\n  }\n\n  public static void main(String[]\
  \ args) {\n    launch(args);\n  }\n}\n```\n\n\n\n\n```java\npackage drawtool.drawer;\n\
  \nimport javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.collections.ObservableList;\nimport javafx.scene.shape.LineTo;\nimport\
  \ javafx.scene.shape.MoveTo;\nimport javafx.scene.shape.PathElement;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.Path;\n\nimport drawtool.*;\n\n/**\n * File Name: PathDrawer.java\n\
  \ * (in directory: DrawTool1.1/src/example1/drawtool/drawer)\n *\n * @author: Shufen\
  \ Kuo\n */\n\npublic class PathDrawer extends ShapeDrawer {\n\n  public PathDrawer()\
  \ {\n    super(Path.class);\n    setPolySegment(true); // 认为 false\n    setStrokeColor(Color.DODGERBLUE);\n\
  \    setFillColor(null);\n  }\n\n  @Override\n  public void onMouseDragStarted(DrawPane\
  \ drawPane) {\n    Path path = (Path)getShape();\n    ObservableList<PathElement>\
  \ list = path.getElements();\n    // 检查这是否是一个新路径的起点\n    if (list.size() > 1) {\n\
  \      // 这不是新路径的起点。\n      // 检查是否需要 MoveTo。\n      // 获取上一个 LineTo 并验证其 x,y 坐标。\n\
  \      LineTo lineTo = (LineTo) list.get(list.size() - 1);\n      if (lineTo.getX()\
  \ != drawPane.getStartX() ||\n          lineTo.getY() != drawPane.getStartY()) {\n\
  \        // 需要一个 MoveTo 元素\n        MoveTo moveTo = new MoveTo();\n        moveTo.setX(drawPane.getStartX());\n\
  \        moveTo.setY(drawPane.getStartY());\n        path.getElements().add(moveTo);\n\
  \      }      \n    } else {\n      // 这是一个新路径，必须创建一个 MoveTo\n      MoveTo moveTo\
  \ = new MoveTo();\n      moveTo.setX(drawPane.getStartX());\n      moveTo.setY(drawPane.getStartY());\n\
  \      path.getElements().add(moveTo);\n    }\n\n    // 创建一个 LineTo 并添加到列表\n   \
  \ LineTo lineTo = new LineTo();\n    lineTo.xProperty().bind(\n      drawPane.startXProperty().add(drawPane.dragXProperty()));\n\
  \    lineTo.yProperty().bind(\n      drawPane.startYProperty().add(drawPane.dragYProperty()));\n\
  \n    path.getElements().add(lineTo);\n  }\n\n  @Override\n  public void onMouseDragFinished(DrawPane\
  \ drawPane) {\n    Path path = (Path)getShape();\n    // 此处必须验证 shape 不为空\n    //\
  \ 如果按下 Enter 键或 Esc 键，shape 将被设置为 null\n    if (path != null) {    \n      ObservableList<PathElement>\
  \ list = path.getElements();\n      // 解绑定列表中最后一个 lineTo 元素的 x, y 位置\n      if (list.size()\
  \ > 1) {\n         LineTo lineTo = (LineTo) list.get(list.size() - 1);\n       \
  \  lineTo.xProperty().unbind();\n         lineTo.yProperty().unbind();\n      }\n\
  \    }\n  }\n\n}\n```\n\n### 7.2.4.1 创建路径绘制器应用程序\n\n为了测试 `PathDrawer` 类，我们创建了一个简单的绘制应用程序，它只是在绘图板上动态地绘制直线组成的路径。以下是完整的源代码。\n\
  \n列表 7-11. 路径绘制应用程序的源代码：\n\n```java\npackage drawerapp;\n\nimport javafx.application.Application;\n\
  import javafx.scene.layout.BorderPane;\nimport javafx.scene.paint.Color;\nimport\
