  \ set(double value)\n  ```\n\n  设置封装的值。它接受原始类型 double。\n\n  (参见 此处)\n\n* `EventHandler<T\
  \ extends Event>` 是继承自 `java.util.EventListener` 的接口，定义了 `handle(`T` event)` 方法，在指定事件发生时调用。\n\
