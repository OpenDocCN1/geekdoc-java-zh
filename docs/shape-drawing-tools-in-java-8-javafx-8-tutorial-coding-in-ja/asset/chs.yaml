  \ 和 `WritableDoubleValue`。\n\n    `WritableDoubleValue` 扩展自 `WritableNumberValue`。\n\
  \n    ```\n    SimpleDoubleProperty\n    ```\n\n    派生自 `DoubleProperty` 类。\n\n\
  \    ```\n    ObjectProperty<T>\n    ```\n\n    一个派自 `javafx.beans.binding.ObjectExpression<T>`\
  \ 类的抽象类，实现了 `Property<T>` 和 `WritableObjectValue<T>`。\n\n    ```\n    SimpleObjectProperty<T>\n\
  \    ```\n\n    派生自 `ObjectProperty<T>` 类。\n\n    （参见章节：定义属性以存储鼠标事件的位置 以及 定义 `ObjectProperty<Shape>`）\n\
  \n    ```\n    void addListener(ChangeListener<? super T> listener)\n    ``` 方法定义在\
  \ `javafx.beans.value.ObservableValue` 接口中，通过提供一个 `changed(ObservableValue<? extends\
  \ T> observable, T` `oldValue`, T` `newValue)` 方法来添加 `ChangeListener`，该方法在该属性值发生改变时被调用。\n\
  \n    （参阅此处）\n\n    ```\n    void bind(ObservableValue<? extends T> observable)\n\
