  \n导入语句：\n\n```\nimport drawtool.drawer.*;\n```\n\n列表 8-8. 创建绘制器实例：\n\n```\nLineDrawer\
  \ lineDrawer = new LineDrawer();\nPolylineDrawer polylineDrawer = new PolylineDrawer();\n\
  PolygonDrawer polygonDrawer = new PolygonDrawer();\nPathDrawer pathDrawer = new\
  \ PathDrawer();\nBezierCurveDrawer bezierCurveDrawer = new BezierCurveDrawer();\n\
  RectangleDrawer rectangleDrawer = new RectangleDrawer();\nCircleDrawer circleDrawer\
  \ = new CircleDrawer();\nEllipseDrawer ellipseDrawer = new EllipseDrawer();\nShapeMover\
  \ shapeMover = new ShapeMover();\n```\n\n### 8.2.1 为绘制面板激活绘制器\n\n我们一次性创建应用程序所需的所有绘制器，但绘图板上同时只能有一个绘制器。应用程序可以根据需要实例化多个绘制器，并在它们之间切换激活状态。要激活绘制器，我们调用\
  \ `setDrawer(ShapeDrawer shapeDrawer)` 方法来设置在 `DrawPane` 类中 `drawer` 属性的值。定义了一个\
  \ `activateDrawer(DrawTools value)` 方法来实现此操作：\n\n列表 8-9. 定义 `activateDrawer` 并调用\
  \ `setDrawer` 方法激活绘制器：\n\n```\nvoid activateDrawer(DrawTools value) {\n    switch\
  \ (value) {\n      case LINE_DRAWER:\n        drawPane.setDrawer(lineDrawer);\n\
  \        break;\n      case POLYLINE_DRAWER:\n        drawPane.setDrawer(polylineDrawer);\n\
  \        break;\n      case POLYGON_DRAWER:\n        drawPane.setDrawer(polygonDrawer);\n\
  \        break;\n      case PATH_DRAWER:\n        drawPane.setDrawer(pathDrawer);\n\
  \        break;\n      case BEZIER_CURVE_DRAWER:\n        drawPane.setDrawer(bezierCurveDrawer);\n\
  \        break;\n      case RECTANGLE_DRAWER:\n        drawPane.setDrawer(rectangleDrawer);\n\
  \        break;\n      case CIRCLE_DRAWER:\n        drawPane.setDrawer(circleDrawer);\n\
  \        break;\n      case ELLIPSE_DRAWER:\n        drawPane.setDrawer(ellipseDrawer);\n\
  \        break;\n      case SHAPE_MOVER:\n        drawPane.setDrawer(shapeMover);\n\
  \        break;\n      default:\n    }\n  }\n```\n\n`void activateDrawer(DrawTools\
  \ value)` 方法是从为切换组的 `selectedToggle` 属性注册的监听器的 `changed` 方法中调用的。以下是代码片段：\n\n列表 8-10.\
  \ 从为 `selectedToggle` 属性注册的监听器的 `changed` 方法中调用 `activateDrawer` 方法：\n\n```\n //\
  \ 为切换组添加监听器   \ngroupTools.selectedToggleProperty().addListener(new ChangeListener()\
  \ {\n  @Override\n  public void changed(ObservableValue<? extends Toggle> ov,\n\
  \                      Toggle oldVal, Toggle newVal) {\n    if (newVal != null)\
  \ {\n      RadioMenuItem mi = (RadioMenuItem) newVal;\n      footer.set(String.format(\"\
  %s is selected\", mi.getText()));\n      activateDrawer(Enum.valueOf(DrawTools.class,\
  \ mi.getId()));\n    }\n  }\n}); \n```\n\n## 8.3 JFXDrawTools 类的完整源代码\n\n`JFXDrawTools`\
