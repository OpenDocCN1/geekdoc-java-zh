  \ 属性指定了一个 `KeyCombination` 来触发 `ActionEvent`。以下是为 `RadioMenuItem` 设置快捷键的代码片段。\n\n\
  导入语句：\n\n```java\nimport javafx.event.ActionEvent;\nimport javafx.event.EventHandler;\n\
  import javafx.scene.input.KeyCharacterCombination;\nimport javafx.scene.input.KeyCombination;\n\
  ```\n\n列表 8-4. 为 `RadioMenuItem` 设置快捷键，创建一个处理 `ActionEvent` 的 `EventHandler`，并调用\
  \ `setOnAction` 方法来注册该事件处理器：\n\n```java\n // 此事件处理器用于 ActionEvent，\n    // 它由 MenuItem\
  \ 的快捷键调用\n    EventHandler<ActionEvent> toolSelector =\n        new EventHandler<ActionEvent>()\
  \ {\n      @Override\n      public void handle(ActionEvent e) {\n        RadioMenuItem\
  \ mi = (RadioMenuItem)e.getSource();\n        // 当用户按下定义的键组合时，\n        // 会触发 ActionEvent，\n\
  \        // 我们必须显式地设置为 true\n        mi.setSelected(true);\n      }\n    };\n\n\
  \    // 创建单选菜单项\n    RadioMenuItem drawLine = new RadioMenuItem(\"Line Drawer\"\
  );\n    drawLine.setAccelerator(\n        new KeyCharacterCombination(\"L\", KeyCombination.CONTROL_DOWN));\n\
  \    drawLine.setOnAction(toolSelector);\n```\n\n### 8.1.5 定义枚举类型 `DrawTools`\n\n\
  \n\n\n\n我们定义了一个枚举类型 `DrawTools`，用于指定表示当前可用形状绘制器的常量。它们是：`LineDrawer`、`PolylineDrawer`、`PolygonDrawer`、`PathDrawer`、`BezierCurveDrawer`、`RectangleDrawer`、`CircleDrawer`、`EllipseDrawer`\
  \ 和 `ShapeMover`。关于这些预定义形状绘制器的详细描述，请参考前面的章节。\n\n以下是定义 `enum` 类型 `DrawTools` 的代码：\n\
  \nListing 8-5. 定义 `enum` 类型 `DrawTools`：\n\n```\nenum DrawTools {\n    LINE_DRAWER,\n\
  \    POLYLINE_DRAWER,\n    POLYGON_DRAWER,\n    PATH_DRAWER,\n    BEZIER_CURVE_DRAWER,\n\
  \    RECTANGLE_DRAWER,\n    CIRCLE_DRAWER,\n    ELLIPSE_DRAWER,\n    SHAPE_MOVER,\n\
  \    NO_TOOL\n} \n```\n\n`DrawTools` 中的值被用作单选菜单项的 `id`；见下面的代码片段：\n\nListing 8-6.\
  \ 为 `RadioMenuItem` 设置 `id`：\n\n```\n // 创建单选菜单项\n    RadioMenuItem drawLine = new\
  \ RadioMenuItem(\"Line Drawer\");\n    drawLine.setId(DrawTools.LINE_DRAWER.name());\n\
  ```\n\n### 8.1.6 `JFXDrawTools` 类骨架的完整源代码\n\n这里是 `JFXDrawTools` 类骨架的完整源代码。\n\nListing\
