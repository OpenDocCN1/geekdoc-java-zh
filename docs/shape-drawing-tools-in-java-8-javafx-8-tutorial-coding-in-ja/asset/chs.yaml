  \ `Line` 对象，还能处理 `Polyline`、`Polygon`、`Path`、`circle` 等。\n\n### 1.1.1 在 `BorderPane`\
  \ 的中心添加 `Pane` 作为绘板\n\n在卷 Ⅰ：开发图像查看组件第 1 章 基础图像查看器第 1.1 节 创建作为 Application 子类的 ImageViewer\
  \ 类中，我们已经展示了 `BorderPane` 类的功能；它是内置布局面板之一，位于 `javafx.scene.layout` 包中，是 `javafx.scene.layout.Pane`\
  \ 类的直接子类。\n\n与 `ImageViewer` 应用程序类似，`LineDrawer` 应用程序采用 `BorderPane` 作为场景图的根节点，并将\
  \ `Pane` 放置在 `BorderPane` 的中心作为草图绘板。\n\n以下是 `Node` 类的部分后代树，展示了 `Parent` 与 `Pane`、`Group`\
  \ 以及容器的关系。\n\n图 1-2. `Node` 类部分后代树图，显示了 `Pane` 的位置\n\n![](img/00004.jpeg \"class_tree.png\"\
  )\n\n`Pane` 类是 `Region` 的直接子类，位于 `javafx.scene.layout` 包，是 JavaFX 内置布局面板的基类。首先，我们将探索为什么采用\
  \ `Pane` 类作为我们的绘板。\n\n为在鼠标指向的位置渲染对象开发交互式绘图工具需要一个满足以下两个基本条件的容器：\n\n1. 它不会自动布局其子元素。\n\
  2. 它提供 `getChildren()` 方法以添加所需数量的节点。\n\n`Group` 类是 `javafx.scene.Parent` 的直接子类，位于\
  \ `javafx.scene` 包，也满足这两个条件；然而，将 `Group` 作为绘板是不可行的。`Group` 无法由父容器调整大小，其边界完全由其内容的边界决定。当应用程序启动时，草图容器是空的。而一个没有任何子节点的\
  \ `Group` 在场景中不占用任何空间，因此无法接收事件。\n\n空的 `Pane` 不会产生像空 `Group` 那样的问题。\n\n### 1.2 注册事件处理器来处理鼠标事件和按键事件\n\
  \n采用了一种有效且简单的方法来画线，即在绘板 `Pane` 上拖动鼠标。以下是其工作原理预览：\n\n当按下鼠标时，我们获取事件的 x 位置和 y 位置，这将成为要创建线条的起点。当紧随鼠标按下事件的第一个鼠标拖动事件发生时，会创建一个临时的\
  \ `Line` 对象，并将之前获取的位置设置为线条的起点。当鼠标在绘板上拖动时，线条的终点将根据属性和绑定机制，根据最新的鼠标拖动位置不断调整。当发生鼠标释放事件以结束鼠标拖动事件序列时，该临时线条的绘制完成完成。\n\
  \n重复 MOUSE_PRESSED—MOUSE_DRAGGED—MOUSE_RELEASED 事件循环，直到你对这条线条的渲染满意为止。按下 ESCAPE 键取消此线条，按下\
  \ ENTER 键确定此线条。一旦按下 ENTER 键，该线条将永久存在于绘板上，下一次 MOUSE_PRESSED 事件将开始画一条新线条。\n\n在草图绘制应用程序的最终版本\
  \ `JFXDrawTools` 中，我们将实现 `Delete` 操作来擦除选定的现有草图，并实现 `Show Properties` 操作来更新草图的可用属性。\n\
  \n### 1.2.1 使用便利方法注册事件处理器\n\n以下 `Node` 类提供的便利方法用于用于注册上述事件的事件处理器：\n\n*   `public\
  \ final void setOnMousePressed(EventHandler<? super MouseEvent> value`)`\n\n\n\n\
  \n\n设置 `Node` 类中定义的 `OnMousePressed` 属性值，提供 `handle` 方法的实现，该方法在鼠标在此节点上按下时被调用。\n\n\
  ```java\npublic final void setOnMouseDragged(EventHandler<? super MouseEvent> value`)\n\
  ```\n\n设置 `Node` 类中定义的 `OnMouseDragged` 属性值，提供 `handle` 方法的实现，该方法在鼠标在此节点上拖动时被调用。\n\
  \n```java\npublic final void setOnMouseReleased(EventHandler<? super MouseEvent>\
  \ value`)\n```\n\n设置 `Node` 类中定义的 `OnMouseReleasedReleased` 属性值，提供 `handle` 方法的实现，该方法在鼠标在此节点上释放时被调用。\n\
  \n```java\npublic final void setOnKeyPressed(EventHandler<? super KeyEvent> value`)\n\
