  \ 类\n\n## 7.3 增强 `DrawPane` 类\n\n## 7.4 总结\n\n## 7.1 增强 `ShapeDrawer` 类\n\n`ShapeDrawer`\
  \ 是一个抽象类，是所有通过在绘板上移动鼠标绘制形状的绘制器的基类。它提供了基本方法来方便形状绘制应用程序的。在本节中，我们将定义额外的属性。\n\n### 7.1.1\
  \ 定义形状渲染属性\n\n`ShapeDrawer` 类需要更多用于形状渲染的属性：\n\n导入语句：\n\n```\nimport javafx.beans.property.DoubleProperty;\n\
  import javafx.beans.property.SimpleDoubleProperty;\nimport javafx.beans.property.ObjectProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.StrokeType;\n```\n\n列表 7-1. 在 `ShapeDrawer` 类中定义形状渲染属性：\n\
  \n```\n public ObjectProperty<Color> fillColor = \n    new SimpleObjectProperty<>(Color.WHITE);\
  \ \n  public ObjectProperty<Color> strokeColor = \n    new SimpleObjectProperty<>(Color.GREY);\
  \ \n\n  // 更多用于渲染形状的属性\n  public DoubleProperty strokeWidth = new SimpleDoubleProperty(1);\
  \  \n  public ObjectProperty<StrokeType> strokeType = \n      new SimpleObjectProperty<>(StrokeType.CENTERED);\
  \ //默认\n```\n\n你将在后续章节中看到有效用法，届时我们将为 `ShapeDrawer` 的每个子类分配不同的填充颜色和描边颜色。\n\n### 7.1.2\
  \ 定义布尔属性 `polySegment`\n\n对于折线绘制器、多边形绘制器、路径绘制器和贝塞尔曲线绘制器，我们需要一个布尔属性来将它们与线条绘制器、矩形绘制器、圆形绘制器和椭圆绘制器区分开。在我们最初的方法中，需要用户按下\
  \ `Enter` 键来完成形状。为了简化用户界面，增强方法忽略了完成矩形、圆形或椭圆形状的 `Enter` 键，也就是说在 `MOUSE_PRESSED-MOUSE_DRAGGED-MOUSE_RELEASED`\
  \ 事件循环后，形状将留在绘板上，除非按了 `Esc` 键。而对于折线、多边形或路径等包含多个段的形状，则需要按下 `Enter` 键来完成。\n\n导入语句：\n\
  \n```\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
  ```\n\n列表 7-2. 在 `ShapeDrawer` 类中定义 `polySegment` 属性：\n\n```\n // 此属性用于绘制折线、多边形、路径等多段形状\n\
  \  public BooleanProperty polySegment = new SimpleBooleanProperty();\n```\n\n`polySegment`\
  \ 类型为 `BooleanProperty`，指定要绘制的形状是否由多个段组成；默认值为 `false`。它的值会在 `DrawPane` 类默认构造函数中注册的\
  \ `MouseDragged` 事件的 `handle` 方法内部检查。\n\n### 7.1.3 增强型 `ShapeDrawer` 类的完整源代码\n\n\
  增强型 `ShapeDrawer` 类的完整源代码如下：\n\n列表 7-3. 增强型 `ShapeDrawer` 类：\n\n\n\n\n\n```java\n\
  package drawtool;\n\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
  import javafx.beans.property.DoubleProperty;\nimport javafx.beans.property.SimpleDoubleProperty;\n\
  import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.shape.Shape;\nimport javafx.scene.shape.StrokeType;\n\
  \n/**\n * File Name: ShapeDrawer.java\n * (in directory: DrawTool1.1/src/example1/drawtool/)\n\
  \ * ShapeDrawer 是所有在绘板上绘制形状的绘制器的基类。\n * 它提供了基本方法以促进形状绘制应用程序的。\n * 形状是通过鼠标拖动事件在绘板上绘制的。\
  \ \n *\n * shapeClass 是一个属性，用于指定在绘板上绘制的形状。\n * 如果未设置值，当绘板上发生鼠标拖动事件时，将不会绘制任何形状。\n\
  \ * 请以下两个示例：\n *   LineDrawer 是 ShapeDrawer 的子类，shapeClass 的值在 LineDrawer 的构造函数\n\
  \ *   中设置为 Line.class。\n *   ShapeMover 是 ShapeDrawer 的子类，shapeClass 的值设置为 null，\n\
  \ *   因此，当鼠标拖动时，将不会绘制任何形状。\n *   ShapeMover 用于在上方拖动鼠标时移动现有的形状。\n *\n * shape 是一个临时存储在绘板上绘制的形状的属性。\n\
  \ *\n * strokeColor/fillColor 是属性，用于存储在绘板上绘制的形状的\n *   描边/填充属性的值。 \n *\n * 抽象方法必须由\
  \ ShapeDrawer 的子类实现：\n *   public abstract void onMouseDragStarted(DrawPane drawPane)\n\
  \ *   public abstract void onMouseDragFinished(DrawPane drawPane)\n *\n * 以下是不执行操作的方法，它们可以被\
  \ ShapeDrawer 的子类重写：\n *   public void handleMouseClicked(DrawPane drawPane) {}\n\
  \ *   public void handleDeleteKeyPressed(DrawPane drawPane) {}\n *   public void\
  \ clean(DrawPane drawPane) {}\n *\n * @author: Shufen Kuo\n */\npublic abstract\
  \ class ShapeDrawer {\n\n  /* Declare variables */\n\n  public ObjectProperty<Class<?\
  \ extends Shape>> shapeClass =\n    new SimpleObjectProperty<>();\n  public ObjectProperty<Shape>\
  \ shape = new SimpleObjectProperty<>();\n\n  // 渲染形状的基本属性\n  public ObjectProperty<Color>\
  \ fillColor = \n    new SimpleObjectProperty<>(Color.WHITE); \n  public ObjectProperty<Color>\
  \ strokeColor = \n    new SimpleObjectProperty<>(Color.GREY); \n\n  // 用于渲染形状的属性\n\
  \  public DoubleProperty strokeWidth = new SimpleDoubleProperty(1);  \n  public\
  \ ObjectProperty<StrokeType> strokeType = \n      new SimpleObjectProperty<>(StrokeType.CENTERED);\
  \ // 默认\n\n  // 此属性用于绘制多边段，如折线、多边形、路径\n  public BooleanProperty polySegment = new\
  \ SimpleBooleanProperty();\n\n  /* Define abstract methods */\n\n  public abstract\
  \ void onMouseDragStarted(DrawPane drawPane);\n  public abstract void onMouseDragFinished(DrawPane\
  \ drawPane);\n\n  public ShapeDrawer(Class<? extends Shape> sc) {\n    shapeClass.set(sc);\n\
  \  }\n\n  /* Define methods that do nothing */\n\n  public void handleMouseClicked(DrawPane\
  \ drawPane) {}\n  public void handleDeleteKeyPressed(DrawPane drawPane) {}\n  public\
  \ void clean(DrawPane drawPane) {}\n\n  /* Utilities to access properties */\n\n\
  \  public Class<? extends Shape> getShapeClass() {\n    return shapeClass.get();\n\
  \  }\n\n  public void setShapeClass(Class<? extends Shape> value) {\n    shapeClass.set(value);\n\
  \  }\n\n  public ObjectProperty<Class<? extends Shape>> shapeClassProperty() {\n\
  \    return shapeClass;\n  }\n\n  public Shape getShape() {\n    return shape.get();\n\
  \  }\n\n  public void setShape(Shape value) {\n    shape.set(value);\n  }\n\n  public\
  \ ObjectProperty<Shape> shapeProperty() {\n    return shape;\n  }\n\n  public boolean\
  \ isPolySegment() {\n    return polySegment.get();\n  }\n\n  public void setPolySegment(boolean\
  \ value) {\n    polySegment.set(value);\n  }\n\n  public BooleanProperty polySegmentProperty()\
  \ {\n    return polySegment;\n  }\n\n  public Color getStrokeColor() {\n    return\
  \ strokeColor.get();\n  }\n\n  public void setStrokeColor(Color value) {\n    strokeColor.set(value);\n\
  \  }\n\n  public ObjectProperty<Color> strokeColorProperty() {\n    return strokeColor;\n\
  \  }\n\n  public Color getFillColor() {\n    return fillColor.get();\n  }\n\n  public\
  \ void setFillColor(Color value) {\n    fillColor.set(value);\n  }\n\n  public ObjectProperty<Color>\
  \ fillColorProperty() {\n    return fillColor;\n  }\n\n  public void setStrokeType(StrokeType\
  \ value) {\n    strokeType.set(value);\n  }\n\n  public StrokeType getStrokeType()\
  \ {\n    return strokeType.get();\n  }\n\n  public ObjectProperty<StrokeType> strokeTypeProperty()\
  \ {\n    return strokeType;\n  }\n\n  public void setStrokeWidth(double value) {\n\
  \    strokeWidth.set(value);\n  }\n\n  public double getStrokeWidth() {\n    return\
  \ strokeWidth.get();\n  }\n\n  public DoubleProperty strokeWidthProperty() {\n \
  \   return strokeWidth;\n  }\n\n}\n```\n\n## 7.2 创建 `ShapeDrawer` 的子类\n\n在本节中，我们将实现类——`LineDrawer`、`PolylineDrawer`、`PolygonDrawer`、`PathDrawer`、`BezierCurveDrawer`、`RectangleDrawer`、`CircleDrawer`、`EllipseDrawer`\
  \ 和 `ShapeMover`，它们继承自 `ShapeDrawer` 并位于 `drawtool.drawer` 包。\n\n在本书后面的章节中，我们将利用它们来构建\
  \ `JFXDrawTools` 应用程序，这是一个全面的草图工具，用于在绘板上动态绘制各种形状。\n\n### 7.2.1 实现 `LineDrawer` 类\n\
  \n`LineDrawer` 类通过实现两个抽象方法来扩展 `ShapeDrawer`：\n\n```java\npublic abstract void onMouseDragStarted(DrawPane\
  \ drawPane)\npublic abstract void onMouseDragFinished(DrawPane drawPane)\n```\n\n\
  关于 `Line` 对象的详细描述，请参考 第 1 章线条绘制器--开发线条绘制器 V1.0。\n\n以下是 `LineDrawer` 的完整源代码。\n\n\
  列表 7-4. 实现 `LineDrawer` 类，它是 `ShapeDrawer` 的直接子类：\n\n```java\npackage drawtool.drawer;\n\
  \nimport javafx.scene.paint.Color;\nimport javafx.scene.shape.Line;\n\nimport drawtool.*;\n\
  \n/**\n * File Name: LineDrawer.java\n * (in directory: DrawTool1.1/src/example1/drawtool/drawer)\n\
  \ *\n * @author: Shufen Kuo\n */\npublic class LineDrawer extends ShapeDrawer {\n\
  \n  public LineDrawer() {\n    super(Line.class);\n    setFillColor(null);\n   \
  \ setStrokeColor(Color.ORANGERED);\n  }\n\n  @Override\n  public void onMouseDragStarted(DrawPane\
  \ drawPane) {\n    Line line = (Line)getShape();\n    // 设置属性 startX, startY 的值\n\
  \    line.setStartX(drawPane.getStartX());\n    line.setStartY(drawPane.getStartY());\n\
  \    // 绑定属性 endX, endY\n    line.endXProperty().bind(\n      drawPane.startXProperty().add(drawPane.dragXProperty()));\n\
  \    line.endYProperty().bind(\n      drawPane.startYProperty().add(drawPane.dragYProperty()));\n\
  \  }\n\n  @Override\n  public void onMouseDragFinished(DrawPane drawPane) {\n  \
  \  Line line = (Line)getShape();\n    // 此处必须验证形状不为空\n    // 如果按了 Enter 键或 Esc 键，shape\
  \ 将设置为 null\n    if (line != null) {\n      // 解除属性 endX, endY 的绑定\n      line.endXProperty().unbind();\n\
  \      line.endYProperty().unbind();\n    }\n  }\n\n}\n```\n\n### 7.2.1.1 创建线条绘制应用程序\n\
