  \ | 步骤 3 释放鼠标 |\n\n### 5.1.2 注册鼠标拖拽事件处理器\n\n在 `MOUSE_DRAGGED` 事件处理器内部，如果不存在 `Path`\
  \ 对象，则创建一个，并调用 `onMouseDragStarted` 方法，该方法承担了后节描述的主要任务。\n\n回一下，`startX` 和 `startY`\
  \ 是存储鼠标按下事件位置的属性，它们的值在鼠标按下事件处理器内部被设置。`translateX` 和 `translateY` 是存储平移距离的属性，从鼠标按下的位置到鼠标拖拽的位置计算得出。\n\
  \n以下是为画板注册 `MOUSE_DRAGGED` 事件处理器的源代码。\n\n列表 5-2. 注册 `MOUSE_DRAGGED` 事件处理器，创建 `Path`\
  \ 实例并调用 `onMouseDragStarted` 方法：\n\n\n\n\n\n```\n drawPane.setOnMouseDragged(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 计算鼠标位置到起始位置的距离\n        double x2 = me.getX();\n        double\
  \ y2 = me.getY();\n        translateX.set(x2 - startX.get());\n        translateY.set(y2\
  \ - startY.get()); \n        if (!dragged) {\n          // 仅执行此一次\n          if\
  \ (getShape() == null)\t{\n            Shape tmpShape = new Path();\n          \
  \  shape.set(tmpShape);\n          } \n          dragged = true;\n          onMouseDragStarted(drawPane);\n\
  \        }\n      }\n    });\n```\n\n### 5.1.3 注册鼠标释放事件的事件处理器\n\n在 `MOUSE_RELEASED`\
  \ 事件的事件处理器内部，我们检查该 `MOUSE_RELEASED` 事件之前是否先过任何 `MOUSE_DRAGGED` 事件。如果没有，则我们认为这是一个真正的鼠标点击事件，并调用定义用于处理鼠标点击事件的方法\
  \ `handleMouseClicked(Pane pane)`。否则，我们认为这是一系列鼠标拖拽事件的结束，调用 `onMouseDragFinished(Pane\
  \ pane)` 方法，这与之前章节中开发的其他形状绘制器的方法相同。\n\n请记住，布尔变量 `dragged` 在第一次发生拖拽事件时，在 `MOUSE_DRAGGED`\
  \ 事件的事件处理器内部被设置为 `true`。由于拖拽事件已结束，它在 `MOUSE_RELEASED` 事件的事件处理器中被重置为 `false`。\n\n\
  列表 5-3 注册 `MOUSE_RELEASED` 事件的事件处理器，如果鼠标释放前没有经过鼠标拖拽，则调用 `handleMouseClicked` 方法，否则调用\
  \ `onMouseDragFinished` 方法：\n\n```\n drawPane.setOnMouseReleased(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        if (dragged)\
  \ {\n          dragged = false;\n          // 这是鼠标拖拽事件的结束\n          onMouseDragFinished(drawPane);\n\
  \        } else {\n          // 这是一个真正的鼠标点击事件\n          handleMouseClicked(drawPane);\n\
  \        }\n\n      }\n    });\n```\n\n## 5.2 实现 `handleMouseClicked(Pane pane)`\
  \ 方法\n\n当检测到真正的鼠标点击事件时，从 `MOUSE_RELEASED` 事件的事件处理器调用 `handleMouseClicked(Pane pane)`\
  \ 方法，该方法执行以下任务：\n\n*   如果 `Path` 实例不存在，则创建一个。\n*   检查这是否是一个新路径的开始。如果是，创建一个 `MoveTo`\
  \ 实例（它是 `PathElement` 的直接子类），将其 `x`、`y` 属性设置为鼠标点击的位置，并将其添加到路径。\n*   否则，检查现有路径的最后一个元素是否为\
  \ `MoveTo` 类型。如果是，更新其 `x`、`y` 属性。如果不是，创建一个 `MoveTo`，将其 `x`、`y` 属性设置为鼠标点击的位置，并将其添加到路径。\n\
  \n以下是 `handleMouseClicked(Pane pane)` 方法的源代码：\n\n导入语句：\n\n```\nimport javafx.collections.ObservableList;\n\
  import javafx.scene.shape.MoveTo;\nimport javafx.scene.shape.Path;\nimport javafx.scene.shape.PathElement;\n\
  ```\n\n列表 5-4 实现 `handleMouseClicked(Pane pane)` 方法，从 `MOUSE_RELEASED` 事件的事件处理器调用：\n\
  \n```\n void handleMouseClicked(Pane pane) {\n    // 如果路径不存在，则创建一个新的 Path\n    if\
  \ (getShape() == null)\t{\n      Shape tmpShape = new Path();\n      shape.set(tmpShape);\n\
  \    }\n    Path path = (Path) getShape();\n    // 如果这是路径的开始，添加一个 MoveTo 元素\n  \
  \  // 否则，获取最后一个元素\n    // 如果最后一个元素是 MoveTo，更新其 x, y 属性。\n    // 如果最后一个元素不是 MoveTo，在列表中添加一个\
  \ MoveTo\n    ObservableList<PathElement> list = path.getElements();\n    if (list.size()\
  \ > 0) {\n      // 这不是新路径的开始。\n      // 获取最后一个元素\n      PathElement element = list.get(list.size()\
  \ - 1);\n      if (element instanceof MoveTo) {\n        // 更新其 x, y\n        MoveTo\
  \ moveTo = (MoveTo) element;\n        moveTo.setX(startX.get());\n        moveTo.setY(startY.get());\n\
  \        setStartPoint(startX.get(), startY.get());\n      } else {\n        //\
  \ 不是 MoveTo，向列表添加 MoveTo\n        addMoveTo(pane, path);        \n      }\n    }\
  \ else {\n      // 这是一个新路径，必须创建一个 MoveTo 来开始路径\n      addMoveTo(pane, path);   \
  \     \n    }\n  }\n```\n\n### 5.2.1 向 `Path` 中添加 `MoveTo` 元素\n\n我们定义了一个 `addMoveTo(Pane\
  \ pane, Path path)` 方法来执行这些任务：\n\n1.  创建一个 `MoveTo` 实例并将其添加到指定的路径中。\n2.  将 `MoveTo`\
  \ 的位置设置为起始点的位置。\n3.  在指定的窗格上画一个圆来表示起始点。\n\n除了从 `handleMouseClicked(Pane pane)` 调用外，`addMoveTo`\
  \ 方法还可能从 `onMouseDragStarted` 调用，参见后文章节。以下是 `addMoveTo` 的实现：\n\n列表 5-5 创建 `MoveTo`\
  \ 并添加到指定的路径：\n\n```\n void addMoveTo(Pane pane, Path path) {\n    MoveTo moveTo\
  \ = new MoveTo();\n    moveTo.setX(startX.get());\n    moveTo.setY(startY.get());\n\
  \    path.getElements().add(moveTo);\n  }\n```\n\n### 5.2.2 绘制表示二次曲线点的圆\n\n为了区分构造二次曲线的点，我们用不同的颜色绘制圆：\n\
  \n1.  起始点，使用红色。\n2.  控制点，使用蓝色。\n3.  终点，使用绿色。\n\n以下是初始化这些内容的源代码：\n\n导入语句：\n\n```\n\
  import javafx.scene.shape.Circle;\nimport javafx.scene.paint.Color;\n```\n\n列表 5-6\
  \ 创建圆并初始化颜色：\n\n```\n // 用于绘制贝塞尔曲线的点\n  Circle startPoint = new Circle(2.5f, Color.TRANSPNT);\n\
  \  Circle endPoint = new Circle(2.5f, Color.TRANSPNT);\n  Circle controlPoint =\
  \ new Circle(3.5f, Color.TRANSPNT);\n  {\n    startPoint.setStroke(Color.RED);\n\
  \    endPoint.setStroke(Color.GREEN);\n    controlPoint.setStroke(Color.BLUE);\n\
  \  }\n```\n\n处理这些圆的工具方法定义如下：\n\n列表 5-7 显示点、隐藏点的工具方法：\n\n```\n void setStartPoint(double\
  \ x, double y) {\n    startPoint.centerX(x);\n    startPoint.setCenterY(y);\n  }\n\
  \n  void setEndPoint(double x, double y) {\n    endPoint.centerX(x);\n    endPoint.setCenterY(y);\n\
  \  }\n\n  void showStartPoint(Pane pane, double x, double y) {\n    if (!pane.getChildren().contains(startPoint))\n\
  \      pane.getChildren().add(startPoint);\n    setStartPoint(x, y);\n  }\n\n  void\
  \ showEndPoint(Pane pane) {\n    if (!pane.getChildren().contains(endPoint))\n \
  \     pane.getChildren().add(endPoint);\n  }\n\n  void showEndPoint(Pane pane, double\
  \ x, double y) {\n    if (!pane.getChildren().contains(endPoint))\n      pane.getChildren().add(endPoint);\n\
  \    setEndPoint(x, y);\n  }\n\n  void showControlPoint(Pane pane) {\n    if (!pane.getChildren().contains(controlPoint))\n\
  \      pane.getChildren().add(controlPoint);\n  }\n\n  void hideStartPoint(Pane\
  \ pane) {\n    pane.getChildren().remove(startPoint);\n  }\n\n  void hideEndPoint(Pane\
  \ pane) {\n    pane.getChildren().remove(endPoint);\n  }\n\n  void hideControlPoint(Pane\
  \ pane) {\n    pane.getChildren().remove(controlPoint);\n  }\n```\n\n## 5.3 实现 `onMouseDragStarted(Pane\
  \ pane)` 方法\n\n`QuadCurveDrawer V1.0` 的主要任务在 `onMouseDragStarted(Pane pane)` 方法中完成，该方法从\
  \ `MOUSE_DRAGGED` 事件的事件处理器调用。\n\n它执行以下任务：\n\n*   将光标设置为 `Cursor.NONE`:\n\n\n\n\n\
  \n此部分的重点是追踪鼠标拖拽事件位置的控制点。\n\n- 向路径添加一个 `MoveTo` 对象：\n  将此 `MoveTo` 元素的 `x`、`y` 坐标设置为鼠标按下的位置。\n\
  \  只有当路径包含空元素时，才会在此处创建 `MoveTo` 对象。在正常过程中，`MoveTo` 是由鼠标点击事件触发而创建的，请参阅介绍二次贝塞尔曲线和实现\
  \ `handleMouseClicked(Pane pane)` 方法。\n  然而，我们允许初学者通过简单地按下并拖动鼠标来开始新路径，而无需预先触发鼠标点击事件。\n\
  \n- 向路径添加一个渲染效果为直线的 `QuadCurveTo` 对象：\n  将此 `QuadCurveTo` 元素的 `x`、`y` 属性以及 `controlX`、`controlY`\
  \ 属性绑定到鼠标拖拽的位置。\n  如果此拖拽事件发生在新路径的开头，除了添加 `MoveTo` 对象外，还会添加一条直线 `QuadCurveTo`。\n\
  \  如果此拖拽事件未发生在新路径的开头，则只有当鼠标按下的位置（存储在 `startX` 和 `startY` 属性中）位于起点圆圈区域内时，才会创建并将直线\
  \ `QuadCurveTo` 添加到路径中（参阅图 5-3 中的步骤 1）。\n\n- 向路径添加一个常规的 `QuadCurveTo` 对象：\n  将 `x`\
  \ 和 `y` 属性绑定到鼠标按下的位置，并将 `controlX` 和 `controlY` 属性绑定到鼠标拖拽的位置。\n  这是正常情况，我们获取三个不同的点来构造一个\
  \ `QuadCurveTo` 元素。即曲线的终点与起点不重合，且控制点绑定到鼠标拖拽的位置。\n\n以下是 `onMouseDragStarted` 方法的源代码。\n\
  \n导入语句：\n```\nimport javafx.scene.Cursor;\n```\n\n列表 5-8. 实现 `onMouseDragStarted`\
  \ 方法，由 `MOUSE_DRAGGED` 事件处理器调用：\n```\n void onMouseDragStarted(Pane pane) {\n  \
  \  // 隐藏光标\n    pane.setCursor(Cursor.NONE);\n    Path path = (Path)getShape();\n\
  \    ObservableList<PathElement> list = path.getElements();\n    // 检查是否为新路径的开头\n\
  \    if (list.size() == 0) {\n      // 这是一个空元素的的新路径\n      // 添加一个 MoveTo，紧跟一个 QuadCurveTo\n\
  \      // 因为构造曲线需要三个点，\n      // 此处我们只有两个点，\n      // QuadCurveTo 将看起来像一条直线，\n \
  \     // 终点和控制点都在同一个位置。\n      addMoveTo(pane, path);\n      addLineTo(pane, path);\n\
  \    } else {\n      // 这是一个列表中已有元素的现有路径\n      // 验证鼠标按下的位置是否在起点圆区域内\n      if\
  \ (startPoint.contains(startX.get(), startY.get())) {\n        // 这是一个特殊情况，\n  \
  \      // startX, startY 在起点圆区域内，\n        // 我们只能画出像直线的 QuadCurveTo，\n        //\
  \ 终点和控制点都在同一个位置。\n        addLineTo(pane, path);\n      }\telse {\n        // 这是一个正常情况，\n\
  \        // startX, startY 不在起点的范围内\n        // 创建一个常规的 QuadCurveTo\n        addQuadCurveTo(pane,\
  \ path);\n      }\n    }\n  }\n```\n\n### 5.3.1 向 `Path` 添加直线 `QuadCurveTo` 元素\n\
  \n我们定义了一个 `addLineTo(Pane pane, Path path)` 方法，由 `onMouseDragStarted` 方法调用，用于向 `Path`\
  \ 添加一个渲染效果为直线的 `QuadCurveTo` 元素。该方法执行以下任务：\n\n1. 创建 `QuadCurveTo` 实例并将其添加到给定的路径。\n\
  2. 将曲线的终点（由 `x` 和 `y` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n3. 将曲线的控制点（由\
  \ `controlX` 和 `controlY` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n4. 将控制点圆的中心（由\
  \ `centerX` 和 `centerY` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n5. 将终点圆的中心（由\
  \ `centerX` 和 `centerY` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n6. 显示控制点圆和终点圆。\n\
  \n以下是 `addLineTo(Pane pane, Path path)` 方法的源代码：\n\n导入语句：\n```\nimport javafx.beans.binding.DoubleBinding;\n\
  import javafx.scene.shape.QuadCurveTo;\n```\n\n列表 5-9. 实现 `addLineTo` 方法，由 `onMouseDragStarted`\
  \ 方法调用，创建 `QuadCurveTo`，执行必要的绑定，显示控制点圆，显示终点圆：\n```\n void addLineTo(Pane pane, Path\
  \ path) {\n    // 创建一个像直线的 QuadCurveTo\n    QuadCurveTo quadCurveTo = new QuadCurveTo();\n\
  \    path.getElements().add(quadCurveTo);\n    // 创建计算起始位置\n    // 位移距离的 DoubleBinding\n\
  \    DoubleBinding draggedX = startX.add(translateX);\n    DoubleBinding draggedY\
  \ = startY.add(translateY);\n    // 将曲线终点绑定到鼠标拖拽的位置\n    quadCurveTo.xProperty().bind(draggedX);\n\
  \    quadCurveTo.yProperty().bind(draggedY);\n    // 将曲线控制点绑定到鼠标拖拽的位置\n    quadCurveTo.controlXProperty().bind(draggedX);\n\
  \    quadCurveTo.controlYProperty().bind(draggedY);\n    // 处理终点圆：\n    // 终点圆中心绑定到拖拽位置\n\
  \    endPoint.centerXProperty().bind(draggedX);\n    endPoint.centerYProperty().bind(draggedY);\n\
  \    showEndPoint(pane);\n    // 处理控制点圆：\n    // 圆心绑定到拖拽的位置\n    controlPoint.centerXProperty().bind(draggedX);\n\
  \    controlPoint.centerYProperty().bind(draggedY);\n    showControlPoint(pane);\n\
  \  }\n```\n\n### 5.3.2 向 `Path` 添加常规 `QuadCurveTo` 元素\n\n我们定义了一个 `addQuadCurveTo(Pane\
  \ pane, Path path)` 方法，由 `onMouseDragStarted` 方法调用，用于向 `Path` 添加一个常规的 `QuadCurveTo`\
  \ 元素。该方法执行以下任务：\n\n1. 创建 `QuadCurveTo` 实例并将其添加到给定的路径。\n2. 将曲线的终点（由 `x` 和 `y` 属性指定）设置为鼠标按下的位置（由\
  \ `startX` 和 `startY` 属性指定）。\n3. 将终点圆的中心设置在鼠标按下的位置并显示。\n4. 将曲线的控制点（由 `controlX`\
  \ 和 `controlY` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n5. 将控制点圆的中心（由 `centerX`\
  \ 和 `centerY` 属性指定）绑定到一个 `DoubleBinding` 对象，该对象计算起始位置和位移距离的和。\n6. 显示控制点圆，在鼠标拖拽过程中其位置保持变化。\n\
  \n以下是 `addQuadCurveTo(Pane pane, Path path)` 方法的源代码：\n\n列表 5-10. 实现 `addQuadCurveTo`\
  \ 方法，由 `onMouseDragStarted` 方法调用，创建 `QuadCurveTo`，设置 x, y 属性，执行必要的绑定，显示控制点圆，显示终点圆：\n\
  \n\n\n\n\n```\n void addQuadCurveTo(Pane pane, Path path) {\n    QuadCurveTo quadCurveTo\
  \ = new QuadCurveTo();\n    path.getElements().add(quadCurveTo);\n\n    // Set x,\
  \ y properties of curve to mouse pressed location\n    quadCurveTo.setX(startX.get());\n\
  \    quadCurveTo.setY(startY.get());\n    // Show end point circle at mouse pressed\
  \ location \n    showEndPoint(pane, startX.get(), startY.get());\n\n    // Create\
  \ a DoubleBinding calculates the sum of\n    // start position and translate distance\n\
  \    DoubleBinding draggedX = startX.add(translateX);\n    DoubleBinding draggedY\
  \ = startY.add(translateY);\n\n    // Bind control point of curve to mouse dragged\
  \ location\n    quadCurveTo.controlXProperty().bind(draggedX);\n    quadCurveTo.controlYProperty().bind(draggedY);\n\
  \    // Bind center of control point circle to dragged location\n    controlPoint.centerXProperty().bind(draggedX);\n\
  \    controlPoint.centerYProperty().bind(draggedY);\n    // Show control point circle\n\
  \    showControlPoint(pane);\n  }\n```\n\n## 5.4 实现 `OnMouseDragFinished(Pane pane*)`\
  \ 方法\n\n`OnMouseDragFinished(Pane pane*)` 方法由 `MOUSE_RELEASED` 事件的事件处理器调用，用于完成路径中一个\
  \ `QuadCurveTo` 元素的绘制。\n\n该方法完成了以下任务：\n\n1.  恢复默认鼠标光标，该光标在鼠标拖动事件开始时被设置为 `none`。\n\
  \n2.  获取此路径的 `PathElement` 列表，从列表中提取最后一个元素，并对最后一个元素执行以下任务（该元素必须是 `QuadCurveTo` 实例）：\n\
  \n    *   执行必要的解绑定。\n\n        如果曲线是通过 `AddLineTo` 方法创建的，则它是一个直线形式的 `QuadCurveTo`\
  \ 元素，与控制点和终点相关的属性需要解绑定。如果曲线是通过 `AddQuadCurveTo` 方法创建的，则它是一个普通的 `QuadCurveTo` 元素，只有与控制点相关的属性需要解绑定。\n\
  \n    *   隐藏终点圆圈。\n\n    *   隐藏控制点圆圈。\n\n    *   将起点圆圈移动到此曲线的终点位置。\n\n`MOUSE_DRAGGED`\
  \ 事件紧随 `MOUSE_RELEASED` 事件完成了 `Path` 中一个 `PathElement` 的绘制。\n\n以下是 `OnMouseDragFinished(Pane\
  \ pane*)` 方法的源代码：\n\n列表 5-11. 实现 `onMouseDragFinished` 方法，该方法由 `MOUSE_RELEASED`\
  \ 事件的事件处理器调用：\n\n```\n void onMouseDragFinished(Pane pane) {\n    // 恢复光标\n    pane.setCursor(Cursor.DEFAULT);\n\
  \    Path path = (Path)getShape();\n    // 此处必须验证 shape 是否为空\n    // 如果按了 Enter\
  \ 键或 Esc 键，shape 设置为 null\n    if (path != null) {    \n      ObservableList<PathElement>\
  \ list = path.getElements();\n      // 列表至少包含 2 个由 addLineTo\n      // 或 addQuadCurveTo\
  \ 方法创建的元素，\n      // 这里的检查是多余的。\n      if (list.size() > 0) {\n        PathElement\
  \ element = list.get(list.size() - 1);\n        // 元素必须是 QuadCurveTo\n        QuadCurveTo\
  \ quadCurveTo = (QuadCurveTo) element;\n        if (quadCurveTo.xProperty().isBound())\
  \ {          \n          quadCurveTo.xProperty().unbind();\n          quadCurveTo.yProperty().unbind();\n\
  \        }\n        if (quadCurveTo.controlXProperty().isBound()) {\n          quadCurveTo.controlXProperty().unbind();\n\
  \          quadCurveTo.controlYProperty().unbind();\n        }\n        // 处理终点圆圈\n\
  \        if (endPoint.centerXProperty().isBound()) {          \n          endPoint.centerXProperty().unbind();\n\
  \          endPoint.centerYProperty().unbind();\n        }\n        hideEndPoint(pane);\n\
  \        // 处理控制点圆圈\n        if (controlPoint.centerXProperty().isBound()) {\n \
  \         controlPoint.centerXProperty().unbind();\n          controlPoint.centerYProperty().unbind();\n\
  \        }\n        hideControlPoint(pane);\n        // 处理起点圆圈：\n        // 此元素的终点现在变为\n\
  \        // 下一个新元素的起点。\n        setStartPoint(quadCurveTo.getX(), quadCurveTo.getY());\n\
  \      }\n    }\n  }\n```\n\n## 5.5 注册按键按下事件句处理器\n\n回顾之前章节中开发的其他形状绘制模块的操作：按下 `Enter`\
  \ 键完成草图，按下 `Esc` 键取消草图。`Bezier Curve Drawer` 模块也是如此。这些任务在 `KEY_PRESSED` 事件的事件处理器内部完成。除了处理\
  \ `Enter` 键和 `Esc` 键外，`Bezier Curve Drawer` 模块还处理额外的按键：`Delete` 键按下事件。\n\n很多时候，用户对刚刚完成的曲线不满意，但按下\
  \ `Esc` 键取消整个路径又太极端了。我们提供了 `Delete` 键的功能，它不是删除整个路径，而是删除路径中的最后一个元素。重复击 `Delete` 键将逐个删除元素，直到路径不再包含元素。然而，你无法从按下\
  \ `Enter` 键后立即确定的路径中删除任何元素。\n\n以下是注册 `KEY_PRESSED` 事件处理器的源代码：\n\n列表 5-10. 导入语句：\n\
  \n```\nimport javafx.scene.input.KeyCode;\nimport javafx.scene.input.KeyEvent;\n\
  ```\n\n列表 5-11. 注册 `KEY_PRESSED` 事件句处理器，处理 `ENTER`、`ESCAPE` 和 `DELETE` 代码：\n\n```\n\
  \ drawPane.setOnKeyPressed(new EventHandler<KeyEvent>() {\n      @Override\n   \
  \   public void handle(KeyEvent ke) {\n        KeyCode kc = ke.getCode();\n    \
  \    switch (kc) {\n          case ENTER : \n            // 按下 Enter 键完成形状\n   \
  \         // 必须调用完成方法以处理解绑定\n            if (getShape() != null) {\n           \
  \   if (dragged)\n                onMouseDragFinished(drawPane);\n             \
  \ hideStartPoint(drawPane);\n              setShape(null);  // 完成形状\n          \
  \  }\n            break;\n          case ESCAPE:\n            // 按下 Esc 键清除形状\n\
  \            Shape s = getShape();\n            if (s != null) {\n             \
  \ if (dragged)\n                onMouseDragFinished(drawPane);\n              hideStartPoint(drawPane);\n\
  \              drawPane.getChildren().remove(s);\n              setShape(null);\
  \  // 清形状\n            }\n            break;\n          case DELETE:\n         \
  \   // 按下 Delete 键删除最后一个元素\n            if (getShape() != null && !dragged) {\n\
  \              // 如果在拖动过程中，则不允许删除操作\n              // 即如果在拖动时按下 Delete 键，\n    \
  \          // 则什么都不会发生。\n              deleteLastPathElement(drawPane, (Path)getShape());\n\
  \            }\n            break;\n        }       \n      }\n    });\n```\n\n\
  ### 5.5.1 实现 `deleteLastPathElement(Pane pane*, Path path*)` 方法\n\n`deleteLastPathElement(Pane\
  \ pane*, Path path*)` 方法删除给定路径的最后一个元素，由按下 `Delete` 键时的事件处理器调用。\n\n除了从 `PathElement`\
  \ 列表中删除最后一个元素外，我们还需要更新代表起点的圆的位置。删除最后一个元素后，如果列表为空，只需隐藏起点圆圈；否则，更新圆圈的位置。\n\n\n\n\n\n\
  ### 列表 5-13. 实现 `deleteLastPathElement` 方法，从给定的路径获取 `PathElement` 列表，从列表中移除最后一个元素，并更新起始点圆的状态：\n\
  \n```\n void deleteLastPathElement(Pane pane, Path path) {\n    ObservableList<PathElement>\
  \ list = path.getElements();\n    if (list.size() > 0) {\n      list.remove(list.get(list.size()\
  \ - 1));\n      // 如果结果列表为空，\n      // 隐藏起始点的圆\n      if (list.size() == 0) {\n\
  \        hideStartPoint(pane);\n      }\telse {\n        PathElement element = list.get(list.size()\
  \ - 1);\n        if (element instanceof MoveTo) {\n          // 更新起始点圆的中心坐标 \n \
  \         MoveTo moveTo = (MoveTo) element;\n          setStartPoint(moveTo.getX(),\
  \ moveTo.getY());\n        } else {\n          // 它必须是一个 QuadCurveTo\n         \
  \ // 更新起始点圆的中心坐标 \n          QuadCurveTo quadCurveTo = (QuadCurveTo) element;\n\
  \          setStartPoint(quadCurveTo.getX(), quadCurveTo.getY());\n        }\n \
  \     }\n    }\n  }\n```\n\n### 5.6 `BezierCurverDrawer` 类的完整源代码\n\n这里是完整的源代码。与上一章节中的\
  \ `PathDrawer` 类相比，主要区别已用**粗体**显示：\n\n#### 列表 5-14. 创建继承 `Application` 类的 `BezierCurveDrawer`\
  \ 类，重写 `start` 方法，创建 `BorderPane` 作为场景的根节点，并将 `Pane` 放置在 `BorderPane` 的中心作为画板：\n\
  \n\n\n\n\n```java\npackage drawtool;\n\nimport javafx.application.Application;\n\
  import javafx.beans.binding.DoubleBinding;\nimport javafx.beans.property.DoubleProperty;\n\
  import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleDoubleProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\nimport javafx.collections.ObservableList;\n\
  import javafx.event.EventHandler;\nimport javafx.event.EventType;\nimport javafx.scene.Cursor;\n\
  import javafx.scene.input.KeyCode;\nimport javafx.scene.input.KeyEvent;\nimport\
  \ javafx.scene.input.MouseEvent;\nimport javafx.scene.layout.BorderPane;\nimport\
  \ javafx.scene.layout.Pane;\nimport javafx.scene.paint.Color;\nimport javafx.scene.shape.Circle;\n\
  import javafx.scene.shape.MoveTo;\nimport javafx.scene.shape.Path;\nimport javafx.scene.shape.PathElement;\n\
  import javafx.scene.shape.QuadCurveTo;\nimport javafx.scene.shape.Shape;\nimport\
  \ javafx.scene.Scene;\nimport javafx.stage.Stage;\n\n/**\n * 文件名: BezierCurveDrawer.java\n\
  \ * (目录: QuadCurveDrawer1.0/src/example1/drawtool/)\n * 此 JavaFX 应用程序是一个交互式绘制工具，用于绘制\n\
  \ * 添加到路径对象中的二次贝塞尔曲线\n * 你可以创建任意数量的路径，\n * 当你完成此路径的所有元素时，\n * 按下 ENTER 键完成完成，\n\
  \ * 若要取消此路径，按下 ESCAPE 键\n * 如果你对刚刚完成的曲线不满意，\n * 按下 DELETE 键删除此曲线\n * 然而，在拖拽过程中无法执行\
  \ DELETE 操作\n * DELETE 键会删除你当前正在操作的路径中的最后一个元素\n * 重复按 DELETE 键将逐个删除元素。\n * 一旦按下\
  \ ENTER 键，路径即告完成，\n * 你无法从完成的路径中删除任何元素\n *\n * @author: Shufen Kuo\n */\npublic\
  \ class BezierCurveDrawer extends Application {\n\n  // 在鼠标事件发生时跟踪光标位置\n  // startX,\
  \ startY 存储鼠标按下事件的坐标\n  DoubleProperty startX = new SimpleDoubleProperty();\n  DoubleProperty\
  \ startY = new SimpleDoubleProperty();\n\n  // translateX, translateY 存储从拖拽/移动位置到\
  \ startX, startY 的距离\n  DoubleProperty translateX = new SimpleDoubleProperty();\n\
  \  DoubleProperty translateY = new SimpleDoubleProperty();\n\n  // 用于存储当前绘制的形状 \n\
  \  ObjectProperty<Shape> shape = new SimpleObjectProperty<>();\n\n  // 此变量在鼠标拖拽事件处理程序内部被设置为\
  \ true\n  // 当第一次鼠标拖拽事件发生时，\n  // 在鼠标释放事件发生时重置为 false。\n  boolean dragged = false;\n\
  \n  // 用于显示绘制二次贝塞尔曲线所需的 3 个点的位置\n  Circle startPoint = new Circle(2.5f, Color.TRANSPARENT);\n\
  \  Circle endPoint = new Circle(2.5f, Color.TRANSPARENT);\n  Circle controlPoint\
  \ = new Circle(3.5f, Color.TRANSPARENT);\n  {\n    startPoint.setStroke(Color.RED);\n\
  \    endPoint.setStroke(Color.GREEN);\n    controlPoint.setStroke(Color.BLUE);\n\
  \  }\n\n  @Override\n  public void start(Stage stage) {\n    BorderPane rootPane\
  \ = new BorderPane();\n    // 我们不能在这里使用 Group 对象作为 drawPane，\n    // 当 rootPane\
  \ 大小改变时，group 的大小不会动态调整\n    final Pane drawPane = new Pane();\n    rootPane.setCenter(drawPane);\n\
  \n    drawPane.setOnMousePressed(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        // 获取鼠标起始位置\n        startX.set(me.getX());\n\
  \        startY.set(me.getY());\n      }\n    });\n\n    drawPane.setOnMouseDragged(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 计算鼠标位置到起始位置的距离\n        double x2 = me.getX();\n        double\
  \ y2 = me.getY();\n        translateX.set(x2 - startX.get());\n        translateY.set(y2\
  \ - startY.get()); \n        if (!dragged) {\n          // 仅执行一次\n          if (getShape()\
  \ == null)\t{\n            Shape tmpShape = new Path();\n            shape.set(tmpShape);\n\
  \          } \n          dragged = true;\n          onMouseDragStarted(drawPane);\n\
  \        }\n      }\n    });\n\n    drawPane.setOnMouseReleased(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        if (dragged)\
  \ {\n          dragged = false;\n          // 鼠标拖拽事件的结束\n          onMouseDragFinished(drawPane);\n\
