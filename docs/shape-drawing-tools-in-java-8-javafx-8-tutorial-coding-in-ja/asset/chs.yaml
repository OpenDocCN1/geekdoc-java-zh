  \n* `Path` 类，位于 `javafx.scene.shape` 包中，是 `Shape` 的直接子类。`Path` 是 `PathElement` 构建的。\n\
  \n    （参见章节：作为 `Application` 的子类创建 `PathDrawer` 类 和 创建 `Path` 实例）\n\n* `PathElement`\
  \ 是一个抽象类，位于 `javafx.scene.shape` 包中；其直接子类为：`ArcTo`、`ClosePath`、`CubicCurveTo`、`HLineTo`、`LineTo`、`MoveTo`、`QuadCurveTo`、`VLineTo`。\n\
  \n    （参见此处 和章节 实现 `onMouseDragStarted()` 方法）\n\n* `Path` 类提供的 `public final ObservableList<PathElement>\
  \ getElements()` 方法返回一个类型为 `ObservableList<PathElement>` 的列表。使用 `Collection` 接口中定义的基本工具将\
  \ `PathElement` 对象添加到列表中。\n\n    （参见此处 和 此处）\n\n* `HLineTo` 位于 `javafx.scene.shape`\
  \ 包中，是 `PathElement` 的直接子类，创建一个水平线作为路径元素，指定终点 X 坐标，从上一个元素的终点绘制到指定的 X 坐标。\n\n   \
  \ （参见此处）\n\n* `MoveTo` 位于 `javafx.scene.shape` 包中，是 `PathElement` 的直接子类，创建一个路径元素，将位置移动到指定的\
  \ x, y 坐标。\n\n    （参见此处 和章节 实现 `onMouseDragStarted()` 方法）\n\n* `LineTo` 位于 `javafx.scene.shape`\
  \ 包中，是 `PathElement` 的直接子类，为路径创建一个线条元素，从上一个元素的终点到指定的 x, y 坐标。\n\n    （参见章节：实现 `onMouseDragStarted()`\
  \ 方法](#part0010_split_001.html_implement-on-mouse-darg-started) 和 实现 `OnMouseDragFinished()`\
  \ 方法）\n\n* `strokeLineCap` 是定义在 `Shape` 类中的类型为 `ObjectProperty<StrokeLineCap>` 的属性，用于指定线条的端点样式。\n\
  \n    （参见此处）\n\n* `StrokeLineCap` 类位于 `javafx.scene.shape` 包中，是一个 `enum` 类型，定义了这些常量：`BUTT`、`ROUND`\
  \ 和 `SQUARE`。\n\n    （参见此处）\n\n* `strokeLineJoin` 是定义在 `Shape` 类中的类型为 `ObjectProperty<StrokeLineJoin>`\
  \ 的属性，用于指定笔触之间的连接样式。\n\n    （参见此处）\n\n* `StrokeLineJoin` 类位于 `javafx.scene.shape`\
  \ 包中，是一个 `enum` 类型，定义了这些常量：`BEVEL`、`MITER` 和 `ROUND`。\n\n    （参见此处）\n\n* `strokeWidth`\
  \ 是定义在 `Shape` 类中的类型为 `ObjectProperty<Double>` 的属性，用于指定笔触的宽度。\n\n    （参见此处）\n\n\
  * `stroke` 是定义在 `Shape` 类中的类型为 `ObjectProperty<Paint>` 的属性，用于指定笔触的颜色。\n\n    （参见此处）\n\
  \n\n\n为了创建 `BezierCurveDrawer` 类，我们采用了 `PathDrawer` 类的完整源代码，并对其了必要的修改。主要的区别在于对 `MOUSE_DRAGGED`\
  \ 和 `MOUSE_RELEASED` 事件处理器的实现。\n\n以下是 `BezierCurveDrawer` 类的初始结构，它创建一个 `BorderPane`\
