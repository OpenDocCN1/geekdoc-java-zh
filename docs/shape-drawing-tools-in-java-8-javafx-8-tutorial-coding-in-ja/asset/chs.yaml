  }\n```\n\n\n\n\n\n## 7.4 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按照它们在章节中出现的顺序列出：\n\n*   `Shape`\
  \ 类，位于 `javafx.scene.shape` 包中，提供渲染矩形、圆形、椭圆等 2D 几何原语的功能。\n（参见章节：增强 `ShapeDrawer`\
  \ 类, 实现 `ShapeMover`, 增强 `DrawPane` 类）\n\n*   `javafx.beans.property` 包中的一些类：\n\
  \    - `BooleanProperty`：一个抽象类，继承自 `javafx.beans.binding.BooleanExpression` 类，实现了\
  \ `Property<java.lang.Boolean>` 和 `WritableBooleanValue`。\n    - `WritableBooleanValue`\
  \ 扩展 `WritableValue<java.lang.Boolean>`。\n    - `SimpleBooleanProperty`：继承自 `BooleanProperty`\
  \ 类。\n    - `DoubleProperty`：一个抽象类，继承自 `javafx.beans.binding.DoubleExpression` 类，实现了\
  \ `Property<Number>` 和 `WritableDoubleValue`。\n    - `WritableDoubleValue` 扩展 `WritableNumberValue`。\n\
  \    - `SimpleDoubleProperty`：继承自 `DoubleProperty` 类。\n    - `ObjectProperty<T>`：一个抽象类，继承自\
  \ `javafx.beans.binding.ObjectExpression<T>` 类，实现了 `Property<T>` 和 `WritableObjectValue<T>`。\n\
  \    - `SimpleObjectProperty<T>`：继承自 `ObjectProperty<T>` 类。\n（参见章节：定义形状渲染属性, 定义布尔属性\
  \ `polySegment`）\n\n*   `Color`，位于 `javafx.scene.paint` 包中，是 `Paint` 类的直接子类（颜色和渐变色的基类），用于绘制\
  \ `Shape` 的背景或边框。\n（参见此处, 此处, 此处, 此处, 此处, 此处, 此处, 此处, 此处, 此处)）\n\n*   `Shape` 类中定义的某些属性：\n\
  \    - `fill`：指定一个 `Paint` 对象作为形状的背景颜色。\n    - `stroke`：指定一个 `Paint` 对象作为形状的边框颜色。\n\
  \    - `strokeType`：指定一个 `StrokeType` 对象（枚举类型）作为形状的边框类型。常量值为：`CENTERED`、`INSIDE`、`OUTSIDE`。默认值为\
  \ `CENTERED`。\n    - `strokeWidth`：指定一个双值作为形状的边框宽度。\n（参见定义形状渲染属性, 此处）\n\n*   `WritableObjectValue<T>`\
  \ 接口，位于 `javafx.beans.value` 包中并扩展 `WritableValue<T>`，定义了以下方法：\n```\nT get()\n```\n\
  获取封装的值。\n```\nvoid set(T value)\n```\n设置封装的值。\n（参见此处, 此处）\n\n*   `Line` 类，位于 `javafx.scene.shape`\
  \ 包中，是 `javafx.scene.shape.Shape` 的直接子类。它提供了指定线条位置的属性：`startX`、`startY`、`endX` 和\
  \ `endY`。\n（参见 LineDrawer）\n\n*   `Property<T>` 接口，位于 `javafx.beans.property` 包中，定义了以下通用方法：\n\
  ```\nvoid bind(ObservableValue observable)\n```\n将此属性绑定到给定的 `ObservableValue`。\n\
  ```\nvoid unbind()\n```\n解绑此属性。\n（参见此处, 此处, 此处, 此处, 此处, 此处, 此处）\n\n*   `Polyline`，位于\
  \ `javafx.scene.shape` 包中，是 `javafx.scene.shape.Shape` 的直接子类。使用 `getPoints()` 方法获取\
  \ `ObservableList<Double>` 列表，然后使用 `Collection` 接口中的基本方法添加一系列双值坐标来表示折线。\n（参见 LineDrawer）\n\
  \n*   `Polygon`，位于 `javafx.scene.shape` 包中，是 `javafx.scene.shape.Shape` 的直接子类。使用\
  \ `getPoints()` 方法获取 `ObservableList<Double>` 列表，然后使用 `Collection` 接口中的基本方法添加一系列双值坐标来表示多边形。\n\
  （参见 LineDrawer）\n\n*   `Path` 类，位于 `javafx.scene.shape` 包中，是 `Shape` 的直接子类。`Path`\
  \ 由 `PathElement` 构造而成。\n（参见章节：PathDrawer, BezierCurveDrawer）\n\n*   `PathElement`\
  \ 抽象类，位于 `javafx.scene.shape` 包中；其直接子类有：`ArcTo`、`ClosePath`、`CubicCurveTo`、`HLineTo`、`LineTo`、`MoveTo`、`QuadCurveTo`、`VLineTo`。\n\
  （参见章节：PathDrawer, BezierCurveDrawer）\n\n*   `Path` 类提供的 `public final ObservableList<PathElement>\
  \ getElements()` 方法返回一个类型为 `ObservableList<PathElement>` 的列表。使用 `Collection` 方法将\
  \ `PathElement` 对象添加到列表中。\n（参见章节：PathDrawer, BezierCurveDrawer）\n\n*   `LineTo`，位于\
  \ `javafx.scene.shape` 包中，是 `PathElement` 的直接子类；它为路径创建一个线条元素，从上一个元素的终点到指定的 x、y 坐标。\n\
  （参见 PathDrawer）\n\n*   `MoveTo`，位于 `javafx.scene.shape` 包中，是 `PathElement` 的直接子类；它创建一个路径元素，将位置移动到指定的\
  \ x、y 坐标。\n（参见章节：PathDrawer, BezierCurveDrawer）\n\n*   `QuadCurveTo`，位于 `javafx.scene.shape`\
  \ 包中，是 `PathElement` 的直接子类；它为路径创建一个二次贝塞尔曲线元素。\n（参见 BezierCurveDrawer）\n\n\n\n\n\n\
  *   `DoubleBinding` 是一个位于 `javafx.beans.binding` 包的抽象类，继承自 `DoubleExpression` 并实现了\
  \ `NumberBinding`。为了实例化 `DoubleBinding` 对象，需要实现 `computeValue()` 方法。通常调用 `bind(Observable...\
