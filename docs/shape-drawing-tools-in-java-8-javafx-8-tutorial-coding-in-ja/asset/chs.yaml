  \n以下代码片段展示了如何注册事件处理器来处理 `MOUSE_PRESSED`、`MOUSE_DRAGGED`、`MOUSE_RELEASED` 和 `KEY_PRESSED`\
  \ 事件：\n\n导入语句：\n\n```java\nimport javafx.event.EventHandler;\nimport javafx.scene.input.KeyEvent;\n\
  import javafx.scene.input.MouseEvent;\n```\n\n列表 1-5。注册事件处理器处理 `MOUSE_PRESSED`、`MOUSE_DRAGGED`、`MOUSE_RELEASED`\
