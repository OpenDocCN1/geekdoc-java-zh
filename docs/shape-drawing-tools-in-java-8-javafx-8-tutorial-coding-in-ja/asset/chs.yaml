  \n本章介绍了 JavaFX 库的以下关键方面，按它们在章节中顺序列出：\n\n* `Path` 类，位于 `javafx.scene.shape` 包中，是\
  \ `Shape` 的直接子类。`Path` 是通过 `PathElement` 构建的。\n  （参见章节：作为 `Application` 的子类创建 `BezierCurveDrawer`\
  \ 类`, 注册鼠标拖动事件的事件处理器, 实现 `handleMouseClicked(Pane pane)` 方法）\n\n* `PathElement`，抽象类，位于\
  \ `javafx.scene.shape` 包中；其直接子类有：`ArcTo`、`ClosePath`、`CubicCurveTo`、`HLineTo`、`LineTo`、`MoveTo`、`QuadCurveTo`、`VLineTo`。\n\
  \  （参见此处, 向 `Path` 添加 `MoveTo` 元素`, 此处, 此处, 此处 以及 实现 `deleteLastPathElement(Pane\
  \ pane, Path path)` 方法）\n\n* `EventHandler<T extends Event>`，一个自 `java.util.EventListener`\
  \ 的接口，定义了 `handle(`T` 事件) 方法，当指定事件发生时调用。\n  （参见章节：注册鼠标拖动事件的事件处理器, 注册鼠标释放事件的事件处理器,\
  \ 注册按按下事件的事件处理器）\n\n* `MouseEvent` 类，位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent`\
  \ 的子类。它定义了事件类型，如 `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
  \ 等，并提供了如 `getX()`、`getY()` 等方法来获取事件发生时鼠标指针的位置。\n  （参见章节：注册鼠标拖动事件的事件处理器）\n\n* `Node`\
  \ 中提供的用于处理鼠标事件的一些便利方法：\n  `public final void setMousePressed(EventHandler<? super\
  \ MouseEvent>`\n  `public final void setMouseDragged(EventHandler<? super MouseEvent>`\n\
  \  `public final void setMouseReleased(EventHandler<? super MouseEvent>`\n  `public\
  \ final void setKeyPressed(EventHandler<? super KeyEvent>`\n  （参见注册鼠标拖动事件的事件处理器,\
  \ 注册鼠标释放事件的事件处理器, 注册按按下事件的事件处理器）\n\n* `QuadCurveTo`，位于 `javafx.scene.shape` 包中，是\
  \ `PathElement` 的直接子类，为路径创建一个二次贝塞尔元素。\n  （参见介绍贝塞尔曲线, 此处, 此处）\n\n* `public final\
  \ ObservableList<PathElement> getElements()` 方法，位于 `Path` 类，返回一个类型为 `ObservableList<PathElement>`\
  \ 的列表。使用 `Collection` 中定义的实用工具向列表添加 `PathElement` 对象。\n  （参见此处, 此处, 此处）\n\n* `void\
  \ bind(ObservableValue<? extends T> observable)` 和 `void unbind()` 是 `Property`\
  \ 接口定义的方法，位于 `javafx.beans.property` 包，用于为此属性创建/移除单向绑定。\n  （参见向路径添加直线 `QuadCurveTo`\
  \ 元素`, 向路径添加普通 `QuadCurveTo` 元素`）\n\n* `DoubleBinding`，抽象类，位于 `javafx.beans.binding`\
  \ 包，自 `DoubleExpression` 并实现 `NumberBinding`。为了实例化 `DoubleBinding` 对象，需要实现 `computeValue()`\
  \ 方法。\n\n* `public DoubleBinding add(ObservableNumberValue other)` 方法，位于 `javafx.beans.binding.DoubleExpression`\
  \ 类，返回一个新的 `DoubleBinding`，该绑定计算此 `NumberExpression` 与给定的 `NumberExpression` 之和。\n\
  \n\n\n\n\n*   `KeyEvent` 类位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent`\
  \ 的子类。它定义了如 `KEY_PRESSED`、`KEY_RELEASED`、`KEY_TYPED` 等事件类型，并提供了 `getCode()`、`getCharacter()`、`getText()`\
  \ 等方法，用于以 `KeyCode` 或 `String` 的类型获取按键信息。它还提供了布尔方法，如 `isControlDown()`、`isShiftDown()`、`isAltDown()`\
  \ 等，用于验证某些修饰键是否同时被按下。\n\n(请参见章节 注册按下键事件的事件处理器)\n\n*   `KeyCode` 类位于 `javafx.scene.input`\
  \ 包中，是一个枚举类型，定义了键盘按键常量，涵盖了字母键（`A` 到 `Z`）、数字键（`DIGIT0` 到 `DIGIT9`）、修饰键（如 `CONTROL`、`SHIFT`\
  \ 等）、功能键等。\n\n(请参见章节 注册按下键事件的事件处理器)\n\n# 第 6 章：基础绘制工具\n\n--开发形状绘制工具 V1.0\n\n## 前言\n\
  \n到目前，我们已经开发了各种形状绘制器，每个都是一个独立的应用程序。第一个绘制器是 `Line Drawer`，对于其他的，我们简单地采用在前章节中开发的绘制器的完整源代码，并进行必要的修改。这是一种临时方案，专注于实现交互式绘制每个不同的形状，这些形状派自\
  \ `Shape` 类，如 `Line`、`Polyline`、`Polygon` 等。形状通过鼠标拖动事件在绘制板上绘制；代码的主要差异大多嵌入在鼠标拖动事件的事件处理器中。\n\
  \n在本章中，为了避免繁琐地修改现有代码并简化任何新形状绘制应用程序的开发，我们开发了一个名为 `drawtool` 的包，其中包含一组实用的综合形状绘制 API。最初，它包含两个类：`ShapeDrawer`\
  \ 和 `DrawPane`。\n\n`ShapeDrawer` 是所有绘制器的基类，定义了渲染形状的属性以及在绘制板上绘制形状的必要方法。而 `DrawPane`\
  \ 是 `Pane` 的子类，作为绘制板，定义了所需的变量并注册了事件处理器来处理在其上交互式绘制形状的重要事件。\n\n我们还将向你展示如何应用这些绘制 API\
  \ 来简化交互式绘制应用程序的开发，例如 `Rectangle Drawer`、`Circle Drawer` 和 `Ellipse Drawer`。\n\n\
  通过从 `形状绘制工具 V1.0` 的开发以及形状绘制应用程序中提取的详细描述和文档良好的示例代码，你将熟悉 JavaFX 库在 总结 部分中介绍的基本能力。\n\
  \n`形状绘制工具 V1.0` 的完整开发过程具有以下步骤的特征：\n\n*   6.1 创建 `ShapeDrawer` 类\n    *   6.1.1 定义属性\n\
  \    *   6.1.2 定义方法\n    *   6.1.3 完成 `ShapeDrawer` 类的源代码\n*   6.2 创建 `DrawPane`\
  \ 类\n    *   6.2.1 定义属性\n    *   6.2.2 在默认构造函数内部注册事件处理器\n    *   6.2.3 定义 `drawOnMouseDragged`\
  \ 方法\n    *   6.2.4 为 `ENTER` 键、`ESCAPE` 键和 `DELETE` 键采取默认操作\n    *   6.2.5 定义带有类型\
  \ `ShapeDrawer` 参数的构造函数\n    *   6.2.6 完成 `DrawPane` 类的源代码\n*   6.3 使用 Draw Tool\
  \ APIs 开发绘制器应用程序\n    *   6.3.1 创建 `Application` 子类 `RectangleDrawer` 类\n    * \
  \  6.3.2 创建 `Application` 子类 `CircleDrawer` 类\n    *   6.3.3 创建 `Application` 子类\
  \ `EllipseDrawer` 类\n*   6.4 总结\n\n## 6.1 创建 `ShapeDrawer` 类\n\n`ShapeDrawer` 是所有绘制器的基类，定义了渲染形状的属性以及在绘制板上绘制形状的必要方法。\n\
  \n### 6.1.1 定义属性\n\n`ShapeDrawer` 定义了所需的变量。`shapeClass` 是要绘制的形状类型。`shape` 是绘制板上的形状。`strokeColor`\
  \ 是绘制形状边界的颜色。`fillColor` 是填充形状内部的颜色。\n\n如果 `shapeClass` 的值为 `null`，则发生鼠标事件时不会绘制形状。以下代码片段定义了\
  \ `ShapeDrawer` 中的属性：\n\n导入：\n\n```java\nimport javafx.beans.property.ObjectProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.Shape;\n```\n\n列表 6-1 在 `ShapeDrawer` 类中定义属性：\n\n```java\n\
  public abstract class ShapeDrawer {\n\n  public ObjectProperty<Class extends Shape>>\
  \ shapeClass =\n    new SimpleObjectProperty<>();\n  public ObjectProperty<Shape>\
  \ shape =\n    new SimpleObjectProperty<>();\n\n  public ObjectProperty<Color> strokeColor\
  \ =\n    new SimpleObjectProperty<>(Color.GREENYELLOW);\n  public ObjectProperty<Color>\
  \ fillColor =\n    new SimpleObjectProperty<>(Color.TRANSPARENT);\n\n     ...\n\n\
  }\n```\n\n以下代码片段是 `ShapeDrawer` 中用于操作上述属性的工具：\n\n列表 6-2 提供操作属性的工具：\n\n```java\n\
  \ public Class extends Shape> getShapeClass() {\n    return shapeClass.get();\n\
  \  }\n\n  public void setShapeClass(Class extends Shape> value) {\n    shapeClass.set(value);\n\
  \  }\n\n  public ObjectProperty<Class extends Shape>> shapeClassProperty() {\n \
  \   return shapeClass;\n  }\n\n  public Shape getShape() {\n    return shape.get();\n\
  \  }\n\n  public void setShape(Shape value) {\n    shape.set(value);\n  }\n\n  public\
  \ ObjectProperty<Shape> shapeProperty() {\n    return shape;\n  }\n\n  public Color\
  \ getStrokeColor() {\n    return strokeColor.get();\n  }\n\n  public void setStrokeColor(Color\
  \ value) {\n    strokeColor.set(value);\n  }\n\n  public ObjectProperty<Color> strokeColorProperty()\
  \ {\n    return strokeColor;\n  }\n\n  public Color getFillColor() {\n    return\
  \ fillColor.get();\n  }\n\n  public void setFillColor(Color value) {\n    fillColor.set(value);\n\
  \  }\n\n  public ObjectProperty<Color> fillColorProperty() {\n    return fillColor;\n\
  \  }\n```\n\n### 6.1.2 定义方法\n\n`ShapeDrawer` 是一个抽象类。它定义了两个抽象方法如下：\n\n\n\n\n\n# 列表\
  \ 6-3. 定义抽象方法：\n\n```\n public abstract void onMouseDragStarted(DrawPane drawPane);\n\
  \  public abstract void onMouseDragFinished(DrawPane drawPane);\n```\n\n传递给这两个方法的参数类型为\
  \ `DrawPane`，该类提供了绘图板的功能，将在本章稍后的部分进行讨论。\n\n`onMouseDragStarted` 方法在发生鼠标拖动事件时被调用，用于处理用户定义的动作。请注意，它在检测到第一个拖动事件时仅会被调用一次。\n\
  \n`onMouseDragFinished` 方法在鼠标释放事件完成鼠标拖动事件序列序列时被调用。\n\n以下是在绘图板上交互式地绘制形状的工作原理：当在鼠标按下事件后紧接着发生鼠标拖动事件时，会创建一个\
  \ `shapeClass` 形状（其属性指定了要绘制的形状）并显示在绘图板上，然后调用 `onMouseDragStarted` 方法。根据应用程序设置的规范，可能会更改形状的各种属性。当一系列拖动事件通过鼠标释放事件结束时，将调用\
  \ `onMouseDragFinished` 方法。简而言之，完成一个形状的绘制需要以下鼠标事件：一个鼠标按下事件，紧接着一系列鼠标拖动事件，并由鼠标释放事件结束。\n\
  \n以下创建一个 `ShapeDrawer` 实例的示例，该实例绘制矩形形状，并将 `Rectangle.class` 作为参数传递给构造函数，并提供了两个抽象方法的实现：\n\
  \n# 列表 6-4 定义 `newRectangleDrawer()` 方法，返回一个 `ShapeDrawer` 实例以在绘图板上绘制矩形；创建 `DoubleBinding`\
  \ 来计算矩形的 `x`、`y`、`width` 和 `height` 属性的值；调用 `DoubleBinding` 类定义的 `bind(Observable...\
  \ dependencies)` 方法来观察此 `DoubleBinding` 对象的依赖值变化；调用 `bind` 方法绑定两个观测值，并调用 `unbind`\
  \ 方法移除绑定：\n\n```\n ShapeDrawer newRectangleDrawer() {\n    return new ShapeDrawer(Rectangle.class)\
  \ {\n      @Override\n      public void onMouseDragStarted(final DrawPane drawPane)\
  \ {\n\n        Rectangle rect = (Rectangle)getShape();\n\n        DoubleBinding\
  \ xB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \          return (drawPane.getDragX() < 0.0)\n              ? drawPane.getStartX()\
  \ + drawPane.getDragX() : drawPane.getStartX();\n          }\n        };\n\n   \
  \     DoubleBinding yB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragYProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return (drawPane.getDragY() < 0.0)\n                ? drawPane.getStartY()\
  \ + drawPane.getDragY() : drawPane.getStartY();\n          }\n        };\n\n   \
  \     DoubleBinding wB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragX());\n          }\n        };\n\n\
  \        DoubleBinding hB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragYProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragY());\n          }\n        };\n\n\
  \        rect.xProperty().bind(xB);\n        rect.yProperty().bind(yB);\n      \
  \  rect.widthProperty().bind(wB);\n        rect.heightProperty().bind(hB);   \n\
  \      }\n\n      @Override\n      public void onMouseDragFinished(final DrawPane\
  \ drawPane) {\n        Rectangle rect = (Rectangle)getShape();\n        if (rect\
  \ != null) {\n          rect.xProperty().unbind();\n          rect.yProperty().unbind();\n\
  \          rect.widthProperty().unbind();\n          rect.heightProperty().unbind();\n\
  \        }\n      }\n    };\n  } \n```\n\n请注意，在上述列表的 `onMouseDragStarted` 方法内部，我们将矩形形状的起点、`x`\
  \ 坐标和 `y` 坐标绑定到了鼠标按下事件的 x 位置和 y 位置，这些位置分别定义在 `DrawPane`  `startX` 和 `startY` 属性中。同样，我们将矩形形状的\
  \ `width` 和 `height` 绑定到鼠标拖动事件的平移 x 和平移 y，这些分别定义在 `DrawPane` 类的 `dragX` 和 `dragY`\
  \ 属性中。由于属性绑的存在，你会看到当鼠标在绘图板上拖动时，矩形的终点会不断调整以与鼠标当前位置一致。\n\n为了完成一个矩形的绘制，我们需要解绑，这在 `onMouseDragFinished`\
  \ 方法内部完成，该方法在鼠标释放事件结束鼠标拖动事件序列时立即被调用。\n\n### 6.1.3 `ShapeDrawer` 类的完整源代码\n\n以下是 `ShapeDrawer`\
  \ 类的完整源代码。\n\n### 列表 6-5 创建 `ShapeDrawer` 类：\n\n\n\n\n\n## ShapeDrawer.java\n\n\
  ```java\npackage drawtool;\n\nimport javafx.beans.property.ObjectProperty;\nimport\
  \ javafx.beans.property.SimpleObjectProperty;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.Shape;\n\n/**\n * 文件名: ShapeDrawer.java\n * (目录: DrawTool1.0/src/example1/drawtool/)\n\
  \ * ShapeDrawer 是所有绘制绘制的基类，用于在绘板上绘制形状\n * 它提供了基本方法，以方便形状绘制应用程序的开发\n * 形状是通过鼠标拖动事件在绘板上绘制的\
  \ \n * \n * shapeClass 是一个属性，用于指定在绘板上要绘制的形状\n * 如果未设置该值，则在绘板上发生鼠标拖动事件时将不会绘制任何形状\
  \ \n * 参见以下两个示例：\n *   LineDrawer 是 ShapeDrawer 的子类，在 LineDrawer 的构造函数中 shapeClass\
  \ 的值\n *   设置为 Line.class\n *   ShapeMover 是 ShapeDrawer 的子类，shapeClass 的值设置为 null，\n\
  \ *   因此，当拖动鼠标时将不会绘制任何形状\n *   ShapeMover 的作用是在鼠标在其上方拖动时移动现有的形状\n *\n * shape 是一个属性，用于临时保存在绘板上绘制的形状\n\
  \ *\n * strokeColor/fillColor 是属性，用于存储要在绘板上绘制的形状的\n *   描边/填充属性的值 \n * \n * ShapeDrawer\
  \ 的子类必须实现以下抽象方法：\n *   public abstract void onMouseDragStarted(DrawPane drawPane)\n\
  \ *   public abstract void onMouseDragFinished(DrawPane drawPane)\n *\n * 以下是无实际操作的方法，它们可以被\
  \ ShapeDrawer 的子类重写：\n *   public void handleMouseClicked(DrawPane drawPane) {}\n\
  \ *   public void handleDeleteKeyPressed(DrawPane drawPane) {}\n *   public void\
  \ clean(DrawPane drawPane) {}\n *\n * @author: Shufen Kuo\n */\npublic abstract\
  \ class ShapeDrawer {\n\n  /* 声明变量 */\n\n  public ObjectProperty<Class<? extends\
  \ Shape>> shapeClass =\n    new SimpleObjectProperty<>();\n  public ObjectProperty<Shape>\
  \ shape = new SimpleObjectProperty<>();\n\n  // 渲染形状的基本属性\n  public ObjectProperty<Color>\
  \ strokeColor =\n    new SimpleObjectProperty<>(Color.GREENYELLOW);\n  public ObjectProperty<Color>\
  \ fillColor =\n    new SimpleObjectProperty<>(Color.TRANSPARENT);\n\n  /* 定义抽象方法\
  \ */\n\n  public abstract void onMouseDragStarted(DrawPane drawPane);\n  public\
  \ abstract void onMouseDragFinished(DrawPane drawPane);\n\n  public ShapeDrawer(Class<?\
  \ extends Shape> sc) {\n    shapeClass.set(sc);\n  }\n\n  /* 定义无操作方法 */\n\n  public\
  \ void handleMouseClicked(DrawPane drawPane) {}\n  public void handleDeleteKeyPressed(DrawPane\
  \ drawPane) {}\n  public void clean(DrawPane drawPane) {}\n\n  /* 访问属性的工具方法 */\n\
  \n  public Class<? extends Shape> getShapeClass() {\n    return shapeClass.get();\n\
  \  }\n\n  public void setShapeClass(Class<? extends Shape> value) {\n    shapeClass.set(value);\n\
  \  }\n\n  public ObjectProperty<Class<? extends Shape>> shapeClassProperty() {\n\
  \    return shapeClass;\n  }\n\n  public Shape getShape() {\n    return shape.get();\n\
  \  }\n\n  public void setShape(Shape value) {\n    shape.set(value);\n  }\n\n  public\
  \ ObjectProperty<Shape> shapeProperty() {\n    return shape;\n  }\n\n  public Color\
  \ getStrokeColor() {\n    return strokeColor.get();\n  }\n\n  public void setStrokeColor(Color\
  \ value) {\n    strokeColor.set(value);\n  }\n\n  public ObjectProperty<Color> strokeColorProperty()\
  \ {\n    return strokeColor;\n  }\n\n  public Color getFillColor() {\n    return\
  \ fillColor.get();\n  }\n\n  public void setFillColor(Color value) {\n    fillColor.set(value);\n\
  \  }\n\n  public ObjectProperty<Color> fillColorProperty() {\n    return fillColor;\n\
  \  }\n\n}\n```\n\n## 6.2 创建 `DrawPane` 类\n\n`Pane` 类继承自 `javafx.scene.layout.Region`，它不会对其子节点强制自动布局，因此最适合作为绘板。因此，我们创建了\
  \ `DrawPane` 类作为 `Pane` 类的直接子类，以定义所需的变量并注册事件处理器来处理交互式绘制形状的重要事件。\n\n在第 1 章 Line Drawer\
  \ 部分 1.1.1 节阅读更多关于 `Pane` 类的信息：作为绘板添加到 BorderPane 中心。\n\n### 6.2.1 定义属性\n\n以下是在\
  \ `DrawPane` 类中定义的属性，用于在发生鼠标拖动事件时绘制形状。\n\n### `startX`\n类型为 `DoubleProperty` 的属性，用于指定鼠标按下事件的\
  \ X 位置。\n\n### `startY`\n类型为 `DoubleProperty` 的属性，用于指定鼠标按下事件的 Y 位置。\n\n### `dragX`\n\
  类型为 `DoubleProperty` 的属性，指定从当前鼠标拖动位置到 `startX` 计算的 X 距离。`startX` 是鼠标拖动事件之前发生的鼠标按下事件的\
  \ X 位置。\n\n### `dragY`\n类型为 `DoubleProperty` 的属性，指定从当前鼠标拖动位置到 `startY` 计算的 Y 距离。`startY`\
  \ 是鼠标拖动事件之前发生的鼠标按下事件的 Y 位置。\n\n### `dragged`\n类型为 `BooleanProperty` 的属性，用于指定是否正在拖动。\n\
  \n### `drawer`\n类型为 `ObjectProperty<Shape>` 的属性，指定当前的绘制工具。\n\n以下是 `DrawPane` 类的代码片段：\n\
  \n```java\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.DoubleProperty;\n\
  import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
  import javafx.beans.property.SimpleDoubleProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.scene.layout.Pane;\n\npublic class DrawPane extends Pane {\n\n  /*\
  \ 声明变量 */\n\n  public DoubleProperty startX = new SimpleDoubleProperty();\n  public\
  \ DoubleProperty startY = new SimpleDoubleProperty();\n  public DoubleProperty dragX\
  \ = new SimpleDoubleProperty();\n  public DoubleProperty dragY = new SimpleDoubleProperty();\n\
  \n  public BooleanProperty dragged = new SimpleBooleanProperty();\n\n  public ObjectProperty<Shape>\
  \ drawer = new SimpleObjectProperty();\n\n  ...\n}\n```\n\n列表 6-6. 定义属性：\n\n```java\n\
  public double getStartX() {\n  return startX.get();\n}\n\npublic void setStartX(double\
  \ value) {\n  startX.set(value);\n}\n\npublic DoubleProperty startXProperty() {\n\
  \  return startX;\n}\n\npublic double getStartY() {\n  return startY.get();\n}\n\
  \npublic void setStartY(double value) {\n  startY.set(value);\n}\n\npublic DoubleProperty\
  \ startYProperty() {\n  return startY;\n}\n\npublic double getDragX() {\n  return\
  \ dragX.get();\n}\n\npublic void setDragX(double value) {\n  dragX.set(value);\n\
  }\n\npublic DoubleProperty dragXProperty() {\n  return dragX;\n}\n\npublic double\
  \ getDragY() {\n  return dragY.get();\n}\n\npublic void setDragY(double value) {\n\
  \  dragY.set(value);\n}\n\npublic DoubleProperty dragYProperty() {\n  return dragY;\n\
  }\n\npublic boolean isDragged() {\n  return dragged.get();\n}\n\npublic void setDragged(boolean\
  \ value) {\n  dragged.set(value);\n}\n\npublic BooleanProperty draggedProperty()\
  \ {\n  return dragged;\n}\n\npublic Shape getDrawer() {\n  return drawer.get();\n\
  }\n\npublic void setDrawer(Shape value) {\n  drawer.set(value);\n}\n\npublic ObjectProperty<Shape>\
  \ drawerProperty() {\n  return drawer;\n}\n```\n\n列表 6-7. 提供操作属性的工具方法：\n（上述代码提供了属性访问器）。\n\
  \n## 6.2.2 在默认构造函数内部注册事件处理器\n\n\n\n\n\n`DrawPane` 类注册了事件处理器来处理以下类型的事件：`MOUSE_PRESSED`、`MOUSE_DRAGGED`、`MOUSE_RELEASED`\
  \ 和 `KEY_PRESSED`。通过处理这些事件，我们就可以轻松地在绘板上交互式地绘制形状。\n\n以下是 `DrawPane` 的默认构造函数，其中使用\
  \ `Node` 类提供的简便方法注册了所有必要的事件处理器：\n\nListing 6-8. 定义默认构造函数以注册事件处理器：\n\n```\n public\
  \ DrawPane() {\n    setOnMousePressed(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        drawOnMousePressed(me);\n  \
  \    }\n    });\n\n    setOnMouseDragged(new EventHandler<MouseEvent>() {\n    \
  \  @Override\n      public void handle(MouseEvent me) {\n        drawOnMouseDragged(me);\n\
  \      }\n    });\n\n    setOnMouseReleased(new EventHandler<MouseEvent>() {\n \
  \     @Override\n      public void handle(MouseEvent me) {\n        drawOnMouseReleased(me);\n\
  \      }\n    });\n\n    // 将 focusTraversable 属性设置为 true 以处理 KeyEvent, \n    //\
  \ 默认是 false。\n    setFocusTraversable(true);\n    setOnKeyPressed(new EventHandler<KeyEvent>()\
  \ {\n      @Override\n      public void handle(KeyEvent ke) {\n        drawOnKeyPressed(ke);\n\
  \      }\n    });\n  }\n```\n\n### 6.2.3 定义 `drawOnMouseDragged` 方法\n\n一旦检测到鼠标拖动事件，就会创建一个形状并将其设置为在\
  \ `ShapeDrawer` 类中定义的 `shape` 属性的值。我们定义了 `drawOnMouseDragged` 方法来执行这些任务。它从注册用于 `MOUSE_DRAGGED`\
  \ 事件的事件处理器的 `handle` 方法调用。以下是 `drawOnMouseDragged` 方法的实现：\n\nListing 6-9. 定义 `drawOnMouseDragged`\
  \ 方法处理鼠标拖动事件，设置 `dragX` 属性和 `dragY` 属性的值，创建形状对象并设置为 `ShapeDrawer` 类中定义的 `shape`\
  \ 属性的值，并调用同样在 `ShapeDrawer` 类中定义的 `onMouseDragStarted` 方法：\n\n```\n protected void\
  \ drawOnMouseDragged(MouseEvent me) {\n    setDragX(me.getX() - getStartX());\n\
  \    setDragY(me.getY() - getStartY()); \n    if (!isDragged()) {\n      // 仅执行一次，并且为每个\
  \ PRESSED-DRAGGED-RELEASED 事件周期\n      // 仅创建一次临时形状。\n      if (getDrawer() != null\
  \ && getDrawer().getShapeClass() != null) {\n        ShapeDrawer tool = getDrawer();\n\
  \        Shape sketch = tool.getShape();\n        if (sketch == null ||\n      \
  \      !tool.getShapeClass().isInstance(sketch)) {\n          try {\n          \
  \  Shape tmpShape = tool.getShapeClass().newInstance();\n            tmpShape.setFill(tool.getFillColor());\n\
  \            tmpShape.setStroke(tool.getStrokeColor());\n            tool.setShape(tmpShape);\n\
  \            getChildren().add(tmpShape);\n          } catch (InstantiationException\
  \ | IllegalAccessException ex) {\n          }\n        }\n      } \n      setDragged(true);\n\
  \      // 在 ShapeDrawer 中定义的 onMouseDragStarted 方法从处理 MOUSE_DRAGGED 类型鼠标事件的事件处理器调用，\n\
  \      // 它只被调用一次，\n      // 在第一次检测到鼠标拖动事件时调用。\n      if (getDrawer() != null)\n\
  \        getDrawer().onMouseDragStarted(this);\n    }\n  }\n```\n\n这些主要任务在 `drawOnMouseDragged`\
  \ 方法中执行：\n\n1. 计算从当前鼠标拖动位置到鼠标按下位置的位移距离，并分别存储在 `dragX` 属性和 `dragY` 属性中。\n2. 在拖动动作开始时创建一个形状，调用\
  \ `getShapeClass()` 方法来确定创建哪种形状。\n3. 调用在 `ShapeDrawer` 类中抽象定义的 `onMouseDragStarted`\
  \ 方法。\n\n以下是 `drawOnMouseDragged` 方法被调用的位置：\n\n```\n setOnMouseDragged(new EventHandler()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        drawOnMouseDragged(me);\n\
  \      }\n    }); \n```\n\n### 6.2.4 对 `ENTER` 键、`ESCAPE` 键和 `DELETE` 键执行默认操作\n\n\
  `DrawPane` 类注册了事件处理器来处理按键事件的 `KEY_PRESSED` 类型。在这里，我们将详细说明对 `ENTER` 键、`ESCAPE` 键和\
  \ `DELETE` 键分别采取默认操作：\n\n* 当按下 `ENTER` 键时，临时存储在 `ShapeDrawer` 类定义的 `shape` 属性中的形状对象将被确定。\n\
  * 当按下 `ESCAPE` 键时，形状对象被取消——从绘板的子列表中删除。\n* 当按下 `DELETE` 键时，什么都不做。\n\n以下是为了完成上述任务定义的方法：\n\
  \nListing 6-10. 定义处理 `ENTER`、`ESCAPE` 和 `DELETE` 键码的方法：\n\n```\n /**\n   * 此方法从按下按下事件处理器的\
  \ handle 方法调用\n   */\n  protected void drawOnKeyPressed(KeyEvent ke) {\n    KeyCode\
  \ kc = ke.getCode();\n    switch (kc) {\n      case ENTER:\n        drawOnEnterKeyPressed();\
  \ \n        break;\n      case ESCAPE:\n        drawOnEscapeKeyPressed();\n    \
  \    break;\n      case DELETE:\n        drawOnDeleteKeyPressed();\n        break;\n\
  \    }       \n  }\n\n  protected void drawOnEnterKeyPressed() {\n    // 按下 Enter\
  \ 键以完成形状\n    // 必须调用完成方法来处理绑定\n    ShapeDrawer tool = getDrawer();\n    if (tool\
  \ != null && tool.getShape() != null) {\n      if (isDragged()) {\n        tool.onMouseDragFinished(this);\n\
  \      }\n      tool.clean(this);\n      tool.setShape(null);  // 完成形状\n    }\n\
  \  }\n\n  protected void drawOnEscapeKeyPressed() {\n    // 按下 Esc 键以清除形状\n    if\
  \ (getDrawer() != null && getDrawer().getShape() != null) {\n      // 必须调用完成方法来处理绑定\n\
  \      ShapeDrawer tool = getDrawer();\n      Shape s = tool.getShape();\n     \
  \ if (isDragged()) {\n        tool.onMouseDragFinished(this);\n      }\n      tool.clean(this);\n\
  \      getChildren().remove(s);\n      tool.setShape(null);  // 清除形状\n    }\n  }\n\
  \n  protected void drawOnDeleteKeyPressed() {\n    if (getDrawer() != null)\n  \
  \    getDrawer().handleDeleteKeyPressed(this);\n  }\n```\n\n从前面的列表可以看出，`DrawPane`\
  \ 通过调用 `handleDeleteKeyPressed` 方法来处理 `DELETE` 键。该方法在 `ShapeDrawer` 类中定义如下：\n\n\
  ```\n public void handleDeleteKeyPressed(DrawPane drawPane) {}\n```\n\n复杂的绘图应用程序可能在按下删除键时需要删除功能，如果是这样，只需在实例化\
  \ `ShapeDrawer` 类时重写 `handleDeleteKeyPressed` 方法。同样，你可以创建 `DrawPane` 的子类，并重写 `drawOnKeyPressed`\
  \ 方法为 `ENTER` 键和 `ESCAPE` 键执行不同的操作，以满足应用程序的需求。\n\n### 6.2.5 定义带有 `ShapeDrawer` 参数的构造函数\n\
  \n现在让我们让我们带有 `ShapeDrawer` 参数的构造函数：\n\nListing 6-11. 定义带有 `ShapeDrawer` 参数的构造函数：\n\
  \n```\n public DrawPane(ShapeDrawer tool) {\n    this();\n    drawer.set(tool);\n\
  \  }\n```\n\n必须创建一个 `ShapeDrawer` 的实例并将其传递给 `DrawPane` 类的构造函数，以便有效地交互地参与绘制任务。如果\
  \ `drawer` 属性的值从未被设置，则 `DrawPane` 只是一个普通的 `Pane`，其交互绘制能力未被利用。\n\n要了解更多关于创建 `DrawPane`\
  \ 对象的信息，请阅读本章后续章节。\n\n### 6.2.6 `DrawPane` 类的完整源代码\n\n以下是 `DrawPane` 类的完整源代码。\n\n\
  Listing 6-12. 创建 `DrawPane` 类：\n\n\n\n\n\n```java\npackage drawtool;\n\nimport javafx.beans.property.BooleanProperty;\n\
  import javafx.beans.property.DoubleProperty;\nimport javafx.beans.property.ObjectProperty;\n\
  import javafx.beans.property.SimpleBooleanProperty;\nimport javafx.beans.property.SimpleDoubleProperty;\n\
  import javafx.beans.property.SimpleObjectProperty;\nimport javafx.beans.value.ChangeListener;\n\
  import javafx.beans.value.ObservableValue;\nimport javafx.event.EventHandler;\n\
  import javafx.scene.input.KeyCode;\nimport javafx.scene.input.KeyEvent;\nimport\
  \ javafx.scene.input.MouseEvent;\nimport javafx.scene.layout.Pane;\nimport javafx.scene.shape.Shape;\n\
  \n/**\n * 文件名: DrawPane.java\n * (目录: DrawTool1.0/src/example1/drawtool/)\n * DrawPane\
  \ 是 Pane 的子类，它不对其子节点执行自动布局。\n *\n * 定义变量\n *   startX, startY, dragX, dragY 是用于存储双精度值的属性：\n\
  \ *\n *     startX/startY 指定了鼠标按下事件的坐标。\n *\n *     dragX/dragY 指定了从当前拖动位置到鼠标按下位置的平移距离。\n\
  \ *\n *   dragged 是一个布尔属性，其值初始化为 false，\n *   在第一次鼠标拖动事件发生时被设置为 true。\n *   当拖动事件结束时会被重置为\
  \ false，即\n *   当鼠标释放事件结束了一系列鼠标拖动事件时。\n *\n *   drawer, 是一个用于存储当前绘制器的属性，它是 ShapeDrawer\
  \ 的子类。\n *   ShapeDrawer 位于 drawtool 包中，是所有绘制器的基类。\n *\n * 注册事件句柄程序以处理以下事件：\n *\
  \  鼠标按下、鼠标拖动、鼠标释放、按键\n * 这些事件对于在绘板上交互式绘制形状至关重要。\n *\n * @author: Shufen Kuo\n */\n\
  public class DrawPane extends Pane {\n\n  /* 声明变量 */\n\n  // 鼠标按下时的鼠标位置\n  public\
  \ DoubleProperty startX = new SimpleDoubleProperty();\n  public DoubleProperty startY\
  \ = new SimpleDoubleProperty();\n  // 从鼠标拖动位置到\n  // 鼠标按下位置计算出的拖动距离\n  public DoubleProperty\
  \ dragX = new SimpleDoubleProperty();\n  public DoubleProperty dragY = new SimpleDoubleProperty();\n\
  \n  public BooleanProperty dragged = new SimpleBooleanProperty();\n\n  // 指定 pane\
  \ 的当前绘制器\n  // 应用程序可以创建多个绘制器并根据需要动态地在绘制器之间切换\n  public ObjectProperty<ShapeDrawer>\
  \ drawer = new SimpleObjectProperty<>();\n\n  // 将绘制器传递给构造函数\n  public DrawPane(ShapeDrawer\
  \ tool) {\n    this();\n    drawer.set(tool);\n  }\n\n  public DrawPane() {\n  \
  \  setOnMousePressed(new EventHandler<MouseEvent>() {\n      @Override\n      public\
  \ void handle(MouseEvent me) {\n        drawOnMousePressed(me);\n      }\n    });\n\
  \n    setOnMouseDragged(new EventHandler<MouseEvent>() {\n      @Override\n    \
  \  public void handle(MouseEvent me) {\n        drawOnMouseDragged(me);\n      }\n\
  \    });\n\n    setOnMouseReleased(new EventHandler<MouseEvent>() {\n      @Override\n\
  \      public void handle(MouseEvent me) {\n        drawOnMouseReleased(me);\n \
  \     }\n    });\n\n    // 将 focusTraversable 属性设置为 true 以处理 KeyEvent，\n    // 默认是\
  \ false。\n    setFocusTraversable(true);\n    setOnKeyPressed(new EventHandler<KeyEvent>()\
  \ {\n      @Override\n      public void handle(KeyEvent ke) {\n        drawOnKeyPressed(ke);\n\
  \      }\n    });\n  }\n\n  /**\n   * 此方法由鼠标按下事件句柄的 handle 方法调用\n   *\n   * 在关联属性中保留鼠标按下位置的坐标\n\
  \   */\n  protected void drawOnMousePressed(MouseEvent me) {\n    setStartX(me.getX());\n\
  \    setStartY(me.getY());\n  }\n\n  /**\n   * 此方法由鼠标拖动事件句柄的 handle 方法调用\n   *\n\
  \   * 将平移距离保留在 dragX 和 dragY 属性中，\n   * 它是从当前鼠标拖动位置到鼠标按下位置计算出的\n   *\n   * 当拖动动作开始时创建一个形状，\n\
  \   * 调用 getDrawer().getShapeClass() 方法来确定要创建哪个形状\n   */\n  protected void drawOnMouseDragged(MouseEvent\
  \ me) {\n    setDragX(me.getX() - getStartX());\n    setDragY(me.getY() - getStartY());\
  \ \n    if (!isDragged()) {\n      // 仅执行一次，并且在每个 PRESSED-DRAGGED-RELEASED 事件循环\n\
  \      // 中仅创建一次临时形状。\n      if (getDrawer() != null && getDrawer().getShapeClass()\
  \ != null) {\n        ShapeDrawer tool = getDrawer();\n        Shape sketch = tool.getShape();\n\
  \        if (sketch == null ||\n            !tool.getShapeClass().isInstance(sketch))\
  \ {\n          try {\n            Shape tmpShape = tool.getShapeClass().newInstance();\n\
  \            tmpShape.setFill(tool.getFillColor());\n            tmpShape.setStroke(tool.getStrokeColor());\n\
  \            tool.setShape(tmpShape);\n            getChildren().add(tmpShape);\n\
  \          } catch (InstantiationException | IllegalAccessException ex) {\n    \
  \      }\n        }\n      } \n      setDragged(true);\n      // onMouseDragStarted\
  \ 方法定义在 ShapeDrawer 中，从此处调用\n    }\n  }\n\n  // ... (后续方法省略，保持逻辑一致)\n}\n```\n\n\n\
  \n\n\n## 6.3 使用 Draw Tool APIs 开发绘制器应用程序\n\n在本节中，我们将开发几个应用程序，用于在画板上交互式绘制不同的形状对象。与之前开发的其他绘制器不同，在这里我们将利用\
  \ `drawtool` 包中定义的两个类——`ShapeDrawer` 和 `DrawPane` 来处理动态绘图中繁琐的低级任务。编码过程变得直观得多，每个绘制器只需实现\
  \ `ShapeDrawer` 类中定义的两个抽象方法：`onMouseDragStarted` 方法和 `onMouseDragFinished` 方法。\n\
  \n### 6.3.1 创建 `Application` 的子类 `RectangleDrawer` 类\n\n在这里，我们演示如何使用 `drawtool`\
  \ 包提供的 API 来开发 `RectangleDrawer` 应用程序，该程序用于在画板上绘制矩形形状。\n\n一旦检测到鼠标拖拽事件，就会创建一个矩形形状对象。在检测到鼠标拖拽事件之前，鼠标按下事件的位置被设定为矩形的起始点。随着鼠标拖拽事件的持续，矩形的终点会不断调整，以与最后一次鼠标拖拽事件的\
  \ x 坐标和 y 坐标保持一致。这是通过属性绑定机制实现的，请参阅 Listing 6-4.。\n\n为了创建一个有效的 `DrawPane` 实例（`Pane`\
  \ 的直接子类），我们将一个 `ShapeDrawer` 对象传递给 `DrawPane` 的构造函数。`ShapeDrawer` 知道要绘制什么形状以及如何绘制。具体来说，`shapeClass`\
  \ 属性指定了要在 `DrawPane` 上绘制形状，而 `onMouseDragStarted` 方法描述了如何绘制它。以下是创建 `DrawPane` 对象的代码行。\n\
  \n```\nDrawPane drawPane = new DrawPane(newRectangleDrawer()); \n```\n\n我们定义了一个\
  \ `newRectangleDrawer()` 方法，它返回一个 `ShapeDrawer` 对象，该对象在 `DrawPane` 上绘制矩形形状，请参阅 Listing\
  \ 6-4.。然后将 `DrawPane` 设置在 `BorderPane` 的中心作为画板。\n\n以下是 `RectangleDrawer` 类的完整源代码：\n\
  \nListing 6-13. `RectangleDrawer` 类的完整源代码：\n\n```\npackage rectangledrawer;\n\n\
  import javafx.application.Application;\nimport javafx.beans.binding.DoubleBinding;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.Pane;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.shape.Rectangle;\nimport javafx.stage.Stage;\n\
  import drawtool.*;\n\n/**\n * File Name: RectangleDrawer.java\n * (in directory:\
  \ DrawTool1.0/src/example1/rectangledrawer/)\n *\n * @author: Shufen Kuo\n */\n\n\
  public class RectangleDrawer extends Application {\n\n  @Override\n  public void\
  \ start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n    DrawPane\
  \ drawPane = new DrawPane(newRectangleDrawer());\n    rootPane.setCenter(drawPane);\n\
  \n    Scene scene = new Scene(rootPane, 600, 400, Color.FLORALWHITE);\n    stage.setScene(scene);\n\
  \    stage.setTitle(\"RectangleDrawer V1.0 Shufen Source Code\");\n    stage.show();\n\
  \  }\n\n  ShapeDrawer newRectangleDrawer() {\n    return new ShapeDrawer(Rectangle.class)\
  \ {\n      @Override\n      public void onMouseDragStarted(final DrawPane drawPane)\
  \ {\n\n        Rectangle rect = (Rectangle)getShape();\n\n        DoubleBinding\
  \ xB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \          return (drawPane.getDragX() < 0.0)\n              ? drawPane.getStartX()\
  \ + drawPane.getDragX() : drawPane.getStartX();\n          }\n        };\n\n   \
  \     DoubleBinding yB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragYProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return (drawPane.getDragY() < 0.0)\n                ? drawPane.getStartY()\
  \ + drawPane.getDragY() : drawPane.getStartY();\n          }\n        };\n\n   \
  \     DoubleBinding wB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragX());\n          }\n        };\n\n\
  \        DoubleBinding hB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragYProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragY());\n          }\n        };\n\n\
  \        rect.xProperty().bind(xB);\n        rect.yProperty().bind(yB);\n      \
  \  rect.widthProperty().bind(wB);\n        rect.heightProperty().bind(hB);   \n\
  \      }\n\n      @Override\n      public void onMouseDragFinished(final DrawPane\
  \ drawPane) {\n        Rectangle rect = (Rectangle)getShape();\n        if (rect\
  \ != null) {\n          rect.xProperty().unbind();\n          rect.yProperty().unbind();\n\
  \          rect.widthProperty().unbind();\n          rect.heightProperty().unbind();\n\
  \        }\n      }\n    };\n  }\n\n  public static void main(String[] args) {\n\
  \    launch(args);\n  }\n}\n```\n\n图 6-1. 使用 `RectangleDrawer` 绘制的\n\n### 6.3.2\
  \ 创建 `Application` 的子类 `CircleDrawer` 类\n\n在这里，我们演示如何使用 `drawtool` 包提供的 API 来开发\
  \ `CircleDrawer` 应用程序，该程序用于在画板上绘制圆形形状。\n\n一旦检测到鼠标拖拽事件，就会创建一个圆形形状对象。在检测到鼠标拖拽事件之前，鼠标按下事件的位置被设定为圆心的位置。随着鼠标拖拽事件的持续，圆的半径会不断调整，以与最后一次鼠标拖拽事件的\
  \ x 坐标和 y 坐标保持一致。这是在 `onMouseDragStarted` 方法内部通过属性绑定机制实现的。结果是你会看到圆的半径不断调整，使得最后一次鼠标拖拽的位置留在圆周上。\n\
  \n为了完成一个圆的绘制，我们需要处理解除绑定，这在 `onMouseDragFinished` 方法中完成，该方法由 `MOUSE_RELEASED` 事件的事件处理器调用，该事件结束了一系列鼠标拖拽事件。\n\
  \n为了实例化一个处理圆形绘制的 `ShapeDrawer`，我们按照如下定义了 `newCircleDrawer` 方法：\n\n\n\n\n\n```java\n\
  \ ShapeDrawer newCircleDrawer() {\n    return new ShapeDrawer(Circle.class) {\n\
  \      @Override\n      public void onMouseDragStarted(final DrawPane drawPane)\
  \ {\n\n        Circle cs = (Circle)getShape();\n\n        DoubleBinding rB = new\
  \ DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty(),\
  \ drawPane.dragYProperty());\n          }\n\n          @Override\n          protected\
  \ double computeValue() {\n            double dx = drawPane.getDragX();\n      \
  \      double dy = drawPane.getDragY();\n            return Math.sqrt(dx*dx + dy*dy);\n\
  \          }\n        };\n        cs.centerXProperty().bind(drawPane.startXProperty());\n\
  \        cs.centerYProperty().bind(drawPane.startYProperty());\n        cs.radiusProperty().bind(rB);\n\
  \      }\n\n      @Override\n      public void onMouseDragFinished(final DrawPane\
  \ drawPane) {\n        Circle cs = (Circle)getShape();\n        if (cs != null)\
  \ {\n          cs.centerXProperty().unbind();\n          cs.centerYProperty().unbind();\n\
  \          cs.radiusProperty().unbind();\n        }\n      }\n    };\n  }\n```\n\
  \n从前面的代码列表中，我们看到圆形状的中心点、`centerX` 属性和 `centerY` 属性绑定到了鼠标按下事件的位置，这些位置分别定义在 `DrawPane`\
  \ 类的 `startX` 属性和 `startY` 属性中。此外，我们将圆的半径绑定到了如下方式计算的拖拽距离：\n\n```java\n @@Override\n\
  \          protected double computeValue() {\n            double dx = drawPane.getDragX();\n\
  \            double dy = drawPane.getDragY();\n            return Math.sqrt(dx*dx\
  \ + dy*dy);\n          } \n```\n\n`dragX` 和 `dragY` 是在 `DrawPane` 类中定义的属性，请参阅定义属性\
  \ (DrawPane)。\n\n`DrawPane` 实例创建方式如下：\n\n```java\n DrawPane drawPane = new DrawPane(newCircleDrawer());\
  \ \n```\n\n`newCircleDrawer()` 方法返回一个 `ShapeDrawer` 对象，该对象作为参数传递给 `DrawPane` 类的构造函数。创建一个\
  \ `DrawPane` 实例作为放置在 `BorderPane` 中心区域的画板。\n\n以下是 `CircleDrawer` 类的完整源代码：\n\n列表\
