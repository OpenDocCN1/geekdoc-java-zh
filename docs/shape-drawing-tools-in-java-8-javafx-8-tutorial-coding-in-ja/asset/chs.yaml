  \ 类中，返回一个新的计算 `DoubleExpression` 与给定 `NumberValue` 之和的 `DoubleBinding`。\n\n    ```\n\
  \    KeyEvent\n    ``` 类位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent`\
  \ 的子类。它提供了如 `isControlDown()`、`isShiftDown()`、`isAltDown()` 等布尔方法，用于验证修饰键是否按下。\n\
