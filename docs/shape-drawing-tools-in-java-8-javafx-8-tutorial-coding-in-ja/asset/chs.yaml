  \ ENTER:\n            // 当你完成折线的所有线段后，按下 ENTER 键完成绘制，\n            // 下一个 MOUSE_PRESSED\
  \ 事件将启动新折线的第一个线段。\n            // (此处逻辑在示例代码中主要为注释说明)\n            break;\n    \
  \      case ESCAPE:\n            // 要取消此折线，按下 ESCAPE 键\n            break;\n   \
