  \ {\n    tmpShape.setFill(drawTool.getFillColor());\n    tmpShape.setStroke(drawTool.getStrokeColor());\n\
  \    if (drawTool.getStrokeWidth() > 0)\n      tmpShape.setStrokeWidth(drawTool.getStrokeWidth());\n\
