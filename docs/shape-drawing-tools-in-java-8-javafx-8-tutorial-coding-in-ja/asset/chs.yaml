  \ 等事件类型，并提供了如 `getCode()`、`getCharacter()`、`getText()` 等方法来获取以 `KeyCode` 或 `String`\
  \ 类型表示按键信息。它还提供了一些布尔方法，如 `isControlDown()`、`isShiftDown()`、`isAltDown()` 等，用于验证某些修饰键是否同时被按下。\n\
  \n    （查看此处, 此处）\n\n*   ```java\n    public final void setOnKeyPressed(EventHandler<?\
