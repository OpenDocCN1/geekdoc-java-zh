- "# Java 8 形状绘图工具：JavaFX 8 教程（JavaFX 逐步编码构建图形工具包指南第 2 卷）\n\n\n\n![](img/00046.jpeg)\n\
  \n\n\n## JavaFX 历史\n\n现在让我们回顾 JavaFX 的时间线：\n\nSun 公司于 2005 年 9 月收购了 Spring，并在 2007\
  \ 年 5 月开发了名为 JavaFX 的语言。2008 年 12 月发布 JavaFX 1.0。2010 年 1 月，Oracle 完成对 Sun 公司的收购并继续维护\
  \ JavaFX。2010 年 9 月 JavaOne 大会上，Oracle 宣布将放弃 JavaFX Script。2011 年 10 月发布 JavaFX\
  \ 2.0，开发者开始使用标准 Java 语言而非 JavaFX Script 来访问 JavaFX。2013 年 2 月发布 JavaFX 2.2.7，JavaFX\
  \ SDK 和 Runtime 被包含在 JDK 7 中。JavaFX 与 JDK 的带来了极大的便利。使用 JDK 7 及更高版本编译的 JavaFX 应用不再需要额外安装。2014\
  \ 年 3 月 18 日，JavaFX 8 作为 Java™ SE 开发工具包 (JDK 8) 的一部分发布。截至本书 2016 年 3 月出版，最新的 JDK\
  \ 版本为：2015 年 10 月 20 日的 JDK 866 以及 2016 年 1 月的 JDK 872。JDK 9 的可用发布计划为 2017 年 3 月\
  \ 23 日。\n\n## 前提条件\n\n书中介绍的 JavaFX 应用使用提供的 包构建 GUI。不需要 Swing 包，但读者必须熟悉 Java 语言的基础。如果你是\
  \ Java 新手，请访问此网站 [`docs.oracle.com/javase/tutorial/index.html`](http://docs.oracle.com/javase/tutorial/index.html)\
  \ 获取 Java 技术的初步知识。按以下顺序阅读 Oracle 在线文档：\n\n1.  简单的 Java 应用程序“Hello World!”与安装：[`docs.oracle.com/javase/tutorial/getStarted/index.html`](http://docs.oracle.com/javase/tutorial/getStarted/index.html)\n\
  2.  Java 语言的概念和特性：[`docs.oracle.com/javase/tutorial/java/index.html`](http://docs.oracle.com/javase/tutorial/java/index.html)\n\
  3.  Java 集合框架：[`docs.oracle.com/javase/tutorial/collections/index.html`](http://docs.oracle.com/javase/tutorial/collections/index.html)\n\
  \n\n\n\n\n访问 [`docs.oracle.com/javase/tutorial/essential/index.html`](http://docs.oracle.com/javase/tutorial/essential/index.html)\n\
  \n# JavaFX 概览\n\n以下示例旨在为 JavaFX 初学者提供帮助，帮助他们快速预览如何创建一个 JavaFX 应用程序。\n\n要开始学习，你需要创建一个扩展\
  \ `javafx.application.Application` 的类，该类是 JavaFX 程序的入口点，并重写必须被覆盖的抽象 `start` 方法。以下是一个典型的\
  \ `start` 方法示例：\n\n```java\n package imageviewer;\n\nimport javafx.application.Application;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\nimport javafx.scene.layout.StackPane;\n\
  import javafx.stage.Stage;\n\n/**\n * File Name: ImageViewer.java\n *\n * @author\
  \ Shufen Kuo\n */\n\npublic class ImageViewer extends Application {\n\n  @Override\n\
  \  public void start(Stage stage) {\n    BorderPane rootPane = new BorderPane();\n\
  \    StackPane imageArea = new StackPane();\n    rootPane.getChildren().add(imageArea);\n\
  \n    Scene scene = new Scene(rootPane, 600, 400); \n    stage.setTitle(\"ImageViewer\
  \ V1.0\");\n    stage.setScene(scene);\n    stage.show();\n  }\n\n  public static\
  \ void main(String[] args) {\n    launch(args);\n  }\n}\n```\n\n## Scene（场景）与 Stage（舞台）\n\
  \n`start` 方法中出现了两个重要的类：`Scene` 和 `Stage`。通常情况下，主要任务是创建在名为场景图（scene graph）的层级树结构中管理的图形用户界面（GUIs），将场景图的根节点与\
  \ `Scene` 对象关联，然后将场景放置在 `Stage` 对象上。`Stage` 代表 JavaFX 应用程序的顶层容器，作为场景图的窗口，与应用程序用户进行交互。\n\
  \n下面的快照让你对我们将构建的 JavaFX 应用程序的 GUI 外观有一个初步概念：\n\n图 1. JavaFX 应用程序快照。\n\n![](img/00002.jpeg\
  \ \"javafx_app_guis.jpg\")\n\n## Nodes（节点）\n\nJavaFX 引入了一个基础类 `javafx.scene.Node`，它继承自\
  \ `java.lang.Object`，并为所有可用用户界面提供了常用的属性和方法。我们经常使用“节点”一词来指代 GUI。\n\n场景图可能包含各种节点。节点可以是父节点（拥有子节点的节点）或叶子节点（没有子节点的节点）；每个节点只有一个父节点，根节点没有父节点。场景图中的所有节点都派自\
  \ `javafx.scene.Node` 类。\n\n为了快速掌握场景图中节点类型的精髓，我们将根据它们是否能够添加子节点来对其进行区分。\n\n*   你可以向这些节点添加子节点：\n\
  \    以下类经常被用作父节点：`Group`、`Pane` 以及内置布局面板（它们是 `Pane` 的直接子类）。通常，你调用 `getChildren()`\
  \ 方法获取一个类型为 `ObservableList<Node>` 的列表（它是 `java.util.List` 的子接口），然后使用 Java 开发者熟悉的、定义在\
  \ `Collection` 接口中的基本工具类来操作列表的内容。\n\n*   你不能向这些节点添加子节点：\n    以下类始终被用作叶子节点：`Canvas`、`ImageView`、`MediaView`\
  \ 以及所有 `Shape` 的直接子类，如 `Rectangle`、`Circle`、`Ellipse` 等。\n\n## JavaFX 与 Swing\n\n\
  现在，有一个有趣的问题。多年来，Java 开发者一直使用 Swing API（Java Foundation Classes JFC 的 GUI 组件）来构建\
  \ Java 应用程序的 GUI，为什么除了 Swing 还需要 JavaFX？\n\n如果你有大量使用 Swing 编写的遗留代码，并希望在 Swing 代码中引入\
  \ JavaFX 特性，JDK 8 提供了机制；反之，你可以在 JavaFX 应用程序中包含 Swing 组件。\n\n本书未涵盖 JavaFX-Swing 互操作性的话题。如果你对此主题感兴趣，请在此访问\
  \ Oracle 在线文档“JavaFX: Interoperability -- JavaFX-Swing Interoperability”：\n\n[`docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm`](http://docs.oracle.com/javase/8/javafx/interoperability-tutorial/fx_swing.htm)\n\
  \nJavaFX 是下一代 Java GUI。为了说明使用 JavaFX 能力的优势，除了 JavaFX 和 Swing 之间的互操作性外，我们在下面的章节中介绍了\
  \ JavaFX 的重要特性。\n\n## JavaFX 的精髓\n\nJavaFX 不仅允许你快速创建具有视觉用户界面的应用程序，还包含引人注目且独特的功能。它们如下：\n\
  \n### 内置布局面板（Layout Panes）\n\nJavaFX 的布局面板是能够自动对节点执行各种类型布局的容器。你可以在布局面板中放置任意数量的节点，节点本身也是节点，因此也可以嵌套另一个布局面板。使用布局面板的主要优势是避免手动指定每个节点的大小和位置的繁琐。由于场景图中的节点是以树结构管理的，布局算法会根据其布局类型和指定的布局属性递归计算每个节点的大小和位置，并在窗口大小调整事件发生时动态触发重新计算。\n\
  \n共有 8 种内置布局面板，位于 `javafx.scene.layout` 中：\n\n`BorderPane`\n`BorderPane` 将节点分别放置在五个位置，以创建经典的外观：顶部用于菜单栏或工具栏，底部用于状态栏，左右区域用于导航面板，中心区域用于工作区。\n\
  \n`HBox`\n`HBox` 将节点放置在一行中（水平方向）。\n\n`VBox`\n`VBox` 将节点放置在一列中（垂直方向）。\n\n`GridPane`\n\
  `GridPane` 将节点放置在多行多列的网格中。显示键值对属性的方便界面。\n\n`StackPane`\n`StackPane` 将所有节点堆叠在中心，对齐方式为中心。子节点在容器中心相互重叠，后创建的节点位于先节点之上。但你可以使用静态方法\
  \ `StackPane.setAlignment(Node child, Pos value)` 和 `StackPane.setMargin(Node child,\
  \ Insets value)` 来调整每个节点的强制性位置。\n\n`FlowPane`\n你可以指定 `FlowPane` 的方向属性。对于水平 `FlowPane`，节点从左到右排列，在容器宽度边界处换行。对于垂直\
  \ `FlowPane`，节点从上到下排列，在容器高度边界处换列。\n\n`TilePane`\n`TilePane` 与 `FlowPane` 类似，但 `TilePane`\
  \ 网格中的每个单元格大小相同。\n\n`AnchorPane`\n`AnchorPane` 根据指定的锚点放置节点，共有四个锚点：`topAnchor`、`rightAnchor`、`bottomAnchor`\
  \ 和 `leftAnchor`。\n\n#### 参考 Oracle 在线文档“Working with Layouts in JavaFX”：\n\n[`docs.oracle.com/javase/8/javafx/layout-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/layout-tutorial/index.html)\n\
  \n### 使用 CSS 自定义\n\nJavaFX 允许使用 CSS（层联样式表）描述应用程序用户界面的样式。使用 CSS 定义显示属性（如颜色、字体、边距、内边距、宽度、高度、线条、背景图像等）并将与代码分离，在许多方面显示出显著的便利性：\n\
  \n*   软件提供者的自定义：\n    从同一组代码编译的应用程序可以具有不同的样式，以满足不同的客户需求。\n\n*   应用程序用户的自定义：\n  \
  \  即使在软件发布后，如果应用程序用户对 UI 的外观有偏好，在客户现场修改 CSS 文件中定义的显示属性也是可行的。\n\n\n\n\n\n## 对演示样式设计者的优势\n\
  \n将应用程序代码与演示样式定义分离可以提高代码的可读性，并让图形设计师专注于处理 `CSS`，从而简化了任务。\n\n## 对软件开发人员的优势\n\n在测试过程中，开发者可能需要频繁更改\
  \ `CSS` 文件中定义的样式属性，以评估 GUI 的多样化外观。如果每次更改都必须退出并重启程序，那将是一项非常麻烦的任务。为了方便这一评估过程，最佳策略是设计一个临时的\
  \ `Load` 按钮，当任何样式属性发生变化时，只需点击该按钮重新加载 `CSS`，而无需退出并重启应用程序，从而节省大量的测试时间。\n\n## JavaFX\
  \ 中 CSS 与 HTML 中 CSS 的相似性\n\nJavaFX 中的 `CSS` 语法与 HTML 中的 `CSS` 相同，因此任何具有浏览器 `CSS`\
  \ 经验的设计师都可以极少的学习成本为 JavaFX 应用程序的 UI 设置样式。\n\n#### 参考 Oracle 在线文档“使用 CSS 装饰 JavaFX\
  \ 应用程序”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/css_tutorial.htm)\n\
  \n## 使用 FXML 创建用户界面\n\nFXML 是一种符合 `XML`（可扩展标记语言）格式并带有额外规则的标记语言，用于创建 JavaFX 应用程序的用户界面。考虑到手动编写\
  \ `FXML` 容易出错，一种可行的方法是通过 GUI 生成器生成 `FXML` 代码。\n\n在本系列书籍中，我们介绍了一个实用的应用程序 `JFXDrawTools`，它是一种专门用于创建派自\
  \ `Shape` 的子类实例的 GUI 生成器。用户可以交互地创建一个草图（无论是 `Shape` 还是 `ImageView`），操作其属性并将编辑结果保存为\
  \ `FXML` 格式的文件，这些文件随后可以被加载回来以继续编辑过程，或者被其他 JavaFX 应用程序动态加载。\n\n将应用程序的 GUI（视图）与其业务逻辑（模型）分离被认为是一种良好的编程实践。`FXML`\
  \ 文件表示视图，而控制器是一个在视图和模型之间传递信息的 Java 类。使用 `FXML` 构建 GUI 能够让应用程序开发人员有效地采纳 `MVC`（模型-视图-控制器）架构。\n\
  \n#### 参考 Oracle 在线文档“JavaFX: 掌握 FXML”：\n\n[`docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/fxml-tutorial/index.html)\n\
  \n## 属性与绑定的吸引人能力\n\nJavaFX 特有的 `Properties` 概念遵循了 `JavaBeans` 组件中引入的设计规范，它通常与 `Binding`\
  \ 机制结合使用，整体上为各种编程需求提供了强大且优雅简洁的解决方案。\n\n在本系列书籍介绍的 `JFXDrawTools` 中，我们充分演示了 `Properties`\
  \ 和 `Binding` 的用法。在 `Properties` 窗口的实现中，使用了合适的 UI （如文本字段、选择框、组合框等）来查看相关对象的属性。`Binding`\
  \ 机制用于将 UI 控件与其对象的相应属性进行双向链接，这种关系在 `Properties` 窗口即将显示时建立。当用户更改 UI 控件显示的数据时，更改会立即反映到相关对象的相应属性上。\n\
  \n#### 参考 Oracle 在线文档“JavaFX: 属性与绑定教程”：\n\n[`docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/properties-binding-tutorial/index.html)\n\
  \n## 变换与过渡的复杂机制\n\nJavaFX 内置的节点变换功能对于开发图形编辑器、绘图工具、图像查看器、GUI 生成器等图形包非常方便。\n\n以下是处理变换的类：`Translate`、`Rotate`、`Scale`\
  \ 和 `Shear`。它们都派自 `Transform` 类并位于 `javafx.scene.transform` 包中。\n\nJavaFX 过渡为创建动画提供了简洁的方法。许多应用程序都需要动画功能，这里是一些用例：在警报情况下引起注意、在删除操作期间将对象丢入回收箱、在数据加载期间指示中间状态……\n\
  \n在本系列书籍介绍的 `ImageViewer` 应用程序中，我们将幻灯片功能中的图像对象应用了 `FadeTransition` 和 `ParallelTransition`，以便同时新图像淡入且旧图像淡出。\n\
  \n以下是处理过渡的类：`FadeTransition`、`RotateTransition`、`ScaleTransition`、`TranslateTransition`、`FillTransition`、`StrokeTransition`、`PathTransition`、`ParallelTransition`、`SequentialTransition`、`PauseTransition`。它们都派自\
  \ `Transition` 类（一个定义动画基本功能的抽象类），并位于 `javafx.animation` 包中。\n\n#### 参考 Oracle 在线文档“JavaFX:\
  \ 变换、动画和视觉效果”：\n\n[`docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/visual-effects-tutorial/index.html)\n\
  \n## 2D 几何原语和文本都是 JavaFX 节点\n\nJavaFX 提供了一个 `Shape` 类，它扩展了 `javafx.scene.Node` 类，是\
  \ 2D 几何基础的基类。在几何原语上应用面向对象的概念有助于图形应用程序的。\n\n以下是派自 `Shape` 类的类：`Arc`、`Circle`、`CubicCurve`、`Ellipse`、`Line`、`Path`、`Polygon`、`Polyline`、`QuadCurve`、`Rectangle`、`SVGPath`、`Text`。除了\
  \ `Text` 类外，其他类均位于 `javafx.scene.shape` 包中。\n\n请注意，位于 `javafx.scene.text` 包的 `Text`\
  \ 类也被视为一种形状，它赋予了文本绘制工具开发能力。适用于 JavaFX 节点的所有功能都可以像处理几何形状一样处理它。文本对象可以放在布局面板中利用自动放置功能，应用变换和过渡，以及使用\
  \ `CSS` 自定义演示样式。\n\n#### 参考 Oracle 在线文档“在 JavaFX 中使用文本”：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/text-settings.htm)\n\
  \n\n\n\nJavaFX 架构中嵌入了一个 Web 引擎组件，并提供了一套位于 `javafx.scene.web` 包中的 API，用于开发具有 浏览器功能的应用程序。要查看网页，首先需要创建一个\
  \ `WebView` 对象，该对象继承自 `javafx.scene.Parent` 并继承了节点（node）的所有特性，然后获取与其关联的 `WebEngine`。`WebEngine`\
  \ 提供了与操作网页相关的方法，例如：通过给定的 URL 或页面内容加载/显示网页、访问由 `WebEngine` 为加载的网页创建的文档对象模型（DOM）、处理由\
  \ JavaScript 触发的各种事件……等。\n\n## 对 Oracle 在线文档“JavaFX: Adding HTML Content to JavaFX\
  \ Applications”的参考：\n\n[`docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html`](http://docs.oracle.com/javase/8/javafx/embedded-browser-tutorial/index.html)\n\
  \n### 用于编辑 HTML 页的 `HTMLEditor` 类\n\n对 HTML 编辑能力的完整支持来自 `HTMLEditor` 类，它继承自 `javafx.scene.control.Control`\
  \ 并位于 `javafx.scene.web` 包中。要在你的 JavaFX 应用程序中嵌入 HTML 编辑器，只需创建 `HTMLEditor` 的实例，并将其添加到场景图（scene\
  \ graph）中，然后就可以与用户交互了。以下两个方法用于获取和设置编辑器的 HTML 内容：`getHtmlText()`，`setHtmlText(java.lang.String\
  \ htmlText)`。\n\n与处理多行纯文本的类似控件 `TextArea` 不同，`HTMLEditor` 的是符合 HTML 语法的文本。\n\nHTML\
  \ 编辑器的用法在软件各个领域被广泛需要，例如：博主撰写文章发布（内容管理系统）、邮件系统用户编写消息（消息系统）、在线卖家为商品上架准备产品描述（电子商务管理系统）……等。\n\
  \n## 对 Oracle 在线文档“JavaFX: Working with JavaFX UI Components -- HTML Editor”的参考：\n\
  \n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/editor.htm)\n\
  \n### 用于渲染数据的图表组件\n\n以下类位于 `javafx.scene.chart` 包中，用于绘制各种类型的图表：\n\n*   `AreaChart`,\
  \ `StackedAreaChart`\n*   `BarChart`, `StackedBarChart`\n*   `BubbleChart`\n*  \
  \ `LineChart`\n*   `PieChart`\n*   `ScatterChart`\n\n`Chart` 类是所有图表组件的基类，继承自 `javafx.scene.layout.Region`\
  \ 类，因此继承了来自 `javafx.scene.Node` 类的所有适用特性。\n\n## 对 Oracle 在线文档“JavaFX: Working with\
  \ JavaFX UI Components -- Working with JavaFX Charts”的参考：\n\n[`docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm`](http://docs.oracle.com/javase/8/javafx/user-interface-tutorial/charts.htm)\n\
  \n### 用于播放媒体的 `MediaView` 类\n\n`MediaView` 类继承自 `javafx.scene.Node`，与 `MediaPlayer`\
  \ 和 `Media` 类一起使用，在你的 JavaFX 应用程序中播放媒体。所有与媒体相关的类都位于 `javafx.scene.media` 包中。\n\n\
  ## 对 Oracle 在线文档“JavaFX: Incorporating Media Assets Into JavaFX Applications”的参考：\n\
  \n[`docs.oracle.com/javase/8/javafx/media-tutorial/`](http://docs.oracle.com/javase/8/javafx/media-tutorial/)\n\
  \n## JavaFX 基础 UI 组件\n\n除了上述的 JavaFX 核心之外，JavaFX 还提供了基础 UI 组件，它们位于 `javafx.scene.control`\
  \ 包中并派自 `javafx.scene.control.Control` 类；它们通常被称为 UI 控件。\n\n以下是可用的 UI 控件，未标记星号 (*)\
  \ 的控件在 Swing 中有对应的相似控件：\n\n*   `Label`, `Button`, `RadioButton`, `ToggleButton`,\n\
  *   `CheckBox`, `ChoiceBox`,\n*   `ComboBox`, `ListView`, `TableView`,\n*   `TextField`,\
  \ `TextArea`, `PasswordField`, `HTMLEditor`(*)\n*   `ScrollBar`, `ScrollPane`, `Slider`,\
  \ `ProgressBar`, `ProgressIndicator`(*), `ToolBar`,\n*   `MenuBar`, `MenuButton`,\
