  ```\n\n### 2.1.1 创建 `Polyline` 实例\n\n`Polyline` 对象在 `MOUSE_DRAGGED` 事件的处理程序内部创建。在完成折线所有线段的绘制之前，它被设置为\
  \ `shape` 属性的当前值。当按下 `Enter` 键时，`shape` 的值被重置为 `null`，从而完成形状；或者按下 `Esc` 键，取消形状。\n\
  \n要了解如何使用 `Node` 类提供的便利方法注册事件处理程序来处理鼠标事件和键事件，请阅读第 1 章中的节 1.2.1 使用便利方法注册事件处理器 和节\
  \ 1.4 获取按键事件的键码。\n\n以下是在处理 `MOUSE_DRAGGED` 事件的处理程序内部创建 `Polyline` 实例的代码。\n\n导入语句：\n\
  \n```java\nimport javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.event.EventHandler;\nimport javafx.scene.input.MouseEvent;\nimport\
  \ javafx.scene.paint.Color;\nimport javafx.scene.shape.Shape;\nimport javafx.scene.shape.Polyline;\n\
  ```\n\n\n\n`Line Drawer` 和 `Polyline Drawer` 实现之间的主要区别位于 `onMouseDragStarted()`\
  \ 方法中。该方法在发生第一次拖拽事件时，由 `MOUSE_DRAGGED` 事件的事件处理程序调用。\n\n对于 `Polyline Drawer`，在这里执行了以下两个任务：\n\
  \n*   创建一个临时的 `Line` 对象，其起点设置为鼠标按下的位置，终点绑定到一个 `DoubleBinding` 对象上，该对象用于计算起始位置和平移距离之和。\n\
  *   验证当前绘制线段的起点是否与上一个线段的终点相同。如果它们不相同，说明当前线段与上一个段没有连接，我们将把当前线段的起点添加到 `Polyline` 的点列表中。\n\
  \    *   请注意，上一个线段的终点可以在 `Polyline` 的点列表中找到，它存储在点列表的最后两个单元格中。\n    *   如果 `Polyline`\
  \ 的点列表包含空点，则意味着当前绘制的线段是 `Polyline` 的第一段，只需将该线段的起点添加到点列表中，它将成为 `Polyline` 的第一个点。\n\
  \n### Import Statements:\n\n```\nimport javafx.collections.ObservableList;\n```\n\
  \n### Listing 2-6. 实现 `onMouseDragStarted()` 方法，该方法由 MOUSE_DRAGGED 事件的事件处理程序调用：\n\
  \n```java\n void onMouseDragStarted() {\n    Line tmpLine = new Line();\n    //\
  \ 将 tmpLine 设置为 line 属性的值，\n    // 结果是它将被添加到绘制板的子列表中，\n    // 在 line 属性的监听器内部。\n\
  \    line.set(tmpLine);\n    tmpLine.setStroke(Color.AQUA);\n    tmpLine.setStartX(startX.get());\n\
  \    tmpLine.setStartY(startY.get());\n    tmpLine.endXProperty().bind(startX.add(translateX));\n\
  \    tmpLine.endYProperty().bind(startY.add(translateY));\n\n    Polyline polyline\
  \ = (Polyline)getShape();\n    // 验证此线的起点是否与上条线的终点相同\n    // 如果不相同，说明此段与上一个段没有连接，\n\
  \    // 我们将此段的起点添加到 polyline 的点列表中。\n    ObservableList<Double> list = polyline.getPoints();\n\
  \    if (list.size() > 1) {\n      // 检查最后一个点是否与此线的起点相同\n      double lastX = list.get(list.size()-2);\n\
  \      double lastY = list.get(list.size()-1);\n      // 如果此段的起点与 polyline 点列表中的\n\
  \      // 最后一点重合，\n      // 无需将起点 polyline\n      if (lastX != startX.get() && lastY\
  \ != startY.get()) {\n        // 将起点添加到 polyline\n        polyline.getPoints().addAll(startX.get(),\
  \ startY.get());\n      }        \n    } else {\n      // 点列表中还没有点，\n      // 将起点添加到点列表中，\n\
  \      // 这就是 polyline 的起始点。\n      polyline.getPoints().addAll(startX.get(), startY.get());\n\
  \    }\n  }\n```\n\n### 2.1.4 实现 `onMouseDragFinished()` 方法\n\n`onMouseDragFinished()`\
  \ 方法由 `MOUSE_RELEASED` 事件的事件处理程序调用。\n\n它执行以下任务：\n\n*   取消绑定 `Line` 的终点。并将 `line`\
  \ 属性的值设置为 `null`，导致该线从绘制板中移除，参见 `line` 属性监听器的代码。\n*   将 `Line` 的终点添加到 `Polyline`\
  \ 的点列表中，该点列表临时存储在 `shape` 属性中。\n\n`MOUSE_DRAGGED` 事件随后的 `MOUSE_RELEASED` 事件完成了 `Polyline`\
  \ 中一个段的绘制。\n\n### Listing 2-7. 实现 `onMouseDragFinished()` 方法，该方法由 MOUSE_RELEASED\
  \ 事件的事件处理程序调用：\n\n```java\n void onMouseDragFinished() {\n    Line tmpLine = line.get();\n\
  \    if (tmpLine != null) {\n      tmpLine.endXProperty().unbind();\n      tmpLine.endYProperty().unbind();\n\
  \      line.set(null); // 清除此线\n    }\n\n    Polyline polyline = (Polyline)getShape();\n\
  \    // 处必须验证 shape 不为空\n    // 如果按了 Enter 键或 Esc 键，shape 将设置为 null\n    if (polyline\
  \ != null) {\n      // 将当前线的终点添加到 polyline\n      polyline.getPoints().addAll(startX.get()\
  \ + translateX.get(),\n        startY.get() + translateY.get());\n    }\n  }\n```\n\
  \n## 2.2 `PolylineDrawer` 类的完整源代码\n\n与前一章中的 `LineDrawer` 类相比，更改已用**粗体**显示：\n\n###\
