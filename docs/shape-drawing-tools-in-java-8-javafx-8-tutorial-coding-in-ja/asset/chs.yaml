  \n  (参见章节：在默认构造函数中注册事件处理器, 对 `ENTER` 键、`ESCAPE` 键和 `DELETE` 键执行默认操作)\n\n* `focusTraversable`\
  \ 是 `Node` 类中定义的一个属性，用于指定该节点是否可以通过并有资格接收焦点。\n\n  (参见 此处)\n\n* `KeyCode` 类位于 `javafx.scene.input`\
