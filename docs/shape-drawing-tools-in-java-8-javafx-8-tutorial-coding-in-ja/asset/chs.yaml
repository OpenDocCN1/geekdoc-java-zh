  \ 总结\n\n本章介绍了 JavaFX 库的以下关键方面，按它们在章节中出现的顺序列出：\n\n* `Polyline` 位于 `javafx.scene.shape`\
  \ 包中，是 `javafx.scene.shape.Shape` 的直接子类。使用 `getPoints()` 方法获取一个类型为 `ObservableList<Double>`\
  \ 的列表，然后使用 `Collection` 接口定义的基本工具，将一组存储在 `Double` 值数组中的 x 和 y 坐标添加到列表中，这些坐标表示 `Polyline`\
  \ 的点。\n\n    （参见节 [作为 `Shape` 的子类创建 `PolylineDrawer` 类]）\n\n* 某些类位于 `javafx.beans`\
  \ 中：\n\n    `PolyProperty`，\n\n    是一个派自 `ObjectProperty` 的抽象类，实现了 `WritableValue`。\n\
  \n    （参见节 [`PolylineProperty`）\n\n* `Line` 类位于 `javafx.scene.shape` 中，是 `Shape`\
  \ 的直接子类之一。\n\n    （参见节 [`Polyline`）\n\n* `addListener(ChangeListener<? super T>\
  \ listener)` 方法定义在 `javafx.beans` 中，用于在属性更改时添加一个监听器。\n\n* `bind(ObservableValue<?\
  \ extends T> observable)` 和 `unbind()` 是定义在 `Property` 中的方法，用于为该属性创建或移除绑定。（参见[此处]）\n\
  \n* `public DoubleBinding add(NumberValue other)` 方法由 `javafx.beans.DoubleExpression`\
  \ 类，返回一个新的 `DoubleBinding`，该绑定计算此 `DoubleExpression` 与给定的 `NumberValue` 之和。\n\n\n\
  \n\n\n```\n Polygon polygon = new Polygon();\n  Double[] dArray = {\n      50.0,\
  \ 20.0,\n      220.0, 170.0,\n      50.0, 320.0,\n      50.0, 250.0,\n      140.0,\
  \ 170.0,\n      50.0, 90.0};\n  polygon.getPoints().addAll(dArray);\n  polygon.setFill(Color.web(\"\
  #B3E6E6\"));\n  polygon.setStroke(Color.BLACK);\n```\n\n下面的快照显示了上述代码渲染的 `Polygon`结果：\n\
