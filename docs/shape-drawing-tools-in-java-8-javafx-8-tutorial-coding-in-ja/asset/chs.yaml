  \  void set(boolean value)\n  ```\n\n  设置封装的值。它接受原始类型 boolean。\n\n  (参见 此处)\n\n\
  * `WritableDoubleValue` 接口位于 `javafx.beans.value` 包并继承自 `WritableNumberValue`，定义了以下方法：\n\
