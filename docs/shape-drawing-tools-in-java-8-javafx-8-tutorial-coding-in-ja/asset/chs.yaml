  \ 和紧随其后的 `QuadCurveTo`。\n\n`MoveTo` 元素是鼠标点击的结果（在图 5-1 步骤 1 的结束处）。\n\n而 `QuadCurveTo`\
  \ 元素在拖动开始时创建（在图 5-1 步骤 3 的开始）。二次贝塞尔曲线从上一个元素指定的坐标绘制到鼠标按下的位置。\n\n有两种方法可以在图 5-1 所示的同一条路径中创建更多更多的二次贝塞尔曲线：\n\
  \n1.  创建一个与上一条曲线不相连的新曲线：\n    重复从步骤 1 到步骤 4 的动作序列。\n2.  创建一个与上一条曲线连接的新曲线：\n    跳过鼠标点击事件（步骤\
  \ 1 所示），只需将鼠标移动到新位置并按下鼠标不松开，拖动它直到你对曲线形状满意，然后释放鼠标。鼠标按下事件的位置是新曲线的终点，而上一条曲线的终点是新曲线的起点。\n\
