  \ 类\n\n与 `ShapeDrawer` 的其他子类不同，`ShapeMover` 在鼠标拖拽事件发生时并不执行任何绘制，它是在绘图板上移动目标节点。\n\n\
  \n\n\n\n```\n public abstract void onMouseDragStarted(DrawPane drawPane)\n  public\
  \ abstract void onMouseDragFinished(DrawPane drawPane) \n```\n\n绘制器（drawer）与移动器（mover）在实现上的主要区别在于，移动器的\
  \ `shapeClass` 属性值被设置为 `null`，并传递给父类的构造函数。\n\n以下是 `ShapeMover` 类的源代码。\n\n### 列表\
  \ 7-20. 实现 `ShapeMover` 类，它是 `ShapeDrawer` 的直接子类：\n\n```java\npackage drawtool.drawer;\n\
  \nimport javafx.event.EventTarget;\nimport javafx.scene.Node;\nimport javafx.scene.shape.Shape;\n\
  import javafx.scene.input.MouseEvent;\nimport drawtool.*;\n\n/**\n * File Name:\
  \ ShapeMover.java\n * (in directory: DrawTool1.1/src/example1/drawtool/drawer)\n\
  \ *\n * @author: Shufen Kuo\n */\n\npublic class ShapeMover extends ShapeDrawer\
  \ {\n\n  public ShapeMover() {\n    super(null);\n  }\n\n  @Override\n  public void\
  \ onMouseDragStarted(final DrawPane drawPane) {\n    MouseEvent me = drawPane.getMouseEvent();\n\
  \n    if (me != null) {\n      EventTarget et = me.getTarget();\n      if (et instanceof\
  \ Shape) {\n        Node node = (Node)et;\n        double origx = node.getTranslateX();\n\
  \        double origy = node.getTranslateY();\n        node.translateXProperty().bind(drawPane.dragXProperty().add(origx));\n\
  \        node.translateYProperty().bind(drawPane.dragYProperty().add(origy));\n\
  \      }\n    }\n\n  }\n\n  @Override\n  public void onMouseDragFinished(DrawPane\
  \ drawPane) {\n    MouseEvent me = drawPane.getMouseEvent();\n    if (me != null)\
  \ {\n      EventTarget et = me.getTarget();\n      if (et instanceof Shape) {\n\
  \        Node node = (Node)et;\n        node.translateXProperty().unbind();\n  \
  \      node.translateYProperty().unbind();\n      }\n    }\n  }\n\n}\n```\n\n`ShapeMover`\
  \ 的用法将在下一章中探讨，在下一章中我们将开发 `JFXDrawTools` 程序的初始版本。\n\n## 7.3 增强 `DrawPane` 类\n\n为了满足高级形状绘制应用的需求，我们赋予了\
  \ `DrawPane` 功能。\n\n以下是增强后的 `DrawPane` 类的源代码，与 V1.0 版本相比的主要差异（基于第 6 章 基础绘制工具——开发形状绘制工具\
  \ V1.0 开发）已用**粗体**显示。\n\n### 列表 7-21. 增强 `DrawPane` 类：\n\n\n\n\n\n```java\npackage\
  \ drawtool;\n\nimport javafx.beans.property.BooleanProperty;\nimport javafx.beans.property.DoubleProperty;\n\
  import javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleBooleanProperty;\n\
