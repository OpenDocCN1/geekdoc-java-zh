  \ 类）\n\n*   `Pane` 类继承自 `javafx.scene.layout.Region` 并位于 `javafx.scene.layout` 包，是\
  \ JavaFX 内置布局面板的基类。\n\n    （查看章节增强 `DrawPane` 类）\n\n*   `EventHandler<T extends\
  \ Event>` 是一个继承自 `java.util.EventListener` 的接口，定义了 `handle`(`T` 事件) 方法，在指定事件发生时被调用。\n\
  \n    （查看此处）\n\n*   `MouseEvent` 类位于 `javafx.scene.input` 包，是 `javafx.scene.input.InputEvent`\
