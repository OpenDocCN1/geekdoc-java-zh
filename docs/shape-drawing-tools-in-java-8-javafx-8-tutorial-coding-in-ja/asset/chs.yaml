  \n\n\n\n*   `Line` 类，位于 `javafx.scene.shape` 包中，是 `javafx.scene.shape.Shape` 的直接子类。它提供了四个属性来指定线条的位置：`startX`、`startY`、`endX`\
  \ 和 `endY`。\n\n    （参见章节 作为 `Application` 的子类创建 `LineDrawer` 类）\n\n*   `public final\
  \ ObservableList<Double> getStrokeDashArray()` 是 `Shape` 类中定义的方法，用于指定绘制 `Shape`\
  \ 边界的虚线模式。\n\n    （参阅此处）\n\n*   `Pane` 类继承自 `javafx.scene.layout.Region` 并位于 `javafx.scene.layout`\
  \ 包中，是 JavaFX 内置布局面板的基类。\n\n    （参见章节 在 `BorderPane` 的中心添加 `Pane` 作为绘图板）\n\n*  \
  \ `Group` 类位于 `javafx.scene.Group` 包中，是 `javafx.scene.Parent` 的子类，其边界由其内容决定，且无法被父节点调整大小。\n\
  \n    （参阅此处）\n\n*   `EventHandler<T extends Event>` 是一个扩展自 `java.util.EventListener`\
  \ 的接口，它定义了 `handle`(`T` 事件) 方法，该方法在指定事件发生时被调用。\n\n    （参见章节 使用便利方法注册事件处理器）\n\n*\
  \   `MouseEvent` 类位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent` 的子类。它定义了多种事件类型，如\
  \ `MOUSE_CLICKED`、`MOUSE_DRAGGED`、`MOUSE_ENTERED`、`MOUSE_EXITED`、`MOUSE_MOVED`、`MOUSE_PRESSED`、`MOUSE_RELEASED`\
  \ 等，并提供了如 `getX()`、`getY()` 等方法，用于获取事件发生时鼠标指针的位置。\n\n    （参见章节：使用便利方法注册事件处理器 以及\
  \ 定义属性以存储鼠标事件的位置）\n\n*   `Node` 类提供的一些便利方法，用于注册 `EventHandler` 以处理鼠标事件和键事件。\n\n\
  \    ```\npublic final void setOnMousePressed(EventHandler<? super MouseEvent> value)\n\
  \    ```\n\n    ```\npublic final void setOnMouseDragged(EventHandler<? super MouseEvent>\
  \ value)\n    ```\n\n    ```\npublic final void setOnMouseReleased(EventHandler<?\
  \ super MouseEvent> value)\n    ```\n\n    ```\npublic final void setOnKeyPressed(EventHandler<?\
  \ super KeyEvent> value)\n    ```\n\n    （参见章节 使用便利方法注册事件处理器、此处、此处、此处 以及 此处）\n\n\
