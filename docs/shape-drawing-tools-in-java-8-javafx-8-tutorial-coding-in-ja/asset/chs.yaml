  \ * 当你完成折线的所有线段后，按下 ENTER 键完成绘制，\n * 下一个 MOUSE_PRESSED 事件将启动新折线的第一个线段。\n * 要取消此折线，按下\
  \ ESCAPE 键。\n *\n * @author: Shufen Kuo\n */\npublic class PolylineDrawer extends\
  \ Application {\n\n  // 在鼠标事件发生时跟踪光标位置\n  // startX, startY 存储鼠标按下事件的位置\n  DoubleProperty\
