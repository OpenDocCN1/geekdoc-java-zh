  \ `DoubleProperty` 类。\n    - `BooleanProperty`：一个抽象类，继承自 `javafx.beans.binding.BooleanExpression`\
  \ 类，实现了 `Property<java.lang.Boolean>` 和 `WritableBooleanValue`。\n    - `WritableBooleanValue`：扩展了\
  \ `WritableValue<java.lang.Boolean>`。\n    - `SimpleBooleanProperty`：继承自 `BooleanProperty`\
  \ 类。\n    （参考章节：定义属性、定义属性）\n\n- `WritableObjectValue<T>` 接口，位于 `javafx.beans.value`\
  \ 包并扩展了 `WritableValue<T>`，定义了以下方法：\n    - `get()`：获取包装的值。\n    - `set(T value)`：设置包装的值。\n\
  \n\n\n\n\n* `DoubleBinding` 是一个位于 `javafx.beans.binding` 包中的抽象类，继承自 `DoubleExpression`\
  \ 并实现了 `NumberBinding`。为了实例化 `DoubleBinding` 对象，需要实现 `computeValue()` 方法。通常调用 `bind(Observable...\
  \ dependencies)` 方法来观察此 `DoubleBinding` 依赖项的值变化。\n\n  (参见 此处, 此处, 此处)\n\n* `Property<T>`\
  \ 接口位于 `javafx.beans.property` 包中，定义了所有属性共有的方法，例如：\n\n  ```java\n  void bind(ObservableValue<?\
  \ extends T> observable)\n  ```\n\n  将此属性单向绑定到给定的 `ObservableValue`。\n\n  ```java\n\
  \  void unbind()\n  ```\n\n  取消此属性的绑定。\n\n  (参见此处, 此处, 此处)\n\n* `Pane` 类继承自 `javafx.scene.layout.Region`\
  \ 并位于 `javafx.scene.layout` 包中，是 JavaFX 内置布局类的基类。\n\n  (参见章节 创建 `DrawPane` 类)\n\n\
  * `WritableBooleanValue` 接口位于 `javafx.beans.value` 包并继承自 `WritableValue<Boolean>`，定义了以下方法：\n\
