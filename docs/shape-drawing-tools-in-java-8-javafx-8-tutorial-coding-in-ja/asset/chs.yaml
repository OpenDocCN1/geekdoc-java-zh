  )\n\n如果你是一个想要成功编译此程序的开发者，可以将图标图像替换为你喜欢的图片，或者从此电子书的 HTML 文件中提取图像文件 `swan16.jpg` 到一个名为\
  \ `resource` 的目录中。`resource` 目录应该位于你放置 `jfxdrawtools` 包的目录内。\n\n关于将电子书的 `.mobi`\
  \ 格式转换为 HTML，这里的建议如下：\n\n1. 在你的电脑上安装 `Calibre`，这是一个免费开源的电子书管理软件。\n2. 使用 `Calibre`\
  \ 中的 `Add books` 功能将此电子书的 `.mobi` 文件添加到 `Calibre Library` 中。\n3. 使用 `Calibre` 中的\
  \ `Convert books` 功能，选择 `HTMLZ` 为输出格式，点击 `OK` 按钮进行转换。\n4. 转换完成后，你将得到一个扩展名为 `.htmlz`\
  \ 的输出文件。将扩展名改为 `.zip` 并解压缩文件，你将得到一个大型 HTML 文件和一个名为 `images` 的目录，该目录包含 HTML 文件内容引用的所有图像文件。\n\
  \n   如果你正在使用 Windows 8，`.htmlz` 输出文件存储在该目录的子目录中：\n\n   ```\n   C:\\Users\\<User\
  \ Name>\\Documents\\Calibre Library\n   ```\n\n### 8.1.2 创建状态栏\n\n创建了一个包含 `Text`\
