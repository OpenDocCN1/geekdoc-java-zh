  \ `Polyline`：\n\n图 2-1. 由上述代码创建的折线的快照。\n\n![](img/00006.jpeg \"example_polyline.jpg\"\
  )\n\n以下插图显示了上述代码中渲染 `Polyline` 的每个点的坐标。\n\n图 2-2. 快照说明了在给定 6 个点的情况下，由 5 个线段组成的折线。\n\
  \n![](img/00007.jpeg \"diagram_polyline.jpg\")\n\n现在，我们将演示如何开发一个 `PolylineDrawer`\
  \ 应用程序来交互式绘制 `Polyline` 对象。`Polyline` 所有点的 (X, Y) 坐标是通过鼠标按下和鼠标拖动事件动态获取的。\n\n在绘板上交互式绘制折线的方法与上一章描述的画线类似。以下是\
  \ `PolylineDrawer` 工作原理预览：\n\n通过每一个 `MOUSE_PRESSED`—`MOUSE_DRAGGED`—`MOUSE_RELEASED`\
  \ 事件循环创建一个代表 `Polyline` 一个线段的 `Line`。根据 `Polyline` 的需要绘制尽可能多的线段。如果此线段的起点与上一个线段的终点相同，则会自动创建一个连接两者的线段。按下\
  \ `Enter` 键完成 `Polyline`，或按下 `Esc` 键取消。\n\n在源码方面，`PolylineDrawer` 模块和 `LineDrawer`\
  \ 模块开发之间的主要位于两个方法内部：`onMouseDragStarted()` 方法和 `onMouseDragFinished()` 方法。\n\n以下是\
  \ `PolylineDrawer` 类的初始外观，创建一个 `BorderPane` 作为 `Scene` 的根节点，并将一个 `Pane` 置于 `BorderPane`\
  \ 的中心：\n\n列表 2-3. 创建扩展 `Application` 类的 `PolylineDrawer` 类，重写 `start` 方法，创建 `BorderPane`\
  \ 作为 `Scene` 的根节点，并将 `Pane` 置于 `BorderPane` 的中心作为绘板：\n\n```java\npackage drawtool;\n\
  \nimport javafx.application.Application;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.Pane;\nimport javafx.scene.paint.Color;\nimport javafx.scene.Scene;\n\
  import javafx.stage.Stage;\n\n/**\n * File Name: PolylineDrawer.java\n * @author:\
