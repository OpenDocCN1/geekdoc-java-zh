  \ circledrawer.CircleDrawer \n```\n\n[/content\n\n这里我们演示了如何使用 `drawtool` 包提供的 API\
  \ 开发一个在画板上绘制椭圆形状的 `EllipseDrawer` 程序。\n\n与之前描述的所有绘制器类似，一旦检测到鼠标拖拽事件，就会创建一个椭圆形状对象。在检测到鼠标拖拽事件之前的鼠标按下事件的位置被设置为椭圆的中心点。椭圆的\
  \ `radiusX` 属性和 `radiusY` 属性分别对应 `dragX` 属性和 `dragY` 属性。这是在 `onMouseDragStarted`\
  \ 方法内部通过属性绑定机制实现的。结果是，随着鼠标拖拽事件的持续，椭圆的半径 x 和半径 y 会不断调整，且最新的鼠标拖拽位置始终位于圆周上。\n\n为了完成一个椭圆的绘制，我们需要处理解除绑定，这在\
  \ `MOUSE_RELEASED` 事件的处理程序中完成，该事件标记了一系列鼠标拖拽事件的结束。\n\n为了实例化用于处理椭圆绘制的 `ShapeDrawer`，我们如下所示定义\
  \ `newEllipseDrawer` 方法：\n\n列表 6-16. 定义 `newEllipseDrawer` 方法，返回一个在画板上绘制椭圆形状的 `ShapeDrawer`\
  \ 实例。\n\n\n\n\n\n```java\n ShapeDrawer newEllipseDrawer() {\n    return new ShapeDrawer(Ellipse.class)\
  \ {\n      @Override\n      public void onMouseDragStarted(final DrawPane drawPane)\
  \ {\n\n        Ellipse es = (Ellipse)getShape();\n\n        DoubleBinding wB = new\
  \ DoubleBinding() {\n          {\n            super.bind(drawPane.dragXProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragX());\n          }\n        };\n  \
  \      DoubleBinding hB = new DoubleBinding() {\n          {\n            super.bind(drawPane.dragYProperty());\n\
  \          }\n\n          @Override\n          protected double computeValue() {\n\
  \            return Math.abs(drawPane.getDragY());\n          }\n        };    \n\
  \        es.centerXProperty().bind(drawPane.startXProperty());\n        es.centerYProperty().bind(drawPane.startYProperty());\n\
  \        es.radiusXProperty().bind(wB);\n        es.radiusYProperty().bind(hB);\
  \    \n      }\n\n      @Override\n      public void onMouseDragFinished(final DrawPane\
  \ drawPane) {\n        Ellipse es = (Ellipse)getShape();\n        if (es != null)\
  \ {\n          es.centerXProperty().unbind();\n          es.centerYProperty().unbind();\n\
  \          es.radiusXProperty().unbind();\n          es.radiusYProperty().unbind();\n\
  \        }\n      }\n    };\n  }\n```\n\n从上述代码列表中可以看出，我们将椭圆形状的中心点、`centerX` 属性和\
  \ `centerY` 属性绑定到了鼠标按下事件的位置，这些位置分别定义在 `DrawPane` 类的 `startX` 属性和 `startY` 属性中。此外，我们将半径\
  \ X 绑定到如下计算的拖拽 X 距离：\n\n```java\n @Override\n          protected double computeValue()\
  \ {\n            return Math.abs(drawPane.getDragX());\n          } \n```\n\n并且将半径\
  \ Y 绑定到如下计算的拖拽 Y 距离：\n\n```java\n @Override\n          protected double computeValue()\
  \ {\n            return Math.abs(drawPane.getDragY());\n          } \n```\n\n`dragX`\
  \ 和 `dragY` 是定义在 `DrawPane` 类内部的属性，参考定义属性。\n\n`DrawPane` 实例创建方式如下：\n\n```java\n\
  \ DrawPane drawPane = new DrawPane(newEllipseDrawer()); \n```\n\n`newEllipseDrawer()`\
  \ 方法返回一个 `ShapeDrawer` 对象，该对象作为参数传递给 `DrawPane` 的构造函数。创建一个 `DrawPane` 实例以作为放置在 `BorderPane`\
