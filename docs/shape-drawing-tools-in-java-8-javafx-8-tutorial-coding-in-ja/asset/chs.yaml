  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 在此处添加代码处理鼠标拖动事件\n      }\n    });\n\n    drawPane.setOnMouseReleased(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 在此处添加代码处理鼠标释放事件\n      }\n    });\n    drawPane.setOnKeyPressed(new\
  \ EventHandler<KeyEvent>() {\n      @Override\n      public void handle(KeyEvent\
  \ ke) {\n        // 在此处添加代码处理按键事件\n    });\n```\n\n## 1.3 `LineDrawer` 类中的属性与绑定\n\
  \n### 1.3.1 定义属性以保存鼠标事件的位置\n\n为了在发生鼠标事件发生时跟踪鼠标位置，我们定义了以下 `DoubleProperty` 类型的属性：\n\
  \n导入语句：\n\n```java\nimport javafx.beans.property.DoubleProperty;\nimport javafx.beans.property.SimpleDoubleProperty;\n\
  ```\n\n列表 1-6。定义 `DoubleProperty` 类型的属性 `startX`、`startY`、`translateX` 和 `translateX`：\n\
  \n```java\n // startX, startY 保存鼠标按下事件的位置\n  DoubleProperty startX = new SimpleDoubleProperty();\n\
  \  DoubleProperty startY = new SimpleDoubleProperty();\n\n  // translateX, translateY\
  \ 存储拖动/移动位置到 startX, startY 的距离\n  DoubleProperty translateX = new SimpleDoubleProperty();\n\
  \  DoubleProperty translateY = new SimpleDoubleProperty();\n```\n\n`MouseEvent`\
  \ 类位于 `javafx.scene.input` 包中，是 `javafx.scene.input.InputEvent` 的子类；它提供了 `getX()`\
  \ 和 `getY()` 方法，用于获取事件发生时鼠标的 X、Y 位置。\n\n```java\npublic final double getX()\n```\n\
  \n获取相对于该事件源对象原点的鼠标 X 位置。\n\n```java\npublic final double getY()\n```\n\n获取相对于该事件源对象原点的鼠标\
  \ Y 位置。\n\n`startX` 和 `startY` 的值在处理鼠标按下事件的事件处理器中设置，代码如下：\n\n列表 1-7。注册事件处理器处理 `MOUSE_PRESSED`\
  \ 事件：\n\n```java\nfinal Pane drawPane = new Pane();\n\n    drawPane.setOnMousePressed(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 获取起始起始位置\n        startX.set(me.getX());\n        startY.set(me.getY());\n\
  \      }\n    });\n```\n\n`translateX` 和 `translateY` 的值在处理鼠标拖动事件的事件处理器中设置，代码如下：\n\
  \n列表 1-8。设置属性 `translateX`、`translateY` 的值：\n\n```java\ndrawPane.setOnMouseDragged(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        // 计算从鼠标位置到起始位置的距离\n        double x2 = me.getX();\n        double\
  \ y2 = me.getY();\n        translateX.set(x2 - startX.get());\n        translateY.set(y2\
  \ - startY.get());\n\n        ...\n\n      }\n    });\n```\n\n### 1.3.2 定义 `ObjectProperty<Shape>`\
  \ 以存储草图\n\n定义类型为 `ObjectProperty<Shape>` 的类字段 `shape`，用于临时存储绘制在绘板上的草图（即一个 `Shape`\
  \ 对象）。当检测到第一次鼠标拖动事件时，会创建一个线条对象并将其设置为 `shape` 属性的值。\n\n在鼠标拖动事件处理器内部，我们需要判断这是否是鼠标按下事件后的第一次鼠标拖动事件；如果是，则创建一个线条，该线条在一次\
  \ `MOUSE_PRESSED—MOUSE_DRAGGED—MOUSE_RELEASED` 事件周期中仅会被创建一次。为此，我们定义了一个布尔型（`boolean`）字段\
  \ `dragged`，它在检测到第一次鼠标拖动事件时被设置为 `true`，在发生鼠标释放事件时被重置为 `false`。以下是完成这些任务的代码片段：\n\n\
  导入语句：\n\n```java\nimport javafx.beans.property.ObjectProperty;\nimport javafx.beans.property.SimpleObjectProperty;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.shape.Line;\nimport javafx.scene.shape.Shape;\n\
  ```\n\n列表 1-9。定义形状属性和 dragged 变量，在鼠标开始拖动时创建线条：\n\n```java\n // 用于存储当前绘制的形状 \n  ObjectProperty<Shape>\
  \ shape = new SimpleObjectProperty<>();\n\n  // 该变量在鼠标拖动事件处理器内部被设置为 true\n  // 当第一次鼠标拖动事件发生时，\n\
  \  // 在鼠标释放事件发生时被重置为 false。\n  boolean dragged = false;\n\n    drawPane.setOnMouseDragged(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        double x2 = me.getX();\n        double y2 = me.getY();\n      \
  \  translateX.set(x2 - startX.get());\n        translateY.set(y2 - startY.get());\
  \ \n        if (!dragged) {\n          // 仅执行一次\n          if (getShape() == null)\t\
  {\n            Shape tmpShape = new Line();\n            tmpShape.setStroke(Color.BLUE);\n\
  \            shape.set(tmpShape);\n          } \n          dragged = true;\n\n \
  \         ...\n\n        }\n      }\n    });\n\n    drawPane.setOnMouseReleased(new\
  \ EventHandler<MouseEvent>() {\n      @Override\n      public void handle(MouseEvent\
  \ me) {\n        if (dragged) {\n          dragged = false;\n\n          ...\n\n\
  \        }\n      }\n    });\n```\n\n为 `shape` 属性添加了监听器以观察值的变化。如果设置了非空值，它将被添加到绘板的子列表中，形状将在应用程序窗口中可见。\n\
  \n导入语句：\n\n```java\nimport javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
  ```\n\n列表 1-10。为形状属性添加监听器：\n\n```java\n // 监听形状属性的值的变化，\n    // 如果创建了新形状，将其添加到绘板。\n\
  \    shape.addListener(new ChangeListener<Shape>() {\n      @Override\n      public\
  \ void changed(ObservableValue o, Shape oldVal,\n          Shape newVal) {\n   \
  \      System.out.format(\"shape value changed: %s%n\", newVal);\n         if (newVal\
  \ != null)\n           drawPane.getChildren().add(newVal);\n      }\n    });\n```\n\
  \n当线条被确定时（即按下 `Enter` 键时），线条的起点和终点将被确定，并且 `shape` 属性的值被设置为 `null`，此操作在注册 `KEY_PRESSED`\
  \ 事件类型的事件处理器内部执行，将在后文章节描述。\n\n### 1.3.3 为线条的终点绑定属性\n\n\n\n\n以下定义了两种方法来处理 `bind`\
  \ 和 `unbind`，针对 `endX` 属性和 `endY` 属性，这些属性代表当前在绘板上绘制线条的终点。\n\n`void onMouseDragStarted()`\n\
  \n`void onMouseDragFinished()`\n\n在 `onMouseDragStarted()` 方法内部，我们使用了 `javafx.beans.binding.DoubleExpression`\
  \ 类中提供的 `add` 方法来生成一个 `DoubleBinding`，该绑定计算起始位置和位移距离的和：\n\n```java\n public DoubleBinding\
  \ add(ObservableNumberValue other) \n```\n\n以下是 `onMouseDragStarted()` 方法和 `onMouseDragFinished()`\
  \ 方法的实现：\n\nListing 1-11. 定义处理线条属性的方法，由 `MOUSE_DRAGGED` 和 `MOUSE_RELEASED` 事件处理程序调用：\n\
  \n```\n void onMouseDragStarted() {\n    Line line = (Line)getShape();\n    // 设置属性\
  \ startX, startY 的值\n    line.setStartX(startX.get());\n    line.setStartY(startY.get());\n\
  \    // 对属性 endX, endY 进行绑定\n    line.endXProperty().bind(startX.add(translateX));\n\
  \    line.endYProperty().bind(startY.add(translateY));\n  }\n\n  void onMouseDragFinished()\
  \ {\n    Line line = (Line)getShape();\n    // 此处必须验证 shape 不为空\n    // 如果按了 Enter\
  \ 键或 Esc 键，shape 将设置为 null\n    if (line != null) {\n      // 对属性 endX, endY 进行解绑\n\
  \      line.endXProperty().unbind();\n      line.endYProperty().unbind();\n    }\n\
  \  }\n```\n\n`onMouseDragStarted()` 方法从处理 `MOUSE_DRAGGED` 事件的事件处理程序调用，它在每个 `MOUSE_PRESSED—MOUSE_DRAGGED—MOUSE_RELEASED`\
  \ 事件循环中执行一次，用于计算线条起始点属性和终点属性的值。\n\n以下是注册事件处理程序以处理 `MOUSE_DRAGGED` 事件的完整代码：\n\nListing\
  \ 1-12. 注册事件处理程序处理 `MOUSE_DRAGGED` 事件：\n\n```\n drawPane.setOnMouseDragged(new EventHandler<MouseEvent>()\
  \ {\n      @Override\n      public void handle(MouseEvent me) {\n        double\
  \ x2 = me.getX();\n        double y2 = me.getY();\n        translateX.set(x2 - startX.get());\n\
  \        translateY.set(y2 - startY.get()); \n        if (!dragged) {\n        \
  \  // 仅执行一次\n          if (getShape() == null)\t{\n            Shape tmpShape =\
  \ new Line();\n            tmpShape.setStroke(Color.BLUE);\n            shape.set(tmpShape);\n\
  \          } \n          dragged = true;\n          onMouseDragStarted();\n    \
  \    }\n      }\n    });\n```\n\n同样，`onMouseDragFinished()` 方法从处理 `MOUSE_RELEASED`\
  \ 事件的事件处理程序调用，它在每个 `MOUSE_PRESSED—MOUSE_DRAGGED—MOUSE_RELEASED` 事件循环中执行一次，处理线条终点属性的解绑。\n\
  \n以下是注册事件处理程序以处理 `MOUSE_RELEASED` 事件的完整代码：\n\nListing 1-13. 注册事件处理程序处理 `MOUSE_RELEASED`\
  \ 事件：\n\n```\n drawPane.setOnMouseReleased(new EventHandler<MouseEvent>() {\n  \
  \    @Override\n      public void handle(MouseEvent me) {\n        if (dragged)\
  \ {\n          dragged = false;\n          onMouseDragFinished();\n        }\n \
  \     }\n    });\n```\n\n### 1.4 获取按键事件的键码\n\n`KeyEvent` 类位于 `javafx.scene.input`\
  \ 包中，是 `javafx.scene.input.InputEvent` 的子类。它定义了事件类型的静态字段，例如 `KEY_PRESSED`、`KEY_RELEASED`、`KEY_TYPED`\
  \ 等。\n\n`static EventType<KeyEvent> KEY_PRESSED`\n\n`KEY_PRESSED` 事件在按键被按下时发生。\n\
  \n`static EventType<KeyEvent> KEY_RELEASED`\n\n`KEY_RELEASED` 事件在按键被释放时发生。\n\n`static\
  \ EventType<KeyEvent> KEY_TYPED`\n\n`KEY_TYPED` 事件在按键被按下并释放时发生。\n\n`KeyCode` 类位于\
  \ `javafx.scene.input` 包中，是一个枚举类型，定义了键盘按键的常量；它涵盖了字母键（`A` 到 `Z`）、数字键（`DIGIT0` 到 `DIGIT9`）、修饰键（如\
  \ `CONTROL`、`SHIFT` 等）、功能键（如 `F1`、`F2`）、`ENTER`、`ESCAPE`、`HOME`、`END`、`BACKSPACE`\
  \ 等。\n\n以下是 `KeyEvent` 类提供的两个方法，用于在 `KEY_PRESSED` 或 `KEY_RELEASED` 事件发生时获取键的信息。\n\
  \n`public final KeyCode getCode()`\n\n在 `KEY_PRESSED` 或 `KEY_RELEASED` 事件发生时，获取按下或释放的按键的码，类型为\
  \ `KeyCode`。对于 `KEY_TYPED` 事件，返回 `KeyCode.UNDEFINED`。\n\n`public final String getText()`\n\
  \n在 `KEY_PRESSED` 或 `KEY_RELEASED` 事件发生时，以 `String` 表示形式获取按下或释放的按键的信息。对于 `KEY_TYPED`\
  \ 事件，返回空字符串。\n\n`KeyEvent` 类中还提供了以下布尔方法，用于验证在按键事件发生时是否同时按下了修饰键。\n\n`public final\
  \ boolean isControlDown()`\n\n检查事件发生时 Ctrl 键是否被按下。\n\n`public final boolean isAltDown()`\n\
  \n检查事件发生时 Alt 键是否被按下。\n\n`public final boolean isShiftDown()`\n\n检查事件发生时 Shift 键是否被按下。\n\
  \n要使源节点接收键事件，应将 `focusversable` 属性设置为 `true`；其默认值为 `false`。\n\n`public final void\
  \ setTraversable(boolean value)`\n\n将 `focusversable` 属性的值设置为 `true`，使节点可遍历并能够获得焦点，通常通过\
  \ `TAB` 键或 `SHIFT+TAB` 键在遍历节点之间移动焦点。\n\n以下代码片段展示了如何注册事件处理程序处理 `KEY_PRESSED` 事件，以及\
  \ `handle(KeyEvent event)` 方法的写法：\n\n导入语句：\n\n```java\n import javafx.scene.input.KeyCode;\n\
  import javafx.scene.input.KeyEvent;\n```\n\nListing 1-14. 注册事件处理程序处理 `KEY_PRESSED`\
  \ 事件：\n\n```\n // 需要设置 focusversable 为 true 才能处理 KeyEvent，\n    // 默认值为 false。\n\
  \    drawPane.setTraversable(true);\n    drawPane.setOnKeyPressed(new EventHandler<KeyEvent>()\
  \ {\n      @Override\n      public void handle(KeyEvent ke) {\n        KeyCode kc\
  \ = ke.getCode();\n        switch (kc) {\n          case ENTER : \n            //\
  \ 按下 Enter 键完成线条\n            System.out.format(\"Enter key hit%n\");\n        \
  \    // 必须调用 dragged finished 方法解绑\n            onMouseDragFinished();\n       \
  \     setShape(null);  // 完成线条\n            break;\n          case ESCAPE:\n   \
  \         // 按下 Esc 键清除此线条\n            System.out.format(\"Esc key hit%n\");\n\
  \            Shape s = getShape();\n            if (s != null) {\n             \
  \ // 必须调用 dragged finished 方法解绑\n              onMouseDragFinished();\n        \
  \      drawPane.getChildren().remove(s);\n              setShape(null);  // 清除线条\n\
  \            }\n            break;\n        }       \n      }\n    });\n```\n\n\
  ## 1.5 `LineDrawer` 类的完整源代码\n\nListing 1-15. 创建继承 `Application` 类的 `LineDrawer`\
  \ 类，重写 `start` 方法，创建 `BorderPane` 作为场景的根节点，并将 `Pane` 置于 `BorderPane` 的中心作为绘板：\n\n\
  \n\n\n\n```java\npackage drawtool;\n\nimport javafx.application.Application;\nimport\
