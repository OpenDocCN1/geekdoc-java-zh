    指针是 C/C++ 中的一个核心概念，它实际上在我们现在的代码中也经常出现。出现在函数调用中变量前的 `&` 符号基本上是告诉函数不要使用变量本身，而是使用该变量所引的值。下面的图片应该消除大多数初学者在最初理解这一点时会遇到的某些困惑。


    ![ref](img/00016.gif)


    要点在于，如果你有一个指向任何特定数据类型的指针变量，你就可以通过前置星号 `*` 将该指针转换为值，或者使用前置取地址符 `&` 获取变量的地址并将其传递给其他函数等。这只是对指针的一个非常简化的介绍，仅供你了解。


    现在，回到代码。在我们的函数中，变量前面应该有取地址符，因为它们需要的是字符串的指针而不是值。这使得函数能够传递正确的字符串，并打印出与上次相同的输出。


    我们要在当前程序中添加的下一个内容是编写多个函数的想法。这对于我们简单的示例来说可能不是必须的，所以让我们添加一些简单的计算来展示函数的威力。主意是将两个数字相加并返回它们的和。作为一个挑战，请尝试添加一个
    `if` 语句来检查值是否为负数，如果是则返回零。解决方案将在结论中。


    至于我们要添加的函数，让我们取出程序的中间部分，并将其替换为想要添加的函数。为了方便起见，我们将其命名为 `calc_sum` 以保持简单。


    下面的图片显示了添加它的的一种方法。这种想法是，当我们添加新功能时，想要尽可能保留旧程序的内容。我们只需说程序员喜欢节省时间。不同之处在于我们是否希望函数负责将其输出打印到屏幕上。这在情况下也影响了它的返回值类型是
    `void` 还是 `int`。截图之后给出了代码的简要概述。


    ![last](img/00017.jpeg)


    注意，在 `main` 函数之前又有一行代码。这一行被称为函数原型声明，它告诉编译器我们稍将在程序的其他部分定义一个我们想要使用的函数。在这种情况下，它被称为
    `calc_sum`，并接受两个整数值作为参数。


    定义本身相当简单，因为我们只需要返回两个整数相加的结果。它读起来和我们在数学中的做法相似，不同的是现在将其返回给调用者。为了让它变得更简单，可以直接返回两个值相加的操作，本质上就是完全删除
    `result` 变量。关于直接返回是否是一个好主意，可能会发生一些有趣的争论，但这意味着它也是一个很好的学习机会。


    我们可以直接将函数放入标准输出流中，这一点对我来说非常棒。从整数到字符串数据类型的转换在 C++ 中是隐式的，这可能也挺不错的。


    ## 结论


    我们成功地制作了一个运行的程序。不仅如此，我们还深入学习了 C++ 内部的一些入门概念，这将有助于你启动编程知识。学习编程最棒的部分在于，任何切入点都能帮助增加你进入整个领域的动力。


    在产生动力冲动之前，让我们向后退一步，意识到我们甚至还没有接触到虚函数、朋友类以及许多其他酷炫的概念。编程绝对是我个人的兴趣爱好。幽默的是，我正试图以此作为职业。我能解释它的最好方式是：作为爱好，写写程序是一件很棒的事，但当涉及到将其作为职业时，它完全是另一回事。可用信息量不断扩大，因此软件行业的人必须不断学习。


    对于之前提到的 `if` 语句的解决方案，下一页的图片应该对其进行整体总结。当然，还有许多其他方法，例如使用 `switch` 语句或三元运算符，它们也可以同样容易实现。再次，这都是主观的。解释是编写软件的一件大事，尽管编译器会告诉我们什么是对什么是错。


    再次，需要注意的一些重要因素是 `result` 变量被用来检查结果。如果我们想使用直接返回的方法，那么条件检查就会变得不那么有趣，而是稍微困难一点。编程始终是一种可以灵活处理的工具。


    ![last4real](img/00018.jpeg)


