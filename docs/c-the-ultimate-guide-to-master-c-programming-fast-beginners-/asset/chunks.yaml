    # Programming Basics


    The grammatical structure important in coding is primarily the placement of separators.
    More specifically, the way that a language would want us to form functions, what
    to call the entry function, and whether or not a statement requires a terminator.
    An example of the latter is using semicolon basically as a period in `C++` and
    other languages.


    The last mention was primarily for a language called `Python`. It uses tabs as
    an indicator for whether or not the next line is part of a function, loop, or
    class block. It’s got a likeably different flavor than `C++` and might be worth
    a look into after wrapping our heads around the basic programming ideas we still
    need to cover.


    [Click this link here to grab Notepad++.](https://notepad-plus-plus.org/download/v6.9.html)


    The best part is that this one code editor will highlight not just `C++`, but
    plenty of other languages as well. Linux also uses a hybrid text and code editor
    called `gedit`, which is another cool point about Notepad++. Funny that we’re
    basically just trying to make Windows more like Linux so we can program, eh?


    # Chapter 3: Setting up the Workspace: File Structure Is Key


    The final setup step is here. This one some would say is optional; however, think
    about this quick scenario. Say that there’s a really large project that you’re
    tasked to help develop. There are other coders with you. They each have their
    own way of doing things, which can already spell some problems early on. One of
    them asks you for some help with his piece. He tries to explain it quickly, but
    you’re already lost as you try to go inside of folder after folder of software.
    An interface here and a realization there, with some utilities in another folder
    way over here. See the problem?


    Now then. This simple example will seem to defeat the purpose of needing a strict
    directory structure, but the next to last chapter will have you adding a few pieces
    of code to your program to validate the need for a comprehensible directory structure.
    The most we’re going to do involves 2 folders.


    For the primary example, we need to make a folder called `tutorials`. If you already
    know how to do this, then please continue to chapter 4. Otherwise, here’s step-by-step
    how you make a new folder using Windows, though most other operating systems will
    follow a somewhat similar format.


    The first step is to go to your `Desktop`. This is the place where all of your
    icons reside. At the bottom is the `Taskbar` which has the `Start` button and
    a clock on the bottom right side. Place your cursor over the `Desktop` and right
    click. You should see something similar to the image at right.


    After you’ve selected this, the next thing we want to do is to rename the folder
    so we can find it easier later. To do so, all you need to do is right click the
    folder and click `rename`. You may want to left click the folder to ensure that
    the folder is selected before right clicking it. The picture below will show what
    the context menu may look like.


    ![1new_folder](images/00007.jpeg)


    Though this may seem simple, there are other ways to create folders using nothing
    but command line actions. In a system which doesn’t have a graphical user interface
    (`GUI`), like most operating systems, then ensuring that you’re putting files
    and folders in the correct place is of the utmost importance. The code can be
    as great as it wants to be, but if you or the compiler can’t find it then it’s
    as if it doesn’t even exists.


    One last comment on file structure is that creating it is one thing. Adhering
    to it throughout development is what most coders have problems doing. This means
    always knowing what’s where at all times. If you can explain how your code is
    structured to someone with little to no knowledge of the system and they can find
    any folder or , better yet, file in the directory then we’ve done it right.


    ![3rename_folder](images/00008.jpeg)


    # Chapter 4: Programming Time: Salute the World


    Breathe in, and breathe out. Now we can program. First thing we should do is to
    get our command prompt into the correct working directory, which is where we put
    our `tutorial` folder. Let’s get started.


    Click the `Start` button on the bottom `Taskbar`. Type in `cmd` in the search
    box at the bottom, or click the `Run…` option on the right side. Another way to
    get the `Run` prompt is to press and hold the `Windows` key and then press the
    `r` key. You should the following set of screens.


    The ![running_cmd](images/00009.jpeg) `cd` command will change your directory
    to the one specified with the words following the command. Click the `Start` button
    on the bottom `Taskbar`. Type in `cmd` in the search box at the bottom, or click
    the `Run…` option on the right side. Another way to get the `Run` prompt is to
    press and hold the `Windows` key and then press the `r` key.


