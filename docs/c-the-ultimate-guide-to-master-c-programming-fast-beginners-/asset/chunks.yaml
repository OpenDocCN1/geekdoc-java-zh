- fmt: '

    As for the body of the program, we have two major pieces that we need to go over.
    The first piece is the `printf` function which accepts a data type known as a
    `string` and an optional list of variable size of various data types to put into
    the main string. Breaking this down, a `string` is just a collection of characters.
    Characters in `C++` are wholly represented in the American Standard Code of Information
    Interchange (ASCII) table available through a simple Google search. In essence,
    anything that appears between two quotation marks can be a `string`, barring special
    formatting using backslashes. The function will print the string exactly as it
    appears to the screen.


    The last instance of the `printf` function includes some of the interesting formatting
    aforementioned. The `"%c"` pattern tells the function that we want place a character
    in that space, whose value we get from the first variable in the list that is
    the optional second argument in the function. The character we want to put into
    the string is the `''\n''` character. This character is the new line character
    which will force the following string to appear on the next line of the screen.
    We’re basically just telling the function to replace the `"%c"` with `''\n''`
    in this case. Again, in a more complex system this will be extremely useful, especially
    for actual formatting of the string that you try to append into the main string.


    For the final part of the main function body, we will cover the beauty of how
    `C++` does standard input and output differently from the `C` language. In this
    case, we see the `std` namespace being used in the token `std::cout` and `std::endl`.
    A namespace is simply a way to collect related pieces of data in order to easily
    access them with as little overhead as possible. The specific variables being
    used here refer to the standard out stream and the end line string respectively.


    The interesting piece is the `"<<"` part. This tells the program to essentially
    push the data that it receives from any kind of function, literal, or variable
    that is of the string data type. Think of it as pushing all the information down
    a stream toward `cout`.


    The terminating curly brace will end the function definition and complete our
    first program. It’s a good idea to go ahead and put a new line after the last
    line of your code. Not only does it help for human readability, but past compilers
    would look for a new line in order to determine where to end parsing the end of
    the code. Relics of the past, it seems. We will next go over compiling to make
    sure that the code actually works.


    # Chapter 5: Compile Time: Getting an Executable


    Again, compiling goes fairly deeply into a particular field of software and deserves
    the amount of attention it gets. Without compilers, high-level languages couldn’t
    really exist since they need a way to be translated into machine understandable
    code. For now, let’s just focus on what we need to fundamentally understand to
    change our program to an executable file.


    Hopefully you haven’t closed your command prompt, because we’re about to go right
    back to it. Make sure the command prompt is in the correct working directory as
    well. An easy way to do this is to run either the `dir` or `ls` commands, which
    print to the screen what files are in your current working directory for Windows
    or Linux respectively. The only file you should see is `"hello.cpp"` for now.


    The actual command to compile varies from machine to machine. The general form
    is `g++` usually, with an occasional `"-"` directly after it. The reason this
    discrepancy can happen is due to conflicting versions of the compiler being used.
    This can happen most likely due to various IDE’s being installed on the same machine.
    Another useful point is the `-o` flag which requires some text after it which
    will be the name of the executable that gets named. The default name that the
    compiler will use is simply `"a.exe"` in Windows.


    If you followed the tutorial thus far, then there shouldn''t be any extra text
    that gets printed out after the compiler runs and creates the executable file.
    If there''s something wrong with the code that is trying to be compile, there
    can be some abnormally abstract error messages that will try to tell you what''s
    wrong with the code. The most useful piece of the information that it gives you
    are the line numbers and the files in which they appear. They appear in the very
    first part of the line the error appears which follows the following pattern usually:
    `"<filename> : <line number> : <column number>."`


    Here''s an image of what it should like. The point about version discrepancies
    is also shown here, since the laptop used here needs the version shown. I also
    ran the program right after the successful compilation. The part that is encircled
    green is the actual output.


    ![program_output](images/00014.jpeg)


    The compiler understands when we need to go to another file to get some function
    definitions, so that way we just need to pass the compiler only the name of that
    one file. Now that we''ve gotten the green light on how our program runs, let''s
    move on and add a little more while we''re at it.


    # Chapter 6: Getting complex: Variables and Functions


    The next few concepts are included as a bit of a set of bonus lessons in order
    to facilitate learning. Essentially, the next few important steps are using variables
    and call some functions. These are staple items when starting out programming.


    Let''s tackle variables first. This way we can keep everything inside of `main`
    for now. A noticeable problem with the code currently is that the strings `"Hello
    World"` and `"Program Output"` repeat fairly often. Let''s put these two strings
    inside of some smaller reusable variables. Let''s call them `hello` and `prog_out`.


    Let me take a second to talk about variable naming. If you have three variables
    which stand for a three-dimensional coordinate system they could be `x`, `y`,
    and `z` which might be fine in this case; however, there could be multiple systems
    involved as in a graphics engine with the model, camera, and world coordinate
    systems requiring their versions of each variable. The question here is how would
    you name each set of variables. One way could be just to tag it with the first
    letter of each system that needs to be made like `x_m` for the model system''s
    x-coordinate. The problem with that is if you came back after a long time of not
    dealing with the code, then you may forget what the `"m"` means, since it could
    be model or main view. The best, and sometimes longest, method to name a variable
    like this is to just put the entire word afterwards like `x_model`. This would
    make for some easy reading then.


    Now that we''ve gotten through the bit about naming, we can put variables to work
    for our current code. The picture below will somewhat sum things up, but in case
    you need it in words I explain it afterwards as well.


    ![pic1](images/00015.jpeg)


    The first thing that''s noticeable is the extra include statement at the top.
    This includes the `string` data type into our program for use in our function.
    The next thing is the `using namespace` part that''s outside of the function definition.
    This is along the lines of making smaller code using variable names, since now
    that I''m declaring that I''m using the `std` namespace all the variables involved
    with it are automatically brought over into our program.


    The next two lines in the function that are new are the actual variable declarations.
    This is the typical way that variables are declared of any data type. Strings
    are a unique case in that they are really just a simpler way to understand the
    idea of a `char*` data type, which essentially says that this variable points
    to a character.

