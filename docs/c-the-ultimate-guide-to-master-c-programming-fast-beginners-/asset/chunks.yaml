    # 编程基础


    在编码中，重要的语法结构主要是分隔符的放置。更具体地说，是语言希望我们如何构建函数、将入口函数称为什么什么，以及语句是否需要终止符。后者的一个例子是在 `C++`
    和其他语言中，基本上将分号用作句号使用。


    最后一次提到主要是针对一种名为 `Python` 的语言。它使用制表符（tabs）作为指示，判断下一行是否是函数、循环或类块的一部分。它与 `C++` 相比有一种令人讨喜的独特风味，在我们掌握了还需要涵盖的基础编程概念之后，可能值得一读。


    [点击此链接获取 Notepad++。](https://notepad-plus-plus.org/download/v6.9.html)


    最棒的部分是，这个代码编辑器不仅能高亮 `C++`，还能高亮许多其他语言。Linux 也使用一种名为 `gedit` 的混合文本和代码编辑器，这是 Notepad++
    的另一个酷点。有趣的是，我们基本上只是在尝试让 Windows 变得更像 Linux，这样我们就可以编程了，不是吗？


    # 第 3 章：设置工作空间：文件结构是关键


    最后的设置步骤在这里。某些人会说这一步是可选的；然而，请想这样一个快速场景：假设你被要求协助开发一个非常大的项目。还有其他程序员和你一起工作。他们每个人都有自己做事的方式，这在早期就可能导致一些问题。其中一人向你寻求帮助来处理他的部分代码。他试图快速解释一下，但当你试图进入一个又一个软件文件夹时，你已经已经迷失了方向。这里有一个接口，那里有一个感悟，而在这个远处的另一个文件夹里还有一些实用程序。看到问题了吗？


    现在。这个简单的例子似乎违背了需要严格目录结构的初衷，但倒数第二章将让你向程序中添加几段代码，以验证一个易于理解的目录结构的必要性。我们要做的最多操作涉及
    2 个文件夹。


    对于主示例，我们需要创建一个名为 `tutorials` 的文件夹。如果你已经知道如何做到这一点，请继续阅读第 4 章。否则，这里是使用 Windows 创建新文件夹的逐步说明，尽管大多数其他操作系统也会遵循某种相似的格式。


    第一步是进入你的 `Desktop`（桌面）。这是你所有图标所在的地方。底部是 `Taskbar`（任务栏），上面有 `Start`（开始）按钮和右下角的时钟。将光标置于
    `Desktop` 上并右键点击。你应该看到类似于右侧图像的内容。


    选择之后，我们要做的下一步是重命名文件夹，以便以后更容易找到它。要这样做，你只需要右键点击文件夹并点击 `rename`（重命名）。你可能需要左键点击文件夹以确保在右键点击之前文件夹已被选中。下图将显示上下文菜单可能的样子。


    ![1new_folder](img/00007.jpeg)


    虽然这看起来很简单，但还有其他仅通过命令行操作来创建文件夹的方法。在没有图形用户界面（`GUI`）的系统中（大多数操作系统都是如此），确保你将文件和文件夹放在正确的位置是至关重要的。代码可以写得多么完美，但如果你或编译器找不到它，它就好像根本不存在一样。


    关于文件结构的最后一个注释是，创建它是一回事，在整个开发过程中遵循它才是大多数程序员面临的问题。这意味着要随时知道什么在什么位置。如果你能向一个对系统几乎了解或完全不了解的人解释你的代码结构，并且他们可以找到目录中的任何文件夹或（更好地是）文件，那么我们就做对了。


    ![3rename_folder](img/00008.jpeg)


    # 第 4 章：编程时间：向世界致敬


