    Pointers are a pivotal concept of C/C++ which actually shows up even in our current
    code. The `&` which appears before our variables that show up in our function
    calls basically tell the function not to use the variable itself, but to use the
    value that is the variable is referencing. The following picture should clear
    up some confusion which most fledgling coders have problems initially understanding.


    ![ref](images/00016.gif)


    The gist is that if you have a variable that is a pointer to any certain data
    type, then you can turn that pointer into a value using a preceding asterisk or
    you can use a preceding ampersand to get the address of the variable to pass it
    to other functions and such. That''s a really simplified introduction to pointers,
    just so you know.


    Now then, getting back to the code. There should be ampersands in front of the
    variable mentions in our functions because they require a pointer to the string
    as opposed to a value. This enables the function to pass the correct string and
    print out the same output as last time.


    The next thing we''re going to add into our current program is the idea of writing
    more than one function. This might not be necessary for our simple example, so
    let''s add in some simple computation that will show the power of functions. The
    idea will be to add two numbers together and return their sum. For a challenge,
    try to add in an `if` statement to check if the value is negative and return zero
    if it is such. The solution will be in the conclusion.


    As for the function we''re going to add, let''s take out the middle part of our
    program and replace it with the function we want to add. For namesake, let''s
    call it `calc_sum` to keep things simple.


    The picture below shows one way to add it. The idea is that we want to keep as
    much as the old program as we can when we add in new functionality. We''ll just
    say that coders like to save time. The differing piece is whether we want the
    function to be responsible for printing its output to the screen or not. This
    also affects its return value being either `void` or `int` in this case. A quick
    synopsis of the code is given after the screenshot.


    ![last](images/00017.jpeg)


    Notice that there''s a one-liner before the `main` function again. This line is
    called a function prototype which tells the compiler that we''re going to define
    a function later on in our program that we want to use. In this case, it''s called
    `calc_sum` and it takes two integer values as arguments.


    The definition itself is fairly simple in that we just need to return the addition
    of two integers. It reads similarly to how we''ve done it in math, except that
    we now return it back to our caller. To make this even simpler is to directly
    return the operation of the adding the two values together, essentially just removing
    the `result` variable all together. There''s some interesting bickering that can
    happen whenever returning directly is a good idea or not, but that just means
    it''s also a good learning opportunity.


    The fact that we can simply just put the function into the standard output stream
    is pretty nice to me. Integer conversion to a string data type is implicit in
    C++ which can also be kind of nice as well.


    ## Conclusion


    We''ve successfully made a running program. Not only that, but we''ve even made
    a good dent into some introductory concepts inside of C++ which will also help
    you jumpstart your programming knowledge. The best part of learning about coding
    is that any point of entry will help to increase your momentum into the field
    as a whole.


    Before getting a motivational twinge, let''s step back and realize that we didn''t
    even get into virtual functions, friend classes, and so many other cool concepts.
    Coding is definitely my own personal hobby. The funny thing is that I''m also
    trying to make a career of it as well. The best way I can explain it is that just
    banging out some programs is a nice thing to do for a hobby, but when it comes
    to making a career out of it, it''s an entirely different animal. The amount of
    information available is only expanding, so people in the software industry are
    having to learn constantly.


    As for the solution to the `if` statement mentioned earlier, the picture on the
    next page should sum it up as a whole. Of course, there are plenty of other methods,
    such as using a `switch` statement or a ternary operator, that could''ve just
    as easily been implemented. Again, it''s all subjective. Interpretation is a big
    thing of how to write software, though the compiler will tell what''s right from
    wrong.


    Again, some important factors to notice are the fact that the `result` variable
    was used to check the result. If we wanted to use the direct return method, then
    conditional checking becomes a little less the fun and not but a bit more difficult.
    Programming is always a malleable piece of equipment.


    ![last4real](images/00018.jpeg)

