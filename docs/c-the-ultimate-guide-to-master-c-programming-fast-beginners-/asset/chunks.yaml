    \n![Описание: HACKING2](images/00004.jpeg)\n\n[Computer Hacking](http://www.amazon.com/Computer-Hacking-Essential-Beginners-internet-ebook/dp/B010965F36/ref=sr_1_fkmr1_3?s=digital-text&ie=UTF8&qid=1444557942&sr=1-3-fkmr1&keywords=Computer+Hacking%3A+The+Essential+Hacking+Guide+for+Beginners+%28+Hacking%2C+How+to+Hack%2C)\n\
    \n![computerhacking](images/00005.jpeg)\n\n[SQL](http://www.amazon.com/SQL-Beginners-database-programming-Programming-ebook/dp/B019A7VQD8/ref=sr_1_25?ie=UTF8&qid=1451913155&sr=8-25&keywords=sql)\n\
    \n![SQL](images/00006.jpeg)\n\nIntroduction\n\nMany of the applications of C++\
    \ involve more complex organizations of software pieces, including graphics and\
    \ scientific computations. This is not to say that Java or other languages lack\
    \ the ability to tackle these kinds of problems. C++ does have a history in these\
    \ fields, with its ancestor being the C programming language. The best way to\
    \ view it is that C++ added some object-oriented principles (OOP) to the C language\
    \ in order to become more modern at the time.\n\n              To be more specific,\
    \ C++ has a very identical syntax to C in general, but shares the OOP concepts\
    \ that Java also uses. This includes classes, polymorphism, encapsulation, inheritance,\
    \ and a number of other concepts. The gist is that C++ provides an easy to understand\
    \ platform for both new and old programmers to communicate easily about.\n\n             \
    \ This guide isn’t meant to bog you down in terminology though. Once you learn\
    \ any one programming language, the next will be easier so long as it’s in the\
    \ same family. Meaning, C++ will help you learn Java which will help you learn\
    \ C# and so on. The best way to choose a programming language is to find a feel\
    \ for how you might like to program. This could mean writing speech like statements\
    \ as in QBASIC, or writing esoteric coding magic as in Ook-Ook. In this case,\
    \ we need a language that will easily introduce the initial aspects of programming\
    \ while still being flexible enough for more advanced topics; therefore, we choose\
    \ the C++ programming language.\n\n              Now that we’re up to speed on\
    \ the general view that our programming language holds, we can start to tackle\
    \ some of the preliminary objectives of setting up our programming environment.\
    \ This will include an editor, a compiler and a file directory structure. The\
    \ editor is where you will actually write your code. The compiler will take your\
    \ code and make an executable application that will run on your computer. The\
    \ only purpose of the file directory structure is to minimize confusion as to\
    \ where your files are being saved while you’re coding. Shall we begin?\n\nChapter\
    \ 1: Installing Cygwin: Linux-Like Development\n\n              The first step\
    \ is to get the compiler. The reason is that this will force some constraints\
    \ on how your program will run after the compiler process it. An example of this\
    \ is that there are some compiler specific macros, such as __sync_synchronize\
    \ from the gcc compiler that will add some extra instructions that you don’t have\
    \ to add yourself.\n\n              Compiler concepts aside, there are some other\
    \ issues with using different compilers with the same program. Compiler warnings\
    \ will also cause some unneeded confusion whenever you’re trying to find problems\
    \ with your code. The selection of a compiler can also be limited because of consensus\
    \ over one particular compiler causing a stagnation of further research.\n\n             \
    \ Another perk to using the Cygwin package is that it follows a similar format\
    \ to the default Linux compiler. The specific compiler we’ll be using from the\
    \ Cygwin package is the g++ compiler which will have a few quirks about it, but\
    \ it’ll help to get us intimate with the code well enough that we don’t just hit\
    \ a magical button to get executable code, like some other integrated development\
    \ environments (IDE).\n\n              There’s plenty of research being done about\
    \ compilers in general. Concepts that are applied include formal languages, automata,\
    \ and various other more advanced topics. If you have further interest as to how\
    \ compilers work under the hood, there are plenty of resources available online\
    \ as well as some easy to understand explanations of the most popular compilers.\n\
    \n [Click this link to grab Cygwin.](http://cygwin.com/install.html)\n\n             \
    \ Once that’s installed, there are few other things that you can do now. The Linux\
    \ operating system uses the bash different scripting language whereas Windows\
    \ uses batch. The difference between bash and batch are fairly numerous, but both\
    \ share some general functionality. Mentioning this, Cygwin actually adds in some\
    \ of the commands that bash has, but Windows makes a little more complex.\n\n\
    The pwd command is going to be useful later, since it will print the working directory\
    \ that the command prompt, or terminal, is using as its place to execute commands.\n\
    \nChapter 2: Installing Notepad++: Going from Text to Code\n\n              The\
    \ next thing that we’ll need to download is the code editor. The difference between\
    \ a code editor and a simple text editor is primarily apparent in the fact that\
    \ the former will provide some helpful syntax highlighting, among other features.\n\
    \n              Syntax of a language encompasses the keywords, grammatical structure,\
    \ and whitespace parsing as well as other pieces. The purpose of syntax in coding\
    \ is fairly identical to syntax applied to language in general. It provides an\
    \ agreed upon structure of the form of a statement.\n\n              The keywords\
    \ of a language are special words which are unique to programming. These include\
    \ loop structures such as for, while, and do-while; data types are also included\
    \ such as float, double, string, and so on."
