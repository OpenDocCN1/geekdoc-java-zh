    至于程序体，我们有两个主要部分需要介绍。第一部分是 `printf` 函数，它接受一种名为 `string`（字符串）的数据类型，以及一个可选的各种数据类型的可变变量列表，将其放入主字符串中。将其分解，`string`
    仅仅是字符的集合。`C++` 中的字符完全通过简单的 Google 搜索即可获得的美国信息交换标准（ASCII）表来表示。从本质上说，两个引号之间出现的任何内容都可以是一个
    `string`，但使用反斜杠进行特殊格式化的除外。该函数将按照字符串出现的形式原封地打印到屏幕上。


    `printf` 函数的最后一个实例包含了前面提到的一些有趣格式化。`"%c"` 模式告诉函数我们想在该空间放置一个字符，该字符的值是从列表中的第一个变量获取的，该变量是函数可选的第二个参数。我们想要放入字符串的字符是
    `''\n''` 字符。这个字符是换行符，它将强制随后的字符串显示在屏幕的下一行。我们基本上只是告诉函数在 particular 情况下将 `"%c"` 替换为
    `''\n''`。同样，在更复杂的系统中这将非常有用，特别是对于你尝试附加到主字符串中的字符串的实际格式化。


    主函数体的最后部分，我们将介绍 `C++` 如何与 `C` 语言不同地处理标准输入。在这种情况下，我们看到在标记 `std::cout` 和 `std::endl`
    中使用了 `std` 命名空间。命名空间仅仅是一种收集相关数据部分的方法，以便以最小的开销访问它们。这里使用的特定变量分别指的是标准输出流和行尾字符串。


    有趣的部分是 `"<<"` 部分。它告诉程序基本上是将它从任何种的函数、字面量或字符串数据类型的变量接收到的数据推出去。将其看作是将所有信息通过流推向 `cout`
    即可。


    结束性的大括号将结束函数定义并完成我们的第一个程序。在代码的最后一行之后添加一个新行是一个好主意。这不仅有助于人类阅读，而且过去的编译器会寻找新行来确定何时结束对代码结尾的解析。似乎是过去的遗迹。接下来我们将介绍编译，以确保代码实际上可以运行。


    # 第 5 章：编译时间：获取可执行文件


    再次，编译相当深入进入了软件的一个特定领域，值得受到应有的关注。没有编译器，高级语言就无法真正存在，因为它们需要一种翻译成机器可理解代码的方法。目前，让我们只关注将我们的程序更改为可执行文件从根本上需要理解的内容。


    希望你没有关闭命令提示符，因为我们即将回到那里。确保命令提示符处于正确的工作目录中。做到此点的简单方法是运行 `dir` 或 `ls` 命令，它们会分别在
    Windows 或 Linux 屏幕上打印出当前工作目录中的文件。目前，你应该看到的唯一文件是 `"hello.cpp"`。


    实际的编译命令随机器而异。通常的标准格式是 `g++`，偶尔在它后面直接跟一个 `"-"`。这种差异之所以发生，是由于使用了版本冲突的编译器。这最可能是由于在同一台机器上安装了各种
    IDE。另一个有用的点是 `-o` 标志，它要求在其后面跟一些文本，该文本将是被命名的可执行文件的名称。编译器将使用的默认名称在 Windows 中简单为
    `"a.exe"`。


    如果你到此为止了教程，那么在编译器运行并创建可执行文件之后，不应该有额外的文本打印出来。如果尝试编译的代码有问题，可能会出现一些异常抽象的错误信息，它们试图告诉你代码哪里错了。它给你的最有用的信息是行号和它们出现的文件。它们出现在错误出现行的最前面的部分，通常遵循以下模式：`"<filename>
    : <line number> : <column number>."`


    这里是它应该的样式。关于版本差异的点在这里也有显示，因为这里使用的笔记本电脑需要所示的版本。我还在成功编译后立即运行了程序。被绿色圆圈圈的部分是实际输出。


    ![program_output](img/00014.jpeg)


    编译器理解当我们需要去另一个文件获取某些函数定义时，这样我们只需要向编译器传递那一个文件的名称即可。现在我们已经获得了程序运行的绿灯，让我们继续下去，并顺便多加一点内容。


    # 第 6 章：变得复杂：变量和函数


    接下来的几个概念被作为一组额外的奖励课程包含进来，以便促进学习。基本上，接下来的几个重要步骤是使用变量和调用一些函数。这些是开始编程时的基本内容。


    让我们先处理变量。这样我们现在就可以把一切都留在 `main` 内部。目前代码的一个明显问题是字符串 `"Hello World"` 和 `"Program
    Output"` 重复得相当频繁。让我们把这两个字符串放在一些较小的可重用变量中。让我们称它们 `hello` 和 `prog_out`。


    让我花点时间谈谈变量命名。如果你有三个代表三维坐标系统的变量，它们可以是 `x`、`y` 和 `z`，这在目前情况下是可以的；然而，可能涉及多个系统，例如图形引擎中的模型、摄像和世界坐标系，它们需要各自的变量版本。这里的问题是你如何命名每组变量。一种方法是用每个系统的第一个字母来标记它，例如
    `x_m` 表示模型系统的 x 坐标。这种方法的问题是，如果你在长时间没有处理代码后又回来，你可能会忘记 `"m"` 代表什么，因为它可以是模型或主视图。命名这种变量最好且有时最长的方法是直接在后面加上整个单词，例如
    `x_model`。这将阅读变得容易。


    现在我们已经过了关于命名的部分，我们可以让变量为当前代码服务了。下面的图片将在某种程度上总结一下，但如果你需要文字说明，我稍后也会解释。


    ![pic1](img/00015.jpeg)


    最明显的是顶部额外的包含语句。这把 `string` 数据类型包含了我们的程序中，以便在函数中使用。下一个点是函数定义之外的 `using namespace`
    部分。这类似于使用变量名使代码更小，因为现在我声明正在使用 `std` 命名空间，所有与之相关的变量都自动带入了我们的程序。


    函数中新的两行是实际的变量声明。这是声明任何数据类型变量的典型方式。字符串是一个特殊情况，因为它们实际上是理解 `char*` 数据类型想法的一种更简单的方法，这本质上是说该变量指向一个字符。


