    下一行是函数头文件。在大多数现代语言中，编译器会尝试寻找名为 `main` 的函数并使其成为第一个运行的函数。这并不意味着我们必须把所有代码放在那里；事实上，这是一种坏习惯，稍后当我们有多个函数时就会看到这一点。在目前的情况下，我们定义了一个典型的
