    ![3_working_directory](images/00010.jpeg)


    ![4_working_directory](images/00011.jpeg) ![2create_the_file](images/00012.jpeg)


    Here’s where we can finally start our coding. You’ve successfully made a `C++`
    source file, even though it may be little less than full for now. To open it,
    you can do a couple of methods. The most obvious is double click it; however,
    you may have other applications which may interfere and open the file inside of
    them. To avoid this, right click the newly created file and pick the option `Open
    with` and click the `Choose default program…` option. Then find where `Notepad++`
    is installed. Normally, it should be inside of `C:\Program Files (x86)\Notepad++`
