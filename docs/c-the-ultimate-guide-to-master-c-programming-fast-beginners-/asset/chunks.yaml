    The code given below is explained in the following paragraphs.


    ```

    // code here

    ```


    The first four lines are preprocessor commands. In essence, we can look at these
    as library references so we can borrow common functions such as those the green
    comment lines mention. This is pretty common in most `C/C++` programs, and is
    only a small taste of what the preprocessor can do, which we’ll touch on later.


    The next line is a function header. In most modern languages, the compiler will
    try to find the function called `main` and make that the first function that runs.
