    the Constants. The following are Constant naming conventions:


    +   - Construct descriptive names that describe the Constant''s purpose

    - Create a name that includes all capital letters (e.g., CUSTOMER)

    - Compose a name utilizing all capital letters with an underscore if the name
    consists of multiple words (e.g., ORDER_NUM)'
