    # 前言


    我非常高兴能写一本关于 Java 的指导书籍，因为我与许多测试人员交流过，他们对缺乏学习自动化测试 Java 的信息而产生的挫败感深有体会。Java 是 Selenium
    的语言之一。新自动化测试人员面临的一个共同挑战是学习如何编程。因此，这本书旨在帮助初学者学习 Java。这本书的目的是满足那些被迫快速跳过自动化编程部分的自动化测试人员的需求，导致它们在操作
    Selenium 时遇到困难。


    # 目标读者


    目标读者群是几乎或完全没有 Java 知识的初学者。初学者是接触 Selenium 和 Java 的新手，并渴望建立 Java 原理的深度基础。


    # 为什么要学习 Java？


    Java 是一种强大的编程语言，在信息技术（IT）行业被频繁应用。Java 程序员在 IT 领域需求很大，能够用 Java 编写自动化脚本将你成为任何质量保证测试团队的香饽饽。有很多
    Java 论坛（留言板）支持需要问题解决方案的 Java 程序员。学习 Java 和 Selenium 是一个极佳的组合，会让任何质量保证测试人员在自动化项目中都变得高效。


    # 关于作者


    ![](img/5b60674af805079c320c25c8588bb60a_7_0.png)


    Rex Allen Jones II 是一位 QA/软件测试人员，热于分享软件测试知识。自 2005 年 2 月以来，他一直在观看网络研讨会、参加会议并测试应用程序。Jones
    先生于 1999 年 6 月毕业于 DeVry 大学，获得计算机信息系统（CIS）科学学学位。


    目前，Rex 担任顾问，曾任 User Group: Dallas / Fort Worth Mercury User Group (DFWMUG) 主管，以及
    User Group: Dallas / Fort Worth Quality Assurance Association (DFWQAA) 成员。除了用户小组成员外，他还是认证软件测试工程师
    (CSTE)，并拥有测试管理方法 (TMap) 认证。


    Jones 先生对对功能自动化测试感兴趣的人建议是学习编程语言。这一建议引导他写了两本《（第一部分和第二部分）你必须学习用于 QTP/UFT 的 VBScript》，这本书面向
    VBScript，VBScript 是统一功能测试（UFT，原名为 Quick Test Professional，QTP）的编程语言。此外，还有一本《第一部分
    – Java 4 Selenium WebDriver》和一本即将出版的《第二部分 – Java 4 Selenium WebDriver》面向 Java，而
    Java 是 Selenium 的编程语言之一。


    # 关于编辑


    ![](img/5b60674af805079c320c25c8588bb60a_9_0.png)


    当 Samantha Mann 不在德克萨斯州担任 IT 顾问时，她正在通过建设性编辑改进文档内容。她是一个用户体验专家。


    联系 Samantha：


    Samantha.danae@gmail.com


    https://www.linkedin.com/pub/samantha-man/84/


