- md: "\n# Continue To Next Statement\n\nThe \"continue\" keyword forces the current\
    \ loop iteration to stop and immediately execute the next loop iteration. As a\
    \ result, the condition and statement between both intervals are skipped. The\
    \ following is an example using the \"continue\" keyword to skip all odd numbers:\n\
    \n```java\npublic class ControlStructures {\n    public static void main(String[]\
    \ args) {\n        for (int x = 2; x <= 10; x++) {\n            if (x % 2 != 0)\
    \ continue;\n                System.out.println(\"Even numbers \" + x);\n    \
    \    }\n    }\n}\n```\n\n![](img/5b60674af805079c320c25c8588bb60a_138_0.png)\n\
    \nFigure 4.19 – Continue Keyword\n\nProgram Output:\nEven numbers 2\nEven numbers\
    \ 4\nEven numbers 6\nEven numbers 8\nEven numbers 10\n\nLine seven implements\
    \ the \"continue\" keyword to bypass all odd numbers. Therefore, the condition\
    \ and statements are skipped when the loop control variable \"i\" equals one,\
    \ three, five, seven, and nine.\n\n# Conclusion\n\nThe purpose of “Part 1 – Java\
    \ 4 Selenium WebDriver” was to provide a good foundational knowledge of Java.\
    \ An understanding of Java facilitates the process of testing an Application Under\
    \ Testing (AUT) via Selenium. The key to verifying data within an AUT, is knowing\
    \ how to access and manipulate data. Data is represented by variables, which can\
    \ be text or numbers. All variables must have a data type to indicate the range\
