    \ 2.15 是字符常量示例。\n\n## 布尔常量\n\n布尔常量初始化 `True` 和 `False` 值。\n\n## 数值常量\n\n数值常量包含整数类型或浮点类型。这些值允许使用下划线\
    \ (_)）像标点符号一样。通常，逗号（）、连字符（-）等用于划分数值。例如，一亿写为 100,000,000。下划线提高了一亿的可读性。以下是显示多个下划线的数值常量示例：\n\
    \n```java\npublic class MiscExample\n    public static void main(String[] args)\
