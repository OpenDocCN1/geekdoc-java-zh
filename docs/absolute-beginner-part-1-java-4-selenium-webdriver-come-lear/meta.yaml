  md: "# Operators\n\nOperators are symbols such as plus (+) and minus (-) that perform\
    \ mathematical operations (see Operators in Chapter 3). The operators are executed\
    \ on operands which is anything that can be changed. A variable is a common operand\
    \ which changes during execution. In Java, there are four types of operators:\n\
    \n+   1. Arithmetic – implement mathematical operations on numerical values\n\
    2. Bitwise – work on operands utilizing bits\n3. Logical – returns a boolean value\
    \ (true or false) based on one or more expressions\n4. Relational – returns a\
