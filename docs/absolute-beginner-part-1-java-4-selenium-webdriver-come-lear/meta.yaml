- md: "\n## Compound Assignments\n\nCompound Assignments (known as Shorthand Assignments)\
    \ join Arithmetic and Bitwise Operators with the Assignment Operator. The following\
    \ operators are excluded from the joining feature: increment, decrement, and one's\
    \ complement. This process shortens the assignment statement. For example, the\
    \ following two statements produce the same output:\n\ny = y + 3;\ny += 3;\n\n\
    Both statements assign variable \"y\" the value of \"y\" plus three. The following\
    \ is a list of compound assignments:\n\n1. += = (Add and Assignment) operator\n\
    2. -= = (Subtract and Assignment) operator\n3. *= = (Multiply and Assignment)\
    \ operator\n4. /= = (Divide and Assignment) operator\n5. %= = (Modulus and Assignment)\
    \ operator\n6. &= = (Bitwise AND and Assignment) operator\n7. |= = (Bitwise OR\
    \ and Assignment) operator\n8. ^= = (Bitwise exclusive OR (XOR) and Assignment)\
    \ operator\n9. <<= = (Left shift and Assignment) operator\n10. >>= = (Right shift\
    \ and Assignment) operator\n11. >>>= = (Unsigned right shift and Assignment) operator\n\
    \n| Compound Assignment | Description |\n| :--- | :--- |\n| += | Assigns the addition\
    \ outcome |\n| -= | Assigns the subtraction outcome |\n| *= | Assigns the multiplication\
    \ outcome |\n| /= | Assigns the division outcome |\n| %= | Assigns the division\
    \ remainder outcome |\n| &= | Assigns the bitwise AND outcome |\n| |= | Assigns\
    \ the bitwise OR outcome |\n| ^= | Assigns the bitwise exclusive OR (XOR) outcome\
    \ |\n| <<= | Assigns the signed left bit shift outcome |\n| >>== | Assigns the\
    \ signed right bit shift outcome |\n| >>>= | Assigns the unsigned right bit shift\
    \ outcome |\n\nFigure 3.11 – Compound Assignments\n\n## Ternary Operator\n\nAccording\
    \ to dictionary.com, ternary means, \"consisting of or involving three.\" Therefore,\
    \ the Ternary Operator (?) requires three operands. This operator is used to evaluate\
    \ boolean expressions and determine which value is assigned to the variable. The\
    \ following is the ternary operator syntax:\n\n### Syntax\n\nvariableType variableName\
    \ = expression1 ? expression2 : expression3;\n\n### Syntax Details\n\n| Argument\
    \ | Description |\n| --- | --- |\n| variableType | Data type of variable |\n|\
    \ variableName | Name of variable that will receive a value |\n| expression1 |\
    \ Boolean expression |\n| expression2 | Value if the boolean expression is true\
    \ |\n| : | Colon separates the values of expression2 and expression3 |\n| expression3\
    \ | Value if the boolean expression is false |\n| ; | Semi-colon completes the\
    \ ternary operator statement |\n\nFigure 3.12 – Ternary Operator Syntax Details\n\
    \nThe following is a ternary operator example:\n\n```java\npublic class Operators\
    \ {\n    public static void main(String[] args) {\n        int x, y;\n    }\n\
    ```\n\nx = 5;\nSystem.out.print(\"What is the value of x? \" + x);\n\ny = (x ==\
    \ 5) ? 7 : 1;\nSystem.out.print(\"x equals 5 so the boolean expression is true:\
    \ Value is \" + y);\n\ny = (x == 3) ? 7 : 1;\nSystem.out.print(\"x does not equal\
    \ 3 so the boolean expression is false: Value is \" + y);\n```\n\n```java\npublic\
    \ class Operators\n{\n    public static void main(String[] args) {\n        int\
    \ x, y;\n        x = 5;\n        System.out.println(\"What is the value of x?\
    \ \" + x);\n        y = (x == 5) ? 7 : 1;\n        System.out.println(\"x equals\
    \ 5 so the boolean expression is true: Value is \" + y);\n        y = (x == 3)\
    \ ? 7 : 1;\n        System.out.println(\"x does not equal 3 so the boolean expression\
    \ is false: Value is \" + y);\n    }\n}\n```\n\nFigure 3.13 – Ternary Operator\
    \ Example\n\n## **Program Output:**\n\nWhat is the value of x? 5\nx equals 5 so\
    \ the boolean expression is true: Value is 7\nx does not equal 3 so the boolean\
    \ expression is false: Value is 1\n\nLine 10 displays expression1 as (x == 5)\
    \ while line 13 displays expression1 as (x == 3). Both lines display expression2\
    \ as True and expression3 as 1. If the boolean expressions are True then \"y\"\
    \ is assigned 7, otherwise \"y\" is assigned 1.\n\n## Operator Precedence\n\n\
    The operator precedence is ranking Java's operators from high to low. Rankings\
    \ become important when a given expression has multiple operators. An expression\
    \ is evaluated from left to right and the operator with a higher precedence receives\
    \ the first evaluation. To change the precedence order, a parenthesis should be\
    \ implemented to point out which expression is evaluated first. The following\
    \ example shows two expressions which exclude and include a parenthesis:\n\n```java\n\
    public class Operators {\n    public static void main(String[] args) {\n     \
    \   int total;\n        total = 2 + 3 * 4;\n        System.out.println(\"What\
    \ is the total without a parenthesis? \" + total);\n        total = (2 + 3) *\
    \ 4;\n        System.out.println(\"What is the total with a parenthesis? \" +\
    \ total);\n    }\n}\n```\n\nProgram Output:\nWhat is the total without a parenthesis?\
    \ 14\nWhat is the total with a parenthesis? 20\n\nTypically, a Multiplication\
    \ (*) Operator is evaluated before Addition (+) Operator. The variable \"total\"\
    \ is assigned the same values in line seven and line 10. However, the statement\
    \ in line 7 does not contain parenthesis while line 10 contain parenthesis. In\
    \ line 7, the Multiplication (*) Operator is evaluated first for values 3 * 4\
    \ value 2 is added Addition (+) Operator. Therefore, the value 14 (3 * 4 = 12\
    \ and 12 + 2 = 14) is assigned to variable \"total\" in line 7. In line 10, the\
    \ parenthesis ranks higher than the Multiplication (*) Operator. As a result,\
    \ values 2 + 3 is evaluated within the parenthesis then the value 20 (2 + 3 =\
    \ 5 and 4 * 20) is assigned to variable \"total\" in line 10. According to The\
    \ Java Tutorials,\n\n| Operator | Precedence |\n| :--- | :--- |\n| Postfix | ++\
    \ -- |\n| Unary | ++ - ~ |\n| multiplicative | * / % |\n| additive | + - |\n|\
    \ shift | << >> |\n| relational | < <= |\n| equality | == != |\n| bitwise AND\
    \ | & |\n| bitwise exclusive OR | ^ |\n| bitwise inclusive OR | | |\n| logical\
    \ AND | && |\n| logical OR | || |\n| ternary | ? : |\n| assignment | += -= *=\
    \ /= |= ^= << >>> |\n\nFigure 3.15 – Operator Precedence\n\n## Data Type Casting\n\
    \nData type casting is when the value of a data type is converted into another\
    \ data type. For instance, the value of data type \"float\" can be converted to\
    \ another data type. However, the value of boolean data type can never be converted\
    \ to a numeric. There are two types of casts:\n\n1. Implicit Casting\n2. Explicit\
    \ Casting\n\n## Implicit Casting\n\nImplicit casting is when a conversion takes\
    \ place without an instruction to convert one data type into another. This type\
    \ of casting only happens for widening conversions. Widening conversions occur\
    \ automatically when the value of a specific data type is converted to a higher\
    \ type. Therefore, based on the primitive type hierarchy, an int can be converted\
    \ to a float, but an error arises when trying to convert a float to an int. The\
    \ following is implicit casting example:\n\n```java\npublic class Operators\n\
    {\n    public static void main(String[] args)\n    {\n        int i;\n       \
    \ float f;\n\n        i = 78;\n        System.out.println(\"The value of int 'i':\
    \ \" + i);\n\n        f = i;\n        System.out.println(\"The value of float\
    \ 'f': \" + f);\n    }\n}\n```\n\nFigure 3.16 - Assignment Type Conversion\n\n\
    **Program Output:**\n\nThe value of int 'i' is: 78\nThe value of float 'f' is:\
    \ 78.0\n\nNotice the value did not lose data when converting from 78 to 78.0.\
    \ The following two principles are necessary for an implicit casting:\n\n1. Both\
    \ data types are compatible\n2. Destination data type (left side) must have a\
    \ higher range than the source data type (right side)\n\nThe following is a list\
    \ of widening conversions according to the primitive data type hierarchy:\n\n\
    - byte converts to short, int, long, float, or double\n- short converts to int,\
    \ long, float, or double\n- char converts to int, long, float, or double\n- int\
    \ converts to long, float, or double\n- long converts to float or double\n- float\
    \ converts to double\n"
  mdcn: "\n\n## 复合赋值\n\n复合赋值（称为简写赋值）将算术运算符和位运算符与赋值运算符结合。以下运算符被排除在结合功能之外：增、、减和按位取反。此过程缩短了赋值语句。例如，以下两个语句产生相同的输出：\n\
    \ny = y + 3;\ny += 3;\n\n这两条语句都将变量 \"y\" 赋值为 \"y\" 加三的值。以下是复合赋值的列表：\n\n1. += =\
    \ （加法并赋值）运算符\n2. -= =（减法并赋值）运算符\n3. *= =（乘法并赋值）运算符\n4. /= =（除法并赋值）运算符\n5. %= =（取模并赋值）运算符\n\
    6. &= =（位与并赋值）运算符\n7. |= =（位或并赋值）运算符\n8. ^= =（位异或并赋值）运算符\n9. <<= =（左移并赋值）运算符\n\
    10. >>= =（右移并赋值）运算符\n11. >>>= =（无符号右移并赋值）运算符\n\n| 复合赋值 | 描述 |\n| :--- | :--- |\n\
    | += | 赋值加法结果 |\n| -= | 赋值减法结果 |\n| *= | 赋值乘法结果 |\n| /= | 赋值除法结果 |\n| %= | 赋值除余数结果\
    \ |\n| &= | 赋值位与结果 |\n| |= | 赋值位或结果 |\n| ^= | 赋值位异或结果 |\n| <<= | 赋值有符号左移结果 |\n\
    | >> | 赋值有符号右移结果 |\n| >>>= | 赋值无符号右移结果 |\n\n图 3.11 – 复合赋值\n\n## 三元运算符\n\n根据 dictionary.com\
    \ 的定义，ternary 的意思是“包含或涉及三个”。因此，三元运算符 (?) 需要三个操作数。该运算符用于评估布尔表达式并确定将哪个值赋给变量。以下是三元运算符的语法：\n\
    \n### 语法\n\nvariableType variableName = expression1 ? expression2 : expression3;\n\
    \n### 语法细节\n\n| 参数 | 描述 |\n| --- | --- |\n| variableType | 变量的数据类型 |\n| variableName\
    \ | 将接收值的变量名称 |\n| expression1 | 布尔表达式 |\n| expression2 | 布尔表达式为真时的值 |\n| : |\
    \ 冒号分隔 expression2 和 expression3 的值 |\n| expression3 | 布尔表达式为假时的值 |\n| ; | 分号完成三元运算符语句\
    \ |\n\n图 3.12 – 三元运算符语法细节\n\n以下是一个三元运算符的示例：\n\n```java\npublic class Operators\
    \ {\n    public static void main(String[] args) {\n        int x, y;\n    }\n\
    ```\n\nx = 5;\nSystem.out.print(\"What is the value of x? \" + x);\n\ny = (x ==\
    \ 5) ? 7 : 1;\nSystem.out.print(\"x equals 5 so the boolean expression is true:\
    \ Value is \" + y);\n\ny = (x == 3) ? 7 : 1;\nSystem.out.print(\"x does not equal\
    \ 3 so the boolean expression is false: Value is \" + y);\n```\n\n```java\npublic\
    \ class Operators\n{\n    public static void main(String[] args) {\n        int\
    \ x, y;\n        x = 5;\n        System.out.println(\"What is the value of x?\
    \ \" + x);\n        y = (x == 5) ? 7 : 1;\n        System.out.println(\"x equals\
    \ 5 so the boolean expression is true: Value is \" + y);\n        y = (x == 3)\
    \ ? 7 : 1;\n        System.out.println(\"x does not equal 3 so the boolean expression\
    \ is false: Value is \" + y);\n    }\n}\n```\n\n图 3.13 – 三元运算符示例\n\n## **程序输出：**\n\
    \nWhat is the value of x? 5\nx equals 5 so the boolean expression is true: Value\
    \ is 7\nx does not equal 3 so the boolean expression is false: Value is 1\n\n\
    第 10 行显示 expression1 为 (x == 5)，而第 13 行显示 expression1 为 (x == 3)。这两行都显示 expression2\
    \ 为 True，expression3 为 1。如果布尔表达式为 True，则 \"y\" 被赋值为 7，否则 \"y\" 被赋值为 1。\n\n## 运算符优先级\n\
    \n运算符优先级是 Java 运算符从高到低的排序。当给定的表达式有多个运算符时，排序就变得非常重要。表达式从左到右求值，优先级较高的运算符先接受评估。要更改优先级顺序，应该使用括号来指出哪个表达式先被评估。以下示例展示了一个不包含括号和一个包含括号的表达式：\n\
    \n```java\npublic class Operators {\n    public static void main(String[] args)\
    \ {\n        int total;\n        total = 2 + 3 * 4;\n        System.out.println(\"\
    What is the total without a parenthesis? \" + total);\n        total = (2 + 3)\
