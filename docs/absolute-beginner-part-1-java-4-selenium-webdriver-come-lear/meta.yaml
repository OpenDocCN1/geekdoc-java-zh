    # Constants


    Constants (also known as Literals) are unchangeable values assigned to a variable
    name of a particular data type. The way each Constant is defined depends upon
    its data type. Defining a Constant is a defense mechanism to protect information
    so that the value remains fixed. For instance, the total hours in a day is 24,
    therefore, a Constant is declared so that the value of 24 does not change. The
    following are four types of constants:


    +   1. String Constants

    2. Character Constants

    3. Boolean Constants

    4. Numeric Constants'
