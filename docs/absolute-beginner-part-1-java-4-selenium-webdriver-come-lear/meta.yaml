  - '[PAGE 84]


    # Short-Circuit Behavior Operators


    Short-circuit behavior operators are ||.(Logical OR) and &&.(Logical AND) operators.
    Notice from Figure 3.6, ||.(Logical OR) and &&&(Logical AND) and |&(Bitwise OR)
    and &(Bitwise AND) operators. However, the distinguishing characteristic relies
    on evaluating the operands.


    If the first operand returns false then the &&.(Logical OR) Operator will not
    evaluate the second operator. Yet, the &(Bitwise AND) Operator always evaluate
    both operands. Likewise, the ||.(Logical OR) Operator will not evaluate the second
    operator if the first operand returns true. Contrary to the ||.(Logical OR) Operator,
    the |&(Bitwise OR) Operator will always evaluate both operands.


    **Note:** The short-circuit behavior operators do not evaluate the second operator
    because it knows the result regardless of the second operand.'
