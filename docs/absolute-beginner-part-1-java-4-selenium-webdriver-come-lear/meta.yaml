    | Operator | Description |

    |---|---|

    | + | Adds a value on both sides of the (+) operator Used for joining strings
    which is known as string concatenation |

    | - | Substracts right operand from left operand |

    | * | Multiplies values on both sides of the (*) operand |

    | / | Divides left operand by right operand |

    | % | Divides left operand by right operand then returns the remainder |

    | ++ | Increases the operand''s value by one |

    | -- | Decreases the operand''s value by one |


    Figure 3.2 – Arithmetic Operators


    Note: The Division Operator (/) truncates the remainder while the Modulus Operator
    (%) returns the remainder. For instance, 10/3 only'
