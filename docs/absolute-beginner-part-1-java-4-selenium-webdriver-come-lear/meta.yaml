- md: "\n# Explicit Casting\n\nExplicit casting is when a conversion takes place with\
    \ an instruction to the compiler to convert one data type into another data type.\
    \ This type of casting can happen for widening and narrowing conversion. Narrowing\
    \ conversion occurs when the value of a specific data type is converted to a lower\
    \ data type. Consequently, an error will not be generated when converting a float\
    \ to an int. The following is an explicit casting syntax:\n\n### Syntax\n(targetDataType)\
    \ expression;\n\n## Syntax Details\n\n| Argument | Description |\n|---|---|\n\
    | targetDataType | Desired data type to convert the expression |\n| expression\
    \ | Value that will be converted |\n| ; | Semi-colon completes the explicit casting\
    \ statement |\n\nFigure 3.17 – Explicit Casting Syntax Details \n\nThe following\
    \ is an explicit casting example:\n\n```java\npublic class Operators\n{\n    public\
    \ static void main(String[] args)\n    {\n        int i = 8;\n        double d\
    \ = (double) i;\n\n        System.out.println(\"What is the value of int 'i? \"\
    \ + i);\n        System.out.println(\"What is the value of double 'd? \" + d);\n\
    \n        float f = 12.34f;\n        short s = (short) f;\n    }\n}\n```\n\nSystem.out.println(\"\
    What is the value of float '?f?\" + f);\nSystem.out.println(\"What is the value\
