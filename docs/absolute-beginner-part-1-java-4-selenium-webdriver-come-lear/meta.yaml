    # 谢谢


    感谢我的妻子 Tiffany、孩子 Olivia 和 Rex III、编辑 Samantha Mann、以及许多朋友。写这本书花费了时间，你们的支持推动了这本书向前发展。


    感谢


    img/5b60674af805079c320c25c8588bb60a_11_0.png)


    Rex Allen Jones II


