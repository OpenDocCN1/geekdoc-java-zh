    \ amount is \" + SECOND_AMOUNT);\n14     System.out.println(\"The total of both\
    \ amounts is \" + TOTAL_AMOUNT);\n15   }\n16 }\n```\n\n图 2.20 – 数值常量示例\n\n**程序输出：**\n\
    第一个金额是 111111111\n第二个金额是 222222222\n总金额是 333333333\n\n第二章描述了如何声明和初始化变量。此外，还讨论了四种类型的变量（局部、参数、实例和类）以及原始数据类型。第三章将探索\
