  md: "# For Loop\n\nThe for loop executes a block of code for a certain number of\
    \ iterations. In other words, a statement is executed as long as a condition is\
    \ met. One of the loop benefits is to allow statements to be executed without\
    \ writing code repeatedly. The following is for the loop syntax:\n\n# Syntax\n\
    \n```\nfor (initialization; condition; iteration)\n{\n  statement(s)\n}\n```\n\
    \n# Syntax Details\n\n| Argument | Description |\n| --- | --- |\n| for | Keyword\
    \ that starts the loop |\n| initialization | Assignment that sets the loop control\
    \ initial value |\n| ; | Semi-colon completes the initialization |\n| condition\
    \ | A boolean expression that determines if the loop will or not repeat |\n| ;\
    \ | Semi-colon completes the condition |\n| iteration | Indicates how the loop\
    \ control variable will change after each variation |\n| { | An opening bracket\
    \ |\n| statement(s) | Statement(s) that will execute after the condition is met\
    \ |\n| ; | Semi-colon completes the statement |\n| } | A closing curly bracket\
    \ |\n\nFigure 4.10 – For Loop Syntax Details"
