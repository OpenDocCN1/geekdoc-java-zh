    # Preface


    I am thrilled to write an instructional book on Java because I have talked with
    many testers who can relate to the frustration caused by the lack of information
    to learn Java for automation testing. Java is one of the languages for Selenium.
    A common challenge with new automation testers is learning how to program. Therefore,
    this book is designed to help an absolute beginner learn Java. The purpose of
    this book is to fill a need of automation testers who are forced to hurry past
    the programming component of automation, leading to a struggle with working in
    Selenium.


    # Target Audience


    The target audience is beginners with little to no knowledge of Java. Beginners
    are people new to Selenium and Java, and have a desire to establish a deep foundation
    of Java principles.


    # Why learn Java?


    Java is a powerful programming language that is frequently and commonly implemented
    in the Information Technology (IT) industry. Java programmers are in high demand
    in the IT field and being able to code automation scripts in Java will make you
    a commodity to any quality assurance testing team. There are many Java forums
    (message boards) online that support Java programmers in need of a solution for
    a problem. Learning Java and Selenium is a great combination that will make any
    quality assurance tester effective on an automation project.


    # About the Author


    ![](img/5b60674af805079c320c25c8588bb60a_7_0.png)


    Rex Allen Jones II is a QA/Software Tester with a passion for sharing knowledge
    about testing software. He has been watching webinars, attending seminars, and
    testing applications since February 2005. Mr. Jones graduated from DeVry University
    in June 1999 with a Bachelor’s of Science degree in Computer Information Systems
    (CIS).


    Currently, Rex is a Consultant and former Director for User Group: Dallas / Fort
    Worth Mercury User Group (DFWMUG) and member of User Group: Dallas / Fort Worth
    Quality Assurance Association (DFWQAA). In addition to his User Group memberships,
    he is a Certified Software Tester Engineer (CSTE) and has a Test Management Approach
    (TMap) certification.


    Mr. Jones’ advice for people interested in Functional Automation Testing is to
    learn the programming language. This advice led him to write two books “(Part
    1 & Part 2) You Must Learn VBScript for QTP/UFT” geared towards VBScript which
    is the programming language for Unified Functional Testing (UFT) formerly known
    as Quick Test Professional (QTP). In addition, one book “Part 1 – Java 4 Selenium
    WebDriver” and an upcoming book “Part 2 – Java 4 Selenium WebDriver” geared toward
    Java which is one of the programming languages for Selenium.


    # About the Editor


    ![](img/5b60674af805079c320c25c8588bb60a_9_0.png)


