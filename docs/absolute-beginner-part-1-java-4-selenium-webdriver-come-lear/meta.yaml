    be written and compiled. Statements are referred to as code—a line or lines of
    information in a particular syntax. The key to all programming languages is the
    syntax. Syntax is a set of rules that specifies a structured combination of words
    and symbols. If not structured correctly, an error occurs to prevent the statements
    from compiling.


    Compiling statements is performed via a compiler. A compiled language refers to
    a special program that retrieves the statements developed by a programmer and
    then translates the statements into'
