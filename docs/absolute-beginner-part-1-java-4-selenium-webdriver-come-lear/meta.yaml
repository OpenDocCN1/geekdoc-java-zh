    \n- byte converts to char\n- short converts to byte or char\n- char converts to\
    \ byte or short\n- int converts to byte, short, or char\n- long converts to byte,\
    \ short, char, or int\n- float converts to byte, short, char, int, or long\n-\
    \ double converts to byte, short, char, int, or long, or float\n\n## Expressions\n\
    \nOperators, variables, constants, and methods (calls and returns) are components\
    \ of an expression. A component joined with an operator forms an expression. It\
    \ is possible to create a compound expression by combining multiple expressions.\
    \ However, the data types must be compatible to construct a valid compound expression.\
    \ For example, an int data type can be mixed with a long data type because both\
    \ are numeric.\n\nThrough the use of type promotion rules, the mixture of data\
    \ types is converted to the same data type. Values that are returned from an expression\
    \ depend on the data type. Data types char, byte, and short are advanced to int.\
    \ An expression is promoted to long if one of the operands is a long data type.\
    \ The same goes for float data types, one of the operands is a float then the\
    \ whole expression is a float. Likewise, an expression is promoted to a double\
    \ data type if one of the operands is a double. The following is an expression\
    \ example with mix data types byte and float:\n\n```java\npublic class Operators\
    \ {\n    public static void main(String[] args) {\n        byte b = 7;\n     \
    \   float f = 34.56f;\n\n        float total = (b * f);\n        System.out.println(\"\
    The total of byte 'b' times float 'f' (7 * 34.56) is: \" + total);\n    }\n}\n\
    ```\n\n```java\n1 public class Operators\n2 {\n3     public static void main(String[]\
    \ args)\n4 {\n5     byte b = 7;\n6     float f = 34.56;\n7 \n8     float total\
    \ = (b * f);\n9     System.out.println(\"The total of byte 'b' times float (7\
    \ * 34.56) is: \" + total);\n10 }\n11 }\n```\n\nFigure 3.19 – Expression Example\n\
    \n## Program Output:\n\nThe total of byte 'b' times float (7 * 34.56) is: 241.920001\n\
    \nLine five declares and assigns a byte data type while line seven declares and\
    \ assigns a float data type. On line eight, the * (Multiplication) operator multiplies\
    \ both data types (byte and float) even though the types are mixed. However, the\
    \ expression is promoted as a float since one of the operands is a float.\n\n\
    Chapter 3 gave an account for the four types of Java operators: Arithmetic, Bitwise,\
    \ Logical, and Relational. The Assignment Operator and Ternary Operator were examined\
    \ along rankings of each operator. Chapter 4 will explain the two types of control\
    \ structures: branches and switch branch. There are three types of loops: for\
    \ loop, while loop, and do while loop.\n\n# Chapter 4\nControl Structures\n\n\
    Control structures are the process of using logic to force the program to skip\
    \ statements while looping other statements. Forcing the program to skip statements\
    \ is known as branching and looping specific statements is carried out via loops.\n\
    \nThe two types of branches are if branch and switch branch. The three types of\
    \ loops are for loop, while loop, and do while loop. In addition to the branches\
    \ and loops are jump statements. Chapter four will cover the following:\n\n- if\
    \ branch\n- switch branch\n- for loop\n- while loop\n- do while loop\n- break\n\
    - continue\n\n## If Branch\n\nThe if branch executes a statement when a condition\
    \ is true. In other words, a specific statement is executed if a condition is\
    \ met. The following is the syntax for if:\n\n### Syntax\n```java\nif (condition)\n\
    {\n    statement(s);\n}\n```\n\n### Syntax Details\n\n| Argument | Description\
    \ |\n|---|---|\n| if | Keyword that starts the if branch |\n| condition | Boolean\
    \ expression which results in true or false |\n| { | An opening curly bracket\
    \ |\n| statement(s) | Statement that will be executed if the condition is true\
    \ |\n| ; | Semi-colon completes the true statement |\n| } | A closing curly bracket\
    \ |\n\nFigure 4.1 – If Branch Syntax Details\n\nThe following example displays\
    \ a message if the customer brings three customers to a sporting event:\n\n```java\n\
    public class ControlStructures\n{\n    public static void main(String[] args)\n\
    {}\n```\n\n```java\nint extraCustomers = 4;\nif (extraCustomers >= 3)\n{\n   \
    \ System.out.println(\"Customer receives a discount\");\n}\n```\n\nFigure 4.2\
    \ – If Branch\n\n## Program Output:\n\nCustomer receives a discount\n\nLine five\
    \ assigns \"4\" to the variable \"extraCustomers\". Line seven displays keyword\
    \ \"if\" followed by a parenthesis. Inside the parenthesis is a condition (extraCustomers\
    \ >= 3) that returns true. True is returned because four is greater than three.\
    \ The statement at line nine (inside the curly brackets) is executed after the\
    \ true evaluation.\n\n**Note:** The program would not execute the statement if\
    \ the condition returned false. However, there are two variations of if branch\
    \ that can be executed when a condition is false:\n\n1. If Else\n2. If Else-If\n\
    \n## If Else Branch\n\nAn optional else keyword extends the if branch just in\
    \ case the condition returns false. Therefore, the statements following keyword\
    \ if and the condition is executed when a condition is true. Otherwise, the statement\
    \ following keyword else, is executed when a condition is false. The following\
    \ is the syntax for the if-else branch:\n\n```java\nif (condition)\n{\n  statement(s);\n\
    }\nelse\n{\n  statement(s);\n}\n```\n\nThe following example displays a message\
    \ when the customer does't bring three extra customers to a sporting event:\n\n\
    ```java\npublic class ControlStructures {\n  public static void main (String[]\
    \ args) {\n    int extraCustomers = 2;\n    if (extraCustomers >= 3) {\n     \
    \ System.out.println(\"Customer receives a discount\");\n    } else {\n      System.out.println(\"\
    Customer does not receive a discount\");\n    }\n  }\n}\n```"
