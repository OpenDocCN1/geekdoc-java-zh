    \ 中，所有变量都拥有数据类型、变量名和值。\n\n## 运算符\n\n运算符是如加号 (+) 和减号 (-) 类的符号，用于执行数学运算（参见第 3 章中的运算符）。运算符在操作数上执行，操作数可以是任何可以改变的内容。变量是一个在执行过程中变化的常用操作数。在\
