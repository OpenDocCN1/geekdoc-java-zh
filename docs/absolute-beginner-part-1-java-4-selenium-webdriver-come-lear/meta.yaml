  md: '# Escape Characters


    Escape characters (known as backslash character constants) represent a group of
    characters and non-graphical characters. According to Beginning Java® Programming
    (2015), "escape characters are used for displaying text in specific ways, either
    for inserting tabs or enters where desired, or by displaying a character that''s
    normally reserved for code syntax" (page 29).


    Characters such as single quotes ('''') have a distinct meaning and cannot be
    used directly. Therefore, a backslash character (\) must precede the character
    so that the compiler interprets a given statement correctly. The following is
    a list of escape characters:


    | Escape Character | Description | Unicode |

    |---|---|---|

    | \b | Inserts a backspace in the text | \u0008 |

    | \f | Inserts a form feed in the text | \u000C |

    | \n | Inserts a new line feed in the text | \u000A |

    | \r | Inserts a carriage return in the text | \u000D |

    | \t | Inserts a horizontal tab in the text | \u0009 |

    | \'' | Inserts a single quote (apostrophe) in the text | \u0027 |

    | \" | Inserts a double quote in the text | \u0022 |

    | \\ | Inserts a backslash in the text | \u005C |


    Figure 2.18 – Escape Characters'
