    \ value of short '?s?\" + s);\n16   }\n17 }\n```\n\nFigure 3.18 — Explicit Casting\
    \ Example\n\n## Program Output:\n\nWhat is the value of int '?i?' 8\nWhat is the\
    \ value of double '?d?' 8.0\nWhat is the value of float '?f?' 12.34\nWhat is the\
    \ value of short '?s?' 12\n\nLine five assigns \"8\" to data type int, which is\
    \ named \"i.\" An explicit widening conversion ensues at line six when variable\
    \ \"i\"—an int data type—converts to a double data type. Line 11 assigns 12.34\
    \ (a default data type of double), but converts it to a float data type 12.34f.\
    \ Variable \"f\" holds 12.34, converts to a short data type in line 12. Notice\
