    \n## Boolean Constants\n\nBoolean Constants initializes True and False values.\
    \ Figure 2.16 is a boolean example initializing the True to a variable named “result”\
    \ in line seven.\n\n## Numeric Constants\n\nNumeric Constants contain integer\
