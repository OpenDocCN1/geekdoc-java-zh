    \ program. The purpose of both types of comments is to self-document content written\
    \ in the program. Comments provide answers to two questions:\n\n- 1. What is the\
    \ purpose of the program, statements, etc.?\n- 2. Why did the programmer write\
    \ the program, statements, etc.?\n\nThe following is an example of a single and\
    \ multi-line comment:\n\n```\n/*\nProgrammer: Rex Jones II\nDescription: Show\
    \ both types of comments\nPurpose:\nDate:\n*/\npublic class Main\n{\n    public\
    \ static void main(String[] args)\n    {\n        // This is a single line comment\
    \ example\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n**Program\
    \ Output:**\n\nHello World!!!\n\nLine one begins the multi-line comment with a\
    \ forward slash (/) and an asterisk (*) while line six ends the multi-line comment\
    \ with an asterisk and forward slash (*/). Line 12 begins the single line comment\
    \ with two forward slashes (//) and does not include symbols to end the comment.\n\
    \nThis chapter provides general concepts regarding Java and will explain the following:\n\
    \n- Variables and Data Types\n- Operators\n- Control Structures\n- Object-Oriented\
    \ Programming (OOP)\n\n**Note:** Details of the concepts are covered in subsequent\
    \ chapters.\n\n## Variables and Data Types\n\nA variable is a memory location\
    \ with a name that contains a value (see Variables and Data Types in Chapter 2).\
    \ In order to use the variable, it must be declared and initialized. Declaring\
    \ a variable is stating that a variable exists by providing a data type and variable\
    \ name. Data type refers to the type of data that can be stored in a variable\
    \ while name identifies the variable. In Java, there are two kinds of data types:\
    \ primitive and reference. Primitive data type supports eight basic data types\
    \ and reference data type is based on a class. Initializing a variable is when\
    \ the variable is assigned a value that can change during program execution. The\
    \ following is a variable declaration and initialization example:\n\n```java\n\
    public class Declare_Initialize_Variable {\n    public static void main(String[]\
    \ args) {\n        int sum;\n        sum = 3 + 4;\n        System.out.println(\"\
    What is the sum of 3 + 4? \" + sum);\n    }\n}\n```\n\n```java\npublic class Declare_Initialize_Variable\
    \ {\n    public static void main(String[] args) {\n        int sum;\n        sum\
    \ = 3 + 4;\n        System.out.println(\"What is the sum of 3 + 4? \" + sum);\n\
    \    }\n}\n```\n\n**Figure 1.2 – Variable Declaration and Initialization**\n\n\
    **Program Output:**\n\nWhat is the sum of 3 + 4?\n\nLine five declares the variable\
    \ with a data type \"int\" and variable name \"sum\" while line seven initializes\
    \ \"3 + 4\" to the variable \"sum\". In Java, all variables possess a data type,\
    \ variable name, and value.\n\n## Operators\n\nOperators are symbols such as plus\
    \ (+) and minus (-) that perform mathematical operations (see Operators in Chapter\
    \ 3). The operators are executed on operands which is anything that can be changed.\
    \ A variable is a common operand which changes during execution. In Java, there\
    \ are four types of operators:\n\n- 1. Arithmetic – implement mathematical operations\
    \ on numerical values\n- 2. Bitwise – work on operands utilizing bits\n- 3. Logical\
    \ – returns a boolean value (true or false) based on one or more expressions\n\
    - 4. Relational – returns a boolean value (true or false) by comparing operands\n\
    \nThe following is an Arithmetic Operator example:\n\n```java\npublic class Subtraction_Operator\
    \ {\n    public static void main(String[] args) {\n        // Subtraction Operator\n\
    \        int x, y, answer;\n\n        x = 100;\n        y = 80;\n\n        answer\
    \ = x - y;\n        System.out.println(\"What is 100 - 80? \" + answer);\n   \
    \ }\n}\n```\n\n```java\npublic class Subtraction_Operator\n{\n    public static\
    \ void main(String[] args) {\n        // Subtraction Operator\n        int x,\
    \ y, answer;\n        x = 100;\n        y = 80;\n        answer = x - y;\n   \
    \     System.out.println(\"What is 100 - 80? \" + answer);\n    }\n}\n```\n\n\
    Figure 1.3 – Subtraction Arithmetic Operator\n\n**Program Output:**\n\nWhat is\
    \ 100 - 80? 20\n\nLine seven declares the variables “x, y, answer” with an int\
    \ data type. However, lines nine and 10 assign the values (x = 100 and y = 80)\
    \ to two of the variables. The - Subtraction operator is implemented at line 12\
    \ and subtracts the right operand “y” from the left operand “x” then assigns the\
    \ value “20” to variable “answer”.\n\n## Control Structures\n\nControl structures\
    \ provide ways to regulate the flow of a program (see Control Structures in Chapter\
    \ 4). The flow is directed by branches and loops. Branches allow certain statements\
    \ to be skipped after evaluating a condition or variable. Loops permit specific\
    \ statements to be repeated according to a boolean expression. The following is\
    \ a list of two branches and three loops:\n\n## Branches\n\n- 1. If Branch – executes\
    \ a statement when a condition is true\n- 2. Switch Branch – evaluates a variable\
    \ then execute a statement according to the variable’s value\n\n## Loops\n\n-\
    \ 1. For Loop – executes a block of code a certain number of iterations\n- 2.\
    \ While Loop – repeats a statement while a boolean expression is true\n- 3. Do\
    \ While Loop – execute a statement at least one iteration and continue while the\
    \ boolean expression is true\n\nThe following is an if branch example:\n\n```java\n\
    public class If_Branch {\n    public static void main(String[] args) {\n     \
    \   // If Branch\n        boolean study;\n\n        study = true;\n\n        if\
    \ (study == true) {\n            System.out.println(\"You can learn Java / Selenium\
    \ within 30 days\");\n        } else {\n            System.out.println(\"May take\
    \ a little longer than 30 days but patient\");\n        }\n    }\n}\n```\n\n```java\n\
    public class If_Branch {\n    public static void main(String[] args) {\n     \
    \   // If Branch\n        boolean study;\n\n        study = true;\n\n        if\
    \ (study == true) {\n            System.out.println(\"You can learn Java / Selenium\
    \ within 30 days\");\n        } else {\n            System.out.println(\"May take\
    \ a little longer than 30 days but patient\");\n        }\n    }\n}\n```\n\nFigure\
    \ 1.4 – If Branch Example\n\n**Program Output:**\nYou can learn Java / Selenium\
    \ within 30 days\n\nBranch is evaluated by way of condition (study == true). Line\
    \ eight assigns variable \"study\" the value true. As a result, the condition\
    \ \"if (study == true)\" evaluates to true. Therefore, the program executes line\
    \ 12 and skip the remaining lines (line 14–17). On the other hand, the program\
    \ would have executed lines 14–17 and skipped lines 11–13 if the condition was\
    \ false.\n\n## Object-Oriented Programming (OOP)\n\nJava is an object-oriented\
    \ programming (OOP) language that is structured around objects. An object is anything\
    \ that can be seen or perceived. All objects have two characteristics: state and\
    \ behavior. State identifies the object and behavior represent the actions of\
    \ the object. For example, a customer can be identified by their name (state)\
    \ while talking (behavior) is the action of the customer.\n\nBoth characteristics\
    \ \"state and behavior\" are defined by a class. A class is a template for objects\
    \ and forms the foundation for object-oriented programming. Data and statements\
    \ that operate on the data are specified by classes. In addition, access to the\
    \ data by way of classes are carried out through methods. A method manipulates\
    \ data and provide interaction with classes from other components of the program.\
    \ The following is an example illustrating a class, object, and method:\n\n```java\n\
    class Customer {\n    String name;\n    int age;\n\n    public static void main(String[]\
    \ args) {\n        Customer firstCustomer=new Customer();\n        firstCustomer.name\
    \ = \"Joe Doe\";\n\n        System.out.println(\"The customer's name is \" + firstCustomer.name);\n\
    \    }\n}\n```\n"
  mdcn: "\n一种易于理解的机器语言。一旦语句被翻译，计算机处理器就可以使用这种机器语言。需要重要的是，注释也是语句，但它们会被忽略，且永远不会引起错误。注释是帮助程序员理解程序和/或其它语句的备注。以下是两种类型的注释：\n\
