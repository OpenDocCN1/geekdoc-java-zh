    # 概述


    Java 是一种由太阳微系统开发的强大编程语言。它是一种广泛使用的、改变了世界的面向对象的语言。Java 应用于许多设备，如手机。为了使用 Java，必须下载并安装
    Java 开发工具包（JDK）和一个集成开发环境（IDE），如 Eclipse。


    以下链接在本书期间下载 Java 开发工具包（JDK）和 Eclipse IDE 是有效的：


    下载 Java 开发工具包 (JDK)


    http://www.oracle.com/technet/java/javase/downloads/jdk8-downloads-2133151.html


    下载 Eclipse IDE


    https://eclipse.org/downloads/


