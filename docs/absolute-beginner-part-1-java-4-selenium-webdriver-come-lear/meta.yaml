  md: '# Default Constant Data Types


    Data types int and double are default Constant types in their respective category.
    However, the default type can be modified by appending a letter of the target
    type. An int data type changes to a long data type by attaching the letter "l"
    or "L." For example, a value of 34 indicates an int data type by default 34l or
    34L indicates a long data type. The same is true with a double data type. A value
    of 12.34 specifies a double data type by default, but 12.34f or 12.34F specifies
    a float data type.


    **Note:** This section points out the default constant data types. However, a
    constant can be declared as any primitive data type.'
