  md: '# Bitwise Operators


    The Bitwise Operator work on operands utilizing bits. Therefore the Bitwise operator
    have a foundation that functions on a bit-by-bit basis. Values are made available
    after the bits are set, shifted, and tested. Prima, the Bitwise Operators are
    used on data types byte, char, int, long, and short. The following is a list of
    bitwise operators and examples:


    +   1. & (Bitwise AND) operator

    2. | (Bitwise OR) operator

    3. ^ (Bitwise exclusive OR (XOR)) operator

    4. >> (Signed shift) operator

    5. >>> (Unsigned shift right) operator

    6. << (Signed shift left) operator

    7. ~ (One''s Compliment) operator


    | Operator | Description | Example |

    |---|---|---|

    | & | Places 1 bit in the result if a bit exists in both operands. Can be used
    on a boolean data type | x & y; |

    | | | Places 1 bit in the result if a bit exists in one of both operands. Can
    be used on a boolean data type | x | y; |

    | ^ | Places 1 bit in the result if a bit exists in one of the operands (not both)
    | x ^ y; |

    | >> | Shifts the left operand''s value to the right by the number of bits specified
    by the right operand | x >> 2 |

    | >>> | Shifts the left operand''s value to the right by the number of bits specified
    by the right operand while shifted value are filled with zeros (0) | x >>> 2 |

    | << | Shifts the left operand''s value to the left | x << 2 |'
