    # # Chapter 4

    Control Structures


    Control structures are the process of using logic to force the program to skip
    statements while looping other statements. Forcing the program to skip statements
    is known as branching and looping specific statements is carried out via loops.


    The two types of branches are if branch and switch branch. The three types of
    loops are for loop, while loop, and do while loop. In addition to the branches
    and loops are jump statements. Jump statements allow execution to bypass unnecessary
    components of the program. The jump statements utilize keywords break and continue.
    Both keywords can be included within all branches and loops.


    Chapter four will cover the following regarding control structures:


    +   - If Branch

    - Switch Branch

    - For Loop

    - While Loop

    - Do While Loop

    - Break To Exit

    - Continue To Next Statement'
