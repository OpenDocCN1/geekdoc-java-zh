    # Data Type Casting


    Data type casting is when the value of a data type is converted into a different
    data type. For instance, the value of one numeric data type "float" can be converted
    to another numeric data type "double." However, the value of a boolean data type
    can never be converted to a numeric type. There are two types of casts/conversions:


    +   1. Implicit Casting

    2. Explicit Casting


    Note: The primitive data type hierarchy from high to low is double, float, long,
    int, short, then byte.'
