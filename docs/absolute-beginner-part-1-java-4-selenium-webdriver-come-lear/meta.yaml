  mdcn: "\n\n第五行为变量“result”声明了一个布尔数据类型。第七行将 `false` 初始化为该变量。第九行打印 `false` 的默认值，但第十行在评估条件“100>99”后返回一个\
    \ `true` 值。返回真是因为 100 大于 99。\n\n## 常量\n\n常量（也称为字面量）是赋值给特定数据类型变量名的不可变值。每个常量的定义方式取决于其数据类型。定义常量是一种保护信息的防御机制，以确保该值保持不变。例如，一天的总小时数为\
    \ 24 小时，因此声明一个常量，使 24 这个值不发生变化。以下是四种类型的常量：\n\n- 1. 字符串常量\n- 2. 字符常量\n- 3. 布尔常量\n\
    - 4. 数值常量\n\n## 常量命名规范\n\n标准的常量命名规范有助于定位常量的过程。以下是常量命名规范：\n\n- 构建描述常量目的的描述性名称\n\
    - 创建包含全大写字母的名称（例如 CUSTOMER）\n- 如果名称包含多个单词，使用全大写字母加下划线组合名称（例如 ORDER_NUM）\n\n##\
    \ 声明和初始化常量\n\n常量的声明和初始化与变量类似。声明常量的区别在于使用了修饰符 `final`。使用 `final` 的声明语句告诉 Java 初始化值将不会改变。以下示例显示了常量的声明和初始化语句：\n\
    \n```java\npublic class VariableExample\n{\n    public static void main(String[]\
    \ args)\n{\n        final int DAYS_IN_WEEK = 7;\n        final int DAILY_MAX_HOURS\
    \ = 24;\n        int totalHours;\n\n        totalHours = DAYS_IN_WEEK * DAILY_MAX_HOURS;\n\
    \        System.out.println(\"The total of hours in a week is \" + totalHours);\n\
    \    }\n}\n```\n\n![](img/5b60674af805079c320c25c8588bb60a_59_0.png)\n\n图 2.17\
    \ – 声明和初始化常量\n\n## **程序输出：**\n\n一周的总小时数为168\n\n第六行和第七行使用修饰符 `final` 声明并初始化常量。常量名\
    \ `DAYS_IN_WEEK` 被赋值为 \"7\"，而 `DAILY_MAX_HOURS` 被赋值为 \"24\"。赋值的常量值在程序中不会改变。如果尝试更改常量，错误提示“The\
    \ final local variable NAME_OF_CONSTANT cannot be assigned”。\n\n## 默认常量数据类型\n\n\
    数据类型 `int` 和 `double` 是它们各自类别中的默认常量类型。然而，可以通过附加目标类型的字母来修改默认类型。`int` 数据类型通过附带字母\
