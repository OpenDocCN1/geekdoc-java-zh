    \ `float` 数据类型。\n\n**注意：** 本节指出了默认常量数据类型。然而，常量可以声明为任何原始数据类型。\n\n## 转义字符\n\n转义字符（称为反斜杠字符常量）表示一组字符和非图形化字符。根据《Beginning\
    \ Java® Programming》(2015)，“转义字符用于以特定方式显示文本，要么在需要的地方插入制表符或换行，要么通过显示通常用于代码语法的字符”（第\
    \ 29 页）。\n\n如单引号（''`）之类的字符具有特殊的含义，不能直接使用。因此，必须在字符前加上反斜杠字符（`\\`），以便编译器正确解释给定的语句。以下是转义字符列表：\n\
    \n| 转义字符 | 说明 | Unicode |\n|---|---|---|\n| \\b | 在文本中插入退格符 | \\u0008 |\n| \\\
    f | 在文本中插入分页符 | \\u000C |\n| \\n | 在文本中插入换行符 | \\u000A |\n| \\r | 在文本中插入回车符 |\
    \ \\u000D |\n| \\t | 在文本中插入水平制表符 | \\u0009 |\n| \\' | 在文本中插入单引号（省撇） | \\u0027\
    \ |\n| \\\" | 在文本中插入双引号 | \\u0022 |\n| \\\\ | 在文本中插入反斜杠 | \\u005C |\n\n图 2.18\
    \ – 转义字符\n\n## 字符串常量\n\n字符串常量包含在双引号（\"\"）中，表示字符字符序列。普通字符（例如数字、字母等）以及转义字符都可以在字符串常量中处理。以下是一个字符串常量的示例：\n\
    \n```java\npublic class MiscExamples {\n    public static void main(String[] args)\
