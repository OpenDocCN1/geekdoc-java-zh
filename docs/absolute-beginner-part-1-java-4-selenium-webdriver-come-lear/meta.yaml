    # Primitive Data Types


    The primitive data types give an account for the type of data that is stored in
    a variable. Each data type has a precise range and behavior. Consequently, a data
    type of int can store numerical data, but a type mismatch error will occur if
    boolean attempts to store numerical data. In addition, certain operations are
    permitted on values depending on the data type. As an example, a math calculation
    cannot be performed on a boolean data type because boolean cannot contain numbers.
    The following is a list of all eight primitive data types:


    | Type | Width in Bits (Bytes) | Description/Range |

    |---|---||

    | boolean | | True or False values |

    | byte | 8-bit (1-byte) | -128 to 127 |

    | char | 16-bit | Standard character set that can be a letter, control character,
    punctuation, or symbol representing all languages in the world |

    | double | 64-bit (8-byte) | -1.797693134862315E+308 to 1.797693134862315E+308
    |

    | float | 32-bit (4-byte) | -3.4028235E+38 to 3.4028235E+38 |

    | int | 32-bit (4-byte) | -2,147,483,648 to 2,147,483,647 |

    | long | 64-bit (8-byte) | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807
    |

    | short | 16-bit (2-byte) | -32,768 to 32,767 |


