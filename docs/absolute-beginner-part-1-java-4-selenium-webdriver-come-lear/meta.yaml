  md: '# Conclusion


    The purpose of “Part 1 – Java 4 Selenium WebDriver” was to provide a good foundational
    knowledge of Java. An understanding of Java facilitates the process of testing
    an Application Under Testing (AUT) via Selenium. The key to verifying data within
    an AUT, is knowing how to access and manipulate data. Data is represented by variables,
    which can be text or numbers. All variables must have a data type to indicate
    the range and behavior. The data type is significant when dealing with operators
    because certain functions are performed according to the data type. In addition,
    some of the operators are contributors to forming control structures. The following
    items are take–away topics from the book:


    +   Variables: A location that holds data


    +   Data Types: Refer to a variable’s type


    +   Operators: A symbol that performs mathematical or logical operations


    +   Control Structures: Refers to the process of using logic to force the program
    to skip or loop statements


    The second Java book is titled “Part 2 – Java 4 Selenium WebDriver.” It examines
    Classes, Objects, Methods, Inheritance, Packages, Interfaces, Exception Handling,
    and how to use Input/Output. The release date for “Part 2 – Java 4 Selenium WebDriver”
    is April 2016.'
