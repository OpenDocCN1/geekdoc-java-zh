    # # Chapter 2


    ## Variables and Data Types


    A variable is a named container or memory location that holds a value. The value
    of the container or memory location can change during execution of the program.
    Each variable has the ability to contain any kind of information, such as text
    or numbers. As a result, automation engineers are empowered to create flexible
    programs. Variables are utilized to represent changeable data, rather than hard-coding
    data (entering unchangeable data directly into a program).


    All variables possess a name, data type, and value. A variable is used to uniquely
    identify the variable. Data type refers to the type of variable, such as int,
    double, or boolean that can be stored in a variable. Therefore, data type determines
    a variable''s value. In Java, there are two kinds of data types: primitive and
    reference. Primitive data type supports eight basic data types (explained in this
    chapter) and reference data type is based on a class (explained in Part 2 – Java
    Selenium WebDriver).


    Chapter two covers the following regarding variables and data types:


    +   - Variable Names

    - Variable Declaration

    - Variable Initialization

    - Variable Type, Scope, and Lifetime

