  - "[PAGE 95]\n\n# Operator Precedence\n\nThe operator precedence is ranking Java's\
    \ operators from high to low. Rankings become important when a given expression\
    \ has multiple operators. An expression is evaluated from left to right and the\
    \ operator with a higher precedence receives the first evaluation. To change the\
    \ precedence order, a parenthesis should be implemented to point out which expression\
    \ is evaluated first. The following example shows two expressions which exclude\
    \ and include a parenthesis:\n\n```\npublic class Operators {\n    public static\
    \ void main(String[] args) {\n        int total;\n        total = 2 + 3 * 4;\n\
    \        System.out.println(\"What is the total without a parenthesis? \" + total);\n\
    \        total = (2 + 3) * 4;\n        System.out.println(\"What is the total\
    \ with a parenthesis? \" + total);\n    }\n}\n```\n\n![](img/5b60674af805079c320c25c8588bb60a_95_0.png)"
