  md: '# Preface


    I am enth to write an instructional book on Java because I have talked with many
    testers who can relate to the frustration caused by the lack of information to
    learn Java for automation testing. Java is one of the programming languages for
    Selenium. A common challenge with new automation testers is learning how to program.
    Therefore, this book is designed to help an absolute beginner learn Java. The
    purpose of this book is to fill a need of automation testers who are forced to
    hurry past the programming component of automation, leading to a struggle with
    working in Selenium.


    # Target Audience


    The target audience is beginners with little to no knowledge of Java. Beginners
    are people new to Selenium and Java, and have a desire to establish a deep foundation
    of Java principles.


    # Why learn Java?


    Java is a powerful programming language that is frequently and commonly implemented
    in the Information Technology (IT) industry. Java programmers are in high demand
    in the IT field and being able to code automation scripts in Java will make you
    a commodity to any quality assurance testing team. There are many Java forums
    (message boards) online that support Java programmers in need of a solution for
    a problem. Learning Java and Selenium is a great combination that will make any
    quality assurance tester effective on an automation project.'
