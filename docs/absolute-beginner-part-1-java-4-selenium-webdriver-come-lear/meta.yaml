    # Variable Naming Rules


    Java has rules to naming variables. One of the rules is to ensure each Java variable
    has a unique name. Unique names prevent errors from occurring, such as “Duplicate
    local variable”—meaning the same variable name has been entered more than one
    time. The following is a list of more rules for naming a variable:


    +   - Can contain case sensitive letters, numbers, dollar sign “$,” and underscore
    ""

    - Can begin with a letter, dollar sign “$,” or underscore ""

    - Cannot begin with a number

    - Cannot contain a space or special character except dollar sign “$,” and underscore
    ""

    - Cannot contain a reserve keyword


    The following is a list of 50 Java reserve keywords:


    | abstract | continue | for | new | switch |

    | assert | default | goto | package | synchronized |

    | boolean | do | if | private | this |

    | break | double | implements | protected | throw |

    | byte | else | import | public | throws |

    | case | enum | instanceof | return | transient |

    | catch | extends | int | short | try |

    | char | final | interface | static | void |

    | class | finally | long | strictfp | volatile |

    | const | float | native | super | while |


