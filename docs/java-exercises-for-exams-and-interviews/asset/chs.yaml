  \ the number of minutes: 345689\n345689 minutes is approximately 6 years and 210\
  \ days\n```\n\n---\n\n## 读取一个数字并显示平方、立方和四次方\n创建一个 Java 程序，读取一个数字并显示该数字的平方、立方和四次方。\n\
  \n## JAVA 代码\n```java\nimport java.util.Scanner;\n\npublic class Exercise8 {\n \
