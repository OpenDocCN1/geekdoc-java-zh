- fmt: "\n# Task\nWrite a Java program that takes an inch value and converts it to\
    \ meters.\n\n## INCHES TO METERS\n- 1 INCH = 0.025400 METERS\n- 2 INCH = 0.050800\
    \ METERS\n- 3 INCH = 0.076200 METERS\n- 4 INCH = 0.101600 METERS\n- 5 INCH = 0.127000\
    \ METERS\n- 6 INCH = 0.152400 METERS\n\n## JAVA CODE\n```java\nimport java.util.Scanner;\n\
    \npublic class Exercise2 {\n    public static void main(String[] Strings) {\n\
    \        Scanner input = new Scanner(System.in);\n        System.out.print(\"\
    Input a value for inch: \");\n        double inch = input.nextDouble();\n    \
    \    double meters = inch * 0.0254;\n        System.out.println(inch + \" inch\
    \ is \" + meters + \" meters\");\n    }\n}\n```\n\n## OUTPUT\n```\nInput a value\
    \ for inch: 1000\n1000.0 inch is 25.4 meters\n```\n\n---\n\n# Adds all the digits\
    \ in the integer\nCreate a Java program that takes an integer between 0 and 1000\
    \ and adds all of its digits.\n\n![](Images/image00066.jpeg)\n\n## JAVA CODE\n\
    ```java\nimport java.util.Scanner;\n\npublic class Main {\n    public static void\
    \ main(String[] Strings) {\n        Scanner input = new Scanner(System.in);\n\
    \        System.out.print(\"Input an integer between 0 and 1000: \");\n      \
    \  int num = input.nextInt();\n        int firstDigit = num % 10;\n        int\
    \ remainingNumber = num / 10;\n        int SecondDigit = remainingNumber % 10;\n\
    \        remainingNumber = remainingNumber / 10;\n        int thirdDigit = remainingNumber\
    \ % 10;\n        remainingNumber = remainingNumber / 10;\n        int fourthDigit\
    \ = remainingNumber % 10;\n        int sum = thirdDigit + SecondDigit + firstDigit\
    \ + fourthDigit;\n        System.out.println(\"The sum of all digits in \" + num\
    \ + \" is \" + sum);\n    }\n}\n```\n\n## OUTPUT\n```\nInput an integer between\
    \ 0 and 1000: 565\nThe sum of all digits in 565 is 16\n```\n\n---\n\n# Takes the\
    \ user to input the minutes and print the number of years and days for the minutes\n\
    Write a Java program to convert minutes into a number of years and days.\n\n![](Images/image00067.jpeg)\n\
    \n## JAVA CODE\n```java\nimport java.util.Scanner;\n\npublic class Exercise4 {\n\
    \    public static void main(String[] Strings) {\n        double minutesInYear\
    \ = 60 * 24 * 365;\n        Scanner input = new Scanner(System.in);\n        System.out.print(\"\
    Input the number of minutes: \");\n        double min = input.nextDouble();\n\
    \        long years = (long) (min / minutesInYear);\n        int days = (int)\
    \ (min / 60) % 365;\n        System.out.println((int) min + \" is approximately\
    \ \" + years + \" years and \" + days + \" days\");\n    }\n}\n```\n\n## OUTPUT\n\
    ```\nInput the number of minutes: 345689\n345689 minutes is approximately 6 years\
    \ and 210 days\n```\n\n---\n\n# Reads a number and display the square, cube, and\
    \ fourth power\nCreate a Java program that reads a number and displays the square,\
    \ cube, and fourth power of that.\n\n## JAVA CODE\n```java\nimport java.util.Scanner;\n\
    \npublic class Exercise8 {\n    public static void main(String[] args) {\n   \
    \     Scanner in = new Scanner(System.in);\n        System.out.print(\"Input the\
    \ side length: \");\n        double val = in.nextDouble();\n        System.out.printf(\"\
    Square: %.2f\\n\", val * val);\n        System.out.printf(\"Cube: %.2f\\n\", val\
    \ * val * val);\n        System.out.printf(\"Fourth power: %.2f\\n\", Math.pow(val,\
    \ 4));\n    }\n}\n```\n\n## OUTPUT\n```\nInput the side length: 15\nSquare: 225.00\n\
    Cube: 3375.00\nFourth power: 50625.00\n```\n\n---\n\n# Conditional Statement:\
    \ Check the number is negative, zero, or positive\n![](Images/image0068.jpeg)\n\
    \n## JAVA CODE\n```java\nimport java.util.Scanner;\n\npublic class Exercise27\
    \ {\n    public static void main(String[] args) {\n        Scanner in = new Scanner(System.in);\n\
    \        System.out.print(\"Input a number: \");\n        int n = in.nextInt();\n\
    \        if (n > 0) {\n            System.out.println(\"Number is positive\");\n\
    \        } else if (n < 0) {\n            System.out.println(\"Number is negative\"\
