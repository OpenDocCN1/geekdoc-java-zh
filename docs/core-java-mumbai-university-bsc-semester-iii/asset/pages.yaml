    }\n\n```\n\n# The Connection-Oriented (Stream-Based) Socket\n\nThe Connection-Oriented\
    \ Sockets are based on the stream-mode I/O model of the UNIX Operating System\
    \ – data is transferred using the concept of a continuous data streaming from\
    \ a source to a destination. Data is inserted into the stream by a sender process\
    \ usually the server and is extracted from the stream by the receiver process\
    \ usually the client.\n\nThe server process establishes a connection and listens\
    \ for connection requests from other processes. Connection requests are accepted\
    \ at one time. When the connection request is accepted, a data socket is created\
    \ using which the server process can read or write/to the data stream. When the\
    \ communication session between the two processes is over, the data socket is\
    \ closed and the server process is free to accept another connection.\n\nNote\
    \ that the server process is blocked when it is listening or waiting for incoming\
    \ connection requests.\n\nThe following steps occur when establishing a TCP connection\
    \ between two computers using sockets:\n\n+   1. The server instantiates a Socket\
    \ object, denoting which port number communication is to occur on.\n2. The server\
    \ invokes the accept() method of the ServerSocket class. This method waits until\
    \ a client connects to the server on the given port.\n3. After the server is waiting,\
    \ a client instantiates a Socket object, specifying the server name and port number\
    \ to connect to.\n4. The constructor of the Socket class attempts to connect to\
    \ the client to the specified server and port number. If communication is established,\
    \ the client now has a Socket object capable of communicating with the server.\n\
    5. On the server side, the accept() method returns a reference to a new socket\
    \ on the server that is connected to the client's socket.\n\nAfter the connections\
    \ are established, communication can occur using I/O streams. Each socket has\
    \ both an Outputstream and an InputStream. The client’s Outputstream is connected\
    \ to the server’s InputStream, and the client’s InputStream is connected to the\
    \ server’s OutputStream.\n\nTCP is a two-way communication protocol, so data can\
    \ be sent across both streams at the same time."
