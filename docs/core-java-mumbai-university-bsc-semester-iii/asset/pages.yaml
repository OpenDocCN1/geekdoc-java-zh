  md: '# PREFACE


    It gives us immense pleasure to present this First Edition of “Core JAVA” to the
    teachers and students of Bachelor of Computer Science, Second Year, Third Semester.
    This book has been written as per the syllabus prescribed by the University with
    effect academic year 2017-18.


    When Java was introduced in 1995, immediately its potential as a language for
    beginning programmers it was noticed. Java satisfies today''s need for easy entry
    into an object-oriented language, while avoiding the complexities of C++. At the
    same time, Java is similar to C++ to serve as a stepping stone to that language.
    (At my institution, Java is the first language introduced, immediately followed
    by C++.) Java programs are immune to these frustrating crashes that are so common
    in C++, GUI of Java is introduced in this book by introducing Applets and AWT.


