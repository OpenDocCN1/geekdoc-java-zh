    # Do While Loops


    A do loop is another type of repetition statement. It is exactly the same as the
    while loop except it does something and evaluates the logical expression of the
    loop to determine what happens next. Normally with a while loop, part of the logical
    expression in the loop must be initialized before execution of the loop. A do
    loop lets something be performed and checks the logical expression of the loop.
    I use a do while loop when using data validation during a program. The form of
    a do loop is as follows:


    ```

    do

    stmt();

    while (logical expression);

    ```


    The stmt in do loop may be single or complex. Complex statements must be enclosed
    with curly braces }. Let''s look at a couple of examples of do while loops.


