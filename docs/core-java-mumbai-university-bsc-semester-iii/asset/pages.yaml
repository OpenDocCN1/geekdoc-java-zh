    \ You can retrieve the label by calling getLabel().\nThese methods are as follows:\n\
    \n+   1. void setLabel()\n2. String getLabel()\n\nHere, str becomes the new label\
    \ for the button.\n\n# Handling Buttons\n\nEach time a button is pressed, an event\
