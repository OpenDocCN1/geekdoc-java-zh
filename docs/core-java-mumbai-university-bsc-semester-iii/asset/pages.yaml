  md: '# 13.11 Choice Controls


    The Choice class is used to create a pop-up list of items from which the user
    may choose. a Choice control is a form of menu. When inactive, a Choice component
    takes only enough space to show the currently selected item. When the user clicks
    on it, the whole list of choices pops up, and a new selection can be made. Each
    item in the list is a string that appears as a left-justified label in the order
    it is added to the Choice object. Choice only defines the default constructor,
    which creates an empty list.


    To add a selection to the list, call add(). It has this general form:


    ```

    void add(String name)

    ```


    Here is the name of the item being added. Items are added to the list in the order
    in which calls to add( ) occur. To determine which item is currently selected,
    you may call either getSelectedItem() or getSelectedIndex( ).


    These methods are shown here:


    +   1. getSelectedItem()

    2. getSelectedIndex()


    # 13.12 Lists


    The List provides a compact, multiple-choice, scrolling selection list. Unlike
    the Choice object, which shows only the single selected item in the menu, a List
    object can be constructed to show any number of choices in the visible window.
    It can also be created to allow multiple selections.


    List provides these constructors:


    +   1. List()

    2. List(int numRows, boolean multipleSelect)

    3. List(int numRows, boolean multipleSelect)


    The first version creates a List control that allows only one item to be selected
    at any one time.

    In second form, the value of numRows specifies the number of entries in the list
    that will always be visible (others can be scrolled into view as needed).


    In the third form, if multipleSelect is true, then the user may select two or
    more items at a time. If it is false, then only one item may be selected.


    To add a selection to the list, call add(). It has the following forms:


    +   1. add(String name)

    2. add(String name, int index)


    Here, name is the name of the item added to the list.


    The first form adds the item to the end of the list.

    The second form adds the item to the list specified by index. Indexing begins
    at zero. You can specify -1 to add the item to the end of the list.


    For lists that allow only single selection, you can determine which item is currently
    selected by calling either getItem() or getSelectedIndex().


    These methods are shown here:'
