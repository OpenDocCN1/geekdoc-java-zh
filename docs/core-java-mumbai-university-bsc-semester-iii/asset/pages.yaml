  md: '# 6.2 Thread Creations


    The idea of a thread is a lightweight unit of execution—smaller than a process,
    but still capable of executing Java code. The usual way that this is implemented
    for each thread to be a fullyfledged unit of execution to the operating system
    but to belong to a process, with the address space of the process shared between
    all threads comprising that process. This means that each thread can be scheduled
    independently and has its own stack and program counter but shares memory with
    other objects within the same process.


    Multithreading environment in java can be implemented in two ways as the diagram
    below shows.


    +   1. Create a class(user defined) which extends java built-in Thread class.

    2. Create a class(user defined) which implements java built-in Runnable interface.


    # Classes and interfaces to create threads


    ![](img/b651d361ec09e4bd257525b03893127f_129_0.png)


    +   1. .Thread (Class): A class that creates and defines thread. This class inherits
    the Object class and implements Runnable interface.

    2. Runnable(interface): The only method in this interface is the run() method.

    3. Object: wait(), notify() and notifyAll() are methods of this class used for
    threading.


    A new thread may be created by following code.


    ```

    Thread t = new Thread() -> System.out.println("Hi, How are you Thread?");

    t.start();

    This small piece of code creates and starts a new thread, which executes the body
    of the lambda expression and then executes. In Java 7, code looks like follows:


    Thread t = new Thread();

    t.start();

    System.out.println("Hi, How are you Thread?");

    ```


