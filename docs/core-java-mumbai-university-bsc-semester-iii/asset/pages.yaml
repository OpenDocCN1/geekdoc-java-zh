  md: '# Abstraction


    Hiding internal details and showing functionality is known as abstraction. For
    example: phone call, we don''t know the internal processing.


    In java, we use abstract class and interface to achieve abstraction.


    # Encapsulation


    Binding (or wrapping) code and data together into a single unit is known as encapsulation.
    For example: capsule, it is wrapped with different medicines.


    A java class is the example of encapsulation. Java bean is the fully encapsulated
    class because all the data members are private.


    ![](img/b651d361ec09e4bd257525b03893127f_62_0.png)


    # Advantage of OOPs over Procedure-oriented programming language


    +   1. OOPs makes development and maintenance easier as in Procedure-oriented
    programming language it is not easy to manage if code grows as project size.

    2. OOPs provides data hiding whereas in Procedure-oriented programming language
    a global data can be accessed from anywhere.

    3. OOPs provides ability to simulate real-world event much more effectively. We
    can provide the solution of real world problem if we are using the Object-Oriented
    Programming language.


    ```

    fun1()

    fun2()

    object data

    fun3()

    Global data

    fun1()

    fun2()

    object data

    ```


    # Java Naming conventions


    Java naming convention is a rule to follow as you decide what to name your identifiers
    such as class, variable, constant, method etc.


    But, it is not forced to. So, it is known as convention not rule.


    All the classes, interfaces, packages, methods and fields of java programming
    language are given according to naming convention.


    # Advantage of naming conventions in java


    By using standard Java naming conventions, you make your code easier to read for
    yourself and for other programmers. Readability of Java program is very important.
    It indicates that less time is spent to figure out what the code does.


    | Name | Convention |

    | class name | should start with uppercase letter and be a noun e.g. String, Color,
    Button, System, Thread etc. |'
