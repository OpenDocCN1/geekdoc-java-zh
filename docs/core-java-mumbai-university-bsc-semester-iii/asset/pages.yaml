    Reader is abstract and it is base class for all other character oriented InputStream
    streams.


    # Method of reader Class:


    | Method | Description |

    | --- | --- |

    | (1) int read ( ) | Return the (ASC II) Integer representation of next available
    character. If end of return term -1. |

    | (2) int read (Char b []) | Read character data & store into character array.
    Return actual number of character that read, if EOF is encountered. |

    | (3) abstract read (Char b ], offset, length) | Read total length character into
    array b, starting it from offset. Returns total number of character successfully
    read, -1 if end of file encounters. |

    | (4) long skip (long tachar) | Skip touch of input stream. |

    | (5) abstract close ( ) | Close i/p stream, if further read method is called,
    throws IO Exception.|


    #  7.16.2 Writer Class


    Writer class is abstract and base class for all character oriented o/p stream
    classes.


    # Method of writer class:


    | Method | Description |

    | --- | --- |

    | (1) void write ( int ch ) | Write a simple character to o/p stream |

    | (2) void write ( Char c []) | Write complete array of character to o/p stream
    |

    | (3) abstract write ( Char c ], offset, length) | Write characters from given
    array starting from offset upto total length character to o/p stream. |

    | (4) abstract flush ( ) | Flushes/clears the o/p buffer. |

    | (5) abstract close ( ) | Close the o/p stream|


