  md: "# Inner Class\n\nCreating an inner class is quite simple. You just need to\
    \ write a class within a class. Unlike a class, an inner class can be private\
    \ and once you declare an inner class private, it cannot be accessed from an object\
    \ outside the class.\n\nFollowing is the program to create an inner class and\
    \ access it. In the given example, we make the inner class private and access\
    \ the class through a method.\n\n# Example\n\n```\nclass Outer_Demo {\n    int\
    \ num;\n    // inner class\n    private class Inner_Demo {\n        public void\
    \ print() {\n            System.out.println(\"This is an inner class\");\n   \
    \     }\n    }\n    // Accessing inner class from the method within\n    void\
    \ display_Inner() {\n        Inner_Demo inner = new Inner_Demo();\n        inner.print();\n\
    \    }\n}\npublic class My_class {\n    public static void main(String args[])\
    \ {\n        // Instantiating the outer class\n        Outer_Demo outer = new\
    \ Outer_Demo();\n        // Accessing the display_Inner() method.\n        outer.display_Inner();\n\
    \    }\n}\n```\n\nHere you can observe that Outer_Demo is the outer class, Inner_Demo\
    \ is the inner class, display_Inner() is the method inside which we are instantiating\
    \ the inner class, and this method is invoked from the main method.\n\nIf you\
    \ compile and execute the above program, you will get the following result –\n\
    \n# Output:\n\nThis is an inner class."
