  md: '# FilterOutputStream:


    FilterOutputStream is the super class of all the output stream filters and is
    obtained from the OutputStream class. It simply overrides all the methods of the
    OutputStream class required to filter the data that is written to the output stream.


    FilterInputStream and FilterOutputStream do not perform any filtering themselves;
    this is done by their subclasses. To improve the performance of these I/O streams,
    their subclasses BufferedInputStream and BufferedOutputStream are used.


    # 7.12 Buffered Byte Streams


    # BufferedInputStream:


    This class is a subclass of the FilterInputStream that lets you read large amount
    of data from a stream and is an internal buffer. When data is requested, it is
    usually read from the buffer. This has the effect for improving the performance
    of some input streams, especially for those that are bounded to slower sources
    like a file or network connection.


    The constructor of the BufferedInputStream is written as:


    ```

    BufferedInputStream(java.io.InputStream in);

    ```


    # BufferedOutputStream:


    This is a subclass of the FilterOutputStream and a buffered output stream that
    lets you write characters to a stream. A BufferedOutputStream adds functionality
    to another output stream. The data is first written into a buffer. When the BufferedOutputStream
    is created, an internal buffer array is created, in which the bytes are stored.


    The constructor of the BufferedOutputStream is written as:


    ```

    BufferedOutputStream(java.io.OutputStream out);

    ```


    # 7.13 SequentialInputStream


    The SequentialInputStream represents the concatenation of multiple input streams.
    It starts with an ordered collection of input streams and reads from the first
    until the end of one is reached, then it reads from the second, and so on, until
    the last input stream is reached.


    It acts as a single InputStream that represents the stream of other InputStreams
    in sequence. You can see in the example, we have created three objects of FileInputStream
    to parse three different files and then add to the vector of InputStreams. All
    these vector elements are passed to the constructor of SequentialInputStream which
    reads all the content and display it on the console.


