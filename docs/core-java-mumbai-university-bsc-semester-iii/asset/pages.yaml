  md: '# Event Sources


    A source is an object that generates an event. This occurs when the internal state
    of that object changes in some way. Sources generate more than one type of event.
    A source may register listeners in order for the listeners to receive notifications
    about a specific type of event. Each type of event has its own registration method.
    Here is the general form:


    ```

    public void addEventListener(EventListener l)

    ```


    Here, Type is the name of the event and el is a reference to the event listener.


    # Event Listeners


    A listener is an object that is notified when an event occurs. It has two major
    requirements. First, it must have registered with one or more sources to receive
    notifications about specific types of events. Second, it must implement methods
    to receive and process these notifications. The methods that receive and process
    events are defined in a set of interfaces in java.awt.event.


    For example, the MouseMotionListener interface defines two methods to receive
    notifications when the mouse is dragged or moved. Any object may receive one or
    both of these events if it provides an implementation of this interface.


    # Event Classes


    The classes that represent events are the core of Java’s event handling mechanism.
    Thus, we begin our study of event handling with a tour of the event classes. As
    you will see, they provide a consistent, easy-to-use means of encapsulating events.
    At the root of the Java event class hierarchy is Object, which is in java.util.
    It is the superclass for all events.


    It’s constructor is shown here:


    ```

    EventObject(Object src)

    ```


    Here, src is the object that generates this event.


    EventObject contains two methods: getSource() and toString(). The getSource()
    method returns the source of its event. Its general form is shown here:


    ```

    Object getSource()

    ```


    # 13.6 Listeners and Listener interfaces


    | Event Classes | Listener Interfaces |

    | --- | --- |

    | ActionEvent | ActionListener |

    | MouseEvent | MouseListener and MouseMotionListener |

    | MouseWheelEvent | MouseWheelListener |

    | KeyEvent | KeyListener |

    | ItemEvent | ItemListener |

    | TextEvent | TextListener |

    | AdjustmentEvent | AdjustmentListener |

    | WindowEvent | WindowListener |'
