  md: '(vii) In operator overloading we can overload the in-built operators as well
    as user-defined data types. You can not change the semantics of an operator.

    Existing operator like ''+'' can be used for addition of two integers and also
    be used for addition of two float or ''+'' sign can be used for concentration
    of two strings. Overloading can not alter the basic template of operator.


    ![](img/b651d361ec09e4bd257525b03893127f_14_0.png)


    +   (g) Dynamic binding:

    (i) Dynamic binding is a binding at Run time.

    (ii) Dynamic binding is also called as late binding.

    (iii) Binding refers to the linking of procedure call or function to the code
    or definition to be executed in response to the call.

    (iv) The code with a given procedure call or function is not known until the time
    of call at run-time.

    (v) With the help of dynamic binding, one can access method of a derived class
    using a pointer of base class depending on which object it points to at run-time.


    +   (h) Message passing:

    (i) Object oriented consists of a set of objects that communicate with each other.

    ii) Message passing involves following steps:

    1. Creating classes that define objects and their behaviour.

    2. Creating objects from class definitions.

    3. Establishing communication among objects.

    (iii) Objects communicate with one another by sending and receiving information
    or by passing messages.

    (iv) A message for object is a request for execution of a procedure and therefore
    will invoke a function in the receiving object that has the desired result.

    (v) Message passing specifying the name of the object, the name of the function
    i.e. message and the information to be sent.

    (vi) Customer is an object.

    Balance is a message

    Account no is an information


    | Customer | Balance | (account no) |

    | --- | --- | --- |

    | Object | Message | information |


    +   (vii) The communication between objects is feasible as long as it is alive.'
