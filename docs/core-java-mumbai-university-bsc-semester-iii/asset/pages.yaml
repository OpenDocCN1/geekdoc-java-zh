    # ## 8.1 Introduction to Network Programming


    The term network programming refers to writing programs that execute across multiple
    devices (computers), in which the devices are all connected to each other using
    a network.

    At a basic level, network-based systems consist of a server, client, and a media
    for communication. A computer media for communication can be wired or wireless
    network.


    ![](img/b651d361ec09e4bd257525b03893127f_180_0.png)'
