    If a class has an entity reference, it is known as Aggregation. Aggregation represents
    HAS-A relationship.


    Consider a situation, Employee object contains many informations such as id, name,
    emailld etc. It contains one more object address, which contains its own informations
    such as city, state, country, zipcode as given below.


    ```

    class Employee{

    int id;

    String name;

    Address address//Address is a class

    ...\}

    ```


    In such case, Employee has an entity reference address, so relationship is Employee
    HAS-A address.


    # Why use Aggregation?


