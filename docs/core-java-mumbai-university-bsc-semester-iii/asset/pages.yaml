  md: '![](img/b651d361ec09e4bd257525b03893127f_13_0.png)


    (f) Polymorphism:

    (i) Poly means many, morphism means many forms, i.e. more than one form of operation.

    (ii) Polymorphism indicates the ability to take more than one form.

    (iii) More than one form of operation may behave differently by creating different
    instance.

    (iv) The behaviour of object depends upon the types of data used i.e. one thing
    behaves differently at different places.

    (v) Polymorphism allows objects having different internal structures to share
    the same external interface.

    (vi) It supports function overloading and operator overloading concept. Function
    overloading indicates that functions of a class with same name but either different
    number of arguments or different types of arguments.

    You not overload a function which can have the same number of arguments of same
    type and in same sequence and differing only in their return types.

    For example:

    You behave differently when your friend asks about something and when your boss
    asks something.

    Example:

    Same name function can be used for addition of two integers, addition of two floats,
    addition of three integers.

    sum (int a, int b);

    sum (float x, float y);

    sum (int a, int b, int c);

    It is also called function polymorphism.

    When a single function name is used to perform different types of tasks is called
    function overloading. This is same as like a particular word having several different
    meanings depending on the context.'
