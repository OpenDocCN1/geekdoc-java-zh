  md: '# 6.6 Wait()


    Inter-thread Communication


    We have few methods through which java threads can communicate with each other.
    These

    methods are wait(), notify(), notifyAll() of the Object class. The Thread class
    inherits these methods

    of Object class. All these method can be called from within a synchronized method.
    The first method

    among them


    Wait() tells the calling thread to give up the monitor and go to sleep until some
    other thread

    enters the same monitor and calls notify().


    # 6.7 notify()


    notify() wakes up the first thread that called wait() on the same object.


    # 6.8 notify all()


    notifyAll() wakes up all the threads that called wait() on the same object. The
    highest priority

    thread will run first.


