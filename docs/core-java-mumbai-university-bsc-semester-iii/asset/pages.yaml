    Every operating system has a view of threads that can differ in the details. But
    in most cases is broadly similar at a high level. Java tries hard to abstract
    these details away, and has an enum called Thread State—which wrappers over the
    operating system''s view of the thread''s state. The values of Thread. State provide
    an overview of the lifecycle of a thread:'
