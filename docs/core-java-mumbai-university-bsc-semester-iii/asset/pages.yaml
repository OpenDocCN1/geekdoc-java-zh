    ```


    If the first logical expression is evaluated to true, then stmtT1 is executed.
    If the second logical expression is true, then stmtT2 is executed and so on the
    line. If none of the logical expressions are true, then the statement after "else"
    is executed which is stmtF.


    The form of a multi-way decision using "nested ifs" is as follows:


    ```

    if (conditionA)

    {

    if (conditionB)

    stmtBT;

    else

    stmtBF;

    }

    else

    stmtAF;

    ```


    If conditionA is evaluated to true, then execution moves into the nested if and
    evaluates conditionB. If conditionA is evaluated to false, then stmtAF is executed.'
