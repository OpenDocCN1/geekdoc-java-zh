  md: "# 3.4 String Toknizer\n\n+   1. StringTokenizer\n2. Methods of StringTokenizer\n\
    3. Example of StringTokenizer\n\nThe java.util.StringTokenizer class allows you\
    \ to break a string into tokens. It is a simple way to break string.\n\nIt doesn't\
    \ provide the facility to differentiate numbers, quoted strings, identifiers etc.\
    \ like StreamTokenizer class.\n\nConstructors of StringTokenizer class\n\nThere\
    \ are 3 constructors defined in the StringTokenizer class.\n\n| Constructor |\
    \ Description |\n| --- | --- |\n| StringTokenizer(String str) | creates StringTokenizer\
    \ with specified string. |\n| StringTokenizer(String str, String delim) | creates\
    \ StringTokenizer with specified string and delimiter. |\n| StringTokenizer(String\
    \ str, String delim, boolean returnValue) | creates StringTokenizer with specified\
    \ string, delimiter and returnValue. If return value is false, delimiter characters\
    \ are considered to be tokens. to separate tokens. |\n\n# Methods of StringTokenizer\
    \ class\n\nThe 6 useful methods of StringTokenizer class are as follows:\n\n|\
    \ Public method | Description |\n| --- | --- |\n| boolean hasMoreTokens() | checks\
    \ if there is more tokens available. |\n| String nextToken() | returns the next\
    \ token from the StringTokenizer object. |\n| String nextToken(String delim) |\
    \ returns the next token based on the delimiter. |\n| boolean hasMoreElements()\
    \ | same as hasMoreTokens() method. |\n| Object nextElement() | same as nextToken()\
    \ but its return type is Object. |\n| int countTokens() | returns the total number\
    \ of tokens. |\n\n# Simple example of StringTokenizer class\n\nLet's see the simple\
    \ example of StringTokenizer class that tokenizes a \"my name is kiran\" on the\
    \ basis of whitespace.\n\n```\nimport java.util.StringTokenizer;\npublic class\
    \ Simple {\n  public static void main(String[] args) {\n    StringTokenizer st\
    \ = new StringTokenizer(\"my name is kiran\", \" \");\n    while (st.hasMoreTokens())\
    \ {\n        System.out.println(st.nextToken());\n    }\n}\n```"
