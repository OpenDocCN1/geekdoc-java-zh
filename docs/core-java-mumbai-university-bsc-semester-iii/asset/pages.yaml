  md: 'public methods that are responsible for managing events, such as mouse and
    keyboard input, positioning and sizing the window, and repainting. A Component
    object is responsible for remembering the current foreground and background colors
    and the currently selected text font


    # Container


    The Container is a subclass of Component. It has additional methods that allow
    other Component objects to be nested within it. Other Container objects can be
    stored inside of a Container (since they are themselves instances of Component).
    This makes for a multilevel contained system. A container is responsible for laying
    out (that is, positioning) any components that it contains


    # Window


    The Window class creates top-level window. A top-level window is not contained
    within any other objectit sits directly on the desktop.

    We use subclass called Frame.


    # Panel


    The Panel class is a subclass of Container. It doesn''t add any new methods; simply
    implements Container. The Panel is the superclass for Applet. When screen output
    is directed to an applet, it is drawn on the surface of a Panel object. APanel
    is a window that does not contain a title bar, menu bar, or border. When you run
    an applet using an applet viewer, the applet viewer provides the title and border.
    Other components can be added to a Panel object by its add() method inherited
    from the setLocation(), setSize(), or you can position and resize them manually
    using the setBounds() methods defined by Component


    # Frame


    The Frame is the container that contain title bar and can have many bars. It can
    have other components like button, textfield etc.


    # Canvas


    It is not part of the hierarchy for applet or frame windows. Canvas encapsulates
    a blank window

    Upon which you can draw.


