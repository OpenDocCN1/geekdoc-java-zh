    # 5.6 user defined exception


    # Creating Exception Sub Classes:


    Although Java''s built-in exceptions handle most common errors, you will probably
    want to create your own exception types to handle situations specific to your
    applications. This is quite easy to define: just a subclass of Exception, a subclass
    of Throwable. Your subclasses don''t need to actually implement anything—it is
    their existence in the system type that allows you to use them as exceptions.


    The Exception class does not define any methods of its own. It does, of course,
    inherit methods provided by Throwable. Thus, all exceptions, including those that
    you create, have methods defined by Throwable available to them. They are shown
    in Table 5.3.


    Table 5.3: The Methods Defined by Throwable


    | Method | Description |

    | --- | --- |

    | Throwable fillingStackTrace() | Returns a Throwable object that contains a completed
    stack trace. This object can be rethrown. |

    | Throwable getCause() | Returns the exception that underlies the current exception.
    If there is no underlying exception null is returned. |

    | String getLocalizedMessage() | Returns a localized description of the exception.
    |

    | String getMessage() | Returns a description of the exception. |

    | StackTraceElement[] getStackTrace() | Returns an array of StackTraceElement.
    The method at the top of the stack is the last method called before the exception
    occurred. This method is found in the first element of the array. The StackTraceElement
    class gives your program access to information about each element in the trace,
    as as its name. |

    | Throwable initCause(Throwable cause) | Associates with the invoking exception
    as a cause of the invoking exception. Returns a reference to the exception. |

    | void printStackTrace() | Displays the stack trace. |

    | void printStackTrace(PrintStream stream) | Sends the stack trace to the specified
    stream. |

    | void printStackTrace(PrintWriter name) | Sends the stack trace to the specified
    stream. |

    | void setStackTrace(StackTraceElement[] elements) | Sets the stack trace to the
    elements in elements. This method is specialized for applications, not normal
    use. |

    | String toString() | Returns a string object containing a description of the
    exception. This method is called by println() when outputting a Throwable |'
