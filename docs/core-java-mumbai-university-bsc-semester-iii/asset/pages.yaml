    **Multi-Way Decisions**: Multi-way decision statements involve "if/else if" statements,
    "nested ifs", or "switch" statements. They are all used to evaluate a logical
    expression that could have several possible values. "if else if" statements are
    often used to choose between ranges of values.


    The form of a multi-way decision using "if/else it" statements is as follows:


    ```

