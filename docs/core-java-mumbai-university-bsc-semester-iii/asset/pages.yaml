  md: "# 11.3.2 Static Nested Classes\n\n# Static Nested Class\n\nA static inner class\
    \ is a nested class which is a static member of the outer class. It can be accessed\
    \ without instantiating the outer class, using other static members. Just like\
    \ static members, a static nested class does not have access to the instance variables\
    \ and methods of the outer class. The syntax of static nested class is as follows\
    \ –\n\n```\nSyntax\nclass MyOuter {\n  static class Nested_Demo {\n  }\n}\n```\n\
    \nInstantiating a static nested class is a bit different from instantiating an\
    \ inner class. The following program shows how to use a static nested class.\n\
    \n# Example\n\n```\npublic class Outer {\n  static class Nested_Demo {\n    public\
    \ void my_method() {\n      System.out.println(\"This is my nested class\");\n\
    \    }\n  }\n  public static void main(String[] args[]) {\n    Outer.Nested_Demo\
    \ nested = new Outer.Nested_Demo();\n    nested.my_method();\n  }\n}\n```\n\n\
    # 11.4 local Inner Class\n\nIn Java, we can write a class within a method and\
    \ this will be a local type. Like local variables, the scope of the inner class\
    \ is restricted to the method.\n\nA method-local class can be instantiated only\
    \ within the method where the inner class is defined. The following program shows\
    \ how to use a method-local class.\n\nExample:\n\n```\npublic class Outerclass\
    \ {\n  // instance method of the outer class\n  void my_Method() {\n    int num\
    \ = 23;\n    // method-local inner class\n    class MethodInner_Demo {\n     \
    \ public void print() {\n    }\n  }\n}\n```"
