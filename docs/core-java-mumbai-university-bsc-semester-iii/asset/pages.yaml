    # ## 12.1 Introduction to Applet


    Any applet in Java is a class that extends the java.applet.Applet class. An Applet
    class does not have any main() method. It is viewed using JVM. The JVM can use
    either a plug-in of the Web browser or a separate runtime environment to run an
    applet application.


    +   - Applets are small Java applications that can be installed on an Internet
    server, transported over Internet, and can be automatically installed and run
    as part of a document.

    - After a user receives an applet, the applet can produce a graphical user interface.
    It has limited access to resources so that it can run complex computations without
    introducing the risk of viruses or breaching data integrity.

    - Any applet in Java is a class that extends the java.applet.Applet class.

    - An Applet class does not have any main() method. It is viewed using JVM. The
    JVM can use a plug-in of the Web browser or a separate runtime environment to
    run an applet application.

    - JVM creates an instance of the applet class and invokes init() method to initialize
    an Applet.'
