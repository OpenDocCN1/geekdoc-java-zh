  md: '# Core Java


    Java compiler does not create executable code. It is bytecode. Bytecode is highly
    optimized set of instructions designed to be executed by the Java Runtime system
    which is called “Java Virtual Machine".


    JVM is an interpreter for bytecode. Java has two stages compilation and interpretation.


    Java programs are executed by the JVM helps to solve the major problems associated
    with downloading programs over the internet.


    Where JIT (in time compiler) is a part of JVM, It compiles bytecode into executable
    code in real time because of JIT, we get dynamic compilation to bytecode.


    JVM has code loader, code verifier which verifies byte code loaded from system
    or from any other system.


    Following Figure shows a block diagram of the Java virtual machine that includes
    the major subsystems and memory areas. Each Java virtual machine has a class loader
    subsystem: a mechanism for loading types (classes and interfaces). Each Java virtual
    machine also has an execution engine: a mechanism responsible for executing the
    instructions in the methods of loaded classes.


