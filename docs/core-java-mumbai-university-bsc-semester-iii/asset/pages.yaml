  md: '# 13.4 Java Control Fundamentals


    This article continues our exploration of the Abstract Window Toolkit (AWT). It
    examines the standard controls defined by Java. Controls are components that allow
    a user to interact with your application in various ways—for example; a commonly
    used control is the push button.

    The AWT supports the following types of controls:-


    | Labels |

    | Push buttons |

    | Check boxes |

    | Choice lists |

    | Lists |

    | Scroll bars |

    | Text editing |


    These controls are subclasses of Component.


    # 13.4.1 Adding and Removing Controls


    To include a control in a window, you must add it to the window. To do this, you
    must first create an instance of the desired control and add it to a window by
    calling add(), which is defined by Container. The add( ) has several forms.


    **Component add(Component compObj)**


    Here, compObj is an instance of the control that you want to add. A reference
    to compObj is returned.


    Once a control has been added, it will automatically be visible whenever its window
    is displayed.


    Sometimes you will want to remove a control from a window when the control is
    no longer needed. To do this, call remove( ). This method is also defined by Container.
    It has this general form:


    ```

    void remove(Component obj)

    ```


    Here, obj is a reference to the control you want to remove. You can remove all
    controls by calling removeAll().


    # 13.4.2 Responding to Controls


    Except for labels, which are passive controls, all controls generate events when
    they are accessed by the user. For example, when the user clicks on a push button,
    an event is sent that identifies the push button. In Java, your program simply
    implements the appropriate interface and registers an event listener for each
    control you need to monitor. Once a listener has been installed, events are automatically
    sent to it.


    # 13.5 Event-Delegation-Model


    # **The Delegation Event Model**


    The modern approach to handling events is based on the delegation event model,
    which defines standard and consistent mechanisms to generate and process events.'
