  md: '# Multithreading


    +   1. New Born State: When we create a thread object, the thread is born & it
    is said to be new born state, but still this is not scheduled for running. When
    it is scheduled by operating system for running scheduling will be done by start
    method. Thread killing will be done by stop method, when thread is started it
    will go into the next state called as "Runnable state"


    +   2. Runnable State: This state means the thread is free & is waiting for the
    availability of processor. The thread has joined the queue that are waiting for
    the execution. The threads which are in queue will be scheduled for the cpu execution
    using "Round Robin Algorithm" or "First come first serve". By applying scheduling
    to threads that may have equal priority. If the current thread is giving the permission
    to other thread, having other priority for execution is possible that can be done
    by "yield method"


    +   3. Running State: Running state means the processor is tie to the thread and
    this will be executed by processor until it is interrupted by higher priority
    thread. The running thread can be suspended using suspend method it can be continued
    by resume method. The running state thread can sleep specified time, that means
    the delay can be introduced using sleep method & it can move to Runnable automatically
    after completion of that time in a sleep method. The runnable thread can wait
    for any event to occur and then can be Schedule to Run again Using Notify method.


    +   4. Blocked State: A thread is said to be blocked when it is prevented from
    entering into the Runnable state. if the thread is either in the suspended state
    or sleeping state or waiting state, in that case the thread is considered as blocked
    state.


    +   5. Dead State: When the Running thread ends its Life means completes it is
    executed from run method. Users has authority to kill thread when stop method
    is called. The thread can be killed by the user or the system as soon as it is
    born or in the blocked condition means suspended, sleeping, Waiting.


    Diagram below depicts various state of a thread and shows method which will transform
    a thread from one state to another state. Here Ready state is also called as Runnable
    state.


    ![](img/b651d361ec09e4bd257525b03893127f_130_0.png)'
