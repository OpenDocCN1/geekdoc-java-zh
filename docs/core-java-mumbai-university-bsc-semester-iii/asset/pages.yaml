  md: "# Wrapper Classes\n\nwhile using a wrapper class you just need to pass the\
    \ value of the primitive data type to the constructor of the Wrapper class.\n\n\
    And the Wrapper object will be converted back to a primitive data type, and this\
    \ process is called unboxing.\n\nThe Number class is part of the java.lang package.\n\
    \n# What are Wrapper classes? \n\nAs the name says, a wrapper class wraps (encloses)\
    \ around a data type and gives it an object appearance. Wherever the data type\
    \ is required as an object, this object can be used. Wrapper classes include methods\
    \ to unwrap the object and give back the data type. It can be compared with a\
    \ chocolate. The manufacturer wraps the chocolate with some foil or paper to prevent\
    \ pollution. The user takes the chocolate, removes and throws the wrapper and\
    \ eats it.\n\nObserve the following conversion.\n\n```\nint k = 100;\nInteger\
    \ i1 = new Integer(k);\n```\n\nThe data type k is converted into an object, i1\
    \ using Integer class. The i1 object can be used in Java programming wherever\
    \ it is required an object.\n\n```\nThe following code can be used to unwrap (getting\
    \ back int from Integer object) the object i1.\nint m = i1.intValue(); // prints\
    \ 10000\nintValue() is a method of Integer class that returns an int data type.\n\
    ```\n\n# 9.2 List of Wrapper Classes\n\nIn the code above, Integer class is known\
    \ as a wrapper class (because it wraps around int data type to give an impression\
    \ of object). To wrap (or to convert) each primitive data type, there comes a\
    \ wrapper class. Eight wrapper classes exist in java.lang package that represent\
    \ 8 data types. Following list gives.\n\nAll the 8 wrapper classes are placed\
    \ in java.lang package that they are implicitly imported and available to the\
    \ programmer. As you can observe in the above hierarchy, the super class of numeric\
    \ wrapper classes is Number and the super class for Character and Boolean is Object.\
    \ All wrapper classes are defined as final and thus designers prevent them from\
    \ inheritance.\n\n| Primitive | Wrapper classes | Constructor Argument |\n| Boolean\
    \ | Boolean | Boolean or string |\n| Byte | Byte | Byte or String |\n| char |\
    \ Character | char |\n| Int | Integer | Int or String |\n| Float | Float | Float,\
    \ double or String |\n| Double | Double | Double or String |\n| Long | Long |\
    \ Long or String |\n| Short | Short | Short or String |"
