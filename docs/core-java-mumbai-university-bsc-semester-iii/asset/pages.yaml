    Any program that uses Event and send it to one more GUI (graphical user interface)
    such as Java application written for windows, is event driven. Event describes
    the change of state of any object. Example : Pressing a button, Entering a character
    in Textbox.


    # Components of Event Handling


    +   Event handling has three main components,


    +   **Events:** An event is a change of state of an object.


    +   **Events Source:** Source is an object that generates an event.


    +   **Listeners:** A listener is an object that listens to the event. A listener
    gets notified when an event occurs.


    # How Events are handled?


    A source generates an Event to one or more listeners registered with the source.
    Once event is received by the listener, they process the event and then return.
    Events are supported by a number of Java packages, like java.util, java.awt and
    java.awt.event.


    # Event Classes and Interfaces:


    | Event Class | Event Description | Listener Interface |

    |---|---|--|

    | ActionEvent | generated when button is pressed, menu-item is selected,list-item
    is double clicked | |

    | MouseEvent | generated when mouse is dragged, moved,clicked,pressed or released
    also when the enters or exit a component | MouseListener |

    | KeyEvent | generated when input is received from keyboard | KeyListener |

    | ItemEvent | generated when check-box or list item is clicked | ItemListener
    |

    | TextEvent | generated when value of textarea or textfield is changed | TextListener
    |

    | MouseWheelEvent | generated when mouse is moved | MouseWheelListener |

    | WindowEvent | generated when window is activated, deactivated, deiconified,
    opened or closed | WindowListener |

    | ComponentEvent | generated when component is hidden, moved, resized or set visible
    | ComponentEventListener |

    | ContainerEvent | generated when component is added or removed from container
    | ContainerListener |

    | AdjustmentEvent | generated when scroll bar is manipulated | AdjustmentListener
    |

    | FocusEvent | generated when component gains or loses focus | FocusListener |'
