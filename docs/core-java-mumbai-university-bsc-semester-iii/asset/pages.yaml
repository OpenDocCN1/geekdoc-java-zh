    # 7.11 Filtered Byte Streams


    As mentioned earlier, the InputStream and OutputStream classes are used for reading
    from and writing to byte streams, respectively. Data can be used for transforming
    and manipulating using Filter Streams.


    Like I/O streams, Filter streams are also used to manipulate data reading from
    an underlying stream. Apart from this, it allows the user to make a chain using
    multiple input stream so that, the operations that are to be applied on this chain,
    may create a combine effect on several filters. By using these streams, there
    is no need to convert byte while writing to a file. These are the more powerful
    streams than the other streams of Java. can be shown as:


    ![](img/b651d361ec09e4bd257525b03893127f_153_0.png)


    There are two streams, that are derived from the I/O stream class:


    +   * FilterInputStream.

    * FilterOutputStream.


    # FilterInputStream:


    FilterInputStream is the base class for all the input stream filters and is obtained
    from the InputStream class. It simply overrides all the methods of the InputStream
    class required to filter data. These methods performs some sort of filtering operations
    on the data and cannot be instantiated directly. It provides the additional and
    chaining functionality for the multiple input streams to be filtered.


    The constructor of the FilterInputStream is written as:


    ```

    FilterInputStream fis = new

    FilterInputStream(InputStream in);

    ```'
