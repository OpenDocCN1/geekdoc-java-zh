    can be run concurrently. Each part of a program is called a thread and each thread
    defines a separate path of execution.


    We have distinct type of multitasking:


    +   (a) Process based.


    +   (b) Thread based.


    A process is program that is executing. Thus a processed based multitasking is
    the feature that allows your computer to run two or more process concurrently.


    In a process based, program is the smallest unit of code that can be dispatched
    by scheduler.


    In a thread-based multithreading, the thread is the smallest unit of dispatchable
    code. This means that a single program can perform two or more tasks simultaneously.


    Multitasking threads require fewer overheads than multitasking process are heavy
    weight task that requires their separate address spaces.


    Threads on the other hand are lightweight. They share the same address space.'
