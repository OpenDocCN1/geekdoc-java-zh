  md: 'Java has several predefined LayoutManager classes, several of which are described
    next. You can use the layout manager that best fits your application.


    # 1. FlowLayout


    FlowLayout is the default layout manager. FlowLayout implements a simple layout
    style, which is similar to how words flow in a text editor.


    Components are laid out from the upper-left corner, left to right and to bottom.
    When no more components fit on a line, the next one appears on the next line.


    Here are the constructors for FlowLayout:


    ```

    FlowLayout()

    ```


    ```

    FlowLayout(int how)

    ```


    ```

    FlowLayout(int how, int hor, int vert)

    ```


    The first form creates the default layout, which centers components and leaves
    five pixels of space between each component. The second form lets you specify
    how each line is aligned. Valid values for how are as follows:


    ```

    FlowLayout.LEFT

    ```


    ```

    FlowLayout.RIGHT

    ```


    These values specify left, center, and right alignment, respectively. The third
    form allows you to specify the horizontal and vertical space left between components
    in hor and vert, respectively.


    Here is a version of the CheckboxDemo applet shown earlier in this chapter, modified
    so that it uses left-aligned flow layout.


    # 2. BorderLayout


    The BorderLayout class implements a common layout style for top-level windows.
    It has four narrow, fixed-width components at the edges and one large area in
    the center.


    The four sides are referred to as north, south, east, and west. The middle area
    is called the center. Here are the constructors defined by BorderLayout:


    ```

    BorderLayout()

    ```


    ```

    BorderLayout(int hor, int vert)

    ```


    The first form creates a default border layout. The second allows you to specify
    the horizontal and vertical space left between components in hor and vert, respectively.


    BorderLayout defines the following constants that specify the regions:


    ```

    BorderLayout.CENTER

    ```


    ```

    BorderLayout.EAST

    ```


    ```

    BorderLayout.SOUTH

    ```


    ```

    BorderLayout.NORTH

    ```


    ```

    BorderLayout.WEST

    ```'
