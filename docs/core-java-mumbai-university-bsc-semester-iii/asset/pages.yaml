  md: '# 5.3 Try-Catch-Finally


    An exception is an error or an unexpected event. The exception handler is a set
    of codes that executes when an exception occurs.


    Exception handling uses basically 3 blocks:


    +   (i) Try, (ii) Throw, (iii) Catch


    The try & catch blocks are written between open & closing braces ''{ }''. The
    try block is identified by try keyword having block of statements between {and}.
    When the exception is detected by the try block, it is thrown using throw statement
    in try block.


    A catch block is defined by the keyword catch followed by { } with block of statement.
    The catch block catches the exception by throw statement in try block and handles
    it appropriately. When the try block throws an exception the program control leaves
    the try block and enter into the catch block and if the type of object thrown
    by try block this catch block is executed for handling exception. If they do not
    match, the program is aborted using function


    try


    The class has a block of catch that has its exceptions handled or needs specific
    code following try block to handle exception(Catch). The purpose is to catch exception
    when try block of code terminates for any reason. The termination of try block
    could be due to exception or break or continue return statements.


    catch


    A try block can be followed by zero or more catch clauses. Each catch clause contains
    specific code to handle various types of exceptions. Each catch clause is passed
    a single argument that specifies the type of exception. The argument to a catch
    clause must be object of Throwable class or of its subclass.


    When an exception is thrown , the JVM invokes the first catch clause with same
    argument of exception object. The JVM invokes the first catch clause it finds.
    The code within a catch block should take necessary action to handle that exception.
    For example if the exception is java.io.FileNotFoundException exception, user
    may be asked to checking for file name and try again.


    finally


    The finally block is used to clean up after the try-catch block. There are various
    possibilities that can happen in a try block.


    +   1. If an exception occurs in the try block and there is an associated catch
    block to handle the exception, control first transfers to catch block. It is transferred
    to finally block.


    +   2. In normal case ( without any exception), control reaches the end of the
    try block and then to finally block. The finally block performs clean up, like
    closing any open file, myFile.close().


    +   3. If control leaves try block because of return, break or continue statement,
    the finally block is executed before control transfers to its new destination.'
