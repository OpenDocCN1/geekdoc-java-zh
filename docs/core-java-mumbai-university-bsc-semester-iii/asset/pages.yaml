  md: '# Java Language


    The class contains the declaration of the variables(Data members or properties)
    and the methods (member functions), these are called as the members of the class.


    The keyword private and the public are the access specifier.


    The variables and the methods declare in the private are accessed by the public
    members.


    Public members can be accessed by the outsider any function of class.


    # Some of the characteristics of object oriented programming:


    +   1. Object oriented approach provides modularizing by diving program into functions.

    2. Programs are divided into objects.

    3. Functions that operate on the data of an object are tied together in the data
    structure.

    4. Data is hidden and cannot be accessed by external functions.

    5. Objects may communicate with each other through functions.

    6. Data and functions can be combined other in one encapsulated unit class.

    7. New data and functions can easily be tied whenever necessary.


    # Basic concepts of object-oriented programming:


    +   Some important concepts are needed to understand in OOPS:

    (a) Objects.

    (b) Classes.

    (c) Data Abstraction.

    (d) Data Encapsulation.

    (e) Inheritance.

    (f) Polymorphism.

    (g) Dynamic binding.

    (h) Message passing.


    +   (a) Objects:

    (i) Objects are the basic Run-time entities also called as Real World thing.

    (ii) An object in C++ is a representation of some physical, logical or conceptual
    entity. For example, an object can be a vehicle, bank account, animal, place,
    a table of data, any item, or it represents a person cet.

    (iii) Every object is identified by its properties and methods which indicates
    behaviour, states of object.

    (iv) The object can take place in memory and associated in a memory like a structure
    in C or Pascal.

    (v) An instance of user-defined data type called class. We can say that object
    is a variable whose type is a user defined class.

    (vi) When a program is executed, the objects interact by sending messages to one
    another.


    For example 1, if customer and account are two objects, customer object may send
    a message to the account object requesting for the bank balance.


    For example 2, if student and marks are two objects, student object may send a
    message to the marks object requesting for grade of student.'
