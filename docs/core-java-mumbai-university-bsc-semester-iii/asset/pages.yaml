    # 13.10 Check Boxes


    A check box is a control that is used to turn an option on or off. It consists
    of a small box that can either contain a check mark or not. There is a label associated
    with each check box that describes what the box represents. You change the state
    of the check box by clicking on it. Check boxes can be used individually or as
    part of a group. Check boxes are objects of the Checkbox class.


    Checkbox supports these constructors:


    +   1. Checkbox()

    2. Checkbox(String str)

    3. Checkbox(String str, boolean an)

    4. Checkbox(String str, boolean cb, CheckgroupcbGroup)

    5. Checkbox(String str, CheckgroupcbGroup, boolean an)


    The first form creates a check box whose label is initially blank. The state of
    the check box is unchecked.


    The second form creates a check box whose label is specified by str. The state
    of the check box is unchecked.


    The third form allows you to set the initial state of the check box. If it is
    true, the check box is initially checked otherwise, it is cleared.


    The fourth and fifth forms create a check box whose label is specified by str
    and whose group is specified by cbGroup. If this check box is not part of a group,
    then cbGroup must be null. Check box groups are described soon in this article)
    The value of determines the initial state of the check box.


    These methods are as follows:


    +   1. booleanagetState()

    2. void setState(boolean an)

    3. String getLabel()

    4. void setLabel(String str)


    Here, if on true, the box is checked. If it is false, the box is cleared. The
    string in str becomes the new label associated with the invoking check box.'
