    # 9.1 Introduction to Wrapper Classes


    All the wrapper classes (Integer, Long, Byte, Double, Float, Short) are subclasses
    of the abstract class Number. The object of the wrapper class contains or wraps
    its respective primitive data type. Converting primitive data types into object
    is called boxing, and this is taken care by the compiler.


    Java is an object-oriented language and can view everything as an object. A simple
    file can be treated as an object (with java.io.File), an address of a system can
    be seen as an object (with java.util.URL), an image can be treated as an object
    (with java.awt.Image) and a simple data type can be converted into an object (with
    wrapper classes). This tutorial discusses wrapper classes. Wrapper classes are
    used to convert any data type into object.


    The primitive data types are not objects; they do not belong to any class; they
    are defined in the language itself. Sometimes, it is required to convert data
    types into objects in Java language. For example, upto JDK1.4, the data structures
    accept only objects to store. A data type is to be converted into an object and
    added to a Stack or Vector etc. For this conversion, the designers introduced
    wrapper classes.


    The object of the wrapper class contains or wraps its respective primitive data
    type. Converting primitive data types into object is called boxing, and this is
    taken care by the compiler. Therefore,'
