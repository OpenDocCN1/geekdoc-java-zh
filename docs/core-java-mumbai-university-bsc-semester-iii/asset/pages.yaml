  md: 'TextField defines the following constructors:


    +   1. TextField())

    2. TextField(intnumChars)

    3. TextField(String str)

    4. TextField(String str, intnumChars)


    The first version creates a text field with a default text.


    The second form creates a text field that is numChars characters wide.


    The third form initializes the text field with the string contained in str.


    The fourth form initializes a text field and sets its width.


    TextField(and its superclass JTextField) provides several methods that allow you
    to utilize a text field. To obtain the text in the text field, call getText( ).
    To set the text , call setText( ).


    These methods are as follows:


    +   1. String getText())

    2. void setText(String str)


    Here, str is the new string.


    The user can select a portion of the text in a text field. Also, you can select
    a portion of text under program control by using( ). A program can obtain the
    currently selected text by calling getSelectedText( ).


    These methods are shown here:


    +   1. String getSelectedText())

    2. void setSelected(int startIndex, int endIndex)


    getSelectedText( ) returns the selected text. The select( ) method selects the
    characters beginning at startIndex and ending at endIndex-1.


    You can control whether the contents of a text field may be modified by the user
    by calling setEditable( ). You can determine editability by calling isEditable(
    ).


    These methods are shown here:


    +   1. boolean isEditable())

    2. void setEditable(boolean canEdit)


    isEditable( ) returns true if the text may be changed and false if not. In setEditable(
    ), if canEdit is true, the text may be changed. If it is false, the text cannot
    be altered.


    There may be times when you want the user to enter text that is not displayed,
    such as a password. You can disable the echoing of the characters as they are
    typed by calling setEchoChar( ). This method specifies a single character that
    the TextField will display when characters are entered (thus, the actual characters
    typed will not shown). You can check a text field to see if it is in this mode
    with the echoCharsSet( ) method. You can retrieve the echo character by calling
    getEchoChar( ) method.'
