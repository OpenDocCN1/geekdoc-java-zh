    Here are some of the common methods of the ServerSocketclass:


    # public getPort()


    Returns the port that the server socket is listening on. This method is useful
    if you passed in 0 as the port number in a constructor and let the server find
    port for you.


    # public Socket accept() throws IOException


    Waits for an incoming connection until a client connects to the server on the
    specified port or the socket times out, assuming that the timeout-value has been
    set by the setSoTimeout() method. Otherwise, this method blocks indefinitely.


    # public void setTimeout(int timeout)


    Sets the timeout-value for how long the server socket waits for a client during
    the accept( ).


    # public void bind(SocketAddress host, int backlog)


    Binds to the specified server and port in the SocketAddress object. This method
    if if you instantiated the ServerSocket using the no-argument constructor. When
    the ServerSocket invokes accept( ), the method does not return until a client
    connects. After a client connects, the ServerSocket creates a new Socket on an
    unspecified port and returns a reference to this new Socket. A TCP connection
    now exists between the client and server, and communication begin.


    # Socket Class Methods:


    The java.net.Socket represents the socket that both the client and server use
    to communicate with each other. The client obtains a Socket object by instantiating
    one, whereas the server obtains a Socket object from the return value of the accept(
    ).


    The Socket has five constructors that use to connect to a server:


    # public Socket(String host, int port) throws UnknownHostException, IOException.


    This method attempts to connect to the specified server port. If this constructor
    does not throw an exception, the connection is successful and the client is connected
    to thereafter.


    # public Socket(InetAddress host, int port) throws IOException


    This method is identical to the previous constructor, except that the host is
    denoted by an InetAddress object.


    # public Socket(String host, int port, InetAddresslocalAddress, intlocalPort)
    throws IOException.


    Connects to the specified host and port, creating a socket on the local host at
    the specified address and port.'
