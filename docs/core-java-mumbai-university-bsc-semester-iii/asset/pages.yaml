  md: 'Its concept is quite simple:


    +   1 source generates an event and sends it to one or more listeners.

    2 The listener simply waits until it receives an event. Once received, the listener
    processes the event and returns.

    3 The advantage of this design is that the application logic processes events
    is cleanly separated from the user interface logic that generates those events.

    4 A user interface element is able to delegate the processing of an event to a
    separate piece of code.

    5 In the delegation event model, listeners must register with a source to receive
    an event notification.

    6 This provides an important benefit: notifications are sent only to listeners
    that want to receive them.


    ![](img/b651d361ec09e4bd257525b03893127f_236_0.png)


    # Events


    In the delegation model, an event is an object that describes a state change in
    source. It can be generated as a consequence of a person interacting with the
    elements in a graphical user interface. Some of the activities that cause events
    to be generated is pressing a button, entering a character via the keyboard, selecting
    an item in a list, and clicking the mouse. Many other user operations could also
    be cited as examples. Events may also occur that are not directly caused by interactions
    with a user interface.'
