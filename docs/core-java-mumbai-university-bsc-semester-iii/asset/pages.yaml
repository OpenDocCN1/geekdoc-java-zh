  md: '# 3. Port Number


    The port number is used to uniquely identify different applications. It acts as
    a communication endpoint between applications.


    The port number is associated with the IP address for communication between two
    applications.


    # 4. MAC Address


    MAC (Media Access Control) Address is a unique identifier of NIC (Network Interface
    Controller). A network node can have multiple NIC but each with unique MAC.


    # 5. Connection-oriented and connection-less protocol


    In connection-oriented protocol, acknowledgement is not sent by the receiver.
    It is reliable but slow. The example of connection-oriented protocol is TCP.


    But, in connection-less protocol, acknowledgement is not sent by the receiver.
    So it is not reliable but fast. The example of connection-less protocol is UDP.


    # 6. Socket


    A socket is an endpoint between two way communication.


    # 8.2 Socket


    Socket Programming


    # Java Socket Programming


    Java Socket programming is used for communication between the applications running
    on different JRE.


    Java Socket programming can be connection-oriented or connection-less.


    Socket and ServerSocket classes are used for connection-oriented socket programming
    and DatagramSocket and DatagramPacket classes are used for connection-less socket
    programming.


    The client in socket programming must know two information:


    +   1. IP Address of Server, and

    2. Port number.


    # Socket class


    A socket is simply an endpoint for communications between the machines. The Socket
    class can be used to create a socket.


    # Important methods


    | Method | Description |

    | --- | --- |

    | 1. public InputStream getInputStream() | returns the InputStream attached with
    this socket. |

    | 2. public OutputStream getOutputStream() | returns the OutputStream attached
    with this socket. |

    | 3. public synchronized void close() | closes this socket |


    # ServerSocket class


    The ServerSocket class can be used to create a server socket. This object is used
    to establish communication with the clients.'
