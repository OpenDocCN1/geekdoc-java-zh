    # 6.1 Introduction to Multithreading


    +   1. Multithreading supports number of threads simultaneously to be executed
    by the processor.

    2. In multithreading the program is divided into sub parts. There may be two or
    more parts of the program, these parts of programs are called as “Sub programs”
    or “Thread”. A single program can have more number of threads.

    3. A thread is similar to the program that has single flow of control. It has
    a beginning, body, and all these statements are executed sequentially.

    4. Java supports multithreading for each program which enables the java to use
    multiple flows of control in developing a program.

    5. Multithreading states that number of threads running parallel are known as
    concurrency of threads.

    6. The threads in java which are the sub programs of main programs shares the
    same memory space. Hence they are called as “light weight threads” or “ light
    weight processes”

    7. The program that contain multiple flow of control is called as “Multithreaded
    Programs"'
