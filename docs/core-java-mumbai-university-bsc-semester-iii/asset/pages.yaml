    \ 7.26 Serialization\n\n# Serialization in Java\n\nSerialization in java is a\
    \ mechanism of writing the state of an object into a byte stream.\n\nIt is mainly\
    \ used in Hibernate, RMI, JPA, EJB and JMS technologies.\n\nThe reverse operation\
    \ of serialization is called deserialization.\n**Serialization** is a process\
    \ of converting an object into a sequence of bytes which can be persisted to a\
    \ disk or database or be sent through streams. The reverse process of converting\
    \ object from sequence of bytes is called **deserialization**.\n\nA class must\
    \ implement **Serializable** interface in **java.io** package in order to serialize\
    \ its object successfully. Serializable is a **marker interface** that adds serializable\
    \ behaviour to the class implementing it.\n\nJava provides **Serializable** API\
    \ encapsulated under **java.io** package for serializing and deserializing objects\
    \ which include,\n\n+   * java.io.serializable\n* java.io.Externalizable\n* ObjectInputStream\n\
    * and ObjectOutputStream etc.\n\n# Marker Interface\n\nMarker Interface is a special\
    \ interface in Java without any field and method. Marker interface is used to\
    \ inform compiler the class implementing it has some special behaviour or meaning.\
    \ Some example of Marker interface are,\n\n+   * java.io.Serializable\n* java.lang.Cloneable\n\
    * java.mi.Remote\n* java.util.RandomAccess\n\nAll these interfaces does not have\
    \ any field and method. They only add special behavior to the classes implementing\
    \ them. However marker interfaces have been deprecated since Java 5, they were\
    \ replaced by **Annotations**. Annotations are used in place of Marker Interface\
    \ that play the exact same role as marker interfaces did before."
