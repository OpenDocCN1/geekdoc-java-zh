  md: '# # SYLLABUS


    | Course: USCS302 | TOPICS (Credits: 02 Lectures/Week: 03) |

    |---| Core Java |


    **Objectives:**

    The objective of this course is to teach the learner how to use Object Oriented
    paradigm to develop code and understand the concepts of Core Java and to cover
    up with the pre-requisites of Core Java.


    +   **Expected Learning Outcomes:**

    1. Object oriented programming concepts using Java.

    2. Knowledge of input, its processing and getting suitable output.

    3. Understand, design, implement and evaluate classes and applets.

    4. Knowledge and implementation of AWT package.


    | Unit | Details | Lectures |

    |---|---||

    | Unit I | **The Java Language:** Features of Java, Java Programming Format, Java
    Tokens, Statements, Data Types, Typecasting, Arrays

    OOP: Introduction, Class, Static Keywords, Constructors, this Key Word, Inheritance,
    Super Keyword, Polymorphism (Overloading and Overriding), Abstraction, Encapsulation,
    Abstract Classes, Interfaces

    **String Manipulations:** String Buffer, String, String Tokenizer

    **Packages:** Introduction to Pre-defined Packages (java.lang, java.util, java.io,
    java.sql, java.swing), User Defined Packages, Access Specifiers | 15L |

    | Unit II | **Exception Handling:** Introduction, Pre-defined Exceptions, Try-Catch-Finally,
    Throws, Throw, User Defined Exception Examples

    **Multithreading:** Creation Threads, Thread Life, Life Cycle Methods, Synchronization,
    Wait, notify(1), notify(all) methods

    **I/O Streams:** Introduction, Byte-oriented Streams, Character-oriented Streams,
    File, Random Access File, Serialization

    **Networking:** Introduction, Socket, Server socket, Client Communication | 15L
    |

    | Unit III | **Wrapper Classes:** Introduction, Byte, Short, Integer, Long, Float,
    Double, Boolean Classes

    **Collection Framework:** Introduction, Util Package Interfaces, List, Set, Map,
    List Interface and its Classes, Set Interface and its Classes, Map Interface and
    its Classes

    **Inner Class:** Introduction, Member Inner Class, Static Inner Class, Local Inner
    Class, Anonymous Inner Class

    **AWT:** Introduction, Components, Event-Delegation-Model, Listeners, Layouts,
    Individual Components Label, Button, CheckBox, Radio Button, Choice, List, Menu,
    Text Field, Text Area | 15L |'
