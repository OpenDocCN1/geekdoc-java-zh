    ```

    product x, y, z;

    ```


    This statement creates three null objects x, y, z. The single memory space is
    allocated to an object.


    # TO create a object of a class


    ```

    product obj = new product();

    ```


    product is a class, obj is of class, new operator is used to call a constructor
    product() to allocate the memory for the object.


    If constructor is parameterized the object creation statement is as follows:


    ```

    product obj = new product(2,3);

    ```


    Here is a class, obj object created when new operator calls the constructor with
    two parameters 2 and 3.


    # Accessing Class Members


    +   (1) Private data the class cannot be accessed outside the class. It can be
    accessed only by the method s of class.


    +   (2) The public variables and public methods can be accessed outside the class
    by referring objectname.functionname(list of arguments);


    ```

    obj.getdata();

    ```


    obj is the object and getdata() is the method accessed with the help of object.
    If method is parameterized while calling parameters are to be passed.


    Example:


    ```

    obj.calculate(2,3,5);

    ```


    obj is the object, calculate is a method . 2,3,5 are value of the arguments of
    the function.


    +   (3) If x private data member to access main function if you have written.


    ```

    obj.x=10; // It is not allowed

    ```


    It gives error because private data members cannot be accessed outside the class.


    If it is public data member then it can be accessed outside the class.


    It is public variable then we can write.


    ```

    obj.x=100;

    ```


