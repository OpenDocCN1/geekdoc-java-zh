  md: '# Client/Server Communication running a program that makes a request for services
    is called client machine. A computer running a program that offered requested
    services for one or more clients is called server machine.


    Generally, programs running on client machines make requests to a program (often
    called as server program) running on a server machine. They involve networking
    services provided by the transport layer, which is part of the Internet software
    stack, often TCP/IP (Transport Control/Internet Protocol) and UDP (User Datagram
    Protocol). The transport layer carries two types of protocols, TCP (Transport
    Control Protocol) and UDP (User Datagram Protocol). The most widely used programming
    interfaces for these protocols are sockets.


    The java.net package of the JSE APIs contains a collection of classes and interfaces
    that provide the low-level communication details, allowing you to write programs
    that focus on solving the problem at hand.


    The java.net package provides support for the following network protocols:


    +   - TCP TCP stands for Transmission Control Protocol, which allows for reliable
    communication between two applications. TCP is typically used over the Internet,
    which is referred to as TCP/IP. TCP is a connection-oriented protocol that provides
    a reliable flow of data between two computers. Example applications that use such
    services are HTTP, FTP, and Telnet.

    - UDP UDP stands for User Datagram Protocol, a connection-less protocol that allows
    for packets of data to be transmitted between applications. UDP is a protocol
    that sends independent packets of data, called datagrams, from one computer to
    another with no guarantees about arrival and sequencing. Applications that use
    such services include Clock and Ping.


    # Java Networking Termination


    The widely used java networking terminologies are given below:


    +   -1. IP Address

    -2. Protocol

    -3. Port Number

    -4. MAC Address

    -5. Connection-oriented and connection-less protocol

    -6. Socket


    # 1. IP Address


    IP address is a unique number assigned to a node of a network e.g. 192.168.0.1
    . It is composed of octets that range from 0 to 255.


    It is a logical address that can be changed.


    # 2. Protocol


    A protocol is a set of rules basically that is followed for communication. For
    example:


    +   - TCP

    - FTP

    - Telnet

    - SMTP

    - POP etc.'
