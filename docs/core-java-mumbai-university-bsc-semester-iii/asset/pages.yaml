    # ## 13.13 Scroll Bars


    Scroll bars are used to select continuous values between a specified minimum and
    maximum. Scroll bars may be oriented horizontally or vertically. A scroll bar
    is actually a composite of several individual parts. Each part has an arrow that
    you can click to move the current value of the scroll bar one unit in the direction.
    The value of the scroll bar relative to its minimum and maximum values is indicated
    by the slider box (or thumb) for the scroll bar. The slider box can be dragged
    by the thumb to either side of the bar, the user can click to the thumb to jump
    in that direction by some extent larger than 1. This action translates into some
    form of page up and page down.


    Scroll bars are encapsulated in the Scrollbar class.


    +   1. Scrollbar ()

    2. Scrollbar(int style)

    3. Scrollbar(int style, initialValue, intthumbSize, int min, int max)'
