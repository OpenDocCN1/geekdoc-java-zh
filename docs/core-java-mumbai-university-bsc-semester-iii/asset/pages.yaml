  md: "# Core Java\n\nIn 1994 internet was becoming very popular and team found this\
    \ language suitable for internet. They named it Java. Java has application programming\
    \ interface (API) that can handle graphics and user interfaces that can be used\
    \ to create applications or applets.\n\nThe Java programming language consists\
    \ of Java compiler, the Java virtual machine, and the Java classes. The Java virtual\
    \ machine (JVM) is a software implementation of a computer that executes programs\
    \ like a real machine.\n\nThe compiler translates Java coding into so-called byte-code.\
    \ The Java virtual machine interprets this byte-code and runs the program. The\
    \ Java virtual machine is written specifically for a specific operating system.\n\
    \nBecause of its rich set of APIs, similar to Macintosh and Windows, and its platform\
    \ independence, Java can also be thought of as a platform in itself. Java also\
    \ has standard libraries for\n\nIn we distinguish between applications, which\
    \ are programs that perform the same functions as those written in other languages,\
    \ and applets, which are programs that can be embedded in a Web page and accessed\
    \ over the Internet.\n\n# 1.2 JAVA (Object Oriented Programming Language)\n\n\
    Java is a Object Oriented Language and is internet based Language. It is developed\
    \ by Sun Microsystems in 1990. In 1994 internet was becoming very popular and\
    \ team found this language suitable for internet. They named it JAVA. It is designed\
    \ to be small, portable ang highly reliable across different platform as well\
    \ as operating system.\n\nIn java development there are two parts 1)compiler 2)\
    \ Java interpreter.\n\nThe compiler generates byte code & interpreter executes\
    \ the java program with help of JIT in JVM.\n\nObject contained the data and the\
    \ code to manipulate that data. The entire data and the code of an object can\
    \ be a user- defied data type class.\n\nIn oops the class is the template that\
    \ the data and the code. And when the variable is declared of a type class it\
    \ is called an object. Those functions, which are defined in the class, can be\
    \ called as method.\n\nWe can create any number of the object belonging to that\
    \ class.\n\nThe general form of the variable declaration is\n\n```\nClassclassname\n\
    {\n  private:\n    variables;\n    methods;\npublic:\n    variables;\n    methods;\n\
    }\n```"
