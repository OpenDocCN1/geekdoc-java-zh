  md: "# AWT\n\nThe first form creates a vertical scroll bar.\nThe second and third\
    \ forms allow you to specify the orientation of the scroll bar. If style is Scrollbar.VERTICAL,\
    \ a vertical scroll bar is created. If style is Scrollbar.HORIZONTAL, the scroll\
    \ bar is horizontal.\n\nIn the form of the constructor, the initial value of the\
    \ scroll bar is passed in initialValue. The number of units represented by the\
    \ height of the thumb is passed in thumbSize. The minimum and maximum values for\
    \ the scroll bar are specified by min and max.\n\nIf you construct a scroll bar\
    \ by using one of the first constructors, then you need to set its parameters\
    \ by using setValue( ), shown here, then it can be used:\n\n```\nvoid setValues(initialValue,\
    \ int thumbSize, int min, int max)\n```\n\nThe parameters have the same meaning\
    \ as they have in the third constructor just described.\n obtain the current value\
    \ of the scroll bar, call getValue( ). It returns the current setting. To set\
    \ the current value, call setValue().\n\nThese methods are as follows:\n\n+  \
    \ 1. int get()\n2. void setValue(int newValue)\n\nHere, newValue specifies the\
    \ new value for the scroll bar. When you set a value, the slider box inside the\
    \ scroll bar will be positioned to reflect the new value.\n\nYou can also retrieve\
    \ the minimum and maximum values via getMinimum( ) and getMaximum( ), shown here:\n\
    \n+   1. int getMinimum()\n2. int getMaximum()\n\nThey return the requested quantity.\n\
    \nBy default, 1 is the increment added or subtracted from the scroll bar each\
    \ time it is scrolled up or down line. You can change this increment by calling\
