  md: '# 13.1 AWT Fundamentals


    AWT contains large number of classes and methods that allows you to create and
    manage Swing GUI application. AWT is the foundation upon which Swing is made.
    It is used for GUI programming in Java. But now a days it is merely used because
    most GUI java programs are implemented using Swing because of its rich implementation
    of GUI controls and light-weighted nature.


    Java AWT (Abstract Windowing Toolkit) is an API to develop GUI or window-based
    application in java.


    Java AWT components are platform-dependent i.e. components are displayed according
    to the view of operating system. AWT is heavyweight i.e. its components uses the
    resources of system.


    The java.awt package provides classes for AWT api such as TextField, Label, TextArea,
    RadioButton, Checkbox, Choice, List etc.


    # Java AWT Hierarchy


    ![](img/b651d361ec09e4bd257525b03893127f_230_0.png)


    # 13.2 Component


    At the top of the AWT hierarchy is the Component class. Component is an abstract
    class that encapsulates all of the attributes of a visual component. All user
    interface elements that are displayed on the screen and that interact with the
    user are subclasses of Component. It defines over a hundred'
