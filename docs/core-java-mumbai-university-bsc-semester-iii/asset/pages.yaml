  md: '# OOPS


    The mechanism of deriving new class from old class is known as inheritance. The
    old class is referred as base class and the new class is referred as derived class.
    The base class is also called as super class and the derived class is also called
    as sub-class. It is also known as parent-child relationship. The derived class
    can access properties and methods of base class during any type of inheritance
    as well derived class has its own properties and methods.


    # Types of Inheritance:


    +   1. Single Inheritance: A derived class with only one base class is called
    single inheritance. With this one derived class can be possible with one base
    class.


    ![](img/b651d361ec09e4bd257525b03893127f_82_0.png)


    +   2. Multilevel Inheritance: The mechanism of deriving a class from another
    derived class is known as Multilevel Inheritance.


    ![](img/b651d361ec09e4bd257525b03893127f_82_1.png)


    In multilevel first class is derived from base class and again from derived class
    another class will be derived.


    +   3. Multiple Inherit: A derived class with several base classes, is called
    multiple inheritance.


    ![](img/b651d361ec09e4bd257525b03893127f_82_2.png)


    This type of inheritance can have one or more base classes from that we can drive
    only derived class is called as Multiple Inheritance. This type of Inheritance
    is not directly available in Java, It can be implemented by using interface concept.


    +   4. Hierarchical Inheritance: The properties of one class may be inherited
    by more than one class is called hierarchical Inheritance. In this type of inheritance
    one base class, number of classes can be derived as known as hierarchical Inheritance.'
