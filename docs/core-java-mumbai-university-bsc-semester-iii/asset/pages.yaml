    #  2.4 Static Keywords


    The static keyword in java is used for memory management mainly. We can apply
    java static keyword with variables, methods, blocks and nested class. The static
    keyword belongs to the class than instance of the class.


    The static can be:


    +   1. variable (also known as class variable)

    2. method (also known as class method)

    3. block

    4. nested class

    5. Java static variable


    If you declare any variable as static, it is known static variable.


    +   - The static variable can be used to refer the common property of all objects
    (that is not unique for each object) e.g. company name of employees, college name
    of students etc.

    - The static variable gets memory only once in class area at the time of class
    loading.


    Advantage of static variable


    It makes your program memory efficient (i.e it saves memory).


    Understanding problem without static variable


    ```

    class Student{

    int rollno;

    String name;

    String college="ITS";n}

    ```


    Suppose there are 500 students in my college, now all instance data members will
    get memory each time when object is created.All student has its unique rollno
    and name so instance data member is good.Here, college refers to the common property
    of all objects.If we make it static,this field will get memory only once.'
