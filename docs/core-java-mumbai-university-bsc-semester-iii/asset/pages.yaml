  md: "# 17. Method overriding Example:\n\nMethod overriding in java means a subclass\
    \ method overriding a super class method. Superclass method should be non-static.\
    \ Subclass uses keyword to extend the super class. In the example class B is the\
    \ sub class and class A is the super class. In overriding methods of both subclass\
    \ and class possess same signatures. Overriding is used in modifying the methods\
    \ of the super class. In overriding return types and constructor parameters of\
    \ methods should match.\n\nSource code of the program:\n\n```\nclass A\n{\n  \
    \  int i;\n    A(int a, int b)\n    {\n        i = a+b;\n    }\n    void add()\n\
    \    {\n        System.out.println(\"Sum of a and b is: \" + i);\n    }\n}\nclass\
    \ B extends A\n{\n    int j;\n    B(int a, int b, int c)\n    {\n        super(a,\
    \ b);\n        j = a+b+c;\n    }\n    void add()\n    {\n        super.add();\n\
    \        System.out.println(\"Sum of a, b and c is: \" + j);\n    }\n}\nclass\
    \ MethodOverriding\n{\n    public static void main(String[] args) {\n    {\n \
    \       B b = new B(10, 20, 30);\n        b.add();\n    }\n}\n```\n\nOutput:\n\
    \n```\nC:\\NewExamples\\>javac MethodOverriding.java\nC:\\NewExamples\\>java MethodOverriding\n\
    Sum of a and b is: 30\nSum of a, b and c is: 60\n```"
