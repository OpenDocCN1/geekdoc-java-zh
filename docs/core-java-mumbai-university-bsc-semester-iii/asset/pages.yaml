  md: '# For Loops


    A loop is another way to perform something that needs to be repeated in C++ (repetition).
    Most programmers like to use for loops because the code can be written in a more
    compact manner compared to the same loop written with a while or do loop. A for
    loop is generally used when you know how many times a section of code needs to
    be repeated. The general form of a for loop is as follows:


    ```

    for ( expression1; expression2; expression3 )

    stmt(s);

    ```


    where stmt(s) is a single or compound statement. Expression1 is used to initialize
    the loop; expression2 is used to determine whether or not the loop will continue;
    expression3 is evaluated at the end of each iteration or cycle.


    **NOTE 1:** Expression2 is tested before the stmt and expression3 are executed;
    it is possible that the body of the loop is never executed.


    **NOTE 2:** Any or all of the 3 expressions in a for loop can be omitted, the
    2 semi-colons must remain. If expression1 is omitted, there is no initialization
    in the loop, you might not need any initialization for your program. If expression2
    is omitted, there is no test section so you will have an infinite loop. If expression3
    is omitted, there is no update as part of the statement, but the update could
    be done as part of a statement in the body of the loop.


    In general, a for loop can be written as an equivalent while loop and versa.


    ```

    for ( expression1; expression2; expression3 )

    stmt;

    is equivalent to...

    expression1;

    while ( expression2 )

    {

    stmt(s);

    expression3;

    }

    ```


    **Example 1:**

    Write a loop that will display all odd integers between 1 and 51:


    ```

    for ( int k = 1; k <= 51; k += 2 )

    System.out.println("k is " + k);

    ```


    **Example 2:**

    Write a for loop that will display a "countdown" of integers from 20 to 1:


    ```

    for ( int k = 20; k >= 1; k-- )

    System.out.println("k is " + k);

    ```'
