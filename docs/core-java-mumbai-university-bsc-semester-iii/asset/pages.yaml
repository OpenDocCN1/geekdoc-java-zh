    To process list events, you will need to implement the ActionListener interface.
    Each time a list item is double-clicked, an ItemEvent object is generated. Its
    getCommand() method may be used to retrieve the name of the newly selected item.
    Also, each time an item is selected or deselected with a single click, an ItemEvent
    object is generated. Its getStateChange() method may be used to determine whether
    a selection or deselection was triggered. Its getSelectable() returns a reference
    to the object that triggered this event.


