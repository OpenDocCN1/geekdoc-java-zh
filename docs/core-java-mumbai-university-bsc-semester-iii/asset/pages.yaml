    +   - Abstraction in managing the complexity of the software.


    # (d) Data Encapsulation:


    +   (i) The internal data of a class i. data members and member functions are
    first separated

    from outside world and then they are part in a unit is called encapsulation


    +   (ii) Encapsulation groups all pieces of object into one packet.


    +   (iii) Encapsulated data is not outside the world. It can be accessed only
    by

    member functions which are declared within a class.


    +   (iv) This isolation of the data direct access by the program is called data
    hiding or

    information hiding.


    +   (v) All the essential properties of objects are encapsulated in a class. The
    attributes are

    called as data members to hold information. The functions that operate on this
    data

    are called methods or member functions.


    # (e) Inheritance:


    +   (i) Inheritance is the process of creating new classes, called derived classes,
    from existing

    classes. These existing classes are often called base classes.


    +   (ii) The derived class inherits all the properties and methods of the base
    class and add

    new features, properties and methods of its own, based on requirement. By adding

    these refinements the base class remain unchanged.


    +   (iii) Inheritance is the process by which objects of one class acquire the
    properties of

    of of another class.


    +   (iv) C++ allows a programmer to create hierarchical classification i.e. it
    supports parent-

    child relationship.


    +   (v) The parent class is a base class also called super class and the child
    class is also called

    derived class or sub class.


    +   (vi) The concept of inheritance provides the idea of reusability. This means
    we can reuse

    existing classes many times and also add additional features to an existing class

    with modifying it. Reusability saves lot of money and time. Reusability code

    helps in case of distributing class libraries. Reusability increases program reliability.


    +   (vii) Inheritance is similar to inheriting characteristics from our parents.'
