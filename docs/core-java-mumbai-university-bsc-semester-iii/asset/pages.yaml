  md: 'TextField(and its subclass TComponent) provides several methods that allow
    you to utilize a text field. To obtain the string currently contained in the text
    field, call getText( ). To set the text , call setText( ).


    These methods are as follows:


    +   1. String getText( )

    2. void setext(String str)


    Here, str is the new string.


    The user can select a portion of the text in a text field. Also, you can select
    a portion of text under program control by using select( ). A program can obtain
    the currently selected text by calling getSelected( ).


    These methods are shown here:


    +   1. String getSelected( )

    2. void select(int startIndex, int endIndex)


    getSelected( ) returns true if selected. The select( ) method selects the characters
    beginning at startIndex and endIndex-1.


    You can control the contents of a text field which may be modified by the user
    by calling setEditable( ). You can determine editability by calling isEditable().


    These methods are shown here:


    +   1. boolean isEditable( )

    2. void setEditable(booleanEdit)


    isEditable( ) returns true if the text may be changed and false if not. In setEditable(
    ), if canEdit is true, the text is true. If it is false, the text cannot be altered.


    There may be times when you want the user to enter text that is not displayed,
    such as a password. This method specifies a single character that the TextField
    will display when characters are entered (thus, the actual characters typed will
    not be shown). You can check a text field to see if it is in this mode with getEchoCharSet(
    ) method. You can retrieve the echo character by calling getEchoChar( ) method.


    These methods are as follows:


    +   1. void setEchoChar(char ch)

    2. boolean getEchoCharSet()

    3. char getEchoChar()


    Here, ch specifies the character to be echoed.


    # Handling a TextField


    Since text fields perform their own editing functions, your program generally
    will not respond to individual key events within a text field. However, you may
    want to respond when the user presses ENTER. When this occurs, an action event
    is generated.'
