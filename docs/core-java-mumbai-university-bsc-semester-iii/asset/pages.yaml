  md: '# OOPS 67


    Hence special method called the constructor which enables an object to initialize
    itself when it is created. This is known as automatic initialization of objects.
    It also provides another method called the destructor that destroys the objects
    when they are no longer required.


    # Constructors


    Definition: A constructor is a special method which enables object to initialize
    itself when it is created. It is invoked automatically having same name as of
    the name of the class.


    Constructor function has following special characteristics:


    +   1. Constructor is special method used to initialization of object.

    2. Constructor method has the same name as name of the class.

    3. Constructor method is automatically invoked when the object of its associated
    class is created.

    4. They should be declared in public section.

    5. They do not have return types, they cannot return any value. Hence they cannot
    have even void type.

    6. Like other methods the constructor also can have parameters the constructor
    function with parameters are called parametrised constructor.

    7. The Default constructor which is called to initialize the object is the non-parameterised
    default constructor.

    8. Like other functions, they can have default arguments because the constructors
    can be parametrised constructors.

    9. Constructors supports polymorphism. Constructor can be overloaded like method
    overloading. Hence one class can have more than one constructor with the different
    number of arguments.

    10. Constructor can be inherited in Java that means base class constructor can
    be inherited by using super Keyword.

    11. The constructor makes implicit calls to the two operations.

    (a) new

    (b) delete

    When memory allocation is required for the first time.

    The new operator is called when object is created and it is having memory allocation
    for the first time.

    Delete operator is called when object is not used and it is deallocated from memory.

    12. The constructor cannot be inherited further, though derived class cannot call
    the base constructor.

    13. Constructors cannot be virtual.

    14. When object is created the default (non-parameterised) constructor is invoked.
    If the object is without arguments empty constructor is called.

    If object is created with parameters, then parametrised constructor is called.

    15. It is called constructor because it construct the object and assign data members
    of the class by initializing some value.'
