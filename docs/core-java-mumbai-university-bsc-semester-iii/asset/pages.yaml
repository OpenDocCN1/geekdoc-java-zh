    # 13.7 Layouts


    # Layout Managers


    All of the components that we have shown so far have been positioned by the default
    layout manager. A layout manager automatically arranges your controls within a
    window by using some type of algorithm.


    Each Container object has a layout manager associated with it. A layout manager
    is an instance of any class that implements the LayoutManager interface. The layout
    manager is set by the setLayout() method. If no call to setLayout() is made, then
    the default layout manager is used. Whenever a container is resized (or sized
    for the first time), the layout manager is used to position each of the components
    within it.


    The setLayout( ) method has the following general format:


    ```

    void setLayout(LayoutManagerObj)

    ```


    layoutObj is a reference to the desired layout manager. If you wish to disable
    the layout manager and position components manually, pass null for layoutObj.
    If you do this, you will need to determine the shape and position of each component
    manually, using the setBounds() method defined by Component. Normally, you will
    want to use a layout manager.


    Each layout manager keeps track of a list of components that are stored by their
    names. The layout manager is notified each time you add a component to a container.


    Whenever the container needs to be resized, the layout manager is consulted via
    its minimumSize() and preferredLayoutSize() methods.


    Each component that is being managed by a layout manager contains the getPreferredSize()
    and getMinimumSize() methods.


    These methods return the preferred and minimum size required to display each component.
    The layout manager will honor these requests if at all possible, maintaining the
    integrity of the layout policy. You may override these methods for controls that
    subclass. Default values are provided otherwise.'
