    \ a string with values inserted using curly braces\n```\n\n```\ndef square(x):\n\
    \    return x**2\n\nmy_list = [1, 2, 3, 4]\nsquared_list = map(square, my_list)\n\
    # creates a new list with squares of the original values\n```\n\n# REGULAR EXPRESSIONS\n\
    \n# FILTER\n\nRegular expressions, also known as regex or regexp, are a sequence\
    \ of characters that define a search pattern. They are powerful tools used to\
    \ perform text manipulation and data extraction in programming languages such\
    \ as Python. In Python, the re module provides support for regular expressions.\n\
    \nApplies a function to every element in a sequence and returns a new sequence\
    \ with only the elements that pass a certain test.\n\n```\ndef is_even(x):\n \
    \   return x % 2 == 0\n\nmy_list = [1, 2, 3, 4]\neven_list = filter(is_even, my_list)\n\
    # creates a new list with the even values from the original list\n```\n\n# FUNCTIONS\n\
    \n+   - re.search(pattern, string): Searches for the first occurrence of the pattern\
    \ in the string and returns a match object found. If not found, returns None.\n\
    - re.findall(pattern, string): Searches for all occurrences of the pattern in\
    \ the string and returns a list of all matches found.\n- re.sub(pattern, repl,\
    \ string): Searches for all occurrences of the pattern in the string and replaces\
    \ them with the repl string.\n\nApplies a function to pairs of elements in a sequence\
    \ and returns a single result.\n\nfrom functools import reduce\n\ndef my_function(x,\
    \ y):\n    return x + y\n\nmy_list = [1, 2, 3, 4]\nresult = reduce(my_function,\
    \ my_list)\n# adds up all the values in the list to get a single result\n\n# METACHARACTERERS\n\
    \n+   - (dot): Matches any character except a newline character.\n- (caret): Matches\
    \ the start of a string.\n- $ (dollar): Matches the end of a string.\n- (asterisk):\
    \ Matches zero or more occurrences of the preceding character.\n- + (plus): Matches\
    \ one or more occurrences of the preceding character.\n- ? (question mark): Matches\
    \ zero or one occurrence of the preceding character."
