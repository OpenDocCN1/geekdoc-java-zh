    \ the import statement. For example, to import the numpy library, you can use:\n\
    \n```python\nimport numpy\n```\n\nOr you can use an alias to the library name\
    \ for a shorter reference:\n\n```python\nimport numpy as np\n```\n\n# DATA TYPES\
    \ AND VARIABLES\n\nPython is a dynamically typed language. This means that the\
    \ data type of a variable is determined at runtime based on the value that is\
    \ assigned to it. In other words, you don't need to specify the data type of variable\
    \ when you declare it, and you can assign values of different data types to the\
    \ same variable.\n\n```python\nx = 5          # x is an integer\nx = \"hello\"\
    \ # x is now a string\nx = 3.14 # x is now a float\n```\n\n- Integers: whole numbers\
    \ without decimal points. e.g. 1, 2, 3, 4, 5\n- Floats: numbers with decimal points.\
    \ e.g. 3.14, 4, 5, 6, 0\n- Strings: sequences of characters. e.g. \"hello\", 'world'\n\
    - Booleans: Containers for storing values. e.g. x = 10, y = \"hello\"\n\n# STRINGS\n\
    \nStrings are sequences of characters enclosed in single quotes ' or double quotes\
    \ \" \". They are one of the fundamental data types in Python and are used to\
    \ represent text and other types of data that can be represented as a sequence\
    \ of characters.\n\nHere are some basic operations that can be performed on strings:\n\
    \n```python\n# Creating a string\nmy_string = \"hello world\"\n\n# Getting the\
    \ length of a string\nlen = len(my_string) # Output: 11\n\n# Accessing individual\
    \ characters\nfirst_char = my_string[0] # Output: \"h\"\nlast_char = my_string[-1]\
    \ # Output: \"d\"\n\n# Slicing a string\nsubstring = my_string[0:5] # Output:\
    \ \"hello\",\n\n# Concatenating strings\nnew_string = my_string + \"!\" # Output:\
    \ \"hello world!\",\n\n# Repeating a string\nrepeat_string = my_string * 3 # Output:\
    \ \"hello world hello world hello world\"\n```\n\nStrings in Python are immutable,\
    \ which means that when you create a string, you cannot change its content. However,\
    \ you can create a new string that contains the modified content.\n\nString formatting\
    \ is another important feature in Python, which allows you to insert values into\
    \ a specific format.\n\n```python\nname = \"Alice\"\nage = 30\ngreeting = \"My\
    \ name is {} and I am {} years old.\".format(name, age)\nprint(greeting) # Output:\
    \ My name is Alice and I am 30 years old\n```\n\n# OPERATORS\n\n- Arithmetic operations:\
    \ +, -, /, (modulus), % (exponentiation)\n- Comparison operators: == (equals),\
    \ != (not equals), >, <=, >=, !=\n- Logical operators: and, or, not\n\n# SEQUENCE\
    \ UNPACKING\n\nSequence unpacking is a feature in Python that allows you to assign\
    \ the elements of a sequence (such as a tuple or list) to individual variables.\
    \ It provides a convenient way to assign multiple values in a single statement.\n\
    \n```python\nmy_tuple = (1, 2, 3)\na, b, c = my_tuple\nprint(a) # Output: 1\n\
    print(b) # Output: 2\nprint(c) # Output: 3\n```\n\nIn this example, we define\
    \ a tuple called my_tuple that contains three elements. We then use sequence unpacking\
    \ to assign each element to a separate variable a, b, and c.\n\nSequence unpacking\
    \ also works with lists:\n\n```python\nmy_list = [4, 5, 6]\nx, y, z = my_list\n\
    print(x) # Output: 4\nprint(y) # Output: 5\nprint(z) # Output: 6\n```\n\nYou can\
    \ also use sequence unpacking to swap the values of two variables without using\
    \ a temporary variable:\n\n```python\na = 1\nb = 2\na, b = b, a\nprint(a) # Output:\
    \ 2\nprint(b) # Output: 1\n```\n\n# CONDITIONAL STATEMENTS\n\n## IF STATEMENT\n\
    \nExecutes a block of code if a condition is true.\n\n```python\nif condition:\n\
    \    # code to execute if condition is true\n    true\n```\n\n## IF-ELSE STATEMENT\n\
    \nExecutes a block of code if a condition is true, and another block if it's false.\n\
    \n```python\nif condition:\n    # code to execute if condition is true\n    true\n\
    else:\n    # code to execute if condition is false\n    false\n```\n\n## ELIF-EL-ELSE\
    \ STATEMENT\n\nExecutes a block of code based on multiple conditions.\n\n```python\n\
    if condition1:\n    # code to execute if condition1\n    true\nelif condition2:\n\
    \    # code to execute if condition2\n    true\nelse:\n    # code to execute if\
    \ all conditions are false\n    false\n```\n\n# LOOPS\n\n## FOR LOOP\n\nIterates\
    \ over a sequence of values.\n\n```python\nfor value in sequence:\n    # code\
    \ to execute for each value\nin sequence\n```\n\n## WHILE LOOP\n\nExecutes a block\
    \ of code as long as a condition is true.\n\n```python\nwhile condition:\n   \
    \ # code to execute\ncondition is true\n```\n\n# FUNCTIONS\n\n## FUNCTION DEFINITION\n\
    \nBlocks of code that perform a specific task. A function in Python is defined\
    \ using the def keyword followed by the name and a set of parentheses. Any input\
    \ parameters or arguments should be placed inside the parentheses. The function\
    \ body should be indented and can contain one or more statements. The return statement\
    \ is used to return a value from the calling code.\n\n```python\ndef function_name(parameters):\n\
    \    # function body\n    return value\n```\n\n## FUNCTION CALL\n\n```python\n\
    result = function_name(argument1, argument2, ...)\n```\n\n## OPTIONAL ARGUMENTS\n\
    \n```python\nresult = def function_name(parameter1, parameter2=default_value,\
    \ ...):\n    # function body\n    return value\n```\n\n## VARIABLE-LENGTH ARGUMENTS\n\
    \n```python\ndef function_name(*args):\n    # function body\n    return value\n\
    ```\n\n## KEYWORD ARGUMENTS\n\n```python\ndef function_name(parameter1, parameter2,\
    \ ..., keyword1=value1, keyword2=value2, ...):\n    # function body\n    return\
    \ value\n```\n\n## DEFAULT ARGUMENT VALUES\n\n```python\ndef function_name(parameter1,\
    \ parameter2=default_value):\n    # function body\n    return value\n```\n\n##\
    \ ANONYMOUS FUNCTIONS (LAMBDA FUNCTIONS)\n\n```python\nlambda arguments: expression\n\
    ```\n\n## VARIABLE SCOPE\n\n```python\n# Global variable\nvariable_name = value\n\
    def function_name():\n    # Local variable\n    variable_name = value\n```\n\n\
    # LISTS\n\nOrdered collections of items.\n\n```python\nmy_list = [item1, item2,\
    \ item3]\n```\n\n# LIST METHODS\n\n```python\nmy_list.append(item) # adds an item\
    \ to the end of the list\nmy_list.insert(index, item) # inserts an item at a specific\
    \ index\nmy_list.pop() # removes and returns\n```\n"
