    \    return x**2\n\nmy_list = [1, 2, 3, 4]\nsquared_list = map(square, my_list)\n\
    # 创建一个包含原始值平方值的新列表\n```\n\n# 正则表达式\n\n# FILTER\n\n正则表达式（也称为 regex 或 regexp）是一系列定义搜索模式的字符序列。它们是\
    \ Python 等编程语言中用于文本处理和数据提取的强大工具。在 Python 中，`re` 模块提供了对正则表达式的支持。\n\n将函数应用于序列中的每个元素，并返回一个仅包含通过特定测试元素的新序列。\n\
    \n```python\ndef is_even(x):\n    return x % 2 == 0\n\nmy_list = [1, 2, 3, 4]\n\
    even_list = filter(is_even, my_list)\n# 创建一个包含原始列表中偶数值的新列表\n```\n\n# FUNCTIONS\n\
    \n- re.search(pattern, string): 在字符串中搜索模式的首次出现，并返回找到的匹配对象。如果没有找到，返回 None。\n- re.findall(pattern,\
    \ string): 在字符串中搜索模式的所有出现，并返回包含所有找到匹配项的列表。\n- re.sub(pattern, repl, string): 在字符串中搜索模式的所有出现，并将其替换为\
    \ repl 字符串。\n\n将函数应用于序列中的元素对，并返回单个结果。\n\n```python\nfrom functools import reduce\n\
    \ndef my_function(x, y):\n    return x + y\n\nmy_list = [1, 2, 3, 4]\nresult =\
    \ reduce(my_function, my_list)\n# 相加列表中的所有值以得到单个结果\n```\n\n# 元字符\n\n- . (点): 匹配除换行符以外的任何字符。\n\
    - ^ (脱帽): 匹配字符串的开头。\n- $ (美元符号): 匹配字符串的结尾。\n- * (星号): 匹配前一个字符零次或多次。\n- + (加号):\
    \ 匹配前一个字符的一次或多次。\n- ? (问号): 匹配前一个字符的零次或一次。\n\n# Java Code Geeks 快速查表\n\n# 12\n\
    \n# 核心 Python\n\n- [] (方括号): 匹配括号内的任意一个字符。\n- | (管道符): 匹配管道符之前或之后的表达式。\n\n```python\n\
    import re\n\n# 在字符串中搜索模式\ntext = \"The quick brown fox jumps over the lazy dog\"\
    \nmatch = re.search(r\"brown\", text)\nif match:\n    print(\"Match found!\")\n\
    \n# 在字符串中查找模式的所有出现项\ntext = \"The quick brown fox jumps over the lazy dog\"\n\
    matches = re.findall(r\"the\", text, re.IGNORECASE)\nprint(matches)\n\n# 替换字符串中模式的所有出现项\n\
    text = \"The quick brown fox jumps over the lazy dog\"\nnew_text = re.sub(r\"\
    the\", \"that\", text, flags=re.IGNORECASE)\nprint(new_text)\n```\n\nJCG 每月向 70\
