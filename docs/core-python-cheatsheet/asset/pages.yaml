    # SEQUENCE UNPACKING


    Sequence unpacking is a feature in Python that allows you to assign the elements
    of a sequence (such as a tuple or list) to individual variables. It provides a
    convenient way to assign multiple values in a single statement.


    ```

    my_tuple = (1, 2, 3)

    a, b, c = my_tuple

    print(a) # Output: 1

    print(b) # Output: 2

    print(c) # Output: 3

    ```


    In this example, we define a tuple called my_tuple that contains three elements.
    We then use sequence unpacking to assign each element to a separate variable a,
    b, and c.


    Sequence unpacking also works with lists:


    ```

    my_list = [4, 5, 6]

    x, y, z = my_list

    print(x) # Output: 4

    print(y) # Output: 5

    print(z) # Output: 6

    ```


    You can also use sequence unpacking to swap the values of two variables without
    using a temporary variable:


    ```

    a = 1

    b = 2

    a, b = b, a

    print(a) # Output: 2

    print(b) # Output: 1

    ```


