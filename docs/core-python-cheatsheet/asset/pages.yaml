  md: "# Java Code Geeks CHEATSHEETS\n\n# 12\n\n# CORE PYTHON\n\n+   - [] (square\
    \ brackets): Matches any one of the characters enclosed in the brackets.\n- |\
    \ (pipe): Matches either the expression before or after the pipe.\n\n```\nimport\
    \ re\n\n# Search for a pattern in a string\ntext = \"The quick brown fox jumps\
    \ over the lazy dog\"\nmatch = re.search(r\"brown\", text)\nif match:\n    print(\"\
    Match found!\")\n\n# Find all occurrences of a pattern in a string\ntext = \"\
    The quick brown fox jumps over the lazy dog\"\nmatches = re.findall(r\"the\",\
    \ text, re.IGNORECASE)\nprint(matches)\n\n# Replace all occurrences of a pattern\
    \ in a string\ntext = \"The quick brown fox jumps over the lazy dog\"\nnew_text\
    \ = re.sub(r\"the\", \"that\", text, flags=re.IGNORECASE)\nprint(new_text)\n```\n\
