    \ interpreter and are not executed as code.\n\n# Docstrings\n\nDocstrings, on\
    \ the other hand, are used to document functions, classes, and modules. They are\
    \ enclosed in triple quotes \"\"\"\", and should describe what the function does,\
    \ arguments it takes, and what it returns:\n\n```\ndef add_numbers(a, b):\n  \
    \  \"\"\"\n    This function adds two numbers and\n    returns the result.\n \
    \   Parameters:\n    a (int): The first number to\n    b (int): The second number\
    \ to\n    add.\n    Returns:\n    int: The sum of a and b.\n    \"\"\"\n    return\
    \ a + b\n```\n\nIn this example, we define a function called add_numbers and provide\
    \ a docstring that describes what the function does, arguments it takes, and what\
    \ it returns. The docstring should be placed immediately after the function definition."
