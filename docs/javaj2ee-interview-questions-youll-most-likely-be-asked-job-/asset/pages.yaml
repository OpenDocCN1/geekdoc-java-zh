    # 125: Explain the difference between Session bean and the Entity bean


    Answer:


    A Java class that implements the Enterprise Bean interface is an Entity Bean.
    These are generally used to contain the data entities. There are two types of
    Entity beans – CMP or Container Managed Persistence and BMP or Bean Managed Persistence.
    The Session bean can be Stateful or Stateless. The session is established first
    between the client and the servlet. A Stateful session is one maintains a state
    between the various method invocations between a client and a server. The Stateless
    session does not maintain a state between method invocations. The session beans
    are used to invoke the business methods and logics while the Entity beans are
    the database objects that actually contain the data. The Entity beans are persistent
    while the Session beans are transient.


