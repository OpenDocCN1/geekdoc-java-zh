    # 127: Expand and explain ACID.


    Answer:


    ACID is the acronym for Atomic, Consistent, Isolation and Durable and is the basic
    qualifier of EJB transactions.


    +   a) Atomic – implies that the transaction must either execute all or nothing.

    b) Consistent – all transactions must be consistent and the developer has to ensure
    the consistency in transaction level and application level.

    c) Isolation – a transaction must be allowed to run on its own without any interference
    from other processes or transactions

    d Durable – requires that all data that belong to a transaction are written permanently
    in a storage system before the transaction is completed. This will ensure that
    no data is lost.'
