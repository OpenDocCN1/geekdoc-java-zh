    # 4: Differentiate between SAX and DOM Parsers


    Answer:


    Both SAX and DOM parsers are used to parse XML documents. The major differences
    between SAX and DOM parsers are:


    +   a) SAX means Simple API for XML and DOM means Document Object Model.

    b) The SAX parser parses the document one node at a time whereas the DOM parser
    loads the entire document into the memory first and then processes the node.

    c) Since the SAX parses on the go, it does not use the memory whereas the DOM
    uses the memory to store the entire XML document.

    d) We cannot modify the XML tree, cannot add or delete nodes in SAX while using
    DOM we can.'
