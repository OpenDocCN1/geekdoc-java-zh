  md: '# Chapter 1


    # Architectures and Protocols


    1: What is the difference between a Web Server and an Application Server?


    Answer:


    A Web Server works over the Internet. It uses the HTTP protocol to send the client
    requests over the Internet on to the server which is located elsewhere and retrieves
    the information requested from the server or posts the information sent on the
    server. ASP, JSP, Servlets, server side Javascript and CGI scripts work for the
    Web Server. The Web server simply acts as the middle layer passing on the requests
    or retrieving the requests and provides the HTML page results. It does not involve
    in any processing or data handling. An Application server provides the business
    logic to the client using the HTTP or other protocols. The Application server
    can be a GUI which'
  merge: -1
