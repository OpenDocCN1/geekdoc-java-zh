    ## 175: What are the benefits of EJB framework as architecture?


    Answer:


    The following are the benefits of EJB framework as architecture:


    - a) The EJB architecture is distributed, scalable, portable, transactional, multi-tiered,
    and secure

    - b) The server for EJB automatically manages services such as threading, lifecycle,
    transaction, and persistence for the enterprise bean component

    - c) The enterprise bean components are platform independent i.e. they can be
    executed on any operating system

    - d) The EJB components contain only business logic, thereby developers are given
    freedom to maintain system level code


    ## 176: Explain the lifecycle of session bean.


    Answer:


    The lifecycle of a session bean can be stated as below:


    - a) Using JNDI (Java Naming Directory Interface) services, the client locates
    the home object of the bean

    - b) The home reference is used to create EJBObject which creates the instance
    of the bean class

    - c) The bean class called the session bean is allocated a session context

    - d) The home reference is used to invoke methods on the EJB Object which pass
    the method calls to the session bean

    - e) The session bean then returns result to the EJB Object which returns the
    same to the remote interface


    ## 177: What information does the abstract persistence schema contain?


    Answer:


    The abstract persistence schema contains the following information:


    - a) For managing each entity, it has ej-name field whose value must be unique

    - b) For specifying queries, the abstract-schema-name is used for each entity
    bean whose value must be unique

    - c) The relationship of ejb can be specified using ejb-relation field

    - d) To specify the relationship role, we have to use the ejb-relationship-role
    field


    ## 178: What are the types of EJB clients?


    Answer:


    There are two types of Enterprise Java Bean clients. They are:


    - a) **Home client:** The home client always exists inside the enterprise java
    bean container.

    - b) **Remote client:** The remote client always exists outside the enterprise
    java bean container


    The enterprise bean object can be accessed by multiple clients from the enterprise
    java bean container through a transaction manager.


    ## Chapter 6


    ## Internationalization and Localization


    ## 179: What is Globalization or G11N?


    Answer:


    Globalization is the methods adopted to make a software product created for a
    local market ready for a global market. There are many aspects to be considered
    while making a local product ready for a global market and globalization takes
    care of those aspects. The focus is on marketing the complete enterprise solution
    and management support aiming at a global market. The legal and economical factors
    are given importance here. The terminology, graphics, illustrations, symbol used,
    colors, character sets, fonts, typography, format, language and style are all
    to be considered while the global market.


    ## 180: What is internationalization?


    Answer:


    Internationalization is the process of making or preparing the code to support
    multiple languages. Internationalization involves both application that presents
    output data to the client and data that can be converted to the appropriate language
    and character set. So, internationalization allows an application to adapt to
    a new language and region.


    ## 181: What is localization?


    Answer:


    Localization is adapting to internationalized application which supports a specific
    language or locale. Localization involves translating the data into a specific
    language and maintains it in a file so that the application can access it. The
    file can be a property file. So, localization provides adaption of an internationalized
    application to a specific country or region.


    ## 182: What is a locale?


    Answer:


    Locale is an environment that includes locale-specific and regional information.
    During localization, the internationalized application is adapted to a specific
    locale. Each country has its own locale. For example, the US have a locale en_US
    and Italy has a locale it_IT and so on. Here, it represents ‘language’ and IT.
    Here ‘it’ represents language Italian and ‘IT’ represents ‘Regional variation’
    i.e. name of the country, Italy.


    ## 183: What are the characteristics of internationalized application?


    Answer:


    The following are the characteristics of internationalized application:


    - a) The application will have an .ear file (Enterprise Archive file) which can
    be executed worldwide

    - b) The Graphical User Interface labels and messages are not hard-coded within
    the program but stored outside and retrieved dynamically

    - c) Dates and currencies appear in end users’ region and language

    - d) To support a new language, re-compilation is not required by the application


    ## 184: What are the elements through which a locale is identified?


    Answer:


    - A locale is identified by the following three elements:

    a) Language: It is the basic identifier for a locale. It contains a valid ISO
    639, a 2 letter language code. Each country has one or more language and the language
    is identified by a two letter word. For example, ''en'' for English and ''fr''
    for French

    - b) Regional Variation: It is the identifier for a country. It contains a valid
    ISO 3166, a 2 letter country code. For example, FR for France and US for United
    States of America

    - c) Variant: It is the identifier for a country. It contains... For example,
    WIN represents Windows and MAC represents Macintosh


    ## 185: Is it possible to use java.util for localization?


    Answer:


    We can use java.util.Properties for localization. This class represents characters
    and is saved as a stream. For example:


    ```java

    Properties appProp = new Properties();

    String strProp = "usr/MyProp.txt";

    appProp.load(new BufferedInputStream(new FileInputStream(strProp)));

    String serviceValue = appProp.getProperty("serviceKey");

    ```


    The properties class represents the locale.


    ## 186: Explain ResourceBundle.


    Answer:


    ResourceBundle is a class which belongs to java.util. It defines a naming convention
    for locales and it should be used for organizing resources by locale. Resource
    Bundle has locale specific objects and it can load end users.


    ## 187: What are the features of ResourceBundle?


    Answer:


    ResourceBundle has the following features:


    - a) The content can be localized i.e. the content can be translated into different
    languages

    - b) Make the application handle multiple locales

    - c) The application can be modified to support additional locales


    ## 188: Explain Character Sets.


    Answer:


    Character Set is a group of graphical or textual symbols which is mapped to positive
    integers called code points. The American Standard Code for Information Interchange
    (ASCII) character set is used to represent American English. It has lowercase
    and uppercase alphabets, numerals, punctuation, and symbols. For example, the
    ASCII code for B is 66. ASCII was good only for American English. So, in order
    to support other languages, ISO 8859 character set was created.


    ## 189: Explain Unicode.


    Answer:


    Unicode defines a universal and standard (ISO 10646) character set. It represents
    all the character sets that are used around the world and it can be extended.
    So, Unicode is a replacement for ISO 8859 character set. Java uses Unicode 2.x
    for encoding characters. Every character for Unicode uses 2 bytes. Java represents
    String objects and characters as encoded Unicode. So, programs written in java
    languages can process data in multiple languages.


    ## 190: Explain UTF.


    Answer:


    UTF represents Unicode Transformation Format. It is an encoding (multi-byte) format
    that stores characters in 1 to 3 bytes. Here U also represents Universal Character
    Set (UCS). UTF is compact and more efficient than Unicode and it is the widely
    used encoding scheme. Java recommends UTF-8 as it is compatible with the existing
    web content and also provides access to Unicode character set. UTF-8 denotes 8-bit
    form of UTF.


