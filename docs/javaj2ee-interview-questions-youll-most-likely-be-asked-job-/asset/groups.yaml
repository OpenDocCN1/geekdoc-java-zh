    # 59: Do you build relationships quickly with people, or take more time to get
    to know them?


    Answer:


    Either of these options can display good qualities, so determine which style is
    more applicable to you. Emphasize the steps you take in relationship-building
    over the particular style, and summarize briefly why this works best for you.


    # 60: Describe a time when you had to work through office politics to solve a
    problem.


    Answer:


    Try to focus on the positives in this question, so that you can use the situation
    to your advantage. Don''t portray your previous employer negatively, and instead
    use a minimal instance (such as paperwork or a single individual), to highlight
    how you worked through a specific instance resourcefully. Give examples of communication
    skills or problem-solving you used in order to achieve a resolution.


    # 61: Tell me about a time when you persuaded others to take on a difficult task?


    Answer:


    This question is an opportunity to highlight both your leadership and communication
    skills. While the specific situation is important to offer as background, focus
    on how you were able to persuade the others, and what tactics worked the best.'
  - '[PAGE 178]


    # 62: Tell me about a time when you successfully persuaded a group to accept your
    proposal.


    Answer:


    This question is designed to determine your resourcefulness and your communication
    skills. Explain the ways in which you took into account different perspectives
    within the group, and created a presentation that would be appealing and convincing
    to all members. Additionally, you can pump up the proposal itself by offering
    details about it that show how well-executed it was.


    # 63: Tell me about a time when you had a problem with another person, that, in
    hindsight, you wished you had handled differently.


    Answer:


    The key to this question is to show your capabilities of reflection and your learning
    process. Explain the situation, how you handled it at the time, what the outcome
    of the situation was, and finally, how you would handle it now. Most importantly,
    tell the interviewer why you would handle it differently now did your previous
    solution create stress on the relationship with the other person, or do you wish
    that you had stood up more for what you wanted? While you shouldn''t elaborate
    on how poorly you handled the situation before, the most important thing is to
    show that you''ve grown and reached a deeper level of understanding as a result
    of the conflict.'
