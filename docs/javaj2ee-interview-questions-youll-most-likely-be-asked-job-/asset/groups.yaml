    \ interface of the enterprise bean is returned.\ngetEJBLocalHome(): The local\
    \ interface of the enterprise bean is returned.\ngetCallerPrincipal(): This method\
    \ identifies which bean instance.\n\n## 169: Explain getRollBack, setRollBack,\
    \ and getUserTransaction.\n\nAnswer:\n\ngetRollBack(): Using this method, we can\
    \ identify whether the existing transaction for a bean instance has been set as\
    \ rollback.\nsetRollBack(): Using this method, we can set the bean instance of\
    \ particular transaction outcome.\ngetUserTransaction(): This method should not\
    \ be called by the entity bean as returns javax.transaction.UserTransaction.\n\
    \n## 170: Explain Transaction.\n\nAnswer:\n\nTransaction is a task that executes\
    \ a single unit of work or atomic operation. If the task is not performed successfully,\
    \ the transaction will be reverted or rolled back. Transactions are often referred\
    \ to as ACID. ACID refers to Atomicity, Consistency, Isolation, and Durability.\n\
    \n## 171: What are the transaction attributes available for container managed\
    \ transaction?\n\nAnswer:\n\nThe following are container managed transaction:\n\
    \n- a) Required: In this, the container starts a new transaction if the transaction\
    \ does not exist\n- b) RequiresNew: In this, the container creates new transaction\
    \ for method call\n- c) Supports: In this, the bean can execute without transaction\n\
    - d) Unsupported: In this, the bean cannot be invoked with transaction\n- e) Never:\
    \ In this, the bean will never execute a transaction\n- f) Mandatory: In this,\
    \ each method call requires a transaction context\n\n## 172: How does container\
