    Answer:


    The following patterns belong to Integration Tier:


    +   a) DAO: The Data Access Object retrieves data sources and delivers transparent
    data access


    +   b) Service Activator: This is utilized for EJB components and supports asynchronous
    processing


    # 50: Explain Presentation Tier patterns.


    Answer:


    The following are the Presentation Tier patterns:


    +   a) Front Controller: This is used for handling and managing the request from
    client


    +   b) Decorating Filter: This is used for preprocessing and'
