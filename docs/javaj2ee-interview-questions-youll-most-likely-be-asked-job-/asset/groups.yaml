    ## 46: 解释 J2EE 框架中模式的重要性。


    答案：


    模式是指在特定语境下解决问题的反复出现的解决方案。语境是指问题存在的情况或环境。问题是需要调查且必须解决的事物，并通过因果关系指定。


    ## 47: 解释框架模式（Framework patterns）。


    答案：


    以下被称为框架模式：


    -   a) 代理模式 (Proxy pattern)：EJB 远程接口是代理模式的一个示例。它拥有的方法可以将方法调用委托给对象

    -   b) 工厂方法 (Factory Method)：EJB Home 接口是工厂方法的一个示例。它包含一个独立的可重用类，通过通用接口引用对象

    -   c) 抽象工厂方法 (Abstract Factory Method)：EJB home 接口是抽象工厂方法的一个示例。它有一个从具体子类创建抽象类实例的程序

    -   d) 装饰器 (Decorator)：EJDataObject 是装饰器模式的一个示例。装饰器的功能是它对客户端是可见的


    ## 48: 部署器（deployer）的活动有哪些？


    答案：


    部署器执行以下活动：


    -   a) 将开发阶段创建的企业归文件 (EAR) 划分到 J2EE 应用服务器中

    -   b) 修改部署描述并配置 J2EE 应用程序

    -   c) 确保企业归文件 (EAR) 格式正确并符合 J2EE 规范

    -   d) 在 J2EE 应用服务器中安装或部署企业归文件 (EAR)


    ## 49: 属于集成层（Integration Tier）的模式有哪些？


    答案：


    以下模式属于集成层：


    -   a) DAO：数据访问对象检索数据源并提供透明的数据访问

    -   b) 服务激活器 (Service Activator)：这用于 EJB 组件并支持异步处理


    ## 50: 解释表现层（Presentation Tier）模式。


    答案：


    以下是表现层模式：


    -   a) 前端控制器 (Front Controller)：用于处理和管理来自客户端的请求

    -   b) 装饰器过滤器 (Decorating Filter)：用于对特定请求进行预处理和后处理

    -   c) 组合视图 (Composite View)：用于从多个组件创建一个视图

    -   d) 分发视图 (Dispatch View)：与前端控制器配合使用，用于视图助手模式并推迟视图处理的活动

    -   e) 视图助手 (View Helper)：用于封装逻辑和格式化显示


    ## 51: 解释业务层（Business Tier）模式。


    答案：


    以下是业务层模式：


    -   a) 会话门面 (Session Facade)：隐藏业务对象的复杂性并集中处理工作流

    -   b) 值对象 (Value Object)：用于在不同层之间交换数据

    -   c) 服务定位器 (Service Locator)：用于隐藏业务服务的创建复杂查找。它还定位服务工厂

    -   d) 业务委托 (Business delegate)：分离服务层和表现层，并为服务提供代理和外面接口

    -   e) 值对象装配器 (Value Object Assembler)：用于从数据源构建对象


    ## 52: 解释 EIS。


    答案：


    EIS 代表企业信息系统（Enterprise Information System）。它存在于集成层并为企业提供基础设施相关信息。


    访问 EIS 非常复杂，需要以下知识：


    -   a) 与事务相关的信息

    -   b) 与安全相关的信息，以及

    -   c) 应用程序编程模型知识


    ## 53: EIS 和应用服务器的系统级合约是什么？


    答案：


    以下是 EIS 和 J2EE 应用服务器的系统级合约：


    -   a) “连接管理”（Connection Management）合约允许应用程序和 J2EE 组件连接到 EIS。这导致了可扩展的环境并支持许多客户端访问
    EIS

    -   b) “事务管理”（Transaction Management）合约支持对 EIS 的事务相关访问。它使用事务管理器来管理事务

    -   c) “安全”（Security）合约允许获得 EIS 的安全访问。这减少了对 EIS 的威胁并保护了信息


    ## 54: 解释资源适配器（Resource Adapter）。


    答案：


    资源适配器是企业信息系统（EIS）的系统级合约。它被应用程序客户端或服务器连接 EIS。


    它与应用服务器协作以支持安全、事务和连接池。它用于应用程序服务器的地址空间内。


