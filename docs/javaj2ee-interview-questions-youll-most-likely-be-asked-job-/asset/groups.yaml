    that high priority message executes first than the low priority message


    - c) JMSDeliveryMode: This header is used to define the JMS delivery as Persistent
    or Non-persistent


    - d) JMSRedelivered: This is used to inform client that he or she received the
    message earlier


    - e) JMSExpiration: This is used to set the message expiration in milliseconds


    ## 246: What are the body formats of JMS?


    Answer:


    The following are the body formats of JMS:


    - a) TextMessage: This is formatted as String and it used to exchange XML data


    - b) ByteMessage: This is used to match legacy messages


    - c) ObjectMessage: This denotes collection of objects or serializable object


    - d) MapMessage: It is similar to a HashMap which has key value pair


    - e) StreamMessage: This denotes the stream of primitive values that are used
    to read sequentially


    ## 247: What are the types of administered objects in JMS?


    Answer:


    In JMS, there are two types of administered objects. They are:


    - a) Destination: It contains information that are related to configuration which
    are supplied by JMS provider. Destination uses queue for PTP and Topic for pub/sub


    - b) ConnectionFactory: It provides the physical connection to the Java Messaging
    Service through JNDI lookup. It contains IP address and enables JMS to create
    a connection


    ## 248: What are the objects used to receive and create messages in JMS?


    Answer:


    The following objects are used to receive and create messages in JMS:


    - a) MessageConsumer: This is used to receive messages which are sent to a destination

    - b) MessageProducer: This is used to create messages which are sent to a destination

    - c) MessageSelector: This is used to filter the message that does not meet the
    specified criteria

    - d) MessageListener: This is used to process and receive messages asynchronously


    ## 249: Explain Message Consumer.


    Answer:


    MessageConsumer is for receiving messages synchronously or asynchronously to a
    particular destination which is created by the session object.

    In case of synchronous communication, the consumer calls any one of the methods
    receive or receiveNoWait and, in the case of asynchronous communication, the client
    registers MessageListener and starts consumer.

    Almost all the messages in Java Messaging Service are exchanged asynchronously
    among clients where the producer never receives acknowledgement from the consumer.


    ## 250: Explain Message Producer.


    Answer:


    MessageProducer is for sending messages either via PTP through pub/sub. In PTP
    (Point-To-Point) model, the destination is known as queue and in pub/sub model,
    the destination is known as Topic.


    In producer, we can set the delivery mode either as NON-PERSISTENT or PERSISTENT
    using the setDeliveryMode method. Non-Persistent has less overhead as the messages
    are logged in the server or database.


    We can also use the setPriority method to set the message priority. 0 indicates
    low priority and 9 indicates high priority. We can also use setTimeToLive method
    to mention the life time of the message in milliseconds.


    ## 251: Explain Message Selector.


    Answer:


    MessageSelector belongs to String object which is used to filter the message that
    does not fit into the specified criteria. The message selector can examine the
    header and compares as expression which is present in the String. The example
    for expression comprises arithmetic operators, relational operators, string literals,
    and logical operators.


    ## 252: Explain Message Listener.


    Answer:


    To process messages asynchronously, we have to instantiate the MessageListener
    interface. We have to perform the following steps to process and receive messages
    asynchronously:


    - a) Create object which implements MessageListener interface and invoke the onMessage
    method

    - b) Use setMessageListener method to register with the session object

    - c) Use Connection object’s start method to start receiving messages


    ## 253: What are the classes, interfaces, and steps required for PTP communication?


    Answer:


    The following are the classes, interfaces, and steps required for Point-To-Point
    communication:


    - a) Using JNDI (Java Naming Directory Interface) lookup, obtain QueueConnectionFactory
    object. JNDI name varies based on the messaging vendor

    - b) Through QueueConnectionFactory object, obtain QueueConnection object. We
    have to provide username and password if security is enabled

    - c) Through QueueConnection, obtain QueueSession provider

    - d) Through JNDI lookup, obtain queue.

    - e) Through QueueSession create QueueReceiver or QueueSender for receiving and
    sending messages

    - f) Close QueueConnection which closes QueueReceiver, QueueSender, and QueueSession


    ## 254: What are the classes, interfaces, and steps required for Pub/Sub communication?


    Answer:


    The following are the classes, interfaces, and steps required for Pub/Sub communication:


    - a) Using JNDI (Java Naming Directory Interface) lookup, obtain QueueConnectionFactory
    object. JNDI name varies based on the messaging vendor

    - b) Through QueueConnectionFactory object, obtain QueueConnection object. We
    have to provide username and password if security is enabled

    - c) Through QueueConnection, obtain QueueSession provider

    - d) Through JNDI lookup, obtain queue.

    - e) Through QueueSession create QueueReceiver or QueueSender for receiving and
    sending messages

    - f) Close QueueConnection which closes QueueReceiver, QueueSender, and QueueSession


    ## 255: Explain MDB.


    Answer:


    MDB refers to Message Driven Bean. It is a component (stateless) invoked by the
    container (EJB) whenever the message arrives in the destination (queue or topic).


    MDB is a consumer which receives messages because it implements the interface
    javax.jms.MessageListener. Similar to a Java Messaging Service, the message driven
    bean also receives messages in the same manner.


    In case of MDB, the Enterprise Bean Container ensures that the bean is registered
    in the particular destination.


    ## 256: What are the various security threats to enterprise resources?


    Answer:


    - The following are the security threats to enterprise resources:

    a) Confidential Information Disclosure: Accidentally or intentionally making the
    information available to someone who has no legal rights Information Modification:
    Accidentally or intentionally modifying data

    - b) Compromise of Accountability: This is called as identity theft Misappropriation
    of Protected Resources This is called as service theft

    - c) Misappropriation that compromises availability: Data modification causes
    interruption to the enterprise system


    ## 257: Explain Authentication and Authorization.


    Answer:


    **Authentication** is the process of verifying the credentials of the user who
    got permission to enter into secured premises or websites. For example, only the
    registered users are authorized to login in to a website which provides mailing
    service. **Authorization** is the process of verifying the role of the user who
    got permission to visit or receive the requested resource. For example, the user
    cannot modify a document because he does not have the role or not authorized to
    modify a particular document.


    ## 258: Explain some of the security packages available in Java.


    Answer:


    The following are the security packages available in Java:


    - a) **java.security**: This contains the classes and interfaces for security,
    authentication, and authorization (access control)

    - b) **java.security.interfaces**: It contains the interfaces for encryption:
    Digital Signature Algorithm (DSA) and Rivest, Shamir, Adleman Asymmetric Cipher
    Algorithm (RSA)

    - c) **java.security.cer**: It contains the interfaces and classes

