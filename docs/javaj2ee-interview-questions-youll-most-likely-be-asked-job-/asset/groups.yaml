    # 277: What are the ways to configure security properties?


    Answer:


    The following are the ways to configure security properties:


    - a) **Principal mapping**: This is used when connecting or combining EIS in the
    server (application)

    - b) **Configured Identity**: In this, the resource adapter identity connections
    when connecting to EIS

    - c) **Credentials mapping**: In this, the credentials of server and EIS are mapped

    - d) **Caller Impersonation**: This principal used in EIS matches with the application
    server


    # 278: What are the sections of CCI API?


    Answer:


    CCI refers to Common Client Interface. CCI API has four sections as mentioned
    below:


    - a) **Connection Interface**: This creates connection to Enterprise Information
    System

    - b) **Interaction Interface**: commanding execution on EIS referred to as interaction
    interface

    - c) **ResultSet Interface**: this encapsulates query results to EIS

    - d) **Metadata Interface**: this allows to examine EIS metadata


    # 279: Explain ManagedConnectionFactory and ManagedConnection.


    # Answer:


    ManagedConnectionFactory is an interface which is implemented by the class UCManagedConnectionFactory
    (Entry point for the server to call adapter) which creates the UConnectionFactory
    and UCManagedConnection class. ManagedConnection is an interface which is implemented
    by the UCManagedConnection class. This class encapsulates adapters connection
    (physical) class UCConnection. Both ManagedConnectionFactory and ManagedConnection
    are used for implanting JCA (Java Connector Architecture) adapter.


    # 280: What are the drawbacks of DB integrity constraints?


    # Answer:


    The following are the drawbacks of DB (Data Base) integrity constraints:


    - a) Logic Duplication: The logic duplication is possible when the database integrity
    rules are changed which requires change in business logic code

    - b) DBMS constraints non-portability: Using procedural triggers often leads to
    non-portability as each vendor follows their own standards

    - c) Uncontrolled DB configuration: Since the constraints exist outside server
    (J2EE), configurations are performed with the DB vendor tools


    # HR Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    # 1: Tell me about a time when you didn''t meet a deadline.


    Answer:


    Ideally, this hasn''t happened – but if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long ago it happened, and be sure that
    you did as much as you could to ensure that the deadline was met. Additionally,
    be sure to include what you learned about managing time better or prioritizing
    tasks in order to meet all future deadlines.


    # 2: How do you eliminate distractions while working?


    Answer:


    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still able to
    focus on work, and that your productivity has not been affected, by an example
    showing a routine you employ in order to stay on task.


    # 3: Tell me about a time when you worked in a position with a weekly or monthly
    quota to meet. How often were you successful?


    Answer:


    Your numbers will speak for themselves, and you must answer this question honestly.
    If you were regularly met your quotas, be sure to highlight this in a confident
    manner and don''t be shy in pointing out your strengths in this area. If your
    statistics are less than stellar, try to point out trends in which they increased
    toward the end of your employment, and show reflection as to ways you can improve
    in the future.


    # 4: Tell me about a time when you met a tough deadline, and how you were able
    to complete it.


    Answer:


    Explain how you were able to prioritize tasks, or to delegate portions of an assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough – make sure it''s clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    # 5: How do you stay organized when you have multiple projects on your plate?


    Answer:


    The interviewer will be looking to see that you can manage your time and work
    well – and being able to handle multiple projects at once, and still giving each
    the attention it deserves, is a great mark of a worker’s competence and efficiency.
    Go through a typical process of these up to the goal-setting and prioritizing,
    and explain the steps of these to the interviewer, so he or she can see how well
    you manage time.


    # 6: How much time during your work day do you spend on “auto-pilot?”


    Answer:


    While you may wonder if the employer is looking to see how efficient you are with
    this question (for example, so good at your job that you don''t have to think
    about it), but in almost every case, the employer wants to see that you''re constantly
    thinking, analyzing, and processing what''s going on in the workplace. Even if
    things are running smoothly, there''s usually an opportunity somewhere to make
    things more efficient or to increase sales or productivity.


    # 7: How do you handle deadlines?


    Answer:


    The most important part of handling deadlines is to prioritize tasks and set goals
    for completion, and most importantly, remain calm. Explain how you manage your
    time under pressure.


    # 8: Tell me about your problem-solving process.


    Answer:


    Your problem-solving process should include outlining the problem, coming up with
    possible ways to fix the problem, and setting a clear plan. Keep your answer brief
    and organized, and explain the steps leading to resolution.


    # 9: What sort of things at work can make you stressed?


    Answer:


    As it''s best to stay away from negatives, keep this answer simple. While answering
    that nothing at work makes you stressed will not be very believable to the interviewer,
    focus on how you generally tackle stress, such as having status meetings.


    # 10: What do you look like when you are stressed about something? How do you
    solve it?


    Answer:


    This is a trick question – your interviewer wants to hear that you don''t look
    any different when you''re stressed, and that you don''t allow negative emotions
    to interfere with your productivity. As far as how you solve your stress, it''s
    best if you have a solution mastered, such as simply taking deep breaths and counting
    to 10 to bring yourself back to the task.


    # 11: Can you multi-task?


    Answer:


    Some people can, and some people can''t. The most important part of multi-ing
    is to keep a clear head at all times about what needs to be done, and what priority
    each task falls under. Explain how you evaluate tasks to determine priority, and
    how you manage your time in order to ensure all are completed efficiently.


    # 12: How many hours per week do you work?


    Answer:


    Many people get tricked by this question, thinking that answering more hours is
    better – however, this may cause an employer to wonder why you have to work so
    many hours in order to get the work done that other people can do in a shorter
    amount of time. Give a fair estimate of hours that it should take you to complete
    a job, and explain that you are also willing to work extra whenever needed.


    # 13: How many times per day do you check your email?


    Answer:


    While an employer wants to see that you are plugged into modern technology, it
    is also important that the number of times you check your email per day is relatively
    low – perhaps two to three times per day (dependent on the specific field you''re
    in). Checking email is often a great distraction in the workplace, and while it
    is important to remain connected, much correspondence can simply be handled together
    in the morning and afternoon.

