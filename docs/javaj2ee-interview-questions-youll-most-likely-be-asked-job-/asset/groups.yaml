    \ public void ejbPassivate() {}\n    public void ejbRemove() {}\n    public int\
    \ size() {\n        return iCount;\n    }\n}\n```\n\nIn the above code, when the\
    \ bean is created, the counter is assigned with the parameter value. As per the\
    \ specification, we have to implement all the methods ejbRemove, ejbActivate,\
    \ and ejbPassivate along with the business method ‘size’.\n\n## 166: What are\
