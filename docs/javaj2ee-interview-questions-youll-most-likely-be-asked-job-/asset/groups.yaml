    # Chapter 2


    # Applicability and Best Practices


    31: Explain the best practices to be followed for better performance.


    Answer:


    The following practices yield in better performance of J2EE applications:


    - a) Better Resource Management is key to better performance. You can achieve
    this by creating limited resources, pooling or caching the resources, and by releasing
    the memory immediately if a particular resource will no longer be used.

    - b) Minimize the Network Overheads with better design patterns of sessions, EJB,
    JNDI initial context etc.

    - c) Minimizing the Serialization Cost by passing by reference and declaring the
    references as transient.

    - d) Timeouts make sure that idle objects do not hold the memory for long

    - e) Applying only the required authorities to the JDBC objects and making sure
    they are released when not in use will release resources and memory

    - f) Change the database auto-commit to false

    - g) Use Virtual Proxy to make sure only the required fields are loaded into the
    memory as when required


    # 32: How do Struts, Spring, and Hibernate improve performance?


    Answer:


    Struts, Spring, and Hibernate together can help you create optimally designed
    web applications that are lighter and self-sufficient. Struts take care of the
    web application framework, Hibernate is an ORM network which forms the database
    layer and Spring is an Enterprise application framework. If you are building a
    new application, you can use Spring and Hibernate also since Spring can replace
    Struts. Spring works on the principles of Inversion of Control and Dependency
    Injection patterns that guide to better design patterns of J2EE. Struts have an
    MVC framework with JSP, Servlets, Java Beans, special tags, and messages. Hibernate
    is portable and is supports mapping of an object to a relational database. It
    works far better than JDBC is establishing database connections and maintaining
    transactions. Struts, Spring, and Hibernate when work together provides a better
    framework of proven design patterns and better connectivity.


    # 33: How does Garbage Collection help in better performance?


    Answer:


    Garbage collection frees the memory allocated to hold the objects and the data
    thereby releasing more memory space in the JVM where it can store new objects
    that are in use. This extra space can be utilized for memory swapping and processing
    and it is continuous. The JVM uses the stack and heap to clear the obsolete object
    references and de-allocates them when the program or the code block which has
    access to the object exits. It is a complicated process wherein the memory is
    swapped multiple times to ensure the data is available just in case it is referenced
    anywhere till the point JVM makes that it is no longer referenced.


