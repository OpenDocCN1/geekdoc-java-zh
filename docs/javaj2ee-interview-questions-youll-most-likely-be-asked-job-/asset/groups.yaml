    # 67: How to make a Servlet thread-safe?


    Answer:


    By default, Servlets are not thread-safe. So the developer has to

    explicitly make it thread-safe by adding code. This is required

    since the variables used in a Servlet are passed by reference

    and multiple threads are accessing the same

    simultaneously the value may be permanently changed. One

    way you can avoid this is by using a synchronization of a block

    of code or method which overwrites the value of such

    parameters. Another efficient method for making the Servlet

    thread-safe is to implement the SingleThreadModel class. In

    this case, the servlet engine creates a pool of servlet instances

    which releases only the available instance when the request is

    made. Though the response time may increase, it is a more'
