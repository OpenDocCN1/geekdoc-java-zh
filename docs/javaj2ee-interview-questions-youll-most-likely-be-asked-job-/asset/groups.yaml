    # 38: What are the requirements that a J2EE system must possess to operate in
    a global economy?


    Answer:


    The J2EE system must possess the following to operate globally:


    - a) Financial Considerations: The method of payment to buy an item should contain
    many forms as not all the visitors will have a credit card. Also, a government
    has its own taxes, custom restrictions and tariffs.

    - b) Language Requirements: The application should support multiple languages
    and it has to be specific.

    - c) Legal Differences: Customs laws and privacy requirements are different for
    each country and each government has restrictions on images, ideas, speeches.


    # 39: What are the best practices to be followed in DAO?


    Answer:


    DAO represents Data Access Object. The best practices to be followed in DAO are:


    - a) DAO should not coupled tightly to business logic

    - b) Each bean should be associated with DAO

    - c) DAO should be used only to access data

    - d) DAO should be written in such a way that allows cross schema

    - e) supports portability


    # 40: Explain Guideline.


    Answer:


    Guideline refers to rule or agreement on operations which are developed by professionally
    recognized organization. It also includes approved standards to be followed during
    the project to reduce network traffic.


    # 41: What are the best practices to be followed in VO?


    Answer:


    VO represents Value Object. The best practices to be followed in VO are:


    - a) VO should contain business objects with get and set methods

    - b) VO should update the model bean with the respective value

    - c) VO should not reference an object on the server

    - d) VO should represent a value from the server


    # 42: What are the best practices to be followed in session bean facade?


    Answer:


    - a) It should reduce remote call to the application server

    - b) Apply transactional scope to methods which calls entity bean

    - c) Simplify the client tier code so business logic gets executed only on the
    application server

    - d) Coding should be done in such a way that identifies user permissions and
    provide flexibility and reusability


    # 43: What are the benefits of Model View Controller (MVC)?


    Answer:


    The following are the benefits of MVC:


    - a) Separates data model from user interaction and data display and clarifies
    application design

    - b) Allows viewing data in many forms and by large number of users

    - c) Enhances reusability by separating functionality from presentation

    - d) Increases flexibility and improves extensibility

    - e) Encapsulates application functions and facilitates maintenance

    - f) Supports incremental updates and divides deployment


    # 44: What are the design problems with MVC?


    Answer:


    The following are the MVC design problems:


    - a) Components are not aware about the other components'' details of implementation

    - b) Latency issues and communication volumes have to be handled carefully which
    otherwise result in a scalability issue in distributed systems

    - c) MVC is difficult to maintain if the Model is unstable because controller
    is mostly written based on the Model


    # 45: Explain the applicability of MVC.


    Answer:


    MVC has to be used for the following cases:


    - a) If the application is large enough and distributed

    - b) If the application has a longer life time

    - c) Portability of interface and back end are most important

    - d) For easy maintenance and reusability

    - e) Development of application by multiple developers

