    ## Java/J2EE Interview Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    ## Chapter 1


    ## Architectures and Protocols


    1: What is the difference between a Web Server and an Application Server?


    Answer:


    A Web Server works over the Internet. It uses the HTTP protocol to send the client
    requests over the Internet on to the server which is located elsewhere and retrieves
    the information requested from the server or posts the information sent on the
    server. ASP, JSP, Servlets, server side Javascript and CGI scripts work for the
    Web Server. The Web server simply acts as the middle layer passing on the requests
    or retrieving the requests and provides the HTML page results. It does not involve
    in any processing or data handling. An Application server provides the business
    logic to the client using the HTTP or other protocols. The Application server
    can be a GUI which involves some business logic or data processing programs running
    on a computer, a web server or other application servers. It exposes the business
    logic to the client.


    2: What all technologies are included in the J2EE architecture?


    Answer:


    The J2EE architecture includes the following technologies:


    - a) JAX – RPC which is the Java API for XML based RPC

    - b) JSP or Java Server Pages

    - c) EJB or Enterprise Java Beans

    - d) Java Servlets

    - e) J2EE Connector Architecture

    - f) J2EE Management Model

    - g) J2EE Deployment API

    - h) JMX or Java Management Extensions

    - i) J2EE Authorization Contract for Containers

    - j) JAXR or Java API for XML Registries

    - k) JMS or Java Message Service

    - l) JNDI or Naming and Directory Interface

    - m) JTA or Java Transaction

    - n) CORBA Common Object Request Broker

    - o) JDBC Java Data Connectivity


    3: What are the benefits of Spring?


    Answer:


    The Spring framework is a lightweight framework that provides various sorts of
    benefits. It uses Inversion of Control (IoC), Aspect Oriented Programming (AOP),
    and Dependency Injection (DI) to simplify development. The Spring framework is
    used in such a way to separate business logic from the infrastructure. It also
    supports various types of applications.


    4: Differentiate between SAX and DOM parsers


    Answer:


    SAX (Simple API for XML) is an event-based parser that reads the document node
    by node, which is faster and uses less memory. DOM (Document Object Model) loads
    the entire XML document into memory as a tree structure, allowing random access
    and modification of the data, but it is slower and consumes more memory.


    5: What is the difference between a component and a service?


    Answer:


    A J2EE component is a unit of software used for a particular purpose, such as
    Applets, Servlets, Session beans, and Entity beans. A service is a well-defined
    contract that can be used synchronously or asynchronously.


    6: What are the design goals of J2EE?


    Answer:


    The following are design goals of J2EE:


    - Availability: The application should be available 24/7.

    - Data Connectivity: The application should be able to connect to mainframe systems
    and other legacy systems.

    - Accessibility: User should be able to connect the application from anywhere
    and from any electronic device (desktop, laptop, PDA, mobile).

    - User Interaction: The user should be able to interact with the application.

    - Flexibility: The architecture should be created in such a way that the developer
    just concentrates on the component model (business logic) and the rest of the
    services are handled by the server.


    7: What are the roles of J2EE Architect?


    Answer:


    The following are the roles of an architect:


    - Visualizing the behavior of the system.

    - Creating the system blueprint.

    - Defining how system elements work together.

    - Defining non-functional and functional requirements.

    - Integrating non-functional requirements into the functional system.


    8: What is the difference between architecture and design?


    Answer:


    Architecture defines the structural issues, communication protocols, data access,
    synchronization, and subsystems classification. It also defines the architectural
    design of interfaces. In Design, we define the components to be created for each
    interface, the inputs, the outputs, algorithms, and data structures. In short,
    the designers describe each component’s internal details.


    9: What are the activities performed in Architectural Analysis?


    Answer:


    The following activities will be performed in Architectural Analysis:


    - Use case diagram: This is developed to depict the high level system functionality.

    - Class Diagram: This is developed to depict the functionality as classes and
    methods.

    - Collaboration Diagram: This is developed to depict how each class talk to each
    other.

    - Sequence Diagram: This is developed to depict the operation sequence.


    10: What are the activities performed in Architectural Design?


    Answer:


    The following activities will be performed in Architectural Design:


    - The framework (example: Remote Method Invocation)

