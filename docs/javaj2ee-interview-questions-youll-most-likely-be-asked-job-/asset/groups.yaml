    # 60: What is the use of ServletContext() method?


    Answer:


    The ServletContext() method is used to set and retrieve the initial configuration
    of the servlet which includes the session, connection and server details. The
    method returns a ServletConfig object which contains all the initial parameters
    as set. All application wide servlet parameters are set using the ServletConfig
    object and the ServletContext() methods returns the object along with the initial
    parameters for it. One aspect to be considered is that the Garbage Collector does
    not de-allocate the memory allocated for the ServletConfig object and hence it
    has to be handled manually or the object has to be used sparsely to make sure
    the performance is not affected.


