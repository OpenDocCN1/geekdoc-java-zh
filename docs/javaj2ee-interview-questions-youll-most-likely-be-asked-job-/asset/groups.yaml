    # 65: Why would your skills be a good match with our company''s objectives?


    Answer:


    If you''ve researched the company before, answering this question should be no
    problem. Determine several of the company’s main objectives, and explain how specific
    skills that you have are conducive to them. Also, think about ways that your experience
    and skills can translate to helping the company expand upon objectives, and to
    reach further goals. If your old company had a similar objective, give a specific
