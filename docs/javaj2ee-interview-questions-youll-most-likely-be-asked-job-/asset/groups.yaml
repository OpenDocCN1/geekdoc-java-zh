    # 54: Describe a time when you communicated a difficult or complicated idea to
    a coworker.


    Answer:


    Start by explaining the idea briefly to the interviewer, and then give an overview
    of why it was necessary to break it down further to the coworker. Finally, explain
    the idea in succinct steps, so the interviewer can see your communication abilities
    and skill in simplification.


    # 55: What situations do you find it difficult to communicate in?


    Answer:


    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don''t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name is difficult for you,
    and try to choose an uncommon answer such as language barrier in time of hardship,
