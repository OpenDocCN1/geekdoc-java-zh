    Answer:


    JSP directives are used to modify the overall structure of the servlet that results
    from the JSP page. There are three types of JSP directives. They are:


    +   a) page: This is used to import the classes, customize the super class and
    set the content type

    b) include: This is used to insert a file into the java server'
