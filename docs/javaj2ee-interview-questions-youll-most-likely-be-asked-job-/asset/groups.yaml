    # 30: 解释系统架构（System architecture）和参考架构（Reference architecture）。

    答案：


    系统架构将架构视为一种产品。它包含了所提系统的组件功能、接口、约束条件和交互作用。这是应用设计实现的基础。


    参考架构将架构视为一种方法或风格。对于特定的领域，参考架构指的是连贯的设计原则。


    # 第 2 章


    # 适用性与最佳实践


    31: 解释为了获得更好性能而应该遵循的最佳实践。


    答案：


    以下实践可以提高 J2EE 应用的性能：


    - a) **更好的资源管理**是获得更佳性能的关键。你可以通过创建限制性资源、池化或缓存资源，以及在特定资源不再被使用时立即释放内存来实现这一点。

    - b) 通过更好的会话、EJB、JNDI 初始上下文等设计模式来**最小化网络开销**。

    - c) 通过按引用传递并将引用声明为 `transient` 来**最小化序列化成本**。

    - d) **超时机制**确保空闲对象不会长时间占用内存

    - e) **仅对 JDBC 对象应用所需的权限**，并确保它们在不使用时释放，这将释放资源和内存。

    - f) **将数据库自动提交（auto-commit）设置为 false**

    - g) **使用虚拟代理（Virtual Proxy）**确保仅在需要时将所需的字段加载到内存中。


    # 32: Struts、Spring 和 Hibernate 如何提高性能的？


    答案：


    Struts、Spring 和 Hibernate 结合使用可以帮助你创建设计优化、更轻量且自给的 Web 应用。Struts 负责 Web 应用框架，Hibernate
    是形成数据库层的 ORM 网络，而 Spring 是企业级应用框架。如果你正在构建新应用，可以使用 Spring 和 Hibernate，因为 Spring
    可以替代 Struts。Spring 基于控制反转（Inversion of Control）和依赖注入（Dependency Injection）模式原理工作，这些原则指导了更佳的
    J2EE 设计模式。Struts 拥有包含 JSP、Servlets、Java Beans、特殊标签和消息的 MVC 框架。Hibernate 是可移植的，并支持对象到关系数据库的映射。它在建立数据库连接和维护事务方面比
    JDBC 好得多。Struts、Spring 和 Hibernate 协同工作时，提供了一个经过验证的设计模式框架和更好的连接性。


    # 33: 垃圾回收（Garbage Collection）如何帮助提高性能？


    答案：


    垃圾回收释放用于存储对象和数据的内存，从而在 JVM 中释放出更多空间，用于存储正在使用的新对象。这些额外空间可以用于内存交换和处理，并且是持续的。JVM
    使用栈和堆来清除过时的对象引用，并在访问该对象的程序或代码块退出时对其取消分配。这是一个复杂的过程，其中内存会被多次交换，以确保在 JVM 确认该对象不再被引用之前，数据在任何被引用时都是可用的。


    # 34: 解释最佳实践（Best Practice）。


    答案：


    最佳实践可以定义如下：


    - a) 在组件层级驱动你的应用设计的技术

    - b) 参与类似项目的其他团队成员所认可的流程

    - c) 考虑了设计或系统需求

    - d) 适用于整个软件开发生命周期


    # 35: 解释 J2EE 分层（tiers）。


    答案：


    J2EE 具有以下分层：


    - a) 客户端（Client Tier）：它代表向服务器发送请求的浏览器。该层使用的接口是 HTML 浏览器、Java 应用、applet 或非 Java
    应用。


    # 36: 表示层（presentation layer）应该遵循哪些最佳实践？


    答案：


    表示层应遵循的最佳实践解释如下：


    - a) 将超文本标记语言 (HTML) 与 Java 分离

    - b) 始终在 Bean 类中编写业务逻辑

    - c) 使用 JSP 模板和注释

    - d) 使用模型-视图-控制器（MVC）模式

    - e) 使用自定义库和标签处理器（tag handlers）


    # 37: MVC 使用什么类型的组件？


    答案：


    MVC 代表模型-视图-控制器（Model View Controller）。模型、视图和控制器使用的组件解释如下：


    - a) 应用代表模型（Model），它构成了系统的状态。系统状态通过 Bean 类中的业务逻辑创建

    - b) 用户界面代表视图（View），使用 Java Server Pages（J 页面）创建

    - c) 从客户端接收的请求始终是控制器（Controller），使用 Servlets 创建


    # 38: J2EE 系统在全球经济中运行必须具备什么要求？


    答案：


    J2EE 系统为了在全球范围内运行必须具备以下条件：


    - a) 财务考虑：购买物品的支付方式应包含多种形式，因为并非所有访问者都有信用卡。此外，政府有自己的税收、海关限制和关税。

    - b) 语言需求：应用应该支持多种语言并且必须是具体的。

    - c) 法律差异：每个国家的海关法和隐私要求不同，每个政府对图像、思想、演讲都有限制。


    # 39: DAO 中应该遵循哪些最佳实践？


    答案：


    DAO 代表数据访问对象（Data Access Object）。DAO 中遵循的最佳实践是：


    - a) DAO 不应与业务逻辑紧耦合

    - b) 每个 bean 都应该与 DAO 关联

    - c) DAO 只用于访问数据

    - d) DAO 的编写方式允许跨模式（cross schema）

    - e) 支持可移植性


    # 40: 解释指南（Guideline）。


    答案：


    指南指的是由专业组织开发的业务规则或协议。它还包括在项目期间为了减少流量而遵循的标准。


    # 41: VO 中应该遵循哪些最佳实践？


    答案：


    VO 代表值对象（Value Object）。VO 中遵循的最佳实践是：


    - a) VO 应该包含 get 和 set 方法

    - b) VO 应该相应的值更新模型 bean

    - c) VO 不引用服务器对象

    - d) VO 代表来自服务器的值


    # 42: 会话 bean facade（session bean facade）应该遵循哪些最佳实践？


    答案：


    - a) 它应该减少对服务器的远程调用

    - b) 对调用实体 bean 应用事务范围

    - c) 简化客户端代码，使业务逻辑仅在服务器上执行

    - d) 代码编写方式应识别用户权限并提供灵活性和复用性


    # 43: 模型-视图-控制器（MVC）有什么优点？


    答案：


    MVC 的优点如下：


    - a) 将数据模型与用户交互及数据显示分离，并明确了应用设计

    - b) 允许大量用户以多种形式查看数据

    - c) 通过分离功能与表示层增强了复用性

    - d) 增加了灵活性并改进了扩展性

    - e) 封装了应用功能并便于维护

    - f) 支持增量更新和划分部署


    # 44: MVC 存在哪些设计问题？


    答案：


    MVC 的设计问题如下：


    - a) 组件感知其他组件的实现细节

    - b) 延迟问题和通信量必须仔细处理，否则在分布式系统中会导致可扩展性问题

    - c) 如果模型不稳定，MVC 很难维护，因为控制器大部分是基于模型编写的


    # 45: 解释 MVC 的适用性。


    答案：


    MVC 适用于以下情况：


    - a) 如果应用足够大且分布式

    - b) 如果应用生命周期较长

    - c) 接口和后端的的可移植性最重要

    - d) 便于维护和复用

    - e) 由多个开发者开发应用


