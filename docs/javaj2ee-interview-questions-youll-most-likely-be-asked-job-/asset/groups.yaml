    ## 124: 解释细粒度（fine-grained）和粗粒度（coarse-grained）接口


    答案：

    当接口包含较大的组件块或一组细粒度组件，而不是散落在应用程序中的较小组件块时，它就变成了粗粒度的。细粒度组件是较小的代码或数据单元，根据需要通过关系相互连接。一个区分客户（Customer）和账户（Account）对象的经典示例：在粗粒度接口中，客户对象将包含账户号和余额的详情。在细粒度接口中，客户详情是独立的、地址详情是独立的、账户详情也是独立的，且它们都通过关系链接在一起。


    ## 125: 解释 Session bean（会话豆）和 Entity bean（实体豆）之间的区别


    答案：

    实现 Enterprise Bean 接口的 Java 类是 Entity Bean。这些通常用于包含数据实体。Entity Bean 有两种类型：CMP（容器管理持久化）或
    BMP（豆管理持久化）。Session bean 可以是有状态的（Stateful）或无状态的（Stateless）。会话首先在客户端和 servlet 之间建立。有状态的会话在客户端和服务器之间的各种方法调用之间维护一个状态。无状态的会话在方法调用之间不维护状态。Session
    bean 用于调用业务方法和逻辑，而 Entity bean 是实际包含数据的数据库对象。Entity bean 是持久的，而 Session bean 是瞬态的。


    ## 126: 你对 EJB 拦截器（Interceptor）了解些什么？


    答案：

    拦截器是其调用优先级高于被调用方法的方法。通常，拦截器用于在方法处理之前检查和验证传递的参数或进行安全检查。拦截器的另一个用途是在不影响 EJB  其他代码的情况下记录日志和分析操作。拦截器可以是方法级、类级或包级。默认级拦截器适用于应用程序中的所有
    EJB。当第一种存在多个拦截器时，首先调用默认级拦截器。类级拦截器适用于类中的所有方法，其优先级次于默认拦截器。方法级拦截器在方法执行之前被调用，在三种类型的拦截器中优先级最低。


    ## 127: 扩展并解释 ACID。


    答案：

    ACID 是 Atomic（原子性）、Consistent（一致性）、Isolation（隔离性）和 Durable（持久性）的缩写，是 EJB 事务的基本准则。


    -   a) Atomic（原子性） – 意味着事务要么执行所有，要么完全不执行。

    -   b) Consistent（一致性） – 所有事务必须保持一致，开发者必须在事务级别和应用程序级别确保这种一致性。

    -   c) Isolation（隔离性） – 事务必须允许独立运行，不受其他进程或事务的干扰。

    -   d) Durable（持久性） – 要求所有属于事务的数据在事务完成之前永久地写入存储系统中。这将确保数据不会丢失。


    ## 128: EJB 如何帮助管理数据库实体映射？


    答案：

    EJB 支持四种实体关系：一对一、一对多、多对一和多对多。EJB 拦截器注解用于映射数据库实体关系。拦截器定义在单独的包中，作为头文件与主 Java 类中包含的基础
    Java 包一起引入。所有的数据库连接和关系映射都是使用 Hibernate 在后台完成的。在需要的地方包含类级和方法级拦截器，这将执行所需的映射并从数据库中获取详情。


    ## 129: EJB 组件必须创建哪些类/接口？


    答案：

    为 EJB（企业级 Java Bean）组件必须创建以下类/接口：


    -   a) Home 接口 (EJBHome)

    -   b) Remote 接口 (EJBObject)

    -   c) 业务逻辑（bean 类）

    -   d) 上下文对象 (Context objects)

    -   e) XML 部署描述符


