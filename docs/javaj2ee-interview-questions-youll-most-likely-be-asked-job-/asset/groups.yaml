    # 65: Differentiate between ServletContext and ServletConfig.


    Answer:


    The ServletContext interface contains methods that are used to communicate between
    the servlet and the server container. It handles details details regarding the
    MIME type of the servlet requests and responses to the server etc. An object of
    type ServletContext is contained in the ServletConfig object which contains the
    initial parameters of the servlet. While the ServletContext represents a single
    Servlet, the ServletConfig is common to all servlets within the JVM, which makes
    the ServletContext a local parameter and the ServletConfig a global parameter.
    The getServletContext() method is used in ServletContext to get the details of
    the config object. ServletConfig uses the getServletContext() method to get the
    details of the context object.


