    ## 46: Explain the importance of patterns in J2EE framework.


    Answer:


    Patterns refer to a recurring solution for a business problem in a particular
    context. Context refers to the situation or environment in which the problem exists.
    A problem is something that requires investigation and has to be solved and it
    is specified by cause and effect.


    ## 47: Explain Framework patterns.


    Answer:


    The following are called the Framework patterns:


    - a) Proxy pattern: The EJB remote interface is an example of Proxy pattern. It
    has methods which delegate method calls to objects

    - b) Factory Method: EJB Home Interface is an example of Factory method. It has
    an independent reusable class which refers objects through a common interface

    - c) Abstract Factory Method: EJB home interface is an example of abstract factory
    method. It has a procedure to create abstract class instances from concrete subclasses

    - d) Decorator: EJDataObject is an example of Decorator pattern. The functionality
    of the decorator is that it is visible to the clients


    ## 48: What are the activities of a deployer?


    Answer:


    The deployer performs the following activities:


    - a) Stage the Enterprise Archive (EAR) file which is created in the development
    phase into the J2EE application server

    - b) Modify the deployment descriptor and configure the J2EE application

    - c) Ensure the Enterprise Archive file (EAR) is well formed and complies with
    J2EE specification

    - d) Install or deploy the Enterprise Archive file in the J2EE application server


    ## 49: What are the patterns that belong to Integration Tier?


    Answer:


    The following patterns belong to Integration Tier:


    - a) DAO: The Data Access Object retrieves data sources and delivers transparent
    data access

    - b) Service Activator: This is utilized for EJB components and supports asynchronous
    processing


    ## 50: Explain Presentation Tier patterns.


    Answer:


    The following are the Presentation Tier patterns:


    - a) Front Controller: This is used for handling and managing the request from
    client

    - b) Decorating Filter: This is used for preprocessing and post processing of
    a particular request

    - c) Composite View: This is used to create a view from sum components

    - d) Dispatch View: This is used in coordination with Front Controller to view
    helper patterns and defer activities for viewing the processing

    - e) View Helper: This is used to encapsulate the logic and format the presentation


    ## 51: Explain Business Tier patterns.


    Answer:


    The following are the Business Tier patterns:


    - a) Session Facade: This hides the complexity of business object and centralizes
    the handling of workflow

    - b) Value Object: This is used to exchange data among different tiers

    - c) Service Locator: This is used to hide the business service creation complexity
    and lookup. It also locates the service factories

    - d) Business delegate: It is used to separate the service tier and presentation
    tier, and provides a proxy and façade interface to services

    - e) Value Object Assembler: This is used to build value object from data sources


    ## 52: Explain EIS.


    Answer:


    EIS represents Enterprise Information System. It is present in the Integration
    tier and supports infrastructure related information for the enterprise.


    Accessing EIS is very complex and it requires the following knowledge:


    - a) Information related to Transaction

    - b) Information related to Security, and

    - c) Knowledge on Application Programming Model


    ## 53: What are the system level contracts of EIS and application server?


    Answer:


    The following are the system level contracts of EIS and J2EE application server:


    - a) The contract ‘Connection Management’ lets the application and J2EE components
    to connect to EIS. This leads to a scalable environment and supports many client
    to get access to EIS

    - b) The contract ‘Transaction Management’ supports transaction related access
    to EIS. This uses the transaction manager to manage transactions

    - c) The contract ‘Security’ enables to attain secure access to EIS. This reduces
    threats to EIS and protects information


    ## 54: Explain the Resource Adapter.


    Answer:


    The resource adapter is the system level contract for Enterprise Information System
    (EIS). This is utilized by application client or server to connect with EIS.


    It collaborates with application server to support security, transaction, and
    connection pooling. It is used within the application server’s address space.


    ## 55: Explain data caching.


    Answer:


    Data caching features are explained below:


    - a) Caching features are explained below

    - b) Caching features are explained below

    - c) Caching features are explained below

    - d) Caching features are explained below

    - e) Caching features are explained below


    ## 56: Explain Service locator.


    Answer:


    The service locator is used to hide the business service creation complexity and
    lookup. It also locates the service factories. The service locator uses Java Naming
    Directory Interface (JNDI) API which requires initial context.


    ## 57: Explain how to prevent performance problems.


    Answer:


    Performance problems can be prevented by the following ways:


    - a) If the service requires local access, then use local object

    - b) If you want to access the same bean, then use local interface

    - c) Use single call instead of multiple calls

    - d) Modify unnecessary variable

    - e) To avoid JNDI, cache


    ## 58: Explain a security guideline.


    Answer:


    The purpose of security mechanism is to support end-to-end security by integrating
    environments. Security is handled by creating user accounts in all domains. Also,
    security should support authorization and authentication.


    ## 59: What are the classes and interfaces used for Servlets?


    Answer:


    Servlets depend on two packages – javax.servlet and javax.servlet.http. The javax.servlet
    package holds the interfaces and classes that relate to the details of the servlet.
    The javax.servlet.http package holds the interfaces and classes that relate to
    the http request and responses that sends information and queries to the server.


    ## 60: What is the use of ServletContext() method?


    Answer:


    The ServletContext() method is used to set and retrieve the initial configuration
    of the servlet which includes the session, connection and server details. The
    method returns a ServletConfig object which contains all the initial parameters.
    All application wide servlet parameters are set using the ServletConfig object
