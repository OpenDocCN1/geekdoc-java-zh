    # 48: What are the activities of a deployer?


    Answer:


    The deployer performs the following activities:


    +   a) Stage the Enterprise Archive (EAR) file which is created in the development
    phase into the J2EE application server


    +   b) Modify the deployment descriptor and configure the J2EE application


    +   c) Ensure the Enterprise Archive file (EAR) is well formed and complies with
    J2EE specification


    +   d) Install or deploy the Enterprise Archive file in the J2EE application server


