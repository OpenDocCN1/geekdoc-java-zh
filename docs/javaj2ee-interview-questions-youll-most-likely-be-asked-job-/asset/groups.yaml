    - c) 确保高质量


    # 业务层和用户界面之间通信使用哪些协议？


    答案：


    业务层和用户界面之间通信使用以下协议：


    - a) HTTP：代表“超文本传输协议”（Hyper Text Transfer Protocol）

    - b) JMS：代表“Java 消息服务”（Java Messaging Service）

    - c) RMI：代表“远程方法调用”（Remote Method Invocation）

    - d) CORBA：代表“通用对象体系架构”（Common Object Broker Architecture）

    - e) DCOM：代表“分布式组件模型”（Distributed Component Object Model）


    # HTTP 协议的优点和缺点是什么？


    答案：


    HTTP 协议的优点是：


    - a) 无状态且防火墙友好

    - b) 更容易进行负载均衡和扩展


    HTTP 协议的缺点是：


    - a) 难以维护会话

    - b) 与 JSP 和 servlet 的通信有限


    # 解释 JRMP。


    答案：


    JRMP 代表 Java 远程方法协议（Java Remote Method Protocol）。远程方法调用（RMI）使用它来传递 Java 对象。由于
    Java 依赖对象序列化将对象封装为流，RMI 依赖 JRMP 协议在 JVM（Java 虚拟机）之间传输对象。


    # CORBA 的优势和缺点是什么？


    答案：


    CORBA 的优势是：


    - a) 支持异构对象

    - b) 扩展了 ORB（对象请求代理）的能力


    CORBA 的缺点是：


    - a) 无法传递对象，只能传递参数

    - b) 只能传递接受的数据类型


    # 解释 DCOM。


    答案：


    DCOM 代表分布式组件模型（Distributed Component Model）。它使用 ORPC（对象远程过程调用）协议来支持远程对象。


    ORPC 构建在 RPC（远程过程调用）之上，并与运行时服务交互。DCOM 支持多个接口，可以使用各种编程语言创建组件。语言示例：Java、C、Visual
    Basic 等。DCOM 在 Windows 平台上广泛使用。


    # 解释 J2EE 架构的能力。


    答案：


    J2EE 架构的能力如下：


    - a) 性能：在短时间范围内执行功能

    - b) 可扩展性：即使服务器负载增加也能支持

    - c) 可用性：跨始终可访问


