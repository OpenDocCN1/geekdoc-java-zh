    +   a) Required: In this, the container starts a new transaction if the transaction
    does not exist


    +   b) RequiresNew: In this, the container creates new transaction for each method
    call


    +   c) Supports: In this, the bean can execute without transaction


    +   d) Unsupported: In this, the bean cannot be invoked with a transaction


    +   e) Never: In this, the bean will never execute a transaction


    +   f) Mandatory: In this, each method call requires a transaction context


    # 172: How does container manage multiple transactions?


    Answer:


    The EJB container manages multiple transactions by the following two ways:


    +   a) The EJB container instantiate multiple instances of enterprise bean thereby
    allowing database to handle'
  - '[PAGE 96]


    any issues related to transaction processing


    +   b) The EJB container acquires exclusive lock on the

    terprise bean instance’s database state thereby

    serializing access to the instance from multiple

    transactions


    # 173: Explain JTS.


    Answer:


    JTS refers to Java Transaction Service. It specifies the

    transaction manager implementation of Java Transaction API

    (Application Programming Interface).

    It supports distributed transactions i.e. multiple database on

    multiple systems supported by multiple transaction managers.

    Using JTS, the container makes sure that the transaction can

    span through multiple containers.


    # 174: What are the services provided by EJB container?


    Answer:


    EJB container provides the following services:


    +   a) Transaction Management: The container manages start,

    enrollment, rollback, and transaction commitment


    +   b) Lifecycle Management: It includes bean creation,

    destroy, activate and passivate


    +   c) Persistence: The beans do not explicitly retrieve or store

    data from database but do so with the help of container


    +   d) State Management: The container automatically

    manages state of the bean object'
- md: '

    e) Remote Access (Distributed): The container supports distributed remote access
    with the help of RMI and IIOP protocols


    f) Security: The container performs automatically all security checks on behalf
