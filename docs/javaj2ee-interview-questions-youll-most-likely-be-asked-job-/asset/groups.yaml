    Design patterns are used for solving a common problem that comes out during software
    engineering. It also explains the reason for the problem, the working solution
    and the reason it is beneficial. With design patterns, it is easy to identify
    the new problems.


    207: What are the benefits of Design Patterns?


    Answer:


    The following are the benefits of Design Patterns:


    - a) Focus quickly on the solution for the specific problem

