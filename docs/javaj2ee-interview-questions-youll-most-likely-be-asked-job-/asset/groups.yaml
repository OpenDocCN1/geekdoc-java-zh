    # 180


    # JAVA/J2EE Interview Questions You''ll Most Likely Be Asked


    The key part of this question is to make sure that you have prepared! Be sure
    that you''ve researched the company, their objectives, and their services prior
    to the interview, and know as much about the specific position as you possibly
    can. It''s also helpful to learn about the company''s history and key players
    in the current organization.


    # 70: If you were hired here, what would you do on your first day?


    Answer:


    While many people will answer this question in a boring fashion, going through
    the standard first day procedures, this question is actually a great chance for
    you to show the interviewer why you will make a great hire. In addition to things
    like going through training or orientation, emphasize how much you would enjoy
    meeting your supervisors and coworkers, or how you would spend a lot of the day
    asking questions and taking in all of your new surroundings.


    # 71: Have you viewed our company''s website?


    Answer:


    Clearly, you should have viewed the company''s website and done some preliminary
    research on them before coming to the interview. If for some reason you did not,
    do not say that you did, as the interviewer may reveal you by asking a specific
    question about it. If you did look at the company''s website, this is an appropriate
    time to bring up something you saw'
  - '[PAGE 182]


    there that was of particular interest to you, or a value that you

    especially supported.


    # 72: How does X experience on your resume relate to this

    position?


    Answer:


    Many applicants will have some bit of experience on their

    resume that does not clearly translate to the specific job in

    question. However, be prepared to be asked about this type of

    seem-irrelevant experience, and have a response prepared

    that takes into account similar skill sets or training that the two

    may share.


    # 73: Why do you want this position?


    Answer:


    Keep this answer focused positively on aspects of this specific

    job that will allow you to further your skills, offer new

    experience, or that will be an opportunity for you to do

    something that you particularly enjoy. Don''t tell the

    interviewer that you''ve been looking for a job for a long time,

    or that the pay is very appealing, or you will appear

    unmotivated and opportunistic.


    # 74: How is your background relevant to this position?


    Answer:


    Ideally, this should be obvious from your resume. However, in

    instances where your experience is more loosely-related to the'
  - '[PAGE 183]


    position, make sure that you''ve researched the job and company well before the
    interview. That way, you can intelligently relate the experience and skills that
    you do have, to similar skills that would be needed in the new position. Explain
    specifically how your skills will translate, and use words to describe your background
    such as “preparation” and “learning.” Your prospective position should be described
    as an “opportunity” and a chance for “growth and development.


    # 75: How do you feel about X mission of our company?


    Answer:


    It’s important to have researched the company prior to the interview – and if
    you’ve done so, this question won’t catch you off guard. The best answer is one
    that is simple, to the point, and shows knowledge of the mission at hand. Offer
    a few short statements as to why you believe in the mission’s importance, and
    note that you would be interested in the chance to work with a company that supports
    it.


    And Finally Good Luck!'
