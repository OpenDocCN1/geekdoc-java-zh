    59: What are the classes and interfaces used for Servlets?


    **Answer:**


    Servlets depend on two packages – javax.servlet and javax.servlet.http. The javax.servlet
    package holds the interfaces and classes that relate to the details of the lifecycle
    of the servlet. The javax.servlet.http package holds the interfaces and classes
    that relate to the http request and responses that sends information and queries
    to the server and brings the required information from the server. Cookies, sessions
    and listeners that control the web server connection and its details belong to
    the javax.servlet.http package, while the init(), service(), and destroy() methods
    that control the lifecycle of the servlet belong to the javax.servlet package.'
