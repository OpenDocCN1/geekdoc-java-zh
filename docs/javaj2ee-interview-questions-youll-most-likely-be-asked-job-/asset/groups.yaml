    # 259: What are the actions performed by Java Security Manager in Applets?


    Answer:


    The following are the actions performed by Java Security Manager in applets:


    -   a) Delete a file, write a file, and read a file


    -   b) Modify the attribute (Example: priority) of a thread


    -   c) Update or Access the system properties


    -   d) Accept, Wait, or Open a socket or network connection


    # 260: What are the security restrictions in Java applets?


    Answer:


    The following are the security restrictions in Java applets:


    -   a) Applet is not allowed to define native methods or load libraries but it
    can use its own code


    -   b) It cannot write or read files on the remote or host machine where it executes


    -   c) Network connection is available only to the host machine where it is downloaded


    -   d) It cannot start a program in the host machine


    -   e) It is restricted to read the system properties


    # 261: What are the system properties that applet cannot read?


    Answer:


    The following are the system properties that an applet is restricted to read:


    -   a) user-name: It refers to the account name of the user


    -   b) user-home: It refers to the home directory of the user


    -   c) user-dir: It refers to the current working directory of the user


    -   d) java.home: It refers to the installation directory of java


    -   e) java.class.path: It refers to the class path of java


    # 262: What are the policies for access control?


    Answer:


    The following are the potential policies for access control:


    -   a) Once the user is authenticated, all the processes invoked by the user inherit
    access to authenticated context


    -   b) Once a component is authenticated, the context is available to all the
    other trusted components


    -   c) Once the component is ready to impersonate the caller, the caller authenticates
    the called component


    # 263: What are the authenticated mechanisms supported in J2EE?


    Answer:


    The web container in J2EE supports the following authentication mechanisms:


    -   a) HTTP basic: It contains URL request with parameters


    -   b) HTTP digest: It contains URL request with encrypted parameters


    -   c) FORM based: This is validated using user name and password


    -   d) HTTPS mutual: This allows to perform secured transaction


    # 264: Explain encrypted communication.


    Answer:


    The data can be encrypted by a mechanism called Cryptography. In this mechanism,
    the data is encrypted and decrypted using a matching key. There are two types
    of encryption:


    -   a) Symmetric: In this, both receiver and sender know the common key for decrypting
    and encrypting messages


    -   b) Asymmetric: It is called public key cryptography where a key is split into
    public and private key. Each key has the ability to decrypt data encrypted by
    other user


    # 265: Explain Digital Certificates.


    Answer:


    Digital Certificate is the famous solution for private key holder for placing
    the public key in a package called Digital certificate and sign with a private
    key of trusted authority called CA (Certificate Authority).


    Digital Certificates resolves the public key issue which when received by the
    party is not trustworthy. VeriSign is the leader in issuing Digital Certificates
    and the CA is trusted universally and well known. The public keys of VeriSign
    are distributed with browsers and web servers.


    # 266: Explain Secure Socket Layer.


    Answer:


    Secured Socket Layer (SSL) is a protocol which ensures privacy on accessing the
    Internet. These help applications communicate each other so that eavesdropping
    never occurs. Secured Socket Layer offers authentication of server, encryption
    for data and integrity of messages. In SSL, all the data are encrypted and then
    transmitted across network. It uses port 443 for transmitting messages across
    servers. It also uses server and mutual authentication modes to transmit messages.


    # 267: What are the security checks performed by web container?


    Answer:


    The web container performs the following security checks:


    -   a) Ensures that it has to decrypt the request


    -   b) Ensures that any authorizations constraints are available in the request


    -   c) Ensures that the request contains authorization or authentication requirements


    -   d) The requested resources are protected by the combination of authentication
    and authorization constraints


    # 268: Explain legacy connectivity using Java.


    Answer:


    Legacy connectivity approach is based on the client server model which uses two-tier
    architecture. It is not web based and it uses Enterprise Information System to
    retrieve and process data.


    Enterprise Information System has an adapter which provides API (Application programming
    Interface) for processing and accessing data and EIS functions. The client uses
    the API programmatically to connect and access EIS.


    The key to Enterprise Information System adapter is reusability. Independent vendors
    develop adapters using programming language that has high degree of usability
    and reusability.


    # 269: Explain the authentication in EIS.


    Answer:


    To access information from Enterprise Information System, the components of J2EE
    needs to follow a separate security procedure.


    The information exists in a protected domain and hence Enterprise Information
    System layer operates in a separate environment. In this scenario, the container
    tries to invoke the J2EE components authentication to get the resource. This mechanism
    is called as container managed resource manager


    # 270: Explain CSI.


    Answer:


    CSI refers to Common Secure Interoperability. It belongs to Object Management
    Group (OMG). CSI v2 is the standard for IIOP (Internet Inter-ORB Protocol) which
    supports identity assertion.


    # 271: Explain EIS adapter.


    Answer:


    Enterprise Information System has an adapter which provides API (Application programming
    Interface) for processing and accessing data and EIS functions. The client uses
    the API programmatically to connect and access EIS.


    The key to Enterprise Information System adapter is reusability. Independent vendors
    develop adapters using programming language that has high degree of usability
    and reusability.


    # 272: Explain legacy connectivity using JEE.


    Answer:


    Developers use JDBC (Java Database Connectivity) to access data instead of using
    adapters as this is time consuming. Java Connector Architecture (JCA) is supported
    in all the latest servers of WebLogic and WebSphere.


    By using Java Connector Architecture (JCA), the Enterprise Information System
    (EIS) vendors are not required to customize the adapters for each application
    server.


    # 273: Explain Resource Adapter.


    Answer:


    Resource Adapter refers to implementation of interfaces in javax.resource.spi
    and javax.resource.cci package. It requires software library in system level when
    you try to access a resource which uses native libraries to access Enterprise
    Information System.


    Resource adapter by default implements Enterprise Information System adapter of
    system contracts which includes security and transaction management.


    The resource adapter also has API at the client level which is used to access
    EIS. It is also used within the server (application) environment.


    # 274: Explain System contract.


    Answer:


    System contract is defined as the agreement between two parties to support collaborative
    and mutually beneficial interaction. For example, EIS and server (application)
    collaborate to support mechanisms like connection management, security, and transactions.


    Using system contract, the component provider focuses on presentation and business
    logic development for applications. With this, we get a group of functionality
    from the provider to perform business tasks.


    # 275: Explain the integration strategy of JCA.


    Answer:


    The major work for developers nowadays is to integrate the new system with the
    older system. Integration could be performed with the following ways:


    -   a) Inbound Integration Technique: In this, the request is initiated by the
    outside system to our system


    -   b) Outbound Integration Technique: In this, the request is initiated by our
    system to other system


    # 276: What are the types of System Contract?


    Answer:


    There are three types of system contracts. They are:


    -   a) Security Management: This enables the server (application) to connect with
    EIS using the security related properties


    -   b) Transaction Management: This allows propagating transactions from server
    (application) to EIS


    -   c) Connection Management: This describes agreement between container (J2EE)
    and adapter to establish pooling and tearing down connections

