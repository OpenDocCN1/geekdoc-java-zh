    ## 14: What has been your biggest success?


    Answer:


    Your biggest success should be something that was especially meaningful to you,
    and that you can talk about passionately – your interviewer will be able to see
    this. Always have an answer prepared for this question, and be sure to explain
    how you achieved success, as well as what you learned from the experience.


    ## 15: What motivates you?


    Answer:


    It''s best to focus on a key aspect of your work that you can target as a “driving
    force” behind your everyday work. Whether it''s customer service, making a difference,
    or the chance to further your skills and gain experience, it''s important that
    the interviewer can see the passion you hold for your career and the dedication
    you have to the position.


    ## 16: What do you do when you lose motivation?


    Answer:


    The best candidates will answer that they rarely lose motivation, because they
    already employ strategies to keep themselves inspired, and because they remain
    dedicated to their objectives. Additionally, you may impress the interviewer by
    explaining that you are motivated by achieving goals and advancing, so small successes
    are always a great way to regain momentum.


    ## 17: What do you like to do in your free time?


    Answer:


    What you do answer here is not nearly as important as what you don’t answer –
    your interviewer does not want to hear what you like to drink, party, or revel
    in the nightlife. Instead, choose a few activities to focus on that are greater
    signs of stability and maturity, and that will not detract from your ability to
    show up to work and be productive, such as reading, cooking, or photography. This
    is also a great opportunity to show your interviewer that you are a well-rounded,
    interesting, and dynamic personality that they would be happy to hire.


    ## 18: What sets you apart from other workers?


    Answer:


    This question is a great opportunity to highlight the specific skill sets and
    passion you bring to the company that no one else can. If you can’t outline exactly
    what sets you apart from other workers, how will the interviewer see it? Be prepared
    with a thorough outline of what you will bring to the table, in order to help
    the company achieve their goals.


    ## 19: Why are you the best candidate for that position?


    Answer:


    Have a brief response prepared in advance for this question, as this is another
    very common theme in interviews (variations of the question include: “Why should
    I hire you, above Candidate HR B?” and “What can you bring to our company that
    Candidate B cannot?). Make sure that your statement does not sound rehearsed,
    and highlight your most unique qualities that show the interviewer why he she
    must hire you above all the other candidates. Include specific details about your
    experience and special projects or recognition you’ve received that set you apart,
    and show your greatest passion, commitment, and enthusiasm for the position.


    ## 20: What does it take to be successful?


    Answer:


    Hard work, passion, motivation, and a dedication to learning – these are all potential
    answers to the ambiguous concept of success. It doesn’t matter so much of these
    values you choose as the primary means to success, or if you choose a combination
    of them. It is, however, absolutely key that whichever value you choose, you must
    clearly display in your attitude, experience, and goals.


    ## 21: What would be the biggest challenge in this position for you?


    Answer:


    Keep this answer positive, and remain focused on the opportunities for growth
    and learning that the position can provide. Be sure that no matter what the challenge
    is, it’s obvious that you’re ready and enthusiastic to tackle it, and you have
    a full awareness of what it will take to get the job.


    ## 22: Would you describe yourself as an introvert or an extrovert?


    Answer:


    There are beneficial qualities to each of these, and your answer may depend on
    what type of work you''re involved in. However, a successful leader may be an
    introvert or extrovert, and similarly, solid team members may also be either.
    The important aspect of this question is to have the level of self-awareness required
    to accurately describe yourself.


    ## 23: What are some positive character traits that you don''t possess?


    Answer:


    If an interviewer asks you a tough question about your weaknesses, or lack of
    positive traits, it''s best to keep your answer light-hearted and simple – for
    instance, express your great confidence in your own abilities, followed by a (rather
    humble) admittance that you could occasionally do to be more humble.


    ## 24: What is the greatest lesson you''ve ever learned?


    Answer:


    While this is a very broad question, the interviewer will be more interested in
    hearing what kind of emphasis you place on this value. Your greatest lesson may
    tie in with something a mentor, parent, or professor once told you, or you may
    have gleaned it from a book written by a leading expert in your field. Regardless
    of what the lesson is, it is most important that you can offer an example of how
    you''ve incorporated it into your life.


    ## 25: Have you ever been in a situation where one of your strengths became a
    weakness in an alternate setting?


    Answer:


    It''s important to show an awareness of yourself by having an answer for this
    question, but you want to make sure that the weakness is relatively minor, and
    that it would still remain a strength in most settings. For instance, you may
    be an avid reader who reads anything and everything you can find, but reading
    billboards while driving to work may be a dangerous idea.


    ## 26: Who has been the most influential person in your life?


    Answer:


    Give a specific example (and name) to the person who has influenced your life,
    and offer a relevant anecdote about the two you shared. It''s great if their influence
    relates to your professional life, but this particular question opens up the possibility
    to discuss your personal life as well. The interviewer wants to see that you''re
    able to make strong connections with individuals, and to work under the influence.


    ## 27: Do you consider yourself to be a “detailed” or “big picture” type of person?


    Answer:


    Both of these are great qualities, and it''s best if you can incorporate each
    into your answer. Choose one as your primary type, and relate it to experience.
    Then, explain how the other type fits into your work as well.


    ## 28: What is your greatest fear?


    Answer:


    Disclosing your greatest fear openly and without embarrassment is a great way
    to show your confidence to an employer. Choose a fear that you are clearly doing
    work to combat, such as a fear of failure that will seem impossible for someone
    as yourself, with such clear goals and actions outlined. As tempting as it may
    be to stick with an easy answer such as spiders, stay away from these, as they
    don''t really tell the interviewer anything about yourself.


    ## 29: What sort of challenges do you enjoy?


    Answer:


    The challenges you enjoy should demonstrate some sort of initiative or growth
    potential on your part, and should also be in line with your career objectives.
    Employers will evaluate consistency here, as they analyze critically how the challenges
    you look forward to are related to your ultimate goals.


    ## 30: Tell me about a time you were embarrassed. How did you handle it?


    Answer:


    No one wants to bring up times they were embarrassed in a job interview, and it''s
    probably best to avoid an anecdote. However, don''t shy away from offering a brief
    synopsis, followed by a display of your ability to laugh it off. Show the interviewer
    that it was not an event that impacted you significantly.


    ## 31: What is your greatest weakness?


    Answer:


    This is another one of the most popular questions asked in job interviews, so
    you should be prepared with an answer already. Try to come up with a weakness
    that you have actually been a strength in an alternate setting – such as, “I’m
    very detail-oriented and like to ensure that things are done correctly, so I sometimes
    have difficulty in delegating tasks to others.” However, don''t try to mask obvious
    weaknesses – if you have little practical experience in the field, mention that
    you''re looking forward to great opportunities to further your knowledge.

