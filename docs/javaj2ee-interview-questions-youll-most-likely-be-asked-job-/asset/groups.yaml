    123: Explain the terms "Required", "RequiresNew", "Supports", "NotSupported" and
    "Mandatory".


    Answer:


    The terms Required, RequiresNew, Supports, NotSupported and Mandatory are all
    used in the context of container managed database transactions using EJB. They
    are all different attributes that control the scope of the transactions.


    +   a) Required – The Required attribute is the default attribute and it means
    that the EJB container should create a transaction, if not already there, to execute
    the EJB method.


    +   b) RequiresNew – This attribute suspends the existing transaction, if any,
    creates a new one and delegates the EJB method call to the new transaction. This
    ensures'
- md: '

    that a new transaction is created every time an EJB method is invoked.


    -   c) Supports – This attribute invokes a new EJB method within the current transaction
    of the client. Even if the client does not have an open connection, the method
    is invoked if the Supports attribute is set.


    -   d) NotSupported – This attribute suspends the transaction the client has before
    invoking the method, runs the method and then resumes the earlier transaction.
    If the client does not have an existing transaction, a new transaction is not
    opened if the NotSupported attribute is set.


    -   e) Mandatory – This attribute makes a transaction compulsory for invoking
    an EJB method. If an existing transaction is not found while invoking the method,
    the container throws a TransactionRequiredException.


    ## 124: Explain fine-grained and coarse-grained interfaces


    Answer:

    Interfaces become coarse-grained when it contains larger block of components or
    a set of fine-grained components instead of smaller blocks scattered across the
    application. Fine-grained components are smaller units of code or data that connected
    to each other through relations wherever required. A classic example that differentiates
    between the Customer and Account objects. In a coarsely-grained interface, the
    Customer object will have the details about the account number and the balance
    too. In a finely-grained interface, the customer details are separate, the address
    details are separate, the account details are separate and they are all linked
    by relations.


    ## 125: Explain the difference between Session bean and the Entity bean


    Answer:

    A Java class that implements the Enterprise Bean interface is an Entity Bean.
    These are generally used to contain the data entities. There are two types of
    Entity beans – CMP or Container Managed Persistence and BMP or Bean Managed Persistence.
    The Session bean can be Stateful or Stateless. The session is established first
    between the client and the servlet. A Stateful session is one maintains a state
    between the various method invocations between a client and a server. The Stateless
    session does not maintain a state between method invocations. The session beans
    are used to invoke the business methods and logics while the Entity beans are
    the database objects that actually contain the data. The Entity beans are persistent
    while the Session beans are transient.


    ## 126: What do you know about the EJB Interceptor?


    Answer:

    Interceptors are methods that have higher preference of invocation than the method
    being called. Generally, interceptors are used to check and validate the parameters
    passed or the security checks just before the method is being processed. Another
    use of an interceptor is to log and profile actions without affecting the rest
    of the code of EJB. The interceptors can be method level, class level or package
    level. The default level interceptor applies to all EJBs within the application.
    It is invoked in first case more than one interceptor is available. The class
    level interceptor applies to all methods in a class and it has the next preference
    after the default interceptor. The method level interceptor is invoked just before
    the method and it has the least preference of the three types of interceptors.


    ## 127: Expand and explain ACID.


    Answer:

    ACID is the acronym for Atomic, Consistent, Isolation and Durable and is the basic
    qualifier of EJB transactions.


    -   a) Atomic – implies that the transaction must either execute all or nothing.

    -   b) Consistent – all transactions must be consistent and the developer has
    to ensure the consistency in transaction level and application level.

    -   c) Isolation – a transaction must be allowed to run on its own without any
    interference from other processes or transactions

    -   d) Durable – requires that all data that belong to a transaction are written
    permanently in a storage system before the transaction is completed. This will
    ensure that no data is lost.


    ## 128: How does EJB help manage the database entity mappings?


    Answer:

    EJB supports four types of entity relations – one to one, to many, many to one
    and many to many. EJB Interceptor annotations are used for mapping the database
    entity relations. The interceptors are defined in a separate package and included
    as header files along with the basic java packages included in the main java classes.
    All database connections and relation mappings are done in the background using
    Hibernate. Class level and method level interceptors are included wherever required
    which will do the required mappings and fetch the details from the database.


    ## 129: What are the classes / interfaces that must be created for the EJB component?


    Answer:

    The following are the classes / interfaces that must be created for the EJB (Enterprise
    Java Bean) component:


    -   a) Home interface (EJBHome)

    -   b) Remote interface (EJBObject)

    -   c) Business logic (bean class)

    -   d) Context objects

    -   e) XML deployment descriptor


