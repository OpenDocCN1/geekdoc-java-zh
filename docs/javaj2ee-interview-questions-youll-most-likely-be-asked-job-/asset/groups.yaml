    A J2EE component is a smaller unit of application software used for a particular
    purpose. Applets, Servlets, Session beans, Entity beans WAR, JAR and resource
    adapters are all different components of J2EE. A Service in J2EE can be considered
    as the next level to distributed component. It is a component that can be used
    remotely synchronously or asynchronously. This includes components such as the
    RPC, Messaging system, Sockets and web services. A service should have a well-defined
    service contract, it is independent and self-contained.


