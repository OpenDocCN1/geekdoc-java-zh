    # Internationalization and Localization


    Collation is a process which can sort strings based on locale specific customs.
    The alphabets are different for different languages and so we need a unique way
    to Sort strings as per the language. Collation is introduced for an abstract class
    that belongs to java.text package. Collator This is used for providing locale
    sensitive String comparison which does the Collation process in Java programming
    language.


    ## 192: What are the attributes used in JSP to control encoding? Answer:


    In JSP, there are two attributes used in page directive to control encoding. They
    are:


    - a) **contentType**: In this, we can specify the character set we are going to
    use and the format of the content `<@ page contentType="text/html; charset=ISO-8859-1"
    %>`. In the above line of code, we used the html format and ISO-8859 character
    set of content.


    - b) **pageEncoding**: In this, we can specify the character set we are going
    to use for the content display `<@ page pageEncoding="UTF-8" %>`. In the above
    line of code, we used UTF-8 type of encoding.


    # 193: Explain Format class. Answer:


    Format is a class which belongs to java.text package. It is an abstract class
    which is used to format locale information: Example: messages, dates, and numbers.


    Format class uses the format() method:


    - a) To format locale objects to strings and

    - b) Parse strings to objects using parseObject()


    # 194: What are the aspects of the application that have to be varied if they
    have to be deployed in different locales?:


    Answer:


    The following are the aspects which have to be varied if they have to be deployed
    in different locales:


    - a) The presentation of content, numbers, and dates

    - b) The labels on the components

    - c) Colors, Sounds, and Images

    - d) Collation (Ordering) of data presented in the page

    - e) Reading and Writing text file content


    # 195: What are the font names and font styles supported in Java?


    Answer:


    The five font names supported in java are: Serif, Sans-serif, Monospaced, Dialog,
    and DialogInput.

    The four font styles supported in java are: bold, italic, plain, and bold-italic.
    These are the standard names which are mapped to physical fonts that are installed
    in the operating system by default. The mapping of font names and styles are handled
    by font.properties.


    # 196: What are the features of java used to create internationalized application?


    Answer:


    The following are the features of java which are used to create internationalized
    application:


    - a) The class java.util.Properties is used to get localized values for the specific
    text (key)

    - b) The class java.util.Collator and CollatorKey are used for ordering data based
    on localized words

    - c) The class java.text.NumberFormat and DateFormat are used to format currencies,
    numbers and dates

    - d) The class java.io.InputStreamReader and OutputStreamWriter for writing and
    reading files

    - e) The contentType, pageEncoding, and java.util.Locale attributes are used in
    JSP

    - f) The class java.util.ResourceBundle is used for handling localized text


    # 197: What are the subclasses of Format class?


    Answer:


    The class java.text.Format has three subclasses. They are:


    - a) java.text.NumberFormat: It is used to format currencies and numbers

    - b) java.text.DateFormat: It is used to format time and date

    - c) java.text.MessageFormat: It is used to format text messages


    # 198: Explain why UTF-8 is considered the best encoding choice?


    Answer:


    UTF-8 is considered the best encoding choice for the following reasons:


    - It is supported by almost all the available web browsers

    - It provides the broadest coverage of character sets

    - It provides efficient data transmission


    # 199: What are the approaches for localizing JSP pages?


    Answer:


    There are two approaches to localize a JSP page. They are:


    - For each locale, create a JSP file and store it in different directory in the
    server. Based on the locale of the client request, invoke the respective JSP to
    display the respective localized content

    - Create one single JSP and use ResourceBundle which has the locale specific custom
    tags. So, when the client requests a page, the tags access the text from the resource
    bundle for the respective locale


    # 200: What are the advantages of creating JSP for each locale?


    Answer:


    The following are the advantages of creating JSP for each locale:


    - Customization Support: This provides full support for customizing the structure
    and display of content for each locale

    - b) Clarity in Source file: All the files properties file, resource bundle, and
    JSP are kept in one place for each locale


    # 201: Explain I18N and L10N.


    Answer:


    I18N represents Internationalization where ‘I’ denotes the starting letter and
    18 represents the 18 characters between the starting letter and ending letter
    and ‘N’ denotes the ending letter.

    L10N represents Localization where ‘L’ denotes the starting letter and 10 represents
    the 10 characters between the starting letter and ending letter and ‘N’ denotes
    the ending letter.


    # 202: Explain InputStreamReader.


    Answer:


    InputStreamReader is a class which belongs to java.io package. It is used to convert
    bytes to characters, i.e., it reads characters based on the encoding.


    # 203: Explain OutputStreamWriter.


    Answer:


    OutputStreamWriter is a class which belongs to java.io package. It is used to
    convert characters to byte streams, i.e., it writes characters based on the encoding.


    # 204: What are the advantages and disadvantages of using ResourceBundle in JSP?


    Answer:


    The following are the advantages of using ResourceBundle in JSP:


    - a) Easy to Maintain: We need to modify only one JSP to reflect the changes in
    all locales

    - b) Consistency in Structure: The page in all locales follows the same structure
    and only the data varies

    - c) Easy to Extend: We can easily define a new ResourceBundle which provides
    support for a new locale


    The following are disadvantages of using ResourceBundle:


    - a) Difficult to customize: Customizing the page structure for each locale is
    difficult

    - b) Compatibility: The encoding must be compatible


    ## Chapter 7

    ## Design Patterns


    205: How do you make sure a class is Singleton? What is the disadvantage of a
    singleton class?


    Answer:


    A singleton class is one which allows only one instance to be formed. It either
    does not have a constructor or has a private constructor and uses the implementation
    of the getInstance() method to create the only instance possible. You make a class
    Singleton by following one of the standard patterns such as synchronizing the
    getInstance() method or by using Enums if you are using a version of Java 5 or
    latest. Another common method followed is known as eager initialization wherein
    the class is instantiated at the time of loading whether or not it is used in
    the program.


    Thread-safe singleton class can be defined with a synchronized static getInstance()
    method. Using an Inner Static helper class is also an effective way to implement
    a singleton class.


    The main disadvantage of a Singleton class is that it is not reusable. We can
    create only one instance of the class. The fact that they do not follow the Single
    Responsibility principle also works against the Singleton classes. They offer
    limited flexibility to the programmers and cannot be subclassed. The synchronized
    blocks in the Singleton class definition may make the system slower.


