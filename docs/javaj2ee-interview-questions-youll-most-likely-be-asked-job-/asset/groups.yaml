    ## 133: What is deployment descriptor?


    Answer:

    Deployment descriptor is an XML file (Extensible Markup Language) in which we
    specify the transactions, security, and persistence details of EJB. In this file,
    we also specify how each part or component of an application (J2EE) should be
    deployed.


    The EJB container, at runtime, invokes automatically the services as per the values
    specified in the deployment descriptor.


    ## 134: What is a bean class?


    Answer:

    A bean class is a java class created by the bean developer which contains the
    business logic implementation methods. Based on Enterprise Java Bean requirement,
    the bean class extends javax.ejb.EntityBean or javax.ejb.SessionBean.


    ## 135: Explain context object.


    Answer:

    The context object consists of information about the current state of an instance.
    The enterprise java bean container use the context object to co-ordinate system
    services like transactions, security, persistence, etc, EJB container generates
    context object for each EJB instance. SessionBean has SessionContext and the EntityBean
    has EntityContext.


    ## 136: What are the types of session beans?


    Answer:

    There are two types of session beans. They are


    -   a) Stateful session bean: Maintains data state throughout method invocations
    (business logic), i.e., it maintains session of a particular client

    -   b) Stateless session bean: Do not maintain data state throughout method invocations.
    This type of bean utilizes the pooling feature of EJB


    ## 137: What are the methods of remote interfaces?


    Answer:

    The following are the methods of remote interfaces:


    -   a) getEJBHome(): Returns a reference to the home interface of session bean

    -   b) getPrimaryKey(): This method returns session bean primary key

    -   c) getHandle(): Returns a handle for the EJB object

    -   d) isIdentical(): This method tests if the passed enterprise bean object is
    identical to invoked enterprise bean object

    -   e) remove(): This method removes a bean (session) object


    ## 138: What are the methods of home interfaces?


    Answer:

    The following are the methods of home interfaces:


    -   a) getEJBMetaData(): This method enables client to get information about enterprise
    bean

    -   b) remove(Handle handle): This removes EJB objects identified by their handles.
    A handle is retrieved using getKey() method

    -   c) remove(Object primaryKey): This removes EJB objects which are identified
    by their primary key

    -   d) getHomeHandle(): This obtains a handle of home object. The client use this
    object to store a reference to the entity bean''s remote home interface


    ## 139: What are the services provided by the local and remote interfaces?


    Answer:

    The following are the services provided by the local and remote interfaces:


    -   a) Returns session object''s home interface

    -   b) Removes session object

    -   c) Delegates method invocations on session bean instance

    -   d) Tests if the session object is identical to another session object


