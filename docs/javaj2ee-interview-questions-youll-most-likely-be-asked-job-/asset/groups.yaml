    ## 32: What are the three best adjectives to describe you in a work setting?


    Answer:


    While these three adjectives probably already appear somewhere on your resume,
    don''t be afraid to use them again in order to highlight your best qualities.
    This is a chance for you to sell yourself to the interviewer, and to point out
    traits you possess that other candidates do not. Use the most specific and accurate
    words you can think of, and elaborate shortly on how you embody each.


    ## 33: What are the three best adjectives to describe you in your personal life?


    Answer:


    Ideally, the three adjectives that describe you in your personal life should be
    similar to the adjectives that describe you in your professional life. Employers
    appreciate consistency, and while they may be understanding of you having an alternate
    personality outside of the office, it''s best if you employ similar principles
    in your actions both on and off the clock.


    ## 34: What type of worker are you?


    Answer:


    This is an opportunity to highlight some of your greatest assets. Characterize
    some of your talents such as dedicated, self-motivated, detail-oriented, passionate,
    hard-working, analytical, or customer service focused. Stay away from your weaker
    qualities here, and remain on the target of all the wonderful things that you
    can bring to the company.


    ## 35: Tell me about your happiest day at work.


    Answer:


    Your happiest day at work should include one of your greatest professional successes,
    and how it made you feel. Stay focused on what you accomplished, and be sure to
    elaborate on how rewarding or satisfying the achievement was for you.


    ## 36: Tell me about your worst day at work.


    Answer:


    It may have been the worst day ever because of all the mistakes you made, or because
    you''d just had a huge argument with your best friend, but make sure to keep this
    answer professionally focused. Try to use an example in which something uncontrollable
    happened in the workplace (such as an important member of a team quit unexpectedly,
    which ruined your team''s meeting with a client), and focus on the frustration
    of not being in control of the situation. Keep this answer brief, and be sure
    to end with a reflection on what you learned from the day.


    ## 37: What are you passionate about?


    Answer:


    Keep this answer professionally-focused where possible, but it may also be appropriate
    to discuss personal issues you are passionate about as well (such as the environment
    or volunteering at a soup kitchen). Stick to issues that are non-controversial,
    and allow your passion to shine through as you explain what inspires you about
    the topic and how you stay actively engaged in it. Additionally, if you choose
    a personal passion, make sure it is one that does not detract from your availability
    to work or to be productive.


    ## 38: What is the piece of criticism you receive most often?


    Answer:


    An honest, candid answer to this question can greatly impress an interviewer (when,
    of course, it is coupled with an explanation of what you''re doing to improve),
    but make sure the criticism is something minimal or unrelated to your career.


    ## 39: What type of work environment do you succeed the most in?


    Answer:


    Be sure to research the company and the specific position before heading into
    the interview. Tailor your response to fit the job you''d be working in, and explain
    why you enjoy that type of environment over others. However, it''s also extremely
    important to be adaptable, so remain flexible to other environments as well.


    ## 40: Are you an emotional person?


    Answer:


    It''s best to focus on your positive emotions – passion, happiness, motivations
    – and to stay away from other extreme emotions that may cause you to appear unbalanced.
    While you want to display your excitement for the job, be sure to remain level-headed
    and cool at all times, so that the interviewer knows you''re not the type of person
    who lets emotions take you over and get in the way of your work.


    ## 41: What is the best way for a company to advertise?


    Answer:


    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and to provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as how you''ve chosen. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.


    ## 42: Is it better to gain a new customer or to keep an old one?


    Answer:


    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, well as to also gain new customers
    as they are likely to recommend your company to friends.


    ## 43: What is the best way to win clients from competitors?


    Answer:


    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your interviewer adheres to a specific thought or practice,
    it''s best to keep this question general. Rather than using absolute language,
    focus on the benefits of one or two strategies and show a clear, critical understanding
    of how these ways can succeed in a practical application.


    ## 44: How do you feel about companies monitoring internet usage?


    Answer:


    Generally speaking, most companies will monitor some degree of internet usage
    over their employees – and during an interview is not the best time to rebel against
    this practice. Instead, focus on positive aspects as the way it can lead to increased
    productivity for some employees who may be easily lost in the world of resourceful
    information available to them.


    ## 45: What is your first impression of our company?


    Answer:


    Obviously, this should be a positive answer! Pick out a couple key components
    of the company''s message or goals that you especially identify with or that pertain
    to your experience, discuss why you believe these missions are so important.


    ## 46: Tell me about your personal philosophy on business.


    Answer:


    Your personal philosophy on business should be well-thought out, and in line with
    the missions and objectives of the company. Stay focused on positive aspects such
    as the service it can provide, and the lessons people gain in business, and offer
    insight as to where your philosophy has come from.


    ## 47: What''s most important in a business model: sales, customer service, marketing,
    management, etc.?


    Answer:


    For many positions, it may be a good strategy to tailor this answer to the type
    of field you''re working in, and explain why that aspect of business is key. However,
    by explaining that each aspect is integral to the function as a whole, you can
    display a greater sense of business savvy to the interviewer and may stand out
    in his or her mind as a particularly aware candidate.


    ## 48: How do you keep up with news and emerging trends in the field?


    Answer:


    The interviewer wants to see that you are aware of what''s currently going on
    in your field. It is important that your education does not stop after college,
    and the most successful candidates will have a list of resources they regularly
    turn to already in place, so that they may stay aware and engaged in developing
    trends.


    ## 49: Would you have a problem adhering to company policies on social media?


    Answer:


    Social media concerns in the workplace have become a greater issue, and many companies
    now outline policies for the use of social media. Interviews will want to be assured
    that you won''t have a problem adhering to company standards, and that you will
    maintain a consistent, professional image both in the office and online.


    ## 50: Tell me about one of the greatest problems facing X industry today.


    Answer:


    If you''re involved in your career field, and spend time on your own studying
    trends and new developments, you should be able to display an awareness of both
    problems and potential solutions coming up head in the industry. Research some
    of the latest news before heading into the interview, and be prepared to discuss
    current events thoroughly.


