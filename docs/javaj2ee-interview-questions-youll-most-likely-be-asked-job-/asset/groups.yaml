    \ 的实例不存在\n- b) 池化状态（Pooled state）：在此状态下，bean 的实例存在，但未与任何实体 bean 对象关联\n- c) 就绪状态（Ready\
    \ state）：在此状态下，bean 的实例与实体 bean 对象关联，并具有身份标识\n\n## 160: 容器在实体 bean 生命周期周期内调用了哪些方法？\n\
    \n答案：\n\n在实体 bean 生命周期周期内，会调用以下方法：\n\n- a) ejbActivate()：当 bean 实例就绪并与池中的实体 bean\
    \ 对象关联时，会调用此方法\n- b) ejbLoad()：容器使用此方法从数据源调用数据\n- c) ejbStore():容器使用此方法将数据持久化地存储在数据资源中\n\
    - d) ejbRemove():通过此方法移除与 bean 关联的实例，并从 home 接口或远程接口调用\n- e) ejbPassivate():EJB\
    \ 容器使用此方法将 bean 实例与 EJB 对象解关联并发送到池中\n\n## 161: 实体 bean（entity beans）的用途是什么？\n\n\
    答案：\n\n以下是实体 bean 的用途：\n\n- a) 具有唯一标识的领域对象，供多个客户端共享\n- b) 强制数据完整性和持久化\n- c) 数据源中的记录，而不是与客户端维护会话\n\
    - d) 用于 BMP（Bean 管理持久化）或 CMP（容器托管持久化）\n- e) 缓存数据从而重用数据并防止频繁的数据库连接\n\n## 162: 部署描述符（deployment\
    \ descriptor）中指定了哪些元素？\n\n答案：\n\n部署描述符指定了以下元素：\n\n- a) session：将 bean 定义为 session\
    \ bean 而不是实体 bean\n- b) session-type：我们可以将 session 定义为无状态（stateless）或有状态（stateful）\n\
    - c) **enterprise-beans**：使用此项，可以将 bean 声明为 session bean 或实体 bean\n- d) **ejb-name**：用于指定\
    \ session bean 或实体 bean 的唯一名称\n- e) ejb-jar：这是部署描述符的根元素\n- f) ejb-class：用于指定企业\
    \ bean 的类\n- g) home：用于指定企业 bean 的 home 接口\n- h) remote：用于指定企业 bean 的远程接口\n- i)\
    \ transaction-type：用于指定事务是由 EJB 容器执行还是企业 bean 执行\n\n## 163: 解释如何为有状态 session bean（stateful\
    \ session bean）创建 home 接口。\n\n**答案：**\n\n我们可以按照如下方式为有状态 session bean 创建 home 接口：\n\
    ```java\nimport java.rmi.*;\nimport javax.ejb.*;\n\npublic interface MySFSRemoteHome\
    \ extends EJBHome {\n    public MySFSRemoteHome create(int i) throws\n    RemoteException,\
    \ CreateException;\n}\n```\n\nhome 接口中的 `create()` 方法对应于 bean 代码中的 `ejbCreate()`\
    \ 方法。\n\n## 164: 解释如何为有状态 session bean 创建远程接口（remote interface）。\n\n答案：\n\n```java\n\
    我们可以按照如下方式为有状态 session bean 创建远程接口：\nimport java.rmi.*;\nimport javax.ejb.*;\n\
    public interface MySFSSRemote extends EJBOject {\n    public int size() throws\
    \ RemoteException;\n}\n```\n\n当客户端想要调用 EJB 对象时，它们必须使用这个远程接口。EJB 容器负责将调用委托给实际的\
    \ bean 代码。\n\n## 165: 解释如何创建一个有状态 session bean 类（stateful session bean class）。\n\
    \n答案：\n\n```java\n我们可以按照如下方式创建有状态 session bean 类：\nimport javax.ejb.*;\npublic\
    \ class MySFSBean implements SessionBean {\n    private SessionContext sContext;\n\
    \    private int iCount;\n    public void ejbCreate(int myParam) throws CreateException\
    \ {\n        this.iCount = myParam;\n    }\n    public void ejbActivate() {}\n\
    \    public void ejbPassivate() {}\n    public void ejbRemove() {}\n    public\
    \ int size() {\n        return iCount;\n    }\n}\n```\n\n在上述代码中，当 bean 被创建时，计数器被赋予参数值。根据规范，我们必须实现业务方法\
    \ `size` 以及所有的 `ejbRemove`、`ejbActivate` 和 `ejbPassivate` 方法。\n\n## 166: 什么是访问方法（accessor\
    \ methods）？\n\n答案：\n\n当我们使用容器托管持久化（container managed persistence）时，为了访问数据存储，我们不直接使用读写方法。相反，我们使用作为访问方法的\
    \ `get` 和 `set` 方法。\n\n例如，`getName()` 和 `setName(String name)` 是字段 `name` 的访问方法。\n\
    \n## 167: 解释 EntityContext。\n\n答案：\n\nEJB 容器通过 EntityContext 提供实体 bean 实例。EntityContext\
    \ 提供与实体 bean 实例关联的任何对象引用，包括 EJB 对象、EJB 本 对象以及主键。\n\n对 EJB 对象、EJB 本 对象和主键的访问\n\n\
    ## 168: 解释 getEntityHome, getLocalHome 和 getCallerPrincipal。\n\n答案：\n\ngetEJBHome()：返回企业\
    \ bean 的远程接口。\ngetEJBLocalHome()：返回企业 bean 的本地接口。\ngetCallerPrincipal()：标识调用者主体。\n\
    \n## 169: 解释 getRollBack, setRollBack 和 getUserTransaction。\n\n答案：\n\ngetRollBack()：通过此方法可以标识现有事务是否已设置为回滚。\n\
    setRollBack()：通过此方法，我们可以设置特定事务的结果。\ngetUserTransaction()：此方法不应由实体 bean 调用，返回 javax.transaction.UserTransaction。\n\
    \n## 170: 解释事务（Transaction）。\n\n答案：\n\n事务是一个执行工作单元或原子操作的任务。如果任务执行失败，事务将撤销或回滚。事务通常被称为\
    \ ACID。ACID 指原子性、一致性、隔离性和持久性。\n\n## 171: 容器托管事务可用哪些事务属性？\n\n答案：\n\n以下是容器托管事务：\n\
    \n- a) Required（需要）：在此情况下，如果事务不存在，容器将启动新事务。\n- b) RequiresNew（需要）：在此情况下，容器为方法调用创建事务。\n\
    - c) Supports（支持）：在此情况下，bean 可以在没有事务的情况下执行。\n- d) Unsupported（不支持）：在此情况下，bean\
    \ 不能在事务中调用。\n- e) Never（从不）：在此情况下，bean 永远不会执行事务。\n- f) Mandatory（强制）：在此情况下，每次方法调用都需要事务上下文\n\
    \n## 172: 容器如何管理多个事务？\n\n答案：\n\n容器通过以下两种方式管理多个事务：\n\n- a) EJB 容器实例化多个企业 bean，从而允许数据库处理与事务处理相关的所有问题。\n\
    - b) EJB 容器对企业 bean 的数据库状态获取排他锁，从而实现多个事务对实例的序列化访问。\n\n## 173: 解释 JTS。\n\n答案：\n\
    \nJTS 指 Java Transaction Service。它指定了 Java Transaction API 的事务管理器实现。它支持分布式事务，即由多个事务管理器支持多个数据库。通过\
    \ JTS，容器确保事务可以跨越多个容器。\n\n## 174: EJB 容器提供哪些服务？\n\n答案：\n\nEJB 容器提供以下服务：\n\n- a)\
    \ 事务管理：容器管理事务的启动、参与、回滚和提交。\n- b) 生命周期管理：包括 bean 的创建、销毁、激活和钝化。\n- c) 持久化：bean 不直接从数据库检索或存储数据，而是通过容器的帮助完成。\n\
    - d) 状态管理：容器自动管理 bean 对象的状态。\n\n"
