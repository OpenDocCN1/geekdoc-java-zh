    +   f) SAX does not maintain comments while DOM maintains comments


    +   g) SAX parser is faster as it parses node by node and the DOM parser is a
    little slower since it loads the entire XML document into the memory first and
    then parses it.


    # 5: What is the difference between a component and a service?

