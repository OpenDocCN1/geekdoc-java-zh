    # 57: Explain how to prevent performance problems.


    Answer:


    Performance problems can be prevented by the following ways:


    +   a) If the service requires only local access, then never use EJB object but
    just use java object


    +   b) If you want one bean to access another within the same bean container and
    Virtual Machine, then use local interfaces


    +   c) Use single remote call and combine all data instead of multiple remote
    calls


    +   d) Modify unnecessary variable and control serialization


    +   e) To avoid JNDI lookup, cache EJBHome reference


    # 58: Explain a security guideline.


    Answer:


    The purpose of a security mechanism is to support end-to-end security by integrating
    existing environments. This process is called Identity management.


    Security is handled by creating user accounts in all the application domains and
    OS (Operating Systems). Also, the security guideline should support authorization
    and authentication.'
