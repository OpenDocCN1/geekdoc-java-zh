  mdcn: "\n\nb) EJBObject 为会话豆（session bean）的方法提供了访问支持\n\nc) Stub（Stub）作为远程 EJBObjects\
    \ 的代理\n\nd) 调用和分发机制由 tie 类提供，该类将代理绑定到 EJBObject\n\n## 141: 解释本地客户端（local client）。\n\
    \n答案：\n\n会话豆的客户端称为本地客户端。本地客户端通过本地接口（javax.ejb.EJBLocalObject）和本地 home 接口（javax.ejb.EJBLocalHome）访问会话豆。\n\
    \n本地客户端作为会话豆存在于 JVM 内部，它们是依赖于位置的。本地客户端通过引用方式将对象作为参数传递的方法。\n\n## 142: 解释远程客户端（remote\
    \ client）。\n\n答案：\n\n会话豆的客户端称为远程客户端。远程客户端通过远程接口（javax.ejb.EJBObject）和远程 home 接口（javax.ejb.EJBHome）访问会话豆。\n\
    \n远程客户端通过 EJB 容器访问基于 CORBA 的应用程序，该应用程序使用远程方法调用互联网拦截对象中间件协议（Internet Inter ORB\
    \ Protocol），这是一种非 Java 的程序。\n\n## 143: 我们什么时候需要使用 EJB？\n\n答案：\n\n在以下场景中我们需要使用\
    \ EJB（Enterprise Java Beans - 会话豆和实体豆）：\n\n- a) 为了跨方法调用存储客户端信息，使用有状态会话豆（stateful\
    \ session bean）\n- b) 对于持久化数据，使用实体豆（entity bean）\n- c) 向应用程序服务器或 EJB 容器通信活动客户端的存在，使用有状态会话豆\n\
    - d) 为了调用 EJB 容器的池化功能，使用无状态会话豆（stateless session bean）\n\n## 144: 如何管理豆的持久化？\n\
    \n答案：\n\n管理豆持久化有两种方法。它们是：\n\n- a) BMP（豆管理的持久化）：在这种情况下，我们可以通过管理一个豆类来管理持久化\n- b)\
    \ CMP（容器管理的持久化）：在这种情况下，容器负责管理持久化\n\n## 145: 解释豆管理的持久化（bean managed persistence）。\n\
    \n答案：\n\n实体豆实现了豆管理的持久化。在这种情况下，豆通过直接的 DB（数据库）调用来存储和检索信息。\n\n实体豆使用 JDBC（Java 数据库连接）或\
    \ SQLJ 从数据库中存储和检索信息。\n\n## 146: 解释容器管理的持久化（container managed persistence）。\n\n\
    答案：\n\n实体豆实现了容器管理的持久化。在这种情况下，容器使用标准 API 访问数据库。\n\n容器管理的持久化使得应用程序可以使用任何数据库。容器还提供了工具，将实体豆的实例变量映射到对底层\
    \ DB（数据库）的调用。\n\n## 147: 解释你将如何创建无状态会话豆的 home 接口。\n\n答案：\n\n无状态会话豆的 home 接口可以如下：\n\
    \n```java\nimport javax.ejb.*;\nimport java.rmi.*;\npublic interface MYSLSRemoteHome\
    \ extends EJBHome {\n    public MySLSRemote create() throws RemoteException, CreateException;\n\
    }\n```\n\n该接口作为 EJB 对象的工厂。豆代码中的 `create()` 方法对应于 `ejbCreate()` 方法。\n\n## 148:\
    \ 解释你将如何创建无状态会话豆的远程接口（remote interface）。\n\n答案：\n\n无状态会话豆的远程接口可以如下：\n\n```java\n\
    import javax.ejb.*;\nimport java.rmi.*;\npublic interface MYSLSRemote extends\
    \ EJBObject {\n    public String getMessage() throws RemoteException;\n}\n```\n\
    \n该接口在客户端需要调用 EJB 对象时使用。该接口的职责是将后续调用委托给企业豆（enterprise bean）。\n\n## 149: 解释 InitialContext。\n\
    \n答案：\n\nInitialContext 是一个类，作为客户端与 JNDI（Java 命名目录接口）的接口。InitialContext 包含了允许客户端绑定命名服务如\
    \ JNDI、CORBA 和 DNS（域名命名服务）的信息。\n\n如果 InitialContext 对象出现问题或在调用其方法之一时出现问题，会抛出 `javax.naming.NamingException`。\n\
    \n## 150: EJB 容器中池化（pooling）的好处是什么？\n\n答案：\n\n以下是 EJB 容器中豆池化的好处：\n\n- a) 与多个用户共享资源\n\
    - b) 我们可以在部署描述符中指定用于池化和重用的实例\n- c) 允许服务器（应用程序）处理高流量请求\n\n## 151: 在实体豆和资源之间使用 DAO\
    \ 的好处是什么？\n\n答案：\n\n以下是使用 DAO（数据访问对象）的好处：\n\n- a) CMP（容器管理的持久化）支持多个数据库\n- b) 它支持非数据类型\n\
    - c) 它支持遗留应用程序\n- d) 它支持各种 SQL 服务器\n- e) 它提供了可移植性\n\n## 152: 解释 EJB 容器在管理生命周期中的作用。\n\
    \n答案：\n\n以下是 EJB 容器的作用：\n\n- a) 容器用实例填充池\n- b) 容器调用豆类中的 `create()` 方法\n- c) 容器返回\
    \ home 对象的引用\n- d) 容器调用豆类中的 `ejbPassivate` 方法\n- e) 容器为客户端调用实体豆的业务方法\n- f) 容器最终将豆移动到池\n\
    \n## 153: CMP 的好处是什么？\n\n答案：\n\n以下是 CMP（容器管理的持久化）的好处：\n\n- a) 它具有特定的容器搜索功能\n-\
    \ b) 它支持所有现有的数据库\n\n## 154: BMP 的好处是什么？\n\n答案：\n\n以下是 BMP（豆管理的持久化）的好处：\n\n- a)\
    \ 实体豆代码是独立于容器的\n- b) 可以使用 Java 数据库连接 API（应用程序接口）访问数据库\n- c) 它支持非数据类型\n- d) 它支持各种\
    \ SQL 服务器\n\n## 155: CMP 的缺点是什么？\n\n答案：\n\n以下是 CMP（容器管理的持久化）的缺点：\n\n- a) 可移植性：可能会丢失其他\
    \ EJB 的移植性\n- b) 算法：可以使用容器支持的算法\n- c) 效率：考虑到性能，生成的 SQL 有时是高效的\n- d) 访问：源代码开发者无法访问视图\n\
    \n## 156: BMP 的缺点是什么？\n\n答案：\n\n以下是 BMP（豆管理的持久化）的缺点：\n\n- a) 特定数据库：由于开发了特定数据库的豆，如果需要访问多个数据库，豆开发者必须重写代码\n\
    - b) SQL 知识：豆提供者必须具备 SQL 知识\n- c) 时间：开发豆持久化的豆需要花费 5 倍的时间\n\n## 157: 如何使用 BMP 实现持久化？\n\
    \n答案：\n\n通过以下两种类型的方法来实现持久化数据。它们是：\n\n- `ejbLoad`：该方法用于与企业 Java 豆容器启动数据库通信\n- `ejbStore`：该方法用于通过手动编码使用\
    \ JDBC API 存储数据\n\n## 158: 解释查找方法（finder methods）。\n\n答案：\n\n查找方法以 `find` 为前缀，并在实体豆的\
    \ home 接口中创建。例如，`findPrimaryKey()` 是查找方法，用于根据唯一主键对象从 home 接口识别实体豆对象。\n\n`MyRemoteHome\
    \ myHome = (MyRemoteHome) java.rmi.PortableRemoteObject.narrow(initialContext.lookup(\"\
    java:obj/book\"), MyRemoteHome.class)`\n\n`Book book = myHome.findPrimaryKey(\"\
    91-7822-323-6\");`\n\n"
