    # 104: What are the predefined JSP objects other than request, response, session,
    and out?


    Answer:


    The following are the predefined JSP objects other than request, response, session,
    and out:


    +   a) application: Using this object, the value of variable made available to
    all the servlets (JSP) which exists for an application

    b) page: This object is a replacement for ‘this’ and is used to retain the value
    for a particular page

    c) pageContext: This object is used to store shared data across multiple pages

    d) config: Using this object, the value of variable is made available to the particular
    page


