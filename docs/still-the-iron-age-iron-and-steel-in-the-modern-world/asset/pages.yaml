    thanks to a combination of technical advances that made it more productive and
    more efficient and brought unprecedented expansion of aggregate output. The first
    half of the nineteenth century brought fewer innovations, but the key technical
    advance of the period, the introduction and widespread adoption of hot blast,
    had tremendous impacts on both the efficiency and productivity of blast furnaces.


