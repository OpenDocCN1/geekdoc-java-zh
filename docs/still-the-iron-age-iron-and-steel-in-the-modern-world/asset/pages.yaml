    # Reinforcing bars Hot-rolled steel pieces cut out into various lengths in strengthening
    concrete in buildings, highways, runways, dams, and bridges.


    Reverberatory furnace is designed in a way that the fuel and the molten metal
    are separated: usual arrangement is with heat reverberating (reflected from) a
    low sloping furnace roof and sides.


    Rolling is a process that has been used for more than a century to turn steel
    into semifinished shapes, and now also into finished products. it began with cast
    steel ingots; now it is a part of continuous casting. Three basic kinds of semifinished
    products are slabs, billets, and blooms, but continuous casting can also produce
    slabs and thin strips. Rolling can be done hot or cold. Hot-rolled coils are strips
    2–7 mm thick and between 0.6 and 1.2 m wide that are used (with without further
    processing) in construction, transportation, and pipelines.


    Scrap is any metallic waste material suitable for recycling (after sorting and
    shredding). Steel scrap is the principal feed for electric arc furnaces.


    Sections Hot-rolled pieces including beams and sheet piles used in buildings and
    in industrial and highway construction.


    Slabs are wide and thick pieces of steel with rectangular cross-sections, now
    produced by continuous casting and then converted by further rolling into thin
    slabs, sheets, plates, pipes, and tubes.


    Slag is a by-product of pig iron production, produced by melting iron ore (or
    its pellets), coke, and a flux (limestone or dolomite) in a blast furnace as lime
    in the flux combines with the aluminates and silicates in the ore and with coke
    slag. Molten slag can be cooled in different ways to produce several kinds of
    solid material used in cement production, construction, and as a fertilizer.'
