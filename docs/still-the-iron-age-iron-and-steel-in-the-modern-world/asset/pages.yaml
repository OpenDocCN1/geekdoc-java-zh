  md: 'Martensite is a body-centric tetrahedral structure that arises from rapid cooling
    of austenite. This supersaturated solution of carbon in iron imparts strength
    and toughness to steel.


    Open hearth furnace was a large, shallow basin lined with refractories covered
    with a low arched roof. The furnace received molten pig iron, scrap, and fluxing
    materials and removed carbon during a lengthy period of heating by a gaseous fuel.


    Pellets of iron are made from ground iron fines mixed with fluxing materials and
    binders; coke or coal can also be added to aid the firing process. Pellets with
    diameters of 9–16 mm are processed in induration machines under temperatures of
    up to 1350°C.


    Pig iron is the term used interchangeably with cast iron: as the International
    Iron Metallurgy Explained, the hot metal was traditionally cast into multiple
    sand molds branching from a central channel, a configuration resembling a litter
    of piglets suckling a sow, and after cooling these small ingots (the pigs) were
    broken off, cooled, and used for further processing (IIMA, 2014).


    Plates Hot-rolled pieces (2–20 mm thick, up to 1.86 m wide) used to make structural
    steel products, ship hulls, boilers, pressure vessels, pipes, and various heavy
    metal structures, including offshore drilling platforms.


    Puddling is a labor-intensive and very strenuous process to make wrought iron
    through decarbonization of cast (pig) iron by stirring the hot iron bath and forming
    heavy balls of malleable metal.


    Removal of oxygen in a chemical reaction. Smelting of ores and production of iron
    in blast furnaces is the world’s most common chemical reduction. The principal
    process of direct reduction is Fe₂O₃ + 3C → 2Fe +3CO, while indirect reduction
    taking place in a blast furnace proceeds in a series of reactions:'
