    advances that transformed ironmaking and steelmaking into indispensable (albeit
    not so curiously overlooked and unappreciated) industries supplying a variety
    of alloys, without whose mass-scale applications there could be no affluence for
    the haves and no hope for the have-nots.


    No less importantly, more efficient use of raw materials and considerable reduction
    of specific energy consumption have been integral parts of these production advances
    and, in, they have greatly lowered the industry’s environmental impact: producing
    today’s mass of iron and steel with the techniques that prevailed century ago
    would be materially wasteful, energetically unaffordable, and environmentally
    intolerable. I will review all of these technical advances by looking at key performance
