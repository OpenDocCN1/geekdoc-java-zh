    the quest to reduce CO₂ emissions from the iron and steel industry.


    Given the world''s still growing population and huge unmet demand for steel in
    low- and medium-income countries of Asia, Latin America, and Africa (associated
    with the transition to modern, high-energy urbanized societies), there is no early
    possibility of any lasting absolute dematerialization on the worldwide scale:
    there may be temporary declines but in the long run global steel consumption will
    continue to grow. At the same time, relative dematerialization (per unit of a
    final product per unit of national GDP) will continue, and societies will be able
    to derive more value and enjoy higher standards of living with progressively lower
    inputs of steel.


    All principal iron- and steelmaking methods—blast furnaces (BFs), basic oxygen
    furnaces (BOFs), electric arc furnaces (EAFs), continuous casting—are now technically
    mature, as the processes required to produce raw materials (extraction of coal,
    iron ore, and fluxes materials, production of coke, sinter, and pellets). All
    of these techniques will see further gains and further reductions of environmental
    impacts, all of these improvements will be relatively small, and new techniques
    will be needed to bring fundamental technical and economic departures. I will
    look at the options and their likely commercial success in the chapter''s penultimate
    section.


    Finally, I will take a brief look at future steel consumption levels, and although
    I will cite some published near- and longer estimates, I will not offer my specific
    (and inevitably inaccurate) forecasts but instead I will review some key factors
    whose combination will determine the future rates of demand and production. Existing
    ironmaking and steelmaking processes and their continuing gradual improvements
    could supply all the steel needed by the middle of the twenty-first century. Beyond
    that time the fortunes of the world''s most fundamental metal industry will greatly
    depend on the pace of the unfolding global warming and on the state of our efforts
    to transit to economies that use the Earth''s resources more rationally.


