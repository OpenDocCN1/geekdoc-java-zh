    # Abstract


    Before 1973, energy supply was just another factor in doing business, because
    for most industries the total cost of purchased energy was not a particularly
    onerous burden (at that point, the inflation-adjusted price of oil had been going
    down for more than two decades), and only the makers of the most energy-intensive
    products had explicit worries about the cost of fuels and electricity and about
    the total energy required by their industries. The two rounds of oil price rises
    during the 1970s swiftly elevated energy supply, energy cost, and energy requirements
    to major economic, social, and political concerns as all industries, and especially
    major consumers of fuels and electricity, began to look for ways to reduce their
    energy consumption and to lower the final energy intensity of their products.


