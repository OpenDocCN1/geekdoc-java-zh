  md: 'Without exaggeration, swift diffusion of basic oxygen furnaces (BOFs) and of
    continuous casting have revolutionized the industry through higher efficiencies,
    reduced waste, and rising productivity. The third major pillar of modern steelmaking,
    smelting of recycled scrap metal furnaces (EAFs), is a process that has been practised
    for more than a century, but only in recent decades it has become more than an
    also-run compared to open furnaces (OHFs) or BOFs: it is the dominant (more than
    90%) steelmaking process in the Middle East (using scrap and DRI), Africa (nearly
    70%), and in the United States (about 60%), and it produces nearly 30% of the
    world’s crude steel (WSA, 2015). In this chapter, I will review technical advances
    and the best recent performances of BOF and EAF melting and continuous casting,
    and in the next chapter, I will focus on material flows of iron- and steelmaking
    processes and on their energy requirements.


    # New Blast Furnaces


    Development of modern blast furnaces during the past 100 years can be followed
    in books by Boylan (1975), Boyleston (1936), Geerdes, Toxopeus, and van der Vliet
    (2009), Hogan (1971), King (1948), Lovis (2005) and Peacey and Davenport (1997).
    An illustrated look at their construction, charging, and ancillary operations
    (hot blast stoves, casting, slag processing) is offered by one of their leading
    builders (Siemens VAI, 2008). A unique tribute to their former glory was assembled
    by Becher and Becher (1990): the couple had traveled widely in the regions of
    American and European ironmaking—Pennsylvania, Ohio, Indiana, Alabama, Ruhrgegebiet,
    Saarland, Lorraine—to photograph more than 200 blast furnaces, working and anchored,
    in order to document the now classic phase of Western industrialization.


    After more than a century of growth, modern blast furnaces reached their capacity
    plateau between 1973 and 1980. As already noted, the world’s largest blast furnace
    (No. 2 furnace at Nippon Steel Oita Works) was blown-in in 1976. Its start-up
    was (on February 13, 1973) by the completion of Europe’s largest blast furnace,
    and it followed (in October 1980) by the blowing-in of America’s largest furnace.
    Europe’s record holder was Schwelgern 1 at August-Thyssen Hütte in Duisburg-'
