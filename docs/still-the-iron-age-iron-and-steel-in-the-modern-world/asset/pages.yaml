  md: '# Preface and Acknowledgments


    My books are expressions of my preference for writing about fundamental realities,
    be they natural or anthropogenic, and their complex interactions. That is why
    I have written extensively on the Earth’s biosphere and its transformations by
    humans, on production of foods and changing diets, on energy resources and on
    material foundations of our civilization. Besides dealing with these matters in
    systematic, universal and generalized manner (the best example would be General
    Energetics, Global Ecology, Feeding the World, Energy in Nature and Society, Harvesting
    the Biosphere and Making the Modern World) I have taken some closer looks, writing
    books focusing on specific fundamentals of modern civilization: on wood and other
    biofuels (Biomass Energies), on oil (Oil: A Beginner’s Guide), natural gas (Natural
    Gas: Fuel for the 21st Century), ammonia (Enriching the Earth), Diesel engines
    and gas turbines (Prime Movers of Globalization), and meat (Should We Eat Meat?).
    This book is simply a continuation of my efforts to deal with such fundamental
    realities and it has been on my list of do items since the early 1990s I began
    to study the long history and remarkable accomplishments of iron smelting and
    steel making.


    Those who appreciate the physical foundations of modern societies do not need
    any convincing proof about the topic’s importance. Those who think that mobile
    phones and Facebook and Twitter accounts are the fundamentals as well as the pinnacles
    of modern civilization might find the book about iron and steel inexplicably antiquated:
    their realities appear to be purely-based. That, of course, demonstrate deep lack
    of understanding of how the world works. Modern civilization could exist without
    mobile phones and “social media”; indeed, in the first instance it did so until
    the 1990s (beginning of large-scale adoption of cellphones) and in the second
    instance until the late 2000s (when the Facebook membership took off). In contrast,
    none of its great accomplishments—its surfeit of energy, its'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'abundance of food, its high quality of life, unprecedented longevity and mobility
    and, indeed, its electronic infatuations—would be possible without massive smelting
    of iron and production (and increasingly also recycling) of steel.


    In the 1830s Danish archaeologist Christian Jürensen Thomsen (1788–1865) distinguished
    three great civilization based on their dominant hard materials, with the Bronze
    Age following the Stone Age and preceding the Iron Age (Thomsen, 1836). Transition
    from stone to bronze began before 300 BCE in the Near East and just a bit later
    in Europe, the onset of Iron Age was around 1200 BCE but it took 700–1000 years
    before the metal became dominant throughout Asia and Europe. When Thomsen made
    his division, the Iron Age was mostly 2000–2500 years old, but the time of the
    greatest dependence on the metal was still to come, and at the beginning of the
    twenty-first century no other material has emerged to end that dominance. Ours
    isis—still and more than ever—the Iron Age although most of the metal is now deployed
    as many varieties of steel, alloys of iron and carbon (typically less than 2%)
    and of other metals that impart many desirable qualities in pure element iron.


    The great nineteenth-century surge in iron melting and steel production continued
    during the twentieth century as the long-lasting US leadership shifted to Japan
    after 1960. Four decades later the rapid expansion of China’s economy brought
    the iron and steel output to unprecedented levels during the first decade of the
    twenty-first century. 2015 iron extraction was more than 2 billion tonnes (Gt),
    the mass surpassed by the annual output of fossil fuels and bulk construction
    materials; pig (cast) iron production (smelting of iron ores in blast furnaces)
    rose to more than 1 Gt; and the global steel output (from pig iron or from recycled
    metal) reached about 1.7 Gt. That output was 60 times higher than in 1900, and
    roughly 20 times larger than the aggregate smelting of aluminum, copper, zinc,
    lead and tin. And in per capita terms worldwide steel output rose by an order
    of magnitude, from 20 kg/year in 1900 to 230 kg/year by 2010.


    Perhaps the best way to stress the importance of steel in modern society is to
    note that so many components, parts, machines and assemblies are made of steel
    that just about everything around us is made or moved with it. Although naked
    steel is not uncommon—ranging from such small'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'items as needles, pins, nails, construction, laboratory and medical tools to
    slender broadcasting towers, wires, cables, rails and bridge spans and girders—most
    of the metal incorporated in modern products is hidden (inside structures as reinforcing
    bars in concrete, skeletons of large buildings, inside machines as engines and
    turbines or underground in piles, pipelines, tunnels and mine props) or covered
    by layers of paint (welded ship hulls, construction machinery, cars, appliances,
    storage tanks).


    The list of items and services whose reliability and affordability have been made
    possible by steel is nearly as critical as components of virtually all machines,
    transportation and manufacturing machines and processes are made of the metal
    and myriad of non-steel products ranging from ammonia (synthesized in large steel
    columns) to wooden furniture (cut by steel saws), and from plastic products (formed
    in steel molds) and to textiles (woven on steel machines). And steel’s qualities
    have improved as its uses spread. High strength steel forms the skeletons of skyscrapers
    and prevents ceilings from caving in de deep coal mines; when alloyed with Cr,
    Mn, Ni, V, and other metals steels can be used in corrosive environment or operate
    under high temperatures and pressures, as stainless steel blades of large steam
    turbines that are the world''s dominant generators of electricity. Woven steel
    cables suspend the world''s longest bridges and steel makes up the bulk of products
    ranging from oceango vessels, cars, refrigerators, and productive assemblies ranging
    from large refineries to massive offshore drilling rigs.


    The verdict is easy: although the last two generations have seen an enormous amount
    of attention paid to many admirable advances in electronics, affluent civilization
    without microchips and ubiquitous telecommunication is perfectly possible; in
    contrast, modern high-income, high-energy societies would be impossible without
    steel. First things first: ours is still much when we will the Iron Age, and this
    book will trace its genesis, slow pre-industrial progress, revolutionary advances
    during the nineteenth century and their further magnification during the past
    five generations. Afterwards I will look at the patterns of modern steel production,
    the metal’s ubiquitous uses, potential substitutions, advances in relative dematerialization
    and, without any counterproductive time-specific forecasting, I will close the
    book with a brief appraisal of steel’s possible futures.'
