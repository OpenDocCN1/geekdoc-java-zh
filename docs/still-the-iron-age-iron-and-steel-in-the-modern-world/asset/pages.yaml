  md: '# CHAPTER 5


    # Modern Ironmaking and

    Steelmaking


    # Furnaces, Processes, and Casting


    # Abstract


    In this chapter, I will first review the state-of-the-art performances of modern
    ironmaking, both in the world''s largest blast furnaces and by the direct reduction
    of iron (DRI). The DRI processes represent a fundamental ironmaking innovation
    of the post-WW II era, although they have enjoyed some commercial success and
    are now operating in two dozen countries, these new metallurgical techniques have
    not fulfilled their early promise: by 2015 only about 5% of the global iron output
    originated in DRI plants. In contrast, the state-of-the-art processes of modern
    steelmaking include two processes that were introduced only during the 1950s but
    whose worldwide adoption has been (a few notable exceptions aside) extraordinarily
    rapid.


