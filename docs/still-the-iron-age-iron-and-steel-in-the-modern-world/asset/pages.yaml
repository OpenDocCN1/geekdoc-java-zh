  md: 'Continuous casting eliminated energy-wasting batch production, with steel cast
    into ingots before its further processing. The idea originated with Henry Bessemer
    in the 1860s, but it became a commercial reality only during the 1950s, and now
    virtually all modern steel is cast continuously to produce slabs, blooms, and
    sheets.


    Decarburization (decarbonization) is a process removing carbon from cast iron.
    This was traditionally by laborious puddling, since the 1860s it has been accomplished
    in Bessemer converters. Open hearth furnaces were dominant until after WW II,
    and now the process is done either in basic oxygen furnaces or in electric arc
    furnaces.


    Direct reduction of iron produces the metal by reacting iron ore (usually pellets)
    with a reducing agent (most commonly gas) at temperatures below iron''s melting
    point, yielding sponge ore or briquettes.


    Ductility measures the degree to which a material can deform under tensile stress.
    Ductile (malleable) metals can be hammered out or pressed into sheets, drawn into
    wires, and molded into shapes. High-strength ductile sheet steel is the most important
    material for modern car bodies.


    Electric arc furnace is a massive tiltable container lined with refractory material
    whose charge (mostly scrap metal) is heated by an arc between large carbon electrodes
    inserted through its top. The furnace produces molten steel in batches of tens
    to hundreds of tonnes after heats typically 30–45 min.


    Eutectic point indicates the chemical composition and temperature of the lowest
    melting point for a mixture of components. Eutectic points of iron–carbon mixtures
    can be found on liquid–solid phase diagrams (composition on the horizontal axis,
    temperature on the vertical axis).


    Ferrite is a body-centric cubic structure of iron formed as the metal is cooled
    below 1538°C. Further cooling produces a denser face-centered cubic structure
    of austenite.'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'Ferrous alloys are, in the broadest sense, **iron**-based alloys including
    all varieties of **steel**. According to a narrower definition ferroalloys combine
    **iron** with relatively high shares of other elements, including aluminum, chromium,
    manganese, and silicon.


    **Flux** is crushed limestone or dolomite (or their combination) charged into
    a **blast furnace** together with **iron ore** and **coke**. Its melting removes
    sulfur and other impurities from the molten metal, and forms metallurgical **slag**.


    **Impact strength** is a standard measure of toughness. The Charpy V-notch test
    is used to measure energy needed to break a small notched specimen (at a given
    temperature) by a single impact from a pendulum. The minimal impact energy of
    **steel** ranges between 27 and 40 J.


    **Iron** is the most common heavy metal found in the Earth''s crust and fourth
    most abundant constituent, following O₂, Si, and Al. **Iron** is also present
    in the planet''s core, and it reaches us in many meteorites; it is the 26th element
    of the periodic table, with specific density of 7.87 g/cm³, three times heavier
    than aluminum but about 12% lighter than copper and 36% lighter than lead. **Iron,
    steels, and cast iron** are three types of **ferrous alloys**; they are defined
    by their **carbon** content and by the shares of microstructural forms of iron.
    **There** are three principal microstructural components: $\alpha$-ferrite has
    a body-centered cubic structure that is stable at ambient temperature and transforms
    into $\gamma$-ferrite at 912°C; $\delta$-ferrite is structurally identical with
    $\alpha$-ferrite, but it is only stable at temperatures above 1394°C and it melts
    at 1538°C; and the $\gamma$-ferrite (austenite) phase of carbon steel (up to 2.14%
    C) can exist only at high temperatures (above 727°C), and it has a face-centered
    cubic structure. **Iron** as $\alpha$-ferrite contains only a negligible trace
    of carbon (0.008%) at ambient temperature, **steels** contain 0.008–2.14% C (usually
    <1%) by mass and the rest is $\alpha$-ferrite and **cementite**, and **cast irons**
    have 2.14–6.7% C (but usually <4.5%) by mass, with the rest being **cementite**.'
