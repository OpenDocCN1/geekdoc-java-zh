- img_proc: true
  md: 'Life cycle assessment (LCA) is the most comprehensive approach to the compilation
    and evaluation of potential environmental impacts of entire product systems throughout
    their, often complex, history (ISO, 2006). LCA is particularly revealing as it
    allows us to compare environmental impacts in their entirety rather than, misleadingly,
    choosing a single (albeit the most important) variable or focusing only on a segment
    of a complex production process. Consequently, an LCA of steel should start with
    raw material extraction, include all relevant ironmaking and steelmaking processes,
    follow the material flow through manufacturing and, and look at the recycling
    and disposal of obsolete products (WA, 2011c).


    Assessed variables range from measures of toxicity to humans and ecotoxicity of
    water and sediments to nutrient loading (eutrophication), acidification, photochemical
    ozone creation potential (POCP), and global warming potential. Again, as is the
    case with energy analyses, data limitations and differences in analytical boundaries
    and conversion ratios may complicate the comparability of specific results. And,
    obviously, when comparing specific steels it is necessary to look at, or at least
    very similar, product categories, for example, at heavy-duty structural steel,
    or at least at a broad category of structural steel.


    There are now many published LCA values for steel. Besides for specific steel
    products or applications—for example, for truck wheels (PE International, 2012),
    tubular wind towers (Gervasio et al., 2014), or bridges (Hammervold, Reenas, &
    Brattebo, 2013)—there are also assessments for average environmental impacts of
    national steel production—and Thakkar et al. (2008) for India and Burchart-Korol
    (2013) for Poland—and national LCAs offering specific values for a range of finished
    products. A Canadian LCA (Markus Engineering Services, 2002) provided highly aggregated
    impact for nails; used wire mesh and loader wire; screws, nuts, and bolts; heavy
    trusses; one web joints; rebar rods; HST tubing; hot rolled steel; cold rolled
    steel; galvanized sheet; galvanized deck; and galvanized studs. And there are
    LCAs for alternative resources in ironmaking (Vadenbo, Boesch, & Hellweg, 2013).


    Not surprisingly, given the commonalities (or outright identities) of major production
    processes, these published rates, while displaying national and regional differences,
