    Brazil entered the twenty-first century as by the world''s largest charcoal producer
    and as the only major consumer of metallurgical charcoal. The fuel is converted
    from both illegally harvested natural forests and from plantations of fast-growing
    eucalyptus located in Minas Gerais (Pelázquez-Samaniego, 2008). No by-products
    are recovered, and the conversion efficiency remains better than 25%. About 75%
