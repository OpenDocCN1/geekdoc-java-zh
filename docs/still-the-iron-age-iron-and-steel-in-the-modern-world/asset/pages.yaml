  md: 'Because the metal is magnetic, recycled steel can be easily separated from
    nonmagnetic materials, usually in rotating drums after shredding. Screening, pressurized
    air, and liquid flotation are also used for separation. Admixture of other metals,
    nonmetallic wastes, and hazardous compounds is a common occurrence with obsolete
    scrap, whose rusting surfaces can be heavily contaminated by toxic compounds,
    while the metal itself may contain impermissibly high levels of copper, tin, nickel,
    chromium, or molybdenum: their concentrations should be generally less than 0.1%
    for structural steel. Because these metals cannot be separated from the steel,
    their presence must be detected by mixing in high-purity scrap or pig iron. Safe
    and sorted metal is compacted into small blocks for convenient handling and for
    land or water-borne transport to domestic steel mills or for international, and
    increasingly intercontinental, exports.


    In many cases it requires a great deal of effort to get sized, sorted, and compacted
    blocks of metal ready to be charged into EAFs and BOFs. Because discarded steel
    objects come in so many sizes, the recycled material must be reduced to dimensions
    suitable for easy handling. The greatest challenge is cutting heavy steel plates
    of ships and dismantling giant oil tankers, bulk carriers, and cruise liners:
    some 90% of this difficult work is done (after stripping away the nonmetallic
    components) by gas and plasma torches at sprawling ship-breaking sites on the
