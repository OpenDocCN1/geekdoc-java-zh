  md: 'In 1900, steel had virtually no competition for many exacting, durable, heavy-duty
    uses for which its mass production had been originally developed. A century later
    this has changed with large-scale production of aluminum and of its alloys, and
    with reliance on other metals for some critical applications. Titanium, 45% less
    than steel but with ultimate tensile strength 20% lower, has been favored in alloys
    with aluminum, molybdenum and steel that are used above all in aerospace industry
    (also in bicycles, couches, golf clubs, and hip replacements). The post-1950 world
    has seen a spreading use of a wide variety of plastics, and the emergence of new
    composite materials has cut into steel as they have replaced many components used
    to make machinery, appliances, pipes, parts, and tools. Relative steel dematerialization
    (share of steel in total mass of specific products) has thus been an unmistakable
    trend in modern manufacturing, and it has resulted in absolute steel dematerialization
    in many economies with slowly growing populations—but it has yet to translate
    into absolute dematerialization in global terms.


    Substitution is wisely seen using an entirely different material but one of the
    most important trends in modern steel use has been the displacement of ordinary
    varieties of steel by superior alloys whose attributes translate into overall
    reduction in weight (and hence increased efficiency of performance when higher
    strength steels are used in cars or ships) or in greater longevity (with new crack-
