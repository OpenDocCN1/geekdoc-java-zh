    Particulates are released at many stages of integrated steelmaking, during sintering,
    in all phases of integrated steelmaking as well as EAFs and DRI processes, but
    efficient controls (filters, scrubbers, baghouses, electrostatic precipitators,
    cyclones) can reduce these releases to small fractions of the uncontrolled rates
