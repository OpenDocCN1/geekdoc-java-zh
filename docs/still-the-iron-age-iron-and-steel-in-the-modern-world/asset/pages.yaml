  md: '# CHAPTER 2


    # Rise of Modern Ferrous Metallurgy, 1700–1850


    # Coke, Blast Furnaces, and Expensive Steel


    # Abstract


    During the first decades of the eighteenth century standard metallurgical setups
    (blast furnaces located near iron ore deposits and close to wooded areas with
    streams), procedures (charcoal-fueled smelting pig iron, most of which got converted
    to wrought iron in forges), and products (cast iron, wrought iron, small shares
