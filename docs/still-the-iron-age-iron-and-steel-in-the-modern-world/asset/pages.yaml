  md: 'Before moving to a brief review of state-of-the-art steelmaking practices,
    I must devote a few pages to describing the only major practical alternative to
    BF ironmaking, direct reduced iron (DRI). This group of techniques obviates the
    use of metallurgical coke as it reduces ores in their solid state at temperatures
    well below the metal’s melting point. In principle, DRI could be thought of as
    a modern, efficient replication of the preindustrial artisanal production of spongy
    masses in bloomeries, the process described in this book’s first chapter. Between
    1869 and 1877, William Siemens experimented with a variant of DRI by attempting
    to reduce a mixture of high-quality iron ore and coal in rotating cylindrical
    furnaces, and during the 1920s two Swedish processes were employed in a small-scale
    local production of iron powers. One of them (Högganäs) is still used for that
    purpose by eponymous Swedish company and by other enterprises (Högganäs, 2015).


    Commercialization of DRI began only during the late 1960s, and by the mid-1970s
    there was a choice of nearly 100 designs combining different reactors (reactors,
    kilns, retorts, fluidized-bed reactors) with a number of reducing agents, including
    coal, graphite, char, liquid and solid hydrocarbons, and gases (Anameric & Kawatara
    2015; Hasanbeigi, Price, & Arens, 2013). DRI processes can be classified according
    to the kind and source of reducing gas or type of reactor, and the DRI process
    that has been so far the most commercially successful relies on natural gas and
    in countries where this has been most commonly installed in locations been inexpensive
    and readily available. Natural gas is reformed by a catalytic steam process (CH₄
    + H₂ → CO + ₃H) and it reduces iron pellets or fines as it ascends, mixed with
    crushed limestone, in a shaft (Anameric & Kawatara, 2015). The Mexican Hojalata
    y Lamina is the pioneering design (with later versions marked as HYL-III), and
    the most successful US contribution, MIDREX process, Finmet, Iron Carbide, and
    Circored use fluidized-bed reactors.


    MIDREX has earned its leadership in direct reduction because its plants are the
    most productive and most reliable (often operating for more than 8000 hours a
    year) and can use a range of reductants and raw materials (MIDREX, 2015). Plants
    can produce reducing gas from the energy source that is either locally, or most
    readily, available or that is most'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'competitively priced, it be natural gas (reformed to yield CO, syngas from
    coal, petroleum coke heavy refinery residue (processed in a gasifier), or coke
    oven gas. Furnaces can work either with lump ore or iron oxide pellets (or their
    mixture), and the process itself is simple (involving the countercurrent descent
    of iron-bearing material loaded at the top of a cylindrical vessel lined with
    refractories and ascent of reducing gases).


    MIDREX DRI is in the form of a solid sponge, vulnerable to reoxidation and unsuitable
    for transportation, and since 1984 this sponge iron has been first converted into
    brietted iron (HBI), by discharging DRI into roller presses that make it dense,
    pillow-shaped briquettes highly suitable as EAF charge. The other products are
    cold DRI (cooled before discharging) and hot DRI in the form of dense (bulk density
    of 2.5–3 t/m³) briquettes containing 90–94% Fe and weighing up to 3 kg. When compared
    to blast furnace smelting, the process has three other advantages besides doing
    away with coke. First, its specific energy requirement (GJ/t) is approximately
    half of those for BF operation (for details see the penultimate section of the
    next chapter). Second, as a result, its specific carbon emission is much lower
    (the last section of the next chapter). Third, there is a much greater flexibility
    in designing plant capacities: while the economies of scale for the standard BF–BO
    choice demand annual output of at least 2 Mt, DRI plants associated with a mill
    can produce as little as 0.5 Mt/year.


    Corex, the most successful smelting-reduction process, was originally developed
    by Voest-Alpine Industrieanlagen (VAI), and it is now marketed by Siemens under
    the name SIMETEL Core (Siemens VAI, 2011). It requires two separate process reactors,
    the first being a reduction shaft charged with lump ore or pellets and additives
    to produce DRI in a counterflow reaction, and the second being a melter gasifier
    where the reduction is completed and hot metal and slag are tapped, much as in
    conventional BF. The first Corex plant to operate in Pretoria in 1989, and subsequent
    installations included Saldanha in South Africa, Pohang in South Korea, at China’s
