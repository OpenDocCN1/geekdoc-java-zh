  md: 'Steel is, much like coal or crude oil, a singular describing a variety of materials
    of different compositions and different physical properties. The plural is thus
    a more accurate choice: steels are ferrous alloys characterized above all by their
    restricted carbon content, between 0.08% and 2.14% by weight, and high to very
    tensile strength and high yield strength and impact strength. The addition of
    other elements—most commonly Al, Cr, Co, Mn, Mo, Ni, Ti, V, and W, in total amounts
    ranging from less than 2% to more than 10% of the mass—produces steel alloys with
    a variety of desirable properties. Lowcarbon sheet steel goes into car bodies,
    while highly tensile and hardened (with Mn, Mo and Ni) steels goes into axles,
    shafts, connecting rods, and gear. Stainless steels are indispensable for medical
    devices and household appliances as well as for chemical and food-processing equipment,
    and tool steels are made into thousands of devices ranging from chisels and gauges
    to extrusion dies and shear blades.


    Tensile strength measures the force used to pull a material to the point it can
    withstand without permanent deformation (yield strength) or to its breaking point
    (ultimate strength). The two points for structural steel are 250 and 400 MPa;
    for high-tensile steels they are up to 1.65 and 2.2 GPa.


    Tuyère is a water-cooled nozzle (pipe) placed at the top of a blast furnace hearth
    and used to force blast from hot stoves into the furnace. Tuyères were also used
    to blow air into Bessemer converters, and they deliver oxygen through the bottom
    of basic oxygen furnaces.


    Wrought iron contains only traces of carbon (0.04–0.08%), but it has inclusions
