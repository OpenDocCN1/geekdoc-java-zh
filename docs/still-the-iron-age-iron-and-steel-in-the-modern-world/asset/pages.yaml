    # Air and Water Pollution and Solid Wastes


    Ferrous metallurgy offers one of the best examples of how a traditional iconic
    pollutant, particularly as far as the atmospheric emissions were concerned, can
    clean up itself, and do so to such an extent that it ceases to rank among today''s
    most egregious offenders. Environmental impacts of iron- and steelmaking go beyond
    the release of airborne pollutants, and I will review the most worrisome consequences
    in terms of waste disposal, demand for water, and water pollution. And while iron
    and steel mills are relatively compact industrial enterprises that do not claim
    unusually large areas of flat land (many of them, particularly in Japan, are located
    on reclaimed land), extraction of iron ores has major local and regional land
    use impacts in large-scale extraction, above all in Western Australia and in Pará
    and Minas Gerais in Brazil.


    All early ckmaking, iron smelting, and steelmaking operations could be easily
    detected from afar due to their voluminous releases of air pollutants whose emissions
    were emblematic of the industrial era: particulate matter (both relatively coarse
    with diameter of at least 10 μm, as well as fine particles with diameter of less
    than 2.5 μm that can easily penetrate into lungs), sulfur dioxide (SO₂), nitrogen
    oxides (NOₓ including'
