  md: '# APPENDIX B


    # Some Basic Terms


    Austenite is a dense face-centered cubic structure of iron that forms when ferrite
    is cooled to 1400°C.


    Basic oxygen furnace is used to convert pig iron to steel: it is a massive pear-shaped
    vessel lined with refractory material and mounted on trunions so it can be tilted
    for charging with pig iron and steel scrap and discharging of liquid steel. Water-cooled
    oxygen lances are inserted through a removable lid.


    Bessemer converter is a massive egg-shaped vessel that provided the first practical
    means of producing inexpensive steel from pig iron through decarburization. The
    converter was lined with a refractory material, and after it received hot metal
    through its open top, the charge was blasted for 15–30 min with cold air through
    tuyères. The resulting exothermic oxidation removed carbon and silicon from the
    hot metal.


    Billets are round or square-profile (up to 25 cm) pieces of steel produced by
    continuous casting as are converted to bars and rods.


    Blast volume of air (>5000 m³/min) is generated by a turbo blower (cold blast)
    and then led to hot stoves, where its temperature is raised to as much as 1300°C
    it is forced through tuyères into a blast furnace to supply oxygen for carbon
    oxidation and heat for iron ore smelting.


    Blast furnace is a tall, conical structure set on massive foundations. Its parts,
    proceeding upwards, are: circular hearth with water-cooled tuyères situated along
    its perimeter; bosh, a short, truncated, and slightly outward-sloping cone; belly,
    the widest section (shaft), the longest'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'and slightly narrowing section where descending ore, coke, and flux are heated
    by ascending hot, CO-rich gases that reduce the oxides; and finally the throat,
    surmounted by a top cone. **Blast** for the smelting is supplied from adjacent
    **hot stoves**. Modern furnaces can operate for about two decades after they are
    blown-in and before they are left to cool for relining. Molten metal (**pig iron**)
    is periodically released through tapholes and removed for **casting**, and **slag**
    is taken out through cinder notches.


    **Blooms** are rolled steel pieces with rectangular blooms (typically 40 ×60 cm)
    that are turned into structural shapes (beams), rails, and pipes.


    **Carbon** appears as an interstitial impurity in iron, forming solutions with
    the three microstructural phases of **iron—α-ferrite, δ-ferrite, and γ-ferrite—**and
    combining with iron to form **cementite**. In low concentrations the element hardens
    **steels**, while its higher concentrations in **cast iron** make the metal brittle.
    Its removal from **cast iron** is done through **decarbonization**.


    **Cast iron (pig iron)** is the name given to a group of metals produced in blast
    furnaces containing at least 95% and up to to 97% **iron**. All of them have high
    carbon content, at least 1.8% for white cast iron but mostly between 2.5% and
    4% for grey cast iron and ductile iron. The third most abundant element in unalloyed
    cast iron is silicon (0.5–3%) and the three elements are forming Fe–C–Si alloy.
    **Pure iron** melts at 1523°C, with melting temperatures of different kinds of
    cast iron between 1150 and 1200°C. **Cast iron** usually contains traces of Mn
    (0.1–1%), S (0.01–0.25%), and P (0.011%). **High carbon** content makes cast iron
    brittle and inferior to other common alloys. Cast iron’s tensile strength is just
    150–400 MPa, much less than that of bronze or brass; its **impact strength** is
    also very low, as is its **ductility**, but it has good strength in compression.


    **Cementite** is a very hard intermetallic compound (Fe₃C, ferric carbide) which
    makes **cast iron** hard and brittle.'
