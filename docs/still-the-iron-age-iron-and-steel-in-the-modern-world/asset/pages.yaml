  md: 'But solid waste mass generated by iron smelting in BFs is an order of magnitude
    larger, typically about 275 kg/t of steel (extremes of 250–345 kg/t), and steelmaking
    in BOFs adds another 125 kg/t (85–165 kg/t). The BF/BOF route thus leaves behind
    about 400 kg of slag per tonne of metal, and the global steelmaking now generates
    about 450 Mt of slag a year—and yet this large mass poses hardly any disposal
    problems. Concentrated and predictably physical qualities, that make it suitable
    for industrial and agricultural uses, mean that slag is not just another bothersome
    waste stream but commercially useful by-product.


    The material is marketed in several different forms which find specific uses (NSA,
    2015; WSA, 2014b). Granulated slag is produced by rapid water cooling; it is a
    sand-like material whose principal use is incorporation into standard (Portland
    cement). Air-cooled slag is hard, dense, chunky material that is crushed and screened
    to produce desired sizes as aggregates in precast and ready-mixed concrete, in
    asphalt mixtures or as a railroad ballast and permeable fill for road bases, in
    septic fields, and for pipe beds. Pelletized (expanded) slag resembles a volcanic
    rock, and its lightness and (when ground) excellent cementitious properties make
    it a perfect aggregate to make cement or to be added to masonry. Expanded slag
    is now widely used in the construction industry, and Lei (2011) reported that
    in 2010 China’s cement industry used all available metallurgical slag (about 223
    Mt in that year). Brazilian figures for 2011 show 60% of slag used in cement production,
    16% put into road bases, and 13% used for land leveling (CNI, 2012).


    High content of free lime prevents the use of slag in construction, but after
    separation both materials become usable, with lime best used as fertilizer. Because
    of its high content of basic compounds (typically 38% CaO and 12% MgO), ordinary
    slag is an excellent fertilizer used to control soil pH in field cropping and
    in nurseries and parks for lawn maintenance and land recivation; slag also contains
    several important plant nutrients, including copper, zinc, boron, and molybdenum.


