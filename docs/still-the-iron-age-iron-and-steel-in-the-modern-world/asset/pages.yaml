    # Abstract


    The next logical step—after tracing the history of iron and steel production,
    and after focusing on the role of technical advances in raising output and productivity,
    expanding the choice of final products and improving their quality—is to go beyond
    the confines of the plants where smelting, casting, oxygen blasting, rolling,
    and finishing take place, as well as looking at the production processes from
