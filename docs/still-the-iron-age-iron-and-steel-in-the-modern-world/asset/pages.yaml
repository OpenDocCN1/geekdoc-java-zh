    # Steel Scrap


    Steel does not lose any of its desirable physical properties by being remelted
    and hence it can be recycled (inevitable handling and processing losses aside)
    ad infinitum. If care is taken to eliminate undesirable elements from steel scrap,
    then the recycled material can be used to produce casting components and finished
    products (be they boilers or bolts) of the same quality as those made from primary
    pig iron—and do so with a fraction of energy required for primary metal production.
    A result is the world’s most recycled metal. The mass of collected steel is also
    much larger than for any other recycled material. In the US mass aggregates steel
    equal up to 100, 67 for scrap, 6 for aluminum, 4 for glass, and just 3 for plastics
    (SRI, 2015).


    Metal recycling has increased substantially since the 1960s, but the effort still
    has a long way to go: a UNEP indicates that 18 out of 60 metals have end-of-life
    recycling rates in excess of 50% (fortunately, the list includes not only iron
    but also copper, nickel, manganese, cobalt, and chromium as well the three precious
    metals, silver, gold, and platinum) and only three rates between 25% and 50% (UNEP,
    2011). Depending on the country, actual end-of-life recycling rates are up to
    90% for steel, up to 70% for aluminum, and 60% for nickel but only a bit above
    50% for copper.


    EAFs are the dominant process of scrapped ferrous metal that is charged, in smaller
    specific amounts, to BOFs. Steel scrap is usually'
