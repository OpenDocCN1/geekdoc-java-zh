    When narrowly defined, beneficiation entails removal of large quantities of nonferrous
    minerals, mostly SiO₂ (reducing its presence to less than 10% by mass), and it
    is done by the sequence of milling (crushing, grinding) ore, sorting, sizing,
    magnetic separation, dewatering, and filtering. Flotation following magnetic separation
    is often used to upgrade concentrates by reducing their silica content. Broadly
    defined, beneficiation agglomeration that takes most the form of pelletizing or
    sintering (USEPA, 1994). Sintering is the most common, and also most economical,
    of thermal agglomeration.


    The process starts with the preparation of a raw mix of iron ore and spillage
    fines (sinter feed is typically 0.15–6 mm), coke fines or coal, and flux (lime,
    limestone, dolomite); water is added, and the mix goes into a sintering machine
    (onto a traveling grate); it is ignited and the coke in the mixture provides the
    necessary heat (1300–1480°C) to melt the surface and agglomerate the mix, forming
    a porous cake that is cooled and crushed into lumps of 15–25 mm suitable for BF
    burden (Outotec, 2015a). Typical material input is 2.5 t of raw material to produce
    a tonne of sinter. The process was developed to treat fine waste in the early
    twentieth century and sintered ores are the dominant material charged into BFs,
    to produce 70% of all hot metal.


