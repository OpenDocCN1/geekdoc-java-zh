    # Continuous Casting


    Post-WW II changes in the treatment of steel after its production have been no
    less important than the shift to BOFs and EAFs. Long-standing practice was inherently
    energy intensive as the hot metal was first cast into steel ingots, oblong slabs
    and plates that could weigh between 50 t (for specialty steels) and 500 t (for
    steel destined to be forged into large plates) and had to be reheated before they
    could go through a primary rolling mill, where they were formed into one of the
    three basic kinds of semifinished shapes: wide (some up to 3 m) and thick (up
    to 25 cm) slabs; square-profile (up to 25 cm) billets; and rectangular-profile
    blooms (commonly 40 ×60 cm). Final processing (hot- or cold-rolling) turned standard-
    and medium-thickness slabs into slabs and plates, billets into bars and rods,
    and blooms into I and H beams. The complete casting and rolling sequence could
    require no less energy than the itself, but it persisted for generations, being
    the final component of the traditional combination that began with blast furnace
    pig iron and continued with open hearth steelmaking.


    Steps eliminated by continuous casting include the pouring of hot metal into ingots,
    removing the molds from the ingots, putting the ingots into soaking pits in order
    to equalize their temperature, and then rolling them into semifinished products
    (slabs, billets, or blooms). Much like the idea of the oxygen furnace, the concept
    of continuous casting had also originated with Henry Bessemer: his first patent
    for a twin-roller caster (using water-cooled rollers with edges sealed by a flange
    iron or a dam in groove) was granted in 1865, and the original design was improved
    in 1891 (Bessemer, 1891), a couple years after R.M. Daelen received a patent for
    a vertical casting machine. But Bessemer’s peers were unimpressed


