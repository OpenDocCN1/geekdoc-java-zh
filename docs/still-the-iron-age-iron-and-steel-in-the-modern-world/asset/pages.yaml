  md: '# Material Balances of Integrated Steelmaking


    The latest estimates by the World Steel Association for typical material inputs
    required to make a tonne of crude steel by the integrated steelmaking route (BF
    and BOF) are as follows: 1400 kg of iron ore (mostly as sinter or pellets or their
    combinations), 800 kg of coal (most of it converted to coke), 300 kg of fluxing
    materials (mostly for BF), and 120 kg of recycled steel. For a large BF producing
    10,000 t/day of iron and supplying an adjacent large BOF, annual requirements
    add up to 5.11 Mt of ore, 2.92 Mt of coal, 1.09 Mt of flux materials, and nearly
    0.5 Mt of steel scrap. A large integrated steel mill thus receive every year more
    than 9.5 Mt of materials that must be eventually introduced in a virtually perfect
    function through the sealed top of a BF and into the top of a BOF.


    In global terms in 2012 (with roughly 117 Mt of pig iron and 1100 Mt of crude
    steel produced in integrated mills BF–BOF sequence), this added up to about 1.64
    Mt of iron ore, nearly 900 Mt of coal, 330 Mt of flux materials, extracting, producing,
    transporting, and handling this mass of materials requires a vast global system
    of mining, shipping, processing, and storage that has to operate without interruption.
    Inevitably, these massive inputs are transformed not only into the desired valuable
    metal (crude steel ready for further processing into specific alloys and semifinished
    and finished products) but also into massive solid or voluminous gaseous waste
    streams that must be captured and reused or collected.


    Material balances should also include air blast delivered through tuyères around
    the hearth''s perimeter (Fig. 6.4). Depending on the operating pressure and the
    degree of oxygen enrichment, the mass of hot blast air is mostly between 1.25
    and 1.5 t/t of hot metal, and oxygen enrichment ranges between 30 and 300 kg/t
    of pig iron. Besides the hot metal (pig iron), the output of the smelting process
    consists of slag and gases. BF is tapped by drilling 2–4 tapholes (the clay-filled
    openings at the base of furnace hearth, resealed by clay casting) 8–14 times a
    day to remove molten iron and slag.'
