  md: 'classified into three major streams, home, prompt, and obsolete scrap. Home,
    or circulating, scrap (also called own risings) is produced within iron and steel
    plants and is obviously the easiest material to be recycled, often in a matter
    of days or weeks after its generation; moreover, its composition is perfectly
    known, eliminating any quality concerns, and in 2012 amounted globally to 20 Mt
    or about 35% of all scrap and the equivalent of 13% of that year''s total steel
    production (BIR, 2014). The rest of the recycled scrap, globally 65% of the total
    in 2012 (370 Mt), is purchased domestically or it is imported, and of it (about
    two-thirds) is old metal (obsolete scrap).


    Prompt (new) scrap originates from a wide variety of metalworking and manufacturing
    enterprises that use steel to make metal parts, assemblies, or finished products
    ranging from white goods (refrigerators, washing machines) to heavy land-moving
    machinery; composition of this scrap is also well known, but it must be collected
    and transported to miles and hence it becomes available in a month of months.
    Estimates of prompt scrap as a share of finished steel products range 10% and
    15% on the industrial basis, with rates as low as 8% in the production of containers
    and as high as 20% for making some car parts (Kozawa & Takahashi, 2011). Obsolete
    scrap comes from old, discarded metal, some of it in alloys and some of it decades
    old, with steel containing undesirable elements in alloys and coatings or commingled
    with other metals and nonmetallic materials in still-assembled appliances, tools,
    transportation equipment (ships, railway cars, vehicles), and heavy machinery
    or embedded in waste from demolished buildings.


    Ranges of lifespans of steel-based products differ among countries, but the following
    numbers are good average (and extreme) approximations (Dahlström et al., 2004;
    Kozawa & Takahashi, 2011; Pauliuk et al., 2013): 60–75 (20–100) years for structural
    steel in buildings, dams, and bridges; 60 years for oceango vessels; 30 (10–40)
    years for industrial machinery (including turbines and engines); 15 (5–20) years
    for automobiles and durable metal goods; 10 years for boilers and drums; and as
    little as 1 or 2 years for cans and metal boxes and 5 years for containers. Rail
    track lifespan is more complicated: before the metal gets recycled, rails can
    be reused by swapping the tracks, and later they can be installed on secondary
    lines with less traffic.'
