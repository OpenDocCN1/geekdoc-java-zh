    infrastructures, and 11% for transportation, while Stahlinstitut VDEh (2014) offers
    the following major shares for German steel demand: 25% for each construction
    and cars; 13% each for machinery and pipes; and 9% for metal products. There is
    one thing that all of these diverse uses have in common: as the variety of steel
    applications has grown, users have begun to demand higher consistency, higher
    quality (virtual absence of surface and internal defects), and specific functionality,
    such as lighter weight, better workability, and greater strength (Iwasaki & Matsuo,
