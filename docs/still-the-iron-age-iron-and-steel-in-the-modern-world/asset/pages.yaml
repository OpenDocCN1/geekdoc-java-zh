  md: '# CHAPTER 10


    # Looking Ahead


    # The Future of Iron and Steel


    # Abstract


    Future use of any material will be affected by the progress of substitutions and
    the advances of relative, and eventually absolute, aggregate dematerialization
    on national and global scales and by the emergence and adoption of new production
    processes. Even as steel has conquered new markets, it has had to cede some of
    its market shares to competing materials, most notably to aluminum and plastics.
    This process will continue, and the combination of acceptable physical attributes
    and substitution costs—higher for both aluminum and plastics, and much higher
    for new composite materials—will determine how fast and how far it will go in
    the future. This is also an apposite place to appraise the possibilities of another
    substitution, the use of modern charcoal to replace coke as part of the quest
    to reduce CO₂ emissions from the iron and steel industry.


    # Keywords


    Coke; charcoal; dematerialization; GDP; material substitutions; future steel demand


