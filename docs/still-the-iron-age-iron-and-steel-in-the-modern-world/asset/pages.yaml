    #  Lightweighting


    Several materials are available to replace automotive steel. Magnesium steel alloys
    and carbon fiber and polymer composites have the lowest density of all structural
    materials used in vehicles, and their widespread use has the potential to reduce
    component weight by more than 60%—but their widespread adoption is not imminent.
    Magnesium''s tensile strength is similar to that of aluminum, but the metal has
    lower ultimate tensile, fatigue, and creep strength and its alloys have lower
    modulus and hardness, are prone to exhibit low-ductility failure, create problems
    with corrosion and recycling, and are difficult to be formed as sheets at low
    temperature (USDOE, 2013). As a result, they have been used for only about 1%
    of average vehicle mass. Carbon fibers and polymer composites are still fairly
    expensive (that is why they have been used in airplanes rather than in cars) and
    also highly energy intensive.


    Aluminum alloys are seen as a middle ground of the lightweight spectrum, heavier
    than magnesium alloys but lighter than steel; moreover, long experience with their
    use in airplanes and vehicles makes their applications and limitations well understood.
    Car parts made of aluminum alloys include not only hoods and panels but also engine
    blocks and other power-train components and even entire vehicle bodies. Further
    use of these materials is limited due to their cost, formability, premature corrosion,
    and multimaterial complications in joining, painting, repairing after accidents,
    and recycling (USDOE, 2013). That is why HSS and AHSS are the most appealing options:
    their relatively high density is compensated by exceptional strength and ductility,
    a combination that allows weight-saving designs, and their new automotive applications
    have been growing faster than the substitutions by aluminum or plastics (WorldAutoSteel,
    2011).'
