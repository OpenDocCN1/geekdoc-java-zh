    # # Infrastructures and Buildings


    Certainly the most fundamental, as well as the most important (when judged by
    annual global consumption), use of steel products is in construction, as well
    as maintenance and upgrading, of buildings and key infrastructures that create
    housing and commercial and industrial enterprises, that underpin the functioning
    of modern economies, including a high degree of mobility, and that ensure public
    safety and private well-being. As already noted, construction of buildings and
    infrastructure now claims about 50–55% of annual global steel production, with
    national shares in low-income, rapidly modernizing economies ranging from close
    to, and even above, 60%, while the shares in affluent economies range mostly between
    30% and 35%.'
