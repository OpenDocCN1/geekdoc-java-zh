    with reduced natural ventilation, the result was a chronically excessive local
    and regional air pollution: Pittsburg and its surrounding areas were perhaps the
    best American illustration of this phenomenon.


    Recent Chinese rates and totals illustrate both the significant contribution of
    the sector to national pollution flows and the opportunities for effective controls.
    Guo and Xu (2010) estimated that the sector accounted for about 15% of total atmospheric
    emissions, 14% of wastewater and waste gas, and 6% of solid waste, and they put
    the nationwide emission averages in the year 2000 (per tonne of steel) at 5.56
