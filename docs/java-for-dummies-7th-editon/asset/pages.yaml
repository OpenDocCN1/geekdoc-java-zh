    right-click or control-click the picture of a component, you get the option of
    jumping to the component''s actionPerformed method. In the actionPerformed method,
    you add Java code, such as button.setText("You clicked me!"). Tools like WindowBuilder,
    GUI Designer, and GUI Builder make the design of GUI interfaces quicker, more
    natural, and more intuitive.'
