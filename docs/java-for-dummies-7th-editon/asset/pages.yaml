  md: "meaning for members another meaning for classes. Most of this chapter deals\
    \ with the meaning of public (and other such keywords) for members. The last part\
    \ of this chapter (appropriately titled “Access Modifiers for Java Classes”) deals\
    \ with the meaning for classes.\n\n# Access modifiers for members\n\nSure, this\
    \ section is about members. But that doesn't mean that you can ignore Classes.\
    \ Members or not, the Java class is still where all the action takes place. Each\
    \ field is declared in a particular class, belongs to that class, and is a member\
    \ of that class. The same is true of methods. Each method is declared in a particular\
    \ class, belongs to that class, and is a member of that class. You can use a certain\
