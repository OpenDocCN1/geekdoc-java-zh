  md: '# Functional Programming


    From 1953 to 1957, John Backus and others developed the FORTRAN programming language,
    which contained the basic framework for thousands of 20th century programming
    languages. The framework has come to be known as imperative programming because
    of its do-this-then-do-that-nature.


    A few years after the rise of FORTRAN, John McCarthy created another language,
    named Lisp. Unlike FORTRAN, the underlying framework for Lisp is functional programming.
    In a purely functional program, you avoid writing “do this, then do that.” Instead,
    you write things like “’s how you’ll be transforming this into that when you get
    around to doing the transformation.


    For one reason or another, imperative programming became the dominant mode. But
    recently, functional programming has emerged as a powerful and useful way of thinking
    about code.


    To help you understand functional programming, I start this section with an analogy.
    Then, in the rest of this chapter, I present some Java examples.


    The analogy that I use to describe functional programming is very rough. A friend
    of mine called this analogy a stretch because it applies to many different programming
    frameworks, not only to functional programming. One way or another, I think the
    analogy is helpful.


    Here''s the analogy: Imagine a programming problem as a cube, and imagine an imperative
    programming solution as a way of slicing the cube into manageable pieces. (See
    Figure 12-3.)'
