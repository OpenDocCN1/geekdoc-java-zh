  md: '# # THE WINDING ROAD FROM FORTRAN\TO JAVA


    In the mid-1950s, a team of people created a programming language named FORTRAN.
    It was a good language, but it was based on the idea that you should issue direct,
    imperative commands to the computer. “Do this, computer. Do that, computer.” (Of
    course, the commands in a real FORTRAN program were much more precise than “Do
    this” or “Do that.")


    In the years that followed teams developed many new computer languages, and many
    of the languages copied the FORTRAN “Do this/Do that” model. One of the more popular
    “Do this/Do that” languages were named by the letter-1 name C. Of course, the
    “Do this/Do that” language had some named Reynolds. In languages SIMULA and Smalltalk,
    programmers moved the imperative “Do this” commands into the background and concentrated
    on descriptions of data. In these languages, you didn''t come out and say. Instead,
    by saying, “This is what it means to be an account. An account has a name and
    a balance.” Then you said, “This is how you make an account whether it’s delinquent.
    Suddenly, the account became a thing that had a name, a balance, and a way of
    telling you it was delinquent.


    Languages that focus on the data are object-oriented programming languages. These
    object-oriented languages make excellent programming tools. Here’s why:


    +   - Thinking about the first data you makes a good computer programmer.

    - You can extend and reuse the descriptions of data over and over again. When
    you try to teach old FORTRAN programs new tricks, however, the old programs show
    how brittle they are. They break.


    In the 1970s, object-oriented languages, such as SIMULA and Smalltalk, were buried
    in the computer hobbyist magazine articles. In the meantime, languages based on
    the old FORTRAN model were multiplying likes.


    In 1986, a famous named Bne Stroustrup created a language named C++. The C++ language
    became very popular because it mixed the C language terminology with the improved
    object-oriented structure. Many companies turned their backs on the old FORTRAN/C
    programming style and adopted C++ as their standard.


    But C++ had a flaw. In C++, you could bypass all the object-oriented features
    and write a program using the old FORTRAN/C programming style. When you started
    a C++ accounting program, you could either fork in the road:


    +   - By issuing “Do this” commands to the computer, saying the mathematical equivalent
    of “Print a list of delinquent accounts, and make it snappy.\n- Choose the object-oriented
    approach and begin by describing what it means to be an account.


    Some people that C++ offered the best of both worlds, but others argued that the
    first world (the'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'world of FORTRAN and C) shouldn''t be part of modern programming. If you gave
    a programmer an opportunity to write code either way, the programmer would too
    often choose to write the wrong way.


    In 1995, James Gosling of Microsystems created the language Java. In Creating
    Java, Gosling borrowed the look and feel of C++. But Gosling took most of the
    "Do/Do that" features of C++ and threw them in the trash. Then he added features
    that made the development of objects smoother and easier. In all all, Gosling
    created a language whose object-oriented philosophy is pure and clean. When you
    program in Java, you have no choice but to work with objects. That''s the way
    it should be.


    # Objects and their classes


    In an object-oriented language, you use objects and classes to organize the data.


    Imagine you''re writing a computer program to keep track of the houses in a new
    condominium development (still under construction). The houses differ only slightly
    from one another. Each house has a distinctive siding color, an indoor paint color,
    a kitchen cabinet style, and so on. In your object-oriented computer program,
    each house is an object.


    But objects aren''t the whole story. Although the houses differ slightly from
    one another, all the houses share the same list of characteristics. For instance,
    each house has a characteristic known as siding color. Each house has another
    characteristic known as kitchen cabinet style. In your object-oriented program,
    you need a master list containing all the characteristics that a house object
    can possess. This master list of characteristics is called a class.


    So there you have it. Object-oriented programming is misnamed. It should be called
    "programming with classes and objects."


    Now that I put the word classes first. How do I do this! Maybe, I''m not so crazy.
    Think again about a house development that''s under construction. Somewhere on
    the lot, in a rickety trailer parked on bare dirt, is a master list of characteristics
    known as a blueprint. Architect''s blueprint is like an object-oriented programmer''s
    class. A blueprint is a list of characteristics that each house will have. The
    blueprint says, "siding." The actual house object has gray siding. The blueprint
    says, "kitchen cabinet." The actual house object has Louis XIV kitchen cabinets.


    The analogy doesn''t end with lists of characteristics. Another important parallel
    exists between blueprints and classes. A year after you create the'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'blueprint, you use it to build ten houses. It''s the same with classes and
    objects. First, the programmer writes code to describe a class. Then when the
    program runs, the computer creates objects from the (blueprint) class.


    So that''s the real relationship between classes and objects. The programmer defines
    a class, and from the class definition, the computer makes individual objects.


    # What’s so good about an object-oriented language?


    Based on the preceding section’s story about home building, imagine that you''ve
    already written a computer program to keep track of the building instructions
    for houses in a new development. Then, the big boss decides on a modified plan
    — a plan in which half the houses has three bedrooms and the other half has four.


    If you use the FORTRAN/C style of computer programming, your instructions look
    like this:


    ```

    Dig a ditch for the basement.

    Lay concrete around the sides of the basement''s frame.

    Put two-by-fours along the sides for the

    ...

    ```


    This would be like an architect creating a long list of instructions instead of
    a blueprint. To modify the plan, you have to sort through the list to find the
    instructions for building buildings. To make things worse, the instructions could
    be scattered across pages 234, 394-410, 739, 10, and 2. If the builder had to
    decipher other peoples'' complicated instructions, the task would be ten times
    harder.


    Starting with a class, however, is like starting with a blueprint. If you decide
    to have both three- and four-bedroom houses, you can start with a blueprint called
    the house blueprint that has a ground floor and a second floor, but has no indoor
    walls down the second floor. Then you make two more second-floor blueprints —
    one for the three-bedroom house and another for the four-bedroom house. (You name
    these new blueprints the three-bedroom house and the four-bedroom house blueprint.)


    Your builder colleagues are amazed with your sense of logic and organization,
    but they have concerns. They pose a question. “You called me'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'of the blueprints ‘three-bedroom house’ blueprint. How can you do this if it’s
    a blueprint for a second floor and not for a whole house?


    You smile knowingly and answer, “The three-bedroom house blueprint can say, ‘For
    info about the lower floors, see the original house blueprint.’ That way, the
    three-bedroom house blueprint describes a whole house. The four-bedroom house
    blueprint can say the same thing. With this setup, we can take advantage of all
    the work we already did to create the original house blueprint and save lots of
    money.


    In the language of object-oriented programming, the three- and four-bedroom house
    classes are inheriting the features of the original house class. You can also
    say that the three- and four-bedroom house classes are extending the original
    house class. (See Figure 1-1.)


    | Superclass Parent | The house class is |

    | house class | the super class of the three-bedroom house class, the parent class
    of the three-bedroom house class, the subclass of the four-bedroom house class,
    the parent class of the four-bedroom house class. |

    | Subclass Child | Subclass Child |

    | three-bedroom house class | four-bedroom house class |

    | The three-bedroom house class extends the house class, inherits the features
    of the house class, is a subclass of the house class, is a child of the house
    class. | The four-bedroom house class extends the house class, inherits the features
    of the house class, is a subclass of the house class, is a child of the house
    class. |


    FIGURE 1-1: Terminology in object-oriented programming.


    The original house is called thesuperclass of the three- and four-bedroom house
    classes. In that vein, the three- and four-bedroom house classes are subclasses
    of the original house class. Put another way, the original house class is called
    the parent class of three- and four-bedroom house classes. The three- and four-bedroom
    house classes are child classes of the original house class. (Refer to Figure
    1-1.)


    Needless to say, your homebuilder colleagues are jealous. A crowd of homebuilders
    is mobbing around you to hear about your great ideas. So, at'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'that moment, you drop one more bombshell: “By creating a class with subclasses,
    we can reuse the blueprint in the future. If someone comes along and wants a five-bedroom
    house, we can extend our original house blueprint by making a five-bedroom house
    blueprint. We’ll never have to spend money for an original house blueprint again.


    “But,” says a colleague in the back row, “what happens if someone wants a different-floor
    design? Do we trash the original house blueprint or start scribbling all over
    the original blueprint? That’ll cost big bucks, won’t it?”


    In a confident tone, you reply, “We don’t have to mess with the original house
    blueprint. If someone wants a Jacuzzi in his living room, we can make a new, small
    blueprint describing the living room and call this the Jacuzzi-in-living-room
    house blueprint. Then, this new blueprint can refer to the original house blueprint
    for info on the rest of the house (the part that’s not in the living room).” In
    the language of object-oriented programming, the Jacuzzi-in-living-room house
    blueprint extends the original house blueprint. The Jacuzzi blueprint is a subclass
    of the original house blueprint. In fact, all the terminology about superclass,
    parent class, and child class still applies. The only thing that’s new is that
    the Jacuzzi overrides the living room features in the original house blueprint.


    In the days before object-oriented languages, the programming world experienced
    a crisis in software development. Programmers wrote code, and then discovered
    new needs, and then had to trash their code and start from scratch. This problem
    happened over and over again because the code that the programmers were writing
    couldn’t be reused. Object-oriented programming changed all this for the better
    (and, by Burd, Java is “A Great Object-Oriented Language”).


    # Refining your understanding of classes and objects


    When you program in Java, you work constantly with classes and objects. These
    two ideas are really important. That’s why, in this chapter, I hit you over the
    head with one analogy after another about classes and objects.


    Close your eyes for a minute and think about what it means for something to be
    a chair . . .'
