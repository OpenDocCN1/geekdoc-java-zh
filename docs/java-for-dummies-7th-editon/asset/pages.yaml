    # # Importing everything in one fell swoop


    The first line of Listing 5-3 illustrates a lazy way of importing both System.out
    and System.in. To import everything that System has to offer, we use the asterisk
    wildcard (*). In fact, importing java.lang.System.* is like having about 30 separate
    import declarations, including System.in, System.out, System.err, System.nanoTime,
    and many other System things.


    The use of an asterisk in an import declaration is generally considered bad programming
    practice, so I don''t do it in this book''s examples. But for larger programs
    — programs use dozens of names from the Java API — the lazy asterisk trick is
    handy.


    You can''t toss an asterisk anywhere you want inside an import declaration. For
    example, you can''t import everything starting with java by writing import java.*.
    You can substitute an asterisk only for the name of a class or for the name of
    static that''s tucked away inside a class. For more information about asterisks
    in import declarations, see Chapter 9. For information about static things, see
    Chapter 10.


