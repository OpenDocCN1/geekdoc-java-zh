  md: '![](img/41729454897330473a2b5ec1aed6a545_370_0.png)


    In Listing 10-14, notice the type consistency in the calling and returning of
    the doBirth method:


    +   - The smackoverAR variable has type City. The smackoverAR variable is passed
    to the aCity parameter, which is also of type City.

    - The myCity variable is of type City. The myCity variable is sent back in the
    doBirth method''s return statement. That''s consistent, because doBirth method''s
    header begins with static City doBirth(blah, blah, blah) — a promise to return
    an object of type City.

    - The doBirth method returns an object of type City. Back in the main method,
    the object that call to doBirth returns is assigned to the smackoverAR variable,
    and (you guessed it) the smackoverAR variable is of type City.


    Aside from being harmonious, all this type agreement is absolutely necessary.
    If you write a program in which your types don''t agree with one another, the
    compiler spits out an unsympathetic incompatible types message.'
