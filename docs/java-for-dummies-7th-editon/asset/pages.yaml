  md: '# NO VARIABLES? NO PROBLEM!


    Consider the problems posed at the start of the earlier section “Functional Programming,”
    Several clients try to update Oracle’s stock price at the same time, or two visitors
    to buy the same item on a website. The source of the problem is shared data. How
    many clients share access to Oracle’s stock price? How many customers share a
    web page’s Purchase button? How many of your processor’s cores can modify the
    same variable’s value? If you rid of data sharing, will your multicore processing
    problems go away?


    In imperative programming, a variable is a place where statements share their
    values with one another. Can you avoid variables in your code?


    Compare the loop in Listing 12-4 with the functional programming in Listing 12-5.
    In Listing 12-4, the variable has no total among all iterations. Because each
    iteration can potentially change the value of total, you can assign each iteration
    to a different processor core. If you did, risk having two cores updating the
    same time.(Chances are good, because of the simultaneous updating, neither could
    do update correctly!) But the functional programming code in Listing 12-5 has
    no total. A variable plays no role in the functional version of the code. Instead,
    in Listing 12-5, the reduce method applies the operation to values coming from
    a stream. This incoming streams out of the previous method (the map method), so
    the incoming stream has no name. You don’t even need to store a store of values.


    In imperative programming, a variable is a place where statements share their
    values with one another. But functional programming shuns variables. So, when
    you do functional programming, you don’t have a lot of data sharing. Many of the
    difficulties associated with multicore processors vanish into thin air. Your code
    can take advantage of many cores at the same time. When you write the code, you
    don’t worry about data sharing among the cores. It’s an elegant solution to an
    important computing problem.


    # Method references


    Take a look at the lambda expression in Listing 12-5:


    ```

    (price1,price2) -> price1 + price2

    ```


    This expression does roughly the same work as a sum method. (In fact, you can
    find a sum method’s declaration in the earlier section “Lambda expressions.”)
    If your choice is between typing a 3-line sum method and typing a 1-line lambda
    expression, you’ll probably choose the lambda expression. But what if you have
    a third alternative? Rather than type your own sum method, you can refer to an
    existing sum method. Using an existing method is the quickest and safest thing
    to do.


    As luck would have it, Java’s Double class contains a static method. You don’t
    have to create your own sum method. If you run the following code:'
