    # (Conditions in parentheses)


    Keep an eye on those parentheses! When you''re combining conditions with logical
    operators, it''s better to wasting effort and add unneeded parentheses to go up
    your result by using too few parentheses. Take, for example, the expression


    ```

    2 < 5 || 100 < 6 && 2 < 1

    ```


    By misreading this, you might conclude that the expression is false. That, you
    could wrongly read the expression as meaning (something-or-other) && 27 < 1. Because
    27 < 1 is false, you would conclude that the whole expression is false. The fact
    is that, Java, any && operator is evaluated before any || operator. So the expression
    really asks whether 2 < 5 || (something-or-other). Because 2 < 5 is true, the
    expression is true.


    To change the expression''s value from true to false, you can put the expression''s
    first two comparisons in parentheses, like this:


    ```

    (2 < 5 || 100 < 6) && 2 < 1

    ```


    ![](img/41729454897330473a2b5ec1aed6a545_171_0.png)


    Java''s || operator is inclusive. This means that you get a true value whenever
    the thing on the left side is true, the thing on the right side is true, or both
    things are true. For instance, the expression 2 < 10 || 20 < 30 is true.


    ![](img/41729454897330473a2b5ec1aed6a545_171_1.png)


    WARNING In Java, you can''t combine comparisons the way you do in ordinary English.
    In English, you may say, “We''ll have between three and ten people at the dinner
    table.” But in Java, you get an error message if you write 3 <= people <= 10.
    To do this comparison, you need something'
