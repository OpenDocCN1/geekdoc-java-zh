  md: '# Experiments with Variables


    One summer during my college days, I was sitting on the front porch, loafing around,
    talking with someone I''d just met. I think her name was Janine.


    "Where are you from?" I asked. "Mars," she answered. She paused to see whether
    I''d ask a follow-up question.


    As it turned out, Janine was from Mars, Pennsylvania, a small town about 20 miles
    north of Pittsburgh. Okay, so what''s my point? The point is that the meaning
    of a name depends on the context. If you''re just north of Pittsburgh and ask,
    "How do I get to Mars from here?" you may get a sensible, nonchalant answer. But
    if you ask the same question standing on a street corner in Manhattan, you will
    probably arouse some suspicion. (Okay, knowing Manhattan, people would probably
    just ignore you.)


    Of course, the people who live in Mars, Pennsylvania, are very much aware that
    their town has an oddball name. Fond of teenage years at Mars High School don''t
    prevent a person from knowing about the big red planet. On a clearing evening
    in August, you can still have the following conversation with one of the local
    residents:


    You: How do I get to Mars?


    Local resident: You''re in Mars, pal. What particular part of Mars are you looking
    for?


    You: No, I don''t mean Mars, Pennsylvania. I mean the planet Mars.


    Local resident: Oh, the planet! Well, then, catch the 8:19 train leaving Cape
    Canaveral ... No, wait —that''s the local train. That''d take you through West
    Virginia...


    So the meaning of a name depends on where you''re using the name. Although most
    English-speaking people think of Mars as a place with a carbon dioxide atmosphere,
    some folks in Pennsylvania think about all the shopping they can do in Mars. And
    those folks in Pennsylvania really have two meanings for the name Mars. In Java,
    those names may look like this: Mars and planets.Mars.'
