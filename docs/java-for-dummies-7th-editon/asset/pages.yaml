  md: "# # Creating a Database and a Table\n\nThe crux of JDBC is contained in two\
    \ packages: java.sql and javax.sql, which are both in the Java API. This chapter’s\
    \ examples use the classes in java.sql. The first example is shown in Listing\
    \ 17-1.\n\n> LISTING 17-1: Creating a Database and a Table\n\n```\nimport java.sql.Connection;\n\
    import java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class CreateTable {\n\n    public static void main(String args[]) {\n\
    \        final String CONNECTION = \"jdbc:derby:AccountDatabase;create=true\"\
    ;\n\n        try (Connection conn = DriverManager.getConnection(CONNECTION));\n\
    \            Statement statement = conn.createStatement();\n            statement.executeUpdate(\"\
    create table ACCOUNTS \" +\n                \" (NAME VARCHAR(32) NOT NULL PRIMARY\
    \ KEY, \" +\n                \" ADDRESS VARCHAR(32), \" +\n                \"\
    \ BALANCE FLOAT)\");\n            System.out.println(\"ACCOUNTS table created.\"\
    );\n\n        } catch (SQLException e) {\n            e.printStackTrace();\n \
    \       }\n    }\n}\n```\n\nRunning the examples in this chapter is a bit trickier\
    \ than running other chapters. To talk to a database, you need an intermediary\
    \ piece of software known as a database driver. Database drivers come in all shapes\
    \ and sizes, many of them are expensive. Listing 17-1 points to a small, free\
    \ driver: the Derby JDBC driver. The code for the Derby JDBC driver is kept in\
    \ the EmbeddedDriver class (which is a class). This class lives inside the org.apache.derby.jdbc\
    \ package.\n\nWhen you use Java 9, you don't get this org.apache.derby.jdbc package.\
    \ You need a separate file named derby.jar, which you can download from http://db.apache.org/derby/derby_downloads.html.\n\
    \nEven you you've downloaded a copy of derby.jar, your IDE might not know where\
    \ you've put the file on your computer's hard drive. It's usually enough to put\
    \ derby.jar in a well-known directory. Instead, you have to tell"
  merge: -1
  pgno: 557
