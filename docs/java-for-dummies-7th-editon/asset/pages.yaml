  md: '# Access Modifiers


    If you''ve read this far into Java For Dummies, 7th Edition, you probably know
    one thing: Object-oriented programming is big on hiding details. Programmers who
    write one piece of code shouldn''t tinker with the details inside another programmer''s
    code. It''s not a matter of security and secrecy. It''s a matter of modularity.
    When you hide details, you keep the intricacies inside one piece of code from
    being twisted and broken by another piece of code. Your code comes in nice, discrete,
    manageable lumps. You keep complexity to a minimum. You make fewer mistakes. You
    save money. You help promote world peace.


    Other chapters have plenty of examples of the use of private fields. When a field
    is declared private, it''s hidden from all outside meddling. This hiding enhances
    modularity, minimizes complexity, and so on.


    Elsewhere in the annals of Java For Dummies, 7th Edition, are examples of things
    that are declared public. Just like a public celebrity, a field that''s declared
    public is left wide open. Plenty of people probably know what kind of toothpaste
    Elvis used, and any programmer can reference a public field, even a field that''s
    not named Elvis.


    In Java, the words public and private are called access modifiers. No doubt you''ve
    seen fields and methods without access modifiers in their declarations. A method
    or field of this kind is said to have default access. Many examples in this book
    use default access without making a big fuss about it. That''s okay in some chapters,
    but not in this chapter. In this chapter, I describe the gritty details about
    default access.


    And you can find out another access modifier that isn''t used in any example before
    this chapter. (At least, I don''t remember using it in any earlier examples.)
    It''s the protected access modifier. Yes, this chapter covers some of the slimy,
    grimy facts about protected access.'
  merge: -1
