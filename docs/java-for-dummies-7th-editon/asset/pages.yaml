    FIGURE 4-1; A variable (before and after).


    Now you need some terminology. The thing stored in a variable is a value. A variable''s
    value can change during the run of a program (when Jack gives you a million bucks,
    for instance). The value that''s stored in a variable isn''t necessarily a number.
    (For instance, you can create a variable that always stores a letter.) The kind
    of value that''s stored in a variable is a variable''s type.


    You can read more about types in the section "The types of values variables may
    have," later in this chapter.


    ![](img/41729454897330473a2b5ec1aed6a545_101_2.png)


    A subtle, almost unnoticed difference exists between a variable and a variable''s
    name. Even in formal writing, I often use the word variable when I mean variable
    name. Strictly speaking, amountInAccount is a variable, and all the memory storage
    associated with amountInAccount (including the type that) amountInAccount has
    and whatever value amountInAccount currently represents) is the variable itself.
    If you think this distinction between variable and variable name is too subtle
    to worry about, join the club.


    Every variable name is an identifier — a name that you can make up in your own
    code. In preparing Listing 4-1, I made up the name amountInAccount.'
