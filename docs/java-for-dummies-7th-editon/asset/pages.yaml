  md: '# FOUR WAYS TO STORE WHOLE NUMBERS


    Java has four types of whole numbers. The types are byte, short, int, and long.
    Unlike the complicated story about the accuracy of types float and double, the
    only thing that matters when you choose among the whole number types is the size
    of the number you''re trying to store. If you want to use numbers larger than
    127, don''t use byte. To store numbers larger than 32767, don''t use short.


    Most of the time, you''ll use int. But if you need to store numbers larger than
    2147483647, forsink in favor of long. (A long number can be as big as 9223372036854775807.)
    For the whole story, see Table 4-1, a little later in this chapter.


    # Combining declarations and initializing variables


    Look back at [Listing 4-3]. In that listing, you see three variable declarations—
    one each of the program''s three variables. I could have done the same thing with
    just one declaration:


    ```

    int weightOfAPerson, elevatorWeightLimit, numberOfOfPeople;

    ```


    ![](img/41729454897330473a2b5ec1aed6a545_112_0.png)


    > WARNING If two variables have completely different types, you can''t create
    both variables in the same declaration. For instance, to create an int variable
    named weightOfFred and a double variable amountInFreqsAccount, you need two separate
    variable declarations.


    You can give variables their starting values in a declaration. In [Listing 4-3],
    for instance, one declaration can replace several lines in the main method (all
    the calls to print and println):


    ```

    int weightOfAPerson = 150, elevatorWeightLimit = 1400, numberOfPeople = elevatorWeightLimit/weightOfAPerson;

    ```


    When you do, you don''t say that you''re assigning values to variables. The pieces
    of the declarations with equal signs in them aren''t really called assignment
    statements. Instead, you say that you''re initializing the variables. Believe
    it or not, keeping this distinction in mind is helpful.


    Like everything else in life, initializing a variable has advantages and'
