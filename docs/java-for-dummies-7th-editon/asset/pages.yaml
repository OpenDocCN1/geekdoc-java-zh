  md: "The Integer is an example of a wrapper class. Each of Java’s eight primitive\
    \ types has a corresponding wrapper class. You can use methods and fields in Java’s\
    \ Double, Character, Boolean, Long, Float, Short, and Byte wrapper classes. For\
    \ example, the Double class has methods parseDouble, compareTo, toHexString, and\
    \ fields named MAX_VALUE and MAX_EXPONENT.\n\nThe Integer class wraps the primitive\
    \ type with useful methods and values. In addition, you can create an Integer\
    \ instance that wraps a single int value:\n\n```\nInteger myInteger = new Integer(42);\n\
    ```\n\nIn this line of code, the myInteger variable has one int value inside it:\
    \ the int value 42. In Paul’s words, wrapping the int 42 into an Integer object\
    \ myInteger is “something like putting lots of breading on okra. It makes 42 more\
    \ desirable for finicky eaters like collectors.\n\nInstances of the other wrapper\
    \ classes work the same way. For example, an instance of the Double class wraps\
    \ up a single primitive value.\n\n```\nDouble averageNumberTomatoes = new Double(1.44121356237);\n\
    ```\n\nHere’s a program that shows five Integer values in an ArrayList:\n\n```\n\
