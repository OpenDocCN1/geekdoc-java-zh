  md: '# Finishing the Job with a finally Clause


    Once upon a time, I was a young fellow, living with my parents in Philadelphia,
    just starting to drive a car. I was heading toward a friend''s house and thinking
    about who-knows-what when another car came from nowhere and bashed my car''s passenger
    door. This kind of thing is called a RunRedLightException.


    Anyway, both cars were drivable, and we were right in the middle of a busy intersection.
    To avoid causing a traffic jam, we both pulled over to the nearest curb. I fumbled
    for my driver''s license (which had a very young picture of me on it) and opened
    the door to get out of my car.


    And that''s when the second accident happened. As I was getting out of my car,
    a bus was coming by. The bus hit me and rolled against my car a few times. This
    kind of thing is called a DealWithLawyersException.


    The truth is that everything came out fine. I was bruised but not battered. My
    parents paid for the damage to the car, so I never suffered any financial consequences
    (I managed to pass on the financial burden by putting the RunRedLightException
    into my throws clause.)


    This incident helps to explain why I think the way I do exception handling. In
    particular, I wonder, “What happens if, while the computer is recovering from
    one exception, a second exception is thrown?” After all, the statements inside
    a catch clause aren''t immune to calamities.


    Well, the answer to this question is anything but simple. For starters, you can
    put a statement inside a catch clause. This protects you against unexpected, potentially
    embarrassing incidents that can crop up during the execution of the catch clause.
    When you worry about cascading exceptions, you open up a very slim can of numbers.
    The number of scenarios is large, and things can become complicated very quickly.


    One not-too-complicated thing that you can do is create a finally clause. Like
    a catch clause, finally comes after a try clause. The big difference is that the
    statements in a finally clause are executed whether or not an exception is thrown.
    The idea is, “No matter what happens, good or bad, execute the statements inside
    this finally clause.” Listing 13-11 has an'
