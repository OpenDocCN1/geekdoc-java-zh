  md: '# Sending Values to and from Methods (Calculating Interest)


    Think about sending someone to the supermarket to buy. When you do this, you say,
    “Go to the supermarket and buy some bread.” (Try it at home. You''ll have a fresh
    loaf of bread in no time at all!) Of course, some other time, you send that some
    person to the supermarket to buy bananas. You say, “Go to the supermarket and
    buy some bananas.” And what''s the point of all this? Well, you have a method,
    and you have some on-the-fly information that you pass to the method when you
    call it. The method is named gotoTheSupermarketAndBuySome. The on-the-fly information
    is either bread or bananas, depending on your culinary needs. In Java, the method
    calls would like this:


    ```

    gotoTheSupermarketAndBuySome(bread);

    gotoTheSupermarketAndBuySome(bananas);

    ```


    The things in parentheses are called parameters or parameter lists. With parameters,
    your methods become much more versatile. Instead of getting the same thing each
    time, you can send somebody to the supermarket to buy bread one time, bananas
    another time, and birdseed the third time. When you call your gotoTheSupermarketAndBuySome
    method, you decide right what you''re going to ask your pal to pay.


    And what happens when your friend returns from the supermarket? “Here''s the bread
    you asked me to buy,” says your friend. By carrying out your wishes, your friend
    returns something to you. You make a method call, and the method returns information
    (or a loaf of bread).


    The thing returned to you is called the method return value. The general type
    of thing that is returned to you is called the method''s return type. These concepts
    are made more concrete in Listings 7-5 and 7-6.


