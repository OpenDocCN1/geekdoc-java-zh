  md: '# # Defining a Class (What It Means to Be an Employee)


    Wouldn''t it be nice if every piece of software did just what you wanted it to
    do? In an ideal world, you could buy a program, make it work right away, plug
    it seamlessly into new situations, and update it easily whenever your needs change.
    Unfortunately, software of this kind doesn''t exist. (Nothing of this kind exists.)
    The truth is that no matter what you want to do, you can find software that does
    some of it, but not all of it.


    This is one of the reasons object-oriented programming has been successful. For
    years, companies were buying prewritten code, only to discover that the code didn''t
    do what they wanted it to. So, what did the companies about it? They started messing
    with the code. Their programmers dug deep into the program files, changed variable
    names, moved subprograms, reworked formulas, and generally made the code worse.
    The reality was that if a program didn''t already do what you wanted it to (even
    you could never improve the situation by mucking around inside the code. The best
    option was always to chuck the whole program (expensive as that was) and start
    all over again. What a sad state of affairs!


    With object-oriented programming, a big change has come about. At its heart, an
    object-oriented program is to be modified. With correctly written software, you
    can take advantage of features that are built-in, make new features of your own,
    and override features that don''t suit your needs. And the best part is that the
    changes you make are clean. Clawing and digging into other people''s brittle program
    code. Instead, you make nice, orderly additions and modifications without touching
    the existing code''s internal logic. It''s the ideal solution.


    # # The last word on employees


    When you write an object-oriented program, you start by thinking about the data.
    You''re writing about accounts. So what''s an account? You''re writing code to
    handle button clicks. So what''s a button? You''re writing a program to send payroll
    checks to employees. What''s an employee?'
