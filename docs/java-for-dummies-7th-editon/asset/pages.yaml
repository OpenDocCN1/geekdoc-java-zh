  md: '# # Hiding Details with Accessor Methods


    Put down this book and put on your hat. You''ve been such a loyal reader that

    I''m taking you out to lunch!


    Wait, I me re-read.

    I have just one problem. I''m a bit short on cash. Would you mind if, on the

    way to lunch, we stopped at an automatic teller machine and picked up a few

    bucks? Also, we have to use your account. My account is a little low.


    Fortunately, the teller machine is easy to use. Step right up and enter your

    PIN. After you enter your PIN, the machine asks which of several variable

    ames you want to use for your current balance. You have a choice of

    balance324, myBal, b5, BALANCE, asj99, or

    conStanTinole. Having selected a variable name, you''re ready to select a

    memory location for the variable''s value. You can select any number between

    022FFF and 0555AA. (Those numbers are in hexadecimal format.) After you

    configure the teller machine''s software, you can easily get your cash. You did

    bring a screwdriver, didn''t you?


    # # Good programming


    When it comes to good computer programming practice, one word stands

    above all: *simplicity*. When you''re writing complicated code, the last

    thing you want is to deal with somebody else''s misnamed variables,

    convoluted solutions to problems, or clever, last-minute kludges. You want a

    clean interface that makes you solve your problems and no one else''s.


    In the automatic teller machine scenario that I describe earlier, the big

    problem is that the machine''s design forces you to worry about other people''s

    cerns. When you should be thinking about getting money for lunch,

    y''re thinking instead about variables and storage locations. Sure, someone

    has to work out the teller machine''s engineering problems, but the banking

    customer isn''t the person.


    > > REMEMBER This section is about safety, not security. Safe code keeps you from\making
    accidental programming errors. Secure code (a completely

    different story) keeps malicious hackers from doing intentional damage.


    ![](img/41729454897330473a2b5ec1aed6a545_243_0.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'So, everything connected with every aspect of a computer program has to be
    simple, right? Well, no. That''s not right. Sometimes, to make things simple in
    the long run, you have to do lots of preparatory work up front. The people who
    built the automated teller machine worked hard to make sure that the machine is
    consumer-proof. The machine''s interface, with its screen messages and buttons,
    makes the machine a very complicated, but carefully designed, device.


    The point is making things simple takes some planning. In the case of object-oriented
    programming, one of the ways to make things simple is to prevent code outside
    a class from directly using fields inside the class. Take a peek at the code in
    Listing 7-1. You''re working at a company that has just spent $10 million for
    the code in the Account class. (That''s more than a million-and-a-half per line!)
    Now your job is to write the UseAccount class.


    but doing so gets you too far inside the guts of the Account class. After all,
    people who use an automatic teller machine aren''t allowed to program the machine''s
    variables. They can''t use the machine''s keypad to type the statement


    ```

    balanceAccount029872865457 = balanceAccount029872865457 + 1000000.00;

    ```


    Instead, they push buttons that do the job in an orderly manner. That''s how a
    programmer achieves safety and simplicity.


    To keep things nice and orderly, you need to change the Account class from Listing
    7-1 by outlawing such statements as the following:


    ```

    myAccount.name = "Barry Burd";

    ```


    and


    ```

    out.print(yourAccount.balance);

    ```


    Of course, this poses a problem. If you''re the person who''s writing the code
    for the UseAccount class. If you can''t write myAccount.name or yourAccount.balance,
    how will you accomplish anything at all? The answer lies in things called accessor
    methods. Listings 7-8 and 7-9 demonstrate these methods.


    # LISTING 7-8: Hide Those Fields'
