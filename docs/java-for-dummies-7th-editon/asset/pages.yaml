  md: '# WHAT’S THIS ALL ABOUT?


    Suppose your code contains a constructor — the first of the two constructors in
    Listing 9-4. The whatever parameter is passed a number like 32.0, for instance.
    Then the first statement in the constructor''s body assigns value, 32.0, to the
    new object''s number field. The code works. But in writing this code, you had
    made up a new name for a parameter — the name whatever. And the only purpose for
    this name is to have a value to the object''s number field. What a waste! To distinguish
    the parameter and the number field, you gave a name to something that was momentary
    storage for the number value.


    Making up names is not an art, I''ve gone plenty of naming variables. Years ago,
    whenever I needed a new name for a parameter, I picked a confusing misspelling
    of the original variable name (I''d name a parameter like number or number). I''ve
    also tried changing a variable''s capitalization to come with a parameter. I''d
    use parameters like Number or number. In Chapter 8, I name all parameters by adding
    the suffix In their corresponding variable names. The jobTitle variable matched
    with the jobTitleParam. None of these naming schemes works well — I can never
    remember the quirky names that I''ve created. The good news is that this parameter-naming
    effort isn''t necessary. You can give the parameter the same name as the variable.
    To distinguish between the two, you use the Java keyword.


    # Some things never change


    Chapter 7 introduces the printf method and explains that each printf call starts
    with a format string. The format string describes what the other parameters are
    to be displayed.


    In previous examples, this format string is always a quoted literal. Instance,
    the first printf call in Listing 7-7 (see Chapter 7) is


    ```

    out.printf("$%4.2f\n", myInteger);

    ```


    In Listing 9-3, I break with tradition and begin the printf call with a variable
    that I name format.


    ```

    out.printf(format, temp.getNumber(), temp.setScale());

    ```


    That''s as long as my format variable is of type String. And indeed, in Listing
    9-3, the first variable declaration is


    ```

    final String format = "%5.2f degrees %s\n";

    ```


    In this declaration of the format variable, take special note of the word final.
    This Java keyword indicates that the value of format can''t be changed. If I add
    another assignment statement to Listing 9-3


    ```

    format = "%6.2f (%s)\n";

    ```'
