  md: '# The Atoms: Java’s Primitive Types


    The words int and double that I describe in the previous sections are examples
    of primitive types (also known as simple types) in Java. The Java language has
    exactly eight primitive types. As a newcomer to Java, you can pretty much ignore
    all four of these types. (As programming languages go, Java is nice and compact
    that way.) Table 4-1 shows the complete list of primitive types.


    # TABLE 4-1 Java’s Primitive Types


    | Type Name | What a Literal Like | Range of Values |

    |---|---|---|

    | Whole number types | | |

    | byte | (byte)42 | -128 to 127 |

    | short | (short)42 | -32768 to 32767 |

    | int | 42 | -2147483648 to 2147483647 |

    | long | 42L | -9223372036854775808 to 9223372036854775807 |

    | Decimal number types | | |

    | float | 42.0F | -3.4 × 10⁻⁵ to 3.4 × 10³ |

    | double | 42.0 | -1.8 × 10⁻³⁰⁸ to 1.8 × 10³⁰⁸ |

    | Character type | | |

    | char | ''A'' | Thousands of characters, glyphs, and symbols |

    | Logical type | | |

    | boolean | true | true, false |


    The types that you shouldn''t ignore are int, double, char, and boolean. Previous
    sections in this chapter cover the int and double types. So the next sections
    cover char and boolean types.


    # The char type


    Several decades ago, people thought computers existed only for doing big number-crunching
    calculations. Nowadays, nobody thinks that. So, if you haven''t been in a cryogenic
    freezing chamber for the last 20 years, you know that computers store letters,
    punctuation symbols, and other characters.


    The Java type that’s used to store characters is called char. Listing 4-4 has
    a simple program that uses the char type. Figure 4-8 shows the output of the'
