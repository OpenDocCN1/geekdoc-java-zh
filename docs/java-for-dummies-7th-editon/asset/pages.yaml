    # The static keyword is yesterday''s news


    This section makes a big noise about static fields, but static things have been
    part of the picture since early in this book. For example, [Chapter 3] introduces
    System.out.println. The name System refers to a class, and out is a static field
    in that class. That''s why, in [Chapter 4] and beyond, you use the static keyword
    to import the out field:


    ```

    import static java.lang.System;

    ```


    In java, static fields and methods show up over the place. When they''re declared
    in someone else''s code and you''re making use of them in your code, you hardly
    have to worry about them. But when you''re declaring your own fields and methods
