  md: '# Getting Perspective: Where Java Fits In


    Here’s a brief history of modern computer programming:


    +   ** **1954–1957: FORTRAN is developed.**

    FORTRAN was the first modern computer programming language. For scientific programming,
    FORTRAN is a real horsehorse. Year after year, FORTRAN is a leading language among
    computer programmers throughout the world.


    +   ** **1959: Grace Hopper Remington Rand develops the COBOL programming language.**

    The letter B in COBOL stands for *Business*, and business is just what COBOL is
    all about. The language’s primary feature is the processing of one record after
    another, one customer after another, or one employee after another.

    Within a few years after its initial development, COBOL became the widely used
    language for business data processing.


    +   ** **1972: Dennis Ritchie at AT&T Bell Labs develops the C programming language.**

    The “look and feel” that you see in this book’s examples comes from the C programming
    language. Code written in C uses curly braces, if statements, statements, and
    so on.

    In terms of power, you can use C to solve the same problems that you can solve
    by using FORTRAN, Java, or any other modern programming language. (You can write
    a scientific calculator program in COBOL, but doing that sort of thing would feel
    really strange.) The difference between one programming language and another isn''t
    power. The difference is ease and appropriateness of use. That’s where the Java
    language excels.


    +   ** **1986: Bjarne Stroustrup (again at AT&T Bell Labs) develops C++.**

    Unlike its C language ancestor, the language C++ supports object-oriented programming.
    This support represents a huge forward. (See the next section in this chapter.)'
