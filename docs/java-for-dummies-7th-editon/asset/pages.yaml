  md: 'point, look at Figure 11-1.)


    ![](img/41729454897330473a2b5ec1aed6a545_375_0.png)


    FIGURE 11-1: An abstract snapshot of rooms in the Java Motel.


    In the lingo of this chapter, the entire row of rooms is called an array. Each
    room in the array is called a component of the array (also known as an array element).
    Each component has two numbers associated with it:


    +   ** The room number (a number from 0 to 9), which is called an index of the
    array

    ** A number of guests, which is a value stored in a component of the array


    Using an array saves you from all the repetitive nonsense in the sample code shown
    at the beginning of this section. For instance, to declare an array with ten values
    in it, you can write one fairly short statement:


    ```

    int guests[] = new int[10];

    ```


    If you''re especially verbose, you can expand this statement so that it becomes
    two separate statements:


    ```

    int guests[];

    guests = new int[10];

    ```


    In either of these code snippets, notice the use of the number 10. This number'
