    # The types of values that variables may have


    Have you seen the TV commercials that make you think you''re flying among

    the circuits inside a computer? Pretty cool, eh? These commercials show 0s

    (zeros) and 1s (ones) sailing because 0s and 1s are the only things that

    Computers can deal with. When you think a computer is storing the letter J,

    the computer is really storing 01001010. Everything the computer is a

    sequence of 0s and 1s. As every geek knows, a 0 or 1 is called a bit.


    As it turns out, the sequence 01001010, which stands for the letter J, can also

    stand for the number 74. The same sequence can also stand for

    1.0369608636003646 × 10⁻⁴³. In fact, if the bits are interpreted as screen

    pixels, the same sequence can be used to represent the dots shown in Figure

    4-4. The meaning of 01001010 depends on the way the software interprets

    this sequence of 0s and 1s.'
