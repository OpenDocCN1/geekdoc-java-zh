  md: "In this chapter's first example, an employee is someone with a name and a job\
    \ title. Sure, employees have other characteristics, but for now I stick to the\
    \ basics. The code in Listing 8-1 defines what it means to be an employee.\n\n\
    # LISTING 8-1: What Is an Employee?\n\n```\nimport static java.lang.System.out;\n\
    \npublic class Employee {\n    private String name;\n    private String jobTitle;\n\
    \n    public void setName(String nameIn) {\n        name = nameIn;\n    }\n\n\
    \    public String getName() {\n        return name;\n    }\n\n    public void\
    \ setJobTitle(String jobTitleIn) {\n        jobTitle = jobTitleIn;\n    }\n\n\
    \    public void cutCheck(double amountPaid) {\n        out.printf(\"Pay to the\
    \ order of %s,\\n\", name);\n        out.printf(\"%%%s ***s,\\n\", jobTitle);\n\
    \        out.printf(\"%.2f\\n\", amountPaid);\n    }\n}\n```\n\nAccording to Listing\
    \ 8-1, each employee has seven features. Two of these features are fairly simple:\
    \ Each employee has a name and a job title. (In Listing 8-1, the Employee class\
    \ has a name and a job title.)\n\nAnd what else does employee have? Each employee\
    \ has four methods to handle the values of the employee's name and job title.\
    \ These methods are setName, getName, setJobTitle, and getJobTitle. I explain\
    \ methods like these (accessor methods) in Chapter 7.\n\nOn top of all of that,\
    \ each employee has a cutCheck method. The idea is that the method writes payroll\
    \ checks has belong to one class or another. Because most of the information in\
    \ the payroll check is customized for a particular employee, you may as well put\
    \ the cutCheck method inside the Employee class."
