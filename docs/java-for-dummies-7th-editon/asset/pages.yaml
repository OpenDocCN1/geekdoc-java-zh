  md: '# The Java Interface


    Think about a class (such as an Employee class) and a subclass (such as a FullTimeEmployee
    class). The relationship between a class and subclass is one of inheritance. In
    many real-life families, a child inherits assets from a parent. And in Chapter
    8, the FullTimeEmployee class inherits name and jobTitle fields from the Employee
    class. That''s how it works.


    But consider the relationship between an editor and an author. The editor says,
    "By signing this contract, you agree to submit a completed manuscript by the ninth
    of January." Despite any excuses that the author gives before the deadline date
    (and, believe) we make plenty of excuses), the relationship between the editor
    and the author is one of obligation. The author agrees to take on responsibilities;
    and, in order to continue being an author, the author must fulfill those responsibilities.
    (By the way, there''s no subtext in this paragraph — none at all.)


    Now consider Barry Burd. Who? Barry Burd — that guy writes Java For Dummies and
    contains other For Dummies books (all from Wiley Publishing). is also an author.
    You want to mirror this situation in a Java program, but Java doesn''t support
    multiple inheritance. You can''t make Barry extend both a Professor class and
    an Author class at the same time.


    Fortunately for Barry, Java has interfaces. An interface is a kind of reference
    type. In fact, the code to create an interface looks lot like the code to create
    a class:


    ```

    public interface MyInterfaceName {

    // blah, blah, blah

    }

    ```


    An interface is like a class, but an interface is different. (So, what else is
    new? A cow is like a planet, but it''s a bit different. Cows moo; planets hang
    in space.)


    Anyway, when you read the word interface, you can start by thinking of a class.
    Then, in your head, note that


    +   A class can extend only one parent class, but a class can implement many interfaces.'
