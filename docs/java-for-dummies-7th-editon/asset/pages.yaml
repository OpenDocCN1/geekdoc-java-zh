  md: 'you pass a parameter that has one of the eight primitive types, that parameter
    is passed by value.


    ![](img/41729454897330473a2b5ec1aed6a545_363_0.png)


    REFERENCE For a review of Java''s eight primitive types, see Chapter 4.


    Here''s what this means in plain English: Any changes that the method makes to
    the value of its parameter don''t affect the values of variables back in the calling
    code. In Listing 10-10, the birth method can apply the ++ operator to cityPop
    all it wants — the application of ++ to the cityPop parameter has absolutely no
    effect on the value of the smackoverARPop variable back in the main method.


    Technically, what''s happening is the copying of a value. (See Figure 10-11.)
    When the main method calls the birth method, the value stored in smackoverARPop
    is copied to another memory location — a location reserved for the cityPop parameter
    value. During the birth method''s execution, 1 is added to the cityPop parameter.
    But the place where the original 2232 value was stored — the memory location for
    the smackoverARPop variable — remains unaffected.'
