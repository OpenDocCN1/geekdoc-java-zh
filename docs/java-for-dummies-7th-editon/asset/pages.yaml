- img_proc: true
  md: 'text editors such as Windows Notepad, Macintosh TextEdit, or the vim editor
    in Linux. But, as a novice programmer, a full-featured IDE makes your life much,
    much easier.


    The Wide Web has free, downloadable versions of each of these tools:


    +   - When you download the Java SDK from Oracle''s website (www.oracle.com/technetwork/java/javase/downloads/index.html),
    you get the compiler and the JVM.

    - When you select the Eclipse (www.eclipse.org/downloads), IntelliJ IDEA (www.jetbrains.com/idea),
    or NetBeans (https://netbeans.org/downloads) site, you get an IDE.


    ![](img/41729454897330473a2b5ec1aed6a545_50_0.png)


    You may find variations on the picture that I paint in the preceding bullets.
    Many IDEs come with their own JVMs, and Oracle''s website may offer a combined
    JDK+NetBeans bundle. Nevertheless, the picture that I paint with these bullets
    is useful and reliable. When you follow my instructions, you might end up with
    two copies of the JVM, or two IDEs, but that''s okay. You never know when you''ll
    need a spare.


    ![](img/41729454897330473a2b5ec1aed6a545_50_1.png)


