  md: 'Barry Burd. 222 Cyber Lane $24.02

    Joe Doe. 111 Luddite Street $55.63


    **Figure 17-1:** Getting data from the database.


    isting 17-3 calls executeQuery and supplies the call with an SQL command.

    For those who know SQL commands, this particular command gets all data

    from the ACCOUNTS table (the table you get in Listing 17-1).


    The thing returned from calling executeQuery is of type java.sql.ResultSet.

    (That''s one of the differences between the executeUpdate and executeQuery

    methods: executeQuery returns a result set, and executeUpdate doesn''t.)

    a result set is much like a database table. Like the original table, the result
    set

    hrows and columns. Each row contains the data for one account. In this

    example, each row has a name, an address, and a balance amount.


    After you call executeQuery and get your result set, you can step through the

    result set one row at a time. To do this, you go into a little loop and test the

    conditionset.next() at the top of each loop iteration. Each time around,

    the call to resultSet.next() does two things:


    +   - It moves you to the next row of the result set (the next account) if another

    row exists.


    +   - It tells you whether another row exists by returning a boolean value —

    true or false.


    If the condition resultSet.next() is true, the result set has another row.

    The computer moves to that row, so you can march into the body of the loop

    and scoop data from that row. On the other hand, if resultSet.next() is false,

    result set doesn''t have any more rows. You jump out of the loop and start

    closing everything.


    Now, imagine the computer is pointing to a row of the result set,

    and you''re inside the loop in Listing 17-3. You''re retrieving data from the

    result set''s row by calling the result set''s getString and getFloat methods.

    Back in Listing 17-1, you set up the ACCOUNTS table with the columns

    NAME, ADDRESS, and BALANCE. Here in Listing 17-3, you''re getting

    data from these columns by calling your getSomeTypeOr methods and

    feeding the original column names to these methods. After you have the data,

    y display the data on the computer screen.'
