    Once upon a time, most programmers used a text-based development interface. To
    run the Displayer example in Chapter 3, they didn''t select Run from a menu in
    a fancy integrated development environment. Instead, they typed a command in a
    plain-looking window, usually with white text on a black background. Figure 11-12
    illustrates the point. In Figure 11-12, I type the words **java Displayer** and
    the computer responds with my Java program''s output (the words You''ll love Java!)


    ![](img/41729454897330473a2b5ec1aed6a545_398_0.png)


    **Figure 11-12:** How dull!


    The plain-looking window goes by the various names, depending on the kind of operating
    system that you use. In Windows, a text window of this kind is a *command prompt*
    window. On a Macintosh and in Linux, this window is the terminal. Some versions
    of Linux and UNIX call this window a *shell*.


    Anyway, back in ancient times, you could write a program that sucked up extra
    information when you typed the command to launch the program. Figure 11-13 shows
    you how this worked.'
