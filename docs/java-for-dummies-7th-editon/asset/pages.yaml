  md: '# Java’s Types


    Chapter 4 explains that Java has these two kinds of types:


    +   >> Java has eight primitive types.


    >> Java has eight primitive types.


    The four that you use most often are int, double, boolean, and char.


    +   >> Java’s API has thousands of reference types. And, when you write a Java
    program, you define new reference types.


    Java’s String type is a reference type. So are Java’s Scanner, JFrame, ArrayList,
    and File types. My DummiesFrame is a reference type. In Chapter 7, you create
    your own Employee, FullTimeEmployee, and PartTimeEmployee reference types. Your
    first You’ll love Java! program has a main method inside of a class, and that
    class is a reference type. You may not realize it, but every array belongs to
    a reference type.


    In Java, reference types are everywhere. But until this point in the book, the
    only reference types that you see are classes and arrays. Java has other kinds
    of reference types, and this chapter explores the possibilities.'
