    One question is, when you ask the computer to create a new object, can you control
    what’s placed in the object’s fields? And what if you’re interested in doing more
    filling fields? Perhaps, when the computer creates a new object, you have a whole
    list of jobs for the computer to carry out. For instance, when the computer creates
    a new window object, you want the computer to realign the sizes of all buttons
    in that window.


    Creating a new object can involve all kinds of tasks, so in this chapter you create
    constructors. A constructor tells the computer to perform a new object’s start-up
    tasks.


