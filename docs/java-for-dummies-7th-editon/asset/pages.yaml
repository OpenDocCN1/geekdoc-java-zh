  md: 'Figure 6-3 shows what you get when you run the program of Listing 6-2. (You
    get exactly what you deserve.) The for statement in Listing 6-2 starts by setting
    the count variable to 1. Then the statement tests to make sure that count is less
    than or equal to 10 (which it is). Then the for statement dives ahead and executes
    the printing statements between the curly braces. (At this early stage of the
    game, the computer prints The value of count is 1.) Finally, the for statement
    that last thing inside its parentheses — it adds 1 to the value of count.


    ```

    The value of count is 1.

    The value of count is 2.

    The value of count is 3.

    The value of count is 4.

    The value of count is 5.

    The value of count is 6.

    The value of count is 7.

    The value of count is 8.

    The value of count is 9.

    The value of count is 10.

    Done!

    ```


    FIGURE 6-3: Counting to ten.


    With count now equal to 2, the for statement checks again to make sure that count
    is less than or equal to 10. (Yes, 2 is smaller than 10.) Because the test turns
    out okay, the for statement marches back into the curly braced statements and
    prints The value of count is 2 on the screen. Finally, the for statement that
    last thing inside its parentheses — it adds 1 to the value of count, increasing
    the value of count to 3.


    And so on. This whole thing repeats until, after 10 iterations, the value of count
    finally reaches 11. When this happens, the check for count being less than or
    equal to 10 fails, and the loop’s execution ends. The computer jumps to whatever
    statement comes immediately after the statement. In Listing 6-2, the computer
    prints Done! as its output. Figure 6-4 illustrates the whole process.'
