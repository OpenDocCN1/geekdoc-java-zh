  md: '# # Forming Conditions with Comparisons and Logical Operators


    The Java programming language has plenty of little squiggles and doodads for your
    various condition-forming needs. This section tells you all about them.


    # ## Comparing numbers; comparing characters


    Table 5-1 shows you the operators that you can use to compare one another.


    TABLE 5-1 Comparison Operators


    | Operator Symbol | Meaning | Example |

    | :--- | :--- | :--- |

    | == | is equal to | numberCows == 5 |

    | != | is not equal to | clicked != panicButton |

    | < | is less than | numberCows < 5 |

    | > | is greater than | myInitial > ''B'' |

    | <= | is less than equal to | numberCows <= 5 |

    | >= | is greater than or equal to | myInitial >= ''B'' |


    You can use all of Java''s comparison operators to compare numbers and characters.
    When you compare numbers, things go pretty much the way you think they should.
    But when you compare characters, things are a little strange. Comparing uppercase
    letters with one another is no problem. Because the letter B comes alphabetically
    before H, the condition ''B'' < ''H'' is true. Comparing lowercase letters with
    one another is also okay. What''s strange is that when you compare an uppercase
    letter with a lowercase letter, the uppercase letter is always smaller. So, even
    though ''Z'' < ''A'' is false, ''Z'' < ''a'' is true.


    ![](img/41729454897330473a2b5ec1aed6a545_162_0.png)


    TECHNICAL STUFF Under the hood, the letters A through Z are stored with numeric
    codes 65 through 90. The letters a through z are stored with codes 97 through'
