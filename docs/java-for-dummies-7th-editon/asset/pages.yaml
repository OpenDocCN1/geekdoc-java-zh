  md: '# PACKAGES AND IMPORT DECLARATIONS


    Java has a feature that lets you lump classes into groups of classes. Each lump
    of classes is called a package. In the Java world, programmers customarily give
    these packages long, dot-filled names. For instance, because I''ve registered
    the domain allmycode.com, I may name a package com.allmycode.utils.Utils The Java
    API is actually a big collection of packages. The API has packages with names
    like java.lang, java.util, java.awt, and java.swing.


    With this information about packages, I can clear up some of the confusion about
    import declarations. Any import declaration that doesn''t use the word static
    must start with the name of a package and must end with either of the following:


    +   * The name of a class within that package

    * An asterisk (indicating all classes within that package)


    For example, the declaration


    ```

    import java.util.Scanner;

    ```


    is valid because java.util is the name of a package in the Java API, and Scanner
    is the name of a class in the java.util package. The dotted name java.util.Scanner
    is called the *fully qualified name* of the Scanner. A class''s fully qualified
    name includes the name of the package in which the class is defined. (You can
    find out all stuff about java.util and Scanner by reading Java''s API documentation.
    For tips on reading the documentation, see Chapter 3 and this book''s website.)


    Here''s another example. The declaration


    ```

    import java.swing.*;

    ```


    is valid because java.swing is the name of a package in the Java API, and the
    asterisk refers to all classes in the java.swing package. With this import declaration
    at the top of your Java code, you can use abbreviated names for classes in the
    java.swing package — names like JFrame, JButton, JMenuBar, JCheckBox, and many
    others.


    Here''s one more example. A line like


    ```

    import java.*; // /Bad!

    ```


    is not valid import declaration. The Java API has no package with the one-word
    name Java. You may think that this allows you to abbreviate all names beginning
    with javas (names like java.swing.JFrame, and java.sound.midi), but that''s not
