    the next is named guests[1], and so on. The last of the ten components is named
    guests[9].


    In creating an array, you always specify the number of components. The array’s
    indices start with 0 and end with the number that’s less than the total number
    of components.


    The snippets that I show give you two ways to create an array. The first way is
    one line. The second way uses two lines. If you take the single-line route, you
    can put that line inside or outside a method. The choice is yours. On the other
    hand, if you use two separate lines, the second line, guests = new int[10], should
    be inside a method.


    In an array declaration, you can put the square brackets before or the variable
    name. In other words, you can write int guests[] or int[] guests. The computer
    creates the same guests variable no matter which form you use.


    # Creating an array in two easy steps


    Look again the two lines that you can use to create an array:


    ```

    int guests[];nguest = new int[10];

