  md: '# Using streams and lambda expressions


    Java has fancy methods that make optimal use of streams and lambda expressions.
    With streams and lambda expressions, you can create an assembly line that elegantly
    solves this chapter''s sales problem. Unlike the code in Listing 12-4, the new
    assembly-line solution uses concepts from functional programming.


    The assembly line consists of several methods. Each method takes the data, transforms
    the data in some way or other, and hands its results to the next method in line.
    Figure 12-9 illustrates the assembly line for this chapter''s sales problem.


    ![](img/41729454897330473a2b5ec1aed6a545_430_0.png)


    **FIGURE 12-9:** A functional programming assembly line.


    In Figure 12-9, each box represents a bunch of raw materials as they''re'
  merge: -1
  pgno: 430
- img_proc: true
  md: 'transformed along an assembly line. Each arrow represents a method (or, metaphorically,
    a worker on the assembly line).


    For example, in the transition from the second box to the third box, a worker
    method (the filter method) sifts out sales of items that aren''t DVDs. Imagine
    Lucy Ricardo standing between the second and third boxes, removing each book or
    CD from the assembly line and tossing it carefully onto the floor.


    The parameter to Java''s filter method is a Predicate — a lambda expression whose
    result is boolean. (See Tables 12-2 and 12-3.) The filter method in Figure 12-9
    sifts out items that do not pass the lambda expression''s true / false test.


    # TABLE 12-3 Some Functional Programming Methods


    | Method Name | Member Of | Parameter(s) | Result Type | Result Value |

    |---|---|---|---|---|

    | stream | Collection (for example, ArrayList object) | (none) | Stream | A stream
    that sifts elements of the collection |

    | filter | Stream | Predicate | Stream | A new stream containing values for the
    lambda expression returns true |

    | map | Stream | Function | Stream | A new stream containing the results of applying
    the lambda expression to the incoming stream |

    | reduce | Stream | BinaryOperator | The type used by the BinaryOperator | The
    result of combining all the values in the incoming stream |


    ![](img/41729454897330473a2b5ec1aed6a545_431_0.png)


    REFERENCE For some help understanding the words in the third column of Table 12-3
    (Predicate, Function and BinaryOperator), see the earlier section “A taxonomy
    of lambda expressions."


    In Figure 12-9, in the transition from the third box to the fourth box, a worker
    method (the map method) pulls the price out of each sale. From that worker''s
    place onward, the assembly line contains only price values.


    To be more precise, Java''s map method takes a Function such as


    ```

    (sale) -> sale.getPrice()

    ```


    and applies the Function to each value in a stream. (See Tables 12-2 and 12-3.)
    So the map method in Figure 12-9 takes an incoming stream of sale objects and
    creates an outgoing stream of price values.'
