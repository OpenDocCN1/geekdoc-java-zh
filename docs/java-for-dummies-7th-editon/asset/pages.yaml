  md: "# LOOKING FOR FILES IN ALL THE\nRIGHT PLACES\n\nYou try to compile the program\
    \ in Listing 14-1. The Java compiler pokes through the code and stumbles upon\
    \ some missing pieces. First there's this thing called ArtFrame. Then you have\
    \ this Drawing business. Listing 14-1 defines a class named ArtFrame, not Drawing.\
    \ So where does the compiler go for information about the ArtFrame and Drawing\
    \ classes?\n\nIf you do not think about it, the problem could be daunting. Should\
    \ the compiler search all over your hard drive for files named ArtFrame, or Drawing\
    \ class? How large is your new hard drive? The search 500GB? 750GB? 6,000GB? And\
    \ about references to files on network drives? The search space is potentially\
    \ unlimited. What if the compiler eventually resolves all these issues? Then you\
    \ to run your code, and the Java Virtual Machine (JVM) starts all over again.\
    \ (For info on the Java Virtual Machine, see Chapter 2)\n\nTo solve this problem,\
    \ Java defines something called a CLASSPATH. The CLASSP is a list of places where\
    \ the compiler and the JVM look for code. There are several ways to set a CLASSPATH.\
    \ Some programmers create a new CLASSPATH each time they run a Java program. Others\
    \ a system-wide CLASSPATH (If you're familiar with the PATH variable on Windows\
    \ and Unix computers, you may know how this works). One way or another, the compiler\
    \ and the JVM need a list of places to look for code. Without such a list, these\
    \ Java tools don't look anywhere. They don't find classes like ArtFrame or Drawing.\
    \ You get a not find symbol message or a NoClassNotFoundFoundError message, and\
    \ you're very unhappy.\n\n# Making a frame\n\nThis chapter's first three listings\
    \ develop one multipart example. This section has the last of three pieces in\
    \ that example. This last piece isn't crucial for the understanding of access\
    \ modifiers, which is the main topic of this chapter. So, if you want to skip\
    \ the explanation of Listing 14-3, you can do without losing the chapter's thread.\
    \ On the other hand, if you want to know about the Java Swing classes, read on.\n\
    \n# LISTING 14-3: The ArtFrame Class\n\n```\npackage com.burdbrain.frames;\n\n\
    import java.awt.Graphics;\nimport javax.swing.JFrame;\nimport com.burdbrain.drawings.Drawing;\n\
    \npublic class ArtFrame extends JFrame {\n    private static final long serialVersionUID\
    \ = 1L;\n```"
