  md: '# DIGITS BEYOND THE DECIMAL POINT


    Java has two different types that have digits beyond the decimal point: type double
    and float. So what''s the difference? When you declare a variable to be of type
    double, you''re telling the computer to keep track of 64 bits when it stores the
    variable''s values. When you declare a variable to be of type float, the computer
    keeps track of only 32 bits.


    You could change Listing-4-2 and declare amountInAccount to be of type float.


    ```

    float amountInAccount;

    ```


    Surely, 32 bits are enough to store a small number like 50.02, right? Well, and
    they aren''t. You could easily store 50.00 with only 32 bits. Heck, you could
    store 50.00 with 60 bits. The size of the number doesn''t matter. Accuracy matters.
    In a 64-bit double variable, you''re using most of the bits to store beyond the
    decimal point. To store the .22 part of 50.22, you need more than the meas 32
    bits that you use with float.


    Do you really believe what you just read — that it takes more than 32 bits to
    store .22? To convince you, I made a few changes to the code in Listing-4-2. I
    made amountInAccount to be of float. I changed the first three statements inside
    the main method as follows:


    ```

    float amountInAccount;

    amountInAccount = 50.22F;

