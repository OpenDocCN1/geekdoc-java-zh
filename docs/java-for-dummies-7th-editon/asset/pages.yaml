  md: 'com.burdbrain.drawings package. I didn''t pull this package name out of the
    air. The convention (handed down by the people who created Java) says that you
    start a package name by reversing the parts of your domain name, so I reversed
    burdbrain.com. Then you add one or more descriptive name, separated by dots. I
    added the name *drawings* because I intend to put all my drawing goodies in this
    package.


    **Drawing class is public.** A public class is vulnerable to intrusion from the
    outside. In general, I avoid plastering the public keyword in front of any old
    class. In Listing 14-2, I have to declare my Drawing class to be public. If I
    don''t, classes that aren''t in the com.burdbrain.drawings package can''t use
    the goodies in Listing 14-2. In particular, the line


    ```

    ArtFrame artFrame = new ArtFrame(new Drawing());

    ```


    in Listing 14-1 is illegal the Drawing class to public.


    ![](img/41729454897330473a2b5ec1aed6a545_489_0.png)


    REFERENCE For more information on public and nonpublic classes, see the section
    "Access Modifiers for Java Classes," later in this chapter.


    **The code has a paint method.** This paint method uses a standard Java trick
    for making things appear onscreen. The parameter g in Listing 14-2 is called a
    *graphics buffer*. To make things appear, you do draw on this graphics buffer,
    and the buffer is eventually rendered on the computer screen.


    Here''s a little more detail: In Listing 14-2, the paint method takes a g parameter.
    This g parameter refers to an instance of the java.awt.Graphics class. A Graphics
    instance is a buffer, the things that you put onto buffer are eventually displayed
    on the screen. Like all instances of the java.awt.Graphics class, this buffer
    has several drawing methods — and one of them is drawOval. When you call drawOval,
    you are starting a position (x pixels from the left edge of the frame and y pixels
    from the top of the frame). You also specify size by putting numbers of pixels
    in the width and height parameters. Calling the drawOval method puts a little
    round thing into the Graphics buffer. That Graphics buffer, round thing and all,
    is displayed onscreen.'
