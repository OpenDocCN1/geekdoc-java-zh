    batting average.


    You also need the methods findTeamAverage and findTeamAverageString to be static.
    Without the word static, there would be nine findTeamAverage methods — one for
    each instance of the PlayerPlus class. This wouldn''t make sense. Each instance
    would have the code to calculate totalAverage / playerCount on its own, and each
    of the nine calculations would yield the same answer.


    In general, any task that all the instances have in common (and yields the same
    result for each instance) should be coded as a static method.


