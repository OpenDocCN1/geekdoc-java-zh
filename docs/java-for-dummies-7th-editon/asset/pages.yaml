  md: '# Staying within Bounds in an Array


    When you declare an array with ten components, the components have indices 0 through
    9. In other words, if you declare


    ```

    int guests[] = new int[10];

    ```


    then you can refer to the guests array''s components by writing guests[0], guests[1],
    and so on, all the way up to guests[9]. You can''t write guests[10], because the
    guests array has no component with index 10.


    For the latest gossip on arrays, see Chapter 11.'
