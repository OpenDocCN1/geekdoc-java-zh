  md: '# Brace yourself


    The statement in Listing 5-1 has two halves: a top half and a bottom half. I have
    names for these two parts of an statement. I call them the if part (the top half)
    and the else part (the bottom half).


    The if in Listing 5-1 seems to have more than one statement in it. I make this
    happen by enclosing three statements of the if part in a pair of curly braces.
    When I do this, I form a block. A block is a bunch of statements scrunched together
    by a pair of curly braces.


    With this block, three calls to println are tucked safely inside the if part.
    With the curly braces, the rows of asterisks and the words You display only when
    the user''s guess is correct


    This business with blocks and curly braces applies to the else part as well. In
    Listing 5-1, whenever inputNumberdoesn''t equal randomNumber, the computer executes
    three print/println calls. To convince the computer that all three of these calls
    are inside the else clause, I put calls into a block. That is, I enclose these
    three calls in a pair of curly braces.


    ![](img/41729454897330473a2b5ec1aed6a545_156_0.png)


    Strictly speaking, Listing 5-1 has only one statement between the if and the statements
    and one statement after the statement. The trick is that you place a bunch of
    statements inside curly braces, you get a block; and a block behaves, in all respects,
    like a single statement. In, the official Java documentation lists blocks as one
    of the many kinds of statements. So, in Listing 5-1, the block that prints You
    and asterisks is a single statement that has, within, three smaller statements.


