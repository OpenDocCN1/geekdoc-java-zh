  md: '# Saving Time and Money: Reusing Existing Code


    IN THIS CHAPTER


    +   >> Adding new life to old code

    >> Tweaking your code

    >> Making changes without spending a fortune


    Once upon a time, there was a beautiful princess. When the princess turned 25
    (the optimal age for strength, good looks, and fine moral character), her kind,
    old father brought a gift in a lovely golden box. Anxious to know what was in
    the box, the princess ripped off the golden wrapping paper.


    When the box was finally opened, the princess was thrilled. To her surprise, her
    father had given her what she had always wanted: a computer program that always
    ran correct. The program did everything the princess wanted, and did it all exactly
    the she wanted it to be done. The princess was happy, and so was her father.


    As even time marched on, the computer program never failed. For years on, the
    princess changed her needs, expected more out of life, made increasing demands,
    expanded her career, reached for more and more fulfillment, juggled the desires
    of her husband and her kids, stretched the budget, and sought peace within her
    soul. Through all of this, the program remained steady, faithful companion.


    As the princess grew, the program became old along with her. One evening, as she
    sat by the fireside, she posed a daunting question to the program: “How do you
    do it?” she asked. “How do you manage to keep giving the right answers, time after
    time, year after year?”


    “Cleaning,” replied the program. “I swim 20 apps each day, I take C++ to Word
    off viruses, I avoid hogarithmic algorithms, I link Java in moderation, I say
    GNU to bugs, I don’t smoke to back up, and I never bite off more than I can queue.”'
  merge: -1
