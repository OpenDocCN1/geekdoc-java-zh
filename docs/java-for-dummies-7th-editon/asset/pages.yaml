    To use DummiesFrame class, your code must have a method named calculate, and the
    calculate method must obey certain rules:


    +   - The calculate method''s header must start with the words public static.


    +   - The method may return any Java type: String, int, or whatever. (That''s
    actually not a rule; it''s an opportunity!)


    +   - The calculate method must have the same number of parameters as there are
    rows in the application''s window.


