  md: "# # Classes, Access, and Multipart Programs\n\nWith this topic, you can become\
    \ all tangled up in terminology, so you need to get some basics out of the way\
    \ (Most of the terminology that you need from Chapter 10, but it's worth reviewing\
    \ at the start of this chapter.) Here's a fake piece of Java code:\n\n```\nclass\
    \ MyClass {\n    int myField;          // a field (a member)\n\n    void method()\
    \ {       // a method (another member)\n        int myOtherField;    // a method-local\
    \ variable (NOT a member)\n    }\n}\n```\n\nThe comments on the right side of\
    \ the code tell the whole story. Two kinds of variables exist here: fields and\
    \ method-local variables. This chapter isn't about method-local variables. It's\
    \ about methods and fields.\n\nBelieve me, carrying around the phrase methods\
    \ and fields wherever you go isn't easy. It's much better to give these things\
    \ one name and be done with it. That's why both methods and fields are called\
    \ members of a class.\n\n# ## Members versus classes\n\nAt this point, you make\
    \ an important distinction. Think about Java's public keyword. You may already\
    \ know from earlier chapters, that you can put public in front of a member. For\
    \ example, you can write\n\n```\npublic static void main(String args[]) {\n```\n\
    \nor\n\n```\npublic int amountInAccount = 50.22;\n```\n\nThese uses of the public\
    \ keyword come as no big surprise. What you may not know is that you can put the\
    \ public keyword in front of a class. For example, you can write\n\n```\npublic\
    \ class Drawing {\n    // Your code goes here\n}\n```\n\nIn Java, the public keyword\
    \ has two slightly different meanings — one"
  merge: -1
