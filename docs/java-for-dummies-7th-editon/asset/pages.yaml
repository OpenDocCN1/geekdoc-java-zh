  md: '# Putting Capital Letters Where They Belong


    Java is a case-sensitive language, so you really have to mind your p’s and q’s
    — along with every other letter of the alphabet. Here are some details to keep
    in mind as you create Java programs:


    +   » Java’s keywords are all completely lowercase. For instance, in a Java statement,
    the word if can’t be If or IF.


    +   » When you use names from the Java API (Application Programming Interface),
    the case of the names has to match what appears in the API.


    +   » You also need to make sure that the names you make up yourself throughout
    your entire program. If you declare a myAccount variable, you can’t refer to it
    as MyAccount, myaccount, or Myaccount. If you capitalize the variable name two
    different ways, Java thinks you’re referring to two completely different variables.


    For more info on Java’s case-sensitivity, see Chapter 3.'
