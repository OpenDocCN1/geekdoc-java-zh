  md: '# TECHNICAL STUFF


    At this point in the book, the astute For Dummies reader may pose a follow-up
    question or two. “When a main method has a throws clause, someone else has to
    deal with the exception that throws clause. Who called the main method? Who deals
    with the IOException in the throws clause of Listing 10-3?” The answer is that
    the Java Virtual Machine (or JVM, the thing that runs all your Java code) called
    the main method. So the JVM takes care of the IOException. If the program has
    any trouble reading the Hankees.txt file, the responsibility ultimately falls
    on the JVM. The JVM takes care of the situation by displaying an error message
    and then ending the run of your program. How convenient!


