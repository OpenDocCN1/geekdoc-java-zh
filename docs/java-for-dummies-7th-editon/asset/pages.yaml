  md: "# # Understanding the Limitations of Arrays\n\nArrays are nice, but they have\
    \ some serious limitations. Imagine that you store customer names in some predetermined\
    \ order. Your code contains an array, and the array has space for 100 names:\n\
    \n```\nString name[] = new String[100];\nfor (int i = 0; i < 100; i++) {\n   \
    \ name[i] = new String();\n}\n```\n\nAll is well until one life, customer number\
    \ 101 shows up. As your program runs, you enter data for customer 101, hoping\
    \ desperately that the array with 100 components can expand to fit your growing\
    \ needs.\n\nNo such luck. Arrays don’t expand. Your program crashes with an ArrayIndexOutOfBoundsException.\n\
    \nIn my next life, I’ll create arrays of length 1,000,” you say to yourself. And\
    \ when your next life rolls, you just do this:\n\n```\nString name[] = new String[1000];\n\
    for (int i = 0; i < 1000; i++) {\n    name[i] = new String();\n}\n```\n\nBut during\
    \ your next life, an economic recession occurs. Instead of having 101 customers,\
    \ you’re wasting space for 1,000 names, you have space for 3 names you would.\n\
    \nAnd what if no economic recession occurs? You're sailing along with your array\
    \ of size 1,000, using a tidy 825 spaces in the array. The components with indices\
    \ 0 through 824 are used, and the components with indices 825 through 999 are\
    \ waiting quietly to be filled.\n\nOne day, a brand-new customer shows up. Because\
    \ your customers are stored in order (alphabetically by last name, numerically\
    \ by Social Security number, whatever), you want to squeeze this into the correct\
    \ component of your array. The trouble is that this customer belongs very early\
    \ on in the array, at the component with index 7. What happens then?\n\nYou take\
    \ the name in component number 824 and move it to component 825."
