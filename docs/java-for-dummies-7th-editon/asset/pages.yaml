  md: 'out what the code does by viewing the automatically generated web page.


    >> Because other people don''t look at the Java code, other people don''t make
    changes to the Java code. (In other words, other people don''t introduce errors
    into the existing Java code.)


    >> Because other people don''t look at the Java code, other people don''t decipher
    the inner workings of the Java code. All these people need to know about the code
    is what they read on the code''s web page.


    >> The programmer doesn''t create two files — some Java code over here and some
    documentation about the code over. Instead, the programmer creates one piece of
    Java code and embeds the documentation (in the form of javadoc comments) right
    inside the code.


    >> Best of all, the generation of web pages from javadoc comments is automatic.
    So everyone''s documentation has the same format. No matter whose Java code you
    use, you find out that by reading a page like the one in Figure 3-8. That''s good
    because the format in Figure 3-8 is familiar to anyone who uses Java.


    ![](img/41729454897330473a2b5ec1aed6a545_92_0.png)


    You can generate your own web pages from the javadoc comments that you put in
    your code. To discover how, visit this book''s website (www.allmycode.com/JavaForDummies).


    # What’s Barry’s excuse?


    For years I''ve been teaching my students to put comments in their code, and for
    years I''ve been creating sample code (like the code in Listing 3-1) with no comments
    in it. Why?


    Three little words: Know your audience. When you write complicated, real-life
    code, your audience is other programmers, information technology managers, and
    people who need help deciphering what you''ve done. When I write simple samples
    of code for this book, my audience is you — the novice Java programmer. Instead
    of reading comments, your best strategy is to stare at my Java statements — the
    statements that Java''s compiler deciphers. That''s why I put few comments in
    this book''s listings.


    Besides, I''m a little lazy.'
