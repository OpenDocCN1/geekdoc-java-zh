  md: 'to be static? Well, remember non-static things belong to objects, not classes.
    If the main method isn''t static, you can''t have a main method until you create
    an object. But, when you start up a Java program, no objects have been created
    yet. The statements that are executed in the main method start creating objects.
    So, if the main method isn''t static, you have a big chicken-and-egg problem.


    # Could cause static; handle with care


    When I first started Java programs, I had recurring dreams about getting a certain
    error message. The message was non-static variable or method cannot be referenced
    from a static context. So often did I see this message, so thoroughly was I perplexed,
    the memory of this message became into my subconscious existence.


    These days, I know why I got that error message so often. I can even make the
    message occur if I want. But I still feel a little shiver whenever I see this
    message on my screen.


    Before you can understand why the message occurs and how to fix the problem, you
    need to get some terminology under your belt. If a field or method isn''t static,
    it''s called non-static. (Real surprising, hey?) Given that terminology, there
    are at least two ways to make the dreaded message appear:


    +   ** Put Class.nonstaticThing somewhere in your program.

    ** Put nonstaticThing inside a static method.


    In either case, you''re getting yourself into trouble. You''re taking something
    that belongs to an object (the non-static thing) and putting it in a place where
    no objects are in sight.


