    Another way to describe that mars field is to call it an instance variable because
    mars variable (the variable whose value is "red planet") belongs to an instance
    of the EnglishSpeakingWorld class. In contrast, you can refer to static fields
    (like the playerCount, totalOfAverages, and decFormat fields in Listing 10-4)
    as class variables. For example, playerCount in Listing 10-4 is a class variable
    because one copy of playerCount belongs to the entire PlayerPlus class.


    Now look at the main method in Listing 10-7. Inside the GettingClass''s main method,
    you are not permitted to write out.println(mars). In other words, a bare-free
    reference to any variable is a definite no-no. The mars variable that I mention
    in the preceding paragraph belongs to the EnglishSpeakingWorld object, not the
    Getting class.


    However, inside the GettingClass''s main method, you can certainly see e.mars
    because the e variable refer to your EnglishSpeakingWorld object. That''s nice.


    Near the bottom of the code, the visitPennsylvania method is called. When you
    are inside visitPennsylvania, you have another declaration of a mars variable,
    whose value is "Janine''s home town". This particular mars variable is called
    a method-local variable because it belongs to one method: the visitPennsylvania
    method.


    Now you have two variables, both with the name mars. One variable, a, has the
    value "red planet". The other mars variable, a method-local variable, has the
    value "Janine''s home town". In the code, when you use the word mars, to which
    of the two variables are you referring?


    The answer is, when you''re visiting Pennsylvania, the variable with value "Janine''s
    home town" wins. In Pennsylvania, think the way the Pennsylvians think. When you''re
    executing code inside the visitPennsylvania method, resolve any variable name
    conflicts by going with method-local variables — variables declared right inside
    the visitPennsylvania method.'
