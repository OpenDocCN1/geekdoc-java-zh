  md: "# Protected Access\n\nWhen I was first getting to know Java, I thought the\
    \ word protected meant nice and secure or something like that. \"Wow, field is\
    \ protected. It must be hard to get at.\" Well, this notion turned out to be wrong.\
    \ In Java, a member that's protected is less hidden, less secure, and available\
    \ for use in more classes than one has default access. In other words, protected\
    \ access is more permissive than default access. For me, the terminology is misleading.\
    \ But that's the way it is.\n\n# Subclasses that aren't in the same package\n\n\
    Think of access this way. You start with a field that has default access (a field\
    \ without the word public, private, or protected in its declaration). Field can\
    \ be accessed only inside the package in which it lives. Now add the word protected\
    \ to the front of the field's declaration. Suddenly, classes outside that field's\
    \ package have some access to the field. You can now reference the field from\
    \ a subclass (of the class in which the field is declared). You can also reference\
    \ the field from a sub-subclass, a sub-subclass, and so on. Any descendant will\
    \ do. For an example, see [Listings 14-8] and [14-9].\n\nLISTING 14-8: Protected\
    \ Fields\n\n```\npackage com.burdbrain.drawings;\n\nimport java.awt.Graphics;\n\
    \npublic class Drawing {\n    protected int x = 40, width = 40, height = 40;\n\
    \n    public void paint(Graphics g) {\n        g.drawOval(x, y, width, height);\n\
    \    }\n}\n```\n\nLISTING 14-9: The Subclass from the Blue Lagoon, Part II\n\n\
    ```\nimport java.awt.Graphics;\nimport com.burdbrain.drawings.Drawing;\n```"
