    # Displaying text


    The last three statements in Listing 4-2 use a neat formatting trick. You want
    to display several different items on a single line on the screen. You put these
    items in separate statements. All but the last of the statements are calls to
    System.out.print. (The last statement is a call to System.out.println.) Calls
    to System.out.print display text on part of a line and then leaves the cursor
    at the end of the line. After executing System.out.print, the cursor is still
    at the end of the same line, so the next System.out.whatever can continue printing
    on that same line. With several to called off by a single call to println, the
    result is just one nice-looking line of output. (Refer to Figure 4-5.)


    > A call to System.out.print writes some things and leaves the cursor sitting
    at the end of the line of output. A call to System.out.println things and then
    finishes the job by moving the cursor to the start of a brand-new line of output.'
