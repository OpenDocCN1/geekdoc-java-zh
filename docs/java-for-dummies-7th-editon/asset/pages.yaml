  md: "# Retrieving Data\n\nWhat good is a database if you can't get data from it?\
    \ In this section, you query the database that you created in the previous sections.\
    \ The code to issue the query is shown in Listing 17-3.\n\n# LISTING 17-3: Making\
    \ a Query\n\n```\nimport static java.lang.System.out;\n\nimport java.sql.Connection;\n\
    import java.sql.DriverManager;\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\n\
    import java.sql.Statement;\nimport java.text.NumberFormat;\n\npublic class void\
    \ main(String[] args) {\n    NumberFormat currency = NumberFormat.getCurrencyInstance();\n\
    \    final String CONNECTION = \"jdbc:derby:AccountDatabase\";\n\n    try (Connection\
    \ conn = DriverManager.getConnection(CONNECTION);\n        Statement statement\
    \ = conn.createStatement();\n        ResultSet resultset = statement.executeQuery(\"\
    select * from ACCOUNTS\");\n        while (resultset.next()) {\n            out.print(resultset.getString(\"\
    NAME\"));\n            out.print(\", \");\n            out.print(resultset.getString(\"\
    ADDRESS\"));\n            out.print(\", \");\n            out.println(currency.format(resultset.getFloat(\"\
    BALANCE\")));\n        }\n    } catch (SQLException e) {\n        e.printStackTrace();\n\
    \    }\n}\n```\n\n> REMEMBER To use a database other than Apache Derby, change\
    \ the value of CONNECTION in each of this chapter's examples.\n\nA run of the\
    \ code from Listing 17-3 is shown in Figure 17-1. The code queries the database\
    \ and steps through the rows of the database, printing the data from each of the\
    \ rows."
