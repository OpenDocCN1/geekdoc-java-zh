  md: "# WHOSE DATABASE IS IT ANYWAY?\n\nDatabases come in many shapes and sizes from\
    \ many different vendors. In 2017, the top database vendors include Oracle, Microsoft,\
    \ IBM, and SAP. Some popular open-source databases include PostgreSQL and Oracle's\
    \ MySQL. The code in Listing 17-1 (and this chapter's other listings) uses an\
    \ open-source database from The Apache Software Foundation known as Apache Derby.\n\
    \nIf you don't want to use Apache Derby, you have to replace the CONNECTION string\
    \ in this chapter's examples. What other string you depends on the kind of database\
    \ software you have, and other factors. Check your database vendor's documentation.\n\
    \nBy the way, database drivers are like people: some are quite old and others\
    \ aren't so. As of January 2017, the latest version of JDBC is 4.2. A \"quite\
    \ old\" JDBC driver is one that was created for a version of JDBC before Version\
    \ 4.0 (circa December 2006). If your database driver doesn't meet the JDBC 4.0\
    \ standards, you have to add a few extra strings to each of this chapter's examples,\
    \ as follows:\n\n```\nfinal String DRIVER =\n    \"com.database.vendorname.databasemotherstuff\"\
    ;\ntry {\n    Class.forName(DRIVER), newInstance();\n} catch (InstantiationException\
    \ |\n    IllegalAccessException |\n    ClassNotFoundException e) {\n    e.printStackTrace();\n\
    }\n```\n\nAgain, check your database vendor's documentation.\n\n# Using SQL commands\n\
    \nIn Listing 17-1, the heart of the code lies in the call to executeUpdate. The\
    \ executeUpdate call contains a string — a normal, Java, double-quoted string\
    \ of characters. To keep the code readable, I've chopped the string into four\
    \ parts, and separate the string with plus signs (Java's concatenation operator).\n\
    \nIf you're familiar with Structured Query Language, or SQL, the command strings\
    \ in the calls to executeUpdate make sense. If you not, pick up a copy of SQL\
    \ For Dummies, 8th Edition, by Allen G. Taylor (Wiley). One way or another, don't\
    \ go fishing around this chapter for an explanation of the create table command.\
    \ You won't find an explanation, because the create table string in Listing 17-1\
    \ isn't part of Java. This command is just a string of characters that you feed\
    \ to Java's executeUpdate method. This string, which is written in SQL, creates\
    \ a new database table with three columns (columns for"
  merge: -1
  pgno: 559
- img_proc: true
  md: "a customer's NAME, the customer's ADDRESS, and the account's BALANCE). When\
    \ you write a Java database program, that's what you do.\nYou write ordinary SQL\
    \ commands and surround those commands with calls to Java methods.\n\n# Connecting\
    \ and disconnecting\n\nAside from the call to executeUpdate method, the code in\
    \ Listing 17-1 is copy-and-paste stuff. Here's a rundown on what each part of\
    \ the code does:\n\n+   DriverManager.getConnection: Establish a session with\
    \ a particular database.\n\nThe getConnection method lives in a Java class named\
    \ DriverManager. In Listing 17-1, the call to getConnection creates an AccountDatabase\
    \ and opens a connection to that database. Of course, you may already have an\
    \ AccountDatabase before you start running the code in Listing 17-1. If you do,\
    \ the :create=true in the CONNECTION string has no effect.\n\nIn the CONNECTION\
    \ string, notice the colons. The code doesn't simply name the AccountDatabase\
    \ — it tells the DriverManager class which protocols to use to connect with the\
    \ database. The code jdbc:derby — which is a list like the http: in a web address\
    \ — tells the computer to use the jdbc protocol to talk to the derby protocol,\
    \ which in turn talks directly to your AccountDatabase.\n\n+   conn.createStatement:\
    \ Make a statement.\n\nIt seems strange, but in Java Database Connectivity, you\
    \ create a single statement object. After you've created a statement object, you\
    \ can use that object many times, with many different SQL strings, to issue different\
    \ commands to the database. So, before you start calling the statement.executeUpdate\
    \ method, you have to create an actual statement object. The call to conn.createStatement\
    \ creates that statement object for you.\n\n+   try-with-resources: Release resources,\
    \ come what may! \n\nAs Ritter always says, you're not being considerate of others\
    \ if you don't clean up your own messes. Every connection and every database statement\
    \ lock up some resources. When you're finished using these resources, you release\
    \ them."
  merge: -1
  pgno: 560
- img_proc: true
  md: 'In Listing 17-1, Java''s try-with-resources block automatically closes and
    releases your resources at the end of the block''s execution. In addition, try-with-resources
    takes care of all the messy details associated with failed attempts to catch exceptions
    gracefully.


    ![](img/41729454897330473a2b5ec1aed6a545_561_0.png)


    CROSS For the scoop about try-with-resources, see Chapter 13.'
