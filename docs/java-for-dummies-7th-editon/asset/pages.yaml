  md: '# Relax! You’re Not Seeing Double!


    If you''ve read this chapter''s earlier sections on interfaces and abstract methods,
    your head might be spinning. Both interfaces and abstract classes have abstract
    methods. The abstract methods play slightly different roles in these two kinds
    of reference types. How can you keep it all straight in your mind?


    The first thing to do for concepts is to remember that no one learns about object-oriented
    programming without getting lots of practice in writing code. If you''ve read
    this chapter and you''re confused, that may be a good thing. It means you''ve
    understood enough to know how complicated this stuff is. The more code you write,
    the more comfortable you''ll become with classes, and all these other ideas.


    The next thing to do is to sort out the differences in the way you declare abstract
    methods. Table 15-1 has the story.


    # TABLE 15-1: Using (or Not Using) Abstract Methods


    | Abstract methods allowed? | In an Ordinary (Non-Abstract) Class | In an Interface
    | In an Abstract Class |

    |---|---|---|--|

    | No | No | Yes | Yes |

    | Can a method declaration contain the abstract keyword? | No | Yes | Yes |

    | Can a method declaration contain the default keyword ("not abstract")? | No
    | Yes | No |

    | With neither abstract nor the default keyword, a method is: | Not abstract |
    Abstract | Not abstract |


    Both interfaces and abstract classes have abstract methods. So you may be wondering
    how you should choose between declaring an interface and declaring an abstract
    class. In fact, you might ask three professional programmers how interfaces and
    abstract classes differ from one another. If you do, you may get five different
    answers. (Yes, five answers; not three answers.)


    Interfaces and abstract classes are similar beasts, and the new features in Java
    8 made them even more similar than in previous Java versions. But the basic idea
    is about relationships among things.'
  merge: -1
