  md: '# ALL ABOUT GENRICS


    One of the original design goals for Java was to keep the language as simple as
    possible. James Gosling, the language''s creator, took some unnecessarily complicated
    features of C++ and tossed them out the window. The result was a language that
    was elegant and sleek. Some people said the language was too sleek. So, after
    several years of discussion and squabbling, Java became a bit more complicated.
    By the year 2004, Java had new types, enhanced for loops, static import, and some
    other interesting features. In particular, the most-talked about new feature was
    the introduction of generics:


    ```

    ArrayList<String> people = new ArrayList<String>();

    ```


    The use of using <String> was new in Java 5.0. In old-style Java, you''d write


    ```

    ArrayList people = new ArrayList();

    ```


    In those days, an ArrayList could store almost anything you wanted to put in it:
    a number, an Account, a Room, a Frame — The ArrayList class was versatile, but
    with this versatility you could get some headaches. If you could put anything
    into an ArrayList, you couldn''t predict what you would get out of an ArrayList.
    In particular, you couldn''t easily write code that assumed you had certain types
    of values in the ArrayList. Here''s an example:


    ```

    ArrayList things = new ArrayList();

    things.add(new Account());

    myAccount = things.get(0);

    //DON''T USE THIS. IT''S BAD CODE.

    ```


    In the third line, the call to get(0) grabs the earliest value in the things collection.
    The call to get(0) is okay, but the compiler checks on the attempted assignment
    to myAccount. You get a message that the third line saying whatever you get from
    the things list can''t be stuffed into myAccount variable. You get this message
    by the time the compiler reaches the third line, it has forgotten that item added
    on the second line was of type Account!


    The introduction of generics fixes this:


    ```

    ArrayList<Account> things = new ArrayList<Account>();


    things.add(new Account());

    myAccount = things.get(0);

    //USE THIS IN. IT''S GOOD CODE.

    ```


    Adding <Account> in two places tells the compiler that things Account instances
    — nothing else. So, in the third line in the preceding code, you get a value from
    the generics collection. Then, because things only stores Objects, you can make
    myAccount reference to new java.


    Java 5.0 added generics to Java. But soon after the birth of Java 5.0, programmers
    noticed how clumsy the code for generics could be. After all, you can create generics
    with generics. An ArrayList can contain a bunch of accounts, each of which can
    be an ArrayList. So you see


    ```

    ArrayList<ArrayList<String>>[] mess = new ArrayList<ArrayList<String>>();

    ```


    All the repetition in that mess declaration gives me a headache operator: To avoid
    this ugliness, Java 7 and later versions have the diamond operator <>. The diamond
    operator helps you reuse whatever insanely complicated stuff you put you in the
    previous part of the generic declaration. In this example, the <> tells Java to
    reuse <ArrayList<String>[], even though you write ArrayList<String>[][] only once.
    Here''s'
