    button, and then navigate to the derby.jar file on your computer''s hard drive.


    +   ** IntelliJ IDEA: Select File ⇒ Project Structure. In the resulting dialog
    box, select Libraries. Click the plus (+) icon and, in the resulting drop-down
    box, select Java. Navigate to the derby.jar file on your computer''s hard drive.


    +   ** NetBeans: Select File ⇒ Project Properties. In the resulting dialog box,
    select Libraries and then select the Run tab. Click the Add JAR/Folder button,
    and navigate to the derby.jar file on your computer''s hard drive.


    # # What happens when you run the code


    During a successful run of the code in Listing 17-1, you see an ACCOUNTS table
    created message. That''s it. The code has no other visible output because most
    of the output goes to a database.


    If you poke around a bit, you can find direct evidence of the new database''s
    existence. Using your computer''s File Explorer or Finder, you can navigate to
    the project folder containing the code in Listing 17-1. (If you''ve downloaded
    the code from this book''s website, look in your IDE''s 17-01 project folder.)
    Inside that folder, you''ll see a brand-new AccountDatabase subfolder. That''s
    where the newly created database lives.


    Unfortunately, you can''t see what''s inside the database unless you run a couple
    more programs. Read on!


