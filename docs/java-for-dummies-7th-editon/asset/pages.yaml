  md: "# What You Can Do with Java\n\nIt would be so nice if all this complexity were\
    \ free, but unfortunately, it isn’t. Someone has to think hard and decide exactly\
    \ what to ask the computer to do. After that thinking takes place, someone has\
    \ to write a set of instructions for the computer to follow.\n\nGiven the current\
    \ state of affairs, you can’t write these instructions in English or any other\
    \ language that people speak. Science fiction is filled with stories about people\
    \ who say things to robots and get back disastrous, unexpected results. English\
    \ and other such languages are unsuitable for communication with computers, for\
    \ several reasons:\n\n+   >> An English sentence can be misinterpreted. “Chew\
    \ one tablet times a day until finished.”\n\n+   >> It’s difficult to weave a\
    \ very complicated command in English. “Join flange A to protuberance B, making\
    \ sure to connect only the outermost lip of flange A to the larger end of the\
    \ protuberance B, while joining the middle and inner lips of flange A to grommet\
    \ C.”\n\n+   >> An English sentence has lots of extra baggage. “Sentence has unneeded\
    \ words.\n\n+   >> English is difficult to interpret. “As part of this Publishing\
    \ Agreement between John Wiley & Sons, Inc. (‘Wiley’) and the Author (‘Barry Burd’),\
    \ Wiley shall pay the sum of one-thousand-two-hundred-fifty-seven dollars and\
    \ sixty-three cents ($1,257.63) to the Author for partial submittal of Java For\
    \ Dummies, 7th Edition (‘the Work’).\n\nTo tell a computer what to do, you have\
    \ to use a special language to write terse, unambiguous instructions. A special\
    \ language of this kind is called a programming language. A set of instructions\
