  md: '# PRIMITIVE TYPE STEW


    While I''m on the subject of frames, what''s a frame, anyway? A frame is a window
    that has a certain width and a certain location on your computer''s screen. Therefore,
    deep inside of the Frame class, you can find variable declarations that look something
    like this:


    ```

    int width;

    int height;

    int x;

    int y;

    ```


    Here''s another example — Time. An instance of the Time class may have an hour
    (a number from 1 to 12), a number of minutes (from 0 to 59), and a letter (a for
    a.m.; p for p.m.).


    ```

    int hour;

    int minutes;

    char amOrPm;

    ```


    Notice that this high-ighty thing called a Java API class is neither high nor
    mighty. A class is just a collection of declarations. Some of those declarations
    are the declarations of variables. Some of these variable declarations use primitive
    types, and other variable declarations use reference types. These reference types,
    however, come from other classes, and the declarations of those classes have variables.
    The chain goes on and on. Ultimately, everything comes, in one way or another,
    from the primitive types.'
