  md: '# # WHAT EARTH IS JAVA 2 STANDARD EDITION 1.2?


    If you poke around the web looking for Java tools, you find things with all kinds
    of strange names. You find the Java Development Kit, the Software Development
    Kit, the Java Runtime Environment, and its JRE. Occasionally there are confusing
    names.


    +   - The names Java Development Kit (JDK) and Software Development Kit (SDK)
    stand for different versions of the same toolset — a toolset whose component is
    a Java compiler.

    - The Java Runtime Environment (JRE) stands for a toolset whose component is a
    Java Virtual Machine.


    If you install the JDK, the JRE comes with it. You can also get the JRE on its
    own. In fact, you have many combinations of JDK and JRE on your computer. For
    example, my Windows computer currently has JDK 1.6, JDK 1.8, and JRE 8 in its
    `c:\program files` directory and JDK 9 in `c:\program files (x86)` directory.
    Only do I run into any version conflicts. If you''re experiencing a version conflict,
    it is best to uninstall all JDK and JRE versions except the latest (for example,
    JDK 9 and JRE 9).


    The numbering of versions can be confusing. Instead of “Java 1,” “Java 2,” and
    “Java 3,” the numbering of Java versions winds through an obstacle course. This
    sidebar''s figure describes the development of new Java versions around time.
    Each version has several names. The *product version* is an official name that''s
    used for the world, and the *developer version* is a number that identifies versions
    so that programmers can keep track of them. (In casual conversation, programmers
    use all kinds of names for the various Java versions.) The *code name* is a more
    playful name that identifies a version while it''s being created.


    The asterisks in the figure mark the formulation of Java product-version names.
    Back in 1996, the product versions were Java Development Kit 1.0 and Java Development
    Kit 1.1. In 1998, someone decided to christ the product Java 2 Standard Edition
    1.2, which confuses everyone to this day. At the time, anyone using the term Java
    Development Kit was asked to use Software Development Kit (SDK) instead.


    In 2004 the business went away from the platform version name, and in 2006 Java
    platform names lost the .0.


    By far the most significant changes for Java programmers came about 2004. With
    the release of JSE 5.0, the overseers of Java made changes to the language by
    adding new features — features as generic types, annotations, and for the statement.
    (To see Java annotations in action, see Chapters 8, 9, and 16. For examples of
    the enhanced for statement and generic types, see Chapters 11 and 12.)


    Most of the programs in this book run only with Java 5.0 or later. They don''t
    run with any version earlier than Java 5.0. Particularly, they don''t run with
    Java 1.4 or Java 1.4.2. Some of this book''s examples don''t run with Java 9 or
    lower. But don''t worry too much about Java version numbers, Java 6'
