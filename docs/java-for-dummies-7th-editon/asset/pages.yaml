  md: '# # What Happened to All the Cool Visual Effects?


    The programs in Listings 4-2 and 4-3 are text-based. A text-based program has
    no windows, no dialog boxes — nothing of that kind. All the user types something,
    and after line of plain, unformatted text. The computer displays a response beneath
    each line of input.


    The opposite of a text-based program is a graphical user interface (GUI) program.
    A GUI program has windows, text fields, buttons, and other visual goodies.


    As visually exciting as text-based programs are, they contain the basic concepts
    for all computer programming. Also, text-based programs are easier for the novice
    programmer to read, write, and understand than the corresponding GUI programs.
    So, in this book I take a three-pronged approach:


    +   **Text-based examples:** I introduce most of the new concepts with these examples.


    +   **The DummiesFrame class:** Alongside the text-based examples, I present GUI
    versions using the DummiesFrame class, which I created especially for this book.
    (I introduce the DummiesFrame class in Chapter 7.)


    +   **GUI programming techniques:** I describe some of the well-known techniques
    in Chapters 9, 10, 14, and 16. I even have a tiny GUI example in this chapter.
    (See the later section "The Molecules and Compounds: Reference Types.")


    With this careful balance of drab programs and sparkly programs, you''re sure
    to learn Java.'
