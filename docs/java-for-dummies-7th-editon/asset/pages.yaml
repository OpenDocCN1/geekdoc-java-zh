  md: "# WHERE ON EARTH DO YOU LIVE?\n\nGrouping separators vary from one country\
    \ to another. This makes a big difference when you try to read double values using\
    \ Java's Scanner class. To see what I mean, I have a serious look at the following\
    \ Jshell session.\n\n```\njshell import java.util.Scanner\n\njshell import java.util.Locale\n\
    \njshell Scanner keyboard = new Scanner(System.in)\nkeyboard == java.Scanner[delimiters=\\\
    p(javawhitespace)] ... \\E\n[infinity string=\\E]\n\njshell keyboard.nextDouble()\n\
    1000.00\n$4 == 1000.0\n\njshell Locale.setDefault(Locale.FRANCE)\n\njshell keyboard\
    \ = new Scanner(System.in)\nkeyboard == java.Scanner[delimiters=\\p(javawhitespace)]\
    \ ... \\E\n[infinity string=\\E]\n\njshell keyboard.nextDouble()\n1000.00\n$7\
    \ == 1000.0\n\njshell keyboard.nextDouble()\n1000.00\n| java.util.InputMismatchException\
    \ thrown:\n  at Scanner.throwFor(Scanner.java:860)\n  at Scanner.next(Scanner.java:1497)\n\
    \  at Scanner.nextDouble(Scanner.java:2467)\n  at ($8:1)\n```\n\nI conducted this\
    \ session on a computer in the United States. The country of origin is relevant\
    \ because, in response to the first keyboard.nextDouble(), I type 1000.00 (with\
    \ a period before the last two zeros) and Java accepts this as meaning \"one thousand.\"\
    \n\nBut, in the Jshell session, I call Locale.setDefault(Locale.FRANCE), which\
    \ tells Java to behave as if my computer is in France. When I create another instance\
    \ and call keyboard.nextDouble() again, Java accepts 1000,00 (with a comma before\
    \ the last two zeros) as an expression mille (French for \"one thousand.\"). What's\
    \ more, Java no longer accepts the period in 1000.0. When I type 1000.00 (with\
    \ a period) I get an InputMismatchException.\n\nBy your default, the Scanner instance\
    \ wants to double input numbers the type you normally type in your country. If\
    \ you type numbers according to another country's convention, you get an InputMismatchException.\
    \ So, when you run the code in Listing 8-2, the numbers in your EmployeeInfo.txt\
    \ file must use your country's format.\n\nThis brings me to the running of the\
    \ code in Listing 8-2. The EmployeeInfo.txt file that you download"
