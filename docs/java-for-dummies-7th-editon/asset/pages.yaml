    \ (price1, price2) -> price1 + price2);\n```\n\nIn Listing 12-5, the stream method\
    \ creates a serial stream. With a serial stream, JavaStream creates a slightly\
    \ different kind of stream: a parallel stream. With a parallel stream, Java divides\
    \ the work among the number of cores in the computer's processor (or according\
    \ to some other useful measure of computing power). If you have 4 million sales\
    \ and four cores, each core processes 1 million of the sales.\n\nEach core works\
