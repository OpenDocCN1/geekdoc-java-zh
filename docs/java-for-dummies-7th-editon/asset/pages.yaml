    29 onscreen.


    > REMEMBER With out.println(++numberOfBunnies), the computer adds 1 to numberOfBunnies
    before printing the new value of numberOfBunnies onscreen.


    An alternative to preincrement is postincrement. (The post stands for after.)
    The word after has two different meanings:


    +   * You put ++ after the variable.

    * The computer adds 1 to the variable''s value after the variable is used in any
    other part of the statement.


    To see more clearly how postincrement works, look at the bold line in Figure 4-15.
    The computer prints the old value of numberOfBunnies (which is 28) on the screen,
    and then the computer adds 1 to numberOfBunnies, which raises the value of numberOfBunnies
