  md: '# # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect ... well, buy the book anyway:


    +   - **I assume that you have access to a computer.** Here’s the good news: You
    can run most of the code in this book on almost any computer. The only computers
    that you can''t use to run this code are ancient things that are more than ten
    years old (give or take a few years).


    +   - **I assume you can navigate through your computer’s common menus and dialog
    boxes.** You don''t have to be a Windows, Linux, or Macintosh power user, but
    you should be able to start a program, find a file, put it into a certain directory
    ... Most of the time, when you practice the stuff in this book, you''re typing
    code on the keyboard, not pointing and clicking the mouse.


    On those rare occasions when you need to drag and drop, cut and paste, or plug
    and play, I guide you carefully through the steps. Your computer may be configured
    in several billion ways, and my instructions may not fit your special situation.
    When you reach one of these platform-specific tasks, try following the steps in
    this book. If the steps don''t quit fit, consult a book with instructions tailored
    to your system.


    +   - **I assume you can think logically.** That''s all there is to programming
    in Java — thinking logically. If you can think logically, you''ve got it made.
    If you don''t believe you can think logically, read on. You may be pleasantly
    surprised.


    +   - **I make few assumptions about your programming experience (or your lack
    of such experience).** In writing this book, I''ve tried to do the impossible:
    I''ve tried to make the book interesting for experienced programmers yet accessible
    to people with little or no programming experience. This means I don''t assume
    any particular programming background on your part. If you''ve never created a
    loop or indexed array, that''s okay.


    On the other hand, if you''ve done these things (maybe in Visual Basic, Python,
    or C++), you''ll discover some interesting twists in Java.'
  merge: -1
  pgno: 13
