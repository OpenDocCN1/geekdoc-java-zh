    # Tossing an exception from method to method


    Chapter 8 introduces input from a disk file, and along with that topic comes the
    notion of an exception. When you tinker with a disk file, you need to acknowledge
    the possibility of raising an IOException. The lesson''s from Chapter 8, and that''s
    the constructor in Listing 10-2 has a throws IOException clause.


    But what about main method in Listing 10-3? With no apparent reference to disk
    files in this main method, why does the method know its own IOException clause?
    Well, an exception is hot potato. If you have one, you either to eat it (as you
    can see in Chapter 13) or use a throws clause to toss it to someone else. If you
    toss an exception with a throws clause, someone else is stuck with the exception
    just the way you were.


    The constructor in Listing 10-2 throws IOException, but to whom is this exception?
    Who in this chain of code becomes the bearer of responsibility for the problematic
    IOException? Well, called the constructor in Listing 10-2? It was the main method
    in Listing 10-3 — that who called the TeamFrame constructor. Because the TeamFrame
    constructor throws its hot potato to the main method in Listing 10-3, the main
    method has to deal with it. As shown in Listing 10-3, the main method deals with
    it by tossing the IOException again (having a throws clause of its own). That''s
    how the throws clause works in Java programs.


    > REMOVE If a method calls another method and the called method has a throws clause,
    the calling method must contain code that deals with the exception. To find out
    more dealing with exceptions, read Chapter 13.'
