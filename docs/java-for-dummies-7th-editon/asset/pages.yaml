    \ \" +\n                \"('Joe Dow', '111 Luddite Street', 55.63')\");\n\n  \
    \          System.out.println(\"Rows added.\");\n        } catch (SQLException\
    \ e) {\n            e.printStackTrace();\n        }\n}\n}\n```\n\nListing 17-2\
    \ uses the same strategy as the code in Listing 17-1: Create Java strings using\
    \ SQL commands, and make those strings as arguments to Java's executeUpdate method.\
