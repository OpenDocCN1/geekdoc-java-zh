    impossible for the receiving computer''s existing code to handle your newly created
    objects.


    ![](img/41729454897330473a2b5ec1aed6a545_543_0.png)


    For more details about the serialVersionUID and what constitutes an incompatible
    code change, check out this site:


    ```

    http://docs.oracle.com/java/8/docs/platform/serialization/spec/version.html

    ```


