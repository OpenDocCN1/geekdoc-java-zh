    That’s how the next section comes to rescue. It covers some of these ideas.


    ![](img/41729454897330473a2b5ec1aed6a545_270_0.png)


    This paragraph is actually a confession. In almost every computer programming
    language, input from a disk file is a nasty business. There’s no such thing as
    a INPUT command. You normally have to set up a connection between the code and
    the disk device, prepare for possible trouble reading from the device, do your
    reading, converting the characters you read into the type of value that you want
    and, finally, break your connection with the disk device. It’s a big mess. That’s
    why, in this book, I rely on Java’s Scanner class. The Scanner makes input relatively
    painless. But, I admit, professional Java programmers hardly ever use the Scanner
    to do input. Instead, they use something called BufferedReader or classes in the
    java.io package. If you’re not content with my use of Scanner and want to see
    Listing 8-2 translated into a BufferedReader program, visit this book’s (www.allmycode.com/JavaForDummies).


