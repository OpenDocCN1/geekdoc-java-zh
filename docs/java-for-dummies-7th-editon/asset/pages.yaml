  md: 'functional programming features in Java.


    # Streams


    The earlier section "Using an iterator" introduces iterators. You use an iterator''s
    next method to spit out a collection''s values. Java takes this concept one step
    further with the notion of a stream. A stream is like an iterator except that,
    with a stream, you don''t have to call a next method. After being created, a stream
    spits out a collection''s values automatically. To get values from a stream, you
    don''t call a stream''s next method. In fact, a typical stream has no next method.


    How does this work as part of a Java program? How do you create a stream that
    spits out values? How does the stream know when to start spitting, and where does
    the stream aim when it spits? For answers to these and other questions, read the
    next several sections.


    # Lambda expressions


    In the 1930s, mathematician Alonzo Church used the Greek letter lambda (λ) to
    represent a certain mathematical construct that''s created on the fly.- Over the
    next several decades, the idea survived quietly in mathematics and computer science
    journals. These days, in Java, the term lambda expression represents a short piece
    of code that serves as both a method declaration and a method call, all created
    on the fly.


    # Your first lambda expression


    Here''s an example of a lambda expression:


    ```

    (sale) -> sale.getItem().equals("DVD")

    ```


    Figure 12-7 describes the lambda expression''s meaning.'
