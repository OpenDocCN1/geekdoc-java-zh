    # Yet another way to beautify your numbers


    You can make numbers look nice in plenty of ways. If you take a peek at some earlier
    chapters, for example, you can see that Listing 7-7 uses printf, and Listing 10-1
    uses a DecimalFormat. But in Listing 11-5, I display a currency amount. I use
    the NumberFormat class with its getCurrencyInstance


    If you compare the formatting statements in Listings 10-1 and 11-5, you don’t
    see much difference.


    **One listing uses a constructor; the other listing calls**

    getCurrencyInstance. The getCurrencyInstance method is a good example of what’s
    called a factory method. A factory method is a convenient tool for creating commonly
    used objects. People always need code that displays currency amounts. So the getCurrencyInstance
    creates a currency format without forcing you to write a complicated DecimalFormat
    constructor call. In the United States, this constructor would be new DecimalFormat("######.00;($###.00)").


    Like a constructor, a factory method returns a new-object. Unlike a constructor,
    a factory method has no special status. If you create your own factory method,
    you can name it anything you want. When you call a factory method, you don’t use
    the keyword new.


    **One listing uses DecimalFormat; the other listing uses NumberFormat.**

    A decimal number is a certain kind of number. (In fact, a decimal number is a
    number written in the base-10 system.) Accordingly, the DecimalFormat class is
    a subclass of the NumberFormat class. The DecimalFormat methods are more specific,
    so for most purposes, I use DecimalFormat. But it’s harder to use the DecimalFormat
    class’s getCurrencyInstance method. For programs that involve money, I tend to
    use NumberFormat.'
