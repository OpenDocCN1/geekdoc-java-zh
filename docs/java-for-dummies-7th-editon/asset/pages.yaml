  md: '# Access Modifiers for Java Classes


    Maybe the things that you read about access modifiers for members make you a tad
    dizzy. After all, member access in Java is a complicated subject with lots of
    twist and cliffhangers. Well, the dizziness is over. Compared with the saga for
    fields and methods, the access story for classes is rather simple.


    A class can be either public or nonpublic. If you see something like


    ```

    public class Drawing

    ```


    you''re looking at the declaration of a public class. But, if you see plain old


    ```

    class ShowFrame

    ```


    the class that''s declared isn''t public.


    # Public classes


    If a class is public, you can refer to the class from anywhere in your code. If
    course, some restrictions apply. You must obey all the rules in this chapter''s
    “Directory structure” section. You must also refer to a package class properly.
    For example, in Listing 14-1, you can write


    ```

    import com.burdbrain.drawings.Drawing;

    import com.burdbrain.frames.ArtFrame;

    ...

    Frame artFrame = new ArtFrame(new Drawing());

    ```


    or you can do without the import declarations and write


    ```

    com.burdbrain.frames.ArtFrame artFrame =

    new com.burdbrain.frames.ArtFrame(new com.burdbrain.drawings.Drawing());

    ```


    One or another, your code must acknowledge that the ArtFrame and Drawing classes
    are in named packages.


    # Nonpublic classes


    If a class''s not public, you can refer to the class only from code within the
    class''s package.


    I tried it. First, I went back to Listing 14-2 and deleted the word public. I
    turned this class Drawing into plain old class Drawing, like this:


    ```

    package com.burdbrain.drawings;

    ```'
