  md: 'portability.


    What makes Java bytecode so versatile? This fantastic universality enjoyed by
    Java bytecode programs comes from the Java Virtual Machine. The Java Virtual Machine
    is one of those three tools that you must have on your computer.


    Imagine that you''re the Windows representative to the United Nations Security
    Council. (See Figure 2-1.) The Macintosh representative is seated at your right,
    and the Linux representative is on your left. (Naturally, you don''t get along
    with either of these people. You''re always cordial to one another, but you''re
    never sincere. What do you expect? It''s politics!) The distinguished representative
    from Java is at the podium, and neither nor your fellow representative ambassadors
    (Mac and Linux) understand a word of Java bytecode.


    ![](img/41729454897330473a2b5ec1aed6a545_56_0.png)


    FIGURE 2-1; An imaginary meeting of the UN Security Council.


    But each of you has an interpreter. Your interpreter translates from bytecode
    to Windows while the Java representative speaks. Another interpreter translates
    from bytecode to Macintosh-ese. And a third interpreter translates'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'bytecode into Linux-speak.


    Think of your interpreter as a virtual ambassador. The interpreter doesn''t really
    represent your country, but the interpreter performs one of the important tasks
    that a real ambassador performs. The interpreter listens to


    bytecode on your behalf. The interpreter does what you would do if your native
    language were Java bytecode. The interpreter pretends to be the Windows ambassador
    and sits through the boring bytecode speech, taking in every word and processing
    each word in some way or another.


    You have an interpreter — a virtual ambassador. In the same way, a Windows computer
    runs its own bytecode-interpreting software. That software is the Java Virtual
    Machine.


    A Java Virtual Machine is a proxy, an errand boy, a go-between. The JVM serves
    as an interpreter between Java''s run-anywhere bytecode and your computer''s own
    system. While it runs, the JVM walks your computer through the execution of bytecode
    instructions. The JVM examines your bytecode, bit by bit, and carries out the
    instructions described in the bytecode. The JVM interprets bytecode for your Windows
    system, your Mac, or your Linux box, or for whatever kind of computer you''re
    using. That''s a good thing. It''s what makes Java programs more portable than
    programs in any other language.


    ![](img/41729454897330473a2b5ec1aed6a545_57_0.png)'
