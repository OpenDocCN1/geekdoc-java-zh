  md: '# Why You Should Use Java


    It''s time to celebrate! You''ve just picked up a copy of Java For Dummies, 7th
    Edition, and you''re reading Chapter 1. At this rate, you''ll be an expert Java
    programmer in no time at all, so rejoice in your eventual success by throwing
    a big party.


    To prepare for the party, I''ll bake a cake. I''m lazy, so I''ll use a ready-to-bake
    cake mix. Let me see ... add water to the mix and then add butter and eggs — hey,
    wait! I just looked at the list of ingredients. What''s MSG? And what about propylene
    glycol? That''s used in antifreeze,


    I''ll change plans and make the cake from scratch. Sure, it''s a little harder,
    that way I get exactly what I want.


    Computer programs work the same way. You can use somebody else''s program or write
    your own. If you use somebody else''s program, you use whatever you get. When
    you write your own program, you can tailor the program especially for your needs.


    Writing computer code is a big, worldwide industry. Companies do it, freelance
    professionals do it, hobbyists do it — all kinds of people do it. A typical big
    company has teams, departments, and divisions that write programs for the company.
    But you can write programs for yourself or someone else, for a living or for fun.
    In a recent estimate, the number of lines of code written each day exceeds the
    number of methane molecules on the planet Jupiter.—** Take almost anything that
    can be done with a computer. With the right amount of time, you can write your
    own program to do it. (Of course, the “right amount of time” may be very long,
    but that''s not the point. Many interesting and useful programs can be written
    in hours or even minutes.)'
