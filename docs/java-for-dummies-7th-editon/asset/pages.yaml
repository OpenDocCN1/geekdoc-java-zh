  md: '# Introduction


    Java is good stuff. I''ve been using it for years. I like Java because it''s orderly.
    Almost everything follows simple rules. The rules can seem intimidating at times,
    but this book is here to help you figure them out. So, if you want to use Java
    and you want an alternative to the traditional techie, soft-cover book, sit down,
    relax, and start reading Java For Dummies, 7th Edition.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# How to Use This Book


    I wish I could, “Open to a random page of this book and start writing Java code.
    Just fill in the blanks and don’t look back.” In a sense, this is true. You can’t
    break anything by writing Java code, so you’re always free to experiment.


    But let me honest. If you don’t understand the big picture, writing a program
    is difficult. That’s true with any computer programming language — not just Java.
    If you’re typing code without knowing what it’s about and the code doesn’t exactly
    do what you want it to do, you’re just plain stuck.


    In this book, I divide Java programming into manageable chunks. Each chunk is
    (or more less) a chapter. You can jump in anywhere you want — Chapter 5, You can
    even start by poking around in the middle of a chapter. I’ve tried to make the
    examples interesting without making one chapter depend on another. When I use
    an important idea from another chapter, I include a note to help you find your
    way around.


    In general, my advice is as follows:


    +   » If you already know something, don’t bother reading about it.


    +   » If you’re curious, don’t be afraid to skip ahead. You can always sneak a
    peek at an earlier chapter, if you really need to do so.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Conventions Used in This Book


    Almost every technical book starts with a little typeface legend, and Java Dummies,
    7th Edition, is no exception. What follows is a brief explanation of the typefaces
    used in this book:


    +   - New terms are set in *italics.*


    +   - If you need to type something that’s mixed in with the regular text, the
    characters you type appear in bold. For example: “Type *MyNewProject* in the text
    field.”


    +   - You also see this computerese font. I use computerese for Java code, filenames,
    web page addresses (URLs), onscreen messages, and other things. Also, if something
    you need to type is really long, it appears in computerese font on its own line
    (or lines).


    +   - You need to change things when you type them on your own computer keyboard.
    For instance, I may ask you to type


    ```

    public class Anyname

    ```


    which means that you type **public class** and then some name that you make up
    on your own. Words that you need to replace with your own words are set in *italicized*
    computerese.'
  merge: -1
  pgno: 11
