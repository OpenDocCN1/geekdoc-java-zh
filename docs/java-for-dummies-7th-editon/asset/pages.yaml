  md: '# Using Subclasses


    The preceding section tells a story about about creating subclasses. It’s a good
    story, but it’s incomplete. Creating subclasses is fine, but you gain nothing
    from these subclasses unless you write code to use them. In this section, you
    explore that code uses subclasses.


    Now the time has come for you to classify yourself as either a type-F person,
    a type-P person, or a type-T person. (I''m this book''s author, so I get to make
    some personality types. I can even point to someone in public and say, “Look!
    He’s a type-T person!)


    +   **» A-F person** wants to see the fundamentals. “Show me a program that lays
    out the principles in their bare, most basic form,” says the type-F person. A
    type-F person isn''t worried about bells and whistles. The bells come later, and
    the whistles may never come. If you''re a type-F person, you want to see a program
    that uses the FullTimeEmployee and PartTimeEmployee subclasses and then moves
    out of your way so that you can get some done.


    +   **» A-P person** wants practical applications. (The letter F stands for practical.).
    Type-P people want to see ideas in context; otherwise, the ideas float away too
    quickly. “Show me a program that demonstrates the usefulness of the FullTimeEmployee
    and PartTimeEmployee subclasses,” says the type-P person. “I have no use for your
    stinking abstractions. And I want them now!


    +   **» A-T person** is inspired by something that I write briefly in Chapter
    7: The type-T person wants to test the code in the FullTimeEmployee and PartTimeEmployee
    subclasses. The code means putting the code through its paces — checking the output’s
    accuracy when the input is ordinary, when the input is unexpected, and even when
    the input is completely unrealistic. What''s more, the type-T person wants to
    use a standard, easily recognizable outline for the testing code so that other
    programmers can quickly understand the test results. The type-T person creates
    JUnit tests that use the FullTimeEmployee and PartTimeEmployee subclasses.'
