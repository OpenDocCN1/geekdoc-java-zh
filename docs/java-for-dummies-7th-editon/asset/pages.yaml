    If you write a Java program and compile that Java program into bytecode, the JVM
    on your computer can run the bytecode, the JVM on your friend''s computer can
    run the bytecode, the JVM on your grandmother''s supercomputer can run the bytecode,
    and with any luck, the JVM on your cellphone or tablet can run the bytecode.


