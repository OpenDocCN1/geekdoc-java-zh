  md: '# # Object-Oriented Programming (OOP)


    It''s three in the morning. I''m dreaming about the history course that I failed
    in high school. The teacher is yelling at me, "You have two days to study for
    the final exam, but you won''t remember to study. You''ll forget and feel guilty,
    guilty, guilty."


    Suddenly, the phone rings. I''m awakened abruptly from my deep sleep. (Sure, I
    disliked dreaming about the history course, but I like being awakened even less.)
    At first, I drop the telephone on the floor. After fumbling to pick it up, I issue
    a grumpy, "Hello, who''s this?" A voice answer, "I''m a reporter from the New
    York Times. I''m writing an article about Java, and I need to know all about the
    programming language in five words or less. Can you explain it?


    My mind is too hazy. I can''t think. So I say the first thing that comes to my
    mind and then go back to sleep.


    Come morning, I hardly remember the conversation with the reporter. In fact, I
    don''t remember how I answered the question. Did I tell the reporter where he
    could put his article about Java?


    I put on my robe and rush out to my driveway. As I pick up the morning paper,
    I glance at the front page and see this 2-inch headline:


    > >Burd Calls Java“A Great Object-Oriented Language”


    # ## Object-oriented languages


    Java is object-oriented. What does that mean? Unlike languages, such as FORTRAN,
    that focus on giving the computer imperative “Do this/Do that” commands, object-oriented
    languages focus on data. Of course, object-oriented programs still tell the computer
    what to do. They start, however, by organizing the data, and the commands come
    later.


    Object-oriented languages are better than “Do this/Do that” languages because
    they organize data in a way that helps people do all kinds of things with it.
    To modify the data, you can build on what you already have rather than scrap everything
    you''ve done and start over each time you need to do something new. Although computer
    programmers are generally smart people,'
