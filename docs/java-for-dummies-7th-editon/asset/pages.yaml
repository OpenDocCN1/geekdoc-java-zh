  md: 'That''s new and different. In earlier chapters, I say that you normally preface
    a method call with an object''s name, not a class''s name. So why do I use a class
    name here? The answer: When you call a static method, you preface the method''s
    name with the name of the class that contains the method. The same holds true
    whenever you reference another class''s static field. This makes sense. **Remember:**
    The whole class that defines a static field or method owns that field or method.
    So, to refer to a static field or method, you preface the field or method with
    the name of the class''s name.


    ![](img/41729454897330473a2b5ec1aed6a545_348_0.png)


