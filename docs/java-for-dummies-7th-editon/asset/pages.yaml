    # The double equal sign


    In Listing 5-1, in the statement’s condition, notice the use of the double equal
    sign. Comparing two numbers to see whether they’re the same isn’t the same as
    setting something equal to something else. That’s why the symbol to compare for
    equality isn’t the same as the symbol that’s used in an assignment or an initialization.
    In an statement’s condition, you can’t replace the double equal sign with a single
    equal sign. If you do, your program will always get an error message when you
    try to compile your code.


    On the other hand, if you never make the mistake of using a single equal sign
    in a condition, you’re not normal. Long ago, while I was teaching an introductory
    Java course, I promised that I’d swallow my laser pointer if no one made the single
    equal sign mistake during any of the lab sessions. This wasn’t an idle promise.
    I knew I’d never have to keep it. As it turned out, even if I had ignored the
    first ten anybody made the single equal sign mistake during those lab sessions,
    I would still be laser-pointer-free. Everybody mistakenly uses the single equal
    sign several times in a programming career.


    > The trick is not to avoid making the single-equal-sign mistake; the trick is
    to catch the mistake whenever you make it.'
