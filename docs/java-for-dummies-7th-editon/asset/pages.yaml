  md: '# Using Java Database Connectivity


    # IN THIS CHAPTER


    +   » Connecting to a database


    +   » Inserting values into a database


    +   » Making queries to a database


    Whenever I teach Java to professional programmers, I always hear the same old
    thing: “We don''t need to make attractive-looking layouts. No glity GUIs for us.
    We need to access databases. Yup, just [shut up and] show us how to write Java
    programs that talk to databases.


    So here it is, folks — the real deal!


    The Java Database Connectivity* (JDBC) classes provide common access to most database
    management systems. Just get a driver for your favorite vendor’s system, customize
    one line of code in each of this chapter''s examples, and you''re ready to go.'
