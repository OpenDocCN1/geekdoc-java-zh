    \ The reduce combines the cores' results into a final tally. In the best possible\
    \ scenario, all the work gets done in one-fourth of the time it would take with\
    \ an ordinary serial stream.\n\n![](img/41729454897330473a2b5ec1aed6a545_437_0.png)\n\
