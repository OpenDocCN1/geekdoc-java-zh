  md: '# # Working with Disk Files (a Brief Detour)


    In previous chapters, programs read characters from the computer''s keyboard.
    But the code in Listing 8-2 reads characters from a specific file. The file (named
    EmployeeInfo.txt) lives on your computer''s hard drive.


    This EmployeeInfo.txt file is like a word processing document. The file can contain
    letters, digits, and other characters. Unlike a word processing document, the
    EmployeeInfo.txt file contains no formatting — no italics, no bold, no font sizes,
    and nothing of that kind.


    The EmployeeInfo.txt file contains only ordinary characters — the kinds of keystrokes
    that you type while you are guessing a game from Chapters 5 and 6. Of course,
    getting guesses from a user''s keyboard and reading employee data from a disk
    file aren''t the same. In a guessing game, the program displays prompts, such
    as an int from 1 to 10. The game program conducts a back-and-forth dialogue with
    the person sitting at the keyboard. In contrast, Listing 8-2 has no dialogue.
    DoPayroll program reads characters from a hard drive and doesn''t prompt or interact
    with anyone.


    Most of this chapter is about code reuse. But Listing 8-2 stumbles upon an important
    idea — an that''s not directly related to code reuse. Unlike the examples in previous
    chapters, Listing 8-2 reads data from a stored disk file. So, in the following
    sections, I take a short side trip to explore disk files.


    # # Storing data in a file


    The code in Listing 8-2 doesn''t run unless you have some employee data sitting
    in a file. Listing 8-2 says that this file is EmployeeInfo.txt. So, before running
    the code of Listing 8-2, I created a small EmployeeInfo.txt file. The file is
    shown in Figure 8-3; refer to Figure 8-2 for the resulting output.'
