  md: 'The thing called System.out is an object. The object is defined in the Java
    API. In fact, System.out is an instance of a class java.io.PrintStream (or just
    PrintStream to its close friends). Now each object created from the PrintStream
    class has methods print and println. as each Account object in Listing 7-3 has
    a display method, and just as the DecimalFormat object in Listing 10-1 has a format
    method, so the PrintStream object has print and println methods. When you call
    System.out.println, you''re calling a method that belongs to a PrintStream instance.


    Okay, so what of it? Well, System.out always stands for some text area on your
    computer screen. If you create your own PrintStream object and make that object
    refer to a disk file, then PrintStream object refers to the disk file. When you
    call that object''s print method, you write text to a file on your hard drive.


    In Listing 11-4, when you say


    ```

    OutputStream listOut = new PrintStream("guests.txt");

    listOut.print(guests[roomNum]);

    listOut.print(" ");

    ```


    you''re telling Java to write to a file on your hard drive — the GuestList.txt
    file.


    That''s how you update the count of guests staying in the hotel. When you call
    listOut.print, for the number of guests in Room 3, you may print the number 5.
    So, between Figures 11-5 and 11-6, a number in the GuestList.txt file changes
    from 0 to 5. Then in Figure 11-6, you run the program a second time. When the
    program gets data from the newly written GuestList.txt file, Room 3 is no longer
    vacant. This time, the program suggests Room 8.


