  md: '# # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are clumped finally into five parts. (When
    you write a book, you get to know your book''s structure pretty well. After months
    of writing, you find yourself dreaming in sections and chapters when you go to
    bed at night.) The parts of the book are listed here.


    # ## Part 1: Getting Started with Java


    This part is your complete, executive briefing on Java. It includes some “What
    is Java?” material and a jump-start chapter — Chapter 3. In Chapter 3, you visit
    the major technical ideas and dissect a simple program.


    # ## Part 2: Writing Your Java Program


    Chapters 4 through 6 cover the fundamentals. These chapters describe the things
    that you need to know so that you can get your computer humming along.


    If you''ve written programs in Visual Basic, C++, or any other language, some
    of the material in Part 2 may be familiar to you. If so, you can skip some sections
    or read this stuff quickly. Java is a little different from some other programming
    languages, especially in the things that I describe in Chapter 4.


    # ## Part 3: Working with the Big Picture: Object-Oriented Programming


    Part 3 has some of my favorite chapters. This part covers the all-important topic
    of object-oriented programming. In these chapters, you find out how to map solutions
    to big problems. (Sure, the examples in these chapters aren''t big, but they are
    Bite-worthy increments, you discover how to design classes, reuse existing classes,
    and construct objects.


    Have you read any of these books that explain object-oriented programming in vague,
    general terms? I''m proud to say that Java For Dummies, 7th Edition, isn''t like
    that. In this book, I illustrate each concept with a simple-concrete program example.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Part 4: Smart Java Techniques


    If you’ve tasted some Java and you want more, you can find what you need in this
    part of the book. This part’s chapters are devoted to details — the things that
    you don''t see when you first glance at the material. After you read the earlier
    parts and write some programs on your own, you can dive in a little deeper by
    reading Part 4.


    # Part 5: The Part of Tens


    The Part of Tens is a little Java candy store. In the Part of Tens, you can find
    lists — lists of tips for avoiding mistakes, for finding resources, and for all
    kinds of interesting goodies.'
  merge: -1
