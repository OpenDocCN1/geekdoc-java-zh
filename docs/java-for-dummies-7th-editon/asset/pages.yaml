    +   When you pack a frame, you set the frame''s size. The frame when it appears
    on your computer screen. Packing a frame shrink-wraps the frame around whatever
    objects you''ve added inside the frame.


    In Listing 10-2, by the time you''ve reached the call to pack, you''ve already
    called addPlayerInfo nine times and added 18 labels to the frame. In executing
    the pack method, the computer picks a size for each label, given whatever text
    you''ve put inside the label. Then the computer picks a size for the whole frame,
    given that the frame has these 18 labels inside it.


    When you stuff onto, you have a bit of leeway with the order in which you do things.
    For instance, you can set the layout before after you''ve added labels and other
    stuff to the frame. If you call setLayout and then add labels, the labels appear
    in nice, orderly positions on the frame. If you reverse this order (add labels
    and then call setLayout), the calling of setLayout rearranges the labels in a
    nice, orderly fashion. It works fine other way.


    In setting up a frame, the thing that you shouldn''t violate is the following
    sequence:


    ```

    Add things to the frame, then

    pack();

    setVisible(true);

    ```


    If you pack and add more things to the frame, the pack method doesn''t take into
    consideration the most recent things that you''ve added. If you call setVisible
    before you add labels or call pack, the user sees the frame as it''s being constructed.
    Finally, if you forget to set the frame''s size (by calling pack or another sizing
    method), the frame that you see looks like the one in Figure 10-4 (Normally, I
    wouldn''t show you an anomalous run like the one in Figure 10-4, but I''ve made
    the mistake so many times that I feel as this puny frame is an old friend of mine.)'
