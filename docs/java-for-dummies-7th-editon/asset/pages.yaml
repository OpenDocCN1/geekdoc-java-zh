    In a small program, unindented poorly indented code is tolerable. But in a complicated
    program, indentation that doesn’t follow a neat, logical pattern is a big, ugly
    nightmare.


    ![](img/41729454897330473a2b5ec1aed6a545_157_0.png)


    Many Java IDEs have tools to indent your code automatically. In fact, code indentation
    is one of my favorite IDE features. Don’t walk run — to a computer, and visit
    this book’s website (www.allmycode.com/JavaForDummies) for more information on
    what Java IDEs can offer.


    ![](img/41729454897330473a2b5ec1aed6a545_157_1.png)


    WARNING When you write statements, you may be tempted to chuck out the window
    all the rules about curly braces and simply rely on indentation. This works in
    other programming languages, such as Python and Haskell, but it doesn’t work in
    Java. If you indent three statements after the word else and forget to enclose
    those statements in curly braces, the computer thinks that the else part includes
    only the first of the three statements. What’s worse, the indentation leads you
    into believing that the else part includes all three statements. This makes it
    more difficult for you to figure out why your code isn’t behaving the way you
    think it should. Watch those braces!


