  md: '# >> Extending a subclass represents an a relationship.


    Think about the relationships in this chapter’s earlier section “Abstract Classes.”
    A house pet is an animal. A dog is a house pet. A cat is a house pet. A fish is
    a house pet.


    # >> Implementing an interface represents a can do relationship.


    Think about the relationships in this chapter’s earlier section “The Java Interface.”
    The first line in Listing 15-3 says Implementable. With these words, the code
    promises that each ColumnOfNumbers object can be displayed. Later in same listing,
    you make good on the promise by declaring a display method.


    Think about the relationships in this chapter’s earlier section “The Java Interface.”
    A column of numbers isn''t always a summarizable thing. But in Listing 15-3, you
    promise that the ColumnOfNumbers objects will be summarizable, and you make good
    on the promise by declaring a summary method.


    If you want more tangible evidence of the difference between an interface and
    an abstract class, consider this: A class can implement many interfaces, but a
    class can extend only one other class, even if one class is an abstract class.
    So, after you’ve declared


    ```

    public class Dog extends HousePet

    ```


    you can''t also make Dog extend a Friend class. But you can make Dog implement
    a Implementable interface. And then you can make the same Dog class implement
    a Trainable interface. (By the way, I tried making my Cat implement a Trainable
    interface, for some reason, it never works.)


    And, if you want an even more tangible difference between an interface and an
    abstract class, I have one for you: An interface can''t contain any non-static,
    final fields. For example, if the HousePet class in Listing 15-7 were an interface,
    it couldn''t have a name field. That simply wouldn''t be allowed.


    So there. Interfaces and abstract classes are different from one another. But
    if you''re new at the game, you shouldn''t worry about the difference. Just read
    as much code you can, and don''t get scared when you see an abstract method. That''s
    all there is to it.'
