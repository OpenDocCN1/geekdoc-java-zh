    that''s easy to do. Whenever you see a plus sign, a cell in your brain says, “Thank
    goodness — it could be something more complicated.


    Java has a plus sign. You can use it for several purposes. You can use the plus
    sign to add two numbers,


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    You can also use the plus sign to paste String values together:


    ```

    String startOfChapter =

    "It''s three in the morning. I''m dreaming about the+

    "history course that I failed in high school.";

    System.out.println(startOfChapter);

    ```


    This can be bad because in Java, you''re not allowed to make a String straddle
    one to another. In others, the following code wouldn''t work:


    ```

    String thisIsBadCode =

    "It''s three in the morning. I''m dreaming about the

    history course that I failed in high school.";

    System.out.println(thisIsBadCode);

    ```


    ![](img/41729454897330473a2b5ec1aed6a545_132_0.png)


    The correct way to say that you''re pasting String values together is to say that
    you''re concatenating String values.


    You can even use the plus sign to paste numbers next to String values:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    System.out.println("You have " + fruit + "pieces of fruit.");

    ```'
