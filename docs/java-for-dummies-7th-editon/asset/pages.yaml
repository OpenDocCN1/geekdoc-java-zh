  md: "# Destroying Data\n\nIt's true. All good things must come to an end. By writing\
    \ this, I'm referring both to this book's content and to the information in this\
    \ chapter's AccountDatabase.\n\nTo get rid of the database table that you create\
    \ in Listing 17-1, run the code in Listing 17-4.\n\n# LISTING 17-4: Arrivederci,\
    \ Database Table\n\n```\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.SQLException;\nimport java.sql.Statement;\n\npublic class DropTable\
    \ {\n    public static void main(String[] args) {\n        final String CONNECTION\
    \ = \"jdbc:derby:AccountDatabase\";\n\n        try (Connection conn = DriverManager.getConnection(CONNECTION);\n\
    \             Statement statement = conn.createStatement()) {\n            statement.executeUpdate(\"\
    drop table ACCOUNTS\");\n            System.out.println(\"ACCOUNTS table dropped.\"\
    );\n        } catch (SQLException e) {\n            e.printStackTrace();\n   \
    \     }\n    }\n}\n```\n\nWhen you run this code, your wipe slate clean no longer\
    \ contains an ACCOUNTS table. So, if you want to run Listing 17-1 again (perhaps\
    \ with a change or two), you can.\n\nWho knows? You may even create a table to\
    \ store your favorite Java For Dummies jokes.\n\n![](img/41729454897330473a2b5ec1aed6a545_567_0.png)\n\
    \nTRY IT OUT Naturally, I have some things for you to try:\n\n+   Rerun the code\
    \ in Listing 17-3. This time, use the following string in the executeQuery call:\n\
    \n```\n\"select * from ACCOUNTS WHERE BALANCE > 30\"\n```"
