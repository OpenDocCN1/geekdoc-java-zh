  md: 'For more information on the kinds of names in a Java program, see Chapter 3.


    Before the sun sets on Listing 4-1, you need to notice one more part of the listing.
    The listing has 50.22 and 100000.00 in it. Anybody in his or right mind would
    call these things numbers, but in a Java program it helps to call these literals.


    And what’s so literal about 50.22 and 100000.00? Well, think about the variable
    amountInAccount in Listing 4-1. The variable amountInAccount stands for 50.22
    some of the time, but it stands for 100050.2 for the rest of the time. You could
    use the word number to talk about amountInAccount. But really, what amountInAccount
    stands depends on the fashion of the moment. On the other hand, 50.22 literally
    stands for the value 50 22/100.


    REMEMBER A variable’s value changes, a literal’s value doesn’t.


    Starting with Java 7, you can add underscores to numeric literals. Instead of
    using the plain old 1000000.00 in Listing 4-1, you can write amountInAccount =
    amountInAccount + 1_000_000.00. Unfortunately, you can’t easily do what you’re
    tempted to do. You can’t write 1,000,000.00 (as you would in the United States),
    nor can you write 1,000,000.00 (as you would in Germany). If you want to display
    a number as 1,000,000.00 in the program’s output, you have to use some fancy formatting
    tricks. For more information about formatting, check Chapters 10 and 11.


