    these take up 64 bits. So, if you declare amountInAccount to be of type float,
    you''ll run into trouble. They have troubling those 64-bit literals into your
    little 32-bit amountInAccount variable. To compensate, you can switch from double
    literals to float literals by adding an F to each literal, but with an extra F
    that ends funny.


    ```

