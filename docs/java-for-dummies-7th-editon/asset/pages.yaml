    The double plus signs go by two names, depending on where you put them. When you
    put the ++ before a variable, the ++ is called the preincrement operator. (The
    pre stands for before.)


    The word before has two meanings:


    +   * You put ++ before the variable.

    * The computer adds 1 to the variable''s value before the variable is used in
    any other part of the statement.


    To understand this, look at the bold line in Figure 4-13. The computer adds 1
