    The MoneyFrame implements three interfaces: the KeyListener, ItemListener, and
    MouseListener interfaces. Because it implements three interfaces, the code can
    listen for three kinds of events. I discuss the interfaces and events in the following
    list:


    +   **KeyListener:** A class that implements the KeyListener must have three methods
