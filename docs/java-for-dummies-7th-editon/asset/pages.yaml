  md: "# # Collection Classes to the Rescue\n\nThe issues in the preceding section\
    \ aren't new. Computer scientists have been working on these issues for a long\
    \ time. They haven't discovered any one-size-fits-all solution, but they've discovered\
    \ some clever tricks.\n\nThe Java API has a bunch of classes known as collection\
    \ classes. Each collection class has methods for storing bunches of values, and\
    \ each collection class's methods use some clever tricks. For you, the bottom\
    \ line is as follows: Certain collection classes deal as efficiently as possible\
    \ with the issues raised in the preceding section. If you have to deal with these\
    \ issues when writing code, you can use these collection classes and call the\
    \ classes' methods. Rather than fret about a customer whose name belongs in position\
    \ 7, you can just call a class add method. The method inserts the name at a position\
    \ of your choice and deals reasonably with whatever ripple effects have to take.\
    \ In the best circumstances, the insertion is very efficient. In the worst circumstances,\
    \ you can rest assured that the code does everything the best way it can.\n\n\
