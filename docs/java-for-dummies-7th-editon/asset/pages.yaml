    displaying temperatures has seriously misplaced. Listing 9-3 has several tedious
    repetitions of the lines to print temperature values. A1970s programmer would
    tell you to collect these lines into one place and turn them into a method. (The1970s
    programmer wouldn''t have used the method, but that''s not important right now.)
    Collecting lines into methods is fine, with today''s object-oriented programming
    methodology, you think in broader terms. Why not get each object to take responsibility
    for displaying itself? After all, if you develop a display method, you probably
    want to share the method with other people who use temperatures. So put the method
    right inside the declaration of a temperature object. That way, anyone who uses
    the code for temperatures has easy access to your display method.


