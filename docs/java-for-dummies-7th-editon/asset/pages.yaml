  md: 'A run of the code in Listings 7-8 and 7-9 looks no different from a run of
    Listings 7-1 and 7-2. Either program''s run is shown earlier, in Figure 7-3. The
    big difference is that in Listing 7-8, the Account class enforces the carefully
    controlled use of its name, address, and balance fields.


    # # Public lives and private dreams: Making a field inaccessible


    Notice the addition of the word *private* in front of each of the Account class''s
    declarations. The word *private* is a Java keyword. When a field is declared private,
    no code outside of the class can make reference to that field. So if you try myAccount.name="Barry
    Burd" in the UseAccount class of Listing 7-9, you get an error message such as
    name has private access in Account.


    Instead of replacing myAccount.name, the UseAccount programmer must call myAccount.setName
    or method myAccount.getName. These methods, setName and getName, are accessor
    methods because they provide access to the Account class''s name field. (Actually,
    the term accessor method isn''t formally a part of the Java programming language.
    It''s just the term that people use for methods that do this sort of thing.) To
    zoom in even more, setName is called a *setter* method, and getName is called
    a *getter* method. (I bet you won''t forget that terminology!)


    ![](img/41729454897330473a2b5ec1aed6a545_246_0.png)


    With IDEs, you don''t have to type your own accessor methods. First, you type
    a field declaration like String name. Then, in your IDE''s menu bar, you Source
    ⇒ Generate Getters and Setters, or choose Code ⇒ Insert Code ⇒ Setter or some
    of these commands. After you make all your choices, the IDE creates accessor methods
    and adds them to your code.


    Notice that all the setter and getter methods in Listing 7-8 are declared to be
    public. This ensures that anyone from anywhere can call these two methods. The
    idea here is that manipulating the actual fields from outside the Account'
