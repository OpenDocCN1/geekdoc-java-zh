  md: 'REM Every Java class is a reference type. If you declare a variable to have
    some type that''s not a primitive type, the variable''s type is (most of the time)
    the name of a Java class.


    Now, when you declare a variable to have type int, you can visualize what that
    declaration means in a fairly straightforward way. It means that, somewhere inside
    the computer''s memory, a storage location is reserved for that variable''s value.
    In the storage location is a bunch of bits. The arrangement of bits ensures that
    a certain number is represented.


    That explanation is fine for primitive types like int or double, but what does
    it mean when you declare a variable to have a reference type? What does it mean
    to declare your myFrame be of type JFrame?


    Well, what does it mean to declare i thank You God to be an E. E. Cummings poem?
    What would it mean to write the following declaration?


    ```

    EECummingsPoem ithankYouGod;

    ```


    It means that a class of things is EECummingsPoem, and ithankYouGod refers to
    an instance of that class. In other words, ithankYouGod is an object belonging
    to the EECummingsPoem class.


    Because JFrame is a class, you can create objects from that. (If you don''t believe
    me, read some of my paragraphs about classes and objects in Chapter 1.) Each object
