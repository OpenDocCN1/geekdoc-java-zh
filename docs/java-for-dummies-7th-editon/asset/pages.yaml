  md: '# All about Java


    IN THIS CHAPTER


    +   ** What Java is

    ** Where Java came from

    ** Why Java is so cool

    ** How to orient yourself to object-oriented programming


    Say what you want about computers. As far as I''m concerned, computers are good
    for just two simple reasons:


    +   ** When computers do work, they feel no resistance, no stress, no bored, and
    no fatigue.** Computers are our electronic slaves. I have my computer working
    24/7 doing calculations for Cosmology@Home — a distributed computing project to
    investigate models describing the universe. Do I feel sorry for my computer because
    it''s working hard? Does the computer complain? Will the computer report me to
    the National Labor Board? No.


    I can make demands, give the computer its orders, and crack the whip. Do I (or
    should I) feel the least guilty? Not at all.


    +   **Computers move ideas, not paper.** Not long ago, when you wanted to send
    a message to someone, you hired a messenger. The messenger got on his or horse
    and delivered your message personally. The message was on paper, parchment, a
    clay tablet, or whatever physical medium was available at the time.


    This whole process seems wasteful, but that''s only because you and I are sitting
    comfortably in the electronic age. Messages are ideas, and physical things like
    ink, paper, and horses have little to do with real ideas; they''re just temporary
    carriers for ideas (even though people used them to carry ideas for several centuries).
    Nevertheless, the ideas themselves are paperless, homeless, and messengerless.


    The neat thing about computers is that they carry ideas efficiently. They carry
    nothing but the ideas, a couple of photons, and a little electrical'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'power. They do this with no muss, no fuss, and no extra physical baggage.


    When you start dealing efficiently with ideas, something very nice happens. Suddenly,
    all the overhead is gone. Instead of pushing paper and trees, you’re pushing numbers
    and concepts. Without the overhead, you can do things much faster and do things
    that are far more complex than ever before.'
  merge: -1
  pgno: 26
