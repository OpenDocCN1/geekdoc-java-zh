  md: '# Icons Used in This Book


    If you could watch me write this book, you''d see me sitting at my computer, talking
    to myself. I say each sentence in my head. Most of the sentences, I mutter several
    times. When I have an extra thought, a side comment, or something that doesn''t
    belong in the regular stream, I twist my head a little bit. That, whoever''s listening
    to me (usually nobody) knows that I''m off on a momentary tangent.


    Of course, in print, you can''t see twisting my head. I need some other way of
    setting a side thought in a corner by itself. I do it with icons. When you see
    a Tip icon or a Remember icon, you know that I''m taking a quick detour.


    Here''s a list of icons that I use in this book:


    ![](img/41729454897330473a2b5ec1aed6a545_17_0.png)


    +   Tip is an extra piece of information — something helpful that the other books
    may forget to tell you.


    ![](img/41729454897330473a2b5ec1aed6a545_17_1.png)


    +   WARNING Everyone makes mistakes. Heaven knows that I''ve made a few in my
    time. Anyway, when I think people are especially prone to make a mistake, I mark
    it with a Warning icon.


    ![](img/41729454897330473a2b5ec1aed6a545_17_2.png)


    +   REMEMBER Question: What''s stronger than a Tip, but not as strong as a Warning?
    Answer: A Remember icon.


    ![](img/41729454897330473a2b5ec1aed6a545_17_3.png)


    +   CROSS REFERENCE "If you don''t remember what such-and-such means, see blah-blah-blah,”
    or "For more information, read blahbity-blah-blah-blah."'
  merge: -1
