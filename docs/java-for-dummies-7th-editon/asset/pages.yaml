    # Wrapper classes


    In Chapter 4, I point out that Java has two kinds of types: primitive types and
    reference types. (If you don''t read those sections, or you don''t remember them,
    don''t feel guilty. It''ll be okay.) Things like int, double, char, and boolean
    are primitive types, and things like String, JFrame, and Account are reference
    types.


    The distinction between primitive types and reference types has been a source
    of contention since Java''s birth in 1995. Even now, Oracle''s wizards are hatching
    plans to get around the stickier consequences of having kinds of types. One of
    those consequences is the fact that collections, such as the ArrayList, cannot
    contain values of a primitive type. For example, it''s okay to write


    ```

    ArrayList<String> people = new ArrayList<>();

    ```


    but it''s not to write


    ```

    ArrayList<int> numbers = new ArrayList<>(); // BAD! BAD!

    ```


    because int is a primitive. So, if you want to store values like 3, 55, and 21
    in an ArrayList, what do you do? Rather than store int values in the ArrayList,
    you store Java''s Integer values:


    ```

    ArrayList<Integer> list = new ArrayList<>();

    ```


    In previous chapters, you use the Integer class in connection with the parseInt
    method:


    ```

    int numberOfOfCows = Integer.parseInt("536");

    ```


    The Integer class has many methods, such as parseInt, for dealing with int values.
    The class also has fields such as MAX_VALUE and MIN_VALUE, which stand for the
    largest and smallest values that int variables may have.'
