    TECHNICAL STAFF The real story about protected access is one step more complicated
    than the story that I describe in this section. The Java Language Specification
    (https://docs.oracle.com/javase/specs) mentions a hair-splitting point about code
    being responsible for an object''s implementation. When you''re first figuring
    out how to program in Java, don''t worry about this point. Wait until you''ve
    written many Java programs. Then when you stumble upon a variable has protected
    access error message, you can start worrying. Better yet, skip the worrying and
    take a careful look at the protected access section in the Java Language Specification.


    ![](img/41729454897330473a2b5ec1aed6a545_504_1.png)


