  md: '# # Making Static (Finding the Team Average)


    Thinking about the code in Listings 10-1 through 10-3, you decide that you want
    to find the team''s overall batting average. Not a bad idea! The Hankees in Figure
    10-1 have an average of .106, so the team needs intensive training. While the
    players are out practicing on the ball field, you have a philosophical hurdle
    to overcome.


    In Listings 10-1 10-3 through 10-3, you have three classes: a Player class and
    two other classes that help display data from the Player class. In this class
    morass, where do the variables storing your overall, team-average tally go?


    +   >> It makes no sense to put tally variables in either of the displaying classes
    (TeamFrame and ShowTeamFrame). After all, the tally has something-or-do to players,
    teams, and baseball. The displaying classes are about creating windows, not about
    playing baseball.


    +   >> You''re uncomfortable putting an overall team average in an instance of
    the Player class because an instance of the Player class represents just one player
    on the team. What business does a single player storing overall team data? Sure,
    you could make the code work, but it wouldn''t be an elegant solution to the problem.


    Finally, you discover the keyword static. Anything''s declared to be static belongs
    to the whole class, not to any particular instance of the class. When you create
    the static field, totalAverages you create just one copy of the field. This code
    stays with the entire Player class. No matter how many instances of the Player
    class you create — one, nine, or none — you have just one totalAverages field.
    And, while you''re at it, while you create other static fields (playerCount and
    decFormat) and static methods (findTeamAverage and findTeamAverageString). To
    see what I mean, look at Figure 10-5.'
