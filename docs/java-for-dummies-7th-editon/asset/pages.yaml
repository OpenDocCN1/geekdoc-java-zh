  md: '# Getting Your Ducks All in a Row


    The Java Motel, with its ten comfortable rooms, sits in a quiet place off the
    main highway. Aside from a small, separate office, the motel is just one long
    row of ground-floor rooms. Each room is easily accessible from the spacious front
    lot.


    Oddly, the motel''s rooms are numbered 0 through 9. I could say that the numbering
    is a fluke — something to do with the builder''s original design plan. But the
    truth is that starting with 0 makes the examples in this chapter easier to write.


    Anyway, you''re trying to keep track of the number of guests in each room. Because
    you have ten rooms, you may think about declaring them:


    ```

    int guestsInRoomNum0, guestsInRoomNum1, guestsInRoomNum2,

    gestsInRoomNum3, guestsInRoomNum4, guestsInRoomNum5,

    gestsInRoomNum6, guestsInRoomNum7, guestsInRoomNum8;

    ```


    Doing this way may seem a bit inefficient — but inefficiency isn''t the only thing
    wrong with this code. Even more problematic is the fact that you can''t loop through
    these variables. To read a value for each variable, you have to copy the nextInt
    ten times.


    ```

    guestsInRoomNum0 = scanner.nextInt();

    gestsInRoomNum1 = scanner.nextInt();

    gestsInRoomNum2 = scanner.nextInt();

    // and so on.

    ```


    Surely a better way exists.


    That way involves an array. An array is a row of values, like the row of rooms
    in a 1-floor motel. To picture the array, just picture the Java Motel:


    +   >> First, picture the rooms, lined up next to one another.


    +   >> Next, picture the same rooms with their front walls missing. Inside each
    room you can see a number of guests.


    +   >> If you can, forget that the two guests in Room 9 are putting bills of bills
    into a big briefcase. Ignore the fact that the guests in Room 6 haven''t moved
    away from the TV in a day-and-a-half. Instead of all these details, see only numbers,
    see a number representing the count of guests in that room. (If free-form visualization
    isn’t your strong'
