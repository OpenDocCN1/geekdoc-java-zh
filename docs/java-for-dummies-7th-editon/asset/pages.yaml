  md: "# Repeating a Certain Number of Times\n(Java for Statements)\n\n“Write I will\
    \ not talk in class on the blackboard 100 times.\"\n\nWhat your teacher really\
    \ meant this:\n\n| Set the count to 0.\nAs long as the count is less than 100,\n\
    Write 'I will not talk in class' on the blackboard,\nAdd 1 to the count |\n\n\
    Fortunately, you didn't know about loops and counters at the time. If you pointed\
    \ out all this you'd have gotten into a lot more trouble than you were already\
    \ in.\n\nOne way or another, life is filled with examples of counting loops. And\
    \ computer programming mirrors life — or is it the other around? When you tell\
    \ a computer what to do, you're often telling the computer to print three lines,\
    \ ten accounts, dial a million phone numbers, or whatever. Because loops is so\
    \ common in programming, the people who create programming languages have developed\
    \ statements just for loops of this kind. In Java, the statement that repeats\
    \ a certain number of times is called a for statement. Listings 6-2 and 6-3 illustrate\
    \ the use of the statement. Listing 6-2 has a rock-bottom simple example, and\
    \ Listing 6-3 has a more exotic example. Take your pick.\n\n# LISTING 6-2: The\
    \ World’s Most Boring for Loop\n\n```\nimport static java.lang.System.out;\n\n\
    public class Yawn {\n\n    public static void main(String[] args) {\n\n      \
    \  for (int count = 1; count <= count++) {\n            out.print(\"The value\
    \ of count is \");\n            out.print(count);\n            out.println(\"\
    ,\");\n        }\n\n        out.println(\"Done!\");\n    }\n}\n```"
