  md: '# STATEMENTS AND EXPRESSIONS


    You can describe the pre- and postincrement and pre- and postdecrement operators
    in two ways: the way everyone understands them and the right way. The way that
    I explain the concept in most of this section (in terms of time, with before and
    after) is the way everyone understands it. Unfortunately, the way everyone understands
    the concept isn''t really the right way. When you see ++ or -- you can think in
    terms of time. Occasionally a programmer uses ++ or -- in a convoluted way, and
    the notions of before and after break down. If you''re ever in a tight spot, think
    about these operators in terms of statements and expressions.


    First, remember that a statement tells the computer to do something, and an expression
    has a value. (I discuss statements in Chapter 3, expressions elsewhere in this
    chapter.) Which category numberBunnies++ belongs to? The surprising answer is
    both. The Java code numberBunnies++ is both a statement and an expression.


    Assume that, before the computer executes the code out.println(numberOfBunnies++),
    the value of numberBunnies is 28.


    +   - As a statement, numberBunnies++ tells the computer to add 1 to numberBunnies.

    - As an expression, the value of numberBunnies++ is 28, not 29.


    So even though the computer adds 1 to numberBunnies++, the out.println(numberOfBunnies++)
    really means out.println(numberOfBunnies).


    Now, almost everything you read about numberBunnies++ is true about ++numberOfBunnies.
    The only difference is that as an expression, ++numberOfBunnies behaves in a more
    intuitive way.


    +   - As a statement, ++numberOfBunnies tells the computer to add 1 to numberBunnies.

    - As an expression, the value of ++numberOfBunnies is 29.


    So, with out.println(++numberOfBunnies), the computer adds 1 to the variable numberBunnies,
    and the code out.println(++numberOfBunnies) really means out.println(29).


    ![](img/41729454897330473a2b5ec1aed6a545_141_0.png)


    Instead of writing ++numberOfBunnies, you could achieve the same effect by writing
    numberBunnies = numberBunnies + 1. So some people conclude that Java''s ++ and
    -- operators are for saving keystrokes — to keep your poor fingers from overworking
    themselves. This is entirely incorrect. The best reason for ++ is is to avoid
    the inefficient'
