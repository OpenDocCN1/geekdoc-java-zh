    about enlistment in the military.


    Before the spring of 1940, World War II had been something of a dream. Hitler
    had invaded Poland, yes, and Great Britain and France had declared war on Germany,
    but no actual battles or skirmishes had taken place, and the cheeky British press
    began referring to this state of affairs as the Phoney War. In April 1940, the
    Reich suddenly invaded Denmark and Norway, with Holland and Belgium and much of
    France falling. Along the way the Wehrmacht routed the British army and nearly
    annihilated it at Dunkirk. Most frightening all of it, the air-raid sirens in
    London—last heard crying until swept in September 1939—when a thousand German
