  md: '# # Major characters


    **Moe Berg** – An exMajor League Baseball catcher turned atomic spy. Berg attended
    Princeton University and spoke (some people claimed) a dozen languages. An enigmatic
    man, he was once called the strangest fellow to ever play professional baseball,
    which is saying something.


    **Samuel Gousmidt** – A Dutch-born American physicist with a cynical sense of
    humor. He peaked too early in his career and spent the rest of his life feeling
    like a scientist-has-been. In addition to hunting down the Nazi atomic bomb, he
    spent his time in Europe searching for his parents, who been swept into an atomic
    camp. In many ways the experienced core of this book.


    **Werner Heisenberg** – One of the most brilliant physicists in history, and one
    of the most maddening. Worked on “uranium machines” for the German atomic bomb
    project, which infuriated many of his dearest friends, including Samuel Gousmidt.
    We was the number one target of the Altos mission.


    **Frédéric Joliot-Curie** – Nobel Prize-winning physicist and the husband of Irène
    Joliot-Curie. Although a daughter of the legendary Marie Curie, a pioneer in nuclear
    science, he bungled several major discoveries in the 1930s. Eventually became
    an underground fighter in Paris during the war.


    **Irène Joliot-Curie** – Nobel Prize-winning physicist and the wife of Frédéric
    Joliot-Curie; also the daughter of the legendary Marie Curie. An outspoken critic
    of the Nazis, although ill health limited her active resistance. Sometimes overshadowed
    by her extroverted husband, but she was every bit his a scientist.


    **Joe Kennedy Jr.** – A navy pilot, and the older brother of future president
    John F. Kennedy. Joe spent most of the war trying to one-up his little brother,
    which led him to volunteer for several ridiculously dangerous missions, including
    one to wipe out a supposed atomic bomb bunker on the northern coast of France.


    **Colonel Boris Pash** – A hard-charging and somewhat reckless soldier who led
    the Altos mission to capture members of the Nazi atomic bomb program. Had Russian
    roots and fought in the White Army against the communists during the Russian Revolution.'
