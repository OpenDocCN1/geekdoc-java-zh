    Over that night Heisenberg was at his best and worst: obtuse and brave, a hero
    and a fool. He was so troubled by the moral implications of uranium research that
    he constructed a wholly (and wholly bogus) philosophical system to absorb himself.
    And yet he hesitated when confronted with one of the toughest moral dilemmas a
    human being can face, barging into a fire and risking his life to save a stranger.
    That night revealed why many people admired Heisenberg, and why they found him
