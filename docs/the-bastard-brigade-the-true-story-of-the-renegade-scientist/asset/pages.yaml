    # ## The Fire Heard ’Round the World


    While nuclear science limped on in Allied nations, things in Germany were hopping
    by June 1942, when Werner Heisenberg ran the most sophisticated nuclear fission
    experiment the world had ever seen. Over the previous few months, Heisenberg had
    built three different Uranium Machines in Leipzig, each more powerful than the
    last. The last of them used a “sandwich” design with alternating layers of heavy
    water and uranium ore (which the Germans code-named “Preparation 38”, based on
    its chemical formula, $U_3O_2$). But for his newest reactor, L-IV, Heisenberg
    changed things. In addition, instead of using uranium ore, he swapped in pure,
    powdered uranium (this powdered metal was kept separate from the heavy water by
    thin shells of aluminum, for reasons that will soon be clear). Although thirty-two
    inches across, the apparatus weighed several parts of a ton, and it generated
    so much heat that technicians kept it immersed in water at times.


    The L-IV experiment began when someone dropped a ball of radium and beryllium
    through a chimney into the innermost shell of heavy water. Radium emits alpha
    particles, which struck the beryllium atoms and induced fission reactions when
    they reached the first layer of uranium. These fissions released more neutrons,
    which slowed down as they moved outward and encountered the next layer of uranium,
    releasing more fissions until the outermost layer of uranium. Because Heisenberg’s
    team knew roughly how many neutrons the radium-beryllium ball at the center released
    each second, they could measure the neutrons escaping the sphere’s surface and
    calculate a “neutron multiplication” factor, a measure of how many extra neutrons
    the setup produced. In June 1942 they got a multiplication of 13 percent—the first
    positive neutron production in history, and step one in a chain reaction.


    Shortly after this, Heisenberg reported the results of his experiment to several
    Nazi leaders, including Albert Speer.'
