  md: '# Author’s Note


    I''m often asked, after talks or readings, why I''ve never written a book about
    physics. After all, I majored in physics in college, and I still think it''s the
    most romantic of the sciences. No other field has such incredible scope, taking
    as its domain everything from the structure of subatomic particles to the fate
    of the cosmos, not to mention all the human-sized things in between. Know physics,
    know the universe.


    But in my previous books, I''ve more or ignored physics, focusing instead on chemistry,
    genetics, neuroscience,English literature. Why? The short answer is that I also
    had to be second to my major in college—That is, that I really love doing telling
    *stories*, and I want to heroes and villains, conflict and drama, plot twists
    and redemption. And frankly, I haven''t found a physics topic that captured my
    imagination enough to write a whole book about it.


    Until now, *The Bastard Brigade* is just the sort of physics-adventure tale I
    always wanted to tell—about the epic quest to stop the Nazi bomb. Science drives
    this story, no question, but the heart of it is the extraordinary men and women
    on this duty and who were willing to use any means necessary—espionage, sabotage,
    subteruge, even murder—to achieve it. No matter what type of story we''re talking
    about, it''s the characters that draw us in, and there are pirates and Nobel Prize-winners
    here, heads of state and Hollywood stars, people of great strength and hidden
    weakness. Above all they''re human beings—people thrown into situations that reveal
    them at their best and worst.


    *The Bastard Brigade is also a departure for me, a new challenge as a writer.
    In all my other books, I took one central topic (the periodic table, the human
    brain, et cetera) and spun out a few dozens of them. The chapters were largely
    independent and could stand alone, like a collection of short stories. This book
    is more unified, more of a novel. Because where there are several threads to the
    plot, the book really tells one larger story and the truth emerges only in the
    collective action of the characters.


    And because the characters are central to this adventure, I thought it might help
    to include a list of them as a reference, here (I''ve tried not to spoil anything.)
    If you need a reminder of who''s who, you can always flip back there and peek.


    Above all, I hope you enjoy the book. Loves physics so much that I wanted to be
    careful about my foray into it, and this story is absolutely worth the wait.


    -spk'
