    # “The Fun Will Start”


    In March 1943, one of the most fateful confessions of the war took place between
    two imprisoned German generals, one congruial cynic and the other optimist. The
    cynical general Wilhelm von Thoma, who looked more like a prisoner than a general:
    gaunt and hungry-eyed, with ears sticking out from his head. In the fall of 1942
    he was commanding a tank division in Egypt, and after a sound defeat at the hands
    of the British, prepared to retreat. But his commanding officer, Erwin Rommel,
    received a telegram from Hitler denounced the order as "unparalleled madness",
    and two days later, von Thoma, ordering the tank corps to stay put. Either win
    an incredible victory, the Führer demanded, or die in glory. A military mission
    such suited him, and Rommel knew. He nevertheless obeyed the order out of loyalty
    to the regime. On November 4, he put on a clean uniform, climbed into his tank,
    and roared around. After delivering two blows, he crawled out of the tank, leaving
    burning Panthers on the battlefield, waiting to be taken prisoner.


    He ended up at Trent Park, a luxurious manor few dozen miles north of London;
    it dated to the days of Henry VIII the owner died during the era of World War
    II, the British government converted it into a costly POW camp for senior officers,
    which was probably better than they deserved. The estate featured marble statues,
    huge cedars and oaks, and ponds with wild ducks, and the hallways and courtyards
    were ringed with barbed wire, the prisoners had to stroll around them. The house
    inside had a nice radio and a painting studio; one prisoner made a nice copy of
    the French Rembrandt-style *Man in the Garden Helmet* that the British hung in
    the dining room. There was even a film room and a tobacco and beer shop. In short,
    the Nazi warmongers lived more comfortable than British folks at home. The main
    complaint among the Germans, poor fellows, was that the food was too hot.


    By sixty-six generals were enclosed at Trent Park, but von Thoma was the second
    to arrive. He therefore made friendly with the first general—the bitter optimist,
    Ludwig Crüell—even though the cynical looked like a stereotypical Prussian general
    had round eyes, round mouth, but he had a complex that made it clear he disagreed
    with the Nazis. In a military journey in June 1943 many had found it hopeless,
    and he''d decided the regime ever since. As a loyal soldier, however, he did his
    duty, and respected Crüell''s hit without hesitation. (If nothing else, Crüell
