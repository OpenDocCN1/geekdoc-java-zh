  md: '# About the Author


    **Sam Kean** is the New York Times bestselling author of Caesar''s Last Breath,
    The Tale of the Dueling Neurosurgeons, The Disappearing Spoon, and The Violinist''s
    Thumb. Caesar''s Last Breath was named The Guardian''s top science book of 2017.
    The Disappearing Spoon was a runner-up for the Royal Society of London''s book
    of the year for 2010, and The Violinist''s Thumb and The Tale of the Dueling Neurosurgeons
    were nominated for the PEN/E. O. Wilson Literary Science Writing Award in 2013
    and 2015, as well as the AAAS/Subaru SB&F prize. Kean edited the 2018 edition
    of The Best American Nature and Science Writing, and his work has appeared in
    The New Yorker, The Atlantic, the New York Times Magazine, Psychology Today, Slate,
    Mental Floss, and other publications. He has also been featured on NPR''s Radiolab,
    All Things Considered, Science Friday, and Fresh Air.'
