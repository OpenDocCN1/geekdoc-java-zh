  md: 'As he older, Goudsmith increasingly took refuge in friendships. Whenever he
    could, he attended the Alos reunions that took every few autumns in Washington,
    D.C. The old troops would attend a boozy party Friday night, then hit the links
    Saturday for a golf scramble; the winner coveted the Pac Cup. Goudsmith also grew
    close to Moe Berg, whom he considered one of the few "real friends" he ever had,
    "someone with whom you could discuss, no matter how powerful." One matter they
    discussed was Goudsmith''s wife. After years of disenchantment—fueled by her refusal
    to write letters during the war, no matter how much he begged—Goudsmith decided
    to divorce her. They were already living in an apart, and he established part-time
    residency in Nevada to avoid the problem. She resisted, however, and when it came
    time to serve her papers, she refused to reveal her address. All Goudsmith knew
    was that she lived on Cape and that he sent a monthly check to a bank in Boston.
    So Berg paid him $100 to do off his old spy tricks and track her down. Berg lived
    with a Cape Cod woman until he ran of time.


    But as Berg did everyone, eventually Goudsmith lost all of his hope and stopped
    answering his letters. No one knew why, Goudsmith least of all. He began desperate
    messages to Berg''s brother and other acquaintances, for news. After Berg learned
    newspaper puzzles, Goudsmith also crafted a cryptogram and sold it to the New
    York Herald; when solved, it read "Moe Berg, where are you?" Berg never responded,
    and the breach left Goudsmith despond. He''d almost lost the friendship of Werner
    Heisenberg to the war. Now Moe Berg had slipped away, too.


    ![](img/c2e395217ef2776da1ce625da7206a60_203_0.png)


    It wasn''t just the friendships that the war warped. Goudsmith believed that physics
    itself had changed, and not for the better. Before the war physics were nobodies—beningly
    neglected savants putting about the lab, basically ignorant of the larger world.
    After the war—in large part because of atomic bombs—physics was too important
    to leave the physicists. Generals and politicians got involved, and budgets ballooned
    to millions of dollars. Gone were the days of "string and tape" physics when experiments
    were cheap and easy, and two bored graduate students could stumble into a fundamental
    discovery like quantum spin.


    A colleague of Goudsmith''s once said "Sam never ever recover the light touch
    that he had before the war," and you could say that of everyone wrapped in atomic
    espionage—the Eliot-Juliet, Werner Heisenberg, Moe Berg, the Kennedys. Fission
    was one of the seminal discoveries of twentieth-century physics, but it proved
    as much a social phenomenon as a scientific one. In their desperation to keep
    the Bomb away from a madman, Allied scientists inaugurated a new kind of madness:
    the madness of heavy-water raids and geological commandos, of assassinations and
    radioactive toothpaste—not to Hiroshima and Nagasaki. At every step, the men and
    women involved believed they were doing the right thing. But in splitting the
    atom, they''d driven the world.'
