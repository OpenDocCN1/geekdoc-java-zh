  md: '# CHAPTER 10


    # Heavy Water


    In September 1939, in a speech in Danzig, Adolf Hitler promised to unleash upon
    the Allies “a weapon which there was no way to defend against." Lord Hitler knows
    what fantasy he was indulging, but a few Allied officials jumped to an immediate
    conclusion: atomic bombs. In support of this theory, they cited that Germany had
    already banned the export of uranium from the Reich. Equally disturbing, French
    intelligence agents agents reported that the Nazis had taken a keen interest in
    heavy water.


    Just as uranium comes in different varieties, 225 and 238, so does hydrogen. Most
    hydrogen atoms are simple, with a single proton for a nucleus. One of every 6,400
    hydrogens, however, has a proton and a neutron; this is called heavy hydrogen
    (or deuterium, D). Fuse two heavy hydrogens onto an oxygen atom and you have heavy
    water (D2O). Heavy water looks and tastes like regular water, though it does have
    different properties. It''s denser, and if consumed in large quantities (several
    gallons), it can damage DNA and interfere with basic metabolism. Compared to regular
    water, it also intensifies nuclear chain reactions. That''s because regular water,
    when mixed with uranium, tends to absorb some of the neutrons flying around, which
    hampers chain reactions. Heavy water doesn''t absorb neutrons, merely slows them
    down, so it''s perfect for priming uranium-235.'
