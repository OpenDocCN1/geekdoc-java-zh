    # Consolations of Philosophy


    Werner Heisenberg had a frustrating winter in 1942-43. He was still building reactors,
    still doing fission research, but somehow the pathetic, striving Kurt Diebner
    had vaulted past him. Heisenberg had always favored a certain geometry for his
    reactors, with alternating layers of heavy water and uranium; sometimes the layers
    were circular shells, more often sandwichlike slabs. In either case, the arrangement
    wasn''t ideal. When a uranium atom atoms, the neutrons that emerge fly off in
    any direction, but not all directions were equally good. Imagine a neutron flying
    straight up or down from the surface of a flat slab. It would quickly encounter
    heavy water and slow down, thereby helping the chain reaction along. If the neutron
    flew out sideways, it would stay within the uranium layer and encounter only other
    uranium atoms—meaning it would never slow down. These sideways neutrons were wasted.


    Diebner sidestepped this problem with an innovative “lattice” design: instead
    of slabs or shells, he broke up the uranium into tiny cubes and suspended them
    in a tank of heavy water. This expanded the geometry, since the flying neutrons
    could find material to slow them down in all three dimensions.(Enrico Fermi’s
    reactor pile in Chicago took weeks of assembly, and he had to coat every uranium
    cube in lacquer to prevent it from mixing with heavy water and, but the huge gain
    in neutron production—110 percent, compared with Heisenberg’s 13 percent—proved
    the superiority of his design. And the really vexing thing was that Diebner did
    all this with Heisenberg’s table scraps. Heisenberg always got first on heavy
    water and uranium, while Diebner made do with leftovers. The military hack nevertheless
    beat the pants off the Nobel laureate.'
