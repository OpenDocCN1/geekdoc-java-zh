  md: '# Acknowledgments


    This book was a departure for me, requiring much more archival and historical
    research than anything I''ve ever done. It was an intimidating world to jump into,
    and I never could have pulled it off without the support of several people.


    First, a big thanks to all the archivists and librarians across the country who
    put up with my ill-formed questions and vague inquiries into obscure topics. The
    most helpful bunch I could have hoped for. I am especially grateful to the staffs
    of the American Physical Society, Princeton University Library, the Hoover Institute,
    the Library of Congress, and the John F. Kennedy Presidential Library.


    As always, I owe more than can to friends and family. My mom and dad, Jean and
    Gene [sic], have always supported me as a writer and kept me in good spirits.
    My brother has become a great friend as well, and I owe them and Nicole much for
    their support. My sister has been a constant source of fun and love throughout
    the years; I look forward to revisiting Ken''s Corner soon. I hope that my books
    can give as much delight to my niece Penny and my nephew Harry they''ve given
    me. And to my friends in Washington and South Dakota and across the world—some
    of whom I''ve known for decades now—you''ve made my first forty years wonderful.
    I look forward to forty more.


    This is my fifth book with Rick Broadhead, who''s continued to be a wise and vigilant
    agent. And it''s my first of hopefully many more books with dear Bill Marino,
    who guided the manuscript with a deft touch. Kevin Cannon delivered, on short
    notice, the illustrations that punch up the text. I also want to thank everyone
    else in and around Little, Brown who worked with me on this book and others, including
    Anna Goodlett, Chris Jerome, and Michael Noon.


    A few words on a page aren''t enough to express my gratitude, and if I''ve left
    anyone off this list, I remain thankful, if embarrassed—'
