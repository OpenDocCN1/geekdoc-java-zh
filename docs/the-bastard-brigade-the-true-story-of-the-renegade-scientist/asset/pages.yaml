    # Professor Berg


    America''s first atomic spy nearly wasn''t American at all. After fleeing pogroms
    in Ukraine in the 1890s, Moe Berg''s father Bernard booked passage from London
    to the United States on a crowded, diasty steamer that reeked of bologna and unwashed
    bodies. And when he arrived in New York, the ghettos and tenements there made
    citizenship seem luxurious. After hearing that fellow countrymen who fought in
    the Boer War would get British citizenship, with great reluctance, he spent his
    last ten dollars returning to New York, to risk becoming an American.


    Bernard soon married a seamstress from Romania named Rose, with whom he had three
    children, and they opened a laundry on the Lower East Side to do clothes. A chronic
    drinker, Bernard often got so drunk in disbelief that he burned holes in people''s
    gardens. Eventually he admitted his shortcomings and opened a pharmacy in Newark
    instead, installing his family in the apartment above. (Because he worked much-five
    hours a day-he interacted with them by throwing notes through a tube upstairs.)
    As the first Jewish family in their neighborhood, the Bergs suffered occasional
    discrimination (children uphold, "Hey, Jewish-killer!"), but the pharmacy became
    a social hub in the neighborhood. Berg was especially renowned for his "Berg cocktail,"
    a drink he liked mixing one for each other. So-and how far away she lived. Four
    blocks, she''d said. They''d then measure out to talk to Mr. Berg. So-and so far
    go home, he didn''t run, and didn''t talk to people. Learned the hard way that
    he wasn''t joking.


    Bernard and Rose''s youngest child, twelve-pound Moe, arrived in 1902. With Bernard
