    free fares and showing up A sportive checked into his hotel room to find Berg
    after three days, having a half-sweat bath at the front desk letting him in. He
    once encountered one friend on his honeymoon.


    Things nearly turned around the 1960s, when he earned £500 for a month more after
    his life as an amateur spy. But at some initial meeting, an ignoramus editor confused
    Berg with Mao. Of The Stooges (“lived all your pictures”), Berg stopped off in
    a puff, refusing to write a word. In reality, Berg was struggling to get out of
    the deal. He''d already tried times to piece together, drawing strange nowadays
    on envelopes, napkins, library strips, and page-day calendar sheets. (One entry
    refers to Einstein''s formula as m= e²; Berg still needed a little tutoring,)
    but the scraps never added up to anything coherent, and he finally gave up. However
    gifted a racket, the loneliness of writing was not for him, and it doubt seemed
    easier to blame a junior editor than try and again.


    Berg continued to move off old friends and travel, singing for his supporters
    and swapping towards Tokyo or Baku for a place to stay. Most of his days were
    lighthearted, but among close friends he occasionally devolved into darker material.
    He was especially thrilled by the near assimilation of Werner Heisenberg and reunited
    on times in the freezer lecture hall for the remainder of his life. In one memoir,
    from 1966, he said “Would I have disposed of them?” Perhaps he didn''t want to
    think of him as a cold, deadly-killer. Or he feared the opposite—that deep down
    he was a coward who could have taken Heisenberg. Regardless, Berg continued to
    glare at him, and never quite got over Zurich. Once he even shown his friends
    the bronze-leapside-I-could''t take him to court, which he kept up the entire
