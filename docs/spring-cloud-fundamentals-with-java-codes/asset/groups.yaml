- md: "\n- Extra hop\n- Various balancing algorithms support\n- Occurs outside of\
    \ the request process\n- Centralized or distributed\n- Client-side\n  - Client\
    \ distributes request\n  - Software based\n  - No extra hops\n- Various balancing\
    \ algorithms support\n- Occurs within the request process\n- Typically distributed\n\
    \nWith server-side load balancing, the server obviously distributes the request,\
    \ and with client-side load balancing, the client obviously distributes the request.\
    \ Server-side load balancing is typically hardware based, but it can also be software\
    \ based. Client-side load balancing, on the other hand, is software based. You\
    \ incur an extra hop with server-side load balancing since the request doesn't\
    \ go directly to the service and has to go through an intermediary first. Whereas\
    \ with client-side load balancing, you don't incur any extra hops once you know\
    \ the location of the services. Both server-side and client-side load balancing\
    \ have support for various load balancing algorithms. With server-side load balancing,\
    \ the actual load balancing happens outside of the request process, whereas with\
    \ client-side load balancing, the actual load balancing happens within the request\
    \ process. And lastly, server-side load balancing can be either centralized or\
    \ distributed, whereas client-side load balancing is typically distributed. Given\
    \ all of these differences, it's clear that client-side load balancing is a natural\
    \ fit for cloud-native architectures.\n\n## Getting Started with Spring Cloud\
    \ and Netflix Ribbon\n\nWe've set the stage for client-side load balancing. Now\
    \ let's talk about how to actually implement it with Spring Cloud. As I mentioned\
    \ in the introduction to this module, we'll use a library called Netflix Ribbon\
    \ to implement client-side load balancing. And Netflix Ribbon is an Inter Process\
    \ Communication library that has built-in software load balancers. Spring Cloud\
    \ adds full integration with Netflix Ribbon to Spring's RestTemplate class. And\
    \ we'll get into detail about what this exactly means, but in essence our RestTemplate\
    \ will now understand how to handle requests across multiple instances of cloud\
    \ also adds features that make it really easy to declare different types of load\
    \ balancing algorithms and availability checks. Next, let's talk about how to\
    \ use Spring Cloud and Netflix Ribbon. And before we get started,, just a quick\
    \ note. In each of these sections I'll explain all of the steps necessary to kind\
    \ of get going, and then at the end we'll walk through a demo where you can follow\
    \ along. Using Netflix Ribbon with Spring Cloud is extremely easy, just like all\
    \ of the other Spring Cloud projects.\n\nUsing SpringCloud &Netflix Ribbon pom.xml\n\
    \n```xml\n<dependencyManagement>\n  <dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-dependencies</artifactId>\n    <version>Camden.SR2</version>\n\
    \    <type>pom</type>\n    <scope>import</scope>\n  </dependency>\n</dependencyManagement>\n\
    ```\n\nIn your dependencyManagement section of your pom.xml, define a new dependency\
    \ on spring-cloud-dependencies.\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-ribbon</artifactId>\n</dependency>\n```\n\n\
    And make sure that it's of type pom and has a scope of import. Still within your\
    \ pom.xml, in the dependency section, define a new dependency on spring-cloud-starter-ribbon.\
    \ Spring Cloud’s Netflix Ribbon support adds two new annotations.\n\n- Two New\
    \ Annotations\n  - @LoadBalanced : Marks a RestTemplate to support load balancing\n\
    \  - @RibbonClient : Used for custom configuration and when Service Discovery\
    \ is absent\n\nThe first one is the @LoadBalanced annotation, and this annotation\
    \ is used when you're creating a RestTemplate. And it's used to mark that that\
    \ RestTemplate should be a load balanced RestTemplate as opposed to just a standard\
    \ RestTemplate. The second annotation is the @RibbonClient annotation, and this\
    \ annotation is mainly for configuration purposes. You would use it to configure\
    \ a custom Ribbon client, as well as when you're not using service discovery to\
    \ set up an actual Ribbon client. Let’s look at how to use the @LoadBalanced annotation\
    \ first.\n\n## Using the @LoadBalanced Annotation\n\nIt's really easy to get started\
    \ and create a load balanced RestTemplate.\n\n```java\nCreating a Load Balanced\
    \ RestTemplate\n@Configuration\npublic class MyConfiguration{\n    @Bean\n   \
    \ @LoadBalanced\n    public RestTemplate restTemplate(){\n        return new RestTemplate();\n\
    \    }\n}\n```\n\nIn your @Configuration class, you define a new method with @Bean\
    \ that returns a RestTemplate. Then you annotate that with @LoadBalanced. And\
    \ what this does is it tells Spring that the RestTemplate should be a load balanced\
    \ RestTemplate as opposed to just a standard RestTemplate. With server-side load\
    \ balancing, the actual load balancing happens outside of the request process,\
    \ whereas with client-side load balancing, the actual load balancing happens within\
    \ the request process. Both server-side and client-side load balancing have support\
    \ for various load balancing algorithms. With server-side load balancing, the\
    \ actual load balancing happens outside of the request process, whereas with client-side\
    \ load balancing, the actual load balancing happens within the request process.\
    \ And lastly, server-side load balancing can be either centralized or distributed,\
    \ whereas client-side load balancing is typically distributed. Given all of these\
    \ differences, it's clear that client-side load balancing is a natural fit for\
    \ cloud-native architectures.\n\n## Using a Load Balanced RestTemplate with Service\
    \ Discovery\n\nSuppose you have a service running on port 9000 at mycompany.com.\
    \ And you have multiple instances of the service. Next, let's look at how you\
    \ would use the @LoadBalanced annotation to resolve the my-service. And by default,\
    \ it'll use a round-robin algorithm to distribute load between them.\n\n## Demo:\
    \ Load Balancing with Ribbon with Discovery\n\nIn this demo, we'll set up a Ribbon\
    \ client that utilizes service discovery and balances requests between multiple\
    \ instances of a service. Since you've been following along in the previous modules\
    \ of the course, you should already have the discovery server set up. Once you're\
