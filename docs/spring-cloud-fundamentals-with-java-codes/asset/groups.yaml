    \ pages (168-169) contain repetitive definitions of the circuit breaker. I will\
    \ provide the clean version of the logical flow.\n\n## Fault Tolerance with Netflix\
    \ Hystrix and Spring Cloud\n\nSpring Cloud implements fault tolerance with the\
    \ help of a library from Netflix called Hystrix. Hystrix is a latency and fault-tolerance\
    \ library, and it was designed to stop cascading failures and enable resiliency\
    \ in distributed systems.\n\n- Implements the circuit breaker pattern\n- Wraps\
    \ calls and watches for failures\n  - 10 sec rolling window\n  - 20 request volume\n\
    \  - >= 50% error rate\n- Waits & tries a single request after 5 sec\n- Fallbacks\n\
    - Protects services from being overloaded\n  - Thread pools, semaphores, & cascading\
    \ failures\n\nIt's a concrete implementation of the Circuitaker pattern, and it\
    \ allows you to easily wrap calls and automatically watches them for failures\
    \ that meet a certain volume and air-percentage threshold within a given window.\
    \ The default for the rolling window is 10 seconds, and the request volume must\
