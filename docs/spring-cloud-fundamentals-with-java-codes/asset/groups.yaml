- md: "\n# Generate a Maven Project with Java and Spring Boot 2.1.0\n\n## Project\
    \ Metadata\nArtifact coordinates\n- Group: io.ajay.kumar\n- Artifact: client\n\
    \n## Dependencies\nAdd Spring Boot Starters and dependencies to your application\n\
    \nSearch for dependencies\nWeb, Security, JPA, Actuator, Devtools...\n\nSelected\
    \ Dependencies\n- Eureka Server\n- DevTools\n- Actuator\n- Eureka Discovery\n\n\
    Generate Project (alt +)\n\nClick Generate Project. That'll automatically create\
    \ and download a zip file. Go ahead and unzip that file, and we'll import that\
    \ into our IDE. Within Spring Tool Suite in the Package Explorer area, right-click\
    \ in the empty area, go to Import, choose Existing Maven Projects, browse to the\
    \ location of your unzipped file, ensure that the pom.xml shows up under the Projects\
    \ heading, and click Finish to import.\n\nExpand the client project, and go to\
    \ src/main/java, and open up the main application class and do the following changes.\n\
    \n```java\npackage io.ajay.kumar.client;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.web.client.RestTemplateBuilder;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.http.HttpMethod;\nimport org.springframework.http.ResponseEntity;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    import org.springframework.web.client.RestTemplate;\nimport com.netflix.appinfo.InstanceInfo;\n\
    import com.netflix.discovery.EurekaClient;\n```\n\n```java\n@EnableDiscoveryClient\n\
    @SpringBootApplication\n@RestController\npublic class ClientApplication {\n  \
    \  @Autowired\n    private EurekaClient client;\n\n    @Autowired\n    private\
    \ RestTemplateBuilder restTemplateBuilder;\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(ClientApplication.class, args);\n   \
    \ }\n}\n```\n\nIn the main application, add a new annotation, @EnableDiscoveryClient.\
    \ We'll also add a @RestController annotation, and we'll add a handler method,\
    \ `public String callService`. And we'll give this an @RequestMapping, and we\
    \ will map this to this root. We'll want to autowire in our DiscoveryClient or\
    \ our EurekaClient. We'll use the EurekaClient, `private EurekaClient client`.\
    \ We'll call it @Autowired. You can also use @Inject. And we'll also need a RestTemplate\
    \ so we can actually call the service, so we'll say `private RestTemplateBuilder\
    \ restTemplateBuilder`, and we'll call this restTemplateBuilder. We will autowire\
    \ that as well. \n\nWithin our callService method, we will create a new RestTemplate\
    \ using the RestTemplateBuilder, so `RestTemplate rest = restTemplateBuilder.build();`.\
    \ And then we're going to use the client to fetch our service URLs, so `client.getNextServerFromEureka(...)`.\
    \ And the virtualHostname, remember we called the spring.application.name of our\
    \ service—we just called it \"service\". And it's going to be a non-secure request,\
    \ so put false. And this returns an InstanceInfo, which we'll call `instanceInfo`.\
    \ \n\nAnd then we get the base URL and call the RestTemplate, `String baseURL\
    \ = instanceInfo.getHomePageUrl();`. And then we'll use the RestTemplate to call\
    \ the service. So the RestTemplate returns ResponseEntity of String. We'll call\
    \ that response, and we'll say `RestTemplate.exchange(...)`. And we'll pass it\
    \ to the baseURL and HttpMethod GET. We don't have any request bodies, so we'll\
    \ do the requestEntity null, so restType as String, and we don't have any uriVariables\
    \ either, so we'll get rid of that parameter. \n\nAnd let's just go over this\
    \ before we finish up here. So the EurekaClient is calling out to the Discovery\
    \ Server, and it's getting information about a service ID called \"service\",\
    \ and it's returning back to us as an instanceInfo. And then from that instanceInfo,\
    \ we're getting the HomePageUrl, which is the base URL of our service, then we're\
    \ using our RestTemplate to call that service, specifically a GET on the service,\
    \ and it returns a string back to us. And then we're just going to return that\
    \ response, so `response.getBody()`.\n\n```properties\napplication.properties\
    \ :\nspring.application.name=client\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    eureka.client.register-with-eureka=false\n```\n\nNext, we need to configure our\
    \ application client. So head over to src/main/resources and open up the application.properties,\
    \ and we'll add the standard spring.application.name. We'll call this client.\
    \ And then we're going to paste in the service URL so we don't have to type it,\
    \ and then we're going to do eureka.client.register-with-eureka. We're going to\
    \ set that to false. Remember, we're a client, and we don't need to register with\
    \ Eureka because we don't need anybody to discover us.\n\nNow, before we start\
    \ our application client, we need to start the Discovery Server and each of the\
    \ application service instances, and in that particular order. So, if you've been\
    \ following along, those should be in your run history. So you can come up to\
    \ the drop-down and choose each of those to start those up. And just to confirm,\
    \ we'll check the drop-down, and we can see that we have the discovery-server\
    \ running, instance 1 of the service application, and instance 2. \n\nSo now we're\
    \ ready to start our client application. We can right-click on the main application\
    \ class, go to Run As, and choose Spring Boot App. Fire up a web browser and visit\
    \ localhost:8080. Hit Enter, and you should see a response from the client. And\
    \ it'll say \"Hello from instance 1\". And if you refresh it, it'll say \"Hello\
    \ from instance 2\". And we can continue to do over and over, and each time we\
    \ can see that it's getting a different instance from the Eureka registry.\n\n\
    # Spring Cloud Eureka Dashboard\n\nOne of the really useful things that the Spring\
    \ Cloud Eureka Server provides is a dashboard. It is enabled by default, and it's\
    \ a web-based dashboard. And it displays a bunch of useful information, like whether\
    \ or not a service is up or down and how many instances of it are registered.\
    \ If you still have the demo running from our last demo, fire up a browser and\
    \ visit localhost:8761. You'll be presented with this Spring Eureka Dashboard,\
    \ and let's go through each of these sections here.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_42_0.png)\n\
    \n# Instances currently registered with Eureka\n\n| Application | AMIs | Status\
    \ |\n| --- | --- | --- |\n| SERVICE | n/a (2) | UP (2) - DESKTOP-OIHU6JB:service:8082,\
    \ DESKTOP-OIHU6JB:service:8081 |\n\n# General Info\n\n| Name | Value |\n| ---\
    \ | --- |\n| total-avail-memory | 329mb |\n| environment | test |\n| num-of-cpus\
    \ | 4 |\n| current-memory-usage | 250mb (75%) |\n| server-uptime | 4 days 04:04\
    \ |\n| registered-replicas | http://localhost:8761/eureka/ |\n| unavailable-replicas\
    \ | http://localhost:8761/eureka/ |\n| available-replicas | |\n\n# Instance Info\n\
    \n| Name | Value |\n| --- | --- |\n| ipAddr | 192.168.29.2 |\n| status | UP |\n\
    \nSo first we have the System Status, and it tells you things like the current\
    \ time, and how many renewals have happened in the last minute. The DS Replicas,\
    \ or the Discovery Server Replica section, shows you the peer instances of Eureka\
    \ Servers. If we had more than one instance, we would see each of those instances\
    \ listed here. But since we've only got one instance, we just see localhost. The\
    \ next section is probably the most useful section as it shows you what instances\
    \ are currently registered with Eureka. And we have here the service ID under\
    \ the Application heading, which is SERVICE. AMI is for Amazon Machine Image.\
    \ We're not running in Amazon, so that's n/a. And Availability Zones, there are\
    \ two, and both of those instances are UP. You can see the 2 next to UP, which\
    \ indicates that there are two instances of this particular service, and both\
    \ of them are UP. And right next to that you can see both of those instances,\
    \ of them running on 8082 and one of them running on 8081.\n"
  mdcn: "\n\n# 使用 Java 和 Spring Boot 2.1.0 生成 Maven 项目\n\n## 项目元数据\nArtifact 坐标\n\
    - Group: io.ajay.kumar\n- Artifact: client\n\n## 依赖\n为你的应用程序添加 Spring Boot Starters\
    \ 和依赖\n\n搜索依赖\nWeb, Security, JPA, Actuator, Devtools...\n\n已选择的依赖\n- Eureka Server\n\
    - DevTools\n- Actuator\n- Eureka Discovery\n\n生成项目 (alt +)\n\n点击 Generate Project。这会自动创建并下载一个\
    \ zip 文件。现在去解压该文件，我们将将其导入 IDE 中。在 Spring Tool Suite 的 Package Explorer（包管理器）区域，在空白处右键点击，选择\
    \ Import，然后选择 Existing Maven Projects，浏览到解压文件的位置，确保 Projects 标题下显示出 pom.xml，然后点击\
    \ Finish 完成导入。\n\n展开 client 项目，转到 src/main/java，打开主应用程序类并进行以下更改。\n\n```java\n\
    package io.ajay.kumar.client;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.web.client.RestTemplateBuilder;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.http.HttpMethod;\nimport org.springframework.http.ResponseEntity;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    import org.springframework.web.client.RestTemplate;\nimport com.netflix.appinfo.InstanceInfo;\n\
    import com.netflix.discovery.EurekaClient;\n```\n\n```java\n@EnableDiscoveryClient\n\
    @SpringBootApplication\n@RestController\npublic class ClientApplication {\n  \
    \  @Autowired\n    private EurekaClient client;\n\n    @Autowired\n    private\
    \ RestTemplateBuilder restTemplateBuilder;\n\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(ClientApplication.class, args);\n   \
    \ }\n}\n```\n\n在主应用程序中，添加新注解 @EnableDiscoveryClient。我们还会添加一个 @RestController 注解，并添加一个处理方法\
    \ `public String callService`。我们将给它添加一个 @RequestMapping，并将其映射到根路径。我们需要自动注入 DiscoveryClient\
    \ 或 EurekaClient。我们将使用 EurekaClient，`private EurekaClient client`。我们使用 @Autowired\
    \ 调用它。你也可以使用 @Inject。我们还需要一个 RestTemplate 来实际调用服务，所以我们会写 `private RestTemplateBuilder\
    \ restTemplateBuilder`，并调用这个 restTemplateBuilder。我们也会对其进行自动注入。\n\n在我们的 callService\
    \ 方法中，我们将使用 RestTemplateBuilder 创建一个新的 RestTemplate，即 `RestTemplate rest = restTemplateBuilder.build();`。然后我们将使用\
    \ client 获取服务的 URL，即 `client.getNextServerFromEureka(...)`。关于虚拟主机名，请记得我们为服务设置了\
    \ spring.application.name——我们直接将其命名为 \"service\"。这将是一个非安全请求，所以填入 false。这返回一个 InstanceInfo\
    \ 对象，我们将其命名为 `instanceInfo`。\n\n然后我们获取基础 URL 并调用 RestTemplate，`String baseURL\
    \ = instanceInfo.getHomePageUrl();`。接着我们使用 RestTemplate 调用该服务。RestTemplate 返回\
    \ ResponseEntity 的 String。我们将调用该响应，并使用 `RestTemplate.exchange(...)`。我们将传入 baseURL\
    \ 和 HttpMethod GET。由于我们没有请求体，所以将 requestEntity 设置为 null，restType 为 String，我们也没有任何\
    \ uri 变量，因此删掉该参数。\n\n在我们完成之前，让我们再回顾一遍。EurekaClient 正在调用发现服务器（Discovery Server），获取名为\
    \ \"service\" 的服务 ID 信息，并以 instanceInfo 的形式返回给我们。然后从该 instanceInfo 中，我们获取 HomePageUrl，即我们服务的基础\
    \ URL，然后我们使用 RestTemplate 调用该服务，具体是对该服务执行 GET 请求，它向我们返回一个字符串。最后我们只需返回该响应，即 `response.getBody()`。\n\
    \n```properties\napplication.properties :\nspring.application.name=client\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    eureka.client.register-with-eureka=false\n```\n\n接下来，我们需要配置应用程序客户端。转到 src/main/resources\
    \ 并打开 application.properties，我们将添加标准的 spring.application.name。我们将其命名为 client。然后我们将粘贴服务\
    \ URL 以免手动输入，接着进行 eureka.client.register-with-eureka。我们将将其设置为 false。记住，我们是一个客户端，不需要向\
    \ Eureka 注册，因为我们不需要任何人发现我们。\n\n现在，在启动应用程序客户端之前，我们需要启动发现服务器以及每个应用程序服务实例，并且要按照特定的顺序进行。如果你一直在跟着操作，这些项目应该出现在你的运行历史中。你可以点击下拉菜单并选择每一个项目来启动它们。为了确认，我们检查下拉菜单，可以看到\
    \ discovery-server 正在运行，服务应用程序的实例 1 和实例 2 运行。\n\n现在我们准备好启动客户端应用程序了。我们可以右键点击主应用程序类，选择\
    \ Run As，然后选择 Spring Boot App。打开浏览器并访问 localhost:8080。按下回车，你应该能看到来自客户端的响应。它会显示\
