  - "[PAGE 100]\n\n# # Module 5: Mapping Services Using Intelligent Routing\n\n# ##\
    \ What Is Intelligent Routing?\n\nIn this module we'll learn how to map our services\
    \ in the cloud using Intelligent Routing.\n\n+   - Routing in cloud native apps\n\
    - Netflix Zuul\n  - Proxy server\n  - Setting up routes\n  - Setting up filters\n\
    \nWe'll begin by talking about what Intelligent Routing is and what problem it\
    \ solves for us. Then we'll introduce Netflix Zuul as part of the Spring Cloud\
    \ Netflix project. And we'll see how to set up a proxy server, how to configure\
    \ different routes, and how to set up filtering. Remember that in order to be\
    \ as dynamic and scalable as possible, a cloud-native system is made up of individually\
    \ deployable services, which together, as a whole, form an overall system. With\
    \ that comes some challenges though.\n\n# ## Challenges with Individual Services"
  - '[PAGE 101]


    +   > Different ports


    +   > Different addresses


    +   > Different APIs & paths


    Each of the individual services may be running on a different port, a different
    address, or a combination of both. And they''ll also likely have different paths
    and different APIs to interact with. And as a user or a client of the individual
    services, which could easily be in the double or triple digits, would be a nightmare.
    Instead, we can use Intelligent Routing to make our application appear as if it
    were a single system. Similar to how a completed puzzle appears as if it were
    a whole, but it''s made up of several different individual pieces.'
  - '[PAGE 102]


    # Intelligent Routing via a Gateway Service


    Routing is typically implemented via something called a gateway service, or an
    API Gateway. And an API Gateway, or a gateway service, is defined as the single
    point of entry for all clients. So in many ways the gateway service is a lot like
    the front door to to our system. And each of the individual services is located
    behind this door, and all the requests must enter through it.


    A Gateway Service Provides


    +   > Dynamic Routing & Delivery

    > Security & Filtering

    > Auditing & Logging

    > Request Enhancement

    > Load Balancing

    > Different APIs for different clients


    A gateway service not only provides dynamic routing and delivery, which means
    at runtime it can decide where it should route a request and if it should even
    route a request at all, but it also provides an array of other functionalities.
    One of those pieces of functionality is security. It provides the ability to authenticate
    all the incoming requests, as well as filter out sort of illegitimate or bad request.
    And it''s actually a really good candidate for providing auditing and logging
    of requests since all of the requests must enter through the gateway. It also
    provides something called request enhancement, which is just a fancy way of saying
    that it can add additional information to the request, or enrich the request,
    if you will. A'
  - '[PAGE 103]


    concrete example of this is the way Netflix uses their gateway. They use their
    gateway service to do a geolocation lookup for all incoming requests, and they
    add that additional information as an additional request header so that it''s
    available for all downstream services. The gateway service can also act as a load
    balancer for the individual services that are behind it. Another interesting feature
    of the gateway service is the ability to provide different APIs for different
    clients. APIs are not a one-size-fits-all kind of thing, and different clients,
    such as web clients or mobile clients, have different needs in the way they call
    your APIs. So, for instance, it may be okay for a web client to interact with
    several endpoints to accomplish some piece of functionality, but the same may
    not be true for a mobile client, which may be better served with just a single
    endpoint.'
