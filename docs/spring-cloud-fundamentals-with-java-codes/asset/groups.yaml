- md: "\n# Using the @RibbonClient Annotation\n\nNow let's take a look at the other\
    \ annotation, the @RibbonClient annotation. First we'll see how to use this annotation\
    \ along with the @LoadBalanced annotation to achieve client-side load balancing\
    \ without service discovery.\n\n```\n@Configuration\n@RibbonClient(name=\"someservice\"\
    )\npublic class MyConfiguration{\n...\n}\n```\n\nIn your @Configuration class,\
    \ define the @RibbonClient annotation and set the name element to a meaningful\
    \ value. You'll actually refer to this value in the configuration, as well as\
    \ the URL of the RestTemplate.\n\n```properties\napplication.properties\n<ribbon_client_name>.ribbon.eureka.enabled=false\n\
    <ribbon_client_name>.ribbon.listOfServers=http://host:9000,\nhttp://host:9001\n\
    ```\n\n```yaml\napplication.yml\n<ribbon_client_name>:\n  ribbon:\n    eureka:\n\
    \      enabled: false\n    listServers=http://host:9000, http://host:9001\n```\n\
    \n- Replace <ribbon_client_name> with the name field value of @RibbonClient\n\n\
    Then, in your application.properties or your application.yml, define two new properties.\
    \ And remember the name element we set on the @RibbonClient annotation. You'll\
    \ prefix each of your properties with that value. So the first property, the ribbon_client_name.ribbon.eureka.enabled=false,\
    \ tells Ribbon to disable service discovery support. The next property, the ribbon_client_name.ribbon.listOfServers,\
    \ is a comma-separated list of URLs that Ribbon should use to distribute the requests\
    \ among. And in this case, we've set the different URLs to two different addresses,\
    \ one running on port 9000 and the other running on port 9001.\n\nOnce you have\
    \ everything configured, you can use the RestTemplate just like you did with service\
    \ discovery. Except this time instead of calling the service name, you use the\
    \ value of the name element that you set up in the @RibbonClient annotation.\n\
    \n# Demo: Load Balancing Using Ribbon Without Service Discovery\n\nIn this demo,\
    \ we'll learn how to utilize the Ribbon client without service discovery. Now,\
    \ we're going to build on the previous demo that we did utilizing service discovery\
    \ as each of the demos share a lot in common. The first thing we will do expand\
    \ the ribbon-time-service and open up the main application class. In the main\
    \ application class, remove the @EnableDiscoveryClient annotation.\n\n```java\n\
    package org.ajay.kumar.ribbontimeservice;\nimport java.util.Date;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.framework.web.bind.annotation.GetMapping;\nimport org.springframework.framework.web.bind.annotation.RestController;\n\
    \n@RestController\n@SpringBootApplication\npublic class RibbonTimeServiceApplication\
    \ {\n    @Value(\"${server.port}\")\n    private int port;\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(RibbonTimeServiceApplication.class,\
    \ args);\n    }\n\n    @GetMapping\n    public String getTime() {\n        return\
    \ \"The current time is \" + new Date().toString()\n            + \"(answered\
    \ by service running on \"+port+\"+\")\";\n    }\n}\n```\n\nGo ahead and close\
    \ that, and open up the src/main/resources/application.properties, and delete\
    \ the property that sets the location of the Service Discovery Server.\n\n```properties\n\
    application.properties\nspring.application.name=time-service\n```\n\nOnce you've\
    \ got the property deleted, go ahead and close that. And we're now ready to start\
    \ up the ribbon-time-service without service discovery. If you come up to the\
    \ Green Play button and click the little drop-down caret, you'll see that we have\
    \ all of our configurations that we've used in the past. So we'll want to use\
    \ each of these ribbon-time-services to start each of the instances. So we'll\
    \ start ribbon-time-service-1, and then we'll start ribbon-time-service-2. Just\
    \ to make sure that our ribbon-time-service instances started up correctly, let's\
    \ do a quick sanity check. So visit localhost:4444, and it's running there. So\
    \ everything with our ribbon-time-service is good to go. Next, we'll minimize\
    \ the ribbon-time-service project and open up the ribbon-time-app. And once you've\
    \ opened it, navigate to the main application class.\n\n```java\n@RestController\n\
    @RibbonClient(name=\"time-service\")\n@SpringBootApplication\npublic class RibbonTimeAppApplication\
    \ {\n    @Inject\n    private RestTemplate restTemplate;\n    public static void\
    \ main(String[] args) {\n        SpringApplication.run(RibbonTimeAppApplication.class,\
    \ args);\n    }\n    @GetMapping\n    public String getTime() {\n        return\
    \ restTemplate.getEntity(\"http://time-service\",\n        String.class).getBody();\n\
    \    }\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n\
    \        return new RestTemplate();\n    }\n}\n```\n\nAnd just like we did with\
    \ the ribbon-time-service, we'll want to delete this @EnableDiscoveryClient. Now\
    \ we're going to add a new annotation, the @RibbonClient annotation, and we're\
    \ going to set the name element to the time-service. And this is the same time-service\
    \ that we used when we using service discovery, and we'll use it in pretty much\
    \ the same fashion. We'll refer to it in the RestTemplate URL as a logical service\
    \ identifier, and then configure what those particular instances are that represent\
    \ service within configuration. Let's go ahead and close this open up our src/main/resources\
    \ and our application.properties.\n\n```properties\napplication.properties\ntime-service.ribbon.eureka.enabled=false\n\
    time-service.ribbon.listOfServers=http://host:4444, http://host:5555\n```\n\n\
    In our application properties, we'll prefix all of the properties that we're setting\
    \ up to configure our Ribbon client with the name of the Ribbon client. In case,\
    \ we use time-service. So we'll say time-service-ribbon-eureka-enabled=false.\
    \ And this is the property that'll tell Ribbon not to use service discovery. We\
    \ have one more property to set, so we'll say time-service.ribbon.listOfServers.\
    \ And we'll set this to a comma-separated list of location of all the instances\
    \ of our time-service. So we have http://localhost:4444, and then we have that\
    \ one on 5555.\n\nAnd that's all the configuration we need, so we can go ahead\
    \ and close this. And we can go over to our application class, right-click on\
    \ it, go to Run As, and choose Spring Boot App. Next, go ahead and fire up a browser\
    \ and visit localhost:8080.\n\nAnd you can see that we got a response from the\
    \ service running on the port with all 4. And if we refresh that, we'll see that\
    \ we get a response from the one on 5. And we can continue to refresh that and\
    \ see that it round-robins between each of the instances of the time-service.\n\
    \n# Customizing Your RibbonClient Configuration: Introduction\n\nIn this last\
    \ section, we'll learn how to customize an individual Ribbon client using declarative\
    \ configuration. And what this will allow us to do is define custom configuration\
    \ that applies to a specific Ribbon client instead of all Ribbon clients. And\
    \ what that buys us it allows us to define different client-side load balancing\
    \ behavior for different services.\n\n```java\n@Configuration\n@RibbonClient(name=\"\
    otherservice\",\nconfiguration=SystemServiceConfig.class)\npublic class MyConfiguration{\n\
    ...\n}\n```\n\nIn your @Configuration class, define the @RibbonClient annotation\
    \ and set the name element just like we did when we configured the previous Ribbon\
    \ client. This time though, you'll define an additional configuration element,\
    \ and you'll set that to another @Configuration class.\n\n```java\npackage io.anjay.config.kumar;\n\
    //Different package so it is not picked up by @ComponentScan\n@Configuration\n\
    public class OtherServiceConfig {\n}\n```\n\nThis additional @Configuration class\
    \ will contain all of the custom configuration for a specific Ribbon client. And\
    \ that configuration is defined by methods that are annotated with the @Bean annotation.\
    \ So this\n"
  mdcn: "\n\n# 使用 @RibbonClient 注解\n\n现在让我们来看看另一个注解：@RibbonClient 注解。首先，我们将看到如何将此注解与\
    \ @LoadBalanced 注解结合使用，在没有服务发现的情况下实现客户端负载均衡。\n\n```\n@Configuration\n@RibbonClient(name=\"\
    someservice\")\npublic class MyConfiguration{\n...\n}\n```\n\n在你的 @Configuration\
    \ 类中，定义 @RibbonClient 注解并将 `name` 元素设置为一个有意义的值。你实际上会在配置中引用这个值，以及在 RestTemplate\
    \ 的 URL 中引用。\n\n```properties\napplication.properties\n<ribbon_client_name>.ribbon.eureka.enabled=false\n\
    <ribbon_client_name>.ribbon.listOfServers=http://host:9000,\nhttp://host:9001\n\
    ```\n\n```yaml\napplication.yml\n<ribbon_client_name>:\n  ribbon:\n    eureka:\n\
    \      enabled: false\n    listServers=http://host:9000, http://host:9001\n```\n\
    \n-   将 `<ribbon_client_name>` 替换为 @RibbonClient 的 `name` 字段值。\n\n然后，在你的 application.properties\
    \ 或 application.yml 中，定义两个新属性。记住我们在 @RibbonClient 注解上设置的 name 元素。你为每个属性使用该值作为前缀。因此，第一个属性\
    \ `ribbon_client_name.ribbon.eureka.enabled=false` 告诉 Ribbon 禁用服务发现支持。下一个属性 `ribbon_client_name.ribbon.listOfServers`\
    \ 是一个用逗号分隔的 URL 列表，Ribbon 将使用它来分配请求。在这种情况下，我们将不同的 URL 设置为两个不同的地址，一个运行在端口 9000，另一个运行在端口\
    \ 9001。\n\n一旦你完成了所有配置，你就可以像使用服务发现一样使用 RestTemplate。不同的是，这次你不再调用服务名，而是使用你在 @RibbonClient\
    \ 注解中设置的 `name` 元素的值。\n\n# 演示：不使用服务发现使用 Ribbon 进行负载均衡\n\n在这个演示中，我们将学习如何在不使用服务发现的情况下利用\
    \ Ribbon 客户端。现在，我们将在此前使用服务发现的演示基础上构建，因为每个演示之间有很多共同点。我们要做的第一件事是扩展 ribbon-time-service\
    \ 并打开主应用程序类。在主应用程序类中，移除 @EnableDiscoveryClient 注解。\n\n```java\npackage org.ajay.kumar.ribbontimeservice;\n\
    import java.util.Date;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.framework.web.bind.annotation.GetMapping;\nimport org.springframework.framework.web.bind.annotation.RestController;\n\
    \n@RestController\n@SpringBootApplication\npublic class RibbonTimeServiceApplication\
    \ {\n    @Value(\"${server.port}\")\n    private int port;\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(RibbonTimeServiceApplication.class,\
    \ args);\n    }\n\n    @GetMapping\n    public String getTime() {\n        return\
    \ \"The current time is \" + new Date().toString()\n            +\"(answered by\
    \ service running on \"+port+\"\")\";\n    }\n}\n```\n\n继续关闭它，打开 src/main/resources/application.properties，并删除设置服务发现服务器位置的属性。\n\
    \n```properties\napplication.properties\nspring.application.name=time-service\n\
    ```\n\n一旦删除了该属性，请关闭它。现在我们准备好在没有服务发现的情况下启动 ribbon-time-service 了。如果你来到绿色播放按钮并点击小下拉箭头，你会看到我们过去使用过的所有配置。因此，我们希望使用这些\
    \ ribbon-time-services 来启动每个实例。我们将先启动 ribbon-time-service-1，然后启动 ribbon-time-service-2。为了确保我们的\
    \ ribbon-time-service 实例启动正确，让我们进行快速的健康检查。访问 localhost:4444，它在那里运行。所以我们 ribbon-time-service\
    \ 的一切都就绪了。接下来，我们将最小化 ribbon-time-service 项目并打开 ribbon-time-app。一旦打开了它，导航到主应用程序类。\n\
    \n```java\n@RestController\n@RibbonClient(name=\"time-service\")\n@SpringBootApplication\n\
    public class RibbonTimeAppApplication {\n    @Inject\n    private RestTemplate\
    \ restTemplate;\n    public static void main(String[] args) {\n        SpringApplication.run(RibbonTimeAppApplication.class,\
    \ args);\n    }\n    @GetMapping\n    public String getTime() {\n        return\
    \ restTemplate.getEntity(\"http://time-service\",\n        String.class).getBody();\n\
    \    }\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n\
    \        return new RestTemplate();\n    }\n}\n```\n\n就像我们在 ribbon-time-service\
    \ 中做的那样，我们也想要删除这个 @EnableDiscoveryClient。现在我们将添加一个新的注解：@RibbonClient 注解，并将 `name`\
    \ 元素设置为 time-service。这与我们在使用服务发现时使用的同一个 time-service，我们将以几乎相同的方式使用它。我们在 RestTemplate\
    \ URL 中将其作为逻辑服务标识符进行它，然后在配置中配置代表该服务的特定实例。让我们关闭这里，打开 src/main/resources 和 application.properties。\n\
    \n```properties\napplication.properties\ntime-service.ribbon.eureka.enabled=false\n\
    time-service.ribbon.listOfServers=http://host:4444, http://host:5555\n```\n\n\
    在我们的 application properties 中，我们将为所有用于配置 Ribbon 客户端的属性加上 Ribbon 客户端名称的前缀。假设我们使用\
    \ time-service。那么我们就说 time-service-ribbon-eureka-enabled=false。这是告诉 Ribbon 不要使用服务发现的属性。我们还有一个属性要设置，即\
    \ time-service.ribbon.listOfServers。我们将其设置为所有 time-service 实例位置的逗号分隔列表。因此我们有 http://localhost:4444，以及\
    \ 5555 的那一个。\n\n这就是我们需要的全部配置，所以我们可以关闭这里。我们可以回到应用程序类，右键点击它，选择“Run As”，选择“Spring\
    \ Boot App”。接下来，启动浏览器访问 localhost:8080。\n\n你可以看到我们收到了来自端口 4444 服务的响应。如果我们刷新，将收到来自\
