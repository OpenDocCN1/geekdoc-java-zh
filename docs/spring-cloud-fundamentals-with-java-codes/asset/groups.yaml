    \ Eureka 注册表中获取了不同的实例。\n\n# Spring Cloud Eureka Dashboard\n\nSpring Cloud Eureka\
    \ Server 提供的非常有用的功能之一就是仪表板。它是默认启用的，是一个基于 Web 的仪表板。它显示许多有用信息，例如服务是否在线或离线，以及注册了多少个实例。如果你仍在运行上一个演示中的程序，打开浏览器并访问\
    \ localhost:8761。你会看到这个 Spring Eureka Dashboard，让我们逐一查看这里的每个部分。\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_42_0.png)\n\
    \n# 当前注册到 Eureka 的实例\n\n| Application | AMIs | Status |\n| --- | --- | --- |\n\
