    \ `@Bean` 注解。这就是让 `gateway-service` 所需的所有更改，所以让我们关闭它并折叠 `gateway-service`。让我们打开\
    \ `hello-service` 并打开主应用类。\n\n```java\npackage io.ajay.kumar;\nimport org.springframework.boot.SpringApplication;\n\
