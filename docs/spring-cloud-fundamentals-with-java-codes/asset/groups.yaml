    \ Eureka Server 并将其状态更改为 `UP`。现在，你拥有了一个正在运行的服务发现服务器。\n\n# 应用服务\n\n- 提供某些应用程序功能\n\
    - 请求的接收者\n- 其他服务的依赖项\n- 一个或多个实例\n- 发现客户端的使用\n  - 注册 (Register)\n  - 注销 (Deregister)\n\
    \n记住，我们正在深入研究服务发现的每个组件，我们列表中的下一个是应用服务。这是任何提供功能的实体。它是接收请求并返回响应的实体。它是其他服务的依赖项。因此，其他服务依赖于它的功能。你通常运行应用服务的一个或多个实例。应用服务是发现客户端的用户。它将使用它来调用发现服务器并进行注册和注销。就像我们对服务服务器（Service\
    \ Server）做的那样，我们将详细说明向应用服务添加 Eureka Client 所需的步骤，然后我们实际创建一个。\n\n### 在服务中使用 Spring\
    \ Cloud Eureka Client\n\n```xml\n<dependencyManagement>\n  <dependencies>\n  \
    \  <dependency>\n      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\n在你的 Maven\
    \ 项目的 `pom.xml` 中，添加一个新的 `dependencyManagement` ，然后添加一个新的依赖 `spring-cloud-dependencies`。再次确保它的类型为\
    \ `pom` 且作用域为 `import`。\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-eureka</artifactId>\n</dependency>\n```\n\n\
    仍在 `pom.xml` 中，在 `dependencies` 内部添加一个新的依赖，这个依赖叫做 `spring-cloud-starter-eureka`。然后在在你的\
    \ `application.properties` 或 `application.yml` 中，添加新属性。\n\napplication.properties\n\
    ```properties\nspring.application.name=service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n或者\n\napplication.yml\n```yaml\nspring:\n  application:\n    name: service\n\
    eureka:\n  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka\n\
    ```\n\n第一个属性是 `spring.application.name`，再次你可以将其设置为任何你想要的值。在我们的中，我们将使用 `service`。第二个属性告诉应用服务发现服务器的位置，它是\
    \ `eureka.client.defaultZone` 属性。你可以看到我们将其设置为 `localhost`，但在生产环境中，你会将其设置为你的发现服务器所在地。现在我们将更详细地解释该属性。\n\
    \n```java\n@SpringBootApplication\n@EnableDiscoveryClient\npublic class Application\
    \ {\n    public static void main(String[] args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\n然后在你应用服务的主 `Application` 类中添加一个注解。再次，Spring Cloud 的同事们为我们简化了工作，即提供了\
    \ `@EnableDiscoveryClient` 注解。它的作用是让我们的应用服务向发现服务器注册自己，然后其他服务就可以找到它。\n\n# 演示：让应用服务变得可发现\n\
    \n我们将使用 Spring Initializr 来创建我们的应用服务，所以请前往 start.spring.io。在这里的 Group 处你输入 `io.ajay.kumar`，我们将\
    \ Artifact 命名为 `service-name`。你将拥有几乎相同的依赖，但这次你想要的是 Eureka Discovery 依赖而不是 Eureka\
    \ Server 依赖。你可以直接添加 DevTools 和 Actuator。\n\n# 生成一个带有 Java 和 Spring Boot 2.1.0\
    \ 的 Maven 项目\n\n# 项目元数据 Artifact 坐标\nGroup: io.ajay.kumar\nArtifact: service\n\
    \n# 依赖\n向你的应用程序添加 Spring Boot Starters 和依赖\n搜索依赖：Web, Security, JPA, Actuator,\
    \ Devtools...\n\n已选依赖\n- DevTools\n- Actuator\n- Eureka Discovery\n\n生成项目。直接点击\
    \ Generate Project。它会自动为你创建并下载一个 zip 包。解压该 zip 包，我们将将其导入到 IDE 中。我们现在回到了 Spring\
    \ Tool Suite。在 Package Explorer 选项卡中，右键点击并选择 Import。再次，我们选择 Existing Maven Projects。点击\
    \ Next，浏览到我们解压文件的位置，并点击 Open。你应该在 Projects 标题下看到 `pom.xml`，点击 Finish 完成导入。这需要几秒钟，完成后，展开\
    \ `service` 并进入 `src/main/java` 打开主应用程序类。\n\n```java\npackage io.ajay.kumar.service;\n\
    import org.springframework.beans.factory.annotation.Value;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    ```\n\n```java\n@EnableDiscoveryClient\n@SpringBootApplication\n@RestController\n\
    public class ServiceApplication {\n    @Value(\"${service.instance.name}\")\n\
    \    private String instance;\n\n    public static void main(String[] args) {\n\
    \        SpringApplication.run(ServiceApplication.class, args);\n    }\n\n   \
    \ @RequestMapping(\"/\")\n    public String message() {\n        return \"Hello\
    \ from \" + instance;\n    }\n}\n```\n\n在我们的应用服务的主类 `ServiceApplication` 中，我们添加\
    \ `@EnableDiscoveryClient` 注解。这让让我们的应用服务变成发现服务器的客户端，并导致它在启动时向发现服务器注册。在 `@SpringBootApplication`\
    \ 注解下方，添加一个新的注解 `@RestController`。记住，我们正在通过快速简易的演示来巩固概念，我们在这里使用的某些内容并不是最佳实践，你不应该在常规应用程序中使用它们。例如，你通常不会在主类上放置\
    \ `@RestController`，但由于我们正在用它来快速演示，所以这是可以的。让我们在这里添加一个新方法 `public String message()`。我们可能需要为它添加\
    \ `@RequestMapping` 注解，我们将将其设为根路径。我们的计划是能够启动该应用服务的多个实例。我们将这里添加一个属性 `private String\
    \ instance`。我们将为它添加 `@Value` 注解，并传入一个 `service.instance.name` 的占位符。\n\n"
