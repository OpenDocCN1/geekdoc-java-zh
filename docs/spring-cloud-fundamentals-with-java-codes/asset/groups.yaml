  - '[PAGE 60]


    # Config Server REST Support: Parameters


    Typically when you''re interacting with the Config Server''s REST endpoints, you''re
    doing so using the Config Client; however, it''s useful to understand the available
    endpoints, at least for debugging purposes and also if you want to use it in another
    language. Each of the available REST endpoints on the Config Server share a common
    set of parameters. And the values of those parameters influence the configuration
    that''s returned.


    +   * {application} maps to spring.application.name on client

    * {profile} maps to spring.profiles.active on client

    * {label} server side feature to refer to set of config files by name


    The first parameter is the application parameter. And if you''re utilizing the
    Spring Cloud Config Client, it uses the value from the spring.application.name
    property to fill in the value for that application parameter. The next parameter
    is the profile parameter. And again, if you''re using the Spring Cloud Config
    Client, it''s going to pull the value from the spring.profiles.active property
    to fill in the value for the active Profile. So this translates into the active
    Spring Profile. The last parameter, the label parameter, is a feature for grouping
    your configuration files into kind of arbitrary named sets. And that could mean
    different things depending on the back-end you''re using. So for instance, if
    you''re using Git as a back-end, the label translates to the Git branch. Now take
    a second to look at each of these endpoint parameters, and consider them as a
    whole, and think about how you might combine one or two or all of them together
    to identify a particular configuration.'
