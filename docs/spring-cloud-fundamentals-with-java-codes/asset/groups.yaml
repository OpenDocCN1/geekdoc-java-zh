  - '[PAGE 196]


    # Aggregating Hystrix Metrics with Netflix Turbine


    Hystrix metrics are tracked on a service-by-service basis. Now a single Hystrix
    stream might have metrics on more than one Hystrix protected call, but those metrics
    are only for that service. and the implications of this are that every service
    has its own Hystrix stream URL that you need to use to consume its metrics. If
    you wanted to track the metrics for multiple services, you''d have to open up
    multiple Hystrix Dashboards and track them independently. And I''m sure you can
    imagine how much of a pain that would be if you had tens or even hundreds of services
    made up your application. To solve this, Netflix developed a tool called Turbine
    that aggregates many Hystrix streams into one. To give you a better understanding
    of how this might look, let''s look at a screenshot from the Hystrix Dashboard.


    ![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_196_0.png)


    In the screenshot, you can see there are two protected calls, the getCurrentWeather
    call and the getCurrentDatetime call. And the protected call on the left is from
    a service located on localhost:8080, and the one on the right is from another
    service located on localhost:8181. And Turbine has brought both of these metrics
    together from different services, all viewable in the same dashboard.'
