    \ it's of type pom and has a scope of import.\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-hystrix</artifactId>\n</dependency>\n<dependency>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-actuator</artifactId>\n\
    ```\n\n```xml\n</dependency>\n```\n\nThen, still within your pom.xml, within the\
    \ dependency section, define a new dependency on spring-cloud-starter-hystrix.\
    \ And if you'd like to be able to consume metrics for your Hystrix calls, you'll\
    \ also need to include a dependency on the spring-boot-actuator.\n\n```java\n\
    @SpringBootApplication\n@EnableCircuitBreaker\npublic class Application{\n   \
    \ public static void main(String[] args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\nIn your main Application class, you define a new annotation,\
    \ and that's the @EnableCircuitBreaker annotation.\n\n```java\n@Service\npublic\
    \ class Service{\n    @HystrixCommand(fallbackMethod=\"somethingElse\")\n    public\
    \ void doSomething(){\n        ...\n    }\n    public void somethingElse(){\n\
    \        ...\n    }\n}\n```\n\nAnd then in either your @Component or your @Service\
    \ class, locate the method that you want to wrap with Hystrix, in our case this\
    \ will be a method called doSomething, and annotate that method with the @HystrixCommand.\
    \ Then, on the @HystrixCommand annotation, define a new attribute called fallbackMethod,\
    \ and set that to the name of the method that you want to fall back to in the\
    \ event of a failure. In terms of code, that's all there is to it.\n\n- **Be careful\
    \ with Hystrix timeouts**\n  - Ensure timeouts encompass caller timeouts plus\
    \ any retries\n  - Default: 1000ms\n  - hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds<timeout_ms>\n\
    \nBut there's a gotcha that you have to look out for, and that's around the Hystrix\
    \ timeout. And you need to make sure that your Hystrix timeouts encompass the\
    \ caller timeouts plus any of the retries and then a little bit of a buffer. And\
    \ the default timeout is set to 1000ms or a second, and if you need to change\
    \ it, you can use this big, long property to set the timeout in milliseconds.\n\
    \n# Demo: Implementing Fault Tolerance with Netflix Hystrix\n\nIn this demo, we'll\
    \ build a simple weather service that returns a random weather condition, and\
    \ then we'll use that in another app that consumes service. And in the weather\
    \ app we'll protect our call to the weather service with Hystrix and implement\
    \ a fallback for when the weather service is down or not responding. We'll be\
    \ using service discovery to locate the weather service from our weather app,\
    \ so make sure that you have the Service Discovery Server set up within your IDE.\
    \ And if you've been following along throughout the course, you should already\
    \ have this set up. Go ahead and open up a browser and head over to start.spring.io.\
    \ In the Group section, change the group to io.ajay.kumar, and then for the name\
    \ of the artifact, name it weather-service. In the Dependencies section, add the\
    \ Web dependency and the Eureka Discovery dependency.\n\n# Generate a Maven Project\
    \ with Java and Spring Boot\n\n## 2.1.1 Project Metadata\n\n| Artifact coordinates\
    \ | | |\n| :--- | :--- |\n| Group | io.ajay.kumar |\n| Artifact | weather-service\
    \ |\n\n## Dependencies\n\n### Add Spring Boot Starters and dependencies to your\
    \ application\n\n**Search for dependencies:**\nWeb, Security, JPA, Actuator, Devtools...\n\
    \n**Selected Dependencies:**\n- Web\n- Eureka Discovery\n\n**Generate Project**\
    \ (Alt + Enter)\n\nOnce you have everything filled out, go ahead and click the\
    \ Generate Project button, and it'll create and download a zip file for you. We're\
    \ also going to use this page to generate the weather app project, still so on\
    \ this page change the name of the artifact from weather-service to weather-app.\
    \ Then in the Dependencies section, add the Hystrix dependency and the Actuator\
    \ dependency.\n\nAgain, once you have everything filled out, go ahead and click\
    \ the Generate Project button, and it'll create and download that zip file for\
    \ you. Go ahead and unzip both of those zip files and head back to your IDE. Back\
    \ within your IDE, right-click on the empty space and choose Import, choose Existing\
    \ Maven Projects, click Next, browse to the location of your downloaded zip file,\
    \ and click Finish. Once you have the weather service imported, repeat the same\
    \ process for the weather app. I have both projects imported into the IDE.\n\n\
    We'll start by developing the weather service first, so go ahead and expand the\
    \ weather-service and navigate to the main application class.\n\n```java\npackage\
    \ io.ajay.kumar.weatherservice;\nimport java.util.concurrent.ThreadLocalRandom;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController\n\
    @SpringBootApplication\n@RestController\n@EnableDiscoveryClient\npublic class\
    \ WeatherServiceApplication {\n    private String[] weather = new String[] {\"\
    sunny\", \"cloudy\", \"rainy\", \"windy\" };\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(WeatherServiceApplication.class, args);\n\
    \    }\n    @GetMapping(\"/weather\")\n    public String getWeather() {\n    \
    \    int rand = ThreadLocalRandom.current().nextInt(0, 4);\n        return weather[rand];\n\
    \    }\n}\n```\n\nIn the main application class, define two new annotations, the\
    \ @RestController annotation and the @EnableDiscoveryClient annotation. Then,\
    \ at the top of the class, define a new string array, private String array. Go\
    \ ahead and call it weather, and then we're going to set that to four different\
    \ values. We're going to say sunny, cloudy, rainy, and windy. Next, we'll go ahead\
    \ and define a getWeather method. So come to the bottom here and type public String\
    \ getWeather(). And this will be our handler method, so let's go ahead and annotate\
    \ this with @GetMapping. And we'll set the URL to /weather. In the body of the\
    \ method, we'll define a random number before 0 and 4 exclusive, and then we'll\
    \ use it to pick a random weather value. So we'll say int rand = ThreadLocalRandom.current().nextInt(0,\
    \ 4); And then next, we'll return weather[rand] to pick a random weather value.\
    \ And that's all we have for the coding part of our weather service. Next, we\
    \ have a little bit of configuration to do. So go ahead and navigate to the src/main/resources\
    \ and open up the application.properties.\n\n```properties\napplication.properties\n\
    server.port=9000\nspring.application.name=weather-service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nIn application.properties, first we're going to set the server.port, and\
    \ we're going to set that to 9000. And then we're going to set the spring.application-name\
    \ property, and we're going to set that to weather-service. And the last property\
    \ we're going to set is the location of the Service Discovery Server. So set that\
    \ long eureka.client.property equal to localhost:8761/eureka. We're now finished\
