    同样，你可以在那些每一个发现服务器（Discovery Server）实例上打开仪表板，你会发现其中填充了 AWS 特有的元数据，例如实例类型（instance-type）、ami-id
    或实例 ID（instance-id）。


    现在我们已经了解了 Eureka 中提供的 AWS 支持，让我们来看看部署架构。通常情况下，你每个可用区（availability zone）都会拥有一个或多个发现服务器，然后你有多个可用区。在这些区域中的每一个，你会为每个发现服务器配置一个弹性
    IP（Elastic IP）。然后，你通常会设置一个自动伸缩组（auto scaling group），将这些发现服务器均匀地分布在各个可用区。


    # 总结


    我们已经到了这个模块的最后，让我们快速回顾一下所学内容。我们首先查看了什么是服务发现以及它为什么重要。然后我们学习了如何使用 Spring Cloud Eureka
    Client 来发现服务，以及使用 Spring Cloud Eureka Server 来存储服务注册表，以便其他服务可以发现它们。接着我们快速查看了 Spring
    Cloud Eureka Dashboard，并对 Spring Cloud Eureka Server 有了深入了解。从那里开始，我们讨论了健康检查、高可用以及
    Spring Cloud Eureka 的配置。最后，我们通过查看 AWS 特有的支持结束了课程。


    ## 模块 4：使用分布式配置配置服务


    ## 什么是配置服务器？


    在本模块中，我们将讨论如何在像云这样的分布式系统中管理你的应用程序配置。我们将直接进入分布式系统中的配置，以及为什么它比非分布式系统更不同、更具挑战性，更重要的是，我们为什么需要这种配置服务器（Configuration
    Server）。从那里，我们将深入研究 Spring Cloud 如何通过 Spring Cloud Config Server 实现配置服务器的细节。我们还将看到如何设置
    Config Client 和 Config Server 并让它们相互通信。我们还会介绍 Spring Cloud Config Server 的各种后端存储选项，例如
    Git 仓库或 SVN 仓库。接下来，也是我认为最酷的事情之一，我们将学习如何在不重启应用程序服务器的情况下动态更新我们的配置。我们将通过多种方法实现这一点，包括
    Spring Cloud Actuator、Spring Cloud Bus 和 Spring Cloud Monitor 项目。我们还将学习 @RefreshScope
    注解以及它为什么被需要以及在哪里使用它。最后我们将通过一个关于如何使用对称和非对称加密检索并存储敏感配置值的章节来结束本模块。


    那么，在云原生应用与非云原生应用中，管理配置到底有什么不同之处？答案源于事实：云原生应用是一个分布式系统，而非云原生应用不是分布式的。在分布式应用中，你通常只有少数配置文件。系统与其配置之间通常是一对一的关系。而当你转向分布式系统时，这种配置就会发生爆炸式增长。你从一个或多个配置文件变为了许多、许多配置文件，因为你有许多、许多系统共同构成了一个整体系统。例如，如果你使用微服务，构成你整个应用程序的每个单独微服务都将有自己的配置文件。


    你可能会想：没问题，我们能搞定。这就是为什么他们制作了 Puppet 和 Chef 这样的配置工具来管理许多许多系统的配置，对吧？嗯，它可以起作用，但对于云来说并不理想。让我们聊聊使用典型的配置管理系统时会面临的一些问题。第一是，它是面向部署的，这意味着每当你想要修改配置时，都需要重启应用程序，这在云环境中是不可接受的。另一个你可能会遇到的问题是，配置管理通常是静态的，这意味着在任何配置变化时都需要重新部署应用程序，这在云环境中也是个问题。


    另一个问题是，配置管理通常是静态的，而配置服务器通常是动态的，这意味着当配置发生变化时，应用程序就不需要重新部署。


    那么，配置服务器到底是什么？它是一个中心化的配置源。通过 Spring Cloud 管理配置是非常简单的。Spring Cloud 提供了多种方式来实现配置，它是配置的权威来源。它还提供了如审计和版本控制的功能，并且支持加密或解密配置值。


    # 引入 Spring Cloud Config Server


    通过 Spring Cloud 管理配置非常简单。默认情况下，Spring Cloud 提供了几种方式来实现配置服务器。前两个选项，Consul 和 Zookeeper，是集成的，你可能不熟悉
    Consul 和 Zookeeper，但它们可以用途。


    第三个选项 Spring Cloud Config Server 是由 Spring Cloud 团队实现的，它唯一的用途就是配置。


    除了包含配置服务器，Spring Cloud Config 项目还包含了与服务器交互的客户端。Config Client 通常是嵌入在你的应用程序中的，它完美契合
    Spring 的 Environment 抽象。


    配置服务器通常是一个独立的应用程序，它也完美契合 Spring 框架的抽象，即 PropertySource。如果你对 PropertySource 抽象熟悉，你可能已经使用过它。例如，如果你在应用程序中使用类路径前缀，那么来自配置服务器的所有配置都是远程属性源。


    # 使用 Spring Cloud Config Server


    正如我们讨论过的，Spring Cloud Config Server 是配置服务器的一种实现。让我们深入查看它提供的功能以及如何设置。核心上，Config
    Server 只是一个 Web 应用程序，它提供了一个基于 REST 的接口来访问你的配置文件。你设置好配置文件，对它们进行命名，然后告诉配置服务器它们在哪里，它就会为你提供服务。重要的是指出，Config
    Server 不负责写入任何配置文件，它只关注提供这些文件。

