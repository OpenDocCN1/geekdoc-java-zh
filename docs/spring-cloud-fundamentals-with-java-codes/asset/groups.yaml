    \ used in the current implementation, so returning null is going to be okay for\
    \ our purposes. Let's close this file and open up our main application class.\
    \ And within our main application class, we'll annotate this with @Configuration.\n\
    \n```java\npackage io.ajay.kumar;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.cloud.netflix.zuul.EnableZuulProxy;\nimport org.springframework.context.annotation.Bean;\n\
    import org.springframework.context.annotation.Configuration;\nimport io.schultz.dustin.filters.AddRequestHeaderFilter;\n\
    @SpringBootApplication\n@EnableZuulProxy\n@EnableDiscoveryClient\n@Configuration\n\
    public class GatewayServiceApplication {\n    public static void main(String[]\
    \ args) {\n        SpringApplication.run(GatewayServiceApplication.class, args);\n\
    \    }\n    @Bean\n    public AddRequestHeaderFilter addRequestHeaderFilter()\
    \ {\n        return new AddRequestHeaderFilter();\n    }\n}\n```\n\nAnd then we're\
    \ going to want to define the AddRequestHeaderFilter as an @Bean, so we'll say\
    \ public AddRequestHeaderFilter, and we're going to return a new AddRequestHeaderFilter.\
    \ And again, make sure we annotate this with @Bean. And that's all the changes\
    \ that we need to make the gateway-service, so let's go ahead and close this and\
    \ collapse the gateway-service. And let's go ahead and open up the hello-service\
    \ and open up the main application class.\n\n```java\npackage io.ajay.kumar;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
