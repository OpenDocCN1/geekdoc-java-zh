- md: "\n# Configuration\n\nThere are several different areas where you can configure\
    \ Spring Cloud Eureka. We'll take a look at the three main areas. The first is\
    \ the eureka.server prefix, the second is the eureka.client prefix, and the third\
    \ is the eureka.instance prefix. Let's go into more detail into each of these\
    \ areas of configuration. The first one is the Eureka Server Configuration, and\
    \ that's all configuration under the eureka.server prefix. And this is going to\
    \ control everything that's related to configuring the Discovery Server. The second\
    \ one is the Eureka Client Configuration, and that's all configuration under the\
    \ eureka.client prefix. And this is responsible for controlling how the discovery\
    \ client interacts with the Discovery Server. So for instance, you have things\
    \ like the eureka.client.eureka-server-connect-timeout-seconds. This would control\
    \ how long the client waits to connect to the Eureka Server before it times out.\
    \ The third area of configuration is the Eureka Instance, and that's all configuration\
    \ under the eureka.instance prefix. And a Eureka Instance is anything that registers\
    \ itself with the Eureka Server so that it can be discovered by others. The properties\
    \ under the eureka.instance prefix control how the instance registers itself with\
    \ the Eureka Server. So for instance, you have things like the eureka.hostname\
    \ or the eureka.health-check-url, and the instance could be configured with custom\
    \ values there, and that's how it would register with the Eureka Server.\n\n#\
    \ Health and High Availability\n\nThe Spring Cloud Eureka Server also has some\
    \ additional features around health and high availability. It's constantly ensuring\
    \ that the application services that it's returning or handing back to clients\
    \ are healthy and available. And it also ensures that in the event that the Discovery\
    \ Server goes down, all clients can continue to operate. Like I mentioned, the\
    \ Eureka Server is constantly concerned with the health of the application services\
    \ that it's handing out to clients. And it assesses that health, at least by default,\
    \ sending clients a heartbeat every 30 seconds. And if it doesn't hear back from\
    \ that heartbeat after 90 seconds, it removes it from the registry. Sending a\
    \ heartbeat to the default configuration, but you can also configure the Eureka\
    \ Server to hit an endpoint, such as the /health availability in mind, and one\
    \ of the ways that it achieves that is when a client requests actually sends back\
    \ a copy of the registry. And what ends up happening is the registry gets distributed\
    \ across all of the clients. And if the Service Discovery Server goes down, those\
    \ clients can continue to operate. The Discovery Server actually sends back a\
    \ copy of the registry. You're probably thinking well wait though. What if the\
    \ Discovery Server has new information or one of the services goes down? Well,\
    \ the client has to renew its lease or fetch a new registry every so often, and\
    \ it does so by fetching deltas to update its registry. So it's pretty smart about\
    \ not fetching the full registry again and only getting the changes.\n\n# AWS\
    \ Support\n\nIt is well known that Netflix is a heavy user of AWS. And given that\
    \ Eureka was born at Netflix, it's only fitting that it includes AWS support.\
    \ Let's take a look at the various support, as well as a typical deployment architecture.\
    \ When an application that's using the Eureka Client starts up, it checks to see\
    \ if it's running on an AWS instance. If it is, it calls out to the local metadata\
    \ service and retrieves some metadata about that instance. And it gets things\
    \ that are specific to AWS, such as the Amazon Machine Image that's running or\
    \ what region it's running in and then it sends that information up to the Discovery\
    \ Server when it registers. Given the fact that things can change so often in\
    \ AWS, it's important that the Discovery Server be located at a well-known location.\
    \ Eureka adds support for Elastic IP binding. When a Eureka Server starts up and\
    \ notices that it's running in AWS, it'll try to bind to the next available Elastic\
    \ IP so that it has a static or well-known IP. The Eureka Client is also zone\
    \ aware with a preference for the zone that it's running in. So it'll try to contact\
    \ the Discovery Server in its current zone, and if it can't reach one, it'll try\
    \ the next zone and find the next available Discovery Server. And last, you can\
    \ configure the Eureka Client to fetch the registry of different remote regions.\
    \ In order to utilize the AWS support, it requires a bit of extra configuration.\n\
    \n```java\n@Configuration\npublic class AppConfig{\n    @Bean\n    public EurekaInstanceConfigBean\
    \ eurekaInstanceConfig(InetUtilsProperties properties) {\n        EurekaInstanceConfigBean\
    \ bean = new EurekaInstanceConfigBean(new InetUtils(properties));\n        AmazonInfo\
    \ info = AmazonInfo.Builder.newBuilder().autoBuild(\"eureka\");\n        bean.setDataCenter(info);\n\
    \        return bean;\n    }\n}\n```\n\nIn your @Configuration class, you define\
    \ a new method that returns a EurekaInstanceConfigBean, and you annotate that\
    \ with @Bean. And within the method, you create a new EurekaInstanceConfigBean.\
    \ Then you create an AmazonInfo object using the AmazonInfo.Builder, and you set\
    \ the DataCenterInfo on the EurekaInstanceConfigBean to that AmazonInfo and then\
    \ return bean. If you were to go and look at the source of the AmazonInfo class,\
    \ you would see that it's utilizing the local metadata service to fill in all\
    \ of the instance information. In addition to the configuration in your @Configuration\
    \ class, there's some additional configuration in your application.properties,\
    \ and that's around configuring the availability zones.\n\n| Address |\n| :---\
    \ |\n| 34.192.167.121 |\n| 34.193.246.166 |\n\n- * Availability Zones Configuration\
    \ in application.properties\n- eureka.client.availability-zones.[region]=[az1]\n\
    \n# EC2 Dashboard\n\n| Name | Instance ID | Instance Type | Availability Zone\
    \ |\n| :--- | :--- | :--- | :--- |\n| spring-cloud-server-1 | i-7b2c5578 | t2.micro\
    \ | us-east-1b |\n| spring-cloud-server-2 | i-8bf8cb4a1 | t2.micro | us-east-1e\
    \ |\n\nSo for example, if you have the following where you have one Discovery\
    \ Server in the us-east-1b zone and another Discovery Server in the us-east-1e\
    \ zone, you would set up your property as follows: eureka.client.availability-zones,\
    \ and then the region is us-east-1, and then you would set the comma-separated\
    \ list of us-east-1b and us-east-1e. Similar configuration is required in the\
    \ application.properties for your service URLs.\n\n| DS replicas |\n| :--- |\n\
    | ec2-34-192-167.us-east-1.amazonaws.com |\n| ec2-34-193-246-166.us-east-1.amazonaws.com\
    \ |\n\n| Application |\n| :--- |\n| DISCOVERY-SERVER-1 |\n| DISCOVERY-SERVER-2\
    \ |\n\n- * Service URL Configuration in application.properties\n- eureka.client.service-url.[zone]=http://[eip-dns]/eureka\n\
    \nThe property is the eureka.client.service-url.zone property, and you set that\
    \ to the HTTP address of the Eureka Instance that is bound to an Elastic IP. And\
    \ you want to make sure, at least as of version 1.4, to use the Elastic IP DNS\
    \ name as the code is specifically aware of the pattern that Elastic IPs use for\
    \ DNS names, and it's looking for that specific pattern to recognize if it's using\
    \ an Elastic IP\n\n# Elastic IP Dashboard\n\nIf, for instance, we had the following\
    \ Elastic IPs allocated to us, we could configure our application.properties as\
    \ follows: with the first one being the us-east-1b zone and then second one being\
    \ the us-east-1e zone. And if you'll notice, each of those is set to the Elastic\
    \ IP DNS name for the HTTP address. Following along with the previous screenshots\
    \ of the AWS console and how we configured everything, if you were to load up\
    \ your Eureka Dashboard after setting all of that up, it would look like this.\n\
    \nYou would have two instances under your DS Replicas, and then you would have\
    \ two instances of Discovery Servers, each in their respective availability zones.\n"
  mdcn: "\n\n# 配置\n\n你可以在多个不同的区域配置 Spring Cloud Eureka。我们将查看三个主要的区域：第一个是 `eureka.server`\
    \ 前缀，第二个是 `eureka.client` 前缀，第三个是 `eureka.instance` 前缀。让我们详细介绍这些配置区域的每一个部分。第一个是\
    \ Eureka 服务器配置（Eureka Server Configuration），即 `eureka.server` 前缀下的所有配置。它将控制所有与配置发现服务器（Discovery\
    \ Server）相关的内容。第二个是 Eureka 客户端配置（Eureka Client Configuration），即 `eureka.client`\
    \ 前缀下的所有配置。它负责控制发现客户端如何与发现服务器交互。例如，你有像 `eureka.client.eureka-server-connect-timeout-seconds`\
    \ 等属性，这会控制客户端在连接到 Eureka 服务器并超时之前等待连接的时间。第三个配置区域是 Eureka 实例（Eureka Instance），即\
    \ `eureka.instance` 前缀下的所有配置。Eureka 实例是指任何向 Eureka 服务器注册自己以便能够被其他实例发现的实体。`eureka.instance`\
    \ 前缀下的属性控制着实例如何向 Eureka 服务器注册自己。例如，你有像 `eureka.hostname` 或 `eureka.health-check-url`\
    \ 等属性，实例可以在那里配置自定义值，并以此方式向 Eureka 服务器注册。\n\n# 健康检查与高可用性\n\nSpring Cloud Eureka\
    \ 服务器还具有一些关于健康和高可用性的额外功能。它会不断确保它返回或交付给客户端的应用程序是健康且可用的。它还确保在发现服务器宕机的情况下，所有客户端都能继续运行。正如我提到的，Eureka\
    \ 服务器持续关注其交付给客户端的应用程序健康状况。它会评估这种健康状况，至少默认情况下，每 30 秒向客户端发送一次心跳。如果如果 90 秒后没有收到来自该心跳的回包，它将将其从注册表中移除。默认配置下会发送心跳，但你也可以配置\
    \ Eureka 服务器访问某个端点（例如考虑到 `/health` 可用性），它实现这一目标的方法之一是当客户端请求时，实际上返回一份注册表副本。结果是注册表分发到了所有客户端上。如果发现服务器宕机，这些客户端就可以继续运行。发现服务器实际上会返回注册表的副本。你可能在想，等一下，如果发现服务器有了新信息或者其中一个服务宕机了怎么办？嗯，客户端必须定期续租许可或获取新的注册表，它是通过获取增量（deltas）来更新注册表来实现的。因此它在不再获取完整注册表而只获取更改方面非常智能。\n\
    \n# AWS 支持\n\n众周知，Netflix 是 AWS 的深度用户。鉴于 Eureka 诞生于 Netflix，包含 AWS 支持也完全合理。让我们来看看各种支持以及典型的部署架构。当使用\
    \ Eureka 客户端的应用程序启动时，它会检查自己是否运行在 AWS 实例上。如果是，它会调用本地元数据服务并检索该实例的一些元数据。它会获取 AWS\
    \ 特有的信息，如正在运行的 Amazon 映像（AMI）或其所在的区域，然后在注册时将这些信息发送到发现服务器。鉴于 AWS 中的事物变化非常频繁，确保发现服务器位于已知位置是非常重要的。Eureka\
    \ 增增加了对弹性 IP（Elastic IP）绑定的支持。当 Eureka 服务器启动并发现它运行在 AWS 上时，它将尝试绑定到下一个可用的弹性 IP，以便拥有静态或已知的\
    \ IP。Eureka 客户端也具有区域感知能力（zone aware），并优先选择它所在的区域。因此，它会尝试联系当前区域的发现服务器，如果无法访问，它将尝试下一个区域并找到下一个可用的发现服务器。最后，你可以配置\
    \ Eureka 客户端获取不同远程区域的注册表。为了利用 AWS 支持，需要一些额外的配置。\n\n```java\n@Configuration\npublic\
