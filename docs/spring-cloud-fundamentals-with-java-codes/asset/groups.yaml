    \ 客户端配置\n\n我们首先讨论了什么是负载均衡，以及客户端负载均衡与服务端负载均衡之间的区别。然后，我们介绍了 Netflix Ribbon 项目，并学习了如何使用\
    \ @LoadBalanced 和 @RibbonClient 注解，在带有和不带服务发现的情况下设置客户端负载均衡。在最后一节中，我们看到了如何使用 @RibbonClient\
    \ 注解配合单独的 @Configuration 类，为特定的 Ribbon 客户端设置自定义配置。\n\n## 模块 7：使用断路器创建自愈服务\n\n\
    ## 引言\n\n在本模块中，我们将学习如何在云原生架构中开发既具有容错能力又能自愈能力的服务。\n\n- 分布式系统中的故障\n  - 级联故障\n  -\
