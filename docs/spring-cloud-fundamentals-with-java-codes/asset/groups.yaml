- md: "\nAnd this time, instead of putting in the hystrix.stream URL, we'll use the\
    \ turbine.stream URL. So go ahead and type http://localhost:3000/turbine.stream.\
    \ And then in the Title textbox just type Turbine. After that, click the Monitor\
    \ Stream button, and you should see metrics from the datetime app, that's the\
    \ getCurrentDateTime call, and you should also see metrics from the weather app,\
    \ and that's the getWeather call.\n\nAnd if you don't, just go back to those services\
    \ and refresh them a few times to generate some metrics.\n\n# Summary\n\nWe're\
    \ at the end of this module so, like always, let's do a recap of what we learned.\n\
    \n- Fault tolerance is a requirement\n- Netflix Hystrix\n  - Circuit breaker pattern\n\
    \  - @HystrixCommand\n  - @EnableCircuitBreaker\n- Netflix Hystrix Dashboard &\
    \ Turbine\n  - Monitor one or several streams\n\nFirst, we saw that failures in\
    \ a distributed system are pretty much inevitable. And we have to learn to embrace\
    \ failures and make handling failures a requirement. Then we introduced Netflix\
    \ Hystrix, which is an implementation of the Circuit Breaker pattern, among other\
    \ fault-tolerance patterns. And we saw how to use the @EnableCircuitBreaker annotation\
    \ and the @HystrixCommand annotation to protect a call that might fail. We concluded\
    \ the module by looking at how we can visualize and monitor our Hystrix-protected\
    \ calls with the Hystrix Dashboard and how we can monitor several streams at once\
    \ with Turbine.\n\n# Module 8: Bringing It All Together and Where to Go Next\n\
    \n## Introduction\n\nIn this last module we'll take a holistic approach to see\
    \ how each of the individual ideas and technologies all fit together and where\
    \ you can go next after you've completed the book.\n\n- How does it all fit together?\n\
    \  - Service Discovery\n  - Distributed Configuration\n  - Client-side load balancing\n\
    \  - Gateway and routing\n  - Fault tolerance and circuit breaker\n- What's next?\n\
    \  - Other Spring Cloud Projects\n\nWe'll begin with a section on how it all fits\
    \ together. We've learned a lot throughout the book covering new ideas and technologies\
    \ in every single module. And while many of those ideas are useful by themselves,\
    \ the real advantage comes from using them as a whole. And we'll see how each\
    \ of the main topics, service discovery, distributed configuration, client-side\
    \ load balancing, gateway and routing, and fault tolerance and circuit breaker,\
    \ all fit together to form a cloud-native system. And then, like mentioned, we'll\
    \ finish by briefly discussing where you can go next to learn about additional\
    \ Spring Cloud projects are out there. And don't discount the importance of this.\
    \ It's helpful to know exactly what's out there. It's almost like browsing the\
    \ tool section at your local hardware store, and if you don't know what tools\
    \ are out there, when you have a problem, you might end up using the wrong tool\
    \ for the wrong job.\n\n## How Does It All Fit Together?\n\nThe question is how\
    \ does it all fit together to form a cloud-native system? And, to start, let's\
    \ recap everything that's involved. It all starts with one or more application\
    \ services.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_210_0.png)\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_210_1.png)\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_210_2.png)\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_210_3.png)\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_210_4.png)\n\nIn and our example we\
    \ have two application services, application A and application Service B, and\
    \ both of them are running multiple instances. Then, at the heart of everything\
    \ is the Service Discovery Server. It's the phonebook or the directory of the\
    \ system allowing everyone to register their location, as well as discover the\
