    \n这里我们得到了结果。有了 `Hello` 以及来自 `gateway-service` 的 `USA`，该标头被 `hello-service` 消费并附加到字符串中输出\
    \ `Hello from USA!`。\n\n# 总结\n\n我们现在已经完成了该模块，让我们花一点时间回顾一下学习的内容。\n\n- 智能路由的需求\n\
    - 网关服务\n- Netflix Zuul\n  - `@EnableZuulProxy`\n  - 配置路由\n- 编写过滤器\n\n首先，我们查看了为什么需要智能路由以及它的重要性。然后我们查看了如何通过\
    \ API 网关或网关服务来实现路由。最后，我们看到了如何使用 Netflix Zuul 作为网关服务来路由请求和响应。\n\n# 第 6 模块：使用客户端负载均衡调用服务\n\
    \n# 模块介绍\n\n在本模块中，我们将学习如何利用客户端负载均衡来分配云原生应用程序服务的负载。\n\n- 负载均衡\n  - 服务端\n  - 客户端\n\
    \  - Netflix Ribbon\n  - 有/无服务发现\n    - `@LoadBalanced`\n    - `@RibbonClient`\n\
