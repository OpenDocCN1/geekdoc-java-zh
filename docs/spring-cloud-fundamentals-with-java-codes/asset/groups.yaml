    # Configuration


    There are several different areas where you can configure Spring Cloud Eureka.
    We''ll take a look at the three main areas. The first is the eureka.server prefix,
    the second is the eureka.client prefix, and the third is the eureka.instance prefix.
    Let''s go into more detail into each of these areas of configuration. The first
    one is the Eureka Server Configuration, and that''s all configuration under the
    eureka.server prefix. And this is going to control everything that''s related
    to configuring the Discovery Server. The second one is the Eureka Client Configuration,
    and that''s all configuration under the eureka.client prefix. And this is responsible
    for controll how the discovery client interacts with the Discovery Server. So
    for instance, you have things like the eureka.client.eureka-server-connect-timeout-seconds.
    This would control how long the client waits to connect to the Eureka Server before
    it times out. The third area of configuration is the Eureka Instance, and that''s
    all configuration under the eureka.instance prefix. And a Eureka Instance is anything
    that registers itself with the Eureka Server so that it can be discovered by others.
    The properties under the eureka.instance prefix control how the instance registers
    itself with the Eureka Server. So for instance, you have things like the eureka.hostname
    or the eureka.health-check-url, and the instance could be configured with custom
    values there, and that''s how it would register with the Eureka Server.'
  - '[PAGE 46]


    # Health and High Availability


    The Spring Cloud Eureka Server also has some additional features around health
    and high availability. It''s constantly ensuring that the application services
    that it''s returning or handing back to clients are healthy and available. And
    it also ensures that in the event that the Discovery Server goes down, all clients
    can continue to operate. Like I mentioned, the Eureka Server is constantly concerned
    with the health of the application services that it''s handing out to clients.
    And it assesses that health, at least by default, sending clients a heartbeat
    every 30 seconds. And if it doesn''t hear back from that heartbeat after 90 seconds,
    it removes it from the registry. Sending a heartbeat to the default configuration,
    but you can also configure the Eureka Server to hit an endpoint, such as the /health
    availability in mind, and one of the ways that it achieves that is when a client
    requests actually sends back a copy of the registry. And what ends up happening
    is the registry gets distributed across all of the clients. And if the Service
    Discovery Server goes down, those clients can continue to operate. The Discovery
    Server actually sends back a copy of the registry. You''re probably thinking well
    taut though. What if the Discovery Server has new information or one of the services
    goes down? Well, the client has to renew its lease or fetch a new registry every
    so often, and it does so by fetching deltas to update its registry. So it''s pretty
    smart about not fetching the full registry again and only getting the changes.'
