- md: "\n```java\npackage io.aj.kumar.configclientapp;\nimport org.springframework.framework.beans.factory.annotation.Autowired;\n\
    import org.springframework.framework.beans.factory.annotation.Value;\nimport org.springframework.framework.boot.SpringApplication;\n\
    import org.springframework.framework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.framework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.framework.cloud.context.annotation.RefreshScope;\n\
    import org.springframework.framework.web.bind.annotation.RequestMapping;\nimport\
    \ org.springframework.framework.web.bind.annotation.RestController;\n@SpringBootApplication\n\
    @EnableDiscoveryClient\n@RestController\n@RefreshScope\npublic class ConfigClientAppApplication\
    \ {\n    @Autowired\n    private ConfigClientAppConfiguration properties;\n  \
    \  @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n\nSo you type @RefreshScope. Go ahead\
    \ and save that and restart the application. Now since we restarted the application,\
    \ the application's going to fetch the latest configuration values when it starts\
    \ up. So we won't actually be demonstrating the use of @RefreshScope because it's\
    \ going to get the latest value regardless. And so what we need to do is to update\
    \ the value again. So go ahead and open up the config-client-app, and change this\
    \ some.other.property to really good.\n\nconfig-client-app.properties :\n```properties\n\
    # Put application-specific config here (application name: client-config-app)\n\
    some.property=coffee\nsome.other.property=really good\n```\n\nSave, close that\
    \ file out, and and commit that up to the Git repository. So Team, Commit, updating\
    \ configuration again, and click the Commit and Push button. You can exit the\
    \ Git Staging view. And head back to your browser and refresh the page.\n\nAs\
    \ you can see, it says coffee is good. And is good is the value that it retrieved\
    \ on start up. But once we refresh this with the refresh scope now added, it will\
    \ fetch the latest value for that @Value annotation. So go ahead and open up Postman,\
    \ and on the New Tab where it says GET, click that drop-down and choose POST.\
    \ Then in the request URL type http://localhost:8080/refresh. Once you've got\
    \ that typed in, hit Send, and you can see it changed the some.other.property.\
    \ Head back to the browser, and refresh that page.\n\nAnd you can see that it\
    \ changed our property this time from is good to is really good.\n\n## Encrypting\
    \ and Decrypting Sensitive Configuration\n\nSpring Cloud Config Server also provides\
    \ additional useful functionality for encrypting and decrypting your configuration.\
    \ It has support for several different features.\n\nSupported features :\n\n-\
    \ Encrypted configuration at rest and/or in-flight\n- A /encrypt endpoint to encrypt\
    \ configuration\n- A /decrypt endpoint to decrypt configuration\n- Encrypting\
    \ and decrypting with symmetric or asymmetric keys\n\nIt supports encrypted configuration\
    \ at rest or in-flight. And at rest, that simply means that your configuration\
    \ is encrypted when it's stored on disc. And in-flight means that it's encrypted\
    \ as it travels between the Config Server and the Config Client. It has utility\
    \ endpoints for encrypting and decrypting your configuration. One and really important\
    \ thing to point out is that by default neither of these endpoints are secured\
    \ unless you configure security for your Configuration Server. And we've already\
    \ talked about how to secure your Config Server. Remember that any of the methods\
    \ that are supported by Spring Security will work for securing your Config Server.\
    \ And last, it has support for encrypting and decrypting using either symmetric\
    \ or asymmetric keys. So you can choose whatever works best for your situation.\
    \ Before we get into the details on encrypting and decrypting configuration, I\
    \ thought it would be useful to see how encrypted configuration looks.\n\napplication.properties\
    \ :\n\n```properties\nmy.datasource.username=foobar\nmy.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL\n\
    ```\n\napplication.yml :\n```yaml\nmy:\n  datasource:\n    username: foobar\n\
    \    password: '{cipher}ASFIOWRODSKSDFIR32KJL'\n```\n\nI've included both an application.properties\
    \ and an application.yml. And they both have the same encrypted database password.\
    \ Notice that before the random letters and numbers there's a special value of\
    \ cipher, and it's surrounded by curly braces. This is what denotes that the real\
    \ value is encrypted value. And notice that there's one minor difference in the\
    \ application.yml versus the properties. The YAML file requires you to surround\
    \ the value in single quotes, whereas the properties file does not. Now that you've\
    \ seen what encrypted configuration looks like, you're probably wondering at what\
    \ point is the configuration decrypted? And there are two different options. The\
    \ first option is upon request, and that's at the Configuration Server. So you\
    \ make a request for configuration for a specific application, and the Config\
    \ Server decrypts the values in the configuration before sending it. You'd only\
    \ want to use this if the connection between your Config Server and your Config\
    \ Client is secure. If it's not, you can utilize the second option that decrypts\
    \ the value's client side. And this is exactly opposite of the first option. Instead\
    \ of decrypting the values before sending them back, the Config Server sends them\
    \ in encrypted format, and the client is responsible for decrypting them. Note\
    \ that the default way is the first option, upon request. And if you want the\
    \ client to decrypt the configuration, you have to set a property on the Config\
    \ Server, spring.cloud.config.server.encrypt.enabled, that's a big one, =false.\
    \ And that will tell the Config Server not to decrypt the values before sending\
    \ them back to the client.\n\n## Using the Encryption and Decryption Support\n\
    \nBefore we get into the details about configuring our Configuration Server for\
    \ encryption and decryption support, note that it assumes we have the Java Cryptography\
    \ Extension installed, or commonly referred to as JCE.\n\nStep One: Choose Your\
    \ Key Type\n\n- Symmetric Key\n- Asymmetric Key\n  - Public Key\n  - Private Key\n\
    \nThe first step if you're encrypting your configuration is to choose the key\
    \ type, and that could be either symmetric or asymmetric. And typically symmetric\
    \ keys are easier to use, but less secure than asymmetric keys. And you can choose\
    \ whatever works best for your situation.\n\nStep Two (Symmetric): Configure the\
    \ Config Server\n\n```properties\napplication.properties :\nencrypt.key=<your_super_secret_key>\n\
    \napplication.yml :\nencrypt.key: <your_super_secret_key>\n```\n\nStep two, if\
    \ you're using a symmetric key, is to configure the encryption key. And you can\
    \ do that in the application.properties or the application.yml. And the property\
    \ that is set is encrypt.key. And you would set that to the secret value you'll\
    \ use to encrypt your configuration.\n\n### Step Two (Asymmetric): Configure the\
    \ Config Server Option 1\n\n```properties\napplication.properties :\nencrypt.key=<pem_encoded_key_as_text>\n\
    \napplication.yml :\nencrypt.key: <pem_encoded_key_as_text>\n```\n\nStep two,\
    \ if you're using asymmetric keys, can be done in two different ways. The first\
    \ way is to set the value of the encrypt.key property in the application.properties\
    \ or the application.yml as a pem_encoded_key_as_text. And the PEM encoded key\
    \ would contain both the public and the private key.\n\n### Step Two (Asymmetric):\
    \ Configure the Config Server Option 2\n\n```properties\napplication.properties\
    \ :\ncrypt.keyStore.location=<path_to_keystore>\ncrypt.keyStore.password=<keystore_password>\n\
    crypt.keyStore.alias=<key_name_in_keystore>\n\napplication.yml :\ncrypt:\n  keyStore:\n\
    \    location: <path_to_keystore>\n    password: <keystore_password>\n    alias:\
    \ <key_name_in_keystore>\n```\n\nThe second way, if you're using asymmetric keys,\
    \ is to use the Java KeyStore. Once you've created or imported your public and\
    \ private key into an existing or new keystore, you simply configure the location\
    \ of the keystore, the password to the keystore, and the name of the alias that\
    \ you chose when creating or importing the key into the keystore. And you can\
    \ do that in the application.properties, of course, or in the application.yml.\n"
  mdcn: "\n\n```java\npackage io.aj.kumar.configclientapp;\nimport org.springframework.framework.beans.factory.annotation.Autowired;\n\
    import org.springframework.framework.beans.factory.annotation.Value;\nimport org.springframework.framework.boot.SpringApplication;\n\
    import org.springframework.framework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.framework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.framework.cloud.context.annotation.RefreshScope;\n\
    import org.springframework.framework.web.bind.annotation.RequestMapping;\nimport\
    \ org.springframework.framework.web.bind.annotation.RestController;\n@SpringBootApplication\n\
    @EnableDiscoveryClient\n@RestController\n@RefreshScope\npublic class ConfigClientAppApplication\
    \ {\n    @Autowired\n    private ConfigClientAppConfiguration properties;\n  \
    \  @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n\n所以你输入了 `@RefreshScope`。继续保存并重启应用程序。现在，由于我们重新启动了应用程序，程序将在启动时获取最新的配置值。因此，我们实际上并不会演示\
    \ `@RefreshScope` 的用法，因为无论如何它都会获取最新值。所以，我们需要做的是再次更新该值。请打开 `config-client-app`，将\
    \ `some.other.property` 修改为 `really good`。\n\nconfig-client-app.properties :\n\
    ```properties\n# 在此处放置特定应用的配置（应用名称：client-config-app）\nsome.property=coffee\n\
    some.other.property=really good\n```\n\n保存并关闭该文件，将其提交到 Git 仓库。团队成员，再次更新配置，并点击“Commit\
    \ and Push”（提交并推送）按钮。你可以退出 Git Stage 视图。返回浏览器并刷新页面。\n\n如你所见，它显示 coffee is good。`is\
    \ good` 是它在启动时检索的值。但一旦我们添加了 `refresh scope` 并进行刷新，它将为该 `@Value` 注解获取最新值。现在请打开\
    \ Postman，在新标签页中点击显示 `GET` 的地方，点击下拉菜单并选择 `POST`。然后在请求 URL 中类型输入 `http://localhost:8080/refresh`。输入完成后，点击\
    \ `Send`（发送），你可以看到 `some.other.property` 发生了变化。回到浏览器并刷新页面。\n\n你可以看到，这次我们的属性从 `is\
    \ good` 变为 `is really good`。\n\n## 加密和解密敏感配置\n\nSpring Cloud Config Server 还为加密和解密您的配置提供了额外的有用功能。它支持多种不同的特性。\n\
    \n支持的功能：\n\n- 静态存储和/或传输中的加密配置\n- 用于加密配置的 `/encrypt` 端点\n- 用于解密配置的 `/decrypt` 端点\n\
    - 使用对称或非对称密钥进行加密和解密\n\n它支持静态存储或传输中的加密配置。“静态存储（at rest）”意味着当您的配置存储在磁盘上时它是加密的。“传输中（in-flight）”意味着它在\
    \ Config Server 和 Config Client 之间传输时是加密的。它提供了用于加密和解密配置的实用端点。需要指出的一个非常重要的一点是，除非你为\
    \ Configuration Server 配置了安全性，否则这两个端点都不是安全的。我们已经讨论过如何保护您的 Config Server。请记住，Spring\
    \ Security 支持的任何方法都可以保护您的 Config Server。最后，它支持使用对称或非对称密钥进行加密和解密。因此，您可以选择最适合您情况的方法。在详细介绍加密解密配置之前，我认为查看加密配置的条目会很有用。\n\
    \napplication.properties :\n\n```properties\nmy.datasource.username=foobar\nmy.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL\n\
    ```\n\napplication.yml :\n```yaml\nmy:\n  datasource:\n    username: foobar\n\
    \    password: '{cipher}ASFIOWRODSKSDFIR32KJL'\n```\n\n我同时包含了 `application.properties`\
    \ 和 `application.yml`。它们都具有相同的加密数据库密码。注意，在随机字母和数字之前有一个特殊的值 `cipher`，并且它被大括号包围。这表示真实值是加密后的值。注意，`application.yml`\
    \ 与 `properties` 文件之间有一个微小的差别。YAML 文件要求你用单引号包围值，而 properties 文件不需要。现在你已经看到了加密配置的条目，你可能在想配置在何时被解密？有两种不同的选项。第一种是在请求时解密，即在\
    \ Configuration Server 端。这时你为特定应用程序请求配置，Config Server 在发送之前解密配置中的值。只有当你的 Config\
    \ Server 和 Config Client 之间的连接是安全的，你才想要使用这种方法。如果不安全，你可以利用第二种在客户端解密值的方法。这与第一种方法完全相反。Config\
    \ Server 不在返回之前解密值，而是以加密格式发送它们，由客户端负责解密。默认情况下，Config Server 不会解密值，如果你希望客户端解密值，你需要在\
    \ Config Server 上将 `spring.cloud.config.server.encrypt.enabled` 设置为 `false`。\n\
    \n## 使用加密和解密支持\n\n在详细介绍配置 Configuration Server 的加密和解密支持之前，请假设已安装了 Java 加密扩展（JCE）。\n\
    \n第一步：选择密钥类型\n\n- 对称密钥\n- 非对称密钥\n  - 公钥\n  - 私钥\n\n在加密配置的第一步是选择密钥类型，可以是对称的，也可以是非对称的。通常对称密钥更容易使用，但安全性不如非对称密钥。您可以选择最适合您情况的方法。\n\
    \n第二步（对称）：配置 Config Server\n\n```properties\napplication.properties :\nencrypt.key=<your_secret_key>\n\
    \napplication.yml :\nencrypt.key: <your_secret_key>\n```\n\n如果你使用对称密钥，第二步是配置加密密钥。你可以在\
    \ `application.properties` 或 `application.yml` 中进行操作。设置的属性是 `encrypt.key`。将其设置为用于加密配置的密钥值。\n\
    \n### 第二步（非对称）：配置 Config Server 选项 1\n\n```properties\napplication.properties\
    \ :\nencrypt.key=<pem_encoded_key_as_text>\n\napplication.yml :\nencrypt.key:\
    \ <pem_encoded_key_as_text>\n```\n\n如果你使用非对称密钥，第二步可以通过两种方式实现。第一种是在 `application.properties`\
    \ 或 `application.yml` 中设置 `encrypt.key` 属性的 `pem_encoded_key_as_text`。该 PEM 编码密钥将包含公钥和私钥。\n\
    \n### 第二步（非对称）：配置 Config Server 选项 2\n\n```properties\napplication.properties\
    \ :\ncrypt.keyStore.location=<path_to_keystore>\ncrypt.keyStore.password=<keystore_password>\n\
    crypt.keyStore.alias=<key_name_in_keystore>\n\napplication.yml :\ncrypt:\n  keyStore:\n\
    \    location: <path_to_keystore>\n    password: <keystore_password>\n    alias:\
    \ <key_name_in_keystore>\n```\n\n如果你使用非对称密钥，第二种方式是使用 Java KeyStore。一旦将公钥和私钥创建或导入到现有的或新的密钥库中，你只需配置密钥库的位置、密钥库密码以及你在创建或导入密钥到密钥库时选择的别名即可。\n\
    \n"
