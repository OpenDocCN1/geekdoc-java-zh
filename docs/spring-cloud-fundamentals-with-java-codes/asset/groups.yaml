  mdcn: "\n这应该加载 Hystrix Dashboard板。在我们查看任何指标之前，我们实际上需要生成一些指标。因此，打开新标签页并访问你的天气应用 `localhost:8000/current/weather`。\n\
    \n然后直接刷新几次该页面以生成一些指标。回到 Hystrix Dashboard板，我们将输入天气应用的 Hystrix 流 URL。即 `http://localhost:8000/hystrix.stream`。对于仪表板的标题，我们将命名为“Weather\
    \ App”。接下来，点击 Monitor Stream（监控流）按钮，你应该就能看到一些指标了。\n\n如果你没有立即看到指标，可以在天气应用和刷新之间来回，通过刷新生成一些指标，然后返回仪表板查看这些请求的效果。\n\
    \n# 使用 Netflix Turbine 聚合 Hystrix 指标\n\nHystrix 指标是按服务进行跟踪的。现在，单个 Hystrix 流可能包含多个受\
    \ Hystrix 保护的调用的指标，但这些指标仅属于该服务。这意味着每个服务都有自己的 Hystrix 流 URL，你需要使用它来获取服务的指标。如果你想跟踪多个服务的指标，就必须打开多个\
    \ Hystrix Dashboard板并独立地跟踪它们。我完全可以想象如果你的应用程序由几十个甚至数百个服务组成，那将是痛苦。为了解决这个问题，Netflix\
    \ 开发了一个名为 Turbine 的工具，它可以将许多 Hystrix 流聚合成一个。为了让你更好地理解它的样子，让我们来看来自 Hystrix Dashboard板的一张截图。\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_196_0.png)\n\n在截图中，你可以看到有两个保护调用：`getCurrentWeather`\
    \ 调用和 `getCurrentDatetime` 调用。左侧的保护调用来自位于 `localhost:8080` 的服务，右侧的来自位于 `localhost:8181`\
    \ 的另一个服务。Turbine 将这两个来自不同服务的指标聚合在了一起，可以在同一个仪表板中查看。\n\n# 使用 Spring Cloud 和 Netflix\
    \ Turbine\n\n那么，我们如何开始使用 Turbine 呢？嗯，如果你一直在跟着这本书，你可能已经猜到了。\n\n```\npom.xml\n<dependencyManagement>\n\
    \  <dependencies>\n    <dependency>\n      <groupId>org.springframework.cloud</groupId>\n\
    \      <artifactId>spring-cloud-dependencies</artifactId>\n      <version>Camden.SR2</version>\n\
    \      <type>pom</type><scope>import</scope>\n    </dependency>\n  </dependencies>\n\
    </dependencyManagement>\n```\n\n首先，在你的 `pom.xml` 的 `dependencyManagement` 部分定义对\
    \ `spring-cloud-dependencies` 的新依赖。一如既往，确保它的类型为 `pom` 且范围为 `import`。\n\n```\n\
    pom.xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n  <artifactId>spring-cloud-starter-turbine</artifactId>\n\
    </dependency>\n```\n\n然后，同样在 `pom.xml` 的 `dependency` 部分，定义对 `spring-cloud-starter-turbine`\
    \ 的新依赖。紧接着在你的主 Application 类上添加一个新注解：`@EnableTurbine` 注解。\n\n```\n@SpringBootApplication\n\
    @EnableTurbine\npublic class Application{\n    public static void main(String[]args)\
    \ {\n        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n\
    最后，我们还有一点配置需要添加。在你的 `application.properties` 或 `application.yml` 中，我们将添加两个新属性。\n\
    \napplication.properties\nturbine.app-config=<list_of_service_ids>\nturbine.cluster-name-expression='default'\n\
    \nOR\n\napplication.yml\nturbine:\n  appConfig:<list_of_service_ids>\n  clusterNameExpression=\"\
    default\"\n\n- 除了标准的 Spring 应用名称和发现服务器位置属性外\n- 第一个属性是 `turbine.app-config` 属性，你将其设置为由逗号分隔的服务\
    \ ID 列表。这些与你用于服务发现的 service ID 相同。第二个属性 `turbine.cluster-name-expression` 属性可以是一个\
    \ Spring 表达式语言（SpEL）值，用于你的集群。在 Turbine 中，集群仅仅是需要一起监控的服务分组。为了我们的目的，为了简单起见，我们将该值设置为单引号包裹的\
    \ `default`。\n- 注意此一点：如果你使用 YAML 而不是 properties，你需要用双引号来转义单引号。\n\n一旦你完成了所有配置并启动了\
    \ Hystrix Dashboard板，你就不需要输入 `hystrix.stream` URL，而是输入你的 Turbine 服务器的 URL 并以 `turbine.stream`\
    \ 结尾。让我们通过创建自己的 Turbine 服务器来应用所学知识，可以用它来聚合我们在上一个演示中创建的服务流以及一个新服务。\n\n# 演示：使用 Turbine\
    \ 聚合多个 Hystrix 流\n\n在此演示中，我们将利用 Turbine 结合来自两个不同服务的 Hystrix 流，以便它们都可以在同一个仪表板中查看。（*注：原文后续内容存在大量重复，此处已按原意处理*）\n"
