- md: "\n```java\n@RequestMapping\npublic String hello() {\n    return \"Hello!\"\
    ;\n}\n```\n\nIn the main application class, we're going to add the @EnableDiscoveryClient\
    \ annotation, and we're also going to make this a RestController. Now this is\
    \ normally a bad idea if you were to do this in a real application, but we're\
    \ just doing this as a simple example so it's okay for now. So we'll go ahead\
    \ and add @RestController. Go ahead and save. And we'll need a handler method,\
    \ public String hello. And this is just going to return Hello!, And we will annotate\
    \ this with @RequestMapping. Now we need to configure our hello-service application,\
    \ so go ahead and open up src/main/resources and open up the application.properties.\n\
    \napplication.properties\n```properties\nspring.application.name=hello\nserver.port=1111\n\
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka\n```\n\nIn\
    \ the application.properties, the first property we'll set is the spring.application.name,\
    \ and we'll set this to hello. And we have multiple applications running at the\
    \ same time, we don't want their ports to conflict. We'll say server.port, and\
    \ we'll set this to 1111. Go ahead and save. And then the last property is setting\
    \ the location of the Service Discovery Server. And we can go ahead and just copy\
    \ that from the gateway service. So open up the application.properties from the\
    \ gateway service, copy the configuration value that's setting the location of\
    \ the Service Discovery Server, close that, and then paste into your application.properties.\
    \ You're going to repeat basically the same process for the goodbye-service except\
    \ for all of the locations that it says hello will be goodbye. Instead of using\
    \ all 1s for the port, we'll use all 2s. I completed goodbye-service, so let's\
    \ take a look at the main application class.\n\n```java\npackage io.anjay.kumar.goodbyervice;\n\
    import org.springframework.framework.boot.SpringApplication;\nimport org.springframework.framework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.framework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.framework.web.bind.annotation.RequestMapping;\nimport\
    \ org.springframework.framework.web.bind.annotation.RestController;\n\n@SpringBootApplication\n\
    @EnableDiscoveryClient\n@RestController\npublic class GoodbyeServiceApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(GoodbyeServiceApplication.class,\
    \ args);\n    }\n    @RequestMapping\n    public String goodbye() {\n        return\
    \ \"Goodbye!\";\n    }\n}\n```\n\nWe have the @EnableDiscoveryClient annotation\
    \ and the @RestController annotation, and then we have one handler method, which\
    \ is goodbye, and it's annotated with the @RequestMapping.\n\n```properties\n\
    spring.application.name=goodbye\nserver.port=2222\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nIn the application.properties, we have the spring.application.name set\
    \ to goodbye and the server.port set to all 2s. And then the configuration for\
    \ the Service Discovery Server is exactly the same. We're now ready to start up\
    \ all of the applications and try them out. So go ahead and close these files\
    \ and collapse the goodbye-service. Open the discovery-server service as this\
    \ is the first application we'll start. So right-click-on, to go to Run As, choose\
    \ Spring Boot App. After that, we'll go ahead and start the gateway service, so\
    \ right-click on the main application of the gateway service, go to Run As, Spring\
    \ Boot App. And then we can start the goodbye-service next, expand the goodbye-service,\
    \ and right-click on the main application class, Run As, Spring Boot App. And\
    \ last, we can start the hello-service application, so right-click on its main\
    \ application class, Run As, Spring Boot App. And just to confirm that you have\
    \ all of the applications started, you can click little drop-down arrow near display\
    \ selected console in console window, and you'll see each of the individual services\
    \ that you have running. Let's open up a browser and try things out. In your browser,\
    \ visit localhost:8080/hello.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_118_0.png)\n\
    \nHello!\n\nAnd, as you can see, it returned the Hello! string. And just to confirm,\
    \ we'll also hit the goodbye endpoint.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_118_1.png)\n\
    \nGoodbye!\n\nAnd, as expected, it returned the Goodbye! string. Now these examples\
    \ are very simplistic, but a lot is going on in the background. When we visited\
    \ localhost:8080/goodbye, the gateway service looked up a service with the name\
    \ goodbye from the Service Discovery Server and then proxied the traffic to that\
    \ service and then proxied the response back to the browser.\n\n# Creating Filters\
    \ with Netflix Zuul & Spring Cloud\n\nOne of the key features in Netflix Zuul\
    \ is the ability to define filters. Filters allow you to intercept and control\
    \ the requests and the responses that pass through the gateway. Zuul has support\
    \ for several different types of filters.\n\n## Filter Types\n\n- pre : Before\
    \ the request\n- post : After the request\n- route : Direct the request\n- error\
    \ : Handle request errors\n\nThe first one is the pre type filter, which is executed\
    \ before the request is routed. Next comes the route type filter, which allows\
    \ you to direct the request in any way you want. In fact, earlier when we defined\
    \ the @EnableZuulProxy annotation on the main application class, we were telling\
    \ Spring to set up some predefined route filters to proxy our request to back-end\
    \ services. After route comes the post filters, and as the name suggests, these\
    \ filters are executed after the request is routed. And the last one is the error\
    \ filter type. The error filter type is responsible for handling any of the previous\
    \ filter types, the pre, route, or posts, results in an error. To define a Zuul\
    \ filter, you simply extend and implement the ZuulFilter class.\n\n```java\npublic\
    \ class MyFilter extends ZuulFilter{\n// implement methods\n...\n}\n```\n\nAnd\
    \ there are four different methods to implement.\n\n```java\n@Override public\
    \ Object run(){\n// Filter logic goes here. Current implementation ignores return\n\
    }\n@Override public boolean shouldFilter(){\n// Whether or not the run()method\
    \ should execute\n}\n@Override public String filterType(){\n// The type of filter:\
    \ pre, route, post, error\n}\n@Override public int filterOrder(){\n// The order\
    \ of execution with respect to other filters\n}\n```\n\nThe first is the run method,\
    \ and this is where the main logic of the filter goes. Note that it returns an\
    \ object, but the current implementation ignores it so you can simply return null\
    \ from this method. The next method is the shouldFilter method, and, as the name\
    \ suggests, this method allows you to return true or false indicating whether\
    \ the filter should be ran. The third method is the filterType method, and here\
    \ you can define one of the four predefined values, either pre, route, post, or\
    \ error. The last method is the filterOrder method, and this allows you to control\
    \ the execution of your filters.\n\n```java\nRequestContext ctx = RequestContext.getCurrentContext();\n\
    HttpServletRequest req = ctx.getRequest();\nHttpServletResponse res = ctx.getResponse();\n\
    ctx.set(\"foobar\",\"PRE_FILTER_EXECUTED\");\nString foobar = (String)ctx.get(\"\
    foobar\");\n```\n\n## Sharing Between Filters\n\nRequestContext holds request,\
    \ response, state, and data information. Only available for the duration of the\
    \ request\n\nThe RequestContext is an object that's responsible for holding the\
    \ request, response, and any state or data information that needs to be shared\
    \ between all of the filters. So you'd use it to get access to the HttpServletRequest\
    \ or Response, as well as use it to set or get data for from other filters. The\
    \ RequestContext is unique to every request and only lasts the duration of the\
    \ request. Once you've defined and implemented the Zuul filter, you need to tell\
