    \ 注解，然后给它 `gateway-service` 添加的标头名称 `x-location`。最后，我们将字符串修改为 `\"Hello from \"\
    \ + location` 并保存。这就是为此应用所需的所有更改，所以我们可以关闭此并折叠 `hello-service`，准备启动它们。首先我们将启动 `discovery-server`。展开\
