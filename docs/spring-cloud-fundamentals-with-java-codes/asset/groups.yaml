    \ at many different levels in a system.\n\n- A Few Areas That Might Fail\n  -\
    \ Hardware fails\n  - Networks fail\n  - Software fails\n\nHardware can fail,\
    \ networks can fail, and software can definitely fail. And a distributed system\
    \ is no different in that sense, but the likelihood for failure is just simply\
    \ much greater. You have more hardware, you have more network, and you have more\
    \ software. And with these increased numbers comes that increased probability\
    \ for failure. Adding to that chance of failure is in the way which processes\
    \ communicate in a distributed system. Process communication that was once within\
    \ our process is now down across a network. And even as resilient as our networks\
    \ are today, there's still a much more likely chance of a communication failure\
    \ across a network versus a process. A particularly bad side of failures in a\
    \ distributed system is something called a cascading failure. A cascading failure\
    \ is a failure in one system in which can cascade, almost like dominos, to other\
    \ parts of the system causing them to fail as well. To make this a bit more concrete,\
    \ imagine that you have three services, Service A, Service B, and Service C. Service\
    \ A calls Service B, and Service B calls Service C. And imagine Service C runs\
    \ out of memory and is very slow to serve requests to Service B. And even though\
    \ Service B may have a timeout set up for calling Service B, if enough requests\
    \ stack up against Service B, which require the use of Service C at a fast enough\
    \ rate, resources at Service B will be entirely consumed before timeout is ever\
    \ reached, which in turn will cause Service B to fail. This same problem can happen\
    \ all the way up the chain.\n\n- Multiple issues at play\n  - Fault tolerance\
    \ problem\n  - Resource overloading problem\n\nThere are multiple issues at play\
    \ here. First, we have a fault tolerance problem. Calling services are unaware\
    \ that the service that they’re calling is likely to fail and yet they still attempt\
    \ to call the service. And second, we have a resource overloading problem. Calling\
    \ services are allowed to invoke dependent services with pretty much unconstrained\
    \ resources.\n\n## Embracing Failure with the Circuit Breaker Pattern\n\n- Learn\
    \ to embrace failure\n  - Tolerate failures\n  - Gracefully degrade\n- Limit resources\
    \ consumed\n  - Constrain usage\n\nHow do we solve this problem of cascading failures\
    \ and failures in general in a distributed system? Well, we have to learn to embrace\
    \ and tolerate failures and degrade gracefully. So in the event that a downstream\
    \ dependent service is failing, it's actually better for the caller not to attempt\
    \ to make a call to the dependent service, which is likely to fail. Instead, the\
    \ caller should fail fast or degrade gracefully, perhaps returning old data or\
    \ empty results, and allow the failing service to recover. And then periodically\
    \ check if the service has recovered. And, in, what this does is relieves pressure\
    \ from any upstream services that are waiting for a response. And the other thing\
    \ that we need to do is we need to limit the resources that are consumed. So clients\
    \ should put limits on the number of resources allowed to call a dependent service.\
