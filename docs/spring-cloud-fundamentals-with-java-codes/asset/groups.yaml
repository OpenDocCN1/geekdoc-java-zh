  - '[PAGE 14]


    # Key Components Involved in Service Discovery


    Before we dive in to the Spring Cloud Eureka Server and Client, it''s helpful
    to understand the key components that are involved in service discovery and how
    they interact with each other. At a minimum, there are three components involved
    in service discovery. There''s the Discovery Server, the application service,
    and the application client. It''s helpful to get a full understanding of how all
    the components work together and from there we''ll go deeper into each component
    and see how Spring Cloud helps us implement that particular component.


    +   - (1) Service registers location

    - (2) Client looks up service location

    - (3) Discovery server sends back location

    - (4) Client requests service at location

    - (5) Service sends response


    The first thing that happens is the application service starts up. And when it
    starts up, it calls out to the Discovery Server, and it registers itself. And
    it tells the Discovery Server its location, its port, and a service identifier
    that others can use to find it. Then at some point later, a client needs to call
    that application service, but it doesn''t know the location and the port of the
    service, so it sends out a request to the Discovery Server and sends along the
    service identifier. And the Discovery Server knows based on that service identifier
    which service you''re asking for, and it responds back with the location and the
    port of that service. From there, things proceed as normal, and the client can
    request the service and its location, and the service can respond back with data.'
