  mdcn: "\n\n# 前提条件\n\n- Java 8+\n- Spring Boot 1.4+\n- 了解微服务或 SOA\n\n让我们先来谈谈前提条件。我假设你对\
    \ Java 有良好的理解，特别是 Java 8，并且对 Spring Boot 有良好的了解，因为 Spring Cloud 大程度上是构建在 Spring\
    \ Boot 之上的。最后，我希望你至少对微服务或面向服务的架构（SOA）有了解或理解。\n\n- Java 8+\n- Maven 3+\n- Spring\
    \ Tool Suite (Eclipse STS) 3.8\n\n接下来，我们来谈谈为了在本书中获得成功你需要哪些软件。当然，你需要 Java、Java\
    \ 8，而且你还需要 Maven（至少是 Maven 3）来构建 Spring Boot 应用。我们将使用 Spring Tool Suite（或者叫它 Eclipse\
    \ STS）进行所有的开发。请确保你安装了至少 3.8 版本的版本。\n\n# 模块 3：使用服务发现查找服务\n\n## 什么是服务发现？\n\n- 在本模块中：\n\
    \  - 服务发现\n  - 使用 Spring Cloud 发现服务\n    - 使用 Eureka 客户端和服务\n    - 配置\n    - 健康状况与高可用性\n\
    \    - 控制面板\n    - AWS 可用性\n\n在本模块中，我们将介绍服务发现如何帮助你在云端定位你的应用服务。让我们快速开始谈谈这个模块的内容，首先我们将查看服务发现。显然，这个模块是关于服务发现的，因此我们将讨论它是什么以及它为什么重要。然后，我们将查看\
    \ Spring Cloud 如何实现服务发现。它使用了一个来自 Netflix 的开源项目，叫做 Eureka，我们将讨论 Eureka Client 和\
    \ Eureka Server。接着，我们将转向配置，配置 Eureka Client、Eureka Server 和 Eureka Instance（实例），以及它们之间有何不同，以及你如何根据自己的需求对它们进行调整或配置。然后，我们将进入健康状况和高可用性部分。Eureka\
    \ Server 如何知道你的应用程序何时宕机或处于不健康状态？你如何确保 Eureka Server 是高可用的？然后我们将查看 Eureka Dashboard，这是一个非常棒\
    \ Web UI，可以显示你所有注册的服务、有多少个实例，以及它们是运行还是离线状态。\n\n最后，我们将介绍 Eureka 如何对 AWS 提供特定的支持。让我们从最重要的问题开始：什么是服务发现，我们为什么需要它？记住，云端正在改变我们构建软件的方式。我们正在从构建这些单一大型应用，转变为将其拆分成更小的碎片，称为“服务”。每一个独立的服务都可以独立进行部署和扩展，而它们共同作为一个整体，构成了整个……问题就出于此。一个服务如何知道另一个服务在哪里、它的主机和端口是什么，以便它可以调用并使用它？首先，我们可以简单地配置所有的服务，让它们知道所调用的其他服务的位置和端口。根据需求，这实际上可以让我们走得很远。但过了一段时间，我们会发现这种方法存在问题。例如，如果你有一个特定服务的两个实例怎么办？在我们的示例中，我们有\
    \ Application Service A 调用 Application Service B。如果我们使用配置，每当我们添加或移除 Application\
    \ Service B 的新实例时，我们都必须更新该配置。嗯，在我们的示例中，我们只有两个实例。想象一下如果你有数百个实例呢。光是配置管理就是不可持续的。当我们迁移到云环境时，我们的简单配置会进一步瓦解。在云环境中，你的服务实例可以根据需求随时出现或消失。例如，Application\
    \ Service B 有时启动两个实例，考虑一下你可能有巨大的流量涌入，也许是你的电子商务网站正在进行闪购活动，然后自动化进程启动并开启了另外两个实例来处理所有这些流量。嗯，如果你使用简单配置，Application\
    \ Service B 的所有调用者（如 Application Service A）将不知道为了响应需求而添加的新实例。对它们来说，它们的配置显示仍然只有它们已知的两个实例。另一个需要考虑的因素是，应用服务最终会失败。无论发生什么，无论是内存问题还是硬件问题，如果你使用简单配置，你的服务将尝试向那些失败的实例发送流量。例如这里，我们有\
    \ Application Service A 调用 Application Service B，并且它有两个实例。如果其中一个实例失败了，Application\
    \ Service A 并不会知情，并将继续向那个失败的实例发送流量。我们需要一种更动态的方法。当一种方法太过于静态时，对于我们在云端的需求来说，它太僵化了。这就是服务发现大显身手的地方。\n\
    \n- 服务发现提供了：\n  - 服务注册自身的方式\n  - 服务注销自身的方式\n  - 客户端发现其他服务的方式\n  - 检查服务健康状况并移除不健康实例的方式\n\
    \n服务发现通常提供以下功能：服务注册自身的方式。这意味着当一个服务上线时，它可以调用 Service Discovery Server 并告知其服务的位置和端口，以便其他服务使用它。出于恰相反的原因，服务发现提供了服务注销自身的方式。所以如果一个服务关闭或临时离开，它会希望\
    \ Service Discovery Server 知道它不再可用。最重要的是，服务发现提供了客户端发现其他服务的方式。我所说的客户端指的是其他应用服务。所以如果你是一个需要使用另一个服务的应用服务，你需要找到该服务的位置和端口，你可以向\
    \ Service Discovery Server 查询。最后，服务发现提供了检查服务健康状况并移除不健康实例的方式。因此每个应用服务都会实现健康检查（通常通过\
    \ REST 端点），然后 Service Discovery Server 会调用其注册表中的实例。\n\n# 介绍 Spring Cloud Netflix\n\
    \n在了解了服务发现是什么以及它为什么重要之后，让我们学习 Spring Cloud 如何帮助我们实现它。\n\n- 使用以下项目发现服务：\n  - Spring\
    \ Cloud Consul\n  - Spring Cloud Zookeeper\n  - Spring Cloud Netflix\n\n实际上有多种使用\
    \ Spring Cloud 发现的方法。有 Spring Cloud Consul 项目、Spring Cloud Zookeeper 项目以及 Spring\
    \ Cloud Netflix 项目。我们将专门关注最后一个，Spring Cloud Netflix 项目。\n\n- Netflix OSS + Spring\
    \ + Spring Boot = Spring Cloud Netflix\n\nSpring Cloud 项目获取了 Netflix 的开源项目并添加了一些\
    \ Spring 和 Boot 的特性。你可以说他们是对它们进行了“Spring 化”。由此诞生了 Spring Cloud Netflix 项目。类似于\
    \ Spring Cloud 项目，Spring Cloud Netflix 项目本身实际上并不是一个项目。相反，它是一个项目的集合。对于服务发现，我们感兴趣的是其中的两个项目：Spring\
    \ Cloud Netflix Eureka Server 和 Spring Cloud Netflix Eureka Client。\n\n"
