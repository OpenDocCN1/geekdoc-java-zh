- md: "\n# Using Spring Cloud & Netflix Zuul Without Service Discovery\n\n```properties\n\
    application.properties :\nspring.application.name=gateway-service\nribbon.eureka.enabled=false\n\
    ```\n\nOR\n\n```yaml\napplication.yml :\nspring:\n  application:\n    name: gateway-service\n\
    ribbon:\n  eureka:\n    enabled: false\n```\n\nIf you're not using service discovery,\
    \ you still define the application name, and you add an additional parameter,\
    \ ribbon.eureka.enabled=false. Remember how I mentioned that the gateway service\
    \ can serve as a load balancer for your services? Well, the name of the client-side\
    \ load balancer project from Netflix is called Ribbon. And we'll get into more\
    \ details about what Ribbon is in the module on client-side load balancing.\n\n\
    # Configuring Routes in Netflix Zuul\n\nOnce you have everything configured, the\
    \ next step is to define how Zuul should route requests. The default routing behavior\
    \ when Zuul is set up using service discovery is to route requests by service\
    \ name.\n\n### Default Route to Service Resolution with Service Discovery\n\n\
    - Request: /foo maps to Service: spring.application.name=foo\n- Request: /foo\
    \ maps to Service: spring.application.name=categories\n\nSo for example, if you\
    \ requested /foo, Zuul would use service discovery to find the service with a\
    \ name of foo and send that request to 1 service. Here's another example. If you\
    \ were to request /categories/1, Zuul would locate the service with the name categories,\
    \ and it would send the /1 request to that service. By default, the prefix is\
    \ stripped from the request, so the service actually gets the /1 part of the request.\
    \ If you wanted to send the full request, the /categories/1, you could set the\
    \ property zuul.stripPrefix to false, and the service would get the request /categories/1.\
    \ Also note that all services are added by default, so you'll want to use the\
    \ zuul.ignoredServices, and you could set that to a pattern to ignore specific\
    \ services.\n\n### Netflix Zuul with Service Discovery: Precise Routing\n\n```properties\n\
    application.properties\nspring.application.name=gateway-service\nzuul.routes.<route_name>.path=/somepath/**\n\
    zuul.routes.<route_name>.serviceId=some_service_id\nzuul.ignored-services=some_service_id\n\
    ```\n\nOR\n\n```yaml\napplication.yml\nspring:\n  application:\n    name: gateway-service\n\
    zuul:\n  routes:\n    <route_name>:\n      path: /somepath/**\n      serviceId:\
    \ some_service_id\n  ignored-services: some_service_id\n```\n\nIn addition to\
    \ the default configuration, you can also define more precise configuration for\
    \ specific services. First you define the path with the zuul.routes.route_name.path\
    \ property where the route name can be anything you want. And the path is defined\
    \ as a path that's using the Ant-style matchers. Then you define the same property\
    \ prefix, but end it with service_id instead of path. And the service ID is the\
    \ service identifier that Zuul will look for when discovering the service via\
    \ service discovery. You'll also need to set the zuul.ignored-services property\
    \ so that Zuul doesn't try to automatically add a route for that service ID.\n\
    \n# Netflix Zuul Without Service Discovery: Precise Routing\n\n```properties\n\
    application.properties\nspring.application.name=gateway-service\nzuul.routes.<route_name>.path=/somepath/**\n\
    zuul.routes.<route_name>.url=http://some_url_address/\n```\n\nOR\n\n```yaml\n\
    application.yml\nspring:\n  application:\n    name: gateway-service\n  zuul:\n\
    \    routes:\n      <route_name>:\n        path: /somepath/**\n        url: http://some_url_address/\n\
    ```\n\nThe configuration for when you're not using service discovery is actually\
    \ pretty similar to when you are. You define the path, just like you did in the\
    \ previous configuration, and then instead of defining a service ID, you simply\
    \ define the URL to the service.\n\n# Demo: Using Netflix Zuul as an Intelligent\
    \ Router\n\nHead on over to start.spring.io, and we're going to create three different\
    \ projects here. So for the Group ID do io.ajay.kumar, and for the Artifact, the\
    \ first one we're going to create, we're going to say gateway-service. For the\
    \ dependencies, we'll want to add Zuul, and then we'll also want to add Eureka\
    \ Discovery.\n\n# Generate a Project with Spring Boot\n\n### Project Metadata\n\
    \n| Artifact coordinates | | |\n| :--- | :--- | :--- |\n| Group | io.ajay.kumar\
    \ | |\n| Artifact | gateway-service | |\n\n### Dependencies\n\nAdd Spring Boot\
    \ Starters and dependencies to your application\n\n- Search for dependencies:\
    \ Web, Security, JPA, Actuator, Devtools...\n- Selected Dependencies: + Zuul,\
    \ Eureka Discovery\n\n```\nGenerate Project (Alt + Enter)\n```\n\nAnd you're finished\
    \ there, go ahead and click Generate Project, and that will create a zip file\
    \ for you. And still on the same page, clear the dependencies and change the Artifact\
    \ to hello-service. And for the dependencies, we'll want to add Web and Eureka\
    \ Discovery.\n\nGo ahead and click Generate Project, and that will create a hello-service.zip.\
    \ And leave everything the same, but change this from hello to goodbye. So we're\
    \ going to have a hello and a goodbye-service.\n\nAnd click Generate Project.\
    \ Go ahead and unzip all of those zip files and head over to your IDE. Within\
    \ your IDE, right-click on the empty space in the Package Explorer, and go to\
    \ Import, and choose Existing Maven Projects. Navigate to the location of the\
    \ downloaded zip files, we'll use the gateway-service first, and click Open, and\
    \ click Finish. And that imports the project into our IDE, and you'll need to\
    \ do the same for the other two services. I have all of the services imported.\
    \ We're also going to need the Service Discovery Server, so if you don't already\
    \ have that imported into your IDE from completing the previous modules, I'll\
    \ quickly show you how you can import it.\n\nGo ahead and right-click on the empty\
    \ area of the Package Explorer, and go to New, and choose Other. In the textbox,\
    \ go ahead and start typing maven, and choose the option that says Check out Maven\
    \ Projects from SCM. Click Next. We'll need to grab the git clone URL from GitHub,\
    \ go ahead and use a browser and visit github.com/ajaycucek/discovery-server.\
    \ On the GitHub page, locate the Clone or download button, click it, and highlight\
    \ the clone URL. Copy that to your clipboard and head back to IDE. In the textbox\
    \ under the SCM URL, go ahead and paste that and click Next. We now have everything\
    \ we need to get started.\n\nGo ahead and expand the gateway-service project,\
    \ and locate the main application class. In the main application class, we're\
    \ going to add two annotations. The first one is the @EnableZuulProxy annotation,\
    \ and the second one is the @EnableDiscoveryClient annotation.\n\n```java\npackage\
    \ io.ajay.kumar.gatewayservice;\nimport org.springframework.framework.boot.SpringApplication;\n\
    import org.springframework.framework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.cloud.netflix.zuul.EnableZuulProxy;\n\n@SpringBootApplication\n\
    @EnableZuulProxy\n@EnableDiscoveryClient\npublic class GatewayServiceApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(GatewayServiceApplication.class,\
    \ args);\n    }\n}\n```\n\nNext, we'll open up the application.properties and\
    \ configure the properties for the gateway service. So go ahead and expand src/main/resources\
    \ and open the application.properties.\n\n```properties\napplication.properties\n\
    spring.application.name=gateway-service\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nThe first property we're going to add is the spring.application.name property,\
    \ and we're going to set that to gateway-service. And then the other property\
    \ we'll need is the location of the Service Discovery Server. So we'll say eureka.client.service-url.defaultZone,\
    \ and then we'll set that to localhost:8761/eureka. Next, you can go ahead and\
    \ close both those files and minimize the gateway-service project.\n"
  mdcn: "\n\n# 在不使用服务发现的情况下使用 Spring Cloud & Netflix Zuul\n\n```properties\napplication.properties\
    \ :\nspring.application.name=gateway-service\nribbon.eureka.enabled=false\n```\n\
    \n或者\n\n```yaml\napplication.yml :\nspring:\n  application:\n    name: gateway-service\n\
    ribbon:\n  eureka:\n    enabled: false\n```\n\n如果你不使用服务发现，仍然需要定义应用名称，并添加一个额外的参数\
    \ `ribbon.eureka.enabled=false`。记得我之前提到过网关服务可以作为你服务的负载均衡器吗？没错，Netflix 的客户端负载均衡器项目名称被称为\
    \ Ribbon。我们将在“客户端负载均衡”模块中详细介绍关于 Ribbon 的更多细节。\n\n# 在 Netflix Zuul 中配置路由\n\n一旦你完成了所有配置，下一步是定义\
    \ Zuul 如何路由请求。当使用服务发现设置 Zuul 时，默认的路由行为是根据服务名称进行路由的。\n\n### 使用服务发现进行默认路由到服务解析\n\
    \n- 请求：`/foo` 映射到服务：`spring.application.name=foo`\n- 请求：`/foo` 映射到服务：`spring.application.name=categories`\n\
    \n例如，如果你请求了 `/foo`，Zuul 将使用服务发现找到名为 `foo` 的服务，并将请求发送到 1 个服务。这里有另一个例子。如果你请求 `/categories/1`，Zuul\
    \ 将定位名为 `categories` 的服务，并将 `/1` 请求发送到该服务。默认情况下，前缀会从请求中剥离，因此服务实际获得的是请求的 `/1` 部分。如果你想发送完整的请求\
    \ `/categories/1`，可以将属性 `zuul.stripPrefix` 设置为 `false`，这样服务就会接收到 `/categories/1`\
    \ 请求。另外注意，所有服务默认都会被添加，因此你可能需要使用 `zuul.ignoredServices`，你可以将其设置为一个模式，以忽略特定的服务。\n\
    \n### 带有服务发现的 Netflix Zuul：精确路由\n\n```properties\napplication.properties\nspring.application.name=gateway-service\n\
    zuul.routes.<route_name>.path=/somepath/**\nzuul.routes.<route_name>.serviceId=some_service_id\n\
    zuul.ignored-services=some_service_id\n```\n\n或者\n\n```yaml\napplication.yml\n\
    spring:\n  application:\n    name: gateway-service\nzuul:\n  routes:\n    <route_name>:\n\
    \      path: /somepath/**\n      serviceId: some_service_id\n  ignored-services:\
    \ some_service_id\n```\n\n除了默认配置外，你还可以为特定服务定义更精确的配置。首先，你通过 `zuul.routes.route_name.path`\
    \ 属性定义路径，其中 `route_name` 可以是你想要的任何名称。路径被定义为使用 Ant 风格匹配器的路径。然后你定义相同的属性前缀，但结尾是 `service_id`\
    \ 而不是 `path`。这个 `service_id` 是 Zuul 通过服务发现发现服务时将查找的标识标识符。你还需要设置 `zuul.ignored-services`\
    \ 属性，以免 Zuul 尝试自动为该服务 ID 添加路由。\n\n# 不使用服务发现的 Netflix Zuul：精确路由\n\n```properties\n\
    application.properties\nspring.application.name=gateway-service\nzuul.routes.<route_name>.path=/somepath/**\n\
    zuul.routes.<route_name>.url=http://some_url_address/\n```\n\n或者\n\n```yaml\n\
    application.yml\nspring:\n  application:\n    name: gateway-service\n  zuul:\n\
    \    routes:\n      <route_name>:\n        path: /somepath/**\n        url: http://some_url_address/\n\
    ```\n\n不使用服务发现时的配置实际上与使用它时非常相似。你定义路径，就像你在之前的配置中做的那样，然后不是定义服务 ID，而是直接定义服务的 URL。\n\
    \n# 演示：使用 Netflix Zuul 作为智能路由器\n\n前往 start.spring.io，我们将在这里创建三个不同的项目。Group ID\
    \ 使用 `io.ajay.kumar`，对于我们要创建的第一个 Artifact，我们将命名为 `gateway-service`。对于依赖项，我们需要添加\
    \ `Zuul`，然后还要添加 `Eureka Discovery`。\n\n# 使用 Spring Boot 生成项目\n\n### 项目元数据\n\n\
    | Artifact 坐标 | | |\n| :--- | :--- | :--- |\n| Group | io.ajay.kumar | |\n| Artifact\
    \ | gateway-service | |\n\n### 依赖项\n\n向你的应用程序添加 Spring Boot Starters 和依赖项\n\n\
    - 搜索依赖项：Web, Security, JPA, Actuator, Devtools...\n- 已选依赖项：+ Zuul, Eureka Discovery\n\
    \n```\nGenerate Project (Alt + Enter)\n```\n\n到这里就完成了，点击 \"Generate Project\"\
    ，它将为你创建一个 zip 文件。在同一页面上，清除依赖项并将 Artifact 更改为 `hello-service`。对于依赖项，我们需要添加 `Web`\
    \ 和 `Eureka Discovery`。\n\n点击 \"Generate Project\"，这将创建一个 `hello-service.zip`。保持其他一切不变，但将\
    \ `hello` 改为 `goodbye`。这样我们有一个 `hello-service` 和一个 `goodbye-service`。\n\n点击 \"\
    Generate Project\"。解压所有这些 zip 文件并进入你的 IDE。在 IDE 中，在 Package Explorer 的空白处点击右键，选择\
    \ \"Import\"（导入），然后选择 \"Existing Maven Projects\"。导航到项目所在位置。\n\n"
