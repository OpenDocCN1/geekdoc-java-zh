  - '[PAGE 93]


    # # Encrypting and Decrypting Sensitive Configuration


    Spring Cloud Config Server also provides additional useful functionality for encrypting
    and decrypting your configuration. It has support for several different features.


    Supported features :


    +   - Encrypted configuration at rest and/or in-flight

    - An /encrypt endpoint to encrypt configuration

    - A /decrypt endpoint to decrypt configuration

    - Encrypting and decrypting with symmetric or asymmetric keys


    It supports encrypted configuration at rest or in-flight. And at rest, that simply
    means that your configuration is encrypted when it''s stored on disc. And in-flight
    means that it''s encrypted as it travels between the Config Server and the Config
    Client. It has utility endpoints for encrypting and decrypting your configuration.
    One and really important thing to point out is that by default neither of these
    endpoints are secured unless you configure security for your Configuration Server.
    And we''ve already talked about how to secure your Config Server. Remember that
    any of the methods that are supported by Spring Security will work for securing
    your Config Server. And last, it has support for encrypting and decrypting using
    either symmetric or asymmetric keys. So you can choose whatever works best for
    your situation. Before we get into the details on encrypting and decrypting configuration,
    I thought it would be useful to see how encrypted configuration looks.


    application.properties :


    ```

    my.datasource.username=foobar

    my.datasource.password={cipher}ASFIOWRODSKSDFIR32KJL

    ```


    application.yml :


    ```

    my:datasource:username: foobar

    ```'
  - '[PAGE 94]


    password: ‘{cipherASFIOWRODSKSDFIR32KJL’


    I''ve included both an application.properties and an application.yml. And they
    both have the same encrypted database password. Notice that before the random
    letters and numbers there''s a special value of cipher, and it''s surrounded by
    curly braces. This is what denotes that the real value is encrypted value. And
    notice that there''s one minor difference in the application.yml versus the properties.
    The YAML file requires you to surround the value in single quotes, whereas the
    properties file does not. Now that you''ve seen what encrypted configuration looks
    like, you''re probably wondering at what point is the configuration decrypted?
    And there are two different options. The first option is upon request, and that''s
    at the Configuration Server. So you make a request for configuration for a specific
    application, and the Config Server decrypts the values in the configuration before
    sending it. You''d only want to use this if the connection between your Config
    Server and your Config Client is secure. If it''s not, you can utilize the second
    option that decrypts the value''s client side. And this is exactly opposite of
    the first option. Instead of decrypting the values before sending them back, the
    Config Server sends them in encrypted format, and the client is responsible for
    decrypting them. Note that the default way is the first option, upon request.
    And if you want the client to decrypt the configuration, you have to set a property
    on the Config Server, spring.cloud.config.server.encrypt.enabled, that''s a big
    one, =false. And that will tell the Config Server not to decrypt the values before
    sending them back to the client.'
