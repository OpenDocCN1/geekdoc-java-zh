    # # Module 4: Configuring Services Using Distributed Configuration


    # ## What Is a Configuration Server?


    In this module we''ll talk about managing your application configuration in a
    distributed system like the cloud. We''ll jump right in with configuration in
    a distributed system and why its more different and more challenging than a non-distributed
    system, and more importantly, why we need this thing called a Configuration Server.
    From there, we''ll dive into the details behind the way Spring Cloud implements
    a Configuration Server with the Spring Cloud Config Server. We''ll also see how
    you can set up a Config Client and a Config Server and get them talking to each
    other. We''ll also go over the various back-end storing options for Spring Cloud
    Config Server, such as a Git repository or SVN repository. Next, and one of the
    things I think is the coolest, we''ll learn how to update our configuration on
    the fly without restarting our application server. We''ll do that with a variety
    of methods including the Spring Cloud Actuator, Spring Cloud Bus, and the Spring
    Cloud Monitor projects. We''ll also learn about the @RefreshScope annotation and
    why it''s needed and where to use it. We''ll finish the module on a section about
    retrieving and storing your sensitive configuration values using symmetric and
    asymmetric encryption. So, what exactly is so different about managing the configuration
    in a cloudnative application versus a non-cloud-native application? The answer
    to that stems from the fact that a cloud-native application is a distributed system
    and non-cloud-native applications are not distributed. And in a distributed application,
    you typically only have a handful of configuration files. It''s often a one-to-one
    relationship between a system and its configuration. And as you move to a distributed
    system, that configuration explodes. You are going from one or more to many, many
    configuration files because you have many, many systems that make up one system
    as a whole. For instance, if you''re using microservices, each of your individual'
  - '[PAGE 54]


    microservices that composed your overall application would have its own configuration
    file. You might be thinking no problem. We''ve got this. That''s why they make
    configuration tools like Puppet and Chef for managing configuration in many, many
    systems, right? Well, it''ll work, but it''s not ideal for the cloud. Let''s talk
    about some of the issues that you would face with using a typical configuration
    management system. The first is that it''s typically deployment oriented. And
    that means any time you want to make a configuration change, you have to kick
    off a new deployment so that the configuration is modified. And typically the
    application is then usually restarted. What if, for instance, you needed to make
    a temporary logging configuration change to debug an issue? Kicking off a whole
    deployment and restarting applications is a pretty heavy process just for a temporary
    change. Another issue that you would encounter is the way in which configuration
    changes make it to the application servers. And that''s via a push. Pushing application
    configuration to servers in a cloud environment is usually not dynamic enough.
    And by that, I mean it needs to know where to push the configuration to. And in
    the cloud that''s usually not a straightforward answer as application instances
    can come and go at any point in time. When you push configuration, you run the
    risk of missing a newly started instance, for instance, come online as a result
    of auto scaling during a high-traffic period. Okay, so no problem. If push doesn''t
    work, we can just pull, right? Well, that you pull configuration, you typically
    use a pulling mechanism where you check for changes every x number of minutes,
    and if there are changes, then you pull those changes down. And that introduces
    latency from the time that we change our configuration to the time that it actually
    takes effect. Well, if configuration management tooling doesn''t solve our problem,
    what exactly does? The answer to that is something called a Configuration Server.
    Or a dedicated, dynamic and centralized key/value store for storing your configuration.
    And it could be distributed or non-distributed. And similar to configuration management,
    it''s the authoritative source for all configuration. It provides things like
    auditing and versioning, and it also has cryptography support so that you can
    encrypt or decrypt those sensitive configuration values.'
