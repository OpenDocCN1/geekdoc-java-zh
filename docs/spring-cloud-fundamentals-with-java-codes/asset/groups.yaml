    And there are four different methods to implement.


    ```

    @Override public Object run(){

    // Filter logic goes here. Current implementation ignores return

    }

    @Override public boolean shouldFilter(){

    // Whether or not the run()method should execute

    }

    @Override public String filterType(){

    // The type of filter: pre, route, post, error

    }

    @Override public int filterOrder(){

    // The order of execution with respect to other filters of the same type

    }

    ```


    The first is the run method, and this is where the main logic of the filter goes.
    Note that it returns an object, but the current implementation ignores it so you
    can simply return null from this method. The next method is the shouldFilter method,
    and, as the name suggests, this method allows you to return true or false indicating
    whether or not the filter should be ran. The third method is the filterType method,
    and here you can define one of the four predefined values, either pre, route,
    post, or error. The last method is the filterOrder method, and this allows you
    to control the execution of your Zool filters.


