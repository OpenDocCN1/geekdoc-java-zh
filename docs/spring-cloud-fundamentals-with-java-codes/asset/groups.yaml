- md: "\n# Encrypt and Decrypt REST Endpoints\n\nOnce you have your Config Server\
    \ set up for cryptography, you can utilize some of the utility REST endpoints\
    \ to encrypt and decrypt values that you pull or take out of your configuration.\
    \ Both of the endpoints are really, really easy to use.\n\n# Utility REST Endpoints:\
    \ Encrypt Values\n\n- Endpoint\n  - POST /encrypt\n- Example\n  - Request: /encrypt\n\
    \  - Data: <value_to_encrypt>\n\nThe first one is the encrypt endpoint, and you'd\
    \ use this to generate the encrypted values that you'll use in your configuration.\
    \ And it's really simple to use, like I said. All you do is send POST request\
    \ to the /encrypt endpoint, and you pass the value that you want to encrypt as\
    \ the body of the request. The Config Server will use its configured key, either\
    \ the symmetric or the asymmetric key, to encrypt that value. And again, I can't\
    \ stress this enough, make sure that this endpoint is secure using Spring Security\
    \ or any other means to ensure that this endpoint is only accessed by authorized\
    \ users.\n\n# Utility REST Endpoints: Decrypt Values\n\n- Endpoint\n  - POST /decrypt\n\
    - Example\n  - Request: /decrypt\n  - Data: <value_to_decrypt>\n\nThe decrypt\
    \ endpoint is literally almost identical to the encrypt endpoint with the exception\
    \ of the name and the inputs. And you'd mainly use this for debugging purposes.\
    \ So to decrypt a value, you would POST to /decrypt, and you would send the encrypted\
    \ value as the body of the request, and it would return to you the unencrypted\
    \ value.\n\n# Summary\n\n- The explosion of configuration in the cloud and the\
    \ need for a config server\n- Using the Spring Cloud Config Server & Client\n\
    - Updating configuration at runtime without restarting\n- Encrypting and decrypting\
    \ configuration\n\nWe've reached the end of this module, so let's take a moment\
    \ to review what we've learned. We've covered a lot of topics. We first talked\
    \ about the need for a Configuration Server in a cloud environment to manage the\
    \ explosion of configuration that comes with managing a distributed system. Then,\
    \ we saw how to configure the Spring Cloud Config Server to serve our configuration\
    \ files and how to use the Spring Cloud Config Client along with the bootstrap.properties\
    \ or the bootstrap.yml to retrieve the configuration during application initialization.\
    \ After that, we saw how we could brag to our colleagues about updating our configuration\
    \ at runtime without ever needing to restart our application server. We also saw\
    \ what gets automatically refreshed and what requires an @RefreshScope annotation.\
    \ And last, we finished out the module with a section on how to utilize the encryption\
    \ and decryption support within Spring Cloud Config.\n\n# Module 5: Mapping Services\
    \ Using Intelligent Routing\n\n## What Is Intelligent Routing?\n\nIn this module\
    \ we'll learn how to map our services in the cloud using Intelligent Routing.\n\
    \n- Routing in cloud native apps\n- Netflix Zuul\n  - Proxy server\n  - Setting\
    \ up routes\n  - Setting up filters\n\nWe'll begin by talking about what Intelligent\
    \ Routing is and what problem it solves for us. Then we'll introduce Netflix Zuul\
    \ as part of the Spring Cloud Netflix project. And we'll see how to set up a proxy\
    \ server, how to configure different routes, and how to set up filtering. Remember\
    \ that in order to be as dynamic and scalable as possible, a cloud-native system\
    \ is made up of individually deployable services, which together, as a whole,\
    \ form an overall system. With that comes some challenges though.\n\n## Challenges\
    \ with Individual Services\n\n- Different ports\n- Different addresses\n- Different\
    \ APIs & paths\n\nEach of the individual services may be running on a different\
    \ port, a different address, or a combination of both. And they'll also likely\
    \ have different paths and different APIs to interact with. And as a user or a\
    \ client of the individual services, which could easily be in the double or triple\
    \ digits, would be a nightmare. Instead, we can use Intelligent Routing to make\
    \ our application appear as if it were a single system. Similar to how a completed\
    \ puzzle appears as if it were a whole, but it's made up of several different\
    \ individual pieces.\n\n# Intelligent Routing via a Gateway Service\n\nRouting\
    \ is typically implemented via something called a gateway service, or an API Gateway.\
    \ And an API Gateway, or a gateway service, is defined as the single point of\
    \ entry for all clients. So in many ways the gateway service is a lot like the\
    \ front door to our system. And each of the individual services is located behind\
    \ this door, and all the requests must enter through it.\n\nA Gateway Service\
    \ Provides\n\n- Dynamic Routing & Delivery\n- Security & Filtering\n- Auditing\
    \ & Logging\n- Request Enhancement\n- Load Balancing\n- Different APIs for different\
    \ clients\n\nA gateway service not only provides dynamic routing and delivery,\
    \ which means at runtime it can decide where it should route a request and if\
    \ it should even route a request at all, but it also provides an array of other\
    \ functionalities. One of those pieces of functionality is security. It provides\
    \ the ability to authenticate all the incoming requests, as well as filter out\
    \ sort of illegitimate or bad request. And it's actually a really good candidate\
    \ for providing auditing and logging of requests since all of the requests must\
    \ enter through the gateway. It also provides something called request enhancement,\
    \ which is just a fancy way of saying that it can add additional information to\
    \ the request, or enrich the request, if you will. A concrete example of this\
    \ is the way Netflix uses their gateway. They use their gateway service to do\
    \ a geolocation lookup for all incoming requests, and they add that additional\
    \ information as an additional request header so that it's available for all downstream\
    \ services. The gateway service can also act as a load balancer for the individual\
    \ services that are behind it. Another interesting feature of the gateway service\
    \ is the ability to provide different APIs for different clients. APIs are not\
    \ a one-size-fits-all kind of thing, and different clients, such as web clients\
    \ or mobile clients, have different needs in the way they call your APIs. So,\
    \ for instance, it may be okay for a web client to interact with several endpoints\
    \ to accomplish some piece of functionality, but the same may not be true for\
    \ a mobile client, which may be better served with just a single endpoint.\n\n\
    # Using Netflix Zuul with Spring Cloud\n\nIntelligent Routing is implemented using\
    \ a combination of Spring Cloud and a project from Netflix. The project is called\
    \ Netflix Zuul, and it's pronounced Zool, which rhymes with the word tool. The\
    \ project page for the Netflix Zuul project defines it as a gateway service that\
    \ provides dynamic routing, monitoring, resiliency, security, and more. And the\
    \ name Zuul is actually a pretty good name as Zuul refers to a fictional, monster-like\
    \ character in the movie Ghostbusters that's the gatekeeper just like a gateway.\
    \ We'll talk about how you go about adding Spring Cloud and Netflix Zuul to a\
    \ project, and then we'll follow up with a live demo. Just like all the other\
    \ Spring Cloud projects, adding Spring Cloud and Netflix Zuul to your project\
    \ is really, really easy.\n\nUsing Spring Cloud & Netflix Zuul\n\n```xml\n<dependencyManagement>\n\
    \  <dependencies>\n    <dependency>\n      <groupId>org.springframework.cloud</groupId>\n\
    \      <artifactId>spring-cloud-dependencies</artifactId>\n      <version>Camden.SR2</version>\n\
    \      <type>pom</type>\n      <scope>import</scope>\n    </dependency>\n  </dependencies>\n\
    </dependencyManagement>\n```\n\nIn the dependencyManagement section of the pom.xml,\
    \ define a new dependency with a scope of import on spring-cloud-dependencies.\n\
    \n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n```\n\n\
    ```xml\n  <artifactId>spring-cloud-starter-zuul</artifactId>\n</dependency>\n\
    ```\n\nAnd still within the pom.xml, define a new dependency in the dependency\
    \ section on spring-cloud-starter-zuul. (Note: The OCR had \"artifactIdId\", corrected\
    \ to \"artifactId\").\n\n```java\n@SpringBootApplication\n@EnableZuulProxy\npublic\
    \ class Application {\n    public static void main(String[] args) {\n        SpringApplication.run(Application.class,\
    \ args);\n    }\n}\n```\n\nThen, in your main Application class, add the @EnableZuulProxy\
    \ annotation, and this is the annotation that turns your application into the\
    \ gateway service. From a configuration standpoint, you have two different options.\
    \ You can configure the gateway service to use service discovery or you can configure\
    \ it without service discovery.\n\n# Using Spring Cloud & Netflix Zuul with Service\
    \ Discovery\n\n```properties\napplication.properties\nspring.application.name=gateway-service\n\
    eureka.client.defaultZone=http://localhost:8761/eureka\n```\n\nOR\n\n```yaml\n\
    application.yml\nspring:\n  application:\n    name: gateway-service\neureka:\n\
    \  client:\n    defaultZone: http://localhost:8761/eureka\n``` (Note: Corrected\
    \ YAML indentation).\n\nIf you're using service discovery, define the usual parameters\
    \ for the name of the application and the location of the Service Discovery Server.\n"
  mdcn: "\n\n# 加密和解密 REST 端点\n\n一旦你配置了用于加密的 Config Server，你就可以利用一些工具类 REST 端点对你从配置中提取或获取的值进行加密和解密。这两个端点的使用都非常、非常简单。\n\
    \n# 工具类 REST 端点：加密值\n\n- 端点\n  - POST /encrypt\n- 示例\n  - 请求: /encrypt\n  - 数据:\
    \ <value_to_encrypt>\n\n第一个是加密端点，你会用它来生成在配置中将使用的加密值。正如我所说，它的使用非常简单。你只需要向 /encrypt\
    \ 端点发送 POST 请求，并将你想要加密的值作为请求体（body）传递过去。Config Server 将使用其配置的密钥（无论是对称密钥还是非对称密钥）来加密该值。再次，我必须强调这一点：请务必使用\
    \ Spring Security 或其他手段确保该端点是安全的，以便只有授权用户才能访问它。\n\n# 工具类 REST 端点：解密值\n\n- 端点\n\
    \  - POST /decrypt\n- 示例\n  - 请求: /decrypt\n  - 数据: <value_to_decrypt>\n\n解密端点与加密端点几乎完全相同，除了名称和输入之外。你主要将其用于调试目的。所以，要解密一个值，你需要向\
    \ /decrypt 发送 POST，并将加密值作为请求体发送，它将向你返回未加密的值。\n\n# 总结\n\n- 云端配置的爆炸式增长以及配置服务器的需求\n\
    - 使用 Spring Cloud Config Server & Client\n- 在不重启的情况下运行时更新配置\n- 加密和解密配置\n\n我们到了本模块的末尾，让我们花点时间回顾一下学的内容。我们涵盖了许多主题。首先，我们讨论了云环境中需要一个配置服务器来管理管理分布式系统时带来的配置爆炸式增长。然后，我们看到了如何配置\
    \ Spring Cloud Config Server 来为我们的配置文件服务，以及如何使用 Spring Cloud Config Client 配合\
    \ `bootstrap.properties` 或 `bootstrap.yml` 在应用初始化期间检索配置。之后，我们看到了如何向同事炫耀在无需重启应用程序服务器的情况下运行时更新配置。我们还了解了哪些内容会自动刷新，而哪些内容需要\
    \ `@RefreshScope` 注解。最后，我们通过关于如何利用 Spring Cloud Config 内部加密和解密支持的章节结束了本模块。\n\n\
    # 第 5 模块：使用智能路由映射服务\n\n## 什么是智能路由？\n\n在本模块中，我们将学习如何使用智能路由（Intelligent Routing）在云中映射我们的服务。\n\
    \n- 云原生应用中的路由\n- Netflix Zuul\n  - 代理服务器\n  - 设置路由\n  - 设置过滤器\n\n我们将首先讨论什么是智能路由以及它为我们解决了什么问题。然后，我们将介绍作为\
    \ Spring Cloud Netflix 项目一部分的 Netflix Zuul。我们将看到如何设置代理服务器、如何配置不同的路由，以及如何设置过滤。请记住，为了具有尽可能的动态性和可扩展性，云原生系统由可以独立部署的服务组成，这些服务共同构成了一个整体系统。尽管如此，这也带来了一些挑战。\n\
    \n## 独立服务的挑战\n\n- 不同的端口\n- 不同的地址\n- 不同的 API 与路径\n\n每个独立的服务可能运行在不同的端口、不同的地址，或者两者的结合。而且它们很可能拥有不同的路径和不同的\
    \ API 来进行交互。作为这些独立服务的用户或客户端（其数量可能很容易达到两位或三位数），这将会是一场噩梦。相反，我们可以使用智能路由让我们的应用程序看起来像是一个单一系统。就像一个完成的拼图看起来像是一个整体，但它是由几个不同的个体碎片组成的。\n\
    \n# 通过网关服务实现智能路由\n\n路由通常通过称为网关服务（gateway service）或 API 网关（API Gateway）的东西来实现。API\
    \ 网关或网关服务被定义为所有客户端的单一入口。在很多方面，网关服务就像我们系统的大门。每个独立的服务都位于这扇门后面，所有请求必须通过它进入。\n\n网关服务提供：\n\
    \n- 动态路由与交付\n- 安全与过滤\n- 审计与日志\n- 请求增强\n- 负载均衡\n- 针对不同客户端的不同 API\n\n网关服务不仅提供动态路由和交付（这意味着在运行时它可以决定应该将请求路由到哪里，甚至决定是否路由请求），还提供系列其他功能。这些功能之一就是安全。它提供了验证所有传入请求的能力，并过滤掉某些非法或错误的请求。由于所有请求都必须通过网关，它实际上是提供请求审计和日志的极佳选择。它还提供了所谓的请求增强（request\
    \ enhancement），这只是一个华丽的说法，意味着它可以向请求中添加额外信息，或者说，丰富请求的内容。这有一个具体的例子是 Netflix 使用他们网关的方式。他们使用网关服务对所有传入请求进行地理位置查找，并将该额外信息作为额外的请求头（header）添加，以便所有下游服务都能使用。网关服务还可以作为其后面独立服务的负载均衡器。网关服务的另一个有趣功能是为不同的客户端提供不同的\
    \ API。API 并不是一成不变的，不同的客户端（例如 Web 客户端或移动客户端）在调用你的 API 方面有不同的需求。因此，对于不同的客户端，提供不同的\
    \ API 是非常合适的。\n\n# 使用 Spring Cloud 使用 Netflix Zuul\n\n智能路由是通过 Spring Cloud 和一个\
    \ Netflix 项目组合实现的。该项目被称为 Zuul，它的发音与 \"tool\"（工具）相同。Zuul 这个名字其实是个很好的名字，因为它指的是电影《捉灵敢卫队》（Ghostbusters）中的一个虚构角色，就像一个关守者一样。我们将讨论如何将\
    \ Spring Cloud 和 Netflix Zuul 添加到项目中，然后进行现场演示。正如所有其他 Spring Cloud 项目一样，将 Spring\
    \ Cloud 和 Netflix Zuul 添加到项目中非常、非常简单。\n\n使用 Spring Cloud Netflix Zuul\n\n```xml\n\
    <dependencyManagement>\n  <dependencies>\n    <dependency>\n      <groupId>org.springframework.cloud</groupId>\n\
    \      <artifactId>spring-cloud-dependencies</artifactId>\n      <version>Camden.SR2</version>\n\
    \      <type>pom</type>\n      <scope>import</scope>\n    </dependency>\n  </dependencies>\n\
    </dependencyManagement>\n```\n\n在 `pom.xml` 的 `dependencyManagement` 部分，定义一个范围为\
    \ `import` 的 `spring-cloud-dependencies` 依赖。\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    ```\n\n```xml\n  <artifactId>spring-cloud-starter-zuul</artifactId>\n</dependency>\n\
    ```\n\n仍然在 `pom.xml` 的 `dependency` 部分，定义一个 `spring-cloud-starter-zuul` 依赖。\n\n\
    ```java\n@SpringBootApplication\n@EnableZuulProxy\npublic class Application {\n\
    \    public static void main(String[] args) {\n        SpringApplication.run(Application.class,\
    \ args);\n    }\n}\n```\n\n然后，在你的主 Application 类中，添加 `@EnableZuulProxy` 注解，这个注解将你的应用程序转换为网关服务。从配置的角度来看，你有两种不同的选项。你可以配置网关服务使用服务发现，也可以在不使用服务发现的情况下配置。\n\
    \n# 使用 Spring Cloud & Netflix Zuul 使用服务发现\n\n```properties\napplication.properties\n\
    spring.application.name=gateway-service\neureka.client.defaultZone=http://localhost:8761/eureka\n\
    ```\n\n或者\n\n```yaml\napplication.yml\nspring:\n  application:\n    name: gateway-service\n\
    eureka:\n  client:\n    defaultZone: http://localhost:8761/eureka\n``` （修正了 YAML\
    \ 缩进）。\n\n如果你使用服务发现，请按照常规定义应用程序名称和服务发现服务器位置的参数。\n\n"
