    ,\n      \"source\":{\n        \"some.property\":\"global\",\n        \"some.other.property\"\
    :\"global\"\n      }\n    }\n  ]\n```\n\nIf we modify the URL and replace default\
    \ with prod, we'll see that it brings in the config-client-app-prod.properties\
    \ file, which overrides all of the property sources below it. Don't forget that\
    \ we also have a couple other endpoints, like an endpoint to request the .properties\
    \ file or the .yml file.\n\n```properties\nsome.other.property: global\nsome.property:\
    \ app specific overridden value\n```\n\nSo if we go up here, we take out /prod\
    \ and replace it with .properties,\nwe'll see that it returns back a properties\
    \ file. And you'll see that it's actually applied all of the property sources\
    \ in the order which take precedence. So you see that some.other.property is still\
    \ global, but some.property was overridden by the app specific overridden value.\n\
    \n```yaml\nsome:\nother:\n  property: global\nproperty: app specific overridden\
    \ value\n```\n\nAnd you can do the same thing with YAML.. It will actually convert\
    \ the source.properties files into YAML format for you. So instead of .properties,\
    \ we'll replace this with .yml, and we hit Return, and you can see that it output\
    \ the same configuration in YAML format.\n\n# Using the Spring Cloud Config Client\n\
    \nNow that we've seen how the Spring Cloud Config Server works and how to get\
    \ one set up, let's look at the other end of the equation, the Client. At its\
    \ core, the Config Client is responsible for bootstrapping and fetching application\
    \ configuration. What do I mean when I say that the Config Client is responsible\
    \ for bootstrapping application configuration? Well, when a Spring application\
    \ starts up, it needs to resolve its property sources. And it needs to do that\
    \ early on in the startup process. Some of the reasons for that are things like\
    \ your placeholders. When you resolve those, it needs to actually have the values\
    \ to resolve the placeholders. And since the configuration lives on the Configuration\
    \ Server, that means that the Config Client needs to fetch the application configuration\
    \ before the Spring application context has even technically started. If it waited\
    \ until the application was started, it would be too late in the process. There\
    \ are two ways that you can get the Config Client to bootstrap your application\
    \ properties, and they both use a special file called the bootstrap.properties\
    \ or the bootstrap.yml. The first way is Config First, and you do that by configuring\
    \ a bootstrap.yml or bootstrap.properties that has the application name, as well\
    \ as the URL to the Configuration Server. The second way is Discovery First, and\
    \ that's using service discovery. So you would configure your bootstrap.properties\
    \ or bootstrap.yml to have the application name and the location of the Service\
    \ Discovery Server. And it would use that to find the Config Server so that it\
    \ could fetch your configuration. Setting up an application to use the Spring\
    \ Cloud Config Client is even easier than setting up the Spring Cloud Config Server.\n\
    \n```xml\npom.xml :\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\nIn your\
    \ pom.xml, you import the spring-cloud-dependencies within the dependencyManagement\
    \ section.\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-config-client</artifactId>\n</dependency>\n```\n\n\
    Then within the dependency section, still within your pom.xml, define a new dependency\
    \ on spring-cloud-config-client. Then we need to configure how the Config Client\
    \ will bootstrap the configuration. If you're using Config First, you define a\
    \ bootstrap.properties or a bootstrap.yaml.\n\nbootstrap.properties:\n```properties\n\
    spring.application.name=<your_app_name>\nspring.cloud.config.uri=http://localhost:8888/\n\
    ```\n\nOR\n\n```yaml\nbootstrap.yml :\nspring:\n  application:\n    name: <your_app_name>\n\
    \  cloud:\n    config:\n      uri: http://localhost:8888/\n```\n\nAnd you define\
    \ the spring.application.name property, and this is the name of your application.\
    \ It will use this when it calls the Spring Cloud Config Server's REST services\
    \ to find the appropriate configuration. And then the next property is the spring.cloud.config.uri\
    \ property, and you would set that to the location of your Config Server. In this\
    \ example I've just used localhost here. If you're using a Discovery First to\
    \ bootstrap the Config Client, the configuration is similar to the one we just\
    \ looked at, but it's slightly different.\n\n```properties\nbootstrap.properties\
    \ :\nspring.application.name=<your_app_name>\nspring.cloud.discovery.enabled=true\n\
    ```\n\nOR\n\n```yaml\nbootstrap.yml :\nspring:\n  application:\n    name: <your_app_name>\n\
    \  cloud:\n    discovery:\n      enabled: true\n```\n\nAnd you define the spring.application.name\
    \ property, and this is the name of your application. It will use this when it\
    \ calls the Spring Cloud Config Server's REST services to find the appropriate\
    \ configuration.\n\n# Retrieving Configuration with the Config Client\n\nIn this\
    \ demo, we'll see how to use service discovery to locate the Config Server. So\
    \ if you haven't already completed the Discovery module, you'll need the Discovery\
    \ Server and import it into your IDE. It's pretty simple. Next we need to make\
    \ a couple of modifications to the Config Server so that it will register itself\
    \ with the Discovery Server.\n\n```java\npackage io.ajay.kumar.configserver;\n\
    \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.cloud.config.server.EnableConfigServer;\n\n@SpringBootApplication\n\
    @EnableConfigServer\n@EnableDiscoveryClient\npublic class ConfigServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigServerApplication.class,\
    \ args);\n    }\n}\n```\n\nExpand the config-server and go to the main application\
    \ class. Underneath the @EnableConfigServer add an @EnableDiscoveryClient annotation.\
    \ Save that, and then open up the application.properties in the src/main/resources.\n\
    \n```properties\napplication.properties\nserver.port=8888\nspring.cloud.config.server.git.uri=https://github.com/ajaycucek/config-repository.git\n\
    spring.application.name=configserver\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nWe'll add two different properties. The first one is spring.application.name,\
    \ and we're going to set that to equal to configserver. No spaces. And then we\
    \ also need to set the location of the Discovery Server so it knows where to register\
    \ itself. We do eureka.client.service-url.defaultZone, and then we set that to\
    \ localhost:8761/eureka.\n"
