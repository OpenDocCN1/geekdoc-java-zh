- md: "\nThis should load up the Hystrix Dashboard. And before we view any metrics,\
    \ we'll need to actually generate some metrics. So open up a new tab and visit\
    \ your weather app at localhost:8000/current/weather.\n\nAnd just go ahead and\
    \ refresh that a few times to get some metrics generated. Back at the Hystrix\
    \ Dashboard, we'll put in the URL to the Hystrix stream of our weather app. So\
    \ that's http://localhost:8000/hystrix.stream. And for the title of your dashboard,\
    \ we'll say Weather App. Next, click the Monitor Stream button, and you should\
    \ be presented with some metrics.\n\nIf you don't see metrics right away, you\
    \ can flip back and forth between your weather app and refreshing it to generate\
    \ some metrics and back to the dashboard to see the effect of those requests.\n\
    \n# Aggregating Hystrix Metrics with Netflix Turbine\n\nHystrix metrics are tracked\
    \ on a service-by-service basis. Now a single Hystrix stream might have metrics\
    \ on more than one Hystrix protected call, but those metrics are only for that\
    \ service. and the implications of this are that every service has its own Hystrix\
    \ stream URL that you need to use to consume its metrics. If you wanted to track\
    \ the metrics for multiple services, you'd have to open up multiple Hystrix Dashboards\
    \ and track them independently. And I'm sure you can imagine how much of a pain\
    \ that would be if you had tens or even hundreds of services made up your application.\
    \ To solve this, Netflix developed a tool called Turbine that aggregates many\
    \ Hystrix streams into one. To give you a better understanding of how this might\
    \ look, let's look at a screenshot from the Hystrix Dashboard.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_196_0.png)\n\
    \nIn the screenshot, you can see there are two protected calls, the getCurrentWeather\
    \ call and the getCurrentDatetime call. And the protected call on the left is\
    \ from a service located on localhost:8080, and the one on the right is from another\
    \ service located on localhost:8181. And Turbine has brought both of these metrics\
    \ together from different services, all viewable in the same dashboard.\n\n# Using\
    \ Spring Cloud and Netflix Turbine\n\nSo how do we start using Turbine? Well,\
    \ if you've been following along throughout the book, you can probably already\
    \ guess.\n\n```\npom.xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type><scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\nYou start\
    \ by defining a new dependency on spring-cloud-dependencies in the dependencyManagement\
    \ section of your pom.xml. As always, make sure that it's of type pom and has\
    \ a scope of import.\n\n```\npom.xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-turbine</artifactId>\n</dependency>\n```\n\
    \nThen, still within your pom.xml, in the dependency section, define a new dependency\
    \ on spring-cloud-starter-turbine. Follow that up by adding a new annotation to\
    \ your main Application class, the @EnableTurbine annotation.\n\n```\n@SpringBootApplication\n\
    @EnableTurbine\npublic class Application{\n    public static void main(String[]args)\
    \ {\n        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n\
    And last, we have a little bit of configuration to add. In your application.properties\
    \ or your application.yml, we're going to add two new properties.\n\napplication.properties\n\
    turbine.app-config=<list_of_service_ids>\nturbine.cluster-name-expression='default'\n\
    \nOR\n\napplication.yml\nturbine:\n  appConfig:<list_of_service_ids>\n  clusterNameExpression=\"\
    default\"\n\n- In addition to the standard spring application name and discovery\
    \ server location properties\n- The first property is the turbine.app-config property,\
    \ and you set this to a comma-separated list of service IDs. And these are the\
    \ same service IDs that you use for service discovery. The second property, the\
    \ turbine.cluster-name-expression property, can be a Spring Expression Language\
    \ value to your cluster. And in Turbine, a cluster is just a grouping of services\
    \ that need to be monitored together. And for our purposes, to make things easy,\
    \ we're going to set that value to default surrounded by single quotes.\n- And\
    \ a note here is if you're using YAML instead of properties, you'll need to escape\
    \ the single quotes with double quotes.\n\nOnce you have everything configured\
    \ and your Hystrix Dashboard is started up, instead of entering the hystrix.stream\
    \ URL, you'd enter the URL of your Turbine server and end it with turbine.stream.\
    \ Let's apply the stuff we learned by created our own Turbine server, and we can\
    \ use it to to aggregate the stream of our service we created in the previous\
    \ demo along with a new service.\n\n# Demo: Aggregating Multiple Hystrix Streams\
    \ with Turbine\n\nIn this demo, we'll utilize Turbine to combine the Hystrix streams\
    \ from two different services so that they're both viewable in the same dashboard.\
