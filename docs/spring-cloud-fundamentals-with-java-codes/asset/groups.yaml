  - "[PAGE 32]\n\n# # The Application Client\n\n+   > Calls another application service\
    \ to implement its functionality\n> The issuer of requests\n> Depends on other\
    \ service(s)\n> User of the discovery clients\n  - Find service locations\n\n\
    Let's continue with our deep dive of the components involved in service discovery.\
    \ Up next is the application client is the piece that would call out to another\
    \ application service to implement some piece of functionality in its service.\
    \ It's the issuer of requests, and it depends on other services. And similar to\
    \ the application service, the application client is also a user of the discovery\
    \ client, but the discovery client in a different way. It doesn't use it to to\
    \ register or deregister anything. It uses it to find service locations. To be\
    \ clear, it's perfectly reasonable for an application to be both a service and\
    \ a client. An application can be a service, which provides services to others,\
    \ and at the same time can be a client, which depends on other services. What\
    \ we're referring to is if the application was just a client and it wasn't a service.\
    \ The steps involved to set up a client are quite similar to the steps involved\
    \ to set up a service.\n\n+   > Using Spring Cloud Eureka Client in an Application\
    \ Client\n\n```\npom.xml:\n<dependencyManagement>\n<dependencies>\n  <dependency>\n\
    \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-dependencies</artifactId>\n\
    \    <version>Camden.SR2</version>\n    <type>pom</type>\n```"
