  - '[PAGE 107]


    # Configuring Routes in Netflix Zuul


    Once you have everything configured, the next step is to define how Zuul should
    route requests. The default routing behavior when Zuul is set up using service
    discovery is to route requests by service name.


    Default Route to Service Resolution with Service Discovery


    Request: /foo maps to Service: spring.application.name=foo

    Request: /foo maps to Service: spring.application.name=categories


    So for example, if you requested /foo, Zuul would use service discovery to find
    the service with a name of foo and send that request to 1 service. Here''s another
    example. If you were to request /categories/1, Zuul would locate the service with
    the name categories, and it would send the /1 request to that service. By default,
    the prefix is stripped from the request, so the service actually gets the /1 part
    of the request. If you wanted to send the full request, the /categories/1, you
    could set the property zuul.stripPrefix to false, and the service would get the
    request /categories/1. Also note that all services are added by default, so you''ll
    want to use the zuul.ignoredServices, and you could set that to a pattern to ignore
    specific services.


    Netflix Zuul with Service Discovery:Precise Routing


    ```

    application.properties

    spring.application.name=gateway-service

    zuul.routes.<route_name>.path=/somepath/**

    zuul.routes.<route_name>.serviceId=some_service_id

    zuul.ignored-services=some_service_id

    ```


    OR'
