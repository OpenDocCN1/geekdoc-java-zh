    # Demo: Customizing the RibbonClient Load Balancing Strategy


    In this demo, we''ll learn how to customize our Ribbon client that we''re using
    to call the ribbon-time-service. And again, we''re going to be building on the
    previous demo. Make sure that you''ve completed the demo where you set up a Ribbon
    client without using service discovery. The first thing we''ll do is come up to
    the green Play button and start each of the instances of the ribbon-time-service.
    Both of the ribbon-time-service instances are started. Now remember, in order
    to create custom configuration for a Ribbon client, we need to create our own
    @Configuration class. Let''s open the ribbon-time-app project and create a new
    package. So right-click, New, and come here to Package. And we''re actually going
    to rename this from io.ajax.kumar to io.ajay.config.kumar. Remember that we want
    to have a different package name so that the @Configuration class is not subject
    to component scanning; otherwise, it would apply to all of our Ribbon clients.
    In the new package, right-click and go to New and choose Class. And we''ll call
    this RibbonTimeConfig class. Go ahead and click Finish.


    ```

    package io.ajay.config.kumar;

    import org.springframework.context.annotation.Bean;

    import org.springframework.context.annotation.Configuration;

    import com.netflix.loadbalancer.IRule;

    import com.netflix.loadbalancer.RandomRule;

    @Configuration

    public class RibbonTimeConfig {

    @Bean

    public IRule ribbonTimeRule() {

    return new RandomRule();

    }

    }

    ```'
