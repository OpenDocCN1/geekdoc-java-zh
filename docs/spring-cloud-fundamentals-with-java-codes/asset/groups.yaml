    \ with status UP (replication=true)\n```\n\n## 应用程序客户端 (Application Client)\n\n\
    - 调用另一个应用程序服务来实现其功能\n- 请求发布者\n- 依赖其他服务\n- 发现客户端的用户\n- 查找服务位置\n\n让我们继续深入探讨参与服务发现的组件。接下来是“应用程序客户端”，它是负责调用其他应用程序服务以来实现其服务中某些功能的部分。它是请求的发布者，并依赖于其他服务。与应用程序服务类似，应用程序客户端也是发现客户端的用户，但方式不同。它不是使用它来注册或注销任何内容，而是使用它来查找服务位置。明确一下，一个应用程序既是服务又是客户端是完全合理的。\n\
    \n### 应用程序客户端详情\n\n| 特性 (Feature) | same (Description) |\n| :--- | :--- |\n| 角色\
    \ (Role) | 请求发布者 |\n| 依赖 (Dependency) | 依赖其他服务 |\n| 发现 (Discovery Usage) | 发现客户端的用户\
    \ |\n| 目的 (Purpose) | 查找服务位置 |\n\n让我们继续深入探讨参与服务发现的组件。接下来是应用程序客户端，它是负责调用另一个应用程序服务以来实现其服务中某些功能的部分。它是请求的发布者，并依赖于其他服务。与应用程序服务类似，应用程序客户端也是发现客户端的用户，但方式不同。它不是使用它来注册或注销任何内容，而是使用它来查找服务位置。明确一下，一个应用程序既是服务又是客户端是完全合理的。\n\
    \n### 实现细节\n\n明确一下，一个应用程序既是服务又是客户端是完全合理的。\n\n#### 依赖选项\n\n- 使用 EurekaClient\n\
    - 使用 DiscoveryClient\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
    \    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>\n</dependency>\n\
    ```\n\n#### 配置\n\n```xml\n<groupId>org.springframework.cloud</groupId>\n<artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>\n\
    ```\n\n```yaml\nspring:\n  application:\n    name: service\n  eureka:\n    client:\n\
    \      service-url:\n        defaultZone: http://localhost:8761/\n      register-with-eureka:\
    \ false\n```\n\n```java\n@SpringBootApplication\n@EnableDiscoveryClient\npublic\
    \ class Application {\n    public static void main(String[] args) {\n        SpringApplication.run(Application.class,\
    \ args);\n    }\n}\n```\n\n## Demo：作为应用程序客户端查找并调用服务\n\n为了创建我们的客户端，我们将再次从 start.spring.io\
    \ 开始。我们将给它一个相同的 group ID，即 io.ajay.kumar，并把 Artifact 命名为 client。它将具有我们在应用程序服务中使用的相同依赖项。我们需要\
    \ Eureka Discovery、DevTools 以及 Actuator。\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_36_0.png)\n"
