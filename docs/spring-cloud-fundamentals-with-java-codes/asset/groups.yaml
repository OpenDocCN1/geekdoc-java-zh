    \ route and filter our requests and responses to and from back-end services.\n\
    \n# Module 6: Calling Services Using Client-side Load Balancing\n\n# Module Introduction\n\
    \nIn this module we'll learn how to utilize client-side load balancing to distribute\
    \ the workload of a service in a cloud-native application.\n\n- Load balancing\n\
    \  - Server-side\n  - Client-side\n- Netflix Ribbon\n  - With & without service\
    \ discovery\n    - @LoadBalanced\n    - @RibbonClient\n  - Custom Ribbon configuration\n\
    \nWe'll start off with what is load balancing, and what role does it play in a\
    \ cloud-native application? Then we'll talk about traditional server-side load\
    \ balancing. Then we'll introduce client-side load balancing, what it is and how\
    \ it differs from server-side balancing. Next, we'll introduce Netflix Ribbon\
    \ and how we can utilize it with Spring Cloud to implement client-side load balancing.\
    \ We'll learn how to implement it with and without service discovery using two\
    \ new annotations: the @LoadBalanced annotation and the @RibbonClient annotation.\
    \ We'll finish off the module with a section on how to customize Ribbon's configuration\
    \ for things like load balancing algorithms or different ways to check the health\
    \ of a service before sending a request to it.\n\n# Client-side vs. Server-side\
    \ Load Balancing\n\nSo what is load balancing? Simply put, load balancing is a\
    \ way to improve the distribution of workload across computing resources. And\
    \ you probably already know that, so the more important question is what role\
    \ for having multiple instances of a single application does load balancing play\
    \ in a cloud-native architecture? And the answer to that is actually a very important\
    \ one, probably even more important than in a non-cloud native architecture. And\
    \ the reason for that becomes clearer when you look at the differences in the\
    \ architecture. In a non-cloud-native application, you go from having multiple\
    \ instances of a single application with a single load balancer to multiple services\
    \ with multiple instances and multiple loadancers. And you can start to see the\
    \ importance of a load balancer just by the sheer number of loadancers that we\
    \ need in a cloud-native application. There are typically two different types\
    \ of loadancers. There's the server-side load balancer where the server is responsible\
    \ for the distribution of the load, and there the client-side load balancer where\
    \ the caller is responsible for the distribution of the load. Let's take a look\
    \ at each of these in a bit more detail. With server-side load balancing, a request\
    \ to another service in front of the service, which then decides which of the\
    \ multiple instances it should forward the request to. With client-side load balancing,\
    \ there is no intermediary. The client, or the caller of the service, is aware\
    \ of all of the instances of a service via a known list or service discovery.\
    \ The client is responsible for deciding which of the multiple instances it should\
    \ send the request to.\n\n- Server-side\n  - Server distributes requests\n  -\
    \ Hardware or software based\n"
