    # Putting It All Together: On Startup


    Now that we''ve recapped all of the pieces involved, let''s take a moment to look
    at how they all interact with each other, specifically on startup.


    ![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_212_0.png)


    It all starts with the Service Discovery Server. Each and every instance of every
    piece of the system registers itself with the Service Discovery Server upon startup.
    And then it also receives a reply with the location of other registered services.
    For application services, this reply is very important because it tells them where
    the location of the Configuration Server is at.


    ![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_212_1.png)'
  - '[PAGE 213]


    And once they know the location of the Configuration Server, they can make a request
    to retrieve any configuration that will ultimately be used to bootstrap their
    startup process.'
  - '[PAGE 214]


    # # Putting It All Together: On Request


    Now that we have all of our application and their supporting services started,
    let''s look at how they all interact with each other during a request.


    ![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_214_0.png)


    The request for a given path begins at the gateway server, Netflix Zuul in our
    case. And Zuul will match the path to a given service ID, and then it will use
    service discovery, either by requesting it from the Service Discovery Server or
    via a previously cached result, to locate the service that will handle that path.
    Once the service is located, it''ll make a Hystrix-protected call to the service
    using Ribbon to handle the client-side load balancing of which instances it should
    send the traffic to. In our example, the request was sent to Service A. Now, suppose
    that Service A also depends on Service B to fulfill the request. Upon receiving
    the request, Service A will utilize discovery to locate Service B. And it''ll
    either via a previously cached result or by requesting it from the Service Discovery
    Server. Next, it''ll make a Hystrix-protected call using Ribbon for client-side
    load balancing to one of the instances of Service B. Service B will respond to
    Service A, and then Service A will respond to the gateway, and finally, the gateway
    will respond to the original request.'
