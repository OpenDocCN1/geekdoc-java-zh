    \ Navigate to main application class, right-click on it, go to Run As, choose\
    \ Spring Boot App. Once the Service Discovery Server is started, navigate to the\
    \ main\n"
  mdcn: "\n类似于返回缓存数据、默认值，或者只是一个空响应。除了断路器（Circuit Breaker）模式外，Hystrix 还具有额外的功能来保护服务不被过载。所有\
    \ Hystrix 封装的调用都受到线程池或信号量的限制。这样做的作用是限制资源的使用，正如我们之前讨论过的那样，以防止请求堆积并耗尽所有宝贵的资源。在所有可用资源都被用尽的情况下，任何新请求将立即失败并执行回退方法（fallback\
    \ method），如果存在可用的话。\n\n# 使用 Spring Cloud 和 Netflix Hystrix\n\n使用 Spring Cloud\
    \ 和 Netflix Hystrix 极其简单。在我们开始之前，简单说明一下：我将解释启动所需的所有步骤，并在最后带你完成一个演示，你可以跟上操作。在该模块的剩余部分中，我将遵循这种模式，但请记住这一点。\n\
    \n```xml\npom.xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\n就像你使用所有其他\
    \ Spring Cloud 项目一样，首先在 `pom.xml` 的 `dependencyManagement` 部分包含 `spring-cloud-dependencies`\
    \ 依赖。像既往一样，确保它的类型为 `pom` 且范围为 `import`。\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-hystrix</artifactId>\n</dependency>\n<dependency>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-actuator</artifactId>\n\
    ```\n\n```xml\n</dependency>\n```\n\n然后，同样在你的 `pom.xml` 中，在 `dependency` 部分，定义一个对\
    \ `spring-cloud-starter-hystrix` 的新依赖。如果你想能够获取（consume） Hystrix 调用的指标，你还需要包含 `spring-boot-actuator`\
    \ 的依赖。\n\n```java\n@SpringBootApplication\n@EnableCircuitBreaker\npublic class\
    \ Application{\n    public static void main(String[] args){\n        SpringApplication.run(Application.class,args);\n\
    \    }\n}\n```\n\n在你的主 `Application` 类中，你定义一个新的注解，即 `@EnableCircuitBreaker` 注解。\n\
    \n```java\n@Service\npublic class Service{\n    @HystrixCommand(fallbackMethod=\"\
    somethingElse\")\n    public void doSomething(){\n        ...\n    }\n    public\
    \ void somethingElse(){\n        ...\n    }\n}\n```\n\n然后在你的 `@Component` 或 `@Service`\
    \ 类中，找到你想要用 Hystrix 封装的方法，在我们案例中，这是一个名为 `doSomething` 的方法，并在该方法上标记为 `@HystrixCommand`。然后，在\
    \ `@HystrixCommand` 注解上，定义一个名为 `fallbackMethod` 的新属性，并将其设置为发生故障时你想要回退的方法名称。在代码方面，就是这些。\n\
    \n- **小心处理 Hystrix 超时**\n  - 确保超时时间包含调用者超时以及任何重试\n  - 默认值：1000ms\n  - hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds<timeout_ms>\n\
    \n但有一个你必须注意的坑，就是关于 Hystrix 超时的。你需要确保你的 Hystrix 超时包含了调用者超时加上任何重试时间，然后留出一点缓冲区。默认超时设置为\
    \ 1000ms（即 1 秒），如果你需要更改它，可以使用这个长属性以毫秒为单位设置超时。\n\n# 演示：使用 Netflix Hystrix 实现故障错\n\
    \n在这个演示中，我们将构建一个简单的天气服务，返回随机的天气状况，然后在另一个消费该服务的应用中使用它。在天气应用中，我们将使用 Hystrix 保护对天气服务的调用，并为天气服务宕机或无响应的情况实现回退。我们将使用服务发现来从天气应用中定位天气服务，因此请确保已经在\
    \ IDE 中设置了服务发现服务器（Service Discovery Server）。如果你一直跟着课程学习，你应该已经设置好了。现在打开浏览器并前往 start.spring.io。在\
    \ Group 部分，将 group 更改为 `io.ajay.kumar`，然后对于 artifact 的名称，将其命名为 `weather-service`。在\
    \ Dependencies 部分，添加 Web 依赖和 Eureka Discovery 依赖。\n\n# 使用 Java 和 Spring Boot 生成\
    \ Maven 项目\n\n## 2.1.1 项目元数据\n\n| Artifact coordinates | | |\n| :--- | :--- |\n\
    | Group | io.ajay.kumar |\n| Artifact | weather-service |\n\n## Dependencies (依赖)\n\
    \n### 向你的应用添加 Spring Boot Starters 和依赖\n\n**搜索依赖：**\nWeb, Security, JPA, Actuator,\
    \ Devtools...\n\n**已选依赖：**\n- Web\n- Eureka Discovery\n\n**生成项目** (Alt + Enter)\n\
    \n一旦填写完所有，点击 Generate Project 按钮，它将为你创建并下载一个 zip 文件。我们还将使用此页面来生成天气应用项目，所以在此页面上将\
    \ artifact 的名称从 weather-service 改为 weather-app。\n"
