- md: "\nRemember that there's no special annotation that we need to add for the Config\
    \ Client to get its configuration. As long as the libraries are on the class path\
    \ and the setup is correct, it should be able to find the configuration from the\
    \ Configuration Server.\n\n```java\npackage io.ajay.kumar.configclientapp;\nimport\
    \ org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n@SpringBootApplication\n\
    @EnableDiscoveryClient\npublic class ConfigClientAppApplication {\n    public\
    \ static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppConfiguration.class,\
    \ args);\n    }\n}\n```\n\nWe, do want to participate in service discovery, so\
    \ let's add the @EnableDiscoveryClient annotation. Go ahead and save that. Next\
    \ let's create a new class. So New, Class, and we're going to call this class\
    \ the ConfigClientConfiguration class. Go ahead and click Finish.\n\n```java\n\
    package io.ajay.kumar.configclientapp;\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\
    import org.springframework.stereotype.Component;\n@Component\n@ConfigurationProperties(prefix=\"\
    some\")\npublic class ConfigClientAppConfiguration {\n    private String property;\n\
    \    public String getProperty() {\n        return property;\n    }\n    public\
    \ void setProperty(String property) {\n        this.property = property;\n   \
    \ }\n}\n```\n\nLet's go ahead and annotate this with @Component and also @ConfigurationProperties.\
    \ And we're going to give this a prefix equal to some. This ConfigurationProperties\
    \ is going to represent our property that's named some.property. We'll have an\
    \ instance variable that is a string, so private String property. And the name\
    \ of it is called property, again, to represent some.property. And make sure that\
    \ you don't forget the getters and setters. You can do that by going to Source,\
    \ Generate Getters and Setters, choose the property, click OK, and save that file.\
    \ Head back to the main application class, and let's autowire our configuration\
    \ properties class.\n\n```java\npackage io.ajay.kumar.configclientapp;\nimport\
    \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.beans.factory.annotation.Value;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.client.discovery.EnableDiscoveryClient;\nimport\
    \ org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    @SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ ConfigClientAppApplication {\n    @Autowired\n    private ConfigClientAppConfiguration\
    \ properties;\n    @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n\nSo go in here, we're going to do private\
    \ ConfigClientAppConfiguration, and we'll call this this properties. And we'll\
    \ @Autowired it. You could also use @Inject here. We'll add another instance variable,\
    \ private String someOtherProperty, and we're going to give this an @Value annotation.\
    \ And we're going to add the placeholder format to inject the someOtherProperty\
    \ value, so ${some.other.property}.\n\nNow we're going to add an @RestController\
    \ annotation to the main application class. So come up here underneath the @EnableDiscoveryClient,\
    \ and you're going to do @RestController. Go ahead and save. And that note you\
    \ wouldn't put a REST controller on your main application class; however, since\
    \ we're just demoing modify concepts, it's okay for now. We also need to add the\
    \ handler method, so we come down here main, do public String printConfig(). And\
    \ then we're going to annotate this with @RequestMapping. In the body of the method,\
    \ we're going to construct a string that has the values of each of the configuration\
    \ properties that were retrieved from the Configuration Server. So we're going\
    \ to need a string builder, so StringBuilder sb = new StringBuilder(). And then\
    \ we're going to say sb.append. And then we're going to get the first value, which\
    \ is properties.getProperty(). And then we're going to separate it with a double\
    \ sb.append, space, ||, and then sb.append the someOtherProperty value. And last,\
    \ we want to return sb.toString(). Next, let's go ahead and close both of these\
    \ files. And within the src/main/resources, create a new file bootstrap.properties.\n\
    \n**bootstrap.properties:**\n```properties\nspring.application.name=config-client-app\n\
    spring.cloud.config.discovery.enabled=true\neureka.client.server-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nWithin the bootstrap.properties, set the spring.application.name property\
    \ to the value config-client-app. Then we're going to set to another property\
    \ which tells the Config Client to find the Config Server via service discovery,\
    \ so spring.cloud.config.discovery.enabled=true. eureka.client.server-url.defaultZone=http://localhost:8761/eureka.\n"
  mdcn: "\n请记住，我们不需要为 Config Client 添加任何特殊的注解来获取其配置。只要库在类路径上且设置正确，它应该能够从 Configuration\
    \ Server 获取配置。\n\n```java\npackage io.ajay.kumar.configclientapp;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    @SpringBootApplication\n@EnableDiscoveryClient\npublic class ConfigClientAppApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppConfiguration.class,\
    \ args);\n    }\n}\n```\n\n我们确实想要参与服务发现，所以让我们添加 @EnableDiscoveryClient 注解。继续并保存它。接下来，让我们创建一个新类。点击\
    \ New、Class，我们将这个类命名为 ConfigClientConfiguration。点击 Finish。\n\n```java\npackage\
    \ io.ajay.kumar.configclientapp;\nimport org.springframework.boot.context.properties.ConfigurationProperties;\n\
    import org.springframework.stereotype.Component;\n@Component\n@ConfigurationProperties(prefix=\"\
    some\")\npublic class ConfigClientAppConfiguration {\n    private String property;\n\
    \    public String getProperty() {\n        return property;\n    }\n    public\
    \ void setProperty(String property) {\n        this.property = property;\n   \
    \ }\n}\n```\n\n让我们在这个类上添加 @Component 和 @ConfigurationProperties 注解。我们将给它设置一个等于\
    \ some 的前缀。这个 ConfigurationProperties 将代表我们名为 some.property 的属性。我们将有一个字符串类型的实例变量，即\
    \ private String property。它的名字也叫 property，再次代表 some.property。确保你没有忘记 getter 和\
    \ setter。你可以通过进入 Source、Generate Getters and Setters、选择 property、点击 OK 并保存文件来实现。返回主应用程序类，让我们注入（autowire）我们的配置属性类。\n\
    \n```java\npackage io.ajay.kumar.configclientapp;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
    import org.springframework.beans.factory.annotation.Value;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.client.discovery.EnableDiscoveryClient;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    @SpringBootApplication\n@EnableDiscoveryClient\n@RestController\npublic class\
    \ ConfigClientAppApplication {\n    @Autowired\n    private ConfigClientAppConfiguration\
    \ properties;\n    @Value(\"${some.other.property}\")\n    private String someOtherProperty;\n\
    \n    public static void main(String[] args) {\n        SpringApplication.run(ConfigClientAppApplication.class,\
    \ args);\n    }\n\n    @RequestMapping\n    public String printConfig() {\n  \
    \      StringBuilder sb = new StringBuilder();\n        sb.append(properties.getProperty());\n\
    \        sb.append(\" || \");\n        sb.append(someOtherProperty);\n       \
    \ return sb.toString();\n    }\n}\n```\n\n所以进入这里，我们将编写 private ConfigClientAppConfiguration，并将其命名为\
    \ properties。我们对它进行 @Autowired 注入。你也可以在这里使用 @Inject。我们将添加另一个实例变量 private String\
    \ someOtherProperty，并给它添加一个 @Value 注解。我们将使用占位符格式来注入 someOtherProperty 的值，即 ${some.other.property}。\n\
    \n现在我们要为主应用程序类添加 @RestController 注解。来到这里，@EnableDiscoveryClient 下方，添加 @RestController。继续保存。请注意，你通常不会在主应用程序类上放置\
    \ REST controller；但由于我们现在只是在演示概念，目前这样做是可以接受的。我们还需要添加处理方法，所以来到这里 main，编写 public\
    \ String printConfig()。然后我们为它添加 @RequestMapping 注解。在方法体中，我们将构造一个字符串，包含从 Configuration\
    \ Server 获取的每个配置属性的值。因此我们需要一个构造器，即 StringBuilder sb = new StringBuilder()。然后写\
    \ sb.append。接着获取第一个值，即 properties.getProperty()。然后用双竖线和空格（sb.append(\" || \")）将其隔开，然后\
    \ sb.append someOtherProperty 的值。最后，我们返回 sb.toString()。接下来，让我们关闭这两个文件。在 src/main/resources\
    \ 目录下创建一个新文件 bootstrap.properties。\n\n**bootstrap.properties：**\n```properties\n\
    spring.application.name=config-client-app\nspring.cloud.config.discovery.enabled=true\n\
    eureka.client.server-url.defaultZone=http://localhost:8761/eureka\n```\n\n在 bootstrap.properties\
    \ 中，将 spring.application.name 属性设置为值 config-client-app。然后我们将设置另一个属性，告诉 Config\
    \ Client 通过服务发现查找 Config Server，即 spring.cloud.config.discovery.enabled=true。eureka.client.server-url.defaultZone=http://localhost:8761/eureka。\n\
    \n"
