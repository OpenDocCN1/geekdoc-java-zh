    \ use `restTemplate.getForEntity`. and the URL we will use `http://weather-service/weather`.\
    \ And then the response type will be a string, so we'll say `String.class`. And\
    \ then we'll make sure we call a `.getBody` to get the response body. This is\
    \ what we'll want to annotate with our Hystrix command. Come up to the top of\
    \ the method and type @HystrixCommand, and we'll use a fallbackMethod called `unknown`.\
    \ And then we'll want to make sure that we define that method, come below the\
    \ getWeather method and define a new method, `public String unknown`. And this\
    \ will be a real simple method. It will just return the string \"unknown\". And\
    \ just to be clear, we're going to use this WeatherService in our main application\
    \ class to get the actual weather. And if there's a problem getting the weather,\
    \ or the WeatherService is down, it'll call that fallbackMethod and just return\
    \ unknown for the weather. Let's head back to the main application class and use\
    \ the WeatherService.\n\n```java\n@SpringBootApplication\n@EnableCircuitBreaker\n\
    @EnableDiscoveryClient\n@RestController\npublic class WeatherApplicationApplication\
    \ {\n\n  @Inject\n  private WeatherService weatherService;\n\n  public static\
    \ void main(String[] args) {\n    SpringApplication.run(WeatherApplication.class,\
    \ args);\n  }\n\n  @GetMapping(\"/current/weather\")\n  public String getWeather()\
    \ {\n    return \"The current weather is \" + weatherService.getWeather();\n \
    \ }\n\n  @Bean\n  @LoadBalanced\n  public RestTemplate restTemplate() {\n    return\
    \ new RestTemplate();\n  }\n}\n```\n\nSo back within the main application class,\
    \ define a new instance variable, `private WeatherService weatherService`, and\
    \ we'll call that weatherService. And we don't forget to add the @Inject annotation.\
    \ Then we'll add a new method called `getWeather`. So come below the main method\
    \ here and do `public String getWeather`. And we're going to return a string here\
    \ that says the current weather is, and then we'll call the weatherService and\
    \ get the weather. And this is our handler method, so we'll need the @GetMapping.\
    \ So define an @GetMapping on the top of this method, and then we'll say the URL\
    \ `/current/weather`. And that's all we need for the code portion of our weather\
    \ app, so go ahead and close both of these files and navigate to src/main/resources\
    \ and open up that application.properties.\n\n```properties\napplication.properties\n\
    server.port=8000\nspring.application.name=weather-app\neureka.client.service-url.defaultZone=http://localhost:8761/eureka\n\
    ```\n\nThe properties for the weather app are very similar to the ones in the\
    \ weather service, so I've just copied and pasted those over here. And then we're\
    \ just going to change some of those values. So for the server.port, we'll change\
    \ to 8000, and for the spring.application.name, we'll change that to weather-app.\
    \ We're ready to start our weather app, so go ahead and close that file and open\
    \ up the Console. Just go ahead and double-check that your discovery server and\
    \ weather service are still running, and then come over to the main WeatherApplication\
    \ class, right-click on it, go to Run and choose Spring Boot App. Next open up\
    \ a web browser and visit `http://localhost:8000/current/weather`.\n\n```\nhttp://localhost:8000/current/weather\n\
    ```\n\nAnd you should get a response here. And you can refresh it a couple times\
    \ to see the different values. And next, what we're going to do is we're going\
    \ to shut down the weather service. And we'll see that Hystrix takes over and\
    \ recognizes that the weather service down and returns its fallback method. So\
    \ we should be able to see the current weather is unknown after we shut down the\
    \ weather service. So we're back within the IDE, and we have the weather service\
    \ pulled up in the Console. We'll go ahead and stop the weather service and head\
    \ back to the browser. Back within the browser, we'll go ahead and refresh the\
    \ page, and we can see instantly that the current weather is unknown.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_184_0.png)\n\
    \nThe current weather is unknown\n\n# Hystrix has realized the call to the weather\
    \ service is failing and it should use its fallback method.\n\n# Metrics and Insight\
    \ with the Hystrix Dashboard\n\nNetflix Hystrix tracks the execution status of\
    \ protected calls so that it knows when to trip the circuit breaker. One of the\
    \ advantages of this is that we can use those metrics to get insight into how\
    \ our calls are functioning. Reading metrics in their raw form wouldn't be very\
    \ easy or efficient. And that's where the Hystrix Dashboard comes in. And the\
    \ dashboard is a web application that helps you visualize all of those metrics\
    \ in a quick and easy-to-use fashion. The dashboard is jam-packed with information.\n\
    \n- Tracks metrics such as:\n  * Circuit state\n  * Error rate\n  * Traffic volume\n\
    \  * Successful requests\n  * Rejected requests\n  * Timeouts\n  * Latency percentiles\n\
    - Monitor protected calls\n  * Single server or cluster\n\nTo use it, it's literally\
    \ as easy as declaring a couple dependencies in your pom.xml and adding a single\
    \ annotation.\n"
