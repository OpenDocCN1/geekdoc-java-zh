    \ where we left off in the previous demo. Remember that we had four different\
    \ services. We had the discovery-server that was doing service discovery, and\
    \ we had the gateway-service, which was our edge service, and we had two application\
    \ services, the goodbye-service and the hello-service. Since we're building a\
    \ filter, we'll start off in the gateway-service and create a new package. So\
    \ go ahead and New, Package, and we'll call this io.kumar.filters. And within\
    \ that new package create a new class, New, Class, and we'll call this AddRequestHeaderFilter.\
    \ And remember we have to extend the ZuulFilter class, so the superclass for our\
    \ class will be ZuulFilter.\n\n```java\npackage io.kumar.filters;\nimport com.netflix.zuul.ZuulFilter;\n\
    import com.netflix.zuul.context.RequestContext;\npublic class AddRequestHeaderFilter\
    \ extends ZuulFilter {\n    @Override\n    public boolean shouldFilter() {\n \
    \       return true;\n    }\n    @Override\n    public Object run() {\n      \
    \  RequestContext ctx = RequestContext.getCurrentContext();\n        ctx.addZuulRequestHeader(\"\
    x-location\", \"USA\");\n        return null;\n    }\n    @Override\n    public\
    \ String filterType() {\n        return \"pre\";\n    }\n}\n```\n\n```java\n@Override\n\
    public int filterOrder() {\n    return 0;\n}\n```\n\nFor the first method, the\
    \ shouldFilter method, let's go ahead and change that from return false to return\
    \ true. We're always going to apply this filter. And let's skip the run method\
    \ for right now and go down to the filterType. And this particular filter we're\
    \ going to create a pre filter, so we can say return true. And then for the filterOrder,\
    \ return 0 is okay, so we'll leave that the same. In order to get access to add\
    \ headers to it, we need to get access to RequestContext. So let's clear this\
    \ TODO and say RequestContext ctx = RequestContext.getContext(). And within the\
