- md: "\n# Summary\n\nWe're at the end of this module, so let's quickly go over what\
    \ we learned.\n\n- Differences between client-side & server-side load balancing\n\
    - Netflix Ribbon\n  - @LoadBalanced & @RibbonClient\n    - With & without service\
    \ discovery\n- Custom Ribbon client configuration\n\nWe first talked about what\
    \ is load balancing and what are the differences between client-side load balancing\
    \ and server-side load balancing. Then we introduced the Netflix Ribbon project\
    \ and learned how to use the @LoadBalanced and the @RibbonClient annotations to\
    \ set up client-side load balancing with and without service discovery. In the\
    \ last section, we saw how we could use the @RibbonClient annotation with a separate\
    \ @Configuration class to set up custom configuration for a specific Ribbon client.\n\
    \n## Module 7: Creating Self-healing Services with Circuit Breaker\n\n## Introduction\n\
    \nIn this module we'll learn how to develop services in a cloud-native architecture\
    \ that are both fault tolerant and self-healing.\n\n- Failures in a distributed\
    \ system\n  - Cascading failures\n  - Circuit breaker pattern\n- Netflix Hystrix\
    \ project\n  - @EnableCircuitBreaker\n  - @HystrixCommand\n- Hystrix Dashboard\n\
    \  - @EnableHystrixDashboard\n  - Turbine to aggregate Hystrix streams\n  - @EnableTurbine\n\
    \nWe will begin the module with a short section on failures in a cloud-native\
    \ or distributed system. We'll look at why failures are more prevalent and understand\
    \ a common side effect called cascading failures. Then we'll introduce and understand\
    \ the Circuit Breaker pattern and learn how it can help build more fault-tolerant\
    \ services. Next, we'll dive into Netflix Hystrix, which is a fault-tolerance\
    \ library that, among other things, implements the Circuit Breaker pattern. We\
    \ will see Spring Cloud makes it easy to get started with @EnableCircuitBreaker\
    \ annotation, and then we'll understand how to use the @HystrixCommand annotation\
    \ to implement the Circuit Breaker pattern in our own services. We'll finish the\
    \ module out by looking at one of the really nice features of Hystrix called the\
    \ Hystrix Dashboard. We'll see how to enable it, how metrics are collected, how\
    \ to interpret those results, and how to aggregate those results using another\
    \ project from Netflix called Turbine.\n\n## Cascading Failures and Resource Overloading\n\
    \nIn a distributed system, if there's anything that we can be 100% sure about,\
