    # Introducing Spring Cloud Config Server


    Managing your application configuration with help from Spring Cloud is really
    quite easy. By default, Spring Cloud provides you with several different ways
    to implement a Configuration Server with almost no work on your part. The first
    two options, Spring Cloud Consul and Spring Cloud Zookeeper, are integrations
    with third party applications, Consul and Zookeeper, respectively. You may or
    may not be familiar with Consul and Zookeeper, and in case you''re not, it''s
    important to note that neither of them is just a Configuration Server discovery.
    Both are commonly utilized for other purposes like service discovery. The third
    option, Spring Cloud Config Server, is an implementation that was built by the
    Spring Cloud team. And it has just one sole purpose, and that''s to be a Configuration
    Server. We''ll focus specifically on this option, but it should be pretty easy
    to utilize the others once you have a firm understanding of the concepts. In addition
    to including the implementation of the Spring Cloud Config Server, the Spring
    Cloud Config project also includes client-side support for connecting and interacting
    with the server. The Config Client, which is usually embedded in your application,
    fits perfectly into Spring''s Environment abstraction. And that means all the
    ways that you''re already familiar with getting access to configuration can be
    used to get access to configuration that was retrieved from the Configuration
    Server. The Config Server is usually a standalone application, and it also fits
    perfectly into one of the Spring framework abstractions, and that''s the PropertySource
    abstraction. So, if you''re not familiar with the PropertySource abstraction,
    you''ve probably already used it. For instance, if you''ve ever referred to a
    properties file in your application using the classpath prefix, then and all of
    the configuration that comes from the Configuration Server is just another property
    source. It''s a property source that''s remote.'
