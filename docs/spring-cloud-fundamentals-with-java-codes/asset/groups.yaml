    And last, we''re going to finish out with how Eureka has specific support for
    AWS. Let''s get started with the most important question, what is service discovery
    and why do we need it? Remember that the cloud is changing the way that we build
    software. We''re moving from building these single large applications and instead
    breaking them up into smaller and smaller pieces called services. And each of
