  - '[PAGE 12]


    traffic to that failed instance. We need something that is more dynamic. When
    a

    s approach is just far too static. It''s too frozen in time for our needs in

    t cloud. That''s where service discovery comes into play.


    +   > Service discovery provides

    * A way for a service to register itself

    * A way for a service to deregister itself

    * A way for a client to find other services

    * A way to check the health of a service and remove unhealthy instances


    Service discovery typically provides the following types of functionality. A

    way for a service to register itself. And what means is when a

    service comes online it can call out to the Service Discovery Server and let it

    know the location and port of its service so that other application services

    call it. For the exact opposite reasons, service discovery provides a way

    for a service to deregister itself. So if a service were to shut down or go away

    temporarily for upgrades, it would want to let the Service Discovery Server

    know it''s no longer available for clients to use. And, most importantly,

    service discovery provides a way for clients to find other services. And what

    do I mean by clients? Well I mean other application services. So if you''re an

    application service that needs to use another service, you need to be able to

    find the location and port of that service, and you can ask the Service

    Discovery Server for information. Lastly, service discovery provides a

    way to check the health of a service and remove any unhealthy instances. So

    each application service would implement a health check, typically via a

    REST endpoint, and then the Service Discovery Server would call that instance

    from its registry.'
