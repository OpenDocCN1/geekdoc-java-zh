- md: "\n# Key Components Involved in Service Discovery\n\nBefore we dive in to the\
    \ Spring Cloud Eureka Server and Client, it's helpful to understand the key components\
    \ that are involved in service discovery and how they interact with each other.\
    \ At a minimum, there are three components involved in service discovery. There's\
    \ the Discovery Server, the application service, and the application client. It's\
    \ helpful to get a full understanding of how all the components work together\
    \ and from there we'll go deeper into each component and see how Spring Cloud\
    \ helps us implement that particular component.\n\n- (1) Service registers location\n\
    - (2) Client looks up service location\n- (3) Discovery server sends back location\n\
    - (4) Client requests service at location\n- (5) Service sends response\n\nThe\
    \ first thing that happens is the application service starts up. And when it starts\
    \ up, it calls out to the Discovery Server, and it registers itself. And it tells\
    \ the Discovery Server its location, its port, and a service identifier that others\
    \ can use to find it. Then at some point later, a client needs to call that application\
    \ service, but it doesn't know the location and the port of the service, so it\
    \ sends out a request to the Discovery Server and sends along the service identifier.\
    \ And the Discovery Server knows based on that service identifier which service\
    \ you're asking for, and it responds back with the location and the port of that\
    \ service. From there, things proceed as normal, and the client can request the\
    \ service and its location, and the service can respond back with data.\n\n# The\
    \ Discovery Server\n\nWe're going deeper with each of the key components in service\
    \ discovery, and we're going to start with the Discovery Server. At its core,\
    \ the Discovery Server is an actively managed registry of service locations. It\
    \ is responsible for allowing others to find services and for services to register\
    \ and deregister themselves. It's the source of truth, if you will. And you would\
    \ typically run no more than one instance of the Discovery Server as it's the\
    \ key component to locate all the other services. And if you can't locate the\
    \ other services then this is an important piece of the overall architecture.\
    \ And you can find the Discovery Server implementation within the Spring Cloud\
    \ Eureka Server project. Throughout the book, we're going to be doing fairly simple\
    \ demos, things that are easy to set up and solidify the concepts. So in this\
    \ example, we're going to learn how to create a Discovery Server using Spring\
    \ Cloud. And I'll detail out each of the steps, and then we'll follow up with\
    \ a real example. Creating a Discovery Server with the Spring Cloud Eureka Server\
    \ project is very easy. In fact, it's almost embarrassingly easy.\n\npom.xml :\n\
    \n```xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n      <groupId>org.springframework.cloud</groupId>\n\
    \      <artifactId>spring-cloud-dependencies</artifactId>\n      <version>Camden.SR2</version>\n\
    \      <type>pom</type>\n      <scope>import</scope>\n    </dependency>\n  </dependencies>\n\
    </dependencyManagement>\n```\n\nIn your pom.xml of your Maven project, in the\
    \ dependencyManagement section, define a new dependency called spring-cloud-dependencies,\
    \ and make sure it's of pom and it has a scope of import.\n\n```xml\n<dependency>\n\
    \  <groupId>org.springframework.cloud</groupId>\n  <artifactId>spring-cloud-starter-eureka-server</artifactId>\n\
    </dependency>\n```\n\nStill within your pom.xml, define a new dependency, spring-cloud-starter-eureka-server.\
    \ And be sure to place this within the dependency section and not within the dependencyManagement.\n\
    \nApplication.properties :\nspring.application.name=discovery-server\n\nOR\n\n\
    Application.yml :\nspring:\n  application.name: discovery-server\n\nWithin your\
    \ application.properties or your application.yml, define a new property, spring.application.name.\
    \ And you can give this whatever value you want. In our case here, we're going\
    \ to use discovery-server.\n\n```java\n@SpringBootApplication\n@EnableEurekaServer\n\
    public class Application{\n  public static void main(String[]args) {\n    SpringApplication.run(Application.class,args);\n\
    \  }\n}\n```\n\nThen, in your main Application class, you literally define one\
    \ annotation. It's @EnableEurekaServer. And that's all there is to it. Once you\
    \ start this application up, you will have a running instance of a Discovery Server.\n\
    \n# Demo: Setting up a Service Discovery Server\n\nIn this demo, we're going to\
    \ be creating and starting up our own Service Discovery Server using the Spring\
    \ Cloud Eureka Server project. To start off, let's head over to start.spring.io,\
    \ and we're going to use this Spring Initializr to create the stub for our project.\
    \ It's a nice little skeleton creator that saves us a lot of time.\nIn the Group\
    \ section here, I'm going to put io.ajay.kumar, and for the Artifact I'm going\
    \ to call it the discovery-server. In the dependencies, I'm going to add the Eureka\
    \ Server, this is the Discovery Server, and I'm also going to add DevTools and\
    \ the Spring Boot Actuator project.\n\n# Generate a Spring Boot Project Metadata\n\
    \n## Artifact coordinates\n\n| Field | Value |\n| :--- | :--- |\n| Group | io.ajay.kumar\
    \ |\n| Artifact | discovery-server |\n\n# Dependencies\n\nAdd Spring Boot Starters\
    \ and dependencies to your application\n\nSearch for dependencies\n\n| Search\
    \ | Selected Dependencies |\n| :--- | :--- |\n| Web, Security, JPA, Actuator,\
    \ Devtools... | Eureka Server |\n| | DevTools |\n| | Actuator |\n\n```\nGenerate\
    \ Project Alt + d\n```\n\nOnceOnce you've added all dependencies, click the Generate\
    \ Project button. After you click that Generate Project button, it's going to\
    \ automatically download a zip file for you, and this contains the stub of our\
    \ project. Go ahead and unzip the downloaded stub project. Then we're going to\
    \ go ahead and open up our IDE and import. I've switched over my IDE, which is\
    \ Spring Tool Suite. And on the Package Explorer tab in the blank area, right-click\
    \ and to Import. And you're going to filter out the available options by typing\
    \ in Existing Maven Projects. Go ahead and click that, click Next, browse to the\
    \ location of the unzipped stub project, and click Open. Underneath the Projects\
    \ you should see your pom.xml. Go ahead and click Finish, and give that a second,\
    \ and it'll import into the IDE.\n\nOnce the project is finished importing, go\
    \ ahead and expand it and open up the main application class. It should be called\
    \ DiscoveryServerApplication, and this is where we're going to add the annotation\
    \ to enable our Discovery Server. So right above this @SpringBootApplication annotation,\
    \ we can add a new one, @EnableEurekaServer. Go ahead and save that.\n\n```java\n\
    package io.ajay.kumar.discovererver;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;\n\
    \n@EnableEurekaServer\n@SpringBootApplication\npublic class DiscoveryServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(DiscoveryServerApplication.class,\
    \ args);\n    }\n}\n```\n\nWe're now ready to start our Service Discovery Server,\
    \ so go ahead and right-click on the main application class, and go to Run As,\
    \ and choose Spring Boot App.\n\nOnce the application has finished loading, go\
    \ ahead and expand the Console window. And you'll notice that there are several\
    \ exceptions in here. Go ahead and stop the application server; otherwise, it\
    \ will continue to throw those exceptions. Let's scroll up to one of these exceptions\
    \ and see what the problem is. Cannot execute request on any known server. And\
    \ if you look, it's coming from this DiscoveryClient.getAndStoreFullRegistry method.\
    \ And what's happening is the Service Discovery Server is starting up, and it's\
    \ trying to register itself with a peer Discovery Server. And this is mainly for\
    \ high availability purposes. However, when we're running in standalone or development\
    \ mode, it can kind of be a pain to have to set up multiple instances every time.\
    \ So instead, we're going to configure Eureka Server not to register itself with\
    \ its peers. And you definitely only want to do this in development mode since\
    \ you want that high availability in production.\n"
  mdcn: "\n\n# 参与服务发现的关键组件\n\n在我们深入研究 Spring Cloud Eureka 服务器和客户端之前，了解参与服务发现的关键组件以及它们之间如何交互将很有帮助。最少有三个组件参与了服务发现：发现服务器（Discovery\
    \ Server）、应用程序服务（application service）和应用程序客户端（application client）。全面理解所有组件如何协同工作将非常有帮助，从那里开始我们将深入探讨每个组件，并查看\
    \ Spring Cloud 如何帮助我们实现这些特定的组件。\n\n- (1) 服务注册位置\n- (2) 客户端查找服务位置\n- (3) 发现服务器返回位置\n\
    - (4) 客户端在位置请求服务\n- (5) 服务发送响应\n\n首先发生的是应用程序服务的启动。当它启动时，它会调用发现服务器并注册自己。它会告诉发现服务器它的位置、端口以及其他可以用来找到它的服务标识符。然后，在稍后的某个时刻，客户端需要调用该应用程序服务，但它不知道该服务的位置和端口，因此它向发现服务器发送请求并带上服务标识符。发现服务器根据该服务标识符知道你请求的是哪个服务，并返回该服务的位置和端口。从那里开始，一切按正常程序进行，客户端可以请求服务及其位置，而服务可以返回数据。\n\
    \n# 发现服务器\n\n我们将深入探讨服务发现中的每个关键组件，并从发现服务器开始。发现服务器的核心是一个主动管理的服务位置注册表。它负责允许其他实体能够发现服务，并允许服务进行自我注册和注销。如果可以这么说，它是“真理之源”。你通常不会运行超过一个发现服务器实例，因为它是定位其他其他服务的组件。如果你无法定位其他服务，那么这就是整个架构中非常重要的一个部分。你可以在\
    \ Spring Cloud Eureka Server 项目中找到发现服务器的实现。在整本书中，我们将进行非常简单的演示，即易于设置和巩固概念的内容。在这个示例中，我们将学习如何使用\
    \ Spring Cloud 创建发现服务器。我将详细说明每一步，然后我们将跟进一个真实示例。使用 Spring Cloud Eureka Server 项目创建发现服务器非常简单。事实上，它简单到几乎令人大为情。\n\
    \npom.xml :\n\n```xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\n在你的 Maven\
    \ 项目的 `pom.xml` 中，在 `dependencyManagement` 部分定义一个名为 `spring-cloud-dependencies`\
    \ 的新依赖，并确保类型为 `pom` 且范围为 `import`。\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-eureka-server</artifactId>\n</dependency>\n\
    ```\n\n仍在你的 `pom.xml` 中，定义一个新依赖 `spring-cloud-starter-eureka-server`。确保将其放置在 `dependency`\
    \ 部分，而不是 `dependencyManagement` 部分。\n\nApplication.properties :\nspring.application.name=discovery-server\n\
    \n或者\n\nApplication.yml :\nspring:\n  application.name: discovery-server\n\n在在你的\
    \ `application.properties` 或 `application.yml` 中，定义一个新属性 `spring.application.name`。你可以给它任何想要的值。在我们的案例中，我们将使用\
    \ `discovery-server`。\n\n```java\n@SpringBootApplication\n@EnableEurekaServer\n\
    public class Application{\n  public static void main(String[]args) {\n    SpringApplication.run(Application.class,args);\n\
    \  }\n}\n```\n\n然后，在你的主 Application 类中，你字面上定义了一个注解。它是 `@EnableEurekaServer`。就这些了。一旦你启动此应用程序，你将拥有一个运行中的发现服务器实例。\n\
    \n# 演示：设置服务发现服务器\n\n在这个演示中，我们将使用 Spring Cloud Eureka Server 项目创建并启动我们自己的服务发现服务器。首先，让我们前往\
    \ start.spring.io，我们将使用这个 Spring Initializr 为我们的项目创建存根。它是一个非常棒的小骨架创建器，可以为我们节省大量时间。\n\
    在 Group 部分，我将放入 `io.ajay.kumar`，在 Artifact 部分，我将其命名为 `discovery-server`。在 dependencies\
    \ 部分，我将添加 Eureka Server（这就是发现服务器），我还会添加 DevTools 和 Spring Boot Actuator 项目。\n\n\
    # 生成 Spring Boot 项目元数据\n\n## Artifact 坐标\n\n| 字段 | 值 |\n| :--- | :--- |\n| Group\
    \ | io.ajay.kumar |\n| Artifact | discovery-server |\n\n# 依赖\n\n向你的应用程序添加 Spring\
    \ Boot Starters 和依赖\n\n搜索依赖\n\n| 搜索 | 选定的依赖 |\n| :--- | :--- |\n| Web, Security,\
    \ JPA, Actuator, Devtools... | Eureka Server |\n| | DevTools |\n| | Actuator |\n\
    \n```\nGenerate Project Alt + d\n```\n\n一旦你添加了所有依赖，点击 Generate Project。一旦你添加了所有依赖，点击\
    \ Generate Project 按钮。点击该按钮后，将为你下载一个 zip 文件，其中包含了我们的项目存根。解压下载的文件。然后我们将打开 IDE 并导入。我切换到了\
    \ IDE，即 Spring Tool Suite。在 Package Explorer 标签页的空白区域，右键点击 Import。选择 Existing\
    \ Maven Projects。点击 Next，浏览解压项目的位置，然后点击 Open。在 Projects 下你应该能看到 `pom.xml`。点击 Finish，等待它导入。\n\
    \n一旦项目导入完成，展开它并打开主应用程序类。它应该是 `DiscoveryServerApplication`，这就是我们要添加注解以启用发现服务器的地方。因此在\
    \ `@SpringBootApplication` 注解上方，我们可以添加一个新的注解 `@EnableEurekaServer`。保存它。\n\n```java\n\
    package io.ajay.kumar.discovererver;\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.cloud.netflix.eureka.server.EnableEurekaServer;\n\
    \n@EnableEurekaServer\n@SpringBootApplication\npublic class DiscoveryServerApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(DiscoveryServerApplication.class,\
    \ args);\n    }\n}\n```\n\n我们现在准备好启动我们的发现服务器了，所以右键点击主应用程序类，选择 Run As，选择 Spring\
    \ Boot App。\n\n一旦应用程序加载完成，展开 Console 窗口。你会发现这里有几个异常。停止应用程序服务器；否则它将继续抛出这些异常。让我们滚动到其中一个异常处，看看问题在哪里。Cannot\
    \ execute request on any known server。如果你查看的话，它源自这个 `DiscoveryClient.getAndStoreFullRegistry`\
    \ 方法。发生的情况是发现服务器正在启动，它正尝试与对等发现服务器进行自我注册。这主要是为了高可用性。然而，当我们运行单机模式或开发模式时，每次都要设置多个实例可能会有点麻烦。因此，我们将配置\
    \ Eureka Server 不要与其对等节点进行自我注册。你绝对只想在开发模式下这样做，因为在生产环境中我们需要那种高可用性。\n\n"
