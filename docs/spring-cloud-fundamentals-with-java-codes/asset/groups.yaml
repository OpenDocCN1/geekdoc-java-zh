    \ that was defined in that @Configuration would end up applying to all Ribbon\
    \ clients instead of just a specific Ribbon client.\n\n```java\n@Configuration\n\
    public class OtherServiceConfig {\n    @Bean\n    public <bean_type> <method_name>(){\n\
    }\n```\n\nDefault Ribbon Client @Beans\nReplace <bean_type> and <method_name>\
    \ with values to override: http://cloud.spring.io/spring-cloud-static/Camden.SR6#customizing_the_ribbon_client\n\
    Most likely to be customized: IRule & IPing\n\nThere are a number of different\
    \ classes that are needed to set up a Ribbon client, and by default Spring Cloud\
    \ defines those as @Beans and allows you to override any of them for custom configuration.\
    \ Let's take a look at the Spring Cloud documentation to see what @Beans you can\
    \ override. I've loaded the Spring Cloud documentation, and we're looking at a\
    \ number of different beans that are required to set up a Ribbon client. And for\
    \ the most part, you typically won't need to override any of these with the exception\
    \ of two of the beans. That's the IRule bean and the IPing bean. The IRule bean\
    \ controls the load balancing algorithm, and the IPing bean controls the availability\
    \ checks on the instances that are being load balanced. Let's take a look at each\
    \ of these beans in a bit more detail.\n\n## Customizing Your RibbonClient Configuration:\
    \ The IRule Bean\n\nAs I mentioned, the IRule bean is used to control the load\
    \ balancing strategy that's used to balance the distribution of workload between\
    \ the instances that are being load balanced. You can choose to create your own\
    \ custom IRule implementation, or you can choose from one of the several different\
    \ defaults. Let's talk about a few of our available options.\n\n- IRuleImplementations\n\
    \  - RoundRobinRule\n  - ResponseTimeWeightedRule\n  - RandomRule\n  - ZoneAvoidanceRule\n\
    \nThere's the RoundRobinRule implementation, which is just like it sounds, an\
    \ implementation of the round-robin balancing algorithm, which distributes the\
    \ workload evenly among all instances. There's the ResponseTimeWeightedIRule implementation,\
    \ which is also a round-robin algorithm, but it dynamically assigns weights based\
    \ on the average response time from each of the instances. There's the RandomRule\
    \ implementation, which simply picks an instance to send traffic to random. And\
    \ there's the ZoneAvoidanceRule, which is also a round-robin algorithm implementation;\
    \ however, it filters out servers to send traffic to based on the AWS zone and\
    \ availability. Let's look at an example to make this a bit more concrete.\n\n\
    ```java\n@Configuration\npublic class OtherServiceConfig{\n    @Bean\n    public\
    \ IRule ribbonRule(){\n        return new RoundRobinRule();\n    }\n}\n```\n\n\
    If, for instance, we wanted to override the default IRule to use the RoundRobinRule\
    \ implementation, we'd define a new method annotated with the @Bean annotation,\
    \ and we'd return a new RoundRobinRule.\n\n## Customizing Your RibbonClient Configuration:\
    \ The IPing Bean\n\nThe IPing bean is responsible for choosing the strategy to\
    \ check the liveliness or the availability of a given instance that's being load\
    \ balanced. Just like the IRule bean, you can also implement your own custom IPing\
    \ implementations, or you can choose from one of the several different defaults.\
    \ Let's take a look at what's available.\n\n- IPingImplementations\n  - DummyPing\n\
    \  - PingUrl\n  - NIWSDiscoveryPing\n\nThere's the DummyPing implementation, which\
    \ is just as dumb as it sounds. It's simply always returning true when it's asked\
    \ about the liveliness of a service. You'd use this if you simply don't care to\
    \ check the liveliness or the availability and you always want to send traffic\
    \ to all of the instances regardless. There's the PingUrl implementation, which\
    \ is an implementation that allows you to set an expected response and then makes\
    \ an actual HTTP call to the service and checks the result. So you'd typically\
    \ point this at something like the service's health check URL. And then there's\
    \ the DiscoveryPing implementation, which would be something that would be automatically\
    \ configured for you if you were using something like Eureka service discovery.\
    \ And what this would do is it would just consult with the discovery client to\
    \ determine the liveliness of any particular instance. Again, let's look at an\
    \ example to make this a bit more concrete.\n\n### IPing: Liveness Check\n\n```java\n\
    @Configuration\npublic class OtherServiceConfig{\n    @Bean\n    public IPing\
    \ ribbonPing(){\n        PingUrl pingUrl=new PingUrl();\n        pingUrl.setExpectedContent(\"\
    true\");\n        return pingUrl;\n    }\n}\n```\n\nso just like we did with the\
    \ IRule implementation, you would define a new method annotated with the @Bean\
    \ annotation, and then you return the implementation of your choice. So in this\
    \ case, we're going to return a PingUrl. So we create a new instance of the PingUrl,\
