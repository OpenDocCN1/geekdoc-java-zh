    \n# The Application Service\n\n- Provides some application functionality\n- The\
    \ receiver of requests\n- A dependency of other service(s)\n- One or more instances\n\
    - User of the discovery client\n  - Register\n  - Deregister\n\nRemember that\
    \ we're diving into each of the components of service discovery, and the next\
    \ on our list is the application service. This is whatever is providing the functionality.\
    \ It's the thing that's receiving the requests and returning responses. And it's\
    \ a dependency of other services. So other services depend on its functionality.\
    \ You typically run one or more instances of the application service. The application\
    \ service is user of the discovery client. It's going to use that to call out\
    \ to Discovery Server and register and deregister. Just like we did for Service\
    \ Server, we're going to detail the steps needed to add Eureka Client to an application\
    \ service, and then we'll actually create one.\n\n### Using Spring Cloud Eureka\
    \ Client in Service\n\n```xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\nIn pom.xml\
    \ of your Maven project, add a new dependencyManagement section, and then add\
    \ a new dependency spring-cloud-dependencies. Again make sure it's type pom and\
    \ scope import.\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-eureka</artifactId>\n</dependency>\n```\n\n\
    Still within pom.xml, add a new dependency within dependencies, and this one is\
    \ called spring-cloud-starter-eureka. Then in your application.properties or application.yml,\
    \ add new properties.\n\napplication.properties\n```properties\nspring.application.name=service\n\
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka\n```\n\nOR\n\
    \napplication.yml\n```yaml\nspring:\n  application:\n    name: service\neureka:\n\
    \  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka\n\
    ```\n\nThe first property is the spring.application.name, and again you can set\
    \ this to whatever value you want. In our case we'll use service. The second property\
    \ tells the application service where Discovery Server is located, and it's the\
    \ eureka.client.defaultZone property. And you can see we set that to localhost,\
    \ but in production you'd set that to wherever your Discovery Server was located.\
    \ For now we'll explain more about that property.\n\n```java\n@SpringBootApplication\n\
    @EnableDiscoveryClient\npublic class Application {\n    public static void main(String[]\
    \ args){\n        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\
    \nAnd then in your main Application class of your application service, add one\
    \ annotation. Again the Spring Cloud guys have made it easy for us that @EnableDiscoveryClient\
    \ annotation. And what this does is it makes our application service register\
    \ itself with Discovery Server, and then other services can find it.\n\n# Demo:\
    \ Making an Application Service Discoverable\n\nWe'll use Spring Initializr to\
    \ create our application service, so go ahead and head over to start.spring.io.\
    \ And in the Group here you're going to put io.ajay.kumar, and we'll give Artifact\
    \ service name. And you'll have pretty much the same dependencies, but this time\
    \ you'll want to do Eureka Discovery instead of Eureka Server dependency. And\
    \ you can go ahead and add DevTools and the Actuator.\n\n# Generate a Maven Project\
    \ with Java and Spring Boot 2.1.0\n\n# Project Metadata Artifact coordinates\n\
    Group: io.ajay.kumar\nArtifact: service\n\n# Dependencies\nAdd Spring Boot Starters\
    \ and dependencies to your application\nSearch for dependencies: Web, Security,\
    \ JPA, Actuator, Devtools...\n\nSelected Dependencies\n- DevTools\n- Actuator\n\
    - Eureka Discovery\n\nGenerate Project Go ahead and click Generate Project. It'll\
    \ automatically create and download a zip file for you. Go ahead and unzip that\
    \ zip file, and we'll import that into our IDE. And we're back in Spring Tool\
    \ Suite. In the Package Explorer tab, right-click and go to Import. And again\
    \ we want Existing Maven Projects. Click Next, browse to the location of our unzipped\
    \ file, and click Open. You should see the pom.xml underneath the Projects heading,\
    \ and click Finish to finish the import. That'll take a second, and once that's\
