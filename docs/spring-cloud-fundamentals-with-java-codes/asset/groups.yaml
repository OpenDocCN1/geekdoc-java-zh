    \ |\n| unavailable-replicas | http://localhost:8761/eureka/ |\n| available-replicas\
    \ | |\n\n# 实例信息\n\n| Name | Value |\n| --- | --- |\n| ipAddr | 192.168.29.2 |\n\
    | status | UP |\n\n首先是系统状态（System Status），它会告诉你当前时间，以及过去一分钟内发生了多少次更新。DS Replicas（即发现服务器副本）部分显示了\
    \ Eureka 服务器的对等实例。如果我们有多个实例，我们会在这里列出每一个实例。但由于我们只有一个实例，所以只看到 localhost。下一部分可能是最有用的部分，因为它显示了当前注册到\
