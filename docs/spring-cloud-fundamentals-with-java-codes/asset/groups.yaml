    \ Project\nJava 2.1.1\n\n...still on the SPRING INITIALIZER page, change the artifact\
    \ name from ribbon-time-service to ribbon-tie-app. Then, in the Dependencies section,\
    \ add a new dependency on Ribbon. Once you have everything filled out, click the\
    \ Generate Project button, and it'll create and download a zip for you.\n"
  mdcn: "\n\n-   额外的跳数\n-   支持多种负载均衡算法\n-   发生在请求过程之外\n-   集中式或分布式\n-   客户端负载\n  -\
    \ 客户端分发请求\n  - 基于软件\n  - 无额外跳数\n-   支持多种负载均衡算法\n-   发生在请求过程之内\n-   通常是分布式的\n\n\
    使用服务端负载均衡时，服务器显然分发请求；而使用客户端负载均衡时，客户端显然分发请求。服务端负载均衡通常是基于硬件的，但也可以基于软件的。另一方面，客户端负载均衡是基于软件的。在服务端负载均衡中，你会产生一次额外的跳数，因为请求不会直接到达服务，而是必须先通过中间件。而在客户端负载均衡中，一旦你知道了服务的位置，就不会产生任何额外的跳数。服务端和客户端负载均衡都支持多种负载均衡算法。在服务端负载均衡中，实际的负载均衡发生在请求过程之外，而在客户端负载均衡中，实际的负载均衡发生在请求过程之内。最后，服务端负载均衡可以是集中式的也可以是分布式的，而客户端负载均衡通常是分布式的。考虑到所有这些差异，显而易见，客户端负载均衡是云原生架构的天然选择。\n\
    \n## 使用 Spring Cloud 和 Netflix Ribbon 开始\n\n我们已经为客户端负载均衡做好了准备。现在让我们来讨论如何使用 Spring\
    \ Cloud 实现它。正如我在本模块的介绍中提到的，我们将使用一个名为 Netflix Ribbon 的库来实现客户端负载均衡。Netflix Ribbon\
    \ 是一个进程间通信库，内置了软件负载均衡器。Spring Cloud 将 Netflix Ribbon 的全功能集成到了 Spring 的 `RestTemplate`\
    \ 类中。我们将详细介绍这具体意味着什么，但本质上，我们的 `RestTemplate` 现在将理解如何处理跨多个云实例的请求。Spring Cloud 还增加了功能，可以非常方便地声明不同类型的负载均衡算法和可用性检查。接下来，让我们讨论如何使用\
    \ Spring Cloud 和 Netflix Ribbon。在开始之前，简单说明一下：在这些章节中的每一个，我都会解释启动所需的所有步骤，最后我们将通过一个演示（demo）让你跟进操作。在\
    \ Spring Cloud 中使用 Netflix Ribbon 极其简单，就像所有其他 Spring Cloud 项目一样。\n\n使用 SpringCloud\
    \ &Netflix Ribbon 的 pom.xml\n\n```xml\n<dependencyManagement>\n  <dependency>\n\
    \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-dependencies</artifactId>\n\
    \    <version>Camden.SR2</version>\n    <type>pom</type>\n    <scope>import</scope>\n\
    \  </dependency>\n</dependencyManagement>\n```\n\n在你的 `pom.xml` 的 `dependencyManagement`\
    \ 中，定义对 `spring-cloud-dependencies` 的新依赖。\n\n```xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-ribbon</artifactId>\n</dependency>\n```\n\n\
    并确保它的类型为 `pom` 且范围为 `import`。同样在 `pom.xml` 的 `dependency` 中，定义对 `spring-cloud-starter-ribbon`\
    \ 的新依赖。Spring Cloud 的 Netflix Ribbon 支持增加了两个新注解。\n\n-   两个新注解\n  - @LoadBalanced\
    \ : 标记一个 RestTemplate 支持负载均衡\n  - @RibbonClient : 用于自定义配置以及在缺少服务发现（Service Discovery）时使用\n\
    \n第一个是 `@LoadBalanced` 注解，该注解在你创建 `RestTemplate` 时使用。它用于标记该 `RestTemplate` 应该是一个负载均衡的\
    \ `RestTemplate`，而不仅仅是一个标准的 `RestTemplate`。第二个注解是 `@RibbonClient` 注解，该注解主要用于配置。你可以使用它来配置自定义的\
    \ Ribbon ，以及在不使用服务发现时设置实际的 Ribbon 。让我们先看如何使用 `@LoadBalanced` 注解。\n\n## 使用 @LoadBalanced\
    \ 注解\n\n开始并创建一个负载均衡的 `RestTemplate` 非常简单。\n\n```java\nCreating a Load Balanced\
    \ RestTemplate\n@Configuration\npublic class MyConfiguration{\n    @Bean\n   \
    \ @LoadBalanced\n    public RestTemplate restTemplate(){\n        return new RestTemplate();\n\
    \    }\n}\n```\n\n在你的 `@Configuration` 类中，你定义了一个带有 `@Bean` 的返回 `RestTemplate`\
    \ 的新方法。然后用 `@LoadBalanced` 对其进行注解。此做的作用是告诉 Spring 该 `RestTemplate` 应该是一个负载均衡的\
    \ `RestTemplate`，而不是一个标准的 `RestTemplate`。在服务端负载均衡中，实际的负载均衡发生在请求过程之外，而在客户端负载均衡中，实际的负载均衡发生在请求过程之内。服务端和客户端负载均衡都支持多种负载均衡算法。在服务端负载均衡中，实际的负载均衡发生在请求过程之外，而在客户端负载均衡中，实际的负载均衡发生在请求过程之内。最后，服务端负载均衡可以是集中式的也可以是分布式的，而客户端负载均衡通常是分布式的。考虑到所有这些差异，显而易见，客户端负载均衡是云原生架构的天然选择。\n\
    \n## 结合服务发现使用负载均衡 RestTemplate\n\n假设你在 mycompany.com 的 9000 端口上运行了一个服务。并且你有该服务的多个实例。接下来，让我们如何使用\
    \ `@LoadBalanced` 注解来解析 `my-service`。默认情况下，它将使用轮询算法在它们之间分配负载。\n\n## 演示：结合服务发现使用\
    \ Ribbon 进行负载均衡\n\n在这个演示中，我们将设置一个利用服务发现的 Ribbon 客户端，并在服务的多个实例之间平衡请求。如果你一直跟了课程之前的模块，那么你应该已经设置好了发现服务器。一旦准备好开始，打开浏览器并访问\
    \ start.spring.io。在 Group 部分，将其更改为 `io.ajay.kumar`。对于 artifact 的名称，我们将将其命名为 `ribbon-time-service`。在\
    \ Dependencies 部分，添加 Web 依赖和 Eureka Discovery 依赖。\n\n"
