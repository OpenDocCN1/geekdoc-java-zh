  - '[PAGE 83]


    # Updating Configuration at Runtime


    Updating configuration at runtime is easily one of the best features of Spring
    Cloud. With it, you can do things like refresh your @ConfigurationProperties at
    runtime. You can also use it to update the logging levels on any piece of code.
    And the changes happen almost instantaneously. The best part is that you can do
    all of this without restarting your application. So how do you do it? Well, the
    first step is updating your configuration. And you do by cloning the configuration
    repository that your Config Server is looking at, make your changes, and then
    git add, git commit, and git push your changes up to the configuration repository.
    From there, there are several different ways that the application gets the new
    configuration, both manually and automatically.


    +   > /refresh with spring-boot-actuator

    > /bus/refresh with spring-cloud-config-monitor

    > VCS +/monitor with spring-cloud-config-cloud-vcs


    The first way is manually, and that''s by calling the refresh endpoint that''s
    included in the Spring Actuator project. And just to be clear, you would need
    to do that for every individual service that needs its configuration updated.
    The second way is a combination of both manual and automatic. And you can imagine
    that if you had a lot of servers, calling the refresh endpoint on each of them
    manually could be a pretty painful process. Instead, each of the applications
    were subscribe to an event, and you would call the bus/refresh endpoint, Spring
    Cloud Bus would send out a message to all of the subscribers subscribing to them
    that they need to refresh their configuration. Now note that there isn''t any
    sort of intelligence in whether or not the configuration changed. Every subscriber
    gets and gets its new configuration regardless. The third way is just like the
    second except for it adds a level of intelligence. And what it does is if you
    hook into your virgin control system, like Git, and any time you make a commit,
    the changeset of the commit is posted to a monitor endpoint, and then that'
- md: "\nmonitor endpoint can determine which services need to have their configuration\
    \ updated. So let's visualize this. Imagine that you made a commit to some configuration,\
    \ and you pushed that up to the configuration repository. And the repository knows\
    \ what changed, and it sent that changeset to the monitor endpoint, and then it\
    \ decided that it only needed to notify two of the three applications to update\
    \ their configuration. Regardless of which method you chose to notify your applications\
    \ about configuration updates, there's one last step. And that is to celebrate.\
    \ You can bran brag to your colleagues about making configuration changes on the\
    \ fly without ever restarting your application. And you can do it all at once\
    \ or even all automatically. And last, since you used Git, you have a full audit\
    \ log of all of the changes that you've made to your configuration.\n\n## Utilizing\
    \ the @RefreshScope Annotation\n\nWe've already talked about how @ConfigurationProperties\
    \ and logging levels will be updated when configuration is refreshed, but unfortunately\
    \ that doesn't cover all of the use cases. Anything that gets its value only at\
    \ initialization time, like an @Bean or an @Value, will not be automatically refreshed\
    \ like the others. To understand this a bit better, it helps to see an example.\n\
    \n```\n@Configuration\npublic class SomeConfiguration{\n    @Bean\n    public\
    \ FooService fooService(FooProperties properties) {\n        return new FooService(properties.getConfigValue());\n\
    \    }\n}\n```\n\n- Example: @Bean Will Not See New Config Value After a Refresh\n\
    - Configuration updates are made\n    - Note that FooProperties is a @ConfigurationProperties\
    \ class\n- POST to /refresh\n- Result: FooService will still contain the OLD configuration\
    \ value\n    - Only gets configuration during initialization\n\nSuppose you have\
    \ an @Configuration class, and it declares a new bean called FooService. To construct\
    \ FooService, you need to give it a configuration value from FooProperties, which\
    \ is an argument to the bean method. And FooProperties is an @Configuration class.\
    \ Then you make some configuration changes to the properties that are bound to\
    \ FooProperties, and you issue a POST request to the refresh endpoint. If you\
    \ were to look at FooService at this point, even though you called refresh, it\
    \ would actually still have the old configuration value. And that's because it\
    \ only gets its configuration during initialization. Here's another example.\n\
    \n```\n@Configuration\npublic class SomeConfiguration{\n    @Value(\"${some.config.value}\"\
    )\n    String configValue;\n    @Bean\n    public FooService fooService(){\n \
    \       return new FooService(configValue);\n    }\n}\n```\n\n- Example: @Value\
    \ Will Not See New Config Value After a Refresh\n- Configuration updates are made\n\
    - POST to /refresh\n- **Result: FooService will still contain the OLD configuration\
    \ value**\n    - Only gets configuration during initialization\n\nAgain, we have\
    \ an @Configuration class, and this time we have an @Value annotation that needs\
    \ to be injected. And we'll use that configuration as a constructor argument to\
    \ construct the FooService bean. So we go through the same process; we update\
    \ configuration, POST to the refresh endpoint, and again we realize that our configuration\
    \ value is still the old value. It did not get updated. By now you have to be\
    \ wondering how do I refresh an @Bean or an @Value that only gets its configuration\
    \ during initialization? And the answer to that is with the @RefreshScope annotation.\
    \ Let's go back to our first example and see how where we utilize the @RefreshScope\
    \ annotation.\n\n```\n@Configuration\npublic class SomeConfiguration{\n    @Bean\
    \ @RefreshScope\n    public FooService fooService(FooProperties properties){\n\
    \        return new FooService(properties.getConfigValue());\n    }\n}\n```\n\n\
    - Example: Utilizing @RefreshScope annotation to the @Bean\n- Add the @RefreshScope\
    \ annotation to the @Bean\n- POST to /refresh\n- > Result: FooService will now\
    \ contain the NEW configuration value!\n- @RefreshScope tells Spring to please\
    \ reinitialize this @Bean\n\nIn your @Configuration class, all you need to do\
    \ is add the @RefreshScope annotation to your @Bean. And once you POST to the\
    \ refresh endpoint, FooService will now see the latest configuration value. RefreshScope\
    \ works just like it sounds. It's a hint to Spring that this @Bean or this @Value\
    \ should be included in the scope of the refresh.\n\n## Demo: Refresh Configuration\
    \ Without Restarting Your App\n\nIn this demo, we'll learn how to Refresh our\
    \ configuration at runtime, as well as how to use the @RefreshScope annotation.\
    \ Before we get started with the demo, make sure that you have a tool Postman\
    \ installed. You can get it by going to www.getpostman.com. And we'll use this\
    \ tool to call the REST endpoints. It's a nice REST client. The first thing we'll\
    \ do is start all of our applications, so ahead and start the Discovery Server,\
    \ the Config Server, and the Config Client app. Remember that you need to start\
    \ them in the correct order. So the Discovery Server first, then the Config Server,\
    \ then the Config Client app. If you have any problems starting them, make sure\
    \ that you start them in that order. Open up a browser and visit localhost:8080.\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_88_0.png)\n\nAnd you'll see the configuration\
    \ values that got resolved from the Configuration Server. Now, we want to update\
    \ each of these values, so we're going to update the first one, the app specific\
    \ overridden value, and the global one. So, head back to the IDE. Back in the\
    \ IDE, expand the config-repository project, and open up the config-client.properties\
    \ file.\n\nconfig-client.properties\n```\n# application-specific (application\
    \ name: client)\nsome.property=coffee\nsome.other.property=good\n```\n\nAnd we're\
    \ going to change this app specific overridden value to coffee. And we're also\
    \ going to set the other one. We're going to override the some.other.property,\
    \ and we're going to say good. Go ahead and save those. Close that file. And then\
    \ we're going to commit those changes, so right-click on the config-repository,\
    \ go to Team, to Commit, type in a commit message, Updating configuration, and\
    \ click Commit and Push. And it'll pop up a new dialog showing that you pushed\
    \ the changes. Just go ahead and click OK. And you can exit out of Git Staging\
    \ view. So now we've updated the configuration, and we've pushed to the configuration\
    \ repository. And if you go back to your browser and you refresh the page, the\
    \ value should be the old values.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_89_0.png)\n\
    \nWe haven't explicitly asked the application to refresh its configuration. In\
    \ order to do that, start the Postman application, and on the New Tab where it\
    \ says GET, click drop-down and choose POST. Then in the request URL type http://localhost:8080/refresh.\
    \ Once you've got that typed it, Send, and the server will respond back with all\
    \ of the properties that changed. There's an internal property that it has called\
    \ the config.client.version, as well as the two properties that we changed, the\
    \ some.other.property and the some.property. Head back to your browser and refresh\
    \ the page.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_89_1.png)\n\nAnd oh, that's\
    \ interesting. The first value refreshed for us, we got the coffee value that\
    \ we set, but the second value is still pointing to the global configuration value.\
    \ And the reason for that is that the second value is not retrieved using the\
    \ @Value annotation, and @Value annotations are not automatically refreshed when\
    \ you call the refresh endpoint. We can fix that with the @RefreshScope annotation.\
    \ Back within the IDE, stop the Config Client app. Then in the main application\
    \ class, let's find the someOtherProperty. So we have here the @Value annotation\
    \ that gets the some.other.property value. To fix our problem of the @Value annotation\
    \ not updating, let's add the @RefreshScope to the main application class.\n"
  mdcn: "\n监控端点可以确定哪些服务需要更新其配置。让我们将其视觉化吧。想象一下，你对某些配置提交了更改，并将其推送到配置仓库。仓库知道发生了哪些变化，并将该变更集发送到监控端点，然后它决定只需要通知三个应用程序中的两个来更新它们的配置。无论你选择哪种方法来通知应用程序配置更新，最后一步都是重要的。那便是庆祝。你可以向同事炫耀你可以在无需重新启动应用程序的情况下即时更改配置。你可以一次性完成所有这些操作，甚至可以全自动地完成。最后，由于你使用了\
    \ Git，你对配置所进行的所有更改都拥有一份完整的审计日志。\n\n## 使用 @RefreshScope 注解\n\n我们已经讨论过当配置刷新时，@ConfigurationProperties\
    \ 和日志级别将如何被更新，但遗憾的是，这并没有涵盖所有的用例。任何仅在初始化时获取其值的对象（例如 `@Bean` 或 `@Value`）都不会像其他对象那样自动刷新。为了为了更好地理解这一点，看一个示例会有帮助。\n\
    \n```\n@Configuration\npublic class SomeConfiguration{\n    @Bean\n    public\
    \ FooService fooService(FooProperties properties) {\n        return new FooService(properties.getConfigValue());\n\
    \    }\n}\n```\n\n- 示例：刷新后 @Bean 不会看到新的配置值\n- 已更新配置\n    - 注意 FooProperties 是一个\
    \ @ConfigurationProperties 类\n- POST 请求到 /refresh\n- **结果：FooService 仍包含旧的配置值**\n\
    \    - 仅在初始化期间获取配置\n\n假设你有一个 `@Configuration` 类，它声明了一个名为 `FooService` 的新 bean。要构造\
    \ `FooService`，你需要从 `FooProperties` 给它一个配置值，它是 bean 方法的参数。`FooProperties` 是一个\
    \ `@Configuration` 类。然后你对绑定到 `FooProperties` 的属性进行了一些配置更改，并向刷新端点发送一个 POST 请求。如果你此时查看\
    \ `FooService`，即使你调用了刷新，它实际上仍然拥有旧的配置值。这是因为它只在初始化时获取其配置。这里是另一个示例。\n\n```\n@Configuration\n\
    public class SomeConfiguration{\n    @Value(\"${some.config.value}\")\n    String\
    \ configValue;\n    @Bean\n    public FooService fooService(){\n        return\
    \ new FooService(configValue);\n    }\n}\n```\n\n- 示例：刷新后 @Value 不会看到新的配置值\n-\
    \ 已更新配置\n- POST 请求到 /refresh\n- **结果：FooService 仍包含旧的配置值**\n    - 仅在初始化期间获取配置\n\
    \n再次，我们有一个 `@Configuration` 类，这次我们有一个需要注入的 `@Value` 注解。我们将使用该配置作为构造函数参数来构造 `FooService`\
    \ bean。所以我们经历了相同的流程：更新配置，向刷新端点发送 POST 请求，我们再次发现我们的配置值仍然是旧值。它没有被更新。现在你可能在想，我该如何刷新一个仅在初始化时获取配置的\
    \ `@Bean` 或 `@Value` 呢？答案就是使用 `@RefreshScope` 注解。让我们回到第一个示例，看看我们是如何是如何利用 `@RefreshScope`\
    \ 注解的。\n\n```\n@Configuration\npublic class SomeConfiguration{\n    @Bean @RefreshScope\n\
    \    public FooService fooService(FooProperties properties){\n        return new\
    \ FooService(properties.getConfigValue());\n    }\n}\n```\n\n- 示例：对 @Bean 使用 @RefreshScope\
    \ 注解\n- 在 @Bean 上添加 @RefreshScope 注解\n- POST 请求到 /refresh\n- > 结果：FooService 现在将包含新的配置值！\n\
    - @RefreshScope 通知 Spring 重新初始化此 @Bean\n\n在你的 `@Configuration` 类中，你只需要为你的 `@Bean`\
    \ 添加 `@RefreshScope` 注解即可。一旦你向刷新端点发送 POST 请求，`FooService` 现在就会看到最新的配置值。RefreshScope\
    \ 的作用就像它的名字一样。它是提示 Spring 该 `@Bean` 或该 `@Value` 应该包含在刷新范围内。\n\n## 演示：在重启应用的情况下刷新配置\n\
    \n在演示中，我们将学习如何在运行时刷新配置，以及如何使用 `@RefreshScope` 注解。在开始演示之前，请确保你已经安装了 Postman。你可以通过访问\
    \ www.getpostman.com 获取它。我们将使用这个工具来调用 REST 端点。它是一个很好用的 REST 客户端。我们要做的第一件事是启动所有的应用程序，所以提前启动\
    \ Discovery Server、Config Server 和 Config Client 应用。记住，你需要按照正确的顺序启动它们。先启动 Discovery\
    \ Server，然后是 Config Server，最后是 Config Client 应用。如果你在启动时遇到任何问题，请确保你按照该顺序启动。打开浏览器并访问\
    \ localhost:8080。\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_88_0.png)\n\n你会看到从\
    \ Configuration Server 解析出的配置值。现在，我们想要更新这些值中的每一个，我们将更新第一个（特定应用程序的覆盖值）以及全局值。因此，回到\
    \ IDE。在 IDE 中，展开 config-repository 项目，并打开 `config-client.properties` 文件。\n\nconfig-client.properties\n\
    ```\n# application-specific (application name: client)\nsome.property=coffee\n\
    some.other.property=good\n```\n\n我们将特定应用程序的覆盖值改为 `coffee`。同时我们也要修改另一个，我们将 `some.other.property`\
    \ 设置为 `good`。保存这些更改。关闭文件。然后我们要提交这些更改，右键点击 config-repository，选择 Commit，输入提交信息“Updating\
    \ configuration”，点击 Commit and Push。它会弹出一个对话框显示你已推送更改。点击 OK。退出 Git 视图。现在我们更新了配置，并推送到配置仓库。如果你回到浏览器并刷新页面，值仍然是旧的。\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_89_0.png)\n\n我们还没有显式要求应用程序刷新其配置。为了实现这一点，启动\
    \ Postman ，在新建标签页中点击 GET 下拉菜单并选择 POST。然后在请求 URL 中输入 `http://localhost:8080/refresh`。一旦输入完成，点击\
    \ Send，服务器将返回所有更改的属性。它有一个名为 `config.client.version` 的内部属性，以及我们更改的两个属性 `some.other.property`\
    \ 和 `some.property`。回到浏览器刷新页面。\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d_89_1.png)\n\
    \n噢，这很有趣。第一个值已经为刷新，我们得到了设置的 `coffee` 值，但第二个值仍然指向全局配置值。这种现象的原因是第二个值不是使用 `@Value`\
    \ 注解获取的，而且当调用刷新端点时，`@Value` 注解不会刷新。我们可以通过 `@RefreshScope` 注解来修复这个问题。回到 IDE，停止\
    \ Config Client 应用。然后在主应用程序类中，找到 `someOtherProperty`。我们这里有一个获取 `some.other.property`\
    \ 值的 `@Value` 注解。为了解决 `@Value` 注解不更新的问题，让我们在主应用程序类上添加 `@RefreshScope`。\n"
