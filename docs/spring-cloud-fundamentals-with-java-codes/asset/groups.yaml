  - "[PAGE 185]\n\n# Metrics and Insight with the Hystrix Dashboard\n\nNetflix Hystrix\
    \ tracks the execution status of protected calls so that it knows when to trip\
    \ the circuit breaker. One of the advantages of this is that we can use those\
    \ metrics to get insight into how our calls are functioning. Reading metrics in\
    \ their raw form wouldn't be very easy or efficient. And that's where the Hystrix\
    \ Dashboard comes in. And the dashboard is a web application that helps you visualize\
    \ all of those metrics in a quick and easy-to-use fashion. The dashboard is jam-packed\
    \ with information.\n\n+   * Tracks metrics such as\n  * Circuit state\n  * Error\
    \ rate\n  * Traffic volume\n  * Successful requests\n  * Rejected requests\n \
    \ * Timeouts\n  * Latency percentiles\n* Monitor protected calls\n  * Single server\
    \ or cluster\n\nIt tracks and displays information about the state of the circuit,\
    \ whether it's open or closed, the error rate for the call, the traffic volume\
    \ that it's receiving, how many requests were successful, rejected, or timed out,\
    \ and the latency percentiles for the call. And you can also use it to track a\
    \ single server or a cluster of servers. To use it, it's literally as easy as\
    \ declaring a couple dependencies in your pom.xml and adding a single annotation."
- md: "\n# Using Spring Cloud and the Netflix Hystrix Dashboard\n\nIn order to use\
    \ the Hystrix Dashboard, you first first, like always, declare a new dependency\
    \ within the dependencyManagement section of your pom.xml or spring-cloud-dependencies.\n\
    \n```xml\npom.xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\nAnd, as\
    \ always again, make sure that it's of type pom and has a scope of import.\n\n\
    ```xml\npom.xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-hystrix-dashboard</artifactId>\n</dependency>\n\
    ```\n\nThen, still within your pom.xml, in the dependency section, define a new\
    \ dependency on spring-cloud-starter-hystrix-dashboard. And finally, you can probably\
    \ guess it, add the @EnableHystrixDashboard annotation.\n\n```java\n@SpringBootApplication\n\
    @EnableHystrixDashboard\npublic class Application{\n    public static void main(String[]args){\n\
    \        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\nAnd\
    \ that's all you need to get started with the Hystrix Dashboard.\n\n# Reading\
    \ and Understanding the Hystrix Dashboard\n\nBefore we get started with the demo\
    \ of setting up the Hystrix Dashboard, it'll be important to understand how to\
    \ read the dashboard as it contains a lot of information in a very small amount\
    \ of space.\n\n# Hystrix Stream: Demo\n\n# HYSTRIX DEFEND YOUR APP\n\nCircuit\n\
    \nSort: Error then Volume | Alphabetical | Error | Mean | Median | 90 | 92 | 99.5\
    \ Success | Short-Circuited | Volume | Bad Request | Timeout | Rejected | Failure\
    \ | Error %\n\n```\ngetCurrentWeather\n5,253 0 0.0%\n0 0\n0\n0\nHost: 526.3/s\n\
    Cluster: 526.3/s\nCircuit: Closed\nHosts\n1 90% 1ms\nMedian 1ms 29ms\nMean 0ms\
    \ 99.5% 2ms\n```\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_188_0.png)\n\n# Thread\
    \ Pools\n\nSort: Alphabetical | Volume |\n\n```\nWeatherService\nHost: 521.1/s\n\
    Cluster: 521.1/s\nActive 0 Max Active 1\nQueued Executions 5,250\nPool Size 10\
    \ Queue Size 5\n```\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_188_1.png)\n\n\
    We focus on the top half under the Circuit heading as is pretty self-explanatory.\
    \ The dashboard is quite literally jam-packed with information. And it can be\
    \ a little daunting when you see it at first, so let's break it down by parts.\
    \ At the top right you have the name of the Hystrix call that is protected, and\
    \ in this picture it's the getCurrentWeather call.\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_189_0.png)\n\
    \nOn the left side, you have a circle that represents the request volume, as well\
    \ as the health of the call, and the larger the circle gets, the more red the\
    \ circle becomes, the more unhealthy the call is. Then on top of the circle, the\
    \ line is a depiction of the request rate over the last 2 minutes. Back on the\
    \ right side, beneath the name of the protected call in gray, is the error rate\
    \ of the call. And below that you have the request rate per second at the host\
    \ level, as well as at the cluster level. Continuing downward, still on the right\
    \ side, you have the state of the circuit for this particular call and whether\
    \ it's open and rejecting traffic or whether it's closed and accepting traffic.\
    \ And then right below that you have the latency percentiles for this call. Moving\
    \ back to the top, underneath the name of the protected call are a bunch of numbers\
    \ in columns with different colors. Let's zoom in on this particular area so we\
    \ can explain each of these individually. For the numbers, we'll move column by\
    \ column and row by row. And, just in case you forget, there's a legend at the\
    \ top of the Hystrix Dashboard that looks like this.\n\n| Success | Short-Circuited\
    \ | Bad Request | Timeout | Rejected | Failure | Error % |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n| getCurrentWeather | | | | | | |\n| 0 | 0.0%\
    \ | | | | | |\n| 0 | | | | | | |\n\nStarting at the first column in the first\
    \ row, the dark green number represents the number of successful requests. And\
    \ right below that, the blue number represents the number of short-circuited requests.\
    \ And these are the requests that didn't even attempt to execute because the circuit\
    \ was open. Still in the first column, on the bottom row, the light green number\
    \ represents the number of bad requests. And these requests are errors, but they're\
    \ not necessarily due to an execution failure. They're due to something like an\
    \ illegal argument. Moving on to the second column, the first row, the orange\
    \ number represents the number of timed out requests. And these are requests where\
    \ the execution was attempted, but a response was not received in the allotted\
    \ amount of time. Right below the timed out request, the purple number represents\
    \ the number of rejected requests. And rejected requests happen when there are\
    \ no more resources to serve a request, either via the thread pool or a semaphore.\
    \ And remember that the request is rejected so that requests don't stack up at\
    \ the caller and consume those valuable resources. And the last number in the\
    \ second column, the red one, is the number of failed requests. And these are\
    \ requests that failed to execute because they threw an exception. Now that we've\
    \ got a firm understanding of how to read the Hystrix Dashboard, let's set up\
    \ and enable our own so that we can visualize some of the metrics that are being\
    \ admitted from the call that we protected with Hystrix in our previous demo.\n\
    \n# Demo: Monitoring Fault Tolerance Metrics with Hystrix Dashboard\n\nIn this\
    \ demo, we'll utilize the Hystrix Dashboard to view some of the metrics of the\
    \ Hystrix-protected call from the Hystrix-protected call from the weather app.\
    \ First things first, if your services aren't already running, you'll need to\
    \ start each of them. So expand the discovery server and navigate to the main\
    \ application class. Right-click on it, go to Run As, choose Spring Boot App.\
    \ Repeat that same process for the weather service and then the weather app and\
    \ the discovery server are all running. And just to double-check, you can click\
    \ and see that each of services is started. Next, go ahead and open up a browser\
    \ so we can create and download the Hystrix Dashboard. In your web browser, visit\
    \ start.spring.io. In the Group section, use io.ajay.kumar, and then for the artifact\
    \ name we'll say hystrix-dashboard. And then for the dependencies, we'll type\
    \ Hystrix Dashboard.\n\n# Generate a Maven Project with Java and Spring Boot 2.1.1\n\
    \n# Project Metadata\nArtifact coordinates\nGroup: io.ajay.kumar\nArtifact: hystrix-dashboard\n\
    \n# Dependencies\nAdd Spring Boot Starters to your project\nSearch for dependencies:\
    \ Web, Security, JPA, Actuator, DevTools...\nSelected Dependencies: Hystrix Dashboard\n\
    \n```bash\nGenerate Project\n```\n\nOnce you have everything filled out, go ahead\
    \ and click the Generate Project button, and that'll create that zip file for\
    \ you. Like always, extract that zip file and head back to your IDE. Back within\
    \ your IDE, right-click on the empty space in the Package Explorer, to Import,\
    \ choose Existing Maven Projects, click Next, click Browse, locate the downloaded\
    \ zip file, and click Open, and click Finish.\n\nExpand the Hystrix Dashboard\
    \ project and navigate to the main application class.\n\n```java\npackage io.ajay.kumar.hystrixdashboard;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.cloud.netflix.hystrix.dashboard.EnableHystrixDashboard\n\
    \n@SpringBootApplication\n@EnableHystrixDashboard\npublic class HystrixDashboardApplication\
    \ {\n    public static void main(String[] args) {\n        SpringApplication.run(HystrixDashboardApplication.class,\
    \ args);\n    }\n}\n```\n\nWithin the main application class, we will quite literally\
    \ add one annotation, and that's the @EnableHystrixDashboard annotation. Next,\
    \ we're ready to start things up and view the dashboard. So on the main application\
    \ class, right-click on it, go to Run As, choose Spring Boot App. Next, open up\
    \ a browser and visit localhost:8080/hystrix.\n"
  mdcn: "\n\n# 使用 Spring Cloud 和 Netflix Hystrix Dashboard\n\n为了使用 Hystrix Dashboard，你首先，像往常一样，在\
    \ `pom.xml` 或 `spring-cloud-dependencies` 的 `dependencyManagement` 部分中声明一个新的依赖项。\n\
    \n```xml\npom.xml\n<dependencyManagement>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.cloud</groupId>\n      <artifactId>spring-cloud-dependencies</artifactId>\n\
    \      <version>Camden.SR2</version>\n      <type>pom</type>\n      <scope>import</scope>\n\
    \    </dependency>\n  </dependencies>\n</dependencyManagement>\n```\n\n并且一如既往，确保它的类型为\
    \ `pom` 且范围为 `import`。\n\n```xml\npom.xml\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n\
    \  <artifactId>spring-cloud-starter-hystrix-dashboard</artifactId>\n</dependency>\n\
    ```\n\n然后，在你的 `pom.xml` 的 `dependency` 部分中，定义对 `spring-cloud-starter-hystrix-dashboard`\
    \ 的新依赖。最后，你可能已经猜到了，添加 `@EnableHystrixDashboard` 注解。\n\n```java\n@SpringBootApplication\n\
    @EnableHystrixDashboard\npublic class Application{\n    public static void main(String[]args){\n\
    \        SpringApplication.run(Application.class,args);\n    }\n}\n```\n\n这就是你启动\
    \ Hystrix Dashboard 需要的所有内容。\n\n# 阅读和理解 Hystrix Dashboard\n\n在我们开始演示设置 Hystrix\
    \ Dashboard 之前，理解如何阅读仪表板重要，因为它在非常空间内包含了大量信息。\n\n# Hystrix Stream：演示\n\n# 保护你的应用\n\
    \n路器 (Circuit)\n\n排序：错误优先于数量 | 字母顺序 | 错误 | 平均值 | 中位数 | 90 | 92 | 99.5 成功 | 短路\
    \ | 数量 | 错误请求 | 超时 | 拒绝 | 失败 | 错误 %\n\n```\ngetCurrentWeather\n5,253 0 0.0%\n\
    0 0\n0\n0\nHost: 526.3/s\nCluster: 526.3/s\nCircuit: Closed\nHosts\n1 90% 1ms\n\
    Median 1ms 29ms\nMean 0ms 99.5% 2ms\n```\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_188_0.png)\n\
    \n# 线程池\n\n排序：字母顺序 | 数量 |\n\n```\nWeatherService\nHost: 521.1/s\nCluster: 521.1/s\n\
    Active 0 Max Active 1\nQueued Executions 5,250\nPool Size 10 Queue Size 5\n```\n\
    \n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_188_1.png)\n\n我们关注“Circuit（路器）”标题下的半部分，因为那部分非常自俗易懂。仪表板确实字面上挤满了信息。当你第一次看到它时可能会有点无从从，所以让我们分部分来拆解。在右上角，你有受保护的\
    \ Hystrix 调用名称，在图中它是 `getCurrentWeather` 调用。\n\n![](img/e33dbe7cce1ed533e80ee7389d9ce1d8_189_0.png)\n\
    \n在左侧，你有一个圆代表请求量以及调用的健康状况，圆越大、颜色越红，表示调用越不健康。在圆的上方，线条是过去 2 分钟内请求速率的描绘。回到右侧，在灰色受保护调用名称下方，是该调用的错误率。在其下方，你有主机级别以及集群层级的每秒请求率。继续向下，仍在右侧，你拥有该特定调用的路器状态，以及它是开启（open）并拒绝流量，还是关闭（closed）并接受流量。紧接着在下方，是该调用的延迟百分位数。回到顶部，受保护调用名称下方是一系列不同颜色的列数字。让我们放大这个特定区域，以便我们单独解释每一个数字。对于数字，我们将逐列、逐行地移动。为了以防你忘记，Hystrix\
    \ Dashboard 顶部有一个这样的这样的图例。\n\n| 成功 | 短路 | 错误请求 | 超时 | 拒绝 | 失败 | 错误 % |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| getCurrentWeather | | | | | |\
    \ |\n| 0 | 0.0% | | | | | | |\n| 0 | | | | | | |\n\n从第一行第一列开始，深绿色的数字代表成功请求的数量。紧接其下，蓝色数字代表短路请求的数量。这些是由于路器开启而甚至没有尝试执行的请求。在第一列的底行，浅绿色的数字代表错误请求的数量。这些请求是错误，但并不一定由于执行失败导致。它们是由于非法参数等原因。移动到第二列第一行，橙色数字代表超时请求的数量。这些是尝试执行但未在规定时间内收到响应的请求。在其下方，紫色数字代表被拒绝请求的数量。这些是当路器开启时被拒绝的请求。在第二列的底行，红色数字代表失败请求的数量。这些是在执行时抛出异常的请求。移动到第三列第一行，黄色数字代表错误百分比。这些是由于执行失败而产生的请求百分比。现在我们已经了\
    \ Hystrix Dashboard 的可视化，让我们开始演示。\n\n"
