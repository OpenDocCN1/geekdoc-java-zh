    \n# 使用 Spring Cloud Config Client\n\n现在我们已经看到了 Spring Cloud Config Server 是如何工作的，以及如何设置它，让我们来看看等式的另一端：客户端（Client）。从核心角度来说，Config\
    \ Client 负责引导（bootstrapping）和获取应用程序配置。当我说 Config Client 负责引导应用程序配置时，什么意思？嗯，当 Spring\
    \ 应用程序启动时，它需要解析它的属性源。而且它需要在启动过程的早期完成工作。这样做的某些原因包括你的占位符（placeholders）。当你解析这些占位符时，它实际上需要具体的值来解析这些占位符。由于配置位于\
    \ Configuration Server 上，这意味着 Config Client 需要在 Spring 应用程序上下文在技术上启动之前就获取应用程序配置。如果它等到应用程序启动后再获取，那么在过程中就太晚了。这有两种方法可以获取\
