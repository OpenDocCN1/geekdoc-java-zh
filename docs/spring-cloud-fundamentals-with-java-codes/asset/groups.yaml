    We''re going to specifically target a number of key areas. First, we''re going
    to look at service discovery. How do you dynamically find your application services
    in the cloud at runtime? Then, we''ll move on to distributed configuration, or
    how to manage common or service-specific configuration in a distributed system.
    Then, we''ll look at intelligent routing, or how to make a distributed system
    look as if it were a single cohesive system using Intelligent Routing. Then, we''ll
    look at client-side load balancing, or how you distribute load among several instances
    of the same service. And last, we''ll look at how you can use the circuit breaker
    pattern to build fault-tolerant applications in the cloud.'
- md: "\n# Prerequisites\n\n- Java 8+\n- Spring Boot 1.4+\n- Knowledge of Microservices\
    \ or SOA\n\nLet's talk prerequisites. I assume that you have a good understanding\
    \ of Java and particularly Java 8, as well as a good understanding of Spring Boot\
    \ as Spring Cloud is largely built on top of Spring Boot. Last, I expect that\
    \ you have at least a knowledge or an understanding of microservices or service-oriented\
    \ architectures.\n\n- Java 8+\n- Maven 3+\n- Spring Tool Suite (Eclipse STS) 3.8\n\
    \nNext, let's talk about what software you're going to need to be successful in\
    \ this book. Of course you're going to need Java, Java 8, and you'll need Maven,\
    \ at least Maven 3, in order to build the Spring Boot applications. And we're\
    \ going to be doing all of our development using Spring Tool Suite, or Eclipse\
    \ STS, as it's called. Make sure you have at least version 3.8.\n\n# Module 3:\
    \ Finding Services Using Service Discovery\n\n## What Is Service Discovery?\n\n\
    - In this module:\n  - Service Discovery\n  - Discovering Services with Spring\
    \ Cloud\n    - Using Eureka client and server\n    - Configuration\n    - Health\
    \ & High Availability\n    - Dashboard\n    - AWS Availability\n\nIn this module\
    \ we will look at how service discovery helps you locate your application services\
    \ in the cloud. Let's quickly start off by talking about what this module contains,\
    \ and first we're going to look at service discovery. Obviously this module's\
    \ about service discovery, so we'll talk about what it is and why it's important.\
    \ Then, we're going to look at how Spring Cloud implements service discovery.\
    \ It uses a project from Netflix that was open sourced, it's called Eureka, and\
    \ we're going to talk about the Eureka Client and the Eureka Server. Then, we'll\
    \ move on to configuration, configuring the Eureka Client, the Eureka Server,\
    \ and the Eureka Instance how each of those are different and what you need to\
    \ tweak them or configure them for your needs. Then, we'll move into health and\
    \ high availability. How does the Eureka Server know when your application is\
    \ down or when it's unhealthy? And how do you ensure that the Eureka Server is\
    \ highly available? And then we're going to look at the Eureka Dashboard, which\
    \ is a nice web UI that shows all of your registered services, how many instances\
    \ there are, and whether they're up or down.\n\nAnd last, we're going to finish\
    \ out with how Eureka has specific support for AWS. Let's get started with the\
    \ most important question, what is service discovery and why do we need it? Remember\
    \ that the cloud is changing the way that we build software. We're moving from\
    \ building these single large applications and instead breaking them up into smaller\
    \ and smaller pieces called services. And each of those individual services can\
    \ then be deployed and scaled on their own, and together, as a whole, they form\
    \ the overall.. herein lies the problem. How does one service know where another\
    \ service is, its host and its port, so that it can call and use it? For starters,\
    \ we could simply configure all of our services to know the location and the port\
    \ of other services that it calls. And, depending on our needs, this actually\
    \ gets us pretty far. But after a while, we'll learn that there are problems with\
    \ this approach. What if, for example, you have two instances of a particular\
    \ service? So, in our example here, we have Application Service A calling Application\
    \ Service B. And if we used configuration, every time we added or removed a new\
    \ instance of Application Service B, we'd have to update that configuration. And,\
    \ well, in our example, we only have two instances. Imagine if you had hundreds\
    \ of instances. The configuration management alone would be unsustainable. Our\
    \ simple configuration starts to break down even further as we move to a cloud\
    \ environment. In a cloud environment, you have instances of services that can\
    \ come and go in response to demand, for instance. So, for example, Application\
    \ Service B starts with two instances, and consider that maybe you have this huge\
    \ influx of traffic, maybe it's a flash sale on your eCommerce website, and an\
    \ automated process kicks off and starts two more instances to handle all of that.\
    \ Well, if you're using simple configuration, all of the callers of Application\
    \ Service B, such as Application Service A, would not know about the new instances\
    \ that were added in response to that demand. As far as they're concerned, their\
    \ configuration says that there are only two instances they know about. Another\
    \ thing to consider is that application services will eventually fail. And regardless\
    \ of the situation, whether it's a memory problem or a hardware problem, if you're\
    \ using simple configuration, your services are going to try to send traffic to\
    \ those failed instances. For example here, we have Application Service B being\
    \ called by Application Service A, and it has two instances. And if one of those\
    \ instances fails, Application Service A is not going to know the better, and\
    \ it's going to continue to send traffic to that failed instance. We need something\
    \ that is more dynamic. When a approach is just far too static. It's too frozen\
    \ in time for our needs in the cloud. That's where service discovery comes into\
    \ play.\n\n- Service discovery provides\n  - A way for a service to register itself\n\
    \  - A way for a service to deregister itself\n  - A way for a client to find\
    \ other services\n  - A way to check the health of a service and remove unhealthy\
    \ instances\n\nService discovery typically provides the following types of functionality.\
    \ A way for a service to register itself. And what means is when a service comes\
    \ online it can call out to the Service Discovery Server and let it know the location\
    \ and port of its service so that other application services call it. For the\
    \ exact opposite reasons, service discovery provides a way for a service to deregister\
    \ itself. So if a service were to shut down or go away temporarily for upgrades,\
    \ it would want to let the Service Discovery Server know it's no longer available\
    \ for clients to use. And, most importantly, service discovery provides a way\
    \ for clients to find other services. And what do I mean by clients? Well I mean\
    \ other application services. So if you're an application service that needs to\
    \ use another service, you need to be able to find the location and port of that\
    \ service, and you can ask the Service Discovery Server for information. Lastly,\
    \ service discovery provides a way to check the health of a service and remove\
    \ any unhealthy instances. So each application service would implement a health\
    \ check, typically via a REST endpoint, and then the Service Discovery Server\
    \ would call that instance from its registry.\n\n# Introducing Spring Cloud Netflix\n\
    \nNow that we have a good understanding of what service discovery is and why it's\
    \ important, let's learn how Spring Cloud helps us implement it.\n\n- Discover\
    \ services with:\n  - Spring Cloud Consul\n  - Spring Cloud Zookeeper\n  - Spring\
    \ Cloud Netflix\n\nThere are actually several different ways that you can discover\
    \ services using Spring Cloud. There's the Spring Cloud Consul project, there's\
    \ the Spring Cloud Zookeeper project, and there's the Spring Cloud Netflix project.\
    \ We're going to specifically focus on the last one, the Spring Cloud Netflix\
    \ project. The folks over Netflix have some serious experience building scalable\
    \ applications in the cloud. And, in fact, you could probably even argue they\
    \ have some of the largest scalability problems you can imagine. And they built\
    \ some projects internally to handle these problems and eventually released them\
    \ as open source projects.\n\n- Netflix OSS + Spring + Spring Boot = Spring Cloud\
    \ Netflix\n\nThe Spring Cloud project took the Netflix open source projects and\
    \ added some Spring and some Boot features. They sort of Spring-a fide it, if\
    \ you will. And what was born out of that was the Spring Cloud Netflix project.\
    \ Similar to the Spring Cloud project, the Spring Cloud Netflix project is not\
