    # Client-side vs. Server-side Load Balancing


    So what is load balancing? Simply put, load balancing is a way to improve the
    distribution of workload across multiple computing resources. And you probably
    already know that, so the more important question is what role for having multiple
    instances of a single application does load balancing play in a cloud-native architecture?
    And the answer to that is actually a very important one, probably even more important
    than in a non-cloud-native architecture. And the reason for that becomes clearer
    when you look at the differences in the architecture. In a non-cloud-native application,
    you go from having multiple instances of a single application with a single load
    balancer to multiple services with multiple instances and multiple load balancers.
    And you can start to see the importance of a load balancer just by the sheer number
    of load balancers that we need in a cloud-native application. There are typically
    two different types of load balancers. There''s the server-side load balancer
    where the server is responsible for the distribution of the load, and there the
    client-side load balancer where the caller is responsible for the distribution
    of the load. Let''s take a look at each of these in a bit more detail. With server-side
    load balancing, a request to another service in front of the service, which then
    decides which of the multiple instances it should forward the request to. With
    client-side load balancing, there is no intermediary. The client, or the caller
    of the service, is aware of all of the instances of a service via a known list
    or service discovery. The client is responsible for deciding which of the multiple
    instances it should send the request to. To solidify our understanding of server-side
    versus client-side load balancing, let''s look at each of them side by.


    +   - Server-side


