  \n### 在加载时修改字节码\n\n在上一节中，你看到了一个可以编辑类文件的工具。然而，在构建过程中再添加另一个工具可能是繁琐的。一种具吸引力的替代方案是将字节码工程推迟到*加载时*，即类加载器加载类的时候。\n\
  \n*instrumentation API*提供了一个用于安装字节码转换器的钩子。该转换器必须在程序的 `main` 方法被调用之前安装。你可以通过定义一个*代理（agent）*来满足这一要求，代理是一个被加载用以某种方式监控程序的库。代理代码可以在\
  \ `premain` 方法中执行初始化。\n\n构建代理所需的步骤如下：\n\n1. 实现一个包含该方法的类：\n   ```java\n   public\
  \ static void premain(String arg, Instrumentation instr)\n   ```\n   该方法在代理被加载时被调用。代理可以获取一个命令行参数，该参数通过\
  \ `arg` 参数传递。`instr` 参数可用于安装各种钩子。\n\n2. 创建清单文件 `EntryLoggingAgent.mf` 并设置 `Premain-Class`\
  \ 属性，例如：\n   ```text\n   Premain-Class: bytecodeAnnotations.EntryLoggingAgent\n\
  \   ```\n\n3. 将代理代码和清单文件打包成 JAR 文件：\n   ```bash\n   javac -classpath .:asm/* bytecodeAnnotations/EntryLoggingAgent.java\
  \ \n   jar cvfm EntryLoggingAgent.jar bytecodeAnnotations/EntryLoggingAgent.mf \\\
  \n      bytecodeAnnotations/Entry*.class\n   ```\n\n要配合代理启动 Java 程序，请使用以下命令行选项：\n\
  ```bash\njava -javaagent:AgentJARFile=agentArgument . . .\n```\n\n例如，要使用入口日志代理运行\
  \ `SetTest` 程序，调用调用\n```bash\njavac set/*.java\njava -javaagent:EntryLoggingAgent.jar=set.Item\
  \ -classpath .:asm/* set.SetTest\n```\n\n`Item` 参数是代理应该修改的类名。\n\n[](#index.xhtml_ch11list16)\
  \ 显示了代理代码。该代理安装了一个类文件转换器。转换器首先检查类名是否匹配。如果是，它将使用 `agent` 来修改字节码。这些字节码不会保存到文件中。\n\n\
  ```java\npackage bytecodeAnnotations;\n\nimport java.lang.instrument.*;\nimport\
  \ java.security.*;\nimport org.objectweb.asm.*;\n\n/**\n * @version 1.18-05-01\n\
  \ * @author Cay Horstmann\n */\npublic class EntryLoggingAgent {\n\n    public static\
  \ void premain(String arg, Instrumentation instr) {\n        Logger.getLogger(\"\
  com.horstmann\").setLevel(Level.FINEST);\n        var handler = new ConsoleHandler();\n\
  \        handler.setLevel(Level.FINEST);\n        Logger.getLogger(\"com.horstmann\"\
  ).addHandler(handler);\n\n        var parts = new HashSet<Item>();\n        parts.add(new\
  \ Item(\"Toaster\", 1279));\n        parts.add(new Item(\"Microwave\", 4104));\n\
  \        parts.add(new Item(\"Toaster\", 1279));\n        System.out.println(parts);\n\
  \n        instr.addTransformer(new ClassTransformer() {\n            @Override\n\
  \            public byte[] transform(ClassLoader loader, String className, Class<?>\
  \ classBeingRedefined, ProtectionDomain protectionDomain, byte[] classBuffer) throws\
  \ IllegalFormatException {\n                if (!className.equals(\"Item\")) {\n\
  \                    return null;\n                }\n                ClassReader\
  \ reader = new ClassReader(classBuffer);\n                ClassWriter writer = new\
  \ ClassWriter(reader, ClassWriter.COMPUTE_MAXS);\n                ClassVisitor adapter\
  \ = new ClassVisitor(Opcodes.ASM9, writer);\n                reader.accept(adapter,\
  \ 0);\n                return writer.toByteArray();\n            }\n        });\n\
  \    }\n}\n```\n\n在本章中，你学习了如何\n*   向 Java 程序中添加工具\n*   设计你自己的工具\n*   实现利用的工具\n\n\
  上一节为你提供了理解所需的背景，并可能激发了你开发自己工具的兴趣。本章将讨论的。\n\n## 模块概念\n\n在面向对象编程中，基本的构建单元是类。类提供了封装性。私有特性只能由具有显式权限的代码访问——即类的方法。这使得对访问进行推理变得可能。如果一个私有变量发生了变化，你可以列出所有责任人。如果你需要修改私有表示，你知道哪些方法受了影响。\n\
  \n在 Java 中，包（packages）提供了规模更大的组织分组。包是类的集合。包还提供了一种层次的封装。任何具有包级访问权限（既不是公共的不是私有的）的特性只能从同一包中的方法访问。\n\
  \n然而，在大型系统中，这种级别的访问控制是不够的。任何公共特性（即可以在包外部访问的特性）在任何地方都可用。假设你想修改或丢弃一个很少使用的特性。一旦它是公共的，就没有办法可以推理该更改的影响。\n\
  \n## Java 平台系统\n\n面向对象编程的一个重要特征是封装。一个类由公共接口和私有实现组成。类可以通过改变实现来实现演进。模块系统为大型项目提供了相同的益处。模块可以选择性地开放类和包，以便控制其的演进。\n\
  \n现有的若干模块系统依赖于类加载器来隔离类。然而，Java 9 引入了一个新系统，称为 Java 平台系统，它由编译器和虚拟机支持。它旨在将 Java 平台的大型代码库模块化。无论你是否在应用程序中使用模块，都可能受到模块化平台的影响。本章将向你展示如何声明和使用。还将学习如何迁移你的应用程序以与模块化平台和第三方模块协作。\n\
  \n\n\n\n\nJava 平台的设计者在面对巨大的代码乱团时，决定他们需要一种能够提供更多控制的结构化机制。他们查看了现有的模块系统（例如 `OSGi`），并发现它们并不适用于他们要解决的问题。相反，他们设计了一个新系统，称为\
  \ `Java 平台模块系统`（Java Platform Module System），它现在是 Java 语言和虚拟机的一部分。该系统已成功用于将 Java\
  \ API 模块化，如果你愿意，也可以在自己的应用程序程序中使用它。\n\n一个 Java 平台模块包含：\n* 一个包（packages）的集合\n* 可选的资源文件和其他文件（如原生库）\n\
  * 模块中可访问的包列表\n* 该模块所依赖的所有模块列表\n\nJava 平台在编译时和虚拟机中强制执行封装和依赖关系。\n\n为什么你应该考虑在自己的程序中使用\
  \ Java 平台模块系统，而不是遵循在类类路径上使用 `JAR` 文件的传统方法呢？有两个优势：\n\n1. **强封装**：你可以控制哪些包是可访问的，而你不必担心维护那些你并不打算供公开使用的代码。\n\
  2. **可靠的配置**：你避免了常见的类路径问题，例如重复类或缺失类。\n\nJava 平台模块系统没有解决某些问题，例如模块的版本控制。它不支持指定需要哪个版本的模块，也不支持在同一个程序中使用模块的多个版本。这些可能是我们想要的功能，但如果你需要这些功能，就必须使用\
  \ Java 平台模块系统以外的机制。\n\n## 模块命名（Naming Modules）\n\n模块是包的集合。模块中的包名不需要相关。例如，`java.sql`\
  \ 模块包含了 `java.sql`、`javax.sql` 和 `javax.transaction.xa` 包。此外，正如你从这个示例看到的，模块名与包名相同是完全可以的。\n\
  \n就像包名一样，模块名由字母、数字、下划线和句号组成。同样，与包名一样，模块之间没有层级关系。如果你有一个模块 `com.horstmann` 和另一个模块\
  \ `com.horstmann.corejava`，那么从模块系统的角度来看，它们是不相关联的。\n\n在创建一个供他人使用的模块时，确保其名称在全局范围内唯一的是非常重要的。预计大多数模块名将像包名一样遵循“反向域名”约定。\n\
  \n最简单的方法是用模块提供的顶层包来命名模块。例如，SLF4J 日志门面有一个模块 `org.slf4j`，它包含了 `org.slf4j`、`org.slf4j.spi`、`org.slf4j.event`\
  \ 和 `org.slf4j.helpers` 包。\n\n这种约定防止了模块中的包名冲突。任何给定的包只能放在一个模块中。如果你的模块名是唯一的，且包名以模块名开头，那么你的包名也将是唯一的。\n\
  \n对于不供其他程序员使用的模块，可以使用较短的模块名，例如一个包含应用程序的模块。为了说明这是可行的，我将在本章中这样做。包含可能是库代码的模块将具有如 `com.horstmann.util`\
  \ 的名称，而包含程序（带有具有 `main` 方法的类）的模块将具有如 `v1ch12.hellomod` 等易记名称。\n\n模块名仅用于模块声明。在你的\
  \ Java 类的源文件中，你永远不会引用模块名；相反，请像一以来那样使用包名。\n\n## 模块化的“Hello, World!”程序\n\n让我们把传统的“Hello,\
  \ World!”程序放入模块中。首先，我们需要将类放入一个包中——“未命名包”不能包含在模块中。这里是：\n\n```\npackage com.horstmann.hello;\n\
  \npublic class HelloWorld\n{\n   public static void main(String[] args)\n   {\n\
  \      System.out.println(\"Hello, Modular World!\");\n   }\n}\n```\n\n到目前为止，没有任何变化。要创建一个包含此包的\
  \ `v1ch12.hellomod` 模块，你需要添加一个模块声明。将其放置在名为 `module-info.java` 的文件中，位于基目录下（即包含 `com`\
  \ 目录的相同目录）。按照约定，基目录的名字与模块名相同。\n\n```\nv1ch12.hellomod/\n└ module-info.java\n  com/\n\
  \  └ horstmann/\n    └ hello/\n      └ HelloWorld.java\n```\n\n`module-info.java`\
  \ 文件包含了模块声明：\n\n```\nmodule v1ch12.hellomod\n{\n}\n```\n\n这个模块声明是空的，因为该模块没有向任何人提供任何内容，也不需要任何东西。\n\
  \n现在，照常编译：\n\n```\njavac v1ch12.hellomod/module-info.java v1ch12.hellomod/com/horstmann/hello/HelloWorld.java\n\
  ```\n\n`module-info.java` 文件看起来不像一个 Java 源文件，而且，它不能有一个名为 `module-info` 的类，因为类名不能包含连字符。`module`\
  \ 关键字，以及你在后续章节中看到的 `requires`、`exports` 等关键字，都是“受限关键字”，它们只在模块声明中具有特殊含义。该文件被编译成类文件\
  \ `module-info.class`，包含了模块定义。\n\n要作为模块化应用程序运行此程序，你需要指定模块路径，它类似于类路径但包含的是模块。你还以 `modename/classname`\
  \ 的格式指定主类：\n\n```\njava --module-path v1ch12.hellomod --module v1ch12.hellomod/com/horstmann/hello/HelloWorld\n\
  ```\n\n除了 `--module-path` 和 `--module`，你可以使用单字母选项 `-p` 和 `-m`：\n\n```\njava -p v1ch12.hellomod\
  \ -m v1ch12.hellomod/com.horstmann.hello.HelloWorld\n```\n\n无论哪种方式，都会出现“Hello, Modular\
  \ World!”，这证明你成功实现了实现了模块化。\n\n当你编译此模块时，会收到一个警告（如果模块名包含数字）：\n\n```\nwarning: [module]\
  \ module name v12 should avoid terminal digits\n```\n\n这个警告是为了防止程序员在模块名中添加数字。你可以忽略这个警告，或者使用注解抑制它：\n\
  \n```\n@SuppressWarnings(\"module\")\nmodule v12\n{\n}\n```\n\n在这一点上，`module` 就像类声明：你可以对其进行注解。（注解类型的目标必须是\
  \ `ElementType.MODULE`。）\n\n## 需要模块（Requiring Modules）\n\n让我们创建一个新模块 `v1ch12.requiremod`，其中程序使用\
  \ `JOptionPane` 来显示“Hello, Modular World!”消息：\n\n```\npackage com.horstmann.hello;\n\
  \nimport javax.swing.JOptionPane;\n\npublic class HelloWorld\n{\n   public static\
  \ void main(String[] args)\n   {\n      JOptionPane.showMessageDialog(null, \"Hello,\
  \ Modular World!\");\n   }\n}\n```\n\n现在编译失败，并显示此消息：\n\n```\nerror: package javax.swing\
  \ is not visible\n  (package javax.swing is declared in module java.desktop, \n\
  \  but module v1ch12.requiremod does not read it)\n```\n\nJDK 已经模块化，`javax.swing`\
  \ 包现在包含在 `java.desktop` 模块中。我们的模块需要它依赖该模块：\n\n```\nmodule v1ch12.requiremod\n{\n\
  \   requires java.desktop;\n}\n```\n\n模块系统的设计目标之一是让模块显式声明它们的需求，这样虚拟机可以在启动程序之前确保所有需求都已满足。\n\
  \n在前面的章节中，并没有出现显式需求的情况，因为我们只使用了 `java.lang` 和 `java.io` 包。这些包包含在 `java.base` 模块中，而该模块是默认需要的。\n\
  \n\n\n\n\n注意，我们的 `v1ch12.requiremod` 模块仅列出了它自身的模块依赖。它需要 `java.desktop` 模块以便使用 `javax.swing`\
  \ 包。`java.desktop` 模块本身声明它需要另外三个模块，即 `java.datatransfer`、`java.prefs` 和 `java.xml`。\n\
  \n[](#index.xhtml_module-graph-fig)显示了`模块图`，其节点是模块。图的边（即连接节点的箭头）要么是声明的依赖，要么在没有声明依赖的情况下，对\
  \ `java.base` 的隐式依赖。\n\n![.png](img/module-graph1.jpg)Swing “Hello, Modular World”应用程序的模块图\n\
  \n模块图中不能有循环——也就是说一个模块不能直接或间接地引用它自身。\n\n模块不会自动将访问权限传递给其他模块。在我们的示例中，`java.desktop`\
  \ 模块声明它需要 `java.prefs`，而 `java.prefs` 模块声明它需要 `java.xml`。这并没有赋予 `java.desktop` 使用\
  \ `java.xml` 模块中包的权利。它需要显式声明该依赖。用数学术语来说，`requires` 关系不是“传递的”。通常情况下，这种行为是理想的因为它让依赖变得显式，但正如你在\
  \ [](#index.xhtml_requires-transitive) 中看到的，在某些情况下你可以放宽。\n\n本节开错误消息显示我们的 `v1ch12.requiremod`\
  \ 模块没有“读取” `java.desktop` 模块。用 Java 模块系统的术来说，在以下情况下模块 `M` *读取*模块 `N`：\n\n1. `M`\
  \ 需要 `N`。\n2. `M` 需要一个传递地需要 `N` 的模块（参见 [](#index.xhtml_requires-transitive)）。\n\
  3. `N` 是 `M` 或 `java.base`。\n\n## 导出包\n\n在前节中，你看到如果模块想要使用另一个模块的包，就必须需要该模块。然而，这并不会让所需模块中的所有包可用。模块使用\
  \ `exports` 关键字声明哪些包是可访问的。例如，这里是 `java.xml` 模块声明的一部分：\n\n```\nmodule java.xml\n\
  {\n   exports javax.xml;\n   exports javax.xml.catalog;\n   exports javax.xml.datatype;\n\
  \   exports javax.xml.namespace;\n   exports javax.xml.parsers;\n   . . .\n}\n```\n\
  \n该模块提供了许多包，但通过不导出它们（如 `jdk.xml.internal`）来隐藏其他包。\n\n当一个包被导出时，它的 `public` 和 `protected`\
  \ 类、接口以及它们的 `public` 和 `protected` 成员在模块外部是可访问的。（和一样，`protected` 类型和成员仅在子类和相同包中可访问。）\n\
  \n然而，未导出的包在自己的模块外部是不可访问的。这与模块之前的 Java 非常不同。在过去，你可以使用任何包中的公共类，即使它不是公共 API 的一部分。例如，当公共\
  \ API 不提供适当的功能时，通常推荐使用 `sun.misc.BASE64Encoder` 或 `com.sun.rowset.CachedRowSetImpl`\
  \ 等类。\n\n如今，你无法再访问 Java 平台 API 中未导出的包了，因为它们都包含在模块内部。结果是某些程序将无法在 Java 9 上运行。当然，没有人承诺过保持非公共\
  \ API 的可用性，所以这不应该令人震惊。\n\n让我们在一个简单的场景中使用 `exports`。我们将准备一个名为 `com.horstmann.greet`\
  \ 的模块，它导出一个也名为 `com.horstmann.greet` 的包，遵循以下惯例：为他人提供代码的模块应以其内部顶层包命名。还有一个名为 `com.horstmann.greet.internal`\
  \ 的包，我们没有导出。\n\n第一个包中有一个公共的 `Greeter` 接口。\n\n```\npackage com.horstmann.greet;\n\
  \npublic interface Greeter\n{\n   static Greeter newInstance()\n   {\n      return\
  \ new com.horstmann.greet.internal.GreeterImpl();\n   }\n\n   String greet(String\
  \ subject);   \n}\n```\n\n第二个包有一个实现该接口的类。该类是公共的，因为它在第一个包中被访问。\n\n```\npackage com.horstmann.greet.internal;\n\
  \nimport com.horstmann.greet.Greeter;\n\npublic class GreeterImpl implements Greeter\n\
  {\n   public String greet(String subject)\n   {\n      return \"Hello, \" + subject\
  \ + \"!\";\n   }\n}\n```\n\n`com.horstmann.greet` 模块包含这两个包，但只导出第一个：\n\n```\nmodule\
  \ com.horstmann.greet\n{\n   exports com.horstmann.greet;\n}\n```\n\n第二个包在模块外部是不可访问的。\n\
  \n我们将应用程序放入第二个模块中，该模块将需要第一个模块：\n\n```\nmodule v1ch12.exportedpkg\n{\n   requires\
  \ com.horstmann.greet;\n}\n```\n\n`exports` 语句后面跟着一个包名，而 `requires` 后面跟着一个模块名。\n\
  \n我们的应用程序现在使用 `Greeter` 来获取问候：\n\n```\npackage com.horstmann.hello;\n\nimport com.horstmann.greet.Greeter;\n\
  \npublic class HelloWorld\n{\n   public static void main(String[] args)\n   {\n\
  \      Greeter greeter = Greeter.newInstance();\n      System.out.println(greeter.greet(\"\
  Modular World\"));\n   }\n}\n```\n\n这是这两个模块的源文件结构：\n\n```\ncom.horstmann.greet\n\
  ├ module-info.java\n└ com\n  └ horstmann\n    └ greet\n      ├ Greeter.java\n  \
  \    └ internal\n        └ GreeterImpl.java\nv1ch12.exportedpkg\n├ module-info.java\n\
  └ com\n  └ horstmann\n    └ hello\n      └ HelloWorld.java\n```\n\n要构建此应用程序，首先编译\
  \ `com.horstmann.greet` 模块：\n\n```\njavac com.horstmann.greet/module-info.java \\\
  \n   com.horstmann.greet/com/horstmann/greet/Greeter.java \\\n   com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java\n\
  ```\n\n然后，在模块路径上包含第一个模块编译应用程序模块：\n\n```\njavac -p com.horstmann.greet v1ch12.exportedpkg/module-info.java\
  \ \\\n   v1ch12.exportedpkg/com/horstmann/hello/HelloWorld.java\n```\n\n最后，在模块路径上同时包含两个模块运行程序：\n\
  \n```\njava -p v1ch12.exportedpkg:com.horstmann.greet \\\n   -m v1ch12.exportedpkg/com.horstmann.hello.HelloWorld\n\
  ```\n\n此示例演示了如何在模块中隐藏实现。实现类在模块外部是不可访问的。客户端使用接口和工厂方法，而不是实例化实现类。\n\n在 Windows `cmd`\
  \ 终端中，你必须用引号括 `v1ch12.exportedpkg:com.horstmann.greet`，因为冒号字符有特殊含义。你还需要使用 `^` 代替\
  \ `\\` 进行多行命令。\n\n要使用 Eclipse 构建此应用程序，请为每个模块创建一个单独的项目。在 `v1ch12.exportedpkg` 项目中，编辑项目属性。在\
  \ Projects 选项中，将 `com.horstmann.greet` 模块添加到模块路径——参见 [](#index.xhtml_Eclipse-modules)。\n\
  \n![Eclipse-modules](img/Eclipse-modules.jpg)向 Eclipse 项目添加依赖模块\n\n你现在已经看到了构成 Java\
  \ 模块系统骨干的 `requires` 和 `exports` 语句。如你所示，模块系统在概念上是简单的。模块指定它们需要哪些模块，以及向其他模块提供哪些包。[](#index.xhtml_qualified-exports)\
  \ 显示了 `exports` 语句的一种微变体。\n\n模块不提供作用域。你不能在不同的模块中拥有同名的包。这对于隐藏包（即未导出的包）也是如此。\n\n##\
  \ 模块化 JAR\n\n到为止，我们只是将模块编译到源代码目录树中。显然，这对于部署是不够的。相反，模块可以通过将其所有类放在一个 JAR 文件，并在根目录下放置\
  \ `module-info.class` 来进行部署。这样的 JAR 文件被称为*模块化* JAR。\n\n\n\n\n要创建一个模块化的 JAR 文件，请像平时一样使用\
  \ `jar` 工具。如果你有多个包，最好使用 `-d` 选项进行编译，这会将类文件放在一个独立的目录中。如果该目录不存在，则会创建它。然后使用 `jar` 命令的\
  \ `-C` 选项在收集文件时切换到该目录。\n\n```bash\njavac -d modules/com.horstmann.greet \\\n   com.horstmann.greet/module-info.java\
  \ \\\n   com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java \\\n\
  \   com.horstmann.greet/com/horstmann/greet/Greeter.java\njar -c -v -f com.horstmann.greet.jar\
  \ -C modules/com.horstmann.greet .\n```\n\n如果你使用 `Maven`、`Ant` 或 `Gradle` 等构建工具，只需像往常一样构建你的\
  \ JAR 文件即可。只要包含了 `module-info.class`，你就得到了一个模块化的 JAR 文件。\n\n然后，将模块化 JAR 包含在模块路径（module\
  \ path）中，模块就会被加载。\n\n在过去，一个包的类有时会分布在多个 JAR 文件中。（这种包被称为“拆分包”，split package。）这可能从来不是一个好主意，而且在模块化系统中是不可能的。\n\
  \n与普通 JAR 文件一样，你可以在模块化 JAR 中指定一个主类：\n\n```bash\njavac -p com.horstmann.greet.jar\
  \ \\\n   -d modules/v1ch12.exportedpkg \\\n   v1ch12.exportedpkg/module-info.java\
  \ \\\n   v1ch12.exportedpkg/com/horstmann/hello/HelloWorld.java\njar -c -v -f v1ch12.exportedpkg.jar\
  \ -e com.horstmann.hello.HelloWorld \\\n   -C modules/v1ch12.exportedpkg .\n```\n\
  \n当启动程序时，你需要指定包含主类的模块：\n\n```bash\njava -p com.horstmann.greet.jar:v1ch12.exportedpkg.jar\
  \ -m v1ch12.exportedpkg\n```\n\n在创建 JAR 文件时，你可以可选地指定一个版本号。使用 `--module-version`\
  \ 参数，并在 JAR 文件名中也添加版本号：\n\n```bash\njar -c -v -f com.horstmann.greet-1.0.jar --module-version\
  \ 1.0 -C com.horstmann.greet .\n```\n\n正如已经讨论过的，Java 平台模块系统（Java Platform Module\
  \ System）使用版本号来解析模块，但可以通过其他工具和框架查询。\n\n你可以通过反射 API（reflection API）获取版本号。在我们的示例中：\n\
  \n```java\nOptional<String> version = Greeter.class.getModule().getDescriptor().rawVersion();\n\
  ```\n\n会产生一个包含版本字符串 `\"1.0\"` 的 `Optional`。\n\n等同于类加载器的模块是 `layer`（层）。Java 平台模块系统将\
  \ JDK 模块和应用模块加载到 `boot layer`（引导层）中。程序可以使用层 API（本书未涵盖）来加载其他模块。此类程序可能会考虑模块版本。预计 Java\
  \ EE 应用程序服务器等程序的开发者将利用层 API 为模块提供支持。\n\n如果你想将一个模块加载到 JShell 中，请将 JAR 包含在模块路径中并使用\
  \ `--add-modules` 选项：\n\n```bash\njshell --module-path com.horstmann.greet-1.0.jar\
  \ --add-modules com.horstmann.greet\n```\n\n## 模块与反射访问\n\n在前面的章节中，你看到模块系统强制执行封装。模块只能访问另一个模块中显式导出（exported）的包。在过去，始终可以通过反射来克服这些烦人的访问限制。正如你在\
  \ 第 5 章 中所示，反射可以访问任何类的私有成员。\n\n\n\n\n未来的库可能会使用 `variable handles`（变量句）而不是反射来读取和写入字段。`VarHandle`\
  \ 类似于 `Field`。你可以使用它来读取或写入特定类的任何实例的特定字段。然而，为了获取一个 `VarHandle`，库代码需要一个 `Lookup` 对象：\n\
  \n```\npublic Object getFieldValue(Object obj, String fieldName, Lookup lookup)\n\
  \      throws NoSuchFieldException, IllegalAccessException\n{\n   Class<?> cl =\
  \ obj.getClass();\n   Field field = cl.getDeclaredField(fieldName);\n   VarHandle\
  \ handle = MethodHandles.privateLookupIn​(cl, lookup)\n      .unreflectVarHandle(field);\n\
  \   return handle.get(obj);\n}\n```\n\n只要 `Lookup` 对象是在具有访问该字段权限的模块中生成的，这种方法就有效。模块中的某些方法只需调用\
  \ `MethodHandles.lookup()`，它就会产生一个封装了调用者访问权限的对象。通过这样，一个模块可以赋予另一个模块访问私有成员的权限。实际的问题在于如何以最少的麻烦赋予这些权限。\n\
  \n## 自动模块\n\n你现在已经知道如何使用 Java 平台模块系统。如果你从一个全新的项目开始，所有代码都由自己编写，你可以设计模块、声明模块依赖，并将你的应用程序打包成模块化的\
  \ JAR 文件。\n\n然而，这是一种极罕见的情况。几乎所有项目都依赖于第三方库。当然，你可以等到所有库的提供者将它们转换为模块，然后再将自己的代码模块化。\n\
  \n但如果你不想等待呢？Java 平台模块系统提供了两种机制来跨越当今非模块化世界与完全模块化应用之间的鸿沟：自动模块和未命名模块。\n\n出于迁移目的，你只需将任何\
  \ JAR 文件放置在模块路径（module path）而不是类路径（class path）上的目录下即可将其转换为模块。模块路径上没有 `module-info.class`\
  \ 的 JAR 文件被称为 `automatic module`。自动模块具有以下属性：\n\n1. 该模块隐式地对所有其他模块拥有一个 `requires`\
  \ 子句。\n2. 它所有的包都已导出（exported）并打开（opened）。\n3. 如果 JAR 文件清单 `META-INF/MANIFEST.MF`\
  \ 中存在键为 `Automatic-Module-Name` 的条目，则其值将成为模块名称。\n4. 否则，模块名称将从 JAR 文件名中获取，去掉任何末尾的版本号，并将任何非字母数字字符序列替换为点。\n\
  \n前两条规则意味着自动模块中的包的行为就像它们在类路径上一样。使用模块路径的原因是为了其他模块的利益，允许它们表达对该模块的依赖。\n\n假设例如，你正在实现一个处理\
  \ CSV 文件并使用 Apache Commons CSV 库的模块。你希望在你的 `module-info.java` 文件中表达模块依赖于 Apache\
  \ Commons CSV。\n\n如果你将 `commons-csv-1.9.0.jar` 添加到模块路径上，那么你的模块就可以引用该模块。它的名称是 `commons.csv`，因为末尾的版本号\
  \ `-1.9.0` 被删除了，非字母数字字符 `-` 被替换成了点。\n\n这个名称可能是可以接受的模块名称，因为 Commons CSV 是广为人知的，不太可能有其他人尝试为不同的模块使用相同的名称。但如果由于该\
  \ JAR 文件的维护者可以使用由他们控制的名称作为模块名称（最好是顶层包名 `org.apache.commons.csv`），将会更好。他们只需要在 JAR\
  \ 内部的 `META-INF/MANIFEST.MF` 文件中添加一行\n\n```\nAutomatic-Module-Name: org.apache.commons.csv\n\
  ```\n\n事实上，他们在 `commons-csv-1.10.0.jar` 中正是这么做的。\n\n最终，希望他们会通过带有该模块名称的 `module-info.java`\
  \ 将 JAR 文件转换为真正的模块。其他使用该名称引用 CSV 模块的模块将继续继续工作。\n\n向模块迁移的计划是一个伟大的社会实验，没有人知道它是否会有良好的结果。在你将第三方\
  \ JAR 放置到模块路径之前，请检查它们是否是模块化的，如果不是，检查它们的清单是否有一个模块名称。如果没有，你仍然可以将 JAR 转换为自动模块，但要准备好以后更新模块名称。\n\
  \n为了实验自动 JAR，请从 `https://commons.apache.org/proper/commons-csv` 下载 Commons CSV 库的\
  \ 1.9.0 和 1.10.0 版本。配套代码中的 `v2ch9.automod` 模块包含一个读取国家数据 CSV 文件的简单程序：\n\n```\npackage\
  \ com.horstmann.places;\n\nimport java.io.*;\nimport org.apache.commons.csv.*;\n\
  \npublic class CSVDemo\n{\n   public static void main(String[] args) throws IOException\n\
  \   {\n      var in = new FileReader(\"countries.csv\");\n      Iterable<CSVRecord>\
  \ records = CSVFormat.EXCEL.withDelimiter(';')\n            .withHeader().parse(in);\n\
  \      for (CSVRecord record : records)\n      {\n         String name = record.get(\"\
  Name\");\n         double area = Double.parseDouble(record.get(\"Area\"));\n   \
  \      System.out.println(name + \" has area \" + area);\n      }\n   }\n}\n```\n\
  \n要将 `commons-csv-1.9.0.jar` 作为自动模块，我们需要使用它的文件名来要求它：\n\n```\n@SuppressWarnings(\"\
  module\")\nmodule v1ch12.automod \n{\n   requires commons.csv;\n}\n```\n\n对于 `commons-csv-1.10.0.jar`，使用清单中的\
  \ `Automatic-Module-Name`：\n\n```\nrequires org.apache.commons.csv\n```\n\n以下是编译和运行程序的命令：\n\
  \n```\njavac -p v1ch12.automod:commons-csv-1.10.0.jar \\\n   v1ch12.automod/module-info.java\
  \ \\\n   v1ch12.automod/com/horstmann/places/CSVDemo.java\njava -p v1ch12.automod:commons-csv-1.10.0.jar\
  \ \\\n   -m v1ch12.automod/com.horstmann.places.CSVDemo\n```\n\n## 未命名模块\n\n不在模块路径上的类都是\
  \ `unnamed module`（未命名模块）的一部分。从技术上讲，可能有多个未命名模块，但它们共同的行为就像一个单一模块，被称为 `the` 未命名模块。与自动模块一样，未命名模块可以访问所有其他模块，它的所有的包都已导出并打开。\n\
  \n然而，`explicit module`（显式模块）可以访问未命名模块。（显式模块既不是自动模块也不是未命名模块——即模块路径上带有 `module-info.class`\
  \ 的模块。）换句话说，显式模块总是免于“类路径地狱”。\n\n考虑一下上一节的程序。假设你将 `commons-csv-1.9.0.jar` 放在类路径而不是模块路径上：\n\
  \n```\njava --module-path v1ch12.automod \\\n   --class-path commons-csv-1.10.0.jar\
  \ \\\n   -m v1ch12.automod/com.horstmann.places.CSVDemo\n```\n\n现在程序无法启动了：\n\n```\n\
  Error occurred during initialization of boot layer\njava.lang.module.FindException:\
  \ Module commons.csv not found, required by v1ch12.automod\n```\n\n因此，向 Java 模块系统的迁移必然是一个自底向过程：\n\
  \n1. Java 平台本身被模块化。\n2. 接下来，库被模块化，通过使用自动模块或将其转换为显式模块。\n3. 一旦应用程序使用的所有库都模块化，你就可以将应用程序代码转换为模块。\n\
  \n自动模块*可以*读取未命名模块，因此它们的依赖可以放在类路径上。\n\n## 的命令行标志\n\n即使你的程序没有使用模块，在使用 Java 9 及更高版本时，你也无法逃避模块化世界。你的应用程序代码可能位于类路径上的未命名模块中，这样所有的包都已导出并打开。尽管如此，代码仍然与模块化的\
  \ Java 平台交互。\n\n\n\n\n从 Java 11 开始，编译时封装被严格执行。然而，在 Java 16 之前，允许运行时访问。默认行为是在每个违规行为首次运行时在控制台上显示警告。从\
  \ Java 16 开始，运行时反射访问也被强制执行。为了让你有时间准备这一变化，Java 9 到 16 中的 `java` 启动器有一个 `--illegal-access`\
  \ 标志，具有四种可能的设置：\n\n1. `--illegal-access=permit` 是 Java 9 的默认行为，在首次发生非法访问时打印消息。\n\
  2. `--illegal-access=warn` 为每次非法访问打印一条消息。\n3. `--illegal-access=debug` 为每次非法访问打印一条消息和堆栈跟踪轨迹。\n\
  4. `--illegal-access=deny` 是 Java 16 的默认行为，拒绝所有非法访问。\n\n从 Java 17 开始，`--illegal-access`\
  \ 标志不再可用。\n\n`--add-exports` 和 `--add-opens` 标志允许你调整遗留应用程序。考虑一个使用了不再可见的内部 API 的应用程序，例如\
  \ `com.sun.rowset.CachedRowSetImpl`。最好的补救方法是更改。（从 Java 7 开始，你可以从 `RowSetProvider`\
  \ 获取缓存的行集。）但假设你无法访问其源代码。\n\n在这种情况下，使用 `--add-exports` 标志启动应用程序。指定你想导出的模块和包，以及你想导出该包的模块（在我们的案例中，是未命名模块）。\n\
  \n```\njava --add-exports java.sql.rowset/com.sun.rowset=ALL_UNNAMED \\\n   -jar\
  \ MyApp.jar\n```\n\n现在，假设你的应用程序使用反射来访问私有字段或方法。在未命名模块内部进行反射是可以的，但不再能够通过反射访问 Java\
  \ 平台类的非公共成员。例如，某些动态生成 Java 类的库通过反射调用受保护的 `ClassLoader.defineClass` 方法。如果应用程序使用了此类库，请添加标志\n\
  \n```\n--add-opens java.base/java.lang=ALL-UNNAMED\n```\n\n当为了让遗留应用运行而添加所有这些命令行选项时，你可能会得到一个“地狱命令行”。为了更好地管理多个选项，你可以将它们放在用\
  \ `@` 前缀指定的一个或多个文件中。例如，\n\n```\njava @options1 @options2 -jar MyProg.java\n```\n\
  \n其中文件 `options1` 和 `options2` 包含 `java` 命令的选项。\n\n选项文件有几个语法规则：\n\n* 使用空格、制表符或换行符分隔选项。\n\
  * 对包含空格的参数使用双引号，例如 `\"Program Files\"`。\n* 以 `\\` 结尾的行将与下一行合并。\n* 反斜杠必须转义，例如 `C:\\\
  \\Users\\\\Fred`。\n* 注释行以 `#` 开头。\n\n## 传递和静态依赖\n\n在 [](#index.xhtml_requires) 中，你已经看到了\
  \ `requires` 语句的基本形式。在本节中，你将看到两种偶尔有用的变体。\n\n在某些情况下，给定模块的用户声明所有需要的模块可能是麻烦的。例如考虑 `java.desktop`\
  \ 模块。它需要三个模块：`java.prefs`、`java.datatransfer` 和 `java.xml`。`java.prefs` 模块仅在内部使用。然而，来自\
  \ `java.datatransfer` 和 `java.xml` 的类出现在公共 API 中，方法如下\n\n```\njava.awt.datatransfer.Clipboard\
  \ java.awt.Toolkit.getSystemClipboard()\njava.beans.XMLDecoder(org.xml.sax.InputSource\
  \ is)\n```\n\n这不是 `java.desktop` 模块的用户应该考虑的事情。出于这个原因，`java.desktop` 模块使用 `transitive`\
  \ 修饰符声明该依赖：\n\n```\nmodule java.desktop\n{\n   requires java.prefs;\n   requires\
  \ transitive java.datatransfer;\n   requires transitive java.xml;\n   . . .\n}\n\
  ```\n\n任何声明依赖 `java.desktop` 的模块现在都会自动需要这两个模块。\n\n一些程序员建议，当公共 API 中使用了另一个模块的包时，应该始终使用\
  \ `requires transitive`。但这并不是 Java 语言的要求。例如考虑 `java.sql` 模块：\n\n```\nmodule java.sql\n\
  {\n   requires transitive java.logging;\n   . . .\n}\n```\n\n在整个 `java.sql` API\
  \ 中，只有一次使用了来自 `java.logging` 模块的包，即 `java.sql.Driver.parentLogger` 方法，它返回一个 `java.util.logging.Logger`。不将此模块依赖声明为传递性的也是完全可以的。那么，只有那些实际使用该方法的模块才需要声明它们需要\
  \ `java.logging`。\n\n`requires transitive` 语句的一个引人注目的用途聚合模块——一个没有包且只有传递依赖的模块。其中这样一个模块是\
  \ `java.se` 模块，声明如下：\n\n```\nmodule java.se\n{\n   requires transitive java.compiler;\n\
  \   requires transitive java.datatransfer;\n   requires transitive java.desktop;\n\
  \   . . .\n   requires transitive java.sql;\n   requires transitive java.sql.rowset;\n\
  \   requires transitive java.xml;\n   requires transitive java.crypto;\n}\n```\n\
  \n对细粒度控制感兴趣的程序员只需要求 `java.se` 即可获得所有模块。\n\n最后，还有一种常见的 `requires static` 变体，它在编译时存在但在运行时是可选的。有两种用例：\n\
  \n1. 在编译时访问不同模块的注解。\n2. 如果可用，则在运行时使用该类，例如\n\n```\ntry {\n   new OracleDriver();\n\
  } catch (ClassFoundError er) {\n   执行其他操作\n}\n```\n\n## 限定导出与开放\n\n在本节中，你将看到 `exports`\
  \ 和 `opens` 语句的变体，将其范围缩小到特定的模块集合。例如，`java.base` 模块包含\n\n```\nexports sun.net to\n\
  \  java.net.http,\n  jdk.naming.dns;\n```\n\n这种语句被称为限定导出。列出的模块可以访问该包，但其他模块不能。\n\n\
  过度使用限定导出可能意味着模块结构不良。尽管如此，它们可以在模块现有代码库时出现。在这里，`sun.net` 包被放在 `java.base` 模块中，因为那里最需要它。其他模块也使用该包。Java\
  \ 平台设计者不想让 `java.base` 变得更大，也不想让 `sun.net` 包全局开放。在绿色项目中，可以设计一个更模块化的 API。\n\n同样，你可以限制\
  \ `opens` 语句的范围。例如，在 [](#index.xhtml_opens)中我们可以使用限定的 `opens` 语句，如下\n\n```\nmodule\
  \ v1ch12.openpkg\n{\n   requires com.horstmann.util;\n   opens com.horstmann.places\
  \ to com.horstmann.util;\n}\n```\n\n现在 `com.horstmann.places` 包仅对 `com.horstmann.util`\
  \ 开放。\n\n## 服务加载\n\n`ServiceLoader` 类（参见 第 6 章）提供了匹配服务接口与实现的轻量级机制。Java 平台模块系统使得这种机制更加易用。\n\
  \n这里快速回顾服务加载。服务具有一个接口和多个可能的实现。这里有一个接口的简单示例：\n\n```\npublic interface GreeterService\n\
  {\n   String greet(String subject);\n   Locale getLocale();\n}\n```\n\n一个或多个模块提供实现，例如\n\
  \n```java\npublic class FrenchGreeter implements GreeterService\n{\n   public String\
  \ greet(String subject) { return \"Bonjour \" + subject; }\n   public Locale getLocale()\
  \ { return Locale.FRENCH; }\n}\n```\n\n\n\n服务消费者必须根据其认为合适的任何标准，从所有提供的实现中选择一个实现。\n\
  \n```\nServiceLoader<GreeterService> greeterLoader = ServiceLoader.load(GreeterService.class);\n\
  GreeterService chosenGreeter;\nfor (GreeterService greeter : greeterLoader)\n{\n\
  \   if (. . ...) \n   {\n      chosenGreeter = greeter;  \n   }\n}\n```\n\n在过去，实现类是通过在包含实现类的\
  \ JAR 文件的 `META-INF/services` 目录下放置文本文件来提供的。模块系统提供了一种更好的方法。你不再需要文本文件，而是向模块描述符（module\
  \ descriptors）中添加语句。\n\n提供服务实现的模块会添加 `provides` 语句，其中列出服务接口（可能定义在任何模块中）和实现类（必须是该模块的一部分）。以下是来自\
  \ `jdk.security.auth` 模块的示例：\n\n```\nmodule jdk.security.auth\n{\n   . . .\n   provides\
  \ javax.security.auth.spi.LoginModule with\n      com.sun.security.auth.module.Krb5LoginModule,\n\
  \      com.sun.security.auth.module.UnixLoginModule,\n      com.sun.security.auth.module.JndiLoginModule,\n\
  \      com.sun.security.auth.module.KeyStoreLoginModule,\n      com.sun.security.auth.module.LdapLoginModule,\n\
  \      com.sun.security.auth.module.NTLoginModule;\n}\n```\n\n消费模块包含一个 `uses` 语句。\n\
  \n```\nmodule java.base\n{\n   . . .\n   uses javax.security.auth.spi.LoginModule;\n\
  }\n```\n\n当消费模块中的代码调用 `ServiceLoader.load(ServiceInterface.class)` 时，匹配的提供类将被加载，即使它们可能不在可访问的包中。\n\
  \n在我们的代码示例中，我们在 `com.horstmann.greetsvc.internal` 包中为德语和法语问候提供了实现。服务模块导出了 `com.horstmann.greetsvc`\
  \ 包，但没有导出包含实现类的包。`provides` 语句在未导出的包中声明了该服务及其实现类：\n\n```\nmodule com.horstmann.greetsvc\n\
  {\n   exports com.horstmann.greetsvc;\n\n   provides com.horstmann.greetsvc.GreeterService\
  \ with \n      com.horstmann.greetsvc.internal.FrenchGreeter,\n      com.horstmann.greetsvc.internal.GermanGreeterFactory;\n\
  }\n```\n\n`v1ch12.useservice` 模块消费该服务。使用 `ServiceLoader` 功能，我们遍历提供的服务，并选择符合所需语言的一个：\n\
  \n```\npackage com.horstmann.hello;\n\nimport java.util.*;\nimport com.horstmann.greetsvc.*;\n\
  \npublic class HelloWorld\n{\n   public static void main(String[] args)\n   {\n\
  \      ServiceLoader<GreeterService> greeterLoader \n            = ServiceLoader.load(GreeterService.class);\n\
  \      String desiredLanguage = args.length > 0 ? args[0] : \"de\";\n      GreeterService\
  \ chosenGreeter = null;\n      for (GreeterService greeter : greeterLoader)\n  \
  \    {\n         if (greeter.getLocale().getLanguage().equals(desiredLanguage))\n\
  \            chosenGreeter = greeter;\n      }\n      if (chosenGreeter == null)\n\
  \         System.out.println(\"No suitable greeter.\");\n      else\n         System.out.println(chosenGreeter.greet(\"\
  Modular World\"));\n   }\n}\n```\n\n模块声明需要服务模块，并声明 `GreeterService` 正在被使用。\n\n```\n\
  module v1ch12.useservice \n{\n   requires com.horstmann.greetsvc;\n   uses com.horstmann.greetsvc.GreeterService;\n\
  }\n```\n\n由于 `provides` 和 `uses` 声明，消费服务的模块被允许访问模块私有的实现类。\n\n要编译并运行程序，首先编译服务：\n\n\
  ```\njavac com.horstmann.greetsvc/module-info.java \\\n   com.horstmann.greetsvc/com/horstmann/greetsvc/GreeterService.java\
  \ \\\n   com.horstmann.greetsvc/com/horstmann/greetsvc/internal/*.java\n```\n\n\
  然后编译并运行消费模块：\n\n```\njavac -p com.horstmann.greetsvc \\\n   v1ch12.useservice/com/horstmann/hello/HelloWorld.java\
  \ \\\n   v1ch12.useservice/module-info.java\njava -p com.horstmann.greetsvc:v1ch12.useservice\
  \ \\\n   -m v1ch12.useservice/com.horstmann.hello.HelloWorld\n```\n\n## 用于模块的工具\n\
  \n本节涵盖了 Java 开发工具包中的 `jdeps`、`jlink` 和 `jmod` 工具。\n\n`jdeps` 工具分析一组 JAR 文件的依赖关系。例如，你想将\
  \ JUnit 4 模块化。运行：\n\n```\njdeps -s junit-4.12.jar hamcrest-core-1.3.jar \n```\n\n\
  `-s` 标志生成摘要输出：\n\n```\nhamcrest-core-1.3.jar -> java.base\njunit-4.12.jar -> hamcrest-core-1.3.jar\n\
  ```\n\n\n\n\n本附录列出了 Java 语言所有的关键字和类关键字的词。“受限关键字”仅在模块声明中为关键字，在其他情况下是标识符。“受限标识符”除非在特定位置使用，否则标识符。例如，`var`\
  \ 始终是一个标识符，除非用于需要类型的地方。`null`、`false` 和 `true` 符号不是关键字，而是字面量。\n\n## Java 关键字\n\n\
