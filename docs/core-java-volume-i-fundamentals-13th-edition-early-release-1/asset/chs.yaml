  []\");\n```\n\n```\n }\n```\n\n```\n }\n```\n\n```\n}\n```\n\n### 类型字面量\n\n有时，你想根据值的类型驱动程序的行为。例如，在持久化机制中，你可能希望用户指定一种保存特定类对象的方法。这通常通过将\
  \ `Class` 对象与操作关联来实现。\n\n然而，对于泛型类，类型擦除（erasure）带来了一个问题。例如，当 `ArrayList<Integer>`\
  \ 和 `ArrayList<String>` 都被擦除为相同的原始 `ArrayList` 类型时，你如何为它们提供不同的操作呢？\n\n有一种技巧可以在某些情况下提供缓解。你可以捕获在前一节中遇到的\
  \ `Type` 接口的实例。构造如下这样一个匿名子类：\n\n```\n var type = new TypeLiteral<ArrayList<Integer>>(){}\
  \ // 注意 {}\n```\n\n`TypeLiteral` 构造函数捕获了泛型超类：\n\n```\nclass TypeLiteral<T>\n{\n\
  \   public TypeLiteral()\n   {\n      Type parentType = getClass().getGenericSuperclass();\n\
  \      if (parentType instanceof ParameterizedType paramType)\n         type = paramType.getActualTypeArguments()[0];\n\
  \      else\n         throw new UnsupportedOperationException(\n            \"Construct\
  \ as new TypeLiteral<. . .>(){}\");\n   }\n   . . .\n}\n```\n\n如果我们在运行时有一个泛型类型可用，可以将其与\
  \ `TypeLiteral` 进行匹配。我们无法从对象中获取泛型类型——因为它被擦除了。但正如你在前一节中看到的，字段和方法参数的泛型类型在虚拟机中仍然存在。\n\
  \n像 CDI 和 Guice 等注入框架使用类型字面量来控制泛型类型的注入。书中配套代码中的示例展示了一个更简单的例子。给定一个对象，我们列出其泛型类型（这些类型是可用的），并查找相关的格式化操作。\n\
  \n我们通过用空格分隔值来格式化 `ArrayList<Integer>`，通过将字符连接到字符串来格式化 `ArrayList<Character>`。其他任何列表通过\
  \ `ArrayList.toString` 格式化。\n\n`genericReflection/TypeLiterals.java`\n\n```\npackage\
  \ genericReflection;\n```\n\n```\n/**\n```\n\n```\n @version 1.03 2023-12-20\n```\n\
  \n```\n @author Cay Horstmann\n```\n\n```\n*/\n```\n\n```\nimport java.lang.reflect.*;\n\
  ```\n\n```\nimport java.util.*;\n```\n\n```\nimport java.util.function.*;\n```\n\
  \n```\n/**\n```\n\n```\n * 类型字面量描述一个可以是泛型的类型，例如 \n```\n\n```\n * ArrayList<String>.\
  \ \n```\n\n```\n */\n```\n\n```\nclass TypeLiteral<T>\n```\n\n```\n{\n```\n\n```\n\
  \ private Type type;\n```\n\n```\n /**\n```\n\n```\n * 此构造函数必须从匿名子类中调用\n```\n\n\
  ```\n * 如 new TypeLiteral<. . .>(){}.\n```\n\n```\n */\n```\n\n```\n public TypeLiteral()\n\
  ```\n\n```\n {\n```\n\n```\n Type parentType = getClass().getGenericSuperclass();\n\
  ```\n\n```\n if (parentType instanceof ParameterizedType paramType) \n```\n\n```\n\
  \ type = paramType.getActualTypeArguments()[0];\n```\n\n```\n else\n```\n\n```\n\
  \ throw new UnsupportedOperationException(\n```\n\n```\n \"Construct as new TypeLiteral<.\
  \ . .>(){}\"); \n```\n\n```\n }\n```\n\n```\n private TypeLiteral(Type type)\n```\n\
  \n```\n {\n```\n\n```\n this.type = type;\n```\n\n```\n }\n```\n\n```\n /**\n```\n\
  \n```\n * 返回一个描述给定类型的类型字面量。 \n```\n\n```\n */\n```\n\n```\n public static TypeLiteral<?>\
  \ of(Type type)\n```\n\n```\n {\n```\n\n```\n return new TypeLiteral<>(type);\n\
  ```\n\n``` }\n```\n\n```\n public String toString()\n```\n\n```\n {\n```\n\n```\n\
  \ if (type instanceof Class<?> cl) return cl.getName();\n```\n\n``` else return\
  \ type.toString();\n```\n\n``` }\n```\n\n```\n public boolean equals(Object otherObject)\
  \ \n```\n\n```\n {\n```\n\n```\n return otherObject instanceof TypeLiteral<?> otherLiteral\n\
  ```\n\n```\n && type.equals(otherLiteral.type); \n```\n\n``` }\n```\n\n```\n public\
  \ int hashCode()\n```\n\n```\n {\n```\n\n```\n return type.hashCode();\n```\n\n\
  ``` }\n```\n\n```\n}\n```\n\n```\n/**\n```\n\n```\n * 使用将类型与格式化函数关联的规则来格式化对象。\n\
  ```\n\n```\n */\n```\n\n```\nclass Formatter\n```\n\n```\n{ \n```\n\n```\n private\
  \ Map<TypeLiteral<?>, Function<?, String>> rules = new HashMap<>();\n```\n\n```\n\
  \ /**\n```\n\n```\n * 向此格式化器添加格式化规则。\n```\n\n```\n * @param type 规则应用的类型\n```\n\n\
  ```\n * @param formatterForType 格式化该类型对象的函数\n```\n\n```\n type\n```\n\n```\n */\n\
  ```\n\n```\n <T> void forType(Type type, Function<T, String> formatterType)\n```\n\
  \n```\n {\n```\n\n```\n rules.put(type, formatterType);\n```\n\n``` }\n```\n\n```\n\
  \ /**\n```\n\n```\n * 使用将类型与格式化函数关联的规则来格式化对象。\n```\n\n```\n */\n```\n\n```\n public\
  \ String formatFields(Object obj)\n```\n\n```\n throws IllegalArgumentException,\
  \ IllegalAccessException\n```\n\n```\n {\n```\n\n```\n var result = new StringBuilder();\n\
  ```\n\n```\n for (Field f : obj.getClass().getDeclaredFields())\n```\n\n```\n {\n\
  ```\n\n```\n result.append(f.getName());\n```\n\n```\n result.append(\"=\");\n```\n\
  \n```\n f.setAccessible(true);\n```\n\n```\n Function<Object, String> formatterType\
  \ = rules.get(f.getGenericType());\n```\n\n```\n if (formatterType != null)\n```\n\
  \n``` {\n```\n\n```\n @SuppressWarnings(\"unchecked\")\n```\n\n```\n Function<Object,\
  \ String> objectFormatter = (Function<Object, String>) formatterType;\n```\n\n```\n\
  \ result.append(objectFormatter.apply(obj));\n```\n\n``` }\n```\n\n```\n else\n\
  ```\n\n```\n result.append(f.getGenericType().toString());\n```\n\n``` }\n```\n\n\
  ```\n result.append(\"\\n\");\n```\n\n``` }\n```\n\n```\n return result.toString();\n\
  ```\n\n``` }\n```\n\n```\n}\n```\n\n```\npublic class TypeLiterals\n```\n\n```\n\
  {\n```\n\n```\n static class Sample\n```\n\n```\n {\n```\n\n```\n ArrayList<Integer>\
  \ nums;\n```\n\n```\n ArrayList<Character> chars;\n```\n\n```\n ArrayList<String>\
  \ strings;\n```\n\n```\n public Sample() \n```\n\n```\n { \n```\n\n```\n nums =\
  \ new ArrayList<>();\n```\n\n```\n nums.add(42); nums.add(1729);\n```\n\n```\n chars\
  \ = new ArrayList<>();\n```\n\n```\n chars.add('H'); chars.add('i');\n```\n\n```\n\
  \ strings = new ArrayList<>();\n```\n\n```\n strings.add(\"Hello\"); strings.add(\"\
  World\");\n```\n\n``` }\n```\n\n``` }\n```\n\n```\n private static <T> String join(String\
  \ separator, ArrayList<T> elements)\n```\n\n```\n {\n```\n\n```\n var result = new\
  \ StringBuilder();\n```\n\n```\n for (T e : elements)\n```\n\n``` {\n```\n\n```\n\
  \ if (result.length() > 0) result.append(separator);\n```\n\n```\n result.append(e.toString());\n\
  ```\n\n``` }\n```\n\n```\n return result.toString();\n```\n\n``` }\n```\n\n``` }\n\
  ```\n\n```\n public static void main(String[] args) throws Exception\n```\n\n```\n\
  \ {\n```\n\n```\n var formatter = new Formatter();\n```\n\n```\n formatter.forType(new\
  \ TypeLiteral<ArrayList<Integer>>(){}, \n```\n\n```\n lst -> join(\" \", lst));\n\
  ```\n\n```\n formatter.forType(new TypeLiteral<ArrayList<Character>>(){}, \n```\n\
  \n```\n lst -> \"\\\"\" + join(\"\", lst) + \"\\\"\");\n```\n\n```\n System.out.println(formatter.formatFields(new\
  \ Sample()));\n```\n\n``` }\n```\n\n```}\n```\n\n\n\n\n如果该方法被声明为泛型方法，则获取泛型变量，否则返回长度为\
  \ 0 的数组。\n\n* `Type getGenericReturnType()` 5.0\n  获取声明该方法时的泛型返回类型。\n\n* `Type[]\
  \ getGenericParameterTypes()` 5.0\n  获取声明该方法时的泛型参数类型。如果方法没有参数，则返回一个长度为 0 的数组。\n\n\
  `java.lang.reflect.TypeVariable` 5.0\n\n* `String getName()`\n  获取此类型变量的名字。\n\n\
  * `Type[] getBounds()`\n  获取此类型变量的子类边界，如果变量无边界，则返回一个长度为 0 的数组。\n\n`java.lang.reflect.WildcardType`\
  \ 5.0\n\n* `Type[] getUpperBounds()`\n  获取此类型变量的子类（`extends`）边界，如果变量没有子类边界，则返回一个长度为\
  \ 0 的数组。\n\n* `Type[] getLowerBounds()`\n  获取此类型变量的父类（`super`）边界，如果变量没有父类边界，则返回一个长度为\
  \ 0 的数组。\n\n`java.lang.reflect.ParameterizedType` 5.0\n\n* `Type getRawType()`\n\
  \  获取该参数化类型的原始类型。\n\n* `Type[] getActualTypeArguments()`\n  获取声明该参数化类型时的类型参数。\n\n\
  * `Type getOwnerType()`\n  如果这是一个内部类型，则获取外部类类型；如果是顶层类型，则返回 `null`。\n\n`java.lang.reflect.GenericArrayType`\
  \ 5.0\n\n* `Type getGenericComponentType()`\n  获取声明该数组类型时的泛型组件类型。\n\n现在你已经知道如何使用泛型类，以及在需要时如何编写你自己的泛型类和方法。同样重要的是，你还学会了如何解读在\
  \ API 文档和错误信息中可能遇到的泛型类型声明。关于 Java 泛型的所有详尽讨论，请参阅 Angelika Langer 编写的优秀常见（以及不那么常见）问题列表：`https://angelikalanger.com/GenericsFAQ/JavaGenericsFAQ.html`。\n\
  \n在下一章，你将看到 Java 集合框架是如何发挥泛型作用的。\n\n# 集合 (Collections)\n\n当你尝试以自然的方式实现方法或关注性能时，你选择的数据结构会产生巨大影响。你需要快速对成千上万（甚至百万）个排序后的项进行搜索吗？你需要在有序序列的中间快速插入和删除元素吗？你需要在键和值之间建立关联吗？\n\
  \n本章将展示 Java 集合框架如何帮助你完成专业编程所需的传统数据结构。在大学计算机科学课程中，一门名为 `Data Structures` 的课程通常需要一个学期才能完成，而且有很多书籍致力于这个重要主题。我们的涵盖范围与大学课程不同；我们将跳过理论，直接查看如何使用\
  \ Java API 中的集合类。\n\n## Java 集合框架\n\nJava 的最初版本只提供了一小部分用于最常用数据结构的类：`Vector`、`Stack`、`Hashtable`、`BitSet`\
  \ 以及 `Enumeration` 接口（后者提供了一种访问任意容器中元素的抽象机制）。这无疑是一个明智的选择——创建一个全面的集合类库需要时间和精。。\n\n\
  随着 Java 1.2 的出现，设计者们认为是时候推出一个完全的数据结构框架了。他们面临着许多相互冲突的设计挑战。他们希望库既小又易于学习。他们不想要 C++\
  \ 标准模板库（或 `STL`）的复杂性，但他们想要 STL 开创的“泛型算法”的益处。他们希望旧的类能够适应新框架。正如所有集合库的设计者所做，他们必须做出一些艰难的抉，并在过程中产生了许多独特的设计决策。在本节中，我们将探索\
  \ Java 集合框架的基本设计，演示如何使用它，并解释一些更具争议的功能背后的原理。\n\n### 分离集合接口与实现\n\n与现代数据结构库一样，Java\
  \ 集合框架将 `interfaces`（接口）与 `implementations`（实现）分离。让我们通过一个熟悉的数据结构——队列（`queue`）来看这种分离。\n\
  \n`queue interface` 指定了你可以在队列的尾部添加元素，从头部移除元素，并查找队列中有多少元素。当你需要收集对象并按“先进先出”的方式检索它们时，就会使用队列。\n\
  \n![Figure](img/13_01.jpg)队列 (A queue)\n\n队列接口的最小形式可能如下：\n\n```\npublic interface\
  \ Queue<E> // Java API 中接口的简化形式\n{\n   void add(E e);\n   E remove();\n   int size();\n\
  }\n```\n\n接口没有告诉你任何关于队列是如何实现的信息。在队列的两种常见实现中，一种使用“循环数组”，另一种使用链表。\n\n![Figure](img/13_02.jpg)队列的实现\
  \ (Queue implementations)\n\n每个实现都可以由实现 `Queue` 接口的类来表示。在 Java API 中，这些类被称为 `ArrayDeque`\
  \ 和 `LinkedList`。\n\n```java\npublic class ArrayDeque<E> implements Queue<E> //\
  \ 源自 Java API 的简化\n{\n   private int first;\n   private int last;\n   private E[]\
  \ elements;\n\n   public ArrayDeque(int numElements) { . . . }\n   public void add(E\
  \ e) { . . . }\n   public E remove() { . . . }\n   public int size() { . . . }\n\
  \   . . .\n}\n\npublic class LinkedList<E> implements Queue<E> // 源自 Java API 的简化\n\
  {\n   private Node<E> first;\n   private Node<E> last;\n\n   public LinkedList()\
  \ { . . . }\n   public void add(E e) { . . . }\n   public E remove() { . . . }\n\
  \   public int size() { . . . }\n   . . .\n}\n```\n\n\n\n除了这两种方法外，还有几种方法；我们稍后会讨论。\n\
  \n`add` 方法向集合中添加一个元素。如果添加元素确实更改了集合，`add` 方法返回 `true`；如果集合没有变化，则返回 `false`。例如，如果你尝试向一个集合中添加一个对象，而该对象已经存在，则\
  \ `add` 请求将不起作用，因为集合拒绝重复项。\n\n`iterator` 方法返回一个实现了 `Iterator` 接口的对象。通过该对象，你可以逐个访问集合中的元素。我们将在下一节中讨论迭代器。\n\
  \n### 迭代器\n\n`Iterator` 接口有四个方法：\n\n```\npublic interface Iterator<E>\n{\n   boolean\
  \ hasNext();\n   E next();\n   default void remove();\n   default void forEachRemaining(Consumer<?\
  \ super E> action);\n}\n```\n\n通过反复调用 `next` 方法，你可以逐个访问集合中的元素。然而，如果你到达集合的末尾，`next`\
  \ 方法将抛出 `NoSuchElementException`。因此，在调用 `next` 之前需要调用 `hasNext` 方法。如果迭代器尚未到达末尾，且至少还有一个元素待访问，则该方法返回\
  \ `true`。如果你想检查集合中的所有元素，可以请求一个迭代器，并在 `hasNext` 返回 `true` 的期间持续调用 `next` 方法。例如：\n\
  \n```\nCollection<String> coll = . . .;\nIterator<String> iter = coll.iterator();\n\
  while (iter.hasNext())\n{\n   String element = iter.next();\n   do something with\
  \ element\n}\n```\n\n你可以用更简洁的“for each”循环来写这样一个这样的循环：\n\n```\nfor (String element\
  \ : coll)\n{\n   do something with element\n}\n```\n\n编译器会简单地将“for each”循环翻译为带有迭代器的循环。\n\
  \n“for each”循环适用于任何实现了 `Iterable` 接口的对象，该接口包含一个抽象方法：\n\n```\npublic interface Iterable<E>\n\
  {\n   Iterator<E> iterator();\n   . . .\n}\n```\n\n`Collection` 接口继承了 `Iterable`\
  \ 接口。因此，你可以对 Java 集合框架中的任何集合使用“for each”循环。\n\n与其编写循环，不如带有消耗元素的 Lambda 表达式调用 `Collection.forEach`\
  \ 或 `Iterator.forEachRemaining` 方法。Lambda 表达式将应用于集合中的所有元素，或者迭代器可以访问的剩余元素。\n\n```\n\
  coll.forEach(element -> do something with element);\niter.forEachRemaining(element\
  \ -> do something with element);\n```\n\n访问元素的顺序取决于集合的类型。如果你遍历一个 `ArrayList`，迭代器从索引\
  \ `0` 开始，并在每一步中增加索引。然而，如果你访问 `HashSet` 中的元素，你将以基本上随机的顺序获取它们。你可以确保在迭代过程中会遇到集合的所有元素，但无法对它们的顺序做任何假设。这通常不是问题，因为对于计算总和或计数匹配等计算，顺序并不重要。\n\
  \n老手会注意到，`Iterator` 接口的 `next` 和 `hasNext` 方法与 `Enumeration` 接口的 `nextElement` 和\
  \ `hasMoreElements` 方法的作用相同。Java 集合框架的设计者可以选择利用 `Enumeration` 接口。但他们不喜欢冗长的方法名，而是引入了一个具有更短方法名的新接口。\n\
  \nJava 集合库中的迭代器与其他库中的迭代器之间存在着重要的概念上的区别。在传统的集合库（如 C++ 的标准模板库 STL）中，迭代器是模仿数组索引建模的。给定这样一个迭代器，你可以查找存储在该位置的元素，就像如果你有数组索引\
  \ `i`，可以查找数组元素 `a[i]` 一样。独立于查找之外，你可以将迭代器移动到下一个位置。这与通过 `i++` 移动数组索引是相同的操作，而无需执行查找。然而，Java\
  \ 迭代器并不是这样运行的。查找和位置变化是紧密耦合的。查找元素的唯一方法是调用 `next`，而该查找会移动位置。\n\n相反，将 Java 迭代器设为位于*元素之间*的。当你调用\
  \ `next` 时，迭代器会*跳过*下一个元素，并返回它刚刚通过的元素的引用（参见 [ ]](#index.xhtml_ch13fig03)）。\n\n![Figure](img/13_03.jpg)移动迭代器\n\
  \n这是另一个有用的类比。你可以将 `Iterator.next` 等同于 `InputStream.read`。从流中读取一个字节会自动“消耗”该字节。下一次调用\
  \ `read` 将消耗并返回输入中的下一个字节。同样，反复调用 `next` 允许你读取集合中的所有元素。\n\n`Iterator` 接口的 `remove`\
  \ 方法移除由上一次调用 `next` 返回的元素。在很多情况下，这是有意义的——你需要看到元素，才能决定它是否应该是被删除的那个。但如果你想删除特定位置的元素，你仍然需要跳过该元素。例如，这里是移除字符串集合中第一个元素的方法：\n\
  \n```\nIterator<String> iter = coll.iterator();\niter.next(); // 跳过第一个元素\niter.remove();\
  \ // 现在删除它\n```\n\n更重要的是，`next` 方法和 `remove` 方法调用之间存在依赖关系。在没有先调用 `next` 的情况下调用 `remove`\
  \ 是非法的。如果尝试，将抛出 `IllegalStateException`。如果你想删除两个相邻的元素，你不能简单地调用\n\n```\niter.remove();\n\
  iter.remove(); // 错误\n```\n\n相反，你必须先调用 `next` 跳过要删除的元素。\n\n```\niter.next();\niter.remove();\
  \ // 正确\n```\n\n### 泛型实用方法\n\n`Collection` 和 `Iterator` 接口是泛型的，这意味着你可以编写操作任何类型集合的实用方法。例如，这里有一个泛型方法测试任意集合是否包含给定元素：\n\
  \n```java\npublic static <E> contains(Collection<E> c, Object obj)\n{\n   for (E\
  \ element : c)\n      if (element.equals(obj))\n         return true;\n   return\
  \ false;\n}\n```\n\nJava 集合框架的设计者认为，某些实用方法非常有用，以框架应该提供它们。这样，API 用户就不需要重复轮子。`contains`\
  \ 方法就是其中一种方法。\n\n事实上，`Collection<E>` 接口声明了相当实用的方法，所有实现类必须提供：\n\n```\nint size()\n\
  boolean isEmpty()\nboolean contains(Object obj)\nboolean containsAll(Collection<?>\
  \ c)\nboolean add(E obj)\nboolean addAll(Collection<? extends E> from)\nboolean\
  \ remove(Object obj)\nboolean removeAll(Collection<?> c)\nboolean retainAll(Collection<?>\
  \ c)\nvoid clear()\nObject[] toArray()\nT[] toArray(T[] a)\n```\n\n`Collection`\
  \ 接口声明了继承自 `Object` 的 `equals` 和 `hashCode` 方法。技术上没有包含这些声明。它仅仅为添加集合特定的 API 文档提供了一个良好的位置。`Set`\
  \ 和 `List` 子接口规定了 `equals` 的特定行为。其他集合可以继承 `Object.equals`，或者重写它并某种方式比较元素。在后一种情况下也需要重写\
  \ `hashCode` 方法。\n\n许多方法显而易见；你将在本节末的 API 注释中找到完整的文档。\n\nJava 集合框架是在泛型类型添加到 Java\
  \ 之前设计的。为了向后兼容，`contains` 和 remove\n\n\n\n\n某些方法的参数类型为 `Object` 而不是 `E`。`containsAll`、`removeAll`\
  \ 和 `retainAll` 方法的参数类型为 `Collection<?>` 而不是 `Collection<? extends E>`。\n\n这意味着类型错误可能在编译时无法被检测。例如，考虑这段代码片段，它无意中从\
  \ `Path` 对象的集合中删除了一个 `String`：\n\n```\nCollection<Path> paths = . . .;\npaths.remove(\"\
  /tmp\"); // 编译通过，但可能没有任何效果\n```\n\n当然，如果每个实现 `Collection` 接口的类都必须提供许多常规方法，那将非常麻烦。为了方便实现者的工作，框架提供了一个\
  \ `AbstractCollection` 类，它将基础方法 `size` 和 `iterator` 留为抽象方法，但根据这两个方法实现了其他常规方法。例如：\n\
  \n```\npublic abstract class AbstractCollection<E>\n      implements Collection<E>\n\
  {\n   . . .\n   public abstract Iterator<E> iterator();\n   public abstract int\
  \ size();\n\n   public boolean isEmpty()\n   {\n      return size() == 0;\n  }\n\
  \n   public boolean contains(Object obj)\n   {\n      Iterator<E> it = iterator();\n\
  \      if (o == null)\n      {\n         while (it.hasNext()) if (it.next() == null)\
  \ return true;\n      }\n      else\n      {\n         while (it.hasNext()) if (o.equals(it.next()))\
  \ return true;\n      }\n      return false;\n   }\n   . . .\n}\n```\n\n具体的集合类现在可以继承\
  \ `AbstractCollection` 类。具体的集合类提供 `iterator` 和 `size` 方法取决于该类本身。可变集合还需要一个 `add`\
  \ 方法。其他方法已经由 `AbstractCollection` 父类处理好了。然而，如果子类有更高效的 `contains` 实现方式，也可以自由这样做。\n\
  \n这种方法有点过时了。如果这些方法能成为 `Collection` 接口的默认方法（default methods）将会更好，但在设计 Java 集合框架时，默认方法并不存在。不过，现在已经添加了几个默认方法。其中三个处理流（已在第二卷中讨论）。请查看\
  \ [](#index.xhtml_ch13lev2sec14) 中的 `toArray` 方法。此外，还有一个非常有用的方法\n\n```\ndefault\
  \ boolean removeIf(Predicate<? super E> filter)\n```\n\n用于移除满足条件的元素。\n\n### `java.util.Collection<E>`\
  \ 1.2\n\n* `Iterator<E> iterator()`\n  返回一个可以用于访问集合中元素的迭代器。\n* `int size()`\n  返回集合中当前存储的元素数量。\n\
  * `boolean isEmpty()`\n  如果此集合不包含任何元素，则返回 `true`。\n* `boolean contains(Object obj)`\n\
  \  如果此集合包含与 `obj` 相等的，则返回 `true`。\n* `boolean containsAll(Collection<?> other)`\n\
  \  如果此集合包含另一个集合中的所有元素，则返回 `true`。\n* `boolean add(E element)`\n  尝试向集合添加一个元素。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `boolean addAll(Collection<? extends E> other)`\n  将另一个集合的所有元素添加到此集合中。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `boolean remove(Object obj)`\n  尝试从此集合中移除与 `obj` 相等的对象。如果移除了匹配的对象，则返回\
  \ `true`。\n* `boolean removeAll(Collection<?> other)`\n  从此集合中移除另一个集合的所有元素。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `default boolean removeIf(Predicate<? super E> filter)` 8\n  移除所有 `filter`\
  \ 返回 `true` 的元素。如果集合因为此调用而发生变化，则返回 `true`。\n* `void clear()`\n  移除此集合中的所有元素。\n*\
  \ `boolean retainAll(Collection<?> other)`\n  移除此集合中不等于另一个集合中任一元素的元素。如果集合因为此调用而发生变化，则返回\
  \ `true`。\n* `Object[] toArray()`\n  返回集合中对象的数组。\n* `<T> T[] toArray(IntFunction<T[]>\
  \ generator)` 11\n  返回集合中对象的数组。该数组通过 `generator` 构建，生成器通常是一个构造函数表达式 `T[]::new`。\n\
  \n### `java.util.Iterator<E>` 1.2\n\n* `boolean hasNext()`\n  如果还有另一个元素可以访问，则返回\
  \ `true`。\n* `E next()`\n  返回下一个要访问的对象。如果到达集合末尾，则抛出 `NoSuchElementException`。\n\
  * `void remove()`\n  移除上一次访问的对象。此方法必须紧跟在元素访问之后。如果自上次元素访问以来集合已被修改过，则此方法将抛出 `IllegalStateException`。迭代器不需要支持此操作。默认实现抛出\
  \ `UnsupportedOperationException`。\n* `default void forEachRemaining(Consumer<?\
  \ super E> action)` 8\n  访问元素并将它们传递给给定的 action，直到没有剩余元素或 action 抛出异常。\n\n## 集合框架中的接口\n\
  \nJava 集合框架为不同类型的集合定义了许多接口。这些接口在 [](#index.xhtml_ch13fig10) 中显示，并发编程的接口除外，后者在 [10]\
  \ 中涵盖。\n\n![Figure](img/v13_10.jpg)集合的接口\n\n集合框架定义了两个基础接口：`Collection` 和 `Map`。正如你所看到的，使用方法向集合插入元素\n\
  \n```\nboolean add(E element)\n```\n\n然而，映射存储键值对，并使用 `put` 方法插入它们\n\n```\nV put(K\
  \ key, V value)\n```\n\n要从集合中读取元素，可以使用迭代器访问。然而，可以通过 `get` 方法从映射读取值\n\n```\nV get(Object\
  \ key)\n```\n\n`List` 是一种*有序集合*。元素被添加到容器的特定位置。访问方式有两种：迭代器或整数索引。后者被称为*随机访问*，因为元素可以按任何顺序访问。相比之下，使用迭代器时必须顺序访问。\n\
  \n`List` 接口定义了几个随机访问的方法：\n\n```\nvoid add(int index, E element)\nE remove(int index)\n\
  E get(int index)\nE set(int index, E element)\n```\n\n对于 `List<Integer>`，有两个 `remove`\
  \ 方法：\n\n```\nboolean remove(int index) // 移除指定索引\nboolean remove(Integer o) //\
  \ 移除等于 o 的元素\n```\n\n当使用 `int` 调用 `remove` 时，会选择第一个方法。没有考虑装箱，也没有警告。这可能不是你想要的：\n\n\
  ```\nList<Integer> ids = . . .;\nint id = . . .;\nif (id == 0) ids.remove(id); //\
  \ 移除索引 0，而不是值为 0 的元素\n```\n\n`List` 接口的 API 文档定义了列表 `equals` 方法的行为。如果列表与另一个对象相等，该对象也必须是某种列表。两个列表的大小必须相同。遍历每个列表时，相应的元素必须相等。\n\
  \n坦率地说，集合框架中的 `List` 接口存在一个问题。存在两种有序集合，它们的性能权衡非常不同。由数组支持的有序集合具有快速的随机访问能力，使用整数索引的\
  \ `List` 方法是合理的。链表虽然有序的，但随机访问缓慢，最好通过迭代器进行顺序遍历。\n\n为了避免对链表执行随机访问操作，Java 1.4 引入了一个标记接口\
  \ `RandomAccess`。该接口没有方法，但你可以用它来测试特定集合是否支持高效的随机访问：\n\n\n\n\n\n```\nif (c instanceof\
  \ RandomAccess)\n{\n   random traversal\n}\nelse\n{\n   sequential traversal\n}\n\
  ```\n\n`Set` 接口与 `Collection` 接口拥有相同的实例方法，但这些方法的行为定义更为严密。`Set` 的 `add` 方法应该拒绝重复元素。`Set`\
  \ 的 `equals` 方法应该定义为：如果两个集合包含相同的元素，它们就是相等的，但顺序不一定相同。`hashCode` 方法的定义应该使得两个具有相同元素的集合产生相同的哈希码。\n\
  \n既然方法签名相同，为什么还要单独定义一个接口呢？从概念上讲，并不是所有的集合都是集合。创建 `Set` 接口允许程序员编写仅接受集合（Set 类型）的方法。\n\
  \n为了理解为什么这种区别很重要，请考虑等性测试。如果两个列表以相同的顺序具有相同的元素，它们就是相等的。如果两个集合以某种顺序具有相同的元素，它们就是相等的。实现\
  \ `Set` 接口的类的 `equals` 方法需要确保参数也是一个 `Set` 而不仅仅是任何 `Collection`。\n\n`SortedSet` 和\
  \ `SortedMap` 接口暴露了用于排序的比较器对象，并定义了获取集合子集视图的方法。我们将在 [](#index.xhtml_ch13lev3sec9)\
  \ 中讨论这些。\n\n`NavigableSet` 和 `NavigableMap` 接口包含了用于在有序集合和映射查找下一个或上一个元素的额外方法。`TreeSet`\
  \ 和 `TreeMap` 类实现了这些接口。导航操作可以在基于树的数据结构中高效实现。\n\nJava 21 引入了 `SequencedCollection<E>`\
  \ 接口，它提供了对集合第一个元素和最后一个元素的统一访问以及反向遍历。\n\n```\nE getFirst()\nE getLast()\nvoid addFirst(E\
  \ e)\nvoid addLast(E e)\nE removeFirst()\nE removeLast()\nSequencedCollection<E>\
  \ reversed()\n```\n\n以前，这些操作是通过列表、集合和队列中的不同方法完成的。`SequencedSet` 子接口将 `reversed`\
  \ 方法的返回类型精确为 `SequencedSet`。`SequencedMap` 接口为映射提供了类似的方法。\n\n## 具体集合类 (Concrete\
  \ Collections)\n\n[](#index.xhtml_ch13table01) 显示了 Java 集合框架中的集合，并简要描述了每个集合类的用途。（为了简单起见，我省略了将在\
  \ 第 10 章 中将讨论的线程安全集合。）\n\n[](#index.xhtml_ch13table01) 中的所有类都实现了 `Collection` 接口，但以\
  \ `Map` 结尾的类除外。这些类实现了 `Map` 接口。我们将在 [](#index.xhtml_ch13lev2sec10) 中讨论映射。\n\n###\
  \ Java 集合框架中的具体集合\n\n| 集合类型 |  |  |\n| --- | --- | --- |\n| `ArrayList` | 动态增长收缩的索引序列\
  \ | [](#index.xhtml_ch13lev2sec4) |\n| `LinkedList` | 允许在任何位置进行高效插入和删除的有序序列 | [](#index.xhtml_ch13lev2sec3)\
  \ |\n| `ArrayDeque` | 实现为循环数组的双端队列 | [](#index.xhtml_ch13lev2sec8) |\n| `HashSet`\
  \ | 拒绝重复元素的无序集合 | [](#index.xhtml_ch13lev2sec5) |\n| `TreeSet` | 有序集合 | [](#index.xhtml_linked-hash-sets-and-maps)\
  \ |\n| `EnumSet` | 包含枚举类型值的集合 | [](#index.xhtml_ch13lev3sec6) |\n| `LinkedHashSet`\
  \ | 记住元素插入顺序的集合 | [](#index.xhtml_linked-hash-sets-and-maps) |\n| `PriorityQueue`\
  \ | 允许高效删除最小元素的集合 | [](#index.xhtml_ch13lev2sec9) |\n| `HashMap` | 存储键/值关联的数据结构\
  \ | [](#index.xhtml_ch13lev2sec9a) |\n| `TreeMap` | 键经过排序的映射 | [](#index.xhtml_ch13lev2sec9a)\
  \ |\n| `EnumMap` | 键属于枚举 类型的映射 | [](#index.xhtml_ch13lev3sec6) |\n| `LinkedHashMap`\
  \ | 记住条目添加顺序的映射 | [](#index.xhtml_linked-hash-sets-and-maps) |\n| `WeakHashMap`\
  \ | 如果映射的值在其他处没有被使用，则可以被垃圾器回收的映射 | [](#index.xhtml.weak-hash-maps) |\n| `IdentityHashMap`\
  \ | 使用 `==` 而不是 `equals` 比较键的映射 | [](#index.xhtml_ch13lev3sec7) |\n\n[](#index.xhtml_ch13fig11)\
  \ 显示了这些类之间的关系。\n\n![Figure](img/13_11_new.jpg) Java 集合框架中的类\n\n### 链表 (Linked Lists)\n\
  \n我们在书中许多示例中已经使用了数组和它们的动态亲戚 `ArrayList` 类。然而，数组和数组列表有一个巨大的缺点。从数组中间删除元素是昂贵的的，因为被删除元素之后的所有数组元素都必须向数组的开头移动（参见\
  \ [](#index.xhtml_ch13fig04)）。在数组中间插入元素也是如此。\n\n![Figure](img/13_04.jpg) 从数组中删除元素\n\
  \n另一个著名的数据结构——链表解决了这个问题。数组在连续内存位置上存储对象，而链表将每个对象分开存储。在 Java 集合框架中，所有的链表实际上都是双向的；也就是说，每个链接还存储指向前驱的引用（参见\
  \ [](#index.xhtml_ch13fig05)）。\n\n![Figure](img/13_05.jpg) 双链表\n\n从链表的中间删除元素是一个廉价的操作——只需要更新被删除元素周围的链接（参见\
  \ [](#index.xhtml_ch13fig06)）。\n\n![Figure](img/13_06.jpg) 从链表中删除元素\n\n你可能曾经上过数据结构课程，学习过如何实现链表。如果你对删除或添加元素时弄乱链接有记忆，那么你会惊讶地发现\
  \ Java 集合框架提供了一个可以直接使用的 `LinkedList` 类。以下代码示例添加了三个元素，然后删除了第二个：\n\n```\nvar staff\
  \ = new LinkedList<String>();\nstaff.add(\"Amy\");\nstaff.add(\"Bob\");\nstaff.add(\"\
  Carl\");\nIterator<String> iter = staff.iterator();\nString first = iter.next();\
  \ // 访问第一个元素 (Amy)\nString second = iter.next(); // 访问第二个元素 (Bob)\niter.remove();\
  \ // 删除第二个元素 (Bob)\n```\n\n然而，链表和通用集合之间有一个重要的区别。链表是一个位置很重要的有序集合。`LinkedList.add`\
  \ 方法将对象添加到列表末尾。但你通常想在列表的中间添加对象。这种取决于位置的添加方法是迭代器的职责，因为迭代器描述了集合中的位置。使用迭代器添加元素对于具有自然排序的集合才有意义。例如，我们在下一节中讨论的集合类型不对元素实施任何排序。因此，`Iterator`\
  \ 接口中没有 `add` 方法。相反，Java 集合框架提供了一个包含 `add` 方法的子接口 `ListIterator`：\n\n```java\ninterface\
  \ ListIterator<E> extends Iterator<E>\n{\n   void add(E element);\n   . . .\n}\n\
  ```\n\n与 `Collection.add` 不同，该方法不返回 `boolean`——假设 `add` 操作总是修改列表。\n\n此外，`ListIterator`\
  \ 接口包含两个反向遍历列表的方法：\n\n```java\nboolean hasPrevious()\nE previous()\n```\n\n类似于 `next`\
  \ 方法，`previous` 方法返回它跳过的对象。\n\n`LinkedList` 类的 `listIterator` 方法返回一个实现 `ListIterator`\
  \ 接口的迭代器。\n\n```java\nListIterator<String> iter = staff.listIterator();\n```\n\n\
  \n\n\n\n`add` 方法在迭代器位置*之前*添加新元素。例如，以下代码跳过了链表中的第一个元素，并在第二个元素之前添加了 `\"Juliet\"`（参见\
  \ #index.xhtml_ch13fig07）：\n\n```\nvar staff = new LinkedList<String>();\nstaff.add(\"\
  Amy\");\nstaff.add(\"Bob\");\nstaff.add(\"Carl\");\nListIterator<String> iter =\
  \ staff.listIterator();\niter.next(); // skip past first element\niter.add(\"Juliet\"\
  );\n```\n\n![Figure](img/13_07.jpg)向链表添加元素\n\n如果你多次调用 `add` 方法，元素将简单按照你提供的顺序进行添加。它们会按顺序依次添加到当前迭代器位置之前。\n\
  \n当你使用一个刚从 `listIterator` 方法返回的、指向列表第一个元素的迭代器执行 `add` 操作时，新添加的元素将成为第一个元素。当迭代器越过链表的最后一个元素（即当\
  \ `hasNext` 返回 `false` 时），添加的元素将成为链表的新尾部。如果链表有 `n` 个元素，则有 `n` + 1 个可以插入新元素。这些位置对应于迭代器的\
  \ `n` + 1 种可能位置。例如，如果链表包含三个元素 A、B 和 C，则有四个可以插入新元素的位置（标记为 `|`）：\n\n```\n|ABC\nA|BC\n\
  AB|C\nABC|\n```\n\n在使用“光标”类比进行说明时要小心。`remove` 操作的工作方式并不完全等同于退格键（Backspace）。在调用 `next`\
  \ 之后，`remove` 方法确实会删除迭代器左侧的元素，就像退格键一样。然而，如果你刚刚调用了 `previous`，则右侧的元素会被删除。而且你不能连续调用两次\
  \ `remove`。\n\n与仅依赖于迭代器位置的 `add` 方法不同，`remove` 方法依赖于迭代器的状态。\n\n最后，`set` 方法将由调用 `next`\
  \ 或 `previous` 返回的最后一个元素替换为新元素。例如，以下代码将列表的第一个元素替换为新值：\n\n```\nListIterator<String>\
  \ iter = list.listIterator();\nString oldValue = iter.next(); // returns first element\n\
  iter.set(newValue); // sets first element to newValue\n```\n\n正如你所想象的，如果一个迭代器在遍历集合的同时另一个迭代器正在修改它，可能会出现混乱的情况。例如，假设一个迭代器指向一个被另一个迭代器刚刚删除的元素之前。该迭代器现在已失效，不应继续使用。链表迭代器设计为可以检测此类修改。如果迭代器发现集合被另一个迭代器或集合本身的方法修改了，它将抛出\
  \ `ConcurrentModificationException`。例如，考虑以下代码：\n\n```\nList<String> list = . . .;\n\
  ListIterator<String> iter1 = list.listIterator();\nListIterator<String> iter2 =\
  \ list.listIterator();\niter1.next();\niter1.remove();\niter2.next(); // throws\
  \ ConcurrentModificationException\n```\n\n调用 `iter2.next` 会抛出 `ConcurrentModificationException`，因为\
  \ `iter2` 检测到列表已从外部被修改。\n\n为了避免并发修改异常，请遵循这一简单规则：你可以为集合附加任意数量的迭代器，只要它们都是只读的。或者，你可以附加一个既能读又能写的单个迭代器。\n\
  \n并发修改检测是通过非常简单的方式实现的。集合会跟踪变异操作（如添加和删除元素）的数量。每个迭代器都会维护一个由*它*负责的变异操作计数。在每个迭代器方法的开头，迭代器只需检查自身的变异计数是否等于集合的计数。如果不相等，它就会抛出\
  \ `ConcurrentModificationException`。\n\n然而，并发修改检测中有一个奇特的异常。链表只跟踪对列表的*结构性*修改，例如添加和删除链接。`set`\
  \ 方法*不*被视为结构性修改。你可以为链表附加多个迭代器，它们都可以调用 `set` 来更改现有链接的内容。这种能力在我们在本章稍后讨论的 `Collections`\
  \ 类中的许多算法中是需要的。\n\n现在你已经了解了 `LinkedList` 类的基本方法。使用 `ListIterator` 可以双向遍历链表的元素，并添加和删除元素。\n\
  \n正如你在 #index.xhtml_ch13lev1sec3 中所示的，许多其他操作链表的有用方法在 `Collection` 接口中已经声明。这些方法大部分都实现在\
  \ `LinkedList` 类的父类 `AbstractCollection` 中。例如，`toString` 方法会调用所有元素上的 `toString`\
  \ 并产生一个格式为 `[A, B, C]` 的长字符串。这对于调试很有帮助。使用 `contains` 方法检查元素是否存在于链表中。例如，如果链表已经包含一个与字符串\
  \ `\"Harry\"` 相等的字符串，则调用 `staff.contains(\"Harry\")` 将返回 `true`。\n\nJava 集合框架还提供了一些从理论角度来看似乎有些可疑的方法。链表不支持快速的随机访问。如果你想查看链表的第\
  \ `n` 个元素，必须从开始处开始跳过前 `n - 1` 个元素。没有捷径。由于这个原因，程序员通常不会在需要通过整数索引访问元素的情况下使用链表。\n\n\
  尽管如此，`LinkedList` 类提供了一个 `get` 方法，让你访问特定元素：\n\n```\nLinkedList<String> list = .\
  \ . .;\nString obj = list.get(n);\n```\n\n当然，这个方法并不十分高效。如果你发现自己在使用它，那么你可能在使用用错误的数据结构。你*永远不要*使用这种幻觉般的随机访问方法来遍历链表。以下代码：\n\
  \n```\nfor (int i = 0; i < list.size(); i++)\n   do something with list.get(i);\n\
  ```\n\n效率低得惊人。每次当你查找另一个元素时，搜索都会从列表开始开始。`LinkedList` 对象并没有缓存位置。\n\n`get` 方法有一个细微的优化：如果索引至少为\
  \ `size() / 2`，则元素的搜索将从列表末尾开始。\n\n列表迭代器接口还有一个方法可以告诉你当前位置的索引。事实上，由于 Java 迭代器在概念上指向元素之间，因此它有两个这样的方法：`nextIndex`\
  \ 方法返回调用 `next` 将返回的元素的整数索引；`previousIndex` 方法返回调用 `previous` 将返回的元素的索引。\n\n\n\n\
  \n\n位于 [](#index.xhtml_ch13ex01) 的程序演示了链表的操作。它简单地创建了两个列表，将它们合并，然后从第二个列表中删除每个第二个元素，最后测试了\
  \ `removeAll` 方法。我建议你追踪程序的执行流，并特别关注迭代器。绘制迭代器位置的图可能会有所帮助，如下所示：\n\n```\n|ACE  |BDFG\n\
  A|CE  |BDFG\nAB|CE B|DFG\n. . .\n```\n\n注意，以下调用\n\n```\nSystem.out.println(a);\n\
  ```\n\n通过调用 `AbstractCollection` 中的 `toString` 方法，打印链表 `a` 中的所有元素。\n\n### `linkedList/LinkedListTest.java`\n\
  \n```java\npackage linkedList;\nimport java.util.*;\n\n/**\n * 此程序演示了链表的操作。\n *\
  \ @version 1.13 2023-12-05\n * @author Cay Horstmann\n */\npublic class LinkedListTest\n\
  {\n    public static void main(String[] args)\n    {\n        var a = new LinkedList<String>();\n\
  \        a.add(\"Amy\");\n        a.add(\"Carl\");\n        a.add(\"Erica\");\n\n\
  \        var b = new LinkedList<String>();\n        b.add(\"Bob\");\n        b.add(\"\
  Doug\");\n        b.add(\"Frances\");\n        b.add(\"Gloria\");\n\n        //\
  \ 将 b 中的元素合并到 a\n        ListIterator<String> aIter = a.listIterator();\n      \
  \  Iterator<String> bIter = b.iterator();\n        while (bIter.hasNext())\n   \
  \     {\n            if (aIter.hasNext()) aIter.next();\n            aIter.add(bIter.next());\n\
  \        }\n        System.out.println(a);\n\n        // 从 b 中删除每个第二个元素\n      \
  \  bIter = b.iterator();\n        while (bIter.hasNext())\n        {\n         \
  \   bIter.next(); // 跳过一个元素\n            if (bIter.hasNext())\n            {\n \
  \               bIter.next(); // 跳过下一个元素\n                bIter.remove(); // 删除该元素\n\
  \            }\n        }\n        System.out.println(b);\n\n        // 批量操作：从 a\
  \ 中移除 b 中的所有元素\n        a.removeAll(b);\n        System.out.println(a);\n    }\n\
  }\n```\n\n### `java.util.List<E>` 1.2\n\n* `ListIterator<E> listIterator()`\n  \
  \  返回一个用于访问列表元素的列表迭代器。\n* `ListIterator<E> listIterator(int index)`\n    返回一个用于访问列表元素的列表迭代器，其首次调用\
  \ `next` 将返回具有给定定索引的元素。\n* `void add(int i, E element)`\n    在指定位置添加一个元素。\n* `boolean\
  \ addAll(int i, Collection<? extends E> elements)`\n    将集合中的所有元素添加到指定位置。\n* `E\
  \ remove(int i)`\n    移除并返回指定位置的元素。\n* `E get(int i)`\n    获取指定位置的元素。\n* `E set(int\
  \ i, E element)`\n    用新元素替换指定位置的元素，并返回旧元素。\n* `int indexOf(Object element)`\n \
  \   返回与指定元素相等的元素首次出现的位置，如果没有找到匹配的元素，则返回 `-1`。\n* `int lastIndexOf(Object element)`\n\
  \    返回与指定元素相等的元素最后出现的位置，如果没有找到匹配的元素，则返回 `-1`。\n\n### `java.util.ListIterator<E>`\
  \ 1.2\n\n* `void add(E newElement)`\n    在当前位置之前添加一个元素。\n* `void set(E newElement)`\n\
  \    用新元素替换由 `next` 或 `previous` 访问的最后一个元素。如果自上次调用 `next` 或 `previous` 之后列表结构被修改，则抛出\
  \ `IllegalStateException`。\n* `boolean hasPrevious()`\n    如果在反向遍历列表时还有另一个元素可以访问，则返回\
  \ `true`。\n* `E previous()`\n    返回上一个对象。如果到达列表开头，则抛出 `NoSuchElementException`。\n\
  * `int nextIndex()`\n    返回下次调用 `next` 将返回的元素索引，或者如果迭代器已过最后一个元素，则返回列表的大小。\n* `int\
  \ previousIndex()`\n    返回下次调用 `previous` 将返回的元素索引，如果迭代器在第一个元素之前，则返回 -1。\n\n###\
  \ `java.util.LinkedList<E>` 1.2\n\n* `LinkedList()`\n    构造一个空链表。\n* `LinkedList(Collection<?\
  \ extends E> elements)`\n    构造一个链表并添加集合中的所有元素。\n* `void addFirst(E element)`\n\
  * `void addLast(E element)`\n    在列表的开头或结尾添加元素。\n* `E getFirst()`\n* `E getLast()`\n\
  \    返回列表开头或结尾的元素。\n* `E removeFirst()`\n* `E removeLast()`\n    移除并返回列表开头或结尾的元素。\n\
  \n### 数组列表 (Array Lists)\n\n在前面的节中，你看到了 `List` 接口和实现它的 `LinkedList` 类。`List` 接口描述了一个有序集合，其中元素的位置很重要。访问元素有两种协议：通过迭代器以及通过\
  \ `get` 和 `set` 方法进行随机访问。\n\n\n\n在 Java 中，哈表被实现为链表数组。每个列表被称为一个 `bucket`（桶，参见 [#index.xhtml_ch13fig08]）。要找到对象在表中的位置，计算其哈希值（hash\
  \ code）并对其对桶的总数取模。得到的数字就是存储该元素的桶索引。例如，如果一个对象的哈希值为 76268，且有 128 个桶，那么该对象被放置在 108\
  \ 号桶中（因为 `76268` % `128` 的余数是 108）。也许你运气很好，该桶中没有其他元素。这时，你只需将元素插入到该桶中。当然，有时你会遇到一个非空桶。这被称为\
  \ `hash collision`（哈希冲突）。然后，将新对象与该桶中的所有对象进行比较，以检查它是否已经存在。如果哈希值的分布足够随机，且桶的数量足够大，通常只需要几次比较即可。\n\
  \n![Figure](img/13_08.jpg)哈表\n\n在 `HashMap` 的实现中，当桶的大小超过阈值时，它会从链表转换为平衡二叉树。如果哈希函数选择不当导致大量冲突，或者恶意代码试图用许多具有相同哈希值的值充斥哈表，这种机制可以提高性能。\n\
  \n在可能的情况下，哈希表的键（keys）应该属于实现了 `Comparable` 接口的类。这样，你就能保证不会因为哈希值分布不均而导致性能低下的。\n\n\
  如果哈希表太满，它需要进行 `rehashed`（重哈希）。要重哈希表，会创建一个具有更多桶的表，将所有元素插入新表，并丢弃原表。`load factor`（负载因子）决定了哈希表何时进行重哈希。例如，如果负载因子为\
  \ 0.75（默认值）且表填充率超过 75%，它将自动以双倍的桶数量进行重哈希。对于大多数应用程序，将负载因子保持在 0.75 是合理的。\n\n如果你想对哈希表的性能有更具体的控制，可以指定初始桶的数量。你应该将其设置为预期元素数量除以负载因子。或者，从\
  \ Java 19 开始，你可以使用静态的 `newHashSet` 便捷方法来为你完成这项计算：\n\n```java\nHashSet<String> strings\
  \ = HashSet.newHashSet(expectedElementCount);\n```\n\n一些研究人员认为，将桶的数量设置为质数是一个好主意，可以防止键的聚类。然而，这些证据并不充分。Java\
  \ 集合框架使用的桶数量是 2 的幂次方，默认值为 `16`。（你提供的任何桶数量值都会自动取整到下一个 2 的幂次。）\n\n哈表可以用于实现几种重要的数据结构。其中最简单的是\
  \ `set` 类型。集合（set）是一个没有重复元素的元素集合。集合的 `add` 方法首先尝试查找要添加的对象，只有在它尚不存在时才进行添加。\n\nJava\
  \ 集合框架提供了一个 `HashSet` 类，它基于哈表实现了一个集合。你使用 `add` 方法添加元素。`contains` 方法被重写，以便进行快速查找，检查元素是否已存在于集合中。它只检查一个桶中的元素，而不是集合中的所有元素。\n\
  \n哈希集合迭代器（iterator）会依次访问所有的桶。由于哈希将元素分散在表中，因此它们的访问顺序看起来是随机的。只有当你不在乎集合中元素的顺序时，才会使用\
  \ `HashSet`。\n\n本节末尾的示例程序 ([#index.xhtml_ch13ex02]）从文件中读取单词，将它们添加到集合中，并打印集合中的前二十个单词。例如，你可以通过命令行壳启动程序并输入《爱丽丝仙游游》（*Alice\
  \ in Wonderland*）的文本：\n\n```bash\njava set.SetTest ../gutenberg/alice30.txt\n```\n\
  \n《爱丽丝仙游游》有 28,195 个单词，其中 5,909 个是唯一的（包括开头的版权声明）。单词以随机顺序出现。随后，相同的单词会被插入到树集合（tree\
  \ set）中，正如你将在下一节中看到的，它会保持元素的排序顺序。\n\n在修改集合元素时要小心。如果一个元素的哈希值发生变化，该元素将不再位于数据结构中的正确位置。\n\
  \n```java\nvar rects = new HashSet<Rectangle>();\nvar rect = new Rectangle(5, 10,\
  \ 20, 30);\nrects.add(rect); \nrect.setLocation(0, 0); // rects 现在是 [java.awt.Rectangle[x=0,y=0,width=20,height=30]]\n\
  rects.remove(new Rectangle(0, 0, 20, 30)); // 返回 false，未移除\n```\n\nset/SetTest.java\n\
  \n```java\npackage set;\n\nimport java.io.IOException;\nimport java.nio.file.Path;\n\
  import java.util.*;\n\n/**\n * 此程序比较了向哈希集合和树集合插入元素的性能。\n * 运行程序的方式为：\n * java set.SetTest\
  \ ../gutenberg/alice30.txt\n * java set.SetTest ../gutenberg/crsto10.txt 100\n *\n\
  \ * @version 1.2 2023-12-07\n * @author Cay Horstmann\n */\npublic class SetTest\n\
  {\n    public static void time(Set<String> wordSet, List<String> wordList, int repetitions)\
  \ \n    {\n        long totalTime = 0;\n        for (int i = 1; i <= repetitions;\
  \ i++) \n        {\n            for (String word : wordList) {\n               \
  \ long start = System.nanoTime();\n                wordSet.add(word);\n        \
  \        long end = System.nanoTime();\n                totalTime += end - start;\n\
  \            }\n        }\n        Iterator<String> iter = wordSet.iterator(); \n\
  \        for (int i = 1; i <= 20 && iter.hasNext(); i++)\n            System.out.print(iter.next()\
  \ + \" \");\n        System.out.printf(\"%s: %d words, %d distinct, %.3f seconds.%n\"\
  ,\n                wordSet.getClass().getSimpleName(), wordList.size(), wordSet.size(),\
  \ totalTime * 1E-9);\n    }\n\n    public static void main(String[] args) throws\
  \ IOException\n    {\n        List<String> words = new ArrayList<>();\n        String\
  \ filename = args.length > 0 ? args[0] : \"../gutenberg/crsto10.txt\";\n       \
  \ int repetitions = args.length > 1 ? Integer.parseInt(args[1]) : 1; \n        try\
  \ (var in = new Scanner(Path.of(filename))) { \n            while (in.hasNext())\
  \ { \n                String word = in.next(); \n                words.add(word);\
  \ \n            } \n        }\n        time(new HashSet<>(), words, repetitions);\n\
  \        time(new TreeSet<>(), words, repetitions);\n    }\n}\n```\n\n### java.util.HashSet<E>\
  \ 1.2\n\n*   `HashSet()`\n    构造一个哈希集合。\n*   `HashSet(Collection<? extends E> elements)`\n\
  \    构造哈希集合并添加集合中的所有元素。\n*   `HashSet(int initialCapacity)` / `HashSet(int initialCapacity,\
  \ float loadFactor)`\n    使用指定的容量和负载因子构造一个空哈希集合，负载因子为 0.75。如果大小/容量超过负载因子，哈表将重哈希。\n\
  *   `static <E> HashSet<E> newHashSet(int numMappings)` 19\n    构造一个具有初始容量以容纳预期元素数量（`numMappings`）而无需重哈希的空哈希集合。\n\
  \n### java.lang.Object 1.0\n\n*   `int hashCode()`\n    返回对象的哈希值。哈希值可以是任何整数，正负均可。`equals`\
  \ 和 `hashCode` 的定义必须兼容：如果 `x.equals(y)` 为 `true`，则 `x.hashCode()` 必须与 `y.hashCode()`\
  \ 相同。\n\n### Tree Sets\n\n`TreeSet` 类与哈希集合相似，增加了一个改进。树集合是一个*排序集合*。你可以以任何顺序将元素插入集合。当你遍历集合时，值会自动按排序顺序呈现。例如，假设你插入了三个字符串，然后访问你添加的所有元素。\n\
  \n\n\n\n\n```\nvar sorter = new TreeSet<String>(); \nsorter.add(\"Bob\");\nsorter.add(\"\
  Amy\");\nsorter.add(\"Carl\");\nfor (String s : sorter) System.out.println(s);\n\
  ```\n\n然后，值将按排序顺序打印：`Amy Bob Carl`。正如该类的名称所示，排序是通过树数据结构实现的。（当前的实现使用了 `red-black\
  \ tree`。关于红黑树的详细描述，可以参考例如 Thomas Cormen、Charles Leiserson、Ronald Rivest 和 Clifford\
  \ Stein 著的《Introduction to Algorithms》，The MIT Press, 2022。）每当元素被添加到树中时，它会被放置在正确的位置。因此，迭代器始终按照排序顺序访问元素。\n\
  \n向树中添加元素比向哈希表中添加元素慢。但它仍然比在数组或链列表中检查重复项快得多。如果树包含 `n` 个元素，则平均需要 `log n` 次比较来找到新元素的正确位置。例如，如果树已经包含\
  \ 1,000 个元素，添加一个新元素大约需要 10 次比较。\n\n为了使用树 set，你必须能够比较元素。元素必须实现 `Comparable` 接口，或者在构造集合时提供一个\
  \ `Comparator`。树 set 慢多少？为了使这种区别具体，考虑收集一组矩形的任务。如果你使用 `TreeSet`，你需要提供 `Comparator<Rectangle>`。你如何比较两个矩形？通过面积吗？你可能有两个坐标不同但面积相同的矩形，而你想同时保留它们。如果比较器与元素类型的\
  \ `equals` 方法不兼容，集合的相等性可能会给出不一致的结果。这里有一个典型的例子：\n\n```\nvar words = new TreeSet<String>(CASE_INSENSITIVE_ORDER);\n\
  ```\n\n意图是收集仅在大小写不同的元素：\n\n```\ncommands.add(\"QUIT\");\ncommands.add(\"quit\");\
  \ // 未添加\n```\n\n然而，现在 `equals` 不再具有对称性：\n\n```\ncommands.equals(Set.of(\"quit\"\
  )) // true\nSet.of(\"quit\").equals(commands) // false\n```\n\n当 `comparator` 返回零时，`TreeSet`\
  \ 认为两个元素相等。更好的方法是使用 `String.compare` 排序，并仅向集合中插入小写字符串。`TreeSet` 类实现了 `NavigableSet`\
  \ 接口。该接口添加了几个方便的方法来定位元素。详见 API 注释。`ch13ex3` 中的程序构建了两个 `Item` 对象的树集合。第一个集合按部件号排序，这是\
  \ `Item` 对象的默认排序顺序。第二个集合按描述排序，使用了自定义的比较器。\n\n### TreeSetTest.java\n```java\npackage\
  \ treeSet;\n\nimport java.util.*;\n\n/**\n * 此程序通过比较描述对一组 Item 对象进行排序。\n * @version\
  \ 1.2 2024-12-05\n * @author Cay Horstmann\n */\npublic class TreeSetTest\n{\n \
  \   public static void main(String[] args)\n    {\n        var parts = new TreeSet<Item>();\n\
