  \ 超类定义这些方法返回空字符串；必要时重写它们。\n\n* `String formatMessage(LogRecord record)`\n\n  返回日志记录的本地化并格式化的消息部分。\n\
  \n## 调试技巧\n\n\n\n\n假设你写好了程序，并通过捕获并妥善处理所有异常使其变得无懈可击。然后你运行它，结果它运行并不正常。现在该？（如果你从未遇到过这个问题，可以跳过本章的剩余内容。）\n\
  \n当然，如果你有一个方便且强大的调试器是最好的。调试器作为专业开发环境的一部分可用，例如 `Eclipse`、`IntelliJ` 和 `NetBeans`。在本节中，我将提供一些在启动调试器之前可能值得尝试的技巧。\n\
  \n1. 你可以使用如下所示的代码来打印或记录任何变量的值：\n\n```\nSystem.out.println(\"x=\" + x);\n```\n\n\
  或者\n\n```\nlogger.log(DEBUG, \"x=\" + x);\n```\n\n如果 `x` 是一个数字，它会被转换为等效字符串。如果 `x`\
  \ 是一个对象，Java 会调用它的 `toString` 方法。记录 `this` 对象的状态也很有用。\n\n```\nlogger.log(DEBUG,\
  \ \"this=\" + this);\n```\n\nJava 库中的大部分类都非常负责地重写了 `toString` 方法，以提供有关该类的有用信息。这对于调试来说是一个真正的助力。你应该在你的类中尽同样的努力。\n\
  \n2. 你可以在每个类中放置一个独立的 `main` 方法。在里面，放置演示如何使用该类的代码。\n\n```\npublic class MyClass\n\
  {\n   methods and fields\n   . . .\n   public static void main(String[] args)\n\
  \   {\n      demo code\n   }\n}\n```\n\n创建几个对象，调用方法，并证明它们中的每一个都执行了正确的操作。\n\n3. 为了进行更专业的单元测试，你应该查看来自\
  \ [`junit.org`](https://junit.org) 的 JUnit。JUnit 是一个非常流行的单元测试框架，可以很方便地组织测试用例集。每当你对类进行更改时就运行测试，每当你发现\
  \ bug 时就添加另一个测试用例。\n\n4. 日志代理是一个子类的对象，它可以拦截方法调用，记录它们，然后调用原始方法。例如，如果你在 `Random` 类的\
  \ `nextDouble` 方法上遇到困难，你可以创建一个匿名子类的实例作为代理对象：\n\n```\nvar generator = new Random()\n\
  \   {\n      public double nextDouble()\n      {\n         double result = super.nextDouble();\n\
  \         logger.log(DEBUG, \"nextDouble: \" + result);\n         return result;\n\
  \      }\n   };\n```\n\n每当调用 `nextDouble` 方法时，就会生成日志消息。\n\n注意，这只有当类不是 `final` 时才有效。对于接口，可以实现一个记录所有方法的代理，如第\
  \ 6 章所示。\n\n5. 你可以通过 `Throwable` 类中的 `printStackTrace` 方法从任何异常对象获取堆栈跟踪。以下代码捕获任何异常，打印异常对象和堆栈跟踪，并重新抛出异常以便其能找到预期的处理器。\n\
  \n```\ntry\n{\n   . . .\n}\ncatch (Throwable t)\n{\n   t.printStackTrace();\n  \
  \ throw t;\n}\n```\n\n你甚至不需要捕获异常来生成堆栈跟踪。只需在代码的任何地方插入语句\n\n```\nThread.dumpStack();\n\
  ```\n\n即可获取堆栈跟踪。\n\n6. 通常，堆栈跟踪显示在 `System.err.` 上。如果你想记录或显示堆栈跟踪，这里是如何将其捕获到字符串中的方法：\n\
  \n```\nvar out = new StringWriter();\nnew Throwable().printStackTrace(new PrintWriter(out));\n\
  String description = out.toString();\n```\n\n7. 将程序错误记录在文件中通常是方便的。然而，错误被发送到 `System.err`\
  \ 而不是 `System.out`。因此，你不能简单地通过运行来捕获它们\n\n```\njava MyProgram > errors.txt\n```\n\
  \n相反，捕获错误流的方式为\n\n```\njava MyProgram 2> errors.txt\n```\n\n要在同一个文件中捕获 `System.err`\
  \ 和 `System.out`，请使用\n\n```\njava MyProgram 1> errors.txt 2>&1\n```\n\n这在 `bash`\
  \ 和 Windows shell 中有效。\n\n8. 让未捕获异常的堆栈跟踪显示在 `System.err` 中并不是理想的。如果终端用户恰好看到这些消息，他们会感到困惑，而且在你需要进行诊断时它们并用。更好的方法是记录它们。你可以使用静态方法\
  \ `Thread.setDefaultUncaughtExceptionHandler` 修改未捕获异常的处理器：\n\n```\nThread.setDefaultUncaughtExceptionHandler((Thread\
  \ t, Throwable e) ->\n      logger.log(TRACE, \"Uncaught exception in \" + t, e));\
  \ \n```\n\n9. 要观察类加载，使用 `-verbose` 标志启动 Java 虚拟机。你将得到如下的输出：\n\n```\n[0.012s][info][class,load]\
  \ opened: /opt/jdk-17.0.1/lib/modules\n[0.034s][info][class,load] java.lang.Object\
  \ source: jrt:/java.base\n[0.035s][info][class,load] java.io.Serializable source:\
