  \n### `java.util.TreeMap<K,V>` 1.2\n\n*   `TreeMap()`\n    为实现了 `Comparable` 接口的键构造空树\
  \ map。\n*   `TreeMap(Comparator<? super K> c)`\n    构造树 map 并使用指定的比较器对其键进行排序。\n\
