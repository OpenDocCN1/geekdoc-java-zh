  * `E floor(E value)` — 返回大于等于 `value` 的最小元素或小于等于 `value` 的最大元素，如果没有这样的元素则返回 `null`。\n\
  * `E pollFirst()`\n* `E pollLast()` — 并返回此集合中最小或最大的元素，如果集合为空则返回 `null`。\n\n### Queues\n\
  \n正如我们讨论过的，队列允许你高效地在尾部添加并在头部移除。双端队列，即 *deque*，允许你在两端高效地添加或删除元素。不支持在中间添加元素。`Deque`\
  \ 接口由 `ArrayDeque` 和 `LinkedList` 类实现，这两个者提供了按需增长的双端队列。在第 10 章，你将看到边界队列和双端队列。\n\n\
  在 Java 21 中，方法\n\n```\nE getFirst()\nE getLast()\nvoid addFirst(E e)\nvoid addLast(E\
  \ e)\nE removeFirst()\nE removeLast()\n```\n\n从 `Deque` 接口移动到了 `SequencedCollection`\
  \ 接口，`List` 和 `Set` 接口也扩展了该接口。这为访问集合的第一个最后一个元素提供了统一的方法。\n\n`java.util.Queue<E>`\
  \ 5.0\n* `boolean add(E e)`\n* `boolean offer(E e)` — 将元素添加到队列尾并返回 `true`，前提队列未满。如果队列满了，第一个方法抛出\
  \ `IllegalStateException`，而第二个方法返回 `false`。\n* `E remove()`\n* `E poll()` — 移除并返回队列头部元素，前提队列不为空。如果队列为空，第一个方法抛出\
  \ `NoSuchElementException`，而第二个方法返回 `null`。\n* `E element()`\n* `E peek()` — 返回队列头部的元素但不移除它，前提队列不为空。如果队列为空，第一个方法抛出\
  \ `NoSuchElementException`，而第二个方法返回 `null`。\n\n`java.util.SequencedCollection<E>`\
  \ 21\n* `void addFirst(E element)`\n\n\n\n\n* `void addLast(E element)`\n  在此集合的第一个元素之前或最后一个元素之后添加指定的元素。如果集合已满，抛出\
  \ `IllegalStateException`。\n\n* `E removeFirst()`\n\n* `E removeLast()`\n  如果集合不为空，移除并返回此集合的第一个或最后一个元素。如果集合为空，抛出\
  \ `NoSuchElementException`。\n\n* `E getFirst()`\n\n* `E getLast()`\n  如果集合不为空，返回此集合的第一个或最后一个元素而不将其移除。如果集合为空，抛出\
  \ `NoSuchElementException`。\n\n`java.util.Deque<E>` 6\n\n* `boolean offerFirst(E\
  \ element)`\n\n* `boolean offerLast(E element)`\n  在该队列队列的第一个元素之前或最后一个元素之后添加指定的元素。如果队列已满，返回\
  \ `false`。\n\n* `E pollFirst()`\n\n* `E pollLast()`\n  如果队列不为空，移除并返回该队列第一个元素之前或最后一个元素之后的元素。如果队列为空，返回\
  \ `null`。\n\n* `E peekFirst()`\n\n* `E peekLast()`\n  如果队列不为空，返回该队列的第一个或最后一个元素而不将其移除。如果队列为空，返回\
  \ `null`。\n\n`java.util.ArrayDeque<E>` 6\n\n* `ArrayDeque()`\n\n* `ArrayDeque(int\
  \ initialCapacity)`\n  构造一个初始容量为 16 或给定初始容量的无界队列。\n\n### 优先级队列\n\n优先级队列在元素以任意顺序插入后按排序顺序检索元素。也就是说，每当你调用\
  \ `remove` 方法时，都会得到当前优先级队列中最小的元素。然而，优先级队列并没有对所有元素进行排序。如果你遍历这些元素，它们并不一定是有序的。优先级队列使用了一种名为“堆”（heap）的优雅且高效的数据结构。堆是一种自组织的二叉树，其中\
  \ `add` 和 `remove` 操作会使最小元素向根节点聚集，而不需要浪费时间对所有元素进行排序。\n\n就像 `TreeSet` 一样，优先级队列可以持有实现了\
  \ `Comparable` 接口的类元素，或者你在构造函数中提供的 `Comparator` 对象。\n\n优先级队列的一个典型用途是作业调度。每个任务都有一个优先级。任务按随机顺序添加。每当有新任务可以启动时，优先级最高的任务就会从队列中移除。（由于传统上认为优先级\
  \ 1 是“最高”优先级，因此 `remove` 操作产生的是最小元素。）\n\n示例显示了优先级队列的运行。与 `TreeSet` 中的迭代不同，这里的迭代不会按排序顺序访问元素。然而，移除操作总是产生剩余的最小元素。\n\
