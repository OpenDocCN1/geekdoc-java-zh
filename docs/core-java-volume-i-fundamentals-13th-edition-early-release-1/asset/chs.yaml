  \ Oracle 和/或其关联公司。保留所有权利。\n\n\n\n\n\n# 前言\n\n## 致读者\n\n1995 年底，Java 编程语言席卷互联网领域并迅速走红。Java\
  \ 技术的承诺是它将成为连接用户与信息的通用胶水，无论信息来自何处——Web 服务器、数据库、信息提供者或任何可以想象的来源。事实上，Java 处于实现这一承诺的独特地位。它是一种工程极其严谨的语言，获得了广泛认可。其内置的安全和保护特性让编程人员和\
  \ Java 程序用户都感到安心。Java 内置了对高级任务的支持，如网络编程、数据库连接和并发。\n\n自 1995 年以来，已经发布了二十多个版本的 Java\
  \ 开发工具包（JDK）。应用程序接口（API）已从一百多类增长到 4000 多个类。API 现在涵盖了并发编程、集合、用户界面构建、数据库管理、国际化、安全和\
  \ XML 处理等如此丰富的领域。\n\n你正在阅读的这本书是《核心 Java》第十三版的第一卷。每个版本都紧随 Java 开发工具包的发布，每次我都会重写这本书以利用最新的\
  \ Java 特性。这一版已更新，以反映 Java 21 的特性。\n\n与之前的版本一样，这本书仍然针对那些想要将 Java 应用于真实项目的严肃程序员。我把你（读者）认为是一个在\
  \ Java 以外的编程语言具有坚实背景的程序员。我假设你不喜欢充满玩具示例（例如：烤面包机、动物园动物或“紧张的文本”）的书。你不会在书中发现任何此类内容。我的目标是让你充分理解\
  \ Java 语言和库，而不是给你一种理解的幻觉。\n\n在书中，你将看到大量的示例代码，展示了几乎每一个语言和库特性。示例程序特意保持简单，以关注要点，但在大多数情况下，它们并不是虚假的，也没有走捷径。它们应该是你自己代码的良好起点。\n\
  \n我假设你愿意、甚至渴望学习 Java 语言为你提供的所有功能。在本卷中，你将对以下内容进行详细介绍：\n\n*   面向对象编程\n*   反射和代理\n\
  *   接口和内部类\n*   异常处理\n*   泛型编程\n*   集合框架\n*   并发编程\n*   注解\n*   Java 平台模块系统\n\n\n\
  \n\n随着 Java 类库的爆炸式增长，想要用一卷书涵盖严肃的程序员需要知道的所有 Java 特性简直是不可能的。因此，本书被分为两卷。第一卷集中于 Java\
  \ 语言的基础概念。第二卷 `Core Java, Volume II: Advanced Features` 则进一步深入探讨了最重要的库。\n\n在过去的十二个版本中，用户界面编程一直被认为是基础性的，但现在是时候承认它不再如此，并将其移动到第二卷了。该卷包含了对以下主题的详细讨论：\n\
  \n* Stream API\n* 文件处理与正则表达式\n* 数据库\n* XML 处理\n* 脚本与编译 API\n* 国际化\n* 网络编程\n* 图形用户界面设计\n\
  * 图形编程\n* 原生方法\n\n在编写书籍时，出现错误和不准确之处是不可避免的。我非常希望了解这些错误。但当然，我希望每个错误只被学习到一次。你可以在 [`horstmann.com/corejava`](https://horstmann.com/corejava)\
  \ 找到常见问题和错误修复列表。在勘误页的末尾策略性地放置了一个表单（以鼓励你先阅读它），你可以用它来报告错误并提出改进。如果我没有回答每一个查询或没有立即回复，请不要失望。我会阅读所有的邮件，并感谢你的投入，这将使本书的未来版本更加清晰、包含更多信息。\n\
  \n## 本书概览\n\n`第 1 章` 概述了 Java 区别于其他编程语言的能力。本章解释了语言设计者的目标以及他们取得了何种程度的成功。随后 Java 的简史，详细介绍了\
  \ Java 如何诞生以及如何演变。\n\n在 `第 2 章` 中，你将看到如何下载和安装 `JDK` 以及本书的程序示例。然后，我将引导你编译并运行控制台应用程序和图形应用程序。你将看到如何使用基础\
  \ `JDK`、Java IDE 以及 `JShell` 工具。\n\n`第 3 章` 开始对 Java 语言的讨论。在本章中，我涵盖了基础知识：变量、循环和简单函数。如果你是\
  \ C 或 C++ 程序员，这部分会进展非常顺畅，因为这些语言特性的语法与 C 语言基本相同。如果你来自非 C 背景（如 Visual Basic），你将希望仔细阅读这一章。\n\
  \n面向对象编程（OOP）现在是编程实践的主流，而 Java 是一门面向对象的编程语言。`第 4 章` 引入了封装，这是面向对象的两个基本构建基石之一，以及 Java\
  \ 语言实现它的的机制——即类和方法。除了 Java 语言的规则外，你还会发现关于良好的 OOP 设计的建议。最后，我涵盖了奇妙的 `javadoc` 工具，它可以将你的代码注释格式化为一组超链接的网页。如果你熟悉\
  \ C++，可以快速浏览这一章。来自非面向对象背景的程序员应该预料到在进一步学习 Java 之前花费一些时间掌握 OOP 概念。\n\n类和封装只是 OOP 故事的一部分，`第\
  \ 5 章` 引入了另一部分——即 `继承`。继承允许你获取一个现有的类并根据你的需求对其进行修改。这是 Java 编程的一项基础技术。Java 的继承机制与\
  \ C++ 非常相似。同样，C++ 程序员可以关注两种语言之间的差异。\n\n`第 6 章` 展示了如何使用 Java 的 `interface`（接口）概念。接口让你能够超越\
  \ `第 5 章` 中简单的继承模型。掌握接口让你能够充分利用 Java 完全面向对象的编程方法的力量。在涵盖接口之后，我转向了 `lambda 表达式`，这是一种在以后某个时间执行代码块的简洁表达方式。然后我解释了\
  \ Java 的一个名为 `内部类` 的有用技术特性。\n\n`第 7 章` 讨论了 `异常处理`——Java 处理“良好的程序可能发生故障”这一事实的健壮机制。异常为你提供了一种高效的方法，将正常处理代码与错误处理分开。当然，即使通过处理所有异常情况来增强你的程序，它仍然可能无法按预期运行。然后本章转向日志记录。在本章的最后部分，我提供了一些实用的调试技巧。\n\
  \n`第 8 章` 概述了泛型编程。泛型编程让你的程序更容易读更安全。我向你展示如何使用强类型并移除难看且不安全的强制转换，以及如何处理由于需要兼容旧版本 Java\
  \ 而产生的复杂性。\n\n`第 9 章` 的主题是 Java 平台的集合框架。每当你想要收集多个对象并在以后检索它们时，都应该使用最适合你情况的集合，而不是简单地将元素丢进数组。这一章向你展示如何利用预构建的供你标准集合。\n\
  \n`第 10 章` 涵盖了并发，它允许你编写并行执行的任务。在处理器具有多个核心且你希望保持其繁忙的时代，这是 Java 技术的一个重要且令人兴奋的应用。\n\
  \n在 `第 11 章` 中，你将学习注解，它允许你在 Java 程序中添加任意信息（称为元数据）。我们向你展示注解处理器如何在源代码或类文件级别获取这些注解，以及如何使用注解在运行时影响类的行为。只有在配合工具时才有用，我们希望我们的讨论能帮助你根据需求选择实用的注解处理工具。\n\
  \n`第 12 章`，你将学习 Java 平台模块系统，该系统有助于 Java 平台和核心库的有序演进。该模块系统提供了包的封装以及描述模块所需的机制。你将学习模块的属性，以便决定是否在自己的应用程序中使用。即使你决定不使用，你也需要了解新规则以便与\
  \ Java 平台和其他模块化库进行交互。\n\n`附录` 列出了 Java 语言的保留字。\n\n## 约定\n\n正如许多计算机书籍一样，我使用 `等宽字体`\
  \ 表示计算机代码。\n\n注释使用如下所示“注意”图标进行标记。\n\n提示使用如下所示“提示”图标进行标记。\n\n当前方有危险时，我将用“警告”图标警告你。\n\
  \n未来可能成为语言或 API 一部分的预览功能将用此图标标记。\n\n有很多 C++ 注释解释了 Java 和 C++ 之间的差异。如果你没有 C++ 背景，或者你认为对该语言的经历是一个不想回想起的噩梦，可以跳过它们。\n\
  \n\n\nJava 自带了一个大型编程库，或者说应用程序接口（API）。当第一次使用 API 调用时，我会在该章节的末尾添加一段简短的总结描述。这些描述稍微非正式，但希望它们比官方在线\
