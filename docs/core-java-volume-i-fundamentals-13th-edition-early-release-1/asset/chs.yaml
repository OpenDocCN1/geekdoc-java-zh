  ```\n\n打印\n\n```\n3333.33333\n```\n\n如果你想显示例如美元和分，这就是一个问题。\n\n解决方法是使用 `printf` 方法，例如：\n\
  \n```java\nSystem.out.printf(\"%8.2f\", x);\n```\n\n打印具有*字段宽度* 8 和*精度* 2 的 `x`。也就是说，输出包含前导空格和七个字符。\n\
