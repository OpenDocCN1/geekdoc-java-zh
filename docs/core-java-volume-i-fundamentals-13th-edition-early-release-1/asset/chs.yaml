  \n## 方法参数\n\n让我们回顾描述编程语言中如何将参数传递给方法（或函数）的计算机科学术语。按值传递（call by value）意味着方法获取调用者提供的值。相比之下，按引用传递（call\
  \ by reference）意味着方法获取调用者提供的变量的`location`。因此，方法可以修改按引用传递的变量所存储的值，但不能修改按值传递的的值。这些“按\
  \ . . .传递”术语是描述各种编程语言中方法参数行为的标准计算机科学术语，不仅仅是 Java。（还有一种按名传递（call by name），它主要具有历史意义，被用于\
  \ Algol 编程语言，这是最古老的高级语言之一。）\n\nJava 编程语言*始终*使用按值传递。这意味着方法获取所有参数的副本。特别是，方法无法修改方法调用中任何变量的内容。\n\
  \n例如，考虑以下调用：\n\n```java\ndouble percent = 10;\nharry.raiseSalary(percent);\n```\n\
  \n无论该方法如何实现，我们都知道在方法调用后，`percent` 的值仍然是 `10`。\n\n让我们更仔细地观察一下这种情况。假设一个方法尝试将方法参数的值乘以三：\n\
  \n```java\npublic static void tripleValue(double x) // 无效\n{\n   x = 3 * x;\n}\n\
  ```\n\n我们来调用这个方法：\n\n```java\ndouble percent = 10;\ntripleValue(percent);\n```\n\
  \n然而，这不起作用。在方法调用后，`percent` 的值仍然是 `10`。发生的情况如下：\n\n1.  `x` 使用 `percent` 值的副本（即 `10`）初始化。\n\
  2.  `x` 被乘以三——现在是 `30`。但 `percent` 仍然是 `10`（见 []](#index.xhtml_ch04fig06)）。\n  \
  \  ![Figure](img/04_06.jpg)修改参数变量没有持久影响。\n3.  方法结束，参数变量 `x` 不再使用。\n\n然而，方法参数有两种类型：\n\
  \n*   基本类型（数字类型、`char`、`boolean`）\n*   对象引用\n\n你已经看到方法无法更改基本类型参数。对于对象参数，情况则不同。你可以轻松实现一个将员工薪水乘以三的方法：\n\
  \n```java\npublic static void tripleSalary(Employee x) // 有效\n{\n   x.raiseSalary(200);\n\
  }\n```\n\n当你调用\n\n```java\nharry = new Employee(. . .);\ntripleSalary(harry);\n\
  ```\n\n然后会发生以下情况：\n\n1.  `x` 使用 `harry` 值的副本——即一个对象引用——初始化。\n2.  `raiseSalary` 方法修改了\
  \ `x` 所引用对象的状态。\n3.  方法结束，参数变量 `x` 不再使用。\n\n\n\n\nC++ 同时支持按值传递和引用传递。你用 `&` 来标记引用参数。例如，你可以轻松地实现方法\
  \ `void tripleValue(double& x)` 或 `void swap(Employee& x, Employee& y)`，来修改它们的引用参数。\n\
  \n`ParamTest/ParamTest.java`\n\n```java\n/**\n * 此程序演示了 Java 中的参数传递。\n * @version\
  \ 1.01 2018-04-10\n * @author Cay Horstmann\n */\npublic class ParamTest\n{\n  \
  \  public static void main(String[] args)\n    {\n        /*\n         * 测试 1: 方法无法修改数值参数\n\
  \         */\n        System.out.println(\"Testing tripleValue:\");\n        double\
  \ percent = 10;\n        System.out.println(\"Before: percent=\" + percent);\n \
  \       tripleValue(percent);\n        System.out.println(\"After: percent=\" +\
  \ percent);\n\n        /*\n         * 测试 2: 方法可以改变对象参数的状态\n         */\n       \
  \ System.out.println(\"\\nTesting tripleSalary:\");\n        var harry = new Employee(\"\
  Harry\", 50000);\n        System.out.println(\"Before: salary=\" + harry.getSalary());\n\
  \        tripleSalary(harry);\n        System.out.println(\"After: salary=\" + harry.getSalary());\n\
  \n        /*\n         * 测试 3: 方法无法为对象参数关联新对象\n         */\n        System.out.println(\"\
  \\nTesting swap:\");\n        var a = new Employee(\"Alice\", 70000);\n        var\
  \ b = new Employee(\"Bob\", 60000);\n        System.out.println(\"Before: a=\" +\
  \ a.getName());\n        System.out.println(\"Before: b=\" + b.getName());\n   \
  \     swap(a, b);\n        System.out.println(\"After: a=\" + a.getName());\n  \
  \      System.out.println(\"After: b=\" + b.getName());\n    }\n\n    public static\
  \ void tripleValue(double x) // 不起\n    {\n        x = 3 * x;\n        System.out.println(\"\
  End of method: x=\" + x);\n    }\n\n    public static void tripleSalary(Employee\
  \ x) // 有效\n    {\n        x.raiseSalary(200);\n        System.out.println(\"End\
  \ of method: salary=\" + x.getSalary());\n    }\n\n    public static void swap(Employee\
  \ x, Employee y)\n    {\n        Employee temp = x;\n        x = y;\n        y =\
  \ temp;\n        System.out.println(\"End of method: x=\" + x.getName());\n    \
  \    System.out.println(\"End of method: y=\" + y.getName());\n    }\n}\n\nclass\
  \ Employee // 简化的 Employee 类\n{\n    private String name;\n    private double salary;\n\
  \    public Employee(String n, double s)\n    {\n        name = n;\n        salary\
  \ = s;\n    }\n\n    public String getName()\n    {\n        return name;\n    }\n\
  \n    public double getSalary()\n    {\n        return salary;\n    }\n\n    public\
  \ void raiseSalary(double byPercent)\n    {\n        double raise = salary * byPercent\
  \ / 100;\n        salary += raise;\n    }\n}\n```\n\n## 对象构造\n\n你已经看到过如何编写简单的构造函数来定义对象的初始状态。然而，由于对象构造非常重要，Java\
  \ 提供了多种编写构造函数的机制。我们将在接下来的章节中介绍这些机制。\n\n### 重载\n\n某些类拥有多个构造函数。例如，你可以这样构造一个空的 `StringBuilder`\
  \ 对象：\n\n```java\nvar messages = new StringBuilder();\n```\n\n或者，你可以指定一个初始字符串：\n\
  \n```java\nvar todoList = new StringBuilder(\"To do:\\n\");\n```\n\n这种能力被称为`重载`（overloading）。如果多个方法具有相同的名称（在本例中为\
  \ `StringBuilder` 构造方法）但参数不同，就会发生重载。编译器必须确定调用哪个方法。它通过匹配各种方法声明中的参数类型与特定方法调用中所使用的参数类型，来选择正确的方法。如果编译器无法匹配参数（是因为根本没有匹配，要么是因为没有一个比其他所有方法都更好的匹配），就会发生编译时错误。（寻找匹配的过程被称为`重载解析`（overloading\
  \ resolution）。）\n\nJava 允许你重载任何方法——而不仅仅是构造方法。\n\n\n\n那么你必须提供一个无参构造函数。当然，如果你对所有字段的默认值满意，你只需要提供：\n\
  \n```java\npublic ClassName()\n{\n}\n```\n\nC++ 有一种特殊的初始化列表语法来用于构造字段，例如：\n\n```cpp\n\
  Employee::Employee(String n, double s, int y, int m, int d) // C++\n:  name(n),\n\
  \   salary(s),\n   hireDay(y, m, d)\n{\n}\n```\n\nC++ 使用这种特殊语法来避免对无参构造函数的必要的调用。在\
  \ Java 中，这种这种，因为对象没有子对象，只有对其他对象的引用。\n\n### 显式字段初始化\n\n通过重载类中的构造器方法，你可以构建多种方法来设置类实例字段的初始状态。确保无论调用哪个构造器，每个实例字段都被设置了有意义的值，这一直是一个好主意。\n\
  \n你可以直接为类定义中的任何字段赋值。例如：\n\n```java\nclass Employee\n{\n   private String name =\
  \ \"\";\n   . . .\n}\n```\n\n此赋值会在构造函数执行之前完成。如果一个类的所有构造器都需要将某个特定的实例字段设置为相同的值，这种语法就特别有用。\n\
  \n初始化值不一定是一个常量。这里有一个使用方法调用初始化字段的示例。考虑 `Employee` 类，每个员工都有一个 `id` 字段。你可以这样初始化：\n\n\
  ```java\nclass Employee\n{\n   private static int nextId;\n   private int id = advanceId();\n\
  \   . . .\n   private static int advanceId()\n   {\n      int r = nextId;\n    \
  \  nextId++; \n      return r;\n   }\n   . . .\n}\n```\n\n在这个示例中，`id` 字段是在对象初始化块中初始化的，无论使用哪个构造器来创建对象。初始化块首先运行，然后执行构造器的体体。\n\
  \n### 参数命名\n\n当你编写非常平凡的构造器时（你会写很多这样的构造器），想出参数名称可能会让人有些沮丧。\n\n我们通常选择单字母作为参数名：\n\n\
  ```java\npublic Employee(String n, double s)\n{\n   name = n;\n   salary = s;\n\
  }\n```\n\n然而，缺点是你需要阅读代码才能知道 `n` 和 `s` 参数的含义。\n\n有些程序员会在每个参数前加一个“a”前缀：\n\n```java\n\
  public Employee(String aName, double aSalary)\n{\n   name = aName;\n   salary =\
  \ aSalary;\n}\n```\n\n这样更好。任何读者都能立即理解参数的含义。\n\n另一个常用的技巧依赖于这样一个事实：参数变量会*遮蔽*（shadow）同名的实例字段。例如，如果你将参数命名为\
  \ `salary`，那么 `salary` 指的是参数，而不是实例字段。但你仍然可以通过 `this.salary` 访问实例字段。记住 `this` 表示隐式参数——即正在被构造的对象。这里有一个示例：\n\
  \n```java\npublic Employee(String name, double salary)\n{\n   this.name = name;\n\
  \   this.salary = salary;\n}\n```\n\n在 C++ 中，通常会在实例字段前加下划线或固定字母。（字母 `m` 和 `x` 是常见的选择。）例如，薪资字段可能被命名为\
  \ `_salary`、`mSalary` 或 `xSalary`。Java 程序员通常不这样做。\n\n### 调用另一个构造器\n\n关键字 `this`\
  \ 指方法的隐式参数。然而，这个关键字有第二个含义。\n\n如果*构造器的第一条语句*的形式为 `this(. . .)`，那么构造器会调用同一类的另一个构造器。这里有一个典型的示例：\n\
  \n```java\npublic Employee(double s)\n{\n   // 调用 Employee(String, double)\n   this(\"\
  Employee #\" + nextId, s);\n   nextId++;\n}\n```\n\n当你调用 `new Employee(60000)` 时，`Employee(double)`\
  \ 构造器会调用 `Employee(String, double)` 构造器。\n\n这样使用 `this` 关键字非常有用——你只需要编写一次公共构造代码。\n\
  \nJava 中的 `this` 引用与 C++ 中的 `this` 指针是相同的。但在 C++ 中，你在成员初始化列表中调用另一个构造器：\n\n```cpp\n\
  Employee(double s) : Employee(\"Employee #\" + nextId, s) { nextId++; }\n```\n\n\
  if `imageWidth <= 0 || imageHeight <= 0` return;\n\n### 初始化块\n\n你已经看到了两种初始化实例字段的方法：\n\
  \n*   通过在构造器中设置值\n*   通过在声明中赋值\n\nJava 中还有第三种机制，称为*初始化块*（initialization block）。类声明可以包含任意的代码块。当该类的对象被构造时，这些代码块会被执行。例如：\n\
  \n```java\nclass Employee\n{\n   private static int nextId;\n\n   private int id;\n\
  \   private String name;\n   private double salary;\n\n   // 对象初始化块\n   {\n    \
  \  id = nextId;\n      nextId++;\n   }\n\n   public Employee(String n, double s)\n\
  \   {\n      name = n;\n      salary = s;\n   }\n\n   public Employee()\n   {\n\
  \      name = \"\";\n      salary = 0;\n   }\n   . . .\n}\n```\n\n这种机制永远不是，也不常见。通常将初始化代码放在构造器内部会更直接。\n\
  \n\n\n\n\n\n当你使用 `java Hello` 调用该类时，该类被加载，静态初始化块打印出“Hello, World”，随后才显示出 `main`\
  \ 方法未定义的消息。从 Java 7 开始，`java` 程序会首先检查是否存在 `main` 方法。\n\n此示例使用 `RandomGenerator`\
  \ 实例来生成随机数。从 JDK 17 开始，`java.util.random` 包提供了具有不同权衡的强算法的实现。它提供了一个在大多数用途下都运行良好的默认实现类，但如果你对替代方案感兴趣，可以阅读\
  \ `java.util.random` 包的 API 文档以获取关于选择什么算法的建议。你可以通过以下方式获取特定实例：\n\n```\nRandomGenerator\
  \ generator = RandomGenerator.of(\"L64X128MixRandom\");\n```\n\n通过调用 `generator.nextInt(n)`\
  \ 或其他 `RandomGenerator` 方法生成随机数。（从技术上讲，`RandomGenerator` 是一个`interface`，这是第 6 章中引入的概念。当你在\
  \ `RandomGenerator` 实例上调用方法时，不需要担心这一点。）\n\n`RandomGenerator` 接口对 Java 1.0 中的 `Random`\
  \ 类进行了改进，后者的 `period`（周期）相当短，只有 2⁴⁸，之后内部状态就会重复。根据经验法则，要生成 `n` 个随机数，周期至少应该为 `n`²。根据该规则，如果\
  \ `n` 超过 2²⁴，则经典的 `Random` 生成器就是不合适的，而这个数字并不大——大约是 1700 万。如今，已经有了许多更好的算法，放弃 `Random`\
  \ 类是一个好主意。\n\n如果你想在使用 `Random` 类的旧代码中使用强随机数生成器，可以使用如下静态方法 `from`：\n\n```\nRandom\
  \ generator = Random.from(RandomGenerator.getDefault());\n```\n\n[](#index.xhtml_ch04ex05)\
  \ 中的程序展示了本节讨论的许多特性：\n\n* 重载的构造函数\n* 使用 `this(. . .)` 调用另一个构造函数\n* 无参数构造函数\n* 对象初始化块\n\
  * 静态初始化块\n* 实例字段初始化\n\n`ConstructorTest/ConstructorTest.java`\n\n```java\nimport\
  \ java.util.random.*;\n```\n\n```java\n/**\n * 此程序演示了对象的构造。\n * @version 1.02 2018-04-10\n\
  \ * @author Cay Horstmann\n */\npublic class ConstructorTest\n{\n    public static\
  \ void main(String[] args) {\n        // 用三个 Employee 对象填充 staff 数组\n        var\
  \ staff = new Employee[3];\n        staff[0] = new Employee(\"Harry\", 40000);\n\
  \        staff[1] = new Employee(60000);\n        staff[2] = new Employee();\n \
  \       // 打印所有 Employee 对象的信息\n        for (Employee e : staff) {\n           \
  \ System.out.println(\"name=\" + e.getName() + \",id=\" + e.getId() + \",salary=\"\
  \ + e.getSalary());\n        }\n    }\n}\n```\n\n```java\nclass Employee\n{\n  \
  \  private static int nextId;\n    private int id;\n    private String name = \"\
  \"; // 字段初始化\n    private double salary;\n    private static RandomGenerator generator\
  \ = RandomGenerator.getDefault();\n\n    // 静态初始化\n    static {\n        // 将 nextId\
  \ 设置为 0 到 9999 之间的随机数\n        nextId = generator.nextInt(10000);\n    }\n\n   \
  \ // 对象初始化块\n    {\n        id = nextId;\n        nextId++;\n    }\n\n    // 三个重载构造函数\n\
  \    public Employee(String n, double s) {\n        name = n;\n        salary =\
  \ s;\n    }\n\n    public Employee(double s) {\n        // 调用 Employee(String, double)\
  \ 构造函数\n        this(\"Employee #\" + nextId, s);\n    }\n\n    // 默认构造函数\n    public\
  \ Employee() {\n        // name 初始化为 \"\"--见上文\n        // salary 未显式设置--初始化为 0\n\
  \    }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ double getSalary() {\n        return salary;\n    }\n\n    public int getId()\
  \ {\n        return id;\n    }\n}\n```\n\n`java.util.random.RandomGenerator`\n\n\
  * `int nextInt(int n)` 返回 0 到 `n` 之间的随机整数。\n* `static RandomGenerator of(String\
  \ name)` 为指定的算法产生一个随机生成器。名为 `\"L64X128MixRandom\"` 的算法适用于大多数应用。\n* `static RandomGenerator\
  \ getDefault()` 返回一个具有 64 位或更多位的强随机生成器。\n\n`java.util.Random`\n\n* `static from(RandomGenerator\
  \ generator)` 返回一个 `Random` 实例，其方法委托给给定的 `RandomGenerator`。这在旧代码中非常有用。\n\n### 对象销毁与\
  \ `finalize` 方法\n\n某些面向对象的编程语言（特别是 C++）具有显式的析构函数方法，用于处理对象不再被使用时可能需要的任何清理工作。析构函数中最常见的活动是回收为对象分配的内存。由于\
  \ Java 具有自动垃圾回收机制，不需要手动回收内存，因此 Java 不支持析构函数。\n\n当然，某些对象使用了内存以外的资源，例如文件或使用系统资源的对象的句柄。在这种情况下，当资源不再需要时对其进行回收和循环利用是非常重要的。\n\
  \n如果你在完成对资源的操作后立即关闭它，请提供一个 `close` 方法。\n\n\n\n\n在 Java 语言规范中，record 的实例字段被称为它的 `components`（组件）。\n\
  \n该类有一个构造函数：\n\n```\nPoint(double x, double y)\n```\n\n以及访问器方法：\n\n```\npublic double\
  \ x()\npublic double y()\n```\n\n注意，访问器的名称为 `x` 和 `y`，而不是 `getX` 和 `getY`。（在 Java\
  \ 中，拥有同名的实例字段和方法是合法的。）\n\n```\nvar p = new Point(3, 4);\nSystem.out.println(p.x()\
  \ + \" \" + p.y());\n```\n\nJava 并没有遵循 `get` 命名规范，因为那样有点混乱。对于 `boolean` 字段，通常使用\
  \ `is` 而不是 `get`。此外，首字母大写可能会导致问题。如果一个类拥有字段 `x` 和 `X`，会发生什么？有些程序员对此感到不悦，因为他们的遗留类无法简单地转换为\
  \ record。但在实践中，许多此类遗留类是可变的，因此不是转换为 record 的候选对象。\n\n除了字段访问器方法，每个 record 都自动定义了三个方法：`toString`、`equals`\
  \ 和 `hashCode`。你将在下一章学习更多关于这些方法的知识。\n\n你可以为 record 添加自己的方法：\n\n```\nrecord Point(double\
  \ x, double y)\n{\n   public double distanceFromOrigin() { return Math.hypot(x,\
  \ y); }\n}\n```\n\n你可以定义自动提供的方法的自定义版本，只要它们的参数和返回类型相同。例如，这种定义是合法的：\n\n```\nrecord\
  \ Point(double x, double y)\n{\n   public double x() { return 2 * x; } // 糟糕\n}\n\
  ```\n\n但这显然不是一个好主意。\n\n你不能向 record 添加实例 `instance` 字段。\n\n```\nrecord Point(double\
  \ x, double y)\n{\n   private double r; // 错误\n   . . .\n}\n```\n\nrecord 的实例字段自动是\
  \ `final` 的。然而，它们可以是可变对象的引用：\n\n```\nrecord PointInTime(double x, double y, Date\
  \ when) { }\n```\n\n那么 record 实例就是可变的：\n\n```\nvar pt = new PointInTime(0, 0, new\
  \ Date());\npt.when().setTime(0);\n```\n\n如果你打算让 record 实例是不可变的，请对字段使用不可变类型。\n\n\
  record 和类一样可以拥有静态字段和方法：\n\n```\nrecord Point(double x, double y)\n{\n   public static\
  \ Point ORIGIN = new Point(0, 0);\n   public static double distance(Point p, Point\
  \ q)\n   {\n      return Math.hypot(p.x - q.x, p.y - q.y);\n   }\n   . . .\n```\n\
  \n对于由完全表示的不变数据，使用 record。如果数据是可变的，或者随时间演变，请使用类。record 在并发程序中更易读、更高效且更安全。\n\n###\
  \ 构造函数：规范、紧凑和自定义\n\n自动设置所有实例字段的构造函数被称为 `canonical constructor`（规范构造函数）。\n\n要验证或规范化规范构造函数的参数，请使用\
  \ `compact`（紧凑）形式：\n\n```\nrecord Range(int from, int to)\n{\n   public Range //\
  \ 紧凑形式，验证参数\n   {\n      if (from > to) throw new IllegalArgumentException();\n\
  }\n```\n\n或者\n\n```\nrecord Range(int from, int to)\n{\n   public Range // 紧凑形式，规范参数\n\
  \   {\n      if (from > to) // 交换边界\n         int temp = from;\n         from =\
  \ to;\n         to = temp;\n      }\n   }\n}\n```\n\n紧凑形式的体是规范构造函数的“前言”，它在参数赋值给实例字段\
  \ `this.from` 和 `this.to` 之前修改参数变量 `from` 和 `to`。\n\n你可以定义额外的 `custom constructors`（自定义构造函数）。此类构造函数的第一个语句必须调用另一个构造函数，以便最终调用规范构造函数。例如：\n\
  \n```\nrecord Point(double x, double y)\n{\n   public Point() { this(0, 0); } //\
  \ 这里有两个构造函数：规范构造函数和一个无参构造函数\n\n如果规范构造函数需要额外工作，你可以提供自己的实现。但这并不常见。正如你看到的，通过紧凑构造函数实现相同的效果更容易。\n\
  \n```\nrecord Range(int from, int to)\n{\n   public Range(int from, int to) // 合法，但比紧凑构造函数工作更多\n\
  \   {\n      if (from <= to)\n      {\n         this.from = from;\n         this.to\
  \ = to;\n      }\n      else\n      {\n         this.from = to;\n         this.to\
  \ = from;\n      }\n   }\n}\n```\n\n`RecordTest/RecordTest.java`\n\n```\nimport\
  \ java.util.*;\n\n/**\n * 此程序演示了 record。\n * @version 1.0 2021-05-13\n * @author\
  \ Cay Horstmann\n */\n\npublic class RecordTest\n\n{\n\npublic static void main(String[]\
  \ args)\n\n {\n\n var p = new Point(3, 4);\n\nSystem.out.println(\"Coordinates of\
  \ p: \" + p.x() + \" \" + p.y());\n\nSystem.out.println(\"Distance from origin:\
  \ \" + p.distanceFromOrigin());\n\n // 使用静态字段和方法的计算\n\nSystem.out.println(\"Distance\
  \ from origin: \" + Point.distance(Point.ORIGIN, p));\n\n // 可变的 record\nvar pt\
  \ = new PointInTime(3, 4, new Date());\n\nSystem.out.println(\"Before: \" + pt);\n\
  \npt.when().setTime(0);\n\nSystem.out.println(\"After: \" + pt);\n\n // 调用紧凑构造函数\n\
  var r = new Range(4, 3);\n\nSystem.out.println(\"r: \" + r);\n\n }\n\nrecord Point(double\
  \ x, double y)\n\n{\n\n // 自定义构造函数\n\npublic Point() { this(0, 0); }\n\n // 方法\n\
  \npublic double distanceFromOrigin()\n\n {\n\nreturn Math.hypot(x, y);\n\n }\n\n\
  \ // 静态字段和方法\n\npublic static Point ORIGIN = new Point(0, 0);\n\npublic static double\
  \ distance(Point p, Point q)\n\n {\n\nreturn Math.hypot(p.x - q.x, p.y - q.y);\n\
  \n }\n\n}\n\nrecord PointInTime(double x, double y, Date when) { }\n\nrecord Range(int\
  \ from, int to)\n\n{\n\n // 紧凑构造函数\n\npublic Range\n\n {\n\n if (from > to) // 交换边界\n\
  \n {\n\n int temp = from;\n from = to;\n to = temp;\n\n }\n\n }\n\n}\n```\n\n##\
  \ 包\n\nJava 允许将类分组在一个名为 *package*（包）的集合中。包有助于组织工作，并将你的工作与其他提供的库分开。在接下来的章节中，你将学习如何使用和创建包。\n\
  \n### 包名\n\n使用包的主要目的是保证类名的唯一性。假设两个程序员都想出了提供 `Employee` 类的聪明主意。只要他们将类放在不同的包中，就不会产生冲突。事实上，为了绝对保证包名的唯一，请使用反序编写的\
  \ Internet 域名（已知是唯一的）。你可以使用子包来区分不同的项目。例如，考虑 `horstmann.com` 域名。反序排列后，它变成了包名 `com.horstmann`。如果你随后将\
  \ `Employee` 类放入该包中，它的“全限定名”就变成了 `com.horstmann.corejava.Employee`。\n\n### 类导入\n\
  \n类可以使用其所在包中的所有类，以及其他包中的所有 *public* 类。\n\n\n\n\n你可以通过两种方式访问另一个包中的公共类。第一种是直接使用`完全限定类名`；即包名后跟类名。例如：\n\
  \n```java\njava.time.LocalDate today = java.time.LocalDate.now();\n```\n\n这显然是繁琐的。一种更简单、更常见的方法是使用\
  \ `import` 语句。`import` 语句的作用是为你提供一个简写，用于引用包中的类。一旦你添加了 `import`，就不再需要为类提供完整名称了。\n\
  \n你可以导入一个特定的类，也可以导入整个包。你将 `import` 语句放在源文件的顶部（但位于任何 `package` 语句之下）。例如，你可以使用以下语句导入\
  \ `java.time` 包中的所有类：\n\n```java\nimport java.time.*;\n```\n\n然后你就可以直接使用\n\n```java\n\
  LocalDate today = LocalDate.now();\n```\n\n而不需要包前缀。你也可以导入包内的特定类：\n\n```java\nimport\
  \ java.time.LocalDate;\n```\n\n`java.time.*` 语法就不那么繁琐了。它对代码大小没有负面影响。然而，如果你显式地导入类，代码的阅读者确切知道你使用了哪些类。\n\
  \n但请注意，你只能使用 `*` 符号导入单个包。你不能使用 `import java.*` 或 `import java.*.*` 来导入所有以 `java`\
  \ 为前缀的包。\n\n你永远不需要导入 `java.lang` 包中的类。\n\n集成开发环境（IDE）拥有整理导入的命令。诸如 `import java.util.*;`\
  \ 这样的包语句会自动展开为特定导入的列表，例如：\n\n```java\nimport java.util.ArrayList;\nimport java.util.Date;\n\
  ```\n\n未使用的 `import` 语句会被移除。这是一项非常方便的功能，了解如何在你的 IDE 中实现这一点是一个好主意。\n\n大多数时候，你只需要导入需要的包，而不需要过分担心。只有在发生名称冲突时，你才需要注意包。例如，java.util`\
  \ 和 `java.sql` 包都包含一个 `Date` 类。假设你写了一个同时导入这两个包的程序。\n\n```java\nimport java.util.*;\n\
  import java.sql.*;\n```\n\n如果你现在使用 `Date` 类，将得到编译错误：\n\n```java\nDate today; //\
  \ ERROR--java.util.Date or java.sql.Date?\n```\n\n编译器无法确定你想用哪一个 `Date` 类。你可以通过添加特定的\
  \ `import` 语句来解决这个问题：\n\n```java\nimport java.util.*;\nimport java.sql.*;\nimport\
  \ java.util.Date;\n```\n\n如果你真的需要两个 `Date` 类怎么办？那么在每个类名处都使用完整的包名：\n\n```java\nvar\
  \ startTime = new java.util.Date();\nvar today = new java.sql.Date(. . .);\n```\n\
  \n在包中定位类是`编译器`的活动。类文件中的字节码始终使用完全包名来引用其他类。\n\nC++ 程序员有时会将 `import` 与 `#include` 混淆。两者之间没有共同点。在\
  \ C++ 中，你必须使用 `#include` 来包含外部特声明，因为 C++ 编译器不会查看它正在编译的文件及其显式包含的头文件之外的任何文件。只要你告诉它编译器去哪里查找，Java\
  \ 编译器就会乐意去查看其他文件。\n\n在 Java 中，你可以通过显式命名所有类（如 `java.util.Date`）来完全避免 `import` 机制。在\
  \ C++ 中，你无法避免 `#include` 指令。\n\n`import` 语句的唯一好处是方便。你可以用比完全包名短的名字来引用类。例如，在 `import\
  \ java.util.*`（或 `import java.util.Date`）语句之后，你可以简单地用 `Date` 来引用 `java.util.Date`\
  \ 类。\n\n在 C++ 中，类似于包机制的构造是命名空间（namespace）功能。将 Java 中的 `package` 和 `import` 语句想象成\
  \ C++ 中 `namespace` 和 `using` 指令的对应物。\n\n### 静态导入\n\n`import` 语句的一种形式允许导入静态方法和字段，而不只是类。\n\
  \n例如，如果你在源文件顶部添加指令\n\n```java\nimport static java.lang.System.*;\n```\n\n那么你就可以在没有类名前缀的情况下使用\
  \ `System` 类的静态方法和字段：\n\n```java\nout.println(\"Goodbye, World!\"); // 即 System.out\n\
  exit(0); // 即 System.exit\n```\n\n你也可以导入特定的方法或字段：\n\n```java\nimport static java.lang.System.out;\n\
  ```\n\n在实践中，许多程序员可能会想要缩写 `System.out` 或 `System.exit`。结果代码看起来没那么清晰。另一方面，\n\n```java\n\
  sqrt(pow(x, 2) + pow(y, 2))\n```\n\n看起来比\n\n```java\nMath.sqrt(Math.pow(x, 2) +\
  \ Math.pow(y, 2))\n```\n清晰得多。\n\n你可以导入枚举常量：\n\n```java\nimport java.time.DayOfWeek;\n\
  import static java.time.DayOfWeek.*;\nDayOfWeek w = FRIDAY; // 等于 DayOfWeek.FRIDAY\n\
  ```\n\n`STR` 插值器是 Java 21 的一个预览特性。它用于形成嵌入了表达式的字符串，例如：\n\n```java\nSTR.\"Hello, \\\
  {name}! Next year, you'll be \\{age + 1}.\"\n```\n\n\n\n\n编译器在编译源文件时*并不会*检查目录结构。例如，假设你有一个以以下指令开头的源文件\n\
  \n```java\npackage com.mycompany;\n```\n\n即使该文件没有包含在 `com/mycompany` 子目录下，你也可以编译它。*如果该源文件不依赖于其他包*，它将无错误地通过编译。然而，除非你先将所有类文件移动到正确的位置，否则生成的程序将无法运行。如果包名与目录不匹配，`virtual\
  \ machine`将找不到这些类。\n\n`PackageTest/PackageTest.java`\n\n```java\nimport com.horstmann.corejava.*;\n\
  \n// Employee 类定义在那个包中\nimport static java.lang.System.*;\n\n/**\n * 此程序演示了包的使用。\n\
  \ * @version 1.11 2004-02-19\n * @author Cay Horstmann\n */\npublic class PackageTest\n\
  {\n    public static void main(String[] args)\n    {\n        // 因为有 import 语句，我们在这里不需要使用\
  \ \n        // com.horstmann.corejava.Employee\n        var harry = new Employee(\"\
  Harry Hacker\", 50000, 1989, 10, 1);\n        harry.raiseSalary(5);\n        //\
  \ 因为有 static import 语句，我们在这里不需要使用 System.out\n        out.println(\"name=\" + harry.getName()\
  \ + \",salary=\" + harry.getSalary());\n    }\n}\n```\n\n`PackageTest/com/horstmann/corejava/Employee.java`\n\
  \n```java\npackage com.horstmann.corejava;\n\n// 此文件中的类是该包的一部分\nimport java.time.*;\n\
  \n// import 语句位于 package 语句之后\n\n/**\n * @version 1.11 2015-05-08\n * @author Cay\
  \ Horstmann\n */\npublic class Employee\n{\n    private String name;\n    private\
  \ double salary;\n    private LocalDate hireDay;\n\n    public Employee(String name,\
  \ double salary, int year, int month, int day)\n    {\n        this.name = name;\n\
  \        this.salary = salary;\n        hireDay = LocalDate.of(year, month, day);\n\
  \    }\n\n    public String getName()\n    {\n        return name;\n    }\n\n  \
  \  public double getSalary()\n    {\n        return salary;\n    }\n\n    public\
  \ LocalDate getHireDay()\n    {\n        return hireDay;\n    }\n\n    public void\
  \ raiseSalary(double byPercent)\n    {\n        double raise = salary * byPercent\
  \ / 100;\n        salary += raise;\n    }\n}\n```\n\n### 包访问权限\n\n你已经遇到过访问修饰符 `public`\
  \ 和 `private`。标记为 `public` 的特征可以被任何类使用。`private` 特性只能由定义它的类使用。如果你既没有指定 `public`\
  \ 也没有指定 `private`，该特征（即类、方法或变量）可以被同一个 `package` 中的所有方法访问。\n\n考虑 `index.xhtml_ch04ex02`\
  \ 中的程序。`Employee` 类没有被定义为 `public` 类。因此，只有同一个包中的其他类（例如 `EmployeeTest`，在 particular\
  \ 情况下是这个未命名的包）可以访问它。对于类来说，这是一个合理的默认值。但对于变量来说，这是一个遗憾的选择。变量必须显式地标记为 `private`，否则它们将默认为具有包访问权限。这，显然破坏了封装性。问题在于，人们很容易忘记输入\
  \ `private` 关键字。以下是 JDK 提供的源码中 `java.awt` 包下 `Window` 类的一个示例：\n\n```java\npublic\
  \ class Window extends Container\n{\n   String warningString;\n   . . .\n}\n```\n\
  \n注意，`warningString` 变量并不是 `private` 的！这意味着 `java.awt` 包中所有类的方法都可以访问这个变量并将其设置为任何它们想要的值（例如\
  \ `\"信任我!\"`）。实际上，访问该变量的方法都在 `Window` 类中，因此将该变量设为 `private` 是完全合理的。也许程序员在匆忙编写代码时遗漏了\
  \ `private` 修饰符？也许根本不在意？二十年后，那个变量仍然不是 `private`。不仅如此——随着时间的推移，该类增加了许多新字段，其中大约一半也不是\
  \ `private`。\n\n这可能会成为一个问题。默认情况下，包不是封闭的实体。也就是说，任何人都可以向包中添加更多类。当然，恶意或愚的程序员可以借此添加修改包访问权限变量的代码。例如，在\
  \ Java 的早期版本中……\n\n\n\n\n\n`javac` 编译器始终会在当前目录查找文件，但 `java` 虚拟机启动器只有在 `.` 目录位于类路径上时才会查找当前目录。如果你没有设置类路径，这并不是问题——默认类路径包含\
  \ `.` 目录。但如果你设置了类路径却忘记包含 `.` 目录，你的程序将无错误通过编译，但无法运行。\n\n类路径（class path）列出了所有作为定位类*起点*的目录和归档文件。让我们考虑我们的示例类路径：\n\
  \n```\n/home/user/classdir:.:/home/user/archives/archive.jar\n```\n\n假设虚拟机正在搜索 `com.horstmann.corejava.Employee`\
  \ 类的类文件。它首先在 Java API 类中查找。它在那里找不到该类文件，因此转向类路径。接着它会查找以下文件：\n\n* `/home/user/classdir/com/horstmann/corejava/Employee.class`\n\
  * `com/horstmann/corejava/Employee.class`（从当前目录开始）\n* `com/horstmann/corejava/Employee.class`（位于\
  \ `/home/user/archives/archive.jar` 内部）\n\n编译器定位文件的难度比虚拟机要大。如果你在没有指定包的情况下引用了一个类，编译器首先需要找到包含该类的包。它会咨询所有的\
  \ `import` 指令作为类的可能的来源。例如，假设源文件包含以下指令：\n\n```\nimport java.util.*;\nimport com.horstmann.corejava.*;\n\
  ```\n\n并且源代码引用了类 `Employee`。编译器随后会尝试寻找 `java.lang.Employee`（因为 `java.lang` 包总是被默认导入）、`java.util.Employee`、`com.horstmann.corejava.Employee`\
  \ 以及当前包中的 `Employee`。它会在类路径的所有位置中搜索*每一个*这些类。如果发现多个一个类，则会产生编译时错误。（完全限定的类名必须是唯一的，因此\
  \ `import` 语句的顺序并不重要。）\n\n编译器还更进了一步。它会查看*源文件*以确定源文件是否比类文件新。如果是的话，则会自动重新编译源文件。请记住，你只能从其他包导入公共类。一个源文件只能包含一个公共类，且文件名与公有类名必须匹配。因此，编译器可以轻松定位公共类的源文件。然而，你可以从当前包导入非公共类。这些类可能定义在不同名称的源文件中。如果你从当前包导入一个类，编译器会搜索当前包的*所有*源文件，以查看是哪一个定义了该类。\n\
  \n## 设置类路径\n\nIDE 和构建工具有自己管理类路径的机制。但了解如何手动设置它是一个好主意，这样你就可以排除任何配置问题了。\n\n最好使用 `-classpath`\
  \ 选项（或 `-cp` 或更现代的变体 `--class-path`）来指定类路径：\n\n```\njava -classpath /home/user/classdir:.:/home/user/archives/archive.jar\
  \ MyProg\n```\n\n或者\n\n```\njava -classpath c:\\classdir;.;c:\\archives\\archive.jar\
  \ MyProg\n```\n\n整个命令必须写在一行中。将这样长的命令行放在 shell 脚本或批处理文件中是好的。\n\n使用 `-classpath` 选项是设置类路径的首选方法。另一种方法是\
  \ `CLASSPATH` 环境变量。具体取决于你使用的 shell。对于 Bourne Again shell (bash)，使用命令：\n\n```\nexport\
  \ CLASSPATH=/home/user/classdir:.:/home/user/archives/archive.jar\n```\n\n对于 Windows\
  \ shell，使用：\n\n```\nset CLASSPATH=c:\\classdir;.;c:\\archives\\archive.jar\n```\n\
  \n类路径在 shell 退出之前一直有效。\n\n有些人建议永久设置 `CLASSPATH` 环境变量。这通常是一个坏主意。人们会忘记这个全局设置，并当他们的类没有被正确加载时感到惊讶。一个特别值得指责的例子是\
  \ Apple 在 Windows 上的 QuickTime 安装程序。多年来，它全局设置了 `CLASSPATH` 指向它需要的一个 JAR 文件，但没有将当前目录包含在类路径中。结果是无数\
  \ Java 程序员在他们的程序通过编译但无法运行时被搞得了狂。\n\n在过去，有些人建议完全跳过类路径，通过将所有 JAR 文件丢进 `jre/lib/ext`\
  \ 目录。这种机制在 Java 9 之后已经过时，但它一直是一个糟糕的建议。当被遗忘已久的类从扩展目录加载时，人们很容易产生困惑。\n\n类也可以从*模块路径*（module\
  \ path）加载。模块和模块路径将在第 12 章 中讨论。\n\n## JAR 文件\n\n当你打包应用程序时，你希望给用户提供单个文件，而不是一个装满类文件的目录结构。Java\
  \ 归档（JAR）文件就是为此目的设计的。JAR 文件可以同时包含类文件和其他文件类型（如图像和声音文件）。此外，JAR 文件是经过压缩的，使用了熟悉的 ZIP\
  \ 压缩格式。\n\n### 创建 JAR 文件\n\n使用 `jar` 工具制作 JAR 文件。（在默认的 JDK 安装中，它位于 `jdk/bin` 目录。）创建新\
  \ JAR 文件最常用的命令使用以下语法：\n\n```\njar cvf jarFileName file1 file2\n```\n\n例如：\n\n```\n\
  jar cvf CalculatorClasses.jar *.class\n```\n\n通常，`jar` 命令的格式如下：\n\n```\njar options\
  \ file1 file2\n```\n\n列出了 `jar` 程序的所有选项。它们与 `tar` 命令的选项相似。\n\njar 程序选项\n\n| 选项 |\
  \ 描述 |\n| --- | --- |\n| c | 创建新的或空的归档并添加文件。如果指定的文件名是目录，`jar` 会递归处理它们。 |\n| C |\
  \ 临时切换目录。例如，`jar cvf fileName.jar -C classes *.class` 会切换到 `classes` 子目录。 |\n| e\
  \ | 在清单中创建一个入口。 |\n| f | 指定第二个参数为 JAR 文件名。如果缺少此参数，`jar` 将结果输出到标准输出（创建 JAR 文件时）或从标准输入读取（提取或列出\
  \ JAR 文件时）。 |\n| i | 创建索引文件（用于加速大型归档中的查找）。 |\n| m | 为 JAR 文件添加清单。清单是归档内容和来源的描述。每个归档都有默认清单，但如果你想验证归档内容，可以提供自己的清单。\
  \ |\n| M | 不为条目创建清单文件。 |\n| t | 显示内容。 |\n| u | 更新现有 JAR 文件。 |\n| v | 生成详细输出。 |\n\
  | x | 提取文件。如果你提供了一个或多个文件名，则只提取这些文件。否则，提取所有文件。 |\n| 0 | 不进行 ZIP 压缩存储。 |\n\n你可以将程序和代码库打包成\
  \ JAR 文件。例如，如果你在 Java 程序中发送邮件，你需要使用打包在 `javax.mail.jar` 中的库。\n\n### 清单\n\n除了类文件、图像和其他资源外，每个\
  \ JAR 文件还包含一个描述归档特殊特征的清单（manifest）文件。清单文件名为 `MANIFEST.MF`，位于 JAR 文件中特殊的 `META-INF`\
  \ 子目录下。最合法的清单非常无聊——仅仅是\n\n```\nManifest-Version: 1.0\n```\n\n\n\n\n复杂的清单文件可以包含更多的条目。清单条目被分为若干部分。清单中的第一个部分称为\
  \ `main section`（主部分）。它适用于整个 JAR 文件。随后的条目可以指定命名实体的属性，例如单个文件、包或 URL。这些条目必须以 `Name`\
  \ 条目开始。各个部分之间用空行分隔。例如：\n\n```\nManifest-Version: 1.0\nlines describing this archive\n\
  \nName: Woozle.class\nlines describing this file\nName: com/mycompany/mypkg/\nlines\
  \ describing this package\n```\n\n要编辑清单，将你想要添加到清单中的行放入一个文本文件中。然后运行：\n\n```\njar\
  \ cfm jarFileName manifestFileName . . .\n```\n\n例如，要创建一个带有清单的新 JAR 文件，请运行：\n\n\
  ```\njar cfm MyArchive.jar manifest.mf com/mycompany/mypkg/*.class\n```\n\n要更新现有\
  \ JAR 文件的清单，将新增内容放入文本文件中，并使用如下的命令：\n\n```\njar ufm MyArchive.jar manifest-additions.mf\n\
  ```\n\n关于 JAR 和清单文件格式的更多信息，请参阅 [https://docs.oracle.com/en/java/javase/21/docs/specs/jar/jar.html]。\n\
  \n### 可执行的 JAR 文件\n\n你可以使用 `jar` 命令的 `e` 选项来指定程序的 `entry point`（入口点）——即你通常在调用 `java`\
  \ 程序启动器时所指定的类：\n\n```\njar cvfe MyProgram.jar com.mycompany.mypkg.MainAppClass files\
  \ to add\n```\n\n或者，你也可以在清单中指定程序的 `main class`（主类），格式如下形式的语句：\n\n```\nMain-Class:\
  \ com.mycompany.mypkg.MainAppClass\n```\n\n不要为主类名添加 `.class` 扩展名。清单的最后一行必须以换行符结束。否则，清单将无法正确读取。一个常见的错误是生成了一个仅包含\
  \ `Main-Class` 行但没有行终止符的文本文件。\n\n使用哪种方法，用户都可以简单地按如下启动程序：\n\n```\njava -jar MyProgram.jar\n\
  ```\n\n根据操作系统的配置，用户甚至可能通过双击 JAR 文件图标来启动应用程序。以下是各种操作系统的行为：\n\n* 在 Windows 上，Java\
  \ 运行时安装程序为 `.jar` 扩展创建一个文件关联，使用 `javaw -jar` 命令启动文件。（与 `java` 命令不同，`javaw` 命令不会打开\
  \ shell 窗口。）\n* 在 Mac OS X 上，操作系统识别 `.jar` 文件扩展名，并在双击 JAR 文件时执行 Java 程序。\n\n然而，JAR\
  \ 文件中的 Java 程序感上与原生应用程序不同。在 Windows 上，你可以使用第三方包装器工具将 JAR 文件转换为 Windows 可执行文件。包装器是一个具有熟悉的\
  \ `.exe` 扩展名的 Windows 程序，它用于定定并启动 Java 虚拟机 (JVM)，或者在未找到 JVM 时告诉用户应该如何做。有许多商业和开源产品，例如\
  \ Launch4J ([`launch4j.sourceforge.net`](https://launch4j.sourceforge.net)) 和 IzPack\
  \ ([`izpack.org`](https://izpack.org))。\n\n### 多版本发布 JAR 文件\n\n随着模块的引入和包的强封装，某些以前可以访问的内部\
  \ API 已不再可用。这可能需要库提供者为不同的 Java 版本分发不同的代码`Multi-release JARs`（多版本发布 JAR）处理了这种用例。\n\
  \n为了向后兼容，特定版本的类文件存放在 `META-INF/versions` 目录下：\n\n```\nApplication.class\nBuildingBlocks.class\n\
  Util.class\nMETA-INF \n ├─ MANIFEST.MF (带有行 Multi-Release: true)\n └─ versions\n\
  \    ├─ 9\n    │  ├─ Application.class\n    │  └─ BuildingBlocks.class\n    └─ 10\n\
  \       └─ BuildingBlocks.class\n```\n\n假设 `Application` 类使用了 `CssParser` 类。那么旧的\
  \ `Application.class` 文件可以编译为使用 `com.sun.javafx.css.CssParser`，而 Java 9 版本使用 `javafx.css.CssParser`。\n\
  \nJava 8 完全不知道 `META-INF/versions` 目录，只会加载旧类。当 Java 9 读取 JAR 文件时，将使用新版本。\n\n要添加带版本的类文件，使用\
  \ `--release` 标志：\n\n```\njar uf MyProgram.jar --release 9 Application.class\n```\n\
  \n要从零构建多版本发布 JAR 文件，请使用 `-C` 选项并为每个版本切换到不同的类文件目录：\n\n```\njar cf MyProgram.jar -C\
  \ bin/8 . --release 9 -C bin/9 Application.class\n```\n\n在为不同的发布版本编译时，使用 `--release`\
  \ 标志和 `-d` 标志来指定输出目录：\n\n```\njavac -d bin/8 --release 8 . . . \n```\n\n`-d` 选项会在目录不存在时创建它。JDK\
  \ 附了两个先前版本 API 的符号文件。在 Java 21 中，你可以将 `--release` 设置为 `21`、`20` 或 `19` 进行编译。\n\n\
  多版本发布 JAR 并不是用于程序或库的不同版本。两个版本所有类的公共 API 应该是相同的。多版本发布 JAR 的唯一目的是启用多版本发布文件。\n\n###\
  \ 关于命令行选项的说明\n\nJava 开发工具中的选项传统上使用单连字符后跟多字母名称，例如 `java -jar . .` 和 `javac -Xlint:unchecked\
  \ -classpath . .`。例外是 `jar` 命令，它遵循经典的 `tar` 格式：\n\n```\njar cvf . . .\n```\n\nJEP\
  \ 293 ([`openjdk.org/jeps/293`](https://openjdk.org/jeps/293)) 提供了转向通用格式的指南，从 Java\
  \ 9 开始。在大多数 Linux 工具中，多字母选项以双连字符开头，并带有常用选项的单字母快捷。例如，Linux `ls` 命令可以使用 `human-readable`\
  \ 选项调用：\n\n```\nls --human-readable\n```\n\n或者\n\n```\nls -h\n```\n\n在 `javac` 和\
  \ `java` 中，你现在可以使用 `--version` 代替 `-version`，使用 `--class-path` 代替 `-classpath`。`--module-path`\
  \ 选项快捷为 `-p`。带有 `--` 的选项参数通过空格或 `=` 号分隔：\n\n```\njava --class-path /home/user/classdir\
  \ . . .\n```\n\n或者\n```\njava --class-path=/home/user/classdir . . .\n```\n\n当需要传递到另一个工具时，等形式有用，因为传递机制无法处理空格。你可以使用\
  \ `JDK_JAVA_OPTIONS` 环境变量将命令行选项传递给 `java` 启动器：\n\n```bash\nexport JDK_JAVA_OPTIONS='--class-path\
  \ /home/user/classdir -enableassertions'\n```\n\n根据 JEP 293，没有参数的单字母选项可以组合在一起：\n\
  \n```\njar -c -v -f myapp.jar -m MANIFEST.MF *.class\n```\n\n可以简化为\n\n```\njar -cv\
  \ -f myapp.jar -m MANIFEST.MF *.class\n```\n\n但目前这不起作用。奇怪的是，\n\n```\njar -cvfm myapp.jar\
  \ MANIFEST.MF *.class\n```\n\n可以工作，尽管它不应该可以。在问题解决之前，最好对 `jar` 命令坚持经典的 `tar` 风格选项。\n\
  \n\n\n\n后者目前尚无法工作。这似乎也不是一个好主意，因为它会导致与旧选项产生冲突。例如，如果输出目录恰好命名为 `eprecation`，会发生什么？\n\
  \n## 文档注释\n\nJDK 包含一个名为 `javadoc` 的有用工具，它可以从源文件生成 HTML 文档。事实上，第 3 章 中描述的在线 API 文档仅仅是在标准\
  \ Java 库源码上运行 `javadoc` 的结果。\n\n如果你在源代码中添加以特殊分隔符 `/**` 开头的注释，你也可以轻松地生成看起来很专业的文档。这是一个非常好的方法，因为它让你将代码和文档保持在同一个地方。如果你将文档放在单独的文件中，那么正如你可能知道的那样，代码和注释会随着时间的推移而产生差异。当文档注释与源代码位于同一个文件中时，更新两者并再次运行\
  \ `javadoc` 就是轻而易举。\n\n## 注释插入\n\n`javadoc` 实用提取提取项目的信息：\n\n* 模块 (Modules)\n* 包\
  \ (Packages)\n* 公有类和接口\n* 公有和受保护字段\n* 公有和受保护的构造函数和方法\n\n受保护成员在 第 5 章 中介绍，接口在 第 6\
  \ 章 中，模块在 第 12 章 中。\n\n你可以（也应该）为这些每个成员提供注释。每个注释都放置在其描述的成员的正上方。注释以 `/**` 开头，以 `*/`\
  \ 结束。\n\n每个 `/** . . . */` 文档注释包含一段自由格式文本，随后是标签。标签以 `@` 开头，例如 `@since` 或 `@param`。\n\
  \n自由格式文本的第一句应该是一个摘要语句。`javadoc` 实用程序会自动生成提取这些句子的摘要页。\n\n最最常见的 `javadoc` 标签是块级标签（block\
  \ tags）。它们必须出现在行开头，并以 `@` 开头，前面可选地带有空格、注释分隔符 `/**` 或通常用于多行注释的起始符 `*`。相比之下，内联标签（inline\
  \ tags）被包含在大括号中：`{@tagnamecontents}`。内容可能包含括号，但它们必须成对。例如 `@code` 和 `@link` 标签。\n\
  \n## 类注释\n\n类注释必须放置在任何 `import` 语句之后，直接位于 `class` 定义之前。\n\n这里是一个类注释的示例：\n\n```\n\
  /**\n * 一个 {@code Card} 对象代表一张扑牌，例如\n * “红心皇后”。扑牌有一个花色（方片、红心、\n * 桃梅或梅花）和一个值（1 =\
  \ A，2 . . . 10, 11 = J，\n * 12 = Q, 13 = K）。\n */\npublic class Card\n{\n   . .\
  \ .\n}\n```\n\n没在在每行前面添加 `*`。例如，以下注释同样有效：\n\n```\n/**\n   一个 <code>Card</code> 对象代表一张扑牌，例如\n\
  \   如“红心皇后”。扑牌有一个花色（方片、红心、\n   桃梅或梅花）和一个值（1 = A，2 . . . 10, 11 = J，\n   12 = Q,\
  \ 13 = K）。\n*/\n```\n\n```，大多数 IDE 会自动提供星号，并在换行时对其重新排列。\n\n## 方法注释\n\n每个方法注释必须紧接在其所描述的方法之前。除了通用标签外，你还可以使用以下标签：\n\
  \n* `@param` 变量描述：此标签在当前方法的“参数”部分添加一个条目。描述可以跨多行并使用 HTML 标签。一个方法的所有 `@param` 标签必须保持在一起。\n\
  * `@return` 描述：此标签为方法添加一个“返回”部分。描述可以跨多行并使用 HTML 标签。\n* `@throws` 类描述：此标签添加一条说明，说明该方法可能会抛出异常。（参见\
  \ 第 7 章）。\n\n这里是一个方法注释的示例：\n\n```\n/**\n * 增加员工的工资。\n * @param byPercent 增加工资的百分比（例如\
  \ 10%）\n * @return 增加的金额\n */\npublic double raiseSalary(double byPercent)\n{\n\
  \   double raise = salary * byPercent / 100;\n   salary += raise;\n   return raise;\n\
  }\n```\n\n为描述和返回值相同的方法编写注释可能是枯燥的，例如：\n\n```java\n/**\n * 返回员工的名字。\n * @return 员工的名字\n\
  \ */\n```\n\n在这种情况下，请考虑 Java 中引入的 `@return` 内联形式：\n\n```java\n/**\n * {@return the\
  \ name of the employee} */\n```\n\n描述部分变为“返回员工的名字。”，并添加一个具有相同内容的“返回”部分。\n\n## 字段注释\n\
  \n你只需要记录公有字段——通常意味着静态常量。例如：\n\n```java\n/**\n * “红心”花色\n */\npublic static final\
  \ HEARTS = 1;\n```\n\n## 包注释\n\n将类、方法和变量注释直接放入 Java 源文件中，并用 `/** . . . */` 文档注释隔开。然而，为了生成包注释，你需要在每个目录中添加一个单独的文件。你有两个选择：\n\
  \n1. 提供一个名为 `package-info.java` 的 Java 文件。该文件必须包含一个初始文档注释，用 `/**` 和 `*/` 分隔，后面紧跟一个\
  \ `package` 语句。\n2. 提供一个名为 `package.html` 的 HTML 文件。所有标签之间的文本将被提取。\n\n## HTML 标记\n\
  \n在自由格式文本中，你可以使用 HTML 修饰符，如 `<em>...</em>` 用于强调，`<strong>...</strong>` 用于强强调，`<ul>/<li>`\
  \ 用于项目符号列表，以及 `<img .../>` 包含图像。\n\n要输入等宽字体，使用 `{@code ...}` 代替 `<code>...</code>`——这样就不需要担心\
  \ `<>` 和 `&` 了。如果你想在普通字体中使用未转义的 `<` 或 `&`，请使用 `@literal{...}` 标签。\n\n对于 `pre` 标签的多行代码显示，你可以使用：\n\
  \n```\n/**\n * ...\n * <pre>{@code\n *   ...\n *   ...\n * }</pre>\n */\n```\n\n\
  或者，由于 Java：\n\n```\n/**\n * ...\n * {@code { ... }}\n * */\n```\n\n无论哪种方式，你都不需要在代码中转义\
  \ `<` 或 `&`。然而，括号必须匹配，且你不能使用 `/* ... */` 注释。\n\n## 链接\n\n你可以使用 `@see` 和 `@link`\
  \ 标签链接到 `javadoc` 文档的其他相关部分，或者链接到外部文档。\n\n`@see reference` 标签在“参见”部分添加一个超链接。它可以同时用于类和方法。在这里，`reference`\
  \ 可以是以下之一：\n\n```\npackage.class#member label\n<a href=\"...\">label</a>\n\"text\"\
  \n```\n\n第一种情况是最用的。你提供类、方法或变量的名称，`javadoc` 会插入指向该文档的超链接。例如，\n\n```\n@see com.horstmann.corejava.Employee#raiseSalary(double)\n\
  ```\n\n指向 `com.horstmann.corejava.Employee` 类中的 `raiseSalary(double)` 方法。你可以省略包名，或省略包和类名。这时成员将位于当前包或类中。\n\
  \n注意，你必须使用 `#` 而不是点来分隔类和方法。Java 编译器本身非常擅长确定点作为包、子包、类、内部类以及方法和变量之间分隔符的各种含义。但 `javadoc`\
  \ 工具没有那么聪明，所以你必须帮助它。\n\n构造函数的特殊名称是 `<init>`，而不是类名，例如：\n\n```\n@see com.horstmann.corejava.Employee#<init>()\n\
  ```\n\n你可以在成员后面指定一个可选的 `label`，作为链接锚点。如果你省略了标签，用户将看到成员名称。\n\n\n\n\n\n如果 `@see` 标签后面跟着一个\
  \ `<` 字符，则你需要指定一个超链接。你可以链接到任何喜欢的 URL。例如：\n\n```\n@see <a href=\"horstmann.com/corejava.html\"\
  >The Core Java 主页</a>\n```\n\n如果 `@see` 标签后面跟着一个 `\"` 字符，则文本将显示在“另见”（see also）部分。例如：\n\
  \n```\n@see \"Core Java Volume 2\"\n```\n\n你可以为一个成员添加多个 `@see` 标签，但你必须将它们保持在一起。\n\
  \n如果你愿意，可以在文档注释的任何地方放置指向其他类或方法的超链接。在注释中的任何位置插入格式如下的标签：\n\n```\n{@link package.class#member}\n\
  ```\n\n成员引用遵循与 `@see` 标签相同的规则。\n\n从 Java 20 开始，2 级和 3 级标题会自动生成 id。例如，\n\n```\n<h2>General\
  \ Principles</h2>\n```\n\n会获得一个 id 为 `general-principles-heading`，你可以通过 `@see` 和\
  \ `@link` 标签引用它。你需要两个 `#` 符号来链接到 id：\n\n```\n{@link com.horstmann.corejava.Employee##general-principles-heading}\n\
  ```\n\n如果链接应该以普通字体而非等宽字体显示，请使用 `@linkplain` 代替 `@link`。\n\n如果你的注释包含指向其他文件的链接（例如图像，如图表或用户界面组件图像），请将这些文件放在包含源文件目录的名为\
  \ `doc-files` 的子目录下。`javadoc` 工具会将 `doc-files` 目录及其内容从源目录复制到文档目录。你需要在链接中使用 `doc-files`\
  \ 目录，例如 `<img src=\"doc-files/uml.png\" alt=\"UML 图\"/>`。\n\n## 通用注释\n\n`@since`\
  \ `text` 标签会创建一个“自”（since）条目。`text` 可以是引入此功能的版本的任何描述。例如，`@since 1.7.1`。\n\n以下标签可以用于类文档注释中：\n\
  \n- `@author` `name`\n    此标签会创建一个“作者”（author）条目。你可以有多个 `@author` 标签，每个对应一个作者。不必强迫使用此标签——你的版本控制系统在跟踪作者身份方面做得得更彻底。\n\
  \n- `@version` `text`\n    此标签会创建一个“版本”（version）条目。`text` 可以是当前版本的任何描述。\n\n`{@value`\
  \ `optionalFormat`constantFieldReference}` 内联标签会插入常量字段的值，从 Java 20 开始，带有一个可选的 `printf`\
  \ 风格格式化程序。例如，`{@value %X Integer#MAX_VALUE}` 产生 7FFFFFFF。\n\n`@deprecated` 标签与 `@Deprecated`\
  \ 注解一起使用。它后面跟着文本，告诉用户何时以及为何发生了弃用，并描述替代方案。\n\n最后，你可以使用 `{@index` `entry`}` 标签向生成的索引中添加条目。\n\
  \n## 代码片段\n\n此特目的目的是允许你从外部文件导入（假设是经过良好测试且足够新的）代码。这最大限度地减少了文档错误或过时的风险。代码片段在 Java\
  \ 18 中被引入。\n\n你可以使用这些标签导入整个文件：\n\n```\n{@snippet file=EmployeeTest.java}\n{@snippet\
  \ class=com.horstmann.corejava.EmployeeTest.java}\n```\n\n文件应该存放在当前包的 `snippet-files`\
  \ 子目录下。\n\n更常见的情况下，你想从一个文件中复制一个区域。在源文件中，你如下所示指定区域的名称和范围：\n\n```\npublic class EmployeeTest\n\
  {\n   . . .\n   // @start region=default-employee\n   var e = new Employee();\n\
  \   String name = e.getName(); // name is null\n   // @end \n   . . .\n}\n```\n\n\
  要高亮片段的一部分，请使用注释：\n\n```\nvar e = new Employee(); // @hightlight substring=new\n\
  String name = e.getName(); // @highlight regex=get[A-Z][a-z]+\n```\n\n在区域内部，你可以用另一个字符串替换部分内容，例如让文档更具通用性：\n\
  \n```\nvar e = new Employee(\"Fred\", 100000); // @replace regex=([^)]+) replacement=\"\
  (..., ...)\"\n```\n\n然后文档包含：\n\n```\nvar e = new Employee(..., ...);\n```\n\n要添加链接，请使用：\n\
  \n```\nvar e = new Employee(); // @link substring=Employee target=com.horstmann.corejava.Employee.<init>()\n\
  ```\n\n这些装饰和转换是以注释形式指定的，以便你的源文件可以编译并运行。\n\n## 注释提取\n\n在这里，`docDirectory` 是你希望 HTML\
  \ 文件存放的目录名称。按照以下步骤操作：\n\n1. 切换到包含你想文档的源文件的目录。如果你有嵌套包需要文档（例如 `com.horstmann.corejava`），你必须在包含\
  \ `com` 子目录的目录中工作（如果你提供了 `overview.html` 文件，这就是包含该文件的目录）。\n\n2. 运行命令\n\n```\njavadoc\
  \ -d docDirectory nameOfPackage\n```\n\n针对单个包。或者，运行\n\n```\njavadoc -d docDirectory\
  \ nameOfPackage1 nameOfPackage2\n```\n\n来文档多个包。如果你省略了 `-d` `docDirectory` 选项，HTML\
  \ 文件将提取到当前目录。这可能会导致变得很混乱，我不建议这样做。\n\n`javadoc` 程序可以通过许多命令行选项进行精细调整。例如，你可以使用 `@author`\
  \ 和 `@version` 标签来包含文档。标准库类会自动链接到 Oracle 网站。如果你使用 `-link` 选项，运行\n\n```\njavadoc\
  \ -link https://docs.oracle.com/en/java/21/api *.java\n```\n\n你也可以为所有源文件提供一个概述注释。将其放在诸如\
  \ `overview.html` 的文件中，并使用 `-overview` `filename` 运行 `javadoc` 工具。标签 `<body>` 之间的所有文本会被提取。当用户从导航栏选择“概述”（Overview）时，将显示内容。\n\
  \n有关其他选项，请参考 `javadoc` 工具的在线文档：https://docs.oracle.com/en/java/21/javadoc/index.html。\n\
  \n## 类设计提示\n\n在不尝试面面求到或冗长的情况下，我想用一些提示结束本章，这些提示将使你的类在良好的 OOP 圈中更易接受。\n\n1. *始终保持数据私有。*\n\
  \    这是首要的；任何其他操作都违反了封装。你可能偶尔需要编写访问器（accessor）或修改器（mutator），但保持实例字段私有仍然更好。痛苦的经验表明数据表示可能会改变，但使用这些数据的方式频率较低。当数据保持私有时，表示的变化不会影响类的用户，而且更容易检测错误。\n\
  \n2. *始终初始化数据。*\n    Java 不会为你初始化局部变量，但它会初始化对象的实例字段。不要依赖默认值，而是显式地初始化所有变量，可以通过在所有构造函数设置设置值。\n\
  \n3. *不要在类中使用过多的基本类型。*\n    该思想是将多个相关的基本类型替换为其他类。这使得你的类更容易被理解和更改。例如，在 `Customer`\
  \ 类中替换以下实例字段：\n\n    ```\n    private String street;\n    private String city;\n\
  \    private String state;\n    private int zip;\n    ```\n\n    替换为一个名为 `Address`\
  \ 的新类。这样，你就可以轻松应对地址的变化，例如处理国际地址的需求。\n\n\n\n\n\n## 4. 并不是所有字段都需要单独的访问器方法和变器器。\n\n\
  你可能需要获取和设置员工的工资。但一旦对象构造完成，你显然不需要更改入职日期。而且，对象通常拥有一些你不希望让其他人获取或设置的实例字段，例如 `Address`\
  \ 类中存储州缩写字的数组。\n\n## 5. 拆分职责过多的类。\n\n这个提示 get 然是模糊的：“太多”显然是人人而异的。然而，如果有一种明显的方法可以将一个复杂的类拆分成两个在概念上更简洁的类，那么请抓住这个机会。（另一方面，不要做得过头；十个每个都只有一个方法的类通常是设计过度了。）\n\
  \n这里有一个糟糕设计的示例：\n\n```\npublic class CardDeck // 糟糕的设计\n{\n   private int[] value;\n\
  \   private int[] suit;\n\n   public CardDeck() { . . . }\n   public void shuffle()\
  \ { . . . }\n   public int getTopValue() { . . . }\n   public int getTopSuit() {\
  \ . . . }\n   public void draw() { . . . }\n}\n```\n\n这个类实际上实现了两个独立的概念：一个牌牌组，拥有\
  \ `shuffle` 和 `draw` 方法；以及一张牌，拥有检查其点数和花色的方法。引入一个代表单张牌的 `Card` 类是有意义的。现在你有了两个类，每个类都有自己的职责。由于\
  \ `Card` 类非常简单，可以将其实现为 `record`。此外，与其使用整数值表示花色，不如使用枚举是更好的选择：\n\n```\npublic class\
  \ CardDeck\n{\n   private Card[] cards;\n\n   public CardDeck() { . . . }\n   public\
  \ void shuffle() { . . . }\n   public Card getTop() { . . . }\n   public void draw()\
  \ { . . . }\n}\n\npublic enum Suit { DIAMONDS, HEARTS, SPADES, CLUBS }\n\npublic\
  \ record Card(int value, Suit suit) {}\n```\n\n## 6. 让类和方法的名称反映它们的职责。\n\n正如变量也应该具有反映其代表含义的有意义名称一样，类也是如此。（标准库确实包含一些令人疑的例子，例如描述时间的\
  \ `Date` 类。）\n\n一个良好的约定是，类名应该是名词（`Order`），或者是由形容词修饰的名词（`RushOrder`）或动名词（如 `BillingAddress`\
  \ 中的后缀形式）。对于方法，遵循标准约定：访问方法以小写的 `get` 开头（`getSalary`），变器方法使用小写的 `set`（`setSalary`）。\n\
  \n## 7. 优先使用不可变类。\n\n`LocalDate` 类以及 `java.time` 包中的其他类都是不可变的——没有方法可以修改对象的状态。与其变异对象，诸如\
  \ `plusDays` 等方法会返回一个带有修改状态的新对象。\n\n变异的问题在于，当多个线程尝试同时更新一个对象时，变异可能会并发发生。结果是不可预测的。当类是不可变的时，在多个线程之间共享它们的对象是安全的。\n\
  \n因此，如果可能，将类设为不可变是一个好主意。对于表示值的类（如字符串或时间点），这尤为容易。计算可以简单地产生新值而不是更新现有值。\n\n当然，并不是所有类都应该是不可变的。当员工获得加薪时，让\
  \ `raiseSalary` 方法返回一个新的 `Employee` 对象会很奇怪。\n\n在本章中，我们涵盖了使 Java 成为“基于对象的”语言的对象和类的基础。为了真正实现面向对象，编程语言还支持继承和多态。Java\
  \ 对这些特的支持是下一章的主题。\n\n# 继承\n\n第四章 介绍了类和对象。在本章中，你将学习继承，这是面向对象编程的另一个基本概念。继承背后的思想是你可以创建一个构建在现有类的新类。当你继承一个现有类时，你会重用（或继承）它的方法，并可以添加新的方法和字段以使新类适应新情况。这种技术在\
  \ Java 编程中至关重要。\n\n本章还涵盖了反射，即在运行程序中发现更多类及其属性的能力。反射是一个强大的特性，但不可否认的是复杂的。由于反射对工具开发者的兴趣大于应用程序程序员，你可能可以在第一次阅读时略过该章的这部分，以后再回来。\n\
  \n## 类、超类和子类\n\n让我们回到上一章讨论的 `Employee` 类。假设（不幸的是）你在一家公司工作，经理的对待方式与其他员工不同。当然，在很多方面，经理和员工是一样的。员工和经理都领取工资。然而，员工被期望完成分配的任务以换取工资，而经理如果他们实现了他们应该做的工作，就能获得奖金。这种情况非常需要继承。为什么呢？嗯，你需要定义一个新类\
  \ `Manager` 并添加功能。但你可以保留一些已经在 `Employee` 类中编写的内容，并且原始类的所有字段都可以被保留。更抽象地说，`Manager`\
  \ 和 `Employee` 之间存在明显的“是”（is–a）关系。每个经理都是员工：这种“是”的关系是继承的标志。\n\n### 定义子类\n\n以下是如何定义继承自\
  \ `Employee` 类的 `Manager` 类。使用 Java 关键字 `extends` 来表示继承。\n\n```\npublic class Manager\
  \ extends Employee\n{\n   添加的方法和字段\n}\n```\n\n继承在 Java 和 C++ 中是相似的。Java 使用 `extends`\
  \ 关键字而不是 `:` 符号。Java 中的所有继承都是公共继承；没有类似于 C++ 中私有继承和受保护继承的特性。\n\n`extends` 关键字表示你正在创建一个派生自现有类的新类。现有类被称为超类（superclass）、基类（base\
  \ class）或父类（parent class）。新类被称为子类（subclass）、派生类（derived class）或子类（child class）。超类和子类这两个术语是\
  \ Java 程序员最常用的，尽管一些程序员倾向于使用父子类类比，这与“继承”主题也结合得很好。\n\n`Employee` 类是一个超类，但并不是因为它优于它的子类或包含更多功能。事实上，情况相反：子类比它们的超类具有更多功能。例如，正如我们在查看\
  \ `Manager` 类的其余代码时将看到的，`Manager` 类封装了更多数据，并且比它的超类 `Employee` 有更多功能。\n\n*super*\
  \ 和 *sub* 前缀源于理论计算机科学和数学中集合语言。所有员工的集合包含了所有经理的集合，因此被认为是经理集合的超集。或者换句话说，所有经理的集合是所有员工集合的子集。\n\
  \n我们的 `Manager` 类有一个新字段来存储奖金，还有一个新方法来设置它：\n\n```\npublic class Manager extends Employee\n\
  {\n   private double bonus;\n   . . .\n   public void setBonus(double bonus)\n \
  \  {\n      this.bonus = bonus;\n   }\n}\n```\n\n\n\n\n\n这些方法和领域并没有特别之处。如果你有一个 `Manager`\
  \ 对象，可以简单地应用 `setBonus` 方法。\n\n```\nManager boss = . . .;\nboss.setBonus(5000);\n\
  ```\n\n当然，如果你有一个 `Employee` 对象，你 own 无法应用 `setBonus` 方法——它没有在 `Employee` 类定义的方法列表中。\n\
  \n然而，你*可以*对 `Manager` 对象使用诸如 `getName` 和 `getHireDay` 等方法。尽管这些方法没有在 `Manager` 类中被显式定义，但它们自动继承自\
  \ `Employee` 超类。\n\n每个 `Manager` 对象都有四个字段：`name`、`salary`、`hireDay` 和 `bonus`。字段\
  \ `name`、`salary` 和 `hireDay` 是取自超类的。\n\nJava 语言规范规定：“类中被声明为私有（private）的成员不会被该类的子类所继承。”多年来，这一规定一直困扰着我的读者。规范对“继承”一词的定义非常狭隘。它认为私有字段是不可继承的，因为\
  \ `Manager` 类无法直接访问它们。因此，每个 `Manager` 对象拥有三个来自超类的字段，但 `Manager` 类并没有“继承”它们。\n\n\
  在通过扩展超类来定义子类时，你只需要指示子类与超类之间的*差异*。在设计类时，你将最通用的方法放在超类中，将更专门的方法放在其子类中。通过将通用功能移动到超类来提取出来是面向对象编程中的惯常工作。\n\
  \n在第 4 章中，你学习了*记录（records）*：状态完全由构造器参数定义的类。你不能扩展记录，记录也不能扩展其他类。\n\n### 方法重写（Overriding\
  \ Methods）\n\n超类的一些方法并不适用于 `Manager` 子类。特别是，`getSalary` 方法应该返回基本工资和奖金的总和。你需要提供一个新方法来*重写*超类方法：\n\
  \n```\npublic class Manager extends Employee\n{\n   . . .\n   public double getSalary()\n\
  \   {\n      . . .\n   }\n   . . .\n}\n```\n\n如何实现这个方法？乍一看，这似乎很简单——只需返回 `salary`\
  \ 和 `bonus` 字段之和即可：\n\n```\npublic double getSalary()\n{\n   return salary + bonus;\
  \ // 行不通\n}\n```\n\n然而，这样做是不通的。记住，只有 `Employee` 方法可以直接访问 `Employee` 类的私有字段。这意味着\
  \ `Manager` 类的 `getSalary` 方法无法直接访问 `salary` 字段。如果 `Manager` 方法想要访问那些私有字段，它们必须像其他方法那样——使用公共接口，在这种情况下使用\
  \ `Employee` 类的公共 `getSalary` 方法。\n\n所以，让我们再次尝试。你需要调用 `getSalary` 而不是简单访问 `salary`\
  \ 字段：\n\n```\npublic double getSalary()\n{\n   double baseSalary = getSalary();\
  \ // 仍然行不通\n   return baseSalary + bonus;\n}\n```\n\n现在，问题在于对 `getSalary` 的调用仅仅调用了*它自己*，因为\
  \ `Manager` 类有一个 `getSalary` 方法（即我们试图实现的方法）。结果是对同一个方法的无限调用链，导致程序崩溃。\n\n我们需要指示想要调用\
  \ `Employee` 超类的 `getSalary` 方法，而不是当前类的方法。使用特殊关键字 `super` 来实现此目的。调用\n\n```\nsuper.getSalary()\n\
  ```\n\n调用的是 `Employee` 类的 `getSalary` 方法。这里是 `Manager` 类 `getSalary` 方法的正确版本：\n\n\
  ```\npublic double getSalary()\n{\n   double baseSalary = super.getSalary();\n \
  \  return baseSalary + bonus;\n}\n```\n\n有些人人认为 `super` 类似于 `this` 引用。然而，这种类比并不完全准确：`super`\
  \ 不是指向对象的引用。例如，你不能将值 `super` 赋值另一个对象变量。相反，`super` 是一个特殊的关键字，它指示编译器调用超类方法。\n\n正如你所见，子类可以*添加*字段，可以*添加*方法或*重写*超类的方法。然而，继承永远不会夺走任何字段或方法。\n\
  \nJava 使用关键字 `super` 来调用超类方法。在 C++ 中，你会使用超类的名称配合 `::` 运算符。例如，`Manager` 类的 `getSalary`\
  \ 方法将调用 `Employee::getSalary` 而不是 `super.getSalary`。\n\n### 子类构造函数（Subclass Constructors）\n\
  \n为了完成我们的示例，让我们提供一个构造函数。\n\n```\npublic Manager(String name, double salary, int\
  \ year, int month, int day)\n{\n   super(name, salary, year, month, day);\n   bonus\
  \ = 0;\n}\n```\n\n在这里，关键字 `super` 有不同的含义。指令\n\n```\nsuper(name, salary, year, month,\
  \ day);\n```\n\n是“调用 `Employee` 超类的构造函数，并将 `name`、`salary`、`year`、`month` 和 `day`\
  \ 作为参数”的简写。\n\n由于 `Manager` 构造函数无法访问 `Employee` 类的私有字段，它必须通过构造函数初始化它们。构造函数通过特殊的\
  \ `super` 语法被调用。使用 `super` 的调用必须是第一个语句。使用 `super` 的调用必须是第一个语句。使用 `super` 的调用必须是第一个语句。使用\
