  \ map 的视图，其键按逆序排列。\n\n## 算法\n\n除了实现集合类外，Java 集合框架还提供了许多实用的算法。在以下章节中，你将看到如何使用这些算法，以及如何编写与框架良好良好的算法。\n\
  \n### 为什么使用泛型算法？\n\n泛型集合接口有一个巨大的优势——你只需要实现一次算法。例如，考虑一个计算集合中最大元素的简单算法。传统上，程序员会用循环来实现这种算法。这里是找到数组中最大元素的方法：\n\
  \n```\nif (a.length == 0) throw new NoSuchElementException();\nT largest = a[0];\n\
  for (int i = 1; i < a.length; i++)\n   if (largest.compareTo(a[i]) < 0)\n      largest\
  \ = a[i];\n```\n\n当然，要找到列表的最大值，你编写的代码会略有不同。\n\n```\nif (v.size() == 0) throw new\
  \ NoSuchElementException();\nT largest = v.get(0);\nfor (int i = 1; i < v.size();\
  \ i++)\n   if (largest.compareTo(v.get(i)) < 0)\n      largest = v.get(i);\n```\n\
  \n链表表呢？在链表中无法进行高效的随机访问，但你可以可以使用迭代器。\n\n\n\n\n\n```java\nif (l.isEmpty()) throw new\
  \ NoSuchElementException();\nIterator<T> iter = l.iterator();\nT largest = iter.next();\n\
  while (iter.hasNext())\n{\n   T next = iter.next();\n   if (largest.compareTo(next)\
  \ < 0)\n      largest = next;\n}\n```\n\n这些循环编写起来非常繁琐，而且很容易出错。是否存在差一错误（off-by-one\
  \ error）？循环对于空容器是否工作正常？对于只包含元素的容器又如何？你不希望每次都对这段代码进行测试和调试，但你也不想实现一大堆方法，例如这些：\n\n\
  ```java\nstatic <T extends Comparable> T max(ArrayList<T> v)\nstatic <T extends\
  \ Comparable> T max(LinkedList<T> l)\n```\n\n这正是集合接口（collection interfaces）大显用场的地方。考虑高效执行算法而所需的*最小*集合接口。使用\
  \ `get` 和 `set` 进行随机访问，在食物链中的地位高于简单的迭代。正如你在计算链表中的最大元素时所看到的，这项任务不需要随机访问。只需通过遍历元素即可计算出最大值。因此，你可以实现\
  \ `max` 方法，使其接收*任何*实现了 `Collection` 接口的对象。\n\n```java\npublic static <T extends\
  \ Comparable> T max(Collection<T> elements)\n{\n   if (elements.isEmpty()) throw\
  \ new NoSuchElementException();\n   Iterator<T> iter = elements.iterator();\n  \
  \ T largest = iter.next();\n   while (iter.hasNext())\n   {\n      T next = iter.next();\n\
  \      if (largest.compareTo(next) < 0)\n         largest = next;\n   }\n   return\
  \ largest;\n}\n```\n\n当然，由于数组不是集合，你仍然为数组编写一个单独的方法：\n\n```java\nstatic <T extends\
  \ Comparable> T max(T[] a)\n```\n\n泛型算法是一个强大的概念。事实上，标准 C++ 拥有几十种实用的算法，每种算法都作用于泛型集合。Java\
  \ 集合框架并没有那么丰富，但 `Collections` 和 `Arrays` 类提供了基础功能：排序、二分查找以及一些简单的实用算法。\n\nJava 集合框架缺少一些实用的算法，但你可以在第二卷涵盖的流\
  \ 库中找到它们。例如，要找到最大值或最小值，可以将集合或数组转换为流：\n\n```java\nlargest = coll.stream().max(Comparator.naturalOrder()).get();\n\
  ```\n\n### 排序与洗牌\n\n计算机领域的老兵们有时会回忆起他们过去如何使用打孔片，并实际手工编写排序算法。当然，现在排序算法已经是大多数编程语言标准库的一部分，Java\
  \ 编程语言也不例外。\n\n`Collections` 类中的 `sort` 方法对实现 `List` 接口的集合进行排序。\n\n```java\nvar\
  \ staff = new ArrayList<String>();\nfill collection\nCollections.sort(staff);\n\
  ```\n\n该方法假设列表元素实现了 `Comparable` 接口。如果你想以其他方式排序列表，可以使用 `List` 接口的 `sort` 方法并传递一个\
  \ `Comparator` 对象。以下是如何按姓名对员工列表进行排序：\n\n```java\nvar staff = new ArrayList<String>();\n\
  fill collection\nCollections.sort(staff);\n```\n\n如果你想按降序排序列表，可以使用 `List` 接口的 `sort`\
  \ 方法并传递一个 `Comparator` 对象。以下是如何按薪水对员工列表进行排序：\n\n```java\nvar staff = new ArrayList<String>();\n\
  fill collection\nCollections.sort(staff);\n```\n\n\n\n\n\n`java.util.Comparator<T>`\
  \ 1.2\n\n*   `static <T extends Comparable<? super T>> Comparator<T> reverseOrder()`\
  \ 8\n    返回一个反转 `Comparable` 接口提供的排序的比较器。\n\n*   `default Comparator<T> reversed()`\
  \ 8\n    返回一个反转此比较器提供的排序的比较器。\n\n### 二分查找\n\n为了在数组中找到一个对象，你通常需要遍历所有元素直到找到匹配项为止。然而，如果数组是有序的，你可以查看中间元素，并检查它是否大于你试图查找的元素。如果是，继续在数组的前半部分查找；否则，在后半部分查找。这使得问题规模减半，你以相同的方式继续下去。例如，如果数组有\
  \ 1024 个元素，你将在 10 步后定位匹配项（或确认不存在），而线性搜索在元素存在时平均需要 512 步，不存在则需要 1024 步来确认其不存在。\n\n\
  `Collections` 类的 `binarySearch` 方法实现了这种算法。请注意，集合必须已经是排序的，否则算法将返回错误答案。提供该集合（必须实现\
  \ `List` 接口）和要查找的目标。如果集合不是通过 `Comparable` 接口的 `compareTo` 元素排序的，请提供一个比较器对象。\n\n\
  ```\ni = Collections.binarySearch(elements, target);\ni = Collections.binarySearch(elements,\
  \ target, comparator);\n```\n\n`binarySearch` 方法的非负返回值表示匹配对象的索引。也就是说，在比较顺序下，`elements.get(i)`\
  \ 等于 `target`。如果值为负，则没有匹配的元素。然而，你可以使用返回值来计算*应该*将 `target` 插入集合的位置，以保持其排序。插入位置为：\n\
  \n```\ninsertionPoint = -i - 1;\n```\n\n这不仅仅仅仅是 `-i`，因为那样值 `0` 将产生歧义。换句话说，该操作：\n\
  \n```\nif (i < 0)\n   elements.add(-i - 1, target);\n```\n\n将目标添加到正确的位置。\n\n为了变得有意义，二分查找需要随机访问。如果你必须逐个迭代链表的一半部分来寻找中间元素，你就失去了二分查找的优势。如果你给出一个没有实现\
  \ `RandomAccess` 接口的列表，`binarySearch` 算法将退化为与线性搜索效率相同的迭代算法。\n\n`Arrays` 类拥有基本类型数组和对象数组的二分查找实现。\n\
  \n`java.util.Collections` 1.2\n\n*   `static <T extends Comparable<? super T>> int\
  \ binarySearch(List<T> elements, T key)`\n*   `static <T> int binarySearch(List<T>\
  \ elements, T key, Comparator<? super T> c)`\n    在排序的列表中查找 key，如果元素类型实现了 `RandomAccess`\
  \ 接口，则使用二分查找，在所有其他情况下使用线性查找。这些方法保证在 O(`a`(`n`) log `n`) 时间内运行，其中 `n` 是列表的长度，`a`(`n`)\
  \ 是访问一个元素的平均时间。这些方法返回 key 在列表中的索引，或者如果 key 不在列表中则返回负值 `i`。在这种情况下，应该将 key 插入到索引 `-i\
  \ - 1` 处以保持列表排序。\n\n`java.util.Arrays` 1.2\n\n*   `static int binarySearch(T[] a,\
  \ T key)`\n*   `static int binarySearch(T[] a, int start, int end, T key)` 6\n \
  \   使用二分查找算法在排序数组 `a` 中查找 key。如果找到 key，则返回其索引。否则，返回负值 `r`；–`r` – 1 是 `key` 应该插入的位置以保持\
  \ `a` 排序。数组的组件类型 `T` 可以是 `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float`\
  \ 或 `double`。\n*   `static <T> T binarySearch(T[] a, T key, Comparator<? super T>\
  \ c)`\n*   `static <T> T binarySearch(T[] a, int start, int end, T key, Comparator<?\
  \ super T> c)` 6\n    使用二分查找算法在使用给定比较器排序的数组 `a` 中查找 key。\n\n### 简单算法\n\n`Collections`\
  \ 类包含了几个简单实用的算法。其中包括本节开示例——找到集合的最大值。其他的还包括从一个列表复制元素到另一个列表、用常量值填充容器以及反转列表。\n\n为什么要在框架中提供这些简单的算法呢？无疑大多数程序员都可以用简单的循环轻松地实现它们。我喜欢这些算法，是因为它们让*阅读*代码的程序员的生活变得更轻松。当你阅读一个由别人实现的循环时，你必须解读原始程序员的意图。例如，看这个循环：\n\
  \n```\nfor (int i = 0; i < words.size(); i++)\n   if (words.get(i).equals(\"C++\"\
  )) words.set(i, \"Java\");\n```\n\n现在将该循环与调用进行对比：\n\n```\nCollections.replaceAll(words,\
  \ \"C++\", \"Java\");\n```\n\n当你看到这个方法调用时，你立刻就知道代码在做什么了。`Collections` 类中描述了这些简单算法。\n\
  \n本节末尾的 API 说明描述了 `Collections` 类中的简单算法。默认方法 `Collection.removeIf` 和 `List.replaceAll`\
  \ 稍微复杂一些。提供一个 lambda 表达式来测试或转换元素。例如，这里我们删除所有短单词并将剩余的转换为小写：\n\n```\nwords.removeIf(w\
  \ -> w.length() <= 3);\nwords.replaceAll(String::toLowerCase);\n```\n\n`removeIf`\
  \ 的谓词应该只查看要删除的元素。如果你这样做，行为取决于实现。`ArrayList` 版本的 `removeIf` 方法对元素进行两次遍历。首先找到应该删除的元素，然后删除它们。对于其他集合，匹配元素就会删除。考虑这个例子，`words`\
  \ 是一个长度为 3 的 `ArrayList`：\n\n```\nvar words = new ArrayList(List.of(\"Ada\", \"\
  C++\", \"Java\"))\nwords.removeIf(w -> w.length() == 3); // 现在 words 为 [\"Java\"\
  ]\n```\n\n在第一次遍历中，所有长度为 3 的单词都被标记为删除，在第二次遍历中它们被删除。然而，如果 `words` 是 `LinkedList` 或\
  \ `HashSet`，相同的 `removeIf` 调用只会删除三个字母单词。\n\n为什么会有差异？朴素的一次遍历实现对于数组的集合来说效率低下。开发者们并没有立即想到高效的一次遍历算法。当他们考虑到它时，为了兼容性考虑，决定不使用它——参见\
  \ [`bugs.openjdk.org/browse/JDK-8143577`](https://bugs.openjdk.org/browse/JDK-8143577)。\n\
  \n`java.util.Collections` 1.2\n\n*   `static <T extends Comparable<? super T>> min(Collection<T>\
  \ elements)`\n*   `static <T extends Comparable<? super T>> max(Collection<T> elements)`\n\
  *   `static <T> min(Collection<T> elements, Comparator<? super T> c)`\n*   `static\
  \ <T> max(Collection<T> elements, Comparator<? super T> c)`\n    返回集合中的最小或最大元素（参数边界为了清晰起起简化）。\n\
  *   `static <T> void copy(List<? super T> to, List<T> from)`\n    将源列表的所有元素复制到目标列表相同的位置。目标列表必须至少与源列表一样长。\n\
  *   `static <T> void fill(List<? super T> l, T value)`\n    将列表的所有位置设置为相同的值。\n*\
  \   `static <T> boolean addAll(Collection<? super T> c, T... values)` 5.0\n    将所有值添加到给定的集合中，如果集合因之发生变化，则返回\
  \ `true`。\n*   `static <T> boolean replaceAll(List<T> l, T oldValue, T newValue)`\
  \ 1.4\n\n\n\n\n将所有等于 `oldValue` 的元素替换为 `newValue`。\n\n* `static int indexOfSubList(List<?>\
  \ l, List<?> s)` 1.4\n* `static int lastIndexOfSubList(List<?> l, List<?> s)` 1.4\n\
  \n  返回 `l` 中第一个或最后一个等于 `s` 的子列表索引；如果 `l` 中没有等于 `s` 的子列表，则返回 `-1`。例如，如果 `l` 为 `[s,\
  \ t, a, r]` 且 `s` 为 `[t, a, r]`，则两个方法都返回索引 `1`。\n\n* `static void swap(List<?> l,\
  \ int i, int j)`\n\n  交换给定偏移量处的元素。\n\n* `static void reverse(List<?> l)`\n\n  反转列表中元素的顺序。例如，反转列表\
  \ `[t, a, r]` 得到列表 `[r, a, t]`。该方法的运行时间复杂度为 O(`n`)，其中 `n` 是列表的长度。\n\n* `static void\
  \ rotate(List<?> l, int d)` 1.4\n\n  旋转列表中的元素，将索引为 `i` 的项移动到位置 `(i + d) % l.size()`。例如，将列表\
  \ `[t, a, r]` 旋转 `2` 位得到列表 `[a, r, t]`。该方法的运行时间复杂度为 O(`n`)，其中 `n` 是列表的长度。\n\n* `static\
  \ int frequency(Collection<?> c, Object o)` 5.0\n\n  返回 `c` 中等于对象 `o` 的元素计数。\n\n\
  * `boolean disjoint(Collection<?> c1, Collection<?> c2)` 5.0\n\n  如果两个集合没有共同元素，则返回\
  \ `true`。\n\n`java.util.Collection<T>` 1.2\n\n* `default boolean removeIf(Predicate<?\
  \ super E> filter)` 8\n\n  移除所有匹配的元素。\n\n`java.util.List<E>` 1.2\n\n* `default void\
  \ replaceAll(UnaryOperator<E> op)` 8\n\n  将该操作应用于此列表的所有元素。\n\n### 批量操作\n\n有几种操作可以“批量”复制或删除元素。调用以下方法：\n\
  \n```\ncoll1.removeAll(coll2);\n```\n\n从 `coll1` 中移除所有存在于 `coll2` 中的元素。相反，\n\n```\n\
  coll1.retainAll(coll2);\n```\n\n从 `coll1` 中移除所有`不在` `coll2` 中的元素。这是一个典型的应用。\n\n\
  假设你想找到两个集合的“交集”，即两个集合共有的元素。首先，创建一个新集合来存储结果。\n\n```\nvar result = new HashSet<String>(firstSet);\n\
  ```\n\n在这里，我们利用了每个集合都有构造函数，其参数是持有初始化值的集合。\n\n现在，使用 `retainAll` 方法：\n\n```\nresult.retainAll(secondSet);\n\
  ```\n\n它保留两个集合中都出现的所有元素。你在没有编写循环的情况下就形成了交集。\n\n你可以进一步扩展这个想法，并将批量操作应用于“视图（view）”。例如，假设你有一个将员工\
  \ ID 映射到员工对象的映射，并且你有一个所有待终止员工 ID 的集合。\n\n```\nMap<String, Employee> staffMap = .\
  \ . .;\nSet<String> terminatedIDs = . . .;\n```\n\n只需形成键集并移除所有已终止员工的 ID 即可。\n\n\
  ```\nstaffMap.keySet().removeAll(terminatedIDs);\n```\n\n由于键集是映射的视图，键和关联的员工姓名会自动从映射中移除。\n\
  \n通过使用子范围视图（subrange view），你可以将批量操作限制子列表和子集。例如，假设你想将列表的前十个元素添加到另一个容器中。创建一个子列表来选出前十个：\n\
  \n```\nrelocated.addAll(staff.subList(0, 10));\n```\n\n子范围也可以作为变动操作的目标。\n\n```\n\
  staff.subList(0, 10).clear();\n```\n\n### 集合与数组之间的转换\n\nJava API 的大部分内容是在 Java 集合框架创建之前设计的。因此，你可能需要在传统数组和更现代的集合之间进行转换。\n\
  \n如果你有一个需要转换为集合的数组，`List.of` 方法可以此之用。例如：\n\n```\nString[] names = . . .;\nList<String>\
  \ staff = List.of(names);\n```\n\n从集合中获取数组会稍微复杂一点。你可以使用 `toArray` 方法：\n\n```\nObject[]\
  \ names = staff.toArray();\n```\n\n但结果是一个 `Object` 数组。即使你知道集合包含特定类型的对象，你不能直接进行强制转换：\n\
  \n```\nString[] names = (String[]) staff.toArray(); // 错误\n```\n\n`toArray` 方法返回的数组是作为\
  \ `Object[]` 数组创建的，无法更改它的类型。相反，将数组构造函数表达式传递给 `toArray` 方法。该构造函数被用于创建正确类型的数组：\n\n\
  ```\nString[] values = staff.toArray(String[]::new);\n```\n\n在 JDK 11 之前，你必须使用另一种形式的\
  \ `toArray` 方法，传递正确类型的数组：\n\n```\nString[] values = staff.toArray(new String[0]);\n\
  ```\n\n### 编写你的算法\n\n如果你编写自己的算法（实际上，是任何以集合作为参数的方法），你应该针对`接口`进行工作，而不是具体的实现。例如，假设你想处理项目。当然，你可以实现这样一个方法：\n\
  \n```java\npublic void processItems(ArrayList<Item> items)\n{\n   for (Item item\
  \ : items)\n      对 item 执行某些操作\n}\n```\n\n\n\n\n旧集合（legacy collections）使用 `Enumeration`\
  \ 接口来遍历元素序列。`Enumeration` 接口有两个方法：`hasMoreElements` 和 `nextElement`。这些与 `Iterator`\
  \ 接口的 `hasNext` 和 `next` 方法完全对应。\n\n如果你在旧版类中发现此接口，可以使用 `Collections.list` 将元素收集到\
  \ `ArrayList` 中。例如，`LogManager` 类只愿意以 `Enumeration` 的形式公开记录器名称。以下是获取所有这些名称的方法：\n\
  \n```\nArrayList<String> loggerNames = Collections.list(LogManager.getLoggerNames());\n\
  ```\n\n或者，你可以将枚举转换为迭代器：\n\n```\nLogManager.getLoggerNames().asIterator().forEachRemaining(n\
  \ -> { . . . });\n```\n\n你偶尔会遇到带有 `Enumeration` 参数的旧版方法。静态方法 `Collections.enumeration`\
  \ 会产生一个枚举对象，该对象用于枚举集合中的元素。例如：\n\n```\nList<InputStream> streams = . . .;\nvar in\
  \ = new SequenceInputStream(Collections.enumeration(streams));\n// SequenceInputStream\
  \ 构造函数期望一个 enumeration\n```\n\n在 C++ 中，将迭代器作为参数是非常常见的。幸运的是，在 Java 平台上，很少有程序员使用这种写法。传递集合比传递迭代器要明智得多。集合对象更有用。接收者在需要时始终可以从集合中获取迭代器，而且他们可以使用所有的集合方法。然而，你可能会在某些旧代码中发现枚举，因为在\
  \ Java 1.2 的 Java 集合框架出现之前，它是通用集合的唯一可用机制。\n\n`java.util.Enumeration<E>` 1.0\n\n\
  *   `boolean hasMoreElements()`\n    如果还有更多待检查的元素，则返回 `true`。\n*   `E nextElement()`\n\
  \    返回下一个待检查的元素。如果 `hasMoreElements()` 返回 `false`，则不要调用此方法。\n*   `default Iterator<E>\
  \ asIterator()` 9\n    产生一个用于遍历已枚举元素的迭代器。\n\n`java.util.Collections` 1.2\n\n*  \
  \ `static <T> Enumeration<T> enumeration(Collection<T> c)`\n    返回一个枚举 `c` 中元素的枚举对象。\n\
  *   `public static <T> ArrayList<T> list(Enumeration<T> e)`\n    返回一个包含 `e` 所枚举元素的数组列表。\n\
  \n### 属性映射（Property Maps）\n\n*属性映射*（property map）是一种特殊类型的映射结构。它有三个特征：\n\n*   键和值都是字符串。\n\
  *   映射可以很容易地保存到文件并从文件中加载。\n*   有一个用于默认值的辅助表。\n\n实现属性映射的 Java 类被称为 `Properties`。属性映射对于指定程序的配置选项非常有用。例如：\n\
  \n```\nvar settings = new Properties();\nsettings.setProperty(\"width\", \"600.0\"\
  );\nsettings.setProperty(\"filename\", \"/home/cay/books/corejava/code/v1ch09/raven.html\"\
  );\n```\n\n使用 `getProperty` 方法查找键的值：\n\n```\nString filename = settings.getProperty(\"\
  filename\");\n```\n\n出于历史原因，`Properties` 类实现了 `Map<Object, Object>`。因此，你可以使用 `Map`\
  \ 接口的 `get` 和 `put` 方法。但 `get` 方法返回类型为 `Object`，而 `put` 方法允许你插入任何对象。最好坚持使用处理字符串而非对象的\
  \ `getProperty` 和 `setProperty` 方法。\n\n使用 `store` 方法将属性保存到文件中。第二个参数是包含在文件中的注释。\n\
  \n```\nvar out = new FileWriter(\"program.properties\");\nsettings.store(out, \"\
  Program Properties\");\n```\n\n示例集产生以下输出：\n\n```\n#Program Properties\n#Sun Dec\
  \ 31 12:54:19 PST 2023\ntop=227.0\nleft=1286.0\nwidth=423.0\nheight=547.0\nfilename=/home/cay/books/corejava/code/v1ch09/raven.html\n\
  ```\n\n要从文件加载属性，使用：\n\n```\nvar in = new FileReader(\"program.properties\");\nsettings.load(in);\n\
  ```\n\n如果你对输入/输出流使用 `load` 和 `store` 方法，则将使用过时的 ISO 8859-1 字符编码，且大于 U+00FF 的字符将被保存为\
  \ Unicode 转义字符。对于 UTF-8，请使用上述代码段中的读取器/写入器。在 Java 18 之前，请显式设置字符编码为 `StandardCharsets.UTF_8`。\n\
  \n`Properties` 类有两种提供默认值的机制。首先，每当你查找一个字符串的值时，都可以指定一个在键不存在时应自动使用的默认值。\n\n```\nString\
  \ filename = settings.getProperty(\"filename\", \"\");\n```\n\n如果属性映射中存在 `\"filename\"\
  ` 属性，则 `filename` 被设置为该字符串。否则，`filename` 被设置为空字符串。\n\n如果你觉得在每次调用 `getProperty` 时都指定默认值太麻烦了，可以将所有默认值封装在一个辅助属性映射中，并在主属性映射的构造函数中提供该映射。\n\
  \n```\nvar defaultSettings = new Properties();\ndefaultSettings.setProperty(\"width\"\
  , \"600\");\ndefaultSettings.setProperty(\"height\", \"400\");\nString filename\
  \ = settings.getProperty(\"filename\", \"\");\nvar settings = new Properties(defaultSettings);\n\
  ```\n\n是的，你甚至可以为 `Properties` 构造函数指定默认值，但这不是通常的做法。\n\n`java.util.Properties` 1.0\n\
  \n*   `Properties()`\n    创建一个空的属性映射。\n*   `Properties(Properties defaults)`\n \
  \   创建一个带有默认值的空属性映射。\n*   `String getProperty(String key)`\n    获取属性。返回键关联的字符串；如果键不在表中，则返回默认表中键关联的字符串；如果默认表中也没有该键，则返回\
  \ `null`。\n*   `String getProperty(String key, String defaultValue)`\n    获取带有默认值的属性（如果未找到键）。返回键关联的字符串；如果键不在表中，则返回默认字符串。\n\
  *   `Object setProperty(String key, String value)`\n    设置属性。返回给定键的先设置的值。\n*   `Set<String>\
  \ stringPropertyNames()` 6\n    返回所有键的集合，包括默认映射中的键。\n*   `void load(Reader in) throws\
  \ IOException` 6\n    从读取器加载属性映射。\n*   `void store(Writer out, String header)` 6\n\
  \    将属性映射保存到写入器。头部位于存储文件的第一行。\n\n### 系统属性（System Properties）\n\n`System.getProperties`\
  \ 方法产生一个描述系统信息的 `Properties` 对象。例如，主目录的键为 `\"user.home\"`。\n\n你可以使用获取字符串键的 `getProperty`\
  \ 方法来读取它：\n\n```\nString userDir = System.getProperty(\"user.home\");\n```\n\n要获取虚拟机的\
  \ Java 版本，请查找 `\"java.version\"` 属性。你会得到类似 `\"21.0.1\"` 的字符串（但在 Java 8 及之前为 `\"\
  1.8.0\"`）。\n\n\n\n\n正如你所见，版本号在 Java 9 中发生了变化。这个看似微小的变化破坏了许多依赖旧格式的工具。如果你解析了版本字符串，请务必阅读\
  \ [`openjdk.org/jeps/322`](https://openjdk.org/jeps/322) 中的 JEP 322，以了解未来版本字符串将如何格式化——或者至少在命名方案再次更改之前如此。\n\
