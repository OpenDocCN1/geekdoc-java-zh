  \n*Cay Horstmann*\n德国，杜塞尔多夫\n2023 年 10 月\n\n# Java 简介\n\nJava 在 1996 年的发布引发了难以置信的兴奋，不仅在计算机新闻界，而且在《纽约时报》、《华盛顿邮报》和《商业周刊》等主流媒体中。Java\
  \ 有一种独特的荣誉：它是第一个也是唯一在国家公共广播电（NPR）上获得十分钟专题介绍的编程语言。一个金额为 1 亿美元的风险投资基金专门为使用*特定*计算机语言的产品而设立。我希望你会喜欢在本章中发现的\
  \ Java 简史。\n\n## 作为编程平台的 Java\n\n在在书的第一版中，我的合著者 Gary Cornell 和我对 Java 写过这样一段话：\n\
  \n“作为一种计算机语言，Java 的炒作已经结束了：Java 确实是一门很好的语言。毫无疑问，它是严肃程序员可以使用的最佳语言之一。我们认为它可能成为一种伟大的语言，但对于现在来说可能太晚了。”\n\
  \n我们的编辑因为这段话遭到了 Sun Microsystems（最初开发 Java 的公司）一位非常高层的人的批评。Java 语言有许多非常好的特性，我们将在本章稍后的部分详细讨论。它也有自己的缺点，由于兼容性要求，该语言的一些新功能不如原始特性那样优雅。但是，正如我们在第一版中所说的，Java\
  \ 绝不仅仅是一门语言。世界上有很多编程语言，但很少有能引起如此轰动的。Java 是一个完整的平台，拥有包含大量重用代码的海量库，以及一个提供安全、跨平台移植性和自动垃圾回收等服务的执行环境。\n\
  \n作为程序员，你会想要一门语法优美、语义易懂的语言（即不是 C++）。Java 符合这一花标准，其他许多优秀的语言也是如此。有些语言提供了移植性、垃圾回收等功能，但它们没有多少库，如果你想要花哨的图形、网络或数据库访问，得自己实现。而\
  \ Java 拥有一切。\n\n## Java 白皮书关键词\n\nJava 的作者们写了一份具有影响力的白皮书，解释了他们的设计目标和成就。他们还发布了一份更短的概述，按照以下\
  \ 11 个关键词进行组织：\n\n1.  `简单`\n2.  `面向对象`\n3.  `分布式`\n4.  `健壮`\n5.  `安全`\n6.  `架构中立`\n\
  7.  `可移植`\n8.  `解释型`\n9.  `高性能`\n10. `多线程`\n11. `动态`\n\n在接下来的子章节中，你将看到结合白皮书摘录的关于\
  \ Java 设计者对每个关键词的说法的总结，并结合我对当前版本 Java 的经验进行评论。\n\n\n\n\n白皮书可以在 [https://www.oracle.com/technetwork/java/langenv-140151.html]\
  \ 找到。你可以在 [https://horstmann.com/corejava/java-an-overview/7Gosling.pdf] 获取包含 11\
  \ 个关键词的概述。\n\n## 简单\n\n> *我们希望构建一个易于编程的系统，不需要大量深奥的训练，并能利用当今的标准实践。因此，尽管我们发现 C++ 并不合适，但我们设计\
  \ Java 时尽可能贴近 C++，以便系统更易理解。*\n\nJava 的语法确实是 C++ 语法的精简版本。它不需要头文件、指针算术（甚至不需要指针语法）、联合体、运算符重载、虚基类等。（请参见文中穿插的\
  \ C++ 注释，以了解更多关于 Java 和 C++ 之间的差异。）然而，设计者并没有试图修复 C++ 的所有笨拙特性。例如，`switch` 语句的语法在\
  \ Java 中保持不变。如果你熟悉 C++，你会发现过渡到 Java 语法非常容易。\n\n在 Java 发布时，C++ 实际上并不是最常用的编程语言。许多开发者使用\
  \ Visual Basic 及其拖放式编程环境。这些开发者并不认为 Java 简单。Java 开发环境花了几年时间才赶上。如今，Java 开发环境远领先于大多数其他编程语言。\n\
  \n> *简单的另一个方面是轻量化。Java 的目标之一是能够构建出可以在小型机器上独立运行的软件。基础解释器和类支持的大小约为 40K；基础标准库和线程支持（本质上是一个自包含的微内核）又添加了\
  \ 175K。*\n\n这在当时是一项巨大的成就。当然，该库从那时已增长巨大的规模。现在有具有较小库的版本，适用于嵌入式设备和智能卡。\n\n## 面向对象\n\
  \n> *简单来说，面向对象的设计是一种关注数据——对象以及这些对象接口的编程技术。用木工来类比，“一个面向对象”的木工主要关注他正在制作的椅子，其次关注制作椅子时使用的工具；而“非面向对象”的木工则主要考虑他的工具。Java\
  \ 的面向对象功能本质上是 C++ 的功能。*\n\n在开发 Java 时，面向对象已经相当成熟。Java 的面向对象特性与 C++ 相当。Java 和 C++\
  \ 之间的主要区别在于多继承，Java 用更简单的接口概念取代了它。Java 比 C++ 具有更运行时反射能力（在第 5 章 中讨论过）。\n\n## 分布式\n\
  \n> *Java 拥有丰富的程序库来处理 HTTP 和 FTP 等 TCP/IP 协议。Java 应用可以通过 URL 像访问本地文件系统一样轻松地跨网络打开并访问对象。*\n\
  \n如今，人们认为这是理所当然的——但在 1995 年，从 C++ 或 Visual Basic 程序连接 Web 服务器是一项巨大的工程。\n\n## 健壮\n\
  \n> *Java 旨在编写在各种方面都必须可靠的程序。Java 非常强调对可能问题的早期检查、后期的动态（运行时）检查，以及消除易出错的情况。……Java 与\
  \ C/C++ 之间最大的区别在于，Java 拥有一种指针模型，它消除了覆盖内存和损坏数据的可能性。*\n\nJava 编译器可以检测出许多在其他语言中仅会在运行时出现的问题。至于第二点，任何花费数小时追踪由指针\
  \ bug 导致的内存损坏的人都会对 Java 的这一方面感到非常满意。\n\n## 安全\n\n> *Java 旨在用于网络/分布式环境。为此，安全性被了高度关注。Java\
  \ 能够构建无病毒、防篡改的系统。*\n\n从一开始，Java 的设计就是为了让某些攻击变得不可能，其中包括：\n\n* 运行时栈溢出——蠕虫和病毒的常见攻击\n\
  * 损坏自身进程之外的内存\n* 在没有权限的情况下读取或写入文件\n\n最初，Java 对下载代码的态度是“放马过来吧！”。不可信的代码在沙箱环境中执行，那里不会影响主机系统。用户被保证不会发生任何坏事，因为\
  \ Java 代码无论来自何，永远无法逃离沙箱。\n\n然而，Java 的安全模型是复杂的。在第一版 Java 开发包（JDK）发布后不久，普林斯大学的一组安全专家发现了微妙的\
  \ bug，允许不可信的代码攻击主机系统。\n\n最初，安全 bug 被很快修复。不幸的是随着时间的推移，黑客越来越擅长发现安全架构实现中的细微缺陷。Sun 以及随后的\
  \ Oracle 在跟进修复漏洞方面一直非常困难。\n\n在经历了多次备受关注的攻击后，浏览器厂商和 Oracle 变得越来越谨慎。一段时间内，远程代码必须经过数字签名。如今，浏览器不再信任\
  \ Java，Java 应用的安全交付已成为遥远的记忆。\n\n尽管从回想起来，Java 的安全模型并没有最初预想的那样成功，但 Java 远领先于时代。微软的一种名为\
  \ ActiveX 的竞争性代码交付机制仅依赖数字签名来确保安全。显然这是不够的：正如任何微软产品的用户都能证实的那样，来自知名厂商的程序也会崩溃并造成损害。\n\
  \n## 架构中立\n\n> *编译器生成架构中立的对象文件格式。由于 Java 运行时系统的存在，编译后的代码可以在许多处理器上执行。Java 编译器通过生成字节码指令来实现这一点，这些指令与特定的体系无关。相反，它们被设计为既易在任何机器上解释，又于现场翻译成原生机器码。*\n\
  \n为“虚拟机”生成代码在当时并不是新主意。Lisp、Smalltalk 和 Pascal 等编程语言已经使用了这种技术多年。\n\n当然，解释虚拟机指令比全速运行机器指令要慢。然而，虚拟机可以选择将执行频繁的字节码序列翻译成机器码——这一过程被称为即时编译。\n\
  \nJava 虚拟机还有另一个优势。它增加了安全性，因为它可以检查指令序列的行为。\n\n## 可移植\n\n> *与 C 和 C++ 不同，规范中没有“依赖于实现”的方面。基本数据类型的大小是固定的，对它们进行算术运算的行为也是如此。*\n\
  \n例如，Java 中的 `int` 始终是 32 位整数。在 C/C++ 中，`int` 可以是 16 位整数、32 位整数，或者编译器供应商喜欢的任何大小。唯一的限制是\
  \ `int` 类型的字节数至少不少于 `short int`，且不能多于 `long int`。数字类型的固定大小消除了一个巨大的移植头疼。二进制数据以固定格式存储和传输，消除了字节序的困惑。字符串以标准的\
  \ Unicode 格式保存。\n\n\n\n\n\n> *作为系统的组成库定义了可移植接口。例如，有一个抽象的 `Window` 类，以及其针对 UNIX、Windows\
  \ 和 Macintosh 的实现。*\n\n`Window` 类的例子可能选得并不好。正如任何尝试过的人所知的，要实现一个在 Windows、Macintosh\
  \ 和十种不同版本的 UNIX 上都看起来良好的用户界面，是一项具有英雄壮举的努力。Java 1.0 做出了这种英雄主义般的努力，提供了一个简单的工具包，在多个平台上提供了通用的用户界面元素。遗憾的是，其结果是一个库，在经过大量工作后，在不同系统上只能产生勉强可接受的结果。那个最初的用户界面工具包从那以后被替换了一次又一次，而跨平台的移植性仍然是一个问题。\n\
  \n然而，对于所有与用户界面无关的内容，Java 库在让你以平台无关的方式进行工作方面表现出色。你可以处理文件、正则表达式、XML、日期和时间、数据库、网络连接、线程等，而无需担心底层操作系统。不仅你的程序是可移植的，而且\
  \ Java API 的质量通常比原生 API 高。\n\n### 解释型 (Interpreted)\n\n> *Java 解释器可以在任何已移植了解释器的机器上直接执行\
  \ Java 字节码。由于链接是一个更增量且更轻量的过程，开发过程可以更快速且具有探索性。*\n\n这确实是一个有些牵强的说法。任何用过 Lisp、Smalltalk、Visual\
  \ Basic、Python、R 或 Scala 的人都知道什么是“快速且具有探索性”的开发过程。你尝试某些东西，并立即看到结果。在 Java 存在的前 20\
  \ 年里，开发环境并没有关注这种体验。直到 Java 9，`jshell` 工具才支持快速且具有探索性的编程。\n\n### 高性能 (High-Performance)\n\
  \n> *虽然解释型字节码的性能通常绰绰有余，但在某些情况下，需要更高的性能。字节码可以在运行时（在执行时）被翻译成适用于应用程序运行的特定 CPU 的机器码。*\n\
  \n在 Java 的早期阶段，许多用户不同意性能“绰绰有余”的说法。然而，今天，即时编译（JIT）编译器已经变得非常优秀，足以与传统编译器竞争，在某些情况下甚至由于优于它们，因为它们拥有更多的信息。例如，即时编译器可以监控哪些代码被频繁执行，并专门针对这些代码进行速度优化。更高级的优化是消除（或“内联”）函数调用。即时编译器知道加载了哪些类。如果根据当前加载的类集合，某个特定函数从未被重写，它就可以使用内联，并在必要时稍后撤销该优化。\n\
  \n### 多线程 (Multithreaded)\n\n> *[多线程的] 处处是更好的交互式响应能力和实时行为。*\n\n如今，我们关注并发是因为摩尔定律已经结束了。我们得到的不是更处理器，而是更多的处理器，而且我们必须让它们忙起来。然而，当你观察大多数编程语言时，你会发现它们对这个问题表现出了令人震惊的忽视。\n\
  \nJava 的出现是远远领先于那个时代的。它是第一个支持并发编程的主流语言。正如你从白皮书中看到的，它的初衷略有不同。当时，多核处理器还是稀奇的，但 Web\
  \ 编程刚刚开始，处理器花费大量时间等待服务器的响应。需要并发编程来确保用户界面不会冻结。\n\n并发编程绝非易事，但 Java 在使其易于管理方面做得非常好。\n\
  \n### 动态 (Dynamic)\n\n> *在许多方面，Java 比 C 或 C++ 是一种更动态的语言。它的设计是为了适应不断变化的环境。库可以自由添加新方法和实例变量，而不会对其客户端产生任何影响。在\
  \ Java 中，获取运行时类型信息是非常直接的。*\n\n在需要向运行中的程序中添加代码的情况下，这是一项重要的特性。一个典型的例子是从互联网下载代码并在浏览器中运行的代码。在\
  \ C 或 C++ 中，这确实是一个巨大的挑战，但 Java 的设计者非常清楚动态语言如何让运行中的程序易于演进。他们的成就是将这一特性带到主流编程语言中。\n\
  \n在 Java 取得初步成功后，微软发布了一款名为 J++ 的产品，其编程语言和虚拟机与 Java 几乎相同。这一努力未能获得关注，微软随后又推出了另一种名为\
  \ C# 的语言，它同样也与 Java 有许多相似之处，但运行在不同的虚拟机上。本书不涵盖 J++ 或 C#。\n\n## Java Applets 与互联网\n\
  \n这里的想法非常简单：用户将从互联网下载 Java 字节码并在他们自己的机器上运行它们。在网页上运行的 Java 程序被称为 `applets`。要使用 applet，你只需要一个支持\
  \ Java 的 Web 浏览器，它将为你执行字节码。你不需要安装任何软件。每当你访问包含 applet 的网页时，你都会获得最新版本的程序。最重要的是，得益于虚拟机的安全性，你永远不需要担心来自恶意代码的攻击。\n\
  \n将 applet 插入网页的工作非常类似于嵌入图像。applet 成为页面的一部分，文本流过 applet 使用的空间。关键点在于，这张图像是“活的”。它对用户命令做出反应，改变自己的外观，并在展示\
  \ applet 的计算机与提供服务的计算机之间交换数据。\n\n[](#index.xhtml_ch01fig01)显示了分子结构的 Jmol applet。通过鼠标，你可以旋转和缩放每个分子以更好地理解其结构。在\
  \ applet 发明时，这种直接操作在网页上是无法实现的——当时只有 JavaScript 而没有 HTML canvas。\n\n```\n![Figure](img/fig1-1.jpg)Jmol\
  \ applet\n```\n\n当 applet 首次出现时，它们引发了巨大的兴奋。很多人认为 applet 的吸引力是 Java 惊人流行的原因。然而，最初的兴奋很快变成了沮丧。不同版本的\
  \ Netscape 和 Internet 浏览器运行不同版本的 Java，其中某些已经严重过时。这种糟糕的局面使得开发利用最新 Java 版本的 applet\
  \ 变得越来越困难。相反，Adobe 的 Flash 技术因在浏览器中实现动态效果而流行。后来，当 Java 受到严重安全问题的困扰时，浏览器完全放弃了对 applet\
  \ 的支持。Flash 的情况并不如何。\n\n## Java 的历史\n\n本节介绍了 Java 演变的简史。它基于各种出版资料（最重要的是 1995 年 7\
  \ 月份《SunWorld》在线杂志对 Java 创造者的采访）。\n\nJava 可以追溯到 1991 年，当时由 Patrick Naughton 和 James\
  \ Gosling（Sun 研究员和全能计算机大师）领导的一组 Sun 工程师想要设计一种用于电缆电视机盒等消费设备的小型计算机语言。由于这些设备没有大量的功率或内存，语言必须很小并生成非常紧凑的代码。此外，由于不同的制造商可能会选择不同的处理器（CPU），因此该语言不绑定到任何单一架构至关重要。该项目代号为“Green”。\n\
  \n对小巧、紧凑且平台无关代码的需求促使团队设计了一种可移植的语言，为虚拟机生成中间代码。\n\n\n\n\nSun 公司的员工来自 UNIX 背景，因此他们基于\
  \ `C++` 而开发了自己的语言，而不是 Lisp、`Smalltalk` 或 `Pascal`。但正如 Gosling 在采访中所说：“一直以来，这种语言只是工具，而不是目的。”\
  \ Gosling 决定将他的语言命名为“Oak”（可能是因为他喜欢 Sun 公司办公室窗外的一棵橡树）。Sun 公司的员工后来发现 `Oak` 是一个已经存在的计算机语言名称，于是他们将其更名为\
  \ `Java`。事实证明，这是一个极具眼光的选择。\n\n1992 年，Green 项目交付了他们的第一个产品，名为“7”。这是一个极其智能的遥控器。遗憾的是，Sun\
  \ 公司没有人对生产这种产品感兴趣，Green 项目的人员不得不寻找其他方式来营销他们的技术。然而，没有任何标准的消费类电子公司对此感兴趣。随后，该小组竞标了一个设计电缆电视盒的项目，该盒子能够处理如视频点播等新兴的电缆服务。他们没有获得该合同。（有趣的是，获得合同的公司是由创立\
  \ Netscape 的 Jim Clark 领导的——而 Netscape 公司对 Java 的成功做出了巨大贡献。）\n\nGreen 项目（更名为“First\
  \ Person, Inc.”）在 1993 年全年和 1994 年上半年时间都在寻找购买其技术的人。但没有人买。（该小组的创始人之一、最终负责了大部分营销工作的\
  \ Patrick Naughton 声称，在尝试销售该技术的过程中积累了 300,000 英里的航空里程。）First Person 在 1994 年解散。\n\
  \n当 Sun 公司发生这一切时，互联网的世界维网部分正在变得越来越大。世界维网的关键是将超文本页面翻译到屏幕上的浏览器。1994 年，大多数人使用的是 `Mosaic`，这是一种非商业网络浏览器，它于\
  \ 1993 年出自伊利诺伊大学的超级计算中心。（Mosaic 的部分代码是由 Marc Andreessen 作为一名本科生在一个勤工俭学的项目中编写的，时薪\
  \ 6.85 美元。随后，他作为 Netscape 的联合创始人之一和首席技术官走向了名利双收。）\n\n在 *SunWorld* 采访中，Gosling 提到在\
  \ 1994 年年中，语言开发者们意识到：“我们可以构建出一个非常酷的浏览器。这是客户端/服务器主流领域中少数几个需要我们所做的一些奇特的特性之一：架构中立、实时、可靠、安全——这些问题在工作站世界中并不十分重要。所以我们构建了一个浏览器。”\n\
  \n实际的浏览器由 Patrick Naughton 和 Jonathan Payne 构建，并演变为为 `HotJava` 浏览器，其设计初是为了展示 Java\
  \ 的强大。该浏览器能够在网页内执行 Java 代码。这一“技术证明”在 1995 年 5 月 23 日的 SunWorld '95 上展示，并引发了持续至今的\
  \ Java 热潮。\n\nSun 公司于 1996 年初发布了第一个版本的 Java。人们很快意识到 `Java 1.0` 无法胜任严肃的应用程序开发。当然，你可以使用\
  \ `Java 1.0` 制作一个紧张的文本小程序（applet），让文本在画布上随机移动。但在 `Java 1.0` 中甚至连打印都无法实现。直言地说，`Java\
  \ 1.0` 还没有准备好投入市场。它的继任版本 1.1 填充了最明显的缺陷，极大地改进了反射能力，并为 GUI 编程添加了新的事件模型。尽管如此，它的功能仍然相当有限。\n\
  \n1998 年 JavaOne 大会上的大新闻是即将发布的 `Java 1.2`，它用早期类似玩具的 GUI 和图形工具包替换为更复杂的可扩展版本。在 1998\
  \ 年 12 月发布三天后（！），Sun 的营销部门将名称更改为朗朗上口的 `Java 2 Standard Edition Software Development\
  \ Kit Version 1.2`。\n\n除了标准版（Standard Edition），还引入了另外两个版本：用于手机等嵌入式设备的微版（Micro Edition），以及用于服务器端处理的企业版（Enterprise\
  \ Edition）。本书侧重于标准版。\n\n标准版的 1.3 和 1.4 版本是对初始 `Java 2` 版本的增量式改进，具有不断增长的标准库、提升的性能，当然，还有许多许多\
  \ 的 修复。在此期间，关于 Java applet 和客户端应用程序的大部分热度消退了，但 Java 变成了服务器端应用程序的首选平台。\n\n5.0 版本是自\
  \ 1.1 版本以来首次以重大方式更新 Java 语言的版本。（该版本最初编号为 1.5，但在 2004 年的 JavaOne 大会上，版本号跳到了 5.0。）经过多年的研究，添加了泛型（generic\
  \ types，大致可以类比于 `C++` 模板）——挑战在于如何在不改变虚拟机的情况下添加这一特性。其他几个实用的语言特性也受到了 `C#` 的启发：“for\
  \ each”循环、自动装箱（autoboxing）和注解（annotations）。\n\n版本 6（不带 .0 后缀）于 2006 年底发布。同样，没有语言变化，只有额外的性能改进和库增强。\n\
  \n随着数据中心日益依赖商品化硬件而非专用服务器，Sun Microsystems 陷入困境，并于 2009 年被 Oracle 收购。Java 的开发停滞了很久。2011\
  \ 年，Oracle 发布了一个带有简单增强的新版本，即 `Java 7`。\n\n2014 年，随之发布了 `Java 8`，这是近二十年来 Java 语言最重大的变化。Java\
  \ 8 拥抱了“函数式”编程风格，使得能够轻松可以并发执行的计算。所有的编程语言都必须进化以保持活力，而 Java 展现了这种进化的卓越能力。\n\n`Java\
  \ 9` 的主要特性可以追溯到 2008 年。当时，Java 平台首席工程师 Mark Reinhold 启动了一项拆分巨大的单体 Java 平台的努力。这是通过引入模块（modules），即提供特定功能的自包含代码单元来实现的。花费十几年设计并实现了一个适用于\
  \ Java 平台的模块系统，但是否也适用于 Java 应用和库还有待观察。\n\n从 2018 年开始，Java 每六个月发布一次版本，以便快速引入预览特性（preview\
  \ features）。新功能可能会经过几轮预览。例如，`switch` 模式匹配从 Java 17 开始经过了四次预览，最后在 `Java 21` 中定稿。\n\
  \n每隔一段时间，Oracle 和其他供应商会将某个版本指定为长期支持（LTS）版本，提供若干年的错误修复和安全更新。在生产环境中使用 Java 时，通常会留在\
  \ LTS 版本且不使用任何预览特性。到目前为止，这种情况发生在 Java 11、Java 17 和 Java 21 上。\n\n\n\n\n| 21 | 2023\
  \ | 虚拟线程、模式匹配 | 4,882 |\n\n## 关于 Java 的常见误解\n\n本章以关于 Java 的一些常见误解的注释列表结束。\n\n*Java\
  \ 是 HTML 的扩展。*\n\nJava 是一种编程语言；HTML 是一种描述网页结构的方式。它们之间没有任何共同点，除了曾经存在过 HTML 扩展用于在网页上放置\
  \ Java applet。\n\n*我使用 XML，所以我不需要 Java。*\n\nJava 是一种编程语言；XML 是一种描述数据的方式。你可以用任何编程语言处理\
  \ XML 数据，但 `Java API` 为 XML 处理提供了极佳的支持。此外，许多重要的 XML 工具都是用 Java 实现的。更多信息请参见第二卷。\n\
  \n*Java 是一门容易学习的编程语言。*\n\n没有任何像 Java 这样强大的编程语言是容易的。你总是需要区分编写玩具级程序的难易程度与完成严肃工作的难易程度。此外，请注意书中只有七章章讨论了\
  \ Java 语言。两卷书中剩下的章节都展示了如何使用 Java `libraries` 来让语言工作。Java `libraries` 包含了成千上万个类和接口以及数万个函数。幸运的是，你不需要了解其中的每一个，但为了用\
  \ Java 任何任何实际工作，你确实需要了解其中令人惊讶的许多。\n\n*Java 将成为适用于所有平台的通用编程语言。*\n\n这在理论上是可能的。但在实践中，某些领域已被其他语言根深蒂固。`Objective\
  \ C` 及其继者 `Swift` 不会在 iOS 设备上被取代。浏览器中发生的任何事情都由 `JavaScript` 控制。Windows 程序是用 `C++`\
  \ 或 `C#` 编写的。Java 在服务端编程和跨平台客户端应用方面具有优势。\n\n*Java 只是另一种编程语言。*\n\nJava 是一门很棒的编程语言；大多数程序员倾向于使用\
  \ `C`、`C++` 或 `C#`。但曾有数百种优秀的编程语言从未获得过广泛普及，而具有明显缺陷的语言（如 `C++` 和 `Visual Basic`）却取得了巨大的成功。\n\
  \n为什么？一种编程语言的成功很大程度上取决于其周围支持系统的实用性，而不是其语法的优雅性。对于你需要实现的功能，是否有有用、方便且标准的库？是否有工具供应商构建出出色的编程和调试环境？语言和工具集是否与整个计算基础设施集成？Java\
  \ 之所以成功是因为它的库让你能够轻松地完成网络、Web 应用程序和并发等任务。Java 减少了指针错误是一个额外奖励，因此程序员在使用 Java 时似乎效率更高——但这些因素并不是它成功的根源。\n\
  \n*Java 是专有的，因此应该避免使用。*\n\n当 Java 最初被创建时，Sun Microsystems 向分发商和终端用户提供了免费许可。尽管 Sun\
  \ 对 Java 拥有最终控制权，但他们让许多其他公司参与了语言版本的修订和新库的设计。虚拟机和库的源代码一直是免费提供的，但仅供检查，而不供修改和重新分发。当时的\
  \ Java 是“闭源的，但处事友善”。\n\n这种情况情况在 2007 年发生了剧烈变化，当时 Sun 宣布未来的 Java 版本将根据通用公共许可证（GPL）提供，这是与\
  \ Linux 使用的相同的开源许可证。Oracle 已承诺保持 Java 的开源状态。现在有多个开源 Java 实现的提供者，具有不同程度的承诺和支持。\n\n\
  *Java 是解释执行的，所以对于严肃应用来说它太慢了。*\n\n在 Java 早期，这门语言是解释执行的。如今，Java 虚拟机使用即时编译器（JIT）。你代码中的“热点”在\
  \ Java 中的运行速度与 `C++` 一样快，某些情况下甚至更快。\n\n*所有的 Java 程序都运行在网页内部。*\n\n曾有一段时间 Java `applets`\
  \ 运行在浏览器内部。如今，Java 程序是运行在浏览器之外的独立应用程序。事实上，大多数 Java 程序运行在服务器上，为网页生成代码或计算业务逻辑。\n\n\
  *Java 程序是重大的安全风险。*\n\n在 Java 早期，曾有一些广为人知的 Java 安全系统故障的报告。研究人员将其视为寻找 Java 盔甲上的裂缝以及挑战\
  \ applet 安全模型强度和复杂性的机会。他们发现的技术性故障很快得到了纠正。后来，又出现了更严重的漏洞，Sun 以及随后的 Oracle 对此响应缓慢。浏览器厂商停止了对\
  \ Java applet 的支持。让 applet 成为可能的安全管理器架构现在已经废弃。如今，Java 应用的安全性并不亚于其他应用程序。由于虚拟机的保护，它们比用\
  \ `C` 或 `C++` 编写的应用程序安全得多。\n\n*JavaScript 是 Java 的简单版本。*\n\n`JavaScript` 是一种可以在网页内部使用的脚本语言，由\
  \ Netscape 发明，最初称为 `LiveScript`。`JavaScript` 的语法让人联想到 Java，且语言名称听起来很相似，但除此之外它们之间毫无关系。特别是，Java\
  \ 是强类型的——编译器可以捕获许多由于类型误用引起的错误。在 `JavaScript` 中，此类错误只有在程序运行时才能被发现，这使得消除它们变得困难得多。\n\
  \n*有了 Java，我可以用我的桌面电脑换成一台廉价的“网络设备”。*\n\n当 Java 最初发布时，有些人豪注这将会发生。一些公司生产了由 Java 驱动的网络计算机的原型，但用户还没有准备好放弃强大方便的桌面电脑，去使用一台没有本地存储的受限机器。如今当然世界已经变了，对于绝大多数终端用户来说，重要的平台是手机或平板电脑。这些设备大部分由基于\
  \ Java 的 `Android` 平台控制。学习 Java 编程对 Android 也有帮助。\n\n# Java 环境环境\n\n在本中，你将学习如何安装\
  \ Java 开发包（JDK）以及如何编译和运行 Java 程序。你可以在终端窗口中通过输入命令运行 `JDK` 工具。然而，许多程序员更喜欢集成开发环境。你将学习如何使用免费的开发环境来编译和运行\
  \ Java 程序。一旦你掌握了本章中的技术并选择了开发工具，就可以进入第 3 章，从那里开始探索 Java 语言。\n\n## 安装 Java 开发包\n\n\
  在过去，最完整、最新的 Java 开发包（JDK）由 Oracle 提供。如今，许多不同的公司和组织（包括 Amazon、Azul、Microsoft 和 Red\
  \ Hat）提供最新的 `OpenJDK` 构建。每个供应商都有不同的许可条件和支持方案。\n\n### 下载 JDK\n\n你可以从 Eclipse Foundation\
  \ 的 [`adoptium.net`](https://adoptium.net) 下载 Java 开发包，或者从 Oracle 的 [`www.oracle.com/java/technologies/downloads`](https://www.oracle.com/java/technologies/downloads)\
  \ 下载，也可以从许多其他供应商下载。\n\n根据供应商的不同，Java 开发包可能有品牌名称，例如 Temurin（Eclipse Foundation）、Corretto（Amazon）或\
  \ Zulu（Azul）。品牌名称对于 Java 程序员来说并不重要。\n\n\n\n\n\n你应该使用 Java SE 21 (LTS) `JDK`。请参考\
  \ [](#index.xhtml_ch02table01) 获取你在下载网站上可能遇到的缩写词和术语总结。\n\n# Java 术语\n\n| 名称 | 缩写\
  \ | 解释 |\n| --- | --- | --- |\n| Java 开发工具包 | JDK | 为想要编写 Java 程序的程序员提供的软件。 |\n\
  | Java 运行时环境 | JRE | 用于运行 Java 程序的软件，不包含开发工具。仅支持到 Java 8。你并不需要它。 |\n| 标准版 | SE |\
  \ 用于桌面端和简单服务器应用程序的 Java 平台。你需要这个版本。 |\n| 微型版 | ME | 用于小型设备的 Java 平台。 |\n| OpenJDK\
  \ | — | Java SE 的免费开源实现版本。 |\n| Hotspot | — | 由 Oracle 开发的“即时”（just-in-time）编译器。如果被问到，请选择这一个。\
  \ |\n| OpenJ9 | — | IBM 开发的另一个“即时”编译器。 |\n| GraalVM | — | 一种用于快速启动的可执行文件的“提前”（ahead-of-time）编译器，但不支持所有的\
  \ Java 特性。本书书中不需要它。 |\n| 长期支持 | LTS | 支持多年的发布版本，与每六个月发布一次展示新功能的版本不同。请选择最新的 LTS 版本。\
  \ |\n| Eclipse | — | 分发开源软件的基金会。 |\n| Temurin | — | Eclipse 基金会发布的 OpenJDK 版本的品牌。\
  \ |\n| Adoptium | — | Eclipse 基金会内部的一个项目，为其分发提供 OpenJDK 版本和基础设施支持。 |\n\n## 安装 JDK\n\
  \n下载 `JDK` 后，你需要安装它并确定它的安装位置——你稍会需要这些信息。\n\n如果你运行的是 Windows 或使用 Mac，只需启动安装程序并选择默认选项即可。\n\
  \n在 Linux 上，将 `.tar.gz` 文件解压到你选择的位置，例如你的家目录或 `/opt`。然后，将 `PATH` 设置为 `JDK` 所在目录的\
  \ `bin` 子目录，例如 `/opt/jdk-21.0.4/bin`。这通常通过向 `~/.bashrc` 或 `~/.bash_profile` 文件的末尾添加如下行来实现：\n\
  \n```\nexport PATH=/opt/jdk-21.0.4/bin:$PATH\n```\n\n以下是测试你是否操作正确的的方法。打开终端窗口。输入该行：\n\
  \n```\njavac --version\n```\n\n并按回车键。你应该看到类似如下的显示：\n\n```\njavac 21.0.4\n```\n\n\
  如果你收到的是类似“javac: command not found”或“指定的名称不是内部或外部命令、可运行程序或批文件”的消息，那么你需要重新检查你的安装情况。\n\
  \n了解 `JDK` 安装在系统中的哪个位置通常很有用——请参考 [](#index.xhtml_the-jdk-installation-directory)。在本书中，安装目录表示为\
  \ `jdk`。例如，当提到 `jdk``/bin` 目录时，指的是类似 `/opt/jdk-17.0.4/bin` 或 `C:\\Program Files\\\
  Java\\jdk-21\\bin` 的目录。\n\n### JDK 安装目录\n\n| 平台 | 示例目录 |\n| --- | --- |\n| Windows\
  \ (Adoptium) | `C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.4.11-hotspot` |\n\
  | Windows (Oracle OpenJDK) | `C:\\Program Files\\Java\\jdk-21` |\n| Mac OS | `/Library/Java/JavaVirtualMachines/jdk-21.0.4_11.jdk/Contents/Home`\
  \ |\n| Linux | 你解压 `.tar.gz` 文件的位置，例如 `/opt/jdk-21.0.4` |\n\n在 Windows 上，Oracle\
  \ 的 `JDK` 安装程序会将目录 `C:\\Program Files\\Common Files\\Oracle\\Java\\javapath` 添加到\
  \ `PATH` 环境变量。该目录仅包含 `javac`、`javaw`、`java` 和 `jshell` 可执行文件。（你将在本章学习如何使用 `javac`、`java`\
  \ 和 `jshell`。`javaw` 可执行文件是 Windows 特有的，用于在不显示控制窗口的情况下启动程序。） Java 开发工具包中的其他工具可以在\
  \ `JDK` 安装目录的 `bin` 子目录下找到。在调用这些程序时，可以指定完整路径（例如 `javadoc` 工具使用 `C:\\Program Files\\\
  Java\\jdk-21\\bin\\javadoc`），或者将 `bin` 子目录添加到 `PATH` 环境变量中。实现此点的一种方法是使用 `setx` 命令：\n\
  \n```\nsetx PATH \"%PATH%;c:\\Program Files\\Java\\jdk-21\\bin\"\n```\n\n打开另一个终端窗口使更改生效。\n\
  \n[`adoptium.net`](https://adoptium.net) 安装程序没有这个问题。它会将所有 `JDK` 工具添加到 `PATH` 中。\n\
  \n### 安装源文件和文档\n\n库源文件以压缩文件 `jdk``/lib/src.zip` 的形式随 `JDK` 提供。解压该文件即可获取源码。只需执行：\n\
  \n1. 确保 `JDK` 已安装且 `jdk``/bin` 目录在执行路径中。\n2. 在你的家目录下创建一个 `javasrc` 目录。如果你愿意，可以在终端窗口中执行。\n\
  \    ```\n    mkdir javasrc\n    ```\n3. 在 `jdk``/lib` 目录下找到 `src.zip`。\n4. 将 `src.zip`\
  \ 解压到你的家目录。将 `doc` 目录重命名为更有描述性的名称，例如 `jdk-21-docs`。\n    ```\n    tar xvf src.zip\n\
  \    mv doc jdk-21-docs\n    ```\n\n`src.zip` 文件包含所有公共库的源码。还应该安装 *Core Java* 示例。你可以从\
  \ [`horstmann.com/corejava`](https://horstmann.com/corejava) 下载它们。它们被封装成一个 `corejava.zip`\
  \ zip 包。只需将其解压到你的家目录即可。如果你愿意，可以在命令行执行：\n\n```\ntar xvf corejava.zip\n```\n\n你可以在\
  \ [docs.oracle.com/en/javase/21/](https://docs.oracle.com/en/javase/21/) 阅读文档。如果你希望有一个离线版本，请遵循以下步骤：\n\
  1. 从 [`www.oracle.com/java/technologies/downloads/`](https://www.oracle.com/java/technologies/downloads/)\
  \ 下载文档 zip 包。\n2. 解压文件并将 `doc` 目录重命名为更有描述性的名称，例如 `jdk-21-docs`。\n    ```\n    tar\
  \ xvf docs.zip\n    mv doc jdk-21-docs\n    ```\n\n## 使用命令行工具\n\n让我们用最原始的方法开始：从命令行编译并启动\
  \ Java 程序。\n\n1. 打开终端窗口。\n2. 进入 `corejava``/v1ch02/Welcome` 目录。（`corejava` 目录是你安装书籍示例源码的地方，如\
  \ [](#index.xhtml_ch02lev2sec3) 所示。）\n3. 输入以下命令：\n\n    ```\n    javac Welcome.java\n\
  \    java Welcome\n    ```\n\n在终端窗口中，你应该看到如 [](#index.xhtml_ch02fig04) 所示的输出。\n\n\
  ![图](img/command-line.jpg) 编译并运行 `Welcome.java`\n\n恭喜！你刚刚编译并运行了你的第一个 Java 程序。\n\n\
  \n\n\n\n发生了什么呢？`javac` 程序是 Java 编译器。它将 `Welcome.java` 文件编译成 `Welcome.class` 文件。`java`\
  \ 程序启动 Java 虚拟机。它执行编译器存放在类文件中的字节码。\n\n`Welcome` 程序极其简单。它只是向终端打印一条消息。你可能喜欢查看在 [](#index.xhtml_ch02ex01)所示的程序。你将在下一章中看到它是如何工作的。\n\
  \n`Welcome/Welcome.java`\n\n```java\n/**\n * 此程序向读者显示一条问候语。\n * @version 1.30 2014-02-27\n\
  \ * @author Cay Horstmann\n */\npublic class Welcome\n{\n public static void main(String[]\
  \ args)\n {\n  String greeting = \"Welcome to Core Java!\";\n  System.out.println(greeting);\n\
  \  for (int i = 0; i < greeting.length(); i++)\n   System.out.print(\"=\");\n  System.out.println();\n\
  \ }\n}\n```\n\n在集成开发环境时代，许多程序员并不熟悉在终端窗口中运行程序。可能会出现各种问题，导致令人沮丧的结果。\n\n请注意以下几点：\n\n\
  *   如果你是手动输入程序，请确保正确输入了大写和小写字母。特别是，类名是 `Welcome`，而不是 `welcome` 或 `WELCOME`。\n* \
  \  编译器需要一个`文件名` (`Welcome.java`）。当你运行程序时，指定一个`类名` (`Welcome`），不需要加 `.java` 或 `.class`\
  \ 扩展名。\n*   如果你收到类似“Bad command or file name”或“javac: command not found”的消息，请返回并检查你的安装，特别是可执行路径设置。\n\
  *   如果 `javac` 报告找不到文件 `Welcome.java`，你应该检查该文件是否存在于目录中。\n    *   在 Linux 下，检查是否对\
  \ `Welcome.java` 使用了正确的大小写。\n    *   在 Windows 下，使用 `dir` 命令，而不是图形化的资源管理器工具。某些文本编辑器（特别是记事本）坚持要为每个文件名添加\
  \ `.txt` 扩展名。如果你使用记事本编辑 `Welcome.java`，它实际上会将其保存为 `Welcome.java.txt`。在 Windows 默认设置下，资源管理器会与记事本配合并隐藏\
  \ `.txt` 扩展名，因为它属于“已知文件类型”。在这种情况下，你需要重命名文件，或者通过给文件名加上引号重新保存：`\"Welcome.java\"`。\n\
  *   如果你启动程序并收到关于 `java.lang.NoClassDefFoundError` 的错误消息，请仔细检查引起错误的类名。\n    *   如果你收到关于\
  \ `welcome`（小写 `w`）的投诉，那么你应该重新执行带大写 `W` 的 `java Welcome` 命令。如既往一样，Java 对大小写敏感。\n\
  \    *   如果你收到关于 `Welcome/java` 的投诉，意味着你不小心输入了 `java Welcome.java`。重新执行命令 `java\
  \ Welcome`。\n\n从 Java 11 开始，如果你只有一个源文件，可以跳过 `javac` 命令。此功能旨在 脚本（以“shebang”行 `#!/path/to/java`\
  \ 开头），可能用于简单的学生程序。一旦你的程序变得复杂，你就需要使用 `javac`。\n\n`Welcome` 程序并不特别有趣。接下来，尝试一个图形化应用程序。这个程序是一个简单的图像文件查看器，用于加载并显示图像。像以前一样，从命令行编译并运行程序。\n\
  \n1.  打开终端窗口。\n2.  切换到目录 `corejava/v1ch02/ImageViewer`。\n3.  输入以下内容：\n    ```bash\n\
  \    javac ImageViewer.java\n    java ImageViewer\n    ```\n\n弹出一个新的程序窗口显示 ImageViewer\
  \ 应用程序。现在，选择 File（文件）→ Open（打开），寻找一个图像文件打开。（相同目录下有两个示例文件。）图像将被显示（参见 [](#index.xhtml_ch02fig10)）。要关闭程序，点击标题栏上的关闭框，或从菜单选择\
  \ File（文件）→ Exit（退出）。\n\n![Figure](img/ImageViewer.jpg) 运行 ImageViewer 应用程序\n\n\
  快速查看源码 [](#index.xhtml_ch02ex02)。该程序比第一个程序长得多，但如果你考虑到用 C 或 C++ 编写类似的应用程序需要多少代码，它并不会太复杂。当然，现在编写带有图形用户界面的桌面应用并不常见，但如果你感兴趣，可以在\
  \ 第二卷第 10 章 中找到更多细节。\n\n`ImageViewer/ImageViewer.java`\n\n```java\nimport java.awt.*;\n\
  import java.io.*;\nimport javax.swing.*;\n\n/**\n * 一个用于查看图片的程序。\n * @version 1.31\
  \ 2018-04-10\n * @author Cay Horstmann\n */\npublic class ImageViewer\n{\n public\
  \ static void main(String[] args)\n {\n  EventQueue.invokeLater(() -> {\n   var\
  \ frame = new ImageViewer();\n   frame.setTitle(\"ImageViewer\");\n   frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \   frame.setVisible(true);\n  });\n }\n}\n\nclass ImageViewer extends JFrame\n\
  {\n static final int DEFAULT_WIDTH = 300;\n static final int DEFAULT_HEIGHT = 400;\n\
  \n public ImageViewer()\n {\n  setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n  var label\
  \ = new JLabel();\n  add(label);\n  var chooser = new JFileChooser();\n  chooser.setCurrentDirectory(new\
  \ File(\".\"));\n  var menuBar = new JMenuBar();\n  setJMenuBar(menuBar);\n  var\
  \ menu = new JMenu(\"File\");\n  menuBar.add(menu);\n  var openItem = new JMenuItem(\"\
  Open\");\n  menu.add(openItem);\n  openItem.addActionListener(() -> {\n   int result\
  \ = chooser.showOpenDialog(null);\n   if (result == JFileChooser.APPROVE_OPTION)\
  \ {\n    String name = chooser.getSelectedFile().getPath();\n    label.setIcon(new\
  \ ImageIcon(name));\n   }\n  });\n  var exitItem = new JMenuItem(\"Exit\");\n  menu.add(exitItem);\n\
  \  exitItem.addActionListener(event -> System.exit(0));\n }\n}\n```\n\n\n\n\n\n\
  ![Figure](img/eclipse-new-project2cut.jpg) 在 Eclipse 中配置项目\n\n4. 点击 `Finish` 按钮。项目现在已创建。\n\
  \n5. 点击左侧窗格中项目旁的三角形，直到找到 `Welcome.java` 文件，然后双击它。你现在应该能看到一个显示程序代码的面板（参见 [](#index.xhtml_ch02fig07)）。\n\
  \n![Figure](img/eclipse-editor.jpg)使用 Eclipse 编辑源文件\n\n6. 使用鼠标右键点击左侧窗格中的项目名称 (Welcome)。选择\
  \ `Run` → `Run As` → `Java Application`。程序输出将显示在控制台面板中。\n\n推测这个程序没有拼写错误或 Bug。（毕竟，这毕竟只有几行代码。）为了起起见，让我们假设你的代码偶尔包含拼写错误（甚至可能是语法错误）。尝试一下吧——例如，通过如下方式更改\
  \ `String` 的大小写来破坏你的文件：\n\n```\nstring greeting = \"Welcome to Core Java!\"; own\n\
  ```\n\n注意 `string` 下方的波浪线。在源代码下方的标签页中，点击 `Problems` 并展开三角形，直到看到一条关于抱怨未知 `string`\
  \ 类型的错误消息（参见 [](#index.xhtml_ch02fig09)）。点击错误消息。光标会移动到编辑面板中对应的行，你可以在那里纠正错误。这允许你快速修复错误。\n\
  \n![Figure](img/eclipse-errors.jpg)Eclipse 中的错误消息\n\n通常，Eclipse 错误报告会伴有一个灯泡图标。点击灯泡可以获取建议的修复方案列表。\n\
  \n## JShell\n\nJShell 程序提供了一个“读取-评估-打印循环”，或 REPL。你输入一个 Java 表达式；JShell 评估你的输入，打印结果并等待你的下一次输入。这是实验的一种极佳方式——比在集成开发环境中编写完整的程序快得多。\n\
  \n要启动 JShell，只需在终端窗口中输入 `jshell`（参见 [](#index.xhtml_jshell-screen)）。\n\n![](img/jshell.jpg)\
  \ 运行 JShell\n\nJShell 启动时会显示一条欢迎语，随后是提示符：\n\n```\n|  Welcome to JShell -- Version\
  \ 21.0.4\n|  For an introduction type: /help intro\n\njshell>\n```\n\n现在输入一个表达式，例如\n\
  \n```\n\"Core Java\".length()\n```\n\nJShell 响应结果——在这种情况下，是字符串“Core Java”的字符数。\n\
  \n```\n$1 ==> 9\n```\n\n注意，你*不需要*输入 `System.out.println`。JShell 会自动打印你输入的每个表达式的值。\n\
  \n输出中的 `$1` 表示该结果可以用于进一步计算。例如，如果你输入\n\n```\n5 * $1 - 3\n```\n\n响应为：\n\n```\n$2 ==>\
  \ 42\n```\n\n如果你需要多次使用一个变量，可以给它起一个更易记忆的名字。例如，\n\n```\njshell> var answer = 6 * 7\n\
  answer ==> 42\n```\n\n另一个实用功能是 Tab 补全。输入\n\n```\nMath.\n```\n\n然后按下 `Tab` 键。因为有很多补全选项，系统会提示你再次按下\
  \ `Tab` 键。你会得到一个可以使用 `Math` 类调用的所有方法列表：\n\n```\njshell> Math.\nE               \
  \        IEEEremainder(          PI                      \nTAU                 \
  \    abs(                    absExact(               \nacos(                   addExact(\
  \               asin(                   \natan(                   atan2(       \
  \           cbrt(                   \nceil(                   ceilDiv(         \
  \       ceilDivExact(           \nceilMod(                clamp(               \
  \   class                   \ncopySign(               cos(                    cosh(\
  \                   \ndecrementExact(         divideExact(            exp(     \
  \               \nexpm1(                  floor(                  floorDiv(    \
  \           \nfloorDivExact(          floorMod(               fma(             \
  \       \ngetExponent(            hypot(                  incrementExact(      \
  \   \nlog(                    log10(                  log1p(                  \n\
  max(                    min(                    multiplyExact(          \nmultiplyFull(\
  \           multiplyHigh(           negateExact(            \nnextAfter(       \
  \       nextDown(               nextUp(                 \npow(                 \
  \   random()                rint(                   \nround(                  scalb(\
  \                  signum(                 \nsin(                    sinh(     \
  \              sqrt(                   \nsubtractExact(          tan(          \
  \          tanh(                   \ntoDegrees(              toIntExact(       \
  \      toRadians(              \nulp(                    unsignedMultiplyHigh( \n\
  ```\n\n现在输入 `l` 并再次按下 `Tab` 键。方法名被补全为 `log`，你会得到一个更短的列表：\n\n```\njshell> Math.log\n\
  log(     log10(   log1p( \n```\n\n现在你可以手动填写剩余部分：\n\n```\njshell> Math.log10(0.001)\n\
  $4 ==> -3.0\n```\n\n要重复某个命令，按下 `↑` 键直到看到你想重新发送或编辑的行。你可以使用 `←` 和 `→` 键在行内移动光标，并添加或删除字符。完成后按下\
  \ `Enter`。例如，按下 `↑` 键并将 `0.001` 替换为 `1000`，然后按下 `Enter`：\n\n```\njshell> Math.log10(1000)\n\
  $5 ==> 3.0\n```\n\n使用命令退出 JShell\n\n```\n/exit\n```\n\nJShell 让……变得简单且有趣\n\n\n\n\
  \n你需要将源代码的文件命名为与公共类相同，并加上 `.java` 扩展名。因此，你必须将此代码存储名为 `FirstSample.java` 的文件中。（再次强调，大小写很重要——不要使用\
  \ `firstsample.java`。）\n\n你使用以下命令编译文件：\n\n```\njavac FirstSample.java\n```\n\n如果你命名正确且在源代码中没有出现任何拼写错误，你将得到一个包含该类字节码的文件。Java\
  \ 编译器会将字节码文件命名为 `FirstSample.class` 并将其存储在与源文件相同的目录下。最后，通过以下命令启动程序：\n\n```\njava\
  \ FirstSample\n```\n\n（记住省略 `.class` 扩展名。）当程序执行时，它仅仅会在控制台上显示字符串 `We will not use\
  \ 'Hello, World!'`。\n\n当你使用\n\n```\njava ClassName\n```\n\n来运行编译后的程序时，Java 虚拟机总是从你所指定的类中\
  \ `main` 方法的代码开始执行。（“方法”一词是 Java 语言中对“函数”的说法。）因此，为了让你的代码执行，你*必须*在类的源代码中有一个 `main`\
  \ 方法。当然，你可以在类中添加自己的方法并在 `main` 方法中调用它们。（你将在下一章看到如何编写自己的方法。）\n\n根据 Java 语言规范，`main`\
  \ 方法必须声明为 `public`。（Java 语言规范是描述 Java 语言的官方文档。你可以从 [`docs.oracle.com/javase/specs`](https://docs.oracle.com/javase/specs)\
  \ 查看或下载它。）\n\n然而，多个版本的 Java 启动器在 `main` 方法不是 `public` 的情况下也能执行 Java 程序。一位程序员提交了一个错误报告。要查看它，请访问\
  \ [`bugs.openjdk.org/browse/JDK-4252539`](https://bugs.openjdk.org/browse/JDK-4252539)。1999\
  \ 年，该错误被标记为“关闭，不修复”。一位 Sun 工程师增加了一个解释，说明 Java 虚拟机规范并没有规定 `main` 必须是 `public`，并且“修复它会导致潜在的问题”。幸运的是，理智胜过了。Java\
  \ 1.4 及更高版本的 Java 启动器强制要求 `main` 方法为 `public`。\n\n当然，让经常工作过度且并不总是是 Java 细节专家的质量保证工程师对错误报告做出令人怀疑的决定是令人沮丧的。但值得的是，错误报告及其解决方案在\
  \ Java 开源很久以前就可以供任何人审查了。\n\n注意源代码中的大括号 `{ }`。在 Java 中，就像在 C/C++ 中一样，大括号界定了程序中的部分（通常称为*块*，blocks）。在\
  \ Java 中，任何方法的代码都必须以左大括号 `{` 开始并以右大括号 `}` 结束。\n\n大括号的风格引发了过多无用的争议。本书采用的是一种让匹配的大括号对齐的风格。由于空白字符对\
  \ Java 编译器无关，你可以使用任何你喜欢的大括号样式。\n\n目前，不要担心 `static void` 关键字——只需把它们看作是让 Java 程序通过编译所需的内容即可。在第\
  \ 4 章 结束时，你将完全理解这个咒语。现在需要记住的点是，每个 Java 应用程序必须有一个以下方式声明的 `main` 方法：\n\n```\npublic\
  \ class ClassName\n{\n   public static void main(String[] args)\n   {\n      program\
  \ statements\n   }\n}\n```\n\n`public static void main` 复杂的结构即将让位于更简单的东西取代。Java\
  \ 21 有一个预览功能，描述在 Java 增强提案 (JEP) 445 中，它允许你像这样写 `main` 方法：\n\n```\nclass FirstSample\n\
  {\n   void main()\n   {\n      System.out.println(\"We will not use 'Hello, World!'\"\
  );\n   }\n}\n```\n\n这样好多了。没有 `public`，没有 `static`，没有 `String[] args`。\n\n目前，你需要使用命令行标记编译并运行程序：\n\
  \n```\njavac --enable-preview --source 21 FirstSample.java\njava --enable-preview\
  \ FirstSample\n```\n\n更简单，由于只有一个源文件，你可以跳过 `javac` 步骤：\n\n```\njava --enable-preview\
  \ --source 21 FirstSample.java\n```\n\n在本书中，我们采用类和面向对象编程。但对于非常简单的程序，JEP 445 允许你省略类，前提是只有一个类。`FirstSample.java`\
  \ 文件可以简单地包含：\n\n```java\nvoid main()\n{\n   System.out.println(\"We will not use\
  \ 'Hello, World!'\");\n}\n```\n\n由于这些功能仍处于预览阶段，我不会在本版中使用它们，但在未来，第一个示例程序将会变得简单。\n\
  \n作为一名 C++ 程序员，你知道什么是类。Java 类类似于 C++ 类，但有几个可能会让你陷阱的差异。例如，在 Java 中，*所有*函数都是某个类的方法。（标准术语将它们称为方法，而不是成员函数。）因此，在\
  \ Java 中你必须为 `main` 方法提供一个壳类。你可能也熟悉 C++ 中*静态成员函数*的概念。这些是定义在类内部的成员函数。`void` 关键字表示此方法不返回值。最后，与\
  \ C++ 一样，`main` 方法总是静态的。\n\n现在你已经看到了所有 Java 程序的基本结构，请将注意力转向 `main` 方法的内容：\n\n```\n\
  {\n   System.out.println(\"We will not use 'Hello, World!'\");\n}\n```\n\n大括号标记了*方法体*（body）的开始和结束。在\
  \ Java 中，每个语句必须以分号结束。特别是，换行符并不标记语句的结束，因此必要时语句可以跨多行。`main` 方法体包含一个向控制台输出单行文本的语句。在这里，我们使用了\
  \ `System.out` 对象并调用了它的 `println` 方法。注意用于调用方法的点号。Java 使用通用的语法\n\n```\nobject.method(arguments)\n\
  ```\n\n作为其函数调用。在这种情况下，`println` 方法接收一个字符串参数。该方法在控制台上显示字符串参数。然后它结束输出行，因此每次调用 `println`\
  \ 都会在新行显示其输出。注意 Java 像 C/C++ 一样，使用双引号来分隔字符串。\n\nJava 中的方法像任何编程语言中的函数一样，可以使用零、一个或多个*参数*（arguments）。即使方法没有参数，你也必须使用空括号。例如，没有参数的\
  \ `println` 方法变体只打印一个空行。你通过调用调用它：\n\n```\nSystem.out.println();\n```\n\n`System.out`\
  \ 还有一个 `print` 方法，它不会在输出中添加换行符。例如，`System.out.print(\"Hello\")` 打印 `Hello` 而不换行。下一个输出将紧接着字母\
  \ `o` 出现。\n\n## 注释\n\nJava 中的注释与大多数编程语言一样，不会出现在可执行程序中。因此，你可以根据需要添加任意注释，而不用担心代码膨胀。Java\
  \ 有三种标记注释的方法。最常见的形式是 `//`。使用它来编写从 `//` 到行尾的注释。\n\n```\nSystem.out.println(\"We will\
  \ not use 'Hello, World!'\"); // 这样太可爱了吗？\n```\n\n当需要较长的注释时，你可以为每行标记 `//`，或者使用 `/*`\
  \ 和 `*/` 注释界定符来划分一段较长的注释。\n\n\n\n\n最后，第三种注释被用于自动生成文档。这种注释使用 `/**` 开始并用 `*/` 结束。你可以在\
  \ 索引 中看到这种类型的注释。关于这种类型的注释以及自动文档生成的更多信息，请参阅第 4 章。\n\n`FirstSample/FirstSample.java`\n\
  \n```java\n/**\n * This is the first sample program in Core Java Chapter 3\n * @version\
  \ 1.01 1997-03-22\n * @author Gary Cornell\n */\npublic class FirstSample\n{\n \
  \   public static void main(String[] args)\n    {\n        System.out.println(\"\
  We will not use 'Hello, World!'\");\n    }\n}\n```\n\n`/* */` 注释在 Java 中是不嵌套的。这意味着你可能无法通过将代码包裹在\
  \ `/*` 和 `*/` 之间禁用它，因为你想要禁用的代码本身可能包含 `*/` 分隔。\n\n## 数据类型\n\nJava 是一种*强类型语言*。这意味着每个变量都必须有一个声明的类型。Java\
  \ 中有八种*基本类型*。其中四种是整数类型；两种是浮点数类型；一种是字符类型 `char`，用于 Unicode 编码方案中的 UTF-16 代码单元（见索引）；还有一种用于表示真尔值的\
  \ `boolean` 类型。\n\nJava 有一个任意精度的算术包。然而，所谓的“大数”是 Java *对象*，而不是 Java 基本类型。你将在本章后面的部分看到如何使用它们。\n\
  \n### 整数类型\n\n整数类型用于没有小数部分的数字。允许负值。Java 提供了 索引 所示的四种整数类型。\n\nJava 整数类型\n\n| 类型 |\
  \ 存储要求 | 范围（包含） |\n| --- | --- | --- |\n| `byte` | 1 byte | –128 to 127 |\n| `short`\
  \ | 2 bytes | –32,768 to 32,767 |\n| `int` | 4 bytes | –2,147,483,648 to 2,147,483,647（略高于\
  \ 20 亿） |\n| `long` | 8 bytes | –9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
  \ |\n\n在大多数情况下，`int` 类型是最实用的。如果你想表示地球上的人口，你就需要求助于 `long`。`byte` 和 `short` 类型主要用于特殊应用程序，例如低级文件处理，或者在存储空间极其有限的情况下的大数组。\n\
  \n在 Java 中，整数类型的范围不依赖于运行 Java 代码的机器。这减轻了想要将软件从一个平台迁移到另一个平台（甚至是在同一平台的不同操作系统之间迁移）的程序员的巨大苦恼。相比之下，C\
  \ 和 C++ 程序为每个处理器使用最高效的整数类型。因此，在 32 位处理器上运行良好的 C 程序在 16 位系统上可能会出现整数溢出。由于 Java 程序必须在所有机器上运行具有相同的结果，因此各种类型的范围是固定的。\n\
  \n长整数有后缀 `L` 或 `l`（例如 `4000000000L`）。十六进制数有前缀 `0x` 或 `0X`（例如 `0xCAFE`）。八进制数有前缀 `0`（例如\
  \ `010` 是 8）——自然地，这可能会引起困惑，很少程序员使用八进制常量。\n\n你可以使用前缀 `0b` 或 `0B` 写二进制数字。例如，`0b1001`\
  \ 是 9。你可以在数字字面量添加下划线，例如 `1_000_000`（或 `0b1111_0100_0010_0100_0000`）来表示百万。下划线仅供人类阅读。Java\
  \ 编译器会简单地移除它们。\n\n在 C 和 C++ 中，`int` 和 `long` 等类型的大小取决于目标平台。在像 8086 的 16 位处理器上，整数是\
  \ 2 字节，但在 Pentium 或 SPARC 等 32 位处理器上则是 4 字节。同样，`long` 值在 32 位处理器上是 4 字节，在 64 位处理器上是\
  \ 8 字节。这些差异使得编写跨平台程序具有挑战性。在 Java 中，所有数值类型的大小都与平台无关。\n\n注意 Java 没有 `int`、`long`、`short`\
  \ 或 `byte` 类型的无符号版本。\n\n如果你处理的是永远不会为负的整数值，并且确实需要额外的位，可以在小心的情况下将符号整数值解释为无符号。例如，与其让\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能可以使用 `float`。\n\n### 浮点类型\n\n浮点类型表示带有小数部分的数字。浮点类型见\
  \ 索引。\n\n浮点类型\n\n| 类型 | 存储要求 | 范围 |\n| --- | --- | --- |\n| `float` | 4 bytes |\
  \ ±3.4028235E38（6–7 位有效数字） |\n| `double` | 8 bytes | ±1.7976931348623157E308（15\
  \ 位有效数字） |\n\n`double` 的名称是指这些数字的精度是 `float` 的两倍。\n\n`float` 类型数字有后缀 `F` 或 `f`（例如\
  \ `3.14F`）。不带 `F` 后缀的浮点数（如 `3.14`）始终被视为 `double`。你可以选择性提供 `D` 或 `d` 后缀（例如 `3.14D`）。\n\
  \n`E` 或 `e` 表示十进制指数。例如，`1.729E3` 等于 `1729`。\n\n可以用十六进制指定浮点字面量。例如，0.125 = 2^(–3)\
  \ 可以写为 `0x1.0p-3`。在十六进制表示中，你使用 `p` 而不是 `e` 来表示指数。（`e` 是十六进制数字）。注意尾数是用十六进制写的，而指数是用十进制写的。指数的底是\
  \ 2，而不是 10。\n\n所有浮点运算都遵循 IEEE 754 规范。特别是，有三个特殊的浮点值来表示溢出和错误：\n\n*   正无穷\n*   负无穷\n\
  *   NaN（不是数字）\n\n例如，一个正浮点数除以 0 的结果是正无穷。将 0.0 除以 0 或负数的平方根会得到 NaN。\n\n常量 `Double.POSITIVE_INFINITY`、`Double.NEGATIVE_INFINITY`\
  \ 和 `Double.NaN`（以及相应的 `Float` 常量）表示这些特殊值，但在实践中很少使用。特别是，你不能通过测试\n\n```java\nif (x\
  \ == Double.NaN) // 永远为真\n```\n\n来检查特定结果是否等于 `Double.NaN`。所有的“不是数字”值都被视为不同的。然而，你可以使用\
  \ `Double.isNaN` 方法：\n\n```java\nif (Double.isNaN(x)) // 检查 x 是否为“不是数字”\n```\n\n\
  \n\n\n\n浮点数`not` 适用于不能容舍入误差的财务计算。例如，命令 `System.out.println(2.0 - 1.1)` 输出的是 `0.8999999999999999`，而不是你预期的\
  \ `0.9`。这种舍入误差的产生是因为浮点数是用二进制数系统表示的。分数 1/10 并没有精确的二进制表示，就像在十进制系统中没有 1/3 的分数的精确表示一样。如果你需要进行不产生舍入误差的精确数值计算，请使用\
  \ `BigDecimal` 类，该类在本章稍后部分介绍。\n\n### `char` 类型\n\n`char` 类型最初设计用于描述单个字符。然而，现在情况已不再如此。如今，某些\
  \ Unicode 字符可以用一个 `char` 值来描述，而另一些 Unicode 字符则需要两个 `char` 值。请阅读下一节了解详细细节。\n\n`char`\
  \ 字面量值括在单引号中。例如，`'A'` 是一个值为 65 的字符常量。它与 `\"A\"` 不同，后者是一个包含单个字符的字符串。`char` 类型的值可以表示为从\
  \ `\\u0000` 到 `\\uFFFF` 的十六进制值。\n\n除了 `\\u` 转义序列外，还有几种用于特殊字符的转义序列，如 [](#index.xhtml_ch03table03）所示。你可以在引号字符字面量和字符串内部这些转义序列，例如\
  \ `'\\u005B'` 或 `\"Hello\\n\"`。`\\u` 转义序列（但其他转义序列均不是）甚至可以用在引号字符常量和字符串之外。例如，\n\n\
  ```\npublic static void main(String\\u005B\\u005D args)\n```\n\n这是完全合法的——`\\u005B`\
  \ 和 `\\u005D` 是 `[` 和 `]` 的编码。\n\n#### 特殊字符的转义序列\n\n| 转义序列 | 名称 | Unicode 值 |\n\
  | --- | --- | --- |\n| `\\b` | 退格符 | `\\u0008` |\n| `\\t` | 制表符 | `\\u0009` |\n\
  | `\\n` | 换符 | `\\u000a` |\n| `\\r` | 回车符 | `\\u000d` |\n| `\\f` | 换符 | `\\u000c`\
  \ |\n| `\\\"` | 双引号 | `\\u0022` |\n| `\\'` | 单引号 | `\\u0027` |\n| `\\\\` | 反斜杠 |\
  \ `\\u005c` |\n| `\\s` | 空格。用于文本块以保留尾部空格。 | `\\u0020` |\n| `\\``newline` | 仅用于文本块：将此行与下一行合并\
  \ | — |\n\nUnicode 转义序列在代码解析之前就会被处理。例如，`\"\\u0022+\\u0022\"` `not` 是一个由引号包围加号（U+0022）组成的字符串。相反，`\\\
  u0022` 在解析之前会被转换为 `\"`，从而产生 `\"\"+\"\"`，即一个空字符串。\n\n更隐险的是，你必须警惕注释中的 `\\u`。注释\n\n\
  ```\n// \\u000A is a newline\n```\n\n会产生语法错误，因为当程序读取时，`\\u000A` 会被替换为换行符。同样，注释\n\
  \n```\n// look inside c:\\users\n```\n\n会产生语法错误，因为 `\\u` 后面没有跟着四个十六进制数字。\n\n在 Unicode\
  \ 转义序列中可以有任意数量的 `u`：`\\u00E9` 和 `\\uuu00E9` 都表示字符 é。这种奇怪现象是有原因的。考虑一个快乐地在 Unicode\
  \ 环境下编写代码的程序员，由于某种古老的原因，被迫强制仅以 ASCII 格式提交代码。转换工具可以将任何大于 U+007F 的字符转换为 Unicode 转义序列，并在每个现有的\
  \ Unicode 转义序列上添加一个 `u`。这使得转换是可逆的。例如，`\\uD800 é` 被转换为 `\\uuuD800 \\u00E9`，并可以转换回\
  \ `\\uD800 é`。\n\n### Unicode 与 `char` 类型\n\n为了完全理解 `char` 类型，你必须了解 Unicode 编码方案。在\
  \ Unicode 之前，有许多不同的字符编码标准：美国的 ASCII、西欧语言的 ISO 8859-1、俄语的 KOI-8、中文的 GB18030 和 BIG-5\
  \ 等。这导致了两个问题。首先，特定的代码值在不同的编码方案中对应不同的字母。其次，字符集语言的编码长度可：某些常用字符编码为单字节，而另一些需要两个或更多字节。\n\
  \nUnicode 的设计是为了解决这两个问题。当统一工作在 20 世纪统一工作开始时，固定的 2 字节代码足以编码世界上所有语言使用的所有字符，并留有未来扩展的空间——尽管当时大家是这么认为的。1991\
  \ 年，Unicode 1.0 发布，使用了可用 65,536 个代码值中略于一半的数量。Java 从一开始就被设计为使用 16 位。\n\n\n\n\n考虑一下\
  \ \U0001F1EE\U0001F1F9 旗。你感知到一个单一符号：意大利国旗。然而，这个符号是由两个 Unicode 码点组成的：`U+1F1EE`（区域指示符号字母\
  \ I）和 `U+1F1F9`（区域指示符号字母 T）。使用这些区域指示可以形成约 250 种旗帜。另一方面，海盗旗 \U0001F3F4‍☠️ 由 `U+1F3F4`（飘扬的黑旗）、`U+200D`（零宽连接符）、`U+2620`（骷髅交叉骨）和\
  \ `U+FE0F`（变体选择器-16）组成。在 Java 中，你需要四个 `char` 值来表示第一个旗帜，第二个则需要五个。\n\n总而言之，一个可见的字符或符号被编码为若干\
  \ `char` 值的序列，而且几乎不需要查看单个值。请始终处理字符串（参见 索引），而不要担心它们作为 `char` 序列的表示。\n\n### `boolean`\
  \ 类型\n\n`boolean` 类型有两个值：`false` 和 `true`。它用于评估逻辑条件。你不能在整数和 `boolean` 值之间进行转换。\n\
  \n在 C++ 中，数字甚至指针都可以用来替代 `boolean` 值。值 `0` 等于 `bool` 值 `false`，非零值等于 `true`。在 Java\
  \ 中情况**并非**如此。因此，Java 程序员可以避免诸如所示的意外：\n\n```\nif (x = 0) // 哎……本想写 x == 0\n```\n\
  \n在 C++ 中，该测试可以编译并运行，结果始终为 `false`。在 Java 中，该测试无法编译，因为整数表达式 `x = 0` 无法转换为 `boolean`\
  \ 值。\n\n## 变量与常量\n\n与所有编程语言一样，变量用于存储值。常量是不改变值的变量。在接下来的章节中，你将学习如何声明变量和常量。\n\n###\
  \ 声明变量\n\n在 Java 中，每个变量都有一个 `type`。你通过先放置类型、后放置变量名来声明变量。以下是一些示例：\n\n```\ndouble\
  \ salary;\nint vacationDays;\nlong earthPopulation;\nboolean done;\n```\n\n注意每个声明末尾的分号。分号是必要的，因为声明是一个完整的\
  \ Java 语句，它必须以分号结束。\n\n变量名（以及其他名称）的标识符由字母、数字、货币符号和“标点连接符”组成。第一个字符不能是数字。\n\n变量名内部不能像\
  \ `'+'` 或 `'©'` 这样的符号，也不能有空格。字母大小写敏感：`main` 和 `Main` 是不同的标识符。标识符的长度本质上是无限的。\n\n\
  Java 中的“字母”、“数字”和“货币符号”术语比大多数语言要广泛得多。字母是*任何*表示语言中字母的 Unicode 字符。例如，德国用户可以在变量名中使用如\
  \ `ä` 等变音符号；希腊使用者可以使用 `π`。同样，数字是 `0`–`9` 以及*任何*表示数字的 Unicode 字符。货币符号包括 `$`、`€`、`¥`\
  \ 等。标点连接符包括下划线字符 `_`、波浪线 `﹏` 以及其他几个。在实践中，大多数程序员坚持使用 `A`-`Z`、`a`-`z`、`0`-`9` 和下划线\
  \ `_`。\n\n如果你真的好奇哪些 Unicode 字符可以用于标识符，可以使用 `Character` 类中的 `isJavaIdentifierStart`\
  \ 和 `isJavaIdentifierPart` 方法进行检查。\n\n尽管 `$` 是标识符中的有效字符，你不应该在自己的代码中使用它。它旨在用于由 Java\
  \ 编译器和其他工具生成的名称。\n\n你还不能将如 `class` 之类的 Java 关键字用变量名。\n\n下划线可以是标识符的一部分。这在常量名中很常见，例如\
  \ `Double.POSITIVE_INFINITY`。然而，单个下划线 `_` 是一个保留字。\n\n从 Java 21 开始，单个下划线 `_` 表示一个语法上要求但从不使用的变量。你将在第\
  \ 6 章和第 7 章中看到示例。\n\n你可以在一行中声明多个变量：\n\n```\nint i, j; // 两个都是整数\n```\n\n我不推荐这种风格。如果你单独声明每个变量，你的程序将更容易阅读。\n\
  \n正如你所见，名称对大小写敏感的，例如 `hireday` 和 `hireDay` 是两个不同的名称。通常情况下，你不应该拥有仅在字母大小写上不同的区别的名称。然而，有时很难为变量起一个好名字。许多程序员会给变量起与类型相同的名称，例如：\n\
  \n```\nBox box; // \"Box\" 是类型，“box\" 是变量名\n```\n\n其他程序员更倾向于为变量使用“a”前缀：\n\n```\n\
  Box aBox;\n```\n\n### 初始化变量\n\n在声明变量后，你必须通过赋值语句显式地初始化它——你永远无法使用未初始化变量的值。例如，Java\
  \ 编译器会将以下语句标记为错误：\n\n```\nint vacationDays;\nSystem.out.println(vacationDays); //\
  \ 错误--变量未初始化\n```\n\n你通过在左侧使用变量名、等号（`=`）以及右侧某个带有适当值的 Java 表达式来为之前声明的变量赋值。\n\n```\n\
  int vacationDays;\nvacationDays = 12;\n```\n\n你可以在同一行内声明并初始化变量。例如：\n\n```\nint vacationDays\
  \ = 12;\n```\n\n最后，在 Java 中你可以在代码的任何地方放置声明。例如，以下代码是有效的：\n\n```\ndouble salary =\
  \ 65000.0;\nSystem.out.println(salary);\n```\n\n在 Java 中，将变量声明尽可能靠近它们使用的地方被认为是良好的风格。如果可以从初始值推断出类型，则不需要声明局部变量的类型。简单使用\
  \ `var` 关键字：\n\n```\nvar vacationDays = 12; // int\nvar greeting = \"Hello\";\n\
  ```\n\n### 常量\n\n在 Java 中，你使用 `final` 关键字来表示常量。例如：\n\n```java\npublic class Constants\n\
  {\n   public static void main(String[] args)\n   {\n      final double CM_PER_INCH\
  \ = 2.54;\n      double paperWidth = 8.5;\n      double paperHeight = 11;\n    \
  \  System.out.println(\"Paper size in centimeters: \"\n         + paperWidth * CM_PER_INCH\
  \ + \" by \" + paperHeight * CM_PER_INCH);\n   }\n}\n```\n\n`final` 关键字表示你可以对变量赋值一次，然后它的值就会固定。常量通常命名为大写。\n\
  \n在 Java 中，可能经常创建一个常量以便类内的多个方法可以使用。这些通常被称为*类常量*。使用 `static final` 关键字来设置类常量。这里是使用类类的示例：\n\
  \n```java\npublic class Constants2\n{\n    public static final double CM_PER_INCH\
  \ = 2.54;\n\n    public static void main(String[] args)\n    {\n       double paperWidth\
  \ = 8.5;\n       double paperHeight = 11;\n       System.out.println(\"Paper size\
  \ in centimeters: \"\n          + paperWidth * CM_PER_INCH + \" by \" + paperHeight\
  \ * CM_PER_INCH);\n    }\n}\n```\n\n注意类常量的定义出现在 `main` 方法之外。因此，该常量也可以用于同类的其他方法。此外，如果常量像本示例一样被声明为\
  \ `public`，那么其他类的方法也可以使用它——在我们的示例中，使用 `Constants2.CM_PER_INCH`。\n\n\n\n\n一些编码风格指南规定，大写字母仅应用于\
  \ `static final` 变量。如果你需要遵循此类风格指南，并且有一个本地常量，请决定什么对你更重要——它是局部的（因此使用小写），还是它肉眼可见是常量（`static`\
  \ 且大写）。\n\n`const` 是 Java 的一个关键字，但目前没有被用于任何地方。你必须使用 `final` 来定义常量。\n\n### 枚举类型\n\
  \n有时，一个变量应该只持有一组限制的值。例如，你可能出售四种尺寸的衣服：小号、中号、大号和大特号。当然，你可以将这些尺寸编码为整数 `1`、`2`、`3`、`4`\
  \ 或字符 `S`、`M`、`L` 和 `X`。但这样做很容易出错。变量很容易持有错误的值（例如 `0` 或 `m`）。\n\n每当出现这种情况时，你都可以定义自己的`枚举类型`。枚举类型具有有限数量的命名值。例如：\n\
  \n```\nenum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n```\n\n现在你可以声明这种类型的变量了：\n\
  \n```\nSize s = Size.MEDIUM;\n```\n\n`Size` 类型的变量只能持有类型声明中列出的值之一，或者是特殊的值 `null`，表示该变量未被赋予任何值。（有关\
  \ `null` 的更多信息，请参见第 4 章）。\n\n枚举类型将在第 5 章中详细讨论。\n\n## 运算符\n\n运算符用于组合值。正如你将在后续章节中看到的，Java\
  \ 拥有丰富的算术运算符、逻辑运算符和数学函数。\n\n### 算术运算符\n\n常用的算术运算符 `+`、`-`、`*` 和 `/` 在 Java 中用于加、减、乘除。\n\
  \n如果两个操作数都是整数，`/` 运算符表示整数除；否则表示浮点除法。整数除以 0 会抛出异常，而浮点除以 0 会产生无限或 NaN 结果。\n\n整数取余（有时称为\
  \ `modulus`）由 `%` 表示。例如，`15 / 2` 是 `7`，`15 % 2` 是 `1`，而 `15.0 / 2` 是 `7.5`。\n\n\
  当 `%` 的操作数之一为负时，结果也是负的。例如，如果 `n` 是偶数，`n % 2` 为 0；如果 `n` 是正奇数，则为 1；如果 `n` 是负奇数，则为\
  \ -1。为什么呢？在第一批计算机制造时，有人必须为负数操作数的整数取余运算制定规则。数学家们已经已知最优（或“欧几里得”）规则几百年：始终保持余数 ≥ 0。但那些先驱者并没有打开数学书，而是想出了看似合理但实际上并不方便的规则。\n\
  \n考虑这个问题：你计算时时针的位置。应用一个调整，并将其归一化为 `0` 到 `11` 之间的数字。这很容易：`(position + adjustment)\
  \ % 12`。但如果调整是负数呢？你可能会得到一个负数。所以你必须引入分支，或者使用 `((position + adjustment) % 12 + 12)\
  \ % 12`。无论哪种方法，都很麻烦。\n\n更好的解决办法是使用 `floorMod` 方法：`Math.floorMod(position + adjustment,\
  \ 12)` 始终产生 `0` 到 `11` 之间的值。遗憾的是，`floorMod` 对于负除数仍会产生负余，但这种情况在实践中并不经常发生。\n\nJava\
  \ 编程语言的目标之一是可移植性。无论由哪个虚拟机执行，计算都应该产生相同的结果。对于浮点数的算术计算，要实现这种可移植性可能会异常困难。`double` 类型使用\
  \ 64 位存储数值，但某些处理器使用 80 位浮点寄存器。这些寄存器在计算的中间步骤提供了额外的精度。\n\n但结果可能与全过程使用 64 位的计算不同。为了实现完美的可移植性，Java\
  \ 虚拟机的初始规范规定所有中间计算必须截断为 64 位。数值界非常讨厌这一点。计算速度变慢了，因为在流行的处理器上截断操作需要时间。出于原因，Java 编程语言进行了更新，以识别对最优性能和完美可复现性之间的冲突需求。虚拟机设计人员被允许在中间计算中使用扩展精度。然而，标记有\
  \ `strictfp` 关键字的方法必须使用严格的浮点操作，以产生可复现的结果。\n\n处理器已经变得更加灵活，它们现在可以高效地执行 64 位算术。从 Java\
  \ 17 开始，虚拟机再次要求执行严格的 64 位算术，`strictfp` 关键字现在已过时。\n\n### 数学函数和常量\n\n`Math` 类包含了你可能根据你的编程类型偶尔需要的各种数学函数。\n\
  \n要获取一个数字的平方根，请使用 `sqrt` 方法：\n\n```\ndouble x = 4;\ndouble y = Math.sqrt(x);\nSystem.out.println(y);\
  \ // 输出 2.0\n```\n\n`println` 方法和 `sqrt` 方法之间存在细微的。`println` 方法作用于 `System.out`\
  \ 对象。但 `Math` 类中的 `sqrt` 方法不作用于任何对象。\n\n`Math` 类提供了对数学常量 `π`、`τ` (2π) 和 `e` 的尽可能近似值：\n\
  \n```\nMath.PI\nMath.TAU\nMath.E\n```\n\n通过在文件顶部添加以下行，可以避免为数学方法和常量使用 `Math` 前缀：\n\
  \n```java\nimport static java.lang.Math.*;\n```\n\n例如：\n\n```\nSystem.out.println(\"\
  π的平方根是 \" + sqrt(PI));\n```\n\n静态导入将在第 4 章中介绍。\n\n`Math` 类中的方法使用计算机浮点单元程序以获得最高性能。如果完全预测的结果比性能更重要，请使用\
  \ `StrictMath` 类。它实现了“自由发行数学库”([`www.netlib.org/fdlibm`](https://www.netlib.org/fdlibm))\
  \ 中的算法，保证在所有平台上结果一致。\n\n`Math` 类提供了几种方法使整数算术更安全。当计算溢出时，数学运算符会静默返回错误结果。例如，十亿乘以三（`1000000000\
  \ * 3`）的结果为 `-1294967296`，因为最大的 `int` 值略大于二十亿。如果你调用 `Math.multiplyExact(1000000000,\
  \ 3)`，则生成异常。你可以捕捉该异常或让程序终止，而不是带着错误结果静默继续。还有 `addExact`、`subtractExact`、`incrementExact`、`decrementExact`、`negateExact`\
  \ 和 `absExact` 方法，其参数类型均为 `int` 和 `long`。\n\nJava 21 增加了一个 `Math.clamp` 方法，强制数字落在给定范围内。例如：\n\
  \n```\nMath.clamp(-1, 0, 10) // 太小，返回下界 0\nMath.clamp(11, 0, 10) // 太大，返回上界 10\n\
  Math.clamp(3, 0, 10) // 在范围内，返回值 3\n```\n\n### 数值类型之间的转换\n\n\n\n\n\n通常需要将一种数值类型转换为另一种类型。[](#index.xhtml_ch03fig01)显示了合法的转换。\n\
  \n![Figure](img/03_01.jpg)数值类型之间的合法转换\n\n[](#index.xhtml_ch03fig01)中的六个实线箭头表示不丢失信息的转换。三条虚线箭头表示可能会丢失精度的转换。例如，诸如\
  \ `123456789` 这样的大整数其位数超过了 `float` 类型能表示的位数。当将整数转换为 `float` 时，结果的值具有正确的数量级但丢失了部分精度。\n\
  \n```\nint n = 123456789;\nfloat f = n; // f is 1.23456792E8\n```\n\n当两个值使用二元运算符结合时（例如\
  \ `n + f`，其中 `n` 是整数，`f` 是浮点值），在执行操作之前，两个操作数都会被转换为共同类型。\n\n*   如果两个操作数中任意一个类型为 `double`，则另一个将转换为\
  \ `double`。\n*   否则，如果两个操作数中任意一个类型为 `float`，则另一个将转换为 `float`。\n*   否则，如果两个操作数中任意一个类型为\
  \ `long`，则另一个将转换为 `long`。\n*   否则，两个操作数都将转换为 `int`。\n\n### 强制转换 (Casts)\n\n在前面的节中，你看到\
  \ `int` 值在必要时会自动转换为 `double` 值。另一方面，显然在某些时候你希望将 `double` 视为整数。Java 中可以进行数值转换，但无疑可能会丢失信息。可能丢失信息的转换是通过\
  \ `casts`（强制转换）实现的。强制转换的语法是在括号中给出目标类型，后面紧跟变量名。例如：\n\n```\ndouble x = 9.997;\nint\
  \ nx = (int) x;\n```\n\n现在，变量 `nx` 的值为 `9`，因为将浮点值转换为整数会丢弃小数部分。\n\n如果你想将浮点数 `round`\
  \ 到最`nearest` 整数（这在大多数情况下是一个更有用的操作），请使用 `Math.round` 方法：\n\n```\ndouble x = 9.997;\n\
  int nx = (int) Math.round(x);\n```\n\n现在，变量 `nx` 的值为 `10`。当你调用 `round` 时，仍然需要使用强制转换\
  \ `(int)`。这是因为 `round` 方法返回值是 `long`，而 `long` 只能通过显式强制转换赋予 `int`，因为可能存在信息丢失。\n\n\
  如果你尝试将一个类型的数字转换为另一个超出目标类型范围的类型，结果将是一个取值不同的截断数字。例如，`(byte) 300` 实际上是 `44`。\n\n你不能在\
  \ `boolean` 值和任何数值类型之间进行强制转换。这种约定防止了常见的错误。在需要将 `boolean` 值转换为数字的极少数情况下，可以使用条件表达式，如\
  \ `b ? 1 : 0`。\n\n### 赋值 (Assignment)\n\n在赋值中使用二元运算符有一个方便的快捷方式。例如，`compound assignment\
  \ operator`（复合赋值运算符）\n\n```\nx += 4;\n```\n\n它等于\n\n```\nx = x + 4;\n```\n\n（通常情况下，将运算符放在\
  \ `=` 符号的左侧，例如 `*=` 或 `%=`。）\n\n如果复合赋值运算符产生的值类型与左侧类型不同，则它会被强制转换以匹配。例如，如果 `x` 是一个\
  \ `int`，那么语句\n\n```\nx += 3.5;\n```\n\n是有效的。它将 `x` 设置为 `(int)(x + 3.5)`，即 `x + 3`，且没有任何警告！\n\
  \n从 Java 20 开始，如果你使用 `-Xlint` 命令行选项进行编译，将获得警告。\n\n注意在 Java 中，赋值是一个 `expression`（表达式）。也就是说，它有一个值——即被赋值的值。你可以使用该值——例如，将其赋值给另一个变量。考虑这些语句：\n\
  \n```\nint x = 1;\nint y = x += 4;\n```\n\n`x += 4` 的值为 `5`，因为这是赋值给 `x` 的值。接下来，该值被赋值给\
  \ `y`。\n\n许多程序员发现这种嵌套赋值令人困惑，更倾向于写得更清晰一些，如下所示：\n\n```\nint x = 1;\nx += 4;\nint y\
  \ = x;\n```\n\n### 递增递减运算符 (Increment and Decrement Operators)\n\n程序员当然知道，数值变量最常用的操作之一是加减\
  \ 1。Java 遵循 C 和 C++ 的做法，同时拥有递增和递减运算符：`n++` 将变量 `n` 的当前值加 1，`n--` 将其减 1。例如，代码\n\n\
  ```\nint n = 12;\nn++;\n```\n\n将 `n` 改变为 `13`。由于这些运算符会改变变量的值，因此它们不能应用于数字本身。例如，`4++`\
  \ 不是合法的语句。\n\n这些运算符有两种形式；你刚刚看到了放在操作数之后的后置形式。前缀形式也存在。后置形式返回递增之前的值，而前缀形式返回递增之后的值。例如：\n\
  \n```\nint n = 12;\nint m = n++; // m is 12, n is 13\nint b = ++n; // b is 14, n\
  \ is 14\n```\n\n### 关系运算符 (Relational Operators)\n\nJava 拥有一完整的关系运算符来比较两个值，并返回 `boolean`\
  \ 结果。测试相等性请使用 `==`。例如，\n\n```\n3 == 7\n```\n\n是 `false`。使用 `!=` 表示不相等。例如，\n\n```\n\
  3 != 7\n```\n\n是 `true`。最后，你还有常用的 `<`（小于）、`>`（大于）、`<=`（小于等于）和 `>=`（大于等于）运算符。\n\n\
  ### 逻辑运算符 (Logical Operators)\n\nJava 遵循 C++，使用 `&&` 作为“与”运算符，使用 `||` 作为“或”运算符。正如你可以很容易记住的，`!`\
  \ 是否定运算符。`&&` 和 `||` 运算符以“短路”方式求值：如果第一个操作数已经决定了结果，则不对第二个操作数求值。如果你使用 `&&` 运算符结合两个表达式，\n\
  \n```\nexpression1 && expression2\n```\n\n且第一个表达式的值被确定为 `false`，那么结果不可能为 `true`。因此，第二个表达式不会被计算。这种行为可以用来避免错误。例如，在表达式\n\
  \n```\nx != 0 && 1 / x > x + y // no division by 0\n```\n\n`x` 为 0 时，`1 / x` 不计算。同样，`expression1\
  \ || expression2` 的值如果第一个表达式为 `true` 则自动为 `true`，而无需评估第二个。\n\n### 条件运算符 (The Conditional\
  \ Operator)\n\nJava 提供了 `conditional` `?:` 运算符，根据布尔表达式选择值。表达式\n\n```\ncondition\
  \ ? expression1 : expression2\n```\n\n当条件为 `true` 时求值为第一个表达式，否则为第二个。例如，`x < y ?\
  \ x : y` 返回 `x` 和 `y` 中的较小值。\n\n### Switch 表达式 (Switch Expressions)\n\n如果你需要在多个值之间进行选择，那么可以使用\
  \ `switch` 表达式，它是 Java 14 引入的。它看起来如下：\n\n```\nString seasonName = switch (seasonCode)\n\
  \   {\n      case 0 -> \"Spring\";\n      case 1 -> \"Summer\";\n      case 2 ->\
  \ \"Fall\";\n      case 3 -> \"Winter\";\n      default -> \"???\";\n   };\n```\n\
  \n`switch` 关键字后面的表达式被称为*选择器表达式*（selector expression），其值是*选择器*（selector）。目前，我们只考虑整型类型（`int`、`char`、`byte`\
  \ 或 `short`）、字符串或枚举类型的常量作为选择器和标签。在第 5 节](../05/index.xhtml) 中，你将看到如何对其他类型使用 `switch`\
  \ 表达式进行*模式匹配*（pattern matching）。\n\n`switch` 表达式像每个表达式一样有一个值。注意每个分支中值前面的 `->` 箭头。\n\
  \n\n\n\n\n截至 Java 14，共有四种（！）`switch` 形式。本节重点介绍最实用的形式。请参阅 [#index.xhtml_ch03lev2sec30]\
  \ 获取关于所有形式 `switch` 表达式和语句的详细讨论。\n\n`case` 标签必须是一个编译时常量，其类型与选择器类型匹配。你可以为每个 `case`\
  \ 提供多个标签，并用逗号分隔：\n\n```java\nint numLetters = switch (seasonName)\n   {\n      case\
  \ \"Spring\", \"Summer\", \"Winter\" -> 6;\n      case \"Fall\" -> 4;\n      default\
  \ -> -1;\n   };\n```\n\n当你对枚举常量使用 `switch` 表达式时，不需要在每个标签中提供枚举名称——它是从 `switch` 值推断出来的。例如：\n\
  \n```java\nenum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE };\n. . . \nSize itemSize\
  \ = . . .;\nString label = switch (itemSize)\n   {\n      case SMALL -> \"S\"; //\
  \ 不需要使用 Size.SMALL\n      case MEDIUM -> \"M\";\n      case LARGE -> \"L\";\n  \
  \    case EXTRA_LARGE -> \"XL\";\n   };\n```\n\n在示例中，由于每个可能的值都有一个对应的 case，因此省略 `default`\
  \ 是合法的。\n\n当选择器是 `enum` 且你没有涵盖所有常量的 case 时，你需要一个 `default`。使用整数或 `String` 作为选择器的\
  \ `switch` 表达式必须始终有一个 `default`。\n\n如果选择器为 `null`，将抛出 `NullPointerException`。如果你想避免这种可能性，可以这样添加一个\
  \ `case null`：\n\n```java\nString label = switch (itemSize)\n   {\n      . . .\n\
  \      case null -> \"???\"; \n   };\n```\n\n这是 Java 21 的特性。请注意，`default` *不会*匹配\
  \ `null`！\n\n### 位运算符\n\n对于任何整数类型，你都拥有可以直接操作构成整数的二进制位的运算符。这意味着你可以使用掩码技术来获取数字中的单个位。位运算符有：\n\
  \n```\n& (\"与\")   | (\"或\")   ^ (\"异或\")   ~ (\"取反\")\n```\n\n这些运算符作用于位模式。例如，如果\
  \ `n` 是一个整数变量，那么\n\n```java\nint fourthBitFromRight = (n & 0b1000) / 0b1000;\n```\n\
  \n如果 `n` 的二进制表示从右侧数的第四位是 `1`，则返回 `1`，否则返回 `0`。使用 `&` 配合 2 的相应幂可以过滤掉除位以外的所有位。\n\n\
  当应用于 `boolean` 值时，`&` 和 `|` 运算符产生 `boolean` 值。这些运算符与 `&&` 和 `||` 运算符类似，区别在于 `&`\
  \ 和 `|` 不是以短路方式求值的——也就是说在计算结果之前，两个操作数都会求值。\n\n还有 `>>` 和 `<<` 运算符，可以将位模式向右或向左移动。当你需要构建位模式进行位掩码时，这些运算符非常方便：\n\
  \n```java\nint fourthBitFromRight = (n & (1 << 3)) >> 3;\n```\n\n最后，`>>>` 运算符会将高位填充零，而\
  \ `>>` 则会将符号位扩展到高位。没有 `<<<` 运算符。\n\n移位运算符的右操作数会对 32 取模（除非左操作数是 `long`，在这种情况下右操作数对\
  \ 64 取模）。例如，`1 << 35` 的值与 `1 << 3` 或 `8` 相同。\n\n在 C/C++ 中，无法保证 `>>` 执行的是算术移动（扩展符号位）还是逻辑移动（填充零）。实现者可以自由选择更高效的一种。这意味着\
  \ C/C++ 的 `>>` 运算符对于负数可能会产生取决于实现的结果。Java 消除了了这种不确定性。\n\n`Integer` 类有许多位级操作的静态方法。例如，`Integer.bitCount(n)`\
  \ 返回 `n` 的二进制表示中 1 的个数，而 `Integer.reverse(n)` 返回通过反转 `n` 的位得到的数值。并没有多少程序员需要位级操作，但如果你确实需要，可以查看\
  \ `Integer` 类，看看是否有方法可以完成你需要的任务。\n\n### 括号和运算符层次\n\n[#index.xhtml_ch03table04] 显示了运算符的优先级。如果不使用括号，操作将按照所示的层级顺序执行。同一层级的运算符从左到右处理，但表中指示的右结合运算符除外。例如，`&&`\
  \ 的优先级高于 `||`，所以表达式\n\n```\na && b || c\n```\n\n意味着\n\n```\n(a && b) || c\n```\n\
  \n由于 `+=` 是右到左结合的，表达式\n\n```\na += b += c\n```\n\n意味着\n\n```\na += (b += c)\n```\n\
  \n也就是说，`b += c` 的值（加后 `b` 的值）被加到 `a`。\n\n#### 运算符优先级\n\n| 运算符 | 结合性 |\n| --- | ---\
  \ |\n| `[] . ()` (方法调用) | 从左到右 |\n| `! ~ ++ -- +` | |\n| `* / % + -` | |\n| | |\n\
  | `<< <<` | 从左到右 |\n| `>> >>>` | 从左到右 |\n| `< <= >= >` | 从左到右 |\n| `== !=` | 从左到右\
  \ |\n| `&` | 从左到右 |\n| `^` | 从左到右 |\n| `|` | 从左到右 |\n| `&&` | 从左到右 |\n| `||` | 从左到右\
  \ |\n| `= += -= *= /= &= <<= >> >>= ?=` | 从右到左 |\n\n### 字符串\n\n从概念上讲，字符串是字符的序列。正如你在\
  \ [#index.xhtml_ch03table04] 中看到的，你可以使用双引号创建字符串字面量。如果字符串字面量需要包含双引号或换行，请使用转义序列。\n\
  \n```java\nString s = \"He said \\\"Hello\\nWorld\\\"\";\n```\n\n### 拼接\n\nJava\
  \ 与大多数语言一样，允许使用 `+` 来连接两个字符串。\n\n```java\nString expletive = \"Expletive\";\nString\
  \ PG13 = \"deleted\";\nString message = expletive + PG13;\n```\n\n上述代码将 `message`\
  \ 设置为字符串 `\"Expletleted\"`。（注意单词之间没有空格：`+` 运算符按接收到的顺序连接。）\n\n当你将字符串与一个非字符串的值连接时，后者会被转换为字符串。例如\n\
  \n```java\nint age = 13;\nString rating = \"PG\" + age;\n```\n\n将 `rating` 设置为字符串\
  \ `\"PG13\"`。\n\n此功能通常用于输出语句。例如\n\n```java\nSystem.out.println(\"The answer is \"\
  \ + answer);\n```\n\n这是完全可以的，并按你预期的结果打印（并且由于单词 的空格是正确的）。\n\n注意带有 `+` 运算符表达式的字符串拼接，例如：\n\
  \n```java\nint age = 42;\nString output = \"Next year, you'll be \" + age + 1 +\
  \ \".\"; // 错误\n```\n\n由于 `+` 运算符从左到右求值，结果是 `\"Next year, you'll be 421.\"`。解决方法是使用括号：\n\
  \n```java\nString output = \"Next year, you'll be \" + (age + 1) + \".\"; // 正确\n\
  ```\n\n如果你需要通过分隔符将多个字符串组合，使用静态的 `join` 方法：\n\n```java\nString all = String.join(\"\
  \ / \", \"S\", \"M\", \"L\", \"XL\");\n   // all 是字符串 \"S / M / L / XL\"\n```\n\n\
  `repeat` 方法产生一个重复指定次数字符串的字符串：\n\n```java\nString repeated = \"Java\".repeat(3);\
  \ // repeated 是 \"JavaJavaJava\"\n```\n\n### 分割字符串\n\n\n\n\n\n`split` 方法根据给定的边界将字符串拆分为多个部分。例如，\n\
  \n```\n\"Hello, World!\".split(\" \")\n```\n\n会产生一个包含两个元素的数组：字符串 `\"Hello,\"` 和\
  \ `\"World!\"`。（数组在[](#index.xhtml_ch03lev1sec10) 中被介绍。）\n\n`split` 方法的参数是一个`regular\
  \ expression`（正则表达式），用于描述拆分应该发生的位置。关于正则表达式的详细讨论，请参阅第二卷第 2 章。[](#index.xhtml_splitting-patterns)\
  \ 包含了一些实用的模式。\n\n## 分割模式\n\n| 模式 | 说明 |\n| --- | --- |\n| `\"\\\\s+\"` | 空白字符 |\n\
  | `\"\\\\s*,\\\\s*\"` | 带可选空格的逗号 |\n| `\"\\\\.\"` | 句号 |\n| `\\\\PL+` |任意非字母 |\n\
  | `\"\\\\R\"` | 换行符 |\n| `\"\\\\b\"` | 单词边界 |\n| `\"\\\\b{g}\"` | 字符簇边界（Java 9 起支持）\
  \ |\n\n沿`grapheme cluster`（字符簇）边界分割会将字符串拆分为人类感知的组成字符：\n\n```\n\"Ciao \U0001F1EE\U0001F1F9\
  \".split(\"\\\\b{g}\") // 返回一个包含六个元素的数组：\"C\", \"i\", \"a\", \"o\", \" \", \"\U0001F1EE\
  \U0001F1F9\"\n```\n\n## 索引与子字符串\n\nJava 字符串是`char` 值的序列。正如你在[](#index.xhtml_unicode-and-char)中看到的，`char`\
  \ 数据类型用于表示 UTF-16 编码中的 Unicode 码点。某些字符可以使用单个 `char` 值表示，但许多字符和符号需要多个 `char` 值。\n\
  \n虚拟机并不要求将字符串存储为`char` 值的序列。为了效率，只包含单字节代码单元的字符串存储为`byte` 序列，而其他所有字符串存储为`char`序列。这是一个实现细节。\n\
  \n`length` 方法返回给定字符串所需的`char` 值数量。例如：\n\n```\nString greeting = \"Ciao \U0001F1EE\
  \U0001F1F9\";\nint n = greeting.length(); // 结果为 9\n```\n\n调用 `s.charAt(n)` 返回位置\
  \ `n` 处的 `char` 值，其中 `n` 于 `0` 和 `s.length()` - 1 之间。（类似于 C 和 C++，Java 字符串中的位置也从\
  \ `0` 开始计数。）例如：\n\n```\nchar first = greeting.charAt(0); // first 是 67 或 'C'\nchar\
  \ last = greeting.charAt(8); // last 是 56825\n```\n\n然而，这些调用并不是很有用。最后一个 `char` 值仅仅是旗帜符号的一部分，你通常并不关心这些值是什么。\n\
  \n尽管如此，你有时需要知道子字符串在字符串中的位置。使用 `indexOf` 方法：\n\n```\nString sub = \" \";\nint start\
  \ = greeting.indexOf(sub); // 4\n```\n\n恰好，空格的位置（或 `index` 索引）是 4，但具体数值并不重要。它取决于子字符串之前的字符，以及编码每个字符所需的`char`\
  \ 值数量。始终将索引视为一个不透明的数字，而不是其之前感知的字符计数。\n\n你可以计算下一个字符的起始位置：\n\n```\nint nextStart =\
  \ start + sub.length(); // 5\n```\n\n恰好，字符串 `\" \"` 的长度为 1，但不要硬编码字符串的长度。请始终使用 `length`\
  \ 方法。\n\n你可以使用 `String` 类的 `substring` 方法从较大的字符串中提取子字符串。例如：\n\n```\nString greeting\
  \ = \"Hello, World!\";\nint n = greeting.indexOf(\",\");\nString s = greeting.substring(0,\
  \ n);\n```\n\n这会创建一个由字符 `\"Hello\"` 组成的字符串。\n\n`substring` 的第二个参数是你**不**想要复制的起始。在我们案例中，我们复制了从开始到但不包括逗号的所有内容。\n\
  \n注意字符串 `s.substring(a, b)` 的长度始终为 `b - a`。例如，子字符串 `\"Hello\"` 的长度为 `5 - 0 = 5`。\n\
  \n## 字符串是不可变的\n\n`String` 类没有提供让你`change`现有字符串中字符的方法。如果你想将 `greeting` 变为 `\"Help!\"\
  `，你不能直接将 `greeting` 的最后位置改为 `'p'` 和 `'!'`。如果你是 C 程序员，这可能会让你感到无助。我们要如何修改字符串？在 Java\
  \ 中，这非常简单：将你想保留的子字符串与你想替换的字符拼接起来。\n\n```\nString greeting = \"Hello\";\nint n =\
  \ greeting.indexOf(\"lo\");\ngreeting = greeting.substring(0, n) + \"p!\";\n```\n\
  \n此声明将变量 `greeting` 的当前值更改为 `\"Help!\"`。\n\n由于你不能更改 Java 字符串中的单个字符，文档将 `String`\
  \ 类对象称为`immutable`（不可变的）。正如数字 `3` 始终是 `3`，字符串 `\"Hello\"` 始终包含字符 `H`、e`、```````o`\
  \ 的代码单元序列。你不能改变这些值。但正如你所看到的，你可以更改字符串变量 `greeting` 的内容并使其引用不同的字符串，就像你可以让数值变量 `3`\
  \ 持有 `3` 一样。\n\nJava 的设计者决定，共享的效率超过了创建字符串的低效。好吧，也不如此。如果你复制一个字符串变量，原始变量和副本共享字符串池中的相同位置。\n\
  \n### 测试字符串相等性\n\n要测试两个字符串是否相等，请使用 `equals` 方法。表达式\n\n```\ns.equals(t)\n```\n\n\
  如果字符串 `s` 和 `t` 相等，则返回 `true`，否则返回 `false`。注意 `s` 和 `t` 可以是字符串变量也可以是字符串字面量。例如，表达式\n\
  \n```\n\"Hello\".equals(greeting)\n```\n\n是完全合法的。要测试两个字符串除了大小写区别外是否相同，请使用 `equalsIgnoreCase`\
  \ 方法。\n\n```\n\"Hello\".equalsIgnoreCase(\"hello\")\n```\n\n\n\n\n\n不要使用 `==` 运算符来测试两个字符串是否相等！它只确定字符串是否存储在相同的内存位置。诚然，如果字符串位于相同的位置，它们一定是相等的。但完全可能在不同的地方存储相同字符串的多个副本。\n\
  \n```\nString greeting = \"Hello\"; // 将 greeting 初始化为字符串\ngreeting == \"Hello\"\
  \ // true\ngreeting.substring(0, greeting.indexOf(\"l\")) == \"He\" // false\ngreeting.substring(0,\
  \ greeting.indexOf(\"l\")).equals(\"He\") // true\n```\n\n如果虚拟机总是安排相等的字符串共享的，那么你就可以使用\
  \ `==` 运算符来测试相等性。但只有字符串字面量会被共享，运行时计算出的字符串则不会。因此，永远不要使用 `==` 来比较字符串。请始终使用 `equals`。\n\
  \n如果你习惯 C++ 的 `string` 类，必须对相等性测试格外小心。C++ 的 `string` 类重载了 `==` 运算符来测试字符串内容的相等性。在\
  \ Java 中，字符串乍看起来与数字相似。它们有字面量值和 `+` 运算符，但它们实际上是对象。正如你将在下一章看到的，`==` 运算符始终检查两个对象是否是同一个对象。\n\
  \nC 程序员知道永远不要使用 `==` 来比较 `char*` 字符串，而是使用 `strcmp`。Java 方法 `compareTo` 正是 `strcmp`\
  \ 的等价物。你可以使用\n\n```\nif (greeting.compareTo(\"Hello\") == 0) . . .\n```\n\n但使用 `equals`\
  \ 似乎更清晰。\n\n### 空字符串和空引用\n\n空字符串 `\"\"` 是长度为 0 的字符串。你可以通过调用以下方法测试字符串是否为空：\n\n```\n\
  if (str.length() == 0)\n```\n\n或者\n\n```\nif (str.equals(\"\"))\n```\n\n或者，为了最高效率：\n\
  \n```\nif (str.isEmpty())\n```\n\n空字符串是一个 Java 对象，持有字符串长度（即 `0`）和空内容。然而，`String`\
  \ 变量还可以持有一个特殊值，称为 `null`，表示该变量当前没有关联任何对象。要测试字符串是否为 `null`，请使用：\n\n```\nif (str ==\
  \ null)\n```\n\n有时，你需要测试一个字符串既不是 `null` 也不是空的。这时使用\n\n```\nif (str != null && str.length()\
  \ != 0)\n```\n\n你需要先测试 `str` 是否为 `null`。正如你将在 第 4 章 中看到的，在 `null` 值上调用方法是一个错误。\n\
  \n### String API\n\nJava 中的 `String` 类包含近 100 个方法。下面的 API 说明总结了最实用的方法。\n\n这些贯穿全书的\
  \ API 说明将帮助你理解 Java 应用程序接口（API）。每个 API 注释都以类名开头，例如 `java.lang.String`。（所谓包名 `java.lang`\
  \ 的意义在 第 4 章 中有解释。）类名后面紧跟着一个或多个方法的名称、说明和参数描述。方法的参数变量是接收方法参数的变量。例如，正如你将在下面的第一个 API\
  \ 说明中看到的，`charAt` 方法有一个类型为 `int` 的参数 `index`。如果你调用该方法，你需要提供该类型的参数，例如 `str.charAt(0)`。\n\
  \nAPI 注释没有列出特定类的所有方法，而是以简洁的形式呈现了最常用的方法。要查看完整列表，请参阅在线文档（见 [](#index.xhtml_ch03lev2sec21)）。\n\
  \n类名后的数字是引入该类的 JDK 版本号。如果以后添加了某个方法，它有一个单独的版本号。\n\n`java.lang.String` 1.0\n\n*  \
  \ `char charAt(int index)`\n    返回指定位置的代码单元。除非你对低级代码单元感兴趣，否则可能不想调用此方法。\n\n*   `int\
  \ length()`\n    返回字符串的代码单元数量。\n\n*   `boolean equals(Object other)`\n    如果字符串等于\
  \ `other`，则返回 `true`。\n\n*   `boolean equalsIgnoreCase(String other)`\n    如果字符串等于\
  \ `other`（不区分大小写），则返回 `true`。\n\n*   `int compareTo(String other)`\n    如果该字符串在字典序上于\
  \ `other` 之前，返回负值；如果字符串在字典序上于 `other` 之后，返回正值；如果两个字符串相等，则返回 `0`。\n\n*   `boolean\
  \ isEmpty()` `6`\n    `boolean isBlank()` 11\n    如果字符串为空或由空白字符组成，则返回 `true`。\n\n\
  *   `boolean startsWith(String prefix)`\n*   `boolean endsWith(String suffix)`\n\
  \    如果字符串以 `prefix` 开头或以 `suffix` 结尾，则返回 `true`。\n\n*   `int indexOf(String str)`\n\
  *   `int indexOf(String str, int fromIndex)`\n*   `int indexOf(String str, int fromIndex,\
  \ int toIndex)` 21\n    返回第一个等于字符串 `str` 的子串起始位置，从索引 `0` 或 `fromIndex` 开始，到字符串末尾或\
  \ `toIndex` 结束。如果 `str` 未在此字符串中出现，则返回 `-1`。\n\n*   `int lastIndexOf(String str)`\n\
  *   `int lastIndexOf(String str, int fromIndex)`\n    返回最后一个等于字符串 `str` 的子串起始位置，从字符串末尾或\
  \ `fromIndex` 开始。如果 `str` 未出现，则返回 `-1`。\n\n*   `String replace(CharSequence oldString,\
  \ CharSequence newString)`\n    通过将字符串中所有匹配 `oldString` 的子串替换为 `newString` 来返回新字符串。你可以为\
  \ `CharSequence` 参数提供 `String` 或 `StringBuilder`。\n\n*   `String substring(int beginIndex)`\n\
  *   `String substring(int beginIndex, int endIndex)`\n    返回从 `beginIndex` 到字符串末尾或\
  \ `endIndex` 的新字符串。\n\n*   `String toLowerCase()`\n*   `String toUpperCase()`\n\
  \    返回包含原始字符串所有字符的新字符串，其中大写字母转换为小写，或小写字母转换为大写。\n\n*   `String strip()` 11\n   \
  \ `String stripLeading()` 11\n    `String stripTrailing()` 11\n    返回一个消除原始字符串头部、仅或尾部空白的新字符串。使用这些方法代替消除\
  \ U+0020 字符的 `trim` 方法。\n\n*   `String join(CharSequence delimiter, CharSequence...\
  \ elements)` 8\n    返回用指定分隔符连接的所有元素的字符串。\n\n*   `String repeat(int count)` 11\n\
  \    返回重复此字符串 `count` 次的字符串。\n\n*   `String[] split(String regex)` 1.4\n    找到正则表达式的所有匹配项并移除它们以分割字符串。返回包含片段的数组，但不包含尾部的空字符串。\n\
  \n在 API 注释中，有一些参数的类型是 `CharSequence`。这是一个所有字符串所属的接口类型。你将在 第 6 章 中学习接口类型。现在，你只需要知道当看到\
  \ `CharSequence` 参数时，可以传递 `String` 类型的参数。\n\n\n\n\n\nAPI 文档包含一个搜索框（参见 [](#index.xhtml_ch03fig02)）。旧版本具有包含包和类列表的框架。你仍然可以通过点击“Frames”（框架）菜单项来获取这些列表。例如，要获取有关\
  \ `String` 类方法的更多信息，可以在搜索框中输入“String”并选择类型 `java.lang.String`，或者在带有类名的框架中找到该链接并点击它。你将看到类的描述，如\
  \ [](#index.xhtml_ch03fig03）所示。\n\n![Figure](img/api1.jpg)Java API 文档\n\n![Figure](img/api2.jpg)`String`\
  \ 类的类描述\n\n当你向下滚动时，会看到所有方法的摘要，这些方法按字母顺序排序（参见 [](#index.xhtml_ch03fig04)）。点击任何方法名即可查看该方法的详细描述（参见\
  \ [](#index.xhtml_ch03fig05)）。例如，如果你点击 `compareToIgnoreCase` 链接，将获得 `compareToIgnoreCase`\
  \ 方法的描述。\n\n![Figure](img/api3.jpg)`String` 类的方法摘要![Figure](img/api4.jpg)`String`\
  \ 方法的详细描述\n\n如果你尚未执行，请按照第 2 章所述下载 JDK 文档。现在就在浏览器中收藏文档的 `index.html` 页面！\n\n你还可以使用查询字符串为浏览器添加新的搜索引擎：\n\
  \n```\nhttps://docs.oracle.com/en/java/javase/21/docs/api/search.html?q=%s\n```\n\
  \n### 构建字符串\n\n有时，你需要从较短的字符串构建字符串，例如按键或文件中的单词。为了这个目的，使用字符串拼接是低效的。每次拼接字符串时，都会构建一个新的\
  \ `String` 对象。这非常耗时且浪费内存。使用 `StringBuilder` 类可以避免这个问题。\n\n如果你需要从许多小片段构建字符串，请按照以下步骤操作。首先，构造一个空的字符串构建：\n\
  \n```\nStringBuilder builder = new StringBuilder();\n```\n\n你也可以提供初始内容：\n\n```\n\
  StringBuilder builder = new StringBuilder(\"INVOICE\\n\");\n```\n\n每当你需要添加另一个部分时，调用\
  \ `append` 方法。\n\n```\nbuilder.append(str); // 追加一个字符串\nbuilder.appendCodePoint(cp);\
  \ // 追加单个代码点\n```\n\n当你需要计算代码点时，后一种方法偶尔有用。这里有一个示例。国旗表情符号符号由两个代码点组成，每个代码点的范围在 127462（区域指示符号字母\
  \ A）到 127487（区域指示符号字母 Z）之间。现在，假设你有一个国家字符串，例如 `\"IT\"`。那么你可以按照以下方式计算代码点：\n\n```\n\
  final int REGIONAL_INDICATOR_SYMBOL_LETTER_A = 127462;\nString country = . . .;\n\
  builder.append(country.charAt(0) - 'A' + REGIONAL_INDICATOR_SYMBOL_LETTER_A);\n\
  builder.append(country.charAt(1) - 'A' + REGIONAL_INDICATOR_SYMBOL_LETTER_A);\n\
  ```\n\n完成字符串构建后，调用 `toString` 方法。你将得到一个包含构建器中字符序列的 `String` 对象。\n\n```\nString completedString\
  \ = builder.toString();\n```\n\n巧妙的是，`StringBuilder` 方法返回构建器对象，因此你可以链式调用多个方法：\n\n\
  ```\nString completedString = new StringBuilder()\n   .append(str)\n   .appendCodePoint(cp)\n\
  \   .toString();\n```\n\n`String` 类没有反转字符串中 Unicode 字符的方法，但 `StringBuilder` 有。要反转字符串，请使用此代码段：\n\
  \n```\nString reversed = new StringBuilder(original).reverse().toString();\n```\n\
  \n反转对于用两个 `char` 值编码的字符有效，但它没有考虑字符簇（grapheme clusters）。旧的 `StringBuffer` 类比 `StringBuilder`\
  \ 效率低，但它允许多个线程添加或删除字符。如果所有的字符串编辑都在单个线程中进行（通常情况下如此），你应该使用 `StringBuilder`。这两个类的 API\
  \ 是完全相同的。\n\n以下 API 注释包含了 `StringBuilder` 类最重要的方法。\n\n`java.lang.StringBuilder`\
  \ 5.0\n\n*   `StringBuilder()`\n*   `StringBuilder(CharSequence seq)`\n    构造一个空的字符串构建器，或具有给定初始内容的构建器。\n\
  *   `int length()`\n    返回构建器或缓冲区的代码单元数量。\n*   `StringBuilder append(String str)`\n\
  \    追加字符串并返回字符串构建器。\n*   `StringBuilder appendCodePoint(int cp)`\n    追加一个代码点，将其转换为一个或两个代码单元，并返回\
  \ `this`。\n*   `StringBuilder insert(int offset, String str)`\n    在位置 `offset`\
  \ 处插入字符串并返回字符串构建器。\n*   `StringBuilder delete(int startIndex, int endIndex)`\n \
  \   删除从 `startIndex` 到 `endIndex - 1` 的代码单元并返回字符串构建器。\n*   `StringBuilder repeat(CharSequence\
  \ cs, int count)` 21\n    追加 `count` 份 `cs` 并返回字符串构建器。\n*   `StringBuilder reverse()`\n\
  \    反转此字符串构建器中的代码点并返回构建器。\n*   `String toString()`\n    返回一个与构建器数据相同的字符串。\n\n###\
  \ 文本块 (Text Blocks)\n\n在 15 中引入的文本块功能使得提供跨多行的字符串字面量变得简单。文本块以 `\"\"\"` 开始，随后跟一行。以另一个\
  \ `\"\"\"` 结束：\n\n```\nString greeting = \"\"\"\nHello\nWorld\n\"\"\";\n```\n\n\
  这比等效的字符串字面量容易得多：\n\n```\n\"Hello\\nWorld\\n\"\n```\n\n包含两个 `\\n`：一个在 `Hello` 之后，一个在\
  \ `World` 之后。起始 `\"\"\"` 之后的换行符不包含在字符串中。\n\n如果你不想在最后一行有换行符，将结束 `\"\"\"` 直接放在最后一个字符之后：\n\
  \n```\nString prompt = \"\"\"\nHello, my name is Hal.\nPlease enter your name:\"\
  \"\";\n```\n\n文本块特别适合包含其他语言的代码（如 SQL 或 HTML）。你只需要将其粘贴在三引号之间：\n\n```\nString html\
  \ = \"\"\"\n<div class=\"Warning\">\n   Beware of those who say \"Hello\" to the\
  \ world\n</div\n\"\"\";\n```\n\n注意，你不需要转义引号。只有两种情况需要转义它们：\n\n*   文本块以引号结尾\n*   文本块包含三个或更多引号序列\n\
  \n遗憾的是，你仍然需要转义所有的反斜杠。普通字符串中的转义序列在文本块中的工作方式相同。\n\n有一个仅在文本块中有效的转义序列。行尾直接的 `\\` 会将此行和下一行连接。例如，\n\
  \n```\n\"\"\"\nHello, my name is Hal. \\\nPlease enter your name:\"\"\";\n```\n\n\
  等同于\n\n```\n\"Hello, my name is Hal. Please enter your name:\"\n```\n\n行结束通过删除尾部空格并将任何\
  \ Windows 换行符（`\\r\\n`）转换为简单的换行符（`\\n`）来标准化。如果你需要保留结尾空格，将最后一个转为 `\\s`。实际上，这可能是提示字符串所需的。以下字符串以空格结尾：\n\
  \n```\n\"\"\"\nHello, my name is Hal. \\\nPlease enter your name:\\s\"\"\";\n```\n\
  \n对于领先空格的情况更为复杂。考虑一个从左边界缩进的典型变量声明。你也可以对文本块进行缩进：\n\n```\n String html = \"\"\"\n\
  \            <div class=\"Warning\">\n               Beware of those who say \"\
  Hello\" to the world\n            </div>\n            \"\"\";\n```\n\n文本块中所有行的公共缩进会被减去。实际的字符串是\n\
  \n```\n\"<div class=\\\"Warning\\\">\\n   Beware of those who say \\\"Hello\\\"\
  \ to the world\\n</div>\\n\"\n```\n\n注意，第一行和第三行没有缩进。\n\n\n\n\n你始终可以通过在结束 `\"\"\"\
  ` 之前的最后一行不留空白字符来避免这种缩进剥离。但许多程序员似乎认为文本块在缩进后看起来更整洁。你的 IDE 可能会乐于提供使用制表符或空格缩进所有文本块的功能。\n\
  \nJava 并没有规定制表符的宽度。文本块中所有行的空白前缀必须*完全匹配*。\n\n在剥离共同缩进时，完全空行不被考虑。然而，结束 `\"\"\"` 之前的空白是有意义的。请确保缩进到你想要被剥离的空白末尾。\n\
  \n注意缩进中混合使用制表符和空格。一个被忽略的空格很容易导致字符串缩进错误。\n\n如果文本块包含不是 Java 的代码，你实际上可能更倾向于将其放在左边距。它会与\
  \ Java 代码区分开来，并且为长行留出更多空间。\n\n# 输入与输出\n\n为了让我们的示例程序更有趣，我们想要接受输入并正确格式化程序输出。当然，现代程序使用\
  \ GUI 来收集用户输入。然而，编写这样的界面所需的工具和技术比我们目前拥有的多。我们的首要任务是更熟悉 Java 编程语言，因此我们使用简单的控制台进行输入和输出。\n\
  \n## 读取输入\n\n你已经看到，只需调用 `System.out.println` 就可以向“标准输出流”（即控制台窗口）输出。从“标准输入流”`System.in`\
  \ 读取并没有那么简单。要读取控制台输入，首先要一个连接到 `System.in` 的 `Scanner`：\n\n```\nScanner in = new\
  \ Scanner(System.in);\n```\n\n（构造函数和 `new` 运算符在第 4 章 中详细讨论。）\n\n现在你可以使用 `Scanner`\
  \ 类的各种方法来读取输入。例如，`nextLine` 方法读取一行输入。\n\n```\nSystem.out.print(\"What is your name?\
  \ \");\nString name = in.nextLine();\n```\n\n在这里，我们使用 `nextLine` 方法是因为输入可能包含空格。要读取单个单词（由空白分隔），调用：\n\
  \n```\nString firstName = in.next();\n```\n\n要读取一个整数，使用 `nextInt` 方法。\n\n```\nSystem.out.print(\"\
  How old are you? \");\nint age = in.nextInt();\n```\n\n同样，`nextDouble` 方法读取下一个浮点数。\n\
  \n[#index.xhtml_ch03ex02] 中的程序询问用户的姓名和年龄，然后打印类似如下的消息：\n\n```\nHello, Cay. Next year,\
  \ you'll be 65.\n```\n\n最后，注意程序开头的行：\n\n```\nimport java.util.*;\n```\n\n`Scanner`\
  \ 类定义在 `java.util` 包中。每当你使用一个未定义在基础 `java.lang` 包中的类时，你就需要使用 `import` 指令。包和 `import`\
