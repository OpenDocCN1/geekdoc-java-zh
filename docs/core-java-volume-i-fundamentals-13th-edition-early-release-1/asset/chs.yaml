  \ 添加所有条目，并使用与给定排序 map 相同的元素比较器。\n\n### `java.util.SortedMap<K, V>` 1.2\n\n*   `Comparator<?\
  \ super K> comparator()`\n    返回用于排序键的比较器，如果键通过 `Comparable` 接口的 `compareTo` 方法进行比较，则返回\
  \ `null`。\n*   `K firstKey()`\n*   `K lastKey()`\n    返回 map 中最小或最大的键。\n\n### 更新\
  \ Map 条目\n\n处理 map 的棘手部分是更新条目。通常，你获取与键关联的旧值，更新它，然后将更新后的值放回去。但你必须担心键第一次出现的特殊情况。考虑使用\
  \ map 来统计一个单词在文件中出现的次数。当我们看到一个单词时，我们希望像这样增加计数器：\n\n```\ncounts.put(word, counts.get(word)\
  \ + 1);\n```\n\n这种方法可行，但在 `word` 第一次遇到时除外。此时 `get` 返回 `null`，并会发生 `NullPointerException`。\n\
  \n简单的解决办法是使用 `getOrDefault` 方法：\n\n```java\ncounts.put(word, counts.getOrDefault(word,\
  \ 0) + 1);\n```\n\n另一种方法是先调用 `putIfAbsent` 方法。它只在键之前不存在（或映射到 `null`）时才放入值。\n\n```java\n\
  counts.putIfAbsent(word, 0);\ncounts.put(word, counts.get(word) + 1); // 现在我们知道\
  \ get 会成功了\n```\n\n但你可以做得更好。`merge` 方法简化了这一常用操作。调用\n\n```java\ncounts.merge(word,\
  \ 1, Integer::sum);\n```\n\n如果键不存在，则使用 `Integer::sum` 将 `word` 与 `1` 关联；否则，将现有值与\
  \ `1` 合并。现在考虑另一种情况。我们想要更新 map。这里是使用 `compute` 的方法：\n\n```java\nvar index = map.compute(key,\
  \ (k, v) -> v == null ? 1 : v + 1);\n```\n\n或者，你可以使用 `computeIfPresent`：\n\n```java\n\
  map.computeIfPresent(key, (k, v) -> v + 1);\n```\n\n### `java.util.Map<K, V>` 1.2\n\
  \n*   `default V merge(K key, V value, BiFunction<? super V,? super V,? extends\
  \ V> remappingFunction)` 8\n    如果键关联了一个非 `null` 值 `v`，则将函数作用于 `v` 和 `value`，并将键与结果关联，如果结果为\
  \ `null`则移除该键。否则将键与 `value` 关联。返回 `get(key)`。\n*   `default V compute(K key, BiFunction<?\
  \ super K,? super V,? extends V> remappingFunction)` 8\n    将函数作用于 `key` 和 `get(key)`。将键与结果关联，如果结果为\
  \ `null`则移除该键。返回 `get(key)`。\n*   `default V computeIfPresent(K key, BiFunction<?\
  \ super K,? super V,? extends V> remappingFunction)` 8\n    如果键关联了一个非 `null` 值 `v`，则将函数作用于\
  \ `key` 和 `v`，并将键与结果关联，如果结果为 `null`则移除该键。返回 `get(key)`。\n*   `default V computeIfAbsent(K\
  \ key, Function<? super K,? extends V> mappingFunction)` 8\n    除非键关联了一个非 `null`\
  \ 值，否则将函数作用于 `key`。将键与结果关联，如果结果为 `null`则移除该键。返回 `get(key)`。\n*   `default void replaceAll(BiFunction<?\
  \ super K,? super V,? extends V> function)` 8\n    对所有条目调用该函数。将键与非 `null` 结果关联，并移除结果为\
  \ `null` 的键。\n*   `default V putIfAbsent(K key, V value)` 8\n    如果键不存在或关联到 `null`，则将其与\
  \ `value` 关联并返回 `null`。否则返回关联的值。\n\n\n\n\nJava 集合框架并没有将 map 本身视为一个集合（其他数据结构框架通常将\
  \ map 视为键/值对的集合，或者视为一个由键索引的值的集合）。但是，你可以获取 map 的*视图*（views）——即实现了 `Collection` 接口或其某个子接口的对象。\n\
  \n共有三种视图：键的集合、值的集合（它不是集合）以及键/值对的集合。键和键/值对形成一个集合，因为 map 中一个键只能有一个副本。以下方法\n\n```\n\
  Set<K> keySet()\nCollection<V> values()\nSet<Map.Entry<K, V>> entrySet()\n```\n\n\
  返回这三种视图。（entry 集合的元素是实现 `Map.Entry` 接口的类的对象。）\n\n注意，`keySet` *不是* `HashSet` 或 `TreeSet`，而是实现\
  \ `Set` 接口的另一个类的对象。`Set` 接口扩展了 `Collection` 接口。因此，你可以像使用任何集合一样使用 `keySet`。\n\n例如，你可以遍历\
  \ map 的所有键：\n\n```\nSet<String> keys = map.keySet();\nfor (String key : keys)\n\
  {\n   do something with key\n}\n```\n\n如果你想同时查看键和值，可以通过遍历*项*（entries）来避免查找。使用以下代码骨架：\n\
  \n```\nfor (Map.Entry<String, Integer> entry : counts.entrySet())\n{\n   String\
  \ k = entry.getKey();\n   Integer v = entry.getValue();\n   do something with k,\
  \ v\n}\n```\n\n`Map.Entry` 实例与 map 是连接的。你可以使用 entry 对象来更新底层 map 中的值。\n\n```\nfor\
  \ (Map.Entry<String, Integer> entry : counts.entrySet())\n{\n    String k = entry.getKey();\n\
  \    Integer v = entry.getValue();\n    entry.setValue(v + 1); // 等于 counts.put(k,\
  \ v + 1);\n}\n```\n\n相反，如果你通过其他手段更新了值（例如，通过调用 map 的 `put` 方法），则 entry 也会同步更新。\n\n\
  如果你想将 entry 传递给其他方法，应该通过 `Map.Entry.copyOf(entry)` 将它们与 map 解离。你也可以通过调用 `Map.entry(key,\
  \ value)` 创建未关联的 `Map.Entry` 实例。每当你需要一对值时，这非常有用。\n\n你可以使用 `var` 声明来避免繁琐的 `Map.Entry`。\n\
  \n```\nfor (var entry : map.entrySet())\n{\n   do something with entry.getKey(),\
  \ entry.getValue()\n}\n```\n\n或者简单地使用 `forEach` 方法：\n\n```\nmap.forEach((k, v) ->\n\
  \   {\n      do something with k, v\n   });\n```\n\n如果你在键集视图上调用迭代器的 `remove` 方法，你实际上会从\
  \ map 中删除*该键*以及其关联的值*。然而，你不能向键集视图中*添加*元素。在不添加值的情况下添加键是没有意义的。如果你尝试调用 `add` 方法，它会抛出\
  \ `UnsupportedOperationException`。entry 集合视图也有相同的限制，尽管在概念上添加一个新的新的键/值对是行得通且意义的。\n\
  \n`java.util.Map<K, V>` 1.2\n\n* `Set<Map.Entry<K, V>> entrySet()`\n  返回 `Map.Entry`\
  \ 对象的集合视图，即 map 中的键/值对。你可以从该集合中删除元素，它们也会从 map 中删除，但你不能添加任何元素。\n* `Set<K> keySet()`\n\
  \  返回 map 中所有键的集合视图。你可以从该集合中删除元素，相应的键和关联的值也会从 map 中删除，但你不能添加任何元素。\n* `Collection<V>\
  \ values()`\n  返回 map 中所有值的集合视图。你可以从该集合中删除元素，被删除的值及其对应的键也会从 map 中删除，但你不能添加任何元素。\n\
  \n`java.util.Map.Entry<K, V>` 1.2\n\n* `K getKey()`\n* `V getValue()`\n  返回此 entry\
  \ 的键或值。\n* `V setValue(V newValue)`\n  将*关联 map 中*的值更改为新值并返回旧值。\n* `static <K, V>\
  \ Map.Entry<K,V> copyOf(Map.Entry<? extends K,? extends V> map)` 17\n  返回给定 map\
  \ 的副本。与 map entry 集合的元素不同，副本是“活的”。调用 `setValue` 不会更新 map。\n\n### 弱引用 Map\n\nJava\
  \ 集合框架提供了几种针对特殊需求的 map 类，我们将在本节及后续章节简要讨论。\n\n`WeakHashMap` 类的设计是为了解决一个有趣的问题。当一个键不再被程序的任何地方使用时会发生什么？假设键的最后一个引用消失了。那么就没有方法可以引用该值对象了。由于程序不再持有该键，该键/值对无法从\
  \ map 中移除。为什么垃圾回收器不能移除它？难道移除未使用对象不是垃圾回收器工作吗？\n\n遗憾的是并非如此。垃圾回收器追踪*活*对象。`WeakHashMap`\
  \ 对键使用*弱引用*。当键不再被强引用时，可以回收该 entry。\n\n### 链接集合和 Map\n\n`LinkedHashSet` 和 `LinkedHashMap`\
  \ 类记录了插入元素的顺序。当条目插入表时，它们会被接到双向链表中。\n\n例如，考虑以下 map 插入：\n\n```\nvar staff = new LinkedHashMap<String,\
  \ Employee>();\nstaff.put(\"144-25-5464\", new Employee(\"Amy Lee\"));\nstaff.put(\"\
  567-24-2546\", new Employee(\"Harry Hacker\"));\nstaff.put(\"157-62-7935\", new\
  \ Employee(\"Gary Cooper\"));\nstaff.put(\"456-62-5527\", new Employee(\"Francesca\
  \ Cruz\"));\n```\n\n此时，`staff.keySet().iterator()` 按此顺序遍历键：\n\n```\n144-25-5464\n\
  567-24-2546\n157-62-7935\n456-62-5527\n```\n\n并且 `staff.values().iterator()` 按此顺序遍历值：\n\
  \n```\nAmy Lee\nHarry Hacker\nGary Cooper\nFrancesca Cruz\n```\n\n链接哈希 map 也可以使用*访问顺序*而非插入顺序来遍历\
  \ map 条目。每当你调用 `get` 或 `put` 时，受影响的 entry 都会从当前位置移除并置于 entry 链表的末尾。要构造一个这样的 hash\
  \ map，请调用\n\n```\nLinkedHashMap<K, V>(initialCapacity, loadFactor, true)\n```\n\n\
  \n\n\n你甚至可以自动化该过程。创建一个 `LinkedHashMap` 的子类并重写方法：\n\n```\nprotected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)\n```\n\n该方法在添加新条目后被调用。如果该方法返回 `true`，则 `eldest` 条目会被移除。例如，以下缓存的大小被保持在最多\
  \ 100 个元素内：\n\n```java\nvar cache = new LinkedHashMap<K, V>(128, 0.75F, true)\n\
  \   {\n      protected boolean removeEldestEntry(Map.Entry<K, V> eldest)\n     \
  \ {\n         return size() > 100;\n      }\n   };\n```\n\n你可以检查 `eldest` 条目以决定是否移除它。例如，你可能想要检查存储在\
  \ `eldest` 中的时间戳，并仅在它足够旧时才请求移除。这不会自动删除所有旧元素，因为 `removeEldestEntry` 方法对每个新条目只被调用一次。你允许在\
  \ `removeEldestEntry` 方法中修改 map，例如移除足够旧的初始元素。在这种情况下，你 *必须*返回 `false`。\n\n如果你需要一组最少未使用元素的集合而不是\
  \ map，请参阅 [](#index.xhtml_sets-from-boolean-valued-maps)。\n\n### 枚举集合与映射\n\n`EnumSet`\
  \ 是一种高效的集合实现，其元素属于一种枚举类型。由于枚举类型的实例数量是有限的，`EnumSet` 在内部简单地实现为位位序列。如果集合中存在对应的值，则该位就会被置为\
  \ 1。\n\n`EnumSet` 类没有公共构造函数。使用静态工厂方法来构造集合：\n\n```java\nenum Weekday { MONDAY, TUESDAY,\
  \ WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY };\nEnumSet<Weekday> always = EnumSet.allOf(Weekday.class);\n\
  EnumSet<Weekday> never = EnumSet.noneOf(Weekday.class);\nEnumSet<Weekday> workday\
  \ = EnumSet.range(Weekday.MONDAY, Weekday.FRIDAY);\nEnumSet<Weekday> mwf = EnumSet.of(Weekday.MONDAY,\
  \ Weekday.WEDNESDAY, Weekday.FRIDAY);\n```\n\n你可以使用 `Set` 接口的常用方法来修改 `EnumSet`。\n\
  \n`EnumMap` 是一种键属于枚举类型的 map。它被简单且高效地实现为值的数组。你需要在构造函数中指定键的类型：\n\n```java\nvar personInCharge\
  \ = new EnumMap<Weekday, Employee>(Weekday.class);\n```\n\n在 `EnumSet` 和 `EnumMap`\
  \ 的 API 文中，你会看到形式如 `E extends Enum<E>` 的奇怪类型参数。这仅仅意味着“`E` 是一种枚举类型”。所有枚举类型都扩展泛型类\
  \ `Enum`。例如，`Weekday` 扩展了 `Enum<Weekday>`。\n\n### 标识哈希映射\n\n`IdentityHashMap` 有一个非常特殊的用途。在这里，键的哈希值不应通过\
  \ `hashCode` 方法计算，而应通过 `System.identityHashCode` 方法计算。这是 `Object.hashCode` 用于从对象的内存地址计算哈希码的方法。此外，对于对象的比较，`IdentityHashMap`\
  \ 使用 `==` 而不是 `equals`。\n\n说，不同的键对象即使内容相同也会被视为不同的。该类对于实现对象遍历算法（例如对象序列化）非常有用，在这些算法中，你想跟踪哪些对象已经被遍历过。\n\
  \nJava 20 修复了 Java 8 中引入的 `IdentityHashMap` 的微妙 bug（[`bugs.openjdk.org/browse/JDK-8284901`](https://bugs.openjdk.org/browse/JDK-8284901)）。两个不常用的方法错误地使用了\
  \ `equals` 而不是 `==`：\n\n```java\nvoid remove(Object key, Object value)\nvoid replace(K\
  \ key, V oldValue, V newValue)\n```\n\n这些方法有时用于并发算法，在算法中，只有当 map 未被另一个线程修改时才进行更新。可以想象第一个遇到这个\
  \ bug 的程序员会有多么沮丧。\n\n没有哪个像 Java 平台这样复杂的软件系统能够完全没有 bug。这就是为什么定期更新到最新版本非常重要。\n\n`java.util.WeakHashMap<K,\
  \ V>` 1.2\n\n- `WeakHashMap()`\n- `WeakHashMap(int initialCapacity)`\n- `WeakHashMap(int\
  \ initialCapacity, float loadFactor)` 根据指定的容量和负载因子构造一个空哈希映射。\n\n`java.util.LinkedHashSet<E>`\
  \ 1.4\n\n- `LinkedHashSet()`\n- `LinkedHashSet(int initialCapacity)`\n- `LinkedHashSet(int\
  \ initialCapacity, float loadFactor)` 根据指定的容量和负载因子构造一个空链哈希集合。\n\n`java.util.LinkedHashMap<K,\
  \ V>` 1.4\n\n- `LinkedHashMap()`\n- `LinkedHashMap(int initialCapacity)`\n- `LinkedHashMap(int\
  \ initialCapacity, float loadFactor)`\n- `LinkedHashMap(int initialCapacity, float\
  \ loadFactor, boolean accessOrder)` 根据指定的容量、负载因子和排序构造一个空链哈希映射。`accessOrder` 参数为\
  \ `true` 表示访问顺序，为 `false` 表示插入顺序。\n- `protected boolean removeEldestEntry(Map.Entry<K,\
  \ V> eldest)` `removeEldestEntry` 方法对每个新条目只被调用一次。如果该方法返回 `true`，则 `eldest` 条目会被移除。在这种情况下，你\
  \ *必须*返回 `false`。\n\n`java.util.EnumSet<E extends Enum<E>>` 5.0\n\n- `static <E\
  \ extends Enum<E>> EnumSet<E> allOf(Class<E> enumType)` 返回包含该类型所有值的可变集合。\n- `static\
  \ <E extends Enum<E>> EnumSet<E> noneOf(Class<E> enumType)` 返回一个初始为空的可变集合。\n- `static\
  \ <E extends Enum<E>> EnumSet<E> range(E from, E to)` 返回从 `from` 到 `to`（包含边界）的可变集合。\n\
  - `static <E extends Enum<E>> EnumSet<E> of(E e)` `. . .`\n- `static <E extends\
  \ Enum<E>> EnumSet<E> of(E e1, E e2, E e3, E e4, E e5)` 返回一个包含给定元素的可变集合。\n- `public\
  \ static <E extends Enum<E>> EnumSet<E> copyOf(EnumSet<E> s)`\n- `public static\
  \ <E extends Enum<E>> EnumSet<E> copyOf(Collection<E> c)` 创建一个初始包含给定元素的可变集合。在第二个方法中，`c`\
  \ 必须是 `EnumSet` 或非空（以便确定元素类型）。\n\n`java.util.EnumMap<K extends Enum<K>, V>` 5.0\n\
  \n- `EnumMap(Class<K> keyType)` 构造一个键为给定类型的可变映射。\n\n`java.util.IdentityHashMap<K,\
  \ V>` 1.4\n\n- `IdentityHashMap()`\n- `IdentityHashMap(int expectedMaxSize)` 构造一个空哈希映射，其容量为超过\
  \ 1.5 × `expectedMaxSize` 的最小 2 的幂。（`expectedMaxSize` 的默认值为 `21`。）\n\n`java.lang.System`\
  \ 1.0\n\n- `static int identityHashCode(Object obj)` 返回从内存地址的哈希码，即使 `obj` 所属的类重写了\
  \ `hashCode` 方法，结果也与 `Object.hashCode` 计算的结果相同。\n\n\n\n\n\n视图（views）技术在 Java 集合框架（Java\
  \ Collections Framework）中有许多用途。我们将在接下来的章节中讨论这些应用。\n\n#### 小型集合\n\n有一些静态方法可以生成包含给定元素的集合或列表，以及一个包含给定键/值对的映射。\n\
  \n例如，\n\n```\nList<String> names = List.of(\"Peter\", \"Paul\", \"Mary\");\nSet<Integer>\
  \ numbers = Set.of(2, 3, 5);\n```\n\n这产生了一个包含三个元素的列表和一个集合。\n\n你也可以提供一个对象数组：\n\n\
  ```\nString[] namesArray = { \"Peter\", \"Paul\", \"Mary\" };\nList<String> names\
  \ = List.of(namesArray); // 包含三个对象的列表\n```\n\n如果你提供一个基本类型值值的数组，结果将是一个包含单个元素的列表，即该数组本身：\n\
  \n```\nint[] numbersArray = { 2, 3, 5 };\nList<int[]> arrays = List.of(numbersArray);\
  \ // 包含单个对象（int[] 数组）的列表\n```\n\n目前没有方便的方法可以将基本类型数组转换为其包装元素组成的列表。\n\n对于映射（map），你可以像这样指定键和值：\n\
  \n```\nMap<String, Integer> scores = Map.of(\"Peter\", 2, \"Paul\", 3, \"Mary\"\
  , 5);\n```\n\n元素、键或值不能为 `null`。集合和映射的键不能重复：\n\n```\nnumbers = Set.of(13, null);\
  \ // 错误--null 元素\nscores = Map.of(\"Peter\", 4, \"Peter\", 2); // 错误--重复键\n```\n\
  \n不保证这些集合和映射的迭代顺序。事实上，顺序是故意打乱的，并使用的种子在每个虚拟机启动时随机生成。查看这两个 `jshell` 运行：\n\n```\n$\
  \ jshell -q\njshell> Set.of(\"Peter\", \"Paul\", \"Mary\")\n$1 ==> [Peter, Mary,\
  \ Paul]\n$ jshell -q\njshell> Set.of(\"Peter\", \"Paul\", \"Mary\")\n$1 ==> [Paul,\
  \ Mary, Peter]\n```\n\n一些 Java 程序员编写程序时，其正确性取决于对实现细节永远改变的假设。这会让框架实现者很难做出有用的实现更改。在这种情况下，信息很明确——不要编写假设任何元素顺序的程序。\n\
  \n`List` 和 `Set` 接口有十一个具有零到十个参数的 `of` 方法，以及一个具有可变参数的 `of` 方法。为了提高效率，提供了这些特化方法。\n\
  \n对于 `Map` 接口，无法提供可变参数的版本，因为参数类型在键类型和值类型之间交替。有一个静态方法 `ofEntries` 接受任意数量的 `Map.Entry<K,\
  \ V>` 对象，你可以通过静态方法 `entry` 创建这些对象。例如：\n\n```\nimport static java.util.Map.*;\n.\
  \ . .\nMap<String, Integer> scores = ofEntries(\n   entry(\"Peter\", 2),\n   entry(\"\
  Paul\", 3),\n   entry(\"Mary\", 5));\n```\n\n`of` 和 `ofEntries` 方法产生的类对象，其类为每个元素都有一个实例变量，或者由数组支持。\n\
  \n这些集合对象是**不可修改的（unmodifiable）**的。任何更改其内容的尝试都会导致 `UnsupportedOperationException`。\n\
  \n如果你想要一个可变的集合，可以将不可修改的集合传递给构造函数：\n\n```\nvar names = new ArrayList<>(List.of(\"\
  Peter\", \"Paul\", \"Mary\")); // 一个可变的名称列表\n```\n\n方法调用\n\n`Collections.nCopies(n,\
  \ anObject)`\n\n返回一个实现 `List` 接口的不可变对象，并给出一个具有 `n` 个元素的幻象，每个元素看起来都是 `anObject`。\n\
  \n例如，以下调用创建了一个包含 100 个字符串的 `List`，所有字符串设置为 `\"DEFAULT\"`：\n\n```\nList<String> settings\
  \ = Collections.nCopies(100, \"DEFAULT\");\n```\n\n存储成本非常低——该对象只存储一次。\n\n`Collections`\
  \ 类包含许多实用方法，其参数或返回值是集合。不要将它与 `Collection` 接口混淆。\n\nJava 没有 `Pair` 类，一些程序员使用 `Map.Entry`\
  \ 作为廉价的对（pair）。\n\n#### 不可修改的副本与视图\n\n要制作集合的**不可修改的副本（unmodifiable copy）**，请使用集合类型的\
  \ `copyOf` 方法：\n\n```\nArrayList<String> names = . . .;\nSet<String> nameSet = Set.copyOf(names);\
  \ // 作为不可修改集合的名称\nList<String> nameList = List.copyOf(names); // 作为不可修改列表的名称\n```\n\
  \n与 `of` 方法一样，`copyOf` 方法拒绝创建包含 `null` 元素的集合，而是抛出 `NullPointerException`。\n\n每个\
  \ `copyOf` 方法都会制作集合的副本。如果原始集合被修改，副本将不受影响。\n\n如果原始集合恰好是不可修改的且类型正确，那么 `copyOf` 将直接返回它：\n\
  \n```\nSet<String> names = Set.of(\"Peter\", \"Paul\", \"Mary\");\nSet<String> nameSet\
  \ = Set.copyOf(names); // 无需复制：names == nameSet\n```\n\n`Collections` 类具有产生集合的**不可修改视图（unmodifiable\
  \ views）**的方法。这些视图为现有的集合添加了运行时检查。如果检测到修改集合的尝试，将抛出异常。\n\n然而，如果原始集合发生变化，视图将反映这些变化。这正是视图区别于副本的地方。\n\
  \n通过以下八种方法获取不可修改视图：\n\n```\nCollections.unmodifiableCollection\nCollections.unmodifiableList\n\
  Collections.unmodifiableSet\nCollections.unmodifiableSortedSet\nCollections.unmodifiableNavigableSet\n\
  Collections.unmodifiableMap\nCollections.unmodifiableNavigableMap\n```\n\n每种方法都针对接口工作。例如，`Collections.unmodifiableList`\
  \ 适用于 `ArrayList`、`LinkedList` 或任何实现 `List` 的类。假设你想让代码的某些查看但不触碰集合的内容。你可以这样做：\n\n\
  ```\nvar staff = new LinkedList<String>();\n. . .\nlookAt(Collections.unmodifiableList(staff));\n\
  ```\n\n`Collections.unmodifiableList` 方法返回一个实现 `List` 接口的类对象。访问器方法从 `staff` 集合中检索值。当然，`lookAt`\
  \ 方法可以调用 `List` 接口的所有方法，而不只是访问器。但所有修改方法（如 `add`）都已重定义为抛出 `UnsupportedOperationException`，而不是转发给底层集合。\n\
  \n不可修改视图并不会使集合本身不可变。你仍然可以通过原始引用（在本例中为 `staff`）修改集合。你仍然可以对集合元素调用修改方法。\n\n视图包装的是接口而不是实际集合对象，因此你只能访问接口中定义的方法。例如，`LinkedList`\
  \ 类具有便利方法 `addFirst` 和 `addLast`，它们并不是 `List` 接口的一部分。这些方法无法通过不可修改视图访问。\n\n`unmodifiableCollection`\
  \ 方法（以及本节稍后讨论的 `synchronizedCollection` 和 `checkedCollection` 方法）返回的集合，其 `equals`\
  \ 方法不会调用底层集合的 `equals` 方法。相反，它继承了 `Object` 类的 `equals` 方法，该方法仅测试对象是否相同。如果你将集合或列表转换为简单的集合，你就无法测试内容是否相等。视图以这种方式运行是因为在层次结构的这一层，相等性测试并没有良好的定义。视图处理\
  \ `hashCode` 方法的方式也是如此。\n\n优先使用 `unmodifiableSet` 和 `unmodifiableList` 包装器，它们的 `equals`\
  \ 和 `hashCode` 方法对于集合和列表是恰的。\n\n例如：\n\n```\nvar names = Set.of(\"Peter\", \"Paul\"\
  , \"Mary\");\nCollections.unmodifiableCollection(names).equals(names) // false\n\
  Collections.unmodifiableSet(names).equals(names) // true\n```\n\n#### 子范围\n\n\n\n\
  \n\n你可以为许多集合创建子范围视图。例如，假设你有一个列表 `staff`，并想要提取索引从 10 到 19 的元素。使用 `subList` 方法获取该列表子范围的视图：\n\
  \n```\nList<Employee> group2 = staff.subList(10, 20);\n```\n\n第一个索引是包含的，第二个索引是不包含的的——这与\
  \ `String` 类中 `substring` 操作的参数完全一样。\n\n你可以对子范围应用任何操作，这些操作会自动反映在整个列表中。例如，你可以删除整个子范围：\n\
  \n```\ngroup2.clear(); // staff 相应减少\n```\n\n元素会自动从 `staff` 列表中清除，`group2` 变为空。\n\
  \n对于排序集合和映射，你使用排序顺序而不是元素位置来形成子范围。`SortedSet` 接口声明了三个方法：\n\n```\nSortedSet<E> subSet(E\
  \ from, E to)\nSortedSet<E> headSet(E to)\nSortedSet<E> tailSet(E from)\n```\n\n\
  这些方法返回所有大于或等于 `from` 且严格小于 `to` 的元素的子集。对于排序映射，类似的方法\n\n```\nSortedMap<K, V> subMap(K\
  \ from, K to)\nSortedMap<K, V> headMap(K to)\nSortedMap<K, V> tailMap(K from)\n\
  ```\n\n返回映射的视图，其中包含所有 `keys` 落在指定范围内的条目。\n\n`NavigableSet` 接口对这些子范围操作提供了更多的控制。你可以指定是否包含边界值：\n\
  \n```\nNavigableSet<E> subSet(E from, boolean fromInclusive, E to, boolean toInclusive)\n\
  NavigableSet<E> headSet(E to, boolean toInclusive)\nNavigableSet<E> tailSet(E from,\
  \ boolean fromInclusive)\n```\n\n### 来自布尔值映射的集合\n\n有时，API 提供了带有有用功能的映射，而你可能希望在集合中使用这些功能。你之前已经见过如何使用\
  \ `LinkedHashMap` 来构建一个丢弃旧元素的缓存。`LinkedHashSet` 类并不具备这种能力。\n\n如果你想拥有一个包含 100 个最近未插入字符串的集合，创建一个\
  \ `LinkedHashMap<String, Boolean>`，然后调用 `Collections.newSetFromMap` 方法：\n\n```\n\
  Set<String> cache = Collections.newSetFromMap(new LinkedHashMap<String, Boolean>()\n\
  \   {\n      protected boolean removeEldestEntry(Map.Entry<String, Boolean> eldest)\n\
  \      {\n         return size() > 100;\n      }\n   });\n```\n\n该集合视图由映射提供支持。当你添加一个元素\
  \ `e` 时，视图会在映射中放入一个键为 `e` 值为 `Boolean.TRUE` 的条目。如果这导致映射的条目超过 100 个，最旧的一个将被移除。\n\n\
  你应该使用一个空映射调用 `newSetFromMap`。此后，不要修改映射，而是让所有修改通过集合视图的方法发生。实现这一点的最佳方法是将映射传递给 `newSetFromMap`\
  \ 方法而不保留对它的引用，如上一个示例所示。\n\n`newSetFromMap` 方法配合 `WeakHashMap` 同样有用。对于 `ConcurrentHashMap`，请使用\
  \ `newKeySet` 方法。\n\n### 反转视图\n\n`SequencedCollection` 和 `SequencedSet` 接口的 `reversed`\
  \ 方法产生以反序顺序查看元素的视图。例如，这里展示了如何反向遍历字符串列表或树集：\n\n```\nfor (String element : collection.reversed())\n\
  {\n   对 element 执行某些操作\n}\n```\n\n对于 `SequencedMap`，`reversed` 方法以反序顺序查看键的映射。\n\n\
  ### 检查视图（Checked Views）\n\n检查视图旨在为泛型中可能出现的问题提供调试支持。正如所解释的，实际上可以将错误类型的元素“偷入”到泛型集合中。例如：\n\
  \n```\nvar strings = new ArrayList<String>();\nArrayList rawList = strings; // 仅警告，不是错误，\n\
  // 为了与旧版代码兼容\nrawList.add(new Date()); // 现在 strings 包含一个 Date 对象！\n```\n\n错误的 `add`\
  \ 命令在运行时不会被检测到。相反，当代码的另一部分调用 `get` 并将结果强制转换为 `String` 时，稍后会发生类转换异常（ClassCastException）。\n\
  \n检查视图可以检测到这个问题。按如下方式定义一个安全列表：\n\n```\nList<String> safeStrings = Collections.checkedList(strings,\
  \ String.class);\n```\n\n视图的 `add` 方法会检查插入的对象是否属于给类，如果不属于，则立即抛出 `ClassCastException`。其优点是错误会在正确的位置被报告：\n\
  \n```\nArrayList rawList = safeStrings;\nrawList.add(new Date()); // 检查列表抛出 ClassCastException\n\
  ```\n\n检查视图受限于虚拟机可以执行的运行时检查。例如，如果你有一个 `ArrayList<Pair<String>>`，你无法防止其插入一个 `Pair<Date>`，因为虚拟机只有一个“原始（raw）”\
  \ `Pair` 类。\n\n### 同步视图（Synchronized Views）\n\n如果你从多个线程访问集合，你需要确保集合不会被破坏。例如，如果一个线程尝试向哈希表添加内容，而另一个线程正在进行重哈希（rehashing），那结果将是灾难性的。\n\
  \n与其实现线程安全的类，框架设计者使用了视图机制来使普通集合变为线程安全。例如，`Collections` 中的 `synchronizedMap` 方法可以将任何映射转换为同步的映射：\n\
  \n```\nvar map = Collections.synchronizedMap(new HashMap<>());\n```\n\n你现在可以从多个线程访问\
  \ `map` 对象。`get` 和 `put` 等方法都是同步的——每个方法调用必须完成后，另一个线程才能调用。\n\n### 关于可选操作的说明\n\n视图通常具有某些限制——它可能是只读的，可能无法更改大小，或者支持删除但不支持插入（如映射的视图所示）。如果尝试不支持的操作，限制视图将抛出\
  \ `UnsupportedOperationException`。\n\n在集合和迭代器接口的 API 文档中，许多方法被描述为“可选操作”。这似乎与接口的概念相冲突。归根节点，接口的作用不是列出类*必须*实现的方法吗？确实，从理论角度来看，这种安排是不令人满意的。更好的解决方案可能是为只读视图和不可更改大小的视图设计单独接口。然而这将接口数量增加三倍，框架设计者认为这是不可接受的。\n\
  \n你应该将“可选”方法的技术扩展到你自己的设计中吗？我不认为。尽管集合被频繁使用，但它们的实现风格在其他问题领域并不典型。集合类库的设计者必须解决一组特别残酷的冲突需求。用户希望库易于学习、方便使用、完全泛型、防呆，并且同时像手写算法一样高效。同时实现所有这些目标是不可能的，甚至无法接近。但在你自己的编程问题中，你很少遇到如此极端的约束。你应该能够找到不依赖“可选”接口操作这种极端措施的解决方案。\n\
