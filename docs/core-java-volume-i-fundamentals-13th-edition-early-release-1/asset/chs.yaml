  \n```\nvoid main()\n```\n\n```\n{\n  System.out.println(\"We will not use 'Hello,\
  \ World!'\");\n}\n```\n\n# 示例代码\n\n本书的 [`horstmann.com/corejava`](https://horstmann.com/corejava)\
  \ 网站包含了书中所有的示例代码。有关安装 Java 开发包和示例代码的更多信息，请参阅 第 2 章。\n\n# 致谢\n\n写一本书总是一项巨大的工程，而重写它似乎并不容易多少，特别是考虑到\
