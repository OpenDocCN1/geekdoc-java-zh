  [0.035s][info][class,load] java.lang.String source: jrt:/java.base\n[0.036s][info][class,load]\
  \ java.lang.Object source source: source:...java.base\n.0.036info][info,class,load.lang.lang.Type\
  \ source: jrt:/java.base\n[0.036s][info][class,load] java.lang.Class source: jrt:/java.base\n\
  [0.036s][info][class,load] java.lang.Cloneable source: jrt:/java.base\n[0.037s][info][class,load]\
  \ java.lang.ClassLoader source: jrt:/java.base\n[0.037s][info][class,load] java.lang.System\
  \ source: jrt:/java.base\n[0.037s][info][class,load] java.lang.Throwable source:\
  \ jrt:/java.base\n[0.037s][info][class,load] java.lang.Error source: jrt:/java.base\n\
  [0.037s][info][class,load] java.lang.ThreadDeath source: jrt:/java.base\n[0.037s][info][class,load]\
  \ java.lang.Exception source: jrt:/java.base\n[0.037s][info][class,load] java.lang.RuntimeException\
  \ source: jrt:/java.base\n[0.038s][info][class,load] java.lang.SecurityManager source:\
  \ jrt:/java.base\n. . .\n```\n\n这有时对诊断类路径问题很有帮助。\n\n10. `-lint` 选项告诉编译器发现常见的代码问题。例如，如果你用命令编译\n\
  \n```\njavac -Xlint sourceFiles\n```\n\n编译器将报告 `switch` 语句中缺少 `break` 语句。（“lint”一词最初描述用于定位\
  \ C 程序中潜在问题的工具，现在泛指任何标记可疑但不法的工具。）\n\n你会得到如下消息\n\n```\nwarning: [fallthrough] possible\
  \ fall-through into case\n```\n\n方括号中的字符串标识警告类别。你可以启用和禁用每个类别。由于大多数非常有用，最好的方法是保留所有它们，只禁用你不在乎的，如下：\n\
  \n```\njavac -Xlint:all,-fallthrough,-serial sourceFiles\n```\n\n你可以通过命令获取所有警告的列表\n\
  \n```\njavac --help -X\n```\n\n11. Java VM 支持对 Java 应用程序进行*监控和管理*，允许在虚拟机中安装代理来跟踪内存消耗、线程使用、类加载等。这一特性对于大型和长时间运行的\
  \ Java 程序尤为重要。作为这些能力的演示，JDK 自带了一个名为 `jconsole` 的图形工具，它可以显示有关虚拟机性能的统计数据（见[](#index.xhtml_ch11fig03)）。启动你的程序，然后启动\
  \ `jconsole` 并从运行的 Java 程序列表中选择你的程序。\n\n![图](img/jconsole.jpg)`jconsole` 程序\n\n\n\
  \n\n\n此程序为你提供了有关运行中程序的丰富信息。更多信息请参阅 [JConsole 帮助](https://www.oracle.com/technical-resources/articles/java/jconsole.html)](https://www.oracle.com/technical-resources/articles/java/jconsole.html)。\n\
  \n12. Java Flight Recorder 是 OpenJDK 虚拟机的一种插桩化技术，用于收集诊断和分析数据。你可以使用开源的 VisualVM ([`visualvm.github.io`](https://visualvm.github.io))\
  \ 和 Java Mission Control ([`adoptium.net/jmc`](https://adoptium.net/jmc)) 来收集和查看飞行录制数据。这些工具还可以实现你使用\
  \ `jconsole` 执行的所有操作。关于后者的详细教程，请参阅 [JMC 教程](https://github.com/thegreystone/jmc-tutorial)](https://github.com/thegreystone/jmc-tutorial)。\n\
  \n13. JDK 带有许多命令行工具，它们在监控虚拟机方面用例重叠（`jcmd`、`jhsdb`、`jinfo`、`jmap`、`jps`、`jstat`）。`jcmd`\
  \ 工具是一个很好的起点，因为它涵盖了其中几个用例。运行：\n\n```\njcmd\n```\n\n获取计算机上所有 Java 进程的列表，包含进程 ID 和主类名。\n\
  \n要列出系统属性或 VM 标志，运行：\n\n```\njcmd pidOrMainClass VM.system_properties\njcmd pidOrMainClass\
  \ VM.flags\n```\n\n你可以配置虚拟机日志：\n\n```\njcmd pidOrMainClass VM.log output=gc.log\
  \ what=gc=trace decorators=uptime,tid\n```\n\n要获取线程转储，运行：\n\n```\njcmd pidOrMainClass\
  \ Thread.print \n```\n\n或者\n\n```\njcmd pidOrMainClass Thread.dump_to_file -overwrite\
  \ -format=json dump.json\n```\n\n要启动 Java Flight Recorder，运行：\n\n```\njcmd pidOrMainClass\
  \ JFR.start filename=filename\n```\n\n要要停止录制，运行：\n\n```\njcmd pidOrMainClass JFR.stop\
  \ name=1\n```\n\n要获取所有可用命令的列表，运行：\n\n```\njcmd pidOrMainClass\n```\n\n要获取特定命令的帮助，运行：\n\
  \n```\njcmd pidOrMainClass help commandName\n```\n\n本章向你介绍了异常处理和日志记录。你还看到了测试和调试的有用提示。接下来的两个章节将涵盖泛型编程及其最重要的应用：Java\
  \ 集合框架。\n\n# 泛型编程\n\n泛型类和方法具有类型参数。这允许它们精确地描述在实现中如何使用这些类型。在泛型类之前，程序员必须使用 `Object`\
  \ 类来编写可以在多种类型上运行的代码。这既繁琐又不安全。\n\n随着泛型的引入，Java 拥有了表达能力丰富的类型系统，允许设计者详细描述变量和方法的类型应如何变化。在简单的情况下，你会发现实现泛型代码非常简单。在更高级的情况下，对于实现者来说，它可能会变得相当复杂。目标是提供其他程序员可以使用而不会产生意外的类和方法。\n\
  \nJava 5 中泛型的引入是 Java 编程语言的一项重大变化。一个主要的设计目标是与早期版本后兼容。因此，Java 泛型存在一些不便的局限。你将在本章中学习泛型编程的优势和挑战。\n\
  \n## 为什么使用泛型编程？\n\n`泛型编程`意味着编写可以用于许多不同类型对象的复用代码。例如，你不想编写单独的类来收集 `String` 和 `File`\
  \ 对象。你也不必这样做——单个 `ArrayList` 类就可以收集任何类的对象。这就是泛型编程的一个示例。\n\n实际上，Java 在拥有泛型类之前就已经有一个\
  \ `ArrayList` 类了。让我们研究一下泛型编程机制是如何演进的，以及这对用户和实现者意味着什么。\n\n### 类型参数的优势\n\n在泛型类加入 Java\
  \ 之前，泛型编程是通过`继承`实现的。`ArrayList` 类只是维护了一个 `Object` 用的数组：\n\n```\npublic class ArrayList\
  \ // 泛型类之前\n{\n   private Object[] elementData;\n   . . .\n   public Object get(int\
  \ i) { . . . }\n   public void add(Object o) { . . . }\n}\n```\n\n这种方法有两个问题。每当你检索值时，都需要进行强制类型转换：\n\
  \n```\nArrayList files = new ArrayList();\n. . .\nString filename = (String) files.get(0);\n\
  ```\n\n此外，没有错误检查。你可以添加任何类的值：\n\n```\nfiles.add(new File(\". . .\"));\n```\n\n此调用会编译并运行而不会报错。在其他地方，将\
  \ `get` 的结果强制转换为 `String` 将导致错误。\n\n泛型提供了更好的解决方案：`类型参数`。`ArrayList` 类现在有一个指示元素类型的类型参数：\n\
  \n```java\nvar files = new ArrayList<String>();\n```\n\n这使得你的代码更易于读。你可以立即看出这个特定的数组列表包含\
  \ `String` 对象。\n\n如果你使用显式类型而不是 `var` 声明变量，可以通过使用“菱形”语法在构造函数中省略类型参数：\n\n```java\n\
  ArrayList<String> files = new ArrayList<>();\n```\n\n省略的类型是从变量的类型中推断出来的。\n\n你可以在匿名子类中使用菱形：\n\
  \n```java\nArrayList<String> passwords = new ArrayList<>() \n   {\n      public\
  \ String get(int n) { return super.get(n).replaceAll(\".\", \"*\"); }\n   };\n```\n\
  \n编译器也可以很好地利用类型信息。调用 `get` 不需要强制转换。编译器知道返回类型是 `String` 而不是 `Object`：\n\n```java\n\
  String filename = files.get(0);\n```\n\n编译器还知道 `ArrayList<String>` 的 `add` 方法有一个\
  \ `String` 类型的参数。这比有一个 `Object` 参数要安全得多。现在编译器可以检查你没有插入错误类型的对象。例如，语句\n\n```java\n\
  files.add(new File(\". . .\")); // 只能向 ArrayList<String> 添加 String 对象\n```\n\n将无法通过编译。编译错误比运行时的类转换异常要好得多。\n\
  \n这就是类型参数的魅力：它们让你的程序更易读、更安全。\n\n### 谁想成为一名泛型程序员？\n\n使用像 `ArrayList` 这样的泛型类很容易的。大多数\
  \ Java 程序员会直接使用 `ArrayList<String>` 等类型，就像它们被内置在语言中一样，就像 `String[]` 数组一样。（当然，数组列表比数组更好，因为它们可以自动扩展。）\n\
  \n然而，实现泛型类并没有那么容易。使用你代码的程序员会想要为你的类型参数接入各种类。他们期望一切在没有繁重限制和令人困惑的错误信息的情况下正常工作。因此，作为一名泛型程序员，你的工作是预测你的类的所有可能的未来用途。\n\
  \n这能变得有多难呢？这里标准类库设计者必须应对的一个典型问题。`ArrayList` 类有一个方法 `addAll` 用于添加另一个集合的所有元素。程序员可能想从\
  \ `ArrayList<Manager>` 添加所有元素到 `ArrayList<Employee>`。但，当然，反过来操作不应该是合法的。你如何允许一种调用而禁止另一种呢？Java\
  \ 语言设计者发明了一种奇妙的新概念——`通配符类型`来解决这个问题。通配符类型相当抽象，但它们允许库构建者使方法尽可能灵活。\n\n\n\n\n泛型编程分为三个技能水平。在基础阶段，你只需要使用泛型类——通常是如\
  \ `ArrayList` 这样的集合——而不思考它们是如何以及为什么工作的。大多数应用程序程序员都希望一直停留在该水平，直到出现问题。然而，当你混合不同的泛型类，或者与完全不知道类型参数的旧代码交互时，你可能会遇到令人困惑的错误信息；此时，你需要学习足够的\
  \ Java 泛型知识，以便系统地解决问题，而不是通过随机的摸索。最后，当然，你可能想要实现自己的泛型类和方法。\n\n应用程序程序员可能不会编写大量的泛型代码。JDK\
  \ 开发者已经承担了繁重的工作，并为所有的集合类提供了类型参数。根据经验法则，只有那些传统上涉及大量从非常通用类型（如 `Object` 或 `Comparable`\
  \ 接口）进行类型转换的代码才能从使用类型参数中受益。\n\n在本章中，我将向你展示实现自己的泛型代码所需的所有知识。不过，我预计大多数读者将主要利用这些知识来帮助故障排除，并满足对参数化集合类内部原理的好奇。\n\
  \n## 定义一个简单的泛型类\n\n`generic class`（泛型类）是一个带有一个或多个类型变量的类。在本章中，使用一个简单的 `Pair` 类作为示例。这个类允许我们专注于泛型，而不被数据存储细节所分散。以下是泛型\
  \ `Pair` 类的代码：\n\n```java\npublic class Pair<T>\n{\n   private T first;\n   private\
  \ T second;\n\n   public Pair() { first = null; second = null; }\n   public Pair(T\
  \ first, T second) { this.first = first; this.second = second; }\n\n   public T\
  \ getFirst() { return first; }\n   public T getSecond() { return second; }\n\n \
  \  public void setFirst(T newValue) { first = newValue; }\n   public void setSecond(T\
  \ newValue) { second = newValue; }\n}\n```\n\n`Pair` 类在类名之后引入了用尖括号 `< >` 包围的类型变量\
  \ `T`。泛型类可以有多个类型变量。例如，我们可以为第一个和第二个字段定义不同的类型定义 `Pair` 类：\n\n```java\npublic class\
  \ Pair<T, U> { . . . }\n```\n\n类型变量贯穿整个类定义，用于指定方法的返回类型以及字段和局部变量的类型。例如：\n\n```java\n\
  private T first; // 使用类型变量\n```\n\n使用大写字母作为类型变量并保持简短是常见做法。Java 库使用变量 `E` 作为集合的元素类型，`K`\
  \ 和 `V` 作为表格的键和值类型，`T`（必要时还有相邻的字母 `U` 和 `S`）表示“任何类型”。\n\n你通过为类型变量替换类型来 `instantiate`（实例化）泛型类型，例如\n\
  \n```java\nPair<String>\n```\n\n你可以将结果视为具有以下构造函数的普通类：\n\n```java\nPair<String>()\n\
  Pair<String>(String, String)\n```\n\n以及方法：\n\n```\nString getFirst()\nString getSecond()\n\
  void setFirst(String)\nvoid setSecond(String)\n```\n\n换句话说，泛型类是普通类的工厂。\n\n`[]index.xhtml_ch12ex01`\
  \ 中的程序让 `Pair` 类运行了起来。静态方法 `minmax` 遍历数组并同时计算最小值和最大值。它使用 `Pair` 对象来返回这两个结果。回想 `compareTo`\
  \ 方法比较两个字符串，如果字符串相同则返回 `0`，如果第一个字符串在字典顺序上于第二个字符串，则返回负整数，否则返回正整数。\n\n从表面上看，Java 的泛型类与\
  \ C++ 的模板类（template classes）相似。唯一的区别是 Java 没有特殊的 `template` 关键字。然而，正如你将在本章中看到的，这机制之间存在巨大的差异。\n\
  \n`pair1/PairTest1.java`\n\n```java\npackage pair1;\n\n/**\n * @version 1.01 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class PairTest1\n{\n    public static void\
  \ main(String[] args)\n    {\n        String[] words = { \"Mary\", \"had\", \"a\"\
  , \"little\", \"lamb\" };\n        Pair<String> mm = ArrayAlg.minmax(words);\n \
  \       System.out.println(\"min = \" + mm.getFirst());\n        System.out.println(\"\
  max = \" + mm.getSecond());\n    }\n}\n\nclass ArrayAlg\n{\n    /**\n     * 获取字符串数组的最小值和最大值。\n\
  \     * @param a 一个字符串数组\n     * @return 一个包含最小和最大值的对，如果 a 为 null 或空则返回 null\n \
  \    */\n    public static Pair<String> minmax(String[] a)\n    {\n        if (a\
  \ == null || a.length == 0) return null;\n        String min = a[0];\n        String\
  \ max = a[0];\n        for (int i = 1; i < a.length; i++)\n        {\n         \
  \   if (a[i].compareTo(min) < 0) min = a[i];\n            if (a[i].compareTo(max)\
  \ > 0) max = a[i];\n        }\n        return new Pair<>(min, max);\n    }\n}\n\
  ```\n\n## 泛型方法\n\n在前节中，你已经学习了如何定义泛型类。你也可以定义带有类型参数的单个方法。\n\n```java\nclass ArrayAlg\n\
  {\n   public <T extends Comparable<T>> T minmax(T[] a)\n   {\n      if (a == null\
  \ || a.length == 0) return null;\n      T min = a[0];\n      T max = a[0];\n   \
  \   for (int i = 1; i < a.length; i++)\n      {\n         if (a[i].compareTo(min)\
  \ < 0) min = a[i];\n         if (a[i].compareTo(max) > 0) max = a[i];\n      }\n\
  \      return min; // 为了示例目的进行了简化\n   }\n}\n```\n\n当你调用泛型方法时，可以在方法名之前放置用尖括号包围的实际类型：\n\
  \n```java\nString middle = <String>getMiddle(\"John\", \"Public\");\n```\n\n在这种情况下（实际上在大多数情况下都是），你可以从方法调用中省略\
  \ `<String>` 类型参数。编译器有足够的信息来推断你想要的方法。也就是说，你简单地调用：\n\n```java\nString middle = ArrayAlg.getMiddle(\"\
  John\", \"Public\");\n```\n\n在几乎所有情况下，泛型方法的类型推断都能顺畅工作。偶尔编译器会出错，这时你需要解读错误报告。考虑这个例子：\n\
  \n```java\ndouble middle = ArrayAlg.getMiddle(3.14, 1729, 0);\n```\n\n错误信息用晦涩的术语（随不同编译器而异）抱怨道，这段代码有两种解释方式，且两种都有效。简而言之，编译器将参数自动装箱为\
  \ `Double` 和两个 `Integer` 对象，然后尝试寻找这些类的公共父类。它实际上找到了两个：`Number` 和 `Comparable` 接口，而后者本身也是一个泛型类型。在这种情况下，解决办法是将所有参数都写为\
  \ `double` 值。\n\nPeter von der Ahé 建议，如果你想查看编译器为泛型方法调用推断出什么类型，可以尝试这个技巧：故意引入错误并研究生成的错误信息。例如，考虑调用\
  \ `ArrayAlg.getMiddle(\"Hello\", 0, null)`。将结果赋值给 `JButton`，这显然是不可能的。你会得到一个错误报告：\n\
  \n```\nfound:\njava.lang.Object&java.io.Serializable&java.lang.Comparable<? extends\n\
  java.lang.Object&java.io.Serializable&java.lang.Comparable<?>>\n```\n\n用通白的话说，你可以将结果赋值给\
  \ `Object`、`Serializable` 或 `Comparable`。\n\n在 C++ 中，你将类型参数放在方法名之后。这可能导致糟糕的解析歧义。例如，`g(f<a,b>(c))`\
  \ 可以意味着“调用 `g` 并传入 `f<a,b>(c)` 的结果”，也可以意味着“调用 `g` 并传入两个布尔值 `f<a` 和 `b>(c)`”。\n\n\
  ## 类型变量边界\n\n\n\n\n有时候，类或方法需要对类型变量设置限制。这是一个典型的示例。我们想要计算数组中的最小元素：\n\n```\nclass ArrayAlg\n\
  {\n   public static <T> T min(T[] a) // 几乎正确\n   {\n      if (a == null || a.length\
  \ == 0) return null;\n      T smallest = a[0];\n      for (int i = 1; i < a.length;\
  \ i++)\n         if (smallest.compareTo(a[i]) > 0) smallest = a[i];\n      return\
  \ smallest;\n   }\n}\n```\n\n但是这里有一个问题。观察 `min` 方法内部的代码。变量 `smallest` 的类型为 `T`，这意味着它可以是任意类的对象。我们如何知道\
  \ `T` 所属的类具有 `compareTo` 方法呢？\n\n解决方案是将 `T` 限制为实现了 `Comparable` 接口的类——该接口是一个包含单个方法\
  \ `compareTo` 的标准接口。你可以通过为类型变量 `T` 提供一个`bound`（边界）来实现这一点：\n\n```\npublic static\
  \ <T extends Comparable> T min(T[] a) . . .\n```\n\n实际上，`Comparable` 接口本身就是一个泛型类型。目前请忽略该复杂性以及编译器生成的警告。我们将讨论如何结合\
  \ `Comparable` 接口正确使用类型参数。\n\n现在，泛型 `min` 方法只能通过实现了 `Comparable` 接口的类的数组调用，例如 `String`、`LocalDate`\
  \ 等。使用 `Rectangle` 数组调用 `min` 将导致编译时错误，因为 `Rectangle` 类没有实现 `Comparable`。\n\n在在\
  \ C++ 中，你无法限制模板参数的类型。如果程序员用不适当的类型实例化模板，则会在模板代码内部报告一个（通常是晦懂的）错误信息。\n\n你可能会奇怪，为什么在这种情况下我使用\
  \ `extends` 关键字而不是 `implements` 关键字——毕竟 `Comparable` 是一个接口。这种表示法\n\n```\n<T extends\
  \ BoundingType>\n```\n\n表示 `T` 应该是边界类型的 `subtype`（子类型）。`T` 和边界类型都可以是类，也可以是接口。之所以选择\
  \ `extends` 关键字是因为它是子类型概念的合理近似，而且 Java 的设计者不想向语言中添加新的关键字（例如 `sub`）。\n\n一个类型变量可以有多个边界。例如：\n\
  \n```\nT extends Comparable & Serializable\n```\n\n边界类型之间使用符号（`&`）分隔，因为逗号被用于分隔类型变量。\n\
  \n与 Java 继承一样，你可以拥有任意数量的接口超类型，但边界中最多只能有一个类。如果你有一个类作为边界，它必须是边界列表中的第一个。\n\n在下一个示例程序中，我们重写了\
  \ `minmax` 方法为泛型。该方法计算泛型数组的最小最大值，返回一个 `Pair<T>`。\n\n`pair2/PairTest2.java`\n\n```java\n\
  package pair2;\n\nimport java.time.*;\n\n/**\n * @version 1.02 2015-06-21\n * @author\
  \ Cay Horstmann\n */\npublic class PairTest2\n{\n    public static void main(String[]\
  \ args)\n    {\n        LocalDate[] birthdays = \n        { \n            LocalDate.of(1906,\
  \ 12, 9), // G. Hopper\n            LocalDate.of(1815, 12, 10), // A. Lovelace\n\
  \            LocalDate.of(1903, 12, 3), // J. von Neumann\n            LocalDate.of(1910,\
  \ 6, 22), // K. Zuse\n        };\n\n        Pair<LocalDate> mm = ArrayAlg.minmax(birthdays);\n\
  \        System.out.println(\"min = \" + mm.getFirst());\n        System.out.println(\"\
  max = \" + mm.getSecond());\n    }\n}\n\nclass ArrayAlg\n{\n    /**\n     * 获取类型为\
  \ T 的对象数组的最小值和最大值。\n     * @param a 一个 T 类型对象的数组\n     * @return 包含最小和最大值的对，如果 a\
  \ 为空或为空则返回 null\n     */\n    public static <T extends Comparable> Pair<T> minmax(T[]\
  \ a) \n    {\n        if (a == null || a.length == 0) return null;\n        T min\
  \ = a[0];\n        T max = a[0];\n        for (int i = 1; i < a.length; i++)\n \
  \       {\n            if (min.compareTo(a[i]) > 0) min = a[i];\n            if\
  \ (max.compareTo(a[i]) < 0) max = a[i];\n        }\n        return new Pair<>(min,\
  \ max);\n    }\n}\n```\n\n## 泛型代码与虚拟机\n\n有时候，类或方法需要对类型变量设置限制。这是一个典型的示例。\n\n### 类型擦除\n\
  \n在这方面，泛型与 C++ 非常不同。C++ 为每个模板实例化产生不同的类型——这种现象被称为“模板膨胀”。Java 则不会受此影响。\n\n原始类型将 `T`\
  \ 替换为第一个边界，如果没有提供边界则使用 `Object`。例如，原始类型 `Pair` 看起来如下：\n\n```java\npublic class Pair\n\
  {\n   private Object first;\n   private Object second;\n\n   public Pair(Object\
  \ first, Object second)\n   {\n      this.first = first;\n      this.second = second;\n\
  \   }\n\n   public Object getFirst() { return first; }\n   public Object getSecond()\
  \ { return second; }\n\n   public void setFirst(Object first) { first = first; }\n\
  \   public void setSecond(Object second) { second = second; }\n}\n```\n\n当你编写泛型方法时，如果返回类型已被擦除，编译器会插入类型转换。例如，考虑以下语句\n\
  \n```java\nPair<Employee> buddies = . . .;\nEmployee buddy = buddies.getFirst();\n\
  ```\n\n`getFirst` 的擦除返回类型为 `Object`。编译器会自动插入到 `Employee` 的转换。也就是说，编译器将方法调用转换为两条虚拟机指令：\n\
  \n*   对原始方法 `Pair.getFirst` 的调用\n*   将返回的 `Object` 强制转换为类型 `Employee`\n\n当你访问泛型字段时，也会插入类型转换。假设\
  \ `Pair` 类的 `first` 和 `second` 字段是公的。（也许这并不是一种良好的编程风格，但在 Java 中是合法的。）那么表达式\n\n\n\
  \n\n```\nEmployee buddy = buddies.first;\n```\n\n在生成的字节码中也插入了强制类型转换。\n\n### 翻译泛型方法\n\
  \n类型擦除（Type erasure）也发生在泛型方法中。程序员通常将泛型方法例如\n\n```java\npublic static <T extends\
  \ Comparable> T min(T[] a)\n```\n\n视为整个方法族，但在擦除后，只剩下一个方法：\n\n```java\npublic static\
  \ Comparable min(Comparable[] a)\n```\n\n注意类型参数 `T` 已经被擦除，只留下了它的边界类型 `Comparable`。\n\
  \n方法的擦除带来了一些复杂性。考虑这个例子：\n\n```\nclass DateInterval extends Pair<LocalDate>\n{\n\
  \   public void setSecond(LocalDate second)\n   {\n      if (second.compareTo(getFirst())\
  \ >= 0)\n         super.setSecond(second);\n   }\n   . . .\n}\n```\n\n日期间隔是一对 `LocalDate`\
  \ 对象，我们希望重写这些方法以确保第二个值永远不会小于第一个。这个类被擦除为：\n\n```\nclass DateInterval extends Pair\
  \ // 擦除后\n{\n   public void setSecond(LocalDate second) { . . . }\n   . . .\n}\n\
  ```\n\n也许令人惊讶的是，还有一个继承自 `Pair` 的 `setSecond` 方法，即：\n\n```java\npublic void setSecond(Object\
  \ second)\n```\n\n这显然是一个不同的方法，因为它具有不同类型的参数——`Object` 而不是 `LocalDate`。但它*不应该是*不同的。考虑以下语句序列：\n\
  \n```java\nvar interval = new DateInterval(. . .);\nPair<LocalDate> pair = interval;\
  \ // OK--赋值给父类\npair.setSecond(aDate);\n```\n\n我们的期望是 `setSecond` 的调用是多态的，并调用适当的方法。由于\
  \ `pair` 指向一个 `DateInterval` 对象，那应该是 `DateInterval.setSecond`。问题在于类型擦除干扰了多态性。为了解决这个问题，编译器在\
  \ `DateInterval` 类中生成了一个*桥接方法*（bridge method）：\n\n```java\npublic void setSecond(Object\
  \ second) { setSecond((LocalDate) second); }\n```\n\n为了理解为什么这样做有效，让我们仔细跟踪语句的执行过程：\n\
  \n```java\npair.setSecond(aDate)\n```\n\n变量 `pair` 的声明类型为 `Pair<LocalDate>`，该类型只有一个名为\
  \ `setSecond` 的方法，即 `setSecond(Object)`。虚拟机在 `pair` 指向的对象上调用该方法。该对象的类型是 `DateInterval`。因此，调用了\
  \ `DateInterval.setSecond(Object)`。该方法就是生成的桥接方法。它调用了 `DateInterval.setSecond(LocalDate)`，这正是我们想要的。\n\
  \n桥接方法可能会变得更加奇怪。假设 `DateInterval` 类还重写了 `getSecond` 方法：\n\n```\nclass DateInterval\
  \ extends Pair<LocalDate>\n{\n   public LocalDate getSecond() { return (LocalDate)\
  \ super.getSecond(); }\n   . . .\n}\n```\n\n在 `DateInterval` 类中，有两个 `getSecond`\
  \ 方法：\n\n```java\nLocalDate getSecond() // 定义在 DateInterval 中\nObject getSecond()\
  \ // 重写 Pair 中定义的方法以调用第一个方法\n```\n\n你不能像那样编写 Java 代码；拥有两个相同参数类型（在这里是都是无参数）的方法是非法的。然而，在虚拟机中，参数类型*和*返回值共同指定了一个方法。因此，编译器可以为两个仅返回值不同的方法生成字节码，虚拟机将正确处理这种情况。\n\
  \n桥接方法不仅限于泛型类型。你已经在第 5 章 中看到，在重写另一个方法时，指定更具限制性的返回值是合法的。例如：\n\n```java\npublic class\
  \ Employee implements Cloneable\n{\n   public Employee clone() throws CloneNotSupportedException\
  \ { . . . }\n}\n```\n\n`Object.clone` 和 `Employee.clone` 方法被称为具有*协变返回值*（covariant\
  \ return types）。\n\n实际上，`Employee` 类有*两个* `clone` 方法：\n\n```java\nEmployee clone()\
  \ // 上文定义\nObject clone() // 生成的桥接方法，重写了 Object.clone\n```\n\n生成的桥接方法调用新定义的方法。\n\
  \n总结来说，你需要记住关于 Java 泛型翻译的事实：\n\n* 虚拟机中没有泛型，只有普通的类和方法。\n* 所有类型参数都被替换为它们的边界类型。\n*\
  \ 通过生成桥接方法以保持多态性。\n* 在需要时插入强制类型转换以保持类型安全。\n\n### 调用旧代码\n\n在设计 Java 泛型时，一个主要目标是允许泛型与旧代码之间的互操作性。让我们来看一个旧代码的具体示例。Swing\
  \ 用户界面工具包提供了一个 `JSlider` 类，其“刻度”可以使用包含文本或图像的标签进行自定义。标签通过以下调用设置：\n\n```java\nvoid\
  \ setLabelTable(Dictionary table)\n```\n\n`Dictionary` 类将整数映射到标签。在 Java 5 之前，该类实现为\
  \ `Object` 实例的映射。Java 5 将 `Dictionary` 变成一个泛型类，但 `JSlider` 从未更新过。此时，没有类型参数的 `Dictionary`\
  \ 是一个原始类型（raw type）。这就是兼容性发挥作用。\n\n当你填充字典时，可以使用泛型类型。\n\n```java\nDictionary<Integer,\
  \ Component> labelTable = new Hashtable<>();\nlabelTable.put(0, new JLabel(new ImageIcon(\"\
  nine.png\")));\nlabelTable.put(20, new JLabel(new ImageIcon(\"nine.png\")));\n```\n\
  \n\n\n\n当你使用泛型类时，需要学习一些关于继承和子类型的规则。让我们从一个许多程序员认为不符合直觉的情况开始。考虑一个类和它的子类，例如 `Employee`\
  \ 和 `Manager`。`Pair<Manager>` 是 `Pair<Employee>` 的子类型吗？可能让你惊讶的是，答案是“不是”。例如，以下代码将无法编译：\n\
  \n```\nPair<Employee> buddies = new Pair<Manager>(ceo, cfo); // 非法\n```\n\n通常情况下，`Pair<S>`\
  \ 和 `Pair<T>` 之间没有关系，无论 `S` 和 `T` 如何如何关联（参见 [](#index.xhtml_ch12fig01)）。\n\n![Figure](img/12_01.jpg)Pair\
  \ 类之间没有继承关系\n\n这看起来像是一个严苛的限制，但它对于类型安全来说是必要的。假设我们允许将 `Pair<Manager>` 转换为 `Pair<Employee>`。考虑这段代码：\n\
  \n```\nvar managerBuddies = new Pair<Manager>(ceo, cfo);\nPair<Employee> employeeBuddies\
  \ = managerBuddies; // 非法，但假设它是可以\nemployeeBuddies.setFirst(lowlyEmployee);\n```\n\
  \n显然，最后一条语句是合法的。但 `employeeBuddies` 和 `managerBuddies` 指向同一个对象。我们现在成功地将 CFO 与一个低级员工配对，这对于一个\
  \ `Pair<Manager>` 来说是不可能的。\n\n你刚刚看到了泛型类型与 Java 数组之间的重要区别。你可以将 `Manager[]` 数组赋值给类型为\
  \ `Employee[]` 的变量：\n\n```\nManager[] managerBuddies = { ceo, cfo };\nEmployee[]\
  \ employeeBuddies = managerBuddies; // OK\n```\n\n然而，数组带有特殊的保护。如果你尝试将一个低级员工存入 `employeeBuddies[0]`，虚拟机将抛出\
  \ `ArrayStoreException`。\n\n你始终可以将参数化类型转换为原始类型（raw type）。例如，`Pair<Employee>` 是原始类型\
  \ `Pair` 的子类型。这种转换对于与遗留代码交互是必要的。\n\n你可以转换为原始类型然后导致类型错误吗？遗憾的是，你可以的。考虑这个例子：\n\n```\n\
  var managerBuddies = new Pair<Manager>(ceo, cfo);\nPair rawBuddies = managerBuddies;\
  \ // OK\nrawBuddies.setFirst(new File(\". . .\")); // 仅编译警告\n```\n\n这听起来很可怕。然而，请记住，你的处境并不比旧版本\
  \ Java 时更糟。虚拟机的安全性并没有受到威胁。当用 `getFirst` 获取外部对象并将其赋值给 `Manager` 变量时，会抛出 `ClassCastException`，就像在过去一样。你只是丢失了泛型编程通常提供的额外安全性。\n\
  \n最后，泛型类可以扩展或实现其他泛型类。在这方面，它们与普通类没有区别。例如，`ArrayList<T>` 类实现了接口 `List<T>`。这意味着 `ArrayList<Manager>`\
  \ 可以转换为 `List<Manager>`。然而，正如你刚刚看到的，`ArrayList<Manager>` 并不是 `ArrayList<Employee>`\
  \ 或 `List<Employee>`。[](#index.xhtml_ch12fig02) 显示了这些关系。\n\n![Figure](img/12_02.jpg)泛型列表类型之间的子类型关系\n\
  \n## 通配符类型\n\n类型系统研究人员早就发现，僵化的泛型类型系统用起来非常不方便。Java 设计者发明了一个巧妙（但尽管如此是安全的）“逃口”：通配符类型。接下来的章节将向你展示如何使用通配符。\n\
  \n### 通配符概念\n\n在通配符类型中，允许类型参数变化。例如，通配符类型\n\n```\nPair<? extends Employee>\n```\n\
  \n表示任何类型参数为 `Employee` 的子类的泛型 `Pair` 类型，例如 `Pair<Manager>`，但不是 `Pair<String>`。\n\
  \n假设你想写一个打印员工对的方法，如下所示：\n\n```\npublic static void printBuddies(Pair<Employee> p)\n\
  {\n   Employee first = p.getFirst();\n   Employee second = p.getSecond();\n   System.out.println(first.getName()\
  \ + \" and \" + second.getName() + \" are buddies.\");\n}\n```\n\n正如你在上一节中看到的，你不能将\
  \ `Pair<Manager>` 传递给该方法，这相当的局限。但解决方案很简单——使用通配符类型：\n\n```\npublic static void printBuddies(Pair<?\
  \ extends Employee> p)\n```\n\n类型 `Pair<Manager>` 是 `Pair<? extends Employee>` 的子类型（参见\
  \ [](#index.xhtml_ch12fig03)）。\n\n![Figure](img/12_03.jpg)带有通配符的子类型关系\n\n我们可以使用通配符通过\
  \ `Pair<? extends Employee>` 引用来破坏 `Pair<Manager>` 吗？\n\n```\nvar managerBuddies\
  \ = new Pair<Manager>(ceo, cfo);\nPair<? extends Employee> wildcardBuddies = managerBuddies;\
  \ // OK\nwildcardBuddies.setFirst(lowlyEmployee); // 编译错误\n```\n\n不可能发生破坏。对 `setFirst`\
  \ 的调用是一个类型错误。为了了解为什么，让我们仔细观察 `Pair<? extends Employee>` 类型。它的方法看起来如下：\n\n```\n?\
  \ extends Employee getFirst()\nvoid setFirst(? extends Employee)\n```\n\n无法调用 `setFirst`\
  \ 方法！考虑调用 `wildcardBuddies.setFirst(lowlyEmployee)`……（此处原文存在大量重复逻辑描述，已忽略重复）。你只是丢失了泛型编程通常提供的额外安全性。\n\
  \n### 通配符的上界边界\n\n通配符边界与类型变量边界相似，但它们有一个额外功能——你可以指定一个上界边界，如下：\n\n```\n? super Manager\n\
  ```\n\n此通配符被限制为 `Manager` 的所有上类型。（`super` 关键字如此准确地描述这种关系是一种幸运。）\n\n你为什么想这样做？带有上界边界的通配符提供的行为与\
  \ [](#index.xhtml_wildcard-concept) 中的通配符相反。你可以为方法提供参数，但不能使用返回值。例如，`Pair<? super\
  \ Manager>` 的方法可以描述如下：\n\n```\nvoid setFirst(? super Manager)\n? super Manager getFirst()\n\
  ```\n\n这不是真正的 Java 语法，但它显示了编译器知道什么。`setFirst` 参数类型标记为 `? super Manager` 是某些特定类型\
  \ `T`，而 `Manager` 是 `T` 的子类型。`T` 正好三种选择：`Object`、`Employee` 或 `Manager`。（如果 `Manager`\
  \ 或 `Employee` 实现了接口会有更多选择。）然而，编译器不知道适用于哪种选择。因此，编译器无法接受带有 `Employee` 或 `Object`\
  \ 参数的调用。毕竟，`T` 可能是 `Manager`。只有传递类型为 `Manager` 或其子类型（如 `Executive`）的对象才是可能的。\n\n\
  相反，如果你调用 `getFirst`，则对返回对象的类型没有保证。你只能将其赋值给 `Object`。\n\n这是边界通配符背后的核心思想。我们现在有一种方法区分安全方法和修改方法（mutator\
  \ methods）。\n\n这里有一个典型的例子。我们有一个经理数组，并将奖金最低和最高的经理放入一个 `Pair` 对象中。什么样的 `Pair`？`Pair<Manager>`\
  \ 是显而易见的选择，但还有其他可能性。`Pair<Employee>`应该是合理的，或者说，是 `Pair<Object>`（参见 [](#index.xhtml_ch12fig04)）。以下方法将接受任何合适的\
  \ `Pair`：\n\n\n\n\n```java\npublic static void minmaxBonus(Manager[] a, Pair<? super\
  \ Manager> result)\n{\n   if (a.length == 0) return;\n   Manager min = a[0];\n \
  \  Manager max = a[0];\n   for (int i = 1; i < a.length; i++)\n   {\n      if (min.getBonus()\
  \ > a[i].getBonus()) min = a[i];\n      if (max.getBonus() < a[i].getBonus()) max\
  \ = a[i];\n   }\n   result.setFirst(min);\n   result.setSecond(max);\n}\n```\n\n\
  ![Figure](img/12_04.jpg) 带有上类型边界的通配符\n\n直观来说，带有上类型边界的通配符允许你向泛对象写入数据，而带有子类型边界的通配符则允许你从泛对象中读取数据。\n\
  \n这是上类型边界的另一个用途。`Comparable` 接口本身就是一个泛型。它的声明如下：\n\n```java\npublic interface Comparable<T>\n\
  {\n   public int compareTo(T other);\n}\n```\n\n在这里，类型变量指示了 `other` 参数的类型。例如，`String`\
  \ 类实现了 `Comparable<String>`，它的 `compareTo` 方法声明为：\n\n```java\npublic int compareTo(String\
  \ other)\n```\n\n这很好——显式参数具有正确的类型。在接口泛型化之前，`other` 是一个 `Object`，在方法的实现中需要进行类型转换。\n\
  \n既然 `Comparable` 是一个泛型类型，也许我们应该对 `ArrayAlg` 类的 `minmax` 方法做得更好？我们可以将其声明为：\n\n```java\n\
  public static <T extends Comparable<T>> Pair<T> minmax(T[] a)\n```\n\n这看起来比仅仅使用\
  \ `T extends Comparable` 更加详尽，并且对许多类都有效良好。例如，如果你计算一个 `String` 数组的最小值，那么 `T` 就是类型\
  \ `String`，而 `String` 是 `Comparable<String>` 的子类型。但在处理 `LocalDate` 对象数组时，我们会遇到一个问题。事实上，`LocalDate`\
  \ 实现了 `ChronoLocalDate`，而 `ChronoLocalDate` 扩展了 `Comparable<ChronoLocalDate>`。因此，`LocalDate`\
  \ 实现了 `Comparable<ChronoLocalDate>` 但不是 `Comparable<LocalDate>`。\n\n在这种情况下，上类型派上了用场：\n\
  \n```java\npublic static <T extends Comparable<? super T>> Pair<T> minmax(T[] a)\n\
  ```\n\n现在，`compareTo` 方法的形式变为：\n\n```java\nint compareTo(? super T)\n```\n\n也许它被声明为接收一个类型为\
  \ `T` 的对象，或者（例如当 `T` 为 `LocalDate` 时）`T` 的上类型。无论如何，将类型为 `T` 的对象传递给 `compareTo` 方法是安全的。\n\
  \n对于初学者，像 `<T extends Comparable<? super T>>` 这样的声明看起来很令畏。这很遗憾，因为这个声明的意图是通过移除调用参数的不必要限制来帮助应用程序程序员。对泛型不感兴趣的应用程序程序员可能会学会忽略这些声明，并理所当然认为库程序员会做正确的事。如果你是一个库程序员，你将习惯通配符，否则你的用户会诅咒你，并在代码中随机抛出类型转换，直到编译通过为止。\n\
  \n上类型边界的另一个常见用途是函数接口的参数类型。例如，`Collection` 接口有一个方法：\n\n```java\ndefault boolean removeIf(Predicate<?\
  \ super E> filter)\n```\n\n该方法移除所有满足给定谓词的元素。例如，如果你讨厌哈希码为奇数的员工，可以这样删除他们：\n\n```java\n\
  ArrayList<Employee> staff = . . .;\nPredicate<Object> oddHashCode = obj -> obj.hashCode()\
  \ %2 != 0;\nstaff.removeIf(oddHashCode);\n```\n\n你希望能够传递一个 `Predicate<Object>`，而不仅仅是\
  \ `Predicate<Employee>`。`super` 通配符使得这可能。\n\n### 无边界通配符\n\n你甚至可以使用没有任何边界的通配符——例如，`Pair<?>`。从表面上看，它看起来与原始\
  \ `Pair` 类型完全相同。实际上，这些类型非常不同。类型 `Pair<?>` 拥有如下方法：\n\n```java\n? getFirst()\nvoid\
  \ setFirst(?)\n```\n\n`getFirst` 的返回值只能赋值给 `Object`。`setFirst` 方法永远无法被调用，即使使用 `Object`\
  \ 也行。这就是 `Pair<?>` 和 `Pair` 之间的本质区别：你可以用任何 `Object` 调用原始 `Pair` 类的 `setFirst` 方法。\n\
  \n你可以调用 `setFirst(null)`。\n\n你为什么需要这样一个弱化的类型呢？它对于非常简单的操作很有用。例如，下面的方法测试对是否包含 `null`\
  \ 引用。它不需要实际类型。\n\n```java\npublic static boolean hasNulls(Pair<?> p)\n{\n   return\
  \ p.getFirst() == null || p.getSecond() == null;\n}\n```\n\n你可以通过将 `hasNulls` 转换为泛型方法来避免使用通配符类型：\n\
  \n```java\npublic static <T> boolean hasNulls(Pair<T> p)\n```\n\n然而，带有通配符类型的版本似乎更容易读。\n\
  \n### 通配符捕获\n\n让我们写一个交换对中元素的方法：\n\n\n\n\n```java\nEmployee second = p.getSecond();\n\
  System.out.println(first.getName() + \" and \" + second.getName() + \" are buddies.\"\
  );\n\npublic static void minmaxBonus(Manager[] a, Pair<? super Manager> result)\
  \ {\n    if (a.length == 0) return;\n    Manager min = a[0];\n    Manager max =\
  \ a[0];\n    for (int i = 1; i < a.length; i++) {\n        if (min.getBonus() >\
  \ a[i].getBonus()) min = a[i];\n        if (max.getBonus() < a[i].getBonus()) max\
  \ = a[i];\n    }\n    result.setFirst(min);\n    result.setSecond(max);\n}\n\npublic\
  \ static void maxminBonus(Manager[] a, Pair<? super Manager> result) {\n    minmaxBonus(a,\
  \ result);\n    PairAlg.swapHelper(result); // OK--swapHelper captures wildcard\
  \ type\n}\n\n// can't write public static <T super manager> . . .\nclass PairAlg\
  \ {\n    public static boolean hasNulls(Pair<?> p) {\n        return p.getFirst()\
  \ == null || p.getSecond() == null;\n    }\n\n    public static void swap(Pair<?>\
  \ p) { swapHelper(p); }\n\n    public static <T> void swapHelper(Pair<T> p) {\n\
  \        T t = p.getFirst();\n        p.setFirst(p.getSecond());\n        p.setSecond(t);\n\
  \    }\n}\n```\n\n## 限制与局限性\n\n在接下来的章节中，我将讨论在使用 Java 泛型时需要考虑的若干限制。这些限制的大多数是类型擦除（type\
  \ erasure）的结果。\n\n### 类型参数不能用基本类型实例化\n\n你不能用基本类型来代替类型参数。因此，没有 `Pair<double>`，只有\
  \ `Pair<Double>`。原因显然是类型擦除。在擦除之后，`Pair` 类拥有类型为 `Object` 的字段，而你无法使用这些字段来存储 `double`\
  \ 值。\n\n这确实是一个令人恼扰的问题，但这与 Java 语言中基本类型的独立地位是一致的。这并不是一个致命缺陷——只有八种基本类型，当包装类型不能作为合适的替代品时，你始终可以使用单独的类和方法来处理它们。\n\
  \n### 运行时类型查询仅对原始类型有效\n\n虚拟机中的对象始终具有特定的非泛型类型。因此，所有的类型查询只能产生原始类型（raw type）。例如：\n\n\
  ```java\nif (a instanceof Pair<String>) // 错误\n```\n\n只能测试 `a` 是否是任意类型的 `Pair`。对于以下测试也是如此：\n\
  \n```java\nif (a instanceof Pair<T>) // 错误\n```\n\n或者类型转换：\n\n```java\nPair<String>\
  \ p = (Pair<String>) a; // 警告--只能测试 a 是不是一个 Pair\n```\n\n为了提醒你注意风险，当你尝试查询一个对象是否属于某个泛型类型时，将会得到编译器错误（使用\
  \ `instanceof` 时）或警告（使用强制转换时）。\n\n出于同样的考虑，`getClass()` 方法始终返回原始类型。例如：\n\n```java\n\
  Pair<String> stringPair = . . .;\nPair<Employee> employeePair = . . .;\nif (stringPair.getClass()\
  \ == employeePair.getClass()) // 它们是相等的\n```\n\n比较的结果为 `true`，因为两次调用 `getClass()`\
  \ 返回的都是 `Pair.class`。\n\n### 你不能创建参数化类型的数组\n\n你不能实例化参数化类型的数组，例如：\n\n```java\nvar\
  \ table = new Pair<String>[10]; // 错误\n```\n\n这有什么问题呢？擦除后，`table` 的类型是 `Pair[]`。你可以将其转换为\
  \ `Object[]`：\n\n```java\nObject[] objarray = table;\n```\n\n数组会记住其组件类型，并在你尝试存储错误类型的元素时抛出\
  \ `ArrayStoreException`：\n\n```java\nobjarray[0] = \"Hello\"; // 错误--组件类型是 Pair\n\
  ```\n\n但类型擦除使得这种机制对于泛型类型失效。以下赋值操作：\n\n```java\nobjarray[0] = new Pair<Employee>();\n\
  ```\n\n将通过数组存储检查，但仍然会导致类型错误。由于由于原因，参数化类型的数组是被禁止的。\n\n注意，仅创建这些数组是被禁止的。你可以声明一个类型为\
  \ `Pair<String>[]` 的变量。但你不能用 `new Pair<String>[10]` 来初始化它。\n\n你可以声明通配符类型的数组然后对其进行强制转换：\n\
  \n```java\nvar table = (Pair<String>[]) new Pair<?>[10];\n```\n\n结果是不安全的。如果你在 `table[0]`\
  \ 中存储一个 `Pair<Employee>`，然后对 `table[0].getFirst()` 调用 `String` 方法，你会得到 `ClassCastException`。\n\
  \n如果你需要收集参数化类型对象，只需使用 `ArrayList` 即可：`ArrayList<Pair<String>>` 是安全的。\n\n### 变长参数警告\
  \ 在在前节中，你看到 Java 不支持泛型。在本节中，我将讨论一个相关问题：变长参数（variable arguments）。\n\n```java\npublic\
  \ static <E> void addAll(Collection<E> coll, E... elements) {\n   for (E element\
  \ : elements) coll.add(element);\n}\n```\n\n### 泛型变长参数不支持基本数组\n\n记得你可以将数组传递给变长参数。例如，考虑\
  \ `addAll` 方法……这行不通。对于类型变量 `E` 没有有效的匹配项。`int[]` 无法转换为 `Integer[]`。\n\n\n\n\n\n这是一个更隐蔽的例子。`List`\
  \ 接口有一个静态方法 `of`：\n\n```\npublic static <E> List<E> of(E... elements)\n```\n\n该调用：\n\
  \n```\nList.of(moreStrings) // [\"Mary\", \"had\", \"a\", \"little\", \"lamb\"]\n\
  ```\n\n会产生一个包含 5 个元素的列表。但是\n\n```\nList.of(moreNumbers) \n```\n\n产生的是一个包含单个元素的 `List<int[]>`，该元素是一个包含五个\
  \ `int` 值的数组。类型参数 `E` 无法匹配原始类型 `int`，因此 `moreNumbers` 元素没有被展开。相反，类型参数 `E` 使数组类型变为\
  \ `int[]`。\n\n### 你无法实例化类型变量\n\n你不能在像 `new T(. . .))` 这样的表达式中使用类型变量。例如，以下 `Pair<T>`\
  \ 构造函数是非法的：\n\n```\npublic Pair() { first = new T(); second = new T(); } // ERROR\n\
  ```\n\n类型擦除会将 `T` 变为 `Object`，而你显然不想调用 `new Object()`。\n\n最好的变通方法是让调用者提供一个构造函数表达式。例如：\n\
  \n```\nPair<String> p = Pair.makePair(String::new);\n```\n\n`makePair` 方法接收一个 `Supplier<T>`，这是一个无参数且结果类型为\
  \ `T` 的函数的函数接口：\n\n```\npublic static <T> Pair<T> makePair(Supplier<T> constr)\n\
  {\n   return new Pair<>(constr.get(), constr.get());\n}\n```\n\n另一种更传统的变通方法是通过反射调用\
  \ `Constructor.newInstance` 方法来构造泛型对象。\n\n遗憾的是，这些细节有点复杂。你不能调用\n\n```\nfirst = T.class.getConstructor().newInstance();\
  \ // ERROR\n```\n\n表达式 `T.class` 是不合法的，因为它会被擦除为 `Object.class`。相反，你必须设计 API，以便你能够接收一个\
  \ `Class` 对象，如下所示：\n\n```\npublic static <T> Pair<T> makePair(Class<T> cl) throws\
  \ ReflectiveOperationException\n{\n   Constructor<T> constr = cl.getConstructor();\n\
  \   return new Pair<>(constr.newInstance(), constr.newInstance());\n}\n```\n\n该方法声明为抛出\
  \ `ReflectiveOperationException`，因为该类可能没有无参数构造函数。\n\n调用该方法时，如下所示提供类字面量：\n\n```\n\
  Pair<String> p = Pair.makePair(String.class);\n```\n\n注意 `Class` 类本身是泛型的。例如，`String.class`\
  \ 是 `Class<String>` 的实例（事实上，是唯一的实例）。因此，`makePair` 方法可以推断出它正在创建的对的类型。\n\n### 你无法构造泛型数组\n\
  \n正如你不能实例化单个泛型实例一样，你不能实例化数组。原因是不同的——数组毕竟是用 `null` 值填充的，这看起来构造起来是安全的。但数组还携带了一个类型，该类型用于在虚拟机中监控数组存储操作。而该类型被擦除了。例如，考虑\n\
  \n\n\n```\npublic static <T extends Comparable> T[] minmax(T... a) \n{ \n   T[]\
  \ mm = new T[2]; // ERROR\n   . . . \n}\n```\n\n类型擦除会导致此方法始终构造一个 `Comparable[2]`\
  \ 数组。\n\n如果数组仅用作类的私有实例字段，你可以将数组的元素类型声明为擦除后的类型并使用强制转换。例如，`ArrayList` 类可以这样实现：\n\n\
  ```\npublic class ArrayList<E>\n{\n   private Object[] elements;\n   . . .\n   @SuppressWarnings(\"\
  unchecked\") public E get(int n) { return (E) elements[n]; }\n   public void set(int\
  \ n, E e) { elements[n] = e; } // 不需要强制转换\n}\n```\n\n这种技术不适用于我们的 `minmax` 方法，因为我们返回的是\
  \ `T[]` 数组，如果对它的类型进行谎言，会导致运行时错误。假设我们实现\n\n```\npublic static <T extends Comparable>\
  \ T[] minmax(T... a)\n{\n   var result = new Comparable[2]; // 擦除后类型的数组\n   . .\
  \ .\n   return (T[]) result; // 编译带警告\n}\n```\n\n该调用\n\n```\nString[] names = ArrayAlg.minmax(\"\
  Tom\", \"Dick\", \"Harry\");\n```\n\n在没有任何警告的情况下编译。当方法返回后，将 `Comparable[]` 引用强制转换为\
  \ `String[]` 时会发生 `ClassCastException`。\n\n在这种情况下，最好的办法是要求用户提供数组构造函数表达式：\n\n```\n\
  String[] names = ArrayAlg.minmax(String[]::new, \"Tom\", \"Dick\", \"Harry\");\n\
  ```\n\n构造函数表达式 `String[]::new` 表示一个函数，该函数根据给长度构造一个该长度的 `String` 数组。\n\n该方法使用该参数产生正确类型的数组：\n\
  \n```\npublic static <T extends Comparable> T[] minmax(IntFunction<T[]> constr,\
  \ T... a)\n{\n   T[] result = constr.apply(2);\n   . . .\n}\n```\n\n一种更老的方法是使用反射并调用\
  \ `Array.newInstance`：\n\n```\npublic static <T extends Comparable> T[] minmax(T...\
  \ a)\n{\n   var result = (T[]) Array.newInstance(a.class.getComponentType(), 2);\n\
  ```\n\n### 类型变量在静态上下文中无效\n\n你不能在静态上下文中引用类型变量。例如，以下想法行不可通：\n\n```\npublic class Singleton<T>\n\
  {\n   private static T singleInstance; // ERROR\n\n   public static T getSingleInstance()\
  \ // ERROR\n   {\n      if (singleInstance == null)\n      return singleInstance;\n\
  \   }\n}\n```\n\n### 你无法抛出或捕获泛类实例\n\n你既不能抛出也不能捕获泛类的对象。事实上，泛型类继承 `Throwable` 是非法的。例如，以下定义无法编译：\n\
  \n```\npublic class Problem<T> extends Exception { /* . . */ } \n   // ERROR--继承\
  \ Throwable\n```\n\n然而，在异常规范中使用类型变量是可以的。以下是合法的：\n\n```\ninterface CheckedConsumer<T,\
  \ E extends Exception>\n{\n   void accept(T t) throws E;\n} \n```\n\n你不能在 `catch`\
  \ 句中使用类型变量。例如，以下方法无法编译：\n\n```\npublic static <T, E extends Exception> void doWork(CheckedConsumer<T,\
  \ E> c, T t)\n{\n   try\n   {\n      c.accept(t);\n   }\n   catch (E e) // ERROR--不能捕获类型变量\n\
  \   {\n      logger.log(ERROR, \". . .\", e);\n   }\n}\n```\n\n### 你可以绕过异常检查\n\n\
  Java 异常处理的一个基本原则是你必须为所有检查异常提供处理器。你可以使用泛型来绕过这种方案。关键在于这个方法：\n\n```\n@SuppressWarnings(\"\
  unchecked\")\nstatic <T extends Throwable> void throwAs(Throwable t) throws T \n\
  {\n   throw (T) t;\n} \n```\n\n假设该方法包含在接口 `Task` 中。当你有一个检查异常 `e` 并调用\n\n```\nTask.<RuntimeException>throwAs(e);\n\
  ```\n\n那么编译器将认为 `e` 变成了未检查异常。以下将所有异常转换为编译器认为的未检查异常：\n\n```\ntry\n{\n   do work\n\
  }\ncatch (Throwable t)\n{\n   Task.<RuntimeException>throwAs(t);\n}\n```\n\n\n\n\
  \n```java\ninterface Task\n{\n   void run() throws Exception;\n\n   @SuppressWarnings(\"\
  unchecked\")\n   static <T extends Throwable> void throwAs(Throwable t) throws T\
  \ \n   {\n      throw (T) t;\n   }\n\n   static Runnable asRunnable(Task task) \n\
  \   {\n      return () -> \n         { \n            try\n            {\n      \
  \         task.run();\n            }\n            catch (Exception e)\n        \
  \    {\n               Task.<RuntimeException>throwAs(e);\n            }\n     \
  \    };\n   }\n}\n```\n\n例如，这个程序运行了一个会抛出检查异常的线程：\n\n```java\npublic class Test\n\
  {\n   public static void main(String[] args)\n   {\n      var thread = new Thread(Task.asRunnable(()\
  \ -> \n         {\n            Thread.sleep(1000);\n            System.out.println(\"\
  Hello, World!\");\n            throw new Exception(\"Check this out!\");\n     \
  \    }));\n      thread.start();\n   }\n}\n```\n\n`Thread.sleep()` 方法被声明为抛出 `InterruptedException`，我们再也不需要捕获它了。由于我们没有中断线程，该异常不会被抛出。然而，程序确实抛出了一个检查异常。当你运行程序时，你会得到一个堆栈跟踪。\n\
  \n这有什么了不起的？通常，你必须在 `Runnable` 的 `run()` 方法内部捕获所有的检查异常，并将其**包装**为未检查异常——`run()` 方法声明为不抛出任何检查异常。\n\
  \n但在这里，我们没有包装。我们简单地抛出异常，欺骗编译器认为它不是一个检查异常。\n\n通过泛型类、类型擦除和 `@SuppressWarnings` 注解，我们能够击败\
  \ Java 类型系统的一个部分。\n\n### 警惕擦除后的冲突\n\n当泛型类型被擦除时，创建导致冲突的情况是非法的。这里有一个例子。假设我们为 `Pair`\
  \ 类添加一个 `equals()` 方法，如下：\n\n```java\npublic class Pair<T>\n{\n   public boolean\
  \ equals(T value) { return first.equals(value) && second.equals(value); }\n   .\
  \ . .\n}\n```\n\n考虑一个 `Pair<String>`。从概念上说，它有两个 `equals()` 方法：\n\n```java\nboolean\
  \ equals(String) // 定义在 Pair<T> 中\nboolean equals(Object) // 继承自 Object\n```\n\n\
  但直觉误导了我们。该方法的擦除\n\n```\nboolean equals(T)\n```\n\n是\n\n```\nboolean equals(Object)\n\
  ```\n\n这与 `Object.equals()` 方法发生了冲突。\n\n解决办法当然是重命名这个冲突的方法。\n\n泛型规范引用了另一个规则：“为了支持通过擦除进行翻译，我们实施了限制：类或类型变量不能同时是两个接口类型的子类型，而这两个接口是同一个接口的不同参数化。”例如，以下是非法的：\n\
  \n```java\nclass Employee implements Comparable<Employee> { . . . }\nclass Manager\
  \ extends Employee implements Comparable<Manager> { . . . } // ERROR\n```\n\n`Manager`\
  \ 将实现 `Comparable<Employee>` 和 `Comparable<Manager>`，这是同一个接口的不同参数化。\n\n这种限制与类型擦除之间有什么关系并不直观。毕竟，非泛型的版本\n\
  \n```java\nclass Employee implements Comparable { . . . }\nclass Manager extends\
  \ Employee implements Comparable { . . . }\n```\n\n是合法的。原因要微妙得多。这会与合成的桥接方法（bridge\
  \ methods）产生冲突。实现 `Comparable<X>` 的类会获得一个桥接方法\n\n```java\npublic int compareTo(Object\
  \ other) { return compareTo((X) other); }\n```\n\n你不能为不同的类型 `X`get 两个这样的方法。\n\n\
  ### 泛型 Record 模式中的类型推断是的\n\n当涉及泛型类型时，编译器可能需要非常努力来验证完备性。考虑这个完整的 JSON 类型层次结构：\n\n\
  ```java\nsealed interface JSONPrimitive<T> {}\nrecord JSONNumber(double value) implements\
  \ JSONPrimitive<Double> {}\nrecord JSONBoolean(boolean value) implements JSONPrimitive<Boolean>\
  \ {}\nrecord JSONString(String value) implements JSONPrimitive<String> {}\n```\n\
  \n以下方法中的 `switch` 是完备的：\n\n```java\npublic static <T> double toNumber(JSONPrimitive<T>\
  \ v)\n{\n   return switch (v)\n      {\n         case JSONNumber(var n) -> n;\n\
  \         case JSONBoolean(var b) -> b ? 1 : 0;\n         case JSONString(var s)\
  \ -> {\n            try\n            {\n               yield Double.parseDouble(s);\n\
  \            }\n            catch (NumberFormatException ex)\n            {\n  \
  \             yield Double.NaN;\n            }\n         }\n      };\n}\n```\n\n\
  乍看之下，似乎可能有无限数量实现 `JSONPrimitive<T>` 的类，但编译器可以追踪到它们只有三个。\n\n现在我们想要形成两个 JSON 原型之和：\n\
  \n```java\nrecord Pair<T>(T first, T second)\n{\n   public static <U> Pair<U> of(U\
  \ first, U second) { return new Pair<U>(first, second); }\n}\n\npublic static Object\
  \ sum(Pair<? extends JSONPrimitive<?>> pair)\n{\n   return switch (pair)\n     \
  \ {\n         case Pair(JSONNumber(var left), JSONNumber(var right)) -> left + right;\n\
  \         case Pair(JSONBoolean(var left), JSONBoolean(var right)) -> left | right;\n\
  \         case Pair(JSONString(var left), JSONString(var right)) -> left + right;\n\
  \      };\n}\n```\n（注：提供的文本在最后一个代码块处截断或略有重复，我将严格遵循所提供文本的结构。）\n\n\n\n\n\n```\nT cast(Object\
  \ obj)\nT[] getEnumConstants()\nClass<? super T> getSuperclass()\nConstructor<T>\
  \ getConstructor(Class<?>... parameterTypes)\nConstructor<T> getDeclaredConstructor(Class<?>...\
  \ parameterTypes)\n```\n\n`getConstructor` 方法返回一个 `Constructor<T>` 实例，因此在下面的代码中不需要转换：\n\
  \n```\nClass<T> cl = . . .;\nT noArgInstance = cl.getConstructor().newInstance();\n\
  ```\n\n`cast` 方法返回给对象，如果其类型确实是 `T` 的子类型，则将其声明为类型 `T`。否则，它会抛出 `ClassCastException`。\n\
  \n如果该类不是 `enum`（枚举）类或已知类型为 `T` 的枚举值数组，则 `getEnumConstants` 方法返回 `null`。\n\n`java.lang.Class<T>`\
  \ 1.0\n\n*   `T cast(Object obj)`\n    如果 `obj` 为 `null` 或可以转换为类型 `T`，则返回 `obj`；否则抛出\
  \ `ClassCastException`。\n*   `T[] getEnumConstants()` 5.0\n    如果 `T` 是枚举类型，则返回所有值的数组；否则返回\
  \ `null`。\n*   `Class<? super T> getSuperclass()`\n    返回此类的父类；如果 `T` 不是一个类或 `Object`\
  \ 类，则返回 `null`。\n*   `Constructor<T> getConstructor(Class... parameterTypes)` 1.1\n\
  *   `Constructor<T> getDeclaredConstructor(Class... parameterTypes)` 1.1\n    获取公共构造函数，或具有给定参数类型的构造函数。\n\
  \n### 使用 `Class<T>` 参数进行类型匹配\n\n在泛型方法中，匹配 `Class<T>` 参数的类型变量有时是有用的。这里有一个经典的示例：\n\
  \n```\npublic static <T> Pair<T> makePair(Class<T> c) throws ReflectiveOperationException\n\
  {\n   Constructor<T> constr = c.getConstructor();\n   return new Pair<>(constr.newInstance(),\
  \ constr.newInstance());\n}\n```\n\n如果你调用\n\n```\nmakePair(String.class)\n```\n\n\
  那么 `String.class` 是一个类型为 `Class<String>` 的对象。`makePair` 方法的类型参数 `T` 匹配 `String`，编译器可以推断出该方法返回\
  \ `Pair<String>`。\n\n### 虚拟机中的泛型类型信息\n\nJava 泛型的显著特征之一是在虚拟机中擦除泛型。可能令人惊讶的是，擦除后的类仍然保留了关于其泛型起源的一些微弱记忆。例如，原始的\
  \ `Pair` 类知道它源自泛型类 `Pair<T>`，即使类型为 `Pair` 的对象无法判断它是作为 `Pair<String>` 还是 `Pair<Employee>`\
  \ 构建的。\n\n同样，考虑这样一个方法\n\n```\npublic static Comparable min(Comparable[] a)\n```\n\
  \n它是泛型方法的擦除形式：\n\n```\npublic static <T extends Comparable<? super T>> T min(T[]\
  \ a)\n```\n\n你可以使用反射 API 来确定：\n\n*   该泛型方法有一个名为 `T` 的类型参数；\n*   该类型参数有一个子类型边界，其本身是一个泛型类型；\n\
  *   该边界类型有一个通配符参数；\n*   通配符参数有一个父类型边界；以及\n*   该泛型方法有一个泛型数组参数。\n\n换句话说，你可以重构实现者声明的关于泛型类和方法的所有信息。然而，你将不知道类型参数是如何针对特定对象或方法调用解析的。\n\
  \n为了表示泛型类型声明，使用 `java.lang.reflect` 包中的 `Type` 接口。该接口有以下子类型：\n\n*   `Class` 类，描述具体类型\n\
  *   `TypeVariable` 接口，描述类型变量（如 `T extends Comparable<? super T>`）\n*   `WildcardType`\
  \ 接口，描述通配符（如 `? super T`）\n*   `ParameterizedType` 接口，描述泛型类或接口类型（如 `Comparable<?\
  \ super T>`）\n*   `GenericArrayType` 接口，描述泛型数组（如 `T[]`）\n\n[](#index.xhtml_ch12fig05)\
  \ 显示了继承层次结构。注意，最后四个子类型是接口——虚拟机会实例化实现这些接口的类。\n\n![Figure](img/12_05.jpg) `Type` 接口及其后代类\n\
