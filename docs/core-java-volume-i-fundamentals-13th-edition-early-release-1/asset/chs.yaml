  \ initialCapacity, Comparator<? super E> comparator)`\n    创建一个由堆实现的无界优先级队列。初始容量的默认值为\
  \ `11`。如果未指定 `comparator`，元素必须实现 `Comparable` 接口。\n\n### `java.util.concurrent.BlockingQueue<E>`\
