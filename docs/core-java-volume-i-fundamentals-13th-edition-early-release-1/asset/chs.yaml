  \ a number）”浮点值侵入你的计算。*(注：重复段落）*\n\n断言机制允许你进行双重检查，而不是让误导的“非数字（not a number）”浮点值侵入你的计算。*(注：重复段落）*\n\
  \n*(注：由于原文中存在大量完全重复的段落，根据“一定不要重复输出原文”的原则，译文仅保留了第一次出现的“断言机制”描述及其逻辑内容。)*\n\n断言机制允许你进行双重检查，而不是让误导的“非数字（not\
  \ a number）”浮点值侵入你的计算。当然，你可以抛出一个异常：\n\n```java\nif (x < 0) throw new IllegalArgumentException(\"\
  x < 0\");\n```\n\n但即使在测试完成后，这段代码仍然残留在程序中。如果你有大量的此类检查，程序的运行速度可能会比应该有的要慢得多。\n\n###\
  \ 断言的启用与禁用\n\n默认情况下，断言是禁用的。通过在运行程序时使用 `-ea` 来启用它们。\n\nJava 语言拥有 `assert` 关键字。有两种形式：\n\
  \n```\nassert condition;\n```\n\n以及\n\n```java\nassert condition : expression;\n\
  ```\n\n这两个语句都会评估 `condition`，如果为假，则会抛出 `AssertionError`。如果提供了 `expression`，它将作为\
  \ `AssertionError` 的消息。\n\n要在特定的类或整个包中启用断言，可以使用以下命令：\n\n```bash\njava -ea:MyClass\
  \ -ea:company.mylib MyApp\n```\n\n你也可以通过 `-da` 禁用某些类和包：\n\n```bash\njava -ea:...\
  \ -da:MyClass MyApp\n```\n\n某些类不是由类加载器加载，而是由虚拟机直接加载的。要启用系统类的断言，请使用 `-esa` 开关：\n\n\
  ```bash\njava -esa MyApp\n```\n\n也可以通过编程控制类加载器的断言状态。请参见本节末尾的 API 注释。\n\n\n\n\n因此，你不应该使用断言来向程序的其他部分传递可恢复的条件，或向程序用户报告问题。断言应该仅在测试期间用于定位程序内部错误。\n\
  \n让我们来看一个常见的场景——检查方法参数。你是否应该使用断言来检查非法的索引值或 `null` 引用？要回答这个问题，你必须查看该方法的文档。假设你实现了一个排序方法。\n\
  \n```\n/**\n   按数值升序对指定数组的指定范围进行排序。\n   排序范围从 fromIndex（包含）开始，到 toIndex（不包含）结束。\n\
  \   @param a 要排序的数组\n   @param fromIndex 要排序的第一个元素的索引（包含）\n   @param toIndex 要排序的最后一个元素（不包含）的索引\n\
  \   @throws IllegalArgumentException if fromIndex > toIndex\n   @throws ArrayIndexOutOfBoundsException\
  \ if fromIndex < 0 or toIndex > a.length\n*/\nstatic void sort(int[] a, int fromIndex,\
  \ int toIndex)\n```\n\n文档说明指出，如果索引值错误，该方法将抛出异常。这种行为是方法与其调用者之间契约的一部分。如果你实现了该方法，你就必须遵守该契约并抛出指示的异常。使用断言来代替是不合适的。\n\
  \n你应该断言 `a` 不是 `null` 吗？这也不合适。方法文档对于 `a` 为 `null` 时的方法行为未作说明。调用者有权假设方法在这种情况下将成功返回，而不会抛出断言错误。\n\
  \n然而，假设该方法的契约略有不同：\n\n```\n@param a 要排序的数组（不能为 null）\n```\n\n现在，方法的调用者已被提点：使用 `null`\
  \ 数组调用该方法是非法的。那么该方法可以从断言开始：\n\n```\nassert a != null;\n```\n\n计算机科学家将这种契约称为*前置条件*（precondition）。原始方法对其参数没有前置条件——它承诺在所有情况下都有定义良好的行为。修改后的方法有一个前置条件：即\
  \ `a` 不为 `null`。如果调用者未能满足前置条件，那么规则将失效，方法可以执行任何它想做的事。事实上，在有了断言的情况下，方法确实是这样做。它有时会抛出断言错误，有时会抛出空指针异常，取决于其类加载器的如何配置。\n\
  \n### 使用断言记录假设\n\n通常，程序员使用注释来记录他们的底层假设。考虑下面这个来自 [`docs.oracle.com/javase/8/docs/technotes/guides/language/assert.html`](https://docs.oracle.com/javase/8/docs/technotes/guides/language/assert.html)\
  \ 的示例：\n\n```\nif (i % 3 == 0)\n   . . .\nelse if (i % 3 == 1)\n   . . .\nelse //\
  \ (i % 3 == 2)\n   . . .\n```\n\n在这种情况下，使用断言反而更有意义。\n\n```\nif (i % 3 == 0)\n  \
  \ . . .\nelse if (i % 3 == 1)\n   . . .\nelse\n{\n   assert i % 3 == 2;\n   . .\
  \ .\n}\n```\n\n当然，彻底地思考这个问题会更有意义。`i % 3` 的可能取值有哪些？如果 `i` 是正数，余数必须是 `0`、`1` 或 `2`。如果\
  \ `i` 是负数，那么余数可以是 `-1` 或 `-2`。因此，真正的假设是 `i` 不是负数。一个更好的断言是：\n\n```\nassert i >= 0;\n\
  ```\n\n在 `if` 语句之前。\n\n无论如何，这个示例展示了将断言作为程序员自检的良好用法。正如你所见，断言是测试和调试的战术工具。相比之下，日志（logging）是程序整个生命周期的策略工具。我们将在下一节检查日志。\n\
  \n`java.lang.ClassLoader` 1.0\n\n* `void setDefaultAssertionStatus(boolean b)` 1.4\n\
  \    启用或禁用此类加载器加载的所有没有显式类或包断言状态的类的断言。\n\n* `void setClassAssertionStatus(String\
  \ className, boolean b)` 1.4\n    启用或禁用给定类及其内部类的断言。\n\n* `void setPackageAssertionStatus(String\
  \ packageName, boolean b)` 1.4\n    启用或禁用给定包及其子包中所有类的断言。\n\n* `void clearAssertionStatus()`\
  \ 1.4\n    移除所有显式的类和包断言状态设置，并禁用此类加载器加载的所有类的断言。\n\n## 日志 (Logging)\n\n每个 Java 程序员都熟悉在麻烦代码中插入\
  \ `System.out.println` 调用以了解程序行为的过程。当然，一旦你找到了问题的原因，就会删除这些打印语句——结果在下一个问题出现时又把它们放回去。日志框架的设计是为了解决这个问题。\n\
  \n### 你应该使用 Java 日志框架吗？\n\nJava 有一个标准的日志框架，通常以其包名 `java.util.logging` 命名，有时缩写为 `j.u.l`。然而，其他日志框架具有更多功能并被广泛使用，例如\
  \ Log4j ([`logging.apache.org/log4j/2.x`](https://logging.apache.org/log4j/2.x))\
  \ 和 Logback ([`logback.qos.ch`](https://logback.qos.ch))\n\n如果你想让代码的用户选择日志框架，你应该使用“外面模式”（façade）。常用的外面模式是\
  \ SL4J ([`www.slf4j.org`](https://www.slf4j.org))。另一个外面模式是“平台日志”（JEP 264）。它是 JDK\
  \ 的一部分。外面模式有时被称为*前端*（frontend）。*后端*（backend）负责过滤和格式化消息并将其放在某处。\n\n在接下来的章节中，我将展示如何使用平台\
  \ API 作为前端，并将 `java.util.logging` 作为后端。`java.util.logging` 后端的功能少于流行的替代方案，但它适用于许多用例。由于它的简单性，它不容易受到攻击。相比之下，Log4j\
  \ 的晦涩功能允许黑客构造导致恶意代码执行的程序输入。\n\n无论你最终是否使用它们，学习平台 API 和 `java.util.logging` 后端都能让你对日志的能力有一个良好的基础。\n\
  \n后续章节描述的 API 和后端用于“应用日志”。你还可以开启虚拟机的日志，例如记录垃圾收集。启动 VM 时使用 `-Xlog` 命令行选项。例如：\n\n\
  ```\njava -Xlog:gc=trace:file=gc.log:uptime,tid MyApp\n```\n\n详情请参 [`docs.oracle.com/en/java/javase/21/docs/specs/man/java.html#enable-logging-with-the-jvm-logging-framework`](https://docs.oracle.com/en/java/javase/21/docs/specs/man/java.html#enable-logging-with-the-jvm-logging-framework)。\n\
  \n### 日志入门 (Logging 101)\n\n平台日志器实现了 `System.Logger` 接口。每个日志器都有一个名称。名称可以是任意的，但通常是生成日志消息的类的包名。你可以这样获取平台日志器：\n\
  \n```\nSystem.Logger logger = System.getLogger(\"com.mycompany.myapp\");\n```\n\n\
  当你第一次请求指定名称的日志器时，它会被创建。后续请求相同名称将产生相同的日志器对象。\n\n现在你准备好记录日志了：\n\n```\nlogger.log(System.Logger.Level.INFO,\
  \ \"Opening file \" + filename);\n```\n\n记录的打印格式如下：\n\n```\nAug 04, 2022 09:53:34\
  \ AM com.mycompany.myapp.Main read\nINFO: Opening file data.txt\n```\n\n\n\n请注意，时间以及调用类和方法名会被自动包含在内。\n\
  \n要在程序部署时关闭这些信息性消息，可以配置后端。对于 `java.util.logging` 后端，请准备一个包含以下内容的 `logging.properties`\
  \ 文件：\n\n```\nhandlers=java.util.logging.ConsoleHandler\ncom.mycompany.myapp.level=WARNING\n\
  ```\n\n然后按照如下方式启动应用程序：\n\n```\njava -Djava.util.logging.config.file=logging.properties\
  \ com.mycompany.myapp.Main\n```\n\n由于 `INFO` 级别低于 `WARNING` 级别，该消息将不再显示。\n\n获取日志器并记录消息的\
  \ API 是前端的一部分——在这种情况下，是平台日志 API。如果你使用不同的前端，API 将会不同。\n\n消息的目的地、格式化和过滤，以及配置机制是后端的一部分——在这里是\
  \ `java.util.logging`。如果你使用不同的后端，请遵循其说明进行配置。\n\n### 平台日志 API\n\n正如你在上一节中看到的，每条日志记录的消息都有一个级别。枚举\
  \ `System.Logger.Level` 具有以下值，按严重程度从高到低排序：`ERROR`、`WARNING`、`INFO`、`DEBUG` 和 `TRACE`。\n\
  \n通过导入语句\n\n```\nimport static java.lang.System.Logger.Level.*;\n```\n\n你可以简化级别：\n\
  \n```\nlogger.log(INFO, \"Opening file \" + filename);\n    // 代替 System.Logger.Level.INFO\n\
  ```\n\n在上面的示例中，即使消息被抑制，字符串 `\"Opening file \" + filename` 也会被创建。如果你担心创建消息字符串的开销，可以使用\
  \ lambda 表达式：\n\n```\nlogger.log(INFO, () -> \"Opening file \" + filename);\n```\n\
  \n这样，消息只有在实际被记录时才会被计算。\n\n记录异常是常见操作。日志包含了堆栈跟踪信息。\n\n```\ncatch (IOException ex)\n\
  {\n   logger.log(WARNING, \"Cannot open file \" + filename, ex);\n}\n```\n\n你可以使用模式格式化消息：\n\
  \n```\nlogger.log(WARNING, \"Cannot open file {0}\", filename);\n```\n\n这不是 `printf`\
  \ 风格的模式。该模式由 `MessageFormat` 类处理，该类用于程序消息的本地化（详情见第二卷）。在这里，你只需要知道字符串占位符是 `{0}`、`{1}`\
  \ 等。大括号必须用单引号转义：`'{'`、`'}'`。使用两个单引号 `''` 在消息中包含一个字面量单引号。\n\n日志消息可以使用第二卷中引入的资源包机制本地化为不同的语言。\n\
  \n为格式化字符串提供包和对应的键：\n\n```\nlogger.log(WARNING, bundle, \"file.bad\", filename);\n\
  \   // 在包中查找 file.bad\n```\n\n或者，如下所示获取日志器：\n\n```\nSystem.Logger logger = System.getLogger(\"\
  com.mycompany.myapp\", bundle);\n```\n\n当调用带有 `String` 参数作为消息或格式的日志器方法时，该参数被解释为资源包中的键。带有\
  \ `Object` 或 `Supplier<String>` 参数的方法不受影响。\n\n这些功能（延迟消息计算、添加可抛异常、格式化、使用包）的某些组合是支持的。详情请参阅\
  \ API 注释。\n\n### 日志配置\n\n现在让我们转向日志后端。如前所述，平台日志 API 的默认后端是 `java.util.logging`。以下章节中的信息特定于该后端。\n\
  \n你可以通过编辑配置文件来更改后端的各种属性。默认配置文件位于 JDK 中的 `conf/logging.properties`。要使用另一个文件，请在启动应用程序时设置\
  \ `java.util.logging.config.file` 属性指向文件位置：\n\n```\njava -Djava.util.logging.config.file=configFile\
  \ MainClass\n```\n\n在 `main` 方法中调用 `System.setProperty(\"java.util.logging.config.file\"\
  , configFile)` 是无效的，因为日志管理器是在 VM 启动期间在 `main` 执行之前就已经初始化的。\n\n你可以通过添加如下行来为你自己的日志器指定日志级别：\n\
  \n```\ncom.mycompany.myapp.level=WARNING\n```\n\n也就是说，在日志器名称后添加 `.level` 后缀。\n\n\
  日志配置中的属性不是系统属性。你不能通过 `-D` 命令行选项设置它们。相反，请将日志属性放入你通过 `-Djava.util.logging.config.file=configFile`\
  \ 指定的文件中。\n\n你还可以指定根级别：\n\n```\n.level=WARNING\n```\n\n由于历史原因，某些级别在平台日志 API 和 `java.util.logging`\
  \ 框架中具有不同的名称。你需要在配置文件中使用后者。[](#index.xhtml_logging-names) 显示了对应关系。\n\n平台日志与 Java\
  \ 日志框架的对应级别：\n\n| 平台日志 | `java.util.logging` |\n| :--- | :--- |\n| `ERROR` | `SEVERE`\
  \ |\n| `WARNING` | `WARNING` |\n| `INFO` | `INFO` |\n| `DEBUG` | `FINE` |\n| `TRACE`\
  \ | `FINER` |\n\n与包名类似，日志器名称是分级结构的。事实上，它们比包更具层次性。包与其父包之间没有语义关系，但日志器的父子节点共享某些属性。例如，如果你关闭了发送日志器\
  \ `\"com.mycompany\"` 的消息，那么它的子日志器也会被禁用。\n\n正如你将在下一节中看到的，日志器实际上并没有将消息发送到控制台——那是处理器（handlers）的工作。处理器也有级别。若要在控制台上看到\
  \ `DEBUG`/`FINE` 消息，你还需要设置：\n\n```\njava.util.logging.ConsoleHandler.level=FINE\n\
  ```\n\n日志管理器配置中的设置不是系统属性。使用 `-Dcom.mycompany.myapp.level=FINE` 启动程序对日志器没有任何影响。\n\
  \n还可以通过 `jconsole` 程序在运行中的程序中更改日志级别。详情请参阅 [](https://www.oracle.com/technical-resources/articles/java/jconsole.html#LoggingControl)。\n\
  \n从 Java 21 开始，名为 `java.lang.Runtime` 的系统日志器记录会对 `Runtime.exit` 方法的调用（`System.exit`\
  \ 调用它来终止虚拟机）。日志包含堆栈跟踪，因此你可以判断请求是如何请求的。要接收日志消息，请在日志配置中设置：\n\n```\njava.lang.Runtime.level=FINE\n\
  ```\n\n### 日志处理器 (Handlers)\n\n`java.util.logging` API 的后端基于 `handlers`。最简单的处理器是\
  \ `ConsoleHandler`，它将日志记录打印到 `System.err` 流。\n\n每个处理器都有父处理器。默认情况下，处理器只是将每条记录发送给父处理器。标准日志配置默认使用\
  \ `ConsoleHandler`。它的默认日志级别是 `INFO`。\n\n要将日志记录发送到其他地方，请添加另一个处理器。`java.util.logging`\
  \ API 为此提供了处理器：`FileHandler` 和 `SocketHandler`。`SocketHandler` 将记录发送到指定的主机和端口。更有趣的是在文件中收集记录的\
  \ `FileHandler`。\n\n要添加文件处理器，请在日志属性中提供此此条目：\n\n```\nhandlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler\n\
  ```\n\n记录被发送到用户主目录下的 `javan.log` 文件，其中 `n` 是一个使文件唯一的数字。默认情况下，记录以 XML 格式化。一个典型的日志记录形式如下：\n\
  \n```\n<record>\n    <date>2014-08-04T09:53:34</date>\n    <millis>1407146014072</millis>\n\
  \    <sequence>1</sequence>\n    <logger>com.mycompany.myapp</logger>\n    <level>INFO</level>\n\
  \    <class>com.horstmann.corejava.Employee</class>\n    <method>read</method>\n\
  \    <thread>10</thread>\n    <message>Opening file staff.txt</message>\n</record>\n\
  ```\n\n你可以通过在日志属性中设置各种参数来修改文件处理器的默认行为（详见 [](#index.xhtml_file-handler-configuration-parameters)）。\n\
  \n\n\n\n你可能不想使用默认的日志文件名。可以使用类似于 `%h/myapp%u.log` 的模式（关于模式变量的解释请参见 []#index.xhtml_log-file-pattern-variables]）。文件名模式中的\
  \ `%u` 会为每次应用程序运行生成唯一的日志副本。\n\n对于长时间运行的程序，开启文件轮转（rotation）是一个好主意。日志文件以循环顺序保存，例如\
  \ `myapp.log.0`、`myapp.log.1`、`myapp.log.2` 等。当文件超过大小限制时，最旧的日志会被删除，其他文件被重命名，并创建一个生成号为\
  \ `0` 的新文件。\n\n## File Handler 配置参数\n\n| 配置属性 | 描述 | 默认值 |\n| :--- | :--- | :---\
  \ |\n| `java.util.logging.FileHandler.level` | 句处理器级别。 | `Level.ALL` |\n| `java.util.logging.FileHandler.append`\
  \ | 为 `true` 时，日志记录将追加到现有文件中；否则为每个程序运行打开一个新文件。 | `false` |\n| `java.util.logging.FileHandler.limit`\
  \ | 在打开另一个文件之前写入文件的近似最大字节数（`0` = 无限制）。 | `FileHandler` 类中为 `0`，默认日志管理器配置中为 `50000`\
  \ |\n| `java.util.logging.FileHandler.pattern` | 文件名模式（参见 []#index.xhtml_log-file-pattern-variables]）。\
  \ | `%h/java%u.log` |\n| `java.util.logging.FileHandler.count` | 轮转序列中的日志数量。 | `1`（不轮转）\
  \ |\n| `java.util.logging.FileHandler.filter` | 用于过滤日志记录的过滤器（参见 []#index.xhtml-filters-and-formatters]）。\
  \ | 无过滤 |\n| `java.util.logging.FileHandler.encoding` | 字符编码。 | 平台字符编码 |\n| `java.util.logging.FileHandler.formatter`\
  \ | 每个条日志记录的格式化器。 | `java.util.logging.XMLFormatter` |\n\n## 日志文件模式变量\n\n| 变量 |\
  \ 描述 |\n| :--- | :--- |\n| `%h` | 用户的家目录（`user.home` 属性）。 |\n| `%t` | 系统临时目录。 |\n\
  | `%u` | 唯一数字。 |\n| `%g` | 轮转日志的生成号。如果指定了轮转且模式不包含 `%g`，则使用 `.%g` 后缀。 |\n| `%%` |\
  \ 百字符。 |\n\n当 `java.util.logging.FileHandler.append` 为 `true` 且日志格式为 XML 时，在追加到现有日志文件时会新的\
  \ XML 头部。结果不是有效的 XML。\n\n### 过滤器和格式化器\n\n除了按日志级别进行过滤外，每个句处理器都可以有一个实现 `Filter` 接口的额外过滤器，这是一个带有如下方法的函数接口：\n\
  \n```\nboolean isLoggable(LogRecord record)\n```\n\n要将过滤器安装到句处理器，请在日志配置中添加如下条目：\n\
  \n```\njava.util.logging.ConsoleHandler.filter=com.mycompany.myapp.MyFilter\n```\n\
  \n`ConsoleHandler` 和 `FileHandler` 类以文本和 XML 格式输出日志记录。但是，你也可以定义自己的格式。扩展 `java.util.logging.Formatter`\
  \ 类并重写方法：\n\n```\nString format(LogRecord record)\n```\n\n以你喜欢的任何方式格式化记录并返回生成的字符串。在\
  \ `format` 方法中，你可以通过调用 API 说明中的任一个方法来获取有关 `LogRecord` 的信息。\n\n在你的 `format` 方法中，你可能想要调用方法：\n\
  \n```\nString formatMessage(LogRecord record)\n```\n\n该方法格式化记录的消息部分，在资源变包中查找消息键并替换消息格式参数。\n\
  \n许多文件格式（如 XML）需要包围格式化记录的头部和尾部部分。为了实现这一点，请重写方法：\n\n```\nString getHead(Handler h)\n\
  String getTail(Handler h)\n```\n\n最后，在日志配置中设置格式化器：\n\n```\njava.util.logging.FileHandler.formatter=com.mycompany.myapp.MyFormatter\n\
  ```\n\n### 日志配方\n\n有这么多日志选项，很容易忘记基础知识。以下配方总结了最常见的操作。\n\n1. 对于简单的应用程序，选择单个日志记录器。给日志记录器赋予与主应用程序包相同的名称是一个好主意，例如\
  \ `com.mycompany.myprog`。你可以随时通过调用获取日志记录器：\n\n   ```\n   System.Logger logger =\
  \ System.getLogger(\"com.mycompany.myprog\");\n   ```\n\n   为了方便起见，你可能想在有大量日志活动的类中添加静态字段：\n\
  \n   ```\n   private static final System.Logger logger = System.getLogger(\"com.mycompany.myprog\"\
  );\n   ```\n\n2. `java.util.logging` 后端的默认日志配置将所有级别为 `INFO` 或更高的消息输出到控制台。要进行自定义，请准备一个名为\
  \ `logging.properties` 的文件并包含如下条目：\n\n   ```\n   handlers=java.util.logging.ConsoleHandler,java.util.logging.FileHandler\n\
  \   com.mycompany.myapp.level=FINER\n   java.util.logging.ConsoleHandler.level=FINE\n\
  \   ```\n\n   然后使用以下命令启动你的应用：\n\n   ```\n   java -Djava.util.logging.fileHandler.config=logging.properties\n\
  \   ```\n\n\n\n\n```\n label = new JLabel();\n```\n\n```\n add(label);\n```\n\n\
