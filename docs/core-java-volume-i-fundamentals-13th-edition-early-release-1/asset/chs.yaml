  在 C++ 构造函数中，你使用初始化列表来初始化超类。`Manager` 构造函数看起来是这样的：\n\n```java\n// C++\nManager(String\
  \ name, double salary, int year, int month, int day)\n   : Employee(name, salary,\
  \ year, month, day)\n{\n   bonus = 0;\n}\n```\n\n但是，在 Java 中，你必须在构造器的第一行调用 `super()`。\n\
  \n```java\npublic Manager(String name, double salary, int year, int month, int day)\n\
  {\n   super(name, salary, year, month, day);\n   bonus = 0;\n}\n```\n\n如果你不显式地调用\
  \ `super()`，编译器会尝试调用无参数的 `super()`。如果超类没有无参数的构造函数，编译器就会报错。\n\n例如，如果你有：\n\n```java\n\
  public Employee() {\n   name = null;\n   salary = 0.0;\n   hireDay = null;\n   bonus\
  \ = 0;\n}\n```\n\n如果你没有定义默认的构造函数，那么 `Manager` 构造函数就必须显式调用 `super(name, salary, year,\
  \ month, day)`，否则编译无法通过。\n\n总结一下：\n- `super` 用于调用超类方法。\n- `super()` 用于调用超类构造函数。\n\
  - 在 Java 子类构造函数中，`super()` 必须是第一个语句。\n- 子类可以添加字段或方法，也可以重写超类的方法，但继承永远不会移除任何字段或方法。\n\
  \n\n\n\n当 `e` 指向一个 `Employee` 对象时，调用 `e.getSalary()` 会调用 `Employee` 类的 `getSalary`\
  \ 方法。然而，当 `e` 指向一个 `Manager` 对象时，调用的则是 `Manager` 类的 `getSalary` 方法。虚拟机知道 `e` 所所的对象的实际类型，因此可以调用正确的方法。\n\
  \n对象变量（例如变量 `e`）可以指向多个实际类型这一事实被称为`多态性`（polymorphism）。在运行时自动选择合适的方法被称为`动态绑定`（dynamic\
  \ binding）。我将在本章中更详细地讨论这两个主题。\n\n在 C++ 中，如果你想实现动态绑定，需要将成员函数声明为 `virtual`。在 Java\
  \ 中，动态绑定是默认行为；如果你不希望某个方法是虚的，可以将其标记为 `final`。（我将在本章稍后部分讨论 `final` 关键字。）\n\n[](#index.xhtml_ch05ex01)\
  \ 包含一个程序，展示了 `Employee` ([](#index.xhtml_ch05ex012)) 和 `Manager` ([](#index.xhtml_ch05ex011))\
  \ 对象薪资计算的差异。\n\n### inheritance/ManagerTest.java\n\n```java\npackage inheritance;\n\
  \n/**\n * 此程序演示了继承。\n * @version 1.21 2004-02-21\n * @author Cay Horstmann\n */\n\
  public class ManagerTest\n{\n    public static void main(String[] args) {\n    \
  \    // 构建一个 Manager 对象\n        var boss = new Manager(\"Carl Cracker\", 80000,\
  \ 1987, 12, 15);\n        boss.setBonus(5000);\n        var staff = new Employee[3];\n\
  \        // 用 Manager 和 Employee 对象填充 staff 数组\n        staff[0] = boss;\n     \
  \   staff[1] = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n        staff[2]\
  \ = new Employee(\"Tommy Tester\", 40000, 1990, 3, 15);\n        // 打印所有 Employee\
  \ 对象的信息\n        for (Employee e : staff) {\n            System.out.println(\"name=\"\
  \ + e.getName() + \",salary=\" + e.getSalary());\n        }\n    }\n}\n```\n\n###\
  \ inheritance/Employee.java\n\n```java\npackage inheritance;\n\nimport java.time.*;\n\
  \npublic class Employee\n{\n    private String name;\n    private double salary;\n\
  \    private LocalDate hireDay;\n\n    public Employee(String name, double salary,\
  \ int year, int month, int day) {\n        this.name = name;\n        this.salary\
  \ = salary;\n        hireDay = LocalDate.of(year, month, day);\n    }\n\n    public\
  \ String getName() {\n        return name;\n    }\n\n    public double getSalary()\
  \ {\n        return salary;\n    }\n\n    public LocalDate getHireDay() {\n    \
  \    return hireDay;\n    }\n\n    public void raiseSalary(double byPercent) {\n\
  \        double raise = salary * byPercent / 100;\n        salary += raise;\n  \
  \  }\n}\n```\n\n### inheritance/Manager.java\n\n```java\npackage inheritance;\n\n\
  public class Manager extends Employee\n{\n    private double bonus;\n\n    /**\n\
  \     * @param name 员工的名字\n     * @param salary 薪资\n     * @param year 入职年份\n  \
  \   * @param month 入职月份\n     * @param day 入职日期\n     */\n    public Manager(String\
  \ name, double salary, int year, int month, int day) {\n        super(name, salary,\
  \ year, month, day);\n        bonus = 0;\n    }\n\n    public double getSalary()\
  \ {\n        double baseSalary = super.getSalary();\n        return baseSalary +\
  \ bonus;\n    }\n\n    public void setBonus(double b) {\n        bonus = b;\n  \
  \  }\n}\n```\n\n### 继承层次 (Inheritance Hierarchies)\n\n继承并不止于派生一层类。例如，我们可以有一个扩展 `Manager`\
  \ 的 `Executive` 类。所有扩展共同父类的类的集合被称为`继承层次`（inheritance hierarchy），如 [](#index.xhtml_ch05fig01)\
  \ 所示。从特定类到其继承层次中祖先的路径就是它的`继承层次`。\n\n### 多态性 (Polymorphism)\n\n对象变量（例如变量 `e`）可以指向多个实际类型这一事实被称为`多态性`。在运行时自动选择合适的方法被称为`动态绑定`。我将在本章中更详细地讨论这两个主题。\n\
  \n在 C++ 中，如果你想实现动态绑定，需要将成员函数声明为 `virtual`。在 Java 中，动态绑定是默认行为；如果你不希望某个方法是虚的，可以将其标记为\
  \ `final`。（我将在本章稍后部分讨论 `final` 关键字。）\n\n[](#index.xhtml_ch05ex01) 包含一个程序，展示了 `Employee`\
  \ ([](#index.xhtml_ch05ex012)) 和 `Manager` ([](#index.xhtml_ch05ex011)) 对象薪资计算的差异。\n\
  \n继承并不止于派生一层类。例如，我们可以有一个扩展 `Manager` 的 `Executive` 类。所有扩展共同父类的类的集合被称为`继承层次`，如 [](#index.xhtml_ch05fig01)\
  \ 所示。从特定类到其继承层次中祖先的路径就是它的`继承层次`。\n\n\n\n\n# 理解方法调用\n\n准确理解方法调用是如何应用于对象的，是非常重要的。假设我们调用了\
  \ `x.f(args)`，并且隐式参数 `x` 被声明为类 `C` 的对象。以下是发生的过程：\n\n1. 编译器查看对象的声明类型和方法名。请注意，可能存在多个同名为\
  \ `f` 的方法，但参数类型不同。例如，可能存在一个方法 `f(int)` 和一个方法 `f(String)`。编译器会列出类 `C` 中所有名为 `f` 的方法，以及\
  \ `C` 的父类中所有可访问的名为 `f` 的方法。（父类的私有方法是不可访问的。）\n\n   现在，编译器知道了所有待调用的可能候选方法。\n\n2. 接下来，编译器确定方法调用中提供的参数的类型。如果在所有名为\
  \ `f` 的方法中，有一个方法的参数类型与所提供的参数最匹配，则选择该方法进行调用。这个过程被称为*重载解析*（*overloading resolution*）。例如，在调用\
  \ `x.f(\"Hello\")` 时，编译器选择了 `f(String)` 而不是 `f(int)`。由于类型转换（`int` 转为 `double`，`Manager`\
  \ 转为 `Employee` 等），情况可能会变得复杂。如果编译器找不到任何参数类型匹配的方法，或者在应用转换后有多个方法都匹配，编译器将报告错误。\n\n\
  \   现在，编译器知道了需要调用的方法名称和参数类型。\n\n   记住，方法的名称和参数类型列表被称为该方法的*签名*（*signature*）。例如，`f(int)`\
  \ 和 `f(String)` 是两个名称相同但签名不同的方法。如果你在子类中定义了一个与父类方法签名相同的方法，那么你就重写（override）了该父类方法。\n\
  \n   返回类型不是签名的一部分。然而，当你重写一个方法时，你需要保持返回类型兼容的。子类可以将返回类型更改为原始类型的子类型。例如，假设 `Employee`\
  \ 类有一个方法：\n\n```\npublic Employee getBuddy() { . . . }\n```\n\n   经理绝不会希望有一个低级员工当自己的伙伴。为了反映这一事实，`Manager`\
  \ 子类可以如下重重写该方法：\n\n```\npublic Manager getBuddy() { . . . } // 更改返回类型是允许的\n```\n\
  \n   我们称这两个 `getBuddy` 方法具有*协变*（*covariant*）返回类型。\n\n3. 如果方法是 `private`、`static`、`final`\
  \ 或构造函数，那么编译器就确切知道要调用哪个方法。（`final` 修饰符将在下一节解释）。这被称为*静态绑定*（*static binding*）。否则，要调用的方法取决于隐式参数的实际类型，必须在运行时使用动态绑定。在我们的示例中，编译器将生成一条使用动态绑定调用\
  \ `f(String)` 的指令。\n\n4. 当程序运行并使用动态绑定调用方法时，虚拟机必须调用与 `x` 所指对象*实际*类型相匹配的方法版本。假设实际类型是\
  \ `D`，它是 `C` 的一个子类。如果类 `D` 定义了方法 `f(String)`，则调用该方法。如果没有定义，则在 `D` 的父类中查找方法 `f(String)`，以此此类推。\n\
  \n   每每次调用方法时都执行这种搜索将非常耗时。相反，虚拟机为每个类预计算一个*方法表*（*method table*）。方法表列出了所有方法签名和实际要调用的方法。\n\
  \n   虚拟机可以在加载类后，通过将从类文件中找到的方法与父类的方法表相结合，构建方法表。\n\n   当方法被实际调用时，虚拟机只需进行查表操作。在我们的示例中，虚拟机查询类\
  \ `D` 的方法表，并查找 `f(String)` 的调用方法。该方法可能是 `D.f(String)` 或 `X.f(String)`，其中 `X` 是 `D`\
  \ 的某个父类。这种场景中有一个例外：如果调用是 `super.f(param)`，则虚拟机将查询父类的方法表。\n\n   让我们详细查看 `e.getSalary()`\
  \ 调用中的这一过程。`e` 的声明类型是 `Employee`。`Employee` 类有一个名为 `getSalary` 的方法，且没有方法参数。因此，在这种情况下，我们不需要担心重载解析。\n\
  \n   `getSalary` 方法不是 `private`、`static` 或 `final`，因此它是动态绑定的。虚拟机为 `Employee` 和 `Manager`\
  \ 类生成方法表。`Employee` 表显示所有方法都定义在 `Employee` 类本身中：\n\n```\nEmployee:\n   getName()\
  \ -> Employee.getName()\n   getSalary() -> Employee.getSalary()\n   getHireDay()\
  \ -> Employee.getHireDay()\n   raiseSalary(double) -> Employee.raiseSalary(double)\n\
  ```\n\n   实际上，这并不是全部——正如你在本章后面将看到的，`Employee` 类有一个父类 `Object`，它从中继承了许多方法。目前我先忽略\
  \ `Object` 方法。\n\n   `Manager` 方法表略有不同。它继承了三个方法，重新定义了一个方法，并增加了一个方法。\n\n```\nManager:\n\
  \   getName() -> Employee.getName()\n   getSalary() -> Manager.getSalary()\n   getHireDay()\
  \ -> Employee.getHireDay()\n   raiseSalary(double) -> Employee.raiseSalary(double)\n\
  \   setBonus(double) -> Manager.setBonus(double)\n```\n\n   在运行时，调用 `e.getSalary()`\
  \ 的解析如下：\n\n1. 首先，虚拟机获取 `e` 的实际类型的方法表。这可能是 `Employee`、`Manager` 或 `Employee` 的另一个子类的表。\n\
  2. 然后，虚拟机查找 `getSalary()` 签名的定义类。现在它知道要调用哪个方法了。\n3. 最后，虚拟机调用该方法。\n\n   动态绑定具有一个非常重要的属性：它使程序在不需要修改现有代码的情况下具有*可扩展性*（*extensible*）。假设添加了一个新类\
  \ `Executive`，并且变量 `e` 有指向该类对象的可能性。包含 `e.getSalary()` 调用的代码不需要重新编译。如果程序执行时 `e` 恰好指向一个类型为\
  \ `Executive` 的对象，则会自动调用 `Executive.getSalary()` 方法。\n\n   当你重写一个方法时，子类方法的可见性必须*至少与父类方法相同*。特别是如果父类方法是\
  \ `public`，则子类方法也必须声明为 `public`。一个常见的错误是在子类方法中无意省略 `public` 限定符。此时编译器会报错，提示你提供了更严格的访问权限。\n\
  \n## 防止继承：final 类和方法\n\n有时，你希望防止他人创建你某个类的子类。不能被扩展的类被称为*final* 类（*final* classes*），你在类定义中使用\
  \ `final` 修饰符来指示这一点。例如，假设我们想防止他人对 `Executive` 类进行子类化。只需使用 `final` 修饰符声明该类，如下：\n\n\
  ```\npublic final class Executive extends Manager\n{\n   . . .\n}\n```\n\n   你还可以将类中的特定方法为\
  \ `final`。如果你这样做，那么任何子类都不能重写该方法。（`final` 类中的所有方法都自动成为 `final`。）例如：\n\n```\npublic\
  \ class Employee\n{\n   . . .\n   public final String getName()\n   { \n      return\
  \ name;\n   }\n   . . .\n}\n```\n\n   记住，字段也可以声明为 `final`。`final` 字段在对象构造后无法更改。然而，如果一个类被声明为\
  \ `final`，只有方法会自动变为 `final`，而字段不是。\n\n\n\n\n将方法或类标记为 `final` 的唯一正当理由是确保其语义在子类中不会被改变。例如，`Calendar`\
  \ 类的 `getTime` 和 `setTime` 方法就是 `final` 的。这表明 `Calendar` 类的设计者已经承担了 `Date` 类与日历状态之间转换的责任。不允许任何子类破坏这种安排。同样，`String`\
  \ 类也是一个 `final` 类。这意味着没有人可以定义 `String` 的子类。换句话说，如果你有一个 `String` 引用，你就知道它指向的是一个 `String`，且仅是一个\
  \ `String`。\n\n如果你在构造函数中调用了一个方法，应该将其声明为 `final`。否则，它可能会在子类中被重写，并访问一个部分构造的子类实例。这是一个示例。为了调试，`Employee`\
  \ 构造函数会显示所构建对象的描述。\n\n```\npublic class Employee\n{\n   public Employee(String name,\
  \ double salary, int year, int month, int day)\n   {\n      this.name = name;\n\
  \      this.salary = salary;\n      hireDay = LocalDate.of(year, month, day);\n\
  \      System.out.println(\"Constructed \" + description());\n   }\n\n   public\
  \ String description()\n   {\n      return \"An employee with a salary of \" + salary;\n\
  \   }\n\n   . . .\n}\n```\n\n现在在员工类的层次结构中添加了一个新类——带有头衔的高管：\n\n```\npublic class\
  \ Executive\n{\n   private String title;\n\n   public Executive(String name, String\
  \ title, double salary, int year, int month, int day)\n   {\n      super(name, salary,\
  \ year, month, day);\n      this.title = title;;\n   }\n\n   public String getTitle()\n\
  \   {\n      return title;\n   }\n\n   public String description()\n   {\n     \
  \ if (title.length() >= 30)\n         return \"An executive with an impressive title\"\
  ;\n      else\n         return \"An executive with a title of \" + title;\n   }\n\
  }\n```\n\n当构造一个 `Executive` 时，它的构造函数首先调用 `Manager` 构造函数，进而调用 `Employee` 构造函数，最后调用\
  \ `description` 方法。由于多态性，它调用的是 `Executive` 类中的 `description` 方法！遗憾的是，`Executive`\
  \ 构造函数尚未完成。实例变量 `title` 仍然 `null`，导致了 `NullPointerException`。\n\n在构造函数中调用方法本质上是危险的。构造函数必须完成足够的工作以确保该方法执行成功。如果方法可以被重写，这一点将变得非常困难。因此，最好的做法是在构造函数只调用\
  \ `final` 或 `private` 方法。\n\n从 Java 21 开始，如果你使用 `-Xlint` 或 `-Xlint:this-escape`\
  \ 标志进行编译，当公共类的构造函数调用非 `final` 或非 `private` 方法时，编译器会发出警告。\n\n该标志的名字有点遗憾，因为在其他某些情况下，`this`\
  \ 引用也会从编译器目前尚未检测到的构造函数中“逃逸”。\n\n在 C++ 中，构造函数中的方法调用不是多态态的。例如，如果你在 `Employee` 构造函数中调用\
  \ `getDescription`，它始终会调用 `Employee::getDescription`。\n\n一些程序员认为，除非你有充分理由想要多态性，否则应该将所有方法都声明为\
  \ `final`。事实上，在 C++ 和 C# 中，除非你明确要求，否则方法不会使用多态性。这可能有点极端，但我同意在设计类层次结构时，仔细考虑 `final`\
  \ 方法和类是一个好主意。\n\n在 Java 早期，一些程序员使用 `final` 关键字是希望避免动态绑定的开销。如果一个方法没有被重写且很短，那么编译器就可以优化掉该方法调用——这个过程被称为内联（inlining）。例如，内联调用\
  \ `e.getName()` 会将其替换为字段访问 `e.name`。这是一项值得的改进——CPU 讨厌分支，因为分支会干扰它们在处理当前指令时预取指令的策略。然而，如果\
  \ `getName` 在另一个类中可以重写，那么编译器就无法对其内联，因为它不知道重写代码可能会做什么。\n\n幸运的是虚拟机中的即时编译器（JIT）比传统编译器做得更好。它确切知道哪些类扩展了给定类，并可以检查是否有任何类实际重写了给定方法。如果一个方法很短、被频繁调用且实际上没有被重写，JIT\
  \ 编译器就可以将其内联。如果虚拟机加载了另一个重写了内联方法的子类会怎样？那么优化器必须撤销内联。这需要时间，但很少发生。\n\n枚举（Enumerations）和记录（records）总是\
  \ `final` 的——你无法扩展它们。\n\n### 类型转换\n\n回想 第 3 章，强制从一种类型转换为另一种类型的过程称为转换（casting）。Java\
  \ 语言对强制转换有特殊的表示法。例如，\n\n```\ndouble x = 3.405;\nint nx = (int) x;\n```\n\n将表达式 `x`\
  \ 的值转换为整数，舍弃小数部分。\n\n正如你有时需要将浮点数转换为整数一样，你可能需要将对象引用从一个类转换为另一个类。让我们再次使用包含 `Employee`\
  \ 和 `Manager` 对象的数组示例：\n\n```\nvar staff = new Employee[3];\nstaff[0] = new Manager(\"\
  Carl Cracker\", 80000, 800);\n```\n\n要实际对对象引用进行强制转换，使用类似于转换表达式的语法。将目标类名放在括号中，并放在你想转换的对象引用之前。例如：\n\
  \n```\nManager boss = (Manager) staff[0];\n```\n\n你想要进行强制转换的唯一理由是在丢失了对象的实际类型后使用其完整功能。例如，在\
  \ `ManagerTest` 类中，`staff` 数组必须是 `Employee` 数组，因为某些元素是经理。我们需要将经理元素转换回 `Manager`\
  \ 以访问其新变量。\n\n如你所知，在 Java 中每个变量都有类型。类型描述了变量指向的对象类型以及它可以做什么。例如，`staff[i]` 指向一个 `Employee`\
  \ 对象（因此它也可以指向 `Manager` 对象）。\n\n编译器会检查你在将值存入变量时是否承诺过高。如果你将子类引用赋值给父类变量，你承诺的较少，编译器会直接允许这样做。如果你将父类引用赋值给子类变量，你承诺的更多。这时你必须使用强制转换，以便在运行时检查你的承诺。\n\
  \n如果你尝试沿继承链向下转换并“欺骗”对象包含的内容会发生什么？\n\n```\nManager boss = (Manager) staff[1]; //\
  \ 错误\n```\n\n当程序运行时，Java 运行时系统会发现违背了承诺并产生 `ClassCastException`。如果你不捕获该异常，程序将终止。因此，在尝试转换之前先确定转换是否成功是一种良好的编程习惯。只需使用\
  \ `instanceof` 运算符。例如：\n\n```\nif (staff[i] instanceof Manager)\n{\n   boss = (Manager)\
  \ staff[i];\n   . . .\n}\n```\n\n最后，如果转换没有任何成功的可能，编译器将不允许你进行转换。例如，转换\n\n```\nString\
  \ c = (String) staff[i];\n```\n\n是一个编译时错误，因为 `String` 不是 `Employee` 的子类。\n\n\n\n\
  \n\n* 你只能在继承体系内部进行强制转换。\n* 在从父类向子类进行强制转换之前，使用 `instanceof` 进行检查。\n\n### 测试\n\n```\n\
  x instanceof C\n```\n\n如果 `x` 为 `null`，它不会产生异常。它只是返回 `false`。这是合乎逻辑的：`null` 指向没有对象，因此它显然没有指向类型为\
  \ `C` 的对象。\n\n实际上，通过强制转换转换对象的类型通常不是一个好主意。在我们的示例中，对于大多数用途，你不需要将 `Employee` 对象强制转换为\
  \ `Manager` 对象。`getSalary` 方法在这两个类的两个对象上都能正常工作。使多态工作的动态绑定会自动定位正确的方法。\n\n进行强制转换的唯一理由是使用经理类特有的方法，例如\
  \ `setBonus`。如果由于某种原因，你发现自己想在 `Employee` 对象上调用 `setBonus`，请问问自己这是否表明父类的设计存在存在缺陷。重新设计父类并添加\
  \ `setBonus` 方法是有意义的。请记住，只需要一个未被捕获的 `ClassCastException` 就会终止你的程序。通常情况下，最好尽量减少强制转换和\
  \ `instanceof` 操作符的使用。\n\nJava 使用了 C 语言“过去”的强制转换语法，但它的工作方式类似于 C++ 中安全的 `dynamic_cast`\
  \ 操作。例如，\n\n```\nManager boss = (Manager) staff[i]; // Java\n```\n\n相当于\n\n```\n\
  Manager* boss = dynamic_cast<Manager*>(staff[i]); // C++\n```\n\n但有一个重要的区别。如果强制转换失败，它不会产生空对象，而是抛出一个异常。从这个意义上说，它类似于\
  \ C++ 对引用的转换。这非常头疼。在 C++ 中，你可以在一个操作中完成类型测试和类型转换。\n\n```\nManager* boss = dynamic_cast<Manager*>(staff[i]);\
  \ // C++\nif (boss != NULL) . . .\n```\n\n在 Java 中，你需要结合使用 `instanceof` 操作符和强制转换。\n\
  \n```\nif (staff[i] instanceof Manager)\n{\n   Manager boss = (Manager) staff[i];\n\
  \   . . .\n}\n```\n\n### `instanceof` 的模式匹配\n\n这段代码\n\n```\nif (staff[i] instanceof\
  \ Manager)\n{\n   Manager boss = (Manager) staff[i];\n   boss.setBonus(5000);\n\
  }\n```\n\n相当冗长。我们真的需要提到三次子类 `Manager` 吗？\n\n从 Java 16 开始，有一种更简单的方法。你可以直接在 `instanceof`\
  \ 测试中声明子类变量：\n\n```\nif (staff[i] instanceof Manager boss)\n{\n   boss.setBonus(5000);\n\
  }\n```\n\n如果 `staff[i]` 是 `Manager` 类的实例，那么变量 `boss` 被赋值为 `staff[i]`，你可以将其作为 `Manager`\
  \ 使用。你跳过了强制转换。\n\n如果 `staff[i]` 不指向 `Manager`，则 `boss` 不会被赋值，`instanceof` 操作符产生值\
  \ `false`。`if` 语句体被跳过。\n\n在使用 `instanceof` 的大多数情况下，你都需要应用子类方法。这时请使用这种“模式匹配”形式的 `instanceof`\
  \ 来代替强制转换。\n\n无用的 `instanceof` 模式会导致编译错误：\n\n```\nManager boss = . . .;\nif (boss\
  \ instanceof Employee e) . . . // 错误：显然它是一个 Employee\n```\n\n同样无用的\n\n```\nif (boss\
  \ instanceof Employee) . . . \n```\n\n是被允许的，以为了与 Java 1.0 向后兼容。\n\n当 `instanceof`\
  \ 模式引入变量时，你可以立即在同一个表达式中使用它：\n\n```\nEmployee e;\nif (e instanceof Executive exec\
  \ && exec.getTitle().getLength() >= 20) . . .\n```\n\n这之所以有效，是因为 `&&` 表达式的右侧只有在左侧为\
  \ `true` 时才会被求值。如果求值了右侧，则 `exec` 已经绑定到了一个 `Executive` 实例。\n\n然而，以下代码会导致编译错误：\n\n\
  ```\nif (e instanceof Manager exec || exec.getTitle.getLength() >= 20) . . . //\
  \ 错误\n```\n\n`||` 的右侧在左侧为 `false` 时执行，此时没有内容被绑定到变量 `exec`。\n\n这里是另一个条件运算符的示例：\n\n\
  ```\nString title = e instanceof Executive exec ? exec.getTitle() : \"\";\n```\n\
  \n变量 `exec` 定义在 `?` 之后的子表达式中，但没有在 `:` 之后的子表达式中。\n\n这些声明变量的 `instanceof` 形式被称为“模式匹配”，因为它们类似于\
  \ `switch` 中的类型模式，这些在 模式匹配 中有详细介绍。\n\n与任何局部变量一样，由模式定义的局部变量可以遮蔽（shadow）字段。例如：\n\n\
  ```\nclass Value\n{\n   private double v;\n   public boolean equals(Object other)\n\
  \   {\n      if (other instanceof LabeledValue v)\n         // v 等于 other\n    \
  \  else\n         // v 表示字段\n   }\n   . . .\n}\n```\n\n上一个示例展示了类型模式。如果类型匹配，对象将绑定到该类型的变量上。\n\
  \n### 受保护访问\n\n如你所知，类中的字段最好被标记为 `private`，而方法通常被标记为 `public`。任何声明为 `private` 的特征在其他类中都是不可访问的。正如本开头介绍的那样，对于子类也是如此：子类无法访问其父类的私有字段。\n\
  \n然而，在某些情况下，你可能希望将方法限制为仅子类可以使用，或者较少地允许子类方法访问父类字段。在这种情况下，你将类特征声明为 `protected`。例如，如果父类\
  \ `Employee` 将 `hireDay` 字段声明为 `protected` 而不是 `private`，那么 `Manager` 方法就可以直接访问它。\n\
  \n在 Java 中，`protected` 字段可以被相同包内的任何类访问。现在考虑另一个包中的 `Administrator` 子类。`Administrator`\
  \ 类的方法只能查看 `Administrator` 对象的 `hireDay` 字段，而不能查看其他 `Employee` 对象。这种限制是为了防止你通过派生子类来滥用\
  \ `protected` 机制。\n\n在实践中，请谨慎使用 `protected` 字段。假设你的类被其他程序员使用，并且你在设计时包含了 `protected`\
  \ 字段。在你不知道的情况下，其他程序员可能会继承你的类并开始访问你的受保护字段。在这种情况下，你无法在不扰扰那些程序员的情况下更改类的实现。这违背了面向对象编程（OOP）的精神，OOP\
  \ 鼓励数据封装。\n\n`protected` 方法更有意义。如果一个方法很难使用，类可以将其声明为 `protected`。这表明子类（它们理应对其祖先很熟悉）可以被信任正确使用该方法，而其他类则不能。\n\
  \n这种方法的极佳例子是 `Object` 类的 `clone` 方法——详情请参阅 第 6 章。\n\n\n\n\n\n如前所述，Java 中的 `protected`\
  \ 特性对所有子类以及同一包中的所有其他类都是的。这与 C++ 中 `protected` 的含义略有不同，使得 Java 中 `protected` 的概念比\
  \ C++ 中更不安全。\n\n以下是 Java 中四种访问控制修饰符的总结：\n\n1. 仅类内可见（`private`）。\n2. 全局可访问（`public`）。\n\
  3. 在包内及所有子类中可见（`protected`）。\n4. 在包内可见——这是（不幸的）默认值。不需要修饰符。\n\n# `Object`：宇宙超类\n\n\
  `Object` 类是终极祖先——Java 中的每一个类都继承 `Object`。然而，你永远不需要写：\n\n```\npublic class Employee\
  \ extends Object\n```\n\n如果没有显式提到父类，则终极超类 `Object` 被视为理所当然的。由于 Java 中的每个类都继承 `Object`，因此熟悉\
  \ `Object` 类提供的服务至关重要。我在本章中介绍了基础方法；对于此处未涵盖的内容，请参阅后面的章节或查看在线文档。（`Object` 的某些方法只有在处理并发时才会出现——参见第\
  \ 10 章;\n```\n\n当然，`Object` 类型的变量只有作为任意值的通用容器时才有用。若要对该值进行任何特定操作，你需要对原始类型有一定的了解并应用强制类型转换：\n\
  \n```\nEmployee e = (Employee) obj;\n```\n\n在 Java 中，只有基本类型的值（数字、字符和 `boolean` 值）不是对象。\n\
  \n所有的数组类型，无论是对象数组还是基本类型数组，都是继承自 `Object` 类的类类型。\n\n```\nEmployee[] staff = new Employee[10];\n\
  obj = staff; // OK\nobj = new int[10]; // OK\n```\n\n在 C++ 中，没有宇宙根类。然而，每个指针都可以转换为\
  \ `void*` 指针。\n\n## `equals` 方法\n\n`Object` 类中的 `equals` 方法用于测试一个对象是否被认为与另一个对象相等。在\
  \ `Object` 类中实现的 `equals` 方法决定了两个对象引用是否相同。这是一个非常合理的默认值——如果两个对象是相同的，它们理应是相等的。对于许多类来说，不需要进行其他操作。例如，比较两个\
  \ `PrintStream` 对象的相等性没有意义。然而，你通常会想要实现基于状态的相等性测试，即当两个对象具有相同状态时，它们被认为是相等的。\n\n例如，假设两个员工具有相同的姓名、薪水和入职日期，则他们是相等的。（在实际的员工数据库中，比较\
  \ ID 显然会更合理。我使用这个例子来演示实现 `equals` 方法的机制。）\n\n```\npublic class Employee\n{\n   .\
  \ . .\n   public boolean equals(Object otherObject)\n   {\n      // 快速测试对象是否相同\n\
  \      if (this == otherObject) return true;\n\n      // 如果显式参数为 null，则必须返回 false\n\
  \      if (otherObject == null) return false;\n\n      // 如果类不匹配，则不相等\n      if\
  \ (getClass() != otherObject.getClass())\n         return false;\n\n      // 现在我们知道\
  \ otherObject 是一个非空的 Employee\n      Employee other = (Employee) otherObject;\n\n\
  \      // 测试字段是否具有相同的值\n      return name.equals(other.name)\n         && salary\
  \ == other.salary\n         && hireDay.equals(other.hireDay);\n   }\n}\n```\n\n\
  `getClass` 方法返回对象的类——我们将在本章稍后部分详细讨论该方法。在我们的测试中，两个对象只有在属于同一个类时才能相等。\n\n为了防止 `name`\
  \ 或 `hireDay` 为 `null` 的可能，请使用 `Objects.equals` 方法。如果两个参数均为 `null`，则 `Objects.equals(a,\
  \ b)` 的值为 `true`；如果只有一个为 `null`，则为 `false`；否则为 `a.equals(b)`。使用该方法，`Employee.equals`\
  \ 方法的最后一条语句变为\n\n```\nreturn Objects.equals(name, other.name)\n   && salary == other.salary\
  \ \n   && Objects.equals(hireDay, other.hireDay);\n```\n\n为子类定义 `equals` 方法时，首先调用父类上的\
  \ `equals`。如果该测试未通过，则这些对象就不相等。如果父类字段相等，你就可以准备好比较子类的实例字段了。\n\n```\npublic class Manager\
  \ extends Employee\n{\n   . . .\n   public boolean equals(Object otherObject)\n\
  \   {\n      if (!super.equals(otherObject)) return false;\n      // super.equals\
  \ 检查了此和 otherObject 是否属于同一个类\n      Manager other = (Manager) otherObject;\n   \
  \   return bonus == other.bonus;\n   }\n}\n```\n\n回想第 4 章，记录（record）是不可变类的一种特殊形式，其状态完全由“规范”构造函数中设置的字段定义。记录自动定义了一个比较字段的\
  \ `equals` 方法。当两个记录对应的字段值相等时，这两个记录实例是相等的。\n\n## 相等性测试与继承\n\n如果隐式和显式参数不属于同一个类，`equals`\
  \ 方法应该如何表现？这一直是一个争议领域。在先前的示例中，如果类不匹配，`equals` 方法返回 `false`。但许多程序员会使用 `instanceof`\
  \ 测试：\n\n```java\nif (!(otherObject instanceof Employee)) return false;\n```\n\n\
  这留下了 `otherObject` 可能属于子类的可能性。然而，这种方法会带来麻烦。原因如下。Java 规范要求 `equals` 方法具有以下属性：\n\n\
  1. **自反性**：对于任何非空引用 `x`，`x.equals(x)` 应该返回 `true`。\n2. **对称性**：对于任何引用 `x` 和 `y`，`x.equals(y)`\
  \ 返回 `true` 当且仅当 `y.equals(x)` 返回 `true`。\n3. **传递性**：对于任何引用 `x`、`y` 和 `z`，如果 `x.equals(y)`\
  \ 返回 `true` 且 `y.equals(z)` 返回 `true`，则 `x.equals(z)` 应该返回 `true`。\n4. **一致性**：如果引用\
  \ `x` 和 `y` 指的对象没有改变，则重复调用 `x.equals(y)` 返回相同的值。\n5. 对于任何非空引用 `x`，`x.equals(null)`\
  \ 应该返回 `false`。\n\n这些规则确实是合理的。你不希望库实现者在数据结构中定位元素时思考调用 `x.equals(y)` 还是 `y.equals(x)`。\n\
  \n然而，当参数属于不同的类时，对称规则会有微妙的影响。考虑调用\n\n```\ne.equals(m)\n```\n\n其中 `e` 是 `Employee`\
  \ 对象，`m` 是 `Manager` 对象，且它们恰好具有相同的姓名、薪水和入职日期。如果 `Employee.equals` 使用 `instanceof`\
  \ 测试，则调用返回 `true`。但这意味着反向调用\n\n```\nm.equals(e)\n```\n\n也需要返回 `true`——对称规则不允许它返回\
  \ `false` 或抛出异常。\n\n这让 `Manager` 类陷入了困境。它的 `equals` 方法必须与其任何 `Employee` 进行比较，而不考虑经理特有的信息！\n\
  \n一些作者已经公开表示 `getClass` 测试是错误的，因为它违反了替换原则。一个经常被引用的例子是 `AbstractSet` 类中的 `equals`\
  \ 方法，它测试两个集合是否具有相同的元素。`AbstractSet` 类有两个具体的子类，`TreeSet` 和 `HashSet`，它们使用不同的算法来定位集合元素。你真的希望能够比较任何两个集合，无论它们是如何实现的。\n\
  \n\n\n\n然而，集合的示例相当特殊。将 `AbstractSet.equals` 声明为 `final` 是有意义的，因为不应该任何人重新定义集合相等性的语义。（该方法实际上并不是\
  \ `final`。这允许子类为相等性测试实现一种更高效的算法。）\n\n在我看来，存在两种不同的场景：\n\n* 如果子类可以有它们自己的相等性概念，那么对称性要求将迫使你使用\
  \ `getClass` 测试。\n* 如果相等性概念在父类中已经固定，那么你就可以使用 `instanceof` 测试，并允许不同子类的对象相互相等。\n\n\
  在员工和经理的示例中，当两个对象的字段匹配时，我们认为它们是等等的。如果我们有两个具有相同姓名、薪水和入职日期的 `Manager` 对象，但奖金不同，我们希望它们是互不等的。因此，我们使用了\
  \ `getClass` 测试。\n\n但假设我们使用员工 ID 来进行相等性测试。这种相等性概念对所有子类都有意义的。那么我们就可以使用 `instanceof`\
  \ 测试，并且我们应该将 `Employee.equals` 声明为 `final`。\n\n标准 Java 库包含超过 150 个 `equals` 方法的实现，混合使用了使用\
  \ `instanceof`、调用 `getClass`、捕获 `ClassCastException` 或完全什么都不做。查看 `java.sql.Timestamp`\
  \ 类的 API 文档，实现者们有些尴尬地指出，他们陷入了困境。`Timestamp` 类继承自 `java.util.Date`，后者的 `equals` 方法使用了\
  \ `instanceof` 测试，而无法重写 `equals` 使其同时满足对称性和准确性。\n\n经常引用的集合相等性示例是一个警示故事，它展示了在子类之间提供对称相等性是有多么困难。\n\
  \n考虑这两个集合：\n\n```\nSet<String> x = new HashSet<>();\nx.add(\"Hello\");\nx.add(\"\
  World\");\nSet<String> y = new TreeSet<>(String.CASE_INSENSITIVE_ORDER);\ny.add(\"\
  Hello\");\ny.add(\"WORLD\"); \n```\n\n对于这些集合，`equals` 不是对称的：\n\n```\nx.equals(y)\
  \ // false\ny.equals(x) // true\n```\n\n`TreeSet` 使用排序顺序 own `equals` 来比较元素。在不区分大小写的情况下，字符串\
  \ `\"World\"` 和 `\"WORLD\"` 被认为是等等的。\n\n这里是编写完美的 `equals` 方法的配方：\n\n1. 将显式参数命名为\
  \ `otherObject`——稍后，你将需要强制转换为另一个你应该命名为 `other` 的变量。\n\n2. 测试 `this` 是否恰好与 `otherObject`\
  \ 相同：\n\n   ```\n   if (this == otherObject) return true;\n   ```\n\n   这条语句仅仅是一种优化。在实践中，这是一种常见情况。检查身份比比较字段要便宜得多。\n\
  \n3. 测试 `otherObject` 是否为 `null`，如果是则返回 `false`。这个测试是必须。\n\n   ```\n   if (otherObject\
  \ == null) return false;\n   ```\n\n4. 比较 `this` 和 `otherObject` 的类。如果 `equals`\
  \ 的语义在子类中可以改变，请使用 `getClass` 测试：\n\n   ```\n   if (getClass() != otherObject.getClass())\
  \ return false;\n   ClassName other = (ClassName) otherObject;\n   ```\n\n   如果相同的语义对于*所有*子类都成立，你可以使用\
  \ `instanceof` 测试：\n\n   ```\n   if (!(otherObject instanceof ClassName other))\
  \ return false;\n   ```\n\n   注意，如果 `instanceof` 测试成功，它会将 `other` 设置为 `otherObject`。不需要强制类型转换。\n\
  \n5. 现在根据你的相等性概念比较这些字段。对于原始类型字段使用 `==`，对于对象字段使用 `Objects.equals`。如果所有字段都匹配，则返回 `true`，否则返回\
  \ `false`。\n\n   ```\n   return field1 == other.field1\n      && Objects.equals(field2,\
  \ other.field2)\n      && . . .;\n   ```\n\n   如果你在子类中重定义 `equals`，请包含对 `super.equals(other)`\
  \ 的调用。\n\n如果你有数组类型的字段，可以使用静态的 `Arrays.equals` 方法来检查相应的数组元素是否相等。对于多维数组，使用 `Arrays.deepEquals`\
  \ 方法。\n\n这是一个在实现 `equals` 方法时的常见错误。你能看出问题所在吗？\n\n```\npublic class Employee\n{\n\
  \   public boolean equals(Employee other)\n   {\n      return other != null\n  \
  \       && getClass() == other.getClass()\n         && Objects.equals(name, other.name)\n\
  \         && salary == other.salary\n         && Objects.equals(hireDay, other.hireDay);\n\
  \   }\n   . . .\n}\n```\n\n该方法将显式参数类型声明为 `Employee`。结果，它没有重写 `Object` 类的 `equals`\
  \ 方法，而是定义了一个完全无关的方法。\n\n你可以通过对旨在重写父类方法的方法标记 `@Override` 标签来防止此类错误的发生：\n\n```\n@Override\
  \ public boolean equals(Object other)\n```\n\n如果你犯了错误并正在定义一个新方法，编译器会报告错误。例如，假设你在\
  \ `Employee` 类中添加了以下声明：\n\n```\n@Override public boolean equals(Employee other)\n\
  ```\n\n将报告错误，因为此方法没有重写来自 `Object` 父类的任何方法。\n\n`java.util.Arrays` 1.2\n\n### `hashCode`\
  \ 方法\n\n哈希码是从对象派生出的整数。哈希码应该是分散的——如果 `x` 和 `y` 是两个不同的对象，那么 `x.hashCode()` 和 `y.hashCode()`\
  \ 有很大的概率是不同的。\n\n`String` 类使用以下算法来计算哈希码：\n\n```\nint hash = 0;\nfor (int i = 0;\
  \ i < length(); i++)\n   hash = 31 * hash + charAt(i);\n```\n\n由 `hashCode` 方法产生的哈希码\n\
  \n| String | 哈希码 |\n| --- | --- |\n| Hello | 69609650 |\n| Harry | 69496448 |\n\
  | Hacker | -2141031506\n\nhashCode 方法在 `Object` 类中定义。因此，每个对象都有默认的哈希码。该哈希码派生自对象的内存地址。考虑这个示例：\n\
  \n```\nvar s = \"Ok\";\nvar sb = new StringBuilder(s);\nSystem.out.println(s.hashCode()\
  \ + \" \" + sb.hashCode());\nvar t = new String(\"Ok\");\nvar tb = new StringBuilder(t);\n\
  System.out.println(t.hashCode() + \" \" + tb.hashCode());\n```\n\nString 和 StringBuilder\
  \ 的哈希码\n\n| 对象 | 哈希码 | 对象 | 哈希码 |\n| --- | --- | --- | --- |\n| s | 2556 | t | 2556\
  \ |\n| sb | 20526976 | tb | 20527144\n\n注意，字符串 `s` 和 `t` 具有相同的哈希码，因为对于字符串，哈希码派生自其内容。StringBuilder\
  \ `sb` 和 `tb` 具有不同的哈希码，因为 `StringBuilder` 类没有定义 `hashCode` 方法，而 `Object` 类的默认 `hashCode`\
  \ 方法从内存地址导出哈希码。\n\n如果你重定义了 `equals` 方法，还需要为可能插入哈希表的对象重定义 `hashCode` 方法。（我在第 9 章中讨论了哈希表](../ch09/index.xhtml））\n\
  \n`hashCode` 方法应该返回一个整数（可以是负数）。只需组合实例字段的哈希码，使得不同对象的哈希码可能广泛分散。\n\n例如，这里是 `Employee`\
  \ 类的 `hashCode` 方法：\n\n\n\n\n\n```java\npublic class Employee\n{\n   public int\
  \ hashCode()\n   {\n      return 7 * name.hashCode()\n         + 11 * Double.valueOf(salary).hashCode()\n\
  \         + 13 * hireDay.hashCode();\n   }\n   . . .\n}\n```\n\n但是，你可以做得更好。首先，使用空安全的方法\
  \ `Objects.hashCode`。如果其参数为 `null`，它返回 `0`；否则返回在参数上调用 `hashCode` 的结果。此外，使用静态的 `Double.hashCode`\
  \ 方法来避免创建 `Double` 对象：\n\n```java\npublic int hashCode()\n{\n   return 7 * Objects.hashCode(name)\n\
  \      + 11 * Double.hashCode(salary)\n      + 13 * Objects.hashCode(hireDay);\n\
  }\n```\n\n如果实例变量的取值范围较小，你需要尽可能获得不同的哈希值。考虑对日期进行哈希。计算 `7 * year + 11 * month + 13\
  \ * day` 会产生很多冲突。相比之下，`31 * 12 * year + 31 * month + day` 是一个“完美哈希函数”。假设在一个合理的年份范围内，没有两个日期的哈希值是相同的。（支持\
  \ ±999,999,999 年范围的 `LocalDate` 类的实际 `hashCode` 方法要复杂得多。）\n\n组合多个哈希值可能很繁琐。在许多情况下，你只需要对所有字段调用\
  \ `Objects.hash` 即可。它将组合所有参数的哈希值。那么，`Employee.hashCode` 方法 get 如下：\n\n```java\n\
  public int hashCode() \n{ \n   return Objects.hash(name, salary, hireDay); \n}\n\
  ```\n\n但是，你需要小心处理数组类型的字段。数组的哈希值是通过 `Object.hashCode` 计算的，并且*不依赖*于它的元素。相反，请使用静态的\
  \ `Arrays.hashCode` 方法，它可以组合数组元素的哈希值。对于基本类型数组和对象数组都有重载方法。对于多维数组，请使用 `Arrays.deepHashCode`。\n\
  \n`Arrays.hashCode(Object[])` 方法的工作方式几乎类似于 `String.hashCode`，它使用“乘以 31 并加上”的操作来组合元素的哈希值。但有一个转折：零长度数组的哈希值为\
  \ 1，以区别于 `null`。以下是其实现代码：\n\n```java\npublic static int hashCode(Object[] a)\n{\n\
  \   if (a == null) return 0;\n\n   int result = 1; // 从 1 开始，而不是 0\n\n   for (Object\
  \ element : a)\n      result = 31 * result + (element == null ? 0 : element.hashCode());\n\
  \n   return result;\n}\n```\n\n`Objects.hash` 方法调用了 `Arrays.hashCode`。因此，`Objects.hash(x)`\
  \ 等于 `31 + x.hashCode()`。\n\n`record` 类型自动提供 `hashCode` 方法，从组件值的哈希值派生哈希值。其具体行为在\
  \ Java 语言规范中尚未开放。在 OpenJDK 21 中，组件哈希简单通过“乘以 31 并加上”的操作组合，并从零开始。\n\n你对 `equals` 和\
  \ `hashCode` 的定义必须保持兼容：如果 `x.equals(y)` 为 `true`，那么 `x.hashCode()` 返回的值必须与 `y.hashCode()`\
  \ 相同。例如，如果你定义 `Employee.equals` 来比较员工 ID，那么 `hashCode` 方法就需要对 ID 进行哈希，而不是员工姓名或内存地址。\n\
  \n### `java.lang.Object` 1.0\n\n*   `int hashCode()`\n    返回此对象的哈希值。哈希值可以是任何整数，正负均可。等的对象需要返回相同的哈希值。\n\
  \n### `java.util.Objects` 7\n\n*   `static int hash(Object... objects)`\n    返回一个由所有提供的对象的哈希值组合成的哈希值。\n\
  \n*   `static int hashCode(Object a)`\n    如果 `a` 为 `null` 则返回 `0`，否则返回 `a.hashCode()`。\n\
  \n### `java.lang.(Integer|Long|Short|Byte|Double|Float|Character|Boolean)` 1.0\n\
  \n*   `static int hashCode(xxx value)` 8\n    返回给定值的哈希值。这里 `xxx` 是对应于给定包装类的基本类型。\n\
  \n### `java.util.Arrays` 1.2\n\n*   `static int hashCode(xxx[] a)` 5.0\n    计算数组\
  \ `a` 的哈希值。数组的组件类型 `xxx` 可以是 `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float`\
  \ 或 `double`。\n\n### `toString` 方法\n\n`Object` 中的另一个重要方法是 `toString` 方法，它返回代表此对象值的字符串。这是一个典型的示例。`Point`\
  \ 类的 `toString` 方法返回如下字符串：\n\n```javajava.awt.Point[x=10,y=20]\n```\n\n大多数（但并非所有）`toString`\
  \ 方法都遵循这种格式：类名，然后是方括号内的字段值。以下是 `Employee` 类 `toString` 方法的实现：\n\n```java\npublic\
  \ String toString()\n{\n   return \"Employee[name=\" + name\n      + \",salary=\"\
  \ + salary\n      + \",hireDay=\" + hireDay\n      + \"]\";\n}\n```\n\n大多数（但并非所有）`toString`\
  \ 方法都遵循这种格式：类名，然后是方括号内的字段值。以下是 `Employee` 类 `toString` 方法的实现：\n\n```java\npublic\
  \ String toString()\n{\n   return \"Employee[name=\" + name\n      + \",salary=\"\
  \ + salary\n      + \",hireDay=\" + hireDay\n      + \"]\";\n}\n```\n\n（注：由于提供的原文中包含大量重复的段落，译文已根据要求提取了核心逻辑并进行了去重翻译。）\n\
  \n\n\n\n我强烈建议为你编写的每个类都添加一个 `toString` 方法。你以及其他使用你类的程序员都会对这种日志支持心存不尽。\n\n然而，对于 `record`\
  \ 类型，系统已经提供了 `toString` 方法。它简单地列出了类名以及字段的名称及其字符串化后的值。\n\n在前面的章节中，你学习了如何重写 `equals`、`hashCode`\
  \ 和 `toString` 方法。在一种可能不太可能、但你需要访问未修改原始行为的情况下，可以采取以下操作：\n\n*   使用 `==` 而不是 `equals`\
  \ 进行比较\n*   调用 `System.identityHashCode(obj)` 或 `Objects.identityToString(obj)`\
  \ 来获取在没有重写 `hashCode` 或 `toString` 时本应返回的结果\n\n[] 中的程序测试了 `Employee` 和 `Manager`\
  \ 类的 `equals`、`hashCode` 和 `toString` 方法。\n\n`equals/EqualsTest.java`\n\n```java\n\
  package equals;\n\n/**\n * This program demonstrates the equals method.\n * @version\
  \ 1.12 2012-01-26\n * @author Cay Horstmann\n */\npublic class EqualsTest {\n  \
  \  public static void main(String[] args) {\n        var alice1 = new Employee(\"\
  Alice Adams\", 75000, 1987, 12, 15);\n        var alice2 = alice1;\n        var\
  \ alice3 = new Employee(\"Alice Adams\", 75000, 1987, 12, 15);\n        var bob\
  \ = new Employee(\"Bob Brandson\", 50000, 1989, 10, 1);\n        System.out.println(\"\
  alice1 == alice2: \" + (alice1 == alice2));\n        System.out.println(\"alice1\
  \ == alice3: \" + (alice1 == alice3));\n        System.out.println(\"alice1.equals(alice3):\
  \ \" + alice1.equals(alice3));\n        System.out.println(\"alice1.equals(bob):\
  \ \" + alice1.equals(bob));\n        System.out.println(\"bob.toString(): \" + bob);\n\
  \        var carl = new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n      \
  \  var boss = new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n        boss.setBonus(5000);\n\
  \        System.out.println(\"boss.toString(): \" + boss);\n        System.out.println(\"\
  carl.equals(boss): \" + carl.equals(boss));\n        System.out.println(\"alice1.hashCode():\
  \ \" + alice1.hashCode());\n        System.out.println(\"alice3.hashCode(): \" +\
  \ alice3.hashCode());\n        System.out.println(\"bob.hashCode(): \" + bob.hashCode());\n\
  \        System.out.println(\"carl.hashCode(): \" + carl.hashCode());\n    }\n}\n\
  ```\n\n`equals/Employee.java`\n\n```java\npackage equals;\n\nimport java.time.*;\n\
  import java.util.Objects;\n\npublic class Employee {\n    private String name;\n\
  \    private double salary;\n    private LocalDate hireDay;\n\n    public Employee(String\
  \ name, double salary, int year, int month, int day) {\n        this.name = name;\n\
  \        this.salary = salary;\n        hireDay = LocalDate.of(year, month, day);\n\
  \    }\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ double getSalary() {\n        return salary;\n    }\n\n    public LocalDate getHireDay()\
  \ {\n        return hireDay;\n    }\n\n    public void raiseSalary(double byPercent)\
  \ {\n        double raise = salary * byPercent / 100;\n        salary += raise;\n\
  \    }\n\n    public boolean equals(Object otherObject) {\n        // a quick test\
  \ to see if the objects are identical\n        if (this == otherObject) return true;\n\
  \        // must return false if the explicit parameter is null\n        if (otherObject\
  \ == null) return false;\n        // if the classes don't match, they can't be equal\n\
  \        if (getClass() != otherObject.getClass()) return false;\n        // now\
  \ we know otherObject is an Employee\n        Employee other = (Employee) otherObject;\n\
  \        // test equality\n        return Objects.equals(name, other.name)\n   \
  \             && Objects.equals(salary, other.salary)\n                && Objects.equals(hireDay,\
  \ other.hireDay);\n    }\n\n    public int hashCode() {\n        return Objects.hash(name,\
  \ salary, hireDay);\n    }\n\n    public String toString() {\n        return getClass().getName()\
  \ + \"[name=\" + name + \",salary=\" + salary + \",hireDay=\" + hireDay + \"]\"\
  ;\n    }\n}\n```\n\n`equals/Manager.java`\n\n```java\npackage equals;\n\npublic\
  \ class Manager extends Employee {\n    private double bonus;\n\n    public Manager(String\
  \ name, double salary, int year, int month, int day) {\n        super(name, salary,\
  \ year, month, day);\n    }\n\n    public void setBonus(double bonus) {\n      \
  \  this.bonus = bonus;\n    }\n\n    public double getBonus() {\n        return\
  \ bonus;\n    }\n\n    @Override\n    public boolean equals(Object otherObject)\
  \ {\n        if (!super.equals(otherObject)) return false;\n        Manager other\
  \ = (Manager) otherObject;\n        return bonus == other.bonus;\n    }\n\n    @Override\n\
  \    public int hashCode() {\n        return Objects.hash(super.hashCode(), bonus);\n\
  \    }\n\n    @Override\n    public String toString() {\n        return super.toString()\
  \ + \",bonus=\" + bonus + \"]\";\n    }\n}\n```\n\n## 通用数组列表\n\n在某些编程语言中——特别是 C\
  \ 和 C++——你必须在编译时就固定所有数组的大小。程序员讨厌这一点，因为这迫使他们做出艰难的权衡。一个部门会有多少员工？最多不超过 100 个吧？如果有一个拥有\
  \ 150 个员工的巨大部门呢？难道我们要为每个只有 10 个人的部门浪费 90 个条目吗？\n\n在 Java 中，情况要好一些。你可以在运行时设置数组的大小。\n\
  \n```java\nint actualSize = . . .;\nvar staff = new Employee[actualSize];\n```\n\
  \n当然，这段代码并没有完全解决运行时动态修改数组的问题。一旦设置了数组大小，就无法轻松更改它。相反，在 Java 中你可以通过使用另一个名为 `ArrayList`\
  \ 的 Java 类来处理这种常见情况。`ArrayList` 类类似于数组，但它会在添加和删除元素时自动调整其容量，无需额外的代码。\n\n\n\n\n\n\
  `ArrayList` 是一个带有类型参数的泛型类。要指定数组列表所持元素对象的类型，你需要在后面添加一个括尖括号内的类名，例如 `ArrayList<Employee>`。你将在第\
  \ 8 章 中看到如何定义自己的泛型类，但在使用 `ArrayList` 类型时不需要了解任何这些技术细节。\n\n接下来的章节将为你展示如何操作数组列表。\n\
  \n## 声明数组列表\n\n以下是如何声明并构造一个持有 `Employee` 对象的数组列表：\n\n```\nArrayList<Employee> staff\
  \ = new ArrayList<Employee>();\n```\n\n使用 `var` 关键字来避免重复类名是一个好主意：\n\n```java\nvar\
  \ staff = new ArrayList<Employee>();\n```\n\n如果不使用 `var` 关键字，可以省略右侧的类型参数：\n\n```\n\
  ArrayList<Employee> staff = new ArrayList<>();\n```\n\n这被称为“钻石”语法，因为空括号 `<>` 看起来像一个菱形。将钻石语法与\
  \ `new` 运算符结合使用。编译器会检查新值的去向。如果它被赋值给变量、传递给方法或从方法返回，编译器就会检查变量、参数或方法的泛型类型。然后它会将该类型放入\
  \ `<>` 中。在我们的示例中，`new ArrayList<>()` 被赋值给类型为 `ArrayList<Employee>` 的变量。因此，泛型类型是\
  \ `Employee`。\n\n如果你用 `var` 声明 `ArrayList`，请不要使用钻石语法。声明\n\n```\nvar elements = new\
  \ ArrayList<>();\n```\n\n将产生一个 `ArrayList<Object>`。\n\n在 Java 5 之前，没有泛型类。相反，只有一个\
  \ `ArrayList` 类，这是一个通用的集合，持有 `Object` 类型的元素。你仍然可以在不带 `<. . .>`后缀的情况下使用 `ArrayList`。它被视为“原始”（raw）类型，类型参数被擦除。\n\
  \n在更早的 Java 版本中，程序员使用 `Vector` 类作为动态数组。然而，`ArrayList` 类效率更高，已经没有充分理由使用 `Vector`\
  \ 类了。\n\n使用 `add` 方法向数组列表添加新元素。例如，以下是向数组列表填充 `Employee` 对象的方法：\n\n```\nstaff.add(new\
  \ Employee(\"Harry Hacker\", . . .));\nstaff.add(new Employee(\"Tony Tester\", .\
  \ . .));\n```\n\n数组列表管理一个内部的对象引用的数组。最终，该数组将用尽空间。这就是数组列表发挥魔法的地方：如果你调用 `add` 且内部数组已，数组列表会自动创建一个更大的数组，并将所有对象从小数组复制到大数组。\n\
  \n如果你已经知道或大致推算出想要存储多少个元素，可以在填充数组列表之前调用 `ensureCapacity` 方法：\n\n```\nstaff.ensureCapacity(100);\n\
  ```\n\n该调用分配了一个包含 100 个对象的内部数组。然后，前 100 次 `add` 调用将不会涉及任何昂贵的重新分配。\n\n你也可以向 `ArrayList`\
  \ 构造函数传递初始容量：\n\n```java\nArrayList<Employee> staff = new ArrayList<>(100);\n```\n\
  \n分配数组列表为\n\n```\nnew ArrayList<>(100) // 容量为 100\n```\n\n与分配一个新数组为\n\n```\nnew\
  \ Employee[100] // 大小为 100\n```\n\n不同。数组列表的容量（capacity）和数组的大小（size）之间存在重要的区别。如果你分配了一个具有\
  \ 100 个条目的数组，那么该数组就有 100 个槽位准备好使用。容量为 100 个元素的数组列表具有持有 100 个元素的潜力（实际上可以超过 100 个，代价是额外的重新分配）——但在开始，即使在初始构造之后，数组列表也未包含任何元素。\n\
  \n`size` 方法返回数组列表中元素的实际数量。例如，\n\n```\nstaff.size()\n```\n\n返回 `staff` 数组列表当前的元素数量。这等同于数组\
  \ `a` 的\n\n```\na.length\n```\n\n一旦你相当确定数组列表达到了其固定大小，就可以调用 `trimToSize` 方法。该方法会调整内存块的大小，使其仅使用存储当前元素所需的存储空间。垃圾回收器将回收任何多余内存。\n\
  \n一旦修剪了数组列表的大小，添加新元素将再次移动该块，这需要花费时间。只有当你确定不会向数组列表添加更多元素时，才使用 `trimToSize`。\n\n`ArrayList`\
  \ 类类似于 C++ 的 `vector` 模板。`ArrayList` 和 `vector` 都是泛型类型。但 C++ 的 `vector` 模板重载了 `[]`\
  \ 运算符以便于方便访问元素。Java 没有运算符重载，因此必须使用显式方法调用。此外，C++ vector 是按值拷贝。如果 `a` 和 `b` 是两个 vector，那么赋值\
  \ `a = b` 会让 `a` 变成一个与 `b` 相同的新 vector，并将所有元素从 `b` 拷贝到 `a`。Java 中相同的赋值会让 `a` 和 `b`\
  \ 同一个数组列表。\n\n`java.util.ArrayList<E>` 1.2\n\n- `ArrayList<E>()` 构建一个空的数组列表。\n-\
  \ `ArrayList<E>(int initialCapacity)` 构建一个指定容量的空数组列表。\n- `boolean add(E obj)` 将\
  \ `obj` 追加到数组列表末尾。返回 `true`。\n- `int size()` 返回数组列表中当前的元素数量。\n- `void ensureCapacity(int\
  \ capacity)` 确保数组列表具有指定数量的元素。\n- `void trimToSize()` 将数组列表的存储容量缩小到其当前大小。\n\n## 访问列表元素\n\
  \n遗憾的是，天下没有免费午餐。数组列表的自动增长需要更复杂的语法来访问元素。与其使用愉快的 `[]` 语法来访问或更改元素，不如使用 `get` 和 `set`\
  \ 方法。\n\n例如，设置第 `i` 个元素，使用\n\n```\nstaff.set(i, harry);\n```\n\n这等同于数组 `a` 的\n\n\
  ```\na[i] = harry;\n```\n\n（与数组一样，索引值从 0 开始。）\n\n在数组列表的大小大于 `i` 之前，不要调用 `list.set(i,\
  \ x)`。例如，以下代码是错误的：\n\n```\nvar list = new ArrayList<Employee>(100); // 容量 100，大小\
  \ 0\nlist.set(0, x); // 还没有元素 0\n```\n\n使用 `add` 方法代替 `set` 来填充数组，仅在替换已添加元素时使用 `set`。获取数组列表元素，使用\n\
  \n```\nEmployee e = staff.get(i);\n```\n\n这等同于\n\n```\nEmployee e = a[i];\n```\n\
  \n在没有泛型类时，`ArrayList` 类的 `get` 方法只能返回 `Object`。因此，`get` 的调用者必须将返回的值转换为所需的类型\n\n\
  ```\nEmployee e = (Employee) staff.get(i);\n```\n\n原始 `ArrayList` 也有点危险。它的 `add`\
  \ 和 `set` 方法接受任何类型的对象。调用\n\n```\nstaff.set(i, \"Harry Hacker\");\n```\n\n编译通过时不产生任何警告，只有当你检索对象并尝试强制转换它时才会遇到麻烦。如果你使用\
  \ `ArrayList<Employee>`，编译器将检测到此错误。\n\n有时你可以通过以下技巧同时兼得灵活的增长和方便的元素访问。首先，创建一个数组列表并添加所有元素：\n\
  \n```java\nvar list = new ArrayList<X>();\nwhile (. . .)\n{\n   x = . . .;\n   list.add(x);\n\
  }\n```\n\n完成后，使用 `toArray` 方法将元素拷贝到数组中：\n\n```java\nvar a = new X[list.size()];\n\
  list.toArray(a);\n```\n\n\n\n\n有时，你需要在数组列表的中间添加元素。使用带有索引参数的 `add` 方法：\n\n```java\n\
  int n = staff.size() / 2;\nstaff.add(n, e);\n```\n\n位置 `n` 及以上的元素将向上移动，以为新条目留出空间。如果插入后数组列表的新大小超过了容量，数组列表将重新分配其存储数组。\n\
  \n同样，你可以从数组列表的中间删除一个元素：\n\n```java\nEmployee e = staff.remove(n);\n```\n\n位于其上方的元素将向下复制，数组的大小减一。\n\
  \n插入和删除元素的效率并不高。对于小型数组列表，这可能不需要担心。但如果你存储了许多元素并频繁在集合中间插入和删除，请考虑使用链表。我将在第 9 章中解释如何使用链表编程。\n\
  \n你可以使用“for each”循环来遍历数组列表的内容：\n\n```java\nfor (Employee e : staff)\n   对 e 执行某些操作\n\
  ```\n\n这个循环的效果与下面相同：\n\n```java\nfor (int i = 0; i < staff.size(); i++)\n{\n   Employee\
  \ e = staff.get(i);\n   对 e 执行某些操作\n}\n```\n\n[](#index.xhtml_ch05ex04) 是第 4 章中\
  \ `EmployeeTest` 程序的修改。`Employee[]` 数组被替换为 `ArrayList<Employee>`。注意以下变化：\n\n* 你不需要指定数组的大小。\n\
  * 你使用 `add` 添加任意数量的元素。\n* 你使用 `size()` 而不是 `length` 来统计元素个数。\n* 你使用 `a.get(i)` 而不是\
  \ `a[i]` 来访问元素。\n\n`arrayList/ArrayListTest.java`\n\n```java\npackage arrayList;\n\
  import java.util.*;\n\n/**\n * 此程序演示了 ArrayList 类。\n * @version 1.11 2012-01-26\n\
  \ * @author Cay Horstmann\n */\npublic class ArrayListTest\n{\n public static void\
  \ main(String[] args)\n {\n   // 用三个 Employee 对象填充 staff 数组列表\n  var staff = new\
  \ ArrayList<Employee>();\n  staff.add(new Employee(\"Carl Cracker\", 75000, 1987,\
  \ 12, 15));\n  staff.add(new Employee(\"Harry Hacker\", 50000, 1989, 10, 1));\n\
  \  staff.add(new Employee(\"Tony Tester\", 40000, 1990, 3, 15));\n   // 将每个人的薪水增加\
  \ 5%\n  for (Employee e : staff)\n  e.raiseSalary(5);\n   // 打印所有 Employee 对象的信息\n\
  \  for (Employee e : staff)\n  System.out.println(\"name=\" + e.getName() + \",salary=\"\
  \ + e.getSalary() + \",hireDay=\" \n  + e.getHireDay());\n }\n}\n```\n\n`java.util.ArrayList<E>`\
  \ 1.2\n\n* `E set(int index, E obj)`：将值 `obj` 放在数组列表指定的索引处，并返回之前的内容。\n* `E get(int\
  \ index)`：获取存储在指定索引的值。\n* `void add(int index, E obj)`：向上移动元素以在指定的索引处插入 `obj`。\n\
  * `E remove(int index)`：删除给定索引处的元素，并将其上方的所有元素向下移动。返回被删除的元素。\n\n### 类型数组列表与原始数组列表之间的兼容性\n\
  \n在你自己的代码中，你总是希望使用类型参数来增加安全性。在本节中，你将看到如何与不使用类型参数的遗留代码进行交互。\n\n假设你有以下遗留类：\n\n```java\n\
  public class EmployeeDB\n{\n   public void update(ArrayList list) { . . . }\n  \
  \ public ArrayList find(String query) { . . . }\n}\n```\n\n你可以将带类型的数组列表传递给 `update`\
  \ 方法，而无需任何转换。\n\n```java\nArrayList<Employee> staff = . . .;\nemployeeDB.update(staff);\n\
  ```\n\n`staff` 对象被直接传递给 `update` 方法。\n\n尽管你没有收到编译器的错误或警告，但此调用并不是完全安全的。`update` 方法可能会向数组列表中添加不是\
  \ `Employee` 类型的元素。当检索这些元素时，就会发生异常。这听起来很吓，但如果你仔细考虑，这种行为仅仅是 Java 在引入泛型之前的运行方式。虚拟机的完整性从未受到威胁。在这种情况下，你虽然没有丢失安全性，但也无法从编译时检查中受益。\n\
  \n相反，当你将原始 `ArrayList` 赋值给带类型的列表时，你会得到一个警告。\n\n```java\nArrayList<Employee> result\
  \ = employeeDB.find(query); // 产生警告\n```\n\n要查看警告文本，请使用选项 `-Xlint:unchecked` 进行编译。\n\
  \n使用强制转换并消除警告。\n\n```java\nArrayList<Employee> result = (ArrayList<Employee>) employeeDB.find(query);\
  \ \n   // 产生另一个警告\n```\n\n相反，你会收到不同的警告，告诉该转换是误导性的。\n\n这是 Java 泛型类型一个相当遗憾的局限性导致的后果。为了兼容性，带类型的列表转换为原始\
  \ `ArrayList`。在运行时，类型规则没有被违反。在处理遗留代码时，你对此无能为。一旦你确认这一点，可以对接收警告的变量标记 `@SuppressWarnings(\"\
  unchecked\")` 注解，如下：\n\n@SuppressWarnings(\"unchecked\") ArrayList<Employee> result\n\
  \      = (ArrayList<Employee>) employeeDB.find(query); // 产生警告\n\n### 包装类与自动装箱\n\
  \n有时，你需要将基本类型如 `int` 转换为对象。所有基本类型都有对应的类。例如，`Integer` 类对应基本类型 `int`。这些类通常被称为包装类。包装类的命名非常直观：`Integer`、`Long`、`Float`、`Double`、`Short`、`Byte`、`Character`\
  \ 和 `Boolean`。（前六者继承自公共父类 `Number`。）包装类是不可变的——你无法更改构造后的值。它们也是 `final` 的，因此无法继承。\n\
  \n假设我们需要整数数组列表。遗憾的是，括号内的类型参数不能是基本类型。无法形成 `ArrayList<int>`。在这里需要 `Integer` 包装类。可以声明一个\
  \ `Integer` 对象数组列表。\n\n```java\nvar list = new ArrayList<Integer>();\n```\n\n`ArrayList<Integer>`\
  \ 的效率远低于 `int[]` 数组，因为每个值都单独包装在对象中。只有当程序员的便利性优于效率时，你可能才会使用这种结构。\n\n幸运的是，有一个非常有用的功能可以方便地将\
  \ `int` 类型的元素添加到 `ArrayList<Integer>` 中。调用\n\n```java\nlist.add(3);\n```\n\n会被自动翻译为\n\
  \n```java\nlist.add(Integer.valueOf(3));\n```\n\n这种转换被称为自动装箱（autoboxing）。你可能认为自动拆箱（autowrapping）更一致，但“装箱”这个比喻借自\
  \ C#。\n\n相反，当你将 `Integer` 对象赋值给 `int` 值时，它会自动拆箱。也就是说，编译器会将\n\n```java\nint n = list.get(i);\n\
  ```\n\n转换为\n\n```java\nint n = list.get(i).intValue();\n```\n\n自动装箱和拆箱甚至在算术表达式中也有效。例如，你可以对包装引用应用递增运算符：\n\
  \n```java\nInteger n = 3;\nn++;\n```\n\n编译器会自动插入指令来拆箱对象、增加结果的值，将其重新装箱。\n\n\n\n在大多数情况下，你会产生一种基本类型及其包装类是完全等同的错觉。它们仅在一个点上存在显著差异：标识性（identity）。如你所知，应用于包装对象的\
  \ `==` 运算符仅用于用于测试这些对象是否具有相同的内存地址。因此，下面的比较可能会失败：\n\n```\nInteger a = 1000;\nInteger\
  \ b = 1000;\nif (a == b) . . .\n```\n\n然而，Java 的实现`可能会`在选择的情况下，将经常出现的值封装成相同的对象，因此比较可能会成功。这种模糊性并不是你所想要的。解决办法是在比较包装对象时调用\
  \ `equals` 方法。\n\n自动装箱（autoboxing）规范要求 `boolean`、`byte`、`char <= 127`、`short` 以及在\
  \ `-128` 到 `127` 之间的 `int` 被封装成固定对象。例如，如果上一个例子中的 `a` 和 `b` 被初始化为 `100`，那么比较将会成功。\n\
  \n永远不要依赖包装对象的标识性。不要用 `==` 比较它们，也不要将它们用锁（参见第 10 章）。\n\n不要使用包装类的构造函数。它们已经过时并计划被移除。例如，使用\
  \ `Integer.valueOf(1000)`，而永远使用 `new Integer(1000)`。或者，简单地依赖自动装箱：`Integer a = 1000`。\n\
  \n关于自动装箱还有一些微妙之处。首先，由于包装类引用可以为 `null`，自动拆箱（autounboxing）可能会抛出 `NullPointerException`：\n\
  \n```\nInteger n = null;\nSystem.out.println(2 * n); // throws NullPointerException\n\
  ```\n\n此外，如果你在条件表达式中混合使用 `Integer` 和 `Double` 类型，那么 `Integer` 值会被拆箱、提升为 `double`，并封装为\
  \ `Double`：\n\n```\nInteger n = 1;\nDouble x = 2.0;\nSystem.out.println(true ? n\
  \ : x); // prints 1.0\n```\n\n最后，让我们强调一下装箱和拆箱是`compiler`提供的便利，而不是虚拟机的功能。编译器在生成类的字节码时会插入必要的调用。虚拟机只是执行这些字节码。\n\
  \nJava 的未来版本将允许 `value types`（值类型），即类似于基本类型的用户定义类型——其值不存储在对象内部。例如，一个具有 `double`\
  \ 字段 `x` 和 `y` 的基本类型 `Point` 的值只是内存中的一个 16 字节块，包含两个相邻的 `double` 值。你可以复制它，但无法拥有它的引用。\n\
  \n计划在某个时刻，基本类型包装类将成为值类（value classes）。\n\n出于出于另一个原因看到数字包装类。Java 的设计者发现包装类是放置某些基本方法的地方，例如将数字字符串转换为数字的方法。\n\
  \n要将字符串转换为整数，请使用以下语句：\n\n```\nint x = Integer.parseInt(s);\n```\n\n这与 `Integer`\
  \ 对象无关——`parseInt` 是静态方法。但 `Integer` 类是一个放置它的好地方。\n\n\n\n你可以定义带有变长参数的方法，并且可以为参数指定任何类型，甚至是基本类型。这里有一个简单的示例：一个计算数量数量值最大值的函数。\n\
  \n```java\npublic static double max(double... values)\n{\n   double largest = Double.NEGATIVE_INFINITY;\n\
  \   for (double v : values) if (v > largest) largest = v;\n   return largest;\n\
  }\n```\n\n只需像这样调用该函数：\n\n```java\ndouble m = max(3.1, 40.4, -5);\n```\n\n编译器会将 `new\
  \ double[] { 3.1, 40.4, -5 }` 传递给 `max` 函数。\n\n传递变长参数类型的数组而不是变长参数本身是合法的。例如：\n\n\
  ```java\nSystem.out.printf(\"%d %s\", new Object[] { Integer.valueOf(1), \"widgets\"\
  \ } );\n```\n\n因此，你可以将最后一个参数为数组的现有函数重新定义为带有变长参数的方法，而不会破坏任何现有代码。例如，Java 5 中的 `MessageFormat.format`\
  \ 就是通过这种方式得到增强的。如果你愿意，甚至可以把 `main` 方法声明为：\n\n```java\npublic static void main(String...\
  \ args)\n```\n\n### 抽象类\n\n随着你在继承层次结构中移动，类变得越来越通用，可能越来越抽象。在某个点，祖先类变得*如此*通用，以至于你更多地将其看作其他类的基础，而不是一个你想要使用的特定实例的类。例如，考虑我们\
  \ `Employee` 类层次结构的扩展。员工是人，学生也是人。让我们扩展类层次结构以包含 `Person` 和 `Student` 类。[](#index.xhtml_ch05fig02)显示了这些类之间的继承关系。\n\
  \n![Figure](img/05_02.jpg)`Person` 及其子类的继承图\n\n为什么要费力达到如此级别的抽象？有些属性对每个人都是意义的，例如名字。学生和员工都有名字，引入一个共同的超类让我们可以将\
  \ `getName` 方法提取到继承层次结构中的更高层次。\n\n现在让我们添加另一个方法 `getDescription`，其目的是返回该人的简短描述，例如：\n\
  \n```\n一个工资为 $50,000.00 的员工\n一个主修计算机科学的学生\n```\n\n为 `Employee` 和 `Student` 类实现此方法很容易的。但你可以在\
  \ `Person` 类中提供什么信息呢？`Person` 类除了名字之外，对该人一无所知。当然，你可以实现 `Person.getDescription()`\
  \ 来返回一个空字符串。但有一个更好的方法。如果你使用 `abstract` 关键字，你就不再需要实现该方法了。\n\n```java\npublic abstract\
  \ String getDescription();\n   // 不需要实现\n```\n\n为了增加清晰度，拥有一个或多个抽象方法的类本身必须被声明为 `abstract`。\n\
  \n```java\npublic abstract class Person\n{\n   . . .\n   public abstract String\
  \ getDescription();\n}\n```\n\n除了抽象方法外，抽象类还可以拥有字段和具体方法。例如，`Person` 类存储了人的名字，并有一个返回该名字的具体方法。\n\
  \n```java\npublic abstract class Person\n{\n   private String name;\n\n   public\
  \ Person(String name)\n   {\n      this.name = name;\n   }\n\n   public abstract\
  \ String getDescription();\n\n   public String getName()\n   {\n       return name;\n\
  \   }\n}\n```\n\n有些程序员并没有意识到抽象类可以拥有具体方法。你应该始终将公共字段和方法（无论是否抽象）移动到父类中（无论是否是抽象）。\n\n\
  抽象方法充当子类中实现方法的占位符。当你扩展一个抽象类时，你有两个选择。你可以让部分或全部抽象方法未定义；那么，你也必须将子类标记为抽象的。或者，你可以定义所有方法，此时子类就不再是抽象的。\n\
  \n例如，我们将定义一个扩展抽象类 `Person` 的 `Student` 类并实现 `getDescription` 方法。`Student` 类中没有任何方法是抽象的，因此它不需要被声明为抽象类。\n\
  \n一个类即使没有抽象方法，也可以被声明为 `abstract`。\n\n抽象类不能被实例化。也就是说，如果一个类被声明为 `abstract`，则无法创建该类的任何对象。例如，表达式\n\
  \n```java\nnew Person(\"Vince Vu\")\n```\n\n是一个错误。然而，你可以创建具体子类的对象。\n\n请注意，你仍然可以创建抽象类的*对象变量*，但此类变量必须引用一个非抽象子类的对象。例如：\n\
  \n```java\nPerson p = new Student(\"Vince Vu\", \"Economics\");\n```\n\n在这里，`p`\
  \ 是抽象类型 `Person` 的变量，它引用非抽象子类 `Student` 的实例。\n\n在 C++ 中，抽象方法被称为“纯虚函数”，并标记为 `0`，如下：\n\
  \n```cpp\nclass Person\npublic:\n   virtual string getDescription() = 0;\n   . .\
  \ .\n};\n```\n\n一个 C++ 类如果有一个纯虚函数就是抽象的。让我们定义一个扩展抽象类 `Person` 的 `Student` 类并实现 `getDescription`\
  \ 方法。`Student` 类中没有任何方法是抽象的，因此它不需要被声明为抽象类。\n\n```java\npublic class Student extends\
  \ Person\n{\n   private String major;\n\n   public Student(String name, String major)\n\
  \   {\n      super(name);\n      this.major = major;\n   }\n\n   public String getDescription()\n\
  \   {\n      return \"a student majoring in \" + major;\n   }\n}\n```\n\n`Student`\
  \ 类定义了 `getDescription` 方法。在 C++ 中，抽象类如果有一个纯虚函数就是抽象的。我们填充 `Person` 引用：\n\n```java\n\
  var people = new Person[2];\n// 用 Student 和 Employee 对象填充 people 数组\npeople[0] =\
  \ new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\npeople[1] = new Student(\"\
  Maria Morris\", \"computer science\");\n```\n\n我们打印这些对象的名字和描述：\n\n```java\nfor (Person\
  \ p : people)\n   System.out.println(p.getName() + \", \" + p.getDescription());\n\
  ```\n\n\n\n\n```java\npackage abstractClasses;\n```\n\n```java\npublic abstract\
  \ class Person\n{\n  public abstract String getDescription();\n\n  private String\
  \ name;\n\n  public Person(String name)\n  {\n    this.name = name;\n  }\n\n  public\
  \ String getName()\n  {\n    return name;\n  }\n}\n```\n\n路径：`abstractClasses/Employee.java`\n\
  \n```java\npackage abstractClasses;\n```\n\n```java\nimport java.time.*;\n```\n\n\
  ```java\npublic class Employee extends Person\n{\n  private double salary;\n\n \
  \ private LocalDate hireDay;\n\n  public Employee(String name, double salary, int\
  \ year, int month, int day)\n  {\n    super(name);\n    this.salary = salary;\n\
  \    hireDay = LocalDate.of(year, month, day);\n  }\n\n  public double getSalary()\n\
  \  {\n    return salary;\n  }\n\n  public LocalDate getHireDay()\n  {\n    return\
  \ hireDay;\n  }\n\n  public String getDescription()\n  {\n    return \"an employee\
  \ with a salary of $%.2f\".formatted(salary);\n  }\n\n  public void raiseSalary(double\
  \ byPercent)\n  {\n    double raise = salary * byPercent / 100;\n    salary += raise;\n\
  \  }\n}\n```\n\n路径：`abstractClasses/Student.java`\n\n```java\npackage abstractClasses;\n\
  ```\n\n```java\npublic class Student extends Person\n{\n  private String major;\n\
  \n  /**\n   * @param name 学生的名字\n   * @param major 学生的专业\n   */\n  public Student(String\
  \ name, String major)\n  {\n    // 将名字传递给父类构造函数\n    super(name);\n    this.major\
  \ = major;\n  }\n\n  public String getDescription()\n  {\n    return \"a student\
  \ majoring in \" + major;\n  }\n}\n```\n\n## 枚举类\n\n你已经在 第 3 章 中学习了如何定义枚举类型。这里有一个典型的示例：\n\
  \n```java\npublic enum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE }\n```\n\n当你引用这些常量时，请使用类名对其进行限定，例如\
  \ `Size.SMALL`。在三种情况下你可以使用未限定名称：\n\n1. 正如你很快将看到的，枚举可以拥有方法。在枚举的方法内部，你可以使用未限定名称。\n\
  \n2. 在选择器为枚举类型的 `switch` 的 `case` 分支中，你不需要限定：\n\n   ```java\n   Size s = . . .;\n\
  \   String abbrev = switch (s)\n      {\n          case SMALL -> \"S\"; \n     \
  \     . . .\n       };\n   ```\n\n3. 你可以静态导入枚举的所有常量：\n\n   ```java\n   import com.horstmann.util.Size;\n\
  \   import static com.horstmann.util.Size.*;\n   . . .\n   Size s = SMALL; \n  \
  \ ```\n\n你不能静态导入默认包中的枚举常量。例如，如果 `Size` 在默认包中，你无法使用：\n\n```java\nimport static Size.*;\n\
  ```\n\n由 `enum` 定义的类型实际上是一个类。该类恰好有四个实例——无法构造新对象。\n\n因此，你永远不需要对枚举类型的值使用 `equals`。只需使用\
  \ `==` 来比较它们。\n\n你允许在最后一个值后添加逗号。如果你预计值的数量会增长，尾随逗号会有用。\n\n```java\npublic enum Size\n\
  {\n   SMALL,\n   MEDIUM,\n   LARGE,\n   EXTRA_LARGE,\n   XXL,\n   // 在此处添加更多值并在每个后面添加逗号\n\
  }\n```\n\n所有枚举类型都是抽象类 `Enum` 的子类。它们继承了该类的许多方法。最用的是 `name`，它返回枚举常量的名称。例如，`Size.SMALL.toString()`\
  \ 返回字符串 `\"SMALL\"`。\n\n默认情况下，`toString` 方法返回 `name`。但是，你可以覆盖 `toString`，而 `name`\
  \ 是 `final` 的。\n\n`name` 的反向操作是静态方法 `valueOf`。例如，该语句：\n\n```java\nSize s = Enum.valueOf(Size.class,\
  \ \"SMALL\");\n```\n\n将 `s` 设置为 `Size.SMALL`。\n\n每个枚举类型都有一个静态 `values` 方法，返回枚举中所有值的数组。例如，调用：\n\
  \n```java\nSize[] values = Size.values();\n```\n\n返回包含元素 `Size.SMALL`、`Size.MEDIUM`、`Size.LARGE`\
  \ 和 `Size.EXTRA_LARGE` 的数组。\n\n`ordinal` 方法产生枚举常量在 `enum` 声明中的位置，从零开始计数。例如，`Size.MEDIUM.ordinal()`\
  \ 返回 `1`。\n\n\n\n\n\n返回给定类中给定名称的枚举常量。\n\n* `String name()`\n  返回此枚举常量的名称。\n\n* `int\
  \ ordinal()`\n  返回此枚举常量在 `enum` 声明中从 0 开始的索引。\n\n* `int compareTo(E other)`\n  如果此枚举常量在\
  \ `other` 之前，返回一个负整数；如果 `this == other`，返回 0；否则返回一个正整数。常量的顺序由 `enum` 声明决定。\n\n##\
  \ 密封类 (Sealed Classes)\n\n除非一个类被声明为 `final`，否则任何人都可以创建它的子类。但如果你想拥有更多的控制权呢？例如，假设你需要编写自己的\
  \ JSON 库，因为现有的库没有一个能完全符合你的需求。\n\nJSON 标准规定，JSON 值可以是数组、数字、字符串、布尔值、对象或 null。一种显而见的方法是使用\
  \ `JSONArray`、`JSONNumber` 等类来建模，这些类扩展自抽象类 `JSONValue`：\n\n```\npublic abstract\
  \ class JSONValue\n{\n   // 适用于所有 JSON 值的方法\n}\n\npublic final class JSONArray extends\
  \ JSONValue\n{\n   . . .\n}\n\npublic final class JSONNumber extends JSONValue\n\
  {\n   . . .\n}\n```\n\n通过将 `JSONArray`、`JSONNumber` 等类声明为 `final`，我们可以确保没有人能创建它们的子类。但我们无法阻止任何人创建\
  \ `JSONValue` 的另一个子类。\n\n为什么我们可能需要这种控制权？考虑这段代码：\n\n```\nJSONValue v = . . .;\nif\
  \ (v instanceof JSONArray a) . . .\nelse if (v instanceof JSONNumber n) . . .\n\
  else if (v instanceof JSONString s) . . .\nelse if (v instanceof JSOBoolean b) .\
  \ . .\nelse if (v instanceof JSONObject o) . . .\nelse . . . // 必须是 JSONNull\n```\n\
  \n在这里，控制流意味着我们知道 `JSONValue` 的直接子类。这不是一个开放的层次结构。JSON 标准不会改变；如果它改变了，我们作为库的实现者添加第七个子类即可。我们不希望其他人在这里搞乱类层次结构。\n\
  \n在 Java 中，`sealed` 类控制了哪些类可以继承它。密封类在 Java 15 中作为预览功能引入，并在 Java 17 中最终确定。\n\n以下是将\
  \ `JSONValue` 类声明为密封类的方法：\n\n```\npublic abstract sealed class JSONValue\n     \
  \ permits JSONArray, JSONNumber, JSONString, JSONBoolean, JSONObject, JSONNull\n\
  {\n   . . .\n}\n```\n\n定义未被许可的子类是一个错误：\n\n```\npublic class JSONComment extends\
  \ JSONValue { . . . } // 错误\n```\n\n这倒好，因为 JSON 不允许注释。因此，密封类允许对领域约束进行精确建模。\n\n密封类的被许可子类必须是可访问的。它们不能是嵌套在另一个类中的私有类，也不能是来自另一个包的包可见类。\n\
  \n对于公共的被许可子类，规则更加严格。它们必须与密封类处于同一个包中。然而，如果你使用了模块（参见 第 12 章），那么它们必须在同一个模块中。\n\n密封类可以在不带\
  \ `permits` 子句的情况下声明。这时，其所有的直接子类必须在同一个文件中声明。没有访问该文件的程序员无法创建子类。\n\n一个文件最多只能有一个 `public`\
  \ 类，因此这种安排似乎仅在子类不供公众使用时有用。\n\n然而，正如你将在下一章中看到的，你可以使用内部类作为公共子类。\n\n密封类的一个重要动机是编译时检查。考虑\
  \ `JSONValue` 类中的这个方法，它使用了带有模式匹配的 `switch` 表达式（参见 [](#index.xhtml_pattern-matching)）：\n\
  \n```\npublic String type()\n{\n   return switch (this)\n      {\n         case\
  \ JSONArray __ -> \"array\";\n         case JSONNumber __ -> \"number\";\n     \
  \    case JSONString __ -> \"string\";\n         case JSONBoolean __ -> \"boolean\"\
  ;\n         case JSONObject __ -> \"object\"; \n         case JSONNull __ -> \"\
  null\";\n         // 这里不需要 default\n      };\n}\n```\n\n编译器可以检查出不需要 `default` 子句，因为\
  \ `JSONValue` 的所有直接子类都作为 case 出现。\n\n此前的 `type` 方法看起来并不很面向对象。符合 OOP 精神的做法让这六个类中的每一个都提供自己的\
  \ `type` 方法，依赖多态而不是 `switch`。对于开放的层次结构，这是一个好方法。但当存在一组固定的类时，将所有备选项放在一个方法中通常更方便。\n\
  \n乍一看，密封类的子类似乎必须是 `final`。但对于穷尽性测试，我们只需要知道所有的直接子类。如果这些类有进一步的子类，也没有问题。例如，我们可以重新组织\
  \ JSON 层次结构，如 [](#index.xhtml_ch05fig03new)。\n\n![图](img/fig05-03-new.jpg)表示 JSON\
  \ 值的完整类层次结构。\n\n在这个层次结构中，`JSONValue` 允许三个子类：\n\n```\npublic abstract sealed class\
  \ JSONValue permits JSONObject, JSONArray, JSONPrimitive\n{\n   . . .\n}\n```\n\n\
  `JSONPrimitive` 类也是密封的：\n\n```\npublic abstract sealed class JSONPrimitive extends\
  \ JSONValue\n      permits JSONString, JSONNumber, JSONBoolean, JSONNull\n{\n  \
  \ . . .\n}\n```\n\n\n\n\n```java\n result.append(\"{\");\n for (Map.Entry<String,\
  \ JSONValue> entry : entrySet())\n {\n if (result.length() > 1) result.append(\"\
  ,\"); \n result.append(\" \\\"\");\n result.append(entry.getKey());\n result.append(\"\
  \\\": \");\n result.append(entry.getValue());\n }\n result.append(\" }\");\n return\
  \ result.toString();\n }\n}\n```\n\n```java\nsealed interface JSONPrimitive extends\
  \ JSONValue\n permits JSONNumber, JSONString, JSONBoolean, JSONNull\n{ \n}\n```\n\
  \n```java\nfinal record JSONNumber(double value) implements JSONPrimitive\n{\n public\
  \ String toString() { return \"\" + value; }\n}\n```\n\n```java\nfinal record JSONString(String\
  \ value) implements JSONPrimitive\n{\n public String toString() { return \"\\\"\"\
  \ + value.translateEscapes() + \"\\\"\"; }\n}\n```\n\n```java\nenum JSONBoolean\
  \ implements JSONPrimitive\n{\n FALSE, TRUE;\n public String toString() { return\
  \ super.toString().toLowerCase(); }\n}\n```\n\n```java\nenum JSONNull implements\
  \ JSONPrimitive\n{\n INSTANCE;\n public String toString() { return \"null\"; }\n\
  }\n```\n\n```java\npublic class SealedTest\n{\n public static void main(String[]\
  \ args)\n {\n JSONObject obj = new JSONObject();\n obj.put(\"name\", new JSONString(\"\
  Harry\"));\n obj.put(\"salary\", new JSONNumber(90000));\n obj.put(\"married\",\
  \ JSONBoolean.FALSE);\n JSONArray arr = new JSONArray();\n arr.add(new JSONNumber(13));\n\
  \ arr.add(JSONNull.INSTANCE);\n obj.put(\"luckyNumbers\", arr);\n System.out.println(obj);\n\
  \ System.out.println(obj.type());\n }\n}\n```\n\n## 模式匹配\n\n你已经见过如何使用 `instanceof`\
  \ 运算符来检查对象是否具有特定类型。`instanceof` 最方便的形式是声明一个匹配类型的变量：\n\n```java\nEmployee e = . .\
  \ .;\nString description;\nif (e instanceof Executive exec) description = \"An executive\
  \ with a title of \" + exec.getTitle();\nelse if (e instanceof Manager m) description\
  \ = \"A manager who deserves a bonus\";\nelse description = \"A lowly employee with\
  \ a salary of \" + e.getSalary();\n```\n\n模式匹配形式的 `switch` 简化这种类型分析：\n\n```java\n\
  Employee e = . . .;\nString description = switch (e)\n   {\n      case Executive\
  \ exec -> \"An executive with a title of \" + exec.getTitle();\n      case Manager\
  \ m -> \"A manager who deserves a bonus\";\n      default -> \"A lowly employee\
  \ with a salary of \" + e.getSalary();\n   };\n```\n\n请注意，与 `instanceof` 模式一样，每个\
  \ case 都会声明一个匹配类型的变量。你使用这些变量来访问子类方法（例如示例中的 `getTitle`）。\n\n使用 `switch` 的表达式形式比 `if`\
  \ 语句链更简单。`switch` 表达式产生一个值并赋值给 `description` 变量。相比之下，使用 `instanceof` 时，条件语句的每个分支必须单独设置\
  \ `description` 的值。\n\n可以将类型模式用于使用 `switch` 的语句形式和穿透（fallthrough）形式。但不带穿透的表达式形式通常是最自然的选择。\n\
  \n正如你刚刚所看到的，模式匹配的基本结构非常直观。接下来的子节将介绍技术细节，其中某些细节由于兼容性原因而有些复杂。\n\nJava 21 引入了作为预览特性的\
  \ `未命名变量`。如果你在类型模式中不需要该变量，可以使用下划线：\n\n```java\ncase Employee _ -> \"A lowly employee\"\
  \n```\n\n在这一特性成为正式可用之前，你可以使用两个下划线：\n\n```java\ncase Employee __ -> \"A lowly employee\"\
  \n```\n\n### 空值处理\n\n经典的 `switch` 语句对 `null` 是敏感的。如果选择器表达式为 `null`，`switch` 将抛出\
  \ `NullPointerException`。你可以通过添加 `case null` 来避免这种情况：\n\n```java\nString description\
  \ = switch (e)\n   {\n      case Executive exec -> \"An executive with a title of\
  \ \" + exec.getTitle();\n      case Manager m -> \"A manager who deserves a bonus\"\
  ;\n      case null -> \"No employee\";\n      default -> \"A lowly employee with\
  \ a salary of \" + e.getSalary();\n   };\n```\n\n你可以将 `case null` 与 `default` 结合，但不能与其他任何\
  \ case 结合：\n\n```java\ncase null, default -> \"No free parking\";\n```\n\n你不能使用\
  \ `case _` 来表示默认情况。这样做是有意之为，这样你就不需要记住这种情况是否覆盖了 `null`。\n\n### 守卫 (Guards)\n\n你可以为模式添加一个条件，称为\
  \ `守卫`，使用受限的 `when` 关键字。\n\n```java\ncase Executive exec when exec.getTitle().getLength()\
  \ >= 20 ->\n   \"An executive with an impressive title\";\n```\n\n在守卫表达式中，可以使用模式引入的变量。\n\
  \n如果守卫表达式不满足，则不会选择该 case，并测试下一个 case。\n\n如果在 `when` 子句中发生异常，`switch` 将抛出该异常。\n\n\
  守卫在记录模式中特别有用：\n\n```java\nPoint p = . . .;\nString description = switch (p)\n  \
  \ {\n      case Point(var x, var y) when x == 0 && y == 0 -> \"origin\";\n     \
  \ case Point(var x, var __) when x == 0 -> \"on x-axis\";\n      case Point(var\
  \ __, var y) when y == 0 -> \"on y-axis\";\n      default -> \"else\";\n   };\n\
  ```\n*(注：原文此处示例代码略有缺失，已根据逻辑补全了常见的模式匹配示例)*\n\n### 完备性 (Exhaustiveness)\n\n任何 `switch`\
  \ 表达式都必须完备的：它必须覆盖所有可能的值。要使 `switch` 完备有几种方式：\n\n*   `enum` 的每种实例\n*   `sealed` 类型的子类型的未守卫类型模式\n\
  *   选择器的未守卫类型模式\n*   `default` 子句\n\n守卫模式无法用于完备性检查，因为编译器无法评估它们。例如：\n\n```java\n\
  case Executive exec when exec.getTitle().getLength() >= 20 -> . . .\ncase Executive\
  \ exec when exec.getTitle().getLength() < 20 -> . . .\n```\n\n是不完备的。你需要将第二个句重写为：\n\
  \n```java\ncase Executive exec -> . . .\n```\n\n或\n\n```java\ndefault -> . . .\n\
  ```\n\n当 `sealed` 类型层次或枚举类被修改时，之前完备的 `switch` 可能会变得不完备。如果没有匹配的项，`switch` 将抛出 `MatchException`。\n\
  \n经典的 `switch` 语句不需要完备。如果没有匹配项，则不执行操作。但为了更清晰，所有增强型 `switch` 语句都必须完备。如果 `switch`\
  \ 语句具有模式、`case null` 或除原始类型、原始类型包装类、`String` 或 `enum` 以外的选择器类型。\n\n如果你不想在没有匹配时执行操作，请添加：\n\
  \n```java\ndefault -> {} // 无穿透\n```\n\n或\n\n```java\ndefault: break; // 穿透\n```\n\
  \n测试选择器值是否为 `null` 对于完备性不是必需的。你可以有一个没有 `case null` 的完备 `switch`。当使用 `null` 选择器调用时，它会抛出\
  \ `NullPointerException`。\n\n对于嵌套记录，完备性中缺少 `null` 检查是有问题的。考虑：\n\n```java\nrecord\
  \ Box<T>(T contents) { }\n\nBox<Box<String>> doubleBoxed = ...;\nString unboxed\
  \ = switch (doubleBoxed) {\n   case Box(Box(String s)) -> s;\n};\n```\n\n如果 `doubleBoxed`\
  \ 为 `null`，`switch` 将抛出 `NullPointerException`。相反，如果 `doubleBoxed` 是 `new Box<>(new\
  \ Box<>(null))`，表达式的结果为 `null`。\n\n然而，如果 `doubleBoxed` 使用 `new Box<>(null)` 初始化，则会发生\
  \ `MatchException`。本应该有一个这样的 case：\n\n```java\ncase Box(b) where b == null\n```\n\
  \n但完备性检查忽略了 `null`。\n\n## 优势性 (Dominance)\n\n\n\n\n在仅包含常量分支的经典 `switch` 中，在两个 case\
  \ 中使用相同的常量是非法的。因此，这些分支是互不交叉的，它们的顺序并不重要。然而，当 case 是模式时，顺序就变得重要了。程序会按顺序检查 case，并执行第一个匹配的\
  \ case。\n\n当编译器发现某个 case 因为前面的 case 而永远无法匹配时，就会发生编译时错误。这是一个示例：\n\n```\nEmployee\
  \ e = . . .;\nString description = switch (e)\n   {\n      case Employee __ -> \"\
  A lowly employee with a salary of \" + e.getSalary();\n      case Manager m -> \"\
  A manager who deserves a bonus\"; // ERROR\n   };\n```\n\n由于每个 `Manager` 都是 `Employee`，第二个\
  \ case 永远不会匹配。第一个 case `dominates`（支配）了它。\n\n这种支配地位检查对于发现编程错误很有用，但它并不完美。以下是你需要注意的细节：\n\
  \n*   守卫模式（Guarded patterns）不用于支配地位检查。编译器无法对守卫条件进行推理。例如，编译器无法判断\n\n    ```\n   \
  \ case Executive exec when exec.getTitle().getLength() >= 20 -> . . .\n    ```\n\
  \n    支配了\n\n    ```\n    case Executive exec when exec.getTitle().getLength() >=\
  \ 30 -> . . .\n    ```\n\n*   `default` 不支配常量分支。\n\n*   `default` 支配 `case null`，尽管它并没有覆盖它。\n\
  \n虽然可以将 `default` 放在常量分支之前，但这不是一个好主意。请务必始终将其放在最后。\n\n### 模式与常量\n\n你不能在记录器模式（record\
  \ patterns）内部与常量进行匹配。例如，\n\n```\ncase Point(0, y) // ERROR\n```\n\n是错误的。请使用守卫条件（guard）：\n\
  \n```\ncase Point(x, y) when x == 0 // Ok\n```\n\n数值常量模式仅在 `selector`（选择器）类型为 `int`、`short`、`char`、`byte`\
  \ 或其包装类型时允许。字符串常量模式仅允许类型为 `String` 的选择器。例如，以下内容是不合法的：\n\n```\nObject obj = . . .;\n\
  String description = switch (obj)\n   {\n      case 0 -> \"zero\"; // ERROR\n  \
  \    case \"\" -> \"empty string\"; // ERROR\n      case null -> \"null\";\n   \
  \   default -> obj.toString();\n   };\n```\n\n由于选择器类型是 `Object`，`switch` 不能具有数值或字符串常量模式。解决办法是：\n\
  \n```\ncase Integer i when i == 0\ncase String s when s.equals(\"null\")\n```\n\n\
  `enum` 常量的规则有所不同。选择器类型只需是枚举类型的超类型即可；即 `Object`、`Enum` 或接口（请参见 第 6 章）：\n\n```\nObject\
  \ obj = . . .;\nString description = switch (obj)\n   {\n      case DayOfWeek.FRIDAY\
  \ -> \"TGIF\"; // Ok\n      . . .\n   };\n```\n\n### 变量作用域与穿透\n\n本节介绍了执行从一个 `case`\
  \ 穿透到下一个 `case` 时关于变量的微妙点。如果你从不使用穿透，直接跳到下一节。\n\n当类型模式或记录模式引入变量时，其作用域延伸到该 case 的结束，即使执行穿透到了下一个\
  \ case。例如，考虑以下代码段中的变量 `s`：\n\n```\nObject obj = . . .;\nswitch (obj)\n{\n   case\
  \ String s when s.length() == 0: System.out.println(\"empty string\"); // 范围在此结束\n\
  \   default: System.out.println(obj.toString());\n}\n```\n\n你可以在守卫句和冒号后面的语句中使用 `s`，但不能在下一个\
  \ case 中使用。这是合理的，因为当 `obj` 不是 `String` 时，执行可能会从该 case 开始。\n\n你不能穿透到类型模式：\n\n```\n\
  switch (obj)\n{\n   case String s when s.length() > 0: System.out.println(s.codePointAt(0));\
  \ // Fallthrough\n   case Integer n: System.out.println(n); // ERROR\n   . . .\n\
  }\n```\n\n如果执行从第一个 case 穿透到第二个 case 的体，`n` 将无法绑定。\n\n你*可以*穿透到带有未命名变量的类型模式（Java 21\
  \ 的预览特性）：\n\n```\nswitch (obj)\n{\n   case String s when s.length() == 0: System.out.print(\"\
  empty \"); // Fallthrough\n   case String _: System.out.println(\"string\"); break;\
  \ // Ok\n   . . .\n}\n```\n\n自 Java 1.0 以来，在 case 的体中声明变量一直是合法的。该变量的作用域延伸到 `switch`\
  \ 的结束。这种作用域从未是有用过，因为如果你在 case 之外访问该变量，会导致错误：\n\n```\nswitch (obj) {\n   case String\
  \ s:\n      String t = s; // OK\n   default:\n      System.out.println(t); // ERROR—t\
  \ 可能未被初始化\n}\n```\n\n[](#index.xhtml_TypePatternTest) 和 [](#index.xhtml_RecordPatternTest)\
  \ 中的程序演示了类型模式和记录模式的模式匹配。\n\n`patternMatching/TypePatternTest.java`\n\n```\npackage\
  \ patternMatching;\n```\n\n```\npublic class TypePatternTest\n```\n\n```\n{\n```\n\
  \n```\n public static void main(String[] args)\n```\n\n\n\n当你的程序运行时，Java 运行时系统始终对所有对象维护所谓的*运行时类型识别*（runtime\
  \ type identification）。这些信息跟踪了每个对象所属的类。虚拟机使用这些运行时类型信息来选择执行正确的方法。\n\n然而，你也可以通过操作特殊的\
  \ Java 类来访问这些信息。持有这些信息的类听起来有点让人困惑，被称为 `Class`。`Object` 类中的 `getClass()` 方法返回一个 `Class`\
  \ 类型的实例。\n\n```\nEmployee e;\n. . .\nClass cl = e.getClass();\n```\n\n就像 `Employee`\
  \ 对象描述特定员工的属性一样，`Class` 对象也描述特定类的属性。`Class` 最常用的方法可能是 `getName`。它返回类的名称。例如，该语句：\n\
  \n```\nSystem.out.println(e.getClass().getName() + \" \" + e.getName());\n```\n\n\
  会打印\n\n```\nEmployee Harry Hacker\n```\n\n如果 `e` 是一个员工，或者\n\n```\nManager Harry\
  \ Hacker\n```\n\n如果 `e` 是一个经理。\n\n如果类位于某个包中，则包名是类名的一部分：\n\n```java\nvar in = new\
  \ Scanner(System.in);\nClass cl = in.getClass();\nString className = cl.getName();\
  \ // name 被设置为 \"java.util.Scanner\"\n```\n\n你可以使用静态方法 `forName` 获取与类名对应的 `Class`\
  \ 对象。\n\n```java\nString className = \"java.util.Scanner\";\nClass cl = Class.forName(className);\n\
  ```\n\n如果类名存储在运行时变化的字符串中，请使用此方法。如果 `className` 是类或接口的，则此方法有效。否则，`forName` 方法会抛出一个*检查异常*（checked\
  \ exception）。请参见 [#index.xhtml_ch05lev2sec15]了解如何在在使用此方法时提供*异常处理器*（exception handler）。\n\
  \n获取 `Class` 类型对象的第三种方法是一种方便的简写。如果 `T` 是任何 Java 类型（或 `void` 关键字），那么 `T.class` 就是匹配的类对象。例如：\n\
  \n```java\nClass cl1 = Scanner.class; // 如果导入了 java.util.*;\nClass cl2 = int.class;\n\
  Class cl3 = Double[].class;\n```\n\n注意，`Class` 对象实际上描述的是一个*类型*，该类型可能是类，也可能不是。例如，`int`\
  \ 不是一个类，但 `int.class` 仍然是一个 `Class` 类型的对象。\n\n`Class` 类实际上是一个泛型类。例如，`Employee.class`\
  \ 的类型是 `Class<Employee>`。在本章中，我不会深究这个问题，因为这会让已经抽象的概念变得更加复杂。对于大多数实际用途，你可以忽略类型参数并使用原始\
  \ `Class` 类型。有关 `Class` 类型参数的更多信息，请参见第八章。\n\n由于历史原因，`getName` 方法为数组类型返回了一些奇怪的名字：\n\
  \n* `Double[].class.getName()` 返回 `\"[Ljava.lang.Double;\"`。\n* `int[].class.getName()`\
  \ 返回 `\"[I\"`。\n\n虚拟机为每个类型管理一个唯一的 `Class` 对象。因此，你可以使用 `==` 运算符来比较类对象。例如：\n\n```java\n\
  if (e.getClass() == Employee.class) . . .\n```\n\n如果 `e` 是 `Employee` 的实例，则该测试通过。与条件\
  \ `e instanceof Employee` 不同，如果 `e` 是子类（如 `Manager`）的实例，则该测试失败。\n\n你预期枚举中的实例的类应该是枚举类。通常情况下，这是\
  \ true：\n\n```java\npublic enum Size { SMALL, MEDIUM, LARGE, EXTRA_LARGE; }\nSize.SMALL.getClass()\
  \ == Size.class // true\n```\n\n然而，如果你在实例中重写了方法，那么它就属于不同的类：\n\n```java evenpublic\
  \ enum Size\n{\n   SMALL,\n   MEDIUM,\n   LARGE,\n   EXTRA_LARGE\n   {\n      public\
  \ String toString() { return \"XL\"; }\n   };\n}\n\nSize.EXTRA_LARGE.getClass()\
  \ == Size.class // false\n```\n\n如果你有一个 `Class` 类型的对象，可以使用它来构造该类的实例。调用 `getConstructor`\
  \ 方法获取一个 `Constructor` 类型的对象，然后使用 `newInstance` 方法来构造实例。例如：\n\n```java\nvar className\
  \ = \"java.util.Date\"; // 或任何其他带有无参构造函数的类名\nClass cl = Class.forName(className);\n\
  Object obj = cl.getConstructor().newInstance();\n```\n\n如果类没有无参数的构造函数，`getConstructor`\
  \ 方法将抛出异常。你将在 [#index.xhtml_ch05lev2sec19] 中看到如何调用其他构造函数。\n\n存在 `Class.newInstance`\
  \ 方法也可以用无参构造函数构造实例。然而，由于一个微妙的原因，它被弃用了。构造函数中抛出的任何异常都会原样抛出。对于检查异常，这违反了编译时检查。相比之下，`Constructor.newInstance`\
  \ 将任何构造函数异常封装在 `InvocationTargetException` 中。\n\n`newInstance` 方法对应于 C++ 中的*虚构造*（virtual\
  \ constructor）用法。然而，C++ 中的虚构造并不是语言特性，而是一种需要由特殊库支持的用法。`Class` 类类似于 C++ 中的 `type_info`\
  \ 类，`getClass` 方法等同于 `typeid` 运算符。尽管 Java 的 `Class` 比 `type_info` 通用得多。C++ 的 `type_info`\
  \ 只能显示类型名称的字符串，而不能创建该类型的新对象。\n\n### `java.lang.Class` 1.0\n\n* `static Class forName(String\
  \ className)`\n  返回表示名为 `className` 的类的 `Class` 对象。\n* `Constructor getConstructor(Class...\
  \ parameterTypes)` 1.1\n  产生一个描述具有给定参数类型的构造函数的对象。请参见 [#index.xhtml_ch05lev2sec19]获取有关如何提供参数类型的更多信息。\n\
  \n### `java.lang.reflect.Constructor` 1.1\n\n* `Object newInstance(Object... initargs)`\n\
  \  构造构造函数声明类的新实例，并将 `initargs` 传递给构造函数。请参见 [#index.xhtml_ch05lev2sec19]获取有关如何提供参数的更多信息。\n\
  \n### `java.lang.Throwable` 1.0\n\n* `void printStackTrace()`\n  将 `Throwable` 对象和堆栈跟踪打印到标准错误流。\n\
  \n### 异常原理\n\n我将在第七章详细介绍异常处理，但在此期间你会遇到可能会抛出异常的方法。\n\n当运行时发生错误时，程序可以“抛出异常”。抛出异常比终止程序更灵活，因为你可以提供一个*处理器*（handler）来“捕获”并处理异常。\n\
  \n如果你不提供处理器，程序将终止并在控制台上打印一条消息，给出异常的类型。你可能已经在意外使用 `null` 引用或越界数组边界时见过异常报告。\n\n异常有两种类型：*未检查异常*（unchecked\
  \ exceptions）和*检查异常*（checked exceptions）。对于检查异常，编译器会检查你（程序员）是否知道该异常并准备好处理后果。然而，许多常见异常（边界错误或访问\
  \ `null` 引用是未检查异常。编译器并不预期你提供处理器——毕竟，你应该把精力放在避免这些错误，而不是为它们编写处理器。\n\n但并不是所有错误都是避免的。如果尽管你尽力仍发生异常，大多数\
  \ Java API 都会抛出检查异常。一个例子是 `Class.forName` 方法。你无法确保指定的类是否存在。在第七章中，你将看到几种异常处理策略。现在，我只展示最简单的策略。\n\
  \n当方法包含可能抛出检查异常的语句时，在方法名中添加 `throws` 子句。\n\n```java\npublic static void doSomethingWithClass(String\
  \ name)\n      throws ReflectiveOperationException\n{\n   Class cl = Class.forName(name);\
  \ // 可能抛出异常\n   do something with cl\n}\n```\n\n\n\n\n任何调用此方法的也也需要一个 `throws` 声明。这包括\
  \ `main` 方法。如果实际上发生了异常，`main` 方法将带有一个堆栈跟踪并终止。（你将在第 7 章中学习如何捕获异常，而不是让它们终止你的程序。）\n\
  \n你只需要为检查异常（checked exceptions）提供 `throws` 子句。找出哪些方法抛出检查异常是很容易的——每当你调用一个可能抛出检查异常的方法而没有提供处理器时，编译器就会报错。\n\
  \n## 资源\n\n类通常具有关联的数据文件，例如：\n\n* 图像和声音文件\n* 带有消息字符串和按钮标签的文本文件\n\n在 Java 中，这种关联文件被称为\
  \ `resource`（资源）。\n\n例如，考虑一个显示诸如 图 所示消息的对话框。\n\n![Figure](img/ResourceTest.jpg)显示图像和文本资源\n\
  \n当然，面板中的书名和版权年份会在书的下一版本中更改。为了方便跟踪这些变化，我们将文本放在一个文件中，而不是将其硬编码为字符串。\n\n但是，你应该将像 `about.txt`\
  \ 这样的文件放在哪里呢？当然，简单地将其与程序的其余文件一起放在一个 JAR 文件中是方便的。\n\n`Class` 类提供了用于定位资源文件的有用服务。以下是必要的步骤：\n\
  \n1. 获取拥有资源的类的 `Class` 对象——例如，`ResourceTest.class`。\n2. 某些方法（例如 `ImageIcon` 类的 `getImage`\
  \ 方法）接受用于描述资源位置的 `URL`。然后你调用：\n\n```\nURL url = cl.getResource(\"about.png\");\n\
  ```\n3. 否则，使用 `getResourceAsStream` 方法获取用于读取文件中数据的输入流。\n\n点在于，Java 虚拟机知道如何定位类，因此它随后可以在相同的位置搜索关联的资源。例如，假设\
  \ `ResourceTest` 类在包 `resources` 中。那么 `ResourceTest.class` 文件位于 `resources` 目录，你将一个图标文件放在同一个目录中。\n\
  \n与其将资源文件放在与类文件相同的目录中，你可以提供相对路径或绝对路径，例如：\n\n```\ndata/about.txt\n/corejava/title.txt\n\
  ```\n\n自动加载文件就是资源加载功能所做的所有工作。没有标准方法来解释资源文件的内容。每个程序必须有自己的方式来其资源文件。\n\n资源的另一个常见应用是程序的国际化。依赖语言的字符串（如消息和用户界面标签）存储在资源文件中，每个语言一个文件。在第二卷第\
  \ 7 章中讨论的国际化 API 提供了一种组织和访问这些本地化文件的标准方法。\n\n[](#index.xhtml_ch10ex02)是一个演示资源加载的程序。（不要担心读取文本和显示对话框的代码——我们稍后会介绍这些细节。）编译、构建\
  \ JAR 文件并执行它：\n\n```\njavac resources/ResourceTest.java\njar cvfe ResourceTest.jar\
  \ resources.ResourceTest \\\n   resources/*.class resources/*.gif resources/data/*.txt\
  \ corejava/*.txt\njava -jar ResourceTest.jar\n```\n\n将 JAR 文件移动到不同的目录并再次运行它，以检查程序是从\
  \ JAR 文件而不是从当前目录读取资源文件的。\n\n`resources/ResourceTest.java`\n\n```java\npackage resources;\n\
  import java.io.*;\nimport java.net.*;\nimport javax.swing.*;\n\n/**\n * @version\
  \ 1.51 2023-08-16\n * @author Cay Horstmann\n */\npublic class ResourceTest\n{\n\
  \    public static void main(String[] args) throws IOException\n    {\n        Class\
  \ cl = ResourceTest.class;\n        URL aboutURL = cl.getResource(\"about.gif\"\
  );\n        var icon = new ImageIcon(aboutURL);\n        InputStream stream = cl.getResourceAsStream(\"\
  data/about.txt\");\n        var about = new String(stream.readAllBytes());\n   \
  \     InputStream stream2 = cl.getResourceAsStream(\"/corejava/title.txt\"); \n\
  \        var title = new String(stream2.readAllBytes()).strip();\n        JOptionPane.showMessageDialog(null,\
  \ about, title, JOptionPane.INFORMATION_MESSAGE, icon);\n    }\n}\n```\n\n`java.lang.Class`\
  \ 1.0\n\n* `URL getResource(String name)` 1.1\n* `InputStream getResourceAsStream(String\
  \ name)` 1.1\n  在类相同的地方查找资源，然后返回一个你可以用于加载资源的 `URL` 或输入流。如果找不到资源，则返回 `null`，因此不会为\
  \ I/O 错误抛出异常。\n\n## 使用反射分析类的能力\n\n这里是反射机制最重要部分的简要概述，允许你检查类的结构。\n\n`java.lang.reflect`\
  \ 包中的 `Field`、`Method` 和 `Constructor` 三个类分别描述类的字段、方法和构造函数。这三个类都有一个名为 `getName`\
  \ 的方法，返回项的名称。`Field` 类有一个 `getType` 方法，返回一个对象（同样是 `Class` 类型），描述字段类型。`Method` 和\
  \ `Constructor` 类有报告参数类型的方法，`Method` 类还报告返回类型。\n\n这三个类还有一个名为 `getModifiers` 的方法，它返回一个整数（其中某些位被开启或关闭），描述所使用的修饰符，如\
  \ `public` 和 `static`。你随后可以使用 `Modifier` 类中的静态方法来分析 `getModifiers` 返回的整数。使用 `Modifier`\
  \ 类中的 `isPublic`、`isPrivate` 或 `isFinal` 等方法来判断方法或构造函数是否为 `public`、`private` 或 `final`。你只需要让\
  \ `Modifier` 类中的相应的方法对 `getModifiers` 返回的整数进行操作即可。\n\n或者，`accessFlags` 方法返回 `AccessFlag`\
  \ 枚举的值集。例如，这里是你可以测试一个方法是否是静态的：\n\n```\nif (Modifiers.isStatic(m.getModifiers()))\
  \ . . .\nif (m.accessFlags().contains(AccessFlag.STATIC)) . . .\n```\n\n`Class`\
  \ 类的 `getFields`、`getMethods` 和 `getConstructors` 方法返回类支持的所有公共字段、方法和构造函数的数组。这包括父类的公共成员。`Class`\
  \ 类的 `getDeclaredFields`、`getDeclaredMethods` 和 `getDeclaredConstructors` 方法返回由类声明的所有字段、方法和构造函数的数组。这包括私有的、包级和保护成员，以及包访问成员，但不包括父类的成员。\n\
  \n[](#index.xhtml_ch05ex06)展示了如何打印有关类的所有信息。程序提示你输入类名，并输出类所有方法和构造函数的签名，以及类所有实例字段的名称。例如，如果你输入\n\
  \n```\njava.lang.Double\n```\n\n程序打印\n\n\n\n\n```java\npublic final class java.lang.Double\
  \ extends java.lang.Number\n{\n   public java.lang.Double(double);\n   public java.lang.Double(java.lang.String);\n\
  \n   public boolean equals(java.lang.Object);\n   public static java.lang.String\
  \ toString(double);\n   public java.lang.String toString();\n   public static int\
  \ hashCode(double);\n   public int hashCode();\n   public static double min(double,\
  \ double);\n   public static double max(double, double);\n   public static native\
  \ long doubleToRawLongBits(double);\n   public static long doubleToLongBits(double);\n\
  \   public static native double longBitsToDouble(long);\n   public int compareTo(java.lang.Double);\n\
  \   public volatile int compareTo(java.lang.Object);\n   public static int compare(double,\
  \ double);\n   public byte byteValue();\n   public short shortValue();\n   public\
  \ int intValue();\n   public long longValue();\n   public float floatValue();\n\
  \   public double doubleValue();\n   public static java.lang.Double valueOf(java.lang.String);\n\
  \   public static java.lang.Double valueOf(double);\n   public static java.lang.String\
  \ toHexString(double);\n   public volatile java.lang.Object resolveConstantDesc(\n\
  \      java.lang.invoke.MethodHandles$Lookup);\n   public java.lang.Double resolveConstantDesc(java.lang.invoke.MethodHandles$Lookup);\n\
  \   public java.util.Optional describeConstable();\n   public boolean isNaN();\n\
  \   public static boolean isNaN(double);\n   public static double sum(double, double);\n\
  \   public boolean isInfinite();\n   public static boolean isInfinite(double);\n\
  \   public static boolean isFinite(double);\n   public static double parseDouble(java.lang.String);\n\
  \n   public static final double POSITIVE_INFINITY;\n   public static final double\
  \ NEGATIVE_INFINITY;\n   public static final double NaN;\n   public static final\
  \ double MAX_VALUE;\n   public static final double MIN_NORMAL;\n   public static\
  \ final double MIN_VALUE;\n   public static final int MAX_EXPONENT;\n   public static\
  \ final int MIN_EXPONENT;\n   public static final int SIZE;\n   public static final\
  \ int BYTES;\n   public static final java.lang.Class TYPE;\n   private final double\
  \ value;\n   private static final long serialVersionUID;\n}\n```\n\n这个程序的非凡之处在于，它可以分析\
  \ Java 解释器可以加载的任何类，而不仅仅是程序编译时可用的类。我们将在下一章中使用这个程序来查看 Java 编译器自动生成的内部类。\n\n`reflection/ReflectionTest.java`\n\
  \n```java\npackage reflection;\n\nimport java.util.*;\nimport java.lang.reflect.*;\n\
  \n/**\n * 此程序使用反射来打印类的所有特征。\n * @version 1.12 2021-06-15\n * @author Cay Horstmann\n\
  \ */\npublic class ReflectionTest\n{\n  public static void main(String[] args)\n\
  \  throws ReflectiveOperationException \n  {\n    // 从命令行参数或用户输入读取类名\n    String\
  \ name;\n    if (args.length > 0) name = args[0];\n    else\n    {\n      var in\
  \ = new Scanner(System.in);\n      System.out.println(\"请输入类名（例如 java.util.Date）：\
  \ \");\n      name = in.next();\n    }\n    // 打印类的修饰符、名称和父类名（如果不是 Object）\n   \
  \ Class cl = Class.forName(name);\n    String modifiers = Modifier.toString(cl.getModifiers());\n\
  \    if (modifiers.length() > 0) System.out.print(modifiers + \" \");\n    if (cl.isSealed())\n\
  \      System.out.print(\"sealed \");\n    if (cl.isEnum())\n      System.out.print(\"\
  enum \" + name);\n    else if (cl.isRecord())\n      System.out.print(\"record \"\
  \ + name);\n    else if (cl.isInterface())\n      System.out.print(\"interface \"\
  \ + name);\n    else\n      System.out.print(\"class \" + name);\n    Class supercl\
  \ = cl.getSuperclass();\n    if (supercl != null && supercl != Object.class) System.out.print(\"\
  \ extends \"\n      + supercl.getName());\n    printInterfaces(cl);\n    printPermittedSubclasses(cl);\n\
  \    System.out.print(\"\\n{\\n\");\n    printConstructors(cl);\n    System.out.println();\n\
  \    printMethods(cl);\n    System.out.println();\n    printFields(cl);\n    System.out.println(\"\
  }\");\n  }\n\n  /**\n   * 打印类的所有构造函数\n   * @param cl 一个类\n   */\n  public static\
  \ void printConstructors(Class cl)\n  {\n    Constructor[] constructors = cl.getDeclaredConstructors();\n\
  \    for (Constructor c : constructors)\n    {\n      String name = c.getName();\n\
  \      System.out.print(\"   \");\n      String modifiers = Modifier.toString(c.getModifiers());\n\
  \      if (modifiers.length() > 0) System.out.print(modifiers + \" \"); \n     \
  \ System.out.print(name + \"(\");\n      // 打印参数类型\n      Class[] paramTypes = c.getParameterTypes();\n\
  \      for (int j = 0; j < paramTypes.length; j++)\n      {\n        if (j > 0)\
  \ System.out.print(\", \");\n        System.out.print(paramTypes[j].getName());\n\
  \      }\n      System.out.println(\")\");\n    }\n  }\n\n  /**\n   * 打印类的所有方法\n\
  \   * @param cl 一个类\n   */\n  public static void printMethods(Class cl)\n  {\n \
  \   Method[] methods = cl.getDeclaredMethods();\n    for (Method m : methods)\n\
  \    {\n      Class retType = m.getReturnType();\n      String name = m.getName();\n\
  \      System.out.print(\"   \");\n      // 打印修饰符、返回类型和名称\n      String modifiers\
  \ = Modifier.toString(m.getModifiers());\n      if (modifiers.length() > 0) System.out.print(modifiers\
  \ + \" \");\n      System.out.print(retType.getName() + \" \" + name + \"(\");\n\
  \      // 打印参数类型\n      Class[] paramTypes = m.getParameterTypes();\n      for (int\
  \ j = 0; j < paramTypes.length; j++)\n      {\n        if (j > 0) System.out.print(\"\
  , \");\n        System.out.print(paramTypes[j].getName());\n      }\n      System.out.println(\"\
  )\");\n    }\n  }\n\n  /**\n   * 打印类的所有字段\n   * @param cl 一个类\n   */\n  public static\
  \ void printFields(Class cl)\n  {\n    Field[] fields = cl.getDeclaredFields();\n\
  \    for (Field f : fields)\n    {\n      Class type = f.getType();\n      String\
  \ name = f.getName();\n      System.out.print(\"   \");\n      String modifiers\
  \ = Modifier.toString(f.getModifiers());\n      if (modifiers.length() > 0) System.out.print(modifiers\
  \ + \" \");\n      System.out.println(type.getName() + \" \" + name + \";\");\n\
  \    }\n  }\n\n  /**\n   * 打印类直接实现的接口\n   * @param cl 一个类\n   */\n  public static\
  \ void printInterfaces(Class cl)\n  {\n    Class<?>[] interfaces = cl.getInterfaces();\n\
  \    for (int i = 0; i < interfaces.length; i++)\n    {\n      if (i == 0)\n   \
  \     System.out.print(cl.isInterface() ? \" extends \" : \" implements \");\n \
  \     else\n        System.out.print(\", \");\n      System.out.print(interfaces[i].getName());\n\
  \    }\n  }\n\n  /**\n   * 打印密封类的所有允许子类\n   * @param cl 一个类\n   */\n  public static\
  \ void printPermittedSubclasses(Class cl)\n  {\n    if (cl.isSealed())\n    {\n\
  \      Class<?>[] permittedSubclasses = cl.getPermittedSubclasses();\n      for\
  \ (int i = 0; i < permittedSubclasses.length; i++)\n      {\n        if (i == 0)\n\
  \          System.out.print(\" permits \");\n        else\n          System.out.print(\"\
  , \");\n        System.out.print(permittedSubclasses[i].getName());\n      }\n \
  \   }\n  }\n}\n```\n\n\n\n\n`getFields` 返回一个包含此类或其父类公共字段的 `Field` 对象数组；`getDeclaredFields`\
  \ 返回一个包含此类所有字段的 `Field` 对象的数组。如果没有此类字段，或者 `Class` 对象表示基本数据类型或数组类型，则这些方法返回一个长度为 0\
  \ 的数组。\n\n* `Method[] getMethods()` 1.1\n* `Method[] getDeclaredMethods()` 1.1\n\
  \  返回一个包含 `Method` 对象的数组：`getMethods` 返回公共方法并包括继承的方法；`getDeclaredMethods` 返回此类或接口的所有方法，但不包括继承的方法。\n\
  \n* `Constructor[] getConstructors()` 1.1\n* `Constructor[] getDeclaredConstructors()`\
  \ 1.1\n  返回一个包含 `Constructor` 对象的数组，该数组提供了由此 `Class` 对象表示的类的所有公共构造函数（针对 `getConstructors`）或所有构造函数（针对\
  \ `getDeclaredConstructors`）。\n\n* `isInterface()`\n  如果此 `Class` 对象描述一个 `interface`（接口），则返回\
  \ `true`。（接口请参见第 6 章` 1.5\n  如果此 `Class` 对象描述一个 `enum`（枚举），则返回 `true`。\n\n* `isRecord()`\
  \ 16\n  如果此 `Class` 对象描述一个 `record`，则返回 `true`。\n\n* `RecordComponent[] getRecordComponents()`\
  \ 16\n  返回一个 `RecordComponent` 对象的数组，用于描述 record 字段；如果此类不是 record，则返回 `null`。\n\n\
  * `String getPackageName()` 9\n  获取包含该类型的包名；如果该类型是数组类型，则获取元素类型的包；如果该类型是基本数据类型，则返回\
  \ `\"java.lang\"`。\n\n`java.lang.reflect.Field` 1.1\n`java.lang.reflect.Method`\
  \ 1.1\n`java.lang.reflect.Constructor` 1.1\n\n* `Class getDeclaringClass()`\n  返回定义此构造函数、方法或字段的类的\
  \ `Class` 对象。\n* `Class[] getExceptionTypes()`（在 `Constructor` 和 `Method` 类中）\n\
  \  返回一个表示方法抛出的异常类型的 `Class` 对象的数组。\n* `int getModifiers()`\n  返回一个描述此构造函数、方法或字段修饰符的整数。使用\
  \ `Modifier` 类中的方法分析返回值。\n* `Set<AccessFlag> accessFlags()` 20\n  返回一个 `AccessFlag`\
  \ 枚举值的集合，用于描述此构造函数、方法或字段的访问修饰符。\n* `String getName()`\n  返回表示构造函数、方法或字段名称的字符串。\n\
  * `Class[] getParameterTypes()`（在 `Constructor` 和 `Method` 类中）\n  返回一个表示参数类型的 `Class`\
  \ 对象的数组。\n* `Class getReturnType()`（在 `Method` 类中）\n  返回一个表示返回类型的 `Class` 对象。\n\n\
  `java.lang.reflect.RecordComponent` 16\n\n* `String getName()`\n* `Class getType()`\n\
  \  获取此 record 组件的名称和类型。\n* `Method getAccessor()`\n  返回用于访问此 record 组件的 `Method`\
  \ 对象。\n\n`java.lang.reflect.Modifier` 1.1\n\n* `static String toString(int modifiers)`\n\
  \  返回一个字符串，其修饰符与 `modifiers` 中设置的位相对应。\n* `static boolean isAbstract(int modifiers)`\n\
  * `static boolean isFinal(int modifiers)`\n* `static boolean isInterface(int modifiers)`\n\
  * `static boolean isNative(int modifiers)`\n* `static boolean isPrivate(int modifiers)`\n\
  * `static boolean isProtected(int modifiers)`\n* `static boolean isPublic(int modifiers)`\n\
  * `static boolean isStatic(int modifiers)`\n* `static boolean isStrict(int modifiers)`\n\
  * `static boolean isSynchronized(int modifiers)`\n* `static boolean isVolatile(int\
  \ modifiers)`\n  测试 `modifiers` 值中与方法名中的修饰符相对应的位。\n\n### 使用反射在运行时分析对象\n\n在前面的节中，我们已经了如何获取任何对象的实例字段的*名称*和*类型*：\n\
  \n* 获取相应的 `Class` 对象。\n* 在 `Class` 对象上调用 `getDeclaredFields`。\n\n在本节中，我们将更进一步，实际上查看字段的*内容*。当然，当在编写程序时，查看已知名称和类型的对象的特定字段内容是很容易的。但反射让你能够查看在编译时并未知的对象的字段。\n\
  \n实现此点的关键方法是 `Field` 类中的 `get` 方法。如果 `f` 是 `Field` 类型的对象（例如，从 `getDeclaredFields`\
  \ 获取的对象），且 `obj` 是 `f` 字段所属的类的对象，那么 `f.get(obj)` 返回一个对象，其值是 `obj` 字段的当前值。这听起来有点抽象，让我们来看一个例子。\n\
  \n```\nvar harry = new Employee(\"Harry Hacker\", 50000, 10, 1, 1989);\nClass cl\
  \ = harry.getClass();\n   // 代表 Employee 的类对象\nField f = cl.getDeclaredField(\"\
  name\");\n   // Employee 类的 name 字段\nObject v = f.get(harry);\n   // harry 对象中 name\
  \ 字段的值，即 \n   // \"Harry Hacker\"\n```\n\n当然，你也可以设置值。`f.set(obj, value)` 将 `obj`\
  \ 对象的 `f` 字段设置为新值。\n\n实际上，这段代码存在问题。由于 `name` 字段是私有字段，`get` 和 `set` 方法将抛出 `IllegalAccessException`。反射机制允许你发现对象拥有字段，但除非你有权限，否则无法读取和写入这些字段。\n\
  \n反射的默认行为遵循访问控制。然而，你可以通过对 `Field`、`Method` 或 `Constructor` 对象调用 `setAccessible`\
  \ 方法来覆盖访问控制。例如：\n\n```\nf.setAccessible(true); // 现在可以调用 f.get(harry)\n```\n\n`setAccessible`\
  \ 方法是 `AccessibleObject` 类的方法，该类是 `Field`、`Method` 和 `Constructor` 的公共超类。该功能为调试器、持久存储和类似机制提供的。我们稍后将在通用\
  \ `toString` 方法中使用它。\n\n如果没有授权，调用 `setAccessible` 会出异常。访问会被模块系统（第 12 章）或安全管理器（卷二第\
  \ 9 章）拒绝。使用安全管理器并不常见，并且从 Java 17 开始已弃用。\n\n例如，本节最后的示例程序查看了 `ArrayList` 和 `Integer`\
  \ 对象的内部。当你在 Java 9 到 16 上运行它时，会出现以下警告信息：\n\n```\nWARNING: 发生了非法反射访问操作\nWARNING:\
  \ objectAnalyzer.ObjectAnalyzer (file:/home/cay\n   /books/cj11/code/v1ch05/bin/)\
  \ 访问字段 java.util.ArrayList.serialVersionUID\nWARNING: 请考虑 objectAnalyzer.ObjectAnalyzer\
  \ 的维护者报告此问题\nWARNING: 使用 --illegal-access=warn 以启用进一步警告\nWARNING: 所有非法访问将在未来的版本中被拒绝\n\
  ```\n\n当你在 Java 17 上运行程序时，会发生 `InaccessibleObjectException` 异常。\n\n为了让程序继续运行，向“未命名模块”开放\
  \ `java.base` 模块中的 `java.util` 和 `java.lang` 包。详情见第 12 章。语法如下：\n\n```\njava --add-opens\
  \ java.base/java.util=ALL-UNNAMED \\\n   --add-opens java.base/java.lang=ALL-UNNAMED\
  \ \\\n   objectAnalyzer.ObjectAnalyzerTest\n```\n\n\n\n\n未来的库可能会使用 `variable handles`（变量句柄）而不是反射来读取和写入字段。`VarHandle`\
  \ 类似于 `Field`。你可以使用它来读取或写入特定类中任何实例的特定字段。然而，为了获取一个 `VarHandle`，库代码需要一个 `Lookup` 对象：\n\
  \n```java\npublic Object getFieldValue(Object obj, String fieldName, Lookup lookup)\n\
  \      throws NoSuchFieldException, IllegalAccessException \n{\n   Class cl = obj.getClass();\n\
  \   Field field = cl.getDeclaredField(fieldName);\n   VarHandle handle = MethodHandles.privateLookupIn​(cl,\
  \ lookup)\n      .unreflectVarHandle(field);\n   return handle.get(obj);\n}\n```\n\
  \n只要 `Lookup` 对象是在具有访问字段权限的模块中生成的，这种方法就能生效。模块中的某些方法简单地调用 `MethodHandles.lookup()`，它会产生一个封装了调用者访问权限的对象。通过这种方式，一个模块可以赋予另一个模块访问私有成员的权限。实际问题在于，如何以最少的麻烦授予这些权限。\n\
  \n虽然我们仍然可以这样做，但让我们来看一个适用于 `any` 类的通用 `toString` 方法（参见 []](#index.xhtml_ch05ex07)）。通用的\
  \ `toString` 方法使用 `getDeclaredFields` 获取所有实例字段，并使用 `setAccessible` 方便方法使所有字段变得可访问。对于每个字段，它都会获取名称和值。每个值都通过递归调用\
  \ `toString` 转换为字符串。\n\n通用的 `toString` 方法需要处理一些复杂性。引用循环可能会导致无限递归。因此，`ObjectAnalyzer`\
  \ 会跟踪已经访问过的对象。此外，要查看数组内部结构，你需要一种不同的方法。你将在下一节中学习相关细节。\n\n你可以使用这个 `toString` 方法来查看任何对象的内部。例如，以下调用\n\
  \n```java\nvar squares = new ArrayList<Integer>();\nfor (int i = 1; i <= 5; i++)\
  \ squares.add(i * i);\nSystem.out.println(new ObjectAnalyzer().toString(squares));\n\
  ```\n\n会产生如下输出：\n\n```\njava.util.ArrayList[elementData=class java.lang.Object[]{java.lang.Integer[value=1][][],\n\
  java.lang.Integer[value=4][][],java.lang.Integer[value=9][][],\n   java.lang.Integer[value=16][][],\n\
  java.lang.Integer[value=25][][],null,null,null,null,null},size=5][modCount=5][][]\n\
  ```\n\n你可以使用这个通用的 `toString` 方法来实现你自己的类的 `toString` 方法，如下所示：\n\n```java\npublic\
  \ String toString()\n{\n   return new ObjectAnalyzer().toString(this);\n}\n```\n\
  \n这是一个提供通用 `toString` 方法的省力且无疑非常有用的方法。然而，在你对再也不需要实现 `toString` 感到兴奋之前，记住对内部的访问不受控的。\n\
  \n### objectAnalyzer/ObjectTest.java\n\n```java\npackage objectAnalyzer;\n\nimport\
  \ java.util.*;\n\n/**\n * 此程序使用反射来观察对象\n * @version 1.13-16\n * @author Caymann\n\
  \ */\npublic class ObjectTest\n{\n    public static void main(String[] args)\n \
  \   throws ReflectiveException\n    {\n        var squares = new ArrayList<Integer>();\n\
  \        for (int i = 1; i <= 5; i++) squares.add(i * i);\n        System.out.println(new\
  \ ObjectAnalyzer().toString(squares));\n    }\n}\n```\n\n### objectAnalyzer/ObjectAnalyzer.java\n\
  \n```java\npackage objectAnalyzer;\n\nimport java.lang.reflect.AccessibleObject;\n\
  import java.lang.reflect.Array;\nimport java.lang.reflect.Field;\nimport java.lang.reflect.Modifier;\n\
  import java.util.ArrayList;\n\npublic class ObjectAnalyzer\n{\n    private ArrayList<Object>\
  \ visited = new ArrayList<>();\n\n    /**\n     * 将对象转换为列出所有字段的字符串\n     * @param\
  \ obj 对象\n     * @return 对象的类名和所有字段值的字符串\n     */\n    public String toString(Object\
  \ obj)\n    throws ReflectiveException\n    {\n        if (obj == null) return \"\
  null\";\n        if (visited.contains(obj)) return \"...\";\n        visited.add(obj);\n\
  \        Class cl = obj.getClass();\n        if (cl == String.class) return (String)\
  \ obj;\n        if (cl.isArray())\n        {\n            String r = cl.getComponentType()\
  \ + \"[]{\";\n            for (int i = 0; i < Array.getLength(obj); i++)\n     \
  \       {\n                if (i > 0) r += \",\";\n                Object val =\
  \ Array.get(obj, i);\n                if (val == null) r += \"null\";\n        \
  \        else r += val.toString();\n            }\n            return r + \"]\"\
  ;\n        }\n        String r = cl.getName() + \" {\";\n        Field[] fields\
  \ = cl.getDeclaredFields();\n        for (Field f : fields)\n        {\n       \
  \     if (Modifier.isStatic(f.getModifiers())) continue;\n            f.setAccessible(true);\n\
  \            r += \"\\n  \" + f.getName() + \"=\"=\" + f.get(obj);\n        }\n\
  \        return r + \"\\n}\";\n    }\n}\n```\n\n### 使用反射编写泛型数组代码\n\n`java.lang.reflect`\
  \ 包中的 `Array` 类允许你动态创建数组。这被用于 `Arrays` 类中 `copyOf` 方法的实现。\n\n```java\nvar a = new\
  \ Employee[100];\n. . .\n// 数组已满\na = Arrays.copyOf(a, 2 * a.length);\n```\n\n如何写出这样一个泛型方法呢？`Employee[]`\
  \ 数组可以转换为 `Object[]` 数组是有帮助的。这看起来很有前景。这是第一次尝试：\n\n```java\npublic static Object[]\
  \ badCopyOf(Object[] a, int newLength) // 没用\n{\n   var newArray = new Object[newLength];\n\
  \   System.arraycopy(a, 0, newArray, 0, Math.min(a.length, newLength));\n   return\
  \ newArray;\n}\n```\n\n\n\n\n对象数组 `cannot` 被强制转换为员工数组 (`Employee[]`)。虚拟机将在运行时抛出\
  \ `ClassCastException`。关键在于，正如前面提到的，Java 数组会记住其条目的类型——即用于在创建该数组的 `new` 表达式中所使用的元素类型。将\
  \ `Employee[]` 临时强制转换为 `Object[]` 数组然后再转换回来是合法的，但一个从创建之初就是 `Object[]` 数组的数组永远无法强制转换为\
  \ `Employee[]` 数组。为了编写这种泛型数组代码，我们需要能够创建一个与原数组类型`same` 的新数组。为此，我们需要 `java.lang.reflect`\
  \ 包中 `Array` 类的方法。关键是 `Array` 类中用于构造新数组的静态方法 `newInstance`。你必须将条目的类型和所需的长度作为参数传递给该方法。\n\
  \n```\nObject newArray = Array.newInstance(componentType, newLength);\n```\n\n为了实际上实现这一操作，我们需要获取新数组的长度和组件类型。\n\
  \n我们通过调用 `Array.getLength(a)` 获取长度。`Array` 类的静态方法 `getLength` 返回数组的长度。要获取新数组的组件类型：\n\
  \n1. 首先，获取 `a` 的类对象。\n2. 确认它确实是一个数组。\n3. 使用 `Class` 类的 `getComponentType` 方法（该方法仅为代表数组的类对象定义）来查找数组的类型。\n\
  4. 反之，对于任何代表类 `C` 的 `Class` 对象，`arrayType` 方法产生代表 `C[]` 的 `Class` 对象。\n\n为什么 `getLength`\
  \ 是 `Array` 的方法，而 `getComponentType` 是 `Class` 的方法？我不知道——反射方法的分布有时似乎有些随意的。\n\n以下是代码：\n\
  \n```java\npublic static Object goodCopyOf(Object a, int newLength) \n{\n   Class\
  \ cl = a.getClass();\n   if (!cl.isArray()) return null;\n   Class componentType\
  \ = cl.getComponentType();\n   int length = Array.getLength(a);\n   Object newArray\
  \ = Array.newInstance(componentType, newLength);\n   System.arraycopy(a, 0, newArray,\
  \ 0, Math.min(length, newLength));\n   return newArray;\n}\n```\n\n注意，这个 `copyOf`\
  \ 方法可以用于扩展任何类型的数组，而是对象数组。\n\n```java\nint[] a = { 1, 2, 3, 4, 5 };\na = (int[])\
  \ goodCopyOf(a, 10);\n```\n\n为了使这可行，`goodCopyOf` 的参数被声明为 `Object` 类型，`not an array\
  \ of objects` (`Object[]`)。整数数组类型 `int[]` 可以转换为 `Object`，但不能转换为对象数组！\n\n展示了这两种方法的用法。注意，对\
  \ `badCopyOf` 返回值的强制转换将抛出异常。\n\n`arrays/CopyOfTest.java`\n\n```java\npackage arrays;\n\
  \nimport java.lang.reflect.*;\nimport java.util.*;\n\n/**\n * 此程序演示了如何使用反射操作数组。\n\
  \ * @version 1.2 2012-05-04\n * @author Cay Horstmann\n */\npublic class CopyOfTest\
  \ {\n    public static void main(String[] args) {\n        int[] a = { 1, 2, 3 };\n\
  \        a = (int[]) goodCopyOf(a, 10);\n        System.out.println(Arrays.toString(a));\n\
  \n        String[] b = { \"Tom\", \"Dick\", \"Harry\" };\n        b = (String[])\
  \ goodCopyOf(b, 10);\n        System.out.println(Arrays.toString(b));\n\n      \
  \  System.out.println(\"下面的调用将产生异常。\");\n        b = (String[]) badCopyOf(b, 10);\n\
  \    }\n\n    /**\n     * 此方法尝试通过分配一个新数组并\n     *拷贝所有元素来扩展数组。\n     * @param a 需要扩展的数组\n\
  \     * @param newLength 新长度\n     * @return 一个包含 a 的所有元素的更大的数组。然而，返回的\n     * 数组类型为\
  \ Object[]，而不是与 a 相同的类型\n     */\n    public static Object[] badCopyOf(Object[]\
  \ a, int newLength) // not useful {\n        var newArray = new Object[newLength];\n\
  \        System.arraycopy(a, 0, newArray, 0, Math.min(a.length, newLength));\n \
  \       return newArray;\n    }\n\n    /**\n     * 此方法通过分配一个相同类型的新数组并\n     * 拷贝所有元素来扩展数组。\n\
  \     * @param a 需要扩展的数组\n     * @param newLength 新长度\n     * @return 一个包含 a 的所有元素的更大的数组。\n\
  \     */\n    public static Object goodCopyOf(Object a, int newLength) {\n     \
  \   Class cl = a.getClass();\n        if (!cl.isArray()) return null;\n        Class\
  \ componentType = cl.getComponentType();\n        int length = Array.getLength(a);\n\
  \        Object newArray = Array.newInstance(componentType, newLength);\n      \
  \  System.arraycopy(a, 0, newArray, 0, Math.min(length, newLength));\n        return\
  \ newArray;\n    }\n}\n```\n\n\n\n\n如何获取一个 `Method` 对象？当然，你可以调用 `getDeclaredMethods`\
  \ 并遍历返回的 `Method` 对象数组，直到找到你想要的方法。或者，你也可以调用 `Class` 类的 `getMethod` 方法。这类似于 `getField`\
  \ 方法，后者接收一个包含字段名称的字符串并返回一个 `Field` 对象。然而，可能存在多个同名方法，因此你需要小心确保获取的是正确的一个。出于这个，你还必须提供所选方法的参数类型。`getMethod`\
  \ 的签名如下：\n\n```\nMethod getMethod(String name, Class... parameterTypes)\n```\n\n\
  例如，以下是你可以如何获取 `Employee` 类中 `getName` 和 `raiseSalary` 方法指针的：\n\n```\nMethod m1 =\
  \ Employee.class.getMethod(\"getName\");\nMethod m2 = Employee.class.getMethod(\"\
  raiseSalary\", double.class);\n```\n\n使用类似的方法来调用任意构造函数。向 `Class.getConstructor`\
  \ 方法提供构造函数的参数类型，并向 `Constructor.newInstance` 方法提供参数值：\n\n```\nClass cl = Scanner.class;\
  \ // 或任何其他带有 String 参数构造函数的类\nConstructor cons = cl.getConstructor(String.class);\n\
  Object obj = cons.newInstance(\"Mary had a little lamb\");\n```\n\n`Method` 和 `Constructor`\
  \ 类继承自 `Executable` 类。从 Java 17 开始，`Executable` 类是密封的（sealed），只允许 `Method` 和 `Constructor`\
  \ 作为子类。\n\n现在你已经了解了使用 `Method` 对象的规则，让我们把它用起来吧。[](#index.xhtml_ch05ex09) 是一个打印数学函数（如\
  \ `Math.sqrt` 或 `Math.sin`）数值表格的程序。输出结果如下：\n\n```\npublic static native double java.lang.Math.sqrt(double)\n\
  \      1.0000 |      1.0000\n      2.0000 |      1.4142\n      3.0000 |      1.7321\n\
