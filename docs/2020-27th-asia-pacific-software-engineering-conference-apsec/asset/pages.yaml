    # RQ3: how is WR used?


    We try to find out how WR is used. By knowing how we use WR in real-world situations,
    we can understand WR''s primary uses and the typical patterns that use WR.


    # Our Answer


    The use of WR is an unexpected result for the authors. The most common use of
