    # III. RESEARCH QUESTIONS


    # Our Answer


    # RQ1: in which domain is WR used?


    Code WR was not tested much. The authors consider that there is no test for WR
    because the pattern of the code for testing WR is not well known, rather than
    the difficulty of using WR.


    Our aim is to understand domain projects use WR and what features they use.


    # Our Answer


    The 202 projects tested, 73 repositories used WR, which was unexpectedly high.
    Among them, WR was often in System software and Software domains. The authors
    consider WR is often introduced where there is a strong demand for software performance.


    # RQ5: do developers stop using WR?


    To determine whether WR is difficult, we investigate whether there are any cases
