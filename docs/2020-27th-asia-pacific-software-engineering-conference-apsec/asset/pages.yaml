    \nAbstract—Programming languages have a system of garbage collection to automate\
    \ memory management problems may still occur due to the limitation of memory management.\
    \ Weak reference has been proposed as a solution to such problems. However, the\
    \ use of weak reference often requires consideration of memory layout for developers.\
    \ In this paper we investigate the use of weak reference on open source projects.\
    \ More concretely, we investigated the domain of Java objects, the timing of the\
    \ introduction of weak reference, the usage method, the presence or absence of\
    \ the test code for weak reference. The survey showed that weak references were\
    \ used in 73 repositories, about 102 reporters, and that weak references were\
    \ most common in test code.\n\nIndex Terms—Weak Reference, Garbage collection,\
    \ GitHub\n\n```\nWeakReference<Socket> ret =\n    new WeakReference<Socket>(socket);\n\
    \n```\nSocket s = ret.get();\nif (s == null) {\n    // in the case that the object\
    \ has been collected\n} else {\n    // in the case that the object is still in\
    \ the heap\n}\n\n```\n\nFig. 1. An example of class WeakReference\n\n# I. INTRODUCTION\n\
    \nGarbage collection (GC) is a system for automate memory management in many programming\
    \ languages [1]. GC frees developers from managing memory manually because GC\
    \ automatically collects unreachable objects. When an object is unreachable or\
    \ not determined by reachability from other objects, Objects referenced by other\
    \ objects are reachable and not collected because they are joined to be unreachable.\
    \ Objects referenced from other objects are unreachable and unreachable, unreachable\
    \ objects are collected automatically.\n\nHowever, there is still problem in the\
    \ memory management by GC. If an object that will not be used in the future is\
    \ unreachable from other objects, it will not be collected by GC. As a result,\
    \ objects remain in memory causing a memory leak.\n\nIn GC, developers cannot\
    \ specify specific object to instruct collection. As a way of specifying which\
    \ object to be collected by developers, called weak reference (WR) has been proposed\
    \ from strong reference [2] in the GC mechanism. Objects referenced only by WR\
    \ are untreated and collected by GC. Consequently, by using an object WR, it can\
    \ be specified as a GC target. However, there are some considerations for using\
    \ WR effectively. First, developers need to know the timing at\n\nweakly referenced\
    \ objects be collected. Having at least one reference from other objects are not\
    \ collected, and GC objects referenced only by WR. Thus, it is not possible to\
    \ predict when an object is weakly referenced from strong references and design\
    \ the object to be collected when it is no longer needed. Next, we need to determine\
    \ the timing at which GC collects the objects referenced by WRs. Instead of collecting\
    \ as soon as the object becomes a GC target, a null pointer is inserted in the\
    \ WR instead.\n\nVarious studied data on GitHub repositories [3], Some research\
    \ to solve the problem of Java memory leak [4, 5]. However, there is no study\
    \ of investigation of the use of WR. In open source software we investigated the\
    \ domain of Java projects where WR was used, the WR's introduction time, method,\
    \ the existence of the test, and the case of failure.\n\n# II. PRELIMINARIES\n\
    \nThe two classes are provided for WR in the Java language.\n\n+   - java.lang.WeakReference<T>\n\
    - java.util.HashMap<K,V>\n\nThe former is a class of WR for type T. I show an\
    \ example of how to use WeakReference. The latter and normal hash map (java.util.HashMap<K,V>)\
    \ share the same functions. The difference is when a weakly referenced object\
