    # RQ2: when is WR introduced?


    # Our Answer


    We investigate when WR is introduced in each project to understand the purpose
    for which WR is introduced. The introduction is classified into two, (1) implementing
    a new function and (2) maintain/maintain an existing function.


    There were some cases developers stopped using WR due to unexpected problems.
