    objects are collected by WR. Caching represents that the results of calculations
    are stored using WR. API implementation means a case in which the function of
    WR is provided as an API as it is. For example, a class that inherits WeakReference
    is a typical case. Comment means not a code, but WeakReference (''WeakReference''


