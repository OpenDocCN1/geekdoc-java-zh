- md: "\n# How Weak Reference is Used in Java Projects?\n\nYoshi H H*, Shinshiro Matsumoto,\
    \ Taeyung Kim and Shinji Kussumoto\nGraduate School of Information Science and\
    \ Technology, Osaka University, Japan\n[higo, shinsuke, kim-yang, kusumoto]@.osaka-u.ac.jp\n\
    \nAbstract—Programming languages have a system of garbage collection to automate\
    \ memory management but problems may still occur due to the limitation of memory\
    \ management. Weak reference has been proposed as a solution to such problems.\
    \ However, the use of weak reference often requires consideration of memory layout\
    \ for developers. In this paper, we investigate the use of weak reference on open\
    \ source projects. More concretely, we investigated the domain of Java objects,\
    \ the timing of the introduction of weak reference, the usage method, the presence\
    \ or absence of the test code for weak reference. The survey showed that weak\
    \ references were used in 73 repositories, about 102 reporters, and that weak\
    \ references were most common in test code.\n\nIndex Terms—Weak Reference, Garbage\
    \ collection, GitHub\n\n```java\nWeakReference<Socket> ret =\n    new WeakReference<Socket>(socket);\n\
    \n```\n\nSocket s = ret.get();\nif (s == null) {\n    // in the case that the\
    \ object has been collected\n} else {\n    // in the case that the object is still\
    \ in the heap\n}\n```\n\nFig. 1. An example of class WeakReference\n\n## I. INTRODUCTION\n\
    \nGarbage collection (GC) is a system for automate memory management in many programming\
    \ languages [1]. GC frees developers from managing memory manually because GC\
    \ automatically collects unreachable objects. When an object is unreachable or\
    \ not determined by reachability from other objects, Objects referenced by other\
    \ objects are reachable and not collected because they are joined to be unreachable.\
    \ Objects referenced from other objects are unreachable and, unreachable objects\
    \ are collected automatically.\n\nHowever, there is still problem in the memory\
    \ management by GC. If an object that will not be used in the future is unreachable\
    \ from other objects, it will not be collected by GC. As a result, objects remain\
    \ in memory causing a memory leak.\n\nIn GC, developers cannot specify specific\
    \ object to instruct collection. As a way of specifying which object to be collected\
    \ by developers, weak reference (WR) has been proposed from strong reference [2]\
    \ in the GC mechanism. Objects referenced only by WR are untreated and collected\
    \ by GC. Consequently, by using an object WR, it can be specified as a GC target.\
    \ However, there are some considerations for using WR effectively. First, developers\
    \ need to know the timing at which weakly referenced objects be collected. Having\
    \ at least one reference from other objects are not collected, and GC objects\
    \ referenced only by WR. Thus, it is not possible to predict when an object is\
    \ weakly referenced from strong references and design the object to be collected\
    \ when it is no longer needed. Next, we need to determine the timing at which\
    \ GC collects the objects referenced by WRs. Instead of collecting as soon as\
    \ the object becomes a GC target, a null pointer is inserted in the WR instead.\n\
    \nVarious studied data on GitHub repositories [3], some research to solve the\
    \ problem of Java memory leak [4, 5]. However, there is no study of investigation\
    \ of the use of WR. In open source software we investigated the domain of Java\
    \ projects where WR was used, the WR's introduction time, method, the existence\
    \ of the test, and the case of failure.\n\n## II. PRELIMINARIES\n\nThe two classes\
    \ are provided for WR in the Java language.\n\n- java.lang.WeakReference<T>\n\
    - java.util.HashMap<K,V>\n\nThe former is a class of WR for type T. I show an\
    \ example of how to use WeakReference. The latter and normal hash map (java.util.HashMap<K,V>)\
    \ share the same functions. The difference is when a weakly referenced object\
    \ is collected, to the value of the pair is lost, and if there is no reference\
    \ the value object, it is collected together with the key object. Key-value pairs\
    \ of key objects are no longer necessarily removed from the WeakHashMap. This\
    \ has the advantage that developers do not have to worry about deleting unnecessary\
    \ key-value pairs.\n\n## III. RESEARCH QUESTIONS\n\n### RQ1: in which domain is\
    \ WR used?\nOur aim is to understand domain projects use WR and what features\
    \ they use.\n\n### RQ2: when is WR introduced?\nWe investigate when WR is introduced\
    \ in each project to understand the purpose for which WR is introduced. The introduction\
    \ is classified into two (1) implementing a new function and (2) maintain an existing\
    \ function.\n\n### RQ3: how is WR used?\nWe try to find out how WR is used. By\
    \ knowing how we use WR in real-world situations, we can understand WR's primary\
    \ uses and the typical patterns that use WR.\n\n### RQ4: is code WR tested?\n\
    Making test is possible in software development. We investigate whether the code\
    \ using WR is tested sufficiently or not.\n\n### RQ5: do developers stop using\
    \ WR?\nTo determine whether WR is difficult, we investigate whether there are\
    \ any cases developers using WR due to unexpected problems.\n\n### RQ6: is using\
    \ weak reference for performance?\nTo check whether WR is effective for performance,\
    \ we conducted performance test on open source projects. We investigate whether\
    \ there is any difference between code using WR and code modified to use WR.\n\
    \n## IV. EXPERIMENT\n\n### A. RQ1: in what domain WR is used?\nThe procedures\
    \ are to repeat the 202 projects that were used in the experiment by Borges al.\
    \ [3]. They classified 202 projects into the following domains:\n\n- Application\
    \ software (Application)\n- System software (System)\n- Web libraries and frameworks\
    \ (Web)\n- Non-web libraries and frameworks (Non-web)\n- Tools (Tools)\n- Documentation\
    \ (Doc.)\n\nWe used GitHub code search API to determine whether WR was used in\
    \ each project. A code search performed using two keywords 'WeakReference' and\
    \ 'WeakMap', and if the number of source files in the results was one or more,\
    \ it was treated as using.\n\nResults: Figure 2 shows the results. ALL is the\
    \ distribution of all 202 projects, and WEAK is the distribution of the 73 projects\
    \ using WR. WR is used in 44 projects in the Non-web domain, which is the highest.\
    \ Regarding the ratio of WEAK/ALL, WR is used in more than half of the projects\
    \ in the System and Tools domains.\n\n### B. RQ2: when was WR introduced?\nWe\
    \ analyzed the change history of files in the repositories to find out when WR\
    \ was first introduced in the source files. The introduction time was classified\
    \ into two cases: (1) when the source file was created and (2) when it was updated.\
    \ We assumed that WR was introduced for the following purposes: For the first\
    \ case, WR was introduced when a new function was introduced. For the second case,\
    \ WR was introduced when an existing function improved/maintained.\n\n### C. RQ3:\
    \ how is WR used?\nThe procedures for RQ3 are the projects of all 55 source files\
    \ used in those repositories. We recorded where and how WR was used. We then classified\
    \ the usages of WR into the following categories:\n\n- Testing\n- Memory leak\
    \ prevention\n- Caching\n- API implementation\n- Comment\n- Unnecessary processing\
    \ avoidance\n\nTesting means that WR is used in time. Memory leak prevention means\
    \ that unnecessary objects are collected by WR. Caching represents that the results\
    \ of calculations are stored using WR. API implementation means a case in which\
    \ the function of WR is provided as an API as it is. For example, a class that\
    \ inherits WeakReference is a typical case. Comment means not a code, but WeakReference.\n\
    \n## Our Answer\nWR was mainly introduced when creating new source files, that\
    \ is, when adding new functions to software.\n\nThe use of WR is an unexpected\
    \ result for the authors. The most common use of WR in code may be test patterns\
    \ using WR were already known for developers. Other patterns of WR are described\
    \ in Subsection IV-C. Such patterns will be useful for developers who are not\
    \ familiar with WR.\n\nIn some of this, it was necessary to look at the code and\
    \ change history. We picked up the 10 projects with the highest stars out of the\
    \ 73 projects that used WR. Table 1 shows project names under the investigation\
    \ and number of stars at the end of 2018.\n\nCode WR was not tested much. The\
    \ authors consider that there is no test for WR because the pattern of the code\
    \ for testing WR is not well known, rather than the difficulty of using WR.\n\n\
    The 202 projects tested, 73 used WR, which was unexpectedly high. Among them,\
    \ WR was often in System and Software domains. The authors consider WR is often\
    \ introduced where there is a strong demand for performance.\n\nThere were some\
    \ cases developers using WR due to unexpected problems. To avoid such problems,\
    \ the introduction of WR should be determined with great care.\n\nWe conducted\
    \ experiments using source software and confirmed that WR was effective for performance.\
    \ In applications with all references to data, abnormal termination occurred in\
    \ the original library when WR was used. Still, with processing up to 1 GB of\
    \ data at once and doing something with it, it is possible to repeat loading and\
    \ unloading. In such a case, the existing library using WR worked fine, and the\
    \ modification terminated abnormally. The authors confirmed that WR is an effective\
    \ way to automatically collect objects and prevent memory leak from them.\n\n\
    TABLE 1: Top stars projects\n\n| Project | Stars |\n|---|---|\n| Reactive/Rx |\
    \ 36206 |\n| elasticsearch/elasticsearch | 35955 |\n| spring-projects/spring-boot\
    \ | 30988 |\n| square/okhttp | 29609 |\n| google/guava | 27988 |\n| filthy/AndroidChart\
    \ | 26609 |\n| spring-projects/spring-framework | 24612 |\n| bungee/gradle | 23869\
    \ |\n| square/testframework | 21002 |\n| zxing/zxing | 20623 |\n\n| File creation\
    \ | File update |\n|---|---|---|\n| WeakReference | 247 | 81 |\n| WeakMap | 75\
    \ | 29 |\n| Total | | 322 |\n\nFig. 2: Project domains\n\n![](img/5f9b873328e6d5db22a6fa7023ebdf4_20.png)\n"
  mdcn: "\n\n# Java 项目中如何使用弱引用？\n\nYoshi H H*, Shinshiro Matsumoto, Taeyung Kim 和\
    \ Shinji Kussumoto\n日本大阪大学信息科学与技术研究科，研究生院\n[higo, shinsuke, kim-yang, kusumoto]@.osaka-u.ac.jp\n\
    \n摘要—编程语言拥有一垃圾回收系统来自动管理内存，但由于内存管理的局限性，仍可能出现问题。弱引用（Weak reference）被提出作为解决此类问题的方案。然而，开发者在使用弱引用时通常需要考虑内存布局。在本文中，我们调查了开源项目对弱引用的使用。更具体地说，我们调查了\
    \ Java 对象的领域、弱引用的引入时、使用方法以及是否存在针对引用的测试代码。调查显示，弱引用被 73 个代码库、约 102 个报告者使用，且弱引用在测试代码中最为常见。\n\
    \n索引术语—弱引用，垃圾回收，GitHub\n\n```java\nWeakReference<Socket> ret =\n    new WeakReference<Socket>(socket);\n\
    \n```\n\nSocket s = ret.get();\nif (s == null) {\n    // 如果对象已被回收\n} else {\n\
    \    // 如果对象仍在堆中\n}\n```\n\n图 1. 类 WeakReference 的示例\n\n## I. 引言\n\n垃圾回收（GC）是许多编程语言中用于自动管理内存的系统\
    \ [1]。GC 将开发者从手动管理内存中解放出来，因为 GC 会自动收集不可达的对象。当一个对象不可达或无法通过其他对象的可达性确定时，被其他对象引用的对象是可达的且不会收集，因为它们被连接为不可达。从其他对象引用的对象是不可达的，不可达的对象会被自动收集。\n\
    \n然而，通过 GC 进行内存管理仍然存在问题。如果一个未来将不再使用的对象从其他对象不可达，它将不会被 GC 回收。结果导致对象留在内存中，引起内存泄漏。\n\
    \n在 GC 中，开发者无法指定特定对象来指示回收。作为开发者指定要回收哪个对象的方法，弱引用（WR）在 GC 机制中相对于强引用（strong reference）[2]\
    \ 被提出。仅被 WR 引用的对象不被处理并被 GC 回收。因此，通过使用一个 WR 对象，可以将其指定为 GC 目标。然而，有效地使用 WR 有一些考虑因素。首先，开发者需要知道被弱引用对象被回收的时机。只要至少有一个来自其他对象的引用，对象就不会被回收，GC\
    \ 只回收仅被 WR 引用的对象。因此，无法预测一个对象从强引用变为弱引用的何时，并设计该对象在不再需要时被回收。其次，我们需要确定 GC 回收由 WR 引用的对象的时机。GC\
    \ 并不是在对象成为 GC 目标时立即收集，而是在 WR 中插入一个空指针。\n\n关于 GitHub 代码库的各种研究数据 [3]，以及一些解决 Java\
    \ 内存泄漏问题的研究 [4, 5]。然而，目前还没有关于 WR 使用情况的调查研究。在开源软件中，我们调查了使用 WR 的 Java 项目领域、WR 的引入时间、方法、测试的存在以及失败的案例。\n\
    \n## II. 基础知识\n\nJava 语言提供了两个用于 WR 的类。\n\n- java.lang.WeakReference<T>\n- java.util.HashMap<K,V>\n\
    \n前者是用于类型 T 的 WR 类。我展示了一个如何使用 WeakReference 的示例。后者和普通的哈希映射（java.util.HashMap<K,V>）具有相同的功能。区别在于，当弱引用对象被回收时，键值对的值会丢失；如果没有对值对象的引用，它将与键对象一起被回收。键对象的键值对不再一定会被从\
    \ WeakHashMap 中移除。这过的优点是开发者不需要担心删除不必要的键值对。\n\n## III. 研究问题\n\n### RQ1: WR 在哪些领域被使用？\n\
    我们的目标是理解哪些领域的项目使用了 WR，以及它们使用了哪些特性。\n\n### RQ2: WR 是什么时候被引入的？\n我们调查了每个项目引入 WR 的时间，以理解引入\
    \ WR 的目的。引入被分为两类：(1) 实现新功能和 (2) 维护现有功能。\n\n### RQ3: WR 是如何被使用的？\n我们试图找出 WR 是如何被使用的。通过了解我们在现实世界中如何使用\
    \ WR，我们可以理解 WR 的主要用途以及使用 WR 的典型模式。\n\n### RQ4: WR 代码是否经过了测试？\n在软件开发中进行测试是可能的。我们调查了使用\
    \ WR 的代码是否经过充分测试。\n\n### RQ5: 开发者是否停止了使用 WR？\n为了确定 WR 是否困难，我们调查了是否存在开发者因意外问题而停止使用\
    \ WR 的情况。\n\n### RQ6: 使用弱引用是为了性能吗？\n为了检查 WR 对性能是否有效，我们在开源项目上进行了性能测试。我们调查了使用 WR\
    \ 的代码与修改为使用 WR 的代码是否存在差异。\n\n## IV. 实验\n\n### A. RQ1: WR 在什么领域使用？\n程序是重复 Borges\
    \ 等人 [3] 在实验中使用的 202 个项目。他们将 202 个项目分为以下领域：\n\n- 应用程序软件 (Application)\n- 系统软件\
    \ (System)\n- Web 库和框架 (Web)\n- 非 Web 库和框架 (Non-web)\n- 工具 (Tools)\n- 文档（Doc.）\n\
    \n我们使用 GitHub 代码搜索 API 来确定每个项目是否使用了 WR。使用 'WeakReference' 和 'WeakMap' 两个关键词执行代码搜索，确定了每个项目是否使用了\
    \ WR。调查显示，WR 在 73 个代码库、约 102 个报告者中使用，且 WR 在测试代码中最为常见。结果：WR 在 73 个代码库中使用，在 202\
    \ 个项目中的 44 个项目中使用。在 202 个项目中的，WR 在 Web 领域中最为常见。在 System 领域中，WR 在 73 个项目中的最为常见。\n\
    \n### B. RQ2: WR 是什么时候被引入的？\n我们调查了每个项目引入 WR 的时间，以理解引入 WR 的目的。引入分为两种：(1) 创建新功能和\
    \ (2) 维护现有功能。在第一种情况下，WR 是随着功能的引入的；在第二种情况下，WR 是为了维护现有功能。\n\n### C. RQ3: WR 是如何被使用的？\n\
    我们通过调查 55 个项目，试图找出 WR 是如何被使用的。我们将 WR 的使用归纳为几类：\n\n- 测试\n- 内存泄漏预防\n- 缓存实现\n- 注释\n\
    \nWR 在测试代码中是常见的。在内存泄漏预防中，WR 是常见的。在缓存实现中，WR 是常见的。在注释中，WR 也是常见的。此外，GC 并不是在对象成为 GC\
    \ 目标时立即收集，而是在 WR 中插入一个空指针。\n\n## 答复\nWR 主要在创建新文件时引入，在开发者遇到意外问题时引入。为了，WR 应该被谨慎引入。在调查\
    \ 202 个项目时，WR 在 73 个项目中使用。其中，WR 在 System 领域中最为常见。对于性能，WR 存在很强的需求。\n\n存在一些开发者因意外问题而使用\
    \ WR 的情况。为了避免此类问题，WR 的引入需要非常谨慎。我们在开源项目上进行了实验，确认 WR 对性能是有效的。在所有引用数据的应用中，原始库在使用\
    \ WR 时发生了异常。仍然，对于一次性处理 1 GB 数据并对其进行操作，重复加载和卸载是可能的。在这种情况下，使用 WR 的现有库运行良好，而修改后的库则了异常终止。我们调查了使用\
    \ WR 的代码与修改为使用 WR 的代码是否存在差异。\n\n表 1：高星项目\n\n| 项目 | 星数 |\n|---|---|\n| Reactive/Rx\
    \ | 36206 |\n| elasticsearch/elasticsearch | 35955 |\n| spring-projects/spring-boot\
    \ | 30988 |\n| square/okhttp | 29609 |\n| google/guava | 27988 |\n| filthy/AndroidChart\
    \ | 26609 |\n| spring-projects/spring-framework | 24612 |\n| bungee/gradle | 23869\
    \ |\n| square/testframework | 21002 |\n| zxing/zxing | 20623 |\n\n| 文件创建 | 文件更新\
    \ |\n|---|---|---|\n| WeakReference | 247 | 81 |\n| WeakMap | 75 | 29 |\n| 总计\
    \ | | 322 |\n\n图 2：项目领域\n\n![](img/5f9b873328e6d5db22a6fa7023ebdf4_20.png)\n\n"
