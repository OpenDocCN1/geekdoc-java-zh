    # Our Answer


    We conducted experiments using open source software and confirmed that WR was
    effective for software performance. In applications with all references to image
    data, abnormal termination occurred in the original library when WR was used.
    Still, with processing up to 1 GB of image data at once and doing something with
    it, it is possible to repeat loading and unloading for a few images. In such a
    case, the existing library using WR worked fine, and the modification terminated
    abnormally. The authors confirmed that WR is an effective way to automatically
    collect unnecessary objects and prevent a memory leak from them.


    ![](img/5f9b873328e6d5db522a6fa7023ebdf4_2_0.png)


    Fig. 2: Project domains


    We defined introduction when keywords ''ReReference'' and ''WeakMap'' in the change
    history of the source files. If a keyword is introduced in the change history
    when the source file was created, we regarded that WR was introduced when the
    file was generated. Otherwise, if a keyword is introduced in any change history
    after the file was created, we regarded that WR was introduced into the file.


    # IV. EXPERIMENT


    # A. RQ1: in what domain WR is used?


    The procedures are to repeat the 202 projects that were used in the experiment
    by Borges et al. [3]. They classified the 202 projects into the following domains.


    +   - Application software (short, Application)

    - System software (System)

    - Web libraries and frameworks (Web)

    - Non-web libraries and frameworks (Non-web)

    - Tools (Tools)

    - Documentation (Doc.)


    We used GitHub code search API to determine whether WR was used in each project.
    A code search performed using two keywords ''WeakReference'' and ''WeakMap'',
    and if the number of source files in the results was one or more, it was treated
    as using.


    Results: Figure 2 shows the results. ALL is the distribution of all 202 projects,
    and WEAK is the distribution of the 73 projects using WR. WR is used in 44 projects
    in the Non-web domain, which is the highest. Regarding the ratio of WEAK/ALL,
    WR is used in more than half of the projects in the System and Tools domains


    Results: Table II shows the investigation results on introduction time. Both WeakReference
    and WeakMap, the number of creating files was as many as the number of updating
    files. Considering the assumptions, WR is introduced to add new functions to software
    rather than maintain/improve existing functions.


    # B. RQ2: when was WR introduced?


    We analyzed the change history of files in the repositories to find out when WR
    was first introduced in the source files. The introduction time was classified
    into two cases: (1) when the source file was created and (2) when it was updated.
    We assumed that WR was introduced for the following purposes. For the first case,
    WR was introduced when a new function was introduced. For the second case, WR
    was introduced when an existing function improved/maintained.


    # C. RQ3: how is WR used?


    The procedures for RQ3 are the projects in Table I of all 55 source files used
    in those repositories. We recorded where and how WR was used. We then classified
    the usages of WR into the following categories:


    +   - Testing

    - Memory leak prevention,

    - Caching,

    - API implementation,

    - Comment,

    - Unnecessary processing avoidance.


