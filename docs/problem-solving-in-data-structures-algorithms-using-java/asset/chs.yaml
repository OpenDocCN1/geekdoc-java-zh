  \        }\n    }\n    System.out.println(maximum);\n    return maximum;\n}\n```\n\
  \n### 雨水填充 (Rain Water)\n\n**问题**：给定一个非负整数数组。数组中的每个元素代表直方图中的柱，每个柱宽度为单位。你需要计算该结构可以容纳多少水。\n\
  \n例如：[4, 0, 1, 5] 将包含 7 单位的水。\n\n![](img/00058.jpeg)\n\n**解决方案**：如果我们能够找到每个柱可以容纳的水量，这个问题就可以很容易地解决。索引\
  \ `i` 处的水 = `minimum(left, right)` - `i` 柱。\n\n#### 示例 5.83：\n```java\npublic static\
  \ int RainWater(int[] arr, int size) {\n    int water = 0;\n    int[] leftHigh =\
  \ new int[size];\n    int[] rightHigh = new int[size];\n    int max = arr[0];\n\
  \    leftHigh[0] = arr[0];\n    for (int i = 1; i < size; i++) {\n        if (max\
  \ < arr[i])\n            max = arr[i];\n        leftHigh[i] = max;\n    }\n    max\
  \ = arr[size - 1];\n    rightHigh[size - 1] = arr[size - 1];\n    for (int i = size\
  \ - 2; i >= 0; i--) {\n        if (max < arr[i])\n            max = arr[i];\n  \
  \      rightHigh[i] = max;\n    }\n    for (int i = 0; i < size; i++) {\n      \
  \  water += Math.min(leftHigh[i], rightHigh[i]) - arr[i];\n    }\n    System.out.println(\"\
  Water : \" + water);\n    return water;\n}\n```\n时间复杂度：O(N)\n\n对上述问题的进一步优化：在单次迭代中结合\
  \ `leftMax` 和 `rightMax` 计算水。\n\n#### 示例 5.84：\n```java\npublic static int RainWater2(int[]\
  \ arr, int size) {\n    int water = 0;\n    int leftMax = 0, rightMax = 0;\n   \
  \ int left = 0;\n    int right = size - 1;\n    while (left <= right) {\n      \
  \  if (arr[left] < arr[right]) {\n            if (arr[left] > leftMax)\n       \
  \         leftMax = arr[left];\n            water += leftMax - arr[left];\n    \
  \        left++;\n        } else {\n            if (arr[right] > rightMax)\n   \
  \             rightMax = arr[right];\n            water += rightMax - arr[right];\n\
  \            right--;\n        }\n    }\n    return water;\n}\n```\n\n\n\n\n```java\n\
  water += leftMax - arr[left];\nleft += 1;\n} else {\n    if (arr[right] > rightMax)\n\
