  \n4. 交通网络：航空公司地图表示为图。不同的机场表示为图的节点，如果从机场 `u` 和机场 `v` 之间有直飞航班，那么图中存在一条从节点 `u` 到节点\
  \ `v` 的边。\n\n（注：由于原文中存在大量重复，已按要求去重处理逻辑，以下为核心内容翻译：）\n\n在本章中，我们将学习图的数据结构。\n\n图数据结构由以下两个部分组成：\n\
  \n1. 一个有限的节点集合，称为 `vertices`（顶点）。\n\n2. 一个有限的顶点对集合，称为 `edges`（边）。边是两个顶点之间的连接。 \n\
  \n图的一些现实世界示例有：\n\n1. Google Maps：不同的位置可以表示为图的 `Vertices`（顶点），它们之间的路径由图的 `Edges`（边）表示。图论算法被用于建议两个位置之间最短且最快的路径。\n\
  \n2. Facebook 好友推荐：每个用户配置文件表示为图的顶点，他们的朋友关系由图的边表示。图论算法被用于好友推荐。\n\n3. 拓扑排序：拓扑排序是一种通过查看各种事件之间的相互依赖关系，找到完成某些任务需要执行的事件序列的方法。例如，我们为了成为计算机科学毕业生而所修的课程顺序。或者我们每天为准备工作而采取的步骤顺序。\n\
  \n4. 交通网络：航空公司地图表示为图。不同的机场表示为图的节点，如果从机场 `u` 和机场 `v` 之间有直飞航班，那么图中存在一条从节点 `u` 到节点\
  \ `v` 的边。\n\n**图的定义：** 图是 $G = (V, E)$，其中 $V$ 是有限顶点集合，$E$ 是有限边对集合。\n\n## 图的术语\n\n\
  **无向图 (Undirected Graph)**：没有方向的图。图中的边是双向的。\n\n**有向图 (Directed Graph / Digraph)**：有方向的图。图中的边是单向的。\n\
  \n**加权图 (Weighted Graph)**：边关联了权值的图。\n\n**无权图 (Unweighted Graph)**：边没有关联权值的图。\n\n\
  **路径 (Path)：** 路径是顶点之间的边的序列。路径的长度定义为路径所有边的权重之和。\n\n**简单路径 (Simple Path)：** 顶点均不相同的路径。\n\
  \n**相邻顶点 (Adjacent Vertex)**：如果有一条边连接 $u$ 和 $v$，则顶点 $u$ 和 $v$ 是相邻的。\n\n**入度 (in-degree)**：顶点\
  \ $v$ 的入度是进入 $v$ 的边数。\n\n**出度 (out-degree)**：顶点 $v$ 的出度是离开 $v$ 的边数。\n\n**度 (degree)**：顶点\
  \ $v$ 的度是以 $v$ 为一个端点的边总数。$deg(v) = Indeg (v) + outdeg (v)$\n\n**环 (Cycle)**：起点和终点都是同一个顶点且包含至少一个顶点的路径。\n\
  \n**自环 (Self-Loop)**：如果两个端点重合，则为自环。这是环的一种。\n\n**环图 (Cyclic Graph)**：包含一个或多个环的图。\n\
  \n**无环 (Acyclic Graph)**：没有环的图。\n\n**有向无环图 (Directed Acyclic Graph / DAG)**：不包含任何环的有向图。\n\
  \n**可达 (Reachable)**：如果存在从 $u$ 到 $v$ 的路径，则顶点 $v$ 从 $u$ 是可达的，或者说 $u$ 可到达 $v$。\n\n\
  \n\n\n\n**连通图**：如果图中任意两个顶点之间都存在路径，则该图是`连通`的。\n\n**强连通图**：如果对于每一对顶点 `u` 和 `v`，存在从\
  \ `u` 到 `v` 的路径以及从 `v` 到 `u` 的路径，则该有向图是强连通的。\n\n![](img/00227.jpeg)\n\n**强连通分量**：有向图可能有不同的强连通子图。这些子图被称为强连通分量。\n\
  \n![](img/00228.jpeg)\n\n**弱连通图**：如果对于每一对顶点 `u` 和 `v`，存在从 `u` 到 `v` 的路径或从 `v` 到\
  \ `u` 的路径，则该有向图是弱连通的。\n\n**完全图**：如果图中任何顶点都通过边与图中所有其他顶点相，则该图是完全图。完全图具有最大数量的边。对于具有\
  \ `n` 个顶点的无向图，边的总数为 `n(n-1)/2`，对于有向图，边的总数为 `n(n-1)`。\n\n图 `G` 的`子图`是指一个顶点和边都是 `G`\
  \ 的顶点和边的子集的图。\n\n`G` 的`生成子图` 是一个连接了 `G` 所有顶点的图。\n\n`森林`是一个不包含环的图。\n\n`树`是一个不包含环的连通图。在任意两个顶点\
  \ `u` 和 `v` 之间只有唯一的简单路径。如果我们移除树的任意条边，它就会变成一个森林。\n\n![](img/00229.jpeg)\n\n图的`生成树`\
  \ 是一个连接了图中所有顶点的树。由于`生成树`是一棵树，所以它不应该包含任何环。\n\n![](img/00230.jpeg)\n\n**哈密顿路径**是图中一条每个顶点都恰好被访问一次且不重复的路径，它不一定起点和终点同一个顶点。\n\
  \n**哈密顿回路**是一种特殊的`哈密顿路径`，其从最后一个顶点到第一个顶点存在有一条边。`哈密顿回路`是一个恰好访问每个顶点一次的回路，并且必须起点和终点同一个顶点。\n\
  \n[`欧拉路径`](http://en.wikipedia.org/wiki/Eulerian_path)是图中一条恰好访问每条边一次的路径。\n\n**欧拉回路**是一个起点和终点都是同一个顶点的`欧拉路径`。或者说`欧拉回路`是图中一条恰好访问每条边一次且起点终点为同一个顶点的路径。\n\
  \n**旅行商问题 (TSP)** 一个销员需要访问不同的城市。他查询每个城市之间的距离，并将距离放入图中。应该以什么顺序旅行才能访问每个城市，并最终以最短距离返回家乡。\n\
  \n这个问题可以重新表述为寻找成本最低的哈密顿回路。\n\n# 图的表示\n\n表示图的两种最常见方法是：\n\n1. 邻接矩阵\n\n2. 邻接列表\n\n\
  ### 邻接矩阵\n\n邻接矩阵是一个行数为 `V`、列数为 `V` 的二维矩阵，其中 `V` 是图中顶点的数量。邻接矩阵使用大小为 `V x V` 的二维数组表示。\n\
  \n假设该数组为 `adj`，则节点 `adj[i][j]` 对应于从顶点 `i` 到顶点 `j` 的边。如果 `adj[i][j]` 不为零，则意味着从顶点\
  \ `i` 到顶点 `j` 存在路径。对于无权图，数组中的值是 `0`（无路径）或 `1`（存在路径）。但在加权图中，矩阵中的值表示从顶点 `i` 到 `j`\
  \ 路径的代价/权重。\n\n![](img/00231.jpeg)\n\n在上面的图中，每个节点的权重为 1，因此邻接矩阵只包含 `1` 或 `0`。如果边的权重不同，则该权重将填充在矩阵中。\n\
  \n**示例 12.1**: 图的邻接矩阵表示\n\n```java\npublic class GraphAM {\n    int count;\n   \
  \ int[][] adj;\n    GraphAM(int cnt) {\n        count = cnt;\n        adj = new\
  \ int[count][count];\n    }\n    public void addDirectedEdge(int src, int dst, int\
  \ cost) {\n        adj[src][dst] = cost;\n    }\n    public void addUndirectedEdge(int\
  \ src, int dst, int cost) {\n        addDirectedEdge(src, dst, cost);\n        addDirectedEdge(dst,\
  \ src, cost);\n    }\n    public void print() {\n        for (int i = 0; i < count;\
  \ i++) {\n            System.out.print(\"Node \" + i + \" is connected with : \"\
  );\n            for (int j = 0; j < count; j++) {\n                if (adj[i][j]\
  \ != 0) {\n                    System.out.print(j + \" \");\n                }\n\
  \            }\n            System.out.println(\"\");\n        }\n    }\n    public\
  \ static void main(String[] args) {\n        GraphAM graph = new GraphAM(4);\n \
  \       graph.addUndirectedEdge(0, 1, 1);\n        graph.addUndirectedEdge(0, 2,\
  \ 1);\n        graph.addUndirectedEdge(1, 2, 1);\n    }\n}\n```\n输出：\nNode 0 is\
  \ connected with : 1 2 \nNode 1 is connected with : 0 2 \nNode 2 is connected with\
  \ : 0 1 \nNode 3 is connected with : \n\n复杂度分析：\n- 邻接矩阵表示的空间复杂度为 `n²`，因为创建了二维数组。\n\
  - 查找从 `u` 到 `v` 的边的时间复杂度为 `O(1)`。\n\n邻接矩阵的优缺点\n\n邻接矩阵的优点：\n1. 查询从 `u` 到 `v` 的边需要\
  \ `O(1)` 时间。\n2. 删除一条边需要 `O(1)` 时间。\n\n邻接矩阵的缺点：\n1. 空间复杂度为 `n²`。\n2. 即使图是稀疏的（边很少），空间复杂度也相同。\n\
  3. 添加一个新顶点需要 `n²` 时间。\n\n在巨大的图中，每个节点连接的节点较少，因此邻接矩阵的大部分是空的。这种矩阵被称为稀疏矩阵。在大多数现实问题中，邻接矩阵不是图的好选择。\n\
  \n### 邻接列表\n\n存储图的一种更节省的方法是邻接列表。邻接列表是链表的数组。每个列表元素对应于图的一条边。数组的大小等于图中顶点的数量。设数组为 `Arr[]`。一个\
  \ `Arr[k]` 对应于第 `k` 个顶点，是连接到第 `k` 个顶点的列表。边的权重可以存储在链节点中。\n\n![](img/0232.jpeg)\n\n\
  邻接列表有助于我们表示稀疏图。邻接列表表示还允许我们通过扫描一次链表找到直接连接到任意顶点的所有顶点。在我们所有的程序中，我们将使用邻接列表来存储图。\n\n\
  **示例 12.2**: 图的邻接列表表示\n\n```java\npublic class Graph {\n    int count;\n    private\
  \ LinkedList<LinkedList<Edge>> Adj;\n    private static class Edge {\n        private\
  \ int dest;\n        private int cost;\n        Edge(int dst, int cst) {\n     \
  \       dest = dst;\n            cost = cst;\n        }\n    }\n    Graph(int cnt)\
  \ {\n        count = cnt;\n        Adj = new LinkedList<LinkedList<Edge>>();\n \
  \       for (int i = 0; i < cnt; i++) {\n            Adj.add(new LinkedList<Edge>());\n\
  \        }\n    }\n    private void addDirectedEdge(int source, int dest, int cost)\
  \ {\n        Edge edge = new Edge(dest, cost);\n        Adj.get(source).add(edge);\n\
  \    }\n    public void addDirectedEdge(int source, int dest) {\n        addDirectedEdge(source,\
  \ dest, 1);\n    }\n}\n```\n\n\n\n\n```java\n      }\n\n      public void addUndirectedEdge(int\
  \ source, int dest, int cost) {\n            addDirectedEdge(source, dest, cost);\n\
  \            addDirectedEdge(dest, source, cost);\n      }\n\n      public void\
  \ addUndirectedEdge(int source, int dest) {\n            addUndirectedEdge(source,\
  \ dest, 1);\n      }\n\n      public void print() {\n            for (int i = 0;\
  \ i < count; i++) {\n                LinkedList<Edge> ad = Adj.get(i);\n       \
  \         System.out.print(\"\\n Vertex \" + i + \" is connected to : \");\n   \
  \             for (Edge adn : ad) {\n                    System.out.print(\"(\"\
  \ + adn.dest + \", \" + adn.cost + \") \");\n                }\n            }\n\
  \      }\n      public static void main() {\n            Graph gph = new Graph(5);\n\
  \            gph.addDirectedEdge(0, 1, 3);\n            gph.addDirectedEdge(0, 4,\
  \ 2);\n            gph.addDirectedEdge(1, 2, 1);\n            gph.addDirectedEdge(2,\
  \ 3, 1);\n            gph.addDirectedEdge(4, 1, -2);\n            gph.addDirectedEdge(4,\
  \ 3, 1);\n            gph.print();\n      }\n}\n```\n\n### 分析\n- 在具有 `N` 个顶点的图构造函数中，创建了一个大小为\
  \ `N` 的列表数组。\n- `addDirectedEdge()` 函数用于添加从 `source` 到 `destination` 的有向边，方法是通过向相应的顶点列表添加一个元组\
  \ `(destination, cost)`。\n- `addUndirectedEdge()` 函数用于添加无向边。它调用了两次 `addDirectedEdge()`\
  \ 函数来双向连接源点和终点。\n\n**复杂度分析：**\n邻接表的空间复杂度为 `O(E+V)`，用于创建顶点数组以及存储每个顶点的边。\n\n查找是否存在从顶点\
  \ `u` 到顶点 `v` 的边的时间复杂度完成为 `outdegree(u)`。我们需要遍历顶点 `u` 的邻居列表。在最坏情况下，它可以达到 `O(E)`。\n\
  \n## 图的遍历\n\n**遍历**是通过检查图中所有的边和顶点来探索图的过程。\n\n使用图遍历可以解决的一些问题列表如下：\n1. 确定从顶点 `u` 到顶点\
  \ `v` 的路径，如果不存在此类路径则报告错误。\n2. 给定一个起始顶点 `s`，找到从顶点 `s` 到图中所有其他顶点的最小边数。\n3. 测试图 `G`\
  \ 是否是通的。\n4. 寻找图的生成树。\n5. 查找图中是否存在环。\n\n`深度优先搜索 (DFS)` 和 `广度优先搜索 (BFS)` 是用于遍历图的两种算法。这些算法也可以用于查找图中的某些节点、判断某个节点是否可达等。\n\
  \n## 深度优先遍历\n\n我们从起始点开始 DFS 算法，并向图的深度移动，直到遇到死胡同，然后移动到父节点（回溯）。在 `DFS` 中，我们使用 `stack`\
  \ 来获取下一个开始搜索的顶点。或者，我们也可以使用递归（系统栈）来实现相同的功能。\n\n图的深度优先遍历与树的深度优先遍历相似。唯一的区别在于图可能包含环（而树不包含）。因此在遍历过程中，我们可能会回到同一个节点。为了避免重复处理节点，我们使用一个\
  \ `visited` 数组。\n\n(Images/00233.jpeg)\n下面的图演示了 DFS。\n(Images/00234.jpeg)\n(Images/00235.jpeg)\n\
  (Images/00236.jpeg)\n\n### 基于栈的 DFS 实现\n\nDFS 步骤：\n1. 将起始节点推入 `stack`。\n2. 循环直到\
  \ `stack` 为空。\n3. 从 `stack` 中弹出节点，并将节点命名为 `current`。\n4. 处理 `current` 节点（打印等）。\n\
  5. 遍历 `current` 节点的所有子节点并将推入 `stack`。\n6. 重复步骤 3 到 5 直到 `stack` 为空。\n\n**示例 2.3:**\
  \ 基于栈的 DFS 实现。\n```java\npublic static boolean dfsStack(Graph gph, int source, int\
  \ target) {\n    int count = gph.count;\n    boolean[] visited = new boolean[count];\n\
  \    Stack<Integer> stk = new Stack<Integer>();\n    stk.push(source);\n    visited[source]\
  \ = true;\n    while (stk.isEmpty() == false) {\n        int curr = stk.pop();\n\
  \        LinkedList<Edge> adl = gph.Adj.get(curr);\n        for (Edge adn : adl)\
  \ {\n            if (visited[adn.dest] == false) {\n                visited[adn.dest]\
  \ = true;\n                stk.push(adn.dest);\n            }\n        }\n    }\n\
  \    return visited[target];\n}\n```\n\n**复杂度分析：**\n- 当图用邻接列表表示时，DFS 算法的时间复杂度为 `O(V+E)`，其中\
  \ `V` 是顶点的总数，`E` 是图中边的总数。\n- 当图用邻接矩阵表示时，算法的时间复杂度为 `O(V²)`。我们需要遍历一个顶点的相邻顶点，这在图用邻接列表表示时是高效的。\n\
  \n### 基于递归的 DFS 实现\n\nDFS 步骤：\n1. 在 `DFS()` 函数中，创建一个 `visited` 数组来跟踪已访问的节点。\n2.\
  \ 在 `DFS()` 函数中，将 `source` 节点作为 `current` 节点传递给 `DFSRec()` 递归函数。\n3. 所有从 `index`\
  \ 节点访问的节点将作为递归进一步传递给 `DFSRec()` 函数。\n4. 当从 `source` 访问的所有节点都被访问后，该递归将返回 `DFS()`\
  \ 函数。最后，我们可以通过查看 `visited` 数组来判断 `target` 是否被访问。\n\n**示例 2.4:**\n```java\npublic\
  \ static boolean dfs(Graph gph, int source, int target) {\n    int count = gph.count;\n\
  \    boolean[] visited = new boolean[count];\n    dfsUtil(gph, source, visited);\n\
  \    return visited[target];\n}\n\npublic static void dfsUtil(Graph gph, int index,\
  \ boolean[] visited) {\n    visited[index] = true;\n    LinkedList<Edge> adl = gph.Adj.get(index);\n\
  \    for (Edge adn : adl) {\n        if (visited[adn.dest] == false) {\n       \
  \     dfsUtil(gph, adn.dest, visited);\n        }\n    }\n}\n```\n\n## 广度优先遍历\n\n\
  在 BFS 中，图按分层的方式遍历，靠近起始点。使用 `queue` 来实现 BFS。图的广度优先遍历与树的深度优先遍历相似。唯一的区别在于图可能包含环（而树不包含）。因此在遍历过程中，我们可能会回到同一个节点。为了避免重复处理节点，我们使用一个\
  \ `visited` 数组。\n\nBFS 步骤：\n1. 将起始节点放入 `queue`。\n2. 循环直到 `queue` 为空。\n3. 从 `queue`\
  \ 中移除节点，并将节点命名为 `current`。\n4. 处理 `current` 节点。\n\n(Images/00237.jpeg)\n下面的图演示了广度优先遍历。\n\
  (Images/00238.jpeg)\n(Images/00239.jpeg)\n(Images/00240.jpeg)\n\n**示例 2.5:**\n```java\n\
  public static boolean bfs(Graph gph, int source, int target) {\n    int count =\
  \ gph.count;\n    boolean[] visited = new boolean[count];\n    LinkedList<Integer>\
  \ que = new LinkedList<Integer>();\n    que.add(source);\n    visited[source] =\
  \ true;\n    while (que.isEmpty() == false) {\n        int curr = que.remove();\n\
  \        LinkedList<Edge> adl = gph.Adj.get(curr);\n        for (Edge adn : adl)\
  \ {\n            if (visited[adn.dest] == false) {\n                visited[adn.dest]\
  \ = true;\n                que.add(adn.dest);\n            }\n        }\n    }\n\
  \    return visited[target];\n}\n```\n\n\n\n\n\n# 复杂度分析\nDFS 和 BFS 遍历的时间运行复杂度为 `O(V+E)`，其中\
  \ `V` 是从源节点可达的点数，`E` 是图中的边数。\n\n## BFS 和 DFS 的用途\n以下问题可以使用 DFS 解决：\n\n1. 查找两个顶点之间是否存在路径，可以使用\
  \ `BFS` 或 `DFS` 完成。\n2. 给定起始顶点 `u`，使用 `BFS` 找到从顶点 `s` 到图中所有其他顶点的最小边数。\n3. 测试图 `G`\
  \ 是否连通，可以使用 `BFS` 或 `DFS` 完成。\n4. 查找图中是否存在环，或检查给定图是否为树，可以使用 `DFS` 完成。\n5. 拓扑排序可以使用\
  \ `DFS` 完成。\n6. 有向图中的强或强连通分量可以使用 `DFS` 完成。\n\n## 基于 DFS & BFS 的问题\n\n### 有向无环图与拓扑排序\n\
  有向无环图（DAG）是不包含环的有向图。DAG 表示了一种比树更通用的关系。下面是一个 DAG 的示例，展示了某人如何准备工作。现实生活中还有其他 N 个 DAG\
  \ 的示例，例如大学毕业生的选拔。\n\n![](img/00241.jpeg)\n\n拓扑排序是对有向图节点进行排序的方法，其中节点表示活动，边表示这些任务之间的依赖关系。要使拓扑排序生效，图必须是一个\
  \ `DAG`，这意味着它不包含任何环。只需使用 `DFS` 即可获取拓扑排序。\n\n**示例 12.6：**\n\n```java\npublic static\
  \ void topologicalSort(Graph gph) {\n      Stack<Integer> stk = new Stack<Integer>();\n\
  \      int count = gph.count;\n      boolean[] visited = new boolean[count];\n \
  \     for (int i = 0; i < count; i++) {\n            if (visited[i] == false) {\n\
  \                  dfsUtil2(gph, i, visited, stk);\n            }\n      }\n   \
  \   System.out.print(\"topologicalSort :: \");\n      while (stk.isEmpty() != true)\
  \ {\n              System.out.print(\" \" + stk.pop());\n      }\n}\n\npublic static\
  \ void dfsUtil2(Graph gph, int index, boolean[] visited, Stack<Integer> stk) {\n\
  \      visited[index] = true;\n      LinkedList<Edge> adl = gph.Adj.get(index);\n\
  \      for (Edge adn : adl) {\n            if (visited[adn.dest] == false) {\n \
  \                 dfsUtil2(gph, adn.dest, visited, stk);\n            }\n      }\n\
  \      stk.push(index);\n}\n\npublic static void main() {\n      Graph gph = new\
  \ Graph(6);\n      gph.addDirectedEdge(5, 2, 1);\n      gph.addDirectedEdge(5, 0,\
  \ 1);\n      gph.addDirectedEdge(4, 0, 1);\n      gph.addDirectedEdge(4, 1, 1);\n\
  \      gph.addDirectedEdge(2, 3, 1);\n      gph.addDirectedEdge(3, 1, 1);\n    \
  \  gph.print();\n      topologicalSort(gph);\n}\n```\n\n拓扑排序是拓扑图的 DFS 遍历。首先，将节点的所有子节点添加到栈中，然后只添加当前节点。这样就维持了顺序。建议读者运行一些示例来理解此算法。\n\
  \n### 确定从顶点 u 到顶点 v 的路径\n**问题：** 查找从顶点 `u` 到顶点 `v` 是否路径。\n\n**解决方案：** 如果从顶点 `u`\
  \ 到顶点 `v` 存在路径，当我们从顶点 `u` 执行 `DFS` 时，将会访问顶点 `v`。\n\n**示例 12.7：**\n\n```java\npublic\
  \ static boolean pathExist(Graph gph, int source, int dest) {\n      int count =\
  \ gph.count;\n      boolean[] visited = new boolean[count];\n      dfsUtil(gph,\
  \ source, visited);\n      return visited[dest];\n}\n```\n**复杂度分析：** 对于使用邻接表实现的图，DFS\
  \ 的时间复杂度为 `O(V+E)`，而对于邻接矩阵则为 `O(V²)`。\n\n### 统计所有路径\n**问题：** 给定一个源顶点和一个顶点，找到从源到目的的所有可能路径。\n\
  \n**示例 12.8：**\n\n```java\npublic static int countPathDFS(Graph gph, boolean[] visited,\
  \ int source, int dest) {\n      if (source == dest) {\n          return 1;\n  \
  \    }\n      int count = 0;\n      visited[source] = true;\n      LinkedList<Edge>\
  \ adl = gph.Adj.get(source);\n      for (Edge adn : adl) {\n            if (visited[adn.dest]\
  \ == false) {\n                  count += countPathDFS(gph, visited, adn.dest, dest);\n\
  \            }\n      }\n      visited[source] = false;\n      return count;\n}\n\
  \npublic static int countAllPath(Graph gph, int src, int dest) {\n      int count\
  \ = gph.count;\n      boolean[] visited = new boolean[count];\n      return countPathDFS(gph,\
  \ visited, src, dest);\n}\n```\n**分析：** 添加了对图的 DFS 遍历以及各种路径的计数。\n\n### 打印所有路径\n\
  **问题：** 打印从源顶点到目的顶点的所有路径。\n\n**示例 12.9：**\n\n```java\npublic static void printAllPath(Graph\
  \ gph, boolean[] visited, int source, int dest, Stack<Integer> path) {\n      path.push(source);\n\
  \      if (source == dest) {\n          System.out.println(path);\n          return;\n\
  \      }\n      visited[source] = true;\n      LinkedList<Edge> adl = gph.Adj.get(source);\n\
  \      for (Edge adn : adl) {\n            if (visited[adn.dest] == false) {\n \
  \                 printAllPath(gph, visited, adn.dest, path);\n            }\n \
  \     }\n      visited[source] = false;\n      path.pop();\n}\n\npublic static void\
  \ printAllPath(Graph gph, int src, int dest) {\n      boolean[] visited = new boolean[gph.count];\n\
  \      Stack<Integer> path = new Stack<Integer>();\n      printAllPath(gph, visited,\
  \ src, dest);\n}\n```\n**分析：** 通过访问的顶点对图进行 DFS 遍历。当发现目的地时，打印路径。\n\n### 根顶点\n**问题：**\
  \ 找到图中的根顶点。根顶点是具有所有其他顶点的顶点。如果有多个根顶点，返回任意一个。\n\n**提示：** 你需要返回拓扑排序中的栈节点。\n\n**示例 12.10：**\n\
  \n```java\npublic static int rootVertex(Graph gph) {\n      int count = gph.count;\n\
  \      boolean[] visited = new boolean[count];\n      int retVal = -1;\n      for\
  \ (int i = 0; i < count; i++) {\n            if (visited[i] == false) {\n      \
  \        dfsUtil(gph, i, visited);\n              retVal = i;\n            }\n \
  \     }\n      System.out.print(\"Root vertex is \" + retVal);\n      return retVal;\n\
  }\n```\n\n### 传递闭\n**问题：** 给定一个有向图，构建传递闭或可达性矩阵。如果从 u 到 v 有路径，则 v 从 u 可达。\n\n**示例\
  \ 12.11：**\n\n```java\npublic static void transitiveClosureUtil(Graph gph, int source,\
  \ int dest, int[][] tc) {\n      tc[source][dest] = 1;\n      LinkedList<Edge> adl\
  \ = gph.Adj.get(dest);\n      for (Edge adn : adl) {\n            if (tc[source][adn.dest]\
  \ == 0) {\n                  transitiveClosureUtil(gph, source, adn.dest, tc);\n\
  \            }\n      }\n}\n\npublic static int[][] transitiveClosure(Graph gph)\
  \ {\n      int count = gph.count;\n      int[][] tc = new int[count][count];\n \
  \     for (int i = 0; i < count; i++) {\n          transitiveClosureUtil(gph, i,\
  \ i, tc);\n      }\n      return tc;\n}\n```\n**分析：** 我们创建一个二维数组 `tc` 并将其全部置零。通过跟踪源顶点\
  \ `u` 遍历图，当我们能够遍历顶点 `v` 时，我们将 `tc[u][v]` 标记为可达。\n\n### BFS 层节点\n**问题：** 执行图的 BFS\
  \ 遍历。除了节点外，还要打印它们从起始源顶点的距离。\n\n**示例 12.12：**\n\n```java\npublic static void bfsLevelNode(Graph\
  \ gph, int source) {\n      int count = gph.count;\n      boolean[] visited = new\
  \ boolean[count];\n      int[] level = new int[count];\n}\n```\n\n\n\n\n\n```java\n\
  visited[source] = true;\n\nLinkedList<Integer> que = new LinkedList<Integer>();\n\
  que.add(source);\nlevel[source] = 0;\nSystem.out.println(\"\\nNode - Level\");\n\
  while (que.isEmpty() == false) {\n    int curr = que.remove();\n    int depth =\
  \ level[curr];\n    LinkedList<Edge> adl = gph.Adj.get(curr);\n    System.out.println(curr\
  \ + \" - \" + depth);\n    for (Edge adn : adl) {\n        if (visited[adn.dest]\
  \ == false) {\n            visited[adn.dest] = true;\n            que.add(adn.dest);\n\
  \            level[adn.dest] = depth + 1;\n        }\n    }\n}\n```\n\n**分析：** 与相邻节点一起，它们到源点的距离也被添加到队列中。\n\
  \n### BFS 距离\n\n**问题：** 找到图中源顶点和目标顶点之间的距离。\n\n**示例 12.13：**\n\n```java\npublic static\
  \ int bfsDistance(Graph gph, int source, int dest) {\n    int count = gph.count;\n\
  \    boolean[] visited = new boolean[count];\n    LinkedList<Integer> que = new\
  \ LinkedList<Integer>();\n    que.add(source);\n    visited[source] = true;\n  \
  \  int[] level = new int[count];\n    level[source] = 0;\n    while (que.isEmpty()\
  \ == false) {\n        int curr = que.remove();\n        int depth = level[curr];\n\
  \        LinkedList<Edge> adl = gph.Adj.get(curr);\n        for (Edge adn : adl)\
  \ {\n            if (adn.dest == dest) {\n                return depth;\n      \
  \      }\n            if (visited[adn.dest] == false) {\n                visited[adn.dest]\
  \ = true;\n                que.add(adn.dest);\n                level[adn.dest] =\
  \ depth + 1;\n            }\n        }\n    }\n    return -1;\n}\n```\n\n**分析：**\
  \ 从源顶点开始对图进行 BFS 遍历，并在将相邻节点添加到队列之前记录它们的距离。如果找到了目标顶点，则返回它到源顶点的距离。如果目标顶点不可达，则返回 -1。\n\
  \n### 在无向图中查找环\n\n**问题：** 查找无向图中是否存在环。\n\n**解决方案：** 在单次 DFS 遍历中完成整个连通分遍历。因此，跟踪已访问顶点足以找到无向图中的环。\n\
  \n**示例 12.14：**\n\n```java\npublic static boolean isCyclePresentUndirected(Graph\
  \ graph, int index, int parentIndex, boolean[] visited) {\n    visited[index] =\
  \ true;\n    int dest;\n    LinkedList<Edge> adl = graph.Adj.get(index);\n    for\
  \ (Edge adn : adl) {\n        dest = adn.dest;\n        if (visited[dest] == false)\
  \ {\n            if (isCyclePresentUndirected(graph, dest, visited)) {\n       \
  \         return true;\n            }\n        } else if (parentIndex != dest) {\n\
  \            return true;\n        }\n    }\n    return false;\n}\n\npublic static\
  \ boolean isCyclePresentUndirected(Graph graph) {\n    int count = graph.count;\n\
  \    boolean[] visited = new boolean[count];\n    for (int i = 0; i < count; i++)\
  \ {\n        if (visited[i] == false)\n            if (isCyclePresentUndirected(graph,\
  \ i, -1, visited))\n                return true;\n    }\n    return false;\n}\n\
  ```\n\n**复杂度分析：** 对于邻接表实现的图，时间复杂度与 DFS 相同，为 `O(V+E)`；对于邻接矩阵实现，为 `O(V²)`。\n\n###\
  \ 在有向图中查找环\n\n**问题：** 给定一个有向图，查找图中是否存在环。单次遍历中，如果某个节点被遍历两次则存在环。\n\n**解决方案 1：** 我们将使用\
  \ DFS 遍历进行单次遍历；我们将使用一个标记数组来跟踪单次遍历中访问的节点数。\n\n**示例 12.15：** 使用标记数组查找图中是否存在环。\n\n\
  ```java\npublic static boolean isCyclePresentDFS(Graph graph, int index, boolean[]\
  \ visited, int[] marked) {\n    visited[index] = true;\n    marked[index] = 1;\n\
  \    LinkedList<Edge> adl = graph.Adj.get(index);\n    for (Edge adn : adl) {\n\
  \        int dest = adn.dest;\n        if (marked[dest] == 1)\n            return\
  \ true;\n        if (visited[dest] == false)\n            if (isCyclePresentDFS(graph,\
  \ dest, visited, marked))\n                return true;\n    }\n    marked[index]\
  \ = 0;\n    return false;\n}\n\npublic static boolean isCyclePresent(Graph graph)\
  \ {\n    int count = graph.count;\n    boolean[] visited = new boolean[count];\n\
  \    int[] marked = new int[count];\n    for (int i = 0; i < count; i++) {\n   \
  \     if (visited[i] == false)\n            if (isCyclePresentDFS(graph, index,\
  \ visited, marked))\n                return true;\n    }\n    return false;\n}\n\
  ```\n\n**复杂度分析：** 对于邻接表实现的图，时间复杂度与 DFS 相同，为 `O(V+E)`；对于邻接矩阵实现，为 `O(V²)`。\n\n**解决方案\
  \ 2：** 使用染色方法查找图中是否存在环。在染色方法中，初始化数组赋值为“白色”，表示节点未访问。当我们访问一个节点时，将其标记为“灰色”。如果再次遇到标记为“灰色”的节点，说明存在环。\n\
  \n**示例 12.16：** 使用染色方法检测。\n\n```java\npublic static boolean isCyclePresentColor(Graph\
  \ graph, int index, int[] visited) {\n    visited[index] = 1; // 1 表示灰色\n    int\
  \ dest;\n    LinkedList<Edge> adl = graph.Adj.get(index);\n    for (Edge adn : adl)\
  \ {\n        dest = adn.dest;\n        if (visited[dest] == 1) // 灰色\n         \
  \   return true;\n        if (visited[dest] == 0) // 白色\n            if (isCyclePresentColor(graph,\
  \ dest, visited))\n                return true;\n    }\n    visited[index] = 2;\
  \ // 2 表示黑色\n    return false;\n}\n\npublic static boolean isCyclePresentColor(Graph\
  \ graph) {\n    int count = graph.count;\n    int[] visited = new int[count];\n\
  \    for (int i = 0; i < count; i++) {\n        if (visited[i] == 0) // 白色\n   \
  \         if (isCyclePresentColor(graph, i, visited))\n                return true;\n\
  \    }\n    return false;\n}\n```\n\n### 图的转置\n\n**问题：** 图 G 的转置是图 G’，它具有相同的顶点集，但边的方向反转了。\n\
  \n**示例 12.17：**\n\n```java\npublic static Graph transposeGraph(Graph gph) {\n  \
  \  int count = gph.count;\n    Graph g = new Graph(count);\n    for (int i = 0;\
  \ i < count; i++) {\n        LinkedList<Edge> adl = gph.Adj.get(i);\n        for\
  \ (Edge adn : adl) {\n            int dest = adn.dest;\n            g.addDirectedEdge(dest,\
  \ i);\n        }\n    }\n    return g;\n}\n```\n\n**复杂度分析：** 邻接表实现图的时间复杂度为 `O(V+E)`，邻接矩阵实现为\
  \ `O(V²)`。\n\n### 测试无向图是否连通\n\n**问题：** 给定一个无向图。从任意顶点开始，如果我们通过 DFS 或 BFS 访问所有其他顶点，则该图是连通的。\n\
  \n**示例 12.18：**\n\n```java\npublic static boolean isConnectedUndirected(Graph gph)\
  \ {\n    int count = gph.count;\n    boolean[] visited = new boolean[count];\n \
  \   dfsUtil(gph, 0, visited);\n    for (int i = 0; i < count; i++) {\n        if\
  \ (visited[i] == false) {\n            return false;\n        }\n    }\n}\n```\n\
  \n\n\n\n\n```\n      }\n\n      return true;\n}\n```\n\n**复杂度分析**：对于邻接表实现的图，时间复杂度与\
  \ DFS 相同，为 O(V+E)；对于邻接矩阵实现，则为 O(V²)。\n\n### 强连通图\n\n如果有向图中每一对顶点 `u` 和 `v`，都存在一条从\
  \ `u` 到 `v` 的路径和一条从 `v` 到 `u` 的路径，则称该图是强连通的。\n\n要证明该图是连通图，我们需要证明任意一个顶点满足以下两个条件：\n\
  \n1) 第一个条件：每个顶点都可以从某个顶点 `u` 访问。或者说每个顶点从顶点 `u` 都可达。\n2) 第二个条件：顶点 `u` 从所有其他顶点可达。\n\
  \n第一个条件可以通过从某个顶点 `u` 执行 DFS 来验证。我们需要检查图中的所有顶点是否都已访问。第二个条件可以通过首先创建一个转置图 `G’` 来验证。然后从顶点\
  \ `u` 对图 `G’` 执行 DFS。如果在图 `G’` 中从 `u` 可以访问所有其他顶点，则意味着顶点 `u` 从原图 `G` 的所有顶点可达。\n\n\
  基于 DFS 查找图是否连通的 **Kosaraju 算法**：\n\n1) 创建一个大小为 `V` 的访问数组，并将数组中的所有顶点初始化为 `False`。\n\
  2) 选择任意顶点并对图执行 DFS 遍历。对于所有已访问的顶点，通过将它们在访问数组中的值设置为 `True` 来标记它们为已访问。\n3) 如果 DFS 遍历没有将所有顶点标记为\
  \ `True`，则返回 `false`。\n4) 找到图的转置或反转图。\n5) 对反转图重复第 1、2 和 3 步。\n6) 如果 DFS 遍历将所有顶点标记为\
  \ `True`，则返回 `true`。\n\n**示例 12.19：**\n\n```java\npublic static boolean isStronglyConnected(Graph\
  \ gph) {\n      int count = gph.count;\n      boolean visited[] = new boolean[count];\n\
  \      for (int i = 0; i < count; i++) {\n            visited[i] = false;\n    \
  \  }\n      dfsUtil(gph, 0, visited);\n      for (int i = 0; i < count; i++) {\n\
  \            if (visited[i] == false) {\n                  return false;\n     \
  \       }\n      }\n      Graph gReversed = transposeGraph(gph);\n      for (int\
  \ i = 0; i < count; i++) {\n            visited[i] = false;\n      }\n      dfsUtil(gReversed,\
  \ 0, visited);\n      for (int i = 0; i < count; i++) {\n            if (visited[i]\
  \ == false) {\n                  return false;\n            }\n      }\n      return\
  \ true;\n}\n```\n\n### 强连通分量\n\n**强连通分量**：有向图可能具有不同的强连通的子图。这些子图被称为强连通分量。在下面的图中，整个图并不是强连通的，但它的两个子图是强连通分量。\n\
  \n![](img/00242.jpeg)\n\n查找强连通分量的算法\n\n1) 创建一个空栈，对图 `G` 执行 DFS 遍历。对相邻顶点调用 DFS，并将它们压栈。\n\
  2) 反转图 `G` 以得到新图 `G’`。\n3) 通过从栈顶取出顶点，对图 `G’` 执行 DFS 遍历。\n4) 每一个强连通分量都在单次迭代中完成遍历。\n\
  \n**示例 12.20：**\n\n```java\npublic static void stronglyConnectedComponent(Graph\
  \ gph) {\n      int count = gph.count;\n      boolean[] visited = new boolean[count];\n\
  \      Stack<Integer> stk = new Stack<Integer>();\n      for (int i = 0; i < count;\
  \ i++) {\n            if (visited[i] == false) {\n                  dfsUtil2(gph,\
  \ i, stk);\n            }\n      }\n      Graph gReversed = transposeGraph(gph);\n\
  \      for (int i = 0; i < count; i++) {\n            visited[i] = false;\n    \
  \  }\n      Stack<Integer> stk2 = new Stack<Integer>();\n      while (stk.isEmpty()\
  \ == false) {\n            int index = stk.pop();\n            if (visited[index]\
  \ == false) {\n                  stk2.clear();\n                  dfsUtil2(gReversed,\
  \ index, stk2);\n                  System.out.println(stk2);\n            }\n  \
  \    }\n}\n```\n\n### 最小生成树 (MST)\n\n图 `G` 的 **生成树** 是一棵包含所有顶点的树。\n**最小生成树** 是其边长度/边权重之和尽可能小的生成树。\n\
  例如，如果你想在一组城市之间建立通信，你可能希望使用尽可能少的电线。MST 可以用于寻找网络路径并估算电线数量。\n\n![](img/0243.jpeg)\n\
  \n### 用于 MST 的 Prim 算法\n\nPrim 算法每次添加一条边来生长一棵单树 `T`，直到它成为生成树。\n我们初始化 `T` 为空边集，`U`\
  \ 为包含单个节点。其中 `T` 是生成树的边集，`U` 是生成树的顶点集。\n在每一步中，Prim 算法会添加一条端点在 `U` 中而另一端不在 `U` 中的最小权重边。由于每条边都会向\
  \ `U` 添加一个新顶点，在 `n` 次操作后，`U` 包含了所有顶点。\n\n**示例 12.21：**\n\n```text\n// 使用 Prim 算法找到\
  \ MST\n// 输入: 一个加权连通图 G\n// 输出: 组成 MST 的边集\nAlgorithm Prim(G)\n    T = {}\n    Let\
  \ r be any vertex in G\n    U = {r}\n    for i = 1 to |V| do\n        e = minimum-weight\
  \ edge (u, v) where u in U and v not in U\n        T = T + e\n```使用优先队列的 Prim 算法时间复杂度为\
  \ O(E log V)，其中 T 是生成树。\n\n**示例 12.22：** 邻接表实现的 Prim 算法。\n\n```java\npublic static\
  \ void prims(Graph gph) {\n      int count = gph.count;\n      int[] previous =\
  \ new int[count];\n      int[] dist = new int[count];\n      boolean[] visited =\
  \ new boolean[count];\n      int source = 1;\n      for (int i = 0; i < count; i++)\
  \ {\n            previous[i] = -1;\n            dist[i] = 99999; // infinite\n \
  \     }\n      dist[source] = 0;\n      previous[source] = -1;\n      EdgeComparator\
  \ comp = new EdgeComparator();\n      PriorityQueue<Edge> queue = new PriorityQueue<Edge>(100,\
  \ comp);\n      Edge node = new Edge(source, 0);\n      queue.add(node);\n     \
  \ while (queue.isEmpty() != true) {\n            node = queue.peek();\n        \
  \    queue.remove();\n            visited[source] = true;\n            source =\
  \ node.dest;\n            LinkedList<Edge> adl = gph.get(source);\n            for\
  \ (Edge adn : adl) {\n              int dest = adn.dest;\n              int alt\
  \ = adn.cost;\n              if (dist[dest] > alt && visited[dest] == false) {\n\
  \                  dist[dest] = alt;\n                  previous[dest] = source;\n\
  \                  node = new Edge(dest, alt);\n                  queue.add(node);\n\
  \              }\n            }\n      }\n      //打印结果\n      int count = gph.count;\n\
  \      for (int i = 0; i < count; i++) {\n            if (dist[i] == Integer.MAX_VALUE)\
  \ {\n              System.out.println(\"node id \" + i + \" prev \" + previous[i]\
  \ + \" distance : Unreachable\");\n            } else {\n              System.out.println(\"\
  node id \" + i + \" prev \" + previous[i] + \" distance : \" + dist[i]);\n     \
  \       }\n      }\n}\n```\n\n**示例 12.23：** 邻接矩阵实现的 Prim 算法。\n\n```java\npublic\
  \ static void prims(GraphAM gph) {\n      int[] previous = new int[gph.count];\n\
  \      int[] dist = new int[gph.count];\n      boolean[] visited = new boolean[gph.count];\n\
  \      int source = 0;\n      for (int i = 0; i < gph.count; i++) {\n          \
  \  previous[i] = -1;\n            dist[i] = Integer.MAX_VALUE; // infinite\n   \
  \         visited[i] = false;\n      }\n      dist[source] = 0;\n      previous[source]\
  \ = -1;\n      EdgeComparator comp = new EdgeComparator();\n      PriorityQueue<Edge>\
  \ queue = new PriorityQueue<Edge>(100, comp);\n      Edge node = new Edge(source,\
  \ 0);\n      queue.add(node);\n}\n```\n\n\n\n\n\n```java\nwhile (queue.isEmpty()\
  \ != true) {\n    node = queue.peek();\n    queue.remove();\n    source = node.dest;\n\
  \    visited[source] = true;\n    for (int dest = 0; dest < gph.count; dest++) {\n\
  \        int cost = gph.adj[source][dest];\n        if (cost != 0) {\n         \
  \   int alt = cost;\n            if (dist[dest] > alt && visited[dest] == false)\
  \ {\n                dist[dest] = alt;\n                previous[dest] = source;\n\
  \                node = new Edge(dest, alt);\n                queue.add(node);\n\
  \            }\n        }\n    }\n}\nint count = gph.count;\nfor (int i = 0; i <\
  \ count; i++) {\n    if (dist[i] == Integer.MAX_VALUE) {\n        System.out.println(\"\
  \ \\n node id \" + i + \" prev \" + previous[i] + \" distance : Unreachable\");\n\
  \    } else {\n        System.out.println(\" node id \" + i + \" prev \" + previous[i]\
  \ + \" distance : \" + dist[i]);\n    }\n}\n\nprivate static class Edge {\n    private\
  \ int dest;\n    private int cost;\n    public Edge(int dst, int cst) {\n      \
  \  dest = dst;\n        cost = cst;\n    }\n}\n\nstatic class EdgeComparator implements\
  \ Comparator<Edge> {\n    public int compare(Edge x, Edge y) {\n        if (x.cost\
  \ < y.cost) {\n            return -1;\n        }\n        if (x.cost > y.cost) {\n\
  \            return 1;\n        }\n        return 0;\n    }\n}\n```\n\n### Kruskal\
  \ 算法\n\nKruskal 算法重复选择不形成环的最小权重边。\n\n- 按权重的非递减序对边进行排序：`c (e1) ≤ c (e2) ≤ · · · ≤\
  \ c (em)`。\n- 将 `T` 设置为空空树。\n- 逐个添加边，前提是不创建环。\n- 通过 Kruskal 算法返回最小生成树 (MST)。\n-\
  \ 输入：一个加权连通图 `G = (V, E)`。\n- 输出：构成 MST 的边集。\n\n**算法 Kruskal(G)**\n1. 按权重对边 `E`\
  \ 进行排序。\n2. `T = {}`\n3. 当 `|T| + 1 < |V|` 时\n    - `e = E 中的下一条边`\n    - 如果 `T\
  \ + {e}` 不包含环则 `T = T + {e}`\n4. 返回 `T`\n\n在使用高效环检测的情况下，Kruskal 算法的复杂度为 `O(E log\
  \ V)`。\n\n### 图中的最短路径算法\n\n### 单源路径\n对于图 `G = (V, E)`，单源最短路径问题是寻找从给定顶点 `s` 到 `V`\
  \ 中所有顶点的最短路径。\n\n### 无权图的单源路径\n寻找无权图或所有顶点权重相同的图的源最短路径。给定一个起始顶点 `s`，寻找从 `s` 到图中所有其他顶点的最小边数。\n\
  \n**示例 1.24:**\n```java\npublic static void shortestPath(Graph gph, int source)\
  \ {\n    int curr;\n    int count = gph.count;\n    int[] distance = new int[count];\n\
  \    int[] path = new int[count];\n    for (int i = 0; i < count; i++) {\n     \
  \   distance[i] = -1;\n    }\n    Queue<Integer> que = new LinkedList<Integer>();\n\
  \    que.add(source);\n    distance[source] = 0;\n    while (que.isEmpty() == false)\
  \ {\n        curr = que.remove();\n        LinkedList<Edge> adl = gph.Adj.get(curr);\n\
  \        for (Edge adn : adl) {\n            if (distance[adn.dest] == -1) {\n \
  \               distance[adn.dest] = distance[curr] + 1;\n                path[adn.dest]\
  \ = curr;\n                que.add(adn.dest);\n            }\n        }\n    }\n\
  \    for (int i = 0; i < count; i++) {\n        System.out.println(path[i] + \"\
  \ to \" + i + \" weight \" + distance[i]);\n    }\n}\n```\n**分析：**\n- 首先，将起始点 `source`\
  \ 添加到队列中。\n- 执行广度优先遍历。\n- 距离源越近的节点先被遍历和处理。\n\n### Dijkstra 算法\nDijkstra 算法用于无负权重的加权边的单源最短路径问题。给定一个加权连通图\
  \ `G`，寻找从源顶点 `s` 到其他每个顶点的最短路径。Dijkstra 算法与 Prim 算法相似。它维护一个已知最短路径的节点集合。\n\n该算法通过跟踪每个节点的距离及其父节点开始。初始时，将所有距离设置为无穷大，因为我们不知道到达顶点的实际路径，且所有顶点的父节点都设置为\
  \ null。所有顶点都被添加到优先级队列（最小堆实现）。\n\n在每一步中，算法从优先级队列中取出一个顶点（开始时为源顶点）。然后更新所有相邻顶点对应的距离列表。当队列为空时，就得到了完全填充的距离。\n\
  \n**通过 Dijkstra 算法解决单源最短路径 (SSSP)**\n- 输入：无负权重的加权连通图 `G = (V, E)` 和源顶点 `s`。\n- 输出：从\
  \ `s` 到每个 `v` 的距离。\n\n**算法 Dijkstra(G)**\n1. 对于 `V` 中的每个顶点 `v`\n    - `D[v] =无穷大`\
  \ // 未知距离\n    - `P[v] = null` // 未知父节点\n    - 将 `v` 添加到优先级队列\n2. `D[source] = 0`\
  \ // 源到源的距离\n3. 当优先级队列不为空时\n    - 从队列中取出 `D[u]` 最小的顶点\n    - 从队列中移除 `u`\n    - 对于\
  \ `u` 的每个相邻顶点 `v`\n        - `alt = D[u]` \n        - 如果 `alt < D[v]`\n        \
  \    - `D[v] = alt`\n            - `P[v] = u`\n4. 返回 `D[], P[]`\n\n时间复杂度为 `O(|E|log|V|)`，其中\
  \ `V` 是顶点数，`E` 是边数。\n注意：Dijkstra 算法不适用于负权图。\n注意：Dijkstra 算法适用于无向图和有向图。\n\n**示例 25:**\
  \ 邻接表实现的 Dijkstra 算法。\n```java\npublic static void dijkstra(Graph gph, int source)\
  \ {\n    int[] previous = new int[gph.count];\n    int[] dist = new int[gph.count];\n\
  \    boolean[] visited = new boolean[gph.count];\n    for (int i = 0; i < gph.count;\
  \ i++) {\n        previous[i] = -1;\n        dist[i] = 99999; // infinite\n    }\n\
  \    dist[source] = 0;\n    previous[source] = -1;\n    EdgeComparator comp = new\
  \ EdgeComparator();\n    PriorityQueue<Edge> queue = new PriorityQueue<Edge>(0,\
  \ comp);\n    Edge node = new Edge(source, 0);\n    queue.add(node);\n    while\
  \ (queue.isEmpty() != true) {\n        node = queue.peek();\n        queue.remove();\n\
  \        source = node.dest;\n        visited[source] = true;\n        LinkedList<Edge>\
  \ adl = gph.Adj.get(source);\n        for (Edge adn : adl) {\n            int dest\
  \ = adn.dest;\n            int alt = adn.cost + dist[source];\n            if (dist[dest]\
  \ > alt && visited[dest] == false) {\n                dist[dest] = alt;\n      \
  \          previous[dest] = source;\n                node = new Edge(dest, alt);\n\
  \                queue.add(node);\n            }\n        }\n    }\n    int count\
  \ = gph.count;\n    for (int i = 0; i < count; i++) {\n        if (dist[i] == Integer.MAX_VALUE)\
  \ {\n            System.out.println(\"\\n node id \" + i + \" prev \" + previous[i]\
  \ + \" distance : Unreachable\");\n        } else {\n            System.out.println(\"\
  \ node id \" + i + \" prev \" + previous[i] + \" distance : \" + dist[i]);\n   \
  \     }\n    }\n}\n```\n\n\n\n\n```java\nif (x.cost > y.cost) {\n    return 1;\n\
  }\nreturn 0;\n}\n```\n\n### 示例 12.26：基于邻接矩阵实现的图的 Dijkstra 算法。\n\n```java\npublic\
  \ static void dijkstra(GraphAM gph, int source) {\n    int[] previous = new int[gph.count];\n\
  \    int[] dist = new int[gph.count];\n    boolean[] visited = new boolean[gph.count];\n\
  \    for (int i = 0; i < gph.count; i++) {\n        previous[i] = -1;\n        dist[i]\
  \ = Integer.MAX_VALUE; // infinite\n        visited[i] = false;\n    }\n    dist[source]\
  \ = 0;\n    previous[source] = -1;\n    EdgeComparator comp = new EdgeComparator();\n\
  \    PriorityQueue<Edge> queue = new PriorityQueue<Edge>(100, comp);\n    Edge node\
  \ = new Edge(source, 0);\n    queue.add(node);\n    while (queue.isEmpty() != true)\
  \ {\n        node = queue.peek();\n        queue.remove();\n        source = node.dest;\n\
  \        visited[source] = true;\n        for (int dest = 0; dest < gph.count; dest++)\
  \ {\n            int cost = gph.adj[source][dest];\n            if (cost != 0) {\n\
  \                int alt = cost + dist[source];\n                if (dist[dest]\
  \ > alt && visited[dest] == false) {\n                    dist[dest] = alt;\n  \
  \                  previous[dest] = source;\n                    node = new Edge(dest,\
  \ alt);\n                    queue.add(node);\n                }\n            }\n\
  \        }\n    }\n    int count = gph.count;\n    for (int i = 0; i < count; i++)\
  \ {\n        if (dist[i] == Integer.MAX_VALUE) {\n            System.out.println(\"\
  \ node id \" + i + \" prev \" + previous[i] + \" distance : Unreachable\");\n  \
  \      } else {\n            System.out.println(\" node id \" + i + \" prev \" +\
  \ previous[i] + \" distance : \" + dist[i]);\n        }\n    }\n}\nprivate static\
  \ class Edge {\n    private int dest;\n    private int cost;\n    public Edge(int\
  \ dst, int cst) {\n        dest = dst;\n        cost = cst;\n    }\n}\nstatic class\
  \ EdgeComparator implements Comparator<Edge> {\n    public int compare(Edge x, Edge\
  \ y) {\n        if (x.cost < y.cost) {\n            return -1;\n        }\n    \
  \    if (x.cost > y.cost) {\n            return 1;\n        }\n        return 0;\n\
  \    }\n}\n```\n\n### Bell Ford 最短路径\n\nBell Ford 算法用于在包含负边但无负环的图中，计算从源顶点 `s` 到所有其他顶点的单源最短路径。如果图中存在总权值为负的环，则该算法无法工作。在该算法中，所有顶点的距离被赋值为\
  \ $\\infty$，源点的距离被赋值为 0。然后对所有边进行 $V-1$ 次（$V$ 是顶点总数）遍历，并更新每个顶点的终点距离。\n\n我们可以再次检查所有边，如果距离的权重发生变化，则检测到负环。如果在\
  \ $V-1$ 次松弛操作后距离发生变化，则说明存在负环。如果某次迭代没有修改距离估计值，我们可以停止算法。这在最短路径可能小于 $V-1$ 时是有益的。\n\n\
  时间复杂度为 $[O(V.E)](https://xlinux.nist.gov/dads/HTML/bigOnotation.html)，其中 $V$ 是顶点数，$E$\
  \ 是边的总数。\n\n![Images/00245.jpeg](img/00246.jpeg)\n![Images/00247.jpeg](img/00248.jpeg)\n\
  ![Images/00249.jpeg)\n\n### 示例 12.27：\n\n```java\npublic static void bellmanFordshortestPath(Graph\
  \ gph, int source) {\n    int count = gph.count;\n    int[] distance = new int[count];\n\
  \    int[] path = new int[count];\n    for (int i = 0; i < count; i++) {\n     \
  \   distance[i] = 999999; // infinite\n        path[i] = -1;\n    }\n    distance[source]\
  \ = 0;\n    // 外层循环将运行 (V-1) 次。\n    // 内层 for 循环和 while 循环合并运行\n    // 将运行 E 次边。\n\
  \    // 这使得总复杂度为 O(V*E)\n    for (int i = 0; i < count - 1; i++) {\n        for\
  \ (int j = 0; j < count; j++) {\n            LinkedList<Edge> adl = gph.Adj(j);\n\
  \            for (Edge adn : adl) {\n                int newDistance = distance[j]\
  \ + adn.cost;\n                if (distance[adn.dest] > newDistance) {\n       \
  \             distance[adn.dest] = newDistance;\n                    path[adn.dest]\
  \ = j;\n                }\n            }\n        }\n    }\n    for (int i = 0;\
  \ i < count; i++) {\n        // ... 输出逻辑\n    }\n}\n```\n\n### 全对最短路径\n\n给定一个加权图\
  \ $G(V, E)$，全对最短路径问题用于寻找顶点 $u, v$ 之间的最短路径。复杂度为 $V$。\n\n### 哈密顿路径与回路\n\n哈密顿路径是每个顶点恰好访问一次的路径，它不需要回到起点。哈密顿路径问题是一个\
  \ NP 问题，通过回溯从顶点 `s` 开始并尝试所有顶点。\n\n### 示例 12.28：\n\n```java\npublic static boolean\
  \ hamiltonianUtil(GraphAM graph, int path[], int pSize, int added[]) {\n    // 基准情况：找到完整路径\n\
  \    if (pSize == graph.count) {\n        return true;\n    }\n    for (int vertex\
  \ = 0; vertex < graph.count; vertex++) {\n        // 路径最后一个元素与下一个顶点之间有路径\n     \
  \   // 且下一个顶点未包含在路径中\n        if ((pSize == 0 || graph.adj[path[pSize - 1]][vertex]\
  \ == 1) && added[vertex] == 0) {\n            path[pSize++] = vertex;\n        \
  \    added[vertex] = 1;\n            if (hamiltonianUtil(graph, path, pSize, added))\
  \ {\n                return true;\n            }\n            // 回溯\n          \
  \  pSize--;\n            added[vertex] = 0;\n        }\n    }\n    return false;\n\
  }\n\npublic static boolean hamiltonianPath(GraphAM graph) {\n    int[] path = new\
  \ int[graph.count];\n    int[] added = new int[graph.count];\n    if (hamiltonianUtil(graph,\
  \ path, 0, added)) {\n        System.out.println(\"找到哈密顿路径：\");\n        for (int\
  \ i = 0; i < graph.count; i++) {\n            System.out.println(\" \" + path[i]);\n\
  \        }\n        return true;\n    }\n    System.out.println(\"未找到哈密顿路径\");\n\
  \    return false;\n}\n```\n\n哈密顿回路是在其最后一个顶点到第一个顶点之间存在边的哈密顿路径。哈密顿回路的求解也是一个 NP 问题。唯一的区别在于基准条件，即哈密顿路径的最后一个节点到第一个元素之间是否存在路径。\n\
