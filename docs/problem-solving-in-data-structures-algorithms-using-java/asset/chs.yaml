  ## 本书关于什么\n\n本书将向你介绍数据结构和算法的世界。数据结构定义了在内存中安排数据的方式，以便快速高效地访问；而算法则是通过操作这些数据结构解决问题的一系列指令。\n\
  \n设计高效的算法是一项非常重要的技能，所有的软件公司（如微软、谷歌、脸等）都在追求这一点。这些公司的大多数面试都专注于数据结构和算法的知识。除了掌握一种编程语言外，你还需要熟练掌握这些关键计算机基础知识，不仅为了通过面试，还能让你在软件工程师的工作中表现出色。\n\
  \n\n\n\n\n本书假设你是一个 Java 语言开发者。你不是 Java 语言的专家，但你非常熟悉类、函数、数组、指针和递归等概念。在本书开头，我们将介绍复杂度分析，然后是各种数据结构及其算法。我们将学习\
  \ `Linked-List`（链表）、`Stack`（栈）、`Queue`（队列）、`Trees`（树）、`Heap`（堆）、`Hash-Table`（哈表）和\
  \ `Graphs`（图）。我们还将学习排序和搜索技术。\n\n在最后几章，我们将介绍各种算法技术，例如：`Brute-Force algorithms`（暴力算法）、`Greedy\
  \ algorithms`贪心算法、`Divide and Conquer algorithms`分治算法、`Dynamic Programming`动态规划、`Reduction`归约法和`Backtracking`回溯算法。\n\
  \n## 准备计划\n\n通常情况下，在参加下次面试之前你有几个月的时间，因此有一个完善的准备计划至关重要。准备计划取决于准备时长以及你计划目标的公司。以下是针对\
  \ 1 个月、3 个月和 5 个月期限的准备计划。\n\n### 1 个月准备计划\n\n此计划适用于熟悉数据结构和算法概念，并只想复习这些概念并在一个月后参加面试的人员。以下是我们需要学习的主题列表，以及在一个月内完成准备的大致所需时间。这些是参加面试前必须准备的最关键的章节。\n\
