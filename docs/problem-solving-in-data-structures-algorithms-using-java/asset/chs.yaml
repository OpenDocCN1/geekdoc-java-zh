  | `BuildHeap` | 从元素数组构建一个新堆 | O(logn) |\n\n## 堆上的操作\n\n在详细查看如何初始化堆、向其添加或删除元素之前，我们需要理解涉及堆的两个重要操作。这些操作用于在单个元素偏离其位置时恢复堆的顺序属性。\n\
  \n这分为两种情况：\n\n1. 当一个节点（父节点）与其子节点不符合堆属性时。这通过 `procolateDown()` 操作解决，在该操作会将父节点的值与其中一个子节点的值交换，并递归地恢复堆属性。\n\
  \n2. 当一个节点（子节点）与其父节点不符合堆属性时。这通过 `proclateUp()` 或 `bubbleUp()` 操作解决，在该操作会将子节点的值与父节点的值交换，并递归地恢复堆属性。\n\
  \n**示例 10.1：** 下面是 `proclateUp` 和 `proclateDown` 操作的代码。\n\n```java\nprivate void\
  \ proclateDown(int position) {\n    int lChild = 2 * position + 1;\n    int rChild\
  \ = lChild + 1;\n    int child = -1;\n    int temp;\n    if (lChild < size) {\n\
  \        child = lChild;\n    }\n    if (rChild < size && compare(arr, rChild, lChild))\
  \ {\n        child = rChild;\n    }\n    if (child != -1 && compare(arr, child,\
  \ position)) {\n        temp = arr[position];\n        arr[position] = arr[child];\n\
  \        arr[child] = temp;\n        proclateDown(child);\n    }\n}\n\nprivate void\
  \ proclateUp(int position) {\n    int parent = (position - 1) / 2;\n    int temp;\n\
  \    if (parent == 0) {\n        return;\n    }\n    if (compare(arr, parent, position))\
  \ {\n        temp = arr[position];\n        arr[position] = arr[parent];\n     \
  \   arr[parent] = temp;\n        proclateUp(parent);\n    }\n}\n\nboolean compare(int[]\
  \ arr, int first, int second) {\n    if (isMinHeap)\n        return (arr[first]\
  \ < arr[second]); // 最小堆比较\n    return (arr[first] > arr[second]); // 最大堆比较\n}\n\
  ```\n\n堆使用类表示。堆类的以下元素是：\n\n* `array`：用于存储堆的数组。\n* `capacity`：数组的容量。\n* `size`：堆中元素的数量。\n\
  * `isMinHeap`：最小堆为 1，最大堆为为 0。\n\n**示例 10.2：**\n\n```java\npublic class Heap {\n\
  \    private static final int CAPACITY = 32;\n    private int size; // 堆中元素的数量\n\
  \    private int[] arr; // 堆数组\n    boolean isMinHeap;\n\n    // 方法。\n    public\
  \ boolean isEmpty() {\n        return (size == 0);\n    }\n    public int size()\
  \ {\n        return size;\n    }\n    public int peek() {\n        if (isEmpty())\
  \ {\n            throw new IllegalStateException();\n        }\n        return arr[0];\n\
  \    }\n}\n```\n\n`isEmpty()` 在堆为空时返回 true，否则返回 false。\n`size()` 返回堆中元素的数量。\n`peek()`\
  \ 将返回堆中的最高元素且不删除它。\n\n### 从数组创建堆\n\n堆化（Heapify）是将数组转换为堆的过程。各个步骤如下：\n\n1. 数组中存在这些值。\n\
  2. 从数组的中间开始向数组开头移动。在每一步中，比较父节点的值与其左孩子和右孩子的值。此外，通过将父节点值与其值最大的子节点交换来恢复堆属性，使得父节点值始终大于或等于左孩子。\n\
  3. 对于从数组中间到开头的所有元素。我们进行比较并移动，直到到达堆的叶子节点。\n\n| 图片 | 描述 |\n| :--- | :--- |\n| 185.jpeg\
  \ | 给定一个数组作为输入创建堆。索引 `i` 的值与其索引为 `i*2 + 1` 和 `i*2 + 2` 的子节点值进行比较。列表中间 `N/2`（即索引\
  \ 3）与 7 进行比较。如果子节点值大于父节点值，则会进行交换。 |\n| 186.jpeg | 同样，索引 2 的值与 5 和 6 比较。所有值中最大的 7\
  \ 将与索引 2 的值交换。 |\n| 187.jpeg | 同样，索引 1 的值与 3 和 4 比较。所有值中最大的 8 将与索引 1 的值交换。 |\n|\
  \ 188.jpeg | 下沉函数（Percolate down）用于通过与其子节点比较来调整上一步中的值。 |\n| 189.jpeg | 现在索引 0 的值与\
  \ 1 和 2 比较。8 是最大值，因此它与索引 0 的值交换。 |\n| 190.jpeg | 使用下沉函数进一步比较索引 1 的值与其索引为 3 和 4 的子节点。\
  \ |\n| 191.jpeg | 最终创建了最大堆。 |\n\n**示例 10.3：** 从数组初始化堆\n\n```java\npublic Heap(int[]\
  \ array, boolean isMin) {\n    size = array.length;\n    arr = array;\n    isMinHeap\
  \ = isMin;\n    // 在数组上执行堆操作\n    for (int i = (size / 2); i >= 0; i--) {\n    \
  \    proclateDown(i);\n    }\n}\n```\n\n**分析：** 可以通过传递一个数组来初始化堆。在数组上调用 `Heapify()`\
  \ 函数使其变为堆。\n\n构建堆的时间复杂度为 `O(N)`。\n\n比较次数与节点的高度有关。总比较次数可以表示为：`(1*n/4) + (2*n/8) +\
  \ (3*n/16)……((h-1)*1) == N`\n\n其中 `h` 是堆的高度。\n\n### 初始化空堆\n\n**示例 10.4：**\n\n```java\n\
  public Heap(boolean isMin) {\n    arr = new int[CAPACITY];\n    size = 0;\n    isMinHeap\
  \ = isMin;\n}\n```\n\n**分析：** 通过创建一个空数组创建空堆。由于堆是空的，我们不需要任何堆化操作。\n\n### 入队 / 添加\n\
  \n1. 将新元素添加到数组末尾。这保持了完全二叉树的形式，但由于新元素的值可能大于其父节点的值，它不再是一个堆。\n2. 将新元素与父节点交换，直到其值大于父节点的值。\n\
  3. 当新元素到达根节点或父节点的值大于等于新元素的值时，步骤 2 停止。\n\n让我们取上方创建的最大堆示例。\n\n![](img/0192.jpeg)\n\
  \n让我们通过插入值为 9 的元素来进行示例。元素被添加到数组末尾。现在将通过与其父节点比较进行上浮。元素被添加到索引 8，其父节点为 `(N-1)/2 = 3`。\n\
  \n| 图片 | 描述 |\n| :--- | :--- |\n| 193.jpeg | 新值 9 被添加到数组末尾。由于值 9 大于 4，它将与之交换。 |\n\
  | 194.jpeg | 使用上浮操作并移动值，直到满足堆属性。 |\n| 195.jpeg | 现在索引 1 的值与索引 0 比较，为了满足堆属性进行进一步交换。\
  \ |\n| 196.jpeg | 现在，通过插入新节点最终了最大堆。 |\n\n**示例 10.5：**\n\n```java\npublic void add(int\
  \ value) {\n    if (size == arr.length) {\n        doubleSize();\n    }\n    arr[size++]\
  \ = value;\n    proclateUp(size - 1);\n}\n\nprivate void doubleSize() {\n    int[]\
  \ old = arr;\n    arr = new int[arr.length * 2];\n    System.arraycopy(old, 0, arr,\
  \ 0, size);\n}\n```\n\n**分析：** 我们检查堆是否已满。如果堆已满，则创建一个容量翻倍的新数组。将堆的内容复制其中。然后将新元素添加到堆中，最后使用\
  \ `proclateUp()` 操作恢复堆属性。\n\n在堆中插入的时间复杂度为 O(logn)\n\n\n\n\n\n# 出队 / 删除 (Dequeue\
  \ / remove)\n\n1. 将堆根的值复制到将用于返回该值的变量中。\n2. 将堆的最后一个元素复制到根节点，然后将堆的大小减 1。这个元素被称为“离位”元素。\n\
  3. 通过将离位元素与其值最大的子节点进行交换来恢复堆的性质。重复此过程，直到该离位元素到达叶节点，或其值大于或等于所有子节点的值。\n4. 返回在第 1 步中保存的答案。\n\
  \n| ![](img/00197.jpeg) | 堆开始和结束的值进行交换。堆的大小减 1。堆的性质被破坏，因此我们需要通过将节点与其子节点比较来下沉并恢复堆的性质。\
  \ |\n| ![](img/00198.jpeg) | 通过与其子节点比较继续下沉。 |\n| ![](img/00199.jpeg) | 下沉 |\n| ![](img/00200.jpeg)\
  \ | 下沉完成 |\n\n**示例 10.6:**\n\n```java\npublic int remove() {\n    if (isEmpty())\
  \ {\n        throw new IllegalStateException();\n    }\n    int value = arr[0];\n\
  \    arr[0] = arr[size - 1];\n    size--;\n    proclateDown(0);\n    return value;\n\
  }\n```\n\n**分析:** 堆顶的值与堆数组末尾的值进行交换。堆的大小减 1，并调用 `proclateDown` 来恢复堆的性质。\n删除堆中元素的时间复杂度为\
  \ O(logn)。\n\n```java\npublic static void main(String[] args) {\n    int[] a = {\
  \ 1, 9, 6, 7, 8, 0, 2, 4, 5, 3 };\n    Heap hp = new Heap(a, false);\n    hp.print();\n\
  \    System.out.println();\n    while (!hp.isEmpty()) {\n        System.out.print(hp.remove()\
  \ + \" \");\n    }\n}\n```\n\n# 堆排序 (Heap-Sort)\n\n1. 使用创建堆函数从给定的元素列表构建一个最大堆。此操作将花费\
  \ O(N) 时间。\n2. 从堆中出队最大值，并将该值存储在数组末尾的位置 `arr[size-1]`。\n    a) 将堆根的值复制到数组末尾。\n  \
  \  b) 将堆的最后一个元素复制到根节点，然后将堆的大小减 1。这个元素被称为“离位”元素。\n    c) 通过将离位元素与其值最大的子节点进行交换来恢复堆的性质。重复此过程，直到该离位元素到达叶节点，或其值大于或等于所有子节点的值。\n\
  3. 重复此操作，直到堆中只剩一个元素。\n\n让我们以章节开头已经创建的堆为例。堆排序算法从创建给定列表的堆开始，这在在线性时间内完成。然后在每一步中，堆的头部与堆的末尾交换，堆的大小减\
  \ 1。然后使用下沉来恢复堆的性质。此外，重复多次，直到堆中只包含一个元素。\n\n| ![](img/00201.jpeg) | 从输入数组创建最大堆。 |\n\
  | ![](img/00202.jpeg) | 最大值（堆数组的第一个元素）与数组的最后一个元素交换。现在最大值在数组末尾。然后我们将堆的大小减 1。 |\n\
  | ![](img/00203.jpeg) | 因为 2 在堆的顶部。它的堆性质丢失了。我们将使用下沉方法来恢复堆的性质。 |\n| ![](img/00204.jpeg)\
  \ | 继续下沉。 |\n| ![](img/00205.jpeg) | 恢复了堆的性质。 |\n| ![](img/00206.jpeg) | 我们将堆数组的第一个元素复制到倒数第二个位置。堆的大小进一步减\
  \ 1。 |\n| ![](img/00207.jpeg) | 堆的性质丢失。执行下沉以恢复堆的性质。 |\n| ![](img/00208.jpeg) | 继续下沉。\
  \ |\n| ![](img/00209.jpeg) | 恢复了堆的性质。 |\n| ![](img/00210.jpeg) | 交换堆数组中的第一个和最后一个值。减小堆的大小。\
  \ |\n| ![](img/00211.jpeg) | 下沉。 |\n| ![](img/00212.jpeg) | 恢复了堆的性质。 |\n| ![](img/00213.jpeg)\
  \ | 交换堆数组的第一个和最后一个元素。堆的大小减 1。 |\n| ![](img/00214.jpeg) | 堆性质丢失，因此执行下沉。 |\n| ![](img/00215.jpeg)\
  \ | 交换堆数组中的第一个和最后一个值。堆的大小减 1。 |\n| ![](img/00216.jpeg) | 结束。 |\n\n**示例 10.7:**\n\
  \n```java\npublic static void heapSort(int[] array, boolean inc) {\n    Heap hp\
  \ = new Heap(array, !inc);\n    for (int i = 0; i < array.length; i++) {\n     \
  \   array[array.length - i - 1] = hp.remove();\n    }\n}\n\npublic static void main(String[]\
  \ args) {\n    int[] a1 = { 1, 9, 6, 7, 8, 0, 2, 4, 5, 3 };\n    heapSort(a1, true);\n\
  \    for (int i = 0; i < a1.length; i++) {\n        System.out.print(a1[i] + \"\
  \ \");\n    }\n}\n```\n\n| 数据结构 | 列表 |\n| :--- | :--- |\n| 最坏情况时间复杂度 | O(logn) |\n\
  | 最优情况时间复杂度 | O(logn) |\n| 平均情况时间复杂度 | O(logn) |\n| 空间复杂度 | O(1) |\n\n时间复杂度：构建输入数组的堆需要\
  \ O(n) 时间，每个元素的移除和添加到堆中需要 O(logn)。因此，总时间复杂度将为 O(nlogn)[注：此处原文漏了 n，根据逻辑翻译保留] 修正：构建输入数组的堆需要\
  \ O(n) 时间，每个元素的移除和添加到堆中需要 O(logn)。因此，总时间复杂度将为 O(logn)。\n\n# 堆的用途\n\n1. **堆排序**：当需要移除具有最高（或最低）优先级的对象时。\n\
  2. **选择算法**：使用堆寻找最小、最大值、中位数，\n甚至是第 k 大元素，可以在线性时间内完成。\n3. **优先级队列**：用于图算法如 [Prim\
  \ 算法](https://en.wikipedia.org/wiki/Prim's_algorithm) 和 [Dijkstra 算法](https://en.wikipedia.org/wiki/Dijkstra's_algorithm)。\n\
  4. **图算法**：当堆作为内部数据结构时，运行时间将减少。此外，一些更复杂的堆（如二项堆）可以高效合并，这对于二叉树来说很难。\n\n## 堆的问题\n\n\
  ### 使用最小堆求第 K 小\n\n**问题**：给定一个无序数组，找到第 k 小的值。\n\n**方案一**：排序给定数组，然后返回索引 K-1 的值。复杂度为\
  \ O(NlogN)。\n\n**示例 10.8:**\n\n```java\npublic static int KthSmallest(int[] arr,\
  \ int size, int k) {\n    Arrays.sort(arr);\n    return arr[k - 1];\n}\n```\n\n\
  **方案二**：从数组创建一个最小堆，调用 `DeleteMin()` 操作 K 次，最后一次操作将得到第 K 小的值。时间复杂度为 O(logn)。\n\n\
  **示例 10.9:**\n\n```java\npublic static int KthSmallest2(int[] arr, int size, int\
  \ k) {\n    int i = 0;\n    int value = 0;\n    PriorityQueue<Integer> pq = new\
  \ PriorityQueue<Integer>();\n    for (i = 0; i < size; i++) {\n        pq.add(arr[i]);\n\
  \    }\n    while (i < size && i < k) {\n        value = pq.remove();\n        i\
  \ += 1;\n    }\n    return value;\n}\n```\n\n### 使用最大堆求第 K 大\n\n**问题**：给定一个无序数组，找到第\
  \ k 大元素。\n\n**方案**：与上述问题相同，我们将从输入数组创建一个最大堆。然后调用 `DeleteMax()` 操作 K 次，最后一次操作将得到第\
  \ K 大的值。时间复杂度为 O(logn)。\n\n### 无限数字流中的第 K 大/最小\n\n**问题**：在无限数字流中找到第 k 大的值。\n\n\n\
  \n\n\n**第一种解决方案：** 维护一个排序数组，其中包含 k 个最大的元素。对于流中的每个元素，将其与数组中的最小值进行比较。如果它小于该值，则忽略它。如果它大于数组中的最小值，则删除最小值并将新值插入到数组中适当的位置以保持其排序。这种解决方案的每次比较和插入操作需要\
  \ `O(K)` 时间。\n\n**第二种解决方案：** 我们可以在平衡二叉搜索树中维护元素。首先将前 k 个元素添加到树中。之后，对于流中的每个新元素，我们首先找到二叉树中的最小元素，此操作将需要\
  \ `O(logk)` 时间，然后我们将最小值与新值进行比较。如果新值小于最小值，则忽略它。如果新值大于最小值，则删除最小值并插入新值，这些操作也需要 `O(logn)`\
  \ 时间。这种解决方案的每次比较和插入操作需要 `O(logk)` 时间。\n\n### 流中最大的 100 个数\n\n**问题：** 有数亿个整数从流中输出，某些\
  \ `getInt()` 函数逐个地提供整数。你如何确定最大的 100 个数？\n\n**解决方案：** 最大百个（或最小百个等）这类问题可以使用堆（Heap）非常容易地解决。在这种情况下，我们将创建一个最小堆。\n\
  \n1. 首先，从 100 个整数构建一个最小堆。\n2. 然后对于每个新进入的整数，比较它是否大于最小堆的顶。\n3. 如果不是，则寻找下一个整数。如果是，则从最小堆中移除顶最小值，将新值插入到堆顶，使用\
  \ `procolateDown` 并将其移动到它在堆中适当的位置。\n4. 每每次你脑海中都存储了最大的 100 个值。\n\n### 合并两个堆\n\n**问题：**\
  \ 给定两个堆，你需要合并它们以创建一个单一堆。\n\n**解决方案：** 这个问题没有单一的解决方案。假设较大堆的大小为 N，较小堆的大小为 M。\n\n1.\
  \ 如果两个堆的大小具有可比性，则将两个堆数组放在同一个更大的列表中。或者，如果其中一个数组足够大，则应用 `CreateHeap()` 函数，该函数将需要 `theta(N+M)`\
  \ 时间。\n2. 如果 M 远小于 N，则将 M 列表的每个元素逐个添加到 N 堆中。这在最坏情况下需要 `O(MlogN)`，最好情况下需要 `O(M)`。\n\
  \n### 是否为最小堆\n\n**问题：** 在给定列表中，找到它是否代表二叉最小堆。\n\n**解决方案：** 我们要检查的最小堆属性是父索引处的值始终小于或等于其子索引的值。\n\
  \n**示例 10.10：**\n\n```java\npublic static boolean isMinHeap(int[] arr, int size)\
