  \          rchild = lchild + 1;\n          // 堆属性检查。\n          if (((lchild < size)\
  \ && (arr[parent] < arr[lchild])) || ((rchild < size) && (arr[parent] < arr[rchild])))\n\
  \              return false;\n      }\n      return true;\n}\n```\n**分析：** 如果每个父节点的值都大于其孩子的值，则堆属性为真。我们将从数组开始遍历到一半，并比较节点的值与其左孩子和右孩子的值。\n\
  \n### 堆的遍历\n堆的设计并不是为了遍历来查找某个元素。它们是为了快速获取最小或最大元素。尽管如此，如果你想遍历堆，只需遍历数组即可。这种遍历将是层序遍历。这种遍历将具有线性复杂度。\n\
  \n### 从最小堆中删除任意元素\n再次，堆的设计并不是为了删除任意元素，但如果你仍想这样做：请在堆中通过线性搜索找到该元素。用堆末尾的值替换它。将堆的大小减一。将新插入的值与其父节点进行比较。如果它的值小于父节点的值，则向上浮（percolate\
  \ up）。如果它的值大于其左、右孩子，则向下浮（percolate down）。时间复杂度为 `O(logn)`。\n\n### 从最小堆中删除第 K 个元素\n\
  再次，堆的设计并不是为了删除任意元素，但如果你仍想这样做：用堆末尾的值替换第 K 个值。将堆的大小减一。将新插入的值与其父节点进行比较。如果它的值小于父节点的值，则向上浮。如果它的值大于其左、右孩子，则向下浮。时间复杂度为\
  \ `O(logn)`。\n\n### 最小堆中的范围值\n线性遍历堆并打印在范围内的值。\n\n### K 个元素的乘积\n\n**问题：** 给定一个正整数数组。找到数组中最小\
