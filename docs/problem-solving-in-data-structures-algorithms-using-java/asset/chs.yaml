  \n时间复杂度：`O(n)`。\n\n### 双向链表\n\n在双向链表中，有两个指针 `prev` 和 `next`。`prev` 指针指向前一个节点，`next`\
  \ 指针指向下一个节点。\n\nImages/00082.jpeg 让我们来看节点。节点的值是整数类型，但也可以是其他类型。两个指针是 `prev` 和 `next`。\n\
  \n**示例 6.28**: 双向链表类。\n\n```java\nclass DoublyLinkedList {\n    Node head;\n   \
  \ Node tail;\n    int size = 0;\n\n    static class Node {\n        int value;\n\
  \        Node next;\n        Node prev;\n\n        public Node(int v, Node nxt,\
  \ Node prv) {\n            value = v;\n            next = nxt;\n            prev\
  \ = prv;\n        }\n\n        public Node(int v) {\n            value = v;\n  \
  \          next = null;\n            prev = null;\n        }\n    }\n\n    /* 其他方法\
  \ */\n}\n```\n\n### 链表的基本操作\n\n链表的基本操作需要遍历链表。链表可以执行的各种操作，许多都需要遍历列表：\n\n1. 在列表中插入元素，该操作用于创建链表。\n\
  2. 打印列表的各种元素。\n3. 在列表中搜索元素。\n4. 从列表中删除元素。\n5. 反转链表。\n\n### 在头部插入\n\nImages/00083.jpeg\n\
  \nImages/00084.jpeg\n\nImages/00085.jpeg\n\n\n\n\n\n# 问题：在链表的头部插入节点。\n\n## 示例 6.29\n\
  \n```java\npublic void addHead(int value) {\n    Node newNode = new Node(value,\
  \ null, null);\n    if (size == 0) {\n        tail = head = newNode;\n    } else\
  \ {\n        head.prev = newNode;\n        newNode.next = head;\n        head =\
  \ newNode;\n    }\n    size++;\n}\n```\n\n### 分析\n双向链表中的插入与单链表中的相似。\n\n- 创建一个节点，并将节点的\
  \ `prev` 指针赋值为 `null`。\n- 如果列表为空，则 `tail` 和 `head` 将指向新节点。\n- 如果列表不空，`head` 的 `prev`\
  \ 将指向 `newNode`，`newNode` 的 `next` 将指向 `head`。然后 `head` 将修改为指向 `newNode`。\n\n时间复杂度：O(1)。\n\
  \n## 排序插入\n\n### 问题：按顺序在链表中插入元素。\n\n![](img/00086.jpeg)\n![](img/00087.jpeg)\n![](img/00088.jpeg)\n\
  \n### 示例 6.30\n\n```java\npublic void sortedInsert(int value) {\n    Node temp =\
  \ new Node(value);\n    Node curr = head;\n    if (curr == null){ // 第一个元素*\n  \
  \      head = temp;\n        tail = temp;\n    }\n    if (head.value <= value){\
  \ // 头部*\n        temp.next = head;\n        head.prev = temp;\n        head = temp;\n\
  \    }\n    while (curr.next != null && curr.next.value > value){ // 遍历*\n     \
  \   curr = curr.next;\n    }\n    if (curr.next == null){ // 尾部*\n        tail =\
  \ temp;\n        temp.prev = curr;\n        curr.next = temp;\n    } else { // 其他所有情况\n\
  \        temp.next = curr.next;\n        temp.prev = curr;\n        curr.next =\
  \ temp;\n        temp.next.prev = temp;\n    }\n}\n```\n\n### 分析\n- 我们首先需要考虑只有一个元素的情况。在这种情况下，`head`\
  \ 和 `tail` 都会被修改。\n- 接着，我们需要考虑当新节点插入到列表头部时，`head` 会被修改的情况。\n- 然后，我们需要考虑一般情况。\n-\
  \ 最后，我们需要考虑 `tail` 会被修改的情况。\n\n时间复杂度：O(n)。\n\n## 删除头部\n\n### 问题：删除链表的头部节点。\n\n###\
  \ 示例 6.31\n\n```java\npublic int removeHead() {\n    if (isEmpty())\n        throw\
  \ new IllegalStateException(\"EmptyListException\");\n    int value = head.value;\n\
  \    head = head.next;\n    if (head == null)\n        tail = null;\n    else\n\
  \        head.prev = null;\n    size--;\n    return value;\n}\n```\n\n### 分析\n-\
  \ 如果列表为空，我们什么都不做。\n- `Head` 将指向原 `head` 的下一个节点。如果 `head` 不为空，则它的 `prev` 将指向 `null`。\n\
  - 更新列表，使其 `head` 指向第二个节点。\n\n时间复杂度：O(1)。\n\n## 删除节点\n\n### 问题：删除链表中给定特定值的节点\n\n\
  ![](img/00089.jpeg)\n![](img/00090.jpeg)\n![](img/00091.jpeg)\n![](img/00092.jpeg)\n\
  \n### 示例 6.32\n\n```java\npublic boolean removeNode(int key) {\n    Node curr =\
  \ head;\n    if (curr == null){ // 空列表*\n        return false;\n    if (curr.value\
  \ == key){ // 头部就是目标值的节点。\n        head = head.next;\n        size--;\n        if\
  \ (head != null)\n            head.prev = null;\n        else\n            tail\
  \ = null; // 列表中只有一个元素。\n        return true;\n    }\n    while (curr.next != null)\
  \ {\n        if (curr.next.value == key) {\n            curr.next = curr.next.next;\n\
  \            if (curr.next == null){ // 最后一个元素情况.*\n                tail = curr;\n\
  \            else\n                curr.next.prev = curr;\n            size--;\n\
  \            return true;\n        }\n        curr = curr.next;\n    }\n    return\
  \ false;\n}\n```\n\n### 分析\n遍历列表找到需要删除的节点。然后删除它，并调整其前节点的 `next` 指针和其后节点的 `prev`\
  \ 指针。\n\n时间复杂度：O(n)。\n\n## 删除重复项\n\n### 问题：假设列表是有序的，删除列表中重复的数值节点。\n\n### 示例 6.33\n\
  \n```java\npublic void removeDuplicate() {\n    Node curr = head;\n    Node deleteMe;\n\
  \    while (curr != null) {\n        if ((curr.next != null) && curr.value == curr.next.value)\
  \ {\n            deleteMe = curr.next;\n            curr.next = deleteMe.next;\n\
  \            if (curr.next != null)\n                curr.next.prev = curr;\n  \
  \          if (deleteMe == tail)\n                tail = curr;\n        } else {\n\
  \            curr = curr.next;\n        }\n    }\n}\n```\n\n### 分析\n- 头部可能被修改。\n\
  - 找到值相同节点并删除。\n\n时间复杂度：O(n)。\n\n## 反转双向链表\n\n### 问题：迭代地反转双向链表。\n\n### 示例 6.34\n\n\
  ```java\npublic void reverseList() {\n    Node curr = head;\n    Node tempNode;\n\
  \    while (curr != null) {\n        tempNode = curr.next;\n        curr.next =\
  \ curr.prev;\n        curr.prev = tempNode;\n        if (tempNode == null)\n   \
  \         head = curr;\n        curr = tempNode;\n    }\n}\n```\n```\n\n### 分析\n\
  遍历列表并交换 `next` 和 `prev`。到达末尾后设置 `head`。\n\n时间复杂度：O(n)。\n\n## 反转拷贝列表\n\n### 问题：按反序复制列表内容到另一个列表中。\n\
  \n### 示例 6.35\n\n```java\npublic DoublyLinkedList copyListReversed() {\n    DoublyLinkedList\
  \ dll = new DoublyLinkedList();\n    Node curr = head;\n    while (curr != null)\
  \ {\n        dll.addHead(curr.value);\n        curr = curr.next;\n    }\n    return\
  \ dll;\n}\n```\n\n### 分析\n- 遍历列表并调用 `addHead()` 方法将值复制到另一个列表。\n- 由于新节点被添加到头部，生成的列表顺序是反转的。\n\
  \n时间复杂度：O(n)。\n\n## 拷贝列表\n\n### 问题：按相同顺序拷贝列表内容到另一个列表中。\n\n### 示例 6.36\n\n```java\n\
  public DoublyLinkedList copyList() {\n    DoublyLinkedList dll = new DoublyLinkedList();\n\
  \    Node curr = head;\n    while (curr != null) {\n        dll.addTail(curr.value);\n\
  \        curr = curr.next;\n    }\n    return dll;\n}\n```\n\n### 分析\n- 遍历列表并调用\
  \ `addTail()` 方法将值复制到另一个列表。\n- 由于新节点被添加到尾部，生成的列表顺序与原始列表相同。\n\n时间复杂度：O(n)。\n\n###\
