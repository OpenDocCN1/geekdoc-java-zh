  \    right -= 1;\n}\n}\nSystem.out.println(\"Water : \" + water);\nreturn water;\n\
  ```\n\n## 练习\n\n1. 在给定的包含 n 个元素的列表中，我们需要找到第一个重复的元素。以下哪些方法可以对我们有效？如果某种方法有效，请实现它。\n\
  \n- 暴力法穷举搜索。\n- 使用 `Hash-Table`（哈希表）记录元素的索引，并通过第二次扫描找到该元素。\n- 对元素进行排序。\n- 如果我们知道元素的范围，则可以使用计数法。\n\
  \n**提示**：当元素在输入中出现的顺序很重要时，我们不能使用 `sorting`（排序）。\n\n2. 在给定的包含 n 个元素的列表中，编写一个算法来找到数组中三个之和等于给定值的元素。\n\
  \n**提示**：尝试使用暴力法来解决这个问题。然后尝试结合排序法与暴力法。时间复杂度为 `O(n²)`。\n\n3. 在给定的包含负数和正数的列表中，编写一个程序将负数与正数分离。\n\
