  \ ……）。时间复杂度：O(n)\n\n### Master Theorem\n主定理用于用于求解形式为 $T(n) = aT(n/b) + f(n)$ 的递归关系，其中\
  \ $a \\ge 1, b > 1$。\n- $a$ 是递归子问题的数量。\n- $b$ 是每个子问题规模缩小的比例。\n- $f(n)$ 是在递归之外所做的工作。\n\
  \n通过比较 $f(n)$ 与 $n^{\\log_b a}$：\n\n1.  如果 $f(n) = O(n^{\\log_b a - \\epsilon})$，对于某个\
  \ $\\epsilon > 0$，则 $T(n) = \\Theta(n^{\\log_b a})$。\n2.  如果 $f(n) = \\Theta(n^{\\\
  log_b a})$，则 $T(n) = \\Theta(n^{\\log_b a} \\log n)$。\n3.  如果 $f(n) = \\Omega(n^{\\\
  log_b a + \\epsilon})$，对于某个 $\\epsilon > 0$，且满足正则性条件 $af(n/b) \\le cf(n)$（对于某个 $c\
  \ < 1$），则 $T(n) = \\Theta(f(n))$。\n\n### 示例 1.14\n```java\nint fun14(int n) {\n\
