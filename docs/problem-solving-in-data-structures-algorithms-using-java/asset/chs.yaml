  \n在递归求解子问题之前，为该子问题传递排序列表。\n\n# 第 18 章：动态规划\n\n## 引言\n\n在使用分治法解决问题时，可能会出现递归子问题导致相同的计算被执行多次的情况。当递归中反复出现完全相同的子问题时，就会产生这个问题。\n\
  \n动态规划用于避免重复计算相同子问题的需求。在这种方法中，我们通常将子问题的的结果存储在某些数据结构（如表）中，并在再次计算之前引用它来检查是否已经计算过该子问题的解。\n\
  \n动态规划适用于具有以下属性的问题：\n\n1. **最优子结构**：由子问题的最优解构造出问题的最优解。\n2. **重叠子问题**：在计算子问题的最优解时，相同的计算被重复执行。\n\
  \n示例：\n\n*   通过迭代计算的斐波那契数列\n*   装配线调度\n*   矩阵链式乘法\n*   0/1 背包问题\n*   最长公共子序列\n*\
  \   最优二叉树\n*   通过迭代实现的传递闭 Warshall 算法\n*   求任意最短路径的 Floyd 算法\n*   最优多边形三角形剖\n* \
  \  Floyd-Warshall 算法\n\n解决/识别是否应用 DP 的步骤：\n\n1. 最优子结构：尝试寻找问题与子问题之间是否存在递归关系。\n2.\
  \ 写出问题的递归关系。（在此步骤中观察重叠子问题。）\n3. 以自底向上的方式计算子问题的值，并将此值存储在某些表中。\n4. 根据第 3 步存储的值构造最优解。\n\
  5. 重复步骤 3 和 4，直到你得到解为止。\n\n## 动态规划算法问题\n\n### 斐波那契数列\n\n```java\npublic static int\
  \ fibonacci(int n) {\n    if (n <= 1) {\n        return n;\n    }\n    return fibonacci(n\
  \ - 1) + fibonacci(n - 2);\n}\n```\n\n![](img/00280.jpeg)\n\n使用分治法时，相同的子问题会被反复求解，这降低了算法的性能。该算法具有指数级的时间复杂度。\n\
  \n如果我们对子问题的结果进行排序，同样的斐波那契问题可以在线性时间内解决。\n\n```java\npublic static int fibonacci2(int\
  \ n) {\n    int first = 0;\n    int second = 1;\n    int i, temp = 0;\n    if (n\
  \ == 0)\n        return first;\n    else if (n == 1)\n        return second;\n \
  \   i = 2;\n    while (i <= n) {\n        temp = first + second;\n        first\
  \ = second;\n        second = temp;\n        i += 1;\n    }\n    return temp;\n\
  }\n```\n\n使用这种算法，我们将获得线性时间复杂度和常数空间复杂度的斐波那契。\n\n### 装配线调度\n\n![](img/00281.jpeg)\n\
  \n我们考虑在使用具有两条装配线的生产链时，制造汽车所需的最短时间的问题，如图所示。\n\n问题变量：\n\n* `e[i]`：进入装配线 `i` 的时间\n\
  * `x[i]`：离开装配线 `i` 的时间\n* `a[i,j]`：在工作站 `S[i,j]`（装配线 `i`，阶段 `j`）所需的时间\n* `t[i,j]`：从工作站\
  \ `S[i,j]` 转移到另一条装配线的时间\n\n你的程序必须计算：\n\n* 制造汽车所需的最短时间\n* 为了尽可能快地组装汽车而顺序遍历的工作站数组。\n\
  \n生产链将具有不超过 50 个工作站。\n\n如果我们想用暴力破解法解决这个问题，总共有 2^n 种不同的组合，因此时间复杂度为 `O(2^n)`\n\n步骤\
  \ 1：描述最优解的类\n\n为了计算最快的装配时间，我们只需要知道到达 `S1[n]` 和 `S2[n]` 的最快时间，包括第 n 个部分的装配时间。然后通过考虑所需的额外时间\
  \ `x1` 和 `x2`，在两个出口之间进行选择。要计算到达 `S1[n]` 的最快时间，只需要知道到达 `S1[n-1]` 和 `S2[n-1]` 的最快时间。然后只有两个选择。\n\
  \n步骤 2：待计算值的递归定义 ![](img/00282.jpeg)\n![](img/00283.jpeg)\n\n步骤 3：最终计算最快时间，计算 `f*`\n\
  步骤 4：计算最快路径，计算 `li[j]` 作为 `fi[j]` 的选择（取决于第一个还是第二个给出最小值）。同时也计算 `f*` 的选择。\n\n```FASTEST-WAY(a,\
  \ t, x, n)\nf1[1] ← e1 + a1,1\nf2[1] ← e2 + a2,1\nfor j ← 2 to n do\n    if f1[j-1]\
  \ + a1,j ≤ f2[j-1] + t2,j-1 + a1,j\n        then f1[j] ← f1[j-1] + a1,j\n      \
  \  l1[j] ← 1\n    else f1[j] ← f2[j-1] + t2,j-1 + a1,j\n        l1[j] ← 2\n    if\
  \ f2[j-1] + a2,j ≤ f1[j-1] + t1,j-1 + a2,j\n```\n\n\n\n计算两个维度为 $pXq$ 和 $qXr$ 的矩阵的乘积，需要\
  \ $pqr$ 次操作。矩阵乘法运算在本质上具有结合律。因此，矩阵乘法可以通过许多方式进行。\n\n例如，$M1$、$M2$、$M3$ 和 $M4$ 可以完全括号化为：\n\
  \n$(M1\\cdot (M2\\cdot (M3\\cdotM4)))$\n\n$(M1\\cdot (( M2\\cdotM3)\\cdot M4))$\n\
  \n$(( M1\\cdotM2)\\cdot (M3\\cdotM4))$\n\n$((( M1\\cdot M2)\\cdot M3)\\cdot M4)$\n\
  \n$(( M1\\cdot (M2\\cdotM3))\\cdot M4)$\n\n例如，\n\n假设 $M1$ 的维度为 $10 \\times 100$，$M2$\
  \ 的维度为 $100 \\times 10$，$M3$ 的维度为 $10 \\times 50$。\n\n$((M1\\cdot M2)\\cdot M3)\
  \ = (10*100*10) + (10*10*50) = 15000$\n\n$(M1\\cdot (M2\\cdotM3) = (100*10*50) +\
  \ (10*100*50) = 100000$\n\n因此，在这个问题中，我们需要对矩阵链进行括号化，使得总乘法代价最小。\n\n给定一个 $n$ 个矩阵的序列\
  \ $M1, M2,\\dots Mn$。它们的维度为 $p0, p1, p2,\\dots pn$。\n\n其中矩阵 $Ai$ 的维度为 $pi-1 \\times\
  \ pi$（$1 \\le i \\le n$）。确定使乘法次数最少的乘法顺序。\n\n如果你尝试使用暴力法来解决这个问题，你将找到所有可能的括号化方案。然后计算乘法代价。接着选择最佳解决方案。这种方法在本质上是指数级的。\n\
  \n暴力法存在局限性。以 $M1, M2,\\dots Mn$ 为例。当你计算出 $((M1\\cdot M2) \\cdot M3)$ 优于 $(M1\\cdot\
  \ (M2\\cdotM3))$ 时，就没有必要再计算 $(M1\\cdot (M2\\cdotM3)$ 与 $(M4, M5\\dots Mn)$ 的其他组合。\n\
  \n### 优子结构\n\n假设 $M(1, N)$ 是产生 $M1,\\dots Mn$ 的最优代价。\n\n使用一个数组 $p []$ 来记录矩阵的维度。\n\
