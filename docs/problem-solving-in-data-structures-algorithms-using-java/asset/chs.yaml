  \n# 第 5 章：搜索（Searching）\n\n## 引言\n\n搜索是在一组项目中寻找特定项目的过程。该项目可以是文件中的关键字、数据库中的记录记录、树中的节点或数组中的某个值等。\n\
  \n## 为什么要搜索？\n\n想象你处于一个拥有数百万本书的图书馆里。你想找一本特定标题的书。你将如何找到它？你会在图书馆的某个区域搜索这本书，该区域包含书名字母与目标书籍首字母相同的书籍。然后你继续匹配整个书名，直到找到你想要找的书。（通过这种微小的启发式方法，你将搜索空间缩小了\
  \ 26 倍，假设以特定字符开头的书籍数量相等。）\n\n同样，计算机存储了大量信息，为了高效地检索这些信息，我们需要高效的搜索算法。为了使搜索高效，我们将数据保持在某种适当的顺序中。如果你将数据按适当顺序组织，那么搜索所需的值或键就会很容易。例如，将数据保持为有序状态是组织数据的方法之一。\n\
  \n## 不同的搜索算法\n\n- 线性搜索 – 无序输入\n- 线性搜索 – 有序输入\n- 二分查找（有序输入）\n- 字符串搜索：字典树（Tries）、后缀树（Suffix\
  \ Trees）、三元搜索（Ternary Search）。\n- 哈希（Hashing）与符号表。\n\n## 线性搜索 – 无序输入\n\n当数组的元素没有顺序或未排序时，且我们想要搜索某个特定值时，我们需要扫描整个列表，直到找到所需的值。这种算法被称为无序线性搜索。该算法的主要问题是在极坏情况下性能较差或时间复杂度较高。\n\
  \n**示例 5.1**\n\n```java\npublic static boolean linearSearchUnsorted(int[] arr, int\
  \ size, int value) {\n    int i = 0;\n    for (i = 0; i < size; i++) {\n       \
  \ if (value == arr[i]) {\n            return true;\n        }\n    }\n    return\
  \ false;\n}\n```\n时间复杂度：`O(n)`。最坏情况是你所需的元素位于最后一个位置。空间复杂度：`O(1)`。\n\n## 线性搜索 – 有序\n\
  \n如果数组的元素是升序或降序的，搜索所需的元素将比无序搜索更高效。在很多情况下，我们不需要遍历整个列表。假设数组是升序的。\n\n**示例 5.2**\n\n\
  ```java\npublic static boolean linearSorted(int[] arr, int size, int value) {\n\
  \    int i;\n    for (i = 0; i < size; i++) {\n        if (value == arr[i]) {\n\
  \            return true;\n        } else if (value < arr[i]) {\n            return\
  \ false;\n        }\n    }\n    return false;\n}\n```\n时间复杂度：`O(n)`。尽管增长率与无序相同。空间复杂度：`O(1)`。\n\
  \n## 二分查找\n\n我们在字典中如何查找单词？通常我们去某一页（主要是中间）并从那里开始搜索。如果我们看到我们要搜索的单词在这一页，搜索就完成了。否则，如果我们看到我们要搜索的单词在前半部分，我们就排除后半部分反之亦然。我们重复相同的步骤直到找到所需的关键字。\n\
  \n二分查找也以同样的方式工作。当我们想在有序列表中搜索某个键值时。我们找到有序列表的中间点并与所需的值进行比较。如果所需的值等于中间值，搜索就完成了。如果该值大于中间值，我们就排除前半。如果该值小于中间值，我们就排除后半部分。在每次比较中，我们都将搜索空间缩小一半。\n\
  \n注意：二分查找要求数组是有序的，否则无法应用二分查找。\n\n**示例 5.3**\n\n```java\n// Binary Search Algorithm\
  \ - 迭代方式\npublic static boolean Binarysearch(int[] arr, int size, int value) {\n\
  \    int low = 0;\n    int high = size - 1;\n    int mid;\n    while (low <= high)\
  \ {\n        mid = (low + high) / 2;\n        if (arr[mid] == value) {\n       \
  \     return true;\n        } else if (arr[mid] < value) {\n```\n\n\n\n\n```java\n\
  \            low = mid + 1;\n        } else {\n            high = mid - 1;\n   \
  \     }\n    }\n    return false;\n}\n```\n\n时间复杂度：`O(logn)`。我们总是取输入的一半并丢弃另一半。因此，二分查找的递归关系为\
  \ `T(n) = T(n/2) + c`。使用主定理（分治法），我们得到 `T(n) = O(logn)`。\n\n空间复杂度：`O(1)`\n\n####\
  \ 示例 5.4：使用递归实现的二分查找。\n\n```java\npublic static boolean BinarySearchRec(int[] arr,\
  \ int size, int value) {\n    int low = 0;\n    int high = size - 1;\n    return\
  \ BinarySearchRecUtil(arr, low, high, value);\n}\n\n// 二分查找算法 - 递归方式\npublic static\
  \ boolean BinarySearchRecUtil(int[] arr, int low, int high, int value) {\n    if\
  \ (low > high) {\n        return false;\n    }\n    int mid = (low + high) / 2;\n\
  \    if (arr[mid] == value) {\n        return true;\n    } else if (arr[mid] < value)\
  \ {\n        return BinarySearchRecUtil(arr, mid + 1, high, value);\n    } else\
  \ {\n        return BinarySearchRecUtil(arr, low, mid - 1, value);\n    }\n}\n```\n\
  \n时间复杂度：`O(logn)`。空间复杂度：由于递归，系统栈为 `O(logn)`。\n\n## 字符串查找算法\n\n参考字符串章节。\n\n## 哈希与符号表\n\
  \n参考哈希表章节。\n\n## 排序在选择算法中是如何有用的？\n\n选择问题可以转换为排序问题。一旦数组经过排序，就很容易从有序列表中找到最小值/最大值（或所需的元素）。“排序后选择”的方法对于选择单个元素来说效率很低，但当需要从数组中进行多次选择时，它是非常高效的。这是因为只需要进行一次昂贵的初始排序，随后是许多廉的选择的操作。\n\
  \n例如，如果我们想从数组中获取最大元素。在排序数组后，我们可以直接返回数组的最后一个元素。如果我们想获取第二大值呢？现在，我们不需要再次排序数组，只需返回有序列表倒数第二个元素。同样，我们可以通过对有序列表进行一次扫描返回第\
  \ k 个最大元素。\n\n所以，通过上述讨论，排序被用于提高性能。通常情况下，这种方法需要 `O(nlogn)`（用于排序）时间。\n\n## 搜索问题\n\n\
  ### 数组中的第一个重复元素\n\n**问题：** 给定一个包含 `n` 个元素的无序列表，找到第一个重复的元素。\n\n**第一种解决方案：** 穷举搜索或暴力破解；对于列表中的每个元素，查找是否存在另一个具有相同的元素。这是通过两个循环实现的，第一个循环选择元素，第二个循环查找其重复项。\n\
  \n时间复杂度为 `O(n²)`，空间复杂度为 `O(1)`。\n\n#### 示例 5.5\n\n```java\npublic static int FirstRepeated(int[]\
  \ arr, int size) {\n    int i, j;\n    for (i = 0; i < size; i++) {\n        for\
  \ (j = i + 1; j < size; j++) {\n            if (arr[i] == arr[j]) {\n          \
  \      return arr[i];\n            }\n        }\n    }\n    return 0;\n}\n\npublic\
  \ static void main(String[] args) {\n    int[] first = {34, 56, 77, 1, 5, 6, 6,\
  \ 7, 8, 10, 34, 20 };\n    System.out.println(FirstRepeated(first, first.length));\n\
  }\n```\n\n**第二种解决方案：** 哈希表；使用哈希表，我们可以跟踪特定元素在数组中出现的次数。第一次扫描时填充哈希表。在第二次扫描中，查找哈希表中元素出现的情况。如果某个元素的出现次数较多，那么我们就得到了解决方案和重复元素。哈希表的插入和查找需要常数时间\
  \ `O(1)`，因此算法的总复杂度为 `O(n)` 时间。维护哈希表的空间复杂度也为 `O(n)`。\n\n### 打印列表中的重复元素\n\n**问题：**\
  \ 给定一个包含 `n` 个数字的数组，打印数组中的重复元素。\n\n**第一种解决方案：** 穷举搜索或暴力破解；对于列表中的每个元素，查找是否存在另一个具有相同的元素。这是通过两个循环实现的，第一个循环选择元素，第二个循环查找其重复项。\n\
  \n#### 示例 5.6\n\n```java\npublic static void printRepeating(int[] arr, int size)\
  \ {\n    int i, j;\n    System.out.print(\"\\n elements are \");\n    for (i = 0;\
  \ i < size; i++) {\n        for (j = i + 1; j < size; j++) {\n            if (arr[i]\
  \ == arr[j]) {\n                System.out.print(\" \" + arr[i]);\n            }\n\
  \        }\n    }\n}\n```\n\n时间复杂度为 `O(n²)`，空间复杂度为 `O(1)`。\n\n**第二种解决方案：** 排序；排序数组中的所有元素，在此之后通过单次扫描找到重复元素。\n\
  \n#### 示例 5.7\n\n```java\npublic static void printRepeating2(int[] arr, int size)\
  \ {\n    int i;\n    Arrays.sort(arr);\n    System.out.print(\" Repeating elements\
  \ are \");\n    for (i = 1; i < size; i++) {\n        if (arr[i] == arr[i - 1])\
  \ {\n            System.out.print(\" \" + arr[i]);\n        }\n    }\n}\n```\n\n\
  排序算法需要 `O(n log n)` 时间，单次扫描需要 `O(n)` 时间。时间复杂度为 `O(n log n)`，空间复杂度为 `O(1)`。\n\n**第三种解决方案：**\
  \ 哈希表，使用哈希表，我们可以跟踪已经过的元素，并只需一次扫描即可找到重复元素。\n\n#### 示例 5.8\n\n```java\npublic static\
  \ void printRepeating3(int[] arr, int size) {\n    HashSet<Integer> hs = new HashSet<Integer>();\n\
  \    int i;\n    System.out.print(\" Repeating elements are \");\n    for (i = 0;\
  \ i < size; i++) {\n        if (hs.contains(arr[i])) {\n            System.out.print(\"\
  \ \" + arr[i]);\n        } else {\n            hs.add(arr[i]);\n        }\n    }\n\
  }\n```\n\n哈希表的插入和查找需要常数时间 `O(1)`，因此算法的总复杂度为 `O(n)` 时间。创建哈希表的空间复杂度为 `O(n)`。\n\n**第四种解决方案：**\
  \ 计数，这种解决方案只有在我们知道输入范围时才可行。如果已知，数组元素为 `0` 到 `n-1`。我们可以预留一个长度为 `range` 的数组，当我们看到一个元素时增加相应的计数。\n\
  \n#### 示例 5.9\n\n```java\npublic static void printRepeating4(int[] arr, int size,\
  \ int range) {\n    int[] count = new int[range];\n    int i;\n    for (i = 0; i\
  \ < size; i++) {\n        count[i] = 0;\n    }\n    System.out.print(\" Repeating\
  \ elements are \");\n    for (i = 0; i < size; i++) {\n        if (count[arr[i]]\
  \ == 1) {\n            System.out.print(\" \" + arr[i]);\n        } else {\n   \
  \         count[arr[i]]++;\n        }\n    }\n}\n```\n\n### 整数列表的去重\n\n**问题：** 去除给定整数列表中的重复项。\n\
