  \ = 0; parent < (size / 2 + 1); parent++) {\n          lchild = parent * 2 + 1;\n\
  \          rchild = parent * 2 + 2;\n          // 堆属性检查。\n          if (((lchild\
  \ < size) && (arr[parent] > arr[lchild])) || ((rchild < size) && (arr[parent] >\
  \ arr[rchild])))\n              return false;\n      }\n      return true;\n}\n\
  ```\n\n### 是否为最大堆\n\n**问题：** 在给定列表中，找到它是否代表二叉最大堆。\n\n**解决方案：** 我们要检查的最大堆属性是父索引处的值始终大于或等于其子索引的值。\n\
  \n**示例 10.11：**\n\n```java\npublic static boolean isMaxHeap(int[] arr, int size)\
