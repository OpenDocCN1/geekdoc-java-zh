  \ O(nlogn)，比较的时间复杂度为 O(n)。总时间复杂度为 O(nlogn)。\n\n**示例 5.29**\n\n```java\npublic static\
  \ void minSumPair2(int[] arr, int size) {\n    int l, r, minSum, minFirst, minSecond;\n\
