  队列在现实生活中的类比是我们所有人有时都会参与的典型排队。\n\n*   我们在火车站售票窗口前排队。\n*   我们在食堂里排队。\n*   当我们拨打某些客服电话时会排队。\n\
  \n队列队头的元素是在队列中停留时间最长的元素。\n\n![](img/00113.jpeg)\n\n计算机科学中也有队列的常见例子。我们从办公室向每层的一台打印机发送打印命令。打印任务在打印机队列中排队。首先发送打印命令将在队列中的后续命令之前打印。\n\
  \n除了打印队列外，操作系统也使用不同的队列来控制进程调度。进程被添加到处理队列中，操作系统使用它进行各种调度算法。\n\n很快我们将学习图，并会发现图的广度优先遍历也使用队列。\n\
  \n## 队列抽象数据类型\n\n队列抽象数据类型定义为一种类，其实实例对于添加的元素遵循 FIFO（即先入后出）原则。\n\n队列应该支持以下操作：\n\n\
  1. ``add()`：在队列末尾添加单个元素。\n2. ``remove()`：从队列头部删除单个元素。\n3. ``isEmpty()`：如果队列为空则返回\
  \ 1。\n4. ``size()`：返回队列中的元素个数。\n\n## 使用数组实现的队列\n\n![](img/00114.jpeg)\n\n**示例 8.1**：\n\
  \n```java\npublic class Queue {\n    private int size;\n    private int capacity\
  \ = 100;\n    private int[] data;\n    int front = 0;\n    int back = 0;\n    public\
  \ Queue() {\n        size = 0;\n        data = new int[100];\n    }\n    public\
  \ boolean add(int value) {\n        if (size >= capacity) {\n            System.out.println(\"\
  Queue is full.\");\n            return false;\n        } else {\n            size++;\n\
  \            data[back] = value;\n            back = (++back) % (capacity - 1);\n\
  \        }\n        return true;\n    }\n    public int remove() {\n        int\
  \ value;\n        if (size <= 0) {\n            System.out.println(\"Queue is empty.\"\
  );\n            return -999;\n        } else {\n            size--;\n          \
  \  value = data[front];\n            front = (++front) % (capacity - 1);\n     \
  \   }\n        return value;\n    }\n    boolean isEmpty() {\n        return size\
  \ == 0;\n    }\n    int size() {\n        return size;\n    }\n}\n```\n\n**分析：**\n\
  * 队列是从列表创建的。\n* 使用 ``add()` 在队列末尾插入一个元素。\n* 使用 ``remove()` 从头部删除一个元素。\n\n## 使用列表实现的队列\n\
  \n队列使用循环链表实现。使用链表的优势是我们可以在常数时间内获取头部和尾部。当我们想要插入时，在尾部添加。当我们需要删除时，删除链表的头部。\n\n**示例\
  \ 8.2**：\n\n```java\npublic class QueueLL {\n    private Node tail = null;\n   \
  \ private int size = 0;\n    private static class Node {\n        private int value;\n\
  \        private Node next;\n        public Node(int v, Node n) {\n            value\
  \ = v;\n            next = n;\n        }\n    }\n    public int size() {\n     \
  \   return size;\n    }\n    public boolean isEmpty() {\n        return size ==\
  \ 0;\n    }\n}\n```\n\n### 入队\n\n使用循环链表将元素存入队列。节点被添加到链表的末尾。下面的图示说明了新节点如何添加到列表中。每当向队列添加新值时，``tail``\
  \ 都会被修改。\n\n![](img/00115.jpeg)\n![](img/00116.jpeg)\n![](img/00117.jpeg)\n\n**示例\
  \ 8.3**：\n\n```java\npublic void add(int value) {\n    Node temp = new Node(value,\
  \ null);\n    if (tail == null) {\n        tail = temp;\n        tail.next = tail;\n\
  \    } else {\n        temp.next = tail.next;\n        tail.next = temp;\n     \
  \   tail = temp;\n    }\n    size++;\n}\n```\n\n**分析：** ``add`` 操作在队列（循环链表）的末尾添加一个元素。\n\
  \n### 出队\n\n出队操作通过删除头部节点完成。尾节点的下一个节点是头部节点，我们将头部节点的位置存储在临时指针 ``deleteMe`` 中。尾节点的\
  \ ``next`` 将指向 ``deleteMe`` 节点的下一个。最后，存储在 ``deleteMe`` 指针中的头部节点被删除。\n\n![](img/00118.jpeg)\n\
  ![](img/00119.jpeg)\n![](img/00120.jpeg)\n\n**示例 8.4**：\n\n```java\npublic int remove()\
  \ throws IllegalStateException {\n    if (isEmpty())\n        throw new IllegalStateException(\"\
  StackEmptyException\");\n    int value=0;\n    if (tail == tail.next) {\n      \
  \  value = tail.value;\n        tail = null;\n    } else {\n        value = tail.next.value;\n\
  \        tail.next = tail.next.next;\n    }\n    size--;\n    return value;\n}\n\
  public int peek() throws IllegalStateException {\n    if (isEmpty())\n        throw\
  \ new IllegalStateException(\"StackEmptyException\");\n    int value;\n    if (tail\
  \ == tail.next)\n        value = tail.value;\n    else\n        value = tail.next;\n\
  \    return value;\n}\npublic static void main(String[] args) {\n    QueueLL q =\
  \ new QueueLL();\n    q.add(1);\n    q.add(2);\n    q.add(3);\n    for (int i =\
  \ 0; i < 3; i++)\n        System.out.println(q.remove());\n}\n```\n\n**分析：** ``remove``\
  \ 操作从队列（循环链表）的头部删除。\n\n## 队列问题\n\n### 栈实现队列\n\n**问题：** 使用栈来实现队列。\n\n**解决方案：** 我们可以使用两个栈来实现队列。\n\
  1. 入队操作：新元素被添加到第一个栈的顶部。\n2. 出队操作：从第二个栈中弹出元素。当第二个栈为空时，将第一个栈的所有元素逐个弹出并压入第二个栈。\n\n\
  示例 8.5：\n\n```java\nimport java.util.Stack;\npublic class QueueUsingStack {\n  \
  \  private Stack<Integer> stk1;\n    private Stack<Integer> stk2;\n    public QueueUsingStack()\
  \ {\n        stk1 = new Stack<Integer>();\n        stk2 = new Stack<Integer>();\n\
  \    }\n    void add(int value) {\n        stk1.push(value);\n    }\n    int remove()\
  \ {\n        int value;\n        if (stk2.isEmpty() == false) {\n            return\
  \ stk2.pop();\n        }\n        while (stk1.isEmpty() == false) {\n          \
  \  value = stk1.pop();\n            stk2.push(value);\n        }\n        return\
  \ stk2.pop();\n    }\n    public static void main(String[] args) {\n        QueueUsingStack\
  \ que = new QueueUsingStack();\n        que.add(1);\n        que.add(11);\n    \
  \    que.add(111);\n        System.out.println(que.remove());\n        System.out.println(que.remove());\n\
  \    }\n}\n```\n\n**分析：** 所有的 ``add()` 都发生在 ``stk1`` 中。当调用 ``remove()` 时，从 ``stk2``\
  \ 中移除。当 ``stk2`` 为空时，将 ``stk1`` 的元素弹出并压入 ``stk2``。这种从 ``stk1`` 弹出并压入 ``stk2`` 的操作反转了检索顺序，从而通过两个栈实现了队列行为。平均时间复杂度为\
  \ O(1)，元素仅进入第一个栈一次，仅进入第二个栈一次并通过弹出操作取出。\n\n### 队列实现栈\n\n**问题：** 使用队列来实现栈。\n\n第一个解决方案：使用两个队列\n\
  \n入栈：将新元素添加到 ``queue1``。\n\n弹出：当 ``queue1`` 的大小大于 1 时，将 ``queue1`` 中除最后一个元素外所有的项推入\
  \ ``queue2\\.交换 ``queue1`` 和 ``queue2`` 的名称。然后返回最后一个元素。\n\n\n\n\n入队操作为 `O(1)`，弹出操作为\
  \ `O(n)`。\n\n## 第二种解决方案：仅可以使用一个队列完成。\n\n入队：将元素添加到队列。\n\n弹出：找到队列的大小。如果大小为 0 则返回错误。否则，如果大小大于\
  \ 0，则从队列中移除 `size - 1` 个元素并重新添加到同一个队列中。最后，移除下一个元素并返回它。\n\n入队操作为 `O(1)`，弹出操作为 `O(n)`。\n\
  \n## 第三种解决方案：在上述解决方案中，入队效率很高但弹出效率很低，我们能让弹出变得高效 `O(1)` 而入队变得无效 `O(n)` 吗？\n\n入队：将新元素添加到\
  \ `queue2`。然后将 `queue1` 的所有元素添加到 `queue2`。然后交换 `queue1` 和 `queue2` 的名称。\n\n弹出：从\
  \ `queue1` 中移除元素。\n\n## 反转栈\n\n**问题：** 使用队列反转栈\n\n### 第一种解决方案：\n- 将栈中的所有元素弹出并加入队列中。\n\
  - 然后将队列中的所有元素移入栈中。\n- 我们就得到了反转后的栈元素。\n\n### 第二种解决方案：\n- 由于 C 语言中使用动态列表或 `[]` 列表来实现栈，我们可以从数组的两个方向遍历并交换元素。\n\
  \n## 反转队列\n\n**问题：** 使用栈反转队列\n\n### 解决方案：\n- 将队列中的所有元素出队到栈中（追加到 C 列表 `[]`）。\n- 然后将栈中的所有元素弹出并加入队列中。（从数组\
  \ `)` 中弹出元素）。\n- 我们就得到了反转后的队列元素。\n\n## 队列广度优先搜索\n\n在广度优先搜索中，我们通过寻找所有可能的后继节点并将其加入队列，首先探索所有最近的节点。\n\
  \n- 创建一个队列。\n- 创建一个起点。\n- 将起点入队队列。\n- `while (未找到搜索值且队列不为空)`\n    - 从队列中出队。\n  \
  \  - 从出队点找到所有可能的路径。\n    - 将这些路径入队队列。\n\n## 约瑟夫问题\n\n**问题：** 有 `n` 个人站在队列中等待执行。计数从队列前端开始。在每一步中，移除\
  \ `k` 个人并再次逐个从队列中加入。然后执行下一个人。执行沿着圆圈进行，直到只剩下最后一个人，那个人将获得自由。找到你想要站的位置并获得自由。\n\n**解决方案：**\n\
  - 仅在队列中插入从 `1` 到 `k` 的整数（对应 `k` 个人）。\n- 定义一个 `Kpop()` 函数，使其移除并重新添加队列 `k-1` 次，然后再移除一次。（这个人死了。）\n\
  - 重复第二步，直到队列的 `size`（大小）为 `1`。\n- 打印最后一个元素中的值。这就是解办法。\n\n## 环形旅行\n\n**问题：** 环形路径上有\
  \ `N` 个加油站。每个加油站都有有限的汽油量。你被给定每个加油站拥有的汽油量以及到下一个加油站的距离。找到是否存在可能的环形旅行可以访问所有加油站。\n\n\
  ### 第一种解决方案：对于每个加油站，寻找从不同加油站开始的所有可能路径。\n\n对于每个加油站，我们将其加上（可用净油量 – 到达下一个加油站所需的净油量）。在遍历加油站时，如果我们能找到一条汽油值始终为正的路径，那么这就是我们正在寻找的路径。否则，通过选择其他起点寻找另一条路径。\n\
  \n时间复杂度为 `O(n²)`。\n\n### 解决方案：上述问题存在效率低的问题。相同节点的净油量计算被重复进行。如果我们从 `i^{th}` 个加油站开始，并在访问\
  \ `k^{th}` 个加油站后得到负的净油值。那么我们可以通过减去 `i^{th}` 个加油站的汽油值，在常数时间内找到从 `i+1^{th}` 个到 `k^{th}`\
  \ 个加油站的净油值。\n\n因此，当我们遍历加油站数组时，我们将加油站索引添加到数组中。当我们得到正的净油值时，我们继续添加下一个加油站并跟踪净油量。当我们得到负的净油值时，我们从队列中移除起始加油站\
  \ ID 并对净油量进行必要的计算。一旦值被加入队列，我们就不需要对其进行更多计算。因此此解决方案是线性的。时间复杂度为 `O(N)`。\n\n**示例 8.6**：\n\
  \n```java\npublic static int CircularTour(int[][] arr, int n) {\n    ArrayDeque<Integer>\
  \ que = new ArrayDeque<Integer>();\n    int nextPump = 0, prevPump;\n    int count\
  \ = 0;\n    int petrol = 0;\n    while (que.size() != n) {\n        while (petrol\
  \ >= 0 && que.size() != n) {\n            que.add(nextPump);\n            petrol\
  \ += (arr[nextPump][0] - arr[nextPump][1]);\n            nextPump = (nextPump +\
  \ 1) % n;\n        }\n        while (petrol < 0 && que.size() > 0) {\n         \
  \   prevPump = que.remove();\n            petrol -= (arr[prevPump][0] - arr[prevPump][1]);\n\
  \        }\n        count += 1;\n        if (count == n)\n            return -1;\n\
  \    }\n    if (petrol >= 0)\n        return que.remove();\n}\npublic static void\
  \ main(String[] args) {\n    // 测试代码\n    int[][] tour = {{4, 6}, {6, 5}, {7, 3},\
  \ {5, 8}, {2, 2}};\n    System.out.println(\"Circular Tour : \" + CircularTour(tour,\
  \ 5));\n}\n```\n\n## Convert XY\n\n**问题：** 给定两个值 `X` 和 `Y`。通过乘以 2 或减去 1 来转换 `X`。\n\
  \n**解决方案：** 通过执行广度优先遍历（BFS）将源值生成的可能值加入队列。每个值只加入队列一次，因此该算法的时间复杂度为 `O(n)`。\n\n**示例\
  \ 8.7**：\n\n```java\npublic static int convertXY(int src, int dst) {\n    ArrayDeque<Integer>\
  \ que = new ArrayDeque<Integer>();\n    int arr[] = new int[100];\n    int steps\
  \ = 0;\n    int index = 0;\n    int value;\n    que.add(src);\n    while (que.size()\
  \ != 0) {\n        value = que.remove();\n        arr[index++] = value;\n      \
  \  if (value == dst) {\n            for (int i = 0; i < index; i++)\n          \
  \      System.out.print(arr[i]);\n            System.out.print(\"Steps count ::\
  \ \" + steps);\n            return steps;\n        }\n        steps++;\n       \
  \ if (value < dst)\n            que.add(value * 2);\n        else\n            que.add(value\
  \ - 1);\n    }\n    return -1;\n}\npublic static void main(String[] args) {\n  \
  \  convertXY(2, 7);\n}\n```\n\n## 滑动窗口最大值\n\n**问题：** 给一个整数数组，找到长度为 `k` 的所有滑动窗口的最大值。\n\
  \n输入：`11, 2, 75, 92, 59, 90`  `k = 3`\n\n输出：`75, 92, 92, 92, 90`\n\n**第一种解决方案：**\
  \ 暴力法，遍历数组的所有索引。内部运行一个长度为 `k` 的循环，找到此循环的最大值并显示在屏幕上。这种时间复杂度为 `O(nk)`。\n\n**第二解决方案：**\n\
  - 我们遍历输入数组并将索引值添加到队列中。\n- 当加入队列的索引超出范围时，我们从队列中移除它们。\n- 我们正在寻找最大值，所以队列中小于当前索引值的值将无用，因此我们从队列中弹出它们。\n\
  - 所以窗口的最大值始终位于索引 `que[0]` 处，因此它们会被显示。\n\n**注意：** 涉及滑动窗口的问题可以使用双端队列高效地解决。\n\n**示例\
  \ 8.8**：\n\n```java\npublic static void maxSlidingWindows(int arr[], int size, int\
  \ k) {\n    ArrayDeque<Integer> que = new ArrayDeque<Integer>();\n    for (int i\
  \ = 0; i < size; i++) {\n        // 移除超出范围的元素\n```\n\n\n\n\n```java\nif (que.size()\
  \ > 0 && que.peek() <= i - k) {\n    que.remove();\n}\n// 左侧较小的值\nwhile (que.size()\
  \ > 0 && arr[que.peekLast()] <= arr[i]) {\n    que.removeLast();\n}\nque.add(i);\n\
  // 长度为 k 的窗口中的最大值位于索引 que[0]\n// 将其显示在屏幕上\nif (i >= (k - 1)) {\n    System.out.println(arr[que.peek()]);\n\
  }\n}\n\npublic static void main(String[] args) {\n    int arr[] = { 11, 2, 75, 92,\
  \ 59, 90, 55 };\n    int k = 3;\n    maxSlidingWindows(arr, 7, 3);\n}\n```\n输出\n\
  75, 92, 92, 92, 90\n\n### 滑动窗口最大值的最小值\n\n**问题：** 给定一个整数数组，找到长度为 `k` 的滑动窗口中所有最大值的最小值。\n\
  \n输入：11, 2, 75, 92, 59, 90, 55 和 `k = 3`\n\n输出：75\n\n**解：** 与上述问题相同。你也将同时跟踪滑动窗口中所有最大值的最小值。\n\
  \n**示例 8.9**：\n\n```java\npublic static int minOfMaxSlidingWindows(int arr[], int\
  \ size, int k) {\n    ArrayDeque<Integer> que = new ArrayDeque<Integer>();\n   \
  \ int minVal = 999999;\n    for (int i = 0; i < size; i++) {\n        // 移除超出范围的元素\n\
  \        if (que.size() > 0 && que.peek() <= i - k)\n            que.remove();\n\
  \        // 左侧较小的值\n        while (que.size() > 0 && arr[que.peekLast()] <= arr[i])\n\
  \            que.remove();\n        que.add(i);\n        // 长度为 k 的窗口\n        if\
  \ (i >= (k - 1) && minVal > arr[que.peek()])\n            minVal = arr[que.peek()];\n\
  \    }\n    System.out.println(\"Min of max is :: \" + minVal);\n    return minVal;\n\
  }\n\npublic static void main(String[] args) {\n    int arr[] = { 11, 2, 75, 92,\
  \ 59, 90, 55 };\n    int k = 3;\n    minOfMaxSlidingWindows(arr, 7, 3);\n}\n```\n\
