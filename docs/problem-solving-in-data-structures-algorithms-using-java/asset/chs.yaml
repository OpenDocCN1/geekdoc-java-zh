  \n\n\n\n\n栈（Stack）是一种以后进先出（LIFO）方式组织元素的基础数据结构。最后插入栈的元素将最先从栈中移除。\n\n栈在现实中的类比是“叠盘子”。想象用餐区有一堆叠盘子，每个人都从盘子堆顶部取一个盘子，从而为下一个人露出下一个盘子。\n\
  \n栈只允许访问栈顶元素。位于底部的元素在栈中停留的时间最长。\n\n![](img/00108.jpeg)\n\n计算机科学中也有栈的常见示例。函数调用栈（Function\
  \ call stack）就是栈的一个很好的例子。函数 `main()` 调用函数 `foo()`，然后 `foo()` 调用 `bar()`。这些函数调用是使用栈实现的。首先存在的是\
  \ `bar()`，然后是 `foo()`，最后是 `main()`。\n\n当我们在网页页面之间跳转时，每个页面的 URL 被存储在一个栈中，当前页面 URL\
  \ 位于顶部。如果我们点击返回按钮，每个 URL 条目就会逐个被弹出（pop）。\n\n## 栈抽象数据类型\n\n栈抽象数据类型定义为一个类，对于添加其中的元素遵循\
  \ LIFO 或后进先出的原则。\n\n栈应该支持以下操作：\n\n1. `Push()`：在栈顶添加单个元素。\n2. `Pop()`：从栈顶移除单个元素。\n\
  3. `Top()`：读取栈顶元素的值（不移除它）。\n4. `isEmpty()`：如果栈为空，则返回 1。\n5. `Size()`：返回栈中元素的数量。\n\
  \n`Push`：在栈的顶部添加值。\n\n![](img/00109.jpeg)\n\n`Pop`：移除栈顶的元素并将其返回给调用者函数。\n\n![](img/00110.jpeg)\n\
  \n栈可以使用数组或链表来实现。\n\n1. 当使用数组实现栈时，其容量（capacity）是固定的。\n2. 在链表的情况下，它包含的元素数量没有这种限制。\n\
  \n当使用数组实现栈时，栈顶通过一个名为 `top` 的索引变量进行管理。\n\n当使用链表实现栈时，`push()` 和 `pop()` 是通过在链表头部插入和从链表头部删除来实现的。\n\
  \n## 使用数组实现的栈\n\n**问题：使用固定长度的数组实现栈。**\n\n**示例 7.1**：使用数组的栈实现\n\n```java\npublic\
  \ class Stack {\n    private int capacity = 1000;\n    private int[] data;\n   \
  \ private int top = -1;\n\n    public Stack() {\n        data = new int[capacity];\n\
  \    }\n    public Stack(int size) {\n        data = new int[size];\n        capacity\
  \ = size;\n    }\n    /* 其他方法 */\n}\n```\n\n`isEmpty()` 函数在栈为空时返回 true，在所有其他情况下返回\
  \ false。\n\n```java\npublic boolean isEmpty() {\n    return (top == -1);\n}\n```\n\
  \n`size()` 函数返回栈中元素的数量。\n\n```java\npublic int size() {\n    return (top + 1);\n\
  }\n```\n\n`print` 函数将打印数组的元素。\n\n```java\npublic void print() {\n    for (int i\
  \ = top; i > -1; i--) {\n        System.out.print(\" \" + data[i]);\n    }\n}\n\
  ```\n\n`push()` 函数将值追加到数据数组中。\n\n```java\npublic void push(int value) throws IllegalStateException\
  \ {\n    if (size() == data.length) {\n        throw new IllegalStateException(\"\
  StackOvarflowException\");\n    }\n    top++;\n    data[top] = value;\n}\n```\n\n\
  在 `pop()` 函数中，首先会检查栈是否为空。然后它从 `data` 数组中弹出值并返回它。\n\n```java\npublic int pop() {\n\
  \    if (isEmpty()) {\n        throw new IllegalStateException(\"StackEmptyException\"\
  );\n    }\n    int topVal = data[top];\n    top--;\n    return topVal;\n}\n```\n\
  \n`top()` 函数返回存储在栈顶元素中的值（不移除它）\n\n```java\npublic int top() throws IllegalStateException\
  \ {\n    if (isEmpty()) {\n        throw new IllegalStateException(\"StackEmptyException\"\
  );\n    }\n    return data[top];\n}\n```\n\n栈的测试代码。\n\n```java\npublic static void\
  \ main(String[] args) {\n    Stack s = new Stack();\n    s.push(1);\n    s.push(2);\n\
  \    s.push(3);\n    s.print();\n    System.out.println(s.pop());\n    System.out.println(s.pop());\n\
  \    s.print();\n}\n```\n\n**分析**：\n- 声明并初始化了栈对象。\n- 使用 `push()` 和 `pop()` 添加和移除值。\n\
  \n## 带容量管理的数组栈\n\n**问题**：使用数组创建一个栈，但容量是经过管理的。当栈满时，容量翻倍。当元素数量减少到容量的一半以下时，容量减半。\n\n\
  **示例 7.2**：\n\n```java\npublic class Stack2 {\n    private int[] data;\n    private\
  \ int top = -1;\n    private int minCapacity;\n    private int capacity;\n\n   \
  \ public Stack2() {\n        // 初始化逻辑\n    }\n    public Stack2(int size) {\n  \
  \      // 初始化逻辑\n    }\n    /* 方法 */\n}\n```\n\n**分析**：\n- 栈类包含字段。\n- `top` 是索引。\n\
  - `data` 是数组。\n- `capacity` 是受管理的。\n\n### 容量增长的 Push\n\n实现 `push()` 函数，使得当栈满时，容量翻倍。\n\
  \n**示例 7.3**：\n\n```java\npublic void push(int value) {\n    if (size() == capacity)\
  \ {\n        System.out.println(\"size doubled\");\n        int[] newData = new\
  \ int[capacity];\n        System.arraycopy(data, 0, newData, 0, capacity);\n   \
  \     data = newData;\n        capacity *= 2;\n    }\n    top++;\n    data[top]\
  \ = value;\n}\n```\n\n**分析**：\n- 我们增加了栈的最大容量。\n- 重新分配了内存。\n- 将数据复制到新位置。\n\n### 容量缩小的\
  \ Pop\n\n实现 `pop()` 函数，使得当栈中的数量减少到容量的一半以下时，容量减少。\n\n**示例 7.4**：\n\n```java\npublic\
  \ int pop() {\n    if (isEmpty()) {\n        throw new IllegalStateException(\"\
  StackEmptyException\");\n    }\n    int topVal = data[top];\n    top--;\n    if\
  \ (size() == capacity / 2 && capacity > minCapacity) {\n        System.out.println(\"\
  size halfed\");\n        capacity /= 2;\n        int[] newData = new int[capacity];\n\
  \        System.arraycopy(data, 0, newData, 0, capacity);\n        data = newData;\n\
  \    }\n    return topVal;\n}\n```\n\n## 使用链表实现的栈\n\n**问题：可以使用链表实现栈。在链表头部插入元素并从链表头部删除。**\n\
  \n**示例 7.5**：\n\n```java\npublic class StackLL {\n    private Node head = null;\n\
  \    private int size = 0;\n\n    private static class Node {\n        private int\
  \ value;\n        private Node next;\n    }\n}\n```\n\n\n\n\n\n```java\npublic Node(int\
  \ v, Node n) {\n    value = v;\n    next = n;\n}\n}\n\npublic int size() {\n   \
  \ return size;\n}\n\npublic boolean isEmpty() {\n    return size == 0;\n}\n\npublic\
  \ int peek() throws IllegalStateException {\n    if (isEmpty()) {\n        throw\
  \ new IllegalStateException(\"StackEmptyException\");\n    }\n    return head.value;\n\
  }\n\npublic void push(int value) {\n    head = new Node(value, head);\n    size++;\n\
  }\n\npublic int pop() throws IllegalStateException {\n    if (isEmpty()) {\n   \
  \     throw new IllegalStateException(\"StackEmptyException\");\n    }\n    int\
  \ value = head.value;\n    head = head.next;\n    size--;\n    return value;\n}\n\
  \npublic void print() {\n    Node temp = head;\n    while (temp != null) {\n   \
  \     System.out.print(temp.value + \" \");\n        temp = temp.next;\n    }\n\
  }\n\npublic static void main(String[] args) {\n    StackLL s = new StackLL();\n\
  \    s.push(1);\n    s.push(2);\n    s.push(3);\n    s.print();\n    System.out.println(s.pop());\n\
  \    System.out.println(s.pop());\n    s.print();\n}\n```\n\n### 分析\n\n- 使用链表实现的栈简单来说就是在头部进行插入和删除操作。\n\
  - 在 `push()` 函数中，为节点创建内存。然后存储值。最后，将节点插入到开头。\n- 在 `pop()` 函数中，链表的头开始指向第二个节点。并返回第一个节点的值。\n\
  \n#### 系统栈与方法调用\n\n方法是使用栈来实现的。当一个方法被调用时，当前执行会停止，控制权转移到被调用的方法。当被调用的方法退出后，执行从停止的地方恢复。为了获取恢复执行的精确位置，下一条指令的地址被存储在系统栈中。当方法调用完成后，会取出栈顶的地址。\n\
  \n##### 示例 7.6：函数流\n\n```java\npublic void function2() {\n    System.out.println(\"\
  fun2 line1\");\n}\n\npublic void function1() {\n    System.out.println(\"fun1 line1\"\
  );\n    function2();\n    System.out.println(\"fun1 line2\");\n}\n\npublic void\
  \ main() {\n    System.out.println(\"main line 1\");\n    function1();\n    System.out.println(\"\
  main line 2\");\n}\n```\n\n**输出：**\n```\nmain line 1\nfun1 line 1\nfun2 line 1\n\
  fun1 line 2\nmain line 2\n```\n\n##### 分析\n\n- 该程序从 `main()` 方法开始。\n- `main()` 的第一条语句将被执行。这会打印\
  \ \"main line 1\"。\n- 然后调用了 `function1()`。在控制权进入 `function1()` 之前，下一行的地址被存储在系统栈中。\n\
  - 控制权进入 `function1()` 方法。\n- 执行 `function1()` 内部的第一条语句，这会打印 \"fun1 line1\"。\n- 从\
  \ `function1()` 调用了 `function2()`。在控制权进入 `function2()` 之前，下一行的地址被添加到系统栈中。\n- 控制权进入\
  \ `function2()` 方法。\n- \"fun2 line1\" 被打印到屏幕。\n- 当 `function2()` 退出时，控制权返回 `function1()`。然后程序从栈中读取下一条指令，执行下一行并在屏幕上打印\
  \ \"fun1 line2\"。\n- 当 `fun1()` 退出时，控制权返回到 `main` 方法。然后程序从栈中读取下一条指令并执行它，最后在屏幕上打印出\
  \ \"main line 2\"。\n\n**需要记忆的点：**\n\n1. 方法是使用栈实现的。\n2. 当方法被调用时，下一条指令的地址被推入栈中。\n\
  3. 当方法执行结束时，执行的地址会从栈中取出。\n\n### 栈中的问题\n\n#### 有序插入\n\n**问题：** 给定一个元素有序的栈，写一个函数按顺序插入元素。使得最大值在顶部，最小值在底部。\n\
  \n**解决方案：** 从栈中弹出元素，直到栈顶大于当前值。然后添加当前值，再将弹出的元素重新加入栈中。时间复杂度 O(n)\n\n**示例 7.7：**\n\n\
  ```java\npublic static void sortedInsert(Stack<Integer> stk, int element) {\n  \
  \  int temp;\n    if (stk.isEmpty() || element > stk.peek())\n        stk.push(element);\n\
  \    } else {\n        temp = stk.pop();\n        sortedInsert(stk, element);\n\
  \        stk.push(temp);\n    }\n}\n```\n\n#### 栈排序\n\n**问题：** 给定一个栈，对元素进行排序使得最大值在顶部。\n\
  \n**第一个解决方案：** 递归调用排序栈函数。然后在递归内部调用有序插入函数使栈有序。时间复杂度为 O(n²)\n\n**示例 7.8：**\n\n```java\n\
  public static void sortStack(Stack<Integer> stk) {\n    int temp;\n    if (stk.isEmpty()\
  \ == false) {\n        temp = stk.pop();\n        sortStack(stk);\n        stk.push(temp);\n\
  \    }\n}\n```\n\n**第二种解决方案：** 相同的问题可以通过使用另一个栈 `stk2` 来迭代解决。我们使用一个栈 `stk2`，它将以有序方式存储元素。每次从原始栈弹出元素并添加到新栈中。时间复杂度为\
  \ O(n²)\n\n**示例 7.9：**\n\n```java\npublic static void sortStack(Stack<Integer> stk)\
  \ {\n    int temp;\n    Stack<Integer> stk2 = new Stack<Integer>();\n    while (stk.isEmpty()\
  \ == false) {\n        temp = stk.pop();\n        while (stk2.isEmpty() == false\
  \ && stk2.peek() > temp) {\n            stk.push(stk2.pop());\n        }\n     \
  \   stk2.push(temp);\n    }\n    while (stk2.isEmpty() == false) {\n        stk.push(stk2.pop());\n\
  \    }\n}\n```\n\n#### 底部插入\n\n**问题：** 给定一个栈，写一个函数将元素插入到栈底部。\n\n**解决方案：** 递归从栈中弹出元素直到它为空。为空后将输入值插入栈中。时间复杂度为\
  \ O(n)\n\n**示例 7.10：**\n\n```java\npublic static void bottomInsert(Stack<Integer>\
  \ stk, int element) {\n    int temp;\n    if (stk.isEmpty()) {\n        stk.push(element);\n\
  \    } else {\n        temp = stk.pop();\n        bottomInsert(stk, element);\n\
  \        stk.push(temp);\n    }\n}\n```\n\n#### 反转栈\n\n**问题：** 给定一个栈，反转它的元素。\n\n\
  **第一个解决方案：** 使用递归，从栈中弹出元素并使用 `bottomInsert` 函数将它们添加到底部。最终整个栈将被反转。时间复杂度为 O(n²)\n\n\
  **示例 7.11：**\n\n```java\npublic static <T> void reverseStack(Stack<T> stk) {\n \
  \   if (stk.isEmpty()) {\n        return;\n    } else {\n        T value = stk.pop();\n\
  \        reverseStack(stk);\n        bottomInsert(stk, value);\n    }\n}\n```\n\n\
  **第二种解决方案：** 使用队列，弹出栈的所有元素并插入队列，然后从队列中取出元素并插入栈中，栈元素将被反转。时间复杂度为 O(n)\n\n**示例 7.12：**\n\
  \n```java\npublic static void reverseStack2(Stack<Integer> stk) {\n    ArrayDeque<Integer>\
  \ que = new ArrayDeque<Integer>();\n    while (stk.isEmpty() == false) {\n     \
  \   que.add(stk.pop());\n    }\n    while (que.isEmpty() == false) {\n        stk.push(que.remove());\n\
  \    }\n}\n```\n\n#### 反转栈中的 k 个元素\n\n**问题：** 反转栈顶部的 k 个元素。\n\n\n\n\n\n# 解决方案：创建一个队列，从栈中弹出\
  \ k 个元素并将其加入队列。然后从队列中移除并将它们压回栈中。前 k 个元素将反转。时间复杂度为 O(n)\n\n## 示例 7.13:\n\n```java\n\
  public static void reverseKElementInStack(Stack<Integer> stk, int k) {\n    ArrayDeque<Integer>\
  \ que = new ArrayDeque<Integer>();\n    int i = 0;\n    while (stk.isEmpty() ==\
  \ false && i < k) {\n        que.add(stk.pop());\n        i++;\n    }\n    while\
  \ (que.isEmpty() == false)\n        stk.push(que.remove());\n}\n```\n\n## 反转队列\n\
  \n**问题：** 反转队列中的元素。\n\n**解决方案：** 移除队列的所有元素并将其入栈，直到队列为空。然后从栈中弹出元素并加入队列。最后队列中的所有元素都反转了。时间复杂度为\
  \ O(n)\n\n## 示例 7.14:\n\n```java\npublic static void reverseQueue(ArrayDeque<Integer>\
  \ que) {\n    Stack<Integer> stk = new Stack<Integer>();\n    while (que.isEmpty()\
  \ == false)\n        stk.push(que.remove());\n    while (stk.isEmpty() == false)\n\
  \        que.add(stk.pop());\n}\n```\n\n## 反转队列中的前 K 个元素\n\n**问题：** 反转队列的前 K 个元素。\n\
  \n**解决方案：** 使用栈，移除队列的前 K 个元素并将它们推入栈。然后从栈中弹出元素并加入队列。这 K 个元素被反转了，但它们被添加到了队列的末尾。因此，我们需要通过移除前面的元素并将其添加到队列末尾，将这些元素带回队列的开头。时间复杂度为\
  \ O(n)\n\n## 示例 7.15:\n\n```java\npublic static void reverseKElementInQueue(ArrayDeque<Integer>\
  \ que, int k) {\n    Stack<Integer> stk = new Stack<Integer>();\n    int i = 0,\
  \ diff, temp;\n    while (que.isEmpty() == false && i < k) {\n        stk.push(que.remove());\n\
  \        i++;\n    }\n    while (stk.isEmpty() == false) {\n        que.add(stk.pop());\n\
  \    }\n    diff = que.size() - k;\n    while (diff > 0) {\n        temp = que.remove();\n\
  \        que.add(temp);\n        diff -= 1;\n    }\n}\n```\n\n## 使用单个列表实现两个栈\n\n\
  **问题：** 如何使用单个列表实现两个栈。\n\n**解决方案：** 使用双端队列逻辑。第一个栈通过从左侧添加和从左侧移除元素来实现。第二个栈通过从右侧添加和从右侧移除元素来实现。两个栈的推（push）和出（pop）操作复杂度均为\
  \ O(1)。\n\n## 示例 7.16:\n\n```java\npublic class TwoStack {\n    private final int\
  \ MAX_SIZE = 50;\n    int top1;\n    int top2;\n    int[] data;\n    public TwoStack()\
  \ {\n        top1 = -1;\n        top2 = MAX_SIZE;\n        data = new int[MAX_SIZE];\n\
  \    }\n    public void StackPush1(int value) {\n        if (top1 < top2 - 1) {\n\
  \            data[++top1] = value;\n        } else {\n            System.out.print(\"\
  Stack is Full!\");\n        }\n    }\n    public void StackPush2(int value) {\n\
  \        if (top1 < top2 - 1) {\n            data[--top2] = value;\n        } else\
  \ {\n            System.out.print(\"Stack is Full!\");\n        }\n    }\n    public\
  \ int Pop1() {\n        if (top1 >= 0) {\n            int value = data[top1--];\n\
  \            return value;\n        } else {\n            System.out.print(\"Stack\
  \ Empty!\");\n        }\n        return -999;\n    }\n    public int Pop2() {\n\
  \        if (top2 < MAX_SIZE) {\n            int value = data[top2++];\n       \
  \     return value;\n        } else {\n            System.out.print(\"Stack Empty!\"\
  );\n        }\n        return -999;\n    }\n    public static void main(String[]\
  \ args) {\n        TwoStack st = new TwoStack();\n        for (int i = 0; i < 10;\
  \ i++) {\n            st.StackPush1(i);\n        }\n        for (int j = 0; j <\
  \ 10; j++) {\n            st.StackPush2(j + 10);\n        }\n        for (int i\
  \ = 0; i < 10; i++) {\n            System.out.println(\"stack one pop value: \"\
  \ + st.Pop1());\n            System.out.println(\"stack two pop value: \" + st.Pop2());\n\
  \        }\n    }\n}\n```\n\n**分析：** 使用同一个列表来实现两个栈。第一个栈从数组开头开始填充，第二个栈从数组末尾开始填充。需要考虑溢出和栈空的情况。\n\
  \n## 最小栈 (Min stack)\n\n**问题：** 设计一个栈，其中获取栈最小最小值的操作也应在 O(1) 时间复杂度内完成。\n\n**提示：**\
  \ 保留两个栈，一个是普通栈，仅用于存储元素；另一个用于存储最小值。\n\n1. **入栈（Push）：** 将元素推入栈 1。如果该元素比栈 2 中的最小值小，则将其推入栈\
  \ 2。\n2. **出栈（Pop）：** 从栈 1 中弹出元素。如果弹出的元素是栈 2 中的最小值，则也从栈 2 中弹出。\n3. **获取最小值（Min）：**\
  \ 读取栈 2 栈顶。\n\n## 使用队列实现栈\n\n**问题：** 如何使用队列实现栈。分析栈操作的运行时间。\n\n请参考队列章节。\n\n## 括号匹配\
  \ (Balanced Parenthesis)\n\n**问题：** 编写一个程序检查括号是否平衡（如 {}, []）。结束符号应与最近看到的起始符号匹配。\n\
  例如 `{}` 是合法的，`{()}` 是合法的，但 `{((}` 和 `{(}` 不合法。\n\n## 示例 7.17:\n\n```java\npublic\
  \ static boolean isBalancedParenthesis(String expn) {\n    Stack<Character> stk\
  \ = new Stack<Character>();\n    for (char c : expn.toCharArray()) {\n        switch\
  \ (c) {\n            case '{':\n            case '[':\n            case '(':\n \
  \               stk.push(c);\n                break;\n            case '}':\n  \
  \              if (stk.pop() != '{') return false;\n                break;\n   \
  \         case ']':\n                if (stk.pop() != '[') return false;\n     \
  \           break;\n            case ')':\n                if (stk.pop() != '(')\
  \ return false;\n                break;\n        }\n    }\n    return stk.isEmpty();\n\
  }\n\npublic static void main(String[] args) {\n    String expn = \"{()}[]\";\n \
  \   boolean value = isBalancedParenthesis(expn);\n    System.out.println(\"Given\
  \ Expn:\" + expn);\n    System.out.println(\"Result after isParenthesisMatched:\"\
  \ + value);\n}\n```\n\n**分析：**\n\n· 遍历字符串当遇到起始括号时将其推入栈。此外，当遇到结束括号时，从栈中弹出一个并比较是否与对应的结束括号匹配。\n\
  · 如果不匹配，则返回 false。\n· 如果在遍历结束后到达字符串末尾且栈为空，则括号平衡。\n\n## 括号最大深度 (Max Depth Parenthesis)\n\
  \n**问题：** 给定一个平衡的括号表达式，你需要找到括号的最大深度。\n\n例如，“()”的最大深度是 1，“((()))()”的最大深度是 3。\n\n\
  **第一种解决方案：** 创建一个栈，当遇到起始括号时将其插入栈中并增加深度计数器。当遇到结束括号时，从栈中弹出起始括号并减少深度计数器。记录深度以找到最大深度。\n\
  \n## 示例 7.18:\n\n```java\npublic static int maxDepthParenthesis(String expn, int\
  \ size) {\n    Stack<Character> stk = new Stack<Character>();\n    int maxDepth\
  \ = 0;\n    int depth = 0;\n    char ch;\n}\n```\n\n\n\n\n\n```java\nfor (int i\
  \ = 0; i < size; i++) {\n    ch = expn.charAt(i);\n    if (ch == '(') {\n      \
  \  stk.push(ch);\n        depth += 1;\n    } else if (ch == ')') {\n        stk.pop();\n\
  \        depth -= 1;\n    }\n    if (depth > maxDepth)\n        maxDepth = depth;\n\
  }\nreturn maxDepth;\n}\n\npublic static void main(String[] args) {\n    String expn\
  \ = \"((((A)))((((BBB()))))()()())\";\n    int size = expn.length();\n    int value\
  \ = maxDepthParenthesis(expn, size);\n    System.out.println(\"Max depth parenthesis\
  \ is \" + value);\n}\n```\n\n**第二种解决方案：** 我们不需要寻找表达式是否平衡。题目已经给出它是平衡的，因此我们不需要像上一个方案那样使用栈。\n\
  \n**示例 7.19**:\n\n```java\npublic static int maxDepthParenthesis2(String expn, int\
  \ size) {\n    int maxDepth = 0;\n    int depth = 0;\n    char ch;\n    for (int\
  \ i = 0; i < size; i++) {\n        ch = expn.charAt(i);\n        if (ch == '(')\n\
  \            depth += 1;\n        else if (ch == ')')\n            depth -= 1;\n\
  \        if (depth > maxDepth)\n            maxDepth = depth;\n    }\n    return\
  \ maxDepth;\n}\n```\n\n### 最长连续平衡括号\n\n**问题：** 给定包含左括号和右括号的字符串，你需要找到一个具有平衡括号的子字符串。\n\
  \n**示例 7.20**:\n\n```java\npublic static int longestContBalParen(String string,\
  \ int size) {\n    Stack<Integer> stk = new Stack<Integer>();\n    stk.push(-1);\n\
  \    int length = 0;\n    for (int i = 0; i < size; i++) {\n        if (string.charAt(i)\
  \ == '(')\n            stk.push(i);\n        else // string[i] == ')'\n        {\n\
  \            stk.pop();\n            if (stk.size() != 0)\n                length\
  \ = Math.max(length, i - stk.peek());\n            else\n            stk.push(i);\n\
  \        }\n    }\n    return length;\n}\npublic static void main(String[] args)\
  \ {\n    String expn = \"())((()))()(()\";\n    int size = expn.length();\n    int\
  \ value = longestContBalParen(expn, size);\n    System.out.println(\"longestBalParen\
  \ \" + value);\n}\n```\n\n### 反转括号\n\n**问题：** 需要多少次翻转才能使不平衡的表达式变为平衡。\n输入：`)(())(`\
  \ 输出：3\n输入：`)))` 输出：3\n\n**解决方案：**\n- 首先，平衡的括号不需要翻转，因此将它们移除。在移除所有平衡的括号后，我们将得到形式为\
  \ `)))(((` 的括号。\n- 假设左括号的总数是 `OpenCount`，右括号的总数是 `CloseCount`。\n- 当 `OpenCount`\
  \ 为偶数且 `CloseCount` 为偶数时，对它们的一半进行翻转将使表达式平衡。\n- 当 `OpenCount` 为奇数且 `CloseCount` 为奇数时，一旦你拥有\
  \ `OpenCount/2` 和 `CloseCount/2`，就会剩下 `)(`，这还需要 2 次翻转，因此推导出公式为：翻转总数 = `math.ceil(OpenCount\
  \ / 2.0) + math.ceil(CloseCount/2.0)`。\n\n**示例 7.21**:\n\n```java\npublic static\
  \ int reverseParenthesis(String expn, int size) {\n    Stack<Character> stk = new\
  \ Stack<Character>();\n    int openCount = 0;\n    int closeCount = 0;\n    char\
  \ ch;\n    if (size % 2 == 1) {\n        System.out.println(\"Invalid odd length\
  \ \" + size);\n        return -1;\n    }\n    for (int i = 0; i < size; i++) {\n\
  \        ch = expn.charAt(i);\n        if (ch == '(')\n            stk.push(ch);\n\
  \        else if (ch == ')')\n            if (stk.size() != 0 && stk.peek() == '(')\n\
  \                stk.pop();\n            else\n            stk.push(')');\n    }\n\
  \    while (stk.size() != 0) {\n        if (stk.pop() == '(')\n            openCount\
  \ += 1;\n        else\n            closeCount += 1;\n    }\n    int reversal = (int)\
  \ Math.ceil(openCount / 2.0) + (int) Math.ceil(closeCount / 2.0);\n    return reversal;\n\
  }\npublic static void main(String[] args) {\n    String expn = \"())((()))()()\"\
  ;\n    String expn2 = \")(()(\";\n    int size = expn2.length();\n    int value\
  \ = reverseParenthesis(expn2, size);\n    System.out.println(\"Given expn : \" +\
  \ expn2);\n    System.out.println(\"reverse Parenthesis is \" + value);\n}\n```\n\
  \n### 寻找重复括号\n\n**问题：** 给定一个表达式，你需要找到冗余括号。\n**解决方案：** 冗余括号是指那些没有改变结果的括号。算法通过将 `)`\
  \ 之外元素加入栈。当遇到 `)` 时，找到它对应的括号。如果它们之间的元素数为 0 或 1，则它是冗余的。\n\n**示例 7.22**:\n\n```java\n\
  public static boolean findDuplicateParenthesis(String expn, int size) {\n    Stack<Character>\
  \ stk = new Stack<Character>();\n    char ch;\n    int count;\n    for (int i =\
  \ 0; i < size; i++) {\n        ch = expn.charAt(i);\n        if (ch == ')') {\n\
  \            count = 0;\n            while (stk.size() != 0 && stk.peek() != '(')\
  \ {\n                stk.pop();\n                count += 1;\n            }\n  \
  \          if (count <= 1)\n                return true;\n        } else\n     \
  \   stk.push(ch);\n    }\n    return false;\n}\npublic static void main(String[]\
  \ args) {\n    String expn = \"(((a+b))+c)\";\n    System.out.println(\"Given expn\
  \ : \" + expn);\n    int size = expn.length();\n    boolean value = findDuplicateParenthesis(expn,\
  \ size);\n    System.out.println(\"Duplicate Found : \" + value);\n}\n```\n\n###\
  \ 打印括号编号\n\n**问题：** 给定一个表达式，为每一对括号编号，使得每一对的左括号和右括号具有相同的数字。\n示例：\n输入：`(((a+(b))+(c+d)))`\n\
  输出：`[1, 2, 3, 4, 4, 3, 5, 5, 2, 1]`\n\n**示例 7.23**:\n\n```java\npublic static void\
  \ printParenthesisNumber(String expn, int size) {\n    char ch;\n    Stack<Integer>\
  \ stk = new Stack<Integer>();\n    String output = new String();\n    int count\
  \ = 1;\n    for (int i = 0; i < size; i++) {\n        ch = expn.charAt(i);\n   \
  \     if (ch == '(') {\n            stk.push(count);\n            output += count;\n\
  \            count += 1;\n        } else if (ch == ')') {\n            output +=\
  \ stk.pop();\n        }\n    }\n    System.out.println(\"Parenthesis Count \");\n\
  \    System.out.println(output);\n}\n\npublic static void main(String[] args) {\n\
  \    String expn1 = \"(((a+(b))+(c+d)))\";\n    int size = expn1.length();\n   \
  \ System.out.println(\"Given expn \" + expn1);\n    printParenthesisNumber(expn1,\
  \ size);\n}\n```\n\n\n\n\n\n所以如果我们想先乘以 B 和 C，然后将结果加到 A。那么同样的表达式可以使用括号 `A + (B *\
  \ C)` 来无歧义地写出。另一方面，如果我们想先加 A 和 B，然后将和乘以 C，我们将其写为 `(A + B) * C`。因此，在中缀表达式中，为了使表达式无歧义，我们需要括号。\n\
  \n**中缀表达式**：在这种表示法中，我们将运算符放在操作数的中间。\n\n`< 操作数 > < 运算符 > < 操作数 >`\n\n**前缀表达式**：在这种表示法中，我们将运算符放在操作数的开头。\n\
  \n`< 运算符 > < 操作数 > < 操作数 >`\n\n**后缀表达式**：在这种表示法中，我们将运算符放在操作数的末尾。\n\n`< 操作数 > < 操作数\
  \ > < 运算符 >`\n\n| 中缀表达式 | 前缀表达式 | 后缀表达式 |\n| --- | --- | --- |\n| A + B | + A B\
  \ | A B + |\n| A + (B * C) | + A * B C | A B C * + |\n| (A + B) * C | * + ABC |\
  \ A B + C * |\n\n现在最显而易见的问题是，当我们已经有了可以很好使用的中缀表达式时，为什么还需要这种如此不自然的前缀或后缀表达式呢？答案是，中缀表达式具有歧义性，它们需要括号来消除歧义。而后缀和前缀表示法法不需要任何括号。\n\
  \n### 中缀转后缀转换\n\n**问题**：将中缀表达式转换为后缀表达式的函数。\n\n**示例 7.24**：\n\n```java\npublic static\
  \ int precedence(char x) {\n      if (x == '(') {\n          return (0);\n     \
  \ }\n      if (x == '+' || x == '-') {\n          return (1);\n      }\n      if\
  \ (x == '*' || x == '/' || x == '%')\n          return (2);\n      if (x == '^')\
  \ {\n          return (3);\n      }\n      return (4);\n}\n\npublic static String\
  \ infixToPostfix(String expn) {\n      String output = \"\";\n      char[] out =\
  \ infixToPostfix(expn.toCharArray());\n      for (char ch : out) {\n          output\
  \ = output + ch;\n      }\n      return output;\n}\n\npublic static char[] infixToPostfix(char[]\
  \ expn) {\n      Stack<Character> stk = new Stack<Character>();\n      String output\
  \ = \"\";\n      char out;\n      for (char ch : expn) {\n          if (ch <= '9'\
  \ && ch >= '0') {\n              output = output + ch;\n          } else {\n   \
  \           switch (ch) {\n              case '+':\n              case '-':\n  \
  \            case '*':\n              case '/':\n              case '%':\n     \
  \         case '^':\n                      while (stk.isEmpty() == false && precedence(ch)\
  \ <= precedence(stk.peek())) {\n                          out = stk.pop();\n   \
  \                       output = output + \" \" + out;\n                      }\n\
  \                      stk.push(ch);\n                      output = output + \"\
  \ \";\n                      break;\n              case '(':\n                 \
  \ stk.push(ch);\n                      break;\n              case ')':\n       \
  \               while (stk.isEmpty() == false && (out = stk.pop()) != '(') {\n \
  \                         output = output + \" \" + out + \" \";\n             \
  \         }\n                      break;\n              }\n          }\n      }\n\
  \      while (stk.isEmpty() == false) {\n          out = stk.pop();\n          output\
  \ = output + out + \" \";\n      }\n      return output.toCharArray();\n}\n\npublic\
  \ static void main(String[] args) {\n      String expn = \"10+((3))*5/(16-4)\";\n\
  \      String value = infixToPostfix(expn);\n      System.out.println(\"Infix Expn:\
  \ \" + expn);\n      System.out.println(\"Postfix Expn: \" + value);\n}\n```\n\n\
  **分析**：\n\n- 按照操作数到达的顺序打印操作数。\n- 如果栈为空或栈顶包含左括号 `(`，则我们应该将入栈运算符压入栈。\n- 如果入栈符号是左括号\
  \ `(`，则将左括号压入栈。\n- 如果入栈符号是右括号 `)`，则从栈中弹出并打印运算符，直到看到左括号 `(` 为止。丢弃这对括号。\n- 如果入栈符号的优先级高于栈顶运算符的优先级，则将其压入栈。\n\
  - 如果入栈符号与栈顶符号优先级相等，则使用结合性。如果结合性是从左到右，则弹出并打印栈顶符号，然后将入栈运算符压栈。如果结合性是从右到左，则将入栈运算符压栈。\n\
  - 如果入栈符号的优先级低于栈顶运算符，则弹出并打印栈顶运算符。然后将入栈运算符与栈顶的新运算符进行比较。\n- 在表达式结束时，弹出并打印栈中所有的运算符。\n\
  \n### 中缀转前缀转换\n\n**问题**：将中缀表达式转换为后缀表达式的函数（注：此处原文描述为 postfix，根据逻辑应为 prefix）。\n\n\
  **示例 7.25**：\n\n```java\npublic static String infixToPrefix(String expn) {\n   \
  \   char[] arr = expn.toCharArray();\n      reverseString(arr);\n      replaceAnthesis(arr);\n\
  \      arr = infixToPostfix(arr);\n      reverseString(arr);\n      expn = new String(arr);\n\
  \      return expn;\n}\n\npublic static void replaceAnthesis(char[] a) {\n     \
  \ int lower = 0;\n      int upper = a.length - 1;\n      while (lower <= upper)\
  \ {\n          if (a[lower] == '(') {\n              a[lower] = ')';\n         \
  \ } else if (a[lower] == ')') {\n              a[lower] = '(';\n          }\n  \
  \        lower++;\n      }\n}\n\npublic static void reverseString(char[] expn) {\n\
  \      int lower = 0;\n      int upper = expn.length - 1;\n      char tempChar;\n\
  \      while (lower < upper) {\n          tempChar = expn[lower];\n          expn[lower]\
  \ = expn[upper];\n          expn[upper] = tempChar;\n          lower++;\n      \
  \    upper--;\n      }\n}\n\npublic static void main(String[] args) {\n      String\
  \ expn = \"10+((3))*5/(16-4)\";\n      String value = infixToPrefix(expn);\n   \
  \   System.out.println(\"Infix Expn: \" + expn);\n      System.out.println(\"Prefix\
  \ Expn: \" + value);\n}\n```\n\n**分析**：\n\n1. 反转给定的中缀表达式。\n2. 将反转表达式中的 `(` 替换为 `)`并将\
  \ `)` 替换为 `(`。\n3. 现在应用已讨论的中缀转后缀程序。\n4. 反转生成的后缀表达式即为所需的前缀表达式。\n\n### 后缀求值\n\n**问题**：编写一个求后缀表达式值的函数。例如：表达式\
  \ `1 2 + 3 4 + *` 输出 21。\n\n**示例 7.26**：\n\n```java\npublic static int postfixEvaluate(String\
  \ expn) {\n      Stack<Integer> stk = new Stack<Integer>();\n      Scanner tokens\
  \ = new Scanner(expn);\n      while (tokens.hasNext()) {\n          if (tokens.hasNextInt())\
  \ {\n              stk.push(tokens.nextInt());\n          } else {\n           \
  \   int num1 = stk.pop();\n              int num2 = stk.pop();\n              char\
  \ op = tokens.next().charAt(0);\n              switch (op) {\n              case\
  \ '+':\n                  stk.push(num1 + num2);\n                  break;\n   \
  \           case '-':\n                  stk.push(num1 - num2);\n              \
  \    break;\n              case '*':\n                  stk.push(num1 * num2);\n\
  \                  break;\n              case '/':\n                  stk.push(num1\
  \ / num2);\n                  break;\n              }\n          }\n      }\n  \
  \    tokens.close();\n      return stk.pop();\n}\n\npublic static void main(String[]\
  \ args) {\n      String expn = \"6 5 2 3 + 8 * + 3 + *\";\n      int value = postfixEvaluate(expn);\n\
  \      System.out.println(\"Given Postfix Expn: \" + expn);\n      System.out.println(\"\
  Result after Evaluation: \" + value);\n}\n```\n\n**分析**：\n\n1) 创建一个栈来存储值或操作数。\n\n\
  \n\n\n2) 扫描给定表达式并对每个元素执行以下操作：\n\na) 如果该元素是数字，则将其入栈。\n\nb) 如果该元素是操作符，则从栈中弹出值。对这些值执行操作符计算，并将结果入栈。\n\
  \n4) 当表达式完全扫描完成后，栈中的数字即为结果。\n\n### 基于栈的拒绝法 (Stack Based Rejection Method)\n\n在处理遵循特定拒绝属性的数据时，使用\
  \ `Stack Based Rejection` 技术。某些索引处的值可以用于拒绝在它之前处理的某些值。被拒绝的值是那些对后续处理不重要的值。以下示例如“股票跨度问题”、“直方图中的最大矩形面积”、“股票分析师问题”等是其若干例子。\n\
  \n### 股票跨度问题 (Stock Span Problem)\n\n**问题：** 在给定的数组 `A[i]` 每日股票价格列表中，找到每天的股票跨度。股票的跨度是指股票价格低于该日价格的最大天数。\n\
  \n或者\n\n给定一个直方图，找到每个当前柱状图左侧小于当前柱状图值的连续柱状图个数。\n\n![](img/00111.jpeg)\n\n**第一种解****暴力法，使用两个循环。外层循环用于选择直方图中的柱/元素。内层循环用于找到小于当前柱的连续柱状图的计数。\n\
  \n**示例 7.27**:\n\n```java\npublic static int[] StockSpanRange(int[] arr) {\n   \
  \ int[] SR = new int[arr.length];\n    SR[0] = 1;\n    for (int i = 1; i < arr.length;\
  \ i++) {\n        SR[i] = 1;\n        for (int j = i - 1; (j >= 0) && (arr[i] >=\
  \ arr[j]); j--) {\n            SR[i]++;\n        }\n    }\n    return SR;\n}\n\n\
  public static void main(String[] args) {\n    int[] arr = { 6, 5, 4, 3, 2, 4, 5,\
  \ 7, 9 };\n    int size = arr.length;\n    int[] value = StockSpanRange(arr);\n\
  \    System.out.print(\"StockSpanRange : \");\n    for (int val : value)\n     \
  \   System.out.print(\" \" + val);\n}\n```\n\n时间复杂度：`O(n²)`，每个柱子的长度都与其之前的柱子进行比较。\n\
  \n**第二种解**：上述算法对于每个柱子，我们都在比较它之前的柱子的长度。如果通过某种方式我们可以获取当前柱之前且长度大于当前柱的柱子的索引。假设这个虚拟柱子的索引为\
  \ `M`，当前柱的索引为 `N`，那么股票跨度范围将为 `(N – M)`。通过使用栈，可以通过一些记录工作来获取这样的索引。\n\n我们将股票输入数组称为\
  \ `arr`。创建一个栈来存储索引值并添加值 0。然后遍历股票输入数组中的值。假设我们正在分析的当前索引为 `curr`，栈顶的索引为 `top`。对于每个股票输入值\
  \ `arr[curr]`，将其与 `arr[top]` 进行比较。如果值 `arr[curr]` 小于或等于 `arr[top]`，则将 `curr` 入栈。如果值\
  \ `arr[curr]` 大于 `arr[top]`，则开始从栈中弹出值直到 `arr[curr] > arr[top]`。然后将 `curr` 入栈。将股票跨度存储到\
  \ `SR[curr] = curr – top`。对输入数组的所有索引重复此过程，`SR` 数组将被填充。\n\n**示例 7.28**:\n\n```java\n\
  public static int[] StockSpanRange2(int[] arr) {\n    Stack<Integer> stk = new Stack<Integer>();\n\
  \    int[] SR = new int[arr.length];\n    stk.push(0);\n    SR[0] = 1;\n    for\
  \ (int i = 1; i < arr.length; i++) {\n        while (!stk.isEmpty() && arr[stk.peek()]\
  \ <= arr[i]) {\n            stk.pop();\n        }\n        SR[i] = stk.isEmpty()\
  \ ? (i + 1) : (i - stk.peek());\n        stk.push(i);\n    }\n    return SR;\n}\n\
  ```\n\n对于输入数组中的每个值，索引只会被入栈一次，且索引只能从栈中取出一次。每次比较都会导致一个值入栈或一个值出栈。因此，如果数组中有 `n` 个元素，那么最多会有\
  \ 2n 次比较，所以该算法是线性的。时间复杂度为 `O(n)`，空间复杂度对于栈为 `O(n)`。\n\n### 获取直方图中的最大矩形面积 (Get Max\
  \ Rectangular Area in a Histogram)\n\n**问题：** 在给定的宽度为 1 的矩形柱直方图中，找到直方图中的最大面积。\n\n\
  ![](img/00112.jpeg)\n\n**第一种解**：暴力破解法。我们使用两个循环来寻找所需的面积。第一个循环用于找到矩形的右边界，另一个内层循环用于找到矩形的左边界。这种方法的时间复杂度为\
  \ `O(n²)`。\n\n**示例 7.29**:\n\n```java\npublic static int GetMaxArea(int[] arr) {\n\
  \    int size = arr.length;\n    int maxArea = -1;\n    int currArea;\n    int minHeight\
  \ = 0;\n    for (int i = 1; i < size; i++) {\n        minHeight = arr[i];\n    \
  \    for (int j = i - 1; j >= 0; j--) {\n            if (minHeight > arr[j]) {\n\
  \                minHeight = arr[j];\n            }\n            currArea = minHeight\
  \ * (i - j + 1);\n            if (maxArea < currArea) {\n                maxArea\
  \ = currArea;\n            }\n        }\n    }\n    return maxArea;\n}\n\npublic\
  \ static void main(String[] args) {\n    int[] arr = { 7, 6, 5, 4, 4, 1, 3 };\n\
  \    int size = arr.length;\n    int value = GetMaxArea(arr);\n    System.out.println(\"\
  GetMaxArea :: \" + value);\n}\n```\n\n**第二种解**：使用栈\n\n- 创建包含递增索引的栈。\n- 当当前索引值大于栈顶的值时，将当前索引入栈。\n\
  - 当当前索引值小于栈顶的值时，从栈中弹出直到顶部值小于当前索引值。\n- 从栈中弹出的值将有助于创建矩形。矩形的高度为 `arr[top]`，宽度如果栈为空则为\
  \ `i`，否则为 `i-stk[-1]-1`。\n\n时间复杂度为 `O(n)`\n\n**示例 7.30**:\n\n```java\npublic static\
  \ int GetMaxArea2(int[] arr) {\n    int size = arr.length;\n    Stack<Integer> stk\
  \ = new Stack<Integer>();\n    int maxArea = 0;\n    int top;\n    int topArea;\n\
  \    int i = 0;\n    while (i < size) {\n        while (i < size && (stk.isEmpty()\
  \ || arr[stk.peek()] <= arr[i])) {\n            stk.push(i);\n            i++;\n\
  \        }\n        while (!stk.isEmpty() && (i == size || arr[stk.peek()] > arr[i]))\
  \ {\n            top = stk.peek();\n            stk.pop();\n            topArea\
  \ = arr[top] * (stk.isEmpty() ? i : stk.peek() - 1);\n            if (maxArea <\
  \ topArea) {\n                maxArea = topArea;\n            }\n        }\n   \
  \ }\n    return maxArea;\n}\n```\n\n### 股票分析师问题 (Stock Analyst Problem)\n\n**问题：**\
  \ 一位股票分析师请求你编写一个程序来寻找某些股票的涨点。股票涨点是大于其之前所有值的股票值。你提供的股票价格是一个无限流，其中最近的值在前（从时间角度来看数据是反序提供的）。\n\
  \n例如，股票数值为 [20, 19, 10, 21, 40, 35, 39, 50, 45, 42]，股票涨点值是 20、21、40 和 50，但数据是反序提供的。\n\
  \n**分析：**\n\n- 数据按旧值先后新值的顺序提供。这样只需使用单个变量存储到目前为止的最大值即可在线性时间内完成。然而，在我们的问题中，数据是反序提供的。\n\
  \n- 当我们处理某个值时，那时不知道它是否会成为涨点。\n\n- 我们将使用栈来存储数据。从流中读取输入；如果栈顶的值小于输入值，则从栈中弹出值，直到栈顶的值小于输入值。然后将输入值入栈。\n\
  \n\n\n\n- 如果栈顶的值大于输入值，则我们将输入值添加到栈中。最后，栈的内容即为股票涨涨点。\n- 该方案的时间复杂度为 `O(n)`。\n\n## 下一个更大元素\n\
  \n**问题：** 编写一个函数，打印数组中每个元素的下一个更大元素。\n\n**第一种解决方案：** 破解法，对于每个索引，我们可以遍历该索引右侧的数组索引来寻找一个较大的值。时间复杂度为\
  \ `O(n²)`。\n\n**示例 7.31**:\n\n```java\npublic static void nextLargerElement(int[]\
  \ arr, int size) {\n    int[] output = new int[size];\n    int outIndex = 0;\n \
  \   int next;\n    for (int i = 0; i < size; i++) {\n        next = -1;\n      \
  \  for (int j = i + 1; j < size; j++) {\n            if (arr[i] < arr[j]) {\n  \
  \              next = arr[j];\n                break;\n            }\n        }\n\
  \        output[outIndex++] = next;\n    }\n    for (int val : output)\n       \
  \ System.out.print(val + \" \");\n}\n```\n\n**第二种解决方案：** 假设我们正在处理数组中的元素。小于第 $i$\
  \ 个元素的元素在第 $i$ 索引右侧没有元素。因此我们可以说第 $i$ 个元素左侧且小于第 $i$ 个元素的元素与高于 $i$ 索引的元素无关。因此可以使用基于栈的还原方法。\n\
  \n- 创建一个空栈。该栈将包含按递减顺序排列元素的索引。\n- 我们将遍历输入数组。\n- 如果栈顶小于当前元素，则从栈中弹出并将其下一个更大元素标记为当前索引。我们将不断从栈中弹出并重复此过程，直到栈顶索引的值大于当前值。\n\
  - 当我们处理完输入数组后，那些填充了下一个更大元素的索引就已经准备好了。\n- 存在栈中的索引没有下一个更大元素，因此我们应该在输出数组中将这些索引标记为 -1。\n\
  \n**示例 7.32**:\n\n```java\npublic static void nextLargerElement2(int[] arr, int\
  \ size) {\n    Stack<Integer> stk = new Stack<Integer>();\n    // output = [-1]\
  \ * size;\n    int[] output = new int[size];\n    int index = 0;\n    int curr;\n\
  \    for (int i = 0; i < size; i++) {\n        curr = arr[i];\n        // stack\
  \ 中的值始终保持递减顺序。\n        while (stk.isEmpty() == false && arr[stk.peek()] <= curr)\
  \ {\n            index = stk.pop();\n            output[index] = curr;\n       \
  \ }\n        stk.push(i);\n    }\n    // index 没有任何更大的元素。\n    while (stk.isEmpty()\
  \ == false) {\n        index = stk.pop();\n        output[index] = -1;\n    }\n\
  \    for (int val : output)\n        System.out.print(val + \" \");\n}\n```\n\n\
  ## 下一个更小元素\n\n**问题：** 编写一个函数，打印数组中每个元素的下一个更小元素。\n\n**第一种解决方案：** 破解法，对于每个索引，我们可以遍历该索引右侧的数组索引来寻找一个较小值。时间复杂度为\
  \ `O(n²)`。\n\n**第二种解决方案：** 假设我们正在处理数组中的元素。大于第 $i$ 个元素的元素在第 $i$ 索引右侧没有元素。因此，我们可以说第\
  \ $i$ 个元素左侧且大于第 $i$ 个元素的元素与高于 $i$ 索引的元素无关。因此可以使用基于栈的方法。\n\n**示例 7.33**:\n\n```java\n\
  public static void nextSmallerElement(int[] arr, int size) {\n    Stack<Integer>\
  \ stk = new Stack<Integer>();\n    int[] output = new int[size];\n    int curr,\
  \ index;\n    for (int i = 0; i < size; i++) {\n        curr = arr[i];\n       \
  \ // stack 中的值始终保持递增顺序。\n        while (stk.isEmpty() == false && arr[stk.peek()]\
  \ > curr) {\n            index = stk.pop();\n            output[index] = curr;\n\
  \        }\n        stk.push(i);\n    }\n    // index 有任何更小的元素。\n    while (stk.isEmpty()\
  \ == false) {\n        index = stk.pop();\n        output[index] = -1;\n    }\n\
  \    for (int val : output)\n        System.out.print(val + \" \");\n}\n```\n\n\
  ## 循环数组下一个更大元素\n\n**问题：** 编写一个函数，打印循环数组中每个元素的下一个更大元素。\n输入：`[6, 3, 9, 8, 10, 2, 1,\
  \ 15, 7]`\n输出：`[9, 9, 10, 10, 15, 15, 15, -1, 9]`\n\n**第一种解决方案：** 破解法，假设数组中的元素数量为\
  \ `n`。对于每个索引，我们将遍历 `(n-1)` 个节点（循环方式）来寻找一个较大的值。时间复杂度为 `O(n²)`。\n\n**第二种解决方案：** 该问题的解决方案与“下一个更大元素”问题相同。唯一的区别是遍历了\
  \ `(2n – 1)` 个节点。对于每个节点，其影响范围最大为 `n-1`。因此，总共遍历了 `n + n -1` 个节点。基于栈的处理的时间复杂度为 `O(n)`。\n\
  \n**示例 7.34**:\n\n```java\npublic static void nextLargerElementCircular(int[] arr,\
  \ int size) {\n    Stack<Integer> stk = new Stack<Integer>();\n    int curr, index;\n\
  \    int[] output = new int[size];\n    for (int i = 0; i < (2 * size - 1); i++)\
  \ {\n        curr = arr[i % size];\n        // stack 中的值始终保持递减顺序。\n        while\
  \ (stk.isEmpty() == false && arr[stk.peek()] <= curr) {\n            index = stk.pop();\n\
  \            output[index] = curr;\n        }\n        stk.push(i);\n    }\n   \
  \ // index 没有任何更大的元素。\n    while (stk.isEmpty() == false) {\n        index = stk.pop();\n\
  \        output[index] = -1;\n    }\n    for (int val : output)\n        System.out.print(val\
  \ + \" \");\n}\n\npublic static void main(String[] args) {\n    int[] arr = { 6,\
  \ 3, 9, 8, 10, 2, 1, 15, 7 };\n    int size = arr.length;\n    nextLargerElementCircular(arr,\
  \ size);\n}\n```\n\n## 使用栈的深度优先搜索\n\n在深度优先搜索中，我们沿着路径向下直到遇到死胡同；然后通过弹出栈来回溯。\n\n- 创建一个栈\n\
  - 创建一个起点\n- 将起点推入栈\n- 当（未找到值且栈不为空）时：\n    - 弹出栈\n    - 寻找上一个点之后的所有可能点\n    - 将这些点入栈\n\
