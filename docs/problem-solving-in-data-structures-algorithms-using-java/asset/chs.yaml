  \ product;\n}\n```\n\n**第三解决方案：** 从前 K 个元素创建一个大小为 K 的最大堆。然后遍历数组剩余，如果堆的值大于当前遍历的值，则从堆弹出并将当前值添加到堆中。重复此过程直到遍历数组的所有元素。最后堆包含\
  \ K 个最小值，然后计算它们的乘积。\n\n**第四解决方案：** 快速选择方法，该方法是使用快速选择找到数组中第 K 个元素的结果。运行快速选择找到数组的第\
  \ K 个元素。第 K 索引左侧的值小于第 K 索引的值。计算前 K 个元素的乘积。该解决方案的平均时间复杂度为 `O(n)`。\n\n**示例 10.14：**\n\
  \n```java\npublic static int KSmallestProduct3(int[] arr, int size, int k) {\n \
  \   QuickSelectUtil(arr, 0, size - 1, k);\n    int product = 1;\n    for (int i\
