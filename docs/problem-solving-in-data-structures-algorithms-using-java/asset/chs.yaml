  \n### 求和\n**问题：** 编写一个方法，返回给定整数数组中所有元素的和。\n\n**示例 1.27:**\n```java\npublic static\
  \ int SumArray(int arr[]) {\n    int size = arr.length;\n    int total = 0;\n  \
  \  for (int index = 0; index < size; index++) {\n        total = total + arr[index];\n\
  \    }\n    return total;\n}\n\npublic static void main(String[] args) {\n    int[]\
  \ arr = { 1, 2, 3, 4, 5, 6, 7, 8, 9 };\n    System.out.println(\"Sum of values in\
  \ array:\" + SumArray(arr));\n}\n```\n**输出：**\nSum of values in array:45\n\n**分析：**\
  \ 遍历了数组的所有元素并相加。最后返回结果。时间复杂度为 O(n)。\n\n### 顺序查找\n**问题：** 编写一个方法，在数组中搜索给值。\n\n**示例\
  \ 1.28:**\n```java\npublic static int SequentialSearch(int arr[], int size, int\
  \ value) {\n    for (int i = 0; i < size; i++) {\n        if (value == arr[i]) {\n\
  \            {\n                return i;\n            }\n        }\n    }\n   \
  \ return -1;\n}\n```\n\n\n\n\n- 否则，我们最后返回索引 `-1`，因为我们没有找到要查找的值。\n- 数组元素按顺序遍历，因此时间复杂度为\
  \ `O(n)`。\n\n## 二分查找\n\n如果我们想在有序数组中搜索某个值，可以使用二分查找。在每一步中，我们都检查中间位置。根据我们要搜索的值比中间值大还是小，我们将搜索数组的左部分或右部分。在每一步中，我们都排除一半搜索空间，因此与线性搜索相比，这种算法非常高效。\n\
  \n**示例 1.29**: 有排序数组中的二分查找。\n\n```java\npublic static int BinarySearch(int arr[],\
  \ int size, int value) {\n    int mid;\n    int low = 0;\n    int high = size -\
  \ 1;\n    while (low <= high) {\n        mid = low + (high - low) / 2; // 防止溢出\n\
  \        if (arr[mid] == value) {\n            return mid;\n        } else {\n \
  \           if (arr[mid] < value) {\n                low = mid + 1;\n          \
  \  } else {\n                high = mid - 1;\n            }\n        }\n    }\n\
