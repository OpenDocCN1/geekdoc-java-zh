  \n`欧拉回路` 是一种欧拉路径，起点和终点是同一个顶点。或者说 `欧拉回路` 是图中恰好访问每条边一次且起点和终点相同的顶点的路径。\n\n如果图中存在欧拉回路，则该图称为欧拉图。如果图中存在欧拉路径，则该图称为半欧拉图。如果图中不存在欧拉路径，则它被称为非欧拉图。\n\
  \n如果图中所有边的度数均为偶数，则该图是欧拉图。如果图中恰好有两个顶点的度数为奇数，则该图是半欧拉图。在所有其他情况下，该图是非欧拉图。\n\n**示例 12.30:**\
  \ 检查该图是否为欧拉图。\n\n```java\npublic static int isEulerian(Graph graph) {\n    int count\
  \ = graph.count;\n    int odd;\n    int[] inDegree;\n    int[] outDegree;\n    LinkedList<Edge>\
  \ adl;\n    // 检查所有非零节点是否是连通的\n    if (isConnected(graph) == false) {\n        System.out.println(\"\
  图不是欧拉图\");\n        return 0;\n    } else {\n        // 统计奇度数\n        odd = 0;\n\
  \        inDegree = new int[count];\n        outDegree = new int[count];\n     \
  \   for (int i = 0; i < count; i++) {\n            adl = graph.Adj.get(i);\n   \
  \         for (Edge adn : adl) {\n                outDegree[i] += 1;\n         \
  \       inDegree[adn.dest] += 1;\n            }\n        }\n        for (int i =\
  \ 0; i < count; i++) {\n            if ((inDegree[i] + outDegree[i]) % 2 != 0) {\n\
  \                odd += 1;\n            }\n        }\n        if (odd == 0) {\n\
  \            System.out.println(\"图是欧拉图\");\n            return 2;\n        } else\
  \ if (odd == 2) {\n            System.out.println(\"图是半欧拉图\");\n            return\
  \ 1;\n        } else {\n            System.out.println(\"图不是欧拉图\");\n          \
  \  return 0;\n        }\n    }\n}\n```\n\n## 旅行旅行商问题 (TSP)\n\n**问题：** 旅行旅行商问题试图在给定的城市集中找到一条最短回路，该回路恰好访问每个城市一次并回到起点。它是图中通过所有顶点的环。\n\
  \n### TSP 算法\n\n1. 选择一个城市\n2. `MinTourCost = 无穷`\n3. 对于 ( 所有的所有排列 ) 执行\n   如果 (`LengthOfPath\
  \ < MinTourCost`) `MinTourCost = LengthOfPath`\n4. 可能组合数为 `(n-1)!`\n5. 计算路径的复杂度\
  \ `Θ(n)`\n6. 寻找路径的总复杂度 `Θ(n!)`\n\n这是一个 NP 问题，没有高效的算法可以求解。即使给出了解决方案，验证其正确性同样困难。然而，可以使用近似算法来找到不错的解决方案。我们并不总是能得到最优解，但可以得到一个可行解。我们的近似算法基于最小生成树问题。在图中构造一棵树，使得每个节点都通过边连接，且所有边的总和最小。\n\
  \nImages/0250.jpeg\n\n在上面的图中，我们有一组城市（每个城市由圆圈表示），它们位于网格中，城市之间的距离与实际距离相同。从一个城市到另一个城市有一条直接路径。\n\
  \nImages/0251.jpeg\n\n我们为上面的城市图制作了最小生成树。\n\n我们想要证明 TSP 的最短路径总是大于最小生成树的长度。因为在 MST\
  \ 中，所有节点都与下一个节点连接，这也是节点之间的最小距离。因此，为了在不重复节点的情况下形成路径，我们需要直接从一个节点到另一个节点，而不遵循 MST。在这种情况下，当我们不遵循\
  \ MST 时，选择的边比 MST 提供的边大。所以 TSP 路径总是大于或等于 MST 路径。\n\nImages/0252.jpeg\n\n现在让我们从起点节点开始，遍历上面路径中的每个节点，然后回到起点。该路径的总成本为\
  \ `2MST`。唯一的区别是我们在多次访问许多节点。\n\nImages/0253.jpeg\n\n现在让我们改变我们的遍历算法，使其在遍历中变为 TSP，我们不再访问已经访问过的节点，而是跳过它们并访问下一个未访问的节点。\n\
  \n## 练习\n\n1. 在各种路径查找算法中，我们创建了一个路径数组只存储节点的直接父节点，请打印它的完整路径。\n\n2. 所有函数都是假设图以邻接表表示来实现的。请为邻接矩阵表示的图编写所有函数。\n\
