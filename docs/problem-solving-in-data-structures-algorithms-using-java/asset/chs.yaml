  \n5. 在给定的包含 0、1 和 2 的列表中，编写一个程序将 0、1 和 2 分离。\n\n6. 在给定的包含负数和正数且元素随之单调调递增的列表中，编写一个算法找到列表变为正数的点。\n\
  \n7. 在排序列表中查找一个数字。如果找到，则返回索引；如果没有找到，则将其插入数组中。\n\n8. 在排序的旋转列表中找到最大值。\n\n9. 在排序的旋转列表中找到最小值。\n\
  \n10. 在两个排序列表的并集中找到第 `kth Smallest Element`。\n\n# 第 6 章：链表\n\n## 引言\n\n假设我们有一个数组，包含以下五个元素\
  \ 1, 2, 4, 5, 6。我们想在“2”和“4”之间插入一个值为“3”的新元素。在数组中，我们无法轻易地这样做。我们需要创建另一个足够大的数组来存储当前值，并为“3”留出一个空间。然后我们需要将这些元素复制到新空间中。这种复制操作是无效的。为了消除添加新数据时的这种低效率，使用了链表。\n\
  \n## 链表\n\n链表是一个称为 `nodes`（节点）的项目列表。节点包含两部分：值部分和链接部分。值部分用于存储数据。节点的值部分可以是基本数据类型（如整数），也可以是其他数据类型（如结构体）。链接部分是一个指针，用于存储列表中下一个元素的地址。\n\
  \n![](img/00059.jpeg)\n\n![](img/00060.jpeg)\n\n链表的各个部分：\n\n1. **Head（头节点）**：头部是一个指针，保存着链表中第一个节点的地址。\n\
  2. **Nodes（节点）**：链表中的项称为节点。\n3. **Value（值）**：存储在链表每个节点中的数据。\n4. **Link（链接）**：节点的链接部分用于存储对其他节点的引用。\n\
  \na. 我们将使用 `next` 和 `prev` 来存储下一个或上一个节点的地址。\n\n## 链表的类型\n\n有不同类型的链表。它们之间的主要区别在于节点相互连接的方式。我们将讨论单链表、双向链表、循环链表和双向循环链表。\n\
  \n## 单链表\n\n每个节点（最后一个节点外）都有指向链表中下一个节点的引用。节点的链接部分包含下一个节点的地址。最后一个节点的链接部分包含值。\n\n![](img/00061.jpeg)\n\
  \n让我们来看 `Node`。节点的值部分是整数型，但也可以是其他数据类型。节点的链接部分命名为 Pointer（指针）。\n\n![](img/00062.jpeg)\n\
  \n### 示例 6.1：单链表节点\n\n```java\npublic class LinkedList {\n    private static class\
  \ Node {\n        private int value;\n        private Node next;\n        public\
  \ Node(int v, Node n) {\n            value = v;\n            next = n;\n       \
  \ }\n    }\n    private Node head;\n    private int size = 0;\n}\n```\n\n对于单链表，我们应该始终测试这三种情况：\n\
  - 零元素 / 空链表。\n- 一个元素 / 单个节点。\n- 一般情况。\n\n一个节点和零节点的情况用于测试边界情况。在提交代码之前，必须考虑这些情况。我们可以在链表上执行的各种基本操作，其中许多操作需要遍历列表：\n\
  - 在列表中插入一个元素，此操作用于创建链表。\n- 打印列表的各种元素。\n- 在列表中搜索一个元素。\n- 从列表中删除一个元素。\n- 反转链表。\n\n\
  ### 在链表中插入元素\n\n元素可以按各种顺序插入到链表中。下面列出了其中一些情况：\n\n1. 在链表的头部插入元素\n2. 在链表的末尾插入元素\n3.\
  \ 在链表的第 Nth 位置插入元素\n4. 排序插入元素\n\n### 在链表头部插入\n\n**问题**：在链表的头部插入元素。\n\n![](img/00063.jpeg)\n\
  ![](img/00064.jpeg)\n![](img/00065.jpeg)\n\n**示例 6.2：**\n\n```java\npublic void\
  \ addHead(int value) {\n    head = new Node(value, head);\n    size++;\n}\n```\n\
  \n分析：\n- 我们根据参数传递的值创建节点。\n- 当链表为空时，下一个指针指向头部。\n- 新节点将成为链表的头部。\n\n时间复杂度：`O(1)`。\n\
  \n### 在链表末尾插入元素\n\n**问题**：在链表的末尾插入元素。\n\n**示例 6.3：**\n\n```java\npublic void addTail(int\
  \ value) {\n    Node newNode = new Node(value, null);\n    Node curr = head;\n \
  \   if (head == null) {\n        head = newNode;\n    }\n    while (curr.next !=\
  \ null) {\n        curr = curr.next;\n    }\n    curr.next = newNode;\n}\n```\n\n\
  分析：\n- 创建新节点并存储值，下一个指针存储空。\n- 如果链表为空，则新节点将成为链表的头部。\n- 如果链表为空，我们需要遍历到列表末尾。\n- 最后，新节点被添加到列表的末尾。\n\
  \n时间复杂度：`O(n)`。\n\n注意：此操作是无效的，因为每次你想插入元素时都必须遍历到列表末尾。因此，创建列表的复杂度为 `O(n²)`。为了提高效率，我们需要通过保留尾部指针来跟踪最后一个元素。因此，如果需要在链表末尾插入元素，我们将跟踪尾部引用。\n\
  \n### 遍历链表\n\n**问题**：打印链表的各种元素\n\n**示例 6.4：**\n\n```java\npublic void print() {\n\
  \    Node temp = head;\n    while (temp != null) {\n        System.out.print(temp.value\
  \ + \" \");\n        temp = temp.next;\n    }\n}\n```\n\n分析：\n- 我们将遍历列表并打印存储在节点中的值。通过让头部指向下一个来遍历列表。\n\
  \n时间复杂度：`O(n)`。\n\n### 创建列表并打印列表的完整代码\n\n**示例 6.5**：链表创建、头部添加值和打印元素的测试代码。\n\n```java\n\
  public static void main(String[] args) {\n    LinkedList ll = new LinkedList();\n\
  \    ll.addHead(1);\n    ll.addHead(2);\n    ll.addHead(3);\n    ll.print();\n}\n\
  ```\n\n分析：\n- 创建了链表的新实例。通过调用 `InsertNode()` 方法向列表添加各种元素。\n\n\n\n\n\n· 最后，通过调用 `PrintList()`\
  \ 方法将列表的所有内容打印到屏幕上。\n\n### 排序插入\n\n**问题：在给定头指针的情况下，在链表中按顺序插入元素**\n\n![](img/00067.jpeg)\n\
  ![](img/00068.jpeg)\n![](img/00069.jpeg)\n\n示例 6.6:\n\n```java\npublic void sortedInsert(int\
  \ value) {\n      Node newNode = new Node(value, null);\n      Node curr = head;\n\
  \      if (curr == null || curr.value > value) {\n            newNode.next = head;\n\
  \            head = newNode;\n            return;\n      }\n      while (curr.next\
  \ != null && curr.next.value < value) {\n            curr = curr.next;\n      }\n\
  \      newNode.next = curr.next;\n      curr.next = newNode;\n}\n```\n\n**分析：**\n\
  \n· 创建了链表的一个新空节点。通过将参数值存入其 `value` 字段进行初始化。节点的 `next` 指向 `null`。\n· 如果列表为空，或者第一个节点中存储的值大于新创建节点的值，则此新创建的节点将添加到列表的开头。并且需要修改\
  \ `head`。\n· 在所有其他情况下，我们遍历列表以找到可以插入节点的合适位置，以保持列表排序状态。\n· 最后，将该节点添加到列表中。\n\n时间复杂度：O(n)。\n\
  \n### 在链表中查找元素\n\n**问题：在链表中查找元素。给定一个头指针和一个值。如果在列表中找到该值则返回 1，否则返回 0。**\n\n示例 6.7:\n\
  \n```java\npublic boolean searchList(int data) {\n      Node temp = head;\n    \
  \  while (temp != null) {\n            if (temp.value == data)\n               \
  \   return true;\n            temp = temp.next;\n      }\n      return false;\n\
  }\n```\n\n**分析：**\n\n· 使用循环遍历列表。\n· 将列表每个元素的值与给定的值进行比较。如果找到了该值，则函数将返回 `true`。\n\
  · 如果没有找到该值，则最后将从函数返回 `false`。\n\n时间复杂度：O(n)。\n\n**注意：** 单链表的搜索只能向一个方向进行。因为列表中的所有元素都有指向列表中下一个项的引用。因此，链表的遍历本质上是线性的。\n\
  \n### 删除链表的第一个元素\n\n**问题：删除链表头部的元素**\n\n![](img/00070.jpeg)\n![](img/00071.jpeg)\n\
  ![](img/00072.jpeg)\n\n示例 6.8:\n\n```java\npublic int removeHead() throws IllegalStateException\
  \ {\n      if (isEmpty())\n          throw new IllegalStateException(\"EmptyListException\"\
  );\n      int value = head.value;\n      head = head.next;\n      size--;\n    \
  \  return value;\n}\n```\n\n**分析：**\n\n· 首先，我们需要检查列表是否已经为空。如果为空则返回。\n· 如果列表不为空，则列表的\
  \ `head` 将存储当前头节点下一个节点的引用。\n\n时间复杂度：O(1)。\n\n### 根据给定值从链表中删除节点\n\n**问题：删除第一个与给定值相等的节点**\n\
  \n![](img/00073.jpeg)\n![](img/00074.jpeg)\n![](img/00075.jpeg)\n![](img/00076.jpeg)\n\
  \n示例 6.9:\n\n```java\npublic boolean deleteNode(int delValue) {\n      Node temp\
  \ = head;\n      if (isEmpty())\n          return false;\n      if (delValue ==\
  \ head.value) {\n            head = head.next;\n            size--;\n          \
  \  return true;\n      }\n      while (temp.next != null) {\n            if (temp.next.value\
  \ == delValue) {\n                temp.next = temp.next.next;\n                size--;\n\
  \                return true;\n            }\n            temp = temp.next;\n  \
  \    }\n      return false;\n}\n```\n\n**分析：**\n\n· 有两种情况：第一种需要删除的节点是第一个节点，第二种情况需要删除的节点不是列表中的第一个节点。当需要删除的节点是第一个节点时，链表的\
  \ `head` 将修改。在其他情况下，不会修改。\n· 首先，我们检查第一个节点是否为我们要查找的值，如果是，列表的 `head` 将指向下一个节点。\n·\
  \ 在其他情况下，我们将使用 `while` 循环遍历链表并尝试找到需要删除的节点。如果找到了该节点，我们将其前一个节点的 `next` 指向我们要移除的节点。\n\
  \n时间复杂度：O(n)。\n\n### 删除链表中特定值的所有出现次数\n\n**问题：删除所有值等于给定值的节点**\n\n示例 6.10:\n\n```java\n\
  public void deleteNodes(int delValue) {\n      Node currNode = head;\n      Node\
  \ nextNode;\n      while (currNode != null && currNode.value == delValue) { /*第一个节点\
  \ */\n            head = currNode.next;\n            currNode = head;\n      }\n\
  \      while (currNode != null) {\n            nextNode = currNode.next;\n     \
  \       if (nextNode != null && nextNode.value == delValue) {\n                \
  \  currNode.next = nextNode.next;\n            } else {\n                  currNode\
  \ = nextNode;\n            }\n      }\n}\n```\n\n**分析：**\n\n· 在第一个 `while` 循环中，我们将删除位于列表开头且值等于删除值的节点。\n\
  · 在第二个 `while` 循环中，我们将删除不在开头且值等于删除值的节点。\n\n时间复杂度：O(n)。\n\n### 删除单链表\n\n**问题：给定链表的头指针，删除列表的所有元素**\n\
  \n示例 6.11:\n\n```java\npublic void deleteList() {\n      head = null;\n      size\
  \ = 0;\n}\n```\n\n**分析：** 将列表的 `head` 标记为 `null`。\n\n时间复杂度：O(n)。\n\n### 反转链表\n\n\
  **问题：使用三个指针迭代反转链表**\n\n示例 6.12:\n\n```java\npublic void reverse() {\n      Node\
  \ curr = head;\n      Node prev = null;\n      Node next = null;\n      while (curr\
  \ != null) {\n            next = curr.next;\n            curr.next = prev;\n   \
  \         prev = curr;\n            curr = next;\n      }\n      head = prev;\n\
  }\n```\n\n**分析：** 遍历列表。让 `next` 指向下一个节点。让 `curr.next` 指向前一个节点。将 `prev` 为当前节点，`curr`\
  \ 设为下一个节点。最后将 `head` 设置为 `prev`。\n\n时间复杂度：O(n)。\n\n### 递归反转单链表\n\n**问题：使用递归反转链表**\n\
  \n示例 6.13:\n\n```java\npublic Node reverseRecseUtil(Node currentNode, Node nextNode)\
  \ {\n      Node ret;\n      if (currentNode == null)\n          return null;\n \
  \     if (currentNode.next == null) {\n            currentNode.next = nextNode;\n\
  \            return currentNode;\n      }\n      ret = reverseRecseUtil(currentNode.next,\
  \ currentNode);\n      currentNode.next = nextNode;\n      return ret;\n}\n\npublic\
  \ void reverseRecurse() {\n      head = reverseRecseUtil(head, null);\n}\n```\n\n\
  **分析：** `reverseRecurse()` 函数将调用 `reverseRecseUtil()` 函数来反转列表，`reverseRecseUtil`\
  \ 返回的指针将是反转后列表的头。\n\n时间复杂度：O(n)。\n\n\n\n\n\n```javascript\nif (curr.next != null\
  \ && curr.value == curr.next.value) {\n    curr.next = curr.next.next;\n} else {\n\
  \    curr = curr.next;\n}\n}\n```\n**分析：** 遍历链表，如果某个节点的值与其下一个节点的值相等，则当前节点的 `next`\
  \ 指向下一个节点的下一个节点。整个链表会被处理完毕，重复的值将从链表中移除。\n\n时间复杂度：O(n)。\n\n### 反转复制链表\n\n**问题：**\
  \ 以反向顺序将一个链表的内容复制到另一个链表中。如果原始链表按照 1,2,3,4 的顺序包含元素，则新列表应该按照 4,3,2,1 的顺序包含元素。\n\n\
  **示例 6.15**：\n\n```java\npublic LinkedList copyListReversed() {\n    Node tempNode\
  \ = null;\n    Node tempNode2 = null;\n    Node curr = head;\n    while (curr !=\
  \ null) {\n        tempNode2 = new Node(curr.value, tempNode);\n        curr = curr.next;\n\
  \        tempNode = tempNode2;\n    }\n    LinkedList ll2 = new LinkedList();\n\
  \    ll2.head = tempNode;\n    return ll2;\n}\n```\n**分析：** 遍历链表并将节点值添加到新列表的头部。由于链表是正向遍历的，且每个节点都被添加到新列表的头部，因此形成的新链表是原始链表的反转。\n\
  \n时间复杂度：O(n)。\n\n### 将给定链表的内容复制到另一个链表\n\n**问题：** 将给定链表的内容复制到另一个链表中。如果原始链表按照 1,2,3,4\
  \ 的顺序包含元素，则新列表应该按照 1,2,3,4 的顺序包含元素。\n\n**示例 6.16**：\n\n```java\npublic LinkedList\
  \ copyList() {\n    Node headNode = null;\n    Node tailNode = null;\n    Node tempNode\
  \ = null;\n    Node curr = head;\n    if (curr == null)\n        return null;\n\
  \    headNode = new Node(curr.value, null);\n    tailNode = headNode;\n    curr\
  \ = curr.next;\n    while (curr != null) {\n        tempNode = new Node(curr.value,\
  \ null);\n        tailNode.next = tempNode;\n        tailNode = tempNode;\n    \
  \    curr = curr.next;\n    }\n    LinkedList ll2 = new LinkedList();\n    ll2.head\
  \ = headNode;\n    return ll2;\n}\n```\n**分析：** 遍历链表并将节点值添加到新列表，但这次始终添加到列表末尾。使用另一个指针\
  \ `tailNode` 来跟踪列表末尾。由于链表是正向遍历的，且每个节点的值都被添加到新列表的末尾，因此形成的列表与给定列表相同。\n\n时间复杂度：O(n)。\n\
  \n### 比较链表\n\n**问题：** 给定两个链表的头指针，比较这两个链表的值。\n\n**示例 6.17**：递归解\n\n```java\npublic\
  \ boolean compareList(LinkedList ll) {\n    return compareList(head, ll.head);\n\
  }\n\npublic boolean compareList(Node head1, Node head2) {\n    if (head1 == null\
  \ && head2 == null)\n        return true;\n    else if ((head1 == null) || (head2\
  \ == null) || (head1.value != head2.value))\n        return false;\n    else\n \
  \       return compareList(head1.next, head2.next);\n}\n```\n**分析：**\n- 递归比较链表。此外，如果我们到达链表末尾且两个链表都为空，则两个链表相等，返回\
  \ `true`。\n- 递归比较链表。如果其中一个链表为空或对应节点的值不相等，则返回 `false`。\n- 递归调用 `compareList` 处理下一个节点。\n\
  \n**示例 6.18**：迭代解\n\n```java\npublic boolean compareList(LinkedList ll2) {\n   \
  \ Node head1 = head;\n    Node head2 = ll2.head;\n    while (head1 != null && head2\
  \ != null) {\n        if (head1.value != head2.value)\n            return false;\n\
  \        head1 = head1.next;\n        head2 = head2.next;\n    }\n    if (head1\
  \ == null && head2 == null)\n        return true;\n    return false;\n}\n```\n**分析：**\n\
  - 在循环中遍历两个链表，如果在任何一点两个节点的值不相等，则返回 `false` 表示它们不相等。\n- 如果在结束时两个链表都完全遍历完毕，则返回 `true`；如果其中任何一个还有未遍历的元素，则返回\
  \ `false`。\n\n**时间复杂度：** 两种解决方案的时间复杂度均为 O(n)。\n\n### 查找长度\n\n**问题：** 查找给定链表的长度。\n\
  \n示例 6.19:：\n\n```java\npublic int findLength() {\n    Node curr = head;\n    int\
  \ count = 0;\n    while (curr != null) {\n        count++;\n        curr = curr.next;\n\
  \    }\n    return count;\n}\n```\n**分析：** 通过遍历链表直到到达列表末尾来找到链表的长度。\n\n时间复杂度：O(n)。\n\
  \n### 从开始的第 N 个节点\n\n**问题：** 找到从开始的第 N 个节点\n\n**示例 6.20**：\n\n```java\npublic int\
  \ nthNodeFromBegining(int index) {\n    if (index > size() || index < 1)\n     \
  \   return Integer.MAX_VALUE;\n    int count = 0;\n    Node curr = head;\n    while\
  \ (curr != null && count < index - 1) {\n        count++;\n        curr = curr.next;\n\
  \    }\n    return curr.value;\n}\n```\n**分析：** 通过遍历列表 N-1 次找到节点。如果链表没有元素则返回空。\n\
  \n时间复杂度：O(K)，如果我们在搜索 K 个节点。\n\n### 从末尾的第 N 个节点\n\n**问题：** 找到从末尾的第 N 个节点\n\n**示例\
  \ 6.21**：\n\n```java\npublic int nthNodeFromEnd(int index) {\n    int size = findLength();\n\
  \    if (size != 0 && size < index) {\n        return Integer.MAX_VALUE;\n    }\n\
  \    int startIndex = size - index + 1;\n    return nthNodeFromBegining(startIndex);\n\
  }\n```\n**分析：** 先找到长度，然后从开始查找第 N 个节点。\n\n时间复杂度：O(n)。\n\n**示例 6.22**：\n\n```java\n\
  public int nthNodeFromEnd(int index) {\n    int count = 1;\n    Node forward = head;\n\
  \    Node curr = head;\n    while (forward != null && count <= index) {\n      \
  \  count++;\n        forward = forward.next;\n    }\n    // 根据描述继续逻辑\n    return\
  \ curr.value;\n}\n```\n**分析：** 第二种解决方案是使用两个指针，一个领先另一个 N 步，当正向指针到达末尾时，后向指针指向目标节点。\n\
  \n### 检测循环\n\n**问题：** 检查链表是否存在循环。如果有循环，返回 `true`；如果没有发现循环则返回 `false`。\n\n有许多方法可以检查链表是否存在循环：\n\
  \n**第一种解决方案：** 使用某些哈希表\na) 遍历链表。\nb) 如果当前节点不在哈希表中，将其插入哈希表。\nc) 如果当前节点已在哈希表中，说明存在循环。\n\
  \n**第二种解决方案：** 慢指针和快指针法 (SPFP)，我们将使用两个指针，一个每次移动 2 步，另一个每次移动 1 步。如果有循环，它们会在某点相遇。\n\
  \n示例 6.23:：\n\n```javascript\npublic boolean loopDetect() {\n    Node slowPtr;\n\
  \    Node fastPtr;\n    slowPtr = fastPtr = head;\n    while (fastPtr.next != null\
  \ && fastPtr.next.next != null) {\n        slowPtr = slowPtr.next;\n        fastPtr\
  \ = fastPtr.next.next;\n        if (slowPtr == fastPtr) {\n            System.out.println(\"\
  loop found\");\n            return true;\n        }\n    }\n    System.out.println(\"\
  loop not found\");\n    return false;\n}\n```\n\n\n\n\n\n-   使用两个指针遍历列表，一个是一个慢指针，另一个是快指针。慢指针始终移动一步。快指针始终移动两步。如果没有环，则控制将跳出\
  \ while 循环。因此返回 `false`。\n-   如果存在环，那么在环中的某一点，快指针会到达并尝试超过慢指针，它们会在某一点相遇。当到达这个点时，我们就知道链表中存在一个环。因此返回\
  \ `true`。\n\n时间复杂度：`O(n)`。\n\n### 第三种方案：反转列表环检测方法\n\n如果链表中存在环，那么反转列表函数将返回原列表的头部作为新列表的头部。\n\
  \n**示例 6.24**: 查找链表是否存在环。使用反转列表方法。\n\n```java\npublic boolean reverseListLoopDetect()\
  \ {\n    Node tempHead = head;\n    reverse();\n    if (tempHead == head) {\n  \
  \      reverse();\n        System.out.println(\"loop found\");\n        return true;\n\
  \    } else {\n        reverse();\n        System.out.println(\"loop not found\"\
  );\n        return false;\n    }\n}\n```\n\n**分析:**\n-   用变量 `temp` 存储链表头部的指针。\n\
  -   反转列表。\n-   比较反转后的列表头部指针和当前列表的头部指针。\n-   如果反转后的列表头部和原始列表相同，则将列表反转回来并返回 `true`。\n\
  -   如果反转后的列表头部和原始列表不同，则将列表反转回来并返回 `false`。这意味着不存在环。\n\n时间复杂度：`O(n)`。\n\n**注意**:\
  \ SPFP（快慢指针）方法和反转列表方法本质上都是线性的，但在 SPFP 方法中，我们不需要修改链表，因此它是优的。\n\n### 环类型检测\n\n**问题**:\
  \ 查找链表是否存在环。如果没有环，返回 0；如果有环返回 1；如果是环形列表则返回 2。使用慢指针快指针方法。\n\n**示例 6.25**:\n\n```java\n\
  public int loopTypeDetect() {\n    Node slowPtr;\n    Node fastPtr;\n    slowPtr\
