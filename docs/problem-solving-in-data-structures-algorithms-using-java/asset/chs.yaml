  \n[content]\n# 第 20 章：复杂度理论\n\n## 引言\n\n计算复杂度是衡量解决某个问题需要多少资源的标准。\n\n资源有两种类型：\n\n\
  1. 时间：解决问题所需的步骤数。\n2. 空间：解决问题所需的内存量。\n\n## 决策问题\n\n复杂度理论的大部分涉及决策问题。决策问题总有一个“是”或“否”的答案。\n\
  \n（用户提供的第 20 章文本非常重复。我将按提供的文本进行格式化。）\n\n\n\n\n这个问题是一个 NP 问题。给定一个节点集，你可以非常容易地找到它是否为一个团（clique）。\n\
  \n例如：\n\n![](img/00296.jpeg)\n\n### 质数\n\n寻找质数是 NP 的。给定一个解，可以在多项式时间内很容易找到它是否为质数。寻找质数非常重要，在密码学中被广泛使用。\n\
  \n```cpp\nint isPrime(int n) {\n    int answer = (n > 1) ? 1 : 0;\n    for (int\
  \ i = 2; i * i <= n; ++i) {\n        if (n % i == 0) {\n            answer = 1;\n\
  \            break;\n        }\n    }\n    return answer;\n}\n```\n\n检查将持续到数字的平方根，因此时间复杂度为\
  \ `O(√n)`。因此，质数寻找是一个 NP 问题，因为我们可以在多项式时间内验证解。\n\n图论有一系列精彩的问题：\n\n- 最短路径算法？\n- 最长路径是\
  \ NP 完全性问题。\n- 欧拉图遍历是一个多项式时间问题。\n- 哈密顿图遍历是 NP 完全性问题。\n\n## co-NP 类\n\n一组存在多项式时间检查算法的问题。给定一个解，如果我们可以在多项式时间内检查出该解是错误的，那么该问题就是\
  \ co-NP 问题。\n\nco-NP 类定义：co-NP 类包含所有决策问题，使得存在一个多项式时间的证明可以验证该问题是否没有正确的“是/否”答案。\n\n\
  ![](img/00297.jpeg)\n\n### P 类是 NP 类的子集\n\n所有属于 P 的也是 NP 问题 ![](img/00298.jpeg)。问题集\
  \ P 是问题集 NP 的子集。\n\n#### 搜索\n\n如果我们有一个数字序列 `a1`, `a2`, `a3…. an`。我们已经知道在这个列表中搜索数字\
  \ `X` 是 P 类。\n\n如果给定数字 `X` 在这个序列中，我们可以通过重新查看每一个条目，并在多项式时间内（线性时间）找到答案是否正确。\n\n####\
  \ 排序\n\n另一个数字序列排序的例子，如果给定数组 `b1`, `b2`, `b3.. bn` 是排序过的，那么我们可以遍历这个给定的列表，并在多项式时间内（又是线性时间）找到数组是否真的是排序的。\n\
  \n## NP-Hard\n\n如果 NP 中的所有问题都可以在多项式时间内归约到这个问题，那么该问题就是 NP-Hard。\n\n![](img/00299.jpeg)\n\
  \n## NP 完全问题\n\n如果一组问题既是 NP 问题又是 NP-Hard 问题，那么它就是 NP 完全问题。\n\n它必须遵循以下两个属性：\n\n1)\
  \ 它的解可以在多项式时间内验证。\n2) 所有 NP 问题都可以在多项式时间内归约到 NP 完全问题。\n\n你总是可以在多项式时间内将任何 NP 问题归约为\
  \ NP 完全。此外，当你得到问题的答案时，你可以在多项式时间内验证该解。\n\n![](img/00300.jpeg)\n\n![](img/00301.jpeg)\n\
  \n任何 NP 问题都可以多项式地归约到 NP 完全问题，如果我们能在多项式时间内找到单个 NP 完全问题的解，那么我们就能多项式时间内解决所有的 NP 问题。然而，到为止还没有人在多项式时间内找到任何\
  \ NP 完全问题的解。\n\nP ≠ NP\n\n## 归约\n\n这是一个将一个问题转换为另一个问题的过程。转换时间应该是多项式的。如果问题 `A` 转换为\
  \ `B` 且我们可以在多项式时间内知道 `B` 的解，那么 `A` 也可以在多项式时间内解决。\n\n例如，二次方程求解器：我们有一个二次方程求解器，求解形式为\
  \ `ax² + bx + c = 0` 的方程。它接受输入 `a`, `b`, `c` 并生成输出 `r1`, `r2`。\n\n现在尝试求解线性方程 `2x+4=0`。通过归约第二个方程可以转换为第一个方程。\n\
  \n`2x+4 = 0`\n\n`X² + 2x + 4 = 0`\n\n地图：我们有一个地图，我们需要为地图染色，使得两个国家没有相同的颜色。假设以下是不同的国家。此外，不同的图案代表不同的颜色。\n\
  \n![](img/00302.jpeg)\n\n我们可以看到地图着色的相同问题可以归约为图着色，如果我们知道图着色的解，那么相同的解也适用于地图着色。其中图的每个节点代表一个国家，相邻国家的关系由节点之间的边表示。\n\
  \n![](img/00303.jpeg)\n\n排序问题归约 (`≤`) 到凸包问题。\n\n`SAT` 归约 (`≤`) 到 `3SAT`\n\n## 结语\n\
  \n还没有人提出过这样的多项式时间算法来解决 NP 完全问题。许多重要算法都取决于它。然而，同时也没有人证明多项式时间算法是不可能的。对于任何能在多项式时间内解决任何\
  \ NP 完全问题的人，将获得百万美元。整个世界经济将会崩溃，因为大多数银行都依赖公钥加密，如果发现了 P=NP 的解，加密将很容易破解。\n\n# 附录\n\n\
