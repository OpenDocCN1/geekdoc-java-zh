  \ 索引的冲突。假设如果 `k` 是从哈希函数检索到的索引。如果第 `kth` 索引已填充，我们将查找 `(k+1²) % M`，然后是 `(k+2²) % M`，等此类推。当我们得到一个空槽时，我们将数据插入到该空槽中。\n\
