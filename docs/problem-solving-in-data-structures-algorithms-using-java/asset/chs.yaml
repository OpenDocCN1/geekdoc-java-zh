  );\n            return 1;\n        }\n    }\n    System.out.println(\"loop not found\"\
  );\n    return 0;\n}\n```\n\n分析：此程序与环检测程序相同，仅在于当是环形列表时，快指针在列表头部到达慢指针，这意味着在列表的开头处有一个环。\n\
  \n时间复杂度：`O(n)`。\n\n### 移除环\n\n**问题**: 给定链表中存在环，请移除该环。\n\n**示例 6.26**:\n\n```java\n\
  public Node loopPointDetect() {\n    Node slowPtr;\n    Node fastPtr;\n    slowPtr\
