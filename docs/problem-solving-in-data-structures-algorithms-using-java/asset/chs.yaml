  \n```java\npublic static int hornerHash(char[] key, int tableSize) {\n  int size\
  \ = key.length;\n  int h = 0;\n  int i;\n  for (i = 0; i < size; i++) {\n      \
  \  h = (32 * h + key[i]) % tableSize;\n  }\n  return h;\n}\n```\n\n6. 选择两个数据结构来实现一个\
