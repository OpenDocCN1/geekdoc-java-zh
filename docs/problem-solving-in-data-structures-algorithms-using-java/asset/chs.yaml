  \    ll.addHead(1);\n    ll.addHead(2);\n    ll.addHead(3);\n    ll.print();\n}\n\
  ```\n\n**分析：**\n\n- 首先，我们创建一个带有给定值的节点，其 `next` 指向 `null`。\n- 如果列表为空，则列表的 `tail`\
  \ 将指向它。此外，节点的 `next` 将指向它自己。\n- 如果列表不为空，新节点的 `next` 将是 `tail` 的 `next`。此外，`tail.next`\
  \ 将开始指向新节点。\n- 因此，新节点被添加到列表的头部。\n- 演示程序创建了 `CircularLinkedList` 实例。然后向其添加一些值，最后打印列表的内容。\n\
  \n时间复杂度：O(1)。\n\n### 在末尾插入元素\n\n**问题：**在循环链表的末尾插入元素。\n\n![](img/00097.jpeg)\n![](img/00098.jpeg)\n\
  ![](img/00099.jpeg)\n![](img/00100.jpeg)\n![](img/00101.jpeg)\n\n示例 6.39：\n\n```java\n\
  public void addTail(int value) {\n    Node temp = new Node(value, null);\n    if\
  \ (isEmpty()) {\n        tail = temp;\n        temp.next = temp;\n    } else {\n\
  \        temp.next = tail.next;\n        tail.next = temp;\n        tail = temp;\n\
  \    }\n    size++;\n}\n```\n\n**分析：**在末尾添加节点与在开头添加相同。我们只需要原地修改 `tail` 指针代替头部。\n\
  \n时间复杂度：O(1)。\n\n### 在列表中搜索元素\n\n**问题：**在循环链表中搜索特定值。\n\n示例 6.40：\n\n```java\npublic\
  \ boolean searchList(int data) {\n    Node temp = tail;\n    for (int i = 0; i <\
  \ size; i++) {\n        if (temp.value == data)\n            return true;\n    \
  \    temp = temp.next;\n    }\n    return false;\n}\n```\n\n**分析：**遍历列表以查找特定值是否存在。\n\
  \n时间复杂度：O(n)。\n\n### 打印列表内容\n\n**问题：**打印循环链表的所有元素。\n\n示例 6.41：\n\n```java\npublic\
  \ void print() {\n    if (isEmpty()) {\n        return;\n    }\n    Node temp =\
  \ tail.next;\n    while (temp != tail) {\n        System.out.print(temp.value +\
  \ \" \");\n        temp = temp.next;\n    }\n    System.out.print(temp.value);\n\
  }\n```\n\n**分析：**在循环列表中，没有末尾，所以我们不能通过 `null` 来检查。使用 `tail` 代替 `null` 来检查列表末尾。\n\n\
  时间复杂度：O(n)。\n\n### 在头部删除元素\n\n**问题：**删除链表的首个元素。\n\n示例 6.42：\n\n```java\npublic int\
  \ removeHead() throws IllegalStateException {\n    if (isEmpty()) {\n        throw\
  \ new IllegalStateException(\"EmptyListException\");\n    }\n    int value = tail.next.value;\n\
  \    if (tail == tail.next)\n        tail = null;\n    else\n        tail.next =\
  \ tail.next.next;\n    size--;\n    return value;\n}\n```\n\n**分析：**\n\n- 如果列表为空，则返回。\n\
  - 如果 `tail` 的下一个节点与 `tail` 相同，则是单节点情况。将 `tail` 标记为 `null`。\n- 如果不是单节点情况，则将 `tail.next`\
  \ 指向头部的第二个节点。\n\n时间复杂度：O(1)。\n\n### 根据给定值删除节点\n\n**问题：**在循环链表中删除具有给定值的节点\n\n![](img/00102.jpeg)\n\
  ![](img/00103.jpeg)\n![](img/00104.jpeg)\n![](img/00105.jpeg)\n\n示例 6.43：\n\n```java\n\
  public boolean removeNode(int key) {\n    if (isEmpty()) {\n        return false;\n\
  \    }\n    Node prev = tail;\n    Node curr = tail.next;\n    if (curr.value ==\
  \ key) {\n        if (curr == tail) {\n            tail = null;\n        } else\
  \ {\n            tail.next = curr.next;\n            if (curr == tail) {\n     \
  \           tail = prev;\n            }\n        }\n        size--;\n        return\
  \ true;\n    }\n    while (curr != tail) {\n        prev = curr;\n        curr =\
  \ curr.next;\n        if (curr.value == key) {\n            prev.next = curr.next;\n\
  \            if (curr == tail) {\n                tail = prev;\n            }\n\
  \            size--;\n            return true;\n        }\n    }\n    return false;\n\
  }\n```\n\n**分析：**遍历列表以找到要删除的节点。区别在于在遍历列表时，通过 `tail` 代替 `null` 来检查末尾。如果要删除的不是 `tail`\
  \ 节点，则不需要修改 `tail` 指针；如果要删除的是 `tail` 节点，则需要更新 `tail` 指针。 *(注：提供的示例代码逻辑与分析描述略有出入，此处根据分析意进行翻译)*\n\
  \n### 删除列表\n\n**问题：**删除链表。\n\n示例 6.44：\n\n```java\npublic void deleteList() {\n\
  \    tail = null;\n    size = 0;\n}\n```\n\n**分析：**`tail` 指向 `null`。整个列表内存会被垃圾回收机制。\n\
  \n时间复杂度：O(1)。\n\n### 反转复制循环链表\n\n**问题：**反序复制循环链表。\n\n示例 6.45：\n\n```java\npublic\
  \ CircularLinkedList copyListReversed() {\n    CircularLinkedList cl = new CircularLinkedList();\n\
  \    Node curr = tail.next;\n    Node head = curr;\n    if (curr != null) {\n  \
  \      cl.addHead(curr.value);\n        curr = curr.next;\n    }\n    while (curr\
  \ != head) {\n        cl.addHead(curr.value);\n        curr = curr.next;\n    }\n\
  \    return cl;\n}\n```\n\n时间复杂度：O(n)。\n\n### 复制循环链表\n\n**问题：**复制循环链表。\n\n示例 6.46：\n\
  \n```java\npublic CircularLinkedList copyList() {\n    CircularLinkedList cl = new\
  \ CircularLinkedList();\n    Node curr = tail.next;\n    Node head = curr;\n   \
  \ if (curr != null) {\n        cl.addTail(curr.value);\n        curr = curr.next;\n\
  \    }\n    while (curr != head) {\n        cl.addTail(curr.value);\n        curr\
  \ = curr.next;\n    }\n    return cl;\n}\n```\n\n时间复杂度：O(n)。\n\n## 双向循环列表\n\n在双向循环链表中，每个节点有两个指针。这些指针被称为\
  \ `prev` 和 `next`。节点的 `prev` 指针指向它的前一个节点，而 `next` 指针指向它的下一个节点。第一个元素的前一个节点指向列表的最后一个节点，最后一个节点的\
  \ `next` 指针指向列表的第一个节点。\n\n在双向链列表中，我们有以下情况：\n\n1. 零元素情况。\n\n2. 只有一个元素。\n\n3. 一般情况。\n\
  \n4. 避免使用递归解决方案，这会让生活更艰难。\n\n![](img/00106.jpeg)\n\n\n\n\n\n## 示例 6.47：双向循环链表的节点。\n\
  \n```java\npublic class DoublyCircularLinkedList {\n    private Node head = null;\n\
  \    private Node tail = null;\n    private int size = 0;\n    private static class\
  \ Node {\n        private int value;\n        private Node next;\n        private\
  \ Node prev;\n        public Node(int v, Node nxt, Node prv) {\n            value\
  \ = v;\n            next = nxt;\n            prev = prv;\n        }\n        public\
  \ Node(int v) {\n            value = v;\n            next = this;\n            prev\
  \ = this;\n        }\n    }\n    /* 其他方法 */\n}\n```\n\n**分析：双向循环链表的节点与双向链表的节点相同。唯一的区别是第一个节点的的前指针指向链表的最后一个节点，而最后一个节点的后指针指向链表的第一个节点。**\n\
  \n### 在头部插入节点\n\n**问题：** 在链表的头部插入值。\n\n**示例 6.48：**\n\n```java\npublic void addHead(int\
  \ value) {\n    Node newNode = new Node(value, null, null);\n    if (size == 0)\
  \ {\n        tail = head = newNode;\n        newNode.next = newNode;\n        newNode.prev\
  \ = newNode;\n    } else {\n        newNode.next = head;\n        newNode.prev =\
  \ head.prev;\n        head.prev = newNode;\n        newNode.prev.next = newNode;\n\
  \        head = newNode;\n    }\n    size++;\n}\n```\n\n**分析：**\n\n* 创建一个新节点，如果链表为空，则\
  \ `head` 和 `tail` 将指向它。新创建的 `newNode` 的 `next` 和 `prev` 也指向 `newNode`。\n* 如果链表不为空，则调整指针并将新节点添加到链表的头部。在这种情况下，只需要修改\
  \ `head`。\n* 链表的长度 `Size` 增加了 1。\n\n时间复杂度：O(1)。\n\n### 在尾部插入节点\n\n**问题：在链表的末尾插入值。**\n\
  \n**示例 6.49：**\n\n```java\npublic void addTail(int value) {\n    Node newNode =\
  \ new Node(value, null, null);\n    if (size == 0) {\n        head = tail = newNode;\n\
  \        newNode.next = newNode;\n        newNode.prev = newNode;\n    } else {\n\
  \        newNode.next = tail.next;\n        newNode.prev = tail;\n        tail.next\
  \ = newNode;\n        newNode.next.prev = newNode;\n        tail = newNode;\n  \
  \  }\n    size++;\n}\n```\n\n**分析：**\n\n* 创建一个新节点，如果链表为空，则 `head` 和 `tail` 将指向它。新创建的\
  \ `newNode` 的 `next` 和 `prev` 也指向 `newNode`。\n* 如果链表不为空，则调整指针并将新节点添加到链表的末尾。只需要修改\
  \ `tail`。\n* 链表的长度 `Size` 增加了 1。\n\n时间复杂度：O(1)。\n\n### 删除头部节点\n\n**问题：删除双向循环链表头部的节点**\n\
  \n**示例 6.50：**\n\n```java\npublic int removeHead() {\n    if (size == 0) {\n   \
  \     throw new IllegalStateException(\"EmptyList\");\n    }\n    int value = head.value;\n\
  \    size--;\n    if (size == 0) {\n        head = tail = null;\n    } else {\n\
  \        Node next = head.next;\n        next.prev = tail;\n        tail.next =\
  \ next;\n        head = next;\n    }\n    return value;\n}\n```\n\n**分析：** 在双向循环链表中删除节点与在循环链表中删除节点相同。只需要调整几个额外的指针。\n\
  \n时间复杂度：O(1)。\n\n### 删除尾部节点\n\n**问题：删除链表的尾部节点。**\n\n**示例 6.51：**\n\n```java\npublic\
  \ int removeTail() {\n    if (size == 0) {\n        throw new IllegalStateException(\"\
  EmptyList\");\n    }\n    int value = tail.value;\n    size--;\n    if (size ==\
  \ 0) {\n        head = tail = null;\n    } else {\n        Node prev = tail.prev;\n\
  \        prev.next = head;\n        head.prev = prev;\n        tail = prev;\n  \
  \  }\n    return value;\n}\n```\n\n**分析：** 如果链表为空则返回。在只有一个节点节点的情况下，`head` 和 `tail`\
  \ 将存储 `null`。在其他情况下，倒数第二个节点的 `next` 将指向 `head`，`head` 的 `previous` 将指向倒数第二个节点。\n\
  \n时间复杂度：O(1)。\n\n删除 删除链表\n\n**问题：释放链表。**\n\n**解决方案：删除整个链表与循环链表中提供的方案相同。**\n\n###\
  \ 搜索值\n\n**问题：在双向循环链表中搜索一个值。**\n\n**解决方案：在双向循环链表中搜索一个值的算法与循环链表相同。**\n\n### 打印链表\n\
  \n**问题：打印链表中的所有元素。**\n\n**解决方案：打印双向循环链表内容的算法与循环链表中提供的相同。**\n\n## 练习题\n\n1. 在链表从开始的第\
