  \n**问题：**向循环链表的头部添加元素。\n\n![](img/00094.jpeg)\n![](img/00095.jpeg)\n![](img/00096.jpeg)\n\
  \n示例 6.38：\n\n```java\npublic void addHead(int value) {\n    Node temp = new Node(value,\
  \ null);\n    if (isEmpty()) {\n        tail = temp;\n        temp.next = temp;\n\
  \    } else {\n        temp.next = tail.next;\n        tail.next = temp;\n    }\n\
  \    size++;\n}\n\npublic static void main(String[] args) {\n    CircularLinkedList\
