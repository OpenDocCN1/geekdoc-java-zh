  \ = size -1`。\n3. 计算 `sum = arr[firstIndex]+arr[secondIndex]`。\n4. 如果和等于 0，我们找到了解。\n\
  5. 如果和小于目标值，则我们增加 `first`。\n6. 如果和大于目标值，则我们减小 `second`。\n7. 重复上述过程 3 到 6，直到我们得到目标对或得到\
  \ `first >= second`。\n\n排序算法需要 O(n.logn) 时间，单次扫描需要 O(n) 时间。\n时间复杂度为 O(n.logn)，空间复杂度为\
  \ O(1)\n\n**示例 5.22：**\n\n```java\npublic static boolean FindPair2(int[] arr, int\
