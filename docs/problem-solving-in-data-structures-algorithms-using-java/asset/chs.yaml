  \    return true;\n          } else if (curr.value > value) {\n              curr\
  \ = curr.lChild;\n          } else {\n              curr = curr.rChild;\n      \
  \    }\n      }\n      return false;\n}\n```\n\n**复杂度分析：** 时间复杂度: O(n), 空间复杂度: O(1)\n\
