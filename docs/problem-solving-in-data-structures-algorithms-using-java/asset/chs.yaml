  \ != null) {\n                System.out.println(head.value);\n                head\
  \ = head.next;\n            }\n        }\n    }\n    public boolean find(int value)\
  \ {\n        int index = computeHash(value);\n        Node head = listArray[index];\n\
  \        while (head != null) {\n            if (head.value == value) {\n      \
  \          return true;\n            }\n            head = head.next;\n        }\n\
  \        return false;\n    }\n    public static void main(String[] args) {\n  \
  \      HashTableSC ht = new HashTableSC();\n        for (int i = 0; i < 1; i++)\
