  \ 的 ADT 包含以下函数：\n\n1. `Insert(x)`，将 `x` 添加到数据集中。\n2. `Delete(x)`，从数据集中删除 `x`。\n\
  3. `Search(x)`，在数据集中搜索 `x`。\n\n## 哈希函数\n\n哈希函数是一种根据给定键在表中生成索引的函数。为每个键生成唯一索引的理想哈希函数被称为完美哈希函数。\n\
  \n**示例 11.1**: 最简单的哈希函数\n\n```java\nprivate int computeHash(int key)/* division\
  \ method*/\n{\n      int hashValue = key;\n      return hashValue % tableSize;\n\
  }\n```\n\n有许多哈希函数。上面的函数是一个非常简单的哈希函数。将向此函数添加各种哈希生成逻辑，以生成更好的哈希。\n\n## 冲突\n\n当哈希函数为两个或多个不同的键生成相同的索引时，这个问题被称为冲突。理想情况下，哈希函数应该为每个键返回一个唯一的地址，但在实践中这是不可能的。\n\
  \n## 良好的哈希函数的属性：\n\n1. 它应该提供哈希值的均匀分布。非均匀分布会增加冲突的次数以及解决冲突的成本。\n2. 选择一个可以快速计算且返回值在\
  \ `Hash-Table` 范围内的哈希函数。\n3. 选择一个具有良好冲突解决算法的哈希函数，当发生冲突时可以用它可以计算备用索引。\n4. 选择一个利用键提供的必要信息的哈希函数。\n\
  5. 对于给定的键集，它应该具有很高的负载因子。\n\n## 负载因子\n\n负载因子 = (`Hash-Table` 中允许允许的最大元素数） / `Hash-Table`\
  \ 大小\n\n根据上述定义，负载因子衡量了哈希表在容量增加之前允许包含多少元素。当元素数量超过负载因子与当前容量的乘积时，哈希表将进行重新哈希（rehashed）。通常情况下，在这种情况下哈希表的大小会翻倍。\n\
  \n例如，如果负载因子为 0.8 且哈希表容量为 1000，那么我们允许向 `Hashtable` 添加 800 个元素而无需重新哈希。\n\n## 冲突解决技术\n\
  \n在对大量键进行哈希时，哈希冲突实际上是不可避免的。用于寻找 `Hash-Table` 中替代位置的技术称为冲突解决。有很多冲突解决技术来处理哈希冲突。\n\n\
  最常见且广泛使用的技术有：\n\n- 开放地址法 (Open addressing)\n- 分链链法 (Separate chaining)\n\n### 使用开放地址法的哈希\n\
  \n当使用线性开放法时，`Hash-Table` 由一个一维数组表示，索引范围从 0 到表大小-1。\n\n解决冲突的一种方法是查看 `Hash-Table`\
  \ 并找到另一个空槽来存放引起冲突的值。一种简单的方法是按照某种顺序从一个槽移动到另一个槽，直到找到空闲。这种冲突解决过程被称为开放地址法。\n\n### 线性探测\
  \ (LinearProbing)\n\n在线性探测中，我们尝试通过顺序搜索 `Hash-Table` 的空位置来解决 `Hash-Table` 索引的冲突。假设如果\
  \ `k` 是从哈希函数检索到的索引。如果第 `kth` 索引已填充，我们将查找 `(k+1) % M`，然后是 `(k+2) % M`，等此类推。当我们得到一个空槽时，我们将数据插入到该空槽中。\n\
