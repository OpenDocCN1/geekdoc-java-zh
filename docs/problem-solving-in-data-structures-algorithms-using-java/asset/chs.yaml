  \n\n\n\n\n## 问题：编写一个函数，接收一个字符串作为输入，如果它包含所有唯一字符则返回 true，否则返回 false。\n\n### 示例 13.12:\n\
  ```java\npublic static boolean isUniqueChar(String str) {\n    int[] bitarr = new\
