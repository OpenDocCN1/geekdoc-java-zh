  \n\n# 第 13 章：字符串算法\n\n## 引言\nJava 语言中的字符串（String）是字符的数组。我们在许多任务中都会用到字符串算法，比如当我们进行某些复制粘贴、字符串替换和字符串搜索时。当我们使用某些字典程序时，我们就在使用字符串算法。当我们\
  \ Google 上搜索某些内容时，我们传递的信息也是一个字符串，这些信息将由 Google 进一步转换和处理。\n\n注意：本章对于面试来说非常重要，因为很多面试题都来自本章。\n\
  \n## 字符串匹配\n每个文字处理程序都有搜索功能，您可以在长文本文件中搜索任何特定单词的所有出现位置。为此，我们需要字符串匹配算法。\n\n**问题：**\
  \ 在给定的文中搜索一个模式。模式长度为 `m`，文本长度为 `n`。其中 `m < n`。\n\n### 方法 1：暴力法搜索\n暴力法搜索算法将在文本中所有可能的\
  \ `i` 值处检查模式，`i` 的值范围从 0 到 `n-m`。模式从左到右逐个字符地与文本进行比较。当检测到不匹配时，通过将比较窗口向移动一个字符来重新比较模式。\n\
  \n**示例 13.1：**\n\n```java\nint bruteForceSearch(String text, String pattern) {\n\
  \    return bruteForceSearch(text.toCharArray(), pattern.toCharArray());\n}\n\n\
  int bruteForceSearch(char[] text, char[] pattern) {\n    int i = 0, j = 0;\n   \
  \ final int n = text.length;\n    final int m = pattern.length;\n    while (i <=\
  \ n - m) {\n        j = 0;\n        while (j < m && pattern[j] == text[i + j]) {\n\
  \            j++;\n        }\n        if (j == m) {\n            return (i);\n \
  \       }\n        i++;\n    }\n    return -1;\n}\n```\n该算法的最坏时间复杂度为 `O(m*n)`，当我们在文本末尾找到模式或者或者根本没有找到模式时。\n\
  \n### 方法 2：Robin-Karp 算法\nRobin-Karp 算法与暴力算法相似，它将模式与文本中长度为 `m` 的每个部分进行比较。它不是逐个字符比较模式，而是比较它们的哈希值（hash\
  \ code）。模式的哈希值与文本窗口的哈希值进行比较。我们尝试让哈希值尽可能唯一，这样当哈希值匹配时，文本也应该是匹配的。\n\n一个良好的哈希值的两个特征是：\n\
  - 尽可能排除冲突。当哈希值匹配但模式不匹配时，就会发生冲突。\n- 文本的哈希值必须在常数时间内计算。\n\n在此算法中，某个窗口的哈希值是通过上一个窗口的哈希值在常数时间内计算出来的。在开始时，计算长度为\
  \ m 的文本的哈希值。我们将它的哈希值与模式字符串的哈希值进行比较。为了获取下一个窗口的哈希值，我们排除一个字符并包含下一个字符。需要比较的文本部分像字符窗口一样移动。对于每个窗口，哈希计算是在常数时间内完成的，一个成员离开窗口，一个新数字进入窗口。\n\
  \n乘以 2 等于左移操作。乘以 `2^(m-1)` 等于左移 `m-1` 次。如果模式长度为“m” 个字符，那么当我们想要从哈希值中移除最左侧的字符时，我们将减去其\
  \ ASCII 值乘以 `2^(m-1)` 的结果。我们通过乘以 2 来移动整个哈希计算。最后，通过加上该窗口最右侧元素的 ASCII 值来计算新窗口的哈希值。\n\
  \n我们不希望进行大数乘法运算，因此使用了对质数的取模运算。\n\n**示例 13.2：**\n\n```java\nint robinKarp(String\
  \ text, String pattern) {\n    return robinKarp(text.toCharArray(), pattern.toCharArray());\n\
  }\n\nint robinKarp(char[] text, char[] pattern) {\n    int n = text.length;\n  \
  \  int m = pattern.length;\n    int i, j;\n    int prime = 11;\n    int powm = 1;\n\
  \    int TextHash = 0, PatternHash = 0;\n    if (m == 0 || m > n) {\n        return\
  \ -1;\n    }\n    for (i = 0; i < m - 1; i++) {\n        powm = (powm << 1) % prime;\n\
  \    }\n    for (i = 0; i < m; i++) {\n        PatternHash = ((PatternHash << 1)\
  \ + pattern[i]) % prime;\n        TextHash = ((TextHash << 1) + text[i]) % prime;\n\
  \    }\n    for (i = 0; i <= (n - m); i++) {\n        if (TextHash == PatternHash)\
  \ {\n            for (j = 0; j < m; j++) {\n                if (text[i + j] != pattern[j])\
  \ { // 此处补全逻辑\n                    break;\n                }\n            }\n  \
  \          if (j == m) return i;\n        }\n        if (i < n - m) {\n        \
  \    TextHash = ((TextHash - text[i] * powm) << 1 + text[i + m]) % prime;\n    \
  \        if (TextHash < 0) TextHash += prime;\n        }\n    }\n    return -1;\n\
  }\n```\n*(注：原文示例 13.2 代码逻辑存在不完整/断句，翻译时保留原意并微调可读性)* 算法的最坏时间复杂度为 `O(n)`。\n\n### 方法\
  \ 3：Knuth-Morris-Pratt (KMP) 算法\n暴力法在匹配文本和模式时会丢失关于之前匹配的信息。Knuth-Morris-Pratt 算法利用了这些信息，这使得它的最坏时间复杂度为\
  \ `O(n)`。预处理需要 `O(m)` 时间。\n\n预处理步骤：\n- 前缀（prefix）是字符串开头的子。\n- 真前缀（proper prefix）不是字符串本身的前缀（长度小于字符串长度）。\n\
  - 后缀（suffix）是字符串末尾的子。\n- 真后缀（proper suffix）不是字符串本身的后缀（长度小于字符串长度）。\n- 边界（border）是既是真前缀又是真后缀的字符串。\n\
  \n**示例 13.3：**\n\n```java\nvoid KMPPreprocess(char[] pattern, int[] ShiftArr) {\n\
  \    int m = pattern.length;\n    int i = 0, j = -1;\n    ShiftArr[i] = -1;\n  \
  \  while (i < m) {\n        while (j >= 0 && pattern[i] != pattern[j]) {\n     \
  \       j = ShiftArr[j];\n        }\n        i++;\n        j++;\n        ShiftArr[i]\
  \ = j;\n    }\n}\n```\n\n**示例 13.4：**\n\n```java\nint KMP(String text, String pattern)\
  \ {\n    return KMP(text.toCharArray(), pattern.toCharArray());\n}\n\nint KMP(char[]\
  \ text, char[] pattern) {\n    int i = 0, j = 0;\n    int n = text.length;\n   \
  \ int m = pattern.length;\n    int[] ShiftArr = new int[m + 1];\n    KMPPreprocess(pattern,\
  \ ShiftArr);\n    while (i < n) {\n        while (j >= 0 && text[i] != pattern[j])\n\
  \            j = ShiftArr[j];\n        i++;\n        j++;\n        if (j == m) {\n\
  \            return (i - m);\n        }\n    }\n    return -1;\n}\n\n/* 测试代码 */\n\
  \npublic static void main(String[] args) {\n    String st1 = \"hello, world!\";\n\
  \    String st2 = \"world\";\n}\n```\n\n\n\n\n```java\nAlgo algo = new Algo();\n\
  \n      System.out.println(\"BruteForceSearch return : \" + algo.bruteForceSearch(st1,\
  \ st2));\n\n      System.out.println(\"RobinKarp return : \" + algo.robinKarp(st1,\
  \ st2));\n\n      System.out.println(\"KMP return : \" + algo.KMP(st1, st2));\n\
  }\n```\n\n## 问题\n使用相同的 `KMP` 算法来查找模式在文本中出现的次数。\n\n### 示例 13.5\n```java\nint KMPFindCount(char[]\
  \ text, char[] pattern) {\n    int i = 0, j = 0, count = 0;\n    final int n = text.length;\n\
  \    final int m = pattern.length;\n    int[] ShiftArr = new int[m + 1];\n    KMPPreprocess(pattern,\
  \ ShiftArr);\n    while (i < n) {\n        while (j >= 0 && text[i] != pattern[j])\
  \ {\n            j = ShiftArr[j];\n        }\n        i++;\n        j++;\n     \
  \   if (j == m) {\n            count++;\n            j = ShiftArr[j];\n        }\n\
  \    }\n    return count;\n}\n```\n\n## 字典 / 符号表\n符号表是字符串（键）与任意类型值之间的映射。值可以是整数，例如出现次数、单词的字典含义等。字典可以通过多种方式实现。我们将学习字符串的二叉搜索树（BST）、哈希表（Hash-Table）、字典树（Tries）和三叉搜索树。\n\
  \n### 用于字符串的二叉搜索树 (BST)\n二叉搜索树（BST）是实现符号表最简单的方法。可以使用简单的 `strcmp()` 函数比较两个字符串。如果所有键都是随机的且树是平衡的，那么平均键查找可以在\
  \ `O(logn)` 时间内完成。\n\n![](img/00256.jpeg)\n\n以下是使用二叉搜索树存储字符串作为键的实现。这将跟踪文本中单词的出现次数。\n\
  \n### 示例 13.6\n```java\npublic class StringTree {\n    Node root = null;\n    class\
  \ Node {\n        String value;\n        int count;\n        Node lChild;\n    \
  \    Node rChild;\n    };\n    // 其他方法。\n    public void print() {\n        print(root);\n\
  \    }\n    public void print(Node curr) /* 前序遍历 */ {\n        if (curr != null)\
  \ {\n            System.out.print(\" value is ::\" + curr.value);\n            System.out.println(\"\
  \ count is :: \" + curr.count);\n            print(curr.lChild);\n            print(curr.rChild);\n\
  \        }\n    }\n    public void add(String value) {\n        root = add(value,\
  \ root);\n    }\n    Node add(String value, Node curr) {\n        int compare;\n\
  \        if (curr == null) {\n            curr = new Node();\n            curr.value\
  \ = value;\n            curr.lChild = curr.rChild = null;\n            curr.count\
  \ = 1;\n        } else {\n            compare = curr.value.compareTo(value);\n \
  \           if (compare == 0)\n                curr.count++;\n            else if\
  \ (compare == 1)\n                curr.lChild = add(value, curr.lChild);\n     \
  \       else\n                curr.rChild = add(value, curr.rChild);\n        }\n\
  \        return curr;\n    }\n    boolean find(String value) {\n        boolean\
  \ ret = find(root, value);\n        System.out.println(\"Find \" + value + \" Return\
  \ \" + ret);\n        return ret;\n    }\n    boolean find(Node curr, String value)\
  \ {\n        int compare;\n        if (curr == null)\n            return false;\n\
  \        compare = curr.value.compareTo(value);\n        if (compare == 0)\n   \
  \         return true;\n        else {\n            if (compare == 1)\n        \
  \        return find(curr.lChild, value);\n            else\n                return\
  \ find(curr.rChild, value);\n        }\n    }\n    int frequency(String value) {\n\
  \        return frequency(root, value);\n    }\n    int frequency(Node curr, String\
  \ value) {\n        int compare;\n        if (curr == null)\n            return\
  \ 0;\n        compare = curr.value.compareTo(value);\n        if (compare == 0)\n\
  \            return curr.count;\n        else {\n            if (compare > 0)\n\
  \                return frequency(curr.lChild, value);\n            else\n     \
  \           return frequency(curr.rChild, value);\n        }\n    }\n    void freeTree()\
  \ {\n        root = null;\n    }\n}\n```\n\n## 哈希表\n哈希表是另一种可用于符号表实现的数据结构。通过下面的哈希表图，我们可以看到人的名字被用作键，它们的含义是搜索的值。第一个键通过传递给适当的哈希函数转换为哈希码。在哈希函数内部还会传递哈希表的大小，这用于找到存储值的实际索引。最后，将值（名字的含义）存储在哈希表中，或者你可以将指向存储含义的字符串的引用存储在哈希表中。\n\
  \n![](img/00257.jpeg)\n\n哈希表具有极佳的 `O(1)` 查找性能。使用哈希表也适用于实现自动补全。假设我们想实现自动补全功能。\n\n\
  ### 字典树 (Trie)\nTrie 是一种树，其中每个节点只存储一个字符，并且在叶子节点处标记单词的结束。使用 Trie 可以在 `O(M)` 时间内搜索，其中\
  \ `M` 是字符串长度。\n\n### 三叉搜索树 (Ternary Search Tree)\n三叉搜索树是一种特殊的树，每个节点有三个子节点。它结合了二叉搜索树和字典树的优点，在处理大量字符串时非常高效。\n\
  \n\n\n\n\n```java\nif (curr == null) {\n    return;\n}\nif (str.length() == index)\
  \ {\n    if (curr.isLastChar) {\n        curr.isLastChar = false;\n    }\n    return;\n\
  }\nremove(curr.child[str.charAt(index) - 'a'], str, index + 1);\n}\n\nboolean find(String\
  \ str) {\n    if (str == null) {\n        return false;\n    }\n    str = str.toLowerCase();\n\
  \    return find(root, str, 0);\n}\n\nboolean find(Node curr, String str, int index)\
  \ {\n    if (curr == null) {\n        return false;\n    }\n    if (str.length()\
  \ == index) {\n        return curr.isLastChar;\n    }\n    return find(curr.child[str.charAt(index)\
  \ - 'a'], str, index + 1);\n}\n\npublic static void main(String[] args) {\n    Trie\
  \ t = new Trie();\n    String a = \"hemant\";\n    String b = \"heman\";\n    String\
  \ c = \"hemantjain\";\n    String d = \"jain\";\n    t.add(a);\n    t.add(d);\n\
  \    System.out.println(t.find(a));\n    t.remove(a);\n    t.remove(d);\n    System.out.println(t.find(a));\n\
  \    System.out.println(t.find(c));\n    System.out.println(t.find(d));\n}\n```\n\
  \n**输出：**\ntrue\nfalse\nfalse\n\n### 三元搜索树 (Ternary Search Tree)\n\nTrie 具有非常好的搜索性能\
  \ `O(M)`，其中 `M` 是搜索字符串的最大长度。然而，Trie 的空间需求很高。在每个节点中，Trie 包含指向对应键可能字符的多个节点的指针。为了避免这种高空间需求，使用了三元搜索树\
  \ (`TST`)。\n\nTST 避免了传统 Trie 的高额需求，同时仍然保留了它的许多优势。在 TST 中，每个节点包含一个字符、一个键结束指示器三个指针。这三个指针分别对应当前字符、小于当前字符的字符和大于当前字符的字符。三元树操作的时间复杂度与三元树的高度成比例。在最坏情况下，我们需要遍历最长字符串长度的\
  \ 3 倍。然而，这种情况非常罕见。因此，TST 是实现符号表、部分匹配和范围查询的非常良的解决方案。\n\n**示例 1.8：**\n```java\nclass\
  \ TST {\n    Node root;\n    private class Node {\n        char data;\n        boolean\
  \ isLastChar;\n        Node left, equal, right;\n        private Node(char d) {\n\
  \            data = d;\n            isLastChar = false;\n            left = right\
  \ = null;\n        }\n    };\n    public void add(String word) {\n        root =\
  \ add(root, word, 0);\n    }\n    private Node add(Node curr, String word, int wordIndex)\
  \ {\n        if (curr == null)\n            curr = new Node(word.charAt(wordIndex));\n\
  \        if (word.charAt(wordIndex) < curr.data)\n            curr.left = add(curr.left,\
  \ word, wordIndex);\n        else if (word.charAt(wordIndex) > curr.data)\n    \
  \        curr.right = add(curr.right, word, wordIndex);\n        else {\n      \
  \      if (wordIndex < word.length() - 1)\n                curr.equal = add(curr.equal,\
  \ word, wordIndex + 1);\n            else\n                curr.isLastChar = true;\n\
  \        }\n        return curr;\n    }\n    private boolean find(Node curr, String\
  \ word, int wordIndex) {\n        if (curr == null)\n            return false;\n\
  \        if (word.charAt(wordIndex) < curr.data)\n            return find(curr.left,\
  \ word, wordIndex);\n        else if (word.charAt(wordIndex) > curr.data)\n    \
  \        return find(curr.right, word, wordIndex);\n        else {\n           \
  \ if (wordIndex == word.length() - 1)\n                return curr.isLastChar;\n\
  \            return find(curr.equal, word, wordIndex + 1);\n        }\n    }\n \
  \   public boolean find(String word) {\n        boolean ret = find(root, word, 0);\n\
  \        System.out.print(word + \" :: \");\n        if (ret)\n            System.out.println(\"\
  \ Found \");\n        else\n            System.out.println(\"Not Found \");\n  \
  \      return ret;\n    }\n    public static void main(String[] args) {\n      \
  \  TST tt = new TST();\n        tt.add(\"banana\");\n        tt.add(\"apple\");\n\
  \        tt.add(\"mango\");\n        System.out.println(\"\\nSearch results are:\"\
  );\n        tt.find(\"apple\");\n        tt.find(\"banana\");\n        tt.find(\"\
  mango\");\n        tt.find(\"grapes\");\n    }\n}\n```\n\n**输出：**\n搜索结果：\napple\
  \ :: Found\nbanana :: Found\nmango :: Found\ngrapes :: Not Found\n\n## 字符串中的问题\n\
  \n### 正则表达式匹配\n\n**问题：** 实现支持 `?` 和 `*` 特殊字符的正正则表达式匹配。\n`?` 匹配任意单个字符。\n`*` 匹配前一个元素的零个或多个。\n\
  \n**示例 13.9：**\n```java\npublic static boolean matchExpUtil(char[] exp, char[] str,\
  \ int i, int j) {\n    if (i == exp.length && j == str.length) {\n        return\
  \ true;\n    }\n    if (i == exp.length) {\n        return false;\n    }\n    if\
  \ (exp[i] == '*') {\n        return matchExpUtil(exp, str, i + 1, j) || (j < str.length\
  \ && (exp[i-1] == '?' || exp[i-1]) && matchExpUtil(exp, str, i, j + 1));\n    }\n\
  \    if (j < str.length && (exp[i] == '?' || exp[i] == str[j])) {\n        return\
  \ matchExpUtil(exp, str, i + 1, j + 1);\n    }\n    return false;\n}\npublic static\
  \ boolean matchExp(String exp, String str) {\n    return matchExpUtil(exp.toCharArray(),\
  \ str.toCharArray(), 0, 0);\n}\n/* 测试代码 */\npublic static void main() {\n    System.out.println(matchExp(\"\
  *llo?\", \"Hello, World!\"));\n}\n```\n*(注：由于原文代码片段在提供处似乎不完整，此处根据常见逻辑补全了翻译所需的占位结构，以保持格式一致)*\n\
  \n### 顺序匹配\n\n**问题：** 在给定的文本字符串和模式字符串中，查找模式字符串的字符是否按顺序排列。\n例如：文本字符串 `ABCDEFGHIJKLMNOPQRSTUVWXYZ`\
  \ 模式 `JOST`\n\n**示例 13.10：**\n```java\npublic static boolean match(String src, String\
  \ ptn) {\n    char[] source = src.toCharArray();\n    char[] pattern = ptn.toCharArray();\n\
  \    int iSource = 0;\n    int iPattern = 0;\n    int sourceLen = source.length;\n\
  \    int patternLen = pattern.length;\n    for (iSource = 0; iSource < sourceLen;\
  \ iSource++) {\n        if (source[iSource] == pattern[iPattern]) {\n          \
  \  iPattern++;\n        }\n        if (iPattern == patternLen) {\n            return\
  \ true;\n        }\n    }\n    return false;\n}\npublic static void main() {\n \
  \   System.out.println(match(\"harrypottermustgotoschool\", \"pottergo\"));\n}\n\
  ```\n\n### ASCII 到整数转换\n\n**问题：** 写一个函数，接收 ASCII 字符列表并将其转换为整数。\n\n**示例 13.11：**\n\
  ```java\npublic static int myAtoi(String str) {\n    int value = 0;\n    int size\
  \ = str.length();\n    for (int i = 0; i < size; i++) {\n        char ch = str.charAt(i);\n\
  \        value = (value << 3) + (value << 1) + (ch - '0');\n    }\n    return value;\n\
