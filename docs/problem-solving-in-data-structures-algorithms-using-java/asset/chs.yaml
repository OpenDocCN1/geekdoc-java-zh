  \n**第二种解决方案：** 排序数组，然后交换相邻元素。\n\n**方案二示例：**\n\n（此处原文未提供代码）\n\n\n\n\n## 问题\n给定一个长度为\
  \ `N` 的数组。它包含从 1 到 `N` 的唯一元素。对数组元素进行排序。\n\n## 第一种解决方案\n对于每个索引值，取出元素并将其放入正确的位置，然后取出位于正确位置的元素，再次重复该过程。\n\
  \n### 示例 1.36\n```java\npublic static void Sort1toN(int[] arr, int size)\n{\n  \
  \  int curr, value, next;\n    for (int i = 0; i < size; i++)\n    {\n        curr\
  \ = i;\n        value = -1;\n        /* 通过交换将元素移动到正确的位置.*/\n        while (curr\
  \ >= 0 && curr < size && arr[curr] != curr + 1)\n        {\n            next = arr[curr];\n\
  \            arr[curr] = value;\n            value = next;\n            curr = next\
  \ - 1;\n        }\n    }\n}\n\npublic static void main(String[] args) {\n    int[]\
  \ arr = {8, 5, 6, 1, 9, 3, 2, 7, 4, 10};\n    int size = arr.length;\n    Sort1toN(arr,\
  \ size);\n    printArray(arr, size);\n}\n```\n时间复杂度：`O(n)`，看起来像是二次时间复杂度，但内部循环只遍历元素一次。一旦内层循环处理完元素，该位置的元素要么是该索引值，要么包含\
  \ `-1`。\n\n## 第二种解决方案\n对于每个索引，我们将取出该索引处的值并将其放在正确的位置。\n\n### 示例 1.37: 交换元素\n```java\n\
  public static void Sort1toN2(int[] arr, int size)\n{\n    int temp;\n    for (int\
  \ i = 0; i < size; i++)\n    {\n        while (arr[i] != i + 1 && arr[i] > 1)\n\
  \        {\n            temp = arr[i];\n            arr[i] = arr[temp - 1];\n  \
  \          arr[temp - 1] = temp;\n        }\n    }\n}\n```\n时间复杂度：`O(n)`，看起来像是二次时间复杂度，但无论外层循环运行多少次，内部循环只交换元素一次。一旦内层循环处理完元素，该位置的元素要么是该索引值，要么包含\
  \ `-1`。\n\n### 最小缺失的正整数\n\n## 问题\n给定一个无序数组，找到数组中缺失的最小正整数。\n\n## 第一种解决方案\n暴力法，对于范围内的每个数字，查找该数字是否存在于数组中。\n\
