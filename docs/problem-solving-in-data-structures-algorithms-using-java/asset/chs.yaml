  \n**以下是需要翻译的文本**：\n[/content]\n\n[content]\n算法最重要的属性有：\n\n1. `正确性`：算法必须是正确的。它应该能够处理所有给定的输入并提供正确的输出。\n\
  2. `效率`：算法在解决问题时应该是高效的。效率通过两个参数来衡量。首先是`时间复杂度`，即算法提供结果的速度。其次是`空间复杂度`，即算法为了所需的结果消耗多少\
  \ RAM 或内存。\n\n`时间复杂度`由函数 `T(n)` 表示——所需时间与输入规模 `n` 的关系。\n\n`空间复杂度`由函数 `S(n)` 表示——使用的内存与输入规模\
  \ `n` 的关系。\n\n## 渐近分析\n\n渐近分析用于在不依赖于任何特定数据集或编程语言的情况下比较算法的效率。\n\n我们通常对算法的增长阶感兴趣，而不是运行算法所需的确切时间。这种时间也称为渐近运行时间。\n\
  \n## 大 O 表示法\n\n定义：如果存在两个正数 `c` 和 `n0`，使得：\n\n对于所有 `n ≥ n0`，都有 `f(n) ≤ c g(n)`，\n\
  \n则“`f(n)` 是 `g(n)` 的大 O”，或 `f(n) = O(g(n))`。\n\n换句话说，对于所有 `n ≥ n0`，`c g(n)` 是 `f(n)`\
  \ 的上界。\n\n函数 `f(n)` 的增长慢于 `c g(n)`。\n\n我们可以简单地说，在输入 `N` 足够大之后，`(c.g(n))` 将始终大于 `f(n)`。\n\
  \n![](img/00001.jpeg)\n\n示例：`n² + n = O(n²)`\n\n## Omega-Ω 表示法\n\n定义：如果存在两个正数 `c`\
  \ 和 `n0`，使得：\n\n对于所有 `n ≥ n0`，都有 `c g(n) ≤ f(n)`\n\n换句话说，`c g(n)` 是 `f(n)` 的下界。\n\
  \n函数 `f(n)` 的增长速度快于 `c g(n)`。\n\n![](img/00002.jpeg)\n\n寻找 `f(n) = n^c` 和 `g(n)\
  \ = c^n` 的关系\n\n`f(n) = Ω(g(n))`\n\n## Theta-Θ 表示法\n\n定义：如果存在三个正数 `c1`, `c2` 和 `n0`，使得对于所有\
  \ `n ≥ n0`，都有 `c1 g(n) ≤ f(n) ≤ c2 g(n)`，\n\n函数 `g(n)` 是 `f(n)` 的渐近紧界。函数 `f(n)`\
  \ 的增长率与 `g(n)` 相同。\n\n![](img/00003.jpeg)\n\n示例：`n³ + n² + n = Ɵ(n³)`\n\n示例：`n²\
  \ + n = Ɵ(n²)`\n\n寻找 `f(n) = 2n² + n` 和 `g(n) = n²` 的关系\n\n`f(n) = O(g(n))`\n\n\
  `f(n) = Ɵ(g(n))`\n\n`f(n) = Ω(g(n))`\n\n**注意**：- 渐近分析不是完美的，但它是目前分析算法最好的方法。\n\n例如，假设有两个排序算法，第一个的时间为\
  \ `f(n) = 10000*n*log(n)`，第二个的时间为 `f(n) = n²`。渐近分析说第一个算法更好（因为它忽略了常数项），但实际上，对于较小的数据，当\
  \ `n` 小于 `10000` 时，第一个算法的表现会更好。为了考虑渐近分析的缺点，引入了算法的分类分析。\n\n## 算法复杂度分析\n\n1. `最坏情况复杂度`：它是针对规模为\
  \ `n` 的最坏输入解决问题的复杂度。它为算法提供了上界。这是最常用的分析方法。\n2. `平均情况复杂度`：它是平均解决问题的复杂度。我们计算所有可能输入的时间，然后取平均值。\n\
  3. `最好情况复杂度`：它是针对规模为 `n` 的最好输入解决问题的复杂度。\n\n## 时间复杂度排序   \n\n常见算法时间复杂度按递增排序的列表：\n\
  \n| 名称 | 表示法 |\n| :--- | :--- |\n| 常数 | `O(1)` |\n| 对数级 | `O(log n)` |\n| 线性 | `O(n)`\
  \ |\n| N-LogN | `O(n log n)` |\n| 平方 | `O(n²)` |\n| 多项式 | `O(n^c)` `c` 是常数且 `c>1`\
  \ |\n| 指数 | `O(c^m)` `c` 是常数且 `c>1` |\n| 阶乘或 N 的 N 次方 | `O(n!)` 或 `O(n^n)` |\n\n\
