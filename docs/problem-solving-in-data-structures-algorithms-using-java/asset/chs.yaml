  \ B 中元素的最大连续子数组。\n\n**第一个解决方案**：通过哈希表（HashTable）修改 Kadane 算法来解决这个问题。\n\n#### 示例\
  \ 5.81：\n```java\npublic static int MaxConArr(int[] A, int size, int[] B, int sizeB)\
  \ {\n    int currMax = 0;\n    int maximum = 0;\n    HashSet<Integer> hs = new HashSet<>();\n\
  \    for (int i = 0; i < sizeB; i++)\n        hs.add(B[i]);\n    for (int i = 0;\
  \ i < size; i++) {\n        if (!hs.contains(A[i])) {\n            currMax = Math.max(A[i],\
  \ currMax + A[i]);\n            if (currMax < 0)\n                currMax = 0;\n\
  \            if (maximum < currMax)\n                maximum = currMax;\n      \
  \  } else {\n            currMax = 0;\n        }\n    }\n    System.out.println(maximum);\n\
  \    return maximum;\n}\n```\n时间复杂度：O(M+N)\n\n**第二个解决方案**：对数组 B 进行排序。使用二分查找来检查元素是否存在。时间复杂度为\
  \ O(M log M + N log M)。\n\n#### 示例 5.82：\n```java\npublic static int MaxConArr2(int[]\
  \ A, int sizeA, int[] B, int sizeB) {\n    Arrays.sort(B);\n    int currMax = 0;\n\
  \    int maximum = 0;\n    for (int i = 0; i < sizeA; i++) {\n        if (Arrays.binarySearch(B,\
  \ A[i]) < 0) {\n            currMax = Math.max(A[i], currMax + A[i]);\n        \
  \    if (currMax < 0)\n                currMax = 0;\n            if (maximum < currMax)\n\
