  \ {\n        if (head == fastPtr.next || head == fastPtr.next.next) {\n        \
  \    System.out.println(\"circular list loop found\");\n            return 2;\n\
  \        }\n        slowPtr = slowPtr.next;\n        fastPtr = fastPtr.next.next;\n\
