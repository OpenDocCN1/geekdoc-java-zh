  **问题：** 找到给定值的节点。\n\n**解决方案：大于当前节点值的值将位于右子树中，小于当前节点的值将位于左子树中。我们可以通过迭代遍历左或右子树来找到某个值。**\n\
  \n**示例 9.37**：\n\n```java\npublic boolean Find(int value) {\n      Node curr = root;\n\
