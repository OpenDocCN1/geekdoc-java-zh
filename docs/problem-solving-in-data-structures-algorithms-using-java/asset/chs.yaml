  }\n```\n\n## 近排序数组\n\n**问题：** 给定一个近排序数组，其中每个元素与其排序位置之间的距离最大为 `k` 个单位。\n\n**第一解决方案：**\
  \ 如果你使用排序，将需要 `O(NlogN)` 时间。\n\n**第二解决方案：** 有一种算法可以在 `O(NlogK)` 时间内完成。\n1. 你可以从输入数组的前\
  \ `K+1` 个元素创建一个大小为 `K+1` 的最小堆。\n2. 创建一个空的输出数组。\n3. 从堆中弹出一个元素并将其存储到输出数组中。\n4. 将数组中的下一个元素推入堆中。\n\
  5. 重复步骤 3 和 4，直到数组中的所有元素都处理完毕且堆为空。\n6. 最后，你将得到了一个排序后的数组。\n\n### 示例 10.18\n```java\n\
  public static void sortK(int[] arr, int size, int k) {\n    PriorityQueue<Integer>\
  \ pq = new PriorityQueue<Integer>();\n    int i = 0;\n    for (i = 0; i < size;\
  \ i++) {\n        pq.add(arr[i]);\n    }\n    int[] output = new int[size];\n  \
  \  int index = 0;\n    for (i = k; i < size; i++) {\n        output[index++] = pq.remove();\n\
  \        pq.add(arr[i]);\n    }\n    while (pq.size() > 0)\n        output[index++]\
  \ = pq.remove();\n    for (i = k; i < size; i++) {\n        arr[i] = output[i];\n\
  \    }\n    System.out.println(output);\n}\n// 测试代码\npublic static void main(String[]\
  \ args) {\n    int k = 3;\n    int[] arr = { 1, 5, 4, 10, 9 };\n    int size = arr.length;\n\
  \    sortK(arr, size, k);\n}\n```\n\n## Chota bhim\n\n**问题：** 一个名叫 Chota bhim 的男孩有一个祖父\
