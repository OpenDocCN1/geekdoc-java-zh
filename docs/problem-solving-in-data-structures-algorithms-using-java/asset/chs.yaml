  \n### 示例 13.15:\n```java\npublic static boolean isPermutation(String s1, String\
  \ s2) {\n    int[] count = new int[256];\n    int length = s1.length();\n    if\
  \ (s2.length() != length) {\n        System.out.println(\"is permutation false\"\
  );\n        return false;\n    }\n    for (int i = 0; i < 256; i++) {\n        count[i]\
  \ = 0;\n    }\n    for (int i = 0; i < length; i++) {\n        char ch = s1.charAt(i);\n\
  \        count[ch]++;\n        ch = s2.charAt(i);\n        count[ch]--;\n    }\n\
  \    for (int i = 0; i < 256; i++) {\n        if (count[i] != 0) {\n           \
  \ System.out.println(\"is permutation false\");\n            return false;\n   \
  \     }\n    }\n    System.out.println(\"is permutation true\");\n    return true;\n\
  }\n\npublic static void main() {\n    System.out.println(isPermutation(\"apple\"\
  , \"plepa\"));\n}\n```\n时间复杂度：O(n)，n 是文本中的字符数量。\n\n## Palindrome Check\n\n问题：判断字符串是否为回文。\n\
