  -   如果该交点是列表的头部，则这是一个环形列表的情况，你需要再次遍历列表并使头部之前的一个节点指向 `null`。\n-   在其他情况下，你需要使用两个指针变量，一个从头部开始，另一个从交点开始。它们都会在环的起点处相遇。（你可以从数学上证明这一点\
  \ ;)）\n\n时间复杂度：`O(n)`，所有操作本质都是线性的。\n\n### 查找交点\n\n**问题**: 在给定的两个在某处相交的链表中，找到该交点。\n\
