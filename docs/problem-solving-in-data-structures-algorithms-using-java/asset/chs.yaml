  \ x^n 的函数，将 x 和 n 作为参数。\n\n### 示例 13.19:\n```java\npublic static int pow(int x,\
  \ int n) {\n    int value;\n    if (n == 0) {\n        return 1;\n    } else if\
  \ (n % 2 == 0) {\n        value = pow(x, n / 2);\n        return (value * value);\n\
  \    } else {\n        value = pow(x, n / 2);\n        return (x * value * value);\n\
  \    }\n}\n\npublic static void main() {\n    System.out.println(pow(5, 2));\n}\n\
  ```\n时间复杂度：O(logN)，N 是指数。\n\n## String Compare function\n\n问题：编写一个函数 `strcmp()`\
  \ 来比较两个字符串。函数的返回值应该是：\na) 返回 0 表示两个字符串相等。\nb) 返回值为负表示第一个字符串小于第二个字符串。\nc) 返回值为正表示第一个字符串大于第二个字符串。\n\
  \n### 示例 13.20:\n```java\npublic static int myStrcmp(String a, String b) {\n   \
  \ int index = 0;\n    int len1 = a.length();\n    int len2 = b.length();\n    int\
  \ minlen = len1;\n    if (len1 > len2) {\n        minlen = len2;\n    }\n    while\
  \ (index < minlen && a.charAt(index) == b.charAt(index)) {\n        index++;\n \
  \   }\n    if (index == len1 && index == len2) {\n        return 0;\n    } else\
  \ if (len1 == index) {\n        return -1;\n    } else if (len2 == index) {\n  \
  \      return 1;\n    } else {\n        return a.charAt(index) - b.charAt(index);\n\
  \    }\n}\n\npublic static void main() {\n    System.out.println(myStrcmp(\"abs\"\
  , \"abs\"));\n}\n```\n时间复杂度：O(n)，n 是字符串的长度。\n\n## Reverse String\n\n问题：反转字符串的所有字符。\n\
  \n### 示例 13.2:\n```java\npublic static String reverseString(String str) {\n    char[]\
  \ a = str.toCharArray();\n    reverseUtil(a);\n    String expn = new String(a);\n\
  \    return expn;\n}\n\npublic static void reverseUtil(char[] a) {\n    int lower\
  \ = 0;\n    int upper = a.length - 1;\n    char tempChar;\n    while (lower < upper)\
  \ {\n        tempChar = a[lower];\n        a[lower] = a[upper];\n        a[upper]\
  \ = tempChar;\n        lower++;\n        upper--;\n    }\n}\n```\n（时间复杂度为 O(n)，n\
  \ 是输入字符串的字符数量。）\n\n## Reverse Words\n\n问题：反转句子中的单词顺序。\n\n### 示例 13.23:\n```java\n\
  public static String reverseWords(String str) {\n    char[] a = str.toCharArray();\n\
