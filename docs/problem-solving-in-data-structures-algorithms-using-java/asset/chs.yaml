  \ 1;\n        for k = i to j\n          if (...)\n            M[i, j] = ...\n  \
  \          S[i, j] = ...\n```\n\n```\nAlgorithm PrintParenthesis(s[], i, j)\n  if\
  \ i == j\n    print Mi\n  else\n    print \"(\"\n    PrintParenthesis(s[], i, s[i,\
  \ j])\n    PrintParenthesis(s[], s[i, j]+1, j)\n    print \")\"\n```\n\n### 最长公共子序列\n\
  \n设 $X = \\{x1, x2, \\dots, xm\\}$，$Y = \\{y1, y2, \\dots, ym\\}$ 是两个序列。$L[i,j]$\
  \ 是 $X$ 的前 $i$ 个元素与 $Y$ 的前 $j$ 个元素的最长公共子序列的长度。\n\n如果 $xi = yj$，则 $L[i,j] = L[i-1,j-1]\
  \ + 1$；否则，$L[i,j] = \\max(L[i-1,j], L[i,j-1])$。\n\n### 优子结构\n\n假设 $C[i,j]$ 是从第 $i$\
  \ 个到第 $j$ 个矩阵乘法所需的最小少乘次数。\n\n$C[i,i] = 0$\n\n对于 $i < j$\n\n$C[i,j] = \\min_{i \\\
  le k < j} \\{C[i,k] + C[k+1,j] + p_{i-1}p_kp_j\\}$\n\n如果 $C[i,j]$ 是最小的，那么 $C[i,k]$\
  \ 和 $C[k+1,j]$ 都是最小的。\n\n否则，如果存在某个 $k'$ 使得 $C'[i,k'] < C[i,k]$，那么 $C[i,j]$ 就不可能是最小的，并且存在更优的解决方案。\n\
  \n### 递归关系\n\n![](img/0291.gif)\n\n### 换零问题\n\n如何用给定的面值 $D=\\{d1\\dots dn\\}$ 用最少的硬币换出一个金额\
  \ $N$？例如，印度硬币体系 $\\{5, 10, 20, 25, 50,100\\}$。假设我们要找 40 卢比零。\n\n我们可以通过重复选择小于当前金额的硬币来得到解决方案。贪心算法总是选择可能的最大值。对于\
  \ 40 卢比：$\\{25, 10, 和 5\\}$\n\n这是全球数十亿人每天换零的方式。这是该问题的近似解。但这不是最优方法，上述问题的最优解是 $\\\
  {20, 20\\}$。\n\n#### 特征问题的类\n\n定义 $C[j]$ 为换 $j$ 分钱所需的最少硬币数。如果我们知道换 $j$ 分钱的最优方案使用了面值为\
  \ $di$ 的硬币，那么我们有：\n\n$C[j] = 1+C[j - di]$\n\n#### 递归定义最优解的值\n\n![](img/0290.gif)\n\
  \n#### 自底向上的方式计算值\n\n```\nAlgorithm CoinExchange(n, d[], k)\n  C[0] = 0\n  for j\
  \ = 1 to n do\n    C[j] = infinite\n    for i = 1 to k do\n      if j >= di and\
  \ 1+C[j - di] < C[j] then\n        C[j] = 1+C[j - di]\n        b[j] = di\n```\n\n\
  ```\nAlgorithm PrintLCS(b[], i, j)\n  if i = 0\n    return\n  if j = 0\n    return\n\
  \  if b[j] > 0\n    print b[j]\n    PrintLCS(b[], i, j - 1)\n  else\n    PrintLCS(b[],\
  \ i - 1, j)\n```\n\n\n\n然而，让我们假设这个锁是一个旧锁，它不仅在正确的数字上产生相同的声音，在其他某些数字上也是如此。因此，当你试图寻找第一圈转环的数字时，它可能会在多个时刻产生声音。所以，此时你并没有直接走向解决方案，而是需要测试各种状态，如果这些状态不是你正在寻找的解决方案，你就需要一次一次回溯一步，寻找下一个解决方案。当然，这种对咔哒声的智能/启发式判断将帮助你更快地达到目标。这些函数被称为\
  \ `Pruning function`（剪枝函数）或 `bounding functions`（边界函数）。\n\n# 回溯算法问题\n\n### 八皇后问题\n\
  \n给定 N 个皇后，你需要将它们排列在 NxN 的棋盘上，使得任意两个皇后都不能互相攻击。\n\n```java\npublic static boolean\
  \ Feasible(int[] Q, int k) {\n    for (int i = 0; i < k; i++) {\n        if (Q[k]\
  \ == Q[i] || Math.abs(Q[i] - Q[k]) == Math.abs(i - k)) {\n            return false;\n\
  \        }\n    }\n    return true;\n}\n\npublic static void NQueens(int[] Q, int\
  \ k, int n) {\n    if (k == n) {\n        print(Q, n);\n        return;\n    }\n\
  \    for (int i = 0; i < n; i++) {\n        Q[k] = i;\n        if (Feasible(Q, k))\
  \ {\n            NQueens(Q, k + 1, n);\n        }\n    }\n}\n\npublic static void\
  \ main(String[] args) {\n    int[] Q = new int[8];\n    NQueens(Q, 0, 8);\n}\n```\n\
  \n### 汉诺塔\n\n汉诺塔游戏需要将盘从一根柱子移动到另一根柱子，使得任何大盘不能放在任何小盘之上。\n\n这是编程世界中一个著名的谜；它的起源可以追溯到印度。“关于\
  \ Kashi Viswanathan 的一座印度寺庙有一个传说，里面有一个大房间，有三根古老的柱子，周围环绕着 64 个金盘。婆门祭司执行着古代印度教预言的指令，自时间之初就按照宇宙创造者梵那不可改变的规则在移动这些盘子。因此，这个谜也被称为梵之塔谜。根据预言，当这个谜的最后一次移动完成时，世界将会毁灭。”\
  \ ;)\n\n![](img/00293.jpeg)\n\n```java\npublic static void TOHUtil(int num, char\
  \ from, char to, char temp) {\n    if (num < 1) {\n        return;\n    }\n    TOHUtil(num\
  \ - 1, from, temp, to);\n    System.out.println(\"Move disk \" + num + \" from peg\
  \ \" + from + \" to peg \" + to);\n    TOHUtil(num - 1, temp, to, from);\n}\n\n\
  public static void TowersOfHanoi(int num) {\n    System.out.println(\"The sequence\
  \ of moves involved in the Tower of Hanoi are :\");\n    TOHUtil(num, 'A', 'C',\
  \ 'B');\n}\n\npublic static void main(String[] args) {\n    TowersOfHanoi(3);\n\
  }\n```\n\n# 第 20 章：复杂度理论\n\n## 引言\n\n计算复杂度是衡量解决某个问题需要多少资源的标准。\n\n资源有两种类型：\n\n1.\
