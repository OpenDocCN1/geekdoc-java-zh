  \n## 哈希中的问题\n\n### 异字母位词求解器\n\n**问题:** 查找两个字符串是否为异字母位词，异字母位词是通过重新排列另一个单词或短语的字母形成的单词或短语。\n\
  \n**示例 1.1:** 如果两个单词的大小相同且字符相同，则它们是异字母位词。\n\n```java\npublic static boolean isAnagram(char[]\
  \ str1, char[] str2) {\n    int size1 = str1.length;\n    int size2 = str2.length;\n\
  \    if (size1 != size2)\n        return false;\n    HashMap<Character, Integer>\
  \ hm = new HashMap<Character, Integer>();\n    for (char ch : str1) {\n        if\
  \ (hm.containsKey(ch))\n            hm.put(ch, hm.get(ch) + 1);\n        else\n\
  \            hm.put(ch, 1);\n    }\n    for (char ch : str2) {\n        if (hm.containsKey(ch)\
  \ == false || hm.get(ch) == 0)\n            return false;\n        else\n      \
  \      hm.put(ch, hm.get(ch) - 1);\n    }\n    return true;\n}\n```\n\n### 去重\n\n\
  **问题:** 移除数组中的重复数字。\n\n**解:** 我们可以使用另一个数组来解决这个问题。在下面的示例中，使用了哈希表。\n\n**示例 11.12:**\n\
  \n```java\npublic static String removeDuplicate(char[] str) {\n    HashSet<Character>\
  \ hs = new HashSet<Character>();\n    String out = new String();\n    for (char\
  \ ch : str) {\n        if (hs.contains(ch) == false) {\n            out += ch;\n\
  \            hs.add(ch);\n        }\n    }\n    return out;\n}\n```\n\n### 查找缺失\n\
  \n**问题:** 给定一个数组，你需要找到数组中缺失的数字。\n\n**示例 1.13:**\n\n```java\npublic static int findMissing(int[]\
  \ arr, int start, int end) {\n    HashSet<Integer> hs = new HashSet<Integer>();\n\
  \    for (int i : arr) {\n        hs.add(i);\n    }\n    for (int curr = start;\
  \ curr <= end; curr++) {\n        if (hs.contains(curr) == false)\n            return\
  \ curr;\n    }\n    return Integer_VALUE;\n}\n```\n**分析:** 数组中的所有元素都添加到哈希表中。缺失元素通过搜索找到。\n\
  \n### 打印重复\n\n**问题:** 给定一个整数数组，打印数组中重复的内容。\n\n**示例 1.14:**\n\n```java\npublic static\
  \ void printRepeating(int[] arr) {\n    HashSet<Integer> hs = new HashSet<Integer>();\n\
  \    System.out.print(\"Repeating elements are:\");\n    for (int val : arr) {\n\
  \        if (hs.contains(val))\n            System.out.print(\" \" + val);\n   \
  \     else\n            hs.add(val);\n    }\n}\n```\n**分析:** 所有的值都添加到哈希表中，当某个值已经在哈希表中时，它就是重复值。\n\
  \n### 打印首次重复\n\n**问题:** 这与上面的问题相同，但这里我们需要打印第一个重复的数字。需要小心找到第一个重复的数字。它应该是那个重复的数字。例如，1,\
  \ 2, 3, 2, 1。答案应该是 1，因为它是第一个重复的数字。\n\n**示例 11.15:**\n\n```java\npublic static void\
  \ printFirstRepeating(int[] arr) {\n    int i;\n    int size = arr.length;\n   \
  \ HashSet<Integer> hs = new HashSet<Integer>();\n    int firstRepeating = Integer_VALUE;\n\
  \    for (i = size - 1; i >= 0; i--) {\n        if (hs.contains(arr[i])) {\n   \
  \         firstRepeating = arr[i];\n        }\n        hs.add(arr[i]);\n    }\n\
  }\n```\n\n\n\n\n\n```\nSystem.out.println(\"First Repeating number is : \" + firstRepeating);\n\
  }\n```**分析：** 将值添加到计数映射（count map）中，重复的数字将会有多个计数。现在再次遍历数组，并检查计数是否大于 1。因此，那就是第一个重复的数字。\n\
