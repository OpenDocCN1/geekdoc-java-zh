  \ `ABCDE12345` 转换为 `A1B2C3D4E5`。\n\n**示例 13.25：**\n\n```java\npublic static void\
  \ shuffle(String str) {\n      char[] ar = str.toCharArray();\n      int n = ar.length\
  \ / 2;\n      int count = 0;\n      int k = 1;\n      char temp = '\\0';\n     \
  \ for (int i = 1; i < n; i = i + 2) {\n          temp = ar[i];\n          k = i;\n\
  \          do {\n              k = (2 * k) % (2 * n - 1);\n              temp ^=\
  \ ar[k] ^= ar[k];\n              count++;\n          } while (i != k);\n       \
  \   if (count == (2 * n - 2)) {\n              break;\n          }\n      }\n}\n\
  public static void main() {\n    shuffle(\"ABCDE12345\");\n}\n```\n\n时间复杂度：`O(n²)`，其中\
  \ `n` 是字符串中的字符数。\n\n### 二进制进制加法\n\n**问题：** 给定两个二进制字符串，找到这些二进制字符串的和。\n\n**示例 13.26：**\n\
  \n```java\npublic static char[] addBinary(String firstStr, String secondStr) {\n\
  \      char[] first = firstStr.toCharArray();\n      char[] second = secondStr.toCharArray();\n\
  \      int size1 = first.length;\n      int size2 = second.length;\n      int totalIndex;\n\
  \      char[] total;\n      if (size1 > size2) {\n          total = new char[size1\
  \ + 2];\n          totalIndex = size1;\n      } else {\n          total = new char[size2\
  \ + 2];\n          totalIndex = size2;\n      }\n      total[totalIndex + 1] = '\\\
  0';\n      int carry = 0;\n      size1--;\n      size2--;\n      while (size1 >=\
  \ 0 || size2 >= 0) {\n          int firstValue = (size1 < 0) ? 0 : first[size1]\
  \ - '0';\n          int secondValue = (size2 < 0) ? 0 : second[size2] - '0';\n \
  \         int sum = firstValue + secondValue + carry;\n          carry = sum >>\
  \ 1;\n          sum = sum & 1;\n          total[totalIndex] = (sum == 0) ? '0' :\
  \ '1';\n          totalIndex--;\n          size1--;\n          size2--;\n      }\n\
  \      total[totalIndex] = (carry == 0) ? '0' : '1';\n      return total;\n}\npublic\
  \ static void main() {\n    System.out.println(addBinary(\"1000\", \"11111111\"\
  ));\n}\n```\n\n时间复杂度：`O(n)`，其中 `n` 是较大输入字符串的字符数。\n\n## 练习\n\n1. 在给字符串中，找到不包含字符的最长子串。\n\
