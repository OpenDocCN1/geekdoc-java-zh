  md: 'In general, the steps for downloading (clone) a Github repository are:

    **Step 1.** Download and install the Git for your OS, if not already.

    **Step 2.** Open terminal (macOS/Linux) or Git Bash (Windows).

    **Step 3.** Run the following commands:


    ```

    # Download the repository

    git clone https://github.com/udacity/nd035-c1-spring-boot-basics-project-starter.git

    # Go inside the downloaded repository nd035-c1-spring-boot-basics-project-starter

    # Go to the project starter codec starter/cloudstorage/

    ```


    Once downloaded, you can import the downloaded repository (or a subfolder) in
    the IntelliJ IDE to have the starter code to work on.


    Remember, Github does not support downloading any subfolder from a Github repository.
    Instead, Github allows us to download the entire repository.


    # Scenario


    Your tech lead already designed a database schema for the project and has added
    it to the src/main/resources directory. That means you don''t have to design the
    database, only develop the Java code to interact with it.


    Your tech lead also created some HTML templates from the design team''s website
    mockups, and they placed them in the src/main/resources/templates folder. These
    are static pages right now, and you have to configure them with Thymeleaf to add
    functionality and real data from the server you. You may also have to change them
    to support testing the application.


    You can download the starter code and open it as a Maven project in IntelliJ.


    # Requirements and Roadmap


    Your tech lead is excited to work with you and has laid a development roadmap
    with requirements and milestones. They tell you that there are three layers of
    the application you need to implement:


    +   1. The back-end with Spring Boot

    2. The front-end with Thymeleaf

    3. Application tests with Selenium


    # The Back-End'
