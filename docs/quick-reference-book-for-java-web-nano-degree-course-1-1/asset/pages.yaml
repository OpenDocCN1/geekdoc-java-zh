    # What Data Should be Stored in a Database?


    +   - Data shared across multiple user sessions, like a product inventory


    +   - Persistent data that should remain accessible after being logged out, like
    user profile or shopping cart


    # How Should Data be Structured?


    +   - Intuitively. Most data can be stored in a similar format to the data objects
    that represent it in Java, with attributes matching column names.


    +   - Diffing. Some data must be stored differently for security reasons, such
    as encrypted passwords. Other data may require a different format for efficient
    storage, such as large files.


    # Thinking about Security


    The main question to ask is: "What pages can a user access?"


    +   - User-Specific Data


    +   - Generally Accessible (Unsecured) Data


    +   - May Vary by Domain


