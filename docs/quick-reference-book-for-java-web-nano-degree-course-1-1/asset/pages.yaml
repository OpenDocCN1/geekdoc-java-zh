  md: '# Onion Architecture


    The above shows the basic structure of Onion Architecture. External requests must
    first pass through a layer of controllers or handlers whose only purpose is to
    handle these external requests. These controllers then use the next layer of the
    onion, to process the actions or actions triggered by the request. The services,
    in turn, use each other and the next layer, repositories and data access, to persist
    the results of the actions triggered by the request.


    # Key Terms


    +   * Onion Architecture: An architectural pattern in which an application is
    separated into nested layers. For a request to be processed by the application,
    it must first travel through an outer layer of external interfaces and controllers,
    then through a middle layer of services and business logic, and finally through
    a persistence layer of data access objects.

    * Application Component: In Spring, this is any @Component-annotated class that
    is instantiated by Spring and placed in Spring''s application context. Architecturally
    speaking, this is a logical unit of application - a single-purpose library or
    object that solves a particular problem application focuses.

    * Service: In Spring, this is any @Service-annotated class, handled identically
    to @Component-annotated class. The difference between the two semantics - a component
    is the most generic type of bean, and can be any kind of shared application structure.
    A service is specifically a collection of library methods that manage one aspect
    of an application''s business logic. A UserService would expose high-level actions
    related to the users of an application, and an AuthenticationService would expose
    the middle layer of onion architecture, and should contain the bulk of an application''s
    business logic.

    * Repository: In Spring, any @Repository-annotated class is treated identically
    to @Component-annotated one, but as with @Service, the semantics are different.
    In an onion architecture, repositories the inner layer - each repository should
    act like an interface to a specific set of stored or persistent data. For example,
    a UserRepository would expose an interface capable create/read/update/delete and
    query operations on users table of the database.


