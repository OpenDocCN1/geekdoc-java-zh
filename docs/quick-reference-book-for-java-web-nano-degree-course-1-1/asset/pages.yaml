  md: 'VIDEO FOUR:


    # MVC and You


    MVC is an acronym that stands for Model-View-Controller, and it''s a common software
    pattern for user interface design. Traditionally, it divides the roles of components
    in an app into three layers:


    +   - the Model, which is responsible for maintaining the state of an application,

    - the View, which is responsible for displaying the UI to the user,

    - and the Controller, which is responsible for processing user actions (sent from
    the View) to update the Model, and for forwarding those updates back to the View


    MVC is an abstract pattern, every library implements it differently. Spring MVC
    is built around the browser as a platform, and it organizes these roles like this:


    +   - HTML templates are the views - each represents a specific screen or screen
    component that the user is.

    - Spring beans are the controllers - specifically, Spring MVC gives an @Controller
    annotation that we can use to register our beans as controllers. Spring bean controllers
    as specialized components can define methods to handle specific user requests.
    These methods are responsible for choosing the HTML template that is generated
    in response, as well as populating the Model object for that template.

    - Model objects are the models - every controller method can take an optional
    Model argument, and by defining the data inside of it, the controller can read-submitted
    data and populate the template with the changes. Think of the Model class as simple
    data-transfer object: something that stores various bits of data to keep that
    up, and can be passed between the browser, the template engine, and the controller
    to facilitate the transfer of data between the user and the application.


    # Let''s Get Coding!


    > You can find the lecture sample code from the video above here.


    In order to start Spring MVC, we need two main elements: an HTML template to define
    the user interface, and a Spring MVC @Controller-annotated bean to serve that
    template and populate it with data.


    In our example far, our "template" is actually a static HTML page that displays
    a greeting. The main thing about templates so is to place them in the right folder
    - src/main/resources/templates under the project root directory. When we choose
    a template in our controller, we do so by specifying the template name we want
    to load - home.html template in the example is simply referred to as "home". This
    will only work if your templates are in the right folder, always double check!


    Set up a basic controller to serve this template, we created a new class called
    HomeController and annotated it with @Controller. As you may remember from the
    last lesson, this registers the class as a Spring bean and makes it eligible for'
