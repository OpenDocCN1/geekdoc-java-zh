  md: "On the Spring side of things, we need to define a POJO to hold the form data.\
    \ We'll look at code details in the next video, but by defining this POJO we can\
    \ pre-fill the form by setting its fields and adding it as a Model attribute when\
    \ first rendering the template, and Spring can automatically extract the request\
    \ data into POJO when the form is submitted. Let's see how that works!\n\n# User-Inputted\
    \ Data\n\nFor the full lecture sample code in the previous video, click here\n\
    \nIn this video, we looked at the HTML tags and Thymeleaf attribute we need to\
    \ set up a form for the user to fill and submit to server. Here is the template\
    \ code:\n\n```\n<form th:object=\"${newMessage}\" th:action=\"@{/home}\" action=\"\
    #\" method=\"POST\">\n  <input th:field=\"*{text}\" type=\"text\">\n  <input type=\"\
    submit\"/></form>\n```\n\nWe use the th:object to choose the POJO for form data\
    \ should be added, and the th:actionattribute to choose the URL is always relative\
    \ to the actual server address - we use the # syntax in the latter to tell Thymeleaf\
    \ to make sure the URL doesn't make a difference in our current project, but it's\
    \ good practice when referring to URLs on our server in a Thymeleaf template.\n\
    \nWe also set method=\"POST\" on the form to get the HTTP method of the resulting\
    \ request. This is important. Remember that GET requests contain any custom data\
    \ - we need to use POST for our form data to actually get!\n\nIn order to bind\
    \ the individual form input data fields to the form-backing POJO's fields, we\
    \ need to add the th:field attribute. We also need to use special Thymeleaf expression\
    \ syntax - {}. This allows us to refer to the form-backing POJO using dot syntax\
    \ - th:field=\"*{text}\" in this example is equivalent to th:field=\"${newMessage.text}\"\
    .\n\n# Persisting Data\n\nFor the full sample code from the previous video, click\
    \ here\n\nIn this video, we looked at how to handle user-submitted data from the\
    \ Spring controller side. Here are the finalized controller methods we saw:\n\n\
    ```\n@GetMapping(\"/home\")\npublic String getHomePage(@ModelAttribute(\"newMessage\"\
    )\nMessageForm newMessage, Model model)\nmodel.addAttribute(\"greetings\",\nthis.messageListService.getMessages();\n\
    return \"home\";\n```"
