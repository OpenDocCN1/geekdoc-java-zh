    \ on Testing with JUnit\n\nAssertions are powerful, but what are their limitations?\
    \ Consider a given method that is hard to test. How would you use JUnit and assertions\
    \ to test it? How would the test influence a developer to implement the method?\n\
    \n![](img/3a5769bea53a661ab8e4c8216af739d1_146_0.png)\n\n;\n\nVIDEO 8:\n\n# JUnit\
    \ in Situ\n\nWhen we write tests, it's with the intention to run them and report\
    \ on the results. Test runners like JUnit provide many ways to report the results\
    \ of a test run, but one of the most useful ways is to interact with what is reporting\
    \ through an IDE, like IntelliJ.\n\nThere are three main advantages to running\
    \ JUnit tests from an IDE:\n\n+   - Interactive Reporting: When we run tests in\
    \ an IDE, we can usually inspect the results of each test individually. If an\
    \ assertion fails or an unexpected exception is triggered, the stack trace and\
    \ circumstances will be shown in the details for each test, and clickable links\
