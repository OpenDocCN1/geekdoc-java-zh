    # Lesson Outline


    +   - ORM is the Norm: We introduce ORM, or object-relational-mapping, a software
    pattern that leverages the similarities between Java classes and SQL tables to
    eliminate boilerplate in data access code.

    - MyBatis Mappers: We introduce MyBatis, a dead-simple ORM tool for Java that
