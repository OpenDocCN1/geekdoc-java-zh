    VIDEO 12:SPRING STARTER PACKS


    # Spring Starter Packs


    # Spring Starter Packs Setup


    Spring is a collection of open-source libraries that solve common web development
    problems. How do we get those libraries? In this course, we''ll be using Maven,
    a dependency management tool that lets us define dependencies on open-source libraries
    by their names and version numbers. We define those in a file in our projects
    pom.xml, which Maven reads and downloads the required libraries. We can also have
    our projects inherit dependencies from some base project, which is a feature that
    Spring Boot uses to make setting up a new Spring project easy as pie. We''ll be
    using Spring Initializr, an online project generator, to choose specific dependencies
    to add to new Spring projects.


    Spring Boot is best experienced with the help of Spring Initializr, an official
    project generator. You can use it to configure metadata and build properties of
    a project as well as what dependencies to include. These include:


    +   - Spring Dev Tools: utilities including reloading changed code into a running
    application

    - Spring MVC: web layer libraries that developing server-side web apps

    - Spring Data: a common interface for many different types of database access

    - And more Once you''ve selected your dependencies and chosen your language, build
    tool, and project identifiers, Spring Initializr will generate a zip file that
    includes a ready-to-run server with all of the choices you made reflected in its
    pom.xml file, as well as the package structure.


    # Key Terms


    +   - Maven: A dependency management system and build tool for Java. Provides
    a standardized way to define dependencies between projects and include them in
    the project path.

    - POM: The Project Object Model that Maven uses to represent the dependency and
    build configuration of a project. Usually, this refers to the pom.xml configuration
    file found in a Maven project.'
