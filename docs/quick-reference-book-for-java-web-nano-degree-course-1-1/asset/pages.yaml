  md: '# Key Terms


    +   - **Endpoints**: An endpoint is the address at which a client can reach a
    specific part of a server''s functionality. Usually, this is a URL path, the `/words/and/slashes`
    that follow the domain of a URL, like `.com` or `.org`.


    +   - **Servlet**: A class defined as part of the Java: Enterprise Edition specification.
    Provides an implementable interface for web server request processing, defining
    a `service` method that the server invokes on an instantiated servlet to handle
    a `ServletRequest` and `ServletResponse` object for an incoming request. The servlet
    also defines lifecycle methods for the server to invoke when initializing or destroying
    a servlet.


    +   - JAR: A Java Archive file, which stores `.class` files in a folder hierarchy
    that matches the code''s package structure. Includes an optional manifest file.


    +   - WAR: A variation of the JAR for web applications, which optionally includes
    web resources like HTML files and configuration files like `web.xml` for servlet
    registration/mapping.


