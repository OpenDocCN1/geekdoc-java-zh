  md: "# The Test-Driven Development Lifecycle\n\nThe figure above shows the test-driven\
    \ development lifecycle. First, there is an idea for a new feature. That feature\
    \ idea is turned into a series of user stories, which are then turned into tests,\
    \ which fail because the feature does not exist yet. The developers then work\
    \ on the feature's code requirements until all of the tests pass, and the cycle\
    \ begins again.\n\nTesting is an important and highly desired part of the software\
    \ development process. In a world where uptime and user retention means everything,\
    \ it's important to validate that your application actually does what it's supposed\
    \ to do before it goes into production.\n\nThe standard accepted way to enforce\
    \ this is by adopting a test-driven development lifecycle, or TDD. In this model,\
    \ the \"red green\" philosophy is dominant - tests should be written before the\
    \ feature to be tested, meaning that they start off failing - aka, the tests \"\
    red\". Then, as the feature is implemented, one test after another should start\
    \ to pass - aka, become \"green\".\n\nTo facilitate this approach, it's useful\
    \ to have a standard way to describe features or requirements to be tested. For\
    \ this, we turn to the concept of a \"user story.\" A user story describes the\
    \ functionality a feature should have from the perspective of a user interacting\
    \ with it. Typically, the format of a user story is:\n\n**As a user, I can take\
    \ some action in order to achieve some goal.**\n\nOften a feature will be broken\
    \ up into many user stories, each of which should correspond to at least one test\
    \ to be implemented for that feature. If all the tests pass, it means that all\
    \ of the user stories are successfully implemented, and the feature is complete.\n\
    \n# Key Terms\n\n+   * **Test Driven Development**: a software development methodology\
    \ that emphasizes writing tests before the code to be tested. This gives developers\
    \ a roadmap to success - once all the tests are passing, the feature is complete!\n\
    * **User Story**: User stories are short sentences derived from feature requirements\
    \ in the format of As a user, I can in order to . These are used to create tests\
    \ to verify the components of a feature.\n\n# Quiz Question\n\nWhich of the following\
    \ requirements are testable?\n\n+   * \n*\n*"
