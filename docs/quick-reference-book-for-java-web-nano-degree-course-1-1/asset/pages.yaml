  md: '# How Spring Processes an IoC Configuration.


    The figure above shows an example of how Spring processes an IoC configuration.

    The general steps are:


    +   - A bean without dependencies is initialized first and placed within the application
    context.

    - A service is instantiated by Spring, and the first bean is retrieved from the
    context to be injected as a dependency, after which Spring places the service
    in the application context.

    - Finally, another bean is instantiated by Spring, which retrieves the previous
    two components to be injected as dependencies, after which the new bean is placed
    in the context, and the application is fully initialized.


    # Key Terms


    +   - Configuration Files: Project files that configure some part of Spring''s
    operation. Some are embedded in Java classes, like we just discussed, and .properties,.yaml,
    and .xml files that we will discuss later. Some of these configure the IoC context,
    like the ones we use, and others configure abstract abstractions of Spring''s
    system.

    - Component Annotations: Component annotations that identify components for Spring
    to manage. @Bean and @Configuration are examples from the most recent video, and
    in the next section we will discuss @Component and @Service as well.

    - Application Context: Spring''s application context is just a data structure
    that holds all application component instances. It can be queried to gain access
    to a specific component at runtime, and it Spring uses to resolve dependencies.

    - Beans: "Beans" is Spring''s name for generic components, and include any value
    Spring has stored in the application context. A bean is always either an object
    or primitive value.

    - Closed System: Spring''s application context is a closed system, which means
    that it manages all of the components stored within. It is not possible to instantiate
    a component manually and still link with Spring - it will never be aware of the
    components inside Spring''s application context, and vice versa.

    - @SpringBootApplication: An annotation on the main application class of Spring
    Boot project. It serves as an ally of other annotations, @Configuration, @EnableAutoConfiguration,
    and @ComponentScan

    - @Configuration: A class annotated with @Configuration is instantiated and managed
    by Spring as a component, but also as a factory. Any methods of the class that
    are annotated with @Bean are used to create new beans to add to the application
    context.

    - @Bean: A method annotated with @Bean of a configuration class will be used by
    Spring to generate a bean of the method''s return type. This is that the developer
    can manually configure the bean to be included in the application context.

    - @EnableAutoConfiguration: A class tells Spring to try automatically match beans
    based on priority. This reduces the need for boilerplate code explicitly identifying
    individual beans as dependencies.

    - @Primary: This annotation distinguishes the annotated bean as the default dependency
    of its type. This is used to resolve conflicts that arise from multiple bean definitions
    of the same type when same configuration is enabled.

    - @Qualifier: This annotation distinguishes the annotated bean or dependency declaration
    as a qualified bean or dependency. Qualified beans are considered for unqualified
    dependencies, but only matching beans are considered for qualified dependencies.
    You can read more about here.'
