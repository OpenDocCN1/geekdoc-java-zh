    newMessage\")\nMessageForm messageForm, Model model) {\n    messageList.addMessage(messageForm.getText());\n\
    \    model.addAttribute(\"greetings\",\n    messageList.getMessages());\n\\  \
    \  messageForm.setText(\"\");\n    return \"home\";\n}\n```\n\nThe key elements\
    \ to focus on are the new arguments to each of these methods - the MessageForm\
    \ class is a POJO specifically designed to handle the form data we defined in\
    \ the previous video.\n\nFor the GET request handling method, we declare the MessageForm\
    \ argument to ensure that the object exists and is added to the Model by Spring\
    \ automatically. This is necessary, because Thymeleaf needs an object with the\
    \ newMessage to be present in the model to render properly, even if there's not\
    \ data in the object yet.\n\nFor the POST request handling method, we declare\
    \ the MessageForm argument to tell Spring that it should look for data that matches\
    \ in the body of the request's handling. Spring will then automatically extract\
    \ the data and put it in a MessageForm object before calling our method, passing\
    \ it to us so we can use the data as we see fit.\n\nIn both cases, we're annotating\
    \ this argument with @ModelAttribute. This allows us to specify that Spring should\
    \ add the object to our Model before allowing Thymeleaf to render the template.\
    \ That means we don't have to add it manually! Pretty handy.\n\n# Key Terms\n\n\
    +   - Form-Backing Object: This is a term used by Spring MVC and Thymeleaf to\
    \ mean an object that represents the data contained in a form. On the Spring side,\
    \ this is usually an additional argument to the relevant Controller method, and\
    \ on the Thymeleaf side, this is referred to in the th:object attribute over the\
    \ form.\n\n# Further Research\n\n+   - Official Spring MVC docs with some discussion\
    \ of form-backing objects.\n- Official Thymeleaf docs for writing forms and integrating\
