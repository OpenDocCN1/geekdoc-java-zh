    # Glossary


    +   - **Test Driven Development**: a software development methodology that emphasizes
    writing tests before the code to be tested. This gives developers a roadmap to
    success - once all the tests are passing, the feature is complete!

    - **User Story**: assertions are short sentences derived from feature requirements
    in the format of As a user, I can in order to. These are used to create tests
    to verify the components of a feature.

    - **Unit Tests**: A unit test verifies the smallest unit of a computational process.
    That might mean a test of a single method, or a single component in an application.

    - **Invariants**: An invariant is a law of computation, something that shouldn''t
    change despite circumstances. For example, adding 0 to a number should always
    result in the original number, and by dividing 0 should result in an error.

    - **Integration Tests**: Integration tests are intended to validate the operation
    of multiple application components as they interact with each other - integrate
    with one another.

    - **Assertion**: an assertion, in the context of JUnit, is we call to check our
    assumptions about the behavior of the unit test. If our assumptions are correct,
    the assertion returns and the test continues. If they''re false, the assertion
    throws a special exception failure report, and the test method halts execution.

    - **Interactive Reporting**: When we run tests in an IDE, we can usually inspect
    the results of each individually. If an assertion fails or an unexpected exception
    is triggered, the stack trace and circumstances will be shown in the details for
    each test, and clickable links in the results help you navigate problems in your
    code.

    - **Interactive Debugging**: When a pernicious problem persists, it can often
    be helpful to step through the code''s execution line-by-line to inspect both
    the control flow and the values in memory used by the program. This is called
    debugging, and while it''s technically possible to do outside of an IDE, IDEs
    like IntelliJ provide many useful tools for making the process painless.

    - **Code Reports**: When we code in an IDE like IntelliJ, we can choose to have
    the IDE track which of our code were written, and how many times. This can be
    useful when trying to track down which branch of a condition is isnt being reached,
    as well as determining how much the entire base is covered by the currently-implemented
    tests.

    - **Web Driver**: In order for Selenium to assume control of a browser, it needs
    a program to interface with the browser''s API. This program is called a web driver,
    and there are different drivers for each browser.

    - **Page Object**: a special POJO variant that can be defined for Selenium. A
    Page Object should have @FindBy-annotated fields that represent the key HTML elements
    under test, and should help members define high-level utilities and user actions
    on the page under.


