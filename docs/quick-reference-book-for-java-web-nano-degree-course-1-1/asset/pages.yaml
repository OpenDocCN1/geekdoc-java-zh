  md: 'It can share heavyweight or universal components with each of its applications.


    # VIDEO 6


    # Java Servlets


    The Servlet class is the main connection between the apps you develop and the
    application server they run on. By extending Servlet, you can create endpoints
    that handle incoming requests in a way specific to your application needs, and
    can map request URLs to specialized servlets by adding entries to a web.xml file.
    The app server uses this configuration to instantiate and manage your servlets.
    It interacts with each through three standard methods, init, service, and destroy:


    +   - service is where requests are handled, and the server will call this method
    when a request is routed to the servlet it''s called on.

    - init is where initialization of the servlet is handled, and the server will
    call this method directly after instantiating the servlet.

    - destroy is where servlet resource cleanup is handled, and is called directly
    before the server terminates the servlet instance.'
