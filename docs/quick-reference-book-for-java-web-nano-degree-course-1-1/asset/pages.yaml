  md: 'Assertions are the static methods defined in the Assertion class. See the list
    of assertions here, and an example on how to use assertions in a unit test here.


    For example, assertEquals(int expected, int actual) is an assertion method you
    can call in your test method to assert the actual and expected integer values
    are equal. Let''s see an example implementation of annotations and assertions
    next.


    # Testing with JUnit - Annotations and Assertions


    For the full lecture sample code from the previous video, click here


    In the previous video, we looked at some JUnit tests to learn more about JUnit''s
    annotations and assertions. Some key takeaways:


    +   - In a Maven project, it is extremely important to make sure your JUnit test
    classes are in the right directory. Maven expects tests to be in the src/test/java
    directory. Always double check

    - JUnit''s assertions are all static methods on the org.junit.jupiter.api.Assertions
    class, so to use them you need to statically import the methods you need

    - The most-used assertion is assertEquals, which can be used to check if the result
    of some action is the expected result

    - Another common assertion is assertThrows, which is used to check if a given
    piece of code does throw an exception. This can be useful to check so-called negative
    test cases, where we want to make sure our application fails in the correct way.
    This assertion uses Java 8''s lambda expression syntax to capture a piece of code
    to test - if you''re not familiar with this syntax, you can find more information
    about it in the further research section.

    - @BeforeEach annotated methods are particularly useful for initializing some
    data that needs to be in the same state for every test. For example in the video,
    we used this to ensure that a list under test has the same values at the beginning
    of each test.'
