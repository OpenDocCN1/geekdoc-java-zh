    # Basic User Flow


    You can find the lecture sample code from the video above here.


    In order to actually render dynamic data in a template, we again need to approach
    it

    from both the template and the controller.


    In the template, we need add Thymeleaf attributes to our HTML. In our example
    so

    far, we added the th:text attribute to the heading we want to be dynamic, like
    so:


    ```

    <h1 th:text="${welcomeMessage}">Hello, homepage!</h1>

    ```


    This attribute will Thymeleaf to replace the text inside the Hl tag (Hello,

    page!) with a string generated by evaluating the expression in the th:

    attribute (${welcomeMessage}). The syntax of this expression is fairly simple:
    the $$\icates an expression to evaluate, and by using a name like welcomeMessage
    inside

    of it, we are telling Thymeleaf to look up a value in the model supplied for this

    template with the same name.


    For that to work, though, we need to add a named welcomeMessage to the

    model and we do that in the controller like so:


    ```

    @RequestMapping("/home")

    public String getHomePage(Model model)

    { model.addAttribute("welcomeMessage", "Hi

    Hello"); return "home";

    }

    ```


    First we need add to the controller - the Model object you see

    above. This is a special class that Spring MVC will use Thymeleaf to render the

    template, and we can set various attributes on to added values. As you can see,

    we are adding a value of "Hi Hello" to the model with the name "welcomeMessage"

    - which is exactly the name we''re referencing in our template! Now when we render
    the

    template, the message Hi Hello will appear on the web page instead of Hello,

    homepage!.


    Nice!'
