  md: '+   - Business Logic: Code relates exclusively to an application''s conceptual
    model and featureset. Contrast with utility code database, HTTP request parsing,
    etc.

    - Persistent Components: Java Objects that Spring maintains over time; they''re
    persistent because they''re created and maintained for as long as the application
    needs them to.

    - Dependency Injection: A mechanism by which loc may be implemented. Components
    are configured with other components, which are injected at runtime. Injection
    is quite literal - a component''s dependencies are usually expressed as annotated
    fields in the class, and Spring will populate those with the dependencies at runtime.

    - Separation of Concerns: A good organization emphasizes single-purpose components.
    In Java and Spring, this means methods related to a specific problem domain in
    the same class, for the sake of maintainability and reducing code reuse.

    - Data Types: Components represent POJOs (plain-old-java-objects), Data Types
    are classes in application designed purely to hold data like users, profiles,
    or anything else application might manage. These objects are helpful for us to
    maintain a good conceptual model of an application, and are created and accessed
    frequently during execution.

    - Components: Components are instance managed by Spring. They usually resemble
    more than typical objects, with methods that must be called to perform specific
    actions. Components are only created when Spring is configured to create them,
    at server startup.

    - Configuration Files: Projects that configure some part of Spring''s operation.
    Some are embedded in java classes like we discussed, and others are .properties,
    .yaml, and .xml files that we will discuss later. Some of these configure the
    IOC context, the ones we discussed, and others more abstract pieces of Spring''s
    system.

    - Component Annotations: Component annotations that identify components for Spring
    to manage. @Bean and @Configuration are examples from the most recent ones, and
    in the next section we''ll discuss @Component and @Service as well.

    - Application Context: Spring''s application context is a giant data structure
    that holds all component instances. It can be queried to gain access to a specified
    component at runtime, and is what Spring uses to resolve dependencies.

    - Beans: "Bean" is Spring''s name for generic application components, and include
    any value Spring has stored in the application context. A bean is always either
    an object or primitive value.

    - Closed System: Spring''s application context is a closed system, which means
    that it manages all of the components within it. It is not possible to instantiate
    a component manually and still link it with Spring - it will never be aware of
    Spring''s application context, and vice versa.

    @SpringBootApplication: An annotation on the main application class of a Spring
    project that serves as one of three other annotations, @Configuration, @EnableAutoConfiguration,
    and @ComponentScan

    @Configuration: A class annotated with @Configuration is instantiated and managed
    by Spring, but also as a bean factory. The methods of the configuration class
    that are annotated with @Bean are used to create new beans to the application
    context

    @Bean: A method annotated with @Bean inside of a configuration class will be used
    by Spring to generate a bean of the method''s return type. This means that the
    developer can manually configure beans to be included in the application context.

    @EnableAutoConfiguration: A class annotated with @EnableAutoConfiguration tells
    Spring to automatically match beans based on primary type. This reduces the need
    for boilerplate code explicitly identifying individual beans as dependencies.

    @Primary: This annotation distinguishes the annotated bean as the default dependency
    of its type. This is used to resolve conflicts that arise from having multiple
    bean definitions of the same type when auto configuration is enabled.'
