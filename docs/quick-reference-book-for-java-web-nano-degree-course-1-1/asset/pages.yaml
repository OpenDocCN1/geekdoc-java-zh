    \ to use. Thymeleaf scans the template to find dynamic data expressions and resolves\
    \ the variables in expressions using the model. Some dynamic data expressions\
    \ result in iterated or conditional rendering in addition to more typical text\
    \ replacement.\n\n# Key Terms\n\n+   * User Action: Broadly, a user action is\
    \ simply some specific action a user can take, provided by the user interface\
