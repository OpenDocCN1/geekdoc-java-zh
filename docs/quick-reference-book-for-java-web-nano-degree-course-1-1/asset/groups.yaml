    # 术语表


    - HTTP 请求/响应：HTTP（或超文本传输协议）是一种用于 Web 上的程序之间通信的二进制数据格式。它可以被分解为两种基本消息类型：请求（requests）和响应（responses）。客户端向服务器发送请求，服务器返回请求的内容。在此处阅读更多关于该协议的内容。

    - HTTP GET 和 POST：每个 HTTP 都有一个重要的标头，决定了其方法。GET 和 POST 是最常用的方法，GET 请求从服务器获取数据；POST
    请求请求向服务器“发布”新数据——这通常会在服务器数据上执行某些操作，例如搜索术语、发布更新或向服务器添加新数据。

    - HTTP: 文本传输协议。一种二进制协议，最初定义了在互联网上请求和发送 HTTP 的机制。

    - Web 服务器：一种监听并响应互联网上 HTTP 请求的程序。

    - 应用服务器：一种处理其他应用程序的程序，将传入的请求转发给相应的应用程序进行过滤。提供对资源的共享访问和多线程支持。

    - 可插拔架构（Pluggable Architecture）：可插拔架构指的是任何可以添加、替换和移除部分内容的软件。这通常通过“可插拔组件”的通用接口来实现。有时架构可以在运行时替换组件，如应用服务器中的
    Servlets 所示。

    - 线程/多线程（Threads/Threading）：这些术语源于并发，多线程是并行运行多个线程。这有点复杂，因为你的 CPU 具有有限的物理核心可以并行处理指令，而你可以拥有的线程数量可以超过你的计算机核心数，但那是另一个的话题了！

    - 端点（Endpoints）：端点是客户端运行时访问服务器服务特定部分的地址，例如 URL 域名后续的 `/words/and/slashes`。

    - Servlet：定义为 Java 企业版一部分的类。它为服务器请求处理提供了一个可实现的接口，定义了服务器在 servlet 实例上调用的方法，以处理传入请求的
    ServletRequest 和 ServletResponse 对象。servlet 还定义了生命周期方法，供服务器在初始化或销毁 servlet 时调用。

    - JAR：归档文件，在与包结构匹配的文件夹层次中存储编译后的 .class 文件。包含一个可选的清单文件（manifest file）。

    - WAR：JAR 的 Web 应用程序变体，可选包含 Web 资源（如 HTML 文件）和用于 servlet 注册/映射的配置文件（如 web.xml）。

    - IoC：控制反转（Inversion of Control），将库设计为应用程序运行器的实践。允许开发者专注于应用程序特定的逻辑，并依赖 IoC 容器将组件连接在一起，消除了大量的模板代码并鼓励关注点的清晰分离。

    - Maven：一种用于 Java 的依赖管理系统和项目构建工具。提供了一种标准化方法来定义项目之间的依赖并将将其包含在项目构建路径中。

    - POM：项目对象模型（Project Object Model），Maven 用它表示项目的依赖和配置。通常指 Maven 项目中找到 `pom.xml`
    配置文件。

    - 依赖管理系统：任何自动下载和链接外部包到软件开发项目中的工具。如今大多数语言要么内置了这种工具，要么有被社区接受的标准。


    # 视频 19：


    # 课程结论


    # 关键术语


    在本节中，我们学习了：


    - Web 服务器：早期的服务器是单功能程序，可以托管文件、网页并将数据库暴露给外部连接。

