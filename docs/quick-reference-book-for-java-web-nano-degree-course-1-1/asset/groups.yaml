    ## 术语表


    - **Inversion of Control (IoC，控制反转)**：一种设计模式，其中开发者创建独立的应用程序组件并使用框架来连接它们，而不是自己编写集成代码。

    - **Business Logic (业务逻辑)**：代码与应用程序的概念模型和功能集专门相关。与数据库、HTTP 请求解析等工具代码形成对比。

    - **Persistent Components (持久化组件)**：Spring 随时间维护的 Java 对象；它们之所以是持久的，是因为它们在应用程序需要它们的时间内会一直被创建和维护。

    - **Dependency Injection (依赖注入)**：实现 DIC 的机制。组件通过与其他组件一起进行配置，而这些组件在运行时被注入。注入是非常字面上的——组件的依赖通常表示为类中带注解的字段，Spring
    将在运行时填充这些依赖。

    - **Separation of Concerns (关注点分离)**：良好的组织强调单一用途组件。在 Java 和 Spring 中，这意味着为了可维护性和减少代码复用，将与特定领域相关的方法放在同一个类中。

    - **Data Types (数据类型)**：组件代表 POJO（普通 Java 对象），而数据类型是应用程序中纯用于存储数据的类，如用户、配置文件或应用程序可能管理的任何其他内容。这些对象有助于我们维护应用程序良好的概念模型，并在执行过程中频繁地被创建和访问。

    - **Components (组件)**：由 Spring 管理的实例。它们通常比典型的对象更复杂，具有必须调用以执行特定操作的方法。组件只有在 Spring
    配置为创建它们时（在服务器启动时）才会被创建。

    - **Configuration Files (配置文件)**：配置 Spring 运行某些部分的项目。有些嵌入到我们讨论过的 Java 类中，另一些是稍后将讨论的
    `.properties`、`.yaml` 和 `.xml` 文件。其中一些配置了 IOC 上下文（我们讨论过的那些），另一些是 Spring 系统更抽象的部分。

    - **Component Annotations (组件注解)**：用于标识 Spring 管理组件的组件注解。`@Bean` 和 `@Configuration`
    是最新注解的示例，在下一节中我们还将讨论 `@Component` 和 `@Service`。

    - **Application Context (应用上下文)**：Spring 的应用上下文是一个持有所有组件实例的大型数据结构。可以通过查询它在运行时访问指定的组件，它是
    Spring 用来解析依赖的工具。

    - **Beans (大豆)**：“Bean”是 Spring 对通用应用程序组件的称呼，包括 Spring 存储在应用上下文中的任何值。bean 始终是一个对象或原始类型值。

    - **Closed System (闭源系统)**：Spring 的应用上下文是一个闭源系统，意味着它管理内部所有的组件。无法手动实例化组件并将其与 Spring
    链接——它永远不会感知到 Spring 的。

    - **@SpringBootApplication**：配置 Spring 运行某些部分的注解。

    - **@Configuration**：被 `@Configuration` 注解的类在 Spring 中被实例化，用于生成 bean。

    - **@Bean**：被 `@Bean` 注解的方法在配置类中，用于生成 bean，它允许 Spring 存储在应用上下文中的 bean。

    - **@EnableAutoConfiguration (启用自动配置)**：被 `@EnableAutoConfiguration` 注解的类告诉 Spring
    自动配置 bean。

    - **@Primary (主要的)**：此注解在存在多个 bean 定义时区分出默认 bean。

    - **@Qualifier (限定的)**：此注解在存在多个 bean 时区分特定的 bean。

    - **Architecture (架构)**：将应用程序分为若干层的架构模式。为了让请求被处理，它必须首先经过外部接口和控制器层，然后经过中间的服务层，最后通过持久化层。

    - **@ApplicationComponent**：由 Spring 管理的 `@Component` 注解类。从架构上讲，它是应用程序的一个逻辑单元——一个针对特定问题的库或对象。

    - **@Service**：在 Spring 中，任何被 `@Service` 注解的类处理方式都与 `@Component` 相同。它们的区别在于语义——组件是最通用的
    bean 类型，而服务是一种特定的注解结构。服务管理应用程序的一个逻辑方面。例如，UserService 为用户暴露层级操作，而 AuthenticationService
    为注册和验证用户暴露操作。服务代表架构的中间层，并包含应用程序的大部分业务逻辑。

    - **@Repository**：在 Spring 中，任何被 `@Repository` 注解的类处理方式都与 `@Component` 相同。在洋葱体架构中，仓库是内层——每个仓库都应该像一个访问特定存储或持久化数据的接口。例如，UserRepository
    将暴露一个对数据库用户进行增删改查操作的接口。

    - **Properties**：以行分隔的属性对的文件。这种格式被 Java 库和框架使用，并提供了在纯文本文件中指定命名常量的简单方法。

