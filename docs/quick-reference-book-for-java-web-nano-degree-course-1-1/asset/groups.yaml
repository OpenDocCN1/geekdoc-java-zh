  - '[PAGE 133]


    +   * Many to Many: A relationship between two objects in which multiple copies
    of each entity can be related to multiple copies of the other entity.


    +   * @Select, @Insert, @Update, @Delete: Annotations representing SQL statements
    to be executed. Each annotation takes a string for a SQL statement of the corresponding
    type. For example, a @Select annotation takes a string for a SQL SELECT statement.


    +   * @Options: Annotation providing access to switches and configuration options
    for JDBC statements.


    +   * Onion Pattern: Sometimes also called Tiered Architecture, Multi-tiered Architecture,
    or n-tiered architecture. This is a design pattern that separates areas of the
    application into controller, service, and data layers (and sometimes more). User
    flows originate from the controller tier, passes them to the service tier, which
    then reaches a data bean.


    +   * Encryption: Modifying data before storing it, with the intention of using
    another algorithm to return the data to its original form it needs to be used.


    +   * Hashing: Modifying data before storing it with the intention of never returning
    it to its original form. The modified data will be compared to other only modified
    data.


    +   * Salt: random data that is combined with the input string when hashing so
    that the resultant hashed values are unique for each row. This means that two
    users with the same password would not have the same hash in the database.


