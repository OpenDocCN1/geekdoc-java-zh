- md: "\nMyBatis provides a shallow ORM layer over JDBC (Java Database Connectivity).\
    \ That means it helps map your Java objects to queries that save and retrieve\
    \ data using JDBC.\n\nMyBatis is mostly used through interface definitions. MyBatis\
    \ automatically generates classes that implement the interface and makes them\
    \ available as Spring beans. This is an example interface that defines a MyBatis\
    \ Mapper.\n\n```java\n@Mapper public interface User {\n  @Select(\"SELECT * FROM\
    \ users WHERE username = #{username}\")\n  User getUser(String username);\n}\n\
    ```\n\nThis code above uses #{username} to identify the username parameter. It's\
    \ like Thymeleaf parameters, but for SQL!\n\nFor more information on the template\
    \ syntax MyBatis for SQL, check out the official documentation. There are additional\
    \ annotations for @Insert, @Update, and @Delete as well. See the further research\
    \ section below the next video for more info on how to configure MyBatis.\n\n\
    # MyBatis Demo\n\n### @Insert and @Options annotation\n\nThe @Insert annotation\
    \ automatically references attributes on the user object. username, firstName,\
    \ lastName are all referenced directly here, because they are attributes of the\
    \ user object.\n\n```java\n@Mapper interface UserMapper {\n  @Insert(\"INSERT\
    \ INTO USERS (username, salt, password, firstName, lastname)\" +\n  \"VALUES(#{username},\
    \ #{salt}, #{password}, #{firstName}, #{lastname})\")\n  @Options(generatedKeys\
    \ = true, keyProperty = \"userId\")\n  int insert(User user);\n}\n```\n\nThis\
    \ example also demonstrates the @Options annotation. @Insert normally returns\
    \ an integer that is the count of rows affected. By using the @Options annotation,\
    \ we're telling MyBatis that we want to automatically generate a new key and put\
    \ it in userId. Now the method will return the new userId once the row has been\
    \ inserted.\n\nAll we have to do use these methods is inject beans for this interface\
    \ into our services and MyBatis will automatically create the code for the JDBC\
    \ requests!\n\n![](img/3a5769bea53a661ab8e4c8216af739d1_118_0.png)\n\n## MyBatis\
    \ Mappers Lie at the Center of Our Onion Architecture\n\nThe diagram above shows\
    \ that MyBatis Mappers lie at the center of our onion architecture. Remember,\
    \ that means that the only beans that should have dependencies on them are in\
    \ the next layer up.\n\n## Key Terms\n\n- @Select, @Insert, @Update, @Delete:\
    \ Annotations representing SQL statements to be executed. Each annotation takes\
    \ a string for a SQL statement of the corresponding type. For example, a @Select\
    \ annotation takes a string for a SELECT statement.\n- @Options: Annotation providing\
    \ access to switches and configuration options for JDBC statements.\n\n## Further\
    \ Research\n\n- For a list of the available MyBatis annotations and some example\
    \ usage, see the MyBatis Java API documentation.\n- For an informal overview of\
    \ result mapping with MyBatis annotations, see this Medium article\n\nVIDEO 8:\n\
    \n## Question 1 of 2\n\nWhich of the following statements about MyBatis are correct?\n\
    \n- MyBatis generates your Bean from an interface alone.\n- The variables in your\
    \ MyBatis queries can reference either objects OR object attributes in the method\
    \ parameters.\n\n## Question 2 of 2\n\nWe want to add a new TacoOrder to our database.\
    \ Here's the TacoOrder class:\n\n```java\npublic class TacoOrder {\n  private\
    \ Integer orderId;\n  private String tacoName;\n  private Double tacoPrice;\n\
    \  private Integer count;\n  /* getters and setters not shown */\n}\n```\n\nWhich\
    \ of the following examples would perform our insert?\n\n- @Insert(\"INSERT INTO\
    \ TacoOrder(orderId, tacoName, tacoPrice, count)\" + VALUES (#{orderId}, ${tacoName},\
    \ ${tacoPrice}, ${count})) int addToOrder(TacoOrder tacoOrder);\n\nVIDEO 9:\n\n\
    # Exercise: MyBatis Mappers\n\n# Scenario\n\nEarlier in this lesson, we created\
    \ some classes to help support our burgeoning delivery business. Let's create\
    \ a @Mapper interface that we can use to create new deliveries once our customer\
    \ has successfully placed an order. As a reminder, here's our Delivery class:\n\
    \n```java\npublic class Delivery {\n  private Integer id;\n  private Integer orderId;\n\
    \  private Timestamp time;\n  /* getters and setters not shown */\n}\n```\n\n\
    # To Do\n\nYou'll be presented with the DeliveryMapper interface, and it's your\
    \ job to declare methods with SELECT, INSERT, and DELETE Delivery records. Annotate\
    \ each method with the appropriate annotations to perform the Select, Insert,\
    \ and Delete operations as described here:\n\n- the findDelivery(or select) method\
    \ should take the id of our Delivery class and return the corresponding Delivery\
    \ object.\n- The insert method should take a Delivery object and create a new\
    \ record with the orderId and time. It should generate a new id and return that\
    \ id.\n- The delete method should take an id and delete that record from the database.\
    \ It doesn't need to return anything.\n\n- home/\n- workspace\n\n```java\npackage\
    \ com.udacity.jdnd.cousel.data;\n\nimport org.apache.ibatis.annotations.*;\n\n\
    @Mapper\npublic interface DeliveryMapper\n{\n}\n```\n\nNo Open Terminals\nNEW\
    \ TERMINAL\nMenu\nExpand\nVIDEO 10:\n\n## Solution: MyBatis Mappers\n\n### Explanation\n\
    \nWe declared three new methods in our interface. In this solution, they're named\
    \ findDelivery(), insert(), and delete(), but you can name them as you like.\n\
    \n```java\n@Mapper interface DeliveryMapper {\n  @Select(\"SELECT * FROM Delivery\
    \ WHERE id = #{id}\")\n  Delivery findDelivery(Integer id);\n  @Insert(\"INSERT\
    \ INTO Delivery (orderId, time) VALUES (#{orderId}, #{time})\")\n  @Options(useGeneratedKeys\
    \ = true, keyProperty = \"id\")\n  Integer insert(Delivery delivery);\n\n  @Delete(\"\
    DELETE FROM Delivery WHERE id = #{id}\")\n  void delete(Integer id);\n}\n```\n\
    \nThe code shown above has the following annotations:\n\n- 1. The first annotation\
    \ is a simple @Select like we saw earlier in the lesson.\n- 2. The second annotation\
    \ @Insert is pretty similar to the earlier example as well. it uses INSERT command\
    \ to create a new row in the Delivery table. Note that it only needs to provide\
    \ the order ID and time values, because the ID is itself generated.\n- 3. The\
    \ @Options annotation indicates to generate the key for the id property and return\
    \ it from the method. Also, note that our VALUES portion of the query just provides\
    \ order ID and time directly. MyBatis can figure out that our attributes of our\
    \ Delivery object.\n- 4. Lastly, @Delete is very similar to the @Select, but make\
    \ sure you use it\n\nVIDEO 11:\n\n# Practical Example: User Credentials and Authentication\n\
    \n### Authentication in a web application\n\nUser support is a common feature\
    \ in web applications, which means that a user can register an account and use\
    \ credentials to login to. It's important to design databases with the assumption\
    \ that they will someday be breached, so we cannot store passwords or other secret\
    \ in plain text. Two approaches to storing passwords are:\n\n- Encryption: Modifying\
    \ data before storing it, with the intention of returning it to its original form\
    \ once it needs to be used.\n- Hashing: Modifying data before storing it with\
    \ the intention of never returning it to its original form.\n\nHashing and Encryption\
    \ should occur in a service dedicated to that, rather than on the front end or\
    \ in the controller. Sometimes we use another technique, Salting (Wait, the text\
    \ says \"times use of another\", likely \"we use another\" - but I will stick\
    \ close to text unless it's a typo. Looking at OCR: \"times use of another technique,\
    \ Salting.\"). For a more in-depth discussion of salting and hashing passwords,\
    \ see the further research section below this.\n\n## The flow of data\n\nRemember\
    \ the separation of concerns and our onion architecture! The idea is that all\
    \ user flows externally, travel through a controller, then through one or more\
    \ services, finally through a data access bean to the database, and then back\
    \ up the chain. Structuring applications this way makes it easy to follow dependencies\
    \ and separate concerns, so that's how we're going to build applications from\
    \ now on.\n\n# Authentication and Related Services – Demo I\n\nFor the full lecture\
    \ sample code from this video and the next, check here\n\n# Hashing Implementation\n\
    \nBelow is an example of how to hash user passwords in the database. First, we\
    \ have the User class and the UserMapper. When our UserService creates a new user,\
    \ it uses a hashing service to convert the password to a hashed value before saving\
    \ it.\n"
  mdcn: "\n\nMyBatis 在 JDBC（Java 数据库连接）之上提供了一个浅 ORM 层。这意味着它可以帮助将你的 Java 对象映射到使用 JDBC\
    \ 保存和检索数据的查询。\n\nMyBatis 主要通过接口定义使用。MyBatis 会自动生成实现接口的类，并将其作为 Spring Bean 暴露。这是一个定义\
    \ MyBatis Mapper 的示例接口。\n\n```java\n@Mapper public interface User {\n  @Select(\"\
    SELECT * FROM users WHERE username = #{username}\")\n  User getUser(String username);\n\
    }\n```\n\n上面的代码使用 #{username} 来标识用户名参数。它就像 Thymeleaf 参数，但是用于 SQL 的！\n\n有关 MyBatis\
    \ 用于 SQL 的模板语法的更多信息，请查阅官方文档。还有针对 @Insert、@Update 和 @Delete 的额外注解。请查看视频下方的“进一步研究”部分以获取有关如何配置\
    \ MyBatis 的更多信息。\n\n# MyBatis Demo\n\n### @Insert 和 @Options 注解\n\n@Insert 注解会自动引用用户对象的属性。username、firstName、lastName\
    \ 在这里都被直接引用，因为它们是用户对象的属性。\n\n```java\n@Mapper interface UserMapper {\n  @Insert(\"\
    INSERT INTO USERS (username, salt, password, firstName, lastname)\" +\n  \"VALUES(#{username},\
    \ #{salt}, #{password}, #{firstName}, #{lastname})\")\n  @Options(generatedKeys\
    \ = true, keyProperty = \"userId\")\n  int insert(User user);\n}\n```\n\n此示例还演示了\
    \ @Options 注解。@Insert 通常返回一个整数，即受影响行数。通过使用 @Options 注解，我们告诉 MyBatis 我们想要自动生成一个新键并将其放入\
    \ userId 中。现在，一旦插入了行，方法将返回新的 userId。\n\n我们只需要在使用这些方法时向我们的服务中注入该接口的 Bean，MyBatis\
    \ 就会自动为 JDBC 请求创建代码！\n\n![](img/3a5769bea53a661ab8e4c8216af739d1_118_0.png)\n\n\
    ## MyBatis Mappers 位于我们洋葱架构的核心\n\n上面的图显示 MyBatis Mappers 位于我们洋葱架构的核心。记住，这意味着唯一应该依赖它们的\
    \ Bean 应该在上一层。\n\n## 核心术语\n\n- @Select, @Insert, @Update, @Delete: 代表要执行的 SQL\
    \ 语句的注解。每个注解都接收一个字符串作为对应类型的 SQL 语句。例如，@Select 注解接收一个字符串作为 SELECT 语句。\n- @Options:\
    \ 提供访问 JDBC 语句开关和配置选项的注解。\n\n## 进一步研究\n\n- 有关可用 MyBatis 注解列表及示例用法，请参 MyBatis Java\
    \ API 文档。\n- 关于使用 MyBatis 注解进行结果映射的非正式概述，请查看此 Medium 文章\n\nVIDEO 8:\n\n## 问题 1，共\
    \ 2 个\n\n关于 MyBatis 的以下哪些是正确的？\n\n- MyBatis 仅通过接口生成你的 Bean。\n- 你 MyBatis 查询中的变量可以引用方法参数中的对象，也可以引用对象属性。\n\
    \n## 问题 2，共 2 个\n\n我们想向数据库添加一个新的新的 TacoOrder。这里是 TacoOrder 类：\n\n```java\npublic\
    \ class TacoOrder {\n  private Integer orderId;\n  private String tacoName;\n\
    \  private Double tacoPrice;\n  private Integer count;\n  /* getters and setters\
    \ not shown */\n}\n```\n\n以下哪个示例会执行我们的插入？\n\n- @Insert(\"INSERT INTO TacoOrder(orderId,\
    \ tacoName, tacoPrice, count)\" + VALUES (#{orderId}, ${tacoName}, ${tacoPrice},\
    \ ${count})) int addToOrder(TacoOrder tacoOrder);\n\nVIDEO 9:\n\n# 练习：MyBatis\
    \ Mappers\n\n# 场景\n\n在本节早些时候，我们创建了一些类来帮助支持我们发展的外卖业务。让我们创建一个 @Mapper 接口，一旦客户成功下单，我们就可以用它来创建新的订单。提醒一下，这是我们的\
