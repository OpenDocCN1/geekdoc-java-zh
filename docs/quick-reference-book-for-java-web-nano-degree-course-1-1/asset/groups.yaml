    \ action=\"#\" method=\"POST\">\n  <input th:field=\"*{text}\" type=\"text\">\n\
    \  <input type=\"submit\"/></form>\n```\n\nWe use the th:object to choose the\
    \ POJO for form data should be added, and the th:actionattribute to choose the\
    \ URL is always relative to the actual server address - we use the # syntax in\
    \ the latter to tell Thymeleaf to make sure the URL doesn't make a difference\
    \ in our current project, but it's good practice when referring to URLs on our\
    \ server in a Thymeleaf template.\n\nWe also set method=\"POST\" on the form to\
    \ get the HTTP method of the resulting request. This is important. Remember that\
    \ GET requests contain any custom data - we need to use POST for our form data\
    \ to actually get!\n\nIn order to bind the individual form input data fields to\
