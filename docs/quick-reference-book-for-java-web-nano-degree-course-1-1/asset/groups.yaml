    # 从后端开发网站


    # Spring MVC 与客户端之间的关系


    上面的图片显示了 Spring MVC 与客户端之间的关系。Spring MVC 使用 HTML 模板和应用程序数据来为客户端浏览器渲染视图。该视图向用户暴露了某些操作，当这些操作被触发时，会被发送到
    Spring MVC，由 Spring MVC 处理这些操作并为客户端渲染新视图。


    # 与简单的 Web 应用交互


    在 Web 应用程序中，有两个组件：发送 HTTP 请求的客户端和负责响应的服务器。对于 Web 浏览器客户端，响应的内容需要是 HTML 格式，这是 Web
    的文档语言。发送到客户端的 HTML 定义了用户看到的数据，以及用户可以执行的操作——如按钮、链接和输入表单等内容都是服务器负责生成的一部分。


    如果我们必须手动完成从 HTML 生成 UI 的过程，那将非常枯燥。幸运的是，我们不必这么做——Thymeleaf 是一种 HTML 模板，与 Spring
    MVC 使用时，可以极大地简化工作。


    # HTML 模板


    HTML 模板本质上只是带有特殊标签和属性的 HTML 文件，这些文件可以像 Thymeleaf 这样的模板与数据模型结合，从而生成功能完整的 HTML 文档。Spring
    MVC 提供了一种标准方法，在请求到达时选择模板并提供必要的数据模型，从而实现真正的动态用户体验。


    > 数据模型定义了应用程序如何存储和检索（序列化和反序列化）从数据库到/或的 Java 对象。数据建模始于设计数据库表，这些表比比 MVC 中的 Java
    类（“模型”类）。


    你将在本课程中学习并练习 HTML 模板，并在“数据持久化”课程中学习数据模型。


    # 关键术语


    - **GET 请求**：针对特定 URL 获取数据的 HTTP 请求。这种请求不能包含任何额外数据。

    - **POST 请求**：通常代表向服务器“提交”新数据的 HTTP 请求。这是一种常用的全能型方法，用于向服务器发送带有有数据的请求。

    - **动态的 (Dynamic)**：指响应外部刺激而发生变化的事。在 HTML 模板中，模板的动态部分是指可以根据需要用数据替换或配置的部分。

    - **静态的 (Static)**：指不改变的事。在 HTML 模板中，模板的静态部分是无法更改的，无论模板使用什么数据，它们都保持一致。

    - **MVC**：模型-视图-控制器，一种设计模式，它强调将应用程序组件分为这三类或三层，以便进行更有结构化的面向用户的应用程序开发。


    # 测验题


    思考模板如何允许我们用服务器数据填充可复用的 HTML 结构。这种方法与自己创建 HTML 结构相比，有哪些优势？


    - 手动生成语法正确的 HTML 是一项苦力工作！

    - 多个页面上的布局和视觉元素是相同的，模板允许我们复用它们。


    # 外部资源


    - 教程：30seconds 视频 13-02 中的 Thymeleaf + Spring


    视频 3：


    # 服务器、模板与 MVC


    有三种基本场景构成了绝大多数基于 Web 的用户交互流。


    - 第一种情况是用户从外部来源（如营销邮件或 Google 搜索）点击链接进入我们的应用程序。这种“冷启动”请求始终是 GET 请求，我们应用程序的责任是选择一个响应模板（适用于请求
    URL）——你不会希望在用户点击 `/shopping-cart/` 时发送 `register.html` 并用相关的应用程序数据填充它。

    - 第二种场景是用户在我们的应用内进行导航，通过选择链接、按钮，或者执行我们需要在服务器上执行的某些操作（例如将商品添加到购物车）。这种情况与第一种非常相似，都涉及服务器选择响应模板并填充数据，但这种情况下，用户执行的操作完全取决于他们——因为他们是从我们设计的网页上发起的操作，只有我们在该设计中包含的操作是可用的。我们可以利用此在模板级别为请求添加额外数据，例如通过生成每个“加入购物车”按钮，在发送的请求中包含商品的标识符。

    - 3. 最后一种场景是用户使用输入框向我们的应用提交完全自定义的数据。这与前两种情况类似，表单的精确形状由我们的模板设计决定，我们仍然需要选择一个模板来发送响应，以及填充该模板的数据。主要区别在于请求不再包含“安全”数据——当用户输入任何数据时，应用程序负责审查和验证这些数据，如果出现问题，则向用户显示错误。


    这些场景看起来很简单，但它们是 Web 开发的基石。无论应用程序如何，Web 上的用户交互流都是由这些基石构建的。


    # 问题 1/2


    以下哪种工作流描述了服务器、控制器和 HTML 模板之间的交互？


    - 服务器接收 HTTP 请求并控制器。

    - 控制器填充模型对象并返回 String。

    - 对应视图的模板由模型填充。


    # 问题 2/2


    关于服务器、模板和 MVC，以下哪些陈述是正确的？


    - 控制器连接到模板。

    - 数据可以编码到请求体中。


