    \n一旦有了驱动程序，我们需要告诉它要访问哪个页面。我们在脚本中使用 `driver.get(\"http://www.google.com\");` 来实现这一点，但如果我们正在测试自己的应用程序之一（例如本课程之前的消息页面），我们必须将\
    \ URL 更改为 http://localhost:8080/\n\n为了与网页进行交互或从其提取数据，我们首先需要在页面上选择所需的 HTML 元素。在这个示例中，我们使用\
