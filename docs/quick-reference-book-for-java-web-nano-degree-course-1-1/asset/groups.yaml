    \ condition logic to display the first message if `firstVisit` is true, and display\
    \ the second message if `firstVisit` is false.\n\n![](img/3a5769bea53a661ab8e4c8216af739d1_89_0.png)\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\" xmlns:th=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ user-scalable=no, initial-scale=1.0, maximum-scale=1.0\">\n  <meta http-equiv=\"\
    X-UA-Compatible\" content=\"ie=edge\">\n  <title>SimplePage</title>\n</head>\n\
    <body>\n  <form action=\"#\">\n    <input type=\"submit\" value=\"Visit me\">\n\
    \  </form>\n  <h1>Hello, homepage!</h1>\n  <h1>Welcome back!</h1>\n</body>\n</html>\n\
    ```\n\n# VIDEO 9:\n\n## Solution: HTML Templates with Thymeleaf\n\nThis example\
    \ should be pretty simple. Here's the `<body>` text of our apps is:\n\n```html\n\
    <body>\n  <form action=\"#\" th:action=\"@{/simplehome}\" method=\"POST\">\n \
    \   <input type=\"submit\" value=\"Visit me\">\n  </form>\n  <h1 th:if=\"${firstVisit}\"\
    >Hello, homepage</h1>\n  <h1 th:unless=\"${firstVisit}\">Welcome back!</h1>\n\
    </body>\n```\n\nYou can see the following steps:\n\n- Set `th:action` to `/simplehome`\
    \ endpoint\n- Set the method of our form to POST.\n- Used `th:if` and `th:unless`\
    \ to choose which message to display depending on variable `firstVisit`.\n\nHere\
    \ is the complete solution code with analogous variable names and corresponding\
    \ values.\n\n# VIDEO 10:\n\n## Connecting Controllers to Templates\n\nThe final\
    \ piece of the Spring MVC puzzle we need to build fully capable apps is the ability\
    \ to handle user-submitted data. As before, there are two main components to this,\
    \ on the template side, or on the controller side.\n\nOn the template side, we\
    \ need to define input fields for each piece of data we want to capture, and a\
    \ `<form>`.\n\nOn the controller side, we need to handle the data once it's submitted.\n\
    \n## User-Input\n\nFor the full sample from the previous video, click\n\nIn this\
    \ video, we looked at how to handle user-submitted data. Here are the controller\
    \ methods we saw:\n\n```java\n@GetMapping(\"/home\")\npublic String getHomePage(@ModelAttribute(\"\
    newMessage\") MessageForm newMessage, Model model) {\n    model.addAttribute(\"\
    greetings\", messageListService.getMessages());\n    return \"home\";\n}\n\n@PostMapping(\"\
    /home\")\npublic String addMessage(@ModelAttribute(\"newMessage\") MessageForm\
    \ messageForm, Model model) {\n    messageList.addMessage(messageForm.getText());\n\
    \    model.addAttribute(\"greetings\", messageListService.getMessages());\n  \
    \  messageForm.setText(\"\");\n    return \"home\";\n}\n```\n\nThe key elements\
    \ to focus on are the arguments to each of these methods - the MessageForm class\
    \ is a POJO designed to handle the form data.\n\nFor the GET request method, we\
    \ declare the MessageForm argument to ensure that the object exists and is added\
    \ to the Model by Spring. This is necessary, because Thymeleaf needs an object\
    \ with the newMessage to be present, even if there's not data in the object yet.\n\
    \nFor the POST request method, we declare the MessageForm argument to tell Spring\
    \ that it should look for data that matches in the body of the request. Spring\
    \ will then automatically extract the data and put it in MessageForm object before\
    \ calling our method, passing it to us so we can use the data as we see fit.\n\
    \nIn both cases, we're annotating this argument with `@ModelAttribute`. This allows\
    \ us to specify that Spring should add the object to our Model before allowing\
    \ Thymeleaf to render the template. That means we don't have to add it manually!\n\
    \n## Key Terms\n\n- **Form-Backing Object**: This is a term used by Spring MVC\
    \ and Thymeleaf to mean an object that represents the data contained in a form.\
    \ On the Spring side, this is usually an additional argument to the relevant Controller\
    \ method, and on the Thymeleaf side, this is referred to in the `th:object` attribute\
    \ over the form.\n\n## Further Research\n\n- Official Spring MVC docs with some\
    \ discussion of form-backing objects.\n- Official Thymeleaf docs for writing forms\
    \ and integrating with Spring.\n\n# VIDEO 11:\n\n## Question 1 of 2\n\nMatch each\
    \ of the functions below with the attribute or annotation that helps perform function.\n"
