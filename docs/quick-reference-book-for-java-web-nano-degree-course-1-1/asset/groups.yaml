    component that the user is.

    - Spring beans are the controllers - specifically, Spring MVC gives an @Controller
    annotation that we can use to register our beans as controllers. Spring bean controllers
    as specialized components can define methods to handle specific user requests.
    These methods are responsible for choosing the HTML template that is generated
    in response, as well as populating the Model object for that template.

    - Model objects are the models - every controller method can take an optional
    Model argument, and by defining the data inside of it, the controller can read-submitted
    data and populate the template with the changes. Think of the Model class as simple
    data-transfer object: something that stores various bits of data to keep that
    up, and can be passed between the browser, the template engine, and the controller
    to facilitate the transfer of data between the user and the application.


    # Let''s Get Coding!


    > You can find the lecture sample code from the video above here.


    In order to start Spring MVC, we need two main elements: an HTML template to define
    the user interface, and a Spring MVC @Controller-annotated bean to serve that
    template and populate it with data.


    In our example far, our "template" is actually a static HTML page that displays
    a greeting. The main thing about templates so is to place them in the right folder
    - src/main/resources/templates under the project root directory. When we choose
    a template in our controller, we do so by specifying the template name we want
    to load - home.html template in the example is simply referred to as "home". This
    will only work if your templates are in the right folder, always double check!


    Set up a basic controller to serve this template, we created a new class called
    HomeController and annotated it with @Controller. As you may remember from the
    last lesson, this registers the class as a Spring bean and makes it eligible for'
- md: '

    request handling. That''s why we can''t use @Component - Spring MVC only looks

    controllers, not all Spring beans.


    In order to actually bind the controller to a specific request URL - like /home
    in our

    example - we define a method in the controller and annotate it with

    @RequestMapping. We also have to return a String from this method - this is the

    name of the template we want to render. For this first step into web development,

    that all we do - return the String "home" to indicate that we want the home.html

    template to be rendered when a user requests the /home URL.


    # Basic User Flow


    You can find the lecture sample code from the video above here.


    In order to actually render dynamic data in a template, we again need to approach
    it

    from both the template and the controller.


    In the template, we need add Thymeleaf attributes to our HTML. In our example
    so

    far, we added the th:text attribute to the heading we want to be dynamic, like
    so:


    ```

    <h1 th:text="${welcomeMessage}">Hello, homepage!</h1>

    ```


    This attribute will allow Thymeleaf to replace the text inside the h1 tag (Hello,

    page!) with a string generated by evaluating the expression in the th:

    attribute (${welcomeMessage}). The syntax of this expression is fairly simple:
    the $$ indicates an expression to evaluate, and by using a name like welcomeMessage
    inside

    of it, we are telling Thymeleaf to look up a value in the model supplied for this

    template with the same name.


    For that to work, though, we need to add a named welcomeMessage to the

    model and we do that in the controller like so:


    ```

    @RequestMapping("/home")

    public String getHomePage(Model model)

    { model.addAttribute("welcomeMessage", "Hi

    Hello"); return "home";

    }

    ```


    First we need to add to the controller - the Model object you see

    above. This is a special class that Spring MVC will use Thymeleaf to render the

    template, and we can set various attributes on to added values. As you can see,

    we are adding a value of "Hi Hello" to the model with the name "welcomeMessage"

    - which is exactly the name we''re referencing in our template! Now when we render
    the

    template, the message Hi Hello will appear on the web page instead of Hello,

    homepage!.


    Nice!


    We replace the hardcoded "Hi Hello" string in our controller with any Java value
    or expression, and it will be set every time the controller method is called,
    which means every time a request comes in for `/home`. That means we can set it
    dynamically, even based on the request that comes in. If we replace it with `Instant.now().toString()`,
    we end up with a welcome message that shows the current time, and updates every
    time we reload the page.


