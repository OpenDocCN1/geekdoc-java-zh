    # A quick note on Java Application Files:


    When you compile a Java program and package it to be run, the Java compiler creates
    is called a Java Archive, or JAR file. This file contains a compressed file hierarchy,
    with folders that represent Java packages that contain Java .class files, which
    are compiled versions of .java source code files. It can also contain arbitrary
    resource files, either at the root or deeply nested in the package hierarchy.
    These files often contain metadata related to the app or contained in the JAR
    file, which can be read by any program that interacts with the JAR.


    When you want to deploy to an app server, you have to package it as a Web application,
    or WAR file. A WAR file is almost identical to a JAR file, but includes configuration
    files specific to web applications. When we copy the deployment directory of an
    app server, the server unpacks it, looks for a web.xml file, and uses it to find
    the classes and resources required by the application. This uses advanced Java
    features like reflection and class loading to programmatically load Java class
    definitions and instantiate them which is quite a nifty trick! It allows us to
    dynamically load, start, stop, and replace any number of applications in a web
    server at any time.

