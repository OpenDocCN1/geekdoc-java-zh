    # 认识你的导师


    # 认识你的导师：Peter Zastoupil


    大家好！我叫 Peter Zastoupil。


    我是一名企业软件开发人员，也是 Cook Systems 的老师，这是一家 IT 解决方案和培训公司。我的背景涉及许多语言和工具，但 Java 和 Spring
