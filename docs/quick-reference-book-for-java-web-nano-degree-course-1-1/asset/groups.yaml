    +   @Repository: In Spring, any @Repository-annotated class is treated identically
    to a @Component-annotated class. In an onion architecture, repositories are the
    inner layer - each repository should act like an interface to access a specific
    set of stored or persisted data. For example, a UserRepository would expose an
    interface interface capable of create/update/delete and query operations on the
    users of the database.


    +   Properties: A file with properties pairs separated by lines. This format is
    used by Java libraries and frameworks and provides a simple way to specify named
    constants in a plain text file.


    +   Legacy: In a programming context, legacy usually refers to older code that
    still functions or is expected to function, but it is one that is on the verge
    of being obsolete by newer technologies. A legacy application is one that is no
    longer being built upon, and is instead in maintenance mode.


    +   XML: This is a flexible data format that allows for extension, as the name
    suggests. Many applications and libraries use XML as a way to store structured
    data out, and it''s also a popular data interchange format on theweb.


