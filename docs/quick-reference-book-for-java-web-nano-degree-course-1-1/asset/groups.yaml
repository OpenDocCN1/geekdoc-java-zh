    视频 3：什么是 Spring


    # 什么是 Spring


    本节课程的代码片段可以在此处找到。


    在设计 Spring 应用程序时，最需要记住的原则是**关注点分离**（separation of concerns）。这意味着对于你的应用程序必须解决的每一个问题，在组件中都有一个家，且这个家易于查找和灵活使用。通过构建小型但集中的组件来构建你的应用程序，你可以充分利用
    Spring 消除样板代码的力量，当需要添加新功能时，你确切知道应该将它们放在哪里。在较大的团队中，这意味着更强的协调性，以及减少在寻找和消除冗余及冲突上花费的时间。


    为了让你的组件之间能够有效通信，你需要一套数据类型系统在它们之间共享。这些是简单的类，设计用于存储结构化数据，此外几乎不做。它们作为应用程序数据的概念表示非常有用，例如用户个人资料或货运发票详情，这些数据可能被应用程序的组件使用和操作。


    一个好的经验法则是判断哪些是组件。组件绝不应该使用 `new` 关键字进行手动实例化 - 组件由 Spring 管理，这意味着我们需要依赖依赖注入来获取组件引用。另一方面，数据类型并不比
    Java 集合更特殊，我们可以随时随地使用 `new` 手动实例化它们。当然，我们也可以使用 Spring（及其相关库）为我们实例化它们，在接下来的课程中我们将看到这种情况。


    # 核心术语：


    -   **关注点分离 (Separation of Concerns)**：一种强调单一用途组件的代码组织哲学。在 Java 和 Spring 中，这意味着为了可维护性并减少代码复用，将所有与特定问题领域相关的方法保留在同一个类中。

    -   **数据类型 (Data Types)**：有时被称为 POJOs（简单旧 Java 对象），数据类型是应用程序设计中纯粹持有结构化应用程序数据的类，例如用户、个人资料或应用程序需要的任何其他内容。这些对象有助于我们维护良好的应用程序概念模型，并在执行期间频繁地创建和访问。

    -   **组件 (Components)**：组件是应用程序中由 Spring 管理的持久类实例。它们与其说像典型的对象，不如说像库，拥有必须调用才能执行特定操作的方法。组件只有在
    Spring 配置为创建它们时才会被创建，通常在服务器启动时。


