    # Spring 应用


    Spring 是一个应用程序框架，这意味着与其说在你的应用程序中选择何时调用它，不如由它决定何时调用你的应用程序代码。这种软件开发模式被称为控制反转（IoC），它非常强大，因为它允许开发者开发专门的应用程序组件，并使用
    Spring 通过依赖注入（dependency injection）将它们连接起来。这对于整洁、分离的代码以及复用非常有益。在查看大量的 Spring 模块和集成了
    Spring 的第三方工具时，这一点显而易见。


    本课程重点关注以下几点：


    - Spring MVC：一个用于 Spring 的通用 Web 控制器库，支持多种实用程序以简化 HTTP 请求的处理。

    - Thymeleaf：一个第三方模板引擎，可以与 Spring MVC 集成，简化生成作为 HTTP 请求响应的 Web 页面。

    - Spring Security：一个用于 Spring 的通用认证库，可以与许多不同的凭据源和身份验证协议集成，自动管理请求认证和安全上下文。

    - MyBatis：一个第三方数据库访问库，提供了简单的 SQL/Java 映射工具，这些工具定义在 Spring 组件中。


    # 告别样板代码：Spring Boot


    Spring 增加了很多功能，但听起来仍然有很多配置。我们仍然需要将其部署到应用程序服务器，对吧？我们仍然需要创建一个让 Spring 运行的 servlet。这听起来，让所有这些模块和实用程序协同工作可能需要一些精力。


    在过去，Spring 确实需要很多配置，但随着时间的推移，开发已转向“约定优于配置”（convention-over-configuration）的方法。Spring
    Boot 是一个提供点餐式（a-la-carte）Spring 体验的项目，并包含一个根据应用程序需求生成和下载启动项目的网页。如今大多数 Spring 应用程序还包含一个嵌入式应用程序服务器，并带有默认的、预配置的
    servlet。运行启用 Spring 的代码作为服务器，你只需要运行一个主方法。


    随着 Docker 等容器化架构的兴起，这种应用程序开发风格已变得像插件式应用程序服务器一样流行，在本课程中，我们将专门使用这种模式。然而，如果你想将 Spring
    Boot 应用部署到传统的应用程序服务器，有内置工具允许你将应用程序打包为标准的 WAR 文件。


    # 核心术语


    - IoC：控制反转（Inversion of Control），这是将库设计为应用程序运行器的实践。这允许开发者专注于特定的应用程序逻辑，并依赖 IoC
    容器将应用程序组件相互连接，从而消除了大量样板代码并鼓励开发关注点的清晰分离。


