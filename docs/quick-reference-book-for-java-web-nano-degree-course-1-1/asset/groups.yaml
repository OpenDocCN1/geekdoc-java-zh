    # Handling Front-End Calls with Controllers


    +   - You need to write controllers for the application that bind application
    data and functionality to the front-end. That means using Spring MVC''s application
    model to identify the templates served for different requests and popular the
    view with data needed by the template.

    - The controllers you write should also be responsible for determining what, if
    any error messages the application displays to the user. When a controller processes
    front-end requests, it should delegate the individual steps and logic of those
    processes to other services in the application, or it should interpret the results
    to ensure a smoother user experience.

    - It''s a good idea to keep your controllers in a single package to isolate the
    controller layer. Usually, we call this package controller!

    - If you find yourself repeating tasks over and over in controller methods, or
    your controller methods are getting long and complicated, consider abstracting
    some methods into services! For example, consider using UserService and EncryptionService
    classes included in the starter code package service. These classes encapsulate
    simple, repetitive tasks and are available anywhere dependency injection is supported.
    Think about additional tasks that can be simply abstracted and reused, and create
    new services to support them!


    # Making Classes to the Database with MyBatis Mappers


    +   - Since you were provided with a database schema, when you can design Java
    classes to match the data in the database. These database should be POJOs (Plain
    Old Java Objects) with fields that match the names and data types in the schema,
    and you should create one class per database table. These classes typically are
