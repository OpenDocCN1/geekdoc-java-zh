    # Lesson Conclusion


    Congratulations, you''ve made it through one of the toughest lessons in this course!
    Working with Spring requires an entirely new mentality when it comes to application
    design, and we had a lot of ground to cover in this lesson to laying the foundations
    for the rest of the course. Next lesson, we''ll be adding some functionality to
    our applications by integrating Spring MVC and Thymeleaf render web pages for
    our clients.'
