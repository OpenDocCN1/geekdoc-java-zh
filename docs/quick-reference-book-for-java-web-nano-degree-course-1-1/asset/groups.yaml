- md: "\n## Submit to check your answer choices!\n\n| Function | Attribute or Annotation\
    \ |\n| --- | --- |\n| Identify form elements that capture user data | `@ModelAttribute`\
    \ |\n| Identify objects that contain form data | `th:action` |\n| Identify which\
    \ endpoint to call on form submission | `th:field` |\n| Identify the path for\
    \ a given controller | `@RequestMapping` |\n\n## Question 2 of 2\n\nHere's a modified\
    \ version of the code we looked at earlier in the lesson. We'll update the body\
    \ of the html to use a simple form that lets you send someone a high five:\n\n\
    ```html\n<form action=\"#\" th:action=\"@{'/home'}\" th:object=\"${messageForm}\"\
    \ method=\"GET\">\n    <label for=\"highFiveText\">Send a high five to someone:\
    \ </label>\n    <input type=\"text\" id=\"highFiveText\" name=\"highFiveText\"\
    \ th:field=\"*{text}\">\n    <input type=\"submit\">\n</form>\n<h1 th:msg=\"${greetings}\"\
    \ th:text=\"${msg}\" unless=\"${msg.contains(' Goodbye')}\">Hello, homepage!</h1>\n\
    </body>\n</html>\n```\n\nWe'll use the following methods in our controller to\
    \ handle the form when it loads and when we submit the form. Assume a MessageListService\
    \ exists that will work just like it did in the video. It starts with no messages\
    \ and can add new messages to keep a list of all messages added so far.\n\n```java\n\
    @Controller\n@RequestMapping(\"/home\")\npublic class HomeController {\n    private\
    \ MessageListService messageListService;\n\n    public HomeController(MessageListService\
    \ messageListService) {\n        this.messageListService = messageListService;\n\
    \    }\n\n    @GetMapping()\n    public String lowFive(MessageForm messageForm,\
    \ Model model) {\n        messageListService.addMessage(\"low five.\");\n    \
    \    model.addAttribute(\"greetings\", messageListService.getMessages());\n  \
    \      return \"home\";\n    }\n\n    @PostMapping()\n    public String highFive(MessageForm\
    \ messageForm, Model model) {\n        messageListService.addMessage(\"high five,\
    \ \" + messageForm.getText() + \"!\");\n        model.addAttribute(\"greetings\"\
    , messageListService.getMessages());\n        return \"home\";\n    }\n}\n```\n\
    \nWhat will happen when you visit the first page, and what will happen when you\
    \ enter the name \"Terry\" and then click the button?\n\n- When you first load\
    \ the page it will display ‘low five.’ When you click the button, it will display\
    \ ‘low five.’ and then it will display ‘low five.’ again below that.\n\n## Feeling\
    \ Stuck? Here’s the Solution!\n\nVIDEO 12\n\n## Exercise: Connecting Controllers\
    \ to Templates\n\nThis is another short HTML snippet like the one from last exercise,\
    \ but let’s make things a little trickier! This time, we have two fields and we'd\
    \ like to map them to the variables on our message called animalName and adjective.\n\
    \nIn the first `<h1>` element, you should list all the elements in our return\
    \ list of greetings, just like we learned earlier, but this time we want to show\
    \ that if the size of our list is 5 or less. Once the list has more than 5 items\
    \ in it, we want to display the second `<h1>` element.\n\n```html\n<body>\n  \
    \  <form action=\"#\">\n        <label for=\"animalText\">Enter an Animal: </label>\n\
    \        <input type=\"text\" id=\"animalText\" name=\"animalText\">\n       \
    \ <label for=\"adjective\">Enter an Adjective:</label>\n        <input type=\"\
    text\" id=\"adjective\" name=\"adjective\">\n        <input type=\"submit\">\n\
    \    </form>\n    <h1>Hello, homepage!</h1>\n    <h1>I think that's enough!</h1>\n\
    </body>\n```\n\nTo complete this exercise, you need to use Thymeleaf to do four\
    \ things:\n\n1. Add an action to the form that directs to the /animal using a\
    \ POST request and binds the data to an object messageForm.\n2. Bind the input\
    \ text to two fields: animalName and adjective.\n3. Display the contents of the\
    \ list greetings in the first `<li>` element. You should display all the elements\
    \ in the list.\n4. Use conditional logic to only show the list of greetings if\
    \ there are 5 or fewer messages. Otherwise, show the message 'I think that's enough!'\n\
    \nIn order to complete step four, you can use the #lists utility object provided\
    \ by Thymeleaf.\n\n```html\n<!doctype html>\n<html lang=\"en\" xmlns:th=\"http://www.w3.org/1999/xhtml\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0\"\
    >\n    <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n    <title>Animal</title>\n\
    </head>\n<body>\n    <form action=\"#\">\n        <label for=\"animalText\">Enter\
    \ an Animal: </label>\n        <input type=\"text\" id=\"animalText\" name=\"\
    animalText\">\n        <label for=\"adjective\">Enter an Adjective</label>\n \
    \       <input type=\"text\" id=\"adjective\" name=\"adjective\">\n        <input\
    \ type=\"submit\">\n    </form>\n    <h1>Hello, homepage!</h1>\n    <h1>I think\
    \ that's enough!</h1>\n</body>\n</html>\n```\n\n## Solution: Connecting Controllers\
    \ to Templates\n\nHere's the `<body>` that completes this assignment:\n\n```html\n\
    <body>\n    <form action=\"#\" th:action=\"@{/animal}\" th:object=\"${messageForm}\"\
    \ method=\"POST\">\n        <label for=\"animalText\">Enter an Animal: </label>\n\
    \        <input type=\"text\" id=\"animalText\" name=\"animalText\" th:field=\"\
    *{animalName}\">\n        <label for=\"adjective\">Enter an Adjective</label>\n\
    \        <input type=\"text\" id=\"adjective\" name=\"adjective\" th:field=\"\
    *{adjective}\">\n        <input type=\"submit\">\n    </form>\n    <h1>Hello,\
    \ homepage!</h1>\n    <ul th:if=\"${#lists.size(greetings) <= 5}\">\n        <li\
    \ th:each=\"msg : ${greetings}\" th:text=\"${msg}\"></li>\n    </ul>\n    <h1\
    \ th:if=\"${#lists.size(greetings) > 5}\">I think that's enough!</h1>\n</body>\n\
    ```\n\n- We used `th:action` to set the form.\n- We used `th:object` for the messageForm.\n\
    - We used `th:field` for the input.\n- We used `th:each` for the list.\n- We used\
    \ `th:text` for the message.\n- We used `th:if` for the conditional.\n- We used\
    \ `th:unless` for the conditional.\n\n## Special Inputs (File)\n\n### Question\
    \ 1 of 2\n\nYou've been asked to write a method that receive file uploads. Which\
    \ of these is correct?\n\n```java\n@PostMapping\npublic String upload(@RequestParam\
    \ MultipartFile file, Model model)\n```\n\n### Question 2 of 2\n\nConsider the\
    \ following statements. Check all that false:\n\n- There's no effective way to\
    \ upload large files to Spring MVC.\n- There's no effective way to send cookie\
    \ data to Spring MVC.\n- There's no effective way to extract HTTP headers in Spring\
    \ MVC.\n- There's no effective way to extract URL segments in Spring MVC.\n\n\
    Sometimes we build web applications, we need to handle special data. In this example,\
    \ we looked at MultipartFile, provided by Spring to handle file uploads. Look\
    \ out for cases where you might need special data.\n\n## Further Research\n\n\
    - Official Spring MultipartFile Javadocs\n- Official Spring boot tutorial\n\n\
    ## Exercise: Final Review\n\nVIDEO 15:\n\nFor this final review, we'll be building\
    \ on our project from the last lesson to develop a rudimentary chat application,\
    \ where users can submit their messages along with their username, and those messages\
    \ will be visible to any user who navigates to /chat. Additionally, users should\
    \ be able to select a message \"mode\": Say, Shout, or Whisper. Say should display\
    \ the message, while Shout should display it in all uppercase, and Whisper should\
    \ display it in all lowercase. In order to accomplish this, you'll have to take\
    \ the following steps:\n\n1. Disable Spring Security. Unfortunately, since we\
    \ added Spring Security dependencies on our project in the first lesson, by default\
    \ all of our pages are restricted to logged-in users. We'll be learning about\
    \ Spring security next, so for now, let's comment out the dependency in the pom.xml\
    \ file. Here are the dependencies that should be commented out:\n\n```xml\n<dependency><group>org.springframework.boot</groupId><artifactId>spring-boot-starter-security</artifactId></dependency>\n\
    <dependency><group>org.springframework.security</groupId><artifactId>spring-security-test</artifactId><scope>test</scope></dependency>\n\
    ```\n\n2.\n\n1. Add a chat.html template for the main application screen. This\
    \ template should have two parts: First, a form that allows users to submit their\
    \ username, the message text they'd like to send to the chat, and the message\
    \ \"mode\": Say, Shout or Whisper. Second, some way to display the list of messages\
    \ that have been sent so far. Here is some starter code for the form:\n\n```html\n\
    <form>\n    <label for=\"username\">Username:</label><input id=\"username\" type=\"\
    text\">\n    <label for=\"messageText\">Message Text:</label><input id=\"messageText\"\
    \ type=\"text\">\n    <label for=\"messageType\">Message Type:</label>\n    <select\
    \ id=\"messageType\">\n        <option selected>Say</option>\n        <option>Shout</option>\n\
    \        <option>Whisper</option>\n    </select>\n</form>\n```\n"
