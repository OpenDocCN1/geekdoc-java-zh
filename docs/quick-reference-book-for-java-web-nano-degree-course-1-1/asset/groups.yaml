    # 核心术语


    - **端点 (Endpoints)**：端点是客户端访问服务器特定功能部分的地址。通常，这是一个 URL 路径，即位于域名（如 `.com` 或 `.org`）之后的
    `/words/and/slashes`。


    - **Servlet**：作为 Java 企业版（Java Enterprise Edition）规范的一部分定义的一个类。它为 Web 服务器请求处理提供了一个可实现的接口，定义了一个
    `service` 方法，服务器会在实例化的 servlet 上调用该方法，以处理针对传入请求的 `ServletRequest` 和 `ServletResponse`
    对象。servlet 还定义了生命周期方法，供服务器在初始化或销毁 servlet 时调用。


    - **JAR**：Java 归档文件，以与代码包结构匹配的文件夹层次结构存储 `.class` 文件。包含一个可选的清单文件（manifest file）。


    - **WAR**：JAR 的 Web 应用变体，可选包含 HTML 文件等网络资源，以及用于 servlet 注册/映射的 `web.xml` 等配置文件。


