    \ \n* • • • • • • •\n\nVIDEO 15:\n\n# Solution: Final Review\n\nFor the full solution\
    \ code, check here.\n\n# Glossary\n\n+   * ORM: Object-Relational Mapping. A general\
    \ term describing a set of technology that can be\nused to automatically convert\
    \ data between database representation and application\nrepresentation.\n* JDBC:\
    \ Java Database Connectivity API, which is a specification for making SQL requests\
    \ from\nJava.\n* MyBatis: A ORM over JDBC that automatically generates code to\
    \ execute SQL\nstatements over JDBC and maps the results to Java objects.\n* Mapping:\
    \ Drawing a relationship between a field in a Java class and a column in a SQL\
