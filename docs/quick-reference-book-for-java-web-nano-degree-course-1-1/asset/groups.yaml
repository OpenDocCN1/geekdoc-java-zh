    ## Testing


    Your tech lead trusts you to do a good job, testing is important whether you''re
    an excel number-cruncher or a full-stack coding superstar! The QA team at SuperDuperDrive
    carries out extensive user testing. Still, your tech lead wants some Selenium
    tests to verify user-facing functionality and prove that your code is feature-complete
    before the testers get hands on it.


    ### 1. Write Tests for User Signup, Login, and Unauthorized Access Restrictions.


    - Write a test that verifies that an unauthorized user can only access the login
    and signup pages.

    - Write a test that signs up a new user, logs in, verifies that the home page
    is accessible, logs out, and verifies that the home page is no longer accessible.


    ### 2. Write Tests for Note Creation, Viewing, Editing, and Deletion.


    - Write a test that creates a note, and verifies it is displayed.

    - Write a test that edits an existing note and verifies that the changes are displayed.

    - Write a test that deletes a note and verifies that the note is no longer displayed.


    ## 3. Write Tests for Credential Creation, Viewing, Editing, and Deletion.


    - Write a test that creates a set of credentials, verifies that they are displayed,
    and verifies that the displayed password is encrypted.

    - Write a test that views an existing set of credentials, verifies that the viewable
    password is unencrypted, edits the credentials, and verifies that the changes
    are displayed.

    - Write a test that deletes an existing set of credentials and verifies that the
    credentials are no longer displayed.


    ## Final Tips and Tricks


    ## Password Security


    Make sure not to save the plain text credentials of the application''s users in
    the database. That''s a recipe for data disaster! Use a hashing function to store
    a scrambled version instead. Your tech lead gave you a class HashService that
    can hash passwords for you. When the user signs up, you only store a hashed version
    of their password in the database, and on login, you hash the password attempt
    before comparing it with the hashed password in the database. Your tech lead knows
    that this can be a bit confusing, so they provided this code sample to help illustrate
    the idea:


    ```

    byte[] salt = new byte[16];

    random.NextBytes(salt);

    String encodedSalt = Base64.getEncoder().encodeToString(salt);

    String hashedPassword = hashService.getHashedValue(plainPassword,encodedSalt);

    return hashedPassword;

    ```


    For storing credentials in the main part of the application, we can''t hash passwords
    because it''s a one-way operation. The user needs access to the unhashed password,
    after all! So instead, you should encrypt the passwords. Your tech lead provided
    you with a class EncryptionService that can encrypt and decrypt passwords. When
    a user adds new credentials, encrypt the password before storing it in the database.
    When the user views credentials, decrypt the password before displaying it. Here''s
    a little snippet on how to use EncryptionService:


    ```

    SecureRandom random = new SecureRandom();

    byte[] key = new byte[16];

    random.NextBytes(key);

    String encodedKey = Base64.getEncoder().encodeToString(key);

    String encryptedPassword = encryptionService.encryptValue(password, encodedKey);

    String decryptedPassword = encryptionService.decryptValue(encryptedPassword);

    ```


    You aren''t required to understand hashing or encryption and that''s why your
    tech lead provided these code samples for you. If you''re curious and want to
    learn a little more, you can do a quick search or follow the links below:


    - Hash Function

    - Encryption


    All of us here at SuperDuDrive wish you good luck with the project!


