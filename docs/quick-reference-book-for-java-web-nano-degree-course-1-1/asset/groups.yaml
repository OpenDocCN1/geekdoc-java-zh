    # Practical Example: User Credentials and Authentication


    # Authentication in a web application


    User support is a common feature in web applications, which means that a user
    can register an account and use credentials to login to the application in the
    future.


    It''s important to design databases with the assumption that they will someday
    be breached, and we so cannot store passwords or other secret credentials in plain
    text. Two approaches to storing passwords are:


    +   * Encryption: Modifying data before storing it, with the intention of using
    another algorithm to return the data to its original form once it needs to be
    used.

    * Hashing: Modifying data before storing it with the intention of never returning
    it to its original form. The modified data will be compared to modified data only.


    Hashing and Encryption should occur in a service dedicated to that, rather than
    on the front end or in the controller. Sometimes times use of another technique,
    Salting. For a more in-depth discussion of salting and hashing passwords, see
    the further research section below the videos for this section.


    # The flow of data


    Remember the separation of concerns and our onion architecture! The idea is that
    all user flows originate externally, travel through a controller, then through
    one or more services, finally through a data access bean to the database, and
    then the way'
