    model # Spring MVC 架构


    上面的图显示了 Spring MVC 的架构。浏览器表示视图（view），来自浏览器的请求是用户操作。当 Spring MVC 处理请求时，它会创建一个表示与视图相关的动态数据的
    Model 对象，并传递给匹配请求的控制器。控制器更新模型并选择一个模板进行渲染。Spring 将模板和更新后的模型传递给 Thymeleaf，Thymeleaf
    生成更新后的视图，然后 Spring 将发送到浏览器。


    # 关键术语


    - MVC: MVC 是 Model-View-Controller（模型-视图-控制器）的缩写，它是用户界面设计的一种常用软件模式

    - Model（模型）：在 MVC 中，Model 负责维护应用程序的状态

    - View（视图）：在 MVC 中，View 负责向用户显示 UI

    - Controller（控制器）：在 MVC 中，Controller 负责处理用户操作（从视图发送以更新模型，并将数据传回给视图）

    - Template（模板）：在软件开发中，模板用于许多不同的语境 - 通常，它们被用于定义特定格式的某些额外重复文本或代码，HTML 以及带有代码钩子（code
    hooks），这些钩子指示模板在渲染时应动态替换的部分。在我们的语境中，我们使用 Thymeleaf 的 HTML 模板，它们大部分看起来像普通的 HTML，带有一些额外的
    Thymeleaf 特有属性。这些属性就是我们的代码钩子，允许我们定义 Thymeleaf 从我们的模板生成最终 HTML 时使用什么数据。


    # 进一步研究


