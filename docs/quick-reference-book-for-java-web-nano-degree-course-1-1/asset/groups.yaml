    LESSON PART FOUR : THYMELE AND MVC


    VIDEO 1


    # Spring MVC and Thymeleaf


    ![](img/3a5769bea53a661ab8e4c8216af739d1_73_0.png)


    # MVC & You


    # Spring MVC and Thymeleaf


    # Lesson Outline


    - **MVC and You:** We introduce the model-view-controller pattern and discuss
    how Spring MVC adapts it for use on the web.

    - **HTML Templates and Thymeleaf:** We look at Thymeleaf''s HTML templates work
    and how we can populate them with data using Spring controllers.

    - **Connecting Controllers to Templates:** We dive deeper into the relationship
    between controllers and templates to see how to bind data from a web form to a
    controller method.


    VIDEO TWO:


    # Developing Web Sites from the Back-End


    # The Relationship Between Spring MVC and the Client


    The figure above shows the relationship between Spring MVC and the client. Spring
    MVC uses HTML templates and application data to render a view for the client browser
    to display. The view exposes certain actions to the user, which when triggered
    are sent to Spring MVC, which processes the actions and renders new views for
    the client.


    # Interacting with a simple web application


    In a web application, there are two components: the client that sends HTTP requests,
    and the server, which responds back. In the case of a web browser client, the
    responses sends need to be in the format of HTML, the document language of the
    web. The HTML that is sent to the client defines the data that the user sees,
    as well as the actions a user can take - things like buttons, links, and input
    forms are all part of what the server is responsible for generating.


    This process of generating an UI from HTML would be tedious if we had to do it
    by hand. Luckily, we don''t have to - Thymeleaf is an HTML template that, when
    used with Spring MVC, can simplify things greatly.


    # HTML templates


    HTML templates are essentially just HTML files with special tags and attributes
    that can be combined with a data model by a template like Thymeleaf to generate
    fully functional HTML documents. Spring MVC provides a standard way to choose
    a template and supply the necessary data model when a request comes in, which
    allows for a truly dynamic user experience.


    > Data model defines how the application stores and retrieves (serialize and deserialize)
    the Java objects into/from the database. Data modeling starts with designing the
    database tables which are analogous to the Java classes ("model") classes of the
    MVC.


    You''ll learn and practice HTML templates in the current lesson, and data model
    in the Data Persistence lesson.


    # Key Terms


    - **GET Request**: an HTTP request for data at a specific URL. This type of request
    cannot include any additional data.

    - **POST Request**: HTTP request that usually represents "posting" new data to
    the server. This is a common catch-all method used for data-bearing requests to
    the server.

    - **Dynamic**: Something that is dynamic in response to external stimuli. In the
    case of HTML templates, dynamic sections of the template are ones that can be
    replaced or configured with data on-demand.

    - **Static**: Something that is static does not change. In the case of HTML templates,
    static sections of the template are the ones that cannot be changed and will be
    the same no what data is used with the template.

    - **MVC**: Model-View-Controller, a design pattern that emphasizes the separation
    of application components into those three categories or layers for more-structured
    user-facing application development.


    # Quiz Question


    Think about how templating allows us to populate reusable html structures with
    server data. What are some advantages of this approach over creating the html
    structures ourselves?


    - Manually generating syntactically-correct HTML is hard work!

    - Many layout and visual elements are the same on multiple pages, templating allows
    us to reuse them.


    # External Resource


    - Tutorial: Thymeleaf + Spring on video 13-02 at 30seconds


    VIDEO THREE:


    # Servers, Templates, and MVC


    There are three basic scenarios that comprise the majority of web-based user interaction
    flows.


    - The first is when a user follows a link to our application from an external
    source, like a marketing email or google search. This kind of cold-call request
    means will always be a GET request, and our application''s responsibility is to
    choose a response template (appropriate for the request URL) - you don''t want
    to send the `register.html` if the user clicked for `/shopping-cart/` and populate
    it with relevant application data.

    - The second scenario is when a user navigates within our app, either by choosing
    a link or a button or performing some action we need to perform on the server,
    like adding an item to their shopping cart. This case is very similar to the first,
    as it involves the server choosing a response template and populating it with
    data, but in this case, the user performs is completely up to - since they''re
    initiating the action from a web page we designed, only the actions we included
    in that design are available. We can use this to add additional data to requests
    at the template-level, for example by generating each "add item to cart" button
    to include the item''s identifier in the request that is sent.

    - 1. The final scenario is when user submits completely custom data to our app
    using input. This is again similar to the previous two, in that the exact shape
    of the form is something our template design determines, and we still need to
    choose a template to send in response and the data to populate this template.
    The main difference is that the request no longer includes "safe" data - when
    a user enter any data that they''d, like the application is responsible for vetting
    and validating that data, showing the user an error if something goes wrong.


    These scenarios may seem simple, but they are the building blocks of web development.
    Regardless of the application, user interaction flows on the web are all built
    out of these basic building blocks.


    # Question 1 of 2


    Which of the following workflows describes the interaction between the web server,
    the Spring controller, and the HTML template?


    - The web server receives an HTTP request and uses it to call a method in the
    Spring controller. The Spring controller populates a model object and returns
    a String with the view id. The template corresponding to the view id is populated
    with data from the model object.


    # Question 2 of 2


    Which of the following statements about servers, templates, and MVC are true?


    - The Controller connects the data to the template.

    - User data can be either encoded into the request URL or sent in the body of
    the request message.


    VIDEO FOUR:


    # MVC and You


    MVC is an acronym that stands for Model-View-Controller, and it''s a common software
    pattern for user interface design. Traditionally, it divides the roles of components
    in app into three layers:


    - the Model, which is responsible for maintaining the state of application,

    - the View, which is responsible for displaying the UI to the user,

    - and the Controller, which is responsible for processing user actions (sent from
    the View) to update the Model, and for forwarding those updates back to the View


    MVC is an abstract pattern, every library implements it differently. Spring MVC
    is built around the browser as a platform, and it organizes these roles like:


    - HTML templates are the views - each represents a specific screen or screen component
    that the user is.

    - Spring beans are the controllers - specifically, Spring MVC gives an @Controller
    annotation that we can use to register our beans as controllers. Spring bean controllers
    as specialized components can define methods to handle specific requests. These
    methods are responsible for choosing the HTML template that is generated in response,
    as well as populating the Model object for that template.

    - Model objects are the models - every controller method can take an optional
    Model argument, and by defining the data inside of it, the controller can read-submitted
    data and populate the template with the changes. Think of the Model class as simple
    data-transfer object: something that stores various bits of data to keep that,
    and can be passed between the browser, the template engine, and the controller
    to facilitate the transfer of data between the user and the application.


