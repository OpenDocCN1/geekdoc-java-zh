    \ result in iterated or conditional rendering in addition to more typical text\
    \ replacement.\n\n## Key Terms\n\n- **User Action**: Broadly, a user action is\
    \ simply some specific action a user can take, provided by the user interface\
    \ they're interacting with. In the case of web applications, we usually think\
    \ of user actions as clicks on a web page that often results in an HTTP request\
    \ sent to the backend.\n- **Prototype/Wireframe**: In the development process\
    \ for a web application, it's common to define the full HTML and CSS for all the\
    \ screens one is expected to see. These pages have no actuality, and are usually\
    \ called prototypes. Wireframes are an even earlier version of the design process,\
    \ and usually simple images that show what the prototypes should look like.\n\n\
