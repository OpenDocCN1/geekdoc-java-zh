    在底层，Spring 本身就是一个 Java 应用程序 - 它以一种可预测的方式响应我们的配置。当 Spring 应用程序启动时，它会扫描代码库以寻找特殊标记的类和配置选项。它利用这些信息将你的应用程序组件实例化为对象，并将它们存储在名为应用上下文（application
    context）的特殊数据结构中。这个上下文非常类似于 Map，可以在运行时进行查询以找到所需的特定组件。在闭环系统中，Spring 实例化的组件将自动注入依赖。


