- md: "\nSelenium is a cross-platform tool for browser automation and scripting, and\
    \ we're going to use it to write tests that simulate a user's actions in a browser.\
    \ In the next video, we'll look at how Selenium's API functions in detail.\n\n\
    ## The Architecture of Selenium\n\nFigure above shows the architecture of selenium.\
    \ Test scripts written using Selenium's Java API are translated by Selenium to\
    \ work on different browsers using different drivers.\n\nFor the complete lecture\
    \ code sample from the previous video, click here\n\nIn this video, we looked\
    \ at the basic elements of a Selenium script. Here's the full script we examined:\n\
    \n```java\npublic static void main(String[] args) throws\nInterruptedException\
    \ {\n    DriverManager.chromedriver().setup();\n    WebDriver driver = new ChromeDriver();\n\
    \    driver.get(\"http://www.google.com\");\n    WebElement inputField = driver.findElement(By.name(\"\
    q\"));\n    inputField.sendKeys(\"selenium\");\n    inputField.submit();\n   \
    \ List<WebElement> results = driver.findElements(By.cssSelector(\"div.g a\"));\n\
    \    for (WebElement element : results) {\n        String link = element.getAttribute(\"\
    href\");\n        System.out.println(link);\n    }\n    Thread.sleep(5000);\n\
    \    driver.quit();\n}\n```\n\nEvery Selenium script has to start by initializing\
    \ a web driver. Since we're using DriverManager (documentation links below), we\
    \ can use it to automatically download the binary file for Selenium's driver for\
    \ Google Chrome, and then we can initialize the driver without any additional\
    \ work.\n\nOnce we have a driver, we need to tell it which page to visit. We do\
    \ this with driver.get(\"http://www.google.com\"); in-the script, but if we were\
    \ testing one of our applications, like the message page from earlier this course,\
    \ we would have to change the URL to something http://localhost:8080/\n\nIn order\
    \ to interact or extract data from the web page, we first need to select the required\
    \ HTML elements on the page. In this example, we use driver.findElement(By.name(\"\
    q\")) to select the google search input element. A detailed explanation of this\
    \ process can be found below.\n\nIn order to interact with the elements we've\
    \ selected, we can call various methods on them. In this case, we're using inputField.sendKeys(\"\
    selenium\"); to simulate typing the word selenium in google, and we are using\
    \ inputField.submit(); to simulate submitting the search form.\n\nOnce we've interacted\
    \ with the web page, we want to read in the results and print them out. Again,\
    \ we use the same process for finding an element, but this time, we use driver.findElements()\
    \ to get a list of matching elements, instead of a single one.\n\nThe final part\
    \ of every Selenium script is shutting down the driver. Since the driver is an\
    \ external program, if we don't call driver.quit(), the automated browser window\
    \ will never close on its own.\n\n## Key Terms\n\n- WebDriver: In order for Selenium\
    \ to assume control of a browser, it needs a program to interface with the browser's\
    \ API. This program is called a web driver, and there are different web drivers\
    \ for each major browser.\n\n## Further Research\n\n- DriverManager on Github,\
    \ with Documentation On Its Use and Motivation\n- Official Selenium Documentation\
    \ on Finding Elements on a Web Page, with Code Examples\n- DOM: Overview and the\
    \ fundamental data types\n\nVIDEO 13:\n\n## Question 1 of 2\n\nHere's a little\
    \ HTML snippet from our exercise in the lesson on Thymeleaf. Look familiar? What\
    \ do you think this Selenium script will do if run on this page?\n\nhome.html\n\
    \n# SeleniumExample.java\n\n```java\npublic static void main(String[] args) throws\
    \ InterruptedException {\n  WebDriverManager.chromedriver().setup();\n  WebDriver\
    \ driver = new ChromeDriver();\n  driver.get(\"http://localhost:8080/simplehome\"\
    );\n```\n\n```java\ndriver.findElement(By.id(\"submit\")).click();\nThread.sleep(5000);\n\
    driver.quit();\n}\n```\n\n### Question 2 of 2\n\nOur previous example had an id,\
    \ which is pretty handy! In fact, as a developer, you should get in the habit\
    \ of adding ids to any page elements that might be useful to reference in testing.\
    \ However, we don't always have the luxury of referencing an element by its id.\
    \ Here's a similar input field, but with no id!\n\n```html\n<form class=\"simpleForm\"\
    \ action=\"#\" th:action=\"@{/simplehome}\" method=\"POST\">\n  <input class=\"\
    submitButton\" name=\"submit\" type=\"submit\" value=\"Visit me\"></form>\n```\n\
    \nWhich of the following statements can still reference this input element?\n\n\
    VIDEO 14:\n\n## Exercise: Selenium\n\nLet's continue our trip memory lane and\
    \ return to the web page we created back. Look back at our Solution for Exercise:\
    \ Connecting Controllers to Templates in the lesson Spring MVC and Thymeleaf.\
    \ We had created a page that allows users to input an animal and an adjective\
    \ and press a button to receive a response from the server. After 5 times, the\
    \ message changes. Pretty tricky! Sounds like something that needs a Selenium\
    \ test.\n\n## To Do\n\nYour job for this assignment is to write a Selenium script\
    \ that opens the page at http://localhost:8080/animal and then types in a value\
    \ for each field and presses the submit button. It should submit the 5 times and\
    \ write the conclusion message to the console. In a real test, we might need to\
    \ do some validation, but for now.\n\nWe've added some ids and classes to the\
    \ page, so all you need to do is fill in the main method of SeleniumTest.\n\n\
    ## Task List\n\nYou'll notice that the web-browser closes automatically after\
    \ all the iterations completed.\n\nBelow is the sample solution. You can try playing\
    \ with the following instructions:\n\n## Supporting Materials\n\nFile: L5e3/src/test/java/com/example/demo/SeleniumTest.java\n\
    \n```java\npackage com.example.demo;\n\nimport io.github.bonigarcia.wdm.WebDriverManager;\n\
