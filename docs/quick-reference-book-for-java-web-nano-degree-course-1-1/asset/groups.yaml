    ## Glossary


    - Inversion of Control (IoC): a design pattern in which the developer creates
    independent application components and uses a framework to connect them, rather
    than writing the integration code themselves

    - Business Logic: Code relates exclusively to an application''s conceptual model
    and featureset. Contrast with utility code database, HTTP request parsing, etc.

    - Persistent Components: Java Objects that Spring maintains over time; they''re
    persistent because they''re created and maintained for as long as the application
    needs them to.

    - Dependency Injection: a mechanism by which DIC may be implemented. Components
    are configured with other components, which are injected at runtime. Injection
    is quite literal - a component''s dependencies are usually expressed as annotated
    fields in the class, and Spring will populate those with the dependencies at runtime.

    - Separation of Concerns: a good organization emphasizes single-purpose components.
    In Java and Spring, this means methods related to a specific problem domain in
    the same class, for the sake of maintainability and reducing code reuse.

    - Data Types: Components represent POJOs (plain-old-java-objects), Data Types
    are classes in application designed purely to hold data like users, profiles,
    or anything else application might manage. These objects are helpful for us to
    maintain a good conceptual model of an application, and are created and accessed
    frequently during execution.

    - Components: Components are instance managed by Spring. They usually resemble
    more than typical objects, with methods that must be called to perform specific
    actions. Components are only created when Spring is configured to create them,
    at server startup.

    - Configuration Files: Projects that configure some part of Spring''s operation.
    Some are embedded in java classes like we discussed, and others are .properties,
    .yaml, and .xml files we we will discuss later. Some of these configure the IOC
    context, the ones we discussed, and others more abstract pieces of Spring''s system.

    - Component Annotations: Component annotations that identify components for Spring
    to manage. @Bean and @Configuration are examples from the most recent ones, and
    in the next section we''ll discuss @Component and @Service as well.

    - Application Context: Spring''s application context is a giant data structure
    that holds all component instances. It can be queried to gain access to a specified
    component at runtime, and is what Spring uses to resolve dependencies.

    - Beans: "Bean" is Spring''s name for generic application components, and include
    any value Spring has stored in the application context. A bean is always either
    an object or primitive value.

    - Closed System: Spring''s application context is a closed system, which means
    it manages all of the components within it. It is not possible to instantiate
    a component manually and still link it with Spring - it will never be aware of
    Spring''s application context, and vice versa.

    - @SpringBootApplication: an annotation on the main application class of a Spring
    project that serves as one of three other annotations, @Configuration, @EnableAutoConfiguration,
    and @ComponentScan

    - @Configuration: a class annotated with @Configuration is instantiated and managed
    by Spring, but also as a bean factory. The methods of the configuration class
    that are annotated with @Bean are used to create new beans to the application
    context

    - @Bean: a method annotated with @Bean inside of a configuration class will be
    used by Spring to generate a bean of the method''s return type. This means that
    the developer can manually configure beans to be included in the application context.

    - @EnableAutoConfiguration: a class annotated with @EnableAutoConfiguration tells
    Spring to automatically match beans based on primary type. This reduces the need
    for boilerplate code explicitly identifying individual beans as dependencies.

    - @Primary: this annotation distinguishes the annotated bean as the default dependency
    of its type. This is used to resolve conflicts that arise from having multiple
    bean definitions of the same type when auto configuration is enabled.

    - @Qualifier: annotation distinguishes the annotated method or dependency declaration
    as a qualified bean or dependency. Qualified beans are considered for unqualified
    dependencies, but only matching qualified beans are considered for qualified dependencies.
    You can read more about it

    - @Architecture: an architectural pattern in which an application is separated
    into layers. For a request to be processed by the application, it must first travel
    through an outer layer of interfaces and controllers, then through a middle layer
    of services and business logic, and finally through a persistence layer of data
    access objects. The separation of these layers emphasizes separation of concerns.

    - @ApplicationComponent: the @Component-annotated class that is instantiated by
    Spring and Spring''s application context. Architecturally speaking, this is a
    logical unit of an application - a single-purpose library or object that has a
    particular problem an application faces.

    - @Service: in Spring, this is any @Service-annotated class, handled identically
    to a @Component-annotated class. The difference between them is semantic - component
    is the most generic type of bean, and service is a kind of shared annotation structure.
    A service manages one aspect of an application''s business logic. For example,
    a UserService would expose high-level actions to the users of an application,
    and an AuthenticationService would expose actions for registering and authenticating
    a user. Services represent the middle layer of an architecture and should contain
    the bulk of an application''s business logic.

    - @Repository: in Spring, any @Repository-annotated class is treated identically
    to a @Component-annotated class. In an onion architecture, repositories are the
    inner layer - each repository should act like an interface to access a specific
    set of stored or persisted data. For example, a UserRepository would expose an
    interface capable of create/update/delete and query operations on the users of
    the database.

    - Properties: a file with properties pairs separated by lines. This format is
    used by Java libraries and frameworks and provides a simple way to specify named
    constants in a plain text file.

    - Legacy: in a programming context, legacy usually refers to older code that still
    functions or is expected to function, but it is one that is on the verge of being
    obsolete by newer technologies. A legacy application is one that is no longer
    being built upon, and is instead in maintenance mode.

    - XML: this is a flexible data format that allows for extension, as the name suggests.
    Many applications and libraries use XML as a way to store structured data out,
    and it''s also a popular data interchange format on the web.


