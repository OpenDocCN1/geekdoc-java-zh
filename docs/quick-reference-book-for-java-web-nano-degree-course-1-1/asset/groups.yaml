    ## Glossary


    - **GET Request**: an HTTP request for data at a specific URL. This contains no
    additional data.

    - **POST Request**: an HTTP request that usually represents "posting" new data
    to the server. This is a common catch-all method used for many data-bearing requests
    to the server.

    - **Dynamic**: Something that is dynamic changes in response to external stimuli.
    In the case of HTML templates, static sections of the template are the ones that
    can be replaced or configured with data on-demand.

    - **Static**: Something that is static does not change. In the case of HTML templates,
    static sections of the template are the ones that cannot be changed and will be
    the same whatever data is used with the template.

    - **MVC-View-Controller**: a design pattern that emphasizes the separation of
    application components into three categories of layers for more-structured user-facing
    application development.

    - **Model**: In MVC, the Model is responsible for maintaining the state of an
    application.

    - **View**: In MVC, the View is responsible for displaying the UI to the user.

    - **Controller**: In MVC, the Controller is responsible for processing user actions
    (sent from the View) to update the Model, and for forwarding updates back to the
    View.

    - **Template**: In software development, templates are often-repeated or reused
    text or code in a specific format, like HTML, with code contexts - in general,
    they are used to define some-repeated with `code hooks` that indicate portions
    of the template that should be replaced dynamically when the template is rendered.
    In our context, we mostly use Thymeleaf-specific attributes. These attributes
    mostly look like plain HTML, with a few Thymeleaf-specific attributes which allow
    us to define what Thymeleaf uses when generating the final HTML template.

    - **User Action**: A user action is some simple action a user can take, provided
    by the user interface they are interacting with. In the case of web applications,
    we usually think of user actions as a click on a web page that results in an HTTP
    request sent to the backend.

    - **Prototype/Wireframe**: In the development process for a web application, it
    is common to first define the full HTML and CSS for all of the screens a user
    is expected to see. These pages have no actual functionality, and are usually
    called prototypes. Wireframes are an earlier part of the design process, and are
    usually simple images that show what the prototypes should look like.

    - **Form-Binding Object**: This is a term used by Spring MVC and Thymeleaf that
    represents the data contained in a form. On the Spring side, this is usually an
    additional argument to the relevant Controller method, and on the Thymeleaf side,
    this is referred to in the th:object attribute on the form.


