    # 我们应用程序不断增长的层


    图显示了我们应用程序不断增长的层。通过添加 MyBatis，我们现在有了从 Java 世界到 SQL 世界的翻译。


    # 为什么需要数据库？


    在应用程序中添加数据库是外部化持久化问题的方法。在内存中存储数据时，我们需要处理：


    - 存储空间

    - 并发性

    - 数据持久化


    使用数据库允许我们将这些问题与应用程序的其他部分隔离，以便我们专注于应用程序的业务逻辑。


    # 如何与数据库交互？


    管理应用程序与数据库之间通信的方法有很多。在本课程中，我们将使用 MyBatis 库将 Java 对象转换为查询参数，并将 SQL 结果转换为 Java 对象。


    我们将 MyBatis Mappers 创建为 Spring Bean，以便将它们注入到任何需要的 Bean 中。例如，如果我们考虑一个在线购物示例，我们可能有一个管理单个用户购物车凭据和个人信息的
    UserMapper。我们可以将 UserMapper 注入到 Checkout Service，该 Service 也接收 CartMapper 以将用户购物车中的费用应用于用户的存储支付信息。


    在课程稍后部分，我们将把 MyBatis Mapper 与 Spring Security 结合，以自动验证每个用户的会话。继续之前的示例，我们可以在某种身份
    Service 中注入 UserMapper，以便登录时检查客户端凭据。


    # 题


    哪个陈述描述了使用对象关系映射（ORM）来保存持久化数据的优点？


    - 它避免了我们编写引用对象中每个字段的查询。

    - 它允许我们更方便地以 Java 对象的形式处理持久化数据。

