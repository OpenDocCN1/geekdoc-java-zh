    +   - Interactive Debugging: When a pernicious problem persists, it can often
    be helpful to step through the code''s execution line-by-line to inspect both
    the control flow and the values in memory used by the program. This is called
    debugging, and while it''s technically possible to go outside of an IDE, IDEs
    like IntelliJ provide many useful tools for making the process as painless as
    possible.

    - Code Coverage Reports: When we run code in an IDE like IntelliJ, we can choose
    to have the IDE track which lines of code we wrote- Code Coverage Reports: When
    we run code in an IDE like IntelliJ, we can choose to have the IDE track which
    lines of code we wrote, and how many times. This can be widely useful when trying
    to trace why a condition isn''t being reached, as well as determining how much
    the entire code base is covered by the currently-implemented tests.


    In the next video, we''ll take a look at these features in IntelliJ while exploring
    a real-world scenario - fixing tests.


    For the lecture sample code from the previous and next videos, click here


    In this first foray into fixing tests, we ran our tests in IntelliJ to get a report
    of the status of all tests. Initially, they were all failing, but by clicking
    through IntelliJ''s test report details, we discovered a common problem to all
    of tests: some of the data under test wasn''t being initialized at all! We solved
    this by adding an @BeforeAll-annotated method responsible for that initialization.
    Running the tests again, our report shows that some are slowly turning green!
    All we needed was a handful of the test results, and we quickly identify a common
    problem between them.


    In the next video, we''ll explore another tool the IDE provides for this kind
    of work - debugging.


    For the lecture sample code from the previous and next videos, click here


    In this second attempt to fix our failing tests, we used IntelliJ''s debugger
    to check our code test line-by-line. We found that the conditions under test was
    validating did not match the code under test - which means we had a decision to
    make.


    Usually, in cases like this, where the test does not match the code it is testing,
    we have to decide which one is correct. In a real-world development scenario,
    we would check against the technical requirements to use, but since this is just
    an example, we choose to assume that the code under test was correct.


    In any case, debugging helped find an issue that might be harder to find. In the
    next video, we''ll try to get the remaining tests passing, and we''ll see how
    code coverage can help us determine if our code is sufficiently tested.


    For the lecture sample code from the previous videos, click here


    In this final push to get our tests passing, we looked at the remaining failing
    tests. The first was another issue of test/code not being sync: our test expected
    a specific exception to be thrown, but the code under test wasn''t throwing that!
    This is a good example of why assertThrows is useful in a testing context; if
    our feature requirements or documentation that a method should throw an exception
    under certain circumstances, it can cause real problems if it does anything else.'
