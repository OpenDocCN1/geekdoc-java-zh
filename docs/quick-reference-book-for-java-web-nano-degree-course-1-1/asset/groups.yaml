- md: '

    # How Spring Processes an IoC Configuration.


    The figure above shows an example of how Spring processes an IoC configuration.

    The general steps are:


    - A bean without dependencies is initialized first and placed within the application
    context.

    - A service is instantiated by Spring, and the first bean is retrieved from the
    context to be injected as a dependency, after which Spring places the service
    in the application context.

    - Finally, another bean is instantiated by Spring, which retrieves the previous
    two components to be injected as dependencies, after which the new bean is placed
    in the context, and the application is fully initialized.


    # Key Terms


    - Configuration Files: Project files that configure some part of Spring''s operation.
    Some are embedded in Java classes, like we just discussed, and .properties, .yaml,
    and .xml files that we will discuss later. Some of these configure the IoC context,
    like the ones we use, and others configure abstract abstractions of Spring''s
    system.

    - Component Annotations: Component annotations that identify components for Spring
    to manage. @Bean and @Configuration are examples from the most recent video, and
    in the next section we will discuss @Component and @Service as well.

    - Application Context: Spring''s application context is just a data structure
    that holds all application component instances. It can be queried to gain access
    to a specific component at runtime, and it Spring uses to resolve dependencies.

    - Beans: "Beans" is Spring''s name for generic components, and include any value
    Spring has stored in the application context. A bean is always either an object
    or primitive value.

    - Closed System: Spring''s application context is a closed system, which means
    that it manages all of the components stored within. It is not possible to instantiate
    a component manually and still link with Spring - it will never be aware of the
    components inside Spring''s application context, and vice versa.

    - @SpringBootApplication: An annotation on the main application class of Spring
    Boot project. It serves as an ally of other annotations, @Configuration, @EnableAutoConfiguration,
    and @ComponentScan

    - @Configuration: A class annotated with @Configuration is instantiated and managed
    by Spring as a component, but also as a factory. Any methods of the class that
    are annotated with @Bean are used to create new beans to add to the application
    context.

    - @Bean: A method annotated with @Bean of a configuration class will be used by
    Spring to generate a bean of the method''s return type. This is that the developer
    can manually configure the bean to be included in the application context.

    - @EnableAutoConfiguration: A class tells Spring to try automatically match beans
    based on priority. This reduces the need for boilerplate code explicitly identifying
    individual beans as dependencies.

    - @Primary: This annotation distinguishes the annotated bean as the default dependency
    of its type. This is used to resolve conflicts that arise from multiple bean definitions
    of the same type when same configuration is enabled.

    - @Qualifier: This annotation distinguishes the annotated bean or dependency declaration
    as a qualified bean or dependency. Qualified beans are considered for unqualified
    dependencies, but only matching beans are considered for qualified dependencies.
    You can read more about here.


    # Quiz Question


    Which of the following statements about Spring’s IoC Configuration are true:


    - The @Qualifier annotation helps Spring figure out which bean to use if there
    are multiple options.

    - The @Configuration annotation allows the current class to extend Spring’s ApplicationContext.


    # Further Research


    - Official Spring IoC Documentation

    - Official Spring Annotation-Based Configuration Documentation


    VIDEO 5:


    # Components and Services


    If we want to declare custom classes as Spring Components, the best way to do
    it is to make use of @ComponentScan, an annotation that tells Spring to search
    your code base for classes annotated with @Component. These classes automatically
    be instantiated as Spring beans, so there’s no need to define an @Bean-annotated
    method if you already have @Component on classes. There are other variants of
    @Component that identify specific roles for each component to play. We’ll see
    some examples of these in the coming lectures, but if you want to learn more,
    check out the link below.


    One thing to keep in mind is that @ComponentScan only marks the package outside
    of that package or its subpackages will be excluded by Spring. Here are the official
    Spring docs for @ComponentScan as well as the official Spring docs explaining
    how different stereotype annotations like @Component, @Service, @Repository, and
    others, function.


    ![](img/3a5769bea53a661ab8e4c8216af739d1_59_0.png)


    # Onion Architecture


    The above shows the basic structure of Onion Architecture. External requests must
    first pass through a layer of controllers or handlers whose only purpose is to
    handle these external requests. These controllers then use the next layer of the
    onion, to process the actions or actions triggered by the request. The services,
    in turn, use each other and the next layer, repositories and data access, to persist
    the results of the actions triggered by the request.


    # Key Terms


    - Onion Architecture: An architectural pattern in which an application is separated
    into nested layers. For a request to be processed by the application, it must
    first travel through an outer layer of external interfaces and controllers, then
    through a middle layer of services and business logic, and finally through a persistence
    layer of data access objects.

    - Application Component: In Spring, this is any @Component-annotated class that
    is instantiated by Spring and placed in Spring''s application context. Architecturally
    speaking, this is a logical unit of application - a single-purpose library or
    object that solves a particular problem application focuses.

    - Service: In Spring, this is any @Service-annotated class, handled identically
    to @Component-annotated class. The difference between the two semantics - a component
    is the most generic type of bean, and can be any kind of shared application structure.
    A service is specifically a collection of library methods that manage one aspect
    of application''s logic. A UserService would expose high-level actions related
    to the users, and an AuthenticationService would expose the middle layer of onion
    architecture, and should contain the bulk of application''s business logic.

    - Repository: In Spring, any @Repository-annotated class is treated identically
    to @Component-annotated one, but as with @Service, the semantics are different.
    In onion architecture, repositories the inner layer - each repository should act
    like an interface to a specific set of stored or persistent data. For example,
    a UserRepository would expose an interface capable create/read/update/delete and
    query operations on users table.


    VIDEO 6: COMPONENTS AND SERVICE


    # Question 1 of 2


    Which of the following statements about Spring Components are true:


    - @ComponentScan only looks for Component classes in the same package as yourSpringBootApplication


    # Question 2 of 2


    Consider a program that stores a list of Users and Shoes. We have the following
    components:


    - UserService- Provides methods to find and modify users, including setting the
    users’ current pair of shoes.

    - ShoeService- Provides methods to find and modify the inventory of shoes.

    - UserController- Provides REST endpoints for our webpage to request information
    about users, and set the user’s shoes.


    Which statements are probably true?


    - UserService beans have a reference to a ShoeService bean.

    - The ShoeService bean doesn’t have references to any of the other beans.


    VIDEO 7;


    # Exercise: Components and Services


    This exercise presents you with a small project whose Java classes depend on each
    other to get some work done. However, none of the classes have the Spring annotations
    we discussed in this lesson!


    To Do


    1. Your job is to figure out which classes need the various component annotations.

    2. You’ll also need to add an annotation so that Spring will perform the component
    scan that it can use to find the components and create Beans for them.

    3. All of the files you need to edit are already open for you. Remember that not
    all classes need annotations, only those that rely on accessing another object

