  - '[PAGE 148]


    Moving on to the remaining failing test, we saw that it was performing the exact
    same test as a previous successful test. This is usually a good sign that these
    tests rely on some data that needs to be initialized identically before each test.
    Indeed, we found that the data we initialized with an @BeforeAll-annotated method
    actually needed to be initialized before each test, not all of them, so we changed
    the @BeforeAll annotation to @BeforeEach.


    Finally, to verify that our tests wer not overlooking anything in our code base,
    we reran them with IntelliJ''s code coverage feature. This showed us that our
    tests were covering nearly all of the lines of code in the project, there was
    one method we weren''t testing at all. After adding a test for that method and
    re-running the test suite with coverage, we saw our entire codebase lit up in
    green. Nice!'
