    MVC and patterns it can be found throughout the software world. Think about the
    scenarios below and check the ones that employ a Model-View-Controller design.


    - A browser communicates with a web server, which updates information in a database
    and returns a response to the browser.

    - An operating system uses a file explorer to present the contents of its file
    to users.

    - A mobile game provides a touch-screen interface to communicate with a game server
    that updates game state in memory on the server.

    - A phone system that allows users to submit credit card payments through an automated
    menu.

    - A waitperson taking a customer order and relaying it to the kitchen, where food
    is prepared and brought back to the customer.


