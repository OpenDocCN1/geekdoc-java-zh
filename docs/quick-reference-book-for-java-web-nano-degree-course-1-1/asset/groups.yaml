    # Spring boot basics


    COURSE ONE LESSON - JAVA NANODEGREE ORIENTATION

    VIDEO ONE


    ## Welcome to Udacity!


    I am Sebastian, the founder of Udacity.


    Our mission is to power careers through tech education. We''re honored that you''ve
    chosen us to help in your career journey. Whether embarking on a new path, you''re
    curious about a new field, or advancing in your field, I want you to know, you''re
    in the right place. We are here to help you accomplish your goals.


    I can''t wait to see where this journey takes you!


    ## VIDEO TWO:

    UDACITY EXPERIENCE


    If this is your first Nanodegree program, welcome. If you have taken a Nanodegree
    program with us, you already know a little bit of what to expect. Udacity is always
    improving our learning experience for students. So you can watch this to see what
    is changed or skip ahead. You can also read this in the FAQ located in the resources
    tab.


    Let''s get started.


    We truly believe you couldn''t have chosen a better place to learn. A lot of people
    have worked tirelessly to create the course material and platform features, as
    we all want you to get the most of your learning journey. Our pledge is to provide
    you with resources and services that will further enable you to succeed in your
    Nanodegree program. As you go through the lessons, you may find some to be difficult
    and may feel discouraged. If this happens, we encourage you to take advantage
    of community channels and mentors to help clarify the concepts, or to share your
    doubts. Our mentors are here to help you! You will get advice and guidance to
    ensure you are on track to complete the projects. We WANT you to succeed and graduate
    with a Udacity Nanodegree certificate.


    We value the trust you have placed in us by making this investment in your future
    career. We take it seriously and we are here to help you achieve whatever you
    came here to accomplish.


    ## VIDEO THREE: TO SUCCEED VIDEO NO TEXT


    # LESSON PART TWO

    LESSON 1: GETTING HELP


    ## Getting Help


    As questions come up during this course, click on the Help button on the left
    sidebar of your classroom. You''ll see four options, each for a type of support:
    by:


    - **Technical Mentor Help:** Is available on Knowledge, our expert Q&A platform.
    You can search for answers to questions similar to yours or post new questions
    related to your project or lessons. Udacity''s expert mentors answer all new questions.

    - **Udacity Support Community:** Receive peer support and find answers to non-technical
    issues quickly through [Udacity Support Community](https). Receive peer support
    from our global community of lifelong learners that help each other by sharing
    their experience and expertise. Start a discussion [here](https).

    - **General Account Help:** This is where you can get details on non-technical
    issues such as 3rd party tools, billing, deadlines, and more. You can even find
    additional help here via live chat. simply click on Account Help or visit our
    [Help Center](https) to find answers.


    VIDEO: MENT HELP


    ## Mentor Help


    **Technical Mentor Support:** is provided through Knowledge, our expert Q&A platform.
    You can search for answers to questions similar to yours or post new questions
    related to your project or lessons. **Udacity''s expert technical mentors answer
    all-new questions.**


    ## How to Use Knowledge


    To ensure you''re getting the quality and prompt support you need, it''s helpful
    to follow these best practices and guidelines for Knowledge.


    ### Search for related questions


    ![](img/3a5769bea53a661ab8e4c8216af739d1_2_0.png)


    ### Filter for project-related questions


    Search for Similar Existing Questions: with tens of thousands of students enrolled
    in our programs, many of your questions may have already been asked and answered.
    To look for existing answers to similar questions that may provide the immediate
    support you need, use the filter on the left side of your screen to select your
    course and related project or write in the key terms related to your question
    in the search bar at the top of the page.


    **Ask a New Question:** if you want to ask a new question, select “Ask a Mentor”
    at the top of the page. Kindly remember that Knowledge is for technical questions
    only; for other types of support and feedback, please write to support at support@udacity.com.


    - When you ask a new question, the platform immediately assigns it to one of our
    expert mentors spread across the globe to ensure prompt replies. Of note, when
    a mentor answers your question, you will see “Mentor” next to their name to differentiate
    their support from comments your fellow learners may also provide.


    # Ask a Technical Mentor


    Question

    What are the differences between apples and oranges?


    Character limit: 0/150


    Details

    Please include all information that a technical mentor would need to answer your
    question, such as a code snippet and Github link. If you are encountering an error,
    please also include the output of the error message.


    Github or Project Link (Optional)

    https://


    Program

    Project


    Select...

    Select...


    Select your Nanodegree first.


    SUBMIT QUESTION


    If you don''t see your question, simply create a new post. You are likely to get
    an answer within 24 hours and you''ll be helping future students who may encounter
    the same problem.


    # How to Ask a Good Question?


    Students that follow these tips typically receive the strongest initial support
    and avoid back-and-forth with mentors:


    - **Ask Specific Questions:** if you have closely related questions that form
    part of a general theme, it''s okay to ask them all together. But consider using
    bullet points to separately list each of the questions in your post. Keeping your
    questions organized helps mentors provide clear answers to each specific question.
    If your questions are less connected, it''s best to submit new, separate questions
    for each one.

    - **Provide Details and Links:** explaining what (if anything) you''ve already
    attempted to solve the problem helps mentors know where to start when answering
    your question. Likewise, if your question is not related specifically to a project,
    but rather to an exercise, quiz, or lesson, it''s helpful to include information
    such as lesson or quiz name, screenshots, and classroom links.

    - Overall the key to asking a good question is to imagine yourself trying to answer
    your own question. Imagine you were coming to it without any prior knowledge.
    Does the question make complete sense? Are there gaps around the context?

    - **Start with a Clear Question Title:** attempt to summarize your entire question
    in one sentence. You may even write the title at the end, just before posting
    the question. This will help you summarize the issue before you include details
    in the question itself.

    - **Share Code Correctly:** by using the “Code Block” option to properly format
    your code. If your question concerns a piece of external code, include a link
    to the file on Github.

    - In fact, Github lets you create a link to a specific line in a file. To do so,
    just click to the left of the line number, and then select `permalink` in the
    ellipsis that appears in the margin. Paste the `permalink` right into the Github
    box on your question form.

    - **Figuring out Errors:** if your question is about an error message or stack
    trace, include the entire error message, by either formatting the error message
    using the “Code Block” option or creating a Gist or a Paste on Pastebin, including
    a link to it.

    - **Avoid Screenshots of Code or Error Messages:** do not use screenshots of code
    or error messages. They are hard to read and the text cannot be copied to debug
    it.

    - If you receive a helpful answer, kindly select it as the “accepted answer.”
    For questions from other students, if you see other helpful answers kindly select
    the “upvote” option. Conversely, if you don’t think an answer strongly answers
    a question, select the “downvote” option.


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_0.png)


    # 1 Answer


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_1.png)


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_2.png)


    # Getting Additional Support


    At times, students want support from a different mentor. As everyone learns differently,
    we want to make this a simple process for learners like you.

