  - "[PAGE 117]\n\nMyBatis provides a shallow ORM layer over JDBC (Java Database Connectivity).\
    \ That means it helps map your Java objects to queries that save and retrieve\
    \ data using JDBC.\n\nMyBatis is mostly used through interface definitions. MyBatis\
    \ automatically generates classes that implement the interface and makes them\
    \ available as Spring beans. This is an example interface that defines a MyBatis\
    \ Mapper.\n\n```\n@Mapper public interface User {\n  @Select(\"SELECT * FROM users\
    \ WHERE username = #{username}\")\n  User getUser(String username);\n}\n```\n\n\
    This code above uses #{username} to identify the username parameter. It's like\
    \ Thymeleaf parameters, but for SQL!\n\nFor more information on the template syntax\
    \ MyBatis for SQL, check out the official documentation. There are additional\
    \ annotations for @Insert, @Update, and @Delete as well. See the further research\
    \ section below the next video for more info on how to configure MyBatis.\n\n\
    # MyBatis Demo\n\n@Insert and @Options annotation\n\nThe @Insert annotation automatically\
    \ references attributes on the user object. username, firstName, lastName are\
    \ all referenced directly here, because they are attributes of the user object.\n\
    \n```\n@Mapper interface UserMapper {\n  @Insert(\"INSERT INTO USERS (username,\
    \ salt, password, firstName, lastname)\" +\n  \"VALUES(#{username}, #{salt}, #{password},\
    \ #{firstName}, #{lastname})\")\n  @Options(generatedKeys = true, keyProperty\
    \ = \"userId\")\n  int insert(User user);\n}\n```\n\nThis example also demonstrates\
    \ the @Options annotation. @Insert normally returns an integer that is the count\
    \ of rows affected. By using the @Options annotation, we're telling MyBatis that\
    \ we want to automatically generate a new key and put it in userId. Now the method\
    \ will return the new userId once the row has been inserted.\n\nAll we have to\
    \ do use these methods is inject beans for this interface into our services and\
    \ MyBatis will automatically create the code for the JDBC requests!"
