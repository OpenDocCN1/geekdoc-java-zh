    COURSE ONE

    LESSON ONE: INTRODUCTION TO SPRING BOOT


    VIDEO 1:


    # Meet Your Instructor


    # Meet Your Instructor: Peter Zastoupil


    Hi, everyone! My name is Peter Zastoupil.


    I''m an enterprise software developer and teacher at Cook Systems, an IT solutions
    and training company. My background includes many languages and tools, but Java
    and Spring are two of my oldest skills. I''m excited to share them with you!


    VIDEO 2:


    # Prerequisites


    To get the most out of this course, you should already be familiar with the basics
    of Java, SQL, and IDEs.


    If you''re looking to start with Java, Udacity has a free Java Programming Basics
    course, which as a bonus introduces IntelliJ IDEA as an IDE. Another resource
    is the Java Tutorials from Oracle. This is also an excellent reference, especially
    if you''re already familiar with another language and just to know what''s different
    in Java. That being said, we do expect you to be very familiar with Java in this
    course, so proceed at your own risk or check out Udacity''s Intro to Relational
    Databases, which you''ll learn to design and query SQL databases.


    If IntelliJ IDEA is new territory, you can take a look at the feature overview
    to get a sense of what''s possible. Note that we will be using the open-source
    Community Edition of IntelliJ in lessons. If you want to pay for the Ultimate
    Edition, it is free, but it is not required. If IDEs are new to you, check out
    the last lesson of Udacity''s Java Programming Basics for an introduction.


    VIDEO 3:


    # Introduction to Java Web Development with Spring Boot


    Web Development means building web applications, and in a standard web application,
    there are three main components:


    - Data Storage

    - Application Logic

    - Client Access


    By the end of the course, you''re going to learn how to build and manage each
    of those components in Java using Spring Boot.


    ## Data Storage


    Some of these will be responsible for interacting with the database. We will be
    using a SQL database called H2, which is an in-memory SQL database hosted by Spring
    Boot. You''ll learn to use MyBatis, a Java library for database interaction, to
    generate data-access beans, which will be used by other services in your application
    logic to satisfy client requests.


    ## Application Logic


    Application logic manages client access and database interaction. For this course,
    you''re going to learn how to use Spring Boot to maintain a collection of beans,
    which are small components of application logic that can interact with each other
    to carry out complex tasks.


    ## Client Access


    Client that will access our application is a web browser, which will send HTTP
    requests to our app and usually expects HTML in return. Using Spring MVC and Spring
    Security, libraries provided to us by Spring Boot, you''ll learn to create special
    beans called controllers that you can configure to respond to client requests
    and generate HTML responses. Controllers act as the entry points of your application,
    from a client''s perspective.


    ![](img/3a5769bea53a661ab8e4c8216af739d1_10_0.png)


    Architecture of a Web Application: Notice which Spring concepts intersect with
    which roles!


    VIDEO 4:


    # Why Java Web Development Matters


    Why Java Web Development Matters


    Learning web development is valuable because it''s how the digital apps and services
    that we use every day are built. Being able to visualize the architecture of a
    web application will make you a better developer and give you tools to use when
    turning an app idea into reality.


    Learning Java is valuable because it''s a widely-used industry mainstay, and it
    has a massive community of developers and open-source projects, like Spring Boot.
    Learning Spring Boot makes you a core Java library that supports and defines language-wide
    best practices. Mastery of Spring Boot will make you an excellent developer and
    expose you to the Java-standard solutions to a wide range of common problems.
    Learning to recognize those common problems will make you a better developer.
    Wherever whatever language you use, the same problems will arise, and you''ll
    know what kind of solutions to look for.


    VIDEO 5:


    # Business Stakeholders


    Who are the Stakeholders?


    On a professional development team, many people are involved in the choice of
    language and framework:


    - Developers who write the code.

    - Testers who write and run tests.

    - Designers who create prototypes for the developers to implement.

    - Project Architects who choose the technologies best suited to a project''s requirements

    - Business Analysts who write technical specifications for the developers to follow.

    - Project Managers who plan development efforts.


    This course is for anyone in these roles who is looking to do web development
    with Java and Spring.


    ![](img/3a5769bea53a661ab8e4c8216af739d1_12_0.png)


    # Business Analyst


    ![](img/3a5769bea53a661ab8e4c8216af739d1_12_1.png)


    # Technical Requirements


    # How the Choice of Java and Spring Affects Members of a Development Team


    VIDEO 6:


    # Spring vs Spring Boot


    ## Spring


    Spring is a framework that encompasses many useful Java libraries for web development.
    Spring includes numerous essential web development "components", such as database
    access, security, cloud deployment, web services, and many more.


    ## Spring Boot


    Spring Boot is a part of the Spring framework, which helps in rapid application
    development. Spring Boot helps to develop stand-alone and enterprise web applications.
    The advantage of using Spring Boot is that developers can get started with Spring''s
    core libraries with a minimum configuration setup. Therefore, Spring Boot helps
    to speed up application development.


    ## Spring versus Spring Boot


    Both Spring and Spring Boot frameworks help to build microservices-based web applications.
    Internally, the Spring Boot is built on top of the Spring framework. In general,
    the Spring (core module) takes care of the actions, such as:


    1. Inversion of Control (IoC)

    2. Dependency injection

    3. Common annotations

    4. Implements and provides the foundation for other frameworks, such as Thymeleaf,
    MyBatis, Spring MVC, and many others.


    Whereas, Spring Boot brings all the functionality of Spring and some additional
    advantages, such as:


    1. It can automatically configure Spring and third-party libraries

    2. It provides necessary dependencies to ease the build configuration


    This way, Spring Boot helps to speed up application development. It is a matter
    of software requirements to choose between Spring and Spring Boot frameworks.
    Either of the frameworks can be used to build microservices-based web applications.
    However, Spring Boot helps to get things faster.


    Don''t worry if you didn''t understand any terms used above; you will learn and
    practice each of them shortly in the few lessons.


    VIDEO 7:


    # When to Use Spring Boot

    When is Full-Stack Development with Spring Boot

    Appropriate?

