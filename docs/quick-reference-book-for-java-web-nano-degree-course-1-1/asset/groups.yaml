    # Spring 如何处理 IoC 配置。


    上图展示了 Spring 处理 IoC 配置的示例。

    通用步骤如下：


    - 首先初始化没有依赖的 bean，并将其放入应用上下文（application context）中。

    - 由 Spring 实例化一个服务（service），从上下文中获取第一个 bean 作为依赖注入，随后 Spring 将该服务放入应用上下文。

    - 最后，由 Spring 实例化另一个 bean，它获取之前的两个组件作为依赖注入，然后将新 bean 放入上下文中，应用程序完成完全初始化。


    # 核心术语


    - 配置文件（Configuration Files）：用于配置 Spring 运行部分内容的文件。有些嵌入在 Java 类中（如我们刚刚讨论过的），有些则是我们稍后将讨论的
    .properties、.yaml 和 .xml 文件。其中一些配置 IoC 上下文（如我们使用的那些），另一些配置 Spring 系统的抽象抽象。

    - 组件注解（Component Annotations）：用于标识供 Spring 管理的组件的注解。@Bean 和 @Configuration 是最近一个视频中的示例，在下一节中，我们还将讨论
    @Component 和 @Service。

    - 应用上下文（Application Context）：Spring 的应用上下文只是一个持有所有应用程序组件实例的数据结构。可以通过查询它在运行时访问特定组件，且
    Spring 利用它来解析依赖关系。

    - Bean（Beans）："Beans" 是 Spring 对通用组件的称呼，包括 Spring 存储在应用上下文中的任何值。bean 始终是一个对象或原始值。

    - 闭源系统（Closed System）：Spring 的应用上下文是一个闭源系统，这意味着它管理存储在其中的所有组件。无法手动实例化组件并保持与 Spring
    的关联——它永远无法感知 Spring 应用上下文内部的组件，反之亦然。

    - @SpringBootApplication：标注在 Spring Boot 项目主类上的注解。它是其他注解 @Configuration、@EnableAutoConfiguration
    和 @ComponentScan 的伙伴。

    - @Configuration：被标记了 @Configuration 注解的类会被 Spring 实例化并作为组件进行管理，但同时也作为一个工厂。该类中任何标记了
    @Bean 注解的方法都将用于创建新的 bean 并将其添加到应用上下。

    - @Bean：配置类中标记了 @Bean 注解的方法将用于 Spring 生成一个与方法返回类型相同的 bean。这使得开发者可以手动配置 bean 并将其包含在应用上下。

    - @EnableAutoConfiguration：该类告诉 Spring 尝试根据优先级自动匹配 bean。这减少了显式标识单个 bean 作为依赖的样板代码需求。

    - @Primary：此注解将被标记的 bean 标识为其类型的默认依赖。这用于解决当启用相同配置时，同类型多个 bean 定义产生的冲突。

    - @Qualifier：此注解将被标记的 bean 或依赖声明标识为限定的（qualified）bean 或依赖。对于未限定依赖，会考虑未限定 bean；但对于限定依赖，则仅考虑匹配的
    bean。你可以在此处阅读更多信息。


    # 测验


    关于 Spring 的 IoC 配置，以下哪些陈述是正确的：


    - @Qualifier 注解帮助 Spring 在存在多个选项时确定使用哪个 bean。

    - @Configuration 注解允许当前类扩展 Spring 的 ApplicationContext。


    # 进一步研究


    - Spring 官方 IoC 文档

    - Spring 官方基于注解的配置文档


    视频 5：


    # 组件与服务（Components and Services）


    如果我们想将自定义类声明为 Spring 组件，最好的方法是使用 @ComponentScan。这个注解告诉 Spring 在你的代码库中搜索标记了 @Component
    注解的类。这些类会被自动实例化为 Spring bean，因此如果你已经在类上使用了 @Component，就无需定义标记了 @Bean 注解的方法。存在
    @Component 的其他变体用于标识每个组件要扮演的特定角色。我们将在后面的课程中看到这些的一些示例，但如果你想了解更多，请查看下方的链接。


    需要注意的是，@ComponentScan 只标记所在的包，该包之外或其子包将被 Spring 排除。这里是 @ComponentScan 的 Spring
    官方文档，以及解释不同类型化注解（如 @Component、@Service、@Repository 等）如何工作的 Spring 官方文档。


    ![](img/3a5769bea53a661ab8e4c8216af739d1_59_0.png)


    # 洋葱架构（Onion Architecture）


    上面展示了洋葱架构的基本结构。外部请求必须首先通过控制器（controllers）或处理器（handlers）层，其唯一目的是处理这些外部请求。随后使用洋葱的下一层来处理请求触发的操作。相反，服务使用彼此以及下一层（存储库/repositories
    和数据访问）来持久化请求触发的操作结果。


    # 核心术语


    - 洋葱架构（Onion Architecture）：一种将应用程序分为嵌套层的架构模式。要让应用程序处理请求，必须首先通过外部接口和控制器的外层，然后通过服务和业务逻辑中间层，最后通过数据访问对象的持久化层。

    - 应用组件（Application Component）：在 Spring 中，指任何由 Spring 实例化并置于 Spring 应用上下文中的标记了
    @Component 注解的类。从架构上说，它是应用程序的逻辑单元——一个解决应用程序关注的特定问题的单用途库或对象。

    - 服务（Service）：在 Spring 中，指任何标记了 @Service 注解的类，其处理方式与标记了 @Component 注解的类相同。两者语义上的区别在于：组件是最通用的
    bean 类型，可以是任何种共享应用程序结构；而服务是库方法的特定集合，专门管理应用程序逻辑的一个方面。UserService 会暴露与用户相关的高级操作，AuthenticationService
    会暴露洋葱架构的中间层，并包含应用程序的大部分业务逻辑。

    - 存储库（Repository）：在 Spring 中，任何标记了 @Repository 注解的类都被视为与 @Component 标记的类，但与 @Service
    类似，语义是不同的。在洋葱架构中，存储库是内层——每个存储库都应该像是一个指向特定存储或持久化数据的接口。例如，UserRepository 会暴露一个能够对用户表进行创建/读取/更新/删除和查询操作的接口。


    视频 6：组件与服务


    # 问题 1，共 2 个


    关于 Spring 组件，以下哪些陈述是正确的：


    - @ComponentScan 只在与 SpringBootApplication 相同的包中查找 Component 类


    # 问题 2，共 2 个


    考虑一个存储用户（Users）和鞋子（Shoes）列表的程序。我们有以下组件：


    - UserService- 提供查找和修改用户的方法，包括设置用户当前的一双鞋。

    - ShoeService- 提供查找和修改鞋子库存的方法。

    - UserController- 为我们的网页提供 REST 端点，以请求用户信息并设置用户的鞋子。


    哪些陈述可能是正确的？


    - UserService bean 拥有对 ShoeService bean 的引用。

    - ShoeService bean 没有对任何其他 bean 的引用。


    视频 7；


    # 练习：组件与服务


    此练习为你向你展示了一个小型项目，其 Java 类之间相互依赖以完成某些工作。然而，没有任何类使用了我们在本节课中讨论的 Spring 注解！


    待办事项


    1. 你的任务是弄清楚哪些类需要各种组件注解。

    2. 你还需要添加一个注解，以便 Spring 执行组件扫描，从而能够找到组件并为它们创建 Bean。

    3. 所有你需要编辑的文件已经为你打开。记住，并不是所有类都需要注解，只有那些依赖于访问另一个对象的类才需要。'
