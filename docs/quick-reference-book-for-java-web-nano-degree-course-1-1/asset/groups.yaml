    >\n        <input type=\"submit\">\n    </form>\n    <h1>Hello, homepage!</h1>\n\
    \    <h1>I think that's enough!</h1>\n</body>\n```\n\n要完成此练习，你需要使用 Thymeleaf 完成四项任务：\n\
    \n1. 在表单中添加一个 action，使用 POST 请求重定向到 /animal，并将数据绑定到对象 `messageForm` 上。\n2. 将输入文本绑定到两个字段：`animalName`\
