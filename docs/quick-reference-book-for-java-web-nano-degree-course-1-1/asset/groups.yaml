- md: "\nSelenium also requires some initialization logic, setting up the web driver\
    \ and navigating to the correct URL to perform further actions. JUnit's @BeforeAll\
    \ annotation is perfect for initializing the web driver, and we can use the @BeforeEach\
    \ annotation to write a method that navigates to a common starting URL for all\
    \ tests in the class. Finally, since we need to make sure we quit the web driver\
    \ after our tests are finished, we can use JUnit's @AfterAll annotation to define\
    \ a method that takes care of that.\n\nSelenium provides another useful tool for\
    \ JUnit test organization - the Page Object. Page Object is a Java class that\
    \ is meant to represent a specific web page under test. We can use Page Objects\
    \ to reduce boilerplate when writing Selenium scripts, and as we will see in the\
    \ next video, we will use them to make our test code resemble the user stories\
    \ under test.\n\nFor the full lecture sample code from the previous videos, click\
    \ here\n\nIn the previous video, we looked at a simple counter application, with\
    \ text to display the current count, an increment button, and a reset button.\
    \ Our goal is to use JUnit and Selenium code to test all of the essential features\
    \ of the app are functioning correctly. First, though, we want a Selenium Page\
    \ Object to represent the page we're testing. Here's the CounterPage class from\
    \ the example:\n\n```java\npublic class CounterPage {\n    @FindBy(id = \"count-display\"\
    )\n    private WebElement countDisplay;\n\n    @FindBy(id = \"increment-button\"\
    )\n    private WebElement incrementButton;\n\n    @FindBy(id = \"reset-value-field\"\
    )\n    private WebElement resetField;\n\n    @FindBy(id = \"reset-button\")\n\
    \    private WebElement resetButton;\n\n    public CounterPage(WebDriver driver)\
    \ {\n        PageFactory.initElements(driver, this);\n    }\n\n    public int\
    \ getDisplayedCount() {\n        return Integer.parseInt(countDisplay.getText());\n\
    \    }\n\n    public void incrementCount() {\n        incrementButton.click();\n\
    \    }\n\n    public void resetCount(int value) {\n        resetField.clear();\n\
    \        resetField.sendKeys(String.valueOf(value));\n        resetButton.click();\n\
    \    }\n}\n```\n\nThere are three main sections to this, and any, Page Object:\n\
    \n## Defining Element Selectors\n\n```java\n@FindBy(id = \"count-display\")\n\
    private WebElement countDisplay;\n\n@FindBy(id = \"increment-button\")\nprivate\
    \ WebElement incrementButton;\n\n@FindBy(id = \"reset-value-field\")\nprivate\
    \ WebElement resetValueField;\n\n@FindBy(id = \"reset-button\")\nprivate WebElement\
    \ resetButton;\n```\n\nThe goal of a Page Object is to simplify and abstract away\
    \ finding elements on the page. Previously we did this with driver.findElement\
    \ and driver.annotatedElements, but in a Page Object, we can take a much Spring-like\
    \ approach by declaring annotated fields the elements we want to capture on the\
    \ page. These element selectors will be automatically processed by Selenium, but\
    \ we have to kick that process off ourselves - which we do in the next section:\n\
    \n## Initializing Elements in the Constructor\n\n```java\npublic CounterPage(WebDriver\
    \ driver)\n{\n    PageFactory.initElements(driver, this);\n}\n```\n\nIn this example,\
    \ we declare a WebDriver as the only constructor argument, and call PageFactory.initElements()\
    \ with the driver and this keyword as arguments. This shorthand to tell Selenium\
    \ the given driver to initialize the @FindBy-annotated fields in the class. In\
    \ principle, we could do this somewhere else, but as we will see in the next video,\
    \ initializing a Page Object in this constructor like is pretty flexible and clean.\n\
    \nBy adding this constructor, whenever we create a new CounterPage object, Selenium\
    \ will automatically find and capture the elements declared, reducing a bunch\
    \ of similar calls to driver.findElement to a single new CounterPage() instantiation.\
    \ Once we have those elements, we can move on to the next section:\n\n## Creating\
    \ Helper Methods\n\n```java\npublic int getDisplayedCount() {\n    return Integer.parseInt(countDisplayText.getText());\n\
    }\n\npublic void incrementCount() {\n    incrementButton.click();\n}\n\npublic\
    \ void resetCount(int value) {\n    resetField.clear();\n    resetField.sendKeys(String.valueOf(value));\n\
    \    resetButton.click();\n}\n```\n\nNow that our Page Object has selected elements\
    \ from the page it represents, we can define helper methods that encapsulate common\
    \ tasks for the page. In this counter example, we need be be able to read the\
    \ current count from the screen, we need to be able to increment the count, and\
    \ we need to reset the counter. Notice that I didn't mention any specific elements\
    \ to describe the functionality of these actions - while we have to be specific\
    \ in our implementation of these methods, as you see in the code above, the goal\
    \ of writing these helpers is to perform the action on the class from the specific\
    \ element interactions required to fulfill that action. In some ways, this is\
    \ another instance of separation of concerns - by hiding the implementation details\
    \ in these methods, if the HTML of the page changes, we don't have to update anything\
    \ except the code inside this class - the tests that will use this class can just\
    \ continue to call the same methods they did before.\n\nSpeaking of tests - now\
    \ we've set up the CounterPage class, we can finally implement some tests for\
    \ this app.\n\nFor the lecture sample code from the previous videos, click here\n\
    \nHere's the full JUnitTest class from the previous video:\n\n```java\n@SpringBootTest(webEnvironment\
    \ = SpringBootTest.WebEnvironment.RANDOM_PORT) \nclass UserTestingApplicationTests\
    \ {\n    @LocalServerPort\n    private Integer port;\n\n    private static WebDriver\
