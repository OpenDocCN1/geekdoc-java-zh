  mdcn: "\n@Test\n@AfterAll\n\n# 问题 2，共 2\n\n想象我们正在为之前在 /animals 页面上做的练习创建一个 JUnit\
    \ 测试。我们想要多次提交表单，并确保在进行第 5 次提交时消息发生了发生了变化。哪些 JUnit 和 Selenium 组件可以帮助我们编写此测试？\n\n\
    - * \n- * \n- *\n- * : \n\nVIDEO 18:\n\n# 页面加载时间\n\n> 勘误 - 在上面的视频中，传递给 `WebDriverWait()`\
    \ 构造函数的时间参数是秒而不是毫秒。更多信息和示例请参考 `WebDriverWait` 文档。\n\n# 问题 1，共 2\n\n使用 Selenium\
    \ 时，如果页面加载需要一段时间，我们需要确保驱动程序在搜索页面上可能不存在的元素之前等待？\n\n- * \n- ● 问题 2，共 2\n\n以下解决方案中，哪种是在开始\
    \ Selenium 测试之前等待页面加载的最佳方法？\n\n- * \n- ● 在现实世界中，事情变得复杂且迅速。没有地方比在自动化用户测试时考虑页面加载时间更能体现这一点了。\n\
    \n在 Web 端，页面加载时间可能取决于不同的互联网提供商、页面需要加载的资源大小、服务器处理请求的速度等。要准确预测页面何时加载完成几乎是不可能的，这给测试带来了问题；如果我们要求\
    \ Selenium 在页面加载完成之前查找页面上的元素，它将失败，我们可能会面临诸大的 `NullPointerException` 或 `StaleElementReferenceException`。在延迟重新加载的情况下，可能会出现\
    \ `StaleElementReferenceException`。\n\n我们如何在要求 Selenium 查找元素之前确保该元素在页面上呢？\n\n\
    答案是使用 `WebDriverWait`，这是 Selenium 为此目的提供的一个类。让我们来看下面的代码：\n\n```\nWebDriverWait\
    \ wait = new WebDriverWait(driver, 10);\nWebElement marker = wait.until(driver\
    \ ->\ndriver.findElement(By.id(\"page-load-marker\")));\n```\n\n在这个示例中，我们创建了一个超时时间为秒的新的\
    \ `WebDriverWait`。`WebDriverWait` 定义了一个名为 `until` 的方法，我们在下一行使用它，让 Selenium 暂停，直到找到指定的元素或达到超时。\n\
    \n这非常有用，因为我们现在可以确保 Selenium 以结构化的方式等待并继续\n\n# 进一步研究\n\n- Selenium 官方等待指南\n\nVIDEO:\
    \ 19:\n\n# 练习：最终回顾\n\n在这次最终回顾中，你将使用 JUnit 和 Selenium 为你的聊天应用添加自动化用户测试。目标是测试至少一个端到端用户操作流：使用\
    \ Selenium 自动化浏览器注册新用户、以该用户登录、提交聊天消息，并验证新提交的消息是否显示在页面上，且带有正确的消息文本和用户名。为了实现这一点，你需要完成几件事：\n\
    \n向项目添加 Selenium 和 WebDriver 依赖项。JUnit 默认包含在通用的 Spring Boot 项目中，但 Selenium 和 WebDriver\
    \ 并不是。在你的 `pom.xml` 中添加以下依赖项\n\n```xml\n<dependency>\n  <groupId>io.github.bonigarcia</groupId>\n\
    \  <artifactId>webdrivermanager</artifactId>\n  <version>3.8.1</version>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.seleniumhq</groupId>\n  <artifactId>selenium-java</artifactId>\n\
    </dependency>\n```\n\n**为我们使用的 HTML 模板创建页面**。为了测试我们的注册/登录/消息提交流，我们将为 `signup.html`、`login.html`\
    \ 和 `chat.html` 模板实现单独页面对象（Page Objects）。如果你喜欢，可以按照我们的示例来组织它们；或者如果你有想尝试的组织方式的想法，你也可以那样做。页面对象是灵活的，可以让你的生活更简单，所以如果你能为这些页面对象想出对你有帮助的功能，尽管去写吧！\n\
    \n**编写至少一个高级 JUnit 测试**，来测试我们用户的注册、登录和第一条消息。使用你创建的页面对象，编写一个高级 JUnit 测试来注册一个新用户，在他们聊天时发送一条新消息，并断言屏幕上显示的用户名和消息文本是否与新用户的用户名及其提交的文本匹配。你还需要在正在编写的\
    \ JUnit 测试类中编写 Spring Boot 测试和网络驱动设置代码——你可以参考这些示例来查看我们之前是如何做的。\n\n**[加分项] 编写另一个高级测试**，验证两个用户可以互相聊天并在双方接收到相同的消息。这要求你已经完成了上一节课的加分任务，实现一个注销按钮。当只有一个在使用聊天应用程序时，它是孤独的，在任何应用程序中添加更多用户可能会发现一些意外的\
    \ Bug。编写一个测试来验证你的应用可以支持多个用户！\n\n**运行你的测试并验证应用按预期运行**；如果运行异常，识别问题并解决它，通过重新运行测试来验证你的解决方案。这应该是不言自明的——编写测试的目的是发现你代码中的错误。如果你发现了一些错误，修复它们，重新运行测试并反复尝试修复错误，直到所有测试通过。\n\
    \n# 最终回顾练习\n\n是时候为我们的聊天应用添加自动化用户测试了！根据下方的任务更新你之前的最终项目，并参考上方的指令以获取高级目标和代码段。\n\n\
    # 任务列表\n\n- * \n- * \n\nVIDEO: 20:\n\n# 解决方案：最终回顾\n\n在最终回顾中，你将使用 JUnit 和 Selenium\
    \ 为你的聊天应用添加自动化用户测试。目标是测试至少一个端到端用户操作流：使用 Selenium 自动化浏览器注册新用户、以该用户登录、提交聊天消息，并验证新提交的消息是否显示在页面上，且带有正确的消息文本和用户名。\n"
