    - 所有用户操作和视图更新都以 HTTP 请求和响应对象的形式交换。控制器负责选择模板并填充模型数据。


    # 问题 2（共 2 个）


    MVC 及其模式遍布整个软件世界。考虑下面的场景，并勾选采用模型-视图-控制器设计的项。


    - 浏览器与 Web 服务器通信，服务器更新数据库中的信息并向浏览器返回响应。

    - 操作系统使用文件管理器向用户展示其文件内容。

    - 移动游戏提供触屏界面以与游戏服务器通信，服务器在服务器内存中更新游戏状态。

    - 一种允许用户通过自动菜单提交信用卡支付的电话系统。

    - 服务员接受顾客订单并将其传给厨房，食物在厨房被准备好并送回顾客。


    视频 6:


    # 模板 # 使用 Thymeleaf 的 HTML 模板


    Spring MVC 数据流的本质 - 控制器必须为它想要渲染的模板提供数据 - 意味着通常在设计一个新的面向用户的功能时，从模板开始是很有意义的。


    Thymeleaf 是我们在本节课程中使用的 HTML 模板引擎，这意味着它是一个可以获取模板、数据模型，并将它们结合以生成最终 HTML 文档的库。


    Thymeleaf 将数据模型应用于模板的方式是基于我们在模板中添加的 Thymeleaf 属性，例如上一节 MVC 课程中的 `th:text`。这些属性可以具有复杂的表达式作为值，这些表达式由
    Thymeleaf 处理：即所提供的数据模型上下文。在下一个视频中，我们将看看这些属性和表达式可以实现的一些效果！


    # 更多问候！


    [点击此处获取本节课程的完整课程示例代码]


    除了设置文本值外，我们还可以使用 Thymeleaf 属性在模板中执行基本的控制流。模板中两种主要的控制流类型是迭代和条件渲染。


    迭代 - Thymeleaf 模板的工作方式与 Java 中的增强 for 循环非常相似。模板迭代中使用的主要属性是 `th:each`，它的用法如下所示：


    ```

    <h th:each="${greetings}" th:text="${msg}">Hello, homepage</h>

    ```


    我们可以将属性 `th:each="${greetings}"` 读为“对于 greetings 中的每个 msg”，它本质上意味着“为 greetings
    集合中的每个值重复渲染此元素，并对于任何需要关联值的表达式 msg，使用该元素 msg”。


    在这个示例中，`h` 标签将被重复渲染，为 greetings 中的每个元素渲染一次，而由 `th:text="${msg}"` 渲染的文本将是正在渲染的
    greetings 的当前元素。如果 greetings 包含字符串 "Hi" 和 "Hello"，最终渲染结果将是：


    ```

    <h1>Hi</h1>

    <h1>Hello</h1>

    ```


    Thymeleaf 中的条件渲染通常看起来像 Java 中的 `if` 语句（statement），或者偶尔像 `switch` 语句（switch statement）。我们在示例中检查的属性是
    `th:unless`，如下所示：


    ```

    <h th:unless="${msg.contains(''goodbye'')" th:text="${msg}">Hello, homepage</h

    ```


    在这种情况下，如果 msg 包含字符串 "goodbye"，则 `h` 标签将不会被渲染。这在选择是否渲染错误消息时特别有用。如果你需要相反的条件，例如在这种情况下只显示包含
    "goodbye" 的消息，你可以简单地将 `th:unless` 替换为 `th:if`。


