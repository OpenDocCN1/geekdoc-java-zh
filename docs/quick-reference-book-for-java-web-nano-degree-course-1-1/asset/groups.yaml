    \ with JUnit and Selenium to your chat application. The goal is to test at least\
    \ one end-to-end user action flow: using Selenium, automate the browser to register\
    \ a new user, log in as that user, submit a chat message and verify that the newly-submitted\
    \ message shows up on the page with the correct message text and username attached.\n\
