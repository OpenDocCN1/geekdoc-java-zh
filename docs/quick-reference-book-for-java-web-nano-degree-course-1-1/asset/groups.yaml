    ## 术语表


    - ORM: 对象关系映射。描述一组可以在数据库和应用程序表示之间转换数据的技术的set的通用术语。

    - JDBC: Java 数据库连接 API，它是用于从 Java 发起 SQL 请求的规范。

    - MyBatis: 基于 JDBC 之上的 ORM，它能自动生成执行 SQL 语句的代码并将结果映射到 Java 对象。

    - Mapping（映射）：在 Java 类的字段与 SQL 表的列之间建立关系。

    - One to One（一对一）：两个对象之间的关系，每边有一个实体。

    - Many to Many（多对多）：两个对象之间的关系，每个实体的多个副本都可以与另一个实体的多个副本相关。

    - @Select, @Insert, @Update, @Delete: 代表要执行的 SQL 语句的注解。每个注解接受一个对应类型的字符串。例如，@Select
    注解接受一个 SQL 语句的字符串。

    - @Options: 提供访问 JDBC 语句开关和配置的注解。

    - Onion Pattern（洋葱模型）：有时称为分层架构、多层架构或 n 层架构。这是一种将应用程序区域分为控制器、服务和数据层（有时还有更多）的设计模式。

    - Encryption（加密）：在存储数据之前修改数据，意在使用另一种算法将数据恢复到所需的原始形式。

    - Hashing（哈希）：在存储数据之前修改数据，意在永远不恢复其原始形式。修改后的数据将与其他修改后的数据进行比较。

    - Salt（盐）：在哈希时与输入字符串结合的随机数据，以便生成的哈希值对于每行都是唯一的。这意味着两个具有相同密码的用户在数据库中的哈希值将不同。


    '
