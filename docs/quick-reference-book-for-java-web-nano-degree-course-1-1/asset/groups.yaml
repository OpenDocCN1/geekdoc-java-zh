    ## Glossary


    - ORM: Object-Relational Mapping. A general term describing a set of technology
    that can convert data between database and application representation.

    - JDBC: Java Database Connectivity API, which is a specification for making SQL
    requests from Java.

    - MyBatis: A ORM over JDBC that automatically generates code to execute SQL statements
    and maps results to Java objects.

    - Mapping: Drawing a relationship between a field in Java class and a column in
    SQL table.

    - One to One: A relationship between two objects in which one entity is on each
    side.

    - Many to Many: A relationship between two objects in which multiple copies of
    each entity can be related to multiple copies of the other.

    - @Select, @Insert, @Update, @Delete: Annotations representing SQL statements
    to be executed. Each annotation takes a string for the corresponding type. For
    example, a @Select annotation takes a string for a SQL statement.

    - @Options: Annotation providing access to switches and configuration for JDBC
    statements.

    - Onion Pattern: Sometimes called Tiered Architecture, Multi-tiered Architecture,
    or n-tiered architecture. This is a design pattern that separates areas of the
    application into controller, service, and data layers (and sometimes more).

    - Encryption: Modifying data before storing it, with the intention of using another
    algorithm to return the data to its original form it needs to be.

    - Hashing: Modifying data before storing it with the intention of never returning
    it to its original form. The modified data will be compared to other modified
    data.

    - Salt: random data that is combined with the input string when hashing so that
    the resultant hashed values are unique for each row. This means that two users
    with the same password would not have the same hash in the database.

