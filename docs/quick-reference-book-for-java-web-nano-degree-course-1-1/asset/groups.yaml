    \ data. As before, there are two main components to\nthis, on the template side,\
    \ or on the controller side.\n\nOn the template side, we need to define input\
    \ fields for each piece of data we want to\ncapture, and a <form> element to group\
    \ them. When the form is submitted, the data\nwill be encoded in the HTTP request\
    \ that is sent, and can be extracted on the Spring\nside."
  - "[PAGE 91]\n\nOn the Spring side of things, we need to define a POJO to hold the\
    \ form data. We'll look at code details in the next video, but by defining this\
    \ POJO we can pre-fill the form by setting its fields and adding it as a Model\
    \ attribute when first rendering the template, and Spring can automatically extract\
    \ the request data into POJO when the form is submitted. Let's see how that works!\n\
    \n# User-Inputted Data\n\nFor the full lecture sample code in the previous video,\
