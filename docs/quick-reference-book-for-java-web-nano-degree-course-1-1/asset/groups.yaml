    width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0\"\
    >\n    <meta http-equiv=\"X-UA-Compatible\" content=\"ie=edge\">\n    <title>Animal</title>\n\
    </head>\n<body>\n    <form action=\"#\">\n        <label for=\"animalText\">输入动物：\
    \ </label>\n        <input type=\"text\" id=\"animalText\" name=\"animalText\"\
    >\n        <label for=\"adjective\">输入形容词</label>\n        <input type=\"text\"\
    \ id=\"adjective\" name=\"adjective\">\n        <input type=\"submit\">\n    </form>\n\
    \    <h1>Hello, homepage!</h1>\n    <h1>I think that's enough!</h1>\n</body>\n\
    </html>\n```\n\n## 解决方案：将控制器到模板\n\n这是完成此任务的 `<body>` 部分，将控制器连接到模板：\n\n```html\n\
    <body>\n    <form action=\"#\" th:action=\"@{'/home'}\" th:object=\"${messageForm}\"\
    \ method=\"POST\">\n        <label for=\"animalText\">输入动物： </label>\n       \
    \ <input type=\"text\" id=\"animalText\" name=\"animalText\" th:field=\"*{animalName}\"\
    >\n        <label for=\"adjective\">输入形容词</label>\n        <input type=\"text\"\
    \ id=\"adjective\" name=\"adjective\" th:field=\"*{adjective}\">\n        <input\
    \ type=\"submit\">\n    </form>\n    <h1>Hello, homepage!</h1>\n    <ul th:if=\"\
    ${lists.size(greetings) <= 5}\">\n        <li th:each=\"msg : ${greetings}\" th:text=\"\
    ${msg}\"></li>\n    </ul>\n    <h1 th:unless=\"${lists.size(greetings) > 5}\"\
    >I think that's enough!</h1>\n</body>\n```\n\n- 我们使用了 `th:action` 设置操作。\n- 我们使用了\
    \ `th:object` 处理 `messageForm`。\n- 我们使用了 `th:field` 处理输入。\n- 我们使用了 `th:each` 处理列表。\n\
    - 我们使用了 `th:text` 处理消息。\n- 我们使用了 `th:if` 处理条件。\n- 我们使用了 `th:unless` 处理条件。\n\n\
