    # Spring Boot 基础


    第一课程 第一课 - JAVA 纳米学位导向

    视频一


    ## 欢迎来到 Udacity！


    我是 Sebastian，Udacity 的创始人。


    我们的使命是通过技术教育助力职业发展。我们非常荣幸你选择我们来帮助你开启职业之旅。无论是开启新路径、对新领域充满好奇，还是在你的专业领域不断进步，我都想让你知道你来对地方了。我们在这里帮助你实现目标。


    我迫不及待看到这段旅程将你带向何方！


    ## 视频二：

    UDACITY 体验


    如果这是你的第一个纳米学位课程，欢迎你。如果你在我们这里参加过纳米学位课程，你已经对预期有所了解。Udacity 一直改进学生的学习体验。因此，你可以观看此视频了解变化，或者直接跳过。你也可以在资源选项卡中的常见问题（FAQ）中阅读内容。


    让我们开始吧。


    我们深信，你找不到比这里更好的学习地了。许多人付出了努力创建课程材料和平台功能，因为我们都希望你从学习之旅中获益最多。我们的承诺是为你提供资源和支持，进一步帮助你在纳米学位课程中取得成功。在学习课程期间，你可能会发现某些内容很难，并感到沮丧。如果发生这种情况，我们鼓励你利用社区渠道和导师来帮助澄清概念或分享你的疑问。我们的导师在这里为你提供帮助！你将获得建议和指导，确保你按计划完成项目。我们**想要**你成功并获得
    Udacity 纳米学位证书。


    我们非常重视你对未来职业的投资以及对对的信任。我们会认真对待，并帮助你实现来到此地的任何目标。


    ## 视频三：成功视频（无文本）


    # 第二部分

    第 1 节：获取帮助


    ## 获取帮助


    在课程过程中遇到问题时，点击教室左侧栏上的“帮助”按钮。你会看到四个选项，每个选项对应一种支持类型：


    - **技术导师帮助（Technical Mentor Help）：** 在我们的专家问答平台 Knowledge 上提供。你可以搜索与其类似的问题的答案，或发布与你的项目或课程相关的新问题。Udacity
    的专家导师会回答所有新问题。

    - **Udacity 支持社区：** 通过 [Udacity 支持社区](https) 获取同伴支持，并快速找到非技术问题的答案。从我们全球终身学习者社区获得同伴支持，他们通过分享经验和专业知识互相帮助。点击[此处](https)
    发起讨论。

    - **通用账户帮助：** 在这里你可以获取非技术问题的详细信息，如第三方工具、账单、截止日期等。你甚至可以通过在线聊天在此获得额外帮助。只需点击“账户帮助”（Account
    Help）或访问我们的[帮助中心](https)即可找到答案。


    视频：导师帮助（MENT HELP）


    ## 导师帮助


    **技术导师支持：** 通过我们的专家问答平台 Knowledge 提供。你可以搜索与其类似的问题的答案，或发布与你的项目或课程相关的新问题。**Udacity
    的专家技术导师会回答所有新问题。**


    ## 如何使用 Knowledge


    为了确保你获得所需的优质及时支持，遵循以下 Knowledge 的最佳实践和指南将非常有帮助。


    ### 搜索相关问题


    ![](img/3a5769bea53a661ab8e4c8216af739d1_2_0.png)


    ### 过滤项目相关问题


    搜索相似的现有问题：由于我们的课程中有数万名学生，你的很多问题可能已经有人提过并回答了。要寻找可能提供即时支持的相似问题的现有答案，请使用屏幕左侧的过滤器选择你的课程和相关项目，或在页面顶部的搜索栏输入与你的问题相关的关键词。


    **提出新问题：** 如果你想提一个新问题，请选择页面顶部的“咨询导师”（Ask a Mentor）。请记住，Knowledge 仅用于技术问题；对于其他类型的支持和反馈，请发送邮件至
    support@udacity.com。


    - 当你提一个新问题时，平台会立即将其分配给遍布全球的专家导师之一，以确保及时回复。请注意，当导师回答你的问题时，你将在名字旁边看到“Mentor”字样，以便将其支持与其他同学可能提供的区分区分来。


    # 咨询技术导师


    问题

    字符限制：0/150


    详情

    请包含技术导师回答你的问题所需的所有信息，例如代码片段和 Github 链接。如果你遇到错误，请也包含错误消息的输出。


    Github 或项目链接（可选）

    https://


    程序

    项目


    选择...

    选择...


    请先选择你的纳米学位。


    提交问题（SUBMIT QUESTION）


    如果你没有看到你的问题，只需创建一个新帖子。你可能会在 24 小时内获得答案，并将帮助可能遇到相同问题的未来学生。


    # 如何提一个好问题？


    遵循这些提示的学生通常能获得最有力的初始支持，并避免与导师反复来回：


    - **提具体的问题：** 如果你有属于一个通用主题的密切问题，可以一起提问。但考虑使用项目符号在帖子中单独列出每个问题。保持问题有序有助于导师为每个特定问题提供清晰的答案。如果你的问题关联较小，最好为每个问题提交新的独立问题。

    - **提供细节和链接：** 解释你已经尝试过解决问题的方法（如果有的话），有助于导师在回答你的问题时知道从何处。同样，如果你的问题不是专门针对某个项目，而是针对练习、测验或课程，包含课程或测验名称、截图和教室链接会有帮助。

    - 总的来说，提好问题的关键在于想象你自己正在尝试回答自己的问题。想象你是在没有任何先验知识的情况下来看它的。这个问题逻辑完全通吗？上下文是否存在缺失？

    - **以清晰的问题标题开始：** 尝试用一句话总结你的整个问题。你甚至可以在发布问题前的最后写下标题。这将帮助你在问题本身中包含细节之前总结问题。

    - **正确共享代码：** 使用“代码块”（Code Block）选项来正确格式化你的代码。如果你的问题涉及部分外部代码，请包含 Github 上文件的链接。

    - 事实上，Github 允许你创建指向文件中特定行的链接。只需点击行号左侧，然后在侧边栏出现的省略号（...）中选择 `permalink`（永久链接）。将
    `permalink` 直接粘贴到问题表单的 Github 框中。

    - **排查错误：** 如果你的问题是关于错误消息或堆栈跟踪，请包含整个错误消息，可以通过使用“代码块”选项格式化错误消息，或者创建一个 Gist 或粘贴到
    Pastebin 并包含其链接。

    - **避免代码或错误消息的截图：** 不要使用代码或错误消息的截图。它们难以阅读，且文本无法复制进行调试。

    - 如果你收到了有用的答案，请将其选为“采纳答案”（accepted answer）。对于同学的问题，如果你看到了其他有用的答案，请选择“赞同”（upvote）。相反，如果你认为某个答案没有很好地回答问题，请选择“踩”（下vote）。


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_0.png)


    # 1 个答案


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_1.png)


    ![](img/3a5769bea53a661ab8e4c8216af739d1_6_2.png)


    # 获取额外支持


    有时，学生希望获得不同导师的支持。由于每个人的学习方式不同，我们希望让像你这样的学习者这一过程变得简单。


    '
