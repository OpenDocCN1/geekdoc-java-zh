  - "[PAGE 138]\n\n# The Test-Driven Development Lifecycle\n\nThe figure above shows\
    \ the test-driven development lifecycle. First, there is an idea for a new feature.\
    \ That feature idea is turned into a series of user stories, which are then turned\
    \ into tests, which fail because the feature does not exist yet. The developers\
    \ then work on the feature's code requirements until all of the tests pass, and\
    \ the cycle begins again.\n\nTesting is an important and highly desired part of\
    \ the software development process. In a world where uptime and user retention\
    \ means everything, it's important to validate that your application actually\
    \ does what it's supposed to do before it goes into production.\n\nThe standard\
    \ accepted way to enforce this is by adopting a test-driven development lifecycle,\
    \ or TDD. In this model, the \"red green\" philosophy is dominant - tests should\
    \ be written before the feature to be tested, meaning that they start off failing\
    \ - aka, the tests \"red\". Then, as the feature is implemented, one test after\
    \ another should start to pass - aka, become \"green\".\n\nTo facilitate this\
    \ approach, it's useful to have a standard way to describe features or requirements\
    \ to be tested. For this, we turn to the concept of a \"user story.\" A user story\
    \ describes the functionality a feature should have from the perspective of a\
    \ user interacting with it. Typically, the format of a user story is:\n\n**As\
    \ a user, I can take some action in order to achieve some goal.**\n\nOften a feature\
    \ will be broken up into many user stories, each of which should correspond to\
    \ at least one test to be implemented for that feature. If all the tests pass,\
    \ it means that all of the user stories are successfully implemented, and the\
    \ feature is complete.\n\n# Key Terms\n\n+   * **Test Driven Development**: a\
    \ software development methodology that emphasizes writing tests before the code\
    \ to be tested. This gives developers a roadmap to success - once all the tests\
    \ are passing, the feature is complete!\n* **User Story**: User stories are short\
    \ sentences derived from feature requirements in the format of As a user, I can\
    \ in order to . These are used to create tests to verify the components of a feature.\n\
    \n# Quiz Question\n\nWhich of the following requirements are testable?\n\n+  \
    \ * \n*\n*"
  - "[PAGE 139]\n\nVIDEO 3:\n\n# Testing\n\nThere are many different types of tests\
    \ meant to validate different types of features and different layers of an application.\
    \ In this course, we're going to focus on two specific types of tests: Unit tests\
    \ and integration tests.\n\nUnit tests are meant to test a single unit or component\
    \ of an application or process - these tests should be simple, and verify that\
    \ a specific method, component, or process acts as expected according to its inputs.\
    \ Sometimes you'll also use unit tests to verify that your test fails predictably,\
    \ well; it's good to test both positive and negative conditions in a unit test!\n\
    \nIntegration tests are the next layer over unit tests. Instead of testing a single\
    \ unit of an application, they test multiple units and how they integrate with\
    \ one another. Often, an integration test will validate an entire user story,\
    \ for example, while a unit test will validate a single step in the process user\
    \ story.\n\nThe rule of thumb is that unit tests should be used to test invariants\
    \ - conditions that do not change - and integration tests should be used to test\
    \ user actions and entire process flows.\n\n# Key Terms\n\n+   **Unit Tests**:\
    \ A unit test only validates the smallest unit of a computational process. That\
    \ might mean a test of a single method, a single component in an application.\n\
    - **Invariants**: An invariant is a law of computation, something that shouldn't\
    \ change despite changing circumstances. For example, adding 0 to a number should\
    \ always result in the original number, and dividing by 0 always result in an\
    \ error.\n- **Integration Tests**: Integration tests are intended to validate\
    \ the operation of multiple application components as they interact with each\
    \ other - or integrate with one another.\n\n# Question 1 of 2\n\nConsider the\
    \ earlier requirement: “As a user, I can click on the \"schedule\" button of the\
    \ schedule delivery model to save the time and address selected in the window.\"\
    \n\nWould this require a Unit Test or an Integration Test?\n\n+   - \n- Integration\
    \ Test\n-\n\n# Question 2 of 2"
  - "[PAGE 140]\n\nOnce more consider the same requirement as above: “As a user, I\
    \ can click on the \"schedule\" button of the schedule delivery modal to save\
    \ the time and address selected in the window.\n\nWhat are the environment requirements\
    \ for testing this change?\n\n+   * \n* . .\n\nVIDEO 4:\n\n# Testing with standard\
    \ JUnit\n\nJUnit is the standard Java testing framework, and despite its name,\
    \ it is capable of much more than unit tests. JUnit expects all tests for an application\
    \ to be collected in class files, just like any other Java code.\n\n# Annotations\n\
    \nJUnit provides an annotation, @Test, that can be placed on a method in a test\
    \ class to declare a single test. Each method annotated like this can be executed\
    \ individually, or in a group - and in both cases, JUnit will generate a report\
    \ that lists each test that was run, and whether it was successful or not.\n\n\
    In order for JUnit to know if a test is successful or not we need to use assertions.\
    \ @Test-annotated methods should not have a return value! Instead, we can use\
    \ special methods provided by JUnit to check our assumptions about the code under.\
    \ We'll look at a concrete example of this in the next video. To begin, see the\
    \ list of all annotations here.\n\nSometimes, we need to initialize some data\
    \ or objects to be used in our test methods. JUnit provides a few extra annotations\
    \ to define this initialization code. @BeforeEach- and @AfterEach-annotated methods\
    \ will be called before after each @Test-annotated method, respectively, and @BeforeAll-\
    \ and @AfterAll-annotated methods will be called at the before and after all tests\
    \ have been executed, respectively.\n\n# Assertions\n\nAn assertion, in the context\
    \ of JUnit, is a method that we can call to check our assumptions about the behavior\
    \ of the unit under test. If our assumptions are correct, the assertion silently\
    \ returns and the test method continues. If they're false, the assertion throws\
    \ a special exception class that JUnit uses to build the final failure report,\
    \ and the test method halts execution."
