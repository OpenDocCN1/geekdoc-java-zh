  mdcn: "\nSelenium 还需要一些初始化逻辑，包括设置网络驱动并导航到正确的 URL 以执行后续操作。JUnit 的 @BeforeAll 注解非常适合初始化网络驱动，我们可以使用\
    \ @BeforeEach 注解来编写一个方法，为类中的所有测试导航到一个共同的起始 URL。最后，由于我们需要确保在测试完成后退出网络驱动，可以使用 JUnit\
    \ 的 @AfterAll 注解来定义一个处理该操作的方法。\n\nSelenium 为 JUnit 测试组织提供了另一个实用的工具——页面对象（Page\
    \ Object）。页面对象是一个 Java 类，用于表示被测试的特定页面。我们可以使用页面对象来减少编写 Selenium 脚本时的样板代码，正如我们在下一个视频中看到的，我们将使用它们来让测试代码看起来像被测试的用户故事。\n\
    \n[点击此处获取之前视频的完整课程示例代码]\n\n在之前的视频中，我们查看了一个简单的计数器应用程序，它包含显示当前计数的文本、一个增加按钮和一个重置按钮。我们的目标是使用\
    \ JUnit 和 Selenium 代码来测试应用程序的所有核心功能是否运行正常。首先，我们需要一个 Selenium 页面对象来表示我们正在测试的页面。以下是示例中的\
    \ CounterPage 类：\n\n```java\npublic class CounterPage {\n    @FindBy(id = \"count-display\"\
    )\n    private WebElement countDisplay;\n\n    @FindBy(id = \"increment-button\"\
    )\n    private WebElement incrementButton;\n\n    @FindBy(id = \"reset-value-field\"\
    )\n    private WebElement resetField;\n\n    @FindBy(id = \"reset-button\")\n\
    \    private WebElement resetButton;\n\n    public CounterPage(WebDriver driver)\
    \ {\n        PageFactory.initElements(driver, this);\n    }\n\n    public int\
    \ getDisplayedCount() {\n        return Integer.parseInt(countDisplay.getText());\n\
    \    }\n\n    public void incrementCount() {\n        incrementButton.click();\n\
    \    }\n\n    public void resetCount(int value) {\n        resetField.clear();\n\
    \        resetField.sendKeys(String.valueOf(value));\n        resetButton.click();\n\
    \    }\n}\n```\n\n任何页面对象主要包含三个主要部分：\n\n## 定义元素选择器\n\n```java\n@FindBy(id = \"\
    count-display\")\nprivate WebElement countDisplay;\n\n@FindBy(id = \"increment-button\"\
    )\nprivate WebElement incrementButton;\n\n@FindBy(id = \"reset-value-field\")\n\
    private WebElement resetValueField;\n\n@FindBy(id = \"reset-button\")\nprivate\
    \ WebElement resetButton;\n```\n\n页面对象的目标是简化并抽象查找页面上元素的过程。之前我们通过 `driver.findElement`\
    \ 和 `driver.annotatedElements` 实现此，但在页面对象中，我们可以采用更像 Spring 方法，通过声明带注解的字段作为要在页面上捕获的元素。这些元素选择器将由\
    \ Selenium 自动处理，但我们需要手动启动该过程——我们将在下一部分完成：\n\n## 在构造函数中初始化元素\n\n```java\npublic\
    \ CounterPage(WebDriver driver)\n{\n    PageFactory.initElements(driver, this);\n\
    }\n```\n\n在这个示例中，我们声明 `WebDriver` 作为唯一的构造函数参数，并将 `driver` 和 `this` 关键字作为参数调用 `PageFactory.initElements()`。这种简写告诉\
    \ Selenium 使用给定的驱动初始化类中带有 @FindBy 注解的字段。原则上可以在地方这样做，但正如我们在下一个视频中看到的，在这个构造函数中初始化页面对象既灵活又干净。\n\
    \n通过添加这个构造函数，每当我们创建一个新的 `CounterPage` 对象时，Selenium 都会自动查找并捕获所声明的元素，从而将许多类似的 `driver.findElement`\
    \ 调用简化为单一的 `CounterPage()` 实例化。一旦我们有了这些元素，就可以进入下一部分：\n\n## 创建辅助方法\n\n```java\n\
    public int getDisplayedCount() {\n    return Integer.parseInt(countDisplayText.getText());\n\
    }\n\npublic void incrementCount() {\n    incrementButton.click();\n}\n\npublic\
    \ void resetCount(int value) {\n    resetField.clear();\n    resetField.sendKeys(String.valueOf(value));\n\
    \    resetButton.click();\n}\n```\n\n现在，我们的页面对象已经从它所代表的页面选择了元素，我们可以定义辅助方法来封装页面的常见任务。在这个计数器示例中，我们需要能够从屏幕上读取当前计数，能够增加计数，并且需要重置计数器。注意，我没有为了描述这些操作的功能提到任何特定的元素——虽然我们在实现这些方法时必须是具体的，但如上面的代码所示，编写这些辅助方法的目标是根据完成该操作所需的特定元素交互，在类上执行操作。在某些方面，这是关注点分离的另一个实例——通过在这些方法中隐藏实现细节，，如果页面的\
    \ HTML 发生变化，我们无需更新该类内部的任何代码——使用该类的测试只需继续像以前一样调用相同的方法。\n\n说到测试——现在我们已经设置好了 CounterPage\
    \ 类，终于可以为此应用实现一些测试了。\n\n[点击此处获取之前视频的课程示例代码]\n\n以下是之前视频中的完整 JUnit 类：\n\n```java\n\
    @SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT) \n\
    class UserTestingApplicationTests {\n    @LocalServerPort\n    private Integer\
