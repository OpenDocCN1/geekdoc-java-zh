    # Glossary


    - HTTP Request/Response: HTTP, or HyperText Transfer Protocol, is a binary data
    format for communication between programs over the web. It can be broken down
    into two basic message types: requests and responses. Clients send requests to
    servers, which respond with the requested. Read more about the protocol here.

    - HTTP GET and POST: Every HTTP has an important header that determines its method.
    GET and POST are two of the most common, GET requests requests data from the server;
    POST requests request to ''post'' new data to the server - this usually performs
    some action on server data like searching terms, posting an update, or adding
    new data to the server.

    - HTTP: Text Transfer Protocol. A binary protocol that originally defined the
    mechanics of requesting and sending HTTP over the internet.

    - Web Server: A program that listens for and responds to HTTP requests over the
    internet.

    - Application Server: A program that handles other applications, forwarding incoming
    requests to the appropriate application to filter. Provides shared access to resources
    and multi-threading.

    - Pluggable Architecture: A pluggable architecture refers to any software that
    has parts of it to be added, replaced, and removed. This is usually achieved through
    a common interface for "pluggable components". Sometimes the architecture can
    replace components at runtime, as is with Servlets in Application Server.

    - Threads/Threading: These terms come from concurrency, and multi-threading is
    running multiple threads in parallel. It is a little complicated because your
    CPU has a limited number of physical cores that can process instructions in parallel,
    while the number of threads you can have can be more than your computer cores,
    but that''s a topic for another time!

    - Endpoints: An endpoint is the address at which a client can reach a specific
    part of a server''s service at runtime, for example, the /words/and/slashes that
    follow the domain of a URL.

    - Servlet: A class defined as part of the Java: Enterprise edition. Provides an
    implementable interface for server request processing, defining a method that
    the server invokes on an instance servlet to handle ServletRequest and ServletResponse
    object for an incoming request. The servlet also defines lifecycle methods for
    the server to invoke when initializing or destroying a servlet.

    - JAR: A Archive file, which stores compiled .class files in a folder hierarchy
    that matches the package structure. Includes an optional manifest file.

    - WAR: A variation of the JAR for web applications, optionally includes web resources
    like HTML files and configuration files like web.xml for servlet registration/mapping.

    - IoC: Inversion of Control, which is the practice of designing libraries as application
    runners. This allows developers to focus on application-specific logic and rely
    on IoC containers to connect components to one another, eliminating a lot of boilerplate
    and encouraging a clean separation of concerns.

    - Maven: A dependency management system and project build tool for Java. Provides
    a standardized way to define dependencies between projects and include them in
    the project build path.

    - POM: The Project Object Model that Maven uses to represent the dependency and
    configuration of a project. Usually, this refers to the pom.xml configuration
    file found in a Maven project.

    - Dependency Management System: Any tool that automates the downloading and linking
    of external packages to a software development project. Most languages these days
    either provide or have a community-accepted standard.


    # VIDEO 19:


    # Lesson Conclusion


    # Key Terms


    In this lesson, we learned about:


    - Web servers, how early servers were single-function programs that could host
    files, web pages, and expose databases to external connections.

    - Java application servers, which provides a pluggable architecture for applications
    to interface with, granting access to shared resources and multi-threaded request
    processing.

    - Spring framework, a family of libraries that build on the abstractions of the
    application server to support many third-party integrations to provide easy abstractions
    for common web development tasks.

    - Spring Boot, a convention-over-configuration approach to Spring app development
    that provides defaults for many Spring configuration options in order to provide
    a smoother development experience.

    - Spring Initializer, the official project generator for Spring Boot, which allows
    developers to specify an metadata and dependencies and receive a fully-configured
    Spring Boot, ready for development.


    # Summary — Spring Boot Dependencies


    - Spring Web: This dependency helps to build RESTful web services using the Spring
    MVC. It uses Apache Tomcat as the default container.

    - Thymeleaf is a server-side template engine for both web and standalone applications
    that allows you to show HTML web pages to a client and populate them with data
    directly using the server code.

    - Spring Security is a dependency that allows custom authentication and access-control
    framework for the web application.

    - MyBatis is a persistence framework for having SQL support. MyBatis couples objects
    with SQL statements using an XML descriptor or annotations.


    Next lesson, we''ll take a look how Spring operates and how we can build many
    small application components and configure Spring to connect them to one another.


    LESSON PART THREE OF SPRING BASICS


    VIDEO 1:


    # Spring Boot Basics for Web Development


    ![](img/3a5769bea53a661ab8e4c8216af739d1_48_0.png)


    # Spring Boot''s Building Blocks


    # Lesson Outline


    - **Spring IoC Configuration**: We discuss the basic mechanism at the core of
    Spring, Inversion of Control, and how to configure it for our applications.

    - **Spring Components and Services**: We introduce a mental model for developing
    with Spring, built around classes that we define called components and services.

    - **Server-Wide Configuration**: We learn how to configure certain server-wide
    properties of a Spring Boot application.

    - **XML-Based Configuration**: We discuss an older form of Spring configuration,
    still in use, that uses XML files to define dependencies, server-wide options,
    and more.


    VIDEO 2:


    # The Spring Framework


    ![](img/3a5769bea53a661ab8e4c8216af739d1_50_0.png)


    # Component Class Files & Dependency Configuration


    # The Spring Transformation


    The figure shows that Spring takes the component class files and dependency configuration
    from the developer and instantiates a system of Java objects with references to
    each other.


    Of all the tools we''ll be using in this course, Spring is the most important
    because it defines our entire style of application development. Spring is a framework
    for Inversion of Control, which means that to use it, we have to package our code
    into individual components, telling Spring which components need each other. Spring
    takes the component classes we define and the dependencies we define between them
    and instantiates a system of Java objects with references to each other. This
    frees us from having to write so-called "glue code" to instantiate, connect, and
    manage components manually, and allows us to instead focus on writing so-called
    business logic, or code that concerns itself on the conceptual model of the application.


    # Key Terms


    - **Inversion of Control (IoC):** A design pattern in which the developer creates
    independent components and uses a framework to connect them, rather than writing
    the integration code themselves

    - **Business Logic:** Code that relates exclusively to an application''s conceptual
    model and features. Contrast with utility code like database access, HTTP request
    parsing, etc.

    - **Persistent Components:** Java Objects that Spring maintains over time; they''re
    persistent because they''re created and maintained for as long as the application
    needs them to be.

    - **Dependency Injection:** A mechanism by which loc may be implemented. Components
    are configured with dependencies on other components, which are injected at runtime.
    Injection is quite literal - a component''s dependencies are usually expressed
    as annotated fields on the component class, and Spring will populate those fields
    with the dependencies at runtime.


    # Quiz Question


    What benefits of Spring help enable structured software development?


    Encourage development of single-purpose components that can be combined to implement
    business features.


    - Injecting resources into whichever classes use us.

    - Matching dependency requests to resources by Java type, component name, or a
    configuration property.

