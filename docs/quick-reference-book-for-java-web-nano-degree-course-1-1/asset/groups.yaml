    视频 2：


    # 前提条件


    为了充分利用本课程的价值，你应该已经熟悉 Java、SQL 和 IDE 的基础知识。


    如果你想从 Java 开始，Udacity 了一了一门免费的 Java 编程基础课程，作为额外奖励，它还介绍了 IntelliJ IDEA 这一 IDE。另一个资源是
    Oracle 的 Java 教程。这也是一个非常出色的参考，特别是如果你已经熟悉另一种语言，只是想知道 Java 有何不同之处。尽管如此，我们预计你在本课程中对
    Java 非常熟悉，因此请自行承担风险继续，或者查看 Udacity 的《关系型数据库简介》，你将在那里将学习如何设计和查询 SQL 数据库。


    如果 IntelliJ IDEA 对你来说是新领域，你可以查看功能概览以了解可能性。请注意，我们将在课程中使用 IntelliJ 的开源社区版（Community
    Edition）。如果你想付费 Ultimate版（Ultimate Edition），它是免费的，但不是必须的。如果 IDE 对你来说很新，请查看 Udacity《Java
    编程基础》的最后一节作为介绍。


    视频 3：


    # 使用 Spring Boot 进行 Java Web 开发简介


    Web 开发意味着构建 Web 应用程序，在标准的 Web 应用程序中有三个主要组件：


    - 数据存储

    - 应用逻辑

    - 客户端访问


    在课程结束时，你将学习如何使用 Java 和 Spring Boot 构建和管理这些每一个组件。


    ## 数据存储


    其中一些组件将负责与数据库交互。我们将使用一个名为 H2 的 SQL 数据库，它是由 Spring Boot 托管的内存 SQL 数据库。你将学习使用 MyBatis（一个用于数据库交互的
    Java 库）来生成数据访问 Bean，这些 Bean 将被你应用程序逻辑中的其他服务使用，以满足客户端请求。


    ## 应用逻辑


    应用逻辑管理客户端访问和数据库交互。对于本课程，你将学习如何使用 Spring Boot 维护一个 Bean 集合，这些 Bean 是应用逻辑的小组件，它们可以相互作用以执行复杂任务。


    ## 客户端访问


    访问我们应用程序的客户端是 浏览器，它将向我们的应用发送 HTTP 请求并通常期望返回 HTML。通过使用 Spring Boot 提供的 Spring MVC
    和 Spring Security 库，你将学习创建名为控制器（controllers）的特殊 Bean，你可以配置它们来响应客户端请求并生成 HTML 响应。从客户端的角度来看，控制器是你的应用程序的入口点。


    ![](img/3a5769bea53a661ab8e4c8216af739d1_10_0.png)


    Web 应用程序架构：注意哪些 Spring 概念与哪些角色交织！


    视频 4：


    # 为什么 Java Web 开发如此重要


    为什么 Java Web 开发如此重要


    学习 Web 开发是有价值的，因为我们每天使用的数字应用和服务就是这样被构建的。能够可视化 Web 应用程序的架构将使你成为更优秀的开发者，并在将应用想法变为现实时提供工具。


    学习 Java 是有价值的，因为 Spring 是一个许多 Web 开发的框架，它是广泛使用的行业主流，拥有庞大的开发者社区。掌握 Spring Boot
    使你成为一个优秀的开发者，并向你展示解决方案。无论你使用哪种语言，某些问题都会出现，学习识别这些常见问题将使你成为更优秀的开发者。


    视频 5：


    # 利益相关者


    谁是利益相关者？


    在专业的开发团队中，许多人参与了语言和框架的选择：


    - 编写代码的开发者。

    - 编写和运行测试的测试人员。

    - 创建原型的设计人员。

    - 选择最适合项目技术的项目架构师。

    - 为开发人员编写技术规范的业务分析师。

    - 规划工作的项目经理。


    本课程适用于任何希望使用 Java 和 Spring 进行 Web 开发的人员。


    ![](img/3a5769bea53a661ab8e4c8216af739d1_12_0.png)


    # 业务分析师


    ![](img/3a5769bea53a661ab8e4c8216af739d1_12_1.png)


    # 技术要求


    # 选择 Java 对开发团队成员的影响


    视频 6：


    # Spring 与 Spring Boot


    ## Spring


    Spring 是包含许多有用 Web 开发库的框架。Spring 包含了必要的“组件”，例如数据库访问、安全、云部署、Web 服务等。


    ## Spring Boot


    Spring Boot 是 Spring 框架的一部分，有助于快速应用程序开发。Spring Boot 有助于开发独立和企业级 Web 应用。使用 Spring
    Boot 的优势在于开发者可以使用最少的配置开始使用 Spring 核心库。因此，Spring Boot有助于加速应用程序开发。


    ## Spring 与 Spring Boot


    Spring 和 Spring Boot 框架都有助于构建微服务 Web 应用程序。在内部，Spring Boot 构建在 Spring 框架之上。通常情况下，Spring（核心模块）负责某些操作，如：


    1. 反转控制 (IoC)

    2. 依赖注入

    3. 常用注解

    4. 实现并为其他框架（如 Thymeleaf、MyBatis、Spring MVC 等）提供基础。


    而 Spring Boot 带来了 Spring 的所有功能，以及一些额外优势，如：


    1. 它可以自动配置 Spring 和第三方库

    2. 它提供了必要的依赖以简化构建配置


    通过这种方式，Spring Boot 有助于加速应用程序开发。选择 Spring 还是 Spring Boot 框架取决于软件需求。任何一个框架都可以用于构建微服务
    Web 应用程序。然而，Spring Boot 有助于更快上手。


    你不理解上述使用的任何术语，请担心，我们将在接下来的几节课程中学习并练习每一个。


