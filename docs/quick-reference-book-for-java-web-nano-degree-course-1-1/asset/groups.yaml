    @Test\n@AfterAll\n\n# Question 2 of 2\n\nImagine we're creating a JUnit for the\
    \ exercise we did earlier with /animals page. We want to submit the form multiple\
    \ times and make sure the message changes when we get to our 5th submission. Which\
    \ JUnit and Selenium components can help us write this test?\n\n- * \n- * \n-\
    \ *\n- * : \n\nVIDEO 18:\n\n# # Page Load Times\n\n> Erratum - In the video above,\
    \ the time argument passed to the WebDriverWait() constructor is in seconds instead\
    \ of milliseconds. Refer to the WebDriverWait docs for more information and examples.\n\
    \n# Question 1 of 2\n\nUsing Selenium, if a page takes a while to load, we need\
    \ to make sure the driver waits before searching for elements that might not exist\
    \ on the page?\n\n- * \n- ● Question 2 of 2\n\nWhich of these solutions is the\
    \ best way to wait for a page to load before beginning your Selenium tests?\n\n\
    - * \n- ● In the real world, things get complicated, fast. Nowhere is this more\
    \ apparent than when trying to account for page load times when automating user\
    \ testing.\n\nOn the web, page load times can vary wildly between different internet\
    \ providers, the size of the resources a page has to load, the speed at which\
    \ the server handles requests, and so on. It's virtually impossible to predict\
    \ exactly when a page will load, and this presents a problem for testing; if we\
    \ ask Selenium to find an element on a page before the finishes loading, it's\
    \ going to fail and we're going to have something like a big, NullPointerException\
    \ or a StaleElementReferenceException on our hands. The StaleElementReferenceException\
    \ may occur in case of a delayed-reload.\n\nHow do we make sure an element is\
    \ on the page before we ask Selenium to look for it?\n\nThe answer is to use WebDriverWait,\
    \ which is a class Selenium provides for this purpose. Let's look at the following\
    \ code:\n\n```\nWebDriverWait wait = new WebDriverWait(driver, 10);\nWebElement\
    \ marker = wait.until(driver ->\ndriver.findElement(By.id(\"page-load-marker\"\
    )));\n```\n\nIn this example, we create a new WebDriverWait with a timeout in\
    \ seconds. WebDriverWait defines a method called until that we use in the next\
    \ line for Selenium to pause until the specified element is found, or the timeout\
    \ is reached.\n\nThis is extremely handy, since we can now ensure Selenium waits\
    \ and continues in a structured way.\n\n# Further Research\n\n- Official Selenium\
    \ Guide to Waits\n\nVIDEO: 19:\n\n# Exercise: Final Review\n\nFor this final review,\
    \ you're going to add automated user testing with JUnit and Selenium to your chat\
    \ application. The goal is to test at least one end-to-end user action flow: using\
    \ Selenium, automate the browser to register a new user, log in as that user,\
    \ submit a chat message and verify that the newly-submitted message shows up on\
    \ the page with the correct message text and username attached. In order to accomplish\
    \ this, you'll have to do a couple of things:\n\nAdd Selenium and WebDriver dependencies\
    \ to the project. JUnit is always included in a generic Spring Boot project by\
    \ default, but Selenium and WebDriver are not. Add the following dependencies\
    \ to your pom.xml\n\n```xml\n<dependency>\n  <groupId>io.github.bonigarcia</groupId>\n\
    \  <artifactId>webdrivermanager</artifactId>\n  <version>3.8.1</version>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.seleniumhq</groupId>\n  <artifactId>selenium-java</artifactId>\n\
    </dependency>\n```\n\n**Create Pages for the HTML templates** we use. In order\
    \ to test our registration/login/message submission flow we will implement separate\
    \ Page Objects for the signup.html, login.html, and chat.html templates. You can\
    \ structure them according to our examples if this likes you, or if you have an\
    \ idea for how to organize them you like to try out, you can do that. Page Objects\
    \ are flexible and can make to make your life easier, so if you can think of features\
    \ for these Page Objects that would be helpful to you, go for it!\n\n**Write at\
    \ least one high-level JUnit test** that tests our user's registration, login,\
    \ and first message. Using the page objects you created, write a high-level JUnit\
    \ test that registers a new user, sends a new message as they chat, and asserts\
    \ that the username and text of the message that appears on the screen matches\
    \ the new user's username and the text they submitted. You will also have to write\
    \ the Spring Boot testing and web driver setup code in the JUnit test class that\
    \ you're working in - you can refer back to these examples to see how we did before.\n\
    \n**[BONUS] Write another high-level test** that verifies that two users can chat\
    \ with each other and receive the identical messages on each end. This requires\
    \ that you completed the bonus task from last lesson, implementing a logout button.\
    \ A chat application is pretty lonely when only one person is using it, and adding\
    \ more users to any application is likely to reveal some unexpected bugs. Write\
    \ a test that verifies that your app can support multiple users!\n\n**Run your\
    \ tests and verify that the app functions as expected**; if it doesn't, identify\
    \ the problem and solve it, and verify your solution by re-running the tests.\
