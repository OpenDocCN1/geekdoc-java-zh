    # 历史


    全栈开发与 Spring Boot 的历史


    网络计算已经存在了近六十年。最初，特定的程序被设计用于相互通信，但多年来，针对不同的数据协议建立了多种标准。在这个时代，服务器/客户端二分法占据主导地位，针对文件共享和电子邮件交换等单个网络任务有专门的服务器和客户端程序。这种情况随着万网、HTTP
    和 HTML 的发展而改变了。随着网站变得日益复杂，Web 服务器越来越多地承担了用户浏览器与其他相关服务之间媒介的角色。这种 Web 职责的整合恰逢了 Java
    的兴起和流行，随后官方的 Web Servlet 和应用容器规范也相继出炉，这些规范解决了构建复杂、功能丰富的 Web 服务器时的常见问题。


    随着它的兴起，软件开发者开始在在线开源社区中见面并分享想法。这些小组开发了实用的工具和程序，包括 Spring，它的目标是基于 Java 的服务器架构，并提供无样板代码（boilerplate-free）的开发者体验。它已成为行业标准，以及支持大量强大工具和框架的伞形项目。


