    * Configured Simple Username/Password Authentication

    * Connected Spring Security’s Configuration with Our User Credentials


    We''ve also taken our chat program to the next level by adding persistent storage
    and authentication to it!'
- md: "\n# Testing With JUnit and Selenium\n\n## The Lesson Outline\n\n- **Testing\
    \ with JUnit:** We introduce JUnit, the standard testing and assertion framework\
    \ for Java. We learn how to write new tests and check out assumptions by using\
    \ JUnit's extensive library of assertion methods.\n- **JUnit in Situ:** We look\
    \ at how we can use IntelliJ (or any other IDE) to run tests, debug errors, and\
    \ get reports about code coverage.\n- **Selenium/WebDriver:** We introduce Selenium,\
    \ a tool for browser automation, through its Java API, `selenium-java`. We look\
    \ at how to write Selenium scripts to simulate user actions in a browser at a\
    \ high level.\n- **JUnit and Selenium:** We discuss how to use Selenium's java\
    \ API inside of JUnit tests, which opens the door to an advanced technique: automated\
    \ user testing.\n\nVIDEO 2:\n\n# Testing: Why and How\n\n![](img/3a5769bea53a661ab8e4c8216af739d1_137_0.png)\n\
    \npassing tests\n\nfeature development\n\n# The Test-Driven Development Lifecycle\n\
    \nThe figure above shows the test-driven development lifecycle. First, there is\
    \ an idea for a new feature. That feature idea is turned into a series of user\
    \ stories, which are then turned into tests, which fail because the feature does\
    \ not exist yet. The developers then work on the feature's code requirements until\
    \ all of the tests pass, and the cycle begins again.\n\nTesting is an important\
    \ and highly desired part of the software development process. In a world where\
    \ uptime and user retention means everything, it's important to validate that\
    \ your application actually does what it's supposed to do before it goes into\
    \ production.\n\nThe standard accepted way to enforce this is by adopting a test-driven\
    \ development lifecycle, or TDD. In this model, the \"red green\" philosophy is\
    \ dominant - tests should be written before the feature to be tested, meaning\
    \ that they start off failing - aka, the tests \"red\". Then, as the feature is\
    \ implemented, one test after another should start to pass - aka, become \"green\"\
    .\n\nTo facilitate this approach, it's useful to have a standard way to describe\
    \ features or requirements to be tested. For this, we turn to the concept of a\
    \ \"user story.\" A user story describes the functionality a feature should have\
    \ from the perspective of a user interacting with it. Typically, the format of\
    \ a user story is:\n\n**As a user, I can take some action in order to achieve\
    \ some goal.**\n\nOften a feature will be broken up into many user stories, each\
    \ of which should correspond to at least one test to be implemented for that feature.\
    \ If all the tests pass, it means that all of the user stories are successfully\
    \ implemented, and the feature is complete.\n\n## Key Terms\n\n- **Test Driven\
    \ Development**: a software development methodology that emphasizes writing tests\
    \ before the code to be tested. This gives developers a roadmap to success - once\
    \ all the tests are passing, the feature is complete!\n- **User Story**: User\
    \ stories are short sentences derived from feature requirements in the format\
    \ of As a user, I can in order to . These are used to create tests to verify the\
    \ components of a feature.\n\n# Quiz Question\n\nWhich of the following requirements\
    \ are testable?\n\n- \n- \n-\n\nVIDEO 3:\n\n# Testing\n\nThere are many different\
    \ types of tests meant to validate different types of features and different layers\
    \ of an application. In this course, we're going to focus on two specific types\
    \ of tests: Unit tests and integration tests.\n\nUnit tests are meant to test\
    \ a single unit or component of an application or process - these tests should\
    \ be simple, and verify that a specific method, component, or process acts as\
    \ expected according to its inputs. Sometimes you'll also use unit tests to verify\
    \ that your test fails predictably, well; it's good to test both positive and\
    \ negative conditions in a unit test!\n\nIntegration tests are the next layer\
    \ over unit tests. Instead of testing a single unit of an application, they test\
    \ multiple units and how they integrate with one another. Often, an integration\
    \ test will validate an entire user story, for example, while a unit test will\
    \ validate a single step in the process user story.\n\nThe rule of thumb is that\
    \ unit tests should be used to test invariants - conditions that do not change\
    \ - and integration tests should be used to test user actions and entire process\
    \ flows.\n\n## Key Terms\n\n- **Unit Tests**: a unit test only validates the smallest\
    \ unit of a computational process. That might mean a test of a single method,\
    \ a single component in an application.\n- **Invariants**: an invariant is a law\
    \ of computation, something that shouldn't change despite changing circumstances.\
    \ For example, adding 0 to a number should always result in the original number,\
    \ and dividing by 0 always result in an error.\n- **Integration Tests**: integration\
    \ tests are intended to validate the operation of multiple application components\
    \ as they interact with each other - or integrate with one another.\n\n# Question\
    \ 1 of 2\n\nConsider the earlier requirement: “As a user, I can click on the \"\
    schedule\" button of the schedule delivery model to save the time and address\
    \ selected in the window.\"\n\nWould this require a Unit Test or an Integration\
    \ Test?\n\n- \n- Integration Test\n-\n\n# Question 2 of 2\n\nOnce more consider\
    \ the same requirement as above: “As a user, I can click on the \"schedule\" button\
    \ of the schedule delivery modal to save the time and address selected in the\
    \ window.\n\nWhat are the environment requirements for testing this change?\n\n\
    - \n- . .\n\nVIDEO 4:\n\n# Testing with standard JUnit\n\nJUnit is the standard\
    \ Java testing framework, and despite its name, it is capable of much more than\
    \ unit tests. JUnit expects all tests for an application to be collected in class\
    \ files, just like any other Java code.\n\n## Annotations\n\nJUnit provides an\
    \ annotation, @Test, that can be placed on a method in a test class to declare\
    \ a single test. Each method annotated like this can be executed individually,\
    \ or in a group - and in both cases, JUnit will generate a report that lists each\
    \ test that was run, and whether it was successful or not.\n\nIn order for JUnit\
    \ to know if a test is successful or not we need to use assertions. @Test-annotated\
    \ methods should not have a return value! Instead, we can use special methods\
    \ provided by JUnit to check our assumptions about the code under. We'll look\
    \ at a concrete example of this in the next video. To begin, see the list of all\
    \ annotations here.\n\nSometimes, we need to initialize some data or objects to\
    \ be used in our test methods. JUnit provides a few extra annotations to define\
    \ this initialization code. @BeforeEach- and @AfterEach-annotated methods will\
    \ be called before after each @Test-annotated method, respectively, and @BeforeAll-\
    \ and @AfterAll-annotated methods will be called before after all tests have executed,\
    \ respectively.\n\n# Assertions\n\nAn assertion, in the context of JUnit, is a\
    \ method that we can call to check our assumptions about the unit under. If our\
    \ assumptions are correct, the assertion silently returns and the test continues.\
    \ If they're false, the assertion throws a special exception that JUnit uses to\
    \ build the final report, and the test method halts.\n\nAssertions are the static\
    \ methods defined in the Assertion class. See the list of assertions here, and\
    \ an example on how to use assertions in a unit test.\n\nFor example, assertEquals(int\
    \ expected, int actual) is an assertion method you can call in your test method\
    \ to assert the actual and expected integer values are equal.\n\n# Testing with\
    \ JUnit - Annotations and Assertions\n\nFor the full lecture sample code from\
    \ the previous video, click here\n\nIn the previous video, we looked at some JUnit\
    \ tests to learn more about JUnit's annotations and assertions. Some key takeaways:\n\
    \n- In a Maven project, it is extremely important to make sure your JUnit test\
    \ classes are in the right directory. Maven expects tests to be in the src/test/java\
    \ directory. Always double check\n- JUnit's assertions are all static methods\
    \ on the org.junit.jupiter.api.Assertions class, so to use you need to statically\
    \ import the methods you need\n- The most-used assertion is assertEquals, which\
    \ can be used to check if the result of some action is the expected result\n-\
    \ Another common assertion is assertThrows, which is used to check if a given\
    \ piece of code does throw an exception. This can be useful to check so-called\
    \ negative test cases, where we want to make sure our application fails in the\
    \ correct way. This assertion uses Java 8's lambda expression syntax to capture\
    \ a piece of code to test - if you're not familiar with this syntax, you can find\
    \ more information about it in the further research section\n- @BeforeEach annotated\
    \ methods are particularly useful for initializing some data that needs to be\
    \ in the same state for every test. For example in the video, we used this to\
    \ ensure that a list under test has the same values at the beginning of each test.\n"
  mdcn: "\n\n# 使用 JUnit 和 Selenium 进行测试\n\n## 课程大纲\n\n- **使用 JUnit 进行测试：** 我们介绍了 JUnit，这是\
    \ Java 标准的测试和断言框架。我们将学习如何使用 JUnit 广泛的断言方法库来编写新测试并检查假设。\n- **JUnit 的实地应用：** 我们将查看如何使用\
    \ IntelliJ（或任何其他 IDE）来运行测试、调试错误并获取代码覆盖率报告。\n- **Selenium/WebDriver：** 我们通过其 Java\
    \ API `selenium-java` 介绍了 Selenium，这是一个用于浏览器自动化的工具。我们将查看如何编写 Selenium 脚本，以在高级层模拟浏览器中的用户操作。\n\
    - **JUnit 和 Selenium：** 我们将讨论如何在 JUnit 测试中使用 Selenium 的 Java API，这为一种高级技术打开了大门：自动化用户测试。\n\
    \n视频 2：\n\n# 测试：为什么以及如何做\n\n![](img/3a5769bea53a661ab8e4c8216af739d1_137_0.png)\n\
    \n通过的测试\n\n功能开发\n\n# 测试驱动开发生命周期\n\n上图显示了测试驱动开发的生命周期。首先产生了一个新功能的想法。该功能想法被转化为一系列用户故事，然后转化为测试，由于功能尚不存在，这些测试会失败。然后开发者针对该功能的代码要求工作，直到所有测试通过，然后循环再次开始。\n\
    \n测试是软件开发过程中一个非常重要且备受期待的部分。在一个运行时间和用户留存意味着一切的世界里，在应用程序投入生产之前，验证您的应用程序确实执行了它应该执行的操作是非常重要的。\n\
    \n强制执行这一点的标准方法是采用测试驱动开发生命周期，或 TDD。在这种模型中，“红绿灯”哲学占据主导地位——测试应该在被测试的功能之前编写，这意味着它们从开始是失败的——即测试为“红色（red）”。然后，随着功能的实现，一个接一个的测试应该开始通过——即变为“绿色（green）”。\n\
    \n为了方便这种方法，使用一种标准方法来描述待测试的功能或需求是很有用的。为此，我们转向了“用户故事”的概念。用户故事从与功能交互的用户角度描述了该功能应该具备的功能。通常，用户故事的格式为：\n\
    \n**作为一名用户，我可以执行某些操作以实现某些目标。**\n\n一个功能通常会被拆分成许多用户故事，每个用户故事都应该对应为该功能实现的至少一个测试。如果所有测试都通过，意味着所有用户故事都已成功实现，功能已完成。\n\
    \n## 关键术语\n\n- **测试驱动开发 (Test Driven Development)**：一种软件开发方法，强调在编写待测试代码之前编写测试。这为开发者提供了一条成功路线图——一旦所有测试都通过，功能就完成了！\n\
    - **用户故事 (User Story)**：用户故事是源自功能要求的短句，格式为“作为一名用户，我可以……以便……”。这些被用于创建测试以验证功能的各个组件。\n\
    \n# 测验\n\n以下哪些需求是可测试的？\n\n- \n- \n-\n\n视频 3：\n\n# 测试\n\n有许多不同类型的测试，用于验证应用程序不同类型的功能和不同层。在课程中，我们将关注两种特定类型的测试：单元测试和集成测试。\n\
    \n单元测试（Unit tests）旨在测试应用程序或过程的单一单元或组件——这些测试应该是简单的，并验证特定方法、组件或过程是否根据其输入按预期运行。有时你还会使用单元测试来验证你的测试是否按预期失败；这很好，在单元测试中同时测试正条件和负条件都是好的！\n\
    \n集成测试（Integration tests）是单元测试的下一层。它们不是测试应用程序的单一单元，而是测试多个单元以及它们如何相互集成。通常，集成测试会验证整个用户故事，例如，而单元测试将验证用户故事过程中的单个步骤。\n\
    \n准则是，单元测试应该用于测试不变性（invariants）——不会改变的条件，而集成测试应该用于测试用户操作和整个流程流。\n\n## 关键术语\n\n\
    - **单元测试 (Unit Tests)**：单元测试仅验证计算过程的最小单元。这可能意味着对单个方法或应用程序中单个组件的测试。\n- **不变性 (Invariants)**：不变性是计算的法则，无论情况如何变化都不应该改变的东西。例如，给数字加\
    \ 0 总是得到原始数字，除以 0 总是导致错误。\n- **集成测试 (Integration Tests)**：集成测试旨在验证多个应用程序组件在相互作用或相互集成时的操作。\n\
    \n# 问题 1（共 2 个）\n\n考虑之前的需求：“作为一名用户，我可以点击计划送货模型中的‘计划’按钮，以保存窗口中选择的时间和地址。”\n\n这需要单元测试还是集成测试？\n\
    \n- \n- 集成测试\n-\n\n# 问题 2（共 2 个）\n\n再次考虑上述相同的需求：“作为一名用户，我可以点击计划送货模态中的‘计划’按钮，以保存窗口中选择的时间和地址。”\n\
    \n测试此更改的环境要求是什么？\n\n- \n- . .\n\n视频 4：\n\n# 使用标准 JUnit 进行测试\n\nJUnit 是标准的 Java\
    \ 测试框架，尽管它的名字是 JUnit，但它的功能远超单元测试。JUnit 期望应用程序的所有测试都收集在类文件中，就像任何其他 Java 代码一样。\n\
    \n## 注解\n\nJUnit 提供了一个注解 @Test，可以放置在测试类的方法上以声明一个测试。JUnit 期望应用程序的所有测试都收集在类文件中，就像任何其他\
    \ Java 代码一样。\n\n被 @Test 注解的每个方法可以单独执行，也可以作为一个组执行——在两种情况下，JUnit 都会生成报告列出测试是否成功。为了让\
