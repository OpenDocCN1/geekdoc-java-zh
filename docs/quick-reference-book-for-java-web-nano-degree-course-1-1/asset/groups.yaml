    ## 词汇表


    - **GET 请求**：针对特定 URL 获取数据的 HTTP 请求。它不包含任何额外数据。

    - **POST 请求**：通常代表向服务器“发布”新数据的 HTTP 请求。这是一种常用的向服务器发送许多带有数据的请求的通用捕获方法。

    - **动态 (Dynamic)**：动态的事意味着会响应外部刺激而发生变化。在 HTML 模板的情况下，模板的静态部分是那些可以根据需要替换或配置数据的部分。

    - **静态 (Static)**：静态的事意味着不会改变。在 HTML 模板的情况下，模板的静态部分是无法更改的，无论使用模板使用什么数据，它们都保持相同。

    - **MVC-视图-控制器 (MVC-View-Controller)**：一种设计模式，强调将应用程序组件分为三类层，以进行更结构化的面向用户的应用程序开发。

    - **模型 (Model)**：在 MVC 中，模型负责维护应用程序的状态。

    - **视图 (View)**：在 MVC 中，视图负责向用户显示界面（UI）。

    - **控制器 (Controller)**：在 MVC 中，控制器负责处理用户操作（从视图发送）以更新模型，并将更新回传给视图。

    - **模板 (Template)**：在软件开发中，模板通常是特定格式（如 HTML）的重复或复用的文本或代码，带有代码上下文——总来说，它们被用于定义某些带有
    `code hooks` 的重复内容，这些钩子指示了模板在渲染时应被动态替换的部分。在我们的语境中，我们主要使用 Thymeleaf 特有的属性。这些属性大多看起来像纯
    HTML，但有几个 Thymeleaf 特有的属性，允许我们定义 Thymeleaf 在生成最终 HTML 模板时所使用的内容。

    - **用户操作 (User Action)**：用户操作是用户通过其交互的用户界面可以执行的简单操作。在 Web 应用程序中，我们通常将用户操作视为对网页的点击，其结果是发送到后端的
    HTTP 请求。

    - **原型/线框 (Prototype/Wireframe)**：在 Web 应用程序的开发过程中，通常首先定义用户预期看到的所有的的 HTML 和 CSS。这些页面没有实际功能，通常被称为原型。线框是设计过程中更早的阶段，通常是显示原型应该样子的简单图像。

    - **表单绑定对象 (Form-Binding Object)**：这是 Spring MVC 和 Thymeleaf 使用的术语，代表表单中包含的数据。在
    Spring 端，这通常是相关控制器方法的额外参数；在 Thymeleaf 端，这在表单的 `th:object` 属性中引用。


