  mdcn: "\n继续处理剩余的失败测试，我们发现它执行的操作与之前某个成功的测试完全相同。这通常是一个良好信号，表明这些测试依赖于某些数据，在每个测试之前需要对其进行相同的初始化。事实上，我们发现使用\
    \ `@BeforeAll` 注解方法初始化的数据实际上需要在每个测试之前进行初始化，而不是在所有测试之前一次，因此我们将 `@BeforeAll` 注解更改为\
    \ `@BeforeEach`。\n\n最后，为了验证我们的测试没有遗漏代码库中的任何内容，我们使用 IntelliJ 的代码覆盖率功能重新运行了测试。这显示我们的测试覆盖了项目几乎几乎所有的代码行，只有一个方法完全没有被测试。在为该方法添加测试并重新运行带覆盖的测试套后，我们看到整个代码库都变绿了。不错！\n\
    \n![](img/3a5769bea53a661ab8e4c8216af739d1_149_0.png)\n\n# 红绿：测试驱动开发格言\n\n# 核心术语\n\
    \n- **交互式报告 (Interactive Reporting)**：当我们在 IDE 中运行测试时，通常可以单独检查每个测试的结果。如果断言失败或触发了意外异常，堆栈跟踪和情况将在每个测试的详情中显示，结果中的可点击链接可以帮助你导航到代码中的问题。\n\
    \n- **交互式调试 (Interactive Debugging)**：当棘手问题持续存在时，通过逐行执行代码进行调试，以检查控制流和程序使用的内存中的值通常很有帮助。这被称为调试，虽然在技术上离开\
    \ IDE 是可行的，但像 IntelliJ 这样的 IDE 提供了许多工具，让该过程尽可能轻松。\n\n- **覆盖率报告 (Coverage Reports)**：当我们在\
    \ IntelliJ IDE 中运行代码时，可以选择让 IDE 跟踪哪些代码行被访问以及访问了多少次。这在尝试追踪为什么代码分支没有被到达，以及确定当前实现的测试对整个代码库的覆盖范围时，非常有用。\n\
