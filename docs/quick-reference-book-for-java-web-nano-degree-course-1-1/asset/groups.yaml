    # HTML Templates with Thymeleaf


    The nature of Spring MVC''s data flow - the controller has to provide the data
    for the template it wants to render - means that often, when designing a new user-facing
    feature, it makes sense to start with the template.


    Thymeleaf is the HTML template engine we''re using in this class, which means
    that it''s a library that can take a template, a data model, and combine them
    to generate a final HTML document.


    The way that Thymeleaf applies the data model to the template is based on the
    Thymeleaf attributes we add to the template, like th:text from the previous lecture
    on MVC. These attributes can have complex expressions as their values, which are
    processed by Thymeleaf: the context of the data model provided. In the next video,
    we''ll look at some of the effects those attributes and expressions can achieve!


    # More Greetings!


    [For the full lecture sample code from this lecture, click here]


    In addition to setting text values, we can use Thymeleaf attributes to perform
    basic control flow in our templates. The main two types of control flow in templates
    are iteration and conditional rendering.


    Iteration Thymeleaf templates works very similarly to an enhanced for-loop in
    Java. The main attribute used in template iteration is th:each, and it uses us
    like this:


    ```

    <h th:each="${greetings}" th:text="${msg}">Hello, homepage</h1>

    ```


    We can read the attribute th:each="${greetings}" as for each msg in greetings,
    and it essentially means "repeatedly render this element for each value in the
    greetings collection, and that element msg for any expressions that need to have
    a value associated with it.


    In this example, the h tag will be repeatedly rendered, once for each element
    in greetings, and the text rendered by th:text="${msg}" will be the current element
    of greetings being rendered. If greetings contains the Strings "Hi" and "Hello",
    the final rendered will be


    ```

    <h1>Hi</h1>

    <h1>Hello</h1>

    ```


    Conditional rendering in Thymeleaf usually looks like an statement in Java, or
    occasionally a switch statement. The attribute we examined in the example was
    th:unless, as in:


    ```

    <h th:unless="${msg.contains(''goodbye'')" th:text="${msg}">Hello, homepage</h

    ```


    In this case, if msg contains the String "goodbye", the h tag will not be rendered.
    This is particularly useful when choosing whether or not to render an error message,
    for example. If you need the opposite condition, in this case only showing messages
    that contain "goodbye", you can simply replace the th:unless with th:if.

