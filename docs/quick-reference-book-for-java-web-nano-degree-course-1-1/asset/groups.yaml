    # The Lifecycle of JUnit Test Class


    The diagram above shows the lifecycle of a JUnit test class.


    +   * First, JUnit instantiates the class and any method annotated with `@BeforeAll`.

    * Then it calls a test to run. It calls any method with the `@BeforeEach` method,
    then it calls the `@Test`-annotated test method.

    * Finally it calls the `@AfterEach`-annotated method. It repeats this for each
    `@Test`.

    * When none remain, it calls the `@AfterAll`-annotated method and destroys the
    test class instance.


