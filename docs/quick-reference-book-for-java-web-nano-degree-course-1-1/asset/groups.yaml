    # MVC 与你


    # Spring MVC 和 Thymeleaf


    # 课程大纲


    - **MVC 与你：** 我们将介绍模型-视图-控制器（MVC）模式，并讨论 Spring MVC 如何对其适配以用于 Web 端。

    - **HTML 模板与 Thymeleaf：** 我们将 Thymeleaf HTML 模板的工作原理，以及我们如何使用 Spring 控制器向其填充数据。

