    are classes in application designed purely to hold structured data, like users,
    profiles, or anything else an application might manage. These are helpful for
    us to maintain a good conceptual model of an application, and are created and
    accessed frequently during execution.

    - **Components**: Components are persistent class instances managed by Spring
    in an application. They usually resemble libraries more than typical objects,
    with methods that must be called'
