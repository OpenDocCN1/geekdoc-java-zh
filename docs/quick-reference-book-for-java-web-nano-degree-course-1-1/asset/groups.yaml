    \n当你访问第一个页面时会发生什么，当你输入名字“Terry”并点击按钮时会发生什么？\n\n- 当你首次加载页面时，它会显示‘low five.’。当你点击按钮时，它会显示‘low\
    \ five.’，然后在下方再次显示‘low five.’。\n\n## 遇到困难？这里有解决方案！\n\n视频 12\n\n## 练习：将控制器到模板\n\
    \n这是另一个与上一个练习类似的短 HTML 代码段，但让我们让事情变得稍微复杂一点！这次，我们有两个字段，并希望将它们映射到消息中名为 `animalName`\
