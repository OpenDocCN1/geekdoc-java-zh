    \ technology subjects and is a regular columnist for Open Source and OSE Hub.\
    \ His current affiliations include being a Founder of F5 Developers, a multi-service\
    \ provider company including the subsidiary companies of F5, i.e, THOR, F5 Initiative\
    \ and OSE Hub. In recognition to his contribution Microsoft awarded him the prestigious\
    \ “Microsoft Technology Associate” award in 2019 for Java Programming. He can\
    \ be reached at.\n\n## Contents\n### Module I – Introduction to Java Programming\n\
    - Java – An Overview\n- History of Java\n- Features of Java\n- Getting Started\
    \ with Java\n\n### Module II – JDK, JRE and JVM\n- Difference between JDK, JRE\
    \ and JVM\n- JVM Architecture\n- Variables, Data Types, Operators\n\n### Module\
    \ III – OOPs using Java\n- Concept of OOPs\n- Classes and Objects\n- Inheritance\n\
    - Polymorphism\n- Encapsulation\n- Abstraction\n- Methods and Constructors\n\n\
    ### Module IV – Multithreading\n- Overview of Multithreading\n- Lifecycle and\
    \ States of a Thread\n- Main Thread\n- Thread Priority\n- Garbage Collection\n\
    \n### Module V – Java Misc.\n- Java Applets\n- Exception Handling\n\n## Epigraph\n\
    “Simplicity does not precede complexity, but follows it.” — Prem Kumar\n\n## Acknowledgements\n\
    It is a journey of almost a new beginning with the stage the book idea of “Getting\
    \ Inside Java – Beginners Guide” is conceived up to the release of its First Edition.\
    \ During this journey I have met so many students, developers, professors, publishers\
    \ and authors who expressed their opinions about Java. They have been the main\
    \ motivators in my effort to complete this book. In particular I am indebted to\
    \ Miss Priya who had a faith in this book idea, believed in my writing ability,\
    \ whispered the words of encouragement and made helpful suggestions from time\
    \ to time. I am indebted to God for having such parents, without them I was unable\
    \ to gain a bit of knowledge. With this, I would like to thank my father, Dr.\
    \ Rajan Mahto and my mother, Mrs. Manju Devi for making me able. During this course\
    \ people like R.K. Raja, Mohit Kumar, and Priya helped in writing programs, spotting\
    \ bugs, drawing figures and preparing index. I trust that with their collective\
    \ acumen all the programs would run correctly in all situations. I would like\
    \ thanks to all the members of F5 Developers, my startup company. I am hopeful\
    \ that their dream has been realized. I thank Priya, my friend, for her friendship\
    \ and for her contributions in everything I do.\n\n## Introduction\nThis textbook\
    \ was written with two primary objectives. The first is to introduce the Java\
    \ language. Java is a practical and still-current software tool; remains one of\
    \ the most popular languages in existence, particularly in areas as embedded systems.\
    \ Java facilitates writing code that is very efficient and powerful and, given\
    \ the ubiquity of Java compilers, can be easily ported to many platforms. The\
    \ second key objective is to introduce the basic concepts of OOP. At one level\
    \ this is Java-specific: to learn to design, code and debug Java programs.\n\n\
    ## Java – An Overview\n### What is Java?\nJava is a Programming language as well\
    \ as a platform. Java is a high level, robust, object-oriented and secure programming\
    \ language. Java was developed by Sun Microsystems (which is now a subsidiary\
    \ of Oracle) in the year 1995. James Gosling is known as the father of Java. Before\
    \ Java, its name was Oak. Since, Oak was already a registered company, so James\
    \ Gosling and his team changed the name to Java.\n\n### Platform\nAny hardware\
    \ or software environment in which a program runs, is known as a platform. Since\
    \ Java has runtime environment (`JRE`) and API, it is called a platform.\n\n###\
    \ Example\nLet's have a quick look at Java programming example.\n```java\nclass\
    \ Example{\n    public static void main(String args[]){\n        System.out.println(\"\
    Hello Java\");\n    }\n}\n```\n\n### Applications of Java\nAccording to Sun, 3\
    \ billion devices run Java. There are many devices where Java currently used.\
    \ Some of them are as follows:\n1. Desktop Applications such as acrobat reader,\
    \ media player, etc.\n2. Web Applications such as irctc.co.in, javatpoint.com,\
    \ etc.\n3. Enterprise Applications such as banking applications.\n4. Mobile\n\
    5. Embedded System\n6. Smart Card\n7. Robotics\n8. Games, etc.\n\n### Types of\
    \ Java Applications\nThere are mainly 4 types of applications that can be created\
    \ using Java programming:\n1. **Standalone Application**: Standalone applications\
    \ are also known as desktop applications or window-based applications. These are\
    \ traditional software that we need to install on every machine. `AWT` and `Swing`\
    \ are used in Java for creating standalone applications.\n2. **Web Application**:\
    \ An application that runs on the server side and creates a dynamic page is called\
    \ a web application. Currently, etc. technologies are used for creating web applications\
    \ in Java.\n3. **Enterprise Application**: An application that is distributed\
    \ in nature, such as banking applications, etc. is called enterprise application.\
    \ It has advantages of the high-level security, load balancing, and clustering.\
    \ In Java, `EJB` is used for creating enterprise applications.\n4. **Mobile Application**:\
    \ An application which is created for mobile devices is called a mobile application.\
    \ Currently, Android and Java ME are used for creating mobile applications.\n\n\
    ### Java Platforms / Editions\n1. **Java SE (Java Standard Edition)**: It is a\
    \ Java programming platform. It includes Java programming APIs such as `java.lang`,\
    \ `java.io`, `java.net`, `java.util`, `java.sql`, `java.math` etc. It includes\
    \ core topics like OOPs, Regex, Exception, Inner classes, Multithreading, I/O\
    \ Stream, Networking, AWT, Swing, Reflection, Collection, etc.\n2. **Java EE (Java\
    \ Enterprise Edition)**: It is an enterprise platform which is mainly used to\
    \ develop web and enterprise applications. It is built on the top of the Java\
    \ SE platform. It includes topics like `Servlet`, `JSP`, Web Services, `EJB`,\
    \ etc.\n3. **Java ME (Java Micro Edition)**: It is a micro platform which is mainly\
    \ used to develop mobile applications.\n4. **JavaFX**: It is used to develop rich\
    \ internet applications. It uses a light-weight user interface API.\n\n## History\
    \ of Java\nThe history of Java is very interesting. Java was originally designed\
    \ for interactive television, but it was too advanced technology for the digital\
    \ cable television industry at the time. The history of Java starts with the Green\
    \ Team. Java team members (also known as Green Team), initiated this project to\
    \ develop a language for digital devices such as set-top boxes, televisions, etc.\
    \ However, it was suited for internet. Later, Java technology was incorporated\
    \ by Netscape. James Gosling, Mike Sheridan, and Patrick Naughton started the\
    \ project in the early '90s.\n\nArthur Gosling, often referred to as \"Dr. Java\"\
    . There are given points that describe the history of Java:\n1. James Gosling,\
    \ Mike Sheridan, and Patrick Naughton initiated the Java language in June 1991.\n\
    2. The small team of sun called Green Team.\n3. Initially designed for small,\
    \ embedded systems in electronic appliances like set-top boxes.\n4. After that,\
    \ it was called Oak and was developed as a part of the Green project.\n\n### Why\
    \ Oak?\nOak is a symbol of strength and chosen as a national tree of many countries\
    \ like U.S.A., Germany, Romania. In 1995, Oak was renamed as \"Java\" because\
    \ it was already a trademark by Oak Technologies.\n\n### Why named Java?\nThe\
    \ team gathered to choose a new name. The suggested words were \"dynamic\", \"\
    revolutionary\", \"Silk\", \"jolt\", \"DNA\", etc. They wanted something that\
    \ reflected the essence of the technology: revolutionary, dynamic, lively, cool,\
    \ unique, and easy to say. \n\n## Java Version History\nMany java versions have\
    \ been released till now. The current stable release of Java is Java SE 10.\n\
    1. JDK Alpha and Beta (1995)\n2. JDK 1.0 (23rd Jan 1996)\n3. JDK 1.1 (19th Feb\
    \ 1997)\n4. J2SE 1.2 (8th Dec 1998)\n5. J2SE 1.3 (8th May 2000)\n6. J2SE 1.4 (6th\
    \ Feb 2002)\n7. J2SE 5.0 (30th Sep 2004)\n8. Java SE 6 (11th Dec 2006)\n9. Java\
    \ SE 7 (28th July 2011)\n10. Java SE 8 (18th Mar 2014)\n11. Java SE 9 (21st Sep\
    \ 2017)\n12. Java SE 10 (20th Mar 2018)\n\n## Features of Java\nThe primary objective\
    \ of Java programming language creation was to make it portable, simple and secure\
    \ programming language. Apart from this, there are also some excellent features\
    \ which play an important role in the popularity of this language. The features\
    \ of Java are also known as java.\n\nA list of most important features of Java\
    \ language is given below.\n1. Simple\n2. Object-Oriented\n3. Portable\n4. Platform\
    \ independent\n5. Secured\n6. Robust\n7. Architecture neutral\n8. Interpreted\n\
    9. High Performance\n10. Multithreaded\n11. Distributed\n12. Dynamic\n13. Simple\n\
    \nJava is very easy to learn, and its syntax is simple, clean and easy to understand.\
    \ According to Sun, Java language is a simple programming language because:\n\
    - Java syntax is based on `C++` (so easier for programmers to learn it after `C++`).\n\
    - Java has removed many complicated and rarely-used features, for example, explicit\
    \ pointers, operator overloading, etc.\n- There is no need to remove unreferenced\
    \ objects because there is an Automatic Garbage Collection in Java.\n\n### Object-oriented\n\
    Java is an object-oriented programming language. Everything in Java is an object.\
    \ Object-oriented means we organize our software as a combination of different\
    \ types of objects that incorporates both data and behavior.\n\n- **Object-oriented\
    \ programming (OOPs)** is a methodology that simplifies software development and\
    \ maintenance by providing some concepts.\n- **Basic concepts of OOPs**:\n   \
    \ - Object\n    - Class\n    - Inheritance\n    - Polymorphism\n    - Abstraction\n\
    \    - Encapsulation\n\n### Object\nAny entity that has state and behavior is\
    \ known as an object. For example, a chair, pen, table, keyboard, bike, etc. It\
    \ can be physical or logical. An Object can be defined as an instance of a class.\
    \ An object contains an address and takes up some space. Objects can communicate\
    \ without knowing the details of each other's data or code. The only necessary\
    \ thing is the type of message accepted and the type of response returned by the\
    \ objects. Example: A dog is an object because it has states like color, name,\
    \ breed, etc. as well as behaviors like wagging the tail, barking, etc.\n\n###\
    \ Class\nCollection of objects is called class. It is a logical entity. A class\
    \ can also be defined as a blueprint from which you can create an individual object.\
    \ Class doesn't consume any space.\n\n### Inheritance\nWhen one object acquires\
    \ all the properties and behaviors of a parent object, it is known as inheritance.\
    \ It provides code reusability. It is used to achieve runtime polymorphism. When\
    \ you inherit from an existing class, you can reuse methods and fields in your\
    \ current class.\n\n### Polymorphism\nIf one task is performed in different ways,\
    \ it is known as polymorphism. For example: to convince the customer differently,\
    \ to draw something, for example, shape, triangle, etc. In Java, we use method\
    \ overloading and method overriding to achieve polymorphism. Another example can\
    \ be to speak something; for example, a cat speaks meow, dog barks woof, etc.\n\
    \n### Abstraction\nHiding internal details and showing functionality is known\
    \ as abstraction. For example phone call, we don't know the internal processing.\
    \ In Java, we use `abstract class` and `interface` to achieve abstraction.\n\n\
    ### Encapsulation\nBinding (or wrapping) code and data together into a single\
    \ unit are known as encapsulation. For example, a capsule, it is wrapped with\
    \ different medicines. A java class is the example of encapsulation. Java bean\
    \ is the fully encapsulated class because all the data members are private here.\n\
    \n### Classes and Objects\nIn this chapter, we will learn about Java objects and\
    \ classes. In object-oriented programming technique, we design a program using\
    \ objects and classes. An object in Java is the physical as well as a logical\
    \ entity, whereas, a class in Java is a logical entity only.\n\n### What is an\
    \ object in Java?\nAn entity that has state and behavior is known as an object.\
    \ e.g., chair, bike, marker, pen, table. It can be physical or logical (tangible\
    \ and intangible). An object has three characteristics:\n- **State**: represents\
    \ the data (value) of an object.\n- **Behavior**: represents the behavior (functionality)\
    \ of an object.\n- **Identity**: An object is typically implemented via a unique\
    \ ID. The value of the ID is not visible to the external user. It is used internally\
    \ by JVM to identify each object.\n\n### What is a class?\nA class is a group\
    \ of objects which have common properties. It is a template or blueprint from\
    \ which objects are created. It can't physical. A class can contain:\n- Fields\n\
    - Methods\n- Constructors\n- Blocks\n- Nested class and interface\n\n### Syntax\
    \ to declare a class:\n```java\nclass {\n    field;\n    method;\n}\n```\n\n###\
    \ Object Definitions:\nAn object is a real-world entity. An object is a runtime\
    \ entity.\n\n### Instance variable in Java\nA variable which is created inside\
    \ the class but outside the method is known as instance variable. Instance variable\
    \ doesn't get memory at compile time. It gets memory at runtime.\n\n### Method\
    \ in Java\nIn Java, a method is like a function which is used to expose the behavior\
    \ of an object.\n\n## Ways to Initialize Object\nThere are 3 ways to initialize\
    \ object in Java:\n1. By reference variable\n2. By method\n3. By constructor\n\
    \n### Object and Class Example: Initialization through reference\nInitializing\
    \ an object means storing data into the object. Let's see a simple example where\
    \ we are going to initialize the object through a reference variable.\n(See code\
    \ omitted for brevity in this summary)\n\n### Java Default Constructor\nA constructor\
    \ is called \"Default Constructor\" when it doesn't have any parameter.\n\n###\
    \ Syntax of default constructor:\n```java\n{}\n```\n\n### Example of default constructor\n\
    In this example, we are creating the no-arg constructor in the `Bike` class.\n\
    ```java\nclass Bike1{\n    Bike1(){\n        System.out.println(\"Bike is created\"\
    \n    }\n}\n```\n\n## Java Parameterized Constructor\nA constructor which has\
    \ a specific number of parameters is called a parameterized constructor.\n\n###\
    \ Why use the parameterized constructor?\nThe parameterized constructor is used\
    \ to provide different values to distinct objects. However, you can provide the\
    \ same values also.\n\n### Example of parameterized constructor\nIn this example,\
    \ we have created the constructor of `Student` class that have two parameters.\
    \ We can have any number of parameters in the constructor.\n```java\nclass Student4{\n\
    \    int id;\n    String name;\n    Student4( int i, String n){\n        id =\
    \ i;\n        name = n;\n    }\n}\n```\n\n## Constructor Overloading in Java\n\
    In Java, a constructor is just like a method but without return type. It can be\
    \ overloaded like methods. Constructor overloading in Java is a technique of having\
    \ more than one constructor with different parameter lists. They are differentiated\
    \ by the compiler by the number of parameters and their types.\n\n### Example\
    \ of Constructor Overloading\n```java\nclass Student5{\n    int id;\n    String\
    \ name;\n    int age;\n    Student5( int i, String n){\n        id = i;\n    \
    \    name = n;\n    }\n    Student5( int i, String n, int a){\n        id = i;\n\
    \        name = n;\n        age=a;\n    }\n}\n```\n\n## Copy Constructor\nThere\
    \ is no copy constructor in Java. However, we can copy the values from one object\
    \ to another like copy constructor in C++. There are many ways to copy the values\
    \ of one object into another in Java:\n- By constructor\n- By assigning the values\
    \ of one object into another\n- By `clone()` method of `Object` class\n\n## Copying\
    \ values without constructor\nWe can copy the values of one object into another\
    \ by assigning the objects values to another object. In this case, there is no\
    \ need to create the constructor.\n```java\ns2.id = s1.id;\n// ...\n```\n\n##\
    \ Variables, Data Types, Operators\n### Java Variables\nA variable is a container\
    \ which holds the value while the Java program is executed. A variable is assigned\
    \ with a data type. Variable is a name of memory location. There are three types\
    \ of variables in java: local, instance and static.\n\n### Variable\nVariable\
    \ is name of reserved area allocated in memory. In other words, it is a name of\
    \ memory location. It is a combination of \"vary + able\" that means its value\
    \ can be changed.\n```java\nint data=50; //Here data is variable\n```\n\n### Data\
    \ Types in Java\nThere are two types of data types in Java: primitive and non-primitive.\n\
    \n## Operators\nOperator in Java is a symbol used to perform operations. For example:\
    \ `+`, `-`, `*`, `/` etc. There are many types of operators in Java which are\
    \ given below:\n- Unary Operator\n- Arithmetic Operator\n- Shift Operator\n- Relational\
    \ Operator\n- Bitwise Operator\n- Logical Operator\n- Ternary Operator and Assignment\
    \ Operator\n\n### Operator Precedence\n(Refer to images)\n\n### Unary Operator\n\
    The Java unary operators require one operand. Unary operators are used to perform\
    \ various operations i.e.:\n- increment/decrementing a value by one\n- negating\
    \ an expression\n- inverting the value of a boolean\n\n### Arithmetic Operators\n\
    Java arithmatic operators are used to perform addition, subtraction, multiplication,\
    \ and division. They act as basic mathematical operations.\n\n### Left Shift Operator\n\
    The Java left shift operator `<<` is used to shift all of the bits in a value\
    \ to the left side of a specified number of times.\n\n### Right Shift Operator\n\
    The Java right shift operator `>>` is used to move left operands to right by the\
    \ number of bits specified by the operand.\n\n### Unsigned Shift Operator\nFor\
    \ negative number, `>>>` changes parity bit (MSB) to 0.\n\n### Logical Operator\n\
    The logical `&&` operator doesn't check second condition if first condition is\
    \ true. It checks second condition only if first one is false.\n\n### Bitwise\
    \ Operator\nThe bitwise `|` operator always checks both conditions whether first\
    \ condition is true or false.\n\n### Ternary Operator\nJava Ternary operator is\
    \ used as one liner replacement for if-then-else statement and used a lot in Java\
    \ programming. it is the only conditional operator which takes three operands.\n\
    \n### Assignment Operator\nJava assignment operator is one of the most common\
    \ operator. It is used to assign the value on its right to the operand on left.\n\
    \n## Multithreading\n### Overview of Multithreading\nMultithreading in Java is\
    \ a process of executing multiple threads simultaneously. A thread is a lightweight\
    \ sub-process, the smallest unit of processing. Multiprocessing and multithreading,\
    \ both are used to achieve multitasking. However, we use multithreading than multiprocessing\
    \ because threads use a shared memory area. They don't allocate separate memory\
    \ area so saves memory, and context-switching between the threads takes less time\
    \ than process.\n\n### Multitasking\nMultitasking is a process of executing multiple\
    \ tasks simultaneously. We use multitasking to utilize the CPU. Multitasking can\
    \ be achieved in two ways:\n1. **Process-based Multitasking (Multiprocessing)**:\
    \ Each process has an address in memory. In other words, each process allocates\
    \ a separate memory area. A process is heavyweight. Cost of communication between\
    \ the process is high.\n2. **Thread-based Multitasking (Multithreading)**: Threads\
    \ share the same address space. A thread is lightweight. Cost of communication\
    \ between the thread is low. Note: At a time one thread is executed.\n\n### Thread\n\
    Java provides Thread class to achieve thread programming. Thread class provides\
    \ constructors and methods to create and perform operations on a thread. Thread\
    \ extends Object.\n\n### Lifecycle and States of a Thread\nA thread in Java at\
    \ any point of time exists in any one of the following states. A thread lies only\
    \ in one of the shown states at any instant:\n1. New\n2. Runnable\n3. Blocked\n\
    4. Waiting\n5. Timed Waiting\n6. Terminated\n\n### Implementing Thread States\
    \ in Java\nIn Java, to get the current state of the thread, use `getState()` method.\
    \ Java provides `java.lang.Thread.State` class that defines ENUM constants for\
    \ the state of a thread.\n- `NEW`: Thread state for a thread which has not yet\
    \ started.\n- `RUNNABLE`: Thread state for a runnable thread.\n- `BLOCKED`: Thread\
    \ state for a thread waiting for monitor lock.\n- `WAITING`: Thread state for\
    \ a waiting thread.\n- `TIMED_WAITING`: Thread state for a waiting thread with\
    \ a specified waiting time.\n- `TERMINATED`: Thread state for a terminated thread.\n\
    \n## Thread Priority\nIn a Mult threading environment, thread scheduler assigns\
    \ processor to a thread based on priority of thread. Whenever we create a thread\
    \ in Java, it always has some priority assigned to it. Priority can either be\
    \ given by JVM while creating the thread or can be given by programmer explicitly.\
    \ Accepted value of priority for a thread is in range of 1 to 10. There are 3\
    \ static variables defined in Thread class for priority:\n- `MIN_PRIORITY`: This\
    \ is minimum priority that a thread can have. Value for this is 1.\n- `NORM_PRIORITY`:\
    \ This is default priority of a thread if do explicitly define it. Value for this\
    \ is 5.\n- `MAX_PRIORITY`: This is maximum priority of a thread. Value for this\
    \ is 10.\n\n### Get and Set Thread Priority\n1. `public final int getPriority()`:\
    \ `java.lang.Thread.getPriority()` method returns priority of given thread.\n\
    2. `public final void setPriority(int newPriority)`: `java.lang.Thread.setPriority()`\
    \ method changes the priority of thread to the value `newPriority`. This method\
    \ throws `IllegalArgumentException` if value of parameter `newPriority` goes beyond\
    \ minimum(1) and maximum(10) limit.\n\n## Java Misc\n### Java Applets\nApplet\
    \ is a special type of program that is embedded in the webpage to generate dynamic\
    \ content. It runs inside the browser.\n\n### Lifecycle of Applet\nThe `java.applet.Applet`\
    \ class provides 4 cycle methods:\n- `init()`: used to initialize. Invoked only\
    \ once.\n- `start()`: invoked after `init()` method or browser is maximized.\n\
    - `stop()`: used to stop the applet. Invoked when browser is minimized.\n- `destroy()`:\
    \ used to destroy the applet. Invoked only once.\n\n### Displaying Graphics in\
    \ Applet\n`java.awt.Graphics` class provides many methods for graphics programming.\
    \ Commonly used methods:\n- `public abstract void drawString(String str, int x,\
    \ int y)`: used to draw the specified string.\n- `public void drawRect(int x,\
    \ int y, int width, int height)`: draws a rectangle with specified width and height.\n\
    - `public abstract void fillRect(int x, int y, int width, int height)`: fills\
    \ rectangle with default color and width and height.\n- `public abstract void\
    \ drawOval(int x, int y, int width, int height)`: draws oval with specified width\
    \ and height.\n- `public abstract void fillOval(int x, int y, int width, int height)`:\
    \ fills oval with default color and width and height.\n- `public abstract void\
    \ drawLine(int x1, int y1, int x2, int y2)`: draws line between points $(x1, y1)$\
    \ and $(x2, y2)$.\n- `public abstract boolean drawImage(Image img, int x, int\
    \ y, Observer observer)`: used to draw specified image.\n- `public abstract void\
    \ drawArc(int x, int y, int width, int height, int startAngle, int arcAngle)`:\
    \ draws circular or elliptical arc.\n- `public abstract void fillArc(int x, int\
    \ y, int width, int height, int startAngle, int arcAngle)`: fills circular or\
    \ elliptical arc.\n- `public abstract void setColor(Color c)`: sets graphics color\
    \ to specified color.\n- `public abstract void setFont(Font font)`: sets graphics\
    \ font to specified font.\n\n### Displaying Image in Applet\nApplet is mostly\
    \ used in games and animation. The `java.awt.Graphics` class provide `drawImage()`\
    \ to display the image.\nSyntax: `public abstract boolean drawImage(Image img,\
    \ int x, int y, Observer observer)` is used to draw specified image.\n\n### How\
    \ to get the object of Image\nThe `java.applet.Applet` class provides `getImage()`\
    \ method that returns the object of `Image`.\nSyntax: `public Image getImage(URL\
    \ u, String image)`\nOther required methods of `Applet`:\n- `getDocumentBase()`:\
    \ used to return document.\n- `getCodeBase()`: used to return the base URL.\n\n\
    ### Event Handling in Applet\nAs we perform event handling in `AWT` or `Swing`,\
    \ we can perform it in applet also.\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
    import java.awt.event.*;\npublic class EventApplet extends Applet implements ActionListener{\n\
    \    Button b;\n    TextField tf;\n    public void init() {\n        tf = new\
    \ TextField();\n        tf.setBounds(30, 40, 150, 20);\n        b = new Button(\"\
    Click\");\n        b.setBounds(80, 150, 60, 50);\n        add(b);add(tf);\n  \
    \      b.addActionListener(this);\n        setLayout(null);\n    }\n    public\
    \ void actionPerformed(ActionEvent e) {\n        tf.setText(\"Welcome\");\n  \
    \  }\n}\n```\n\n## Exception Handling\nException Handling in Java is one of the\
    \ powerful mechanism to handle runtime errors so that normal flow of the application\
    \ can be maintained.\n\n### What is Exception in Java?\nDictionary: Exception\
    \ is an abnormal condition. In Java, an exception is an event that disrupts the\
    \ normal flow of the program. It is an object which is thrown at runtime.\n\n\
    ### What is Exception Handling?\nException Handling is mechanism to handle runtime\
    \ errors such as `ClassNotFoundException`, `IOException`, `RemoteException`, etc.\n\
    \n### Advantage of Exception Handling\nThe core advantage of exception handling\
    \ is to maintain the normal flow of the application. An exception normally disrupts\
    \ the flow of the application. This is why we use exception handling.\n\n### Common\
    \ Scenarios of Java Exceptions\n1. **ArithmeticException**: If you divide any\
    \ number by zero, there occurs `ArithmeticException`.\n2. **NullPointerException**:\
    \ If you have a null value in any variable, performing any operation on the variable\
    \ throws `NullPointerException`.\n3. **NumberFormatException**: The wrong formatting\
    \ of any value may occur. Suppose I have a string variable that has characters,\
    \ converting this variable into digit will occur `NumberFormatException`.\n4.\
    \ **ArrayIndexOutOfBoundsException**: If you are inserting any value in the wrong\
    \ index, it would result in `ArrayIndexOutOfBoundsException`.\n\n### Java try-catch\
    \ block\nThe `try` block is used to enclose the code that might throw an exception.\
    \ It must be used within the method. If an exception occurs at the particular\
    \ statement of `try` block, the rest of the block code will not execute. So it\
    \ is recommended not to keeping the code in `try` that will not throw an exception.\
    \ `try` block must be followed by either `catch` or `finally` block.\n\n### Syntax\
    \ of Java try-catch\n```java\ntry {\n    //code that may throw an exception\n\
    } catch (Exception_class_Name ref){}\n```\n\n### Syntax of try-finally block\n\
    ```java\ntry {\n    //code that may throw an exception\n} finally {}\n```\n\n\
    ### Java catch block\nJava `catch` block is used to handle the Exception by declaring\
    \ the type of exception within the parameter. The declared exception must be the\
    \ parent class exception (i.e., Exception) or the generated exception type. However,\
    \ the good approach is to declare the generated type of exception. The `catch`\
    \ block must be used after the `try` block only. You can use multiple catch block\
    \ with a single `try` block.\n\n### Problem without exception handling\nLet's\
    \ try to understand the problem if we don't use a `try-catch` block.\n**Example\
    \ 1**\n```java\npublic class TryCatchExample1 {\n    public static void main(String[]\
    \ args) {\n        int data= 50 / 0; //may throw exception\n        System.out.println(\"\
    rest of the code\");\n    }\n}\n```\nOutput: `Exception in thread \"main\" java.lang.ArithmeticException:/by\
    \ zero`\nAs displayed in the above example, the rest of the code is not executed.\n\
    \n### Solution by exception handling\nLet's see the solution of the above problem\
    \ by `try-catch` block.\n**Example 2**\n```java\npublic class TryCatchExample2\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int data= 50 / 0; //may throw exception\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
    rest of the code\");\n    }\n}\n```\nOutput: `java.lang.ArithmeticException: by\
    \ zero`\nAs displayed in the above example, the rest of the code is printed.\n\
    \n**Example 3**\n```java\npublic class TryCatchExample3 {\n    public static void\
    \ main(String[] args) {\n        try {\n            int data= 50 / 0; //may throw\
    \ exception\n            System.out.println(\"rest of the code\");\n        }\
    \ catch (ArithmeticException e) {\n            System.out.println(e);\n      \
    \  }\n    }\n}\n```\nOutput: `java.lang.ArithmeticException: by zero`\nHere we\
    \ can see that if an exception occurs in `try` block, the rest of the block will\
    \ not execute.\n\n**Example 4**\n```java\npublic class TryCatchExample4 {\n  \
    \  public static void main(String[] args) {\n        try {\n            int data=\
    \ 50 / 0; //may throw exception\n        } catch (Exception e) {\n           \
    \ System.out.println(e);\n        }\n        System.out.println(\"rest of the\
    \ code\");\n    }\n}\n```\nOutput: `java.lang.ArithmeticException: by zero`\n\
    `rest of the code`\n\n### Internal working of java try-catch block\nThe `JVM`\
    \ firstly checks whether the exception is handled or not. If exception is not\
    \ handled, `JVM` provides a default exception handler that performs the following:\n\
    - Prints out exception description.\n- Prints the stack trace (Hierarchy of methods\
    \ where the exception occurred).\n- Causes the program to terminate.\nBut if exception\
    \ is handled by the application, normal flow is maintained.\n\n### Java multiple\
    \ exceptions\nA `try` block can be followed by one or more `catch` blocks. Each\
    \ `catch` block must contain a different exception handler.\nPoints to remember:\n\
    - At a time only one exception occurs and at a time only one `catch` block is\
    \ executed.\n- All `catch` blocks must be ordered from most specific to most general,\
    \ i.e `catch` for `ArithmeticException` must come before `catch` for `Exception`.\n\
    \n**Example 1**\n```java\npublic class MultipleCatchBlock1 {\n    public static\
    \ void main(String[] args) {\n        try {\n            int a[]= new int [ 5\
    \ ];\n            a[ 5 ]= 30 / 0;\n        } catch (ArithmeticException e) {\n\
    \            System.out.println(\"Arithmetic Exception occurs\");\n        } catch\
    \ (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"ArrayIndexOutOfBounds\
    \ Exception occurs\");\n        } catch (Exception e) {\n            System.out.println(\"\
    Parent Exception occurs\");\n        }\n        System.out.println(\"rest of the\
    \ code\");\n    }\n}\n```\nOutput: `Arithmetic Exception occurs`, `rest of the\
    \ code`\n\n**Example 2**\n```java\npublic class MultipleCatchBlock2 {\n    public\
    \ static void main(String[] args) {\n        try {\n            int a[]= new int\
    \ [ 5 ];\n            System.out.println(a[ 10 ]);\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"Arithmetic Exception occurs\");\n   \
    \     } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    ArrayIndexOutOfBounds Exception occurs\");\n        } catch (Exception e) {\n\
    \            System.out.println(\"Parent Exception occurs\");\n        }\n   \
    \     System.out.println(\"rest of the code\");\n    }\n}\n```\nOutput: `ArrayIndexOutOfBounds\
    \ Exception occurs`, `rest of the code`\n\n**Example 3**\n```java\npublic class\
    \ MultipleCatchBlock3 {\n    public static void main(String[] args) {\n      \
    \  try {\n            int a[]= new int [ 5 ];\n            a[ 5 ]= 30 / 0;\n \
    \           System.out.println(a[ 10 ]);\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"Arithmetic Exception occurs\");\n   \
    \     } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    ArrayIndexOutOfBounds Exception occurs\");\n        } catch (Exception e) {\n\
    \            System.out.println(\"Parent Exception occurs\");\n        }\n   \
    \     System.out.println(\"rest of the code\");\n    }\n}\n```\nOutput: `Arithmetic\
    \ Exception occurs`, `rest of the code`\n\n**Example 4**\n```java\npublic class\
    \ MultipleCatchBlock4 {\n    public static void main(String[] args) {\n      \
    \  try {\n            String s= null;\n            System.out.println(s.length());\n\
    \        } catch (ArithmeticException e) {\n            System.out.println(\"\
    Arithmetic Exception occurs\");\n        } catch (ArrayIndexOutOfBoundsException\
    \ e) {\n            System.out.println(\"ArrayIndexOutOfBounds Exception occurs\"\
    );\n        } catch (Exception e) {\n            System.out.println(\"Parent Exception\
    \ occurs\");\n        }\n        System.out.println(\"rest of the code\");\n \
    \   }\n}\n```\nOutput: `Parent Exception occurs`, `rest of the code`\n\n**Example\
    \ 5**\n```java\npublic class MultipleCatchBlock5 {\n    public static void main(String[]\
    \ args) {\n        try {\n            int a[]= new int [ 5 ];\n            a[\
    \ 5 ]= 30 / 0;\n        } catch (Exception e){\n            System.out.println(\"\
    common task completed\");\n        } catch (ArithmeticException e){\n        \
    \    System.out.println(\"task1 is completed\");\n        } catch (ArrayIndexOutOfBoundsException\
    \ e){\n            System.out.println(\"task 2 completed\");\n        }\n    \
    \    System.out.println(\"rest of the code...\");\n    }\n}\n```\nOutput: `Compile-time\
    \ error`\n\n### Nested try block\nThe `try` block within a `try` block is known\
    \ as nested `try`.\nWhy use nested try?\nSometimes a situation may arise where\
    \ a part of block may cause one error and the entire block itself may cause another.\
    \ In such cases, exception handlers have to be nested.\nSyntax:\n```java\ntry\
    \ {\n    statement 1;\n    statement 2;\n    try {\n        statement 1;\n   \
    \     statement 2;\n    } catch (Exception e){}\n} catch (Exception e) {}\n```\n\
    \n### Nested try example\n```java\nclass Excep6{\n    public static void main(String[]\
    \ args[]){\n        try {\n            try {\n                System.out.println(\"\
    going to divide\");\n                int b = 39 / 0 ;\n            } catch (ArithmeticException\
    \ e){\n                System.out.println(e);\n            }\n            try\
    \ {\n                int a[]= new int [ 5 ];\n                a[ 5 ]= 4 ;\n  \
    \          } catch (ArrayIndexOutOfBoundsException e){\n                System.out.println(e);}\n\
    \            }\n        } catch (Exception e){\n            System.out.println(\"\
    handeled\" );\n        }\n        System.out.println(\"normal flow..\" );\n  \
    \  }\n}\n```\n\n## Java finally block\nJava `finally` block is a block that is\
    \ used to execute important code such as closing connection, stream etc. Java\
    \ `finally` block is always executed whether exception is handled or not. Java\
    \ `finally` block follows `try` or `catch` block.\nNote: If you don't handle exception,\
    \ before terminating the program, `JVM` executes `finally` block (if any).\n\n\
    ### Why use finally\n`finally` block in java can be used to put \"cleanup\" code\
    \ such as closing a file, closing connection etc.\n\n### Usage of Java finally\n\
    **Case 1**: Exception doesn't occur.\n```java\nclass TestFinallyBlock{\n    public\
    \ static void main(String[] args[]){\n        try {\n            int data= 25\
    \ / 5 ;\n            System.out.println(data);\n        } catch (NullPointerException\
    \ e){System.out.println(e);}\n        finally {System.out.println( \"finally block\
    \ is always executed\" );}\n        System.out.println( \"rest of the code...\"\
    \ );\n    }\n}\n```\nOutput: `5`, `finally block is always executed rest of the\
    \ code...`\n\n**Case 2**: Exception occurs and not handled.\n```java\nclass TestFinallyBlock1{\n\
    \    public static void main(String[] args[]){\n        try {\n            int\
    \ data= 25 / 0 ;\n            System.out.println(data);\n        } catch (NullPointerException\
    \ e){System.out.println(e);}\n        finally {System.out.println( \"finally block\
    \ is always executed\" );}\n        System.out.println( \"rest of the code...\"\
    \ );\n    }\n}\n```\nOutput: `finally block is always executed rest of the code...`\n\
    \n**Case 3**: Exception occurs and handled.\n```java\nclass TestFinallyBlock{\n\
    \    public static void main(String[] args[]){\n        try {\n            int\
    \ data= 25 / 0 ;\n            System.out.println(data);\n        } catch (ArithmeticException\
    \ e){System.out.println(e);}\n        finally {System.out.println( \"finally block\
    \ is always executed\" );}\n        System.out.println( \"rest of the code...\"\
    \ );\n    }\n}\n```\nOutput: `finally block is always executed rest of the code...`\n\
    \n## Java throw keyword\nThe `throw` keyword is used to explicitly throw an exception.\
    \ We can throw either checked or unchecked exception.\n\n### Java throw example\n\
    In this example, we have created the `validate` method that takes integer value\
    \ as a parameter. If the age is less than 18, we are throwing the `ArithmeticException`\
    \ otherwise print a message welcome vote.\n```java\nclass TestThrow1{\n    static\
    \ void validate( int age){\n        if (age< 18 )\n            throw new ArithmeticException(\
    \ \"not valid\" );\n        else\n            System.out.println( \"welcome to\
    \ vote\" );\n    }\n    public static void main(String[] args[]){\n        validate(\
    \ 13 );\n        System.out.println( \"rest of the code...\" );\n    }\n}\n```\n\
    Output: `Exception in main java.lang.ArithmeticException:not valid`\n\n## Java\
    \ throws keyword\nThe `throws` keyword is used to declare an exception. It gives\
    \ an information to the programmer that there may occur an exception so it is\
    \ better for the programmer to provide the exception handling code so that normal\
    \ flow can be maintained.\n\n### Syntax of java throws\n```java\nreturn_type method_name()\
    \ throws exception_class_name{\n    //method code\n}\n```\n\n### Difference between\
    \ throw and throws\nThere are many differences between `throw` and `throws` keywords.\
    \ A list of differences between `throw` and `throws` are given below:\n(Images\
    \ omitted)\n\n"
