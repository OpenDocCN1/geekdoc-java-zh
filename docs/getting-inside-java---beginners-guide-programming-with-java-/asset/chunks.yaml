    \n## 作者简介\n当印度 IT 行业发生重大演变时，Destiny 引导 Prem Kumar 接触了计算机。他在 Silli 理工学院完成了计算机科学工程教育，随后在布巴内斯瓦尔甘迪科技学院继续深造。Prem\
    \ 对探索 IT 知识充满热情，是快速发展的初创公司“F5 Developers”的创始人。他是各种技术领域备受青的演讲者，也是 Open Source 和\
    \ OSE Hub 的定期专栏作家。目前的身份包括 F5 Developers 的创始人（这是一家多服务提供公司，包括 F5 的子公司即 THOR、F5 Initiative\
    \ 和 OSE Hub）。为了感谢他的贡献，微软在 2019 年授予他 Java 编程领域享誉的“微软技术协士”奖。可以通过以下方式与他联系。\n\n##\
    \ 目录\n### 第一模块 – Java 编程简介\n- Java - 概述\n- Java 历史\n- Java 的特性\n- 开启 Java\n\n\
