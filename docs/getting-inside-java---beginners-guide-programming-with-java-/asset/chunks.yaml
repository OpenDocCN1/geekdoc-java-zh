    { 14\. int s; 15\. s=n1+n2; 16\. return s; //returning the sum 17\. } 18\. } Output: The
    sum of a and b is= 24 Static Method A method that has static keyword is known
    as static method. In other words, a method that belongs to a class rather than
    an instance of a class is known as a static method. We can also create a static
    method by using the keyword static before the method name. The main advantage
    of a static method is that we can call it without creating an object. It can access
    static data members and also change the value of it. It is used to create an instance
    method. It is invoked by using the class name. The best example of a static method
    is the main() method. **Example of static method Display.java 1\. public class
    Display 2\. { 3\. public static void main(String[] args) 4\. { 5\. show(); 6\.
    } 7\. static void show() 8\. { 9\. System.out.println( "It is an example of static
    method." ); 10\. } 11\. } 12\. Output: It is an example of a static method. Instance
    Method The method of the class is known as an instance method . It is a non-static
    method defined in the class. Before calling or invoking the instance method, it
    is necessary to create an object of its class. Let''s see an example of an instance
