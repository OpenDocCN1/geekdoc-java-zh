    In the above class, you are not creating any constructor so compiler provides
    you a default constructor. Here 0 and null values are provided by default constructor. Java
    Parameterized Constructor A constructor which has a specific number of parameters
    is called a parameterized constructor. Q. Why use the parameterized constructor? The
    parameterized constructor is used to provide different values to distinct objects.
    However, you can provide the same values also. Example of parameterized constructor In
