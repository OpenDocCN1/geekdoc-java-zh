    System.out.println(s2.toString()); 80\. } 81\. } Output: Shape constructor called
    Circle constructor called Shape constructor called Rectangle constructor called
    Circle color is Redand area is 15.205308443374602 Rectangle color is Yellow and
    area is 8.0 Encapsulation vs Data Abstraction 1\. Encapsulation is data hiding(information
    hiding) while Abstraction is detail hiding(implementation hiding). 2\. While encapsulation
    groups together data and methods that act upon the data, data abstraction deals
    with exposing the interface to the user and hiding the details of implementation. Advantages
    of Abstraction 1\. It reduces the complexity of viewing the things. 2\. Avoids
    code duplication and increases reusability. 3\. Helps to increase security of
    an application or program as only important details are provided to the user.Methods
    and Constructors Method in Java In general, a method is a way to perform some
    task. Similarly, the method in Java is a collection of instructions that performs
    a specific task. It provides the reusability of code. We can also easily modify
    code using In this section, we will learn what is a method in Java, types of methods,
    method declaration, and how to call a method in What is a method in Java? A method
    is a block of code or collection of statements or a set of code grouped together
    to perform a certain task or operation. It is used to achieve the reusability
    of code. We write a method once and use it many times. We do not require to write
    code again and again. It also provides the easy modification and readability of
    code, just by adding or removing a chunk of code. The method is executed only
    when we call or invoke it. The most important method in Java is the main() method. Method
    Declaration The method declaration provides information about method attributes,
    such as visibility, return-type, name, and arguments. It has six components that
    are known as method as we have shown in the following figure. ![](image-7v7jcoi6.jpg) Method
    Signature: Every method has a method signature. It is a part of the method declaration.
    It includes the method name and parameter Access Specifier: Access specifier or
    modifier is the access type of the method. It specifies the visibility of the
    method. Java provides four types of access specifier: Public: The method is accessible
    by all classes when we use public specifier in our application. Private: When
    we use a private access specifier, the method is accessible only in the classes
    in which it is defined. Protected: When we use protected access specifier, the
    method is accessible within the same package or subclasses in a different package. Default:
    When we do not use any access specifier in the method declaration, Java uses default
    access specifier by default. It is visible only from the same package only. Return
    Type: Return type is a data type that the method returns. It may have a primitive
    data type, object, collection, void, etc. If the method does not return anything,
    we use void keyword. Method Name: It is a unique name that is used to define the
    name of a method. It must be corresponding to the functionality of the method.
    Suppose, if we are creating a method for subtraction of two numbers, the method
    name must be subtraction(). A method is invoked by its name. Parameter List: It
    is the list of parameters separated by a comma and enclosed in the pair of parentheses.
    It contains the data type and variable name. If the method has no parameter, left
    the parentheses blank. Method Body: It is a part of the method declaration. It
    contains all the actions to be performed. It is enclosed within the pair of curly
    braces. Naming a Method While defining a method, remember that the method name
    must be a verb and start with a lowercase letter. If the method name has more
    than two words, the first name must be a verb followed by adjective or noun. In
    the multi-word method name, the first letter of each word must be in uppercase
    except the first word. For example: Single-word method name: sum(), area() Multi-word
    method name: areaOfCircle(), stringComparision() It is also possible that a method
    has the same name as another method name in the same class, it is known as method
    overloading . Types of Method There are two types of methods in Java: Predefined
    Method User-defined Method Predefined Method In Java, predefined methods are the
    method that is already defined in the Java class libraries is known as predefined
    methods. It is also known as the standard library method or built-in method .
    We can directly use these methods just by calling them in the program at any point.
    Some pre-defined methods are length(), equals(), compareTo(), sqrt(), etc. When
    we call any of the predefined methods in our program, a series of codes related
    to the corresponding method runs in the background that is already stored in the
    library. Each and every predefined method is defined inside a class. Such as print()
    method is defined in the java.io.PrintStream class. It prints the statement that
    we write inside the method. For example, print("Java") , it prints Java on the
    console. Let''s see an example of the predefined method. Demo.java 1\. public
    class Demo 2\. { 3\. public static void main(String[] args) 4\. { 5\. // using
    the max() method of Math class 6\. System.out.print( "The maximum number is: "
    + Math.max( 9, 7 )); 7\. } 8\. } Output: The maximum number is:9 In the above
    example, we have used three predefined methods main(), print(), and We have used
    these methods directly without declaration because they are predefined. The print()
    method is a method of PrintStream class that prints the result on the console.
    The max() method is a method of the Math class that returns the greater of two
    numbers. We can also see the method signature of any predefined method by using
    the link . When we go through the link and see the max() method signature, we
