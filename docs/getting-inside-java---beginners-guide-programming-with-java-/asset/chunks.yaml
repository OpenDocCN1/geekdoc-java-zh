    used in First Java Program Let''s see what is the meaning of class, public, static,
    void, main, String[], System.out.println(). class keyword is used to declare a
    class in java. public keyword is an access modifier which represents visibility.
    It means it is visible to all. static is a keyword. If we declare any method as
    static, it is known as the static method. The core advantage of the static method
