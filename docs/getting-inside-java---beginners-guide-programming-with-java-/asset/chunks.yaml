    see that the method signature has access specifier non-access modifier return
    type method name max(), parameter list (int a, int b). In the above example, instead
    of defining the method, we have just invoked the method. This is the advantage
    of a predefined method. It makes programming less complicated. Similarly, we can
    also see the method signature of the print() method. User-defined Method The method
    written by the user or programmer is known as a user-defined method. These methods
    are modified according to the requirement. How to Create a User-defined Method Let''s
    create a user defined method that checks the number is even or odd. First, we
    will define the method. 1\. //user defined method 2\. public static void findEvenOdd(
    int num) 3\. { 4\. //method body 5\. if (num% 2 == 0 ) 6\. System.out.println(num+
    " is even" ); 7\. else 8\. System.out.println(num+ " is odd" ); 9\. } We have
    defined the above method named findevenodd(). It has a parameter num of type int.
    The method does not return any value that''s why we have used void. The method
    body contains the steps to check the number is even or odd. If the number is even,
    it prints the number is else prints the number is How to Call or Invoke a User-defined
    Method Once we have defined a method, it should be called. The calling of a method
