    Does constructor return any value? Yes, it is the current class instance (You
    cannot use return type yet it returns a value). Q. Can constructor perform other
    tasks instead of initialization? Yes, like object creation, starting a thread,
    calling a method, etc. You can perform any operation in the constructor as you
    perform in the method. Q. Is there Constructor class in Java? Yes. Q. What is
    the purpose of Constructor class? Java provides a Constructor class which can
    be used to get the internal information of a constructor in the class. It is found
    in the java.lang.reflect package.Module IVMultithreadingOverview of Multithreading Multithreading
    in Java is a process of executing multiple threads simultaneously. A thread is
    a lightweight sub-process, the smallest unit of processing. Multiprocessing and
    multithreading, both are used to achieve multitasking. However, we use multithreading
    than multiprocessing because threads use a shared memory area. They don''t allocate
    separate memory area so saves memory, and context-switching between the threads
    takes less time than process. Java Multithreading is mostly used in games, animation,
    etc. Advantages of Java Multithreading: 1) It doesn''t block the user because
    threads are independent and you can perform multiple operations at the same time. 2)
    You can perform many operations together, so it saves time . 3) Threads are independent
    , so it doesn''t affect other threads if an exception occurs in a single thread. Multitasking Multitasking
    is a process of executing multiple tasks simultaneously. We use multitasking to
    utilize the CPU. Multitasking can be achieved in two ways: Process-based Multitasking
    (Multiprocessing) Thread-based Multitasking (Multithreading) 1) Process-based
    Multitasking (Multiprocessing) Each process has an address in memory. In other
    words, each process allocates a separate memory area. A process is heavyweight. Cost
    of communication between the process is high. Switching from one process to another
    requires some time for saving and loading registers , memory maps, updating lists,
    etc. 2) Thread-based Multitasking (Multithreading) Threads share the same address
    space. A thread is lightweight. Cost of communication between the thread is low.
    Note: At a time one thread is executed only. Java Thread class Java provides Thread
    class to achieve thread programming. Thread class provides constructors and methods
    to create and perform operations on a thread. Thread class extends Object class
    and implements Runnable interface. Java Thread Methods ![](image-fnhw252t.jpg) ![](image-e160p4vg.jpg) ![](image-jvpksq1k.jpg) ![](image-az3y9e0f.jpg) ![](image-eagbe73e.jpg) ![](image-0sy64wfo.jpg) Note:
    At least one process is required for each thread. What is Thread in java? A thread
    is a lightweight subprocess, the smallest unit of processing. It is a separate
    path of execution. Threads are independent. If there occurs exception in one thread,
    it doesn''t affect other threads. It uses a shared memory area. ![](image-a9b56l9h.jpg) As
    shown in the above figure, a thread is executed inside the process. There is context-switching
    between the threads. There can be multiple processes inside the OS, and one process
    can have multiple threads. Threads can be created by using two mechanisms : 1\.
    Extending the Thread class 2\. Implementing the Runnable Interface Thread creation
    by extending the Thread class We create a class that extends the java.lang.Thread
    class. This class overrides the run() method available in the Thread class. A
    thread begins its life inside run() method. We create an object of our new class
    and call start() method to start the execution of a thread. Start() invokes the
    run() method on the Thread object. 1\. // Java code for thread creation by extending 2\.
