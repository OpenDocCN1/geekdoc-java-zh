    args) 22\. { 23\. Parent a; 24\. a = new subclass1(); 25\. a.Print(); 26\. a =
    new subclass2(); 27\. a.Print(); 28\. } 29\. } Output: subclass1 subclass2Encapsulation Encapsulation
    is defined as the wrapping up of data under a single unit. It is the mechanism
    that binds together code and the data it manipulates.Other way to think about
    encapsulation is, it is a protective shield that prevents the data from being
    accessed by the code outside this shield. Technically in encapsulation, the variables
    or data of a class is hidden from any other class and can be accessed only through
    any member function of own class in which they are declared. As in encapsulation,
    the data in a class is hidden from other classes using the data hiding concept
    which is achieved by making the members or methods of class as private and the
    class is exposed to the end user or the world without providing any details behind
    implementation using the abstraction concept, so it is also known as combination
    of data-hiding and abstraction. . Encapsulation can be achieved by: Declaring
    all the variables in the class as private and writing public methods in the class
    to set and get the values of variables. 1\. 2\. // Java program to demonstrate
    encapsulation 3\. public class Encapsulate 4\. { 5\. // private variables declared 6\.
    // these can only be accessed by 7\. // public methods of class 8\. private String
    geekName; 9\. private int geekRoll; 10\. private int geekAge; 11\. 12\. // get
    method for age to access 13\. // private variable geekAge 14\. public int getAge() 15\.
    { 16\. return geekAge; 17\. } 18\. 19\. // get method for name to access 20\.
    // private variable geekName 21\. public String getName() 22\. { 23\. return geekName; 24\.
    } 25\. 26\. // get method for roll to access 27\. // private variable geekRoll 28\.
    public int getRoll() 29\. { 30\. return geekRoll; 31\. } 32\. 33\. // set method
    for age to access 34\. // private variable geekage 35\. public void setAge( int
    newAge) 36\. { 37\. geekAge = newAge; 38\. } 39\. 40\. // set method for name
    to access 41\. // private variable geekName 42\. public void setName(String newName) 43\.
    { 44\. geekName = newName; 45\. } 46\. 47\. // set method for roll to access 48\.
    // private variable geekRoll 49\. public void setRoll( int newRoll) 50\. { 51\.
    geekRoll = newRoll; 52\. } 53\. } In the above program the class EncapsulateDemo
    is encapsulated as the variables are declared as private. The get methods like
    getAge(), getName(), getRoll() are set as public, these methods are used to access
    these variables. The setter methods like setName(), setAge(), setRoll() are also
    declared as public and are used to set the values of the variables. The program
    to access variables of the class EncapsulateDemo is shown below: public class
    TestEncapsulation ![](image-iclo82nb.jpg) Output: Geek''s name: Harsh Geek''s age: 19 Geek''s roll: 51 Advantages
    of Encapsulation : Data Hiding: The user will have no idea about the inner implementation
    of the class. It will not be visible to the user that how the class is storing
    values in the variables. He only knows that we are passing the values to a setter
    method and variables are getting initialized with that value. Increased Flexibility:
    We can make the variables of the class as read-only or write-only depending on
    our requirement. If we wish to make the variables as read-only then we have to
    omit the setter methods like setName(), setAge() etc. from the above program or
    if we wish to make the variables as write-only then we have to omit the get methods
    like getName(), getAge() etc. from the above program Reusability: Encapsulation
    also improves the reusability and easy to change with new requirements. Testing
    code is easy: Encapsulated code is easy to test for unit testing.Abstraction Data
    Abstraction is the property by virtue of which only the essential details are
    displayed to the user.The trivial or the non-essentials units are not displayed
    to the user. Ex: A car is viewed as a car rather than its individual components. Data
    Abstraction may also be defined as the process of identifying only the required
    characteristics of an object ignoring the irrelevant details.The properties and
    behaviors of an object differentiate it from other objects of similar type and
    also help in classifying/grouping the objects. Consider a real-life example of
    a man driving a car. The man only knows that pressing the accelerators will increase
    the speed of car or applying brakes will stop the car but he does not know about
    how on pressing the accelerator the speed is actually increasing, he does not
    know about the inner mechanism of the car or the implementation of accelerator,
    brakes etc in the car. This is what abstraction is. In java, abstraction is achieved
    by interfaces and abstract classes. We can achieve 100% abstraction using interfaces. Abstract
    classes and Abstract methods : 1\. An abstract class is a class that is declared
    with abstract keyword. 2\. An abstract method is a method that is declared without
    an implementation. 3\. An abstract class may or may not have all abstract methods.
    Some of them can be concrete methods 4\. A method defined abstract must always
    be redefined in the subclass, thus making overriding compulsory OR either make
    subclass itself abstract. 5\. Any class that contains one or more abstract methods
    must also be declared with abstract keyword. 6\. There can be no object of an
    abstract class.That is, an abstract class can not be directly instantiated with
    the new operator . 7\. An abstract class can have parametrized constructors and
    default constructor is always present in an abstract class. When to use abstract
    classes and abstract methods with an example. There are situations in which we
    will want to define a superclass that declares the structure of a given abstraction
    without providing a complete implementation of every method. That is, sometimes
    we will want to create a superclass that only defines a generalization form that
    will be shared by all of its subclasses, leaving it to each subclass to fill in
    the details. Consider a classic “shape” example, perhaps used in a computer-aided
    design system or game simulation. The base type is “shape” and each shape has
    a color, size and so on. From this, specific types of shapes are derived(inherited)-circle,
    square, triangle and so on – each of which may have additional characteristics
    and behaviors. For example, certain shapes can be flipped. Some behaviors may
    be different, such as when you want to calculate the area of a shape. The type
    hierarchy embodies both the similarities and differences between the shapes. 1\.
