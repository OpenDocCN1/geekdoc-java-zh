    \ 杂项\n- Java Applets\n- 异常处理\n\n## 铭言\n“简单并不在复杂之前，而是紧随之后。” —— Prem Kumar\n\n##\
    \ 致谢\n从《深入浅 Java - 入门指南》这本书想法的构思到第一版的发布，这是一段几乎是全新的开始的旅程。在这段旅途中，我遇到了许多学生、开发者、教授、出版商和作者，他们对\
    \ Java 表达了自己的看法。他们是我完成这本书的主要动力。特别是，我非常感谢 Priya 女士，她对这个书的想法充满信心，相信我的写作能力，不断给予鼓励，并时提供有用的建议。我感谢上帝让我拥有这样的父母，没有他们，我无法获得一点知识。在此，我想感谢我的父亲\
    \ Rajan Mahto 博士和我的母亲 Manju Devi 女士，让我能够做到。在这个过程中，R.K. Raja、Mohit Kumar 和 Priya\
    \ 等人な编写程序、发现 Bug、绘制图表和准备索引方面提供了帮助。我相信凭借他们的集体智慧，所有程序在任何情况下都能正确运行。我要感谢我的初创公司 F5\
    \ Developers 的所有成员。我希望他们的梦想已经实现。感谢我的朋友 Priya，感谢她的友谊以及她对我所做的每件事的贡献。\n\n## 引言\n\
    本教材有两个主要目标。第一个是介绍 Java 语言。Java 是一种实用且目前流行的软件工具；它是世界上最流行的语言之一，特别是在嵌入式系统等领域。Java\
    \ 有助于编写非常高效且强大的代码，鉴于 Java 编译器的无处不在，它可以轻松移植到许多平台。第二个关键目标是介绍 OOP 的基本概念。在某种程度上，这是\
    \ Java 特有的：学习设计、编码和调试 Java 程序。\n\n## Java – 概述\n### 什么是 Java？\nJava 既是一种编程语言也是一个平台。Java\
    \ 是一种高级、健壮、面向对象且安全的编程语言。Java 由孙景系统公司（现为 Oracle 的子公司）于 1995 年开发。James Gosling 被称为\
    \ Java 之父。在 Java 之前，它的名字是 Oak。由于 Oak 已经是一家注册的公司，James Gosling 和他的团队将名字更改为 Java。\n\
    \n### 平台\n运行程序的任何硬件或软件环境被称为平台。由于 Java 拥有运行环境（`JRE`）和 API，因此被称为平台。\n\n### 示例\n\
    让我们快速看一下 Java 编程示例。\n```java\nclass Example{\n    public static void main(String\
    \ args[]){\n        System.out.println(\"Hello Java\");\n    }\n}\n```\n\n###\
    \ Java 的应用\n根据孙景系统的数据，有 30 亿台设备运行 Java。目前有很多设备在使用 Java。其中一些如下：\n1. 桌面应用程序，如 Acrobat\
    \ Reader、媒体播放器等。\n2. Web 应用程序，如 irctc.co.in、javatpoint.com 等。\n3. 企业级应用，如银行应用程序。\n\
    4. 移动端\n5. 嵌入式系统\n6. 智能卡\n7. 机器人\n8. 游戏等。\n\n### Java 应用的类型\n使用 Java 创建的应用主要有\
    \ 4 类：\n1. **独立应用程序**：也称为桌面应用程序或基于窗口的应用程序。这些需要在每台机器上安装的传统软件。`AWT` 和 `Swing` 用于创建独立应用程序。\n\
    2. **Web **：运行在服务器端并创建动态页面的应用程序。目前 Java 用于创建 Web 。\n3. **企业级应用**：具有分布式性质的应用程序，如银行应用程序。它具有高级安全性、负载均衡等优势。`EJB`\
    \ 用于创建企业级应用。\n4. **移动应用**：为移动设备创建的应用程序。目前 Android 和 Java ME 用于移动应用。\n\n### Java\
    \ 平台 / 版本\n1. **Java SE (标准版)**：一个 Java 编程平台。它包含了如 `java.lang`、`java.io`、`java.net`、`java.util`、`java.sql`、`java.math`\
    \ 等 Java API，以及 OOP、异常、内部类、多线程、I/O 流、网络、反射、集合。\n2. **Java EE (企业版)**：一个主要用于开发\
    \ Web 和企业级应用的平台。构建在 Java SE 平台之上，包含了 Servlet、JSP、Web Services 等。\n3. **Java ME\
    \ (微版)**：一个主要用于开发移动应用的微平台。\n4. **JavaFX**：用于开发富应用程序。它使用轻量级用户界面。\n\n### Java 历史\n\
    Java 的历史非常有趣。Java 最初是为交互式电视设计的，但当时的数字电缆行业技术太先进。Java 的历史始于 Green Team。Green Team\
    \ 的成员发起了这个项目，为机顶盒、电视等数字设备开发语言。后来，Java 技术被 Netscape 采用。James Gosling、Mike Sheridan\
    \ 和 Patrick Naughton 在 90 年代初启动了这个项目。Arthur Gosling 经常被称为“Java 博士”。以下点描述了 Java\
    \ 的历史：1. 1991 年 6 月发起了 Java 语言。2. 最初是为机顶盒等嵌入式系统设计的。3 之后它被称为 Oak，并作为 Green 项目的一部分被开发。\n\
    \n### 为什么叫 Oak？\nOak 是美国、德国、罗马尼亚等国家的国树。1995 年，Oak 被更名为 Java，因为 Oak 已经是 Oak Technologies\
    \ 的商标。\n\n### 为什么命名为 Java？\n团队聚集在一起选择新名字。建议的词有“动态”、“革命性”、“Silk”、“jolt”、“DNA”等。他们想要一个反映技术本质的名字：革命性的、动态的、活力、独特且易读。\n\
    \n### Java 版本历史\n到目前已发布了许多 Java 版本。Java 目前的稳定版本是 Java SE 10。\n1. JDK Alpha 和 Beta\
    \ (1995)\n2. JDK 1.0 (1996 年 1 月 23 日)\n3. JDK 1.1 (1997 年 2 月 19 日)\n4. J2SE\
    \ 1.2 (1998 年 12 月 8 日)\n5. J2SE 1.3 (2000 年 5 月 8 日)\n6. J2SE 1.4 (2002 年 2 月\
    \ 6 日)\n7. J2SE 5.0 (2004 年 9 月 30 日)\n8. Java SE 6 (2006 年 12 月 11 日)\n9. Java\
    \ SE 7 (2011 年 7 月 28 日)\n10. Java SE 8 (2014 年 3 月 18 日)\n11. Java SE 9 (2017\
    \ 年 9 月 21 日)\n12. Java SE 10 (2018 年 3 月 20 日)\n\n### Java 的特性\n创建 Java 编程语言的主要目标是使其成为可移植、简单且安全的编程语言。除此之外，还有一些在该语言流行中起重要作用的优秀特性。Java\
    \ 的特性也被称为 java。\n\n以下是 Java 语言最重要的特性列表：\n1. 简单\n2. 面向对象\n3. 可移植\n4. 平台无关\n5. 安全\n\
    6. 健壮\n7. 架构中立\n8. 解释型\n9. 高性能\n10. 多线程\n11. 分布式\n12. 动态\n13. 简单\n\nJava 非常容易学习，其语法简单、清晰且易于理解。根据官方，Java\
    \ 语言是一种简单的编程语言，因为：\n- Java 语法基于 `C++`（因此程序员在学习 `C++` 后更容易学习它）。\n- Java 删除了许多且不常用的特性，例如显式指针、运算符重载等。\n\
    - 不需要删除未引用的对象，因为 Java 中有自动垃圾回收机制。\n\n### 面向对象\nJava 是一种面向对象的编程语言。Java 中的一切都是对象。面向对象意味着我们通过不同对象的组合来组织软件。\n\
    - **面向对象编程 (OOP)** 是一种通过提供一些概念来简化软件开发和维护的方法。\n- **OOP 的基本概念**：\n    - 对象\n   \
    \ - 类\n    - 继承\n    - 多态\n    - 抽象\n    - 封装\n\n### 对象\n任何具有状态和行为的实体被称为对象。例如：椅子、笔、键盘等。它可以被定义为类的实例。对象占据某些空间。对象可以在不了解其他数据的情况下进行通信。对象接收消息。例如：狗，它有颜色、品种等状态，以及摇尾巴、汪叫等行为。\n\
    \n### 类\n对象的集合被称为类。它是一个逻辑实体。它是创建对象的模板或蓝图。类不消耗任何空间。\n\n### 继承\n当一个对象获取父类的属性和行为时，被称为继承。它提供了代码重用性，用于运行时。当你从现有类继承时，可以用方法和字段。\n\
    \n### 多态\n如果以不同的方式执行任务，被称为多态。例如：形状、三角形等。在 Java 中，我们使用方法重载和方法重写来实现多态。另一个例子是说话：猫喵喵、狗汪。\n\
    \n### 抽象\n隐藏内部细节并显示功能被称为抽象。例如：电话、调用。在 Java 中，我们使用 `abstract class` 和 `interface`\
    \ 来实现抽象。\n\n### 封装\n将代码和数据绑定到单个单元被称为封装。例如：胶囊，它带有不同的药物。Java 类是完全封装的，因为所有数据成员都是私有的。\n\
    \n### 类与对象\n在本章中，我们将学习 Java 对象和类。在面向对象编程中，使用对象和类设计程序。Java 中的对象是物理实体，而类是逻辑实体。\n\
    \n### Java 中的对象是什么？\n具有状态和行为的实体被称为对象。例如：椅子、自行车、笔、表。它可以是物理的或逻辑的（有无形的）。对象有三个特征：\n\
    - **状态**：代表对象的数据（值）。\n- **行为**：代表对象（的功能）。\n- **身份**：对象通常通过唯一 ID 实现。该 ID 对外部用户不可见，由\
    \ JVM 用于识别每个对象。\n\n### 什么是类？\n类是具有共同属性对象的集合。它是一个创建对象的模板或蓝图。它不是物理的。类可以包含：\n- 字段\n\
    - 方法\n- 构造函数\n- 块\n- 嵌套类和接口\n\n### 类的声明语法：\n```java\nclass {\n    field;\n   \
    \ method;\n}\n```\n\n### 对象定义：\n对象是真实实体。对象是运行时实体。\n\n### Java 中的实例变量\n在类内部方法外部创建的变量被称为实例变量。实例变量在编译时不获得内存。它们在运行时获得内存。\n\
    \n### Java 中的方法\n在 Java 中，方法类似于函数，用于暴露对象的行为。\n\n## 初始化对象的方法\nJava 有 3 种初始化对象的方法：\n\
    1. 通过引用变量\n2. 通过方法\n3. 通过构造函数\n\n### 对象类示例：通过引用初始化\n初始化对象意味着将数据存储到对象中。让我们来看一个简单的示例，通过引用变量初始化对象。\n\
    （为了简单起见省略了代码）\n\n### Java 默认构造函数\n当构造函数没有参数时，被称为“默认构造函数”。\n\n### 默认构造函数的语法：\n\
    ```java\n{}\n```\n\n### 默认构造函数示例\n在本示例中，我们在 `Bike` 类中创建无构造函数。\n```java\nclass\
    \ Bike1{\n    Bike1(){\n        System.out.println(\"Bike is created\")\n    }\n\
    }\n```\n\n## Java 参数构造函数\n具有特定数量参数的构造函数被称为参数构造函数。\n\n### 为什么要使用参数构造函数？\n参数构造函数用于为不同的对象提供不同的值。然而，你也可以提供相同的值。\n\
    \n### 参数构造函数示例\n在本示例中，我们创建了具有两个参数的 `Student` 类构造函数。我们可以在构造函数中有任意数量的参数。\n```java\n\
    class Student4{\n    int id;\n    String name;\n    Student4( int i, String n){\n\
    \        id = i;\n        name = n;\n    }\n}\n```\n\n## Java 中的构造函数重载\n在 Java\
    \ 中，构造函数类似于方法但不返回值。它可以像方法一样被重载。Java 中的构造函数重载是拥有多个具有不同参数列表的构造函数的技术。编译器通过参数的数量和类型来区分它们。\n\
    \n### 构造函数重载示例\n```java\nclass Student5{\n    int id;\n    String name;\n    int\
    \ age;\n    Student5( int i, String n){\n        id = i;\n    }\n    Student5(\
    \ int i, String n, int a){\n        id = i;\n        name = n;\n        age =\
    \ a;\n    }\n}\n```\n\n### 拷贝构造函数\nJava 中没有拷贝构造函数。然而，我们可以像 C++ 那样通过值从一个对象拷贝到另一个。Java\
    \ 中有许多方法可以拷贝：\n- 通过构造函数\n- 通过 `Object` 类的 `clone()` 方法\n\n### 无构造函数的拷贝\n我们可以通过赋值对象将一个对象的值拷贝到另一个对象。\n\
    ```java\ns2.id = s1.id;\n// ...\n```\n\n## 变量、数据类型、运算符\n### Java 变量\n变量是执行 Java\
    \ 程序执行时存储值的容器。变量被分配了数据类型。Java 有三类型的变量：局部、实例和静态。\n\n### 变量\n变量是分配在内存中的位置。在这种情况下，是“可变的”，意味着它的值可以改变。\n\
    ```java\nint data=50; //这里 data 是变量\n```\n\n### 运算符\n运算符是用于执行操作的符号。例如：`+`、`-`、`*`、`/`\
    \ 等。Java 有许多类型的运算符：\n- 一元运算符\n- 算术运算符\n- 移位运算符\n- 关系运算符\n- 位运算符\n- 逻辑运算符\n- 三元运算符\n\
    - 赋值运算符\n\n### 运算符优先级\n（参考图像）\n\n### 一元运算符\nJava 一元运算符需要一个操作数。一元运算符用于执行各种操作，例如：\n\
    - 增加减少值\n- 反转布尔值\n\n### 算术运算符\nJava 算术运算符用于执行加、减、乘、除法。它们作为基本的数学操作操作。\n\n### 左移位运算符\n\
    Java 左移位运算符 `<<` 用于将值的所有位向左移动指定的次数。\n\n### 右移位运算符\nJava 右移位运算符 `>>` 用于按操作数指定的位数将操作数右移。\n\
    \n### 无符号移位运算符\n对于负数，`>>>` 将最高位 (MSB) 变为 0。\n\n### 逻辑运算符\n逻辑运算符 `&&` 在第一个条件为真时不检查第二个条件。它只在第一个条件为假时才检查第二个。\n\
    \n### 位运算符\n位运算符 `|` 总是检查两个条件是否真或假。\n\n### 三元运算符\nJava 三元运算符被用作 `if-then-else`\
    \ 语句的单行替代，在 Java 编程中使用大量。它接受三个操作数。\n\n### 赋值运算符\nJava 赋值运算符是将右侧的值分配给左侧的操作。\n\n\
    ## 多线程\n### 多线程概述\nJava 多线程是同时执行多个线程的过程。线程是轻量级的子进程，处理的最小单元。多处理和多线程都用于实现多任务。然而，我们使用多线程而不是多处理，因为线程使用共享内存区域。它们不分配内存区域，因此节省了内存，线程之间的上下文切换比进程快。\n\
    \n### 多任务\n多任务是同时执行多个任务的过程。我们使用多任务来利用 CPU。多任务可以通过两种方式实现：\n1. **基于进程的多任务（多处理）**：每个进程在内存中有地址。分配独立的内存区域。进程是重量级的。进程之间的通信成本很高。\n\
    2. **基于线程的多任务（多线程）**：线程共享地址空间。线程是轻量级的。线程之间的通信成本较低。注意：一次执行一个线程。\n\n### 线程\nJava\
    \ 提供了 Thread 类来实现多线程编程。Thread 类提供了构造函数和方法来创建线程并对线程执行操作。Thread 继承 Object。\n\n###\
    \ 线程的周期和状态\nJava 中的线程在任何时候都处于以下状态之一。线程在任何时刻只处于显示状态之一：\n1. 新生 (New)\n2. 可运行 (Runnable)\n\
    3. 阻塞 (Blocked)\n4. 等待 (Waiting)\n5. 定时等待 (Timed Waiting)\n6. 终止 (Terminated)\n\
    \n### 在 Java 中实现状态\n在 Java 中，使用 `getState()` 方法获取线程的当前状态。Java 提供了 `java.lang.Thread.State`\
    \ 类，为线程的状态定义枚举常量。\n- `NEW`:尚未启动的线程状态。\n- `RUNNABLE`:可运行线程的状态。\n- `BLOCKED`:等待监视器锁的线程状态。\n\
    - `WAITING`:等待线程的状态。\n- `TIMED_WAITING`:带有指定等待等待的等待线程的状态。\n- `TERMINATED`:已终止线程的状态。\n\
    \n## 线程优先级\n在多线程环境中，线程调度器根据线程的优先级为线程分配处理器。当我们在 Java 中创建一个线程时，它总是被分配某些优先级。优先级可以由\
    \ JVM 在创建线程时给出，也可以由程序员显式给出。线程优先级的接受值范围是 1 到 10。Thread 类中定义了三个静态变量用于优先级：\n- `MIN_PRIORITY`:线程可以拥有的最小优先级。值为\
    \ 1。\n- `NORM_PRIORITY`:线程的默认优先级，如果没有显式定义它。值为 5。\n- `MAX_PRIORITY`:线程的最大优先级。值为\
    \ 10。\n\n### 获取和设置线程优先级\n1. `public final int getPriority()`：返回线程的优先级。\n2. `public\
    \ final void setPriority(int newPriority)`：更改线程的优先级。如果参数 `newPriority` 超出了 (1\
    \ 到 10) 的范围，该方法抛出 `IllegalArgumentException`。\n\n## Java 杂杂\n### Java Applets\n\
    Applet 是一种嵌入网页的特殊程序类型。\n\n### Applet 的生命周期\nApplet 类提供了 4 个周期方法：\n- `init()`：初始化。仅调用一次。\n\
    - `start()`：在浏览器最大化时调用。\n- `stop()`：在浏览器最小化时调用。停止 applet。\n- `destroy()`：销毁 applet。在浏览器关闭时调用一次。\n\
    \n### 在 Applet 中显示图形\n`java.awt.Graphics` 类提供了许多图形编程方法。常用的方法有：\n- `public abstract\
    \ void drawString(String str, int x, int y)`：绘制指定的字符串。\n- `public void drawRect(int\
    \ x, int y, int width, int height)`：绘制指定宽宽的矩形。\n- `public abstract void fillRect(int\
    \ x, int y, int width, int height)`：用默认颜色填充矩形。\n- `public abstract void drawOval(int\
    \ x, int y, int width, int height)`：绘制指定宽高的的椭圆。\n- `public abstract void fillOval(int\
    \ x, int y, int width, int height)`：用默认颜色填充椭圆。\n- `public abstract void drawArc(int\
    \ x, int y, int width, int height, int startAngle, int arcAngle)`：绘制圆弧或椭弧。\n-\
    \ `public abstract void fillArc(int x, int y, int width, int height, int startAngle,\
    \ int arcAngle)`：用默认颜色填充圆弧或椭弧。\n- `public abstract void drawLine(int x1, int y1,\
    \ int x2, int y2)`：在两个点 $(x1, y1)$ 和 $(x2, y2)$ 之间画线。\n- `public abstract void\
    \ drawPoly(int x1, int y1, int x2, int y2, int width)`：绘制指定宽度的线。\n- `public abstract\
    \ boolean drawImage(Image img, int x, int y, Observer observer)`：绘制指定的图像。\n\n\
    ### 在 Applet 中显示图像\nApplet 主要用于游戏和动画。`java.awt.Graphics` 类提供 `drawImage()` 来显示图像。语法：`public\
    \ abstract boolean drawImage(Image img, int x, int y, Observer observer)` 用于绘制指定的图像。\n\
    \n### 如何获取 Image 对象\n`java.applet.Applet` 类提供了 `getImage()` 方法返回 `Image` 对象。语法：`public\
    \ Image getImage(URL u, String image)`。Applet 的其他需要方法：\n- `getDocumentBase()`：返回文档。\n\
    - `getCodeBase()`：返回基础 URL。\n\n### Applet 中的事件处理\n由于我们在 `AWT` 或 `Swing` 中执行事件处理，我们也可以在\
    \ applet 中执行它。\n```java\nimport java.applet.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\
    public class EventApplet extends Applet implements ActionListener{\n    Button\
    \ b;\n    TextField tf;\n    public void init() {\n        tf = new TextField();\n\
    \        tf.setBounds(30, 40, 150, 20);\n        b = new Button(\"Click\");\n\
    \        b.setBounds(80, 150, 60, 50);\n        add(b);add(tf);\n        b.addActionListener(this);\n\
    \        setLayout(null);\n    }\n    public void actionPerformed(ActionEvent\
    \ e) {\n        tf.setText(\"Welcome\");\n    }\n}\n```\n\n## 异常处理\nJava 中的异常处理是处理运行时错误的强大机制之一，以便维持应用程序的正常流。\n\
    \n### Java 中的异常是什么？\n字典：异常是一种异常状态。在 Java 中，异常是中断程序正常流的事件。它是运行时抛出的一个对象。\n\n###\
    \ 什么是异常处理？\n异常处理是处理运行时错误（如 `ClassNotFoundException`、`IOException`、`RemoteException`\
    \ 等）的机制。\n\n### 异常处理的优势\n异常处理的核心优势是维持应用程序的正常流。异常通常会中断程序的流。这就是我们使用异常处理的原因。\n\n\
    ### Java 异常的常见场景\n1. **ArithmeticException**：如果你将任何数字除以零，就会发生 `ArithmeticException`。\n\
    2. **NullPointerException**：如果你在任何变量中有 `null` 值，对该变量执行任何操作都会抛出 `NullPointerException`。\n\
    3. **NumberFormatException**：可能会发生任何值的格式错误。假设我有一个包含字符的字符串变量，将此变量转换为数字将发生 `NumberFormatException`。\n\
    4. **ArrayIndexOutOfBoundsException**：如果你在错误的索引处插入值，会导致 `ArrayIndexOutOfBoundsException`。\n\
    \n### Java try-catch 块\n`try` 块用于封装可能抛异常的代码。它必须在方法内部。如果 `try` 块中的某个语句发生异常，后续代码将不会执行。因此建议将代码放在\
    \ `try` 块中。`try` 块必须跟在 `catch` 或 `finally` 块之后。当发生异常时，`catch` 块会被触发。\n\n### Java\
    \ try-catch 语法\n```java\ntry {\n    // 可能抛异常的代码\n} catch (Exception_class_Name\
    \ ref){}\n```\n\n### Java try-finally 语法\n`try` 块后面跟着 `finally` 块。\n```java\n\
    try {\n    // 可能抛异常的代码\n} finally {}\n```\n\n### Java catch 块\nJava `catch` 块用于处理异常，通过声明异常的类型。声明的异常必须是父类（例如\
    \ `Exception`）或生成的异常类型。`catch` 块必须跟在 `try` 块之后。\n\n### 没有异常处理的问题\n如果不使用 `try-catch`\
    \ 块，理解该问题。**示例 1**\n```java\npublic class TryCatch1 {\n    public static void\
    \ main(String[] args) {\n        int a[]= new int [ 5 ];\n        a[ 5 ]= 30 /\
    \ 0; //抛出异常\n        System.out.println(\"rest of the code\");\n    }\n}\n```\n\
    输出：`Exception in \"main\" java.lang.ArithmeticException:/ zero`。如上示例所示，代码的其余部分没有执行。\n\
    \n### 通过异常处理解决\n通过 `try-catch` 块来解决上述问题。**示例 2**\n```java\npublic class TryCatch2\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int a[]= new int [ 5 ];\n            System.out.println(a[ 10 ]);\n        }\
    \ catch (ArithmeticException e) {\n            System.out.println(e);\n      \
    \  }\n        System.out.println(\"rest of the code\");\n    }\n}\n```\n输出：`java.lang.ArithmeticException:\
    \ zero`。如上示例所示，代码的其余部分被打印。\n\n**示例 3**\n```java\npublic class TryCatch3 {\n  \
    \  public static void main(String[] args) {\n        try {\n            int data=\
    \ 50 / 0; //抛出异常\n            System.out.println(\"rest of the code\");\n    \
    \    } catch (ArithmeticException e) {\n            System.out.println(e);\n \
    \       }\n    }\n}\n```\n输出：`java.lang.ArithmeticException:/ zero`。这里我们可以看到，如果\
    \ `try` 块中发生了异常，代码的其余部分不会执行。\n\n**示例 4**\n```java\npublic class TryCatch4 {\n\
    \    public static void main(String[] args) {\n        try {\n            int\
    \ data= 50 / 0; //抛出异常\n        } catch (Exception e) {\n            System.out.println(e);\n\
    \        }\n        System.out.println(\"rest of the code\");\n    }\n}\n```\n\
    输出：`java.lang.ArithmeticException:/ zero`\n`rest of the code`。\n\n### java try-catch\
    \ 块的内部工作\n`JVM` 首先检查异常是否被处理。如果异常未被处理，`JVM` 提供默认异常处理器执行以下操作：\n- 打印异常描述。\n- 打印堆栈跟踪（发生异常的方法）。\n\
    - 导致程序终止。\n如果异常被应用程序处理，正常流得以维持。\n\n### Java 多异常异常\n`try` 块可以跟随一个或多个 `catch` 块。每个\
    \ `catch` 块必须包含不同的异常处理器。\n要记忆的点：\n- 一时间只发生一个异常，一时间只执行一个 `catch` 块。\n- 所有 `catch`\
    \ 块必须从具体的到通用的排序，例如 `ArithmeticException` 的 `catch` 必须在 `Exception` 的 `catch` 之前。\n\
    \n**示例 1**\n```java\npublic class MultipleCatchBlock1 {\n    public static void\
    \ main(String[] args) {\n        try {\n            int a[]= new int [ 5 ];\n\
    \            a[ 5 ]= 30 / 0;\n        } catch (ArithmeticException e) {\n    \
    \        System.out.println(\"Arithmetic Exception occurs\");\n        } catch\
    \ (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"ArrayIndexOutOfBounds\
    \ Exception occurs\");\n        } catch (Exception e) {\n            System.out.println(\"\
    Parent Exception occurs\");\n        }\n        System.out.println(\"rest of the\
    \ code\");\n    }\n}\n```\n输出：`Arithmetic Exception occurs`，`rest of the code`。\n\
    \n**示例 2**\n```java\npublic class MultipleCatchBlock2 {\n    public static void\
    \ main(String[] args) {\n        try {\n            int a[]= new int [ 5 ];\n\
    \            System.out.println(a[ 10 ]);\n        } catch (ArithmeticException\
    \ e) {\n            System.out.println(\"Arithmetic Exception occurs\");\n   \
    \     } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
    ArrayIndexOutOfBounds Exception occurs\");\n        } catch (Exception e) {\n\
    \            System.out.println(\"Parent Exception occurs\");\n        }\n   \
    \     System.out.println(\"rest of the code\");\n    }\n}\n```\n输出：`java.lang.ArrayIndexOutOfBoundsException:\
    \ Index 10 out of bounds for length 5`。\n\n**示例 3**\n```java\npublic class MultipleCatchBlock3\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int data= 50 / 0; //抛出异常\n            System.out.println(\"rest of the code\"\
    );\n        } catch (ArithmeticException e) {\n            System.out.println(e);\n\
    \        }\n    }\n}\n```\n输出：`java.lang.ArithmeticException: / zero`。\n这里我们可以看到，如果\
    \ `try` 块中发生了异常，代码的其余部分不会执行。\n\n### 嵌套 try 块\n在 `try` 块中的 `try` 块被称为嵌套 `try`。\n\
    为什么要使用嵌套 `try`？\n有时会出现一种情况，部分块导致一个错误，整个块本身导致另一个错误。在这种情况下，异常处理器必须是嵌套的。\n语法：\n```java\n\
    try {\n    statement 1;\n    statement 2;\n    try {\n        statement 1;\n \
    \       statement 2;\n    } catch (Exception e) {}\n} catch (Exception e) {}\n\
    ```\n\n### 嵌套 try 示例\n```java\nclass Excep6{\n    public static void main(String[]\
    \ args[]){\n        try {\n            System.out.println(\"going to divide\"\
    );\n            int b = 39 / 0;\n        } catch (ArithmeticException e){\n  \
    \          System.out.println(e);\n            }\n            try {\n        \
    \        int a[]= new int [ 5 ];\n                a[ 5 ]= 4 ;\n            } catch\
    \ (ArrayIndexOutOfBoundsException e){\n                System.out.println(e);}\n\
    \            }\n        } catch (Exception e){\n            System.out.println(\"\
    handeled\" );\n        }\n        System.out.println(\"normal flow..\" );\n  \
    \  }\n}\n```\n\n## Java finally 块\n`finally` 块是一个用于执行重要代码（如关闭连接、流等）的块。无论异常是否被处理，`finally`\
    \ 块都会执行。`finally` 块位于 `try` 或 `catch` 块之后。\n注意：如果在终止程序之前没有处理异常，`JVM` 会执行 `finally`\
    \ 块（如果有的话）。\n\n### 为什么要使用 finally\nJava 中的 `finally` 块可以用于放置“清理”代码，如关闭文件、关闭连接等。\n\
    \n### Java finally 的用法\n**情况 1**：没有发生异常。\n```java\nclass TestFinallyBlock{\n \
    \   public static void main(String[] args[]){\n        try {\n            int\
    \ data= 25 / 5 ;\n            System.out.println(data);\n        } catch (NullPointerException\
    \ e){System.out.println(e);}\n        finally {System.out.println( \"finally block\
    \ is always executed\" );}\n        System.out.println( \"rest of the code...\"\
    \ );\n    }\n}\n```\n输出：`5`，`finally block is always executed rest of the code...`\n\
    \n**情况 2**：发生了异常且未被处理。\n```java\nclass TestFinallyBlock1{\n    public static void\
    \ main(String[] args[]){\n        try {\n            int data= 25 / 0 ;\n    \
    \        System.out.println(data);\n        } catch (NullPointerException e){System.out.println(e);}\n\
    \        finally {System.out.println( \"finally block is always executed\" );}\n\
    \        System.out.println( \"rest of the code...\" );\n    }\n}\n```\n输出：`finally\
    \ block is always executed rest of the code...`\n\n**情况 3**：发生了异常并被处理。\n```java\n\
    class TestFinallyBlock{\n    public static void main(String[] args[]){\n     \
    \   try {\n            int data= 25 / 0 ;\n            System.out.println(data);\n\
    \        } catch (ArithmeticException e){System.out.println(e);}\n        finally\
    \ {System.out.println( \"finally block is always executed\" );}\n    }\n}\n```\n\
    输出：`java.lang.ArithmeticException: / zero`。\n\n**示例 5**\n```java\nclass MultipleCatchBlock5\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ int a[]= new int [ 5 ];\n            a[ 5 ]= 30 / 0;\n        } catch (Exception\
    \ e){\n            System.out.println(\"common task\");\n        } catch (ArithmeticException\
    \ e){\n            System.out.println(\"task1 is completed\");\n        } catch\
    \ (ArrayIndexOutOfBoundsException e){\n            System.out.println(\"task 2\
    \ completed\");\n        }\n    }\n}\n```\n输出：`Compile-time error`\n\n"
