    222 , "Aryan" ); 17\. //calling method to display the values of object 18\. s1.display(); 19\.
    s2.display(); 20\. } 21\. } Output: 111Karan 222Aryan Constructor Overloading
    in Java In Java, a constructor is just like a method but without return type.
    It can also be overloaded like Java methods. Constructor overloading in Java is
