    + 12\. " is running"); 13\. 14\. } 15\. catch (Exception e) 16\. { 17\. // Throwing
    an exception 18\. System.out.println ("Exception is caught"); 19\. } 20\. } 21\.
    } 22\. 23\. // Main Class 24\. class Multithread 25\. { 26\. public static void
    main(String[] args) 27\. { 28\. int n = 8; // Number of threads 29\. for (int
    i=0; i i++) 30\. { 31\. Thread object = new Thread(new MultithreadingDemo()); 32\.
    object.start(); 33\. } 34\. } 35\. } 36\. Output : Thread 8 is running Thread
    9 is running Thread 10 is running Thread 11 is running Thread 12 is running Thread
    13 is running Thread 14 is running Thread 15 is running Thread Class vs Runnable
    Interface 1\. If we extend the Thread class, our class cannot extend any other
    class because Java doesn’t support multiple inheritance. But, if we implement
    the Runnable interface, our class can still extend other base classes. 2\. We
    can achieve basic functionality of a thread by extending Thread class because
    it provides some inbuilt methods like yield(), interrupt() etc. that are not available
    in Runnable interface.Lifecycle and States of a Thread A thread in Java at any
    point of time exists in any one of the following states. A thread lies only in
    one of the shown states at any instant: 1\. New 2\. Runnable 3\. Blocked 4\. Waiting 5\.
    Timed Waiting 6\. Terminated The diagram shown below represent various states
    of a thread at any instant of time. ![](image-9z6d0j3u.jpg) Life Cycle of a thread 1\.
    New Thread: When a new thread is created, it is in the new state. The thread has
    not yet started to run when thread is in this state. When a thread lies in the
    new state, it’s code is yet to be run and hasn’t started to execute. 2\. Runnable
    State: A thread that is ready to run is moved to runnable state. In this state,
    a thread might actually be running or it might be ready run at any instant of
    time. It is the responsibility of the thread scheduler to give the thread, time
    to run. A multi-threaded program allocates a fixed amount of time to each individual
    thread. Each and every thread runs for a short while and then pauses and relinquishes
    the CPU to another thread, so that other threads can get a chance to run. When
    this happens, all such threads that are ready to run, waiting for the CPU and
    the currently running thread lies in runnable state. 3\. Blocked/Waiting state:
    When a thread is temporarily inactive, then it’s in one of the followingstates: Blocked Waiting For
    example, when a thread is waiting for I/O to complete, it lies in the blocked
    state. It’s the responsibility of the thread scheduler to reactivate and schedule
    a blocked/waiting thread. A thread in this state cannot continue its execution
    any further until it is moved to runnable state. Any thread in these states does
    not consume any CPU cycle. A thread is in the blocked state when it tries to access
    a protected section of code that is currently locked by some other thread. When
    the protected section is unlocked, the schedule picks one of the thread which
    is blocked for that section and moves it to the runnable state. Whereas, a thread
    is in the waiting state when it waits for another thread on a condition. When
    this condition is fulfilled, the scheduler is notified and the waiting thread
    is moved to runnable state. If a currently running thread is moved to blocked/waiting
    state, another thread in the runnable state is scheduled by the thread scheduler
    to run. It is the responsibility of thread scheduler to determine which thread
    to run. 4\. Timed Waiting: A thread lies in timed waiting state when it calls
    a method with a time out parameter. A thread lies in this state until the timeout
    is completed or until a notification is received. For example, when a thread calls
    sleep or a conditional wait, it is moved to a timed waiting state. 5\. Terminated
    State: A thread terminates because of either of the followingreasons: Because
    it exists normally. This happens when the code of thread has entirely executed
    by the program. Because there occurred some unusual erroneous event, like segmentation
    fault or an unhandled exception. A thread that lies in a terminated state does
    no longer consumes any cycles of CPU. Implementing Thread States in Java In Java,
    to get the current state of the thread, use Thread.getState() method to get the
    current state of the thread. Java provides java.lang.Thread.State class that defines
    the ENUM constants for the state of a thread, as summary of which is given below: 1\.
    Constant type: New Declaration: public static final Thread.State NEW Description:
    Thread state for a thread which has not yet started. 2\. Constant type: Runnable Declaration:
    public static final Thread.State RUNNABLE Description: Thread state for a runnable
    thread. A thread in the runnable state is executing in the Java virtual machine
    but it may be waiting for other resources from the operating system such as processor. 3\.
    Constant type: Blocked Declaration: public static final Thread.State BLOCKED Description:
    Thread state for a thread blocked waiting for a monitor lock. A thread in the
    blocked state is waiting for a monitor lock to enter a synchronized block/method
    or reenter a synchronized block/method after calling Object.wait(). 4\. Constant
    type: Waiting Declaration: public static final Thread.State WAITING Description:
    Thread state for a waiting thread. Thread state for a waiting thread. A thread
    is in the waiting state due to calling one of the following methods: Object.wait
    with no timeout Thread.join with no timeout LockSupport.park A thread in the waiting
    state is waiting for another thread to perform a particular action. 5\. Constant
    type: TimedWaiting Declaration: public static final Thread.State TIMED_WAITING Description:
    Thread state for a waiting thread with a specified waiting time. A thread is in
    the timed waiting state due to calling one of the following methods with a specified
    positive waiting time: Thread.sleep Object.wait with timeout Thread.join with
    timeout LockSupport.parkNanos LockSupport.parkUntil 6\. Constant type: Terminated Declaration:
    public static final Thread.State TERMINATED Description: Thread state for a terminated
    thread. The thread has completed execution. 1\. // Java program to demonstrate
    thread states 2\. class thread implements Runnable 3\. { 4\. public void run() 5\.
    { 6\. // moving thread2 to timed waiting state 7\. try 8\. { 9\. Thread.sleep(1500); 10\.
    } 11\. catch (InterruptedException e) 12\. { 13\. e.printStackTrace(); 14\. } 15\. 16\.
    System.out.println("State of thread1 while it called join() method on thread2
    -"+ 17\. Test.thread1.getState()); 18\. try 19\. { 20\. Thread.sleep(200); 21\.
    } 22\. catch (InterruptedException e) 23\. { 24\. e.printStackTrace(); 25\. } 26\.
    } 27\. } 28\. 29\. public class Test implements Runnable 30\. { 31\. public static
    Thread thread1; 32\. public static Test obj; 33\. 34\. public static void main(String[]
    args) 35\. { 36\. obj = new Test(); 37\. thread1 = new Thread(obj); 38\. 39\.
    // thread1 created and is currently in the NEW state. 40\. System.out.println("State
    of thread1 after creating it – " + thread1.getState()); 41\. thread1.start(); 42\. 43\.
    // thread1 moved to Runnable state 44\. System.out.println("State of thread1 after
    calling .start() method on it – " + 45\. thread1.getState()); 46\. } 47\. 48\.
    public void run() 49\. { 50\. thread myThread = new thread(); 51\. Thread thread2
    = new Thread(myThread); 52\. 53\. // thread1 created and is currently in the NEW
    state. 54\. System.out.println("State of thread2 after creating it – "+ thread2.getState()); 55\.
    thread2.start(); 56\. 57\. // thread2 moved to Runnable state 58\. System.out.println("State
    of thread2 after calling .start() method on it – " + 59\. thread2.getState()); 60\. 61\.
    // moving thread1 to timed waiting state 62\. try 63\. { 64\. //moving thread1
    to timed waiting state 65\. Thread.sleep(200); 66\. } 67\. catch (InterruptedException
    e) 68\. { 69\. e.printStackTrace(); 70\. } 71\. System.out.println("State of thread2
    after calling .sleep() method on it – "+ 72\. thread2.getState() ); 73\. 74\. 75\.
    try 76\. { 77\. // waiting for thread2 to die 78\. thread2.join(); 79\. } 80\.
    catch (InterruptedException e) 81\. { 82\. e.printStackTrace(); 83\. } 84\. System.out.println("State
    of thread2 when it has finished it''s execution – " + 85\. thread2.getState()); 86\.
    } 87\. 88\. } Output: State of thread1 after creating it NEW State of thread1
    after calling .start() method on it RUNNABLE State of thread2 after creating it
    NEW State of thread2 after calling.start() method on it RUNNABLE State of thread2
    after calling .sleep() method on it TIMED_WAITING State of thread1 while it called
    join() method on thread2 WAITING State of thread2 when it has finished it''s execution
    TERMINATED Explanation: When a new thread is created, the thread is in the NEW
    state. When .start() method is called on a thread, the thread scheduler moves
    it to Runnable state. Whenever join() method is called on a thread instance, the
    current thread executing that statement will wait for this thread to move to Terminated
    state. So, before the final statement is printed on the console, the program calls
    join() on thread2 making the thread1 wait while thread2 completes its execution
    and is moved to Terminated state. thread1 goes to Waiting state because it is
    waiting for thread2 to complete it’s execution as it has called join on thread2\.Main
    Thread Java provides built-in support for multithreaded programming. A multi-threaded
    program contains two or more parts that can run concurrently. Each part of such
    a program is called a thread, and each thread defines a separate path of execution. Main
    Thread When a Java program starts up, one thread begins running immediately. This
    is usually called the main thread of our program, because it is the one that is
    executed when our program begins. Properties : It is the thread from which other
    “child” threads will be spawned. Often, it must be the last thread to finish execution
    because it performs various shutdown actions Flow diagram : ![](image-f9l7tren.jpg) How
    to control Main thread The main thread is created automatically when our program
    is started. To control it we must obtain a reference to it. This can be done by
    calling the method currentThread( ) which is present in Thread class. This method
    returns a reference to the thread on which it is called. The default priority
    of Main thread is 5 and for all remaining user threads priority will be inherited
    from parent to child. ![](image-b9wk493o.jpg) ![](image-nn33o1nd.jpg) ![](image-xq50y5pe.jpg) ![](image-148irgot.jpg) Childthread Relation
    between the main() method and main thread in Java For each program, a Main thread
    is created by JVM(Java Virtual Machine). The “Main” thread first verifies the
    existence of the main() method, and then it initializes the class. Note that from
    JDK 6, main() method is mandatory in a standalone java application. Deadlocking
    with use of Main Thread(only single thread) We can create a deadlock by just using
    Main thread, i.e. by just using a single thread. The following java program demonstrate
    this. ![](image-k8dfkpsn.jpg) ![](image-n3u2d6qa.jpg) Output: Entering into Deadlock Explanation
    : The statement “Thread.currentThread().join()”, will tell Main thread to wait
    for this thread(i.e. wait for itself) die. Thus Main thread wait for itself to
    die, which is nothing but a deadlock.Thread Priority In a Multi threading environment,
    thread scheduler assigns processor to a thread based on priority of thread. Whenever
    we create a thread in Java, it always has some priority assigned to it. Priority
    can either be given by JVM while creating the thread or it can be given by programmer
    explicitly. Accepted value of priority for a thread is in range of 1 to 10\. There
    are 3 static variables defined in Thread class for priority. public static int
    MIN_PRIORITY: This is minimum priority that a thread can have. Value for this
    is 1. public static int NORM_PRIORITY: This is default priority of a thread if
    do not explicitly define it. Value for this is 5. public static int MAX_PRIORITY:
    This is maximum priority of a thread. Value for this is 10. Get and Set Thread
    Priority: 1\. public final int getPriority(): java.lang.Thread.getPriority() method
    returns priority of given thread. 2\. public final void setPriority(int newPriority):
    java.lang.Thread.setPriority() method changes the priority of thread to the value
    newPriority. This method throws IllegalArgumentException if value of parameter
    newPriority goes beyond minimum(1) and maximum(10) limit. Examples of getPriority()
    and set Java ![](image-mun0npox.jpg) ![](image-8dhrze8i.jpg) ![](image-su4ahmn3.jpg) ![](image-l5ui4rhv.jpg) ![](image-5e5y0kg5.jpg) 10 Note: Thread
    with highest priority will get execution chance prior to other threads. Suppose
    there are 3 threads t1, t2 and t3 with priorities 4, 6 and 1\. So, thread t2 will
    execute first based on maximum priority 6 after that t1 will execute and then
    t3. Default priority for main thread is always 5, it can be changed later. Default
    priority for all other threads depends on the priority of parent thread. Example: Java ![](image-mv6evjnv.jpg) ![](image-yofullia.jpg) Output main
    thread priority 6 t1 thread priority6 If two threads have same priority then we
    can’t expect which thread will execute first. It depends on thread scheduler’s
    algorithm(Round-Robin, First Come First Serve, etc) If we are using thread priority
    for thread scheduling then we should always keep in mind that underlying platform
    should provide support for scheduling based on thread priority.Garbage Collection Java
    Garbage Collection In java, garbage means unreferenced objects. Garbage Collection
    is process of reclaiming the runtime unused memory automatically. In other words,
    it is a way to destroy the unused objects. To do so, we were using free() function
    in C language and delete() in C++. But, in java it is performed automatically.
    So, java provides better memory management. Advantage of Garbage Collection It
    makes java memory efficient because garbage collector removes the unreferenced
    objects from heap memory. It is automatically done by the garbage collector(a
    part of JVM) so we don''t need to make extra efforts. How can an object be unreferenced? There
    are many ways: By nulling the reference By assigning a reference to another By
    anonymous object etc. 1) By nulling a reference: 1\. Employee e= new Employee(); 2\.
    e= null ; 2) By assigning a reference to another: 1\. Employee e1= new Employee(); 2\.
    Employee e2= new Employee(); 3\. e1=e2; //now the first object referred by e1
    is available for garbage collection 3) By anonymous object: 1\. new Employee();Module
    VJava Misc.Java Applets Java Applet Applet is a special type of program that is
    embedded in the webpage to generate the dynamic content. It runs inside the browser
    and works at client side. Advantage of Applet There are many advantages of applet.
    They are as follows: It works at client side so less response time. Secured It
    can be executed by browsers running under many plateforms, including Linux, Windows,
    Mac Os etc. Drawback of Applet Plugin is required at client browser to execute
    applet. Hierarchy of Applet ![](image-iy7za361.jpg) As displayed in the above
    diagram, Applet class extends Panel. Panel class extends Container which is the
    subclass of Component. Lifecycle of Java Applet 1\. Applet is initialized. 2\.
    Applet is started. 3\. Applet is painted. 4\. Applet is stopped. 5\. Applet is
    destroyed. ![](image-m8x2g9c3.jpg) Lifecycle methods for Applet: The java.applet.Applet
    class 4 life cycle methods and java.awt.Component class provides 1 life cycle
    methods for an applet. java.applet.Applet class For creating any applet java.applet.Applet
    class must be inherited. It provides 4 life cycle methods of applet. 1\. public
    void init(): is used to initialized the Applet. It is invoked only once. 2\. public
    void start(): is invoked after the init() method or browser is maximized. It is
    used to start the Applet. 3\. public void stop(): is used to stop the Applet.
    It is invoked when Applet is stop or browser is minimized. 4\. public void destroy():
    is used to destroy the Applet. It is invoked only once. java.awt.Component class The
    Component class provides 1 life cycle method of applet. 1\. public void paint(Graphics
    g): is used to paint the Applet. It provides Graphics class object that can be
    used for drawing oval, rectangle, arc etc. Q. Who is responsible to manage the
    life cycle of an applet? Java Plug-in software. Q. How to run an Applet? There
    are two ways to run an applet 1\. By html file. 2\. By appletViewer tool (for
    testing purpose). Simple example of Applet by html file: To execute the applet
    by html file, create an applet and compile it. After that create an html file
    and place the applet code in html file. Now click the html file. 1\. //First.java 2\.
    import java.applet.Applet; 3\. import java.awt.Graphics; 4\. public class First
    extends Applet{ 5\. 6\. public void paint(Graphics g){ 7\. g.drawString( "welcome"
    , 150 , 150 ); 8\. } 9\. 10\. } Note: class must be public because its object
    is created by Java Plugin software that resides on thebrowser. myapplet.html 1\. 2\. 3."First.class"
    width= "300" height= "300" > 4\. 5\. 6\. Simple example of Applet by appletviewer
    tool: To execute the applet by appletviewer tool, create an applet that contains
    applet tag in comment and compile it. After that run it by: appletviewer First.java.
    Now Html file is not required but it is for testing purpose only. 1\. //First.java 2\.
    import java.applet.Applet; 3\. import java.awt.Graphics; 4\. public class First
    extends Applet{ 5\. 6\. public void paint(Graphics g){ 7\. g.drawString( "welcome
    to applet" , 150 , 150 ); 8\. } 9\. 10\. } 11\. /* 12\. 13\. 14\. */ To execute
    the applet by appletviewer tool, write in command prompt: c:\> javac First.java c:\> appletviewer First.java Displaying
    Graphics in Applet java.awt.Graphics class provides many methods for graphics
    programming. Commonly used methods of Graphics class: 1\. public abstract void
    drawString(String str, int x, inty): is used to draw the specified string. 2\.
    public void drawRect(int x, int y, int width, int height): draws a rectangle with
    the specified width and height. 3\. public abstract void fillRect(int x, int y,
    int width, int height): is used to fill rectangle with the default color and specified
    width and height. 4\. public abstract void drawOval(int x, int y, int width, int
    height): is used to draw oval with the specified width and height. 5\. public
    abstract void fillOval(int x, int y, int width, int height): is used to fill oval
    with the default color and specified width and height. 6\. public abstract void
    drawLine(int x1, int y1, int x2, int y2): is used to draw line between the points(x1,
    y1) and (x2, y2). 7\. public abstract boolean drawImage(Image img, int x, int
    y, ImageObserver observer): is used draw the specified image. 8\. public abstract
    void drawArc(int x, int y, int width, int height, int startAngle, int arcAngle):
    is used draw a circular or elliptical arc. 9\. public abstract void fillArc(int
    x, int y, int width, int height, int startAngle, int arcAngle): is used to fill
    a circular or elliptical arc. 10\. public abstract void setColor(Color c): is
    used to set the graphics current color to the specified color. 11\. public abstract
    void setFont(Font font): is used to set the graphics current font to the specified
    font. Example of Graphics in applet: 1\. import java.applet.Applet; 2\. import
    java.awt.*; 3\. 4\. public class GraphicsDemo extends Applet{ 5\. 6\. public void
    paint(Graphics g){ 7\. g.setColor(Color.red); 8\. g.drawString( "Welcome" , 50
    , 50 ); 9\. g.drawLine( 20 , 30 , 20 , 300 ); 10\. g.drawRect( 70 , 100 , 30 ,
    30 ); 11\. g.fillRect( 170 , 100 , 30 , 30 ); 12\. g.drawOval( 70 , 200 , 30 ,
    30 ); 13\. 14\. g.setColor(Color.pink); 15\. g.fillOval( 170 , 200 , 30 , 30 ); 16\.
    g.drawArc( 90 , 150 , 30 , 30 , 30 , 270 ); 17\. g.fillArc( 270 , 150 , 30 , 30
    , 0 , 180 ); 18\. 19\. } 20\. } myapplet.html 1\. 2\. 3\. "GraphicsDemo.class"
    width= "300" height= "300" > 4\. 5\. 6\. Displaying Image in Applet Applet is
    mostly used in games and animation. For this purpose image is required to be displayed.
    The java.awt.Graphics class provide a method drawImage() to display the image. Syntax
    of drawImage() method: public abstract boolean drawImage(Image img, int x, int
    y, ImageObserver observer): is used draw the specified image. How to get the object
    of Image: The java.applet.Applet class provides getImage() method that returns
    the object of Image. Syntax: 1\. public Image getImage(URL u, String image){} Other
    required methods of Applet class to display image: public URL getDocumentBase():
    is used to return public URL getCodeBase(): is used to return the base URL. Example
    of displaying image in applet: 1\. import java.awt.*; 2\. import java.applet.*; 3\. 4\. 5\.
    public class DisplayImage extends Applet { 6\. 7\. Image picture; 8\. 9\. public
    void init() { 10\. picture = getImage(getDocumentBase(), "sonoo.jpg" ); 11\. } 12\. 13\.
    public void paint(Graphics g) { 14\. g.drawImage(picture, 30 , 30 , this ); 15\.
    } 16\. 17\. } In the above example, drawImage() method of Graphics class is used
    to display the image. The 4th argument of drawImage() method of is ImageObserver
    object. The Component class implements ImageObserver interface. So current class
    object would also be treated as ImageObserver because Applet class indirectly
    extends the Component class. myapplet.html 1\. 2\. 3\. "DisplayImage.class" width=
    "300" height= "300" > 4\. 5\. 6\. EventHandling in Applet As we perform event
    handling in AWT or Swing, we can perform it in applet also. Let''s see the simple
    example of event handling in applet that prints a message by click on the button. Example
    of EventHandling in applet: 1\. import java.applet.*; 2\. import java.awt.*; 3\.
    import java.awt.event.*; 4\. public class EventApplet extends Applet implements
    ActionListener{ 5\. Button b; 6\. TextField tf; 7\. 8\. public void init(){ 9\.
    tf= new TextField(); 10\. tf.setBounds( 30 , 40 , 150 , 20 ); 11\. 12\. b= new
    Button( "Click" ); 13\. b.setBounds( 80 , 150 , 60 , 50 ); 14\. 15\. add(b);add(tf); 16\.
    b.addActionListener( this ); 17\. 18\. setLayout( null ); 19\. } 20\. 21\. public
    void actionPerformed(ActionEvent e){ 22\. tf.setText( "Welcome" ); 23\. } 24\.
    } In the above example, we have created all the controls in init() method because
    it is invoked only once. myapplet.html 1\. 2\. 3\. "EventApplet.class" width=
    "300" height= "300" > 4\. 5\. 6\.Exception Handling The Exception Handling in
    Java is one of the powerful mechanism to handle the runtime errors so that normal
    flow of the application can be maintained. In this chapter, we will learn about
    Java exceptions, its type and the difference between checked and unchecked exceptions. What
    is Exception in Java? Dictionary Meaning: Exception is an abnormal condition. In
    Java, an exception is an event that disrupts the normal flow of the program. It
    is an object which is thrown at runtime. What is Exception Handling? Exception
    Handling is a mechanism to handle runtime errors such as ClassNotFoundException,
    IOException, SQLException, RemoteException, etc. Advantage of Exception Handling The
    core advantage of exception handling is to maintain the normal flow of the application
    . An exception normally disrupts the normal flow of the application that is why
    we use exception handling. Let''s take a scenario: 1\. statement 1 ; 2\. statement
    2 ; 3\. statement 3 ; 4\. statement 4 ; 5\. statement 5 ; //exception occurs 6\.
    statement 6 ; 7\. statement 7 ; 8\. statement 8 ; 9\. statement 9 ; 10\. statement
    10 ; Suppose there are 10 statements in your program and there occurs an exception
    at statement 5, the rest of the code will not be executed i.e. statement 6 to
    10 will not be executed. If we perform exception handling, the rest of the statement
    will be executed. That is why we use exception handling in Java. Hierarchy of
    Java Exception classes The java.lang.Throwable class is the root class of Java
    Exception hierarchy which is inherited by two subclasses: Exception and Error.
    A hierarchy of Java Exception classes are given below: ![](image-18wns9d6.jpg) Types
    of Java Exceptions There are mainly two types of exceptions: checked and unchecked.
    Here, an error is considered as the unchecked exception. According to Oracle,
    there are three types of exceptions: 1\. Checked Exception 2\. Unchecked Exception 3\.
    Error Difference between Checked and Unchecked Exceptions 1) Checked Exception The
    classes which directly inherit Throwable class except RuntimeException and Error
    are known as checked exceptions e.g. IOException, SQLException etc. Checked exceptions
    are checked at compile-time. 2) Unchecked Exception The classes which inherit
    RuntimeException are known as unchecked exceptions e.g. ArithmeticException, NullPointerException, ArrayIndexOutOfBoundsException
    etc. Unchecked exceptions are not checked at compile-time, but they are checked
    at runtime. 3) Error Error is irrecoverable e.g. OutOfMemoryError, VirtualMachineError,
    AssertionError etc. Java Exception Keywords There are 5 keywords which are used
    in handling exceptions in Java. ![](image-7lhp3typ.jpg) ![](image-n0lzwn06.jpg) Java
    Exception Handling Example Let''s see an example of Java Exception Handling where
    we using a try-catch statement to handle the exception. 1\. public class JavaExceptionExample{ 2\.
    public static void main(String args[]){ 3\. try { 4\. //code that may raise exception 5\.
    int data= 100 / 0 ; 6\. } catch (ArithmeticException e){System.out.println(e);} 7\.
    //rest code of the program 8\. System.out.println( "rest of the code..." ); 9\.
    } 10\. } Output: Exception in thread main java.lang.ArithmeticException:/ by zero
    rest of the code... *In the above example, 100/0 raises an ArithmeticException
    which is handled by a try-catch block. Common Scenarios of Java Exceptions There
    are given some scenarios where unchecked exceptions may occur. They are as follows: 1)
    A scenario where ArithmeticException occurs If we divide any number by zero, there
    occurs an ArithmeticException. 1\. int a= 50 / 0 ; //ArithmeticException 2) A
    scenario where NullPointerException occurs If we have a null value in any variable,
    performing any operation on the variable throws a NullPointerException. 1\. String
    s= null ; 2\. System.out.println(s.length()); //NullPointerException 3) A scenario
    where NumberFormatException occurs The wrong formatting of any value may occur
    NumberFormatException. Suppose I have a string variable that has characters, converting
    this variable into digit will occur NumberFormatException. 1\. String s= "abc"
    ; 2\. int i=Integer.parseInt(s); //NumberFormatException 4) A scenario where Array
    Index Out Of Bounds Exception occurs If you are inserting any value in the wrong
    index, it would result in ArrayIndexOutOfBoundsException as shown below: 1\. int
    a[]= new int [ 5 ]; 2\. a[ 10 ]= 50 ; //ArrayIndexOutOfBoundsException _________________________________________________ Java
    try-catch block Java try block Java try block is used to enclose the code that
    might throw an exception. It must be used within the method. If an exception occurs
    at the particular statement of try block, the rest of the block code will not
    execute. So, it is recommended not to keeping the code in try block that will
    not throw an exception. Java try block must be followed by either catch or finally
    block. Syntax of Java try-catch 1\. try { 2\. //code that may throw an exception 3\.
    } catch (Exception_class_Name ref){} Syntax of try-finally block 1\. try { 2\.
    //code that may throw an exception 3\. } finally {} Java catch block Java catch
    block is used to handle the Exception by declaring the type of exception within
    the parameter. The declared exception must be the parent class exception ( i.e.,
    Exception) or the generated exception type. However, the good approach is to declare
    the generated type of exception. The catch block must be used after the try block
    only. You can use multiple catch block with a single try block. Problem without
    exception handling Let''s try to understand the problem if we don''t use a try-catch
    block. Example 1 1\. public class TryCatchExample1 { 2\. 3\. public static void
    main(String[] args) { 4\. 5\. int data= 50 / 0 ; //may throw exception 6\. 7\.
    System.out.println( "rest of the code" ); 8\. 9\. } 10\. 11\. } Output: Exception
    in thread "main" java.lang. Arithmetic Exception:/by zero As displayed in the
    above example, the rest of the code is not executed (in such case, the rest of
    the code statement is not printed). There can be 100 lines of code after exception.
    So all the code after exception will not be executed. Solution by exception handling Let''s
    see the solution of the above problem by a java try-catch block. Example 2 1\.
    public class TryCatchExample2 { 2\. 3\. public static void main(String[] args)
    { 4\. try 5\. { 6\. int data= 50 / 0 ; //may throw exception 7\. } 8\. //handling
    the exception 9\. catch (ArithmeticException e) 10\. { 11\. System.out.println(e); 12\.
    } 13\. System.out.println( "rest of the code" ); 14\. } 15\. 16\. } Output: java.lang.ArithmeticException:
    / by zero rest of the code Now, as displayed in the above example, the rest of
    the code is executed, i.e., the rest of the code statement is printed. Example
    3 In this example, we also kept the code in a try block that will not throw an
    exception. 1\. public class TryCatchExample3 { 2\. 3\. public static void main(String[]
    args) { 4\. try 5\. { 6\. int data= 50 / 0 ; //may throw exception 7\. // if exception
    occurs, the remaining statement will not exceute 8\. System.out.println( "rest
    of the code" ); 9\. } 10\. // handling the exception 11\. catch (ArithmeticException
    e) 12\. { 13\. System.out.println(e); 14\. } 15\. 16\. } 17\. 18\. } Output: java.lang.ArithmeticException:
    / by zero Here, we can see that if an exception occurs in the try block, the rest
    of the block code will not execute. Example 4 Here, we handle the exception using
    the parent class exception. 1\. public class TryCatchExample4 { 2\. 3\. public
    static void main(String[] args) { 4\. try 5\. { 6\. int data= 50 / 0 ; //may throw
    exception 7\. } 8\. // handling the exception by using Exception class 9\. catch
    (Exception e) 10\. { 11\. System.out.println(e); 12\. } 13\. System.out.println(
    "rest of the code" ); 14\. } 15\. 16\. } Output: java.lang.ArithmeticException:
    / by zero rest of the code Internal working of java try-catch block The JVM firstly
    checks whether the exception is handled or not. If exception is not handled, JVM
    provides a default exception handler that performs the following tasks: Prints
    out exception description. Prints the stack trace (Hierarchy of methods where
    the exception occurred). Causes the program to terminate. But if exception is
    handled by the application programmer, normal flow of the application is maintained
    i.e. rest of the code is executed. _________________________________________________ Java
    catch multiple exceptions Java Multi-catch block A try block can be followed by
    one or more catch blocks. Each catch block must contain a different exception
    handler. So, if you have to perform different tasks at the occurrence of different
    exceptions, use java multi-catch block. Points to remember At a time only one
    exception occurs and at a time only one catch block is executed. All catch blocks
    must be ordered from most specific to most general, i.e. catch for ArithmeticException
    must come before catch for Exception. Example 1 Let''s see a simple example of
    java multi-catch block. 1\. public class MultipleCatchBlock1 { 2\. 3\. public
    static void main(String[] args) { 4\. 5\. try { 6\. int a[]= new int [ 5 ]; 7\.
    a[ 5 ]= 30 / 0 ; 8\. } 9\. catch (ArithmeticException e) 10\. { 11\. System.out.println(
    "Arithmetic Exception occurs" ); 12\. } 13\. catch (ArrayIndexOutOfBoundsException
    e) 14\. { 15\. System.out.println("ArrayIndexOutOfBounds Exception occurs" ); 16\.
    } 17\. catch (Exception e) 18\. { 19\. System.out.println( "Parent Exception occurs"
    ); 20\. } 21\. System.out.println( "rest of the code" ); 22\. } 23\. } Output: Arithmetic
    Exception occurs rest of the code Example 2 1\. public class MultipleCatchBlock2
    { 2\. 3\. public static void main(String[] args) { 4\. 5\. try { 6\. int a[]=
    new int [ 5 ]; 7\. 8\. System.out.println(a[ 10 ]); 9\. } 10\. catch (ArithmeticException
    e) 11\. { 12\. System.out.println( "Arithmetic Exception occurs" ); 13\. } 14\.
    catch (ArrayIndexOutOfBoundsException e) 15\. { 16\. System.out.println( "ArrayIndexOutOfBounds
    Exception occurs" ); 17\. } 18\. catch (Exception e) 19\. { 20\. System.out.println(
    "Parent Exception occurs" ); 21\. } 22\. System.out.println( "rest of the code"
    ); 23\. } 24\. } Output: Array Index Out Of Bounds Exception occurs rest of the
    code Example 3 In this example, try block contains two exceptions. But at a time
    only one exception occurs and its corresponding catch block is invoked. 1\. public
    class MultipleCatchBlock3 { 2\. 3\. public static void main(String[] args) { 4\. 5\.
    try { 6\. int a[]= new int [ 5 ]; 7\. a[ 5 ]= 30 / 0 ; 8\. System.out.println(a[
    10 ]); 9\. } 10\. catch (ArithmeticException e) 11\. { 12\. System.out.println(
    "Arithmetic Exception occurs" ); 13\. } 14\. catch (ArrayIndexOutOfBoundsException
    e) 15\. { 16\. System.out.println( "ArrayIndexOutOfBounds Exception occurs" ); 17\.
    } 18\. catch (Exception e) 19\. { 20\. System.out.println( "Parent Exception occurs"
    ); 21\. } 22\. System.out.println( "rest of the code" ); 23\. } 24\. } Output: Arithmetic
    Exception occurs rest of the code Example 4 In this example, we generate NullPointerException,
    but didn''t provide the corresponding exception type. In such case, the catch
    block containing the parent exception class Exception will invoked. 1\. public
    class MultipleCatchBlock4 { 2\. 3\. public static void main(String[] args) { 4\. 5\.
    try { 6\. String s= null ; 7\. System.out.println(s.length()); 8\. } 9\. catch
    (ArithmeticException e) 10\. { 11\. System.out.println( "Arithmetic Exception
    occurs" ); 12\. } 13\. catch (ArrayIndexOutOfBoundsException e) 14\. { 15\. System.out.println(
    "ArrayIndexOutOfBounds Exception occurs" ); 16\. } 17\. catch (Exception e) 18\.
    { 19\. System.out.println( "Parent Exception occurs" ); 20\. } 21\. System.out.println(
    "rest of the code" ); 22\. } 23\. } Output: Parent Exception occurs rest of the
    code Example 5 Let''s see an example, to handle the exception without maintaining
    the order of exceptions (i.e. from most specific to most general). 1\. class MultipleCatchBlock5{ 2\.
    public static void main(String args[]){ 3\. try { 4\. int a[]= new int [ 5 ]; 5\.
    a[ 5 ]= 30 / 0 ; 6\. } 7\. catch (Exception e){System.out.println( "common task
    completed" );} 8\. catch (ArithmeticException e){System.out.println( "task1 is
    completed" );} 9\. catch (ArrayIndexOutOfBoundsException e){System.out.println(
    "task 2 completed" );} 10\. System.out.println( "rest of the code..." ); 11\.
    } 12\. } Output: Compile-time error __________________________________________________ Java
    Nested try block The try block within a try block is known as nested try block
    in java. Why use nested try block? Sometimes a situation may arise where a part
    of a block may cause one error and the entire block itself may cause another error.
    In such cases, exception handlers have to be nested. Syntax: 1\. .... 2\. try 3\.
    { 4\. statement 1 ; 5\. statement 2 ; 6\. try 7\. { 8\. statement 1 ; 9\. statement
    2 ; 10\. } 11\. catch (Exception e) 12\. { 13\. } 14\. } 15\. catch (Exception
    e) 16\. { 17\. } 18\. .... Java nested try example Let''s see a simple example
    of java nested try block. 1\. class Excep6{ 2\. public static void main(String
    args[]){ 3\. try { 4\. try { 5\. System.out.println( "going to divide" ); 6\.
    int b = 39 / 0 ; 7\. } catch (ArithmeticException e){System.out.println(e);} 8\. 9\.
    try { 10\. int a[]= new int [ 5 ]; 11\. a[ 5 ]= 4 ; 12\. } catch (ArrayIndexOutOfBoundsException
    e){System.out.println(e);} 13\. 14\. System.out.println("other statement); 15\.
    } catch (Exception e){System.out.println( "handeled" );} 16\. 17\. System.out.println(
    "normal flow.." ); 18\. } 19\. } Java finally block Java finally block is a block
    that is used to execute important code such as closing connection, stream etc. Java
    finally block is always executed whether exception is handled or not. Java finally
    block follows try or catch block. Note: If you don''t handle exception, before
    terminating the program, JVM executes finally block(if any). Why use java finally Finally
    block in java can be used to put "cleanup" code such as closing a file, closing
    connection etc. Usage of Java finally Let''s see the different cases where java
    finally block can be used. Case 1 Let''s see the java finally example where exception
    doesn''t occur . 1\. class TestFinallyBlock{ 2\. public static void main(String
    args[]){ 3\. try { 4\. int data= 25 / 5 ; 5\. System.out.println(data); 6\. } 7\.
    catch (NullPointerException e){System.out.println(e);} 8\. finally {System.out.println(
    "finally block is always executed" );} 9\. System.out.println( "rest of the code..."
    ); 10\. } 11\. } Output:5 Finally block is always executed rest of the code... Case
    2 Let''s see the java finally example where exception occurs and not handled . 1\.
    class TestFinallyBlock1{ 2\. public static void main(String args[]){ 3\. try { 4\.
    int data= 25 / 0 ; 5\. System.out.println(data); 6\. } 7\. catch (NullPointerException
    e){System.out.println(e);} 8\. finally {System.out.println( "finally block is
    always executed" );} 9\. System.out.println( "rest of the code..." ); 10\. } 11\.
    } Output: finally block is always executed Exception in thread main java.lang.ArithmeticException:/
    by zero Case 3 Let''s see the java finally example where exception occurs and
    handled . 1\. public class TestFinallyBlock2{ 2\. public static void main(String
    args[]){ 3\. try { 4\. int data= 25 / 0 ; 5\. System.out.println(data); 6\. } 7\.
    catch (ArithmeticException e){System.out.println(e);} 8\. finally {System.out.println(
    "finally block is always executed" );} 9\. System.out.println( "rest of the code..."
    ); 10\. } 11\. } Output: Exception in thread main java.lang.ArithmeticException:/
    by zero Finally block is always executed rest of the code... Rule: For each try
    block there can be zero or more catch blocks, but only one finally block. Note:
    The finally block will not be executed if program exits(either by calling System.exit()
    or by causing a fatal error that causes the process to abort). Java throw keyword The
    Java throw keyword is used to explicitly throw an exception. We can throw either
    checked or uncheked exception in java by throw keyword. The throw keyword is mainly
    used to throw custom exception. We will see custom exceptions later. The syntax
    of java throw keyword is given below. 1\. throw exception; Let''s see the example
    of throw IOException. 1\. throw new IOException("sorry device error); java throw
    keyword example In this example, we have created the validate method that takes
    integer value as a parameter. If the age is less than 18, we are throwing the
    ArithmeticException otherwise print a message welcome to vote. 1\. public class
    TestThrow1{ 2\. static void validate( int age){ 3\. if (age< 18 ) 4\. throw new
    ArithmeticException( "not valid" ); 5\. else 6\. System.out.println( "welcome
    to vote" ); 7\. } 8\. public static void main(String args[]){ 9\. validate( 13
    ); 10\. System.out.println( "rest of the code..." ); 11\. } 12\. } Output: Exception
    in thread main java.lang.ArithmeticException:not valid Java throws keyword The
    Java throws keyword is used to declare an exception. It gives an information to
    the programmer that there may occur an exception so it is better for the programmer
    to provide the exception handling code so that normal flow can be maintained. Exception
    Handling is mainly used to handle the checked exceptions. If there occurs any
    unchecked exception such as NullPointerException, it is programmers fault that
    he is not performing check up before the code being used. Syntax of java throws 1\.
    return_type method_name() throws exception_class_name{ 2\. //method code 3\. } Difference
    between throw and throws in Java There are many differences between throw and
    throws keywords. A list of differences between throw and throws are given below: ![](image-67zwrcj8.jpg) ![](image-2m9uexyb.jpg) Java
    throw example 1\. void m(){ 2\. throw new ArithmeticException( "sorry" ); 3\.
    } Java throws example 1\. void m() throws ArithmeticException{ 2\. //method code 3\.
    } Java throw and throws example 1\. void m() throws ArithmeticException{ 2\. throw
    new ArithmeticException( "sorry" ); 3\. } Difference between final, finally and
    finalize There are many differences between final, finally and finalize. A list
    of differences between final, finally and finalize are given below: ![](image-vvcni9g4.jpg)'
