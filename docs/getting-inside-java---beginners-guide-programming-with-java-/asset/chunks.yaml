    out is the object of PrintStream class, println() is the method of PrintStream
    class. We will learn about the internal working of System.out.println statement
    later. How to set path in Java? The path is required to be set for using tools
    such as javac, java, etc. If you are saving the Java source file inside the JDK/bin
    directory, the path is not required to be set because all the tools will be available
    in the current directory. However, if you have your Java file outside the JDK/bin
    folder, it is necessary to set the path of JDK. There are two ways to set the
    path in Java: 1\. Temporary 2\. Permanent 1) How to set the Temporary Path of
    JDK in Windows To set the temporary path of JDK, you need to follow the following
    steps: Open the command prompt Copy the path of the JDK/bin directory Write in
    command prompt: set path=copied_path For Example: set path=C:\Program Files\Java\jdk1.6.0_23\bin 2)
    How to set Permanent Path of JDK in Windows For setting the permanent path of
    JDK, you need to follow these steps: Go to MyComputer properties -> advanced tab
    -> environment variables -> new tab of user variable -> write path in variable
    name -> write path of bin folder in variable value -> ok -> ok -> ok For Example: 1)
    Go to MyComputer properties 9) Again, Click on ok button 8) Click on ok button 7)
    Paste path of bin folder in the variable value 6) Copy the path of bin folder 5)
    Write the path in the variable name 4) Click on the new tab of user variables 3)
    Click on environment variables 2) Click on the advanced tab Now your permanent
    path is set. You can now execute any program of java from any drive. Setting Java
    Path in Linux OS Setting path in Linux OS is the same as setting the path in the
    Windows OS. But, here we use the export tool rather than set. Let''s see how to
    set path in Linux OS: exportPATH=$PATH:/home/jdk1.6.01/bin/ Here, we have installed
    the JDK in the home directory under Root (/home).Module IIJDK, JRE and JVMDifference
    between JDK, JRE and JVM We must understand the differences between JDK, JRE,
    and JVM before proceeding further to Java. See the brief overview of JVM here. If
    you want to get the detailed knowledge of Java Virtual Machine, move to the next
    page. Firstly, let''s see the differences between the JDK, JRE, and JVM. JVM JVM
    (Java Virtual Machine) is an abstract machine. It is called a virtual machine
    because it doesn''t physically exist. It is a specification that provides a runtime
    environment in which Java bytecode can be executed. It can also run those programs
    which are written in other languages and compiled to Java bytecode. JVMs are available
    for many hardware and software platforms. JVM, JRE, and JDK are platform dependent
    because the configuration of each OS is different from each other. However, Java
    is platform independent. There are three notions of the JVM: and The JVM performs
    the following main tasks: Loads code Verifies code Executes code Provides runtime
    environment JRE JRE is an acronym for Java Runtime Environment. It is also written
    as Java RTE. The Java Runtime Environment is a set of software tools which are
    used for developing Java applications. It is used to provide the runtime environment.
    It is the implementation of JVM. It physically exists. It contains a set of libraries
    + other files that JVM uses at runtime. The implementation of JVM is also actively
    released by other companies besides Sun Micro Systems. JDK JDK is an acronym for
    Java Development Kit. The Java Development Kit (JDK) is a software development
    environment which is used to develop Java applications and It physically exists.
    It contains JRE + development tools. JDK is an implementation of any one of the
    below given Java Platforms released by Oracle Corporation: Standard Edition Java
    Platform Enterprise Edition Java Platform Micro Edition Java Platform The JDK
    contains a private Java Virtual Machine (JVM) and a few other resources such as
    an interpreter/loader (java), a compiler (javac), an archiver (jar), a documentation
    generator (Javadoc), etc. to complete the development of a Java Application. Difference
    betweem JDK, JRE and JVM To understand the difference between these three, let
    us consider the following diagram. ![](image-zidxqfql.jpg) JDK – Java Development
    Kit (in short JDK) is Kit which provides the environment to develop and execute(run)
    the Java program. JDK is a kit(or package) which includes two things 1\. Development
    Tools(to provide an environment to develop your java programs) 2\. JRE (to execute
    your java program). Note : JDK is only used by Java Developers. JRE – Java Runtime
    Environment (to say JRE) is an installation package which provides environment
    to only run(not develop) the java program(or application)onto your machine. JRE
    is only used by them who only wants to run the Java Programs i.e. end users of
    your system. JVM – Java Virtual machine (JVM) is a very important part of both
    JDK and JRE because it is contained or inbuilt in both. Whatever Java program
    you run using JRE or JDK goes into JVM and JVM is responsible for executing the
    java program line by line hence it is also known as interpreter. How does JRE
    and JDK works? What does JRE consists of? JRE consists of the following components: Deployment
    technologies , including deployment, Java Web Start and Java Plug-in. User interface
    toolkits , including Abstract Window Toolkit (AWT), Swing, Java 2D, Accessibility,
    Image I/O, Print Service, Sound, drag and drop (DnD) and input methods . Integration
    libraries , including Interface Definition Language (IDL), Java Database Connectivity
    (JDBC), Java Naming and Directory Interface (JNDI), Remote Method Invocation (RMI),
    Remote Method Invocation Over Internet Inter-Orb Protocol (RMI-IIOP) and scripting
    . Other base libraries , including international support, input/output (I/O),
    extension mechanism, Beans, Java Management Extensions (JMX), Java Native Interface
    (JNI), Math, Networking, Override Mechanism, Security, Serialization and Java
    for XML Processing (XML JAXP) Lang and util base libraries , including lang and
    util, management, versioning, zip, instrument, reflection, Collections, Concurrency
    Utilities, Java Archive (JAR), Logging, Preferences API, Ref Objects and Regular
    Expressions . Java Virtual Machine (JVM) , including Java HotSpot Client and Server
    Virtual Machines . How does JRE works? To understand how the JRE works let us
    consider a Java source file saved as The file is compiled into a set of Byte Code
    that is stored in a ” file. Here it will be “. The following diagram depicts what
    is done at compile time. ![](image-rq41ergs.jpg) The following actions occur at
    runtime. The Class Loader loads all necessary classes needed for the execution
    of a program. It provides security by separating the namespaces of the local file
    system from that imported through the network. These files are loaded either from
    a hard disk, a network or from other sources. The JVM puts the code through the
    Byte Code Verifier that checks the format and checks for an illegal code. Illegal
    code, for example, is code that violates access rights on objects or violates
    the implementation of pointers. The Byte Code verifier ensures that the code adheres
    to the JVM specification and does not violate system integrity. ![](image-chuw5gkr.jpg) At
    runtime the Byte Code is loaded, checked and run by the interpreter. The interpreter
    has the following two functions: Both operations can be shown as: ![](image-jvc9t5r1.jpg) To
    understand the interactions between JDK and JRE consider the following diagram. ![](image-ewjg4zjp.jpg) Class
    Loader Byte Code Verifier Intrepreter Execute the Byte Code Make appropriate calls
    to the underlying hardware How does JVM works? JVM becomes an instance of JRE
    at runtime of a Java program. It is widely known as a runtime interpreter.JVM
    largely helps in the abstraction of inner implementation from the programmers
    who make use of libraries for their programmes from JDK.JVM Architecture JVM (Java
    Virtual Machine) is an abstract machine. It is a specification that provides runtime
    environment in which java bytecode can be executed. JVMs are available for many
    hardware and software platforms (i.e. JVM is platform dependent). What is JVM? It
    is: 1\. A specification where working of Java Virtual Machine is specified. But
    implementation provider is independent to choose the algorithm. Its implementation
    has been provided by Oracle and other companies. 2\. An implementation Its implementation
    is known as JRE (Java Runtime Environment). 3\. Runtime Instance Whenever you
    write java command on the command prompt to run the java class, an instance of
    JVM is created. What it does? The JVM performs following operation: Loads code Verifies
    code Executes code Provides runtime environment JVM provides definitions for the: Memory
    area Class file format Register set Garbage-collected heap Fatal error reporting
    etc. JVM Architecture Let''s understand the internal architecture of JVM. It contains
    classloader, memory area, execution engine etc. ![](image-u13hqtbb.jpg) 1) Classloader Classloader
    is a subsystem of JVM which is used to load class files. Whenever we run the java
    program, it is loaded first by the classloader. There are three built-in classloaders
    in Java. 1\. Bootstrap ClassLoader : This is the first classloader which is the
    super class of Extension classloader. It loads the rt.jar file which contains
    all class files of Java Standard Edition like java.lang package classes, java.net
    package classes, java.util package classes, java.io package classes, java.sql
    package classes etc. 2\. Extension ClassLoader : This is the child classloader
    of Bootstrap and parent classloader of System classloader. It loades the jar files
    located inside $JAVA_HOME/jre/lib/ext directory. 3\. System/Application ClassLoader
    : This is the child classloader of Extension classloader. It loads the classfiles
    from classpath. By default, classpath is set to current directory. You can change
    the classpath using "-cp" or "-classpath" switch. It is also known as Application
    classloader. 1\. //Let''s see an example to print the classloader name 2\. public
    class ClassLoaderExample 3\. { 4\. public static void main(String[] args) 5\.
    { 6\. // Let''s print the classloader name of current class. 7\. //Application/System
    classloader will load this class 8\. Class c=ClassLoaderExample. class ; 9\. System.out.println(c.getClassLoader()); 10\.
    //If we print the classloader name of String, it will print null because it is
    an 11\. //in-built class which is found in rt.jar, so it is loaded by Bootstrap
    classloader 12\. System.out.println(String. class .getClassLoader()); 13\. } 14\.
    } Output: sun.misc.Launcher$AppClassLoader@4e0e2f2a null These are the internal
    classloaders provided by Java. If you want to create your own classloader, you
    need to extend the ClassLoader class. 2) Class(Method) Area Class(Method) Area
    stores per-class structures such as the runtime constant pool, field and method
    data, the code for methods. 3) Heap It is the runtime data area in which objects
    are allocated. 4) Stack Java Stack stores frames. It holds local variables and
    partial results, and plays a part in method invocation and return. Each thread
    has a private JVM stack, created at the same time as thread. A new frame is created
    each time a method is invoked. A frame is destroyed when its method invocation
    completes. 5) Program Counter Register PC (program counter) register contains
    the address of the Java virtual machine instruction currently being executed. 6)
    Native Method Stack It contains all the native methods used in the application. 7)
    Execution Engine It contains: 1\. A virtual processor 2\. Interpreter: Read bytecode
    stream then execute the instructions. 3\. Just-In-Time(JIT) compiler: It is used
    to improve the performance. JIT compiles parts of the byte code that have similar
    functionality at the same time, and hence reduces the amount of time needed for
    compilation. Here, the term "compiler" refers to a translator from the instruction
    set of a Java virtual machine (JVM) to the instruction set of a specific CPU. 8)
    Java Native Interface Java Native Interface (JNI) is a framework which provides
    an interface to communicate with another application written in another language
    like C, C++, Assembly etc. Java uses JNI framework to send output to the Console
    or interact with OS libraries.Variables, Data Types, Operators Java Variables A
    variable is a container which holds the value while the Java program is executed.
    A variable is assigned with a data type. Variable is a name of memory location.
    There are three types of variables in java: local, instance and static. There
    are two types of data types in Java: primitive and non-primitive. Variable Variable
    is name of reserved area allocated in memory . In other words, it is a name of
    memory location . It is a combination of "vary + able" that means its value can
    be changed. 1\. int data= 50 ; //Here data is variable Types of Variables There
    are three types of variables in Java: local variable instance variable static
    variable 1) Local Variable A variable declared inside the body of the method is
    called local variable. You can use this variable only within that method and the
    other methods in the class aren''t even aware that the variable exists. A local
    variable cannot be defined with "static" keyword. 2) Instance Variable A variable
    declared inside the class but outside the body of the method, is called instance
    variable. It is not declared as static. It is called instance variable because
    its value is instance specific and is not shared among instances. 3) Static variable A
    variable which is declared as static is called static variable. It cannot be local.
    You can create a single copy of static variable and share among all the instances
    of the class. Memory allocation for static variable happens only once when the
    class is loaded in the memory. Example to understand the types of variables in
    java 1\. class A{ 2\. int data= 50 ; //instance variable 3\. static int m= 100
    ; //static variable 4\. void method(){ 5\. int n= 90 ; //local variable 6\. } 7\.
    } //end of class Java Variable Example: Add Two Numbers 1\. class Simple{ 2\.
    public static void main(String[] args){ 3\. int a= 10 ; 4\. int b= 10 ; 5\. int
    c=a+b; 6\. System.out.println(c); 7\. }} Output: 20 Java Variable Example: Widening 1\.
    class Simple{ 2\. public static void main(String[] args){ 3\. int a= 10 ; 4\.
    float f=a; 5\. System.out.println(a); 6\. System.out.println(f); 7\. }} Output: 10 10.0 Java
    Variable Example: Narrowing (Typecasting) 1\. class Simple{ 2\. public static
    void main(String[] args){ 3\. float f= 10 .5f; 4\. //int a=f;//Compile time error 5\.
    int a=( int )f; 6\. System.out.println(f); 7\. System.out.println(a); 8\. }} Output: 10.5 10 Java
    Variable Example: Overflow 1\. class Simple{ 2\. public static void main(String[]
    args){ 3\. //Overflow 4\. int a= 130 ; 5\. byte b=( byte )a; 6\. System.out.println(a); 7\.
    System.out.println(b); 8\. }} Output: 130 -126 Java Variable Example: Adding Lower
    Type 1\. class Simple{ 2\. public static void main(String[] args){ 3\. byte a=
    10 ; 4\. byte b= 10 ; 5\. //byte c=a+b;//Compile Time Error: because a+b=20 will
    be int 6\. byte c=( byte )(a+b); 7\. System.out.println(c); 8\. }} Output: 20 Data
    Types in Java Data types specify the different sizes and values that can be stored
    in the variable. There are two types of data types in Java: 1\. Primitive data
    types: The primitive data types include boolean, char, byte, short, int, long,
    float and double. 2\. Non-primitive data types: The non-primitive data types include
    Classes, Interfaces, and Arrays. Java Primitive Data Types In Java language, primitive
    data types are the building blocks of data manipulation. These are the most basic
    data types available in Java language. ![](image-xdarddtr.jpg) There are 8 types
    of primitive data types: boolean data type byte data type char data type short
    data type int data type long data type float data type double data type ![](image-qcy6tfap.jpg) Boolean
    Data Type The Boolean data type is used to store only two possible values: true
    and false. This data type is used for simple flags that track true/false conditions. The
    Boolean data type specifies one bit of information, but its "size" can''t be defined
    precisely. Example: Boolean one = false Byte Data Type The byte data type is an
    example of primitive data type. It isan 8-bit signed two''s complement integer.
    Its value-range lies between -128 to 127 (inclusive). Its minimum value is -128
    and maximum value is 127. Its default value is 0. The byte data type is used to
    save memory in large arrays where the memory savings is most required. It saves
    space because a byte is 4 times smaller than an integer. It can also be used in
    place of "int" data type. Example: byte a = 10, byte b = -20 Short Data Type The
    short data type is a 16-bit signed two''s complement integer. Its value-range
    lies between -32,768 to 32,767 (inclusive). Its minimum value is – 32,768 and
    maximum value is 32,767\. Its default value is 0\. The short data type can also
    be used to save memory just like byte data type. A short data type is 2 times
    smaller than an integer. Example: short s = 10000, short r = -5000 Int Data Type The
    int data type is a 32-bit signed two''s complement integer. Its value-range lies
    between – 2,147,483,648 (-2^31) to 2,147,483,647 (2^31 -1) (inclusive). Its minimum
    value is – 2,147,483,648and maximum value is 2,147,483,647\. Its default value
    is 0\. The int data type is generally used as a default data type for integral
    values unless if there is no problem about memory. Example: int a = 100000, int
    b = -200000 Long Data Type The long data type is a 64-bit two''s complement integer.
    Its value-range lies between -9,223,372,036,854,775,808(-2^63) to 9,223,372,036,854,775,807(2^63
    -1)(inclusive). Its minimum value is – 9,223,372,036,854,775,808and maximum value
    is 9,223,372,036,854,775,807\. Its default value is 0\. The long data type is
    used when you need a range of values more than those provided by int. Example:
    long a = 100000L, long b = -200000L Float Data Type The float data type is a single-precision
    32-bit IEEE 754 floating point.Its value range is unlimited. It is recommended
    to use a float (instead of double) if you need to save memory in large arrays
    of floating point numbers. The float data type should never be used for precise
    values, such as currency. Its default value is 0.0F. Example: float f1 = 234.5f Double
    Data Type The double data type is a double-precision 64-bit IEEE 754 floating
    point. Its value range is unlimited. The double data type is generally used for
    decimal values just like float. The double data type also should never be used
    for precise values, such as currency. Its default value is 0.0d. Example: double
    d1 = 12.3 Char Data Type The char data type is a single 16-bit Unicode character.
    Its value-range lies between ''\u0000'' (or 0) to ''\uffff'' (or 65,535 inclusive).The
    char data type is used to store characters. Example: char letterA = ''A'' Operators
    in Java Operator in Java is a symbol which is used to perform operations. For
    example: +, -, *, / etc. There are many types of operators in Java which are given
    below: Unary Operator, Arithmetic Operator, Shift Operator, Relational Operator, Bitwise
    Operator, Logical Operator, Ternary Operator and Assignment Operator. Java Operator
    Precedence ![](image-r96uo149.jpg) ![](image-azx4gqsy.jpg) Java Unary Operator The
    Java unary operators require only one operand. Unary operators are used to perform
    various operations i.e.: incrementing/decrementing a value by one negating an
    expression inverting the value of a boolean Java Unary Operator Example: ++ and
    -- 1\. class OperatorExample{ 2\. public static void main(String args[]){ 3\.
    int x= 10 ; 4\. System.out.println(x++); //10 (11) 5\. System.out.println(++x);
    //12 6\. System.out.println(x--); //12 (11) 7\. System.out.println(--x); //10 8\.
    }} Output: 10 12 12 10 Java Unary Operator Example 2: ++ and -- 1\. class OperatorExample{ 2\.
    public static void main(String args[]){ 3\. int a= 10 ; 4\. int b= 10 ; 5\. System.out.println(a++
    + ++a); //10+12=22 6\. System.out.println(b++ + b++); //10+11=21 7\. 8\. }} Output: 22 21 Java
    Unary Operator Example: ~ and ! 1\. class OperatorExample{ 2\. public static void
    main(String args[]){ 3\. int a= 10 ; 4\. int b=- 10 ; 5\. boolean c= true ; 6\.
    boolean d= false ; 7\. System.out.println(~a); //-11 (minus of total positive
    value which starts from 0) 8\. System.out.println(~b); //9 (positive of total
    minus, positive starts from 0) 9\. System.out.println(!c); //false (opposite of
    boolean value) 10\. System.out.println(!d); //true 11\. }} Output: -11 9 false true Java
    Arithmetic Operators Java arithmatic operators are used to perform addition, subtraction,
    multiplication, and division. They act as basic mathematical operations. Java
    Arithmetic Operator Example 1\. class OperatorExample{ 2\. public static void
    main(String args[]){ 3\. int a= 10 ; 4\. int b= 5 ; 5\. System.out.println(a+b);
    //15 6\. System.out.println(a-b); //5 7\. System.out.println(a*b); //50 8\. System.out.println(a/b);
    //2 9\. System.out.println(a%b); //0 10\. }} Output: 15 5 50 2 0 Java Arithmetic
    Operator Example: Expression 1\. class OperatorExample{ 2\. public static void
    main(String args[]){ 3\. System.out.println( 10 * 10 / 5 + 3 – 1 * 4 / 2 ); 4\.
    }} Output: 21 Java Left Shift Operator The Java left shift operator << is used
    to shift all of the bits in a value to the left side of a specified number of
    times. Java Left Shift Operator Example 1\. class OperatorExample{ 2\. public
    static void main(String args[]){ 3\. System.out.println( 10 << 2 ); //10*2^2=10*4=40 4\.
    System.out.println( 10 << 3 ); //10*2^3=10*8=80 5\. System.out.println( 20 <<
    2 ); //20*2^2=20*4=80 6\. System.out.println( 15 << 4 ); //15*2^4=15*16=240 7\.
    }} Output: 40 80 80 240 Java Right Shift Operator The Java right shift operator
    >> is used to move left operands value to right by the number of bits specified
