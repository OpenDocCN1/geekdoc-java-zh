- fmt: "\nTo create software documents, presentations, charts, graphs, or animations,\
    \ there are several document editing tools available. Starting with the most popular\
    \ tool, you can install `microsoft office`, and edit any type of document without\
    \ any hassle. The package includes `microsoft word`, `microsoft excel`, `microsoft\
    \ powerpoint`, `outlook`, `one note`, `one drive`, and other modules.\n\nFurthermore,\
    \ google docs is another helpful document editing tool which can be used online\
    \ to access, update, and create documents. The tool lets you create sheets, docs,\
    \ slides, and forms for which you can select from a wide range of templates.\n\
    \n# Chapter two: java\n\n## Overview and basic syntax\n\nJava is a high-level\
    \ programming language, which was released by sun microsystems in 1995. There\
    \ are unlimited websites and applications built using `java` technology because\
    \ it is reliable, easy to use, and faster compared to other programming languages.\
    \ Being an object-oriented programming language, developers can code, compile,\
    \ execute, and test programs much faster. Furthermore, the applications developed\
    \ using `java` are adaptable to multiple environments and are more secure as well.\n\
    \nThe language is made to run on different platforms including `windows`, `unix`,\
    \ and `mac os` for which multiple configurations are provided. Being absolutely\
    \ platform independent, `java` is compiled into platform specific machines and\
    \ the byte code is the distributed and interpreted through `java virtual machine`\
    \ (`jvm`). Moreover, `java` byte code enables high performance and is designed\
    \ for a distributed internet environment as well.\n\nMoving on to the basic syntax,\
    \ `java` programming is generally based on objects, classes, methods, variables,\
    \ modifiers, constructors, and regular expressions. To better understand the simple\
    \ `java` program, you can undergo the brief details of each aspect as follows:\n\
    \n### Keywords\n\n| Keyword | Functionality |\n| :--- | :--- |\n| `Class` | Used\
    \ to declare a class |\n| `Void` | Return type |\n| `Public` | Access modifier\
    \ to make the function visible |\n| `Static` | Used to create an object in static\
    \ method |\n| `Main()` | `Main()` method is placed at the start of the program\
    \ |\n| `System.out.println()` | Prints statements on the console |\n\nBefore you\
    \ begin with `java` programming, make sure that you remember that `java` is a\
    \ case sensitive language and you need to declare the class names with the first\
    \ letter in upper case. Method names should start with a lowercase letter and\
    \ the name of the program file should be exactly the same as the class name to\
    \ avoid any problems when executing the program.\n\nThe concepts in `java` programming\
    \ language include classes, objects, polymorphism, inheritance, abstraction, encapsulation,\
    \ instance, and method passing.\n\nYour first `java` program might look like this:\n\
    \n```java\nClass helloworld\n{\n    public static void main ( string [] args )\n\
    \    {\n        System.out.println (\"your first java program!\")\n    }\n}\n\
    ```\n\n## Java identifiers and modifiers\n\n`java` identifiers should begin with\
    \ a letter from a to z or A to Z because the identifiers are case sensitive as\
    \ well. You must remember that a keyword can never be used as an identifier and\
    \ identifiers can have any combination of characters after the first character.\
    \ For example, `month`, or `price`.\n\nThere are two types of modifiers in the\
    \ `java` programming language, one is known as access modifiers the other is called\
    \ non access. modifiers are generally used to modify methods or classes.\n\n###\
    \ Classes and objects\n\nObjects are part of classes and are also known as instances.\
    \ A class represents a set of properties that are common to all objects and is\
    \ defined prototype from which objects are created. To declare a class we will\
    \ have class name, interface, and body.\n\nFurthermore, everything in `java` is\
    \ associated with objects and classes that are combined with methods and attributes.\
    \ Take an example of a mobile phone in real life, it has attributes such as color,\
    \ memory and weight. To create a class in `java` you need to follow the syntax\
    \ mentioned below:\n\n```java\nPublic class newclass {\n    Int a = 1;\n}\n```\n\
    \nTo create object “newobj”:\n\n```java\nPublic class newclass {\n    int a =\
    \ 1;\n    Public static void main ( string [] args ) {\n        newclass newobj\
    \ = newclass();\n        System.out.println ( newobj.a );\n    }\n}\n```\n\nCreating\
    \ an object requires declaration, instantiation, and initialization. Declaration\
    \ is the process of declaring a variable name with an object type where instantiation\
    \ is used to create an object with a `new` keyword. The program is continued by\
    \ a call to the constructor to initialize the new object.\n\n## Basic data types\
    \ and variables\n\nIn a `java` program, the data is stored in variables and the\
    \ program at first declares the variables reads data onto the variables and executes\
    \ the provided operations. Once the process is complete, the variables are written\
    \ once again at a new location. Variables provide a reserved memory location to\
    \ store values and the memory is allocated by the operating system.\n\n### Data\
    \ types\n\nThere are two different data types in `java` programming language known\
    \ as primitive data types and object data types. Primitive data types are classified\
    \ into 8 categories: `byte`, `short`, `int`, `long`, `float`, `double`, `boolean`,\
    \ and `char`. Object data types are created by using the constructors of the classes\
    \ and they are also responsible for accessing objects. The default value of every\
    \ available reference variable is set to `null` and it can also be used to refer\
    \ to an object of the declared type.\n\n### Variables\n\nThere are three types\
    \ of variables used in `java` programming language:\n1. Local variables\n2. Instance\
    \ variables\n3. Class/static variables\n\n#### Local variables\nLocal variables\
    \ are generally declared on constructors and methods. As they are created with\
    \ a constructor access modifiers cannot be used along with local variables. There\
    \ is no default value for local variables.\n\n#### Instance variables\nInstance\
    \ variables are declared within a class and it is created whenever an object is\
    \ created. They are supposed to hold values that are referred to by more than\
    \ one constructor or method. Access modifiers can also be given to instance variables.\n\
    \n## Operators, control statements and decision making\n\n### Operators\n\nThe\
    \ basic operators that are available in the `java` programming language are explained\
    \ as follows:\n\n*   **Arithmetic operators**: arithmetic operators can be used\
    \ to perform mathematical calculations and equation solving within the program.\
    \ This includes addition, subtraction, multiplication, division, modulus, and\
    \ increment and decrement functions.\n*   **Unary operators**: postfix `expr++`\
    \ and prefix `++expr`, `-expr` expressions.\n*   **Logical operators**: `(a &&\
    \ b)` for false, `(a || b)` for true, and `!(a && b)` for true.\n*   **Bitwise\
    \ operators**: to perform bit-by-bit operation.\n*   **Assignment**: `=`, `+=`,\
    \ `|=`, `^=`.\n\n### Control statements\n\nThe control statements for the `java`\
    \ language are similar to that of other major programming languages such as c\
    \ or c++. The conditions are briefed in detail as follows:\n"
