    \n## Chapter one: what is programming?\nGenerally programming is referred to as\
    \ a set of instructions that the computer utilizes to complete certain tasks.\
    \ this is also known as coding. before delving into an in-depth discussion, you\
    \ must be aware of how programming works and how the set of instructions are.\
    \ when you are able to follow the correct syntax, it can be quite easy. programming\
    \ is a way to communicate with computers through, including high-level and low-level\
    \ languages.\n\nIn order to solve a problem with a computer, the set of instructions\
    \ that will be executed is known as a program. for example, if you are given the\
    \ task to add two integers, the algorithm for adding integers will be written\
    \ in `c++`, `c#` or `java`. if the program is not correct, the compiler or editor\
    \ will be unable to execute the.\n\nProgramming can be learned better through\
    \ practice and writing code, although it might seem like a fun activity at the\
    \ start, it can also turn out to be time-consuming. more, this book will make\
    \ it easier for beginners to choose the most suitable programming language.\n\n\
    ## Problem solving with computer programming\nIn essence, a computer program is\
    \ supposed to solve a specific problem by following instructions. people can write\
    \ a program by following multiple techniques and approaches. in order to solve\
    \ a problem, you need to determine the code flow and fulfill the requirements\
    \ step by step to achieve the desired output. in some cases, your computer program\
    \ may not work even after hours of struggle, because of inappropriate syntax or\
    \ flow for computer language requirements.\n\nUsing this example of preparing\
    \ a wooden table, you would need to write down the instructions as follows:\n\n\
    1. Get the most suitable pieces of wood required to make the table.\n2. Get the\
    \ essential tools and equipment that will be used during the procedure.\n3. Join\
    \ the pieces and build your table.\n4. Polish the end product to make it look\
    \ attractive.\n"
