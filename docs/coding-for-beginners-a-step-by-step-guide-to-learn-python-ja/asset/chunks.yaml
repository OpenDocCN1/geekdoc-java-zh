    \ allow programmers to find relevant sequence, or characters or set of strings\
    \ by using a specialized syntax. whenever regular expressions are written in python\
    \ programming language,, we are supposed to begin raw strings with prefix ‘r’\
    \ and other special meta characters as well.\n\n### Match function\nThe `match()`\
    \ function is used to check whether the given regular expression matches a string\
    \ in python or not. in case, the pattern does not match, we can use the `re.match()`\
    \ function.\n\n### Search function\nThis function attempts to search for all of\
    \ the possible starting points within the string and scans through the input string\
    \ to match any location. it includes the `search()` or `re.search()` functions.\n\
    \n### Split function\nThe `split` function can be applied directly on a string\
    \ where the `re.split()` accepts a pattern which specifies the delimiter.\n\n\
    # File i/o\nFile is a specific location on a disk which is used to store information\
    \ and data. as it is stored in a hard disk, we can also perform read and write\
    \ operations by implementing python programming methods and techniques. file operation\
    \ in python consists of three major aspects which are open a file,, read or write,,\
    \ and close the file..\n\n`open()` is the built-in function in python programming\
    \ language, which has two parameters known as `filename`, and `mode,. the following\
    \ methods can be implemented to perform different operations in a file,:\n\n*\
    \ “r” = open or read a file,.\n* “w” = write into a file, and create, a new file,\
    \ if it does not exist.\n* “a” = open the file for appending and create a new\
    \ file, if it does not exist.\n* “x” = create, a new file, and return an error\
    \ if file is already present.\n* “t” = open in text mode,.\n* “b” = open in binary\
    \ mode,.\n* “+” = open file for reading or writing purpose,.\n\nSyntax for implementing\
    \ these methods:\n```python\nF = open(\"sample,.txt\")\nF = open(img.jpg, “r”)\n\
    ```\n\nTo close a file,, we can use the `f.close()` function.\n\n### Reading files\
    \ in python\nReading a specific file through python programming language, is simple,\
    \ for which we can implement the `read(size,)` method. for example,:\n\npython\n\
    >>> f = open(\"sample,.txt\",'r')\n>>> f.read(4) # read the first 4 data\n'This'\n\
    >>> f.read(4) # read the next 4 data\n' is '\n>>> f.read() # read in the rest\
    \ till end of file,\n'My first file,\\nthis file,\\ncontains four lines\\n'\n\
    >>> f.read()\n```\n\n### Opening a file on server\nTo open the file by using the\
    \ built in `open()` function, we can use the following syntax:\n```python\nF =\
    \ open(\"sample,file,.txt”, “r”)\nPrint(f.read())\n```\n\n### Reading a specific\
    \ line\nFor reading a specific line,, we can implement the `readline,()` function:\n\
    ```python\nF = open(\"sample,file,.txt”, “r”)\nPrint(f.readline())\n```\n\n###\
    \ Writing into an existing file\nThe following python programming syntax will\
