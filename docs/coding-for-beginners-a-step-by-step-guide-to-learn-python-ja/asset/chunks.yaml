    \ varchar not null (255),\n  marks int,\n  primary key (id)\n);\n```\n\n### Foreign\
    \ key\n\nThe `foreign key` constraint in sql is implemented to link two tables\
    \ together for which the `foreign key` in one table refers to the primary key\
    \ from the other table.\n\nSyntax for implementing the `foreign key` constraint\
    \ on `studentid` column to create `student` table:\n\n```sql\nCreate table student\
    \ (\n  studentid in not null,\n  studentmarks int not null,\n  classid int,\n\
    \  primary key (studentid),\n  foreign key (classid) references students( studentid)\n\
    );\n```\n\n### Constraints and useful resources\n\nConstraints are the specific\
