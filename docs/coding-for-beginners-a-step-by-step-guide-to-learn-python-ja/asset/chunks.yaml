    \n## Basic operators\n\nPython has built-in operators such as arithmetic operators,\
    \ assignment operators, logical operators, bitwise operators, comparison operators,\
    \ and membership operators.\n\nThe details for python operators are defined in\
    \ the following table:\n\n| Arithmetic operators | Assignment operators | Comparison\
    \ operators | Logical operators | Bitwise operators |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| Addition (`+`) | Equal (`=`) | Double equal (`==`) | Logical\
    \ or | Binary and (`&`) |\n| Subtraction (`-`) | Add and (`+=`) | Not equal to\
    \ (`<>`) | Logical and | Binary or (`|`) |\n| Multiplication (`*`) | Subtract\
    \ and (`-=`) | Greater than (`>`) | Logical not | Binary xor (`^`) |\n| Division\
    \ (`/`) | Multiply and (`*=`) | Less than (`<`) | | Binary left shift (`<<`) |\n\
    | | Division and/= | Less than equal to (`<=`) | | Binary right shift (`>>`) |\n\
    | Modulus (`%`) | Modulus and (`%=`) | | | Binary 1s complement (`~`) |\n| | Floor\
    \ division (`//`) | Greater than equal to (`>=`) | | |\n| | Floor division and\
    \ (`//=`) | | | |\n| Exponent (`**`) | | | | |\n\n## Data types\n\n### Data types\n\
    \nIn python programming language, every object has its own type and value.\n\n\
    Built-in data types for python:\n\n- **Numbers** include integers, floats, fractions,\
    \ and complex numbers as well. The predefined data types in python are `int`,\
    \ `float`, `long`, and `complex`.\n- **Sequences** are comprised of strings, bytes,\
    \ lists, and `tuple`.\n- **Boolean** holds either `true` or `false`.\n- **Dictionaries**\
    \ include key-paired values that are set in an unordered way.\n- **Sets** cover\
    \ unordered container of values.\n\n## Flow control\n\nControl flow statements\
    \ allow the programmers to change the flow of program and perform specific operations\
    \ as well. Same as the other high-level programming languages, the three major\
    \ control flow statements used in python are `if`, `for`, and `while`. The following\
    \ diagram shows how the control flow statements actually work in a program:\n\n\
    ### Conditional statements\n\n#### If statement\nThe `if` statement is a boolean\
    \ expression which shows the result in the form of either `true` or `false`.\n\
    \n#### If else statement\nThe `if else` statement is also a boolean expression\
    \ and it includes an optional `else` statement. if the expression shows up as\
    \ `false`, the `else` statement gets executed.\n\n#### Nested statements\nA statement\
    \ within a statement is known as nested statement.\n\n### Loops\n\nLoops are known\
    \ as a sequence of instructions that allow the programmer to perform specific\
    \ tasks by implementing certain conditions. In python programming, loops can be\
    \ used to execute several statements or a set of instructions by using the given\
    \ control structures.\n\n#### Types of loops in python\n\n##### While loop\n`while`\
    \ loop is used to repeat a statement or iteration ‘n’ number of times within the\
    \ program. Syntax for using while loop in python is:\n\n```\nwhile expression:\n\
    \    statement(s)\n```\n\nSample program:\n\n```python\n#!/usr/bin/python\n\n\
    count = 0\n\nwhile (count < 10):\n    print('the count is:', count)\n    count\
    \ = count + 2\n```\n\n![image_rsrc9FF.jpg](images/image_rsrc9FF.jpeg)\n\nOutput:\n\
    ![image_rsrc9FG.jpg](images/image_rsrc9FG.jpeg)\n\n##### For loop\nIn order to\
    \ iterate items of any sequence, including a string or list, we can use `for`\
    \ loop.\n\nSyntax:\n\n```\nfor iterating_var in sequence:\n    statement(s)\n\
    ```\n\nSample program:\n\n```python\nfruits = [\"apple,\", \"banana\", \"cherry\"\
    ]\n\nfor x in fruits:\n    print(x)\n```\n\nTo stop the loop before it has iterated\
    \ through all items, we can use the `break` statement where the `continue` statement\
    \ can be used to stop iteration of loop and continue with the next iteration.\n\
    \n## Functions and modules\n\n### What are functions?\n\nA function is a set of\
    \ reusable and organized code that is used to perform specific tasks and operations\
    \ within the program. although there are several built-in functions available\
    \ in python programming language, developers can also create their own functions\
    \ which are also known as user-defined functions. The syntax for defining a function\
    \ in python is described as follows:\n\n```\ndef functionname(parameters):\n \
    \   \"function_docstring\"\n    function_suite\n    return [expression]\n```\n\
    \nTo introduce a function definition, we can use the keyword `def` which is the\
    \ continuation of the function body. the variables that are assigned to a function\
    \ generally store the value in local table, which means global variables cannot\
    \ be assigned any value unless it is declared as global.\n\n### Calling functions\n\
    \nFunctions in programming language can be called by giving arguments, providing\
    \ an optional argument, or giving mandatory argument only. Functions maximize\
    \ reusability and make programs easier to understand. Following are the statements\
    \ used to define functions:\n\n- `def display(age): print('hi' + age)`\n- `def\
    \ print(): global x`\n- `for i in range(k): yield`\n- `def sum(a, b): return a+b`\n\
    - `def out(): local x='old'`\n- `def inline(name):`\n- `age=30` (Note: The source\
    \ text seems slightly fragmented/garbled here, but following the structure):\n\
    \n```python\ndef person(name):\n    print(\"hi\", + name)\n\nperson1 = {\n   \
    \ \"name\": \"james\",\n    \"age\": 30,\n    \"country\": \"sweden\"\n}\n```\n\
    \n### Modules\n\nModular programming is the approach to organize code into files.\
    \ There is a huge collection of standard libraries in python which provide many\
    \ tools.\n\nSyntax for importing in python:\n\n1. `import module`\n2. `from module`\n\
    \nTo use a new module, we can call it as:\n\n```\nimport newmodule.function\n\
    ```\n\n```python\ndef function(name):\n    print(\"hi\")\n```\n\n## Object-oriented\
    \ python\n\nIn object-oriented programming, we are required to define classes\
    \ and objects to perform various functions. Like other languages such as C++,\
    \ we can access and update classes using object-oriented techniques.\n\nTo create\
    \ a student class in python, the code is written as follows:\n\n```python\nclass\
    \ student:\n    def __init__(self, id, name):\n        self.r = id\n        self.n\
    \ = name\n        print(self.n)\n\n# ...\n\nstudent1 = student(1, \"james\")\n\
    student2 = student(2, \"william\")\n\nprint(\"data successfully stored in variables\"\
    )\n```\n\n### Inheritance\n\nInheritance is a useful feature of object-oriented\
    \ programming which allows developers to create a new class to inherit all of\
    \ the methods and properties of an existing class. We can define a new child class\
    \ or derived class with the properties of a parent class or base class using inheritance\
    \ techniques.\n\nThe syntax for implementing inheritance in python is:\n\n`class\
    \ derived_class2(base_class1):`\n\nTo use inheritance, we define it as follows:\n\
    \n```python\nclass base_class1:\n    # body of base class\n\nclass derived_class(base_class1):\n\
    \    # body of derived class\n```\n"
