    在 HTML、XML 等标记语言中，框架（frames）被用于在浏览器窗口中创建多个区域，以便每个区域都可以加载一个唯一的 HTML 文档。要在网页中使用框架，应该使用
    `<frameset>` 标签而不是 `<body>` 标签，后者可以使用特定的 `rows`（行）和 `cols`（列）属性进行定义。


    ### 创建框架的示例 HTML 标签：


    ```html

    <html>

    <head>

    <title>html frames</title>

    </head>

    <frameset rows="10%,80%,10%">

    <frame name="top" src="/html/top_frame.htm" />

    <frame name="main" src="/html/main_frame.htm" />

    <frame name="bottom" src="/html/bottom_frame.htm" />

    <noframes>

    <body>your browser does not support frames.</body>

    </noframes>

    </frameset>

    </html>

    ```


    ### Iframe


    为了创建一个嵌套的浏览上下文，可以使用 `<iframe>` 标签将新的 HTML 文档添加到现有的文档中。要创建一个 `<iframe>`，可以配合 `<<iframe>`
    标签实现以下语法：


    ```html

    <iframe src=https://www.website.com></iframe>

    ```


    ###  HTML 标签完整表格：


    `<<a>>`, `<abbr>`, `<acronym>`, `<address>`, `<appt>`, `<area>`, `<article>`,
    `<aside>`, `<audio>`, `<b>`, `<base>`, `<basefont>`, `<bdi>`, `<bdo>`, `<big>`,
    `<blockquote>`, `<body>`, `<br>`, `<button>`, `<canvas>`, `<caption>`, `<center>`,
    `<cite>`, `<code>`, `<col>`, `<colgroup>`, `<data>`, `<datalist>`, `<dd>`, `<del>`,
    `<details>`, `<dfn>`, `<dialog>`, `<dir>`, `<div>`, `<dl>`, `<dt>`, `<em>`, `<embed>`,
    `<fieldset>`, `<figcaption>`, `<figure>`, `<font>`, `<footer>`, `<form>`, `<frame>`,
    `<frameset>`, `<h1>`-`<h6>`, `<head>`, `<header>`, `<hr>`, `<html>`, `<i>`, `<iframe>`,
