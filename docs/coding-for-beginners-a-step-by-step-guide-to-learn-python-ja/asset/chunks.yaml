    终端用户数据库是一个共享数据库，专门为终端用户设计和创建。由于它具有整个数据库的摘要，因此终端用户完全不需要担心在任何数据库级别正在执行的操作。


    # 数据库语法、数据类型和操作符


    标准查询语言（`sql`）用于在数据库中进行存储、操作和检索数据。`sql` 允许数据库管理员执行管理数据库所需的多种操作。该语言允许你通过编写简单的查询来执行查询、检索数据、插入记录、更新记录、删除记录、创建新数据库、创建新表以及在数据库中设置权限。


    `sql` 有多个版本，它们都支持 `select`、`delete`、`insert`、`where` 和 `update` 等主要功能。


    # 结构化查询语言 (sql)


    `Sql` 是用于 `mysql`、`sybase`、`oracle` 和 `sql server` 等关系数据库系统的语言。作为一种标准的数据库语言，`sql`
    允许用户描述数据、访问数据并操作关系数据库管理系统。此外，用户还可以结构化查询语言创建、查看和删除数据库。


    在此过程中包含的不同组件有优化引擎、`sql` 查询引擎、经典查询引擎和查询调度器。为了在关系数据库管理系统中执行特定操作，我们可以使用下面的命令：


    | 命令 | 描述 |

    | :--- | :--- |

    | `Create` | 用户可以创建一个新表，或数据库中的一个对象。 |

    | `Read` | 用户可以读取存储在表中的数据。 |

    | `Update` | 更新表以修改记录。 |

    | `Delete` | 删除表中的任何记录。 |

    | `Insert` | 向表中插入新记录。 |

    | `Select` | 从数据库中的表中选择特定记录。 |

    | `Alter` | 对数据库对象进行更改。 |

    | `Drop` | 从数据库中删除整个表。 |


    通过使用上述操作，我们可以对下方名为“students”的示例表执行不同的操作：


    | 学生 ID | 学生姓名 | 城市 | 学科 | 分数 | 百分比 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | William | 纽约 | 数学 | 85 | 60% |

    | 2 | James | 加州 | 英语 | 79 | 58% |


    从上表获取记录的 `sql` 语句具有以下语法：


    ```

    select * from students;

    ```


    ## 1. sql 查询


    为了对数据库中的表执行特定操作，我们需要使用不同的查询，具体说明如下所示：


    | 查询 | 语法 |

    | :--- | :--- |

    | `Insert into` | `insert into table_name,(column1, column2,...)` <br>`Values
    (value,1, value,2,...)` |

    | `Update` | `update table_name, set column1 = value,1, column2 = value,2..` <br>`where,
    condition` |

    | `Delete` | `delete from table_name, where, condition;` |

    | `Order by` | `select column1, ..from table_name,` <br>`order by column1, asc/desc;`
    |

    | `Min()` | `select min(column_name,)` <br>`from table_name,` <br>`where, condition;`
    |

    | `Max()` | `select max(column_name,)` <br>`from table_name,` <br>`where, condition;`
    |

    | `Where` | `select column1..` <br>`from table_name,` <br>`where, condition;`
    |


    ## Sql 连接


    以带有表 a 和表 b 的关系数据库为例，表也可以通过 `sql` 连接查询进行连接。图表清楚地显示了两个表是如何连接以共享数据的：我们将在示例表“patients”上实现各种子句操作：


    表 1：

    | patientid | caseno | Date |

    | :--- | :--- | :--- |

    | 4321 | 1-9-2011 |

    | 8257 | 3-12-2015 |


    表 2：

    | caseno | patientname | City |

    | :--- | :--- | :--- |

    | 1 | Andre | 加加哥 |

    | 3 | John | 矶 |


    要连接这两个表，我们可以如下编写 `sql` 连接语句：


    ```

    select patientid, caseno, date. From patients inner join patients on caseno =
    patientname.

    ```


    有四种不同类型的 `sql` 连接，被称为：

    * `inner join`

    * `left outer join`

    * `right outer join`

    * `full outer join`


    `inner join` 选择满足连接 }的表 a 和表 b 中的整条记录。创建 `inner join` 的语法如下：


    ```

    select name, From table1 inner join table2 On table1.column_name = table2.column_name;

    ```


    `left join` 选择表 a 中的所有记录，并结合满足连接条件的表 b 中的记录。创建 `left join` 的语法如下：


    ```

    select name, From table1 left join table2 On table1.column_name = table2.column_name;

    ```


    `right join` 选择表 b 中的所有记录，并结合满足连接条件的表 a 中的记录。创建 `right join` 的语法如下：


    ```

    select name, From table1 right join table2 On table1.column_name = table2.column_name;

    ```


    `full outer join` 即使连接条件不满足，也会选择表 a 和表 b 中的所有记录。创建 `full join` 的语法如下：


    ```

    select name, From table1 full outer join table2 On table1.column_name = table2.column_name,
    where, condition;

    ```


    ## Union 运算符


    为了合并两个或多个 select 语句的结果，使用了 `union` 运算符，每个列必须具有相似的数据类型。此外，select 语句中的列在两个表中顺序应该是相同的。在
    `sql` 中实现 `union` 运算符的语法如下：


    ```

    select column_name, from table1

    union

    select column name, from table2;

    ```


    ## Group by


    `sql` group by 语句可以从数据库表中执行列表或编号。在 `sql` 中使用 `group by` 语句的语法如下：


    ```

    select column_name, From table_name, where, condition group by column_name, order
    by column_name;

    ```


    ## Order by


    `sql` 中的 `order by` 语句用于升序或降序排序数据。实现 `order by` 子句的语法如下：


    ```

    select column_list From table_name, where, condition [ order by column1, column2,]
    [ asc | desc ];

    ```


    # 高级 sql


    还有其他关键操作和子句可以在数据库内执行复杂操作。这里详细说明了高级 sql 的一些功能：


    ### 索引


    `Sql` 索引被数据库搜索引擎用于优化数据处理过程。由于它们是特殊的查找表，索引有助于加速 where 子句和 select 查询。创建索引，我们可以使用
    `create index` 语句结合唯一约束来防止重复输入。


    使用 `create index` 的语法：


    ```

    create index index_name, on table_name,

    ```


    使用 `drop index` 的语法：


    ```

    drop index index_name;

    ```


    ### Truncate table


    `truncate table` 命令在 `sql` 用于删除现有表中的完整数据。基本语法：


    ```

    truncate table, table_name;

    ```


    # Sql 主键和外键


    ### 主键


    `sql` 中的 `primary key` 约束用于唯一标识表中的每条记录。主键始终包含唯一值且不包含任何空值。此外，一个表只能有一个唯一的主键，该主键可以由单列或多列组成。


