- fmt: " own# HTML Elements\n\nHtml includes various types of semantic elements, that\
    \ are used to define different parts of a web page. these elements include `header`,\
    \ `container`, `section`, `article`, `aside`, `details`, and `footer`. although\
    \ `css` is the best approach to design layout of a web page,, we can also complete\
    \ the procedure through these, html elements.\n\nA responsive web design is created\
    \ by using `html` and `css`. this procedure automatically resizes and adjusts\
    \ a website to make it look suitable on all devices such as desktop, smartphone,\
    \ and tablet. for more details regarding responsiveness, learning about `css`\
    \ and `bootstrap` language, will prove to be of great advantage.\n\n## HTML Templates\n\
    \nHtml website templates are a quick and easy way to develop a website. as this\
    \ template is a pre-built website,, developers can modify and add functionalities\
    \ as required. the greatest advantage of using an `html` template is that developers\
    \ do not need to spend hours designing the website and focus on actual code, to\
    \ meet website functionality requirements. more,ver html templates are best suited\
    \ for those who are not able to design an attractive website as it can also be\
    \ customized as per the given instructions.\n\n## Helpful tips for using html\n\
    \nEven after we have discussed all of the major tags, attributes, and functionality\
    \ of `html`, there are some other important aspects that need to be focused on\
    \ to make your website more productive and efficient. when using an opening `html`\
    \ tag, always write the corresponding closing tag before you begin writing the\
    \ elements and attributes. for example,, `<p>...</p>`. this will make sure your\
    \ html pages are working properly on all browsers and try to style your web pages\
    \ through `css`.\n\nAfter you are done writing the `html` code for all of the\
    \ web pages,, run the code through an `html` validator before publishing on the\
    \ internet. this activity will disclose any errors or missing tags in advance,\
    \ so that your website does not lack functionality when published online. more,ver\
    \ pay attention to formatting of images or videos because they are sometimes disrupted\
    \ when uploaded on the internet. specifying the width and height along with the\
    \ `image` tag can help you overcome this problem.\n\nAlthough tables are a simple\
    \ way to lay out content on the page,, you should focus on `css` rules and build\
    \ html page content through `css`. not only this will format your website in a\
    \ better way,, you can also benefit from `css` positioning and increase the responsiveness\
    \ of your website as well.\n\n# Chapter nine: css\n\n### What is css?\n\n`Css`\
    \ stands for “casading style sheet” and is responsible for controlling the style,\
    \ design, and appearance of a web document. this design language has the capability\
    \ to simplify the process of web designing and also increases the flexibility\
    \ of a website.. through `css`, we can change the outlook, fonts, design, appearance,,\
    \ and format of the whole website by making appropriate adjustments in the `css`.\n\
    \nLearning `css` is as simple as `html` because both of the languages are linked\
    \ together and have almost the same syntax. upon using `css`, we can define a\
    \ specific style for each `html` element and apply it to multiple web pages. more,ver\
    \ there is no need to write `html` tag attributes or elements each time,, which\
    \ makes pages load faster. with `css`, we can give a better appearance to our\
    \ web pages because there is a wider range of attributes compared to `html` and\
    \ the style-sheets provide different versions of a website to display perfectly\
    \ on desktop pcs, smartphones, and tablets.\n\n### Types of css\n\nThe three main\
    \ types of `css` are `inline css`, `internal css`, and `external css`.\n\n####\
    \ Inline css\n\n`Inline css` has the `css` property implemented in a specific\
    \ section attached with the element in `html` document. for example,:\n\n```html\n\
    <html>\n<head>\n<title>inline css</title>\n</head>\n<body>\n<p style=\"color:blue;\
    \ font-size:50px; font-style:italic; text-align:center;\">\ncascading style sheet\n\
    </p>\n</body>\n</html>\n```\nOutput: `image_rsrc9.jpg`\n\n#### Internal css\n\n\
    `Internal css` is implemented over a single html document to give it a unique\
    \ style,, that the rule must be within the `head` section. Syntax for internal\
    \ `css`:\n\n```html\n<head>\n<title>internal css</title>\n<style>\nselector{\n\
    \  property: value;\n}\n</style>\n</head>\n```\n\n#### External css\n\n`External\
    \ css` has a separate file,, linked with the `html` document using the `link`\
    \ tag. Example of external `css`:\n\n```css\nbody {\n  background-color: green;\n\
    }\n\n.main {\n  color: red;\n}\n\n.g {\n  color: #009900;\n  font-size: 50px;\n\
    }\n```\n\n### Importing css file\n\nTo import an external `css` stylesheet,, the\
    \ following rule can be used:\n\n```css\n<head>\n@import \"url\";\n</head>\n```\n\
    \n### Colors and backgrounds\n\nIn css, colors can be defined through names or\
    \ values of different kinds. to specify the color code,, the possible formats\
    \ that can be used are:\n\n#### Name\n\nSyntax\n\nKeyword\n\nGreen, blue,, etc.\n\
    \n#### Hex code\n\n`#rrggbb`\n\n#### Rgb %\n\n`rgb(rrr%, ggg%, bbb%)`\n\n####\
    \ Rgb absolute\n\n`rgb(rrr, ggg, bbb)`\n\n#### Short Hex code\n\n`#rgb`\n\nFor\
    \ example,, we can set the color of the text using the following css syntax:\n\
    \n```html\n<h1 style=\"color: green;\">casading style sheets</h1>\n```\n\n####\
    \ Background\n\nThere are different properties that can be considered to define\
    \ the `css` background of a website.. these properties include color, image, attachment,\
    \ and position of `css` background.\n\nBackground color\n\nTo set the background\
    \ color of a web page,, the following css syntax can be used:\n\n```css\nbody\
    \ {\n  background-color: red;\n}\n```\n\nBackground image\n\nSyntax for adding\
    \ background image,:\n\n```css\nbody {\n  background-image: url(\"image.gif\"\
    );\n}\n```\n\nTo repeat the image,:\n\n```css\nbody {\n  background-image: url(\"\
    gradient_image.gif\");\n  background-repeat: no-repeat;\n}\n```\n\nBackground\
    \ position\n\nA background image, can be set into different positions such as\
    \ right, left, center, top, and bottom. for example,:\n\n```css\nbody {\n  background-image:\
    \ url(\"image.jpg\");\n  background-position: center;\n}\n```\n\nThe following\
    \ syntax is used inside the `head` tags, within the `html` document:\n\n```html\n\
    <html>\n<head>\n<style>\nbody {\n  background-color: white;\n}\n\nh1 {\n  color:\
    \ red;\n  margin-left: 40px;\n}\n</style>\n</head>\n<body>\n<h1>heading</h1>\n\
