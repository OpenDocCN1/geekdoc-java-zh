  trans: "\n\n通过多种方式执行单个任务的技术被称为多态。在`java programming`中，我们可以使用`method overriding`（方法重写）和`method\
    \ overloading`（方法重载）技术来实现多态。需要重要的是，对象可以通过引用变量进行访问，一旦它被重新赋值给其他对象，可以使用引用变量的类型来确定用于访问对象的方法。\n\
    \n例如：\n\n```java\npublic interface school{}\n\npublic class student{}\n\npublic\
    \ class john extends student implements school{}\n```\n\n在上述情况下，`john` 被认为是多态的，因为它具有多继承性，并且我们也可以对同一个对象应用引用变量。\n\
    \n# 抽象\n\n抽象类是指在其声明中包含 `abstract` 关键字的类，它可能包含或不包含抽象方法。在类具有抽象方法的情况下，它无法被实例化，程序员必须从另一个类继承它来实现该抽象方法。\n\
    \n# 封装\n\n`java programming`中的封装是将数据和方法封装在一起的过程。通常情况下，一个类的变量对另一个类是隐藏的，它只能通过当前类中使用的方法进行访问。封装的优点是，类可以被制为只读或只写，并且还可以对存储的数据具有完全的控制权。\n\
    \n# 递归\n\n递归是指一种在程序内部调用自身的方法的技术。`recurse()`方法从`main`方法被调用，也可以从同一个`recurse()`方法被调用。这个过程一直持续，直到满足给定条件；如果不满足条件，就会发生无限递归。\n\
    \n以下是 java 中递归的一个简单实现：\n\n```\nClass sample {\n    static void printfun(int test)\
    \ {\n        if (test < 1)\n            return;\n        else {\n            system.out.printf(\"\
    %d \", test);\n            // state 2\n            printfun(test - 1);\n     \
    \       system.out.printf(\"%d \", test);\n            return;\n        }\n  \
    \  }\n\n    public static void main(string [] args) {\n        int test = 3;\n\
    \        printfun(test);\n    }\n}\n```\n\n## 递归的优势\n\n在某些复杂的程序中，编写递归代码可以带来若干好处。因为它提供了一种简单且简洁的代码编写方式，开发者可以毫无麻烦地执行各种类型的操作。\n\
    \n# 抽象类和抽象方法\n\n### 抽象类\n\n在 java 编程中，抽象类是一种无法初始化且使用`abstract`关键字声明的类。\n\n以下是在\
    \ java 中声明抽象类`student`的语法：\n\n```java\nAbstract class student {\n    // methods\
    \ and attributes\n}\n```\n\n记住，我们不能创建抽象类的对象。这样做将产生编译错误。\n\n### 抽象类的继承\n\n以下是一个说明抽象类继承的示例\
    \ java 程序：\n\n```\nAbstract class student {\n    public void displayinfo() {\n\
    \        system.out.println(\"i am a student\");\n    }\n}\n\nClass grade extends\
    \ student {\n}\n\nClass main {\n    public static void main(string [] args) {\n\
    \        grade g1 = new grade();\n        g1.displayinfo();\n    }\n}\n```\n\n\
    ### 抽象方法\n\n在 java 中创建抽象方法使用相同的关键字 `abstract`。语法定义如下：\n\n```java\nAbstract void\
    \ move();\n```\n\n# 第三章：sql 和数据库\n\n## 什么是数据库？\n\n数据库是一个可以被访问、管理和更新的数据集合。在对数据库进行简要讨论之前，重要的是理解数据的含义以及它是如何被处理的。数据通常定义为记录和事实的集合，我们可以借此进行计算和推理。为了保护、保存、交付和组织数据，创建了数据库，而管理这一过程的系统被称为数据库管理系统（`db`）。\n\
    \n## 数据库管理系统 (db) 概念\n\n数据库管理系统由多个程序组成，允许用户通过不同的过程访问数据库并处理数据。由于它通常设计用于控制对数据库的访问，db\
    \ 中引入了各种操作和功能。db 有不同的类型：\n\n1. **关系型**：这类 db 以表格的形式的关系。\n2. **对象关系型**：对象关系允许数据以对象及其属性的形式存储。\n\
    3. **网络型**：网络 db 具有多对多的关系，通常用于复杂的数据库结构。\n4. **层级型**：层级 db 遵循父子关系来存储数据，其结构类似于树，节点代表各种字段。\n\
    \n## 数据库环境和架构\n\n数据库环境被称为一组组件，负责数据的处理、管理和使用。由于数据库通常存储在计算机中，因此用于管理该过程的硬件和计算机外围还包括如\
    \ sql server 之类的 db 工具。\n\n数据库或 db 的架构通常分为三大类：集中式、去中心化和层次级。数据库系统可以是客户端-服务器或集中式的，也可以设计为供并行计算机架构访问。db\
    \ 的三层架构定义如下：\n\n* 表现层\n* 应用层\n* 数据库层\n\n# 数据库的类型\n\n根据组织方法和功能，有不同类型的数据库。\n\n###\
    \ 关系型数据库\n\n关系型数据库数据是以多种方式定义、组织和访问的。作为一种表格型数据库，表由行和列组成，通过查询语言（`sql`）进行管理。\n\n\
    ### 分布式数据库\n\n分布式数据库的数据存储在多个站点，这些站点通过通信链路相互连接。这种数据库进一步划分为同构和异构两类。对于同构分布式数据库系统，相同类型的硬件、操作系统和数据库应用程序连接在一起；而对于异构分布式数据库系统，每个位置和连接系统可以是不同的。\n\
    \n"
