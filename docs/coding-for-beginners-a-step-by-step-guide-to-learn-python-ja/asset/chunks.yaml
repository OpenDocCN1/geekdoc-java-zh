    在函数中，返回类型被称为函数本身返回的函数值的数据类型，而函数的动作名称被称为函数名。每当函数被调用时，我们需要传递一个参数，其值被称为实参（argument）或实际参数（actual
    parameter）。需要注意的是，参数不是强制性的，函数也可以在不带任何参数的情况下执行。


    函数体包含多个语句，并通常定义了在函数内部要执行的操作。要在 C 语言中声明一个 `min()` 函数，可以使用以下语法：


    ```

    Int min(int num1, int num2);

    ```


    在程序中调用函数，我们需要传递参数和函数名。如果函数返回了任何值，也可以将其存储起来。


    #### 向函数传递参数的方法


    #### 传值调用（Call by value）

    传值方法用于将实际值从参数复制到函数的形参数中。对参数所做的更改对函数内部的实参数没有直接影响。


    #### 引用调用（Call by reference）

    引用调用方法用于将参数的地址复制到形参数中。在参数上进行的更改会直接影响实参数。


    ### 数组、字符串和链表


    #### 数组

    数组是元素的集合，可以存储相同类型的固定大小顺序数据。数组由连续的内存位置组成，可以通过以下语法声明：


    `Type arrayname, [arraysize];`


    示例：

    3

    5

    6

    8

    10

    20


    所有数组的第一个元素的索引均为 0，也称为基索引（base index）。注意，数组的大小在声明后不能更改。在 C 语言中初始化数组，可以使用以下语句：


    ```

    Int data[50];

    ```


    要初始化数组，可以使用下述语法：


    ```

    Int data[10] = {3, 2, 7, 8, 23, 42, 64, 73, 23, 77};

    ```


    在这个数组中，索引 = 0 的值为 3，而索引 9 的值为 77。


    下面是一个使用 C 语言编程中的数组求 5 个整数平均值的示例：


    ```c

    #include <stdio.h>


    Int main ()

    {

    int avg = 0 ;

    int sum =0 ;

    int x =0 ;

    int num[ 4 ];

    for (x =0 ; x <5 ;x++ )

    {

    printf("enter number %d \n ", (x +1));

    scanf("%d", & num[x]);

    }

    for (x =0 ; x <5 ;x++ )

    {

    sum = sum + num[x];

    }

    avg = sum /5 ;

    printf("average of entered number is: %d", avg);

    return 0 ;

    }

    ```


    #### 2d 和 3d 数组

    C 编程语言也支持二维和三维多维数组。为了初始化二维数组，我们使用以下语法：


    ```

    Int z[2][3] = {

    {0, 1,}

    {2, 3, 4}

    {5,6,9}

    };

    ```


    或者


    ```

    Int z[2][3] = {0, 1, 2, 3 , 4, 5, 6, 9};

    ```


    #### 字符串

    在 C 编程中，字符串是通过使用一维字符数组创建的。字符串必须以空字符终止，也称为 `\0`。


    在 C 语言中声明字符串，可以遵循下述语法：


    `Char str_name,[size];`


    `‘str_name’` 用于定义字符串，而尺寸告诉我们字符串的长度。


    下面的 C 程序用于声明、读取和打印一个字符串：


    ```c

    #include<stdio.h>


    Int main ()

    {

    // declaring string

    char str[ 10 ];

    // reading string

    scanf("%s",str);

    // print string

    printf("%s",str);

    return 0 ;

    }

    ```


    ### 指针和结构体

    指针是一个变量，其值与程序中另一个变量的地址相同。由于它直接指向内存位置地址，我们可以预先声明指针并将其存储在任何变量地址处。声明指针变量的语法如下：


    `Type *name;`


    要使用指针，首先我们需要定义指针变量并将变量的地址赋值给指针。接下来，我们可以从指针变量给出的地址访问值。整个操作都是通过 `*` 运算符完成的，该运算符返回所定义的变量地址的值。必须注意的是，普通变量存储值，而指针存储变量地址。任何指针的值都是
    2 字节。下面是一个用 C 语言指针编写的的示例程序：


    ```c

    #include <stdio.h>

    Int main ()

    {

    int *ptr, q;

    q =100 ;

    ptr= &q;

    printf("%d", *ptr);

    return 0 ;

    }

    ```


    #### 结构体

    结构体被定义为变量集合，允许程序员组合不同的数据类型。结构体可以类比为数组，但数组只能持有相似类型的数据。以一个组织为例，我们可以使用结构体来管理员工记录如下：


    * `Name`（姓名）

    * `Employee id`（员工 ID）

    * `Designation`（职位）

    * `Region`（地区）


    在 C 语言中定义结构体的语句如下：


    ```c

    Struct employee {

    char name[10];

    int employee_id;

    char designation[50];

    char department[50];

    char region[100];

    };

    ```


    在编译时初始化结构体可以使用：


    ```

    Struct

    ```


    要访问结构体，我们需要使用成员运算符。为了在 C 语言中访问结构体的成员，可以使用以下类型的运算符：


    * 成员运算符 `.`

    * 结构体指针 `->`


    访问结构体的示例程序：


    ```c

    #include <stdio.h>

    Struct distance {

    int feet;

    float inch;

    } dist1, dist2, sum;


    Int main ()

    {

    printf("1st distance \n");

    printf("enter feet: ");

    scanf("%d", &dist1.feet);

    printf("enter inch: ");

    scanf("%f", &dist1.inch);

    printf("2nd distance \n");

    printf("enter feet: ");

    scanf("%d", &dist2.feet);

    printf("enter inch: ");

    scanf("%f", &dist2.inch);

    sum.feet = dist1.feet + dist2.feet;

    sum.inch = dist1.inch + dist2.inch;

    while (sum.inch >= 12 )

    {

    ++sum.feet;

    sum.inch = sum.inch - 12;

    }

    printf("sum of distances = %d -%.1f", sum.feet, sum.inch);

    return 0 ;

    }

    ```


    输出：

    ![image_rsrc9F9.jpg](img/image_rsrc9F9.jpeg)


    #### 向结构体传递指针

    我们也可以在 C 编程语言中定义结构体指针，其方法与定义指向另一个变量指针相同。通过指针访问结构体的成员，可以考虑以下语法：


    `Struct_pointer->title;`


    ### C 编程文件

    编程要求开发者使用最有效的方法来处理不同的需求和场景。在 C 语言中执行文件处理操作，可以使用以下操作：


    * `fprintf(f)`

    * `fscanf()`

    * `fread()`

    * `fwrite()`

    * `fseek()`


    通常，当程序终止时所有数据都会丢失，因此我们需要创建一个包含所有数据的特定文件。它还节省了时间，并允许程序员通过输入少量命令并使用 C 语言运算符在计算机之间传输数据来从文件中访问数据。

