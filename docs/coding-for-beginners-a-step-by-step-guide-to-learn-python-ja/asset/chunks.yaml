  trans: "\n\nCss `border-style` 属性可以设置 html 文档中元素边框的样式、颜色和宽度。使用 css 创建边框的不同样式包括：点线（dotted）、实线（solid）、虚线（dashed）、凹槽（groove）、双线（double）、内凹（inset）、外凸（outset）、隐藏（hidden）、脊线（ridge）和无（none）。\n\
    \n创建不同边框的语法：\n\n```css\nP.dotted {border-style: dotted;}\nP.solid {border-style:\
    \ solid;}\nP.dashed {border-style: dashed;}\nP.groove {border-style: groove;}\n\
    P.double {border-style: double;}\nP.inset {border-style: inset;}\nP.outline {border-style:\
    \ outset;}\nP.hidden {border-style: hidden;}\nP.ridge {border-style: ridge;}\n\
    P.none {border-style: none;}\n```\n\n# 高度和宽\n\n在 css 中，`height` 和 `width` 属性可以设置元素的高度和宽度。在\
    \ css 中实现高度和宽度属性的语法定义如下：\n\n```css\nDiv {\n  Height: 200px;\n  Width: 50%;\n \
    \ Background-color: green;\n}\n```\n\n# 外边距和内边距\n\n## 外边距 Margin\n\n在 css 中，`margin`\
    \ 属性用于实现创建元素周围的空间。我们可以为每一侧设置不同的外边距大小。`margin` 属性有不同的值，如长度、宽度和外边距，由浏览器计算。\n\n语法：\n\
    \n```css\nBody {\n  margin: size;\n}\n```\n\n## 内边距 Padding\n\nCss `padding` 可以定义边框或在元素周围创建空间。在\
    \ html 网站上设置 css 内边距有多种方法，针对顶、右、底、左等单独边。`padding` 具有长度和宽度值，可以通过以下 css 语法实现：\n\n\
    ```css\nBody {\n  Padding: size;\n}\n```\n\n# 字体和文本\n\n## 字体\n\ncss 中的 `font`\
    \ 属性用于指定其他字体属性并设置内容的字体。css 中不同的字体属性包括字体样式、字体族、字体权重、字体变体和字体大小。\n\n以下是每个字体属性的简单\
    \ css 语法：\n\n### 字体样式\n在线演示\n\n```html\n<html>\n  <head>\n</head>\n  <body>\n\
    \    <p style=\"font-style:calibri;\">\n      这段文字将以 calibri 样式渲染，\n    </p>\n\
    \  </body>\n</html>\n```\n\n### 字体族\n```html\n<p style=\"font-family: georgia,\
    \ calibri, serif;\"></p>\n```\n\n### 字体变体\n```html\n<p style=\"font-variant: small-caps;\"\
    ></p>\n```\n\n### 字体权重\n```html\n<p style=\"font-weight:500;\"></p>\n```\n\n###\
    \ 字体大小\n```html\n<p style=\"font-size:20px;\">字体大小 20 像素</p>\n<p style=\"font-size:small;\"\
    >小字体</p>\n<p style=\"font-size:large;\">大字体</p>\n```\n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\
    \n## 文本\n\n通过 css `text` 属性，现在可以将文本转换为不同的颜色、样式和缩进。这些文本属性包括：\n\n*   `text color`：更改文本颜色。\n\
    *   `text-alignment`：指定文本的水平或垂直对齐。\n*   `text-decoration`：设置文本装饰。\n*   `text transformation`：控制文本的大小写。\n\
    *   `text indentation`：指定首行的缩进。\n*   `letter-spacing`：增加或减少字母间的间距。\n*   `line-height`：指定行高。\n\
    *   `text-direction`：设置书方向。\n*   `word spacing`：设置单词间距。\n*   `text shadow`：为文本添加阴影效果。\n\
    \ncss 文本属性的语法：\n\n### 文本颜色\n```css\nBody {\n  color: red;\n}\n```\n\n### 文本对齐\n\
    ```css\nH1 {\n  text-align: center;\n}\nH2 {\n  text-align: left;\n}\nH3 {\n \
    \ text-align: right;\n}\n```\n\n### 文本装饰\n```css\nH1 {\n  text-decoration: over/underline/line-through;\n\
    }\n```\n\n### 文本转换\n```css\nP.uppercase {\n  text-transform: uppercase;\n}\nP.lowercase\
    \ {\n  text-transform: lowercase;\n}\nP.capitalize {\n  text-transform: capitalize;\n\
    }\n```\n\n### 文本缩进\n```css\nP {\n  text-indent: 100px;\n}\n```\n\n### 字母间距\n```css\n\
    H1 {\n  letter-spacing: 3px;\n}\nH2 {\n  letter-spacing: -3px;\n}\n```\n\n###\
    \ 行高\n```css\nP.small {\n  line-height: 0.6;\n}\nP.big {\n  line-height: 1.6;\n\
    }\n```\n\n### 文本方向\n```css\nP {\n  direction: rtl;\n}\n```\n\n### 文本阴影\n```css\n\
    H1 {\n  text-shadow: 4px 3px green;\n}\n```\n\n### 单词间距\n```css\nH1 {\n  word-spacing:\
    \ 10px;\n}\nH2 {\n  word-spacing: -5px;\n}\n```\n\n# 表格和边距\n\n有不同的 css 属性可以通过\
    \ css 实现表格。这些属性包括：用于设计 html 表格的 `border collapse`（边框合并）、`border spacing`（边框间距）、`Caption\
    \ side`（标题位置）、`empty cells`（空单元格）。\n\n## 表格布局\n\n使用 css 创建简单表格的语法：\n\n```html\n\
    <<html>\n  <head>\n<style type=\"text/css\">\n  table.one {\n    border-collapse:\
    \ collapse;\n  }\n  table.two {\n    border-collapse: separate;\n  }\n  td.a {\n\
    \    border-style: dotted;\n    border-width: 3px;\n    border-color: #000000;\n\
    \    padding: 10px;\n  }\n  td.b {\n    border-style: solid;\n    border-width:\
    \ 3px;\n    border-color: #33333;\n    padding: 10px;\n  }\n</style>\n  </head>\n\
    \  <body>\n    <table class=\"one\" border=\"1\">\n      <tr>\n        <th>first\
    \ name</th>\n        <th>last name</th>\n        <th>marks</th>\n      </tr>\n\
    \      <tr>\n        <td>john</td>\n        <td>harry</td>\n        <td>40</td>\n\
    \      </tr>\n    </table>\n    <br/>\n    <table class=\"two\" border=\"1\">\n\
    \      <caption>separate table with border spacing</caption>\n      <tr>\n   \
    \     <td>a</td>\n        <td>b</td>\n      </tr>\n    </table>\n  </body>\n</html>\n\
    ```\n输出 ![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\n### 标题位置的语法：\n```css\n\
    <head>\n<style type=\"text/css\">\n  caption.top {caption-side: top}\n  caption.bottom\
    \ {caption-side: bottom}\n  caption.left {caption-side: left}\n  caption.right\
    \ {caption-side: right}\n</style>\n</head>\n```\n\n### 空单元格属性的语法：\n```css\n<head>\n\
    <style type=\"text/css\">\n  table.empty {\n    width: 350px;\n    border-collapse:\
    \ separate;\n    empty-cells: hide;\n  }\n  td.empty {\n    padding: 5px;\n  \
    \  border-style: solid;\n    border-width: 1px;\n    border-color: #999999;\n\
    \  }\n</style>\n</head>\n```\n\n### 边框间距\n```html\n<html>\n  <head>\n<style type=\"\
    text/css\">\n  table.one {\n    border-collapse: separate;\n    width: 400px;\n\
    \    border-spacing: 10px;\n  }\n  table.two {\n    border-collapse: separate;\n\
    \    width: 400px;\n    border-spacing: 10px 50px;\n  }\n</style>\n  </head>\n\
    \  <body>\n    <table class=\"one\" border=\"1\">\n      <tr>\n        <td>a</td>\n\
    \        <td>b</td>\n      </tr>\n    </table>\n    <table class=\"two\" border=\"\
    1\">\n      <tr>\n        <td>a</td>\n        <td>b</td>\n      </tr>\n    </table>\n\
    \  </body>\n</html>\n```\n"
- fmt: "\nThere are two types of lists used in css known as ordered lists and unordered\
    \ lists. In ordered lists, all of the list items are marked with serial numbers\
    \ or alphabets whereas as in unordered lists, the list items are generally marked\
    \ with bullets. The list value can be created by using values such as `circle`,\
    \ `decimal`, `lower-roman`, `upper-roman`, `decimal-leading-zeros`, `lower-alpha`,\
    \ `upper-alpha`, and `square`.\n\nFor example:\n\n```html\n<html>\n<head>\n<style>\n\
    ul.a {\n  list-style-type:square;\n}\nol.c {\n  list-style-type:lower-alpha;\n\
    }\n</style>\n</head>\n<body>\n  <h2>Css ordered & unordered lists</h2>\n  <p>unordered\
    \ lists</p>\n  <ul class=\"a\">\n    <li>one,</li>\n    <li>two</li>\n    <li>three,</li>\n\
    \  </ul>\n  <ul class=\"b\">\n    <li>one,</li>\n    <li>two</li>\n    <li>three,</li>\n\
    \  </ul>\n  <p>ordered lists</p>\n  <ol class=\"c\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ol>\n  <ol class=\"d\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ol>\n</body>\n</html>\n```\n\nOutput:\nCss ordered &\
    \ unordered lists\nUnordered lists\n● one,\n● two\n● three,\n● one,\n● two\n●\
    \ three,\nOrdered lists\nA. one,\nB. two\nC. three,\n1. one,\n2. two\n3. three,\n\
    \n### Icons\nBy using the icon library from html, we can add different types of\
    \ icons through css as well. these types of icons include font awesome icons,\
    \ bootstrap icons, and google icons.\n\nFont awesome icons syntax:\n```html\n\
    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n```\n\nBootstrap icons syntax:\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    >\n```\n\nGoogle icons syntax:\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
    >\n```\n\nExample:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
    \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n</head>\n<body>\n  <h1>css icons</h1>\n  <i class=\"fa fa-cloud\" style=\"\
    font-size:32px;\"></i>\n  <i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n\
    \  <i class=\"fa fa-file\" style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-car\"\
    \ style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-bars\" style=\"font-size:32px;\"\
    ></i>\n</body>\n</html>\n```\n![image_rsrc9FY.jpg](images/image_rsrc9FY.jpeg)\n\
    \n### Dropdowns\nWe can also create dropdown menus through css. being the same\
    \ as html elements, a drop down consists of an unordered list and nested lists.\
    \ Lists are used to create the drop-down structure., for example:\n\n```html\n\
    <html>\n<head>\n<title>dropdown css</title>\n</head>\n<body>\n  <nav>\n    <ul>\n\
    \      <li class=\"level-1\">\n        <a href=\"#\">list\n          <ul>\n  \
    \          <li><a href=\"#\">page 1</a></li>\n            <li><a href=\"#\">page\
    \ 2</a></li>\n            <li><a href=\"#\">page 3</a></li>\n            <li><a\
    \ href=\"#\">page 4</a></li>\n          </ul>\n        </a>\n      </li>\n   \
    \ </ul>\n  </nav>\n</body>\n</html>\n```\nOutput:\n![image_rsrc9FZ.jpg](images/image_rsrc9FZ.jpeg)\n\
    \n### Layers and visibility\nThrough css, we can create multiple layers of divisions\
    \ by implementing the `z-index` css property. for example:\n\n```html\n<html>\n\
    <head></head>\n<body>\n  <div style=\"background-color:blue; width:300px; height:100px;\
    \ position:relative; top:10px; left:80px; z-index:2\"></div>\n  <div style=\"\
    background-color:red; width:300px; height:100px; position:relative; top:-60px;\
    \ left:35px; z-index:1\"></div>\n  <div style=\"background-color:black; width:300px;\
    \ height:100px; position:relative; top:-220px; left:120px; z-index:3\"></div>\n\
    </body>\n</html>\n```\nOutput:\n![image_rsrc9G0.jpg](images/image_rsrc9G0.jpeg)\n\
    \n### Visibility\nThe `visibility` property in css allows us to hide an element\
    \ from view and this property can also be used to hide error messages and retain\
    \ text. visibility has defined values including `visible`, `hidden`, and `collapse`.\
    \ Syntax for implementing visibility in a paragraph through css:\n\n```html\n\
    <p>text visible.</p>\n<p style=\"visibility:hidden;\">text should not be visible.</p>\n\
    ```\n\n### Layout and animations\nThe css layout techniques are a great way to\
    \ take elements contained in a web page and present them in different layouts.\
    \ this technique is generally used to change the position of elements or container.\
    \ modules for css layout include normal flow, the `display` property, flex, floats,\
    \ positioning, table layout, and multiple column layout. remember that all of\
    \ the methods of achieving a page layout in css are conducted through the `display`\
    \ property.\n\nCss animations allow an element to change style from one to another\
    \ for which we can implement multiple properties as well. for using css animations,\
    \ we are required to specify some keyframes through the `@keyframes` rule. For\
    \ example:\n\n```css\n@keyframes sample {\n  from {background-color:blue;}\n \
    \ to {background-color:brown;}\n}\n/* the element to apply the animation to */\n\
    div {\n  width: 100px;\n  height: 100px;\n  background-color: blue;\n  animation-name:\
    \ sample;\n  animation-duration: 4s;\n}\n```\n\n### How to effectively use css\n\
    There are several other css custom properties and elements that can be implemented\
    \ to improve the graphics display and attractiveness of a web page. although it\
    \ is critical to learn and implement all properties of css, using a good editor\
    \ can help create a perfect website design. furthermore, every method used in\
    \ css should be consistent so that there are no problems such as misinterpretation.\n\
    \nWhile writing css, you should also avoid using inline code and place the styles\
    \ or attributes only in the external stylesheets. checking that your code works\
    \ on the latest internet browsers such as internet explorer, chrome, and safari\
    \ can be a great idea so that you can ensure proper display and formatting of\
    \ the web pages. moreover, css code can also be reused as a template for other\
    \ projects and you can recycle the pre-existing code into new ones. multiple classes\
    \ can also be implemented with separation and we can benefit from inheritance.\n\
    \n## Chapter Ten: programming essentials\n\n### Selecting the programming language\n\
    As we have thoroughly discussed all of major programming languages and their syntax\
    \ in detail, beginners can choose the language which seems easiest to learn. although\
    \ most of major programming languages such as `c`, `c++`, and `java` have similar\
    \ syntax, there are several important aspects that need to be focused on writing\
    \ a program. `c` and `c++` are the best options for developing computer applications\
    \ for beginners because they provide an in-depth understanding of programming\
    \ and clear concepts.\n\nFor developing web plugins, desktop applications, or\
    \ mobile applications, `java` language can be considered because it provides complete\
    \ support and functionality. `html`, `css`, and `php` are the core languages for\
    \ website development and can be easily learned by beginners.\n"
