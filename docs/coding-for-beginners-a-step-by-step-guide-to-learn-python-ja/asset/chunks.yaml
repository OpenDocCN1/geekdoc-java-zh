  trans: "\n\n# 全局\n\n- While\n- Print\n- With\n- Try\n- E,xe,c\n- Or\n- Is\n- E,lif\n\
    \n## 基础运算符\n\nPython 拥有内置的运算符，例如算术运算符、赋值运算符、逻辑运算符、按位运算符、比较运算符和成员运算符。\n\nPython\
    \ 运算符的细节如下表所示：\n\n| 算术运算符 | 赋值运算符 | 比较运算符 | 逻辑运算符 | 按位运算符 |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| 加 (`+`) | 等于 (`=`) | 双等于 (`==`) | 逻辑或 | 二位与 (`&`) |\n| 减法\
    \ (`-`) | 加并赋值 (`+=`) | 不等于 (`<>`) | 逻辑与 | 二位或 (`|`) |\n| 乘法 (`*`) | 减并赋值 (`-=`)\
    \ | 大于 (`>`) | 逻辑非 | 二位异或 (`^`) |\n| 除法 (`/`) | 乘并赋值 (`*=`) | 小于 (`<`) | | 二位左移\
    \ (`<<`) |\n| | 除并赋值 (`/=`) | 小于等于 (`<=`) | | 二位右移 (`>>`) |\n| 取模 (`%`) | 取模并赋值\
    \ (`%=`) | | | 二位取反 (`~`) |\n| | 整除 (`//`) | 大于等于 (`>=`) | | |\n| | 整除并赋值 (`//=`)\
    \ | | | |\n| 幂 (`**`) | | | | |\n\n## 数据类型\n\n### 数据类型\n\n在 Python 编程语言中，每个对象都有自己的类型和值。\n\
    \nPython 的内置数据类型包括：\n\n- **数字**包括整数、浮点数、分数和复数。Python 中预定义的类型为 `int`、`float`、`long`\
    \ 和 `complex`。\n- **序列**由字符串、字节、列表和 `tuple`（组）组成。\n- **布尔值**持有 `true` 或 `false`。\n\
    - **字典**包含以无序方式设置的值对。\n- **集合**涵盖了无序的值容器。\n\n## 流程控制\n\n控制流语句允许程序员改变程序的流向并执行特定的操作。与其他高级编程语言一样，Python\
    \ 中使用的三个主要控制流语句是 `if`、`for` 和 `while`。下图显示了控制流语句在程序中实际是如何运作的：\n\n### 条件语句\n\n\
    #### If 语句\n`if` 语句是一个布尔表达式，以 `true` 或 `false` 的形式显示结果。\n\n#### If else 语句\n`if\
    \ else` 语句也是一个布尔表达式，包含可选的 `else` 语句。如果表达式为 `false`，则执行 `else` 语句。\n\n#### 嵌套语句\n\
    语句中的语句被称为嵌套语句。\n\n### 循环\n\n循环被称为一系列指令，允许程序员通过实现某些条件来执行特定任务。在 Python 编程中，可以使用给定的控制结构执行多条语句或一组指令。\n\
    \n#### Python 中的循环类型\n\n##### While 循环\n`while` 循环用于在程序中重复执行语句或迭代 ‘n’ 次。Python\
    \ 中使用 while 循环的语法如下：\n\n```\nwhile expression:\n    statement(s)\n```\n\n示例程序：\n\
    \n```python\n#!/usr/bin/python\n\ncount = 0\n\nwhile (count < 10):\n    print('the\
    \ count is:', count)\n    count = count + 2\n```\n\n![image_rsrc9FF.jpg](img/image_rsrc9FF.jpeg)\n\
    \n输出：\n![image_rsrc9FG.jpg](img/image_rsrc9FG.jpeg)\n\n##### For 循环\n为了迭代任何序列的项（包括字符串或列表），我们可以使用\
    \ `for` 循环。\n\n语法：\n\n```\nfor iterating_var in sequence:\n    statement(s)\n\
    ```\n\n示例程序：\n\n```python\nfruits = [\"apple,\", \"banana\", \"cherry\"]\n\nfor\
    \ x in fruits:\n    print(x)\n```\n\n为了在迭代完所有项之前停止循环，可以使用 `break` 语句；而 `continue`\
    \ 语句可以用于停止当前循环迭代并继续进行下一次迭代。\n\n## 函数与模块\n\n### 什么是函数？\n\n函数是一组可重用且组织良好的代码，用于在程序中执行特定的任务和操作。虽然\
    \ Python 编程语言提供了许多内置函数，但开发者也可以创建自己的函数，这些称为用户自定义函数。Python 中定义函数的语法描述如下：\n\n```\n\
    def functionname(parameters):\n    \"function_docstring\"\n    function_suite\n\
    \    return [expression]\n```\n\n为了引入函数定义，我们可以关键字 `def`，它是函数体的延续。赋值给函数的变量通常存储在局部表中，这意味着除非声明为全局变量，否则全局变量无法被赋值任何值。\n\
    \n### 调用函数\n\n编程语言中的函数可以通过提供参数、提供可选参数或仅提供强制参数来调用。函数最大化了可重用性并使程序更易理解。以下是用于定义函数的语句：\n\
    \n- `def display(age): print('hi' + age)`\n- `def print(): global x`\n- `for i\
    \ in range(k): yield`\n- `def sum(a, b): return a+b`\n- `def out(): local x='old'`\n\
    - `def inline(name):`\n- `age=30`（注：此处原文似乎略有碎片/乱码，但遵循结构）：\n\n```python\ndef person(name):\n\
    \    print(\"hi\", name)\n\nperson1 = {\n    \"name\": \"james\",\n    \"age\"\
    : 30,\n    \"country\": \"sweden\"\n}\n```\n\n### 模块\n\n模块化编程是将代码组织到文件中的方法。Python\
    \ 有大量的标准库，提供了许多工具。\n\nPython 导入的语法：\n\n1. `import module`\n2. `from module`\n\n\
    要使用新模块，我们可以这样调用：\n\n```\nimport newmodule.function\n```\n\n```python\ndef function(name):\n\
    \    print(\"hi\")\n```\n\n## 面向对象 Python\n\n在面向对象编程中，我们需要定义类和对象来实现各种功能。像 C++\
    \ 等语言一样，我们可以使用面向对象的技术访问和更新类。\n\n在 Python 中创建学生类的代码如下：\n\n```python\nclass student:\n\
    \    def __init__(self, id, name):\n        self.r = id\n        self.n = name\n\
    \        print(self.n)\n\n# ...\n\nstudent1 = student(1, \"james\")\nstudent2\
    \ = student(2, \"william\")\n\nprint(\"数据成功存储在变量中\")\n```\n\n### 继承\n\n继承是面向对象的一项有用特性，允许开发者创建一个新类来继承现有类的方法和属性。我们可以使用继承技术定义具有基类属性的新子类或派生类。\n\
    \nPython 中实现继承的语法为：\n\n`class derived_class2(base_class1):`\n\n使用继承时，我们定义如下：\n\
    \n```python\nclass base_class1:\n    # 基类体\n\nclass derived_class(base_class1):\n\
    \    # 派生类体\n```\n\n"
