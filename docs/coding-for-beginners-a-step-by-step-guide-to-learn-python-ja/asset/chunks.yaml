  trans: "\n\n当基类的公共数据成员变为派生类的公共成员时，会使用访问修符。受保护成员在派生类中变为受保护，而基类的私有成员仍保持不可访问。\n\n###\
    \ C++ 中使用访问修符的语法：\n\n```cpp\nClass myclass { // class\n    Public : // access\
    \ specifier\n    // class members\n};\n```\n\n### 友元函数、数据结构与封装\n\n#### 友元函数\n\
    在面向对象编程中，成员函数无法访问对象的私有和受保护数据。为了在这种情况下访问私有或保护数据，我们可以使用 `friend` 函数或 `friend` 类，这允许程序员访问类的私有和受保护数据。\n\
    \n该函数通过 `friend` 关键字声明，并应该在类体内使用。在 C++ 编程语言中声明友元函数，可以使用下面的语法：\n\n```cpp\nClass\
    \ class_name\n{\n    friend return_type function_name(argument);\n}\n```\n\n####\
    \ 数据结构\n虽然为了明确本主题的目标需要对数据结构进行深入介绍，但我们将讨论如何在 C++ 中定义和使用结构体。`structure` 是一种用户定义的数据类型，可以通过以下语法在程序中实现：\n\
    \n```cpp\nStruct [structure, tag]\n{\n    member definition;\n}\n```\n\n例如：\n\n\
    ```cpp\nStruct vehicle {\n    char name[50];\n    char category[100];\n    int\
    \ model_year;\n} vehicle;\n```\n\n要访问结构体中的任何成员，可以使用成员访问运算符（`.`）。通过数据结构定义结构指针变得简单，可以使用以下语法：\n\
    \n```cpp\nStruct vehicle *struct_pointer;\n```\n\n### 封装\n“封装”一术语被定义为编程中向用户隐藏敏感数据的方法。为了执行封装，我们需要将类变量和属性声明为私有，并通过\
    \ `getter` 和 `setter` 方法读取或修改私有成员的值。访问私有成员的语法定义如下：\n\n```cpp\n#include <iostream>\n\
    Using namespace std;\n\nClass employee {\nprivate:\n    // private attribute\n\
    \    int salary;\npublic:\n    // setter\n    void setsalary(int s) {\n      \
    \  salary = s;\n    }\n    // getter\n    int getsalary() {\n        return salary;\n\
    \    }\n};\n\nInt main() {\n    employee myobj;\n    myobj.setsalary(50000);\n\
    \    cout << myobj.getsalary();\n    return 0;\n}\n```\n\n#### 文件处理\n在 C++ 编程语言中，我们一直使用\
    \ `cin` 和 `cout` 方法在程序中读写数据。为了从文件读写数据，C++ 提供了一个名为 `fstream` 的标准库，它包含了 `ifstream`、`ofstream`\
    \ 和 `fstream` 数据类型。\n\n打开打开文件可以使用 `fstream` 或 `ofstream` 对象，其 C++ 语法定义如下：\n\n\
    ```cpp\nVoid open(const char *filename, ios::openmode mode);\n```\n\n关闭文件的语法：\n\
    \n```cpp\nVoid close();\n```\n\n### C++ 语言特性和支持\nC++ 编程语言提供了丰富的库支持和标准模板库 (stl)\
    \ 函数，用于快速编写代码。作为一种面向对象的编程语言，我们可以专注于对象并执行不同类型的操作和实现，而与其他编程语言不同，C++ 提供了这种支持。由于其快速、可靠和安全的特性，C++\
    \ 被广泛应用于操作系统、图形和数据库的开发。该语言速度快，并以其高效著称。C++ 还允许异常处理并支持函数重载。\n\n### C# 概述和基础语法\n\n\
    #### 概述\nC# 是微软开发的一种用于 .NET 框架的编程语言。该语言基于面向对象的编程方法并与 C 和 C++ 等其他语言具有相同的标准语法。C#\
    \ 是为通用基础设施 (cli) 开发的，由运行时环境和可执行代码组成，易学的 C# 是最好的编程语言之一，因为它可以生成高效的程序并在不同的平台上编译。为了运行\
    \ C# 应用程序和程序，需要 .NET 框架，它可以用于编写 Windows 应用程序、Web 服务以及 Visual Studio、视觉 C# 表达式的代码。\n\
    \n#### 基础语法\n基于面向对象的编程方法，C# 编程的核心是类和对象。以学生类为例，它具有学生姓名、学生 ID 和年级等属性，虽然每个学生的属性是相同的，但他们每个人都有不同的姓名、学生\
    \ ID 和年级，这些被称为对象属性。通常，一个 C# 程序由命名空间声明、类方法、主方法和语句组成。\n\n这里是一个在 C# 中打印“welcome to\
    \ C# programming”的简单程序：\n\n```csharp\nusing system;\nnamespace csharp programming\
    \ {\nclass programming {\n// main function\nstatic void main(string[] args) {\n\
    console.WriteLine(\"welcome to C# programming);\nconsole.ReadKey();\n}\n}\n}\n\
    ```\n\n基础语法的细节：\n* `Using system`：用于为程序包含系统命名空间。\n* `Namespace declaration`：程序内类的集合。\n\
    * `Class declaration`：程序中使用的数据和方法的类。\n* `Static void main()`：关键字 `static` 表示此方法也可以在不实例化类的情况下被访问。\n\
    * `Console.WriteLine()`：用于定义系统命名空间的方法（此处指输出）。\n* `Console.ReadKey()`：让计算机等待下一个命令并防止屏幕关闭。\n\
    \n### 数据类型和变量\n数据类型是任何编程语言的重要部分，因为它们指定了语言支持的数据类型。由于它们在 C# 中是预定义的，类型分为三大类：值类型、引用类型和指针类型。\n\
    \n#### 1. 数据类型\n值类型变量派生自 `system.value` 类，它们包含字母和数字形式的数据。\n\n下表显示了 C# 编程语言中使用的值类型：\n\
    \n| 数据类型 | 表示法 | 默认值 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Byte | 8 位无符号整数\
    \ | 0 | 0 到 255 |\n| Decimal | 128 位精确小数 | 0.0m | (-7.9 x 10²⁸ 到 7.9 x 10²⁸ |\n\
    | Bool | 布尔值 | False | True/false |\n| Float | 32 位单浮点类型 | 0.0m | -3.4 x 10³⁸\
    \ 到 + 3.4 x 10³⁸ |\n| Double | 0.0d | (+/-)5.0 x 10⁻³²⁴ 到 (+/-)1.7 x 10³⁸ |\n\
    | Char | 16 位 Unicode 字符 | ‘\\0’ | U+0000 到 uffff |\n| Int | 32 位符号整数类型 | 0 |\
    \ -2,147,483,648 到 2,147,483,647 |\n| Short | 16 位符号整数类型 | 0 | -32,768 到 32,767\
    \ |\n| Long | 64 位符号整数类型 | 0l | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
    \ |\n\n2. 引用类型,\n\n"
- fmt: "\nThe reference data type stores the reference to a variable instead of storing\
    \ the actual data. By using multiple variables, reference types can point to a\
    \ memory location and in case the memory location is changed by one of the variables,\
    \ the other variable will automatically change its value.\n\n### 3. Object type\n\
    \nObject data type is considered as the base class for all data types that are\
    \ used in `C#`. Moreover, object types can also be assigned values of other types,\
    \ reference types, user defined types, and value types as well.\n\n### 4. Pointer\
    \ data type\n\nPointer data type contains memory address of the variable value\
    \ and has the syntax as follows:\n\n`Type* identifier;`\n\n### Operators\n\n`C#`\
    \ makes use of operators in the same way as the other major programming languages\
    \ such as `c` and `c++`. The set of built-in operators include arithmetic operators,\
    \ relational operators, bitwise operators, logical operators, misc operators,\
    \ and assignment operators.\n\n### Functions and methods\n\nIn `c#` programming\
    \ language, a function allows the programmers to encapsulate a specific part of\
    \ the code and utilize it from other sections of the code as well. As it stops\
    \ the need to rewrite the code, we can access a function from multiple places\
    \ and perform the required operations as well. The functions in `c#` are declared\
    \ by using the following syntax:\n\n```<visibility> <return type> <name>(<parameters>)\n\
    {\n    <function code>\n}\n```\n\nA function that is known as a member function\
    \ or a member of a class is also known as a method in `c#` programming language.\
    \ Generally, there are two methods in `c#` called an instance method and a static\
    \ method. Functions can return any type of data and there can be multiple statements\
    \ executed such as read, follow, and run.\n\nSample program by using functions\
    \ in `c#`:\n\n```\nUsing system;\n\nClass return2\n{\n    static string lastfirst(string\
    \ firstname, string lastname)\n    {\n        string separator = \", \";\n   \
    \     string result = lastname + separator + firstname;\n        return result;\n\
    \    }\n    static void main()\n    {\n        console.WriteLine(lastfirst(\"\
    john\", \"william\"));\n        console.WriteLine(lastfirst(\"james\", \"lewis\"\
    ));\n    }\n}\n```\n\n### Arrays, strings, and structures\n\n#### Arrays\n\nAn\
    \ array is used to store a fixed size collection of elements with the same datatype.\
    \ Having contiguous memory locations, an array can be declared in `c#` programming\
    \ language by using the following syntax:\n\n`Datatype[] arrayname;`\n\nInitialization:\n\
    `Int [] age = new age[20]`\n\nSample program to declare and access arrays in `c#`\
    \ programming language:\n\n```\nUsing system;\n\nNamespace arrayapplication\n\
    {\n    class myarray\n    {\n        static void main(string [] args) {\n    \
    \        int [] n = new int[20]; /* n is an array of 20 integers */\n        \
    \    int i,j;\n            /* initialize elements of array n */\n            for\
    \ ( i = 0 ; i < 20 ; i++ ) {\n                n[ i ] = i + 100 ;\n           \
    \ }\n            /* output each array element's value, */\n            for(j =\
    \ 0 ; j < 10 ; j++ ) {\n                console.WriteLine(\"element[{0}] = {1}\"\
    , j, n[j]);\n            }\n            console.ReadKey();\n        }\n    }\n\
    }\n```\n\n#### Strings\n\nWe can create strings in `c#` programming by using the\
    \ keyword `system.string`. To create a string object, we can adopt different approaches\
    \ such as assigning a string literal to a string variable, using the concatenation\
    \ operator (`+`), calling formatting method to convert a value, or by using a\
    \ string constructor.\n\nSyntax:\n`String []array={\"this\", \"c#\", \"programming\"\
    };`\n\n#### Classes and objects\n\nClass is defined as representation of a type\
    \ of object and blueprint for a data type. In `c#` programming, the class definition\
    \ starts with the `class` keyword, class name, and class body. Access in classes\
    \ allow access for members where the default access for a class in `c#` program\
    \ is internal. To access members, we can use the `.` operator. It also links the\
    \ name of an object with the name of a member. A class is also considered a reference\
    \ type and the variable contains `null` value until create an instance of the\
    \ class using the `new` operator. To declare the class in `c#`, we can follow\
    \ the syntax mentioned below:\n\n```\nPublic class student\n{\n// properties,\
    \ methods\n}\n```\n\nSample:\n`Myclass student = new myclass();`\n`Myclass student2\
    \ = student;`\n\nIncluding different data members and functions\n\n```\nPublic\
    \ class student\n{\n    public int id = 0;\n    public string name = \"\";\n \
    \   public student()\n    {\n        // constructor statements\n    }\n    public\
    \ void getstudentdetails(int uid, string uname)\n    {\n        id = uid;\n  \
    \      name = uname;\n        console.WriteLine(\"id: {0}, name: {1}\", id, name);\n\
    \    }\n    public int designation { get; set; }\n    public string location {\
    \ get; set; }\n}\n```\n\nCreating an object\n\nIn `c#` programming, an object\
    \ is entirely based on class. a class defines a type of object. it is also known\
    \ as an instance of a class and can be created using the following syntax:\n\n\
    `student object1 = new student();`\n\nOnce the instance of a class has been created,\
    \ the object reference is passed back automatically. For example:\n\n`student\
    \ object2 = new student();`\n`student object3 = object2;`\n\nThe following program\
    \ shows how an object is created in `c#` programming language:\n\n```\nUsing system;\n\
    \nNamespace tutlane\n{\n    Class program\n    {\n        static void main(string\
    \ [] args)\n        {\n            users user = new users(\"harry potter\", 20);\n\
    \            user.getstudentdetails();\n            console.WriteLine(\"press\
    \ enter key to exit..\");\n            console.ReadLine();\n        }\n    }\n\
    \    Public class users\n    {\n        public string name { get; set; }\n   \
    \     public int age { get; set; }\n        public users(string name, int age)\n\
    \        {\n            Name = name;\n            Age = age;\n        }\n    \
    \    public void getstudentdetails()\n        {\n            console.WriteLine(\"\
    name: {0}, age: {1}\", name, age);\n        }\n    }\n}\n```\n\n### Inheritance\
    \ and polymorphism\n\n#### Inheritance\n\nInheritance is a major part of `c#`\
    \ as it is an object-oriented programming language allowing the programmers to\
    \ reuse different classes that require the same functionality. inheritance works\
    \ in the same method to that of a parent and child. parent is considered as the\
    \ base class where as child is known as the derived class which inherits all of\
    \ the functionality from its parent class.\n\nSyntax:\n\n```\n<access-specifier>\
    \ class <base_class>\n{\n    ...\n}\n\nClass <derived_class> : <base_class>\n\
    {\n    ...\n}\n```\n\nFor multi-level inheritance:\n\n```\nPublic class a\n{\n\
    // implementation\n}\nPublic class b : a\n{\n// implementation\n}\nPublic class\
    \ c : b\n{\n// implementation\n}\n```\n\n#### Polymorphism\n\nPolymorphism refers\
    \ to the technique where multiple functionality is performed through a single\
    \ operation. static polymorphism is performed at compile time, whereas the dynamic\
    \ polymorphism is decided at the run time.\n\nIn static polymorphism, `c#` allows\
    \ programmers to implement the following two approaches:\n\n##### Function overloading\n\
    \nFunction overloading provides multiple definitions for the same function name\
    \ in the given scope. Moreover, function definition should differ from each other\
    \ by types so that you do not overload function declarations that have a different\
    \ return type.\n\n##### Constructors\n"
