    \ % ^ & ( ) _ - + = | \\ } [ ] : ; ' < > , ? /`\nDigits: 0-9\n\nTo declare the\
    \ variables in c, we can follow the program syntax:\n\n```c\n#include <stdio.h>\n\
    // variable declaration:\nint a, b;\nint c;\nInt main() {\n/* variable definition:\
    \ */\nint a, b;\nint c;\nfloat f;\n/* initialization */\na = 30;\nb = 20;\nc =\
    \ a + b;\nprintf(\"value of c : %d \\n\", c);\nreturn 0;\n}\n```\nThe output of\
    \ this program is: 50.\n\n### Scope of variables\n\nThe scope of variables in\
    \ any programming language is set to allow certain permissions to the variables.\
