    In hype, rte, xt markup language, frames, are added to create multiple sections
    in the browser window so that each section can be loaded with a unique html document.
    To use frames in a web page, `<frameset>` tag should be used instead of `<body>`
    tag which can then be defined with specific `rows` and `cols` attributes.


    ### Sample html tags for creating frames:


    ```html

    <html>

    <head>

    <title>html frames</title>

    </head>

    <frameset rows="10%,80%,10%">

    <frame name="top" src="/html/top_frame.htm" />

    <frame name="main" src="/html/main_frame.htm" />

    <frame name="bottom" src="/html/bottom_frame.htm" />

    <noframes>

    <body>your browser does not support frames.</body>

    </noframes>

    </frameset>

    </html>

    ```


    ### Iframe


    To create, a nested browsing context, `iframe` tag can be used to add a new html
    document into an existing one. To create an `iframe`, the following syntax can
    be implemented along with the `<iframe>` tag:


    ```html

    <iframe src=https://www.website.com></iframe>

    ```


    ### Complete table of basic html tags:


    `<a>`, `<abbr>`, `<acronym>`, `<address>`, `<appt>`, `<area>`, `<article>`, `<aside>`,
    `<audio>`, `<b>`, `<base>`, `<basefont>`, `<bdi>`, `<bdo>`, `<big>`, `<blockquote>`,
    `<body>`, `<br>`, `<button>`, `<canvas>`, `<caption>`, `<center>`, `<cite>`, `<code>`,
    `<col>`, `<colgroup>`, `<data>`, `<datalist>`, `<dd>`, `<del>`, `<details>`, `<dfn>`,
    `<dialog>`, `<dir>`, `<div>`, `<dl>`, `<dt>`, `<em>`, `<embed>`, `<fieldset>`,
    `<figcaption>`, `<figure>`, `<font>`, `<footer>`, `<form>`, `<frame>`, `<frameset>`,
    `<h1>`-`<h6>`, `<head>`, `<header>`, `<hr>`, `<html>`, `<i>`, `<iframe>`, `<img>`,
    `<input>`, `<ins>`, `<kbd>`, `<label>`, `<legend>`, `<li>`, `<link>`, `<main>`,
    `<map>`, `<mark>`, `<meta>`, `<meter>`, `<nav>`, `<noframes>`, `<noscript>`, `<object>`,
    `<ol>`, `<optgroup>`, `<option>`, `<output>`, `<p>`, `<param>`, `<picture>`, `<pre>`,
    `<progress>`, `<q>`, `<rp>`, `<rt>`, `<ruby>`, `<s>`, `<samp>`, `<script>`, `<section>`,
    `<select>`, `<small>`, `<source>`, `<span>`, `<strong>`, `<style>`, `<sub>`, `<summary>`,
    `<sup>`, `<svg>`, `<table>`, `<tbody>`, `<td>`, `<template>`, `<textarea>`, `<tfoot>`,
    `<th>`, `<thead>`, `<time>`, `<title>`, `<tr>`, `<track>`, `<tt>`, `<u>`, `<ul>`,
    `<var>`, `<video>`, `<wbr>`.


    ### Forms


    Html forms are one of the key aspects of interaction between a website and a user.
    A form is created by using widgets such as text fields, buttons, select boxes,
    radio buttons, file select boxes, hidden controls, and clickable controls. Data
    collected through forms is sent to the web server and the web page can also intercept
    the data on its own. Most of the time, widgets are linked with a label in order
    to describe their purpose.


    Syntax for creating a form in html:


    ```html

    <form action="script url" method="get|post">

    Form elements like input, buttons etc.

    </form>

    ```


    Input form to take name, and age, from user:


    ```html

    <html>

    <head>

    <title>my first html form</title>

    </head>

    <body>

    <form>

    name: <input type="text" name="name" />

    <br>

    age: <input type="text" name="last" />

    </form>

    </body>

    </html>

    ```


    ### Text fields


    Text fields in html allow users to input text into the form. The general syntax
    for creating text fields is defined as follows:


    ```html

    <input type="text" type="text" value="text">

    ```


    ### Button controls


    There are different ways to submit data into forms. We can add clickable buttons
    using the following html tags:


    ```html

    <input type="submit" name="submit" value="submit" />

    <input type="text" name="text" value="text" />

    <input type="button" name="button" value="button" />

    ```


    ### Select box


    To create a dropdown list in html forms, we can use the `<select>` and `<option>`
    element.


    ```html

    <html>

    <head>

    <title>file box</title>

    </head>

    <body>

    <form>

    <label for="course">course:</label>

    <select name="course" id="course">

    <option value="engine">engine</option>

    <option value="calculus">calculus</option>

    <option value="science">science</option>

    </select>

    </form>

    </body>

    </html>

    ```


    ### Select box


    The select box element gives an option to list down multiple options in html form.


    ```html

    <html>

    <head>

    <title>your course,</title>

    </head>

    <body>

    <form>

    <select name="dropdown">

    <option value="math">math</option>

    <option value="physics">physics</option>

    </select>

    </form>

    </body>

    </html>

    ```


    ### Form element


    Once the html form has been, the two attributes `action` and `method` are required
    to store and send form data. `action` contains the address which defines where
    the form data will be sent, as `method` can either be `get` or `post` as it defines
    how to handle form information. The syntax for creating form element is defined
    as follows:


    ```html

    <form action="/login" method="post">

    ```


    ### Designing


    In html, the default background color for any webpage is white. To change the
    background color, the following tags and attributes can be used:


    `<tagname bgcolor="color value/color name">`


    ```html

    <table bgcolor="green">

    <table bgcolor="#f1f1f1">

    ```


    ### Fonts


    Fonts are an essential part of any website and enhance the readability of your
    content. The `<font>` tag can be used to give a specific style, size, and color
    to the text and its attributes include `size`, `color`, and `face`. To set the
    font size, the tags and attributes are:


    ```html

    <font size="14">text</font>

    ```


    Font face tags and attributes:


    ```html

    <font face="times new roman" size="14">text</font>

    ```


    ### Font color


    To change the font color, the following html tags and attributes can be used:


    ```html

    <html>

    <head>

    <title>setting font color</title>

    </head>

    <body>

    <font color="blue">this text is blue,</font>

    </body>

    </html>

    ```

    Output: this text is blue,


    ### Marked text


    The text written between `<mark>` and `</mark>` elements is displayed as yellow.


    ```html

    <p>this is <mark>yellow</mark></p>

    ```

    Output: this is yellow


    ### Meta tags


    In html, meta tags can be used to add metadata into your web page. The attributes
    of meta tags include `name`, `content`, and `http-equiv`. We can use `<meta>`
    tag to give a short description about the document can also improve search engine
    indexing for your web page.


    ```html

    <html>

    <head>

    <title>meta tags example,</title>

    <meta name="keywords" content="html, meta tags, metadata" />

    <meta name="description" content="meta tags." />

    <meta name="revised" content="3/7/2019" />

    <meta http-equiv="cookie" content="useid=abc; expires=monday, 08-sep-19 23:59:59
    gmt;" />

    </head>

    <body>

    <p>welcome to html</p>

    </body>

    </html>

    ```


    ### Comments


    To place comments in html code, the following syntax can be followed:


    ```html

    <html>

    <head> <!-- document header starts -->

    <title>document title</title>

    </head> <!-- document header ends -->

    <body>

    <p>document content goes here.....</p>

    </body>

    </html>

    ```

