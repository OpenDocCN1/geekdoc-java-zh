    \ class which will inherit features of parent class `vehicle`, and invoke its\
    \ functions as well.\n\nClass `vehicle`: #parent class\n\"parent class\"\n\n```python\n\
    class vehicle:\n    def __init__(self, price,):\n        self.price = price\n\n\
    \    def display(self):\n        print ('price = ', self.price,)\n```\n\nClass\
    \ `category(vehicle)`: #derived class\n\"child/derived class\"\n\n```python\n\
    class category(vehicle,):\n    def __init__(self, price,, name,):\n        vehicle.__init__(self,\
    \ price,)\n        self.name = name\n\n    def disp_name(self):\n        print\
    \ ('vehicle = ', self.name,)\n\nObj = category(2000, 'merchandise')\nObj.disp_name()\n\
    Obj.display()\n```\n\nOutput:\nVehicle = merchandise\nPrice = 2000\n\nTo override\
    \ any method in the base class, we can define a new method with the same name\
    \ and parameters in the derived class. the syntax is as follows:\n\nClass `a`:\
    \ #parent class own\"parent class\"\n\n```python\nclass a:\n    def display(self):\n\
    \        print ('this is base class.' ) own```\n\nClass `b(a)`: #derived class\n\
    \"child/derived class\"\n\n```python\nclass b(a):\n    def display(self): own\
    \        print ('this is derived class.' )\n\nObj = b()\nObj.display()\n```\n\n\
    # Regular Expressions\n\nIn python programming, regular expressions are used to\
