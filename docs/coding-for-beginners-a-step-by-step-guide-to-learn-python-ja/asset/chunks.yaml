  trans: "\n\n```cpp\nif(condition){\n    state,me,nt;\n}\n```\n\n## if state,me,nt\
    \ 的流程图：\n\n用于说明 c++ 中 if state,me,nt 的示例程序：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    int marks = 80;\n    if (marks < 100) {\n\
    \        cout << \"marks are less than 100\";\n    }\n    if (marks > 100) {\n\
    \        cout << \"marks are greater than 100\";\n    }\n    return 0;\n}\n```\n\
    \n## 嵌套 if state,me,nt\n\n在 c++ 中，状态内部中的状态被称为嵌套 if 状态。例如：\n\n```cpp\nif (condition_1)\
    \ {\n    State,me,nt1;\n    if (condition 2) {\n        State,me,nt2;\n    }\n\
    }\n```\n\n## If else state,me,nt\n\n```cpp\nif (condition_1) {\n    State,me,nt;\n\
    }else (condition 2) {\n    State,me,nt;\n}\n```\n\n## Switch case\n\nc++ 编程中的\
    \ switch case 状态用于程序中给出多个条件的情况，此时我们需要根据提供的条件执行操作。`break` 和 `continue` 操作也是 switch\
    \ 状态不可或缺的部分。c++ 中 switch case 的语法如下：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int num = 10;\n    switch (num +5) {\n        case\
    \ 1:\n            cout << \"case,1: value, is: \" << num << endl;\n        case\
    \ 2:\n            cout << \"case,2: value, is: \" << num << endl;\n        case\
    \ 3:\n            cout << \"case,3: value, is: \" << num << endl;\n        default:\n\
    \            cout << \"default: value, is: \" << num << endl;\n    }\n    return\
    \ 0;\n}\n```\n\n## Go to state,me,nt\n\nc++ 中的 goto 状态用于改变程序的执行流程，并将控制转移到同一程序内另一个带有标记的状态。\n\
    \ngoto 状态的语法：`goto label;`\n\n## 循环与函数\n\n### 循环\n\nc++ 编程语言中的循环状态用于执行特定的代码块，进行一定次数的迭代，直到满足提供的条件。由于它们允许程序员同时执行多个任务，循环状态会执行函数中的第一个状态，并根据需要移动到下一个状态。\n\
    \n#### 循环的类型\n\n*   **While 循环**：当提供的条件为真时重复某个状态，并在执行循环体之前进行检查。\n*   **Do while\
    \ 循环**：在执行循环的同时检查条件。\n*   **For 循环**：多次执行特定状态，并管理循环变量。\n*   **嵌套循环**：在一个循环内部包含另一个循环。\n\
    \n循环可以通过不同的控制状态（如 `break` 状态、`continue` 状态和 `goto` 状态）执行。\n\n### 函数\n\n函数负责组合不同的代码段并将它们一起执行以完成给定的操作。c++\
    \ 编程语言中的两种大类函数包括库函数和用户定义函数。库函数是 c++ 中预定义的，而用户定义函数是由程序员自己创建的。\n\n要定义函数，我们可以使用以下语法：\n\
    \n```cpp\nReturn_type function_name(parameter list) {\n    function body\n}\n\
    ```\n\n`min()` 函数的示例代码：\n\n```cpp\nint min (int num1, int num2) { //函数声明\n   \
    \ // 局部变量声明\n    int result;\n    if (num1 < num2)\n        result = num1;\n \
    \   else\n        result = num2;\n    return result;\n}\n```\n\n#### 函数调用\n\n\
    在 c++ 中调用函数，我们可以使用以下方法：\n*   按引用调用\n*   按值调用\n*   按指针调用\n\n#### 函数重载\n\n当两个或多个函数具有相同名称但参数不同时，该过程被称为重载。c++\
    \ 中重载的语法定义如下：\n\n```cpp\nvoid function(int a);\nint function(float a);\nvoid function(int\
    \ a, double b);\n```\n\n#### 数组\n\n数组在编程中被频繁使用，因为它们允许我们处理大量相同类型的数据。通常，数组被视为持有固定数量值的数据集合。\n\
    \n声明数组的语法：`datatype arrayname[size];`\n\n初始化：`int age[5] = {15, 20, 25, 30, 35};`\n\
    \n使用数组计算 10 个数字和的 c++ 示例程序：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    int numbers[10], sum = 0;\n    cout << \"enter 10 numbers:\
    \ \";\n    for (int i = 0; i < 10; i++) {\n        cin >> numbers[i];\n      \
    \  sum += numbers[i];\n    }\n    cout << \"sum = \" << sum << endl;\n    return\
    \ 0;\n}\n```\n\n#### 字符串\n\n字符串被称为字符集合。在 c++ 编程中，使用的两种常用字符串类型是 c 字符串和标准 c++ 库字符串类。可以使用以下语法定义字符串：\n\
    \n`char str[] = \"programming\";`\n\n#### 指针\n\n指针被定义为拥有某个地址值的变量。在 c++ 中使用指针，我们需要定义一个指针并为其赋值地址。随后我们通过单目运算符\
    \ `*` 访问值。c++ 编程中常用的指针包括：\n\n*   空指针\n*   指针数组\n*   指向指针的指针\n*   传递指针给函数\n*  \
    \ 函数的返回值\n\n## 面向对象 c++\n\n### 类与对象\n\nc++ 面向对象编程是创建对象并执行多种操作的简单方法。首先，在创建对象之前我们需要定义类，可以使用上述语法：\n\
    \n```cpp\nclass classname {\n    //数据\n};\n```\n\n类可以定义为公共、私有或保护，以便数据成员可以在程序中访问。\n\
    \n示例代码：\n\n```cpp\nclass student {\nprivate:\n    char name[20];\n    int rollno;\n\
    \    int total;\n    float perc;\npublic:\n    // 获取学生信息的成员函数\n    void getdetails();\n\
    \    // 输出学生信息的成员函数\n    void putdetails();\n};\n```\n\n### 继承与多态\n\n在编写实现的程序时，我们可以考虑基类和派生类的概念。由于类可以从一个或多个类派生，我们也可以从不同的基类继承函数和数据。\n\
    \n派生类可以访问基类的非私有成员。在继承属性的同时，用户还可以从现有类创建一个新类。c++ 中继承的语法定义如下：\n\n```cpp\nclass a\
    \ { // 基类\n..........\n};\n\nclass b : a { // 派生类\n...........\n}\n```\n\n####\
    \ 访问修饰符\n\n在 c++ 中，访问修饰符用于确定类之外可用性的限制。私有、保护和公共是定义类成员访问级别的主要的访问修饰符。\n\n私有访问修饰符用于创建类，使基类的保护和公共数据成员成为派生类的私有成员，此时基类的私有成员仍然无法访问。\n\
    \n保护访问修饰符用于创建类，使基类的公共和保护数据成员成为派生类的保护成员，此时基类的私有成员仍然无法访问。\n\n公共访问修饰符用于创建类，使基类的保护和保护数据成员成为派生类的公共成员，此时基类的私有成员仍然无法访问。\n\
    \n"
- fmt: "\nAccess specifier is used when the public data members of the base class\
    \ become the public member of the derived class. The protected members become\
    \ protected in derived class whereas the private members of the base class remain\
    \ inaccessible.\n\n### Syntax for using access specifiers in C++:\n\n```cpp\n\
    Class myclass { // class\n    Public : // access specifier\n    // class members\n\
    };\n```\n\n### Friend function, data structures, and encapsulation\n\n#### Friend\
    \ function\nIn object-oriented programming, the nonmember function is not given\
    \ access to private and protected data of an object. To allow access for private\
    \ or protected data in this case, we can use `friend` function or `friend` class\
    \ which allows programmers to access the private and protected data of a class.\n\
    \nThe function is declared by the keyword `friend` and should be used within the\
    \ body of the class. To declare the friend function in C++ programming language,\
    \ we can use the syntax as mentioned below:\n\n```cpp\nClass class_name\n{\n \
    \   friend return_type function_name(argument);\n}\n```\n\n#### Data structures\n\
    Although data structures are required to be briefed in depth with detail to clear\
    \ objectives of this topic, we will be discussing how a structure is defined and\
    \ used in C++. `structure` is a user-defined datatype, which can be implemented\
    \ in a program by using the following syntax:\n\n```cpp\nStruct [structure, tag]\n\
    {\n    member definition;\n}\n```\n\nFor example:\n\n```cpp\nStruct vehicle {\n\
    \    char name[50];\n    char category[100];\n    int model_year;\n} vehicle;\n\
    ```\n\nFor accessing any member within the structure, we can use the member access\
    \ operator (`.`). Defining pointers to structures is made simple through data\
    \ structures for which we can use the following syntax:\n\n```cpp\nStruct vehicle\
    \ *struct_pointer;\n```\n\n### Encapsulation\nThe term ‘encapsulation’ is defined\
    \ as the approach to hide sensitive data from users in programming. To perform\
    \ encapsulation, we are required to declare the class variables and attributes\
    \ as private, and read or modify the value of a private member through `getter`\
    \ and `setter` methods. The syntax for accessing private members is defined as\
    \ follows:\n\n```cpp\n#include <iostream>\nUsing namespace std;\n\nClass employee\
    \ {\nprivate:\n    // private attribute\n    int salary;\npublic:\n    // setter\n\
    \    void setsalary(int s) {\n        salary = s;\n    }\n    // getter\n    int\
    \ getsalary() {\n        return salary;\n    }\n};\n\nInt main() {\n    employee\
    \ myobj;\n    myobj.setsalary(50000);\n    cout << myobj.getsalary();\n    return\
    \ 0;\n}\n```\n\n#### File handling\nIn C++ programming language, we have been\
    \ using `cin` and `cout` methods to read or write data within a program. To read\
    \ and write data from a file, C++ offers a standard library known as `fstream`\
    \ which includes `ifstream`, `ofstream`, and `fstream` data types.\n\nTo open\
    \ a file, `fstream` or `ofstream` objects can be used for which the C++ syntax\
    \ is defined as follows:\n\n```cpp\nVoid open(const char *filename, ios::openmode\
    \ mode);\n```\n\nSyntax for closing a file:\n\n```cpp\nVoid close();\n```\n\n\
    ### C++ language features and support\nC++ programming language provides rich\
    \ library support and standard template library (stl) functions that can be used\
    \ to write code fast. As it is an object-oriented programming language, we can\
    \ focus on objects and perform different type of operations and implementations\
    \ without any hassle, unlike other programming languages, C++ provide support.\
    \ Due to its fast, reliable, and secure features, C++ is widely used in development\
    \ of operating systems, graphics, and databases. the language is fast and is known\
    \ for its efficiency. C++ also allows exception handling and supports function\
    \ overloading.\n\n### C#: Overview and basic syntax\n\n#### Overview\nC# is a\
    \ programming language developed by Microsoft to be used with .NET framework.\
    \ The language is based on object-oriented programming approach and has the same\
    \ basic syntax as other languages such as C and C++. C# is developed for common\
    \ infrastructure (cli) which is comprised of runtime environment and executable\
    \ code, being easy to learn C# is one of the best programming languages as they\
    \ can produce efficient programs and compile on different platforms. In order\
    \ to run C# applications and programs, .NET framework is required which can be\
    \ used to write code for Windows applications, web services as well Visual Studio,\
    \ visual C# expression.\n\n#### Basic syntax\nBased on the object-oriented programming\
    \ approach, C# programming is all about classes and objects. Taking the example\
    \ of a student class, it has attributes such as student name, student id, and\
    \ grade, although the attributes of each student are the same, each of them has\
    \ different name, student id, and grade which are known as object properties.\
    \ Generally a C# program is comprised of namespace declaration, class methods,\
    \ main method, and statements.\n\nHere is a simple program to print “welcome to\
    \ C# programming” in C#:\n\n```csharp\nusing system;\nnamespace csharp programming\
    \ {\nclass programming {\n// main function\nstatic void main(string[] args) {\n\
    console.WriteLine(\"welcome to C# programming);\nconsole.ReadKey();\n}\n}\n}```\n\
    \nDetails for basic syntax:\n* `Using system`: used to include system namespace\
    \ for the program.\n* `Namespace declaration`: collection of classes within the\
    \ program.\n* `Class declaration`: the class which contains data and methods to\
    \ be used in the program.\n* `Static void main()`: the keyword `static` shows\
    \ that this method can also be accessed without instantiating class.\n* `Console.WriteLine()`:\
    \ method used to define system namespace.\n* `Console.ReadKey()`: makes the computer\
    \ wait for the next command and also stops the screen from turning off.\n\n###\
    \ Datatypes and variables\nData types are an essential part of any programming\
    \ language, as they specify the type of data that is supported in the language.\
    \ As they are pre-defined in C#, types are separated into three major categories\
    \ known as value data types, reference data types, and pointer data type.\n\n\
    #### 1. datatype\nThe value data type variables are derived from `system.value`\
    \ class and they contain data in the form of alphabets and numbers.\n\nFollowing\
    \ table shows the value types that are used in C# programming language:\n\n| Data\
    \ type | Representation | Default value | Range |\n| :--- | :--- | :--- | :---\
    \ |\n| Byte | 8-bit unsigned integer | 0 | 0 to 255 |\n| Decimal | 128-bit precise\
    \ decimal values | 0.0m | (-7.9 x 10²⁸ to 7.9 x 10²⁸) |\n| Bool | Boolean value\
    \ | False | True/false |\n| Float | 32-bit single floating-point type | 0.0m |\
    \ -3.4 x 10³⁸ to + 3.4 x 10³⁸ |\n| Double | 0.0d | (+/-)5.0 x 10⁻³²⁴ to (+/-)1.7\
    \ x 10³⁰⁸ |\n| Char | 16-bit unicode character | ‘\\0’ | U+0000 to uffff |\n|\
    \ Int | 32-bit signed integer type | 0 | -2,147,483,648 to 2,147,483,647 |\n|\
    \ Short | 16-bit signed integer type | 0 | -32,768 to 32,767 |\n| Long | 64-bit\
    \ signed integer type | 0l | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ |\n\n2. reference type,\n"
