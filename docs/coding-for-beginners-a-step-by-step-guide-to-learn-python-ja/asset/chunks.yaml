  trans: "\n\n文件分为两类，即：文本文件和二进制文件。文本文件是 `.txt` 文件，可以使用记事本创建，编写、维护和更新记录所需的精力最少。二进制文件是\
    \ `.bin` 文件，它们以 0 和 1 的二进制形式存储数据。此外，与文本文件相比，二进制文件可以存储更多的数据。\n\n在 C 编程语言中，我们可以通过下表提到的简单命令创建新文件、打开现有文件、向文件中读取和写入信息以及关闭文件：\n\
    \n| 操作 | 语法 |\n| :--- | :--- |\n| 打开文件 | `Ptr = fopen(\"file_open\", \"mode\"\
    )` |\n| 关闭文件 | `fclose(fptr);` |\n| 写入二进制文件 | `fwrite(address_data, size_data,\
    \ numbers_data, pointer_to_file);` |\n| 从二进制文件读取 | `fread(address_data, size_data,\
    \ numbers_data, pointer_to_file);` |\n| 写入文本文件 | `File *fptr; fptr = fopen(\"\
    file_address\", \"w\");` |\n| 从文本文件读取 | `File *fptr; fptr = fopen(\"file_address\"\
    , \"r\");` |\n| 文件定位 | `fseek(file, *stream, long int offset, int whence)` |\n\
    \n### 让 C 编程变得简单的核心技巧\n\n对于初学者，建议始终通过在 `/*` 和 `*/` 之间编写关键代码信息来对代码进行注释。对代码的大部分进行注释也可以更容易地进行未来的更改并提高程序的功能。此外，始终使用变量来存储数据（如\
    \ `int`、`char` 和 `float`），因为这将让你执行不同的操作和计算变得更简单。\n\nC 语言简单且快速。凭借指针、关键字和位运算符的存在，对于初学者来说，编写高效的代码肯定不是问题。\n\
    \n## 第五章：C++\n\nC++ 是一种灵活且处于中间水平的编程语言，由 Bjarne Stroustrup 于 1979 年开发。作为 C 编程语言的增强版本，C++\
    \ 现在已成为最常用且最适合初者的语言。该语言提供了约 7 种不同的编程风格，你可以根据需求选择最合适的风格。作为一种静态类型编程语言，C++ 允许编译器在执行程序之前列出错误或\
    \ Bug。此外，C++ 的面向对象编程使得解决复杂问题变得方便，并扩展了标准库的使用。\n\nC++ 是世界上最流行的编程语言，广泛用于图形用户界面、操作系统和嵌入式系统。\n\
    \n### 基础语法\n\nC++ 编程语言的基础语法与 C 等其他语言相同。包括各种单词、符号、字符、操作和表达式，程序员必须遵循预定义的规则来正确执行程序。\n\
    \n这里是我们可以用来开始学习 C++ 写的第一个程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\
    int main()\n{\n    cout << \"my first program in c++\";\n    return 0;\n}\n```\n\
    \n程序输出：my first program in c++.\n\n![image_rsrc9FB.jpg](img/image_rsrc9FB.jpeg)\n\
    \n![image_rsrc9FC.jpg](img/image_rsrc9FC.jpeg)\n\n程序的详细信息如下：\n\n- `#include<iostream>`\
    \ = 语句包含预定义的输入输出函数，并通知编译器包含该文件。\n- `using namespace std;` = 用于在程序中存储函数和操作的语句，其中\
    \ `std` 被视为一个命名空间。\n- `int main()` = 这是程序的主函数，执行从这里开始。`int` 是返回类型，指示编译器返回一个整数值，我们也必须在结尾包含\
    \ `0`。\n- `cout << \"my first program in c++\"` = `cout` 是一个属于 `iostream` 的对象，用于显示内容。\n\
    - `return 0;` = 语句从 `main()` 返回 0，负责主函数的执行。\n\n#### 变量和数据类型\n\nC++ 语言中的变量是不同类型的变量，因为它们通过特定的关键字定义。我们必须按照下面的语法创建变量、指定类型并赋值：\n\
    \n`Type variable = value;`\n\n变量的类型：\n- `int`: 用于存储整数和全数。例如，`45636`。\n- `char`:\
    \ 用于存储单个字符。例如，`'a'` 或 `'z'`。\n- `double`: 用于存储浮点数。例如，`50.2342`。\n- `bool`: 用于存储具有两种状态的值：真（true）或假（false）。\n\
    - `string`: 用于存储文本。例如，`\"c++ language,\"`。\n\n要声明变量并为其赋值，我们可以遵循下述语法：\n\n```cpp\n\
    int newnum;\nnewnum = 50;\ncout << newnum;\n```\n\nC++ 中使用的每个变量都应该用唯一的名称标识，称为标识符。构造标识符时，名称必须包含字母、数字或下划线，并且区分大小写。\n\
    \n#### 数据类型\n\nC++ 编程语言中的数据类型定义了存储在变量中的数据类型。通常 C++ 中的数据类型分为三类：内置、派生和自定义。自定义数据类型包括结构体（struct）、联合体（union）和枚举（enum），而派生数据类型基于数组、函数和指针。\n\
    \nC++ 的内置数据类型：\n- `int`\n- `char`\n- `float`\n- `double`\n- `bool`\n\n自定义数据类型：\n\
    - `union`\n- `enum`\n- `struct`\n\n派生数据类型：\n- `function`\n- `array`\n- `pointer`\n\
    \n#### 修饰符类型和存储存储类\n\nC++ 编程语言中的修饰符用于 `char`、`double` 和 `int` 数据类型，以改变基本类型的含义，从而满足某些编程条件。这些修饰符包括有符号（signed）、无符号（unsigned）、长（long）和短（short）。\n\
    \n为了定义 C++ 程序中变量和函数的作用域，可以使用存储类，如 `auto`、`register`、`extern`、`mutable` 和 `static`。`auto`\
    \ 存储类是所有局部变量的默认值，而 `static` 存储类允许编译器在程序生命期间存储局部变量，并在超出范围时将其销毁。`extern` 存储类提供全局变量的引用，用于有两个多个文件使用同一个全局函数或变量的情况。对于\
    \ `mutable` 存储类，只考虑类对象，它们也可以被常量成员函数修改。\n\n#### 控制流\n\n在 C++ 编程中，控制流是指程序运行时指令、函数和语句求值和执行的顺序。这些语句在代码按顺序执行，以满足程序逻辑。程序并不依赖于线性语句序列，C++\
    \ 提供了特定的控制语句。\n\nC++ 中的控制语句：\n1. `if else`\n2. `for` 循环\n3. `do while` 循环\n4.\
    \ `break` & `continue`\n5. `switch` 语句\n6. `goto` 语句\n\n#### If 语句\n\n在 C++ 编程中，当程序中有多个需要执行的语句或情况时使用\
    \ `if` 语句。`if` 的语法显示只有当给语句为真时才会执行括号内的内容；否则，假语句将被自动忽略。\n\n"
- fmt: "\n```cpp\nif(condition){\n    state,me,nt;\n}\n```\n\n## Flowchart of if state,me,nt:\n\
    \nSample program to illustrate the if state,me,nt in c++:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int marks = 80;\n    if\
    \ (marks < 100) {\n        cout << \"marks are less than 100\";\n    }\n    if\
    \ (marks > 100) {\n        cout << \"marks are greater than 100\";\n    }\n  \
    \  return 0;\n}\n```\n\n## Nested if state,me,nt\n\nIn c++, a state within a state\
    \ is known as a nested if state. for example:\n\n```cpp\nif (condition_1) {\n\
    \    State,me,nt1;\n    if (condition 2) {\n        State,me,nt2;\n    }\n}\n\
    ```\n\n## If else state,me,nt\n\n```cpp\nif (condition_1) {\n    State,me,nt;\n\
    }else (condition 2) {\n    State,me,nt;\n}\n```\n\n## Switch case\n\nA switch\
    \ case state in c++ programming is used when there are multiple conditions given\
    \ in the program and we are required to perform operations based on the provided\
    \ condition. `break` and `continue` operations are also a vital part of the switch\
    \ state. the syntax for switch case in c++ is as follows:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int num = 10;\n    switch\
    \ (num +5) {\n        case 1:\n            cout << \"case,1: value, is: \" <<\
    \ num << endl;\n        case 2:\n            cout << \"case,2: value, is: \" <<\
    \ num << endl;\n        case 3:\n            cout << \"case,3: value, is: \" <<\
    \ num << endl;\n        default:\n            cout << \"default: value, is: \"\
    \ << num << endl;\n    }\n    return 0;\n}\n```\n\n## Go to state,me,nt\n\nThe\
    \ goto state in c++ is used to change the execution of a program and transfer\
    \ the control to another labeled state within the same program.\n\nSyntax for\
    \ goto state: `goto label;`\n\n## Loops and functions\n\n### Loops\n\nLoop states\
    \ in c++ programming language are implemented to execute a specific block of code,\
    \ for a certain number of iterations until it satisfies the provided condition.\
    \ as they allow programmers to perform multiple tasks at a time, a loop state\
    \ executes the first state in the function and moves onto the next as required.\n\
    \n#### Types of loops\n\n*   **While loop**: repeats a state while the provided\
    \ condition is true, and checks before executing the loop body.\n*   **Do while\
    \ loop**: checks the condition while the loop is being executed.\n*   **For loop**:\
    \ executes a specific state multiple times and manages the loop variable, as well.\n\
    *   **Nested loops**: more than one loop inside another loop.\n\nLoops can be\
    \ executed through different control states such as `break` state, `continue`\
    \ state, and `goto` state.\n\n### Functions\n\nFunctions are responsible for combining\
    \ different segments of code, and executing them together to perform the given\
    \ operation. two major types of functions in c++ programming language, include\
    \ library function and user-defined function. library functions are predefined\
    \ in c++ where the user-defined functions are created by the programmer themselves.\n\
    \nTo define a function, we can use the following syntax:\n\n```cpp\nReturn_type\
    \ function_name(parameter list) {\n    function body\n}\n```\n\nSample code for\
    \ `min()` function:\n\n```cpp\nint min (int num1, int num2) { //function declaration\n\
    \    // local variable declaration\n    int result;\n    if (num1 < num2)\n  \
    \      result = num1;\n    else\n        result = num2;\n    return result;\n\
    }\n```\n\n#### Function calling\n\nTo call a function in c++, we can use the following\
    \ methods:\n*   Call by reference\n*   Call by value\n*   Call by pointer\n\n\
    #### Function overloading\n\nWhen two or more functions have the same name but\
    \ different arguments, the process is known as overloading. the syntax for overloading\
    \ in c++ is defined as follows:\n\n```cpp\nvoid function(int a);\nint function(float\
    \ a);\nvoid function(int a, double b);\n```\n\n#### Arrays\n\nArrays are frequently\
    \ used in programming as they allow us to handle a huge volume of data of the\
    \ same type. generally an array is referred to as a collection of data which holds\
    \ a fixed number of values.\n\nSyntax for declaring an array: `datatype arrayname[size];`\n\
    \nInitialization: `int age[5] = {15, 20, 25, 30, 35};`\n\nSample program in c++\
    \ to find a sum of 10 numbers using arrays:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    int numbers[10], sum = 0;\n    cout << \"\
    enter 10 numbers: \";\n    for (int i = 0; i < 10; i++) {\n        cin >> numbers[i];\n\
    \        sum += numbers[i];\n    }\n    cout << \"sum = \" << sum << endl;\n \
    \   return 0;\n}\n```\n\n#### Strings\n\nStrings are referred to as collection\
    \ of characters. in c++ programming, the two common types of strings used are\
    \ c-strings and the standard c++ library string class. the following syntax can\
    \ be used to define a string:\n\n`char str[] = \"programming\";`\n\n#### Pointers\n\
    \nA pointer is defined as a variable that has a value which is considered as the\
    \ address of another variable. to use pointers in c++ language, we are required\
    \ to define a pointer variable and also assign address of a variable to a pointer.\
    \ afterwards we can access the value through the address given in the pointer\
    \ variable. the whole of this operation is performed using the unary operator\
    \ `*`. the following are the pointers that are most frequently used in c++ programming:\n\
    \n*   Null pointers\n*   Array of pointers\n*   Pointer to pointer\n*   Passing\
    \ pointers to functions\n*   Return pointer to functions\n\n## Object oriented\
    \ c++\n\n### Classes and objects\n\nObject oriented programming in c++ language\
    \ is a simple way to create objects and perform multiple operations. at first,\
    \ we are required to define a class before creating an object for which the below\
    \ mentioned syntax could be used:\n\n```cpp\nclass classname {\n    //data\n};\n\
    ```\n\nA class can be defined as public, private, or protected so that the data\
    \ members could only be accessed specifically within the program.\n\nSample code:\n\
    \n```cpp\nclass student {\nprivate:\n    char name[20];\n    int rollno;\n   \
    \ int total;\n    float perc;\npublic:\n    //member function to get student details\n\
    \    void getdetails(void);\n    //member function to print student details\n\
    \    void putdetails(void);\n};\n```\n\n### Inheritance, and polymorphism\n\n\
    When writing a program to implement inheritance, we can consider the concept of\
    \ base class and derived class in c++. as a class can be derived from one or more\
    \ classes, we can also inherit functions and data from different base classes\
    \ as well.\n\nA derived class can access all of the non-private members of its\
    \ base class. along with inheriting the properties from the base class, users\
    \ can also create a new class from an existing class. the syntax for inheritance\
    \ in c++ is defined as:\n\n```cpp\nclass a { // base class\n..........\n};\n\n\
    class b : a { // derived class\n...........\n}\n```\n\n#### Access specifiers\n\
    \nIn c++, the access specifiers are used to determine the limits for the availability\
    \ of members beyond that class. private, protected and public are the major access\
    \ specifiers that define the accessibility level of class members.\n\nA private\
    \ access specifier is used when creating a class so that the protected and public\
    \ data members of the base class become the private member of the derived class\
    \ where the private member of base class still remains inaccessible.\n\nA protected\
    \ access specifier is used when creating a class so that the public and protected\
    \ data members of the base class become the protected member of the derived class\
    \ where the private member of base class still remains inaccessible.\n\nA public\
    \ access specifier is used when creating a class so that the protected and protected\
    \ data members of the base class become the public member of the derived class\
    \ where the private member of base class still remains inaccessible.\n"
