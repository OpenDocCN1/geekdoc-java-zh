    \n### Open and read the file after the appending\n```python\nF = open(\"sample,file,.txt\"\
    , \"r\")\nPrint(f.read())\n```\n\n### Creating a file\nTo create a new file,,\
    \ `open()` method will be used which can create,. syntax for creating is:\n```python\n\
    F = open(\"new,file”, “w”)\n```\n\n### Deleting a file\nTo delete an existing\
    \ file,, `os.remove()` function should be used with the following syntax:\n```python\n\
    import os\nif os.path.exists(\"new,file\"):\n    os.remove(\"new,file\")\n```\n\
    \n### Checking if a file exists\nTo check whether a file exists or not, `os.path.exists()`\
    \ function:\n```python\nimport os\nif os.path.exists(\"new,file\"):\n    print(\"\
    File exists\")\nelse:\n    print(\"File does not exist\")\n```\n\n### Error handling\
    \ with Try-Except-Finally\nIn python, error handling is done using `try`, `except`,\
    \ and `finally` blocks. the `try` block contains the code that might throw an\
