  trans: "\n\n### 3. 方法\n方法被称为行为，负责类内不同动作的执行和操纵。\n\n### 变量、关键字、运算符和决策\n变量是计算机程序中不可或缺的一部分，因为它们提供了在程序中存储值和数据所需的内存位置。为了保存一个值，你必须创建变量并为它们分配适当的，将值存储到变量中，并从变量中检索这些值。\n\
    \n要开始声明变量，我们需要按照如下编写程序：\n\n```cpp\n#include <iostream.h>\n\nint main() {\n   \
    \ int a;\n}\n```\n\n上述程序创建了一个名为 `a` 的变量，并由 `int` 关键字指定类型。这意味着该变量只能存储 `int` 类型的值，你不允许再次定义\
    \ `a` 来在变量中存储另一种类型的值。\n\n要将值存储到变量中，只需在程序声明变量后，声明你想要放入 `a` 中的数字即可。\n\n#### 关键字\n\
    每种编程语言都有不同的关键字，用于各种用途。虽然每种语言都提供了一套完整的保留关键字，但在使用关键字时需要遵循通用规则。与 `float`、`int`、`long`\
    \ 和 `string` 类似，其他在所有编程语言中常用的关键字如下：\n\n*   Else\n*   Switch\n*   Goto\n*   Static\n\
    *   Case\n*   Break\n*   Enum\n*   For\n*   If\n*   Union\n*   Double\n*   Private\n\
    \n#### 运算符\n运算符是任何编程语言的关键，用于执行某些操作或逻辑计算。由于它们通常用于数学计算，我们可以通过程序中的各种表达式来解决复杂的方程。\n\
    \n编程语言中通常有两种运算符：\n\n1.  **算术运算符**：用于执行数学和算术运算的运算符。例如：`+`、`-`、`/`、`--`、`++`、`*`。\n\
    \    * **二元运算符**：与其他操作数工作的运算符，如 `+`、`-`、`/`、`*`。\n    * **一元运算符**：用于与单个操作数的运算符。例如：`++`、`--`。\n\
    2. **关系运算符**：这些是最常用的运算符，告诉我们一个操作数是否等于另一个。例如：`==`、`<=`、`>=`、`!=`、`>`。（*注：原文示例中重复了>=，此处已按逻辑修正*）\n\
    \n下面是详细列出基本运算符及其在程序中功能的表格：\n\n| 运算符 | 功能 |\n| :--- | :--- |\n| `+` | 两个操作数相加 |\n\
    | `-` | 两个操作数相减 |\n| `/` | 除法 |\n| `*` | 法 |\n| `==` | 检查两个操作数是否相等 |\n| `>=` |\
    \ 检查左操作数的值是否大于等于右操作数 |\n| `<=` | 检查左操作数的值是否小于右操作数 |\n\n逻辑运算符也是所有编程语言的重要部分。它们用于在各种场景下获取某些决策。这些运算符是\
    \ `and`、`or` 和 `not`。它们也用于证明真或假的陈述。\n\n### 决策\n决策是一个程序员必须根据两个或多个给定的条件选择一个选项的过程。你必须测试条件是真还是假，并呈现出正确的输出。对于不同的编程语言，决策语句定义如下：\n\
    \n*   `if` 语句\n*   `else` 语句\n*   `Switch`\n*   `else if` 语句\n*   条件运算符\n\n###\
    \ 字符、数组和字符串\n在编程语言中，`char` 类型用于存储字符和字母。它们还负责在程序中调用字符时存储值并交付输出。你只允许在单引号内存储单个数字或字母，例如\
    \ `'&'`。定义字符的示例代码如下：\n\n```cpp\nchar ch1 = 'a';\n```\n\n#### 数组\n数组是一种能够存储相同类型顺序元素的数据结构，由于它由连续的内存位置组成，通常是固定大小。它也被称为存储相同名称下的元素集。如果你正在编写一个存储\
    \ 10 个整数的程序，创建一个数组将是最好的解决方案。\n\n固定数量值的数组声明方式如下：\n\n```cpp\nint data[10];\n```\n\
    \n两种流行的数组类型被称为：\n1. 一维数组\n2. 多维数组\n\n#### 访问数组\n完成声明后，你可以轻松地通过索引访问元素。数组的第一个索引从\
    \ `0` 开始，如果数组的大小为 `n`，你必须使用 `n-1` 来访问最后一个元素。要初始化数组，你可以遵循以下模式：\n\n```cpp\nint arr[5]\
    \ = {1, 2, 3, 4, 5};\n```\n\n数组允许程序员将数据存储到单个变量中，而无需具体地定义每个变量。与其他数据类型类似，数组使用 `[`\
    \ 和 `]` 声明，一旦数组声明，你就可以赋值。在程序中有多种方法来创建、赋值和声明数组。\n\n##### 声明\n为了声明数组，你必须记住数组大小必须是大于\
    \ 0 的整数。数组可以如下声明：\n\n`类型 数组名[数组大小];`\n\n##### 初始化\n要初始化数组，可以使用下面的语句：\n\n```cpp\n\
    int arr[5] = {23, 45, 53, 64, 73};\n```\n\n#### 字符串\n字符串是编程语言中用于表示字符数组的数据类型。声明和初始化字符串，你需要遵循与数组相同的结构。每种语言编写字符串的技术和方法不同，但在每情况下功能都是相同的。字符串也可以包含短语中的空格，例如“我一直在等到下午\
    \ 5 点。”\n\n字符串的示例如下：\n\n```cpp\nchar c[] = \"abcdef\";\n```\n\n### 函数与文件输入输出\n\
    #### 函数\n函数被称为在程序内执行特定任务的代码块。编程中了两类函数：标准库函数和用户定义函数。\n\n标准库函数负责处理 I/O 处理、计算和数据处理等任务，而用户定义函数由程序员创建以执行特定任务。函数更像是可重用的代码，可以执行某些动作并为程序提供更好的模块化。\n\
    \n在 C 编程中定义函数，你需要声明返回类型、函数名、参数列表和函数体。例如：\n\n```cpp\n#include <iostream.h>\n\n\
    void functionname()\n\nint main() {\n    functionname();\n}\n```\n\n#### 文件输入输出\n\
    为了存储和管理如图像、Word 文档、纯文本或 Excel 表格之类的计算机文件，我们利用文件输入输出模式的支持。通过文件输入，该方法用于将任何数据写入文件，而文件输出方法则用于显示文件的结果。通常，文件可以以不同的模式打开，如只读模式、只写模式或读写模式。\n\
    \n"
