  trans: "\n\n例如，在创建 `students` 表时为 `id` 列定义主键，我们可以使用以下 sql 语句：\n\n```sql\nCreate\
    \ table students (\n  id in not null,\n  firstname varchar (255),\n  lastname\
    \ varchar not null (255),\n  marks int,\n  primary key (id)\n);\n```\n\n### 外键\n\
    \nsql 中的 `foreign key` 约束用于实现两个表之间的关联，其中一个表中的 `foreign key` 引用另一个表的主键。\n\n在创建\
    \ `student` 表时对 `studentid` 列实现 `foreign key` 约束的语法如下：\n\n```sql\nCreate table\
    \ student (\n  studentid in not null,\n  studentmarks int not null,\n  classid\
    \ int,\n  primary key (studentid),\n  foreign key (classid) references students(\
    \ studentid)\n);\n```\n\n### 约束和有用资源\n\n约束是在数据表数据列上实现的特定规则。通常，实施约束是为了限制插入到表的数据类型。最常见的包括\
    \ `not null` 约束、`default` 约束、`unique` 约束、`primary key`（主键）、`foreign key`（外键）、`check`\
    \ 约束和 `index`（索引）。\n\n此外，完整性约束还可以提高关系型数据库中数据的一致性和准确性。通常，`primary key`、`foreign\
    \ key` 和 `unique` 约束是引用完整性 (ri) 的一部分。\n\n为了提高 sql 数据库的性能，有几个重要的因素可以轻松实现。在编写列名时，建议使用\
    \ `select` 语句而不是 `*` 分隔符。例如：\n\n`Select * from students`\n\n此外，在语句上设置 `nocount`\
    \ 将减少 sql-server 为 `insert`、`delete` 或 `update` 操作更新行所需的时间。\n\n## 第四章：c\n\nC 编程语言于\
    \ 1972 年在美国的贝尔实验室开发。通常情况下，编程语言分为两大类，即高级语言和低级语言，但 c 被归类为中间级语言。这种语言的目的是提供对内存的低级访问，并为\
    \ php 和 java 等其他主要编程语言提供了语法结构。\n\n### 介绍和简单程序\n\n作为一种结构化语言，程序员可以通过实现不同的方法和编程技术来创建分区代码块并创建业务应用程序。此外，我们还可以编写新的函数并在\
    \ c 库中重复使用它们。\n\n### 从 c 编程开始\n\n编写 c 程序对初学者来说简单易用。从基础程序语法开始，我们可以如下开发 c 应用程序：\n\
    \n```c\n#include <stdio.h>\nInt main() {\n  int a = 2;\n  printf(\"%d\", a);\n\
    \  return 0;\n}\n```\n\n### 头文件\n\n编写 c 程序的第一部分是选择头文件。通常，头文件的扩展名为为 `.h`，并且包含函数声明。要包含一个头文件，我们可以遵循以下语法：\n\
    \n头文件示例：\n- `stdio.h`:用于定义输入和输出函数\n- `string.h`:用于字符串处理\n- `def.h`:定义有用的类型和宏\n\
    - `stdlib.h`:定义内存分配\n- `int.h`:用于定义整数类型\n- `math.h`:用于执行数学函数\n\n### 方法和变量声明\n\n\
    编写 c 程序的后续部分是定义方法和声明变量。声明主方法的语法：\n\n```c\nInt main()\n```\n\n变量声明的语法：\n\n```c\n\
    Int z\n```\n\n程序体：\n\n```c\nInt main() {\nint z;\n}\n```\n\n要终止程序，我们可以使用返回语句：`return\
    \ 0`。\n\n### 关键字\n\n关键字是任何编程语言的主要驱动力，也被称为保留字。虽然高级语言有许多关键字，但 c 只允许使用 32 个关键字，它们是：`Double`、`Long`、`Int`、`Switch`、`Case`、`Type`、`Union`、`Const`、`For`、`Do`、`While`、`Static`、`Default`、`Auto`、`Break`、`Else`、`Struct`、`Float`、`Short`、`Char`、`Return`、`Void`、`Goto`。\n\
    \n### 数据类型和变量\n\n在 c 编程语言中，使用数据类型定义变量，以便在程序之前分配存储。c 语言的内置数据类型包括 `float`、`int`\
    \ 和 `double`。这些数据类型具有修饰符 `short`、`long` 和 `unsigned`。\n\n以下是 c 语言允许的有效数字、字母和符号：\n\
    字母：a-z, A-Z。\n符号：`- ~ ! # % ^ & ( ) _ - + = | \\ } [ ] : ; ' < > , ? /`\n数字：0-9\n\
    \n要在 c 中声明变量，我们可以遵循以下程序语法：\n\n```c\n#include <stdio.h>\n// 变量声明:\nint a, b;\n\
    int c;\nInt main() {\n/* 变量定义: */\nint a, b;\nint c;\nfloat f;\n/* 初始化 */\na =\
    \ 30;\nb = 20;\nc = a + b;\nprintf(\"value of c : %d \\n\", c);\nreturn 0;\n}\n\
    ```\n该程序的输出结果为：50。\n\n### 变量的作用域\n\n任何编程语言中变量的作用域设置是为了允许变量具有某些权限。通常，变量分为局部变量、全局变量和形式参数。\n\
    \n局部变量在块内声明，仅供程序特定区域的语句使用。由于它们对其他函数未知，我们无法在函数外部访问局部变量。\n\n全局变量通常在函数外部，并在整个过程中保持其值。它可以被程序中的任何函数访问和调用。局部变量需要由程序员初始化，而全局变量会自动初始化。\n\
    \n### 循环和函数\n\n#### 循环\n\n循环是每个编程语言不可或缺的一部分，允许开发者多次执行特定语句。c 编程语言中有 4 种类型的循环，简介如下：\n\
    \n1. `for 循环`：用于执行特定次数的语句，也被用于简化处理循环变量的代码。\n2. `while 循环`：重复给定语句并在执行循环体之前检查给定条件是否为真或假。\n\
    3. `do while 循环`：工作方式与 while 相同，但 do while 在最后检查条件。\n4. `嵌套循环`：循环内部循环被称为嵌套循环。它可以是\
    \ while 循环、do while 循环或 for 循环。\n\n为了改变循环的执行顺序，可以使用循环控制语句。`break` 语句退出循环并将执行转移到下一语句，而\
    \ `continue` 语句导致循环跳过其剩余部分并重新检查给定条件。\n\n为了将控制转移到标记语句，我们可以使用 `goto` 语句。\n\n####\
    \ 函数\n\n在 c 编程语言中定义函数，建议使用以下语法：\n\n```c\nReturn type, function name( parameter\
    \ list) {\n  function body\n}\n```\n\n"
