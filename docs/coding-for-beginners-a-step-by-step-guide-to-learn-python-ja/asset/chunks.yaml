  trans: "\n\n以下程序展示了 `vehicle` 作为父类，以及一个派生类，该类将继承父类 `vehicle` 的特征，并调用它的函数。\n\n`vehicle`\
    \ 类：#父类\n\"父类\"\n\n```python\nclass vehicle:\n    def __init__(self, price,):\n\
    \        self.price = price\n\n    def display(self):\n        print ('price =\
    \ ', self.price,)\n```\n\n`category(vehicle)` 类：#派生类\n\"子类/派生类\"\n\n```python\n\
    class category(vehicle,):\n    def __init__(self, price,, name,):\n        vehicle.__init__(self,\
    \ price,)\n        self.name = name\n\n    def disp_name(self):\n        print\
    \ ('vehicle = ', self.name,)\n\nObj = category(2000, 'merchandise')\nObj.disp_name()\n\
    Obj.display()\n```\n\n输出：\nVehicle = merchandise\nPrice = 2000\n\n要覆盖基类中的任何方法，我们可以在派生类中定义具有相同名称和参数的新方法。语法如下：\n\
    \n`a` 类：#父类拥有\n\"父类\"\n\n```python\nclass a:\n    def display(self):\n       \
    \ print ('this is base class.' ) own```\n\n`b(a)` 类：#派生类\n\"子类/派生类\"\n\n```python\n\
    class b(a):\n    def display(self): own        print ('this is derived class.'\
    \ )\n\nObj = b()\nObj.display()\n```\n\n# 正则表达式\n\n在 Python 编程中，正则表达式用于从文本中提取信息，包括文档、日志文件、电子表格或代码。正则表达式被称为特殊顺序的字符，允许程序员使用专门的语法查找相关的序列、字符或字符串集。在\
    \ Python 编程语言中编写正则表达式时，我们应该以前缀 ‘r’ 开始原始字符串，并同样处理其他特殊的元字符。\n\n### Match 函数\n`match()`\
    \ 函数用于检查 Python 中的给定的正则表达式是否匹配某个字符串。在模式不匹配的情况下，我们可以使用 `re.match()` 函数。\n\n###\
    \ Search 函数\n此函数尝试在字符串中搜索所有可能的起始点，并扫描输入字符串以匹配任何位置。它包含了 `search()` 或 `re.search()`\
    \ 函数。\n\n### Split 函数\n`split` 函数可以直接应用于字符串，其中 `re.split()` 接受一个指定分隔符的模式。\n\n\
    # 文件 I/O\n文件是磁盘上的特定位置，用于存储信息和数据。由于它存储在硬盘上，我们也可以通过 Python 编程方法和技术来执行读写操作。Python\
    \ 中的文件操作由三个主要方面组成：打开文件、读写以及关闭文件。\n\n`open()` 是 Python 编程语言中的内置函数，它有两个参数称为 `filename`\
    \ 和 `mode`。可以实现以下方法对文件执行不同的操作：\n\n* “r” = 打开或读取文件。\n* “w” = 写入文件，如果不存在则创建一个新文件。\n\
    * “a” = 打开文件进行追加写入，如果不存在则创建一个新文件。\n* “x” = 创建新文件，如果文件已存在则返回错误。\n* “t” = 以文本模式打开。\n\
    * “b” = 以二进制模式打开。\n* “+” = 打开文件以读写为目的。\n\n实现这些方法的语法：\n```python\nF = open(\"sample,.txt\"\
    )\nF = open(img.jpg, “r”)\n```\n\n要关闭文件，我们可以使用 `f.close()` 函数。\n\n### 在 Python\
    \ 中读取文件\n通过 Python 编程语言读取特定文件是非常简单的，我们可以实现 `read(size,)` 方法。例如：\n\npython\n>>>\
    \ f = open(\"sample,.txt\",'r')\n>>> f.read(4) # 读取前 4 个数据\n'This'\n>>> f.read(4)\
    \ # 读取接下来的 4 个数据\n' is '\n>>> f.read() # 读取到文件末尾的所有内容\n'My first file,\\nthis\
    \ file,\\ncontains four lines\\n'\n>>> f.read()\n```\n\n### 在服务器上打开文件\n使用内置的 `open()`\
    \ 函数打开文件，可以使用以下语法：\n```python\nF = open(\"sample,file,.txt”, “r”)\nPrint(f.read())\n\
    ```\n\n### 读取特定行\n为了读取特定行，我们可以实现 `readline,()` 函数：\n```python\nF = open(\"sample,file,.txt”,\
    \ “r”)\nPrint(f.readline())\n```\n\n### 写入现有文件\n以下 Python 编程语法将打开示例文件并追加内容：\n\
    ```python\nF = open(\"sample,file.txt\", \"a\")\nF.write(\"update, your content\"\
    )\nF.close()\n```\n\n### 追加后打开并读取文件\n```python\nF = open(\"sample,file.txt\",\
    \ \"r\")\nPrint(f.read())\n```\n\n### 创建文件\n要创建一个新文件，将使用 `open()` 方法，它可以创建文件。创建语法为：\n\
    ```python\nF = open(\"new,file”, “w”)\n```\n\n### 删除文件\n要删除现有文件，应该使用 `os.remove()`\
    \ 函数，语法如下：\n```python\nimport os\nif os.path.exists(\"new,file\"):\n    os.remove(\"\
    new,file\")\n```\n\n### 检查文件是否存在\n检查文件是否存在，使用 `os.path.exists()` 函数：\n```python\n\
    import os\nif os.path.exists(\"new,file\"):\n    print(\"文件存在\")\nelse:\n    print(\"\
    文件不存在\")\n```\n\n### 使用 Try-Except-Finally 进行错误处理\n在 Python 中，错误处理使用 `try`、`except`\
    \ 和 `finally` 块完成。`try` 块包含可能抛出错误的代码，`except` 块在错误发生时处理错误，而 `finally` 块无论是否发生错误都会执行。\n\
    \n```python\ntry:\n    result = 1 / 0\nexcept ZeroDivisionError:\n    print(\"\
    不能除以零！\")\nfinally:\n    print(\"执行结束。\")\n```\n\n"
