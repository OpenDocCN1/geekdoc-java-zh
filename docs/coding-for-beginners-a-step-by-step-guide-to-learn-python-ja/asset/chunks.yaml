  trans: "\n引用数据类型存储的是变量的引用，而不是实际数据。通过使用多个变量，引用类型可以指向一个内存位置，如果该内存位置被其中一个变量更改，另一个变量将自动改变其值。\n\
    \n### 3. 对象类型 (Object type)\n\n对象数据类型被认为是 `C#` 中使用的所有数据类型的基类。此外，对象类型还可以被赋值其他类型、引用类型、用户定义类型和值类型的值。\n\
    \n### 4. 指针数据类型\n\n指针数据类型包含变量值的内存地址，其语法如下：\n\n`Type* identifier;`\n\n### 运算符\n\
    \n`C#` 使用运算符的方式与 `c` 和 `c++` 等其他主流编程语言相同。内置运算符集包括算术运算符、关系运算符、位运算运算符、逻辑运算符、杂项运算符和赋值运算符。\n\
    \n### 函数与方法\n\n在 `c#` 编程语言中，函数允许程序员封装代码的特定部分，并在代码的其他部分复用它。由于它避免了重写代码的需要，我们可以从多个地方访问函数并执行所需的操作。`c#`\
    \ 中的函数使用以下语法声明：\n\n```<visibility> <return type> <name>(<parameters>)\n{\n   \
    \ <function code>\n}\n```\n\n被称为成员函数或类成员的函数在 `c#` 编程语言中也称为方法。通常，`c#` 中有两种方法，称为实例方法和静态方法。函数可以返回任何类型的数据，并且可以执行多条语句，如读取、跟随和运行。\n\
    \n在 `c#` 中使用函数的示例程序：\n\n```\nUsing system;\n\nClass return2\n{\n    static string\
    \ lastfirst(string firstname, string lastname)\n    {\n        string separator\
    \ = \", \";\n        string result = lastname + separator + firstname;\n     \
    \   return result;\n    }\n    static void main()\n    {\n        console.WriteLine(lastfirst(\"\
    john\", \"william\"));\n        console.WriteLine(lastfirst(\"james\", \"lewis\"\
    ));\n    }\n}\n```\n\n### 数组、字符串和结构体\n\n#### 数组\n\n数组用于存储具有相同数据类型的固定大小元素集合。由于具有连续的内存位置，可以使用以下语法在\
    \ `c#` 编程语言中声明数组：\n\n`Datatype[] arrayname;`\n\n初始化：\n`Int [] age = new age[20]`\n\
    \n在 `c#` 编程语言中声明和访问数组的示例程序：\n\n```\nUsing system;\n\nNamespace arrayapplication\n\
    {\n    class myarray\n    {\n        static void main(string [] args) {\n    \
    \        int [] n = new int[20]; /* n 是一个包含 20 个整数的数组 */\n            int i,j;\n\
    \            /* 初始化数组 n 的元素 */\n            for ( i = 0 ; i < 20 ; i++ ) {\n \
    \               n[ i ] = i + 100 ;\n            }\n            /* 输出每个数组元素的值 */\n\
    \            for(j = 0 ; j < 10 ; j++ ) {\n                console.WriteLine(\"\
    element[{0}] = {1}\", j, n[j]);\n            }\n            console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n#### 字符串\n\n我们可以在 `c#` 编程中使用 `system.string` 关键字来创建字符串。为了创建一个字符串对象，我们可以采用不同的方法，例如将字符串字面量赋值给字符串变量、使用连接运算符\
    \ (`+`)、调用格式化方法转换值，或使用字符串构造函数。\n\n语法：\n`String []array={\"this\", \"c#\", \"programming\"\
    };`\n\n#### 类与对象\n\n类被定义为一种类型对象的表示和数据类型的蓝图。在 `c#` 编程中，类的定义以 `class` 关键字、类名和类体开始。类中的访问权限允许对成员进行访问，其中\
    \ `c#` 程序中类的默认访问权限是 `internal`（内部的）。要访问成员，我们可以使用 `.` 运算符。它还将对象的名称与成员的名称链接起来。类也被认为是一种引用类型，在使用\
    \ `new` 运算符创建类的实例之前，该变量包含 `null` 值。在 `c#` 中声明类，可以遵循下面的语法：\n\n```\nPublic class\
    \ student\n{\n// 属性，方法\n}\n```\n\n示例：\n`Myclass student = new myclass();`\n`Myclass\
    \ student2 = student;`\n\n包含不同的数据成员和函数\n\n```\nPublic class student\n{\n    public\
    \ int id = 0;\n    public string name = \"\";\n    public student()\n    {\n \
    \       // 构造函数语句\n    }\n    public void getstudentdetails(int uid, string uname)\n\
    \    {\n        id = uid;\n        name = uname;\n        console.WriteLine(\"\
    id: {0}, name: {1}\", id, name);\n    }\n    public int designation { get; set;\
    \ }\n    public string location { get; set; }\n}\n```\n\n创建对象\n\n在 `c#` 编程中，对象完全基于类。类定义了一种类型的对象。它也被称为类的实例，可以使用以下语法创建：\n\
    \n`student object1 = new student();`\n\n一旦创建了类的实例，对象引用就会自动返回。例如：\n\n`student object2\
    \ = new student();`\n`student object3 = object2;`\n\n以下程序显示了如何在 `c#` 编程语言中创建对象：\n\
    \n```\nUsing system;\n\nNamespace tutlane\n{\n    Class program\n    {\n     \
    \   static void main(string [] args)\n        {\n            users user = new\
    \ users(\"harry potter\", 20);\n            user.getstudentdetails();\n      \
    \      console.WriteLine(\"press enter key to exit..\");\n            console.ReadLine();\n\
    \        }\n    }\n    Public class users\n    {\n        public string name {\
    \ get; set; }\n        public int age { get; set; }\n        public users(string\
    \ name, int age)\n        {\n            Name = name;\n            Age = age;\n\
    \        }\n        public void getstudentdetails()\n        {\n            console.WriteLine(\"\
    name: {0}, age: {1}\", name, age);\n        }\n    }\n}\n```\n\n### 继承与多态\n\n\
    #### 继承\n\n继承是 `c#` 的主要部分，因为它是一种面向对象的编程语言，允许程序员重用需要相同功能的类。继承的工作方式类似于父子。父类被认为是基类，而子类被称为派生类，它继承了父类的所有功能。\n\
    \n语法：\n\n```\n<access-specifier> class <base_class>\n{\n    ...\n}\n\nClass <derived_class>\
    \ : <base_class>\n{\n    ...\n}\n```\n\n多级继承：\n\n```\nPublic class a\n{\n// 实现\n\
    }\nPublic class b : a\n{\n// 实现\n}\nPublic class c : b\n{\n// 实现\n}\n```\n\n####\
    \ 多态\n\n多态是指通过单一操作执行多种功能的技术。静态多态在编译时完成，而动态多态是在运行时决定的。\n\n在静态多态中，`c#` 允许程序员实现以下两种方法：\n\
    \n##### 函数重载\n\n函数重载在给定的范围内为同一个函数名提供了多个定义。此外，函数定义应该在类型上有所不同，以便你重载具有不同返回类型的函数声明。\n\
    \n##### 构造函数\n"
- fmt: "\nIn C# programming, a constructor is automatically called whenever a struct\
    \ or class is created. As a class can have multiple constructors to handle different\
    \ arguments, constructors allow the programmers to set limit instantiation and\
    \ default values as well.\n\n### Syntax for creating constructors\n\n```cs\nPublic\
    \ class person\n{\n    private string last;\n    private string first;\n\n   \
    \ public person(string lastname, string firstname)\n    {\n        last = lastname;\n\
    \        first = firstname;\n    }\n    // remaining implementation of person\
    \ class.\n}\n```\n\nThe three type of constructors used in C# programming are\
    \ known as instance constructors, static constructors, and private constructors.\n\
    \n### Exception handling\n\nExceptions are how to transfer control from one segment\
    \ of the program to another. Generally an exception is considered a problem that\
    \ is seen during the execution of a program. To catch the circumstance, C# gives\
    \ multiple exception handling approaches known as `try`, `catch`, `throw`, and\
    \ `finally`.\n\nA `try` block outlines a block of code for which the exception\
    \ is being used where the `catch` exception allows the programmer to handle the\
    \ problem from anywhere in the program. `throw` exception is launched whenever\
    \ a problem is faced where the `finally` exception is used to execute a provided\
    \ set of statements.\n\n### Syntax for using exception handling in C# programming\
    \ language\n\n```cs\nPublic class person\n{\n    private string last;\n    private\
    \ string first;\n\n    public person(string lastname, string firstname)\n    {\n\
    \        last = lastname;\n        first = firstname;\n    }\n    // remaining\
    \ implementation of person class.\n}\n```\n\n### Multithreading\n\nIn C# programming\
    \ language, a thread is considered the execution path for a program as it defines\
    \ a specific flow control and is responsible for defining execution paths as well.\
    \ As they are lightweight processes, a thread can save wastage of CPU cycle, and\
    \ in return boost efficiency of the program.\n\nThere are four main states in\
    \ the life cycle of a thread which include unstarted state, ready state, not runnable\
    \ state, and dead state. Threads can be created, managed, and destroyed by implementing\
    \ specific C# methods.\n\n### File I/O\n\nC# provides different classes to operate\
    \ with the file system and data handling. As these classes can be used to open\
    \ files, access files, access directories, and update existing files, C# includes\
    \ a specific `File` class to perform all of the I/O operations.\n\nThe class names\
    \ with details are briefed as follows:\n\n*   **File**: `File` is a static class\
    \ which provides different operations including move, delete, create, open, copy,\
    \ read, and write.\n*   **FileInfo**: The `FileInfo` class performs the same as\
    \ the static `File` class and programmers can read and write operations by writing\
    \ the code manually for a specific file.\n*   **Directory**: The `Directory` class\
    \ is also static and provides support for creating, deleting, accessing, and moving\
    \ subdirectories within a file.\n*   **DirectoryInfo**: The `DirectoryInfo` class\
    \ provides different instance methods for accessing, deleting, moving, and creating\
    \ subdirectories.\n*   **Path**: The `Path` static class delivers functionality\
    \ for changing the extension of a file, retrieving extension of a file, and retrieving\
    \ the absolute physical path of a specific file.\n*   **FileSystem**: The `FileSystem`\
    \ class in the `system.io` namespace is used to create, write, and close a specific\
    \ file through C# programming language.\n\n### Syntax for creating a FileStream\
    \ class and object\n\n```cs\nFileSystem <object_name> = new FileStream(<file_name>,\
    \ <file_mode_enumerator>, <file_access_enumerator>, <file_share_enumerator>);\n\
    ```\n\n#### Advanced file operations in C# include:\n*   Reading and writing into\
    \ text files.\n*   Reading and writing into binary files.\n*   Manipulating the\
    \ Windows file system.\n\nRemember that `system.io.stream` is an abstract class\
    \ which provides all of the standard methods required to transfer bytes to the\
    \ source. Classes which inherit `stream` class to perform certain read/write operations\
    \ include `FileStream`, `MemoryStream`, `BufferedStream`.\n\n### Advantages of\
    \ learning C#\n\nThe availability of built-in functions makes it easy to solve\
    \ problems. With the availability of advanced libraries, C# is robust. The syntax\
    \ is simple for programmers to build different types of applications. C# is easy\
    \ to learn because it has clearly defined syntax and data types, allowing for\
    \ rapid development. It also supports automatic garbage collection. C# is a high-level,\
    \ object-oriented language that allows programmers to build applications without\
    \ any hassle.\n\n### Features of Python\n\nPython is a high-level, object-oriented\
    \ language that was created by Guido van Rossum in 1991. It supports interactive\
    \ mode and can be used directly for system calls. The language is easy to learn\
    \ because it has clearly defined syntax and data types. Python also supports automatic\
    \ garbage collection. The up-to-date binaries, source code, news, and documentation\
    \ can be found at the official website: [https://www.python.org/](https://www.python.org/).\n\
    \n### Key keywords in Python\n\nThe keywords include: `del`, `else`, `and`, `assert`,\
    \ `in`, `raise`, `from`, `continue`, `if`, `finally`, `not`, `pass`, `as`, `return`,\
    \ `not`, `yield`, `break`, `except`, `import`.\n"
