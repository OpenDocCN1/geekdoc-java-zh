  trans: '

    虽然编写易于理解的代码并满足程序需求是计算机编程的主要部分，但还有一些基本的技巧和方法可以提高程序员的效率。从最关键的考虑要点开始，程序员应该避免向函数传递很长的参数列表，并仅尝试使用
    `int`、指针或 `void` 函数类型。此外，不要将 `chars` 转换为其他数据类型，因为 `char` 变量可以位于内存的任何位置。


    此外，全局变量绝不能用小函数进行初始化，并尽量减少对浮点数数学运算的使用。这将缩短执行时间并消耗更内存。当代码达到数千行时，全局变量和循环会使程序员难以处理应用程序，任何微小的更改都可能导致巨大的问题。


    在方法或函数内部编写 `switch case` 语句、循环和 `try-catch` 是一种理想的方法。记住，方法也应该写在 `class` 和函数定义内部。此外，通过使用合适的结构来组织应用程序是一个很好的方法，这也能提高编码标准。


    最后但同样重要的是，还可以考虑版本控制软件来提高应用程序性能并交付更新。虽然这是专业程序员使用的方法，但像 `mercurial` 或 `git` 等工具对初学者来说容易学习和使用。


    在编写代码时，避免深层嵌套并限制行长度，因为这会使代码难以阅读。


    ## 强化你的基础技能


    为了成为一名优秀的程序员，你必须意识到计算机编程中所有关键和主要的概念。了解算法和数据结构的基础知识是提高解决问题能力的极佳方法。此外，编写单元测试是另一种提升思维和编码技能的完美方法。在你完成编码后，建议进行深入代码审查，并发现任何错误或需要改进的地方。作为回报，这项活动也将提高应用程序的性能和效率。


    代码必须始终保持简单且意义。通过使用适当的命名规范，你可以毫不费力地替换变量或方法。记住，为你的应用程序创建一个特定的文件夹和文件可以带来巨大的收益，因为你可以轻松地进行维护和调试。学习编程基础是培养强大的开发和分析能力的关键方面。


    此外，尝试通过解决编程练习和编写简单代码来实践你的编码技能。这不仅会提高你的编程技能，你还能开发出高效有效的新解决方案。花时间学习编程基础也更容易适应最新技术并学习新的编程方法。通过学习和实现新的方法、函数和手段，可以使编程变得有趣。


    ## 结论


    《零基础学编程》（coding for absolute beginners）的设计和编写旨在为初学者提供计算机编程的有价值知识、信息和原则。本书彻底涵盖了主要的编程语言，并为实现给概念和发现提供了正确的指南。


    编写计算机代码需要开发者遵循预定义的语法和流程。根据项目需求，可以选择一种易于实现的编程语言，并关注现工具和技术。计算机编程由多个任务组成，包括编写源代码、测试、系统实现、方法论、调试和功能实现。


    在读完这本书后，我确定新手程序员可以培养强大的分析和思维能力，并对每种语言的给定概念有深入理解。这本书是在大量的研究和事实调查后编写的，以便向读者传递正确的信息和语法。在阅读并理解了书中提供的概念后，使用任何高级语言开发桌面应用程序、Web
    应用程序或程序将不再是一个问题。


    我希望，宝贵的读者能够通过阅读本手册的章节，学习、适应并实现计算机编程技术，并开发出敏锐的编码技能。《零基础学编程》以简单易懂的方式对每种编程语言的所有主要和次要解释进行了阐述。

    '
