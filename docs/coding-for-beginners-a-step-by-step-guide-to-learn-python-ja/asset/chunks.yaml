  trans: "\n\nIf-else: `if` 语句用于检查给定条件为真还是假。在 Java 编程语言中有不同类型的 `if` 语句，分别称为 `if` 语句、`if-else`\
    \ 语句、`if-else-ladder` 语句和嵌套 `if` 语句。\n\n这里是一个简单的 Java 程序，用于演示 `if` 语句：\n\n```java\n\
    Public class marks {\n    public static void main (string [] args) {\n       \
    \ int marks = 50;\n        if (age < 50) {\n            system.out.print (\"your\
    \ marks are less than 50\");\n        }\n    }\n}\n```\n\n上述程序的输出为：your marks\
    \ are less than 50。\n\n`if-else`: 该语句用于测试条件，如果结果为真，则执行 `if` 块；如果为假，则执行 `else`\
    \ 语句。\n\n`Switch`: `switch` 语句用于从多个条件中执行单个语句。该语句可以与包括 `short`、`int`、`long`、`byte`、`string`\
    \ 和 `long` 在内的数据类型一起工作。\n\n`switch` 语句的语法如下：\n\n* `Switch (expression){`\n* `Case\
    \ value,1:`\n* `//code to be executed;`\n* `Break ; //`\n* `Case value,2:`\n*\
    \ `//code to be executed;`\n* `Break ;`\n* `Default :`\n* `Code to be executed\
    \ if all cases are not matched;`\n* `}`\n\n# 循环\n\n编程语言中通用的循环有三种。\n\n* `For` 循环\n\
    * `While` 循环\n* `Do-while` 循环\n\n### For 循环\n`For` 循环用于在程序的一部分执行迭代。如果迭代次数是固定的，建议在程序中使用\
    \ `for` 循环。\n\n### While 循环\n`While` 循环具有重复单个或一组语句的特点，以测试给定条件为真还是假。它用于迭代次数不是固定的情况。\n\
    \n### Do while 循环\n`do while` 循环用于多次迭代程序的一部分。如果迭代次数不是固定的，则要求至少执行一次程序。\n\n需要特定的循环控制语句来将执行顺序更改为普通序列。Java\
    \ 编程语言中使用的两种控制语句包括：\n\n* `Break` 语句：终止 switch 或循环并开始下一个循环。\n* `Continue` 语句：允许循环重新测试其条件并跳过主体的剩余部分。\n\
    \n# 决策\n\n决策结构的特点是在给定场景下需要测试的一个或多个条件。如果条件为真，则可以执行下一条语句；而如果给定条件为假，程序将终止。下面的图表正确地显示了决策过程实际上是如何运作的：\n\
    \n# 字符、字符串、数组和正则表达式\n\nJava 编程语言利用了字符包装类，并提供了多个用于操作字符的静态方法。要创建一个字符对象，你需要遵循以下语法：\n\
    \n`Character ch = new character (‘a’)`\n\n编译器会自动创建一个字符对象，如果你向方法传递任何基本类型 char，编译器将通过该语言的各种方法将\
    \ char 转换为 character。\n\n正如我们讨论过的字符串的重要性和功能，Java 平台也提供了支持。程序员可以通过多种方式操作字符串。在 Java\
    \ 语言中创建字符串的示例代码如下：\n\n```java\nPublic class newstring {\n    Public static void\
    \ main (string args []) {\n        char[] stringarray = {'s', 't', 'r', 'i', 'n',\
    \ 'g'};\n        string stringstring = new string (stringarray);\n        system.out.println\
    \ (stringstring);\n    }\n}\n```\n\n该程序的输出为：string。\n\n此外，我们还可以使用 Java 语言中简单的连接方法来连接字符串，如下：\n\
    \n`String1.concat(string2)`\n\n要在 Java 中创建字符串对象，程序员可以选择字面量或关键字方法。数组是每个编程语言的重要部分，因为数组允许程序员处理并将数据存储到变量中。你也可以将数组视为同一类别变量的集合。要声明数组，你可以遵循下面定义的简单语法：\n\
    \n`Datatype[] arrayvar`\n\n在 Java 中创建数组非常简单，可以使用以下语法：\n\n`Arrayvar = new datatype[size];`\n\
    \n该语句将创建一个给定大小的数组，并将数组的引用赋值给给变量。通常使用 `for` 循环或 `foreach` 处理数组，因为数组内的元素具有相同的类型和大小。\n\
    \n用于排序、比较和填充数组元素的静态方法：\n\n* `Public static int binarysearch(object a, object key)`\n\
    * `Public static void fill(int [] a, int val)`\n* `Public static boolean equals(long\
    \ a, long a2)`\n* `Public static void sort(object a)`\n\n# 正则表达式\n\n正则表达式是一个用于定义字符串模式的\
    \ API，也用于搜索、编辑和处理文本。Java 有预定义的 `java.util.regex` 包，它由 `pattern` 类、`matcher` 类和\
    \ `syntaxexception` 对象组成。`pattern` 类要求开发者从 `compile()` 方法开始并返回 `pattern` 对象，因为它没有公共构造函数。对于\
    \ `matcher` 类，`matcher` 对象通过 `matcher()` 方法对输入字符串查找并比较操作，以获得匹配。`syntaxexception`\
    \ 用于指示正则表达式模式中的错误或误。\n\n# 文件和 I/O\n\nJava 编程语言具有一个内置包，负责数据输入输出操作。该流被称为 `java.io`，并支持处理数据的多种操作和功能。Java\
    \ 中有两种类型的流，称为输入流和输出流。\n\n输入流用于读取数据，而输出流用于向文件写入数据。\n\nJava 语言具有各种 i/o 数据处理流，包括：\n\
    \n* `Byte` 流\n* `Character` 流\n* `Standard` 流\n* `File` 输入流\n* `File` 输出流\n\n\
    # 面向对象 Java\n\n面向对象编程是一种使用类和对象的方法。通过使用继承、多态、封装和抽象等概念，程序员可以开发 Java 应用和程序。\n\n#\
    \ 继承\n\n继承是 Java 编程语言中的特性，允许它继承另一个类的特性和属性。这可以在子类和父类之间进行。被继承的类称为父类，而继承其他类属性类称为子类。\n\
    \n要在 Java 中使用继承，你可以遵循下面的语法：\n\n```java\nClass derived-class extends base-class\n\
    {\n    //methods\n}\n```\n\n# 多态\n\n多态允许以不同方式执行同一个操作的概念。Java 中有两种多态：编译时多态和运行时多态。\n\
    \n### 编译时多态\n编译时多态通过方法重载实现。方法重载发生在类中具有相同名称但参数不同的方法。\n\n### 运行时多态\n运行时多态通过方法重写实现。方法重写发生在子类为其父类中已定义的方法提供特定实现时。\n\
    \n"
- fmt: "\nThe technique of doing a single task in multiple ways is known as polymorphism.\
    \ In `java programming`, we can use `method overriding` and `method overloading`\
    \ techniques to achieve polymorphism. It is essential to know that an object can\
    \ also be accessed through a reference variable, and once it has been reassigned\
    \ to other objects, the type of reference variable can be used to determine the\
    \ method that is to be used to access the object.\n\nFor example:\n\n```java\n\
    public interface school{}\n\npublic class student{}\n\npublic class john extends\
    \ student implements school{}\n```\n\nIn the above case, `john` is known to be\
    \ polymorphic because it has multiple inheritance and we can apply the reference\
    \ variable for the same object as well.\n\n# Abstraction\n\nAn abstract class\
    \ is one, which includes an `abstract` keyword in its declaration and it can or\
    \ might not contain abstract methods. In a case where a class has an abstract\
    \ method, it cannot be instantiated and the programmer will have to inherit it\
    \ from another class to implement the abstract method.\n\n# Encapsulation\n\n\
    Encapsulation in java programming` is the process of wrapping data and methods\
    \ together. Generally, the variable of one class will be hidden from another class\
    \ and it can only be accessed through the methods that are being used in their\
    \ current class. The advantages of encapsulation are that a class could be made\
    \ read only or write only and it can also have total control over the data stored.\n\
    \n# Recursion\n\nRecursion is a technique referred to a method which calls itself\
    \ within the program. The `recurse()` method is called from the `main` method\
    \ and can also be called from the same `recurse()` method as well. This process\
    \ continues until the given condition is met and if the case is not satisfied,\
    \ infinite recursion occurs.\n\nHere is a simple implementation of recursion in\
    \ java:\n\n```\nClass sample {\n    static void printfun(int test) {\n       \
    \ if (test < 1)\n            return;\n        else {\n            system.out.printf(\"\
    %d \", test);\n            // state 2\n            printfun(test - 1);\n     \
    \       system.out.printf(\"%d \", test);\n            return;\n        }\n  \
    \  }\n\n    public static void main(string [] args) {\n        int test = 3;\n\
    \        printfun(test);\n    }\n}\n```\n\n## Advantages of recursion\n\nThere\
    \ are several complex programs in which writing recursive code can deliver several\
    \ benefits. As it provides a simple and clean way to write code, developers can\
    \ perform operations of different kinds without any hassle.\n\n# Abstract class\
    \ and abstract methods\n\n### Abstract class\n\nIn java programming, an abstract\
    \ class is known as a class which cannot be initiated and is declared by using\
    \ the `abstract` keyword.\n\nHere is the syntax for declaring an abstract class\
    \ `student` in java:\n\n```java\nAbstract class student {\n    // methods and\
    \ attributes\n}\n```\n\nRemember that we cannot create objects of an abstract\
    \ class. Doing so will generate a compilation error.\n\n### Inheritance of abstract\
    \ class\n\nHere is a sample java program illustrating the inheritance of an abstract\
    \ class:\n\n```\nAbstract class student {\n    public void displayinfo() {\n \
    \       system.out.println(\"i am a student\");\n    }\n}\n\nClass grade extends\
    \ student {\n}\n\nClass main {\n    public static void main(string [] args) {\n\
    \        grade g1 = new grade();\n        g1.displayinfo();\n    }\n}\n```\n\n\
    ### Abstract method\n\nTo create an abstract method in java, the same keyword\
    \ `abstract` is used. The syntax is defined as follows:\n\n```java\nAbstract void\
    \ move();\n```\n\n# Chapter three: sql and database\n\n## What is a database?\n\
    \nA database is a collection of data which can be accessed, managed, and updated.\
    \ Before entering a brief discussion of database, it is important that we understand\
    \ what data means and how it can be processed. Data is generally defined as a\
    \ collection of records and facts with which we can perform calculations and reasoning.\
    \ To protect, save, deliver and organize data, databases are created and the system\
    \ that manages the process is called database management system (`db`).\n\n##\
    \ Database management system (db) concepts\n\nA database management system consists\
    \ of multiple programs that allow users to access the database and handle data\
    \ through different processes. As it is generally designed to control access to\
    \ the database, there are various operations and functionalities introduced in\
    \ the db. There are different types of db:\n\n1. **Relational**: This category\
    \ of db defines database relations in the form of tables.\n2. **Object oriented\
    \ relational**: Object oriented relational allows data to be stored in the form\
    \ of objects along with their attributes.\n3. **Network**: Network db features\
    \ many-to-many relations and is generally used for complex database structures.\n\
    4. **Hierarchical**: Hierarchical db follows the parent-child relationship to\
    \ store data and has a structure similar to that of a tree with nodes that represent\
    \ various fields.\n\n## Database environment and architecture\n\nThe database\
    \ environment is known as a collection of components which are responsible for\
    \ data handling, management, and use of data. As databases are generally stored\
    \ in computers, the hardware and computer peripherals used to manage the process\
    \ also include db tools such as sql server.\n\nThe architecture of a database\
    \ or db is usually classified into three major categories: centralized, decentralized,\
    \ and hierarchical. Database systems can be client-server or centralized and can\
    \ also be designed to be accessed by parallel computer architectures. The three-tier\
    \ architecture of a db is defined as follows:\n\n* Presentation tier\n* Application\
    \ tier\n* Database tier\n\n# Types of databases\n\nThere are different types of\
    \ databases that are classified as per their organizational approach and functionality.\n\
    \n### Relational database\n\nA relational database is where the data is defined\
    \ organized and accessed in multiple ways. Being a tabular database, the table\
    \ consists of rows and columns which is managed through query language (`sql`).\n\
    \n### Distributed database\n\nThe distributed database has its data stored at\
    \ multiple sites which are interconnected with each other through communication\
    \ links. This database is further classified into homogeneous and heterogeneous\
    \ categories. For the homogeneous distributed database system, the same type of\
    \ hardware, os, and database applications are connected together whereas as for\
    \ the heterogeneous distributed database system, the system can be different for\
    \ each location and connection.\n"
