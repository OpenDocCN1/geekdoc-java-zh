  trans: "\nCSS 中使用了两种类型的列表，称为有序列表（ordered lists）和无序列表（unordered lists）。在有序列表中，所有的列表项都用数字或字母标记，而在无序列表中，列表项通常用项目符号标记。列表的值可以使用如\
    \ `circle`、`decimal`、`lower-roman`、`upper-roman`、`decimal-leading-zeros`、`lower-alpha`、`upper-alpha`\
    \ 和 `square` 等值来创建。\n\n例如：\n\n```html\n<html>\n<head>\n<style>\nul.a {\n  list-style-type:square;\n\
    }\nol.c {\n  list-style-type:lower-alpha;\n}\n</style>\n</head>\n<body>\n  <h2>Css\
    \ 有序与无序列表</h2>\n  <p>无序列表</p>\n  <ul class=\"a\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ul>\n  <ul class=\"b\">\n    <li>one,</li>\n    <li>two</li>\n\
    \    <li>three,</li>\n  </ul>\n  <p>有序列表</p>\n  <ol class=\"c\">\n    <li>one,</li>\n\
    \    <li>two</li>\n    <li>three,</li>\n  </ol>\n  <ol class=\"d\">\n    <li>one,</li>\n\
    \    <li>two</li>\n    <li>three,</li>\n  </ol>\n</body>\n</html>\n```\n\n输出：\n\
    Css 有序与无序列表\n无序列表\n● one,\n● two\n● three,\n● one,\n● two\n● three,\n有序列表\nA.\
    \ one,\nB. two\nC. three,\n1. one,\n2. two\n3. three,\n\n### 图标\n通过使用 html 的图标库，我们也可以通过\
    \ css 添加不同类型的图标。这些图标包括 font awesome 图标、bootstrap 图标和 google 图标。\n\nFont awesome\
    \ 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n```\n\nBootstrap 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    >\n```\n\nGoogle 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
    >\n```\n\n示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<link rel=\"stylesheet\"\
    \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
    >\n</head>\n<body>\n  <h1>css 图标</h1>\n  <i class=\"fa fa-cloud\" style=\"font-size:32px;\"\
    ></i>\n  <i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n  <i class=\"\
    fa fa-file\" style=\"font-size:32px;\"></i>\n  <i class=\"fa fa-car\" style=\"\
    font-size:32px;\"></i>\n  <i class=\"fa fa-bars\" style=\"font-size:32px;\"></i>\n\
    </body>\n</html>\n```\n![image_rsrc9FY.jpg](img/image_rsrc9FY.jpeg)\n\n### 下拉菜单\n\
    我们也可以通过 css 创建下拉菜单。与 html 元素相同，下拉菜单由一个无序列表和嵌套列表组成。列表用于创建下拉结构，例如：\n\n```html\n\
    <html>\n<head>\n<title>dropdown css</title>\n</head>\n<body>\n  <nav>\n    <ul>\n\
    \      <li class=\"level-1\">\n        <a href=\"#\">list\n          <ul>\n  \
    \          <li><a href=\"#\">page 1</a></li>\n            <li><a href=\"#\">page\
    \ 2</a></li>\n            <li><a href=\"#\">page 3</a></li>\n            <li><a\
    \ href=\"#\">page 4</a></li>\n          </ul>\n        </a>\n      </li>\n   \
    \ </ul>\n  </nav>\n</body>\n</html>\n```\n输出：\n![image_rsrc9FZ.jpg](img/image_rsrc9FZ.jpeg)\n\
    \n### 层级与可见性\n通过 css，我们可以通过实现 `z-index` css 属性创建多个层级的 div 元素。例如：\n\n```html\n\
    <html>\n<head></head>\n<body>\n  <div style=\"background-color:blue; width:300px;\
    \ height:100px; position:relative; top:10px; left:80px; z-index:2\"></div>\n \
    \ <div style=\"background-color:red; width:300px; height:100px; position:relative;\
    \ top:-60px; left:35px; z-index:1\"></div>\n  <div style=\"background-color:black;\
    \ width:300px; height:100px; position:relative; top:-220px; left:120px; z-index:0\"\
    ></div>\n</body>\n</html>\n```\n输出：\n![image_rsrc90.jpg](img/image_rsrc90.jpeg)\n\
    \n### 可见性\n通过 css，我们可以通过实现 `visibility` css 属性来隐藏元素。例如，visibility 属性定义的值包括 `visible`、`hidden`\
    \ 和 `collapse`。\n\n```html\n<p>文本可见</p>\n<p style=\"visibility:hidden;\">文本不可见</p>\n\
    ```\n\n### 布局与动画\nCss 动画允许元素从一种样式变为另一种样式。使用 css 动画，我们通常需要通过 `@keyframes` 指定一些关键帧。例如：\n\
    \n```css\n@keyframes sample {\n  from {background-color:blue;}\n  to {background-color:brown;}\n\
    }\n/* 应用动画的元素 */\ndiv {\n  width: 100px;\n  height: 100px;\n  background-color:\
    \ blue;\n  animation-name: sample;\n  animation-duration: 4s;\n}\n```\n\n### 如何有效地使用\
    \ css\n通过 css，我们还可以通过实现其他 css 自定义属性和元素来提高网页的视觉显示效果和吸引力。虽然学习和实现所有 css 属性至关重要，但使用良好的编辑器有助于创建完美的网页设计。此外，\
    \ css 方法应保持一致，以避免问题。\n\n在编写 css 时，你还应该避免使用内联代码，并将样式或属性放置在外部样式表中。检查你的代码在最新的浏览器（如\
    \ Internet Explorer、Chrome 和 Safari）中是否正常运行是一个很好的主意，这样可以确保网页的正确显示和格式。此外，css 代码还可以作为模板用于其他项目，你可以将现有的代码回收到新代码中。多个类也可以通过分离来实现，我们可以从继承中受益。\n"
