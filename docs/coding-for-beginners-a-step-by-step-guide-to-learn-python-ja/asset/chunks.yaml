    HyperTextText Markup Language, (HTML) is a standard markup language, used to create
    websites to display colors, fonts, displays graphics, media, and images. HTML
    is comprised of different tags that can be used to describe the structure of a
    web page and tell the browser to display the content over the internet.


    ### What are tags?


    Tags give instructions to web browsers regarding the structure, display, and content
    of any web page, as they are defined through enclosed angle brackets: `<>`, tags
    are comprised of attributes and elements. An element is an object on a page, where
    an attribute describes the quality or details of that element. Remember that tags
    are to be used in pairs and opening tag `<tag>` and closing tags are differentiated
    by `</tag>`.


    Your first sample HTML web page will be created by using the following tags:


    ```html

    <html>

    <head></head>

    <body>

    <h1>my first heading</h1>

    <p>my first paragraph</p>

    </body>

    </html>

    ```


    ### Description of tags


    In the above-written HTML document, the `<html>` tag encloses the complete HTML
    document and is comprised of other major tags including `<head>`, `<body>`, and
    `<p>`. The `<head>` tag represents the file’s head where the `<title>` tag is
    used to show the document’s header. `<body>` includes several other tags that
    are to be used to create a web page, such as heading `<h1>` and paragraph `<p>`.


    HTML tags are not case-sensitive, but they should be used in lower case. To define
    the version of HTML, we can use the following tag:


    ```html

    <!DOCTYPE html>

    ```


    Beginners can run HTML pages by using notepad PC and save the file in `.html`
    format. This will allow them to view the webpages in a browser.


    ### Basic tags and attributes


    #### Basic tags


    Each HTML document is supposed to start with a title, heading, and paragraph.
    After the `<body>` tag, the next major tag to be used is `<h1>` or heading tag.
    Depending on your content requirements, heading tags are defined with `<h1>` to
    `<h6>`. For example:


    **Headings:**


    ```html

    <html>

    <body>

    <h1> first heading</h1>

    <h2> second heading</h2>

    <h3> third heading</h3>

    <h4>fourth heading</h4>

    <h5>fifth heading</h5>

    <h6>sixth heading</h6>

    </body>

    </html>

    ```


    Output:

    ![image_rsrc9FJ.jpg](images/image_rsrc9FJ.jpeg)


    **Paragraph**


    For adding content, we need to include paragraphs in the HTML document. For example:


    ```html

    <html>

    <head>

    <h1> heading</h1>

    </head>

    <body>

    <p> first paragraph </p>

    <p> second paragraph </p>

    </body>

    </html>

    ```


    Output:

    Heading

    First paragraph

    Second paragraph


    To add break between a paragraph, we can use the line break tag `<br>`.


    **Summary tag**


    To add summary for the paragraph, the HTML syntax with summary tag is defined
    as follows:


    ```html

    <details>

    <summary>sample text</summary>

    <p> web development tutorials</p>

    </details>

    ```


    **Span**


    Span tag is used to color specific part of a text. For example:


    ```html

    <p> web development is <span style="color:red"> interesting </span> to learn </p>

    ```


    **Select**


    The `<select>` tag is used for selecting one option from a drop down list. For
    example:


    ```html

    <select>

    <option value="red">red</option>

    <option value="blue">blue</option>

    <option value="green">green</option>

    <option value="white">white</option>

    </select>

    ```


    **thead**


    The `<thead>` tag is used to create a group header and is used with `<tbody>`
    and `<footer>` elements. For example:


    ```html

    <table>

    <thead>

    <tr>

    <th>course</th>

    <th>marks</th>

    </tr>

    </thead>

    <tbody>

    <tr>

    <td>engineering</td>

    <td>85</td>

    </tr>

    <tr>

    <td>English</td>

    <td>90</td>

    </tr>

    </tbody>

    <footer>

    <tr>

    <td>sum</td>

    <td>180</td>

    </tr>

    </tfoot>

    </table>

    ```

    ![image_rsrcFK.jpg](images/image_rsrcFK.jpeg)


    #### Formatting tags


    Texts within an HTML document can be formatted to different styles, fonts, and
    sizes. The tags to format headings, paragraphs, and tables are as follows:


    **Bold**


    Any text written between `<b>` and `</b>` tags is displayed in bold style. For
    example:


    ```html

    <p> <b> development </b> </p>

    ```

    Output: **development**


    **Italic**


    Any text written between `<i>` and `</i>` tags is displayed in italic style. For
    example:


    ```html

    <p> <i> development </i> </p>

    ```

    Output: *development*


    **Superscript/subscript**


    To display content in superscript, we can use `<sup>` tags as `<sub>` and `</sub>`
    tags are used for adding subscripts. For example:


    ```html

    <p> this text uses a <sup> superscript </sup> </p>

    ```

    Output: (superscript)


    **Underline**


    Text written between `<u>` and `</u>` tag is underlined:


    ```html

    <p> <u> sample text </u> </p>

    ```

    Output: <u>sample text</u>


    **Insert and delete tags**


    To insert, `<ins>` and `</ins>` tags are used whereas to delete any text, we can
    use `<del>` and `</del>` tags.


    **Link**


    To add a link within the text, we can use the following tag:


    ```html

    <p> <a href="document location"></a> </p>

    ```


    **Marquee tag**


    The `<marquee>` tag can be used with different attributes including width, height,
    direction, behavior, scrollamount, scrolldelay, loop, bgcolor, hspace, and vspace.
    Demonstration of marquee tag:


    ```html

    <html>

    <head>

    <title>html marquee tag</title>

    </head>

    <body>

    <marquee>sample text</marquee>

    </body>

    </html>

    ```


    #### Container tags


    In HTML, the following container tags are used to format the text:


    | Opening tag | Closing tag | Functionality |

    | :--- | :--- | :--- |

    | `<p>` | `</p>` | Paragraph |

    | `<span>` | `</span>` | To add inline content within a paragraph |

    | `<em>` | `</em>` | Used to give text emphasis |

    | `<ol>` | `</ol>` | Ordered list (numbers) |

    | `<ul>` | `</ul>` | Unordered list (bullets) |

    | `<li>` | `</li>` | List item |


    ### Tables, images, and frames


    #### Tables


    Tables are an essential part of any website, as they help us to illustrate and
    elaborate key information in a suitable manner. In HTML, there are predefined
    tags that can be used to create and design tables.


    **Tags for creating tables in HTML**


    To create a table, we can use the following tag:


    ```html

    <table>.....</table>

    ```


    **Table rows**


    Tag for creating table rows:


    ```html

    <tr>...</tr>

    ```


    **Table height**


    The `<th>` tag for creating a table to display data is `scope="row"` or `scope="column"`.


    **Table data cell**


    The attributes for table cells are `colspan` and `rowspan` for which we need to
    use the tag to span cells across multiple rows and columns.


    #### Images


    Images are an essential part of any website, as they help us to illustrate concepts,
    services, and information in a better way. It is quite simple to insert and manage
    images in HTML.


    **Tag for inserting image:**


    ```html

    <img src="image url" />

    ```


    To set a specific height and width of an image, the following syntax can be used:


    ```html

    <img src="image.png" alt="sample image" width="100" height="100" />

    ```


    **Alignment and border**


    There are three positions to align an image on a webpage known as center, right,
    and left. For this, we can use the `align` attribute. For example:


    ```html

    <img src="image.png" alt="sample image" align="center"/>

    ```


    For creating image border, the attribute is `border`. For example:


    ```html

    <img src="image.png" alt="sample image" border="4"/>

    ```


    **Frames**

