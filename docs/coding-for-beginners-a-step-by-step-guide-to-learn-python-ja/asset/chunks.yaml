  trans: "\n# HTML 元素\n\nHTML 包含了各种类型的语义元素，用于定义网页的不同部分。这些元素包括 `header`、`container`、`section`、`article`、`aside`、`details`\
    \ 和 `footer`。虽然 `css` 是设计网页布局的最佳方法，我们也可以通过这些 HTML 元素来完成过程。\n\n响应式网页设计是通过使用 `html`\
    \ 和 `css` 创建的。这一过程会自动调整网站的大小和布局，使其在桌面电脑、智能手机和平板电脑等所有设备上看起来良好。关于响应性的更多细节，学习 `css`\
    \ 和 `bootstrap` 语言将证明非常有益。\n\n## HTML 模板\n\nHTML 网站模板是开发网站的一种快速方便的方法。由于这种模板是预构建的网站，开发者可以根据需要修改并添加功能。使用\
    \ `html` 模板最大的优势是开发者不需要花费数小时来设计网站，而是专注于实际代码，以满足网站的功能需求。此外，HTML 模板最适合那些无法设计出吸引人的网站的人，因为它也可以根据给定的指令进行自定义。\n\
    \n## 使用 html 的实用提示\n\n在我们讨论了 `html` 的所有主要标签、属性和功能之后，还有一些其他重要方面需要关注，以使你的网站更高效高效。在使用起始\
    \ `html` 标签时，在开始编写元素和属性之前，始终编写对应的闭合标签。例如，`<p>...</p>`。这将确保你的 html 页面在所有浏览器上正常工作，并尝试通过\
    \ `css` 为你的网页设置样式。\n\n在完成所有网页的 `html` 代码编写后，在发布到互联网之前，运行 `html` 验证器。此活动将预先显示任何错误或缺失的标签，以免你的网站在在线发布时缺少功能。此外，注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏。在\
    \ `image` 标签中指定宽度和高度可以帮助你克服这个问题。\n\n虽然表格是用于页面上布局内容的简单方法，但你应该关注 `css` 规则，并通过 `css`\
    \ 构建 html 页面内容。这不仅会让你的网站以更好的方式格式化，你还可以受益于 `css` 定位并增加网站的响应能力。\n\n# 第九章：css\n\n\
    ### 什么是 css？\n\n`Css` 代表“层叠样式表”（casading style sheet），负责控制网页文档的样式、设计和外观。这种设计语言具有简化网页设计过程的能力并增加了网站的灵活性。通过\
    \ `css`，我们可以通过在 `css` 中进行适当调整来改变整个网站的外观、字体、设计、外观和格式。\n\n学习 `css` 和 `html` 一样简单，因为两种语言链接在一起且语法几乎相同。使用\
    \ `css`，我们可以为每个 `html` 元素定义特定的样式并将其应用于多个网页。此外，不需要每次都编写 `html` 标签属性或元素，这使得页面加载更快。通过\
    \ `css`，我们可以为网页提供更好的外观，因为与 `html` 相比它有更广泛的属性，样式表提供了网站的不同版本，以便在桌面电脑、智能手机和平板电脑上完美显示。\n\
    \n### css 的类型\n\n三种主要的 `css` 类型是 `inline css`（内联样式）、`internal css`（内部样式）和 `external\
    \ css`（外部样式）。\n\n#### 内联样式\n\n`Inline css` 在 `html` 文档中附接到元素的特定部分实现了 `css` 属性。例如：\n\
    \n```html\n<html>\n<head>\n<title>inline css</title>\n</head>\n<body>\n<p style=\"\
    color:blue; font-size:50px; font-style:italic; text-align:center;\">\ncascading\
    \ style sheet\n</p>\n</body>\n</html>\n```\n输出：`image_rsrc9.jpg`\n\n#### 内部样式\n\
    \n`Internal css` 在单个 html 文档上实现，以赋予其独特的样式，该规则必须位于 `head` 部分。内部 `css` 的语法为：\n\n\
    ```html\n<head>\n<title>internal css</title>\n<style>\nselector{\n  property:\
    \ value;\n}\n</style>\n</head>\n```\n\n#### 外部样式\n\n`External css` 有一个单独的文件，通过\
    \ `link` 标签与 `html` 文档链接。外部 `css` 的示例：\n\n```css\nbody {\n  background-color:\
    \ green;\n}\n\n.main {\n  color: red;\n}\n\n.g {\n  color: #009900;\n  font-size:\
    \ 50px;\n}\n```\n\n### 导入 css 文件\n\n要导入外部 `css` 样式表，可以使用以下规则：\n\n```css\n<head>\n\
    @import \"url\";\n</head>\n```\n\n### 颜色和背景\n\n在 css 中，颜色可以通过名称或不同类型的数值来定义。要指定颜色代码，可以使用的格式有：\n\
    \n#### 名称\n\n语法\n\n关键字\n\nGreen, blue, 等。\n\n#### 十六进制代码\n\n`#rrggbb`\n\n####\
    \ Rgb %\n\n`rgb(rrr%, ggg%, bbb%)`\n\n#### Rgb 绝对值\n\n`rgb(rrr, ggg, bbb)`\n\n\
    #### 简写十六进制代码\n\n`#rgb`\n\n例如，我们可以使用以下 css 语法设置文本颜色：\n\n```html\n<h1 style=\"\
    color: green;\">casading style sheets</h1>\n```\n\n#### 背景\n\n可以考虑不同的属性来定义网站的\
    \ `css` 背景。这些属性包括颜色、图像、固定方式和 `css` 背景的位置。\n\n背景颜色\n\n要设置网页页的背景颜色，可以使用以下 css 语法：\n\
    \n```css\nbody {\n  background-color: red;\n}\n```\n\n背景图像\n\n添加背景图像的语法：\n\n```css\n\
    body {\n  background-image: url(\"image.gif\");\n}\n```\n\n要重复图像：\n\n```css\n\
    body {\n  background-image: url(\"gradient_image.gif\");\n  background-repeat:\
    \ no-repeat;\n}\n```\n\n背景位置\n\n背景图像可以设置为不同的位置，如右、左、中心、顶和底。例如：\n\n```css\nbody\
    \ {\n  background-image: url(\"image.jpg\");\n  background-position: center;\n\
    }\n```\n\n以下语法用于 `html` 文档的 `head` 标签内：\n\n```html\n<html>\n<head>\n<style>\n\
    body {\n  background-color: white;\n}\n\nh1 {\n  color: red;\n  margin-left: 40px;\n\
    }\n</style>\n</head>\n<body>\n<h1>heading</h1>\n<p>sample</p>\n<p>paragraph</p>\n\
    </body>\n</html>\n```\n输出：`image_rsrc9.png`\n\n"
- fmt: "\nCss `border-style` property can be used to set a unique style, color, and\
    \ width of an element’s border in an html document. different styles for creating\
    \ borders with css include dotted, solid, dashed, groove, double, inset, outset,\
    \ hidden, ridge, and none.\n\nSyntax for creating different border styles:\n\n\
    ```css\nP.dotted {border-style: dotted;}\nP.solid {border-style: solid;}\nP.dashed\
    \ {border-style: dashed;}\nP.groove {border-style: groove;}\nP.double {border-style:\
    \ double;}\nP.inset {border-style: inset;}\nP.outline {border-style: outset;}\n\
    P.hidden {border-style: hidden;}\nP.ridge {border-style: ridge;}\nP.none {border-style:\
    \ none;}\n```\n\n# Height and width\n\nIn css, `height` and `width` properties\
    \ can be used to set the height and width of an element. the syntax for implementing\
    \ the height and width property in css is defined as follows:\n\n```css\nDiv {\n\
    \  Height: 200px;\n  Width: 50%;\n  Background-color: green;\n}\n```\n\n# Margins\
    \ and padding\n\n## Margin\n\nIn css, `margin` property is implemented to create\
    \ space around the element. we can set different margin sizes for every side.\
    \ `margin` property has different values such as length, width, and margin, calculated\
    \ by the browser.\n\nSyntax:\n\n```css\nBody {\n  margin: size;\n}\n```\n\n##\
    \ Padding\n\nCss `padding` can be used to define a border or create space around\
    \ the element. the,re, are, different ways to set css padding on an html website,\
    \ for individual sides such as top, right, bottom, and left. `padding` has length\
    \ and width values for which the following css syntax can be implemented:\n\n\
    ```css\nBody {\n  Padding: size;\n}\n```\n\n# Font and text\n\n## Font\n\n`font`\
    \ property in css is used to specify other font properties and to set the font\
    \ of a content. different font properties in css include font style, font family,\
    \ font weight, font variant, font weight, and font size.\n\nHere, is the simple\
    \ css syntax for each font property:\n\n### Font style\nLive demo\n\n```html\n\
    <html>\n  <head>\n</head>\n  <body>\n    <p style=\"font-style:calibri;\">\n \
    \     this text will be rendered in calibri style,\n    </p>\n  </body>\n</html>\n\
    ```\n\n### Font family\n```html\n<p style=\"font-family: georgia, calibri, serif;\"\
    ></p>\n```\n\n### Font variant\n```html\n<p style=\"font-variant: small-caps;\"\
    ></p>\n```\n\n### Font weight\n```html\n<p style=\"font-weight:500;\"></p>\n```\n\
    \n### Font size\n```html\n<p style=\"font-size:20px;\">font size 20 pixels</p>\n\
    <p style=\"font-size:small;\">small font</p>\n<p style=\"font-size:large;\">large,\
    \ font</p>\n```\n![image_rsrc9FV.jpg](images/image_rsrc9FV.jpeg)\n\n## Text\n\n\
    Transforming text into different colors, styles, and indentation is now possible,\
    \ with css `text` property. the,se text properties include:\n\n*   `text color`:\
    \ change color of the text.\n*   `text-alignment`: specify horizontal or vertical\
    \ alignment of the text.\n*   `text-decoration`: outline the decoration of text.\n\
    *   `text transformation`: control capitalization of text.\n*   `text indentation`:\
    \ specify the indentation of first line.\n*   `letter-spacing`: increase or decrease\
    \ space between words.\n*   `line-height`: specify line height.\n*   `text-direction`:\
    \ set direction of writing.\n*   `word spacing`: set space between words.\n* \
    \  `text shadow`: adds shadow effect on text.\n\nSyntax for css text properties:\n\
    \n### Text color\n```css\nBody {\n  color: red;\n}\n```\n\n### Text alignment\n\
    ```css\nH1 {\n  text-align: center;\n}\nH2 {\n  text-align: left;\n}\nH3 {\n \
    \ text-align: right;\n}\n```\n\n### Text decoration\n```css\nH1 {\n  text-decoration:\
    \ over/underline/line-through;\n}\n```\n\n### Text transformation\n```css\nP.uppercase\
    \ {\n  text-transform: uppercase;\n}\nP.lowercase {\n  text-transform: lowercase;\n\
    }\nP.capitalize {\n  text-transform: capitalize;\n}\n```\n\n### Text indentation\n\
    ```css\nP {\n  text-indent: 100px;\n}\n```\n\n### Letter spacing\n```css\nH1 {\n\
    \  letter-spacing: 3px;\n}\nH2 {\n  letter-spacing: -3px;\n}\n```\n\n### Line\
    \ height\n```css\nP.small {\n  line-height: 0.6;\n}\nP.big {\n  line-height: 1.6;\n\
    }\n```\n\n### Text direction\n```css\nP {\n  direction: rtl;\n}\n```\n\n### Text\
    \ shadow\n```css\nH1 {\n  text-shadow: 4px 3px green;\n}\n```\n\n### Word spacing\n\
    ```css\nH1 {\n  word-spacing: 10px;\n}\nH2 {\n  word-spacing: -5px;\n}\n```\n\n\
    # Tables and margins\n\nThere are different css properties to implement table\
    \ through css. the,se properties include: used to design a html table., `border\
    \ collapse`, `border spacing`, `Caption side`, `empty cells`.\n\n## Table layout\n\
    \nSyntax for creating simple table using css:\n\n```html\n<html>\n  <head>\n<style\
    \ type=\"text/css\">\n  table.one {\n    border-collapse: collapse;\n  }\n  table.two\
    \ {\n    border-collapse: separate;\n  }\n  td.a {\n    border-style: dotted;\n\
