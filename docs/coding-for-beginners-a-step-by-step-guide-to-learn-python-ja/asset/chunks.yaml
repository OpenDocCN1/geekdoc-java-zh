    \ are implemented to limit the type of data that can be inserted into a table.\
    \ most commonly, this includes `not null` constraint, `default` constraint, `unique`\
    \ constraint, `primary key`, `foreign key`, `check` constraint, and `index`.\n\
    \nFurthermore, integrity constraints can also be used to avail better consistency\
    \ and accuracy of data present in the relational database. usually, `primary key`,\
    \ `foreign key`, and `unique` constraints are a part of referential integrity\
