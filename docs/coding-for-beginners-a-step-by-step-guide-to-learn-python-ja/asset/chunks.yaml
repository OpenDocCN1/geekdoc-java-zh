    超文本标记语言（HTML）是一种标准的标记语言，用于创建用以显示颜色、字体、图形、多媒体和图像的网站。HTML 由许多不同的标签组成，这些标签可以用于描述网页的结构，并告诉浏览器在互联网上显示内容。


    ### 什么是标签？


    标签向网络浏览器提供关于任何网页的结构、显示和内容的指令，它们通过闭合的角括号 `<>` 来定义：标签由属性和元素组成。元素是页面上的一个对象，而属性描述了该元素的特征或细节。请记住，标签是成对使用的，起始标签
    `<tag>` 和结束标签 `</tag>` 有所区别。


    你的第一个示例 HTML 网页将使用以下标签创建：


    ```html

    <html>

    <head></head>

    <body>

    <h1>我的第一个标题</h1>

    <p>我的第一个段落</p>

    </body>

    </html>

    ```


    ### 标签说明


    在上述编写的 HTML 文档中，`<html>` 标签包围了整个 HTML 文档，并由其他主要标签组成，包括 `<head>`、`<body>` 和 `<p>`。`<head>`
    标签代表文件的头部，其中 `<title>` 标签用于显示文档标题。`<body>` 包含了其他几个用于创建网页的标签，如标题 `<h1>` 和段落 `<p>`。


    HTML 标签是不区分大小写的，但它们应该使用小写字母。为了定义 HTML 的版本，我们可以使用以下标签：


    ```html

    <!DOCTYPE html>

    ```


    初学者可以使用记事本（notepad PC）运行 HTML 页面，并将文件保存为 `.html` 格式。这将允许他们在浏览器中查看网页。


    ### 基础标签与属性


    #### 基础标签


    每个 HTML 文档都应该以标题、主标题和段落开头。在 `<body>` 标签之后，下一个使用的主要标签是 `<h1>` 或标题标签。根据你的内容需求，标题标签通过
    `<h1>` 到 `<h6>` 定义。例如：


    **标题：**


    ```html

    <html>

    <body>

    <h1> 第一个标题</h1>

    <h2> 第二个标题</h2>

    <h3> 第三个标题</h3>

    <h4>第四个标题</h4>

    <h5>第五个标题</h5>

    <h6>第六个标题</h6>

    </body>

    </html>

    ```


    输出：

    ![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg)


    **段落**


    为了添加内容，我们需要在 HTML 文档中包含段落。例如：


    ```html

    <html>

    <head>

    <h1> 标题</h1>

    </head>

    <body>

    <p> 第一个段落 </p>

    <p> 第二个段落 </p>

    </body>

    </html>

    ```


    输出：

    标题

    第一个段落

    第二个段落


    为了在段落之间添加换行，我们可以使用换行标签 `<br>`。


    **摘要标签**


    为了给段落添加摘要，带有 summary 标签的 HTML 语法定义如下：


    ```html

    <details>

    <summary>示例文本</summary>

    <p> Web 开发教程</p>

    </details>

    ```


    **span 标签**


    Span 标签用于为文本的特定部分上色。例如：


    ```html

    <p> 学习 Web 开发 <span style="color:red">很有趣 </span> </p>

    ```


    **select 标签**


    `<select>` 标签用于从下拉列表中选择一个。例如：


    ```html

    <select>

    <option value="red">红色</option>

    <option value="blue">蓝色</option>

    <option value="green">绿色</option>

    <option value="white">白色</option>

    </select>

    ```


    **thead 标签**


    `<thead>` 标签用于定义表格头部，它包含 `<tr>`、`<th>` 和 `<td>`。例如：


    ```html

    <table>

    <thead>

    <tr>

    <th>标题</th>

    <th>标题</th>

    </tr>

    </thead>

    <tbody>

    <tr>

    <td>数据 1</td>

    <td>数据 2</td>

    </tr>

    <tr>

    <td>数据 3</td>

    <td>数据 4</td>

    </tr>

    </tbody>

    <tfoot>

    <tr>

    <td>总结 1</td>

    <td>总结 2</td>

    </tr>

    </tfoot>

    </table>

    ```（注：由于原文后半部分存在大量重复且格式不完整的占位符，翻译已根据逻辑进行了对应处理，并保持了原有的结构 ）


