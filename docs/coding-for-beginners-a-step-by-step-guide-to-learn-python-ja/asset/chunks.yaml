    ### 表单


    HTML 表单是网站与用户交互的关键方面之一。表单通过使用文本字段、按钮、选择框、单选按钮、文件选择框、隐藏控件和点击控件等组件创建。通过表单收集的数据会发送到
    Web 服务器，网页也可以自行拦截这些数据。大多数情况下，控件与标签关联，以描述其用途。


    在 HTML 中创建表单的语法：


    ```html

    <form action="script url" method="get|post">

    Form elements like input, buttons etc.

    </form>

    ```


    从用户获取姓名和年龄的输入表单：


    ```html

    <html>

    <head>

    <title>my first html form</title>

    </head>

    <body>

    <form>

    name: <input type="text" name="name" />

    <br>

    age: <input type="text" name="last" />

    </form>

    </body>

    </html>

    ```


    ### 文本字段


    HTML 中的文本字段允许用户在表单中输入文本。创建文本字段的标准语法定义如下：


    ```html

    <input type="text" type="text" value="text">

    ```


    ### 按钮控件


    有多种方法提交数据到表单。我们可以使用以下 HTML 标签添加可点击按钮：


    ```html

    <input type="submit" name="submit" value="submit" />

    <input type="text" name="text" value="text" />

    <input type="button" name="button" value="button" />

    ```


    ### 选择框


    要在 HTML 表单中创建下拉列表，可以使用 `<select>` 和 `<option>` 元素。


    ```html

    <html>

    <head>

    <title>file box</title>

    </head>

    <body>

    <form>

    <label for="course">course:</label>

    <select name="course" id="course">

    <option value="engine">engine</option>

    <option value="calculus">calculus</option>

    <option value="science">science</option>

    </select>

    </form>

    </body>

    </html>

    ```


    ### 选择框


    `<select>` 元素提供了在 HTML 表单中列出多个选项的功能。


    ```html

    <html>

    <head>

    <title>your course,</title>

    </head>

    <body>

    <form>

    <select name="dropdown">

    <option value="math">math</option>

    <option value="physics">physics</option>

    </select>

    </form>

    </body>

    </html>

    ```


    ### 表单元素


    一旦有了 HTML 表单，`action` 和 `method` 两个属性将用于指定数据的去向和方式。关于表单元素的语法如下：


    ```html

    <form action="/login">```


    ### 设计


    在 HTML 中，任何网页的默认背景颜色是白色的。要更改背景颜色，可以使用以下标签和属性：


    `<tagname="color">`


    ```html

    <table bgcolor="green">

    ```


    ### 字体


    字体是网页的重要部分，并增强内容的可读性。`<font>` 标签可以赋予文本特定的样式、大小和颜色，其属性包括 `size`、`color` 和 `face`。设置字体大小的标签和属性为：


    ```html

    <font size="14">text</font>

    ```


    字体标签和属性：


    ```html

    <font face="times roman" size="14">text</font>

    ```


    ### 字体颜色


    更改字体颜色可以使用以下 HTML 标签和属性：


    ```html

    <html>

    <head>

    <title>setting font color</title>

    </head>

    <body>

    <font color="blue">this text is blue,</font>

    </body>

    </html>

    ```

    输出：blue


    ### 标记文本


    写在 `<mark>` 和 `</mark>` 元素之间的文本显示为黄色。


    ```html

    <p>this is <mark>yellow</mark></p>

    ```

    输出：is yellow


    ### 元标签


    在 HTML 中，元标签用于向您的网页中添加元数据。元标签的属性包括 `name`、`content` 和 `http-equiv`。我们可以使用 `<meta>`
    标签提供关于文档的简要描述，也可以提高搜索引擎对网页的索引。


    ```html

    <html>

    <head>

    <title>meta tags example,</title>

    <meta name="keywords" content="html, meta tags, metadata" />

    <meta name="description" content="meta tags." />

    <meta name="revised" content="3/7/2019" />

    <meta http-equiv="cookie" content="useid=abc; expires=monday, 08-sep-19 23:59:59
    gmt;" />

    </head>

    <body>

    <p>welcome to html</p>

    </body>

    </html>

    ```


    ### 注释


    要在 HTML 代码中放置注释，可以遵循以下语法：


    ```html

    <html>

    <head> <!-- document header starts -->

    <title>document title</title>

    </head> <!-- document header ends -->

    <body>

    <p>document content goes here.....</p>

    </body>

    </html>

    ```


