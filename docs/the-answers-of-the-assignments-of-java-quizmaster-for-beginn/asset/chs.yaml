  \ {\n    public static void main(String[] args) {\n        int x = 4;\n        int\
  \ y = 6;\n        x--;\n        y++;\n        // 答案\n        System.out.print(\"\
  The answer is: \");\n        x++;\n        System.out.print(x + \", \" + y);\n \
  \       // x++;\n    }\n}\n```\n1. `x` 的值在写入标准输出后自增了 1。结果保持不变。\n   答案：3, 7\n2. `x`\
  \ 的值在写入标准输出之前自增了 1。这将改变结果。\n   答案是：4, 7\n\n## 测试 4\n\n```java\npublic class MyClass\
  \ {\n    public static void main(String[] args) {\n        int x = 15;\n       \
  \ int y = 8;\n        int z = 3;\n        if (x == z) {\n            System.out.print(\"\
  N\");\n        }\n        if (x >= y) {\n            System.out.print(\"O\");\n\
  \            System.out.print(\"Z\");\n        }\n        if (x <= z) {\n      \
  \      System.out.print(\"P\");\n        }\n        if (z > y) {\n            System.out.print(\"\
  Q\");\n        }\n        if (y != z) {\n            System.out.print(\"R\");\n\
  \        }\n    }\n}\n```\n通过给变量 `x` 赋值为 `15`，语句 `if(x >= y)` 返回真。\n语句 `if(x ==\
  \ z)` 返回假。\n结果是标准输出写入了 `OZR`。\n\n## 测试 5\n\n```java\npublic class MyClass {\n  \
  \  public static void main(String[] args) {\n        boolean isDefect = false;\n\
  \        int x = 1;\n        int y = 7;\n        int z = 9;\n        if (x < y &&\
  \ x > 1) {\n            System.out.print(\"N\");\n        }\n        if (z > y ||\
  \ x > y) {\n            System.out.print(\"O\");\n        }\n        if (!isDefect)\
  \ {\n            System.out.print(\"P\");\n        }\n    }\n}\n```\n1. 如果 `isDefect`\
  \ 为 false，那么最后一条语句 `if( ! isDefect)` 返回真，程序也会向标准输出写入 `P`。\n2. 如果 `x` 等于 `1`，则语句\
  \ `if(x < y && x > 1)` 返回假。在这种情况下，`x` 不大于一。\n结果是代码向标准输出写入了 `OP`。\n\n## 测试 6\n\n\
  ```java\npublic class MyClass {\n    public static void main(String[] args) {\n\
  \        boolean isOld = true;\n        int x = 5;\n        int y = 14;\n      \
  \  int z = 17;\n        if (y > x && z > y && (x + 12) >= z) {\n            System.out.print(\"\
  P\");\n        }\n        if (x >= 6 || z <= y || z <= 18) {\n            System.out.print(\"\
  Q\");\n        }\n        if (!isOld || y > z) {\n            System.out.print(\"\
  R\");\n        }\n    }\n}\n```\n1. 语句 `if( ! isOld || y > z)` 返回假，因为第一个操作数 `!isOld`\
  \ 也返回假。在这种情况下，代码块被忽略，标准输出未写入 `R`。\n2. 如果 `z` 等于 `17`，语句 `if(y > x && z > y && (x\
  \ + 12) >= z)` 返回真。因为第一个操作数 `y > x` 为真，第二个操作数 `z > y` 为真，第三个操作数 `(x + 12) >= z`\
  \ 也返回真。该块被执行，标准输出写入了 `P`。\n如果 `z` 等于 `17`，语句 `if(x >= 6 || z <= y || z <= 18)` 返回真，因为操作数\
  \ `z <= 18` 返回真。\n\n## 测试 7\n\n```java\npublic class MyClass {\n    public static\
