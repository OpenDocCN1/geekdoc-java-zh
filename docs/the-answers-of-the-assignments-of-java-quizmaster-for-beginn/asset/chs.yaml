- "# 初学者 Java 测验大师练习答案：教师指南\n\n\n\n![](img/00001.jpeg)\n\n### Sar Maroof\n\n\n## 关于教师指南\n\
  在本手册中，你将找到作业的所有答案。《初学者 Java 问答大师》旨在帮助想要作为初级程序员工作的 Java 学生。我建议初级程序员避免复制粘贴代码，而是手动输入。通过输入代码，你可以从编译器的错误信息中学习。在每个学科中，你都有某些需要理解的部分，也有需要记忆的部分。例如，在数学中，你需要背诵乘法表，因为编程也需要记忆某些部分。通过输入代码，你开始理解程序的结构。许多习惯于复制粘贴代码的初不知道如何从零开始编写代码。他们经常寻找其他程序进行修改以满足。\n\
  \n## 第 1 章—数据类型与变量\n### Sar Maroof\n## 测验 1\n```java\npublic class Worker {\n  \
  \  static boolean isMarried;\n    public static void main(String[] args) {\n   \
  \     int age = 29;\n        long bankAccount = 652;\n        double wage = 110.30;\n\
  \        char gender = 'm';// female, male: m\n        System.out.print(age + \"\
  , \");\n        System.out.print(bankAccount + \", \");\n        System.out.print(wage\
  \ + \", \");\n        System.out.print(isMarried + \", \");\n        System.out.println(gender);\n\
  \        // Answer\n        System.out.print(\"answer: \");\n        boolean isForeign\
  \ = true;\n        System.out.print(isForeign);\n    }\n}\n```\n1. `boolean` 是一个实际的选择，因为\
  \ `isMarried` 的值只有 `true`（外籍人）或 `false`（非外国人）。\n2. 为了避免不必要的工作，变量 `isMarried` 默认应为\
  \ `true`。原因是大多数工人都是外籍人士。\n\n## 测验 2\n```java\npublic class MyVariable {\n    static\
  \ byte b = 122;\n    static short s;\n    static float f1 = 3.50f;\n    static float\
  \ f2 = 43.9f;\n    static double d = 33.35;\n    char myChar = 'Q';\n    public\
  \ static void main(String[] args) {\n        System.out.print(b + \", \");\n   \
  \     // System.out.print(myChar + \", \");\n        System.out.print(s + \", \"\
  );\n        System.out.print(f1 + \", \");\n        // System.out.print(myChar +\
  \ \", \");\n        System.out.print(f2 + \", \");\n        System.out.println(d);\n\
  \        // Answer\n        System.out.print(myChar);\n    }\n}\n```\n\n## 测验 3\n\
  ```java\npublic class MyClass {\n    static int i;\n    static double d;\n    static\
  \ boolean b;\n    public static void main(String[] args) {\n        System.out.print(i\
  \ + \", \");\n        System.out.print(d + \", \");\n        System.out.println(b);\n\
  \        // Answer\n        double myVar = 1344.98;\n        char myVar2 = 'g';\n\
  \        int myVar3 = 766;\n        System.out.print(\"The answer: \");\n      \
  \  System.out.print(myVar + \", \");\n        System.out.print(myVar2 + \", \");\n\
  \        System.out.print(myVar3);\n    }\n}\n```\n1. `1344.98` 的值是浮点类型，它应该是 `double`\
  \ 或 `float`。\n2. `\"g\"` 的值是字符类型，它应该是 `char`。\n3. `766` 的值是整数类型，它应该是 `short`、`int`\
  \ 或 `long`。\n\n## 测验 4\n```java\npublic class MyClass {\n    static int i1 = 7;\n\
  \    static int i2 = 12;\n    public static void main(String[] args) {\n       \
  \ i1 = 9;\n        i2 = 8;\n        i1 = i1 - 3;\n        i2 = i2 + i1;\n      \
  \  System.out.print(i1 + \", \");\n        System.out.print(i2 + \" \");\n    }\n\
  }\n```\n3. `i1 = 9` 语句位于 `i1` 的初始值之后，这就是为什么 `i1 = i1 - 3 = 9 - 3 = 6`。\n`i2 = 8`\
  \ 语句位于 `i2` 的初始值之后。`i2` 的新值为 `8`。\n`i2 = i2 + i1 = 8 + 6 = 14`。\n\n## 第 2 章—运算符\n\
