  System.out.print(2 * d2 + 2.5 + \", \");\nSystem.out.print(z * 3 - 6);\n}\n```\n\
  答案是：10, 9.9, 3\n\n## 测试 2\n\n```java\npublic class MyClass {\n    public static\
