    }\n```\n\n## Chapter 12—Final classes and the final keyword\n\n### Quiz 1\n1.\
    \ Yes.\n2. No, you cannot extend classes.\n\n### Quiz 2\nAlthough `methodB` returns\
    \ variable type `int`, its name causes nevertheless an error. The reason is that\
    \ this method has the same number of parameters and same variable type as `final\
    \ methodB` of the superclass.\n\n### Quiz 3\n```java\npublic class MySuper\n{\n\
    \  final int x = 4;\n  final String methodA(int i, String s)\n  {\n    String\
    \ str = i + \" \" + s;\n    return str;\n  }\n}\n\npublic class MyClass extends\
    \ MySuper\n{\n  int x = 3;\n  String methodA(String s, int i)\n  {\n    String\
    \ str = s + \" \" + i;\n    super.x++;\n    return str;\n  }\n  public static\
    \ void main(String[] args)\n  {\n    MySuper ms = new MySuper();\n    System.out.print(ms.methodA(23,\
    \ \"Emma\"));\n  }\n}\n```\nThe variable `x` in the superclass is `final`, so\
    \ its value is not changed. A `final` variable is actually a constant.\n\n###\
    \ Quiz 4\n```java\npublic class MySuper\n{\n  final void methodA(int x, double\
    \ y)\n  {\n    double z = x * y;\n    System.out.print(z);\n  }\n}\n\npublic final\
    \ class MyClass extends MySuper\n{\n  void methodA(int x, int y)\n  {\n    int\
    \ z = x - y;\n    System.out.print(z);\n  }\n  public static void main(String[]\
    \ args)\n  {\n    MyClass mc = new MyClass();\n    // mc.methodA(5, 3.0);\n  \
    \  mc.methodA(6, 4);\n  }\n}\n```\nThe program writes 2 to the standard output.\n\
    \n### Assignment chapter 12\n1. You cannot extend the class `Math`.\n2. The class\
    \ `Math` is `final`, therefore it is not possible to use it as a superclass for\
    \ your class.\n3. No, because all the methods of the class `Math` are `static`\
    \ and you can invoke them using the name of the class `Math`. For the rest of\
    \ the question see the code:\n\n```java\npublic class MyCalculation\n{\n  public\
    \ static void main(String[] args)\n  {\n    System.out.println(\"The greater number\
    \ is: \" + Math.max(35, 46));\n    System.out.println(\"The smaller number is:\
    \ \" + Math.min(46.98, 44.99));\n    System.out.println(\"The greater number is:\
    \ \" + Math.sqrt(81.0));\n    System.out.println(\"The greater number is: \" +\
    \ Math.random());\n  }\n}\n```\nThis code writes the following to the standard\
