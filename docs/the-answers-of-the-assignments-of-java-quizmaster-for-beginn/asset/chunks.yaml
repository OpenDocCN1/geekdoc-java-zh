    - [Chapter 10—Static Members](#66)\n- [Chapter 11—Inheritance](#71)\n- [Chapter\
    \ 12—Final Classes And The Final Keyword](#80)\n- [Chapter 13—Abstract Classes](#83)\n\
    - [Chapter 14—Interfaces](#88)\n- [Chatper 15—Casting](#92)\n- [Chapter 16—Nested\
    \ Classes](#96)\n- [Chapter 17—Exceptions](#101)\n\n## About the teacher’s guide\n\
    In this manual you will find all the answers of the assignments. Java quizmaster\
    \ for beginners is intended to learn Java Students who will be able to work as\
    \ a beginner programmer. I recommend beginner programmers to avoid cutting and\
    \ pasting code, but typing it. By typing the code you will learn from error messages\
    \ of the compiler. In every subject, you have specific parts that you need to\
    \ understand, but also parts that you need to memorize. In math, for example you\
    \ need to memorize the multiplication table, because programming also need to\
    \ memorize some parts. By typing the code, you start to understand the structure\
    \ of the program. Many beginners who have the habit of cutting and pasting code\
    \ don't know how to start code from scratch. They often seek other programs to\
    \ modify to wishes.\n\n## Chapter 1—Data Types and Variables\n### Sar Maroof\n\
    #### Quiz 1\n```java\npublic class Worker {\n    static boolean isMarried;\n \
    \   public static void main(String[] args) {\n        int age = 29;\n        long\
    \ bankAccount = 652;\n        double wage = 110.30;\n        char gender = 'm';//\
    \ female, male: m\n        System.out.print(age + \", \");\n        System.out.print(bankAccount\
    \ + \", \");\n        System.out.print(wage + \", \");\n        System.out.print(isMarried\
    \ + \", \");\n        System.out.println(gender);\n        // Answer\n       \
    \ System.out.print(\"answer: \");\n        boolean isForeign = true;\n       \
    \ System.out.print(isForeign);\n    }\n}\n```\n1. A practical choice is `boolean`\
    \ because the value of `isMarried` is either `true` (foreigner) or `false` (not\
    \ foreigner).\n2. To avoid unnecessary work, the variable `isMarried` should be\
    \ `true` by default. The reason is that most of workers are foreigners.\n\n####\
    \ Quiz 2\n```java\npublic class MyVariable {\n    static byte b = 122;\n    static\
    \ short s;\n    static float f1 = 3.50f;\n    static float f2 = 43.9f;\n    static\
    \ double d = 33.35;\n    char myChar = 'Q';\n    public static void main(String[]\
    \ args) {\n        System.out.print(b + \", \");\n        // System.out.print(myChar\
    \ + \", \");\n        System.out.print(s + \", \");\n        System.out.print(f1\
    \ + \", \");\n        // System.out.print(myChar + \", \");\n        System.out.print(f2\
    \ + \", \");\n        System.out.println(d);\n        // Answer\n        System.out.print(myChar);\n\
    \    }\n}\n```\n\n#### Quiz 3\n```java\npublic class MyClass {\n    static int\
    \ i;\n    static double d;\n    static boolean b;\n    public static void main(String[]\
    \ args) {\n        System.out.print(i + \", \");\n        System.out.print(d +\
    \ \", \");\n        System.out.println(b);\n        // Answer\n        double\
    \ myVar = 1344.98;\n        char myVar2 = 'g';\n        int myVar3 = 766;\n  \
    \      System.out.print(\"The answer: \");\n        System.out.print(myVar + \"\
    , \");\n        System.out.print(myVar2 + \", \");\n        System.out.print(myVar3);\n\
    \    }\n}\n```\n1. The value of `1344.98` is a floating point type, it should\
    \ be `double` or `float`.\n2. The value of `\"g\"` is a character type, it should\
    \ be `char`.\n3. The value of `766` is an integer type, it should be `short`,\
    \ `int` or `long`.\n\n#### Quiz 4\n```java\npublic class MyClass {\n    static\
    \ int i1 = 7;\n    static int i2 = 12;\n    public static void main(String[] args)\
    \ {\n        i1 = 9;\n        i2 = 8;\n        i1 = i1 - 3;\n        i2 = i2 +\
    \ i1;\n        System.out.print(i1 + \", \");\n        System.out.print(i2 + \"\
    \ \");\n    }\n}\n```\n3. The statement `i1 = 9` is under the previous initial\
    \ value of `i1`, and that is why the value `i1 = i1 - 3 = 9 - 3 = 6`.\nThe statement\
    \ `i2 = 8` is under the previous initial value of `i2`. The new value of `i2`\
    \ is `8`.\n`i2 = i2 + i1 = 8 + 6 = 14`.\n\n## Chapter 2—Operators\n### Quiz 1\n\
    ```java\npublic class Calculate {\n    public static void main(String[] args)\
    \ {\n        int x = 20;\n        int y = 5;\n        int z = 3;\n        double\
    \ d = 2.2;\n        double d2 = 3.7;\n        System.out.print(x / y + \", \"\
    );\n        System.out.print(x * z + \", \");\n        System.out.print(x + y\
    \ - z + \", \");\n        System.out.print(x / y + z * 2 + \", \");\n        System.out.println(d2\
    \ - d);\n        // Answer\n        System.out.print(\"The answer is: \");\n \
    \       System.out.print(x * y / 10 + \", \");\n    }\n}\n```\n"
