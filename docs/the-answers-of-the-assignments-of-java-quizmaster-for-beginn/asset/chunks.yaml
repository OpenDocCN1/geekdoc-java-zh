    \ writes CAF to the standard output.\n\nQuiz 7\n\npublic class MyClass\n\n{\n\n\
    \ public  static  void test(String str)\n\n  {\n\n if (str == null)\n\n    {\n\
    \n throw  new NullPointerException();\n\n    }\n\n else\n\n    {\n\n throw  new\
    \ RuntimeException();\n\n    }\n\n  }\n\n public  static  void main(String[] args)\n\
    \n  {\n\n try\n\n    {\n\n      System.out.print(\"A\");\n\n test(null);\n\n   \
    \ }\n\n catch (NullPointerException e)\n\n    {\n\n      System.out.print(\"B\"\
    );\n\n    }\n\n catch (Exception e)\n\n    {\n\n      System.out.print(\"C\");\n\
    \n    }\n\n finally\n\n    {\n\n      System.out.print(\"D\");\n\n    }\n\n  }\n\
    \n}\n\nThe program writes ABD to the standard output, because the NullPointerException\
    \ is thrown.import java.util.ArrayList;\n\nAssignment chapter 17\n\npublic  class\
    \ MyException extends Exception\n\n{\n\n public MyException(String message)\n\n\
      {\n\n super(message);\n\n  }\n\n}\n\nimport java.util.ArrayList;\n\npublic \
    \ class Test\n\n{\n\n private  static ArrayList<String> movieList = new ArrayList<String>();\n\
    \n public  static  void populateList()\n\n  {\n\n movieList.add(\"The Godfather\"\
    );\n\n movieList.add(\"Titanic\");\n\n movieList.add(\"Dances with Wolves\");\n\
    \n movieList.add(\"The Pianist\");\n\n movieList.add(\"Wall Street\");\n\n movieList.add(\"\
    Amadeus\");\n\n  }\n\n public  static String getMovie(int movieIndex) throws MyException\n\
    \n  {\n\n if (movieIndex >= movieList.size())\n\n    {\n\n throw  new MyException(\"\
    The movie \" + movieIndex + \" does not exist.\");\n\n    }\n\n return  movieList.get(movieIndex);\n\
    \n  }\n\n public  static  void main(String args[])\n\n  {\n\n populateList();\n\
    \n try\n\n    {\n\nString movie = getMovie(5);\n\n      System.out.print(\"The\
    \ movie title is: \" + movie);\n\n    }\n\n catch (MyException me)\n\n    {\n\n\
          // System.out.print(me.getMessage());\n\n      me.printStackTrace();\n\n\
        }\n\n  }\n\n}"
