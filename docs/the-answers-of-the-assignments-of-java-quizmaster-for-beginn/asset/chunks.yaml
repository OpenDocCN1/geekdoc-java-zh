    \ new MySub();\n  }\n}\n```\n结果将是 `x5 y8`。所有的值均保持不变，但 `MySub` 构造函数内部打印的 `x` 外。这是因为\
    \ `MySub` 现在有了自己的 `x` 变量。\n\n## 测 5\n\n```java\npublic class MySuper\n{\n protected\
