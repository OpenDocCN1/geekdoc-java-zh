- fmt: "\n![](images/00001.jpeg)\n\n# the answers of the assignments\n## Java Quizmaster\
    \ for Beginners\n## teacher's guide\n### Sar Maroof\nCopyright © 2017 Sar Maroof\n\
    All rights reserved.\nISBN: 978-1-975-78205-4\n\n## Table of contents\n- [About\
    \ the teacher’s guide](#4)\n- [Chapter 1—Data Types And Variables](#5)\n- [Chapter\
