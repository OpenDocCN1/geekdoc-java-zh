  trans: "\n\n![](img/00001.jpeg)\n\n# 作业答案\n## 初学者 Java 问答大师\n## 教师指南\n### Sar Maroof\n\
    Copyright © 2017 Sar Maroof\n保留所有权利\nISBN: 978-1-975-78205-4\n\n## 目录\n- 关于教师指南\n\
    - 第 1 章—数据类型与变量\n- 第 2 章—运算符\n- 第 3 章—条件语句\n- 第 4 章—迭代（循环）语句\n- 第 5 章—类、对象与构造函数\n\
    - 第 6 章—方法\n- 第 7 章—字符串与 StringBuilder\n- 第 8 章—包与访问修饰符\n- 第 9 章—数组与 ArrayList\n\
    - 第 10 章—静态成员\n- 第 11 章—继承\n- 第 12 章—final 类与 final 关键字\n- 第 13 章—抽象类\n- 第 14\
    \ 章—接口\n- 第 15 章—强制类型转换\n- 第 16 章—嵌套类\n- 第 17 章—异常\n\n## 关于教师指南\n在本手册中，你将找到作业的所有答案。《初学者\
    \ Java 问答大师》旨在帮助想要作为初级程序员工作的 Java 学生。我建议初级程序员避免复制粘贴代码，而是手动输入。通过输入代码，你可以从编译器的错误信息中学习。在每个学科中，你都有某些需要理解的部分，也有需要记忆的部分。例如，在数学中，你需要背诵乘法表，因为编程也需要记忆某些部分。通过输入代码，你开始理解程序的结构。许多习惯于复制粘贴代码的初不知道如何从零开始编写代码。他们经常寻找其他程序进行修改以满足。\n\
    \n## 第 1 章—数据类型与变量\n### Sar Maroof\n#### 测验 1\n```java\npublic class Worker {\n\
    \    static boolean isMarried;\n    public static void main(String[] args) {\n\
    \        int age = 29;\n        long bankAccount = 652;\n        double wage =\
    \ 110.30;\n        char gender = 'm';// female, male: m\n        System.out.print(age\
    \ + \", \");\n        System.out.print(bankAccount + \", \");\n        System.out.print(wage\
    \ + \", \");\n        System.out.print(isMarried + \", \");\n        System.out.println(gender);\n\
    \        // Answer\n        System.out.print(\"answer: \");\n        boolean isForeign\
    \ = true;\n        System.out.print(isForeign);\n    }\n}\n```\n1. `boolean` 是一个实际的选择，因为\
    \ `isMarried` 的值只有 `true`（外籍人）或 `false`（非外国人）。\n2. 为了避免不必要的工作，变量 `isMarried` 默认应为\
    \ `true`。原因是大多数工人都是外籍人士。\n\n#### 测验 2\n```java\npublic class MyVariable {\n  \
    \  static byte b = 122;\n    static short s;\n    static float f1 = 3.50f;\n \
    \   static float f2 = 43.9f;\n    static double d = 33.35;\n    char myChar =\
    \ 'Q';\n    public static void main(String[] args) {\n        System.out.print(b\
    \ + \", \");\n        // System.out.print(myChar + \", \");\n        System.out.print(s\
    \ + \", \");\n        System.out.print(f1 + \", \");\n        // System.out.print(myChar\
    \ + \", \");\n        System.out.print(f2 + \", \");\n        System.out.println(d);\n\
    \        // Answer\n        System.out.print(myChar);\n    }\n}\n```\n\n#### 测验\
    \ 3\n```java\npublic class MyClass {\n    static int i;\n    static double d;\n\
    \    static boolean b;\n    public static void main(String[] args) {\n       \
    \ System.out.print(i + \", \");\n        System.out.print(d + \", \");\n     \
    \   System.out.println(b);\n        // Answer\n        double myVar = 1344.98;\n\
    \        char myVar2 = 'g';\n        int myVar3 = 766;\n        System.out.print(\"\
    The answer: \");\n        System.out.print(myVar + \", \");\n        System.out.print(myVar2\
    \ + \", \");\n        System.out.print(myVar3);\n    }\n}\n```\n1. `1344.98` 的值是浮点类型，它应该是\
    \ `double` 或 `float`。\n2. `\"g\"` 的值是字符类型，它应该是 `char`。\n3. `766` 的值是整数类型，它应该是\
    \ `short`、`int` 或 `long`。\n\n#### 测验 4\n```java\npublic class MyClass {\n    static\
    \ int i1 = 7;\n    static int i2 = 12;\n    public static void main(String[] args)\
    \ {\n        i1 = 9;\n        i2 = 8;\n        i1 = i1 - 3;\n        i2 = i2 +\
    \ i1;\n        System.out.print(i1 + \", \");\n        System.out.print(i2 + \"\
    \ \");\n    }\n}\n```\n3. `i1 = 9` 语句位于 `i1` 的初始值之后，这就是为什么 `i1 = i1 - 3 = 9 -\
    \ 3 = 6`。\n`i2 = 8` 语句位于 `i2` 的初始值之后。`i2` 的新值为 `8`。\n`i2 = i2 + i1 = 8 + 6 = 14`。\n\
    \n## 第 2 章—运算符\n### 测验 1\n```java\npublic class Calculate {\n    public static\
    \ void main(String[] args) {\n        int x = 20;\n        int y = 5;\n      \
    \  int z = 3;\n        double d = 2.2;\n        double d2 = 3.7;\n        System.out.print(x\
    \ / y + \", \");\n        System.out.print(x * z + \", \");\n        System.out.print(x\
    \ + y - z + \", \");\n        System.out.print(x / y + z * 2 + \", \");\n    \
    \    System.out.println(d2 - d);\n        // Answer\n        System.out.print(\"\
    The answer is: \");\n        System.out.print(x * y / 10 + \", \");\n    }\n}\n\
    ```\n\n"
- fmt: "\n```java\nSystem.out.print(2 * d2 + 2.5 + \", \");\nSystem.out.print(z *\
    \ 3 - 6);\n}\n```\nThe answer is: 10, 9.9, 3\n\n## Quiz 2\n\n```java\npublic class\
    \ MyClass {\n    public static void main(String[] args) {\n        System.out.print(21\
    \ % 7 + \", \");\n        System.out.print(12 % 5 + \", \");\n        System.out.println(23\
    \ % 6);\n        // Answer\n        System.out.print(\"The answer is: \");\n \
    \       System.out.print(44 % 10 + \", \");\n        System.out.print(7 % 2 +\
    \ \", \");\n        System.out.print(30 % 3);\n    }\n}\n```\nThe answer is: 4,\
    \ 1, 0\n\n## Quiz 3\n\n```java\npublic class MyClass {\n    public static void\
    \ main(String[] args) {\n        int x = 4;\n        int y = 6;\n        x--;\n\
    \        y++;\n        // Answer\n        System.out.print(\"The answer is: \"\
    );\n        x++;\n        System.out.print(x + \", \" + y);\n        // x++;\n\
    \    }\n}\n```\n1. The value of `x` is incremented by one after it is written\
    \ to the standard output. The result remains the same.\n   The answer: 3, 7\n\
    2. The value of `x` is incremented by one before its value is written to the standard\
    \ output. This will change the result.\n   The answer is: 4, 7\n\n## Quiz 4\n\n\
    ```java\npublic class MyClass {\n    public static void main(String[] args) {\n\
    \        int x = 15;\n        int y = 8;\n        int z = 3;\n        if (x ==\
    \ z) {\n            System.out.print(\"N\");\n        }\n        if (x >= y) {\n\
    \            System.out.print(\"O\");\n            System.out.print(\"Z\");\n\
    \        }\n        if (x <= z) {\n            System.out.print(\"P\");\n    \
    \    }\n        if (z > y) {\n            System.out.print(\"Q\");\n        }\n\
    \        if (y != z) {\n            System.out.print(\"R\");\n        }\n    }\n\
    }\n```\nBy assigning the value `15` to the variable `x`, the statement `if(x >=\
    \ y)` returns true.\nThe statement `if(x == z)` returns false.\nThe result is\
    \ that `OZR` is written to the standard output.\n\n## Quiz 5\n\n```java\npublic\
    \ class MyClass {\n    public static void main(String[] args) {\n        boolean\
    \ isDefect = false;\n        int x = 1;\n        int y = 7;\n        int z = 9;\n\
    \        if (x < y && x > 1) {\n            System.out.print(\"N\");\n       \
    \ }\n        if (z > y || x > y) {\n            System.out.print(\"O\");\n   \
    \     }\n        if (!isDefect) {\n            System.out.print(\"P\");\n    \
    \    }\n    }\n}\n```\n1. If `isDefect` is false then the last statement `if(\
