  trans: "\n\n`x = 3 + 4 + 2 = 9.`\n\n程序向标准输出写入 `911`。\n\n阅读测验的解释！\n\n# 第 16 章作业：使用\
    \ Java API 文档\n\n```java\npublic class Car {\n  String brand;\n  String manufactureYear;\n\
    \  String licensePlate;\n\n  public Car(String brand, String manufactureYear,\
    \ String licensePlate) {\n    this.brand = brand;\n    this.manufactureYear =\
    \ manufactureYear;\n    this.licensePlate = licensePlate;\n  }\n\n  public void\
    \ printInfo() {\n    System.out.println(\"Brand:             \" + brand);\n  \
    \  System.out.println(\"Year of manufacture: \" + manufactureYear);\n    System.out.println(\"\
    License plate:      \" + licensePlate);\n  }\n\n  public class Engine {\n    String\
    \ engineCode;\n    String fuel;\n\n    public Engine(String engineCode, String\
    \ fuel) {\n      this.engineCode = engineCode;\n      this.fuel = fuel;\n    }\n\
    \n    public void printInfo() {\n      System.out.println(\"Engine code:     \
    \    \" + engineCode);\n      System.out.println(\"Fuel:               \" + fuel);\n\
    \    }\n  }\n\n  public static void main(String[] args) {\n    Car car = new Car(\"\
    BMW\", \"2016\", \"XN-45-489\");\n    Engine engine = car.new Engine(\"N45B20A\"\
    , \"Petrol\");\n    car.printInfo();\n    engine.printInfo();\n  }\n}\n```\n\n\
    # 第 17 章—异常\n\n## 测验 1\n\n```java\npublic class MyClass {\n  public void method()\
    \ {\n    try {\n      System.out.print(\"x\");\n      int x = Integer.parseInt(\"\
    38\");\n      System.out.print(\"y\");\n    } catch (NumberFormatException e)\
    \ {\n      System.out.print(\"z\");\n    }\n  }\n\n  public static void main(String[]\
    \ args) {\n    MyClass mc = new MyClass();\n    mc.method();\n  }\n}\n```\n3.\
    \ 输出是 `xy`，因为我们向 `parseInt()` 方法传递了一个 `int` 数字数字。这正是程序预期的。`catch` 块被忽略了。\n\n##\
    \ 测验 2\n\n```java\npublic class MyClass {\n  public void method() {\n    try {\n\
    \      int[] intArray = new int[5];\n      int z = intArray[6];\n      System.out.print(\"\
    w\");\n    } catch (ArithmeticException e) {\n      System.out.print(\"x\");\n\
    \    } catch (ArrayIndexOutOfBoundsException e) {\n      System.out.print(\"y\"\
    );\n    }\n  }\n\n  public static void main(String[] args) {\n    MyClass mc =\
    \ new MyClass();\n    mc.method();\n  }\n}\n```\n`finally`-块被移除了，因此 `z` 没有打印到标准输出。\n\
    程序仅向标准输出写入了 `y`。\n\n## 测验 3\n\n```java\npublic class MyClass {\n  String str =\
    \ \"Boris\";\n\n  public void method() {\n    try {\n      str.substring(1);\n\
    \      System.out.print(\"s\");\n    } catch (NullPointerException e) {\n    \
    \  System.out.print(\"x\");\n    } catch (Exception e) {\n      System.out.print(\"\
    y\");\n    } finally {\n      System.out.print(\"z\");\n    }\n  }\n\n  public\
    \ static void main(String[] args) {\n    MyClass mc = new MyClass();\n    mc.method();\n\
    \  }\n}\n```\n程序的输出是 \"sz\"，因为 `str` 对象已经不再为空了。\n\n## 测验 4\n\n```java\npublic\
    \ class MyClass {\n  int x = 20;\n\n  public void method() {\n    try {\n    \
    \  int i = 2 / x;\n      System.out.print(\"a\");\n    } catch (NullPointerException\
    \ n) {\n      System.out.print(\"b\");\n    } catch (ArithmeticException e) {\n\
    \      System.out.print(\"d\");\n    } finally {\n      System.out.print(\"f\"\
    );\n    }\n  }\n\n  public static void main(String[] args) {\n    MyClass mc =\
    \ new MyClass();\n    mc.method();\n  }\n}\n```\n`int i = 2/x` 正在除以零，这导致了 `ArithmeticException`。通过将\
    \ `x` 初始化为 `20`，在这种情况下，没有发生异常。`try-catch` 也会被执行。程序写入了 `af`。\n\n## 测验 5\n\n```java\n\
    public class MyClass {\n  StringBuffer sb;\n  int z;\n\n  public void myMethod()\
    \ {\n    try {\n      sb.append(\"s\");\n      z = 5 / 0;\n    } catch (NullPointerException\
    \ e) {\n      System.out.print(\"n\");\n    } catch (ArithmeticException e) {\n\
    \      System.out.print(\"a\");\n    }\n  }\n\n  public static void main(String[]\
    \ args) {\n    MyClass mc = new MyClass();\n    mc.myMethod();\n  }\n}\n```\n\
    第一条语句是 `sb.append(\"s\")`。由于 `sb` 仅仅是一个引用，因此捕获了 `NullPointerException`。程序写入了 `n`。\n\
    \n## 测验 6\n\n```java\npublic class MyClass {\n  static String str = \"\";\n\n\
    \  static void calculate(int x, int y) {\n    str += \"A\";\n    if (y == 0) {\n\
    \      throw new ArrayIndexOutOfBoundsException();\n    }\n    z = x / y;\n  \
    \  str += \"B\";\n  }\n\n  public static void main(String[] args) {\n    try {\n\
    \      str += \"C\";\n      calculate(10, 0);\n      str += \"D\";\n    } catch\
    \ (ArithmeticException e) {\n      str += \"E\";\n    } catch (ArrayIndexOutOfBoundsException\
    \ e) {\n      str += \"F\";\n    }\n    System.out.println(str);\n  }\n}\n```\n\
    代码抛出了错误类型的异常，因为它与数组毫无关系。无论如何，`catch` 块被捕获，程序写入了 `CAF`。\n\n## 测验 7\n\n```java\n\
    public class MyClass {\n  public void test(String str) {\n    if (str == null)\
    \ {\n      throw new NullPointerException();\n    } else {\n      throw new RuntimeException();\n\
    \    }\n  }\n\n  public static void main(String[] args) {\n    try {\n      System.out.print(\"\
    A\");\n      test(null);\n    } catch (NullPointerException e) {\n      System.out.print(\"\
    B\");\n    } catch (Exception e) {\n      System.out.print(\"C\");\n    } finally\
    \ {\n      System.out.print(\"D\");\n    }\n  }\n}\n```\n程序写入了 `ABD`，因为抛出了 `NullPointerException`。\n\
    \n# 第 17 章作业\n\n```java\nimport java.util.ArrayList;\n\npublic class MyException\
    \ extends Exception {\n  public MyException(String message) {\n    super(message);\n\
    \  }\n}\n```\n\nimport java.util.ArrayList;\n\npublic class Test {\n  private\
    \ static ArrayList<String> movieList = new ArrayList<String>();\n\n  public static\
    \ void populateList() {\n    movieList.add(\"The Godfather\");\n    movieList.add(\"\
    Titanic\");\n    movieList.add(\"Dances with Wolves\");\n    movieList.add(\"\
    The Pianist\");\n    movieList.add(\"Wall Street\");\n    movieList.add(\"Amadeus\"\
    );\n  }\n\n  public static String getMovie(int movieIndex) throws MyException\
    \ {\n    if (movieIndex >= movieList.size()) {\n      throw new MyException(\"\
    The movie \" + movieIndex + \" does not exist.\");\n    }\n    return movieList.get(movieIndex);\n\
    \  }\n\n  public static void main(String args[]) {\n    populateList();\n    try\
    \ {\n      String movie = getMovie(5);\n      System.out.print(\"The movie title\
    \ is: \" + movie);\n    } catch (MyException me) {\n      // System.out.print(me.getMessage());\n\
    \      me.printStackTrace();\n    }\n  }\n}\n```\n\n"
