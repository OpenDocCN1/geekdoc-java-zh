    \ + \", \");\n    System.out.print(emp1.nr + \", \");\n    System.out.print(emp2.nr\
    \ + \", \");\n    System.out.print(emp3.nr);\n  }\n}\n```\n程序向标准输出写入 `5`，`1`，`1`，`1`。\n\
    \n## 测 2\n\n```java\npublic class MyClass\n{\n static int  x = 3;\n public MyClass()\n\
