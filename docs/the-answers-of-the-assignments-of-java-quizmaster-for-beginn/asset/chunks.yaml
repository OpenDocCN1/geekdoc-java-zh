    , 2013, \"red\", 5);\n    Car car2 = new Car(\"Mazda\", 2017, \"blue\", 8);\n\
    \    car1.print();\n    car2.print();\n    tk1.print();\n    tk2.print();\n  }\n\
    }\n```\n\n## 第 12 章—final 类与 final 关键字\n\n### 练习 1\n1. 是。\n2. 不，你不能扩展类。\n\n###\
    \ 练习 2\n尽管 `methodB` 返回 `int` 类型，但由于其名称仍然导致了错误。原因是该方法与父类的 `final methodB` 参数数量和变量类型相同。\n\
    \n### 练习 3\n```java\npublic class MySuper\n{\n  final int x = 4;\n  final String\
    \ methodA(int i, String s)\n  {\n    String str = i + \" \" + s;\n    return str;\n\
    \  }\n}\n\npublic class MyClass extends MySuper\n{\n  int x = 3;\n  String methodA(String\
    \ s, int i)\n  {\n    String str = s + \" \" + i;\n    super.x++;\n    return\
    \ str;\n  }\n  public static void main(String[] args)\n  {\n    MySuper ms = new\
    \ MySuper();\n    System.out.print(ms.methodA(23, \"Emma\"));\n  }\n}\n```\n父类中的变量\
    \ `x` 是 `final`，所以它的值无法改变。`final` 变量实际上是一个常量。\n\n### 练习 4\n```java\npublic class\
    \ MySuper\n{\n  final void methodA(int x, double y)\n  {\n    double z = x * y;\n\
    \    System.out.print(z);\n  }\n}\n\npublic final class MyClass extends MySuper\n\
    {\n  void methodA(int x, int y)\n  {\n    int z = x - y;\n    System.out.print(z);\n\
    \  }\n  public static void main(String[] args)\n  {\n    MyClass mc = new MyClass();\n\
    \    // mc.methodA(5, 3.0);\n    mc.methodA(6, 4);\n  }\n}\n```\n程序向标准输出写入 2。\n\
    \n### 第 12 章作业\n1. 你不能扩展 `Math` 类。\n2. `Math` 类是 `final` 的，因此无法作为类的父类。\n3. 不，因为\
    \ `Math` 类的方法都是 `static` 的，你可以通过 `Math` 类调用它们。剩余部分查看代码：\n\n```java\npublic class\
    \ MyCalculation\n{\n  public static void main(String[] args)\n  {\n    System.out.println(\"\
    The greater number is: \" + Math.max(35, 46));\n    System.out.println(\"The smaller\
    \ number is: \" + Math.min(46.98, 44.99));\n    System.out.println(\"The root\
    \ of 81 is: \" + Math.sqrt(81.0));\n    System.out.println(\"The random number\
    \ is: \" + Math.random());\n  }\n}\n```\n该代码向标准输出写入：\nThe greater number is: 46\n\
    The smaller number is: 44.99\nThe root of 81 is: 9.0\nThe random number is: [一个随机数]\n\
    \n## 第 13 章—抽象类\n\n### 练习 1\n```java\npublic abstract class MyAbstract\n{\n  protected\
    \ int x = 6;\n  public MyAbstract()\n  {\n    x += 2;\n  }\n  abstract int getSum(int\
    \ x);\n  abstract void printMyName(String name);\n}\n\npublic class MyClass extends\
    \ MyAbstract\n{\n  int getSum()\n  {\n    return x + 5;\n  }\n  int getSum(int\
    \ x)\n  {\n    return super.x + x;\n  }\n  void printMyName(String name)\n  {\n\
    \    System.out.print(\"Name: \" + name);\n  }\n  public static void main(String[]\
    \ args)\n  {\n    MyClass mc = new MyClass();\n    System.out.println(mc.getSum(4));\n\
    \    mc.printMyName(\"Emily\");\n  }\n}\n```\n该程序向标准输出写入 Emily。\n\n### 练习 2\n\
    在 `System.out.print(\"p\");` 语句上方添加 `super(10);`，程序向标准输出写入 n10ps。查看此练习的解释。\n\n\
    ### 练习 3\n程序向标准输出写入 NOL27，因为 `this.str += str;` 语句向值为 `N` 的 `str` 变量添加了字母 `O`。\n\
    \n### 练习 4\n```java\npublic abstract class MyClassB\n{\n  MyClassB()\n  {\n  \
    \  System.out.print(\"a\");\n  }\n  abstract int getResult(int x, int y);\n}\n\
    \npublic class MyClassA extends MyClassB\n{\n  MyClassA()\n  {\n    System.out.print(\"\
    b\");\n  }\n  MyClassA(int i)\n  {\n    System.out.print(\"d\" + i);\n  }\n  public\
    \ int getResult(int x, int y)\n  {\n    return x * y;\n  }\n}\n\npublic class\
    \ MyClass extends MyClassA\n{\n  MyClass(int i)\n  {\n    System.out.print(\"\
    c\" + i);\n  }\n  public static void main(String[] args)\n  {\n    new MyClass(4);\n\
    \    new MyClassA(4);\n  }\n}\n```\n类 `MyClassA` 扩展了抽象类 `MyClassB`，因此它应该重写抽象方法\
    \ `getResult`，或者将 `MyClassB` 声明为 `abstract`。\n\n### 练习 5\n```java\npublic abstract\
    \ class MyAbstract\n{\n  int x;\n  abstract void methodA();\n  abstract String\
