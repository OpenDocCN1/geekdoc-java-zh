    - b) Resolves the promise with a specified value

    - c) Executes the catch block if the promise is rejected

    - d) Suspends the execution of the promise until a condition is met


    6. Which method is used to handle the successful fulfillment of a promise?


    - a) catch()

    - b) then()

    - c) resolve()

    - d) reject()


    7. What is the purpose of the `catch` method in a promise?


    - a) To handle successful fulfillment of the promise

    - b) To execute code after the promise is rejected

    - c) To create a new promise object

    - d) To chain multiple promises together


    8. Which of the following statements is true about promises?


    - a) Promises are synchronous by default

    - b) Promises can only represent a successful completion or a failure

    - c) Promises can be created using the `Promise.resolve()` method only

    - d) Promises cannot be chained with other promises


    9. What is promise chaining in JavaScript?


    - a) Linking multiple promises together to execute sequentially

    - b) Executing multiple promises concurrently

    - c) Handling exceptions in promise chains

    - d) Transforming a promise into a callback function


    10. Which method is used to execute multiple promises concurrently and wait for
    all of them to resolve?


    - a) all()

    - b) race()

    - c) Promise.allSettled()

    - d) Promise.all()


