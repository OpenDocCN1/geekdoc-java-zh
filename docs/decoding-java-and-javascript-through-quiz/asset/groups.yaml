- md: "\n# Decoding Java And JavaScript Through Quiz\n\nAKSHIT GOEL\n\n# DECODING\
    \ JAVA AND JAVASCRIPT\nTHE MUSCLE QUIZ\n(A MUST READ QUIZ BOOK FOR JAVA AND JAVASCRIPT\
    \ PROGRAMMERS)\n\nAuthor:\nAkshit Goel\n\nCopyright © 2024 Akshit Goel\n\nAll\
    \ rights reserved, including the right to reproduce this book or portions thereof\
    \ in any form whatsoever. For information, address the publisher.\n\nFirst printing,\
    \ 2024\n\nAuthor can be followed at\n\nhttps://www.facebook.com/Booksbyag\n\n\
    https://www.instagram.com/booksbyag1\n\n# Table OF CONTENTS\n\n| A. Java | Page\
    \ No. |\n| :--- | :--- |\n| 1. Introduction to Java | 5-9 |\n| 2. Java Basics-Data\
    \ Types, Arrays, Loops, Switch and Operators | 10-24 |\n| 3. Java String, Regex\
    \ and Exception Handling | 25-60 |\n| 4. Java OOOPS(Object Oriented Programming)\
    \ | 61-124 |\n| 5. Java Collection Framework | 125-175 |\n| 6. Threads, Process\
    \ & Multithreading | 176-213 |\n| 7. Java Generic, I/O & Multithreading | 214-233\
    \ |\n\n# JAVASCRIPT\n\n| B. | PAGE NO. |\n| :--- | :--- |\n| 1. Introduction to\
    \ JavaScript | 249-253 |\n| 2. JavaScript Basics | 254-269 |\n| 3. JavaScript\
    \ String, Method, Regex and Exception Handling | 270-283 |\n| 4. JavaScript Functions\
    \ | 284-303 |\n| 5. JavaScript Callback and Promises | 304-311 |\n| 6. JavaScript\
    \ Objects | 312-325 |\n| 7. JavaScript Versions | 326-340 |\n\n8. Java Misc 234-247\n\
    \n# A. JAVA\n\n# 1. Introduction to Java\n\n1. Java is a popular programming language,\
    \ created in what year?\n\n- a) 1990\n- b) 2001\n- c) 1995\n- d) 2011\n\n2. Java\
    \ is currently owned by which company?\n\n- a) Apple\n- b) Oracle\n- c) Meta\n\
    - d) Google\n\n3. What is the output of program snippet?\n\n```\npublic static\
    \ void main(String[] args) {\n    System.out.println(\"Hello World\");\n}\n```\n\
    \n- a) Hello\n- b) Hello World\n- c) Syntax error\n- d) main\n\n4. What is the\
    \ correct syntax of Main method in java?\n\n- a) public static main())\n- b) public\
    \ void main(String[] args){}\n- c) public static void main(String[] args){}\n\
    - d) public static main(string[] args){}\n\n5. Which among the below is not a\
    \ primitive data type in Java?\n\n- a) Int\n- b) Double\n- c) Float\n- d) String\n\
    \n6. How do you create a variable with the numeric value 1?\n\n- a) char a=1\n\
    - b) a=1\n- c) boolean a=1\n- d) int a=1\n\n7. How do you insert COMMENTS in Java\
    \ code?\n\n- a) //\n- b) #\n- c) /*\n- d) *\n\n8. How do you create a variable\
    \ with the floating number 4.9?\n\n- a) int x = 4.9f\n- b) x=4.9f\n- c) float\
    \ x=4.9f\n- d) x=4.9\n\n9. To declare array in Java, define the variable type\
    \ with:\n\n- a) []\n- b) [ ]\n- c) ()\n- d) <>\n\n10. Which operator can be used\
    \ to compare two values?\n\n- a) <>\n- b) ==\n- c) =\n- d) ><\n\n11. Array indexes\
    \ start with:\n\n- a) Null\n- b) 1\n- c) 0\n- d) -1\n\n12. How do you create a\
    \ method in Java?\n\n- a) methodName(VarType var)\n- b) methodName\n- c) ()methodName\n\
    - d) methodName->()\n\n13. Which statement is used to stop a loop?\n\n- a) stop\n\
    - b) break\n- c) return\n- d) exit\n\n14. Which method can be used to find the\
    \ highest value of x and y?\n\n- a) math.max(x,y)\n- b) math.Max(x,y)\n- c) Math.max(x,y)\n\
    - d) math.maxNum(x,y)\n\n15. How do you call a method in Java?\n\n- a) method()\n\
    - b) method=\n- c) method[]\n- d) ()method\n\n16. Which keyword is used to return\
    \ a value inside a method?\n\n- a) int\n- b) return\n- c) void\n- d) break\n\n\
    17. Which operator is used to multiply together two values?\n\n- a) &\n- b) /\n\
    - c) X\n- d) *\n\n18. Which data type is used for comparing between true and false?\n\
    \n- a) int\n- b) char\n- c) String\n- d) boolean\n\n19. What is the correct way\
    \ to create an object called rectangle of Shape?\n\n- a) Shape rectangle = new\
    \ Shape()\n- b) Rectangle = new Shape()\n- c) Shape rectangle = new Rectangle()\n\
    - d) Shape = new Rectangle()\n\n20. How do you insert COMMENTS in Java code?\n\
    \n- a) //\n- b) /**/\n- c) /*/*\n- d) //\n\n# ANSWERS\n1. c\n2. b\n3. a\n4. c\n\
    5. d\n6. d\n7. a\n8. c\n9. b\n10. b\n11. c\n12. a\n13. b\n14. c\n15. a\n16. b\n\
    17. d\n18. d\n19. a\n20. b\n\n# 2. Java Basics, Arrays, Loops, Switch and Operators\n\
    \n1. What is the default value of an uninitialized boolean variable in Java?\n\
    \n- a) true\n- b) false\n- c) 0\n- d) 1\n\n2. What is the range of the \"short\"\
    \ data type in Java?\n\n- a) -128 to 127\n- b) -32768 to 32767\n- c) -32768 to\
    \ 32767\n- d) -128 to 32\n\n3. Which data type is recommended for precise decimal\
    \ values, such as currency, in Java?\n\n- a) float\n- b) double\n- c) char\n-\
    \ d) int\n\n4. What is the output of the following code?\n\n```\nint a = 10;\n\
    int b = 5;\nint c = 20;\nSystem.out.println(a < b && a++);\nSystem.out.println(a);\n\
    ```\n\n- a) true, 10\n- b) false, 10\n- c) true, false\n- d) false\n\n5. Which\
    \ of the following is not a unary operator in Java?\n\n- a) ++\n- b) --\n- c)\
    \ +\n- d) /\n\n6. How do you declare and initialize a multidimensional array in\
    \ Java?\n\n- a) `int arr[][] = new int[3][3];`\n- b) `int arr[] = {1, 2, 3};`\n\
    - c) `int arr[] = new int[3][3];`\n- d) `int arr[][] = {1, 2, 3, 4, 5, 6};`\n\n\
    7. What is the purpose of the `break` statement in Java?\n\n- a) To end the program\n\
    - b) To exit the current loop or switch statement\n- c) To skip the current iteration\
    \ of a loop\n- d) To jump to a specific label in the code\n\n8. In a for-each\
    \ loop, what is the variable used to iterate through an array?\n\n- a) int\n-\
    \ b) var\n- c) loop\n- d) The type of the elements\n\n9. What is the key difference\
    \ between `++i` and `i++` in Java?\n\n- a) They are equivalent and can be used\
    \ interchangeably\n- b) `++i` increments the value before using it, while `i++`\
    \ uses the current value before incrementing\n- c) `i++` increments the value\
    \ before using it, while `++i` uses the current value before incrementing\n- d)\
    \ There is no difference between them\n\n10. Which loop is known as an exit-controlled\
    \ loop in Java?\n\n- a) for loop\n- b) while loop\n- c) do-while loop\n- d) switch\
    \ loop\n\n# Operators and Expressions\n\n11. What is the result of the expression\
    \ `10*5/2 + 3-1*4/2`?\n\n- a) 20\n- b) 15\n- c) 21\n- d) 10\n\n12. What does the\
    \ `>>` operator do in Java?\n\n- a) Right shift\n- b) Left shift\n- c) Bitwise\
    \ AND\n- d) Bitwise OR\n\n13. What is the purpose of the `!` operator in Java?\n\
    \n- a) Bitwise NOT\n- b) Logical NOT\n- c) Bitwise XOR\n- d) Logical XOR\n\n14.\
    \ How is the logical `||` operator different from the bitwise `|` operator in\
    \ Java?\n\n- a) They are equivalent and can be used interchangeably\n- b) `||`\
    \ performs a logical OR, skipping the second condition if the first is true; `|`\
    \ always evaluates both conditions\n- c) `|` performs a logical OR, skipping the\
    \ second condition if the first is true; `||` always evaluates both conditions\n\
    - d) There is no difference between them\n\n15. What is the ternary operator in\
    \ Java used for?\n\n- a) Performing arithmetic operations\n- b) Switching between\
    \ data types\n- c) Assigning a value based on a condition\n- d) Incrementing and\
    \ decrementing values\n\n16. How can you optimize code by using arrays in Java?\n\
    \n- a) By reducing the number of variables\n- b) By minimizing the use of loops\n\
    - c) By eliminating the need for conditional statements\n- d) All of the above\n\
    \n17. What is the purpose of the javadoc tool in Java programming?\n\n- a) To\
    \ generate documentation for the code\n- b) To debug the code\n- c) To profile\
    \ the code\n- d) To compile the code\n\n18. In Java, what does `System.arraycopy()`\
    \ do?\n\n- a) Copies the entire content of one array\n- b) Compares two arrays\
    \ and returns a boolean value\n- c) Sorts the elements of an array\n- d) Fills\
    \ the elements of an array with a specified value\n\n19. Which comment type is\
    \ used to create documentation API in Java?\n\n- a) Single-line comments\n- b)\
    \ Multi-line comments\n- c) Documentation comments\n- d) Inline comments\n\n20.\
    \ How do you initialize an empty ArrayList in Java?\n\n- a) `ArrayList list =\
    \ new ArrayList();`\n- b) `ArrayList list = new ArrayList(0);`\n- c) `ArrayList\
    \ list = new ArrayList(10);`\n- d) `ArrayList list = new ArrayList([]);`\n\n#\
    \ Arrays and Memory Management\n\n21. What is the output of the following code\
    \ snippet?\n\n```\nint arr[] = {50, 60, 70, 80};\n\nfor (int i = 0; i <= arr.length;\
    \ i++) {\n    System.out.println(arr[i]);\n}\n```\n\n- a) 50, 60, 70, 80\n- b)\
    \ 60, 70, 80\n- c) ArrayIndexOutOfBoundsException\n- d) No output\n\n22. What\
    \ is the purpose of the `get()` method in the provided code?\n\n```\nstatic int[]\
    \ get() {\n    return new int[]{10, 30, 50, 90, 60};\n}\n```\n\n- a) It retrieves\
    \ values from an ArrayList\n- b) It retrieves values from an array\n- c) It populates\
    \ an array with values\n- d) It generates random numbers\n\n23. How do you declare\
    \ a two-dimensional array with different lengths for each row?\n\n- a) `int arr[][]\
    \ = new int[3][];`\n- b) `int arr[][] = new int[3][3];`\n"
  mdcn: "\n\n# 通过测验解密 Java 和 JavaScript\n\nAKSHIT GOEL\n\n# 解密 Java 与 JavaScript\n\
    肌肉级测验\n（Java 和 JavaScript 程序员的必读测验书籍）\n\n作者：\nAkshit Goel\n\n版权所有 ©2024 Akshit\
    \ Goel\n\n保留所有权利，包括以任何形式复制本书或其任何部分的权利。如需了解更多信息，请联系出版商。\n\n首次印刷，2024年\n\n可以通过以下方式关注作者：\n\
    \nhttps://www.facebook.com/Booksbyag\n\nhttps://www.instagram.com/booksbyag1\n\
    \n# 目录\n\n| A. Java | 页码 |\n| :--- | :--- |\n| 1. Java 简介 | 5-9 |\n| 2. Java 基础-数据类型、数组、循环、Switch\
    \ 和操作符 | 10-24 |\n| 3. Java 字符串、正则表达式和异常处理 | 25-60 |\n| 4. Java OOOPS（面向对象编程）\
    \ | 61-124 |\n| 5. Java 集合框架 | 125-175 |\n| 6. 线程、进程与多线程 | 176-213 |\n| 7. Java\
    \ 泛型、I/O 与多线程 | 214-233 |\n\n# JAVASCRIPT\n\n| B. | 页码 |\n| :--- | :--- |\n| 1.\
    \ JavaScript 简介 | 249-253 |\n| 2. JavaScript 基础 | 254-269 |\n| 3. JavaScript 字符串、方法、正则表达式和异常处理\
    \ | 270-283 |\n| 4. JavaScript 函数 | 284-303 |\n| 5. JavaScript 回调与 Promise | 304-311\
    \ |\n| 6. JavaScript 对象 | 312-325 |\n| 7. JavaScript 版本 | 326-340 |\n\n8. Java\
    \ 杂项 234-247\n\n# A. JAVA\n\n# 1. Java 简介\n\n1. Java 是一种流行的编程语言，是在哪一年创建的？\n\n\
    - a) 1990\n- b) 2001\n- c) 1995\n- d) 2011\n\n2. Java 目前由哪家公司所有？\n\n- a) Apple\n\
    - b) Oracle\n- c) Meta\n- d) Google\n\n3. 代码段的输出是什么？\n\n```\npublic static void\
    \ main(String[] args) {\n    System.out.println(\"Hello World\");\n}\n```\n\n\
    - a) Hello\n- b) Hello World\n- c) 语法错误\n- d) main\n\n4. Java 中 Main 方法的正确语法是什么？\n\
    \n- a) public static main())\n- b) public void main(String[] args){}\n- c) public\
    \ static void main(String[] args){}\n- d) public static main(string[] args){}\n\
    \n5. 下列中哪不是 Java 的基本数据类型？\n\n- a) Int\n- b) Double\n- c) Float\n- d) String\n\n\
    6. 如何创建一个数值为 1 的变量？\n\n- a) char a=1\n- b) a=1\n- c) boolean a=1\n- d) int a=1\n\
    \n7. 如何在 Java 代码中插入注释？\n\n- a) //\n- b) #\n- c) /*\n- d) *\n\n8. 如何创建一个数值为 4.9\
    \ 的浮点数变量？\n\n- a) int x = 4.9f\n- b) x=4.9f\n- c) float x=4.9f\n- d) x=4.9\n\n\
    9. 在 Java 中声明数组，使用以下符号定义变量类型：\n\n- a) []\n- b) [ ]\n- c) ()\n- d) <>\n\n10. 哪个操作符可以比较两个值？\n\
    \n- a) <>\n- b) ==\n- c) =\n- d) ><\n\n11. 数组索引从什么开始：\n\n- a) Null\n- b) 1\n-\
    \ c) 0\n- d) -1\n\n12. 如何在 Java 中创建一个方法？\n\n- a) methodName(VarType var)\n- b)\
    \ methodName\n- c) ()methodName\n- d) methodName->()\n\n13. 使用哪个语句停止循环？\n\n- a)\
    \ stop\n- b) break\n- c) return\n- d) exit\n\n14. 哪个方法可以找到 x 和 y 的最大值？\n\n- a)\
    \ math.max(x,y)\n- b) math.Max(x,y)\n- c) Math.max(x,y)\n- d) math.maxNum(x,y)\n\
    \n15. 如何在 Java 中调用方法？\n\n- a) method()\n- b) method=\n- c) method[]\n- d) ()method\n\
    \n16. 哪个关键字用于在方法内部返回值？\n\n- a) int\n- b) return\n- c) void\n- d) break\n\n17.\
    \ 哪个操作符用于将两个值相乘？\n\n- a) &\n- b) /\n- c) X\n- d) *\n\n18. 哪个数据类型用于比较真与假？\n\n-\
    \ a) int\n- b) char\n- c) String\n- d) boolean\n\n19. 创建一个名为 rectangle 的 Shape\
    \ 对象的正确方法是：\n\n- a) Shape rectangle = new Shape()\n- b) Rectangle = new Shape()\n\
    - c) Shape rectangle = new Rectangle()\n- d) Shape = new Rectangle()\n\n20. 如何在\
    \ Java 代码中插入注释？\n\n- a) //\n- b) /**/\n- c) /*/*\n- d) //\n\n# 答案\n1. c\n2. b\n\
    3. a\n4. c\n5. d\n6. d\n7. a\n8. c\n9. b\n10. b\n11. c\n12. a\n13. b\n14. c\n\
    15. a\n16. b\n17. d\n18. d\n19. a\n20. b\n\n# 2. Java 基础、数组、循环、Switch 和操作符\n\n\
    1. Java 中未初始化的 boolean 变量默认值是什么？\n\n- a) true\n- b) false\n- c) 0\n- d) 1\n\n\
    2. Java 中 \"short\" 数据类型的范围是多少？\n\n- a) -128 to 127\n- b) -32768 to 32767\n- c)\
    \ -32768 to 32767\n- d) -128 to 32767\n\n3. 下列哪个数据类型用于表示精确的小数值？\n\n- a) float\n\
    - b) double\n- c) char\n- d) int\n\n4. 下列代码的输出是什么？\n\n```\nint a = 10;\nint b\
    \ = 5;\nSystem.out.println(a > b);\n```\n\n- a) 10\n- b) 20\n- c) true\n- d) false\n\
    \n5. 下列哪个不是 Java 中的一元运算符？\n\n- a) ++\n- b) --\n- c) +\n- d) /\n\n6. 如何在 Java 中声明多维数组？\n\
    \n- a) `int arr[][] = new int[3];`\n- b) `int arr[] = {1, 2, 3};`\n- c) `int arr[][]\
    \ =`\n- d) `int arr[][] = {1, 2, 3};`\n\n7. Java 中 `break` 语句的目的是？\n\n- a) 结束循环\n\
    - b) 退出程序\n- c) 遍历数组\n- d) 跳出循环\n\n8. 在 Java 中，for-each 循环被称为哪种？\n\n- a) for\n\
    - b) while\n- c) do-while\n- d) switch\n\n9. 下列哪个是用于返回值的？\n\n- a) 结束\n- b) 退出\n\
    - c) 遍历\n- d) 赋值值\n\n10. 下列哪种是 Java 中的循环？\n\n- a) for\n- b) while\n- c) do-while\n\
    - d) switch\n\n# 运算符与表达式\n\n11. 表达式的结果是？\n\n- a) 20\n- b) 15\n- c) 21\n- d) 10\n\
    \n12. Java 中 `>>` 操作符表示什么？\n\n- a) 右移\n- b) 左移\n- c) 按位与\n- d) 逻辑或\n\n13. `!`\
    \ 操作符的目的是？\n\n- a) 按位非\n- b) 逻辑非\n- c) 异或\n- d) 逻辑与\n\n14. Java 中 `||` 操作与 `|`\
    \ 有何不同？\n\n- a) 逻辑或与按位或\n- b) 逻辑与与按位与\n- c) 逻辑或与按位或\n- d) 逻辑非与按位非\n\n15. 三元运算符用于？\n\
    \n- a) 算术运算\n- b) 类型转换\n- c) 根据条件赋值\n- d) 返回值\n\n16. 如何使用数组优化代码？\n\n- a) 通过减少变量\n\
    - b) 通过减少循环\n- c) 通过消除条件语句\n- d) 以上都是\n\n17. Java 中 `javadoc` 工具的目的是？\n\n- a)\
    \ 为代码生成文档\n- b) 调试代码\n- c) 分析代码\n- d) 编译代码\n\n18. 在 Java 中`System.arraycopy()`\
    \ 执行什么？\n\n- a) 复制整个数组内容\n- b) 比较两个数组\n- c) 排序元素\n- d) 填充数组\n\n19. 哪种注释类型用于创建\
    \ Java API？\n\n- a) 单行注释\n- b) 多行注释\n- c) 文档注释\n- d) 行内注释\n\n20. 如何在 Java 中初始化一个空的\
    \ ArrayList？\n\n- a) `ArrayList list = new ArrayList();`\n- b) `ArrayList list\
    \ = new ArrayList(0);`\n- c) `ArrayList list = new ArrayList(10);`\n- d) `ArrayList\
    \ list = new ArrayList([]);`\n\n# 数组与内存管理\n\n21. 下列代码段的输出是什么？\n\n```\nint arr[]\
    \ = {50, 60, 70, 80};\n\nfor (int i = 0; i <= arr.length; i++) {\n    System.out.println(arr[i]);\n\
    }\n```\n\n- a) 50, 60, 70, 80\n- b) 60, 70, 80\n- c) ArrayIndexOutOfBoundsException\n\
    - d) 无输出\n\n22. 提供的代码中 `get()` 方法的目的是什么？\n\n```\nstatic int[] get() {\n    return\
    \ new int[]{10, 30, 50, 90, 60};\n}\n```\n\n- a) 从 ArrayList 中获取值\n- b) 从数组中获取值\n\
    - c) 为数组填充值\n- d) 生成随机数\n\n23. 如何声明一个每行长度不同的二维数组？\n\n- a) `int arr[][] = new int[3][];`\n\
    - b) `int arr[][] = new int[3][3];`\n\n"
