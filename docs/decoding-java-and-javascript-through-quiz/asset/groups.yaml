    1. What is a callback function in JavaScript?


    - a) A function that is invoked automatically when an event occurs

    - b) A function passed as an argument to another function to be executed later

    - c) A function that returns a promise object

    - d) A function that handles exceptions in asynchronous code


    2. Which of the following is a disadvantage of using callback functions?


    - a) Callback functions are not supported in modern JavaScript

    - b) Callback hell, leading to unreadable code

    - c) Callback functions cannot handle asynchronous operations

    - d) Callback functions always execute synchronously


    3. What is the purpose of the `setTimeout` function in JavaScript?


    - a) To execute a function after a specified delay

    - b) To block the execution of the code for a specified time

    - c) To set an interval for executing a function repeatedly

    - d) To wait for a promise to resolve before executing the next line of code


    4. Which keyword is used to create a new promise object in JavaScript?


    - a) new

    - b) resolve

    - c) Promise

    - d) then


    5. What does the `resolve` function do in a promise?


