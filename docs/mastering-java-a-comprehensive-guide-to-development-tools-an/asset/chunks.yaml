    内部迭代是一种声明式编程的形式，它是函数式编程的基础。它让开发者无需描述“如何”做，而是专注于要做“什么”。


    分片器（Splitators）专为集合的并行迭代而设计。数据被分区，每个数据块被分配到不同的线程进行并行处理。


