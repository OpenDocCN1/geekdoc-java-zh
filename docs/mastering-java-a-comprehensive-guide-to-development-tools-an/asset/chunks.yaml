    The access modifiers are used to define access levels for methods, variables,
    classes, and constructors.


    ### Private–only accessible within the class


    When a method, variable, class or constructor is declared private, it means that
    it is only available within the class. if the class however, has public getter
    methods, you may be able to access a private variable outside the class. the `private`
    keyword indicates the highest access restriction. take note that you cannot declare
    interfaces and class as private.


    ### Public–accessible to the world


    A method, interface, constructor, class, etc. that has been defined as public
    may be accessed from other classes. similarly, blocks, methods or fields that
    have been defined inside a public class may be accessed from java class. this
    is true, as long as they are in the same package. if you want to access a public
    class from another package, you will have to import the public class. under the
    class inheritance concept, subclasses inherit all public variables and methods
    of a class.


    Take note that an application’s `main()` method will have to be declared public
    before the java interpreter can call it to run the class.


    ### Protected–accessible to all subclasses and package,


    Declaring a method, variable, or constructor as protected in a superclass makes
    it accessible only to classes within its package, or to its subclasses in another
    package. this access type is used if you want to allow the subclass to use variable
    or helper methods and prevent nonrelated classes from using them. interfaces,
    as well as the fields and methods under them, should not be declared protected,
    but fields and methods outside of the interface can be declared protected. classes
    should not be declared as protected.


    ### Default: applicable when no modifier is provided–accessible to the package


    A method or variable that has been declared without a modifier is accessible to
    other classes within the package.


    The following table summarizes the different access modifiers and their effect:


    | Modifier | Inside class | Inside package | Outside package, by subclass | Outside
    package, |

    | :--- | :--- | :--- | :--- | :--- |

    | Private | Y | N | N | N |

    | Public | Y | Y | Y | Y |

    | Protected | Y | Y | Y | N |

    | Default | Y | Y | N | N |


    ### Non-access modifiers


    The non-access modifiers can be used to access various functionalities in java.


    ### Final–used to finalize implementations of variables, methods and classes


    #### Final variables

    You can only explicitly initialize a final variable, once you declare a variable
    as `final`, you will never be able to assign it to another object. take note however
    that you can still change the data stored inside the object. this means that while
    you may change the object’s state, you will not be able to change the reference.
    the `final` modifier is commonly paired with static to create a class variable
    of constant value.


    #### Final methods

    The `final` keyword is used to prevent a method from being changed by subclasses.


    #### Final classes

    The `final` modifier is used to prevent other classes from inheriting any feature
    from the class declared as final.


    ### Static–used to create class methods or variables


    You can use this keyword to create a unique variable (called a static variable)
    that will exist independently from other instance of the class. you cannot declare
    a local variable as static. can also use the static keyword to create a method
    (called a static method or class method) that will exist independently from other
    instance of the class. static methods recognize and work only on data from the
    arguments given without variables. You may access class methods and class variables
    by writing the variable or method name after the class name and a dot (.).


    ### Abstract–used to create abstract methods or classes


    #### Abstract class

    When a class is declared as abstract, it means that you will never be able to
    instantiate the class. the only reason for declaring a class as abstract is to
    extend the class. you cannot declare a class to be both final and abstract, as
    you can’t possibly extend a final class. a class that uses abstract methods will
    have to be declared as abstract. failure to do so will result in compile errors.


    #### Abstract method

    As it is declared with no implementation, an abstract method derives its methods
    body from the subclass. abstract methods cannot be declared as strict or final.
    unless it is also an abstract class, a class extending an abstract class must
    adopt the abstract methods of the superclass. a class that contains least one
    abstract method should be declared as an abstract class. on the other hand, an
    abstract class need not have abstract methods.


    ![image](images/image105.jpeg) example:


    ### Synchronized


    ![image](images/image047.jpeg)the `synchronized` modifier is used to indicate
    that only one thread can access a method at any time.


    #### Volatile


    This `volatile` keyword is used to indicate that a thread accessing a variable
    should see its copy stored in memory. it synchronizes all copies of the variable.


    #### Transient


    The `transient` keyword is used to skip an instance when serializing the object
    that contains the marked variable.


