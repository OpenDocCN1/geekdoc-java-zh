    \ software developer salary:1850.000\n\nName,: shelley mary\n\nAge,:22\n\nDesignation:\
    \ software developer salary:850.00\n\n# 第 6 章：规范的工作代码示例\n\n传统上，每个人的第一个程序都是打印“hello\
    \ world”。这个第一个程序演示了如何创建、保存和运行程序。它还展示了所有 Java 程序使用的基本结构。\n\n这是由 hello worldz 创建的窗口截图\
    \ ![image](img/image081.png)程序：\n\n### 第 1 节–Java 项目和包\n\n程序首先通过 Java 项目进行组织，然后在\
    \ Java 项目内部通过包（packages）进行组织。你将为书中的每个程序创建一个 Java 项目。\n\n包包含了通常一起使用的程序文件。由于书中的程序很小，你创建的大多数\
    \ Java 项目将只包含一个包。\n\n在本节中，你将为你的第一个程序创建一个 Java 项目和一个包。\n\n### 试一试\n\n创建一个名为 hello\
    \ world 的第一个 Java 项目：\n\n1. 如果 eclipse 尚未打开：\n\n1. 双击你在桌面上创建的 eclipse 快捷方式。\n\
    2. 点击 ok 使用你的 Java 工作文件夹作为你的工作空间。\n\n1. 在包管理器（package explorer）面板中右键点击，并选择 new/java\
    \ project。\n2. 将 Java 项目命名为 hello world，并选择使用默认 jre，如果它是 1.7 或更高版本，则点击 next，如下图所示。如果默认\
    \ jre 低于 1.7，选择使用 1.7 或更高执行环境 jre 的选项。\n\n![image](img/image088.jpeg)\n\n1. 点击\
    \ libraries（库），然后点击 add external jars...（添加外部 jar...），如下图所示。\n\n![image](img/image109.jpeg)\n\
    \n1. 浏览并选择 `diyjava.jar`，这是你在 Java 工作文件夹中安装的，点击 open（打开）。\n2. 点击 finish（完成）。\n\
    \n包管理器面板现在列出了一个项目（hello world）![image](img/image059.jpeg)以及添加的 jar 文件（`diyjava.jar`），如下所示：\n\
    \n在 hello world 项目中为你的 hello world 程序创建一个包：\n\n1. 右键点击 hello world 项目并选择 new/package（新建包）。\n\
    2. 将包命名为................helloworld，\n\n如下所示。使用你自己的名字作为包名的一部分。我使用的包名是 `anne.godtland.helloworld`。\n\
    \n![image](img/image038.jpeg)\n\n1. 点击 finish（完成）。\n\n包管理器面板现在显示在你的 hello world\
    \ 项目中创建的包 ![image](img/image077.jpeg)，如下所示：\n\n### 关键点及更多内容\n\n![image](img/image002.png)在包管理器面板中右键点击以创建\
    \ Java 项目和包。\n![image](img/image002.png)为每个程序创建一个不同的 Java 项目。\n![image](img/image002.png)eclipse\
    \ 会在你的电脑上创建一个与 Java 项目同名的文件夹。为你的 Java 项目指定一个你希望在电脑文件夹中使用的名称。\n![image](img/image089.png)你现在在\
    \ Java 文件夹中有一个名为 hello world 的文件夹。\n![image](img/image015.png)例如，每个单词的首字母大写，并在每个单词之间加上空格，就像\
    \ hello world 项目一样。\n![image](img/image002.png)在本书的帮助下向你创建的 Java 项目添加 `diyjava.jar`。\n\
    ![image](img/image089.png)`diyjava.jar` 是一个外部 jar 文件。\n![image](img/image070.png)`diyjava.jar`\
    \ 使编写向窗口打印文本的程序变得易许多。\n![image](img/image002.png)将你的程序文件组织到 Java 项目中的包中。\n![image](img/image002.png)将通常在一起的程序文件放在一个包中。\n\
    ![image](img/image050.png)因为你的程序很小，你的大多数程序将只有一个包。\n\n### 包的命名规则：\n\n![image](img/image083.png)让你的包名与其他人的包名不同。程序员传统上使用他们的名字或业务名称作为包名的第一部分。\n\
    ![image](img/image093.png)使用全小写字母且不带空格。\n![image](img/image022.png)在包名的不同类别之间使用点。例如，如果包名标识了是谁创建了包以及该包将用于什么，在创建者和用途之间加上点。\n\
    ![image](img/image002.png)确保在创建书中创建 Java 项目时，你选择了使用 `javase-1.7` 或更高执行环境 jre 的选项。一旦你在创建项目时选择了此选项，eclipse\
    \ 将对以后所有的 Java 项目默认使用该选项。\n\n![image](img/image002.png)Java 项目是为了 eclipse 的；包是为了\
    \ Java 的。因为你正在使用 eclipse，所以你会同时使用 Java 项目和包。如果你不使用 eclipse 创建程序，你可能只会使用包。\n\n\
    ### 第 2 节–类和程序\n\nJava 程序由一个或多个类组成。类包含实际的代码：运行指令。\n\n![image](img/image002.png)每个类必须命名为某些，例如与\
    \ Java 项目相同的名称\n\n在本节中，你将创建你的第一个类：一个在窗口中运行的程序。\n\n### 试一试\n\n使用 window 类作为父类创建你的第一个类：\n\
    \n1. 在包管理器上右键点击，并选择 new/class。\n2. 将类命名为 helloworld（提示：“hello”和“world”之间没有空格”）。\n\
    3. 浏览父类。\n1. 为类型输入 `diy`，如下所示选择 window，然后点击 ok。\n1. 你想创建哪些方法存根（stubs）？选择所示选项：\n\
    \n1. Public static void main(string[] args)。\n2. 来自父类的构造函数。\n3. 是否选择第三个选项继承抽象方法并不重要。\n\
    \n![image](img/image091.jpeg)\n\n1. 点击 finish 创建类。\n\nEclipse 将为 helloworld 类创建代码，如下列表所示。\n\
    \n如果你将你的阅读器字体调小以减少换行，你可能会更容易阅读书中的代码列表。\n\n列表 1-1，来自 helloworld.java \n\n```java\n\
    package anne.godtland.helloworld;\n\nimport com.godtsoft.diyjava.diywindow;\n\n\
    public class helloworld extends window {\n    public helloworld() {\n\n      \
    \  // todo 自动生成的构造函数存根\n    }\n}\n```\n\n"
