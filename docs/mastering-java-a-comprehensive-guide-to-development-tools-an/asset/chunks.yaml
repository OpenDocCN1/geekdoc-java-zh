    # Conclusion


    The `jdk` is the java development kit and it is a necessary tool required for
    compiling, documenting, and packaging java programs. together with `jre`, an interpreter
    or loader is built into the `jdk`, a compiler called `javac`, an archive (`jar`),
    the `javadoc` document generator, and many other tools required for successful
    java development.


    The `jre` is the java runtime environment. it is the environment in which the
    java byte code may be executed, and it is used for implementing the java virtual
    machine. the `jre` also provides us with all the class libraries and many other
    support files required at runtime by the `jvm`. it is, in basic terms, a software
    package that provides us with everything we need for running java programs, a
    physical implementation of the java virtual machine.


    `Jvm` stands for java virtual machine. the `jvm` is an abstract machine, a specification
    that provides us with the `jre` in which our byte code is executed. the `jvm`
    must follow these notations––specification which is a document describing how
    the `jvm` is implemented, implementation which is a programme meeting the `jvm`
    specification requirements, and runtime instance, which is the `jvm` instance
    that gets created whenever the command prompt is used to write a java command
    and run a class.


    All three are, inextricably linked, and each relies on the others to work.


