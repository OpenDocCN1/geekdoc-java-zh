    \ sytem.out.print(\",\");\n        }\n        Sytem.out.print(\"\\n\");\n    }\n\
    }\n```\n\n### While loop implementation\n```java\npublic class whledemo {\n  \
    \  Public static void main(string args[]) {\n        Int [] numbe,rarray = {100,\
