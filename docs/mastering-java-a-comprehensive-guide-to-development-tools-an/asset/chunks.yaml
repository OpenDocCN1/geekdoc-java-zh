  trans: "\n\n2. 由于集合框架（collections framework）中实现了基础数据结构和算法，开发成本得以降低。\n\n3. 于审查和理解其他开发者编写的代码，因为大多数\
    \ Java 开发者都使用集合框架。此外，集合框架有完善的文档。\n\n### 数组 (Array)\n\n数组表示相同数据类型的多个元素的集合。\n\n\
    ### 数组 ADT 操作\n\n以下是数组的 API：\n\n1. 在第 k 个位置添加一个元素。值可以在 `o(1)` 常数时间内存储在数组的第 k 个位置，我们只需要在\
    \ `arr[k]` 存储该值即可。\n\n2. 读取存储在第 k 个位置的值。访问数组中某个索引处存储的值也是 `o(1)` 常数时间，我们只需要读取存储在\
    \ `arr[k]` 的值即可。\n\n3. 用新值替换第 k 个位置存储的值，时间复杂度：`o(1)` 常数时间。\n\n示例：\n\n```java\n\
    Public class arraydemo {\n  Public static void main(string[] args) { int[] arr\
    \ = new int[10];\n\n  For (int i = 0; i < 10; i++) {\n    Arr[i] = i;\n  }\n}\n\
    }\n```\n\nJava 标准数组是固定长度的。有时我们不知道需要多少内存，因此我们创建一个更大的数组，从而浪费了空间；如果数组已经满满且我们想向其添加更多值，就需要创建一个空间足够的新数组，然后将旧数组复制到新数组中。为了避免这种手动重新分配和复制，我们可以使用\
    \ Java 集合框架中的 `ArrayList` 或链表来存储数据。\n\n### Java 集合中的 ArrayList 实现\n\nJava 集合中的\
    \ `ArrayList<e>` 是一种数据结构，它实现了 `list<e>` 接口，这意味着它内部包含重复元素。数组是动态数组的实现，可以根据需要增长或缩小（内部使用数组，当它满时，会分配更大的数组，并将旧数组的值复制过去）。\n\
    \n示例：\n\n```java\nImport java.util.arraylist;\npublic class arraylistdemo {\n\
    \  Public static void main(string[] args) {\n    ArrayList<integer> al = new arraylist<integer>();\n\
    \    al.add(1);  // 在列表末尾添加 1\n    Al.add(2);  // 在列表末尾添加 2\n    system.out.println(\"\
    contents of array: \" + al);\n    system.out.println(\"array size,: \" + al.size());\n\
    \    system.out.println(\"array empty: \" + al.isEmpty());\n    al.remove(al.size()\
    \ - 1); // 移除数组的最后一个元素\n    al.remove(al); // 移除数组的所有元素\n    system.out.println(\"\
