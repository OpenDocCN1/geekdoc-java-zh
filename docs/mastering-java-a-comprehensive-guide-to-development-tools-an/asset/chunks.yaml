    有时，你想要限制参数化类型中可以作为形式化语句使用的种类。例如，一种作用于图形的技术可能只能识别数字情况或其子类。这就是限制排序参数（parameters
    of the sort）的作用。


    列出类型参数的名称以表示定义的类型参数，并配以扩展的关键字，随后跟上上界（在本例中上界是 `number`）。请注意，`extends` 在此语境下通常表示“继承”（如课程）或“实现”（如接口）。


    ### 多重边界


    类型参数可以有多个边界。具有多个边界的类型变量是边界中列出的所有类型的子类型。如果其中一个边界是一个类，则必须将其指定在第一个。例如：


    ```

    Class x { /* ... */ }

    interface y { /* ... */ }

    interface z { /* ... */ }


    Class r <extends x & y & z> { /* ... */ }

    ```


    如果没有将边界 `x` 指定在第一个，你将得到编译时错误：

    ```

    class r <extends y & x & z> { /* ... */ // 编译时错误

    ```


    # 第 11 章：集合


    ### 集合函数化


    当我们外部化代码时，我们会暴露每一个步骤。这是命令式编程的标志。然而，函数式编程的一个反复出现的主题是其完全相反的想法：代码内部化。代码内部化的行为是将细节隐藏在函数内部。但函数式编程进一步推行了这一理念，将日常编程中的微模式转换为函数。例如，遍历数据（无论是通过迭代器、`for`
    循环还是 `while` 循环）就是这些微模式中的一种。函数式编程改变了我们思考这些问题的方式。


    Java 的函数化工作如果没有对其集合库（即 `map`、`list` 和 `set` 接口）进行改造，将是不完整的。这是因为迭代通常在集合上进行，而集合是
    Java 程序的基石。这是函数化工作发生的自然场所。但进行任何种重大更改（例如向 `collection` 接口添加新方法）都会破坏所有在 Java 8 之前编写程序的向后兼容性。这不仅包括
    JDK 自身扩展 `collection` 接口的层次结构，还包括任何开放或封闭的第三方库以及内部类。Java 的设计者从未、也不会采用这种策略。然而，改变是必要的；该库于工业标准的
    1998 年引入，已经显得有些过时了。


    引入默认方法（default methods）的动机是为了使集合库现代化和函数化。默认方法是恰当的药剂，允许在层次结构的根部添加方法而不干扰现有类。子类可以继承或覆盖这些行为。与添加新的接口方法不同，子类可以在无需重新编译的情况下接受默认方法。实现了即时兼容。默认方法证明其本身是有用的，但是……


    函数式编程的第二个反复出现的主题是并行化。简单来说，函数式编程为并行处理提供了更好的工具。结果是集合库得到了增强，以便在处理集合时受益于多核 CPU。与流
    一起，集合库是将函数式风格并行处理引入 Java 的核心。


    现在我们已经学习了 Java 的标准函数式接口，可以开始将知识应用于集合了。让我们看看 Java 8 中的集合库变成了什么样。


    ### Collection 接口


    我们首先查看 `collection` 接口中一个供列表和集合可用的全新默认方法。这就是 ![image](img/image076.jpeg)` `forEach()`
    方法：


    该方法遍历整个集合，让消费者决定对每个元素做什么。这是内部迭代（internal iteration）的概念，声明式编程的体现。如何遍历的细节并未指定。这与外部迭代相反，在外部迭代中，如何遍历的细节以及对每个元素做什么都是代码中指定的。


    我们将使用好莱坞黄金时代的喜剧三人组——三傻星的 Larry、Moe 和 Curly ![image](img/image103.jpeg) 来展示这些函数化集合方法的示例。首先，让我们打印集合的内容：


    `forEach()` 方法有广泛的适用性。它是遍历集合的一种更方便的方式，而且应该是这样的。然而，由于是声明式的，有些事情是你无法做的。最显著的是，你不能像在
    `while` 循环中那样改变局部变量的状态。算法必须是函数式的。


    ![image](img/image096.jpeg)我们现在查看集合中可用的另一个新方法：


    `removeIf()` 方法将迭代、测试和移动的整个过程内部化。它只需要告知移除条件是什么。使用现在熟悉的 `predicate` 函数式接口，我们可以
    ![image](img/image074.jpeg)轻松地确定应该使用哪种 lambda。


    ![image](img/image036.jpeg)要替换列表的所有内容，我们可以使用 `replaceAll()`：


    `replaceAll` 使用 `unaryoperator` 作为其函数式接口，这是一种函数接口。


    `removeIf()` 和 `replaceAll()` 适用于所有子类，但有一个限制：底层类必须支持移除，否则将抛出异常。


