    # 第 8 章：决策与循环控制


    决策结构用于以下情况：当条件为真时，必须执行一组指令；当条件被确定为假时，必须执行另一组指令。Java 中提供了几种结构用于此类场景的编程。这些结构包括：


    ### If 语句


    该语句用于需要测试条件的情况，如果发现条件为真，则需要执行该语句后续的代码块。


