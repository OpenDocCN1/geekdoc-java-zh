- fmt: "\nSome time, you want to limit the kinds that can be used in a parameterized\
    \ type as form statements. for instance, a technique that works on figures could\
    \ only recognize number cases or its subclasses. that's what limit parameters\
    \ of the sort are for.\n\nList the name of the type parameter to indicate a defined\
    \ type parameter, accompanied by the extension's keyword followed by the upper\
    \ bound which is number in this instance. note that `extends` is generally used\
    \ in this context to mean either \"extends\" (as in courses) or \"implements\"\
    \ (as in interfaces).\n\n### Multiple bounds\n\nType parameters can have more\
    \ than one bound. a type variable with multiple bounds is a subtype of all the\
    \ types listed in the bound. if one of the bounds is a class, it must be specified\
    \ first. for example:\n\n```\nClass x { /* ... */ }\ninterface y { /* ... */ }\n\
    interface z { /* ... */ }\n\nClass r <extends x & y & z> { /* ... */ }\n```\n\n\
    If bound `x` is not specified first, you get a compile-time error: \n```\nclass\
    \ r <extends y & x & z> { /* ... */ } // compile-time error\n```\n\n# Chapter\
    \ 11: collections\n\n### Functionalizing collections\n\nWhen we externalize code,\
    \ we expose every step. this is the hallmark of imperative programming. however,\
    \ one of the recurring themes of functional programming is the idea of doing the\
    \ exact opposite: internalizing code. the act of internalizing code is to hide\
    \ the details inside a function. but functional programming pushes this idea further\
    \ by turning micro-patterns of everyday programming into functions. for example,\
    \ iterating over data, be it with iterators, for-loops, or while-loops, is one\
    \ of those micro-patterns. functional programming changes the way we think about\
    \ them.\n\nJava’s functionalization effort would not be complete without a revamp\
    \ of its collections library, namely the `map`, `list`, and `set` interfaces.\
    \ this is because iteration is often done over collections and they are the very\
    \ fabric of java programs. it is a natural place for the functionalization effort\
    \ to occur. but making any kind of significant changes, like adding new methods\
    \ to the `collection` interface, would break backward compatibility to all programs\
    \ written pre-java 8. this includes not only the jdk’s own hierarchy extending\
    \ the `collection` interface, but any open or closed 3rd party library and in-house\
    \ classes. java’s designers never have and will never adopt such a strategy. yet\
    \ changes were necessary; the library was introduced in 1998 in industry years\
    \ and was showing its age.\n\nThe motivation for the introduction of default methods\
    \ was needed to modernize and functionalize the collections library. default methods\
    \ are just the right tonic to permit added at the root of the hierarchy without\
    \ disturbing classes. subclasses can either inherit or override the behavior.\
    \ unlike adding new interface methods, subclasses can automatically accept default\
    \ methods without recompilation. instant compatibility is achieved. default methods\
    \ have proven useful in their own right but...\n\nA second recurring theme in\
    \ functional programming is parallelization. quite simply functional programming\
    \ offers a better mouse for parallel processing. as a consequence, the collections\
    \ library has been enriched to benefit from multi-core CPUs when processing collections.\
    \ together with streams, the collections library is at center in bringing functional-style\
    \ parallel processing to java.\n\nNow that we’ve studied java’s standard functional\
    \ interfaces, we can begin to apply that knowledge to collections. let’s look\
    \ at what has become of the collections library in java 8.\n\n### Collection interface\n\
    \nWe start by looking at a brand new default method in the `collection` interface\
    \ available to lists and sets. this is the ![image](images/image076.jpeg)`forEach()`\
    \ method:\n\nThis method iterates through the entire collection letting the consumer\
    \ decide what to do for each element. this is the concept of internal iteration\
    \ and a manifestation of declarative programming. the details of how to iterate\
    \ are not specified. this is in opposition to external iteration, where the details\
    \ of how to iterate as well as what to do with each element are specified in code.\n\
    \nWe will show examples of these functionalized collection methods with the slapstick\
    \ comedy trio from the golden age of hollywood films: larry, moe, and curly of\
    \ the three stooges ![image](images/image103.jpeg). to start, let’s print the\
    \ contents of a collection:\n\nThe `forEach()` method has a very wide range of\
    \ applicability. it is a much more convenient way to iterate through collections\
    \ and should be. however, being declarative, are some things you will not be able\
    \ to do. most notably, you cannot change the state of local variables like you\
    \ could in a while-loop. algorithms must be functionally.\n\n![image](images/image096.jpeg)We\
    \ now look at another new method available in collection:\n\nThe method `removeIf()`\
    \ internalizes the entire process of iterating, testing and moving. it requires\
    \ only to be told what the condition for removal is. Using the now-familiar predicate\
    \ functional interface, we can ![image](images/image074.jpeg)easily figure out\
    \ what kind of lambda to use.\n\n![image](images/image036.jpeg)To replace all\
    \ contents of a list, we can use `replaceAll()`:\n\nreplaceAll uses a unaryoperator\
    \ as its functional interface, which is a function interface.\n\nBoth `removeIf()`\
    \ and `replaceAll()` are available to all subclasses with one cave: the underlying\
    \ class must support removal, or an exception will be thrown.\n"
