    # 结论


    `jdk` 是 Java 开发工具包，它是编译、文档化和打包 Java 程序所必需的工具。与 `jre` 一起，`jdk` 构建了解释器或加载器、一个名为
    `javac` 的编译器、一个归文件 (`jar`)、`javadoc` 文档生成器，以及成功 Java 开发所需的许多其他工具。


    `jre` 是 Java 运行环境。它是执行 Java 字节码的环境，用于实现 Java 虚拟机。`jre` 还为我们提供了 `jvm` 在运行时所需的所有类库和许多其他支持文件。简单来说，它是一个提供运行
    Java 程序所需一切要素的软件软件包，是 Java 虚拟机的物理实现。


    `Jvm` 代表 Java 虚拟机。`jvm` 是一个抽象机器，是一个规范，为我们提供了执行字节码的 `jre`。`jvm` 必须遵循这些记法——规范（描述
    `jvm` 如何实现的文档）、实现（符合 `jvm` 规范要求的程序）以及运行时实例（每当使用命令行编写 Java 命令并运行类时都会创建的 `jvm` 实例）。


    这三者紧密不可分，每一者都依赖对方才能正常工作。


    在此，我感谢你选择我的 Java 编程指南。如你所见，这是一门简单又复杂的语言，有许多不同的维度需要学习。到目前，你应该对 Java 编程的核心概念以及如何使用它有了良好的理解。


    你的下一步非常简单：练习，并坚持练习。你不可能只读一遍指南就认为自己无所不知。我敦促你花时间仔细阅读；仔细遵循教程，在完全理解某个章节及其含义之前，不要跳到下一个章节。


    为了帮助你，网上可以找到许多有用资源，那里有很多准备好帮助你并指引正确方向的人。还有许多在线课程，有些免费的，有些需要付费，但它们都是有用的，可以帮助你将学习提升到新的水平。


    你喜欢这些内容吗？我希望它包含了你所需要的甚至更多，并让你走上了获得梦想工作的正确道路。


    感谢下载我的书；如果你觉得它有帮助，请考虑在 amazon.com 上给我留评价。

