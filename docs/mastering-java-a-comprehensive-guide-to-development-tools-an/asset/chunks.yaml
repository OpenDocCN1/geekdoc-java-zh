    Java EE 8 是本书编写时的最新版本。Java EE 修订后的设计为企业解决方案提供了更强大的技术，并为安全和管理目的提供了现代化的应用程序。该版本的特点包括多项进展，涵盖了通过客户端提供的更强大的
    REST API 能力、JSON 绑定以及安全 API。根据 Oracle 官方网站 2019 年 12 月发布的信息，此版本还包含日期和时间 API 以及流
    API。


    ### Java ME


    Java ME 平台强调简单性、可移植性和动态性，为为微型设备和设备构建应用程序提供了一个多功能环境。Java ME 以其卓越的应用开发环境而闻名，这归功于其交互且用户友导航界面，以及实现网络概念的内置能力。它与物联网（IoT）密切相关，在构建用于内置技术或连接设备的应用程序时非常有用，这些设备可用于发明或实现未来的概念。Java
    ME 的可移植性和运行时属性使其适用于可穿戴设备、手机手机、摄像头、传感器和打印机等物品和设备的软件应用。


    Java ME SDK 配备了必要的工具，用于在独立环境中开发软件应用程序、测试功能以及实现设备仿真。根据 Oracle 网站 2019 年发布的信息，此
    JDK 非常适合适应“连接受限设备配置 (CLDC)”技术以及“连接设备配置 (CDC)”功能。这为开发应用程序提供了一个单一且多功能的环境。


    还有其他几种 Java ME 解决方案支持在应用程序中部署 Java 语言。Java embedded 提供了一个在设备中集成物联网运行的运行时环境，而 Java
    embedded 客户端有助于构建运行和优化内置程序功能的软件解决方案。Java for mobile 则利用 CLDC 和 Java 开发者工具栈来为移动设备创建创新功能。


    ### Java 运行时环境 (JRE)


    请记住，Java 应用程序要高效运行必须满足某些条件。JRE 包含了负责创建这些条件的要素，包括 JVM 及其相应的文件。尽管 JRE 是 JDK 的一个组件，但如果任务仅限于运行而非构建指令，它是能够独立运行的。JRE
    为 Java 生态系统中的不同程序赋予了重要属性。例如，如果一个程序在其内部运行 JRE，那么它就是自包含的。这意味着程序不依赖于其他程序来访问 JRE。这种独立性使得程序能够与不同的操作系统实现兼容。


    ### Java 虚拟机 (JVM)


    JVM 作为计算机程序中实现 Java 的规范。它是 Java 语言平台无关特性背后的推动力。JVM 作为由其他程序执行的程序，这一地位更加凸显。编写用于与
    JVM 交互并执行它的程序，使得每一个 JVM 实现都对应特定的操作系统。这便于了将 Java 程序翻译或解释为本地操作系统的运行时指令，并消除了 Java
    编程中对平台依赖的需求。


    作为开发者，你必须警惕你的开发环境和应用程序对于网络攻击和其他威胁的脆弱性。JVM 提供了增强的安全功能，保护你免受此类威胁。这种稳固的安全基础归功于其类文件操作码中内置的语法和结构限制，但这并不意味着
    JVM 能够容纳的类文件范围受到限制。JVM 实际上接受各种类文件，只要这些文件可以被验证是安全的。因此，JVM 是使用其他编程语言开发软件时可行的补充替代方案。


    JVM 经常作为移植功能包含在各种软件应用程序和硬件安装中。它是通过 Oracle 或任何其他提供者确定的算法实现的。因此，JVM 提供了一个开放的实现平台。JVM
    实际上包含运行时实例作为锚定它的核心属性。例如，创建一个 JVM 实例涉及编写一条运行 Java 类属性的指令。


    一个 Java 程序需要熟悉 JVM 的关键部分，例如加载器和运行时数据段，以及负责在那里执行程序的引擎。还有与性能相关的组件，如垃圾回收器和堆维度工具，它们对
    JVM 的部署同样重要。JVM 与字节码之间存在着紧密的联系。


    ### 字节码 (bytecode)


    字节码本质上是包含在类文件中、与符号表等其他信息的 JVM 命令。它们作为背景语言运行，负责促进 JVM 操作的解释和执行。字节码实际上是原生代码的替代品，因为
    Java 不提供后者。JVM 寄存器的结构使得它包含方法，而方法反过来容纳字节码流——即 JVM 的指令集。换句话说，每个 Java 类内部都有方法，并且类文件加载过程为任何给定的方法执行单个字节码流。当程序开始运行的瞬间，方法的激活会自动触发字节码。

