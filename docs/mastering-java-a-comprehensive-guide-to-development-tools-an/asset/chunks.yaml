    # Introduction


    Java is a widely-used programming language, on the web and in computing applications.
    it is a free, download solution that allows users to access the latest versions
    and implement updates. This particular programming language is present in the
    majority of today’s web applications and computing technologies. java’s scalable
    characteristics make it suitable for deployment in a wide range of applications,
    including apps for small electronic devices like cell phones and software solutions
    for large-scale operations such as data centers. The growing preference for deploying
    java is attributable to its robust functional features and sound security credentials.


    Java is a programming language that is built by Sun Microsystems which was later
    taken over by the Oracle corporation. it is designed to run on any operating system
    that supports java. This is what made the language so popular, because the developer
    just had to write the program once, and the program could then run on any operating
    system without the need for the programmer to change the code.


    Most of the modern applications built around the world are made from the java
    programming language. most of the server-side and business logic components of
    major applications are built on the java programming language.


    During the entire course of this book, you will learn how to write programs such
    as the one above, and also learn advanced concepts that will enable you to start
    writing complete application programs.


    Some of the design goals for java are mentioned below:

    The language is intended to be written once and have the ability to run on any
    operating system.

    The language should provide support for numerous software engineering principles.
    portability is an important factor. this is why java has the ability to run on
    windows and the mac system.

    Support for internationalization is very important. Java is intended to be suitable
    for writing applications for both embedded systems.


    Other design goals are discussed next:


    ### Strong type checking


    Java is a strong type language. every variable that is defined needs to be attached
    to a type. You don’t need to understand the complete program for now, but let’s
    just have a quick look at 2 lines of the code.


    ```

    int i=5;

    ```

    Here we are defining something as a variable, which is used to hold a value. the
    value that can be stored depends on the data type. in this example, we are saying
    that `i` is of the type `int` which is a numeric value.


    ### Array bounds checking


    At runtime, java will check whether the array has the required number of values
    defined. if one tries to access a value which is outside the bounds of the array
    an exception will be thrown. You don’t need to understand the complete program
    for now, but let’s just have a quick look at the following lines of the code.


    ```

    int[] array1 = new int[2];

    ```

    Here we are declaring an array which is a set of integer values. the value of
    2 means we can only store two values in the array.


    ```

    array1[0] = 1;

    array1[1] = 2;

    array1[2] = 3;

    ```

    With this code, we can see that we are assigning 3 values to the array. when you
    run this program, you will get an error because the program will see that the
    array has gone out of its maximum allowable bounds of two. you will get the below
    error at runtime.


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 2

    At helloworld.main(helloworld.java:8)

    ```


    ### Why java is important?


    Next, java has syntax and features that resemble other programming languages like
    c and c++. if you have any prior programming experience, you will find learning
    java a breeze. even if you are totally new to programming, you can rest assured
    that java is designed to be a relatively easy language to learn. most programmers
    find it easier to learn java than say c or c++.


    Java is also designed to be platform-independent. as mentioned earlier java code
    is compiled into byte code which can be run on any machine that has the java virtual
    machine. hence with java you can write the code once and run it anywhere you want.


    ### Why java?


    Of course, one of the key reasons to use java is its focus on object programming.
    Object Object programming or “oop” is a type of programming language model which
    allows the program’s code to be organized around data rather than functions and
    logic, which is known as procedural programming. These “data clusters” are organized
    into things called “objects,” understood here in the traditional sense of how
    classes are: types of objects, allowing the programmer to classify them according
    to two major criteria: attributes and methods.

