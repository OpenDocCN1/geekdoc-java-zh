  trans: "\n\nJava 中的对象必须有状态，状态将存储在字段中，行为则由方法指示。\n\n类就像一种地图，或者说你也可以称之为蓝图，根据它创建对象。这是一个类的外观所示：\n\
    \n```java\nPublic class dog {\n  string breed;\n\n  Int age,c;\n\n  String color;\n\
    \n  Void barking() {\n\n  }\n\n  Void whining() {\n\n  }\n\n  Void sleeping()\
    \ {\n\n  }\n}\n```\n\n类可以具有以下任何一种变量类型：\n\n![image](img/image100.png)局部-定义在构造函数、块或方法内部。变量在方法内部声明并初始化，并在方法结束时被销毁。\n\
    \n![image](img/image100.png)实例变量-定义在类中但在方法之外。在类实例化时初始化，并可以从类的任何构造函数、块或方法内部进行访问。\n\
    \n![image](img/image100.png)类变量-声明在类内部，使用 `static` 关键字且在任何方法之外。\n\n类可以拥有任意数量的方法，以访问方法中所有不同类型的值。在我们上面的示例中，我们有三个方法：`barking()`、`whining()`\
    \ 和 `sleeping()`。\n\n### 构造函数\n\n每个类都会有一个构造函数；如果你省略了它，编译器将构建一个默认构造函数。当你创建一个新对象时，必须至少调用一个构造函数。根据规则，构造函数的名称必须与类名相同，并且可以根据需要拥有任意数量的构造函数。\n\
    \n这是一个构造函数的示例：\n```java\npublic class puppy {\n  Public puppy() {\n\n  }\n\n \
    \ Public puppy(string name,) {\n// 此构造函数有一个单个参数 name,.\n\n}\n}\n```\n\n### 创建对象\n\
    \n我们已经知道类是用于创建对象的某种蓝图，因此不言而明对象是从类中创建的。要创建一个新对象，我们需要 `new` 关键字。\n\n从类中创建对象需要以下三个步骤：声明——必须声明一个带有名称和对象类型的变量；实例化——使用\
    \ `new` 关键字来创建对象；初始化——调用构造函数，这会初始化对象。\n\n下一个示例展示了如何创建对象：\n```java\npublic class\
    \ puppy {\n  Public puppy(string name,) {\n// 此构造函数包含一个名为 name 的单个参数.. system.out.println(\"\
    passed name is :\" + name, );\n\n  }\n\n  Public static void main(string [] args)\
    \ {\n// 下一语句将创建一个名为 puppy 的对象 puppy = new puppy( \"fluffy\" );\n\n  }\n}\n```\n\
    运行此并观察发生了什么。\n\n### 访问实例变量和方法\n\n当我们想要访问实例变量和方法时可以使用对象；此示例展示了如何访问一个实例：/* 先创建对象\
    \ */ `reference = new();` /* 现在调用我们的变量 */ `reference.variable;` /* 现在这样调用类方法 */\
    \ `reference.method();`\n\n接下来我们看到如何访问类中的实例变量和方法：\n```java\npublic class puppy\
    \ {\n  Int puppyage;\n\n  Public puppy(string name,) {\n// 此构造函数包含一个名为 name 的单个参数..\
    \ system.out.println(\"name is :\" + name, );\n\n  }\n\n  Public void settage(int\
    \ age,) {puppyage = age; }\n\n  Public int gettage() {\n  System.out.println(\"\
    puppy's age is :\" + puppyage); return puppyage;\n\n  }\n\n  Public static void\
    \ main(string[] args) {\n// 对象创建\n  Puppy puppy = new puppy( \"fluffy\" ); /*\
    \ 现在调用类方法来设置小狗的年龄 */ puppy.sette(2); /* 接下来调用另一个类方法来获取小狗的年龄 */ puppy.gettage();\
    \ /* 以这种方式访问实例变量 */ system.out.println(\"variable value :\" + puppy.puppyage,\
    \ );\n\n  }\n}\n```\n\n### 导入语句\n\n需要记住的一点是路径必须是完全限定的，这包含了类名和包名。如果不是，编译器将难以加载源码和类。为了限定路径，我们需要使用\
    \ `import` 语句，在这个示例中，我们看到编译器如何将请求的类加载到我们指定的目录：\n\n```java\nimport java.io.*;\n\
    ```\n\n接下来我们需要创建两个类，一个称为 `employee`，另一个称为 `employeetest`。我们使用以下代码来实现——记住 `employee`\
    \ 是类名，且它是一个公共类。执行此操作并保存文件，命名为 `employee.java`。\n\n另外注意，这里有四个实例变量——age、name、designation\
    \ 和 salary，以及一个显式定义并带有参数的构造函数：\n\n```\npublic class employee {\n  string name,\n\
    \n  Int age;\n\n  String designation; double salary;\n\n// 是 employee 的构造函数\n\
    \  Public employee(string name,) {\nname = name;\n\n}\n\n// 设置员工的年龄\n  Public\
    \ void settage(int age,) {age = age; }\n\n// 设置员工的职位\n  Public void setdesignation(string\
    \ designation,) {\ndesignation = designation;\n}\n\n// 设置员工的工资\n  Public void\
    \ setsalary(double salary,) {\nSalary = salary;\n}\n\n// 打印员工详情\n  Public void\
    \ printemployee() {\n  System.out.println(\"name:\" + name, );\n  System.out.println(\"\
    age:\" + age, );\n  System.out.println(\"designation:\" + designation, );\n  System.out.println(\"\
    salary:\" + salary, );\n\n}\n\n```\n\n代码处理从 main 方法开始，因此你需要确保你的代码有一个创建对象的 main\
    \ 方法。将此代码保存在 `employeetest` 中：\n```java\npublic class employeetest {\n\nPublic\
    \ static void main(string[] args) {\n// 使用构造函数创建两个对象\n  employee employeeone =\
    \ new employee( \"bobby bucket\" ); employee employeetwo = new employee( \"shelly\
    \ mary\");\n\n// 为创建的每个对象调用方法\nemployeeone.setteage(28);\nemployeeone.setdesignation(\"\
    senior software developer\");\nemployeeone.setsalary(1500);\n\nemployeeone.printemployee();\n\
    \nemployeetwo.setteage(22);\nemployeetwo.setdesignation(\"software developer\"\
    );\nemployeetwo.setsalary(850);\n\nemployeetwo.printemployee();\n\n}\n\n}\n```\n\
    现在需要编译这些类，并运行 `employeetest`；执行此操作并看你得到什么。\n\n你应该看到：\n\n输出\n\n"
