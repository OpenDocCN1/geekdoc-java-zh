- fmt: "\nThe attributes of a class are the raw data that will create the object:\
    \ these are its descriptors, such as the values that it possesses, and other relevant\
    \ data that will make up the object. the second criterion is the \"method\" of\
    \ the object.\n\nThis \"method\" is the behavior or the logical sequences contained\
    \ within the class describing how it interacts or can be interacted with natively.\n\
    \n# Chapter: java basics\n\nOf course, one of the key reasons to use java is its\
    \ focus on object-oriented programming. object-oriented programming, or \"oop\"\
    \ is a type of programming language model which allows the program’s code to be\
    \ organize around data rather than functions and logic, which is known as procedural\
    \ programming.\n\nThese objects are created by something called \"classes,\" understood\
    \ here in the traditional sense of how classes are types of objects, allowing\
    \ the programmer to \"classify\" them according to two major criteria: attributes\
    \ and methods.\n\nThe attributes of a class are the raw data that will create\
    \ the object: these are its descriptors, such as the values that it possesses,\
    \ and other relevant data that will make up the object.\n\nThe second criterion\
    \ is the \"method\" of the object.\n\nIn order to make this clearer, say that\
    \ there is a class \"human.\" this \"class\" will have attributes such as height,\
    \ weight, gender, and race. the \"human\" class can also have methods such as\
    \ \"run,\" \"walk,\" \"talk.\" these theoretical components make up the \"human\"\
    \ class, a blueprint for an object.\n\nNow that the class has been defined, the\
    \ programmer, if they so wish, can create an object using the \"human\" class\
    \ as a blueprint.\n\nThey can invoke the class \"human\" and \"populate,\" its\
    \ attributes, giving it a specific height, weight, gender, and race. in addition,\
    \ the object already has built-in functions such as \"run,\" \"walk,\" and \"\
    talk,\" so upon the creation of an object, let’ say named \"mike,\" from the \"\
    human\" class, it already contains the functions to run, walk, and talk, without\
    \ need for the programmer to code those specific functions again, as they are\
    \ already \"inherit\" in the created object.\n\nIn a nutshell, that is what object-oriented\
    \ programming is meant to be: a way of programming that allows the programmer\
    \ to draw on predefined classes so that it will be easier to describe them and\
    \ use their internal or built-in functions in order to operate.\n\nAssuming that\
    \ the reader is not a total new to programming and has been introduced to the\
    \ world of programming using another procedural language, the next logical question\
    \ would be: why even object-oriented programming?\n\nWell, one of its main advantages\
    \ is that in the long run it saves time. procedural programming is usually quicker\
    \ and more straightforward in simple algorithms and programs; rather than having\
    \ to construct and define a class and create an object based on that all the programmer\
    \ really has to do is to declare the necessary variables and write the functions\
    \ and create the algorithm in order to solve the problem they need to code. however\
    \ when it comes to complex programs needing more solutions this is where object-oriented\
    \ programming begins to shine, and this is where it starts to show its strength.\
    \ In a lot of programs, there will be times that the number of objects or data\
    \ clusters have to be grouped together and that the programmer will be treated\
    \ a certain way. This is what \"classes\" are meant to add. Instead of declaring\
    \ a new set of variables per cluster, they can simply draw on a pre-made \"class\"\
    \ and create a new \"object.\" Let’s see how this would work in practice.\n\n\
    If a programmer were to code a chess game in procedural fashion, then they would\
    \ have to manually describe each and every piece, all sixteen pawns, four bishops\
    \ and four knights, four rooks, two queens, and two kings. in addition, they will\
    \ have to write the functions that allow each piece to move in its own separate\
    \ way.\n\nhowever, if the programmer makes use of object-oriented programming\
    \ instead of having to code sixteen pawns, four bishops, four knights, four rooks,\
    \ two queens, two kings, they simply have to code six classes: one class to describe\
    \ each piece on the board. The programmer can now simply include the movement\
    \ functions within each class and have the attributes describe their position:\
    \ whether they’re white king’s pawn, or black queen’s pawn, these are all things\
    \ that can be inserted through the \"attributes\" portion of the \"pawn\" class.\
    \ instead of thirty–two clusters of code, the programmer only has to do six.\n\
    \nNow it’s much easier and more\n\n### Java Tokens\n\nThe tokens are the smallest\
    \ units of a Java program. The compiler breaks the source code into tokens. There\
    \ are six types of tokens in Java: keywords, identifiers, literals, operators,\
    \ operators, and separators.\n\nKeywords are reserved words that have a special\
    \ meaning in the Java compiler. They cannot be used as identifiers. Examples include\
    \ `public`, `private`, `class`, `if`, `else`, `while`, `for`, `return`.\n\nIdentifiers\
    \ are names given to variables, methods, and classes. An identifier must start\
    \ with a letter, underscore, or dollar sign, and it can contain letters, digits,\
    \ underscores, and dollar signs.\n\nLiterals are constant values. For example,\
    \ `10` is an integer literal, and `10.5` is a floating-point literal.\n\nOperators\
    \ are symbols used to perform operations on variables and values. Examples include\
    \ `+`, `-`, `*`, `/`, `=`, `==`, `<`, `>`, etc.\n\nSeparators are symbols used\
    \ to organize the code. Examples include `;`, `,`, `{`, `}`, `(`, `)`, `[`, `]`.\n\
    \n### Variables\n\nVariables are containers that store data values. To declare\
    \ a variable, you must specify its type and its name. For example: `int age =\
    \ 25;`\n\nThe type of a variable determines what kind of data it can hold. Common\
    \ data types include `int` for integers, `double` for floating-point numbers,\
    \ `boolean` for true/false values, and `char` for single characters.\n\nOnce a\
    \ variable is declared, its value can change during the execution of the program.\
    \ For example: `age = 30;`\n\n### Methods\n\nMethods are blocks of code that perform\
    \ a specific task. A method is defined with a name, a return type, and potentially\
    \ parameters. For example:\n\n```javapublic int add(int a, int b) {\n    return\
    \ a + b;\n}\n```\n\nIn this example, `add` is the name of the method, `int` is\
    \ the return type, and `a` and `b` are the parameters.\n\n### Classes and Objects\n\
    \nA class is a blueprint for creating objects. It defines attributes (data) and\
    \ methods (behavior) that the objects will have.\n\n```java\npublic class Car\
    \ {\n    String color;\n    int year;\n\n    void drive() {\n        System.out.println(\"\
    The car is driving\");\n    }\n}\n```\n\nAn object is an instance of a class.\
    \ You can create an object using the `new` keyword:\n\n```javaCar myCar = new\
    \ Car();\nmyCar.color = \"red\";\nmyCar.year = 2022;\nmyCar.drive();\n```\n\n\
    ### Control Flow\n\nControl flow statements allow you to control the execution\
    \ of code. The most common control flow structures are `if` statements, `switch`\
    \ statements, and loops.\n\n```java\nif (age >= 18) {\n    System.out.println(\"\
    Adult\");\n} else {\n    System.out.println(\"Minor\");\n}\n```\n\nLoops are used\
    \ to repeat a block of code. The most common loops are `for` loops and `while`\
    \ loops.\n\n```java\nfor (int i = 0; i < 5; i++) {\n    System.out.println(\"\
    Iteration: \" + i);\n}\n```\n\n### Exception Handling\n\nJava uses exceptions\
    \ to handle errors that occur during program execution. This is done using `try-catch-finally`\
    \ blocks.\n\n```java\ntry {\n    int result = 10 / 0;\n} catch (ArithmeticException\
    \ e) {\n    System.out.println(\"Cannot divide by zero!\");\n} finally {\n   \
    \ System.out.println(\"This code always executes\");\n}\n```\n"
