    The created objects are used to access methods and instance variables. to access
    instance variables, you will use the steps: First, you must create an object:
    `object = new constructor();` next call variable like: `object.variable` call
    a method: `object.method()`


    ### Java package


    A package is simply a way of grouping interfaces and classes. a java package serves
    as container for classes. the usual basis for grouping is functionality. the use
    of packages facilitates reusability. when interfaces and classes are categorized
    into packages you can easily access them for use in other programs. the use of
    packages also prevent name conflicts among classes and interfaces. To create a
    package,, use the package statement before the package name as the first statement.
