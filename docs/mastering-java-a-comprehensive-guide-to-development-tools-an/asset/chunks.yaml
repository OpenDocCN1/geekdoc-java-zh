    访问修饰符用于定义方法、变量、类和构造函数的访问级别。


    ### Private–仅在类内部访问


    当一个方法、变量、类或构造函数被声明为 `private` 时，意味着它仅在类内部可用。然而，如果该类具有公有的 getter 方法，你可能可以在类外部访问私有变量。`private`
    关键字表示最高的访问限制。请注意，你不能将接口和类声明为 `private`。


    ### Public–对所有人可见


    定义为 `public` 的方法、接口、构造函数、类等可以从其他类访问。同样地，在公有类内部定义的块、方法或字段也可以从 Java 类访问。只要它们在同一个包中，这一点就成立。如果你想从另一个包访问公共类，则必须导入该公共类。在类继承概念下，子类继承类所有的公共变量和方法。


    请注意，应用程序的 `main()` 方法必须声明为 `public`，Java 解释器才能调用它来运行该类。


    ### Protected–对所有子类和包可见


    在父类中将方法、变量或构造函数声明为 `protected`，使其仅对该包内的类或另一个包中的子类可见。如果你想允许子类使用变量或辅助方法，并防止无关类使用它们，则使用这种访问类型。接口及其字段、方法不应声明为
    `protected`，但接口外部的字段和方法可以声明为 `protected`。类不应被声明为 `protected`。


    ### Default：未提供修饰符时适用–对包可见


    未声明修饰符的方法或变量可以被包内的其他类访问。


    下表总结了不同的访问修饰符及其影响：


    | 修饰符 | 类内部 | 包内 | 包外（通过子类） | 包外 |

    | :--- | :--- | :--- | :--- | :--- |

    | Private | Y | N | N | N |

    | Public | Y | Y | Y | Y |

    | Protected | Y | Y | Y | N |

    | Default | Y | Y | N | N |


    ### 非访问修饰符


    非访问修饰符可用于访问 Java 中的各种功能。


    ### Final–用于确定变量、方法和类的实现


    #### Final 变量

    你只能显式地初始化 `final` 变量，一旦你将变量声明为 `final`，你将永远无法将其赋值给另一个对象。但注意，你仍然可以更改存储在对象内部的数据。这意味着你可能更改对象的状态，但无法更改引用。`final`
    修饰符通常与 `static` 配合使用，以创建一个常量值的类变量。


    #### Final 方法

    `final` 关键字用于防止方法被子类修改。


    #### Final 类

    `final` 修饰符用于防止其他类继承声明为 `final` 的类的任何特性。


    ### Static–用于创建类方法或变量


    你可以使用此关键字创建一个唯一的变量（称为静态变量），它将独立于该类的其他实例而存在。你不能将局部变量声明为 `static`。还可以使用 `static`
    关键字创建一个方法（称为静态方法或类方法），它将独立于该类的其他实例而存在。静态方法仅识别并处理来自给定参数的数据，而不依赖变量。你可以通过在类名后加点（.）编写变量或方法名访问类方法和类变量。


    ### Abstract–用于创建抽象方法或类


    #### 抽象类

    当类被声明为 `abstract` 时，意味着你永远无法实例化该类。将类声明为抽象类的唯一理由是为了扩展该类。你不能将一个类同时声明为 `final` 和
    `abstract`，因为你无法扩展一个 `final` 类。使用抽象方法的类必须声明为 `abstract`。这样做会导致编译错误。


    #### 抽象方法

    由于抽象方法声明时没有实现，它的方法体从子类中派生。抽象方法不能声明为 `strict` 或 `final`。除非它本身也是一个抽象类，否则扩展抽象类的类必须采用父类的抽象方法。包含至少一个抽象方法的类应该声明为抽象类。另一方面，抽象类并不一定需要抽象方法。


    ![image](img/image105.jpeg) 示例：


    ### Synchronized（同步）


    ![image](img/image047.jpeg) `synchronized` 修饰符用于指示任何时间只有一个线程可以访问方法。


    #### Volatile（volatile）


    `volatile` 关键字用于指示访问变量的线程应该看到存储在内存中的副本。它同步变量的所有副本。


    #### Transient（瞬态）


    `transient` 关键字用于在序列化包含标记变量的对象时跳过该实例。


