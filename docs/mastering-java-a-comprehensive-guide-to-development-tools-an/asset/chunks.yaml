    这一顶层是你赋予类的名称。该名称应该能够具体地识别并描述用户所看到或体验到的对象类型。


    简单来说，名称或标识符应该标识该类。


    ### 运算符


    Java 拥有广泛的运算符环境。


    如果你在想什么是运算符，可以将其看作一种符号，它向编译器传递特定的信息，以执行逻辑操作或数学运算。在 Java 中，你将与四类运算符进行交互。


    这四类运算符包括：


    ![image](img/image100.png)![image](img/image100.png)![image](img/image100.png)![image](img/image100.png)逻辑运算符
    位运算符 关系运算符 算术运算符


    和其他计算语言一样，Java 拥有一列表定义的额外运算符，用于处理某些特定场景。


    在学习 Java 编程语言或任何编程语言时，在开始之前，你必须理解五个基本概念。


    ![image](img/image100.png)这五个基本概念包括：变量


    ![image](img/image100.png)![image](img/image100.png)![image](img/image100.png)数据结构
    控制结构 语法


    ![image](img/image100.png)工具


    每一个概念都将从初学者水平进行彻底解释，以确保它们被理解。


    ### 分隔符


    它们不适用于高层抽象：注意，许多程序使用了底层的构建，而这些构建主要用于底层抽象。


    这些编程语言的常用方法是关注机器——如何让计算机做某些事情，而不是这些功能如何帮助解决用户的问题。


    这些语言处理的是微小的细节，这已经超出了高层抽象的范围，而高层是我们今天看到的更常见的方法。


    在底层抽象中，数据结构和算法是分开的，而在高层抽象中，它们被视为一个整体。


    ### 字面量


    提到 Java 中的字面量时，我们指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是字面量。大多数时候，字面量可以是常量。


    字面量在程序中非常重要。事实上，大多数 Java 程序都使用字面量。我们在书中讨论的一些程序也使用了字面量。


    Java 中的字面量可以属于各种数据类型。


    每个字面量的显示方式由其类型决定。正如之前提到的，将常量用单引号括起来，例如 `''c''` 和 `''''`。


    我们定义的整数字面量不带小数部分。例如，`12` 和 `-30` 是整数字面量。浮点字面量应该包含整数部分和小数部分。`12.389` 就是字面量。Java
    进一步允许对浮点使用科学计数法。整数字面量包含值，任何人都可以用 `short` 变量来初始化它们。


    ### 注释


    当这种情况发生时，我们称之为注释。在程序的运行阶段，注释是无意义的。这意味着你可以使用注释功能来说明或解释你创建的代码想要实现的目标。你可以通过输入两个斜杠和注释来实现这一点。这里是一个示例：


    // 单行注释


    你可以通过以下任一方式拥有多行注释：


    ```

    // 我们将

    // 把注释分成两行


    /* 这条注释跨越了两行 */

    ```


    如果你查看上面的注释，你会发现它以 `/*` 开始，但以 `*/` 结束。此外，如果你看之前的图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开始，但以一个星号和一个斜杠结束；这被称为
    javadoc 注释。


    # 第 2 章 变量


    ### 什么是变量？


    另一方面，变量是一个包含特定数据类型的“对象”，并被赋值或接收值。它被称为变量，是因为其中包含的值可以根据它在代码中的用法、程序员声明其值的方式，甚至是程序用户选择如何与其交互而发生改变。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头的存储值。


    ### Java 中的变量类型


    Java 要求程序员使用声明语句——用于声明变量并通过指定特定数据类型和名称来定义它们的代码行。Java 有有处理变量的特殊方式，将变量定义为包含特定类型和信息值的容器，不像
    Python 等某些语言只需要声明变量，且变量可以动态更改类型；Java 变量一旦声明，类型就是静态的。


    `int number = 20;`


    `boolean completed = true;`

    `string hello = "world!"`


    声明的语法在之前的示例中可见，即类型、变量名、值。同样注意，声明语句可以由多个声明组成，如下例所示：


    `int number = 20, boolean completed = true, string hello = "world!"`


    Java 变量可以在开始时不赋任何值；在这些情况下，Java 会选择为这些变量指定一个特定的默认值，例如：


    ```

    byte a;

    short num;

    boolean answer;

    ```


    将分别产生值 0、0 和 false。默认值的完整列表如下：`byte`、`short`、`int` 和 `long` 数据类型都将产生默认值 默认值，而
    `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘u\0000’ 值，`string` 或任何其他对象将具有
    null 默认值，所有的 `boolean` 都将从 false 默认值开始。


