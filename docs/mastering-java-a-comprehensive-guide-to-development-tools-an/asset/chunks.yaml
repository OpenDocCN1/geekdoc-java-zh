    在 map 中使用列表（list）作为值，最令人烦恼的问题之一是在添加元素、更新或删除元素之前，需要不断检查 map 是否存在。首先，你必须尝试提取列表，如果没有找到则创建它。例如，假设我们有一个实现为
    map 的电影数据库更新方法。map 的键（key）是电影年份，值是该年份的电影列表。在 Java 8 之前，代码看起来如下：


    ![image](img/image048.jpeg)


    Java 8 通过这些默认方法提供了一种更好的替代方案：


    ![image](img/image044.jpeg)


    让我们先从 `compute` 方法开始。每个变体都允许通过映射函数生成 map 的值。对于 `computeIfPresent()` 和 `computeIfAbsent()`，映射是根据条件条件执行的。因此，通过这些方法，我们可以重构之前的代码示例：


    ![image](img/image106.jpeg)


    请注意，列表的创建是由 `computeIfAbsent()` lambda 表达式处理的。当需要通过 `compute()` 方法将电影添加到列表时，`add()`
    永远不会抛出 `NullPointerException`，因为列表保证已经被创建。


    在这种情况下，使用 `computeIfAbsent()` 方法就有些过度了 ![image](img/image068.jpeg)，我们使用 `putIfAbsent()`
    会更好：


    此方法不需要 lambda，并且期望给定一个值——而不是计算出的值。尽管没有使用 lambda，这仍然是一个函数式风格的方法。它证明了你可以用函数的方式表示代码，而不一定非要使用
    lambda。


    如果你仍然需要提取数据，可以使用 `getOrDefault()` 方法使用更具函数式的方法：


    你也可以使用 `merge()` 方法作为替代方案。它方便了对列表存在性的检查。在下面的示例中，如果键（年份）在 map 中不存在，它将把值（标题）放入 map
    中。如果它已存在，它允许通过 `BiFunction` 决定如何处理这两个列表：


    ![image](img/image084.jpeg)


    并且可以像这样书写：


    `BiFunction` 也可以返回 null，这会告诉 `merge()` 删除该键。


    结论是，我们删除了检查元素存在性的开销代码，现在可以关注更重要的事情：定义如何创建列表以及如何向列表中添加元素。


    `Map` 接口已经丰富了其他函数式方法，如 `forEach()`、`replace()`，并使用了相同的内部化（internalization）原则。


    ### Iterator（迭代器）


    集合库在并发访问方面受到相同的限制。一如既常，你必须选择符合线程安全要求的集合类。这是因为上面显示的新方法并不特别适用于函数式编程的并行处理，因为它们仍然基于多个线程变异集合并同步对底层数据访问的概念。然而，Java
    8 存在一种兼容的新抽象，它是为了并行迭代数据而设计的。该接口的前提是对数据进行分区并将数据块交给不同的线程。迭代器可以从集合接口获取，包括 `list`
    和 `set` 接口。


    ![image](img/image049.jpeg) `iterator` 接口的核心是这三个方法：


    `split()` 方法将底层数据一一分为二。它创建一个包含半部分数据的新迭代器，并将另一部分保留在原始实例中。每个部分都可以交给一个线程，该线程反过来使用
    `forEachRemaining()` 迭代分区数据。`advance()` 方法是一个一次一次的变体，返回下一个元素，如果列表已耗尽则返回 null。


    迭代器本身不处理并行处理，但提供了执行该操作的抽象。这里是该概念的演示：


    ![image](img/image035.jpeg)


    给定一个标题和一个电影列表，`isInList()` 方法并行化搜索以确定其是否包含在列表中。如果找到，它会将 `booleanHolder` 中的标志位置为
    true。它从列表中获取迭代器实例，将其一分为两半，并将每一半交给每个线程。如果有更多可用线程，可以重复拆分过程。


    迭代器也可以从其他集合类型以及 JDK 中的其他库获取。有许多针对不同数据特征设计的实现。


    ### 总结


    到此为止，我们完成了对新的且改进的集合以及标准接口的审查。标准 API 发生了许多变化，但最大的变化尚在后面。


    ### 关键点


    新包 `java.util.function` 包含一组函数式接口。这些接口被分为四类，每类由其类型表示：`Consumer`、`Function`、`Predicate`
    和 `Supplier`。


    每个函数式接口族都定义了专门针对类型和元数（arity）的变体。


    函数式接口还定义了实现函数组合的方法。多个不同的 lambda 可以被融合形成看起来像一个的超函数（super functions）。


    集合库已经了重构和函数化处理。这是通过在顶层使用默认方法实现的。


