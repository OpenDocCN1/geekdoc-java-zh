- fmt: "\nIn Java, variables are static when declared, meaning that the programmer\
    \ must define the data type that the variable will be containing. To illustrate,\
    \ if we wish to use a variable `num` to store a number, we would first have to\
    \ declare the variable: `int num`, before we can assign a value, such as `num\
    \ = 10`.\n\nThe process above is usually known and referred to as an \"assignment\
    \ statement,\" where a value is assigned to the variable as declared by the programmer.\
    \ however, one prominent thing about how Java and in fact how most programming\
    \ languages works is that in the assignment statement, such as in our example\
    \ of `num = 10`, the actual value stored is the one on the right side of the equals\
    \ sign, the value of `10`, and `num` is just the \"marker\" to call that stored\
    \ value. this is why there are many Java programmers that tend to prefer the jargon\
    \ of \"getting\" a value rather than \"assigning,\" though for the most part,\
    \ they may be employed interchangeably and outside of some rare scenario, function\
    \ mostly the same way.\n\nNote, however that once values have been assigned to\
    \ variables, functions needed to be carried out in order for the data inside that\
    \ variable to change its data type.\n\n### Naming a variable\n\nCreating variables\
    \ is an easy task, especially given how Java programmers tend to create and name\
    \ them after the data type or the purpose of what the variable will store. however,\
    \ there are a few rules when it comes to naming these variables else Java will\
    \ not recognize it and an error message will result. the main restrictions around\
    \ variable names are that it should not begin with a special character, such as\
    \ an underscore or a number. however, variable names can consist of characters\
    \ such as letters and numbers, and even an underscore, provided that the underscore\
    \ is not placed at the start.\n\nNo other characters may be used, such as the\
    \ `#` or even z, as these special characters have different uses in Java and thus\
    \ will not be recognized in a variable name.\n\nWhile those are the major rules,\
    \ here are some tips when it comes to naming variables. the variable name should\
    \ be descriptive, as in longer codes it may be difficult to recall just what \"\
    x\" is for. having a variable name such as \"count\" or \"output\" is much easier\
    \ to recall as having generic \"x\" or \"y\" and will help in avoiding confusion.\
    \ addition to being descriptive, variables will also be easier to use if their\
    \ names are kept fairly short. while having a variable name such as information\
    \ records is very descriptive, typing it repeatedly as needed in the program will\
    \ get exhausting and longer names increase the chance of typographical errors\
    \ which will lead to bugs in the code, resulting in a run-time error or the code\
    \ not working but introducing bugs along the way. note as it has always been a\
    \ practice for Java variables to be written in all lowercase and while there is\
    \ no restriction on capitalization keeping things in lowercase simplifies things\
    \ as missed capitalization may result in the variable not being recognized as\
    \ an uppercase letter.\n\n### Method naming conventions\n\nWe shall revisit the\
    \ naming conventions in Java since you will be using methods. methods in Java\
    \ perform operations, they also receive any argument provided by a caller and\
    \ it can also return a result of an operation to a caller. here’s the syntax for\
    \ declaring a method:\n\n```\naccess modifier return type methodName([set of parameters])\
    \ {\n// body of the method\n}\n```\n\nHere are a few rules to remember when you\
    \ make the names for the methods that you will write. method names are always\
    \ verbs or more specifically verb phrases (which means you can use multiple words\
    \ to name them). the first word of the method name should all be in lowercase\
    \ letters, while the rest of the words should follow a camel case format. here\
    \ is an example:\n\n`writeMethodNameThisWay()`\n\nNow, you should remember that\
    \ verbs are used for method names, and they indicate an action while nouns are\
    \ used for variable names and they denote a certain attribute.\n\nFollowing the\
    \ syntax for declaring a method and following the name conventions for this Java\
    \ construct, here’s a sample code that can be used to compute the area of a circle.\n\
    \n```java\npublic double computeCircleArea() {\n    return radius * radius * math.pi;\n\
