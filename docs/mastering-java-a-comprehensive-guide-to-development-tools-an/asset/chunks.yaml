    One of the biggest irritants of using lists as values in maps is the constant
    needed to check for the presence of the map before adding, updating, or removing
    an element. First, you must try to extract the list and create it if it is not
    found. For example, say we have a method that updates a movie database implemented
    as a map. The map’s key is the year of the movie, and its value is a list of movies
    for that year. Pre-Java8, the code would look like this:


    ![image](images/image048.jpeg)


    Java 8 offers a better alternative with these default methods:


    ![image](images/image044.jpeg)


    Let’s start with the `compute` methods. Each variant allows the map’s value to
    be generated by the mapping function. For `computeIfPresent()` and `computeIfAbsent()`,
    mapping occurs conditionally. So with these methods, we can refactor the previous
    code example:


    ![image](images/image106.jpeg)


    Notice, that the creation of the list is handled by the `computeIfAbsent()` lambda.
    When it is time to add the movie to the list via the `compute()` method, the `add()`
    will never throw a `NullPointerException` because the list is guaranteed to have
    been created.


    In this case, using the `computeIfAbsent()` method is overkill ![image](images/image068.jpeg)
    and we would be better off with `putIfAbsent()`:


    This method is lambda-less and expects a value to be given—not calculated. This
    is still a functional style method even though no lambda was used. It proves the
    point that you can express code functionally without necessarily using lambdas.


    If you still need to extract the data, you can use a more functional approach
    with the `getOrDefault()` method:


    You can also use the `merge()` method as an alternative. It facilitates the checking
    of the existence of a list. In the example below, if the key (year) doesn’t exist
    in the map, it puts the value (titles) on the map. If it does exist, it allows
    a `BiFunction` to decide what to do with the two lists:


    ![image](images/image084.jpeg)


    And it can be be,d this way:


    The `BiFunction` can also return null, which tells the `merge()` to delete the
    key.


    The takeaway is that we have removed the overhead code of checking for the existence
    of an element and can now focus on what matters: defining how to create the list
    and how to add an element to the list.


    The `Map` interface has been enriched with other functional methods such as `forEach()`,
    `replace()` and uses the same principle of internalization.


    ### Iterator


    The collections library is still subject to the same constraints regarding concurrent
    access. As always, you must choose the collections class that responds to your
    thread safety requirements. This is because the new methods shown above are not
    particularly amenable to functional programming’s take on parallel processing
    because they are still based on the notion of multiple threads mutating the collection
    and synchronizing access to the underlying data. However exists a new Java 8 abstraction
    that is compatible it is designed to iterate over data in parallel. The premise
    of this interface is to partition the data and hand off chunks to different threads.
    Iterators can be obtained from the collection interface, including interfaces
    list and set.


    ![image](images/image049.jpeg) Central to the `iterator` interface are these three
    methods:


    The method `split()` partitions the underlying data in two. It creates a new iterator
    with half the data and keeps the other half in the original instance. Each can
    be given to a thread which in turn iterates over the partitioned data using `forEachRemaining()`.
    The method `advance()` is a one-at-time variant that returns the next element
    or null if the list has been exhausted.


    Iterators do not handle parallel processing themselves but provide the abstraction
    to do so. Here’s the concept in action:


    ![image](images/image035.jpeg)


    Given a title and a list of movies, the method `isInList()` parallelizes the search
    to determine if it is contained in the list. It sets the flag in booleanHolder
    to true if found. It obtains a iterator instance from the list, splits it in half,
    and hands off one half to each thread. The splitting process can be repeated if
    further threads are available.


    Iterators can be obtained from other collection types as well as other libraries
    in the JDK. There are many implementations designed with different data characteristics.


    ### Wrap up


    This completes our review of the new and improved collections as well as the standard
    interfaces. There have been many changes in the standard APIs but the biggest
    change is yet to come.


    ### Key points


    The new package `java.util.function` contains a set of functional interfaces.
    These are grouped into four families each represented by their types: `Consumer`,
    `Function`, `Predicate`, and `Supplier`.


    Each family of functional interfaces defines variants that specialize in types
    and arity.


    Functional interfaces also define methods that enable functional composition.
    Multiple disparate lambdas can be fused to form super functions that appear as
    one.


    The collections library has been revamped and functionalized. This has been achieved
    using default methods at top levels.

