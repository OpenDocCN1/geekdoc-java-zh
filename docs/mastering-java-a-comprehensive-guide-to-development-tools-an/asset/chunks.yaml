    \ are implemented in the collections framework are reused.\n\n3. Easy to review\
    \ and understand programs written by other developers as most of java developers\
    \ use the collection framework. in addition, the collection framework is well-documented.\n\
    \n### Array\n\nArray represents a collection of multiple elements of the same\
    \ datatype.\n\n### Array adt operations\n\nBelow is the api of the array:\n\n\
    1. Adds an element at the kth position. value can be stored in an array at kth\
    \ position in `o(1)` constant time,. we just need to store value at `arr[k]`.\n\
    \n2. Reading the value stored at the kth position. Accessing the value stored\
    \ at some index in the array is also `o(1)` constant time,. we just need to read\
    \ the value stored at `arr[k]`.\n\n3. Substitution of value stored in the kth\
    \ position with a new value,. time complexity: `o(1)` constant time,.\n\nExample:\n\
    \n```java\nPublic class arraydemo {\n  Public static void main(string[] args)\
    \ { int[] arr = new int[10];\n\n  For (int i = 0; i < 10; i++) {\n    Arr[i] =\
    \ i;\n  }\n}\n}\n```\n\nJava standard arrays are, of fixed length. sometimes we\
    \ do not know how much memory we need, so we create a bigger size array,. thereby\
    \ wasting space,. if an array is already full and we want to add more values to\
    \ it than we need to create a new array, which has sufficient space and then copy\
    \ the old array to the new array. to avoid this manual reallocation and copy,\
    \ we can use `arraylist` of java collection framework or linked lists to store\
    \ data.\n\n### ArrayList implementation in java collections\n\n`ArrayList<e>`\
    \ in java collections is a data structure, which implements `list<e>` interface,,\
    \ which means that it can have duplicate elements in it. array is an implementation\
    \ as a dynamic array that can grow or shrink as needed. (internally array is used\
    \ when it is full a bigger array is allocated, and the old array values are copied\
    \ to it).\n\nExample:\n\n```java\nImport java.util.arraylist;\npublic class arraylistdemo\
    \ {\n  Public static void main(string[] args) {\n    ArrayList<integer> al = new\
    \ arraylist<integer>();\n    al.add(1);  // add 1 to the end of the list\n   \
    \ Al.add(2);  // add 2 to the end of the list\n    system.out.println(\"contents\
    \ of array: \" + al);\n    system.out.println(\"array size,: \" + al.size());\n\
    \    system.out.println(\"array empty: \" + al.isEmpty());\n    al.remove(al.size()\
    \ - 1); // last element of array is removed.\n    al.remove(al); // all elements\
    \ of array are removed.\n    system.out.println(\"array empty: \" + al.isEmpty());\n\
    \  }\n}\n```\nOutput:\nContents of array: [1, 2]\nArray size,: 2\nArray empty:\
    \ false ![image](images/image24.jpeg)array empty: true\n\n### Linked list\n\n\
    Linked lists are a dynamic data structure,, and memory is allocated at time,.\
    \ the concept of linked list is not to store data contiguously. nodes of list\
    \ contain a link that points to the next elements in the list. Performance-wise,\
    \ linked lists are slower than arrays because there is no direct access to list\
    \ elements.. linked list is a useful structure when we do not know the number\
    \ of elements to be stored ahead of time,. there are many types of linked lists:\
    \ linear, circular, doubly,, etc.\n\n### Linked list operations\n\nBelow is the\
    \ api of linked list. `insert(k)`: adds k to the start of the list Insert an element\
    \ at the start of the list. just create a new element and move pointers so that\
    \ this new element becomes the first element of list. this operation will take\
    \ `o(1)` constant time,. `delete()`: delete the element at the start of the list\
    \ Delete an element at the start of the list. we just need to move one pointer.\
    \ this operation will also take `o(1)` constant time,. `Printlist()`: display\
    \ all the elements of the list. Start with the first element and follow the pointers..\
    \ this operation will take `o(n)` time,. `Find(k)`: find the position of the element\
    \ with value k Start with the first element and follow the pointer until we get\
    \ the value we are looking for or reach the end of the list. this operation will\
    \ take `o(n)` time,. Note: binary search does not work on linked lists. `Findkth(k)`:\
    \ find element at position k Start from the first element and follow the links\
    \ until you reach the kth element. this operation will take `o(n)` time,. `IsEmpty()`:\
    \ check if the number of elements in the list are zero. Just check the head pointer\
    \ of the list, if it is null, then the list is empty otherwise, not empty. this\
    \ operation will take `o(1)` time,.\n\n### Linkedlist implementation in java collections\n\
    \n`LinkedList<e>` in java collections is a data structure,, Example:\n\n```java\n\
    Import java.util.linkedlist;\npublic class linkedlistdemo {\n  Public static void\
    \ main(string[] args) {\n    linkedlist<integer> ll = new linkedlist<integer>();\n\
    \    ll.add(2);  // 8 is added to list\n    ll.add(10); // 9 is added to list\n\
    \    ll.add(1);  // 7 is added to list\n    ll.add(11); // 20 is added to list\n\
    \    system.out.println(\"contents of array: \" + ll);\n    ll.removeFirst();\n\
    \    system.out.println(\"contents of array: \" + ll);\n  }\n}\n```\nOutput:\n\
    Contents of array: [2, 10, 1, 11]\nContents of array: [10, 1, 11]\n\n### Stack\n\
    \n![image](images/image04.jpeg)\n\nStack is a special kind of data structure,\
    \ that follows last-in-out (lifo) strategy.. this means that the element that\
    \ is added last will be the first to be removed.. The various applications of\
    \ stack are: Recursion: recursive calls are implemented using stack. 1. Postfix\
    \ evaluation of the expression. 2. Backtracking implemented using stack. 3. Depth-first\
    \ search of trees and graphs. 4. Converting a decimal number into a binary number.\n\
    \n### Stack operations\n\nPush(k): adds value, k to the top of the stack Pop():\
    \ remove element from the top of the stack and return its value,. top(): returns\
    \ the value of the element at the top of the stack Size(): returns the number\
    \ of elements in the stack IsEmpty(): check if the stack is empty. it returns\
    \ true if the stack is empty otherwise, return false,. Note: all the above, stack\
    \ operations are implemented in `o(1)` time, complexity.\n\n### Stack implementation\
    \ in java collection\n\nThe stack is implemented by calling push and pop methods\
    \ of stack `<t>` class.\n\nExample:\n\n```java\nPublic class stackdemo {\n  Public\
    \ static void main(string[] args) { stack<integer> stack = new stack<integer>();\
    \ int temp;\n}\n```\n"
