    Java EE 8 is the latest release at the time of writing this book. Java EE’s revised
    design provides enhanced technologies for enterprise solutions as well as modernized
    applications for security and management purposes. The release features several
    advancements that included greater rest API capabilities provided through the
    client, json binding, and security APIs. This version also features the date and
    time API as well as the streams API, according to information published in the
    Oracle corporate website as of December 2019.


    ### Java ME


    The Java ME platform depl simplicity, portability, and dynamism to provide a versatile
    environment for building applications for small gadgets and devices. Java ME is
    known for having an outstanding application development environment, thanks to
    its interactive and user-friendly navigation interfaces, as well as built-in capabilities
    for implementing networking concepts. It is largely associated with the Internet
    of Things (IoT) and is useful when building applications designed for built-in
    technologies or connected devices that could be used to invent or implement futuristic
    concepts. Java ME’s portability and runtime attributes make it suitable for use
    in software applications for wearable gadgets, cell phones, cameras, sensors and
    printers among other items and equipment.


    The Java ME SDK is equipped with the requisite tools meant for use within an independent
    environment when developing software applications, testing functionalities, and
    implementing device simulations. According to information published in the Oracle
    corporate website as of 2019, this JDK is well suited for accommodating “the connected
    limited device configuration (CLDC)” technology alongside “the connected device
    configuration (CDC)” functionality. This results in a single and versatile environment
    for developing applications.


    There are several other Java ME solutions that support the deployment of the Java
    programming language in applications. Java embedded provides a runtime environment
    integrating IoT capabilities in devices, while the Java embedded client facilitates
    the construction of software solutions that run and optimize the functionality
    of built-in programs. Java for mobile makes use of the CLDC and the stack of Java
    developer tools to create innovative features for mobile devices.


    ### Java runtime environment


    Remember that there are certain conditions that must prevail for java applications
    to run efficiently. The JRE contains the ingredients responsible for creating
    the conditions. this includes the JVM and its corresponding files. although JRE
    as a component of the JDK it is capable of operating independently if tasks are
    limited to run rather than build instructions. The JRE lends important properties
    to different programs in the java ecosystem. For example, a program is self-contained
    if it runs an JRE within it. this means that a program does not depend on other
    programs to access the JRE. this independence makes it possible for a program
    to achieve compatibility with different OS.


    ### Java virtual machine


    The JVM operates as a specification for implementing java in computer programs.
    It is the driving force behind the platform-independence characteristics of the
    java language. this status is accentuated by JVM’s status as a program that is
    executed by other programs. programs written to interact with and execute the
    JVM see to match every single JVM implementation to a particular OS. this facilitates
    the translation or interpretation of java programs into runtime instructions in
    the local OS and eliminating the needed for platform dependence in java programming.


    As a developer you must be wary of the vulnerability your development environment
    and applications have to cyber attacks and other threats. The JVM provides enhanced
    security features that protect you from such threats. The solid security foundation
    is attributable to its built-in syntax and structure limitations that reside in
    the operational codes of class files. but this does not translate to limitations
    on the scope of class files that the JVM can accommodate. The JVM actually accepts
    a variety of class files so long as they can be validated to be safe and secure.
    Therefore, the JVM is a viable complementary alternative for developing software
    in other programming languages.


    The JVM is often included as a ported feature in a wide variety of software applications
    and hardware installations. It is implemented through algorithms that are determined
    by Oracle, or any other provider. as such, the JVM provides an open implementation
    platform. the JVM actually contains the runtime instance as the core property
    that anchors its. for example, the creation of a JVM instance involves writing
    an instruction that runs the class properties of java


    A java program needs to be familiar with the key are JVM such as the loader and
    the data section for runtime as well as the engine that is responsible for executing
    programs there are also performance-related components such as the garbage collector
    and the heap dimension tool that are equally important to the deployment of the
    JVM there is a close affiliation between JVM and bytecode


    ### bytecode


    Bytecode are essentially JVM commands that are contained in a class file alongside
    other information that include the symbol table. they operate as background language
    responsible for facilitating the interpretation and execution of JVM operations.
    bytecode are actually the substitutes for native codes because java does not provide
    the latter. the structure of the JVM register is such that it contains methods
    which in turn accommodate bytecode streams—is sets of instructions for the JVM.
    in other words each java class has methods within it and the class file loading
    process executes a single bytecode stream for any given method. the activation
    of a method automatically triggers bytecode the moment a program begins to run.

