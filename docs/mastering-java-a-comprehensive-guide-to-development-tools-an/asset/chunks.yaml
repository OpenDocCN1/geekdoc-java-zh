    In any non-trivial software, projects, bugs are simply a fact of life. Careful
    planning, programming, and testing may help diminish their omnipresence, but somehow
    they will always find a way to enter your system somewhere. This becomes especially
    apparent as new features are introduced and your codebase''s magnitude and complexity
    increase.


    Fortunately, it is easier to detect some bugs than others. Compile-time bugs,
    for instance, can be identified soon; you can use the compiler''s error codes
    to determine what the issue is and solve it right then and there. Runtime bugs,
    however, can be much harder; they do not always occur instantly, and when they
    do, they may be at a point in the program far apart from the true cause of the
    problem. Generics help stabilize your software by making it feasible at compile
    time to identify more of your bugs.


    Generics in a nutshell allow parameters for kinds (classes and objects) when defining
    courses, and techniques. Like the more familiar formal parameters used in declarations
    of methods, type parameters provide you with distinct outputs to reuse the same
    code. The distinction is that values are the inputs to formal parameters, while
    kinds are the answers to type parameters. Code using generics has many advantages
    over the non-generic code. Through the use of generics, programmers can introduce
    generic algorithms that operate on distinct kinds of collections, can be tailored,
    and are secure and simple to read form.


    ### Generic types


    A generic form is a type-parameterized generic category or interface. It is possible
    to modify an easy box class to show the idea. Consider a non-generic box category
    that works on any sort of object. It only requires to provide two techniques:
    `set()` (adding an item to the cabinet) and `get()` (retrieving it). Because their
    methods accept or return an object, you are free to pass whatever you want, as
    long as it is not one of the primitive types. There is no way to check how the
    class is used at compile time. One portion of the software may put an integer
    in the cabinet and expect to get integers out of it, while another portion of
    the software may erroneously move through a string, leading in a mistake in runtime.


    The segment of the type parameter delimited by angle brackets `<>` displays the
    title of the category. It indicates the parameters of the form (also known as
    factors of the sort `t1`, `t2`). You generate a generic type by altering the file
    "generic box" to "generic box <t>" to update the box to use generics. This presents
    the type variable `t`, which can be used inside the class. This replaces all objects
    with `t`. Any non-primitive type you specify can be a type of class, type of array,
    or some other type variable. It is possible to apply this same method to generic
    interfaces. Type designations are single uppercase by convention. This contrasts
    sharply with the variable naming conventions you already understand with an exception:
    it would be hard to say the distinction between a type variable and a normal class
    or object name without this convention. The most commonly used type parameter
    names are:


    - `element` (used extensively by the java collections framework)

    - `key`

    - `number-type`

    - `value`

    - `suv`, etc. – 2nd, 3rd, 4th types


    You''ll see these names used throughout the JDK and the API.


    ### Invoking and instantiating a generic type


    To mention the generic box category within your system, a generic type invocation
    must be performed that brings `t` with a certain concrete value, such as integer:


    ```

    Box<integer> integerbox;

    ```


    You may believe that an invocation of a generic sort is comparable to a normal
    process invocation, but instead of adding an assertion to a procedure, you transfer
    a type argument—integer, in this case—to the box category itself.


    Many designers interchangeably use the words "type parameter" and "type statement,"
    but not the same definitions. When coding to generate a parameterized type, one
    offers sort arguments. The `t` in `foo <t>` is therefore a type parameter, and
    the `foo <string>` `string` is a type contention. In using these words, this class
    follows this concept.


    Like any other class, this class does not generate an item of type. The generic
    type invocation is usually an item of box which will have a type of. To instantiate
    this class, use the `new` keyword as the class name and the type:


    ```

    Box<integer> integerbox = new Box<>();

    ```


    ### The diamond


    In the latest versions of java, you can replace the type arguments of the constructor
    with an empty set as long as the compiler can determine the type from the context.
    This angle bracket `<>` is called "the diamond." For example, you can use the
    previous declaration:


    ```

    Box<integer> integerbox = new Box<>();

    ```


    ### Generic methods


    Generic methods are techniques which implement parameters of their own sort. This
    is similar to a generic type declaration, but the scope of the type is limited
    to the method in which it is declared. In addition to generic constructors, static
    and non-static generic methods are permitted. The syntax for a generic method
    involves a list of parameters of type inside angle brackets that appear before
    the return type of the procedure. The type parameter segment must occur before
    the method name:


    ```

    public <T> T methodName(T parameter) { }

    ```

