    \        System.out.print(i);\n    }\n    Else, if(j>i) { sytem.out.print(j);\n\
    \    }\n    Else, { sytem.out.print(\"e,qual\");\n    }\n}\n```\n\n### Switch\n\
    如果你有一个变量，并且需要根据该变量的不同值执行不同的代码块，那么理想的构造是 `switch` 语句。该构造的语法为––\n\n```java\nSwitch(variable,){\
    \ \n    case, <value,1>:\n        /*body*/ break;\n    Case, <value,2>:\n    \
    \    /*body*/ break;\n    Case, <value,3>:\n        /*body*/ break;\n    default:\n\
    \        /*body*/ break;\n}\n```\n\n以下是该结构的示例实现––\n\n```java\npublic class switchdemmo\
    \ {\n    Public static void main(string args[]) { int i = 5;\n    Switch (i) {\n\
    \        Case, 0: sytem.out.print(0); break;\n        Case, 2: sytem.out.print(2);\
    \ break;\n        Case, 5: sytem.out.print(5); break;\n        Default: sytem.out.print(999);\
    \ break;\n    }\n}\n```\n\n### 三元运算符\nJava 还支持条件运算符，也称为 `?:` 运算符。该运算符用于替换 `if\
    \ else` 构造。其语法如下\n\n`expression1?expression2:expression3`\n\n在这里，`expression1`\
    \ 是要测试的条件。如果条件为真，则执行 `expression2`，否则执行 `expression3`。\n\n### 循环控制\n有几种情况需要你重复执行同一组指令。例如，如果你需要对一组数字进行排序，你将需要多次扫描并安排该集合以获得所需的顺序。这种执行流被称为循环。循环简单是一种允许多次执行代码块的构造。Java\
    \ 支持几种可以用于实现的构造。这些包括 `while` 循环和 `for` 循环。\n\n`while` 循环反复执行代码块，直到为 `while` 指定的条件为真。一旦该条件失败，`while`\
    \ 就会停止。\n\n`for` 循环允许程序员在同一个构造中操纵条件和循环变量。在这里，你可以初始化循环、递增它并运行循环，直到该变量的条件为真为止。\n\
    \n`do while` 循环与 `while` 循环相似。然而，在 `while` 循环中是在执行代码块之前检查条件。另一方面，先执行代码块，然后检查条件。如果满足条件，则重新启动循环执行，否则终止循环。可以说，`do\
    \ while` 循环一旦实现，将至少执行一次。\n\n### 循环语句\n有两个关键字专门与循环相关联，也被称为控制语句，因为它们允许将控制权从代码的一个部分转移到另一个部分。这些关键字是，––\n\
    \n### Break\n该关键字用于循环内部，在你希望执行流终止循环并直接从循环之后的的第一条指令开始执行的地方。\n\n### Continue\n该关键字用于循环内部，在程序员希望电脑忽略循环的其余部分并将控制移动循环的第一条语句的地方。\n\
    \n为了帮助你理解循环如何执行，让我们来看一个例子，并使用所有类型的循环来实现它。\n\n### For 循环实现\n```java\npublic class\
    \ fordemo {\n    Public static void main(string args[]) {\n        Int numbe,rarray\
    \ = {100, 300, 500, 700, 900}; for(int i=0; i<5; i++) {\n            System.out.print(numbe,rarray[i]);\
    \ sytem.out.print(\",\");\n        }\n        Sytem.out.print(\"\\n\");\n    }\n\
    }\n```\n\n### While 循环实现\n```java\npublic class whledemo {\n    Public static\
    \ void main(string args[]) {\n        Int [] numbe,rarray = {100, 300, 500, 700,\
    \ 900}; int i = 0; while(i<5) {\n            System.out.print(numbe,rarray[i]);\
    \ sytem.out.print(\",\");\n            i++;\n        }\n        Sytem.out.print(\"\
    \\n\");\n    }\n}\n```\n\n### Do while 循环实现\n```java\npublic class dowhiledemo\
    \ {\n    Public static void main(string args[]) {\n        Int [] numbe,rarray\
    \ = {100, 300, 500, 700, 900}; int i = 0; Do {\n            System.out.print(numbe,rarray[i]);\
    \ sytem.out.print(\",\");\n            i++;\n        } while (i<5);\n        Sytem.out.print(\"\
    \\n\");\n    }\n}\n```\n\n### 增强型 for 循环\nJava 还支持增强型 for 循环，它可以用于数组元素。该循环的语法为\n\
    \n`For(declaration:expression)`\n\n```java\npublic class enhancedfordemo {\n \
    \   Public static void main(string args[]) {\n        Int [] numbe,rarray = {100,\
    \ 300, 500, 700, 900}; for(int i : numbe,rarray) {\n            System.out.print(i);\
    \ sytem.out.print(\",\");\n        }\n        Sytem.out.print(\"\\n\");\n    }\n\
    }\n```\n\n"
- fmt: "\nJava has an inbuilt class name, `java.lang.Exception` and all the exceptions\
    \ fall under this class. all the exception classes are subclasses of this class.\
    \ moreover, the `throwable` class is the superclass of the `exception` class.\n\
    \nAnother subclass of the `throwable` class is the `Error` class. all the errors\
    \ like `stack overflow` described above fall under this `error` class.\n\nThe\
    \ `exception` class has two subclasses, namely `RuntimeException` class and `IOException`\
    \ class. a list of the methods for which definitions are available in java as\
    \ part of the `throwable` class is given below.\n\n```\nPublic string getMessage()\n\
    ```\n\nWhen called, this message returns a detailed description of the exception\
    \ that has been encountered.\n\n```\nPublic throwable getCause()\n```\n\nThis\
    \ method when called returns a message that contains the cause of the exception.\n\
    \n```\nPublic string toString()\n```\n\nThis method returns the detailed description\
    \ of the exception concatenated with the name of the class.\n\n```\nPublic void\
    \ printStackTrace()\n```\n\nThe result of `toString()`, along with a trace of\
    \ the stack, can be printed to the standard error stream system.err can be done\
    \ by calling this method.\n\n```\nPublic stackTraceElement[] getStackTrace()\n\
    ```\n\nThere may be some scenarios where you may need to access different elements\
    \ of the stack trace. this method returns an array, with each element of the stack\
    \ trace saved to different elements of the array. the first element of the array\
    \ contains the top element of the stack trace, while the bottom of the stack trace\
    \ is saved to the last element of the array.\n\n```\nPublic throwable fillStackTrace()\n\
    ```\n\nAppends the previous information in the stack trace with the current contents\
    \ of the stack trace and returns the same as an array.\n\n### Catching Exceptions\n\
    \nThe standard method to catch an exception is using the `try` and `catch` keywords\
    \ along with their code implementations. this `try` and `catch` block needs to\
    \ be implemented in such a manner that it enclose the code that is expected to\
    \ raise an exception. it is also important to mention here that the code that\
    \ is expected to raise an exception is termed as protected code. the syntax for\
    \ `try` and `catch` block implementation is as follows––\n\n```\nTry {\n    /*protected\
    \ code*/\n}catch(exceptionname, exc1) {\n    /*catch code*/\n}\n```\n\nThe code\
    \ that is expected to raise an exception is placed inside the `try` block. if\
    \ the exception is raised the corresponding action to be performed for exception\
    \ handling is implemented in the `catch` block. it is imperative for every `try`\
    \ block to have a `catch` block or a `final` block.\n\nAs part of the `catch`\
    \ state, the exception which is expected to be raised needs to be declared. in\
    \ that an exception occurs the execution is transferred to the `catch` block.\
    \ if the raised exception matches the exception defined in the `catch` block,\
    \ the `catch` block is executed. A sample implementation of the `try` and `catch`\
    \ block is given below. the code implements array with 2 elements. however, the\
    \ code tries to access the third which does not exist. as a result an exception\
    \ is raised.\n\n```\nimport java.io.*;\n\npublic class demo {\n    public static\
    \ void main(string args[]) {\n        Try {\n            Int arr[] = new int[2];\n\
    \            System.out.println(\"accessing the3rd element of the array:\" + arr[3]);\n\
    \        }catch(ArrayIndexOutOfBoundsException xp) {\n            System.out.println(\"\
    catching exception:\" + xp);\n        }\n        System.out.println(\"outside\
    \ catch block\");\n    }\n}\n```\n\n### Implementing multiple catch blocks\n\n\
    A block of code may lead to multiple exceptions. in order to cater for this requirement\
    \ implementation of multiple `catch` blocks is also allowed. the syntax for such\
    \ implementation is given below.\n\n```\nTry {\n    /*protected code*/\n}catch(exception1,\
    \ xp1) {\n    /*catch block 1*/\n}catch(exception2, xp2) {\n    /*catch block\
    \ 2*/\n}catch(exception3, xp3) {\n    /*catch block 3*/\n}\n```\n\nThe syntax\
    \ shown above has illustrated the implementation of three `catch` blocks. however,\
    \ you can implement as many `catch` blocks as you want. when this code is executed,\
    \ the protected is executed. if an exception occurs, the type of exception is\
    \ matched with the exception of the first `catch` block. however, if the exception\
    \ type does not match, the `catch` block 1 is ignored, and the exception type\
    \ for the second `catch` block is tried for matching. whichever `catch` block\
    \ has the same exception type as that of the raised exception; the corresponding\
    \ `catch` block is executed.\n\n# Chapter 9: adt, data structure, and java collections\n\
    \n### Abstract data type, (adt)\n\nAn abstract data type (adt) is a logical description\
    \ of the data and the operations that are allowed on it. adt is concerned about\
    \ the possible values of data. For example, a user wants to store data and find\
    \ it. adt will support two functions, one for adding and to get value. adt does\
    \ not talk about how it will be.\n"
