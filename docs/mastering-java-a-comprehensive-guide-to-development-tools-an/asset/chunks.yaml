    构造函数也可以重载吗？是的，可以。构造函数也可以像方法一样，这意味着你可以像重载方法一样重载构造函数。以下是几个如何重载构造函数的示例。我们使用 `Employee`
    类并使用不同的参数对其进行重载。


    ```

    Employee()

    Employee(int r)

    Employee(int r, string b)

    ```


    ### 如何初始化变量


    现在我们已经知道了如何声明变量，也知道了我们可以使用的各种变量类型，接下来的任务是学习如何在所谓的“表达式”中使用这些变量。表达式是 Java 程序中最常用的构建块，通常用于产生一个新值作为结果，尽管在某些情况下，表达式也用于给变量分配一个新值。通常，表达式由值、变量、操作符和方法调用等内容组成。还有一些表达式并不产生结果，而是影响另一个变量。一个例子是根据操作更改变量值的表达式：它没有输出新值，也没有对新值进行真正的“赋值”，而是产生了一种所谓的“副作用”，导致变量值发生变化。


    在打印“hello world”的程序中，我们在打印函数中引入了原始值，这也称为对输出进行“硬编码”。然而，此时此刻我们应该尝试结合所学过的变量知识。变量的操作方式与原始值非常相似，它们仅仅是引用计算机之前存储的值，因此程序员只需使用变量名代替值。为了演示这一点，让我们回想之前的“hello
    world”程序：


    ```

    Print ("hello world");

    Input("\n\n please the return key to close this window.");

    ```


    现在，我们不再硬编码 "hello world" 字符串，而是简单将其声明为一个变量并让程序输出该变量。结果看起来应该是像这样：


    ```

    String = "hello world"; print(string);

    Input("\n\n please the return key to close this window.");

    ```


    它的输出结果与之前的程序相同，看起来类似于：


    Hello world

    Please press the return key to close this window.


    # 第 3 章：Java 基础


    ### Java 开发工具包 (JDK)


    `jdk` 提供了构建健壮的 Java 应用程序所需的工具。它允许开发者在 Java 编程期间访问软件组件并编译应用程序。例如，开发者需要 `jdk` 环境才能编写应用方法。


    由于 `jdk` 执行的是软件开发工具包 (`sdk`) 的操作，人们很容易混淆这两项的范围和操作。虽然 `jdk` 特指 Java 语言，但 `sdk`
    具有更广泛的性。不过 `jdk` 仍然作为环境的一个组件运行。这意味着开发者仍然需要 `sdk` 来提供某些 `jdk` 领域内不可用的工具。开发者文档和调试工具也是
    `sdk` 为 Java 环境提供的一些关键工具。


    `jdk` 的部署范围取决于当前任务的性质、支持的版本以及正在使用的 Java 版本。例如，Java 平台标准版 (`se`) 开发工具包是为 Java 版设计的。Java
    平台企业版 (`ee`) 和 Java 平台微型版 (`me`) 是 `jdk` 的其他主要子集。这些 Java 版本的详细细节将在下方的子主题中进行描述。自
    2007 年上传到 OpenJDK 门户以来，`jdk` 一直是一个免费平台。它的开源状态促进了协作，并允许软件开发者社区进行克隆、修改或为改进和升级贡献想法。


    ### Java SE


    `java se` 驱动了各种桌面应用和服务器应用程序。它支持在这些应用程序的开发环境中对 Java 编程语言进行测试和部署。与最近的 Java SE 发布相关的某些文档包括高级管理控制台功能和一套全新的
    Java 部署规则。在本书编写时，`java se, 13.0.1` 是 `java se` 平台的最新 `jdk` 版本。


    `java se sdk` 配备了核心运行时能力，以及的一系列设计用于应用程序开发的工具和库。这些工具从简单的对象和类型到具有网络能力和安全特性的高级类不等。开发者还可以应用此
    JDK 开发来访问数据库。


    ### Java EE


    Java 平台是一个开源产品，通过全球 Java 社区成员的共同努力开发。


    Java ee 与 Java se 紧密相关，因为前者构建在后者之上。这种特定的软件整合了用于企业解决方案的变革性创新。新版本发布中引入的功能和进展通常反映了
    Java 社区成员的投入和需求。`java ee sdk` 用于构建大规模化运行的应用程序。`jdk` 为开发者构建具有扩展性和安全特性的应用程序提供了强大的
    API 和运行时属性。

