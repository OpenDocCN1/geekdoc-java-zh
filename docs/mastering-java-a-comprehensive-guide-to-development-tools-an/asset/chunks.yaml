    A class can have the following types of variable,:


    ### Class variables


    Class variables are those that are declared inside a class using the `static`
    modifier and outside any method.


    ### Local variables


    Local variables are those that are defined within methods or constructors. these
    variables are declared and instantiated inside the method and are destroyed once
    the method been carried.


    ### Instance variables


    Instance variables are those that are inside a class but outside the methods.
    they are initialized at the same time as the class. they can be accessed from
    a method or constructor of that specific class. A class can contain as many methods
    as necessary to obtain the values it needs. for example,, the cat class has three
    methods: `running()`, `sleeping()`, and `jumping()`.


    ## Constructors


    A constructor is a method which is used to initialize an object. a class must
    contain at least one constructor. The following are the important rules for constructors:
    The name of the constructor should match the name of the class it should have
    no explicit type.


