  trans: "\nJava 有一个内置类名 `java.lang.Exception`，所有的异常都属于这个类。所有的异常类都是该类的子类。此外，`throwable`\
    \ 类是 `exception` 类的父类。\n\n`throwable` 类的另一个子类是 `Error` 类。所有如上述 `stack overflow`（栈溢出）等错误都属于这个\
    \ `error` 类。\n\n`exception` 类有两个子类，分别是 `RuntimeException` 类和 `IOException` 类。以下是\
    \ Java 中作为 `throwable` 类一部分可用定义的方法列表。\n\n```\nPublic string getMessage()\n```\n\
    \n当调用此方法时，该消息将返回所遇异常的详细描述。\n\n```\nPublic throwable getCause()\n```\n\n此方法在被调用时会返回一个包含异常原因的消息。\n\
    \n```\nPublic string toString()\n```\n\n该方法返回异常的详细描述与类名拼接后的结果。\n\n```\nPublic\
    \ void printStackTrace()\n```\n\n`toString()` 的结果同堆栈跟踪可以打印到标准错误流 `system.err`。这可以通过调用此方法来实现。\n\
    \n```\nPublic stackTraceElement[] getStackTrace()\n```\n\n在某些场景下，你可能需要访问堆栈跟踪的不同元素。此方法返回一个数组，堆栈跟踪的每个元素保存到数组的不同元素中。数组的第一个元素包含堆栈跟踪的顶部元素，而堆栈跟踪的底部保存在数组的最后一个元素中。\n\
    \n```\nPublic throwable fillStackTrace()\n```\n\n将之前的堆栈跟踪信息与当前堆栈跟踪的内容合并并返回相同的数组。\n\
    \n### 捕获异常\n\n捕获异常的标准方法是使用 `try` 和 `catch` 关键字以及它们的代码实现。这个 `try` 和 `catch` 块需要以这种方式实现：封装可能会抛出异常的代码。这里同样重要的是需要说明，可能会抛出异常的代码被称为受保护代码（protected\
    \ code）。`try` 和 `catch` 块实现的语法如下——\n\n```\nTry {\n    /*protected code*/\n}catch(exceptionname,\
    \ exc1) {\n    /*catch code*/\n}\n```\n\n可能会抛出异常的代码放置在 `try` 块中。如果抛出了异常，则相应的异常处理操作将在\
    \ `catch` 块中实现。每个 `try` 块都必须有一个 `catch` 块或一个 `final` 块。\n\n作为 `catch` 状态的一部分，需要声明预期抛出的异常。在发生异常时，执行流将转移到\
    \ `catch` 块。如果抛出的异常与 `catch` 块中定义的异常匹配，则执行该 `catch` 块。下面提供了一个 `try` 和 `catch`\
    \ 块的示例实现。该代码实现了一个具有 2 个元素的数组。然而，代码尝试访问并不存在的第三个元素。结果是抛出了异常。\n\n```\nimport java.io.*;\n\
    \npublic class demo {\n    public static void main(string args[]) {\n        Try\
    \ {\n            Int arr[] = new int[2];\n            System.out.println(\"accessing\
    \ the3rd element of the array:\" + arr[3]);\n        }catch(ArrayIndexOutOfBoundsException\
    \ xp) {\n            System.out.println(\"catching exception:\" + xp);\n     \
    \   }\n        System.out.println(\"outside catch block\");\n    }\n}\n```\n\n\
    ### 实现多个 catch 块\n\n一段代码可能会导致多个异常。为了满足这一需求，允许实现多个 `catch` 块。此类实现的语法如下所示。\n\n```\n\
    Try {\n    /*protected code*/\n}catch(exception1, xp1) {\n    /*catch block 1*/\n\
    }catch(exception2, xp2) {\n    /*catch block 2*/\n}catch(exception3, xp3) {\n\
    \    /*catch block 3*/\n}\n```\n\n上述语法说明了三个 `catch` 块的实现。然而，你可以实现任意数量的 `catch`\
    \ 块。当执行此代码时，会执行受保护代码。如果发生异常，异常类型将与第一个 `catch` 块的异常进行匹配。然而，如果异常类型不匹配，则忽略 `catch`\
    \ block 1，并尝试与第二个 `catch` 块的异常类型进行匹配。哪个 `catch` 块与抛出的异常具有相同的类型，就执行相应的 `catch`\
    \ 块。\n\n# 第 9 章：adt、数据结构与 Java 集合\n\n### 抽象数据类型 (adt)\n\n抽象数据类型 (adt) 是数据及其允许在其进行的操作的逻辑描述。adt\
    \ 关注数据的可能值。例如，用户想要存储数据并找到它。adt 将支持两个函数：一个用于添加，另一个用于获取值。adt 不谈论具体如何实现。\n"
