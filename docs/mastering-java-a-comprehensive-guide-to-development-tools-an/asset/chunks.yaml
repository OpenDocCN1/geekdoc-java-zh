    在任何非复杂的软件项目中，bug 都是生活中的常态。细致的规划、编程和测试可能有助于减少它们的无处不在，但它们总会找到某种方式进入你的系统的某个处。随着新功能的引入以及代码库规模和复杂性的增加，这一点会变得尤为明显。


    幸运的是，某些 bug 比其他 bug 更容易检测。例如，编译时错误可以很快被识别；你可以使用编译器的错误代码来确定问题所在并立即解决它。然而，运行时错误可能要困难得多；它们并不总是立即发生，当发生时，可能位于程序中距离问题真相很远的地方。泛型（Generics）通过使得在编译时识别更多的
    bug 可行，从而帮助稳定你的软件。


    简而言之，泛型允许在定义类和技术时为“种类”（类和对象）提供参数。就像方法声明中使用的更熟悉的形式参数一样，类型参数为你提供了独特的输出，以便重用相同的代码。区别在于，值是形式参数的输入，而种类是类型参数的答案。使用泛型的代码比非泛型代码具有许多优势。通过使用泛型，程序员可以引入操作不同种类集合的泛型算法，这些算法是可以定制的，并且安全且易于阅读。


    ### 泛型类型


    泛型形式是一个类型参数化的泛型类别或接口。可以通过修改一个简单的箱类来展示这一思想。考虑一个适用于任何类型对象的非泛型箱类。它只需要提供两个技术：`set()`（向箱子添加项）和
    `get()`（检索项）。由于它们的方法接受或返回对象，你可以自由传递任何想要的内容，只要它不是原始类型即可。在编译时无办法检查该类的使用情况。软件的一个部分可能向箱中放入一个整数并期望从中取出整数，而软件的另一部分可能会错误地处理一个字符串，导致运行时错误。


    由角括号 `<>` 分隔的类型参数部分显示了类别的标题。它指示了形式的参数（也称为排序 `t1`, `t2` 的因子）。你通过将文件 "generic box"
    修改为 "generic box <t>" 来更新箱以使用泛型从而创建一个泛型类型。这引入了类型变量 `t`，它可以在类内部使用。这会将所有对象替换为 `t`。你指定的任何非原始类型可以是类类型、数组类型或其他类型变量。这种方法同样可以应用于泛型接口。按照约定，类型标识为单个大写字母。这与你已经理解的变量命名规范形成鲜明对比：如果没有这种约定，很难区分类型变量和普通的类或对象名称。最常用的类型参数名称是：


    - `element`（被 Java 集合框架广泛使用）

    - `key`

    - `number-type`

    - `value`

    - `suv` 等 – 第 2、3、4 类类型


    你将在整个 JDK 和 API 中看到这些名称。


    ### 调用和实例化泛型类型


    要在你的系统内部提到泛型箱类别，必须执行泛型类型调用，将 `t` 带入某个具体值，例如整数：


    ```

    Box<integer> integerbox;

    ```


    你可能认为泛型排序的调用与普通的过程调用相当，但并不是在过程中添加添加断言，而是将类型参数（在本例中为整数）传递到箱类别本身。


    许多设计者交替使用“类型参数”和“类型语句”这两个词，但定义并不相同。在编写以生成参数化类型的代码时，提供的是排序参数。因此，`foo <t>` 中的 `t`
    是类型参数，而 `foo <string>` 中的 `string` 是类型内容。在使用这些词时，本类遵循这一概念。


    与任何其他类一样，本类并不生成一个类型的项。泛型类型调用通常是一个具有某种类型的箱项。要实例化此类，请使用 `new` 关键字、类名和类型：


    ```

    Box<integer> integerbox = new Box<>();

    ```


    ### 菱


    在 Java 的最新版本中，只要编译器可以从上下确定类型，你就可以构造函数的类型参数替换为空集。这个角括号 `<>` 被称为“菱”。例如，你可以使用之前的声明：


    ```

    Box<integer> integerbox = new Box<>();

    ```


    ### 泛型方法


    泛型方法是实现自身排序参数的技术。这类似于泛型类型声明，但类型的范围限于声明它的方法。除了泛型构造函数外，还允许静态和非静态泛型方法。泛型方法的语法涉及在过程返回类型之前的一个位于角括号内的类型参数列表。类型参数部分必须出现在方法名之前：


    ```

    public <T> T methodName(T parameter) { }

    ```


