    一个类可以具有以下类型的变量：


    ### 类变量


    类变量是在类内部使用 `static` 修饰符声明且在任何方法之外的变量。


    ### 局部变量


    局部变量是定义在方法或构造函数内部的变量。这些变量在方法内部声明并实例化，并在方法执行完毕后被销毁。


    ### 实例变量


    实例变量是在类内部但在方法之外的变量。它们在类创建的同时进行初始化。可以通过该特定类的方法或构造函数访问它们。一个类可以包含必要的方法来获取它所需的值。例如，`cat`
    类有三个方法：`running()`、`sleeping()` 和 `jumping()`。


