    ![image](images/image100.png)![image](images/image100.png)![image](images/image100.png)![image](images/image100.png)logical
    operator bitwise operator relational operator arithmetic operator


    Like other compute languages, java has a defined list of additional operators
    to take care of certain specific scenarios.


    When it comes to learning java programming language, or any programming language
    for that matter, there are five basic concepts you must understand before you
    get started.


    ![image](images/image100.png)these five basic concepts include: variables


    ![image](images/image100.png)![image](images/image100.png)![image](images/image100.png)data
    structures control structures syntax


    ![image](images/image100.png)tools


    Each of these concepts will be thoroughly explained on a beginner’s level to ensure
    that they are understood.


    ### Separators


    They are not suitable for high-level abstraction: note that a lot of these programs
    make use of low-level constructs which are primarily used for low-level abstraction.


    The usual approach with these programming languages is that they focus on the
    machinehow to make a computer do something rather than how these functions can
    help solve the issues of a user.


    These languages deal with the minute details which is already beyond the scope
    of high-level abstraction, which is the more common approach that we see today.


    In low-level abstraction, data structures and algorithms are taken separately,
    where these are taken as a whole, in high-level abstraction.


    ### Literals


    When it comes to literals in java, we mean the fixed values which appear in the
    form in which human beings can read. we can say the number `200` is literal. most
    of the time, literals can be constants.


    Literals are important in a program. in fact, most java programs use literals.
    some of the programs we have already discussed in this book use literals.


    Literals in java can fall on various data types.


    The manner in which every literal is shown is determined by its type. like it
    mentioned some time back enclose constants in single quotes such as ‘c’ and ‘’.


    We define literals in integers without the fractional part. for instance, `12`
    and `-30` are integer literals. a floating-point literal should contain the decimal
    plus the fractional part. `12.389` is a literal. Java further permits one to apply
    scientific notation for the floating-point. Integer literals contain value, and
    anyone can initialize them with a variable of short,.


    ### Comments


    When this occurs we call the comments. in the running stage of the program the
    comments are moot. This means you can use the comment feature to state or explain
    what the code you are creating wants to achieve. You can achieve this by typing
    two slashes and the comment. here is a sample,


    // single line comment


    You can have more than one comment line by doing either of the following:


    ```

    // we are going to

    // spread the comments into two


    /* This comment spreads over two lines */

    ```


    If you look at the comment above, you will notice that it starts with `/*` but
    ends with `*/`. Additionally, if you look at the previous image (figure 8 you
    will notice that there are comments that begin with a single forward slash and
    two risks (`/**`), but end with one risk and one forwards slash; this is called
    a javadoc comment.


    # Chapter 2 variables


    ### What are variables?


    A variable on the other hand is an "object" that contains a specific data type,
    and it''s assigned or received value. it is called a variable because the value
    contained can change according to how it is used in the code, how the coder can
    declare its value, or even how the user of the program chooses to interact with
    it. a variable in short is a storage unit for a data type. having access to variables
    allow programmers to conveniently label and call stored values at hand.


    ### Types of variables in java


    Java requires the programmer to use declaration statements lines code used to
    declare variables and define them by specifying the particular data type, and
    name. java has a specific way of treating variables, by defining variables as
    containers that contain a certain type, and value of information, unlike some
    languages as python which only requires a declaration of a variable, and the variable
    can dynamically change type; java variables are static once declared.


    `int number = 20;`


    `boolean completed = true;`

    `string hello = "world!"`


    The syntax in declaring is seen in the previous examples with the type the name
    of the variable, the value. note as well that the declaration statement can be
    composed of multiple declarations, as in the following example:


    `int number = 20, boolean completed = true, string hello = "world!"`


    Java variables can be declared without any value at the start; in cases as as
    these java chooses to declare these variables with a particular default value,
    for example:


    ```

    byte a;

    short num;

    boolean answer;

    ```


    Will result in the values 0, 0 and false, respectively. a more complete list of
    default values is as follows: the byte, short, int, and long data types will all
    result in a default value of 0, while the float and double data types will have
    a default 0.0 value, the char data type will result in ‘u\0000’ value, a string
    or any other object will have a null default value, and all booleans will begin
    with a false default value.

