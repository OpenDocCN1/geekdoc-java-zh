    \ 章：文件处理\n\n本章讨论了读取、创建和打开文件的细节。有很多文件类可供选择。\n\n### 读取文本文件\n\n读取文本文件是 Java 中的的一项关键能力，并有许多实际应用。FileReader\
    \ 和 Scanner 是 Java 中读取纯文本文件的有用类，它们中的每一个都具有使其独特标识的特定属性。\n\n### BufferedReader\n\
    \n这种技术从字符流中读取。它缓冲了字符和行以高效地读取。你可以指定缓冲区类型或使用标准类型，对于大多数情况，默认类型已经足够大。特别是从读取器产生的每个操作都会影响基础性能。因此，建议在任何读取器上包装一个缓冲区，像文件读取器这样的操作可能是昂销的。\n\
    \n例如：`BufferedReader in = new BufferedReader(reader in)`\n\n### FileReader\n\n\
    读取字符文档的便利类。该类的构造函数假设默认字符格式和默认缓冲区大小是。\n\n### Scanner\n\n一种简单的文本扫描器，使用正则表达式来解析原始类型和字符串。Scanner\
    \ 使用分隔符模型将其输入拆分为符合定义中空白符的标记（tokens）。通过不同的技术，生成的标记随后可以转换为不同类型的值。\n\n```java\nimport\
    \ java.io.File;\nimport java.util.Scanner;\n\npublic class readfileusingscanner\
    \ {\n    public static void main(string[] args) throws Exception {\n        //\
    \ 文件路径现在被设为参数以便进行扫描\n        File example = new File(\"c:\\\\users\\\\username\\\
    \\desktop\\\\example.txt\");\n        Scanner example1 = new Scanner(file);\n\
    \        while (example1.hasNextLine()) System.out.println(example1.nextLine());\n\
    \    }\n}\n```\n\n不使用循环使用 Scanner：\n```java\nimport java.io.File;\nimport java.util.Scanner;\n\
    public class example {\n    public static void main(string[] args) throws Exception\
