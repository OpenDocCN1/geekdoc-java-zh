    ## Objects


    In the real world, you will encounter objects such as humans, dogs, cars, and
    cats. these objects possess state and behavior. for instance,, when you think
    of a cat, its state can consist of its breed, color, or name.. its behavior may
    consist of running, jumping, or wagging its tail.


    A software object resembles a real-world object in terms of these characteristics.
    its state is saved in fields, and its behavior is exhibited through methods.


    In development, the methods are performed on an object’s internal state, and the
    methods facilitate communication between objects.


    ## Classes


    Classes are used to set the definitions for objects. these specifications serve
    as blueprints for creating objects. while, they are not immediately applied when
    classes are created, the definitions are available in case an object of the class
    is instantiated. an object or class can have multiple copies or ![image](images/image080.jpeg)instances
    within a program.


