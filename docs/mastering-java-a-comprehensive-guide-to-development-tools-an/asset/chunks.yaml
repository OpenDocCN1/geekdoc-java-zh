  trans: "\n\n在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了来说说明，如果我们想使用变量 `num` 来存储一个数字，我们必须首先声明变量：`int\
    \ num`，然后才能给它赋值，例如 `num = 10`。\n\n上述过程通常被已知并称为“赋值语句”，其中值被按照程序员声明的方式被分配给变量。然而，Java（实际上是大多数编程语言）工作方式中一个显著的特点是：在赋值语句中（例如我们示例中的\
    \ `num = 10`），实际存储的值是等号右侧的值，即 `10` 的值，而 `num` 只是用于调用该存储值的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取（getting）”一个值的这一行专业术语，而不是“赋值（assigning）”，尽管在大多数情况下，这两个词可以互换使用，且在某些少数场景之外，它们的功能也基本相同。\n\
    \n但请注意，一旦值被赋值给变量，就需要执行函数才能更改该变量内部数据的数据类型。\n\n### 变量命名\n\n创建变量是一项简单的任务，特别是考虑到 Java\
    \ 程序员倾向于根据数据类型或变量将存储的内容来创建和命名它们。然而，在命名这些变量时有几个规则，否则 Java 将无法识别它并导致错误信息。变量名的主要限制是它不应以特殊字符开头，例如下划线或数字。但是，变量名可以由字母、数字甚至下划线等字符组成，只要下划线不在开头即可。\n\
    \n不能使用其他字符，例如 `#` 甚至其他符号，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，但在变量命名方面有一些提示。变量名应该具有描述性，因为在较长的代码中，可能很难想起\
    \ \"x\" 是做什么的。使用像 \"count\" 或 \"output\" 这样的变量名比通用的 \"x\" 或 \"y\"更容易记忆，并有助于避免混淆。除了描述性之外，如果变量名保持较短，变量也将更易于使用。虽然像\
    \ `information records` 这样的变量名非常有描述性，但在程序中根据需要重复输入它会非常累，而且较长的名称会增加拼写错误的概率，从而导致代码出现\
    \ Bug，导致运行时错误或代码无法运行但在过程中引入了 Bug。注意，Java 变量的习惯做法一直是使用全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉的大写可能会导致变量无法被识别为大写字母。\n\
    \n### 方法命名规范\n\n我们将重新回顾 Java 中的命名规范，因为你将要使用方法。Java 中的方法执行操作，它们还会接收调用者提供的任何参数，并且还可以向调用者返回操作的结果。以下是声明方法的语法结构：\n\
    \n```\naccess modifier return type methodName([set of parameters]) {\n// body\
    \ of the method\n}\n```\n\n在你为要编写的方法命名时，有几条规则需要记住。方法名始终是动词，更具体地说是动词短语（这意味着你可以使用多个单词来命名它们）。方法名的第一个单词应该是全小写字母，而其他单词应该遵循驼峰命名法（camel\
    \ case）格式。这里有一个例子：\n\n`writeMethodNameThisWay()`\n\n现在，你应该记住，动词用于方法名，它们表示动作；而名词用于变量名，它们表示特定的属性。\n\
    \n遵循方法的声明语法并遵循此 Java 构造的命名规范，这里有一段可以计算圆面积的示例代码。\n\n```java\npublic double computeCircleArea()\
    \ {\n    return radius * radius * math.pi;\n}\n```\n\n### 在代码中使用构造函数\n\n我们只需介绍一些细节，构造函数看起来像一个方法，但在几个方面与方法不同。构造函数的名称与类名相同。使用运算符\
    \ `new` 来创建构造函数的新实例并同时对其进行初始化。这里有一个使用 `Employee` 类并在代码中初始化它的多种方式示例：\n\n```\nEmployee\
    \ emp1 = new Employee();\nEmployee emp2 = new Employee(2);\nEmployee emp3 = new\
    \ Employee(3, \"regular\");\n```\n\n构造函数还会隐式返回 `void`，这意味着它没有返回类型。你不能在构造函数的体内部放置返回语句，因为编译器会将其视为错误。调用构造函数的唯一方法是通过使用\
    \ `new` 语句。\n\n最后一个区别是构造函数是不能被继承的。让我们回到提供的示例——第一行包含了 `Employee()`——这被称为默认构造函数。正如你所看到的，它没有参数。默认构造函数的作用是将成员变量初始化为特定的默认值。在上面的示例中，成员变量\
    \ `payrate1` 被初始化为它的默认薪率，`employee` 状态也是如此初始化。\n\n"
- fmt: '

    Can constructors be overloaded too? Yes, they can. Constructors can have like
    methods too, so that means you can overload a constructor just the same way you
    overload a method. Here are a few examples of how you can overload a constructor.
    we use the `Employee` class and overload it using different parameters.


    ```

    Employee()

    Employee(int r)

    Employee(int r, string b)

    ```


    ### How to initialize a variable


    Now that we know how to declare variables, and we know the various types of variables
    that are available to us, the next thing to do is to learn how to make use of
    these variables in something called “expressions.” Expressions are the most used
    building blocks of a java program, generally meant to produce a new value as a
    result, though in some cases expressions are used to assign a new value to a variable..
    generally expressions are made up of things such as values, variables, operators
    and method calls. there are also some expressions that produce no result but rather
    affect another variable. one example would be an expression that changes the value
    of a variable based on an operation: there is no new value output and there is
    no true “assignment” of a new value, but rather there is what is called a side
    effect that results in a changed variable value.


    The "hello world" printing program, we introduced raw values into the print function,
    also known as "hard coding" the output. however, at this point, we should try
    to incorporate what we have learned about variables. variables operate much the
    same way as raw values, as they simply reference a previously stored value by
    the computer and as such, the programmer can just use the variable name instead
    of the value. in order to demonstrate this, let us remember the previous "hello
    world" program:


    ```

    Print ("hello world");

    Input("\n\n please the return key to close this window.");

    ```


    Now, instead of hardcoding the "hello world" string, we can simply declare it
    into a variable and have the program output that variable. this should end up
    looking as:


    ```

    String = "hello world"; print(string);

    Input("\n\n please the return key to close this window.");

    ```


    This should come out with the same result as the previous program, looking something
    similar to:


    Hello world

    Please press the return key to close this window.


    # Chapter 3: java basics


    ### Java development kit


    The `jdk` provides the tools needed to build test robust java-based applications.
    it allows developers to access software components and compile applications during
    java programming. for example, a developer needs a `jdk`-environment to be able
    to write apps methods.


    Since `jdk` more performs operations of a software development kit (`sdk`), one
    could easily confuse the scope and operations of the two items. where the `jdk`
    is specific to the java language, an `sdk` has broader applicability. but a `jdk`
    still operates as a component of an environment. this means that a developer would
    still need an `sdk` to provide certain tools which are not available within the
    `jdk` domain. developer documentation and debugging utilities as well are some
    of the crucial tools that `sdk` supplies to a java environment.


    The scope of `jdk` deployment depends on the nature of the tasks at hand, the
    supported versions and the java edition that is in use.. for example, the java
    platform standard (`se`) development kit is designed for use with the java edition.
    the java platform enterprise edition (`ee`), and the java platform micro edition
    (`me`), are the other major subsets of the `jdk`. details of each of these java
    editions are described in detail in the subtopics below. the `jdk` has been a
    free platform since 2007 when it was uploaded to the openjdk portal. its open-source
    status facilitates collaborations and allows communities of software developers
    to clone, hack or contribute ideas for advancements and upgrades.


    ### Java se


    The `java se` powers a wide variety of desktop and server applications. it supports
    the testing and deployment of the java programming language within the development
    environment of these applications. some of the documentations associated with
    the recent releases of java se include an advanced management console feature
    and a revamped set of java deployment rules. `java se, 13.0.1` is the latest `jdk`
    version for the `java se` platform at the time of writing this book.


    The `java se sdk` is equipped with the core runtime capabilities alongside a portfolio
    of tools and libraries that are designed for use in the development of applications.
    these tools range from simple objects and types to advanced classes with networking
    capabilities and security characteristics. developers can also apply this jdk
    development to access databases.


    ### Java ee


    The java platform is an open-source product that is developed through the collaborative
    efforts of members of the java community worldwide


    Java ee is closely related to the java se because the former is built on top of
    the latter.. this particular software is integrated with transformative innovations
    that are designed for use in enterprise solutions. the features and advancements
    introduced in new releases often reflect the inputs and requests of members of
    the java community. the java ee sdk is meant for use in the construction of applications
    for large-scale operations. the `jdk` provides a powerful api and runtime properties
    that developers require to build applications with scalability and security characteristics.

