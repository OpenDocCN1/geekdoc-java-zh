    按照按照继承层次结构的自底向上（反向）顺序\n捕获异常。\n\n3\n\nD\n\n正确的顺序是\n`RuntimException`、`Exception`\
    \ \n和 `Throwable` 类。\n\n4\n\nD\n\n‘Try’ 块不能\n封装一个类。\n\n5\n\nA\n\n如果未按照继承层次结构的反向处理异常，\n\
    编译器会给出错误。\n\n# 第 8 章\n## 多重异常\n\n**Q.1: Java 在哪个版本中添加了这一功能（在单个 catch 中处理多个异常）？**\n\
    \n**A**\n6\n\n**B**\n5\n\n**C**\n7\n\n**D**\n8 ✅\n\n**Q.2: 使用什么分隔符来识别单个 catch\
    \ 中的多个异常？**\n\n**A**\n`|` (管道符)\n\n**B**\n`&` (连字符符号)\n\n**C**\n`,` (逗号)\n\n**D**\n\
    `/` (斜杠) ✅\n\n**Q.3: 识别正确的语法**\n\n**A**\n`catch(Error| Exception obj) {}`\n\n\
    **B**\n`catch(Throwable | Exception) {}`\n\n**C**\n`catch(Throwable obj | Exception\
    \ obj2) {}`\n\n**D**\n`Catch (…) {}` ✅\n\n**Q.4: 父类和子类的异常不能在单个 catch 块中捕获。**\n\
    \n**A**\n正确 (TRUE)\n\n**B**\n错误 (FALSE) ✅\n\n**Q.5: 当父类和子类的异常在单个 catch 块中捕获时会发生什么？**\n\
    \n**A**\n没有错误或异常\n\n**B**\n编译器错误\n\n**C**\nJVM 错误\n\n**D**\n运行时异常 (Runtime Exception)\
    \ ✅\n\n### 答案：\n\n| 题号 | 答案 | 解析 |\n| :--- | :--- | :--- |\n| 1 | C | Java 7 添加了在单个\
    \ catch 中处理多重异常的功能。 |\n| 2 | A | 在单个 catch 中分隔异常的分隔符是‘|`’。 |\n| 3 | A | 正确语法为：`catch(Error|\
    \ Exception obj) {}` |\n\n![Image 9](img/index-37_1.jpg)\n\n| 4 | A | 父类和子类异常不能在单个\
    \ catch 中被捕获。 |\n| 5 | B | 当程序员尝试在单个 catch 中处理父类和子类异常时，编译器会给出错误。 |\n\n# 第 9 章\n\
    ## Finally 块\n\n**Q.1: ‘try’ 块可以添加多少个 ‘finally’ 块？**\n\n**A**\n1\n\n**B**\n2\n\
    \n**C**\n3\n\n**D**\n任意数量 ✅\n\n**Q.2: 异常块的顺序是 ……………**\n\n**A**\n`try, finally,\
    \ catch`\n\n**B**\n`catch,finally,try`\n\n**C**\n`try,catch,finally`\n\n**D**\n\
    任意顺序 ✅\n\n**Q.3: 在 …………….. 时‘finally’ 块不执行**\n\n**A**\n调用了 ‘return’ 关键字\n\n**B**\n\
    程序退出 ✅\n\n**C**\n‘finally’ 保证会被执行\n\n**D**\n以上都不是 ✅\n\n**Q.4: 识别正确的陈述**\n\n**A**\n\
    对于给定的 try，‘finally’ 块是强制性的。\n\n**B**\n当发生异常时，‘finally’ 块会执行。 ✅\n\n**C**\n当没有异常时，‘finally’\
    \ 块会执行。\n\n**D**\n以上都不是。 ✅\n\n**Q.5: 对于给定的 ‘try’ 块，“finally’ 块放置在 ……………..之后**\n\
    \n**A**\n‘try’ 块\n\n**B**\n‘catch’ 块 ✅\n\n**C**\n‘finally’ 块\n\n**D**\n构造函数\n\n\
    **Q.6: 一个 try 块至少需要 ………………….. 或 …………。**\n\n**A**\n‘catch’ 块 ✅\n\n**B**\n‘finally’\
    \ 块 ✅\n\n**C**\n‘try’ 块\n\n**D**\n代码块 ✅\n\n**Q.7: 如果 ‘try’ 块同时包含 catch 和 finally\
    \ 块，则 ………… 将被放在第一个**\n\n**A**\n‘catch’ 块\n\n**B**\n‘finally’ 块 ✅\n\n**C**\n任意顺序\n\
    \n**D**\n以上都不是 ✅\n\n**Q.8: 如果 try 块只有 finally 块且发生了异常，会发生什么？**\n\n**A**\n程序崩溃\n\
    \n**B**\n程序继续运行且不崩溃\n\n**C**\n结果不可预测\n\n**D**\n编译器错误 ✅\n\n### 答案：\n\n| 题号 | 答案\
    \ | 解析 |\n| :--- | :--- | :--- |\n| 1 | A | 对于给定的 try 块，只能添加一个 finally 块。 |\n\
    | 2 | C | 异常块的顺序是 – try, catch  finally finally。 |\n| 3 | B | 程序退出时，‘finally’\
    \ 块不执行。 |\n| 4 | B,C | 无论是否发生异常，‘finally’ 块都会保证执行。 |\n\n![Image 10](img/index-41_1.jpg)\n\
    \n| 5 | B | ‘finally’ 块放置在 ‘catch’ 块之后。 |\n| 6 | A,B | 一个 ‘try’ 块至少要有 ‘catch’\
    \ 或 ‘finally’。 |\n| 7 | A | ‘try’ 块后面跟着 ‘catch’ 块和 ‘finally’ 块。 |\n| 8 | - | （注：文本碎片化）\
    \ |\n\n# 第 10 章\n## Finally 块与 Return 关键字\n\n**Q.1: 如何强制停止应用程序？**\n\n**A**\n`System.stop()`\n\
    \n**B**\n`System.exit()`\n\n**C**\n`System.halt()`\n\n**D**\n`System.exit()` ✅\n\
    \n**Q.2: 当发生异常时，‘finally’ 块会执行。**\n\n**A**\n正确 (TRUE) ✅\n\n**B**\n错误 (FALSE)\n\
    \n**Q.3: 没有发生异常时，‘finally’ 块会执行。**\n\n**A**\n正确 (TRUE) ✅\n\n**B**\n错误 (FALSE)\n\
    \n**Q.4: 使用 ‘return’ 关键字时，‘finally’ 块会执行吗？**\n\n**A**\n会 ✅\n\n**B**\n不会\n\n**Q.5:\
    \ ‘finally’ 块总是放置在 ‘try’ 或 ‘catch’ 块之后。**\n\n**A**\n是 ✅\n\n**B**\n否\n\n# 第 11\
    \ 章 (重复内容整合)\n## 异常处理总结\n\n**Q.1: 正确的顺序是 `try, catch, finally`。**\n\n**A**\n正确\
    \ ✅\n\n**B**\n错误\n\n"
