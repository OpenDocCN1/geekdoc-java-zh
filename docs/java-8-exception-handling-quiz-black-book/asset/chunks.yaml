    \ void main(String args[]){\n        int i=10;\n        int j=11;\n        if\
    \ (j> i)\n            throw new MyException(“j is greater”);\n    }\n}\n```\n\
    A RuntimeException \nB 编译错误\nC JVM 错误\nD 以上均不是\n<--正确答案\n\n### Q.6: 输出结果是什么？\n\
    \n```java\nclass MyException extends Exception {\n    MyException(String str)\
    \ {\n        super(str);\n    }\n}\n\nclass Program {\n    public static void\
    \ main(String args[]) throws Exception{\n        int i=10;\n        int j=11;\n\
    \        if (j> i)\n            throw new MyException(“j is greater”);\n    }\n\
    }\n```\nA Object Exception\nB JVM 错误\nC Runtime Exception\nD 编译错误\n<--正确答案\n\n\
