    encapsulate a class.


    5


    A


    If exception are not handled in the reverse order of their inheritance hierarchy

    compiler gives an error.


    # Chapter 8

    ## Multiple Exceptions


    **Q.1: In which version of Java was this (Multiple exceptions in a single catch)
    capability added?**


    **A**

    6


    **B**

    5


    **C**

    7


    **D**

    8 ✅


    **Q.2: What is the delimiter used to identify multiple exceptions in a single
    catch?**


    **A**

    `|` (pipe)


    **B**

    `&` (ampersand)


    **C**

    `,` (comma)


    **D**

    `/` (slash) ✅


    **Q.3: Identify the correct syntax**


    **A**

    `catch(Error| Exception obj) {}`


    **B**

    `catch(Throwable | Exception) {}`


    **C**

    `catch(Throwable obj | Exception obj2) {}`


    **D**

    `Catch (…) {}` ✅


    **Q.4: Mother and Child class exception cannot be caught in a single catch block.**


    **A**

    TRUE


    **B**

    FALSE ✅


    **Q.5: What happens when Mother and Child class exception is caught in a single
    catch block?**


    **A**

    No error or exception


    **B**

    Compiler Error


    **C**

    JVM Error


    **D**

    Runtime Exception ✅


    ### Answers:


    | Q.No | Ans | Explanation |

    | :--- | :--- | :--- |

    | 1 | C | Multiple exception handling in a single catch was added in Java 7. |

    | 2 | A | The delimiter used to segregate exceptions in a single catch is ‘|`’.
    |

    | 3 | A | Correct syntax is : `catch(Error| Exception obj) {}` |


    ![Image 9](index-37_1.jpg)


    | 4 | A | Mother and child class exception cannot be caught in a single catch.
    |

    | 5 | B | Compiler gives an error when programmer tries to handle mother and class
    exception in a single catch. |


    # Chapter 9

    ## Finally Block


    **Q.1: How many ‘finally’ blocks can be added to ‘try’ block?**


    **A**

    1


    **B**

    2


    **C**

    3


    **D**

    Any number ✅


    **Q.2: The order of exception blocks is ……………**


    **A**

    `try, finally, catch`


    **B**

    `catch,finally,try`


    **C**

    `try,catch,finally`


    **D**

    Any order ✅


    **Q.3: ‘finally’ block does not execute when ………..**


    **A**

    ‘return’ keyword is called


    **B**

    Program exits ✅


    **C**

    ‘finally’ is guaranteed to be executed


    **D**

    None of the above ✅


    **Q.4: Identify the correct statement**


    **A**

    ‘Finally’ block is compulsory for a given try.


    **B**

    ‘Finally’ block is executed when an exception occurs. ✅


    **C**

    ‘Finally’ block is executed when there is no exception.


    **D**

    None of the above. ✅


    **Q.5: For a given ‘try’ block ‘finally’ block is placed after ………..**


    **A**

    ‘try’ block


    **B**

    ‘catch’ block ✅


    **C**

    ‘finally’ block


    **D**

    Constructor


    **Q.6: A try block requires at least ………………….. Or ………….**


    **A**

    ‘catch’ block ✅


    **B**

    ‘finally’ block ✅


    **C**

    ‘try’ block


    **D**

    Code block ✅


    **Q.7: If a ‘try’ block has both catch and finally blocks then ………… will be placed
    first**


    **A**

    ‘catch’ block


    **B**

    ‘finally’ block ✅


    **C**

    Any order


    **D**

    None of the above ✅


    **Q.8: What will happen if a try block only has finally block and an exception
    occurs?**


    **A**

    Program crashes


    **B**

    Program continues without crashes


    **C**

    The outcome is not predictable


    **D**

    Compiler error ✅


    ### Answers:


    | Q.No | Ans | Explanation |

    | :--- | :--- | :--- |

    | 1 | A | Only one finally block can be added for a given try block. |

    | 2 | C | The order of exception blocks is – try, catch and finally. |

    | 3 | B | ‘Finally’ block is not executed when program exits. |

    | 4 | B,C | ‘Finally’ block is guaranteed to be executed with or without exception
    occurrence. |


    ![Image 10](index-41_1.jpg)


    | 5 | B | ‘Finally’ block is placed after ‘catch’ block. |

    | 6 | A,B | A ‘try’ block should have at least ‘catch’ or ‘finally’. |

    | 7 | A | ‘try’ block is followed by ‘catch’ block and ‘finally’ block. |

    | 8 | - | (Note: Text fragmented) |


    # Chapter 10

    ## Finally block & Return keyword


    **Q.1: How to abruptly stop an application?**


    **A**

    `System.stop()`


    **B**

    `System.abort()`


    **C**

    `System.kill()`


    **D**

    `System.exit()` ✅


    **Q.2: ‘finally’ block is executed even if ‘return’ keyword.**


    **A**

    TRUE ✅


    **B**

    FALSE


    **Q.3: (Note: Text fragmented/missing context)**


    **Q.4: ‘finally’ block is executed when an exception occurs.**


    **A**

    TRUE ✅


    **B**

    FALSE


    **Q.5: ‘finally’ block is placed after ‘catch’ block.**


    ![Image 11](index-43_1.jpg)


    ### Answers:


    | Q.No | Ans | Explanation |

    | :--- | :--- | :--- |

    | 1 | D | `System.exit()` is used to abruptly stop an application. |

    | 2 | A | ‘Finally’ block is executed even if `return` keyword is used. |


    # Chapter 11

    ## Checked and Unchecked Exception


    **Q.1: ……………… exception is identified by the compiler**


    **A**

    Checked


    **B**

    Unchecked ✅


    **C**

    Runtime


    **D**

    All


    **Q.2: ……………… exception is not identified by the compiler**


    **A**

    Checked ✅


    **B**

    Unchecked


    **C**

    Runtime


    **D****


    **Q.3: ………….. Exception has to be handled in a program.**


    **A**

    Checked ✅


    **B**

    Unchecked


    **C**

    Runtime


    **D**

    All


    **Q.4: ………….. Exception need not (compulsorily) handled in a program.**


    **A**

    Checked


    **B**

    Unchecked ✅


    **C**

    Runtime


    **D**



    **Q.5: …………… keyword is used for declaring an exception for a method.**


    **A**

    Throw


    **B**

    Throws ✅


    **C**

    Decl


    **D**

    Finally


    **Q.6: Checked exception can derive from …………. or ……………. class**


    **A**

    Throwable


    **B**

    Exception ✅


    **C**

    Error


    **D**

    RuntimeException


    **Q.7: How many exceptions can be declared using ‘throws’ keyword for a method?**


    **A**

    1


    **B**

    2


    **C**

    3


    **D**

    Any number ✅


    **Q.8: Checked exception is verified by compiler.**


    **A**

    TRUE ✅


    **B**

    FALSE


    **Q.9: Unchecked exception derive from ………… class**


    **A**

    Throwable


    **B**

    Exception


    **C**

    Error


    **D**

    RuntimeException ✅


    **Q.10: Which of following is not an unchecked exception?**


    **A**

    NullPointerException


    **B**

    ArithmeticException


    **C**

    ClassCastException


    **D**

    Exception ✅


    **Q.11: Which of following is not a checked exception?**


    **A**

    NullPointerException


    **B**

    ArithmeticException


    **C**

    ClassCastException ✅


    **D**

    Exception


    ### Answers:


    | Q.No | Ans | Explanation |

    | :--- | :--- | :--- |

    | 1 | B | Unchecked exception is identified by the compiler. |

    | 2 | A | Checked exception is not identified by the compiler. |

    | 3 | A | Checked exception has to be handled in a program. |

    | 4 | B | Unchecked exception need not be compulsorily handled in a program. |

    | 5 | B | `Throws` keyword is used for declaring an exception for a method. |

    | 6 | B | Checked exception can derive from Throwable or Exception class. |

    | 7 | D | Any number of exceptions can be declared using `throws` keyword. |

    | 8 | A | Checked exception is verified by compiler. |

    | 9 | D | Unchecked exceptions derive from RuntimeException class. |

    | 10 | D | Exception class is a checked exception. |

    | 11 | C | NullPointerException, ArithmeticException and ClassCastException are
    not checked exceptions. |


