    \ Java ™ 8\n### Exception Handling Quiz\n### Mahavir DS Rathore\n\n**Copyright**\
    \ Java 8 Exception handling quiz by Mahavir DS Rathore. While every precaution\
    \ has been taken in the preparation of this book the author assume No responsibility\
    \ for errors or omissions, or for damages resulting from the use of the information\
    \ contained herein.\n\n### About the author\nI have has been programming & teaching\
    \ Java for last 18 years. This book is an effort to document my knowledge to share\
    \ with everyone across the world. I am available to do training on Java anywhere\
    \ in the world. My email id is gurumahaveer@gmail.com\n\n### Who should read the\
    \ book?\nThis book is for programmers who already know Core Java (Java Standard\
    \ Edition).\n\n### Acknowledgement\nJava is owned by Oracle and trademark is acknowledged.\n\
    \n### Dedication\nTo the inventors of the Java Language.\n\n## Table of Content\
    \ \n\n| Sl.No | Chapter | HyperLink |\n| :--- | :--- | :--- |\n| 1 | Java Setup\
    \ | [Go](#index_split_000.html_p5) |\n| 2 | What is Exception? | [Go](#index_split_000.html_p10)\
    \ |\n| 3 | What is Exception Handling? | [Go](#index_split_000.html_p14) |\n|\
    \ 4 | Java Exception Hierarchy | [Go](#index_split_000.html_p16) |\n| 5 | Try\
    \ and Catch Block | [Go](#index_split_000.html_p24) |\n| 6 | Exception Handling\
    \ API | [Go](#index_split_000.html_p28) |\n| 7 | Multiple Catch | [Go](#index_split_000.html_p31)\
    \ |\n| 8 | Multiple Exceptions | [Go](#index_split_000.html_p34) |\n| 9 | Finally\
    \ Block | [Go](#index_split_000.html_p37) |\n| 10 | Finally and return keyword\
    \ | [Go](#index_split_000.html_p41) |\n| 11 | Checked and Unchecked Exception\
    \ | [Go](#index_split_000.html_p44) |\n| 12 | Nested Exception | [Go](#index_split_000.html_p49)\
    \ |\n| 13 | Throw Keyword | [Go](#index_split_000.html_p54) |\n| 14 | Exception\
    \ Chaining | [Go](#index_split_000.html_p61) |\n| 15 | Try with Resource | [Go](#index_split_000.html_p65)\
    \ |\n| 16 | Overriding Exception | [Go](#index_split_000.html_p69) |\n| 17 | User\
    \ Defined Exception | [Go](#index_split_000.html_p75) |\n\n## Chapter 1: Software\
    \ Setup\n\n**Q.1: What is the latest version of Java?**\nA) 7\nB) 6\nC) 9\nD)\
    \ 8\n**<-Right Answer: D**\n\n**Q.2: JRE stands for …………………**\nA) Java Robust\
    \ Engine\nB) Java Required Engine\nC) Java Runtime Engine\nD) Java Runnable Engine\n\
    **<-Right Answer: C**\n\n**Q. 3: JDK stands for …………………**\nA) Java Debugging Kit\n\
    B) Java Development Kit\nC) Java Documentation Kit\nD) Java Database Kit\n**<-Right\
    \ Answer: B**\n\n**Q. 4: To compile and execute Java application ……………. is needed**\n\
    A) JDK\nB) JRE\nC) JME\nD) JEE\n**<-Right Answer: A**\n\n**Q.5: Which environment\
    \ variable (Windows OS) is set for accessing java compiler and java interpreter\
    \ at command line?**\nA) CLASSPATH\nB) JAVAHOME\nC) PATH\nD) HOME\n**<-Right Answer:\
    \ C**\n\n**Q.6: To just execute a Java application ………………. is needed at the minimum.**\n\
    A) JME\nB) JDK\nC) JEE\nD) JRE\n**<-Right Answer: D**\n\n**Q.7: The command for\
    \ java interpreter (Windows OS) is ………….**\n**) Javaip.exe\nB) Javac.exe\nC) Java.exe\n\
    D) Javai.exe\n**<-Right Answer: C**\n\n**Q.8: The command for Java compiler (Windows\
    \ OS) is ………….**\nA) Java.exe\nB) Javacomp.exe\nC) Javac.exe\nD) Javac.exe\n**<-Right\
    \ Answer: D**\n\n**Q.9: In which folder is 32-bit JDK (Windows OS) is installed\
    \ by default?**\nA) `C:\\Program Files\\`\nB) `C:\\Windows\\`\nC) `C:\\Java`\n\
    D) `C:\\Program Files (x86)\\`\n**<-Right Answer: D**\n\n**Q.10: In which folder\
    \ is 64-bit JDK (Windows OS) is installed by default?**\nA) `C:\\Program Files\\\
    `\nB) `C:\\Windows\\`\nC) `C:\\Java`\nD) `C:\\Program Files (x86)\\`\n**<-Right\
    \ Answer: A**\n\n**Answers Explanation:**\n1. D: The latest version of Java is\
    \ version 8.\n2. C: `JRE` stands for Java Runtime Engine.\n3. B: `JDK` stands\
    \ for Java Development Kit.\n4. A: `JDK` is required for Java program to be compiled\
    \ and executed.\n5. C: `PATH` environment variable contains the location of Java\
    \ commands.\n6. D: To just execute a application only `JRE` is required.\n7. C:\
    \ `Java.exe` is the command to activate Java interpreter.\n8. D: `Javac.exe` is\
    \ the command to activate Java compiler.\n9. D: 32-bit application on Windows\
    \ OS is installed in `C:\\Program Files (x86)\\` by default.\n10. A: 64-bit application\
    \ on Windows OS is installed in `C:\\Program Files\\` by default.\n\n## Chapter\
    \ 2: What is Exception?\n\n**Q.1: ……….. Occur at Runtime.**\nA) Error\nB) Exception\n\
    C) Trigger\nD) None of the above\n**<-Right Answer: B**\n\n**Q.2: Runtime error\
    \ is also called as …………..**\nA) Error\nB) Compiler error\nC) Exception\nD) None\
    \ of the above\n**<-Right Answer: C**\n\n**Q.3: Syntax error yields into …………**\n\
    A) Runtime error\nB) Exception\nC) Compiler error\nD) All of the above\n**<-Right\
    \ Answer: C**\n\n**Q.4: Dividing an integer by zero yields into ………..**\nA) Compiler\
    \ error\nB) JVM error\nC) Nothing\nD) Exception\n**<-Right Answer: D**\n\n**Q.5:\
    \ A missing semi-colon for an instruction yields into ………….**\nA) Exception\n\
    B) Runtime error\nC) Compiler error\nD) JVM error\n**<-Right Answer: C**\n\n**Q.6:\
    \ What will be the output?**\n```java\nclass Program {\n    public static void\
    \ main(String args[]) {\n        String ar = new String[1];\n        ar[2] = \"\
    Ram\";\n        System.out.println(ar[0]);\n    }\n}\n```\nA) Compiler error\n\
    B) Exception\nC) No error\nD) JVM\n**<-Right Answer: B**\n\n**Q.7: An exception\
    \ can occur when …………..**\nA) `throw` is called\nB) Abnormal code is executed\n\
    C) Asynchronous error\nD) All of the above\n**<-Right Answer: D**\n\n**Answers\
    \ Explanation:**\n1. B: Exception occur at Runtime i.e. during program execution.\n\
    2. C: Another name for Runtime error is Exception.\n3. C: Syntax error yields\
    \ into Compiler error.\n4. D: Division by zero yields into `ArithmeticException`.\n\
    5. C: Missing semi-colon is captured as a Compiler error.\n6. B: Exception `ArrayOutOfBounds`\
    \ occur.\n7. D: An exception can occur when any of below is called or occur a.\
    \ `throw` b. Abnormal code is executed c. Asynchronous error.\n\n## Chapter 3:\
    \ What is Exception Handling?\n\n**Q.1: …………. helps in avoiding runtime crash\
    \ of a program.**\nA) Error handling\nB) Exception handling\nC) Compiler handling\n\
    D) Database handling\n**<-Right Answer: B**\n\n**Q.2: Which of the following is\
    \ not a keyword?**\nA) Throw\nB) Throws\nC) throwing\nD) Try\n**<-Right Answer:\
    \ C**\n\n**Q.3: Which of the following is not a keyword?**\nA) Try\nB) Catch\n\
    C) except\nD) Finally\n**<-Right Answer: C**\n\n**Q.4: How to raise an exception?**\n\
    A) throws\nB) Throw\nC) except\nD) Raise\n**<-Right Answer: B**\n\n**Q.5: Who\
    \ handles unhandled exceptions?**\nA) JVM\nB) OS\nC) catch\nD) finally\n**<-Right\
    \ Answer: A**\n\n**Answers Explanation:**\n1. B: Exception handling is used for\
    \ avoiding crash of a program.\n2. C: `throwing` is not a keyword in Java.\n3.\
    \ C: `except` is not keyword in Java.\n4. B: The `throw` keyword is used for raising\
    \ an exception.\n5. A: JVM handles those exception that are not handled by a program.\n\
    \n## Chapter 4: Java Exception Hierarchy\n\n**Q.1: ……………. class is the mother\
    \ class of all exception classes (directly or indirectly).**\nA) Throwable\nB)\
    \ Exception\nC) Error\nD) Object\n**<-Right Answer: A**\n\n**Q.2: …………………… class\
    \ is the mother class of “Exception” class.**\nA) Object\nB) Error\nC) Compiler\n\
    D) Throwable\n**<-Right Answer: D**\n\n**Q.3: …………. is the mother class of “Error”\
    \ class.**\nA) Object\nB) Exception\nC) Throwable\nD) RuntimeException\n**<-Right\
    \ Answer: C**\n\n**Q.4: ……………….. Is the mother class of “RuntimeException” class?**\n"
