  \ jrt:/java.base\n. . .\n```\n\n这有时对诊断类路径问题很有帮助。\n\n### 10. `-Xlint` 告诉编译器发现常见的代码问题。例如，如果你使用以下命令编译：\n\
  \n```\njavac -Xlint sourceFiles\n```\n\n编译器将报告 `switch` 语句中缺失的 `break` 语句。（“lint”一词最初描述用于查找\
  \ C 程序问题的工具，但现在泛指任何标记可疑构造的工具。）\n\n你会得到如下消息：\n\n```\nwarning: [fallthrough] possible\
  \ fall-through into case\n```\n\n括号中的字符串标识警告类别。你可以启用或禁用每个类别。由于大多数类别非常有用，最好保留所有它们，只禁用你不关心的部分，例如：\n\
  \n```\njavac -Xlint:all,-fallthrough sourceFiles\n```\n\n你可以通过命令获取所有警告列表：\n\n```\n\
  javac --help\n```\n\n### 11. Java 虚拟机支持监控 Java 应用，允许安装代理。`jcmd` 工具是一个很好的起点，因为它涵盖了这些用例。运行\n\
  \n```\njcmd\n```\n\n获取计算机上所有 Java 进程的 ID 和主类名。\n\n列出系统属性或虚拟机标志，运行：\n\n```\njcmd\
  \ pidOrMainClass VM.system_properties\njcmd pidOrMainClass VM.flags\n```\n\n你可以配置虚拟机日志：\n\
  \n```\njcmd pidOrMainClass VM.log output=gc.log what=gc=trace decorators=uptime,tid\n\
  ```\n\n获取线程转储，运行：\n\n```\njcmd pidOrMainClass Thread.print \n```\n\n或者\n\n```\n\
  jcmd pidOrMainClass Thread.dump_to_file -overwrite -format=json dump.json\n```\n\
  \n启动 Java Flight Recorder，运行：\n\n```\njcmd pidOrMainClass JFR.start filename=filename\n\
  ```\n\n停止记录，运行：\n\n```\njcmd pidOrMainClass JFR.stop name=1\n```\n\n获取可用命令列表，运行：\n\
  \n```\njcmd pidOrMainClass\n```\n\n### 12. Java Flight Recorder 是 OpenJDK 虚拟机的一种插桩技术，用于收集诊断和分析数据。你可以使用开源的\
  \ VisualVM (`https://visualvm.github.io`) 和 Java Mission Control (`https://adoptium.net/jmc`)\
  \ 来收集和查看记录。这些工具也可以完成你在 `jconsole` 中可以的所有操作。\n\n### 13. JDK 带有许多用例重叠的命令行工具，用于监控虚拟机（`jcmd`,\
  \ `jhsdb`, `jinfo`, `jmap`, `jps`, `jstat`）。`jcmd` 工具是一个很好的起点，因为它涵盖了其中的许多用例。\n\n\
  \n\n\n\n要获取特定命令的帮助，请运行\n\n```\njcmd pidOrMainClass help commandName\n```\n\n本章向你介绍了异常处理和日志记录。你还看到了有关测试和调试的提示。接下来的两章将介绍泛型编程及其最重要的应用：Java\
  \ 集合框架。\n\n# 泛型编程\n\n泛型类和方法具有类型参数。这使得它们能够精确地描述在实现中应该如何使用类型。在泛型类出现之前，程序员必须使用 `Object`\
  \ 类来编写适用于多种类型的代码。这既繁琐又不安全。\n\n随着泛型的引入，Java 拥有了表达能力很强的类型系统，该系统允许设计者详细描述变量和方法的类型应该如何发生变化。在简单的情况下，你会发现实现泛型代码非常容易。在更高级的情况下，对于实现者来说，它可能会变得相当复杂。目标是提供其他程序员可以使用且不会产生意外结果的类和方法。\n\
  \n泛型在 Java 5 中的引入是 Java 编程语言的一项重大变化。一个主要的设计目标是与早期版本向后兼容。因此，Java 泛型有一些不便的局限性。你将在本章中学习泛型编程的优势和挑战。\n\
  \n## 为什么用泛型编程？\n\n`泛型编程` 意味着编写可以重用于许多不同类型对象的代码。例如，你不想编写单独的类来收集 `String` 和 `File`\
  \ 对象。而且你不需要这样做——单一的 `ArrayList` 类就可以收集任何类的对象。这就是泛型编程的一个例子。\n\n实际上，Java 在拥有泛型类之前就已经有一个\
  \ `ArrayList` 类了。让我们研究一下泛型编程的机制是如何演变的，以及这对于用户和实现者意味着什么。\n\n### 类型参数的优势\n\n在泛型类添加到\
  \ Java 之前，泛型编程是通过 `继承` 实现的。`ArrayList` 类简单地维护了一个 `Object` 用的数组：\n\n```\npublic class\
  \ ArrayList // 泛型类出现之前\n{\n   private Object[] elementData;\n   . . .\n   public\
  \ Object get(int i) { . . . }\n   public void add(Object o) { . . . }\n}\n```\n\n\
  这种方法有两个问题。每当你检索值时，都需要强制类型转换：\n\n```\nArrayList files = new ArrayList();\n. . .\n\
  String filename = (String) files.get(0);\n```\n\n此外，没有错误检查。你可以添加任何类的值：\n\n```\n\
  files.add(new File(\". . .\"));\n```\n\n此调用可以编译并运行而不会报错。在其他地方，将 `get` 的结果强制转换为 `String`\
  \ 将导致错误。\n\n泛型提供了一个更好的解决方案：`类型参数`。`ArrayList` 类现在有一个类型参数来指示元素类型：\n\n```\nvar files\
  \ = new ArrayList<String>();\n```\n\n这使得你的代码更易于读。你可以立即看出这个特定的列表包含 `String` 对象。\n\
  \n如果你使用显式类型而不是 `var` 来声明变量，则可以通过“菱形”语法在构造函数中省略类型参数：\n\n```\nArrayList<String> files\
  \ = new ArrayList<>();\n```\n\n被省略的类型是从变量的类型中推断出来的。\n\n你可以在匿名子类中使用菱形：\n\n```\nArrayList<String>\
  \ passwords = new ArrayList<>() \n   {\n      public String get(int n) { return\
  \ super.get(n).replaceAll(\".\", \"*\"); }\n   };\n```\n\n 编译器也可以很好地利用类型信息。调用 `get`\
  \ 不需要强制类型转换。编译器知道返回类型是 `String`而不是 `Object`：\n\n```\nString filename = files.get(0);\n\
  ```\n\n编译器还知道 `ArrayList<String>` 的 `add` 方法有一个类型为 `String` 的参数。这比有一个 `Object` 参数安全得多。现在编译器可以检查你没有插入错误类型的对象。例如，语句\n\
  \n```\nfiles.add(new File(\". . .\")); // 只能向 ArrayList<String> 添加 String 对象\n```\n\
  \n将无法编译。编译器错误比运行时的类转换异常好得多。\n\n这就是类型参数的魅力所在：它们让你的程序更易读、更安全。\n\n### 谁想成为泛型程序员？\n\n\
  使用像 `ArrayList` 这样的泛型类很容易。大多数 Java 程序员会直接使用像 `ArrayList<String>` 这样的类型，就像它们是语言内置一样，就像\
  \ `String[]` 数组。（当然，列表比数组更好，因为它们可以自动扩展。）\n\n然而，实现一个泛型类并不容易。使用你代码的程序员会希望为你的类型参数接入各种类。他们期望一切都能在没有繁重限制和困惑性错误信息的情况下正常工作。因此，你作为泛型程序员的工作是预测你的类所有潜在的未来用途。\n\
  \n这能有多难？这里是标准类库设计者必须解决的一个典型问题。`ArrayList` 类有一个方法 `addAll` 用于添加另一个集合的所有元素。程序员可能想将\
  \ `ArrayList<Manager>` 中的所有元素添加到 `ArrayList<Employee>` 中。但，当然，反过来操作不应该是合法的。你如何允许一种调用而禁止另一种呢？Java\
  \ 语言设计者发明了一个巧妙的新概念——`通配符类型`，来解决这个问题。通配符类型相当抽象，但它们允许库构建者使方法尽可能灵活。\n\n泛型编程分为三个技能水平。在基础水平，你只需使用泛型类——通常是如\
  \ `ArrayList` 等集合——而不思考它们是如何以及为什么工作的。大多数应用程序程序员希望在该水平停留，直到出现问题。然而，在混合泛型类或与未知类型参数的旧代码交互时，你可能会遇到困惑的错误信息；那时，你需要学习足够的泛型知识，以系统的方法解决问题，而不是随机尝试。最后，当然，你可能想实现自己的泛型类。\n\
  \n## 定义简单的泛型类\n\n*泛型类* 是具有一个或多个类型变量的类。在本章中，使用简单的 `Pair` 类作为示例。该类允许我们关注泛型，而不被数据存储细节分心。这是泛型\
  \ `Pair` 类的代码：\n\n```\npublic class Pair<T>\n{\n   private T first;\n   private\
  \ T second;\n\n   public Pair() { first = null; second = null; }\n   public Pair(T\
  \ first, T second) { this.first = first; this.second = second; }\n\n   public T\
  \ getFirst() { return first; }\n   public T getSecond() { return second; }\n\n \
  \  public void setFirst(T newValue) { first = newValue; }\n   public void setSecond(T\
  \ newValue) { second = newValue; }\n}\n```\n\n`Pair` 类在类名后引入了封装尖括号 `< >` 中的类型变量\
  \ `T`。泛型类可以有多个类型变量。例如，我们可以为第一个第二个字段使用不同的类型来定义 `Pair` 类：\n\n```\npublic class Pair<T,\
  \ U> { . . . }\n```\n\n\n\n\n类型变量在整个类定义中用于指定方法的返回类型以及字段和局部变量的类型。例如：\n\n```\nprivate\
  \ T first; // 使用类型变量\n```\n\n通常的做法是使用大写字母作为类型变量，并保持它们简短。Java 库使用变量 `E` 表示集合的元素类型，使用\
  \ `K` 和 `V` 表示表格的键和值类型，并使用 `T`（必要时还使用相邻的字母 `U` 和 `S`）表示“任意类型”。\n\n你通过将类型变量替换为具体类型来`实例化`泛型类型，例如：\n\
  \n```\nPair<String>\n```\n\n你可以将结果认为是一个具有以下构造函数的普通类：\n\n```\nPair<String>()\nPair<String>(String,\
  \ String)\n```\n\n以及方法：\n\n```\nString getFirst()\nString getSecond()\nvoid setFirst(String)\n\
  void setSecond(String)\n```\n\n换句话说，泛型类充当了普通类的工厂。\n\nListing 8.1 中的程序演示了 `Pair`\
  \ 类的用法。静态方法 `minmax` 遍历数组并同时计算最小值和最大值。它使用一个 `Pair` 对象来返回这两个结果。请记住，`compareTo` 方法比较两个字符串：如果字符串相同则返回\
  \ `0`；如果第一个字符串在字典序上排于第二个字符串之前则返回负整数；否则返回正整数。\n\n从表面上看，Java 的泛型类与 C++ 的模板类相似。唯一明显的区别是\
  \ Java 没有特殊的 `template` 关键字。然而，正如你将在本章中将看到的，这两种机制之间存在实质性的差异。\n\n`pair1/PairTest1.java`\n\
  \n```\npackage pair1;\n\n/**\n * @version 1.01 2012-01-26\n * @author Cay Horstmann\n\
  \ */\npublic class PairTest1\n{\n   public static void main(String[] args)\n   {\n\
  \      String[] words = { \"Mary\", \"had\", \"a\", \"little\", \"lamb\" };\n  \
  \    Pair<String> mm = ArrayAlg.minmax(words);\n      System.out.println(\"min =\
  \ \" + mm.getFirst());\n      System.out.println(\"max = \" + mm.getSecond());\n\
  \   }\n}\n\nclass ArrayAlg\n{\n   /**\n    * 获取字符串数组的最小值和最大值。\n    * @param a 一个字符串数组\n\
  \    * @return 包含最小和最大值的对，如果 a 为空或长度为空则返回 null\n    */\n   public static Pair<String>\
  \ minmax(String[] a)\n   {\n      if (a == null || a.length == 0) return null;\n\
  \      String min = a[0];\n      String max = a[0];\n      for (int i = 1; i < a.length;\
  \ i++)\n      {\n         if (min.compareTo(a[i]) > 0) min = a[i];\n         if\
  \ (max.compareTo(a[i]) < 0) max = a[i];\n      }\n      return new Pair<>(min, max);\n\
  \   }\n}\n```\n\n### 泛型方法\n\n在上一节中，你已经学习了如何定义泛型类。你也可以定义带有类型参数的单个方法。\n\n```\nclass\
  \ ArrayAlg\n{\n   public static <T> T getMiddle(T... a)\n   {\n      return a[a.length\
  \ / 2];\n   }\n}\n```\n\n该方法定义在普通类内部，而不是泛型类内部。然而，从尖括号和类型变量可以看出，这是一个泛型方法。注意，类型变量插入在修饰符（在本例中为\
  \ `public static`）之后、返回类型之前。\n\n你可以在普通类内部，也可以在泛型类内部定义泛型方法。\n\n当你调用泛型方法时，可以将括在尖括号中的实际类型放在方法名之前：\n\
  \n```\nString middle = ArrayAlg.<String>getMiddle(\"John\", \"Q.\", \"Public\");\n\
  ```\n\n在这种情况下（实际上在大多数情况下都是），你可以从方法调用中省略 `<String>` 类型参数。编译器有足够的信息来推断你想要的方法。它将参数的类型与泛型类型\
  \ `T...` 进行匹配，并推断出 `T` 必须是 `String`。也就是说，你只需调用：\n\n```\nString middle = ArrayAlg.getMiddle(\"\
  John\", \"Q.\", \"Public\");\n```\n\n在几乎所有情况下，泛型方法的类型推断都能顺畅工作。偶尔编译器会出错，这时你需要解读错误报告。考虑这个例子：\n\
  \n```\ndouble middle = ArrayAlg.getMiddle(3.14, 1729, 0);\n```\n\n错误信息用随编译器版本而异的晦涩术语抱怨道，这段代码有两种解释方式，且两者都同样有效。简而言之，编译器将参数自动装箱为\
  \ `Double` 和两个 `Integer` 对象，然后尝试寻找这些类的公共超类。它实际上找到了两个：`Number` 和 `Comparable` 接口，而后者本身也是泛型类型。在这种情况下，解决方法是将所有参数都写为\
  \ `double` 值。\n\nPeter von der Ahé 建议，如果你想查看编译器为泛型方法调用推断出什么类型，可以使用这个技巧：故意引入错误并研究生成的错误信息。例如，考虑调用\
  \ `ArrayAlg.getMiddle(\"Hello\", 0, null)`。将结果赋值给 `double`，你将得到一个错误：\n\n```\ndouble\
  \ middle = ArrayAlg.getMiddle(\"Hello\", 0, null);\n```\n\n## 类型变量的边界\n\n有时，类或方法需要对类型变量进行限制。这是一个典型的例子。我们想要计算数组的最小元素：\n\
  \n```\nclass ArrayAlg\n{\n   public static <T> T min(T[] a)\n   {\n      if (a ==\
  \ null || a.length == 0) return null;\n      T smallest = a[0];\n      for (int\
  \ i = 1; i < a.length; i++)\n         if (smallest.compareTo(a[i]) > 0) smallest\
  \ = a[i];\n      return smallest;\n   }\n}\n```\n\n但有一个问题。查看 `min` 方法内部。变量 `smallest`\
  \ 的类型是 `T`，它可以是任何类。我们如何知道 `T` 的类拥有 `compareTo` 方法呢？\n\n解决方案是为 `T` 指定一个边界——一个具有 `compareTo`\
  \ 方法的标准接口：\n\n```java\npublic static <T extends Comparable> T min(T[] a)\n```\n\n\
  实际上，`Comparable` 接口本身就是一个泛型类型。目前请忽略这种复杂性和编译器生成的警告。8.7 节 讨论了如何正确与 `Comparable` 使用类型参数。\n\
  \n现在，泛型 `min` 方法只能与实现了 `Comparable` 接口的类数组一起调用，例如 `String`、`LocalDate` 等。使用 `Rectangle`\
  \ 数组调用会导致编译错误，因为 `Rectangle` 类没有实现 `Comparable`。\n\n在 C++ 中，无法限制模板参数的类型。如果程序员用不当类型实例化模板，会在模板代码内部报告（通常是晦涩的）错误信息。\n\
  \n一个类型变量可以有多个边界。例如：\n\n```\nT extends Comparable & Serializable\n```\n\n边界类型之间用符号\
  \ `&` 分隔，因为逗号用于分隔类型变量。\n\n\n\n与 Java 继承一样，你可以根据需要拥有任意数量的接口超类型，但边界（bounds）中最多有一个类。如果你有一个类作为边界，它必须是边界列表中的第一个。\n\
  \n在接下来的示例程序（Listing 8.2）中，我们将 `minmax` 方法重写为泛型。该方法计算泛型数组的最小值和值，返回一个 `Pair<T>`。\n\
  \n`pair2/PairTest2.java`\n\n```java\npackage pair2;\n\nimport java.time.*;\n\n/**\n\
  \ * @version 1.02 2015-06-21\n * @author Cay Horstmann\n */\npublic class PairTest2\n\
  {\n   public static void main(String[] args)\n   {\n      LocalDate[] birthdays\
  \ = \n         { \n            LocalDate.of(1906, 12, 9), // G. Hopper\n       \
  \     LocalDate.of(1815, 12, 10), // A. Lovelace\n            LocalDate.of(1903,\
  \ 12, 3), // J. von Neumann\n            LocalDate.of(1910, 6, 22), // K. Zuse\n\
  \         };\n      Pair<LocalDate> mm = ArrayAlg.minmax(birthdays);\n      System.out.println(\"\
  min = \" + mm.getFirst());\n      System.out.println(\"max = \" + mm.getSecond());\n\
  \   }\n}\n\nclass ArrayAlg\n{\n   /**\n      获取类型 T 的对象数组的最小值和最大值\n      @param\
  \ a 一个类型 T 的对象数组\n      @return 包含最小和最大值的对，如果 a 为空或为空则返回 null\n   */\n   public\
  \ static <T extends Comparable> Pair<T> minmax(T[] a) \n   {\n      if (a == null\
  \ || a.length == 0) return null;\n      T min = a[0];\n      T max = a[0];\n   \
  \   for (int i = 1; i < a.length; i++)\n      {\n         if (min.compareTo(a[i])\
  \ > 0) min = a[i];\n         if (max.compareTo(a[i]) < 0) max = a[i];\n      }\n\
  \      return new Pair<>(min, max);\n   }\n}\n```\n\n## 泛型代码与虚拟机\n\n虚拟机并不拥有泛型类型的对象——所有对象都属于普通类。泛型实现的早期版本甚至能够将使用泛型的程序编译成类文件，这些文件可以在\
  \ 1.0 虚拟机上执行！在接下来的章节中，你将看到编译器如何“擦除”类型参数，以及这一过程对 Java 程序员意味着什么。\n\n### 擦擦除\n\n每当你定义一个泛型类型时，系统会自动提供一个对应的原始（raw）类型。原始类型的类型名称仅仅是泛型类型的名称，但去除了类型参数。类型变量被“擦除”并替换为它们的边界类型（对于没有边界的变量，则使用\
  \ `Object`）。\n\n例如，`Pair<T>` 的原始类型如下：\n\n```java\npublic class Pair\n{\n   private\
  \ Object first;\n   private Object second;\n\n   public Pair(Object first, Object\
  \ second)\n   {\n      this.first = first;\n      this.second = second;\n   }\n\n\
  \   public Object getFirst() { return first; }\n   public Object getSecond() { return\
  \ second; }\n\n   public void setFirst(Object newValue) { first = newValue; }\n\
  \   public void setSecond(Object newValue) { second = newValue; }\n}\n```\n\n由于\
  \ `T` 是无边界的类型变量，它被简单地替换为 `Object`。\n\n结果是一个普通类，就像你在 引入泛型之前可能实现的那样。\n\n你的程序可能包含不同类型的\
  \ `Pair`，例如 `Pair<String>` 或 `Pair<LocalDate>`，但擦除将它们都转换成了原始 `Pair` 类型。\n\n在这方面，Java\
  \ 泛型与 C++ 模板非常不同。C++ 会为每个模板实例化产生不同的类型——这种现象被称为“模板代码膨胀（template code bloat）”。Java\
  \ 并不受这个问题的影响。\n\n原始类型用第一个边界替换类型变量，如果没有给出边界，则用 `Object`。例如，类 `Pair<T>` 中的类型变量没有显式边界，因此原始类型将\
  \ `T` 替换为 `Object`。假设我们声明一个略有不同的类型：\n\n```java\npublic class Interval<T extends\
  \ Comparable & Serializable> implements Serializable\n{\n   private T lower;\n \
  \  private T upper;\n   . . .\n   public Interval(T first, T second)\n   {\n   \
  \   if (first.compareTo(second) <= 0) { lower = first; upper = second; }\n     \
  \ else { lower = second; upper = first; }\n   }\n}\n```\n\n原始类型 `Interval` 如下：\n\
  \n```java\npublic class Interval implements Serializable\n{\n   private Comparable\
  \ lower;\n   private Comparable upper;\n   . . .\n   public Interval(Comparable\
  \ first, Comparable second) { . . . }\n}\n```\n\n你可能会奇如果切换边界会发生什么：`class Interval<T\
  \ extends Serializable & Comparable>`。在这种情况下，原始类型将 `T` 替换为 `Serializable`，编译器会在需要时插入到\
  \ `Comparable` 的强制转换。为了效率考虑，你应该将标记接口（即没有方法的接口）放在边界列表的末尾。\n\n### 翻译泛型表达式\n\n当你编写对泛型方法的调用时，虚拟机并没有泛型类型的对象——所有对象都属于普通类。泛型实现的早期版本甚至能够将使用泛型的程序编译成类文件，这些文件可以在\
  \ 1.0 虚拟机上执行！在接下来的章节中，你将看到编译器如何“擦除”类型参数，以及这一过程对 Java 程序员意味着什么。\n\n每当你定义一个泛型类型时，系统会自动提供一个对应的\
  \ `raw` 类型。原始类型的名称仅仅是泛型类型的名称，但去除了类型参数。类型变量被 `擦除` 并替换为它们的边界类型（对于没有边界的变量，则使用 `Object`）。\n\
  \n例如，`Pair<T>` 的原始类型如下：\n\n```java\npublic class Pair\n{\n   private Object first;\n\
  \   private Object second;\n\n   public Pair(Object first, Object second)\n   {\n\
  \      this.first = first;\n      this.second = second;\n   }\n\n   public Object\
  \ getFirst() { return first; }\n   public Object getSecond() { return second; }\n\
  \n   public void setFirst(Object newValue) { first = newValue; }\n   public void\
  \ setSecond(Object newValue) { second = newValue; }\n}\n```\n\n由于 `T` 是无边界的类型变量，它被简单地替换为\
  \ `Object`。\n\n结果是一个普通类，就像你在 引入泛型之前可能实现的那样。\n\n你的程序可能包含不同类型的 `Pair`，例如 `Pair<String>`\
  \ 或 `Pair<LocalDate>`，但擦除将它们都转换成了原始 `Pair` 类型。\n\n在这方面，Java 泛型与 C++ 模板非常不同。C++ 会为每个模板实例化产生不同的类型——这种现象被称为“模板代码膨胀”。Java\
  \ 并不受这个问题的影响。\n\n原始类型用第一个边界替换类型变量，如果没有给出边界，则用 `Object`。例如，类 `Pair<T>` 中的类型变量没有显式边界，因此原始类型将\
  \ `T` 替换为 `Object`。假设我们声明一个略有不同的类型：\n\n```java\npublic class Interval<T extends\
  \ Comparable & Serializable> implements Serializable\n{\n   private T lower;\n \
  \  private T upper;\n   . . .\n   public Interval(T first, T second)\n   {\n   \
  \   if (first.compareTo(second) <= 0) { lower = first; upper = second; }\n     \
  \ else { lower = second; upper = first; }\n   }\n}\n```\n\n原始类型 `Interval` 如下：\n\
  \n```java\npublic class Interval implements Serializable\n{\n   private Comparable\
  \ lower;\n   private Comparable upper;\n   . . .\n   public Interval(Comparable\
  \ first, Comparable second) { . . . }\n}\n```\n\n你可能会奇如果切换边界会发生什么：`class Interval<T\
  \ extends Serializable & Comparable>`。在这种情况下，原始类型将 `T` 替换为 `Serializable`，编译器会在需要时插入到\
  \ `Comparable` 的强制转换。为了效率考虑，你应该将标记接口（即没有方法的接口）放在边界列表的末尾。\n\n### 翻译泛型表达式\n\n当你编写对泛型方法的调用时，虚拟机并没有泛型类型的对象——所有对象都属于普通类。泛型实现的早期版本甚至能够将使用泛型的程序编译成类文件，这些文件可以在\
  \ 1.0 虚拟机上执行！在接下来的章节中，你将看到编译器如何“擦除”类型参数，以及这一过程对 Java 程序员意味着什么。\n\n我们的预期是 `setSecond`\
  \ 的调用是多态的，并且调用了正确的方法。由于 `pair` 指向一个 `DateInterval` 对象，那应该是 `DateInterval.setSecond`。问题是类型擦除干扰了多态。为了解决这个问题，编译器在\
  \ `DateInterval` 类中生成了一个*桥接方法（bridge method）*：\n\n```java\npublic void setSecond(Object\
  \ second) { setSecond((LocalDate) second); }\n```\n\n为了看到为什么这样做有效，让我们仔细跟踪语句的执行：\n\
  \n```\npair.setSecond(aDate)\n```\n\n变量 `pair` 的声明类型为 `Pair<LocalDate>`，该类型只有一个名为\
  \ `setSecond` 的方法，即 `setSecond(Object)`。虚拟机在 `pair` 指向的对象上调用该方法。该对象的类型是 `DateInterval`。因此，调用\
  \ `DateInterval.setSecond(Object)`。该方法是合成的桥接方法。它调用了 `DateInterval.setSecond(LocalDate)`，这正是我们想要的。\n\
  \n\n\n桥接方法（Bridge methods）可能会更加奇异。假设 `DateInterval` 类也重写了 `getSecond` 方法：\n\n```java\n\
  class DateInterval extends Pair<LocalDate>\n{\n   public LocalDate getSecond() {\
  \ return (LocalDate) super.getSecond(); }\n   . . .\n}\n```\n\n在 `DateInterval`\
  \ 类中，有两个 `getSecond` 方法：\n\n```\nLocalDate getSecond() // 定义在 DateInterval 中\nObject\
  \ getSecond() // 重写了 Pair 中定义的方法，以调用第一个方法\n```\n\n你不能像那样编写 Java 代码；拥有两个相同参数类型的方法是违法的——在这里，这两个方法都没有参数。然而，在虚拟机中，参数类型*和返回类型*决定了方法。因此，编译器可以为两个仅在返回类型上不同的方法生成字节码，虚拟机将能够正确处理这种情况。\n\
  \n桥接方法并不限于泛型类型。你之前已经在第 5 章 中看到，在重写另一个方法时，指定一个更具限制性的返回类型是合法的。例如：\n\n```java\npublic\
  \ class Employee implements Cloneable\n{\n   public Employee clone() throws CloneNotSupportedException\
  \ { . . . }\n}\n```\n\n`Object.clone` 和 `Employee.clone` 方法具有*协变返回类型*（covariant\
  \ return types）。\n\n实际上，`Employee` 类有*两个* clone 方法：\n\n```\nEmployee clone() //\
  \ 上文定义\nObject clone() // 合成桥接方法，重写了 Object.clone\n```\n\n合成桥接方法调用了新定义的方法。\n\n总之，你需要记住这些关于\
  \ Java 泛型翻译的事实：\n\n* 虚拟机中泛型，只有普通的类和方法。\n* 所有类型参数都被替换为它们的边界（bounds）。\n* 合成桥接方法以保留多态性。\n\
  * 在需要时插入类型转换以保持类型安全。\n\n* 调用旧代码\n\n在设计 Java 泛型时，一个主要目标是允许泛型与旧代码之间的互操作性。让我们来看一个旧代码的具体示例。Swing\
  \ 用户界面工具包提供了一个 `JSlider` 类，它的“刻度”（ticks）可以使用包含文本或图像的标签进行自定义。这些标签通过以下调用设置：\n\n```java\n\
  void setLabelTable(Dictionary table)\n```\n\n`Dictionary` 类将整数映射到标签。在 Java 5 之前，该类被实现为\
  \ `Object` 实例映射。Java 5 将 `Dictionary` 变成了一个泛型类，但 `JSlider` 从未更新。此时，没有类型参数的 `Dictionary`\
  \ 是原始类型（raw type）。这就是兼容性发挥作用。\n\n当你填充字典时，可以使用泛型类型。\n\n```java\nDictionary<Integer,\
  \ Component> labelTable = new Hashtable<>();\nlabelTable.put(0, new JLabel(new ImageIcon(\"\
  nine.png\")));\nlabelTable.put(20, new JLabel(new ImageIcon(\"ten.png\")));\n. .\
  \ .\n```\n\n当你将 `Dictionary<Integer, Component>` 对象传递给 `setLabelTable` 时，编译器会发出警告。\n\
  \n```java\nslider.setLabelTable(labelTable); // warning\n```\n\n毕竟，编译器无法保证 `setLabelTable`\
  \ 可能会对 `Dictionary` 对象做什么。该方法可能会将所有键替换为字符串。这破坏了键的类型为 `Integer` 的保证，未来的操作可能会导致类型转换异常。\n\
  \n你应该思考一下，并询问 `JSlider` 实际上要对这个 `Dictionary` 对象做什么。在我们案例中，很明显 `JSlider` 只读取信息，所以你可以忽略该警告。\n\
  \n现在考虑相反的情况，即你从一个旧类中获取一个原始类型的对象。你可以将其赋值给类型使用泛型的变量，但当然你会收到一个警告。例如：\n\n```java\nDictionary<Integer,\
  \ Components> labelTable = slider.getLabelTable(); // warning\n```\n\n这没关系——检查警告并确保标签表确实包含\
  \ `Integer` 和 `Component` 对象。当然，这永远没有绝对的保证。恶意的代码编写者可能在滑块中安装了一个不同的 `Dictionary`。但再次，这种情况并不比泛型出现之前的情况更糟。在最坏的情况下，你的程序将抛出异常。\n\
  \n在你思考完该警告后，可以使用一个*注解*（annotation）让它消失。你可以注解一个局部变量：\n\n```java\n@SuppressWarnings(\"\
  unchecked\")\nDictionary<Integer, Components> labelTable = slider.getLabelTable();\
  \ // no warning\n```\n\n或者你可以注解整个方法，如下所示：\n\n```java\n@SuppressWarnings(\"unchecked\"\
  )\npublic void configureSlider() { . . . }\n```\n\n此注解会关闭对方法内部所有代码的检查。\n\n### 泛型记录模式\n\
  \n让我们把 `Pair` 类变成一个记录（record）：\n\n```java\nrecord Pair<T>(T first, T second) {}\n\
  ```\n\n现在你可以用泛型记录形成一个记录模式（record pattern）：\n\n```java\nvar p = new Pair<String>(\"\
  Hello\", \"World\");\nif (p instanceof Pair(var a, var b)) System.out.println(a\
  \ + \" \" + b.toUpperCase());\n```\n\n在模式中，类型参数是推断的——在这里，作为 `Pair<String>`。你也可以显式地指定它：\n\
  \n```\np instanceof Pair<String>(var a, var b)\n```\n\n或者\n\n```\np instanceof Pair<String>(String\
  \ a, String b)\n```\n\n在这个示例中，泛型记录模式用在 `instanceof` 表达式中。你也可以在 `switch` 中使用它们。请参见第\
  \ 8.8.12 节的示例。\n\n### 泛型的继承规则\n\n当你处理泛型类时，你需要学习一些关于继承的规则。让我们从一个许多程序员感到不直觉的情况开始。考虑一个类及其子类，例如\
  \ `Employee` 和 `Manager`。`Pair<Manager>` 是 `Pair<Employee>` 的子类型吗？令人惊讶，答案是“否”。例如，以下代码将无法编译：\n\
  \n```java\nPair<Employee> buddies = new Pair<Manager>(ceo, cfo);\n```\n\n通常，`Pair<S>`\
  \ 和 `Pair<T>` 之间*没有*关系（参见图 8.1）。\n\n![图](img/12_01.jpg)没有继承关系\n\n这似乎是一个残酷的限制，但对于类型安全来说是必要的。假设我们允许将\
  \ `Pair<Manager>` 转换为 `Pair<Employee>`。考虑这段代码：\n\n```java\nvar managerBuddies =\
  \ new Pair<Manager>(ceo, cfo);\nPair<Employee> employeeBuddies = managerBuddies;\
  \ // 假设允许\nemployeeBuddies.setFirst(lowlyEmployee);\n```\n\n显然，最后语句是合法的。但 `employeeBuddies`\
  \ 和 `managerBuddies` 指向*同一个对象*。我们现在成功将 CFO 与一个普通员工配在了一起，这对于 `Pair<Manager>` 来说是不可能的。\n\
  \n你刚刚看到了泛型类型与 Java 数组之间的重要区别。你可以将 `Manager[]` 数组赋值给类型为 `Employee[]` 的变量：\n\n```java\n\
  Manager[] managerBuddies = { ceo, cfo };\nEmployee[] employeeBuddies = managerBuddies;\
  \ // OK\n```\n\n然而数组带有特殊的保护。如果你尝试将普通员工存储到 `employeeBuddies[0]`，虚拟机将抛出 `ArrayStoreException`。\n\
  \n你始终可以将参数化类型转换为原始类型。例如，`Pair<Employee>` 是原始类型 `Pair` 的子类型。这种转换对于与旧代码交互是必要的。\n\n\
  你可以转换为原始类型然后导致类型错误吗？不幸的是，可以。考虑这个示例：\n\n```java\nvar managerBuddies = new Pair<Manager>(ceo,\
  \ cfo);\nPair rawBuddies = managerBuddies; // OK\nrawBuddies.setFirst(new File(\"\
  . . .\")); // 仅有编译警告\n```\n\n这听起来很糟糕。但请记住，你并没有比旧 Java 版本时更糟。虚拟机的安全性不受威胁。当通过 `getFirst`\
  \ 获取外部对象并将其分配给 `Manager` 变量时，会抛出 `ClassCastException`，就像过去一样。\n\n\n\n最后，泛型类可以继承或实现其他的泛型类。在这方面，它们与普通类没有区别。例如，`ArrayList<T>`\
  \ 类实现了 `List<T>` 接口。这意味着一个 `ArrayList<Manager>` 可以转换为 `List<Manager>`。然而，正如你刚刚看到的，一个\
  \ `ArrayList<Manager>` 并不是 `ArrayList<Employee>` 或 `List<Employee>`。图 8.2 显示了这些关系。\n\
  \n![Figure](img/12_02.jpg)泛型列表类型之间的子类型关系\n\n## 通配符类型\n\n类型系统研究人员早就发现，僵化的泛型系统用起来非常不便。Java\
  \ 的设计者发明了一种巧妙（但同样安全）的“逃生口”：通配符类型（wildcard type）。接下来的章节将向你展示如何使用通配符。\n\n### 通配符概念\n\
  \n在通配符类型中，类型参数允许变化。例如，通配符类型\n\n```\nPair<? extends Employee>\n```\n\n表示任何泛型 `Pair`\
  \ 类型，其类型参数是 `Employee` 的子类，例如 `Pair<Manager>`，但不是 `Pair<String>`。\n\n假设你想写一个打印员工对的方法，如下所示：\n\
  \n```\npublic static void printBuddies(Pair<Employee> p)\n{\n   Employee first =\
  \ p.getFirst();\n   Employee second = p.getSecond();\n   System.out.println(first.getName()\
  \ + \" and \" + second.getName() + \" are buddies.\");\n}\n```\n\n正如你在上一节中看到的，你不能向该方法传递一个\
  \ `Pair<Manager>`，这相当有局限性。但解决方案很简单——使用通配符类型：\n\n```\npublic static void printBuddies(Pair<?\
  \ extends Employee> p)\n```\n\n类型 `Pair<Manager>` 是 `Pair<? extends Employee>` 的子类型（参见图\
  \ 8.3）。\n\n![Figure](img/12_03.jpg)带有通配符的子类型关系\n\n我们能通过 `Pair<? extends Employee>`\
  \ 引用来破坏 `Pair<Manager>` 吗？\n\n```\nvar managerBuddies = new Pair<Manager>(ceo, cfo);\n\
  Pair<? extends Employee> wildcardBuddies = managerBuddies; // OK\nwildcardBuddies.setFirst(lowlyEmployee);\
  \ // 编译错误\n```\n\n这种破坏是不可能的。对 `setFirst` 的调用是一个类型错误。为了了解为什么，让我们仔细观察类型 `Pair<? extends\
  \ Employee>`。它的方法看起来是这样的：\n\n```\n? extends Employee getFirst()\nvoid setFirst(?\
  \ extends Employee)\n```\n\n调用 `setFirst` 方法是不可能的！考虑调用 `wildcardBuddies.setFirst(lowlyEmployee)`。编译器知道\
  \ `setFirst` 的参数具有某个特定的类型，该类型扩展自 `Employee`。这个特定类型是 `Employee` 吗？是是 `Manager` 还是其他子类？编译器无法得知。因此，编译器无法接受\
  \ `lowlyEmployee`。出于相同的原因，调用 `wildcardBuddies.setFirst(cio)`（其中 `cio` 是一个 `Manager`\
  \ 实例）也会失败。编译器必须拒绝除 `null` 之外的所有 `setFirst` 参数。\n\n`getFirst` 方法可以继续工作。`getFirst`\
  \ 的返回值是某个特定类型的实例，该类型是 `Employee` 的子类型。编译器不知道那个特定类型是什么，但它能保证赋值给 `Employee` 引用是安全的。\n\
  \n这就是有界通配符（bounded wildcards）的核心思想。现在我们有一种方法来区分安全的访问方法和不安全的修改器方法。\n\n### 通配符的上界边界\n\
  \n通配符边界与类型变量边界相似，但它们多了一个功能——你可以指定一个上界边界（supertype bound），如下：\n\n```\n? super Manager\n\
  ```\n\n这个通配符被限制为 `Manager` 的所有上类型。（现有的 `super` 关键字能够如此准确地描述这种关系真是一种幸运。）\n\n为什么你想这样做呢？带有上界边界的通配符提供的行为与第\
  \ 8.7.1 节中描述的通配符相反。你可以为方法提供参数，但不能使用返回值。例如，`Pair<? super Manager` 拥有的如下描述的方法：\n\n\
  ```\nvoid setFirst(? super Manager)\n? super Manager getFirst()\n```\n\n这并不是真正的\
  \ Java 语法，但它展示了编译器知道的信息。`setFirst` 的参数类型表示为 `? super Manager`，它是某个特定类型 `T`，而 `Manager`\
  \ 是 `T` 的子类型。`T` 只有三种选择：`Object`、`Employee` 或 `Manager`。（如果 `Manager` 或 `Employee`\
  \ 实现了接口，则会有更多选择。）然而，编译器不知道这些选择中哪一个。因此，编译器无法接受类型为 `Employee` 或 `Object` 的参数调用。毕竟，`T`\
  \ 有可能是 `Manager`。只有传递类型为 `Manager` 或其子类（如 `Executive`）的对象才是可能的。\n\n相反，如果你调用 `getFirst`，则对返回对象的类型没有保证。你只能将其赋值给\
  \ `Object`。\n\n这是一个典型的例子。我们有一个经理数组，想要将奖金最低和最高的经理放入一个 `Pair` 对象中。什么样的 `Pair` 呢？\n\
  \n```\npublic static void minmax(Manager[] a, Pair<Manager> result)\n{\n   if (a.length\
  \ == 0) return;\n   Manager min = a[0];\n   Manager max = a[0];\n   for (int i =\
  \ 1; i < a.length; i++)\n   {\n      if (a[i].getBonus() < min.getBonus()) min =\
  \ a[i];\n      if (a[i].getBonus() > max.getBonus()) max = a[i];\n   }\n   result.setFirst(min);\n\
  \   result.setSecond(max);\n}\n```\n\n![Figure](img/12_04.jpg)带有上界边界的通配符\n\n直观地说，带有上界边界的通配符允许写入泛对象，而带有下界边界的通配符允许从泛对象读取。\n\
  \n这是上界边界的另一种用法。`Comparable` 接口本身就是一个泛型类型。定义如下：\n\n```\npublic interface Comparable<T>\n\
  {\n   public compareTo(T other);\n}\n```\n\n在这里，类型变量指示了 `other` 参数的类型。例如，`String`\
  \ 类实现了 `Comparable<String>`，它的 `compareTo` 方法定义为\n\n```java\npublic int compareTo(String\
  \ other)\n```\n\n这种显式参数类型很好。在接口泛型之前，`other` 是 `Object`，在方法的实现中需要进行强制转换。\n\n现在 `Comparable`\
  \ 是一个泛型类型，也许我们应该对 `ArrayAlg` 类中的 `minmax` 方法做得更好些？我们可以将其声明为\n\n```java\npublic static\
  \ <T extends Comparable<T>> Pair<T> minmax(T[] a)\n```\n\n这看起来比仅仅使用 `T extends Comparable`\
  \ 更详尽，并且对许多类都有效。例如，如果你计算 `String` 数组的最小值，那么 `T` 就是 `String` 类型，而 `String` 是 `Comparable<String>`\
  \ 的子类型。但在处理 `LocalDate` 对象数组时我们会遇到问题。恰好 `LocalDate` 实现了 `ChronoLocalDate`，而 `ChronoLocalDate`\
  \ 扩展了 `Comparable<ChronoLocalDate>`。因此，`LocalDate` 实现了 `Comparable<ChronoLocalDate>`\
  \ 而不是 `Comparable<LocalDate>`。\n\n在这种情况下，上界提供了拯救：\n\n```\npublic static <T extends\
  \ Comparable<? super T>> Pair<T> minmax(T[] a)\n```\n\n现在 `compareTo` 方法的形式为\n\n\
  ```\nint compareTo(? super T)\n```\n\n也许它被定义为接收一个类型为 `T` 的对象，或者（例如当 `T` 是 `LocalDate`\
  \ 时）接收 `T` 的上类型。无论如何，将类型为 `T` 的对象传递给 `compareTo` 方法都是安全的。\n\n\n\n\n对于初学者来说，一个像 `<T\
  \ extends Comparable<? super T>>` 这样的声明看起来读起来一定令人生畏。这很遗憾的，因为该声明的意图是通过消除对调用参数的不必要限制，来帮助应用程序程序员。对泛型不感兴趣的应用程序程序员可能会很快学会忽略这些声明，并理所当然地认为库程序员会做正确的事。如果你是一个库程序员，那么你将需要习惯通配符（wildcards），否则你的用户将诅咒你，并在代码中随处进行随机强制类型转换，直到编译通过为止。\n\
  \n上界边界（supertype bounds）的另一个常用处是函数式接口的参数类型。例如，`Collection` 接口有一个方法：\n\n```\ndefault\
  \ boolean removeIf(Predicate<? super E> filter)\n```\n\n该方法移除所有符合给定谓词的元素。例如，如果你讨厌哈希码为奇数的员工，可以这样删除他们：\n\
  \n```\nArrayList<Employee> staff = . . .\nPredicate<Object> oddHashCode = obj ->\
  \ obj.hashCode() %2 != 0;\nstaff.removeIf(oddHashCode);\n```\n\n你希望能够传递一个 `Predicate<Object>`，而不仅仅是\
  \ `Predicate<Employee>`。`super` 通配符使得这成为可能。\n\n### 无界通配符\n\n你甚至可以使用没有任何边界限制的通配符——例如\
  \ `Pair<?>`。从表面上看，它与原始类型（raw type）完全相同。实际上，这些类型是不同的。`Pair<?>` 类型具有如下方法：\n\n```\n\
  ? getFirst()\nvoid setFirst(?)\n```\n\n`getFirst` 的返回值只能赋值给 `Object`。`setFirst`\
  \ 方法即使使用 `Object` 也永远无法调用。这就是 `Pair<?>` 和 `Pair` 之间的本质区别：你可以用任何 `Object` 调用原始 `Pair`\
  \ 的 `setFirst` 方法。\n\n你可以调用 `setFirst(null)`。你为什么需要这种类型？它对于非常简单的操作非常有用。例如，以下方法测试\
  \ pair 是否包含 `null` 引用：\n\n```\npublic static boolean hasNulls(Pair<?> p)\n{\n  \
  \ return p.getFirst() == null || p.getSecond() == null;\n}\n```\n\n通过将 `hasNulls`\
  \ 转换为泛型方法，可以避免通配符类型：\n\n```\npublic static <T> boolean hasNulls(Pair<T> p)\n```\n\
  \n然而，带通配符的版本似乎更易读。\n\n### 通配符捕捉\n\n让我们写一个交换 pair 元素的方法：\n\n```\npublic static void\
  \ swap(Pair<?> p)\n```\n\n通配符不是类型，因此我们无法编写使用 `?` 作为类型的代码。换句话说，以下代码是非法的：\n\n```\n\
  ? t = p.getFirst(); // ERROR\np.setFirst(p.getSecond());\n```\n\n这是一个问题，因为我们在交换时需要临时持有第一个元素。幸运的是，这个问题有一个解决方法。我们可以这样写辅助方法\
  \ `swapHelper`：\n\n```\npublic static <T> void swapHelper(Pair<T> p)\n{\n   T t\
  \ = p.getFirst();\n   p.setFirst(p.getSecond());\n   p.setSecond(t\n```\n\n注意 `swapHelper`\
  \ 是一个泛型方法，而 `swap` 不是——它有一个固定的 `Pair<?>` 参数。现在我们可以从 `swap` 中调用 `swapHelper`：\n\n\
  ```\npublic static void swap(Pair<?> p) { swapHelper(p); }\n```\n\n在这种情况下，`swapHelper`\
  \ 方法的参数 `T` 捕捉了通配符。虽然通配符代表什么类型，但它是一个特定的类型，当 `T` 代表该类型时，`<T>swapHelper` 是合理的。当然，在这种情况下，我们并没有被迫使用通配符。我们可以直接实现\
  \ `<T> void swap(Pair<T> p)` 为泛型方法。然而，考虑这个通配符类型自然出现在计算中间的示例：\n\n```\npublic static\
  \ void maxminBonus(Manager[] a, Pair<? super Manager> result)\n{\n   minmaxBonus(a,\
  \ result);\n   PairAlg.swapHelper(result); // OK—swapHelper captures wildcard type\n\
  }\n```\n\n在这里，通配符捕捉机制是避免的。\n\n通配符捕捉只在非常有限的情况下合法。编译器必须能够保证通配符代表一个特定的类型。例如，`ArrayList<Pair<T>>`\
  \ 中的 `T` 永远无法捕捉 `ArrayList<Pair<?>>` 中的通配符。列表可能持有两个 `Pair<?>`，每个 `?` 的类型都不同。Listing\
  \ 8.3 中的测试程序汇总了前面章节讨论的各种方法，以便你在上下文中查看它们。\n\n`pair3/PairTest3.java`\n\n```\npackage\
  \ pair3;\n\n/**\n * @version 1.01 2012-01-26\n * @author Cay Horstmann\n */\npublic\
  \ class PairTest3\n{\n   public static void main(String[] args)\n   {\n      var\
  \ ceo = new Manager(\"Gus Greedy\", 800000, 2003, 12, 15);\n      var cfo = new\
  \ Manager(\"Sid Sneaky\", 600000, 2003, 12, 15);\n      var buddies = new Pair<Manager>(ceo,\
  \ cfo);      \n      printBuddies(buddies);\n\n      ceo.setBonus(1000000);\n  \
  \    cfo.setBonus(500000);\n      Manager[] managers = { ceo, cfo };\n\n      var\
  \ result = new Pair<Employee>();\n      minmaxBonus(managers, result);\n      System.out.println(\"\
  first: \" + result.getFirst().getName() \n         + \", second: \" + result.getSecond().getName());\n\
  \      maxminBonus(managers, result);\n      System.out.println(\"first: \" + result.getFirst().getName()\
  \ \n         + \", second: \" + result.getSecond().getName());\n   }\n\n   public\
  \ static void printBuddies(Pair<? extends Employee> p)\n   {\n      Employee first\
  \ = p.getFirst();\n      Employee second = p.getSecond();\n      System.out.println(first.getName()\
  \ + \" and \" + second.getName() + \" are buddies.\");\n   }\n\n   public static\
  \ void minmaxBonus(Manager[] a, Pair<? super Manager> result)\n   {\n      if (a.length\
  \ == 0) return;\n      Manager min = a[0];\n      Manager max = a[0];\n      for\
  \ (int i = 1; i < a.length; i++)\n      {\n         if (a[i].getBonus() > min.getBonus())\
  \ min = a[i];\n         if (a[i].getBonus() < max.getBonus()) max = a[i];\n    \
  \  }\n      result.setFirst(min);\n      result.setSecond(max);\n   }\n}\n\nclass\
  \ PairAlg\n{\n   public static boolean hasNulls(Pair<?> p)\n   {\n      return p.getFirst()\
  \ == null || p.getSecond() == null;\n   }\n\n   public static void swap(Pair<?>\
  \ p) { swapHelper(p); }\n\n   public static <T> void swapHelper(Pair<T> p)\n   {\n\
  \      T t = p.getFirst();\n      p.setFirst(p.getSecond());\n      p.setSecond(t);\n\
  \   }\n}\n```\n\n## 限制\n\n在接下来的章节中，我将讨论在使用 Java 泛型时需要考虑的许多限制。这些限制大部分是类型擦除的结果。\n\n\
  ### 类型参数不能用基本类型实例化\n\n你不能用基本类型替换类型参数。因此，没有 `Pair<double>`，只有 `Pair<Double>`。原因是类型擦除。在擦除后，`Pair`\
  \ 类拥有类型为 `Object` 的字段，你无法用它们来存储 `double` 值。\n\n这确实是一个令人恼的问题，但它与 Java 语言中基本类型的独立地位是一致的。这并不是一个致命缺陷——只有八种基本类型，当包装类型不是可替代品时，你可以使用单独的类和方法处理它们。\n\
  \n### 运行时类型查询仅适用于原始类型\n\n虚拟机中的对象始终具有特定的非泛型类型。因此，所有的类型查询只产生原始类型。例如：\n\n```\nif (a\
  \ instanceof Pair<String>) // ERROR\n```\n\n只能测试 `a` 是否为任何类型的 `Pair`。同样的情况也适用于：\n\
  \n```\nif (a instanceof Pair<T>) // ERROR\n```\n\n或者强制转换：\n\n```\nPair<String> p\
  \ = (Pair<String>) a; // warning--can only test that a is a Pair\n```\n\n\n\n\n\
  为了提醒你注意风险，当你尝试查询对象是否属于某个泛型类型时，将得到编译器错误（使用 `instanceof`）或警告（使用强制类型转换）。\n\n同样地，`getClass()`\
  \ 方法始终返回原始类型。例如：\n\n```\nPair<String> stringPair = . . .;\nPair<Employee> employeePair\
  \ = . . .;\nif (stringPair.getClass() == employeePair.getClass()) //它们是相等的\n```\n\
  \n比较结果为 `true`，因为两次 `getClass()` 的调用都返回 `Pair.class`。\n\n### 你不能创建泛化类型的数组\n\n你不能实例化泛化类型的数组，例如：\n\
  \n```\nvar table = new Pair<String>[10]; // \n```\n\n这有什么问题呢？擦除后，`table` 的类型是 `Pair[]`。你可以将其转换为\
  \ `Object[]`：\n\n```\nObject[] objarray = table;\n```\n\n数组会记住它的组件类型，如果你尝试存储错误类型的元素，它会抛出\
  \ `ArrayStoreException`：\n\n```\nobjarray[0] = \"Hello\"; // --组件类型是 Pair\n```\n\
  \n但擦除使得这种机制对泛型类型失效。以下赋值：\n\n```\nobjarray[0] = new Pair<Employee>();\n```\n\n将通过数组存储检查，但仍会导致类型错误。由于这个原因，泛化类型的数组是被禁止的。\n\
  \n请注意，只有创建这些数组是被禁止的。你可以声明一个类型为 `Pair<String>[]` 的变量。但你不能用 `new Pair<String>[10]`\
  \ 来初始化它。\n\n你可以声明通配符类型的数组并对其进行强制转换：\n\n```\nvar table = (Pair<String>[]) new Pair<?>[10];\n\
  ```\n\n结果是不安全的。如果你在 `table[0]` 中存储一个 `Pair<Employee>`，然后在 `table[0].getFirst()`\
  \ 上调用 `String` 方法，你将得到 `ClassCastException`。\n\n如果你需要收集泛化类型对象，只需使用 `ArrayList`：`ArrayList<Pair<String>>`\
  \ 是安全且有效的。\n\n### 可变参数警告\n\n在上一节中，你看到 Java 不支持泛型类型的数组。在本节中，我将讨论一个相关问题：将泛型类型的实例传递给具有可变参数的方法。\n\
  \n考虑这个带有可变参数的简单方法：\n\n```\npublic static <E> void addAll(Collection<E> coll, E...\
  \ elements)\n{\n   for (E element : elements) coll.add(element);\n}\n```\n\n记住参数\
  \ `elements` 实际上是一个持有所有提供参数的数组。\n\n现在考虑这个调用：\n\n```\nCollection<Pair<String>> table\
  \ = . . .;\nPair<String> pair1 = . . .;\nPair<String> pair2 = . . .;\naddAll(table,\
  \ pair1, pair2);\n```\n\n为了调用此方法，Java 虚拟机必须创建一个 `Pair<String>` 数组，这违反了规则。然而，规则针对这种情况被放宽了，你只会在调用处得到警告，而不是错误。你可以通过在包含\
  \ `addAll` 用的方法上添加 `@SuppressWarnings(\"unchecked\")` 注解来抑制该警告。然而，对于 `addAll` 方法的调用者来说，这是一个恼人的负担。由于这个原因，在声明处还有另一个关于“可能的堆污染”的警告。\n\
  \n为了避免这两个警告，请在 `addAll` 方法本身上标记 `@SafeVarargs` 注解：\n\n```\n@SafeVarargs\npublic\
  \ static <E> void addAll(Collection<E> coll, E... elements)\n```\n\n此方法现在可以用泛型类型调用了。通过使用该注解，你承诺你的方法没有写入参数数组，并且没有将数组传递给可能执行此操作的其他人。参见下文的滥用示例。\n\
  \n`@SafeVarargs` 注解只能用于 `static`、`final` 或 `private` 的构造函数和方法。任何其他方法都可以被重写，导致该注解毫无意义。\n\
  \n你可以使用 `@SafeVarargs` 注解来破解对创建泛型数组的限制，使用此方法：\n\n```\n@SafeVarargs static <E> E[]\
  \ array(E... array) { return array; }\n```\n\n现在你可以调用：\n\n```\nPair<String>[] table\
  \ = array(pair1, pair2);\n```\n\n这看起来很方便，但隐藏着一个危险。以下代码：\n\n```\nObject[] objarray\
  \ = table;\nobjarray[0] = new Pair<Employee>();\n```\n\n将会运行而不抛出 `ArrayStoreException`，因为数组存储只检查擦除后的类型。你在处理\
  \ `table[0]` 时会在其他地方得到异常。\n\n### 泛型可变参数不会展开原始数组\n\n记住你可以将数组传递给可变参数参数。例如，考虑上一节中的\
  \ `addAll` 方法。当要添加的项恰好在数组中时，你只需传递该数组。调用行为就像元素被“展开”了一样：\n\n```\nCollection<String>\
  \ strings = . . .;\nString[] moreStrings = new String[] { \"Mary\", \"had\", \"\
  a\", \"little\", \"lamb\" };\naddAll(strings, moreStrings); // OK，等同于 addAll(strings,\
  \ \"Mary\", \"had\", \"a\", \"little\", \"lamb\")\n```\n\n当然，元素并没有实际上展开。事实上事实相反。如果逐个指定参数，它们将被收集到一个数组中，然后传递给方法。如果你提供一个数组，它会被直接传递。\n\
  \n现在考虑一个数字集合：\n\n```\nCollection<Integer> numbers = . . .;\nint[] moreNumbers =\
  \ new int[] { 1, 2, 3 };\naddAll(numbers, moreNumbers); // \n```\n\n\n\n正如你不能实例化单个泛型实例一样，你也无法实例化数组。原因有所不同——毕竟数组填充了\
  \ `null` 值，这在构造时似乎是安全的。但数组还携带有一个类型，该类型被用于在虚拟机中监控数组的存储操作。而该类型被擦除了。例如，考虑：\n\n```java\n\
  public static <T extends Comparable> T[] minmax(T... a) \n{ \n   T[] mm = new T[2];\
  \ // ERROR\n   . . . \n}\n```\n\n类型擦除会导致此方法始终构造一个 `Comparable[2]` 。\n\n如果数组仅用作类的私有实例字段，你可以将数组的元素类型声明为擦除后的类型并使用强制转换。例如，`ArrayList`\
  \ 类可以如下实现：\n\n```java\npublic class ArrayList<E>\n{\n   private Object[] elements;\n\
  \   . . .\n   @SuppressWarnings(\"unchecked\") public E get(int n) { return (E)\
  \ elements[n]; }\n   public void set(int n, E e) { elements[n] = e; } // 不需要强制转换\n\
  }\n```\n\n这种技术对于我们的 `minmax` 方法不起，因为我们返回的是一个 `T[]` 数组，如果我们对其类型上撒谎，就会导致运行时错误。假设我们实现：\n\
  \n```java\npublic static <T extends Comparable> T[] minmax(T... a)\n{\n   var result\
  \ = new Comparable[2]; // 擦除类型的数组\n   . . .\n   return (T[]) result; // 编译通过但警告\n\
  }\n```\n\n调用：\n\n```java\nString[] names = ArrayAlg.minmax(\"Tom\", \"Dick\", \"\
  Harry\");\n```\n\n编译没有任何警告。在方法返回后，当 `Comparable[]` 引用转换为 `String[]` 时会发生 `ClassCastException`。\n\
  \n在这种情况下，最好是让用户提供一个数组构造表达式：\n\n```java\nString[] names = ArrayAlg.minmax(String[]::new,\
  \ \"Tom\", \"Dick\", \"Harry\");\n```\n\n构造表达式 `String[]::new` 表示一个函数，该函数给定所需的长度，构造一个该长度的\
  \ `String` 数组。\n\n该方法使用该参数产生正确类型的数组：\n\n```java\npublic static <T extends Comparable>\
  \ T[] minmax(IntFunction<T[]> constr, T... a)\n{\n   T[] result = constr.apply(2);\n\
  \   . . .\n}\n```\n\n一种更传统的方法是使用反射并调用 `Array.newInstance`：\n\n```java\npublic static\
  \ <T extends Comparable> T[] minmax(T... a)\n{\n   var result = (T[]) Array.newInstance(a.getClass().getComponentType(),\
  \ 2);\n   . . .\n}\n```\n\n`ArrayList` 类的 `toArray` 方法就没有那么幸运了。它需要产生 `T[]` 数组，但它没有组件类型。因此，有两种变体：\n\
  \n```java\nObject[] toArray()\nT[] toArray(T[] result)\n```\n\n第二个方法接收一个数组参数。如果数组足够大，则使用。否则，将使用\
  \ `result` 的组件类型创建一个足够大小的新数组。\n\n### 类型变量在泛型类的静态文中无效\n\n你不能在静态字段或方法中引用类型变量。例如，以下巧妙的想法行不通：\n\
  \n```java\npublic class Singleton<T>\n{\n   private static T singleInstance; //\
  \ ERROR\n\n   public static T getSingleInstance() // ERROR\n   {\n      if (singleInstance\
  \ == null) 创建 T 的新实例\n      return singleInstance;\n   }\n}\n```\n\n如果这可以实现，那么程序就可以声明\
  \ `Singleton<Random>` 来共享随机数生成器，并声明 `Singleton<JFileChooser>` 来共享文件选择对话框。但这是行不通的。类型擦除后，只有一个\
  \ `Singleton` 类和一个 `singleInstance` 字段。出于这个原因，带有类型变量的静态字段和方法被直接禁止了。\n\n### 你不能抛出或捕获泛型类的实例\n\
  \n你既不能抛出也不能捕获泛型类的对象。事实上，泛型类扩展 `Throwable` 也是不法的。例如，以下定义将无法编译：\n\n```java\npublic\
  \ class Problem<T> extends Exception { /* . . . */ } \n   // ERROR--不能扩展\n```\n\n\
  *(注：我注意到你的原文中从“In this situation...”开始有一段重复/乱码的内容。我根据前半部分提供的逻辑流进行了清理。)*\n\n（注：提供的文本在中间从“In\
  \ this situation...”开始有大量的重复/损坏。我处理了唯一的逻辑部分以确保文档的高质量。）\n\n*实际上，仔细观察你的提示，文本似乎粘贴了两次，或者有两个版本合并在了一起。我将提供所唯一内容的整洁、格式化版本。*\n\
