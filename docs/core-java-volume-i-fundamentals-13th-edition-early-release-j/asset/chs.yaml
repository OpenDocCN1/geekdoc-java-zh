  \ `byte` 类型的任何无符号版本。\n\n如果你处理永远不会为负数的整数值，并且你确实需要额外的位，你可以在小心的情况下将符号整数值解释为无符号。例如，与其让一个\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。\n\n浮点类型\n\
  \n| 类型 | 存储需求 | 范围 |\n\n| --- | --- | --- |\n| `float` | 4 字节 | ±3.4028235×¹³⁸ 到\
  \ 3.4028235×¹³⁸（约 34 亿） |\n| `double` | 8 字节 | ±1.7976931348623157×10³⁰⁸ 到 1.7976931348623157×10³⁰⁸（约\
  \ 1.8×10³⁰⁸） |\n\n浮点类型\n\n使用 `float` 结尾。例如，1.79E3 等同于 179。\n\n浮点类型\n\n使用 `d` 结尾。例如，1.79d\
  \ 等同于 179。\n\n### `char` 类型\n\n\n\n\n\n`char` 类型最初设计用于描述单个字符。然而，现在已不再如此。如今，某些 Unicode\
  \ 字符可以用一个 `char` 值来描述，而另一些 Unicode 字符则两个 `char` 值。请阅读下一节以了解细节。\n\n`char` 类型的字面量用单引号括起来。例如，`'A'`\
  \ 是一个值为 65 的字符常量。它与 `\"A\"` 不同，后者是一个包含单个字符的字符串。`char` 类型的值可以表示为从 `\\u0000` 到 `\\\
  uFFFF` 的十六进制值。\n\n除了 `\\u` 转义序列外，还有几条用于特殊字符的转义序列，如表 3.3 所示。你可以在引号内的字符字面量和字符串中使用这些转义序列，例如\
  \ `'\\u005B'` 或 `\"Hello\\n\"`。`\\u` 转义序列（但其他转义序列除外）甚至可以用在引号字符常量和字符串之外。例如，\n\n```\n\
  public static void main(String\\u005B\\u005D args)\n```\n\n这是完全允许——`\\u005B` 和 `\\\
  u005D` 是 `[` 和 `]` 的编码。\n\n### 特殊字符的转义序列\n\n| 转义序列 | 名称 | Unicode 值 |\n| --- | ---\
  \ | --- |\n| `\\b` | 退格 (Backspace) | `\\u0008` |\n| `\\t` | 制表符 (Tab) | `\\u0009`\
  \ |\n| `\\n` | 换行 (Line feed) | `\\u000a` |\n| `\\r` | 回车符 (Carriage return) | `\\\
  u000d` |\n| `\\f` | 换页 (Form feed) | `\\u000c` |\n| `\\\"` | 双引号 (Double quote)\
  \ | `\\u0022` |\n| `\\'` | 单引号 (Single quote) | `\\u0027` |\n| `\\\\` | 反斜杠 (Backslash)\
  \ | `\\u005c` |\n| `\\s` | 空格 (Space)。用于文本块以保留末尾空格。 | `\\u0020` |\n| `\\``newline`\
  \ | 仅用于文本块：将此行与下一行合并 | — |\n\nUnicode 转义序列在代码解析之前会被处理。例如，`\"\\u0022+\\u0022\"` 并不是由引号包裹加号（U+0022）组成的字符串。相反，`\\\
  u0022` 在解析之前被转换为 `\"`，产生 `\"\"+\"\"`，即一个空字符串。\n\n更阴险的是，你必须警惕注释中的 `\\u`。注释\n\n```\n\
  // \\u000A is a newline\n```\n\n会导致语法错误，因为在程序读取时 `\\u000A` 会被替换为换行符。同样，注释\n\n```\n\
  // look inside c:\\users\n```\n\n会导致语法错误，因为 `\\u` 后面没有跟随四个十六进制数字。\n\nUnicode 转义序列中可以包含任意数量的\
  \ `u`：`\\u00E9` 和 `\\uuu00E9` 都表示字符 é。这种奇特现象是有原因的。考虑一个快乐地使用 Unicode 编码的程序员，由于某些古老的原因，被迫仅以\
  \ ASCII 提交代码。转换工具可以将任何大于 U+007F 的字符转换为 Unicode 转义，并为每个现有的 Unicode 转义添加一个 `u`。这使得转换是可逆的。例如，`\\\
  uD800 é` 转换为 `\\uuD800 \\u00E9`，可以转换回 `\\uD800 é`。\n\n### Unicode 与 char 类型\n\n\
  为了完全理解 `char` 类型，你必须了解 Unicode 编码方案。在 Unicode 之前有许多不同的字符编码标准：美国的 ASCII、西欧语言的 ISO\
  \ 8859-1、俄语的 KOI-8、中文的 GB18030 和 BIG-5 等。这导致了两个问题：首先，特定的代码在不同的编码方案中对应不同的字母。其次，字符集语言的编码长度是变化的：某些常用字符被编码为单字节，而另一些需要两个或多个字节。\n\
  \nUnicode 的设计是为了解决这两个问题。当统一工作在 20 世纪 80 年代开始时，固定的 2 字节代码已足以编码世界上所有语言使用的所有字符，并留有空间供未来扩展——至少当时的人们是这么想的。1991\
  \ 年，Unicode 1.0 发布，使用了可用 65,536 个代码值中略于一半的数量。Java 从一开始设计为使用 16 位 Unicode 字符，这对于使用\
  \ 8 位字符的其他编程语言来说是一个巨大的进步。\n\n遗憾的是，随着时间的推移，不可避免的事情发生了。Unicode 字符数量超过了 65,536，这主要是由于增加了大量用于中、日、韩的汉字。现在，16\
  \  `char` 类型不足以描述所有的 Unicode 字符。\n\n我们需要一些术语来解释 Java 是如何解决这个问题的。*码点*（code point）是与编码方案中的字符关联的整数值。在\
  \ Unicode 标准中，码点以十六进制形式表示并带有 U+ 前缀，例如拉丁字母 A 的码点是 U+0041。Unicode 码点被分成不同的平面（planes）。基本多语言平面包含\
  \ U+0000 到 U+FFFF。补充字符范围从 U+10000 到 U+10FFFF。在 Java 中，这些字符由两个 `char` 值表示，称为代理对（surrogates）。第一个代理范围从\
  \ `\\uD800` 到 `\\uDBFF`，第二个代理范围从 `\\uDC00` 到 `\\uDFFF`。\n\n\n\n\n\n### `boolean`\
  \ 类型\n\n`boolean` 类型有两个值：`false` 和 `true`。它用于评估逻辑条件。你不能在整数和 `boolean` 值之间进行转换。\n\
  \n在 C++ 中，数字甚至指针可以用来代替 `boolean` 值。值 `0` 等于 `bool` 值 `false`，而非零值则等于 `true`。这在 Java\
  \ 中是*不是*这种情况的。因此，Java 程序员被避免了诸此类意外，例如：\n\n```\nif (x = 0) // 哎……本想写 x == 0\n```\n\
  \n在 C++ 中，这个测试可以编译并运行，且结果始终为 `false`。在 Java 中，该测试无法编译，因为整数表达式 `x = 0` 无法转换为 `boolean`\
  \ 值。\n\n## 变量与常量\n\n与所有编程语言一样，变量被用于存储值。常量是指值不会改变的变量。在后续章节中，你将学习如何声明变量和常量。\n\n###\
  \ 声明变量\n\n在 Java 中，每个变量都有一个 `type`（类型）。你通过先放置类型、后跟变量名来声明变量。这里是一些示例：\n\n```\ndouble\
  \ salary;\nint vacationDays;\nlong earthPopulation;\nboolean done;\n```\n\n注意每个声明末尾的分号。分号是必要的，因为声明是一个完整的\
  \ Java 语句，必须以分号结束。\n\n变量名（以及其他名称）的标识符由字母、数字、货币符号和“标点连接符”组成。第 1 个字符不能是数字。\n\n像 `'+'`\
  \ 或 `'©'` 这样的符号不能在变量名中使用，空格也不行。字母大小写敏感：`main` 和 `Main` 是不同的标识符。标识符的长度本质上是没有限制的。\n\
  \n“字母”、“数字”和“货币符号”这些术语在 Java 中比大多数语言要宽泛得多。字母是*任何*表示语言中字母的 Unicode 字符。例如，德国用户可以在变量名中使用如\
  \ `ä` 等变音符号；希腊语使用者可以使用 `π`。同样，数字是 `0`–`9` 以及*任何*表示数字的 Unicode 字符。货币符号包括 `$`、`€`、`¥`\
  \ 等。标点连接符包括下划线字符 `_`、波浪低线 `﹏` 以及其他几个。在实践中，大多数程序员习惯使用 `A`-`Z`、`a`-`z`、`0`-`9` 和下划线\
  \ `_`。\n\n如果你真的好奇哪些 Unicode 字符可以用于标识符，可以使用 `Character` 类中的 `isJavaIdentifierStart`\
  \ 和 `isJavaIdentifierPart` 方法进行检查。\n\n尽管 `$` 是标识符中的有效字符，你不应该在自己的代码中使用它。它旨在用于由 Java\
  \ 编译器和其他工具生成的名称。\n\n你不能将如 `class` 等 Java 关键字作为变量名。\n\n下划线可以是标识符的一部分。这在常量名中很常见，例如\
  \ `Double.POSITIVE_INFINITY`。然而，单个下划线 `_` 是保留字。\n\n从 Java 21 开始，单个下划线 `_` 表示一个语法上需要但从未使用使用的变量。你将在第\
  \ 6 章和第 7 章看到示例。\n\n你可以在同一行上声明多个变量：\n\n```\nint i, j; // 都是整数\n```\n\n我不推荐这种风格。如果你单独声明每个变量，你的程序会更易读。\n\
  \n正如你所看到的，名称对大小写敏感，例如 `hireday` 和 `hireDay` 是两个独立的名称。通常情况下，你不应该拥有仅字母大小写不同的名称。然而，有时为变量起一个好名字是很的。许多程序员会给变量起与类型相同的名称，例如：\n\
  \n```\nBox box; // \"Box\" 是类型\"box\" 是变量名\n```\n\n其他程序员倾向于为变量使用“a”前缀：\n\n```\n\
  Box aBox;\n```\n\n### 初始化变量\n\n声明变量后，你必须通过赋值语句显式地初始化它——你永远无法使用未初始化变量的值。例如，Java 编译器会将以下语句序列标记为错误：\n\
  \n```\nint vacationDays;\nSystem.out.println(vacationDays); // 错误--变量未初始化\n```\n\
  \n你通过在左侧使用变量名、等号（`=`）以及右侧带有适当值的 Java 表达式来给之前声明的变量赋值。\n\n```\nint vacationDays;\n\
  vacationDays = 12;\n```\n\n你可以在同一行上声明并初始化变量。例如：\n\n```\nint vacationDays = 12;\n\
  ```\n\n最后，在 Java 中，你可以在代码的任何地方放置声明。例如，以下是 Java 中有效的代码：\n\n```\ndouble salary = 65000.0;\n\
  System.out.println(salary);\nint vacationDays = 12; // 在这里声明变量是允许的\n```\n\n在 Java\
  \ 中，将变量声明在尽可能靠近第一次使用它们的地方被认为是良好的风格。\n\n如果可以从初始值推断出类型，则不需要声明局部变量的类型。只需使用 `var` 关键字代替类型即可：\n\
  \n```\nvar vacationDays = 12; // vacationDays 是一个 int\nvar greeting = \"Hello\"\
  ; // greeting 是一个 String\n```\n\n这对于数字和字符串类型不是太重要，但正如你将在下一章中看到的，这一功能可以让对象的声明更加简洁。\n\
  \n### 常量\n\n在 Java 中，将变量声明在尽可能靠近第一次使用它们的地方被认为是良好的风格。如果可以从初始值推断出类型，则不需要声明局部变量的类型。只需使用\
