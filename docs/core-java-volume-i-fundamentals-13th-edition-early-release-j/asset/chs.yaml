  \n\n\n\n\n\n\n\n\n\n# 前言\n\n## 读者\n\n1995 年底，Java 编程语言席卷互联网，并迅速走红。Java 技术的承诺是将成为连接用户与信息的通用胶水，无论信息来自何处——服务器、数据库、信息提供者或任何想象中的来源。事实上，Java\
  \ 正处于实现这一承诺的地位。它是一种工程精密的语言，获得了广泛认可。其内置的安全特性让程序员和用户都感到放心。Java 内置支持高级编程任务，如网络编程、数据库连接和并发。\n\
  \n自 1995 年以来，Java 开发工具包已发布了二十多个版本。应用程序接口（API）从数百类增长到 4000 多个类。你正在阅读这本书是《核心 Java》第十三版的卷。每个版本都紧随\
  \ Java 开发工具包的发布，每次我都会重写这本书以利用最新的 Java 特。本版反映了 Java 21 的特性。\n\n与之前的版本一样，本书仍然针对希望将\
  \ Java 用于实际项目的严肃程序员。我假设你（读者）是一位在 Java 以外的编程语言方面有坚实背景的程序员。我假设你不喜欢玩具示例的书籍（例如烤面包机、动物园或“紧张的文字”）。你会在书中找不到这些内容。我的目标是让你能够充分理解\
  \ Java 语言及其向你提供的所有功能。在本卷中，你将详细学习：\n\n*   面向对象编程\n*   反射和代理\n*   接口和内部类\n*   异常处理\n\
  *   泛型编程\n*   集合框架\n*   并发\n*   注解\n*   Java 平台模块系统\n\n\n\n\n\n随着 Java 类库的爆炸式增长，想要在一卷书中涵盖所有资深程序员需要了解的所有\
  \ Java 特性简直是不可能的。因此，本书被分为两卷。第一卷侧重于 Java 语言的基础概念。第二卷 `Core Java, Volume II: Advanced\
  \ Features` 则更深入地探讨了最重要的库。\n\n在过去的十二个版本中，用户界面编程一直被认为是基础性的，但现在是时候承认它不再是了，并将其移动到第二卷中。该卷包含了对以下主题的详细讨论：\n\
  \n*   Stream API\n*   文件处理与正则表达式\n*   数据库\n*   XML 处理\n*   脚本与编译 API\n*   国际化\n\
  *   网络编程\n*   图形化用户界面设计\n*   图形化编程\n*   原生方法\n\n在编写书籍时，错误和不准确之处是不可避免的。我非常想了解这些错误。但当然，我希望每个错误只被发现一次。你可以在\
  \ [`horstmann.com/corejava`](https://horstmann.com/corejava) 找到常见问题和错误修复列表。在勘误页的末尾策略性地放置了一个表单（为了鼓励你先阅读它），你可以用它报告错误并提出建议。如果我没有回答每一个问题或没有立即回复你，请不要失望。我会阅读每一封邮件，并感谢你的投入，这将使本书的未来版本变得更加清晰、信息更加丰富。\n\
  \n## 本书简介\n\n`第 1 章` 概述了 Java 区别于其他编程语言的能力。本章解释了该语言设计者想要实现的目标以及他们在多大程度上取得了成功。随后是\
  \ Java 的简短历史，详细介绍了 Java 如何诞生以及如何演变。\n\n在 `第 2 章` 中，你将看到如何下载和安装 JDK 以及本书的程序示例。然后，我将引导你编译并运行控制台应用程序和图形应用程序。你将看到如何使用原生\
  \ JDK、Java IDE 以及 `JShell` 工具。\n\n`第 3 章` 开始对 Java 语言的讨论。在本章中，我涵盖了基础知识：变量、循环和简单函数。如果你是\
  \ C 或 C++ 程序员，这部分会一帆风顺，因为这些语言特性的语法与 C 语言基本相同。如果你来自非 C 背景（如 Visual Basic），你将希望仔细阅读这一章。\n\
  \n面向对象编程（OOP）现在是编程实践的主流，而 Java 是一门面向对象的编程语言。`第 4 章` 引入了封装，这是面向对象的两个基本构建块中的第一个，以及\
  \ Java 语言实现它的机制——即类和方法。除了 Java 语言的规则外，你还会发现关于健壮 OOP 设计的建议。最后，我涵盖了神奇的 `javadoc` 工具，它可以将你的代码注释格式化为一组超链接网页。如果你熟悉\
  \ C++，可以快速快速浏览本章。来自非面向对象背景的程序员应该准备好在进一步学习 Java 之前花一些时间来掌握 OOP 概念。\n\n类和封装只是 OOP\
  \ 故事的一部分，`第 5 章` 引入了另一部分——即 `继承`。继承允许你获取一个现有类并根据需要对其进行修改。这是 Java 编程的一项基本技术。Java\
  \ 中的继承机制与 C++ 非常相似。再次，C++ 程序员可以关注语言之间的差异。\n\n`第 6 章` 展示了如何使用 Java 的 `interface`（接口）概念。接口允许你超越\
  \ `第 5 章` 中简单的继承模型。掌握接口允许你能够充分利用 Java 完全面向对象的编程方法的力量。在涵盖接口之后，我转向了 `lambda 表达式`，这是一种可以在以后某个时间执行的代码块的简洁表达方式。然后我解释了\
  \ Java 的一个有用技术特性：`inner classes`（内部类）。\n\n`第 7 章` 讨论了 `异常处理`——Java 处理“好程序可能发生坏事”的健壮机制。异常为你提供了一种高效的方法，将正常处理代码与错误处理分离。当然，即使在处理了所有异常情况并强化了程序后，它可能仍然按照预期运行。然后本章转向日志记录。在本章的最后部分，我提供了一些实用的调试技巧。\n\
  \n`第 8 章` 概述了泛型编程。泛型编程让你的程序更易读、更安全。我向你展示如何使用强类型并消除难看且不安全的强制转换，以及如何处理因需要与旧版本 Java\
  \ 兼容而产生的复杂。\n\n`第 9 章` 涵盖了并发，它允许你编写并行任务。在处理器具有多个核心且你希望保持其繁忙的时代，这是 Java 技术的一项重要且令人兴奋的应用。\n\
  \n在 `第 11 章` 中，你将学习注解，它允许你向 Java 程序添加任意信息（有时称为元数据）。我们向你展示了注解处理器如何在源代码或类文件级别获取这些注解，以及如何使用注解在运行时影响类的行为。注解只有配合工具时才有用，我们希望我们的讨论能帮助你根据需求选择注解处理工具。\n\
  \n`第 12 章`，你将学习 Java 平台模块系统，它促进了 Java 平台和核心库的有序演进。该模块系统为包提供了封装，并提供了描述模块要求的机制。你将学习模块的属性以便在自己的应用程序中使用它们。即使你决定不使用，你也需要了解新规则以便与\
  \ Java 平台和其他模块化库交互。\n\n**附录** 列出了 Java 语言的关键字。\n\n## 惯例\n\n与许多计算机书籍一样，我使用`等宽字体`来表示计算机代码。\n\
