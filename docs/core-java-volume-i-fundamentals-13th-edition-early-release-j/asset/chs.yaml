  );\n}\n```\n\n## 示例代码\n\n本书的网站 [`horstmann.com/corejava`](https://horstmann.com/corejava)\
  \ 包含了书中所有的示例代码。请参见第 2 章 获取有关安装 Java 开发包和示例代码的更多信息。\n\n# 致谢\n\n写一本书总是一项巨大的工程，而重写它似乎并没有容易多少，特别是考虑到\
