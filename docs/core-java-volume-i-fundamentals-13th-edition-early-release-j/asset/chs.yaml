  返回键在范围内的元素的映射视图。`boolean` 标志决定是否包含边界。\n\n`java.util.SequencedCollection<E>` 21\n\
  * `SequencedCollection<E> reversed()`\n产生一个反序的集合视图。\n\n`java.util.SequencedSet<E>`\
  \ 21\n* `SequencedSet<E> reversed()`\n产生一个反序的集合视图。\n\n`java.util.SequencedMap<E>`\
  \ 21\n* `SequencedMap<E> reversed()`\n产生一个反序的集合视图。\n\n\n\n\n计算机领域的老兵们有时会怀念过去他们如何使用打卡片，并必须手动编写排序算法。如今，当然，排序算法已成为大多数编程语言标准库的一部分，Java\
  \ 编程语言也不例外。\n\n`Collections` 类中的 `sort` 方法对实现了 `List` 接口的集合进行排序。\n\n```\nvar staff\
  \ = new ArrayList<String>();\nfill collection\nCollections.sort(staff);\n```\n\n\
  该方法假设列表元素实现了 `Comparable` 接口。如果你想以其他方式排序列表，可以使用 `List` 接口的 `sort` 方法并传递一个 `Comparator`\
  \ 对象。以下是如何按工资对员工列表进行排序的方法：\n\n```\nCollections.sort(staff, Comparator.comparingDouble(Employee::getSalary));\n\
  ```\n\n如果你想按降序排序列表，可以使用静态便利方法 `Comparator.reverseOrder()`。它返回一个执行 `b.compareTo(a)`\
  \ 的比较器。例如，\n\n```\nCollections.sort(staff, Comparator.reverseOrder());\n```\n\n\
  根据元素类型通过 `compareTo` 方法提供的顺序，对列表 `staff` 中的元素进行逆序排序。同样地，\n\n```\nCollections.sort(staff,\
  \ Comparator.comparingDouble(Employee::getSalary).reversed());\n```\n\n按工资降序排序。\n\
  \n你可能会好奇 `sort` 方法是如何对列表排序的。通常当你在算法书上看到排序算法时，它是针对数组提出的，并使用随机元素访问。然而，链表中的随机访问是低效的。你实际上可以使用归并排序的形式高效地对链表进行排序。但是\
  \ Java 编程语言中的实现并没有这样做。它只是将所有元素倒入数组，对数组进行排序，然后将排序后的序列复制回列表。\n\nJava 集合框架中使用的排序算法比\
  \ `QuickSort` 慢一点，后者是通用排序算法的传统选择。然而，它有一个主要优势：它是**稳定**的，也就是说，它不会交换相等元素。为什么要关心相等元素的顺序呢？这里有一个常见的场景：假设你有一个已经按名称排序的员工列表。现在你按工资排序。工资相同的员工会发生什么变化？使用稳定排序，按名称排序的顺序会被保留。换句话说，结果是一个先按工资排序、再按名称排序的列表。\n\
  \n集合不需要实现所有的“可选”方法，因此所有带有集合参数的方法都必须描述何时将集合传递给算法是安全的。例如，你显然不能将 `unmodifiableList`\
  \ 列表传递给 `sort` 算法。你可以传递什么类型的列表？根据文档，列表必须是可修改的，但不需要可调整大小。\n\n术语定义如下：\n\n*   如果列表支持\
  \ `set` 方法，则认为它是可修改的。\n*   如果列表支持 `add` 和 `remove` 操作，则认为它是可调整大小的\n\n在第 6 章 中，你已经见过\
  \ `Arrays.sort` 方法。有两个版本，一个用于对 `Comparable` 实例数组排序，另一个是带有比较器的版本：\n\n```\nString[]\
  \ staff = . . .;\nArrays.sort(staff);\nArrays.sort(staff, Comparator.comparingDouble(Employee::getSalary));\n\
  ```\n\n`Collections` 类有一个 `shuffle` 算法，它是排序的相反操作——它随机打乱列表中元素的顺序。例如：\n\n```\nArrayList<Card>\
  \ cards = . . .;\nCollections.shuffle(cards, RandomGenerator.getDefault());\n```\n\
  \n如果你提供的列表没有实现 `RandomAccess` 接口，`shuffle` 方法会将元素复制到数组中，打乱数组，然后将打乱后的元素复制回列表。\n\n\
  Listing9.7 中的程序填充了一个包含 1 到 49 数字的 `Integer` 对象的数组列表。然后它随机打乱列表，并从打乱的列表中选择前六个值。最后，它对选中的值进行排序并打印它们。\n\
  \n`shuffle/ShuffleTest.java`\n\n```\npackage shuffle;\n\nimport java.util.*;\nimport\
  \ java.util.random.*;\n\n/**\n * 此程序演示了随机洗牌和排序算法。\n * @version 1.13 2023-09-30\n\
  \ * @author Cay Horstmann\n */\npublic class ShuffleTest\n{\n   public static void\
  \ main(String[] args)\n   {\n      var numbers = new ArrayList<Integer>();\n   \
  \   for (int i = 1; i <= 49; i++)\n         numbers.add(i);\n      Collections.shuffle(numbers,\
  \ RandomGenerator.getDefault());\n      List<Integer> winningCombination = numbers.subList(0,\
  \ 6);\n      Collections.sort(winningCombination);\n      System.out.println(winningCombination);\n\
  \   }\n}\n```\n\n`java.util.Collections` 1.2\n\n*   `static <T extends Comparable<?\
  \ super T>> void sort(List<T> elements)`\n  使用稳定排序算法对列表元素进行排序。该算法保证运行时间在 O(`n` log\
  \ `n`) 以内，其中 `n` 是列表的长度。\n*   `static void shuffle(List<?> elements)`\n*   `static\
  \ void shuffle(List<?> elements, Random r)`\n*   `static void shuffle(List<?> elements,\
  \ RandomGenerator r)` 21\n  随机打乱列表中的元素。\n\n### 二分查找\n\n要在数组中查找对象，通常会遍历所有元素直到找到匹配项。然而，如果数组是排序过的，你可以查看中间元素并检查它是否大于要查找的元素。如果是，则在前半部分查找；否则在后半部分查找。这使得问题减半，你以相同的方式继续。例如，如果数组有\
  \ 1024 个元素，你可以在 10 步内定位匹配项（或确认不存在），而线性查找则不然。\n\n`Collections` 类的 `binarySearch`\
  \ 实现了这种算法。提供集合（必须实现 `List` 接口）和要查找的目标。如果集合不是通过 `Comparable` 接口排序的，还要提供一个比较器对象。\n\
  \n```\ni = Collections.binarySearch(elements, target);\ni = Collections.binarySearch(elements,\
  \ target, comparator);\n```\n\n`binarySearch` 方法的非负返回值表示匹配对象的索引。即 `elements.get(i)`\
  \ 在比较顺序下等于 `target`。如果值为负，则表示没有匹配元素。然而，你可以使用返回值计算出应该将 `target` 插入集合的位置以保持其排序。插入位置是：\n\
  \n```\ninsertionPoint = -i - 1;\n```\n\n并不是简单的 `-i`，因为那样值 `0` 将产生歧义。换句话说，操作\n\n\
  ```\nif (i < 0)\n   elements.add(-i - 1, target);\n```\n\n会将目标添加到正确的位置。\n\n为了有意义，二分查找需要随机访问。如果你必须逐个遍历链表的一半来找到中间元素，你就失去了二分查找的优势。如果你给出一个没有实现\
  \ `RandomAccess` 接口的列表，`binarySearch` 算法将退回到与线性查找效率相同的迭代算法。\n\n\n\n\n`Arrays` 类为原始类型数组和对象数组提供了二分查找实现。\n\
  \n`java.util.Collections` 1.2\n\n*   `static <T extends Comparable<? super T>> int\
  \ binarySearch(List<T> elements, T key)`\n*   `static <T> int binarySearch(List<T>\
  \ elements, T key, Comparator<? super T> c)`\n\n    在排序后的列表中查找键。如果元素类型实现了 `RandomAccess`\
  \ 接口，则使用二分查找；在所有其他情况下，则使用线性查找。这些方法保证在 O(`a`(`n`) log `n`) 时间内运行，其中 `n` 是列表的长度，`a`(`n`)）是访问一个元素的平均时间。这些方法返回键在列表中的索引，或者如果键不在在列表中，则返回负值\
  \ `i`。在这种情况下，键应该被插入到索引 `-i - 1` 处以保持列表排序。\n\n`java.util.Arrays` 1.2\n\n*   `static\
  \ int binarySearch(T[] a, T key)`\n*   `static int binarySearch(T[] a, int start,\
  \ int end, T key)` 6\n\n    使用二分查找算法在排序后的数组 `a` 中查找键。如果找到键，则返回其索引。否则，返回一个负值 `r`；–`r`–1\
  \ 是 `key` 应该插入的位置以保持 `a` 排序。数组的组件类型 `T` 可以是 `Object`、`int`、`long`、`short`、`char`、`byte`、`boolean`、`float`\
  \ 或 `double`。\n*   `static <T> T binarySearch(T[] a, T key, Comparator<? super T>\
  \ c)`\n*   `static <T> T binarySearch(T[] a, int start, int end, T key, Comparator<?>\
  \ c)` 6\n\n    使用二分查找算法在使用给定比较器排序的数组 `a` 中查找键。\n\n### 简单算法\n\n`Collections` 类包含了几个简单但实用的算法。其中包含了本节开头的示例——找到集合的最大值。其他的还包括将元素从一个列表复制到另一个列表、用常量值填充容器以及反转列表。\n\
  \n为什么要在框架中提供这些简单的算法呢？毫无疑问，大多数程序员都可以用简单的循环轻松实现它们。我喜欢这些算法，是因为它们让*阅读*代码的程序员的生活变得更轻松。当你阅读一个由他人实现的循环时，你必须破解原始程序员的意图。例如，看这个循环：\n\
  \n```\nfor (int i = 0; i < words.size(); i++)\n   if (words.get(i).equals(\"C++\"\
  )) words.set(i, \"Java\");\n```\n\n现在将该循环与调用对比：\n\n```\nCollections.replaceAll(words,\
  \ \"C++\", \"Java\");\n```\n\n当你看到这个方法调用时，你立刻知道代码在做什么。\n\n本节末尾的 API 注释描述了 `Collections`\
  \ 类中的简单算法。\n\n默认方法 `Collection.removeIf` 和 `List.replaceAll` 稍微复杂一点。你提供一个 lambda\
  \ 表达式来测试或转换元素。例如，在这里我们移除所有的短单词，并将剩余的转换为小写：\n\n```\nwords.removeIf(w -> w.length()\
  \ <= 3);\nwords.replaceAll(String::toLowerCase);\n```\n\n`removeIf` 的谓词应该只查看正在决定删除的元素，而不是整个集合。如果你采取后者，其行为将取决于实现。\n\
  \n`ArrayList` 版本的 `removeIf` 方法对元素进行两次遍历。它首先找到应该删除的元素，然后删除所有这些元素。对于其他集合，匹配的元素一经发现就会被移除。\n\
  \n如果谓词读取了集合，就会产生区别。考虑这个例子，`words` 是一个长度为 3 的 `ArrayList`：\n\n```\nvar words = new\
  \ ArrayList<String>(List.of(\"Ada\", \"C++\", \"Java\"))\nwords.removeIf(w -> w.length()\
  \ == words.size()); // 现在 words 是 [\"Java\"]\n```\n\n在第一次遍历中，所有长度为 3 的单词都被标记为删除，在第二次遍历中，它们被删除了。\n\
  \n然而，如果 `words` 是 `LinkedList` 或 `HashSet`，那么相同的 `removeIf` 调用只会移除三个字母单词之一。在移除后，谓词会测试集合的大小是否为\
  \ 2。\n\n为什么会有这种差异？简单的的一次遍历实现对于基于数组的集合来说是无效的。开发者们并没有立即想到存在一种高效的一次遍历算法。当他们考虑到它时，为了兼容性考虑，他们决定不使用它——参见\
  \ `https://bugs.openjdk.org/browse/JDK-8143577`。\n\n`java.util.Collections` 1.2\n\
  \n*   `static <T extends Comparable<? super T>> T min(Collection<T> elements)`\n\
  *   `static <T extends Comparable<? super T>> T max(Collection<T> elements)`\n*\
  \   `static <T> min(Collection<T> elements, Comparator<? super T> c)`\n*   `static\
  \ <T> max(Collection<T> elements, Comparator<? super T> c)`\n\n    返回集合中最小或最大的元素。（参数边界已简化。）\n\
  *   `static <T> void copy(List<? super T> to, List<T> from)`\n\n    将所有元素从源复制到目标。目标列表必须与源一样长。\n\
  *   `static <T> void fill(List<? super T> l, T value)`\n\n    将列表的所有位置设置为 value。\n\
  *   `static <T> boolean addAll(Collection<? super T> c, Collection<? extends T>\
  \ values)`\n\n    将所有值添加到集合中，如果集合发生了变化则返回 `true`。\n*   `static <T> boolean replaceAll(List<T>\
  \ l, T oldValue, T newValue)`\n\n    将所有等于 `oldValue` 的元素替换为 `newValue`。\n*   `static\
  \ int indexOfList(List<?> l, List<?> s)`\n\n    返回 `l` 中第一个等于 `s` 的子列表索引。\n*   `static\
  \ int lastIndexOfList(List<?> l, List<?> s)`\n\n    返回 `l` 中最后一个等于 `s` 的子列表索引。\n\
  *   `static void swap(List<?> l, int i, int j)`\n\n    交换给定偏移量处的元素。\n*   `static\
  \ void reverse(List<?> l)`\n\n    反转列表中元素的顺序。例如，反转 `[t, a, r]` 得到 `[r, a, t]`。该方法在\
  \ O(`n`) 时间内运行，其中 `n` 是列表的长度。\n*   `static void rotate(List<?> l, int d)`\n\n  \
  \  旋转列表中的元素，将索引为 `i` 的条目移动到 `(i + d) % l.size()`。例如，旋转 `[t, a, r]` 2 位得到 `[a, r,\
  \ t]`。该方法在 O(`n`) 时间内运行，其中 `n` 是列表的长度。\n*   `static int frequency(Collection<?>\
  \ c, Object o)`\n\n    返回集合 `c` 中等于 `o` 的元素计数。\n*   `static boolean disjoint(Collection<?>\
  \ c1, Collection<?> c2)`\n\n    如果集合之间没有公共元素，则返回 `true`。\n\n`java.util.Collection<T>`\
  \ 1.2\n\n*   `default boolean removeIf(Predicate<? super E> filter)`\n\n    移除所有匹配的元素。\n\
  \n`java.util.List<E>` 1.2\n\n*   `default void replaceAll(UnaryOperator<E> op)`\n\
  \n    对列表的所有元素应用操作。\n\n### 批量操作\n\n有几种可以“批量”复制或移除元素的操作。调用\n\n```\ncoll1.removeAll(coll2);\n\
  ```\n\n从 `coll1` 中移除所有存在于 `coll2` 中的元素。相反，\n\n```\ncoll1.retainAll(coll2);\n```\n\
  \n从 `coll1` 中移除所有*不*存在于 `coll2` 中的元素。这是一个典型的应用。\n\n假设你想找到两个集合的*交集*——两个集合共同拥元素。首先，创建一个新集合来存储结果。\n\
  \n```\nvar result = new HashSet<String>(firstSet);\n```\n\n在这里，我们利用每个集合都有一个参数为另一个包含初始化值的集合的构造函数。\n\
  \n现在，使用 `retainAll` 方法：\n\n```\nresult.retainAll(secondSet);\n```\n\n它保留两个集合中出现的元素。你在没有编写循环的情况下形成了交集。\n\
  \n\n\n\n你可以进一步扩展这一思路，并对 `view`（视图）应用批量操作。例如，假设你有一个将员工 ID 映射到员工对象的映射（map），并且有一组所有要终止雇的员工\
  \ ID。\n\n```\nMap<String, Employee> staffMap = . . .;\nSet<String> terminatedIDs\
  \ = . . .;\n```\n\n只需形成键集并移除所有已终止员工的 ID 即可。\n\n```\nstaffMap.keySet().removeAll(terminatedIDs);\n\
  ```\n\n由于键集是映射的一个 `view`，键以及关联的员工名称会自动从映射中移除。\n\n通过使用子范围 `view`（视图），你可以将批量操作限制在子列表和子集中。例如，假设你想将列表的前十个元素添加到另一个容器中。创建一个子列表来提取前十个元素：\n\
  \n```\nrelocated.addAll(staff.subList(0, 10));\n```\n\n子范围也可以作为变异操作的目标。\n\n```\n\
  staff.subList(0, 10).clear();\n```\n\n## 集合与数组之间的转换\n\nJava API 的大部分内容是在 Java 集合框架（Java\
  \ Collections Framework）创建之前设计的。因此，你可能需要在传统数组和更现代的集合之间进行转换。\n\n如果你有一个需要转换为集合的数组，`List.of`\
  \ 方法可以此之用。例如：\n\n```\nString[] names = . . .;\nList<String> staff = List.of(names);\n\
  ```\n\n从集合获取数组要稍微复杂一些。你可以使用 `toArray` 方法：\n\n```\nObject[] names = staff.toArray();\n\
  ```\n\n但结果是一个 `objects` 数组。即使你知道你的集合包含特定类型的对象，你不能使用类型强制转换：\n\n```\nString[] names\
  \ = (String[]) staff.toArray(); // 错误\n```\n\n`toArray` 方法返回的数组是作为 `Object[]` 数组创建的，你无法更改它的类型。相反，请向\
  \ `toArray` 方法传递一个数组构造函数表达式。该构造函数被用于创建正确类型的数组：\n\n```\nString[] values = staff.toArray(String[]::new);\n\
  ```\n\n在 JDK 11 之前，你必须使用另一种形式的 `toArray` 方法，传递一个正确类型的数组：\n\n```\nString[] values\
  \ = staff.toArray(new String[0]);\n```\n\n此 `toArray` 方法会构造另一个相同类型的数组。或者，如果数组长度足够，则它会被重用：\n\
  \n```\nstaff.toArray(new String[staff.size()]);\n```\n\n在这种情况下，不会创建新数组。\n\n## 编写你自己的算法\n\
  \n如果你编写自己的算法（事实上，是任何以集合作为参数的方法），你应该尽可能与 `interfaces`（接口）工作，而不是具体的实现。例如，假设你想处理项。当然，你可以实现如下这样的方法：\n\
  \n```\npublic void processItems(ArrayList<Item> items)\n{\n   for (Item item : items)\n\
  \      对 item 执行某些操作 \n}\n```\n\n然而，你现在限制了你方法的调用者——调用者必须提供 `ArrayList` 中的项。如果这些项恰好在另一个集合中，它们首先需要重新包装。接受一个更通用的集合要好得多。\n\
  \n你应该问问自己这个问题：能够完成工作的最通用的集合接口是什么？你在乎顺序吗？如果是，你应该接受一个 `List`。但如果顺序不重要，你可以接受任何种类的集合：\n\
  \n```\npublic void processItems(Collection<Item> items)\n{\n   for (Item item :\
  \ items)\n      对 item 执行某些操作 \n}\n```\n\n现在，任何人都可以 `ArrayList` 或 `LinkedList` 调用此方法，甚至可以使用包装在\
  \ `List.of` 方法调用中的数组进行调用。\n\n在这种情况下，通过接受 `Iterable<Item>` 你可以做得更好。`Iterable` 接口有一个抽象方法\
  \ `iterator`，增强型 `for` 循环在后台会使用它。`Collection` 接口继承了 `Iterable`。\n\n相反，如果你的方法返回多个元素，你不希望限制自己以适应未来的改进。例如，考虑\n\
  \n```java\npublic ArrayList<Item> lookupItems(. . .)\n{\n   var result = new ArrayList<Item>();\n\
  \   . . .\n   return result;\n}\n```\n\n此方法承诺返回一个 `ArrayList`，尽管调用者几乎肯定不在乎它是哪种类型的列表。相反，如果你返回\
  \ `List`，你可以随时通过调用 `List.of` 添加一个返回空列表或单例列表的分支。\n\n如果使用集合接口作为参数和返回类型是一个这么好的主意，为什么\
  \ Java API 不一致地遵循这一规则呢？例如，`JComboBox` 类有两个构造函数：\n\n```\nJComboBox(Object[] items)\n\
  JComboBox(Vector<?> items)\n```\n\n原因仅仅是时间问题。Swing API 在 Java 集合框架创建之前就已经。\n\n##\
  \ 遗留集合\n\n自 Java 首次发布以来，在集合框架出现之前，就已经许多“遗留”容器类。\n\n它们已经集成到 Java 集合框架中——参见图 9.12。我将在后续章节中简要介绍它们。\n\
  \n![图](img/13_12.jpg)Java 集合框架中的遗留类\n\n### Hashtable 类\n\n经典的 `Hashtable` 类的作用与\
  \ `HashMap` 类相同，并且本质上具有相同的接口。就像 `Vector` 类的方法一样，`Hashtable` 是同步的。如果你需要并发访问，请使用 `ConcurrentHashMap`。\n\
  \n### Enumerations\n\n遗留集合使用 `Enumeration` 接口遍历元素序列。`Enumeration` 接口有两个方法 `hasMoreElements`\
  \ 和 `nextElement`。这些与 `Iterator` 接口的 `hasNext` 和 `next` 方法完全对应。\n\n如果你在遗留类中发现此接口，可以使用\
  \ `Collections.list` 来收集元素。例如，`LogManager` 类只愿意以 `Enumeration` 形式显示日志器名称。这是获取所有名称的方法：\n\
  \n```\nArrayList<String> loggerNames = Collections.list(LogManager.getLoggerNames());\n\
  ```\n\n或者，你可以将枚举转换为迭代器：\n\n```\nLogManager.getLoggerNames().asIterator().forEachRemaining(n\
  \ -> { . . });\n```\n\n你偶尔会遇到带有枚举的遗留方法。静态方法 `Collections.enumeration` 生成一个遍历集合元素的枚举对象。例如：\n\
  \n```\nList<InputStream> streams = . . .;\nvar in = new SequenceInputStream(Collections.enumeration(streams));\n\
  // SequenceInputStream 构造函数期望枚举\n```\n\n\n\n\n一个 `property map`（属性映射）是一种特殊类型的 map\
  \ 结构。它有三个显著特征：\n\n* 键和值都是字符串。\n* 该 map 可以很方便地保存到文件中并从文件中加载。\n* 它有一个用于存储默认值的辅助表。\n\
  \n实现属性映射的 Java 平台类是 `Properties`。属性映射在指定程序的配置选项时非常有用。例如：\n\n```\nvar settings =\
  \ new Properties();\nsettings.setProperty(\"width\", \"600.0\");\nsettings.setProperty(\"\
  filename\", \"/home/cay/books/corejava/code/v1ch09/raven.html\");\n```\n\n使用 `getProperty`\
  \ 方法查找键对应的值：\n\n```\nString filename = settings.getProperty(\"filename\");\n```\n\
  \n由于历史原因，`Properties` 类实现了 `Map<Object, Object>`。因此，你可以使用 `Map` 接口的 `get` 和 `put`\
  \ 方法。但 `get` 方法返回类型为 `Object`，而 `put` 方法允许你插入任何对象。最好是坚持使用处理字符串的 `getProperty` 和\
  \ `setProperty` 方法，而不是处理对象。\n\n使用 `store` 方法将属性保存到文件中。第二个参数是包含在文件中的注释。\n\n```\n\
  var out = new FileWriter(\"program.properties\");\nsettings.store(out, \"Program\
  \ Properties\");\n```\n\n示例集给出如下输出：\n\n```\n#Program Properties\n#Sun Dec 31 12:54:19\
  \ PST 2023\ntop=227.0\nleft=1286.0\nwidth=423.0\nheight=547.0\nfilename=/home/cay/books/corejava/code/v1ch09/raven.html\n\
  ```\n\n要从文件加载属性，请使用：\n\n```\nvar in = new FileReader(\"program.properties\");\n\
  settings.load(in);\n```\n\n如果你对输入/输出流使用 `load` 和 `store` 方法，将使用过时的 ISO 8859-1 字符编码，大于\
  \ `U+00FF` 的字符将会被保存为 Unicode 转义字符。对于 UTF-8，请像上述代码段那样使用读取/写入器。在 Java 18 之前，请显式设置字符编码为\
  \ `StandardCharsets.UTF_8`。\n\n`Properties` 类有两种提供默认值的机制。首先，每当你查找一个字符串的值时，你都可以指定一个当键不存在时应自动使用的默认值。\n\
  \n```\nString filename = settings.getProperty(\"filename\", \"\");\n```\n\n如果属性映射中存在\
  \ `\"filename\"` 属性，则 `filename` 被设置为该字符串。否则，`filename` 被设置为空字符串。\n\n如果你觉得在每次调用\
  \ `getProperty` 时指定默认值太无聊了，可以将所有默认值封装在一个辅助属性映射中，并在主属性映射的构造函数中提供该 map。\n\n```\nvar\
  \ defaultSettings = new Properties();\ndefaultSettings.setProperty(\"width\", \"\
  600\");\ndefaultSettings.setProperty(\"height\", \"400\");\ndefaultSettings.setProperty(\"\
  filename\", \"\");\n// . .\nvar settings = new Properties(defaultSettings);\n```\n\
  \n是的，如果你给 `defaultSettings` 构造函数再提供另一个属性映射作为参数，你甚至可以为默认值指定默认值，但这通常不是人们的做法。\n\n配套代码包含一个示例程序，展示了你如何使用属性来存储和加载程序状态。该程序使用了来自第\
  \ 2 章的 `ImageViewer` 程序，并记录帧的位置、大小和最后加载的文件。运行程序，加载一个文件，移动并调整窗口大小。然后关闭程序并重新打开，你会发现它记得你的文件和你喜爱的窗口布局。你也可以手动编辑主目录下的\
  \ `.corejava/ImageViewer.properties` 文件。\n\n属性是简单的表格，没有层级结构。属性映射通过诸如 `window.color`、`window.title`\
  \ 等键来组织层级。如果你需要复杂的配置信息，请查看第 10 章。\n\n### 系统属性\n\n`java.version` 系统属性由虚拟机设置，不应更改。其他系统属性可以通过\
  \ `-D` 参数设置：\n\n```\njava -Duser.language=fr -Duser.country=CA\n```\n\n要让属性在 `jshell`\
  \ 中可用，请使用 `-R` 选项：\n\n```\njshell -R-Duser.language=fr -R-Duser.country=CA\n```\n\
  \n获取数值或布尔系统属性值，请使用静态方法 `Boolean.getBoolean()`、`Integer.getInteger` 和 `Long.getLong()`：\n\
  \n```\nInteger version = Integer.getInteger(\"java.specification.version\");\n```\n\
  \n## `java.lang.System` 1.0\n\n* `Properties getProperties()`\n  获取所有系统属性。应用程序必须拥有读取权限，否则将抛出安全异常。\n\
  * `String getProperty(String key)`\n  获取给定键名的系统属性。以下属性始终存在：\n\n```\njava.version\n\
  java.version.date\njava.vendor\njava.vendor.url\njava.home\njava.class.path\njava.library.path\n\
  java.class.version\njava.specification.version\njava.specification.vendor\njava.specification.name\n\
  java.vm.specification.version\njava.vm.specification.vendor\njava.vm.specification.name\n\
  java.vm.version\njava.vm.vendor\njava.vm.name\nos.name\nos.version\nos.arch\nfile.separator\n\
  path.separator\nline.separator\njava.io.tmpdir\nuser.name\nuser.home\nuser.dir\n\
  native.encoding\nstdout.encoding\nstderr.encoding\n```\n\n## `java.util.Properties`\
  \ 1.0\n\n* `Properties()`\n  创建一个空的属性 map。\n* `Properties(Properties defaults)`\n\
  \  创建一个带有默认值的属性 map。\n* `String getProperty(String key)`\n  获取属性。如果键在默认表中不存在，则返回\
  \ `null` `。\n* `String getProperty(String key, String defaultValue)`\n  获取属性。如果键在默认表中不存在，则返回\
  \ `defaultValue`。\n* `Object setProperty(String key, String value)`\n  设置属性。返回之前设置的键的值。\n\
  * `Set<String> propertyNames()`\n  返回所有键，包括默认 map 中的键。\n* `void load(Reader in)\
  \ throws IOException`\n  从读取器加载属性 map。\n* `void store(Writer out, String header)`\n\
  \  将属性 map 保存到写入器。header 在第一行。\n\n## `java.lang.Boolean` 1.0\n\n* `static boolean\
  \ getBoolean(String name)`\n  如果给定名称的系统属性值为 `\"true\"`（忽略大小写），则返回 `true`，否则返回 `false`。\n\
  \n## `java.lang.Integer` 1.0\n\n* `static Integer getInteger(String nm)`\n* `static\
  \ Integer getInteger(String nm, int val)`\n* `static Integer getInteger(String nm,\
  \ Integer val)`\n\n\n\n\n\n返回对给定名称系统属性调用 `Integer.decode` 的结果。如果没有该名称的系统属性，或者其值无法解码，此方法返回默认值；如果没有提供默认值，则返回\
  \ `null`。\n\n`java.lang.Long` 10\n\n* `static Long getLong(String nm)`\n* `static\
  \ Long getLong(String nm, int val)`\n* `static Long getLong(String nm, Long val)`\n\
  \n返回对给定名称系统属性调用 `Long.decode` 的结果。如果没有该名称的系统属性，或者其值无法解码，此方法返回默认值；如果没有提供默认值，则返回 `null`。\n\
  \n## 栈 (Stacks)\n\n自 1.0 版本开始，Java API 就有了一个具有熟悉的 `push` 和 `pop` 方法的 `Stack` 类。然而，`Stack`\
  \ 类继承了 `Vector` 类，这从理论角度来看并不理想——你可以应用如 `insert` 和 `remove` 等非栈操作，在栈的任何位置插入或删除值，而不仅仅是在栈顶。\n\
  \n`java.util.Stack<E>` 1.0\n\n* `E push(E item)`\n  将 `item` 推入栈中并返回 `item`。\n\n\
  * `E pop()`\n  弹出并返回栈顶的元素。如果栈为空，请勿调用此方法。\n\n* `E peek()`\n  返回栈顶元素但不将其弹出。如果栈为空，请勿调用此方法。\n\
  \n## 位集 (Bit Sets)\n\nJava 平台的 `BitSet` 类存储一个位序列，这些位被封装在特定实现的“字”（words）中，目前这些字是\
  \ `long` 类型。这比使用 `boolean` 数组要高效得多。\n\n`BitSet` 类为你提供了一个用于读取、设置和重置单个位的方便接口。使用此接口可以避免在在\
  \ `int` 或 `long` 变量中存储位时必须的掩码操作和其他位位操作。\n\n例如，对于一个名为 `bucketOfBits` 的 `BitSet`，\n\
  \n```\nbucketOfBits.get(i)\n```\n\n如果第 `i` 位开启，则返回 `true`，否则返回 `false`。同样，\n\n```\n\
  bucketOfBits.set(i)\n```\n\n将第 `i` 位开启。最后，\n\n```\nbucketOfBits.clear(i)\n```\n\n\
  将第 `i` 位关闭。\n\n你可以使用 `BitSet` 来表示一个带有上限的非负整数集合。设置第 `i` 位以表示整数 `i` 在集合中。如果上限不大且集合包含许多元素，这种方法比使用\
  \ `Set<Integer>` 更高效。\n\nC++ 的 `bitset` 模板与 Java 平台的 `BitSet` 具有相同的功能。\n\n`java.util.BitSet`\
  \ 1.0\n\n* `BitSet(int initialCapacity)`\n  构造一个位集。\n\n* `int cardinality()` 1.4\n\
  \  返回已设置的位数，或者当将其视为整数集合时，返回元素的数量。\n\n* `int length()` 1.2\n  返回“逻辑长度”（1 加上最高设置位的索引）。这对于遍历元素非常用用。\n\
  \n* `int size()`\n  返回内部数据结构中当前可用的位数，而不是已设置元素的数量。\n\n* `boolean get(int bit)`\n\
  \  获取一个位。\n\n* `void set(int bit)`\n  设置一个位。\n\n* `void clear(int bit)`\n  清除一个位。\n\
  \n* `void and(BitSet set)`\n  将此位集与另一个位集进行逻辑与运算。\n\n* `void or(BitSet set)`\n  将此位集与另一个位集进行逻辑或运算。\n\
  \n* `void xor(BitSet set)`\n  将此位集与另一个位集进行逻辑异或运算。\n\n* `void andNot(BitSet set)`\n\
  \  清除此位集中在另一个位集中已设置的所有位。\n\n* `IntStream stream()` 8\n  产生一个已设置位的索引流，或者当将其视为整数集合时，产生一个元素的流。\n\
  \n作为使用位集的示例，我想向你们展示一个用于寻找质数的“埃拉托斯特筛”算法的实现。（质数是诸如 2、3 或 5 这样只能被自己和 1 整除的数字，而埃拉托斯特筛是发现的用于枚举这些基础构建块的方法之一。）这对于寻找质数来说并不是一个非常好的算法，但由于某种原因，它成了一个编译器性能的热门基准。（它也不是一个好的基准，因为它主要测试位操作。）\n\
  \n好吧，我遵循传统并展示一个实现。该程序计算了 2 到 2,000,000 之间所有的质数。（在这个范围内有 148,933 个质数，所以你可能不想把它们全部打印出来。）\n\
  \n在不涉及该程序过多细节的情况下，其思想是遍历一个包含 200 万位的位集。首先，我们开启所有位。之后，我们关闭已知质数倍数的位。经过此过程后剩余的位的位置本身就是质数。列表\
  \ 9.8 是 Java 代码，列表 9.9 是 C++ 代码。以下是在 i7 处理器、32 GB 内存、运行 Ubuntu 22.04 下结果：\n\n* \
  \  C++ (11): 70 毫秒\n*   Java (21): 20 毫秒\n\n```java\npackage sieve;\n\nimport java.util.*;\n\
  \n/**\n * 此程序计算了 2 到 2,000,000 之间所有的质数。\n * @version 1.22 2021-06\n * @author Cay\
  \ Horstmann\n */\npublic class Sieve\n{\n   public static void main(String[] s)\n\
  \   {\n      int n = 2000000;\n      long start = System.nanoTime();\n      BitSet\
  \ bitSet = new BitSet(n + 1);\n      int i;\n      for (i = 2; i <= n; i++)\n  \
  \       bitSet.set(i);\n      i = 2;\n      while (i * i <= n)\n      {\n      \
  \   if (bitSet.get(i))\n         {\n            int k = i * i;\n            while\
  \ (k <= n)\n            {\n               bitSet.clear(k);\n               k +=\
  \ i;\n            }\n         }\n         i++;\n      }\n      long end = System.nanoTime();\n\
  \      System.out.println(bitSet.cardinality() + \" primes\");\n      System.out.println((end\
  \ - start) / 1000 + \" milliseconds\");\n   }\n}\n```\n\n```cpp\n#include <bitset>\n\
  #include <iostream>\n#include <ctime>\n\nusing namespace std;\n\n/**\n * @version\
  \ 1.22 2021-06\n * @author Cay Horstmann\n */\nint main()\n{  \n   const int N =\
  \ 2000000;\n   clock_t cstart = clock();\n\n   bitset<N + 1> b;\n   int i;\n   for\
  \ (i = 2; i <= N; i++)\n      b.set(i);\n   i = 2;\n   while (i * i <= N)\n   {\
  \  \n      if (b.test(i))\n      {  \n         int k = i * i;\n         while (k\
  \ <= N)\n         {  \n            b.reset(k);\n            k += i;\n         }\n\
  \      }\n      i++;\n   }\n\n   clock_t cend = clock();\n   double millis = 1000.0\
  \ * (cend - cstart) / CLOCKS_PER_SEC;\n\n   cout << b.count() << \" primes\\n\"\
  \ << millis << \" milliseconds\\n\";\n\n   return 0;\n}\n```\n\n\n\n\n\n多线程程序通过将层次进一步降低扩展了多任务的思想：单个程序似乎在同时执行多个任务。每个任务都在一个\
  \ `thread`（线程）中执行，它是控制线程（thread of control）的缩写。能够同时运行多个线程的程序被称为多线程程序。\n\n那么，多个 `processes`（进程）和多个\
  \ `threads`（线程）之间的区别是什么？本质区别在于，每个进程都拥有一套完整的变量，而线程则共享相同的数据。这听起来有些风险，而且确实如此，正如你将在本章稍后部分看到的。。然而，共享变量使得线程间的通信比进程间通信更高效、更容易编程。此外，在某些操作系统上，线程比进程更“轻量级”——创建和销毁单个线程的开销比启动新进程要小。\n\
  \n多线程在实践中极其有用。例如，浏览器应该能够同时下载多个图像。Web 服务器需要能够处理并发请求。图形用户界面（GUI）程序有一个单独的线程，用于从宿主操作系统收集用户界面事件。本章将向你展示如何为\
  \ Java 应用添加多线程能力。\n\n预警：并发编程可能会变得非常复杂。在本章中，我涵盖了应用程序程序员可能需要的所有工具。然而，对于更复杂的系统级编程，我建议你参考更高级的教程，例如\
  \ Brian Goetz 等人编写的 *Java Concurrency in Practice*（Addison-Wesley Professional,\
  \ 2006）。\n\n## 运行线程\n\n以下是在独立线程中运行任务的简单步骤：\n\n1. 将任务代码放入实现 `Runnable` 接口的类的 `run`\
  \ 方法中。该接口非常简单，只有一个方法：\n\n   ```\n   public interface Runnable\n   {\n      void\
  \ run();\n   }\n   ```\n\n   由于 `Runnable` 是函数式接口，你可以使用 Lambda 表达式创建一个实例：\n\n  \
  \ ```\n   Runnable r = () ->\n      {\n          task code\n       };\n   ```\n\n\
  2. 从 `Runnable` 构造一个 `Thread` 对象：\n\n   ```\n   var t = new Thread(r);\n   ```\n\
  \n3. 启动线程：\n\n   ```\n   t.start();\n   ```\n\n让我们来看一个使用线程在银行账户之间转账的简单程序。我们利用 `Bank`\
  \ 类来存储指定数量账户的余额。`transfer` 方法将金额从一个账户转移到另一个账户。实现细节请参见 Listing 10.2。\n\n在第一个线程中，我们将资金从账户\
  \ 0 转移到账户 1：\n\n```\nRunnable r = () ->\n   { \n      try\n      {  \n         for\
  \ (int i = 0; i < STEPS; i++)\n         {\n            double amount = MAX_AMOUNT\
  \ * Math.random();\n            bank.transfer(0, 1, amount);\n            Thread.sleep((int)\
  \ (DELAY * Math.random()));\n         }\n      }\n      catch (InterruptedException\
  \ e)\n      {\n      }\n   };\nvar t = new Thread(r);\nt.start();\n```\n\n对于给定的步数，该线程转移随机金额，然后随机延迟睡眠一段时间。\n\
  \n我们需要捕获 `sleep` 方法可能会抛出的 `InterruptedException`。我们将在 Section 10.3.2 中讨论此异常。通常，中断用于请求线程终止。因此，当发生\
  \ `InterruptedException` 时，我们的 `run` 方法会退出。\n\n从大量不同的线程中调用 `Math.random()` 效率略低。对于这个以及随后的演示程序，我们不在意。但请参\
  \ Section 10.5.14 获取更高效的方法。\n\n我们的程序还启动了第二个线程，将资金从账户 2 转移到账户 3。当你运行此程序时，你会得到如下打印输出：\n\
  \n```\nThread[Thread-1,5,main]     606.77 from 2 to 3 Total Balance:  400000.00\n\
  Thread[Thread-0,5,main]      98.99 from 0 to 1 Total Balance:  400000.00\nThread[Thread-1,5,main]\
  \     476.78 from 2 to 3 Total Balance:  400000.00\nThread[Thread-0,5,main]    \
  \ 653.64 from 0 to 1 Total Balance:  400000.00\nThread[Thread-1,5,main]     807.14\
  \ from 2 to 3 Total Balance:  400000.00\nThread[Thread-0,5,main]     481.49 from\
  \ 0 to 1 Total Balance:  400000.00\nThread[Thread-0,5,main]     203.73 from 0 to\
  \ 1 Total Balance:  400000.00\nThread[Thread-1,5,main]     111.76 from 2 to 3 Total\
  \ Balance:  400000.00\nThread[Thread-1,5,main]     794.88 from 2 to 3 Total Balance:\
  \  400000.00\n. . .\n```\n\n如你所见，两个线程的输出是交错的，表明它们正在并发运行。事实上，当两行输出交错时，输出有时会更混乱。就这么简单！你现在知道如何运行任务了。**不要**调用\
  \ `Thread` 类的 `run` 方法或 `Runnable` 对象的 `run` 方法。直接调用 `run` 方法会在*相同*线程中执行任务——不会启动新线程。相反，请调用\
  \ `Thread.start` 方法。你也可以通过创建 `Thread` 类的子类来定义线程，如下：\n\n```\nclass MyThread extends\
  \ Thread\n{\n   public void run()\n   {\n      task code\n   }\n}\n```\n\n然后你构造子类的对象并调用它的\
  \ `start` 方法。然而，这种方法不再被推荐。你应该将要运行的*任务*与运行任务的*机制*解耦。正如你将在整个章中看到的，调度任务执行有许多方法。\n\n\
  \n\n\n\n```java\npackage threads;\n\nimport java.util.*;\n\n/**\n * 一个拥有多个银行账户的银行。\n\
  \ */\npublic class Bank\n{\n   private final double[] accounts;\n\n   /**\n    *\
  \ 银行。\n    * @param n 账户的数量\n    * @param initialBalance 每个账户的初始余额\n    */\n   public\
  \ Bank(int n, double initialBalance)\n   {\n      accounts = new double[n];\n  \
  \    Arrays.fill(accounts, initialBalance);\n   }\n\n   /**\n    * 将资金从一个账户转到另一个账户。\n\
  \    * @param from 从哪个账户转出\n    * @param to 转入哪个账户\n    * @param amount 要转账的金额\n\
  \    */\n   public void transfer(int from, int to, double amount)\n   {\n      if\
  \ (accounts[from] < amount) return;\n      System.out.print(Thread.currentThread());\n\
  \      accounts[from] -= amount;\n      System.out.printf(\" %10.2f from %d to %d\"\
  , amount, from, to);\n      accounts[to] += amount;\n      System.out.printf(\"\
  \ Total Balance: %10.2f%n\", getTotalBalance());\n   }\n\n   /**\n    * 获取所有账户余额的总和。\n\
  \    * @return 总余额\n    */\n   public double getTotalBalance()\n   {\n      double\
  \ sum = 0;\n\n      for (double a : accounts)\n         sum += a;\n\n      return\
  \ sum;\n   }\n\n   /**\n    * 获取银行中账户的数量。\n    * @return 账户的数量\n    */\n   public\
  \ int size()\n   {\n      return accounts.length;\n   }\n}\n```\n\n`java.lang.Thread`\
  \ 1.0\n\n*   `Thread(Runnable target)`\n    构造一个新的线程，并调用指定目标的 `run()` 方法。\n\n* \
  \  `void start()`\n    启动该线程，导致 `run()` 方法被调用。此方法将立即返回。新线程将并发运行。\n\n*   `void run()`\n\
  \    调用关联的 `Runnable` 的 `run` 方法。\n\n*   `static void sleep(long millis)`\n\n* \
  \  `static void sleep(Duration duration)` 19\n    睡眠指定的毫秒数。\n\n`java.lang.Runnable`\
  \ 1.0\n\n*   `void run()`\n    必须重写，并为你想要执行的任务提供指令说明。\n\n## 线程状态\n\n线程可以处于六种状态之一：\n\
  \n*   新建 (New)\n*   可运行 (Runnable)\n*   阻塞 (Blocked)\n*   等待 (Waiting)\n*   超时等待\
  \ (Timed waiting)\n*   已终止 (Terminated)\n\n接后的章节将解释这些状态中的每一个。\n\n要确定线程的当前状态，只需调用\
  \ `getState` 方法。\n\n### 新建线程\n\n当你使用 `new` 算符创建一个线程时（例如 `new Thread(r)`），该线程尚未运行。这意味着它处于\
  \ `new` 状态。当线程处于 `new` 状态时，程序尚未开始执行其内部的代码。在线程运行之前，需要完成一定数量的记录工作。\n\n### 可运行线程\n\n\
  一旦调用了 `start` 方法，线程就处于 `runnable` 状态。可运行的线程可能正在运行，也可能没有正在运行。这取决于线程调度器是否给线程运行时间。（不过，Java\
  \ 规范并没有将其称为一个独立的状态。正在运行的线程仍然处于 `runnable` 状态。）\n\n一旦线程开始运行，它并不一定持续运行。事实上，运行中的线程偶尔暂停是有益的，这样其他线程才有机会运行。线程调度的细节取决于操作系统提供的服务以及线程的性质。\n\
  \n从 Java 21 开始，有两种线程：`platform threads`（平台线程）和 `virtual threads`（虚拟线程）。Java 平台线程对应于操作系统提供的线程，由操作系统调度其执行。虚拟线程运行在平台线程之上，由\
  \ Java 运行时调度。正如你将在[第 10.3.1 节]中看到的，虚拟线程用于并发任务多于可用平台线程的应用程序。\n\n每个处理器一次可以运行一个平台线程。在具有多个处理器的机器上，你可以让多个线程并行运行。如果可运行线程多于可用处理器，则其中某些线程实际上并没有运行。它们需要被调度执行。\n\
  \n平台线程使用`抢占式调度`（preemptive scheduling）。每个运行的线程都会被分配时间片来执行其任务。当该时间片耗尽时，操作系统会`抢占`该线程并给另一个线程工作的机会。在选择下一个平台线程时，操作系统会考虑线程的\
  \ `priorities`（优先级）——更多信息请参见[第 10.3.6 节]。\n\n虚拟线程使用`协作式调度`（cooperative scheduling）。虚拟线程在调用\
  \ `yield` 方法或被阻塞时才会失去控制权。\n\n`java.lang.Thread` 1.0\n\n*   `static void yield()`\n\
  \    向调度器发出信号，表示此线程愿意让出执行执行权。注意这是一个静态方法。\n\n### 阻塞和等待线程\n\n当线程被阻塞或等待时，它是暂时不活跃的。它不执行任何代码且消耗的资源极少。由线程调度器重新激活它。细节取决于是如何进入不活跃状态的。\n\
  \n*   当线程尝试获取一个当前由另一个线程持有的内部对象锁（但不是 `java.util.concurrent` 中的 `Lock`）时，它变为 `blocked`（阻塞）。\n\
  *   当线程等待另一个线程的通知时，它进入 `waiting`（等待）状态。\n* 若干方法带有超时。调用它们会导致线程进入 `timed waiting`（超时等待）状态。该状态持续到超时过期或收到相应的通知。带有超时的方法包括\
  \ `Thread.sleep` 以及 `Object.wait`、`Thread.join`、`Lock.tryLock` 和 `Condition.await`\
  \ 的超时版本。\n\n在实践中，阻塞和等待状态之间的区别通常并不显著。我们经常在处于阻塞、等待或超时等待状态时说线程是阻塞的。当线程被重新激活时（例如因为超时过期或成功获取锁），它将变为可运行状态并可以被调度。\n\
  \n### 已终止线程\n\n线程终止有两个原因之一：\n\n*   因为 `run` 方法正常退出，它自然性死亡。\n*   因为一个未捕获的异常终止了 `run`\
  \ 方法，它突然终止。\n\n\n\n\n\n默认情况下，Java 线程运行在 Java 虚拟机执行的操作系统所提供的 `platform thread`（平台线程）上。对于许多工作负载，这是一个很好的安排，因为操作系统已经演进到可以很好地处理线程调度。\n\
  \n然而，平台线程并不是轻级的。它们的启动需要数千个 CPU 指令，并且消耗（或至少预留）了大量的内存。这限制了 CPU 能够处理的平台线程数量。\n\n对于某些类应用程序来说这是一个问题。典型的\
  \ Web 应用程序希望处理大量的并发请求，数量远多于平台线程的数量。应用程序可以处理这些工作负载，因为这些任务并不涉及 CPU 密集型工作。每个任务的大部分时间都阻塞在数据库查询或其他外部请求上。\n\
  \n一种解决方案是针对请求使用非阻塞 API。与其使用同步调用：\n\n```\nresponse = service.request(parameters);\n\
  process(response);\n```\n\n不如将处理代码作为回调传递：\n\n```\nservice.request(parameters, response\
  \ -> process(response));\n```\n\n然后，对 `request` 的调用会立即返回而不会阻塞，释放其线程来处理额外的请求。当响应可用时，会触发回调函数。\n\
  \n非阻塞 API 提供了高吞吐量，但对程序员来说代价高昂的。与其使用用于序列、分支、循环和异常处理的熟悉编程结构，所有的程序逻辑都必须放在回调代码中。\n\n\
  Java 21 中提供的虚拟线程（Virtual threads）是一个极具吸引力的替代方案。虚拟线程被 `mounted`（挂载）在平台线程上，并在遇到阻塞操作时被\
  \ `unmounted`（卸载）。当操作结果可用时，虚拟线程可以再次被调度，当平台线程可用时，它会被重新挂载。\n\n“虚拟线程”这一术语类比于虚拟内存。就像虚拟内存映射到较少的实际\
  \ RAM 一样，虚拟线程被挂载在较少的平台线程上。这些平台线程被称为 `carrier threads`（载体线程）。默认情况下，调度器每个处理器使用一个载体线程。可以通过\
  \ `jdk.virtualThreadScheduler.parallelism` VM 选项进行调整。\n\n虚拟线程与平台线程具有相同的 API。创建并启动虚拟线程的一种简单方法是：\n\
  \n```\nThread t = Thread.startVirtualThread(myRunnable);\n```\n\n`Thread` 类的 `isVirtual`\
  \ 方法在线程为虚拟线程时返回 `true`。\n\n`java.lang.Thread` 1.0\n\n*   `boolean isVirtual()` 21\n\
  \n    当此线程为虚拟线程时返回 `true`。\n\n*   `static Thread startVirtualThread(Runnable task)`\
  \ 21\n\n    启动并返回运行给定任务的虚拟线程。\n\n### 线程中断\n\n线程在 fact `run` 方法返回时终止——通过执行 `return`\
  \ 语句、执行方法体中的最后一个语句，或者发生了方法中未捕获的异常。\n\n在 Java 的初始版本中，还有一个 `stop` 方法，另一个线程可以调用它来终止线程。然而，该方法很快被认为是不安全的，现在会抛出\
  \ `UnsupportedOperationException` 而不是停止线程。\n\n没有办法 `force` 线程终止。但是可以使用 `interrupt`\
  \ 方法来 `request` 终止线程。\n\n当在线程上调用 `interrupt` 方法时，线程的 `interrupted status`（中断状态）会被设置。这是一个每个线程中都存在的\
  \ `boolean` 标志。每个线程都应该偶尔检查自己是否被中断。\n\n要检查中断状态是否被设置，首先调用静态方法 `Thread.currentThread`\
  \ 获取当前线程，然后调用 `isInterrupted` 方法：\n\n```\nwhile (!Thread.currentThread().isInterrupted()\
  \ && more work to do)\n{\n   do more work\n}\n```\n\n然而，如果线程处于阻塞状态，它无法检查中断状态。这就是\
  \ `InterruptedException` 派上用场的地方。当对阻塞 `sleep` 或 `wait` 等调用的线程调用 `interrupt` 方法时，阻塞会被\
  \ `InterruptedException` 终止。某些阻塞 I/O 调用是无法中断的。那么在 I/O 操作完成后会抛出 `InterruptedException`。\n\
  \n语言并没有规定被中断的线程必须终止。中断线程仅仅是引起了它的注意。被中断的线程可以决定如何对中断做出反应。某些线程非常重要，应该处理异常并继续。但更多时候，线程只会简单地将中断解释为终止请求。此类线程的\
  \ `run` 方法形式如下：\n\n```\nRunnable r = () ->\n   {\n      try\n      {\n         .\
  \ . .\n         while (!Thread.currentThread().isInterrupted() && more work to do)\n\
  \         {\n            do more work\n         }\n      }\n      catch (InterruptedException\
  \ e)\n      {\n         // thread was interrupted\n      }\n      finally\n    \
  \  {\n         cleanup, if required\n      } \n      // exiting the run method terminates\
  \ the thread\n   };\n```\n\n如果你在每次工作迭代后调用 `sleep` 方法（或另一个可中断的方法），那么 `isInterrupted`\
  \ 检查既不是必要的也没有用的。如果在中断状态被设置时调用 `sleep` 方法，它不会睡眠。相反，它会清除状态 (!) 并抛出 `InterruptedException`。因此，如果你的循环调用了\
  \ `sleep`，就不要检查中断状态。相反，应该捕获 `InterruptedException`：\n\n```\nRunnable r = () ->\n\
  \   {\n      try\n      {\n         . . .\n         while (more work to do)\n  \
  \       {\n            do more work\n            Thread.sleep(delay);\n        \
  \ }\n      }\n      catch (InterruptedException e)\n      {\n         // thread\
  \ was interrupted\n      }\n      finally\n      {\n         cleanup, if required\n\
  \      } \n      // exiting the run method terminates the thread\n   };\n```\n\n\
  \n\n\n检查线程是否被中断。与 `static interrupted` 方法不同，此调用不会更改线程的中断状态。\n\n*   `static Thread\
  \ currentThread()`\n\n返回代表当前执行线程的 `Thread` 对象。\n\n### 守护线程\n\n你可以通过调用以下方法将线程转换为\
  \ `daemon thread`（守护线程）：\n\n```\nt.setDaemon(true);\n```\n\n这种线程并没有“魔鬼”之处。守护线程仅仅是一个在生命中除了服务他人没有其他角色的线程。例如向其他线程发送定期“定时器滴答”的定时器线程，或清理过期缓存条目的线程。当只剩下守护线程时，虚拟机就会退出。如果所有剩余线程都是守护线程，那么保持程序运行就没有意义。\n\
  \n所有虚拟线程都是守护线程。调用 `setDaemon(false)` 对虚拟线程没有影响。\n\n`java.lang.Thread` 1.0\n\n* \
  \  `void setDaemon(boolean isDaemon)`\n\n将此线程标记为守护线程或用户线程。此方法必须在线程启动之前调用。\n\n###\
  \ 线程名称和 ID\n\n默认情况下，线程具有如 `Thread-2` 这样易记的名字。你可以使用 `setName` 方法设置任何名称：\n\n```\n\
  var t = new Thread(runnable);\nt.setName(\"Web crawler\");\n```\n\n这在线程转储（thread\
  \ dumps）中非常有用。\n\n每个线程还有一个正整数 ID，你可以通过以下方式获取它：\n\n```\nlong id = t.threadId();\n\
  ```\n\n还有一个 `getId` 方法。它已被弃用，因为它没有被定义为 `final`。有人可能会重写它以返回线程 ID 以外的内容。请改用 final\
  \ 的 `threadId` 方法。\n\n`java.lang.Thread` 1.0\n\n*   `void setName(String name)`\n\
  *   `String getName()`\n\n设置或获取此线程的名称。\n*   `long threadId()` 19\n\n返回此线程的唯一 ID。\n\
  \n### 未捕获异常的处理器\n\n线程的 `run` 方法不能抛出任何检查异常（checked exceptions），但它可以被非异常（unchecked\
  \ exception）终止。在这种情况下，线程将终止。\n\n然而，没有 `catch` 语句可以传播异常。相反，在线程死亡之前，异常会被传递给未捕获异常的处理器。\n\
  \n处理器必须属于实现 `Thread.UncaughtExceptionHandler` 接口的类。该接口有一个方法：\n\n```\nvoid uncaughtException(Thread\
  \ t, Throwable e)\n```\n\n你可以使用 `setUncaughtExceptionHandler` 方法为任何线程安装处理器。你也可以使用\
  \ `Thread` 类的静态方法 `setDefaultUncaughtExceptionHandler` 为所有线程安装默认处理器。替换的处理器可以使用日志\
  \ API 将未捕获异常的报告发送到日志文件中。如果你没有安装默认处理器，默认处理器将为 `null`。\n\n如果你没有为线程安装未捕获异常处理器，它将使用一个执行以下操作的处理器：\n\
  \n1.  如果线程所属的线程组（thread group）有父线程组，则调用父线程组的 `uncaughtException` 方法。（这并不常见。）\n2.\
  \  否则，如果 `Thread.getDefaultUncaughtExceptionHandler` 方法返回一个非 `null` 处理器，则调用它。\n\
  3.  否则，如果 `Throwable` 是已弃用的 `ThreadDeath` 类的实例（该类曾用于停止线程），则什么都不会发生。\n4.  否则，线程的名称和\
  \ `Throwable` 的堆栈跟踪将打印在 `System.err` 上。\n\n这正是你在程序中无疑见过很多次的堆栈跟踪。\n\n从技术上讲，未捕获异常处理器是由线程的\
  \ `thread group` 定义的。线程组是可以共同管理的线程集合。默认情况下，你创建的所有线程都属于同一个线程组，但建立其他分组也是可能的。由于现在有了更好的功能来操作线程集合，我建议不要在程序中使用线程组。\n\
  \n`java.lang.Thread` 1.0\n\n*   `static void setDefaultUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` 5.0\n*   `static Thread.UncaughtExceptionHandler getDefaultUncaughtExceptionHandler()`\
  \ 5.0\n\n设置或获取未捕获异常的默认处理器。\n*   `void setUncaughtExceptionHandler(Thread.UncaughtExceptionHandler\
  \ handler)` 5.0\n*   `Thread.UncaughtExceptionHandler getUncaughtExceptionHandler()`\
  \ 5.0\n\n设置或获取未捕获异常的处理器。如果没有安装处理器，则线程组对象 get 处理器。\n\n`java.lang.Thread.UncaughtExceptionHandler`\
  \ 5.0\n\n*   `void uncaughtException(Thread t, Throwable e)`\n\n定义用于在线程因未捕获异常终止时记录自定义报告。\n\
  \n`java.lang.ThreadGroup` 1.0\n\n*   `void uncaughtException(Thread t, Throwable\
  \ e)`\n\n如果有父线程组，则调用父线程组的此方法；如果有默认处理器，则调用 `Thread` 类的默认处理器；否则，向标准错误流打印堆栈跟踪。\n\n\
  ### 线程优先级\n\n每个线程都有一个 `priority`（优先级）。默认情况下，线程继承构造它的线程的优先级。你可以使用 `setPriority` 方法增加或减少任何平台线程的优先级。你可以将优先级设置为\
  \ `MIN_PRIORITY`（在 `Thread` 类中定义为 `1`）和 `MAX_PRIORITY`（定义为 `10`）之间的任何值。`NORM_PRIORITY`\
  \ 定义为 `5`。\n\n当平台线程调度程序有机会选择新线程时，它倾向于选择优先级更高的线程。尝试更改优先级对虚拟线程没有影响。\n\n`java.lang.Thread`\
  \ 1.0\n\n*   `void setPriority(int newPriority)`\n\n设置此线程的优先级。优先级必须在 `Thread.MIN_PRIORITY`\
  \ 和 `Thread.MAX_PRIORITY` 之间。使用 `Thread.NORM_PRIORITY` 设置普通优先级。\n*   `static int\
  \ MIN_PRIORITY`\n\n线程可以拥有的最低优先级。该值为 `1`。\n*   `static int NORM_PRIORITY`\n\n线程的默认优先级。默认优先级为\
  \ `5`。\n*   `static int MAX_PRIORITY`\n\n线程可以拥有的最高优先级。该值为 `10`。\n\n### 线程工厂与构建器\n\
  \n你通常希望产生多个具有相同属性的线程。`ThreadFactory` 接口有一个方法\n\n```\nThread newThread(Runnable r)\n\
  ```\n\n产生一个新的线程实例，该实例在启动时将执行给定的 `Runnable`。\n\n你可以提供实现此接口的自定义类，或者从 Java 21 开始使用方便的构建器语法。\n\
  \n静态方法 `Thread.ofPlatform()` 和 `Thread.ofVirtual()`产生平台或虚拟线程的构建器。你可以对要构建的线程进行自定义：\n\
  \n```\nThread.Builder builder = Thread.ofVirtual().name(\"request-\", 1);\n```\n\
  \n更多自定义方法请参见 API 说明。\n\n然后调用 `unstarted` 或 `start` 获取单个线程，或调用 `factory` 获取线程工厂：\n\
  \n```\nThread t = builder.unstarted(myRunnable);\nbuilder.start(myRunnable);\n\n\
  ThreadFactory factory = builder.factory();\nt = factory.newThread(myRunnable);\n\
  ```\n\n`java.util.concurrent.ThreadFactory` 5.0\n\n*   `Thread newThread(Runnable\
  \ r)`\n\n创建一个线程，该线程在启动时调用给定的 `Runnable` 的 `run` 方法。\n\n`java.lang.Thread` 1.0\n\n\
  *   `Thread.Builder.OfPlatform ofPlatform()` 21\n\n\n\n\n* `Thread.Builder.OfVirtual\
  \ ofVirtual()` 21\n  为平台线程或虚拟线程创建一个构建器。\n\n`java.lang.Thread.Builder` 21\n\n* `Thread.Builder\
  \ name(String prefix, long start)`\n* `Thread.Builder name(String name)`\n  使构建的线程使用给定的前缀和给定起始值的计数器进行命名，或者使用给定的名称。\n\
  * `ThreadFactory factory()`\n  产生一个工厂，用于使用此构建器的配置创建线程。\n* `Thread unstarted(Runnable\
  \ task)`\n* `Thread start(Runnable task)`\n  构造一个执行给定任务的线程。第二个方法会启动该线程。\n* `Thread.Builder\
  \ uncaughtExceptionHandler(Thread.UncaughtExceptionHandler ueh)`\n  使构建的线程使用给定的未捕获异常处理器。\n\
  \n`java.lang.Thread.Builder.OfPlatform` 21\n\n* `Thread.Builder.OfPlatform daemon()`\n\
  * `Thread.Builder.OfPlatform daemon(boolean on)`\n  使构建线程成为守护线程，除非 `on` 为 `false`。\n\
  * `Thread.Builder.OfPlatform stackSize(long stackSize)`\n* `Thread.Builder.OfPlatform\
  \ group(ThreadGroup group)`\n* `Thread.Builder.OfPlatform priority(int priority)`\n\
  \  使构建的线程具有给定的栈大小提示、线程组或优先级（不建议）。\n\n## 协调任务\n\n将任务拆分为多个子任务，并在子任务结果就绪时对其进行组合这是一种常见做法。在接下来的章节中，你将看到\
  \ Java 并发框架提供的用于协调并发任务的工具。\n\n### Callables 和 Futures\n\n`Runnable` 封装了一个异步运行的任务；你可以将其看作一个没有参数且没有返回值的异步方法。`Callable`\
  \ 与 `Runnable` 类似，但它会返回一个值。`Callable` 接口是一个泛型类型，有一个方法 `call`。\n\n```\npublic interface\
  \ Callable<V>\n{\n   V call() throws Exception;\n}\n```\n\n类型参数是返回值的类型。例如，`Callable<Integer>`\
  \ 代表一个最终会返回 `Integer` 对象的异步任务。\n\n`Future` 持有异步任务的结果。当你调度一个任务进行执行时，你会得到一个 `Future`\
  \ 对象。通过使用 `Future` 对象，你可以在结果就绪时获取它。\n\n`Future<V>` 接口具有以下方法：\n\n```\nV get()\nV\
  \ get(long timeout, TimeUnit unit)\nV resultNow()\nThrowable exceptionNow()\nvoid\
  \ cancel(boolean mayInterrupt)\nboolean isCancelled()\nboolean isDone()\nFuture.State\
  \ state()\n```\n\n调用第一个 `get` 方法会阻塞，直到任务完成。第二个 `get` 方法同样会阻塞，但如果调用在任务完成前超时，则它会抛出\
  \ `TimeoutException`。如果运行任务的线程被中断，两个方法都会抛出 `InterruptedException`。如果任务因异常而终止，`get`\
  \ 方法将抛出 `ExecutionException`，其原因即为任务终止时的异常。\n\n如果任务已经完成，`get` 将立即返回。\n\n`resultNow`\
  \ 方法是 `get` 的非阻塞版本，只有在你确定任务已成功完成时才应该调用它。如果你知道任务失败了，可以通过 `exceptionNow` 方法获取终止时的异常。\n\
  \n你可以尝试使用 `cancel` 方法取消任务。如果任务尚未启动，它将被取消且永远不会启动。如果任务正在进行中，且 `mayInterrupt` 参数为 `true`，则任务会被中断，否则将运行到完成。\n\
  \nJava 中的任务取消始终需要任务实现者的配合。正如 第 10.3.2 节 所示，任务需要监控线程的中断状态。\n\n如果任务已完成（无论成功或失败）或已被取消，`isDone`\
  \ 方法返回 `true`。\n\n`state` 方法以 `Task.State` 枚举值的形式返回任务状态，共有四个值：\n\n* `RUNNING`: 任务尚未完成且未被取消\n\
  * `SUCCESS`: 任务成功完成\n* `FAILED`: 任务因异常而完成\n* `CANCELLED`: 任务被取消\n\n在调用 `resultNow`\
  \ 或 `exceptionNow` 之前，你应当先调用 `state` 方法。\n\n执行 `Callable` 的一种方法是使用 `FutureTask`，它它同时实现了\
  \ `Future` 和 `Runnable` 接口，因此你可以构造一个线程来运行它：\n\n```\nCallable<Integer> task = . .\
  \ .;\nvar futureTask = new FutureTask<Integer>(task);\nvar t = new Thread(futureTask);\
  \ // futureTask 是一个 Runnable\nt.start();\n. . .\nInteger result = futureTask.get();\
  \ // futureTask 是一个 Future\n```\n\n更常见的情况是将 `Callable` 传递给一个执行器。这是下一节的主题。\n\n要为\
  \ `Runnable` 获取 `Future`，可以调用：\n\n```\nvar futureTask = new FutureTask<Void>(myRunnable,\
  \ null);\n```\n\n`java.util.concurrent.Callable<V>` 5.0\n\n* `V call()`\n  运行一个产生结果的任务。\n\
  \n`java.util.concurrent.Future<V>` 5.0\n\n* `V get()`\n* `V get(long time, TimeUnit\
  \ unit)`\n  获取结果，阻塞直到结果可用或给定时间结束。如果任务被取消，则抛出 `CancellationException`；如果任务未成功完成，则抛出一个以终止异常为原因的\
  \ `ExecutionException`；如果当前线程被中断，则抛出 `InterruptedException`。如果调用在任务完成前已超时，则抛出 `TimeoutException`。\n\
  * `V resultNow()`\n  如果任务成功完成则获取结果，否则抛出 `IllegalStateException`。\n* `Throwable exceptionNow()`\n\
  \  如果任务未成功完成则获取终止异常，否则抛出 `IllegalStateException`。\n* `boolean cancel(boolean mayInterrupt)`\n\
  \  尝试取消此任务的执行。如果任务已经启动且 `mayInterrupt` 参数为 `true`，则会被中断。如果取消成功返回 `true`。\n* `boolean\
  \ isCancelled()`\n  如果任务在完成前被取消则返回 `true`。\n* `boolean isDone()`\n  如果任务已完成（无论成功或失败）或被取消，返回\
  \ `true`。\n* `Future.State state()`\n  返回任务的状态：`RUNNING`、`SUCCESS`、`FAILED` 或 `CANCELLED`。\n\
  \n`java.util.concurrent.FutureTask<V>` 5.0\n\n* `FutureTask(Callable<V> task)`\n\
  \  构造一个既是 `Future<V>` 是 `Runnable` 的对象。\n* `FutureTask(Runnable task, V result)`\n\
  \  构造一个对象，作为 `Runnable` 执行任务，作为 `Future<V>` 在完成后产生结果。\n\n### 执行器\n\n构造一个新的平台线程是昂贵的，因为涉及到系统的交互。如果程序创建大量的短生命平台线程，你不应该为每个任务运行一个单独的线程，而应该使用*线程池*。线程池包含一组准备好执行任务的线程。你将\
  \ `Runnable` 或 `Callable` 任务提交给池，池中的一个线程会调用 `run` 或 `call` 方法。当方法退出时，线程不会死亡，而是等待下一个请求。\n\
  \n*执行器*是你提交任务的对象。对于平台线程，那就是线程池。虚拟线程创建非常便宜，不应该被池化。虚拟线程的执行器只需为每个提交的任务启动一个新的虚拟线程。\n\
  \n`Executors` 类有许多静态工厂方法用于构造执行器。表 10.1 列出了最实用的方法。\n\n常用的执行器工厂方法\n\n| 方法 | 描述 |\n\
  | --- | --- |\n| `newCachedThreadPool` | 根据需要创建新线程；空闲线程保留 60 秒。 |\n| `newFixedThreadPool`\
  \ | 池包含固定数量的线程；空闲线程无限保留。 |\n\n\n\n\n\n| `newSingleThreadExecutor` | 一个带有单个线程的“池”，按顺序执行提交的任务。\
  \ | |\n| `newVirtualThreadPerTaskExecutor` | 一种在新的虚拟线程上运行每个任务的执行器。 |\n\n`newCachedThreadPool`\
  \ 方法构建一个线程池，该线程池会立即执行每个任务：在有空闲线程可用时重用它们，否则创建一个新线程。`newFixedThreadPool` 方法构建一个固定大小的线程池。如果提交的任务多于空闲线程的数量，未被服务的任务将放置在队列中。它们将在其他任务完成后被执行。`newSingleThreadExecutor`\
  \ 是一个大小为 1 的退化线程池，由单个线程一个接一个地执行提交的任务。\n\n当你有拥有生命周期较短或花费大量时间处于阻塞状态的平台线程时，请使用缓存线程池。然而，如果你有正在努力工作且不阻塞的线程，你就不希望同时运行大量此类线程。为了获得最佳速度，并发线程的数量应为处理器核心数。在这种情况下，你应该使用固定线程池来限制并发平台线程的总数。\n\
  \n使用固定线程池的另一个原因是限制并发任务的数量。如果许多任务访问一个只能处理有限数量并发客户端的服务，那么你可以使用线程池的大小来强制执行该限制。这是一种相当粗略的应用程序调优方法，但因为它很容易实现，所以非常常见。\n\
  \n如果你的应用程序使用虚拟线程，你需要想出替代机制来限制并发请求，例如计数信号量或边界队列。\n\n例如，这段代码片段限制了并发网络请求的数量：\n\n```\n\
  private static final int CONCURRENT_REQUESTS = 200;\nprivate static final Semaphore\
  \ SEMAPHORE = new Semaphore(CONCURRENT_REQUESTS);\n...   \npublic static String\
  \ get(URI uri) throws InterruptedException, IOException {\n   var request = HttpRequest.newBuilder().uri(uri).GET().build();\n\
  \   SEMAPHORE.acquire();\n   try {\n      return client.send(request, HttpResponse.BodyHandlers.ofString()).body();\n\
  \   } finally {\n      SEMAPHORE.release();\n   }\n} \n```\n\n在并发请求数量很高的情况下，`acquire`\
  \ 方法会阻塞。对于虚拟线程来说，这不是问题。为了有效的有效扩展，最好将阻塞移动到压力点，而不是线程池。\n\n单线程执行器对于性能分析可能有用。如果你临时将缓存线程池或固定线程池替换为单线程池，你可以衡量在没有并发优势的情况下你的应用程序运行速度慢了多少。\n\
  \n大多数 `Executors` 工厂方法都有一个带有 `ThreadFactory` 参数的版本，允许你自定义用于执行提交任务的线程。如果你为线程池提供了了自己的工厂，它应该产生平台线程而不是虚拟线程，因为池化虚拟线程永远是没用的。如果你想自定义虚拟线程，请向\
  \ `newThreadPerTaskExecutor` 方法传递一个虚拟线程的工厂。\n\n所有的 `Executors` 工厂方法都返回实现 `ExecutorService`\
  \ 接口的类对象。通过以下一个方法向 `ExecutorService` 提交 `Runnable` 或 `Callable`：\n\n```\nFuture<T>\
  \ submit(Callable<T> task)\nFuture<?> submit(Runnable task)\nFuture<T> submit(Runnable\
  \ task, T result)\n```\n\n当你调用 `submit` 时，执行器会调度提交的任务。你将获得一个 `Future` 对象，你可以使用它来获取结果或取消任务。\n\
  \n第二个 `submit` 方法返回一个 `Future<?>`。`get` 方法会阻塞直到完成，然后返回 `null`。\n\n`java.util.concurrent`\
  \ API 中的其他方法返回 `Future<Void>` 而不是 `Future<?>`。在所有实际用途中，这些类型具有相同的功能。你可以实例来查询任务状态并阻塞直到任务完成，但没有结果值。\n\
  \n第三种版本的 `submit` 产生一个 `Future`，其 `get` 方法在完成后会返回指定的 `result` 对象。\n\n当你完成对执行器的使用后，请调用\
  \ `close` 方法。关闭的执行器不再接受新任务。`close` 方法会阻塞直到所有提交的任务执行完毕。（如果调用 `close` 的线程被中断，则提交的任务将被取消。）调用\
  \ `close` 的方便方法是使用 try-with-resources 语句：\n\n```\ntry (ExecutorService executor\
  \ = Executors.newVirtualThreadPerTaskExecutor()) {\n   . . .\n   Future<V> f = submit(myCallable);\n\
  \   . . .\n} // 在此处调用了 executor.close()\n```\n\n有些程序员将执行器视为全局资源。在某些情况下，全局执行器是有意义的，但你不应该犹豫是否使用本地执行器、提交几个任务然后将其关闭。这对于虚拟线程特别有用，因为对\
  \ `close` 的阻塞调用并不令人担心。\n\n还有其他关闭执行器方法：`shutdown`、`shutdownNow` 和 `awaitTermination`。它们提供了更细粒度的控制，并且旧代码中是必要的，因为\
  \ `close` 方法是在 Java 19 中引入的。如果你需要用旧版本的 Java 运行本节中的演示程序，请将调用 `executor.close()` 替换为：\n\
  \n```\nexecutor.shutdown();\nexecutor.awaitTermination(10, TimeUnit.MINUTES);\n\
  ```\n\n这里是使用执行器的总结：\n\n1. 调用 `Executors` 类的静态方法之一，最常用 `newCachedThreadPool`、`newFixedThreadPool`\
  \ 或 `newVirtualThreadPerTaskExecutor`。\n2. 调用 `submit` 提交 `Callable` 或 `Runnable`\
  \ 对象。\n3. 保留返回的 `Future` 对象以便查询任务状态、获取结果或取消任务。\n4. 当你不再想要提交任务时关闭执行器。\n\n当执行器使用来自工厂的线程时，设置工厂的未捕获异常处理器无效。线程池需要安装自己的处理器来捕获任务异常。\n\
  \n`java.util.concurrent.Executors` 5.0\n\n* `static ExecutorService newCachedThreadPool()`\n\
  * `static ExecutorService newCachedThreadPool(ThreadFactory threadFactory)`\n  返回一个需要时创建线程并在空\
  \ 60 秒后终止线程的缓存线程池。\n* `static ExecutorService newFixedThreadPool(int threads)`\n\
  * `static ExecutorService newFixedThreadPool(int threads, ThreadFactory threadFactory)`\n\
  \  返回一个使用给定数量线程执行任务的线程池。\n* `static ExecutorService newSingleThreadExecutor()`\n\
  * `static ExecutorService newSingleThreadExecutor(ThreadFactory threadFactory)`\n\
  \  返回一个单线程顺序执行任务的执行器。\n* `static ExecutorService newVirtualThreadPerTaskExecutor()`\
  \ 21\n* `static ExecutorService newThreadPerTaskExecutor(ThreadFactory threadFactory)`\
  \ 21\n  返回一个在新的虚拟线程或由给定工厂产生的线程上执行每个任务的执行器。\n\n`java.util.concurrent.ExecutorService`\
  \ 5.0\n\n* `Future<T> submit(Callable<T> task)`\n* `Future<T> submit(Runnable task,\
  \ T result)`\n* `Future<?> submit(Runnable task)`\n  提交给的任务进行执行。\n* `void close()`\
  \ 19\n  将执行器设置为关闭模式，使其不再接受新提交，并阻塞直到已提交的任务完成。如果在阻塞期间被中断，正在运行的任务将被中断。\n* `void shutdown()`\n\
  \  将执行器设置为关闭模式，使其不再接受新提交。此方法不会阻塞等待提交的任务完成。\n* `List<Runnable> shutdownNow()`\n \
  \ 将执行器设置为关闭模式，中断已启动的任务，并移除尚未启动的任务。返回被移除的任务列表。此方法不会阻塞等待提交的任务完成。\n\n\n\n\n\n*   `boolean\
  \ awaitTermination(long timeout, TimeUnit unit)`\n\n阻塞直到所有提交的任务已完成、超时到达，或者阻塞操作被中断。如果所有任务都已完成，则返回\
  \ `true`。\n\n### 调用一组任务\n\n通常，你希望启动多个并发任务并获取第一个成功任务的结果，或者合并所有完成任务的结果。\n\n`invokeAny`\
  \ 方法提交 `Callable` 对象集合中的所有任务，并阻塞直到其中一个任务成功完成，然后返回其结果。任何未完成的任务都将被取消。你并不知道是哪个任务成功了——推测它应该是完成得最快的那一个。如果没有任务执行成功，则会抛出\
  \ `ExecutionException`。\n\n将此方法用于搜索问题，在此类问题中你愿意接受任何解决方案。例如，假设你需要找到一个大整数的因数——这是破解\
  \ `RSA` 密所需的计算。你可以提交多个任务，每个任务尝试对不同范围内的数字进行因数式分解。只要其中一个任务有了答案，你的计算就可以停止。\n\n`invokeAll`\
  \ 方法提交 `Callable` 对象集合中的所有任务，阻塞直到所有任务都完成，并返回一个 `Future` 对象列表，这些对象代表所有任务的解决方案，顺序与提交任务的顺序相同。你可以这样处理计算结果：\n\
  \n```\nList<Callable<T>> tasks = . . .;\nList<Future<T>> results = executor.invokeAll(tasks);\n\
  for (Future<T> result : results) {\n   if (result.state() == Future.State.SUCCESS)\n\
  \      process result.resultNow();\n   else\n      handle result.exceptionNow();\n\
  }\n```\n\n对 `invokeAll` 的调用会阻塞直到所有任务完成。如果你想按照结果可用的顺序获取结果，请使用 `ExecutorCompletionService`。\n\
  \n通过通常方式获取执行器。然后构造一个 `ExecutorCompletionService`。将任务提交给完成服务。该服务管理一个 `Future` 对象的阻塞队列，当提交的任务的结果可用时将其包含：\n\
  \n```java\nvar service = new ExecutorCompletionService<T>(executor);\nfor (Callable<T>\
  \ task : tasks) service.submit(task);\nfor (int i = 0; i < tasks.size(); i++) {\n\
  \   Future<T> result = service.take();\n}\n```\n\n程序 `Listing 10.3` 展示了如何使用 callables\
  \ 和执行器。在第一次计算中，我们统计目录树中多少个文件包含给单词。我们为每个文件创建一个单独的任务：\n\n```java\nSet<Path> files\
  \ = descendants(Path.of(start));\nvar tasks = new ArrayList<Callable<Long>>();\n\
  for (Path file : files)\n{\n   Callable<Long> task = () -> occurrences(word, file);\
  \          \n   tasks.add(task);\n}\n```\n\n然后我们将任务提交给执行器服务：\n\n```java\nExecutorService\
  \ executor = Executors.newCachedThreadPool();\nList<Future<Long>> results = executor.invokeAll(tasks);\n\
  ```\n\n为了获取合并后的计数，我们相加所有结果，阻塞直到它们可用：\n\n```java\nlong total = 0;\nfor (Future<Long>\
  \ result : results)\n   total += result.get();\n```\n\n程序还显示了搜索期间花费的时间。在某处解压 JDK\
  \ 源代码并运行搜索。然后将执行器服务替换为单线程执行器并再次尝试，看看并发计算是否更快。也可以尝试使用虚拟线程（virtual threads）。\n\n在程序的第二部分，我们搜索第一个包含给定单词的文件。我们使用\
  \ `invokeAny` 来并行搜索。在这里，我们必须更仔细地构建任务。`invokeAny` 方法一旦任何任务返回就会终止。因此，我们不能让搜索任务返回一个\
  \ `boolean``。我们不希望在任务失败时停止搜索。相反，失败的任务会抛出一个 `NoSuchElementException`。此外，当一个任务成功时，其他任务会被取消。因此，我们监控中断状态。如果底层线程被中断，搜索任务会在终止前打印消息，这样你就能看到取消是有效的。\n\
  \n```java\npublic static Callable<Path> searchForTask(String word, Path path)\n\
  {\n   return () ->\n      {\n         try (var in = new Scanner(path))\n       \
  \  {\n            while (in.hasNext())\n            {\n               if (in.next().equals(word))\
  \ return path;\n               if (Thread.currentThread().isInterrupted())\n   \
  \            {\n                  System.out.println(\"Search in \" + path + \"\
  \ canceled.\");\n                  return null;\n               }\n            }\n\
  \            throw new NoSuchElementException();\n         }\n      };\n}\n```\n\
  \n正如结构化编程用分支、循环和函数取代了“goto”语句一样，*结构化并发*（structured concurrency）是一种寻找能够更容易对并发程序进行推理的构造的努力。\n\
  \nJava 21 包含一个结构化并发 API 的预览。任务被提交到 `StructuredTaskScope` 中。然后 `join` 方法会阻塞直到作用域根据作用域的关闭策略关闭。该\
  \ API 提供了两种简单的策略：`ShutdownOnFailure` 和 `ShutdownOnSuccess`。以下是一个用法示例：\n\n```java\n\
  // Java 21 预览 API\ntry (var scope = new StructuredTaskScope.ShutdownOnFailure())\
  \ {\n   Supplier<T1> f1 = scope.fork(callable1);\n   Supplier<T2> f2 = scope.fork(callable2);\n\
  \   scope.join();\n   scope.throwIfFailed();\n   result = combine(f1.get(), f2.get());\n\
  }\n```\n\n当 `try` 块结束，我们可以确定所有的子任务都已完成。\n\n如果任何子任务失败，作用域将关闭，取消另一个任务，并重抛第一个异常。\n\n\
  如果当前线程被中断，作用域将关闭且两个任务都会被取消。\n\n你可以通过 `ExecutorService.invokeAll` 实现几乎相同的效果，但 `invokeAll`\
  \ 即使在其中一个失败时也会等待所有任务完成。如果你倾向于这种策略，实现一个作用域子类是简单的。\n\n结构化编程 API 是灵活且方便的，并为作用域的嵌套提供了运行时检查和可观测性功能。\n\
  \n`executors/ExecutorDemo.java`\n\n\n\n\n\n```java\npackage executors;\n\nimport\
  \ java.io.*;\nimport java.nio.file.*;\nimport java.time.*;\nimport java.util.*;\n\
  import java.util.concurrent.*;\nimport java.util.stream.*;\n\n/**\n * 此程序演示了 Callable\
  \ 接口和 executors。\n * @version 1.02 2023-07-27\n * @author Cay Horstmann\n */\npublic\
  \ class ExecutorDemo\n{\n   /**\n    * 统计文件中给定单词的出现次数。\n    * @return 单词在给定文件中出现的次数\n\
  \    */\n   public static long occurrences(String word, Path path)\n   {\n     \
  \ try (var in = new Scanner(path))\n      {\n         int count = 0;\n         while\
