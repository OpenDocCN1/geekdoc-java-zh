  \n\n\n\n```java\npackage arrayList;\n\nimport java.util.*;\n\n/**\n * 此程序演示了 ArrayList\
  \ 类。\n * @version 1.11 2012-01-26\n * @author Cay Horstmann\n */\npublic class ArrayListTest\n\
  {\n   public static void main(String[] args)\n   {\n      // 用三个 Employee 对象填充 staff\
  \  列表\n      var staff = new ArrayList<Employee>();\n\n      staff.add(new Employee(\"\
  Carl Cracker\", 75000, 1987, 12, 15));\n      staff.add(new Employee(\"Harry Hacker\"\
  , 50000, 1989, 10, 1));\n      staff.add(new Employee(\"Tony Tester\", 40000, 1990,\
  \ 3, 15));\n\n      // 将每个人的工资提高 5%\n      for (Employee e : staff)\n         e.raiseSalary(5);\n\
  \n      // 打印所有 Employee 对象的信息\n      for (Employee e : staff)\n         System.out.println(\"\
  name=\" + e.getName() + \",salary=\" + e.getSalary() + \",hireDay=\" \n        \
  \    + e.getHireDay());\n   }\n}\n```\n\n`java.util.ArrayList<E>` 1.2\n\n* `E set(int\
  \ index, E obj)`\n    将值 `obj` 置于数组列表指定的索引处，并返回之前的内容。\n\n* `E get(int index)`\n\
  \    获取存储在指定索引处的值。\n\n* `void add(int index, E obj)`\n    向上移动元素以便在指定的索引处插入 `obj`。\n\
  \n* `E remove(int index)`\n    移除指定索引处的元素，并向下移动其上方的所有元素。返回被移除的元素。\n\n### 类型化列表与原始列表之间的兼容性\n\
  \n在在你自己的代码中，你总是希望使用类型参数来增加安全性。在本节，你将看到如何与不使用类型参数的旧代码进行交互操作。\n\n假设你有以下遗留类：\n\n```java\n\
  public class EmployeeDB\n{\n   public void update(ArrayList list) { . . . }\n  \
  \ public ArrayList find(String query) { . . . }\n}\n```\n\n你可以将类型化列表传递给 `update`\
  \ 方法，而无需任何强制转换。\n\n```java\nArrayList<Employee> staff = . . .;\nemployeeDB.update(staff);\n\
  ```\n\n`staff` 对象被简单地传递给了 `update` 方法。\n\n尽管编译器没有产生任何错误或警告，但此调用并不是完全安全的。`update`\
  \ 方法可能会向数组列表中添加不是 `Employee` 类型的元素。当这些元素被取回时，会发生异常。这听起来很可怕，但如果你仔细考虑，这种行为仅仅与 Java\
  \ 添加泛型之前的行为完全一致。虚拟机的完整性永远不会受到威胁。在这种情况下，你没有丢失安全性，但也无法从编译时检查中受益。\n\n相反，当你将一个原始 `ArrayList`\
  \ 赋值给类型化列表时，你会得到一个警告。\n\n```java\nArrayList<Employee> result = employeeDB.find(query);\
  \ // 产生警告\n```\n\n要查看警告文本，请使用选项 `-Xlint:unchecked` 进行编译。\n\n使用强制转换并不能消除警告。\n\n```java\n\
  ArrayList<Employee> result = (ArrayList<Employee>) employeeDB.find(query); \n  \
  \ // 产生另一个警告\n```\n\n相反，你会得到一个不同的警告，告诉该强制转换是误导性的。\n\n这是 Java 泛型某种相当遗憾的局限性导致的后果。为了兼容性，编译器在检查未违反类型规则后，会将所有类型化列表转换为原始\
  \ `ArrayList` 对象。在运行的程序中，所有的数组列表都是相同的——虚拟机中没有类型参数。因此，强制转换 `(ArrayList)` 和 `(ArrayList<Employee>)`\
  \ 执行的是相同的运行时检查。\n\n对于这种情况，你无能为力。当你与遗留代码交互时，请研究编译器警告，并确保这些警告并不严重。\n\n一旦你满意了，可以使用\
  \ `@SuppressWarnings(\"unchecked\")` 注解标记接收强制转换的变量，如下：\n\n```java\n@SuppressWarnings(\"\
  unchecked\") ArrayList<Employee> result\n      = (ArrayList<Employee>) employeeDB.find(query);\
  \ // 产生另一个警告\n```\n\n### 包装类与自动装箱（Autoboxing）\n\n有时，你需要将基本数据类型（如 `int`）转换为对象。所有基本类型都有对应的类。例如，`Integer`\
  \ 类对应于基本类型 `int`。这类类通常被称为包装类（wrappers）。包装类的名称非常直观：`Integer`、`Long`、`Float`、`Double`、`Short`、`Byte`、`Character`\
  \ 和 `Boolean。（前六个继承自公共父类 `Number`）。包装类是不可变的——在包装器构造之后，你无法更改被包装的值。它们也是 `final` 的，所以你不能对其进行子类。\n\
  \n假设我们需要一个整数列表。遗憾的是，括号内的类型参数不能是基本类型。无法形成 `ArrayList<int>`。这里 `Integer` 包装类派上用场了。声明一个\
  \ `Integer` 对象列表是可以的。\n\n```java\nvar list = new ArrayList<Integer>();\n```\n\n\
  `ArrayList<Integer>` 的效率远低于 `int[]` 数组，因为每个值都单独封装在一个对象内部。只有当程序员的便利性比效率更重要时，你才想要使用这种结构。\n\
  \n幸运的是，有一个实用的功能可以轻松地向 `ArrayList<Integer>` 添加 `int` 类型的元素。调用\n\n```java\nlist.add(3);\n\
  ```\n\n会被转换为：\n\n```java\nlist.add(Integer.valueOf(3));\n```\n\n这种转换被称为自动装箱（autoboxing）。\n\
  \n你可能认为自动包装（autowrapping）会更一致，但“装箱”（boxing）这个比喻源自 C#。\n\n相反，当你将一个 `Integer` 对象赋值给\
  \ `int` 值时，它会被自动拆箱（unboxed）。也就是说，编译器会将\n\n```java\nint n = list.get(i);\n```\n\n\
  ```java\nint n = list.get(i).intValue();\n```\n\n自动装箱和拆箱在算术表达式中也有效。例如，你可以对包装引用应用递增运算符：\n\
  \n```java\nInteger n = 3;\nn++;\n```\n\n编译器会自动插入指令来拆箱对象、增加结果的值，并将其重新装箱。\n\n在大多数情况下，你会产生一种基本类型及其包装类是同一物的错觉。它们仅在一个点上存在显著差异：标识性（identity）。如你所知，应用于包装对象的\
  \ `==` 运算符只测试对象是否具有相同的内存位置。以下比较可能会失败：\n\n```java\nInteger a = 1000;\nInteger b =\
  \ 1000;\nif (a == b) . . .\n```\n\n然而，Java 的实现可能会（如果选择的话）将常见的值封装成相同的对象，因此比较可能会成功。这种歧义并不是你想要的。补救措施是在比较包装对象时调用\
  \ `equals` 方法。\n\n自动装箱规范要求 `boolean`、`byte`、`char` <= 127、`short` 以及在 `-128` 到 `127`\
  \ 之间的 `int` 被封装成固定对象。例如，如果上例中的 `a` 和 `b` 被初始化为 `100`，那么比较将成功。\n\n永远不要依赖包装对象的标识性。不要用\
  \ `==` 比较它们，也不要把它们用锁（参见第 10 章）。\n\n不要使用包装类的构造函数。它们已被废弃并计划移除。例如，使用 `Integer.valueOf(1000)`，永远不要使用\
  \ `new Integer(1000)`。或者，简单地依赖自动装箱：`Integer a = 1000`。\n\n自动装箱还有其他细节。首先，由于包装类引用可以为\
  \ `null`，自动拆箱可能会抛出 `NullPointerException`：\n\n```java\nInteger n = null;\nSystem.out.println(2\
  \ * n); // 抛出 NullPointerException\n```\n\n此外，如果你在条件表达式中混合使用 `Integer` 和 `Double`\
  \ 类型，那么 `Integer` 值会被拆箱提升为 `double` 并装箱为 `Double`。\n\n```java\nInteger n = 1;\n\
  Double x = 2.0;\nSystem.out.println(true ? n : x); // 打印 1.0\n```\n\n\n\n最后，让我们强调一下，装箱和拆箱（boxing\
  \ and unboxing）是`compiler`提供的便利，而不是虚拟机。编译器在生成类的字节码时会插入必要的调用。虚拟机仅仅是执行这些字节码。\n\nJava\
  \ 的未来版本将允许 `value types`（值类型），这是一种类似于基本类型的用户定义类型——其值不存储在对象内部。例如，具有 `double` 字段 `x`\
  \ 和 `y` 的基本类型 `Point` 的值在内存中一个 16 字节的块，包含两个相邻的 `double` 值。你可以复制它，但无法拥有它的引用。\n\n\
  计划在未来的某个时刻，基本类型包装类将成为值类（value classes）。\n\n你经常因为另一个原因看到数字包装类。Java 的设计者发现包装类是放置某些基本方法的方便地方，例如将数字字符串转换为数字的方法。\n\
  \n要将字符串转换为整数，请使用以下语句：\n\n```\nint x = Integer.parseInt(s);\n```\n\n这与 `Integer`\
  \ 对象无关——`parseInt` 是一个静态方法。但 `Integer` 类是一个放置它的好地方。\n\n`parseInt` 方法及其对应的 `parseDouble`\
  \ 方法 intended 并不是解析用户输入。它们支持在 Java API 中描述的特定格式，该格式与十进制 Java 字面量的格式相似，但不包含下划线。要解析人类输入，请使用\
  \ `Scanner`。它的 `nextInt` 和 `nextDouble` 方法使用当前的区域设置或你指定的区域设置，以便用户输入他们熟悉的数字和分隔符。\n\
  \nAPI 注释显示了 `Integer` 类的一些更重要的方法。其他数字类实现了相应的方法。\n\n包装类还定义了常量。对于所有整数包装类型，`MIN_VALUE`\
  \ 和 `MAX_VALUE` 是该类型的最小值和最大值。例如，`Integer.MIN_VALUE` 是 `-2147483648`，`Integer.MAX_VALUE`\
  \ 是 `2147483647`。这里有一个典型的示例：\n\n```\nint largest = Integer.MIN_VALUE; // 替换为第一个输入\n\
  while (in.hasNextInt()) largest = Math.max(largest, in.nextInt());\n```\n\n`Double`\
  \ 和 `Float` 类的 `MIN_VALUE` 常量是最小正值。如果你想计算最大的浮点数且可能存在负输入，你需要使用：\n\n```\nint largest\
  \ = -Double.MAX_VALUE; // 请勿使用 Double.MIN_VALUE\nwhile (in.hasNextDouble()) largest\
  \ = Math.max(largest, in.nextDouble());\n```\n\n有些人认为可以使用包装类来实现可以修改数值参数的方法。然而，这是不正确的。回想\
  \ 第 4 章，编写一个可以增加整数参数的 Java 方法是不可能的，因为 Java 方法的参数总是按值传递的。\n\n```\npublic static void\
  \ triple(int x) // 不起作用\n{\n   x = 3 * x; // 修改了局部变量\n}\n```\n\n我们可以通过使用 `Integer`\
  \ 代替 `int` 来克服这个问题吗？\n\n```\npublic static void triple(Integer x) // 不起作用\n{\n \
  \  . . .\n}\n```问题是 `Integer` 对象是不可变的：包装器内部包含的信息不能改变。你不能使用这些包装类创建一个修改数值参数的方法。\n\n\
  `java.lang.Integer` 1.0\n\n*   `int intValue()`\n    返回此 `Integer` 对象的 `int` 值（重写了\
  \ `Number` 类中的 `intValue` 方法）。\n*   `static String toString(int i)`\n    返回一个表示\
  \ 10 进制数字 `i` 的新 `String` 对象。\n*   `static String toString(int i, int radix)`\n\
  \    允许你返回按 `radix` 参数指定的基数的数字 `i` 的表示。\n*   `static int parseInt(String s)`\n*\
  \   `static int parseInt(String s, int radix)`\n    返回字符串 `s` 中包含数字的整数。该字符串必须表示\
  \ 10 进制整数（对于第一个方法）或 `radix` 参数指定的基数的整数（对于第二个方法）。\n*   `static Integer valueOf(String\
  \ s)`\n*   `static Integer valueOf(String s, int radix)`\n    返回一个新的 `Integer` 对象，其初始化为字符串\
  \ `s` 中包含数字的整数。该字符串必须表示 10 进制整数（对于第一个方法）或 `radix` 参数指定的基数的整数（对于第二个方法）。\n\n`java.text.NumberFormat`\
  \ 1.1\n\n*   `Number parse(String s)`\n    返回数值，假设指定的 `String` 代表一个数字。\n\n## 具有可变数量参数的方法\n\
  \n可以使用可变数量参数调用的方法。这些方法有时被称为“可变参数”（varargs）方法。\n\n你已经见过这样的方法了：`printf`。例如，以下调用\n\n\
  ```\nSystem.out.printf(\"%d\", n);\n```\n\n和\n\n```\nSystem.out.printf(\"%d %s\"\
  , n, \"widgets\");\n```\n\n它们都调用了同一个方法，尽管一个调用有两个参数而另一个调用有三个。\n\n`printf` 方法定义如下：\n\
  \n```\npublic class PrintStream\n{\n   public PrintStream printf(String fmt, Object...\
  \ args)\n   {\n      return format(fmt, args);\n   }\n}\n```\n\n## 抽象类\n\n随着你在继承层次结构移动，类变得越来越通用，可能越来越抽象。在某个时刻，祖类变得如此通用，以至于你更多地将其视为其他类的基础，而不是想要使用的特定实例的类。例如，考虑我们\
  \ `Employee` 类层次结构的扩展。员工是人，学生也是人。让我们扩展类层次结构以包含 `Person` 和 `Student` 类。图 5.2 显示了这些类之间的继承关系。\n\
  \n![图](img/05_02.jpg)`Person` 及其子类的继承图\n\n为什么要费力进行如此高层次的抽象呢？某些属性对每个人都有意义，例如姓名。学生和员工都有姓名，引入一个共同的父类让我们能够将\
  \ `getName` 方法提取到继承层次结构中更高级别。\n\n\n\n现在让我们添加另一个方法 `getDescription`，其目的是返回关于该人的简短描述，例如：\n\
  \n```\nan employee with a salary of $50,000.00\na student majoring in computer science\n\
  ```\n\n对于 `Employee` 和 `Student` 类来说，实现这个方法很容易。但你可以在 `Person` 类中提供什么信息呢？除了姓名之外，`Person`\
  \ 类对该人一无所知。当然，你可以实现 `Person.getDescription()` 来返回一个空字符串。但有更好的更好的方法。如果你使用 `abstract`（抽象）关键字，你根本不需要实现该方法。\n\
  \n```java\npublic abstract String getDescription();\n   // 不需要实现\n```\n\n为了更加清晰起见，包含一个或多个抽象方法的类本身必须声明为抽象类（abstract）。\n\
  \n```java\npublic abstract class Person\n{\n   . . .\n   public abstract String\
  \ getDescription();\n}\n```\n\n除了抽象方法外，抽象类还可以拥有字段和具体方法。例如，`Person` 类存储了人的姓名，并有一个返回该姓名的具体方法。\n\
  \n```java\npublic abstract class Person\n{\n   private String name;\n\n   public\
  \ Person(String name)\n   {\n      this.name = name;\n   }\n\n   public abstract\
  \ String getDescription();\n\n   public String getName()\n   {\n       return name;\n\
  \   }\n}\n```\n\n有些程序员并没有意识到抽象类可以拥有具体方法。你应该始终将公共字段和方法（无论是否为抽象）移动到父类中（无论是否为抽象类）。\n\
  \n抽象方法充当子类中实现方法的占位符。当你扩展一个抽象类时，你有两个选择：你可以留一些或所有抽象方法不定义；那么，你必须也将该子类标记为抽象（abstract）。或者，你可以定义所有方法，这样子类就不再是抽象的。\n\
  \n例如，我们将定义一个继承抽象 `Person` 类的 `Student` 类，并实现 `getDescription` 方法。`Student` 类中的任何方法都不是抽象的，因此它不需要被声明为抽象类。\n\
  \n一个类即使没有抽象方法，也可以被声明为 `abstract`。\n\n抽象类不能被实例化。也就是说，如果一个类被声明为 `abstract`，那么就无法创建该类的对象。例如，表达式\n\
  \n```java\nnew Person(\"Vince Vu\")\n```\n\n是一个错误。然而，你可以创建具体子类的对象。\n\n注意，你仍然可以创建抽象类的*对象变量*（object\
  \ variables），但这样的变量必须引用一个非抽象子类的对象。例如：\n\n```java\nPerson p = new Student(\"Vince\
  \ Vu\", \"Economics\");\n```\n\n这里 `p` 是一个抽象类型 `Person` 的变量，它指向非抽象子类 `Student` 的实例。\n\
  \n在 C++ 中，抽象方法被称为*纯虚拟函数*（pure virtual function），并带有尾随的 `= 0` 标记如下所示：\n\n```cpp\n\
  class Person // C++\n{\npublic:\n   virtual string getDescription() = 0;\n   . .\
  \ .\n};\n```\n\n如果一个 C++ 类至少有一个纯虚拟函数，那么它就是抽象类。在 C++ 中，没有特殊的关键字来表示抽象类。\n\n让我们定义一个继承抽象类\
  \ `Person` 的具体子类 `Student`：\n\n```java\npublic class Student extends Person\n{\n\
  \   private String major;\n\n   public Student(String name, String major)\n   {\n\
  \      super(name);\n      this.major = major;\n   }\n\n   public String getDescription()\n\
  \   {\n      return \"a student majoring in \" + major;\n   }\n}\n```\n\n`Student`\
  \ 类定义了 `getDescription` 方法。因此，`Student` 类中的所有方法都是具体方法，该类不再是一个抽象类。\n\nListing 5.8\
  \ 所示的程序定义了抽象父类 `Person`（Listing 5.9）以及两个具体子类 `Employee`（Listing 5.10）和 `Student`（Listing\
  \ 5.11）。我们用员工和学生对象填充一个 `Person` 引用数组：\n\n```java\nvar people = new Person[2];\n\
  people[0] = new Employee(. . .);\npeople[1] = new Student(. . .);\n```\n\n然后我们打印这些对象的姓名和描述：\n\
  \n```java\nfor (Person p : people)\n   System.out.println(p.getName() + \", \" +\
  \ p.getDescription());\n```\n\n有些人对下面的调用感到困惑\n\n```\np.getDescription()\n```\n\n\
  这难道不是对一个未定义方法的调用吗？请记住，变量 `p` 永远不会引用 `Person` 对象，因为构造抽象 `Person` 类的对象是不可能的。变量 `p`\
  \ 始终引用具体子类的对象，如 `Employee` 或 `Student`。对于这些对象，`getDescription` 方法是定义过的。\n\n你是否可以完全从\
  \ `Person` 父类中省略抽象方法，而仅仅在 `Employee` 和 `Student` 子类中定义 `getDescription` 方法呢？如果你那样做，你将无法在变量\
  \ `p` 上调用 `getDescription` 方法。编译器确保你只调用在类中声明的方法。\n\n抽象方法是 Java 编程语言中的一个重要概念。你最常在*接口*（interfaces）内部遇到它们。有关接口的更多信息，请参阅第\
  \ 6 章。\n\n\n\n\n```\nSize s = . . .;\nString abbrev = switch (s)\n   {\n      case\
  \ SMALL -> \"S\"; \n      . . .\n   };\n```\n\n### 3. 你可以静态导入枚举中的所有常量：\n\n```java\n\
  import com.horstmann.util.Size;\nimport static com.horstmann.util.Size.*;\n. . .\n\
  Size s = SMALL; \n```\n\n你不能从默认包中的枚举静态导入常量。例如，如果 `Size` 在默认包中，你无法使用\n\n```\nimport\
  \ static Size.*;\n```\n\n由 `enum` 声明定义的类型实际上上是一个类。该类恰好有四个实例——无法构造新对象。\n\n因此，你永远不需要对枚举类型使用\
  \ `equals`。直接使用 `==` 来比较它们即可。\n\n你可以在最后一个值之后放置一个逗号。如果你预计值的数量会增加，尾随逗号非常有用。\n\n```java\n\
  public enum Size\n{\n   SMALL,\n   MEDIUM,\n   LARGE,\n   EXTRA_LARGE,\n   XXL,\n\
  \   // 在此处添加更多值并在每个值后加上逗号\n}\n```\n\n所有枚举类型都是抽象类 `Enum` 的子类。它们从该类继承了许多方法。最有用的方法是\
  \ `name`，它返回枚举常量的名称。例如，`Size.SMALL.toString()` 返回字符串 `\"SMALL\"`。\n\n默认情况下，`toString`\
  \ 方法返回 `name`。然而，你可以重写 `toString`，而 `name` 是 `final` 的。\n\n`name` 的逆操作是静态的 `valueOf`\
  \ 方法。例如，语句\n\n```java\nSize s = Enum.valueOf(Size.class, \"SMALL\");\n```\n\n将 `s`\
  \ 设置为 `Size.SMALL`。\n\n每个枚举类型都有一个静态的 `values` 方法，返回该枚举所有值的数组。例如，调用\n\n```java\n\
  Size[] values = Size.values();\n```\n\n返回包含元素 `Size.SMALL`、`Size.MEDIUM`、`Size.LARGE`\
  \ 和 `Size.EXTRA_LARGE` 的数组。\n\n`ordinal` 方法产生枚举常量在 `enum` 声明中的位置，从零开始计数。例如，`Size.MEDIUM.ordinal()`\
  \ 返回 `1`。\n\n如果你愿意，可以为枚举类型添加构造函数、方法和字段。当然，构造函数只在构造实例时被调用。这里有一个示例：\n\n```java\npublic\
  \ enum Size\n{\n   SMALL(\"S\"), MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"XL\"\
  );\n\n   private final String abbreviation;\n\n   Size(String abbreviation) { this.abbreviation\
  \ = abbreviation; }\n      // 自动为私\n\n   public String getAbbreviation() { return\
  \ abbreviation; }\n}\n```\n\n当 `enum` 拥有字段或方法时，必须用分号结束常量列表，如上面的示例所示。\n\n尾随逗号后分号是合法的。\n\
  \n你甚至可以在每个实例中重写方法：\n\n```java\npublic enum Size\n{\n   SMALL,\n   MEDIUM,\n   LARGE,\n\
  \   EXTRA_LARGE\n   {\n      public String toString() { return \"XL\"; }\n   };\n\
  }\n```\n\n然而，这并不常见。在前面的示例中，`EXTRA_LARGE` 是 `Size` 子类的实例。除外，你不能为枚举创建子类。\n\n枚举的构造函数始终是私有的。你可以省略\
  \ `private` 修饰符，如前面的示例所示。将枚举构造函数声明为 `public` 或 `protected` 是语法错误。\n\n枚举类的构造函数不能在正在构造的实例上执行\
  \ `switch`：\n\n```java\npublic enum Size\n{\n   SMALL, MEDIUM, LARGE, EXTRA_LARGE;\n\
  \   private final boolean largish;\n   Size()\n   {\n      largish = switch (this)\
  \ // 错误\n         {\n            case LARGE, EXTRA_LARGE -> true;\n            default\
  \ -> false;\n         };\n   }\n}\n```\n\n这种奇特的限制是由对 `enum` 使用 `switch` 的实现策略引起的。每个\
  \ `switch` 都会查询一个数组，该数组将当前定义的枚举常量的序数值映射到 `switch` 编译时的序数值。这些数组只有在 `enum` 实例构造完成后才能被构建。\n\
  \n在方法中，这样的 `switch` 工作运行良好。\n\n列表 5.12 中的简短程序演示了如何处理枚举类型。\n\n`Enum` 类有一个类型参数，为了简单起见，我忽略了它。例如，枚举类型\
  \ `Size` 实际上扩展了 `Enum<Size>`。该类型参数用于 `compareTo` 方法。（我在第 6 章 中讨论了 `compareTo` 方法，并在第\
  \ 8 章 中讨论了类型参数。）\n\nenums/EnumTest.java\n\n```java\npackage enums;\n\nimport java.util.*;\n\
  \n/**\n * 此程序演示了枚举类型。\n * @version 1.0 2004-05-24\n * @author Cay Horstmann\n */\n\
  public class EnumTest\n{  \n   public static void main(String[] args)\n   {  \n\
  \      var in = new Scanner(System.in);\n      System.out.print(\"Enter a size:\
  \ (SMALL, MEDIUM, LARGE, EXTRA_LARGE) \");\n      String input = in.next().toUpperCase();\n\
  \      Size size = Enum.valueOf(Size.class, input);\n      System.out.println(\"\
  size=\" + size);\n      System.out.println(\"abbreviation=\" + size.getAbbreviation());\n\
  \      if (size == Size.EXTRA_LARGE)\n         System.out.println(\"Good job--you\
  \ paid attention to the _.\");      \n   }\n}\n\nenum Size\n{\n   SMALL(\"S\"),\
  \ MEDIUM(\"M\"), LARGE(\"L\"), EXTRA_LARGE(\"XL\");\n\n   private Size(String abbreviation)\
  \ { this.abbreviation = abbreviation; }\n   public String getAbbreviation() { return\
  \ abbreviation; }\n\n   private String abbreviation;\n}\n```\n\n`java.lang.Enum<E>`\
  \ 5.0\n\n*   `static Enum valueOf(Class enumClass, String name)`\n    返回给定类的给定名称枚举常量。\n\
  \n*   `String name()`\n    返回枚举常量的名称。\n\n*   `int ordinal()`\n    返回枚举常量在 `enum`\
  \ 声明中的零基位置。\n\n*   `int compareTo(E other)`\n    如果枚举常量在 `other` 之前，返回负整数；如果 `this\
  \ == other`，返回零；否则返回正整数。常量的顺序由 `enum` 声明决定。\n\n### 密封类\n\n除非一个类被声明为 `final`，否则任何人都可以形成它的子类。如果我们想要更多的控制呢？例如，假设你需要编写自己的\
  \ JSON 库，因为现有的没有完全符合你的需求。\n\nJSON 标准规定 JSON 值是数组、数字、字符串、布尔值、对象或空。一种明显的方法是使用 `JSONArray`、`JSONNumber`\
  \ 等类扩展抽象类 `JSONValue`：\n\n```java\npublic abstract class JSONValue\n{\n   // 适用于所有\
  \ JSON 值的方法\n}\n\npublic final class JSONArray extends JSONValue\n{\n   . . .\n\
  }\n\npublic final class JSONNumber extends JSONValue\n{\n   . . .\n}\n```\n\n通过将\
  \ `JSONArray`、`JSONNumber` 等类声明为 `final`，我们可以确保没有人形成子类。但我们无法阻止任何人为 `JSONValue` 形成另一个子类。我们为什么可能需要那种控制？考虑以下代码：\n\
  \n```java\nJSONValue v = . . .;\nif (v instanceof JSONArray a) . . .\nelse if (v\
  \ instanceof JSONNumber n) . . .\nelse if (v instanceof JSONString s) . . .\nelse\
  \ if (v instanceof JSOBoolean b) . . .\nelse if (v instanceof JSONObject o) . .\
  \ .\nelse . . . // 必须是 JSONNull\n```\n\n在这里，控制流意味着我们知道 `JSONValue` 的所有直接子类。这不是一个开放的层次结构。JSON\
  \ 标准不会改变；如果改变了，我们作为库实现者将添加第七个子类。我们不希望其他人来扰动类层次结构。\n\n在 Java 中，*密封类*控制哪些类可以继承它。密封类在\
  \ Java 15 中作为预览功能添加，并在 Java 17 中定型。\n\n以下是将 `JSONValue` 类声明为密封的方式：\n\n```java\n\
  public abstract sealed class JSONValue\n      permits JSONArray, JSONNumber, JSONString,\
  \ JSONBoolean, JSONObject, JSONNull\n{\n   . . .\n}\n```\n\n定义一个未许可的子类是错误：\n\n```java\n\
  public class JSONComment extends JSONValue { . . . } // 错误\n```\n\n\n\n\n这正好，因为\
  \ JSON 不允许注释。`sealed` 因此此允许对领域约束进行精确建模。\n\n密封类（sealed class）许可的子类必须是可访问。它们不能是嵌套在另一个类中的私有类，也不能是来自另一个包的包可见类。\n\
  \n对于公开的许可子类，规则更加严格。它们必须与密封类处于同一个包中。然而，如果你使用了模块（参见第 12 章），则它们必须位于同一个模块中。\n\n密封类可以在不带\
  \ `permits` 子句的情况下声明。在这种情况下，所有的直接子类都必须在同一个文件中声明。无法访问该文件的程序员无法创建子类。\n\n一个文件最多可以有一个\
  \ `public` 类，因此这种安排似乎只有在子类不供公众使用时才有用。\n\n然而，正如你将在下一章中看到的，你可以使用内部类来作为公开的子类。\n\n密封类的一个重要动力是编译时检查。考虑\
  \ `JSONValue` 类中的下面这个方法，它使用了带有模式匹配的 `switch` 表达式（参见第 5.9 节）：\n\n```\npublic String\
  \ type()\n{\n   return switch (this)\n      {\n         case JSONArray __ -> \"\
  array\";\n         case JSONNumber __ -> \"number\";\n         case JSONString __\
  \ -> \"string\";\n         case JSONBoolean __ -> \"boolean\";\n         case JSONObject\
  \ __ -> \"object\"; \n         case JSONNull __ -> \"null\";\n         // 这里不需要\
  \ default\n      };\n}\n```\n\n编译器可以检查出不需要 `default` 子句，因为 `JSONValue` 的所有直接子类都作为\
  \ case 出现。\n\n前面的 `type` 方法看起来并不面向对象。符合 OOP 精神的做法让这六个类中的每一个都提供自己的 `type` 方法，依赖多态而不是\
  \ `switch`。对于开放的层次结构，这是一个很好的方法。但当存在一组固定的类时，将所有备选项放在一个方法中通常更方便。\n\n乍一看，密封类的子类似乎必须是\
  \ `final` 的。但对于穷尽性测试（exhaustiveness testing），我们只需要知道所有的直接子类。如果这些类具有进一步的子类也没有问题。例如，我们可以像图\
  \ 5.3 所示那样重新组织我们的 JSON 层次结构。\n\n![Figure](img/fig05-03-new.jpg)表示 JSON 值的完整层次结构\n\
  \n在这个层次结构中，`JSONValue` 许可三个子类：\n\n```\npublic abstract sealed class JSONValue permits\
  \ JSONObject, JSONArray, JSONPrimitive\n{\n   . . .\n}\n```\n\n`JSONPrimitive` 类也是被密封的：\n\
  \n```\npublic abstract sealed class JSONPrimitive extends JSONValue\n      permits\
  \ JSONString, JSONNumber, JSONBoolean, JSONNull\n{\n   . . .\n}\n```\n\n密封类的子类必须指定它是\
  \ `sealed`、`final` 还是允许被类化的（open）。在后一种情况下，它必须声明为 `non-sealed`。\n\n`non-sealed` 关键字是第一个带有连字符的\
  \ Java 关键字。这可能是一个未来的趋势。向语言中添加关键字总是伴随着风险。现有的代码可能不再编译。因此，`sealed` 是一个“上下文”（contextual）关键字。你仍然可以声明名为\
  \ `sealed` 的变量或方法：\n\n```java\nint sealed = 1; // 将上下文关键字用作标识符是可以的\n```\n\n对于带有连字符的关键字，人们不需要担心这个问题。唯一的歧义在于减法：\n\
  \n```java\nint non = 0;\nnon = non-sealed; // 减法，而不是关键字\n```\n\n你为什么想要一个 `non-sealed`\
  \ 子类？考虑一个具有六个直接子类的 XML 节点类：\n\n```\npublic abstract sealed class Node permits Element,\
  \ Text, Comment,\n      CDATASection, EntityReference, ProcessingInstruction\n{\n\
  \   . . .\n}\n```\n\n我们允许 `Element` 有任意子类：\n\n```java\npublic non-sealed class Element\
  \ extends Node\n{\n   . . .\n}\n\npublic class HTMLDivElement extends Element\n\
  {\n   . . .\n}\n```\n\n在本节中，你学习了密封类。在下一章中，你将学习接口，它是抽象类的泛化。Java 接口也可以有子类型。密封接口的工作方式与密封类完全相同，控制直接子类型。\n\
  \n下面的示例程序充实了 JSON 层次结构。`JSONObject` 的实现使用了 `HashMap`，这将在第 9 章中介绍。在示例中，我们使用接口而不是抽象类，以便\
  \ `JSONNumber` 和 `JSONString` 可以是 record，而 `JSONBoolean` 和 `JSONNull` 类可以是枚举（enum）。record\
  \ 和枚举可以实现接口，但不能不能类。\n\n`sealed/SealedTest.java`\n\n```java\npackage sealed;\n\n\
  import java.util.*;\n\nsealed interface JSONValue permits JSONArray, JSONObject,\
  \ JSONPrimitive\n{\n   public default String type()\n   {\n      if (this instanceof\
  \ JSONArray) return \"array\";\n      else if (this instanceof JSONObject) return\
  \ \"object\";\n      else if (this instanceof JSONNumber) return \"number\";\n \
  \     else if (this instanceof JSONString) return \"string\";\n      else if (this\
  \ instanceof JSONBoolean) return \"boolean\";\n      else return \"null\";\n   }\n\
  }\n\nfinal class JSONArray extends ArrayList<JSONValue> implements JSONValue {}\n\
  \nfinal class JSONObject extends HashMap<String, JSONValue> implements JSONValue\n\
  {\n   public String toString()\n   {\n      StringBuilder result = new StringBuilder();\n\
  \      result.append(\"{\");\n      for (Map.Entry<String, JSONValue> entry : entrySet())\n\
  \      {\n         if (result.length() > 1) result.append(\",\"); \n         result.append(\"\
  \ \\\"\");\n         result.append(entry.getKey());\n         result.append(\"\\\
  \": \");\n         result.append(entry.getValue());\n      }\n      result.append(\"\
  \ }\");\n      return result.toString();\n   }\n}\n\nsealed interface JSONPrimitive\
  \ extends JSONValue\n      permits JSONNumber, JSONString, JSONBoolean, JSONNull\n\
  {   \n}\n\nfinal record JSONNumber(double value) implements JSONPrimitive\n{\n \
  \  public String toString() { return \"\" + value; }\n}\n\nfinal record JSONString(String\
  \ value) implements JSONPrimitive\n{\n   public String toString() { return \"\\\"\
  \" + value.translateEscapes() + \"\\\"\"; }\n}\n\nenum JSONBoolean implements JSONPrimitive\n\
  {\n   FALSE, TRUE;\n   public String toString() { return super.toString().toLowerCase();\
  \ }\n}\n\nenum JSONNull implements JSONPrimitive\n{\n   INSTANCE;\n   public String\
  \ toString() { return \"null\"; }\n}\n\npublic class SealedTest\n{\n   public static\
  \ void main(String[] args)\n   {\n      JSONObject obj = new JSONObject();\n   \
  \   obj.put(\"name\", new JSONString(\"Harry\"));\n      obj.put(\"salary\", new\
  \ JSONNumber(90000));\n      obj.put(\"married\", JSONBoolean.FALSE);\n      JSONArray\
  \ arr = new JSONArray();\n      arr.add(new JSONNumber(13));\n      arr.add(JSONNull.INSTANCE);\n\
  \n      obj.put(\"luckyNumbers\", arr);\n      System.out.println(obj);\n      System.out.println(obj.type());\n\
  \   }\n}\n```\n\n### 模式匹配\n\n你已经见过如何使用 `instanceof` 运算符来检查对象是否具有特定类型。`instanceof`\
  \ 最方便的形式声明了一个与匹配类型的变量：\n\n```java\nEmployee e = . . .;\nString description;\nif\
  \ (e instanceof Executive exec) description = \"An executive with a title of \"\
  \ + exec.getTitle();\nelse if (e instanceof Manager m) description = \"A manager\
  \ who deserves a bonus\";\nelse description = \"A lowly employee with a salary of\
  \ \" + e.getSalary();\n```\n\n模式匹配形式的 `switch` 简化了这种类型分析：\n\n```java\nEmployee e\
  \ = . . .;\nString description = switch (e)\n   {\n      case Executive exec ->\
  \ \"An executive with a title of \" + exec.getTitle();\n      case Manager m ->\
  \ \"A manager who deserves a bonus\";\n      default -> \"A lowly employee with\
  \ a salary of \" + e.getSalary();\n   };\n```\n\n注意，与 `instanceof` 模式一样，每个 case\
  \ 都声明了一个匹配类型的变量。你使用这些变量来访问子类方法（例如示例中的 `getTitle`）。\n\n\n\n使用 `switch` 表达式形式比链式 `if`\
  \ 语句更简单。`switch` 表达式产生一个值并将其赋值给 `description` 变量。相比之下，使用 `instanceof` 时，条件语句的每个分支必须单独设置\
  \ `description` 值。\n\n配合类型模式（type patterns）可以使用 `switch` 的语句形式和贯穿（fallthrough）形式。但不带贯穿的表达式形式通常是最自然的选择。\n\
  \n正如你刚刚所看到的，模式匹配的基础结构非常直观。接下来的小节将介绍技术细节，其中某些细节出于兼容性原因变得有些复杂。\n\nJava 21 引入了作为预览特性的未命名变量（unnamed\
  \ variables）。如果你在类型模式中不需要该变量，可以使用下划线：\n\n```\ncase Employee _ -> \"A lowly employee\"\
  \n```\n\n在这一功能正式发布之前，你可以使用两个下划线：\n\n```\ncase Employee __ -> \"A lowly employee\"\
  \n```\n\n#### 空值处理\n\n经典的 `switch` 语句对 `null` 是敌的。如果选择器表达式为 `null`，`switch` 将抛出\
  \ `NullPointerException`。你可以通过添加 `case null` 来避免这一点：\n\n```\nString description\
  \ = switch (e)\n   {\n      case Executive exec -> \"An executive with a title of\
  \ \" + exec.getTitle();\n      case Manager m -> \"A manager who deserves a bonus\"\
  ;\n      case null -> \"No employee\";\n      default -> \"A lowly employee with\
  \ a salary of \" + e.getSalary();\n   };\n```\n\n你可以将 `case null` 与 `default` 结合，但不能与任何其他\
  \ case 结合：\n\n```\ncase null, default -> \"No free parking\";\n```\n\n你不能使用 `case\
  \ _` 来表示默认情况（default case）。这是故意设计的，这样你就不需要记住这种 case 是否涵盖了 `null`。\n\n### 守卫（Guards）\n\
  \n你可以为模式添加一个条件，被称为“守卫”，并使用受限的 `when` 关键字。\n\n```\ncase Executive exec when exec.getTitle().getLength()\
  \ >= 20 ->\n   \"An executive with an impressive title\";\n```\n\n在守卫表达式中，你可以使用模式引入的变量。\n\
  \n如果不满足守卫表达式，则不会选择该 case，而是测试下一个 case。\n\n如果 `when` 子句中发生异常，`switch` 将抛出该异常。\n\n\
  守卫在记录模式（record patterns）中特别有用：\n\n```\nPoint p = . . .;\nString description = switch\
  \ (p)\n   {\n      case Point(var x, var y) when x == 0 && y == 0 -> \"origin\"\
  ;\n      case Point(var x, var __) when x == 0 -> \"on x-axis\";\n      case Point(var\
  \ __, var y) when y == 0 -> \"on y-axis\";\n      default -> \"not on either axis\"\
  ;\n   };\n```\n\n记录模式会调用组件访问器。在其中一个访问器抛出异常的罕情况下，`switch` 将抛出 `MatchException`。这只发生在自定义访问器的情况下。\n\
  \n#### 穷性（Exhaustiveness）\n\n任何 `switch` 表达式必须是穷尽的：对于每个可能的选择器值都必须有一个对应的 case。这是一个显而易见的要求，因为表达式必须始终产生一个值。\n\
  \n`switch` 变为穷尽有几种方法：\n\n*   为枚举的每个实例提供 case。\n*   一个 `default` case。\n*   涵盖所有可能性的类型模式。\n\
  *   穷尽性检查确保表达式始终产生一个值。\n\n`switch` 表达式必须是穷尽的。如果不是，编译器将报告一一个错误。\n\n\n\n## 变量与穿透\n\
  \n本节涵盖了当执行从一个 `case` 穿透（fall through）到下一个 `case` 时关于变量的细节。如果你从不使用穿透，请直接到下一节。\n\n\
  当类型模式或记录模式引入变量时，其作用范围将延伸到 `case` 的结束，即使执行穿透到了下一个 `case`。例如，考虑以下代码段中的变量 `s`：\n\n\
  ```\nObject obj = . . .;\nswitch (obj)\n{\n   case String s when s.length() == 0:\
  \ System.out.println(\"empty string\"); // Scope ends here\n   default: System.out.println(obj.toString());\n\
  }\n```\n\n你可以在守卫语句（guard clause）和 `:` 之后的语句中使用 `s`，但不能在下一个 `case` 中使用。这是合理的，因为当\
  \ `obj` 不是 `String` 时，执行可能会从该 `case` 开始。\n\n你不能穿入类型模式：\n\n```\nswitch (obj)\n{\n\
  \   case String s when s.length() > 0: System.out.println(s.codePointAt(0)); //\
  \ Fallthrough\n   case Integer n: System.out.println(n); // ERROR\n   . . .\n}\n\
  ```\n\n如果执行从第一个 `case` 穿透到第二个 `case` 的体，`n` 将无法绑定。\n\n你*可以*穿入一个带有匿名变量的类型模式（Java\
  \ 21 的一项预览功能）：\n\n```\nswitch (obj)\n{\n   case String s when s.length() == 0: System.out.print(\"\
  empty \"); // Fallthrough\n   case String _: System.out.println(\"string\"); break;\
  \ // Ok\n   . . .\n}\n```\n\n自 Java 1.0 以来，在 `case` 体中声明变量一直是合法的。该变量的作用范围延伸到 `switch`\
  \ 的结束。这种作用范围从未用过，因为如果你在 `case` 之外访问该变量，会导致错误：\n\n```\nswitch (obj) {\n   case String\
  \ s:\n      String t = s; // OK\n   default:\n      System.out.println(t); // ERROR—t\
  \ may not have been initialized\n}\n```\n\nListing 5.14 和 Listing 5.15 中的程序演示了类型模式和记录模式的模式匹配。\n\
  \n`patternMatching/TypePatternTest.java`\n\n```\npackage patternMatching;\n\npublic\
  \ class TypePatternTest\n{\n   public static void main(String[] args)\n   {\n  \
  \    int r = (int)(4 * Math.random());\n      Employee e = switch (r)\n        \
  \ {\n            case 0 -> new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n\
  \            case 1 -> new Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n   \
  \         case 2 -> new Executive(\"Sue Striver\", \"Senior Associate Vice President\"\
  , 200000, 1995, 1, 20);\n            default -> null;\n         };\n      String\
  \ description = switch (e)\n         {\n            case Executive exec when exec.getTitle().length()\
  \ >= 20 ->\n               \"An executive with an impressive title\";\n        \
  \    case Executive exec ->\n               \"An executive with a title of \" +\
  \ exec.getTitle();\n            case Manager m ->\n               {\n          \
  \        m.setBonus(10000); \n                  yield \"A manager who just got a\
  \ bonus\";\n               }\n            case null -> \"No employee\";\n      \
  \      default -> \"A lowly employee with a salary of \" + e.getSalary();\n    \
  \     };\n      System.out.println(description);\n   }\n}\n```\n\n`patternMatching/RecordPatternTest.java`\n\
  \n```\npackage patternMatching;\n\nrecord Point(double x, double y) {}\n\npublic\
  \ class RecordPatternTest\n{\n   public static void main(String[] args)\n   {\n\
  \      int r = (int)(4 * Math.random());\n      Point p = switch (r)\n         {\n\
