  \     printMethod(m);\n      }\n      catch (ClassNotFoundException e)\n      {\n\
  \         e.printStackTrace();\n      }\n   }\n\n   public static void printClass(Class<?>\
  \ cl)\n   {\n      System.out.print(cl);\n      printTypes(cl.getTypeParameters(),\
  \ \"<\", \", \", \">\", true);\n      Type sc = cl.getGenericSuperclass();\n   \
  \   if (sc != null)\n      {\n         System.out.print(\" extends \");\n      \
  \   printType(sc, false);\n      }\n      printTypes(cl.getGenericInterfaces(),\
  \ \" implements \", \", \", \"\", false);\n      System.out.println();\n   }\n\n\
  \   public static void printMethod(Method m)\n   {\n      String name = m.getName();\n\
  \      System.out.print(Modifier.toString(m.getModifiers()));\n      System.out.print(\"\
  \ \");\n      printTypes(m.getTypeParameters(), \"<\", \", \", \"> \", true);\n\n\
  \      printType(m.getGenericReturnType(), false);\n      System.out.print(\" \"\
  );\n      System.out.print(name);\n      System.out.print(\"(\");\n      printTypes(m.getGenericParameterTypes(),\
  \ \"\", \", \", \"\", false);\n      System.out.println(\")\");\n   }\n\n   public\
  \ static void printTypes(Type[] types, String prefix, String separator, \n     \
  \    String suffix, boolean isDefinition)\n   {\n      if (prefix.equals(\" extends\
  \ \") \n            && Arrays.equals(types, new Type[] { Object.class })) return;\n\
  \      if (types.length > 0) System.out.print(prefix);\n      for (int i = 0; i\
  \ < types.length; i++)\n      {\n         if (i > 0) System.out.print(separator);\n\
  \         printType(types[i], isDefinition);\n      }\n      if (types.length >\
  \ 0) System.out.print(suffix);\n   }\n\n   public static void printType(Type type,\
  \ boolean isDefinition)\n   {\n      if (type instanceof Class<?> t)\n      {\n\
  \         System.out.print(t.getName());\n      }\n      else if (type instanceof\
  \ TypeVariable<?> t)\n      {\n         System.out.print(t.getName());\n       \
  \  if (isDefinition)\n            printTypes(t.getBounds(), \" extends \", \", \"\
  , \">\", false);\n      }\n      else if (type instanceof WildcardType t)\n    \
  \  {\n         System.out.print(\"?\");\n         printTypes(t.getUpperBounds(),\
  \ \" extends \", \", \", \">\", false);\n         printTypes(t.getLowerBounds(),\
