  \ t)\n      {\n         Type owner = t.getOwnerType();\n         if (owner != null)\n\
  \         {\n            printType(owner, false);\n            System.out.print(\"\
  .\");\n         }\n         printType(t.getRawType(), false);\n         printTypes(t.getActualTypeArguments(),\
  \ \"<\", \", \", \">\", false);\n      }\n      else if (type instanceof GenericArrayType\
  \ t)\n      {\n         System.out.print(\"\");\n         printType(t.getGenericComponentType(),\
  \ isDefinition);\n         System.out.print(\"[]\");\n      }\n   }\n}\n```\n\n\
  ### 类型字面量 (Type Literals)\n\n有时，你希望通过值的类型来驱动程序的行为。例如，在持久化机制中，你可能希望用户指定保存特定类对象的方法。这通常通过将\
  \ `Class` 对象与动作关联来实现。\n\n然而，对于泛型类，擦除带来了问题。当 `ArrayList<Integer>` 和 `ArrayList<String>`\
  \ 都擦除为相同的 `ArrayList` 类型时，你如何为它们设置不同的动作？\n\n有一种技巧可以在某些情况下提供缓解。你可以捕获上一节中遇到的 `Type`\
  \ 接口的实例。如下构造一个匿名子类：\n\n```java\nvar type = new TypeLiteral<ArrayList<Integer>>(){}\
  \ // 注意 {}\n```\n\n`TypeLiteral` 构造函数捕获了泛型父类：\n\n```java\nclass TypeLiteral<T>\n\
  {\n   public TypeLiteral()\n   {\n      Type parentType = getClass().getGenericSuperclass();\n\
  \      if (parentType instanceof ParameterizedType paramType)\n         type = paramType.getActualTypeArguments()[0];\n\
  \      else\n         throw new UnsupportedOperationException(\n            \"Construct\
  \ as new TypeLiteral<. . .>(){}\");\n   }\n}\n```\n\n如果我们运行时有一个泛泛型类型，就可以将其与 `TypeLiteral`\
  \ 进行匹配。我们无法从对象获取泛型类型——它被擦除了。但是，正如你在上一节中所看到的，泛字段和方法参数的泛型类型在虚拟机中保留了下来。\n\n注入框架如 CDI\
  \ 和 Guice 使用类型字面量来控制泛型类型的注入。书中示例程序展示了一个更简单的例子：给定一个对象，我们遍历它的字段（这些字段的泛型类型是可选），并查找关联的格式化动作。\n\
  \n我们通过空格分隔值来格式化 `ArrayList<Integer>`，通过将字符接到字符串来格式化 `ArrayList<Character>`。任何其他列表都通过\
  \ `ArrayList.toString()` 进行格式化。\n\n\n\n\n\n```java\npackage genericReflection;\n\
  \n/**\n   @version 1.03 2023-12-20\n   @author Cay Horstmann\n*/\n\nimport java.lang.reflect.*;\n\
  import java.util.*;\nimport java.util.function.*;\n\n/**\n * 类型字面量（type literal）描述了一个可以是泛型的类型，例如\n\
  \ * ArrayList<String>。\n */\nclass TypeLiteral<T>\n{\n   private Type type;\n\n\
  \   /**\n    * 此构造函数必须通过匿名子类调用，\n    * 如 `new `TypeLiteral<. . .>(){}`。\n    */\n\
  \   public TypeLiteral()\n   {\n      Type parentType = `getClass().getGenericSuperclass()`;\n\
  \      if (parentType instanceof ParameterizedType paramType) \n         type =\
  \ paramType.getActualTypeArguments()[0];\n      else\n         throw new UnsupportedOperationException(\n\
  \            \"请使用 new TypeLiteral<. . .>(){ 的方式构造\");            \n   }\n\n   private\
  \ TypeLiteral(Type type)\n   {\n      this.type = type;\n   }\n\n   /**\n    * 返回一个描述给定类型的类型字面量。\n\
  \    */\n   public static TypeLiteral<?> of(Type type)\n   {\n      return new TypeLiteral<>(type);\n\
  \   }\n\n   public String toString()\n   {\n      if (type instanceof Class<?> cl)\
  \ return cl.getName();\n      else return type.toString();\n   }\n\n   public boolean\
  \ equals(Object otherObject) \n   {\n      return otherObject instanceof TypeLiteral<?>\
  \ otherLiteral\n         && type.equals(otherLiteral.type);      \n   }\n\n   public\
  \ int hashCode()\n   {\n      return type.hashCode();\n   }\n}\n\n/**\n * 使用关联类型与格式化化的规则来格式化对象。\n\
  \ */\nclass Formatter\n{   \n   private Map<TypeLiteral<?>, Function<?, String>>\
  \ rules = new HashMap<>();\n\n   /**\n    * 为此格式化器添加格式化规则。\n    * @param type 该规则适的类型\n\
  \    * @param formatterForType 格式化该类型对象的函数\n     */\n   public <T> void forType(TypeLiteral<T>\
  \ type, Function<T, String> formatterForType) \n   {\n      rules.put(type,  formatterForType);\n\
  \   }\n\n   /**\n    * 使用此格式化器的规则格式化对象的所有字段。\n    * @param obj 一个对象\n    * @return\
  \ 包含所有字段名和格式化值的字符串\n     */\n   public String formatFields(Object obj) \n      \
  \   throws IllegalArgumentException, IllegalAccessException\n   {\n      var result\
  \ = new StringBuilder();\n      for (Field f : obj.getClass().getDeclaredFields())\n\
  \      {\n         result.append(f.getName());\n         result.append(\"=\");\n\
  \         f.setAccessible(true);\n         Function<?, String> formatterForType\
  \ = rules.get(TypeLiteral.of(f.getGenericType()));\n         if (formatterForType\
  \ != null) \n         {\n            // formatterForType 有参数类型 ?. 无法传递它的 apply 方法。\n\
  \            // 强制转换将参数类型转换为 Object，以便我们可以调用它。\n            @SuppressWarnings(\"\
  unchecked\")\n            Function<Object, String> objectFormatter \n          \
  \     = (Function<Object, String>) formatterForType;\n            result.append(objectFormatter.apply(f.get(obj)));\n\
  \         }\n         else\n            result.append(f.get(obj).toString());\n\
  \         result.append(\"\\n\");\n      }\n      return result.toString();\n  \
  \ }\n}\n\npublic class TypeLiterals\n{\n   public static class Sample\n   {\n  \
  \    ArrayList<Integer> nums;\n      ArrayList<Character> chars;\n      ArrayList<String>\
  \ strings;\n      public Sample()       \n      { \n         nums = new ArrayList<>();\n\
  \         nums.add(42); nums.add(1729);\n         chars = new ArrayList<>();\n \
  \        chars.add('H'); chars.add('i');\n         strings = new ArrayList<>();\n\
  \         strings.add(\"Hello\"); strings.add(\"World\");\n      }\n   }\n\n   private\
  \ static <T> String join(String separator, ArrayList<T> elements)\n   {\n      var\
  \ result = new StringBuilder();\n      for (T e : elements)\n      {\n         if\
  \ (result.length() > 0) result.append(separator);\n         result.append(e.toString());\n\
  \      }\n      return result.toString();\n   }\n\n   public static void main(String[]\
  \ args) throws Exception\n   {\n      var formatter = new Formatter();\n      formatter.forType(new\
  \ TypeLiteral<ArrayList<Integer>>(){}, \n         lst -> join(\" \", lst));\n  \
  \    formatter.forType(new TypeLiteral<ArrayList<Character>>(){}, \n         lst\
  \ -> \"\\\"\" + join(\"\", lst) + \"\\\"\");\n      System.out.println(formatter.formatFields(new\
  \ Sample()));\n   }\n}\n```\n\n`java.lang.Class<T>` 1.0\n\n* `TypeVariable[] getTypeParameters()`\
  \ 5.0\n\n如果此类型被声明为泛型类型，则获取泛型类型变量，否则返回长度为 0 的数组。\n\n* `Type getGenericSuperclass()`\
  \ 5.0\n\n获取为此类型声明的父类的泛型类型；如果此类型是 `Object` 或不是类型，则返回 `null`。\n\n* `Type[] getGenericInterfaces()`\
  \ 5.0\n\n按声明顺序获取为此类型声明的接口的泛型类型，否则返回长度为 0 的数组。\n\n`java.lang.reflect.Method` 1.1\n\
  \n* `TypeVariable[] getTypeParameters()` 5.0\n\n如果此方法被声明为泛型方法，则获取泛型类型变量，否则返回长度为\
  \ 0 的数组。\n\n* `Type getReturnType()` 5.0\n\n获取为此方法声明的泛型返回类型。\n\n* `Type[] getParameterTypes()`\
  \ 5.0\n\n获取为此方法声明的泛型参数类型。如果方法没有参数，则返回长度为 0 的数组。\n\n`java.lang.reflect.TypeVariable`\
  \ 5.0\n\n* `String getName()`\n\n获取此类型变量的名称。\n\n* `Type[] getBounds()` 5.0\n\n获取此类型变量的子类边界；如果变量无边界，则返回长度为\
  \ 0 的数组。\n\n`java.lang.reflect.WildcardType` 5.0\n\n* `Type[] getUpperBounds()`\
  \ 5.0\n\n获取此类型变量的子类边界（extends）；如果变量没有子类边界，则返回长度为 0 的数组。\n\n* `Type[] getLowerBounds()`\
  \ 5.0\n\n获取此类型变量的父类边界（super）；如果变量没有父类边界，则返回长度为 0 的数组。\n\n`java.lang.reflect.ParameterizedType`\
  \ 5.0\n\n* `Type getRawType()`\n\n获取此泛化泛的原始类型。\n\n* `Type[] getActualTypeArguments()`\n\
  \n获取为此泛化类型声明的类型参数。\n\n* `Type getOwnerType()`\n\n如果此是内部类型，则获取外部类类型；如果是顶层类型，则返回 `null`。\n\
  \n`java.lang.reflect.GenericArrayType` 5.0\n\n* `Type getGenericComponentType()`\n\
  \n获取为此数组类型声明的泛型组件类型。\n\n\n\n\nJava 的初始版本仅为最常用的数据结构提供了一小部分类：`Vector`、`Stack`、`Hashtable`、`BitSet`\
  \ 以及 `Enumeration` 接口（后者提供了一种用于访问任意容器中元素的抽象机制）。这无疑是一个明智的选择——创建一个全面的集合类库需要时间和精技巧。\n\
  \n随着 Java 1.2 的出现，设计者们认为是时候推出一个完全的数据结构框架了。他们面临着许多相互冲突的设计挑战。他们希望这个库既小巧又易于学习；他们不想要\
  \ C++ 标准模板库（或 `STL`）那样的复杂性，但又想要获得 `STL` 所开创的“泛型算法”的益处。他们还希望旧的类能够适配到新框架中。正如所有集合类库的设计者一样，他们必须做出一些艰难的抉，并在过程中产生了一系列独特的设计决策。在本节中，我们将探索\
  \ Java 集合框架的基本设计，演示如何使用它，并解释一些更具争议的功能背后的原理。\n\n## 分离集合接口与实现\n\n与现代数据结构库一样，Java 集合框架将\
  \ `interfaces`（接口）和 `implementations`（实现）分开了。让我们通过一个熟悉的数据结构——队列（queue）来观察这种分离。\n\
  \n`queue interface` 规定你可以在队列的尾部添加元素，从头部删除元素，并查询队列中有多少元素。当你需要收集对象并按“先进先出”的方式检索它们时，就会使用队列（参见图\
  \ 9.1）。\n\n![Figure](img/13_01.jpg)队列\n\n队列接口的最小形式可能如下所示：\n\n```\npublic interface\
  \ Queue<E> // Java API 中接口的简化形式\n{\n   void add(E e);\n   E remove();\n   int size();\n\
  }\n```\n\n该接口没有告诉你任何关于队列如何实现的信息。在队列的两种常见实现中，一种使用“循环数组”，另一种使用链表（参见图 9.2）。\n\n![Figure](img/13_02.jpg)队列实现\n\
  \n每个实现都可以由实现 `Queue` 接口的类来表示。在 Java API 中，这些类被称为 `ArrayDeque` 和 `LinkedList`。\n\n\
  ```\npublic class ArrayDeque<E> implements Queue<E> // 简化自 Java API\n{\n   private\
  \ int first;\n   private int last;\n   private E[] elements;\n\n   public ArrayDeque(int\
  \ numElements) { . . . }\n   public void add(E e) { . . . }\n   public E remove()\
  \ { . . . }\n   public int size() { . . . }\n   . . .\n}\n\npublic class LinkedList<E>\
  \ implements Queue<E> // 简化自 Java API\n{\n   private Node<E> first;\n   private\
  \ Node<E> last;\n\n   public LinkedList() { . . . }\n   public void add(E e) { .\
  \ . . }\n   public E remove() { . . . }\n   public int size() { . . . }\n   . .\
  \ .\n}\n```\n\n在程序中使用队列时，一旦集合构建完成，你就不需要知道实际上使用的是哪种实现。因此，*仅*在构建集合对象时使用具体类是合理的。使用*接口类型*来持有集合引用。\n\
  \n```\nQueue<Customer> expressLane = new ArrayDeque<>(100);\nexpressLane.add(new\
  \ Customer(\"Harry\"));\n```\n\n通过这种方法，如果你改变了主意，可以轻松切换到不同的实现。你只需要修改程序中的一处地方——构造函数的调用。如果你最终决定链表是更好的选择，你的代码变为：\n\
  \n```\nQueue<Customer> expressLane = new LinkedList<>();\nexpressLane.add(new Customer(\"\
  Harry\"));\n```\n\n坚持使用接口还有另一个原因是：`ArrayDeque` 和 `LinkedList` 类都拥有与队列操作无关的方法。不小心使用其中一个方法会被报告为编译错误，因为你不能在\
  \ `Queue` 类型的变量上调用它们。\n\n为什么选择其中一种实现而不是另一种呢？接口对实现的效率没有说明任何信息。循环数组的内存效率更高。然而，循环数组具有有限的，并且每当它填满时都需要重新分配内存。事实上，测量显示\
  \ `ArrayDeque` 的性能通常优于 `LinkedList`，因为它对垃圾回收器的影响较小。当 `ArrayDeque` 出现在 Java 6 中时，使用\
  \ `Queue` 接口的程序员可以通过更改单行代码将 `LinkedList` 替换掉。\n\n## 集合接口\n\nJava 集合框架中集合类的基础接口是\
  \ `Collection` 接口。该接口有两个基本方法：\n\n```\npublic interface Collection<E>\n{\n   boolean\
  \ add(E element);\n   Iterator<E> iterator();\n   . . .\n}\n```\n\n除了这两个方法外还有几个方法；我们稍后会讨论。\n\
  \n`add` 方法向集合中添加元素。如果添加元素确实更改了集合，则返回 `true`；如果集合未改变，则返回 `false`。例如，如果你尝试向集合添加一个对象而该对象已经存在，那么\
  \ `add` 请求将不起作用，因为集合拒绝重复项。\n\n`iterator` 方法返回一个实现 `Iterator` 接口的对象。通过该对象，你可以逐个访问集合中的元素。我们将在下一节讨论迭代器。\n\
  \n## 迭代器\n\n`Iterator` 接口有四个方法：\n\n```\npublic interface Iterator<E>\n{\n   boolean\
  \ hasNext();\n   E next();\n   default void remove();\n   default void forRemaining(Consumer<?\
  \ super E> action);\n}\n```\n\n通过反复调用 `next` 方法，你可以逐个访问集合中的元素。然而，如果你到达集合的末尾，`next`\
  \ 方法将抛出 `NoSuchElementException`。因此，你需要在调用 `next` 之前调用 `hasNext` 方法。如果迭代器尚未到达末尾且至少还有一个元素待访问，该方法返回\
  \ `true`。如果你想检查集合中的所有元素，可以请求一个迭代器，然后在 `hasNext` 返回 `true` 时继续调用 `next` 方法。例如：\n\n\
  ```\nCollection<String> coll = . .[];\nIterator<String> iter = coll.iterator();\n\
  while (iter.hasNext())\n{\n   String element = iter.next();\n   do something with\
  \ element\n}\n```\n\n你可以用更简洁的“for each”循环来写写这样的循环：\n\n```\nfor (String element :\
  \ coll)\n{\n   do something with element\n}\n```\n\n编译器简单地将“for each”循环翻译成带有迭代器的循环。\n\
  \n“for each”循环适用于任何实现 `Iterable` 接口的对象，该接口包含一个抽象方法：\n\n```\npublic interface Iterable<E>\n\
  {\n   Iterator<E> iterator();\n   . . .\n}\n```\n\n`Collection` 接口继承了 `Iterable`\
  \ 接口。因此，你可以对 Java 集合框架中的任何集合使用“for each”循环。\n\n与其编写循环，不如调用 `Collection.forEach`\
  \ 或 `Iterator.forEachRemaining` 方法，并传入一个处理元素的 Lambda 表达式。Lambda 表达式将应用于集合的所有元素，或者迭代器可以访问的剩余元素。\n\
  \n```\ncoll.forEach(element -> do something with element);\niter.forEachRemaining(element\
  \ -> do something with element);\n```\n\n\n\n元素的访问顺序取决于集合类型。如果你遍历一个 `ArrayList`，迭代器将从索引\
  \ `0` 开始，并在每一步中增加索引。然而，如果你访问 `HashSet` 中的元素，你将以一种本质上随机的顺序获取它们。你可以确保在迭代过程中会遇到集合中的所有元素，但你无法对它们的顺序做出任何假设。这通常不是一个问题，因为对于计算总和或统计匹配项等计算来说，顺序并不重要。\n\
  \n老手们会注意到，`Iterator` 接口的 `next` 和 `hasNext` 方法的作用与 `Enumeration` 接口的 `nextElement`\
  \ 和 `hasMoreElements` 方法是相同的。Java 集合框架的设计者本可以选择使用 `Enumeration` 接口，但他们不喜欢那些繁琐的方法名，而是引入了一个方法名更短的新接口。\n\
  \nJava 集合库中的迭代器与其他库中的迭代器之间存在着一个重要的概念区别。在传统的集合库中（如 C++ 的标准模板库 STL），迭代器是模仿数组索引进行建模的。给定这样一个迭代器，你可以查找存储在该位置的元素，就像如果你有数组索引\
  \ `i`，可以查找数组元素 `a[i]` 一样。无论是否查找，你都可以将迭代器移动到下一个位置。这与通过 `i++` 推进数组索引的操作是相同的，且不需要执行查找。然而，Java\
  \ 迭代器并不是这样工作的。查找和位置变化是紧密耦合的。查找元素的唯一方法是调用 `next`，而这种查找会移动位置。\n\n相反，请将 Java 迭代器想象成处于元素之间。当你调用\
  \ `next` 时，迭代器会跳过下一个元素，并返回它刚刚经过的元素的引用（参见图 9.3）。\n\n![Figure](img/13_03.jpg) 移动迭代器\n\
  \n这里另一个有用的类比。你可以认为 `Iterator.next` 等同于 `InputStream.read`。从流中读取字节会自动“消耗”掉该字节。下一次调用\
  \ `read` 会消耗并返回输入中的下一个字节。同样，重复调用 `next` 允许你读取集合中的所有元素。\n\n`Iterator` 接口的 `remove`\
  \ 方法移除上一次调用 `next` 返回的元素。在许多情况下，这是合理的——在决定某个元素是否应该被移除之前，你需要先看到它。但如果你想移除特定位置的元素，仍然需要跳过该元素。例如，这里是移除字符串集合中第一个元素的方法：\n\
  \n```\nIterator<String> iter = coll.iterator();\niter.next(); // 跳过第一个元素\niter.remove();\
  \ // 现在移除它\n```\n\n更重要的是，`next` 方法和 `remove` 方法调用之间存在依赖关系。如果在没有先调用 `next` 的情况下调用\
  \ `remove` 是非法的。如果你尝试这样做，将抛出 `IllegalStateException`。\n\n如果你想移除两个相邻的元素，不能简单地调用：\n\
  \n```\niter.remove();\niter.remove(); // 错误\n```\n\n相反，你必须先调用 `next` 跳过要移除的元素。\n\
  \n```\niter.remove();\niter.next();\niter.remove(); // 正确\n```\n\n### 通用工具方法\n\n\
  `Collection` 和 `Iterator` 接口是泛型的，这意味着你可以编写操作任何类型集合的工具方法。例如，这里有一个泛型方法，可以测试任意集合是否包含给定元素：\n\
  \n```\npublic static <E> boolean contains(Collection<E> c, Object obj)\n{\n   for\
  \ (E element : c)\n      if (element.equals(obj))\n         return true;\n   return\
  \ false;\n}\n```\n\nJava 集合框架的设计者认为，这些工具方法中的某些非常有用，因此框架应该提供它们。这样，API 用户就不必重复造轮子。`contains`\
  \ 方法就是其中一种。\n\n事实上，`Collection<E>` 接口声明了许多实用方法，所有实现类必须提供这些方法：\n\n```\nint size()\n\
  boolean isEmpty()\nboolean contains(Object obj)\nboolean containsAll(Collection<?>\
  \ c)\nboolean add(E obj)\nboolean addAll(Collection<? extends E> from)\nboolean\
  \ remove(Object obj)\nboolean removeAll(Collection<?> c)\nboolean retainAll(Collection<?>\
  \ c)\nvoid clear()\nObject[] toArray()\nT[] toArray(T[] a)\n```\n\n`Collection`\
  \ 接口声明了继承自 `Object` 的 `equals` 和 `hashCode` 方法。技术上并没有包含这些声明。这只是为添加集合 API 文档提供了良好的位置。`Set`\
  \ 和 `List` 子接口规定了 `equals` 的特定行为。其他集合可以继承 `Object.equals`，也可以重写它并某种方式比较元素。在后一种情况下，`hashCode`\
  \ 方法也需要被重写。\n\n这些方法中的许多是自易懂的，你将在节末尾的 API 注释中找到完整的文档。\n\nJava 集合框架是在泛型类型添加到 Java\
  \ 之前设计的。为了后兼容，`contains` 和 `remove` 方法的参数类型为 `Object` 而不是 `E`。`containsAll`、`removeAll`\
  \ 和 `retainAll` 方法的参数类型为 `Collection<?>` 而不是 `Collection<? extends E>`。\n\n\n\n\
  如果此集合包含与 `obj` 相等的对象，则返回 `true`。\n\n* `boolean containsAll(Collection<?> other)`\n\
  \  如果此集合包含另一个集合中的所有元素，则返回 `true`。\n\n* `boolean add(E element)`\n  尝试向集合中添加一个元素。如果集合因为此调用而发生了变化，则返回\
  \ `true`。\n\n* `boolean addAll(Collection<? extends E> other)`\n  将另一个集合中的所有元素添加到此集合中。如果集合因为此调用而发生了变化，则返回\
  \ `true`。\n\n* `boolean boolean remove(Object obj)`\n  尝试从此集合中移除与 `obj` 相等的对象。如果删除了匹配的对象，则返回\
  \ `true`。\n\n* `boolean removeAll(Collection<?> other)`\n  从此集合中移除另一个集合中的所有元素。如果集合因为此调用而发生了变化，则返回\
  \ `true`。\n\n* `default boolean removeIf(Predicate<? super E> filter)` 8\n  移除所有使\
  \ `filter` 返回 `true` 的元素。如果集合因为此调用而发生了变化，则返回 `true`。\n\n* `void clear()`\n  移除此集合中的所有元素。\n\
  \n* `boolean retainAll(Collection<?> other)`\n  移除此集合中不等于另一个集合中任何元素的元素。如果集合因为此调用而发生了变化，则返回\
  \ `true`。\n\n* `Object[] toArray()`\n  返回包含集合中对象的数组。\n\n* `<T> T[] toArray(IntFunction<T[]>\
  \ generator)` 11\n  返回包含集合中对象的数组。该数组使用 `generator` 构建，它通常是一个构造器表达式 `T[]::new`。\n\
  \n`java.util.Iterator<E>` 1.2\n\n* `boolean hasNext()`\n  如果有另一个元素可以访问，则返回 `true`。\n\
  \n* `E next()`\n  返回下一个要访问的对象。如果到达集合末尾，则抛出 `NoSuchElementException`。\n\n* `void\
  \ remove()`\n  移除上次访问的对象。此方法必须紧接着元素访问之后调用。如果集合自上次访问元素以来被修改过，此方法将抛出 `IllegalStateException`。迭代器不要求支持此操作。默认实现抛出\
  \ `UnsupportedOperationException`。\n\n* `default void forEachRemaining(Consumer<?\
  \ super E> action)` 8\n  访问元素并将其传递给给定的 action，直到没有剩余元素或 action 抛出异常。\n\n## 集合框架中的接口\n\
  \nJava 集合框架为不同类型的集合定义了许多接口。这些接口在图 9.4 所示，但并发编程的接口除外，它们将在第 10 章中介绍。\n\n![Figure](img/13_10.jpg)Java\
  \ 集合框架的接口\n\n集合有两个基本接口：`Collection` 和 `Map`。正如你所看到的，你通过方法向集合中插入元素：\n\n```\nboolean\
  \ add(E element)\n```\n\n然而，map 存储的是键值对，你使用 `put` 方法插入它们：\n\n```\nV put(K key, V\
  \ value)\n```\n\n要从集合中读取元素，请使用迭代器访问它们。然而，你可以使用 `get` 方法从 map 中读取值：\n\n```\nV get(Object\
  \ key)\n```\n\n`List` 是一个*有序集合*。元素被添加到容器中的特定位置。元素可以通过两种方式访问：通过迭代器或通过整数索引。后者被称为*随机访问*，因为元素可以按任何顺序访问。相比之下，使用迭代器时，必须顺序访问它们。\n\
  \n`List` 接口定义了几个用于随机访问的方法：\n\n```\nvoid add(int index, E element)\nE remove(int\
  \ index)\nE get(int index)\nE set(int index, E element)\n```\n\n对于 `List<Integer>`，有两个\
  \ `remove` 方法：\n\n```\nboolean remove(int index) // 移除指定索引的元素\nboolean remove(Integer\
  \ o) // 移除等于 o 的元素\n```\n\n当使用类型为 `int` 的参数调用 `remove` 时，会选择第一个方法。不考虑装箱（boxing），也没有警告。这可能不是你想要的：\n\
  \n```\nList<Integer> ids = . . .;\nint id = . . .;\nif (id == 0) ids.remove(id);\
  \ // 移除索引为 0 的元素，而不是值为 0 的元素\n```\n\n`List` 接口的 API 文档定义了列表 `equals` 方法的行为。要使一个列表与另一个对象相等，另一个对象也必须是某种类型的列表。两个列表的大小必须相同。在遍历每个列表时，对应的元素必须相等。\n\
  \n坦率地说，Java 集合框架中的 `List` 接口存在一个问题。有序集合有两种类型，具有截然不同的性能权衡。由数组支持的有序集合具有快速的随机访问能力，因此使用带整数索引的\
  \ `List` 方法是有意义的。相比之下，链表虽然也是有序的，但随机访问速度很慢，最好使用迭代器进行顺序遍历。如果能提供两个接口会更好。\n\n为了避免对链表执行随机访问操作，Java\
  \ 1.4 引入了一个标记接口 `RandomAccess`。该接口没有方法，但你可以用它来测试特定集合是否支持高效的随机访问：\n\n```\nif (c instanceof\
  \ RandomAccess)\n{\n   random traversal\n}\nelse\n{\n   sequential traversal\n}\n\
  ```\n\n`Set` 接口具有与 `Collection` 接口相同的实例方法，但这些方法的行为定义得更紧密。集合的 `add` 方法应该拒绝重复项。集合的\
  \ `equals` 方法的定义使得两个集合是等等的，但不一定具有相同的顺序。`hashCode` 方法的定义使得两个具有相同元素的集合产生相同的哈希值。\n\n\
  如果方法签名相同，为什么要单独定义一个接口呢？从概念上讲，并不是所有集合都是集合。定义 `Set` 接口允许程序员编写只接受集合的方法。\n\n为了理解为什么这种区别很重要，请考虑等值性测试。如果两个列表具有相同顺序的相同元素，则它们是等的。如果两个集合具有相同的元素，则它们是等的。实现\
  \ `Set` 的类的 `equals` 方法需要确保参数也是 `Set` 而不是任何 `Collection`。\n\n`SortedSet` 和 `SortedMap`\
  \ 接口暴露了用于排序的比较器对象，并定义了获取集合子集视图的方法。我们稍后会讨论这些。\n\n`NavigableSet` 和 `NavigableMap`\
  \ 接口包含了用于在排序集合和 map 中查找下一个或上一个元素的方法。`TreeSet` 和 `TreeMap` 类实现了这些接口。导航操作在树数据结构中可以高效实现。\n\
  \nJava 21 引入了 `SequencedCollection<E>` 接口，它提供了对集合第一个和最后一个元素的统一访问，并支持反向遍历。\n\n```\n\
  E getFirst()\nE getLast()\nvoid addFirst(E e)\nvoid addLast(E e)\nE removeFirst()\n\
  E removeLast()\nSequencedCollection<E> reversed()\n```\n\n以前，这些操作在列表、集合和队列中通过不同的方法执行。`SequencedSet`\
  \ 子接口将 `reversed` 方法的返回类型精确化为 `SequencedSet`。`SequencedMap` 接口为 map 提供了类似的方法。\n\n\
  ## 具体集合\n\n表 9.1 显示了 Java 框架中的集合并简要描述了每个集合类的用途。（为了简单起见，我们省略了将在第 10 章中讨论的线程安全集合。）\n\
  \n\n\n\n表 9.1 中的所有类都实现了 `Collection` 接口，但以 `Map` 结尾的类除外。这些类实现了 `Map` 接口。我们将在第 9.4\
  \ 节 中讨论 map。\n\n## Java 集合框架中的具体集合\n\n| 集合类型 | 说明 | 参见 |\n| --- | --- | --- |\n\
  | `ArrayList` | 一种动态伸缩的索引序列 | 第 9.3.2 节 |\n| `LinkedList` | 一种允许在任何位置高效插入和删除的有序序列\
  \ | 第 9.3.1 节 |\n| `ArrayDeque` | 用循环数组实现的双端队列 | 第 9.3.5 节 |\n| `HashSet` | 一种拒绝重复元素的无序集合\
  \ | 第 9.3.3 节 |\n| `TreeSet` | 一种排序的集合 | 第 9.4.5 节 |\n| `EnumSet` | 举类型值的集合 | 第\
  \ 9.4.6 节 |\n| `LinkedHashSet` | 一种记住元素插入顺序的集合 | 第 9.4.5 节 |\n| `PriorityQueue`\
  \ | 一种允许高效删除最小元素的集合 | 第 9.3.6 节 |\n| `HashMap` | 键/值关联的数据结构 | 第 9.4.1 节 |\n| `TreeMap`\
  \ | 键经过排序的 map | 第 9.4.1 节 |\n| `EnumMap` | 键属于枚举类型的 map | 第 9.4.6 节 |\n| `LinkedHashMap`\
  \ | 记住条目添加顺序的 map | 第 9.4.5 节 |\n| `WeakHashMap` | 如果值在其他地方未使用，则可以被垃圾回收器的 map |\
  \ 第 9.4.4 节 |\n| `IdentityHashMap` | 键通过 `==` 而非 `equals` 比较 map | 第 9.4.7 节 |\n\
  \n图 9.5 显示了这些类之间的关系。\n\n![Figure](img/13_11_new.jpg)\nJava 集合框架中的类\n\n### 链表\n\n\
  我们在本书的许多示例中已经使用了数组及其动态兄弟 `ArrayList` 类。然而，数组和数组列表有一个巨大的缺点。从数组中间删除元素是非常昂贵的代价，因为被删除元素之后的所有数组元素都必须向数组开头移动（参见图\
  \ 9.6）。在中间插入元素也是如此。\n\n![Figure](img/13_04.jpg)\n从数组中删除元素\n\n另一个广为人知的数据结构链表（linked\
  \ list）解决了这个问题。数组在连续的内存位置上存储对象引用，而链表将每个对象存储在独立的 `link` 中。每个 link 还存储指向序列中下一个 link\
  \ 的引用。在 Java 集合框架中，所有链表实际上都是**双向链表**；也就是说，每个 link 还存储指向其前驱节点的引用（参见图 9.7）。\n\n![Figure](img/13_05.jpg)\n\
  双向链表\n\n从链表中间删除元素是一项廉价的操作——只需要更新被删除元素周围的 link 即可（参见图 9.8）。\n\n![Figure](img/13_06.jpg)\n\
  从链表中删除元素\n\n也许你曾经上过数据结构课程，并在那里学习了如何实现链表。你可能对在链表中添加或删除元素时纠结 link 关系有坏记忆。如果是这样，你会高兴地发现\
  \ Java 集合框架提供了一个类 `LinkedList` 供你使用。\n\n以下代码示例添加了三个元素，然后删除了第二个：\n\n```\nvar staff\
  \ = new LinkedList<String>(); \nstaff.add(\"Amy\");\nstaff.add(\"Bob\");\nstaff.add(\"\
  Carl\");\nIterator<String> iter = staff.iterator();\nString first = iter.next();\
  \ // 访问第一个元素 (Amy)\nString second = iter.next(); // 访问第二个元素 (Bob)\niter.remove();\
  \ // 删除最后访问的元素 (Bob)\n```\n\n然而，链表和泛型集合之间有一个重要的区别。链表是一个**有序集合**，其中对象的位置很重要。`LinkedList.add`\
  \ 方法将对象添加到列表末尾。但是……\n\n\n\n\n\n```\nListIterator<String> iter = list.listIterator();\n\
  String oldValue = iter.next(); // 返回第一个元素\niter.set(newValue); // 将第一个元素设置为 newValue\n\
  ```\n\n正如你可能想象到的，如果一个迭代器在遍历集合时，另一个迭代器正在修改它，就会出现混乱的情况。例如，假设一个迭代器指向一个另一个迭代器刚刚删除的元素。此时该迭代器已经失效，不应再继续使用。链表迭代器被设计为检测此类修改。如果迭代器发现其集合被另一个迭代器或集合本身的方法修改了，它将抛出一个\
  \ `ConcurrentModificationException`。例如，考虑以下代码：\n\n```\nList<String> list = . . .;\n\
  ListIterator<String> iter1 = list.listIterator();\nListIterator<String> iter2 =\
  \ list.listIterator();\niter1.next();\niter1.remove();\niter2.next(); // 抛出 ConcurrentModificationException\n\
  ```\n\n对 `iter2.next()` 的调用抛出了 `ConcurrentModificationException`，因为 `iter2` 检测到列表从外部被修改了。\n\
  \n为了避免并发修改异常，请遵循这个简单的规则：你可以根据需要向集合附加任意多个迭代器，只要它们都只是只读的。或者，你可以附加一个既能读又能写的单个迭代器。\n\
  \n并发修改检测是以一种简单的方式完成的。集合记录了修改操作（如添加和删除元素）的数量。每个迭代器都会维护一个由*它*负责的变异操作计数。在每个迭代器方法的开始处，迭代器只需检查其自身的变异计数是否等于集合的计数。如果不相等，它就会抛出一个\
  \ `ConcurrentModificationException`。\n\n然而，在并发修改检测中存在一个奇特的异常。链表只跟踪列表的*结构性*修改，例如添加和删除链接。`set`\
  \ 方法*不被视为*结构性修改。你可以向链表附加多个迭代器，它们都可以通过调用 `set` 方法来更改现有链接的内容。这种能力对于我们在本章稍后讨论的 `Collections`\
  \ 类中的许多算法是必需的。\n\n现在你已经了解了 `LinkedList` 类的基本方法。使用 `ListIterator` 来双向遍历链表元素，并添加和删除元素。\n\
  \n正如你在第 9.2 节中所看到的，许多其他操作链表的有用方法都声明在 `Collection` 接口中。这些方法大部分实现在 `LinkedList` 父类\
  \ `AbstractCollection` 中。例如，`toString` 方法会对所有元素调用 `toString` 并产生一个格式为 `[A, B, C]`\
  \ 的长字符串。这对于调试非常有用。使用 `contains` 方法检查元素是否存在于链表中。例如，调用 `staff.contains(\"Harry\")`\
  \ 时，如果链表已经包含一个与字符串 `\"Harry\"` 相等的字符串，则将返回 `true`。\n\nJava 集合框架还提供了一些从理论角度来看有些可疑的方法。链表不支持快速随机访问。如果你想查看链表的第\
  \ `n` 个元素，必须从头开始并跳过前 `n - 1` 个元素。这没有捷径。由于这个原因，程序员通常不会在需要通过整数索引访问元素的情况下使用链表。\n\n\
  尽管如此，`LinkedList` 类提供了一个 `get` 方法，让你访问特定的元素：\n\n```\nLinkedList<String> list = .\
  \ . .;\nString obj = list.get(n);\n```\n\n当然，这个方法并不高效。如果你发现自己在使用它，那么你可能为你的问题使用了错误的数据结构。\n\
  \n你*永远不要*使用这种幻觉般的随机访问方法来遍历链表。以下代码：\n\n```\nfor (int i = 0; i < list.size(); i++)\n\
  \   do something with list.get(i);\n```\n\n其效率低得惊人。每当你查找另一个元素时，搜索都会从列表开始重新开始。`LinkedList`\
  \ 对象并没有尝试缓存位置信息。\n\n`get` 方法有一个轻微的优化：如果索引至少为 `size() / 2`，则元素的搜索将从列表末尾开始。\n\n列表迭代器接口还有一个方法可以告诉你当前位置的索引。事实上，由于\
  \ Java 迭代器在概念上指向元素之间，因此它有两个这样的方法：`nextIndex` 方法返回下一次调用 `next` 将返回元素的整数索引；`previousIndex`\
  \ 方法返回下一次调用 `previous` 将返回的元素索引。当然，这仅仅比 `nextIndex` 小 1。这些方法对于 `LinkedList` 迭代器是高效的——每个迭代器都维护其当前位置的计数。最后，如果你有一个整数索引\
  \ `n`，那么 `list.listIterator(n)` 返回一个指向索引为 `n` 的元素之前的迭代器。也就是说，调用 `next` 产生的元素与 `list.get(n)`\
  \ 相同；获取该迭代器是低效的。\n\n如果你的链表只有寥几个元素，就不必过度担心 `get` 和 `set` 方法的成本。但如此，最初为什么要使用链表呢？使用链表的唯一理由是最小化列表中间插入和删除的成本。如果你只有几个元素，可以使用\
  \ `ArrayList`。\n\n我建议你直接远离所有使用整数索引的方法。\n\n\n\n\n返回一个列表迭代器，用于访问列表中的元素，其首次调用 `next`\
  \ 将返回指定索引的元素。\n\n*   `void add(int i, E element)`\n    在指定位置添加一个元素。\n*   `boolean\
  \ addAll(int i, Collection<? extends E> elements)`\n    将集合中的所有元素添加到指定位置。\n*   `E\
  \ remove(int i)`\n    删除并返回指定位置的元素。\n*   `E get(int i)`\n    获取指定位置的元素。\n*   `E\
  \ set(int i, E element)`\n    用新元素替换指定位置的元素，并返回旧元素。\n*   `int indexOf(Object element)`\n\
  \    返回与指定元素相等的首次出现的位置，如果未找到匹配元素，则返回 `-1`。\n*   `int lastIndexOf(Object element)`\n\
  \    返回与指定元素相等的最后一次出现的位置，如果未找到匹配元素，则返回 `-1`。\n\n`java.util.ListIterator<E>` 1.2\n\
  \n*   `void add(E newElement)`\n    在当前位置之前添加一个元素。\n*   `void set(E newElement)`\n\
  \    用新元素替换通过 `next` 或 `previous` 最后访问的元素。如果自上次调用 `next` 或 `previous` 之后列表结构被修改，则抛出\
  \ `IllegalStateException`。\n*   `boolean hasPrevious()`\n    如果在反向遍历列表时还有另一个元素可以访问，则返回\
  \ `true`。\n*   `E previous()`\n    返回上一个对象。如果到达列表开头，则抛出 `NoSuchElementException`。\n\
  *   `int nextIndex()`\n    返回下次调用 `next` 将返回的元素索引；如果迭代器已超过最后一个元素，则返回列表的大小。\n*  \
  \ `int previousIndex()`\n    返回下次调用 `previous` 将返回的元素索引；如果迭代器在第一个元素之前，则返回 -1。\n\n\
  `java.util.LinkedList<E>` 1.2\n\n*   `LinkedList()`\n    构造一个空链表。\n*   `LinkedList(Collection<?\
  \ extends E> elements)`\n    构造一个链表并添加集合中的所有元素。\n*   `void addFirst(E element)`\n\
  *   `void addLast(E element)`\n    在列表的开头或结尾添加一个元素。\n*   `E getFirst()`\n*   `E\
  \ getLast()`\n    返回列表开头或结尾的元素。\n*   `E removeFirst()`\n*   `E removeLast()`\n \
  \   删除并返回列表开头或结尾的元素。\n\n### 数组列表 (Array Lists)\n\n在前面的节中，你看到了 `List` 接口和实现它的 `LinkedList`\
  \ 类。`List` 接口描述了一个有序集合，其中元素的位置至关重要。访问元素有两种协议：通过迭代器，以及通过 `get` 和 `set` 方法进行随机访问。后者对于链表并不合适，但显然，`get`\
  \ 和 `set` 对于数组来说非常有意义。Java 集合框架提供了我们熟悉的 `ArrayList` 类，它也实现了 `List` 接口。`ArrayList`\
  \ 封装了一个动态重新分配内存的对象数组。\n\nJava 1.0 随带了一个不同的基于数组的集合——`Vector` 类。`Vector` 类的所有方法都是\
  \ `synchronized`（同步的）。从两个线程访问 `Vector` 对象是安全的。但如果你只从单个线程访问向量（这是目前更常见的情况），那么同步就是浪费的。相比之下，`ArrayList`\
  \ 的方法不是同步的。正如你在第 10 章 中看到的，现在也有更好的线程安全选择。除非你需要与古老的 API 接口，否则现在没有理由使用 `Vector`。\n\
  \n### 哈希集合集 (Hash Sets)\n\n链表和数组允许你指定排列元素的顺序。然而，如果你正在寻找某个特定元素但不记得它的位置，你就需要访问所有元素，直到找到匹配项为止。如果集合包含很多元素，这可能会非常耗时。如果你不在乎元素的顺序，那么某些数据结构可以让你更快地找到元素。缺点是，这些数据结构让你无法对元素出现的顺序进行控制。这些数据结构按照利于其自身目的的顺序来组织元素。\n\
  \n一种用于快速查找对象的常用数据结构是`哈希表` (hash table)。哈希表为每个对象计算一个整数，称为`哈希码` (hash code)。哈希码通过某种方式从对象的实例字段派生而来，最好是使得不同数据的对象产生不同的代码。表\
  \ 9.2 列出了 `String` 类 `hashCode` 方法产生的一些哈希码示例。\n\n#### 由 `hashCode` 方法产生的哈希码\n\n\
  | String | 哈希码 |\n| --- | --- |\n| `\"Lee\"` | `76268` |\n| `\"lee\"` | `107020`\
  \ |\n| `\"eel\"` | `100300` |\n\n如果你定义了自己的类，你有责任实现你自己的 `hashCode` 方法——更多信息请参见第 5\
  \ 章。你的实现需要与 `equals` 方法兼容：如果 `a.equals(b)`，那么 `a` 和 `b` 必须具有相同的哈希码。\n\n现在重要的是哈希码可以快速计算，并且取决于需要哈希的对象的状态，而不是哈表中的其他对象。\n\
  \n在 Java 中，哈希表实现为链表的数组。图 9.10 每个列表被称为`桶`。要在哈表中找到对象的位置，计算其哈希码并对总桶数取模。得到的结果就是元素的桶索引。例如，如果一个对象的哈希码为\
  \ 76268 且有 128 个桶，那么它被放在桶 108（因为 76268 % 128 是 108）。也许运气很好，该桶没有其他元素。那么你只需将元素插入该桶中。当然，有时你会遇到非空桶。这被称为`哈希冲突`\
  \ (hash collision)。然后，与桶中的所有对象进行比较以查看其是否存在。如果哈希码分布足够随机且桶的数量足够大，只需要几次比较。\n\n![图](img/13_08.jpg)哈希表\n\
  \n在 `HashMap` 实现中，当桶的大小超过阈值时，它会从链表转换为平衡二叉树。当哈希函数选择不当导致产生很多冲突，或者恶意代码试图向哈希表填充许多具有相同哈码的值时，这提高了性能。\n\
  \n如果可能，哈希表的键应该属于实现 `Comparable` 接口的类。这样就可以避免由于哈希分布不良而遭受性能损失。\n\n如果哈希表变得太满，就需要`重新哈希`\
  \ (rehash)。为了重新哈希表，会创建一个具有更多桶的新表，将所有元素插入到新表中，然后丢弃原始表。`负载因子` (load factor) 决定了哈希表何时重新哈希。例如，如果负载因子为\
  \ 0.75（默认值）且表已超过 75%，就会自动重新哈希，桶的数量翻倍。对于大多数应用程序，将负载因子保持在 0.75 是合理的。\n\n如果你想更进一步控制哈希表的性能，可以指定初始桶数。你应该将其设置为预期元素数量除以负载因子。或者，从\
  \ Java 19 开始，你可以使用静态的 `newHashSet` 便利方法来为你完成此计算：\n\n```\nHashSet<String> strings\
  \ = HashSet.newHashSet(expectedElementCount);\n```\n\n\n\n一些研究人员认为，将桶（bucket）的数量设置为质数是一个好主意，可以防止键的聚集。然而，这一点的证据并不是决定性的。Java\
  \ Collections Framework 使用的桶数量是 2 的幂，默认值为 `16`。（你为桶数量提供的任何值都会被自动向上舍入到下一个 2 的幂。）\n\
  \n哈希表可以用于实现若干重要的数据结构。其中最简单的是 `set` 类型。集合（set）是一个不包含重复元素的集合。`set` 的 `add` 方法首先尝试查找要要的，，仅当该对象尚未存在时才进行添加。\n\
  \nJava Collections Framework 了一个了一个 `HashSet` 类，它基于哈希表实现了集合。你通过 `add` 方法添加元素。`contains`\
  \ 方法被重写，以便进行快速查找，检查元素是否已存在于集合中。它只检查一个桶中的元素，而不是集合中的所有元素。\n\n哈希集合迭代器（iterator）会依次访问所有的桶。由于哈希处理将元素分散在表中，因此访问这些元素的顺序似乎是随机的。如果你不在乎集合中元素的顺序，你就可以使用\
  \ `HashSet`。\n\n本节末尾的示例程序（Listing 9.2）从文件中读取单词，添加到集合中，并打印集合中的前二十个单词。例如，你可以通过命令行启动程序并将*爱丽丝仙游记*的文本输入程序：\n\
  \n```\njava set.SetTest ../gutenberg/alice30.txt\n```\n\n*爱丽丝仙游记*有 28,195 个单词，其中\
  \ 5,909 个是唯一的（包括开头的版权声明）。这些单词以随机顺序出现。随后，相同的单词被插入到一个树集合（tree set）中，正如你在后续节中看到的，它保持了元素的排序顺序。\n\
  \n在修改集合元素时要小心。如果元素的哈希码（hash code）发生变化，该元素将不再处于数据结构中的正确位置。\n\n```\nvar rects = new\
  \ HashSet<Rectangle>();\nvar rect = new Rectangle(5, 10, 20, 30);\nrects.add(rect);\
  \ \nrect.setLocation(0, 0); // rects 现在是 [java.awt.Rectangle[x=0,y=0,width=20,height=30]]\n\
  rects.remove(new Rectangle(0, 0, 20, 30)); // 返回 false，未移除\n```\n\nset/SetTest.java\n\
  \n```java\npackage set;\n\nimport java.io.IOException;\nimport java.nio.file.Path;\n\
  import java.util.*;\n\n/**\n * 此程序比较了向哈希集合和树集合插入的情况。\n * 运行程序的方式为 \n * java set.SetTest\
  \ ../gutenberg/alice30.txt\n * java set.SetTest ../gutenberg/crsto10.txt 100\n *\
  \ @version 1.2 2023-12-07\n * @author Cay Horstmann\n */\npublic class SetTest\n\
  {\n   public static void time(Set<String> wordSet, List<String> wordList, int repetitions)\
  \ \n   {\n      long totalTime = 0;\n      for (int i = 1; i <= repetitions; i++)\
  \ \n      {\n         for (String word : wordList)\n         {\n            long\
  \ start = System.nanoTime();\n            wordSet.add(word);\n            long end\
  \ = System.nanoTime();\n            totalTime += end - start;         \n       \
  \  }\n      }\n      Iterator<String> iter = wordSet.iterator(); \n      for (int\
  \ i = 1; i <= 20 && iter.hasNext(); i++) \n         System.out.print(iter.next()\
  \ + \" \");\n      System.out.println(\"...\");\n      System.out.printf(\"%s: %d\
  \ words, %d distinct, %.3f seconds.%n\",\n         wordSet.getClass().getSimpleName(),\
  \ wordList.size(), wordSet.size(), totalTime * 1E-9);\n   }\n\n   public static\
  \ void main(String[] args) throws IOException\n   {\n      List<String> words =\
  \ new ArrayList<>();\n      String filename = args.length > 0 ? args[0] : \"../gutenberg/crsto10.txt\"\
  ;\n      int repetitions = args.length > 1 ? Integer.parseInt(args[1]) : 1; \n \
  \     try (var in = new Scanner(Path.of(filename))) { \n         while (in.hasNext())\
  \ { \n            String word = in.next(); \n            words.add(word); \n   \
  \      } \n      }      \n      time(new HashSet<>(), words, repetitions);\n   \
  \   time(new TreeSet<>(), words, repetitions);\n   }\n}\n```\n\n`java.util.HashSet<E>`\
  \ 1.2\n\n* `HashSet()`\n  构造一个空的哈希集合。\n\n* `HashSet(Collection<? extends E> elements)`\n\
  \  构造一个哈希集合并添加集合中的所有元素。\n\n* `HashSet(int initialCapacity)`\n  `HashSet(int initialCapacity,\
  \ float loadFactor)`\n  构造一个具有指定容量和负载因子（或负载因子为 0.75）的空哈希集合。如果大小/容量比例超过了负载因子，哈希表将重新哈希到更大的表中。\n\
  * `static <E> HashSet<E> newHashSet(int numMappings)` 19\n  构造一个具有足够容量以容纳预期数量元素（`numMappings`）的空哈希集合。\n\
  \n`java.lang.Object` 1.0\n\n* `int hashCode()`\n  返回此对象的哈希码。哈希码可以是任何整数，正负均可。`equals`\
  \ 和 `hashCode` 的定义必须兼容：如果 `x.equals(y)` 为 `true`，那么 `x.hashCode()` 的值必须与 `y.hashCode()`\
  \ 相同。\n\n### 树集合\n\n`TreeSet` 类与哈希集合类似，但增加了一个改进。树集合是一个排序集合。你可以以任何顺序将元素插入集合。当你遍历集合时，值会自动按排序顺序呈现。例如，假设你插入了三个字符串，然后访问所有添加的元素。\n\
  \n```java\nvar sorter = new TreeSet<String>();\nsorter.add(\"Bob\");\nsorter.add(\"\
  Amy\");\nsorter.add(\"Carl\");\nfor (String s : sorter) System.out.println(s);\n\
  ```\n\n然后，值按排序顺序打印：`Amy Bob Carl`。正如类名称所示，排序是通过树形结构实现的。（目前的实现使用了*红黑树*。关于红黑树的详细描述，请参考例如\
  \ Thomas Cormen、Charles Leiserson、Ronald Rivest 和 Clifford Stein 所著 *Introduction\
  \ to Algorithms*，The MIT Press, 2022。）每当元素被添加到树中时，它都会被放置在正确的排序位置。因此，迭代器始终按排序顺序访问元素。\n\
  \n向树中添加元素比向哈希表添加元素慢。但它仍然比在数组或链列表中检查重复项快得多。如果树包含 `n` 个元素，则平均需要 log[2] `n` 次比较来为新元素找到正确的位置。例如，如果树已经包含\
  \ 1,000 个元素，添加一个新元素大约需要 10 次比较。\n\n为了使用树集合，你必须能够比较元素。元素必须实现 `Comparable` 接口，或者你在构造集合时提供一个\
  \ `Comparator`。（`Comparable` 和 `Comparator` 接口是在第 6 章 中引入的。）\n\n树集合慢多少？运行 Listing\
  \ 9.2 中的程序：\n\n```\njava set.SetTest ../gutenberg/crsto10.txt 100\n```\n\n*基督山仇*有\
  \ 466,300 个单词，每个单词被插入 100 次。在我的测试机器上，TreeSet 几乎慢了 4 倍。如果你不需要数据排序，就没有理由为排序开销付出代价。更重要的是，对于某些数据来说，设计出一个排序顺序比设计哈希函数要困难得多。哈希函数只需要对对象进行相当不错的打乱，而比较函数必须能够精确地区分对象。\n\
  \n\n\n为了让这种区别更加具体，请考虑收集一组矩形的任务。如果你使用 `TreeSet`，你需要提供一个 `Comparator<Rectangle>`。你如何比较两个矩形呢？按面积吗？这是行不通的。你可能有两个坐标不同但面积相同的矩形，而你又想保留它们。`comparator`\
  \ 必须与 `equals` 兼容；也就是说，只有当元素相等时，比较结果才能为 0。矩形确实有这样的排序顺序（基于坐标的字典序），但计算起来非常繁琐。相比之下，`Rectangle`\
  \ 类已经定义了哈希函数。它简单地对坐标进行哈希。\n\n如果 `comparator` 与元素类型的 `equals` 方法不兼容，集合的等性可能会产生不一致的结果。这里有一个典型的例子：\n\
  \n```\nvar words = new TreeSet<String>(String.CASE_INSENSITIVE_ORDER);\n```\n\n\
  意图并不是收集仅在字母大小写不同的元素：\n\n```\ncommands.add(\"QUIT\");\ncommands.add(\"quit\"); //\
  \ 不会被添加\n```\n\n然而，现在 `equals` 不再具有对称性：\n\n```\ncommands.equals(Set.of(\"quit\"\
  )) // true\nSet.of(\"quit\").equals(commands) // false\n```\n\n`TreeSet` 在 `comparator`\
  \ 返回 0 时认为两个元素相等。但另一个集合使用的是 `String.equals`。\n\n更好的方法是使用 `String.compare` 排序，并仅将小写字符串插入集合中。\n\
  \n`TreeSet` 类实现了 `NavigableSet` 接口。该接口增加了几个用于定位相邻元素的便捷方法。详情请参阅 API 注释。\n\nListing\
  \ 9.3 中的程序构建了两个包含 `Item` 对象的树形集合。第一个按部件编号排序，这是 `Item` 对象的默认排序顺序。第二个集合按描述排序，使用了一个自定义的比较器。\n\
  \n`treeSet/TreeSetTest.java`\n\n```\npackage treeSet;\n\nimport java.util.*;\n\n\
  /**\n * 此程序通过比较描述对 Item 对象的集合进行排序。\n * @version 1.2 2024-12-05\n * @author Cay Horstmann\n\
  \ */\npublic class TreeSetTest\n{\n   public static void main(String[] args)\n \
  \  {\n      var parts = new TreeSet<Item>();\n      parts.add(new Item(\"Toaster\"\
  ));\n      parts.add(new Item(\"Widget\"));\n      parts.add(new Item(\"Router\"\
  ));\n      System.out.println(parts);\n\n      var sortByDescription = new TreeSet<Item>(Comparator.comparing(Item::description));\n\
  \n      sortByDescription.addAll(parts);\n      System.out.println(sortByDescription);\n\
  \   }\n}\n```\n\n`treeSet/Item.java`\n\n```\npackage treeSet;\n\n/**\n * 具有描述和部件编号的项。\n\
  \ */\npublic record Item(String description, int partNumber) implements Comparable<Item>\n\
  {\n   public int compareTo(Item other) {\n      int diff = Integer.compare(partNumber,\
  \ other.partNumber);\n      return diff != 0 ? diff : description.compareTo(other.description);\n\
  \   }\n}\n```\n\n`java.util.TreeSet<E>` 1.2\n* `TreeSet()`\n* `TreeSet(Comparator<?\
  \ super E> comparator)` 构建一个空的树形集合。\n* `TreeSet(Collection<? extends E> elements)`\
  \ 构建一个树形集合并添加集合或集合中的所有元素（在后者的情况下，使用相同的排序顺序）。\n\n`java.util.SortedSet<E>` 1.2\n*\
  \ `Comparator<? super E> comparator()` 返回用于排序元素的比较器，如果元素是通过 `Comparable` 接口的 `compareTo`\
  \ 方法比较的，则返回 `null`。\n* `first()`\n* `last()` 返回排序集合中最小或最大的元素。\n\n`java.util.NavigableSet<E>`\
  \ 6\n* `higher(E value)`\n* `lower(E value)` 返回大于 `value` 的最小元素或小于 `value` 的最大元素，如果不存在此类元素则返回\
  \ `null`。\n* `ceiling(E value)`\n* `floor(E value)` 返回大于等于 `value` 的最小元素或小于等于 `value`\
  \ 的最大元素，如果不存在此类元素则返回 `null`。\n* `pollFirst()`\n* `pollLast()` 并返回集合中最小或最大的元素，如果集合为空则返回\
  \ `null`。\n\n### 队列和双\n\n正如我们已经讨论过的，队列（queue）允许你高效地在最后添加元素并移除第一个元素。双端队列（或 `deque`）允许你在两端高效地添加或移除元素。不支持在中间添加元素。`Deque`\
  \ 接口由 `ArrayDeque` 和 `LinkedList` 类实现，这两个类都提供了大小随需要增长的双端队列。在 Java 21 中，这些方法\n\n\
  ```\ngetFirst()\ngetLast()\naddFirst(E e)\naddLast(E e)\nremoveFirst()\nremoveLast()\n\
  ```\n\n从 `Deque` 接口移动到了 `SequencedCollection` 接口，`List` 和 `Set` 接口也扩展了该接口。这为访问集合的第一个最后一个元素提供了统一的方法。\n\
  \n`java.util.Queue<E>` 5.0\n* `boolean add(E e)`\n* `boolean offer(E e)` 将给定元素添加到此队列最后一个元素之后并返回\
  \ `true`，前提是队列未满。如果队列已满，第一个方法将抛出 `IllegalStateException`，而第二个方法返回 `false`。\n* `E\
  \ remove()`\n* `E poll()` 移除并返回此队列的第一个元素，前提是队列不为空。如果队列为空，第一个方法将抛出 `NoSuchElementException`，而第二个方法返回\
  \ `null`。\n* `E element()`\n* `E peek()` 返回此队列头部的元素但不移除它，前提是队列不为空。如果队列为空，第一个方法将抛出\
  \ `NoSuchElementException`，而第二个方法返回 `null`。\n\n`java.util.SequencedCollection<E>`\
  \ 21\n* `void addFirst(E element)`\n* `void addLast(E element)` 将给定元素添加到此集合的第一个元素之前或最后一个元素之后。如果集合已满，抛出\
  \ `IllegalStateException`。\n* `E removeFirst()`\n* `E removeLast()` 移除并返回此集合的第一个或最后一个元素，前提是集合不为空。如果集合为空，抛出\
  \ `NoSuchElementException`。\n* `E getFirst()`\n* `E getLast()` 返回此集合的第一个或最后一个元素但不移除它，前提是集合不为空。如果集合为空，抛出\
  \ `NoSuchElementException`。\n\n`java.util.Deque<E>` 6\n* `boolean offerFirst(E element)`\n\
  * `boolean offerLast(E element)` 将给定元素添加到此双端队列的第一个元素之前或最后一个元素之后。如果双端队列已满，返回 `false`。\n\
  * `E pollFirst()`\n* `E pollLast()` 移除并返回此双端队列的第一个或最后一个元素，前提是双端队列不为空。如果双端队列为空，返回\
  \ `null`。\n* `E peekFirst()`\n* `E peekLast()` 返回此双端队列的第一个或最后一个元素但不移除它，前提是双端队列不为空。如果双端队列为空，返回\
  \ `null`。\n\n`java.util.ArrayDeque<E>` 6\n* `ArrayDeque()`\n* `ArrayDeque(int initialCapacity)`\
  \ 构建一个初始容量为 16 或给定初始容量的无界双端队列。\n\n### 优先级队列\n\n优先级队列在任意插入后按顺序检索元素。也就是说，每当你调用 `remove`\
  \ 方法时，都会获取当前优先级队列中的最小元素。然而，优先级队列并没有对其元素进行排序。如果你遍历元素，它们并不一定是有序的。优先级队列利用了一种优雅且高效的数据结构，称为*堆*（heap）。堆是一种自组织的二叉树，其中\
  \ `add` 和 `remove` 操作会使最小元素向根节点汇聚，而无需浪费时间对所有元素进行排序。\n\n就像 `TreeSet` 一样，优先级队列可以包含实现\
  \ `Comparable` 接口的类的元素，也可以包含你在构造函数中提供的 `Comparator` 对象。\n\n\n\n\n优先级队列的一个典型用途是任务调度。每个任务都有一个优先级。任务按随机顺序添加。每当有新任务可以开始时，就会从队列中移除优先级最高的任务。（由于传统上优先级\
  \ 1 被视为“最高”优先级，因此 `remove` 操作返回最小元素。）\n\nListing 9.5 显示了优先级队列的运行。与 `TreeSet` 中的迭代不同，这里的迭代不会按照排序顺序访问元素。然而，移除操作总是返回剩余的最小元素。\n\
  \n`priorityQueue/PriorityQueueTest.java`\n\n```java\npackage priorityQueue;\n\n\
  import java.util.*;\nimport java.time.*;\n\n/**\n * 此程序演示了优先级队列的使用。\n * @version\
  \ 1.02 2015-06-20\n * @author Cay Horstmann\n */\npublic class PriorityQueueTest\n\
  {\n   public static void main(String[] args)\n   {\n      var pq = new PriorityQueue<LocalDate>();\n\
  \      pq.add(LocalDate.of(1906, 12, 9)); // G. Hopper\n      pq.add(LocalDate.of(1815,\
  \ 12, 10)); // A. Lovelace\n      pq.add(LocalDate.of(1903, 12, 3)); // J. von Neumann\n\
  \      pq.add(LocalDate.of(1910, 6, 22)); // K. Zuse\n\n      System.out.println(\"\
  Iterating over elements . . .\");\n      for (LocalDate date : pq)\n         System.out.println(date);\n\
  \      System.out.println(\"Removing elements . . .\");\n      while (!pq.isEmpty())\n\
  \         System.out.println(pq.remove());\n   }\n}\n```\n\n`java.util.PriorityQueue`\
  \ 5.0\n\n*   `PriorityQueue()`\n\n*   `PriorityQueue(int initialCapacity)`\n\n \
  \   创建一个用于存储 `Comparable` 对象的优先级队列。\n\n*   `PriorityQueue(int initialCapacity, Comparator<?\
  \ super E> c)`\n\n    创建一个优先级队列并使用指定的比较器对其元素进行排序。\n\n## 映射 (Maps）\n\n集合（Set）是一种让你快速找到现有元素的集合。然而，要查找一个元素，你需要拥有该元素的精确副本才能找到。这并不是非常常见的查找方式——通常，你拥有某些键信息，并想要查找关联的元素。`map`\
  \ 数据结构正是为此目的设计的。map 存储键值对（key/value pairs）。如果你提供键，就可以找到对应的值。例如，你可能会存储一个员工记录表，其中键是员工\
  \ ID，值是 `Employee` 对象。在接下来的章节中，你将学习如何使用 map。\n\n### 基础 Map 操作\n\nJava 集合框架提供了两种通用的\
  \ map 实现：`HashMap` 和 `TreeMap`。这两个类都实现了 `Map` 接口。\n\n哈希映射（hash map）对键进行哈希处理，而树映射（tree\
  \ map）使用键的排序将它们组织在搜索树中。哈希或比较函数**仅应用于键**。与键关联的值不进行哈希处理或比较。\n\n你应该选择哈希映射还是树映射？与集合一样，哈希处理通常快一点，如果你不需要按照排序顺序访问键，那么它是首选选择。\n\
  \n以下是如何设置一个用于存储员工的哈希映射：\n\n```java\nvar staff = new HashMap<String, Employee>();\
  \ // HashMap implements Map\nvar harry = new Employee(\"Harry Hacker\");\nstaff.put(\"\
  987-98-9996\", harry);\n. . .\n```\n\n每当你向 map 添加对象时，都必须提供一个键。在我们的案例中，键是一个字符串，对应的值是一个\
  \ `Employee` 对象。\n\n要检索一个对象，你必须使用（因此要记住）该键。\n\n```java\nvar id = \"987-98-9996\"\
  ;\nEmployee e = staff.get(id); // 获取 harry\n```\n\n由于历史原因，`get` 方法声明的参数类型为 `Object`，而不是键的类型。例如，以下代码可以编译：\n\
  \n```java\nlong numericId = . . .\nEmployee e = staff.get(numericId); // 可以编译，但永远无法获取值\n\
  ```\n\n如果 map 中没有存储与指定键对应的信息，`get` 将返回 `null`。\n\n`null` 返回值可能会带来不便。有时，你有一个良好的默认值，可以用于\
  \ map 中不存在的键。这时请使用 `getOrDefault` 方法。\n\n```java\nMap<String, Integer> scores =\
  \ . . .;\nint score = scores.getOrDefault(id, 0); // 如果 id 不存在则获取 0\n```\n\n键必须是唯一的。你不能存储两个具有相同键的值。如果你使用相同的键调用两次\
  \ `put` 方法，第二个值将替换第一个。事实上，`put` 返回与其键参数相关联的旧值。\n\n`remove` 方法从 map 中移除具有给定键的元素。`size`\
  \ 方法返回 map 中条目的数量。\n\n遍历 map 的键和值最简单的方法是使用 `forEach` 方法。提供一个接收键和值的 lambda 表达式。该表达式会依次为\
  \ map 中的每个条目被调用。\n\n```java\nscores.forEach((k, v) -> \n   System.out.println(\"\
  key=\" + k + \", value=\" + v));\n```\n\n\n\n\n\n为实现 `Comparable` 接口的键构建空的树形 map。\n\
  \n* `TreeMap(Comparator<? super K> c)`\n  构建一个树形 map 并使用指定的比较器对其键进行排序。\n\n* `TreeMap(Map<?\
  \ extends K, ? extends V> entries)`\n  构建一个树形 map 并添加 map 中的所有条目。\n\n* `TreeMap(SortedMap<?\
  \ extends K, ? extends V> entries)`\n  构建一个树形 map，添加排序 map 中的所有条目，并使用与给定排序 map 相同的元素比较器。\n\
  \n`java.util.SortedMap<K, V>` 1.2\n\n* `Comparator<? super K> comparator()`\n  返回用于排序键的比较器；如果键是通过\
  \ `Comparable` 接口的 `compareTo` 方法进行比较，则返回 `null`。\n\n* `K firstKey()`\n\n* `K lastKey()`\n\
  \  返回 map 中最小或最大的键。\n\n### 更新 Map 条目\n\n处理 map 时一个棘手的部分是更新条目。通常，你会获取与键关联的旧值，更新它，然后将更新后的值放回去。但你必须考虑键第一次出现的特殊情况。考虑使用\
  \ map 来统计文件中某个单词出现的次数。当我们看到一个单词时，我们想要这样增加计数器：\n\n```\ncounts.put(word, counts.get(word)\
  \ + 1);\n```\n\n这种方法可以运行，但在第一次遇到 `word` 时除外。此时 `get` 会返回 `null`，并发生 `NullPointerException`。\n\
  \n一个简单的解决办法是使用 `getOrDefault` 方法：\n\n```\ncounts.put(word, counts.getOrDefault(word,\
  \ 0) + 1);\n```\n\n另一种方法是先调用 `putIfAbsent` 方法。只有当键之前不存在（或映射为 `null`）时，它才会放入值。\n\n\
  ```\ncounts.putIfAbsent(word, 0);\ncounts.put(word, counts.get(word) + 1); // 现在我们知道\
  \ get 会成功执行了\n```\n\n但你可以做得更好。`merge` 方法简化了这种常用操作。调用：\n\n```\ncounts.merge(word,\
  \ 1, Integer::sum);\n```\n\n如果键之前不存在，则将 `word` 与 `1` 关联；否则，使用 `Integer::sum` 函数将旧值和\
  \ `1` 结合。\n\n现在考虑另一个常见情况。我们为每个键关联一个集合。例如，在书籍索引中，每个术语都有一个其出现的页码集合。以下是更新 map 的方法：\n\
  \n```\nvar index = new TreeMap<String, TreeSet<Integer>>();\n. . .\nindex.computeIfAbsent(term,\
  \ k -> new TreeSet<>()).add(pageNumber);\n```\n\n在这里，使用 `computeIfAbsent` 更好，因为只有当术语之前没有关联集合时，才会构建\
  \ `TreeSet`。方便的是，`computeIfAbsent` 返回新值，因此我们可以链式调用 `add`。相比之下，`putIfAbsent` 返回之前的键或\
  \ `null`，这对于链式调用是没有用的。\n\n很容易尝试将 `k -> new TreeSet<>()` 改为 `TreeSet::new`，但这不可通。该函数有一个用于给定键的参数\
  \ `k`，该参数会被传递给构造函数。幸运的是，`TreeSet` 没有接受 `String` 参数的构造函数，代码无法编译。\n\n情况可能会更糟。假设你有一个\
  \ `Map<Integer, ArrayList<String>>` 并调用\n\n\n\n```\nmap.computeIfAbsent(n, ArrayList::new)\n\
  ```\n\n`ArrayList` *确实* 有一个接受整数容量的构造函数。对于大的 `n` 值，会分配巨大的列表，这显然不是本意。\n\nmap 方法在 `null`\
  \ 值的处理上并不一致。某些方法将 `null` 视为有效值，而另一些方法将其视为缺失的键。\n\n`getOrDefault` 方法属于前者，而 `putIfAbsent`\
  \ 属于后者：\n\n```\ncounts.put(\"C++\", null);\ncounts.getOrDefault(\"C++\", -1) //\
  \ 返回 null 而不使用默认值\ncounts.putIfAbsent(\"C++\", 1) // 放入 1，将 null 解释为不存在\n```\n\n\
  API 注释描述了其他不常用的更新 map 条目的方法。\n\n`java.util.Map<K, V>` 1.2\n\n* `default V merge(K\
  \ key, V value, BiFunction<? super V,? super V,? extends V> remappingFunction)`\
  \ 8\n  如果 `key` 关联了一个非 `null` 值 `v`，则将函数作用于 `v` 和 `value`，并将 `key` 与结果关联，或者如果结果为\
  \ `null`，则删除该键。否则，将 `key` 与 `value` 关联。返回 `get(key)`。\n\n* `default V compute(K\
  \ key, BiFunction<? super K,? super V,? extends V> remappingFunction)` 8\n  将函数作用于\
  \ `key` 和 `get(key)`。将 `key` 与结果关联，或者如果结果为 `null`，则删除该键。返回 `get(key)`。\n\n* `default\
  \ V computeIfPresent(K key, BiFunction<? super K,? super V,? extends V> remappingFunction)`\
  \ 8\n  如果 `key` 关联了一个非 `null` 值 `v`，则将函数作用于 `key` 和 `v`。\n\n* `default V computeIfAbsent(K\
  \ key, Function<? super K,?? extends V> mappingFunction)` 8\n  如果 `key` 未关联值，则使用给定的映射函数计算其值并将其与\
  \ `key` 关联，然后返回新的（或已有的）值。\n\n* `default V merge(K key, V value, BiFunction<? super\
  \ V,? super V,? extends V> remappingFunction)` 8\n  如果 `key` 关联了一个值，则用使用当前值和给定值调用函数的结果替换其值；否则，将键与值关联。\n\
  \n* `default V replace(K key, V oldValue, V newValue)` 8\n  如果键当前映射 true 一个等于 `oldValue`\
  \ 的值，则将映射替换为 `newValue` 并返回 `oldValue`。\n\n* `default V replace(K key, V value)`\
  \ 8\n  如果键当前映射到某个值，则将映射替换为 `value` 并返回旧值。\n\n\n\n\n\n如果你在键集视图（key set view）上调用迭代器的\
  \ `remove` 方法，你实际上是从 map 中删除了键*及其关联的值*。然而，你不能向键集视图中*添加*元素。在不添加值的情况下只添加键是没有意义的。如果你尝试调用\
  \ `add` 方法，它会抛出 `UnsupportedOperationException`。项集视图（entry set view）也有相同的限制，尽管在概念上添加一个新的键/值对对似乎是有意义的。\n\
  \n`java.util.Map<K, V>` 1.2\n\n*   `Set<Map.Entry<K, V>> entrySet()`\n    返回一个 `Map.Entry`\
  \ 对象的集合视图，即 map 中的键/值对。你可以从该集合中删除元素，这些元素也会从 map 中被移除，但你不能添加任何元素。\n\n*   `Set<K>\
  \ keySet()`\n    返回 map 中所有键的集合视图。你可以从该集合中删除元素，相应的键和关联的值也会从 map 中被移除，但你不能添加任何元素。\n\
  \n*   `Collection<V> values()`\n    返回 map 中所有值的集合视图。你可以从该集合中删除元素，被移除的值及其键也会从 map\
  \ 中被移除，但你不能添加任何元素。\n\n`java.util.Map.Entry<K, V>` 1.2\n\n*   `K getKey()`\n*   `V\
  \ getValue()`\n    返回此项的键或值。\n\n*   `V setValue(V newValue)`\n    将*关联 map 中的值*更改为新值，并返回旧值。\n\
  \n*   `static <K, V> Map.Entry<K,V> copyOf(Map.Entry<? extends K,? extends V> map)`\
  \ 17\n    产生给定 map 项的副本。与 map 项集中的元素不同，该副本不是“活的（live）”的。调用 `setValue` 不会更新任何 map。\n\
  \n### 弱哈希映射 (Weak Hash Maps)\n\nJava 集合框架提供了几个用于满足特殊种的 map 类，我们将在本节及接下来的章节中简要讨论这些类。\n\
  \n`WeakHashMap` 类的设计是为了解决一个有趣的问题：当一个值的键不再被程序中的任何地方使用时，会发生什么？假设指向键的最后一个引用已经消失。那么，再也没有方法可以引用该值对象。但是，由于程序的任何部分都不持有该键，该键/值对无法从\
  \ map 中移除。为什么垃圾回收器不能移除它呢？移除未使用的对象不不是垃圾回收器的工作吗？\n\n遗憾的是，情况并非如此简单。垃圾回收器追踪*活的*对象。只要\
  \ map 对象是活的，它其中的*所有*桶都是活的，且不会被回收。因此，你的程序应该小心从长寿命 map 中移除未使用的值。或者，你可以使用 `WeakHashMap`。这种数据结构与垃圾回收器协作，当键的唯一引用来自哈希表项时，就会移除键/值对。\n\
  \n以下是该机制的工作原理。`WeakHashMap` 使用*弱引用（weak references）*来持有键。`WeakReference` 对象持有对另一个对象的引用——在我们的案例中是哈希表键。这种类型的对象会被垃圾回收器特殊对待。通常情况下，如果垃圾回收器发现某个对象没有引用指向它，它简单地回收该对象。然而，如果对象*仅*通过\
  \ `WeakReference` 可访问，垃圾回收器仍然会回收该对象，但会将指向它的弱引用放入队列中。`WeakHashMap` 的操作会定期检查该队列中新到达的弱引用。队列中弱引到达意味着该键不再被任何人使用已被收集。随后，`WeakHashMap`\
  \ 会移除关联的项。\n\n### 链接哈希集和映射 (Linked Hash Sets and Maps)\n\n`LinkedHashSet` 和 `LinkedHashMap`\
  \ 类记录了你插入项目的顺序。这样，你就可以避免哈希表中项目看似随机的顺序。当项被插入到表中时，它们被连接在一个双向链表中（参见图 9.11）。\n\n![Figure](img/13_09.jpg)一个链接哈希表\n\
  \n例如，考虑来自 Listing 9.6 的以下 map 插入：\n\n```\nvar staff = new LinkedHashMap<String,\
  \ Employee>();\nstaff.put(\"144-25-5464\", new Employee(\"Amy Lee\"));\nstaff.put(\"\
  567-24-2546\", new Employee(\"Harry Hacker\"));\nstaff.put(\"157-62-7935\", new\
  \ Employee(\"Gary Cooper\"));\nstaff.put(\"456-62-5527\", new Employee(\"Francesca\
  \ Cruz\"));\n```\n\n然后，`staff.keySet().iterator()` 按照此顺序枚举键：\n\n```\n144-25-5464\n\
  567-24-2546\n157-62-7935\n456-62-5527\n```\n\n而 `staff.values().iterator()` 按照此顺序枚举值：\n\
  \n```\nAmy Lee\nHarry Hacker\nGary Cooper\nFrancesca Cruz\n```\n\n链接哈希映射 也可以使用*访问顺序（access\
  \ order）*而非插入顺序来遍历 map 项。每当你调用 `get` 或 `put` 时，受影响的项会从其当前位置移除并放在项链表的*末尾*。（只有 `accessOrder`\
  \ 为 true 的 `LinkedHashMap` 构造函数能启用此功能）。\n\n```java\nvar cache = new LinkedHashMap<K,\
  \ V>(16, 0.75F, true) {\n    protected boolean removeEldestEntry(Map.Entry<K, V>\
  \ eldest) {\n        return size() > 100;\n    }\n};\n```\n\n### 枚举集和映射 (Enumeration\
  \ Sets and Maps)\n\n`EnumSet` 是一个高效的集合实现，其元素属于枚举类型。由于枚举类型的实例数量是有限的，`EnumSet` 在内部被简单地实现为位序列。如果相应的值存在于集合中，则该位被开启。\n\
  \n`EnumSet` 类没有公共构造函数。使用静态工厂方法来构造集合：\n\n```\nenum Weekday { MONDAY, TUESDAY, WEDNESDAY,\
  \ THURSDAY, FRIDAY, SATURDAY, SUNDAY };\nEnumSet<Weekday> always = EnumSet.allOf(Weekday.class);\n\
  EnumSet<Weekday> never = EnumSet.noneOf(Weekday.class);\nEnumSet<Weekday> workday\
  \ = EnumSet.range(Weekday.MONDAY, Weekday.FRIDAY);\nEnumSet<Weekday> mwf = EnumSet.of(Weekday.MONDAY,\
  \ Weekday.WEDNESDAY, Weekday.FRIDAY);\n```\n\n你可以使用 `Set` 接口的常用方法来修改 `EnumSet`。\n\
  \n`EnumMap` 是一个键属于枚举类型的 map。它被简单高效地实现为值数组。你需要在构造函数中指定键类型：\n\n```\nvar personInCharge\
  \ = new EnumMap<Weekday, Employee>(Weekday.class);\n```\n\n\n\n\n\n在 `EnumSet` 和\
  \ `EnumMap` 的 API 文档中，你会看到像 `E extends Enum<E>` 这种奇怪的类型参数。这仅仅意味着“E 是一个枚举类型”。所有的枚举类型都继承泛型类\
  \ `Enum`。例如，`Weekday` 继承了 `Enum<Weekday>`。\n\n### 标识哈希映射 (Identity Hash Maps)\n\n\
  `IdentityHashMap` 有非常特殊的用途。在这里，键的哈希值不应该通过 `hashCode` 方法计算，而应该通过 `System.identityHashCode`\
  \ 方法计算。这就是 `Object.hashCode` 根据对象的内存地址计算哈希码的方法。此外，对于对象的比较，`IdentityHashMap` 使用 `==`\
  \ 而不是 `equals`。\n\n换即使不同的键对象的内容相同，也被认为是不同的。该类用于实现对象遍历算法（例如对象序列化），在这些算法中，你希望跟踪哪些对象已经被遍历过。\n\
  \nJava 20 修复了 `IdentityHashMap` 中一个在 Java 8 中引入的微妙 bug（[`bugs.openjdk.org/browse/JDK-8284901`](https://bugs.openjdk.org/browse/JDK-8284901)）。两个不常用的方法错误地使用了\
  \ `equals` 而不是 `==`：\n\n```\nvoid remove(Object key, Object value)\nvoid replace(K\
  \ key, V oldValue, V newValue)\n```\n\n这些方法有时用于并发算法，在这些算法中，只有当 map 没有被另一个线程修改时才应该更新\
  \ map。可以想象一下遇到这个 bug 的第一个程序员会有多么沮丧。\n\n没有任何一个像 Java 平台这样复杂的软件系统是可以完全没有 bug 的。这就是为什么定期更新到最新版本非常重要。\n\
  \n`java.util.WeakHashMap<K, V>` 1.2\n\n* `WeakHashMap()`\n* `WeakHashMap(int initialCapacity)`\n\
  * `WeakHashMap(int initialCapacity, float loadFactor)`\n  根据指定的容量和负载因子构造一个空的哈希映射。\n\
  \n`java.util.LinkedHashSet<E>` 1.4\n\n* `LinkedHashSet()`\n* `LinkedHashSet(int\
  \ initialCapacity)`\n* `LinkedHashSet(int initialCapacity, float loadFactor)`\n\
  \  根据指定的容量和负载因子构造一个空的链接哈希集合。\n\n`java.util.LinkedHashMap<K, V>` 1.4\n\n* `LinkedHashMap()`\n\
  * `LinkedHashMap(int initialCapacity)`\n* `LinkedHashMap(int initialCapacity, float\
  \ loadFactor)`\n* `LinkedHashMap(int initialCapacity, float loadFactor, boolean\
  \ accessOrder)`\n  根据指定的容量、负载因子和顺序构造一个空的链接哈希映射。`accessOrder` 参数为 `true` 表示访问顺序，`false`\
  \ 表示插入顺序。\n* `protected boolean removeEldestEntry(Map.Entry<K, V> eldest)`\n  如果你想移除\
  \ `eldest` 条目，则应该覆盖此方法并返回 `true`。`eldest` 参数是正在考虑移除的条目。该方法在条目被添加到 map 后被调用。默认实现返回\
  \ `false`——默认情况下不会移除旧元素。但是，你可以重新定义此方法以选择性地返回 `true`——例如，如果旧的条目符合某个条件，或者 map 超过了某个大小。\n\
  \n`java.util.EnumSet<E extends Enum<E>>` 5.0\n\n* `static <E extends Enum<E>> EnumSet<E>\
  \ allOf(Class<E> enumType)`\n  返回一个包含给定枚举类型所有值的可变集合。\n* `static <E extends Enum<E>>\
  \ EnumSet<E> noneOf(Class<E> enumType)`\n  返回一个初始为空的可变集合。\n* `static <E extends\
  \ Enum<E>> EnumSet<E> range(E from, E to)`\n  返回一个包含 `from` 和 `to` 之间（包含边界）所有值的可变集合。\n\
  * `static <E extends Enum<E>> EnumSet<E> of(E e)`\n  `. . .`\n* `static <E extends\
  \ Enum<E>> EnumSet<E> of(E e1, E e2, E e3, E e4, E e5)`\n* `static <E extends Enum<E>>\
  \ EnumSet<E> of(E first, E... rest)`\n  返回一个包含给定元素的可变集合，这些元素不能为 `null`。\n* `public\
  \ static <E extends Enum<E>> EnumSet<E> copyOf(EnumSet<E> s)`\n* `public static\
  \ <E extends Enum<E>> EnumSet<E> copyOf(Collection<E> c)`\n  创建一个初始包含给定元素的可变集合。在第二个方法中，`c`\
  \ 必须是一个 `EnumSet` 或者是非空的（以便确定元素类型）。\n\n`java.util.EnumMap<K extends Enum<K>, V>`\
  \ 5.0\n\n* `EnumMap(Class<K> keyType)`\n  构造一个空的可变映射，其键具有给定的类型。\n\n`java.util.IdentityHashMap<K,\
  \ V>` 1.4\n\n* `IdentityHashMap()`\n* `IdentityHashMap(int expectedMaxSize)`\n \
  \ 构造一个空的标识哈希映射，其容量为超过 1.5 × `expectedMaxSize` 的最小 2 的幂。（`expectedMaxSize` 的默认值为\
  \ `21`。）\n\n`java.lang.System` 1.0\n\n* `static int identityHashCode(Object obj)`\
  \ 1.1\n  返回与 `Object.hashCode` 计算相同的哈希码（派源自对象的内存地址），即使 `obj` 所属的类也是如此。\n\n### 拷贝\
  \ (Copies and Views)\n\n这种技术在 Java 框架中有很多应用。我们将在后面的章节中讨论这些应用。\n\n### 小集合 (Small\
  \ Collections)\n\n这些静态方法返回包含给定元素的集合，以及包含给定键值对的 map。\n\n例如，\n\n```\nList<String>\
  \ names = List.of(\"Peter\", \"Paul\", \"Mary\");\nSet<Integer> numbers = Set.of(2,\
  \ 3, 5);\n```\n\n返回包含三个元素的列表和集合。\n\n你也可以提供对象数组：\n\n```\nString[] namesArray = {\
  \ \"Peter\", \"Paul\", \"Mary\" };\nList<String> names = List.of(namesArray); //\
  \ 包含三个对象\n```\n\n如果你提供原始类型数组，结果是一个包含单个元素的列表，即数组：\n\n```\nint[] numbersArray = {\
  \ 2, 3, 5 };\nList<int[]> arrays = List.of(numbersArray); // 包含单个对象，int[]\n```\n\
  \n没有将原始类型数组转换为包装元素的便利方法。\n\n对于 map，你可以这样指定键和值：\n\n```\nMap<String, Integer> scores\
  \ = Map.of(\"Peter\", 2, \"Paul\", 3, \"Mary\", 5);\n```\n\n元素、键或值不能为 `null`。集合和\
  \ map 的键不能重复：\n\n```\nnumbers = Set.of(13, null); // Error--null element\nscores\
  \ = Map.of(\"Peter\", 4, \"Peter\", 2); // Error--duplicate key\n```\n\n对这些集合和 map\
  \ 的迭代顺序没有任何保证。事实上，它们的顺序是经过故意处理，在每次虚拟机启动时被打乱的。看这两个 `jshell` 运行：\n\n```\n$ jshell\
  \ -q\njshell> Set.of(\"Peter\", \"Paul\", \"Mary\")\n$1 ==> [Peter, Mary, Paul]\n\
  jshell> /exit\n$ jshell -q\njshell> Set.of(\"Peter\", \"Paul\", \"Mary\")\n$1 ==>\
  \ [Paul, Mary, Peter]\n```\n\n有些 Java 程序员编写的程序的正确性取决于对实现细节永远改变的假设。这使得框架实现者很难进行有效的实现更改。在这种情况下，信息很明确——不要编写假设元素顺序的程序。\n\
  \n`List` 和 `Set` 接口有 11 个具有零到十个参数的 `of` 方法，以及一个具有变数量参数的 `of` 方法。提供这些特化方法是为了提高效率。\n\
  \n\n\n\n\n对于 `Map` 接口，无法提供带有可变参数的版本，因为参数类型在键和值类型之间交替出现。有一个静态方法 `ofEntries`，它可以接收任意数量的\
  \ `Map.Entry<K, V>` 对象，你可以通过静态方法 `entry` 来创建这些对象。例如：\n\n```\nimport static java.util.Map.*;\n\
  . . .\nMap<String, Integer> scores = ofEntries(\n   entry(\"Peter\", 2),\n   entry(\"\
  Paul\", 3),\n   entry(\"Mary\", 5));\n```\n\n`of` 和 `ofEntries` 方法产生的对象类为每个元素都拥有一个实例变量，或者由数组支持。\n\
  \n这些集合对象是**不可修改的**（`unmodifiable`）。任何更改其内容的尝试都会导致 `UnsupportedOperationException`\
  \ 异常。\n\n如果你想要一个可变的集合，可以将不可修改的集合传递给构造函数：\n\n```\nvar names = new ArrayList<>(List.of(\"\
  Peter\", \"Paul\", \"Mary\")); // 一个可变的名称列表\n```\n\n方法调用\n\n```\nCollections.nCopies(n,\
  \ anObject)\n```\n\n返回一个实现了 `List` 接口的不可变对象，并产生具有 `n` 个元素的幻象，每个每个元素看起来都是 `anObject`。\n\
  \n例如，以下调用创建了一个包含 100 个字符串的 `List`，它们都被设置为 `\"DEFAULT\"`：\n\n```\nList<String> settings\
  \ = Collections.nCopies(100, \"DEFAULT\");\n```\n\n存储成本非常低——该对象只存储一次。\n\n`Collections`\
  \ 类包含许多实用方法，其参数或返回值是集合。不要将其与 `Collection` 接口混淆。\n\nJava 并没有 `Pair` 类，有些程序员使用 `Map.Entry`\
  \ 作为一种廉价的对（pair）实现。\n\n### 不可修改的副本和视图\n\n要制作集合的**不可修改副本**，请使用该集合类型的 `copyOf` 方法：\n\
  \n```\nArrayList<String> names = . . .;\nSet<String> nameSet = Set.copyOf(names);\
  \ // 作为不可修改集合的名称\nList<String> nameList = List.copyOf(names); // 作为不可修改列表的名称\n```\n\
  \n与 `of` 方法一样，`copyOf` 方法拒绝创建包含 `null` 元素的集合，而是抛抛出 `NullPointerException`。\n\n每个\
  \ `copyOf` 方法都会制作集合的副本。如果原始集合被修改，副本不受影响。\n\n如果原始集合恰好是不可修改的且类型正确，那么 `copyOf` 只会直接返回它：\n\
  \n```\nSet<String> names = Set.of(\"Peter\", \"Paul\", \"Mary\");\nSet<String> nameSet\
  \ = Set.copyOf(names); // 不需要制作副本：names == nameSet\n```\n\n`Collections` 类拥有可以产生集合的**不可修改视图**的方法。这些视图为现有集合添加了运行时检查。如果检测到尝试修改不可修改集合的尝试，将会抛出异常。\n\
  \n然而，如果原始集合发生了变化，视图会反映这些变化。这正是视图与副本的区别。\n\n你通过八种方法获取不可修改的视图：\n\n```\nCollections.unmodifiableCollection\n\
  Collections.unmodifiableList\nCollections.unmodifiableSet\nCollections.unmodifiableSortedSet\n\
  Collections.unmodifiableNavigableSet\nCollections.unmodifiableMap\nCollections.unmodifiableSortedMap\n\
  Collections.unmodifiableNavigableMap\n```\n\n每个方法都定义为在接口上工作。例如，`Collections.unmodifiableList`\
  \ 可以与 `ArrayList`、`LinkedList` 或任何实现 `List` 接口的类一起。\n\n例如，假设你想让代码的某部分查看但不触碰集合的内容。你可以这样做：\n\
  \n```\nvar staff = new LinkedList<String>();\n. . .\nlookAt(Collections.unmodifiableList(staff));\n\
  ```\n\n`Collections.unmodifiableList` 方法返回一个实现 `List` 接口的类的对象。它的访问器方法从 `staff` 集合中检索取值。当然，`lookAt`\
  \ 方法可以调用 `List` 接口的所有方法，而不仅仅是访问器。但所有变异器方法（如 `add`）都已重新定义，变为抛出 `UnsupportedOperationException`，而不是将调用转发给底层集合。\n\
  \n不可修改视图并没有让集合本身变得不可变。你仍然可以通过其原始引用（在我们的例子中为 `staff`）修改集合。你仍然可以对集合的元素调用变异器方法。\n\n\
  视图封装的是`接口` 而不是实际的集合对象，因此你只能访问接口中定义的方法。例如，`LinkedList` 类有便利方法 `addFirst` 和 `addLast`，它们并不属于\
  \ `List` 接口。这些方法无法通过不可修改视图访问。\n\n`unmodifiableCollection` 方法（以及本节稍后讨论的 `synchronizedCollection`\
  \ 和 `checkedCollection` 方法）返回的集合其 `equals` 方法**不会**调用底层集合的 `equals` 方法。相反，它继承自 `Object`\
  \ 类的 `equals` 方法，该方法仅测试对象是否相同。如果你将一个集合或列表转换为普通集合，你就无法再测试内容是否相等。视图之所以这样做是因为在层次结构的这个层级上，等性测试没有良好的定义。视图处理\
  \ `hashCode` 方法的方式相同。\n\n优先使用 `unmodifiableSet` 和 `unmodifiableList` 包装，它们的 `equals`\
  \ 和 `hashCode` 方法对于集合和列表是合适的。\n\n例如：\n\n```\nvar names = Set.of(\"Peter\", \"Paul\"\
  , \"Mary\");\nCollections.unmodifiableSet(names) // true\nCollections.unmodifiableList(names)\
  \ // true\n```\n\n### 子范围\n\n你可以为集合创建子范围视图。例如，假设你有一个列表 `staff` 并想要提取 10 到 19 的元素。使用\
  \ `subList` 方法获取子范围的视图：\n\n```\nList<Employee> group2 = staff.subList(10, 20);\n\
  ```\n\n第一个索引包含，第二个索引排除——就像 `String` 类的 `substring` 操作一样。\n\n你可以对子范围应用任何操作，这些操作会自动反映\
  \ `staff`。例如，你可以清除整个子范围：\n\n```\ngroup2.clear(); // staff\n```\n\n元素从 `staff` 中被清除，`group2`\
  \ 为空。\n\n对于排序集合和映射，你使用排序而不是元素位置来形成子范围。`SortedSet` 接口声明了三个方法：\n\n```\nSortedSet<E>\
  \ subSet(E from, E to)\nSortedSet<E> headSet(E to)\nSortedSet<E> tailSet(E from)\n\
  ```\n\n这些返回大于或等于 `from` 且小于 `to` 的元素集。对于排序映射，相似的方法\n\n```\nSortedMap<K, V> subMap(K\
  \ from, K to)\nSortedMap<K, V> headMap(K to)\nSortedMap<K, V> tailMap(K from)\n\
  ```\n\n返回映射中其中*键*落在指定范围内的条目的视图。\n\n`NavigableSet` 接口对这些子范围操作提供了更多控制。你可以指定边界是否包含：\n\
  \n```\nNavigableSet<E> subSet(E from, boolean fromInclusive, E to, boolean toInclusive)\n\
  NavigableSet<E> headSet(E to, boolean toInclusive)\nNavigableSet<E> tailSet(E from,\
  \ boolean fromInclusive)\n```\n\n### 来自布尔值映射的集合\n\n有时 API 提供了你希望在集合使用的有用映射。在 9.4.5\
  \ 节中，你看到了如何使用 `LinkedHashMap` 构建一个丢弃元素的缓存。`LinkedHashSet` 类没有这种能力。\n\n如果你想要一个包含\
  \ 100 个最近插入字符串的集合，创建一个 `LinkedHashMap<String, Boolean>`，然后调用 `Collections.newSetFromMap`\
  \ 方法：\n\n```\nSet<String> cache = Collections.newSetFromMap(new LinkedHashMap<String,\
  \ Boolean>()\n   {\n      protected boolean removeEldestEntry(Map.Entry<String,\
  \ Boolean> eldest)\n      {\n         return size() > 100;\n      }\n   });\n```\n\
  \n\n\n该视图由 map 支持。当你添加一个元素 `e` 时，该视图会在 map 中放入一个键为 `e` 且值为 `Boolean.TRUE` 的条目。如果这导致\
  \ map 的条目数超过 100 个，则最旧的条目将被移除。\n\n你应该使用一个空 map 来调用 `newSetFromMap`。之后，不要修改该 map，而是让所有修改都通过集合视图的方法进行。实现这一点的最佳方法是将该\
  \ map 传递给 `newSetFromMap` 方法而不保留对它的引用，如前一个示例所示。\n\n`newSetFromMap` 方法在使用 `WeakHashMap`\
  \ 时也很有用（参见第 9.4.4 节）。对于 `ConcurrentHashMap`，请使用 `newKeySet` 方法代替（参见第 10 章）。\n\n\
  ## 反转视图 (Reversed Views)\n\n`SequencedCollection` 和 `SequencedSet` 接口的 `reversed`\
  \ 方法产生产生以反序查看元素的视图。例如，以下是反向遍历字符串列表或树形集合的方法：\n\n```\nfor (String element : collection.reversed())\n\
  {\n   do something with element\n}\n```\n\n对于 `SequencedMap`，`reversed` 方法以反序查看具有键的\
  \ map。\n\n## 检查视图 (Checked Views)\n\n检查视图旨在为泛型类型中可能出现的问题提供调试支持。正如第 8 章所解释的，实际上可以将错误类型的元素“偷入”到泛型集合中。例如：\n\
  \n```\nvar strings = new ArrayList<String>();\nArrayList rawList = strings; // 仅警告，不是错误，\n\
  \                             // 为了与遗留代码兼容\nrawList.add(new Date()); // 现在 strings\
  \ 包含一个 Date 对象！\n```\n\n这个错误的 `add` 命令在运行时不会被检测到。相反，当代码的其他部分调用 `get` 并将结果强制转换为 `String`\
  \ 时，稍后会发生类型转换异常（ClassCastException）。\n\n检查视图可以检测到这个问题。按如下方式定义一个安全的列表：\n\n```\nList<String>\
  \ safeStrings = Collections.checkedList(strings, String.class);\n```\n\n视图的 `add`\
  \ 方法会检查插入的对象是否属于给定的类，如果不属于则立即抛出 `ClassCastException`。这种做法的优点是错误在正确的位置被报告：\n\n```\n\
  ArrayList rawList = safeStrings;\nrawList.add(new Date()); // 检查列表抛出 ClassCastException\n\
  ```\n\n检查视图受虚拟机可以执行的运行时检查。例如，如果你有一个 `ArrayList<Pair<String>>`，你无法防止它插入一个 `Pair<Date>`，因为虚拟机只有一个“原始”的\
  \ `Pair` 类。\n\n## 同步视图 (Synchronized Views)\n\n如果你从多个线程访问集合，你需要确保集合不会被意外破坏。例如，如果一个线程尝试向哈希表添加元素，而另一个线程正在对元素进行重新哈希，那结果将是灾难性的。\n\
  \n框架设计者没有实现线程安全的集合类，而是使用了视图机制来使普通集合线程安全。例如，`Collections` 类中的静态方法 `synchronizedMap`\
  \ 可以将任何 map 具有同步访问方法的 `Map`：\n\n```\nvar map = Collections.synchronizedMap(new HashMap<String,\
  \ Employee>());\n```\n\n你现在可以从多个线程访问 `map` 对象了。诸如 `get` 和 `put` 等方法是同步的——每个方法调用在另一个线程调用另一个方法之前必须完全完成。我们在第\
  \ 10 章中更详细地讨论了数据结构同步访问的问题。\n\n## 关于可选操作 (A Note on Optional Operations)\n\n视图通常具有某些限制——它可能是只读的，它可能无法更改大小，或者它支持删除但不支持插入（如\
  \ map 的键视图所示）。如果你尝试不适当的操作，受限的视图将抛出 `UnsupportedOperationException`。\n\n在集合和迭代器接口的\
  \ API 文档中，许多方法被描述为“可选操作”。这似乎与接口的概念相冲突。毕竟，接口的目的不是为了列出类*必须*实现的方法吗？诚然，从理论角度来看，这种安排是不如满意的。更好的解决方案可能是为只读视图和无法更改集合大小的视图设计独立的接口。然而，这将使接口数量增加三倍，框架的设计者们认为是不可接受的。\n\
  \n你是否应该将“可选”方法的技术扩展到你自己的设计中？我认为不需要。尽管集合被频繁使用，但实现它们的编码风格对于其他问题领域来说并不典型。集合类库的设计者必须解决一组特别严酷的冲突需求。用户希望库易于学习、方便使用、完全泛型、防呆，并且像手编写的算法一样高效。要同时实现所有这些目标显然是不可能的，甚至接近都做不到。但在你自己的编程问题中，很少会遇到如此极端的约束。你应该能够找到不依赖于“可选”接口操作这种剧烈措施的解决方案。\n\
