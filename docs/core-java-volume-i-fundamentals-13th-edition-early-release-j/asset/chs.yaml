  \n*Cay Horstmann*\n\n*德国杜塞尔多夫*\n\n*2023 年 10 月*\n\n# Java 简介\n\nJava 在 1996 年的首次发布在计算机新闻界引起了巨大的兴奋，不仅是在计算机媒体，在如《纽约时报》、《华盛顿邮报》和《商业周》等主流媒体中。Java\
  \ 有一个独特的身份，它是第一个也是唯一在公共广播电上进行十分钟介绍的编程语言。一个 100,000 美元的风险基金完全是为了这种*特定的*编程语言设立的。我希望你会在本文中发现\
  \ Java 的简单历史。\n\n## 作为编程平台的 Java\n\n在本书的第一版中，我的合著者 `Gary Cornell` 和我写道：\n\n“作为一种计算机语言，Java\
  \ 的炒作过头了：它无疑是一种*良好的*编程语言。毫无疑问，它是严肃程序员提供的最好的语言之一。我们认为它*可能*成为一种伟大的语言，但一旦语言进入领域，关于与现有代码兼容的糟糕现实可能就太晚了。”\n\
  \n我们的编辑受到了来自 Sun Microsystems（最初开发 Java 的公司）高层的许多批评。Java 语言具有许多优秀的特性，我们稍后将介绍。它也有许多缺点，而且由于兼容性要求，一些新添加的特性没有原始特性那样优雅。\n\
  \n但是，正如我们在第一版中所说的，Java 从来不仅仅是一种语言。Java 是一个完整的平台，拥有大量的重用代码，以及一个提供安全、跨操作系统移植性和自动垃圾收集服务的执行环境。\n\
  \n作为一名程序员，你会希望有一种良好的语法和易理解的语义的语言（例如，而不是 C++）。Java 符合要求，其他许多语言也是如此。有些语言提供了移植性、垃圾收集等功能，但它们没有大量的库，如果你想要华丽的图形、网络或数据库访问，就得自己编写。\n\
  \n## Java“白皮书”术语\n\nJava 的作者们写了一份具有影响力的白皮书，解释了他们的设计目标和成就。他们还发表了一份按照以下 11 个术语组织的简短概述：\n\
  \n1. 简单\n2. 面对象\n3. 分布式\n4. 健壮\n5. 安全\n6. 架构无关\n7. 可移植\n8. 解释型\n9. 高性能\n10. 多线程\n\
  11. 动态\n\n在接下来的章节中，你将找到一个总结，包含了白皮书的摘录介绍了 Java 设计师对每个术语的看法，以及基于我对 Java 当前版本的经验的评论。\n\
  \n\n\n\n白皮书可以在 [https://www.oracle.com/technetwork/java/langenv-140151.html] 找到。你可以在\
  \ [https://horstmann.com/corejava/java-an-overview/7Gosling.pdf] 获取包含 11 个关键词的概述。\n\
  \n## 简单 (Simple)\n\n> *我们想要构建一个可以轻松编程、无需深奥培训并利用当今标准实践的系统。因此，尽管我们发现 C++ 并不合适，但我们设计的\
  \ Java 尽可能地接近 C++，以使系统易于理解。Java 忽略了 C++ 中许多很少使用、难以理解且令人困惑的特征，根据我们的经验，这些特征带来的麻烦多于收益。*\n\
  \nJava 的语法确实是 C++ 语法的清理版本。它不需要头文件、指针算术（甚至是指针语法）、联合体（unions）、运算符重载、虚基类等。（请参见文中穿插的\
  \ C++ 注释，了解更多关于 Java 和 C++ 之间的差异。）然而，设计者并没有试图修复 C++ 的所有笨拙特性。例如，`switch` 语句的语法在 Java\
  \ 中保持不变。如果你熟悉 C++，你会发现过渡到 Java 语法是非常容易的。\n\n在 Java 发布时，C++ 实际上并不是最常用的编程语言。许多开发者使用\
  \ Visual Basic 及其拖放式编程环境。这些开发者并没有认为 Java 是简单的。Java 开发环境花费了几年才赶上。如今，Java 开发环境已经远远领先于大多数其他编程语言。\n\
  \n> *简单的另一个方面是体量小。Java 的目标之一是能够构建出可以在小型机器上独立运行的软件。基础解释器和类支持的大小约为 40K；基础标准库和线程支持（本质上是一个自包含的微内核）又增加了\
  \ 175K。*\n\n这在当时是一项巨大的成就。当然，该库从那时发展到了巨大的规模。现在有规模较小的独立版本，适用于嵌入式设备和智能卡。\n\n## 面向对象\
  \ (Object-Oriented)\n\n> *简单来说，面向对象的设计是一种关注数据（对象）以及这些对象接口的编程技术。用木工做类比，一个“面向对象”的木工主要关注他正在制作的椅子，其次才是制作椅子的工具；而一个“非面向对象”的木工则主要考虑他的工具。Java\
  \ 的面向对象设施本质上与 C++ 是类似的。*\n\n在开发 Java 时，面向对象已经相当成熟。Java 的面向对象特性与 C++ 相当。Java 和 C++\
  \ 之间的主要区别在于多继承，Java 用更简单的接口（interfaces）概念取代了它。相比 C++，Java 拥有更丰富的运行时检查能力（在第五章 中讨论）。\n\
  \n## 分布式 (Distributed)\n\n> *Java 拥有丰富的例程库来处理 HTTP 和 FTP 等 TCP/IP 协议。Java 程序可以通过\
  \ URL 打开并访问网络上的对象，就像访问本地文件系统一样简单。*\n\n如今，人们认为这是理所当然的——但在 1995 年，从 C++ 或 Visual Basic\
  \ 程序连接到服务器是一项巨大的工程。\n\n## 健壮性 (Robust)\n\n> *Java 旨在编写在各种方面都必须可靠的程序。Java 非常强调对可能问题的早期检查、后期的动态（运行时）检查，以及消除易出错的情况……Java\
  \ 与 C/C++ 之间最大的区别是 Java 拥有一种指针模型，它消除了覆盖内存和损坏数据的可能性。*\n\nJava 编译器可以检测许多在其他语言中只有运行时才会出现的问题。至于第二点，任何花费数小时追踪由指针\
  \ bug 导致的内存损坏的人都会对 Java 的这一点感到非常满意。\n\n## 安全 (Secure)\n\n> *Java 旨在用于网络化/分布式环境。为了这一目标，安全性被高度重视。Java\
  \ 能够构建无病毒、防篡改的系统。*\n\n从一开始，Java 的设计就是为了让某些攻击变得不可能，包括：\n\n* 栈溢出——蠕虫和病毒的常见攻击手段\n*\
  \ 损坏进程空间之外的内存\n* 未经许可读取或写入文件\n\n最初，Java 对下载代码的态度是“放马来吧！”。不可信的代码在沙箱环境中执行，在那里它不会影响主机系统。用户被保证不会发生任何坏事，因为\
  \ Java 代码无论来自何处永远无法逃离沙箱。\n\n然而，Java 的安全模型是复杂的。在第一版 Java 开发包（JDK）发布后不久，普林斯顿大学的一组安全专家发现了细微的漏洞，允许不可信的代码攻击主机系统。\n\
  \n最初，安全漏洞被很快修复。遗憾的是，随着时间的推移，黑客变得越来越擅长发现安全架构实现中的细微缺陷。Sun 以及随后的 Oracle 在跟进漏洞修复方面面临困难。\n\
  \n在经历了多次备受关注的攻击后，浏览器厂商和 Oracle 变得越来越谨慎。一段时间内，远程代码必须经过数字签名。如今，浏览器不再信任 Java，Java 程序的安全交付已成为遥远的记忆。\n\
  \n尽管回想起来，Java 的安全模型并没有最初预想的那样成功，但 Java 已经领先于时代。微软一种名为 ActiveX 的竞争性代码交付机制仅依赖数字签名来确保安全。显然这是不够的：正如任何微软产品用户都可以证实的那样，来自知名厂商的程序确实会崩溃并造成损害。\n\
  \n## 架构中 (Architecture-Neutral)\n\n> *编译器生成与架构无关的对象文件格式。在 Java 运行时系统存在，编译后的代码可以在许多处理器上执行。Java\
  \ 编译器通过生成与特定计算机架构无关的字节码指令来实现这一点。相反，这些指令的设计目标既便于在任何机器上解释，又便于现场翻译成原生机器代码。*\n\n为“虚拟机”生成代码在当时并不是新主意。Lisp、Smalltalk\
  \ 和 Pascal 等编程语言已经使用了这种技术多年。\n\n当然，解释虚拟机指令的速度比全速运行机器指令慢。然而，虚拟机可以选择将执行频繁的字节码序列翻译成机器代码——这一过程被称为即时编译。\n\
  \nJava 虚拟机还具有另一个优势。它增强了安全性，因为它可以检查指令序列的行为。\n\n## 可移植性 (Portable)\n\n> *与 C 和 C++\
  \ 不同，规范中没有“取决于实现”的方面。基本数据类型的大小是给定的，对它们进行算术运算的行为也是给定的。*\n\n例如，Java 中的 `int` 始终是 32\
  \ 位整数。在 C/C++ 中，`int` 可以是 16 位整数、 32 位整数，或是编译器供应商喜欢的任何大小。唯一的限制是 `int` 类型的字节数不能少于\
  \ `short int`，且不能超过 `long int`。固定数值类型的大小消除了巨大的移植难题。二进制数据以固定格式存储和传输，消除了对字节序的困扰。字符串以标准的\
  \ Unicode 格式保存。\n\n\n\n\n\n> *系统的组成库定义了可移植的接口。例如，有一个抽象的 `Window` 类，以及针对 UNIX、Windows\
  \ 和 Macintosh 的实现类。*\n\n`Window` 类的例子可能选得并不好。正如任何尝试过的人所知的，要在 Windows、Macintosh 和十种版本的\
  \ UNIX 上实现一个外观良好的用户界面，是一项具有“英雄级规模”的工程。Java 1.0 付出了这种英雄式的努力，提供了一个简单的工具包，在多个平台上提供了通用的用户界面元素。遗憾的是，结果是这个库在经过大量工作后，在不同系统上也只能提供勉强可接受的结果。那个最初的用户界面工具包从那以后被替换了一次又一次次，而跨平台的可移植性仍然是一个问题。\n\
  \n然而，对于所有与用户界面无关的内容，Java 库在让你以平台无关的方式工作方面做得非常好。你可以处理文件、正则表达式、XML、日期和时间、数据库、网络连接、线程等，而无需担心底层的操作系统。你的程序不仅是移植的，Java\
  \ API 的质量通常比原生 API 更高。\n\n### 解释型 (Interpreted)\n\n> *Java 解释器可以直接在任何已移植该解释器的机器上执行\
  \ Java 字节码。由于链接是一个更增量且轻量级的过程，开发过程可以更加快速且具探索性。*\n\n这其实有些牵强了。任何用过 Lisp、Smalltalk、Visual\
  \ Basic、Python、R 或 Scala 的人都知道什么是“快速且具探索性”的开发过程。你尝试某些东西，并立即看到结果。在 Java 存在的前 20 年里，开发环境并没有关注这种体验。直到\
  \ Java 9，`jshell` 工具才支持了快速且具探索性的编程。\n\n### 高性能 (High-Performance)\n\n> *虽然解释型字节码的性能通常绰绰有余，但在某些情况下需要更高的性能。字节码可以在运行时（即时）被翻译成适用于运行该应用程序的特定\
  \ CPU 的机器码。*\n\n在 Java 早期，许多用户不同意性能“绰绰有余”的说法。然而，今天，即时编译器（just-in-time compilers）已经变得非常优秀，足以与传统编译器竞争，而且在某些情况下甚至超过了它们，因为它们拥有更多的信息。例如，即时编译器可以监控哪些代码被频繁执行，并专门针对这些代码进行速度优化。一种更复杂的优化是函数调用的消除（或“内联”）。即时编译器知道加载了哪些类。当基于当前加载的类集合，某个特定函数从未被重写时，它可以使用内联技术，并在需要时稍后撤销该项优化。\n\
  \n### 多线程 (Multithreaded)\n\n> *[多]线程的益处是具有更好的交互响应和实时行为。*\n\n如今，我们关注并发是因为摩尔定律已经走向了终点。我们得到的不是更快的处理器，而是更多的处理器，而我们必须让它们保持忙碌。然而，当你观察大多数编程语言时，你会发现它们对这个问题表现出令人震惊的忽视。\n\
  \nJava 的理念是远超于时代的。它是第一个支持并发编程的主流语言。正如你从白皮书中看到的，它的初衷略有不同。当时，多核处理器还是稀奇事物，但 Web 编程刚刚开始，处理器花费大量时间等待服务器的响应。需要并发编程来确保用户界面不会冻结。\n\
  \n并发编程从未易事，但 Java 在使其变得易于管理方面做得非常好。\n\n### 动态 (Dynamic)\n\n> *在许多方面，Java 比 C 或 C++\
  \ 是一种动态动态语言。它的设计是为了适应不断变化的环境。库可以自由地添加新方法和实例变量，而不会对其客户端产生任何影响。在 Java 中，获取运行时类型信息是非常直接的。*\n\
  \n在代码需要添加到运行中的程序时的情况下，这是一个重要的特性。一个典型的例子是从互联网下载并在浏览器中运行的代码。在 C 或 C++ 中，这确实是一个巨大的挑战，但\
  \ Java 的设计者非常清楚动态语言如何轻松地演进运行中的程序。他们的成是将这一特性引入了主流编程语言。\n\n在 Java 获得初步成功后，微软发布了一个名为\
  \ J++ 的产品，其编程语言和虚拟机几乎与 Java 相同。这一努力未能获得市场青睐，微软随后推出了另一种名为 C# 的语言，它也与 Java 有许多相似之处，但运行在不同的虚拟机上。本书将不涵盖\
  \ J++ 或 C#。\n\n## Java Applets 与互联网\n\n这里的想法非常简单：用户将从互联网下载 Java 字节码并在自己的机器上运行它们。在网页上运行的\
  \ Java 程序被称为 `applets`。要使用 applet，你只需要一个支持 Java 的浏览器，它会为你执行这些字节码。你不需要安装任何软件。每当你访问包含\
  \ applet 的网页时，你都会获得程序的最新版本。最重要的是，得益于虚拟机的安全性，你永远不需要担心恶意代码的攻击。\n\n将 applet 插入网页的工作非常类似于嵌入图像。applet\
  \ 成为页面的一部分，文本环绕着 applet 使用的空间流动。关键点在于，这张图像是“活的”。它对用户命令做出反应，改变自己的外观，并在展示 applet 的计算机与提供服务的计算机之间交换数据。\n\
  \n图 1.1 显示了显示分子结构的 Jmol applet。通过鼠标，你可以旋转并缩放每个分子以更好地理解它的结构。在 applets 发明时，这种直接操作在网页上是无法实现的——当时只有\
  \ JavaScript 而没有 HTML canvas。\n\n```\n![图 1](img/fig1-1.jpg)Jmollet\n```\n\n当 applets\
  \ 首次出现时，它们引发了巨大的兴奋。许多人认为 applet 的吸引力是 Java 惊人人气的原因。然而，最初的兴奋很快就变成了沮败。不同版本的 Netscape\
  \ 和 Internet 浏览器运行不同版本的 Java，其中某些已经严重过时。这种糟糕的局面使得开发利用最新 Java 版本的 applet 变得日益困难。相反，Adobe\
  \ 的 Flash 技术因实现动态效果而变得流行。后来，当 Java 受到安全问题的困扰时，浏览器完全放弃了对 applet 的支持。当然，Flash 并不好。\n\
  \n## Java 短史\n\n本节介绍了 Java 演变的简史。它基于各种出版来源（最重要的是 1995 年 7 月份 *SunWorld* 杂志对 Java\
  \ 创造者的采访）。\n\nJava 可以追溯到 1991 年，当时由 Patrick Naughton 和 James Gosling（Sun Fellow，也是一位全能计算机大师）领导的\
  \ Sun 工程师小组设计一种可以用于电缆电视机盒等消费设备的小型计算机语言。由于这些设备没有大量的功率或内存，语言必须很小并生成非常紧凑的代码。此外，由于不同的制造商可能会选择不同的处理器（CPU），让语言不绑定任何单一架构至关重要。该项目的代号为\
  \ `Green`。\n\n对小型、紧凑且平台中立代码的需求引导团队设计了一种可移植的语言，为虚拟机生成中间代码。\n\n\n\n\nSun 公司的员工来自 UNIX\
  \ 背景，因此他们基于 `C++` 构建了语言，而不是 Lisp、Smalltalk 或 Pascal。但正如高斯林（Gosling）在采访中所说：“一直以来，这种语言只是一个工具，而不是目的。”高斯林决定将他的语言命名为“Oak”（橡树）（可能是因为他喜欢\
  \ Sun 公司办公室窗外那棵橡树的样子）。Sun 的员工后来发现 `Oak` 是一个已经存在的计算机语言名称，于是他们将其更名为 `Java`。事实证明，这是一个极具启发性的选择。\n\
  \n1992 年，Green 项目交付了他们的第一件产品，名为“7”。这是一个极其智能的遥控器。遗憾的是，Sun 公司没有人对生产这种产品感兴趣，Green 项目的人员不得不寻找其他方式来营销他们的技术。然而，没有任何标准的消费电子公司对此感兴趣。随后，该小组竞标了一个设计电电视盒的项目，旨在处理视频点播等新兴的电缆服务。他们没有获得该合同。（有趣的是，赢得合同的公司是由创立\
  \ Netscape 的同一个 Jim Clark 领导的——这家公司对 Java 的成功做出了巨大贡献。）\n\nGreen 项目（更名为“First Person,\
  \ Inc.”）花费了 1993 全年和 1994 年的上半年时间寻找购买其技术的人。但一无所获。（小组创始人之一、最终承担了大部分营销工作的 Patrick\
  \ Naughton 声称，在尝试销售该技术的过程中积累了 30 万英里的飞行里程。）First Person 公司于 1994 年解散。\n\n当这一切发生在\
  \ Sun 公司内部时，互联网的广域网部分变得越来越大。广域网的关键在于浏览器将超文本页面翻译到屏幕上。1994 年，大多数人使用的是 Mosaic，这是一种由伊利诺伊大学超级计算中心于\
  \ 1993 年推出的非商业性网络浏览器。（Mosaic 的部分代码由 Marc Andreessen 在读本科期间通过一个勤工俭学项目编写，时薪为 6.85\
  \ 美元。随后，他作为 Netscape 的联合创始人之一和首席技术官获得了名声和财富。）\n\n在 *SunWorld* 采访中，高斯林表示，在 1994 年年中，开发者们意识到：“我们可以构建一个非常酷的浏览器。这是客户端/服务器主流领域中少数需要我们所做的一些奇特功能之一：架构中立、实时、可靠、安全——这些问题在工作站世界并没有十分重要。所以，我们构建了一个浏览器。”\n\
  \n实际的浏览器是由 Patrick Naughton 和 Jonathan Payne 构建的，并演变成了 HotJava 浏览器，其设计旨在展示 Java\
  \ 的强大之处。该浏览器能够在网页内部执行 Java 代码。这一“技术证明”在 1995 年 5 月 23 日的 SunWorld '95 上展示，并引发了持续至今的\
  \ Java 热潮。\n\nSun 公司于 1996 年初发布了 Java 的第一个版本。人们很快意识到 `Java 1.0` 无法满足严肃应用开发的需求。确实，你可以用\
  \ `Java 1.0` 制作一个紧张的文本小程序（applet），让文本在画布上随机移动。但在 `Java 1.0` 中甚至无法打印。直率地说，`Java 1.0`\
  \ 尚未准备就绪。它的继任者版本 1.1 填补了最明显的缺陷，极大地改进了反射能力，并为 GUI 编程添加了新的事件模型。尽管如此，它的功能仍然有限。\n\n\
  1998 年 JavaOne 大会的大新闻是即将发布的 `Java 1.2`，它将早期的玩具化 GUI 和图形工具包替换为更复杂的可扩展版本。在 1998 年\
  \ 12 月发布仅三天（！）后，Sun 的营销部门将名称更改为朗朗上口的 `Java 2 Standard Edition Software Development\
  \ Kit Version 1.2`。\n\n除了标准版（Standard Edition），还引入了另外两个版本：用于手机等嵌入设备的微型版（Micro Edition），以及用于服务器端处理的企业版（Enterprise\
  \ Edition）。本书重点关注标准版。\n\n标准版的 1.3 和 1.4 版本是在初始 Java 2 发布基础上的增量改进，拥有不断增长的标准库、更高的性能，而且，当然，还修复了许多漏洞。在此期间，关于\
  \ Java applet 和客户端应用程序的大部分最初热度有所消退，但 Java 成为了服务器端应用的首选平台。\n\n5.0 版本是自 1.1 版本以来首次以重大方式更新\
  \ Java 语言的版本。（该版本最初被编号为 1.5，但版本号在 2004 年的 JavaOne 大会上跳到了 5.0。）经过多年的研究，泛型（大致可比拟 `C++`\
  \ 模板）被引入——挑战是在不更改虚拟机的情况下添加此功能。其他几个实用的语言特性也受到了 C# 的启发：“for each”循环、自动装箱（autoboxing）和注解。\n\
  \n版本 6（没有 .0 后缀）于 2006 年底发布。同样，没有语言变化，但有了额外的性能改进和库增强。\n\n随着数据中心日益依赖通用硬件而非专用服务器，Sun\
  \ Microsystems 陷入了困境，并在 2009 年被 Oracle 收购。Java 的开发停了长时间。2011 年，Oracle 发布了带有简单增强的新版本，即\
  \ Java 7。\n\n2014 年，Java 8 随之发布，带来了近二十年来 Java 语言最重的变化。Java 8 拥抱了“函数式”编程风格，使其能够轻松表达可以并发执行的计算。\n\
  \n2018 年，Java 版本每六个月发布一次，以便更快地引入预览功能。新功能可能会经过几轮预览。例如，`switch` 的模式匹配从 Java 17 开始预览了四次，直到在\
  \ Java 21 中才定稿。\n\n\n\n\n| 17 | 2021 | Switch 表达式、文本块、`instanceof` 模式匹配、记录、密封类 |\
  \ 4,859 |\n| 21 | 2023 | 虚拟线程、模式匹配 | 4,882 |\n\n## 关于 Java 的常见误解\n\n本章以列出一些关于 Java\
  \ 的常见误解的注释列表结束。\n\n### Java 是 HTML 的扩展。\nJava 是一种编程语言；`HTML` 是一种描述网页结构的方式。除了它们曾存在过用于在网页上放置\
  \ Java 小程序（applets）的 HTML 扩展之外，它们之间没有任何共同之处。\n\n### 我使用 XML，所以我不需要 Java。\nJava 是一种编程语言；`XML`\
  \ 是一种描述数据的方式。你可以用任何编程语言处理 `XML` 数据，但 `Java API` 包含了对 `XML` 处理卓越的支持。此外，许多重要的 `XML`\
  \ 工具都是用 Java 实现的。更多信息请参阅第二卷。\n\n### Java 是一门容易学习的编程语言。\n没有任何像 `Java` 这样强大的编程语言是容易的。你必须始终区分编写玩具程序有多容易与从事严肃工作有多困难。此外，请考虑本书书中只有七章讨论了\
  \ `Java` 语言。两卷书的其余章节都展示了如何使用 `Java libraries` 让这种语言工作起来。`Java libraries` 包含了成千上万个类和接口以及数万个函数。幸运的是，你不需要了解其中的每一个，但为了用\
  \ `Java` 完成任何现实任务，你确实需要了解多到令人惊讶的程度。\n\n### Java 将成为适用于所有平台的通用编程语言。\n这在理论上是。但在实践中，某些领域其他语言已经根深蒂固。`Objective\
  \ C` 及其继者 `Swift` 不会在 `iOS` 设备上被取代。浏览器中发生的任何事情都由 `JavaScript` 控制。Windows 程序用 `C++`\
  \ 或 `C#` 编写。`Java` 在服务器端编程和跨平台客户端应用程序具有优势。\n\n### Java 仅仅是另一种编程语言。\nJava 是一门很好的编程语言；大多数程序员更倾向于使用\
  \ `C`、`C++` 或 `C#`。但也出现过成百种从未获得普及的优秀编程语言，而像 `C++` 和 `Visual Basic` 这样有明显缺陷的语言却极其成功。\n\
  \n为什么？编程语言的成功在很大程度上取决于其周围`支持系统` 的实用性，而不是取决于其语法的优雅性。对于你需要实现的功能，是否有有用、方便且标准的库？是否有工具供应商构建了出色的编程和调试环境？该语言和工具集是否与整个计算基础设施的其他部分集成？`Java`\
  \ 成功是因为它的库让你能够轻松地处理网络、Web 应用程序和并发等事务。`Java` 减少指针错误是一个额外的奖励，所以程序员在使用 `Java` 时似乎效率更高——但这些因素并不是它成功的根源。\n\
  \n### Java 是私有的，因此应该被避免使用。\n当 `Java` 最初被创建时，`Sun Microsystems` 向分发商和最终用户提供了免费许可。尽管\
  \ `Sun` 对 `Java` 拥有最终控制权，但他们让许多其他公司参与了语言版本的修订和新库的设计。虚拟机和库的源代码一直免费提供，但仅供检查，不可进行修改和重新分发。`Java`\
  \ 曾是“闭源但表现友善的”。\n\n这种情况在 2007 年发生了巨大变化，当时 `Sun` 宣布未来的 `Java` 版本将根据`通用公共许可证 (GPL)`\
  \ 发布，这是与 `Linux` 使用的相同的开源许可证。`Oracle` 已承诺保持 `Java` 开源。现在有多个开源 `Java` 实现的提供者，具有不同程度的承诺和支持。\n\
  \n### Java 是解释型的，所以它对于严肃应用来说太慢了。\n在 `Java` 早期，这种语言是解释执行的。现在，`Java virtual machine`（Java\
  \ 虚拟机）使用即时编译器。你代码中的“热点”在 `Java` 中的运行速度与 `C++` 一样，在某些情况下甚至更快。\n\n### 所有 Java 程序都运行在网页内部。\n\
  曾有一段时间 `Java applets` 运行在浏览器内部。现在，`Java` 程序是运行在浏览器之外的独立应用程序。事实上，大多数 `Java` 程序运行在服务器上，为网页生成代码或计算业务逻辑。\n\
  \n### Java 程序是重大的安全风险。\n在 `Java` 早期，曾有一些关于 `Java 安全系统` 失败的广为人知的报告。研究人员将其视为寻找 `Java\
  \ 盔甲` 破绽并挑战 `applet 安全模型` 强度和复杂性的挑战。他们发现的技术失败被迅速纠正。后来，出现了更严重的漏洞，`Sun` 以及随后的 `Oracle`\
  \ 响应缓慢。浏览器厂商停止了对 `Java applets` 的支持。使 applet 可能的安全管理器架构现在已经废弃。如今，`Java applications`\
  \ 的安全性并不低于其他应用程序。由于 `virtual machine` 的保护，它们比用 `C` 或 `C++` 编写的应用程序安全得多。\n\n### JavaScript\
  \ 是 Java 的简化版本。\n`JavaScript` 是一种可以在网页内部使用的脚本语言，由 `Netscape` 发明，最初称为 `LiveScript`。`JavaScript`\
  \ 的语法让人联想起 `Java`，语言名称听起来也相似，除此之外它们之间毫无关系。特别是，`Java` 是`强类型`的——编译器可以捕获许多由于类型误用引起的错误。在\
  \ `JavaScript` 中，此类错误只有在程序运行时才会发现，这使得消除它们变得困难得多。\n\n### 有了 Java，可以用廉价的“网络设备”代替我的电脑。\n\
  当 `Java` 最初发布时，有些人豪注这将会发生。公司生产了 `Java 驱动的网络计算机` 原型，但用户尚未准备好放弃强大方便的桌面电脑，转而使用没有本地存储的受限机器。现在当然世界已经变了，对于大多数终端用户来说，重要的平台是手机或平板电脑。这些设备大部分由基于\
  \ `Java` 的 `Android platform` 控制。学习 `Java programming` 也有助于你学习 `Android programming`。\n\
  \n# Java 编程环境\n\n在本章中，你将学习如何如何安装 `Java Development Kit (JDK)` 以及如何编译和运行 `Java` 程序。你可以通过在终端窗口输入命令来运行\
  \ `JDK tools`。然而，许多程序员更倾向于集成开发环境的舒适性。你将学习如何使用免费提供的开发环境来编译和运行 `Java` 程序。一旦你掌握了本章中的技术并选择了你的开发工具，就可以进入第\
  \ 3 章，在那里将开始探索 `Java 编程语言`。\n\n## 安装 Java 开发包\n\n在过去，最完整、最新的 `Java Development Kit\
  \ (JDK)` 版本由 Oracle 提供。现在，许多不同的公司和组织，包括 `Amazon`、`Azul`、`Microsoft` 和 `Red Hat`，都提供最新的\
  \ `OpenJDK` 构建版本。每个供应商都有不同的许可条件和支持方案。`Eclipse Foundation` 为 `Linux`、`Mac OS` 和 `Windows`\
  \ 提供免费的 `JDK builds`，非常适合学习 `Java`。\n\n### 下载 JDK\n\n你可以从 `Eclipse Foundation` 的\
  \ [`adoptium.net`](https://adoptium.net) 下载 `Java Development Kit`，也可以从 `Oracle`\
  \ 的 [`www.oracle.com/java/technologies/downloads`](https://www.oracle.com/java/technologies/downloads)\
  \ 或许多其他提供者下载。\n\n根据提供者的不同，`Java Development Kit` 可能有一个品牌，例如 `Temurin` (Eclipse Foundation)、`Corretto`\
  \ (Amazon) 或 `Zulu` (Azul)。品牌名称对于 `Java programmers` 来说并不重要。\n\n\n\n\n\n您应该使用 Java\
  \ SE 21 (LTS) JDK。请参考表 2.1 了解在下载网站上可能会遇到的缩写和术语摘要。\n\n# Java 术语\n\n| 名称 | 缩写 | 解释\
  \ |\n| --- | --- | --- |\n| Java 开发工具包 | JDK | 为想要编写 Java 程序的程序员提供的软件。 |\n| Java\
  \ 运行环境 | JRE | 用于运行 Java 程序的软件，且不包含开发工具。仅支持到 Java 8。你并不需要它。 |\n| 标准版 | SE | 用于桌面和简单服务器应用程序的\
  \ Java 平台。你需要这一个。 |\n| 微型版 | ME | 用于小型设备的 Java 平台。 |\n| OpenJDK | — | Java SE 的免费开源实现。\
  \ |\n| Hotspot | — | 由 Oracle 开发的“即时编译”编译器。如果被问到，请选择这一个。 |\n| OpenJ9 | — | IBM 开发的另一个“即时编译”编译器。\
  \ |\n| GraalVM | — | 一种“提前编译”编译器，用于启动快速但不支持所有 Java 特性的可执行文件。本书书中不需要它。 |\n| 长期支持\
  \ | LTS | 支持多年的发布版本，与展示新功能的每六个月一次的发布不同。请选择最新的 LTS 版本。 |\n| Eclipse | — | 分发开源软件的基金会。\
  \ |\n| Temurin | — | Eclipse 基金会分发的 OpenJDK 品牌名称。 |\n| Adoptium | — | Eclipse 基金会内部的一个项目，为其分发提供\
  \ OpenJDK 版本和基础设施支持。 |\n\n## 安装 JDK\n\n下载 JDK 后，您需要安装它并确定它的安装位置——你稍后会需要这些信息。\n\n\
  如果你运行的是 Windows 或使用 Mac，只需启动安装程序并选择默认选项即可。\n\n在 Linux 上，将 `.tar.gz` 文件解压到你选择的目录，例如你的家目录或\
  \ `/opt`。然后，将 `PATH` 设置为 JDK 所在目录的 `bin` 子目录，例如 `/opt/jdk-21.0.4/bin`。这通常通过向你的 `~/.bashrc`\
  \ 或 `~/.bash_profile` 文件末尾添加如下行来实现：\n\n```\nexport PATH=/opt/jdk-21.0.4/bin:$PATH\n\
  ```\n\n以下是测试你是否操作正确的的方法。启动终端窗口。输入该行：\n\n```\njavac --version\n```\n\n并按回车键。你应该得到类似下面的显示：\n\
  \n```\njavac 21.0.4\n```\n\n如果你收到了类似“javac: command not found”或“指定的名称不是内部或外部命令、可运行程序或批处理文件”的消息，那么你需要双检查你的安装情况。\n\
  \n了解 JDK 在系统上的安装位置通常很有用——请参考表 2.2。在本书中，安装目录标记为 `jdk`。例如，当引用 `jdk`/bin` 目录时，我指的是像\
  \ `/opt/jdk-17.0.4/bin` 或 `C:\\Program Files\\Java\\jdk-21\\bin` 目录。\n\n### JDK\
  \ 安装目录\n\n| 平台 | 示例目录 |\n| --- | --- |\n| Windows (Adoptium) | `C:\\Program Files\\\
  Eclipse Adoptium\\jdk-21.0.4.11-hotspot` |\n| Windows (Oracle OpenJDK) | `C:\\Program\
  \ Files\\Java\\jdk-21` |\n| Mac OS | `/Library/Java/JavaVirtualMachines/jdk-21.0.4_11.jdk/Contents/Home`\
  \ |\n| Linux | 你解压 `.tar.gz` 文件的位置，例如 `/opt/jdk-21.0.4` |\n\n在 Windows 上，Oracle\
  \ JDK 安装程序会将目录 `C:\\Program Files\\Common Files\\Oracle\\Java\\javapath` 添加到 `PATH`\
  \ 环境变量。该目录仅包含 `javac`、`javaw`、`java` 和 `jshell` 可执行文件。（你将在本章学习如何使用 `javac`、`java`\
  \ 和 `jshell`。`javaw` 可执行文件是 Windows 特有的功能，用于在不启动控制窗口的情况下启动程序。）Java 开发包中的其他工具可以在\
  \ JDK 安装目录的 `bin` 子目录中找到。调用这些程序时，指定完整路径（例如 `javadoc` 工具的 `C:\\Program Files\\Java\\\
  jdk-21\\bin\\javadoc`），或将 `bin` 子目录添加到 `PATH` 环境变量中。实现这一点的方法之一是使用 `setx` 命令：\n\n\
  ```\nsetx PATH \"%PATH%;c:\\Program Files\\Java\\jdk-21\\bin\"\n```\n\n打开另一个终端窗口使更改生效。\n\
  \n[`adoptium.net`](https://adoptium.net) 安装程序没有这个问题。它将所有 JDK 工具都添加到 `PATH` 中。\n\n\
  ### 安装源码和文档\n\n库源码以压缩文件 `jdk`/lib/src.zip` 的形式随 JDK 提供。解压该文件以获取源码。只需执行以下操作：\n\n\
  1. 确保 JDK 已安装且 `jdk`/bin` 目录在可执行路径上。\n2. 在你的家目录中创建一个 `javasrc` 目录。如果你愿意，可以在命令行执行：\n\
  \n    ```\n    mkdir javasrc\n    ```\n3. 在浏览器中，导航到 `jdk`/lib` 目录。将 `src.zip` 文件解压到你的家目录。它们将位于\
  \ `javasrc` 目录中。如果你愿意，可以通过命令行执行：\n\n    ```\n    jar xvf src.zip\n    ```\n4. `src.zip`\
  \ 文件包含所有公共库的源码。要获取编译器、虚拟机类，请进入 `javasrc` 目录。如果你愿意，可以在命令行执行：\n\n    ```\n    cd javasrc\n\
  \    ```\n\n\n\n\n\n# 恭喜！你刚刚编译并运行了你的第一个 Java 程序。\n\n发生了什么？`javac` 程序是 Java 编译器。它将\
  \ `Welcome.java` 文件编译成 `Welcome.class` 文件。`java` 程序启动 Java 虚拟机。它执行编译器放在类文件中的字节码。\n\
  \n`Welcome` 程序非常简单。它仅仅向终端打印了一条条消息。你可能对查看该程序的内部实现感兴趣，如 列表 2.1 所示。你将在下一章中看到它是如何工作的。\n\
  \n`Welcome/Welcome.java`\n\n```java\n/**\n * 此程序向读者显示问候语。\n * @version 1.30 2014-02-27\n\
  \ * @author Cay Horstmann\n */\npublic class Welcome\n{\n   public static void main(String[]\
  \ args)\n   {\n      String greeting = \"Welcome to Core Java!\";\n      System.out.println(greeting);\n\
  \      for (int i = 0; i < greeting.length(); i++)\n         System.out.print(\"\
  =\");\n      System.out.println();\n   }\n}\n```\n\n在集成开发环境时代，许多程序员并不熟悉在终端窗口中运行程序。可能会出现任何问题，并导致令人沮丧的结果。\n\
  \n请注意以下几点：\n\n1.  如果你是手动输入程序，请确保正确输入了大写和小写字母。特别是类名是 `Welcome`，而不是 `welcome` 或 `WELCOME`。\n\
  \n2.  编译器需要一个文件名（`Welcome.java`）。当你运行程序时，你指定类名（`Welcome`），而不带 `.java` 或 `.class`\
  \ 后缀。\n\n3.  如果你收到类似“无效的命令或文件名”或“javac: 找不到命令”的消息，请返回并检查你的安装情况，特别是可执行路径的设置。\n\n\
  4.  如果 `javac` 报告找不到 `Welcome.java` 文件，你应该检查该文件是否存在于目录中。\n\n    - 在 Linux 下，检查你是否对\
  \ `Welcome.java` 使用正确的大小写。\n    - 在 Windows 下，使用 `dir` 命令，而不是图形化的资源管理器工具。某些文本编辑器（特别是记事本）坚持在每个文件名的后面添加\
  \ `.txt` 扩展名。如果你使用记事本编辑 `Welcome.java`，它实际上将其保存为 `Welcome.java.txt`。在默认的 Windows\
  \ 设置下，资源管理器会与记事本配合并隐藏 `.txt` 扩展名，因为它属于“已知文件类型”。在这种情况下，你需要重命名文件，或者重新保存时给文件名加上引号：`\"\
  Welcome.java\"`。\n\n5.  如果你启动程序并收到关于 `java.lang.NoClassDefFoundError` 的错误消息，请仔细检查出错的类名。\n\
  \n    - 如果你收到关于 `welcome`（带小写 `w`）的提示，那么你应该重新执行带大写 `W` 的 `java Welcome` 命令。一如既常，Java\
  \ 对大小写非常敏感。\n    - 如果你收到关于 `Welcome/java` 的提示，意味着你不小心输入了 `java Welcome.java`。请重新执行命令\
  \ `java Welcome`。\n\n从 Java 11 开始，如果你只有一个源文件，可以跳过 `javac` 命令。此功能用于 脚本（以“shebang”行\
  \ `#!/path/to/java` 开头），可能也用于简单的学生程序。一旦你的程序变得复杂，你就需要使用 `javac`。\n\n`Welcome` 程序并不十分有趣。接下来，尝试一个图形应用程序。这个程序是一个简单的图像文件查看器，用于加载并显示图像。和之前一样，从命令行编译并运行程序。\n\
  \n1.  打开终端窗口。\n2.  切换到目录 `corejava/v1ch02/ImageViewer`。\n3.  输入以下内容：\n\n```bash\n\
  javac ImageViewer.java\njava ImageViewer\n```\n\n弹出一个新程序窗口显示 ImageViewer 应用程序。现在，选择\
  \ File（文件）→ Open（打开）并寻找一个图像文件打开。（同一目录下有两个示例文件）。图像将被显示（参见 图 2.2）。要关闭程序，点击标题栏上的 Close（关闭）框或从菜单选择\
  \ File → Exit（退出）。\n\n![Figure](img/ImageViewer.jpg)\n运行 ImageViewer 应用程序\n\n快速查看一下源代码（列表\
  \ 2.2）。该程序比第一个程序长得多，但如果你考虑到用 C 或 C++ 编写类似的应用需要多少代码，它就没太复杂。当然，现在编写带有图形用户界面的桌面应用已不再常见，但如果你感兴趣，可以在第二卷第\
  \ 10 章 中找到更多细节。\n\n`ImageViewer/ImageViewer.java`\n\n```java\nimport java.awt.*;\n\
  import java.io.*;\nimport javax.swing.*;\n\n/**\n * 用于查看图像的程序。\n * @version 1.31\
  \ 2018-04-10\n * @author Cay Horstmann\n */\npublic class ImageViewer\n{\n   public\
  \ static void main(String[] args)\n   {\n      EventQueue.invokeLater(() ->\n  \
  \       {\n            var frame = new ImageViewerFrame();\n            frame.setTitle(\"\
  ImageViewer\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n         });\n   }\n}\n\n/**\n * 一个带有显示标签的帧。\n\
  \ */\nclass ImageViewerFrame extends JFrame\n{\n   private static int DEFAULT_WIDTH\
  \ = 300;\n   private static final int DEFAULT_HEIGHT = 400;\n\n   public ImageViewerFrame()\n\
  \   {\n      setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n      // 使用标签显示图像\n    \
  \  var label = new JLabel();\n      add(label);\n\n      // 设置文件选择器\n      var chooser\
  \ = new JFileChooser();\n      chooser.setCurrentDirectory(new File(\".\"));\n\n\
  \      // 设置菜单栏\n      var menuBar = new JMenuBar();\n      setJMenuBar(menuBar);\n\
  \n      var menu = new JMenu(\"File\");\n      menuBar.add(menu);\n\n      var openItem\
  \ = new JMenuItem(\"Open\");\n      menu.add(openItem);\n      openItem.addActionListener(event\
  \ ->\n         {\n            // 显示对话框\n            int result = chooser.showOpenDialog(null);\n\
  \n            // 如果选择了文件，将其设置为标签的图标\n            if (result == JFileChooser.APPROVE_OPTION)\n\
  \            {\n               String name = chooser.getSelectedFile().getPath();\n\
  \               label.setIcon(new ImageIcon(name));\n            }\n         });\n\
  \n      var exitItem = new JMenuItem(\"Exit\");\n      menu.add(exitItem);\n   \
  \   exitItem.addActionListener(event -> System.exit(0));\n   }\n}\n```\n\n## 使用集成开发环境\n\
  \n在前面的节中，你学习了如何从命令行编译和运行 Java 程序。这是一项实用的技能，但对于大多数日常工作，你应该使用集成开发环境。这些环境非常强大且方便，没有它们工作将毫无意义。优秀的选择有免费的\
  \ Eclipse、IntelliJ IDEA 和 NetBeans。在本章中，你将学习如何使用 Eclipse。\n\n通过 [`eclipse.org/downloads`](https://eclipse.org/downloads)\
  \ 下载 Eclipse。适用于 Linux、Mac OS X 和 Windows。运行安装程序并选择名为“Eclipse IDE for Java Developers”的安装包。\n\
  \n是用 Eclipse 编写程序的步骤：\n\n1.  启动 Eclipse 后，从菜单选择 File → New → Project。\n2.  在向导对话框中选择“Java\
  \ Project”（参见 图 2.3）。\n3.  点击 Next 按钮。*取消勾选*“Use default location”框框。点击 Browse 并导航到\
  \ `corejava/v1ch02/Welcome` 目录（[图 2.4](#index.xhtml_ch02fig06））。\n4.  点击 Finish\
  \ 按钮。项目现在已创建。\n\n\n\n\n5. 点击左侧窗格项目旁三角形，直到找到 `Welcome.java` 文件，然后双击它。你现在应该能看到一个显示程序代码的面板（参见图\
  \ 2.5）。\n\n![Figure](img/eclipse-editor.jpg)使用 Eclipse 编辑源文件\n\n6. 使用鼠标右键点击左侧窗格中的项目名称（Welcome）。选择\
  \ Run（运行）→ Run As（运行方式）→ Java Application（Java ）。程序输出显示在控制台面板中。\n\n假设这个程序没有拼写错误或错误。（毕竟它只有几行代码。）为了讨论方便，让我们假设你的代码偶尔包含拼写错误（甚至可能是语法错误）。尝试一下吧——例如，通过如下方式更改\
  \ `String` 的大小写来搞坏你的文件：\n\n```\nstring greeting = \"Welcome to Core Java!\";\n```\n\
  \n注意 `string` 下方的波浪线。在源代码下方的标签页中，点击 Problems（问题）并展开三角形，直到你看到一条关于未知 `string` 类型的错误消息（参见图\
  \ 2.6）。点击错误消息。光标移动到编辑面板中对应的行，你可以在那里纠正错误。这让你能够快速修复错误。\n\n![Figure](img/eclipse-errors.jpg)Eclipse\
  \ 中的错误消息\n\n通常，Eclipse 错误报告会伴随着一个灯泡图标。点击灯泡可以获取建议的修复列表。\n\n## JShell\n\nJShell 程序提供了一个“读取-求值-打印循环”，即\
  \ REPL。你输入一个 Java 表达式；JShell 评估你的输入，打印结果，并等待你的下一次输入。这是实验的一种极佳方式——比在集成开发环境中编写完整的程序要快得多。\n\
  \n要启动 JShell，只需在终端窗口中输入 `jshell`（参见图 2.7）。\n\n![](img/jshell.jpg)运行 JShell\n\nJShell\
  \ 启动时会显示欢迎语，随后是提示符：\n\n```\n|  Welcome to JShell -- Version 21.0.4\n|  For an introduction\
  \ type: /help intro\n\njshell>\n```\n\n现在输入一个表达式，例如\n\n```\n\"Core Java\".length()\n\
  ```\n\nJShell 响应返回结果——在这种情况下，是字符串“Core Java”的字符数。\n\n```\n$1 ==> 9\n```\n\n注意你*不需要*输入\
  \ `System.out.println`。JShell 会自动打印你输入的每一个表达式的值。\n\n输出中的 `$1` 表示该结果可以进一步计算。例如，如果你输入\n\
  \n```\n5 * $1 - 3\n```\n\n响应是\n\n```\n$2 ==> 42\n```\n\n如果你需要多次使用一个变量，可以给它起一个更容易记忆的名字。例如，\n\
  \n```\njshell> var answer = 6 * 7\nanswer ==> 42\n```\n\n另一个实用的功能是 Tab 补全。输入\n\n\
  ```\nMath.\n```\n\n按下 Tab 键。因为有很多补全选项，系统会提示再次按下 Tab 键。你将获得可以使用 `Math` 类调用的所有方法列表：\n\
  \n```\njshell> Math.\nE                       IEEEremainder(          PI       \
  \               \nTAU                     abs(                    absExact(    \
  \           \nacos(                   addExact(               asin(            \
  \       \natan(                   atan2(                  cbrt(                \
  \   \nceil(                   ceilDiv(                ceilDivExact(           \n\
  ceilMod(                clamp(                  class                   \ncopySign(\
  \               cos(                    cosh(                   \ndecrementExact(\
  \         divideExact(            exp(                    \nexpm1(             \
  \     floor(                  floorDiv(               \nfloorDivExact(         \
  \ floorMod(               fma(                    \ngetExponent(            hypot(\
  \                  incrementExact(         \nlog(                    log10(    \
  \              log1p(                  \nmax(                    min(          \
  \          multiplyExact(          \nmultiplyFull(           multiplyHigh(     \
  \      negateExact(            \nnextAfter(              nextDown(             \
  \  nextUp(                 \npow(                    random()                rint(\
  \                   \nround(                  scalb(                  signum(  \
  \               \nsin(                    sinh(                   sqrt(        \
  \           \nsubtractExact(          tan(                    tanh(            \
  \       \ntoDegrees(              toIntExact(             toRadians(           \
  \   \nulp(                    unsignedMultiplyHigh( \n```\n\n现在输入 `l` 并再次按下 Tab\
  \ 键。方法名被补全为 `log`，你得到了一个更短的列表：\n\n```\njshell> Math.log\nlog(     log10(   log1p(\
  \ \n```\n\n现在你可以手动填写剩余部分：\n\n```\njshell> Math.log10(0.001)\n$4 ==> -3.0\n```\n\n\
  要重复某个命令，按下 ↑ 键直到看到你想重新发送或编辑的行。你可以使用 ← 和 → 键在行内移动光标，并添加或删除字符。完成后按下 Enter 键。例如，按下\
  \ ↑ 键并将 `0.001` 为 `1000`，然后按下 Enter：\n\n```\njshell> Math.log10(1000)\n$5 ==> 3.0\n\
  ```\n\n你可以使用命令退出 JShell\n\n```\n/exit\n```\n\nJShell 让学习 Java 语言和库变得简单有趣，无需启动沉重的开发环境，也无需纠结程序和\
  \ `main` 方法。\n\n# Java 基础编程结构\n\n此时，你应该已经安装了 JDK 并运行了第 2 章中的示例。现在是开始编程了。本章将向你展示如何在\
  \ Java 中实现数据类型、分支和循环等基础编程概念。\n\n## 程序\n\n让我们仔细观察一个简单的 Java 程序——它只是向控制台打印一条消息\n\n\
  ```\npublic class FirstSample\n{\n   public static void main(String[] args)\n  \
  \ {\n      System.out.println(\"We will not use 'Hello, World!'\");\n   }\n}\n```\n\
  \n花时间熟悉这个示例的框架是值得的；首先，*Java 是对大小写敏感的*。如果你在大小写上犯了任何错误（例如将 `main` 写成 `Main`），程序将无法运行。\n\
  \n现在让我们逐行查看这段源码。`public` 关键字称为访问修饰符；这些修饰符控制程序其他部分对该代码的访问权限。有关访问修饰符的更多信息，请参阅第 4 章。\n\
  \n\n\n你需要将源代码的文件名与公共类的名称相同，并加上后缀 `.java`。因此，你必须将此代码存储在名为 `FirstSample.java` 的文件中。（再次强调，大小写非常重要——不要使用\
  \ `firstsample.java`。）\n\n你使用以下命令编译文件：\n\n```bash\njavac FirstSample.java\n```\n\
  \n如果你命名正确且在源代码中没有任何拼写错误，你将得到一个包含该类字节码的文件。Java 编译器会将字节码文件命名为 `FirstSample.class`\
  \ 并将其存储在与源文件相同的目录下。最后，通过以下命令启动程序：\n\n```\njava FirstSample\n```\n\n（记住省略 `.class`\
  \ 扩展名。）当程序执行时，它简单地在控制台上显示字符串 ``We will not use 'Hello, World!'` 。\n\n当你使用\n\n```\n\
  java ClassName\n```\n\n来运行编译后的程序时，Java 虚拟机总是会从你指定的类中 `main` 方法的代码开始执行。（“method”一词是\
  \ Java 语言中对“函数”的说法。）因此，你必须在类的源码中有一个 `main` 方法，你的代码才能执行。当然，你可以向类中添加自己的方法并在 `main`\
  \ 方法中调用它们。（你将在下一章看到如何编写自己的方法。）\n\n根据 Java 语言规范，`main` 方法必须声明为 `public`。（Java 语言规范是描述\
  \ Java 语言的官方文档。你可以从 [`docs.oracle.com/javase/specs`](https://docs.oracle.com/javase/specs)\
  \ 查看或下载它。）\n\n然而，多个版本的 Java 启动器即使在 `main` 方法不是 `public` 的情况下也能执行 Java 程序。一位程序员提交了一个\
  \ bug 报告。要查看它，请访问 [`bugs.openjdk.org/browse/JDK-4252539`](https://bugs.openjdk.org/browse/JDK-4252539)。在\
  \ 1999 年，该 bug 被标记为“已关闭，不修复”。一位 Sun 工程师增加了解释，说明 Java 虚拟机规范并没有规定 `main` 必须是 `public`，并且“修复它将导致潜在的问题”。幸运的是，理智胜过了。Java\
  \ 1.4 及更高版本的 Java 启动器强制要求 `main` 方法必须是 `public`。\n\n当然，让质量保证工程师（他们通常工作过度，且并不总是 Java\
  \ 细微之处的专家）对 bug 报告做出令人怀疑的决定是令人沮丧的。但值得注意的是，在 Java 开源很久以前，bug 报告及其解决方案就可以供任何人审查了，这非常了不起。\n\
  \n请注意源码中的大括号 `{ }`。在 Java 中，就像在 C/C++ 中一样，大括号划分了程序中的部分（通常称为块）。在 Java 中，任何方法的代码都必须以左大括号\
  \ `{` 开始并以右大括号 `}` 结束。\n\n大括号的样式引发了大量的无用争议。本书遵循一种使匹配的大括号对齐的样式。由于空格对 Java 编译器无关，你可以使用任何你喜欢的大括号样式。\n\
  \n目前，不要担心 `static void` 关键字——只需把它们看作是让 Java 程序编译所需要的内容的一部分。到第 4 章结束时，你将完全理解这句咒语。现在记住的一点是，每个\
  \ Java 应用程序都必须有一个以下方式声明的 `main` 方法：\n\n```java\npublic class ClassName\n{\n   public\
  \ static void main(String[] args)\n   {\n      program statements\n   }\n}\n```\n\
  \n`public static void main` 复杂的复杂性即将被更简单的东西取代。Java 21 有一个预览功能，在 Java 增强提案 (JEP)\
  \ 445 中描述，它允许你这样写 `main` 方法：\n\n```java\nclass FirstSample\n{\n   void main()\n\
  \   {\n      System.out.println(\"We will not use 'Hello, World!'\");\n   }\n}\n\
  ```\n\n这样好多了。没有 `public`，没有 `static`，没有 `String[] args`。\n\n目前，你需要使用命令行标志编译并运行程序：\n\
  \n```bash\njavac --enable-preview --source 21 FirstSample.java\njava --enable-preview\
  \ FirstSample\n```\n\n更简单，因为只有一个源文件，你可以跳过 `javac` 步骤：\n\n```bash\njava --enable-preview\
  \ --source 21 FirstSample.java\n```\n\n在书中，我们拥抱类和面向对象的编程。但对于非常简单的程序，JEP 445 允许你省略类，当然，前提是只有一个类。`FirstSample.java`\
  \ 文件可以简单包含：\n\n```java\nvoid main()\n{\n   System.out.println(\"We will not use\
  \ 'Hello, World!'\");\n}\n```\n\n由于这些功能仍处于预览阶段，我不会在这个版本中使用它们，但在未来，第一个示例程序将变得简单。\n\
  \n作为一名 C++ 程序员，你知道什么是类。Java 类与 C++ 类相似，但有几个可能会让你掉进陷阱的区别。例如，在 Java 中，所有函数都是某些类的方法。（标准术语将它们称为方法，而不是成员函数。）因此，在\
  \ Java 中，你必须为 `main` 方法准备一个壳类。你可能也熟悉 C++ 中静态成员函数的概念。这些是定义在类内部且不操作对象的成员函数。Java 中的\
  \ `main` 方法始终是静态的（static）。最后，与 C/C++ 一样，`void` 关键字表示此方法不返回值。与 C/C++ 不同，`main` 方法不会向操作系统返回“退出码”。如果\
  \ `main` 方法正常退出，Java 程序的退出码为 `0`，表示成功完成。要使用不同的退出码终止程序，请使用 `System.exit` 方法。\n\n\
  现在你已经看到了所有 Java 程序的基本结构，请将注意力转向 `main` 方法的内容：\n\n```java\n{\n   System.out.println(\"\
  We will not use 'Hello, World!'\");\n}\n```\n\n大括号标记了方法体的开始和结束。此方法内部只有一个语句。与大多数编程语言一样，你可以将\
  \ Java 语句想象成语言的句子。在 Java 中，每个语句必须以分号结束。特别是，换行符并不标记语句的结束，因此语句根据需要可以跨行。\n\n`main`\
  \ 方法的主体包含一个向控制台输出单行文本的语句。\n\n在这里，我们正在使用 `System.out` 对象并调用它的 `println` 方法。注意用于调用方法的点。Java\
  \ 使用通用语法\n\n```\nobject.method(arguments)\n```\n\n在这种情况下，`println` 方法接收一个字符串参数。该方法将字符串参数显示在控制台上。然后它终止输出行，因此每次调用\
  \ `println` 都会在新行显示其输出。注意 Java 与 C/C++ 一样使用双引号来界定字符串。（你可以在本章后面的部分找到更多关于字符串的信息。）\n\
  \nJava 方法与任何编程语言中的函数一样，可以使用零、一个或多个参数。即使方法没有参数，你也必须使用空括号。例如，不带参数的 `println` 方法变体只打印空行。你通过以下调用它：\n\
  \n```\nSystem.out.println();\n```\n\n`System.out` 还有一个 `print` 方法，它不在输出中添加换行符。例如，`System.out.print(\"\
  Hello\")` 打印 `Hello` 而不换行。下一个输出紧跟在字母 `o` 之后。\n\n## 注释\n\n与大多数编程语言一样，Java 中的注释不会出现在执行程序中。因此，你可以根据需要添加注释而不必增加代码。Java\
  \ 有三种标记注释的方法。最常见的形式是 `//`。使用它来编写从 `//` 到行尾的注释。\n\n```java\nSystem.out.println(\"\
  We will not use 'Hello, World!'\"); // 这太可爱了吗？\n```\n\n当需要较长的注释时，你可以每行都标记 `//`，或者可以使用\
  \ `/*` 和 `*/` 注释定界符来划分一段较长的注释。\n\n\n\n最后，第三种注释被用于自动生成文档。这种注释用 `/**` 开始，用 `*/` 结束。你可以在列表\
  \ 3.1 中看到这种类型的注释。更多关于这种注释以及自动生成文档的知识，请参阅第 4 章。\n\n`FirstSample/FirstSample.java`\n\
  \n```java\n/**\n * This is the first sample program in Core Java Chapter 3\n * @version\
  \ 1.01 1997-03-22\n * @author Gary Cornell\n */\npublic class FirstSample\n{\n \
  \  public static void main(String[] args)\n   {\n      System.out.println(\"We will\
  \ not use 'Hello, World!'\");\n   }\n}\n```\n\n`/* */` 注释在 Java 中是不嵌套的。这意味着，你可能无法通过将代码包裹在\
  \ `/*` 和 `*/` 之间来禁用代码，因为你想要禁用的代码本身可能包含 `*/` 分隔符。\n\n## 数据类型\n\nJava 是一种`强类型语言`。这意味着每个变量都必须有一个定义的类型。Java\
  \ 中有八种`基本类型`。其中四种是整数类型；两种是浮点数类型；一种是字符类型 `char`，用于 Unicode 编码方案中的 UTF-16 代码单元（参见第\
  \ 3.3.3 节）；一种是用于布尔值的 `boolean` 类型。\n\nJava 有一个任意精度算术包。然而，所谓的“大数”是 Java `对象`，而不是\
  \ Java 的基本类型。你将在本章的后面的部分看到如何使用它们。\n\n### 整数类型\n\n整数类型用于没有小数部分的数字。允许负值。Java 提供了表\
  \ 3.1 所示的四种整数类型。\n\nJava 整数类型\n\n| 类型 | 存储需求 | 范围（包含边界） |\n\n| --- | --- | --- |\n\
  | `byte` | 1 字节 | –128 到 127 |\n| `short` | 2 字节 | –32,768 到 32,767 |\n| `int` |\
  \ 4 字节 | –2,147,483,648 到 2,147,483,647（略超过 20 亿） |\n| `long` | 8 字节 | –9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 |\n\n在大多数情况下，`int` 类型是最实用的。如果你想表示地球的人口，你将需要求助于 `long`。`byte`\
  \ 和 `short` 类型主要用于特殊应用程序，例如低级文件处理，或者在存储空间紧张时用于大型数组。\n\n在 Java 中，整数类型的范围不依赖于运行 Java\
  \ 代码的机器。这减轻了想要将软件从一个平台移动另一个平台（甚至在同一平台的不同操作系统之间）的程序员的主要苦恼。相比之下，C 和 C++ 程序为每个处理器使用最高效的整数类型。因此，在\
  \ 32 位处理器上运行良好的 C 程序在 16 位系统上可能会出现整数溢出。由于 Java 程序必须在所有机器上具有相同的结果，因此各种类型的范围是固定的。\n\
  \n长整数带有后缀 `L` 或 `l`（例如，`4000000000L`）。十六进制带有前缀 `0x` 或 `0X`（例如，`0xCAFE`）。八进制带有前缀\
  \ `0`（例如，`010` 是 8）——自然地，这可能会引起混惑，很少有程序员使用八进制常量。\n\n你可以二进制写入数字，带有前缀 `0b` 或 `0B`。例如，`0b1001`\
  \ 是 9。你向数字字面量添加下划线，例如 `1_000_000`（或 `0b1111_0100_0110_0100_0000`）来表示百万。下划线仅供人类视觉识别。Java\
  \ 编译器会简单地移除它们。\n\n在 C 和 C++ 中，`int` 和 `long` 等类型的大小取决于目标平台。在像 8086 这样的 16 位处理器上，整数是\
  \ 2 字节，但在 Pentium 或 SPARC 等 32 位处理器上，它们是 4 字节的量。同样，`long` 值在 32 位处理器上是 4 字节，在 64\
  \ 位处理器上是 8 字节。这些差异使得编写跨平台程序具有挑战性。在 Java 中，所有数值类型的大小都与平台无关。\n\n注意 Java 没有 `int`、`long`、`short`\
  \ 或 `byte` 类型的任何无符号版本。\n\n如果你处理永远不会为负数的整数值，并且你确实需要额外的位，你可以在小心的情况下将符号整数值解释为无符号。例如，与其让\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。由于二进制的性质，你可以将符号整数值解释为无符号。例如，与其让一个\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。由于二进制的性质，你可以将符号整数值解释为无符号。例如，与其让一个\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。由于二进制的性质，你可以将符号整数值解释为无符号。例如，与其让一个\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。由于二进制的性质，你可以将符号整数值解释为无符号。例如，与其让一个\
  \ `byte` 值 `b` 表示从 –128 到 127 的范围，你可能想要 0 到 255 的范围。你可以将其存储在 `byte` 中。由于二进制的性质，你可以将符号整数值解释为无符号。\n\
