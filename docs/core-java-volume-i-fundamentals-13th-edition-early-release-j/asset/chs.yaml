  \ 5.0\n\n- `T invokeAny(Collection<Callable<T>> tasks)`\n- `T invokeAny(Collection<Callable<T>>\
  \ tasks, long timeout, TimeUnit unit)`\n\n  执行给定的任务并返回一个成功完成的任务的结果，取消剩余的任务。第二个方法在发生超时时抛出\
  \ `TimeoutException`。\n\n- `List<Future<T>> invokeAll(Collection<Callable<T>> tasks)`\n\
  - `List<Future<T>> invokeAll(Collection<Callable<T>> tasks, long timeout, TimeUnit\
  \ unit)`\n\n  执行给定的任务并在所有任务完成后完成后返回结果。第二个方法在发生超时时抛出 `TimeoutException`。\n\n`java.util.concurrent.ExecutorCompletionService<V>`\
  \ 5.0\n\n- `ExecutorCompletionService(Executor e)`\n\n  构造一个执行器完成服务，收集给定执行器的结果。\n\
  - `Future<V> submit(Callable<V> task)`\n- `Future<V> submit(Runnable task, V result)`\n\
  \n  将任务提交给底层的执行器。\n\n- `Future<V> take()`\n\n  移除并返回下一个完成的任务，如果没有完成的任务则阻塞。\n- `Future<V>\
  \ poll()`\n- `Future<V> poll(long time, TimeUnit unit)`\n\n  返回下一个完成的任务，如果没有完成的任务则返回\
  \ `null`。第二个方法等待指定的时间。\n\n### Thread 本地变量\n\n有时你希望让某个任务对象对所有方法可用，而无需将其作为参数传递。你可以使用线程本地变量来实现。例如，你想共享数据库连接。声明一个变量\n\
  \n```java\npublic static final ThreadLocal<Connection> CONNECTION = new ThreadLocal<>();\n\
  ```\n\n当任务开始时，为该线程初始化：\n\n```java\nCONNECTION.set(connect(uri, username, password));\n\
  ```\n\n任务调用某些方法，都在同一个线程内，其中一个方法需要连接：\n\n```java\nConnection connection = CONNECTION.get();\n\
  var result = connection.executeQuery(query);\n```\n\n注意相同的调用可能会在多个线程上发生。它们都有自己的连接。\n\
  \n当使用线程池执行任务时，你不希望线程本地数据对调度在同一线程上的其他任务可用。你还希望在任务结束时将其清理。必须调用\n\n```java\nCONNECTION.remove();\n\
  ```\n\n`InheritableThreadLocal` 是 `ThreadLocal` 的子类，用于将线程本地数据传播到子任务。当创建新线程时，它接收父线程的可继承线程本地变量的副本。（拷贝是必要的，因为子线程可能会修改线程本地值。）\n\
  \n迁移到虚拟线程时，将资源密集型对象作为线程本地变量可能会出现问题。它们的数量将比线程池中的线程得多，现在你有了更多实例。在这种情况下，你应该重新考虑你的共享策略。\n\
  \n要标识线程本地变量的使用，请运行虚拟机标志 `jdk.traceVirtualThreadLocals`。当虚拟线程修改线程本地变量时，你会得到堆栈跟踪。\n\
  \nScoped values 是 Java 21 的预览功能，提供了比可继承线程本地变量性能更好的版本。Scoped values 有每线程实例，但它们是不可变的且有界的生命周期。Scoped\
  \ values 在由 `StructuredTaskScope` 创建的虚拟线程中继承。此代码段展示了如何使用它们：\n\n\n\n\n\n```java\n\
  public static final ScopedValue<Connection> CONNECTION = ScopedValue.newInstance();\
  \ \n. . .\nScopedValue.where(CONNECTION, connect(uri, username, password)).run(()\
  \ -> doWork());\n. . .\npublic void doWork() {\n   . . .\n   Connection connection\
  \ = CONNECTION.get();\n   var result = connection.executeQuery(query);\n   . . .\n\
  }\n```\n\n使用虚拟线程时，优先使用作用域值（scoped values）而不是线程局部变量。\n\n`java.lang.ThreadLocal<T>`\
  \ 1.2\n\n- `T get()`\n\n  获取此线程当前的值。如果是第一次调用 `get` 且从未调用过 `set`，则通过调用 `initialize`\
  \ 获取值。\n\n- `void set(T t)`\n\n  为该线程设置一个新值。\n\n- `void remove()`\n\n  移除该线程的值。\n\
  \n## Fork-Join 框架\n\n某些应用程序使用大量大部分空闲的线程。例如，每个连接使用一个线程的 Web 服务器。其他应用程序则每个处理器核心使用一个线程，以执行计算密集型任务，如图像或视频处理。Fork-join\
  \ 框架的设计目的就是支持后者。假设你有一个自然分解为子任务的处理任务，如下所示：\n\n```\nif (problemSize < threshold)\n\
  {\n   直接解决问题\n}\nelse \n{\n   将问题分解为子问题\n   递归地解决每个子问题\n   合并结果\n}\n```\n\n一个例子是图像处理。为了增强图像，你可以转换上半部分和下半部分。如果你有足够的空闲处理器，这些操作就可以并行运行。（你可能需要在分隔两个部分的条带上做一些额外工作，但那是技术细节。）\n\
  \n在这里，我们讨论一个更简单的例子。假设我们想统计数组中有多少元素符合特定属性。我们将数组一分为二，计算每个部分的计数，并将它们相加。\n\n为了将递归计算转换为框架可使用的格式，请提供一个扩展\
  \ `RecursiveTask<T>`（如果计算产生类型为 `T` 的结果）或 `RecursiveAction`（如果没有结果）的类。重写 `compute`\
  \ 方法来生成并调用子任务，并合并它们的结果。\n\n```java\nclass Counter extends RecursiveTask<Integer>\n\
  {\n   . . .\n   protected Integer compute()\n   {\n      if (to - from < THRESHOLD)\n\
  \      {\n         直接解决问题\n      }\n      else\n      {\n         int mid = from\
  \ + (to - from) / 2;\n         var first = new Counter(values, from, mid, filter);\n\
  \         var second = new Counter(values, mid, to, filter);\n         invokeAll(first,\
  \ second);\n         return first.join() + second.join();\n      }\n   }\n}\n```\n\
  \n`invokeAll` 方法接收若干任务并阻塞直到所有任务都完成。`join` 方法产生结果。在这里，我们对每个子任务应用 `join` 并返回总和。\n\n\
  还有一个用于获取当前结果的 `get` 方法，但它不太吸引人，因为它可能会抛出检查异常，而我们在 `compute` 方法中不允许抛出这些异常。\n\nListing\
  \ 10.4 显示了完整的示例。\n\n在后台，fork-join 框架使用了一种名为*工作窃取*（work stealing）的有效启发式策略，在可用线程之间平衡负载。每个工作线程都有一个双端队列（deque）来存放任务。工作线程将其较小的子任务推到自己队列的头部。（只有一个线程访问头部，因此不需要锁定）。当一个工作线程空空闲时，它会从另一个队列的尾部“窃取”一个任务（这需要锁定）。通过窃取位于尾部的较大的子任务，下一次“窃取”发生前会有更长的时间，从而减少尾部的竞争。\n\
  \nFork-join 池针对非阻塞工作负载进行了优化。如果你向 fork-join 池中添加许多阻塞任务，可能会导致其饥饿。可以通过任务实现 `ForkJoinPool.ManagedBlocker`\
  \ 接口来克服这一点，但这是一种我们不会讨论的高级技术。\n\n`forkJoin/ForkJoinTest.java`\n\n```java\npackage\
  \ forkJoin;\n\nimport java.util.concurrent.*;\nimport java.util.function.*;\n\n\
  /**\n * 此程序演示了 fork-join 框架。\n * @version 1.02 2021-06-17\n * @author Cay Horstmann\n\
  \ */\npublic class ForkJoinTest\n{\n   public static void main(String[] args)\n\
  \   {\n      final int SIZE = 10000000;\n      var numbers = new double[SIZE];\n\
  \      for (int i = 0; i < SIZE; i++) numbers[i] = Math.random();\n      var counter\
  \ = new Counter(numbers, 0, numbers.length, x -> x > 0.5);\n      var pool = new\
  \ ForkJoinPool();\n      pool.invoke(counter);\n      System.out.println(counter.join());\n\
  \   }\n}\n\nclass Counter extends RecursiveTask<Integer>\n{\n   public static final\
  \ int THRESHOLD = 1000;\n   private double[] values;\n   private int from;\n   private\
  \ int to;\n   private DoublePredicate filter;\n\n   public Counter(double[] values,\
  \ int from, int to, DoublePredicate filter)\n   {\n      this.values = values;\n\
  \      this.from = from;\n      this.to = to;\n      this.filter = filter;\n   }\n\
  \n   protected Integer compute()\n   {\n      if (to - from < THRESHOLD)\n     \
  \ {\n         直接解决问题;\n      }\n      else\n      {\n         int mid = from + (to\
  \ - from) / 2;\n         var first = new Counter(values, from, mid, filter);\n \
  \        var second = new Counter(values, mid, to, filter);\n         invokeAll(first,\
  \ second);\n         return first.join() + second.join();\n      }\n   }\n}\n```\n\
  \n## 同步\n\n在大多数实际的多线程应用程序中，两个或多个线程需要共享对数据的访问。如果线程访问同一个对象，并且每个线程都调用修改状态的方法，会发生什么？正如你所想象的，线程可能会相互干扰。取决于数据访问的顺序，可能会导致对象损坏。这种情况通常被称为*竞态条件*（race\
  \ condition）。\n\n### 竞态条件示例\n\n为了避免多个线程对共享数据造成损坏，你必须学习如何*同步访问*。在本节中，你将看到如果不使用同步会发生什么。在下一节中，你将看到如何同步数据。\n\
  \n在接的测试程序中，我们继续使用模拟银行。与 10.1 节中的示例不同，我们随机选择转账的源和目的地。由于这会导致问题，让我们仔细查看 `Bank` 类中 `transfer`\
  \ 方法的代码。\n\n```\npublic void transfer(int from, int to, double amount)\n   // 警告：从多线程调用时是不安全的\n\
  {\n   System.out.print(Thread.currentThread());\n   accounts[from] -= amount;\n\
  \   System.out.printf(\" %10.2f from %d to %d\", amount, from, to);\n   accounts[to]\
  \ += amount;\n   System.out.printf(\" Total Balance: %10.2f%n\", getTotalBalance());\n\
  }\n```\n\n这里 `Runnable` 实例的代码。`run` 方法不断从给定的银行账户移动资金。在每次迭代中，`run` 方法随机选择目标账户和金额，调用银行对象的\
  \ `transfer` 方法，然后睡眠。\n\n```java\nRunnable r = () ->\n   {\n      try\n      {\n\
  \         while (true)\n         {\n            int toAccount = (int) (bank.size()\
  \ * Math.random());\n            double amount = MAX_AMOUNT * Math.random();\n \
  \           bank.transfer(fromAccount, toAccount, amount);\n            Thread.sleep((int)\
  \ (DELAY * Math.random()));\n         }\n      }\n      catch (InterruptedException\
  \ e)\n      {\n      }            \n   };\n```\n\n当此模拟运行时，我们不知道在任何时刻某个银行账户中有多少钱。但我们知道所有账户的资金总量应该保持不变，因为我们只是将资金从一个账户移动到另一个账户。\n\
  \n在每次交易结束时，`transfer` 方法会重新计算总和并打印。\n\n此程序永远不会结束。只需按 Ctrl+C 杀死程序即可。\n\n\n\n\n这是一份典型的输出：\n\
  \n```\n. . .\nThread[Thread-11,5,main]     588.48 from 11 to 44 Total Balance: \
  \ 100000.00\nThread[Thread-12,5,main]     976.11 from 12 to 22 Total Balance:  100000.00\n\
  Thread[Thread-14,5,main]     521.51 from 14 to 22 Total Balance:  100000.00\nThread[Thread-13,5,main]\
  \     359.89 from 13 to 81 Total Balance:  100000.00\n. . .\nThread[Thread-36,5,main]\
  \     401.71 from 36 to 73 Total Balance:   99291.06\nThread[Thread-35,5,main] \
  \    691.46 from 35 to 77 Total Balance:   99291.06\nThread[Thread-37,5,main]  \
  \    78.64 from 37 to 3 Total Balance:   99291.06\nThread[Thread-34,5,main]    \
  \ 197.11 from 34 to 69 Total Balance:   99291.06\nThread[Thread-36,5,main]     \
  \ 85.96 from 36 to 4 Total Balance:   99291.06\n. . .\nThread[Thread-4,5,main]Thread[Thread-33,5,main]\
  \       7.31 from 31 to 32 Total Balance:\n99979.24\n     627.50 from 4 to 5 Total\
  \ Balance:  99979.24\n. . .\n```\n\n如你所见，有些非常不对。对于某些交易，银行余额保持在 $100,000，这是 100 个每个\
  \ $1,000 元账户的正确总额。但过了一段时间，余额发生了轻微变化。当你运行这个程序时，错误可能会很快发生，或者余额需要很长时间才会变得损坏。这种情况并不让人产生信心，你可能不想把你辛苦赚的钱存入这样的银行。\n\
  \n看看你是否能找出代码列表 10.5 中的代码以及代码列表 10.2 中 `Bank` 类中的问题。我们将在下一节解开这个谜。\n\nunsynch/UnsynchBankTest.java\n\
  \n```\npackage unsynch;\n\n/**\n * 此程序展示了多个线程访问数据结构时产生的数据损坏。\n * @version 1.33 2023-07-30\n\
  \ * @author Cay Horstmann\n */\npublic class UnsynchBankTest\n{\n   public static\
  \ final int NACCOUNTS = 100;\n   public static final double INITIAL_BALANCE = 1000;\n\
  \   public static final double MAX_AMOUNT = 1000;\n   public static final int DELAY\
  \ = 10;\n\n   public static void main(String[] args)\n   {\n      var bank = new\
  \ Bank(NACCOUNTS, INITIAL_BALANCE);\n      for (int i = 0; i < NACCOUNTS; i++)\n\
  \      {\n         int fromAccount = i;\n         Runnable r = () -> \n        \
  \    {\n               try\n               {\n                  while (true)\n \
  \                 {\n                     int toAccount = (int) (bank.size() * Math.random());\n\
  \                     double amount = MAX_AMOUNT * Math.random();\n            \
  \         bank.transfer(fromAccount, toAccount, amount);\n                     Thread.sleep((int)\
  \ (DELAY * Math.random()));\n                  }\n               }\n           \
  \    catch (InterruptedException e)\n               {\n               }        \
  \    \n            };\n         Thread.ofPlatform().start(r);\n      }\n   }\n}\n\
  ```\n\n### 竞态条件详解\n\n在上一节中，我们运行了一个由多个线程更新银行账户余额的程序。一段时间后，错误出现了，某些资金丢失或凭空产生。当两个线程同时尝试更新一个账户时，就会发生这个问题。假设两个线程同时执行以下指令：\n\
  \n```\naccounts[to] += amount;\n```\n\n问题在于这些不是*原子*操作。该指令可能会按如下方式处理：\n\n1. 将 `accounts[to]`\
  \ 加载到寄存器。\n2. 加上 `amount`。\n3. 将结果移回 `accounts[to]`。\n\n现在，假设第一个线程执行了步骤 1 和 2，然后被抢占。假设第二个线程醒并更新了\
  \ `account` 数组中的同一条目。然后，第一个线程醒并完成了它的步骤 3。\n\n该操作消除了另一个线程的修改。结果是总数不再正确（参见图 10.2）。\n\
  \n![Figure](img/14_04.jpg)两个线程的同时访问\n\n`UnsyncBankTest` 程序演示了这种损坏。（在计算 `getTotalBalance`\
  \ 期间，也有极小的概率出现误报。）\n\n你实际上可以查看执行我们类中每条语句的虚拟机字节码。运行命令 `javap -c` 来反编译该类。例如，`accounts[to]\
  \ += amount;` 这一行被翻译为以下字节码：\n\n```\naload_0\ngetfield        #2;\niload\n2\nadd\n\
  dastore        3\n```\n\n这些代码意味着什么？重点是如果你在多核心上运行大量线程，损坏概率很高。\n\n### 锁对象\n\n有两种机制可以保护代码块免受并发访问。Java\
  \ 语言提供了 `synchronized` 用于此目的，`java.util.concurrent` 包提供了显式的锁类。`synchronized` 关键字在许多情况下非常强大且方便。然而，我认为在看到锁和条件之后理解\
  \ `synchronized` 关键字会更容易。\n\n使用 `ReentrantLock` 保护代码块的基本结构如下：\n\n```\nmyLock.lock();\
  \ // ReentrantLock\ntry\n{\n   关键区域\n}\nfinally\n{\n   myLock.unlock(); // 即使发生异常也能解锁\n\
  }\n```\n\n这种结构保证了一次只有一个线程进入关键区域。一旦一个线程锁定了锁，其他线程就无法通过 `lock` 语句。其他线程调用 `lock` 时，会被阻塞直到第一个线程解锁。\n\
  \n将 `unlock` 操作封装在 `finally` 子句中极其重要。如果关键区域的代码抛出异常，必须解锁。否则，其他线程将永久阻塞。\n\n使用锁时，无法使用\
  \ `try`-with-resources 语句。`unlock` 方法不是 `close`。一些程序员建议让 `Lock` 实现 `AutoCloseable`，让\
  \ `close` 调用 `lock`。但 Java 设计者认为锁的使用相当常见，值得被注意。\n\n让我们使用锁来保护 `Bank` 类的 `transfer`\
  \ 方法。\n\n```java\npublic class Bank\n{\n   private final Lock bankLock = new ReentrantLock();\
  \ \n   . . .\n   public void transfer(int from, int to, int amount)\n   {\n    \
  \  bankLock.lock(); \n      try\n      {\n         System.out.print(Thread.currentThread());\n\
  \         accounts[from] -= amount;\n         System.out.printf(\" %10.2f from %d\
  \ to %d\", amount, from, to);\n         accounts[to] += amount;\n         System.out.printf(\"\
  \ Total Balance: %10.2f%n\", getTotalBalance());\n      }\n      finally\n     \
  \ {\n         bankLock.unlock();\n      }\n   }\n}\n```\n\n\n\n假设一个线程调用了 `transfer`\
  \ 但在完成之前被抢占。假设第二个线程也调用了 `transfer`。第二个线程无法获取锁，并在调用 `lock` 方法时被阻塞。它被去激活，必须等待第一个线程执行完\
  \ `transfer` 方法。当第一个线程释放锁时，第二个线程就可以继续执行（参见图 10.3）。\n\n![Figure](img/14_05.jpg)未同步线程与同步线程的比较\n\
  \n尝试一下。在 `transfer` 方法中添加锁定代码并再次运行程序。你可以一直运行它，银行余额不会损坏。\n\n请注意，每个 `Bank` 对象都有它们自己的\
  \ `ReentrantLock` 对象。如果两个线程尝试访问同一个 `Bank` 对象，那么锁将起到序列访问的作用。然而，如果两个线程访问不同的 `Bank`\
  \ 对象，每个线程将获取不同的锁，且两个线程都不会被阻塞。这是符合预期的，因为当线程在操作不同的 `Bank` 实例时，它们不会互相干扰。\n\n该锁被称为 `reentrant`（重入的），是因为线程可以重复获取它已经拥有的锁。锁有一个\
  \ `hold count`（持有计数），用于跟踪对 `lock` 方法的嵌套调用。线程必须对每次 `lock` 调用调用一次 `unlock`，以释放锁。由于这一特性，受锁保护的代码可以调用另一个使用相同锁的方法。\n\
  \n例如，`transfer` 方法调用了 `getTotalBalance` 方法，而该方法也会锁住 `bankLock` 对象，此时该对象的持有计数为 `2`。当\
  \ `getTotalBalance` 方法退出时，持有计数回到 `1`。当 `transfer` 方法退出时，持有计数变为 `0`，线程释放锁。\n\n通常情况下，你可能希望在任何更新或检查共享对象的代码块周围使用锁，这样你就可以确保这些操作在另一个线程使用相同对象之前执行完毕。\n\
  \n务必确保临界区域中的代码不会因抛出异常而被跳过。如果在区域结束前抛出异常，`finally` 句将释放锁，但对象可能处于受损状态。\n\n### `java.util.concurrent.locks.Lock`\
  \ 5.0\n\n*   `void lock()`\n    获取此锁；如果锁当前由另一个线程持有，则阻塞。\n*   `void unlock()`\n \
  \   释放此锁。\n\n### `java.util.concurrent.locks.ReentrantLock` 5.0\n\n*   `ReentrantLock()`\n\
  \    构造一个用于保护临界区域的重入锁。\n*   `ReentrantLock(boolean fair)`\n    根据给定的公平性策略构造锁。公平锁会倾向于等待时间最长的线程。然而，这种公平性保证可能会严重拖慢性能。因此，默认情况下，锁并不要求是公平的。\n\
  \n公平听起来很不错，但公平锁可能比普通锁`慢得多`。只有当你真正知道自己在做什么，并且有特定的理由认为公平性对你的程序至关重要时，才应该启用公平锁。即使你使用公平锁，你也无法保证线程调度器是公平的。如果线程调度器选择忽略一个等待锁已久的线程，那么它就没有机会被锁公平地对待。\n\
  \n### Condition 对象（条件对象）\n\n通常，一个线程进入临界区域后，发现自己在某个条件满足之前无法继续执行。使用 `condition object`（条件对象）来管理已获取锁但无法进行有用工作的线程。在本节中，我将介绍\
  \ Java 库中条件对象的实现。（出于历史原因，条件对象通常被称为 `condition variables`（条件变量）。）\n\n让我们完善对银行的模拟。我们不希望从没有资金覆盖转账的账户转出资金。注意，我们不能使用类似下面的代码：\n\
  \n```java\nif (bank.getBalance(from) >= amount)\n   bank.transfer(from, to, amount);\n\
  ```\n\n当前线程在测试成功和调用 `transfer` 之间完全可能被去激活。\n\n```java\nif (bank.getBalance(from)\
  \ >= amount)\n      // 线程在此处被去激活\n   bank.transfer(from, to, amount);\n```\n\n当线程再次运行时，账户余额可能已经低于取款金额。你必须确保在测试和转账动作之间没有其他线程可以修改余额。你通过锁同时保护测试和转账动作来实现这一点：\n\
  \n```java\npublic void transfer(int from, int to, int amount)\n{\n   bankLock.lock();\n\
  \   try\n   {\n      while (accounts[from] < amount)\n      {\n         // 等待\n\
  \         . . .\n      }\n      // 转账资金\n      . . .\n   }\n   finally\n   {\n \
  \     bankLock.unlock();\n   }\n}\n```\n\n现在，当账户中钱不足时我们该怎么办？我们等待其他线程添加资金。但此线程刚刚获得了\
  \ `bankLock` 的独占访问权限，因此没有其他线程有机会存款。这就是条件对象大显用场的地方。\n\n锁对象可以有一个或多个关联的条件对象。你通过 `newCondition`\
  \ 方法获取条件对象。习惯上为每个条件对象起一个能引起其所代表条件的名称。例如，在这里设置一个条件对象来表示“资金充足”条件。\n\n```java\nclass\
  \ Bank\n{\n   . . .\n   private final Condition sufficientFunds = bankLock.newCondition();\n\
  \   . . .\n}\n```\n\n如果 `transfer` 方法发现资金不足，它会调用\n\n```java\nsufficientFunds.await();\n\
  ```\n\n当前线程现在被去激活并放弃锁。这让另一个线程进入，并可能增加账户余额。\n\n等待获取锁的线程与调用了 `await` 的线程之间存在本质区别。一旦线程调用\
  \ `await` 方法，它就会进入该条件的 `wait set`（等待集）。当锁可用时，该线程并`不是`变为可运行状态。相反，它一直保持去激活状态，直到另一个线程在该条件上调用了\
  \ `signalAll` 方法。\n\n当另一个线程转了账后，它应该调用\n\n```java\nsufficientFunds.signalAll();\n\
  ```\n\n此调用会重新激活所有等待该条件的线程。当线程从等待集中移除时，它们再次变为可运行状态，调度器最终会再次激活它们。到那时，它们将尝试重新进入对象。一旦锁可用，其中一个线程将获取锁`并从中断的地方继续执行`，从\
  \ `await` 调用中返回。\n\n此时，线程应该再次测试条件。并没有保证该条件现在已经满足——`signalAll` 方法仅仅是通知等待的线程条件在此时`可能`已经满足，并且值得再次检查条件。\n\
  \n通常，对 `await` 的调用应该位于如下形式循环内部：\n\n```java\nwhile (!(OK to proceed))\n   condition.await();\n\
  ```\n\n至关重要的是，最终`某些`其他线程调用 `signalAll` 方法。当线程调用 `await` 时，它没有办法重新激活自己。它寄希望于其他线程。如果它们中没有一个去重新激活等待的线程，该线程将永远不再运行。这可能导致令人讨厌的`死锁`局面。如果所有其他线程都被阻塞，且最后一个活跃的线程在调用\
  \ `await` 时没有解除其他任何一个线程的阻塞，它也会阻塞。没有线程可以解除其他线程，程序就会挂起。\n\n何时应该调用 `signalAll`？经验法则是，每当对象的状态发生可能对等待线程有利的变化时，就调用\
  \ `signalAll`。例如，每当账户余额发生变化时，等待线程应该获得再次检查余额的机会。在我们的示例中，我们在完成资金转账后调用 `signalAll`。\n\
  \n\n\n\n```java\npublic void transfer(int from, int to, int amount)\n{\n   bankLock.lock();\n\
  \   try\n   {\n      while (accounts[from] < amount)\n         sufficientFunds.await();\n\
  \      // transfer funds\n      . . .\n      sufficientFunds.signalAll();\n   }\n\
  \   finally\n   {\n      bankLock.unlock();\n   }\n}\n```\n\n注意，对 `signalAll` 的调用不会立即激活等待的线程。它只是解除等待线程的阻塞，以便在当前线程释放锁后，它们可以竞争进入对象。\n\
  \n另一种方法 `signal` 只会从等待集中随机解除一个线程的阻塞。这比解除所有线程效率更高，但存在一个危险。如果随机选中的线程发现它仍然无法继续，它将再次进入阻塞状态。如果没有其他线程再次调用\
  \ `signal`，系统就会发生死锁。\n\n线程只有在拥有该条件的锁时，才能对该条件调用 `await`、`signalAll` 或 `signal`。\n\
  \n`synch` 包中的示例程序具有与 `unsynch` 版本列表 10.5 相同的 `main` 方法，但 `Bank` 类（列表 10.6）使用了锁。你会发现没有发生任何错误。总余额始终保持在\
  \ $100,000。没有任何账户出现过负余额。（再次，按下 `Ctrl+C` 终止程序。））你可能还会注意到程序运行得慢一点——这就是为同步机制涉及的额外账记录工作付出的代价。\n\
  \n在阅读源代码时，请注意 `transfer` 和 `getTotalBalance` 方法受锁的保护，但 `size` 方法没有。在这次模拟中，账户数量在构造后永远不会改变，因此没有需要为\
  \ `size` 方法授予排他访问。\n\n`synch/Bank.java`\n\n```java\npackage synch;\n\nimport java.util.*;\n\
  import java.util.concurrent.locks.*;\n\n/**\n * 一个使用锁进行序列化访问的具有多个银行账户的银行。\n */\n\
  public class Bank\n{\n   private final double[] accounts;\n   private final Lock\
  \ bankLock = new ReentrantLock();\n   private final Condition sufficientFunds =\
  \ bankLock.newCondition();\n\n   /**\n    * 构造银行。\n    * @param n 账户数量\n    * @param\
  \ initialBalance 每个账户的初始余额\n    */\n   public Bank(int n, double initialBalance)\n\
  \   {\n      accounts = new double[n];\n      Arrays.fill(accounts, initialBalance);\n\
  \   }\n\n   /**\n    * 将资金从一个账户转到另一个账户。\n    * @param from 从转出的账户\n    * @param\
  \ to 转入的账户\n    * @param amount 转账的金额\n    */\n   public void transfer(int from,\
  \ int to, double amount) throws InterruptedException\n   {\n      bankLock.lock();\n\
  \      try\n      {\n         while (accounts[from] < amount)\n            sufficientFunds.await();\n\
  \         System.out.print(Thread.currentThread());\n         accounts[from] -=\
  \ amount;\n         System.out.printf(\" %10.2f from %d to %d\", amount, from, to);\n\
  \         accounts[to] += amount;\n         System.out.printf(\" Total Balance:\
  \ %10.2f%n\", getTotalBalance());\n         sufficientFunds.signalAll();\n     \
  \ }\n      finally\n      {\n         bankLock.unlock();\n      }\n   }\n\n   /**\n\
  \    * 获取所有账户余额之和。\n    * @return 总余额\n    */\n   public double getTotalBalance()\n\
  \   {\n      bankLock.lock();\n      try\n      {\n         double sum = 0;\n\n\
  \         for (double a : accounts)\n            sum += a;\n\n         return sum;\n\
  \      }\n      finally\n      {\n         bankLock.unlock();\n      }\n   }\n\n\
  \   /**\n    * 获取银行中的账户数量。\n    * @return 账户数量\n    */\n   public int size()\n \
  \  {\n      return accounts.length;\n   }\n}\n```\n\n`java.util.concurrent.locks.Lock`\
  \ 5.0\n- `newCondition()`: 返回一个与此锁关联的条件。\n\n`java.util.concurrent.locks.Condition`\
  \ 5.0\n- `await()`: 将此线程放入该条件的等待集中。\n- `signalAll()`: 解除该条件等待集中所有线程的阻塞。\n- `signal()`:\
  \ 解除等待集中被选一个线程的阻塞。\n\n### 死锁\n\n锁和条件不能解决多线程中可能出现的所有问题。考虑以下情况：\n\n1. 账户 1: $200\n\
  2. 账户 2: $300\n3. 线程 1: 从账户 1 向账户 2 转 $300\n4. 线程 2: 从账户 2 向账户 1 转 $400\n\n如图 10.4\
