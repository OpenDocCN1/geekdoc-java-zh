  \n***\n\n\n\n泛型规范提到了另一条规则：“为了支持类型擦除（erasure），我们实施了一项限制：类或类型变量不能同时是两个不同参数化形式的同一接口类型的子类。”例如，以下代码是非法的：\n\
  \n```\nclass Employee implements Comparable<Employee> { . . . }\nclass Manager extends\
  \ Employee implements Comparable<Manager> { . . . } // ERROR\n```\n\n此时 `Manager`\
  \ 将同时实现 `Comparable<Employee>` 和 `Comparable<Manager>`，它们是同一个接口的不同参数化形式。\n\n目前还不清楚这一限制与类型擦除有什么关系。毕竟，非泛型版本\n\
  \n```\nclass Employee implements Comparable { . . . }\nclass Manager extends Employee\
  \ implements Comparable { . . . }\n```\n\n是合法的。原因要微妙得多。这会导致与合成的桥接方法（bridge methods）产生冲突。实现\
  \ `Comparable<X>` 的类获得一个桥接方法：\n\n```\npublic int compareTo(Object other) { return\
  \ compareTo((X) other); }\n```\n\n你不能拥有不同的类型 `X` 两个这样的方法。\n\n### 泛型记录模式中的类型推断是有限的\n\
  \n当涉及泛型类型时，编译器可能需要非常努力工作才能验证完备性。考虑这个不完整的 JSON 类型层次结构：\n\n```\nsealed interface JSONPrimitive<T>\
  \ {}\nrecord JSONNumber(double value) implements JSONPrimitive<Double> {}\nrecord\
  \ JSONBoolean(boolean value) implements JSONPrimitive<Boolean> {}\nrecord JSONString(String\
  \ value) implements JSONPrimitive<String> {}\n```\n\n以下方法中的 `switch` 是完备的：\n\n```\n\
  public static <T> double toNumber(JSONPrimitive<T> v)\n{\n   return switch (v)\n\
  \      {\n         case JSONNumber(var n) -> n;\n         case JSONBoolean(var b)\
  \ -> b ? 1 : 0;\n         case JSONString(var s) -> {\n            try\n       \
  \     {\n               yield Double.parseDouble(s);\n            }\n          \
  \  catch (NumberFormatException ex)\n            {\n               yield Double.NaN;\n\
  \            }\n         }\n      };\n}\n```\n\n从一眼看去，似乎有无限数量实现 `JSONPrimitive<T>`\
  \ 的类，但编译器可以追踪到它们只有三个。\n\n现在我们想要形成两个 JSON 原型的和：\n\n```\nrecord Pair<T>(T first, T\
  \ second)\n{\n   public static <U> Pair<U> of(U first, U second) { return new Pair<U>(first,\
  \ second); }\n}\n\npublic static Object sum(Pair<? extends JSONPrimitive<?>> pair)\n\
  {\n   return switch (pair)\n      {\n         case Pair(JSONNumber(var left), JSONNumber(var\
  \ right)) -> left + right;\n         case Pair(JSONBoolean(var left), JSONBoolean(var\
  \ right)) -> left | right;\n         case Pair(JSONString(var left), JSONString(var\
  \ right)) -> left.concat(right);\n         // ERROR--不完备\n      };\n}\n```\n\n这个\
  \ `switch` 不是完备的。毕竟，可能会像这样调用 `sum1`：\n\n```\nsum(Pair.of(new JSONNumber(42), new\
  \ JSONString(\"Fred\")))\n```\n\n你可以通过添加其他六种 JSON 原型的组合并在每种情况下抛出异常来使 `switch` 变得完备。但那是运行时检查。如果能在编译时拒绝混合对会更好。\n\
  \n以下是仅接受同质对的方法：\n\n```\npublic static <T extends JSONPrimitive<U>, U> Object sum(Pair<T>\
  \ pair)\n{\n   return switch (pair)\n      {\n         case Pair(JSONNumber(var\
  \ left), JSONNumber(var right)) -> left + right;\n         case Pair(JSONBoolean(var\
  \ left), JSONBoolean(var right)) -> left | right;\n         case Pair(JSONString(var\
  \ left), JSONString(var right)) -> left.concat(right);\n         default -> throw\
  \ new AssertionError(); // 遗憾的是 Java 无法判断这不会发生\n      };\n}\n```\n\n现在调用\n\n```\n\
  sum(Pair.of(new JSONNumber(42), new JSONString(\"Fred\")))\n```\n\n不再通过编译，因为对于 `T`\
  \ 和 `U` 没有匹配的类型。\n\n遗憾的是，`default` 子句是使 `switch` 完备所的。理论上，有足够的信息确定对组件必须是相同类型的实例，但\
  \ Java 类型系统无法证明这一点。\n\n尝试使用显式类型参数不起作用的：\n\n```java\npublic static <T extends JSONPrimitive<U>,\
  \ U> Object sum(Pair<T> pair)\n{\n   return switch (pair)\n      {\n         //\
  \ ERROR—不安全的转换\n         case Pair<JSONNumber>(JSONNumber(var left), JSONNumber(var\
  \ right)) -> left + right;\n         case Pair<JSONBoolean>(JSONBoolean(var left),\
  \ JSONBoolean(var right)) -> left | right;\n         case Pair<JSONString>(JSONString(var\
  \ left), JSONString(var right)) -> left.concat(right);\n      };\n}\n```\n\nJava\
  \ 编译器不知道如何证明当组件类型为 `JSONNumber` 时，从 `Pair<T>` 到 `Pair<JSONNumber>` 的转换是安全的。\n\n\
  ### 反射与泛型\n\n反射允许你在运行时分析对象。如果对象是泛型类的实例，你无法获得关于泛型类型参数的信息，因为它们已经被擦除了。在接下来的章节中，你将学习可以使用反射发现关于泛型类的什么。\n\
  \n### 泛型 `Class` 类\n\n`Class` 类有一个类型参数。例如，`String.class` 实际上是 `Class<String>` 类的一个对象（事实上是唯一的对象）。\n\
  \n类型参数是有用的，因为它允许 `Class<T>` 的方法对其返回类型更加具体。以下 `Class<T>` 的方法利用了类型参数：\n\n```\nT cast(Object\
  \ obj)\nT[] getEnumConstants()\nClass<? super T> getSuperclass()\nConstructor<T>\
  \ getConstructor(Class<?>... parameterTypes)\nConstructor<T> getDeclaredConstructor(Class<?>...\
  \ parameterTypes)\n```\n\n`getConstructor` 方法返回 `Constructor<T>` 实例，因此在以下情况下不需要转换：\n\
  \n```\nClass<T> cl = . . .\nT noArgInstance = cl.getConstructor().newInstance();\n\
  ```\n\n`cast` 方法返回给对象，如果其类型确实是 `T` 的子类，现在声明为类型 `T`。否则，它会抛出 `ClassCastException`。\n\
  \n如果该类不是枚举类或已知类型为 `T` 的枚举值数组，则 `getEnumConstants` 方法返回 `null`。\n\n`java.lang.Class<T>`\
  \ 1.0\n\n- `T cast(Object obj)`\n  如果 `obj` 为 `null` 或可以转换为类型 `T`，则返回 `obj`，否则抛出\
  \ `ClassCastException`。\n- `T[] getEnumConstants()` 5.0\n  如果 `T` 是枚举类型，则返回所有值的数组，否则返回\
  \ `null`。\n- `Class<? super T> getSuperclass()`\n  返回此类的父类，如果 `T` 不是类或 `Object`\
  \ 类，则返回 `null`。\n- `Constructor<T> getConstructor(Class... parameterTypes)` 1.1\n\
  - `Constructor<T> getDeclaredConstructor(Class... parameterTypes)` 1.1\n  获取公共构造函数，或具有给定参数类型的构造函数。\n\
  \n### 使用 `Class<T>` 参数进行类型匹配\n\n在泛型方法中匹配 `Class<T>` 参数的类型变量有时是有用的。这里是一个经典的示例：\n\n\
  ```\npublic static <T> Pair<T> makePair(Class<T> c) throws ReflectiveOperationException\n\
  {\n   Constructor<T> constr = c.getConstructor();\n   return new Pair<>(constr.newInstance(),\
  \ constr.newInstance());\n}\n```\n\n如果你调用\n\n```\nmakePair(String.class)\n```\n\n\
  那么 `String.class` 是类型为 `Class<String>` 的对象。`makePair` 方法的类型参数 `T` 匹配 `String`，编译器可以推断出方法返回\
  \ `Pair<String>`。\n\n### 虚拟机中的泛型类型信息\n\nJava 泛型的一个显著特征是虚拟机中泛型类型的擦除。令人惊讶的是，擦除后的类仍然保留了其泛型起源的一些微弱记忆。例如，原始\
  \ `Pair` 类知道它源自泛型类 `Pair<T>`，尽管 `Pair` 类型的对象无法判断自己是被构造为 `Pair<String>` 还是 `Pair<Employee>`。\n\
  \n同样地，考虑一个方法：``````\npublic static Comparable min(Comparable[] a)\n```\n\n\n\n这就是泛型方法的擦除\n\
  \n```java\npublic static <T extends Comparable<? super T>> T min(T[] a)\n```\n\n\
  你可以使用反射 API 来确定：\n\n* 该泛型方法拥有一个名为 `T` 的类型参数；\n* 该类型参数有一个子类型边界，而该边界本身是一个泛型类型；\n*\
  \ 该边界类型有一个通配符参数；\n* 该通配符参数有一个上界边界；以及\n* 该泛型方法拥有一个泛型数组参数。\n\n换句话说，你可以重构实现者所声明的关于泛型类和方法的所有信息。然而，你将不知道类型参数在特定对象或方法调用中是如何解析的。\n\
  \n为了表示泛型类型声明，请使用 `java.lang.reflect` 包中的 `Type` 接口。该接口有以下子类型：\n\n* `Class` 类，描述具体类型；\n\
  * `TypeVariable` 接口，描述类型变量（例如 `T extends Comparable<? super T>`）；\n* `WildcardType`\
  \ 接口，描述通配符（例如 `? super T`）；\n* `ParameterizedType` 接口，描述泛型类或接口类型（例如 `Comparable<?\
  \ super T>`）；\n* `GenericArrayType` 接口，描述泛型数组（例如 `T[]`）。\n\n图 8.5 显示了继承层次结构。注意后四个子类型是接口——虚拟机实例化实现这些接口的相应类。\n\
  \n![Figure](img/12_05.jpg)`Type` 接口及其后代\n\n列表 8.4 使用泛型反射 API 打印出对给定类所发现的信息。如果你使用\
  \ `Pair` 类运行它，将得到如下报告：\n\n```java\nclass Pair<T> extends java.lang.Object\npublic\
  \ T getFirst()\npublic T getSecond()\npublic void setFirst(T)\npublic void setSecond(T)\n\
  ```\n\n如果你使用 `PairTest2` 目录下的 `ArrayAlg` 运行它，报告将显示以下方法：\n\n```java\npublic static\
  \ <T extends java.lang.Comparable> Pair<T> minmax(T[])\n```\n\n`genericReflection/GenericReflectionTest.java`\n\
  \n```java\npackage genericReflection;\n\nimport java.lang.reflect.*;\nimport java.util.*;\n\
  \n/**\n * @version 1.13 2023-12-20\n * @author Cay Horstmann\n */\npublic class\
  \ GenericReflectionTest\n{\n   public static void main(String[] args)\n   {\n  \
  \    // 从命令行参数或用户输入读取类名\n      String name;\n      if (args.length > 0) name = args[0];\n\
