  ### 在加载时修改字节码\n\n在上一节中，你看到了一个编辑类文件的工具。然而，将另一个工具引入构建过程可能会很麻烦。一种吸引人的替代方案是将字节码工程推到*加载时*，即类加载器加载类时。\n\
  \n`instrumentation` API 有了一个安装字节码转换器的钩。转换器必须在程序的 `main` 方法被调用之前安装。你可以通过定义*代理*来满足这一要求，代理是一个监控程序的库。代理代码可以在\
  \ `premain` 方法中执行初始化。\n\n构建代理所需的步骤如下：\n\n1.  实现一个带有 `premain(String arg, Instrumentation\
  \ instr)` 方法的类。该方法在代理加载时被调用。\n\n2.  制作清单文件 `EntryLoggingAgent.mf` 设置 `Premain-Class`\
  \ 属性，例如：\n\n    ```\n    Premain-Class: bytecodeAnnotations.EntryLogger\n    ```\n\
  \n3.  将代理代码和清单文件打包成 JAR 文件：\n\n    ```\n    javac -classpath .:asm/\\* bytecodeAnnotations/EntryLoggingAgent.java\
  \ \n    jar cvfm EntryLoggingAgent.jar bytecodeAnnotations/EntryLoggingAgent.mf\
  \ \\\n       bytecodeAnnotations/Entry*.class\n    ```\n\n要同代理一起运行 Java 程序，使用以下命令行选项：\n\
  \n```\njava -javaagent:AgentJARFile=agentArgument . . .\n```\n\n\n\n\n```\njavac\
  \ set/*.java\njava -javaagent:EntryLoggingAgent.jar=set.Item -classpath .:asm/\\\
  * set.SetTest\n```\n\n`Item` 参数是代理应该修改的类名。\n\nListing 11.8 显示了代理代码。该代理安装了一个类文件转换器。该转换器首先检查类名是否与代理参数匹配。如果是，它将使用前一节中的\
  \ `EntryLogger` 类来修改字节码。然而，修改后的字节码并没有保存到文件中。相反，转换器将它们返回以便加载到虚拟机（参见图 11.3）。换句话说，这种技术对字节码执行了“即时”修改。\n\
  \n![Figure](img/fig11-04.jpg)在加载时修改类\nbytecodeAnnotations/EntryLoggingAgent.java\n\
  \n```java\npackage bytecodeAnnotations;\n\nimport java.lang.instrument.*;\nimport\
  \ java.security.*;\nimport org.objectweb.asm.*;\n\n/**\n * @version 1.11 2018-05-01\n\
  \ * @author Cay Horstmann\n */\npublic class EntryLoggingAgent\n{\n   public static\
  \ void premain(final String arg, Instrumentation instr)\n   {\n      instr.addTransformer(new\
  \ ClassFileTransformer() {\n         public byte[] transform(ClassLoader loader,\
  \ String className, Class<?> cl,\n            ProtectionDomain pd, byte[] data)\
  \ throws IllegalClassFormatException\n         {\n            if (!className.replace(\"\
  /\", \".\").equals(arg)) return null;\n            var reader = new ClassReader(data);\n\
  \            var writer = new ClassWriter(\n               ClassWriter.COMPUTE_MAXS\
  \ | ClassWriter.COMPUTE_FRAMES);\n            var el = new EntryLogger(writer, className);\n\
  \            reader.accept(el, ClassReader.EXPAND_FRAMES);\n            return writer.toByteArray();\n\
  \         }});\n   }\n}\n```\n\n在本章中，你学习了如何：\n\n*   向 Java 程序中添加注解\n*   设计你自己的注解接口\n\
  *   实现利用注解的工具\n\n你已经看到了三种处理代码的技术：脚本化、编译 Java 程序以及处理注解。前两种非常直观。另一方面，构建注解工具无疑是复杂的，而且并不是大多数开发者需要处理的。本章为你理解你将要遇到的注解工具的内部机制提供了背景，可能激发了你开发自己工具的兴趣。\n\
  \n下一章将讨论 Java 平台模块系统（Java Platform Module System），这是确保 Java 平台完整性的关键特性。\n\n# Java\
  \ 平台模块系统\n\n面向对象编程的一个重要特性是封装。类声明由一个公共接口和一个私有实现部分组成。类可以通过更改实现来演进，而不影响其用户。模块系统为大规模编程提供了同样的益处。模块可以选择性地使类和包可用，从而控制它的演进。\n\
  \n现有的几个 Java 模块系统依赖类加载器来隔离类。然而，Java 9 引入了一个新系统，称为 Java 平台模块系统，它由 Java 编译器和虚拟机支持。它的设计目的是将\
  \ Java 平台庞大的代码模块化。如果你愿意，可以使用该系统将自己的应用程序模块化。\n\n无论你会在自己的应用程序中使用未使用 Java 平台模块，你都可能受到模块化\
  \ Java 平台的影响。本章将向你如何声明和使用 Java 平台模块。你还将学习如何迁移你的应用程序，以与模块化的 Java 平台和第三方模块协同工作。\n\n\
  ## 模块概念\n\n在面向对象编程中，基本的构建单元是类。类提供了封装。私有特征只能由具有显式权限的代码访问——即类的方法。这使得推理访问权限成为可能。如果一个私有变量发生了变化，你可以列出所有可能的“罪祸首”。如果你需要修改私有表示，你知道哪些方法受了影响。\n\
  \n在 Java 中，包提供了更大的组织分组。包是类的集合。包也提供了一种级别的封装。任何具有包访问权限（既不是公共也不是私有）的特征只能从同一包中的方法访问。\n\
  \n然而，在大型系统中，这种级别的访问控制是不够的。任何公共特征都可以在任何地方访问。假设你想修改或删除一个很少使用的特性。一旦它是公共的，就没有方法可以推导出该更改的影响。\n\
  \n这就是 Java 平台设计者所面临的局面。在二十多年里，JDK 飞速增长，但显然某些特性现在本质上已经过时了。大家最喜欢的例子是 CORBA。你上一次使用它是什么时候？尽管如此，`org.omg.corba`\
  \ 包在 Java 10 之前一直随每个 JDK 发布。从 Java 11 开始，那些仍然需要它的人必须向其项目添加必需的 JAR 文件。\n\n那么 `java.awt`\
  \ 呢？它在服务端应用程序中不应该是必须的，对吧？但 `java.awt.DataFlavor` 类被用于 SOAP（一种基于 XML 的网络服务协议）的实现中。\n\
  \nJava 平台设计者面对巨大的代码“乱团”，决定他们需要一种提供更多控制的结构化机制。他们查看了现有的模块系统（如 OSGi），发现它们不适合解决他们的问题。相反，他们设计了一个新系统，称为\
  \ Java 平台模块系统，它现在是 Java 语言和虚拟机的一部分。该系统已成功地用于将 Java API 模块化，如果你愿意，也可以将其应用于你自己的应用程序中。\n\
  \n一个 Java 平台模块由以下\n\n*   包的集合\n*   可选的资源文件和其他文件（如原生库）\n*   可访问包的列表\n*   模块依赖的所有模块列表\n\
  \nJava 平台在编译时和虚拟机中强制执行封装和依赖。\n\n为什么你应该考虑使用 Java 模块系统来开发自己的程序，而不是在类路径上使用传统方法？有两个优势：\n\
  \n1.  强封装：你可以控制哪些包是可用的，而不必担心维护你并不打算公开使用的代码。\n2.  可靠的配置：你避免了类路径常见的问题，如类重复或缺失。\n\n\
  有一些 Java 平台模块系统没有解决的问题，例如模块的版本控制。它不支持指定所需的模块版本，也不在同一个程序中使用多个版本的模块。这些可能是理想的特性，但如果你需要它们，必须使用\
  \ Java 平台模块系统以外的机制。\n\n## 模块命名\n\n模块是包的集合。模块中的包名不需要相关。例如，`java.sql` 模块包含了 `java.sql`、`javax.sql`\
  \ 和 `javax.transaction.xa` 包。此外，正如从这个例子所示，模块名与包名相同是完全可以的。\n\n就像包名一样，模块名由字母、数字、下划线和点组成。正如包名一样，模块之间没有层级关系。如果你有一个\
  \ `com.horstmann` 模块和另一个 `com.horstmann.corejava` 模块，从模块系统的角度来看，它们是无关的。\n\n在为他人创建模块时，确保其名称是全局唯一的是重要的。预计大多数模块名称将遵循与包名类似的“反向域名”惯。\n\
  \n\n\n\n\n最简单的方法是根据模块提供的顶层包来命名模块。例如，SLF4J 日志外层有一个名为 `org.slf4j` 的模块，它包含了 `org.slf4j`、`org.slf4j.spi`、`org.slf4j.event`\
  \ 和 `org.slf4j.helpers` 包。\n\n这种约定可以防止模块之间的包名冲突。任何给定的包只能存放在一个模块中。如果你的模块名是唯一的，且你的包名以模块名开头，那么你的包名也将是唯一的。\n\
  \n对于那些不供其他程序员使用的模块，可以使用较短的模块名，例如包含应用程序的模块。只是为了说明这种做法是可行的，我将在本章中同样这样做。可能可能是库代码的模块将具有如\
  \ `com.horstmann.util` 的名称，而包含程序（带有 `main` 方法的类）的模块将具有如 `v1ch12.hellomod` 这样易记的名称。\n\
  \n模块名仅在模块声明中使用。在 Java 类的源文件中，你永远不会引用模块名；相反，请像过去一样使用包名。\n\n## 模块化的“Hello, World!”程序\n\
  \n让我们把传统的“Hello, World!”程序放入模块中。首先，我们需要将类放入一个包中——“未命名包”不能包含在模块中。代码如下：\n\n```\npackage\
  \ com.horstmann.hello;\n\npublic class HelloWorld\n{\n   public static void main(String[]\
  \ args)\n   {\n      System.out.println(\"Hello, Modular World!\");\n   }\n}\n```\n\
  \n到目前为止，什么都没有改变。要创建一个包含该包的 `v1ch12.hellomod` 模块，你需要添加一个模块声明。将其放在一个名为 `module-info.java`\
  \ 的文件中，位于基目录下（即包含 `com` 目录的相同目录）。按照约定，基目录的名字与模块名相同。\n\n```\nv1ch12.hellomod/\n└\
  \ module-info.java\n  com/\n  └ horstmann/\n    └ hello/\n      └ HelloWorld.java\n\
  ```\n\n`module-info.java` 文件包含了模块声明：\n\n```\nmodule v1ch12.hellomod\n{\n}\n```\n\
  \n这个模块声明是空的，因为该模块没有向任何人提供任何内容，也不需要任何东西。\n\n现在，像往常一样编译：\n\n```\njavac v1ch12.hellomod/module-info.java\
  \ v1ch12.hellomod/com/horstmann/hello/HelloWorld.java\n```\n\n`module-info.java`\
  \ 文件看起来不像一个 Java 源文件，而且当然不可能有一个名为 `module-info` 的类，因为类名不能包含连字符。`module` 关键字，以及你在后续章节中看到的\
  \ `requires`、`exports` 等关键字，都是“限制关键字”，它们仅在模块声明中具有特殊含义。该文件被编译成 `module-info.class`\
  \ 类文件，其中包含二进制形式的模块定义。\n\n要作为模块化应用程序运行此程序，你需要指定*模块路径*（module path），它类似于类路径但包含了模块。你还需要以\
  \ `modulename`/`classname` 的格式指定主类：\n\n```\njava --module-path v1ch12.hellomod --module\
  \ v1ch12.hellomod/com.horstmann.hello.HelloWorld\n```\n\n除了 `--module-path` 和 `--module`，你可以使用单字母选项\
  \ `-p` 和 `-m`：\n\n```\njava -p v1ch12.hellomod -m v1ch12.hellomod/com.horstmann.hello.HelloWorld\n\
  ```\n\n无论哪种方式，都会出现“Hello, Modular World!”问候，这证明你成功地将你的第一个应用程序模块化。\n\n当你编译此模块时，会收到一个警告：\n\
  \n```\nwarning: [module] module name component v1ch12 should avoid terminal digits\n\
  ```\n\n此警告旨在劝阻程序员在模块名中添加版本号。你可以忽略这个警告，或者使用注解来抑制它：\n\n```\n@SuppressWarnings(\"module\"\
  ) \nmodule v1ch12.hellomod\n{\n}\n```\n\n在这一点上，`module` 声明就像类声明一样：你可以对它进行注解。（注解类型的目标必须是\
  \ `ElementType.MODULE`。）\n\n## 模块的依赖\n\n让我们创建一个新模块 `v1ch12.requiremod`，在其中程序使用 `JOptionPane`\
  \ 来显示“Hello, Modular World!”消息：\n\n```\npackage com.horstmann.hello;\n\nimport javax.swing.JOptionPane;\n\
  \npublic class HelloWorld\n{\n   public static void main(String[] args)\n   {\n\
  \      JOptionPane.showMessageDialog(null, \"Hello, Modular World!\");\n   }\n}\n\
  ```\n\n现在编译失败并显示此消息：\n\n```\nerror: package javax.swing is not visible\n  (package\
  \ javax.swing is declared in module java.desktop, \n  but module v1ch12.requiremod\
  \ does not read it)\n```\n\nJDK 已经模块化，`javax.swing` 包现在包含在 `java.desktop` 模块中。我们的模块需要声明它依赖该模块：\n\
  \n```\nmodule v1ch12.requiremod\n{\n   requires java.desktop;\n}\n```\n\n模块系统的设计目标之一是模块的依赖是显式的，这样虚拟机可以在启动程序之前确保所有依赖都已满足。\n\
  \n在上一节中，没有出现显式依赖的需求是因为我们只使用了 `java.lang` 和 `java.io` 包。这些包包含在默认的 `java.base` 模块中。\n\
  \n注意 `v1ch12.requiremod` 模块列出了它自己的依赖。它需要 `java.desktop` 模块以便使用 `javax.swing` 包。`java.desktop`\
  \ 模块本身声明它需要另外三个模块，即 `java.datatransfer`、`java.prefs` 和 `java.xml`。\n\n图 1 显示了*模块图*，其中节点是模块。图的边（即连接节点的箭头）要么是声明的依赖，要么是对\
  \ `java.base` 的隐含依赖。\n\n![.png](img/module-graph1.jpg)Swing 应用程序的模块图\n\n图中不能存在循环——即模块不能直接或间接地引用它自己。\n\
  \n模块不会将访问权限传递给其他模块。在我们的示例中，`java.desktop` 模块声明需要 `java.prefs`，而 `java.prefs` 模块声明需要\
  \ `java.xml`。这并没有赋予 `java.desktop` 使用 `java.xml` 包的权限。它需要显式声明该依赖。从数学角度来看，`requires`\
  \ 关系不是传递的。通常这种行为是理想的，因为它使依赖显式化，但正如你在 12.11 节中所看到的，你可以在某些情况下放宽。\n\n本节开始时的错误消息指出我们的\
  \ `v1ch12.requiremod` 模块没有“读取” `java.desktop` 模块。在 Java 模块术语中，模块 `M` 在以下情况下*读取*模块\
  \ `N`：\n\n1. `M` 需要 `N`。\n2. `M` 需要一个传递需要 `N` 的模块（见 12.11 节）。\n3. `N` 是 `M` 或 `java.base`。\n\
  \n## 输出包\n\n在前节中，你看到如果想使用某些包，模块必须需要另一个模块。然而，这并不会自动让所需模块中的所有包可用。模块使用 `exports` 关键字声明哪些包是可访问的。例如，这里是\
  \ `java.xml` 模块声明的一部分：\n\n```\nmodule java.xml\n{\n   exports javax.xml;\n   exports\
  \ javax.xml.catalog;\n   exports javax.xml.datatype;\n   exports javax.xml.namespace;\n\
  \   exports javax.xml.parsers;\n   . . .\n}\n```\n\n该模块使得许多包可用，但通过不导出它们隐藏了其他包（如\
  \ `jdk.xml.internal`）。\n\n当包被导出时，其 `public` 和 `protected` 的类和接口，以及它们的 `public` 和\
  \ `protected` 成员在模块外部都是可访问的。（一既一样，`protected` 类型和成员仅在子类和同一包中可见。）\n\n\n\n\n然而，未被导出的包在自己的模块外部是无法访问的。这与模块化之前的\
  \ Java 有很大不同。在过去，你可以使用任何包中的 `public` 类，即使它不属于公共 API 的一部分。例如，当公共 API 未提供适当的功能时，通常推荐使用如\
  \ `sun.misc.BASE64Encoder` 或 `com.sun.rowset.CachedRowSetImpl` 等类。\n\n如今，你无法再访问\
  \ Java 平台 API 中未导出的包了，因为它们都包含在模块内部。结果是，某些程序将无法在 Java 9 上运行。当然，没有人承诺过保持非公开 API 的可用性，因此这不应该让人感到意外。\n\
  \n让我们在一个简单的场景中使用导出（exports）语句吧。我们将准备一个名为 `com.horstmann.greet` 的模块，它将导出一个也称为 `com.horstmann.greet`\
  \ 的包。根据惯例，为他人提供代码的模块应根据内部的顶层包命名。还有一个名为 `com.horstmann.greet.internal` 的包，我们不导出它。\n\
  \n第一个包中有一个公共的 `Greeter` 接口。\n\n```java\npackage com.horstmann.greet;\n\npublic interface\
  \ Greeter\n{\n   static Greeter newInstance()\n   {\n      return new com.horstmann.greet.internal.GreeterImpl();\n\
  \   }\n\n   String greet(String subject);   \n}\n```\n\n第二个包中有一个实现该接口的类。该类是 `public`\
  \ 的，因为它在第一个包中被访问。\n\n```java\npackage com.horstmann.greet.internal;\n\nimport com.horstmann.greet.Greeter;\n\
  \npublic class GreeterImpl implements Greeter\n{\n   public String greet(String\
  \ subject)\n   {\n      return \"Hello, \" + subject + \"!\";\n   }\n}\n```\n\n\
  `com.horstmann.greet` 模块包含了这两个包，但只导出第一个：\n\n```java\nmodule com.horstmann.greet\n\
  {\n   exports com.horstmann.greet;\n}\n```\n\n第二个包在模块外部是不可访问的。\n\n我们将应用程序放入第二个模块中，它将需要第一个模块：\n\
  \n```java\nmodule v1ch12.exportedpkg\n{\n   requires com.horstmann.greet;\n}\n```\n\
  \n`exports` 语句后面跟着一个包名，而 `requires` 后面跟着一个模块名。\n\n我们的应用程序现在使用 `Greeter` 来获取问候：\n\
  \n```java\npackage com.horstmann.hello;\n\nimport com.horstmann.greet.Greeter;\n\
  \npublic class HelloWorld\n{\n   public static void main(String[] args)\n   {\n\
  \      Greeter greeter = Greeter.newInstance();\n      System.out.println(greeter.greet(\"\
  Modular World\"));\n   }\n}\n```\n\n这是这两个模块的源文件结构：\n\n```\ncom.horstmann.greet\n\
  ├ module-info.java\n└ com\n  └ horstmann\n    └ greet\n      ├ Greeter.java\n  \
  \    └ internal\n        └ GreeterImpl.java\nv1ch12.exportedpkg\n├ module-info.java\n\
  └ com\n  └ horstmann\n    └ hello\n      └ HelloWorld.java\n```\n\n要构建此应用程序，首先编译\
  \ `com.horstmann.greet` 模块：\n\n```bash\njavac com.horstmann.greet/module-info.java\
  \ \\\n   com.horstmann.greet/com/horstmann/greet/Greeter.java \\\n   com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java\n\
  ```\n\n然后，将第一个模块放在模块路径上编译应用程序模块：\n\n```bash\njavac -p com.horstmann.greet v1ch12.exportedpkg/module-info.java\
  \ \\\n   v1ch12.exportedpkg/com/horstmann/hello/HelloWorld.java\n```\n\n最后，将两个模块都放在模块路径上运行程序：\n\
  \n```bash\njava -p v1ch12.exportedpkg:com.horstmann.greet \\\n   -m v1ch12.exportedpkg/com.horstmann.hello.HelloWorld\n\
  ```\n\n这个示例演示了如何在模块中隐藏实现类。实现类在模块外部是不可访问的。客户端使用接口和工厂方法，而不是实例化实现类。\n\n在 Windows 的\
  \ `cmd` 终端中，你必须用引号括 `v1ch12.exportedpkg:com.horstmann.greet`，因为冒号字符具有特殊含义。你还需要使用\
  \ `^` 代替 `\\` 来进行多行命令。\n\n要使用 Eclipse 构建此应用程序，请为每个模块创建一个单独的项目。在 `v1ch12.exportedpkg`\
  \ 项目中，编辑项目属性。在 Projects 选项中，将 `com.horstmann.greet` 模块添加到模块路径——参见图 12.2 。\n\n![Eclipse-modules](img/Eclipse-modules.jpg)向\
  \ Eclipse 项目添加依赖模块\n\n你现在已经看到了构成 Java 平台模块系统骨干的 `requires` 和 `exports` 语句。如你所见，模块系统在概念上是简单的。模块指定了它们需要的模块，以及它们向其他模块提供的包。第\
  \ 12.12 节 显示了 `exports` 语句的一种细微变体。\n\n模块不提供作用域。你不能在不同的模块中拥有同名的包。即使对于隐藏的包（即未导出的包）也是如此。\n\
  \n## 模块化 JAR\n\n到目前为止，我们只是简单将模块编译到了目录。类加载器的等效物是 *layer*（层）。Java 平台模块系统将 JDK 模块和应用程序模块加载到\
  \ *boot layer*（引导层）。程序可以加载其他模块，使用层 API（本书中未涵盖）。此类程序可能会考虑模块版本。\n\n在过去，一个包的类有时会分布在多个\
  \ JAR 文件中。（这种包被称为“拆分包”）。这可能从不是一个好主意，而且在模块中是不可能的。\n\n如果你使用 Maven、Ant 或 Gradle 等构建工具，只需像以前一样构建\
  \ JAR。只要包含了 `module-info.class`，你就能得到模块化 JAR。\n\n要创建模块化 JAR，请使用 `jar` 工具。在我们的示例中，使用：\n\
  \n```bash\njavac com.horstmann.greet/module-info.java \\\n   com.horstmann.greet/com/horstmann/greet/Greeter.java\
  \ \\\n   com.horstmann.greet/com/horstmann/greet/internal/GreeterImpl.java \\\n\
  \   -d modules/com.horstmann.greet\n```\n\n然后，将模块化 JAR 放在模块路径上：\n\n```bash\njava\
  \ -p modules/com.horstmann.greet -m com.horstmann.greet\n```\n\n启动程序时，指定包含主类的模块：\n\
  \n```bash\njava -p modules/com.horstmann.greet -m com.horstmann.greet\n```\n\n在创建\
  \ JAR 文件时，可以选择指定版本号。使用 `--module-version` 参数，并将版本号添加到 JAR 文件名中：\n\n```bash\njar\
  \ -c -v -f com.horstmann.greet-1.0.jar --module-version 1.0 -C com.horstmann.greet\n\
  ```\n\n正如过的，版本号不会被 Java 平台模块系统用于解析模块，但可以被其他工具和框架查询。\n\n你可以通过反射 API 获取版本号。在我们的示例中：\n\
  \n```java\nOptional<String> version = Greeter.class.getModule().getDescriptor().rawVersion();\n\
  ```\n\n将返回一个包含版本字符串 `\"1.0\"` 的 `Optional`。\n\n如果你想在 JShell 中加载模块，请将 JAR 放在模块路径上并使用\
  \ `--add-modules` 选项：\n\n\n\n\n\n```\njshell --module-path com.horstmann.greet-1.0.jar\
  \ --add-modules com.horstmann.greet\n```\n\n## 模块与反射式访问\n\n在前面的章节中，你已经看到模块系统强制执行封装。模块只能访问另一个模块中显式导出（exported）的包。在过去，总是可以通过反射来克服那些烦人的访问限制的。正如你在第\
  \ 5 章中看到的，反射可以访问任何 `class` 的私有成员。\n\n然而，在模块化世界中，这不再成立了。如果一个 `class` 在模块内部，对非公共成员的反射式访问将失败。具体来说，回想我们是如何访问私有字段的：\n\
  \n```\nField f = obj.getClass().getDeclaredField(\"salary\");\nf.setAccessible(true);\n\
  double value = f.getDouble(obj);\nf.setDouble(obj, value * 1.1);\n```\n\n调用 `f.setAccessible(true)`\
  \ 会成功，除非安全管理器不允许对私有字段的访问。然而，使用安全管理器运行 Java 应用程序并不常见，而且许多库使用了反射式访问。典型的例子是对象关系映射器，例如\
  \ `JPA`，它们会自动将对象持久化到数据库；以及在对象与 XML 或 JSON 之间转换的库，例如 `JAXB` 和 `JSON-B`。\n\n如果你使用此类库并且又想使用模块，你就必须小心。为了演示这个问题，让我们把第\
  \ 5 章中的 `ObjectAnalyzer` `class` 放入模块 `com.horstmann.util` 中。该 `class` 有一个 `toString`\
  \ 方法，使用反射打印对象的字段。\n\n另一个独立的 `v1ch12.openpkg` 模块包含一个简单的 `Country` `class`：\n\n```\n\
  package com.horstmann.places;\n\npublic class Country\n{\n   private String name;\n\
  \   private double area;\n\n   public Country(String name, double area)\n   {\n\
  \      this.name = name;\n      this.area = area;\n   }\n   // . . .\n}\n```\n\n\
  一个短程序演示了如何分析一个 `Country` 对象：\n\n```java\npackage com.horstmann.places;\n\nimport\
  \ com.horstmann.util.*;\n\npublic class Demo\n{\n   public static void main(String[]\
  \ args) throws ReflectiveOperationException\n   {\n      var belgium = new Country(\"\
  Belgium\", 30510);\n      var analyzer = new ObjectAnalyzer();\n      System.out.println(analyzer.toString(belgium));\n\
  \   }\n}\n```\n\n现在编译两个模块和 `Demo` 程序：\n\n```\njavac com.horstmann.util/module-info.java\
  \ \\\n   com.horstmann.util/com/horstmann/util/ObjectAnalyzer.java\njavac -p com.horstmann.util\
  \ v1ch12.openpkg/module-info.java \\\n   v1ch12.openpkg/com/horstmann/places/*.java\n\
  java -p v1ch12.openpkg:com.horstmann.util -m v1ch12.openpkg/com.horstmann.places.Demo\n\
  ```\n\n该程序将抛出异常失败：\n\n```\nException in thread \"main\" java.lang.reflect.InaccessibleObjectException:\n\
  \   Unable to make field private java.lang.String com.horstmann.places.Country.name\n\
  \   accessible: module v1ch12.openpkg does not \"opens com.horstmann.places\" to\
  \ module\n   com.horstmann.util\n```\n\n当然，在纯理论上，违反封装并窥探对象的私有成员是错误的。但像对象关系映射或 XML/JSON\
  \ 绑定这样的机制是非常常见的，以至于模块系统必须适应它们。\n\n使用 `opens` 关键字，模块可以*打开*一个包，这使得对给定包中所有类实例的反射访问成为可能。以下是我们的模块需要做的：\n\
  \n```\nmodule v1ch12.openpkg\n{\n   requires com.horstmann.util;\n   opens com.horstmann.places;\n\
  }\n```\n\n通过此更改，`ObjectAnalyzer` 将正常工作。\n\n模块可以被声明为 `open`，例如：\n\n```\nopen module\
  \ v1ch12.openpkg\n{\n   requires com.horstmann.util;\n}\n```\n\n开放模块授予对其所有包的运行时访问权限，就像所有包都已声明了\
  \ `exports` 和 `opens` 一样。然而，在编译时，只有显式导出的包是可访问的。开放模块将模块系统的编译时安全性与经典的宽松运行时行为结合了一起。\n\
  \n回想第 5 章，JAR 文件除了类文件和清单文件外，还可以包含*文件资源*，这些资源可以使用 `Class.getResourceAsStream` 方法加载，现在也可以通过\
  \ `Module.getResourceAsStream` 加载。如果资源存储在与模块中的某个包匹配的目录中，则该包必须对调用者开放。其他目录中的资源以及类文件和清单文件可以被任何人读取。\n\
  \n为了更真实的例子，我们可以使用 JSON-B 规范将 `Country` 对象转换为 XML 或 JSON。要使用 JSON-B 的 Yasson 实现，请从\
  \ Maven 中央仓库下载 `jakarta.json-api-2.1.2.jar`、`jakarta.json.bind-api-3.0.0.jar`、`parsson-1.1.4.jar`\
  \ 和 `yasson-3.0.3.jar`。将这些 JAR 文件放在模块路径上并运行 `com.horstmann.places`。未来的库可能会使用*变量句柄*（variable\
  \ handles）而不是反射。`VarHandle` 与 `Field` 类似。你可以用它读取或写入特定字段。\n\n```java\npublic Object\
  \ getFieldValue(Object obj, String fieldName, Lookup lookup)\n      throws NoSuchException,\
  \ IllegalAccessException\n{\n   Class<?> cl = obj.getClass();\n   Field field =\
  \ cl.getDeclaredField(fieldName);\n   VarHandle handle = MethodHandles.privateLookupIn(cl,\
  \ lookup)\n      .unreflectVarHandle(field);\n   return handle.get(obj);\n}\n```\n\
  \n这前提是有 `Lookup`。\n\n## 自动模块\n\n你现在知道如何使用 Java 模块系统了。如果你从一个编写所有代码的新项目开始，你可以设计模块、声明依赖并将应用程序封装成模块化的\
  \ JAR 文件。\n\n然而，这是一种极少的情况。几乎所有项目都依赖第三方库。当然，你可以等待库提供者将它们转换为模块，然后对自己的代码进行模块化。\n\n\
  但如果你不想等待呢？Java 模块系统提供了两种机制来跨越今天的预模块世界与完全模块化应用程序之间的鸿沟：自动模块和未命名模块。\n\n为了迁移目的，你只需将任何\
  \ JAR 文件放在模块路径而非类路径上即可将其转换为模块。在模块路径上没有 `module-info.class` 的 JAR 被称为*自动模块*。自动模块具有以下属性：\n\
  \n1. 该模块隐式包含对所有其他模块的 `requires` 子句。\n2. 它的所有包都导出并开放。\n3. 如果 JAR 文件的清单 `META-INF/MANIFEST.MF`\
  \ 中存在键为 `Automatic-Module-Name` 的项，则其值成为模块名。\n4. 否则，模块名 get JAR 文件名，删除末尾的版本号并将非字母数字字符序列替换为点。\n\
  \n前两个规则意味着自动模块中的包表现就像它们在类路径上一样。使用模块路径的原因是为了其他模块的考虑，允许它们表达对该模块的依赖。\n\n例如，你正在实现一个处理\
  \ CSV 文件并使用 Apache Commons CSV 库的模块。你希望在你的 `module-info.java` 文件中表示你的模块依赖 Apache\
  \ Commons CSV。\n\n\n\n\n\n如果你将 `commons-csv-1.9.0.jar` 添加到模块路径上，那么你的模块就可以引用该模块。它的名称是\
  \ `commons.csv`，因为末尾的版本号 `-1.9.0` 被删除了，非字母数字字符 `-` 被替换为点。\n\n这个名称可能是一个可以接受的模块名称，因为\
  \ Commons CSV 是广为人知的，不太可能有人会尝试为不同的模块使用相同的名称。但如果该 JAR 文件的维护者可以使用一个他们控制的名称（最好是顶层包名\
  \ `org.apache.commons.csv`）作为模块名称，将会更好。他们只需要在 JAR 内部的 `META-INF/MANIFEST.MF` 文件添加一行：\n\
  \n```\nAutomatic-Module-Name: org.apache.commons.csv\n```\n\n事实上，他们在 `commons-csv-1.10.0.jar`\
  \ 中确实是这样做了。\n\n最终，希望他们通过添加带有该模块名称的 `module-info.java` 将该 JAR 文件转换为真正的模块。其他所有以该名称引用\
  \ CSV 模块的模块将继续工作。\n\n向模块迁移的计划是一场伟大的社会实验，没有人知道它是否会有良好的结果。在你将第三方 JAR 放在模块路径上之前，请检查它们是否是模块化的，如果没有，请检查它们的清单（manifest）是否包含模块名称。如果没有，你仍然可以将\
  \ JAR 转换为自动模块，但要准备好以后更新模块名称。\n\n为了尝试自动 JAR，从 [`commons.apache.org/proper/commons-csv`](https://commons.apache.org/proper/commons-csv)\
  \ 下载 Commons CSV 库的 1.9.0 和 1.10.0 版本。配套代码中的 `v2ch9.automod` 包含一个简单的程序，用于读取包含国家数据的\
  \ CSV 文件：\n\n```\npackage com.horstmann.places;\n\nimport java.io.*;\nimport org.apache.commons.csv.*;\n\
  \npublic class CSVDemo\n{\n   public static void main(String[] args) throws IOException\n\
  \   {\n      var in = new FileReader(\"countries.csv\");\n      Iterable<CSVRecord>\
  \ records = CSVFormat.EXCEL.withDelimiter(';')\n            .withHeader().parse(in);\n\
  \      for (CSVRecord record : records)\n      {\n         String name = record.get(\"\
  Name\");\n         double area = Double.parseDouble(record.get(\"Area\"));\n   \
  \      System.out.println(name + \" has area \" + area);\n      }\n   }\n}\n```\n\
  \n要将 `commons-csv-1.9.0.jar` 作为自动模块使用，我们需要通过它的文件名来引用它：\n\n```\n@SuppressWarnings(\"\
  module\")\nmodule v1ch12.automod \n{\n   requires commons.csv;\n}\n```\n\n对于 `commons-csv-1.10.0.jar`，使用清单中的\
  \ `Automatic-Module-Name`：\n\n```\nrequires org.apache.commons.csv\n```\n\n以下是编译和运行程序的命令：\n\
  \n```\njavac -p v1ch12.automod:commons-csv-1.10.0.jar \\\n   v1ch12.automod/com/horstmann/places/CSVDemo.java\
  \ \\\n   v1ch12.automod/module-info.java\njava -p v1ch12.automod:commons-csv-1.10.0.jar\
  \ \\\n   -m v1ch12.automod/com.horstmann.places.CSVDemo\n```\n\n## 未命名模块\n\n任何不在模块路径上的类都是`未命名模块`（unnamed\
  \ module）的一部分。从技术上讲，可能存在多个未命名模块，但它们共同的作用就像一个名为“未未命名模块”（the unnamed module）的单一模块。与自动模块一样，未命名模块可以访问所有其他模块，并且它的所有包都会导出并开放。\n\
  \n然而，`显式模块`（explicit module）可以访问未命名模块。（显式模块既不是自动模块也不是未命名模块的模块——即在模块路径上带有 `module-info.class`\
  \ 的模块）。换句话说，显式模块总是能够脱离“类路径地狱”。\n\n例如考虑上一节的程序。假设你将 `commons-csv-1.9.0.jar` 放在类路径而不是模块路径：\n\
  \n```\njava --module-path v1ch12.automod \\\n   --class-path commons-csv-1.10.0.jar\
  \ \\\n   -m v1ch12.automod/com.horstmann.places.CSVDemo\n```\n\n现在程序将无法启动：\n\n```\n\
  Error occurred during initialization of boot layer\njava.lang.module.FindException:\
  \ Module commons.csv not found, required by v1ch12.automod\n```\n\n因此，向 Java 平台模块系统的迁移必然是一个自下而上的过程：\n\
  \n1. Java 平台本身被模块化。\n2. 接下来，库被模块化，通过使用自动模块或将它们转换为显式模块来实现。\n3. 一旦应用程序使用的所有库都已模块化，你就可以将你的应用程序代码转换为模块。\n\
  \n自动模块`可以`读取未命名模块，因此它们的依赖可以放在类路径上。\n\n## 迁移的命令行标记\n\n即使你的程序没有使用模块，在使用 Java 9 及更高版本时，你也无法逃避模块化世界。你的应用程序代码可能位于未命名模块的类路径上。你的应用程序代码位于未命名模块中，因此所有包都导出并开放。尽管，从\
  \ Java 11 开始，编译时封装被严格执行。到 Java 17，`--illegal-access` 标志不再可用。`--add-exports` 和 `--add-opens`\
  \ 标志允许你调整旧应用程序。在这种情况下，使用以下标记启动应用程序：\n\n```\njava --add-exports java.sql.rowset/com.sun.rowset=ALL_NAMED\
  \ \\\n   -jar MyApp.jar\n```\n\n现在，假设你的应用程序使用反射访问字段或方法。反射模块是可以的，但不再能够反射地访问 Java\
  \ 平台类的私有成员。例如，某些动态生成 Java 类的库通过反射调用保护的 `ClassLoader.defineClass` 方法。如果应用程序使用此类库，添加标记\n\
  \n```\n--add-opens java.base/java.lang=ALL-NAMED\n```\n\n在添加所有这些命令行选项以让旧应用工作时，你可能会遇到地狱般的命令行。为了更好地管理多个选项，你可以将它们放在一个或多个文件中，并使用\
  \ `@` 前缀指定。例如：\n\n```\njava @options1 @options2 -jar MyProg.java\n```\n\n其中文件 `options1`\
  \ 和 `options2` 包含 `java` 命令的选项。\n\n选项文件有一些语法规则：\n\n* 使用空格、制表符或换行分隔选项。\n* 对包含空格的参数使用双引号，例如\
  \ `\"Program Files\"`。\n* 以 `\\` 结尾的行与下一行合并。\n* 反斜杠必须转义，例如 `C:\\\\Users\\\\Fred`。\n\
  * 注释行以 `#` 开头。\n\n## 传递和静态需求\n\n在第 12.4 节 中，你已经看到了 `requires` 语句的基本形式。在本节中，你将看到两种偶尔有用的变体。\n\
  \n\n\n\n在某些情况下，对于给定模块的用户来说，声明所有需要的模块可能会非常麻烦。例如，考虑 `java.desktop` 模块。它需要三个模块：`java.prefs`、`java.datatransfer`\
  \ 和 `java.xml`。`java.prefs` 模块仅在内部使用。然而，来自 `java.datatransfer` 和 `java.xml` 的类出现在公共\
  \ API 中，方法如下：\n\n```\njava.awt.datatransfer.Clipboard java.awt.Toolkit.getSystemClipboard()\n\
  java.beans.XMLDecoder(org.xml.sax.InputSource is)\n```\n\n这并不是 `java.desktop` 模块的用户应该考虑的事情。因此，`java.desktop`\
  \ 模块使用 `transitive` 修饰符声明了该需求：\n\n```\nmodule java.desktop\n{\n   requires java.prefs;\n\
  \   requires transitive java.datatransfer;\n   requires transitive java.xml;\n \
  \  . . .\n}\n```\n\n任何声明 `java.desktop` 要求的模块现在都会自动需要这两个模块。\n\n一些程序员建议，当公共 API 中使用了另一个模块的包时，应该始终使用\
  \ `requires transitive`。但这并不是 Java 语言的要求。考虑 `java.sql` 模块：\n\n```\nmodule java.sql\n\
  {\n   requires transitive java.logging;\n   . . .\n}\n```\n\n在整个 `java.sql` API\
  \ 中，只有一个地方使用了 `java.logging` 模块的包，即 `java.sql.Driver.parentLogger` 方法，它返回一个 `java.util.logging.Logger`。不将此模块需求声明为传递性的完全可以接受。那么，只有那些真正使用该方法的模块才需要声明它们需要\
  \ `java.logging`。\n\n`requires transitive` 语句的一个引人注目的用法是聚合模块（aggregator module）——一个没有包且只有传递性要求的模块。其中一个模块是\
  \ `java.se` 模块，其声明如下：\n\n```\nmodule java.se\n{\n   requires transitive java.compiler;\n\
  \   requires transitive java.datatransfer;\n   requires transitive java.desktop;\n\
  \   . . .\n   requires transitive java.sql;\n   requires transitive java.sql.rowset;\n\
  \   requires transitive java.xml;\n   requires transitive java.xml.crypto;\n}\n\
  ```\n\n对细粒度模块依赖不感兴趣的程序员可以只需要求 `java.se` 即可获得 Java SE 平台的所有模块。\n\n最后，还有一种常见的 `requires\
  \ static` 变体，它声明一个模块在编译时必须存在，但在运行时是可选的。有两种用例：\n\n1. 访问在编译时处理的并在另一个模块中声明的注解。\n2.\
  \ 如果可用，则使用另一个模块中的类，否则执行其他操作，例如：\n\n```\ntry \n{\n   new oracle.jdbc.driver.OracleDriver();\n\
  \   . . .\n} \ncatch (NoClassDefFoundError er) \n{\n   执行其他操作\n}\n```\n\n## 限定导出（Qualified\
  \ Exporting）和开启\n\n在本节中，你将看到 `exports` 和 `opens` 语句的变体，它们将范围缩小到指定的模块集合。例如，`java.base`\
  \ 模块包含一条语句\n\n```\nexports sun.net to\n  java.net.http,\n  jdk.naming.dns;\n```\n\
  \n这样的语句被称为“限定导出”（qualified export）。列出的模块可以访问导出的包，但其他模块不能。\n\n过度使用限定导出可能表明模块化结构不良。尽管如此，在对现有代码库进行模块化时可能会出现这种情况。在这里，`sun.net`\
  \ 包放置在 `java.base` 模块内部，因为那里最需要它。然而，其他几个模块也使用了该包。Java 平台设计者不想让 `java.base` 变得更大，也不想让内部\
  \ `sun.net` 包通用。在一个全新的项目中，可以设计一个更模块化的 API。\n\n同样，你可以将 `opens` 语句限制为特定的模块。例如，在第 12.7\
  \ 节 中可以使用限定 `opens` 语句，如下：\n\n```\nmodule v1ch12.openpkg\n{\n   requires com.horstmann.util;\n\
  \   opens com.horstmann.places to com.horstmann.util;\n}\n```\n\n现在 `com.horstmann.places`\
  \ 包仅对 `com.horstmann.util` 模块开启。\n\n## 服务加载（Service Loading）\n\n`ServiceLoader`\
  \ 类（参见第 6 章）提供了一种匹配服务接口与实现的一种轻量级机制。Java 平台模块系统使得这种机制更易用。\n\n这里是对服务加载的快速回顾。一个服务有一个接口和一个或多个可能的实现。这是一个接口的简单示例：\n\
  \n```\npublic interface GreeterService\n{\n   String greet(String subject);\n  \
  \ Locale getLocale();\n}\n```\n\n一个或多个模块提供实现，例如\n\n```java\npublic class FrenchGreeter\
  \ implements GreeterService\n{\n   public String greet(String subject) { return\
  \ \"Bonjour \" + subject; }\n   public Locale getLocale() { return Locale.FRENCH;\
  \ }\n}\n```\n\n服务消费者必须根据其认为合适的任何标准，从所有提供的实现中选择一个实现。\n\n```\nServiceLoader<GreeterService>\
  \ greeterLoader = ServiceLoader.load(GreeterService.class);\nGreeterService chosenGreeter;\n\
  for (GreeterService greeter : greeterLoader)\n{\n   if (. .) \n   {\n      chosenGreeter\
  \ = greeter;  \n   }\n}\n```\n\n\n\n\n```java\npackage com.horstmann.hello;\n\n\
  import java.util.*;\nimport com.horstmann.greetsvc.*;\n\npublic class HelloWorld\n\
  {\n   public static void main(String[] args)\n   {\n      ServiceLoader<GreeterService>\
  \ greeterLoader \n            = ServiceLoader.load(GreeterService.class);\n    \
  \  String desiredLanguage = args.length > 0 ? args[0] : \"de\";\n      GreeterService\
  \ chosenGreeter = null;\n      for (GreeterService greeter : greeterLoader)\n  \
  \    {\n         if (greeter.getLocale().getLanguage().equals(desiredLanguage))\n\
  \            chosenGreeter = greeter;\n      }\n      if (chosenGreeter == null)\n\
  \         System.out.println(\"No suitable greeter.\");\n      else\n         System.out.println(chosenGreeter.greet(\"\
  Modular World\"));\n   }\n}\n```\n\n模块声明需要服务模块，并声明正在使用 `GreeterService`。\n\n```java\n\
  module v1ch12.useservice \n{\n   requires com.horstmann.greetsvc;\n   uses com.horstmann.greetsvc.GreeterService;\n\
  }\n```\n\n由于 `provides` 和 `uses` 声明，消费服务的模块被允许访问模块私有的实现类。\n\n要构建并运行该程序，首先要编译服务：\n\
  \n```bash\njavac com.horstmann.greetsvc/module-info.java \\\n   com.horstmann.greetsvc/com/horstmann/greetsvc/GreeterService.java\
  \ \\\n   com.horstmann.greetsvc/com/horstmann/greetsvc/internal/*.java\n```\n\n\
  然后编译并运行消费服务的模块：\n\n```bash\njavac -p com.horstmann.greetsvc \\\n   v1ch12.useservice/com/horstmann/hello/HelloWorld.java\
  \ \\\n   v1ch12.useservice/module-info.java\njava -p com.horstmann.greetsvc:v1ch12.useservice\
  \ \\\n   -m v1ch12.useservice/com.horstmann.hello.HelloWorld\n```\n\n# 用于模块的工具\n\
  \n本节介绍了 Java 开发工具包 (JDK) 中的的 `jdeps`、`jlink` 和 `jmod` 工具。\n\n`jdeps` 工具分析给定 JAR\
  \ 文件的依赖关系。例如，你想对 JUnit 4 进行模块化。运行：\n\n```bash\njdeps -s junit-4.12.jar hamcrest-core-1.3.jar\
  \ \n```\n\n`-s` 标志生成摘要输出：\n\n```text\nhamcrest-core-1.3.jar -> java.base\njunit-4.12.jar\
  \ -> hamcrest-core-1.3.jar\njunit-4.12.jar -> java.base\njunit-4.12.jar -> java.management\n\
  ```\n\n这会告诉你模块图，如下所示所示。\n\n![.png](img/module-graph2.jpg) JUnit4 模块图\n\n如果你省略 `-s`\
  \ 标志，你将获得模块摘要，随后是包到所需的包和模块的映射。如果你添加 `-v` 标志，列表将类映射到所需的包和模块。\n\n`--generate-module-info`\
  \ 选项为每个分析的模块生成 `module-info` 文件：\n\n```bash\njdeps --generate-module-info /tmp/junit\
  \ junit-4.12.jar hamcrest-core-1.3.jar\n```\n\n还有一个选项可以生成用于描述图的“dot”语言图形化输出。假设你已安装\
  \ dot 工具，运行这些命令：\n\n```bash\njdeps -s -dotoutput /tmp/junit junit-4.12.jar hamcrest-core-1.3.jar\n\
  dot -Tpng /tmp/junit/summary.dot > /tmp/junit/summary.png\n```\n\n然后 `summary.png`\
  \ 看起来如下所示。\n\n![.png](img/summary.jpg) `jdeps` 的 Dot 输出\n\n使用 `jlink` 工具生成一个不需要独立\
  \ Java 运行时运行的应用程序。生成的镜像比整个 JDK 要小得多。你指定想要包含的模块和输出目录。\n\n```bash\njlink --module-path\
  \ com.horstmann.greet.jar:v1ch12.exportedpkg.jar:$JAVA_HOME/jmods \\\n   --add-modules\
  \ v1ch12.exportedpkg --output /tmp/hello\n```\n\n输出目录中有一个子目录 `bin`，其中包含一个 `java`\
  \ 可执行文件。如果你运行：\n\n```bash\nbin/java -m v1ch12.exportedpkg\n```\n\n则会调用模块主类的 `main`\
  \ 方法。\n\n`jlink` 的意义在于它封装了运行应用程序所需的最小模块集。你可以列出所有模块：\n\n```bash\nbin/java --list-modules\n\
  ```\n\n在此示例中，输出为：\n\n```text\nv1ch12.exportedpkg\ncom.horstmann.greet\njava.base@21\n\
  ```\n\n所有模块都包含在*运行时镜像*文件 `lib/modules` 中。在我的计算机上，该文件为 29MB，而所有 JDK 模块的运行时镜像占用 133MB。整个应用程序占用\
  \ 55MB，仅为 JDK 大小的一部分。\n\n这可以作为打包应用程序实用工具的基础。你仍然需要为应用程序生成文件集。\n\n# 附录\n\n此附录列出了所有关键字单词。\n\
  \n## Java 关键字\n\n| 关键字 | 含义 | 类型 |\n| :--- | :--- | :--- |\n| `abstract` | 抽象类或方法\
  \ | 5 |\n| `assert` | 用于定位内部错误 | 7 |\n| `boolean` | 布尔类型 | 3 |\n| `break` | 跳出 switch\
  \ 或循环 | 3 |\n| `byte` | 8 位整数 | 3 |\n| `case` | switch 的一个情况 | 3 |\n| `catch` |\
  \ try 块捕获异常的子 | 7 |\n| `char` | UTF-16 代码单元的类型 | 3 |\n| `class` | 定义类 | 4 |\n| `continue`\
  \ | 在循环末尾继续 | 3 |\n| `default` | switch 的默认分支，或接口中的默认方法 | 3 |\n| `do` | do/while\
  \ 循环的顶部 | 3 |\n| `double` | 双精度浮点类型 | 3 |\n| `else` | if 语句的 else 分句 | 3 |\n| `enum`\
  \ | 枚举类型 | 3 |\n| `exports` | 导出模块的包 | 12 |\n| `extends` | 定义类的父类，或通配符的上界 | 4 |\n\
  | `false` | 两个布尔值之一 | 3 |\n| `final` | 常量，或不可被重写的类或方法 | 5 |\n| `finally` | try 块中始终执行的部分\
  \ | 7 |\n| `float` | 单精度浮点类型 | 3 |\n| `for` | 一种循环类型 | 3 |\n| `if` | 条件语句 | 3 |\n\
  | `implements` | 定义类实现的接口 | 6 |\n| `import` | 导入包 | 4 |\n| `instanceof` | 测试对象是否是某个类的实例\
  \ | 5 |\n| `int` | 32 位整数类型 | 3 |\n| `interface` | 一个类可以实现方法的抽象类型 | 6 |\n| `long`\
  \ | 64 位长整型类型 | 3 |\n\n\n\n\n\n| 关键字 | 说明 | 类型 | 页码 |\n| :--- | :--- | :--- | :---\
  \ |\n| `native` | 由主机系统实现的方法 | 关键字 | 13 (第二卷) |\n| `new` | 分配一个新对象或数组 | 关键字 | 3\
  \ |\n| `non-sealed` | 密封类型的子类型，可以形成任意子类型 | 关键字 | 5 |\n| `null` | 空引用 | 字面量 | 3 |\n\
  | `module` | 声明一个模块 | 受限制的关键字 | 12 |\n| `open` | 修改 `module` 声明 | 受限制的关键字 | 12 |\n\
  | `opens` | 打开开放模块的包 | 受限制的关键字 | 12 |\n| `package` | 类的包 | 关键字 | 4 |\n| `permits`\
  \ | 引入密封类型允许的子类型列表 | 受限制的标识符 | 3 |\n| `private` | 仅允许此类类方法访问的特性 | 关键字 | 4 |\n| `protected`\
  \ | 仅允许此类类、其子类以及同包中其他类的方法访问的特性 | 关键字 | 5 |\n| `provides` | 表示模块使用某种服务 | 受限制的关键字\
  \ | 12 |\n| `public` | 所有类方法都可以访问的特性 | 关键字 | 4 |\n| `record` | 声明一个具有一组最终实例变量的类\
  \ | 受限制的标识符 | 4 |\n| `return` | 从方法返回 | 关键字 | 3 |\n| `sealed` | 具有受控的直接子类型的类型 |\
  \ 受限制的标识符 | 5 |\n| `short` | 16 位整数类型 | 关键字 | 3 |\n| `static` | 属于类或接口特有的特性，而不属于类的实例\
  \ | 关键字 | 3, 6 |\n| `strictfp` | 使用严格的规则进行浮点数计算（已废弃） | 关键字 | 2 |\n| `super` | 超类对象或构造函数，或者通配符中的下界\
  \ | 关键字 | 5 |\n| `switch` | 选择语句或表达式 | 关键字 | 3 |\n| `synchronized` | 对线程原子性的方法或代码块\
  \ | 关键字 | 12 |\n| `this` | 方法的隐式参数，或此类的构造函数 | 关键字 | 4 |\n| `throw` | 抛出异常 | 关键字\
  \ | 7 |\n| `throws` | 方法可能抛出的异常 | 关键字 | 7 |\n| `to` | `exports` 或 `opens` 声明的一部分\
  \ | 受限制的关键字 | 12 |\n| `transient` | 标记不应持久化的数据 | 关键字 | 2 (第二卷) |\n| `transitive`\
  \ | 修改 `requires` 声明 | 受限制的关键字 | 12 |\n| `true` | 两个布尔值之一 | 字面量 | 3 |\n| `try` |\
  \ 捕获异常的代码块 | 关键字 | 7 |\n| `uses` | 表示模块使用某种服务 | 受限制的关键字 | 12 |\n| `var` | 声明一个类型可推断的变量\
  \ | 受限制的标识符 | 3 |\n| `void` | 表示没有返回值的方法 | 关键字 | 3 |\n| `volatile` | 确保多个线程能够一致地访问字段\
  \ | 关键字 | 12 |\n| `when` | 引入模式的守卫语句 | 受限制的关键字 | 5 |\n| `while` | 循环 | 关键字 | 3 |\n\
  | `with` | 在 `provides` 语句中定义服务类 | 受限制的关键字 | 12 |\n| `yield` | 返回 `switch` 表达式的值\
  \ | 受限制的标识符 | 3 |\n| `_` (下划线) | 未命变量或模式（预览特性） | 关键字 | 5 |\n\n"
