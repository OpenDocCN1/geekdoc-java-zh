  \         // 或者尝试虚拟线程\n         // ExecutorService executor = Executors.newVirtualThreadPerTaskExecutor();\n\
  \         Instant startTime = Instant.now();\n         List<Future<Long>> results\
  \ = executor.invokeAll(tasks);\n         Instant endTime = Instant.now();\n    \
