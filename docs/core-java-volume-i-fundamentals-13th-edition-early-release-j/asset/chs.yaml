  \ `size` 方法授予排他访问。\n\n所有线程都被阻塞可能是，因为每个线程都在等待资金。这种情况被称为 `deadlock`。在我们的程序中，由于一个简单原因，不会发生死锁。总余额始终保持在\
  \ $100,000。没有任何账户出现过负余额。（再次，按下 `Ctrl+C` 终止程序。）你可能还会注意到程序运行得慢一点——这就是为同步机制涉及的额外账记录工作付出的代价。\n\
