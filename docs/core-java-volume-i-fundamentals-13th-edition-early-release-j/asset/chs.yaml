  \ int aPartNumber)\n{\n      description = aDescription;\n      partNumber = aPartNumber;\n\
  \   }\n\n   /**\n    * 获取项目的描述。\n    * @return 描述\n    */\n   public String getDescription()\n\
  \   {\n      return description;\n   }\n\n   /**\n    * 获取项目的部件编号。\n    * @return\
