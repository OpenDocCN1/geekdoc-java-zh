  \            System.out.println(\"Enter class name (e.g., java.util.Collections):\
  \ \");\n            name = in.next();\n         }\n      }\n\n      try\n      {\n\
  \         // 打印类和公共方法的泛型信息\n         Class<?> cl = Class.forName(name);\n      \
