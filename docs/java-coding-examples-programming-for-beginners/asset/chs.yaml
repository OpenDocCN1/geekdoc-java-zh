  14/8/20Thu Aug 14 21:29:07 GMT 202021:29:7\n```\n\n## 计算圆面积的 Java 程序\n此程序读取圆半径并计算圆面积。\n\
  \n### 程序\n```java\nimport java.util.Scanner;\npublic class AreaCircle {\n    public\
  \ static void main(String[] args) {\n        double radius;\n        Scanner sc=new\
  \ Scanner(System.in);\n        //输入圆半径\n        System.out.print(\"Enter the Radius\
  \ of Circle : \");\n        radius=sc.nextDouble();\n        //圆面积是 pi * 半径平方\n\
  \        double area=3.14*radius*radius;\n        System.out.print(\"Area of Circle\
  \ : \"+area);\n    }\n}\n```\n\n### 输出\n```\nEnter the Radius of Circle :12.5\n\
  Area of Circle :490.625\n```\n\n## 十进制转二进制的 Java 程序\n给定一个整数（Decimal），使用 Java 程序将其转换为二进制。\n\
  \n### 程序\n```java\nimport java.util.Scanner;\nclass DecimalToBinary{\n    public\
  \ static void main(String[] args) {\n        //使用 Scanner 类获取输入\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.println(\"Enter Decimal Number\
  \ :\");\n        //接受输入\n        int input_decimal_num = sc.nextInt();\n       \
  \ String binary_string = \" \";\n        //循环直到 input_decimal_num > 0\n        while(input_decimal_num\
  \ > 0){\n            //余数加入字符串变量\n            binary_string = (input_decimal_num%2)\
  \ + binary_string;\n            input_decimal_num = input_decimal_num/2;\n     \
  \   }\n        // 显示最终结果\n        System.out.println(\"Conversion of decimal is\
  \ : + binary_string);\n    }\n}\n```\n\n### 输出\n```\nEnter Decimal Number :30\n\
  Conversion of decimal is :11110\n```\n\n"
