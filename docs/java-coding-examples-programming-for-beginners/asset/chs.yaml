- "# JAVA 编程示例：初学者编程指南\n\n\n\n![](img/rsrcZA.jpg)\n\n\n\n\n\n\n## 打印 'Hello world'\
  \ 的 Java 程序\n\n### 语法\n```\njavac HelloWorld.java\n```\n\n### 执行/运行 Java 程序\n当你编译了\
  \ Java 程序，如果编译成功，你就可以运行该 Java 程序来生成输出。\n\n### 程序\n```java\npublic class HelloWorld{\n\
  \    public static void main(String []args){\n        //打印消息\n        System.out.println(\"\
  Hello World!\");\n    }\n}\n```\n\n### 输出\n```\nHello World!\n```\n\n## 在 Java 中打印不同类型的值\n\
  我们将在此程序中声明并描述一些不同类型的变量，然后使用 `System.out.println()` 方法打印它们。\n\n### 程序\n```java\n\
  class j2{\n    public static void main(String args[]) {\n        int num;\n    \
  \    float b;\n        char c;\n        String s;\n        //整数\n        num = 100;\n\
  \        //浮点数\n        b = 1.234f;\n        //字符\n        c = 'A';\n        //字符串\n\
  \        s = \"Hello Java\";\n        System.out.println(\"Value of num: \"+num);\n\
  \        System.out.println(\"Value of b: \"+b);\n        System.out.println(\"\
  Value of c: \"+c);\n        System.out.println(\"Value of s: \"+s);\n    }\n}\n\
  ```\n\n### 输出\n```\nValue of num: 100\nValue of b: 1.234\nValue of c: A\nValue of\
  \ s: Hello Java\n```\n\n## 在 Java 中读取并打印整数值\n在这里我们将学习如何从用户获取整数输入并将其打印到屏幕上。为了获取整数输入，我们使用\
  \ `Scanner` 类，为此我们必须在 Java 程序中包含 `java.util.*` 包。\n\n### 程序\n```java\nimport java.util.*;\n\
  class j3{\n    public static void main(String args[]) {\n        int a;\n      \
  \  //声明 Scanner 类对象\n        Scanner buf=new Scanner(System.in);\n        System.out.print(\"\
  Enter value of a :\");\n        /*Scanner 类的 nextInt() 方法*/\n        a=buf.nextInt();\n\
  \        System.out.println(\"Value of a:\" +a);\n    }\n}\n```\n\n### 输出\n```\n\
  Enter value of a :120\nValue of a:120\n```\n\n## 计算总和和平均值的 Java 程序\n给出两个整数（输入），我们需要计算它们的总和和平均值。\n\
  \n### 程序\n```java\n// 在 Java 中寻找两个数字的总和和平均值\nimport java.util.*;\npublic class Numbers\
  \ {\n    public static void main(String args[]) {\n        int a, b, sum;\n    \
  \    float avg;\n        Scanner buf = new Scanner(System.in);\n        System.out.print(\"\
  Enter first number : \");\n        a = buf.nextInt();\n        System.out.print(\"\
  Enter second number : \");\n        b = buf.nextInt();\n        /*计算总和和平均值*/\n \
  \       sum = a + b;\n        avg = (float)((a + b) / 2);\n        System.out.print(\"\
  Sum : \" + sum + \"\\nAverage : \" + avg);\n    }\n}\n```\n\n### 输出\n```\nEnter\
  \ first number : 100\nEnter second number : 200\nSum : 300\nAverage : 150.0\n```\n\
  \n## 打印圣诞树的 Java 程序\n示例：\n*****************************************************************************************************************************************\n\
  \n### 程序\n```java\npublic class ChristmasTree{\n    public static final int SEGMENTS\
  \ = 4;\n    public static final int HEIGHT = 4;\n    public static void main(String[]\
  \ args) {\n        makeTree();\n    }\n    public static void makeTree() {\n   \
  \     int maxStars = 2*HEIGHT+2*SEGMENTS-3;\n        String maxStr = \"\";\n   \
  \     for (int len = 0; len < maxStars; len++) {\n            maxStr+=\" \";\n \
  \       }\n        for (int i = 1; i <= SEGMENTS; i++) {\n            for (int line\
  \ = 1; line <= HEIGHT; line++) {\n                String starStr = \"\";\n     \
  \           for (int j = 1; j <= 2*line+2*i-3; j++) {\n                    starStr+=\"\
  *\";\n                }\n                for (int space=0; space <= maxStars-(HEIGHT+i);\
  \ space++) {\n                    starStr += \" \";\n                }\n       \
  \         System.out.println(starStr);\n            }\n        }\n        for (int\
  \ i = 0; i <= maxStars/2; i++) {\n            System.out.print(\" \");\n       \
  \ }\n        System.out.print(\"\\n\");\n        for (int i = 0; i <= maxStars/2;\
  \ i++) {\n            System.out.print(\" \");\n        }\n        System.out.print(\"\
  \\n\");\n        for (int i = 0; i <= maxStars/3; i++) {\n            System.out.print(\"\
  \ \");\n        }\n        System.out.print(\"*******\\n\");\n    }\n}\n```\n\n\
  ## 计算所有数字之和的 Java 程序\n提供一个数字，使用 Java 程序找到它的数字之和。\n示例 1：\n输入：852\n输出：15\n示例 2：\n\
  输入：25688\n输出：35\n\n### 程序\n```java\nimport java.util.Scanner;\nclass AddDigits{\n\
  \    public static void main(String args[]){\n        //初始化对象。\n        int num,\
  \ rem=0, sum=0, temp;\n        Scanner scan = new Scanner(System.in);\n        //在此输入数字。\n\
  \        System.out.print(\"Enter the Number : \");\n        num = scan.nextInt();\n\
  \        // 存储数字。\n        temp = num;\n        while(num>0){\n            rem =\
  \ num%10;\n            sum = sum+rem;\n            num = num/10;\n        }\n  \
  \      System.out.print(\"Sum of Digits of \" +temp+\" is : \"+sum);\n    }\n}\n\
  ```\n\n### 输出\n```\nFirst run:\nEnter the Number : 582\nSum of Digits of 582 is\
  \ : 15\nSecond run:\nEnter the Number : 25688\nSum of Digits of 25688 is : 35\n\
  ```\n\n## 计算复利的 Java 程序\n给定本金、利率和时间，使用 Java 程序计算复利。\n示例：\nPrincipal : 5000\nRate\
  \ : 5\nTime : 33\nAmount : 5788.125000001\nCompound Interest : 788.125000009\n\n\
  ### 程序\n```java\nimport java.util.Scanner;\nclass CompoundInterest{\n    public\
  \ static void main(String args[]) {\n        //在此声明并初始化。\n        double A=0,Pri,Rate,t=1,CI;\n\
  \        // 创建对象。\n        Scanner S=new Scanner(System.in);\n        //在此输入本金、利率、时间\n\
  \        System.out.print(\"Enter Principal : \");\n        Pri=S.nextFloat();\n\
  \        System.out.print(\"Enter Rate : \");\n        Rate=S.nextFloat();\n   \
  \     System.out.print(\"Enter Time : \");\n        Time=S.nextFloat();\n      \
  \  Rate=(1 + Rate/100);\n        for(int i=0;i<Time;i++)\n            t*=Rate;\n\
  \        A=Pri*t;\n        System.out.print(\"Amount : \" +A);\n        CI=A-Pri;\n\
  \        System.out.print(\"\\nCompound Interest : \"+CI);\n    }\n}\n```\n\n###\
  \ 输出\n```\nFirst run:\nPrincipal : 5000\nRate : 5\nTime : 3\nAmount : 5788.125000001\n\
  Compound Interest : 788.125000009\nSecond run:\nPrincipal : 10000\nRate : 20\nTime\
  \ : 5\nAmount : 24883.19999999997\nCompound Interest : 14883.19999999997\n```\n\n\
  ## 寻找最大数字的 Java 程序\n程序从键盘读取（三个整数），并选择最大的数字。\n\n### 程序\n```java\n// 在三个数字中寻找最大数字的\
  \ Java 程序。\nimport java.util.*;\nclass LargestFrom3{\n    public static void main(String\
  \ []s){\n        int a,b,c,largest;\n        //Scanner 类读取值\n        Scanner sc=new\
  \ Scanner(System.in);\n        System.out.print(\"Enter first number:\");\n    \
  \    a=sc.nextInt();\n        System.out.print(\"Enter second number:\");\n    \
  \    b=sc.nextInt();\n        System.out.print(\"Enter third number:\");\n     \
  \   c=sc.nextInt();\n        if ( a>b && a>c )\n            largest=a;\n       \
  \ else if ( b>a && b>c )\n            largest=b;\n        else\n            largest=c;\n\
  \        System.out.println(\"Largest Number is : \"+largest);\n    }\n}\n```\n\n\
  ### 输出\n```\nCompile : javac LargestFrom3.java\nRun : java LargestFrom3\n```\n\n\
  ### 输出\n```\nEnter first number:45\nEnter second number:56\nEnter third number:67\n\
  Largest Number is : 67\n```\n\n## 运行一个应用程序\n使用 Java 程序打开应用程序（Notepad, Calculator）。我们使用\
  \ `Runtime.getRuntime()` 和 `exec()` 方法来打开。\n\n### 程序\n```java\n// 运行应用程序的程序。\nimport\
  \ java.util.*;\nclass OpenNotepad{\n    public static void main(String args){\n\
  \        Runtime app=Runtime.getRuntime();\n        try{\n            //打开 notepad\n\
  \            app.exec(\"notepad\");\n            //打开 calculator\n            app.exec(\"\
  calc\");\n        } catch (Exception Ex){\n            System.out.println(\"Error:\
  \ \" + Ex);\n        }\n    }\n}\n```\n\n### 输出\n```\nNotepad and Calculator will\
  \ be opened.\n```\n\n## 斐波那契数列\n斐波那契数列是一个每一项都是前两项之和的数列。\n\n### 程序\n```java\n/* 打印斐波那契数列的程序。*/\n\
  import java.util.*;\nclass Fibonacci {\n    public static void main(String[] args)\
  \ {\n        int SeriesNum;\n        Scanner sc=new Scanner(System.in);\n      \
  \  System.out.print(\"Enter the length of fibonacci series : \");\n        SeriesNum=sc.nextInt();\n\
  \        int[] num = new int[SeriesNum];\n        num[0] = 0;\n        num[1] =\
  \ 1;\n        // 应该是最后两项之和\n        for(int i=2; i < SeriesNum; i++)\n         \
  \   num[i] = num[i-1] + num[i-2];\n        System.out.println(\"fibonacci : \");\n\
  \        for(int i=0; i<SeriesNum; i++)\n            System.out.print(num[i] + \"\
  \ \");\n    }\n}\n```\n\n### 输出\n```\nEnter the length of fibonacci series :10\n\
  fibonacci :0 1 2 3 5 8 13 21 34 55 \n```\n\n## 使用 for 循环打印 1 到 N 的数字\n### 程序\n```java\n\
  import java.util.Scanner;\nclass Print_1_To_N_UsingFor{\n    public static void\
  \ main(String[] args) {\n        //创建对象\n        Scanner scanner = new Scanner(System.in);\n\
  \        //输入\"n\"。\n        System.out.print(\"Enter the value n : \");\n     \
  \   //读取值。\n        int n = scanner.nextInt();\n        System.out.println(\"Numbers\
  \ are : \");\n        for(int i=1; i<=n; i++)\n            System.out.println(i);\n\
  \    }\n}\n```\n\n### 输出\n```\nEnter the value n :15\nNumbers are :12345678910111213415\n\
  ```\n\n## 使用 while 循环打印 1 到 N 的数字\n### 程序\n```java\nimport java.util.Scanner;\n\
  class Print_1_To_N_UsingWhile{\n    public static void main(String[] args) {\n \
  \       //循环计数器初始化\n        int i =1;\n        //创建 scanner 类对象\n        Scanner\
  \ Sc = new Scanner(System.in);\n        //输入\"n \"\n        System.out.print(\"\
  Enter the value n : \");\n        //读取值。\n        int n = Sc.nextInt();\n      \
  \  System.out.println(\"Numbers are : \");\n        while(i<=n) {\n            System.out.println(i);\n\
  \            i++;\n        }\n    }\n}\n```\n\n### 输出\n```\nEnter the value n :15\n\
  Numbers are :12345678910111213415\n```\n\n## 一维数组和二维数组的加法\n在 JAVA 程序中有两个程序：两个一维数组加法，两个二维数组加法。\n\
  \n### 1) 二维数组的加法\n```java\nclass AddTwoArray{\n    public static void main(String[]\
  \ args) {\n        //数组的声明和初始化\n        int a[] = {1,2,3,4,5};\n        int b[]\
  \ = {6,7,8,9,10};\n        //实例化第三个数组来存储结果\n        int c[] = new int[5];\n    \
  \    for(int i=0; i<5; i++) {\n            //两个数组相加并将结果存储在第三个数组中\n            c[i]\
  \ = a[i] + b[i];\n            //显示结果\n            System.out.println(\"sum of \"\
  +i +\"index\" +\" \" + c[i]);\n        }\n    }\n}\n```\n### 输出\n```\nEnter sum\
  \ of 0index 7\nEnter sum of 1index 9\nEnter sum of 2index 11\nEnter sum of 3index\
  \ 13\nEnter sum of 4index 15\n```\n\n### 2) 两个二维数组的加法\n```java\nclass AddTwoArrayOf2DClass{\n\
  \    public static void main(String[] args){\n        //数组的声明和初始化\n        int a[][]\
  \ = {{1,2,3},{4,5,6}};\n        int b[][] = {{7,8,9},{10,11,12}};\n        //实例化第三个数组来存储结果\n\
  \        int c[][] = new int[2][3];\n        for(int i=0; i<2; i++){\n         \
  \   for(int j=0; j<3; j++){\n                //两个数组相加并将结果存储在第三个数组中\n           \
  \     c[i][j] = a[i][j] + b[i][j];\n                //显示结果\n                System.out.println(\"\
  sum of \"+i +\"index\" + j +\" \" + c[i][j]);\n            }\n        }\n    }\n\
  }\n```\n### 输出\n```\nsum of 0index0 8\nsum of 0index1 10\nsum of 0index2 12\nsum\
  \ of 1index0 14\nsum of 1index1 16\nsum of 1index2 18\n```\n\n## 逐行读取文件的 Java 程序\n\
  给定一个文件，使用 Java 程序逐行读取其内容。我们使用名为 \"B.txt\" 的文件，该文件位于 \"F:\" 盘，因此文件路径为 \"F:\\B.txt,\"\
  ，文件内容为：\nline 1\nline 2\nline 3\nline 4\n\n### 程序\n```java\nimport java.io.FileInputStream;\n\
  import java.io.IOException;\nimport java.util.Scanner;\nclass ReadLineByLine{\n\
  \    public static void main(String[] args){\n        //创建 scanner 对象。\n       \
  \ Scanner Sc=new Scanner(System.in);\n        //输入文件名。\n        System.out.print(\"\
  Enter the file name:\");\n        String filename=Sc.next();\n        Scanner Sc1=null;\n\
  \        FileInputStream fis=null;\n        try {\n            fis=new FileInputStream(filename);\n\
  \            Sc1=new Scanner(fis);\n            //读取数据到结束\n            while(Sc1.hasNext()){\n\
  \                String data=Sc1.nextLine();\n                //打印数据。\n        \
  \        System.out.print(\"The file data is : +data);\n            }\n        }\
  \ catch(IOException e) {\n            System.out.println(e);\n        }\n    }\n\
  }\n```\n\n### 输出\n```\nEnter the file name:F:/B.txt\nThe file data is :line 1\n\
  The file data is :line 2\nThe file data is :line 3\nThe file data is :line 4\n```\n\
