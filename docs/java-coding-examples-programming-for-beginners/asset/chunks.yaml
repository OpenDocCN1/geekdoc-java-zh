    \ {\n            System.out.print(\" \");\n        }\n        System.out.print(\"\
    *******\\n\");\n    }\n}\n```\n\n## 计算所有数字之和的 Java 程序\n提供一个数字，使用 Java 程序找到它的数字之和。\n\
    示例 1：\n输入：852\n输出：15\n示例 2：\n输入：25688\n输出：35\n\n### 程序\n```java\nimport java.util.Scanner;\n\
    class AddDigits{\n    public static void main(String args[]){\n        //初始化对象。\n\
    \        int num, rem=0, sum=0, temp;\n        Scanner scan = new Scanner(System.in);\n\
    \        //在此输入数字。\n        System.out.print(\"Enter the Number : \");\n     \
    \   num = scan.nextInt();\n        // 存储数字。\n        temp = num;\n        while(num>0){\n\
    \            rem = num%10;\n            sum = sum+rem;\n            num = num/10;\n\
    \        }\n        System.out.print(\"Sum of Digits of \" +temp+\" is : \"+sum);\n\
    \    }\n}\n```\n\n### 输出\n```\nFirst run:\nEnter the Number : 582\nSum of Digits\
    \ of 582 is : 15\nSecond run:\nEnter the Number : 25688\nSum of Digits of 25688\
    \ is : 35\n```\n\n## 计算复利的 Java 程序\n给定本金、利率和时间，使用 Java 程序计算复利。\n示例：\nPrincipal\
    \ : 5000\nRate : 5\nTime : 33\nAmount : 5788.125000001\nCompound Interest : 788.125000009\n\
    \n### 程序\n```java\nimport java.util.Scanner;\nclass CompoundInterest{\n    public\
    \ static void main(String args[]) {\n        //在此声明并初始化。\n        double A=0,Pri,Rate,t=1,CI;\n\
    \        // 创建对象。\n        Scanner S=new Scanner(System.in);\n        //在此输入本金、利率、时间\n\
    \        System.out.print(\"Enter Principal : \");\n        Pri=S.nextFloat();\n\
    \        System.out.print(\"Enter Rate : \");\n        Rate=S.nextFloat();\n \
    \       System.out.print(\"Enter Time : \");\n        Time=S.nextFloat();\n  \
    \      Rate=(1 + Rate/100);\n        for(int i=0;i<Time;i++)\n            t*=Rate;\n\
    \        A=Pri*t;\n        System.out.print(\"Amount : \" +A);\n        CI=A-Pri;\n\
    \        System.out.print(\"\\nCompound Interest : \"+CI);\n    }\n}\n```\n\n\
    ### 输出\n```\nFirst run:\nPrincipal : 5000\nRate : 5\nTime : 3\nAmount : 5788.125000001\n\
    Compound Interest : 788.125000009\nSecond run:\nPrincipal : 10000\nRate : 20\n\
    Time : 5\nAmount : 24883.19999999997\nCompound Interest : 14883.19999999997\n\
    ```\n\n## 寻找最大数字的 Java 程序\n程序从键盘读取（三个整数），并选择最大的数字。\n\n### 程序\n```java\n// 在三个数字中寻找最大数字的\
