    \n## Java program to print 'Hello world'\n\n### SYNTAX\n```\njavac HelloWorld.java\n\
    ```\n\n### Executing/Running java program\nWhen you have compiled the Java program,\
    \ and if it has been successfully compiled, you can run the Java program to generate\
    \ the output.\n\n### PROGRAM\n```java\npublic class HelloWorld{\n    public static\
    \ void main(String []args){\n        //printing the message\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\n### Output\n```\nHello World!\n```\n\n## Print\
    \ different type of values in Java\nWe will declare and describe some of the different\
    \ types of variables in this program, and then print them using `System.out.println()`\
    \ method.\n\n### PROGRAM\n```java\nclass j2{\n    public static void main(String\
    \ args[]) {\n        int num;\n        float b;\n        char c;\n        String\
    \ s;\n        //integer\n        num = 100;\n        //float\n        b = 1.234f;\n\
    \        //character\n        c = 'A';\n        //string\n        s = \"Hello\
    \ Java\";\n        System.out.println(\"Value of num: \"+num);\n        System.out.println(\"\
    Value of b: \"+b);\n        System.out.println(\"Value of c: \"+c);\n        System.out.println(\"\
    Value of s: \"+s);\n    }\n}\n```\n\n### Output\n```\nValue of num: 100\nValue\
    \ of b: 1.234\nValue of c: A\nValue of s: Hello Java\n```\n\n## Read and print\
    \ an integer value in Java\nHere we will learn how to take an integer input from\
    \ the user and print it on the screen, to take the input of an integer value-we\
    \ use `Scanner` class, for this we must include `java.util.*` package in our Java\
    \ program.\n\n### PROGRAM\n```java\nimport java.util.*;\nclass j3{\n    public\
    \ static void main(String args[]) {\n        int a;\n        //declare object\
    \ of Scanner Class\n        Scanner buf=new Scanner(System.in);\n        System.out.print(\"\
    Enter value of a :\");\n        /*nextInt() method of Scanner class*/\n      \
    \  a=buf.nextInt();\n        System.out.println(\"Value of a:\" +a);\n    }\n\
    }\n```\n\n### Output\n```\nEnter value of a :120\nValue of a:120\n```\n\n## Java\
    \ program to find sum and average\nTwo integer numbers are given (input), and\
    \ we have to calculate their SUM and AVERAGE.\n\n### PROGRAM\n```java\n// Find\
    \ sum and average of two numbers in Java\nimport java.util.*;\npublic class Numbers\
    \ {\n    public static void main(String args[]) {\n        int a, b, sum;\n  \
    \      float avg;\n        Scanner buf = new Scanner(System.in);\n        System.out.print(\"\
    Enter first number : \");\n        a = buf.nextInt();\n        System.out.print(\"\
    Enter second number : \");\n        b = buf.nextInt();\n        /*Calculate sum\
    \ and average*/\n        sum = a + b;\n        avg = (float)((a + b) / 2);\n \
    \       System.out.print(\"Sum : \" + sum + \"\\nAverage : \" + avg);\n    }\n\
    }\n```\n\n### Output\n```\nEnter first number : 100\nEnter second number : 200\n\
    Sum : 300\nAverage : 150.0\n```\n\n## Java program to print Christmas tree\nExample:\n\
    *****************************************************************************************************************************************\n\
    \n### PROGRAM\n```java\npublic class ChristmasTree{\n    public static final int\
    \ SEGMENTS = 4;\n    public static final int HEIGHT = 4;\n    public static void\
    \ main(String[] args) {\n        makeTree();\n    }\n    public static void makeTree()\
    \ {\n        int maxStars = 2*HEIGHT+2*SEGMENTS-3;\n        String maxStr = \"\
    \";\n        for (int len=0; len < maxStars; len++) {\n            maxStr+=\"\
    \ \";\n        }\n        for (int i=1; i <= SEGMENTS; i++) {\n            for\
    \ (int line=1; line <= HEIGHT; line++) {\n                String starStr = \"\"\
    ;\n                for (int j=1; j <= 2*line+2*i-3; j++) {\n                 \
    \   starStr+=\"*\";\n                }\n                for (int space=0; space\
    \ <= maxStars-(HEIGHT+i); space++) {\n                    starStr = \" \" + starStr;\n\
    \                }\n                System.out.println(starStr);\n           \
    \ }\n        }\n        for (int i=0; i <= maxStars/2; i++) {\n            System.out.print(\"\
    \ \");\n        }\n        System.out.print(\"\\n\");\n        for (int i=0; i\
    \ <= maxStars/2; i++) {\n            System.out.print(\" \");\n        }\n   \
    \     System.out.print(\"\\n\");\n        for (int i=0; i <= maxStars/3; i++)\
    \ {\n            System.out.print(\" \");\n        }\n        System.out.print(\"\
    *******\\n\");\n    }\n}\n```\n\n## Java program to find sum of all digits\nProvided\
    \ a number to use java program to find sum of its digits.\nExample 1:\nInput:\
    \ 852\nOutput:Sum of all digits: 15\nExample 2:\nInput: 25688\nOutput:Sum of all\
    \ digits: 35\n\n### PROGRAM\n```java\nimport java.util.Scanner;\nclass AddDigits{\n\
    \    public static void main(String args[]){\n        // initializing and declaring\
    \ the objects.\n        int num, rem=0, sum=0, temp;\n        Scanner scan = new\
    \ Scanner(System.in);\n        // enter number here.\n        System.out.print(\"\
    Enter the Number : \");\n        num = scan.nextInt();\n        // temp is to\
    \ store number.\n        temp = num;\n        while(num>0){\n            rem =\
    \ num%10;\n            sum = sum+rem;\n            num = num/10;\n        }\n\
    \        System.out.print(\"Sum of Digits of \" +temp+ \" is : +sum);\n    }\n\
    }\n```\n\n### Output\n```\nFirst run:\nEnter the Number : 582\nSum of Digits of\
    \ 582 is : 15\nSecond run:\nEnter the Number : 25688\nSum of Digits of 25688 is\
    \ : 35\n```\n\n## Java program to calculate compound interest\nGiven the principle,\
    \ rate and time, and using java program we have to find compound interest.\nExample:\n\
    Enter Principal : 5000\nEnter Rate : 5\nEnter Time : 3\nAmount : 5788.1250000001\n\
    Compound Interest : 788.1250000009\n\n### PROGRAM\n```java\nimport java.util.Scanner;\n\
    class CompoundInterest{\n    public static void main(String args[]) {\n      \
    \  // declare and initialize here.\n        double A=0,Pri,Rate,Time,t=1,CI;\n\
    \        // create object.\n        Scanner S=new Scanner(System.in);\n      \
    \  // enter principal, rate, time here\n        System.out.print(\"Enter Principal\
    \ : \");\n        Pri=S.nextFloat();\n        System.out.print(\"Enter Rate :\
    \ \");\n        Rate=S.nextFloat();\n        System.out.print(\"Enter Time : \"\
    );\n        Time=S.nextFloat();\n        Rate=(1 + Rate/100);\n        for(int\
    \ i=0;i<Time;i++)\n            t*=Rate;\n        A=Pri*t;\n        System.out.print(\"\
    Amount : \" +A);\n        CI=A-Pri;\n        System.out.print(\"\\nCompound Interest\
    \ : +CI);\n    }\n}\n```\n\n### Output\n```\nFirst run:\nEnter Principal : 5000\n\
    Enter Rate : 5\nEnter Time : 3\nAmount : 5788.1250000001\nCompound Interest :\
    \ 788.1250000009\nSecond run:\nEnter Principal : 10000\nEnter Rate : 20\nEnter\
    \ Time : 5\nAmount : 24883.19999999997\nCompound Interest : 14883.19999999997\n\
    ```\n\n## Java program to find largest number\nThe program reads from the keyboard\
    \ (three integer numbers), and selects the largest number.\n\n### PROGRAM\n```java\n\
    // Java program to find largest number among three numbers.\nimport java.util.*;\n\
    class LargestFrom3{\n    public static void main(String []s){\n        int a,b,c,largest;\n\
    \        //Scanner class to read value\n        Scanner sc=new Scanner(System.in);\n\
    \        System.out.print(\"Enter first number:\");\n        a=sc.nextInt();\n\
    \        System.out.print(\"Enter second number:\");\n        b=sc.nextInt();\n\
    \        System.out.print(\"Enter third number:\");\n        c=sc.nextInt();\n\
    \        if ( a>b && a>c )\n            largest=a;\n        else if ( b>a && b>c\
    \ )\n            largest=b;\n        else\n            largest=c;\n        System.out.println(\"\
    Largest Number is : \"+largest);\n    }\n}\n```\n\n### Output\n```\nCompile :\
    \ javac LargestFrom3.java\nRun : java LargestFrom3\n```\n\n### Output\n```\nEnter\
    \ first number:45\nEnter second number:56\nEnter third number:67\nLargest Number\
    \ is : 67\n```\n\n## Java program to run an application\nUsing Java program this\
    \ program can open (run) applications (Notepad, Calculator). We use instance of\
    \ `Runtime.getRuntime()` and method `exec()` to open / run application.\n\n###\
    \ PROGRAM\n```java\n// Java program to run an application.\nimport java.util.*;\n\
    class OpenNotepad{\n    public static void main(String[] args){\n        Runtime\
    \ app=Runtime.getRuntime();\n        try{\n            //open notepad\n      \
    \      app.exec(\"notepad\");\n            //open calculator\n            app.exec(\"\
    calc\");\n        } catch (Exception Ex){\n            System.out.println(\"Error:\
    \ \" + Ex.toString());\n        }\n    }\n}\n```\n\n### OUTPUT\n```\nNotepad and\
    \ Calculator will be opened.\n```\n\n## Java program to print Fibonacci Series\n\
    Fibonacci Series is a series where the term is the sum of two preceding terms.\n\
    \n### PROGRAM\n```java\n/*Java program to print Fibonacci.*/\nimport java.util.*;\n\
    class Fibonacci {\n    public static void main(String[] args) {\n        SeriesNum;\n\
    \        Scanner sc=new Scanner(System.in);\n        System.out.print(\"Enter\
    \ the length of fibonacci series : \");\n        SeriesNum=sc.nextInt();\n   \
    \     int[] num = new int[SeriesNum];\n        num[0] = 0;\n        num[1] = 1;\n\
    \        //number should be sum of last two\n        for(int i=2; i < SeriesNum;\
    \ i++)\n            num[i] = num[i-1] + num[i-2];\n        System.out.println(\"\
    fibonacci : \");\n        for(int i=0; i<SeriesNum; i++)\n            System.out.print(num[i]\
    \ + \" \");\n    }\n}\n```\n\n### OUTPUT\n```\nEnter the length of fibonacci series\
    \ :10\nfibonacci :0 1 2 3 5 8 13 21 34 55 \n```\n\n## Using for loop to print\
    \ numbers from 1 to N\n### PROGRAM\n```java\nimport java.util.Scanner;\nclass\
    \ Print_1_To_N_UsingFor{\n    public static void main(String[] args) {\n     \
    \   //create object of class\n        Scanner scanner = new Scanner(System.in);\n\
    \        // enter the value of \"n\".\n        System.out.print(\"Enter the value\
    \ n : \");\n        // read the value.\n        int n = scanner.nextInt();\n \
    \       System.out.println(\"Numbers are : \");\n        for(int i=1; i<=n; i++)\n\
    \            System.out.println(i);\n    }\n}\n```\n\n### Output\n```\nEnter the\
    \ value n :15\nNumbers are :12345678910111213415\n```\n\n## Using while loop to\
    \ print numbers from 1 to N\n### PROGRAM\n```java\nimport java.util.Scanner;\n\
    class Print_1_To_N_UsingWhile{\n    public static void main(String[] args) {\n\
    \        //loop counter initialisation\n        int i =1;\n        //create object\
    \ of scanner class\n        Scanner Sc = new Scanner(System.in);\n        // enter\
    \ the value of \"n \"\n        System.out.print(\"Enter the value n : \");\n \
    \       // read the value.\n        int n = Sc.nextInt();\n        System.out.println(\"\
    Numbers are : \");\n        while(i<=n) {\n            System.out.println(i);\n\
    \            i++;\n        }\n    }\n}\n```\n\n### Output\n```\nEnter the value\
    \ n :15\nNumbers are :12345678910111213415\n```\n\n## Addition of one dimensional\
    \ and two dimensional arrays\nIN JAVA PROGRAM there are 2 programs: two one-dimensional\
    \ arrays added, and two-dimensional arrays added\n\n### 1) Addition of two dimensional\
    \ arrays\n```java\nclass AddTwoArray{\n    public static void main(String[] args)\
    \ {\n        // Declaration and initialization of array\n        int a[] = {1,2,3,4,5};\n\
    \        int b[] = {6,7,8,9,10};\n        // Instantiation of third array to store\
    \ results\n        int c[] = new int[5];\n        for(int i=0; i<5; i++) {\n \
    \           // add two array and result store in third array\n            c[i]\
    \ = a[i] + b[i];\n            //Display results\n            System.out.println(\"\
    Enter sum of \"+i +\"index\" +\" \" + c[i]);\n        }\n    }\n}\n```\n### Output\n\
    ```\nEnter sum of 0index 7\nEnter sum of 1index 9\nEnter sum of 2index 11\nEnter\
    \ sum of 3index 13\nEnter sum of 4index 15\n```\n\n### 2) Addition of two two\
    \ dimensional arrays\n```java\nclass AddTwoArrayOf2DClass{\n    public static\
    \ void main(String[] args){\n        // Declaration and initialization of 2D array\n\
    \        int a[][] = {{1,2,3},{4,5,6}};\n        int b[][] = {{7,8,9},{10,11,12}};\n\
    \        // Instantiation of third array to store results\n        int c[][] =\
    \ new int[2][3];\n        for(int i=0; i<2; i++){\n            for(int j=0; j<3;\
    \ j++){\n                // add two array and result store in third array\n  \
    \              c[i][j] = a[i][j] + b[i][j];\n                System.out.println(\"\
    Enter sum of \"+i + \" \" + j +\"index\" +\" \" + c[i][j]);\n            }\n \
    \       }\n    }\n}\n```\n### Output\n```\nEnter sum of 0 0index 8\nEnter sum\
    \ of 0 1index 10\nEnter sum of 0 2index 12\nEnter sum of 1 0index 14\nEnter sum\
    \ of 1 1index 16\nEnter sum of 1 2index 18\n```\n\n## Java program to convert\
    \ Decimal to Binary\nGiven an Integer (Decimal) number, and using java program\
    \ we have to convert it to Binary.\n\n### PROGRAM\n```java\n// Scanner class is\
    \ used for taking input from user\nimport java.util.Scanner;\nclass DecimalToBinaryConversionClass{\n\
    \    public static void main(String[] args){\n        // create Scanner class\
    \ object\n        Scanner sc = new Scanner(System.in);\n        System.out.println(\"\
    Enter Any Decimal Number :\");\n        //Accept input from user\n        int\
    \ input_decimal_num = sc.nextInt();\n        String binary_string = \" \";\n \
    \       //Loop continues till input_decimal_num >0\n        while(input_decimal_num\
    \ > 0){\n            //remainder add to string variable\n            binary_string\
    \ = (input_decimal_num%2) + binary_string;\n            input_decimal_num = input_decimal_num/2;\n\
    \        }\n        // Display Final Result\n        System.out.println(\"Conversion\
    \ of decimal is : \" + binary_string);\n    }\n}\n```\n\n### Output\n```\nEnter\
    \ Any Decimal Number :30\nConversion of decimal is :1110\n```\n\n## Java program\
    \ to read a file line by line\nGiven a file, and using java program we have to\
    \ read its contents line line. We use a file called \"B.txt\" for this program\
    \ that is located at the \"F:\" drive, thus the file path is \"F:\\B.txt,\" and\
    \ the file content is:\nline 1\nline 2\nline 3\nline 4\n\n### PROGRAM\n```java\n\
    import java.io.FileInputStream;\nimport java.io.IOException;\nimport java.util.Scanner;\n\
    class ReadLineByLine{\n    public static void main(String[] args){\n        //\
    \ create object of scanner class.\n        Scanner Sc=new Scanner(System.in);\n\
    \        // enter file name.\n        System.out.print(\"Enter the file name:\"\
    );\n        String filename=Sc.next();\n        Scanner Sc1=null;\n        FileInputStream\
    \ fis=null;\n        try {\n            FI=new FileInputStream(filename);\n  \
    \          Sc1=new Scanner(FI);\n            // this will read data till the end\
    \ of data.\n            while(Sc1.hasNext()){\n                String data=Sc1.nextLine();\n\
    \                // print the data.\n                System.out.print(\"The file\
    \ data is : +data);\n            }\n        } catch(IOException e) {\n       \
    \     System.out.println(e);\n        }\n    }\n}\n```\n\n### Output\n```\nEnter\
    \ the file name:F:/B.txt\nThe file data is :line 1\nThe file data is :line 2\n\
    The file data is :line 3\nThe file data is :line 4\n```\n\n## Java program to\
    \ get current system date and time\n//program to system date and time\nimport\
    \ java.util.Date;\nclass GetDateTime{\n    public static void main(String args[]){\n\
    \        // instance of Date\n        Date date = new Date();\n        // get\
    \ date, month and year\n        System.out.println(date.getDate()+\"/\"+date.getMonth()+1)+\"\
    /\"+date.getYear()-100));\n        // get complete date and time\n        System.out.println(date.toString());\n\
    \        // get time only\n        System.out.println(date.getHours()+\":\"+date.getMinutes()+\"\
    :\"+date.getSeconds());\n    }\n}\n```\n\n### OUTPUT\n```\n14/8/20Thu Aug 14 21:29:07\
    \ GMT 202021:29:7\n```\n\n## Java program to Calculate Area of a Circle.\nThis\
    \ program reads circle radius and calculates Area of the circle.\n\n### PROGRAM\n\
    ```java\nimport java.util.Scanner;\npublic class AreaCircle {\n    public static\
    \ void main(String[] args) {\n        double radius;\n        Scanner sc=new Scanner(System.in);\n\
    \        // input radius of circle\n        System.out.print(\"Enter the Radius\
    \ of Circle : \");\n        radius=sc.nextDouble();\n        // circle area is\
    \ pi * radius squared\n        double area=3.14*radius*radius;\n        System.out.print(\"\
    Area of Circle : \"+area);\n    }\n}\n```\n\n### OUTPUT\n```\nEnter the Radius\
    \ of Circle :12.5\nArea of Circle :490.625\n```\n\n## Java - Print File Content,\
    \ Display File\nUsing Java program we will print the file size and file information\
    \ in this code snippet.\n\n### PROGRAM\n```java\n// Java - Print File Content,\
    \ Display File using Java Program.\nimport java.io.*;\nclass PrintFile{\n    public\
    \ static void main(String[] args[]) throws IOException{\n        File fileName\
    \ = new File(\"d:/sample.txt\");\n        FileInputStream inFile = new FileInputStream(\"\
    d:/sample.txt\");\n        int fileLength =(int)fileName.length();\n        byte[]\
    \ Bytes=new byte[fileLength];\n        System.out.println(\"File size is: \" +\
    \ inFile.read(Bytes));\n        String file1 = new String(Bytes);\n        System.out.println(\"\
    File content is:\\n \" + file1);\n        //close file\n        inFile.close();\n\
    \    }\n}\n```\n\n### OUTPUT\n```\nFile size is: 22\nFile content is:\nThis is\
    \ a sample file.\n```\n\n## Java program to copy files\nThis program copies files\
    \ in Java.\n\n### PROGRAM\n```java\n// Java program to copy file.\nimport java.io.*;\n\
    class FileCopy {\n    public static void main(String[] args[]) {\n        try\
    \ {\n            //input file\n            FileInputStream sourceFile = new FileInputStream\
    \ (args[0]);\n            //output file\n            FileOutputStream targetFile\
    \ = new FileOutputStream(args[1]);\n            // Copy each byte from the input\
    \ to output\n            int byteValue;\n            //read byte from first file\
    \ and write it into second line\n            while((byteValue = sourceFile.read())\
    \ != -1)\n                targetFile.write(byteValue);\n            // Close the\
    \ files!!!\n            sourceFile.close();\n            targetFile.close();\n\
    \            System.out.println(\"File copied successfully\");\n        // If\
    \ something went wrong, report it!\n        catch(IOException e) {\n         \
    \   System.out.println(\"Exception: \" + e.toString());\n        }\n    }\n}\n\
    ```\n\n### OUTPUT\n```\nCompile: javac FileCopy.java\nRun: java FileCopy file1.txt\
    \ file2.txt\nFile copied successfully\n```\n\n## Find sum of factorials from 1\
    \ to N\nExample:\nInput: 3\nOutput: 9\nExplanation:1! + 2! + 3! = 1 + 2 + 6 =\
    \ 9\nInput: 5\nOutput: 152\nExplanation:1! + 2! + 3! + 4! + 5!= 1+2+6+24+120=\
    \ 153\n\n### PROGRAM\n```java\nimport java.util.Scanner;\nclass SumOfFactorial{\n\
    \    public static void main(String[] args) {\n        // create scanner object.\n\
    \        Scanner sc = new Scanner(System.in);\n        // enter the number.\n\
    \        System.out.print(\"Enter number : \");\n        int n = sc.nextInt();\n\
    \        int total=0;\n        int i=1;\n        // calculate factorial here.\n\
    \        while(i <= n) {\n            int factorial=1;\n            int j=1;\n\
    \            while(j <= i) {\n                factorial=factorial*j;\n       \
    \         j = j+1;\n            }\n            // calculate sum of factorial of\
    \ the number.\n            total = total + factorial;\n            i=i+1;\n  \
    \      }\n        // print the result here.\n        System.out.println(\"Sum\
    \ : \" + total);\n    }\n}\n```\n\n### Output\n```\nFirst run:\nEnter number :\
    \ 3\nSum : 9\nSecond run:\nEnter number : 5\nSum : 153\n```\n\n## Find smallest\
    \ element in an array\nExample:\nInput:Enter number of elements: 4\nInput elements:\
    \ 45, 25, 69, 40\nOutput:Smallest element in: 25\n\n### PROGRAM\n```java\nimport\
    \ java.util.Scanner;\nclass ExArrayFindMinimum{\n    public static void main(String[]\
    \ args){\n        // Intialising the variables\n        int n, min;\n        Scanner\
    \ Sc = new Scanner(System.in);\n        // Enter the number of elements.\n   \
    \     System.out.print(\"Enter number of elements : \");\n        n = Sc.nextInt();\n\
    \        // creating an array.\n        int a[] = new int[n];\n        // enter\
    \ array elements.\n        System.out.println(\"Enter the elements in array :\
    \ \");\n        for (int i = 0; i < n; i++){a[i] = Sc.nextInt();}\n        for\
    \ (int i = 0; i < n; i++){\n            for (int j = i + 1; j < n; j++){\n   \
    \             if (a[i] > a[j]){\n                    min = a[i];\n           \
    \         a[i] = a[j];\n                    a[j] = min;\n                }\n \
    \           }\n        }\n        System.out.println(\"The Smallest element in\
    \ the array is :\"+a[0]);\n    }\n}\n```\n"
