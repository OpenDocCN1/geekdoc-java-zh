    \ 一维数组和二维数组的加法\n在 JAVA 程序中有两个程序：两个一维数组加法，两个二维数组加法。\n\n### 1) 二维数组的加法\n```java\n\
    class AddTwoArray{\n    public static void main(String[] args) {\n        //数组的声明和初始化\n\
    \        int a[] = {1,2,3,4,5};\n        int b[] = {6,7,8,9,10};\n        //实例化第三个数组来存储结果\n\
    \        int c[] = new int[5];\n        for(int i=0; i<5; i++) {\n           \
    \ //两个数组相加并将结果存储在第三个数组中\n            c[i] = a[i] + b[i];\n            //显示结果\n\
    \            System.out.println(\"sum of \"+i +\"index\" +\" \" + c[i]);\n   \
    \     }\n    }\n}\n```\n### 输出\n```\nEnter sum of 0index 7\nEnter sum of 1index\
    \ 9\nEnter sum of 2index 11\nEnter sum of 3index 13\nEnter sum of 4index 15\n\
    ```\n\n### 2) 两个二维数组的加法\n```java\nclass AddTwoArrayOf2DClass{\n    public static\
    \ void main(String[] args){\n        //数组的声明和初始化\n        int a[][] = {{1,2,3},{4,5,6}};\n\
    \        int b[][] = {{7,8,9},{10,11,12}};\n        //实例化第三个数组来存储结果\n        int\
    \ c[][] = new int[2][3];\n        for(int i=0; i<2; i++){\n            for(int\
    \ j=0; j<3; j++){\n                //两个数组相加并将结果存储在第三个数组中\n                c[i][j]\
    \ = a[i][j] + b[i][j];\n                //显示结果\n                System.out.println(\"\
    sum of \"+i +\"index\" + j +\" \" + c[i][j]);\n            }\n        }\n    }\n\
    }\n```\n### 输出\n```\nsum of 0index0 8\nsum of 0index1 10\nsum of 0index2 12\n\
    sum of 1index0 14\nsum of 1index1 16\nsum of 1index2 18\n```\n\n## 逐行读取文件的 Java\
    \ 程序\n给定一个文件，使用 Java 程序逐行读取其内容。我们使用名为 \"B.txt\" 的文件，该文件位于 \"F:\" 盘，因此文件路径为 \"\
