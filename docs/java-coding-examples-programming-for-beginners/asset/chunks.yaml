    \ 打印斐波那契数列的 Java 程序\n- 使用 for 循环打印 1 到 N 的数字\n- 使用 while 循环打印 1 到 N 的数字\n- 一维数组和二维数组的加法\n\
    - 十进制转二进制的 Java 程序\n- 逐行读取文件的 Java 程序\n- 获取当前系统日期和时间的 Java 程序\n- 计算圆面积的 Java 程序\n\
    - Java - 打印文件内容，显示文件\n- 复制文件的 Java 程序\n- 寻找 1 到 N 的阶乘和\n- 寻找数组中的最小元素\n\n## 打印\
    \ 'Hello world' 的 Java 程序\n\n### 语法\n```\njavac HelloWorld.java\n```\n\n### 执行/运行\
    \ Java 程序\n当你编译了 Java 程序，如果编译成功，你就可以运行该 Java 程序来生成输出。\n\n### 程序\n```java\npublic\
    \ class HelloWorld{\n    public static void main(String []args){\n        //打印消息\n\
    \        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n### 输出\n```\n\
    Hello World!\n```\n\n## 在 Java 中打印不同类型的值\n我们将在此程序中声明并描述一些不同类型的变量，然后使用 `System.out.println()`\
    \ 方法打印它们。\n\n### 程序\n```java\nclass j2{\n    public static void main(String args[])\
    \ {\n        int num;\n        float b;\n        char c;\n        String s;\n\
    \        //整数\n        num = 100;\n        //浮点数\n        b = 1.234f;\n      \
    \  //字符\n        c = 'A';\n        //字符串\n        s = \"Hello Java\";\n      \
    \  System.out.println(\"Value of num: \"+num);\n        System.out.println(\"\
    Value of b: \"+b);\n        System.out.println(\"Value of c: \"+c);\n        System.out.println(\"\
    Value of s: \"+s);\n    }\n}\n```\n\n### 输出\n```\nValue of num: 100\nValue of\
    \ b: 1.234\nValue of c: A\nValue of s: Hello Java\n```\n\n## 在 Java 中读取并打印整数值\n\
    在这里我们将学习如何从用户获取整数输入并将其打印到屏幕上。为了获取整数输入，我们使用 `Scanner` 类，为此我们必须在 Java 程序中包含 `java.util.*`\
    \ 包。\n\n### 程序\n```java\nimport java.util.*;\nclass j3{\n    public static void\
    \ main(String args[]) {\n        int a;\n        //声明 Scanner 类对象\n        Scanner\
    \ buf=new Scanner(System.in);\n        System.out.print(\"Enter value of a :\"\
    );\n        /*Scanner 类的 nextInt() 方法*/\n        a=buf.nextInt();\n        System.out.println(\"\
    Value of a:\" +a);\n    }\n}\n```\n\n### 输出\n```\nEnter value of a :120\nValue\
    \ of a:120\n```\n\n## 计算总和和平均值的 Java 程序\n给出两个整数（输入），我们需要计算它们的总和和平均值。\n\n### 程序\n\
    ```java\n// 在 Java 中寻找两个数字的总和和平均值\nimport java.util.*;\npublic class Numbers {\n\
