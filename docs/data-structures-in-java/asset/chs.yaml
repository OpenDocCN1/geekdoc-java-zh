  \ 和 `display_list()`，它们分别用于向链表中添加节点、在链表中查找项目以及显示链表的内容。\n\n`append_node()` 方法包含了你在之前上一个示例中看到的相同代码，而\
  \ `find_item()` 则会遍历链表并将每个节点的内容与给定字符串进行比较。根据是否在链表中找到给定字符串，程序会显示相应的消息。\n\n`main()`\
