  \n\n\n\n\n### 在单向链表中更新节点\n\n以下伪代码解释了如何在链表中查找一个元素，并且如果该元素存在，则更新其内容：\n\n```\n CURR\
  \ = ROOT\nFound = False\nOLDDATA = \"something old\";\nNEWDATA = \"something new\"\
