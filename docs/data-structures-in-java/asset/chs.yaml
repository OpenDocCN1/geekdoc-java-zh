  \ 显示了 `GCD.java` 的内容，它阐明了如何计算两个整数的最大公约数。\n\n```java\n public class GCD\n{ \n   public\
  \ GCD() {}\n\n   public int gcd(int num1, int num2)\n   {\n      if(num1 % num2\
  \ == 0) {\n         return num2;\n      }\n      else if (num1 < num2) {\n     \
  \    System.out.println(\"Switching \"+num1+\" and \"+num2);\n         return gcd(num2,\
  \ num1);\n      }\n      else {\n         System.out.println(\"Reducing \"+num1+\"\
  \ and \"+num2);\n         return gcd(num1-num2, num2);\n      }\n   }\n\n   public\
  \ static void main(String args[])\n   {\n      GCD g = new GCD();\n      int result\
  \ = g.gcd(24,10);\n      System.out.println(\"The GCD of 24 and 10 = \"+result);\n\
  \   }\n}\n```\n\n列表 2.19 从一个 `gcd()` 方法开始，该方法接收两个整数值参数 `num1` 和 `num2`。第一个条件逻辑部分检查\
  \ `num1` 除以 `num2` 的余数是否为 `0`：如果是，则返回 `num2`。第二个条件逻辑部分检查 `num1` 是否小于 `num2`：如果是，则递归调用\
  \ `gcd()` 方法并传入参数 `num2` 和 `num1`，并返回结果。第三个条件逻辑部分返回递归调用 `gcd()` 方法的结果，传入参数为 `num1-num2`\
  \ 和 `num2`。\n\n\n\n\n\n```\ngcd of 10 and 24 = 2\ngcd of 24 and 10 = 2\ngcd of 50\
  \ and 15 = 5\ngcd of 17 and 17 = 17\ngcd of 100 and 1250 = 50\n```\n\n既然我们已经知道了两个正整数的最大公约数（GCD），就可以使用这段代码轻松计算两个正整数的最小公倍数（LCM），如节所示。\n\
  \n### 任务：计算最小公倍数（LCM）\n\nListing 2.20 显示了 `LCM.java` 的内容，它说明了如何计算两个正整数的 LCM。请记住，对于任何正整数\
  \ `x` 和 `y`，`LCM(x,y) = (x*y)/GCD(x,y)`。\n\n***Listing 2.20：LCM.java***\n\n```\n\
  \ public class LCM\n{\n   public LCM() {}\n\n   public int gcd(int num1, int num2)\n\
  \   {\n      if(num1 % num2 == 0) {\n         return num2;\n      }\n      else\
  \ if (num1 < num2) {\n         return gcd(num2, num1);\n      }\n      else {\n\
  \         return gcd(num1-num2, num2);\n      }\n   }\n\n   public int lcm(int num1,\
  \ int num2)\n   {\n      int gcd1 = gcd(num1, num2);\n      int lcm1 = num1*num2/gcd1;\n\
  \n      return lcm1;\n   }\n\n   public static void main(String args[])\n   {\n\
  \      LCM lcm1 = new LCM();\n      int result = lcm1.lcm(24,10);\n      System.out.println(\"\
  The LCM of 24 and 10 = \"+result);\n   }\n}\n```\n\nListing 2.20 从一个 `gcd()` 方法开始，该方法与\
  \ Listing 2.19 中定义的方法完全相同。Listing 2.20 的下部分定义了接收参数 `num1` 和 `num2` 的 `lcm()` 方法。该方法计算\
  \ `num1` 和 `num2` 的 GCD，并将结果赋值给变量 `gcd1`。接下来，计算数量 `num1*num2/gcd1` 并将其赋值给变量 `lcm1`，然后返回它。\n\
  \nListing 2.20 的下部分定义了 `main()` 方法，该方法将变量 `lcm1` 实例化为 `LCM` 类的实例。接下来，将变量 `result`\
  \ 初始化为带有值 `24` 和 `10` 调用 `lcm()` 方法的结果，然后打印其值。运行 Listing 2.20 中的代码，你将看到以下输出：\n\n\
  ```\n The LCM of 24 and 10 = 120\n```\n\n本章关于递归的部分到此结束。下一节将向你介绍组合数学（数学中一个著名的分支）。\n\
  \n### 什么是组合数学？\n\n简单来说，组合数学涉及寻找计算集合中对象数量的公式。例如，五本书在书架上可以有多少种不同的排列方式（即展示方式）？答案涉及排列，而排列又涉及阶乘值；在这种情况下，答案是\
  \ `5! = 120`。\n\n作为第二个例子，假设从一个包含五本书的书架上选择三本书有多少种不同的方法？这个问题的答案涉及组合。请记住，如果你选择了标记为\
  \ `A`、`B` 和 `C` 的三本书，那么这三本书的任何排列都被认为是相同的（集合 `A, B, and C` 和集合 `B, A, and C` 被视为同一种选择）。\n\
  \n作为第三个例子，有多少五位二进制数恰好包含三个 `1`？这个问题的答案也涉及计算一个组合值。如果你好奇的话，在允许导零的情况下，答案是 `C(5,3) =\
  \ 5!/[3! * 2!] = 10`。事实上，这也是上一个关于选择不同书籍子集的问题的答案。\n\n你可以通过询问有多少个四位、五位和六位数字恰好包含三个\
  \ `1s` 来泛化上一个问题。答案是这些值的总和（假设允许导零）：\n\n```\n C(4,3) + C(5,3) + C(6,3) = 4 + 10 +\
  \ 20 = 34\n```\n\n#### 处理排列\n\n考虑以下任务：给定六本书，你有多少种方式将它们并排展示？可能的情况列在这里：\n\n位置 #1:\
  \ 6 种选择\n\n位置 #2: 5 种选择\n\n位置 #3: 4 种选择\n\n位置 #4: 3 种选择\n\n位置 #5: 2 种选择\n\n位置 #6:\
  \ 1 种选择\n\n答案是 `6x5x4x3x2x1 = 6! = 720`。通常，如果你有 `n` 本书，你有 `n!` 种不同的方法排列它们（即并排展示）。\n\
  \n#### 处理组合\n\n让我们来看这个问题：从一个包含五本书的书架中选择三本书有多少种不同的方法？答案涉及组合。请记住，如果你选择了三个标记为 `A`、`B`\
  \ 和 `C` 的书，那么这三本书的任何排列都被认为是相同的。从实例化变量 `lcm1` 变量为 `LCM` 类的实例开始。接下来，将变量 `result` 初始化为带有值\
  \ `24` 和 `10` 调用 `lcm()` 方法的结果，然后打印其值。\n\n\n\n\n\n本节任务的更完整描述如下：给定一组数字 `N` 和一个数字\
  \ `k`，找到 `N` 中包含至少一个大于 `k` 的数字的子集数量。这个 `计数` 任务是一个编码任务的示例，可以作为一个组合问题轻松解决：你可能会惊讶地发现，解决方案只需要一行（且是简单的）代码。让我们定义以下变量集合：\n\
  \n```\n N     = 一组数字集合\n|N|   = N 中元素的个数 (= n)\nNS    = N 的非空子集\nP(NS) = N 的非空子集的数量\
  \ (= |NS|)\n M     = 数字集合 {n| n < k}, 其中 n 是 N 中的一个元素\n|M|   = M 中元素的个数 (= m)\n\
  MS    = M 的非空子集\nP(MS) = M 的非空子集的数量 (= |MS|)\nQ     = 包含至少一个大于 k 数字的 N 子集\n```\n\
  \n注意，集合 `NS` 被划分为集合 `Q` 和 `M`，且 `Q` 与 `M` 的并集是 `NS`。换句话说，`N` 的一个非空子集要么在 `Q` 中，要么在\
  \ `M` 中，但不同不在。因此，任务的解决方案可以表示为：`|Q| = P(NS) – P(MS)`。\n\n此外，“M` 中的集合不包含任何大于 `k` 的数字，这意味着\
  \ `M` 中的任何元素（即子集）都不是 `Q` 的元素，反之，`Q` 的任何元素都不是 `M` 的元素。\n\n回想本章之前的结论，如果一个集合包含 `m`\
  \ 个元素，那么子集的数量为 `2**m`，*非空*子集的数量为 `2**m – 1`。因此，该任务的答案是 `(2**n – 1) - (2**m – 1)`。\n\
  \n[Listing 2.22] 显示了 `subarrays_max_k.py` 的内容，它计算一组二项式系数之和。\n\n**列表 2.22: SubarraysMaxK.java**\n\
  \n```\n public class SubarraysMaxK\n{\n   //###############################################\n\
  \   // N = 包含 n 个元素的集合\n   // M = 包含 m 个元素的集合\n   //\n   // N 有 2^n - 1 个非空子集\n\
  \   // M 有 2^m - 1 个非空子集\n   //\n   // O = 至少一个元素 > k 的 N 子集\n   // P = 所有数字 <=\
  \ k 的 N 子集\n   //\n   // |P| = 2**m-1\n   // 以及 |O| = |N| - |P| = (2**n-1) - (2**m-1)\n\
  \   //###############################################\n\n   // 最大元素 > k 的子数组数量\n\
  \   public static int count_subsets(int n, int m) {\n     //System.out.println(\"\
  n = \"+n+\" m = \"+m);\n     int count = (int)(Math.pow(2,n) - 1) - (int)(Math.pow(2,m)\
  \ - 1);\n     return count;\n   } \n\n   public static void main(String[] args)\n\
  \   {\n     //int[] arr = new int[]{ 1, 2, 3, 4, 5, 6, 7, 8 };\n     int[] arr =\
  \ new int[]{ 1, 2, 3, 4 };\n\n     System.out.println(\"Array elements:\");\n  \
  \   for (int num : arr)\n        System.out.print(num+\" \");\n     System.out.println();\n\
  \n     int arr_len = arr.length;\n\n     int[] arrk = new int[]{1, 2, 3, 4};\n \
  \    for (int overk : arrk) {\n       int count = count_subsets(arr_len, overk);\n\
  \n       System.out.println(\"overk:   \"+overk);\n       System.out.println(\"\
  count:   \"+count);\n       System.out.println(\"---------------\");\n     }\n \
  \  }\n}\n```\n\n[Listing 2.22] 包含了实现了本节开头描述细节的 Java 代码。运行代码，你将看到以下输出：\n\n```\n Array\
  \ elements:\n1 2 3 4 \noverk:   1\ncount:   14\n---------------\noverk:   2\ncount:\
  \   12\n---------------\noverk:   3\ncount:   8\n---------------\noverk:   4\ncount:\
  \   0\n--------------\n```\n\n尽管 [Listing 2.22] 中的集合 `N` 包含一组从 1 到 `n` 的连续整数，但该代码对于未排序数组或不包含连续整数的数组同样有效。在后者的情况下，你需要一个代码块来统计小于给定值\
  \ `k` 的元素个数。\n\n### 总结\n\n本章介绍了递归，以及涉及递归的各种代码示例，例如计算阶值、斐波那契数、等差数列求和、几何数列求和、一对正整数的最大公约数\
  \ (GCD) 以及一对正整数的最小公倍数 (LCM)。\n\n此外，你学习了组合数学中的概念，以及如何推导出对象集合的排列和组合公式。\n\n# 第 3 章\n\
  \n## 字符串与数组\n\n本章从递归介绍开始，包含了涉及递归的各种代码示例，例如计算阶值、斐波那契数、等差数列求和、几何数列求和、一对正整数的最大公约数以及一对正整数的最小公倍数。\n\
  \n此外，你学习了组合数学中的概念，以及如何推导出对象集合的排列和组合公式。\n\n## 字符串与数组\n\n本章包含了基于 Java 的代码示例，用于处理字符串和数组的各种任务，这些任务涉及递归。\n\
  \n（注：此处原文似乎存在部分重复或逻辑跳跃，已根据翻译指令要求尽可能保持原文结构并进行翻译）\n\n本章的第一部分对递归算法提供了时间复杂度的简要概述，随后是涉及字符串的各种示例，例如判断回文、反转字符串。\n\
  \n本章的第二部分讨论了数组，包含了处理各种任务的 Java 代码示例，这些示例展示了时间复杂性。\n\n本章还讨论了二维数组，包含了处理各种任务的示例，这些示例涉及了一维数组。\n\
  \n另一个需要注意的细节是关于数组，这涉及到二维数组。在数学中，数组总是一维的；更高维的数组将标记为“二维数组”、“三维数组”等。因此，涉及二维数组的内容从“空间”部分开始。\n\
  \n### 时间与空间复杂度\n\n算法根据空间（基于输入大小）和完成执行所需的时间进行评估，时间用大 O 符号表示。有三种时间复杂度：最佳情况、平均情况和最坏情况。请记住，具有极佳最佳情况性能的算法可能有很糟糕的情况性能。\n\
  \n回想 O(n) 意味着算法在线性时间内执行。例如，如果算法分别需要 `2*n`、`5*n` 或 `n/2` 次操作，那么它们的复杂度都是 `O(n)`。\n\
  \n此外，如果线性搜索的最佳、平均和最坏时间性能分别为 1、`n/2` 和 `n` 次操作，那么这些操作分别是 `O(1)`、`O(n)` 和 `O(n)`。通常情况下，如果某个任务有两个解决方案\
  \ `T1` 和 `T2`，`T2` 比 `T1` 更高效，那么 `T2` 需要更少的时间或更少的内存。例如，如果 `T1` 是计算阶（或斐波那契数）的迭代解决方案而\
  \ `T2` 涉及递归解决方案，那么在时间上 `T1` 比 `T2` 更高效，但 `T1` 需要额外的数组来存储中间值。\n\n时间空间权衡是指减少执行算法所需的时间或内存，这涉及到在以下方案之间选择：\n\
  \n*   用更短的时间和更多的内存\n*   用更长的时间和更少的内存\n\n虽然同时减少时间和内存是理想的，但这也更具挑战性。另一个需要注意的点是对于任何正整数\
  \ `n > 1`，以下不等式成立（对数可以是大于等于 2 的任意底）：\n\n```\n O(log n) < O(n) < O(n*log n) < O(n²)\n\
  ```\n\n此外，关于 n 的幂、2 的幂和阶值的以下不等式也成立：\n\n```\n O(n**2) < O(n**3) < O(2**n) < O(n!)\n\
  ```\n\n\n\n\n如果你对上述任何不等式不确定，请在网上搜索提供必要详细说明的教程。\n\n### 任务：整数的最大幂和最小幂\n\n本节中的代码示例向你展示了如何计算一个基数为\
  \ `k` 的数字 `num` 的小于 `num`（或大于 `num`）的最大（或最小）幂，其中 `num` 和 `k` 都是正整数。\n\n例如，16 是`小于`\
  \ 24 的最大 2 的幂，而 32 是`大于` 24 的最小 2 的幂。另一个例子是 625 是`小于` 1000 的最大 5 的幂，而 3125 是`大于`\
  \ 1000 的最小 5 的幂。\n\nListing 3.1 显示了 `MaxMinPowerk2.java` 的内容，演示了如何计算一个基数为 `k` 的数字小于给定数字（或大于给定数字）的最大（或最小）幂。为了确保任务描述清晰：`num`\
  \ 和 `k` 是正整数，此任务的目标有两个：\n\n* 找到满足 `k**powk <= num` 的`最大`数字 `powk`\n\n* 找到满足 `k**powk\
  \ >= num` 的`最小`数字 `powk`\n\n***LISTING 3.1: MaxMinPowerk2.java***\n\n```\n public\
  \ class MaxMinPowerk2\n{ \n   public static int[] MaxMinPowerk(int num, int k)\n\
  \   {\n      int powk = 1;\n      while(powk <= num)\n      {\n        powk *= k;\n\
  \      }\n\n      if(powk > num) powk /= k;\n\n      return new int[]{(int)powk,\
  \ (int)powk*k};\n   }\n\n   public static void main(String[] args)\n   {\n     \
  \ int lowerk, upperk;\n      int[] nums = new int[]{24,17,1000};\n      int[] powers\
  \ = new int[]{2,3,4,5};\n\n      for(int num : nums)\n      {\n        for(int k\
  \ : powers)\n        {\n          int[] results = max_min_powerk(num, k);\n    \
  \      lowerk = results[0];\n          upperk = results[1];\n          System.out.println(\"\
  num: \"+num+\" lower \"+lowerk+\" upper: \"+upperk);\n        }\n\n        System.out.println();\n\
  \      }\n   }\n}\n```\n\nListing 3.1 从函数 `MaxMinPowerk()` 开始，该函数包含一个循环，反复将局部变量\
  \ `powk`（初始化值为 1）乘以 `k`。当 `powk` 超过参数 `num` 时，`powk` 被除以 `k`，从而得到下界解。\n\n注意，此函数返回\
  \ `powk` 和 `powk*k`，因为这对数字是该任务的下界和上界解。运行 Listing 3.1 中的代码，你将看到以下输出：\n\n```\n num:\
  \ 24 lower 16 upper: 32\nnum: 24 lower 9 upper: 27\nnum: 24 lower 16 upper: 64\n\
  num: 24 lower 5 upper: 25\n\nnum: 17 lower 16 upper: 32\nnum: 17 lower 9 upper:\
  \ 27\nnum: 17 lower 16 upper: 64\nnum: 17 lower 5 upper: 25\n\nnum: 1000 lower 512\
  \ upper: 1024\nnum: 1000 lower 729 upper: 2187\nnum: 1000 lower 256 upper: 1024\n\
  num: 1000 lower 625 upper: 3125\n```\n\n### 任务：数字的二进制子串\n\nListing 3.2 显示了 `BinaryNumbers.java`\
