  \ checking: abcdef\nlongest unique: abcdef\n\nchecking: aaaxyz\nlongest unique:\
  \ axyz\n\nchecking: abcdeeefghij\nlongest unique: efghij\n```\n\n### 最长重复子串\n\n\
