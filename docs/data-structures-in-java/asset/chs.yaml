  \ 函数开始，其参数为字符串 `my_str`。该函数包含一个从右向左的循环并将当前索引处的字符存储在字典 `my_dict` 中。如果该字符已经遇到，那么它就是一个重复字符，此时会将当前子串的长度与到为止发现的最长子串的长度进行比较，此时变量\
  \ `longest` 将更新为新值。此外，左位置 `left` 和右位置 `right` 被重置为 pos+1，唯一子串的搜索重新开始。\n\n在完成本节后，你可以探索这些任务的变体。\n\
