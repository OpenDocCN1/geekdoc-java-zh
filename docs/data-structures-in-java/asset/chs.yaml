  \ 0 到 2 之间，这意味着我们可以生成成百上千行输出。当然，会有会有很多重复的输出行，因为只有三个人不同的人。\n\n### JAVA 中的静态方法\n\n\
  静态变量的声明方式与实例变量相同，但多加了 `static` 关键字。如果你将一个方法声明为 `static`，则该方法只能更新静态变量；然而，非静态方法中也可以更新静态变量。静态方法的一个关键点是，你可以在实例化对象之前引用静态方法；另一方面，非静态方法只能通过类的实例可用。请记住关于静态方法的以下几点：\n\
  \n- 它们只能调用其他静态方法\n- 它们只能访问静态数据\n- 所有类实例中的都是同一个方法\n- 它们没有 `this` 引用\n\n列表 1.16 显示了\
  \ `StaticMethod.java` 的内容，说明了如何在 Java 类中定义并调用一个静态方法。\n\n***列表 1.16: StaticMethod.java***\n\
  \n```\n public class StaticMethod\n{\n   public void display1()\n   {\n      System.out.println(\"\
  Inside display1\");\n   }\n\n   public static void display2()\n   {\n      System.out.println(\"\
  Inside display2\");\n   }\n\n   public static void main (String args[])\n   {\n\
  \      System.out.println(\"Inside main()\");\n      // 无法调用非静态方法：\n    //StaticMethod.display1();\n\
  \      // 这种是正确的：\n      StaticMethod.display2();\n\n      // 这种是正确的：\n      StaticMethod\
  \ sm = new StaticMethod();\n      sm.display1();\n   }\n}\n```\n\n列表 1.16 定义了 Java\
  \ 类 `StaticMethod`、非静态方法 `display1()` 以及一个静态方法 `display2()`。`main()` 方法在没有实例化 `StaticMethod`\
  \ 类的情况下调用了 `display2()` 方法。接下来，`main()` 方法将变量 `sm` 初始化为 `StaticMethod` 类的实例，之后 `sm`\
  \ 调用了不是静态方法的 `display1()` 方法。\n\n#### Java 中的其他静态类型\n\n正如你在上一节中看到的，Java 类中的静态方法可以在不实例化对象的情况下被调用。此外，你还可以定义一个包含静态方法的静态\
  \ Java 类，其中每个方法都可以在不实例化 Java 类实例的情况下调用。\n\n`static block`（也称为静态初始化块）是一组指令，当 Java\
  \ 类加载到内存时执行一次。静态块用于在对象构造之前进行初始化，如下：\n\n```\n class MyClass \n{   \n   static int\
  \ x; \n   int y; \n\n   static {\n      x = 123; \n      System.out.println(\"static\
  \ block executed\"); \n   } \n\n   // 其他方法 ...\n}\n```\n\n前一个代码块中**粗体显示**的代码在（任何）构造函数执行之前执行。\n\
  \n### 总结\n\n本章为你介绍了一些 Java 特性，例如它支持的一些数据类型、运算符以及 Java 运算符的优先级。你还学习了如何实例化 Java 类的实例，以及如何在\
  \ `main()` 方法中执行算术运算。\n\n你还了解了 Java 字符和字符串的概述，以及 `new` 操作符的意义。最后，你学习了如何判断两个字符串是否相等，以及\
  \ Java 中其他一些实用的字符串函数。\n\n# 第 2 章\n\n## 递归与组合数学\n\n本章向你介绍了递归的概念，以及各种 Java 代码示例，然后介绍了组合数学中的概念，如对象的组合和排列。\n\
  \n本章的第一部分讨论递归，这是本章最重要的部分。代码示例包括等差数列（例如 1 到 n 的和）、几何数列计算、阶乘计算以及斐波契数。除了斐波契数的迭代解外，这些示例不涉及数据结构。然而，这些示例为递归提供了基础。\n\
  \n本章的第二部分讨论组合数学，如排列和组合。注意，组合数学的全面涵盖涵盖一门本科课程，而本章只包含基础概念。\n\n 如果你刚接触递归，部分部分内容可能会有些人生畏，但不要担心。通常，反复阅读材料和代码示例会带来更好的理解。\n\
  \n或者，你也可以跳过本章的内容。第 3 章 包含一个使用递归的二分查找代码示例以及另一个使用迭代方法的代码示例，所以现在可以跳过递归示例。但是，如果你计划学习树，你只需要学习递归，这是\
  \ 第 5 章 中所有树相关示例的基础。\n\n### 什么是递归？\n\n递归算法可以为通过迭代算法实现的任务提供非常优雅的解决方案。对于某些任务（如计算阶乘），递归解决方案和迭代解决方案的代码复杂度相当。\n\
  \n作为一个简单的例子，假设我们要相加从 1 到 n（包含 n）的整数，令 n = 10 以得到一个具体的例子。如果我们定义 S 为连续相加整数的部分和，那么我们如下：\n\
  \n```\n S = 1\nS = S + 2\nS = S + 3\n. . .\nS = S + 10\n```\n\n如果我们定义 S(n) 为前 n\
  \ 个正整数的和，那么存在如下关系：\n\n```\n S(1) = 1\nS(n) = S(n-1) + n 对于 n > 1\n```\n\n考虑到上述观察，下一节将包含迭代方法和使用递归方法计算前\
  \ n 个正整数和的代码示例。\n\n### 等差数列\n\n\n\n\n本节将向你展示如何计算一组正整数的和，例如从 1 到 n（包含 n）的。第一个算法使用迭代方法，第二个算法使用递归。\n\
  \n在深入研究代码示例之前，有一种简单的方法可以计算从 1 到 n（包含 n）整数的封闭和，我们将其记为 `S`。这里有两种计算 `S` 的方法，所示：\n\n\
  ```\n S = 1 + 2     + 3     + . . . + (n-1) + n\nS = n + (n-1) + (n-2) + . . . +\
  \ 2     + 1\n```\n\n共有 `n` 列，每列之和都等于 `(n+1)`，因此等号右侧的总和为 `n*(n+1)`。由于等号左侧之和为 `2*S`，我们得到以下结果：\n\
  \n```\n 2*S = n*(n+1)\n```\n\n将等式两边除以 2，得到前 `n` 个正整数等差数列的已知公式：\n\n```\n S = n*(n+1)/2\n\
  ```\n\n顺便提一下，上述公式是由一个厌倦了手动计算的小学生推导出来的：那个学生就是卡尔·F·高斯（当时他才三年级）。\n\n### 计算等差数列（迭代）\n\
  \nListing 2.1 显示了 `ArithSum.java` 的内容，展示了如何使用迭代方法计算从 1 到 n（包含 n）的和。\n\n***Listing\
  \ 2.1: ArithSum.java***\n\n```java\n public class ArithSum\n{\n   public static\
  \ int calcsum(int num)\n   {\n      int sum = 0;\n      for(int i=1; i<num+1; i++)\n\
  \      {\n          sum += i;\n      }\n\n      return sum;\n   }\n\n   public static\
  \ void main(String[] args)\n   {\n      int sum = 0, max = 20;\n\n      for(int\
  \ j=2; j<max+1; j++)\n      {\n          sum = calcsum(j);\n          System.out.println(\"\
  Sum from 1 to \"+j+\" = \"+sum);\n      }\n   }\n}\n```\n\nListing 2.1 从一个静态方法 `calcsum()`\
  \ 开始，该方法包含一个循环，遍历从 1 到 `num+1`（包含）的数字，其中 `num` 是该函数参数的值。在每次迭代中，变量 `sum`（初始化为 0）加上循环变量的值，并返回最终的\
  \ `sum`。\n\nListing 2.1 的下部分定义了 `main()` 方法，它将标量变量 `sum` 初始化为 0，将 `max` 初始化为 20，接着是一个从\
  \ 2 到 `max+1` 的循环。在每次迭代中，使用循环变量的当前值调用 `calcsum()` 方法并打印返回值。运行 Listing 2.1 中的代码，你将看到以下输出：\n\
  \n```\n sum from 1 to 2 = 3\nsum from 1 to 3 = 6\nsum from 1 to 4 = 10\nsum from\
  \ 1 to 5 = 15\nsum from 1 to 6 = 21\nsum from 1 to 7 = 28\nsum from 1 to 8 = 36\n\
  sum from 1 to 9 = 45\nsum from 1 to 10 = 55\nsum from 1 to 11 = 66\nsum from 1 to\
  \ 12 = 78\nsum from 1 to 13 = 91\nsum from 1 to 14 = 105\nsum from 1 to 15 = 120\n\
  sum from 1 to 16 = 136\nsum from 1 to 17 = 153\nsum from 1 to 18 = 171\nsum from\
  \ 1 to 19 = 190\nsum from 1 to 20 = 210\n```\n\n### 计算等差数列（递归）\n\nListing 2.2 显示了\
  \ `ArithSumRecursive.py` 的内容，展示了如何使用递归方法（注：此处此处原文描述为迭代但实际代码为递归）计算从 1 到 n（包含 n）的和。\n\
  \n***Listing 2.2: ArithSumRecursive.java***\n\n```python\n public class ArithSumRecursive\n\
  { \n   public static int calcsum(int num)\n   {\n      if(num == 0)\n      {\n \
  \       return num;\n      }\n      else\n      {\n        return num + calcsum(num-1);\n\
  \      }\n   }\n\n   public static void main(String[] args)\n   {\n      int sum\
  \ = 0, max = 20;\n\n      for(int j=2; j<max+1; j++)\n      {\n          sum = calcsum(j);\n\
  \          System.out.println(\"Sum from 1 to \"+j+\" = \"+sum);\n      }\n   }\n\
  }\n```\n\nListing 2.2 从一个静态方法 `calcsum()` 开始，如果 `num` 等于 0 则返回 `num`，否则递归地调用 `calcsum(num-1)`\
  \ 并返回 `num` 加上其结果。Listing 2.2 的后续部分定义了 `main()` 方法，它将标量变量 `sum` 初始化为 0，`max` 初始化为\
  \ 20，接着是一个从 2 到 `max+1` 的循环。在每次迭代中，使用循环变量的当前值调用 `calcsum()` 方法并打印返回值。（注：原文此处处误写为\
  \ Listing 2.1）。\n\n### 计算部分和\n\nListing 2.3 显示了 `partial_sum.py` 的内容，展示了如何使用迭代方法计算\
  \ `m` 到 `n` 的数字的和，其中 `m` 和 `n` 是两个满足 `m <= n` 的正整数。\n\n***Listing 2.3: ArithPartialSum.java***\n\
  \n```java\n public class ArithPartialSum\n{\n   public static int calcPartialSum(int\
  \ m, int n)\n   {\n      if(n > m)\n      {\n         return 0;\n      }\n     \
  \ else\n      {\n         return n*(n+1)/2 - m*(m-1)/2;\n      }\n   }\n\n   public\
  \ static void main(String[] args)\n   {\n      int sum = 0, max = 8;\n\n      for(int\
  \ i=2; i<=max; i++)\n      {\n         for(int j=i+1; j<=max; j++)\n         {\n\
  \            sum = calcPartialSum(j,i);\n            System.out.println(\"Sum from\
  \ \"+i+\" to \"+j+\" = \"+sum);\n         }\n      }\n   }\n}\n```\n\nListing 2.3\
  \ 从一个静态方法 `calcPartialSum()` 开始，它包含条件逻辑：如果 `n >= m` 则返回 0，否则返回 `else` 子句中的表达式。Listing\
  \ 2.3 的后续部分定义了 `main()` 方法，它将标量变量 `sum` 初始化为 0，`max` 初始化为 8，接着是一个从 2 到 `max` 的外层循环。在每次迭代中，内层循环从\
  \ `i+1` 迭代到 `max`，其中 `i` 是外层循环的变量。内层循环调用参数为 `j` 和 `i` 的 `calcPartialSum()` 方法并打印返回值。运行\
  \ Listing 2.1 中的代码，你将看到以下输出：\n\n```\n Sum from 2 to 3 = 5\nSum from 2 to 4 = 9\n\
  Sum from 2 to 5 = 14\nSum from 2 to 6 = 20\nSum from 2 to 7 = 27\nSum from 2 to\
  \ 8 = 35\nSum from 3 to 4 = 7\nSum from 3 to 5 = 12\nSum from 3 to 6 = 18\nSum from\
  \ 3 to 7 = 25\nSum from 3 to 8 = 33\nSum from 4 to 5 = 9\nSum from 4 to 6 = 15\n\
  Sum from 4 to 7 = 22\nSum from 4 to 8 = 30\nSum from 5 to 6 = 11\nSum from 5 to\
  \ 7 = 18\nSum from 5 to 8 = 26\nSum from 6 to 7 = 13\nSum from 6 to 8 = 21\nSum\
  \ from 7 to 8 = 15\n```\n\n### 等比数列\n\n本节将向你展示如何计算一组正整数的等比数列，例如从 1 到 n（包含 n）的。第一个算法使用迭代方法，第二个算法使用递归。\n\
  \n在深入研究代码示例之前，有一种简单的方法可以计算从 1 到 n（包含 n）等比数列的封闭和，其中 `r` 是等比数列相邻项之间的比例。让 `S` 表示和，其表达式如下：\n\
  \n```\n S   = 1+ r + r² + r³ + . . . + r^(n-1) + r^n\nr*S =    r + r² + r³ + . .\
  \ . + r^(n-1) + r^n + r^(n+1)\n```\n\n将上述第二行的每一项减去第一行对应的项，我们得到以下结果：\n\n```\n S -\
  \ r*S = 1 - r^(n+1)\n```\n\n从上述等式左侧的两项中提取 `S`，我们得到以下结果：\n\n```\n S*(1 - r) = 1 -\
  \ r^(n+1)\n```\n\n将上述等式两边除以项 `(1-r)`，得到前 `n` 个正整数等比数列求和公式：\n\n```\n S = [1 - r^(n+1)]/(1-r)\n\
  ```\n\n注意如果 `r = 1`，上述方程将返回无穷值。\n\n### 计算等比数列（迭代）\n\nListing 2.4 显示了 `GeometricSum.py`\
  \ 的内容，展示了如何使用迭代方法计算从 1 到 n（包含 n）的和。\n\n***Listing 2.4: GeometricSum.java***\n\n\n\
  \n\n```\n public class GeometricSum\n{ \n   public static int geomsum(int num, int\
  \ ratio)\n   {\n      int partial = 0;\n      int power   = 1;\n      int sum  \
  \   = 0;\n\n      for(int i=1; i<num+1; i++)\n      {\n          partial += power;\n\
  \          power *= ratio;\n          sum += i;\n      }\n\n      return partial;\n\
  \   }\n\n   public static void main(String[] args)\n   {\n      int ratio = 2, max\
  \ = 10, prod = 0;\n\n      for(int j=2; j<max+1; j++)\n      {\n         prod =\
  \ geomsum(j, ratio);\n         System.out.println(\"Geometric sum for ratio = \"\
  +ratio+\" from 1 to \"+j+\" = \"+prod);\n      }\n   }\n}\n```\n\nListing 2.4 从一个静态方法\
