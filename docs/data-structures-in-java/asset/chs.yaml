  => pushing values onto mystack:\n1000\n2000\n8000\n5000\n-1000\nMinimum value: -1000\n\
  Maximum value: 8000\n```\n\n\n\n\n```java\n import java.util.ArrayList;\n\npublic\
  \ class StackPalindrome\n{\n   static int MAX = 40; // 100\n   static ArrayList\
  \ mystack = new ArrayList();\n\n   public static Boolean isEmpty()\n   {\n     \
  \ return mystack.size() == 0;\n   }\n\n   public static Boolean isFull()\n   {\n\
  \      return mystack.size() == MAX;\n   }\n\n   public static void push(char item)\n\
  \   {\n      if(isFull() == false) {\n        mystack.add(item);\n        //System.out.println(\"\
  appended stack item: \"+item);\n      } else {\n         System.out.println(\"stack\
  \ is full: cannot append \"+item);\n         //System.out.println(\"Current stack\
  \ size: \"+mystack.size());\n      } \n   }\n\n   public static void main(String[]\
  \ args)\n   {\n      Boolean palindrome = true;\n      String[] myStrings = new\
  \ String[]\n         {\"abc\", \"bob\", \"radar\", \"abcdefdcba\"};\n      // compare\
  \ characters from opposite ends of the ArrayList:\n      for(String currStr : myStrings)\
  \ \n      {\n         palindrome = true;\n         char item1, item2;\n        \
  \ for(int idx=0; idx<currStr.length()/2; idx++) \n         {\n            item1\
  \ = currStr.charAt(idx);\n            item2 = currStr.charAt(currStr.length()-idx-1);\n\
  \            if(item1 != item2) {\n               palindrome = false;\n        \
  \       break; \n            }\n         }\n         System.out.println(\"string:\
  \     \"+currStr);\n         System.out.println(\"palindrome: \"+palindrome);\n\
  \         System.out.println();\n      }\n   }\n}\n```\n\n列表 7.9 首先将变量 `mystack`\
  \ 定义为 `ArrayList` 类的一个实例，该类代表一个栈（stack）。此外，列表 7.9 包含了 `isEmpty()`、`isFull()`、`push()`\
  \ 和 `main()` 方法，分别用于检查栈是否为空、检查栈是否满、在栈上放置新项以及 `main()` 方法。\n\n`isEmpty()` 方法根据栈的大小是否为\
  \ 0 返回一个 `Boolean` 值，而 `isFull()` 方法则根据栈的大小是否为 `MAX`（即栈允许的最大大小）返回一个 `Boolean` 值。`push()`\
  \ 方法首先检查 `isFull()` 方法是否返回 `false`；如果是，则向栈中添加一个项。否则，将打印一条消息指示栈已满。\n\n`main()` 方法将变量\
  \ `myStrings` 初始化为字符串数组，随后通过一个循环遍历 `myStrings` 中的每一个元素。在每次迭代中，都会对给定字符串两端的端元素进行比较：如果它们不同，则说明该字符串不是回文，变量\
  \ `palindrome` 被设置为 `false`，并通过 `break` 语句提前退出循环。循环执行完毕后，将显示当前字符串以及一条指示该字符串是否为回文的消息。在列表\
  \ 7.12 中运行该代码，你将看到以下输出：\n\n```\n string:     abc\npalindrome: false\n\nstring: \
  \    bob\npalindrome: true\nstring:     radar\npalindrome: true\n\nstring:     abcdefdcba\n\
  palindrome: false\n```\n\n### 任务：平衡括号\n\n列表 7.10 显示了文件 `StackBalancedParens.java`\
  \ 的内容，该文件演示了如何使用栈结构来判断一个字符串是否包含平衡括号。\n\n***列表 7.10: StackBalancedParens.java***\n\
  \n```java\n import java.util.ArrayList;\n\npublic class StackBalancedParentheses\n\
  {\n   static int MAX = 100; \n   static ArrayList mystack = new ArrayList();\n\n\
  \   public static Boolean isEmpty()\n   {\n      return mystack.size() == 0;\n \
  \  }\n\n   public static Boolean isFull()\n   {\n      return mystack.size() ==\
  \ MAX;\n   }\n\n   public static void push(char item)\n   {\n      if(isFull() ==\
  \ false) {\n        mystack.add(item);\n      } else {\n         System.out.println(\"\
  stack is full: cannot append \"+item);\n      } \n   }\n\n   public static Boolean\
  \ pair_in_balan_pairs(String[] balan_pairs, String str) \n   {\n     for(String\
  \ elem : balan_pairs) {\n       if(elem.contains(str))\n         return true;\n\
  \     } \n     return false;\n   }\n\n   public static Boolean check_balanced(String\
  \ my_expr) \n   {\n     String left_chars  = new String(\"([{\");\n     String right_chars\
  \ = new String(\")]}\");\n     String[] balan_pairs = new String[]{\"'()'\",\"'[]'\"\
  ,\"'{}'\"};\n     ArrayList my_stack = new ArrayList();\n\n     System.out.println(\"\
  checking string: \"+my_expr);\n     for(int idx=0; idx<my_expr.length(); idx++)\
  \ {\n       char char1      = my_expr.charAt(idx);\n       String char1Str = String.valueOf(char1);\n\
  \       //System.out.println(\"char: \"+char1);\n\n       if(left_chars.contains(char1Str))\
  \ {\n         my_stack.add(char1);\n       } else if(right_chars.contains(char1Str))\
  \ {\n         if(my_stack.size() > 0) {\n           String topStr = (String)my_stack.get(my_stack.size()-1);\n\
  \           String two_chars = topStr + char1Str;\n\n           if(pair_in_balan_pairs(balan_pairs,\
  \ two_chars)) {\n             my_stack.remove(my_stack.size()-1);\n            \
  \ if(my_stack.size() == 0) {\n               my_stack = new ArrayList();\n     \
  \          System.out.println(\"new stack: \"+my_stack);\n               continue;\n\
  \             } else {\n               System.out.println(\"non-match: \"+char1);\n\
  \               break;\n             } \n         } else {\n           System.out.println(\"\
  empty stack: \"+my_expr);\n           return false;\n         }\n       } else {\n\
  \         System.out.println(\"invalid character: \"+char1);\n         return false;\n\
  \       } \n     }\n\n     return (my_stack.size() == 0);\n   }\n\n   public static\
  \ void main(String[] args)\n   {\n      String[] exprs = new String[]{\"[()]{()}\"\
  ,\n                                    \"[()]{()()]\",\n                       \
  \             \"(()]{()()]\",\n                                    \"(())(()()]\"\
  };\n\n      for(String expr : exprs) {\n        if( check_balanced(expr))\n    \
  \      System.out.println(\"=> balanced:     \"+expr);\n        else\n         \
  \ System.out.println(\"=> unbalanced:   \"+expr);\n        System.out.println();\n\
  \      }\n   }\n}\n```\n\n\n\n例如，假设字符串 `my_expr` 初始化为“()”。第一个字符是“(”，它是一个左括号：上述步骤\
  \ #1 告诉我们将 `(` 推入到我们（起初是为空的）名为 `mystack` 的栈中。`my_expr` 中的下一个字符是“)”，它是一个右括号：步骤 #2\
  \ 告诉我们将“)”与栈顶的元素进行比较，该栈顶元素是“(`。由于“(”和“)”组成了一对平衡的括号，我们从栈中弹出元素 `(`。我们已经到达了 `my_expr`\
  \ 的末尾，由于栈是空的，我们得出结论：“()”是一个平衡表达式（我们已经知道这一点）。\n\n现在假设字符串 `my_expr` 初始化为“((”。第一个字符是“(”，它是一个左括号，上述步骤\
  \ #1 告诉我们将 `(` 推入到我们（起初是为空的）名为 `mystack` 的栈中。`my_expr` 中的下一个字符是“(”，它也是一个左括号：上述步骤\
  \ #1 告诉我们再次向栈中推入另一个 `(`。我们已经到达了 `my_expr` 的末尾，由于栈不是空的，我们确定 `my_expr` 是不平衡的。\n\n\
  第三个例子，假设字符串 `my_expr` 初始化为“(()”。第一个字符是“(”，它是一个左括号：上述步骤 #1 告诉我们将 `(` 推入到我们（起初是为空的）名为\
  \ `mystack` 的栈中。`my_expr` 中的下一个字符是“(”，它是一个左括号：上述步骤 #1 告诉我们再次向栈中推入另一个 `(`。`my_expr`\
  \ 中的下一个字符是“)”，步骤 #2 告诉我们将“)”与栈顶的元素进行比较，该栈顶元素是“(”。由于“(”和“)”组成了一对平衡的括号，我们弹出栈顶元素。此时，我们已经到达了\
  \ `my_expr` 的末尾，由于栈不是空的，我们知道 `my_expr`是不平衡的。\n\n尝试使用包含括号序列的额外字符串跟踪代码执行。在完成之后，列表\
  \ 7.13 中的代码细节将变得更加容易理解。\n\n列表 7.13 中的下一个代码块将变量 `my_expr` 初始化为字符串数组，每个字符串都由各种括号（圆括号、方括号和花括号）组成。下一部分是一个循环，遍历\
  \ `my_expr` 的元素，并依次调用函数 `check_balanced` 来确定哪些元素（如果有的话）由平衡括号。运行列表 7.13 中的代码，你将看到以下输出：\n\
  \n```\n checking string: [()]{}{[()()]()}\n=> balanced:     [()]{}{[()()]()}\n\n\
  checking string: [()]{}{[()()]()]\n=> unbalanced:   [()]{}{[()()]()]\nchecking string:\
  \ (()]{}{[()()]()]\n=> unbalanced:   (()]{}{[()()]()]\n\nchecking string: (())(()()()()()]\n\
  => unbalanced:   (())(()()()()()]\n```\n\n考虑增强列表 7.13，使得对于包含不平衡括号的字符串可以显示无效字符。\n\
  \n### 任务：算术表达式的分词\n\n本节中的代码示例是下一节任务的序曲，该任务涉及解析算术表达式：事实上，列表 7.11 中的代码被包含在列表 7.11\
  \ 的代码中。包含独立代码示例的目的是让你能够对可能不是算术表达式的表达式进行分词。\n\n你需要下载 zip 文件 `apache-commons-lang.jar.zip`，解压\
