  \n## JAVA 的 new 运算符\n\n上一节包含了几个在 Java 中直接赋值字符串的示例。另一种方法涉及使用 `new` 运算符，它在表面上看起来相同，但有一个重要的区别。当你用相同的字符串初始化两个变量时（如列表\
  \ 1.6 所示），它们占据相同的内存位置。而当你使用 `new` 运算符时，这两个变量将占据不同的内存位置。\n\n列表 1.6 显示了 `ShowPeople.java`\
  \ 的内容，该程序使用 `new` 运算符初始化两个字符串并打印它们的值。\n\n***列表 1.6: ShowPeople.java***\n\n```\n\
