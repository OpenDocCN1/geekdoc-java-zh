  \ `str1` 和 `str2`，然后用字符串变量 `index` 初始化字符串 `str1` 在字符串 `str2` 中的索引位置。如果结果为负，则则 `str1`\
  \ 不是 `str2` 的子字符串，并打印一条消息。如果 `str1` *是* `str2` 的子字符串，则显示相应的消息。运行列表 1.9 中的代码，你将看到以下输出：\n\
  \n```\nzz is not a substring of Pizza\n```\n\n\n\n\n\nJava `String` 类支持许多实用且命名直观的方法，用于字符串相关操作，包括：`compare()`、`compareTo()`、`concat()`、`equals()`、`intern()`、`length()`、`replace()`、`split()`\
  \ 和 `substring()`。\n\nJava `String` 类包含了一些非常实用的管理方法，这里列出了其中一部分（你可能已经见过其中一个）：\n\n\
  * `substring(idx1, idx2)`：从索引 `idx1` 到 `idx2` 的子字符串\n* `compareTo(str)`：将字符串与给定的字符串进行比较\n\
  * `indexOfStr(str)`：在另一个字符串中查找字符串的索引\n* `lastIndexOfStr(str)`：在另一个字符串中查找字符串最后一次出现的索引\n\
  \n列出列表 1.9 显示了 `CapitalizeFirstAll.java` 的内容，该示例说明了如何使用 `substring()` 方法将字符串中每个单词的首字母大写化，如何将字符串转换为全小写，以及如何将字符串转换为全大写。注意，此示例使用了循环，但此代码样本中的执行过程应该是非常直观的。\n\
  \n**列表 1.9: CapitalizeFirstAll.java**\n\n```\n public class BooleanExamples\n{\n\
