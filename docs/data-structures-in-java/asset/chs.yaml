  \ 200 \nSorted:\n-100 20 50 80 200 500 \n```\n\n### 总结\n\n本章从搜索算法开始，例如线性搜索和二分查找（迭代式）。你还学习了冒泡排序、合并排序和快速排序。最后，你学习了直接插入排序及其变体。\n\
  \n## 第 5 章：链表 (1)\n\n本章向你介绍了链表，包括单向链表和双向链表。第 6 章 包含了与链表相关的常见任务。如果你已经熟悉链表，那么你可能已经准备好学习\
  \ 第 6 章。\n\n### 数据结构的类型\n\n本节向你介绍了线性数据结构概念，例如栈和队列（并简要描述了非线性数据结构，如树和图），这是第 5 章、第\
  \ 6 章 和第 7 章 的重点。\n\n#### 线性数据结构\n\n*线性*数据结构是元素顺序顺序内存位置或逻辑上连接的数据结构，例如栈和队列。正如你在第\
  \ 7 章 中看到的，栈是后进先出 (LIFO) 数据结构，这意味着最后一个插入的元素是第一个删除的元素。此外，操作是在栈的一端进行的。栈在现实中的对应物是一个只有一个入口也是唯一出口的电梯。\n\
  \n在第 7 章 中，你还将学习队列，它是先进先出 (FIFO) 数据结构，这意味着第一个插入的元素是第一个删除的元素。与栈相比，插入操作在队列的所谓“前端”执行，删除操作在队列的“尾部”执行。队列在现实中的对应物是排队买电影票的人群。\n\
  \n#### 非线性数据结构\n\n*非线性*数据结构是元素非顺序的数据结构，例如树和图。树有一个称为根节点的节点，该节点没有父节点，而其他其他节点恰好有一个父节点。如果两个节点之间存在边，则这两个节点是相关的。\n\
  \n\n\n\n图是树的推广，图中的节点可以有多个父节点。图没有根节点，而是有一个被称为“源”（source）的节点和一个被称为“汇”（sink）的节点，它们在某种类似于“开始”节点和“结束”节点。这种标记出现在表示传输网络的图中，网络中的边可以被分配权重。想象一下从仓库（“源”）运输食品或其他其他商品的大卡车，它们有多条路线可以到达目的地（“汇”）。\n\
  \n### 数据结构与操作\n\n在本书中，单链表的数据结构是一个自定义的 `Node` 结构，它包含以下内容：\n\n1. 一个键/值对\n2. 指向下一个节点的指针\n\
  \n双向链表的数据结构是一个自定义的 `Node`，它包含以下内容：\n\n1. 一个键/值对\n2. 指向下一个节点的指针\n3. 指向上一个节点的指针\n\n\
  栈和队列的数据结构都是 Java 的 `list`。\n\n树的数据结构是一个自定义节点，包含以下内容：\n\n1. 一个键/值对\n2. 指向左侧节点的指针\n\
  3. 指向右节点的指针\n\n哈希表的数据结构是 Java 的 `dictionary`。上述结构是基于简单性的考虑；但请记住，其他结构也是可能的。例如，你可以使用数组来实现列表、栈、队列，甚至是树。\n\
  \n#### 数据结构的操作\n\n正如你稍后在本章以及其他章节中看到的，对这些数据结构的操作通常涉及以下内容：\n\n1. 插入（insert）（包括追加 append）\n\
  2. 删除（delete）\n3. 搜索（search）\n4. 更新（现有元素）\n5. 检查结构是否为空\n6. 检查结构是否满（队列和栈）\n\n###\
  \ 什么是单链表？\n\n虽然数组是有用的数据结构，但它们的缺点之一是数组的大小或元素数量必须提前获知。不具备这种缺点的另一种替代方案是“链表”，这正是本章的主题。\n\
  \n单链表是数据元素的集合，通常称为节点。给定一个节点，它包含两个部分：\n\n```\n1. 存储在节点中的值，以及\n2. 指向下一个节点的引用（称为其继节点）\n\
  ```\n\n通过类比的方法，想象一条康加舞队列：每个舞者都是一个节点，舞者将手放在另一个舞者的臀部上：后一个舞者就是下一个节点的位置。\n\n与数组不同，链表是根据需要动态创建的。此外，前面的类比清楚地说明了：存在一个“最后一个”节点，它没有下一个节点。因此，列表中的最后一个节点的后继节点为\
  \ `None`（即下一个节点）。\n\n通常情况下，单链表中的节点可以是以下三种类型之一：\n\n```\n1) “根”节点\n2) 中间节点\n3) 最后一个节点（没有后继元素）\n\
  ```\n\n当然当然，当链表为空时，那么前述列表中的节点全为 `None`。\n\n#### 链表的权衡\n\n每个数据结构都有权衡，也就是说既有优点也有缺点。特别地，链表具有以下优势：\n\
  \n1. 易于向列表中追加元素\n2. 易于在列表中插入元素\n3. 易于从列表中删除元素\n4. 不需要预先知道列表的节点计数\n\n与数组不同，上述项目符号列表中的操作不需要“移动”数组的元素：只需要更新引用即可。\n\
  \n然而，链表确实也有缺点：\n\n1. 搜索元素更困难（耗时更长）\n2. 需要更大的内存\n\n因此，当元素数量已知且没有插入或删除（仅有更新）时，数组效果更好；当数据元素数量未知时，链表效果更好。\n\
  \n与数组不同，链表的元素可以存储在非连续的内存位置：`next` 字段的值提供了链表中下一个节点的位置（具有 `None` 作为下一个结的 `LAST` 节点除外）。\n\
  \n### 单链表：创建与追加操作\n\n链表支持多种操作，包括插入（添加新节点）、删除（现有节点）、更新（更改现有节点的值）和遍历（列出所有节点）。以下子节将更详细讨论上述操作。\n\
  \n#### 用于单链表的节点类\n\nListing 5.1 显示了 `SLNode.java` 的内容，它阐释了如何定义一个表示链表中单个节点的简单 Java\
  \ 类。\n\n***Listing 5.1: SLNode.py***\n\n```java\n public class SLNode\n{ \n   static\
  \ class Node {\n     String data = \"\";\n     public Node(String data) {\n    \
  \   this.data = data;\n       Node next = null;\n     }\n   }\n\n   public static\
  \ void main(String[] args)\n   {\n      Node node1 = new Node(\"Jane\");\n     \
  \ Node node2 = new Node(\"Dave\");\n      Node node3 = new Node(\"Stan\");\n   \
  \   Node node4 = new Node(\"Alex\");\n\n      System.out.println(\"node1.data: \"\
  +node1.data);\n      System.out.println(\"node2.data: \"+node2.data);\n      System.out.println(\"\
  node3.data: \"+node3.data);\n      System.out.println(\"node4.data: \"+node4.data);\n\
  \   }\n}\n```\n\nListing 5.1 非常直观：它用指定的值初始化变量。\n\n#### 追加节点的 Java 代码\n\nListing\
  \ 5.2 显示了 `AppendNode.java` 的内容，它阐释了创建链表并追加节点的更好方法。\n\n***Listing 5.2: AppendNode.java***\n\
  \n```java\n public class AppendNode\n{\n   static class Node {\n     String data\
  \ = \"\";\n     Node next = null;\n\n     public Node(String data) {\n       this.data\
  \ = data;\n       Node next = null;\n     }\n   }\n\n   public static Node[] append_node(Node\
  \ ROOT, Node LAST, String item)\n   {\n     if (ROOT == null) {\n       ROOT = new\
  \ Node(item);\n       //System.out.println(\"1Node: \"+ROOT.data);\n     } else\
  \ {\n       if (LAST.next == null) {\n         Node NEWNODE = new Node(item);\n\
  \         LAST = NEWNODE;\n         ROOT.next = LAST;\n         //System.out.println(\"\
  2Node: \"+NEWNODE.data);\n       } else {\n         Node NEWNODE = new Node(item);\n\
  \         LAST.next = NEWNODE;\n         LAST = NEWNODE;\n         //System.out.println(\"\
  3Node: \"+NEWNODE.data);\n       }\n     }\n     Node[] results = new Node[2];\n\
  \     results[0] = ROOT;\n     results[1] = LAST;\n     return results;\n   }\n\n\
  \   public static void main(String[] args)\n   {\n      Node[] results = new Node[2];\n\
  \      Node ROOT = null;\n      Node LAST = null;\n\n      // 向列表追加项：\n      String[]\
  \ items = new String[]{\"Stan\", \"Steve\", \"Sally\", \"Alex\"};\n      for(String\
  \ item : items) {\n        results = append_node(ROOT, LAST, item);\n        ROOT\
  \ = results[0];\n        LAST = results[1];\n      }\n\n      // 显示列表中的项:\n    \
  \  Node CURR = ROOT;\n      while(CURR != null) {\n        System.out.println(\"\
  Node: \"+CURR.data);\n        CURR = CURR.next;\n      }\n   }\n}\n```\n\n#### 在链表中查找节点\n\
  \nListing 5.3 显示了 `FindSLNode2.java` 的内容，它阐释了如何在链表中查找节点。\n\n\n\n\n```java\n public\
