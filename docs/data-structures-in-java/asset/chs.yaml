  \ 初始化为 `i` 的二进制字符串。接下来，`bin_value` 是 `i` 的字符串值。运行 Listing 3.2 中的代码，你将看到以下输出：\n\n\
  ```\n Binary values of width 1:\n0\nBinary values of width 2:\n0\n1\nBinary values\
  \ of width 3:\n0\n1\n10\n11\n```\n\n### 任务：两个二进制数字的公共子串\n\nListing 3.3 显示了 `CommonBits.java`\
  \ 的内容，演示了如何找到两个字符串的公共子串。\n\n***LISTING 3.3: CommonBits.java***\n\n```\n public class\
  \ CommonBits\n{\n   public static int commonBits(int num1, int num2)\n   {\n   \
  \   String bin_str1 = Integer.toBinaryString(num1);\n      String bin_str2 = Integer.toBinaryString(num2);\n\
  \n      int common = 0;\n      String common_bits = \"\";\n      for (int i = 0;\
  \ i < bin_str1.length(); i++)\n      {\n        if (bin_str1.charAt(i) == bin_str2.charAt(i)\
