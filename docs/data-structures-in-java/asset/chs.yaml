  另一个关键点：一个子列表包含小于基准项（pivot）的值，而另一个子列表包含大于基准项的值。在理想情况下，两个子列表的长度大致相同。这导致子列表发生类似于二分的拆分，涉及到\
  \ `log N` 次快速排序算法的调用，其中 `N` 是列表中元素的总数。\n\n关于快速排序，有几点需要注意。首先，两个子列表长度大致相同的情况是效率最高的情况。然而，为了达到最优效果，这种情况需要对给定列表中的数据分布有先验了解。\n\
  \n其次，如果列表包含的值接近随机分布，那么在这种情况下，第一个值或最后一个值是作为基准项的常见选择。第三，当列表中的值已经过过时，快速排序的性能最差。在这种情况下，请通过以下方式之一选择基准项：\n\
  \n- 选择列表的中间的项。\n- 选择列表中第一个、中间和最后一个项的中位数。\n\n### 快速排序代码示例\n\n`代码列表 4.10` 显示了 `QuickSort.java`\
  \ 的内容，阐明了如何对数字数组进行快速排序。\n\n***列表 4.10: QuickSort.java***\n\n```java\n public class\
  \ QuickSort\n{\n   public static void sort(int[] values) {\n     quicksort(values);\n\
  \   }\n\n   public static void quicksort(int[] arr) {\n     if(arr.length == 0)\n\
  \       return;\n     else\n       quicksort(arr, 0, arr.length - 1);\n   }\n\n\
  \   // 递归地对区间 [lo, hi] 进行原地排序\n   public static void quicksort (int[] arr, int lo,\
  \ int hi) \n   {\n     if (lo < hi) {\n       int splitPoint = partition(arr, lo,\
  \ hi);\n       quicksort(arr, lo, splitPoint);\n       quicksort(arr, splitPoint\
  \ + 1, hi);\n     }\n   }\n\n   // 为快速排序执行 Hoare 分算法\n   public static int partition(int[]\
  \ arr, int lo, int hi) \n   {\n     int pivot = arr[lo];\n     int i = lo - 1;\n\
  \     int j = hi + 1;\n\n     while (true) {\n       do {\n         i += 1;\n  \
  \     }\n       while (arr[i] < pivot);\n\n       do {\n         j -= 1;\n     \
  \  }\n       while (arr[j] > pivot);\n\n       if (i < j) swap(arr, i, j);\n   \
  \    else return j;\n     }\n   }\n\n   // 交换两个元素\n   public static void swap(int[]\
  \ arr, int i, int j)\n   {\n     int tmp = arr[i];\n     arr[i] = arr[j];\n    \
  \ arr[j] = tmp;\n   }\n\n   public static void main(String[] args)\n   {\n     \
  \ int[] array = new int[]{10, 4, 6, 4, 8, -13, 2, 3};\n      System.out.println(\"\
  Initial array:\");\n      for (int num : array )\n        System.out.print(num+\"\
  \ \");\n      System.out.println();\n\n      sort(array);\n      System.out.println(\"\
  Sorted array:\");\n      for (int num : array )\n        System.out.print(num+\"\
  \ \");\n      System.out.println();\n   }\n}\n```\n\n`代码列表 4.10` 包含了以下静态方法的定义，随后是\
  \ `main()` 方法：\n\n- `sort()`\n- `quicksort()`\n- `partition()`\n- `swap()`\n\n`sort()`\
  \ 方法调用重载方法 `quicksort()`，而如果参数 `arr`（一个数组）的长度不为零，则该方法反过来调用第二个 `quicksort()` 方法。\n\
  \n接下来，第二个 `quicksort()` 方法包含条件逻辑，当参数 `lo` 小于参数 `hi` 时执行，这涉及到三个代码片段。第一个代码片段使用执行方法\
  \ `partition()` 的结果来初始化值 `splitPoint`，该方法将在稍后讨论。第二个代码片段使用一组参数递归地调用当前的 `quicksort()`\
  \ 方法，随后使用另一组参数进行另一次递归调用以执行当前的 `quicksort()` 方法。\n\n`代码列表 4.10` 的下一部分是 `partition()`\
  \ 方法，它执行快速排序算法的“重型工作”。该方法通过初始化变量 `pivot`、`i` 和 `j` 开始，其值分别为 `arr[lo]`、`lo-1` 和 `hi+1`，这些都是当前方法的参数。\n\
  \n`partition()` 方法中的剩余代码由一个 `while` 循环组成，其中包含两个 `do-while` 循环和一个 `if/else` 语句。第一个\
  \ `while` 循环只要 `arr[i]` 的值小于 `pivot` 的值，就会增加 `i` 的值；而第二个 `while` 循环只要 `arr[j]` 的值大于\
  \ `pivot` 的值，就会减小 `j` 的值。接下来的，如果 `i` 小于 `j`，`if/else` 语句调用 `swap()` 方法；否则，该方法返回\
  \ `j`。\n\n`代码列表 4.10` 的后续部分是 `main()` 方法，它负责显示数组的内容。\n\n### SHELL SORT\n\n快速排序与泡泡排序相似，它们都会比较元素并交换它们。然而，泡泡排序不比较相邻元素，而\
  \ Shell 排序首先比较间距较远的元素，并在每次通过后缩小间隔的大小。\n\n`代码列表 4.11` 显示了 `ShellSort.java` 的内容，阐明了如何在\
  \ Java 中实现 Shell 排序。\n\n***列表 4.11: ShellSort.java***\n\n排序的元素。\n\n\n\n\nListing\
