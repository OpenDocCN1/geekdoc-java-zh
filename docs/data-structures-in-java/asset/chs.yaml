  \n### 斐波那契数列\n\n斐波那契数列在现实中有对应，例如向日葵种子的模式以及树枝形成的位置。以下是斐波那契数列的定义：\n\n```\n Fib(0)\
  \ = 0\nFib(1) = 1\nFib(n) = Fib(n-1)+Fib(n-2) for n >= 2\n```\n\n注意，可以为 `Fib(0)`\
