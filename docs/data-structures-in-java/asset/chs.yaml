- "# Java 数据结构入门指南\n\n\n\n![](img/9781683929550.jpg)\n\n\n\n\n\n\nO. Campesato. *Data\
  \ Structures in Java.*\nISBN: 978-1-68392-955-0\n\n\n\n\n\n*我想将这本书献给我的父母——愿这能给他们的生活带来喜悦和幸福。*\n\
  \n# 前言\n\n## 本书的核心价值/价值主张是什么？\n\n本书以快节奏介绍了关于 Java 数据结构的尽可能的相关信息，涵盖了在如此大小的书籍中可以合理包含的全部。\n\
  \n## 目标读者群\n\n本书主要面向具有 Java 基础并对学习数据结构感兴趣的人士。本书还面向具有不同年龄段、背景极其多样化的国际读者。虽然许多读者知道如何阅读英语，但他们的母语并非英语（英语可能是他们的第二、第三、甚至是第四种语言）。因此，本书使用了标准英语，而不是可能让这些读者感到困惑的口语化表达。因此，本书致力于为目标读者提供舒适且有意义的学习体验。\n\
  \n## 我能从这本书中学学到什么？\n\n第一章简要介绍了 Java，并包含一些 Java 示例用于检查闰年、寻找数字的约数以及处理字符串数组。第二章介绍了递归，并包含代码示例，用于检查正数是否为质数、寻找正整数的质因数、计算一对正整数的\
  \ `GCD`（最大公约数）和 `LCM`（最小公倍数）。\n\n第三章包含涉及字符串和数组的 Java 示例，例如寻找数字的二进制子字符串、检查字符串是否包含唯一字符、计算范围内数字的位数，以及如何在不使用\
  \ `XOR` 函数的情况下计算 `XOR`。\n\n第 4 至 6 章包含涉及搜索算法、链表概念以及涉及链表任务的 Java 示例。最后，第 7 章讨论了被称为队列和栈的数据结构，并包含了一些\
  \ Java 示例。\n\n## 我需要学习书中的理论部分吗？\n\n再次，答案取决于你计划在 Java 中处理数据结构的什么程度。通常情况下，如果你计划在 Java\
  \ 应用开发中向初级开发者水平迈进，你可能需要学习书中遇到的许多（大部分？）主题。\n\n## 如何从书中获得最大收益\n\n有些程序员擅长从文字中学习，而另一些人擅长从示例代码（大量的代码）中学习，这意味着没有适用于所有人的单一风格。\n\
  \n此外，有些程序员想先运行代码，看看它是做什么的，然后再回到代码研究细节（而另一些人则采用相反的方法）。\n\n因此，书中有各种类型的代码示例：有的很短，有的很长，有些代码示例是基于之前的代码示例“构建”的。\n\
  \n## 读本书之前需要具备什么知识？\n\n基础 Java 知识是最有帮助的，对递归和数据结构的某些接触显然也有帮助。对其他编程语言的了解由于对编程概念和结构的接触也会很有帮助。你的技术知识越少，理解所涵盖的各种主题所需的努力就越大。\n\
  \n\n\n\n\n*如果你想确定自己是否能掌握书中的内容，可以快速浏览一些代码示例，以了解你对哪些内容熟悉，哪些内容对你来说是全新的.*\n\n## 随附文件是否消除了对本书的需求？\n\
  \n随附文件包含了所有代码示例，以节省你通过手动将代码输入文本文件这一容易出错的过程中所花费的时间精力。此外，在某些情况下，你可能无法方便地访问这些文件。而且，书中的代码示例提供了随附文件中未提供的解释。\n\
  \n## 本书是否包含生产级代码示例？\n\n本书中代码示例的主要目的是向你展示如何使用 `Java` 来解决各种编程任务。清晰性比编写更紧凑但更难理解（且可能更容易产生错误）的代码更重要。如果你决定在生产环境中使用书中的任何代码，你理应对对这些代码进行与你代码库中其他部分相同的严谨分析。\n\
  \n另一个需要记住的细节是，书中的许多代码示例包含了“被注释掉”的代码片段（通常是 `println()` 语句），这些片段是在开发代码示例期间使用的。特意包含这些片段是为了让你在想查看代码示例的执行路径时，可以取消任何一个注释。\n\
  \n## 本书的非技术前提条件是什么？\n\n虽然这个问题的答案很难量化，但拥有学习数据结构的强烈愿望，以及阅读和理解代码示例的动力和自律，是尤为重要的。\n\n\
  ## 如何设置命令行？\n\n如果你是 Mac 用户，有三种方法可以实现。第一种是使用 `Finder` 导航到 `Applications > Utilities`，然后双击\
  \ `Utilities` 应用程序。接下来，如果你已经有一个可用的命令行，可以通过输入以下命令启动一个新的命令行：\n\n```bash\nopen /Applications/Utilities/Terminal.app\n\
  ```\n\nMac 用户的第二种方法是在已经显示的命令行中简单通过点击 `command+n` 在 MacBook 上打开一个新命令行，你的 Mac 就会启动另一个命令行。\n\
  \n如果你是 PC 用户，可以安装 `Cygwin` (https://cygwin.com/) 来模拟 `bash` 命令，或者使用其他工具包，例如 `MKS`（一种商业产品）。请阅读描述下载和安装过程的在线文档。请注意，如果自定义别名定义在主启动文件（如\
  \ `.bash_login`）之外的文件中，它们不会自动设置。\n\n## 随附文件\n\n书中的所有代码示例和图表都可以通过向 `info@merclearning.com`\
  \ 发送邮件来获得。\n\n## 完成本书后的“下一步”是什么？\n\n这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。一种可能性涉及学习更复杂的数据结构并在\
  \ `Java` 中实现它们。另一种选择是为涉及 `Java` 的职业面试做准备。\n\n# 第 1 章\n\n## JAVA 简介\n\n这个节奏较快的章节将向你介绍\
  \ `Java` 中的各种主题。\n\n### 关于 Java 的极简介绍\n\n`Java` 是一种面向对象的语言，使你能够在许多平台（包括桌面和移动设备）上运行代码。如果你感兴趣，包含\
  \ `Java`特性列表的 Oracle 网站是：\n\n*[`www.oracle.com/java/`](https://www.oracle.com/java/)*\n\
  \n### 下载版本（短版本）\n\n考虑到大量的 `Java` 版本，你如何决定哪个版本最适合你？答案取决于你的需求，涉及：\n* 你公司使用的 `Java`\
  \ 版本\n* 最新的 `LTS` 版本\n* 你喜欢的 `Java` 版本\n* 你需要的 `Java` 特性\n\n一旦你确定了适合你的 `Java` 版本，导航到以下网站并下载发行版：\n\
  \n*[`docs.oracle.com/javase/10/index.html`](https://docs.oracle.com/javase/10/index.html)*\n\
  \n### 选择 Java 版本（详细版本）\n\n在本书印刷时，`Java 17` 已可用，且 `Java 18` 已于 2022 年发布。旧版本的 `Java`\
  \ 的发布周期有时持续三年或以上，而较新的 `Java` 版本将每六个月发布一次。同时，新版本的更新范围将要小得多。\n\n#### Java 8 和 Java\
  \ 11\n\n`Java 8` 和 `Java 11` 曾拥有 `LTS`（长期支持）状态，目前 `Java 17` 拥有 `LTS` 状态。由于各种因素，一些大公司仍在使用\
  \ `Java 8`，它是 `Java` 历史上最重要的发布之一。如果你感兴趣，Oracle 网站包含了 `Java 8` 的特性列表。事实上，`Java 8`\
  \ 中的几乎所有特性在随后的所有版本中（直到 `Java 17`）中都能正常工作。\n\n然而，`Java 8` 和 `Java 11` 已被弃用，目前 `Java\
  \ 17` 拥有 `LTS` 状态。那么，推荐哪个 `Java` 版本？答案取决于你的需求。如果你没有维护或开发旧版 `Java` 版本代码的负担，那么可能使用\
  \ `Java 17` 可能是安全的。如果你没有选择，请考虑使用 `Java 13`、`Java 11` 或 `Java 8`（按此顺序）。\n\n导航到以下\
  \ URL 获取有关早期 `Java` 版本的信息以及未来 `Java` 版本的发布日期：\n\n*[`www.oracle.com/java/technologies/java-se-support-roadmap.html`](https://www.oracle.com/java/technologies/java-se-support-roadmap.html)*\n\
  \n#### Java 版本号\n\n\n\n\n\n在 Java 8 之前，版本编号序列采用 1.x 形式。因此，Java 7 也被称为 Java 1.7，而\
  \ Java 8 被称为 Java 8。然而，这种旧的命名规范从 Java 9 开始被弃用了。例如，如果你输入命令 `java -version` 并且机器上安装了\
  \ Java 13，你将看到类似下面的输出：\n\n```\n java 13.0.1 2019-10-15\nJava(TM) SE Runtime Environment\
  \ (build 13.0.1+9)\nJava HotSpot(TM) 64-Bit Server VM (build 13.0.1+9, mixed mode,\
  \ sharing)\n```\n\n目标是牢实掌握 Java 13，然后通过学习 Java 13 之后版本中的新特性来扩展你的知识。\n\n## JRE 与\
  \ JDK\n\nJRE（Java 运行环境）允许你运行 Java 代码，这意味着 Java 提供了 `java` 工具。如果你使用的是 Unix/Linux\
  \ 类机器，请输入以下命令：\n\n```\n $ which java\n```\n\n上一个命令显示如下类型的输出：\n\n```\n $ /usr/bin/java\n\
  ```\n\n然而，JDK（Java 开发工具包）允许你编译和运行 Java 代码。尽管在 Java 8 之前 JRE 和 JDK 是分开下载的，但现在它们已经合并：即从\
  \ Java 9 开始，Java 的下载包是包含 JRE 的 JDK。\n\n## Java 发行版\n\n有很多网站提供多种 Java JDK：OpenJDK\
  \ 项目、OracleJDK 和 AdoptOpenJDK。OpenJDK 项目是唯一包含 Java 源代码的项目站点。\n\nOracle 提供 OpenJDK，它可以免费用于你的\
  \ Java 应用程序。但不再支持对旧版本的更新：例如，一旦 Java 13 一面世，对 Java 12 的更新就停止了。Oracle 还提供 OracleJDK，它仅限在开发期间免费使用：如果你将代码部署到生产环境，则必须向\
  \ Oracle 支付费用（这会为你提供额外的支持）。\n\n从 2017 年开始，你还可以使用 AdoptOpenJDK，它由不同的开发者和供应商开发，并且是免费提供的（就像\
  \ OpenJDK 一样）。\n\n## Java IDE\n\n许多人更倾向于在 IDE 中工作，而且许多编程语言都有非常好的 IDE 可用。例如，如果你计划开发\
  \ Android 应用，在 Android Studio 中进行是值得的，它是那些不熟悉命令行的人的替代方案。\n\n如果你想在 IDE（集成开发环境）中编写\
  \ Java 代码，有多种支持 Java 的 IDE，例如 NetBeans 和 Eclipse。然而，本书侧重于从命令行操作 Java，你可以使用任选的文本编辑器创建\
  \ Java 类（或者如果你喜欢的话，也可以使用 IDE）。从命令行开发 Java 代码涉及一些简单的手动步骤，例如更新 `CLASSPATH` 环境变量以包含\
  \ JAR 文件，有时还包括编译后的 Java 类文件。\n\n本章还包含一个简短的章节，向你展示如何创建一个包含已编译 Java 代码的简单 JAR 文件，在将此\
  \ JAR 文件添加到 `CLASSPATH` 变量后，你将看到如何调用你自定义的 JAR 文件中自定义的 Java 代码。需要记住的关键点是，书中的 Java\
  \ 代码示例非常短（且通常很简单），到你不需要 IDE。\n\n如果你想在 IDE 中编写 Java 代码，有几个支持 Java 的 IDE，下面的链接包含了其中\
  \ 10 个：\n\nhttps://www.educative.io/blog/best-java-ides-2021\n\n然而，本章中的 Java 代码示例是从命令行启动的，源代码配合你任选的文本编辑器来创建\
  \ Java 类。从命令行工作确实需要一些额外的努力，例如手动更新 `CLASSPATH` 环境变量以包含 JAR（Java 归档）文件和编译后的 Java 类文件。\n\
  \n## 数据类型、运算符及其优先级\n\nJava 支持在许多其他编译语言中常见的基本数据类型，以及对应的基于对象的类型。例如，基本数据类型 `int`、`double`\
  \ 和 `float` 分别对应基于类的类型 `Integer`、`Double` 和 `Float`。\n\n某些数据结构（如哈希表）不支持基本数据类型，这就是为什么需要基于类的对应类型。例如，如果你需要一个哈希表来维护整数集合，你需要创建一个包含每个整数的基于\
  \ `Integer` 的对象，并将该对象添加到哈希表中。然后你检索一个特定的基于 `Integer` 的值对象并提取其底层的 `int` 值。这种方法显然比简单地在哈希表中存储和检索\
  \ `int` 值涉及更多代码。\n\n关于基本类型：Java 提供了 8 种作为语言关键字的原始数据类型：\n\n* `byte`: 8 位符号补码整数\n\
  * `short`: 16 位符号补码整数\n* `int`: 32 位符号补码整数\n* `long`: 64 位符号补码整数\n* `float`: 单精度\
  \ 32 位 IEEE 754 浮点数\n* `boolean`: true 或 false\n* `char`: 单个 16 位 Unicode 字符\n\n\
  在大多数情况下，本书中涉及算术计算的代码示例使用整数和浮点数。\n\n### Java 注释\n\nJava 支持单行注释和多行注释，此处均有展示：\n\n```\n\
  \ // 这是一个单行注释\n/* 这是一个多行注释 */\n```\n\n然而，Java 不支持嵌套注释（C/C++ 则支持），因此以下是错误的：\n\n```\n\
  \ 第一行注释 /* 第二行注释 */\n```\n\n根据前面的示例，以下是正确的：\n\n```\n 第一行注释 // 第二行注释\n```\n\n###\
  \ Java 运算符\n\nJava 支持常见的算术运算符，以及标准的优先级（幂运算高于乘法 * 和除法 /，这两者的优先级高于加法 + 和减法 -）。此外，Java\
  \ 还支持：\n\n* 算术运算符：`+`, `-`, `*`, `/`, `%`, `++`, `--`\n* 赋值运算符：`=`, `+=`, `-=`,\
  \ `*=`, `/=`, `%=`, `<<=`, `>>=`, `&=`, `^=`, `-=`\n* 位运算符：`&`, `|`, `^`, `~`\n\
  * 布尔运算：`and`, `or`, `not`\n* 逻辑运算符：`&&`, `||`, `!`\n* 关系运算符：`==`, `!=`, `>`, `<=`\n\
  \nJava 还支持三元运算符 `?` 和运算符 `instanceof`（用于检查变量是否是特定类的实例）。\n\n## 创建和编译 Java 类\n\n让我们从简单的\
  \ Java 类开始，除了向你展示 Java 类的基本结构之外什么都不做。列表 1.1 显示了 MyClass.java 的内容。\n\n***列表 1.1：MyClass.java***\n\
  \n```\n public class MyClass\n{\n}\n```\n\n首先要到文件名与 Java 类名相同。列表 1.1 定义了由 `public`\
  \ 和 `class` 关键字修饰的 Java 类 `MyClass`。你可以在 Java 文件中包含多个类，但只能有一个公共类，且该公共类必须与文件名匹配。\n\
  \n打开命令行窗口，导航到包含 `MyClass.java` 的目录，然后在命令行中使用 `javac` 可执行文件编译 `MyClass.java`：\n\n\
  ```\n javac MyClass.java\n```\n\n`javac` 可执行文件创建一个名为 `MyClass.class` 的文件，其中包含 Java\
  \ 字节码。使用 `java` 可执行文件启动 Java 字节码（不要包含任何扩展名）：\n\n```\n java MyClass\n```\n\n注意启动\
  \ Java 字节码时不需要指定 .java 或 .class 后缀。之前命令的输出在这里：\n\n```\n Exception in thread \"main\"\
  \ java.lang.NoSuchMethodError: main\n```\n\n\n\n\n\n**注意** Java 源代码文件的名称必须与文件中的公共\
  \ Java 类名匹配。例如，`MyClass.java` 文件必须定义一个名为 `MyClass` 的 Java 类。\n\nListing 1.2 包含一个\
  \ `main` 方法，作为从命令行启动 Java 类的初始“入口点”，这解决了在 Listing 1.1 中出现的错误。\n\n***Listing 1.2:\
  \ MyClass.java***\n\n```java\n public class MyClass\n{\n   public static void main(String[]\
  \ args){}\n}\n```\n\nListing 1.2 包含 `main()` 函数，其返回类型为 `void`，因为它不返回任何内容。`main()`\
  \ 函数也是 `static` 的，这确保了当我们从命令行启动 Java 类时它是可用的。编译代码：\n\n```bash\n javac MyClass.java\n\
  ```\n\n从命令行启动该类：\n\n```bash\n java MyClass\n```\n\n你现在已成功创建、编译并启动了一个名为 `MyClass`\
  \ 的 Java 类，它目前除了成功编译外并无所事。下一步涉及在 Java 类中显示文本字符串，将在下一节中讨论。\n\n### “HELLO WORLD” 与数字操作\n\
  \nListing 1.3 显示了 `HelloWorld1.java` 的内容，该文件从 Java 类中打印字符串“Hello World”。\n\n***Listing\
  \ 1.3: HelloWorld1.java***\n\n```java\n public class HelloWorld1 \n{\n   public\
  \ static void main (String args[]) \n   {   \n      System.out.println(\"Hello World\"\
  );\n   }   \n}\n```\n\nListing 1.3 中的代码非常直观：`main()` 函数包含一个简单的打印语句，用于打印字符串“Hello\
  \ World”。打开命令行 shell 来编译并运行 Listing 1.3 中的 Java 代码：\n\n```bash\n javac HelloWorld1.java\n\
  ```\n\n通过输入以下命令启动编译后的代码：\n\n```bash\n java HelloWorld1\n```\n\n上一个命令的输出如下：\n\n```\n\
  \ Hello World\n```\n\n附带文件包含了本章节的额外代码示例，说明了如何在 Java 中处理数字、随机数、三角函数和位运算符：\n\n*  \
  \ `Numbers.java`\n*   `RandomNumbers.java`\n*   `MathFunctions.java`\n*   `TrigFunctions.java`\n\
  *   `Bitwise.java`\n\n让我们来看一些在 Java 中处理数字的（稍微）趣的示例。\n\n### JAVA STRING 类\n\n`char`\
  \ 类型的 Java 变量是一个单个字符，你可以通过 `char` 关键字这样定义它：\n\n```java\n char ch1 = 'Z';\n```\n\n\
  `String` 类型的 Java 变量是一个由 `char` 值序列组成的对象。正如你稍将看到的，Java 支持 ASCII、UTF8 和 Unicode 字符。`java.lang.String`\
  \ 类实现了 Java 接口（后文讨论）`Serializable`、`Comparable` 和 `CharSequence`。\n\n`Serializable`\
  \ 接口不包含方法：它本质上是一个“标记”（接口）。`CharSequence` 接口用于字符序列。除了 Java String 类外，Java 的 `StringBuffer`\
  \ 类和 `StringBuilder` 类也实现了 `CharSequence` 接口（更多细节见后文）。\n\n请记住以下一点：每个 Java String\
  \ 都是不可变的，为了修改 Java 字符串（如追加或删除字符），Java 会在“底层”为我们创建一个新实例。因此，字符串相关的操作内存效率较低；然而，Java\
  \ 提供了 `StringBuffer` 和 `StringBuilder` 类来处理可变的 Java 字符串（后文也会讨论）。\n\n字符数组实际上与 Java\
  \ String 相同，如下所示：\n\n```java\n char[] chars = {'h','e','l','l','o'};\nString str1\
  \  = new String(chars);  \nString str2  = \"hello\"; \n```\n\n你可以使用 `charAt()` 方法访问字符串中的字符，如下所示：\n\
