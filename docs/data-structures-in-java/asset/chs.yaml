  ```\n\nListing 3.29 的后续部分定义了 `main()` 方法，该方法首先用一组数字初始化数组 `numbers`，随后通过循环遍历 `numbers`\
  \ 中的值。在每次迭代中，程序都会显示当前数字的二进制值，然后显示“翻转”后数字的二进制值。运行 Listing 3.29 中的代码，你将看到以下输出：\n\n\
  ```\n 17 binary: 00000000000000000000000000010001\nAfter Swapping:\n17 binary: 00000000000000000000000000100010\n\
  \n761622921 binary: 00101101011001010111000110001001\nAfter Swapping:\n761622921\
  \ binary: 00011110100110101011001001000110\n\n123 binary: 00000000000000000000000001111011\n\
  After Swapping:\n123 binary: 00000000000000000000000010110111\n```\n\n## 二维数组的操作\n\
  \nJava 中的*二维数组*是一种二维构造结构，其元素是同质的（即不允许允许混合数据类型）。给定两个数组 `A` 和 `B`，只要它们的行数和列数相同，你就可以对它们进行加法或减法运算。\n\
  \n乘法的工作方式不同：如果你想用 `B` 乘以 `A` 的右侧（假设 `A` 是一个 `mxn` 矩阵），那么 `B` 必须是一个 `nxp` 矩阵。矩阵乘法的规则如下：`A`\
  \ 的列数必须等于 `B` 的行数。\n\n此外，矩阵 `A` 的*转置*是另一个矩阵 `At`，其行和列是交换的。因此，如果 `A` 是一个 `mxn` 矩阵，那么\
  \ `At` 就是一个 `nxm` 矩阵。如果 `A = At`，则矩阵 `A` 是对称的。如果主对角线（左上角到右下角）上的值为 1，而其他值为 0，则矩阵\
  \ `A` 是单位矩阵 `I`。如果存在矩阵 `B` 使得 `A*B = B*A = I`，则矩阵 `A` 是可逆的。根据之前对两个矩阵乘积讨论，`A` 和 `B`\
  \ 必须是具有相同行和列数的方矩阵。\n\n现在你已经了解了字符串的一些基础操作，接下来的小节将说明如何在 Java 中对矩阵执行各种任务。\n\n### 矩阵的转置\n\
  \n提醒一下，矩阵 `A` 的转置是矩阵 `At`，其中 `A` 的行和列分别是矩阵 `At` 的列和行。\n\nListing 3.30 显示了 `MatTranspose.java`\
  \ 的内容，演示了如何找到一个 `mxn` 矩阵的转置。\n\n***列表 3.30: MatTranspose.java***\n\n```\n public\
  \ class MatTranspose\n{\n   public static int[][] transpose(int[][]A, int rows,\
  \ int cols)\n   {\n      for(int i=0; i<rows; i++) {\n        for(int j=i; j<cols;\
  \ j++) {\n          //System.out.println(\"switching \"+A[i][j]+\" + \"+A[j][i]);\n\
  \          int temp = A[i][j];\n          A[i][j] = A[j][i];\n          A[j][i]\
  \ = temp;\n        }\n      }\n      return A;\n   }\n   public static void main(String[]\
  \ args)\n   {\n      int[][] A1 = new int[][]{{100,3},{500,7}};\n      System.out.println(\"\
  => original:\");\n      System.out.println(A1);\n\n      int[][] At1 = transpose(A1,\
  \ 2, 2);\n      System.out.println(\"=> transpose:\");\n      System.out.println(At1);\n\
  \      System.out.println();\n\n      // example 2:\n      int[][] A2 = new int[][]{{100,3,-1},{3,500,7,123}};\n\
  \      System.out.println(\"=> original:\");\n      System.out.println(A2);\n\n\
  \      int[][] At2 = transpose(A2, 2, 3);\n      System.out.println(\"=> transpose:\"\
  );\n      System.out.println(At2);\n   }\n}\n```\n\n### 总结\n\n本章从介绍一维向量开始，介绍了如何计算它们的长度以及向量内积。然后你学习了如何执行各种数字数字任务，例如乘法和除法。\n\
  \n此外，你学习了处理字符串，以及如何检查字符串的唯一字符、在字符串中插入字符以及查找字符串的排列。接下来，你学习了如何判断一个字符串是否为回文。\n\n此外，你学习了如何计算矩阵的转置，这等同于将图像位图旋转\
  \ 90 度。\n\n\n\n\n\n在 RDBMS（关系型数据库管理系统）世界中，表通常有一个索引（有时是多个），以便更高效地执行表搜索。然而，索引涉及到一些额外的计算开销，它是一个存储在磁盘上的独立数据结构。相比之下，线性搜索仅涉及表中的数据。根据经验，当表行数超过\
  \ 300 行时，基于索引的搜索效率更高（但结果可能有所异）。下一节将包含一个在数字数组上执行线性搜索的代码示例。\n\n### 线性搜索\n\n列表 4.1\
  \ 显示了 `LinearSearch.java` 的内容，说明了如何对数字数组执行线性搜索。\n\n***列表 4.1：LinearSearch.java***\n\
  \n```\n public class LinearSearch\n{ \n   public static void main(String[] args)\n\
  \   {\n      int found = -1, item = 123;\n      int[] arr1 = new int[]{1,3,5,123,400};\n\
  \n      for(int i=0; i<arr1.length; i++) {\n        if (item == arr1[i]) {\n   \
  \        found = i;\n           break;\n        }\n      }\n\n      if (found >=\
  \ 0)\n        System.out.println(\"found \"+item+\" in position \"+found);\n   \
  \   else\n        System.out.println(item+\" not found\");\n   }\n}\n```\n\n列表 4.1\
  \ 从变量 `found` 开始，其初始值为 `-1`，紧接着是搜索项 `123`，以及包含数字数组的数组 `arr1`。接下来，通过循环遍历整数数组 `arr1`\
  \ 的元素，将每个元素与 `item` 的值进行比较。如果发生匹配，则将变量 `found` 设置为循环变量 `i` 的值，然后提前退出。\n\n列表 4.1\
  \ 的最后部分检查变量 `found` 的值：如果它是非负的，则找到了搜索项（否则它不在数组中）。运行 列表 4.1 中的代码，你将看到以下输出：\n\n```\n\
  \ found 123 in position 3\n```\n\n记住以下几点：尽管数组 `arr1` 包含一个排序的数字列表，但代码对于无序列表同样可以工作。\n\
  \n### 二分查找演练\n\n二分查找需要一个排序数组，并且可以通过迭代算法实现，也可以通过递归方案实现。其核心思想是将排序元素数组的中间元素与搜索元素进行比较。如果它们相等，则已找到该项；如果中间元素小于搜索元素，则对数组的右半部分重复上一步；如果中间元素大于搜索元素，则对数组的左半部分重复上一步。最终，该元素将被找到（如果它出现在数组中），或者当重复的数组拆分到子数组只有一个元素时时终止（即无法进行进一步拆分）。\n\
  \n让我们演练一次在排序的整数数组中搜索某项的二分查找。\n\n*示例 #1*：假设 `item` = 25，`arr1` = [10,20,25,40,100]，因此数组的中点是\
  \ 3。由于 `arr1[3] == item`，算法成功终止。\n\n*示例 #2*：假设 `item` = 25，`arr1` = [1,5,10, 15,\
  \ 20, 25, 40]，这意味着中点是 4。\n\n第一次迭代：由于 `arr1[4] < item`，我们搜索数组 [20, 25, 40]。\n\n第二次迭代：中点是\
  \ 1，对应的值是 25。\n\n第三次迭代：25 且数组为单个元素 [25]，与项匹配。\n\n*示例 #3*：`item` = 25，`arr1` = [10,\
  \ 20, 25, 40, 100,150,400]，因此中点是 4。\n\n第一次迭代：由于 `arr1 [4] > 25`，我们搜索数组 [10, 20,\
  \ 25]。\n\n第二次迭代：中点是 1，对应的值是 20。\n\n第三次迭代：25 且数组为单个元素 [25]，与项匹配。\n\n*示例 #4*：`item`\
  \ = 25，`arr1` = [1,5,10, 15, 20, 30, 40]，因此中点是 4。\n\n第一次迭代：由于 `arr1[4] < 25`，我们搜索数组\
  \ [20, 30, 40]。\n\n第二次迭代：中点是 1，对应的值是 30。\n\n第三次迭代：25 且数组为单个元素 [20]，因此没有匹配。\n\n正如本节第一段提到的，二分查找可以用交互式方案来实现，这是下一节的主题。\n\
