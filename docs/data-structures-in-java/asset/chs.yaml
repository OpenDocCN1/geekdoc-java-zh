  \ `line1`。`main()` 方法的后续部分通过 `split()` 方法将 `line1` 的内容拆分（标记）为单词数组。\n\n接下来，循环遍历 `words`\
  \ 数组中的每个单词，并将变量 `first` 设置为当前单词首字母的大写版本，并与当前单词的剩余字母拼接，如下所示：\n\n```\n first = word.substring(0,1).toUpperCase()+word.substring(1);\n\
  ```\n\n循环还将 `first` 和一个空格拼接到字符串 `line2` 中，该字符串将包含来自变量 `line` 的单词，且每个单词的首字母均大大写。\n\
  \n`main` 函数的最后部分显示了修改后的句子内容，以及该句子的小写版本，最后是原始句子的大写版本。运行 列表 1.9 中的代码，你将看到以下输出：\n\n\
  ```\n line1: this is a SIMPLE sentence.\nline2: This Is A SIMPLE Sentence. \nLower:\
  \ this is a simple sentence.\nUpper: THIS IS A SIMPLE SENTENCE.\n```\n\n### 在 Java\
  \ 中解析字符串\n\nJava 支持命令行参数，这允许你从命令行通过不同的命令行值启动程序。使用 `equals()` 方法比较 Java 字符串以判断值是否相同。虽然某些语言通过“==”比较字符串，但在\
  \ Java 中，“==”只比较两个字符串的引用（而不是值）。\n\n使用 `parseInt()` 方法（尝试）将字符串转换为整数：\n\n```\n int\
  \ num = Integer.parseInt(\"1234\");\n```\n\n使用 `substring()`（此处此处 split）通过空白字符拆分字符串：\n\
  \n```\n String[] strArray = aString.split(\"\\\\s+\");\n```\n\n正则表达式 `\\s+` 匹配一个或多个各种空白字符，包括“\
  \ ”、`\\t`、`\\r` 和 `\\n`。\n\n下面的代码段通过 `StringBuilder` 类反转 Java 字符串：\n\n```\n String\
  \ rev = new StringBuilder(original).reverse().toString();\n```\n\n配套目录包含 `OverrideToString.java`，并向你展示如何在\
  \ Java 中重写默认的 `toString()` 方法。\n\n到为止，你已经看到了在 Java 中处理字符串的各种示例。欲需更多信息，请访问此 URL：\n\
  \n`https://docs.oracle.com/javase/7/docs/api/java/lang/String.html`\n\n### Java\
  \ 中的条件逻辑\n\n条件逻辑允许你根据条件做出决策。最简单的类型涉及简单的“if”语句，但也可以使用 if-else 以及 if-else-if 语句。另一个\
  \ Java 构造结构是 `switch` 语句，它也涉及条件逻辑，某些任务使用 switch 语句比多个 if-else 语句处理起来更方便。\n\n列表 1.10\
  \ 显示了 `Conditional1.java` 的内容，该代码将两个数字除以小整数，并使用整数值的余数打印各种消息。\n\n**列表 1.10: Conditional1.java**\n\
  \n```\n public class Conditional1\n{\n   int x = 12, y = 15;\n\n   public Conditional1()\
  \ {}\n\n   public void IfLogic()\n   {\n      if(x % 2 == 0) {\n         System.out.println(\"\
  x is even: \"+x);\n      } else {\n         System.out.println(\"x is odd: \"+x);\n\
  \      }\n\n      if(x % 2 == 0) {\n         if(x % 4 == 0) {\n            System.out.println(\"\
  x is divisible by 4: \"+x);\n         }\n      }\n\n      if(y % 3 == 0 && y % 5\
  \ == 0) {\n         System.out.println(\"y is divisible by 3 and 5: \"+y);\n   \
  \   } else if(y % 3 == 0) {\n         System.out.println(\"y is divisible only by\
  \ 3: \"+y);\n      } else if(y % 5 == 0) {\n         System.out.println(\"y is divisible\
  \ only by 5: \"+y);\n      } else {\n         System.out.println(\"y is not divisible\
  \ by 3 or 5: \"+y);\n      }\n   }\n\n   public static void main(String args[])\n\
  \   {\n      Conditional1 c1 = new Conditional1();\n      c1.IfLogic();\n   } \n\
  }\n```\n\n列表 1.10 定义了 Java 类 `Conditional1` 和一个 `IfLogic()` 方法，该方法对整数变量 `x` 和 `y`\
  \ 进行取模运算。如果 `x % 2` 等于 0，则 x 是偶数；如果 `x % 4` 等于 0，则 x 是 4 的倍数；如果 `y % 3` 等于 0，则 y\
  \ 是 3 的倍数。列表 1.10 包含了 if-else 块以及嵌套的条件逻辑块，你可以通过手动计算并将结果与生成的输出进行对比。\n\n运行 列表 1.10\
  \ 中的代码，你将看到以下输出：\n\n```\n x is even: 12\nx is divisible by 4: 12\ny is divisible\
  \ by 3 and 5: 15\n```\n\n你可以创建更复杂的布尔表达式，涉及“与”、“或”和“非”的多种组合（这涉及 `!=`）。使用 列表 1.1 中的代码作为基准，然后添加自己的变体。\n\
  \n配套文件包含 `BooleanExamples.java`，向你展示了 Java 中各种类型的布尔表达式。\n\n### 判断闰年\n\n列表 1.11 显示了\
  \ `LeapYear.java` 的内容，用于判断给定年份是否为闰年。以防你忘记，闰年必须是 4 的倍数。但是，如果给定年份是一个不是 400 倍数的世纪，那么该年份就不是闰年。因此，2000\
  \ 年是闰年，而 1700、1800 和 1900 年不是。\n\n此代码样本是嵌套条件语句的一个很好的示例。尝试编写你自己的伪代码并与 列表 1.11 的内容进行对比。\n\
  \n\n\n\n\n```java\n public class LeapYear\n{\n   public LeapYear() {}\n\n   // 闰年是\
  \ 4 的倍数，但\n   // 400 的倍数的世纪除外\n   public void checkYear(int year)\n   {\n      if(\
  \ year % 4 == 0)\n      {\n         if( year % 100 == 0)\n         {\n         \
  \   if(year % 400 != 0)\n            {\n               System.out.println(year +\
  \ \" is a leap year\");\n            }\n            else\n            {\n      \
  \         System.out.println(year + \" is not a leap year\");\n            }\n \
  \        }\n         else\n         {\n            System.out.println(year + \"\
  \ is a leap year\");\n         }\n      }\n      else\n      {\n         System.out.println(year\
  \ + \" is not a leap year\");\n      }\n   }\n\n   public static void main(String\
  \ args[])\n   {\n      LeapYear ly = new LeapYear();\n      int[] years = {1234,\
  \ 1900, 2000, 2020, 3000, 5588};\n\n      for (int year : years)\n      {\n    \
  \     ly.checkYear(year);\n      }\n   }\n}\n```\n\nListing 1.11 定义了 `LeapYear`\
  \ 类，该类包含 `checkYear` 方法，用于判断给定的年份是否为闰年。如果你查看 Listing 1.11 开头附近的注释块，你会发现 `checkYear`\
  \ 方法实现了相同的条件逻辑。运行 Listing 1.11 中的代码，你将看到以下输出：\n\n```\n 1234 is not a leap year\n\
  1900 is a leap year\n2000 is not a leap year\n2020 is a leap year\n3000 is not a\
  \ leap year\n5588 is a leap year\n```\n\n### 寻找数字的约数\n\nListing 1.12 包含 `while`\
  \ 循环、条件逻辑和 `%`（取模）运算符，用于寻找任何大于 1 的整数的质因数。\n\n***LISTING 1.12: Divisors1.java***\n\
  \n```java\n public class Divisors1\n{\n   public Divisors1() {}\n\n   public void\
  \ divisors(int num)\n   {\n      int div = 2;\n\n      System.out.println(\"Number:\
  \ \"+num);\n\n      while(num > 1)\n      {\n         if(num % div == 0)\n     \
  \    {\n            System.out.println(\"divisor: \"+div);\n            num /= div;\n\
  \         }\n         else \n         {\n            ++div;\n         } \n     \
  \ }\n   }\n\n   public static void main(String args[])\n   {\n      Divisors1 d1\
  \ = new Divisors1();\n      d1.divisors(12);\n   }\n} \n```\n\nListing 1.12 定义了\
  \ Java 类 `Divisors1`，该类包含 `divisors` 方法，用于确定正整数 `num` 的约数。`divisors` 方法包含一个 `while`\
  \ 循环，当 `num` 大于 1 时循环迭代。\n\n在每次迭代中，如果 `num` 能被 `div` 整除，则显示 `div` 的值，然后通过将 `num`\
  \ 除以 `div` 的值来减小它。如果 `num` 不能被 `div` 整除，则将 `div` 加 1。来自 Listing 1.8 的输出在此：\n\n```\n\
  \ Number: 12\ndivisor: 2\ndivisor: 2\ndivisor: 3\n```\n\n### 检查回文\n\n以防你忘记，回文是一个数字或字符序列，从正反两个方向读取时时都是相同的（即从左到右和从右到左相同）。\n\
  \n例如，字符串 `BoB` 是回文，但 `Bob` 不是回文。同样，数字 `12321` 是回文，但 `1232` 不是回文。\n\nListing 1.13\
  \ 显示了 `Palindromes1.java` 的内容，该程序检查给定的字符串或数字是否为回文。\n\n***LISTING 1.13: Palindromes1.java***\n\
  \n```java\n public class Palindromes1\n{\n  public Palindromes1() {}\n\n   public\
  \ void calculate(String str)\n   {\n      int result = 0;\n      int len = str.length();\n\
  \n      for(int i=0; i<len/2; i++)\n      {\n         if(str.charAt(i) != str.charAt(len-i-1))\n\
  \         {\n            result = 1;\n            break;\n         }\n      }\n\n\
  \      if(result == 0)\n      {\n         System.out.println(str + \": is a palindrome\"\
  );\n      }\n      else\n      {\n         System.out.println(str + \": is not a\
  \ palindrome\");\n      }  \n   }\n\n   public static void main(String args[])\n\
  \   {\n      String[] names = {\"Dave\", \"BoB\", \"rotor\"};\n      int[] numbers\
  \ = {1234, 767, 123421, 101};\n      Palindromes1 pal1 = new Palindromes1();\n\n\
  \      for (String name : names)\n      {\n         pal1.calculate(name);\n    \
  \  }\n\n      for (int num : numbers)\n      {\n         pal1.calculate(Integer.toString(num));\n\
  \      }\n   }\n}\n```\n\nListing 1.13 定义了 Java 类 `Palindromes1`，该类包含 `calculate`\
  \ 方法，用于判断给定的字符串或数字是否为回文。`main` 方法通过 `names` 数组和 `numbers` 数组，实例化 `Palindromes1`\
  \ 类，并对 `names` 数组中的每个字符串调用 `calculate()` 方法。同样，通过 `Integer.toString()` 将 `numbers`\
  \ 数组中的数字调用 `calculate()` 方法。运行 Listing 1.13 中的代码，你将看到以下输出：\n\n```\n Dave: not a\
  \ palindrome\nBoB: is a palindrome\nrotor: is a palindrome\n1234: not a palindrome\n\
  767: is a palindrome\n123421: is a palindrome\n101: is a palindrome\n```\n\n本章后续章节展示了如何将\
  \ `while` 循环与条件逻辑（if-else）结合。\n\n### 处理字符串数组\n\n本节展示了如何通过 `main()` 例程打印存储在数组中的名称。\n\
