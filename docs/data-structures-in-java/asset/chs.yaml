  ### 任务：通过递归进行乘法和除法\n\nListing 3.4 显示了 `RecursiveMultiply.java` 的内容，演示了如何通过递归计算两个正整数的乘积。\n\
  \n\n\n\n\n```\n class RecursiveMultiply\n{\n   public static int add_repeat(int\
  \ num, int times, int sum)\n   {\n      if(times == 0)\n        return sum;\n\n\
  \      return add_repeat(num, times-1, num+sum);\n   }\n\n   public static void\
  \ main(String args[])\n   {\n      int[] arr1 = {9,13,25,17,100};\n      int[] arr2\
  \ = {5,10,25,10,100};\n\n      for(int i=0; i<arr1.length; i++) {\n         int\
  \ num1 = arr1[i];\n         int num2 = arr2[i];\n         int prod = add_repeat(num1,\
  \ num2, 0);\n         System.out.println(\"remainder of \"+num1+\"/\"+num2+\" =\
  \ \"+prod);\n      }\n   }\n}\n```\n\nListing 3.4 从函数 `add_repeat(num,times,sum)`\
  \ 开始，该函数通过递归调用自身来执行重复加法。注意，此函数使用了尾递归：函数的每次调用都会将 `times` 替换为 `times-1`，并将将 `sum`\
  \ 替换为 `num+sum`（后者是尾递归）。终止条件是 `times` 等于 0，此时函数返回 `sum` 的值。运行 Listing 3.4 中的代码，你将看到以下输出：\n\
  \n```\n product of 5 and 9 = 45\nproduct of 13 and 10 = 130\nproduct of 25 and 25\
  \ = 625\nproduct of 17 and 10 = 170\nproduct of 100 and 100 = 10000\n```\n\nListing\
  \ 3.5 显示了 `RecursiveDivide.java` 的内容，它说明了如何通过递归计算两个正整数的商。\n\n### 列表 3.5:RecursiveDivide.java\n\
  \n```\n class RecursiveDivide\n{\n   public static int sub_repeat(int num1, int\
  \ num2, int remainder)\n   {\n      if(num1 < num2)\n        return num1;\n    \
  \  else\n        //print(\"num1-num2:\",num1-num2,\"num2:\",num2)\n        return\
  \ sub_repeat(num1-num2, remainder);\n   }\n\n   public static void main(String args[])\n\
  \   {\n      int[] arr1 = {9,13,25,17,100};\n      int[] arr2 = {5,10,25,10,100};\n\
  \n      for(int i=0; i<arr1.length; i++) {\n         int num1 = arr1[i];\n     \
  \    int num2 = arr2[i];\n         int prod = sub_repeat(num1, num2, 0);\n     \
  \    System.out.println(\"remainder of \"+num1+\"/\"+num2+\" = \"+prod);\n     \
  \ }\n   }\n}\n```\n\nListing 3.5 包含的代码与 Listing 3.4 非常相似：区别是将加法替换为减法。运行 Listing\
  \ 3.5 中的代码，你将看到以下输出：\n\n```\n remainder of 9 / 5 = 4\nremainder of 13 / 10 = 3\n\
  remainder of 25 / 25 = 0\nremainder of 17 / 10 = 7\nremainder of 100 / 100 = 0\n\
  ```\n\n### 任务：质数与合数的和\n\nListing 3.6 显示了 `PairSumSorted.java` 的内容，说明了如何判断一个有序数组是否包含两个指定数字的和。\n\
  \n### 列表 3.6:PairSumSorted.java\n\n```\n //给定有序数组中的两个数字 num1 和 num2\n//判断 num1+num2\
  \ 是否在数组中\n\npublic class PairSumSorted\n{\n   public static void check_sum(int[]\
  \ arr1,int num1,int num2)\n   {\n      int ndx1 = 0;\n      int ndx2 = arr1.length-1;\n\
  \      //System.out.println(\"Anum1: \"+num1+\" num2: \"+num2);\n      while(arr1[ndx1]\
