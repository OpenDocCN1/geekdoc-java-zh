  \n```\n public class GeoSumRecursive\n{ \n   public static int geomsum(int num,\
  \ int ratio, int term, int sum)\n   {\n      if(num == 1)\n      {\n         return\
  \ sum;\n      }\n      else\n      {\n         term *= ratio;;\n         sum  +=\
  \ term;;\n         return geomsum(num-1,ratio,term,sum);\n      }\n   }\n\n   public\
