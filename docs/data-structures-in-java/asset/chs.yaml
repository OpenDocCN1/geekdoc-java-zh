  \ Listing 3.12 中的代码，你将看到以下输出：\n\n```\n string: abc\nmaxpal: a\n\nstring: abb\nmaxpal:\
  \ bb\n\nstring: abccba\nmaxpal: abccba\nstring: azaaza\nmaxpal: azaaza\n\nstring:\
  \ abcdefgabccax\nmaxpal: abccba\n```\n\n### 处理字符串序列\n\n本节包含 Java 代码示例，用于搜索字符串以确定：\n\
  \n*   字符串中连续 1 序列的最大长度。\n*   在字符串中找到指定的字符序列。\n*   唯一字符序列的最大长度。\n\n在你完成本节后，可以探索可以使用本节代码示例解决的这些变体。\n\
  \n#### 字符串中重复字符的最大长度\n\nListing 3.13 显示了 `MaxCharSequence.java` 的内容，它说明了如何找到字符串中重复字符的最大长度。\n\
  \n\n\n\n\n```\n public class MaxCharSequence\n{\n   public static void max_seq(String\
  \ my_str,char ch)\n   {\n      int max = 0, left = 0, right = 0, counter = 0;\n\
