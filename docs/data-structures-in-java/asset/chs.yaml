  a\",\"e\"};\n\n      for(int idx=0; idx<str_list.length; idx++) {\n         String\
  \ my_str = str_list[idx];\n         String str    = char_list[idx];\n         char\
  \ ch       = char_list[idx].charAt(0);\n         max_seq(my_str,ch);\n      }\n\
  }\n```\n\n代码列表 3.13 从 `max_seq()` 函数开始，其参数为字符串 `my_str` 和字符 `ch`。该函数包含一个循环，遍历 `my_str`\
  \ 的每个字符并与 `ch` 进行比较。只要字符等于 `ch`，变量 `right` 和 `counter` 的值就会递增：`right` 代表最右侧的索引，`counter`\
  \ 包含相同字符子串的长度。然而，如果 `my_str` 中的字符与 `ch` 不同，则 `counter` 重置为 0，并从该位置重新开始比较。当循环结束时，`counter`\
  \ 变量等于连续相同字符子串的最大长度。\n\n代码列表 3.13 的后续部分初始化了 `str_list` 数组（包含一个字符串列表）以及包含字符列表的 `char_list`\
  \ 数组。最后的循环遍历 `str_list` 中的元素，并使用 `char_list` 中对应的字符调用 `max_seq()`。运行代码列表 3.13 中的代码，你会看到以下输出：\n\
