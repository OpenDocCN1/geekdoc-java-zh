  \ `append_node`、`update_item` 和 `display_list` 方法。\n\n### **操作双向链表 (DLL)**\n\n双向链表是元素的集合，每个节点包含：\n\
  \n1. 存储在节点中的值，以及\n\n2. 下一个节点的位置（称为后继节点）\n\n3. 前一个节点的位置（称为前驱节点）\n\n双向链表上的操作与单向链表相同；然而，有两个指针（后继节点和前驱节点）需要更新，而不是一个。\n\
  \n#### **用于双向链表的 Node 类**\n\n代码列表 5.9 展示了一个表示单个节点的简单 Java 类。\n\n***代码列表 5.9: Node.java***\n\
  \n```java\npublic class Node {\n   public String data = \"\";\n   public String\
  \ prev = \"\";\n   public String next = \"\";\n\n   public Node(String data) {\n\
  \     this.data = data;\n     this.prev = \"\";\n     this.next = \"\";\n   }\n\n\
  \   public static void main(String[] args) {\n      Node node1 = new Node(\"Jane\"\
  );\n      Node node2 = new Node(\"Dave\");\n      Node node3 = new Node(\"Stan\"\
  );\n      Node node4 = new Node(\"Alex\");\n   }\n}\n```\n\n代码列表 5.9 定义了 `Node`\
  \ 类，然后创建了四个这样的节点。\n\n### **在双向链表中追加节点**\n\n当您创建一个链表时，必须始终检查根节点是否为空：如果是，则创建一个根节点；否则，将新节点追加到最后一个节点。让我们将前面的句子翻译成伪代码，描述如何向链表添加新元素。\n\
  \n\n\n\n\n```\n 让 ROOT 为链表的根节点（初始为 NULL）\n 让 LAST 为链表的最后一个节点（初始为 NULL）\n 让 NEW 为一个新节点，其\
  \ NEW->next = NULL 且 NEW->prev = NULL\n\n // 决定在新何插入新节点：\nif (ROOT == NULL)\n{\n\
  \   ROOT = NEW;\n   ROOT->next = NULL;\n   ROOT->prev = NULL;\n\n   LAST = NEW;\n\
  \   LAST->next = NULL;\n   LAST->prev = NULL;\n}\nelse\n{\n   NEW->prev = LAST;\n\
  \   LAST->next = NEW;\n   NEW->next = NULL;\n   LAST = NEW;\n}\n```\n\n双向链表的最后一个节点始终指向一个空元素。\n\
