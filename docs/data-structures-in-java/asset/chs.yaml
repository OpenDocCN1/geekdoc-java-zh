  ```\n\n### 任务：最长子串序列\n\n本节包含 Java 示例，用于搜索字符串以确定：最长的唯一字符序列、最长的重复子串\n\n## 最长唯一字符序列\n\
  \n代码列表 3.15 显示了 `LongestUnique.java` 内容，说明了如何找到最长的唯一字符序列。\n\n***代码列表 3.15: LongestUnique.java***\n\
  \n```\n import java.util.Hashtable;\n\npublic class LongestUnique\n{\n   public\
  \ static void rightmost_substr(String my_str)\n   {\n      int left = 0, right =\
  \ 0;\n      String longest = \"\";\n      Hashtable<String, Integer> ht = new Hashtable<String,\
  \ Integer>();\n\n      for(int pos=0; pos<my_str.length(); pos++) {\n        String\
  \ ch_str = \"\" + my_str.charAt(pos);\n\n        Integer count = 0;\n        if\
  \ (ht.containsKey(ch_str)) \n          count = ht.get(ch_str);\n\n        if (count\
  \ > 0) {\n          ht = new Hashtable<String,Integer>();\n          left = pos+1;\n\
  \          right = pos+1;\n        } else {\n          ht.put(ch_str, 1);\n\n  \
  \        String unique = my_str.substring(left,pos+1);\n          //System.out.println(\"\
