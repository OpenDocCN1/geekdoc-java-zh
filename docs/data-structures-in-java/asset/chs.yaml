  \n### 使用一维数组\n\nJava 中的一维数组是一种元素同质的结构（不允许混合类型）。给定两个数组 A 和 B，只要它们具有相同的数量，你就可以对它们进行加减法。你还可以计算向量的内积。\n\
  \n#### 数组\n\nListing 3.17 显示了 `RotateArray.java` 的内容，阐明了如何旋转数组中的元素。\n\n***列表 3.17:\
  \ RotateArray.java***\n\n```java\n import java.util.ArrayList;\n\npublic class RotateArray\n\
  {\n   public static void main(String[] args)\n   {\n      int temp=0, saved=0;\n\
  \      int[] arr1 = new int[]{5,10,17,23,30,47,50};\n      int arr1_len = arr1.length;\n\
  \      System.out.println(\"arr1_len: \"+arr1_len);\n\n      System.out.println(\"\
  original:\");\n      for(int j=0; j<arr1.length; j++) {\n         System.out.print(arr1[j]+\"\
  \ \");\n      }\n      System.out.println();\n      int shift_count = 2;\n     \
  \ for(int i=0; i<shift_count; i++) {\n        saved = arr1[0];\n        for(int\
  \ j=1; j<arr1.length; j++) {\n          arr1[j-1] = arr1[j];\n        }\n      \
  \  arr1[arr1.length-1] = saved;\n      }\n\n      System.out.println(\"rotated:\"\
  );\n      for(int j=0; j<arr1.length; j++) {\n         System.out.print(arr1[j]+\"\
  \ \");\n      }\n      System.out.println();\n   }\n}\n```\n\nListing 3.17 将变量 `list`\
  \ 初始化为整数列表，并将变量 `shift_count` 初始化为值 2：后者是列表元素向左移动的次数。Listing 3.17 的后续部分是一个循环，它执行两个操作：\n\
  \n*   “弹出” `list` 的左侧元素\n*   将该元素附加 `list` 以成为新的右侧元素\n\n该循环执行 `shift_count` 次迭代后，list\
  \ 中的元素已按照指定的次数进行了旋转。在 Listing 3.18 中运行代码，你将看到如下输出：\n\n```\n arr1_len: 7\n original:\
  \ 5 10 17 23 30 47 50 \nrotated:  17 23 30 47 50 5 10 \n```\n\n### 任务：反转相邻数组元素\n\
  \nListing 3.18 显示了 `InvertItems.java` 的内容，阐明了如何对数组中的相邻元素进行两对反转。具体而言，交换索引 0 和索引 1，然后交换索引\
  \ 2 和索引 3，依此类推，直到数组结束。\n\n\n\n\n\n```java\n import java.util.Arrays;\n\npublic class\
  \ InvertItems\n{\n   public static void main(String[] args)\n   {\n      int temp=0,\
  \ mid_point=0;\n      int[] arr1 = new int[]{5,10,17,23,30,47,50};\n\n      System.out.println(\"\
  Original: \"+Arrays.toString(arr1));\n\n      mid_point = (int)(arr1.length/2);\n\
  \n      for(int idx=0; idx<mid_point+2; idx+=2)\n      {\n        temp = arr1[idx];\n\
  \        arr1[idx] = arr1[idx+1];\n        arr1[idx+1] = temp;\n      }\n\n    \
  \  System.out.println(\"Inverted: \"+Arrays.toString(arr1));\n   }\n}\n```\n\nListing\
  \ 3.18 从整数数组 `arr1` 以及作为 `arr1` 中点的变量 `mid_point` 开始。Listing 3.18 的下一部分包含一个从索引 `0`\
  \ 迭代到索引 `mid_point+2` 的循环，其中循环变量 `ndx` 在每次迭代后增加 `2`（而不是 `1`）。如你所见，该代码通过一个名为 `temp`\
  \ 的临时变量对 `arr1` 中索引位置 `ndx` 和 `ndx+1` 的内容执行了标准的“交换”。在 Listing 3.18 中运行代码，你将看到以下输出：\n\
  \n```\n original: [ 5 10 17 23 30 47 50]\ninverted: [10  5 23 17 47 30 50]\n```\n\
  \nListing 3.20 显示了 Java 文件 `Swap.java` 的内容，它说明了如何在不使用中间临时变量的情况下反转数组中相邻的值。注意，Listing\
  \ 3.18 不需要临时变量 `temp` 来切换相邻值，而 Listing 3.19 则依赖于一个临时中间变量。\n\n***LISTING 3.19: Swap.java***\n\
  \n```java\n import java.util.Arrays;\n\npublic class Swap\n{\n   public static int[]\
  \ swap(int num1, int num2)\n   {\n     int delta;\n     delta = num2 - num1;\n \
  \    //print(\"num1:\",num1,\"num2:\",num2)\n\n     num2 = delta;\n     num1 = num1+delta;\n\
  \     num2 = num1-delta;\n     return new int[]{num1,num2};\n   }\n\n   public static\
  \ void main(String[] args)\n   {\n      int num1, num2;\n      int[] result;\n\n\
  \      int[] arr1 = new int[] {15,4,23,35,80,50};\n      System.out.println(\"BEFORE:\
  \ \"+Arrays.toString(arr1));\n\n      for(int idx=0; idx<arr1.length; idx+=2)\n\
  \      {\n        result = swap(arr1[idx],arr1[idx+1]);\n        num1 = result[0];\n\
  \        num2 = result[1];\n        arr1[idx]   = num1;\n        arr1[idx+1] = num2;\n\
  \      }\n\n      System.out.println(\"AFTER:  \"+Arrays.toString(arr1));\n   }\n\
  }\n```\n\nListing 3.19 从切换两个数字值的 `swap` 函数开始。如果这段代码对你不清楚，请尝试使用硬编码的 `num1` 和 `num2`\
