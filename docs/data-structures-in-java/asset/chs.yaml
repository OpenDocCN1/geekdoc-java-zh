  \ Stan\nChecking: Steve\nChecking: Sally\n=> Found Sally\n-------------------\n\n\
  => Search for: Alex\nChecking: Stan\nChecking: Steve\nChecking: Sally\nChecking:\
  \ Alex\n=> Found Alex\n-------------------\n```\n\n列表 5.3 对于少量节点运行良好。对于包含更多节点的链表，我们需要一种可扩展的方法来构建节点列表，这将在下一节中讨论。\n\
  \n### 在链表中添加节点\n\n当你在创建一个链表时，必须始终检查根节点是否为空：如果为空，则创建一个根节点；否则，则将新节点追加到最后一个节点。让我们将前面的句子翻译成伪代码，描述如何向链表添加新元素：\n\
  \n```\n 假设 ROOT 为链表的根节点（初始为 NULL）\n 假设 LAST 为链表的最后一个节点（初始为 NULL）\n 假设 NEW 是一个新节点，并令\
  \ NEW->next = NULL\n\n// 决定将新节点插入的位置：\nif (ROOT == NULL)\n{\n   ROOT = NEW;\n  \
  \ LAST = NEW;\n}\nelse\n{\n   LAST->next = NEW;\n}\n```\n\n链表的最后一个节点始终指向\nNULL。\n\
