  \n# 第 7 章\n\n## 队列与栈\n\n本章介绍了在第 4 章中线性数据结构部分简要介绍过的队列和栈。\n\n本章的第一部分介绍了队列的概念，并提供了\
  \ Java 代码示例，说明如何对队列进行各种操作。某些代码示例还包含了队列的内置函数，如 `isEmpty()`、`isFull()`、`push()` 和\
  \ `dequeue()`。\n\n本章的第二部分介绍了栈的概念，并提供了 Java 代码示例，说明如何对栈进行各种操作。\n\n最后部分包含了三个有趣的任务，说明了栈数据结构的用处。第一个任务是判断字符串是否由平衡的圆括号、方括号和大花括号组成。第二个任务是解析一个可以执行加、减、乘、除以及这四种算术运算的任意组合的表达式。第三个任务是将中缀表达式转换为后缀表达式。\n\
  \n\n\n\n\n队列的最大大小为 `MAX`，最小大小为 `0`。事实上，我们可以根据以下方法来定义队列：\n\n1. `isEmpty()` 如果队列为空则返回\
  \ True\n2. `isFull()` 如果队列已满则返回 True\n3. `queueSize()` 返回栈中的元素数量\n4. `add(item)`\
  \ 如果队列未满，则将元素添加到队列的末尾\n5. `dequeue()` 如果队列不为空，则移除队列的头部元素\n\n为了确保不会发生溢出（空间太大）或下溢（空间太小），在从队列头部“弹出”（popping）元素之前，必须始终调用\
  \ `isEmpty()`；在将元素作为最后一个元素“推入”（追加）到队列之前，必须始终调用 `isFull()`。\n\n### 队列的类型\n\n列表列出了可以创建的各种类型的队列，其中大多数是通用队列的扩展，后面是简要描述：\n\
  \n* 队列 (queue)\n* 环形队列 (circular queue)\n* qequeue\n* 优先级队列 (priority queue)\n\n\
  `queue` 是一个线性列表，支持从一端删除并在另一端插入。队列是 FIFO（先进先出）的，就像等待进入电影院或餐厅的人队一样：队中的第一个先进入，然后是第二个人，依此类推。`enqueue`\
  \ 术语是指向队列中添加元素，而 `dequeue` 是指从队列中移除元素。\n\n`circular queue` 是一个具有以下约束的线性列表：队列中的最后一个元素“指向”队列中的第一个元素。环形队列也被称为\
  \ `ring buffer`（环形缓冲区）。类比一下，康加舞是一种队列：如果队首的人与康加舞队的最后一个人“连接”在一起，那么就被称为 `circular queue`。\n\
  \n`dequeue`（此处指 Deque）是一种线性列表，也是一种双端队列，可以在队列的*两端*执行插入和删除操作。此外，还有两种类型的 Deque：\n\n\
  * 输入受限制意味着插入仅发生在一端\n* 输出受限制意味着删除仅发生在一端\n\n`priority queue` 是允许在队列的任何位置移除和插入元素的队列。例如，你的台式电脑和笔记本电脑操作系统的调度程序使用优先级队列来调度程序的执行。因此，高优先的任务会在低优先级的任务之前执行。\n\
  \n此外，在创建优先级队列之后，可能会有更高优先级的任务到达：在这种情况下，该新的且高优先级的任务将被插入到队列中适当的位置以便任务执行。事实上，Unix 有一个名为\
  \ `nice` 的命令，你可以从命令行启动它以降低任务的执行优先级。有关本节讨论的队列，请进行在线搜索以获取更多信息。\n\n现在让我们关注创建一个基础队列，这是下一节的主题。\n\
  \n### 使用 AR 列表 LIST 创建队列\n\nListing 7.1 显示了 `MyQueue.java` 的内容，它说明了如何使用 `ArrayList`\
