  \ 的内容，该代码说明了如何在链表中删除节点。此代码示例比之前的长，因为代码需要区分删除根节点和删除其他节点的情况。\n\n***列表 5.6：DeleteSLNode.java***\n\
  \n```java\npublic class DeleteSLNode\n{\n   static class Node {\n     String data\
  \ = \"\";\n     Node next = null;\n\n     public Node(String data) {\n       this.data\
  \ = data;\n       this.next = null;\n     }\n   }\n\n   public static Node delete_item(Node\
  \ ROOT, String item)\n   {\n      Node CURR = ROOT;\n      Node PREV = ROOT;\n \
  \     Boolean found = false;\n\n      System.out.println(\"=> searching for item:\
  \ \"+item);\n      while (CURR != null) {\n        if(CURR.data == item) {\n   \
  \        System.out.println(\"Found node with value: \"+item);\n           found\
  \ = true;\n           if(CURR == ROOT) {\n              ROOT = CURR.next // the\
  \ list is now empty\n              System.out.println(\"REMOVED ROOT\");\n     \
  \      } else {\n              PREV.next = CURR.next;\n              System.out.println(\"\
  REMOVED NON-ROOT\");\n           }\n           break;\n        }\n        PREV =\
  \ CURR;\n        CURR = CURR.next;\n      }\n\n      if(found == false)\n      \
  \   System.out.println(\"* Item \"+item+\" not in list *\");\n      else\n     \
  \    System.out.println(\"* Removed \"+item+\" from linked list *\");\n\n      return\
  \ ROOT;\n   }\n\n   public static void display_items(Node ROOT)\n   {\n      System.out.println(\"\
  => Items in Linked List:\");\n      Node CURR = ROOT;\n      while(CURR != null)\
  \ {\n        System.out.println(\"Node: \"+CURR.data);\n        CURR = CURR.next;\n\
