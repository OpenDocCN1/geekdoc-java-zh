  \n```java\n public class ShiftZeroesLeft\n{\n   public static void main(String[]\
  \ args)\n   {\n      int left=-1;\n      int[] arr1 = new int[]{0,10,0,0,60,30,0,200,0};\n\
  \n      System.out.println(\"Initial:\");\n      for(int i=0;i<arr1.length; i++)\
