  \ 3.9 中的代码，你将看到以下输出：\n\n```\n str1: abc\nstr2: def\nresult: \n```\n\n### 任务：字符串排列\n\
  \n有多种方法可以判断两个字符串是否为彼此的排列。一种方法涉及对字符串进行排序：如果生成的字符串相等，那么它们就是排列关系。第二种技术是判断它们的每个字符的出现次数是否相同。第三种方法是将每个字符的数值对应相加。Listing\
  \ 3.10 显示了 `StringPermute.java` 的内容，说明了如何判断两个字符串是否为彼此的排列。\n\nLISTING 3.10：StringPermute.java\n\
  \n```\nimport java.util.Arrays;\n\npublic class StringPermute\n{\n   public static\
  \ void permute(String str1, String str2)\n   {\n      char temp1[] = str1.toCharArray();\n\
  \      char temp2[] = str2.toCharArray();\n      Arrays.sort(temp1);\n      Arrays.sort(temp2);\n\
  \n      String str1d = new String(temp1);\n      String str2d = new String(temp2);\n\
  \      Boolean permute = (str1d.equals(str2d));\n\n      System.out.println(\"string1:\
  \ \"+str1);\n      System.out.println(\"string2: \"+str2);\n      System.out.println(\"\
  permuted:\"+permute);\n   }\n\n   public static void main(String[] args)\n   {\n\
  \      String[] strings1 = new String[]{\"abcdef\", \"abcdef\"};\n      String[]\
  \ strings2 = new String[]{\"efabcf\", \"defabc\"};\n\n      for(int idx=0; idx<strings1.length;\
  \ idx++) {\n         String str1 = strings1[idx];\n         String str2 = strings2[idx];\n\
  \         permute(str1,str2);\n      }\n   }\n}\n```\n\nListing 3.10 从函数 `permute()`\
  \ 开始，该函数接受两个字符串 `str1` 和 `str2` 作为参数。接下来，`temp1[]` 和 `temp2[]` 分别为 `str1` 和 `str2`\
  \ 的字符数组。然后调用 `Arrays.sort(temp1)` 和 `Arrays.sort(temp2)`。最后，字符串 `str1d` 和 `str2d`\
  \ 使用排序后 `temp1` 和 `temp2` 的结果初始化。此时，我们可以通过判断两个字符串是否相等来确定 `str1` 和 `str2` 是否为彼此的排列。\n\
  \n### 任务：检查回文\n\n判断字符串是否为回文的一种方法是将字符串与其反转后的字符串进行比较：如果这两个字符串相等，那么该字符串就是回文。此外，反转字符串有两种方法：一种方法涉及\
  \ Java 的 `reverse()` 函数，另一种方法是从右到左方向处理给定字符串的字符，并将每个字符追加到新字符串中。\n\n\n\n\n\n另一种技术涉及从左到右的方式遍历字符，并将每个字符与其基于从右到左遍历字符串时得到的对应字符进行比较。\n\
  \nListing 3.11 显示了 `Palindrome1.java` 的内容，它说明了如何判断一个字符串或正整数是否为回文。\n\n***代码列表 3.11:\
  \ Palindrome1.java***\n\n```java\n public class Palindrome1\n{\n   public static\
  \ Boolean palindrome1(String str) {\n     int full_len = str.length();\n     int\
  \ half_len = str.length()/2;\n\n     for(int i=0; i<half_len; i++) {\n       char\
  \ lchar = str.charAt(i);\n       char rchar = str.charAt(full_len-1-i);\n      \
  \ if(lchar != rchar)\n         return false;\n     }\n     return true;\n   }  \
  \ \n\n   public static void main(String[] args)\n   {\n      String[] arr1 = new\
  \ String[]{\"rotor\", \"tomato\", \"radar\",\"maam\"};\n      String[] arr2 = new\
  \ String[]{\"123\", \"12321\", \"555\"};\n\n      // 检查字符串回文:\n      for(String\
  \ str : arr1)\n      {\n        Boolean result = palindrome1(str);\n        System.out.println(\"\
  String: \"+str+ \" palindrome: \"+result);\n      }\n\n      // 检查数字回文:\n      for(String\
  \ num : arr2)\n      {\n        System.out.print(\"Number: \"+num);\n        String\
  \ str1 = num;\n        String str2 = \"\";\n        for(int i=0; i<str1.length();\
  \ i++) {\n          str2 = str2 + str1.charAt(i);\n        }\n\n        Boolean\
  \ result = palindrome1(str2);\n        System.out.println(\" palindrome:  \"+result);\n\
  \      }\n   }\n}\n```\n\nListing 3.11 从参数为字符串的 `str` 的函数 `palindrome1()` 开始。该函数包含一个循环，开始时比较字符串\
  \ `str` 的最左侧字符和最右侧字符。循环的下一次迭代移动到字符串左侧的第二个位置，并将该字符与字符串右侧数起第二个的字符进行比较。这种逐步比较一直持续，直到到达字符串的中间。在循环的每次迭代中，如果一对字符不同，则返回值\
  \ `False`。如果所有字符对都相等，则该字符串必须是回文，在这种情况下返回返回值 `True`。\n\nListing 3.11 的下部分包含一个字符串数组\
  \ `arr1` 和一个正整数数组 `arr2`。接下来，另一个循环遍历 `arr1` 中的元素，并调用 `palindrome1` 函数来判断 `arr1`\
  \ 的当前元素是否为回文。同样，第二个循环遍历 `arr2` 中的元素，并调用 `palindrome1` 函数来判断 `arr2` 的当前元素是否为回文。运行\
  \ Listing 3.11 中的代码，你将看到以下输出：\n\n```\n String: rotor palindrome: true\nString: tomato\
  \ palindrome: false\nString: radar palindrome: true\nString: maam palindrome: true\n\
  Number: 123 palindrome:  false\nNumber: 12321 palindrome:  true\nNumber: 555 palindrome:\
  \  true\n```\n\n### 任务：检查最长回文\n\n本节通过检查给定字符串的子字符串，扩展了上一节的代码。Listing 3.12 显示了 `LongestPalindrome.java`\
  \ 的内容，它说明了如何确定给定字符串中的最长回文。注意，单个字符始终是一个回文，这意味着每个字符串都包含一个回文子字符串（事实上，任何字符串中的任何单个字符都是回文）。\n\
