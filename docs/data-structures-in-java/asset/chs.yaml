  \ term = 1, prod = 0;\n\n      for(int j=2; j<max+1; j++)\n      {\n         prod\
  \ = geomsum(j, ratio, term, sum);\n         System.out.println(\"Geometric sum for\
  \ ratio = \"+ratio+\" from 1 to \"+j+\" = \"+prod);\n      }\n   }\n}\n```\n\nListing\
