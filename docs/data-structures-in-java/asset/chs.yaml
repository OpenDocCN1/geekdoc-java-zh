  \n### 二分查找（迭代方案）\n\n列表 4.2 显示了 `BinarySearch.java` 的内容，阐述了如何对数字数组执行二分查找。\n\n***列表\
  \ 4.2：BinarySearch.java***\n\n```\n public class LinearSearch\n{ \n   public static\
  \ void main(String[] args)\n   {\n      int found = -1, item = 123;\n      int[]\
  \ arr1 = new int[]{1,3,5,123,400};\n\n      for(int i=0; i<arr1.length; i++) {\n\
  \        if (item == arr1[i]) {\n           found = i;\n           break;\n    \
  \    }\n      }\n\n      if (found >= 0)\n        System.out.println(\"found \"\
  +item+\" in position \"+found);\n      else\n        System.out.println(item+\"\
  \ not found\");\n   }\n}\n```\n\n列表 4.2 从变量 `found` 开始，其初始值为 `-1`，紧接着是搜索项 `123`，以及包含数字数组的数组\
  \ `arr1`。接下来，通过循环遍历整数数组 `arr1` 的元素，将每个元素与 `item` 的值进行比较。如果发生匹配，则将变量 `found` 设置为循环变量\
  \ `i` 的值，然后提前退出。\n\n列表 4.1 的最后部分检查变量 `found` 的值：如果是非负的，则找到了搜索项（否则它不在数组中）。运行 列表 4.1\
  \ 中的代码，你将看到以下输出：\n\n```\n found 123 in position 3\n```\n\n记住以下几点：尽管数组 `arr1` 包含一个排序的数字列表，但代码对于无序列表同样可以工作。\n\
  \n### 二分查找（递归方案）\n\n列表 4.3 显示了 `BinarySearch.java` 的内容，阐述了如何递归地执行二分查找。\n\n***列表\
  \ 4.3：BinarySearch.java***\n\n```\n public class BinarySearch\n{\n   public static\
  \ Boolean binary_search(int[] data, int item, int left, int right) \n   {\n    \
  \ if(left > right) {\n       return false;\n     } else {\n       //错误（可能导致溢出）:\n\
  \       //int mid = (left + right) / 2 \n       int mid = (int)(left + (right-left)/2;\n\
  \n       if(item == data[mid]) {\n         return true;\n       } else if(item <\
  \ data[mid]) {\n         //递归搜索左半部分\n         return binary_search(data, item, left,\
  \ mid-1);\n       } else {\n         //递归搜索右半部分\n         return binary_search(data,\
  \ item, mid+1, right);\n       }\n     }\n   }\n\n   public static void main(String[]\
  \ args)\n   {\n      int[] items = new int[]{-100, 123, 200, 400};\n      int[]\
  \ arr1 = new int[]{1,3,5,123,400};\n      int[] arr2 = new int[]{1,3,5,123,400};\n\
  \n      System.out.print(\"array: \");\n      for(int i=0; i<arr1.length; i++) {\n\
  \        System.out.print(arr1[i]+\" \");\n      }\n      System.out.println(\"\"\
  );\n\n      for(Integer item2 : items) {\n        arr1 = arr2;\n        System.out.println(\"\
  searching for item:  \"+item2);\n        int left  = 0;\n        int right = arr1.length-1;\n\
  \        Boolean result = binary_search(arr1, item2, left, right);\n        System.out.println(\"\
  item:  \"+item2+ \" found: \"+result);\n      }\n   }\n}\n```\n\n列表 4.3 使用递归的 `binary_search`\
  \ 方法，通过对数组的较小的子数组调用自身。`mid` 的计算执行为 `(int)(left + (right-left)/2)`，以防止在使用 `(left\
  \ + right) / 2 时 时可能整数溢出。\n\n\n\n\n\nListing 4.3 从函数 `binary_search()` 开始，其参数 `data`、`item`、`left`\
  \ 和 `right` 分别包含当前数组、搜索项、`data` 的左索引以及 `data` 的右索引。如果左索引 `left` 大于右索引 `right`，则说明该搜索项在原数组中不存在。\n\
  \n然而，如果左索引 `left` *小于* 右索引 `right`，则代码将 `data` 的中间索引赋值给变量 `mid`。接下来，代码执行以下三部分条件测试：\n\
  \n如果 `item == data[mid]`，则说明在数组中找到了搜索项。\n\n如果 `item < data[mid]`，则调用 `binary_search()`\
  \ 函数并传入 `data` 数组的左半部分。\n\n如果 `item > data[mid]`，则调用 `binary_search()` 函数并传入 `data`\
  \ 数组的右半部分。\n\nListing 4.3 的下一部分初始化了带有数字的排序数组 `arr1`，并使用搜索项列表初始化了数组 `items`，同时初始化了一些标量变量，用于跟踪每次分割数组时我们要搜索的子数组的左右索引位置。\n\
  \nListing 4.3 的最后部分包含一个循环，该循环遍历 `items` 数组中的每个元素，并调用 `binary_search()` 函数来确定当前 `item`\
  \ 是否在排序数组中。运行 Listing 4.3 中的代码，你将看到以下输出：\n\n```\n array: 1 3 5 123 400 \nsearching\
  \ for item:  -100\nitem:  -100 found: false\nsearching for item:  123\nitem:  123\
  \ found: true\nsearching for item:  200\nitem:  200 found: false\nsearching for\
  \ item:  400\nitem:  400 found: true\n123 not found\n```\n\n### 常见的排序算法\n\n排序算法在性能方面有最好情况、平均情况和最坏情况。有趣的是，有时高效算法（例如快速排序）在给定数组已经排序时反而可能表现最差。\n\
  \n以下子节包含这些常见排序算法的代码示例：\n\n* 冒泡排序 (bubble sort)\n* 选择排序 (selection sort)\n* 插入排序\
  \ (insertion sort)\n* 合并排序 (merge sort)\n* 快速排序 (quick sort)\n* 桶排序 (bucketSort)\n\
  * 壳排序 (Shell Sort)\n* 壳排序 108\n* 堆排序 108\n* 原地排序 (inplaceSort)\n* 计数排序 (countingSort)\n\
  * 桶值排序 (radixSort)\n\n如果你想更深入地探索排序算法，可以在互联网上搜索其他的排序算法。\n\n### 冒泡排序\n\n`bubble sort`\
  \ 涉及一个嵌套循环，其中数组的每个元素都会与给定元素右侧的元素进行比较。如果数组元素小于当前元素，则交换它们的值（即“交换”），这意味着数组的内容最终将从最小到最大进行排序。\n\
  \n这是一个示例：\n\n```\n arr1 = np.array([40, 10, 30, 20]);\nItem = 40;\nStep 1: 40 >\
  \ 10 so switch these elements:\narr1 = np.array([10, 40, 30, 20]);\nItem = 40;\n\
  Step 2: 40 > 30 so switch these elements:\narr1 = np.array([10, 30, 40, 20]);\n\
  Item = 40;\nStep 3: 40 > 20 so switch these elements:\narr1 = np.array([10, 30,\
  \ 20, 40]);\n```\n\n如你所示，最小元素位于数组 `arr1` 的最左侧。现在重复此过程，将第二个位置（索引为 1）与右侧元素进行比较。\n\n\
  ```\n arr1 = np.array([10, 30, 20, 40]);\nItem = 30;\nStep 4: 30 > 20 so switch\
  \ these elements:\narr1 = np.array([10, 20, 30, 40]);\nItem = 30;\nStep 4: 30 <\
  \ 40 so do nothing\n```\n\n如你所示，最小两个元素占据了数组 `arr1` 的前两个位置。现在重复此过程，将第三位置（索引为 2）与右侧元素进行比较。\n\
  \n```\n arr1 = np.array([10, 20, 30, 40]);\nItem = 30;\nStep 4: 30 < 40 so do nothing\n\
  ```\n\n数组 `arr1` 现在已按升序排列（从左到右）。如果你想反转顺序使数组按降序排列（从左到右），只需在前面的步骤中将 `>` 运算符替换为 `<`\
  \ 运算符即可。\n\nListing 4.4 显示了 `BubbleSort.java` 的内容，说明了如何对数字数组进行冒泡排序。\n\n***列表 4.4:\
  \ BubbleSort.java***\n\n```\n public class BubbleSort\n{\n   public static void\
  \ main(String[] args)\n   {\n      int[] arr1 = np.array([40, 10, 30, 20]);\n  \
  \    int Item = 40;\n      // Step 1: 40 > 10 so switch these elements:\n      arr1\
  \ = np.array([10, 40, 30, 20]);\n      Item = 40;\n      // Step 2: 40 > 30 so switch\
  \ these elements:\n      arr1 = np.array([10, 30, 40, 20]);\n      Item = 40;\n\
  \      // Step 3: 40 > 20 so switch these elements:\n      arr1 = np.array([10,\
  \ 30, 20, 40]);\n   }\n}\n```\n\n如你所示，最小元素位于数组 `arr1` 的最左侧。现在重复此过程，将第二个位置（索引为 1）与右侧元素进行比较。（注：此处原文此处存在一些碎片化/重复的逻辑，我保持了叙述的流畅性）。\n\
  \nListing 4.4 显示了 `BubbleSort.java` 的内容，说明了如何对数字数组进行冒泡排序。\n\n\n\n\n\n```\n => Initial\
  \ words:\n['abc', 'evil', 'Z', 'cab', 'live', 'xyz', 'zyx', 'bac']\n\nabc  and \
  \ cab  are anagrams\nabc  and  bac  are anagrams\nevil  and  live  are anagrams\n\
  cab  and  bac  are anagrams\nxyz  and  zyx  are anagrams\n```\n\n## 选择排序\n\nListing\
  \ 4.6 显示了 `SelectionSort.java` 的内容，说明了如何对数字数组进行选择排序。\n\n***列表 4.6: SelectionSort.java***\n\
  \n```\n public class SelectionSort\n{\n   public static void main(String[] args)\n\
  \   {\n      int[] arr1 = new int[]{64, 25, 12, 22, 11};\n\n      System.out.print(\"\
  Initial: \");\n      for(int i=0; i<arr1.length; i++) {\n        System.out.print(arr1[i]+\"\
  \ \");\n      }\n      System.out.println (\"\");\n\n      //Traverse through all\
  \ array elements\n      for(int i=0; i<arr1.length; i++) {\n        //Find the minimum\
  \ element in remaining unsorted array\n        int min_idx = i;\n        for(int\
  \ j=i+1; j<arr1.length; j++) {\n          if(arr1[min_idx] > arr1[j])\n        \
  \    min_idx = j;\n        }\n\n        //Swap the found minimum element with the\
  \ first element    \n        int temp = arr1[i];\n        arr1[i] = arr1[min_idx];\n\
  \        arr1[min_idx] = temp;\n      }\n\n      System.out.print(\"Sorted:  \"\
  );\n      for(int i=0; i<arr1.length; i++) {\n        System.out.print(arr1[i]+\"\
  \ \");\n      }\n      System.out.println();\n   }\n}\n```\n\nListing 4.6 首先用一些整数初始化数组\
  \ `arr1`，然后通过循环遍历 `arr1` 的元素。在循环的每次迭代中，另一个内部循环会将当前数组元素与该元素右侧的每个元素进行比较。如果这些元素中任何一个小于当前数组元素，则前者的索引位置保留在变量\
  \ `min_idx` 中。在内部循环执行完毕，通过以下代码片段将当前元素与找到的较元素（如果有）进行“交换”：\n\n```\n arr1[i], arr1[min_idx]\
  \ = arr1[min_idx], arr1[i]\n```\n\n在前面的代码段中，`arr1[i]` 是“当前”元素，而 `arr1[min_idx]`\
  \ 是位于索引 `i` 右侧小于 `arr1[i]` 的元素。如果这两个值相同，则代码段会将 `arr1[i]` 与其自身交换。现在运行 Listing 4.6\
  \ 中的代码，你将看到以下输出：\n\n```\n Initial: 64 25 12 22 11 \nSorted:  11 12 22 25 64 \n```\n\
