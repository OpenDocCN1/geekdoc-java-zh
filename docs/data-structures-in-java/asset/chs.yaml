  Listing 3.16 显示了 `MaxRepeatedSubstr.java` 的内容，阐明了如何在给定字符串中找到重复的最长子串。\n\n***列表 3.16:\
  \ MaxRepeatedSubstr.java***\n\n```java\n public class MaxRepeatedSubstr\n{\n   public\
  \ static String[] check_string(String my_str, String sub_str, int pos)\n   {\n \
  \    String match = \"\", part_str = \"\";\n     int left = 0, right = 0;\n\n  \
  \   int str_len = my_str.length();\n     int sub_len = sub_str.length();\n     //System.out.println(\"\
  my_str: \"+my_str+\" sub_str: \"+sub_str);\n\n     for(int i=0; i<str_len-sub_len-pos;\
  \ i++) {\n       left  = pos+sub_len+i;\n       right = left+sub_len;\n       //System.out.println(\"\
  left: \"+left+\" right: \"+right\");\n\n       if(right > str_len) {\n         //System.out.println(\"\
  right too large: \"+right);\n         break;\n       }\n\n       part_str = my_str.substring(left,right);\n\
  \n       if(part_str.equals(sub_str)) {\n         match = part_str;\n         break;\n\
  \       }\n     }\n\n     return new String[]{match,Integer.toString(left)};\n \
  \  }\n\n   public static void main(String[] args)\n   {\n      System.out.println(\"\
  ==> Repeating substrings have length >= 2\");\n      String [] my_strings = \n \
  \      new String[]{\"abc\",\"abab\",\"abccba\",\"azaaza\",\"abcdefgabccbaxyz\"\
  };\n\n      for(String my_str : my_strings) {\n        System.out.println(\"=> Checking\
  \ current string:     \"+my_str);\n        int half_len = (int)(my_str.length()/2);\n\
  \        int max_len = 0;\n        String max_str = \"\";\n\n        for(int i=0;\
  \ i<half_len+1; i++) {\n          for(int j=2; j<half_len+1; j++) {\n          \
  \  String sub_str = my_str.substring(i,i+j);\n            String[] result = check_string(my_str,\
  \ sub_str,i);\n            String a_str = result[0];\n            int left     =\
  \ Integer.parseInt(result[1]);\n\n            if(a_str != \"\") {\n            \
  \ if(max_len < a_str.length()) {\n                max_len = a_str.length();\n  \
  \              max_str = a_str;\n              }\n            }\n          }\n \
  \       }\n\n        if(max_str != \"\")\n          System.out.println(\"=> Maximum\
  \ repeating substring: \"+max_str+\"\\n\");\n        else\n          System.out.println(\"\
  No maximum repeating substring: \"+my_str+\"\\n\");\n      }\n   }\n}\n```\n\nListing\
  \ 3.16 从 `check_string()` 函数开始，该函数检查字符串 `sub_str` 是否为 `my_str` 的子串，其长度分别赋值给整数变量\
  \ `sub_len` 和 `str_len`。Listing 3.16 的后续部分包含一个循环，该循环遍历字符串 `substr` 中的字符，其索引位置最多为\
  \ `str_len-sub_len-pos`，以确保其不会超过 `substr` 的长度。注意，该循环使用“滑动窗口”来比较 `my_str` 中长度与 `sub_str`\
  \ 长度相等的子串：如果它们相等，则 `my_str` 中存在重复字符串，并返回结果。\n\nListing 3.16 的后续部分定义了 `main()` 方法，该方法首先用一组字符串初始化数组\
  \ `my_strings`，每个字符串都将被检查以确定其是否包含长度至少为 2 的重复子串。`main()` 方法的后续部分是一个外层循环，它遍历 `my_strings`\
  \ 数组的每个元素。\n\n在每次迭代中，一个嵌套循环处理当前元素，其中包含另一个嵌套循环，从索引位置 0 遍历到当前元素的中间点。接下来，提取当前元素的子串并通过\
  \ `check_string()` 方法进行处理，以确定是否存在匹配的子串。此外，将返回的值与最长重复子串的当前“候选”值进行比较，并相应地更新值。\n\n\
