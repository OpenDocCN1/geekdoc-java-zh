  \n### 任务：算术表达式中的标记分类\n\n评估算术表达式是一个有趣的任务，因为解决此问题有多种方法。首先，一些人认为解决此任务的“真正”方法涉及杠杆和解析器。然而，这个任务的目的是让你熟悉字符串解析，之后你将更好地处理非算术表达式。\n\
  \n列表 7.12 显示了文件 `parse_expr.py` 的内容，说明了如何使用栈来解析和评估算术表达式。\n\n***列表 7.12: ClassifyTokens.java***\n\
  \n\n\n\n```java\n import java.util.ArrayList;\nimport org.apache.commons.lang.text.StrTokenizer;\n\
  \npublic class ClassifyTokens\n{\n   //将字符串解析为标记并对其进行分类 \n   public static void\
  \ tokenize(String my_expr)\n   {\n     ArrayList tokens_types = new ArrayList();\
  \ \n     String[] math_symbols = new String[] {\"*\",\"/\",\"+\",\"-\"};\n     String\
  \ all_digits = new String(\"0123456789\");\n     String oper = \"\";\n     String\
  \ int_str1 = \"\"; \n\n     my_expr = parseString(my_expr);\n     System.out.println(\"\
  STRING: \"+my_expr);\n\n     int idx=0;\n     while(idx<my_expr.length()) {\n  \
  \     // 1) 提取整数：\n       int_str1 = \"\"; \n       char token = my_expr.charAt(idx);\n\
  \       String tokenStr = String.valueOf(token);\n\n       System.out.println(\"\
  extract number:\");\n       while(idx<my_expr.length()) \n       {\n          System.out.println(\"\
  tokenStr: \"+tokenStr+ \" idx: \"+idx);\n          if(all_digits.contains(tokenStr))\
  \ {\n             int_str1 += tokenStr;\n             idx += 1;\n          } else\
  \ {\n            break;\n          } \n\n          if( idx == my_expr.length())\
  \ {\n             System.out.println(\"Reached end of string\");\n             break;\n\
  \          }\n\n          token = my_expr.charAt(idx);\n          tokenStr = String.valueOf(token);\n\
  \       }\n       tokens_types.add(\"token: \"+int_str1 + \" type: NUMERIC\");\n\
  \       System.out.println(\"=> int_str1: \"+int_str1);\n       System.out.println();\n\
  \n       // 2) 检查算术符号：*, /, +, 或 -\n       if(substr_in_array_strings(math_symbols,\
  \ tokenStr) == true) { \n         oper = tokenStr;\n         System.out.println(\"\
  => found operator: \"+oper);\n         System.out.println();\n         tokens_types.add(\"\
  token: \"+oper + \" type: SYMBOL\");\n       }\n       idx += 1;\n     }    \n \
  \    System.out.println(\"SUMMARY:\");\n     for(int i=0; i<tokens_types.size();\
  \ i++)\n     {\n        System.out.println(\"string/type: \"+tokens_types.get(i));\n\
  \     }\n     System.out.println(\"-------------------\\n\");\n   }\n   public static\
  \ Boolean substr_in_array_strings(String[] my_array,String str) \n   {\n     for(String\
  \ elem : my_array) {\n       if(elem.contains(str))\n         return true;\n   \
  \  } \n     return false;\n   }\n\n   public static String parseString(String expr)\n\
  \   {\n      String parsed = \"\";\n      //System.out.println(\"String: \"+expr);\n\
  \      StrTokenizer tokenizer = new StrTokenizer(expr, \" \");\n      while (tokenizer.hasNext())\
  \ {\n         String token = tokenizer.nextToken().trim();\n         //System.out.println(\"\
  token: \"+token);\n         parsed = parsed + token;\n      }\n      System.out.println();\n\
  \      return parsed;\n   }\n\n   public static void main(String[] args)\n   {\n\
  \      String[] exprs = new String[]{\"          2789  *  3+7-8-  9\",\n       \
  \                             \"4 /2  +  3\",\n                                \
  \    \"4 /2  +  1\",\n                                    \"9  -  3  +  4     \"\
  };\n      for(String expr : exprs) {\n         tokenize(expr);\n      }\n   }\n\
  }\n```\n\n`Listing 7.12` 开始通过将变量 `tokens_types` 定义为 Java `ArrayList` 类的实例，接着是包含\
  \ 7.12 的变量 `math_symbols`。该代码段还定义了 `tokenize()`、`substr_in_array_string()` 和 `parseString()`\
  \ 方法，它们分别用于对字符串进行分标记、检查字符串是否包含子字符串以及解析字符串。\n\n`parseString()` 的代码与前一节中 `TokenizeExpr`\
  \ 类中的方法相同。`substr_in_array_string()` 方法检查给定字符串是否为字符串数组中的元素。`parseString()` 方法也与前一节中\
  \ `TokenizeExpr` 类中的方法相同。\n\n`main()` 方法将变量 `exprs` 初始化为字符串数组，每个元素都是一个算术表达式。接下来，通过循环遍历\
  \ `exprs` 的元素。在每次迭代中，调用 `tokenize()` 方法并传入 `exprs` 数组中的当前元素。运行 `Listing 7.12` 中的代码，你将看到以下输出：\n\
  \n```\n STRING: 2789*3+7-8-9\nextract number:\ntokenStr: 2 idx: 0\ntokenStr: 7 idx:\
  \ 1\ntokenStr: 8 idx: 2\ntokenStr: 9 idx: 3\ntokenStr: * idx: 4\n=> int_str1: 2789\n\
  \n=> found operator: *\n\nextract number:\ntokenStr: 3 idx: 5\ntokenStr: + idx:\
  \ 6\n=> int_str1: 3\n\n=> found operator: +\n\nEXTRACT NUMBER:\nTOKENSTR: 3 idx:\
  \ 5\nTOKENSTR: + idx: 6\n=> int_str1: 3\n\n=> found operator: +\n\nEXTRACT: \nTOKENSTR:\
  \ 3 idx: 5\nTOKENSTR: + idx: 6\n=> int_str1: 3\n\n=> found operator: +\n（注：此处根据原文逻辑保持输出格式，实际运行中可能重复，此处保持一致性）\n\
  \n### **中缀、前缀和后缀表示**\n\n有三种常用且表示算术表达式的方法：中缀表示、前缀表示和后缀表示。\n\n*中缀表示*将运算符放在操作数*之间*，这是我们编写算术表达式的典型方式（例如：3+4）。\n\
  \n*前缀表示*（也称为波兰表示）将运算符放在操作数*之前*。例如，中缀表达式 3+4 对应的前缀表达式为 + 3 4。\n\n*后缀表示*（也称为逆波兰表示）将运算符放在其操作数*之后*。以下是示例：\n\
  \n4*5 变为 4 5 *\n\na*b + c*d 变为 a b * c d * +\n\na * b – (c + d) 变为 a b c d + –\n\
  \n3+4*5 变为 3 4 5 * +\n\n你可以使用栈来执行后缀操作，这些操作涉及将数值（或变量）值推入栈，当在后缀表达式中遇到二元运算符时，将该运算符应用于栈顶两个元素，并将它们替换为结果。作为一个示例，让我们查看计算表达式\
  \ 3+4*5 的栈内容，其后缀表达式为 3 4 5 * +\n\n步骤 1：推入 3\n\n3\n\n步骤 2：推入 4\n\n4\n\n3\n\n步骤 3：推入\
  \ 5\n\n5\n\n4\n\n3\n\n步骤 4：对栈顶两个元素应用 *\n\n20\n\n3\n\n步骤 5：对栈顶两个元素应用 +\n\n23\n\n\
  当我们到达后缀表达式的末尾时，看到栈中只有一个元素，即为评估后缀表达式的结果。\n\n下表包含了使用中缀、前缀和后缀表示法的更多示例。\n\n\n\n\n\n\
  ```\n Infix     Prefix     Postfix\nx+y       +xy        xy+ \nx-y       -xy   \
  \     xy- \nx/y       /xy        xy/ \nx*y       *xy        xy* \nx^y       ^yx\
  \        yx^ \n\n(x+y)*z   *(x+y)z    (x+y)z*\n(x+y)*z   *(+xy)z    (xy+)z*\n```\n\
  \n让我们来看下面稍微复杂的中缀表达式（注意加粗显示的 `/` 符号）：\n\n```\n [[x+(y/z)-d]²]/(x+y)\n```\n\n我们将执行一系列迭代步骤，通过对顶层运算符应用中缀符号定义，将该中缀表达式转换为前缀表达式。在本中，顶层运算符是加粗显示的\
  \ `/` 符号。我们需要将这个 `/` 符号放在最左侧的位置，如下（注意加粗显示的 `^` 符号）：\n\n```\n /[[x+y/z-d]²](x+y)\n\
  ```\n\n现在，我们需要将这个 `^` 符号放在第二个左方括号的左侧，如下（注意加粗显示的 `/` 符号）：\n\n```\n /[^[x+(y/z)-d]2](+xy)\n\
  ```\n\n现在，我们需要将这个 `/` 符号放在变量 `y` 的左侧，如下（注意加粗显示的 `+` 符号）：\n\n```\n /[^[x+(/yz)-d]2](+xy)\n\
  ```\n\n现在，我们需要将这个 `+` 符号放在变量 `x` 的左侧，如下（注意加粗显示的 `/` 符号）：\n\n```\n /[^[+x(/yz)-d]2](+xy)\n\
  ```\n\n现在，我们需要将这个 `/` 符号放在变量 `x` 的左侧，如下，此时它已经是一个中表达式了：\n\n```\n /[^[-(+(/yz))d]2](+xy)\n\
  ```\n\n请通过非在线搜索更多关于前缀和后缀表达式的示例，以及使用 Java 数据结构实现这些表达式的代码样本。\n\n### 总结\n\n本章从队列的介绍开始，并提供了队列在现实世界的示例。接下来，你学习了与队列相关的几个函数，例如\
  \ `isEmpty()`、`isFull()`、`push()` 和 `dequeue()`。\n\n随后，你学习了栈，它是一种后进先出（LIFO）数据结构，以及一些\
  \ Java 代码样本，向你展示如何在栈上执行各种操作。示例包括反转栈的内容，以及判断栈的内容是否构成回文。\n\n在本章的最后一部分中，你学习了如何判断一个字符串是否由平衡的圆括号、方括号和大大括号组成；如何解析算术表达式；以及如何将中缀符号转换为后缀符号。\n\
