  \n下一节提供了关于 `String` 类中 `==` 和 `equals()` 方法之间差异的细节。\n\n## 字符串的相等性\n\n与其他语言不同，`==`\
  \ 运算符并不判断两个字符串是否相同：该运算符仅判断两个变量是否引用了同一个内存位置。`equals()` 方法将比较两个字符串的*内容*，而 `==` 运算符则匹配字符串的*对象*或引用。\n\
  \n列表 1.7 显示了 `EqualStrings.java` 的内容，说明了如何比较两个字符串并判断它们具有相同的值或相同的引用（或两者都是）。\n\n***列表\
  \ 1.7: EqualStrings.java***\n\n```\n import java.io.IOException;\n\npublic class\
  \ EqualStrings\n{\n   public static void main(String[] args) throws IOException\n\
  \   {\n      String str1 = \"Pizza\";\n      String str2 = \"Pizza\";\n\n      if\
  \ (str1.equals(str2))\n      {\n         System.out.println(\"str1 and str2: equal\
  \ values\");\n      }\n\n      if (str1 == str2)\n      {\n         System.out.println(\"\
  str1 and str2: equal references\");\n      }\n\n      System.out.println(\"\");\n\
  \n      String str3 = \"Pasta\";\n      String str4 = new String(\"Pasta\");\n\n\
  \      if (str3.equals(str4))\n      {\n         System.out.println(\"str3 and str4:\
  \ equal values\");\n      }\n      else\n      {\n         System.out.println(\"\
  str3 and str4: unequal values\");\n      }\n      if (str3 == str4)\n      {\n \
  \        System.out.println(\"str3 and str4: equal references\");\n      }\n   \
  \   else\n      {\n         System.out.println(\"str3 and str4: unequal references\"\
  );\n      }\n   }\n}\n```\n\n列表 1.7 定义了 Java 类 `EqualStrings` 和一个 `main()` 函数，该函数定义了字符串变量\
  \ `str1`、`str2`、`str3` 和 `str4`。运行列表 1.7 中的代码，你将看到以下输出：\n\n```\n str1 and str2:\
  \ equal values\nstr1 and str2: equal references\n\nstr3 and str4: equal values\n\
  str3 and str4: unequal references\n```\n\n记住当你创建一个字符串字面量时，JVM（Java 虚拟机）会检查池中是否存在该字符串。如果字符串在池中，它将返回该引用；否则，将创建一个新的字符串实例。为了判断两个字符串是否相同，请使用\
  \ `equals()` 方法，该方法将在下一节中讨论。\n\n### 比较字符串\n\n列表 1.8 显示了 `EqualStrings.java` 的内容，说明了如何比较两个字符串并判断它们是否具有相同的值或相同的引用（或两者都是）。\n\
  \n***列表 1.8: CompareStrings.java***\n\n```\n public class CompareStrings\n{\n  \
  \ public CompareStrings(){}\n\n   public static void main (String args[])\n   {\n\
  \      String line1 = \"This is a simple sentence.\";\n      String line2 = \"this\
  \ is a simple sentence.\";\n\n      System.out.println(\"line1: \"+line1);\n   \
  \   System.out.println(\"line2: \"+line2);\n      System.out.println(\"\");\n\n\
  \      if (line1.equalsIgnoreCase(line2))\n      {\n         System.out.println(\"\
  line1 and line2: case-insensitive equal\");\n      }\n      else\n      {\n    \
  \     System.out.println(\"line1 and line2: case-insensitive different\");\n   \
  \   }\n\n      if (line1.toLowerCase().equals(line2))\n      {\n         System.out.println(\"\
  line1 and line2: equal after toLowerCase()\");\n      }\n      else\n      {\n \
  \        System.out.println(\"line1 and line2: unequal after toLowerCase()\");\n\
  \      }\n   }\n}\n```\n\n列表 1.8 定义了 Java 类 `CompareStrings` 和一个 `main()` 函数，定义了字符串变量\
  \ `line1` 和 `line2`。运行列表 1.8 中的代码，你将看到以下输出：\n\n```\nline1: This is a simple sentence.\n\
  line2: this is a simple sentence.\n\nline1 and line2: case-insensitive equal\nline1\
  \ and line2: equal after toLowerCase()\n```\n\n## 在 Java 中搜索子字符串\n\n列表 1.9 显示了 `SearchString.java`\
  \ 的内容，说明了如何使用 `indexOf()` 方法判断一个字符串是否为另一个字符串的子字符串。注意此代码示例涉及 `if` 语句，该语句将在章的最后一个代码示例中详细讨论。\n\
  \n***列表 1.9: SearchString.java***\n\n```\n public class SearchString\n{\n   public\
  \ SearchString(){}\n\n   public static void main (String args[])\n   {\n      int\
  \ index;\n      String str1 = \"zz\", str2 = \"Pizza\";\n\n      index = str2.indexOf(str1);\n\
  \      if(index < 0)\n      {\n         System.out.println(str1+\" is not a substring\
  \ of \"+str2);\n      }\n      else\n      {\n         System.out.println(str1+\"\
