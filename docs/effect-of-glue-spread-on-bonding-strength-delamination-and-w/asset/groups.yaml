    Figure 6. DMA curve of the cost-gelating-melamine-adhesives (a) (MF-0) and (b)
    (MF-1).


    ## 3.2. Bonding Strength and Delamination of CLT


    For CLT manufacturers and consumers, the most important factor is the bond integrity,
    which involves bonding strength and delamination [5,34-36]. The bond integrity
    refers to the adhesive strength between two layers and is influenced by the type
    of adhesive, the wood species, and the surface treatment [1.3]. The bonding strength
    can be determined through block-shear strength testing using specialized machines.


    A new adhesive format had to be developed, since commercial MF cannot be directly
    applied for CLT pressing. Our trial revealed that commercial MF was not glued
    well as CLT. As a result, CLT (MF-0) was manufactured using a melamine-based adhesive,
    which was glued at 1 MPa, and heat-treated at 100 °C for 2 h to cure the adhesive,
    as shown in Figure 1. The properties of CLT bonded with MF-1 were successfully
    tested using the cold-pressing method (Figure 2). The block-shear test showed
    that the bonding strength of MF-0 with glue of 300 g/m² was 2.13 MPa, 1.94 MPa,
    and 1.03 MPa, respectively (Figure 7a).


    The highest bonding strength of CLT bonded with MF-1 was 3.14 MPa, which was achieved
    with glue strength of 300 g/m² and 250 g/m². Figure 7b shows the load-displacement
    curve and block-shear strength of CLT bonded with MF-1. A greater maximum load
    was observed at a greater displacement as the glue strength increased. A maximum
    load of approximately 9750 N at a displacement of 8.3 mm was achieved using 300
    g/m² of adhesive with MF-1, while 280 g/m² of glue spread led to a maximum load
    of 5506 N at a displacement of 5.9 mm, and 250 g/m² of glue spread resulted in
    a maximum load of approximately 3400 N at a displacement of 3.6 mm.


    ![](img/6decd15101152cf788f8cb0286b2f312_8_0.png)


    **Figure 7.** Block-shear strength of CLT bonded with melamine-based adhesive
    at different glue spreads in the control (MF-0) and modified MF (MF-1) (a) and
    the load-displacement curve of block-shear strength of MF-1 (b).


    The bonding of CLT can be increased by 5% citric acid and 3% PMDI, which leads
    to the formation of a larger molecular chain through interactions of MF, citric
    acid, and PMDI. The bonding strength of CLT with MF-1 adhesive is greater than
    that of CLT with MF-0 due to the extensive molecular chain of MF-1 and the formation
    of high cohesion strength. A glue spread of 300 g/m² and pressure of 1 MPa resulted
    in a better block-shear strength value for CLT bonded with MF-1 (3.14 MPa) than
    that of cross-laminated bamboo and timber (CLT) bonded from laminated bamboo and
    Chinese fir with reinforcement (2 MPa). Yang et al. [34] also reported that the
    block-shear strength of CLT with 200 g/m² glue spread and bonding pressure of
    1 MPa was 2.47 MPa in the major direction. The block-shear strength values of
    CLT bonded with MF-1 at 280 and 300 g/m² were those of CLT made from spruce-pine-fir
    bonded with polyurethane, emulsion isocyanate, and phenol resorcinol formaldehyde
    for glue spreads of 200, 270, and 250 g/m², respectively.


    The shear performance of CLT panels is a critical factor in panel failure, as
    the stress experienced in the layers is perpendicular to the major axis of the
    panel [8]. In CLT block-shear testing, the leading mode of failure is perpendicular
    to the grain, resulting in a lower block-shear strength compared with that of
    laminated timber from the same wood material. The research conducted that the
    block-shear strength of CLT bonded with MF-0 and MF-1 did not meet the requirements
    stipulated in EN 16531:2021 [25], which states that the bonding strength should
    be at least 6 MPa.


    **Figure 8** shows the delamination values of CLT bonded with MF-0 and MF-1 adhesives
    at different glue spreads, Figure 8b shows the wood failure pattern of the block-shear
    samples after testing. The delamination of MF-0 for three different glue spreads
    (250, 280, and 300 g/m²) was 26.30–13.07%. In terms of bonding strength, delamination
    decreased as the wood failure percentage increased with more glue spreads [25].
    The delamination percentage and wood failure percentage of MF-0 had a value lower
    than 20%. The values did not meet the values stipulated in the EN 16531:2021 standard
    [29]. The block-shear testing samples of CLT bonded with MF-0 adhesive revealed
    that only one glue damage was found, as shown in Figure 9a. Meanwhile, the delamination
    and wood failure percentage of MF-1 were better than those of MF-0. The damage
    after block-shear testing identified as wood failure (Figure 9b), with the percentage
    of CLT bonded with MF-1 being nearly 3–5 times higher than that of MF-0, as shown
    in Figure 8b. Application of 300 g/m² of glue spread (MF-1) resulted in the lowest
    and highest delamination and wood failure percentage at 5.70% and 98.33%, respectively.
    The delamination and wood failure percentage of japon CLT with MF-1 (300 g/m²)
    met the requirements of the EN 16531:2021 standard. The standard specifies that
    delamination should be at least 90%. Meanwhile, glue spreads of 280 g/m² and 250
    g/m² produced CLT with 13.91% and 19.42% delamination and 66.67% and 33.33% wood
    failure.


    ![](img/6decd15101152cf788f8cb0286b2f312_9_0.png)


    ![](img/6decd15101152cf788f8cb0286b2f312_9_1.png)


    **Figure 8.** Delamination (a) and wood failure (b) percentage of CLT bonded with
    MF-0 and MF-1 at different glue spreads.


    ![](img/6decd15101152cf788f8cb0286b2f312_9_2.png)


    ![](img/6decd15101152cf788f8cb0286b2f312_9_3.png)


    **Figure 9.** Images of wood failure after the block-shear test of CLT bonded
    with MF-0 (a) and MF-1 (b) at different glue spreads.

