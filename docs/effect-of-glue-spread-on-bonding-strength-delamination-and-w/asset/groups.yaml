    和 MF-1 粘接的 CLT 抗剪强度不符合 EN 16531:2021 的规定 [25]，该标准规定粘接强度至少为 6 MPa。


    **图 8** 显示了不同涂胶量下使用 MF-0 和 MF-1 粘剂粘接的 CLT 分层值，图 8b 显示了测试后抗剪样本的木材失效模式。MF-0 的三种不同涂胶量（250、280
