    ## 3.2. 粘接强度与分层


    对于 CLT 制造商和消费者，最重要的因素是结合完整性，涉及粘接强度和分层 [5,34]。结合完整性是指两层之间的粘接强度，受粘剂类型、木材种类和表面处理的影响。粘接强度可以通过抗剪强度测试来确定。需要开发一种新的粘剂格式，因为商业
    MF 无法直接应用于 CLT 压。我们的试验表明商业 MF 的粘接效果良好。作为结果，使用三聚甲胶剂制造的 CLT (MF-0) 在 1 MPa 下粘接并在
    100 °C 下固化 2 小时，如图 1 所示。通过冷压成功测试了使用 MF-1 的 CLT 性能。抗剪测试显示 MF-0 在 300 g/m² 涂胶量下的粘接强度分别为
    2.13 MPa、1.94 MPa 和 1.03 MPa（图 7）。


    使用 MF-1 的 CLT 的最高粘接强度为 3.14 MPa，分别在 300 g/m² 和 250 g/m² 的涂胶量下实现。图 7b 显示了 MF-1
    的抗剪强度和负载-位移曲线。随着涂胶量的增加，在更大的位移处观察到更大的载荷。使用 300 g/m² 涂胶量的 MF-1 在 8.3 mm 位移处达到约 9750
    N 的最大载荷，280 g/m² 涂胶量在 5.9 mm 位移处产生最大载荷 5506 N，250 g/m² 涂胶量在 3.6 mm 位移处产生最大载荷 3400
    N。


    ![](img/6decd15101152cf788f8cb0286b2f312_8_0.png)


    **图 7.** 不同涂胶量下使用三聚甲胶剂粘接的 CLT 抗剪强度 (a) 对照 (MF-0) 和改性 MF (MF-1)，以及 MF-1 的抗剪强度负载-位移曲线
    (b)。


    CLT 的粘接可以通过 5% 柠檬酸和 3% PMDI 增强，这通过 MF、柠檬酸和 PMDI 的相互作用形成了较大的分子链。使用 MF-1 粘剂的 CLT
    粘接强度大于 MF-0，由于 MF-1 广泛的分子链和高内聚强度的形成。300 g/m² 的涂胶量和 1 MPa 的压力使 MF-1 的 CLT 抗剪强度值
    (3.14 MPa) 优于层压竹和木材 (CLT) (2 MPa)。Yang 等人 [34] 也报告说，200 g/m² 涂胶量和 1 MPa 粘接压力下
