    表2展示了统计分析，旨在评估胶水涂布量如何影响应用于 jabon 木交叉胶层木材（CLT）的冷固性树胶（MF-1）的结合强度、分层和木材失效。统计分析显示，木材失效受胶水涂布的影响的影响，与结合强度和分层相比，其
    $R^2$ 值较高（0.8729），$p$ 值较低（0.0002），F 值较高（48.0947）。相反，结合强度受影响较小，因为标准差较大，$R^2$ 值为
    0.4728。使用邓肯（Duncan''s）事后多重检验表明，使用 300 $g/m^2$ 涂布量产生的 CLT 在结合强度、分层和木材失效方面优于 250
    $g/m^2$ 和 280 $g/m^2$ 的值。


    **表2.** 具有不同性能的 MF-1 粘胶 CLT 的方差分析（ANOVA）和邓肯多重范围检验。


