    ## 冷固型三胺类胶剂涂布量对Jabon木基胶层木材粘接强度、分层及木材失效的影响


    Yusup Amin<sup>1,2,*</sup>, Renaldi Prummo Adji<sup>2</sup>, Muhammad Rahadi Rahulis<sup>1</sup>,
    Nareswo Nugroho<sup>2</sup>, Effendi Bakhtri<sup>2</sup>, Wahyu Diwanto<sup>1</sup>
    和 Lina Karlinasari<sup>2,*</sup>


    **单位与联系方式：**

    *   <sup>1</sup>生物质与生物生产研究中心，国家研究与创新机构，Cibubong 16911, West Java, Indonesia

    *   <sup>2</sup>林产品系，森林与环境学院，IPB大学，Bogor 1648, West Java, Indonesia

    *   联系邮箱：yusuf07@brin.go.id (Y.A.); karlinasari@apps.ipb.ac.id (L.K.)


    **摘要：** 交叉层积材（CLT）因其创新特性和快速发展已成为一种流行的工程木材，涉及多种木材种类和胶剂的使用。本研究旨在评估在使用Jabon木和冷固型三胺类胶剂时，在三种不同涂布率（250、280和300
    g/m²）下，胶水应用对CLT粘接强度、分层和木材失效的影响。该胶剂由三胺甲醛、添加5%柠檬酸、3%聚聚型4,4''-亚甲基二苯异氰酸酯（pMDI）和10%小麦粉组成。这些成分的加入增加了粘度并降低了强度。根据16531/2021标准对使用三胺类胶剂压胶工艺制成的CLT样品进行评估。结果显示，较高的胶涂布量会导致更大的粘接强度、更少的分层和更高的木材失效。与密度和粘接强度相比，胶涂布量对木材失效的影响更大。在CLT上应用300
    g/m²的胶涂布量使其产品符合标准。使用改性MDF生产了一种可持续产品，从较低的热能消耗来看，它是CLT生产的一种种可行方案。


    **关键词：** 粘接强度；柠檬酸；Jabon木；三胺甲醛；pMDI


    文章


    引用：Amin, Y.; Adji, R.P.; Rahulis, M.A.R.; Nugroho, N.; Bakhtri, E.; Diwanto, W.;
    Karlinasari, L Effect of Glue Spread on Bonding Strength, Delamination, and Wood
    Failure of Jabon Wood-Based Cross-Laminated Timber. 2023, *15*, 2349. https://doi.org/10.3390/polym1552349


    学术编辑：Hiroshi Yoshihara


    收稿：2023年2月20日

    修回：2023年3月13日

