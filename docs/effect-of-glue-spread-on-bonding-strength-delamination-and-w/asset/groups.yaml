    | Type of Adhesive | Solids Content (%) | Gelation Time (min, T=100 °C) | Viscosity
    (mPa·s, T=25 °C) | pH |

    |---|---|---|---|---|

    | MF-0 | 51.89 ± 0.36 | 30.27 ± 0.13 | 484.51 ± 3.69 | 7.67 ± 0.58 |

    | MF-1 | 48.58 ± 0.08 | 6.90 ± 0.10 | 570.45 ± 14.80 | 6.67 ± 0.58 |


    The gelation time in wood adhesives refers to the duration for the adhesive to
    form a gel. This gel formation creates stronger connections between the molecules,
    resulting in stronger adhesion. As the gel forms, the viscosity of the adhesive
    increases, and the adhesive becomes less mobile. This point, where the viscosity
    is exceptionally high and the adhesive forms a gel, is known as the gel point.
    The gelation time of MF-0 was found to be five times longer than that of MF-1,
    while this difference was attributed to the use of a citric acid catalyst or pMDI
    cross-linker in MF. MF-0 was formed by adding citric acid and pMDI to MF. The
    addition of these catalysts and cross-linkers promotes the formation of longer
    chains. This finding is in line with a previous study that reported a reduction
    in the gelation time of melamine-based adhesives when mixed with NH4Cl as a hardener.
    A study by [31] reported that incorporating 1–2% pMDI can reduce the gel time
    of MF-based adhesives.


    The inclusion of 5% citric acid and 3% pMDI in MF-0 resulted in a lower pH for
    MF-1 compared to that of MF-0, with values of 6.67 and 7.67, respectively. This
    difference can be attributed to the presence of the carboxylic acid group (–COOH)
    in citric acid and the isocyanate group (–NCO) in pMDI, which can react with free-formaldehyde
    (HCHO2) and the methyl group (–CH2OH) to form a cross-linked polymer in melamine-based
    adhesives.


    The average viscosity is a measure of the resistance to pressure. In the case
    of liquid adhesives, the average viscosity is related to the thickness of the
    liquid. The control adhesive, MF-0, had a viscosity of 484.51 mPa·s while the
    viscosity was higher than that of MF-0 due to the formation of a larger molecular
    chain from the interactions of citric acid and pMDI. A recent study [35] reported
    that the viscosity of MF-based adhesives increased by adding 2% pMDI.


    The dynamic viscosity and cohesion strength of melamine-based adhesives were analyzed
    using a rotational rheometer, as depicted in Figure 4a. In line with the average
    viscosity, dynamic viscosity of MF-1 was higher than that of MF-0. The dynamic
    was in the range of 545–587 mPa·s during 200 min while MF-0 was around 473–489
    mPa·s. This result shows that the viscosity of MF-1 increased remarkably compared
    with that of MF-0 in 200 min. Furthermore, the molecules of MF-0 were relatively
    stable for 200 min. The cohesion strength of an adhesive relates to'
