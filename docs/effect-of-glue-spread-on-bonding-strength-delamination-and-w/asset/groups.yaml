    # 1. Introduction


    Engineered wood products have gained popularity due to the increasing demand for
    environmentally friendly building material and the growth of global development
    [1–4]. Cross-laminated timber (CLT) is an example of this type of product, which
    has emerged as a viable building material produced by laminating glued wood, with
    each layer orthogonally and bonded with structural adhesives [5,6]. As a building
    material for structural applications [7,8], it has high mechanical and physical
    characteristics of cross-laminated timber (CLT) that are better than those other
    types of manufactured products, such as glued lumber, oriented strand board.


    Recently, CLT has gained increased interest in the local market, particularly
    outside of Europe [4,9–11]. Even Japan and China have started CLT production,
    whereas such as Malaysia and Indonesia, are in the early stages of development
    [10,12]. Extensive research and development are required to produce CLT wood local
    high-quality product. It is necessary to take into account factors such as raw
    materials is a crucial prerequisite for ensuring quality availability, strength
    properties, bonding characteristics, and durability when manufacturing CLT with
    local wood species [12].


    The production process can differ between countries owing to variations in tree
    species and available adhesives. Therefore, the parameters involved in the production
    from local tree species, including the type of adhesive, glue consumption, and
    pressure, should be explored [7].


    CLT production uses layers from wood species to enhance efficiency and improve
    quality. The selection of adhesives is a crucial factor that requires careful
    consideration. Types of adhesives used to fabricate CLT include phenol-rescinol,
    melamine formaldehyde (MF), polymer cyanate, and polyurethane [13], while phenol-rescinol
    and isocyanate are used in European production [2], and in Japan MF are extensively
    used in the production of semi-exterior and exterior-grade wood [14]. The adhesive
    is widely selected for CLT production because of its relatively low cost, bonding
    lines, and moisture resistance [15]. However, the adhesives must be capable of
    transferring loads and maintaining their strength and durability over the life
    of the structure.


    As a thermosetting adhesive, MF is generally applied with the use of hot presses
    which involves additional energy costs. Marine et al. [18] showed that the curing
    temperature of MF adhesive is 140–160 °C. Heat treatment during wood composite
    produces formaldehyde emissions from raw material [19]. Innovation is needed to
    modify MF-based adhesives to allow cold-pressing applications without degrading
    the mechanical strength of CLT products. In this research, japon (Artocarpus đìnhophyllus
    Rox.) and modified MF-based adhesive were used to manufacture CLT through cold-pressing
    application [20].


    To improve the production of cross-laminated timber (CLT), a new cold-setting
    adhesive formula was developed by incorporating methylene formaldehyde (MF)-4,4''-methylene
    diphenylisocyanate (PDI). PDI resin has demonstrated its effectiveness in producing
    medium-density particle boards [23]. The optimal amount of adhesive used in CLT
    manufacturing should also be considered a variable that determines mechanical
    performance and cost [24]. This study aims to evaluate delamination, bonding strength,
    and wood failure of CLT products made from jabon wood using cold-setting adhesive
    based on MF and PDI spreads of 250 g/m², 280 g/m², and 300 g/m².


    # 2. Materials and Methods


    ### 2.1. Materials


    The commercial melamine adhesive (MF-0) was supplied by PTolite, Proboling, East
    Java. Wheat flour, technical-grade citric acid, and polymeric 4,4''-methylene
    diphenylisocyanate (PDI) were obtained from the commercial market and provided
    by the Laboratory National Research and Innovation Agency (BRIN), Cibubong, Indonesia.
    The raw material for producing CLT was obtained from jabon wood in the Bogor area,
    West Java. The wood had a density of 0.44 g/cm³ and moisture content of 12%. To
    create CLT lumber, dimensions of 300 mm × 110 mm × 20 mm for length, width, and
    thickness were prepared.


    ### 2.2. Preparation of Melamine-Based Adhesive


    Two types of melamine-based adhesive were prepared: a commercial adhesive as control
    (MF-0) and the modified (MF-1). To modify the chemical adhesive (MF-1), several
    components were added: wheat flour as filler, citric acid as catalyst, and PDI
    as a cross-linker. Citric acid and PDI were added based on the solid content of
    the adhesive: 5% and 3%, respectively. Wheat flour comprised 10% of the total
    mixture. The resulting mixture was manually stirred for 1-2 min at 27 ± °C, yielding
    a suitable cold-setting melamine-based adhesive.


    ### 2.3. Characterization of Adhesive


    A digital pH meter from Horiba, Kyoto, Japan was used to measure the pH levels
    of MF-0 and MF-1. About 50 g of the adhesive sample was placed in a 100 ml glass
    beaker, and the pH value was recorded 3-5 min after the measurement was repeated
    3 times [26].


    To determine the nonvolatile solids content of MF-0 and MF-1, 2 g of each adhesive
    was placed in a disposable foil and dried for three hours at a temperature of
    105 °C. Following the drying process, the weight of the oven-dried adhesive was
    measured by its initial weight, and the solids content was measured in triplicate
    [27].


    To measure the viscosity of adhesive, around 20 ml of each adhesive was placed
    in a measuring cup (Anton Paar, Austria) and placed onto a rotational rheometer
    (RheoQC, Anton Paar). The average viscosity of the adhesive was measured using
    a spindle-type cylinder, at a shear rate of 15 s/s and a temperature of 25 °C.
    The viscosity value was obtained using Rheocom software (Version 1.30, Anton Paar,
    Austria); the dynamic viscosity and cohesion of strength-based adhesives were
    measured at a constant shear rate of 150 s/s for a duration of 200 min.


    To determine the gel time of the melamine-based adhesives, a gel meter (Tech GT-6,
    Colevern, Franklin Hills, IL, USA) was utilized. A sample of the adhesive was
    placed in a tube, and a needle was submerged in it. The time for the adhesive
    to solidify at 100 ± 3 °C was measured and recorded in triplicate. The gel times
    of MF-0 and MF-1 were also verified using the same method. In case, approximately
    50 g of adhesive was placed in the test tube with the needle submerged in the
    sample, and the time for the adhesive to solidify at 100 ± 3 °C was recorded.


    The functional groups present in the melamine-based adhesives were analyzed using
    Fourier-infrared spectroscopy (FTIR) with the Spectrum6 instrument from PerkinElmer,
    Hopkins, MA, USA. The MF-0 and MF-1 samples were measured at wavenumbers of 4200
    and 400 cm⁻¹ with a resolution of 4 cm⁻¹ and 16 scans per sample. The adhesive
    spectrum was corrected using baseline-normalization with Ter 10.3 software from
    PerkinElmer, Hopkins, MA, USA [27].


    To investigate the thermo-mechanical properties of the melamine-based adhesives,
    a dynamic mechanical analysis (DMA 8000, Perkin Elmer Inc.) was conducted. The
    adhesives were used to bond two Whatman fiber papers with a glue spread of 300
    g/m² to create a specimen with dimensions of 50 mm × 8 mm × 0.2 mm. Before the
    DMA analysis, the specimens were pre-cured in an oven at 50 °C for 5 min. The
    storage modulus (E''), 1 Hz, a strain level of 0.01%, and tan delta of each specimen
    were measured using a frequency of 1 Hz and a heating rate of 5 °C/min within
    a scanning range of 20-60 °C [28].

