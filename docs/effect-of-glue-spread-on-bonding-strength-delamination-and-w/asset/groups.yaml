    ## 3. 结果与讨论


    ### 3.1. 冷固甲醛胶剂的性能


    表 1 显示了胶剂的特性。MF-0 和 MF-1 的固体含量分别为 51 和 48。这代表了粘接产品的总固体。根据之前发表的研究 [32]，甲醛胶剂的固体含量随甲醛浓度的增加而增加。MF-1
    中加入柠檬酸、pMDI 和小麦粉导致了固体含量的减少。这一结果与之前的研究一致，即加入 NH4Cl 作为固化时甲醛胶剂的固体含量减少。


