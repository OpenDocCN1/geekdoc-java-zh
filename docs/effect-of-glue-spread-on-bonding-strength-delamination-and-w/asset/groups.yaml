    form a gel. This gel formation creates stronger connections between the molecules,
    resulting in stronger adhesion. As the gel forms, the viscosity of the adhesive
    increases, and the adhesive becomes less mobile. This point, where the viscosity
    is exceptionally high and the adhesive forms a gel, is known as the gel point.
    The gelation time of MF-0 was found to be five times longer than that of MF-1,
    while this difference was attributed to the use of citric acid catalyst or pMDI
    cross-linker. MF-1 was formed by adding citric acid and pMDI. The addition of
    these catalysts and cross-linkers promotes the formation of longer chains. This
    finding is in line with a previous study that reported a reduction in the gelation
    time of melamine-based adhesives when mixed with NH4Cl as a hardener. A study
    by [31] reported that incorporating 1–2% pMDI can reduce the gel time of melamine-based
    adhesives.


    The inclusion of 5% citric acid and 3% pMDI in MF-1 resulted in a lower pH for
