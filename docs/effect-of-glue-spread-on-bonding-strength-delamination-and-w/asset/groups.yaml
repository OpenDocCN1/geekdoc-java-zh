    |---|---|---|---|---|---|

    | 结合强度 | 1796750 | 1 | 1796754 | 6.2785 | 0.0406 | 0.4728 |

    | 分层 | 2944840 | 1 | 2944840 | 24.1056 | 0.0017 | 0.0779 |

    | 木材失效 | 3317150 | 1 | 3317150 | 48.0947 | 0.0002 | 0.8729 |


    试件表现出高胶胶载量和较低的分层比例，表明了结合完整性的形成，这取决于木材与粘胶结合的完整性 [13]。Libus 等人 [33] 的一项研究发现，通过添加柠檬酸和
    pMDI，可以增强改性 MF 基粘胶的性能和反应活性。我们在冷固性应用中添加 5% 柠檬酸和 3% pMDI 对改性 MF 粘胶的研究，为生产高性能产品以及通过在
    CLT 过程中高效消耗热能来支持环保计划提供了一种有前景的方法。


    ## 4. 结论


    本研究开发了在冷固性应用中添加 5% 柠檬酸和 3% pMDI 的改性 MF 粘胶的 jabon 木 CLT。这种添加增加了树胶胶的粘度和凝聚强度，并降低了固体含量、凝胶长度和
    pH 值。研究了涂布量分别为 250、280 和 300 $g/m^2$ 的各种 CLT，以表征其结合强度、分层和木材失效百分比。研究结果表明，较高的胶水涂布量会导致结合强度增加、分层值降低以及木材失效百分比提高。统计分析发现，胶水涂布量对木材失效的影响比结合强度分层更为显著。通过我们的研究，柠檬酸和
    pMDI 是一种很有前景的冷固性粘胶，能够节省 CLT 过程中使用的热能。


