    # 1. 引言


    由于对环保建筑材料的需求日益增加以及全球发展的发展[1–4]，工程木制品已变得流行。交叉层积材（CLT）是这类产品的一种示例，它是一种通过胶合木材层压生产的可行建筑材料，每层相互正交排列并用结构胶水粘合[5,6]。作为结构应用的建筑材料[7,8]，其具有的交叉层积材（CLT）机械和物理学特性优于胶合木材、定向刨板等其他类型。


    最近，CLT在欧洲以外的市场引起了关注[4,9–11]。即使日本已开始生产CLT，而马来西亚和印度尼西亚等国处于发展早期[10]。需要大量的研究和开发来生产高质量的本地CLT产品。必须考虑原材料等因素，以确保质量、强度、粘接特性和耐久性[12]。


    由于树种种类和可用胶剂的不同，各国的生产工艺可能有所不同。因此，应探索本地树种生产CLT的参数，包括胶剂类型、胶水消耗量和压力[7]。


    使用木材层生产CLT以提高效率并改善质量。胶剂的选择是一个关键的因素。用于制造CLT的胶剂包括酚醛、三胺甲醛（MF）、聚氰酸盐和聚氨酯[13]，而在欧洲，酚醛和异氰酸盐被广泛使用[2]。胶剂被广泛用于CLT生产是因为其成本相对较低、粘接良好且耐湿性[14]。然而，作为热固性胶剂，MF通常采用热压，这涉及额外的能源成本。Marine等[18]显示三胺胶剂的固化温度为140–160
    °C。热处理期间会产生甲醛释放[19]。需要改性三胺类胶剂以在不降低CLT产品机械强度的情况下进行冷压应用。在本研究中，使用了Artocarpus Rox.
    japon和改性三胺类胶剂来制造CLT[20]。


    为了提高交叉层积材（CLT）的生产，开发了一种含有亚甲基甲醛（MF）4,4''-亚甲基二苯异氰酸酯（PDI）的新冷固型胶剂配方。PDI树脂在生产中密度密度板方面证明了其有效性[23]。制造CLT时使用的胶剂量也应是决定机械性能和成本的变量。本研究旨在评估基于MF和PDI的冷固型胶剂制成的Jabon木CLT产品的分层、粘接强度和木材失效，涂布量分别为250
    g/m²、280 g/m²和300 g/m²。


    # 2. 材料与方法


    ### 2.1. 材料


    商业三胺胶（MF-0）由PTolite, Proboling, East Java供应。小麦粉、工业级柠檬酸和聚型4,4''-亚甲基二苯异氰酸酯（PDI）从市场上获得并由国家研究与创新机构（BRIN），Cibubong,
    Indonesia提供。生产CLT的原材料来自西爪Bogor地区的Jabon木。木材密度为0.44 g/cm³，含水量为12%。为了制作CLT木材，准备了长度300
    mm × 宽度110 mm × 厚度20 mm的尺寸。


    ### 2.2. 三胺类胶剂的制备


    准备了两种三胺类胶剂：作为对照的商业胶（MF-0）和改性胶（MF-1）。为了改性化学胶剂（MF-1），添加了多种成分：小麦粉作为填充剂、柠檬酸作为催化剂以及PDI作为交联剂。柠檬酸和PDI的5%和3%。小麦粉占总混合物的10%。混合物在27
    ± °C下手动搅拌1-2分钟，得到合适的冷固型三胺类胶剂。


    ### 2.3. 胶剂的表征


    使用日本京都Horiba数字pH计测量MF-0和MF-1的pH水平。将约50 g胶剂样品放在100 ml玻璃杯中，3-5分钟后记录pH值，重复3次[26]。


    为了确定MF-0和MF-1的非挥发性固体含量，将每种胶剂2 g放在箔纸并在105 °C下干燥3小时。干燥后，通过初始重量测量烘干胶剂的重量，并三次测量固体含量[27]。


    为了测量胶剂的粘度，将每种胶剂的约20 ml放在量杯（德国Anton Paar）中并放在旋转黏度计（RheoQC, Anton Paar）上。使用桨型圆柱在剪切速率15
    s/s和温度25 °C下测量胶剂的平均粘度。使用Rheocom软件（版本1.30, Anton Paar）获得粘度值；在150 s/s的恒定剪切速率下持续200分钟测量强度型胶剂的动态粘度和内聚力。


    为了确定三胺类胶剂的凝胶时间，利用凝胶计（Tech GT-6, Colevern, Franklin Hills, IL, USA）。将胶剂样品放在管中，并将针浸入。测量胶剂在100
    ± 3 °C下固化的时间并记录三次。MF-0和MF-1的凝胶时间也使用相同的方法进行了验证。


