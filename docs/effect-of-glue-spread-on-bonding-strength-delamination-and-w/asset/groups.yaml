    viscosity, as a higher viscosity indicates a greater resistance to deformation,
    which can lead to stronger internal bonds within the adhesive. In this study,
    the higher viscosity of MF-1 resulted in a cohesion strength compared with that
    of MF-0. 82-89 Pa, which was higher than that of MF-0 at about 71-73 Pa (Figure
    4b). Therefore, CLT bonded with MF-1 is expected to have better properties than
    MF-0.


    ![](img/6decd15101152cf788f8cb0286b2f312_6_0.png)


    Figure 4. Dynamic viscosity (a) and cohesion strength (b) of cold-setting melamine-based
    adhesives.


    Variations in the type of adhesive, the functional groups in primary amines, such
    as –N-H$_2$, C-H, C=O, and –N-H, were identified through their spectral wavenumbers
    of 3235, 2960, 1640, and 1565 cm$^{-1}$. The FTIR spectra detected no any differences
    between the melamine-based adhesives (Figure 5). However, following the curing
    process, the functional groups were slightly shifted due to the formation of a
    three-dimensional network resulting from the reaction between the melamine-based
    adhesive, catalyst, and cross-linker. A lower intensity of –N-H$_2$ was observed
    at 3225 cm$^{-1}$ while the C-H, C=O and N-H functional groups of the primary
    amine were detected at 2960, 1640, and 1566 cm$^{-1}$ after curing. Theoretically,
    the cross-linked polymer in melamine-based adhesives was formed by the reaction
    with –COOH in citric acid and –NCO in pMDI with HCHO$_{free}$ and the –CH$_2$OH
    group [26,27].


    ![](img/6decd15101152cf788f8cb0286b2f312_6_1.png)


    Figure 5. FTIR spectra of the cold-setting melamine-based adhesives.


    DMA was carried out in order to explore the thermo-mechanical characteristics
    of the melamine-based adhesives, as presented in Figure 6. This method assesses
    the mechanical responses of viscoelastic substances subjected to oscillation at
    different temperatures. In addition, a comparison was made between storage modulus
    (E''), loss modulus (E''''), and tan delta (the ratio of E'''' to E'') of the
    adhesives. The E'' parameter measures the amount of energy stored in the material,
    which is dependent on the type of temperature, and oscillation frequency. On the
    other hand, E'''' evaluates the amount of energy dissipated in the viscous flow
    of the specimen as a result of the molecular fraction [28]. The maximum E'' of
    467.9 GPa was detected in MF-1 at 38.4 °C tending to increase as a function of
    an increasing temperature. The initial decrease in E'' is attributed to the relaxation
    as the temperature decreases. Additionally, E'' increased towards its peak, which
    could be attributed to the adhesive gel process in which an extensive molecular
    network was formed. Furthermore, E'' increased after reaching its maximum value,
    and this finding also reflected the gelation process, as indicated by the tan
    delta. This reaction led to the formation of a network, in turn, resulted in efficient
    dissipation. However, the maximum E'' of MF-0 could not be detected, probably
    due to the absence of hardening and the cross-linking reaction that occurred without
    the presence of a catalyst and a cross-linker.


