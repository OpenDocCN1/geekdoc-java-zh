    | MF-1 | 48.58 ± 0.08 | 6.90 ± 0.10 | 570.45 ± 14.80 | 6.67 ± 0.58 |


    木胶剂中的凝胶时间是指胶剂形成胶的时间。这种胶的形成建立了分子间更强的连接，导致更强的粘接。随着胶的形成，胶剂的粘度增加，流动性变差。这种粘度极高且胶剂形成胶的点被称为凝胶点。发现
    MF-0 的凝胶时间是 MF-1 的五倍，这种差异归于使用柠檬酸催化剂或 pMDI 交联剂。MF-1 通过添加柠檬酸和 pMDI 。这些催化剂和交联剂的加入促进了长链的形成。这一发现与之前的研究一致，即加入
    NH4Cl 时甲醛胶剂的凝胶时间会减少。[31] 的一项研究报道加入 1–2% 的 pMDI 可以缩短甲醛胶剂的凝胶时间。


