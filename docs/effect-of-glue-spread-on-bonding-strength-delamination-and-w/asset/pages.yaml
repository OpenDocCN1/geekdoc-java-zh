    # 1. Introduction


    Engineered wood products have gained popularity due to the increasing demand for
    environmentally friendly building material and the growth of global development
    [1–4]. Cross-laminated timber (CLT) is an example of this type of product, which
    has emerged as a viable building material produced by laminating glued wood, with
    each layer orthogonally and bonded with structural adhesives [5,6]. As a building
    material for structural applications [7,8], it has high mechanical and physical
    characteristics of cross-laminated timber (CLT) are better than those other types
    of manufactured products, such as glued lumber, oriented strand board


    Recently, CLT has gained increased interest in the local market, particularly
    outside of Europe [4,9–11]. Even Japan and China have started CLT production,
    whereas such as Malaysia and Indonesia, are in the early stages of development
    [10,12]. Extensive research, and development are required to produce CLT wood
    local high-quality product. It is necessary to take into account factors such
    as raw materials is a crucial prerequisite for ensuring quality


