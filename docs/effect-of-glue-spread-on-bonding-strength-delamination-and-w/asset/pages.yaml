  md: '# 2.2. Preparation of Melamine-Based Adhesive


    Two types of melamine-based adhesive were prepared,, i.e., a commercial adhesive
    as the control (MF-0) and the modified (MF-1) formulation. To modify the chemical
    melamine adhesive (MF-0), several components were added (MF-1), including wheat
    flour as a filler, citric acid (20 wt%) as a catalyst, and PMDI (96.2 wt%) as
    a cross-linker. Citric acid and PMDI were added based on the solid content of
    the adhesive: 5% and 3%, respectively. Wheat flour comprised as much as 10% of
    the total mixture. The resulting mixture was manually stirred for 1-2 min at 27
    ± 2 °C, yielding a cold-setting melamine-based adhesive suitable for LTE.


    # 2.3. Characterization of Adhesive


    A digital pH meter from Laqua, Horiba, Kyoto, Japan was used to measure the pH
    levels of MF-0 and MF-1. About 50 g of the adhesive sample was placed in a 100
    ml glass beaker, and the pH value was recorded 3-5 min after, the measurement
    was repeated 3 times [26].


    To determine the nonvolatile solids content of MF-0 and MF-1, the weight 2 g of
    each adhesive was placed in a disposable foil container and dried for three hours
    at a temperature of 105 °C. Following the drying process, the weight of the oven-dried
    adhesive was measured by its initial weight [27], and the solids content was measured
    in triplicate.


    To measure the viscosity of adhesive, around 20 ml of each adhesive was placed
    in a measuring cup (Anton Paar Gra., Austria) and placed onto a rotational rheometer
    (RheoQC, Anton Paar Gra.). The average viscosity of the adhesive was measured
    using a spindle-type cylinder (CC, number), at a shear rate of 15 s/s and a temperature
    of 25 °C. The viscosity value was obtained using Rho-Compa software (Version 1.30,
    Anton Paar Gra., Austria), the dynamic viscosity and cohesion of strength-based
    adhesives were measured at a constant shear rate of 150 s/s for a duration of
    200 min.


    To determine the gel time of the melamine-based adhesives, a gel meter (Tech GT-6,
    Colevern, Franklin Hills, IL, USA) was utilized. A sample of the adhesive was
    placed in a tube, and a needle was submerged in it. The time for the adhesive
    to solidify at 100 ± 3 °C was measured and recorded in triplicate. The gel times
    of MF-0 and MF-1 were also verified using the same method. In case, approximately
    50 g of adhesive was placed in the test tube with the needle submerged in the
    sample, and the time for the adhesive to solidify at 100 ± 3 °C was recorded and
    recorded in.


    The functional groups present in the melamine-based adhesives were analyzed using
    Fourier-infrared spectroscopy (FTIR) with the Spectrum6 instrument from PerkinElmer,
    Hopkins, MA, USA. The MF-0 and MF-1 samples were measured at wavenumbers of 4200
    and 400 cm⁻¹ with a resolution of 4 cm⁻¹ and 16 cm per sample. The adhesive spectrum
    was corrected using baseline-normalization for it. Ter 10.3 software from PerkinElmer,
    Hopkins, MA, USA [27].


    To investigate the thermo-mechanical properties of the melamine-based adhesives,
    a dynamic mechanical analysis (DMA 8000, Perkin Elmer Inc.) was conducted. The
    adhesives were used to bond two Whatman fiber papers with a glue spread of 300
    g/m² to create a specimen with dimensions of 50 mm × 8 mm × 0.2 mm. Before the
    DMA analysis, the specimens were pre-cured in an oven at 50 °C for 5 min. The
    storage modulus (E''), 1 Hz, a strain level of 0.01%, and tan delta of each specimen
    were measured using a frequency of 1 Hz and a heating rate of 5 °C/min within
    a scanning range of 20-60 °C [28].'
