    The specimen exhibited a high level of glue load and a low delamination percentage,
    indicating the development of bond integrity, which relies on the integrity of
    wood adhesive bonds [13]. A study by Libus et al. [33] found that the properties
    and reactivity of a modified MF-based adhesive could be enhanced by the addition
    of citric acid and pMDI. Our study of a modified MF adhesive with the addition
    of 5% citric acid and 3% pMDI in a cold-setting application provides a prospective
    method in terms of producing high-performance products and supporting eco-friendly
    programs through the efficient consumption of heat energy in the CLT process.


    # 4. Conclusions


    This developed CLT from jabon wood with a modified MF adhesive by adding 5% citric
    acid and 3% pMDI in a cold-setting application. This addition increased the viscosity
    and cohesion strength of the melamine-based adhesive and decreased the solids
    content, gel length, and pH CLT with various glue spreads of 250, 280, and 300
    $g/m^2$ were investigated to characterize the bonding strength, delamination,
    and wood failure percentage. The findings indicate that a higher glue spread leads
    to an increased bonding strength, lower delamination value, and higher wood failure
    percentage. The statistical analysis found that the glue spread has a more significant
    impact on wood failure than the bonding strength and delamination. Through our
    study, citric acid and pMDI was a promising cold-setting adhesive that conserves
    heat energy used in CLT.


