    The statistical analysis is presented in Table 2. aimed to evaluate how glue spread
    affects the bonding strength, delamination, and wood failure of cold-setting melamine-based
    adhesives (MF-1) applied to jabon wood CLT. The statistical analysis revealed
    that the wood failure was considerably impacted by the glue spread, with a higher
    $R^2$ of 0.8729, a lower $p$-value of 0.0002, and a higher F-value of 48.0947
    compared with the bonding strength and delamination. Conversely, the bonding strength
    was less affected because of the higher standard deviation, $R^2$ of 0.4728. A
    multiple range testing using Duncan''s posthoc test demonstrated that CLT with
    an improved bonding strength, delamination, and wood failure produced using 300
    $g/m^2$ compared with values of 250 $g/m^2$ and 280 $g/m^2$.


