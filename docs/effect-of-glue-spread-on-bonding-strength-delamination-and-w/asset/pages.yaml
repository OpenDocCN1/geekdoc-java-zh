    # 2.5. Evaluation of CLT Properties


    To conduct delamination tests in accordance with EN 16531:2021 [29], the CLT samples
    were cut into 100 mm × 100 mm × 60 mm dimensions. Three specimens were tested
    for each glue application, and they were submerged in ambient-temperature water
    within a pressure vessel. A vacuum of 85 kPa was applied and maintained for 30
    min before releasing it applying a pressure of 600–700 kPa, which was held for
    2 h. After that, the test pieces were dried for approximately 12–20 min at a temperature
    of 65 °C. For each specimen, the total delamination and maximum delamination were
    recorded, and the percentage of delamination was calculated using Equations (1)
    and (2) [12].


    ```

    $Delamination_{tot} = 100 \frac{tot_{delam}}{tot_{glue\line}}$ (1)

    ```


    ```

    $Delamination_{max} = 100 \frac{max_{delam}}{glue\line}$ (2)

    ```


    where $tot_{delam}$ is the total delamination length, $tot_{glue\line}$ is the
    sum of all glue lines in a delamination specimen, $max_{delam}$ is the maximum
    delamination length, and $glue\line$ is the perimeter of one glue line in a delamination
    specimen.


    An assessment of the bonding strength of cross-laminated timber (CLT) was conducted
    by performing a block-shear stress analysis using a previously published method
    [31]. The CLT was cut into a block-shear sample, as demonstrated in Figure 3,
    and the blockshear shear strength was tested utilizing a 50 kN universal testing
    machine (UTM AG-IS 50 kN, Shimadzu, Kyoto, Japan) at a crosshead speed of 2 mm/min.
    Additionally, in accordance with the EN 16351 standard [29], the bonding strength
    was evaluated, and three blockshear samples were tested for each glue spread.


    ![](img/6decd15101152cf788f8cb0286b2f312_4_0.png)


    **Figure 3.** Illustration of the block-shear test of CLT based on the Zhou et
    al. [31] (a), and the block shear testing (b); the arrow line points out the glue
    line.


    # 2.6. Statistical Analysis


    The study compared the average values of delamination, bonding strength, and width
    of failure of cross-laminated timber (CLT) produced from MF-1 adhesive using an
    analysis of variance (ANOVA). The Duncan multiple range test at a significance
    level of $\alpha = 0.05$ was performed to identify the significant effect of glue
    spread on the delamination and bonding strength. The statistical analysis was
    carried out with SPSS 21 software (SPSS Inc., Chicago, IL, USA).'
