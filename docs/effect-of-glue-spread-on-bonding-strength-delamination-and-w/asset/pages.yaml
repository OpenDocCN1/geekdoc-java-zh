    [7]


    CLT production uses layers from wood species to enhance efficiency and improve
    quality. The selection of adhesives is a crucial factor that requires careful
    consideration. The types of adhesives used to fabricate CLT include phenol-resorcinol,
    melamine formaldehyde (MF), emulsion polymer cyanate, and polyurethane [13], while
    phenol-resorcinol and isocyanate adhesives are used in European production [2,11],
    and in Japan [2]. MF are extensively used in the production of semi-exterior and
    exterior-grade wood-based panels [14]. The adhesive is widely selected by glue
    or CLT production because of its relatively low cost, transparent bonding lines,
    heat resistance and moisture [15,16]. However, the adhesives must be capable of
    transferring loads and maintaining their strength and durability over the life
    of the structure [17].


    As a thermosetting adhesive, MF is generally applied with the use of hot presses,
    which involves additional costs due to heat energy. Marine et al. [18] showed
    that the curing temperature of MF adhesive is 140–160 °C. Heat treatment during
    wood composite produces formaldehyde, which is from adhesives or raw material
    [19,20].


    Innovation is needed to modify MF-based adhesives to allow cold-pressing applications
    with reduced formaldehyde emissions without degrading the mechanical strength
    of the CLT products. In this research, japon (Antholocarpus Rox. Mix.), and a
    modified MF-based adhesive were used to manufacture CLT through a cold-pressing
    application process. Japon wood is a promising candidate for engineered wood products
    with high uniformity within local communities [22]. In order to improve the production
    of cross-laminated timber (CLT), a new cold-setting adhesive formula was developed
    by incorporating methylene formaldehyde (MF) polymer-4,4-methylene diphenyl diisocyanate
    (PDI). The PDI resin has demonstrated its effectiveness in producing panel products,
    particle boards and medium-density fiber [23,24]. The optimal amount of adhesive
    used in CLT manufacturing should also be a considered variable that determines
    the mechanical performance and production cost [25]. This study aims to evaluate
    the delamination, bonding strength, and wood failure of CLT products made from
    japon wood using the cold-setting adhesive based on MF and PDI spreads of 250
    g/m², 280 g/m², and 300 g/m².


    # 2. Materials and Methods


    # 2.1. Materials


    The commercial melamine adhesive (MA-04) was supplied by PT Pamolite Adhesive,
    Proboling, East Java, Indonesia. Wheat flour, technical-grade citric acid bond,
    and polymeric 4,4-methylene diphenyl diisocyanate (DI) were obtained from the
    commercial market and provided by the Integrated Laboratory of Bioproducts (libs),
    National Research and Innovation Agency (BRIN), Cibinong, Indonesia. The raw material
    for producing CLT was obtained from japon wood, which was obtained from a community
    forest in the Bogor area of West Java. The wood had a density of 0.44 g/cm³ and
    a moisture content of 12 ± 2%. To create the CLT, lumber samples with dimensions
    of 300 mm × 110 mm × 20 mm and 110 mm × 110 mm × 20 mm for the length, width,
    and thickness were prepared.'
