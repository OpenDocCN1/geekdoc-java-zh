    # 3.2. Bonding Strength and Delamination of CLT


    For CLT manufacturers and consumers, the most important factor is the bond integrity,
    which involves bonding strength and delamination [5,34-36]. The bond integrity
    refers to the adhesive strength between two layers and is influenced by the type
    of adhesive, the wood species, and the surface treatment [1.3]. The bonding strength
    can be determined through block-shear strength testing using specialized machines.


    A new adhesive format had to be developed, since commercial MF cannot be directly
    applied for CLT pressing. Our trial revealed that commercial MF was not glued
    well as CLT. As a result, CLT (MF-0) was manufactured using a melamine-based adhesive,
    which was glued at 1 MPa, and heat-treated at 100 °C for 2 h to cure the adhesive,
    as shown in Figure 1. The properties of CLT bonded with MF-1 were successfully
    tested using the cold-pressing method (Figure 2). The block test showed that the
    bonding strength of MF-0 with glue of 300 g/m² was 2.13 MPa, 1.94 MPa, and 1.03
    MPa, respectively. Some of MF-0 values found 30% lower than those of the MF-1
    samples (Figure 7a). The highest bonding strength of CLT bonded with MF-1 was
    3.14 MPa, which was achieved with a glue strength of 300 g/m² and 250 g/m², respectively.
    Figure 7b shows the load-displacement curve and block-shear strength of CLT bonded
    with MF-1. A greater maximum load was observed at a greater displacement as the
    glue strength increased. A maximum load of approximately 9750 N at a displacement
    of 8.3 mm was achieved using 300 g/m² of adhesive with MF-1, while'
