    # 2.4. Preparation of CLT


    The fabrication of CLT was based on EN 16531:2021 for Timber Structures—CLT Requirements
    [29]. The three-layer jabon CLT was manufactured using melamine-based adhesives.
    In this research, longitudinal laminations were constructed from been wood measuring
    330 mm × 110 mm × 20 mm, with a total of 18 lumbers used. Transverse laminations,
    consisting of 27 lumbers of 110 mm × 110 mm in size were also employed. Control
    CLT bonded with commercial MF adhesive—was prepared under different glue spreads
    of 250, 280, and 300 g/m² cold pressing at 1 MPa under clamping for 2-4 h and
    heat treatment at 100 °C (Figure 1). The MF-0 itself could not be used as cold-setting
    adhesive; therefore, the CLT had to be prepared using hot-pressing (heat treatment).
    In contrast, CLT-bonded MF-1 was prepared using a cold press at 1 MPa for 2 h,
    based on preliminary trials and following previous research [12,30]. As with the
    MF-0 adhesive, different glue spreads were applied for MF-1 bonded CLT, namely
    250, 280, and 300 g/m². The preparation of CLT bonded with cold-setting melamine-based
    adhesives (MF-1) is illustrated in Figure 2.


