    responses of viscoelastic substances subjected to oscillation at different temperatures.
    In addition, a comparison was made between storage modulus (E''), loss modulus
    (E''''), and tan delta (the ratio of E'''' to E'') of the adhesives. The E'' parameter
    measures the amount of energy stored in the material, which is dependent on the
    type of temperature, and oscillation frequency. On the other hand, E'''' evaluates
    the amount of energy dissipated in the viscous flow of the specimen as a result
    of the molecular fraction [28]. The maximum E'' of 467.9 GPa was detected in MF-1
    at 38.4 °C tending to increase as a function of an increasing temperature. The
    initial decrease in E'' is attributed to the relaxation as the temperature decreases.
    Additionally, E'' increased towards its peak, which could be attributed to the
    adhesive gel process in which an extensive molecular network was formed. Furthermore,
    E'' increased after reaching its maximum value, and this finding also reflected
    the gelation process, as indicated by the tan delta. This reaction led to the
    formation of a network, in turn, resulted in efficient dissipation. However, the
    maximum E'' of MF-0 could not be detected, probably due to the absence of hardening
    and the cross-linking reaction that occurred without the presence of a catalyst
    and a cross-linker.


