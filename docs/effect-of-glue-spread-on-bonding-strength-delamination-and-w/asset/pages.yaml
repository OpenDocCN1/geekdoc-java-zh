    The bonding of CLT can be increased by 5% citric acid and 3% PMDI, which leads
    to the formation of a larger molecular chain through the interactions of MF, citric
    acid, and PMDI. The bonding strength of CLT with MF-1 adhesive is greater than
    that of CLT with MF-0 adhesive due to the extensive molecular chain of MF-1 and
    the formation of high cohesion strength. A glue spread of 300 g/m² and a pressure
    of 1 MPa resulted in a better block-shear strength value for CLT bonded with MF-1
    (3.14 MPa) than that of cross-laminated bamboo and timber (CLT) bonded from laminated
    bamboo and Chinese fir with reinforcement (2 MPa). Yang et al. [34] also reported
    that the block-shear strength of CLT with 200 g/m² glue spread and a bonding pressure
    of 1 MPa was 2.47 MPa in the major direction. The block-shear strength values
    of CLT bonded with MF-1 at 280 and 300 g/m² were those of CLT made from spruce-pine-fir
    bonded with polyurethane, emulsion polymer isocyanate, and phenol resorcinol formaldehyde
    for glue spreads of 200 g/m², 270 g/m², and 250 g/m².


    The shear performance of CLT panels is a critical factor in panel failure, as
    the experienced stress in the layers is perpendicular to the major axis of the
    panel [8]. In CLT block-shear testing, the leading mode of failure perpendicular
    to the grain, resulting in a lower block-shear strength compared with that of
    laminated timber from the same wood material. The research conducted that the
    block-shear strength of CLT bonded with MF-0 and MF-1 did not meet the requirements
    stipulated in EN 16531:2021 [25], which states that the bonding-strength should
    be at least 6 MPa.


    **Figure 8** shows the delamination values of CLT bonded with MF-0 and MF-1 adhesives
    at different glue spreads, Figure 8b shows the wood failure pattern of the block-shear
    samples after testing. The delamination of MF-0 for three different glue spreads
    (250, 280, and 300 g/m²) was 26.30-13.07%. In terms of the bonding strength, delamination
    decreased as the wood failure percentage increased with more glue spreads [25].
