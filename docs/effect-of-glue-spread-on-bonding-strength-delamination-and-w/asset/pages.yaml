  md: '# # Effect of Glue Spread on Bonding Strength, Delamination, and Wood Failure
    of Jabon Wood-Based Cross-Laminated Timber Using Cold-Setting Melamine-Based Adhesive


    Yusup Amin<sup>1,2,*</sup> Renaldi Prummo Adji<sup>2</sup>, Muhammad Rahadi Rahulis<sup>1</sup>,
    Nareswo Nugroho<sup>2</sup> Effendi Bakhtri<sup>2}, Wahyu Diwanto<sup>1</sup>
    and Lina Karlinasari<sup>2,*</sup>


    +   1 Research Center for Biomass and Bioproduction, National Research and Innovation
    Agency, Cibubong 16911, West Java, Indonesia

    2 Department of Forest Products, Faculty of Forestry and Environment, IPB University
    Bogor 1648, West Java, Indonesia

    Correspondence: yusuf07@brin.go.id (Y.A.); karlinasari@apps.ipb.ac.id (L.K.)


    Abstract: Cross-laminated timber (CLT) has become a popular engineered wood due
    to its innovative properties and rapid development, which involves the use of
    various species and adhesives. This study aims to evaluate the effect of glue
    application on bonding strength, delamination, and wood failure of CLT made from
    jabon wood and a cold-setting melamine-based adhesive at three different rates:
    25, 280, and 300 g/m². The adhesive composed of melamine-formaldehyde adding 5%
    citric acid, 3% polymeric 4,4''-methylene diphenylisocyanate (pMDI), and 10% wheat
    flour. Adding these ingredients increased the viscosity and decreased the strength.
    The CLT samples, made using glue pressing in the melamine-based adhesive, were
    evaluated in 16531/2021. The results reveal that a higher glue spread resulted
    in a greater bonding strength, less delamination, and higher wood failure. The
    glue spread showed more influence on wood failure compared with density and bonding
    strength. The application of 300 g/m² glue spread on the CLT led to a product
    that meets the required standards. The use of modified MDF produced a sustainable
    product that could be feasible option for CLT production in terms of its lower
    heat energy consumption.


    **Keywords:** bonding strength; citric acid; jabon wood; melamine-formaldehyde;
    pMDI


