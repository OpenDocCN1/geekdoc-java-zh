    \ method is unaware of what type of car is actually passed.\n\n# 4.7 Distinguishing\
    \ Subclasses\n\nWhat if we have an object handled polymorphically but need to\
    \ check which subtype it actually is? The instanceof operator can do this:\n`instanceof\
    \ class`\n\nThis test is true if the object is of the specified class (or a subclass),\
    \ false otherwise.\n\nNote that (myDiscMag instanceof Magazine) would be TRUE\
    \ because a DiscMag is a Magazine\n\n# Object Oriented Programming using Java\n\
    \ninstanceof can also be used with an interface name on the right, in which case\
    \ it tests whether the class implements the interface.\n\nStrictly instanceof\
    \ is testing the item on the left is of the type, or a subtype of, the type specified\
    \ on the right. Doing this we could extend the CashTill class that displays a\
    \ specific message depending upon the object sold.\n\n```java\npublic void saleType\
    \ (SaleableItem pSelb) {\n    if (pSelb instanceof Publication) {\n        System.out.println(\"\
    This is a Publication\");\n    } else if (pSelb instanceof Ticket) {\n       \
    \ System.out.println(\"This is a Ticket\");\n    } else {\n        System.out.println(\"\
    This is an unknown sale type\");\n    }\n}\n```\n\npSelb instanceof Publication\
    \ will be true if pSelb is any subclass of Publication, Magazine or DiscMag. If\
    \ we wished we could equally test for a more specific subtype, e.g. pSelb instanceof\
    \ Book\n\nNotice that we compromise the polymorphism by checking for subtypes\
    \ for the extensibility of the system – new classes (e.g. Sweets) implementing\
    \ the SaleableItem interface may also require new classes adding to this statement,\
    \ the change ripples through the system with the consequence that it becomes costly\
