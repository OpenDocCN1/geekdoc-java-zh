    # 9.2 Kinds of Exception


    In to generate meaningful exceptions we need to extend the Exception classes built
    into the Java language — there are two of these (normal exceptions and run time
    exceptions).


    Subclasses of java.lang.Exception are used for anticipated problems which need
    to be managed. They must be declared in the originating method''s throws clause
    and a call to be placed in try/catch block.


    Subclasses of java.lang.RuntimeException are used for situations which lead to
    runtime failure and where it may not be possible to take any remedial actions.
    They do not need to be declared in throws clause and a call not to be in try/catch
    block (but can).


    Thus we have the choice of whether the Java compiler should force us to explicitly
    deal with a particular kind of exception.


    Exception subclasses are appropriate for things which we know go wrong and where
    we can take recursive action – e.g. IO errors.


    RuntimeException subclasses are appropriate for things which should not happen
    at all and where there is probably nothing we can do to recover the situation,
    e.g. an out of memory error or discovering that the system is in an inconsistent
    state which might be able to arise.


