    # 4.2 Substitutability


    When designing class/type hierarchies, the type mechanism allows us to place a
    subclass object where a superclass is specified. However this has implications
    for the design of subclasses – we need to make sure they are genuinely substitutable
    for the superclass. If a subclass is substitutable then it must implement all
    of the methods of the superclass – this is to guarantee as all of the methods
    defined in the superclass are inherited by the subclass. While a subclass may
    have additional methods it at least have all of the methods defined in the superclass
    and should therefore be substitutable. What happens if a method is overridden
    in the subclass?


    When overriding methods we must ensure that they are still substitutable for the
    method being replaced. When overriding methods, while it is perfectly acceptable
    to tailor the method to the needs of the subclass it should not be overridden
    with functionality which performs an inherently different operation.


    For example, recNewIssue() in Disc overrides recNewIssue() from Magazine but does
    the same basic job ("fulfills the contract") as the inherited version with respect
    to updating the number of copies and the current issue. However, it extends functionality
    in a way specifically relevant to DiscMags by displaying a reminder to check the
    cover discs.


    What do we know about a ‘Publication’?


    Answer: It’s an object that supports (at least) the operations:


    ```

    void sellCopy()

    double getPrice()

    int getCopies()

    void setCopies(int pCopies)

    String toString()

    ```


    Inheritance guarantees that objects of any subclass of Publications provides at
    least these.


    Note that a subclass can never remove an operation inherited from its superclass(es)
    – this would break the guarantee. Because subclasses extend the capabilities of
    their superclasses, the superclass functionality can be assumed.


    It is quite likely that we would choose to override the toString() (initially
    defined within ‘Object’) within Publication and override it again within Magazine
    so that the String returned provides a better description of Publications and
    Magazines. However we should not override the toString() method in order to return
    the price – this would changing the functionality of the method so that the method
    performs an inherently different function. Doing this would break the substitutability
    principle.'
  - '[PAGE 73]


    # 4.3 Polymorphism


    Because an instance of a subclass is an instance of its superclass we can handle
    subclass objects as if they were super objects. Furthermore because a superclass
    carries operations in its subclasses we can invoke those operations without caring
    which subclass the actual object is of.


    This characteristic is termed ''polymorphism'', originally meaning ''having multiple
    shapes''.


    Thus Publication comes in various shapes ... it could be a Book, Magazine or DiscMag.
    We can invoke the sellCopy() method on any of these Publications irrespective
    of their specific details.


    Polorphism is a fancy name for a common idea. Someone who knows how to drive car
    can get into and drive most cars because they have a shared key characteristics
    – steering wheel, gear stick, pedals for clutch, brake and accelerator etc – which
    the driver knows how to use. There will be lots of differences between any two
    cars, but you can think of them as subclasses of a superclass which defines these
    crucial ''operations''.


    ''p'' is ''a'' Publication, it might be a Book or a Magazine or a DiscMag.


    Whichever, it has a sellCopy() method.


    So we can invoke p.sellCopy() without worrying about exactly ''p'' is.


    This can make life lot simpler when we are manipulating objects within an inheritance
    hierarchy. We can create new types of Publication e.g. a Newspaper and invoke
    p.sellCopy() on a Newspaper without having to create any functionality within
    the new class – all the functionality required is already defined in Publication.


    Polymorphism makes it very easy to extend the functionality of our programs as
    we will see in Chapter 11.


    # 4.4 Extensibility


    Huge sums of money are spent annually creating new computer programs but over
    the years even is spent changing and adapting programs to meet the changing needs
    of an organisation. As professional software engineers we have a duty to facilitate
    this and help to make those programs easier to maintain and adapt. Of course the
    application of good programming standards, commenting and layout etc, have a part
    to play here but also polymorphism can help as it allows programs to be made that
    easily extended.'
