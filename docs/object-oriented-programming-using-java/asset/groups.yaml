    ### 8.10 Applying Layout Managers Using NetBeans


    When designing a graphical interface it is ‘normal’ for objects to be placed on
    a window in precise positions. Interfaces are thus displayed exactly how they
    are designed. For this to work well an designer usually has some idea of the size
    of the objects they are designing an interface for. Most PC games are designed
    to run on window of 14” – 21”. Most mobile games are designed to work on much
    smaller screens.


    However Java programs are expected to be platform independent – one of the strengths
    of Java is that code written in Java will work on a PC, laptop or small mobile
    device irrespective of the hardware or operating systems these devices use (as
    long as they have a RE). Thus the same interface should work on a large visual
    unit or small mobile screen. For this reason when designing interfaces in Java
    it is usual to give Java some control over deciding how / where to display objects.


    Layout Managers are ‘objects’ that define how an interface should be displayed
    and it is normal to create a layout manager and assign it to a ‘container’ object
    such as a window frame.


