    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_144_1.png)\n\nDownload free books at\
    \ BookBoon.com\n\n## 9. Creating And Using Exceptions\n### Introduction\n\nIf\
    \ the reader has written Java programs that make use of the file handling facilities\
    \ they will have written code to catch exceptions i.e. they will have used try/catch\
    \ blocks. This chapter explains the importance of creating your own exceptions\
    \ and shows how to do this by extending the Exception Class and using the ‘Throw\
    \ mechanism.\n\n### Objectives\n\nBy the end of this chapter you will be able\
    \ to....\n\n- Appreciate the importance of exceptions\n- Understand how to create\
    \ your own exceptions and\n- Understand how to throw these exceptions.\n\nThis\
    \ chapter consists of six sections :-\n\n1) Understanding the Importance of Exceptions\n\
    2) Kinds of Exception\n3) Extending the Exception Class\n4) Throwing Exceptions\n\
    5) Catching Exceptions\n6) Summary\n\n### 9.1 Understanding the Importance of\
    \ Exceptions\n\nException handling is a critical part of writing Java programs.\
    \ The authors of the file handling classes within the Java language knew this\
    \ and created routines that made use of Java exception handling facilities – are\
    \ these really important? and do these facilities matter to programmers who write\
    \ their own applications using Java?\n\n## Activity 1\n\nImagine part of a banking\
    \ program made up of three classes, and three methods as shown below...\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_146_0.png)\n\
    \nThe system shown above is driven by the BankManager class. The awardLoan() method\
    \ is invoked, either via the interface or from another method. This method is\
    \ intended to accept or reject a loan application.\n\nThe BookofClients class\
    \ maintains a set of account holders...people are added to this if they set up\
    \ an account or course they can be removed. However the only method of interest\
    \ to us is the getClient(). This method requires a string parameter (a client\
    \ ID) and returns a client object (if the client has an account at that bank)\
    \ or returns NULL (if the client does not exist).\n\nThe Client class has only\
    \ one method of interestdetermineCreditRating(). This method is invoked to determine\
    \ a credit rating – this is used by the BankManager class to decide if a loan\
    \ should be approved or not.\n\nConsidering the scenario above at the snippet\
    \ of code below ...\n\n```\nClient c = listofClients.getClient(clientID);\nc.determineCreditRating();\n\
    ```\n\nThis fragment of code would exist in the awardLoan() method. Firstly it\
    \ would invoke the getClient() method, passing a client ID as a parameter. This\
    \ method would return the appropriate client object (assuming of course that a\
    \ client with this ID exists) which is then stored in a local variable 'c'. Having\
    \ obtained a client the determineCreditRating() method would be invoked on it.\n\
    \nLook at these two lines of code. Can you identify any potential problems with\
    \ them?\n\n## Object Oriented Programming using Java\n## Creating And Using Exceptions\n\
    ### Feedback 1\n\nIf a client with the specified ID exists this code will above\
    \ work. However if a client not exist with the specified ID the getClient() method\
    \ will return NULL.\n\nThe second line of code would then cause a run time error\
    \ (specifically a NullPointerException) as it tries to invoke the determineCreditRating()\
    \ method on a non-existent client and the program would crash at this point.\n\
    \n## Activity 2\n\nConsider the following amendment to this code and decide if\
    \ this would fix the problem.\n\n```\nClient c = listOfClients.getClient(pClientID);\n\
    If (c != !NULL)\n    c.determineCreditRating();\n```\n\n### Feedback 2\n\nIf the\
    \ code was amended to allow for the possible NULL value returned it would work\
    \ – however this protection is insecure as it relies on the programmer to stop\
    \ this critical error.\n\nWhen writing the getClient() method the author was fully\
    \ aware that a client may not be found and in this case decided to return a NULL\
    \ value. However this relies on every programmer who uses this method to recognise\
    \ and protect against this eventuality.\n\nIf any programmer using this method\
    \ failed to protect against a NULL return then their program could crash – potentially\
    \ in this case losing the large sums of money. In course of other applications,\
    \ such as an aircraft control system, a program crash could have life threatening\
    \ results.\n\nA more secure mechanism is required to ensure that a potential crash\
    \ situation is always dealt with\n\nSuch a mechanism exists - it is a mechanism\
    \ called ‘exceptions’.\n\nBy using this mechanism we can ensure that other programmers\
    \ will be alerted to potential crash situations and the compiler will ensure that\
    \ these programmers deal with the ‘issue’. Thus we can ensure that no such situation\
    \ is ‘forgotten’. In the situation rather than return a NULL value the getClient()\
    \ method should generate an exception. By generating the exception the Java compiler\
    \ will ensure that this is dealt with.\n"
  mdcn: "\n\n## 使用 Java 进行面向对象的编程\n## Java 开发工具\n\njavadoc 工具无法通过分析方法的描述来确定该描述是否提供了对该方法的准确摘要。然而，该工具的功能远不止是将程序员的注释复制粘贴到网页文档中。该工具的一项功能是分析方法签名，并将其与注释中的标签进行比较，以检查逻辑错误。如果一个方法需要三个参数，而注释中只描述了两个，则会检测此错误并报告给程序员。\n\
    \n> warning - @param argument \"pNumber3\" 不是一个参数名。\n\n通过分析代码，该工具还提供了关于类、被继承的方法以及重写方法的额外信息。\n\
    \n生成的参考文档是面向使用相关类的程序员的，它不包含旨在供维护工作期间编辑源代码的程序员的方法内部注释。\n\n生成的文档可以放在子文件夹中，并且可以通过在浏览器中打开\
    \ `index.html` 文件进行查看。\n\n'javadoc 只记录公共（public）或受保护（protected）的类和成员，因为只有这些成员对其他程序员可用。私有（private）或未提供访问修饰符的项目将被省略。\n\
    \n### 8.13 总结\n\n编程语言中的源代码有多种执行方式。Java 使用一种中间语言“字节码”，并且需要一个主方法（main method）。\n\
    \n我们可以“回归基础”，使用文本编辑器和 Java 开发工具包（JDK）的工具创建 Java 程序，但在 JDK 之上使用专业的 IDE 可以为程序员提供额外的支持功能。\n\
    \n针对开发的各个方面（如 GUI 设计、图表绘制和文档编制）提供了专用工具，但某些 IDE 超出了基础范围，并将其中一些功能内置在 IDE 之中。\n\n\
    在 BookBoon.com 下载免费书籍\n\n## 使用 Java 进行面向对象的编程\n## Java 开发工具\n\nEclipse 和 NetBeans\
    \ 是两个支持标准 Java 程序开发的开源 IDE。它们都可以免费下载下载。\n\n这些工具起初看起来可能令人望而畏之，因为它们为专业开发提供了广泛的支持，包括代码格式化和重构；不过，在线帮助是确实存在的，而且这两个工具都提供了某种程度的自动代码生成（例如主方法），以减轻程序员的工作负担。\n\
    \nJavadoc 工具是一个极其有用且节省时间的设备，但它确实要求程序员在代码中插入具有有意义的 Javadoc 风格注释（针对所有类和所有公共方法）。\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_144_0.png)\n\n## 这个等式中缺少了什么？\n\n你可能是我们未来的人才之一\n\
    \nMAERSK 国际技术与科学计划\n你即将作为工程师或地球科学家毕业吗？或者你已经毕业了？如果是这样，A.P. Moller- Maersk 会不会能为你带来一个令人兴奋的未来？\n\
    www.maersk.com/mitas\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_144_1.png)\n\n\
    在 BookBoon.com 下载免费书籍\n\n## 9. 异常的创建与使用\n### 引言\n\n如果读者编写了使用文件处理功能的 Java 程序，那么他们已经编写了捕获异常的代码，即他们已经使用了\
    \ `try/catch` 块。本章解释了创建自定义异常的重要性，并展示了如何通过扩展 `Exception` 类和使用“抛出机制”来实现这一点。\n\n\
    ### 目标\n\n在本章结束时，你将能够……\n\n- 领会异常的重要性\n- 理解如何创建自己的异常以及\n- 理解如何抛出这些异常。\n\n本章由六部分组成：\n\
    \n1) 理解异常的重要性\n2) 异常的种类\n3) 扩展 Exception 类\n4) 抛出异常\n5) 捕获异常\n6) 总结\n\n### 9.1\
    \ 理解异常的重要性\n\n异常处理是编写 Java 程序的关键部分。Java 语言文件中处理类的作者们知道这一点，并创建了利用 Java 异常处理功能的例程——这些真的重要吗？这些功能对于使用\
    \ Java 编写自己应用程序的程序员重要吗？\n\n## 活动 1\n\n想象银行程序的一部分由三个类和三个方法组成，如下所示……\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_146_0.png)\n\
    \n上述系统由 `BankManager` 类驱动。`awardLoan()` 方法通过接口或从另一个方法被调用。该方法旨在接受或拒绝贷款申请。\n\n`BookofClients`\
    \ 类维护了一个账户持有人集合……如果他们开设了账户，就会被添加到此处，否则可以将其移除。然而，我们感兴趣的唯一方法是 `getClient()`。该方法需要一个字符串参数（客户端\
    \ ID）并返回一个客户端对象（如果该客户在某银行有账户）或返回 `NULL`（如果客户不存在）。\n\n`Client` 类只有一个感兴趣的方法：`determineCreditRating()`。该方法被调用以确定信誉评级——`BankManager`\
    \ 类用它来决定是否批准贷款。\n\n考虑上面的场景以及下方的代码片段……\n\n```\nClient c = listofClients.getClient(clientID);\n\
    c.determineCreditRating();\n```\n\n这段代码片段将存在 `awardLoan()` 方法中。首先，它会调用 `getClient()`\
    \ 方法，并将客户端 ID 作为参数传递。该方法将返回相应的客户端对象（当然，假设存在此 ID 的客户端），然后将其存储在局部变量 `c` 中。获取客户端后，将对其调用\
    \ `determineCreditRating()` 方法。\n\n观察这两行代码。\n\n## 使用 Java 进行面向对象的编程\n## 异常的创建与使用\n\
    ### 反馈 1\n\n如果存在指定 ID 的客户端，上述代码将正常工作。但是如果不存在指定 ID 的客户端，`getClient()` 方法将返回 `NULL`。\n\
    \n第二行代码会导致运行时错误（特别是 `NullPointerException`），因为它试图对一个不存在的客户端调用 `determineCreditRating()`\
    \ 方法，程序将在此处崩溃。\n\n## 活动 2\n\n考虑对代码的以下修改，并判断这是否解决了问题。\n\n```\nClient c = listOfClients.getClient(pClientID);\n\
    If (c != !NULL)\n    c.determineCreditRating();\n```\n\n### 反馈 2\n\n如果修改代码以允许可能的\
    \ `NULL` 值，它将可以工作——但这种保护是不安全的，因为它依赖于程序员阻止这个致命错误。\n\n在编写 `getClient()` 方法时，作者完全意识到可能找不到客户，并在这种情况下返回\
    \ `NULL` 值。然而，这依赖于每个使用该方法的程序员识别并防止这种情况发生。\n\n如果任何使用该方法的程序员未能对 `NULL` 返回进行保护，那么他们的程序就会崩溃——在这种情况下可能会损失大量资金。在其他应用程序（例如飞机控制系统）中，程序崩溃可能会导致威胁生命的后果。\n\
    \n需要一种更安全的机制来确保潜在的崩溃情况始终得到处理。\n\n这种机制是存在的——它被称为“异常”（exceptions）。\n\n通过使用这种机制，我们可以确保其他程序员会收到潜在崩溃的警告，并且编译器将确保这些程序员处理该“问题”。因此，我们可以确保没有此类情况被“遗忘”。在那种情况下，`getClient()`\
    \ 方法不应返回 `NULL` 值，而应该生成异常。通过生成异常，Java 编译器将确保其得到处理。\n\n"
