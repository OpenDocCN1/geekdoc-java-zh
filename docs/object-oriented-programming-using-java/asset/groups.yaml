    - 除了关联之外，另一种主要的建模关系是继承：\n- 类 A “继承”了类 B 的接口和实现，尽管它可能会重写实现细节并补充两者。\n\n我们将在第 3 章中详细介绍继承。\n\
    \n# 接口\n\n- 接口与继承相似，但使用接口时只继承接口。接口中定义的方法必须在每个实现接口的类中实现。\n- 接口可以使用 `<<interface>>`\
