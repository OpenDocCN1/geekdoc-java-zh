    ## 2.4 UML 包图 (Package Diagrams)


    虽然类（classes）是 UML 符号定义中最常用的图表，且我们将在本书中大量使用它们，但还有其他图表可以表示不同类型的信息。在这里我们将涉及其中三类：


    -   包图 (Package Diagrams)

    -   对象图 (Object Diagrams)

    -   时序图 (Sequence Diagrams)


    世界地图、国家地图和城市地图都显示空间信息，只是比例不同，详细程度不同。大型 OO 系统可以由数百个甚至数千个类组成，因此，如果类图是表示大型系统架构的唯一方法，它将变得过于巨大且复杂。因此，正如我们需要世界地图一样，我们需要包图来显示大型系统的总体架构。即使是中型系统也可以拆分为几个基础组件，即包（packages）。我们将在第
    11 章看到包的示例。现在我们只需查看包图的符号表示。


    包（package）不仅仅是一组类的视觉表示，相反，“包”是一个包含多个类的目录。包允许我们对一组相关的类进行组织和封装（包括 `<<interface>>`）。包不仅是类组的视觉表示，而且是一个包含一组相关类的目录。包通常被描述为用点分隔的名称，例如
    `java.event`。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_40_0.png)


    开发应该在设计阶段拆分为合适的包。我们通过包图使用 UML 表示包之间的关系：


    -   包内的类

    -   包的嵌套

    -   包之间的依赖关系


