    # 8. Java Development Tools


    ## Introduction


    This chapter will introduce the reader to various development tools that support
    the development of large scale Java systems (e.g. Eclipse and NetBeans). The importance
    of the API documentation and JavaDoc will also be demonstrated.


    ## Objectives


    By the end of this chapter you will be able to....


    - Understand the roles of the JDK and JRE

    - Investigate professional development environments (Eclipse and NetBeans)

    - Understand the importance of the Javadoc tool and the value of embedding Javadoc
    comments within your code.

    - Write Javadoc comments and generate automatic documentation for your programs.


    This chapter consists of thirteen sections -


    - 1) Software Implementation

    - 2) The JRE

    - 3) Java Programs

    - 4) The JDK

    - 5) Eclipse

    - 6) Eclipse architecture

    - 7) Eclipse Features

    - 8) NetBeans

    - 9) Developing Graphical Interfaces Using NetBeans

    - 10) Applying Layout Managers Using NetBeans

    - 11) Adding Javadoc Listeners

    - 12) The Javadoc Tool

    - 13) Summary


    ## 8.1 Software Implementation


    Before a computer can complete useful tasks for us (e.g. check the spelling in
    our documents) software needs to be written and implemented on the machine it
    will run on. Software implementation involves the writing of program source code
    and preparation for execution on a particular machine. Of course before the software
    is it needs to be designed and at some point it needs to be tested. There are
    many iterative lifecycles to support the process of design, implementation and
    testing that involve multiple implementation phases. In particular concern here
    are the three long established approaches to getting source code to execute on
    a particular machine...


    # Object Oriented Programming using Java


    Java Development Tools


    - compilation into machine-language object code

    - direct execution of source code by ‘interpreter’

    - compilation into intermediate object code which is interpreted by run-time system


    Implementing Java programs involves compiling the source code (Java) into intermediate
    object code which is interpreted by a run-time system called the JRE. This approach
    has some advantages and disadvantages and it is worth comparing these three options
    in order to appreciate the implications for the Java developer.


    ## Compilation


    The compiler translates the source code into machine code for the relevant hardware/OS
    combination.


    Strictly speaking there are two stages: compilation of program units (usually
    files), followed by ‘linking’ when the complete executable program is put together
    including the separate program units and relevant library code etc.


    The compiled program runs as a ‘native’ application for that platform.


    This is the oldest model, used by early languages like Fortran and Cobol, and
    many modern ones like C++. It allows fast execution speeds but requires re-compilation
    of the program each time the code is changed.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_127_0.png)


    # Interpretation


    Here the source code is not translated into machine code. Instead an interpreter
    reads the source code and performs the actions as it specifies.


    We can say that the interpreter is like a ‘virtual machine’ whose machine language
    is the source language.


