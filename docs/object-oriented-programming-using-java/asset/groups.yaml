    \n父类的构造函数处理通用初始化。\n\n每个子类可以有自己的构造函数用于特殊初始化，但它通常必须调用父类构造函数的行为。它使用 `super` 关键字来实现这一点。\n\
    \n```\nclass MySubclass extends SuperClass\n{\n    public MySubclass (sub-parameters)\n\
    \    {\n        super(super-parameters);\n        // 其他初始化\n    }\n}\n```\n\n\
    如果调用了 `super`（即父类构造函数），则这必须是构造函数中的第一个语句。\n\n通常传递给 `MySubclass` 的某些参数是父类实例变量的初始化值，这些值将作为参数传递给父类构造函数。也就是说，`super-parameters`\
    \ 将是 `sub-parameters` 的某些（或全部）。\n\n下面显示两个构造函数，一个用于 `Publication` 类，另一个用于 `Book`。`book`\
    \ 构造函数需要四个参数——其中三个被立即传递给父类构造函数以初始化其实例变量。\n\n```\npublic Publication (String pTitle,\
    \ double pPrice, int pCopies)\n{\n    title = pTitle;\n    // 等等\n}\n```\n\n```\n\
    public Book (String pTitle, String pAuthor, double pPrice)\n{\n    super(pTitle,\
    \ pPrice, pCopies);\n    author = pAuthor;\n    //等等.\n}\n```\n\n# 3.6 构造函数规则\n\
    \n存在规范父构造函数调用的规则。\n\n如果父类具有无参数（或默认）构造函数，如果在子类构造函数中没有显式调用 `super`，它将被自动调用，尽管出于清晰性考虑，显式调用仍然更好的风格。\n\
    \n然而，如果父类没有无参数构造函数但有一个带参数构造函数，则**必须**使用 `super` 显式调用。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_60_0.png)\n\
    \n# 使用 Java 的面向对象编程\n\n# 继承与方法重写\n\n为了说明这一点....\n\n| MySuperClass | MySuperClass\
    \ | MySuperClass |\n| :--- | :--- | :--- |\n| MySuperClass() | MySuperClass(x)\
    \ | MySuperClass(x) |\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_61_0.png)\n\n\
    上方左侧：如果父类具有无参数构造函数，拥有一个没有构造函数的子类是合法的，尽管这不是良好的做法。\n\n中间：如果子类构造函数没有调用 `super`，将调用无参数的父类构造函数。\n\
    \n右侧：因为父类没有无参数构造函数，子类必须有一个构造函数并且它必须调用 `super`。这仅仅是因为一个只有一个带参数构造函数的（父）类只能通过提供所需的参数（s）来初始化。\n\
    \n# 3.7 访问控制\n\n为了强制封装，我们将实例变量设为私有（private），并根据需要提供访问器/修改器方法（accessor/mutator\
    \ methods）。\n\n`Publication` 的 `sellCopy()` 方法需要更改变量 `copies` 的值；如果 `copies` 是私有变量，它可以这样做。然而，`Book`\
