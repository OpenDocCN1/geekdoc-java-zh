    ## 6.4 识别系统范围之外的事物


    设计系统的一个重要部分是识别那些与系统不相关或超出系统范围的问题方面。描述中的某些部分可能是纯粹的背景性的，即为了一般信息之目的，因此不是任何能直接描述我们正在设计的系统方面的的内容。此外，我们所指的描述某些部分是指用户在使用系统时执行的任务，并描述了需要在系统内部实现的功能；而其他部分可能描述了用户在不使用系统时执行的任务——因此没有描述系统内部的功能。


    通过识别描述中不与我们正在开发的系统无关的事物，使问题变得尽可能简单。


    | 活动 2 |

    | :--- |

    | 查看上述名词和动词列表，并识别各出一个在系统范围之外的项。 |


    | 反馈 2 |

    | :--- |

    | 第一段的大部分是背景，没有描述我们需要在系统内部实现的功能。我们还需要查看描述的其他部分，以识别不相关的部分。 |


    系统范围之外的事物……


    * GetFit 体育俱乐部 – 这是开发系统的客户。我们不需要在系统中建模这个实体。

    * 沿海地区 – 跑步地点与系统功能无关。我们不需要在系统中将其建模为对象。

    * 软件系统 – 这是我们正在开发的整个系统，它没有描述系统内部的实体。

    * 动词 :-

    * 组织 – 这是俱乐部成员执行的活动，他们可能是系统的用户，但这不是他们使用系统所需的活动。

    * 马拉松 – 这是跑步者正在做的事情。这不是系统需要做的事情。


    注意：‘完成比赛’是跑步者做的一件事，当这发生时，他们的完成时间必须记录在系统中。因此，这实际上**不在**系统范围之外。


    ## 6.5 识别同义词


    同义词是具有相同含义的两个词。在系统描述中识别这些是非常重要的。未能这样做会导致一个实体被建模两次，导致重复和混淆。


    | 活动 3 |

    | :--- |

    | 查看名词和动词列表，并识别两个同义词，一个来自名词列表，一个来自动词列表。 |


    | 反馈 3 |

    | :--- |

    | 同义词

    名词 -

    * 世界排名专业人士=专业跑步者

    * 募捐业余爱好者=业余跑步者

    * 跑步者=参赛者

    注意跑步者不是专业跑步者的同义词，因为有些跑步者是业余的。

    动词 -

    * 马拉松=比赛

    * 检查状态=显示状态

    * 打印收集列表 =打印列表

    * 完成比赛 =记录指定时间 |


    ## 6.6 识别潜在类


    通过识别系统范围之外的以及识别描述中实际上描述相同实体和操作的部分来简化问题后，我们现在可以开始识别要实现的系统中潜在类。


    某些名词将指示要实现的类，另一些将指示类的属性。


    良好的面向对象设计建议数据和操作应该封装在一起——因此类表示我们可以识别关联数据和操作（或方法）的复杂概念实体。


    简单实体（例如地址）有关数据但没有操作，因此这些应作为简单属性存储在相关的类中。


