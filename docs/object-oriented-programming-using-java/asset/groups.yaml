    # 5. Overloading


    # Introduction


    This chapter will introduce the reader to the concept of method overloading.


    # Objectives


    By the end of this chapter you will be able to....


    +   - Understand the concept of ''overloading''

    - Appreciate the flexibility offered by overloading methods

    - Identify overloaded methods in the online API documentation


    This chapter consists of the following three sections :-


    +   1) Overloading

    2) Overloading To Aid Flexibility

    3) Summary


    # 5.1 Overloading


    Historically in computer programs method names were required to be unique. Thus
    the compiler identify which method was being invoked by looking at its name.


    Several methods were often required to perform very similar functionality for
    example a method could add two integer numbers together and another method could
    be to add two floating point numbers. If you have to give these two methods unique
    names which one would call `add()`?


    In order to give each method a name the names would need to be longer and more
    specific. We could therefore call one method addInt() and the other addFloat()
    but this could lead to a proliferation of names each describing different methods
    that are essentially performing the same operation ie. adding two numbers.


    To overcome this problem in Java you are not required to give each method a unique
    name – thus both of the methods above could be called add(int). However method
    names are not unique the Java Runtime Environment (JRE) must have some other way
    of deciding which method to invoke on run time, i. e. when a call is made to add(number1,number2)
    the machine must decide which of the two methods to use. It does this by looking
    at the parameter list.'
  - "[PAGE 92]\n\n# Object Oriented Programming using Java Overloading\n\nWhile the\
