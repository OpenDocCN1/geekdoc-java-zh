    # 4.6 Extensibility Again


    Polymorphism allows objects to handled without regard for their precise class.
    This can assist in making systems extensible without compromising the encapsulation
    of the design.


    For example, we could create new classes for more products or services and so
    long as we implement the Saleable interface the CashTill will be able to process
    them **without a change to its code**;


    An example could be ''Sweets''. We could define a class Sweets to represent sweets
    in a jar. We can define the price of the sweets depending upon the weight and
    then sell the sweets by subtracting its weight from our total stock. This is not
    like selling a Publication, where we always abstract 1 from the stock, nor is
    this like selling sweets, where we just print them.


    However if we create a class ''Sweets'' that implements the Saleable interface
    enhanced polymorphic cash till sell them because it it sell any Saleable.


    In this case, without polymorphism we would need to add an additional "sale" method
    to CashTill to handle Tickets, Secrets and further methods for every new type
    of product to be sold. By defining the Saleable interface can introduce additional
    products without affecting CashTill at all. Polymorphism makes it easy to extend
    our programs and this is very important.


    Interfaces allow software components to plug together more flexibly and extensibly,
    just as many other kinds of plugs and sockets enable audio, video, power and data
    connections in the everyday world. Think of the number of different electrical
    appliances which could be lug into a standard power socket – imagine how inconvenient
    it would be if instead you had to call out an electrician to wire up each new
    one you bought!


