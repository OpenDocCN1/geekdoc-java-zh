    # Object Oriented Programming using Java

    ## An Introduction to Object Oriented Programming


    ## Activity 2


    Imagine a personal address book with some data stored about your friends:

    Name,

    Address,

    Telephone Number.


    List three things that you may do to this address book.


    Next identify someone else may use an identical address book for some purpose
    other than storing a list of friends.


    ## Feedback 2


    With an address book we want to be able to perform the following actions:- find
    out details of a friend (i.e. their telephone number), add an address to the address
    book and, of course, delete an address.


    We can create a simple software component to store the data in the address book
    (i.e. list of names etc) and the operations we can perform (i.e. add address,
    find telephone number etc.).


    By creating a simple software component to store and manage addresses of friends
    we reuse this in another software system i.e. it could be used by a business manager
    to store and find details of customers. It could also become part of a library
    system to be used by a librarian to store and retrieve details of the users of
    the library.


    Thus in object-oriented programming we can create re-usable software components
    (in this case address book).


    The Object Oriented paradigm builds upon and extends the ideas behind the structured
    programming paradigm of the 1970s.


    ## 1.3 Why we use the Object Orientation Paradigm?


    While we focus our attention on the actual program code we are writing, whatever
    methodology is adopted, it is not the creation of the code that is the general
    source of most problems. Most problems come from:


    - poor analysis and design: the computer system we create doesn''t do the right
    thing.

    - poor maintainability: the system is hard to understand and revise when, inevitably,
    requests for change arise.


    Statistics show 70% of the cost of software is not incurred during its initial
    development phase but is incurred during subsequent years as the software is amended
    to meet the ever changing needs of the organisation which it was developed. For
    this reason it is essential that software engineers do everything possible to
    ensure that software is easy to maintain during the years after its initial creation.


    # Object Oriented Programming using Java


    The Object Oriented programming paradigm aims to overcome these problems by helping
    with the analysis and design tasks during the initial software development phase
    (chapter 6 for more details on this) and by ensuring software is robust and maintainable
    (chapters 9-11 for information on the support Object Orientation and Java provides).


    ## 1.4 Object Oriented Principles


    Abstraction and encapsulation are fundamental principles that underlie the Object
    Oriented approach to software development. Abstraction allows us to consider complex
    ideas while ignoring irrelevant detail that would confuse us. Encapsulation allows
    us to focus on what something does without considering the complexities of how
    it works.


    | Activity 3 |

    | :--- |

    | Consider your home and imagine you were going to swap your home for a week with
    a new friend. |

    | Write down three essential things you would tell them about your home and that
    you would want to know about their home. |

    | Now list three irrelevant details that you would not tell your friend. |


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_15_0.png)


    # Object Oriented Programming using Java

    ## An Introduction to Object Oriented Programming


    ## Feedback 3


    You presumably would tell them the address, give them a basic list of rooms and
    facilities (e.g. number of bedrooms) and tell them how to get in (i.e. key would
    operate the front door and how to switch off the burglar alarm (if you have one)).


    You would not tell them irrelevant details (such as the colour of the walls, seats
    etc) as would overload them with useless information.


    Abstraction allows us to consider the important high-level details of your home,
    e.g. the address, without becoming bogged down in detail.


    ## Activity 4


    Consider your home and write down one item, such as a television, that you use
    on your daily basis (and briefly describe how you operate this item).


    Now consider how difficult it would be to describe the internal components of
    this item and give full technical details of how it works.


    ## Feedback 4


    Describing how to operate a television is much easier than describing its internal
    components and explaining in detail how it works. Most people do not know all
    the components of the appliances they use or how they work – but this does not
    stop them using appliances every day.


    You may not know the technical details of how the light switches are wired together
    and how they work internally but you can still switch the lights on and off in
    your home (and in any new building you enter).


    Encapsulation allows us to consider what a light switch does, and how we operate
    it, without needing to worry about the technical detail of how it actually works.


    Two other fundamental principles of Object Orientation are Generalization/specialization
    which allows us to make use of (inheritance) and polymorphism.


    Generalisation allows us to consider general categories of objects which have
    common properties and then define specialised subclasses that inherit the properties
    of the general categories.


    ## Activity 5


    Consider the people who work in a hospital - list three common occupations of
    people you would expect to be employed there.


    Now for each of these common occupations list two or three specific categories
    of staff.


    # Object Oriented Programming using Java

    ## An Introduction to Object Orientated Programming


    | Feedback 5 |

    | :--- |

    | Depending upon your knowledge of the medical profession you may have listed
    three very general occupations (e.g. doctor, nurse, cleaner) or you may have listed
    more specific occupations such as radiologist, surgeon etc. |

    | Doctor | radiologist, surgeon |

    | Nurse | midwife, sister |

    | Cleaner | supervisor |


    Generalisation allows us to consider general categories of objects which have
    common properties and then define specialised subclasses that inherit the properties
    of the general categories.


    ## Activity 6


    | Activity 6 |

    | :--- |

    | Make one statement about doctors that you consider to be true and make one statement
    about surgeons that would not be true for all doctors. |


    | Feedback 6 |

    | :--- |

    | You have considered that a hospital manager could pay all doctors (presumably
    this will be done at the end of every month) and could discipline any doctor guilty
    of misconduct – this would be true for other staff as well. More specifically
    a manager could check that doctors medical registration is still current. This
    would be something management would need to do for all doctors regardless of what
    their special is. Furthermore, if the hospital employed new specialist doctor
    (e.g. a Neurologist), knowing anything specific about this special, management
    would still know that a) these staff needed to be paid and b) their medical registration
    must be checked. i.e. they are still doctors and need to be treated such. |


    Generalisation allows us to consider general categories of objects which have
    common properties and then define specialised subclasses that inherit the properties
    of the general categories.


    The final principle underlying Object Orientation is Polymorphism which is the
    ability to interact with a object regardless of its special category.


    Using the same idea polymorphism allows computer systems to be extended, with
    new specialised objects being created, allowing current parts of the system to
    interact with new object without concern for the specific properties of the new
    objects.


    ## Activity 7


    | Activity 7 |

    | :--- |

    | Make one statement about how a hospital manager may interact with all doctors
    employed at his hospital regardless of what type of doctor they are. |


    ## 1.5 What Exactly Object Oriented Programming?


    | Activity 8 |

    | :--- |

    | Think of an object you possess. Describe its current state and list two or three
    things you can do with that object. |


    | Feedback 8 |

    | :--- |

    | You probably thought about an entirely physical object such as a watch, a pen,
    or a car. Objects have a current status. A watch has a time (represented internally
    by wheels and cogs in an electronic component). A pen has a certain amount of
    ink in it and has its lid or off. A car has a current speed and has a certain
    amount of fuel inside it. Specific behaviour can also be associated with each
    object (things that you can do with it) - a watch can be checked to find out its
    time, its time can also be set. A pen can be used to write with and a car can
    be driven. |

