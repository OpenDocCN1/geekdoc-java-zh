    \n使用 Java 进行面向对象编程\n\n'Purge Messages' 调用了 purgeMessages() 方法。它没有执行任何可见的操作，但会减少每条消息的剩余天数，增加客户的信用额度并在并在时删除消息。可以通过在执行每日清理前后运行\
    \ Find Client 来进行测试。\n\n## 11.17 总结\n\n面向对象开发范式的基本原则是：\n\n- 抽象\n- 封装\n- 泛化/特化（继承）\n\
    - 多态\n\n这些原则无处不在于 Java 语言和库包 API 之中，并为我们自己的软件开发项目提供了框架。\n\n在本章中，你已经很愉快地看到了面向对象化是如何通过以下方式支持程序员的：\n\
