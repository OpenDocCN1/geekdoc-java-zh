    \ method fixEngine() to any Car object as it is defined in the class Car.\n- b)\
    \ This would invoke the overridden method. The method must be defined in the class\
    \ Car else the compiler will fail at compile time. However at runtime the Java\
    \ Runtime Environment (JRE) will identify the object passed as being of the subtype\
