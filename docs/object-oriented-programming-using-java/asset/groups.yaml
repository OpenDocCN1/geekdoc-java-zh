- md: "\n## 10.12 Test Driven Development (TDD)\n\nAutomated unit testing also supports\
    \ Test Driven Development (TDD) which is a technique mainly associated with 'agile'\
    \ development processes. This has become a hot topic in software engineering.\n\
    \nThe Test Driven Development approach is to:\n\n1) Write the tests (before writing\
    \ the methods tested).\n2) Set up automated unit testing, which fails because\
    \ the classes haven't yet been written!\n3) Write the classes and methods so the\
    \ tests pass.\n\nThis reversal seems strange at first, but many eminent contributors\
    \ to software engineering debates believe it is a powerful 'paradigm shift'.\n\
    \nThe task of teaching can be used as an analogy. Which of the following is simpler?\n\
    \n- Teach student everything you know about a subject and then decide how to test\
    \ their knowledge or\n- Decide specifically what it is they need to learn (i.e.\
    \ decide what to test) and then teach the person just what they need to know in\
    \ order to pass that test.\n\n## 10.13 TDD Cycles\n\nWhen undertaking test development,\
    \ the test will initially cause a compilation error as the method being tested\
    \ doesn't exist!\n\nCreating a stub method enables the test to compile but the\
    \ test itself will fail because the actual functionality being tested has not\
    \ been implemented in the method.\n\nWe then implement the correct functionality\
    \ of the method so that the test succeeds.\n\nFor a complex method we may have\
    \ several cycles of: write test, fail, implement functionality, pass, extend test,\
    \ extend functionality, pass... to build up the solution.\n\n## 10.14 Claims for\
    \ TDD\n\nAmong the advantages claimed for TDD are:\n\n- testing becomes an intrinsic\
    \ part of development rather than an often hurried afterwards.\n- it encourages\
    \ programmers to write simple code directly addressing the requirements.\n\n##\
    \ Object Oriented Programming using Java Agile Programming\n\n- a comprehensive\
    \ suite of unit tests is compiled in parallel with the code development\n- a rapid\
    \ cycle of 'write test, write code, run test'; each for a small developmental\
    \ increment, increases programmer confidence and productivity.\n\nIn conventional\
    \ lifecycles, if a software project is running late, financial pressures often\
    \ result in the software being rushed to market not having been fully tested and\
    \ debugged. With Test Driven Development this is not possible as the tests are\
    \ written before the system has been implemented.\n\n## 10.15 Summary\n\n'Agile\
    \ development approaches emphasize flexible cyclic development with the system\
    \ evolving towards a solution.\n\nUnit testing is an important part of software\
    \ engineering practice whatever state of development process is adopted.\n\nAn\
    \ automated unit testing framework (e.g. JUnit) allows unit tests to be regularly\
    \ repeated as system development progresses.\n\nTest Driven Development reverses\
    \ the normal sequence of code and test creation, and plays a major part in 'agile'\
    \ approaches.\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_165_0.png)\n\nDownload\
    \ free books from BookBooN.com\n\n## 11. Case Study\n\nThis chapter will bring\
    \ together all of the previous chapters showing how these essential concepts work\
    \ in practise through one example study.\n\n### Objectives\n\nBy the end of this\
    \ chapter you will see ....\n\n- how a problem description is turned into a UML\
    \ model (as described in Chapter 6)\n- an example of typed collections can be\
    \ effectively used, in particular you will see an example of the use of sets and\
    \ maps (as described in Chapter 7)\n- an example of polymorphism and see how this\
    \ enables programs to be extended simply (as described in Chapter 4)\n- a simple\
    \ example of the use of inheritance and method overriding (as described in Chapter\
    \ 3)\n- several example of UML diagrams (as described in Chapter 2)\n- finally\
    \ you will see the use of the Javadoc tool (as described in Chapter 8).\n\nThe\
    \ complete working application, developed described throughout this chapter, is\
    \ available to download for free as an exported Eclipse project.\n\nEclipse is\
    \ freely available from www.eclipse.org.\n\nThis chapter consists of seventeen\
    \ sections :-\n\n1) The Problem\n2) Preliminary Analysis\n3) Further Analysis\n\
    4) Documenting the design using UML\n5) Prototyping the Interface\n6) Revising\
    \ the Design to Accommodate Changing Requirements\n7) Packaging the Classes\n\
    8) Programming the Message Classes\n9) Programming the Client Classes\n10) Creating\
    \ and Handling UnknownClientException\n11) Programming the Main classes\n12) Programming\
    \ the Interface\n13) Using Test Driven Development and Extending the System\n\
    14) Generating Javadoc\n15) Running the System and Potential Compiler Warnings\n\
    16) The Finished System...\n17) Summary\n\n## 11.1 The Problem\n\nUser requirements\
    \ is a topic of significant importance to the software engineering community and\
    \ totally outside the scope of this text. The purpose of this chapter is not to\
    \ show how requirements are obtained but to show how a problem statement is modelled\
    \ using OO principles and turned into a complete working system once those requirements\
    \ are gathered.\n\nThe problem for which we will design a solution is ‘To develop\
    \ a message management system for a scrolling display board belonging to a small\
    \ retailer.’\n\nFor the purpose of this exercise we will assume preliminary requirements\
    \ analysis has been performed by interviewing the shop owner, and the workers\
    \ who would use the system, and from this the following textual description has\
    \ generated:-\n\nRory’s Readables is a small shop on the seafront selling a range\
    \ of convenience goods, especially books and magazines aimed at both the local\
    \ and tourist trades. It has recently become a ticket agency for various local\
    \ entertainment and transport providers.\n\nRory plans to acquire an LCD message\
    \ display board mounted above the storefront which can show scrolling text. Rory\
    \ intends to use this to advertise his own products and offers.\n\n## Object Oriented\
    \ Programming using Java\n\nGiven the description above this chapter describes\
    \ how this problem may be analysed, modelled and a solution programmed – thus\
    \ demonstrating the techniques discussed throughout this book.\n\n## 11.2 Preliminary\
    \ Analysis\n\nTo perform a preliminary analysis of these requirement as (described\
    \ in Chapter 6) we must...\n\n- List the nouns and verbs\n- Identify things outside\
    \ the scope of the system\n- Identify the synonyms\n- Identify the potential classes,\
    \ attributes and methods\n- Identify any common characteristics\n\nFrom reading\
    \ this we can see that the first paragraph is purely contextual and does not describe\
    \ anything specifically related to the software. This has therefore been ignored.\n\
    \n### List of Nouns\n\nFrom the remaining paragraphs we can list the following\
    \ nouns or noun phrases:-\n\n- LCD message\ndisplay board\n- shopfront\n- scrolling\
    \ text\n- message\n- client\n- ID string\n- name\n- address\n- phone number\n\
    - credit\n- credit unit\n- message\n- day\n- book of clients\n- ID\n- text\n-\
    \ number of days\n- cost of message\n- (units)\n- set of current\nmessages\n-\
