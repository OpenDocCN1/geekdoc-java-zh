    \ `Ticket` 不应该属于与 `Publications` 的继承层次结构。但我们确实希望像处理出版物一样，通过收银机检查票据。\n\n就像出版物一样，票据也提供了\
    \ `CashTill` 所需的操作：\nsellCopy()\nPrice()\n\n并且 `CashTill` 可以出售 `Ticket`。事实上，`CashTill`\
    \ 可以出售任何拥有这些方法的对象，而不仅仅是 `Publications`。为了实现这一点，我们将这组操作定义为名为 `SaleableItem` 的“接口”（Interface）。\n\
    \n```java\ninterface SaleableItem\n{\n    public void sellCopy ();\n    public\
    \ double getPrice ();\n}\n```\n\n注意，接口仅定义了操作的签名，而不包含它们的实现。\n\n如果没有特别说明，所有方法都是显式的公共的（public），并且不能有实例变量或构造函数。\n\
    \n换句话说，接口定义了指定操作的可用性，而不对其实现做任何说明。这留给实现接口的类去处理。\n\n接口是一种合同。`SaleableItem` 接口表示：“我承诺至少提供具有以下签名的方法：”\n\
    \n```java\npublic void sellCopy ();\npublic double getPrice ();\n```\n\n尽管我也可能包含其他内容。\n\
    \n当多个类实现一个接口时，它提供了一个保证的共性区域，多态性可以利用这一区域。\n\n## 使用 Java 的面向对象编程\n\n## 对象角色与多态性的性\n\
    \n想象一辆汽车和街机游戏里的驾驶游戏。它们之间显然没有任何“是（is a）”的关系——它们是完全不同的东西，一个是车辆，另一个是街机游戏。但它们都实现了我们所谓的“方向盘接口”，我们可以用完全相同的方式使用它，尽管其实现（汽车中的机械连杆，游戏中的视频电子设备）非常不同。\n\
    \n我们现在需要声明 `Publication`（及其所有子类）和 `Ticket` 都提供了该接口定义的操作：\n\n```java\nclass Publication\
    \ implements SaleableItem\n{\n    [class details...]\n}\n```\n\n```java\nclass\
    \ Ticket implements SaleableItem\n{\n    [class details...]\n}\n```\n\n对比 `implements`\
    \ 与 `extends`。\n\n- `extends` 导致从父类继承接口和实现。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_84_0.png)\n\
    \n## 招募：野心勃勃的人\n\n在 NNE Pharmaplan，我们需要野心勃勃的人来帮助我们实现公司设定的具有挑战性的目标。\n\nKim Voby\
    \ 是众多野心勃勃同事中的一个。除了制造 IT 部门的经理外，Kim 还以专业水平参加铁人三项。\n\nNNE Pharmaplan 为我提供了责任感与自由，以及规划自己时间的机会。这使我能够以竞技水平参加铁人三项，否则我没有可能做到这一点。\n\
    \n通过平衡工作和个人生活，我获得了在工作和铁人三项中发挥最佳水平的能量。\n\n如果你也野心勃勃并想加入我们的机会世界，请访问 nnepharmaplan.com\n\
    \nNNE Pharmaplan 是全球领先的工程和咨询公司，专门关注医药和生物技术行业。NNE Pharmaplan 是 Novo Group 集团的公司。\n\
    \n## 使用 Java 的面向对象编程\n\n- `implements` 提供了一种保证，即接口指定的将被将被——这足够允许对实现给定接口的所有类进行多态处理。\n\
    \n## 多态 CashTill\n\n`CashTill` 类已经使用了多态性：`sell` 方法接受 `Publication` 类型的参数，这允许传递它的任何子类：\n\
    \n```java\npublic void sellItem (Publication pPub)\n```\n\n我们现在想进一步扩大这一范围，接受任何实现\
    \ `SaleableItem` 的对象：\n\n```java\npublic void sellItem (SaleableItem pSel)\n```\n\
    \n当变量或参数的类型定义为接口时，它的工作方式就像父类一样。任何实现接口的类都可以赋值给该变量，因为接口是一种类型，而所有实现它的类都是子类型。下面显示了……![](img/2bcd878aa3b5707827d8b6067ca7458e_85_0.png)\n\
    \n`CashTill` 不再直接依赖于 `Publication` —— 相反它依赖于接口 `SaleableItem`。\n\n从 `Publication`\
    \ 和 `Ticket` 到 `SaleableItem` 的关系类似于继承，只不过线条是虚线——这表示每个类都实现了接口。\n\n## 4.6 再次讨论扩展性\n\
    \n多态性允许在不考虑精确类的情况下处理对象。这可以有助于提高系统的可扩展性，而不会损害设计的封装性。\n\n例如，我们可以为更多产品或服务创建新类，只要我们实现了\
    \ `Saleable` 接口，`CashTill` 就能处理它们而无需更改其代码；一个例子可以是“糖果”（Sweets）。我们可以定义一个 `Sweets`\
    \ 类来表示罐子里的糖。我们可以根据重量定义糖的价格，然后通过从总库存中减去其重量来出售糖。这与出售 `Publication` 不同（我们总是从库存中减去\
    \ 1），也不像出售糖果那样（我们只需要打印它们）。\n\n然而，如果我们创建一个实现 `Saleable` 接口的 `Sweets` 类，`CashTill`\
    \ 就可以出售任何 `Saleable` 对象。在这种情况下，如果没有多态性，我们需要为 `CashTill` 添加一个额外的“销售”方法来处理 `Ticket`，并为每种要出售的新产品类型添加更多方法。通过定义\
    \ `Saleable` 接口可以引入额外的产品。\n\n## 再次讨论扩展性\n\n## 活动 5\n\n请通过修改以下图来添加一个 `Diesel` 类，使其能够说明多态性。\n\
    \n| PetrolCar | Mechanic |\n| :--- | :--- |\n| diagnoseProblems() | repair(PetrolCar)\
    \ |\n\n## 使用 Java 的面向对象编程\n\n## 对象角色与多态性的性\n\n## 反馈 5\n\n这是一个抽象类的解决方案……这里还有其他课程：\n\
    \n| <<abstract>> | Mechanic |\n| :--- | :--- |\n| Car | |\n| diagnoseProblems()\
    \ | repair(Car) |\n| PetrolCar | DieselCar |\n\n"
