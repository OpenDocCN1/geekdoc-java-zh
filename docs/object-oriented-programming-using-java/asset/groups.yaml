    \  } else {\n        System.out.println(\"This is an unknown sale type\");\n \
    \   }\n}\n```\n\n如果 `pSelb` 是 `Publication`、`Magazine` 或 `DiscMag` 的任何子类，`pSelb\
    \ instanceof Publication` 将为 true。如果我们愿意，也可以测试更具体的子类型，例如 `pSelb instanceof Book`。\n\
    \n注意，我们为了系统的可扩展性，通过检查子类型牺牲了多态性——实现 `SaleableItem` 接口的新类（例如 `Sweets`）可能也需要在此语句中添加新类，这种变化会影响整个系统，导致维护成本高昂且容易出错。\n\
    \n相反，我们尝试将不同的行为封装在子类本身中，例如我们可以在 `SaleableItem` 接口中定义一个 `describeSelf()` 方法，然后每个实现\
    \ `SaleableItem` 接口的类都需要实现该方法。因此，每个子类型都会显示一条显示商品类型的消息。上面的 `if` 语句可以用 `pSelb.describeSelf()`\
    \ 替换。这样，当我们向系统添加新类时，就不需要修改 `CashTill` 类了。\n\n# 4.8 总结\n\n多态允许我们根据父类而不是对象的实际类来引用对象。\n\
    \n多态使得通过添加额外的类来扩展程序变得简单，无需更改其他类。\n\n我们可以通过调用为父类定义的操作来操作对象，而无需担心任何特定情况下涉及哪个子类。\n\
    \nJava 确保在运行时调用对象实际类对应的相应方法。\n\n有时我们希望使用多态，但不需要所有相关的类都处于继承层次结构中。“接口”（interface）结构允许我们在这种情况下提供共享的接口（即操作集合）。这样做时，没有继承的实现——每个类都必须实现接口中定义的所有操作。\n\
    \n任意数量的类都可以实现特定的接口。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_90_0.png)\n\n\
    # 5. 方法重载\n\n# 引言\n\n本章将向读者介绍方法重载的概念。\n\n# 目标\n\n在本章结束时，你能够....\n\n- 理解“重载”的概念\n\
    - 赏方法重载提供的灵活性\n- 在在线 API 文档中识别重载方法\n\n本章由以下三个部分组成：\n\n1) 重载\n2) 为了增加灵活性而重载\n3)\
    \ 总结\n\n# 5.1 重载\n\n在历史上，计算机程序中的方法名必须是唯一的。因此，编译器通过查看方法名来识别调用了哪一个方法。\n\n通常需要多个方法执行非常相似的功能，例如，一个方法可以将两个整数相加，另一个方法可以是相加两个浮点数。如果你必须给这两个方法起唯一的名称，哪一个会用\
    \ `add()` 呢？\n\n为了给每个方法命名，名称需要更长且更具体。因此我们可以将一个方法命名为 `addInt()`，另一个为 `addFloat()`，但这可能导致名称泛滥，每个名称描述一个本质上执行相同操作（即相加两个数字）的不同方法。\n\
    \n为了在 Java 中解决这个问题，不需要给每个方法起唯一的名称——因此上述两个方法都可以称为 `add()`。\n\n# 使用 Java 进行面向对象编程重载\n\
    \n虽然两个方法可能有相同的名称，但仍然可以通过查看参数列表来区分它们：\n\n```java\nadd(int number1, int number2)\n\
    add(float number1, float number2)\n```\n\n这是由 JRE 在运行时解析的。即在运行时，JRE 查看方法调用以及正在传递的实际参数。如果传递了两个整数，则调用第一个方法。但如果传递了两个浮点数，则使用第二个方法。\n\
    \n重载是指多个方法可以共享相同的名称。方法名不再唯一地标识方法，此时名称就变成“重载”了。\n\n# 5.2 为了增加灵活性而重载\n\n拥有本质上执行相同操作但带有不同参数列表的方法可以增强系统的灵活性健壮性。\n\
