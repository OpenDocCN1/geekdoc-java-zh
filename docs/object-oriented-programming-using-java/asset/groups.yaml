    # Object Oriented Programming using Java\n\nMost the code below is self explanatory\
    \ perhaps the display method needs some explanation. Firstly, Set and Map classes\
    \ implement the iterator() method which returns an object of Iterator and this\
    \ object is capable of iterating our List. Note - this is not a simple process\
    \ as each collection can be made up of different objects, thankfully the hard\
    \ work has done for us.\n\nThus in the display() method a variable 'it' is created\
    \ of the general type Iterator. The method iterator() is then invoked on our specific\
    \ collection returning an object capable of iterating our List of Strings. The\
    \ Iterator has two very useful methods : hasNext() which return true another object\
    \ exists in the collection and next() which returns the next object in the collection.\n\
    \nThus the loop iterates over the list running and displaying each object.\n\n\
    There is one final thing to note: because we are using untyp collection each object\
