    \ B 对象是类 A 不可缺的一部分，通常类 B 对象除了作为类 A 的一部分之外永远不会存在，它们具有相同的“生命周期”。\n\n组合的一个示例是图片（Picture）中的元素点（Points）、线（Lines）和形状（Shapes）。这些对象只能作为图片的一部分存在，如果图片被删除，它们也会被删除。\n\
