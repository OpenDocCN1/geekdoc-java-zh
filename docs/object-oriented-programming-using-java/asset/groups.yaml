    # 3.12 Summary


    Inheritance allows us to factor out common attributes and behaviour. We model
    the commonities in a superclass.


    Subclasses are used to model specialized attributes and behaviour.


    Code in a superclass is inherited to all subclasses. If we amend or improve code
    for a superclass impacts on all subclasses. This reduces the code we need to write
    in our programs.


    Special rules to constructors for subclasses.


    A superclass can be declared abstract to prevent it being instantiated (i.e. objects
    created).


    We can ''override'' inherited methods to a subclass implements an operation differently
    from its superclass.


    In Java all classes descend from the class ''Object''


    ''Object'' defines some universal operations which can usefully be overridden
    in our own classes.


