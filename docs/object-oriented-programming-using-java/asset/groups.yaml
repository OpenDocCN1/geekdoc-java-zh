    ## 6.4 Identifying Things Outside The Scope of the System


    An important part in designing a system is to identify those aspects of the problem
    that are not relevant or outside the scope of the system. Parts of the description
    may be purely contextual i.e. for general information purposes and thus nothing
    that will directly describe the aspects of the system we are designing. Furthermore
    parts of the description we refer to tasks that are performed by users of the
    system as they are using the system, and describe functions that need to be implemented
    within the system, other parts may describe tasks performed by users while not
    using the system – and thus not describe functions within the system.


    By identifying things in the description that are not relevant to the system we
    are developing the problem as simple as possible.


    | Activity 2 |

    | :--- |

    | Look at the list of nouns and verbs above and identify one of each that is outside
    the scope of the system. |


    | Feedback 2 |

    | :--- |

    | Most of the first paragraph is contextual and does not describe functionality
    we need to implement within the system. We also need to look at other parts of
    the description to identify parts that are not relevant. |


    Things outside the scope of the system...


    * GetFit Athletic Club – this is the client for whom the system is being developed.
    It is not an entity we need to model within the system.

    * Coastal location – the location of the run is not relevant to the functionality
    of the system as described. Again we do not need to model this as an object within
    the system.

    * Software system – this is the system we are developing as a whole it does not
    describe an entity within the system.

    * Verbs :-

    * Organize – this is an activity done by members of the athletic club, these may
    be users of the system but this is not an activity that they are using the system
    needs for.

    * Marathon – this is what the runners are doing. It is not something the system
    needs to do.


    Note : ‘Finish race’ is something that a runner does when this happens their finish
    time must be recorded in the system. Therefore this in NOT fact outside the scope
    of the system.


    ## 6.5 Identifying Synonyms


    Synonyms are two words that have these same meaning. It is important to identify
    these in the description of the system. Failure to do so will mean that one entity
    will be modelled twice which will lead to duplication and confusion.


    | Activity 3 |

    | :--- |

    | Look at the list of nouns and verbs and identify two synonyms, one from the
    list of nouns and one from the verbs. |


    | Feedback 3 |

    | :--- |

    | Synonyms

    Nouns -

    * world ranking professional=professional runner

    * fund-raising amateur=amateur runner

    * runner=competitor

    Note runner is not a synonym of professional runner as some runners are amateurs.

    Verbs -

    * marathon=compete

    * check status=display status

    * print collection list = print list

    * finish race = record specified time |


    ## 6.6 Identifying Potential Classes


    Having simplified the problem by identifying aspects that are outside the scope
    of the system and by identifying different parts of the description that are in
    reality describing the same entities and operations we can now start to identify
    potential classes in the system to be implemented.


    Some nouns will indicate classes to be implemented and some will indicate attributes
    of classes.


    Good OO design suggests that data and operations should be packaged together –
    thus classes represent complex conceptual entities for which we can identify associated
    data and operations (or methods).


    Simple entities, such as an address, have associated data but no operations and
    thus these be stored as simple attributes within a related class.

