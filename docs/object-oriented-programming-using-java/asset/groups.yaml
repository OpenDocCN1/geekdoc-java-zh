    # Object Oriented Programming using Java


    ## 8.4 The JDK


    To develop Java programs you must first install the Java Development Kit (JDK).
    This was developed by Sun and is available freely from the internet via http://java.sun.com/.
    Prior to version 5.0 (or 1.5) this was known as the Software Development Kit (SDK).


    A Java IDE e.g. Eclipse or JavaBeans, sits on top of the JDK to add the IDE features
    - these may include interface development tools, code debugging tools, testing
    and refactoring tools (more on these later). When using an IDE it is easy to forget
    that much of the functionality is in fact part of the JDK and when the IDE is
    asked to compile a program it is just passing on this request to the JDK sitting
    underneath.


    We can use the JDK directly from the command line to compile and run Java programs
    though most it is easier to use the additional functionalities offered by an IDE.


