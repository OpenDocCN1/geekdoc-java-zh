    \n## 10.6 自动化单元测试\n\n可以使用各种工具和框架来自动化单元测试过程。使用此类工具通常比运行一次测试需要多花一点精力。然而，主要的优势在于，只需点击按钮即可根据需要频繁地重新运行测试。\n\
    \n这对于“回归测试”是一个极大的帮助，每当修改之前测试过的代码时，都必须进行回归测试。\n\n回归测试在敏捷方法提出很久以前就已经存在，自动化单元测试支持了这一点。然而，自动化单元测试也支持测试驱动开发（TDD）流程，它们在敏捷软件开发方法中起着重要作用。\n\
    \n我们将在本章探索测试驱动开发流程，但在之前，我们将首先探索传统的回归测试，以及通过 Java 中的测试框架 JUnit 提供的支持。\n\n## 10.7\
    \ 回归测试\n\n当软件为了适应不断变化的业务需求而调整时，就需要回归测试。通过运行回归测试，我们希望代码的更改不会“破坏”现有功能。为了在编写类时实现这一点，我们必须编写测试这些类是否正常工作的测试。因此，我们遵循以下流程……\n\
    \n- 编写类\n- 编写测试\n- 运行测试，必要时进行调试\n- 编写更多类\n- ...\n\n当我们认为由于错误、用户需求更改或重构需要更改之前的类（或它们依赖的类）时，我们需要重新运行之前测试以检查它们是否仍然通过。如果没有回归测试，对现有代码的任何修改都是极其危险的！\n\
    \n由于我们需要经常运行一组测试用例，拥有像 Java 中现有的自动化测试非常有帮助且极其节省时间。\n\n## 10.8 JUnit\n\nJUnit 是一个非常广泛使用的\
    \ Java 单元测试框架。它被开发为一组开源类，并集成到 Eclipse 和 NetBeans 等流行的 Java IDE 中。\n\n虽然 JUnit\
    \ 提供了一个自动化测试框架，但我们仍然需要设置测试用例——然而一旦设置好，点击按钮即可运行数千个测试用例，并且在每次修改程序时都可以重新运行相同的测试用例。\n\
    \nJUnit 测试类被构造为 `junit.framework.TestCase` 的子类。\n\n被测试代码的正确行为通过 `assert..()` 方法进行检查，这些方法必须为真，测试才能通过。\n\
    \n目前 JUnit 3.8 版本和 4 版本被广泛使用，但它们之间存在显著差异。这里我们使用的是更广泛建立的 JUnit 3.8。\n\n## 10.9\
    \ 断言示例\n\n在设置测试用例时，我们会进行断言。断言是一个如果代码功能上是正确的则应该为真的语句。断言的示例包括……\n\n- `assertTrue(...)`\n\
    - `assertFalse(...)`\n- `assertEquals(...)`\n- `assertNotEquals(...)`\n- `assertNull(...)`\n\
    - `assertNotNull(...)`\n- `fail()`\n\n正如我们在这里看到的，`assertEquals()` 和 `fail()` 对于许多测试目的都是够的。\n\
    \n`fail()` 表示到达这一行意味着测试失败了！（我们将看到一个示例）。\n\n## 10.10 若干测试示例\n\n为了说明 JUnit 测试框架，我们将创建三个测试用例来测试如下所示的\
    \ BankManagement 系统的功能：\n\n### BankManager\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_160_0.png)\n\
    \n在该系统中，`BankManager` 类维护一个客户的“映射（map）”。可以通过 `addClient` 方法添加客户对象，该方法需要客户 ID 和要添加的客户对象。可以通过\
    \ `getClient` 方法检索客户，该方法需要一个 `ClientID` 作为参数并返回客户对象（如果存在）或抛出异常（如果不存在指定 ID 的客户）。\n\
    \n`Client` 类有一个构造函数，需要客户名称和客户地址，并提供相关的访问器方法。\n\n我们将专门地测试以下能力：\n\n- 向 `BookofClients`\
    \ 添加一个客户\n- 尝试查找不存在的客户\n- `Client` 类通过 `toString()` 方法生成的字符串表示。\n\n当然，这只是为了彻底演示系统内所有类和所有方法的正确运行所需要的全部测试用例中的极一小部分。\n\
    \n### 测试添加客户\n\n为了测试是否可以添加客户，我们需要创建一个 JUnit 测试用例，其执行步骤如下：\n\n1) 创建一个新的空的 `BookofClients`\n\
    2) 创建一个新的客户并将其添加到 `BookofClients` 中\n3) 尝试检索与刚刚添加的客户相同 ID 的客户（这显然应该是通的），并最后\n\
    4) 我们需要测试检索到的客户是否具有我们刚刚添加的客户相同的属性——确保它没有被损坏。\n\n该代码如下所示……\n\n```\npublic void\
    \ testAddClient() {\n    BookOfClients bofc = new BookOfClients();\n    Client\
    \ c = new Client(\"Simon\",\n        \"No 5, Main St., Sunderland, SR1 0DD\");\n\
    \    Client c2 = null;\n    bofc.addClient(\"SK001\", c);\n    try {\n       \
    \ c2 = bofc.getClient(\"SK001\");\n    } catch (UnknownClientException uce) {\n\
    \        fail();\n    }\n    assertEquals(\"Simon\", c2.getName());\n    assertEquals(\"\
    No 5, Main St., Sunderland, SR1 0DD\", c2.getAddress());\n}\n```\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_160_0.png)\n\
    \n## 敏捷编程\n\n如果我们预期会抛出 `UnknownClient`，那么如果我们成功检索了客户，断言 `getName()` 的值应等于“Simon”，且\
    \ `getAddress()` 的值应等于“No 5, Main St., Sunderland, SR1 0DD”。如果任何一个不符合，测试将失败。\n\
    \n注意，为了使此测试工作，我们需要访问方法。在设计类时，创建访问方法是常见的做法。\n\n### 测试未知客户\n\n我们需要执行的一个用例是测试当尝试检索不存在的客户时是否抛出异常。为了测试这一点，我们创建一个\
    \ `BookofClients` 并检索它！\n\n```java\npublic void testUnknownClient() {\n  BookOfClients\
    \ bofc = new BookOfClients();\n  try {\n    bofc.getClient(\"SK001\");\n    fail();\n\
    \  } catch (UnknownClientException uce) {\n  }\n}\n```\n\n如果到达 `getClient()` 调用之后的行，则测试失败。如果捕获了异常，catch\
    \ 块没有任何操作，测试成功完成。\n\n### 测试 toString() 方法\n\n间接测试客户的所有属性是否存储正确的一种方法是测试 `toString()`\
    \ 方法返回的值是否符合预期。这有点困难，因为字符串的格式必须精确匹配，包括每个空格、标点符号和换行符。\n\n| 活动 1 |\n| :--- |\n|\
    \ 假设 `Client` 类的 `toString()` 方法定义如下，创建一个测试方法来测试 `toString()` 方法返回的值是否符合预期。<br><br>\
    \ `public String toString() {<br> return \"Client name: \" + mName + \"\\nAddress:\
    \ \" + mAddress;<br>` <br><br> 提示：首先创建一个指定属性的 `Client` 对象，然后通过断言测试 `toString()`\
    \ 方法返回的字符串的属性是否符合预期。 |\n\n我们断言 `toString()` 返回的字符串等于我们预期的字符串。这相当困难，因为字符串的格式必须精确匹配，包括每个空格、标点符号和换行符。\n\
    \n另一种方法是测试每个访问方法返回的值。\n\n## 10.11 运行测试\n\n在设计了一批测试用例后，我们需要设置它们以便在点击按钮时根据需要频繁运行。\n\
    \n在 Eclipse 中执行此操作：\n\n- 创建新包 \"tests\"\n- 在 \"tests\" 包中创建一个新的 JUnit 测试用例 \"\
    ClientTests\"\n- 添加上述三个测试方法\n- 运行方式 (Run As)... JUnit test\n- 修改代码导致其中一个测试失败并观察结果\n\
    \n"
