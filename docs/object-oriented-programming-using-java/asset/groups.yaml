    # Object Oriented programming using Java


    ’Manager’ is the main class that manages the system. It performs the following
    functions :-


    +   - it has a permanent reference to the client book and message set.

    - it sets up the data file

    - it defines what happens when the system starts and

    - it defines what happens when the system shuts down

    - finally it has getClientBook() and getMessageSet() methods so the other parts
    of the system can access the clientbook and message set.


    The startup() method is shown below :-


    The startup() method tries to setup an Object Input stream from which it tries
    to reconstruct ClientBook and MessageSet objects.


    It has two catch blocks. The first will catch a FileNotFoundException – this will
    occur if the file of data cannot be found e. the first time this program is. In
    such a case the system will create a new and empty ClientBook object and a new
    MessageSet object.


    The second catch block will catch any other IO error and in this case then will
    exit the program.


    # 11.12 Programming the Interface


    The other driver is GUIMain. This has a main() method which invokes the createGUI()
    method. This creates three JPanels and adds buttons, text labels and to label
    these according to the preliminary design. A Grid layout manager was applied to
    manage these JPanels (as described in section 10 of chapter 8).'
