    \ `SaleableItem` 接口。\n\n“球和插座”法不在 UML 2 中 —— 它是表示接口如何连接类的一个很好的视觉效果。\n\n# 使用 Java\
    \ 进行面向对象编程\n\n# 统一建模语言 (UML)\n\n我们将在第 4 章中更详细介绍接口的应用。\n\n# 关键字\n\nUML 定义了关键字来完善图形符号的含义\n\
    我们已经见过 `<<interface>>`，也会使用 `<<abstract>>`，但还有许多其他的。\n\n抽象类也可以通过将其名称以*斜体*来表示，尽管这对于普通读者来说可能不太直观。\n\
