    \ 运算符可以做到：\n`instanceof class`\n\n如果对象属于指定的类（或其子类），则测试结果为 true，否则为 false。\n\n\
    注意，`(myDiscMag instanceof Magazine)` 将为 TRUE，因为 `DiscMag` 是一个 `Magazine`。\n\n\
    # 使用 Java 进行面向对象编程\n\n`instanceof` 右侧也可以跟接接口名称，在这种情况下，它会测试类是否实现了该接口。\n\n严格来说，`instanceof`\
    \ 是测试左侧的项目是否为右侧指定的类型或该类型的子类型。通过这样做，我们可以扩展 `CashTill` 类，根据售出的对象显示特定的消息。\n\n```java\n\
    public void saleType (SaleableItem pSelb) {\n    if (pSelb instanceof Publication)\
    \ {\n        System.out.println(\"This is a Publication\");\n    } else if (pSelb\
