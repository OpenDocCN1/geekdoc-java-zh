    # Activity 1


    To purge the messages, the MessageBook cycles through its list of messages reducing
    the credit for the client who ''owns'' this message, decrementing the days remaining
    for that message and deleting messages when appropriate.


    Looking at the CRC cards above work through the following steps and identify any
    potential problems with these classes :-


