    Object Oriented Programming using Java


    Collection interfaces include List, Set and Map, each defining appropriate operations.


    Collection implementations include ArrayList, HashSet and HashMap which are implementations
    of the List, Set and Map interfaces respectively.


    Special attention is required when defining objects to be stored in Sets (or keys
    in Maps) to define the meaning of ‘duplicate’. For we need to override the methods
    equals() and hashCode() methods inherited from Object.


    While we have not been able to provide a detailed discussion of collection in
    this chapter the case study, in Chapter 11, will demonstrate the use of Maps and
    Sets for storing our own objects (not just Strings). The code for this will be
    available to download and inspect if required.


