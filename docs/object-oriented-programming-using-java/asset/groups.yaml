    # 10.1 敏捷方法


    传统的开发方法强调详细的预先规划和软件生命周期的线性推进。后写代码，一次性做对（真的吗？）。


    最近的“敏捷”开发方法强调灵活的循环开发，使系统向解决方案演进。尽早编写代码，边做边修复和改进。


    # 使用 Java 进行面向对象编程


    这是目前软件工程领域一个非常热门的话题，随着所有这些发展，它也有自己的狂热分子和意识形态！


    瀑布型生命周期模型在让大型、复杂项目从头到尾且不回头方面非常成功。敏捷方法的倡导者认为，这些方法更符合软件开发的现实。


    足够的敏捷编程需要能够让软件改变和演变的工具。现代 IDE 提供的支持敏捷编程的两个特定工具是重构和测试工具。


    # 10.2 重构


    “敏捷”方法的关键元素是“重构”。这种技术接受某些早期设计和实现决定将被证明是糟糕的，或者至少是不够理想的。


    重构意味着改变系统以提高设计和实现质量，而不改变其功能（在传统开发中，这种工作被称为“预防性维护”）。


    虽然从结构上改进现有软件的想法并不新鲜，但区别如下：在传统开发中，它被视为在软件设计质量下降时采取的补救措施，通常是功能修改和扩展阶段的结果。在敏捷方法论中，重构被视为开发过程中自然且健康的一部分。


    # 10.3 重构示例


    在开发过程中，程序员可能会意识到程序中的某个变量命名得很糟糕。然而，更改它并不是一项简单的任务。


    更改局部变量只需要修改一个特定的方法——如果另一个方法中存在同名变量，则不需要更改。


    或者，更改一个公共类变量可能需要整个系统的更改（这也是为什么不鼓励使用公共变量的原因之一）。


    因此，实施一个看似简单的更改需要对该更改的后果有理解。


    可能还需要其他复杂的更改。这些包括..


    - 在标识符出现的所有地方重命名

    - 将方法从一个类移动到另一个类

    - 将代码从一个方法拆分到另一个独立的方法中


    # 使用 Java 进行面向对象编程


    # 敏捷编程


    - 更改方法的参数列表

    - 在继承层次结构中重新排列类成员的位置


    # 10.4 重构的支持


    即使是最简单的重构操作，例如重命名类、方法或变量，也需要仔细的分析，以确保所有必要的更改都一致地完成。


    Eclipse 为此项活动提供了复杂的自动支持。


    不要将其与这种简单的文本编辑器/替换搞混——Eclipse 理解 Java 语法并以智能方式工作...例如，如果你在两个不同的方法中具有同名的局部变量并重命名了其中一个，Eclipse
    知道另一个是不同的变量并且不会更改它。如果你重命名一个公共实例变量，这可能需要其他类甚至其他包中的更改。


    在包内重新排列现有的类也是一种重构活动。


