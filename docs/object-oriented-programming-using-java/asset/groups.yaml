    By making use of the Java exception mechanism we are protecting against potentially
    life-threatening program failure.


    The exception mechanism will ensure other programmers who use our methods recognise
    and deal with error situations.


    When exceptions are generated the code in a catch block will be initiated – this
    code could take remedial action or terminate the program generating an appropriate
    error message. In either case at least the program doesn''t just ''stop''.


