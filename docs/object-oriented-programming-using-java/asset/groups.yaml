    \n因此，在这个应用程序中，我们只需添加一个类并对界面进行一处微小的更改，即可扩展系统添加紧急消息的功能。\n\n如果没有应用多态，我们必须对系统的其他部分进行额外的更改——即\
    \ `MessageSet` 和 `DummyBoard`。\n\n面向对象使系统能够以最小的努力进行扩展！\n\n## 11.7 类的打包\n\n大型程序应该分段成包，因为这提供了适当的封装和访问控制（如第\
    \ 2 节所示）。\n\n此处用于演示教科书中理论的系统几乎算不上大型——尽管如此，我们决定将相关类打包在一起。\n\n## 11.8 类的编程\n\n`Message`、`UrgentMessage`\
    \ 和 `MessageSet` 的编程相对简单。\n\n`Message` 拥有实例变量（字符串：`clientID`、`text` 和整数：`daysRemaining`）。它具有以下方法：\n\
    \n```\ndecrementDays()\nhasExpired()\ngetClient()\ngetCost()\ngetText()\n```\n\
    \n图显示了包之间的关联。不意外的是，管理系统的主类与其他所有类都有关联。在完成设计并适应需求的变化后，我们可以开始实现系统。这将分为两个阶段：\n\n1.\
    \ 实现 `Message` 类。\n2. 实现 `UrgentMessage` 和 `MessageSet` 类。\n\n主类需要将 `Client` 和\
    \ `MessageSet` 对象存储到文件中。为了实现这一点，所有 `Client` 和 `Message` 对象都需要实现 `Serializable`。\n\
    \n最后规定“允许重复的消息（即同一客户的相同文本）”。因此，`Message` 必须重写 `equals()` 和 `hashCode()` 方法，以确保在\
    \ Set 中不会允许重复。\n\n该类的完整代码如下——为了简洁起见删除了注释。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_190_png)\n\
    \n## Case Study\n\n```java\npackage messages;\nimport java.io.Serializable;\n\n\
    public class Message implements Serializable {\n    final final int COST=1;\n\n\
    \    private String clientID;\n    private String messageText;\n    private int\
