- md: "\n## 11.6 Revising the Design to Accommodate Changing Requirements\n\nChanging\
    \ software requirements are a fact of life and OO programming is intended to help\
    \ software engineers make adaptations easier, quicker, cheaper and with less risk\
    \ of generating errors. The principles of inheritance, method overriding and polymorphism\
    \ are essential OO features that help in this manner.\n\nIn this project we get\
    \ feedback from the shop owner on the prototype interface; they comment that they\
    \ generally like the interface but that they have an additional system requirement\
    \ :-\n\n- Some messages are 'urgent messages'. These should be highlighted on\
    \ the display by placing three stars before and after the message and the cost\
    \ of these messages will be twice that of ordinary messages. Other than urgent\
    \ messages are just like ordinary messages.\n\nModifying the interface design\
    \ to accommodate this change is easy – we can either :-\n\n- create a new panel\
    \ to accommodate the creation of 'Urgent Messages' or\n- since the data required\
    \ is identical to normal messages we can just add an extra button to the middle\
    \ panel.\n\nBut how will these extra requirements impact on the underlying classes\
    \ within the system?\n\nIf OO principles work, implementing this additional requirement\
    \ should be relatively simple. Firstly there is clearly a strong relationship\
    \ between a 'Message' and an 'Urgent Message'.\n\nIf both classes have some unique\
    \ features but there was a significant overlap in functionality we could introduce\
    \ an inheritance hierarchy to deal with this :-\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_185_0.png)\n\
    \nHowever in this case there are no unique features of an ordinary message – messages\
    \ have an associated cost, the cost and text can be obtained and new messages\
    \ can be created. All this is true for urgent messages. An urgent message is just\
    \ the same as an ordinary message where the text and the cost have been changed\
    \ slightly. Thus UrgentMessage is a type of Message and can inherit ALL of the\
    \ features of Message with the cost and text methods being overridden.\n\nThus\
    \ the Message and UrgentMessage classes are related as shown below, with UrgentMessage\
    \ inheriting all of the values and methods associated with Message but overriding\
    \ getCost() and getText() methods to reflect the different cost and text associated\
    \ with urgent messages.\n\n| Message | UrgentMessage |\n| :--- | :--- |\n| clientID\
    \ | cost |\n| text | getText() |\n| daysRemaining | getCost() |\n| cost | |\n\
    | decrementDays() | |\n| getText() | |\n| hasExpired() | |\n| getCost() | |\n\n\
    A revised class diagram is below. But how will this change impact upon other parts\
    \ of the system?\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_187_0.png)\n\nThanks\
    \ to the operation of polymorphism, this change will have no impact at all on\
    \ any other part of the system!\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_187_1.png)\n\
    \n## Where it's @\n\n**Student and Graduate opportunities in IT, Internet & Engineering\
    \ Cheltenham | Competitive + benefits**\n\nPart of the UK's intelligence services,\
    \ our role is to counter threats that compromise national and global security.\
    \ We work in one of the most diverse, creative and technically challenging IT\
    \ cultures. Throw in that continuous professional development, and you get truly\
    \ interesting work, in a genuinely inspirational business.\n\nTo find out more\
    \ visit **www.careersinbritishintelligence.co.uk**\n\nApplicants must be British\
    \ citizens. GCHQ values diversity and welcomes applicants from all sections of\
    \ the community. We want our workforce to reflect the diversity of our work.\n\
    \n## Object Oriented Programming using Java\n\nLooking at the class diagram above\
    \ we can see that MessageSet keeps and manages a set of Messages (DummyBoard also\
    \ - once they have been uploaded for display). But what about UrgentMessages?\n\
    \nUrgent messages are just a specific type of message. When the addMessage() method\
    \ is invoked within MessageSet it requires an object of type Message i.e. a message\
    \ to be added but an object of the subtype UrgentMessage is still a 'Message'\
    \ so the addMessage() method would accept an UrgentMessage object.\n\nTherefore,\
    \ without making any changes at all to MessageSet, MessageSet can maintain a set\
    \ of all messages to be displayed (both urgent and ordinary!).\n\nFurthermore\
    \ when the dailyPurge() method is invoked it invokes the getCost() method on a\
    \ Message object so that the class can be charged for. At run time the JVM determines\
    \ whether the object is of type Message or type UrgentMessage and it will invoke\
    \ the correct version of the getCost() method - remember this is overridden in\
    \ UrgentMessage. This is polymorphism in action!\n\nMessageSet requires messages\
    \ but, thanks to the application of polymorphism and method overriding, MessageSet\
    \ will happily deal with any Message subtype as though it were a Message object.\
    \ If we later decided to create new message types (such as a Christmas message)\
    \ MessageSet would be able to deal with these well without changing a single line\
    \ of code!\n\nThus in this application we are able to extend the system to add\
    \ the facility for urgent messages by adding only one class and making one small\
    \ change to the interface.\n\nWithout the application of polymorphism we would\
    \ need to have made additional changes to other parts of the system - namely MessageSet\
    \ and DummyBoard.\n\nObject Orientation has enabled the system to be extended\
    \ with minimal effort!\n\n## 11.7 Packaging the Classes\n\nLarge programs should\
    \ be segmented into packages as this provides an appropriate level of encapsulation\
    \ and access control (as described in Chapter 2).\n\nThe system being used here\
    \ to demonstrate the theory in this textbook hardly qualifies as large -nonetheless\
    \ it has been decided to package related classes together as shown.\n\n## 11.8\
    \ Programming the Classes\n\nMessage, UrgentMessage and MessageSet are relatively\
    \ straightforward to program.\n\nMessage has instance variables (Strings: clientID,\
    \ text and int: daysRemaining). It has the following methods:\n\n```\ndecrementDays()\n\
    hasExpired()\ngetClient()\ngetCost()\ngetText()\n```\n\nThe diagram shows associations\
    \ between the packages. Not surprisingly the main class, which houses the system,\
    \ is associated with all the others. Having completed the design and accommodated\
    \ changing requirements, we can start implementing the system. This will be done\
    \ in two phases:\n\n1. Implement the Message class.\n2. Implement the UrgentMessage\
    \ and and MessageSet classes.\n\nThe manager class will need to store the Client\
    \ and MessageSet objects to a file. To do this all Client and Message objects\
    \ will also need to implement Serializable.\n\nFinally the requirements state\
    \ that “No duplicate messages (i.e. the same text for the same client) are permitted.”\
    \ Therefore Message must override the equals() and hashCode() methods to ensure\
    \ that duplicates will not be permitted when the messages are stored in a Set.\n\
    \nThe complete code for this class is given below – comments have been excluded\
