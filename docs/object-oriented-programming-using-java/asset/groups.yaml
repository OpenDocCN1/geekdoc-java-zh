    # Introduction


    If the reader has written Java programs that make use of the file handling facilities
    they will have written code to catch exceptions i.e. they will have used try/catch
    blocks. This chapter explains the importance of creating your own exceptions and
    shows how to do this by extending the Exception Class and using the ‘Throw mechanism.


    # Objectives


    By the end of this chapter you will be able to....


    +   - Appreciate the importance of exceptions

    - Understand how to create your own exceptions and

    - Understand how to throw these exceptions.


    This chapter consists of six sections :-


    +   1) Understanding the Importance of Exceptions

    2) Kinds of Exception

    3) Extending the Exception Class

    4) Throwing Exceptions

    5) Catching Exceptions

    6) Summary


    # 9.1 Understanding the Importance of Exceptions


    Exception handling is a critical part of writing Java programs. The authors of
    the file handling classes within the Java language knew this and created routines
