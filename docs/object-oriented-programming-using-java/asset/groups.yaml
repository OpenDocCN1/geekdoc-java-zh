    # 10.12 Test Driven Development (TDD)


    Automated unit testing also supports Test Driven Development (TDD) which is a
    technique mainly associated with ''agile'' development processes. This has become
    a hot topic in software engineering


    The Test Driven Development approach is to


    +   1) Write the tests (before writing the methods tested).

    2) Set up automated unit testing, which fails because the classes haven''t yet
    been written!

    3) Write the classes and methods so the tests pass


    This reversal seems strange at first, but many eminent contributors to software
    engineering debates believe it is a powerful ''paradigm shift''


    The task of teaching can be used as an analogy. Which of the following is simpler?


    +   * Teach student everything you know about a subject and then decide how to
    test their knowledge or

    * Decide specifically what it is they need to learn (i.e. decide what to test)
    and then teach the person just what they need to know in order to pass that test.


    # 10.13 TDD Cycles


    When undertaking test development the test will initially cause a compilation
    error as the method being tested doesn''t exist!


    Creating a stub method enables the test to compile but it test itself will fail
    because the actual functionality being tested has not been implemented in the
    method.


    We then implement the correct functionality of the method so that the test succeeds.


    For a complex method we may have several cycles of: write test, fail, implement
    functionality, pass, extend test, extend functionality, pass... to build up the
    solution.


    # 10.14 Claims for TDD


    Among the advantages claimed for TDD are:


    +   * testing becomes an intrinsic part of development rather than an often hurried
    afterwards.

    * it encourages programmers to write simple code directly addressing the requirements'
