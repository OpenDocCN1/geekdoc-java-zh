    ## 6.2 The Problem


    The problem for which we will design a solution is ‘To develop a small management
    system for an athletic club organising a marathon.’


    For the purpose of this exercise we will assume preliminary requirements analysis
    has been performed by interviewing the club managers, and the workers who would
    use the system, the following textual description has been generated.


    > ‘GetFit’ Athletic Club are organize their first international marathon in the
    spring of next year. A field comprising both world-ranking professionals and charity
    fundraising amateurs (some in fancy dress!) will compete on the 26.2 mile route
    around an attractive coastal location. As part of the software system which will
    track runners and announce the results and sponsorship donations, a model is required
    which represents the key characteristics of the runners (this will be just part
    of the finished system).


    Each runner in the marathon has a number. A runner is described as e.g. “Runner
    42” where 42 is their number. They finish the race at a specified time recorded
    in hours, minutes and seconds. Their result status can be checked and will be
    displayed as either “Not finished” or “Finished in h:mm:ss”.


    Every competitor is either a professional runner or an amateur runner.


    Further to the above, a professional additionally has a world ranking and is described
    as e.g. “Runner 174 (Ranking 17)”.


    All amateurs are fundraising for a charity so each additionally has a sponsorship
    form. When an amateur finishes the race they print a collection list from their
    sponsorship form.


    A sponsorship form has the number of sponsors, a list of sponsors, and a list
    of amounts sponsored. A sponsor and amount can be added, and a list can be printed
    showing the sponsors and sponsorship amounts and the total raised.


    A fancy dress runner is a kind of amateur (with sponsorship etc.) who also has
    a costume, and is described as e.g. “Runner 316 (Yellow Duck)”.


    ## 6.3 Listing Nouns and Verbs


    The first step in analysing the description above is to identify the nouns and
    verbs:-


    - The nouns indicate entities, or objects, some of these will appear as classes
    in the final system and will appear as attributes.

    - The verbs indicate actions to be performed some of these will appear in the
    final system as methods.


    Nouns and verbs that are pluralized in their singular form (e.g. ''books'' becomes
    ''book'') and noun and verb phrases are used where the nouns/verb alone are not
