  - '[PAGE 50]


    This chapter consists of twelve sections :-


    +   1) Object Families

    2) Generalisation and Specialisation

    3) Inheritance

    4) Implementing Inheritance in Java

    5) Constructors

    6) Constructor Rules

    7) Access Control

    8) Abstract Classes

    9) Overriding Methods

    10) The ‘Object’ Class

    11) Overriding toString() defined in ‘Object''

    12) Summary


    # 3.1 Object Families


    Many kinds of things in the world fall into related groups of ‘families’. ‘Inheritance’
    is the idea ‘passing down’ characteristics from parent to child, and plays an
    important part in Object Oriented design and programming.


    While we are probably already familiar with constructors and access control (public/private),
    and there are particular issues relating to these inheritance.


    Additionally we need to consider the use of Abstract classes and method overriding
    as these are important concepts in the context of inheritance.


    Finally we will look at the ‘Object’ class which has a special role in relation
    to all other classes in Java.


    # 3.2 Generalisation and Specialisation


    Classes are a generalized form from which objects with differing details can be
    created. Objects are then ‘instances’ of their class. For example Student 051234567
    is an instance of class Student. More concisely, 051234567 is a Student.


    Classes themselves can often be organised by a similar kind of relationship.


    One hierarchy, that we all have some familiarity with, is that which describes
    the animal kingdom :-


    +   - Kingdom (e.g. animals)

    - Phylum (e.g. vertebrates)

    - Class (e.g. mammal)

    - Order (e.g. carnivore)

    - Family (e.g. cat)'
  - '[PAGE 51]


    # Object Oriented Programming using Java


    +   - Genus (e.g. felix)

    - Species (e.g. felix leo)


    We can represent this hierarchy graphically ....


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_51_0.png)


    Of course to draw the complete diagram would take more time and space than we
    have available.


    Here we can see one specific animal shown here :-''Fred''. Fred is not a class
    of animal but an actual animal.


    Fred is a felix leo is a felix a cat is a carnivore


    Carnivores eat meat so Fred has the characteristic ''eats meat''.


    Fred is a felix leo is a felix a cat is a carnivore is a mammal is a vertebrate


    Vertebrates have a backbone so Fred has the characteristic ''has a backbone''.


    The ''is a'' relationship links an individual to a hierarchy of characteristics.
    This sort of relationship applies to many real world entities, e.g. BonusSuperSaver
    is a SavingsAccount is a BankAccount.'
  - '[PAGE 52]


    # 3.3 Inheritance


    We specify the general characteristics high up in the hierarchy and more specific
    characteristics lower down. An important principle in OO - we call this generalization
    and specialization.


    All the characteristics from classes above a class/object in the hierarchy are
    automatically featured in it - we call this inheritance.


    Consider books and magazines - both specific types of publication.


    We can show classes to represent these on a UML class diagram. In doing so we
    can see some of the instance variables and methods these classes may have.


    | Book | Magazine |

    | --- | --- |

    | title | title |

    | author | price |

    | price | orderQty |

    | copies | currIssue |

    | | copies |

    | sellCopy() | sellCopy() |

    | orderCopies() | adjustQty() |

    | | recvNewIssue() |


    Attributes ''title'', ''author'' and ''price'' are obvious. Less obvious is ''copies''
    this is how many are currently in stock.


    For books, orderCopies() takes a parameter specifying how many copies are added
    to stock.


    For magazines, orderQty is the number of copies received of each new issue and
    currIssue is the date/period of the current issue (e.g. "January 2009", "Fri 6
    Jan", "Spring 2009") When a newIssue is received the old is discarded and orderQty
    copies are placed in stock. Therefore recvNewIssue sets currIssue to date of new
    issue and restores copies to orderQty. adjustQty modifies orderQty to alter how
    many copies of subsequent issues will be stocked.


