    \n查看上面的类图，我们可以看到 `MessageSet` 保留并管理一组 `Messages`（`DummyBoard` 也是——一旦它们被上传用于显示）。但\
    \ `UrgentMessages` 呢？\n\n紧急消息只是消息的一种特定。当在 `MessageSet` 中调用 `addMessage()` 方法时，它需要一个\
    \ `Message` 类型的对象（即要添加的消息），但子类型对象 `UrgentMessage` 仍然是一个 `Message`，因此 `addMessage()`\
    \ 方法会接受 `UrgentMessage` 对象。\n\n因此，无需对 `MessageSet` 进行任何更改，`MessageSet` 就可以维护一组要显示的所有消息（包括紧急和普通！）。\n\
    \n此外，当调用 `dailyPurge()` 方法时，它会调用 `Message` 对象的 `getCost()` 方法以便对类收费。在运行时，JVM 决定对象是\
