    赞助表包含赞助者数量、赞助者列表以及赞助金额列表。可以添加赞助者和金额，并打印显示赞助者、赞助金额和总筹款的列表。


    奇装跑步者是业余爱好者的一种（带有赞助等），他们还有一套服装，被描述为例如“316号选手（黄鸭子）”。


    ## 6.3 列出名词和动词


