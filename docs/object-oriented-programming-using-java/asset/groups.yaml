    # Object Oriented Programming using Java


    # Object Roles and the Importance of Polymorphism


    If you were asked to give someone a pig you could give Pinky or any other pig.
    If you were asked to give someone a mammal you could give Pinky, any other pig
    or any other mammal (e.g. any lion, or any mouse, or any human being!). If you
    were asked to give someone an animal you could give them Pinky, any other mammal
    or any other animal (bird, fish, insect ect).


    The idea here that an object in a classification hierarchy has an ‘is a’ relationship
    with every class from which it is descended and each classification represents
    a type of animal.


    This is true in object oriented programs as Every time we define a class we create
    a new ‘type’. Types determine compatibility between variables, parameters etc.


    A subclass is a subtype of the superclass type and we can substitute subtype wherever
    a ‘supertype’ is expected. Following this we can substitute objects of a subtype
    whenever objects of a supertype are required (as in the example above).


    The class diagram below shows a hierarchical relationship of types of –


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_70_0.png)


    +   - If we want ‘a DiscMag’, it must be an object of class DiscMag.

    - If we want ‘a Magazine’, it could be an object of class Magazine or an object
    of class DiscMag

    - If we want ‘a Publication’ it could be a Book, Magazine or DiscMag.


    In other words we can ‘substitute’ an object of any subclass where an object of
    a superclass is required. This is NOT true in reverse!


