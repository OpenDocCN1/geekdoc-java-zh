    # Object Oriented Programming using Java


    # Java Development Tools


    A version of the Java Runtime Environment (JRE), which incorporates a virtual
    machine (VM), is required to execute bytecode and the Java library. Thus a JRE
    must be present on any machine which is to run Java programs.


    Java bytecode is standard and platform independent as JRE''s have been created
    for most computing devices (including PC, laptops, mobile devices which makes
    Java programs highly portable.


    ## 8.3 Java Programs


    Whatever order of execution is employed, programmers can work with a variety of
    tools to create source code. Options include the use of discrete tools (e.g. editor,
    compiler, interpreter) invoked manually or alternatively the use of Integrated
    Development Environment (IDE) which integrates these tools with seamless interface.
    Still more sophisticated CASE (Computer Aided Software Engineering) tools could
    take UML diagrams and generate classes and stubs automatically saving some of
    the effort to write Java code.


    When writing java programs each class (or interface) in a Java program has its
    own .java file containing the source code.


    These are processed by the compiler to produce .class files containing the corresponding
    bytecode.


    To actually run as an application, one of the classes must contain a main() method
    with the signature shown above:


    One class must contain a ''startup'' method

    static void main (String[] args)


