    \n为了允许这一点，可以对 `enrollStudent()` 方法进行重载，并提供替代方法：\n\n```java\nenrollStudent(String\
    \ pName, String pCoursecode)\n```\n\n在运行时，JRE 可以根据参数列表确定调用哪个方法。给定一个调用：\n\n```java\n\
    enrollStudent(\"Fred\", \"123 Abbey Gardens\", \"G700\")\n```\n\nJRE 将使用第一个方法。\n\
