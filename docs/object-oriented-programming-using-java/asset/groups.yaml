  mdcn: "\n\n## 11.6 修改设计以适应变化的需求\n\n软件需求的变化是生活的常态，而面向对象（OO）编程旨在帮助软件工程师更容易、更快速、更廉价且风险更小地进行调整。继承、方法重写和多态原理是帮助实现此点的重要面向对象特性。\n\
    \n在这个项目中，我们从店主那里获得了对原型界面的反馈；他们表示他们喜欢这个界面，但有一个额外的系统需求：\n\n- 部分消息是“紧急消息”。这些消息应该通过在消息前后三个星号在显示器上突出显示，这些消息的费用是普通消息的两倍。除了紧急消息外，其他的都和普通消息一样。\n\
    \n修改界面设计以适应这一变化很容易——我们可以：\n\n- 创建一个新面板来用于创建“紧急消息”，或\n- 既然所需数据与普通消息相同，我们只需要在中间面板添加一个额外按钮。\n\
    \n但这些额外需求将如何影响系统中的底层类呢？\n\n如果面向对象的原则有效，那么实现这个额外需求应该相对简单。首先，“消息”和“紧急消息”之间显然存在着强有联系。\n\
    \n如果这两个类都具有一些独特特征，但功能上有很大重叠，我们可以引入继承层次结构来处理这个问题：\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_185_0.png)\n\
    \n然而，在这种情况下，普通消息并没有独特特征——消息有关成本，可以获取成本和文本，并且可以创建新消息。这对于紧急消息同样适用。紧急消息与普通消息一样，只是文本和费用略有不同。因此，UrgentMessage\
    \ 是 Message 的一种类型，可以继承 Message 的**所有** 特性，并重写成本方法和文本方法。\n\n因此，Message 和 UrgentMessage\
    \ 类的关系如下所示，`UrgentMessage` 继承了与 `Message` 相关的所有值和方法，但重写了 `getCost()` 和 `getText()`\
    \ 方法以反映与紧急消息相关的成本和文本。\n\n| Message | UrgentMessage |\n| :--- | :--- |\n| clientID\
    \ | cost |\n| text | getText() |\n| daysRemaining | getCost() |\n| cost | |\n\
    | decrementDays() | |\n| getText() | |\n| hasExpired() | |\n| getCost() | |\n\n\
    下面是修改后的类图。但变化将对系统的其他部分产生什么影响？\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_187_0.png)\n\
    \n得益于多态机制，这种变化对系统的任何其他部分完全没有影响！\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_187_1.png)\n\
    \n## 招聘信息\n\n**切尔哈姆 IT、互联网与工程的学生及毕业生机会 | 竞争性薪酬 + 福**\n\n作为英国情报机构的一部分，我们的职责是应对危害国家和全球安全的威胁。我们在最具多样化、创造性和技术上最具挑战性的\
    \ IT 文化中工作。再加上持续的职业发展，你将在一个真正具有启发性的企业中获得非常有意义的工作。\n\n要了解更多信息，请访问 **www.careersinbritishintelligence.co.uk**\n\
