    # Object Oriented Programming using Java


    +   - implements gives a guarantee that the operations specified by an interface
    will be provided –n this is enough to allow polymorphic handling of all classes
    which implement a given interface


    # The Polymorphic CashTill


    The CashTill class already employs polymorphism: the sale method accepts a parameter
    of type

    Publication which allows any of its subclasses to be passed:


    ```

    public void sellItem (Publication pPub)

    ```


    We now want to broaden this further by accepting anything which implements the
    SaleableItem

    interface:


    ```

    public void sellItem (SaleableItem pSelb)

    ```


    When the type of a variable or parameter is defined as an interface, this works
    just like a superclass

    type. Any class which implements the interface is acceptable for assignment to
    the variable/parameter

    because the interface is a type and all classes implementing it are subtypes of
    type.


    This is now shown below....


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_85_0.png)


    CashTill is no longer directly dependent on class Publication – instead it is
    dependent on the interface

    SaleableItem.


    The relationships from Publication and Ticket to SaleableItem are like inheritance
    arrows except that

    the lines are dotted – this shows that each class implements the interface.


