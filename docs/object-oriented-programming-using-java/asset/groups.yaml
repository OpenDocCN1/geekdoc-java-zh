    ## 前言


    本书旨在让读者理解面向对象的编程方法，并力求在此过程中培养一些实用技能。这些实用技能将通过引导读者完成的小型练习以及所提供的反馈来开发。


    书中将要解释和开发的概念在许多许多现代面向对象语言的程序员中是通用的，因此可以从一种语言迁移到另一种语言。然而，出于实际目的的考虑，本书将使用 Java 编程语言对这些概念进行探索和演示。


    虽然 Java 编程语言被用于突出和演示基础面向对象原则及建模技术的应用，但本书并非 Java 编程的入门书籍。我们预计读者已经对基础编程概念及其在 Java
    中的实现有一定的理解（包括循环、选择语句、计算执行、数组、数据类型以及对文件处理的基本了解）。


    本文的设计并非理论性教科书，而是作为一种学习工具，旨在帮助理解理论概念并学习实现这些概念所需的实用技能。为此，每章将包含带有答案的小型练习，并提供反馈。


    在书的最后，将描述一个较大的案例研究——它将用于说明在前几章节中探索的技术的应用。该案例研究将最终促成一个 Java 程序的开发，该程序可以随本书下载。


    ## 1. 面向对象编程简介


    引言


    本章将讨论不同的编程范式，以及面向对象在软件开发和建模方面的优势。将解释面向对象所依赖的概念（抽象、封装、继承和多态）。


    ### 目标


    在本章结束时，你将能够……


    - 解释什么是面向对象编程

    - 描述面向对象编程方法的益处

    - 理解面向对象编程所依赖的抽象、封装、泛化和多态的基本概念


    这些问题将在本书后续章节中进行更详细的探讨。


    本章由六部分组成：


    - 1) 计算简史

    - 2) 不同的编程范式

    - 3) 为什么使用面向对象范式

    - 4) 面向对象原则

    - 5) 什么是面向对象编程？

    - 6) 面向对象编程方法的优势


    ## 1.1 计算简史


    计算不断着我们的世界和环境。20世纪60年代，创建了大型大型主机以有效地管理大量数据（数字）。银行账户和工资程序改变了组织的工作方式，并使这些组织的部分运作变得更加高效。20世纪80年代，个人电脑变得普及，改变了个人的工作方式。人们开始拥有自己的电脑，并使用文字处理器和电子表格应用程序（用于写信和管理家庭账目）。20世纪90年代，电子邮件变得常见，万维网诞生了。这些技术彻底改变了通信，允许个人发布全球范围内轻松访问的信息。这些新技术的影响尚未被完全理解，因为社会正在适应电子商务的机遇、新的社交网络技术（twitter、facebook、myspace、在线游戏等）以及互联网犯罪的挑战。


    ## 使用 Java 进行面向对象编程


    正如新的计算技术正在改变我们的世界一样，新的技术和思想也在改变我们开发计算机系统的方式。20世纪50年代，机器代码（不成熟、复杂且针对机器的）语言是常见的。


    20世纪60年代，使编程更简单的高级语言变得常见。然而，这导致了大型复杂程序的开发，且难以管理和维护。


    20世纪70年代，结构化编程范式成为大型复杂程序的接受标准。结构化编程范式提出了将开发的程序逻辑地结构为更小、更易管理的组件的方法。此外，分析数据允许创建高效的大型数据库，防止数据不必要的重复，并防止了与数据同步失效相关的风险。然而，在理解我们需要创建的系统以及根据用户需要更改现有软件方面，仍然存在着重大问题。


    20世纪80年代，“模块化”语言如 Modula-2 和 ADA 被开发，成为现代面向对象语言的前身。


    20世纪90年代，面向对象范式和基于的软件开发思想被提出，面向对象语言从2000年起成为主流。


    面向对象范式基于过去30年抽象、封装、泛化和多态的思想，并导致了软件组件的开发，将软件的操作的数据建模在一起。面向对象软件开发范式的支持者认为，这导致了可以在不同应用程序中重用的软件组件，节省了大量的开发时间和成本，更重要的是产生了更易维护、更易理解的软件。


    也许应该注意到，软件开发思想仍在演变，新的敏捷工作方法正在被提出和测试。这将在2020年及以后引导我们走向何方未知。


    ## 1.2 不同的编程范式


    结构化编程范式建议程序可以在逻辑块中开发，使程序更易理解且更易维护。


    ## 面向对象编程简介


    ## 活动 1


    假设你每天执行以下活动。请将此列表按逻辑排序，然后将列表分成三个相关的活动块，并为每个块提供一个标题以总结该块的活动。


    - 起床

    - 吃早餐

    - 停车

    - 穿衣服

    - 从车库里拿出汽车

    - 开班

    - 寻找老板让你做的事

    - 对今天的结果给出反馈

    - 执行老板让你要做


    ## 反馈 1


    你应该能够将这些活动分成相关的小组，并为每个小组提供一个总结这些活动的标题。


    - 起床：

    - 起床

    - 穿衣服

    - 吃早餐

    - 上班：

    - 从车库里拿出汽车

    - 开车上班

    - 停车

    - 工作：

    - 寻找老板让你做的事

    - 执行老板让你要做

    - 对今天的结果给出反馈


    通过对我们的指令进行结构化并考虑全天的整体结构（起床、上班、工作），我们可以在更改和改进指令的某部分而不影响其他部分。例如，我们可以改进上班的指令……


    - 听当地的交通和天气预报

    - 决定坐公交车还是开车

    - 如果开车，就开车上班。

    - 否则，步行到公交站并赶车


    而不必担心这对“起床”或“工作”产生任何潜在影响。


    '
