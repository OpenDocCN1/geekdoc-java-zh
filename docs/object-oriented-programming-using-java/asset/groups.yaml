    \ be replaced with pSelb.describeSelf(). Thus when we add new classes to the system\
    \ we would not need to change CashTill class.\n\n# 4.8 Summary\n\nPolymorphism\
    \ allows us to refer to objects according to a superclass rather than their actual\
    \ class.\n\nPolymorphism makes it easy to extend our programs by adding additional\
    \ classes without needing to change other classes.\n\nWe can manipulate objects\
    \ by invoking operations defined for the superclass without worrying about which\
    \ subclass is involved in any specific case.\n\nJava ensures that the appropriate\
    \ method for the actual class of the object is invoked at run-time.\n\nSometimes\
    \ we want to employ polymorphism without all the classes concerned having to be\
    \ in an inheritance hierarchy. The ‘interface’ construct allows us to provide\
    \ shared interfaces (i.e. collections of operations) in this situation. When doing\
    \ this there is no inherited implementation – each class must implement ALL the\
    \ operations defined by the Interface.\n\nAny number of classes can implement\
    \ a particular interface.\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_90_0.png)\n\
    \n# 5. Overloading\n\n# Introduction\n\nThis chapter will introduce the reader\
    \ to the concept of method overloading.\n\n# Objectives\n\nBy the end of this\
    \ chapter you will be able to....\n\n- Understand the concept of 'overloading'\n\
    - Appreciate the flexibility offered by overloading methods\n- Identify overloaded\
    \ methods in the online API documentation\n\nThis chapter consists of the following\
    \ three sections :-\n\n1) Overloading\n2) Overloading To Aid Flexibility\n3) Summary\n\
    \n# 5.1 Overloading\n\nHistorically in computer programs method names were required\
    \ to be unique. Thus the compiler identify[s] which method was being invoked by\
    \ looking at its name.\n\nSeveral methods were often required to perform very\
    \ similar functionality for example a method could add two integer numbers together\
    \ and another method could be to add two floating point numbers. If you have to\
    \ give these two methods unique names which one would call `add()`?\n\nIn order\
    \ to give each method a name the names would need to be longer and more specific.\
    \ We could therefore call one method addInt() and the other addFloat() but this\
    \ could lead to a proliferation of names each describing different methods that\
    \ are essentially performing the same operation ie. adding two numbers.\n\nTo\
    \ overcome this problem in Java you are not required to give each method a unique\
    \ name – thus both of the methods above could be called add().\n\n# Object Oriented\
    \ Programming using Java Overloading\n\nWhile the two methods may have the same\
    \ name they can still be distinguished by looking at the parameter list:\n\n```java\n\
    add(int number1, int number2)\nadd(float number1, float number2)\n```\n\nThis\
    \ is resolved at run time by the JRE. i.e. at run time JRE looks at the method\
    \ call and the actual parameters are being passed. If two integers are passed\
    \ then the first method is invoked. However if two floating point numbers are\
    \ passed then the second method is used.\n\nOverloading refers to the fact that\
    \ several methods may share the same name. Method names no longer uniquely identify\
    \ the method then the name is 'overloaded'.\n\n# 5.2 Overloading To Aid Flexibility\n\
    \nHaving several methods that essentially perform the operation but which take\
    \ different parameter lists, can lead to enhanced flexibility and robustness in\
    \ a system.\n\nImagine a University student management system. A method would\
    \ probably be required to enroll, register, a new student. Such method could have\
