    ## Foreword


    This book aims to instill the reader with an understanding of the Object Oriented
    approach to programming and aims to develop some practical skills along the way.
    These practical skills will be developed by small exercises that the reader will
    be invited to undertake and the feedback that will be provided.


    The concepts that will be explained and developed are in common among programmers
    using many modern object oriented languages and are thus transferable from one
    language to another. However for practical purposes these concepts are explored
    and demonstrated using the Java programming language.


    While the Java programming language is used to highlight and demonstrate the application
    of fundamental object oriented principles and modelling techniques this book is
    not an introduction to Java programming. The reader will be expected to have an
    understanding of basic programming concepts and their implementation in Java (inc.
    the use of loops, selection statements, performing calculations, arrays, data
    types and a basic understanding of file handling).


    This text is designed not as a theoretical textbook but as a learning tool to
    aid in understanding theoretical concepts and learning the practical skills required
    to implement these. To this end each chapter will incorporate small exercises
    with solutions and feedback provided.


    At the end of the book one larger case study will be described – this will be
    used to illustrate the application of the techniques explored in the earlier chapters.
    This case study will culminate in the development of a complete Java program that
    can be downloaded with this book.


    ## 1. An Introduction to Object Orientated Programming


    Introduction


    This chapter will discuss different programming paradigms and the advantages of
    the Object Oriented approach to software development and modelling. The concepts
    on which object orientation depends (abstraction, encapsulation, inheritance and
    polymorphism) will be explained.


    ### Objectives


    By the end of this chapter you will be able to....


    - Explain what Object Oriented Programming is,

    - Describe the benefits of the Object Oriented programming approach and

    - Understand the basic concepts of abstraction, encapsulation, generalisation
    and polymorphism on which object oriented programming relies.


    All of these issues will be explored in much more detail in later chapters of
    this book.


    This chapter consists of six sections :-


    - 1) A Brief History of Computing

    - 2) Different Programming Paradigms

    - 3) Why use the Object Oriented Paradigm

    - 4) Object Oriented Principles

    - 5) What Exactly is Object Oriented Programming?

    - 6) The Benefits of the Object Oriented Programming Approach.


    ## 1.1 A Brief History of Computing


    Computing is a constantly changing our world and our environment. In the 1960s
    large machines mainframes were created to manage large volumes of data (numbers)
    efficiently. Bank account and payroll programs changed the ways organisations
    worked and parts of these organisations much more efficient. In the 1980s personal
    computers became common and changed the way individuals worked. People started
    to own their own computers and used word processors and spreadsheets applications
    (to write letters and manage home accounts). In the 1990s email became common
    and the world web was born. These technologies revolutionised communications allowing
    individuals to publish information could be easily accessed on a global scale.
    The ramifications of these new technologies are still not fully understood as
    society is adapting to opportunities of internet commerce, new social networking
    technologies (twitter, facebook, myspace, online gaming etc) and the challenges
    of internet related crime.


    ## Object Oriented programming using Java


    Just as new computing technologies are changing our world so far are new techniques
    and ideas changing the way we develop computer systems. In the 1950s the use of
    machine code (unsophisticated, complex and machine scientific) languages were
    common.


    In the 1960s high level languages, which made programming simpler, became common.
    However these led to the development of large complex programs that were difficult
    to manage and maintain.


    In the 1970s the structured programming paradigm became the accepted standard
    for large complex programs. The structured programming paradigm proposed methods
    to logically structure the programs developed into smaller, more manageable components.
    Furthermore methods for analysing data that allowed large databases to be created
    that were efficient, preventing needless duplication of data and protected against
    the risks associated with data becoming out of sync. However significant problems
    still persisted in understanding the systems we need to create and by changing
    existing software as users required.


    In the 1980s ''modular'' languages, as Modula-2 and ADA were developed that became
    the precursor to modern Object Oriented languages.


    In the 1990s the Object Oriented paradigm and component-based software development
    ideas were developed and Object Oriented languages became the norm from 2000 onwards.


    The object oriented paradigm is based on many of the ideas developed over the
    previous 30 years of abstraction, encapsulation, generalisation and polymorphism
    and led to the development of software components where the operation of the software
    and the data it operates on are modelled together. Proponents of the Object Oriented
    software development paradigm argue this leads to the development of software
    components that can be reused in different applications saving significant development
    time and cost savings but more importantly allow better software models to be
    produced that make systems more maintainable and easier to understand.


    It should perhaps be noted that software development ideas are still evolving
    and new agile methods of working are being proposed and tested. Where this will
    lead us in 2020 and beyond remains to be seen.


    ## 1.2 Different Programming Paradigms


    The structured programming paradigm proposed that programs could be developed
    in sensible blocks that make the program more understandable and easier to maintain.


    ## An Introduction to Object Oriented Programming


    ## Activity 1


    Assume you undertake the following activities on a daily basis. Arrange this list
    into sensible order then split this list into three blocks of related activities
    and give each block heading to summarise the activities carried out that block.


    - Get out of bed

    - Eat breakfast

    - Park the car

    - Get dressed

    - Get the car out of the garage

    - Drive to work

    - Find what your boss wants you to do

    - Feedback to the boss on today''s results.

    - Do what the boss wants you to do


    ## Feedback 1


    You should have been able to organise these into groups of related activities
    and give each group a title that summarises those activities.


    - Get up :

    - Get out of bed

    - Get dressed

    - Eat breakfast

    - Go to Work :

    - Get the car out of the garage

    - Drive to work

    - Park the car

    - Do your job :

    - Find what your boss wants you to do

    - Do what the boss wants you to do

    - Feedback to the boss on today''s results.


    By structuring our list of instructions and considering the overall structure
    of the day (Get up, go to work, do your job) we can change and improve one section
    of the instructions without changing the other parts. For example we could improve
    the instructions for going to work....


    - Listen to the local traffic and weather report

    - Decide whether to go by bus or by car

    - If by car, get the car and drive to work.

    - Else walk to the bus station and catch the catch


    without worrying any potential impact this may have on ''getting up'' or doing
    your job.

