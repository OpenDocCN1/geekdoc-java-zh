    # 7. The Collections Framework


    Introduction


    This chapter will introduce the reader to the collections framework – an important
    part of the standard Java library.


    Objectives


    By the end of this chapter you will be able to....


    +   - Understand the basic concepts of the Java Collections Framework

    - Contrast the characteristics of various Collections interfaces

    - Understand the related concept of an iterators


    This chapter consists of twelve sections :-


    +   1) An Introduction to Collections

    2) Collection Interfaces

    3) Old and New Collections

    4) Lists

    5) Sets

    6) Maps

    7) Collection Implementations

    8) Overview of the Collections Framework

    9) An Example Using Un-typed Collections

    10) An Example Using Typed Collections

    11) A Note About Sets

    12) Summary


    # 7.1 An Introduction to Collections


    Most software systems need to store various groups of entities rather than just
    individual items. Arrays provide means of doing this, but the Java Collections
    support much more varied and flexible forming of grouping.


    In java, collections (or ‘containers’) are classes which serve to hold together
    groups of other objects. The Java platform provides a ‘Collections Framework’,
    a consistent set of interfaces and implementations


    +   - interfaces define the available functionality

    - implementations influence other issues including performance'
  - "[PAGE 111]\n\n# 7.2 Collection Interfaces\n\nAt the core of the collections framework\
    \ is an interface called ‘Collection’. This defines methods that are at the core\
    \ of the framework. List and Set are interfaces that are extensions of Collection\
    \ – they inherit all its operations and add some more.\n\nNote that because these\
    \ are interfaces, not classes, they only define operation signatures, not any\
    \ aspect of their implementation as methods.\n\nAn important additional interface\
    \ is ‘Map’. This is not an extension of Collection – this is because maps do not\
    \ fit entirely in the Collection hierarchy for reasons we will see later, although\
    \ they still part of the ‘Collections Framework’.\n\nThus we have the following\
    \ interfaces...\n\n+   * Collection: the most general grouping\n  - List: a collection\
    \ of objects (which can contain duplicates) held in a specific order\n  - Set:\
    \ a collection of unique objects in particular order\n  - SortedSet: a set with\
    \ objects arranged in ascending order\n* Map: a collection of unique ‘keys' and\
    \ associated objects\n  - SortedMap: a map with objects arranged in ascending\
    \ order of keys\n\nJust as List and Set extend the Collection interface, SortedSet\
    \ is an extension of Set and SortedMap is an extension of Map.\n\nWe will look\
    \ at List, Sets and Maps in this chapter.\n\n# 7.3 Old and New Collections\n\n\
    Up to Java SDK 1.4, collections hold items of type Object – i.e. objects of any\
    \ class since all are subclasses of Object. This allowed a mixture of objects\
    \ in a collection. However when objects are taken out of a collection the compiler\
    \ does not know what the object is and this can cause some additional complications.\n\
    \nIn practice we almost always want objects of some specific type in a particular\
    \ collection. Thus in Java JDK 5.0 ‘generics’ were introduced. ‘Generics’ allow\
    \ a class to be defined without specifying the types of data items it handles.\
    \ Instead the types are specified when the class is instantiated, and so are fixed\
    \ for particular objects.\n\nThus using ‘generics’ we can create collections that\
    \ only store objects of a specified type."
  - '[PAGE 112]


    # 7.4 Lists


    Lists are the most commonly used type of collection – where you might have used
    an array, a List will provide a more convenient method of handling the data.


    Lists are very general-purpose data structures, with each item occupying a specific
    position. They are in many ways like arrays, but are more flexible as they are
    automatically resized as data is added. They are also much easier to manipulate
    than arrays as many useful methods have been created to do the bulk of the work
    for you. Lists store items in a particular sequence (though not necessarily sorted
    into any meaningful order) and duplicate items are permitted.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_112_0.png)


    Objects in list, each occupying a specific position in sequence.


    List will be resized dynamically as program runs.


    # 7.5 Sets


    A set is like a ''bag'' of objects rather than a list. They are based on the mathematical
    idea of a ''set'' – a grouping of ''members'' that can contain zero, one or more
    distinct items.


    Unlike a List, duplicate items are not permitted in a set and a Set does not arrange
    items in order (but a SortedSet does).'
  - '[PAGE 113]


    # Object Oriented Programming using Java


    # The Collections Framework


    Like lists, sets are resized automatically as items are added


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_113_0.png)


    Each object is distinct and not in any particular order.


    Set will be resized dynamically as program runs.


    Many of the operations available for a List are also available for a Set,


    +   * we CANNOT add an object at a specific position since the elements are not
    in any order

    * we CANNOT ‘replace’ an item for the same reason (though we can add one and delete
    another)

    * retrieving the items is possible but the sequence is indeterminate

    * it is meaningless to find what position an element is in.


    # 7.6 Maps


    Maps are rather different from Lists and Sets because instead of storing individual
    objects they store pairs of objects. The pair is made of a ‘key’ and a ‘value’.
    The key is something which identifies the pair. The value is a piece of information
    or an object associated with the key.


    Example: in an address book the keys would be people’s names and the values their
    address, phone, mail etc. There is only one value for each key, but since values
    are objects they can contain several pieces of data.


    Duplicate keys are not permitted, though duplicate values are. So in the previous
    example if you looked up two people in the address book you may find them living
    at the same address – but one person would not have two homes.


    Like a set, a Map does not arrange items in order (but a SortedMap does, in order
    of keys) and like lists and sets, maps are resized automatically as items are
    added or deleted.


