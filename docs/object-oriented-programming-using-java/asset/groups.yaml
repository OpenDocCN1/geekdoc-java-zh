    最通用的类（即继承树的顶端）是 ''Runner''。Amateur 和 Professional 是 Runner 的子类，FancyDresser 是
    Amateur 的特定类型，因此是 Amateur 的子类。


    我们可以将这些类放入继承层次中，因为这些类都通过“是”关系（is-relationship）相关联。一个 FancyDresser 是一个 Amateur，而
