    ## 2.4 UML Package Diagrams


    While classes are the most commonly used diagram of those defined in UML notation,
    and we will make significant use of these throughout this book, there are other
    diagrams that denote different types of information. Here we will touch upon three
    of these :-


    - Package Diagrams

    - Object Diagrams

    - Sequence Diagrams


    World maps, country maps and city maps all show spatial information, just on different
    scales and with differing levels of detail. Large OO systems can be made of hundreds,
    or potentially thousands, of classes and thus if the class diagram was the only
    way to represent the architecture of a large system it would become overly large
    and complex. Thus, just as we need world maps, we need package diagrams to show
    the general architecture of a large system. Even modest systems can be broken
    down into a few basic components i packages. We will see an example of packages
    in Chapter 11. For now we will just look at the package diagramming notation.


    A package is not just a visual representation of a group of classes instead a
    ''package'' is a directory containing a group of related classes (and interfaces).
    Packages allow us to provide a level of organisation and encapsulation above that
    of individual classes and all of the standard Java platform classes are arranged
    in a single large package hierarchy. Similarly we can also arrange our own classes
    using the Java package mechanism.


    Packages are described as a series of dot-separated names, e.g. java.awt.event.
    The names correspond to a series of sub-directories in the file system, e.g.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_40_0.png)


    A large Java development should be split into suitable packages at the design
    stage UML provides a ''Package Diagram'' to represent the relationships between
    classes and packages.


    We can depict


    - classes within packages

    - nesting of packages

    - dependencies between packages


    # Object Oriented Programming using Java


    In the diagram below we see two packages :- ''java'' and ''javax''


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_41_0.png)


    Looking at this more closely we can see that inside the ''java'' package is another
    called ''awt'' and inside ''javax'' is a package called ''swing''.


    The package ''awt'' contains a class ''Container'' and ''swing'' contains three
    classes ''JFrame'', ''JComponent'' and ''JButton''. Finally we show that the java.swing
    package has dependencies on the java.awt package.


    Note that the normal UML principle of suppression applies here – both java.awt
    and javax.swing contain many classes, but we simply choose not to show them. In
    the diagram below we have an alternative way of indicating a JButton is in the
    javax.swing package.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_41_1.png)


    And again below we show all three concisely than at the top.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_41_2.png)


    These different representations will be useful in different circumstances.


    # Object Oriented Programming using Java


    # The Unified Modelling Language (UML)


    # Package Naming


    By convention, package names are normally lowercase for individual projects, e.g.

    - mysystem.interface

    - mysystem.engine

    - mysystem.engine.util

    - mysystem.database


    However, packages are often distributed and to enable these packages globally
    unique names, a naming convention has been adopted based on URLs


    ```

    uk.co.ebay.www.department.project.package

    ```


    Part distinguishing the particular project and subsystem which this package contains.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_42_0.png)


    # Object Oriented Programming using Java


    # The Unified Modelling Language (UML)


    Note on a package diagram each element is not separated by ''*'' but by ''::''.


