    ## Object Oriented Programming using Java


    ### An Introduction to Object Oriented Programming


    A ''class'' is a software design which describes the general properties of something
    which the software is modelling.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_20_0.png)


    Individual ''objects'' are created from the class design for each actual thing.


    However deciding just what classes we should create in our system is not a trivial
    task as the real world is complex and messy (see chapter 6 for more advice on
    how to go about this). In essence we need to create an abstract model of the real
    world that focuses on the essential aspects of a problem and ignores irrelevant
    complexities. For example in the real world bank holders sometimes need to borrow
    money and occasionally their money may get stolen by a pocket picker. If we were
    to create a bank account system we should allow customers to borrow money? Should
    we acknowledge their cash may get stolen and build in some method of them getting
    an immediate loan - or is this an irrelevant detail that would just add complexity
    to the system and provide no benefit to the bank?


    Using object oriented analysis and design techniques your job would be to look
    at the real world and come up with a simplified abstract model that we could turn
    into a computer system. How good our final system is depends upon how good our
    software is.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_21_0.png)


    ## Activity 9


    Consider a computer system that will allow items to be reserved from a library.
    Imagine one item that you may like to reserve and list two or three things that
    a librarian may want to know about this item.


    ## Feedback 9


    You may have thought of a book you wish to reserve in which case the librarian
    may need to know the title of the book and its author.


    Thus for every object we create in a system we need to define the attributes of
    that object i.e. the things we need to know about it.


    ## Activity 10


    Note that we can consider a reservation to be an intellectual object (where the
    actual item is a physical object). Considering this intellectual object (item
    reservation) list two or three actions the librarian may need to perform on this
    object.


    ## Feedback 10


    The librarian may need to cancel this reservation (if you change your mind) they
    may also need to tell you if the item has arrived in stock for you to collect.


    Thus for every object we need to define the operations that will be performed
    on that object (as well as its attributes).


    ## Object Oriented Programming using Java


    ### An Introduction to Object Orientated Programming


    ## Activity 11


    Considering the most general category of object that can be borrowed from a library,
    a ''loan item'', list two or three specific subcategory of object a library can
    lend out.


    ## Feedback 11


    Having defined the most general category of object (we call this a class) — something
    that can be borrowed — we may want to define more specialised sub-classes (e.g.
    books, magazines, audio/visual material). These will share the attributes defined
    for the general class but will have specific differences (for example there could
    be a charge for borrowing audio/visual items).


    ## 1.6 The Benefits of the Object Oriented Programming Approach


    Whether or not you develop programs in an object oriented way, before you write
    the software you must first develop a model of what software must be done to and
    how it should work. Object oriented modelling is based on the ideas of abstraction,
    encapsulation, inheritance.


    The proponents of the object oriented approach claims that this model provides:


    - better abstractions (modelling information and behaviour together)

    - better maintainability (less fragile)

    - better reusability (classes as components)


    ## 1.7 Summary


    Object oriented programming involves the creation of classes by modelling the
    real world. This allows systems to be changed as business needs change. Polymorphic
    behaviour means that classes can be accessed by the rest of the system.


    ## Unified Modelling Language (UML)


    ### Introduction


    This chapter will introduce you to the Unified Modelling Language (UML) and explain
    the purpose of four the most common diagrams (class diagrams, object diagrams,
    sequence diagrams and package diagrams). Particular emphasis will be placed on
    class diagrams.


    ### Objectives


    By the end of this chapter you will be able to:


    - Explain what UML is and explain the role of four most common diagrams

    - Draw class diagrams, object diagrams, sequence diagrams and package diagrams.


    The material covered in this chapter will be expanded on throughout chapters and
    the skills developed here will be used in later exercises (particularly regarding
    class diagrams).


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_23_0.png)


    ## Object Oriented Programming using Java


    This chapter consists of six sections:


    1. An introduction to UML

    2. UML Class Diagrams

    3. UML Syntax

    4. UML Package Diagrams

    5. UML Object diagrams

    6. UML Sequence Diagrams


    ### 2.1 An Introduction to UML


    The Unified Modelling Language, UML, is sometimes described as though it was a
    methodology. It is not!


    A methodology is a system of processes in order to achieve a particular outcome
    e.g. an organised sequence of activities to gather user requirements. UML on the
    other hand a precise diagramming notation that will allow program designs to be
    represented and discussed. As it is graphical in nature it becomes easy to visualise,
    understand and discuss the information presented in the diagram. However as the
    diagrams represent technical information they must be precise and clear – in order
    for them to work there is a precise notation that must be followed.


    As UML is not a methodology it is left to the user to follow whatever they deem
    appropriate in order to generate the designs described by the diagrams. UML does
    not constrain this – it merely allows those designs to be expressed in an easy
    to use, precise, graphical notation.


    ### 2.2 UML Class diagrams


    Classes are the basic components of any object oriented software system and UML
    class diagrams provide an easy way to represent these. As well as showing individual
    classes, in detail, class diagrams show multiple classes and how they are related
    to each other. Thus a class diagram shows the architecture of a system.


    A class consists of:


    - a unique name (conventionally starting with an uppercase letter)

    - a list of attributes (int, double, boolean, String etc)

    - a list of methods


    This is shown in a simple box structure:


    | ClassName |

    | --- |

    | attributes |

    | methods() |

