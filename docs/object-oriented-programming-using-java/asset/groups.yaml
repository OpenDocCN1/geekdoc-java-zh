    \n# 依赖\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_0.png)\n\n- 依赖是类之间最弱的关系（不严格算作“关联”）\n\
    - 类 A 在某种程度上使用了由类 B 定义的功能\n- 类 B 的更改可能会影响类 A\n\n依赖线的典型用法是：类 A 有一个方法接收了类 B 的实例对象作为参数，或者使用了该对象的局部变量，或者使用了类\
    \ B 的 `static` 方法。\n\n# 简单关联\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_1.png)\n\
    \n- 在关联中，类 A “使用”类 B 的对象\n- 通常类 A 有一个类 B 的属性\n- 从 A 到 B 的导航性：\n  - 即类 A 对象访问与其关联的类\
    \ B 对象。反之则不成立 —— 类 B 对象“不知道”类 A 对象\n\n简单关联对应于类 A 中类型为 B 的实例变量。\n\n示例：上面的目录（Catalogue）需要\
    \ 0 个或多个待售物品（ItemsForSale）。可以从目录中添加或删除待售物品。一个待售物品不需要访问目录即可设置其价格或执行与物品本身相关的其他方法。\n\
    \n# 双向关联\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_2.png)\n\n- 双向关联是指类 A\
    \ 和类 B 之间存在双向关联\n- 它们互相引用对方类\n- 从 A 到 B 和 B 到 A 的导航性：\n  - 类 A 对象访问与其关联的类 B 对象\n\
    \  - 类 B 对象“属于”类 A\n  - 意味着从 A 到 B 的引用\n  - 此外，类 B 对象也可以访问与其关联的类 A 对象\n\n双向关联是复杂的，因为每个对象都有指向另一个对象的引用，通常双向关联比单向关联少得多。\n\
    \n# 使用 Java 进行面向对象编程\n\n# 统一建模语言 (UML)\n\n双向关联的一个示例可以是“学位”（Degree）和“学生”（Student）之间，例如：给定一个学位，我们可能想知道哪些学生正在读该学位。或者从学生开始，我们可能想知道他们正在读的学位。\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_34_0.png)\n\n由于许多学生在同一学习同一个学位，但学生通常只读一个学位，因此这里仍然存在一对多的关系。\n\
    \n# 聚合\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_34_1.png)\n\n- 聚合表示类 B 对象“属于”类\
    \ A的情况\n- 意味着从 A 到 B 的引用\n- 虽然聚合意味着类 B 对象属于类 A 对象，但它也意味着类 B 对象保留了独立于类 A 的存在性。一些设计人员认为聚合和简单关联之间没有本质区别。\n\
    \n聚合的一个示例是汽车（Car）类和轮胎（Tyre）类之间。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_34_2.png)\n\
