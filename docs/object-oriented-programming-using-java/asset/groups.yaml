    # Object Oriented Programming using Java


    But how do we get from a ''need'' for some software to an object oriented software
    design that will meet this need?


    Some software engineers specialise in the task of Requirement Analysis which is
    the task of clarifying exactly what is required of the software. Often this is
    done by iteratively performing the following tasks :-


    +   1) interviewing clients and potential user of the system to find out what
    they say about the system needed

    2) documenting the results of these conversations,

    3) identifying the essential features of the required system

    4) producing preliminary designs (and possibly prototypes of the system)

    5) evaluating these initial plans with the client and potential users

    6) repeating the steps above until a finished design has evolved.


    Performing requirements analysis is a specialised skill that is outside the scope
    of this text but we will focus on three steps and four above ie. a description
    of how we do convert this into a potential OO design.


    While we can hope to develop preliminary design skills experience is a significant
    factor in this task. Producing simple and elegant designs is important if we want
    the software to work well and be easy to develop however identifying good designs
    from weaker designs is not simple and experience is a key factor.


    A novice chess player may know all the rules but it takes experience to learn
    how to choose moves from bad moves and experience is essential to becoming a skilled
    player. Similarly experience is essential to becoming skilled at performing user
    requirements analysis and in producing good designs.


    Here we will attempt to develop rudimentary skills in the hope that you will have
    the opportunity to practise these skills and gain experience later.


    Starting with a problem specification we will work through the following steps
    :-


    +   * Listing Nouns and Verbs

    * Identifying Things Outside The Scope Of The System

    * Identifying Synonyms

    * Identifying Potential Classes

    * Identifying Potential Attributes

    * Identifying Potential Methods

    * Identifying Common Characteristics

    * Refining Our Design using CRC Cards

