- md: "\nObject Oriented Programming using Java\n\n## 9.2 Kinds of Exception\n\nTo\
    \ generate meaningful exceptions we need to extend the Exception classes built\
    \ into the Java language — there are two of these (normal exceptions and run time\
    \ exceptions).\n\nSubclasses of java.lang.Exception are used for anticipated problems\
    \ which need to be managed. They must be declared in the originating method's\
    \ throws clause and a call to be placed in try/catch block.\n\nSubclasses of java.lang.RuntimeException\
    \ are used for situations which lead to runtime failure and where it may not be\
    \ possible to take any remedial actions. They do not need to be declared in throws\
    \ clause and a call not to be in try/catch block (but can).\n\nThus we have the\
    \ choice of whether the Java compiler should force us to explicitly deal with\
    \ a particular kind of exception.\n\nException subclasses are appropriate for\
    \ things which we know go wrong and where we can take recursive action – e.g.\
    \ IO errors.\n\nRuntimeException subclasses are appropriate for things which should\
    \ not happen at all and where there is probably nothing we can do to recover the\
    \ situation, e.g. an out of memory error or discovering that the system is in\
    \ an inconsistent state which might arise.\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_148_0.png)\n\
    \nStudent and Graduate opportunities in IT, Internet & Engineering Cheltenham\
    \ | £competitive + benefits\n\nPart of the UK's intelligence services, our role\
    \ is to counter threats that compromise national and global security. We work\
    \ in one of the most diverse, creative and technically challenging IT cultures.\
    \ Throw in continuous professional development, and you get truly interesting,\
    \ in a genuinely inspirational business.\n\nTo find out more visit www.careersbritishintelligence.co.uk\n\
    \nApplicants must be British citizens. GCHQ values diversity and welcomes applicants\
    \ from all sections of the community. We want our workforce to reflect the diversity\
    \ of our work.\n\n## 9.3 Extending the Exception Class\n\nWhen writing our methods\
    \ we should look for potential failure situations (e.g. value that cannot be returned,\
    \ errors that may occur in calculation etc). When a potential error occurs we\
    \ should generate an 'Exception' object, an object of the Exception class. However\
    \ it is best to define a subclass of the general Exception i.e. to create a specialised\
    \ class and throw one of this subtype.\n\nA new exception is just like any new\
    \ class in this case it is a subclass of **java.lang.Exception**\n\nIn the case\
    \ above an error could occur if no client is found with a specified ID. Therefore\
    \ we could create a new exception class called 'UnknownClientException'\n\nThe\
    \ parameter to the constructor for the Exception requires a String that the constructor\
    \ for UnknownClientException also requires a String. This string is used to get\
    \ details of the problem that may generate an exception.\n\nThe code to create\
    \ this new class is given below:\n\n```java\nimport java.lang.Exception;\n\n********************************************************************\n\
    * Exception thrown when attempting to get a non-existent client ID\n* @author\
    \ Simon Kendal\n* @version 1.0 (11th July 2009)\n********************************************************************/\n\
    class UnknownClientException extends Exception {\n    /**\n     * Constructor\n\
    \     * \n     * @param pMessage description of exception\n     */\n    UnknownClientException(String\
    \ pMessage) {\n        super(pMessage);\n    }\n}\n```\n\nIn some respects this\
    \ looks odd. Here we are creating a subclass of Exception but our subclass does\
    \ not contain any new methods – nor does it override any existing methods. Its\
    \ functionality is identical to the superclass – however it is subtype with a\
    \ meaningful and descriptive name.\n\nIf subclasses of Exception did not exist\
    \ we would only be able to catch the most general type of exception i.e an Exception\
    \ object. Thus we would only be able to write a class block that would catch every\
    \ single type of exception.\n\n### Creating And Using Exceptions\n\nHaving defined\
    \ a subclass we have a choice... a) we could define a catch block to catch objects\
    \ of the general type 'Exception' i.e. it would catch ALL exceptions or b) we\
    \ could define a catch block that would catch UnknownClientExceptions but would\
    \ ignore other types of exception.\n\nBy looking at the online API we can see\
    \ that many predefined subclass of exception already exists. There are many of\
    \ including:-\n\n- IOException\n- CharConversionException\n- EOFException\n- FileNotFoundException\n\
    - ObjectStreamException\n- NullPointerException\n- PrinterException\n- SQLException\n\
    \nThus we write a catch block that would react to any type of exception, or we\
    \ could limit it to input/outputs or we could be even more specific and limit\
    \ it to FileNotFoundExceptions.\n\n## 9.4 Throwing Exceptions\n\nHaving defined\
    \ our own exception we must instruct the getClient() method to throw this exception\
    \ (assuming a client has not been found with the specified ID).\n\nTo do this\
    \ we must first tell the compiler that this class may generate an exception –\
    \ the compiler will ensure that any future programmer who makes use of this method\
    \ catches this exception.\n\nTo tell the compiler this method throws an exception\
    \ we add the following statement to the methods signature ‘throws UnknownClientException’.\n\
    \n```java\npublic Client getClient(String pClientID)\n    throws UnknownClientException\n\
    ```\n\nWe must create a new instance of the UnknownClientException class and apply\
    \ the throw keyword to this newly created object.\n\nWe use the keyword ‘throw’\
    \ to throw an exception at the appropriate point within the body of the method.\n\
    \n```java\nif (foundClient != null)\n{\n    return foundClient;\n} else\n{\n \
    \   throw new UnknownClientException(\"Unknown client ID: \" + pClientID);\n}\n\
    ```\n\nThe example above if a client is found will return the client object. However\
    \ if a client has not been found the constructor for UnknownClientException is\
    \ invoked, using ‘new’. This constructor requires a String parameter – and the\
    \ string we are passing here is an error message that trying to be informative\
    \ and helpful. The message is specified:\n\n- the class which generated the exception\
    \ (i.e. BookOfClients)\n- the method within this class (i.e. getClient())\n- some\
    \ text which explains what caused the exception\n- the value of the parameter\
    \ for which a client could not be found\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_151_0.png)\n\
    \n| Copenhagen Business School Diversity creating knowledge | Financial Times\
    \ of MBA |\n\n## 9.5 Catching Exceptions\n\nHaving specified to the compiler that\
    \ this method may generate an exception we are forcing other programmers to protect\
    \ against critical errors by placing calls to this method within a try/catch block.\
    \ The code in the try will be terminated if an exception is generated and the\
    \ code in the catch block will be initiated.\n\nThus in the example the awardLoan()\
    \ method can decide what to do if no client with the specified ID is found:\n\n\
    ```java\ntry {\n    Client c = listOfClients.getClient(clientID);\n    c.determineCreditRating();\n\
    \n    // add code to award or reject a loan application based on this\n    //\
    \ credit rating\n} catch (UnknownClientException uce) {\n    System.out.println(\"\
    INTERNAL ERROR IN BankManager.awardLoan()\\n\" + \"Exception details: \" + uce);\n\
    }\n```\n\nBy defining UnknownClientException and using the throw clause in the\
    \ header of the getClient() method we are providing a warning to all methods calling\
    \ this that an exception may be thrown. This enables the Java compiler to make\
    \ sure a try/catch block is provided where required.\n\nBy doing this we are preventing\
    \ potentially critical errors from going unnoticed!\n\n## 9.6 Summary\n\nJava\
    \ exceptions provide a mechanism to deal with abnormal situations which occur\
    \ during program execution.\n"
  mdcn: "\n使用 Java 进行面向对象编程\n\n## 9.2 异常的种类\n\n为了生成有意义的异常，我们需要扩展 Java 语言内置的 Exception\
    \ 类 —— 一共有两种（受检异常和运行时异常）。\n\n`java.lang.Exception` 的子类用于需要管理的预期性问题。它们必须在源方法的 `throws`\
    \ 子句中声明，并且并将调用放置在 `try/catch` 块中。\n\n`java.lang.RuntimeException` 的子类用于会导致运行时失败且可能无法采取任何补救措施的情况。它们不需要在\
    \ `throws` 子句中声明，调用也不必放在 `try/catch` 块中（但可以放在）。\n\n因此，我们可以选择 Java 编译器是否应该强制我们显式地处理特定类型的异常。\n\
    \n异常子类适用于我们知道会发生错误且我们可以采取递归措施的情况——例如 IO 错误。\n\n`RuntimeException` 子类适用于根本不应该发生、且我们可能无法做任何事情来恢复局面的情况，例如内存溢出错误或发现系统处于可能出现的不一致状态。\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_148_0.png)\n\n切尔彻姆 IT、互联网与工程领域的学生及研究生机会\
    \ | 薪竞争力 + 福利\n\n作为英国情报部门的一部分，我们的职责是应对损害国家和全球安全的威胁。我们在最具多样性、创造力和技术挑战性的 IT 文化之一中工作。再加上持续的职业发展，你将进入一个真正有趣、真正启发性的业务。\n\
    \n了解更多信息请访问 www.careersbritishintelligence.co.uk\n\n申请人必须是英国公民。GCHQ 重视多样性，欢迎来自社区所有部门的申请者。我们希望员工能够反映我们工作的多样性。\n\
    \n## 9.3 扩展 Exception 类\n\n在编写方法时，我们应该寻找潜在的失败情况（例如无法返回的值、计算过程中可能发生的错误等）。当发生潜在错误时，我们应该生成一个“Exception”对象，即\
    \ `Exception` 类的对象。但是，最好的方法是定义通用 `Exception` 的子类，即创建一个特殊类并抛出该子类型的一个。\n\n在这种情况下，新异常就像任何新类一样，它是\
    \ **java.lang.Exception** 的子类。\n\n在上述情况下，如果没有找到指定 ID 的客户端，则可能会发生错误。因此，我们可以创建一个名为\
    \ 'UnknownClientException' 的新异常类。\n\n`Exception` 构造函数的参数需要一个 `String`，而 `UnknownClientException`\
    \ 的构造函数也需要一个 `String`。此字符串用于获取可能生成异常的问题详细信息。\n\n创建此新类的代码如下：\n\n```java\nimport\
    \ java.lang.Exception;\n\n********************************************************************\n\
    * 当尝试获取不存在的客户端 ID 时抛出的异常\n* @author Simon Kendal\n* @version 1.0 (2009年7月11日)\n\
    ********************************************************************/\nclass UnknownClientException\
    \ extends Exception {\n    /**\n     * 构造函数\n     * \n     * @param pMessage 异常的描述\n\
    \     */\n    UnknownClientException(String pMessage) {\n        super(pMessage);\n\
    \    }\n}\n```\n\n在某些方面，这看起来很奇怪。在这里我们正在创建 `Exception` 的子类，但我们的子类没有包含任何新方法，也没有重写任何现有方法。它的功能与父类相同——但它具有具有意义且具描述性名称的子类型。\n\
    \n如果 `Exception` 的子类不存在，我们只能捕获最通用的异常类型，即 `Exception` 对象。因此，我们只能编写一个捕获每一种异常的代码块。\n\
    \n### 创建和使用异常\n\n定义了子类后，我们有一个选择……a) 我们可以定义一个 `catch` 块来捕获通用类型 'Exception' 对象，即它将捕获所有异常；b)\
    \ 我们可以定义一个 `catch` 块来捕获 `UnknownClientExceptions`，但忽略其他类型的异常。\n\n通过查看在线 API，我们可以看到已经存在许多预定义的异常子类。有很多种，包括：\n\
    \n- IOException\n- CharConversionException\n- EOFException\n- FileNotFoundException\n\
    - ObjectStreamException\n- NullPointerException\n- PrinterException\n- SQLException\n\
    \n因此，我们可以写一个对任何类型的异常做出响应的 `catch` 块，或者将其限制在输入/输出上，或者我们可以更具体，将其限制为 `FileNotFoundExceptions`。\n\
    \n## 9.4 抛出异常\n\n定义了自己的自己的异常后，我们必须指示 `getClient()` 方法抛出此异常（假设没有找到指定 ID 的客户端）。\n\
    \n要做到这一点，我们必须首先告诉编译器该类可能会生成异常——编译器将确保任何以后使用此方法的程序员都捕获此异常。\n\n要告诉编译器此方法抛出异常，我们要在方法签名中添加以下语句\
    \ `throws UnknownClientException`。\n\n```java\npublic Client getClient(String\
    \ pClientID)\n    throws UnknownClientException\n```\n\n我们必须创建 `UnknownClientException`\
    \ 类的一个新实例，并将 `throw` 关键字应用到这个新创建的对象上。\n\n我们使用 `throw` 关键字在方法体适当的位置抛出异常。\n\n```java\n\
    if (foundClient != null)\n{\n    return foundClient;\n} else\n{\n    throw new\
    \ UnknownClientException(\"Unknown client ID: \" + pClientID);\n}\n```\n\n上面的示例中，如果找到了客户端，将返回客户端对象。但是，如果没有找到客户端，则会使用\
    \ `new` 调用 `UnknownClientException` 的构造函数。此构造函数需要一个 `String` 参数——我们在这里传递的字符串是一个错误消息，试图提供信息并有所帮助。该消息指定了：\n\
    \n- 生成异常的类（即 BookOfClients）\n- 该类中的方法（即 getClient()）\n- 解释导致异常原因的文本\n- 无法找到客户端的参数值\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_151_0.png)\n\n| 哥本哈根商学院创造多样知识 | 金融时报\
    \ MBA |\n\n## 9.5 捕获异常\n\n通过向编译器指定此方法可能会生成异常，我们强制其他程序员通过在 `try/catch` 块中调用此方法来防止关键错误。如果生成了异常，`try`\
    \ 块中的代码将终止并启动 `catch` 块中的代码。\n\n因此，示例中的 `awardLoan()` 方法可以在未找到指定 ID 的客户端时决定做什么：\n\
    \n```java\ntry {\n    Client c = listOfClients.getClient(clientID);\n    c.determineCreditRating();\n\
    \n    // 根据此信用评分添加授予或拒绝贷款申请的代码\n    // 评级\n} catch (UnknownClientException uce)\
    \ {\n    System.out.println(\"内部错误：BankManager.awardLoan()\\n\" + \"异常详情: \" +\
    \ uce);\n}\n```\n\n通过定义 `UnknownClientException` 并在 `getClient()` 方法头部使用 `throws`\
    \ 子句，我们向所有调用此方法的方法提供了一个警告，可能会抛出异常。这使得 Java 编译器能够确保在需要的地方提供 `try/catch` 块。\n\n\
    通过这样做，我们防止了潜在的关键错误未被忽视！\n\n## 9.6 总结\n\nJava 异常提供了一种处理程序运行期间发生的非正常情况的机制。\n\n"
