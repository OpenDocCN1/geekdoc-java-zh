    # 4.5 接口


    继承有两个方面：


    - * 子类继承父类的接口（即公有成员）——这使得多态成为可能

    - * 子类继承父类的实现（即变量）——这节省了重复工作


    在 Java 中，**extends** 关键字会自动应用这些方面。


    **子类**是一个子类型。它包含了父类的所有接口，尽管可能有更广泛的功能。


    然而，有时我们希望两个类共享一个接口而不将它们放入继承层次中。这可能是因为：


    - 它们之间没有真正的“是”的关系

    - 我们希望一个类拥有来自多个父类的接口，但 Java 不允许这种“多重继承”


    这就像确保两辆汽车具有工作方式相同的控件，但让不同的工程师以不同的方式设计引擎。


    # 使用 Java 进行面向对象编程


    # 对象角色与多态的重要性


    注意“接口”（interface）一词——在 Java 编程中它至少有三个含义：


    (1) 类的公共成员的上述含义

    (2) 程序的“用户界面”，通常是“图形用户界面” —— 完全相关的含义

    (3) 我们即将遇到的特定 Java 构造结构


    回想 Publication 的子类如何在提供额外和修订行为的同时，保留其定义的操作集——即接口。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_81_0.png)


    这就是为什么 CashTill 类可以处理 Publication 而无需担心它是哪个具体的子类。（记住 Publication 是抽象类——实际上“Publication”总是子类。）


    # 票务


    现在考虑除了书籍和杂志之外，我们现在还想销售票务，例如娱乐活动、公共交通等。这些与 Publication 不同，因为：


    - 我们没有“库存”，而是在收银台按需打印

    - 票务仅简单包含描述、价格和客户（为谁销售）

    - 这些销售实际上是一项服务而非产品


    票务与 Publication 之间似乎很少共同点——它们共享与销售相关的小型接口，即使对于这一点，底层实现也是不同的，因为我们不会从当前库存中减少它们。


    由于这些原因，Ticket 和 Publication 似乎并不相关，因此我们不想将它们放入继承层次中。然而，我们确实需要让它们都能被 CashTill 接受为销售物品，并且我们需要实现此点的机制。


