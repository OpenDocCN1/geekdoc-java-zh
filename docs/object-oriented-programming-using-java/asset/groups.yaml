    # Object Oriented Programming using Java


    In a class attributes will be defined. These could be primitive data types (int,
    boolean etc.) however attributes can also be complex objects defined by other
    classes.


    | OneClass |

    | value : OtherClass |


    Thus the figure above shows a class ''OneClass'' that has an attribute ''value''.
    This value is not a primitive data type but it is an object of type defined by
    ''OtherClass''.


    We could denote exactly the same information by the diagram below.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_30_0.png)


    We use an association when we want to give two related classes, and their relationship,
    prominence in a class diagram


    The ''source'' class points to the ''target'' class.


    Strictly we could use an association when a class we define a String instance
    variable - but we would not do this because the String class is part of the Java
    platform and ''taken for granted'' like an attribute of a primitive type. This
    would generally be true of all library classes unless we are drawing the diagram
    specifically to explain some aspect of the library class for the benefit of someone
    unfamiliar with its purpose and functionality.


    Additionally we can show multiplicity at both ends of an association:


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_30_1.png)


    This implies that ''OneClass'' maintains a collection of objects of type ''OtherClass''.
    Collections are important part of the Java framework that we will look at the
    use of collections in Chapter 7.'
