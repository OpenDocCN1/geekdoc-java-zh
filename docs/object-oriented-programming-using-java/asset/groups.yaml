    \ 包管理器（package explorer）窗口，右键点击包 'main'  way GUimain 类，并选择 'Run as Java application'（作为\
    \ Java 应用程序运行）。\n\n在此导出的文件中，包含了本章讨论的所有类、方法和测试用例，以及由 Javadoc 工具生成的 Javadoc。要查看\
