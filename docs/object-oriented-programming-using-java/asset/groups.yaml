    \ They could do so but it would not be better to allow such a student to enroll\
    \ (and the address to 'unknown')?\n\nTo allow this method enrollStudent() could\
    \ be overloaded and an alternative method provided as:\n\n```java\nenrollStudent(String\
    \ pName, String pCoursecode)\n```\n\nAt run time the JRE could determine which\
    \ method to invoke upon depending the parameter list. Given a call to\n\n```java\n\
    enrollStudent(\"Fred\", \"123 Abbey Gardens\", \"G700\")\n```\n\nThe JRE would\
    \ use the first method.\n\n| Activity 1 |\nImagine a method withdrawCash() that\
