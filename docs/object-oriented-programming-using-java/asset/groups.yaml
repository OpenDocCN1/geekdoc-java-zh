    和 SponsorshipForm 之间存在关联。当然，FancyDressers 继承了 Amateur 中定义的属性，因此他们自动拥有一个 SponsorshipForm。


    # 6.10 使用 CRC 卡片完善我们的设计


    在确定了系统中的主要类以及这些类的属性和方法后，我们可以通过定义数据类型和细小细节来完善这些设计，在 UML 图上记录这些信息并编写系统。然而在现实世界中，问题会更大且定义不那么明确；我们在这里处理的问题——即设计的分析和完善——将是一个更长且复杂的过程，我们可以真实地模拟。


    由于现实世界更加复杂，我们的初始设计并不完美；因此，在将这些设计转换为完成系统之前，检查设计并解决任何潜在问题是有意义的。


    检查设计的方法之一是使用 CRC 卡记录设计，并通过角色扮演不同的场景来检查这些设计是否有效。


    CRC 卡不是实现此目的的方法，也不是 UML 规范的一部分。


    # 使用 Java 进行面向对象编程


    CRC 代表类（Class）、职责（Responsibilities）和协作（Collaborations）。下面展示了一个 CRC 卡，它由三个面板组成，左侧显示类的职责，右侧显示协作。


    | 类名 | 类职责 | 类协作 |

    | :--- | :--- | :--- |


    职责是类需要知道的内容（即属性）以及它应该做的事情（即方法），尽管在 CRC 卡上这些内容的定义没有在 UML 图上那么精确。协作是该类为了履行其职责而必须合作的其他类。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_105_0.png)


