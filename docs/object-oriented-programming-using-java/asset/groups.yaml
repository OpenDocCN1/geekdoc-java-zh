    # Object Oriented Programming using Java


    # Object Roles and the Importance of Polymorphism


    Be careful of the term ‘interface’ – in Java programming it has at least three
    meanings:


    +   (1) the public members of a class – the meaning used above

    (2) the ‘user interface’ of a program, often a ‘Graphical User Interface’ – essentially
    unrelated meaning

    (3) a specific Java construct which we are about to meet


    Recall how the subclasses of Publication provide additional and revised behaviour
    while retaining the set of operations – i.e c the interface – which it defined.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_81_0.png)


    This is why the CashTill class can deal with a ‘Publication’ without worrying
    of which specific subclass it is an instance. (Remember that Publication is an
    abstract class – a ‘Publication’ is in reality always a subclass.)


    # Tickets


    Now consider the possibility that in addition to books and magazines, we now want
    to sell tickets, e.g. for entertainment events, public transport, etc. These are
    not like Publications because:-


    +   - we don''t have a ‘stock’ but print them on demand at the till

    - tickets consist simply of a description, price and client (for whom they are
    being sold)

    - these sales are really a service rather than a product


    Tickets seem to have little common with Publications – they share a small interface
    associated with being sold, even for this the underlying implementation will be
    different because we will not be decrementing them from a current stock


    For these reasons Ticket and Publication do not seem closely and thus we do not
    want to put them in an inheritance hierarchy. However we do to make them both
    acceptable to CashTill as things to sell and we need a mechanism for doing this.


