    # 2.3 UML Syntax


    As UML diagrams convey precise information there is a precise syntax that should
    be followed.


    Attributes should be shown as: visibility name : type multiplicity


    Where visibility is one of :-


    +   - ''+'' public

    ''-'' private

    ''-#'' protected

    ''-~'' package


    and Multiplicity is one of :-


    +   - ''n'' exactly n

    ''-*'' zero or more

    ''-m..n'' between m and n


    The following are examples of attributes correctly specified using UML :-


    +   - custRef : int [1]

    a private attribute custRef is a single int value

    this would be shown as - custRef : int : However with no multiplicity shown we
    cannot safely assume a multiplicity of one was intended by the author.


    +   - itemCodes : String [*]

    a a protected attribute itemCodes is one or more String values


    +   validCard : boolean

    an an attribute validCard, of unspecified visibility, has unspecified multiplicity


    Operations also have a precise syntax and should be shown as:

    visibility name (par1 : type1, par2 : type2): returntype


    where each parameter is shown (in parenthesis) and then the return type is specified.


    An example would be


    +   + addName (newName : String) : boolean


    This denotes a public method ''addName'' which takes one parameter ''newName''
    of type String and returns a boolean value.'
