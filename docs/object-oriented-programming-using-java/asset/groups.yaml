- md: "\n# Object Oriented Programming using Java\n\nTurning a complex requirements\
    \ specification into an elegant object oriented architectural design is a skilled\
    \ task that requires experience. However a good starting point is to follow a\
    \ simple process set out in this chapter.\n\nThrough a sequence of tasks we have\
    \ seen how to analyse a textual description of a problem. We have -\n\n- Looked\
    \ for aspects of the description that are outside the scope of the system,\n-\
    \ Identified where the description refers to synonymous items using different\
    \ words\n- Used the nouns and verbs to identify potential classes, attributes\
    \ and methods\n- Looked at the classes to identify potential inheritance hierarchies\
    \ and to identify other relationships between classes (e.g. associations).\n-\
    \ Document the resulting classes using CRC cards and tested the validity of our\
    \ design by playing a range of scenarios and amending our designs as appropriate\n\
    - Finally we can elaborate these details and document the results using a class\
    \ diagram.\n\nThe design process set out in this chapter will be demonstrated\
    \ again in detail using the case study described in chapter 11.\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_109_0.png)\n\
    \nStudent and Graduate opportunities in IT, Internet & Engineering Cheltenham\
    \ | £competitive + benefits\n\nPart of the UK's intelligence services, our role\
    \ is to counter threats that compromise national and global security. We work\
    \ in one of the most diverse, creative and technically challenging IT cultures.\
    \ Throw in continuous professional development, and you get truly interesting\
    \ work, in a genuinely inspirational business.\n\nTo find out more visit www.careersinbritishintelligence.co.uk\
    \ for all sections of the community.\n\nApplicants must be British citizens. GCHQ\
    \ values diversity and welcomes applicants from all sections of the community.\
    \ We want our workforce to reflect the diversity of our work.\n\n# 7. The Collections\
    \ Framework\n\n## Introduction\n\nThis chapter will introduce the reader to the\
    \ collections framework – an important part of the standard Java library.\n\n\
    ## Objectives\n\nBy the end of this chapter you will be able to\n\n- Understand\
    \ the basic concepts of the Java Collections Framework\n- Contrast the characteristics\
    \ of various Collections interfaces\n- Understand the related concept of iterators\n\
    \nThis chapter consists of twelve sections :-\n\n1) An Introduction to Collections\n\
    2) Collection Interfaces\n3) Old and New Collections\n4) Lists\n5) Sets\n6) Maps\n\
    7) Collection Implementations\n8) Overview of the Collections Framework\n9) An\
    \ Example Using Un-typed Collections\n10) An Example Using Typed Collections\n\
    11) A Note About Sets\n12) Summary\n\n## 7.1 An Introduction to Collections\n\n\
    Most software systems need to store various groups of entities rather than just\
    \ individual items. Arrays provide means of doing this, but the Java Collections\
    \ support much more varied and flexible forming of grouping.\n\nIn java, collections\
    \ (or ‘containers’) are classes which serve to hold together groups of other objects.\
    \ The Java platform provides a ‘Collections Framework’, a consistent set of interfaces\
    \ and implementations:\n\n- interfaces define the available functionality\n- implementations\
    \ influence other issues including performance\n\n## 7.2 Collection Interfaces\n\
    \nAt the core of the collections framework is an interface called ‘Collection’.\
    \ This defines methods that are at the core of the framework. List and Set are\
    \ interfaces that are extensions of Collection – they inherit all its operations\
    \ and add some more.\n\nNote that because these are interfaces, not classes, they\
    \ only define operation signatures, not any aspect of their implementation as\
    \ methods.\n\nAn important additional interface is ‘Map’. This is not an extension\
    \ of Collection – this is because maps do not fit entirely in the Collection hierarchy\
    \ for reasons we will see later, although they still part of the ‘Collections\
    \ Framework’.\n\nThus we have the following interfaces...\n\n- Collection: the\
    \ most general grouping\n  - List: a collection of objects (which can contain\
    \ duplicates) held in a specific order\n  - Set: a collection of unique objects\
    \ in particular order\n  - SortedSet: a set with objects arranged in ascending\
    \ order\n- Map: a collection of unique ‘keys' and associated objects\n  - SortedMap:\
    \ a map with objects arranged in ascending order of keys\n\nJust as List and Set\
    \ extend the Collection interface, SortedSet is an extension of Set and SortedMap\
    \ is an extension of Map.\n\nWe will look at List, Sets and Maps in this chapter.\n\
    \n## 7.3 Old and New Collections\n\nUp to Java SDK 1.4, collections hold items\
    \ of type Object – i.e. objects of any class since all are subclasses of Object.\
    \ This allowed a mixture of objects in a collection. However when objects are\
    \ taken out of a collection the compiler does not know what the object is and\
    \ this can cause some additional complications.\n\nIn practice we almost always\
    \ want objects of some specific type in a particular collection. Thus in Java\
    \ JDK 5.0 ‘generics’ were introduced. ‘Generics’ allow a class to be defined without\
    \ specifying the types of data items it handles. Instead the types are specified\
    \ when the class is instantiated, and so are fixed for particular objects.\n\n\
    Thus using ‘generics’ we can create collections that only store objects of a specified\
    \ type.\n\n## 7.4 Lists\n\nLists are the most commonly used type of collection\
    \ – where you might have used an array, a List will provide a more convenient\
    \ method of handling the data.\n\nLists are very general-purpose data structures,\
    \ with each item occupying a specific position. They are in many ways like arrays,\
    \ but are more flexible as they are automatically resized as data is added. They\
    \ are also much easier to manipulate than arrays as many useful methods have been\
    \ created to do the bulk of the work for you. Lists store items in a particular\
    \ sequence (though not necessarily sorted into any meaningful order) and duplicate\
    \ items are permitted.\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_112_0.png)\n\
    \nObjects in list, each occupying a specific position in sequence.\n\nList will\
    \ be resized dynamically as program runs.\n\n## 7.5 Sets\n\nA set is like a 'bag'\
    \ of objects rather than a list. They are based on the mathematical idea of a\
    \ 'set' – a grouping of 'members' that can contain zero, one or more distinct\
    \ items.\n\nUnlike a List, duplicate items are not permitted and a Set does not\
    \ arrange items in order (but SortedSet does).\n\nLike lists, sets are resized\
    \ automatically as items are added\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_113_0.png)\n\
    \nEach object is distinct and not in any order.\n\nSet will be resized dynamically\
    \ as program runs.\n\nMany of the operations available for a List are also available\
    \ for a Set,\n\n- we CANNOT add an object at a specific position since the elements\
    \ are not in any order\n- we CANNOT ‘replace’ an item for the same reason (though\
    \ we can add one and delete another)\n- retrieving the items is possible but the\
    \ sequence is indeterminate\n- it is meaningless to find what position an element\
    \ is in.\n\n## 7.6 Maps\n\nMaps are rather different from Lists and Sets because\
    \ of storing individual objects they store pairs of objects. The pair is made\
    \ of a ‘key’ and a ‘value’. The key is something which identifies the pair. The\
    \ value is a piece of information or an object associated with the key.\n\nExample:\
    \ in an address book the keys would be people’s names and the values their address,\
    \ phone, mail etc. There is only one value for each key, but since values are\
    \ objects they can contain several pieces of data.\n\nDuplicate keys are not permitted,\
    \ though duplicate values are. So in the previous example if you looked up two\
    \ people in the address book you may find them living at the same address – but\
    \ one person would not have two homes.\n\nLike a set, a Map does not arrange items\
    \ in order (but a SortedMap does, in order of keys) and like lists and sets, maps\
    \ are resized automatically as items are added or deleted.\n\nDownload free books\
    \ at BookBoon.com\n\n114\n"
  mdcn: "\n\n# 使用 Java 进行面向对象编程\n\n将复杂的需求规格书转换为优雅的面向对象架构设计是一项需要经验的熟练任务。然而，一个良好的起点是遵循本章列出的简单流程。\n\
    \n通过一系列任务，我们已经看到了如何对问题的文本描述进行分析。我们已经：\n\n- 寻找描述中超出系统范围的方面\n- 识别描述中何时使用不同的词汇指代同义项\n\
    - 使用名词和动词来识别潜在的类、属性和方法\n- 查看类以识别潜在的继承层次以及类之间的其他关系（例如：关联）\n- 使用 CRC 卡片记录生成的类，并通过运行一系列场景来测试设计的有效性，并根据需要修改我们的设计\n\
    - 最后，我们可以详细说明这些细节并使用类图记录结果\n\n本章列出的设计过程将在第 11 章描述的案例研究中再次详细演示。\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_109_0.png)\n\
    \n切尔彻姆 IT、互联网与工程领域的学生及毕业生机会 | 薪资有竞争力 + 福\n\n作为英国情报机构的一部分，我们的职责是应对威胁国家和全球安全的威胁。我们在一个最具多样性、创造力且具有技术挑战性的\
    \ IT 文化中工作。再加上持续的职业发展，你将获得真正有趣的工作，并处在一个真正具有启发性的业务环境中。\n\n访问 www.careersinbritishintelligence.co.uk\
    \ 获取有关社区所有部门的信息。\n\n申请者必须是英国公民。GCHQ 重视多样性，欢迎来自社区所有部门的申请者。我们希望我们的员工能够反映我们工作的多样性。\n\
    \n# 7. 集合框架\n\n## 引言\n\n本章将介绍介绍集合框架——这是 Java 标准库的重要部分。\n\n## 目标\n\n在本章结束时，你将能够：\n\
    \n- 理解 Java 集合框架的基本概念\n- 对比各种集合接口的特性\n- 理解迭代器（iterators）的相关概念\n\n本章由十二部分组成：\n\n\
    1) 集合简介\n2) 集合接口\n3) 新旧集合\n4) 列表 (Lists)\n5) 集合 (Sets)\n6) 映射 (Maps)\n7) 集合实现\n\
    8) 集合框架概述\n9) 使用未类型集合的示例\n10) 使用类型集合的示例\n11) 关于集合的注意事项\n12) 总结\n\n## 7.1 集合简介\n\
    \n大多数软件系统需要存储各种组实体，而不仅仅是单个项目。数组提供了这种方法，但 Java 集合支持更多样化更灵活的分组形式。\n\n在 java 中，集合（collections，或“容器”）是用于将其他对象组合在一起的类。Java\
    \ 平台提供了一套一致的接口和实现：\n\n- 接口定义了可用功能\n- 实现影响其他问题，包括性能\n\n## 7.2 集合接口\n\n集合框架的核心是一个名为\
    \ `Collection` 的接口。它定义了框架核心的方法。`List` 和 `Set` 是 `Collection` 的扩展接口——它们继承了所有的操作并增加了一些。\n\
    \n请注意，由于这些是接口而不是类，它们只定义了操作签名，而没有定义作为方法的任何实现方面。\n\n另一个重要的额外接口是 `Map`。它不是 `Collection`\
    \ 的扩展——这是由于我们稍后将看到的，，映射并不完全符合 `Collection` 层次结构，尽管它们仍然是“集合框架”的一部分。\n\n因此，我们有以下接口……：\n\
    \n- Collection：最通用的分组\n  - List：按特定顺序存储的对象集合（可以包含重复项）\n  - Set：特定顺序的唯一对象集合\n \
    \ - SortedSet：按升序排列对象的集合\n- Map：唯一“键”和关联对象的集合\n  - SortedMap：按键升序排列对象的映射\n\n正如\
    \ `List` 和 `Set` 扩展了 `Collection` 接口，`SortedSet` 是 `Set` 的扩展，`SortedMap` 是 `Map`\
    \ 的扩展。\n\n我们将在本章中查看 List、Sets 和 Maps。\n\n## 7.3 旧集合与新集合\n\n在 Java SDK 1.4 之前，集合持有\
    \ `Object` 类型的条目——即任何任何类的对象，因为所有类都是 `Object` 的子类。这允许集合中混合对象。然而，当从集合中取出对象时，编译器不知道该对象是什么，这可能会导致一些额外的复杂性。\n\
    \n在实践中，我们几乎总是希望特定的集合中有某些特定类型的对象。因此在 Java JDK 5.0 中引入了“泛型”（generics）。“泛型”允许在定义类时不指定它处理的数据项类型。相反，类型在类实例化时指定，因此对于特定对象是固定的。\n\
    \n因此，使用“泛型”，我们可以创建只存储指定类型对象的集合。\n\n## 7.4 列表 (Lists)\n\n列表是最通用的集合类型——在你可能已经过数组的地方，`List`\
    \ 将提供一种更方便的数据处理方法。\n\n列表是非常通用的数据结构，每个项目都占据一个特定的位置。它们在许多方面与数组相似，但更灵活，因为它们会随着数据的添加自动调整大小。它们也比数组更容易操作，因为已经创建了许多实用的方法来帮助你完成大部分工作。列表按特定顺序存储项目（尽管不一定按任何有意义的顺序排序），并且允许存在重复项。\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_112_0.png)\n\n列表中的对象，每个在序列中占据一个特定位置。\n\
    \nList 会随着程序的运行动态调整大小。\n\n## 7.5 集合 (Sets)\n\n集合像是一个对象的“袋子”而不是列表。它们基于数学中的“集合”概念——一个包含零、一个或多个不同项的“成员”分组。\n\
    \n与 `List` 不同，不允许有重复项，且 `Set` 不对项目进行排序（但 `SortedSet` 可以）。\n\n与列表一样，集合会随着项目的添加自动调整大小。\n\
    \n![](img/2bcd878aa3b5707827d8b6067ca7458e_113_0.png)\n\n每个对象都是独特的，且没有任何顺序。\n\n\
    Set 会随着程序的运行动态调整大小。\n\nList 可用的许多操作也适用于 Set，如下：\n\n- 我们**不能**在特定位置添加对象，因为元素没有任何顺序\n\
    - 出同样的原因，我们**不能**“替换”项目（尽管我们可以添加一个并删除另一个）\n- 检索项目是可能的，但顺序是不确定的\n- 查找元素所在的位置是毫无意义的。\n\
    \n## 7.6 映射 (Maps)\n\n映射（`Maps`）与列表（`Lists`）和集合（`Sets`）不同，因为它们不是存储单个对象，而是存储对象对。该对由一个“键”（key）和一个“值”（value）组成。键是标识该对的东西。值是与键关联的信息或对象。\n\
    \n示例：在地址簿中，键将是人的姓名，值是他们的地址、电话、邮件等。每个键只有一个值，但由于值是对象，它们可以包含几条数据。\n\n不允许有重复的键，尽管允许有重复的值值。因此，在之前的示例中，如果你在地址簿中查找两个人，你可能会发现他们住在同一个地址——但一个人不会有两个家。\n\
    \n和集合一样，映射（`Map`）不对项目进行排序（但 `SortedMap` 会，按键的顺序排序），并且像列表和集合一样，映射会随着项目的添加或删除而自动调整大小。\n\
    \n在 BookBoon.com 下载免费书籍\n\n114\n\n"
