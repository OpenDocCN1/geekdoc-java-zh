    Object Oriented Programming using Java


    # 8.9 Developing Graphical Interfaces Using NetBeans


    NetBeans has a visual tool to help with the development of graphical user interfaces.
    This allows a window to be created and a range of objects to be dropped onto it
    panels, tabbed panes, scrolled panes, buttons, radio buttons, check boxes, combo
    boxes, password fields, progress bars, and trees.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_136_0.png)


    # 8.10 Applying Layout Managers Using NetBeans


    When designing a graphical user interface it is ‘normal’ for objects to be placed
    on a window in precise positions. Interfaces are thus displayed exactly how they
    are designed. For this to work well an designer usually has some idea of the size
    of the objects they are designing an interface for. Most PC games are designed
    to run on window of 14” – 21”. Most mobile games are designed to work on much
    smaller screens.


    However Java programs are expected to be platform independent – one of the strengths
    of Java is that code written in Java will work on a PC, laptop or small mobile
    device irrespective of the hardware or operating systems these devices use (as
    long as they have a RE). Thus the same interface should work on a large visual
    unit or small mobile screen. For this reason when designing interfaces in Java
    it is usual to give Java some control over deciding exactly how / where to display
    objects. At time, Java can reconfigure a window to fit whatever device is being
    used to run the program. This has benefits as the will be reconfigured automatically
    to whatever device is being used to run the program but this flexibility comes
    at a cost. As some control is given to Java the interface designer cannot certain
    exactly how the interface will look though they can give Java some ‘instructions’
    on how an interface should be displayed.


    Layout Managers are ‘objects’ that define how an interface should be displayed
    and it is normal to create a layout manager and assign it to a ‘container’ object
    such as a window frame.


    There are a range of common layout managers - two of the most common being flow
    layout and grid layout. Using flow layout Java will arrange objects in a row and
    objects will automatically flow onto another row if the window is not big enough
    to hold each object row.


