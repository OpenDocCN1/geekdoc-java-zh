    本章包含十二个节：


    - 1) 对象族

    - 2) 一般化与特化

    - 3) 继承

    - 4) 在 Java 中实现继承

    - 5) 构造函数

    - 6) 构造函数规则

    - 7) 访问控制

    - 8) 抽象类

    - 9) 方法重写

    - 10) ‘Object’ 类

    - 11) 重写 ‘Object’ 中定义的 toString()

    - 12) 总结


    ## 3.1 对象族


    世界上许多事物都属于相关的“家族”群体。“继承”是从父类向子类传递特性的思想，它在面向对象的设计和编程中起着重要作用。


    虽然我们可能已经熟悉构造函数和访问控制（public/private），但与这些内容相关的继承方面有一些特殊问题。


    此外，我们还需要考虑抽象类和方法重写的使用，因为这些是继承背景下的重要概念。


    最后，我们将查看 ‘Object’ 类，它与 Java 中的所有其他类都具有一种特殊的关系。


    ## 3.2 一般化与特化


    类是一种通用的形式，可以从中创建具有不同细节的对象。对象然后是其类的“实例”。例如，Student 051234567 是 Student 类的一个实例。更简洁地说，051234567
    是一个 Student。


    类本身通常可以通过类似的关系来组织。


    我们都比较熟悉的一个层级结构是描述动物界的层级：


    - 界（Kingdom，例如：动物）

    - 门（Phylum，例如：脊椎动物）

    - 纲（Class，例如：哺乳）

    - 目（Order，例如：肉食动物）

    - 科（Family，例如：猫）

    - 属（Genus，例如：felix）

    - 种（Species，例如：felix leo）


    我们可以用图形表示这种层级结构....


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_51_0.png)


    当然，画出完整的图将比我们有的更多时间和空间。


    在这里我们可以看到一个特定的动物：''Fred''。Fred 不是一种动物类，而是一个真实的动物。


    Fred 是一个 felix leo，是一个 felix，一只猫是一个肉食动物。


    肉食动物吃肉，所以 Fred 具有“吃肉”的特性。


    Fred 是一个 felix leo，是一个 felix，一只猫是一个肉食动物，是一个哺乳动物，是一个脊椎动物。


    脊椎动物有脊柱，所以 Fred 具有“有脊柱”的特性。


    “是”的关系将个体连接到特性层级结构中。这种关系适用于许多现实世界的实体，例如，BonusSuperSaver 是 SavingsAccount 是 BankAccount。


    ## 3.3 继承


    我们在层级结构的高处指定一般的特性，在低处指定更具体的特性。面向对象设计中的一个重要原则——我们称之为一般化和特化。


    层级结构中某类/对象之上类的所有特性都会自动出现在它中——我们称之为继承。


    考虑书籍和杂志——它们都是特定的出版物类型。


    我们可以在 UML 类图中用类来表示这些内容。在此过程中，我们可以看到这些类可能具有的一些实例变量和方法。


    | Book | Magazine |

    | --- | --- |

    | title | title |

    | author | price |

    | price | orderQty |

    | copies | currIssue |

    | | copies |

    | sellCopy() | sellCopy() |

    | orderCopies() | adjustQty() |

    | | recvNewIssue() |


    属性 ''title''、''author'' 和 ''price'' 是显而易见的。不明显的是 ''copies''——这是目前库存中的数量。


    对于书籍，orderCopies() 接收一个参数，指定添加到库存的副本。


    对于杂志，orderQty 是每份新期杂志收到的副本数，currIssue 是当前期期的日期/期间（例如“2009年1月”、“1月6日周五”、“2009年春天”）。当收到新Issue
    时，旧的会被丢弃，orderQty 份副本被放入库存。因此，recvNewIssue 将 currIssue 设置为新期日的日期并恢复 copies 为 orderQty。adjustQty
    修改 orderQty 以更改后续期将库存的副本数量。


