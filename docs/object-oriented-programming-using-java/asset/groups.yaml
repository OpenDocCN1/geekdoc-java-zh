    ## 使用 Java 进行面向对象编程


    ### 面向对象简介


    “类”（class）是一种软件设计，描述了软件正在建模的对象的通用属性。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_20_0.png)


    具体的“对象”是根据类设计为每个实际实体创建的。


    然而，仅仅决定我们在系统中应该创建哪些类并不是一项简单的任务，因为现实世界是复杂且混乱的（关于如何处理此问题的更多建议，请参阅第 6 章）。本质上，我们需要创建一个现实世界的抽象模型，关注问题的本质方面，并忽略无关的复杂性。例如，在现实世界中，银行持有人有时需要借钱，偶尔他们的钱可能会被小偷偷偷走。如果我们创建一个银行账户系统，我们是否应该允许客户借钱？我们是否应该承认他们的现金可能被盗窃，并建立某种让他们获得即时贷款的方法——或者这一个无关紧要的细节，只会增加系统的复杂性而对银行提供任何益处？


    使用面向对象的分析和设计技术，你的工作就是观察现实世界并得出一个简化的抽象模型，我们可以将其转换为计算机系统。我们最终系统的好坏取决于我们的软件写得好不好。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_21_0.png)


