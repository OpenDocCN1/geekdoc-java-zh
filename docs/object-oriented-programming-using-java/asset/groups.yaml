- md: "\n# Object Oriented Programming using Java\n\n```java\npublic Client getClient(String\
    \ pClientID)\n    throws UnknownClientException {\n    Client foundClient;\n \
    \   foundClient = clientMap.get(pClientID);\n    if (foundClient != null) {\n\
    \        return foundClient;\n    } else {\n        throw new UnknownClientException(\n\
    \            \"ClientBook.getClient(unknown client ID:\" + pClientID);\n    }\n\
    }\n```\n\nFirstly we must tell the compiler that this method can generate an exception.\
    \ Then, under the appropriate condition, invoke the constructor of the exception\
    \ using the keyword 'new' and pass a string message required by the constructor.\
    \ The object returned by the constructor is then 'thrown'.\n\nTo be helpful the\
    \ strings specify method where this exception was generated from and the clientID\
    \ for which a client was not found.\n\nThe compiler will ensure that the programmer\
    \ writing the dailyPurge() method catches this exception – hopefully they will\
    \ then deal with it to prevent a crash situation.\n\nThe final step is to catch\
    \ and deal with UnknownClientException within the dailyPurge() method – as shown\
    \ in section 11.8 (Programming the Message Classes).\n\nIf a client does not exist\
    \ we might remove the message. However in this case we have chosen to be more\
    \ cautious since we simply don't know how we come to have an 'unowned' message.\n\
    \nWe have therefore decided that if the message has expired we will not take any\
    \ action other than to report the error. The message will continue to be displayed\
    \ (even without having a client to charge!).\n\nIf an unowned message has expired\
    \ we of course still need to remove it from the display set.\n\n## 11.11 Programming\
    \ the Main classes\n\nThere are two classes, not shown on the class diagrams given\
    \ previously, that 'drive' the system.\n\n# Object Oriented programming using\
    \ Java\n\n’Manager’ is the main class that manages the system. It performs the\
    \ following functions :-\n\n- it has a permanent reference to the client book\
    \ and message set.\n- it sets up the data file\n- it defines what happens when\
    \ the system starts and \n- it defines what happens when the system shuts down\n\
    - finally it has getClientBook() and getMessageSet() methods so the other parts\
    \ of the system can access the clientbook and message set.\n\nThe startup() method\
    \ is shown below :-\n\nThe startup() method tries to setup an Object Input stream\
    \ from which it tries to reconstruct ClientBook and MessageSet objects.\n\nIt\
    \ has two catch blocks. The first will catch a FileNotFoundException – this will\
    \ occur if the file of data cannot be found e the first time this program is.\
    \ In such a case the system will create a new and empty ClientBook object and\
    \ a new MessageSet object.\n\nThe second catch block will catch any other IO error\
    \ and in this case then will exit the program.\n\n## 11.12 Programming the Interface\n\
    \nThe other driver is GUIMain. This has a main() method which invokes the createGUI()\
    \ method. This creates three JPanels and adds buttons, text labels and to label\
    \ these according to the preliminary design. A Grid layout manager was applied\
    \ to manage these JPanels (as described in section 10 of chapter 8).\n\n# Object\
    \ Oriented Programming using Java\n\nThe GUI class also defines action listeners\
    \ for each of the buttons on the GUI.\n\nShown below is the action listener associated\
    \ with the FindClient:\n\n```java\nprivate class FindClientListener implements\
    \ ActionListener {\n    public void actionPerformed(ActionEvent arg0) {\n    \
    \    String id = JOptionPane.showInputDialog(null,\n                \"Enter client\
    \ ID\");\n\n        if (id == null) id = \"\"; //in case Cancel pressed\n\n  \
    \      try {\n            JOptionPane.showMessageDialog(null,\n              \
    \  manager.getClientBook().getClient(id).toString());\n        } catch (UnknownClientException\
    \ uke) {\n            JOptionPane.showMessageDialog(null,\n                \"\
    No such client\");\n        }\n    }\n}\n```\n\nThis action listener does the\
    \ following :-\n\n- It opens a dialog box to ask the user for a clients ID.\n\
    - If cancel is pressed it replaces the null returned with an ID of \"\".\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_200_0.png)\n\
    \n# Object Oriented Programming using Java\n\nCase Study\n\n- It asks the manager\
    \ object to return the client book.\n- On the client book it invokes the getClient()\
    \ method passing the ID as a parameter\n- Assuming a client is returned the toString()\
    \ method is invoked to get a string representation of the client and this is passed\
    \ as a parameter to the showDialog() method (which displays the details of the\
    \ client with that ID).\n- If getClient() fails to find a client this method will\
    \ throw an UnknownclientException – this will be caught and an appropriate message\
    \ will be displayed.\n\n## 11.13 Using Test Driven Development and Extending the\
    \ System\n\nNow we have a working system – two important methods have yet to be\
    \ created. We need a method to increase a clients credit – this should be placed\
    \ within the Client class. We also need a method to delete a client – as this\
    \ means removing them from the client book this should be placed in the ClientBook\
    \ class.\n\nIt has been decided to use Test Driven Development to extend the system\
    \ by providing this functionality (as discussed in Chapter 10 Agile Programming).\n\
    \nIn TDD we must :-\n\n1) Write tests\n2) Set up automated unit testing, which\
    \ fails because the classes haven’t yet been written!\n3) Write the classes so\
    \ the tests pass\n\nAfter creating these methods we must then adapt the interface\
    \ so that this will invoke these methods.\n\nDownload free books at BookBoon.com\n\
    \n202\n\n# Object Oriented Programming using Java\n\nTwo test cases are given\
    \ :-\n\n```java\npublic void testIncreaseCredit() {\n    Client c = new Client(\"\
    Simon\", \"217\", \"x256\", 10);\n    c.increaseCredit(10);\n    assertEquals(20,\
    \ c.getCredit());\n}\n```\n\n```java\npublic void testDeleteClient() {\n    ClientBook\
    \ cb = new ClientBook();\n    Client c = new Client(\"Simon\", \"217\", \"x256\"\
    , 10);\n    cb.addClient(\"sk\", c);\n    try {\n        cb.deleteClient(\"sk\"\
    );\n    } catch (UnknownClientException uke) {\n        fail();\n    }\n    try\
    \ {\n        c = cb.getClient(\"sk\");\n        fail();\n    } catch (UnknownClientException\
    \ uke) {\n    }\n}\n```\n\nThe first of these creates a client with 10 units of\
    \ credit, adds an additional 10 units of credit and then checks that this has\
    \ 20 units of credit.\n\nOne test alone does not sufficiently prove the increaseCredit()\
    \ method will always work so we need additional tests.\n\nHaving created test\
    \ cases these will generate compiler errors as the methods increaseCredit() and\
    \ deleteClient() do not exist.\n\nWe must now revise the methods and revise until\
    \ these tests pass.\n\nThe increaseCredit() method is given below:\n\n```java\n\
    public void increaseCredit(int pExtraCredit) {\n    credit = credit + pExtraCredit;\n\
    }\n```\n\nTheory suggest that TDD leads to simple code.\n\nIn this case by focusing\
    \ our minds on what the increaseCredit() method needs to achieve we reduce the\
    \ risk of overcomplicating the code. Of course we may need a range of test case\
    \ to make sure the method has all of the essential functionality it needs.\n\n\
    ## 11.14 Generating Javadoc\n\nDocumentation is essential and can be generated\
    \ automatically (as described in Chapter 8 Java Development Tools assuming appropriate\
