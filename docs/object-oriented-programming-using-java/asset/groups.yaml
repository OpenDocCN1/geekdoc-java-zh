    ## 反馈 9


    你可能想了一本想要预留的书，在这种情况下，管理员可能需要知道该书的标题和作者。


    因此，对于我们在系统中创建的每个对象，我们都需要定义该对象的属性，即我们需要了解关于它的信息。


    ## 练习 10


    注意，我们可以将预留视为一个逻辑对象（而实际物品是物理对象）。考虑这个逻辑对象（物品预留），列出管理员可能需要对该对象执行的二或三项操作。


    ## 反馈 10


    管理员可能需要取消这次预留（如果你改变了主意），他们也可能需要告诉你物品是否已到货供你领取。


    因此，对于每个对象，我们都需要定义在该对象上执行的操作（以及它的属性）。


    ## 使用 Java 进行面向对象编程


    ### 面向对象简介


    ## 练习 11


    考虑到可以从图书馆借出的最通用类别对象——“借出的物品”，列出图书馆可以借出的二或三个具体的子类别对象。


    ## 反馈 11


    定义了最通用的对象类别（我们称之为类）——可以被借的东西——我们可能想要定义更专门的子类（例如：书籍、杂志、视听材料）。这些子类将共享为通用类定义的属性，但会有特定的差异（例如，借用视听材料可能会产生费用）。


    ## 1.6 面向对象编程方法的优势


    无论你是否以面向对象的方式开发程序，在编写软件之前，你必须首先开发一个关于软件必须处理什么以及它应该如何运行的模型。面向对象建模基于抽象、封装、继承的思想。


    面向对象方法的支持者声称，这种模型提供了：


    - 更好的抽象（将信息和行为建模）

    - 更好的可维护性（减少脆弱性）

    - 更好的重用性（类作为组件）


    ## 1.7 总结


    面向对象编程涉及通过建模现实世界来创建类。这允许系统随着业务需求而改变。


    ## 统一建模语言 (UML)


    ### 引言


    本章将向你介绍统一建模语言 (UML)，并解释四种常用图的作用（类图、对象图、序列图和包图）。


    ### 目标


    在本章结束时，你将能够：


    - 解释什么是 UML 并解释四种常用图的作用

    - 绘制类图、对象图、序列图和包图。


    本章涵盖的内容将在后续章节中扩展，在这里开发的技能将在后续中使用（特别是关于类图）。


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_23_0.png)


    ## 使用 Java 进行面向对象编程


    本章由六部分组成：


    1. UML 引言

    2. 类图

    3. UML 语法

    4. 包图

    5. 对象图

    6. 序列图


    ### 2.1 UML 引言


    统一建模语言 UML 有时被描述为像是一种方法论。它并不是！


    方法论是为了实现特定结果的一套过程系统，例如收集用户需求的组织活动序列。而 UML 是一种精确的绘图表示法，允许对程序设计进行表示和讨论。由于它是图形化的，因此易于可视化、理解和讨论图中呈现的信息。然而，由于图表代表的是技术信息，它们必须是精确且清晰的——为了让它们生效，必须遵循一种精确的表示法。


    由于 UML 不是方法论，因此留给用户按照他们认为合适的方式来生成图表所描述的设计。UML 并没有限制这一点——它仅仅允许这些设计以易于使用、精确的图形表示法表达出来。


    ### 2.2 UML 类图


    类是任何面向对象软件系统的基本组件，UML 类图提供了表示这些组件的简单方法。除了显示单个类之外，类图还展示了多个类以及它们之间的关系。因此，类图展示了系统的架构。


    一个类由：


    - 唯一的名称（习惯以大写字母开头）

    - 属性列表（int, double, boolean, String 等）

    - 方法列表


    这通过一个简单的框形结构显示：


    | ClassName |

    | --- |

    | attributes |

    | methods() |


