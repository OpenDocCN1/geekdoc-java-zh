    # 10.4 Support for Refactoring


    Even the simplest refactoring operation, e.g. renaming a class, method, or variable,
    requires careful analysis to make sure all the necessary changes are made consistently.


    Eclipse provides sophisticated automatic support for this activity.


    Don''t confuse with this simple text editor/replace – Eclipse understands the
    Java syntax and works intelligently...e.g. if you have local variables with the
    same name in two different methods and rename one of them, Eclipse knows the other
    is a different variable and does not change it. If you rename a public instance
    variable this may require changes in other classes and even in other packages
    as methods from these classes may access and use this variable.


    Rearranging existing classes within a package structure is also a refactoring
    activity


