    # Activity 7


    Look at the list of classes below and place four into an appropriate inheritance
    hierarchy. Identify the one class that would not fit into this hierarchy:


    +   - Runner

    - Amateur

    - Professional

    - FancyDresser

    - Sponsorshipform


    The most general class i.e. the the top of the inheritance tree is ''Runner''.
    Amateur and Professional are subclasses of ''Runner'' and FancyDresser is a specific
    type of Amateur hence a subclass of Amateur.


    We can fit these into an inheritance hierarchy because these classes are all related
    by an is-relationship. A FancyDresser-is Amateur which in turn is-a Runner. A
    Professional-is as well.


    A SponsorshipForm is not a type of Runner and does not fit into this hierarchy.
    This class will be related to one of the other classes by some form of an association.
    Looking at the design we can see that not all runners have a sponsorship form
    only amateurs who are running for charity. There is therefore an association between
    Amateur and SponsorshipFrom. Of course FancyDressers inherit the attributes defined
    in Amateur and hence they automatically have a SponsorshipForm.


    # 6.10 Refining Our Design using CRC Cards


    Having identified the main classes in our system, and the attributes and methods
    of these classes, we could proceed to refine these designs by defining the data
    types and small details, document this information on a UML diagram and program
    the system. However in a real world the problem would be larger and less well-defined
    the problem we are working on here the analysis and refinement of design would
    therefore be a longer complex process that we can realistically simulate.


    As real world are more complex our initial designs are unlikely to be perfect
    therefore it makes sense to check our designs and resolve any potential problems
    before turning these designs into a finished system.


    One method of checking our designs is to document our designs using CRC cards
    and to check if these work by role-playing different scenarios.


    CRC cards are not the only way of doing this and are not part of the UML specification.'
