    # Object Oriented Programming using Java


    Most the code below is self explanatory perhaps the display method needs some
    explanation. Firstly, Set and Map classes implement the iterator() method which
    returns an object of type Iterator and this object is capable of iterating over
    Lists, Sets or Maps. Note - this is not a simple process as each collection can
    be made up of different objects, thankfully the hard work has done for us.


    Thus in the display() method a variable ''it'' is created of the general type
    Iterator. The method iterator() is then invoked on our specific collection returning
    an object capable of iterating our List of Strings. The Iterator has two very
    useful methods : hasNext() which return true another object exists in the collection
    and next() which returns the next object in the collection.


    Thus the loop iterates over the list running and displaying each object.


    There is one final thing to note: because we are using un-typed collection each
    object in the list could be a different type of object and when an object is retrieved
    from the list the JRE does not know what type of object it is - however as we
    are only this list to store Strings we can cast each object retrieved onto a String.
    This will cause a compiler warning as this will fail if we add non String objects
    to the list.


    While this program stores and manipulates a list of Strings the program could
    just easily store a list of Publication - or any object constructed from a class
    we create.


    # 7.10 An Example Using Typed Collections


    Using these collections is simple for two reasons : 1) we know what type of object
    will be returned from the list and we don''t need to use the cast operator and
    2) because Java 5.0 introduced an improved for loop that can loop through every
    item in a typed collection without using a loop counter (or iterator).'
