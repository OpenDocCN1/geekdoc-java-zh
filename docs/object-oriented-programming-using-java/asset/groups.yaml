    We can manipulate objects by invoking operations defined for the superclass without
    worrying about which subclass is involved in any specific case.


    Java ensures that the appropriate method for the actual class of the object is
    invoked at run-time.


    Sometimes we want to employ polymorphism without all the classes concerned having
    to be in an inheritance hierarchy. The ‘interface’ construct allows us to provide
    shared interfaces (i.e. collections of operations) in this situation. When doing
    this there is no inherited implementation – each class must implement ALL the
    operations defined by the Interface.


    Any number of classes can implement a particular interface.


