  md: '# Object Oriented Programming using Java


    Generalisation / stabilisation allows us to define general characteristics and
    operations of an object and us to create more specialised versions of this object.
    The specialised versions of this object will automatically inherit all of the
    characteristics of the more generalised object.


    The final principle underlying Object Orientation is Polymorphism which is the
    ability to interact with a object as its generalised category regardless of its
    more specialised category.


    | Activity 7 |

    |---| Make one statement about how a hospital manager may interact with all doctors
    employed at his hospital irrespective of what type of doctor they are. |


    | Feedback 7 |


    You have considered that a hospital manager could pay all doctors (presumably
    this will be done automatically at the end of every month) and could discipline
    any doctor guilty of misconduct – of this would be true for other staff as well.
    More specifically a manager could check that doctors medical registration is still
    current. This would be something management would need to do for all doctors irrespective
    of what their special is.


    Furthermore if the hospital employed new specialist doctor (e.g. a Neurologist),
    knowing anything specific about this special, management would still know that
    a) these staff needed to be paid and b) their medical registration must be checked.
    i.e. they are still doctors and need to be treated such.


    Using the same idea polymorphism allows computer systems to be extended, with
    new specialised objects being created, allowing current parts of the system to
    interact with new object without concern for the specific properties of the new
    objects.


    # 1.5 What Exactly Object Oriented Programming?


    | Activity 8 |


    | Think of an object you possess. Describe its current state and list two or three
    things you can do with that object. |


    | Feedback 8 |


    You probably thought about an entirely physical object such as a watch, a pen,
    or a car.


    Objects have a current status. A watch has a time (represented internally by wheels
    and cogs in an electronic component). A pen has a certain amount of ink in it
    and has its lid or off. A car has a current speed and has a certain amount of
    fuel inside it.


    Specific behaviour can also be associated with each object (things that you can
    do with it) - a watch can be checked to find out its time, its time can also be
    set. A pen can be used to write with and a car can be driven.


