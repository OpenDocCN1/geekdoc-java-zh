  md: '# Object Oriented Programming using Java


    We have three objects in this scenario. Time runs from top to bottom, and the
    vertical dashed lines

    (lifelines) indicate the objects'' continued existence through time.


    This diagram shows the following actions taking place :-


    +   - Firstly method call (often referred to in OO terminology as a message) to
    method0() comes

    toject1 from somewhere – this could be another class outside the diagram.

    - object1 begins executing method0() (as indicated by the vertical bar (called
    an activation

    bar) which starts at this point.

    - object1.method(0) invokes object2.method(1) – the activation bar indicates that
    this executes

    for a period then returns to method0()

    - Subsequently object1.method(0) invokes object2.method(2) passing two parameters

    - method(2) subsequently invokes object3.method(3). When method(3) ends it passes
    a return

    value to method(2)

    - method(2) completes and returns to object1.method(0)

    - Finally method(0) calls another object of the same object, method4(4)


    # Selection and Iteration


    The logic of a scenario often depends on selection (‘if’) and iteration (loops).


    There is a notation (‘interaction frames’) which allows if and loops to be represented
    in sequence

    diagrams however these tend to make the diagrams cluttered.


    Sequence diagrams are generally best used for illustrating particular cases, with
    the full refinement

    reserved for the implementation code.


    Fowler (“UML Distilled”, 3rd Edn.) gives a brief treatment of these constructs.


    # 2.7 Summary


    UML is not a methodology but a precise diagram notation.


    Class diagrams and package diagrams are good for describing the architecture of
    a system. Object

    diagrams describe the data within an application at one moment in time and sequence
    diagrams

    describe how a system works over a period of time.


    UML gives different meaning to different arrows therefore one must be careful
    to use the notation

    isely as specified.


    With any UML diagram suppression is encouraged – thus the author of a diagram
    can suppress any

    details they wish in order to convey information to the reader.'
