  md: "# Object Oriented Programming using Java Overloading\n\nWhile the two methods\
    \ may have the same name they can still be distinguished by looking at the parameter\
    \ list :-\n\n```\nadd(int number1, int number2)\nadd(float number1, float number2)\n\
    ```\n\nThis is resolved at run time by the JRE. i.e. at run time JRE looks at\
    \ the method call and the actual parameters are being passed. If two integers\
