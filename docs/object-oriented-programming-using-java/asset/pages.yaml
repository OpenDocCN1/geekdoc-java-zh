  md: '# 6. Object Oriented Software Analysis and Design


    Introduction


    This chapter will teach rudimentary analysis and modelling skills through practical
    examples. Leading the reader to an understanding of how to get from a preliminary
    specification to an Object Oriented Architecture.


    Objectives


    By the end of this chapter you will be able to....


    +   * Analyse a requirements description

    * Identify items outside scope of system

    * Identify candidate classes, attributes and methods

    * Document the resulting Object Oriented Architecture


    This chapter contains two sections :-


    +   1) Requirements Analysis

    2) The Problem

    3) Listing Nouns and Verbs

    4) Identifying Things Outside The Scope of The System

    5) Identifying Synonyms

    6) Identifying Potential Classes

    7) Identifying Potential Attributes

    8) Identifying Potential Methods

    9) Identifying Common Characteristics

    10) Refining Our Design using CRC Cards

    11) Elaborating Classes

    12) Summary


    # 6.1 Requirements Analysis


    The development of any computer program starts by identifying a need :-


    +   * An engineer who specialises in designing bridges may need some software
    to create three dimensional models of the designs so people can envisage the finished
    bridge before it is actually built.


    +   * A manager may need a piece of software to keep track of personal, what projects
    they are assigned to, what skills they have and what skills needs to be developed.'
