  md: '# Object Oriented Programming using Java


    This chapter consists of six sections :-


    +   1) An introduction to UML

    2) UML Class Diagrams

    3) UML Syntax

    4) UML Package Diagrams

    5) UML Object diagrams

    6) UML Sequence Diagrams


    # 2.1 An Introduction to UML


    The Unified Modelling Language, UML, is sometimes described as though it was a
    methodology. It is not!


    A methodology is a system of processes in order to achieve a particular outcome
    e.g. an organised sequence of activities to gather user requirements. UML on the
    other hand a precise diagramming notation that will allow program designs to be
    represented and discussed. As it is graphical in nature it becomes easy to visualise,
    understand and discuss the information presented in the diagram. However as the
    diagrams represent technical information they must be precise and clear – in order
    for them to work there is a precise notation that must be followed.


    As UML is not a methodology it is left to the user to follow whatever they deem
    appropriate in order to generate the designs described by the diagrams. UML does
    not constrain this – it merely allows those designs to be expressed in an easy
    to use, precise, graphical notation.


    # 2.2 UML Class diagrams


    Classes are the basic components of any object oriented software system and UML
    class diagrams provide an easy way to represent these. As well as showing individual
    classes, in detail, class diagrams show multiple classes and how they are related
    to each other. Thus a class diagram shows the architecture of a system.


    A class consists of :-


    +   - a unique name (conventionally starting with an uppercase letter)

    - a list of attributes (int, double, boolean, String etc)

    - a list of methods


    This is shown in a simple box structure...


    | ClassName |

    | --- |

    | attributes |

    | methods() |'
