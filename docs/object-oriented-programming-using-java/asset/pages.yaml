  md: "Object Oriented Programming using Java\n\nCreating And Using Exceptions\n\n\
    Having defined a subclass we have a choice... a) we could define a catch block\
    \ to catch objects of the general type 'Exception' i.e. it would catch ALL exceptions\
    \ or b) we could define a catch block that would catch UnknownExceptions but would\
    \ ignore other types of exception.\n\nBy looking at the online API we can see\
    \ that many predefined subclass of exception already exists. There are many of\
    \ including:-\n\n+   * IOException\n  * CharConversionException\n  * EOFException\n\
    \  * FileNotFoundException\n  * ObjectStreamException\n* NullPointerException\n\
    * PrinterException\n* SQLException\n\nThus we write a catch block that would react\
    \ to any type of exception, or we could limit it to input ] outputs or we could\
    \ be even more specific and limit it to FileNotFoundExceptions.\n\n# 9.4 Throwing\
    \ Exceptions\n\nHaving defined our own exception we must instruct the getClient()\
    \ method to throw this exception (assuming a client has not been found with the\
    \ specified ID).\n\nTo do this we must first tell the compiler that this class\
    \ may generate an exception – the compiler will ensure that any future programmer\
    \ who makes use of this method catches this exception.\n\nTo tell the compiler\
    \ this method throws an exception we add the following statement to the methods\
    \ signature ‘throws UnknownClientException’.\n\n```\npublic Client getClient(String\
    \ pClientID)\nthrows UnknownClientException\n```\n\nWe must create a new instance\
    \ of the UnknownClientException class and apply the throw keyword to this newly\
    \ created object.\n\nWe use the keyword ‘throw’ to throw an exception at the appropriate\
    \ point within the body of the method.\n\nDownload free books at BookBoon.com\n\
    \n151"
