    # 11.17 Summary


    The fundamental principles of the Object Orientated development paradigm are


    +   - abstraction

    - encapsulation

    - generalization/specialization (inheritance)

    - polymorphism


    These principles are ubiquitous throughout the Java language and library package
    APIs as well as providing a framework for our own software development projects.


    A well-established range of tools and reference support is available for OO development
    in Java, some of it to modern ‘agile’ development approaches.


    Throughout this chapter you will happily have seen how Object Orientation supports
    the programmer by :-


    +   - using abstraction and encapsulation enables us to focus on and program different
    parts of a complex system without worrying about ‘the whole''.

    - using inheritance to ‘factor out’ common code

    - using polymorphism to make programs easier to change

    - using tools help document and manage large software projects.


    This has been exemplified using Java but the same principles and benefits apply
    to all OO programming languages and the tools demonstrated here are available
    in many modern IDE’s.


    Through reading this book, and doing the small exercises, you will happily gained
    some understanding of these principles.


    I hope you have found this book helpful and I wish you all the best for the future.'
