  md: 'Object Oriented Programming using Java


    # 8.4 The JDK


    To develop Java programs you must first install the Java Development Kit (JDK).
    This was developed by Sun and is available freely from the internet via http://java.sun.com/.
    Prior to version 5.0 (or 1.5) this was known as the Java Software Development
    Kit (SDK).


    A Java IDE''s e.g. Eclipse or JavaBeans, sits on top of the JDK to add the IDE
    features - these may include interface development tools, code debugging tools,
    testing and refactoring tools (more on these later). When using an IDE it is easy
    to forget that much of the functionality is in fact part of the JDK and when the
    IDE is asked to compile a program it is just passing on this request to the JDK
    sitting underneath.


    We can use the JDK directly from the command line to compile and run Java programs
    though most it is easier to use the additional functionalities offered by an IDE.


    Somewhat confusingly the current version of Java is known both as 6.0, 1.6 and
    even 1.6.0. These supposedly have subtly different meanings – don''t worry about
    it!


    There are many tools in the JDK. A description of each of these is available from
    http://java.sun.com/javase/downloads/ and following the links for Documentation,
    APIs and JDK Programmer guides.


