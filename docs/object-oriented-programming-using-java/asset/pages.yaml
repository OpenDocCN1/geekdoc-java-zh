  md: "By defining UnkownClientException and using the throw clause in the header\
    \ of the getClient() method we are providing a warning to all methods calling\
    \ this one that an exception may be thrown. This enables the Java compiler to\
    \ make sure a try/catch block is provided where required.\n\nBy doing this we\
    \ are preventing potentially critical errors from going unnoticed!\n\n# 9.5 Catching\
    \ Exceptions\n\nHaving specified to the compiler that this method may generate\
    \ an exception we are forcing other programmers to protect against critical errors\
    \ by placing calls to this method within a try / catch block. The code in the\
    \ try will be terminated if an exception is generated and the code in the catch\
    \ block will be initiated.\n\nThus in the example the awardLoan() method can decide\
    \ what to do if no client with the specified ID is found.....\n\n```\ntry {\n\
    \    Client c = listOfClients.getClient(clientID);\n    c.determineCreditRating();\n\
    \n    // add code to award or reject a loan application based on this\n    credit\
    \ rating\n} catch (UnknownClientException uce) {\n    System.out.println(\"INTERNAL\
    \ ERROR IN BankManager.awardLoan()\\n\" + \"Exception details: \" + uce);\n}\n\
    ```\n\nNow, instead of crashing with a NullPointerException if the client ID is\
    \ not found, UnkownClientException we have deliberately thrown will be handled\
    \ by the Java Virtual Machine which will terminate the code in the try clause\
    \ and invoke the code in the catch clause, which in this case will display a message\
    \ warning about the problem.\n\n# 9.6 Summary\n\nJava exceptions provide a mechanism\
    \ to deal with abnormal situations which occur during program execution."
