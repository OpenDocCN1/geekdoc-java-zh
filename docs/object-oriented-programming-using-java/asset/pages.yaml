    # 1.3 Why we use the Object Orientation Paradigm?


    While we focus our attention on the actual program code we are writing, whatever

    methodology is adopted, it is not the creation of the code that is the general
    source of most problems.

    Most problems from :-


    +   - poor analysis and design: the computer system we create doesn''t do the
    right thing.

    - poor maintainability: the system is hard to understand and revise when, is inevitable,

    requests for change arise.


    Statistics show 70% of the cost of software is not incurred during its initial
    development phase but is

