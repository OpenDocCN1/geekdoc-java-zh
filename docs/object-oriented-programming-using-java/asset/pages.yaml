  md: '# 11.10 Creating and Handling UnknownClientException


    The getClient() method in the ClientClass will return a null value if no client
    exists with the specified ID. In such a case the daily purge our program will
    crash as we try to invoke the decreaseCredit() method without having a client
    object to invoke this on (it will crash with a NullPointerException).


    We therefore need to build in protection against this eventuality. To protect
    against this we


    +   - Create a new kind of exception (as described in Chapter 9) called UnknownClientException

    - tell the ClientBook class to throw this exception if a client is not found

    - catch and deal with this exception in the dailyPurge() method.


    The first step is simple and not shown here.


    Telling the getClient() and deleteClient() method to generate this exception is
    relatively straight forward (as shown below) :-


