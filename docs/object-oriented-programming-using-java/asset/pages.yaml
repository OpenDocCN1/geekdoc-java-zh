  md: '# Object Oriented Programming using Java


    # Overloading


    # Feedback 3


    There are many methods that are not overloaded but there are also many that are.
    These include : format(), indexOf(), replace(), split(), substring() and valueOf().


    Looking at the difference subString method we see that we can find a substring
    by either specifying the starting point alone or by specifying start and end points.


    When we use the substring() method the JRE will select the correct implementation
    of this method, at run time, depending upon whether or not we have provided one
    or two parameters.


    # 5.3 Summary


    Method overloading is the name given to the concept that several methods may exist
    essentially perform the same operation and thus have the name. The JRE distinguishes
    these by looking at the parameter list. If two or more methods have the same name
    then their parameter list must be different.


    At run time each method call, which may be ambiguous, is resolved by the JRE by
    looking at the parameters passed and matching the data types with the method signatures
    defined in the class.


    By overloading constructors and ordinary methods we are providing extra flexibility
    to the programmers who may use our classes. Even if these are not all used initially,
    providing these can make the program more flexible to meet changing user requirements.


