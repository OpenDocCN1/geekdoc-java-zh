  md: '# 7.4 Lists


    Lists are the most commonly used type of collection – where you might have used
    an array, a List will provide a more convenient method of handling the data.


    Lists are very general-purpose data structures, with each item occupying a specific
    position. They are in many ways like arrays, but are more flexible as they are
    automatically resized as data is added. They are also much easier to manipulate
    than arrays as many useful methods have been created to do the bulk of the work
    for you. Lists store items in a particular sequence (though not necessarily sorted
    into any meaningful order) and duplicate items are permitted.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_112_0.png)


    Objects in list, each occupying a specific position in sequence.


    List will be resized dynamically as program runs.


    # 7.5 Sets


    A set is like a ''bag'' of objects rather than a list. They are based on the mathematical
    idea of a ''set'' – a grouping of ''members'' that can contain zero, one or more
    distinct items.


    Unlike a List, duplicate items are not permitted in a set and a Set does not arrange
    items in order (but a SortedSet does).'
  merge: -1
