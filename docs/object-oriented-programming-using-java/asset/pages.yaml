    You can also think of other physical things as objects : such as a bank account.
    A bank account is not something that can be physically touched but intellectually
    we can consider a bank account to be an object. It has a current status (the amount
    of money in it) and it has behaviour associated with it (most obvious deposit
    money and withdraw money).


    Object oriented programming it a method of programming that involves the creation
    of intellectuals objects that model a business problem we are trying to solve
    (e.g. a bank account, a bank customer and a bank manager – all be objects in a
    computerised banking system). With each object we model that data associated with
    it (i.e. its status at any particular point in time) and the behaviour associated
    with it (what our computer program should allow that to do).


    In creating a object oriented program we define the properties of a class of objects
    (e.g. all bank accounts) and then create individual objects from this class (e.g.
    your bank account).


