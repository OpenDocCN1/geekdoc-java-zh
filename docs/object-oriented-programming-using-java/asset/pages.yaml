  md: '# 11.6 Revising the Design to Accommodate Changing Requirements


    Changing software requirements are a fact of life and OO programming is intended
    to help software engineers make adaptations easier, quicker, cheaper and with
    less risk of generating errors. The principles of inheritance, method overriding
    and polymorphism are essential OO features that help in this manner.


    In this project we feedback from the shop owner on the prototype interface they
    comment that they generally like the interface but that they have an additional
    system requirement :-


    +   Some messages are ''urgent messages''. These should be highlighted on the
    display by placing three stars before and after the message and the cost of these
    messages will be twice the of ordinary messages. Other than urgent messages are
    just like ordinary messages.


    Modifying the interface design to accommodate this change is easy – we can either
    :-


    +   - create a new panel to accommodate the creation of ''Urgent Messages'' or

    - since the data required is identical to normal messages we can just add an extra
    button to the middle panel.


    But how will these extra requirements impact on the underlying classes within
    the system?


    If OO principles work implementing this additional requirement should be relatively
    simple. Firstly there is clearly a strong relationship between a ''Message'' and
    an ''Urgent Message''


    If both classes have some unique features but there was a significant overlap
    in functionality we could introduce an inheritance hierarchy to deal with this
    :-


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_185_0.png)


    However in this case there are no unique features of an ordinary message – messages
    have an associated cost, the cost and text can be obtained and new messages can
    be created. All this is true for urgent messages. An urgent message is just the
    same as an ordinary message where the text and the cost has been changed slightly.
    Thus UrgentMessage is a type of Message and can inherit ALL of the features of
    Message with the cost and text methods being overridden.'
