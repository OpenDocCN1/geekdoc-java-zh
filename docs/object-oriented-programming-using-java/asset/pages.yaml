  md: '# Object Oriented Programming using Java


    # Case Study


    This implies implies these classes should be linked within the system within the
    inheritance hierarchy or via ''an interface''(see section 4.5 Interfaces). In
    this case the clue is within the description "These will have a ''connection''
    to the rest of the system via a ''well-defined interface".


    Ultimately our system should display messages in a real display board however
    it should be tested on a dummy board. For this to work the dummy board must implement
    the same methods as a real display board.


    Thus we should define a dummy ''interface''. No common code could exist between
    the two classes – why we are not putting these within an inheritance hierarchy.
    However the dummy board and the real display board should both implement the methods
    defined via a common interface. When our system is working we can replace the
    dummy board with the real board that implements the same methods. As the connection
    with the dummy board is via interface changing the dummy board with the real display
    board should have no impact on our system.


    From our preliminary analysis of the description we have identified candidate
    classes, interfaces, methods and attributes. The methods and attributes can be
    associated with classes.


