  md: '# 1. An Introduction to Object Orientated Programming


    Introduction


    This chapter will discuss different programming paradigms and the advantages of
    the Object Oriented approach to software development and modelling. The concepts
    on which object orientation depends (abstraction, encapsulation, inheritance and
    polymorphism) will be explained.


    Objectives


    By the end of this chapter you will be able to....


    +   * Explain what Object Oriented Programming is,

    * Describe the benefits of the Object Oriented programming approach and

    * Understand and the basic concepts of abstraction, encapsulation, generalisation
    and polymorphism on which object oriented programming relies.


    All of these issues will be explored in much more detail in later chapters of
    this book.


    This chapter consists of six sections :-


    +   1) A Brief History of Computing

    2) Different Programming Paradigms

    3) Why use the Object Oriented Paradigm

    4) Object Oriented Principles

    5) What Exactly is Object Oriented Programming?

    6) The Benefits of the Object Oriented Programming Approach.


    # 1.1 A Brief History of Computing


    Computing is a constantly changing our world and our environment. In the 1960s
    large machines mainframes were created to manage large volumes of data (numbers)
    efficiently. Bank account and payroll programs changed the ways organisations
    worked and parts of these organisations much more efficient. In the 1980s personal
    computers became common and changed the way individuals worked. People started
    to own their own computers and used word processors and spreadsheets applications
    (to write letters and manage home accounts). In the 1990s email became common
    and the world web was born. These technologies revolutionised communications allowing
    individuals to publish information could be easily accessed on a global scale.
    The ramifications of these new technologies are still not fully understood as
    society is adapting to opportunities of internet commerce, new social networking
    technologies (twitter, facebook, myspace, online gaming etc) and the challenges
    of internet related crime.


