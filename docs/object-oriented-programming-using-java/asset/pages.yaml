  md: '# Object Oriented Programming using Java


    Java Development Tools


    +   - compilation into machine-language object code

    - direct execution of source code by ‘interpreter’

    - compilation into intermediate object code which is interpreted by run-time system


    Implementing Java programs involves compiling the source code (Java) into intermediate
    object code which is interpreted by a run-time system called the JRE. This approach
    has some advantages and disadvantages and it is worth comparing these three options
    in order to appreciate the implications for the Java developer.


    # Compilation


    The compiler translates the source code into machine code for the relevant hardware/OS
    combination.


    Strictly speaking there are two stages: compilation of program units (usually
    files), followed by ‘linking’ when the complete executable program is put together
    including the separate program units and relevant library code etc.


    The compiled program runs as a ‘native’ application for that platform.


    This is the oldest model, used by early languages like Fortran and Cobol, and
    many modern ones like C++. It allows fast execution speeds but requires re-compilation
    of the program each time the code is changed.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_127_0.png)


    # Interpretation


    Here the source code is not translated into machine code. Instead an interpreter
    reads the source code and performs the actions as it specifies.


    We can say that the interpreter is like a ‘virtual machine’ whose machine language
    is the source language.


