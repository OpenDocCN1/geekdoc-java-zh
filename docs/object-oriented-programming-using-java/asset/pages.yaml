    # 3.1 Object Families


    Many kinds of things in the world fall into related groups of ‘families’. ‘Inheritance’
    is the idea ‘passing down’ characteristics from parent to child, and plays an
    important part in Object Oriented design and programming.


    While we are probably already familiar with constructors and access control (public/private),
    and there are particular issues relating to these inheritance.


    Additionally we need to consider the use of Abstract classes and method overriding
    as these are important concepts in the context of inheritance.


    Finally we will look at the ‘Object’ class which has a special role in relation
    to all other classes in Java.


    # 3.2 Generalisation and Specialisation


    Classes are a generalized form from which objects with differing details can be
    created. Objects are then ‘instances’ of their class. For example Student 051234567
    is an instance of class Student. More concisely, 051234567 is a Student.


    Classes themselves can often be organised by a similar kind of relationship.


    One hierarchy, that we all have some familiarity with, is that which describes
    the animal kingdom :-


    +   - Kingdom (e.g. animals)

    - Phylum (e.g. vertebrates)

    - Class (e.g. mammal)

    - Order (e.g. carnivore)

    - Family (e.g. cat)'
