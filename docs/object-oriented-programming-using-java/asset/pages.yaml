    What we want to ''test'' here is that messages can be created, added to the MessageSet
    and displayed on the display.


    A point of requirements definition occurs here. There are two possibilities regarding
    the interface to the display board:-


    +   a) we load one message at a time, display it, then load the next message,
    and so on.

    nb) we load a collection of messages in one go, then tell the board to display
    them in sequence which it does autonomously


    The correct choice depends on finding out how the real display board actually
    works.


    Note that (a) would mean a simple display board and more complexity for the "Display
    messages" responsibility of MessageSet, while (b) implies the converse


    For this exercise we will assume the answer to this is (b), hence the responsibilities
    of scrolling through a set of messages will be assigned to the DisplayBoardControl
    interface.'
