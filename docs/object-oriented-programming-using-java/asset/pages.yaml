    # 4.5 Interfaces


    There are two aspects to inheritance:


    +   * the subclass inherits the interface (i.e. access to public members) of its
    superclass – this makes polymorphism possible


    +   * the subclass inherits the implementation of its superclass (i.e. instance
    variables and method implementations) – this saves us copying the subclass details
    in the subclass definition


    In Java, the **extends** keyword automatically applies these aspects.


    A **subclass** is a subtype. It''s include all of the interface of its superclass,
    though the implementation of this can be different (though overriding) and the
    interface of the subclass may be more extensive with additional features being
    added.


    However, sometimes we want two classes to share a common interface without putting
    them in an inheritance hierarchy. This might be because -


    +   * they aren''t really related by a true ''is a'' relationship


    +   * we want a class to have interfaces shared with more than one would-be superclass,
    but Java does not allow such ''multiple inheritance''


    +   * we want to create a ''plug and socket'' arrangement between software components,
    some of which might not be created at the current time.


    This is like making sure that two cars have controls that work in exactly the
    same way, but leaving to different engineers to design engines which ''implement''
    the functionality of the car, possibly in quite different ways.'
