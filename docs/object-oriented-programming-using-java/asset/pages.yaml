  md: '# Object Oriented Programming using Java


    # Java Development Tools


    Compilation takes place to convert the source code into a more efficient intermediate
    representation which can be executed by a ''run-time system'' (again a sort of
    ''virtual machine'') more quickly than direct interpretation of the source code.
    However, the use of an intermediate code which is then executed by run-time system
    software allows the compilation process to be independent of the OS/hardware platform,
    i.e. the same intermediate code should run on different platforms so long as an
    appropriate run-time system is available for each platform.


    This approach is long-established (e.g. in Pascal from the early 1970s) and is
    how Java works.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_129_0.png)


    # 8.2 The JRE


    To run Java programs we must first generate intermediate code (called bytecode)
    using a compiler available as part of the Java Development Kit (JDK) – see section
    8.4 below.


