  md: '# Object Oriented Programming using Java


    The Object Oriented programming paradigm aims to overcome these problems by helping
    with the analysis and design tasks during the initial software development phase
    (chapter 6 for more details on this) and by ensuring software is robust and maintainable
    (chapters 9 -11 for information on the support Object Orientation and Java provides).


    # 1.4 Object Oriented Principles


    Abstraction and encapsulation are fundamental principles that underlie the Object
    Oriented approach to software development. Abstraction allows us to consider complex
    ideas while ignoring irrelevant detail that would confuse us. Encapsulation allows
    us to focus on what something does without considering the complexities of how
    it works.


