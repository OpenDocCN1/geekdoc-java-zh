  md: '# 3.10 The ‘Object’ Class


    In Java all objects are (direct or indirect) subclasses of a class called ‘Object’.
    Object is the ‘root’ of the inheritance hierarchy in Java. Thus this class exists
    in every Java program ever created.


    If a class is not declared to extend another then it implicitly extends Object.


    Object defines no instance variables but several methods. Generally these methods
    will be overridden by new classes to make them useful. An example is the toString()
    method.


    Thus when we define our classes, by default they are subclasses of Object.


    If our classes are organised into a hierarchy then the topmost superclass in the
    hierarchy is a direct subclass of object, and all others are indirect subclasses.


    Thus directly, or indirectly, all classes created in Java inherit to toString().


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_66_0.png)


    # 3.11 Overriding toString() defined in ‘Object’


    The Object class defines a toString() method, one of several useful methods.


    toString() has the signature

    public String toString()'
