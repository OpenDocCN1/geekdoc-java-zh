  md: '# Object Oriented Programming using Java Agile Programming


    +   - a comprehensive suite of unit tests is compiled in parallel with the code
    development

    - a rapid cycle of ''write test, write code, run test''; each for a small developmental
    increment, increases programmer confidence and productivity.


    In conventional lifecycles if a software project is running late financial pressures
    often result in the software being rushed to market not having been fully tested
    and debugged. With Test Driven Development this is not possible as the tests are
    written before the system has been implemented.


    # 10.15 Summary


    ''Agile development approaches emphasize flexible cyclic development with the
    system evolving towards a solution.


    Unit testing is an important part of software engineering practice whatever state
    of development process is adopted.


    An automated unit testing framework (e.g. JUnit) allows unit tests to be regularly
    repeated as system development progresses.


    Test Driven Development reverses the normal sequence of code and test creation,
    and plays a major part in ''agile'' approaches.


