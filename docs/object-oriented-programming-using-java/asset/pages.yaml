    facilities that you will not want to work without...


    Eclipse is a flexible and extensible IDE platform. It was first developed by IBM
    but is now open source and can be downloaded from the Eclipse Foundation at eclipse.org.


    Eclipse was itself written in Java and like all Java programs it needs a JRE to
    work but this will therefore run on a large range of platforms. It comes with
    Java Development Tools (JDT) installed by default but also has extensions and
    additional tools to support the development of programs in other languages.


    The Eclipse ‘runtime platform’ is sufficiently flexible that it can even be used
