  md: "# Object Oriented Programming using Java\n\n# Dependency\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_0.png)\n\
    \n+   * Dependency is the most us relationship between classes (not strictly an\
    \ 'association')\n* Class A in some way uses facilities defined by Class B\n*\
    \ Changes to Class B may affect Class A\n\nTypical use of dependency lines would\
    \ be where Class A has a method which is passed a parameter object of Class B,\
    \ or uses a local variable of that, or ‘static’ methods in Class B.\n\n# Simple\
    \ Association\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_1.png)\n\n+   * In\
    \ an association Class A ‘uses’ objects of Class B\n* Typically Class A has an\
    \ attribute of Class B\n* Navigability from A to B:\n  * i.e. Class A object access\
    \ the Class B object(s) with which it is associated. The reverse is not true –\
    \ the Class B object doesn’t ‘know’ about the Class object\n\nA simple association\
    \ corresponds to an instance variable in Class A of the class B type.\n\nExample:\
    \ the Catalogue above needs to 0 or more ItemsForSale items can be added or removed\
    \ from a Catalogue. An ItemForSale does not need to access a Catalogue in order\
    \ to set its price or perform some other method associated with the item itself.\n\
    \n# Bidirectional Association\n\n![](img/2bcd878aa3b5707827d8b6067ca7458e_33_2.png)\n\
    \n+   * Bidirectional Association is when Class A and B have a two-way association\n\
    * Each refers to the other class\n* Navigability to A to B and B to A:\n  * Class\
    \ A object access the Class B object(s) with which it is associated\n  * Object(s)\
    \ of Class B ‘belong to’ Class A\n  * Implies reference from A to B\n  * Also,\
    \ Class B object can access the Class A object(s) with which it is associated\n\
    \nA bidirectional association is complicated because each object has a reference\
    \ to the other object(s) and generally bidirectional associations are much less\
    \ common than unidirectional ones."
