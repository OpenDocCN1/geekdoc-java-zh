    17) Summary


    # 11.1 The Problem


    User requirements is a topic of significant importance to the software engineering
    community and totally outside the scope of this text. The purpose of this chapter
    is not to show how requirements are obtained but to show how a problem statement
    is modelled using OO principles and turned into a complete working system once
    those requirements are gathered.


    The problem for which we will design a solution is ‘To develop a message management
    system for a scrolling display board belonging to a small retailer.’


    For the purpose of this exercise we will assume preliminary requirements analysis
    has been performed by interviewing the shop owner, and the workers who would use
    the system, and from this the following textual description has generated:-


    Rory’s Readables is a small shop on the seafront selling a range of convenience
    goods, especially books and magazines aimed at both the local and tourist trades.
    It has recently become a ticket agency for various local entertainment and transport
    providers.


    Rory plans to acquire an LCD message display board mounted above the storefront
    which can show scrolling text. Rory intends to use this to advertise his own products
    and offers also to provide a message display service for fee-paying clients (e.g.
    private sales, lost and found, staff required etc.).


    Each client is given a unique ID string (e.g. “adam4”) and has a name, an address,
    a phone number and an amount of credit in ‘credit units.’ A book of clients is
    maintained to which clients can be added and in which we can look up their IDEach
    message is for a specific client and comprises the text to be displayed, the number
    of days for which it should be displayed and the cost of that message in units.
    No duplicate messages (i.e the same text for the same client) are permitted.

    A set of current messages is to be maintained: new messages can be added, the
    message set can be displayed on the display board, and at the end of each day
    a purge is performed – each message has its days remaining decremented and its
    client’s credit reduced by the cost of the message, and any messages which have
    expired or whose client has no more credit are deleted from the message set.


    The software is to be written before the display board is installed – therefore
    the connection to the board should be via a well-defined interface and a display
    board implemented in software for testing purposes.

