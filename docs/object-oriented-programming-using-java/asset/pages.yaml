  md: '# Object Oriented Programming using Java


    # The Unified Modelling Language (UML)


    An example of a bidirectional association may be between a ''Degree'' and ''Student'',
    ie. given a Degree we may wish to know which Students are studying on that Degree.
    Alternatively starting with a student we may wish to know the Degree they are
    studying.


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_34_0.png)


    As many students study the same Degree at the same time, but students usually
    take one Degree there is still one to many relationship here.


    # Aggregation


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_34_1.png)


    +   - Aggregation denotes a situation where Object(s) of Class B ''belong to''
    Class A

    - Implies reference from A to B

    - While aggregation implies that objects of Class B belong to objects of Class
    A it also implies that object of Class B retain an existence independent of Class
    A. Some designers believe there is no real distinction between aggregation and
    simple association


    An example of aggregation would be between a Class Car and a Class Tyre


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_34_2.png)


    We think of the tyres as belonging to the car they are on, but at the garage they
    may be removed and placed on a rack to be repaired. Their existence isn’t dependent
    on the existence of a car with which they associated.


    # Composition


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_34_3.png)


    +   - Composition is similar to aggregation but implies a much stronger belonging
    relationship i.e. Object(s) of Class B are “part of” a Class A object

    - Again implies reference from A to B

    - Much ‘stronger’ than aggregation in this case Class B objects are an integral
    part of Class A and in general objects of Class B never exist other than as part
    of Class A, they have the same ‘lifetime''


    An example of composition would be between Points, Lines and Shapes as elements
    of a Picture. These objects can only exist as part of a picture, and if the picture
    is deleted they are also deleted.


