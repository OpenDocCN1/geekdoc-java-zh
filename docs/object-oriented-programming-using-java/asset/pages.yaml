  md: "# 9.3 Extending the Exception Class\n\nWhen writing our methods we should look\
    \ for potential failure situations (e.g. value that cannot be returned, errors\
    \ that may occur in calculation etc). When a potential error occurs we should\
    \ generate an 'Exception' object an object of the Exception class. However it\
    \ is best to define a subclass of the general Exception i.e. to create a specialised\
    \ class and throw one of this subtype.\n\nA new exception is just like any new\
    \ class in this case it is a subclass of **java.lang.Exception**\n\nIn the case\
    \ above an error could occur if no client is found with a specified ID. Therefore\
    \ we could create a new exception class called 'UnknownClientException'\n\nThe\
    \ parameter to the constructor for the Exception requires a Sung that the constructor\
    \ for UnknownClientException also requires a String. This string is used to get\
    \ details of the problem that may generate an exception.\n\nThe code to create\
    \ this new class is given below****\n\n```\nimport java.lang.Exception;\n\n********************************************************************\n\
    * Exception thrown when attempting to get an non-existent client ID\n* @author\
    \ Simon Kendal\n* @version 1.0 (11th July 2009)\n********************************************************************/\n\
    class UnknownClientException extends Exception {\n    /**\n     * Constructor\n\
    \     * \n     * @param pMessage description of exception\n     */\n    UnknownClientException(String\
    \ pMessage) {\n        super(pMessage);\n    }\n}\n```\n\nIn some respects this\
    \ looks odd. Here we are creating a subclass of Exception but our subclass does\
    \ not contain any new methods – nor it override any existing methods. Its functionality\
    \ is identical to the superclass – however it is subtype with a meaningful and\
    \ descriptive name.\n\nIf subclasses of Exception did not exist we would only\
    \ be able to catch the most general type of exception i.e an Exception object.\
    \ Thus we would only be able to write a class block that would catch every single\
    \ type of exception."
