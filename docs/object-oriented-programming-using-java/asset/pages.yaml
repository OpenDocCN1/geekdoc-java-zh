  md: '# Object Oriented Programming using Java


    This testing is generally ''wrapped into'' the implementation process:


    +   * Write class

    * Write tests

    * Run tests, debugging as necessary


    # 10.6 Automated Unit Testing


    Tools and frameworks are available to automate the unit testing process. Using
    such a tool generally requires a little more effort than running tests once. However
    the main benefit arises from the ability to re-run the tests as often as desired
    just by pushing a button.


    This is great aid to the ''regression testing'' which must be undertaken whenever
    previously tested code is modified.


    Regression testing developed long before agile methods were proposed and automated
    unit testing supports this. However automated unit testing also supports Test
    Driven Development processes and they play a major role in agile software development
    methods.


    We will explore the Test Driven Development processes within this chapter but
    before so we will first explore conventional regression testing and the support
    offered for this via JUnit a testing framework within Java.


    # 10.7 Regression Testing


    Regression testing is required as a software is adapted to meet changing business
    needs. By running regression tests we want to ensure that changes to the code
    do not ''break'' existing functionality. To do this as we write classes we must
    also write test these classes work. Thus we follow a process of ...


    +   * Write class

    * Write tests

    * Run tests, debugging as necessary

    * Write more classes

    * ...


    As we decide its necessary to change some of the earlier classes (or classes which
    they depend on) due to bugs, changing user requirements, or refactoring we need
    to re-run all previous tests to check they still pass. Without regression testing
    any modification of existing code is extremely hazardous!


    As we regularly need to re-run sets of test cases it is helpful, and hugely timesaving,
    to have automated testing facilities such as those that exist within Java.'
