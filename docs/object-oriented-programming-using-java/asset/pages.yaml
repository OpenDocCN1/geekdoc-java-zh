  md: '# Object Oriented Programming using Java


    Turning a complex requirements specification into an elegant object oriented architectural
    design is a skilled task that requires experience. However a good starting point
    is to follow a simple process set out in this chapter.


    Through a sequence of tasks we have seen how to analyse a textual description
    of a problem. We have -


    +   - Looked for aspects of the description that are outside the scope of the
    system,


    +   - Identified where the description refers synonymous items using different
    words


    +   - Used the nouns and verbs to identify potential classes, attributes and methods


    +   - Looked at the classes to identify potential inheritance hierarchies and
    to identify other relationships between classes (e.g. associations).


    +   - Document the resulting classes using CRC cards and tested the validity of
    our design by playing a range of scenarios and amending our designs as appropriate


    +   - Finally we can elaborate these details and document the results using a
    class diagram.


    The design process set out in this chapter will be demonstrated again in detail
    using the case study described in chapter 11.


