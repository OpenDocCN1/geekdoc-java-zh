    # 2.6 UML Sequence Diagrams


    Sequence diagrams are entirely different from class diagrams or object diagrams.
    Class diagrams describe the architecture of a system and object diagrams describe
    the state of a system at one time. However sequence diagrams describe how the
    system works over a period of time. Sequence diagrams are ''dynamic'' rather than
    ''static'' representations of the system. They show the sequence of method invocations
    within and between objects over a period of time. They are useful for understanding
    how objects collaborate in a particular scenario.


    See the example below :-


    ![](img/2bcd878aa3b5707827d8b6067ca7458e_47_0.png)


