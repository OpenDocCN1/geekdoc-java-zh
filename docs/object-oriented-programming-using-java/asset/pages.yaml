  md: '# Object Oriented programming using Java


    Just as new computing technologies are changing our world so far are new techniques
    and ideas changing the way we develop computer systems. In the 1950s the use machine
    code (unsophisticated, complex and machine scientific) languages were common.


    In the 1960s high level languages, which made programming simpler, became common.
    However these led to the development of large complex programs that were difficult
    to manage and maintain.


    In the 1970s the structured programming paradigm became the accepted standard
    for large complex programs. The structured programming paradigm proposed methods
    to logically structure the programs developed into smaller, more manageable components.
    Furthermore methods for analysing data that allowed large databases to be created
    that were efficient, preventing needless duplication of data and protected against
    the risks associated with data becoming out of sync. However significant problems
    still persisted in a understanding the systems we need to create and by changing
    existing software as users required.


    In the 1980s ''modular'' languages, as Module-2 and ADA were developed that became
    the precursor to modern Object Oriented languages.


    In the 1990s the Object Oriented paradigm and component-based software development
    ideas were developed and Object Oriented languages became the norm from 2000 onwards.


    The object oriented paradigm is based on many of the ideas developed over the
    previous 30 years of abstraction, encapsulation, generalisation and polymorphism
    and led to the development of software components where the operation of the software
    and the data it operates on are modelled together. Proponents of the Object Oriented
    software development paradigm argue this leads to the development of software
    components that can be reused in different applications saving significant development
    time and cost savings but more importantly allow better software models to be
    produced that make systems more maintainable and easier to understand.


    It should perhaps be noted that software development ideas are still evolving
    and new agile methods of working are being proposed and tested. Where this will
    lead us in 2020 and beyond remains to be seen.


    # 1.2 Different Programming Paradigms


    The structured programming paradigm proposed that programs could be developed
    in sensible blocks that make the program more understandable and easier to maintain.'
