  Bolivian Medium                      8.95\nBrazilian Dark                      \
  \ 7.95\nBrazilian Medium                     7.95\nBrazilian Decaf             \
  \         8.55\nCentral American Dark                9.95\nCentral American Medium\
  \              9.95\nSumatra Dark                         7.95\nSumatra Decaf  \
  \                      8.95\nSumatra Medium                       7.95\nSumatra\
  \ Organic Dark                 11.95\nKona Medium                          18.45\n\
  Kona Dark                            18.45\nFrench Roast Dark                  \
  \  9.65\nGalapagos Medium                     6.85\nGuatemalan Dark            \
  \          9.95\nGuatemalan Decaf                     10.45\nGuatemalan Medium \
  \                   9.95\n```\n\n代码列表 16-3 中的程序与代码列表 16-2 中的程序非常相似。这两个程序之间的差异总结如下：\n\
  \n*   第 25 行和 26 行使用字符串 `\"SELECT Description, Price FROM Coffee\"` 初始化变量 `sqlStatement`。这是一个\
  \ `SELECT` 语句，它将从数据库数据库表中检索 `Description` 和 `Price` 列。\n\n*   在 `while` 循环内部（第 35\
  \ 行到第 37 行），我们调用 `result.getString` 获取当前行的 `Description` 列，并调用 `result.getDouble`\
  \ 获取当前行的 `Price` 列。这些项目通过 `System.out.printf` 方法显示。\n\n如果您想检索每一列，可以使用 `*` 字符代替列出所有列名。这里有一个示例：\n\
  \n```\nSELECT * FROM Coffee\n```\n\n该语句将检索 `Coffee` 表中每一行的每一列。代码列表 16-4 所示的程序演示了这一点。\n\
  \n# 代码列表 16-4 `(ShowCoffeeData.java)`\n\n```java\nimport java.sql.*;  // Needed\
  \ for JDBC classes\n\n/**\n    此程序显示 CoffeeDB 数据库中\n    Coffee 表中的所有列。\n */\n\n\
  public class ShowCoffeeData\n{\n    public static void main(String[] args)\n   \
  \ {\n       // 为 URL 创建一个命名常量。\n       // 注意：此值特定于 Java DB 或 Apache Derby。\n   \
  \    final String DB_URL = \"jdbc:derby:CoffeeDB\";\n\n       try\n       {\n  \
  \        // 创建到数据库的连接。\n          Connection conn = DriverManager.getConnection(DB_URL);\n\
  \n          // 创建 Statement 对象。\n          Statement stmt = conn.createStatement();\n\
  \n          // 创建一个包含 SELECT 语句的字符串。\n          String sqlStatement = \"SELECT *\
  \ FROM Coffee\";\n\n          // 将语句发送到 DBMS。\n          ResultSet result = stmt.executeQuery(sqlStatement);\n\
  \n          // 显示结果集的内容。\n          // 结果集将有三列。\n          while (result.next())\n\
  \          {\n             System.out.printf(\"%25s %.2f\\n\",\n               \
  \                 result.getString(\"Description\"),\n                         \
  \       result.getDouble(\"Price\"));\n          }\n\n          // 关闭连接。\n     \
  \     conn.close();\n       }\n       catch(Exception ex)\n       {\n          System.out.println(\"\
  ERROR: \" + ex.getMessage());\n       }\n    }\n}\n```\n\n程序输出\n\n```\nBolivian\
  \ Dark                        8.95\nBolivian Medium                      8.95\n\
  Brazilian Dark                       7.95\nBrazilian Medium                    \
  \ 7.95\nBrazilian Decaf                      8.55\nCentral American Dark       \
  \         9.95\nCentral American Medium              9.95\nSumatra Dark        \
  \                 7.95\nSumatra Decaf                        8.95\nSumatra Medium\
  \                       7.95\nSumatra Organic Dark                 11.95\nKona Medium\
  \                          18.45\nKona Dark                            18.45\nFrench\
  \ Roast Dark                    9.65\nGalapagos Medium                     6.85\n\
  Guatemalan Dark                      9.95\nGuatemalan Decaf                    \
  \ 10.45\nGuatemalan Medium                    9.95\n```\n\nSQL 语句是自由格式的，这意味着关键字之间的制表符、换行和空格会被忽略。例如，语句\n\
  \n```\nSELECT * FROM Coffee\n```\n\n与以下语句相同：\n\n```\nSELECT\n   *\nFROM\n   Coffee\n\
  ```\n\n此外，SQL 关键字和表名不大小写。之前的语句可以写成：\n\n```\nselect * from coffee\n```\n\n# 使用 WHERE\
  \ 子句指定搜索条件\n\n有时，您可能想要检索表中的每一行。例如，如果您想获取 `Coffee` 表中的所有咖啡，之前的 `SELECT` 语句就可以提供。但通常，您希望将列表缩小到表中的几行。这就是\
  \ `WHERE` 子句大显用场的地方。`WHERE` 子句可以与 `SELECT` 语句一起使用以指定搜索条件。当您使用 `WHERE` 子句时，只有符合搜索条件的行才会返回到结果集中。带有\
  \ `WHERE` 子句的 `SELECT` 语句通用格式为：\n\n```\nSELECT Columns FROM Table WHERE Criteria\n\
  ```\n\n在通用格式中，`Criteria` 是一个条件表达式。这是一个使用 `WHERE` 子句的 `SELECT` 语句示例：\n\n```\nSELECT\
  \ * FROM Coffee WHERE Price > 12.00\n```\n\n语句的第一部分 `SELECT * FROM Coffee` 指定我们要查看每一列。`WHERE`\
  \ 子句指定 Price 内容大于 12.00 的行。图 16-9 显示了该语句的结果。注意只有两种咖啡符合此搜索标准。\n\n# 图 16-9 Price 大于\
  \ 12.00 的行\n\n| Description | ProdNum | Price |\n| --- | --- | --- |\n| Kona Medium\
  \ | 18-001 | 18.45 |\n| Kona Dark | 18-002 | 18.45 |\n\n\n\n\n\n标准 SQL 支持表 16-4\
  \ 中列出的关系关系运算符，用于在 `WHERE` 子句中编写条件表达式。\n\n# 表 16-4 SQL 关系运算符\n\n| 运算符 | 含义 |\n| ---\
  \ | --- |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `=` |\
  \ 等于 |\n| `<>` | 不等于 |\n\n注意，SQL 中的等于运算符和不等于运算符与 Java 中的不同。等于运算符是一个等号，而不是两个等号。不等于运算符是\
  \ `<>`。\n\n让我们再看下 `SELECT` 语句的另外几条例子。以下语句可以用于检索所有价格为 7.95 的咖啡的产品编号和价格：\n\n```\n\
  SELECT ProdNum, Price FROM Coffee WHERE Price = 7.95\n```\n\n该语句的结果所示图 16-10]。\n\
  \n# 图 16-10 SQL 语句的结果\n\n| ProdNum | Price |\n| --- | --- |\n| 16-001 | 7.95 |\n\
  | 16-002 | 7.95 |\n| 17-001 | 7.95 |\n| 17-003 | 7.95 |\n\n以下 `SELECT` 语句检索描述为“French\
  \ Roast Dark”的行的所有列。该语句返回的结果所示图 16-11 所示]。\n\n# 图 16-11 SQL 语句的结果\n\n| Description\
  \ | ProdNum | Price |\n| --- | --- | --- |\n| French Roast Dark | 19-001 | 9.65\
  \ |\n\n```\nSELECT * FROM Coffee WHERE Description = 'French Roast Dark'\n```\n\n\
  如果你仔细观察上一个语句，你会发现 SQL 语法与 Java 语法之间的另一个区别。在 SQL 中，字符串字面量包含在单引号中，而不是双引号。\n\n### 提示\n\
  \n如果你需要在字符串中包含一个单引号，只需在该位置编写两个单引号即可。例如，假设你想在 `Coffee` 表中搜索名为 Joe’s Special Blend\
  \ 的咖啡。你可以使用以下语句：\n\n```\nSELECT * FROM Coffee WHERE Description = 'Joe''s Special\
  \ Blend'\n```\n\n让我们来看一个在 `SELECT` 语句中使用 `WHERE` 子句的示例程序。代码列表 16-5 中的程序允许用户输入一个最低价格，然后在\
  \ `Coffee` 表中搜索 `Price` 列大于或等于指定价格的行。\n\n在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮分逐通过代码并查看各处的解释。\n\
  \n# 代码列表 16-5 `(CoffeeMinPrice.java)`\n\nhttps://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr16-5/5.html\n\
  \n代码列表 16-5 中有几处需要解释。在第 24 行和第 25 行中，程序提示用户输入最低价格，并将用户的输入赋值给 `double` 变量 `minPrice`。然后，注意第\
  \ 38 到 40 行，`minPrice` 变量被转换为字符串，并连接到包含 `SELECT` 语句的字符串上。当程序运行时，如果用户输入 10.00，在第\
  \ 38 到 40 行中创建的 `SELECT` 语句将是：\n\n```\nSELECT * FROM Coffee WHERE Price >= 10.00\n\
  ```\n\n或者，如果用户输入 12.00，在第 38 到 40 行中创建的 `SELECT` 语句将是：\n\n```\nSELECT * FROM Coffee\
  \ WHERE Price >= 12.00\n```\n\n程序通常需要使用此类技术来创建包含用户输入的 SQL 语句。\n\n# `SELECT` 语句中的字符串比较\n\
  \nSQL 中的字符串比较是区分大小写的。如果你对 `CoffeeDB` 数据库运行以下语句，你将得不到任何结果：\n\n```\nSELECT * FROM\
  \ Coffee WHERE Description = 'french roast dark'\n```\n\n然而，你可以使用 `UPPER()` 函数将字符串转换为大写。这里有一个示例：\n\
  \n```\nSELECT * FROM Coffee WHERE UPPER(Description) = 'FRENCH ROAST DARK'\n```\n\
  \n这将返回与图 16-11 所示相同的结果。SQL 还提供了 `LOWER()` 函数，它可以将其参数转换为小写。这里有一个示例：\n\n```\nSELECT\
  \ * FROM Coffee WHERE LOWER(Description) = 'french roast dark'\n```\n\n# 使用 `LIKE`\
  \ 运算符\n\n有时搜索精确字符串不起作用。例如，假设我们想要一个脱咖啡列表。以下语句：\n\n```\nSELECT * FROM Coffee WHERE\
  \ Description LIKE '%Decaf%'\n```\n\n`%` 符号被用作通配符。它表示任意数量的字符。模式 `'%Decaf%'` 指定“Decaf”前后可以是任何字符。结果所示图\
  \ 16-12]]。\n\n# 图 16-12 SQL 语句的结果\n\n| Description | ProdNum | Price |\n| --- |\
  \ --- |\n| Brazilian Decaf | 15-003 | ... |\n| Sumatra Decaf | 17-002 | ... |\n\
  | Guatemalan Decaf | 21-002 | ... |\n\n下划线字符 `_` 也被用作通配符。与 `%` 字符不同，下划线表示单个字符。例如，看以下语句：\n\
  \n```\nSELECT * FROM Coffee WHERE ProdNum LIKE '2_-00_'\n```\n\n该语句将产生所有 `ProdNum`\
  \ 列以“2”开头，跟随单个字符，然后是“-00”，最后再跟单个字符的行。该语句的结果所示图 16-13]。\n\n# 图 16-13 SQL 语句的结果\n\n\
  | Description | ProdNum | Price |\n| --- | --- | --- |\n| Galapagos Medium | 20-001\
  \ | 6.85 |\n| Guatemalan Dark | 21-001 | 9.95 |\n| Guatemalan Medium | 21-003 |\
  \ 9.95 |\n\n你可以使用 `NOT` 运算符在搜索标准中排除字符模式。例如，假设你想得到所有非脱咖啡咖啡的列表。以下语句将产生这些结果。\n\n```\n\
  SELECT * FROM Coffee WHERE Description NOT LIKE '%Decaf%'\n```\n\n# 使用 `AND` 和 `OR`\n\
  \n你可以使用 `AND` 和 `OR` 逻辑运算符在 `WHERE` 子句中指定多个搜索标准。例如，看以下语句：\n\n```\nSELECT * FROM\
  \ Coffee WHERE Price > 10.00 AND Price < 14.00\n```\n\n\n\n\n\n`AND` 运算符要求两个搜索条件都为真，该行才会被判定为匹配。此语句返回的行仅包含\
  \ `Price` 列包含大于 10.00 且小于 14.00 值的行。图 16-14 显示了该语句的结果。\n\n# 图 16-14 SQL 语句的结果\n\n\
  | 描述 | ProdNum | Price |\n| --- | --- | --- |\n| Sumatra Organic Dark | 17-004 |\
  \ 11.95 |\n| Guatemalan Decaf | 21-002 | 10.45 |\n\n这里是一个使用 `OR` 运算符的示例：\n\n```\n\
  SELECT * FROM Coffee\n WHERE Description LIKE '%Dark%' OR ProdNum LIKE '16%'\n```\n\
  \n`OR` 运算符要求两个搜索条件中的任意一个为真，该行即会被判定为匹配。此语句搜索 `Description` 列在任何位置包含字符串“Dark”的行，或者\
  \ `ProdNum` 列以“16”开头的行。图 16-15 显示了查询的结果。\n\n# 图 16-15 SQL 语句的结果\n\n| 描述 | ProdNum\
  \ | Price |\n| --- | --- | --- |\n| Bolivian Dark | 14-001 | 8.95 |\n| Brazilian\
  \ Dark | 15-001 | 7.95 |\n| Central American Dark | 16-001 | 9.95 |\n| Central American\
  \ Medium | 16-002 | 9.95 |\n| Sumatra Dark | 17-001 | 7.95 |\n| Sumatra Organic\
  \ Dark | 17-004 | 11.95 |\n| Kona Dark | 18-002 | 18.45 |\n| French Roast Dark |\
  \ 19-001 | 9.65 |\n| Guatemalan Dark | 21-001 | 9.95 |\n\n# 对 `SELECT` 查询结果进行排序\n\
  \n如果你希望对 `SELECT` 查询的结果进行排序，可以使用 `ORDER` `BY` 子句。这是一个示例：\n\n```\nSELECT * FROM Coffee\
  \ ORDER BY Price\n```\n\n此语句将生成 `Coffee` 表中所有行的列表，并按 `Price` 列排序。列表将按 `Price` 列的升序排列，这意味着价格最低的咖啡将出现在前面。\n\
  \n这里是一个同时使用 `WHERE` 子句和 `ORDER BY` 子句的 `SELECT` 语句：\n\n```\nSELECT * FROM Coffee\n\
  \  WHERE Price > 9.95\n  ORDER BY Price\n```\n\n此语句将生成 `Coffee` 表中所有 `Price` 列值大于\
  \ 9.95 的行列表，并按价格升序排列。\n\n如果你希望列表按降序排列（从高到低），请使用 `DESC` 运算符，如下所示：\n\n```\nSELECT\
  \ * FROM Coffee\n  WHERE Price > 9.95\n  ORDER BY Price DESC\n```\n\n# 数学函数\n\n\
  SQL 提供了几个用于计算的函数。例如，`AVG` 函数计算特定列的平均值。使用 `AVG` 函数的 `SELECT` 语句示例：\n\n```\nSELECT\
  \ AVG(Price) FROM Coffee\n```\n\n此语句产生单一值：`Price` 列所有值的平均值。由于我们没有使用 `WHERE` 子句，因此计算时使用了\
  \ `Coffee` 表中的所有行。这里有一个计算产品号以“20”开头的所有咖啡平均价格的示例：\n\n```\nSELECT AVG(Price) FROM\
  \ Coffee WHERE ProdNum LIKE '20%'\n```\n\n另一个数学函数是 `SUM`，它计算列值的总和。接下来的语句可能用不大，它计算\
  \ `Price` 列值的总和：\n\n```\nSELECT SUM(Price) FROM Coffee\n```\n\n`MIN` 和 `MAX` 函数确定列中的最小值和最大值。接下来的语句将告诉我们\
  \ `Price` 列中的最小值：\n\n```\nSELECT MIN(Price) FROM Coffee\n```\n\n接下来的语句将告诉我们 `Price`\
  \ 列中的最大值：\n\n```\nSELECT MAX(Price) FROM Coffee\n```\n\n`COUNT` 函数可以确定表中的行数，如下语句所示：\n\
  \n```\nSELECT COUNT(*) FROM Coffee\n```\n\n`*` 仅表示你想要统计整行。这是另一个示例，告诉我们价格大于 9.95\
  \ 的咖啡数量：\n\n```\nSELECT COUNT(*) FROM Coffee WHERE Price > 9.95\n```\n\n使用数学函数的查询（如此处示例所示）仅返回一个值。因此，当你使用\
  \ JDBC 向 DBMS 提交此类语句时，返回给程序的 `ResultSet` 对象将包含一行一列。所示的 代码列表 16-6 展示了如何使用 `MIN`、`MAX`\
  \ 和 `AVG` 函数处理 `Coffee` 表。\n\n# 代码列表 16-6\n\n```java\nimport java.sql.*;\n\n/**\n\
  \ * 此程序演示了 SQL 数学函数。\n */\npublic class CoffeeMath {\n    public static void main(String[]\
  \ args) {\n        // 用于存储最低、最高和平均价格的变量\n        double lowest = 0.0;\n        double\
  \ highest = 0.0;\n        double average = 0.0;\n\n        // 数据库 URL 的常量\n    \
  \    final String DB_URL = \"jdbc:mysql://localhost:3306/inventory\";\n\n      \
  \  try {\n            // 创建连接\n            Connection conn = DriverManager.getConnection(DB_URL);\n\
  \            // 创建语句\n            Statement stmt = conn.createStatement();\n\n \
  \           // 获取最低价格语句\n            String minStatement = \"SELECT MIN(Price) FROM\
  \ Coffee\";\n            ResultSet minResult = stmt.executeQuery(minStatement);\n\
  \            if (minResult.next()) {\n                lowest = minResult.getDouble(1);\n\
  \            }\n\n            // 获取最高价格语句\n            String maxStatement = \"\
  SELECT MAX(Price) FROM Coffee\";\n            ResultSet maxResult = stmt.executeQuery(maxStatement);\n\
  \            if (maxResult.next()) {\n                highest = maxResult.getDouble(1);\n\
  \            }\n\n            // 获取平均价格语句\n            String avgStatement = \"\
  SELECT AVG(Price) FROM Coffee\";\n            ResultSet avgResult = stmt.executeQuery(avgStatement);\n\
  \            if (avgResult.next()) {\n                average = avgResult.getDouble(1);\n\
  \            }\n\n            // 显示结果\n            System.out.printf(\"Lowest price:\
  \ $%.2f\\n\", lowest);\n            System.out.printf(\"Highest price: $%.2f\\n\"\
  , highest);\n            System.out.printf(\"Average price: $%.2f\\n\", average);\n\
  \n            // 关闭连接\n            conn.close();\n        } catch (Exception ex)\
  \ {\n            System.out.println(\"ERROR: \" + ex.getMessage());\n        }\n\
  \    }\n}\n```\n\n程序输出\n\n```\nLowest price: $6.85\nHighest price: $18.45\nAverage\
  \ price: $10.16\n```\n\n\n\n\n第 46 到 48 行的代码获取表格中的平均价格。以下是该代码工作原理的摘要：\n\n*   第 46\
  \ 行执行 `avgStatement` 的内容，并将返回的 `ResultSet` 引用赋值给变量 `avgResult`。\n*   第 47 行的 `if`\
  \ 语句移动 `ResultSet` 对象的游标，第 48 行获取第 1 列的值并将其赋值给变量 `average`。\n\n# Checkpoint 16.11\n\
  ../components/metrodigi/ch16-inline_self_quiz_v1.0.0-11/index.html\n\n# Checkpoint\
  \ 16.12\n../components/metrodigi/ch16-inline_self_quiz_v1.0.0-12/index.html\n\n\
