  \ 6.6 重载方法和构造函数\n\n**概念**：类中的两个或多个方法只要它们的参数列表不同，就可以具有相同的名称。这同样适用于构造函数。\n\n方法重载是面向对象编程的重要组成部分。当一个方法被“重载”时，意味着同一个类中的多个方法具有相同的名称，但使用不同类型的参数。方法重载很重要，因为有时你需要几种不同的方式来执行相同的操作。例如，假设一个类有以下两个方法：\n\
  \n```java\npublic int add(int num1, int num2)\n{\n   int sum = num1 + num2;\n  \
  \ return sum;\n}\npublic String add(String str1, String str2)\n{\n   String combined\
  \ = str1 + str2;\n   return combined;\n}\n```\n\n这两个方法都命名为 `add`。它们都接受两个参数并将它们相加。第一个接受两个\
  \ `int` 参数并返回它们的和。第二个接受两个 `String` 引用并返回一个作为这两个参数拼接的 `String` 引用。当我们编写对 `add` 方法的调用时，编译器必须确定我们意图调用重载方法中的哪一个。\n\
  \n将方法调用与正确的方法进行匹配的过程被称为 `binding`（绑定）。当调用重载方法时，Java 使用方法的名称和参数列表来确定将调用绑定到哪个方法。如果向\
  \ `add` 方法传递两个 `int` 参数，则调用带有两个 `int` 参数的方法版本。同样，当向 `add` 传递两个 `String` 参数时，会调用带有两个\
  \ `String` 参数的版本。\n\nJava 使用方法的 `signature`（签名）来将其与其他同名方法区分来。方法的 `signature` 由方法名称和方法参数的数据类型组成。例如，这里是之前\
  \ `add` 方法的签名：\n\n```\nadd(int, int)\nadd(String, String)\n```\n\n注意，返回类型不是签名的一部分。由于此原因，以下\
  \ `add` 方法无法添加到与之前相同的类中：\n\n```java\npublic int add(String str1, String str2)\n\
  {\n   int sum = Integer.parseInt(str1) + Integer.parseInt(str2);\n   return sum;\n\
  }\n```\n\n构造函数也可以重载，这意味着一个类可以有多个构造函数。重载构造函数的规则与重载方法相同：每个构造函数必须具有不同的参数列表。只要每个构造函数都是唯一的，编译器就能区分它们。例如，我们之前讨论的\
  \ `Rectangle` 类可以具有以下构造函数：\n\n```java\npublic Rectangle()\n{\n   length = 0.0;\n\
  \   width = 0.0;\n}\npublic Rectangle(double len, double w)\n{\n   length = len;\n\
  \   width = w;\n}\n```\n\n这里显示的第一个构造函数不接受参数，并将 0.0 赋值给 `length` 和 `width` 字段。第二个构造函数接受两个参数，这些参数被赋值给\
  \ `length` 和 `width` 字段。以下代码展示了如何调用每个构造函数：\n\n```java\nRectangle box1 = new Rectangle();\n\
  Rectangle box2 = new Rectangle(5.0, 10.0);\n```\n\n第一条语句创建一个 `Rectangle` 对象，由变量\
  \ `box1` 引用，并执行无参数构造函数。它的 `length` 和 `width` 字段设置为 0.0。第二条语句创建另一个 `Rectangle` 对象，由\
  \ `box2` 引用，并执行第二个构造函数。它的 `length` 和 `width` 字段分别设置为 5.0 和 10.0。\n\n回顾一下，只有当你没有为类编写任何构造函数时，Java\
  \ 才会提供默认构造函数。如果一个类有一个接受参数的构造函数，但没有无参数构造函数，你就无法在不传递参数的情况下创建该类的实例。因此，每当你为类编写构造函数且该构造函数接受参数时，如果你希望能够在不传递参数的情况下创建该类的实例，你也应该也写一个无参数构造函数。\n\
