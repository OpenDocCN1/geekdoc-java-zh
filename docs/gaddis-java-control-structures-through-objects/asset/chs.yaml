  \n# 焦点聚焦：使用对象模拟骰子\n\n传统的骰子有 6 面。然而，某些游戏如*地下城之旅*使用不同面数的骰子。假设你正在编写一个模拟各种面数骰子的类。该类将有一个接收面数作为参数的构造函数。该类还具有掷骰子和获取骰子值的方法。\n\
  \n```\nimport java.util.Random;\n\n/**\n Die 类模拟六面骰子。\n */\npublic class Die\n{\n\
  \    private int sides;   // 面数\n    private int value;   // 骰子值\n\n    /**\n  \
  \    构造函数执行骰子的初始化。\n     @param numSides 骰子的面数\n     */\n    public Die(int numSides)\n\
  \    {\n        sides = numSides;\n        roll();\n    }\n\n    /**\n     * roll\
  \ 方法模拟掷骰子。\n     */\n    public void roll()\n    {\n        // 创建一个 Random 对象。\n\
  \        Random rand = new Random();\n\n        // 获取骰子的随机值。\n        value = rand.nextInt(sides)\
  \ + 1;\n    }\n\n    /**\n     * getSides 方法\n     @return 骰子的面数\n     */\n    public\
  \ int getSides()\n    {\n        return sides;\n    }\n\n    /**\n     * getValue\
