  \n# 13.6 `Slider` 控件\n\n概念：`Slider` 是一种允许用户在数值范围内图形化地调整数字的控件。\n\n# WatchSlider 控件\n\
  \n[`mediaplayer.pearsoncmg.com/assets/_video.true/bx2XOH_JjQQrAK99pgorz6RJ_BNbMomZ`](https://mediaplayer.pearsoncmg.com/assets/_video.true/bx2XOH_JjQQrAK99pgorz6RJ_BNbMomZ)\n\
  \n`Slider` 控件显示一个“滑块旋钮”的图像，该旋钮可以沿着轨道滑动。Slider 可以是水平或垂直方向的，如图 13-26 所示。你使用 `javafx.scene.control`\
  \ 包中的 `Slider` 类来创建 `Slider` 控件。\n\n# 图 13-26 一个水平的和一个垂直的 `Slider`（Oracle 法务部）\n\
  \n![窗口中显示了一个水平的和一个垂直的 Slider。](img/13fig26.png)图 13-26 完整替代文本\n\n`Slider` 设计用于表示一组数值范围。`Slider`\
  \ 的一端是范围的最小值，另一端是范围的最大值。在图 13-26 中，水平 `Slider` 的最小值为 0，最大值为 50。垂直 `Slider` 的最小值是\
  \ −1，最大值为 1。\n\n`Slider` 控件有一个数值值，当用户沿着轨道移动旋钮时，该数值会随之调整。注意图 13-26 中的 `Slider` 控件带有附带刻度（tick\
  \ marks）。从 0 开始，然后每隔 10 个值，沿轨道会显示一个主刻度，以及一个指示该刻度数值的标签。在主刻度之间是小刻度。在这个示例中，主刻度之间显示了五个小刻度。\n\
  \n`Slider` 类有两个构造函数。无参构造函数创建一个 `Slider`，其最小值为 0，最大值为 100。以下是一个演示此点的代码片段：\n\n```\n\
  ComboBox<String> comboBox = new ComboBox<>();\ncomboBox.setEditable(true);\ncomboBox.getItems().addAll(\"\
  England\", \"Scotland\",\n                           \"Ireland\", \"Wales\");\n\
  ```\n\n`Slider` 的无参构造函数创建一个 `Slider`，其最小值为 0。\n```\nSlider slider = new Slider();\n\
  ```\n\n第二个构造函数接受三个 `double` 参数：最小值、最大值和初始值。\n```\nSlider slider = new Slider(0,\
  \ 100, 25);\n```\n\n`Slider` 控件有一个数值值，当用户沿着轨道移动旋钮时，该数值会随之调整。注意图 13-26 中的 `Slider`\
  \ 控件带有附带刻度。从 0 开始，然后每隔 10 个值，沿轨道会显示一个主刻度，以及一个指示该刻度数值的标签。在主刻度之间是小刻度。在这个示例中，主刻度之间显示了五个小刻度。\n\
  \n`Slider` 控件有一个数值值，当用户沿着轨道移动旋钮时，该数值会随之调整。注意图 13-26 中的 `Slider` 控件带有附带刻度。从 0 开始，然后每隔\
  \ 10 个值，沿轨道会显示一个主刻度，以及一个指示该刻度数值的标签。在主刻度之间是小刻度。在这个示例中，主刻度之间显示了五个小刻度。\n\n`Slider`\
  \ 控件有一个数值值，当用户沿着轨道移动旋钮时，该数值会随之调整。注意图 13-26 中的 `Slider` 控件带有附带刻度。从 0 开始，然后每隔 10 个值，沿轨道会显示一个主刻度，以及一个指示该刻度数值的标签。在主刻度之间是小刻度。在这个示例中，主刻度之间显示了五个小刻度。\n\
  \n（注：由于原文文本中存在大量重复的段落，译文已根据逻辑进行了精简处理，确保了所有核心信息的准确传达。）\n\n\n\n\n```\nSlider vSlider\
  \ = new Slider(-1.0, 1.0, 0.0);\nvSlider.setOrientation(Orientation.VERTICAL);\n\
  vSlider.setShowTickMarks(true);\nvSlider.setMajorTickUnit(0.25);\nvSlider.setMinorTickCount(5);\n\
  vSlider.setShowTickLabels(true);\nvSlider.setPrefHeight(300);\n```\n让我们仔细查看一下这段代码：\n\
  \n- 第 1 行创建一个最小值为 -1、最大值为 1 的 `Slider`。`Slider` 的初始值为 0。\n- 第 2 行将 `Slider` 的方向设置为垂直。\n\
  - 第 3 行让 `Slider` 显示刻度线。\n- 第 4 行设置主刻度间距为 0.25。结果是在 -1、-0.75-0.5,-0.25、0、0.25、0.5、0.75\
  \ 和 1 处显示主刻度线。\n- 第 5 行在主刻度之间显示 5 个小刻度线。\n- 第 6 行在主刻度处显示标签。\n- 第 7 行将 `Slider` 的高度设置为\
  \ 300 像素。\n\n当 `Slider` 的值改变时（因为滑块被移动），`Slider` 控件会产生一个事件。如果你希望在 `Slider` 的值改变时执行操作，可以为该事件注册一个处理器。假设\
  \ `slider` 是一个 `Slider` 控件，以下代码展示了如何使用 lambda 表达式注册此类事件处理器：\n\n```\nslider.valueProperty().addListener(\n\
  \   (observable, oldValue, newValue) ->\n   {\n       // 在此处编写事件处理代码...\n   });\n\
  ```\n\n代码列表 13-25 展示了 `Slider` 控件。该程序显示了图 13-27 所示的窗口。初始显示两个温度：32.0 华氏度和 0.0 摄度。范围从\
  \ 0 到 100 的 `Slider` 允许你调整摄度并立即查看华氏度的转换。\n\n```java\nimport javafx.application.Application;\n\
  import javafx.stage.Stage;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.VBox;\n\
  import javafx.scene.layout.HBox;\nimport javafx.scene.control.Label;\nimport javafx.scene.control.Slider;\n\
  import javafx.geometry.Pos;\nimport javafx.geometry.Insets;\n\npublic class SliderDemo\
  \ extends Application\n{\n    public static void main(String[] args)\n    {\n  \
  \      // 启动应用程序\n        launch(args);\n    }\n\n    @Override\n    public void\
  \ start(Stage primaryStage)\n    {\n        // Slider 常量\n        final double MIN\
  \ = 0.0, MAX = 100.0, INITIAL = 0.0;\n        final double MAJOR_TICK_UNIT = 20.0;\n\
  \        final int MINOR_TICK_COUNT = 5;\n        final double SLIDER_WIDTH = 300.0;\n\
  \n        // 其他常量\n        final double LABEL_WIDTH = 50.0;\n        final double\
  \ SPACING = 10.0;\n\n        // 创建华氏度控件\n        Label fDescriptor = new Label(\"\
  Fahrenheit: \");\n        Label fLabel = new Label(\"32.0\");\n        fLabel.setStyle(\"\
  -fx-border-style: solid;\" +\n                        \"-fx-alignment: center\"\
  );\n        fLabel.setPrefWidth(LABEL_WIDTH);\n        HBox fHBox = new HBox(SPACING,\
  \ fDescriptor, fLabel);\n        fHBox.setAlignment(Pos.CENTER);\n\n        // 创建摄氏度控件\n\
  \        Label cDescriptor = new Label(\"Celsius: \");\n        Label cLabel = new\
  \ Label(\"0.0\");\n        cLabel.setStyle(\"-fx-border-style: solid;\" +\n    \
  \                    \"-fx-alignment: center\");\n        cLabel.setPrefWidth(LABEL_WIDTH);\n\
  \        HBox cHBox = new HBox(SPACING, cDescriptor, cLabel);\n        cHBox.setAlignment(Pos.CENTER);\n\
  \n        // 创建 Slider\n        Slider slider = new Slider(MIN, MAX, INITIAL);\n\
  \        slider.setShowTickMarks(true);\n        slider.setMajorTickUnit(MAJOR_TICK_UNIT);\n\
  \        slider.setMinorTickCount(MINOR_TICK_COUNT);\n        slider.setShowTickLabels(true);\n\
  \        slider.setSnapToTicks(true);\n        slider.setPrefWidth(SLIDER_WIDTH);\n\
  \n        //为 Slider 注册事件处理器\n        slider.valueProperty().addListener(\n    \
  \       (observable, oldValue, newValue) ->\n           {\n              // 从 Slider\
  \ 获取摄氏度\n              double celsius = slider.getValue();\n\n              // 将摄氏度转换为华氏度\n\
  \              double fahrenheit = (9.0 / 5.0) * celsius + 32;\n\n             \
  \ // 显示摄度和华氏度温度\n              cLabel.setText(String.format(\"%.1f\", celsius));\n\
  \              fLabel.setText(String.format(\"%.1f\", fahrenheit));\n          \
  \ });\n\n        // 将控件添加到 VBox\n        VBox vbox = new VBox(10, fHBox, cHBox,\
  \ slider);\n        vbox.setAlignment(Pos.CENTER);\n        vbox.setPadding(new\
  \ Insets(SPACING));\n\n        // 创建场景并显示它\n        Scene scene = new Scene(vbox);\n\
  \        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n}\n\
  ```\n\n# 代码列表 13-25 `SliderDemo.java`\n\n# 图 13-27 `SliderDemo.java` 应用程序（Oracle\
  \ Counsel）\n\nSlider Demo 应用程序计算华氏度和摄度之间的转换。\n\n# 检查点 13.29\n\n# 13.7 `TextArea`\
  \ 控件\n\n`TextArea` 是一个多行的 `TextField`，它可以接受多行文本输入，或显示多行文本。\n\n在第 12 章中，你学习了 `TextField`\
  \ 控件，它允许用户输入单行文本。`TextArea` 类似于可以接受多行输入的 `TextField`。图 13-28 显示了一个示例。\n\n# 图 13-28\
  \ `TextArea` 控件（Oracle Counsel）\n\n`TextArea` 类位于 `javafx.scene.control` 包中，它有两个构造函数。无参数构造函数创建一个空的\
  \ `TextArea`。以下是使用无参数构造函数创建 `TextArea` 的语句：\n\n```java\nTextArea textArea = new\
  \ TextArea();\n```\n\n第二个构造函数接受一个 `String` 参数，如下：\n\n```java\nTextArea textArea\
  \ = new TextArea(\"This is the initial text.\");\n```\n\n传递给 `TextArea` 构造函数的字符串将显示在\
  \ `TextArea` 中。表 13-8 列出了你最常用的方法。\n\n# 表 13-8 `TextArea` 类的一些方法\n\n| 方法 | 描述 |\n\
  | --- | --- |\n| `setPrefColumnCount(value)` | `value` 参数是 `int`。设置首选文本列数（默认值为 40）。\
  \ |\n| `setPrefRowCount(value)` | `value` 参数是 `int`。设置首选文本行数（默认值为 10）。 |\n| `setWrapText(value)`\
  \ | `value` 参数是 `boolean`。如果参数为 `true`，则 `TextArea` 将换行超出行尾的文本；如果为 `false`，则当文本超出行尾时\
  \ `TextArea` 将进行滚动（默认值为 `false`）。 |\n| `getText()` | 以 `String` 形式返回 `TextArea`\
  \ 内容。 |\n| `setText(value)` | `value` 参数是 `String`。该参数成为 `TextArea` 控件中显示的文本。 |\n\
  \n\n\n\n```\nTextArea textArea = new TextArea();\ntextArea.setPrefColumnCount(20);\n\
  textArea.setPrefRowCount(30);\n```\n\n默认情况下，`TextArea` 控件不执行文本换行。这意味着当在控件中输入文本并到达行尾时，文本不会换行到下一行。相反，`TextArea`\
  \ 会向右滚动，并显示水平滚动条。\n\n作为替代方案，你可以使用 `TextArea` 类的 `setWrapText` 方法来启用文本换行。该方法接受一个\
  \ `boolean` 类型参数。如果你传递 `true`，则启用文本换行；如果你传递 `false`，则禁用文本换行。以下是一个示例：\n\n```\ntextInput.setWrapText(true);\n\
  ```\n\n启用行换行后，超过行尾的文本行将换行到下一行。\n\n### 注意\n\n`TextArea` 控件执行的是一种被称为“单词换行”（word wrapping）的换行类型。这意味着换行始终发生在单词之间，而不是单词中间。\n\
  \n要获取用户输入到 `TextArea` 控件中的文本，你需要调用控件的 `getText` 方法。该方法将输入到 `TextField` 的文本作为 `String`\
  \ 返回。例如，假设 `textArea` 是一个 `TextArea` 控件。以下代码读取了输入 `textArea` 的文本，并将其赋值给名为 `input`\
  \ 的 `String` 变量：\n\n```\nString input;\ninput = textArea.getText();\n```\n\n###\
