  \ Out With Java 的 Revel\n\n## 关于本课程\n发布日期：2019 年 1 月 1 日\n更新：2019 年 12 月\n\n###\
  \ 课程更新\n*   对计分的 Checkpoint（检查）自测学习辅助工具进行了性能改进和内容增强\n*   对自动评分的章节末测验（Quiz）问题和章节末编程项目（Programming\
  \ Projects）进行了题目陈述精炼和系统兼容性改进\n*   重新组织了作者编辑的学习活动（以尽量减少冗余，并与每个章节的学习目标保持更紧密的结合）\n\n\
  Revel 是交互式学习环境，吸引学生并帮助他们学习 Java 基础知识。本 Revel 课程基于 Tony Gaddis 广泛使用的印刷版教材第 7 版 *Starting\
  \ Out With Java, From Control Structures to Objects*。\n\n在本课程中，CS1 作者兼讲师 Tony Gaddis\
  \ 在整个叙述中整合了动画、视频、交互内容以及真实的、可分配的作业，使学生能够在学习点练习核心编码技能：\n\n#### 动态列表 (Animated Listings)\n\
  动态列表通过“单步”引导学生阅读代码（类似于简单的调试工具），显示并解释程序中正在发生的情况：\n\n![一个页面显示了程序第 5 dash 1 行的动态列表。](img/00_unfig01_java.png)完整备用文本\n\
  \n#### 视频笔记 (VideoNotes)\n视频笔记模拟了“办公答疑”的体验。它们让初级程序员对困难的概念有更深入的理解，或者展示专家如何为编程项目构建解决方案。所有视频均由作者\
  \ Tony Gaddis 创建并配音。\n\n![Video Note 页面中视频的截图。截图显示了一个向方法传递参数的程序，带有手画注释。](img/00_unfig02-java.png)完整备用文本\n\
  \n#### 实时代码示例 (Live Code Examples)\n实时代码示例让学生能够在实时编码环境中练习所学内容：\n\n![一个活跃的代码列表页面显示了一个问题，随后是一个包含程序的窗口和一个包含结果的窗口。](img/00_unfig03_java.png)完整备用文本\n\
  \n通常，学生被要求修改或向预填充代码进行添加，然后对结果回答问题。程序运行在单一的交互“结果”（Result）窗口中（没有单独的输入窗口）。\n\n####\
  \ 交互内容 (Interactives)\n交互式内容在每个章节末尾通过多选题和匹配题测试学生新发现的 Java 知识：\n\n![一个用于将循环与描述匹配的交互页面，显示了一个具有\
  \ 2 列 3 行的表格。](img/00_unfig04_java.png)完整备用文本\n\n#### Checkpoint 问题 (Checkpoint\
  \ Questions)\n计分的（值值 1 分）和不计分的 Checkpoint 问题要求学生通过编写一行或两行 C++ 代码来测试他们的理解情况。\n\n\
  ![Checkpoint 5.64 下的一个简单代码问题。](img/00_unfig05_java.png)完整备用文本\n\n#### 评估与反馈 (Assessment\
  \ and Feedback)\n系统评估学生代码，并在性能仪表板（成绩单）中记录尝试（无论正确或错误）。\n\n章节末测验（Quiz）和章节末编程项目（Programming\
  \ Projects）通过提供编写部分或完整 Java 程序的机会来评估学生的理解。学生将获得即时的个性化反馈。教师可以在性能跟踪器中跟踪进度。\n\n![编码评估页面显示了一个值\
  \ 3 分的问题以及问题下方的一个程序。](img/00_unfig06_java.png)完整备用文本\n\n系统会自动检测代码提交中的逻辑和语法错误，并提供针对性的提示，使学生能够找出哪里出了问题以及为什么：\n\
  \n![代码分析页面显示了程序中的逻辑错误。](img/00_unfig07_java.png)完整备用文本\n\n最近尝试的正确/错误状态与每次代码提交一起存储在性能仪表板中。\n\
  \n在线课程应该是自包含的：编程学生不应该在网络上搜寻与其经验水平相符的准确、可靠材料。本针对 *Starting Out With Java* 的 Revel\
  \ 课程精心平衡了经过验证的文本叙述与交互内容、编程机会和参考材料，所有内容都是为初级程序员量身定制的。\n\n# 给教师的说明\n\n\n\n\n\nRevel\
  \ 中的 *Starting Out with Java: From Control Structures through Objects* 旨在用于为期一学期或两个学期的\
  \ CS1 课程。虽然它是为没有基础编程背景的学生编写的，但即使是经验丰富的学生也会从其详尽的细节中受益。叙述采用清晰、易懂的语言编写，涵盖了入门编程课程所需的所有主题。课程包含了丰富的示例程序，这些程序简洁、实用且面向实世界，确保学生不仅能学会如何实现\
  \ Java 的功能和结构，还能理解为什么以及何时使用它们。\n\n这门 Revel 课程首先向学生介绍数据类型基础、输入与输出、控制结构、方法以及标准库类创建的对象。接下来，学生将学习使用基本类型数组和引用类型数组。之后，学生将学习更高级的主题，例如继承、多态、包的创建与管理、GUI\
  \ 应用、递归和数据库编程。\n\n# 课程结构\n\n这门 Revel 课程循序渐进地教授 Java。每个章节涵盖一组主要主题，并在学生阅读书籍的过程中构建知识。虽然章节可以按照现有顺序轻松教学，但具有一定的灵活性。下图显示了章节之间的依赖关系。每个框代表一个章节或一组章节。箭头从一个章节指向必须先涵盖的章节。\n\
  \n![一张图表描述了书中章节的依赖关系。](img/00_unfig08_java.png)完整替代文本\n\n# 作业工具、性能仪表板与 LMS 集成\n\n\
  通过作业工具，Revel 允许你精确指定在哪些日期完成哪些阅读：\n\n![页面显示了 3 月 24 日下午 8 点 PDT 截止的作业得分，分 23 分。来自\
  \ Gaddis Q A 的消息显示了第 5 章各部分的得分。](img/00_unfig09_java.png)\n\n这种清晰、详细的进度表通过消除对每节课涵盖内容的任何模糊，帮助你的学生专注于任务。\n\
  \nRevel 的性能仪表板让你能够监控课堂作业的完成情况以及每个学生的成就：\n\n![性能概览显示了一个条形图和一个表格。](img/00_unfig10_java.png)完整替代文本\n\
