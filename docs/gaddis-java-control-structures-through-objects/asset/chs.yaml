  \n### 提示\nJavaFX 支持大量的 CSS 属性（多于我们本书能涵盖的范围）。创建样式表的过程的一部分是确定哪些属性对于你应用程序中的节点是可用的。Oracle\
  \ 出版了一份详尽的 CSS 参考指南，记录了所有可用的属性。你可以在此处找到该指南：\n\n[`https://docs.oracle.com/javase/8/javafx/api/javafx/scene/doc-files/cssref.html`](https://docs.oracle.com/javase/8/javafx/api/javafx/scene/doc-files/cssref.html)\n\
  \n## 为根节点应用样式\n如果你想对场景中的所有节点应用样式，请使用 `.root` 选择器。代码列表 13-5 显示了一个包含两个样式定义的示例样式表：一个用于根节点，另一个用于\
  \ `Label` 控件。代码列表 13-6 中的程序应用了该样式表，而 图 13-3 显示了程序的输出。注意，`Label` 和 `Button` 都以衬线字体显示文本。这是由\
  \ `.root` 样式定义指定的。\n\n![C S S Demo 3 dot java 的输出应用了 Label 和 Button 控件的样式定义，并包含加粗字体文本\
  \ Hello world。](img/13fig03.png)\n\n## 图 13-3 CSSDemo3.java 输出（Oracle 法律顾问）\n在下面的动画中，点击“Previous”或“Next”按钮逐行查看代码并查看全程的解释。\n\
