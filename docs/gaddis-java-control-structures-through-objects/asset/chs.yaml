  \ |\n\n如你所见，表有 18 行。每行包含关于一种咖啡的数据。行被分为三列。第一列命名为 `Description`（描述），包含咖啡的描述。第二列命名为\
  \ `ProdNum`（产品编号），包含咖啡的产品编号。第三列命名为 `Price`（价格），包含每磅咖啡的价格。如图 16-3](#ch16_pg0003.xhtml_P700101587800000000000000000）所示，表的第三行包含以下数据：\n\
  \n* 描述：巴西深烘\n* 产品编号：15-001\n* 价格：7.95\n\n![表 16.1 列出的 9 个项目在 Coffee 数据库表中。列标记为 Description、Prod\
  \ Num 和 Price。每行包含关于单个条目的的数据。](img/16fig03.png)\n\n# 图 16-3 `Coffee` 数据库表\n\n# 列类型\n\
  \n数据库表中的列被分配了一个类型。注意 `Coffee` 表中的 `Description` 和 `ProdNum` 列包含字符串，而 `Price` 列包含浮点数。列的数据类型不是\
  \ Java 类型，而是 SQL 类型。表 16-2` 或 `CHAR(n)` | 长度为 n 的固定字符串 | `String` |\n| `VARCHAR(n)`\
  \ | 最大长度为 n 的变长字符串 | `String` |\n| `REAL` | 单精度浮点数 | `float` |\n| `DOUBLE` | 双精度浮点数\
  \ | `double` |\n| `DECIMAL(t,d)` | 总共 t 位、小数点后 d 位的小数 | `java.math.BigDecimal` |\n\
  | `DATE` | 日期 | `java.sql.Date` |\n\nSQL 中还有许多其他数据类型。创建 `Coffee` 表时，列使用了以下数据类型：\n\
  \n* `Description` 列的类型是 `CHAR(25)`。这意味着 `Description` 列中的每个值都是长度为 25 的字符串，兼容 Java\
  \ 的 `String` 类型。\n* `ProdNum` 列的类型是 `CHAR(10)`。这意味着 `ProdNum` 列中的每个值都是长度为 10 的字符串，兼容\
  \ Java 的 `String` 类型。\n* `Price` 列的类型是 `DOUBLE`。这意味着 `Price` 列中的每个值都是双精度浮点数，兼容 Java\
  \ 的 `double` 类型。\n\n# 主键\n\n大多数数据库表都有 `primary key`（主键），它是用于识别表中特定行的列。指定为主键的列为每行存储唯一值。如果你尝试在主键列中存储重复数据，将会报错。\n\
  \n在 `Coffee` 表中，`ProdNum` 列是主键，因为它为每种咖啡存储了唯一的产品编号。这里其他例子：\n\n* 假设一个表存储员工数据，其中一列存储员工\
  \ ID 号。因为每个员工的 ID 号都是唯一的，所以该列可以作为主键。\n* 假设一个表存储手机公司的手机库存，其中一列存储手机序列号。因为每个手机的序列号都是唯一的，所以该列可以作为主键。\n\
  * 假设一个表存储发票数据，其中一列存储发票号。每个发票都有唯一的发票号，因此该列可以使用主键。\n\n### 注意\n\n表的主键可以是表中几列的组合。\n\n\
  # 检查点 16.8\n\n自测练习\n\n# 检查点 16.9\n\n自测练习\n\n# 检查点 16.10\n\n自测练习\n\n# 16.3 SQL `SELECT`\
  \ 语句简介\n\n概念：`SELECT` 语句用于 SQL 中从数据库中检索数据。\n\n\n\n\n\n我们将讨论的第一个 SQL 语句是 `SELECT`\
  \ 语句。你使用 `SELECT` 语句来检索表中的行。正如其名称所示，`SELECT` 语句允许你选择特定的行。我们将从该语句的一个非常简单的形式开始，如下：\n\
  \n```\nSELECT Columns FROM Table\n```\n\n在通用形式中，`Columns` 是一个或多个列名，而 `Table` 是表名。这里是一个可能在\
  \ `CoffeeDB` 数据库上执行的 `SELECT` 语句示例：\n\n```\nSELECT Description FROM Coffee\n```\n\
  \n该语句将检索 `Coffee` 表中每一行的 `Description` 列。图 16-4 显示了结果的示例。\n\n# 图 16-4 `Description`\
  \ 列\n\n| Description |\n| --- |\n| Bolivian Dark |\n| Bolivian Medium |\n| Brazilian\
  \ Dark |\n| Brazilian Medium |\n| Brazilian Decaf |\n| Central American Dark |\n\
  | Central American Medium |\n| Sumatra Dark |\n| Sumatra Decaf |\n| Sumatra Medium\
  \ |\n| Sumatra Organic Dark |\n| Kona Medium |\n| Kona Dark |\n| French Roast Dark\
  \ |\n| Galapagos Medium |\n| Guatemalan Dark |\n| Guatemalan Decaf |\n| Guatemalan\
  \ Medium |\n\n图 16-4 显示了 `SELECT` 语句的结果，但这些结果会发生什么变化呢？在 Java 程序中，`SELECT` 语句的结果以\
  \ `ResultSet` 对象的形式返回给程序。`ResultSet` 对象仅仅是一个包含 SQL 语句结果的对象。将 SQL 语句发送到 DBMS 的过程可以总结为以下步骤：\n\
  \n1. 获取与数据库的连接。\n2. 将包含 SQL 语句的字符串传递给 DBMS。如果 SQL 语句有结果要返回，则将向程序返回 `ResultSet` 对象。\n\
  3. 如果向程序返回了 `ResultSet` 对象，则处理该对象的内容。\n4. 完成数据库的操作后，关闭连接。\n\n你之前在 代码列表 16-1 中见过如何执行步骤\
  \ 1（获取数据库连接）和步骤 4（关闭连接）的示例。接下来我们查看如何将 SQL 语句发送到 DBMS 以及在步骤 2 和 3 中如何处理其结果的细节。\n\n\
  # 将 SQL 语句传递给 DBMS\n\n一旦你获取了与数据库的连接，就可以向 DBMS 发出 SQL 语句了。首先，你必须使用 `Connection` 对象的\
  \ `createStatement` 方法从其获取一个 `Statement` 对象。这里是一个示例：\n\n```\nStatement stmt = conn.createStatement();\n\
  ```\n\n执行此代码后，`stmt` 变量将引用一个 `Statement` 对象。`Statement` 是 `java.sql` 包中的一个接口。`Statement`\
  \ 对象具有多种可以执行 SQL 查询的方法。要执行 `SELECT` 查询，你使用 `executeQuery` 方法。该方法返回一个 `ResultSet`\
  \ 对象。这里是一个示例：\n\n```\nString sqlStatement = \"SELECT Description FROM Coffee\";\n\
  ResultSet result = stmt.executeQuery(sqlStatement);\n```\n\n第一条语句创建了一个包含 SQL 查询的字符串。第二条语句将此字符串作为参数传递给\
  \ `executeQuery` 方法。该方法返回一个包含查询结果的 `ResultSet` 对象的引用。该引用被赋值给 `result` 变量。图 16-5\
  \ 说明了 `result` 变量如何引用 `ResultSet` 对象。\n\n![图 16.4 中的产品表显示在 S Q L 数据库中。Result Set\
  \ 对象包含 S Q L 查询的结果。第一个产品 Bolivian Dark 被识别为结果变量。](img/16fig05.png)\n\n# 图 16-5 一个\
  \ `ResultSet` 对象包含 SQL 查询的结果\n\n`ResultSet` 对象包含一组行和列。图 16-5 中的 `ResultSet` 对象有\
  \ 18 行和一列。`ResultSet` 中的行是有编号的，第一行是第 1 行，第二行是第 2 行，依此类推。列也有编号，第一列是第 1 列，第二列是第 2\
  \ 列，依此类推。图 16-6 显示了。\n\n![图 16.4 中的产品表显示在 S Q L 数据库中。Result Set 对象包含 S Q L 查询的结果。第一个产品\
  \ Bolivian Dark 被识别为结果变量。](img/16fig06.png)\n\n# 图 16-6 `ResultSet` 的行和列\n\n# 从\
  \ `ResultSet` 获取行\n\n`ResultSet` 对象包含一组行和列。图 16-5 中的 `ResultSet` 对象有 18 行和一列。`ResultSet`\
  \ 中的行是有编号的，第一行是第 1 行，第二行是第 2 行，依此类推。列也有编号，第一列是第 1 列，第二列是第 2 列，依此类推。图 16-6 显示了的。\n\
  \n![图 16.4 中的产品表显示在 S Q L 数据库中。Result Set 对象包含 S Q L 查询的结果。第一个产品 Bolivian Dark 被识别为结果变量。](img/16fig07.png)\n\
  \n# 图 16-7 指标器位于第一行之前\n\n# `ResultSet` 移动行\n\n`ResultSet` 对象有一个内部指标器指向某行。`ResultSet`\
  \ 指标器指向的是当前行。指标器可以移动以检查 `ResultSet` 的所有行。最初，指标器没有指向任何行，而是位于第一行之前。图 16-8\n\n![图 16.4\
  \ 中的产品表显示在 S Q L 数据库中。Result Set 对象包含 S Q L 查询的结果。第一个产品 Bolivian Dark 被识别为结果变量。](img/1616.-\n\
  \n# `next` 方法移动指标器\n\n要将指标器移动到新创建的 `ResultSet` 的第一行，你调用该对象的 `next` 方法。这里有一个示例：\n\
  \n```\nresult.next();\n```\n\n假设 `result` 引用一个新创建的 `ResultSet`，图 16-9 显示了指标器移动到了第一行。\n\
  \n![图 16.4 中的产品表显示在 S Q L 数据库中。Result Set 对象包含 S Q L 查询的结果。第一个产品 Bolivian Dark 被识别为结果变量。](img/16fig08.png)\n\
  \n# 图 16-8 指标器移动到第一行\n\n每次调用 `next` 方法，它都会将指标器移动到下一行。`next` 方法返回一个 `boolean` 值。如果指标器成功移动到下一行，则返回\
  \ `true`。如果没有更多行，则返回 `false`。以下代码显示了你如何遍历新创建的 `ResultSet` 的所有行：\n\n```\nwhile (result.next())\
  \ {\n    // 处理当前行。\n}\n```\n\n还有其他 `ResultSet` 方法用于导航 `ResultSet` 中的行。我们将在本章节后面介绍一些。\n\
  \n# 在 `ResultSet` 行中获取列\n\n你使用 `ResultSet` 对象的“get”方法来检索当前行中特定列的内容。当你调用这些方法之一时，你可以传递列号或列名作为参数。`ResultSet`\
  \ 接口定义了许多“get”方法。表 16-3 列出了其中一些。\n\n# 表 16-3 一些 `ResultSet` 方法\n\n| ResultSet 方法\
  \ | 说明 |\n| --- | --- |\n| `double getDouble(int` *`colNumber``)` `double getDouble(String`\
  \ *`colName``)` | 返回存储在 *`colNumber`* 或 *`colName`* 指定列中的 `double`。列必须包含与 Java `double`\
  \ 类型兼容的数据。如果发生错误，方法将抛出 `SQLException`。 |\n\n\n\n\n\n| `getInt(int colNumber)` |\
  \ `getInt(String colName)` | 返回由 `colNumber` 或 `colName` 指定列中存储的 `int`。该列必须包含与 Java\
  \ `int` 数据类型兼容的数据。如果发生错误，该方法将抛出 `SQLException`。 |\n| `getString(int colNumber)`\
  \ | `getString(String colName)` | 返回由 `colNumber` 或 `colName` 指定列中存储的字符串。该列必须包含与\
  \ Java `String` 类型兼容的数据。如果发生错误，该方法将抛出 `SQLException`。 |\n\n记住，列具有 SQL 数据类型。SQL 数据类型与\
  \ Java 数据类型不同，但它们之间是兼容的。要检索列的内容，你需要调用专门为该列数据类型设计的方法。例如，如果列包含字符串，你将使用 `getString`\
  \ 方法来获取其值。如果列包含整数，你将使用 `getInt` 方法。同样，如果列包含 `double`，你将调用 `getDouble` 方法。\n\n当你调用其中一个“get”方法时，你必须告诉它你想要检索当前行中的哪一列。这些方法接受一个整数参数（即列号）或一个持有列名的\
  \ `String`。\n\n我们在示例中查看的 `ResultSet` 包含一列：`Description` 列。`Description` 列的数据类型为\
  \ `CHAR(25)`，这意味着它是长度为 25 个字符的固定字符串。这与 Java 的 `String` 类型兼容。要显示当前行中 `Description`\
  \ 列的内容，我们可以使用以下语句：\n\n```\nSystem.out.println(result.getString(\"Description\"));\n\
  ```\n\n`Description` 列持有与 `String` 类型兼容的值，因此我们使用 `getString` 方法来检索其内容。我们也可以使用列号来检索列内容。这里是一个示例：\n\
  \n```\nSystem.out.println(result.getString(1));\n```\n\n# Note\n\n数据库表中的列名是不区分大小写的。列名\
  \ `DESCRIPTION`、`description` 和 `Description` 都是相同的。\n\n让我们来看一个演示我们所涵盖内容的完整程序。代码列表\
  \ 16-2 显示了 `CoffeeDB` 数据库中所有行的 `Description` 列。\n\n# 代码列表 16-2 `(ShowCoffeeDescriptions.java)`\n\
  \n```java\nimport java.sql.*;\n\n/**\n * 此程序演示如何使用 JDBC 向数据库 发送 SQL\n * 语句。\n */\n\
  public class ShowCoffeeDescriptions\n{\n    public static void main(String[] args)\n\
  \    {\n        // 为 URL 创建命名常量。\n        // 注意：此值特定于 Java DB 或 Apache Derby。\n\
  \        final String DB_URL = \"jdbc:derby:CoffeeDB\";\n\n        try {\n     \
  \       // 创建与数据库的连接。\n            Connection conn = DriverManager.getConnection(DB_URL);\n\
  \n            // 创建 Statement 对象。\n            Statement stmt = conn.createStatement();\n\
  \n            // 创建一个包含 SELECT 语句的字符串。\n            String sqlStatement = \"SELECT\
  \ Description FROM Coffee\";\n\n            // 将语句发送给 DBMS。\n            ResultSet\
  \ result = stmt.executeQuery(sqlStatement);\n\n            // 显示列表的标题。\n       \
  \     System.out.println(\"Coffees Found in the Database\");\n            System.out.println(\"\
  -----------------------------\");\n\n            // 显示结果集的内容。\n            // 结果集将有三列。\n\
  \            while (result.next()) {\n                System.out.println(result.getString(\"\
  Description\"));\n            }\n\n            // 关闭连接。\n            conn.close();\n\
  \        } catch (Exception ex) {\n            System.out.println(\"ERROR: \" +\
  \ ex.getMessage());\n        }\n    }\n}\n```\n\n程序输出\n\n```\nCoffees Found in the\
  \ Database\n-----------------------------\nBolivian Dark\nBolivian Medium\nBrazilian\
  \ Dark\nBrazilian Medium\nBrazilian Decaf\nCentral American Dark\nCentral American\
  \ Medium\nSumatra Dark\nSumatra Decaf\nSumatra Medium\nSumatra Organic Dark\nKona\
  \ Medium\nKona Dark\nFrench Roast Dark\nGalapagos Medium\nGuatemalan Dark\nGuatemalan\
  \ Decaf\nGuatemalan Medium\n```\n\n让我们仔细看看代码。第 14 行声明了一个字符串常量，初始化为 `CoffeeDB` 数据库的\
  \ URL。访问数据库的语句写在第 18 到 42 行的 `try` 块中。第 19 行获取数据库的连接。执行第 19 行后，变量 `conn` 将引用一个可以访问数据库的\
  \ `Connection` 对象。\n\n在程序的此时，我们已经有了到 `CoffeeDB` 数据库的连接，但我们还没有准备好向数据库发送 `SELECT`\
  \ 语句。为了向数据库发送 `SELECT` 语句，我们必须有一个 `Statement` 对象。第 22 行调用 `Connection` 对象的 `createStatement`\
  \ 方法，该方法返回一个 `Statement` 对象的引用。该引用被赋值给变量 `stmt`。\n\n第 25 行声明了一个名为 `sqlStatement`\
  \ 的 `String` 变量，初始化为字符串 `\"SELECT Description FROM Coffee\"`。\n\n\n\n\n\n```java\n\
  import java.sql.*;  // Needed for JDBC classes\n\n/**\n    此程序显示咖啡的描述\n    以及它们的价格。\n\
  \ */\n\npublic class ShowDescriptionsAndPrices\n{\n    public static void main(String[]\
  \ args)\n    {\n       // 为 URL 创建一个命名常量。\n       // 注意：此值特定于 Java DB 或 Apache Derby。\n\
  \       final String DB_URL = \"jdbc:derby:CoffeeDB\";\n\n       try\n       {\n\
  \          // 创建到数据库的连接。\n          Connection conn = DriverManager.getConnection(DB_URL);\n\
