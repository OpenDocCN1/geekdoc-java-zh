  \n# 9.5 字符串分词\n\n概念：字符串分词（Tokenizing）是将字符串分解为各个组件的过程，这些组件被称为标记（tokens）。可以使用 `String`\
  \ 类的 `split` 方法对字符串进行分词。\n\n有时，字符串会包含一组由空格或其他字符分隔的单词或其他数据。例如，查看以下字符串：\n\n```\n\"\
  peach raspberry strawberry vanilla\"\n```\n\n该字符串包含以下四个数据项：`peach`、`raspberry`、`strawberry`\
  \ 和 `vanilla`。在编程术语中，这些项目被称为 `tokens`。注意项目之间存在空格。分隔标记的字符被称为分隔符（delimiter）。这是另一个例子：\n\
  \n```\n\"17;92;81;12;46;5\"\n```\n\n该字符串包含以下标记：`17`、`92`、`81`、`12`、`46` 和 `5`。注意每个项目之间都有分号。在这个例子中，分号被用作分隔符。某些编程问题要求你读取一个包含项目列表的字符串，然后从字符串中提取所有标记进行处理。例如，查看以下包含日期的字符串：\n\
  \n```\n\"3-22-2018\"\n```\n\n该字符串中的标记是 `3`、`22` 和 `2018`，分隔符是连字符 `-。程序可能需要从此类字符串中提取月份、日期和年份。另一个例子是操作系统的路径，例如：\n\
  \n```\n/home/rsullivan/data\n```\n\n该字符串中的标记是 `home`、`rsullivan` 和 `data`，分隔符是 `/`\
  \ 字符。程序可能需要从此类路径中提取所有的目录名称。\n\n将字符串分解为标记的过程被称为 `tokenizing`。在本节中，我们将讨论 `String`\
  \ 类的 `split` 方法，这是一个你可以用于对字符串分词的工具。\n\n`String` 类有一个名为 `split` 的方法，它可以将字符串分词并返回一个\
  \ `String` 对象的数组。数组中的每个元素都是其中一个标记。例如，请查看代码列表 9-8。\n\n```\n 1  /**\n  2     此程序演示了\
  \ String 类的\n  3     split 方法。\n  4  */\n  5\n  6  public class SplitDemo1\n  7\
  \  {\n  8     public static void main(String[] args)\n  9     {\n  10        //\
  \ 创建一个用于分词的字符串。\n  11        String str = \"one two three four\";\n  12\n  13  \
  \      // 使用空格分隔符获取标记。\n  14        String[] tokens = str.split(\" \");\n  15\n\
    16        // 显示标记。\n  17        for (String s : tokens)\n  18           System.out.println(s);\n\
    19    }\n  20  }\n```\n\n#### 程序输出\n\n```\none\n two\n three\n four\n```\n\n####\
  \ 代码列表 9-8\n\n在第 11 行，我们将字符串 `\"one two three four\"` 赋值给变量 `str`。注意单词之间由空格分隔。第\
  \ 14 行调用了 `str` 对象的 `split` 方法。传递给 `split` 方法的参数指示分隔符。在这个例子中，使用空格作为分隔符。该方法返回一个包含字符串\
  \ `\"one\"`、`\"two\"`、`\"three\"` 和 `\"four\"` 的数组。该数组被赋值给变量 `tokens`。然后，第 17 行和第\
  \ 18 行的 `for` 循环显示了数组的元素。\n\n你传递给 split 方法的参数是一个正则表达式（regular expression）。正则表达式是一个指定字符模式的字符串。正则表达式是非常强大的工具，通常用于搜索字符串、文件或其他文本集合中存在的模式。对正则表达式的完整讨论超出了本书的范围。然而，我们将为了字符串分词的目的，讨论正则表达式的一些基本用法。\n\
  \n在上一个例子中，我们向 `split` 方法传递了一个包含单个空格的字符串。这指定了空格字符是分隔符。`split` 方法还允许你使用多字符分隔符。这意味着你并不限于使用单个字符作为分隔符。如果你愿意，你的分隔符可以是整个单词。以下代码摘自本章源代码中的\
  \ `SplitDemo2.java` 程序，演示了：\n\n```\n// 创建一个用于分词的字符串。\n String str = \"one and two\
  \ and three and four\";\n\n // 使用 \" and \" 作为分隔符获取标记。\n String[] tokens = str.split(\"\
  \ and \");\n\n // 显示标记。\n    for (String s : tokens)\n    System.out.println(s);\n\
  ```\n\n这段代码将产生以下输出：\n\n```\none\n two\n three\n four\n```\n\n\n\n\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-29/index.html\n\
  \n# Checkpoint 9.38\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-30/index.html\n\
  \n# Checkpoint 9.39\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-31/index.html\n\
  \n# 9.6 数值数据类型的包装类\n\n概念：Java API 为每种数值数据类型都提供了包装类。这些类拥有方法，可以执行涉及原始数值数值的有用操作。\n\n\
  在本章前面的部分，我们讨论了 `Character` 包装类及其一些静态方法。Java API 还为所有数值原始数据类型都提供了包装类，如表 9-11 所示。\n\
  \n# 表 9-11 数值原始数据类型的包装类\n\n| 包装类 | 其所适的原始类型 |\n| --- | --- |\n| `Byte` | `byte`\
  \ |\n| `Double` | `double` |\n| `Float` | `float` |\n| `Integer` | `int` |\n| `Long`\
  \ | `long` |\n| `Short` | `short` |\n\n你已经在使用许多此类包装类的“解析”（parse）方法，这些方法将字符串转换为原始类型的值。例如，`Integer.parseInt`\
  \ 方法将字符串转换为 `int`，而 `Double.parseDouble` 方法将字符串转换为 `double`。现在我们将检查包装类的其他方法和用途。\n\
  \n# 静态 `toString` 方法\n\n每个数值包装类都有一个静态 `toString` 方法，可以将数字转换为字符串。该方法接受数字作为参数，并返回该数字的字符串表示。以下代码演示了：\n\
  \n```\nint i = 12;\ndouble d = 14.95;\nString str1 = Integer.toString(i);\nString\
  \ str2 = Double.toString(d);\n```\n\n# `toBinaryString`, `toHexString`, 和 `toOctalString`\
  \ 方法\n\n`toBinaryString`、`toHexString` 和 `toOctalString` 方法是 `Integer` 和 `Long`\
  \ 包装类的静态成员。这些方法接受整数作为参数，并返回数字转换为二进制、十六进制或八进制的字符串表示。以下代码演示了这些方法：\n\n```\nint number\
  \ = 14;\nSystem.out.println(Integer.toBinaryString(number));\nSystem.out.println(Integer.toHexString(number));\n\
  System.out.println(Integer.toOctalString(number));\n```\n\n此代码将产生以下输出：\n\n```\n\
  1110\ne\n16\n```\n\n# `MIN_VALUE` 和 `MAX_VALUE` 常量\n\n每个数值包装类都有一组名为 `MIN_VALUE`\
  \ 和 `MAX_VALUE` 的静态 `final` 变量。这些变量存储特定数据类型的最小值和最大值。例如，`Integer.MAX_VALUE` 存储 `int`\
  \ 允许的最大值。例如，以下代码显示了 `int` 的最小值和最大值：\n\n```\nSystem.out.println(\"The minimum value\
  \ for an \" +\n                   \"int is \" + Integer.MIN_VALUE);\nSystem.out.println(\"\
  The maximum value for an int is \" + Integer.MAX_VALUE);\n```\n\n# 自动装箱与拆箱\n\n可以使用包装类创建对象。一种方法是向构造函数传递一个初始值，如下：\n\
  \n```\ninteger number = new Integer(7);\n```\n\n这创建了一个初始化值为 7 的 `Integer` 对象，由变量\
  \ `number` 引用。另一种方法是声明一个包装类变量，然后给它分配一个原始值。例如，看以下代码：\n\n```\nInteger number;\nnumber\
  \ = 7;\n```\n\n代码中的第一条语句声明了一个名为 `number` 的 `Integer` 变量。它没有创建 `Integer` 对象，只是一个变量。第二条语句是一个简单的赋值语句。它将原始值\
  \ 7 分配给变量。你可能怀疑这会导致错误。毕竟，`number` 是引用变量，而不是原始变量。然而，由于 `number` 是包装类变量，Java 执行了自动装箱操作。*自动装箱*（Autoboxing）是\
  \ Java 将值自动“封装”到对象内部的过程。当执行赋值语句时，Java 将值 7 封装在 `Integer` 对象中，然后将该对象的地址分配给变量 `number`。\n\
  \n*拆箱*（Unboxing）是装箱的反相反。是将包装类对象转换为原始类型的过程。\n\n# Checkpoint 9.42\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-32/index.html\n\
  \n# Checkpoint 9.48\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-33/index.html\n\
  \n# Checkpoint 9.49\n\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-34/index.html\n\
  \n# 9.7 关注问题解决：`TestScoreReader` 类\n\n\n\n\n\nHarrison 教授将学生的测试成绩存储在 Microsoft Excel\
  \ 表格中。图 9-7 显示了五个学生的五份测试成绩。每列包含一个测试成绩，每行代表一个学生的性分。\n\n## 图 9-7 Microsoft Excel 表格\n\
  \n![一个 Microsoft Excel 表格包含五个学生的五份测试成绩。A 列到 E 列分别包含第 1-5 行代表的 5 个学生的测试成绩。](img/09fig07.png)图\
  \ 9-7 完整替代文本\n\n除了在 Excel 中处理分数外，Harrison 博士还想编写一个 Java 程序来访问这些分数。Excel 与许多商业应用程序一样，具有将数据导出到文本文件的能力。当导出电子表格中的数据时，每行都会被写入一行，单元格中的值用逗号分隔。例如，当导出图\
  \ 9-7 中所示的数据时，它将以以下格式写入文本文件：\n\n```\n87,79,91,82,94\n72,79,81,74,88\n94,92,81,89,96\n\
  77,56,67,81,79\n79,82,85,81,90\n```\n\n这被称为“逗号分隔值”（comma separated value）文件格式。当你以这种格式保存电子表格时，Excel\
  \ 会将其保存为扩展名为 `.csv` 的文件。Harrison 博士决定将她的表格导出为 `.csv` 文件，然后编写一个读取该文件的 Java 程序。该程序将使用\
  \ `String` 类的 `split` 方法从每行中提取测试成绩，并使用包装类将标记转换为数值。作为一个实验，她编写了代码列表 9-9 所示的 `TestScoreReader`\
  \ 类。\n\n```\n 1  import java.io.*;\n 2  import java.util.Scanner;\n 3\n 4  /**\n\
  \ 5     TestScoreReader 类从文件中读取测试成绩作为\n 6     标记，并计算每行分数的\n 7     平均值。\n 8  */\n\
  \ 9\n 10  public class TestScoreReader\n 11  {\n 12     private Scanner inputFile;\n\
  \ 13     private String line;\n 14\n 15     /**\n 16        构造函数打开一个文件以读取\n 17 \
  \       成绩。\n 18        @param filename 打开的文件。\n 19     */\n 20\n 21     public\
  \ TestScoreReader(String filename)\n 22                            throws IOException\n\
  \ 23     {\n 24        File file = new File(filename);\n 25        inputFile = new\
  \ Scanner(file);\n 26     }\n 27\n 28     /**\n 29        readNextLine 方法从文件中读取\n\
  \ 30        下一行。\n 31        @return 如果读取了行，则返回 true，否则\n 32        返回 false。\n\
  \ 33     */\n 34\n 35     public boolean readNextLine() throws IOException\n 36\
  \     {\n 37        boolean lineRead; // 标记变量\n 39\n 40        // 判断是否有更多待读。\n 41\
  \        lineRead = inputFile.hasNext();\n 42\n 43        // 如果是，读取下一行。\n 44   \
  \     if (lineRead)\n 45          line = inputFile.nextLine();\n 46\n 47       \
  \ return lineRead;\n 48     }\n 49\n 50     /**\n 51        getAverage 方法计算从文件中读取的\n\
  \ 52        最后一组测试成绩的平均值。\n 53        @return 平均值。\n 54     */\n 55\n 56     public\
  \ double getAverage()\n 57     {\n 58        int total = 0;  // 累加器\n 59       \
  \ double average; // 平均测试分数\n 60\n 61        // 将文件中读取的最后一行分词。\n 62        String[]\
  \ tokens = line.split(\",\");\n 63\n 64        // 计算测试成绩的总和。\n 65        for (String\
  \ str : tokens)\n 66        {\n 67           total += Integer.parseInt(str);\n 68\
  \        }\n 69\n 70        // 计算分数的平均值。\n 71        // 使用强制转换以避免整数除法。\n 72    \
  \    average = (double) total / tokens.length;\n 73\n 74        // 返回平均值。\n 75 \
  \       return average;\n 76     }\n 77\n 78     /**\n 79        close 方法关闭文件。\n\
  \ 80     */\n 81\n 82     public void close() throws IOException\n 83     {\n 84\
  \        inputFile.close();\n 85     }\n 86  \n```\n\n## 代码列表 9-9 `(TestScoreReader.java)`\n\
  \n构造函数接受文件作为参数并打开该文件。`readNextLine` 方法从文件中读取一行并将其存储在 `line` 字段中，如果读取了行则返回 `true`，如果没有可读的行则返回\
  \ `false`。`getAverage` 方法对文件中读取的最后一行进行分词，将标记转换为 `int` 值并计算平均值。\n\n```\n1  import\
  \ java.io.*;\n 2  import java.util.Scanner;\n 3\n 4  /**\n 5     TestScoreReader\
  \ 类从文件中读取测试成绩作为\n 6     标记，并计算每行分数的\n 7     平均值。\n 8  */\n 9\n 10  public class\
  \ TestScoreReader\n 11  {\n 12     private Scanner inputFile;\n 13     private String\
  \ line;\n 14\n 15     /**\n 16        构造函数打开一个文件以读取\n 17        成绩。\n 18       \
  \ @param filename 打开的文件。\n 19     */\n 20\n 21     public TestScoreReader(String\
  \ filename)\n 22                            throws IOException\n 23     {\n 24 \
  \       File file = new File(filename);\n 25        inputFile = new Scanner(file);\n\
  \ 26     }\n 27\n 28     /**\n 29        readNextLine 方法从文件中读取\n 30        下一行。\n\
  \ 31        @return 如果读取了行，则返回 true，否则\n 32        返回 false。\n 33     */\n 34\n\
