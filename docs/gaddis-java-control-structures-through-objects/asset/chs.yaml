  \n## 编程挑战\n\n# 1. 拉丁语翻译器\n\n# 观看拉丁语翻译器\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/bEEQqLN8ZChGDl_9IIIHTp4gmMA3AD3A`](https://mediaplayer.pearsoncmg.com/assets/_video.true/bEEQqLN8ZChGDl_9IIIHTp4gmMA3AD3A)\n\
  \n查看以下拉丁语单词及其含义列表：\n\n| 拉丁语 | 英语 |\n| --- | --- |\n| sinister | 左 |\n| dexter |\
  \ 右 |\n| medium | 中 |\n\n创建一个 JavaFX 应用程序，将拉丁语单词翻译成英语。GUI 应该有三个 `Button`，每个对应一个拉丁语单词。当用户点击\
  \ `Button` 时，应用程序应该在 `Label` 中显示英语翻译。\n\n# 2. 姓名格式化\n\n创建一个 JavaFX 应用程序，允许用户输入以下数据：\n\
  \n*   用户的名\n*   用户的中间名\n*   用户的姓\n*   用户偏好的头衔（Mr., Mrs., Ms., Dr. 等）\n\n假设用户已输入了以下内容：\n\
  \n*   用户的名\n*   用户的中间名\n*   用户的姓\n*   用户偏好的头衔（Mr., Mrs., Ms., Dr. 等）\n\n应用程序显示格式化后的姓名在\
  \ `Label`。\n\n# 3. 小费、税费和总额\n\n创建一个 JavaFX 应用程序，让用户输入费用。当点击按钮时，应用程序将计算并显示 18% 的小费、7%\
  \ 的销售税以及总额。\n\n# 4. 财产税\n\n创建一个 JavaFX 应用程序，允许用户输入金额。应用程序将根据以下规则计算并显示财产税：\n\n* \
  \  如果金额在 100,000 或以下，税为每 100 1.20。\n*   如果金额在 100,000 到 350,000 之间，税为每 100 1.10。\n\
  *   如果金额为 350,000 或更多，税为每 100 0.80。\n\n# 5. 正面或反面\n\n创建一个 JavaFX 应用程序模拟抛硬币。当用户点击按钮时，应用程序将生成\
  \ 0 和 1 之间的随机数。如果是 0，显示“正面”；如果是 1，显示“反面”。使用 `ImageView` 显示硬币结果。\n\n# 6. 骰子模拟\n\n\
  创建一个 JavaFX 应用程序模拟掷骰子。当用户点击按钮时，应用程序将生成两个 1 到 6 之间的随机数代表骰子值。使用 `ImageView` 控制显示骰子。（在学生项目中你会找到六张图像\
  \ `Die1.png`、`Die2.png`、`Die3.png`、`Die4.png`、`Die5.png` 和 `Die6.png`。）\n\n# 7.\
  \ 差旅费用\n\n创建一个 GUI 应用程序计算并显示人员的差旅费用。用户需要提供以下信息：\n\n*   旅行天数\n*   机票费用\n*   租车费（如有）\n\
  *   私家车行驶里程数\n*   停车费（如有）\n*   出租费（如有）\n*   会议或研讨会注册费（如有）\n*   住宿费，每晚\n\n公司根据以下政策报销差旅：\n\
  \n*   每天补助 47\n*   每天最高 20.00 的停车费\n*   每天最高 40.00 的出租费\n*   每天最高 195.00 的住宿费\n\
  *   如果使用私家车，每英里 0.42\n\n应用程序应计算并显示以下内容：\n\n*   人员产生的总费用\n*   旅行的总允许费用\n*   人员必须支付的差额（如有）\n\
  *   如果费用低于总允许额，人员节省的金额\n\n# 8. Joe 的汽车修理厂\n\nJoe's Automotive 执行以下常规维护服务：\n\n* \
  \  换机油：35.00\n*   润滑油：25.00\n*   散热器清洗：50.00\n*   变速箱清洗：120.00\n*   检查：35.00\n*\
  \   更换消声器：200.00\n*   换轮胎：20.00\n\nJoe's 还提供其他非常规服务，并对零件和工时（每小时 60）收费。创建一个 GUI 应用程序显示客户访问\
  \ Joe's 的总费用。\n\n# 9. 井字棋模拟器\n\n\n\n\n\n创建一个模拟井字棋游戏的 JavaFX 应用程序。图 12-38 显示了应用程序\
  \ GUI 的示例。图中所示 GUI 使用了八个 `ImageView` 控件来显示 X 和 O。（你会在书籍的学生示例文件中找到 X 和 O 的图像。）\n\n\
