  \n# 7.14 需要避免的常见错误\n\n以下列表描述了在学习本章主题时经常犯几种错误：\n\n*   使用无效的下标。`Java` 不允许使用超出数组有效下标范围的下标值。\n\
  *   将整数数组元素的内容与元素的下标混淆。元素的下标和存储在元素中的值不是一回事。下标用于标识一个元素，而该元素持有一个值。\n*   导致“差一错误”（off-by-one\
  \ error）。在处理数组时，下标从零开始，结束于数组元素个数减 1。当循环使用 1 作为初始下标和/或使用等于数组元素个数的最大下标时，通常会产生差一错误。\n\
  *   使用 `=` 运算符复制数组。使用 `=` 运算符将一个数组引用变量赋值给另一个变量仅仅是将一个变量中的地址复制到另一个变量中。要复制数组，你应该将一个数组的每个单独元素复制到另一个数组中。\n\
  *   使用 `=` 运算符比较两个数组。你不能使用 `==` 运算符来比较两个数组引用变量并判断数组是否相等。当你对引用变量使用 `==` 运算符时，该运算符比较的是变量包含的内存地址，而不是变量所引用对象的内容。\n\
  *   在处理二维数组时反转了行和列的下标。当你将二维数组想成具有行和列时，第一个下标访问行，第二个下标访问列。如果你反转了这些下标，你将访问错误的元素。\n\n\
  ## 编程挑战\n\n## 1. 雨量类\n\n编写一个 `RainFall` 类，将 12 个月的每月总降雨量存储在一个 `double` 数组中。该程序应该包含返回以下内容的方法：\n\
  \n*   全年总降雨量\n*   平均每月降雨量\n*   雨水最多的月份\n*   雨水最少的月份\n\n在一个完整的程序中演示该类。\n\n*输入验证：不要接受每月降雨量的负数。*\n\
  \n## 2. 薪资类\n\n编写一个 `Payroll` 类，使用以下数组作为字段：\n\n*   `employeeId`。一个七个整数的数组，用于存储员工识别号。数组应该用以下数字初始化：\n\
  \n```\n658845 4520125 7895122 8777541\n8451277 1302850 7580489\n```\n*   `hours`。一个七个整数的数组，用于存储每个员工工作的小时\n\
  *   `payRate`。一个七个 `double` 数组，用于存储每个员工的每小时薪率\n*   `wages`。一个七个 `double` 数组，用于存储每个员工的总工资\n\
  \n该类应该通过下标将每个数组中的数据相关起来。例如，`hours` 数组元素 0 中的数字应该是存储在 `employeeId` 数组元素 0 中的员工识别号对应的员工的工作小时数。同一员工的薪率应该存储在\
  \ `payRate` 数组的元素 0 中。\n\n除非适当访问器（accessor）和修改器（mutator）方法外，该类还应该有一个方法，接受员工的识别号作为参数并返回该员工的总工资。\n\
  \n在一个完整的程序中演示该类，显示每个员工编号并要求用户输入该员工的小时和薪率。然后它应该显示每个员工的识别号和总工资。\n\n*输入验证：不要接受小时数的负值，或薪率小于\
  \ 6.00 的数值。*\n\n## 3. 记账验证\n\n创建一个类，其方法接受一个记账号码作为参数。该方法通过与以下有效记账号码列表对比来确定该号码是否有效：\n\
  \n```\n5658845    4520125    7895122    8777541    8451277    1302850\n8080152 \
  \   4562555    5552012\n```\n\n这些数字应该存储在数组或 `ArrayList` 对象中。使用顺序查找来定位作为参数传递的数字。如果数字在数组中，方法应返回\
  \ `true`，表示有效。如果数字不在数组中，方法应返回 `false`，表示无效。\n\n编写一个程序来测试该类，要求用户输入记账号码。程序应该显示该号码有效还是无效。\n\
  \n## 4. 记账修改\n\n修改你在编程挑战 3 中编写的账户验证类，使其从文件读取有效数字列表。使用记事本或其他编辑器创建该文件。\n\n## 5. 大于\
  \ n\n\n在程序中，写一个接受两个参数的方法：数组和一个数字 `n`。假设数组包含整数。该方法应该显示数组中所有大于 `n` 的数字。\n\n## 6. 驾照考试\n\
  \n当地驾照办公室要求你写一个程序为驾照笔试部分评分。考试有 20 道选题。以下是正确答案：\n\n1.  B\n2.  D\n3.  A\n4.  A\n5.\
  \  C\n6.  A\n7.  B\n8.  A\n9.  C\n10. D\n11. B\n12. C\n13. D\n14. A\n15. D\n16.\
  \ C\n17. C\n18. B\n19. D\n20. A\n\n学生必须正确回答 20 道题中的 15 道才能通过考试。\n\n编写一个名为 `DriverExam`\
  \ 的类，用数组字段存储考试的正确答案。该类还应该有一个存储学生答案的数组字段。该类应该具有以下方法：\n\n*   `passed()` 如果学生通过考试则返回\
