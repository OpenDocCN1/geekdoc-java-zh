  \n# ! 运算符\n\n`!` 运算符执行逻辑非操作。它是一个一元运算符，接受一个 `boolean` 表达式作为其操作数并反转其逻辑值。换句话说，如果表达式为\
  \ `true`，`!` 运算符返回 `false`；如果表达式为 `false`，则它返回 `true`。以下是一个使用 `!` 运算符的 `if` 语句：\n\
  \n```java\nif (!(temperature > 100))\n   System.out.println(\"This is below the\
  \ maximum temperature.\");\n```\n\n首先，测试表达式 `(temperature > 100)`，结果为 `true` 或 `false`\
  \ 之一。然后将 `!` 运算符应用于该值。如果表达式 `(temperature > 100)` 为 `true`，`!` 运算符返回 `false`。如果表达式\
  \ `(temperature > 100)` 为 `false`，则 `!` 运算符返回 `true`。之前的代码等同于询问：“温度是否不大于 100？”\n\
