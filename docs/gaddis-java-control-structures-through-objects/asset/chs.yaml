  \n## 16.1 数据库管理系统简介\n\n概念：数据库管理系统（DBMS）是管理大量数据集的软件。\n\n如果应用程序只需要存储少量数据，文本文件和二进制文件即可工作。然而，当必须存储和处理大量数据时，这些类型的文件就不\
  \ Practical 了。许多企业在文件中保留着数十万甚至数百万个数据项。当文本或二进制文件包含如此多的数据时，搜索、插入和删除等简单操作就会变得繁琐且低效。\n\
  \n在开发处理大量数据的应用程序时，大多数开发者倾向于使用数据库管理系统。`数据库管理系统`（`DBMS`）是专门设计用于组织且高效的方式存储、检索和处理大量数据的软件。一旦使用数据库管理系统存储数据，就可以用\
  \ Java 或其他语言编写应用程序与 DBMS 通信。应用程序不是直接检索或处理数据，而是向 DBMS 发送指令。DBMS 执行这些指令并将结果传回应用程序。\n\
  \n### 图 16-1 Java 应用程序与 DBMS 交互，由 DBMS 处理数据\n\n![两个矩形图形和一个圆形图形表示 Java 应用程序如何与数据库管理系统（或\
  \ DBMS）交互，后者处理数据。](img/16fig01.png)[图 16-1 完整替代文本]\n\n虽然图 16-1 是简化的，但它说明了与数据库管理系统工作的应用程序的分层性质。最顶层的软件层（在本例中用\
  \ Java 编写）与用户交互。它还向下一层软件即 DBMS 发送指令。DBMS 直接与数据交互，并将操作结果传回应用程序。\n\n例如，假设一家公司将其所有的产品记录都存储在数据库中。该公司有一个\
  \ Java 应用程序，允许用户通过输入产品 ID 号来查找任何产品的信息。Java 应用程序指示 DBMS 获取指定产品 ID 号的记录。DBMS 获取产品记录并将数据传回\
  \ Java 应用程序。Java 应用程序向用户显示这些数据。\n\n这种分层软件开发方法的优势是，Java 程序员不需要知道数据的物理结构。他或她只需要知道编写与\
  \ DBMS 交互的代码。DBMS 处理数据的实际读取、写入和搜索。\n\n### JDBC\n\n图 16-1 给出了 Java 应用程序与 DBMS 通信的简单示意。实现这种通信的技术被称为\
  \ `JDBC`，全称为 `Java Database Connectivity`（Java 数据库连接）。Java API 包含许多 `JDBC` 类，允许你的\
  \ Java 应用程序与 DBMS 交互。\n\n### 图 16-2 Java 应用程序使用 JDBC 类与 DBMS 交互\n\n![两个矩形图形和一个圆形图形表示\
  \ Java 应用程序使用 Java Database Connectivity（或 JDBC）类与 DBMS 交互。](img/16fig02.png)[图\
  \ 16-2 完整替代文本]\n\n### SQL\n\n`SQL`，全称为“结构化查询语言”，是处理数据库管理系统的标准语言。它最初由 IBM 在 20 世纪\
  \ 70 年开发。从那时起，大多数数据库软件供应商采用 SQL 作为与其交互的首选语言。\n\nSQL 由几个关键字组成。你使用这些关键字构造语句，语句也称为查询。这些语句或查询被提交给\
  \ DBMS，是 DBMS 对其数据执行操作的指令。\n\n# 注意尽管 SQL 是一种语言，但你并不是用它来编写应用程序。它仅作为与 DBMS 交互的标准手段。你仍然需要一种通用编程语言（如\
  \ Java）为普通用户编写应用程序。\n\n\n\n\n\n为了使用 JDBC 与数据库交互，你需要在系统中安装一个 DBMS，或者在你的学校实验室环境中可以使用该\
  \ DBMS。目前有许多商业化的 DBMS 软件包可选择。Oracle、Microsoft SQL Server、DB2 和 MySQL 只是其中流行的几种。在学校的实验室里，你可能已经可以访问其中某一个，或者可能是其他的\
  \ DBMS。\n\n### Java DB 和 Apache Derby\n\n如果你在学校实验室中无法访问 DBMS，你可以使用 Java DB 或 Apache\
  \ Derby，这取决于你使用的 JDK 版本。如果你使用的是 Java 7 或 Java 8，在安装 JDK 时，系统会在你的电脑上自动安装名为 Java DB\
  \ 的 DBMS。Java DB 是 Apache Derby 的开源发行版，是一个专门为 Java 应用程序设计的纯 Java DBMS。\n\n然而，从 Java\
  \ 9 开始，Java DB 不再捆绑在 JDK 中。这是因为 Java DB 仅仅是 Apache Derby 的一个重命名版本。如果你使用的是 Java 9，将需要从\
  \ Apache 软件基金会的网站单独下载并安装 Apache Derby。\n\n本章中的所有示例都是使用 Java DB 和/或 Apache Derby\
  \ 创建的。如果你想使用 Java DB 或 Apache Derby 中的任何，请参阅 附录 I。附录 I 还可以帮助你配置 Java DB，或下载并安装 Apache\
  \ Derby。\n\n### 创建 `CoffeeDB` 数据库\n\n在本章中，我们将使用名为 `CoffeeDB` 的数据库作为示例。`CoffeeDB`\
  \ 数据库用于午夜烘焙坊（The Midnight Roastery）这家小型咖啡烘焙公司的业务操作。在安装 Java DB 或 Apache Derby 后，执行以下步骤创建\
  \ `CoffeeDB` 数据库：\n\n1. 确保你已经从书籍配套网站下载了学生源代码文件。\n2. 在章章源代码文件中找到名为 `CreateCoffeeDB.java`\
  \ 的程序。\n3. 编译并执行 `CreateCoffeeDB.java` 程序。如果 Java DB 或 Apache Derby 已正确安装，该程序将在你的系统上创建\
  \ `CoffeeDB` 数据库。\n\n### 注意\n\n如果你在学校实验室环境中使用 Java DB 或 Apache Derby 以外的 DBMS，请咨询你的导师如何修改程序以适用于你特定的\
  \ DBMS。\n\n### 连接到 `CoffeeDB` 数据库\n\n在安装 Java DB 或 Apache Derby 并创建 `CoffeeDB` 数据库后，你应该尝试用\
  \ Java 程序连接到数据库。程序可以调用静态 JDBC 方法 `DriverManager.getConnection` 来获取数据库的连接。该方法有重载版本，但最简单的一种具有以下通用格式：\n\
  \n```\nDriverManager.getConnection(DatabaseURL);\n```\n\n该方法返回一个 `Connection` 对象的引用，我们稍后会讨论它。在通用格式中，`DatabaseURL`\
  \ 是一个被称为 `database url` 的字符串。URL 代表统一资源定位符（Uniform Resource Locator）。数据库 URL 列出了访问数据库时应使用的协议、数据库名称以及可能存在的其他项目。一个简单的数据库\
  \ URL 具有以下通用格式：\n\n```\nprotocol:subprotocol:databaseName\n```\n\n在这个非常简单的通用格式中，列出了三项，并用冒号隔开：`protocol`、`subprotocol`\
  \ 和 `databaseName`。让我们仔细查看每一项。\n\n*   `protocol` 是数据库协议。使用 JDBC 时，协议将始终为 `jdbc`。\n\
  *   `subprotocol` 的值取决于你正在连接的特定 DBMS 类型。如果你使用的是 Java DB 或 Apache Derby，子协议为 `derby`。\n\
  *   `databaseName` 是你正在连接的数据库名称。\n\n如果我们使用 Java DB 或 Apache Derby，则 `CoffeeDB` 数据库的\
  \ URL 为：\n\n```\njdbc:derby:CoffeeDB\n```\n\n`DriverManager.getConnection` 方法会搜索并加载与\
  \ URL 指定数据库兼容的 JDBC 驱动程序。`JDBC driver` 是一个设计用于与特定 DBMS 通信的 Java 类。每个 DBMS 通常带有自己的\
  \ JDBC 驱动程序。通常，当你安装 DBMS 时，还会更新系统的 `CLASSPATH` 变量以包含 JDBC 驱动程序的路径。这将使 JVM 在你调用 `DriverManager.getConnection`\
  \ 方法时能够找到驱动程序类。\n\n当 `DriverManager.getConnection` 方法找到兼容的驱动程序时，它会返回一个 `Connection`\
  \ 对象。`Connection` 是 `java.sql` 包中的一个接口。你需要使用此 `Connection` 对象来对数据库执行各种任务，因此请将引用保存在变量中。以下是一个可以在\
  \ Java 应用程序中代码示例，使用 Java DB 或 Apache Derby 获取 `CoffeeDB` 数据库连接的代码：\n\n```\nfinal\
  \ String DB_URL = \"jdbc:derby:CoffeeDB\";\nConnection conn = DriverManager.getConnection(DB_URL);\n\
  ```\n\n在处显示的第二个语句中，我们调用 `DriverManager.getConnection` 方法，并传递 `CoffeeDB` 数据库的 URL。该方法返回一个\
  \ `Connection` 对象的引用，我们将其赋值给变量 `conn`。如果 `DriverManager.getConnection` 方法无法为指定的数据库加载适当的驱动程序，它将抛出\
  \ `SQLException`。\n\n\n\n\n\n如果在第 19 行无法创建连接，或者在第 23 行无法关闭连接，则将抛出异常。第 26 行的 `catch`\
  \ 子句将处理该异常，第 28 行将显示异常对象的默认错误消息。\n\n# 连接到受密码保护的数据库\n\n如果你要连接的数据库需要用户名和密码，可以使用 `DriverManager.getConnection`\
  \ 方法的以下形式：\n\n```\nDriverManager.getConnection(DatabaseURL, Username, Password);\n\
  ```\n\n在这种通用格式中，`Username` 是一个包含有效用户名的字符串，`Password` 是一个包含密码的字符串。\n\n# 检查点 16.1\n\
  \n自测练习\n\n# 检查点 16.2\n\n自测练习\n\n# 检查点 16.3\n\n自测练习\n\n# 检查点 16.4\n\n自测练习\n\n# 检查点\
  \ 16.5\n\n自测练习\n\n# 检查点 16.6\n\n自测练习\n\n# 检查点 16.7\n\n自测练习\n\n# 16.2 表、行和列\n\n概念：存储在数据库中的数据被组织成表、行和列。\n\
  \n数据库管理系统将数据存储在 `database`（数据库）中。学习使用 DBMS 的第一步是学习数据内部是如何组织的。存储在数据库中的数据被组织在一个或多个表中。每个\
  \ `table`（表）包含一组相关数据。存储在表中的数据进一步被组织成行和列。一行是关于单个条目的完整信息集。存储在行中的数据被分为列。每一列是关于该条目的单条信息。\n\
