  \ 使用匿名内部类和 Lambda 表达式处理事件\n\n概念：事件处理器代码有时可以使用匿名内部类或 Lambda 表达式进行简化。\n\n# 使用匿名内部类创建事件处理器\n\
  \n#  WatchAnnon 内部类\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/2_Mb23iQ1RRAGQKWsYWnyKMGFWVIuvVe`](https://mediaplayer.pearsoncmg.com/assets/_video.true/2_Mb23iQ1RRAGQKWsYWnyKMGFWVIuvVe)\n\
  \n如果你回看 代码列表 12-11 和 代码列表 12-12，你会发现每个程序的事件处理器类只被实例化了一次：当事件处理器与控件注册时。回想 第 10 章，当一个类在程序中只实例化一次时，你可以使用匿名内部类来代替普通的类定义。你使用\
  \ `new` 运算符同时定义匿名内部类并创建它的实例。代码列表 12-13 展示了我们如何修改公里转换器应用程序，使用匿名内部类作为 `calcButton`\
  \ 控件的事件处理器的示例。\n\n``````\n 1  import javafx.application.Application;\n  2  import\
