  \n# 附录 B\n\n## 运算符优先级与结合性\n\n此表显示了所有 Java 运算符的优先级和结合性。表格分为若干组，每组中的运算符具有相同的优先级。运算符组从表格顶部的最高优先级到表格底部的最低优先级进行排列。例如，显示的第一组运算符是：\n\
  \n```\n. [] () ++ --\n```\n\n这组运算符具有所有运算符中最高的优先级；其中每个运算符的优先级相同。\n\n| 运算符 | 描述 |\
  \ 结合性 |\n| --- | --- | --- |\n| `.` `[]` `()` `++` `--` | 成员 数组下标 方法 参数列表 后置递增 后置递减\
  \ | 从左到右 从左到右 从左到右 从左到右 |\n| `++` `--` `+` `-` `~` `!` | 前置递增 前置递减 一元加 一元负 按位取反\
  \ 逻辑非 | 从右到左 从右到左 从右到左 从右到左 从右到左 从右到左 |\n| `new` `*`(type)` | 对象创建 转换 | 从右到左 从右到左\
  \ |\n| `*` `/` `%` | 乘法 除法 取模 | 从左到右 从左到右 从左到右 |\n| `+` `+` `-` | 加 字符串拼接 减法 | 从左到右\
  \ 从左到右 从左到右 |\n| `<<` `>>` `>>>` | 左移 有符号右移 无符号右移 | 从左到右 从左到右 从左到右 |\n| `<` `>`\
  \ `<=` `>=` `instanceof` | 小于 大于 小于等于 大于等于 类型比较 | 从左到右 从左到右 从左到右 从左到右 从左到右 |\n|\
  \ `==` `!=` | 等于 不等于 | 从左到右 从左到右 |\n| `&` | 按位与 | 从左到右 |\n| `^` | 按位异异 | 从左到右 |\n\
  | `&#124;` | 按位或 | 从左到右 |\n| `&&` | 逻辑与 | 从左到右 |\n| `&#124;&#124;` | 逻辑或 | 从左到右\
  \ |\n| `?:` | 条件 | 从右到左 |\n| `=` `+=` `-=` `*=` `/=` `<<=` `>>=` `>>>=` `&=` `^=`\
  \ `&#124;=` | 赋值 复合赋值 复合赋值 复合赋值 复合赋值 复合赋值 复合赋值 复合赋值 复合赋值 复合赋值 | 从右到左 从右到左 从右到左 从右到左\
  \ 从右到左 从右到左 从右到左 从右到左 从右到左 从右到左 |\n\n# 附录 C\n\n## Java 关键字\n\n以下单词在 Java 语言中具有保留含义。\n\
  \n| `abstract` `assert` `boolean` `break` `byte` `case` `catch` `char` `class` `const`\
