  \ 15-3 完整替代文本\n\n### 检查点 15.1\n\n../components/ch15_pg0002.xhtml_P70010158780000000000000000006C27\n\
  \n### 检查点 15.2\n\n../components/ch15_pg0002.xhtml_P70010158780000000000000000006C32\n\
