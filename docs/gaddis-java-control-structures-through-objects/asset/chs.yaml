  \n### `ScaleTransition` 类\n\n`ScaleTransition` 类创建一种动画，使节点变得变大或变小。`ScaleTransition`\
  \ 类有三个构造函数，如表 14-14 所示。\n\n# 表 14-14 `ScaleTransition` 类构造函数\n\n| 构造函数 | 说明 |\n\
  | :--- | :--- |\n| `ScaleTransition()` | 创建一个空的 `ScaleTransition` 对象。调用类的 `setDuration`\
  \ 方法来建立动画的持续时间，并调用 `setNode` 方法指定要动画的节点。 |\n| `ScaleTransition(duration)` | `duration`\
  \ 参数（`Duration` 类的对象）指定了动画应持续的时间。调用 `ScaleTransition` 类的 `setNode` 方法指定要动画的节点。 |\n\
  | `ScaleTransition(duration, node)` | `duration` 参数（`Duration` 类的对象）指定了动画应持续的时间。`node`\
  \ 参数（`Node` 类的对象）是要执行动画的节点。 |\n\n要使用 `ScaleTransition` 类对节点进行动画，你需要指定 X 轴和 Y 轴的起始缩放因子，以及\
  \ X 轴和 Y 轴的结束缩放因子。当动画播放时，过渡类将在指定的时间内从起始缩放因子改变到结束缩放因子。以下代码片段显示了一个示例：\n\n```java\n\
  Circle myCircle = new Circle(50, 50, 10);\nScaleTransition strans =\n         new\
  \ ScaleTransition(new Duration(2000), myCircle);\nstrans.setFromX(1.0);\nstrans.setFromY(1.0);\n\
  strans.setToX(3.0);\nstrans.setToY(3.0);\nstrans.play();\n```\n\n这段代码创建了一个中心在 (50,\
  \ 50)、半径为 10 的 `Circle`。它创建一个 `ScaleTransition` 对象来动画该 `Circle` 对象。动画持续持续 2 秒。当动画播放时，`Circle`\
  \ 对象将以起始缩放因子 1（X 和 Y 轴）显示，并增大到缩放因子 3（X 和 Y 轴）。动画需要 2 秒完成。\n\n代码列表 14-12 显示了一个完整的示例。程序显示了一个\
  \ `Text` 对象，其起始缩放因子为 1（沿轴），并在 5 秒的持续时间内增加 `Text` 对象的大小，直到其达到结束缩放因子 5。\n\n在下面的动画中，按“上一个”或“下一个”按钮可以逐步查看代码并查看解释。\n\
  \n### 代码列表 14-12 `(ScaleTransitionText.java)`\n\nhttps://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr14-12/12.html\n\
  \n### `StrokeTransition` 类\n\n`StrokeTransition` 类创建一种形状的描边颜色随时间变化的动画。（注意`StrokeTransition`\
  \ 类仅适用于 `Shape` 类或其任子类的对象。）`StrokeTransition` 类有五个构造函数，如表 14-15 所示。\n\n\n\n\n\n\
  | `StrokeTransition(duration)` | `duration` 参数是一个 `Duration` 类的对象，指定了动画持续的时间。调用\
  \ `StrokeTransition` 类的 `setShape` 方法来指定要动画的形状，调用 `setFromValue` 方法指定起始颜色，并调用 `setToValue`\
  \ 方法指定结束颜色。 |\n\n| `StrokeTransition(duration, shape)` | `duration` 参数是一个 `Duration`\
  \ 类的对象，指定了动画持续的时间。`shape` 参数是一个 `Shape` 类（或其子类）的对象，是要动画的节点。调用 `setFromValue` 方法指定起始颜色，并调用\
  \ `setToValue` 方法指定结束颜色。 |\n\n| `StrokeTransition(duration, fromValue, toValue)`\
  \ | `duration` 参数是一个 `Duration` 类的对象，指定了动画持续的时间。`fromValue` 参数是一个 `Color` 类的对象，指定起始颜色。`toValue`\
  \ 参数是一个 `Color` 类的对象，指定结束颜色。调用 `setShape` 方法指定要动画的形状。 |\n\n| `StrokeTransition(duration,\
  \ shape, fromValue, toValue)` | `duration` 参数是一个 `Duration` 类的对象，指定了动画持续的时间。`shape`\
  \ 参数是一个 `Shape` 类（或其子类）的对象，是要动画的节点。`fromValue` 参数是一个 `Color` 类的对象，指定起始颜色。`toValue`\
  \ 参数是一个 `Color` 类的对象，指定结束颜色。调用 `setShape` 方法指定要动画的形状。 |\n\n使用 `StrokeTransition`\
  \ 类对形状进行动画处理，你需要指定起始颜色和结束颜色。当动画播放时，过渡类将在指定的时间内将形状的描边颜色从起始颜色逐渐变为结束颜色。以下代码段显示了一个示例：\n\
  \n```\nCircle myCircle = new Circle(50, 50, 10);\nStrokeTransition strtrans =\n\
  \      new StrokeTransition(new Duration(2000), myCircle,\n                    \
  \       Color.YELLOW, Color.GREEN);\nstrtrans.play();\n```\n\n这段代码创建了一个 `Circle`，其中心点在\
  \ (50, 50)，半径为 10。然后它创建了一个 `StrokeTransition` 对象来对 `Circle` 对象执行动画。动画持续时间为 2 秒。当动画播放时，`Circle`\
  \ 对象将以黄色的起始描边颜色显示，并逐渐将描边颜色变为绿色。动画完成需要 2 秒。\n\n### `FillTransition` 类\n\n`FillTransition`\
  \ 类创建一种动画，其中形状的填充颜色在一段时间内发生变化。（注意：`FillTransition` 类仅适用于 `Shape` 类或其任一子类的对象。）`FillTransition`\
  \ 类有五个构造函数，总结如表 14-16 所示。\n\n## 表 14-16 `FillTransition` 类构造函数\n\n| 构造函数 | 描述 |\n\
  | --- | --- |\n| `FillTransition()` | 创建一个空的 `FillTransition` 对象。调用该类的 `setDuration`\
  \ 方法建立动画持续时间，调用 `setShape` 方法指定要动画的形状，调用 `setFromValue` 方法指定起始颜色，并调用 `setToValue`\
  \ 方法指定结束颜色。 |\n| `FillTransition(duration)` | `duration` 参数是一个 `Duration` 类的对象，指定了动画持续的时间。调用\
  \ `FillTransition` 类的 `setShape` 方法指定要动画的形状，调用 `setFromValue` 方法指定起始颜色，并调用 `setToValue`\
  \ 方法指定结束颜色。 |\n| `FillTransition(duration, shape)` | `duration` 参数是一个 `Duration`\
  \ 类的对象，指定了动画持续的时间。`shape` 参数是一个 `Shape` 类（或其子类）的对象，是要动画的节点。调用 `setFromValue` 方法指定起始颜色，并调用\
  \ `setToValue` 方法指定结束颜色。 |\n| `FillTransition(duration, fromValue, toValue)` | `duration`\
  \ 参数是一个 `Duration` 类的对象，指定了动画持续的时间。`fromValue` 参数是一个 `Color` 类的对象，指定起始颜色。`toValue`\
  \ 参数是一个 `Color` 类的对象，指定结束颜色。调用 `setShape` 方法指定要动画的形状。 |\n\n使用 `FillTransition` 类对形状进行动画处理，你需要指定起始颜色和结束颜色。当动画播放时，过渡类将在指定的时间内将形状的填充颜色从起始颜色逐渐变为结束颜色。以下代码段显示了一个示例：\n\
  \n```\nCircle myCircle = new Circle(50, 50, 10);\nFillTransition ftrans =\n    new\
  \ FillTransition(new Duration(2000), myCircle,\n                       Color.LIGHTBLUE,\
  \ Color.DARKBLUE);\nftrans.play();\n```\n这段代码创建了一个 `Circle`，其中心点在 (50, 50)，半径为 10。然后它创建了一个\
  \ `FillTransition` 对象来对 `Circle` 对象执行动画。动画持续时间为 2 秒。当动画播放时，`Circle` 对象将以浅蓝色的填充颜色显示，并逐渐将填充颜色变为深蓝色。\n\
  \n### `FadeTransition` 类\n\n`FadeTransition` 类创建一种动画，其中节点在一段时间内淡入或淡出。`FadeTransition`\
  \ 类有三个构造函数，总结如表 14-17 所示。\n\n## 表 14-17 `FadeTransition` 类构造函数\n\n| 构造函数 | 描述 |\n\
  | --- | --- |\n| `FadeTransition()` | 创建一个空的 `FadeTransition` 对象。 |\n| `FadeTransition(duration)`\
  \ | `duration` 参数是一个 `Duration` 类的对象，指定了动画持续的时间。调用 `ScaleTransition` 类的 `setNode`\
  \ 方法指定要动画的节点。 |\n| `FadeTransition(duration, node)` | `duration` 参数是一个 `Duration`\
  \ 类的对象，指定了动画持续的时间。`node` 参数是一个 `Node` 类（或其子类）的对象，是要动画的节点。 |\n\n所有节点都有一个 `opacity`\
  \ 值，用于确定节点是透明还是不透明。透明度值是一个范围从 0 到 1 的 `double` 类型。当节点的透明度值为 0 时，节点完全透明。当节点的透明度值为\
  \ 1 时，节点完全不透明（无法穿透它）。当节点的透明度值在 0 到 1 之间时，节点为半透明。\n\n使用 `FadeTransition` 类对节点进行动画处理，你需要指定起始透明度和结束透明度值。当动画播放时，过渡类将结的透明度从指定的起始值逐渐变为指定的结束值。以下代码段显示了一个示例：\n\
  \n```\n// 创建一个 Image 和 ImageView。\nImage image = new Image(\"file:HotAirBalloon.jpg\"\
  );\nImageView imageView = new ImageView(image);\n\n// 创建一个 FadeTransition 对 ImageView\
  \ 执行动画。\nFadeTransition ftrans =\n    new FadeTransition(new Duration(1000), imageView);\n\
  ftrans.setFromValue(1.0);\nftrans.setToValue(0.25);\nftrans.play();\n```\n\n\n\n\
  \n\n这段代码创建了一个 `Image` 组件和一个 `ImageView` 组件来显示图像，然后创建了一个 `FadeTransition` 对象来对 `ImageView`\
  \ 对象进行动画处理。动画的持续时间为 1 秒。当动画播放时，图像将以 1.0 的透明度显示（完全不透明）。随着动画的播放，图像的不透明度将逐渐降低到 0.25（25%\
  \ 不透明度）。图 14-21 显示了代码在动画开始和结束时的输出示例。\n\n# 图 14-21 淡入过渡示例\n\n![两个窗口中显示了淡入过渡示例。](img/14fig21.png)图\
  \ 14-21 完整替代文本\n\n### 控制动画\n\n我们讨论过的每个过渡过渡类都是 `Animation` 类和 `Transition` 类的子类。表\
  \ 14-18 总结了从 `Animation` 类继承的一些方法，这些方法让你对动画有更好的控制。\n\n# 表 14-18 从 `Animation` 类继承的几个方法\n\
  \n| 方法 | 描述 |\n\n| --- | --- |\n| `jumpTo(time)` | `time` 参数是一个 `Duration` 对象。此方法使动画跳转到\
  \ `time` 指定的时间位置。（例如，如果 `time` 参数指定为 5 秒，该方法将动画跳转到 5 秒的位置。） |\n| `pause()` | 暂停动画。（如果动画未在播放，则此方法无效。）\
  \ |\n| `play()` | 从当前位置播放动画。（如果动画已经在运行，则此方法无效。） |\n| `playFrom(time)` | `time` 参数是一个\
  \ `Duration` 对象。此方法从 `time` 指定的时间位置播放动画。（例如，如果动画持续 6 秒，且 `time` 参数指定为 3 秒，该方法将从\
  \ 3 秒的位置开始动画。） |\n| `playFromStart()` | 从头开始播放动画。 |\n| `setCycleCount(value)` |\
  \ `value` 参数是一个整数。定义动画重复的次数。如果你想让动画无限重复，请指定参数值 `Animation.INDEFINITE`。 |\n| `setAutoReverse(value)`\
  \ | `value` 参数是一个布尔值。如果 `value` 为 `true`，则动画将在每隔一个循环反向播放。如果 `value` 为 `false`，则动画将正常播放。\
  \ |\n| `stop()` | 停止动画，并将当前位置重置为动画开头。 |\n\n### 指定插值器\n\n所有过渡类都从 `Transition` 类继承了一个名为\
  \ `setInterpolator` 的方法。`setInterpolator` 方法允许你指定动画如何开始和结束。该方法的通用格式为\n\n```\ntransitionObject.setInterpolator(interpolatorValue);\n\
  ```\n\n其中 `transitionObject` 是一个过渡对象，`interpolatorValue` 通常是 表 14-19 中列出的常量之一。（`Interpolator`\
  \ 类位于 `javafx.animation.Interpolator` 包中。）\n\n### 表 14-19 `Interpolator` 常量\n\n\
  | 方法 | 描述 |\n\n| --- | --- |\n| `Interpolator.EASE_BOTH` | 此插值器使动画淡入淡出。换之，动画缓慢开始、加速，然后在结尾减慢。这是默认的插值器。\
  \ |\n| `Interpolator.EASE_IN` | 此插值器使动画淡入（缓慢开始），但快速停止。 |\n| `Interpolator.EASE_OUT`\
  \ | 此插值器使动画快速开始，但淡出（在结尾逐渐减慢）。 |\n| `Interpolator.DISCRETE` | 使用此插值器，动画似乎立即从开始跳转到结束。\
  \ |\n| `Interpolator.LINEAR` | 此插值器使动画对象以恒定速率随时间改变受影响的属性（位置、缩放、旋转角度、颜色等）。 |\n\n\
  下面的代码段显示了一个示例：\n\n```\nCircle myCircle = new Circle(0, 50, 30);\nTranslateTransition\
  \ ttrans =\n         new TranslateTransition(new Duration(3000), myCircle);\nttrans.setFromX(0);\n\
  ttrans.setFromY(50);\nttrans.setToX(100);\nttrans.setToY(50);\nttrans.setInterpolator(Interpolator.EASE_IN);\n\
  ```\n\n\n\n\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.Pane;\nimport javafx.scene.shape.Circle;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.effect.DropShadow;\n\npublic\
  \ class DropShadowDemo extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n       launch(args);\n    }\n\n    @Override\n    public void start(Stage\
  \ primaryStage)\n    {\n        // Constants for the scene size\n        final double\
  \ SCENE_WIDTH = 200.0;\n        final double SCENE_HEIGHT = 200.0;\n\n        //\
  \ Constants for the Circle\n        final double X = 100.0, Y = 100.0, RADIUS =\
  \ 50.0;\n\n        // Create a DropShadow\n        DropShadow dropShadow = new DropShadow();\n\
  \n        // Create a Circle object.\n        Circle myCircle = new Circle(X, Y,\
  \ RADIUS, Color.RED);\n        myCircle.setEffect(dropShadow);\n\n        // Add\
  \ the Circle to a Pane.\n        Pane pane = new Pane(myCircle);\n\n        // Create\
  \ a Scene and display it.\n        Scene scene = new Scene(pane, SCENE_WIDTH, SCENE_HEIGHT);\n\
  \        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n}\n\
  ```\n\n### 代码列表 14-13 `(DropShadowDemo.java)`\n\n以下是需要注意的代码行：\n\n- 第 27 行创建了一个名为\
  \ `dropShadow` 的 `DropShadow` 对象，使用了 `DropShadow` 类的无参构造函数。\n- 第 30 行创建了一个 `Circle`\
  \ 对象。\n- 第 31 行调用了 `Circle` 对象的 `setEffect` 方法，并将 `dropShadow` 对象作为参数传递。\n\n该程序的输出如图\
