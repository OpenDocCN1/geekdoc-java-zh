  \n# 14.6 处理事件\n\n概念：`JavaFX` 允许你创建响应键盘事件的事件处理器。\n\n# 观察事件事件\n\n[[assets/video.true/cb5ty0C6o_OzllvjpeSlL7Fudu](https://example.com/assets/video.true/cb5ty0C6o_OzllvjpeSlL7Fudu)]\n\
  \n`键事件`是由键盘产生的事件。有三种类型的键事件：\n\n- 每当用户按下按键时，发生 `KEY_PRESSED` 事件。\n- 每当用户释放按键时，发生\
  \ `KEY_RELEASED` 事件。\n- 每当用户按下并释放产生 Unicode 字符的按键（如字母、数字或标点符号）时，发生 `KEY_TYPED` 事件。（箭头键、翻页键和功能键不会产生\
  \ KEY_TYPED。）\n\n键事件发生时，会创建一个 `KeyEvent` 类的事件对象。`KeyEvent` 是 `Event` 类的子类，它们都在 `javafx.event`\
  \ 包中。假设我们要写一个响应键事件的事件处理器，其通用格式如下：\n\n```java\nclass KeyHandler implements EventHandler<KeyEvent>\n\
  {\n    @Override\n    public void handle(KeyEvent event)\n    {\n         // 编写处理代码\n\
  \    }\n}\n```\n\n注意类声明的第一行 `implements EventHandler<KeyEvent>`。这指定了类实现了 `EventHandler`\
  \ 接口，并且它处理的事件类型是 `KeyEvent`。接下来，注意 `handle` 方法有一个名为 `event` 的 `KeyEvent` 参数。当调用\
  \ `handle` 方法时，会传入一个 `KeyEvent` 对象。任何你想在按下或释放按键后执行的代码都写在 `handle` 方法中。\n\n一旦写好了事件处理器，下一步就是将其注册到目标节点。只要该节点拥有焦点，场景图中的任何节点都可以处理键事件。当节点拥有焦点时，它准备好接收输入。在\
  \ JavaFX 运行时，你可以看出哪个节点拥有焦点，因为它周围通常有一个蓝色光晕。当你按下 `Tab` 键时，焦点会移动到下一个节点。\n\n大多数情况下，你会在\
  \ Scene 对象上注册 `KeyEvent` 处理器。这样，无论哪个节点拥有焦点，你的 KeyEvent 处理器都会响应键事件。要注册事件处理器，你需要调用\
  \ Scene 对象（或场景图中的任何节点）的以下方法之一：\n\n- `setOnKeyPressed`：使用此方法注册 `KEY_PRESSED` 事件的处理器。\n\
  - `setOnKeyReleased`：使用此方法注册 `KEY_RELEASED` 事件的处理器。\n- `setOnKeyTyped`：使用此方法注册 `KEY_TYPED`\
  \ 事件的处理器。\n\n# 使用匿名内部类将键处理器注册到 Scene\n\n你在第 12 章 中学习过，编写事件处理器的常用技巧是使用匿名内部类。下面的代码片段展示了使用匿名内部类为\
  \ Scene 注册 `KEY_PRESSED` 事件处理器的写法：\n\n```java\n// 创建 Scene\nScene scene = new Scene(rootNode);\n\
  \n// 为 Scene 注册 KEY_PRESSED 处理器\nscene.setOnKeyPressed(new EventHandler<KeyEvent>()\n\
  {\n    @Override\n    public void handle(KeyEvent event)\n    {\n         // 编写事件处理代码\n\
  \    }\n});\n```\n\n# 使用 Lambda 表达式将键事件处理器注册到 Scene\n\n你在第 12 章 也学习过，lambda 表达式提供了注册事件处理器的简化方式。下面的代码片段展示了使用\
  \ lambda 表达式为 Scene 注册 `KEY_PRESSED` 事件处理器的写法：\n\n```java\n// 创建 Scene\nScene scene\
  \ = new Scene(rootNode);\n\n// 为 Scene 注册 KEY_PRESSED 处理器\nscene.setOnKeyPressed(event\
  \ ->\n{\n    // 在此处编写事件处理代码\n});\n```\n\n代码列表 14-17 显示了一个演示如何处理 `KEY_PRESSED` 事件的完整程序。应用程序在每次按下按键时计数器加\
  \ 1，并在 `Label` 控件中显示计数器的值。在按下五次按键后，应用程序窗口如图 14-35 所示。\n\n\n\n\n\n```java\nimport\
  \ javafx.application.Application;\nimport javafx.stage.Stage;\nimport javafx.scene.Scene;\n\
  import javafx.scene.layout.HBox;\nimport javafx.geometry.Pos;\nimport javafx.geometry.Insets;\n\
  import javafx.scene.control.Label;\nimport javafx.event.EventHandler;\nimport javafx.scene.input.KeyEvent;\n\
  \npublic class KeyPressDemo extends Application\n{\n    private int count = 0; \
  \   // 用于记录按键次数\n\n    public static void main(String[] args)\n    {\n       //\
  \ 启动应用程序。\n       launch(args);\n    }\n\n    @Override\n    public void start(Stage\
  \ primaryStage)\n    {\n       // 创建一个 Label 控件。\n       Label label = new Label(\"\
  0\");\n\n       // 将 Label 放入一个 HBox 中。\n       HBox hbox = new HBox(10, label);\n\
  \       hbox.setAlignment(Pos.CENTER);\n       hbox.setPadding(new Insets(10));\n\
  \n       // 创建一个以 HBox 为根节点的场景。\n       Scene scene = new Scene(hbox);\n\n     \
  \  // 为场景注册一个 KEY_PRESSED 处理器。\n       scene.setOnKeyPressed(event ->\n       {\n\
  \          count++;\n          label.setText(String.format(\"%d\", count));\n  \
  \     });\n\n       // 将场景设置到阶段并显示。\n       primaryStage.setScene(scene);\n    \
  \   primaryStage.show();\n    }\n}\n```\n\n# 代码列表 14-17 `(KeyPressedDemo.java)`\n\
  \n![窗口显示数字 5，表示在使用 Key Pressed Demo dot java 应用程序时，按键已按下了 5 次。](img/14fig35.png)\n\
  \n# 图 14-35 按下 5 次键后的 `KeyPressedDemo.java` 应用程序（Oracle 法人公司法律顾问）\n\n让我们仔细观察一下这个程序：\n\
  \n*   第 13 行声明了一个名为 `count` 的 `int` 字段，并初始化值为 0。`count` 字段将记录按键的次数。\n*   第 25 行创建了一个\
  \ `Label` 控件，用于显示按键次数，第 28 行将 `Label` 控件放入 `HBox` 中。\n*   第 33 行创建了一个场景，以 `HBox`\
  \ 为根节点。\n*   第 36 行到 40 行使用 lambda 表达式向 `Scene` 对象注册一个事件处理器。该事件处理器将响应 `KEY_PRESSED`\
  \ 事件。在事件处理器内部，第 38 行增加 `count` 的值，第 39 行在 `Label` 控件中显示 `count` 的值。\n*   第 43 行和\
  \ 44 行将场景设置到阶段并显示应用程序窗口。\n\n作为参数传递给事件处理器的 `KeyEvent` 对象包含了有关按键事件的数据。例如，你可以使用对象的\
  \ `getCode()` 方法来确定是哪个键触发了事件。`getCode()` 方法返回一个 `KeyCode` 值，它是 `javafx.scene.input`\
