  \ deleted.\n```\n\n\n\n\n你也可以通过在列的数据类型之后列出 `PRIMARY KEY` 限定符来指定某列为主键。回想我们之前对数据库组织的讨论，主键是为每行持有一个唯一值的列，并可用于识别特定行。当你对列使用\
  \ `PRIMARY KEY` 限定符时，你也应该使用 `NOT NULL` 限定符。`NOT NULL` 限定符指定该列的每一行都必须包含一个值。下面是如何使用\
  \ `CustomerNumber` 列作为主键创建 `Customer` 表的示例：\n\n```\nCREATE TABLE Customer\n  ( CustomerNumber\
  \ CHAR(10) NOT NULL PRIMARY KEY,\n    Name CHAR(25),\n    Address CHAR(25),\n  \
  \  City CHAR(12),\n    State CHAR(2),\n    Zip CHAR(5) )\n```\n\n该语句创建一个名为 `Customer`\
  \ 的新表。它的结构与上一个示例创建的表相同，多了一个列 `CustomerNumber`，它是主键。因为 `CustomerNumber` 是主键，此列必须为表中的每行持有一个唯一值。\n\
  \n### 提示\n\n记住，主键用于识别表中的特定行。在选择列作为主键时，确保它持有的唯一值在表中的两行之间不能重复的。\n\n请查看代码列表 16-10 中的程序。当你运行此程序时，它会在\
  \ `CoffeeDB` 数据库中创建 `Customer` 表，然后插入表 16-5 中所示的三行。\n\n## 代码列表 16-10 `(CreateCustomerTable.java)`\n\
