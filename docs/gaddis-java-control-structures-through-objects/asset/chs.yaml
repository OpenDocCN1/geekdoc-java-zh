  *   `displayData`—该方法应该接受矩形的长度、宽度和面积作为参数，并在屏幕上以适当的消息显示它们。\n\n## 4. 油漆作业估算师\n\n一家油漆公司确定，每\
  \ 115 平方英尺的墙面空间需要一加仑油漆和八小时的人工。该公司每小时收取 18.00 美元人工费。编写一个程序，允许用户输入要粉漆的房间数量和每加仑油漆的价格。它还应该询问每个房间墙面的平方英尺数。程序应该具有返回以下数据的方法：\n\
  \n*   所需的油漆加仑\n*   所需的人工时数\n*   油漆成本\n*   人工费用\n*   油漆作业的总成本\n\n然后它应该在屏幕上显示这些数据。\n\
  \n## 5. 下落距离\n\n当物体由于重力下落时，可以使用以下公式确定物体在特定时间内下落的距离：\n\n`d = ½gt²`\n\n公式中的变量如下：`d`\
  \ 是以米为单位的距离，`g` 是 9.8，`t` 是物体下落的时间（秒）。\n\n编写一个名为 `fallingDistance` 的方法，接受物体下落时间（秒）作为参数。该方法返回物体在该时间间隔内下落的距离（单位为米）。通过在循环中调用该方法并将\
  \ 1 到 10 的值作为参数传递并显示返回值来演示该方法。\n\n## 6. 摄氏温度表\n\n将温度从华氏转换为摄氏的公式为：\n\n$$C = \\frac{5}{9}(F\
  \ - 32)$$\n\n其中 `F` 是华氏温度，`C` 是摄氏温度。编写一个名为 `celsius` 的方法，接受华氏温度作为参数。该方法返回转换成摄氏的温度。通过在循环中调用该方法并显示从\
  \ 0 到 20 的华氏温度及其对应的摄氏温度表格来演示该方法。\n\n## 7. 测试平均分与等级\n\n编写一个程序，要求用户输入五个分数。程序将显示平均分和字母等级。编写以下方法：\n\
  \n*   `calcAverage`—该方法接受五个分数并返回平均分。\n*   `determineGrade`—该方法接受一个测试分数，并根据以下标准返回字母等级：\n\
  \n    | 分数 | 字母等级 |\n    | --- | --- |\n    | 90–100 | A |\n    | 80–89 | B |\n\
  \    | 70–79 | C |\n    | 60–69 | D |\n    | 60 以下 | F |\n\n## 8. 转换程序\n\n编写一个程序，要求用户输入以米为单位的距离。程序将提供以下选择：\n\
