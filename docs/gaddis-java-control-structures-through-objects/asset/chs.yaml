  \ 对象。\n- 第 27 行为 `File` 菜单创建了一个 `Menu` 对象。\n- 第 28 行为 `Exit` 菜单项创建了一个 `MenuItem`\
  \ 对象。\n- 第 29 行将 `Exit` 菜单项添加到 `File` 菜单中。\n- 第 32 至 35 行为 `Exit` 菜单项注册了事件处理程序。当用户点击\
  \ `Exit` 菜单项时，第 34 行关闭程序。\n- 第 38 行将 `File` 菜单添加到菜单栏。\n- 第 41 和 42 行创建一个 `BorderPane`\
  \ 布局容器，并将菜单栏添加到顶部区域。\n- 第 45 至 47 行创建场景，将场景设置到舞台，并显示应用程序窗口。\n\n`代码列表 13-27`是一个具有稍微复杂的菜单系统的应用程序，显示在\
  \ `图 13-31` 中。此应用程序演示了 `Label` 控件显示的文本如何以不同的颜色出现。\n\n\n\n\n\n# 代码列表 13-27 `TextMenu.java`\n\
