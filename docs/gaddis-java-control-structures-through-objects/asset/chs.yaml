  \n## 13.9 `FileChooser` 类\n\n概念：JavaFX 提供了一个 `FileChooser` 类，为你的应用程序配备了用于打开和保存文件的标准对话框。\n\
  \n`FileChooser` 类显示一个特殊的对话框，允许用户浏览文件。图 13-34 显示了 Windows 系统上的一个示例。![Windows 系统上标题为\
  \ Open 的文件选择对话框。](img/13fig34.png)\n\n## 图 13-34 打开文件的文件选择对话框（Oracle 法务顾问）\n\n`FileChooser`\
  \ 类位于 `javafx.stage` 包中。`FileChooser` 类可以显示两种类型的对话框：*打开对话框*和*保存对话框*。图 13-34 所示的对话框是一个打开对话框。它让用户浏览现有文件以打开。如图\
  \ 13-35 所示的保存对话框，在用户需要浏览位置以保存文件时使用。这两个对话框在操作方式上是类似的。![Windows 系统上标题为 Save As 的文件选择对话框，允许用户浏览位置以保存文件。](img/13fig35.png)\n\
  \n## 图 13-35 保存文件的文件选择对话框（Oracle 法务顾问）\n\n## 显示 `FileChooser` 对话框\n\n要显示打开对话框或保存对话框，你首先需要创建\
  \ `FileChooser` 类的实例。然后，你调用 `showOpenDialog` 方法（如果你想显示打开对话框）或 `showSaveDialog` 方法（如果你想显示保存对话框）。对于任何一种方法，你都将应用程序的舞台的引用作为参数传递。以下代码段显示了调用\
  \ `showOpenDialog` 方法的示例：\n\n```\nFileChooser fileChooser = new FileChooser();\n\
  File selectedFile = fileChooser.showOpenDialog(primaryStage);\n```\n\n\n\n\n在此代码中，假设\
  \ `primaryStage` 引用我们应用程序的阶段。`showOpenDialog` 和 `showSaveDialog` 方法返回一个 `File` 对象（`File`\
  \ 类已在第 4 章中引入，位于 `java.io` 包中），其中包含有关所选文件的信息。如果用户没有选择文件，该方法将返回 `null`。你通常可以使用 `File`\
  \ 对象来打开文件或创建一个文件。下面的代码段显示了如何使用 `File` 对象的 `getPath` 方法获取作为 `String` 类型的路径和文件名：\n\
  \n```\nFileChooser fileChooser = new FileChooser();\nFile selectedFile = fileChooser.showOpenDialog(primaryStage);\n\
  if (selectedFile != null)\n{\n   String filename = selectedFile.getPath();\n   outputLabel.setText(\"\
  You selected \" + filename);\n}\n```\n\n# 检查点 13.37\n../components/metrodigi/ch13-inline_self_quiz_v1.0.0-37/index.html\n\
