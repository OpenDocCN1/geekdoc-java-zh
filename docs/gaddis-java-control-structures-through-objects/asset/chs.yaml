  \n## 12.6 `Button` 控件\n\n概念：`Button` 是用户可以点击以触发你编写的操作的控件。\n\n### 控件与事件\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/rjELhzvzceFU21Rr9qPk1n`](https://mediaplayer.pearsoncmg.com/assets/_video.true/rjELhzvzceFU21Rr9qPk1n)\n\
  \n`Button` 是一个带有标题的矩形控件。当用户点击 `Button` 控件（通过鼠标或在屏幕上触摸）时，会发生操作。图 12-28 显示了一个包含 `Button`\
