  \n# 16.4 插入行\n\n概念：你使用 SQL 中的 `INSERT` 语句向表中插入一个新的一行。\n\n在 SQL 中，`INSERT` 语句用于向数据库表中插入一行数据。\n\
  \n```\nINSERT INTO  TableName  VALUES (Value1, Value2, etc...)\n```\n\n在通用格式中，`TableName`\
  \ 是数据库表的名称。`Value1`、`Value2` 等是列值的列表。语句执行后，一个包含指定列值的行将被插入到表中。以下是一个示例，展示了如何在我们的 `CoffeeDB`\
  \ 数据库的 `Coffee` 表中插入一行：\n\n```\nINSERT INTO Coffee VALUES ('Honduran Dark', '22-001',\
  \ 8.65)\n```\n\n注意，字符串值被包含在单引号中。此外，注意值在列表中出现的顺序。第一个值‘Honduran Dark’ 被插入到表的第一列，该列是\
  \ `Description`。第二个值‘22-001’被插入到表的第二列，该列是 `ProdNum`。第三个值 8.65 被插入到表的第三列，该列是 `Price`。在该语句执行后，`Coffee`\
  \ 表中将插入一个包含以下列值的新行：\n\n```\nDescription: 'Honduran Dark'\nProdNum: 22-001\nPrice:\
  \ 8.65\n```\n\n如果你不确定列在表中出现的顺序，可以使用 `INSERT` 语句的以下通用格式来指定列名及其对应的值。\n\n```\nINSERT\
  \ INTO TableName\n    (ColumnName1, ColumnName2, etc...)\nVALUES\n    (Value1, Value2,\
  \ etc...)\n```\n\n在这个通用格式中，`ColumnName1, ColumnName2, etc...` 是列名列表，`Value1, Value2,\
  \ etc...` 是对应值的列表。在新行中，`Value1` 将出现在由 `ColumnName1` 指定的列中，`Value2` 将出现在由 `ColumnName2`\
  \ 指定的列中，依此类推。这是一个示例：\n\n```\nINSERT INTO Coffee\n    (Description, ProdNum, Price)\n\
  VALUES\n    ('Honduran Dark', '22-001', 8.65)\n```\n\n该语句将产生一个包含以下列值的新行：\n\n```\n\
  Description: 'Honduran Dark';\nProdNum: 22-001\nPrice: 8.65\n```\n\n如果我们以下方式重写 `INSERT`\
  \ 语句，将产生一个具有相同值的新行：\n\n```\nINSERT INTO Coffee\n    (ProdNum, Price, Description)\n\
  VALUES\n    ('22-001', 8.65, 'Honduran Dark')\n```\n\n### 注意\n\n如果某列是主键，则它必须为表中的每一行存储一个唯一值。表中没有两个行可以在主键上具有相同的值。回想一下\
  \ `ProdNum` 列是 `Coffee` 表的主键。DBMS 不允许你插入具有相同编号的新行。\n\n# 使用 JDBC 插入行\n\n要使用 JDBC\
  \ 发送 `INSERT` 语句，你必须首先通过 `Connection` 对象的 `createStatement()` 方法从其获取一个 `Statement`\
  \ 对象。然后你使用 `Statement` 对象的 `executeUpdate()` 方法。该方法返回一个 `int` 值，表示插入到表的行数。这是一个示例：\n\
  \n```\nString sqlStatement = \"INSERT INTO Coffee \" +\n                      \"\
  (ProdNum, Price, Description) \" +\n                      \"VALUES ('22-001', 8.65,\
  \ 'Honduran Dark')\";\n\n插入到表的行数返回一个 `int` 值。\n\n\n\n代码列表 16-7 (CoffeeInserter.java)\n\
  \n```java\nimport java.util.Scanner;\nimport java.sql.*;\n\n/**\n * 该程序允许用户向\n *\
  \ Coffee 表插入一行。\n */\npublic class CoffeeInserter\n{\n  public static void main(String[]\
  \ args)\n  {\n    String description; // 用于存储咖啡描述\n    String prodNum;     // 用于存储产品编号\n\
  \    double price;       // 用于存储价格\n\n    // 为 URL 创建命名常量。\n    // 注意：此值适用于 Java\
  \ DB 或 Apache Derby。\n    final String DB_URL = \"jdbc:derby:CoffeeDB\";\n\n   \
  \ // 创建键盘输入的 Scanner 对象。\n    Scanner keyboard = new Scanner(System.in);\n\n   \
  \ try\n    {\n      // 建立数据库连接。\n      Connection conn = DriverManager.getConnection(DB_URL);\n\
  \n      // 获取新咖啡的数据。\n      System.out.print(\"Enter the coffee description: \"\
  );\n      description = keyboard.nextLine();\n      System.out.print(\"Enter the\
  \ product number: \");\n      prodNum = keyboard.nextLine();\n      System.out.print(\"\
  Enter the price: \");\n      price = keyboard.nextDouble();\n\n      // 创建 Statement\
  \ 对象。\n      Statement stmt = conn.createStatement();\n\n      // 创建包含 INSERT 语句的字符串。\n\
  \      String sqlStatement = \"INSERT INTO Coffee \" +\n                       \
  \     \"(ProdNum, Price, Description) \" +\n                            \"VALUES\
  \ ('\" +\n                            prodNum + \"', \" +\n                    \
  \        price + \", '\" +\n                            description +')\";\n\n \
  \     // 将语句发送到 DBMS。\n      int rows = stmt.executeUpdate(sqlStatement);\n\n  \
  \    // 显示结果。\n      System.out.println(rows + \" row(s) added to the table.\");\n\
  \n      // 关闭连接。\n      conn.close();\n    }\n    catch(Exception ex)\n    {\n \
  \     System.out.println(\"ERROR: \" + ex.getMessage());\n    }\n  }\n}\n```\n\n\
  程序输出\n\n```\nEnter the coffee description: Honduran Dark [Enter]\nEnter the product\
  \ number: 22–001 [Enter] \nEnter the price: 8.65 [Enter]\n1 row(s) added to the\
  \ table.\n```\n\n# Checkpoint 16.19\n\n\n\n\n\n../components/metrodigi/ch16-inline_self_quiz_v1.0.0-18/index.html\n\
  \n# Checkpoint 16.20\n\n../components/metrodigi/ch16-inline_self_quiz_v1.0.0-19/index.html\n\
  \n# 16.5 更新和删除现有行\n\n概念：你在 SQL 中使用 `UPDATE` 语句来更改现有行的值。你使用 `DELETE` 语句从从删除删除行。\n\
  \n在 SQL 中，`UPDATE` 语句用于更改表中现有某行的内容。例如，如果巴西咖啡因咖啡（Brazilian Decaf）的价格发生了变化，我们可以使用\
  \ `UPDATE` 语句更改该行的 `Price` 列。以下是 `UPDATE` 语句的通用格式：\n\n```\nUPDATE  Table\n   SET\
  \  Column  =  Value\n   WHERE  Criteria\n```\n\n在通用格式中，`Table` 是表名，`Column` 是列名，`Value`\
  \ 是存储在列中的值，而 `Criteria` 是条件表达式。以下是一个将巴西咖啡因咖啡的价格改为 9.95 的 `UPDATE` 语句：\n\n```\nUPDATE\
  \ Coffee\n   SET Price = 9.95\n   WHERE Description = 'Brazilian Decaf'\n```\n\n\
  这是另一个示例：\n\n```\nUPDATE Coffee\n   SET Description = 'Galapagos Organic Medium'\n\
  \   WHERE ProdNum = '20-001'\n```\n\n该语句定位到 `ProdNum` 为 ‘20-001’的行，并将 `Description`\
  \ 字段设置为 `'Galapagos Organic Medium'`。\n\n可以更新多行。例如，假设我们希望将所有危地马拉咖啡的价格都改为 12.95。如果你查看表\
  \ 16-1，你会发现每种危地马拉咖啡的产品编号都以 ‘21’开头。我们需要的是一个 `UPDATE` 语句，找到所有 `ProdNum` 列以 ‘21’ 开头的行，并将这些行的\
  \ `Price` 列改为 12.95。以下是这样的语句：\n\n```\nUPDATE Coffee\n   SET Price = 12.95\n   WHERE\
  \ ProdNum LIKE '21%'\n```\n\n# 警告\n\n在使用 `UPDATE` 语句时，务必小心不要遗漏 `WHERE` 子句和条件表达式。可能会可能会表中每一行的内容！例如，查看以下语句：\n\
  \n```\nUPDATE Coffee\n   SET Price = 4.95\n```\n\n由于该语句没有 `WHERE` 子句，它将把 `Coffee`\
  \ 表中每一行的 `Price` 列都改为 4.95！\n\n# 使用 JDBC 更新行\n\n在 JDBC 中发布 `UPDATE` 语句的过程与发布 `INSERT`\
  \ 语句相似。首先，你通过 `Connection` 对象的 `createStatement` 方法获取一个 `Statement` 对象。然后，你使用 `Statement`\
  \ 对象的 `executeUpdate` 方法来发布 `UPDATE` 语句。该方法返回一个 `int` 值，表示受 `UPDATE` 语句影响的行数。以下是一个示例：\n\
  \n```\nString sqlStatement = \"UPDATE Coffee \" +\n                       \"SET\
  \ Price = 9.95 \" +\n                       \"WHERE Description = 'Brazilian Decaf'\"\
  ;\n int rows = stmt.executeUpdate(sqlStatement);\n```\n\n第一条语句创建一个包含 `UPDATE` 语句的字符串。第二个语句将此字符串作为参数传递给\
  \ `executeUpdate` 方法。该方法返回一个 `int` 值，表示更改的行数。\n\n代码列表 16-8 展示了如何更新 `Coffee` 表中的行。用户输入一个现有的产品编号，程序显示该产品的数据。然后用户为指定产品输入一个新价格，程序用新价格更新该行。\n\
