  \n*   Java 是一种区分大小写的语言。它不认为大写字母与其小写形式是同一个字符。\n*   所有 Java 程序必须存储在以 `.java` 结尾的文件中。\n\
  *   注释会被编译器忽略。\n*   一个 `.java` 文件可以包含许多类，但只能有一个 `public` 类。如果一个 `.java` 文件有一个公有类，则该类的名称必须与文件名相同。例如，如果文件\
  \ `Pizza.java` 包含一个 `public class`，那么该类的名称将是 `Pizza`。\n*   每个 Java 应用程序都必须有一个名为\
  \ `main` 的方法。\n*   每一个左大括号（或左大括号）都必须有一个对应的右大括号（或右大括号）。\n*   语句以分号结束。这不包括注释、类头部、方法头部或大括号。\n\
