  \ 这条消息在打印时不带引号。在编程术语中，引号内的字符组被称为*字符串字面量*（string literal）。\n\n### 注意\n\n这是程序中唯一一行会在屏幕上打印任何内容的行。其他行，如\
  \ `public class Simple` 和 `public static void main(String[] args)`，对于程序的程序框架是必需的，但它们不会导致任何屏幕输出。记住，程序是给计算机的一组指令。如果要在屏幕上显示内容，你必须使用相应的编程语句。\n\
  \n行末尾是一个*分号*（semicolon）。正如句号标记句子的结束一样，分号在 Java 中标记语句的结束。然而，并不是每一行代码都以分号结束。以下是你不需要放置分号的总结：\n\
  \n*   注释不需要以分号结束，因为编译器会忽略它们。\n*   类头部和方法头部不以分号结束，因为它们以大括号内部的代码体作为结束标志。\n*   大括号字符\
