  \n文件在第 21 行打开，并创建了一个读取它的 `Scanner` 对象。第 24 行到 31 行的循环读取了文件中所有的行并显示它们。在第 24 行，循环调用了\
  \ `Scanner` 对象的 `hasNext()` 方法。如果该方法返回 `true`，则文件中有更多数据待读。在这种情况下，在第 27 行从文件中读取下一行，并在第\
  \ 30 行显示。循环不断重复，直到 `hasNext()` 方法在第 24 行返回 `false`。图 4-19 显示了读取文件直到末尾的逻辑。\n\n##\
  \ 图 4-19 读取文件直到末尾的逻辑\n\n![读取文件直到末尾的逻辑。](img/04fig19.png)图 4-19 完整备用文本\n\n## 从文件中读取原始值\n\
  \n回想第 2 章，`Scanner` 类提供了读取原始值的方法。这些方法名为 `nextByte()`、`nextDouble()`、`nextFloat()`、`nextInt()`、`nextLine()`、`nextLong()`\
  \ 和 `nextShort()`。表 2-17 \n\n`nextLine()` 方法返回的字符串不包含换行符。\n\n\n\n\n```\nException\
  \ in thread \"main\" java.io.FileNotFoundException: Numbers.txt (The\nsystem cannot\
  \ find the file specified)\n   at java.io.FileInputStream.open(Native Method)\n\
  \   at java.io.FileInputStream.<init>(FileInputStream.java:106)\n   at java.util.Scanner.<init>(Scanner.java:636)\n\
  \   at FileSum.main(FileSum.java:17)\n```\n\n与其让异常抛出并允许显示这段晦涩的错误信息，不如让程序在尝试打开文件之前检查该文件是否存在。如果文件不存在，程序可以显示一条更符合用户习惯的错误信息并优雅地关闭。\n\
  \n在你创建了一个代表要打开的文件的 `File` 对象后，你可以使用 `File` 类的 `exists` 方法来确定文件是否存在。如果文件存在，该方法返回\
  \ `true`；如果文件不存在，则返回 `false`。代码列表 4-21 展示了如何使用该方法。这是对代码列表 4-20 中 `FileSum` 程序的修改。这个版本的程序在尝试打开\
  \ `Numbers.txt` 文件之前会先检查它的存在性。\n\n```\n 1  import java.util.Scanner;\n 2  import\
  \ java.io.*;\n 3 \n 4  /**\n 5     这个版本的程序在打开 Numbers.txt\n 6     文件之前会确认其是否存在。\n\
  \ 7  */\n 8 \n 9  public class FileSum2\n 10  {\n 11      public static void main(String[]\
  \ args) throws IOException\n 12      {\n 13         double sum = 0.0;  // 加器，初始化为\
  \ 0\n 14 \n 15      // 确保文件存在。\n 16      File file = new File(\"Numbers.txt\");\n\
  \ 17      if (!file.exists())\n 18      {\n 19         System.out.println(\"The\
  \ file Numbers.txt is not found.\");\n 20         System.exit(0);\n 21      }\n\
  \ 22 \n 23      // 打开文件读取。\n 24      Scanner inputFile = new Scanner(file);\n 25\
  \ \n 26      // 读取文件中的所有值\n 27      // 并计算总和。\n 28      while (inputFile.hasNext())\n\
  \ 29      {\n 30         // 从文件中读取一个值。\n 31         double number = inputFile.nextDouble();\n\
  \ 32 \n 33         // 将数字加到 sum 中。\n 34         sum = sum + number;\n 35      }\n\
  \ 36 \n 37      // 关闭文件。\n 38      inputFile.close();\n 39 \n 40      // 显示数字总和。\n\
  \ 41      System.out.println(\"The sum of the numbers in \" +\n 42             \
  \            \"Numbers.txt is \" + sum);\n 43    }\n 44  }\n```\n\n程序输出（假设 Numbers.txt\
  \ 不存在）\n\n```\nThe file Numbers.txt is not found.\n```\n\n# 代码列表 4-21 (FileSum2.java)\n\
