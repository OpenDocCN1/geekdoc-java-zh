  \ | 900 | $0.40 |\n| C | $69.99 | 无限制 | $0.00 |\n\n编写一个程序计算客户的账单。要求用户输入购买的套餐（A、B\
  \ 或 C）以及使用的分钟数。程序应显示总费用。\n\n# 14. 移动运营商，部分 2\n\n修改你为 13 编写程序，使其还能计算并显示 A 套餐购买 B\
