  \n# 4.2 `while` 循环\n\n概念：循环是程序中重复执行的部分。\n\n在第 3 章中，你已经学习了控制结构的概念，它们引导程序的执行流。`loop`\
  \ 是一种导致语句或一组语句重复执行的控制结构。Java 有三种循环控制结构：`while` 循环、`do-while` 循环和 `for` 循环。这三者之间的区别在于它们如何控制重复执行。在本节中，我们将重点关注\
  \ `while` 循环。\n\n# 观看 `while` 循环\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/WZCyuIQpl1CK1QIR6VSrUhbst9yF1jub`](https://mediaplayer.pearsoncmg.com/assets/_video.true/WZCyuIQpl1CK1QIR6VSrUhbst9yF1jub)\n\
  \n`while` 循环有两个重要部分：(1) 一个用于测试 `true` 或 `false` 值的 `boolean` 表达式，(2) 一个只要表达式为 `true`\
  \ 就会重复执行的语句或语句块。图 4-1 显示了 `while` 循环的逻辑。\n\n![while 循环的逻辑始于布尔表达式。当表达式被测试为真时，会执行一条语句，while\
  \ 循环再次开始并重复，直到表达式为假为止。](img/04fig01.png)\n\n# 图 4-1 `while` 循环的逻辑\n\n以下是 `while`\
  \ 循环的通用格式：\n\n```\nwhile (BooleanExpression)\n Statement;\n```\n\n在通用格式中，`BooleanExpression`\
  \ 是任何有效的 `boolean` 表达式，而 `Statement` 是任何有效的 Java 语句。格式中显示的第一行有时称为 `loop header`（循环头）。它由关键字\
  \ `while` 后面跟在括号内的 `BooleanExpression` 组成。\n\n循环的工作原理如下：测试 `BooleanExpression`，如果为\
  \ `true`，则执行 `Statement`。然后再次测试 `BooleanExpression`。如果为 `true`，则执行 `Statement`。此循环重复，直到\
  \ `BooleanExpression` 为 `false`。\n\n重复执行的语句被称为循环的 `body`（循环体）。它也被认为是一种条件执行的语句，因为它只有在\
  \ `BooleanExpression` 为 `true` 的条件下才会被执行。\n\n注意循环头的末尾没有分号。与 `if` 语句一样，`while` 循环如果没有后续的条件执行语句，它是不完整的。如果你希望\
  \ `while` 循环重复一个语句块，格式如下：\n\n```\nwhile (BooleanExpression)\n{\n   Statement;\n\
  }\n```\n\n`BooleanExpression` 经过测试，如果为 `true`，则执行 `Statement`。然后再次测试 `BooleanExpression`。如果为\
  \ `true`，则执行 `Statement`。此循环重复，直到 `BooleanExpression` 为 `false`。\n\n重复执行的语句被称为循环的\
  \ `body`（循环体）。它也被认为是一种条件执行的语句，因为它只有在 `BooleanExpression` 为 `true` 的条件下才会被执行。\n\n\
  注意循环头的末尾没有分号。与 `if` 语句一样，`while` 循环如果没有后续的条件执行语句，它是不完整的。如果你希望 `while` 循环重复一个语句块，格式如下：\n\
