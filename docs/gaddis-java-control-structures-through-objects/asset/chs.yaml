  TranslateTransition ttrans =\n         new TranslateTransition(new Duration(3000),\
  \ myCircle);\n```\n\n`RotateTransition` 类创建一个使节点旋转的动画。`RotateTransition` 类有三个构造函数，如表\
  \ 14-13 所示。\n\n`RotateTransition` 类创建一个使节点旋转的动画。`RotateTransition` 类有三个构造函数，如表 14-13\
  \ 所示。\n\n（注：原文中存在大量重复和乱码片段，已根据要求提取核心逻辑内容并进行了正确的格式化处理。）\n\n```content\nCircle myCircle\
  \ = new Circle(0, 50, 30);\nTranslateTransition ttrans =\n         new TranslateTransition(new\
  \ Duration(3000), myCircle);\n```\n\n`RotateTransition` 类创建一个使节点旋转的动画。`RotateTransition`\
  \ 类有三个构造函数，如表 14-13 所示。\n\n\n\n\n\n```java\nimport javafx.application.Application;\n\
  import javafx.stage.Stage;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.scene.layout.HBox;\nimport javafx.scene.layout.VBox;\nimport javafx.geometry.Pos;\n\
  import javafx.geometry.Insets;\nimport javafx.scene.image.Image;\nimport javafx.scene.image.ImageView;\n\
  import javafx.animation.RotateTransition;\nimport javafx.util.Duration;\nimport\
  \ javafx.scene.control.Button;\nimport javafx.event.EventHandler;\nimport javafx.event.ActionEvent;\n\
  \n/**\n  An Animation Demo\n */\npublic class RotateImage extends Application\n\
  {\n    public static void main(String[] args)\n    {\n       // Launch the application.\n\
  \       launch(args);\n    }\n\n    @Override\n    public void start(Stage primaryStage)\n\
  \    {\n       // 场景大小常量\n       final double SCENE_WIDTH = 250.0;\n       final\
  \ double SCENE_HEIGHT = 350.0;\n\n       // 动画常量\n       final double HALF_SEC =\
  \ 500.0;\n       final double FROM_ANGLE = 0.0;\n       final double TO_ANGLE =\
  \ 360.0;\n\n       // 布局内边距常量\n       final double PADDING_SPACE = 20.0;\n\n   \
  \    // 创建一个 BorderPane。\n       BorderPane borderPane = new BorderPane();\n\n \
  \      // 创建 Image 和 ImageView 组件。\n       Image image = new Image(\"file:Ace_Diamonds.png\"\
  );\n       ImageView imageView = new ImageView(image);\n\n       // 为 ImageView\
  \ 创建一个 RotateTransition 对象。\n       RotateTransition rtrans =\n          new RotateTransition(new\
  \ Duration(HALF_SEC), imageView);\n       rtrans.setFromAngle(FROM_ANGLE);\n   \
  \    rtrans.setToAngle(TO_ANGLE);\n\n       // 将 ImageView 于 BorderPane 的中心。\n \
  \      borderPane.setCenter(imageView);\n\n       // 创建一个启动动画的按钮。\n       Button\
  \ spinButton = new Button(\"Spin\");\n\n       // 为按钮创建事件处理器。\n       spinButton.setOnAction(event\
  \ ->\n       {\n          rtrans.play();\n       });\n\n       // 将按钮放入 HBox。\n\
  \       HBox hbox = new HBox(spinButton);\n       hbox.setAlignment(Pos.CENTER);\n\
  \       hbox.setPadding(new Insets(PADDING_SPACE));\n\n       // 将 HBox 放入 BorderPane\
  \ 的底部区域。\n       borderPane.setBottom(hbox);\n\n       // 创建场景并显示。\n       Scene\
  \ scene = new Scene(borderPane, SCENE_WIDTH, SCENE_HEIGHT);\n       primaryStage.setScene(scene);\n\
  \       primaryStage.show();\n    }\n}\n```\n\n### 代码列表 14-11 `(RotateImage.java)`\n\
