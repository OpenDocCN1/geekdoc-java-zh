  \n## 2.3 变量与字面量\n\n概念：变量是计算机内存中一个命名的存储位置。字面量是写入程序代码中的值。\n\n正如你在第 1 章中所发现的那样，变量允许你在计算机内存中存储和处理数据。编程的工作部分是确定程序需要多少个变量以及它们将持有什么类型的数据。代码列表\
  \ 2-7 中的程序是一个带有变量的 Java 程序的示例。\n\n在下面的动画中，点击“上一个”或“下一个”按钮可以逐步执行代码并查看全程的解释。\n\n###\
  \ 代码列表 2-7 `(Variable.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-7/7.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-7/7.html)\n\
  \n让我们更仔细地看看这个程序。这是第 7 行：\n\n```\nint value;\n```\n\n# 观察变量声明\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/8DVUgTNnFC_uY2H68SZnfLHfBllULCn5`](https://mediaplayer.pearsoncmg.com/assets/_video.true/8DVUgTNnFC_uY2H68SZnfLHfBllULCn5)\n\
  \n这被称为*变量声明*。变量必须在使用之前进行声明。变量声明告诉编译器变量的名字以及它将持有的数据类型。这一行表示变量的名字是 `value`。`int` 一词代表整数（integer），因此\
  \ `value` 将仅用于存储整数。注意变量声明以分号结束。该程序中的下一条语句出现在第 9 行：\n\n```\nvalue = 5;\n```\n\n这是一个*赋值语句*。等号是一个运算符，它将右侧的值（在此例为\
  \ `5`）存储到左侧命变量中。执行此行后，`value` 将包含值 `5`。\n\n### 注意\n\n这一行不会在计算机屏幕上打印任何内容。它在后台静默运行。\n\
  \n现在看第 10 和第 11 行：\n\n```\nSystem.out.print(\"The value is \");\nSystem.out.println(value);\n\
  ```\n\n第 10 行的语句将字符串字面量 `\"The value is \"` 发送到 `print` 方法。第 11 行的语句将 `value` 变量的名字送到\
  \ `println` 方法。当你将变量名发送到 `print` 或 `println` 时，变量的内容就会显示出来。注意 `value` 周围没有引号。看看代码列表\
  \ 2-8 中发生了什么。在下面的动画中，点击“上一个”或“下一个”按钮可以逐步执行代码并查看解释。\n\n### 代码列表 2-8 `(Variable.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-8/8.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-8/8.html)\n\
  \n当双引号放在单词 `value` 周围时，它就变成了一个字符串字面量，而不是变量名。当字符串字面量被送到 `print` 或 `println` 时，它们将按照它们在引号内的样子完全显示。\n\
  \n### 使用 + 运算符显示多个项目\n\n当 `+` 运算符与字符串一起使用时，它被称为*字符串连接运算符*。连接的意思是追加，因此字符串连接运算符的作用将一个字符串追加到另一个后面。例如，看以下语句：\n\
  \n```\nSystem.out.println(\"This is \" + \"one string.\");\n```\n\n这条语句将打印：\n\n\
  ```\nThis is one string.\n```\n\n`+` 运算符产生一个由用作操作数的两个字符串组合成的字符串。你也可以使用 `+` 运算符将变量的内容连接到字符串。以下代码显示了一个示例：\n\
  \n```\nnumber = 5;\nSystem.out.println(\"The value is \" + number);\n```\n\n第二行使用\
  \ `+` 运算符将 `number` 变量的内容与字符串 `\"The value is \"` 连接。尽管 `number` 不是字符串，但 `+` 运算符将其值转换为字符串，然后将该值与第一个字符串连接。将显示的输出是：\n\
  \n```\nThe value is 5\n```\n\n有时，你用于 `print` 或 `println` 的参数太长，无法放入程序中的单行中。然而，字符串字面量不能在一行开始并在另一行结束。例如，以下代码会导致错误：\n\
  \n```\n// 这是一个错误！\nSystem.out.println(\"Enter a value that is greater than zero\
  \ and less than 10.\");\n```\n\n你可以通过将参数拆分成更小的字符串字面量，然后使用字符串连接运算符将其分布在多行上来解决这个问题。这是一个示例：\n\
  \n```\nSystem.out.println(\"Enter a value that is \" +\n                   \"greater\
  \ than zero and less \" +\n                   \"than 10.\");\n```\n\n在这一语句中，参数被分成三个字符串并使用\
  \ `+` 运算符连接。下面的示例显示了当变量的内容是连接的一部分时使用相同的技术：\n\n```\nsum = 249;\nSystem.out.println(\"\
  The sum of the three \" +\n                   \"numbers is \" + sum);\n```\n\n#\
  \ 小心引号\n\n正如代码列表 2-8 所示，在变量名周围加上引号会改变程序的结果。事实上，在任何不应该是字符串字面量的东西周围加上双引号会导致某种类型的错误。例如，在代码列表\
  \ 2-7 和 2-8 中，数字 5 被赋值给变量 `value`。这样赋值将会是错误的：\n\n```\nvalue = \"5\";\n```\n\n在这一语句中，5\
  \ 不再是整数，而是字符串字面量。因为 `value` 被声明为整数，你只能在其中存储整数。数字可以表示为字符串的事实经常让学生感到困惑。只需记住字符串是为了人类阅读。它们被打印在计算机屏幕或纸上。而数字主要用于数学运算。你不能对字符串进行数学运算，在数字显示在屏幕上之前，必须先转换为字符串。（幸运的是，当你将数字送到\
  \ `print` 或 `println` 时，它们会处理转换。）如果这仍然困扰你，不要担心。在本章后面，我们将通过讨论它们的内部存储进一步说明数字、字符和字符串之间的区别。\n\
  \n 关于字面量的更多\n\n字面量是写入程序代码中的值。字面量通常被赋值给变量或显示。代码列表 2-9 包含了字面量和变量。\n\n```\n 1  // 这个程序包含字面量和变量。\n\
  \ 2\n 3  public class Literals\n 4  {\n 5     public static void main(String[] args)\n\
  \ 6     {\n 7        int apples;\n 8\n 9        apples = 20;\n10       System.out.println(\"\
  Today we sold \" + apples +\n11                           \" bushels of apples.\"\
  );\n12     }\n13  }\n```\n\n程序输出\n\n```\nToday we sold 20 bushels of apples.\n```\n\
  \n### 代码列表 2-9 `(Literals.java)`\n\n当然，这个程序中的变量是 `apples`。它被声明为整数。表 2-3 显示了程序中找到的字面量列表。\n\
  \n### 表 2-3 字面量\n\n\n\n\n\n| 字面量 | 字面量类型 |\n| --- | --- |\n| 20 | 整数字面量 |\n| “Today\
  \ we sold ” | 字符串字面量 |\n| “ bushels of apples.” | 字符串字面量 |\n\n## 标识符 (Identifiers)\n\
  \n`identifier` 是程序员定义的名称，用于表示程序中的某些元素。变量名和类名都是标识符的示例。在 Java 中，你可以自定义变量名和类名，只要不使用任何\
  \ Java 关键字即可。`key words` 关键字构成了语言的核心，每个关键字都有特定的用途。第 1-3 表 节位于 第 1 章 且 附录 C 展示了 Java\
  \ 关键字的完整列表。\n\n你应该始终为变量选择能够表明其用途的名称。你可能会忍不住声明像如下名称的变量：\n\n```\nint x;\n```\n\n这个相当平庸的名称\
  \ `x` 没有提供关于变量用途的线索。这里有一个更好的例子。\n\n```\nint itemsOrdered;\n```\n\n`itemsOrdered`\
  \ 这个名称让任何阅读程序的人都能明白该变量的用途。这种编码方法有助于产生`自文档程序`（self-documenting programs），这意味着你只需通过阅读代码就能理解程序在做什么。因为现实世界的程序通常有数千行代码，因此让它们尽可能具有自文档性是非常重要的。\n\
  \n你可能已经注意到 `itemsOrdered` 名称中大写字母和小写字母的混合。虽然所有的 Java 关键字必须用小写字母，但你可以在变量名中使用大写字母。`itemsOrdered`\
  \ 中的 `O` 大写是为了提高可读性。通常“items ordered”被当作两个单词。然而，变量名不能包含空格，所以这两个单词必须合并在一起。当“items”和“ordered”连在一起时，你会得到如下变量声明：\n\
  \n```\nint itemsordered;\n```\n\n字母 `O` 的大写使 `itemsOrdered` 更易阅读。通常，变量名以小写字母开头，此后，组成变量名的每个独立单词的首字母都要大写。\n\
  \n以下是所有标识符都必须遵循的某些特定规则：\n\n* 第一个字符必须是 a–z 或 A–Z 字母之一、下划线（`_`）或美元符号（`$`）。\n* 第一个字符之后，可以使用字母\
  \ a–z 或 A–Z、数字 0–9、下划线（`_`）或美元符号（`$`）。\n* 大小字母是有区分的。这意味着 `itemsOrdered` 不同于 `itemsordered`。\n\
  * 标识符不能包含空格。\n\n### 注意事项\n\n虽然 `$` 是合法的标识符字符，但它通常用于特殊用途。因此，不要在你的变量名中使用它。\n\n表 2-4\
  \ 显示了变量名列表，并告知每个在 Java 中是合法还是非法。\n\n### 表 2-4 一些变量名\n\n| 变量名 | 合法或非法？ |\n| --- |\
  \ --- |\n| `dayOfWeek` | 合法 |\n| `3dGraph` | 非法，因为标识符不能以数字开头 |\n| `june1997` | 合法\
  \ |\n| `mixture#3` | 非法，因为标识符只能使用字母、数字、下划线或美元 |\n| `week day` | 非法，因为标识符不能包含空格\n\
  \n### 类名 (Class Names)\n\n如前，标准做法是变量名以小写字母开头，然后将名称后续每个单词的首字母大写。将类名的首字母以及其包含的后续每个单词的首字母大写也是一种标准做法。这有助于区分变量名和类名。例如，`payRate`\
  \ 是一个变量名，而 `Employee` 是一个类名。\n\n# 检查点 2.14\n\n../components/metrodigi/ch02-inline_self_quiz_v1.0.0-08/index.html\n\
