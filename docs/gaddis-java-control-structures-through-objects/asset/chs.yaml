  \n## 响应 `RadioButton` 点击\n\n有时，你只是想知道 `RadioButton` 是否被选中。在这种情况下，你调用 `RadioButton`\
  \ 控件的 `isSelected` 方法。然而，在其他时候，你希望在用户点击 `RadioButton` 时立即执行操作。就像 `Button` 控件一样，`RadioButton`\
  \ 控件在被点击时会生成一个 `ActionEvent`。如果你想响应 `RadioButton` 的动作事件，必须为该控件注册一个事件处理器。为 `RadioButton`\
  \ 创建并注册事件处理器的过程与创建和注册 `Button` 事件处理器的过程相同。\n\n代码列表 13-15 显示了一个示例。当程序运行时，它会显示如图 13-9\
  \ 所示的左侧窗口。初始显示一朵花的图像。当用户点击*Sunset* `RadioButton` 时，图像会立即如右侧窗口所示发生变化。用户可以点击 `RadioButton`\
  \ 控件来显示花朵或日落。\n\n## 图 13-9 RadioButtonEvent 应用程序\n\n![两个窗口描述了 Radio Button 事件应用程序。](img/13fig09.png)图\
  \ 13-9 完整替代文本\n\n\n\n\n\n```\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.HBox;\nimport javafx.scene.layout.VBox;\n\
  import javafx.geometry.Pos;\nimport javafx.geometry.Insets;\nimport javafx.scene.control.Label;\n\
  import javafx.scene.control.CheckBox;\nimport javafx.scene.control.Button;\nimport\
  \ javafx.event.EventHandler;\nimport javafx.event.ActionEvent;\n\n/**\n  CheckBox\
  \ Demo 应用程序\n */\n\npublic class PizzaToppings extends Application\n{\n  // 字段\n\
  \  CheckBox pepperoniCheckBox;\n  CheckBox cheeseCheckBox;\n  CheckBox anchoviesCheckBox;\n\
  \  Label totalLabel;\n\n  public static void main(String[] args)\n  {\n     // 启动应用程序。\n\
  \     launch(args);\n  }\n\n  @Override\n  public void start(Stage primaryStage)\n\
  \  {\n     // 创建 CheckBoxes。\n     pepperoniCheckBox = new CheckBox(\"Pepperoni\
  \ $3.00\");\n     cheeseCheckBox = new CheckBox(\"Cheese $2.00\");\n     anchoviesCheckBox\
  \ = new CheckBox(\"Anchovies $1.00\");\n\n     // 创建 Button 控件。\n     Button totalButton\
  \ = new Button(\"Get Total\");\n\n     // 注册事件处理器。\n     totalButton.setOnAction(new\
  \ TotalButtonHandler());\n\n     // 为总计创建一个 Label。\n     totalLabel = new Label(\"\
  $0.00\");\n\n     // 将 CheckBoxes 放入一个 VBox 中。\n     VBox checkBoxVBox = new VBox(10,\
  \ pepperoniCheckBox,\n                                  cheeseCheckBox, anchoviesCheckBox);\n\
  \n     // 创建另一个 VBox 作为根节点。\n     VBox mainVBox = new VBox(10, checkBoxVBox, totalButton,\n\
  \                               totalLabel);\n\n     // 设置主 VBox 的对齐方式为居中。\n   \
  \  mainVBox.setAlignment(Pos.CENTER);\n\n     // 设置主 VBox 的内边距为 10 像素。\n     mainVBox.setPadding(new\
  \ Insets(10));\n\n     // 创建 Scene。\n     Scene scene = new Scene(mainVBox);\n\n\
  \     // 将 Scene 添加到 Stage。\n     primaryStage.setScene(scene);\n\n     // 显示窗口。\n\
  \     primaryStage.show();\n  }\n\n  /**\n    totalButton 的事件处理器类\n   */\n\n  class\
  \ TotalButtonHandler implements EventHandler<ActionEvent>\n  {\n     @Override\n\
  \     public void handle(ActionEvent event)\n     {\n        // 用于存储结果的变量\n    \
  \    double result = 0;\n\n        // 累加配料。\n        if (pepperoniCheckBox.isSelected())\n\
  \        result += 3.0;\n\n        if (cheeseCheckBox.isSelected())\n        result\
  \ += 2.0;\n\n        if (anchoviesCheckBox.isSelected())\n        result += 1.0;\n\
  \n        // 显示结果。\n        totalLabel.setText(String.format(\"$%,.2f\", result));\n\
  \     }\n  }\n}\n```\n\n# 代码列表 13-16 `(PizzaToppings.java)`\n\n# 图 13-11 PizzaToppings\
