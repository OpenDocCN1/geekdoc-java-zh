  \n### 编译并运行 Java 程序\n\n编译 Java 程序是一个简单的过程。一旦你安装了 JDK，请进入操作系统的命令提示符。\n\n### 提示\n\n\
  在 Windows 中，点击“开始”，进入“所有程序”，然后进入“杂项”。点击杂项菜单上的“命令提示符”。一个命令提示符窗口就会打开。\n\n### 查看编译和运行\
  \ Java 程序\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_01_01_Compiling_and_Running_a_Java_Program`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_01_01_Compiling_and_Running_a_Java_Program)\n\
  \n在操作系统的命令提示符处，确保你处于想要编译的 Java 程序所在的相同目录或文件夹中。然后，使用如下格式的 `javac` 命令：\n\n```\njavac\
  \ Filename\n```\n\n`Filename` 是包含 Java 源代码的文件名。如前所述，该文件具有 `.java` 扩展名。例如，如果你想编译\
  \ `Payroll.java` 文件，你需要执行以下命令：\n\n```\njavac Payroll.java\n```\n\n该命令运行编译器。如果文件包含任何错误，你将看到一条或多个错误消息，编译器不会将其翻译为字节码。在这种情况下，你必须在编辑器中打开源文件并修复错误。然后再次运行编译器。如果没有语法错误，编译器将将其翻译为字节码。字节码存储在具有\
  \ `.class` 扩展的文件中，它与源文件位于相同的目录或文件夹中。要运行 Java 程序，使用如下格式的 `java` 命令：\n\n```\njava\
  \ ClassFilename\n```\n\n`ClassFilename` 是要执行的 `.class` 文件名；但不需要输入 `.class` 扩展名。例如，运行存储在\
  \ `Payroll.class` 文件中的程序，你需要输入：\n\n```\njava Payroll\n```\n\n该命令运行 Java 解释器（JVM）并执行程序。\n\
  \n除了命令提示符，还有几个集成开发环境（IDE）。这些环境将文本编辑器、编译器、调试器和其他工具集成到一个包中。通过点击按钮或从菜单中选择单项即可编译并运行程序。图\
  \ 1-7 展示了 NetBeans IDE 的屏幕。\n\n### 图 1-7 集成开发环境 (IDE)\n\n![标题为 Payroll 的程序截图，net\
  \ beans IDE 8.1 带有导航窗口，以及一个标题为 payroll. java 的窗口，显示了代码。](img/01fig07.png)\n\n##\
  \ 查看 IDE\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/6jAkSKvtMz3mnRA42T_kgY7XGXxulMy`](https://mediaplayer.pearsoncmg.com/assets/_video.true/6jAkSKvtMz3mnRA42T_kgY7XGXxulMy)\n\
