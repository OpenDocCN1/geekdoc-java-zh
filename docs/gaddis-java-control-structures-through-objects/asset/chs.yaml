  \n# 10.8 抽象类与抽象方法\n\n概念：抽象类不能被实例化，但其他类可以扩展它。抽象方法没有方法体，必须在子类中被重写。\n\n抽象方法是一种出现在父类中，但期望在子类中被重写的方法。抽象方法只有头部而没有方法体。以下是抽象方法头部的通用格式：\n\
  \n```\nAccessSpecifier abstract ReturnType MethodName(ParameterList);\n```\n\n注意关键字\
  \ `abstract` 出现在头部中，且头部以分号结尾。该方法没有方法体。这里有一个抽象方法头部的示例：\n\n```java\npublic abstract\
  \ void setValue(int value);\n```\n\n当抽象方法出现在一个类中时，该方法必须在子类中被重写。如果子类未能重写该方法，将会导致错误。抽象方法用于确保子类实现了该方法。\n\
  \n当一个类包含抽象方法时，你无法创建该类的实例。抽象方法通常用于抽象类中。抽象类本身不被实例化，而是作为其他类的父类。抽象类代表了所有继承自它的类的通用形式或抽象形式。\n\
  \n例如，考虑一个制造飞机的工厂。该工厂不制造通用的飞机，而是制造三种特定类型的飞机：两种不同型号的螺旋桨飞机和一种支线客机模型。用于记录飞机的计算机软件可能会使用一个名为\
  \ `Airplane` 的抽象类。该类拥有代表所有飞机共同特征的成员。此外，软件还为工厂制造的三种特定飞机模型各有一个类。这些类都扩展了 `Airplane`\
  \ 类，并拥有代表每种类型飞机独特特征的成员。`Airplane` 类从不被实例化，而是被用作其他类的父类。\n\n当你在类定义中放置 `abstract` 关键字时，该类就变成了抽象类。以下是通用格式：\n\
  \n```\nAccessSpecifier abstract class ClassName\n```\n\n抽象类不能被实例化，但其他类可以扩展它。抽象方法没有方法体，必须在子类中被重写。\n\
  \n例如，看在 代码列表 10-26 中所示的抽象类 `Student`。它持有所有学生共同的数据，但不持有特定专业学生所需的所有数据。\n\n```java\n\
  \ 1  /**\n  2     Student 类是一个抽象类，它持有\n  3     关于学生的通用数据。代表\n  4     特定类型学生的类应该继承自\n\
  \  5     此类。\n  6  */\n  7\n8  public abstract class Student\n9  {\n10     private\
  \ String name;        // 姓名\n11     private String idNumber;    // 学号（此处应为 idNumber）\n\
  12     private int yearAdmitted;   // 入学年份\n13\n14     /**\n15        构造函数设置了学生的姓名、\n\
  16        学号，和入学年份。\n17        @param n 学生的姓名。\n18        @param id 学生的学号。\n19 \
  \       @param year 入学年份。\n20        */\n21     public Student(String n, String\
  \ id, int year)\n22     {\n23        name = n;\n24        idNumber = id;\n25   \
  \     yearAdmitted = year;\n26     }\n27\n28     /**\n29        toString 方法返回一个包含\n\
  30        学生数据的字符串。\n31        @return 字符串的引用。\n32     */\n33\n34     public String\
  \ toString()\n35     {\n36        String str;\n37\n38        str = \"Name: \" +\
  \ name\n39           + \"\\nID Number: \" + idNumber\n40           + \"\\nYear Admitted:\
  \ \" + yearAdmitted;\n41        return str;\n42     }\n43\n44     /**\n45      \
  \  getRemainingHours 方法是抽象的。\n46        它必须在子类中被重写。\n47        @return 学生剩余的学分。\n\
  48        */\n49\n50     public abstract int getRemainingHours();\n51  }\n```\n\n\
  # 代码列表 10-26 `(Student.java)`\n\n`Student` 类包含存储学生姓名、学号和入学年份的字段。它还包含一个构造函数、一个 `toString`\
  \ 方法和一个名为 `getRemainingHours` 的抽象方法。\n\n该抽象方法必须在继承自 `Student` 的类中被重写。该方法背后的想法是它返回学生在其专业内剩余的学分。它之所以被设为抽象，是因为该类旨在作为代表特定专业学生的基类。例如，`CompSciStudent`\
  \ 类可能持有计算机科学学生的数据，而 `BiologyStudent` 类可能持有生物专业学生的数据。计算机科学学生必须修的课程与生物专业学生修的课程不同。合理的，`CompSciStudent`\
  \ 类计算剩余学分的方式将与 `BiologyStudent` 类不同。让我们来看 `CompSciStudent` 类的示例，它显示在 代码列表 10-27\
  \ 中。\n\n\n\n\n\n```java\n /**\n  此类存储了计算机科学专业学生的数据。\n */\n\npublic class CompSciStudent\
  \ extends Student\n{\n   // 必要学时\n   private final int MATH_HOURS = 20;   // 数学学时\n\
  \   private final int CS_HOURS = 40;     // 计算机学时\n   private final int GEN_ED_HOURS\
  \ = 60; // 通修学时\n\n   // 已修学时\n   private int mathHours;  // 已修数学学时\n   private\
  \ int csHours;    // 已修计算机学时\n   private int genEdHours; // 已修的通修学时\n\n   /**\n\
  \      构造函数设置学生的姓名、 \n      ID 编号和入学年份。\n      @param n 学生的姓名。\n      @param id\
  \ 学生的 ID 编号。\n      @param year 学生的入学年份。\n   */\n\n   public CompSciStudent(String\
  \ n, String id, int year)\n   {\n      super(n, id, year);\n   }\n\n   /**\n   \
  \   setMathHours 方法设置已修的\n      数学学时数。\n      @param math 已修的数学学时。\n   */\n\n  \
  \ public void setMathHours(int math)\n   {\n      mathHours = math;\n   }\n\n  \
  \ /**\n      setCsHours 方法设置已修的\n      计算机科学学时数。\n      @param cs 已修的计算机科学学时。\n\
  \   */\n\n   public void setCsHours(int cs)\n   {\n      csHours = cs;\n   }\n\n\
  \   /**\n      setGenEdHours 方法设置已修的\n      通修学时数。\n      @param genEd 已修的通修学时。\n\
  \   */\n\n   public void setGenEdHours(int genEd)\n   {\n      genEdHours = genEd;\n\
  \   }\n\n   /**\n      getRemainingHours 方法返回\n      剩余需要修的学时数。\n      @return 学生剩余的学时。\n\
  \   */\n\n   @Override\n   public int getRemainingHours()\n   {\n      int reqHours,\
  \        // 总必要学时\n          remainingHours;  // 剩余学时\n\n      // 计算必要的学时。\n   \
  \   reqHours = MATH_HOURS + CS_HOURS + GEN_ED_HOURS;\n\n      // 计算剩余学时。\n     \
  \ remainingHours = reqHours − (mathHours + csHours\n                          +\
  \ genEdHours);\n\n      return remainingHours;\n   }\n\n   /**\n      toString 方法返回一个包含\n\
  \      学生数据的字符串。\n      @return 字符串的引用。\n   */\n\n   @Override\n   public String\
  \ toString()\n   {\n      String str;\n\n      str = super.toString() +\n      \
  \    \"\\n 专业: 计算机科学\" +\n          \"\\n 已修数学学时: \" + mathHours +\n          \"\
  \\n 已修计算机科学学时: \" + csHours +\n          \"\\n 已修通修学时: \" + genEdHours;\n\n    \
  \  return str;\n   }\n }\n```\n\n# 代码列表 10-27 `(CompSciStudent.java)`\n\n`CompSciStudent`\
  \ 类继承自 `Student` 类，在第 8 到 10 行声明了以下 `final` 整数字段：`MATH_HOURS`、`CS_HOURS` 和 `GEN_ED_HOURS`。这些字段存储了计算机科学学生所需的数学、计算机科学和通用教育学时数。它在第\
  \ 13 到 15 行声明了以下字段：`mathHours`、`csHours` 和 `genEdHours`。这些字段存储了学生已修的数学、计算机科学和通用教育学时。提供了修改方法来向这些字段中存储值。此外，该类重写了\
