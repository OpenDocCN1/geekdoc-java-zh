  \ area is 200.0\n```\n\n# 代码列表 6-8 `(RectangleDemo.java)`\n\n# 访问器和变变器方法\n\n如前所述，将类的所有字段设为私有（private），并提供公共方法来访问和更改这些字段是一种常见的通做法。这确保了拥有这些字段的对象能够控制对它们所进行的所有更改。获取值的方法是访问器（accessor），更改值的方法是变变器（mutator）。在\
  \ `Rectangle` 类中，`getLength` 和 `getWidth` 是访问器，而 `setLength` 和 `setWidth` 是变变器。\n\
  \n# 数据隐藏的重要性\n\n数据隐藏是面向对象编程中的一个重要概念。通过将字段设为私有，我们防止了外部类直接修改数据。相反，它们必须使用公共方法，这允许类验证数据并确保对象状态的完整性。\n\
  \n\n\n\n\n注意，在 `Rectangle` 类中，首先声明字段变量，然后定义方法。你并不要求在方法定义之前编写字段声明。事实上，有些程序员倾向于先编写公共方法的定义，最后编写私有字段的声明。无论你使用哪种风格，都应该保持一致。在书中，我们总是先写字段声明，然后是方法定义。图\
