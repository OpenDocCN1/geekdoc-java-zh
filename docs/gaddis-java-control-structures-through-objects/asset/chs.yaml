  \n# Checkpoint 8.21\n\n../components/metrodigi/ch08-inline_self_quiz_v1.0.0-17/index.html\n\
  \n# 8.9 枚举类型\n\n概念：枚举数据类型由一组预定义的值组成。你可以使用该数据类型创建变量，这些变量只能持有属于该枚举类型的值。\n\n你已经学习了数据类型的概念以及它们如何与原始变量一起使用。例如，`int`\
  \ 数据类型的变量可以存储特定范围内的整数值。你不能将浮点数值赋值给 `int` 变量，因为只有 `int` 值可以赋值给 `int` 变量。数据类型定义了该数据类型的任何变量所合法的值。\n\
  \n有时，创建一个具有特定合法值集合的自定义数据类型是有帮助的。例如，假设你想创建一个名为 `Day` 的数据类型，且该数据类型中的合法值为星期的几天的名称（星期日、星期一等）。当你创建一个\
  \ `Day` 类型的变量时，你只能在该变量中存储星期的几天的名称。任何其他值都是不合法的。在 Java 中，这种类型被称为枚举数据类型。\n\n你使用 `enum`\
  \ 关键字来创建自己的数据类型，并指定属于该类型的值。这里是一个枚举类型声明的示例：\n\n```\nenum Day { SUNDAY, MONDAY, TUESDAY,\
  \ WEDNESDAY,\n           THURSDAY, FRIDAY, SATURDAY }\n```\n\n枚举类型的声明以关键字 `enum`\
  \ 开头，后面跟着类型名称，最后是大括号内的标识符列表。示例声明创建了一个名为 `Day` 的枚举类型。大括号内列出的标识符 `SUNDAY`、`MONDAY`、`TUESDAY`、`WEDNESDAY`、`THURSDAY`、`FRIDAY`\
  \ 和 `SATURDAY` 被称为 `enum`常量。它们代表属于 `Day` 类型的值。这是枚举类型声明的通用格式：\n\n```\nenum TypeName\
  \  {  一个或多个枚举常量  }\n```\n\n注意 `enum`常量没有包含引号；因此它们不是字符串。\n\n### 提示\n\n在为 `enum` 常量命名时，并不要求它们使用大写字母。你可以将\
  \ `Day` 类型写为 `sunday`、`monday` 等。但是，由于它们代表常量，标准的约定是将它们大大写。\n\n一旦你创建了枚举类型，就可以声明该类型的变量。例如，以下语句声明了\
  \ `Day` 类型的 `workDay`：\n\n```\nDay workDay;\n```\n\n由于 `workDay` 是 `Day` 变量，我们可以合法赋值给它的枚举常量\
  \ `SUNDAY`、`MONDAY`、`TUESDAY`、`WEDNESDAY`、`THURSDAY`、`FRIDAY` 和 `SATURDAY`。如果我们尝试赋值任何这些常量以外的值，会导致编译器错误。例如，以下语句将\
  \ `Day.WEDNESDAY` 赋值给 `workDay` 变量：\n\n```\nworkDay = Day.WEDNESDAY;\n```\n\n注意我们赋值的是\
  \ `Day.WEDNESDAY` 而不仅仅是 `WEDNESDAY`。`Day.WEDNESDAY` 是枚举常量的限定名称。在大多数情况下你必须使用枚举常量的限定名称。\n\
  \n# 枚举类型是特殊的类\n\n当你编写枚举声明时，你实际上是在创建一个特殊的类。此外，在大括号内列出的 `enum`常量实际上是对象。在之前的示例中，`Day`\
  \ 是一个类，而 `SUNDAY`、`MONDAY`、`TUESDAY`、`WEDNESDAY`、`THURSDAY`、`FRIDAY` 和 `SATURDAY`\
  \ 都是 `Day` 类的实例。当我们将 `Day.WEDNESDAY` 赋值给 `workDay` 变量时，是将`Day.WEDNESDAY`对象的地址赋值给了该变量。这在图\
  \ 8-15 中所示。\n\n# 图 8-15 `workDay` 变量引用 `Day.WEDNESDAY` 对象\n\n![The work Day variable\
  \ references the of the Day WEDNESDAY objects.](img/08fig15.png)图 8-15 替代文本\n\n\
  `enum`常量实际上是对象，会自动配备一些方法。其中之一是 `toString` 方法。`toString` 方法简单地返回调用枚举常量的名称作为字符串。例如，假设\
  \ `Day` 类型已如之前所示声明，以下代码段都会显示字符串 `WEDNESDAY`（记得当对象传递给 `System.out.println` 时，会隐式调用\
  \ `toString` 方法）：\n\n```\n// 这段代码显示 WEDNESDAY。\n Day workDay = Day.WEDNESDAY;\n\
   System.out.println(workDay);\n\n // 这段代码也显示 WEDNESDAY。\n System.out.println(Day.WEDNESDAY);\n\
  ```\n\n\n\n\n`enum` 常量也有一个名为 `ordinal` 的方法。`ordinal` 方法返回一个整数值，表示常量的序数值。常量的 `ordinal\
  \ value` 是它在 `enum` 声明中的位置，其中第一个常量位于位置 0。图 8-16 显示了 `Day` 数据类型中声明的每个常量的序数值。\n\n\
  ![Day 枚举数据类型包含 6 个 enum 常量，内容如下：enum Day 左括号，后面是 6 个由数字标识的常量：SUNDAY 0, MONDAY 1,\
  \ TUESDAY 2, WEDNESDAY 3, THURSDAY 4, FRIDAY 5, SATURDAY 6。](img/08fig16.png)\n\n\
  # 图 8-16 `Day` 枚举数据类型及其 `enum` 常量的序数位置\n\n例如，假设 `Day` 类型已如之前所示声明，查看以下代码段：\n\n```\n\
  Day lastWorkDay = Day.FRIDAY;\nSystem.out.println(lastWorkDay.ordinal());\nSystem.out.println(Day.MONDAY.ordinal());\n\
  ```\n\n`Day.FRIDAY` 的序数值为 5，`Day.MONDAY` 的序数值为 1，因此这段代码将显示：\n\n```\n5\n1\n```\n\n\
  我们在这里讨论的最后一个枚举数据类型方法是 `equals` 和 `compareTo`。`equals` 方法接受一个对象作为参数，如果该对象等于调用的 `enum`\
  \ 常量，则返回 `true`。例如，假设 `Day` 类型已如之前所示声明，以下代码段将显示“The two are the same”：\n\n```\n\
  Day myDay = Day.TUESDAY;\nif (myDay.equals(Day.TUESDAY))\n   System.out.println(\"\
  The two are the same.\");\n```\n\n`compareTo` 方法用于比较相同类型的 `enum` 常量。它接受一个对象作为参数并返回以下结果：\n\
  \n- 如果调用的 `enum` 常量的序数值小于参数的序数值，则返回一个负整数\n- 如果调用的 `enum` 常量与参数相同，则返回 0\n- 如果调用的\
  \ `enum` 常量的序数值大于参数的序数值，则返回一个正整数\n\n例如，假设 `Day` 类型已如之前所示声明，以下代码段将显示“FRIDAY is greater\
  \ than MONDAY”：\n\n```\nDay myDay = Day.FRIDAY;\nif (myDay.compareTo(Day.MONDAY)\
  \ > 0)\n   System.out.println(myDay + \" is greater than \"\n                  \
  \    + Day.MONDAY);\n```\n\n声明枚举类型的一个地方是在类内部。如果你在类内部声明枚举类型，它不能在方法内部声明。代码列表 8-18\
  \ 显示了一个示例。它它演示了 `Day` 枚举类型。\n\n```\n 1 /**\n 2    此程序演示了一个枚举类型。\n 3 */\n 4\n 5 public\
  \ class EnumDemo\n 6 {\n 7    // 声明 Day 枚举类型。\n 8    enum Day { SUNDAY, MONDAY,\
  \ TUESDAY, WEDNESDAY,\n 9               THURSDAY, FRIDAY, SATURDAY }\n10\n11   \
  \ public static void main(String[] args)\n12    {\n 13       // 声明一个 Day 变量并赋值。\n\
  \ 14       Day workDay = Day.WEDNESDAY;\n15\n 16       // 下述语句显示 WEDNESDAY。\n 17\
  \       System.out.println(workDay);\n18\n 19       // 下述语句显示 Day.SUNDAY 的\n20 \
  \      // 序数值，值为 0。\n 21       System.out.println(\"The ordinal value for \" +\n\
  \ 22                          Day.SUNDAY + \" is \" +\n 23                     \
  \     Day.SUNDAY.ordinal());\n24\n 25       // 下述语句显示 Day.SATURDAY 的\n26       //\
  \ 序数值，值为 6。\n 27       System.out.println(\"The ordinal value for \" +\n 28    \
  \                      Day.SATURDAY + \" is \" +\n 29                          Day.SATURDAY.ordinal());\n\
  30\n 31       // 下述语句比较两个 enum 常量。\n 32       if (Day.FRIDAY.compareTo(Day.MONDAY)\
  \ > 0)\n 33          System.out.println(Day.FRIDAY + \" is greater than \" +\n 34\
  \                             Day.MONDAY);\n 35       else\n 36          System.out.println(Day.FRIDAY\
  \ + \" is NOT greater than \" +\n 37                             Day.MONDAY);\n\
  38    }\n39 }\n```\n\n程序输出：\n\n```\nWEDNESDAY\nThe ordinal value for SUNDAY is 0\n\
  The ordinal value for SATURDAY is 6\nFRIDAY is greater than MONDAY\n```\n\n# 代码列表\
  \ 8-18 `(EnumDemo.java)`\n\n你也可以在单独的文件中编写枚举类型声明。如果这样做，文件名必须与类型名称匹配。例如，如果我们把 `Day`\
  \ 类型存储在单独的文件中，我们将文件命名为 `Day.java`。这是合理的，因为枚举数据类型是特殊化的类。例如，查看代码列表 8-19。这个文件 `CarType.java`\
  \ 包含名为 `CarType` 的枚举数据类型的声明。当它被编译时，将生成一个名为 `CarType.class` 的字节码文件。\n\n```\n 1 /**\n\
  \ 2    CarType 枚举数据类型\n 3 */\n 4\n 5 enum CarType { PORSCHE, FERRARI, JAGUAR }\n\
  ```\n\n# 代码列表 8-19 `(CarType.java)`\n\n再查看代码列表 8-20。这个文件 `CarColor.java` 包含名为 `CarColor`\
  \ 的枚举数据类型的声明。当它被编译时，将生成一个名为 `CarType.class` 的字节码文件。\n\n```\n 1 /**\n 2    CarType\
  \ 枚举数据类型\n 3 */\n 4\n 5 enum CarColor { RED, BLACK, SILVER }\n```\n\n# 代码列表 8-20\
  \ `(CarColor.java)`\n\n代码列表 8-21 显示了 `SportsCar` 类，它使用了这些枚举类型。\n\n```java\n 1 /**\n\
  \ 2    SportsCar 类\n 3 */\n 4\n 5 public class SportsCar\n 6 {\n 7    private CarType\
  \ make;    //  own\n 8    private CarColor color;  // 颜色\n 9    private double price;\
  \    // 价格\n10\n 11    /**\n 12       构造函数初始化汽车的类型、\n13       颜色和价格。\n 14      \
  \ @param aMake 汽车的类型\n 15       @param aColor 汽车的颜色\n 16       @param aPrice 汽车的价格\n\
  \ 17    */\n 18    public SportsCar(CarType aMake, CarColor aColor, double aPrice)\n\
  19    {\n20       make = aMake;\n21       color = aColor;\n22       price = aPrice;\n\
  23    }\n24\n 25    /**\n 26       getMake 方法\n 27       @return 汽车的类型\n 28    */\n\
  29\n30    public CarType getMake()\n31    {\n32       return make;\n33    }\n34\n\
  \ 35    /**\n 36       getColor 方法\n37       @return 汽车的颜色\n38    */\n39\n40   \
  \ public CarColor getColor()\n41    {\n42       return color;\n43    }\n44\n 45\
  \    /**\n 46       getPrice 方法\n 47       @return 汽车的价格\n48    */\n49\n50    public\
  \ double getPrice()\n52    {\n53       return price;\n54    }\n55\n 56    /**\n\
  \ 57       toString 方法\n 58       @return 一个表示汽车类型、\n59               颜色和价格的字符串。\n\
  60    */\n61\n62    public String toString()\n63    {\n64       // 创建一个表示对象的字符串。\n\
  65       String str = String.format(\"Make: %s\\nColor: %s\\nPrice: $%,.2f\",\n\
  66   make, color, price);\n67\n 68       // 返回该字符串。\n69       return str;\n70  \
  \  }\n71 }\n```\n\n# 代码列表 8-21 `(SportsCar.java)`\n\n```java\n 1 /**\n 2    此程序演示了\
  \ SportsCar 类。\n 3 */\n 4\n 5 public class SportsCarDemo\n 6 {\n 7    public static\
  \ void main(String[] args)\n 8    {\n 9       // 创建 SportsCar 对象。\n10       SportsCar\
  \ yourNewCar = new SportsCar(CarType.PORSCHE,\n11                              \
  \          CarColor.RED, 100000);\n12\n 13       // 显示对象的值。\n14       System.out.println(yourNewCar);\n\
  15    }\n16 }\n```\n\n# 代码列表 8-22 `(SportsCarDemo.java)`\n\n\n\n\n\nJava 允许你使用 `switch`\
  \ 语句来测试 `enum` 常量。例如，查看代码列表 8-23 中的程序。它创建了一个 `SportsCar` 对象，然后使用 `switch` 语句测试该对象的\
  \ `make` 字段。\n\n```java\n 1 /**\n  2    This program shows that you can switch on\
  \ an\n  3    enumerated type.\n  4 */\n  5\n  6 public class SportsCarDemo2\n  7\
  \ {\n  8    public static void main(String[] args)\n  9    {\n  10       // Create\
  \ a SportsCar object.\n  11       SportsCar yourNewCar = new SportsCar(CarType.PORSCHE,\n\
    12                                     CarColor.RED, 100000);\n  13\n  14    \
  \   // Get the car make and switch on it.\n  15       switch (yourNewCar.getMake())\n\
    16       {\n  17          case PORSCHE :\n  18             System.out.println(\"\
  Your car was made in Germany.\");\n  19             break;\n  20          case FERRARI\
  \ :\n  21             System.out.println(\"Your car was made in Italy.\");\n  22\
  \             break;\n  23          case JAGUAR :\n  24             System.out.println(\"\
  Your car was made in England.\");\n  25             break;\n  26          default:\n\
    27             System.out.println(\"I'm not sure where that car \"\n  28     \
  \                             + \"was made.\");\n  29      }\n  30    }\n  31 }\n\
  ```\n\n程序输出\n\n```\nYour car was made in Germany.\n```\n\n## 代码列表 8-23 (SportsCarDemo2.java)\n\
  \n在第 15 行，`switch` 语句测试了从 `yourNewCar.getMake()` 方法返回的值。该方法返回一个 `CarType` 枚举常量。根据方法返回的值，程序跳转到相应的\
  \ `case` 语句。注意在 `case` 语句中，枚举常量不是完全限定的。也就是说，我们必须写 `PORSCHE`、`FERRARI` 和 `JAGUAR`，而不是\
  \ `CarType.PORSCHE`、`CarType.FERRARI` 和 `CarType.JAGUAR`。如果你将一个完全限定的 `enum` 常量名作为\
  \ `case` 表达式，会导致编译错误。\n\n### 提示\n\n注意代码列表 8-23 中的 `switch` 语句包含一个 `default` 部分，尽管它已经为\
  \ `CarType` 类型中的每个 `enum` 常量提供了 `case` 语句。这会在 `CarType` 文件中添加更多 `enum` 常量时处理这种情况。这种规划是“防御性编程”的一个示例。\n\
