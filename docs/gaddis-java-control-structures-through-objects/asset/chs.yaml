  \ 时，将自动选择 `File` 菜单。同样注意我们在第二个语句中传递给 `MenuItem` 类构造函数的字符串。下划线字符紧出现在字母 ‘x’ 之前。这将导致字母\
  \ X 成为助记符。当用户在键盘上按下 `Alt+X` 时，将选择 `Exit` 菜单项。\n\n下划线字符在运行时不会显示在菜单项名称中。然而，当用户按下键盘上的\
  \ `Alt` 键时，助记符字符将带有下划线，如图 13-33 所示。\n\n![当用户按下 Alt 键加上键盘上的 F 键助记符时，File 菜单中的字母 F\
