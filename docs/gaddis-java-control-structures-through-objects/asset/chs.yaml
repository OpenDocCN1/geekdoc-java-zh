  \n### 注意\n\n`String` 类的 `length` 方法返回字符串中的字符数，包括空格。\n\n你将在第 9 章中详细学习 `String` 类方法，但现在我们再来看几个例子。除了\
  \ `length` 之外，表 2-15 还描述了 `charAt`、`toLowerCase` 和 `toUpperCase` 方法。\n\n# 表 2-15\
