  \ 匿名内部类\n\n概念：内部类是定义在另一个类内部的类。匿名内部类是没有名字的内部类。匿名内部类必须实现一个接口，或者扩展另一个类。\n\n有时你需要一个简单的类，并且在你的代码中只实例化一次。在这种情况下，你可以使用*匿名内部**类*。匿名内部类是一个没有名字的类。因为它定义在另一个类内部，所以它被称为内部类。你使用\
  \ `new` 运算符同时定义一个匿名内部类并创建它的实例。以下是实例化和定义匿名内部类的通用语法：\n\n```java\nnew ClassOrInterfaceName()\
  \ {\n    (匿名类的字段和方法……）\n}\n```\n\n`new` 运算符后面紧跟一个已存在类或接口的名称，然后是一对括号。接下来，你用大括号包围类体。该表达式创建了一个对象，该对象是扩展了指定的父类或实现了指定的接口类的实例。返回对象的引用。（注意在表达式中你*不需要*使用\
  \ `extends` 或 `implements` 关键字。）\n\n在看示例之前，你必须理解一些要求和限制：\n\n*   匿名内部类必须实现一个接口，或者扩展另一个类。\n\
  \n*   如果匿名内部类扩展了一个父类，则在创建对象时会调用父类的无参构造函数。\n\n\n\n\n\n- 匿名内部类必须重写它所实现的接口或它所继承的父类中指定的所有抽象方法。\n\
  - 因为匿名内部类的定义写在方法内部，因此它可以访问该方法的局部变量，但前提是这些变量被声明为 `final`，或者它们是“有效 `final`”（effectively\
  \ `final`）。（有效 `final` 变量是指值从未被改变过的变量）。如果匿名内部类尝试使用不是 `final` 或不是有效 `final` 的变量，将导致编译错误。\n\
  \n让我们来看一个实现接口的匿名内部类示例。假设我们有如代码列表 10-42 所示的接口。\n\n```\n1  interface IntCalculator\n\
   2  {\n 3     int calculate(int number);\n 4  }\n```\n\n### 代码列表 10-42 `(IntCalculator.java)`\n\
  \n该接口的名称为 `IntCalculator`，它指定了一个名为 `calculate` 的方法。`calculate` 方法接受一个 `int` 参数，并返回一个\
  \ `int` 值。假设我们定义定义实现 `IntCalculator` 接口的类，并重写 `calculate` 方法，使其返回传递给它的参数的平方。下面的代码展示了这一点：\n\
  \n```\nIntCalculator square = new IntCalculator() {\n    public int calculate(int\
  \ number)\n    {\n        return number * number;\n    }};\n```\n\n代码片段的第一行声明了一个名为\
  \ `square` 的变量，它是一个 `IntCalculator` 引用变量（这意味着它可以引用任何实现 `IntCalculator` 的对象）。在 =\
  \ 符号的右侧，表达式 `new IntCalculator()` 创建了一个实现 `IntCalculator` 接口的匿名类实例。匿名类的体紧随其后，包含在花括号内。在类体内，重写了\
  \ `calculate` 方法。由于这是一个完整的语句，它以分号结束。图 10-20 插说明了该语句的不同部分，而代码列表 10-43 显示了一个使用它的完整程序。\n\
