  \n# 1.5 程序是由什么组成的？\n\n概念: 有某些元素是所有编程语言共有的。\n\n## 语言元素\n\n所有的语言都有共同点。表 1-2 列出了几乎每种语言中常见的元素。\n\
  \n| 语言元素 | 描述 |\n| --- | --- |\n| 关键字 | 这些是在编程语言中具有特殊含义的单词。只能按预期使用。关键字也被称为保留字。 |\n\
  | 运算符 | 运算符是对一个或多个操作数执行操作的符号或单词。操作数通常是数据。 |\n| 标点 | 大多数编程语言都需要标点符号。这些字符有特定的用途，如标记语句的开始或结束，或分隔列表项。\
  \ |\n| 程序员定义的名称 | 与关键字是由程序员定义的单词或名称。它们用于标识内存中的存储位置以及程序员创建的部分。程序员定义的名称通常被称为标识符。 |\n\
  | 语法 | 这些是编写程序时必须遵循的规则。语法规定了如何使用关键字和运算符，以及标点符号出现在哪里。 |\n\n让我们看一个 Java 程序示例，并识别出每个元素的实例。代码列表\
