  \n## 12.2 JavaFX 简介\n\n概念：在 Java 中，你可以使用 `JavaFX` 库创建 GUI 和图形应用程序。JavaFX 是面向 Java\
  \ 开发者的下一代 GUI 工具包。\n\n# 观看 JavaFX 简介\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/9OGgY3XZJCZui7Kk85hfz61OLbtTjm6Y`](https://mediaplayer.pearsoncmg.com/assets/_video.true/9OGgY3XZJCZui7Kk85hfz61OLbtTjm6Y)\n\
  \n在本章中，我们将使用 `JavaFX` 创建 GUI 应用程序。`JavaFX` 是用于开发采用图形应用程序的标准 Java 库。你可以用它创建运行在本地计算机上的独立图形应用程序、从远程服务器运行的应用程序或嵌入网页的应用程序。本章将向你介绍\
  \ JavaFX 作为创建独立 GUI 应用程序的工具。\n\n### 控件\n\n\n\n\n\n程序图形用户界面（GUI）中可见的物体通常称为 `controls`（控件）。图\
  \ 12-5 所示的 GUI 包含两个 `Label` 控件、两个 `TextField` 控件和一个 `Button` 控件。以下是这些类型控件的摘要：\n\n\
  | `Label` 控件 | `Label` 控件显示文本。图 12-5 所示窗口包含两个 `Label` 控件。其中一个 `Label` 控件显示文本 `Number\
  \ of Hours Worked`（工作时长），另一个 `Label` 控件显示文本 `Hourly Pay Rate`（时薪率）。 |\n\n| `TextField`\
  \ 控件 | `TextField` 控件表现为一个矩形区域，可以接受用户的键盘输入。图 12-5 所示窗口有两个 `TextField` 控件：一个用于用户输入工作时长，另一个用于用户输入时薪率。\
  \ |\n\n| `Button` 控件 | `Button` 是一个矩形控件，表现为一个表面带有标题文字的按钮。当用户点击 `Button` 控件（无论是通过鼠标点击还是在触摸屏上触摸）时，会发生相应的动作。图\
  \ 12-5 所示的窗口有一个 `Button` 控件，显示标题 `Calculate Gross Pay`（计算总工资）。当用户点击此按钮时，程序会计算并显示总工资。\
  \ |\n\n## 图 12-5 GUI 中的控件 (Oracle 公司法务顾问)\n\n![名为工资计算器的 G U I 中的控件已定义。](img/12fig05.png)图\
  \ 12-5 完整替代文本\n\n`Label`、`TextField` 和 `Button` 只是你将学习使用的控件之一。在学习本章时，你将创建包含许多不同类型控件的应用程序。\n\
  \n## 阶段与场景\n\n使用 JavaFX 编程时，你使用剧院比喻来描述 GUI 的元素。想象你正坐在剧院里看戏。有一个舞台（stage），舞台上正在表演一个场景（scene）。\n\
  \nJavaFX 应用程序也有舞台和场景。舞台是一个窗口，而场景是包含在窗口内的 GUI 对象（`Label`、`TextField`、`Button` 以及其他控件）的集合。你可以将\
  \ GUI 对象想象成构成场景的演员。\n\n在内存中，场景中的 GUI 对象被组织为 `scene graph`（场景图）中的节点，这是一种树状的层次结构。图\
  \ 12-6 展示了一个示例。\n\n![在被称为场景图的树状层次结构中的节点，底层有两个叶节点（Leaf Nodes），它们通过分支节点（Branch Node）连接到中间层的两个叶节点，然后连接到顶层的根节点（Root\
  \ Node）。](img/12fig06.png)\n\n## 图 12-6 场景中的节点\n\n场景图可以三种类型的节点：\n\n* `Root Node`（根节点）：只有一个根节点，它是场景中所有其他节点的父。\n\
  * `Branch Node`（分支节点）：分支节点可以与其他节点作为子节点。\n* `Leaf Node`（叶节点）：叶节点不能有子节点。\n\n简而言之，根节点和分支节点可以有子节点，但叶节点不能。叶节点通常是用户交互的控件，如\
  \ `Label`、`TextField` 和 `Button`。分支节点是其他节点容器的对象。\n\n### Application 类\n\nJavaFX\
  \ 库有一个名为 `Application` 的抽象类，它是 GUI 的基础。所有的 JavaFX 应用程序必须继承 `Application` 类。\n\n\
  `Application` 类有一个名为 `start` 的抽象方法，它是应用程序的入口。由于 `start` 方法是抽象的，你必须重写它。让我们来看一个示例。代码列表\
  \ 12-1 中的程序是一个简单的 JavaFX 应用程序，显示一个空窗口，如图 12-7 所示。程序创建了舞台，但没有创建场景。在下面的动画中，按“上一个”或“下一个”按钮逐步执行代码并查看贯穿其中的解释。\n\
  \n## 代码列表 12-1 (MyFirstGUI.java)\n\n[`media.pearsoncm.com/ph/esm/0media_ecs/gadd-java/pr12-1/1.html`](https://media.pearsoncm.com/ph/esm/0media_ecs/gadd-java/pr12-1/1.html)\n\
  \n![名为 My First G U I Application 的空窗口由 My First G U I 程序生成。](img/12fig07.png)\n\
  \n## 图 12-7 由 MyFirstGUI.java 显示的窗口 (Oracle Corporate Counsel)\n\n让我们仔细查看代码列表 12-1\
  \ 中的程序：\n\n* 第 1 行导入 `Application` 类，位于 `javafx.application` 包。\n* 第 2 行导入 `Stage`\
  \ 类，位于 `javafx.stage` 包（你将在 `start` 方法中使用此类）。\n* 第 8 行开始定义 `MyFirstGUI` 类。注意它继承了\
  \ `Application` 类。\n* 第 10 到 14 行是 `main` 方法。`main` 方法只做一件事：调用第 13 行的 `launch` 方法。继承自\
  \ `Application` 类的 `launch` 方法若干操作：\n    * 它创建一个作为应用程序窗口的 `Stage` 对象。\n    * 它将\
  \ `Stage` 对象作为参数调用 `start` 方法。\n* 第 17 到 24 行是 `start` 方法。这是应用程序的入口。如前所述，`start`\
  \ 方法是 `Application` 类中的抽象方法，我们必须重写它。注意该方法有一个参数 `primaryStage`。`primaryStage` 变量引用由\
  \ `launch` 方法创建的 `Stage` 对象\n* 第 20 行调用 `Stage` 对象的 `setTitle` 方法。这设置显示在窗口标题栏的文本。\n\
  * 第 23 行调用 `Stage` 对象的 `show` 方法。这显示了应用程序的窗口。\n\n## 检查点 12.5\n../components/metrodigi/ch12-fill_in_the_blank-02/index.html\n\
