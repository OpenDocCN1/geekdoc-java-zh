  \ 的输出 (Oracle Counsel)\n\n# 旋转节点\n\n`Node` 类提供了一个名为 `setRotate` 的方法，可以绕其中心旋转节点。由于\
  \ `setRotate` 方法位于 `Node` 类中，它可以旋转场景图中的任何节点（包括 `Buttons` 和 `Labels`）。当你调用该方法时，传递一个单位为角度的\
  \ `double` 值。以下代码摘自程序 `RotateBox.java`：\n\n```java\n// Constants for the rectangle\n\
  final double X = 30.0, Y = 40.0;\nfinal double WIDTH = 100.0, HEIGHT = 75.0;\nfinal\
  \ double ANGLE = 45.0;\n\n// Create a rectangle.\nRectangle box = new Rectangle(X,\
  \ Y, HEIGHT);\nbox.setRotate(ANGLE);\n```\n\n这段代码创建一个旋转 45 度的矩形。程序的输出可见图 14-15。\n\
  \n![旋转 45 度的黑色矩形的输出。](img/14fig15.png)\n\n# 图 14-15 `RotateBox.java` 的输出 (Oracle\
  \ Counsel)\n\n如果你旋转一个容器，旋转将应用于容器中的所有子元素。例如，代码列表 14-9 显示了一个旋转的停止标志。在该程序中，第 57 行场景图中的根节点（一个\
  \ `Pane` 对象）被旋转了。结果是场景图中的所有对象都旋转了 30 度。程序的输出可见图 14-16。\n\n\n\n\n当你调用 `setScaleX`\
  \ 和 `setScaleY` 方法时，你会传递一个 `double` 类型作为缩放因子。例如，2.0 将使节点的大小变为原始大小的两倍，而 0.5 将使节点的大小变为原始大小的一半。如果你希望节点保持原始比例，请务必在\
  \ `X` 和 `Y` 维度上使用相同的缩放比例（也就是说，向 `setScaleX` 和 `setScaleY` 方法传递相同的值）。如果你向这些方法传递不同的值，节点将在\
  \ `X` 或 `Y` 维度上显得拉伸。\n\n以下代码片段摘自学生示例程序中的 `ScaleText.java` 程序：\n\n```java\n// 文本的常量\n\
  final double X1  = 30.0, Y1  = 100.0;\nfinal double X2  = 30.0, Y2  = 130.0;\nfinal\
  \ double X3  = 30.0, Y3  = 150.0;\nfinal double FONT_SIZE = 38;\nfinal double SCALE_HALF\
  \ = 0.5;\nfinal double SCALE_QTR = 0.25;\n\n// 创建三个 Text 对象。\nText text1 = new Text(X1,\
  \ Y1, \"Hello World\");\ntext1.setFont(new Font(\"SansSerif\", FONT_SIZE));\n\n\
  Text text2 = new Text(X2, Y2, \"Hello World\");\ntext2.setFont(new Font(\"SansSerif\"\
  , FONT_SIZE));\ntext2.setScaleX(SCALE_HALF);\ntext2.setScaleY(SCALE_HALF);\n\nText\
  \ text3 = new Text(X3, Y3, \"Hello World\");\ntext3.setFont(new Font(\"SansSerif\"\
  , FONT_SIZE));\ntext3.setScaleX(SCALE_QTR);\ntext3.setScaleY(SCALE_QTR);\n```\n\n\
  此代码创建了三个 `Text` 对象，每个对象都显示字符串“Hello World”。第一个 `Text` 对象按原始大小显示。第二个缩放为原始大小的一半，第三个缩放为原始大小的四分之一。程序的输出所示图\
  \ 14-17。\n\n# 图 14-17 `ScaleText.java` 的输出（Oracle 法务顾问）\n\n![Scale Text.java 程序的输出以三种尺寸显示文本\
