  \ 类生成随机数\n12. 4.12 需要避免的常见错误\n\n## 4.1 递增和递减运算符\n\n概念：`++` 和 `--` 是对操作数加一或减一的运算符。*递增*一个值意味着将其增加一，而*递减*一个值意味着将其减少一。以下两个语句都会递增变量\
  \ `number`：\n\n```\nnumber = number + 1;\nnumber += 1;\n```\n\n在以下两个语句中，`number`\
  \ 都会递减：\n\n```\nnumber = number - 1;\nnumber -= 1;\n```\n\nJava 提供了一组专门为递增和递减变量设计的一元运算符。递增运算符是\
  \ `++`，递减运算符是 `--`。以下语句使用 `++` 运算符递增 `number`：\n\n```\nnumber++;\n```\n\n接下语句递减\
  \ `number`：\n\n```\nnumber--;\n```\n\n### 注意\n\n表达式 `number++` 的读作是“number plus”，`number--`\
  \ 的读作是“number minus”。代码列表 4-1 展示了 `++` 和 `--` 运算符。在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看解释。\n\
  \n### 代码列表 4-1 (IncrementDecrement.java)\n\n代码列表 4-1 中的语句展示了*后置模式*下使用的递增和递减运算符，这意味着运算符放在变量之后。这些运算符在*前置模式*下同样有效，此时运算符放在变量名之前，如下：\n\
  \n```\n++number;\n--number;\n```\n\n在后置模式和前置模式下，这些运算符都会对其操作数加一或减一。代码列表 4-2 展示了这一点。\n\
  \n### 代码列表 4-2 (Prefix.java)\n\n## 后置模式与前置模式的区别\n\n在代码列表 4-1 和 4-2 中，语句 `number++`\
  \ 和 `++number` 在这些简单的语句中递增变量 `number`。然而，当这些运算符被用于不仅仅是递增或递减的语句时，这种区别就变得很重要。例如，看以下代码：\n\
  \n```\nnumber = 4;\nSystem.out.println(number++);\n```\n\n调用 `println` 方法的语句做了两件事：(1)\
  \ 调用 `println` 显示 `number` 的值，(2) 递增 `number`。但哪个先发生？如果 `number` 先递增，`println` 方法显示的值将与\
  \ `number` 后递增时不同。这取决于运算符的模式。\n\n后置模式导致在表达式使用变量后进行递增。在上述的语句中，`println` 方法将显示 4，然后\
  \ `number` 递增到 5。前置模式则导致先递增。这里有一个示例：\n\n```\nnumber = 4;\nSystem.out.println(++number);\n\
  ```\n\n在这些语句中，`number` 先递增到 5，然后 `println` 显示 `number` 的值（即 5）。另一个示例，看以下代码：\n\n\
  ```\nint x = 1, y;\ny = x++;             // 后置递增\n```\n\n第一个语句声明了变量 `x`（初始化为 1）和变量\
  \ `y`。第二个语句执行以下操作：\n\n* 将 `x` 的值赋值给变量 `y`。\n* 递增变量 `x`。\n\n存储的值取决于递增何时发生。由于 `++`\
  \ 运算符是以后置模式使用的，它在赋值发生后作用。因此，这段代码将在 `y` 中存储 1。代码执行后，`x` 将包含 2。让我们看看相同的代码，但以前置模式使用\
  \ `++` 运算符：\n\n```\nint x = 1, y;\ny = ++x;             // 前置递增\n```\n\n在第二个语句中，`++`\
  \ 运算符是以前置模式使用的，因此它在赋值发生之前作用于变量。因此，这段代码将在 `y` 中存储 2。代码执行后，`x` 也包含 2。\n\n\n\n\n\n\
