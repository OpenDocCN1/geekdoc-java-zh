  \ 18.0 miles per gallon\nHauling capacity: 2.0 tons\n```\n\n注意第一行包含 `import` 语句。`import`\
  \ 单词是 Java 中的一个关键字。`import` 之后的单词是程序意图使用的包名。包名后的 `.*` 意味着导入该包的所有类。此语句告诉编译器使 `vehicles`\
  \ 包中的类类对程序可用。\n\n注意\n\n编译器期望类文件存储在与包名同名的目录中。例如，`Car` 和 `Truck` 类是 `vehicles` 包的一部分，因此它们必须存储在名为\
  \ `vehicles` 的目录中。通常，`vehicles` 目录会存储在另一个作为包基目录的目录之下。图 G-1 展示了 Windows 系统上的示例目录结构。`mypackages`\
  \ 目录是包的基目录。在 `mypackages` 下出现了 `vehicles` 目录，它包含了 `Car.java` 和 `Truck.java` 文件。\n\
  \n如果我们只想让 `Truck` 类可用，可以使用以下 `import` 语句：\n\n```\nimport vehicles.Truck;\n```\n\n\
  在这种情况下，编译器将仅让 `Truck` 类可用。对 `Car` 类的引用将导致错误。同样，我们可以使用以下语句仅让 `Car` 类可用：\n\n```\n\
  import vehicles.Car;\n```\n\n你可能记得，你之前在运行 `DecimalFormat` 类的程序中使用过以下 `import` 语句：\n\
  \n\n\n\n\n```java\nimport java.text.DecimalFormat;\n```\n\n这条语句告诉编译器使用 `DecimalFormat`\
  \ 类，该类属于 `java.text` 包。`java.text` 包是 Java 标准类库的一部分。在运行 `Scanner` 类的程序中，你可能还使用了以下\
  \ `import` 语句：\n\n```java\nimport java.util.Scanner;\n```\n\n这条语句告诉编译器使用 `Scanner`\
  \ 类，该类属于 `java.util` 包。`java.util` 包也是 Java 标准类库的一部分。此时此，总结一下创建和使用包的必要步骤可能会有所帮助：\n\
  \n1.  在每个要作为包一部分的类文件中放置合适的 `package` 语句。`package` 语句必须是文件的第一行，或者仅由注释和/或空行引导。\n2.\
  \  你应该在系统上有一个用于存储包的基目录。在该目录下，创建一个与包名同名的目录。将包的类文件存储在此文件夹中。\n3.  将包基目录的路径添加到 `CLASSPATH`\
  \ 环境变量中。\n4.  在每个意图使用该包的程序中放置合适的 `import` 语句。\n\n# 使用完全限定类名\n\n不需要使用 `import` 语句来访问包中的类。然而，如果没有\
  \ `import` 语句，你必须使用类的完全限定名。`vehicle` 包中 `Car` 和 `Truck` 类的完全限定名分别为 `vehicles.Car`\
