  \ 作者的名。\n 44        @param pub 出版社名。\n 45     */\n 46 \n 47     public void set(String\
  \ textTitle, String auth,\n 48          String pub)\n 49     {\n 50        title\
  \ = textTitle;\n 51        author = auth;\n 52        publisher = pub;\n 53    \
  \ }\n 54 \n 55     /**\n 56        toString 方法\n 57        @return 包含教材\n 58   \
  \     信息的字符串。\n 59     */\n 60 \n 61     public String toString()\n 62     {\n 63\
  \        // 创建一个表示对象的字符串。\n 64        String str = \"Title: \" + title +\n 65  \
  \                  \"\\nAuthor: \" + author +\n 66                    \"\\nPublisher:\
