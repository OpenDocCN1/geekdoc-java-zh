  \n# 8.3 从方法返回对象\n\n概念：方法可以返回一个对象的引用。\n\n# 观看：从方法返回对象\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/59u4muCPqoNCQIJApN7X20Jg_h2cI3JA`](https://mediaplayer.pearsoncmg.com/assets/_video.true/59u4muCPqoNCQIJApN7X20Jg_h2cI3JA)\n\
