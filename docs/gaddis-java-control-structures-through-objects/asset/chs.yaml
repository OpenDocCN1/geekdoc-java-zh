  \ `throws` 子句。你将在第 11 章中学习如何处理异常。\n\n## 编程挑战\n\n## 1. `showChar` 方法\n\n编写一个名为 `showChar`\
  \ 的方法。该方法接受两个参数：一个 `String` 对象的引用和一个整数。整数参数是 `String` 中的字符位置，第一个字符位于位置 0。当方法执行时，它应该显示该位置上的字符。以下是该方法的调用示例：\n\
  \n```\nshowChar(\"New York\", 2);\n```\n\n在此次调用中，方法将显示字符 `w`，因为它位于位置 2。请在一个完整的程序中演示该方法。\n\
  \n## 2. 零售价计算器\n\n### 查看零售价计算器问题\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_05_03_retail_price_problem`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_05_03_retail_price_problem)\n\
  \n编写一个程序，要求用户输入商品的批发价和加成率。然后它应该显示该商品的零售价。例如：\n\n*   如果一件商品的批发价为 5.00，加成率为 100%，则该商品的零售价为\
  \ 10.00。\n*   如果一件商品的批发价为 5.00，加成率为 50%，则该商品的零售价为 7.50。\n\n该程序应该有一个名为 `calculateRetail`\
  \ 的方法，该方法接收批发价和加成率作为参数，并返回该物品的零售价。\n\n## 3. 矩形面积——完善程序\n\n如果你已经[下载](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)了书源代码，你将在本章源代码文件夹中找到一个名为\
