  \n## 2.10 作用域\n\n概念：变量的作用域是程序中可以访问的部分。每个变量都有作用域。变量的作用域是程序中可以访问它的部分。到目前为止，你只看到了在\
  \ `main` 方法内部声明的变量。在后续的章节中我们将重新讨论这个主题。在方法内部声明的变量被称为*局部变量*。变量的作用域从声明处开始，到方法结束处结束。代码列表\
  \ 2-23 展示了一个示例。在下方的动画中，点击“上一个”或“下一个”按钮可以逐步查看代码并查看贯穿始终的解释。\n\n### 代码列表 2-23 `(Scope.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-23/23.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-23/23.html)\n\
  \n该程序无法编译，因为它在变量声明之前尝试将 `value` 的内容发送给 `println`。请记住，编译器是从上到下读取程序的。要修复程序，必须在使用它的语句之前编写变量声明。\n\
  \n### 注意\n\n如果你编译此程序，编译器将显示“无法解析符号”之类的错误信息。这意味着编译器遇到了一个无法确定含义的名称。关于局部变量必须记住的另一个规则是：同一个作用域内不能有两个同名的局部变量。例如，看下面的方法：\n\
  \n```\npublic static void main(String[] args)\n{\n   // 声明一个名为 number 的变量\n   //\
  \ 显示它的值。\n   int number = 7;\n   System.out.println(number);\n   // 声明另一个名为 number\
  \ 的变量\n   // 显示它的值。\n   int number = 100;                // 错误！！！\n   System.out.println(number);\
  \      // 错误！！！\n}\n```\n\n该方法声明了一个名为 `number` 的变量并将其初始化为 7。变量的作用域从声明语句开始，延伸到方法结束。变量的作用域内出现了一个声明另一个\
  \ `number` 的语句。该语句会导致错误，因为在同一个作用域内不能有两个同名的局部变量。\n\n# 检查点 2.52\n\n../components/metrodigi/ch02-inline_self_quiz_v1.0.0-24/index.html\n\
  \n## 2.11 注释\n\n概念：注释是用于记录程序行或部分的说明性文字。注释是程序的一部分，但编译器会忽略它们。它们是为可能阅读源代码的人准备的。\n\n\
  注释是位于程序不同部分的简短说明，解释这些程序部分的工作原理。注释不是为编译器设计的。它们是为了供程序员阅读，帮助他们理解代码。编译器会跳过程序中出现的所有注释。\n\
  \n\n\n\n作为一名初级程序员，你可能会抵制在程序中编写大量注释的想法。毕竟，编写能够实现实际功能的代码要有趣得多！然而，花额外的时间编写注释是至关重要的。当你以后需要修改或调试程序时，这些注释几乎肯定会为你节省时间。即使是大型且复杂的程序，如果注释得当，也可以变得易于阅读和理解。\n\
  \n在 Java 中有三种类型的注释：单行注释、多行注释和文档注释。让我们简要讨论每种类型。\n\n### 单行注释\n\n你已经见过在 Java 程序中编写注释的第一种方法。你只需要在想要开始写注释的地方放置两个正斜杠\
  \ `//`。编译器会忽略从该点开始到行尾的所有内容。代码列表 2-24 显示，注释可以自由地分布在整个程序中。\n\n```\n 1  // PROGRAM:\
  \ Comment1.java\n  2  // Written by Herbert Dorfmann\n  3  // This program calculates\
  \ company payroll\n  4\n  5  public class Comment1\n  6  {\n  7     public static\
  \ void main(String[] args)\n  8     {\n  9        double payRate;       // Holds\
  \ the hourly pay rate\n 10        double hours;         // Holds the hours worked\n\
   11        int employeeNumber;   // Holds the employee number\n 12\n 13        //\
  \ The Remainder of This Program is Omitted.\n  14     }\n  15  }\n```\n\n### 代码列表\
  \ 2-24 `(Comment1.java)`\n\n### 注释的作用\n说明说明是谁编写了程序以及描述变量的作用，注释还可以解释代码中复杂的步骤。\n\n\
  ### 多行注释\n\nJava 中的第二种注释是多行注释。`多行注释`以 `/*`（正斜杠后跟星号）开始，以 `*/`（星号后跟正斜杠）结束。这两个标记之间的所有内容都会被忽略。代码列表\
  \ 2-25 说明了如何使用多行注释。\n\n```\n 1  /*\n  2     PROGRAM: Comment2.java\n  3     Written\
  \ by Herbert Dorfmann\n  4     This program calculates company payroll\n  5  */\n\
    6\n  7  public class Comment2\n  8  {\n  9     public static void main(String[]\
  \ args)\n 10     {\n 11        double payRate;        // Holds the hourly pay rate\n\
   12        double hours;          // Holds the hours worked\n 13        int employeeNumber;\
  \    // Holds the employee number\n 14\n  5        // The Remainder of This Program\
  \ is Omitted.\n 16     }\n 17  }\n```\n\n### 代码列表 2-25 `(Comment2.java)`\n\n与以 `//`\
  \ 开头的注释不同，多行注释可以跨越几行。这使得编写大块注释更加方便，因为你不需要标记每一行。因此，多行注释在编写单行注释时并不方便，因为你必须同时输入起始符号和结束注释符号。\n\
  \n在使用多行注释时，请记住以下建议：\n\n-   注意不要将起始符号与结束符号写反。\n-   务必不要忘记结束符号。\n\n许多程序员使用星号或其他字符在注释周围绘制边界或方框。这有助于在视觉上将注释与周围的代码隔离开。这些被称为块注释。表\
  \ 2-16 显示了块注释的四个示例。\n\n### 表格 2-16 块注释\n\n```\n/*\n  *   This program demonstrates\
  \ the\n  *   way to write comments.\n  */\n```\n\n```\n//***********************************\n\
   //    This program demonstrates the *\n //    way to write comments.        *\n\
   //***********************************\n```\n\n```\n////////////////////////////////////\n\
   //   This program demonstrates the\n //   way to write comments.\n ////////////////////////////////////\n\
  ```\n\n```\n//-----------------------------------\n //    This program demonstrates\
  \ the\n //    way to write comments.\n //-----------------------------------\n```\n\
  \n## 文档注释\n\n第三种注释被称为文档注释。`文档注释`可以被一个名为 `javadoc` 的程序读取和处理，该程序随 JDK 一起提供。`javadoc`程序的目的是读取\
  \ Java 源代码文件并生成格式良好的 HTML 文件，对源代码进行文档。如果源代码包含任何文档注释，可以在 Web 浏览器中查看 HTML 文档。任何以 `/**`\
  \ 开始并以 `*/` 结束的注释都是文档注释。通常你会在类头之前写一个文档注释，简要描述类。你会在每个方法之前写一个文档注释，简要描述该方法。代码列表 2-26\
  \ 显示了一个带有文档注释的程序。\n\n```\n/**\nThis class creates a program that calculates payroll.\n\
  \ */\npublic class Comment3\n{\n    /**\n    The main method is the program's starting\
  \ point.\n    */\n    public static void main(String[] args)\n    {\n        double\
  \ payRate;       // Holds the hourly pay rate\n        double hours;         //\
  \ Holds the hours worked\n        int employeeNumber;   // Holds the employee number\n\
  \    }\n}\n```\n\n### 代码列表 2-26 `(Comment3.java)`\n\n### 使用 javadoc\n你在操作系统提示符中运行\
  \ `javadoc` 程序。这里是 `javadoc` 命令的通用格式：\n\n```\njavadoc SourceFile.java\n```\n\n`SourceFile.java`\
  \ 是 Java 源文件的文件。javadoc 会读取该文件并生成文档。例如，以下命令将为 `Comment3.java` 源代码生成文档：\n\n```\n\
  javadoc Comment3.java\n```\n\n在该命令执行后，会在源代码文件相同的目录中创建几个文档文件。其中一个文件命名为 *index.html*。图\
  \ 2-10 显示了在 Web 浏览器中查看 *index.html* 文件。注意在文档注释中的文本出现在文件中。\n\n![A documentation that\
  \ has been generated by java doc.](img/02fig10.png)\n\n### 图 2-10 由 `javadoc` 生成的文档\
  \ (Google Inc.)\n\n### 提示\n当你为方法编写文档注释时，javadoc 生成的 HTML 文档将该方法有两个部分：摘要部分和细节部分。方法文档注释的第一句话被用作方法的摘要。注意\
  \ `javadoc` 将句子的结束识别为句号后跟空格字符。因此，当方法描述包含多个句子时，你应该始终以句号后跟空格字符来结束第一句。方法的细节部分将包含文档注释中的所有描述内容。\n\
  \n\n\n从书的这里开始，我们将在示例源代码中使用文档注释。随着各个主题的不断学习，你将看到文档注释以及 `javadoc` 程序的更多用法。\n\n# 检查点\
