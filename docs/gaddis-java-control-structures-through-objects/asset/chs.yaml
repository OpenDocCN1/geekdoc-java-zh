  BorderPane borderPane = new BorderPane();\n```\n\n# 12.10 `ObservableList` 接口\n\n\
  概念**：JavaFX 库中的许多容器都实现了 `ObservableList` 接口。学习该接口中的某些方法很有帮助。\n\n随着对 Java 应用程序开发的深入，你将频繁遇到\
  \ `ObservableList` 接口。实现 `ObservableList` 接口的对象是一种特殊的列表，当列表发生变化时它可以触发事件处理器。虽然 `ObservableList`\
  \ 接口的许多细节超出了本文的范围，但你通常会与存储在 `ObservableList` 中的 JavaFX 容器一起工作。学习基础的 `ObservableList`\
  \ 操作有助于你对所操作的 JavaFX 容器进行更多控制。\n\n表 12-4 列出了一些 `ObservableList` 方法。注意，某些方法继承自 `Collection`\
  \ 接口，`ObservableList` 是该接口的子接口。\n\n\n\n\n\n| `setAll(item...)` | 清空列表的当前内容并添加变长参数列表中指定的所有项。\
  \ |\n| `size()` | 返回列表中的项目数量。（此方法继承自 `Collection` 接口。） |\n\n--- |\n\n例如，布局容器将其子节点保留在\
  \ `ObservableList` 中。所有布局容器都有一个名为 `getChildren()` 的方法，该方法返回其节点的 `ObservableList`。以下代码段展示了如何创建一个空的\
  \ `HBox` 容器，然后使用 `ObservableList` 的 `addAll` 方法将节点加到 `HBox` 中：\n\n```\n// 创建三个 Label\
  \ 控件。\nLabel label1 = new Label(\"This is label1.\");\nLabel label2 = new Label(\"\
  This is label2.\");\nLabel label3 = new Label(\"This is label3.\");\n\n// 创建一个空的\
  \ HBox 容器。\nHBox hbox = new HBox();\n\n// 将 Label 控件添加到 HBox。\nhbox.getChildren().addAll(label1,\
  \ label2, label3);\n```\n\n以下代码显示了如何从 HBox 中移除 `label1`：\n\n```javascript\nhbox.getChildren().remove(label1);\n\
  ```\n\n# 检查点 12.45\n\n../components/metrodigi/ch12-inline_self_quiz_v1.0.0-44/index.html\n\
  \n## 12.11 需要避免的常见错误\n\n*   在你的 JavaFX 应用程序中忘记扩展 `Application` 类。`javafx.application`\
  \ 包中的 `Application` 类必须被所有 JavaFX 应用程序扩展。\n*   在使用 `Image` 类加载图像文件时，忘记指定 `file:`\
  \ 协议。在创建 `Image` 类的实例并向构造函数传递文件名时，请确保包含文件名的同时包含 `file:` 协议。\n*   尝试仅使用 `Image` 类显示图像。`Image`\
  \ 类用于加载图像文件，但你还需要 `ImageView` 类来将图像添加到场景图（scene graph）。\n*   调整图像大小但忘记保持纵比例。如果你在不保持纵比例的情况下调整图像大小，图像可能会垂直或水平拉伸。`ImageView`\
  \ 类有一个名为 `setPreserveRatio` 的方法，你可以调用它来确保图像的纵比例得到保留。\n*   忘记注册事件处理器。即使你写了事件处理器类，除非它已在正确的控件上进行了注册，否则它不会执行。\n\
