  \ 检查点 1.8\n\n../components/metrodigi/ch01-inline_self_quiz_v1.0.0-07/index.html\n\
  \n### 次级存储\n\n次级存储是某种可以长时间保存数据的内存——即使在计算机没有电源的情况下也是如此。常用的程序存储在次级存储中，并根据需要加载到主内存中。重要数据如文字处理文档、工资数据和库存数字也会保存到次级存储中。\n\
  \n最常见的次级存储设备是`磁盘驱动器`（disk drive）。传统的磁盘驱动器通过将数据磁编码到旋转的圆盘上来存储数据。在固态内存中存储数据的`固态硬盘`（Solid\
  \ state drives）正变得越来越流行。固态硬盘没有移动部件，运行速度比传统的磁盘驱动器更快。大多数计算机的机箱内部都带有某种次级存储设备，无论是传统的磁盘驱动器还是固态硬盘。也可以外部驱动器，它们连接到计算机的某个通信端口。外部驱动器可用于创建重要数据的备份副本，或将数据移动到另一台计算机。\n\
  \n除了外部驱动器，还创建了许多用于复制数据将其传输到其他计算机的设备。通用串行总线驱动（Universal Serial Bus drives），或`USB\
  \ 盘`是插入计算机`USB`（通用串行总线）端口的小设备，在系统中显示为磁盘驱动器。然而，这些驱动器实际上并不包含磁盘。它们将数据存储在一种名为`闪存`（flash\
  \ memory）的特殊内存中。USB 盘廉价、可靠，且小到可以装进口袋里。\n\n`CD`（光盘）和`DVD`（数字功能光盘）等光学设备也常用于数据存储。数据不是以磁性记录在光盘上的，而是编码为光盘表面的一系列坑。`CD`和`DVD`驱动器使用激光来检测这些坑，从而读取编码的数据。光盘可以存储大量数据，而且由于可记录`CD`和`DVD`驱动器现在已普及，它们是创建数据备份副本的良好介质。\n\
  \n### 输入设备\n\n输入是计算机从外部世界收集的所有数据。收集数据并发送到计算机的设备称为`输入设备`。常见的输入设备有键盘、鼠标、扫描仪和数字相机。磁盘驱动器、光驱和\
  \ USB 盘也可以被视为输入设备，因为程序和数据是从它们中检索并加载到计算机内存中的。\n\n### 输出设备\n\n输出是计算机发送到外部世界的所有数据。它可能是销售报告、姓名列表或图形图像。数据被发送到输出设备，由设备对其进行格式化并呈现。常见的输出设备有显示器和打印机。磁盘驱动器、USB\
  \ 盘和 CD 录也可以也可以视为输出设备，因为`CPU`会将数据发送给它们进行保存。\n\n## 检查点 1.9\n\n../components/metrodigi/ch01-inline_self_quiz_v1.0.0-08/index.html\n\
  \n## 检查点 1.10\n\n../components/metrodigi/ch01-assessable_table_v1.0.1-02/index.html\n\
  \n### 软件\n\n如前所述，软件是指运行在计算机上的程序。软件通分为大类：操作系统和应用软件。操作系统是一组管理计算机硬件设备并控制其过程的程序。大多数现代操作系统都是多任务的，这意味着它们能够同时运行多个程序。通过称为`时间分片`（time\
  \ sharing）的技术，多任务系统将硬件资源的分配和`CPU`的注意力分配给所有执行中的程序。`UNIX`、`Linux`、`Mac OS`和`Windows`都是多任务操作系统。\n\
  \n应用软件是指使计算机对用户有用的程序。这些程序解决特定问题或执行满足用户需求的通用操作。文字处理、电子表格和数据库软件包都是应用软件的示例。\n\n# 检查点\
