  \n尽管参数变量 `myValue` 在 `changeMe` 方法中被更改，但参数 `number` 并没有被修改。`myValue` 只包含 `number`\
  \ 的副本。\n\n# 将对象传递给方法\n\n到目前，你已经看到了接受基本值作为参数的方法示例。你也可以编写接受对象引用的方法。例如，查看以下方法：\n\n\
  ```\npublic static void showLength(String str)\n{\n  System.out.println(str + \"\
  \ is \" + str.length() + \" characters.\");\n}\n```\n\n该方法接受一个 `String` 引用并显示消息。下面的代码：\n\
  \n```\nString name = \"Warren\";\nshowLength(name);\n```\n\n当此代码执行时，`showLength`\
  \ 方法将显示：\n\n```\nWarren is 6 characters.\n```\n\n`name` 变量持有该对象的引用。当调用 `showLength`\
  \ 方法时，对象的地址被传递给参数 `str`。此时，`name` 和 `str` 引用同一个对象。这可能会让你得出结论：方法可以更改作为参数传递给它的任何 `String`\
  \ 对象。毕竟参数变量引用的是相同的对象。然而，Java 中的 `String` 对象是`不可变的`，这意味着它们不能被更改。例如，查看代码列表 5-7 中的程序。它将一个\
  \ `String` 对象传递给方法，似乎更改了对象。实际上，对象并没有改变。\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\
