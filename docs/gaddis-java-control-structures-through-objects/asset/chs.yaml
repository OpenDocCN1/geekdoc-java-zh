  \n# 更改描边颜色 (Stroke Color)\n\n线条和其他形状的默认颜色是黑色。要将形状的颜色更改为不同的值，调用继承自 `Shape` 类的 `setStroke`\
  \ 方法。该方法的通用格式为\n\n```\nsetStroke(color)\n```\n\n其中 `color` 参数是 `Paint` 类的对象。通常，你会传递\
  \ `Color` 类的常量之一作为参数。`Color` 类位于 `javafx.scene.paint` 包中，定义了几个代表标准颜色的静态常量字段。示例包括\
  \ `Color.WHITE`、`Color.RED`、`Color.BLUE`、`Color.BLACK` 等。（还有其他更有趣的颜色的常量，例如 `Color.ALICEBLUE`\
  \ 和 `Color.BLANCHEDALMOND`。字段完整列表请参阅 `Color` 类的 Java API 文档。）\n\n下面的代码段显示了创建一个 `Line`\
  \ 对象并将其描边颜色设置为红色的示例：\n\n```\nLine myLine = new Line(80, 120, 400, 520);\n myLine.setStroke(Color.RED);\n\
  ```\n\n### 提示\n\n要使用 `Color` 类，必须通过以下方式导入：\n\n```\nimport javafx.scene.paint.Color\n\
  ```\n\n# `Circle` 类\n\n`Circle` 类有五个构造函数，已在 表 14-3 中总结。\n\n## 表 14-3 `Circle` 类构造函数\n\
  \n| 构造函数 | 描述 |\n| --- | --- |\n| `Circle()` | 创建一个空圆。调用 `Circle` 类的 `setCenterX`\
  \ 和 `setCenterY` 方法建立圆的中心点，并调用 `setRadius` 方法建立半径。 |\n| `Circle(centerX, centerY)`\
  \ | `centerX` 和 `centerY` 参数是 `doubles`。`centerX` 和 `centerY` 是圆中心点的 `X` 和 `Y` 坐标。\
  \ |\n| `Circle(centerX, centerY, radius)` | `centerX`、`centerY` 和 `radius` 参数均为\
  \ `doubles`。`centerX` 和 `centerY` 是圆中心点的 `X` 和 `Y` 坐标。 |\n| `Circle(radius, fill)`\
  \ | `radius` 参数是 `double`，`fill` 参数是 `Paint` 类的对象。圆位于 (0, 0)。 |\n| `Circle(centerX,\
  \ centerY, radius, fill)` | `centerX`、`centerY` 和 `radius` 参数均为 `doubles`，`fill`\
  \ 参数是 `Paint` 类的对象。 |\n\n第三个构造函数是你最常用的。下面的语句显示了一个示例。它创建了一个中心点在 (200, 200)、半径为 150\
  \ 的圆：\n\n```\nCircle myCircle = new Circle(200, 200, 150);\n```\n\n如果你使用无参构造函数，则必须使用类的\
  \ `setCenterX`、`setCenterY`、`setRadius` 和 `setFill` 方法来建立圆的中心点、半径和填充颜色。这是一个创建一个中心点在\
  \ (75, 100)、半径为 50 且填充为红色的示例：\n\n```\nCircle myCircle = new Circle();\n myCircle.setCenterX(75);\n\
   myCircle.setCenterY(100);\n myCircle.setRadius(50);\n myCircle.setFill(Color.RED);\n\
  ```\n\n如果你希望圆不被填充，请将 `null` 作为参数传递给 `setFill` 方法。然后，调用 `setStroke` 方法更改圆的轮廓颜色。这是一个创建一个无填充颜色黑色轮廓圆的示例：\n\
  \n```\nCircle myCircle = new Circle(75, 100, 50);\n myCircle.setFill(null);\n myCircle.setStroke(Color.BLACK);\n\
  ```\n\n代码列表 14-2 显示了一个使用 `Circle` 类绘制靶心的程序。靶心由四个交替填充黑色和红色的同心圆组成。程序的输出如 图 14-4 所示。\n\
  \n\n\n\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.Pane;\nimport javafx.scene.shape.Circle;\n\
  import javafx.scene.paint.Color;\n\npublic class BullsEye extends Application\n\
  {\n    public static void main(String[] args)\n    {\n        launch(args);\n  \
  \  }\n\n    @Override\n    public void start(Stage primaryStage)\n    {\n      \
  \  // 场景尺寸常量\n        final double SCENE_WIDTH = 640.0;\n        final double SCENE_HEIGHT\
  \ = 480.0;\n\n        // 靶心中心点和半径的常量\n        final double CENTER_X = 320.0;\n \
  \       final double CENTER_Y = 240.0;\n        final double RING1_RADIUS = 240.0;\n\
  \        final double RING2_RADIUS = 150.0;\n        final double RING3_RADIUS =\
  \ 75.0;\n        final double RING4_RADIUS = 25.0;\n\n        // 创建圆\n        Circle\
  \ ring1  = new Circle(CENTER_X, CENTER_Y, RING1_RADIUS, Color.BLACK);\n        Circle\
  \ ring2  = new Circle(CENTER_X, CENTER_Y, RING2_RADIUS, Color.RED);\n        Circle\
  \ ring3  = new Circle(CENTER_X, CENTER_Y, RING3_RADIUS, Color.BLACK);\n        Circle\
  \ ring4  = new Circle(CENTER_X, CENTER_Y, RING4_RADIUS, Color.RED);\n\n        //\
  \ 将圆添加到 Pane 中\n        Pane pane = new Pane(ring1, ring2, ring3);\n\n        //\
  \ 创建场景并显示它\n        Scene scene = new Scene(pane, SCENE_WIDTH, SCENE_HEIGHT);\n\
  \        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n}\n\
  ```\n\n# 代码列表 14-2 (BullsEye.java)\n\n![BullsEye.dot java 程序的输出显示了一个由四个同心圆组成的靶心，这些圆填充了黑红交替的颜色，从最外圆的黑色开始。](img/14fig04.png)\n\
  \n# 图 14-4 BullsEye.java 输出 (Oracle 法务顾问)\n\n让我们仔细观察一下这个程序：\n\n- 第 19 行和 20 行定义了场景宽度和高度的常量。\n\
