  \n## 3.4 `if-else-if` 语句\n\n概念：`if-else-if` 语句测试一系列条件。与一组嵌套的 `if-else` 语句相比，使用 `if-else-if`\
  \ 语句来测试一系列条件通常更简单。\n\n## 查看 `if-else-if` 语句\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_03_03_The_if-else-if_Statement`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_03_03_The_if-else-if_Statement)\n\
  \n尽管代码列表 3-4 是一个简单的示例，但嵌套决策结构的逻辑相当复杂。你也可以使用 `if-else-if` 语句来测试一系列条件。这是 `if-else-if`\
  \ 语句的通用格式：\n\n![`if-else-if` 语句的通用格式](img/03fig11.png)\n\n\n\n\n\n位于 `if-else-if`\
  \ 语句末尾的 `else` 子句是可选的，但在许多情况下，你会用它来捕获错误。例如，代码列表 3-5 将任何大于等于 90 的测试分分配为 `'A'`。如果最高可能的测试分为\
  \ 100 呢？我们可以像代码列表 3-6 所示所示修改代码，使末尾的 `else` 子句捕获任何大于 100 的值并显示错误信息。图 3-13 显示了当用户输入大于\
  \ 100 的测试分时发生的情况。\n\n## 图 3-13 与 `NestedDecision` 程序的交互 (Oracle 法务顾问)\n\n![展示了 Nested\
  \ Decision 程序的两次交互，以输入和消息对话框的形式。](img/03fig13.png)图 3-13 完整替代文本\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看全程解释。\n\
