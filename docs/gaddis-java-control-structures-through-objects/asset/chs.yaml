  \n```java\nRectangle myRectangle = new Rectangle(200, 100, 75, 150);\nmyRectangle.setFill(null);\n\
  myRectangle.setStroke(Color.BLACK);\n```\n\n代码列表 14-3 演示了如何使用 `Rectangle` 类来创建棋盘图案。程序创建了八个相同大小矩形，填充为默认黑色。矩形在白色背景上以棋盘模式显示。程序的输出所示在图\
