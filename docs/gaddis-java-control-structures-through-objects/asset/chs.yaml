  \n# 处理事件\n\n*事件*（event）是程序运行期间发生的动作。例如，用户每点击一次 `Button` 控件时，就会发生一次事件。当事件发生时，负责该事件的控件会创建一个包含事件信息的*事件对象*（event\
  \ object）。创建该事件对象的 GUI 控件被称为*事件源*（event source）。\n\n事件对象是 `Event` 类（来自 `javafx.event`\
  \ 包）或其任一子类的实例。当 `Button` 控件被点击时，会创建一个作为 `ActionEvent` 类实例的事件对象。`ActionEvent` 是 `Event`\
  \ 类的子类，它也位于 `javafx.event` 包中。\n\n但是事件对象一旦由事件源生成，会发生什么呢？事件源可能连接到一个或多个事件处理器（event\
  \ handlers）。*事件处理器*（event handler）是一个响应事件的实例。如果事件源连接到事件处理器，则会调用事件处理器中的特定方法，并将事件对象作为参数传递给该方法。这个过程有时被称为*事件触发*（event\
  \ firing）。\n\n# 编写事件处理器\n\n当你编写 GUI 应用程序时，编写应用程序所需要的事件处理器类是你的责任范范围。当你编写一个事件处理器类时，它必须实现\
  \ `EventHandler` 接口，该接口位于 `javafx.event` 包。`EventHandler` 接口指定了一个名为 `handle` 的 `void`\
  \ 方法。`handle` 方法必须有一个 `Event` 类或其任一子类的参数。\n\n例如，假设我们想写一个可以响应 `Button` 点击的事件处理器类。记住，当\
  \ `Button` 控件被点击时，生成的事件对象是 `ActionEvent` 类型。以下是处理 `ActionEvent` 类型事件的事件处理器类的一般格式：\n\
  \n```java\n class ButtonClickHandler implements EventHandler<ActionEvent>\n{\n \
  \  @Override\n   public void handle(ActionEvent event)\n   {\n      // Write event\
  \ handling code here.\n   }\n}\n```\n\n注意类声明的第一行以 `implements EventHandler<ActionEvent>`\
  \ 子句结尾。这指定该类实现了 `EventHandler` 接口，并且它将处理的事件对象类型为 `ActionEvent`。接下来，注意 `handle` 方法有一个名为\
  \ `event` 的 `ActionEvent` 参数。当 `handle` 方法被调用时，一个 `ActionEvent` 对象将作为参数传递给它。任何你想作为\
  \ `Button` 点击结果执行的代码都必须写在 `handle` 方法中。\n\n一旦你写好了事件处理器类，你就可以创建该类的对象，并将事件处理器对象与控件连接。当\
  \ `Button` 控件被点击时，它会生成一个 `ActionEvent` 对象，并自动执行它所连接的事件处理器对象的 `handle` 方法，将 `ActionEvent`\
  \ 对象作为参数传递。这如图 12-30 所示。\n\n# 图 12-30 触发 `ActionEvent` 的 `Button` 控件\n\n![当点击标题为\
  \ Click Me 的 Button 控件时，它会触发一个 Action Event，生成一个 Action Event 对象，该对象会自动执行事件处理器的\
  \ handle 方法，并将 Action Event 对象作为参数。](img/12fig30.png)\n图 12-30 完整替代文本\n\n# 注册事件处理器\n\
  \n一旦你写好了事件处理器类，你就可以创建该类的对象，并将对象连接到控件。将事件处理器对象连接到控件的过程被称为*注册*（registering）事件处理器。`Button`\
  \ 控件有一个名为 `setOnAction` 方法，用于注册事件处理器。你只需调用 `Button` 的 `setOnAction` 方法，并将事件处理器对象的引用作为参数传递。这将\
  \ `Button` 控件连接到事件处理器对象。\n\n例如，假设我们创建一个名为 `myButton` 的 `Button` 控件，并且写了一个名为 `ButtonClickHandler`\
  \ 的事件处理器类。以下代码将 `ButtonClickHandler` 类的对象注册到 `Button` 控件：\n\n```java\nmyButton.setOnAction(new\
  \ ButtonClickHandler());\n```\n\n现在，当用户点击 `Button` 控件时，`ButtonClickHandler`对象的 `handle`\
  \ 方法将被自动执行。\n\n编写事件监听类的常用技术是将其写为创建 GUI 的类内部的私有内部类。代码列表 12-11 显示了一个示例。程序的输出结果如图 12-31\
  \ 所示。\n\n# 代码列表 12-11 EventDemo.java\n\n# 图 12-31 EventDemo 应用程序\n\n![Event 应用程序包含两个\
  \ Demo。](img/12fig31.png)\n\n\n\n\n\n*   第 66 行的语句调用 `myLabel` 对象的 `setText` 方法来更改\
  \ `Label` 显示的文本。\n\n# Checkpoint 12.31\n\n../components/metrodigi/ch12-inline_self_quiz_v1.0.0-30/index.html\n\
