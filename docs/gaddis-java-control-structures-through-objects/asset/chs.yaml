  \ 字段。 |\n| `getSymbol` | 此方法返回 `symbol` 字段中的值。 |\n| `getSharePrice` | 此方法返回 `sharePrice`\
  \ 字段中的值。 |\n| `toString` | 此方法返回一个表示对象状态的字符串。该字符串适用于显示在屏幕上。 |\n\n代码列表 8-8 显示了 `Stock`\
