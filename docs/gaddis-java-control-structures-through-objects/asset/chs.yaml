  \n# `regionMatches` 方法\n\n`String` 类提供了 `regionMatches` 方法的重载版本，该方法用于判断两个字符串的指定区域是否匹配。代码演示了：\n\
  \n```\nString str = \"Four score and seven years ago\";\nString str2 = \"Those seven\
  \ years passed quickly\";\nif (str.regionMatches(15, str2, 6, 11))\n   System.out.println(\"\
  The regions match.\");\nelse\n   System.out.println(\"The regions do not match.\"\
  );\n```\n\n这段代码将显示“The regions match.”。`str` 字符串的指定区域从位置 15 开始，`str2` 字符串的指定区域从位置\
  \ 6 开始。两个区域都包含 11 个字符。`str` 字符串中的指定区域是“seven years”，`str2` 字符串中的指定区域也是“seven years”。因为两个区域匹配，此代码中的\
  \ `regionMatches` 方法返回 `true`。此版本的 `regionMatches` 方法执行的是区分大小的比较。另一个重载版本接受一个额外的参数，指示是否执行不区分大小的比较。以下代码演示了：\n\
  \n```\nString str = \"Four score and seven years ago\";\nString str2 = \"THOSE SEVEN\
  \ YEARS PASSED QUICKLY\";\nif (str.regionMatches(true, 15, str2, 6, 11))\n   System.out.println(\"\
  The regions match.\");\nelse\n   System.out.println(\"The regions do not match.\"\
  );\n```\n\n这段代码也将显示“The regions match.”。传递给此版本 `regionMatches` 方法的第一个参数可以是 `true`\
  \ 或 `false`，表示是否执行不区分大小的比较。在本例中，传递了 `true`，因此在比较区域“seven years”和“SEVEN YEARS”时会忽略大小写。\n\
  \n这些方法中的每一个都通过 `boolean` 返回值指示子字符串是否出现在字符串中。`String` 类还提供了某些方法，不仅可以在字符串内搜索项目，还可以报告这些项目的位置。表\
  \ 9-4 描述了 `indexOf` 和 `lastIndexOf` 方法的重载版本。\n\n# 表 9-4 获取字符或子字符串位置的 `String` 方法\n\
  \n| 方法 | 描述 |\n| --- | --- |\n| `int indexOf(char ch)` | 在调用的 `String` 对象中搜索传递给\
  \ `ch` 的字符。如果找到该字符，则返回其第一次出现的位置。否则，返回 -1。 |\n| `int indexOf(char ch, int start)`\
  \ | 在调用的 `String` 对象中搜索传递给 `ch` 的字符，从传递给 `start` 的位置开始到字符串末尾。如果找到该字符，则返回其第一次出现的位置。否则，返回\
  \ -1。 |\n| `int indexOf(String str)` | 在调用的 `String` 对象中搜索传递给 `str` 的字符串。如果找到该字符串，则返回其第一次出现起始的位置。否则，返回\
  \ -1。 |\n| `int indexOf(String str, int start)` | 在调用的 `String` 对象中搜索传递给 `str` 的字符串。搜索从传递给\
  \ `start` 的位置开始到字符串末尾。如果找到该字符串，则返回其第一次出现起始的位置。否则，返回 -1。 |\n| `int lastIndexOf(char\
  \ ch)` | 在调用的 `String` 对象中搜索传递给 `ch` 的字符。如果找到该字符，则返回其最后一次的位置。否则，返回 -1。 |\n| `int\
  \ lastIndexOf(char ch, int start)` | 在调用的 `String` 对象中搜索传递给 `ch` 的字符，从传递给 `start`\
  \ 的位置开始。搜索反向通过字符串到位置 0。如果找到该字符，则返回其最后一次的位置。否则，返回 -1。 |\n| `int lastIndexOf(String\
  \ str)` | 在调用的 `String` 对象中搜索传递给 `str` 的字符串。如果找到该字符串，则返回其最后一次的位置。否则，返回 -1。 |\n\n\
  # 使用 `indexOf` 和 `lastIndexOf` 方法查找字符\n\n`indexOf` 和 `lastIndexOf` 方法可以在字符串内搜索字符或子字符串。如果找到了该项目，则返回其位置。否则，返回\
  \ `-1`。这里有一个使用这两个方法搜索字符的代码示例：\n\n```\nString str = \"Four score and seven years\
  \ ago\";\nint first, last;\n\nfirst = str.indexOf('r');\nlast = str.lastIndexOf('r');\n\
  \nSystem.out.println(\"The letter r first appears at \" + first);\nSystem.out.println(\"\
  The letter r last appears at \" + last);\n```\n\n这段代码产生如下输出：\n\n```\nThe letter\
  \ r first appears at 3\nThe letter r last appears at 24\n```\n\n以下代码显示了另一个示例。它使用循环显示字符串中每个字母\
  \ ‘r’ 的位置。\n\n```\nString str = \"Four score and seven years ago\";\nint position;\n\
  \nSystem.out.println(\"The letter r appears at the following locations:\");\nposition\
  \ = str.indexOf('r');\nwhile (position != -1) {\n   System.out.println(position);\n\
  \   position = str.indexOf('r', position + 1);\n}\n```\n\n这段代码将产生输出：\n\n```\nThe\
  \ letter r appears at the following locations:\n3\n8\n24\n```\n\n以下代码非常相似，但它使用了\
  \ `lastIndexOf` 方法并反向显示位置：\n\n```\nString str = \"Four score and seven years ago\"\
  ;\nint position;\n\nSystem.out.println(\"The letter r appears at the following locations:\"\
  );\nposition = str.lastIndexOf('r');\nwhile (position != -1) {\n   System.out.println(position);\n\
  \   position = str.lastIndexOf('r', position - 1);\n}\n```\n\n这段代码将产生输出：\n\n```\n\
  The letter r appears at the following locations:\n24\n8\n3\n```\n\n# 使用 `indexOf`\
  \ 和 `lastIndexOf` 方法查找子字符串\n\n`indexOf` 和 `lastIndexOf` 方法还可以在字符串内搜索子字符串。以下代码展示了一个示例。它显示了字符串中单词“and”每次出现的的起始位置。\n\
  \n```\nString str = \"and a one and a two and a three\";\nint position;\nSystem.out.println(\"\
  The word and appears at the following locations.\");\nposition = str.indexOf(\"\
  and\");\nwhile (position != -1) {\n   System.out.println(position);\n   position\
  \ = str.indexOf(\"and\", position + 1);\n}\n```\n\n这段代码产生输出：\n\n```\nThe word and\
  \ appears at the following locations.\n0\n10\n20\n```\n\n以下代码也显示相同的结果，但顺序是反的：\n\n\
  \n\n\n\n```java\nString str = \"and a one and a two and a three\";\n int position;\n\
  \n System.out.println(\"The word and appears at the \" +\n                    \"\
  following locations.\");\n position = str.lastIndexOf(\"and\");\n while (position\
  \ != −1)\n {\n    System.out.println(position);\n    position = str.lastIndexOf(\"\
  and\", position − 1);\n }\n```\n\n这段代码产生以下输出：\n\n```\nThe word and appears at the\
  \ following locations.\n20\n10\n0\n```\n\n# # 提取子字符串\n\n`String` 类提供了几个方法，允许你从字符串中提取子字符串。我们将检查的方法列在表\
  \ 9-5 中。\n\n## # 表 9-5 用于提取子字符串的 String 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `String\
  \ substring(int `start` )` | 此方法返回一个从 `start` 开始到调用对象字符串末尾的子字符串的拷贝。 |\n| `String\
  \ substring(int `start`, int `end` )` | 此方法返回一个子字符串的拷贝。传递给 `start` 的参数是子字符串的起始位置，传递给\
  \ `end` 的参数是子字符串的结束位置。`start` 位置的字符包含在子字符串中，但 `end` 位置的字符不包含。 |\n| `void getChars(int\
  \ `start`, int `end`, char[] `array`, int `arrayStart` )` | 此方法从调用对象中提取子字符串并将其存储在\
  \ `char` 数组中。传递给 `start` 的参数是子字符串的起始位置，传递给 `end` 的参数是子字符串的结束位置。`start` 位置的字符包含在子字符串中，但\
  \ `end` 位置的字符不包含。（子字符串中的最后一个字符结束于 `end` – 1。）子字符串中的字符作为元素存储在传递给 `array` 参数的数组中。`arrayStart`\
  \ 参数指定了数组中要存储字符的起始下标。 |\n| `char[] toCharArray()` | 此方法将调用对象中的所有字符作为 `char` 数组返回。\
  \ |\n\n## # `substring` 方法\n\n`substring` 方法返回调用对象中一个子字符串的拷贝。该方法有两个重载版本。第一个版本接受一个\
  \ `int` 参数，作为子字符串的起始位置。该方法返回一个 `String` 对象的引用，该对象包含从起始位置到字符串末尾的所有字符。起始位置的字符是子字符串的一部分。以下是该方法的用法示例：\n\
  \n```java\nString fullName = \"Cynthia Susan Lee\";\n String lastName = fullName.substring(14);\n\
   System.out.println(\"The full name is \" + fullName);\n System.out.println(\"The\
  \ last name is \" + lastName);\n```\n\n这段代码将产生以下输出：\n\n```\nThe full name is Cynthia\
  \ Susan Lee\nThe last name is Lee\n```\n\n请记住，`substring` 方法返回一个持有子字符串拷贝的新 `String`\
  \ 对象。当这段代码执行执行时，`fullName` 和 `lastName` 变量将引用两个不同的 `String` 对象，如图 9-5 所示。\n\n##\
  \ # 图 9-5 `fullName` 和 `lastName` 变量引用单独的对象\n\n![一个表格识别并描述了 4 个提取子字符串的 String 方法。](img/09fig05.png)图\
  \ 9-5 完整备用文本\n\n方法的第二个版本接受两个 `int` 参数。第一个指定子字符串的起始位置，第二个指定子字符串的结束位置。起始位置的字符包含在子字符串中，但结束位置的字符不包含。以下是该方法的用法示例：\n\
  \n```java\nString fullName = \"Cynthia Susan Lee\";\n String middleName = fullName.substring(8,\
  \ 13);\n System.out.println(\"The full name is \" + fullName);\n System.out.println(\"\
  The middle name is \" + middleName);\n```\n\n代码将产生以下输出：\n\n```\nThe full name is\
  \ Cynthia Susan Lee\nThe middle name is Susan\n```\n\n## # `getChars` 和 `toCharArray`\
  \ 方法\n\n`getChars` 和 `toCharArray` 方法将调用的 `String` 对象转换为 `char` 数组。`getChars` 方法可以转换子字符串，而\
  \ `toCharArray` 方法转换整个字符串。以下是 `getChars` 方法的用法示例：\n\n```java\nString fullName =\
  \ \"Cynthia Susan Lee\";\n char[] nameArray = new char[5];\n fullName.getChars(8,\
  \ 13, nameArray, 0);\n System.out.println(\"The full name is \" + fullName);\n System.out.println(\"\
  The values are:\");\n for (int i = 0; i < nameArray.length; i++) {\n    System.out.println(nameArray[i]);\n\
   }\n```\n\n`toCharArray` 方法返回一个包含调用对象中所有字符的 `char` 数组。以下是一个用法示例：\n\n```java\nString\
  \ fullName = \"Cynthia Susan Lee\";\n char[] nameArray = fullName.toCharArray();\n\
   System.out.println(\"The full name is \" + fullName);\n System.out.println(\"The\
  \ values are:\");\n for (int i = 0; i < nameArray.length; i++) {\n    System.out.println(nameArray[i]);\n\
   }\n```\n\n这段代码将产生以下输出：\n\n```\nThe full name is Cynthia Susan Lee\nC\ny\nn\nt\n\
  h\ni\na\n \nS\nu\ns\na\nn\n \nL\ne\ne\n```\n\n\n\n\n\n```\nString str1 = \"Tom Talbert\
  \ Tried Trains\";\nString str2;\nstr2 = str1.replace('T', 'D');\nSystem.out.println(str1);\n\
  System.out.println(str2);\n```\n\n在此段代码中，`replace` 方法将返回 `str1` 对象的副本，其中每个字母‘T’的出现处都被替换为字母‘D’。代码将产生以下输出：\n\
  \n```\nTom Talbert Tried Trains\nDom Dalbert Dried Drains\n```\n\n请记住，`replace`\
  \ 方法不会修改调用它的 `String` 的内容的内容，而是返回一个指向该对象修改副本的 `String` 引用。执行完之前的代码后，`str1` 和 `str2`\
  \ 变量将引用不同的 `String` 对象。\n\n`trim` 方法返回 `String` 对象的副本，其中删除了所有前导和尾随空白字符。“前导”（`leading`）空白字符是指出现在字符串开头或左侧的字符。例如，以下字符串有三个前导空白字符：\n\
  \n```\n Hello\"\n```\n\n“尾随”（`trailing`）空白字符是指出现在字符串末尾或右侧、非空格字符之后的字符。例如，以下字符串有三个尾随空白字符：\n\
  \n```\nHello   \"\n```\n\n这里有一个示例：\n\n```\nString greeting1 = \"   Hello   \";\n\
  String greeting2;\ngreeting2 = greeting1.trim();\nSystem.out.println(\"*\" + greeting1\
  \ + \"*\");\nSystem.out.println(\"*\" + greeting2 + \"*\");\n```\n\n在此段代码中，第一条语句将字符串\
  \ `\" Hello \"`（带有三个前导空格和三个尾随空格）赋值给变量 `greeting1`。调用了 `trim` 方法，该方法返回一个删除了前导和尾随空格的字符串副本。代码将产生以下输出：\n\
  \n```\n*   Hello   *\n*Hello*\n```\n\n`trim` 方法的一个常见用途是移除用户在输入数据时可能输入的任何前导或尾随空格。\n\
  \n# 静态 `valueOf` 方法\n\n`String` 类有多个名为 `valueOf` 的方法重载版本。该方法接受任何原始数据类型的值作为其参数，并返回该值的字符串表示。表\
  \ 9-7 描述了这些方法。\n\n# 表 9-7 `String` 类的一些 `valueOf` 方法\n\n| 方法 |  |\n| --- | --- |\n\
  | `String valueOf(boolean b)` | 如果传递给 `b` 的 `boolean` 参数为 `true`，则方法返回字符串 `\"true\"\
  `。如果参数为 `false`，则方法返回字符串 `\"false\"`。 |\n| `String valueOf(char c)` | 此方法返回包含传递给\
  \ `c` 的字符的 `String`。 |\n| `String valueOf(char[] array)` | 此方法返回包含传递给 `array` 的\
  \ `char` 数组中所有元素的 `String`。 |\n| `String valueOf(char[] array, int subscript, int\
  \ count)` | 此方法返回包含传递给 `array` 的 `char` 数组部分元素的 `String`。传递给 `subscript` 的参数是起始下标，传递给\
  \ `count` 的参数是元素个数。 |\n| `String valueOf(double number)` | 此方法返回传递给 `number` 的 `double`\
  \ 参数的字符串表示。 |\n| `String valueOf(float number)` | 此方法返回传递给 `number` 的 `float` 参数的字符串表示。\
  \ |\n| `String valueOf(int number)` | 此方法返回传递给 `number` 的 `int` 参数的字符串表示。 |\n| `String\
  \ valueOf(long number)` | 此方法返回传递给 `number` 的 `long` 参数的字符串表示。 |\n\n以下代码演示了其中几个方法：\n\
  \n```\nboolean b = true;\nchar [] letters = { 'a', 'b', 'c', 'd', 'e' }; \ndouble\
  \ d = 2.4981567;\nint i = 7;\n\nSystem.out.println(String.valueOf(b));\nSystem.out.println(String.valueOf(letters));\n\
  System.out.println(String.valueOf(letters, 1, 3));\nSystem.out.println(String.valueOf(d));\n\
  System.out.println(String.valueOf(i));\n```\n\n这段代码将产生以下输出：\n\n```\ntrue\nabcde\n\
  bcd\n2.4981567\n7\n```\n\n# 检查点 9.14\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-09/index.html\n\
  \n# 检查点 9.15\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-10/index.html\n\
  \n# 检查点 9.16\n../components/metrodigi/ch09-inline_self_quiz_v1.0.0-11/index.html\n\
  \n\n\n\n\n`String` 对象的不可变性通常不是问题，但如果你的程序需要对一个或多个字符串进行大量修改，你可能考虑使用 `StringBuilder`\
  \ 对象。这将通过减少必须创建并由垃圾回收器移除的 `String` 对象来提高程序的效率。现在让我们来看 `StringBuilder` 类的构造函数和方法。\n\
  \n## `StringBuilder` 构造函数\n\n`Table 9-8` 列出了三个 `StringBuilder` 构造函数。\n\n### 表 9-8\
  \ `StringBuilder` 构造函数\n\n| 构造函数 | 说明 |\n| --- | --- |\n| `StringBuilder()` | 此构造函数不接受参数。它为对象提供了足够的空间来存储\
  \ 16 个字符，但其中没有存储任何字符。 |\n| `StringBuilder(int length)` | 此构造函数为对象提供了足够的空间来存储 `length`\
  \ 个字符，但其中没有存储任何字符。 |\n| `StringBuilder(String str)` | 此构造函数使用字符串 `str` 来初始化对象。对象的初始存储空间为字符串长度加\
  \ 16。 |\n\n前两个构造函数创建指定大小的空 `StringBuilder` 对象。第一个构造函数使 `StringBuilder` 对象足够大，可以容纳\
  \ 16 个字符，而第二个构造函数使对象足够大，可以容纳 `length` 个字符。记住，`StringBuilder` 对象会自动调整大小，因此如果你稍后想在对象中存储更大的字符串，这并不是问题。第三个构造函数接受一个\
  \ `String` 对象作为参数，并将对象的内容赋值给 `StringBuilder` 对象。以下是它的用法示例：\n\n```\nStringBuilder\
  \ city = new StringBuilder(\"Charleston\");\nSystem.out.println(city);\n```\n\n\
  这段代码创建了一个 `StringBuilder` 对象并将其地址赋值给变量 `city`。该对象用字符串“Charleston”初始化。正如这段代码所示，你可以将\
  \ `StringBuilder` 对象传递给 `println` 和 `print` 方法。\n\n`StringBuilder` 类的一个局限性是，你不能使用赋值运算符将字符串赋值给\
  \ `StringBuilder` 对象。例如，以下代码将无法工作：\n\n```\nStringBuilder city = \"Charleston\";\
  \  // 错误！！！无法工作！\n```\n\n你不能使用赋值运算符，而必须使用 `new` 关键字和构造函数，或者使用 `StringBuilder` 的方法之一将字符串存储在\
  \ `StringBuilder` 对象中。\n\n## 其他 `StringBuilder` 方法\n\n`StringBuilder` 类提供了许多与 `String`\
  \ 类相同的方法。`Table 9-9` 列出了几个工作方式与其 `String` 类对应方法完全相同的 `StringBuilder` 方法。\n\n###\
  \ 表 9-9 `String` 和 `StringBuilder` 类共有的方法\n\n| |\n| --- |\n| ```\nchar charAt(int\
  \ position)\nvoid getChars(int start, int end, char[] array, int arrayStart)\nint\
  \ indexOf(String str)\nint indexOf(String str, int start)\nint lastIndexOf(String\
  \ str)\nint lastIndexOf(String str, int start)\nint length()\nString substring(int\
  \ start)\nString substring(int start, int end)\n``` |\n\n此外，`StringBuilder` 类提供了几个\
  \ `String` 类不具备的方法。让我们来看其中几个。\n\n## `append` 方法\n\n`StringBuilder` 类有多个名为 `append`\
  \ 的方法重载版本。这些方法接受一个参数，该参数可以是任何基本数据类型、`char` 数组或 `String` 对象。它们将参数的字符串表示附加到调用对象的当前内容之后。由于\
  \ `append` 有许多重载版本，我们将如下所示该方法典型调用的通用形式：\n\n```\nobject.append(item);\n```\n\n调用方法后，`item`\
  \ 的字符串表示将附加到 `object` 的内容。以下代码显示了某些 `append` 方法的使用：\n\n```\nStringBuilder str =\
  \ new StringBuilder();\n\n// 向对象中添加值。\nstr.append(\"We sold \");           // 添加一个\
  \ String 对象。\nstr.append(12);                   // 添加一个 int。\nstr.append(\" doughnuts\
  \ for $\");   // 添加另一个 String。\nstr.append(15.95);                // 添加一个 double。\n\
  \n// 显示对象的内容。\nSystem.out.println(str);\n```\n\n这段代码将产生以下输出：\n\n```\nWe sold 12\
  \ doughnuts for $15.95\n```\n\n## `insert` 方法\n\n`StringBuilder` 类还具有若干个名为 `insert`\
  \ 的方法重载版本，它可以将值插入到调用对象的字符串中。这些方法接受两个参数：一个指定在调用对象字符串中开始插入位置的 `int` 参数，以及要插入的值。要插入的值可以是任何基本数据类型、`char`\
  \ 数组或 `String` 对象。由于 `insert` 有许多重载版本，我们将如下所示该方法典型调用的通用形式：\n\n```\nobject.insert(start,\
  \ item);\n```\n\n在通用形式中，`start` 是起始位置，`item` 是要插入的值。以下代码显示了一个示例：\n\n```\nStringBuilder\
  \ str = new StringBuilder(\"New City\");\nstr.insert(4, \"York \");\nSystem.out.println(str);\n\
  ```\n\n第一条语句创建一个用字符串\"New City\"初始化的 `StringBuilder` 对象。第二条语句将字符串\"York \"插入到 `StringBuilder`\
  \ 对象中，从位置 4 开始。以下代码显示了如何将 `char` 数组插入到 `StringBuilder` 对象中：\n\n```\nchar cArray[]\
  \ = { '2', '0', ' ' };\nStringBuilder str = new StringBuilder(\"In July we sold.\"\
  );\nstr.insert(16, cArray);\nSystem.out.println(str);\n```\n\n第一条语句声明了一个字符数组 `cArray`，包含字符\
  \ '2'、'0' 和 ' '。第二条语句创建一个用字符串\"In July we sold.\"初始化的 `StringBuilder` 对象。第三条语句将\
  \ `cArray` 中的字符插入到 `StringBuilder` 对象中，从位置 16 开始。\n\n## `replace` 方法\n\n`StringBuilder`\
  \ 类有一个 `replace` 方法，它与 `String` 类的 `replace` 方法略有不同。`String` 类的 `replace` 方法是将一个字符替换另一个字符，而\
  \ `StringBuilder` 类的 `replace` 方法是将指定的子字符串替换为字符串。以下是该方法的调用通用形式：\n\n```\nobject.replace(start,\
  \ end, str);\n```\n\n在通用形式中，`start` 是调用对象中子字符串起始位置的 `int` 类型，`end` 是子字符串结束位置的 `int`\
  \ 类型。（起始位置包含在子字符串中，但结束位置不包含。）`str` 参数是一个 `String` 对象。这里是一个示例：\n\n```\nStringBuilder\
  \ str = new StringBuilder(\"We moved from Chicago to Atlanta.\");\nstr.replace(14,\
  \ 21, \"New York\");\nSystem.out.println(str);\n```\n\n这段代码中的 `replace` 方法将“Chicago”替换为“New\
  \ York”。该代码将产生以下输出：\n\n```\nWe moved from New York to Atlanta.\n```\n\n## `delete`、`deleteCharAt`\
  \ 和 `setCharAt` 方法\n\n\n\n\n\n`delete` 和 `deleteCharAt` 方法用于从 `StringBuilder` 对象中删除子字符串或字符。`setCharAt`\
  \ 方法将指定的字符更改另一个值。表 9-10 描述了这些方法。\n\n## 表 9-10 `StringBuilder` 类的 `delete`、`deleteCharAt`\
  \ 和 `setCharAt` 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `StringBuilder delete(int start,\
  \ int end)` | `start` 参数是一个 `int` 类型，指定调用对象中子字符串的起始位置，`end` 参数是一个 `int` 类型，指定子字符串的结束位置。（起始位置包含在子字符串内，但结束位置不包含。）该方法将删除该子字符串。\
  \ |\n| `StringBuilder deleteCharAt (int position)` | `position` 参数指定要删除的字符的位置。 |\n\
  | `void setCharAt(int position, char ch)` | 此方法将 `position` 处的字符更改为传入 `ch` 的值。 |\n\
  \n以下代码演示了这三个方法：\n\n```\nStringBuilder str =\n      new StringBuilder(\"I ate 100\
  \ blueberries!\");\n\n// Display the StringBuilder object.\n  System.out.println(str);\n\
  \n// Delete the '0'.\n  str.deleteCharAt(8);\n\n// Delete \"blue\".\n  str.delete(9,\
  \ 13);\n\n// Display the StringBuilder object.\n  System.out.println(str);\n\n//\
  \ Change the '1' to '5'\n  str.setCharAt(6, '5');\n\n// Display the StringBuilder\
  \ object.\n  System.out.println(str);\n```\n\n此代码将产生以下输出：\n\n```\nI ate 100 blueberries!\n\
  I ate 10 berries!\nI ate 50 berries!\n```\n\n## `toString` 方法\n\n如果你需要将 `StringBuilder`\
  \ 对象转换为普通字符串，可以调用对象的 `toString` 方法。以下代码了将 `StringBuilder` 对象的的内容赋值给 `String` 变量的示例：\n\
  \n```\nStringBuilder strb = new StringBuilder(\"This is a test.\");\nString str\
  \ = strb.toString();\n```\n\n## Spotlight：电话号码的格式化与取消格式化\n\n美国的电话号码通常格式化为如下形式：\n\
  \n```\nXXX)XXX-XXXX\n```\n\n在该格式中，`X` 代表数字。括号内的三个数字是区码。区码后的三个数字是前缀，连字符后的四个数字是分机号码。例如：\n\
  \n```\n919)555-1212\n```\n\n虽然括号和连字符让人们更容易阅读号码，但对于计算机处理来说，这些字符是不必要的。在计算机系统中，电话号码通常存储为一系列未格式化的数字，如下所示：\n\
  \n```\n195551212\n```\n\n处理电话号码的程序通常需要对用户输入的号码进行取消格式化。这意味着在将号码存储到文件中或进行其他方式处理之前，必须移除括号和连字符。此外，此类程序还需要能够格式化数字的能力，以便号码在屏幕上显示或打印在纸上时包含括号和连字符。\n\
  \n代码列表 9-6 显示了一个名为 `Telephone` 的类，该类包含以下静态方法：\n\n*   `isFormatted`–此方法接受一个 `String`\
  \ 参数，如果该参数格式为 `(XXX)XXX-XXXX`，则返回 `true`。如果参数不是这种格式，该方法返回 `false`。\n*   `unformat`–此方法接受一个\
  \ `String` 参数。如果参数格式为 `(XXX)XXX-XXXX`，则该方法返回移除了括号和连字符的未格式化参数版本。否则，该方法返回原始参数。\n*\
  \   `format`–此方法的目的是将数字序列格式化为 `(XXX)XXX-XXXX`。该数字序列作为 `String` 参数传递。如果参数长度为 10 个字符，则方法返回插入了括号和连字符的参数。否则，该方法返回原始参数。\n\
  \n代码列表 9-7 中的程序演示了 `Telephone` 类。\n\n在下面的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步查看代码并查看全程解释。\n\
  \n## 代码列表 9-6 `(Telephone.java)`\n\n```java\nimport java.util.Scanner;\n\n/**\n\
  \ *此程序演示了 Telephone 类的静态方法。\n */\npublic class Telephone {\n\n    public static\
  \ void main(String[] args) {\n        String phoneNumber; // To hold a number\n\
  \        Scanner keyboard = new Scanner(System.in);\n\n        // Get an unformatted\
  \ telephone number.\n        System.out.print(\"Enter an unformatted telephone number:\
  \ \");\n        phoneNumber = keyboard.nextLine();\n\n        // Format the telephone\
  \ number.\n        System.out.println(\"Formatted: \" + format(phoneNumber));\n\n\
  \        // Get a formatted telephone number.\n        System.out.print(\"Enter\
  \ a telephone number as (XXX)XXX-XXXX: \");\n        phoneNumber = keyboard.nextLine();\n\
  \n        // Unformat the telephone number.\n        System.out.println(\"Unformatted:\
  \ \" + unformat(phoneNumber));\n    }\n\n    public static boolean isFormatted(String\
  \ argument) {\n        if (argument.matches(\"\\\\(\\\\d{3}\\\\)\\\\d{3}-\\\\d{4}\"\
  )) {\n            return true;\n        } else {\n            return false;\n  \
  \      }\n    }\n\n    public static String unformat(String argument) {\n      \
  \  if (isFormatted(argument)) {\n            return argument.replace(\"(\", \"\"\
  ).replace(\")\", \"\").replace(\"-\", \"\");\n        } else {\n            return\
  \ argument;\n        }\n    }\n\n    public static String format(String argument)\
  \ {\n        if (argument.length() == 10) {\n            return \"(\" + argument.substring(0,\
  \ 3) + \")\" + argument.substring(3, 6) + \"-\" + argument.substring(6);\n     \
  \   } else {\n            return argument;\n        }\n    }\n}\n```\n\n带有输入的的程序输出\n\
  \n```\nEnter an unformatted telephone number: 9195551212\nFormatted: (919)555-1212\n\
  Enter a telephone number as (XXX)XXX-XXXX: (919)555-1212\nUnformatted: 9195551212\n\
  ```\n\n## 代码列表 9-7 `(TelephoneTester.java)` (注：源代码中未完整提供列表 9-7 的内容，但根据要求保留了其结构。)\n\
