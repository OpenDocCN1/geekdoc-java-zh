  \ 10pt;\n    -fx-font-weight: bold;\n}\n```\n\n### 代码列表 13-7 `(demo4.css)`\n\n##\
  \ 在同一定义中指定多个选择器\n你可以在样式定义的第一行列出由逗号分隔的多个选择器。代码列表 13-8 显示了一个示例。注意第 1 行列出了 `.label`\
  \ 选择器，随后是 `.button` 选择器。结果是样式规则将应用于 `Label` 控件和 `Button` 控件。\n\n```\n.label, .button\
  \ {\n    -fx-font-family: cursive;\n    -fx-font-size: 14pt;\n    -fx-font-style:\
  \ italic;\n}\n```\n\n### 代码列表 13-8 `(demo5.css)`\n\n## 使用颜色\nCSS 使用 `RGB` 颜色系统来定义颜色。在\
  \ `RGB` 颜色系统中，所有颜色都是通过混合红、绿、蓝色调的。例如，混合红色和绿色得到黄色。当你混合红色和蓝色得到紫色。当你混合所有三种颜色的最大亮度时得到白色。\n\
  \n在 CSS 中定义颜色时，使用 0 到 255 之间的整数值。对于颜色组件，数值越大，该颜色越亮。最常用的指定颜色的方法是带有 `#` 前缀的十六进制，通用格式为：\n\
  \n```\nRGGBB```\n\n其中 `RR` 是红色的十六进制，`GG` 是绿色的十六进制，`BB` 是蓝色的十六进制。例如，`#05AAFF` 是蓝色。当你混合这些颜色组件时得到浅蓝色。为了演示这一点，请查看\
  \ 代码列表 13-9 中的样式表。它定义了 `Label` 的样式。该定义指定字体号为 20 磅，文本填充颜色为 `#FFFFFF`（白色），背景颜色为 `#909090`（灰色）。图\
  \ 13-4 显示了应用了这些样式的 Label。\n\n```\n.label {\n    -fx-font-size: 20pt;\n    -fx-text-fill:\
  \ #FFFFFF;\n    -fx-background-color: #909090;\n}\n```\n\n### 代码列表 13-9 `(demo6.css)`\n\
  \n![一个示例标签应用了对 Label 控件的样式。](img/13fig04.png)\n\n## 图 13-4 应用了样式的 Label（Oracle 法律顾问）\n\
  如果你不熟悉十六进制值，可以使用函数式 RGB 表示法来指定颜色。通用格式为：\n\n```\nrgb(red, green, blue)\n```\n\n在这种表示法中，红、绿、蓝的值可以是\
  \ 0 到 255 之间的整数，也可以是 0% 到 100% 之间的百分比。例如，`rgb(255, 0, 127)` 指定红色为 255，绿色为 0，蓝色为\
  \ 127。而 `rgb(50%, 20%, 90%)` 指定红色应具有 50% 的强度，绿色具有 20% 的强度，蓝色具有 90% 的强度。\n\n为了演示这一点，请查看\
  \ 代码列表 13-10 中的样式表。`.label` 样式使用函数式 RGB 表示法来指定之前在 代码列表 13-9 中所示相同颜色值。该样式定义指定了：\n\
  \n*   字体号为 24 磅\n*   文本填充颜色：红色 = 255，绿色 = 255，蓝色 = 255\n*   背景颜色：红色 = 144，绿色 = 144，蓝色\
  \ = 144\n\n```\n.label {\n    -fx-font-size: 24pt;\n    -fx-text-fill: rgb(255,\
  \ 255, 255);\n    -fx-background-color: rgb(144, 144, 144);\n}\n```\n\n## 命名颜色\n\
  \n\n\n\nCSS 提供了许多代表颜色的预定义名称。我们将这些名称称为 `命名颜色`。你可以像使用十六进制颜色数字或函数性 RGB 表达式一样使用这些命名颜色。在本书时，JavaFX\
  \ 支持 148 种命名颜色。表 13-4 仅列出了其中几个。你可以在附录 K 中查看完整列表。你也可以官方 JavaFX CSS 参考指南中查看它们，地址如下：\n\
  \n```\nhttps://docs.oracle.com/javase/8/javafx/api/javafx/scene/doc-files/cssref.html\n\
  ```\n\n# 表 13-4 一部分命名颜色\n\n| `antiquewhite` | `aqua` | `black` | `blue` |\n| `chocolate`\
  \ | `crimson` | `darkgray` | `darkgreen` |\n| `gold` | `gray` | `green` | `lavender`\
  \ |\n| `maroon` | `olive` | `orange` | `plum` |\n| `purple` | `red` | `sandybrown`\
  \ | `tan` |\n| `teal` | `violet` | `white` | `yellow` |\n\n代码列表 13-11 显示了一个使用命名颜色的样式表。`.label`\
  \ 样式定义指定 `white` 为文本填充颜色，并将 `blue` 为背景颜色。\n\n```\n1  .label {\n 2     -fx-text-fill:\
  \ white;\n 3     -fx-background-color: blue;\n 4  }\n```\n\n### 代码列表 13-11 `(demo8.css)`\n\
  \n# 创建自定义样式类名称\n\n在类型选择器中，点号后面的名称被称为 `样式类`。例如，在 `.label` 选择器中，样式类是 `label`，在 `.button`\
  \ 选择器中，样式类是 `button`。为了在应用样式定义时具有更高的灵活性，JavaFX 允许你创建自定义的样式类。\n\n例如，假设你想让应用程序中的某些\
  \ `Button` 控件显示黑色背景和白色文字，而让其他 `Button` 控件显示白色背景和黑色文字。如果你创建两个自定义样式类，这是可以实现的：一个用于黑色按钮，另一个用于白色按钮。代码列表\
  \ 13-12 显示了一个样式表示例，我们在其中创建了两个自定义样式类：一个命名为 `button-black`，另一个命名为 `button-white`。\n\
  \n```\n1  .button-black {\n 2     -fx-background-color: black;\n 3     -fx-text-fill:\
  \ white;\n 4  }\n 5\n 6  .button-white {\n 7     -fx-background-color: white;\n\
   8     -fx-text-fill: black;\n 9  }\n```\n\n### 代码列表 13-12 `(demo9.css)`\n\n在此样式表中，`.button-black`\
  \ 样式定义指定了黑色背景和白色文字。`.button-white` 样式定义指定了白色背景和黑色文字。要将任一种样式定义应用于节点，我们必须将所需的样式类添加到\
  \ Java 应用程序中相应的节点。\n\n例如，假设我们有一个名为 `button1` 的 `Button` 控件，并想对其应用 `.button-black`\
  \ 样式定义。我们将使用以下语句将 `button-black` 样式类添加到 `button1`：\n\n```\nbutton1.getStyleClass().add(\"\
  button-black\");\n```\n\n每个节点都维护一个样式类的内部集合。该集合决定了哪些样式定义将应用于该节点。`getStyleClass()`\
  \ 方法返回一个包含节点样式类集合的对象，而该对象的 `add` 方法将指定的样式类添加到集合中。（当向 `add` 方法传递样式类名称作为参数时，不需要包含点。）代码列表\
  \ 13-13 显示了一个使用了之前所示自定义样式类的完整应用程序。程序的输出见图 13-5。\n\n```\n 1  import javafx.application.Application;\n\
    2  import javafx.stage.Stage;\n  3  import javafx.scene.Scene;\n  4  import javafx.scene.layout.HBox;\n\
    5  import javafx.scene.control.Button;\n  6  import javafx.geometry.Insets;\n\
    7  import javafx.geometry.Pos;\n  8  public class CSSDemo9 extends Application\n\
    9  {\n  10     public static void main(String[] args)\n  11     {\n  12      \
  \   launch(args);\n  13     }\n  14     @Override\n  15     public void start(Stage\
  \ primaryStage)\n  16     {\n  17         Button button1 = new Button(\"Button 1\"\
  );\n  18         button1.getStyleClass().add(\"button-black\");\n  19\n  20    \
  \     Button button2 = new Button(\"Button 2\");\n  21         button2.getStyleClass().add(\"\
  button-white\");\n  22         HBox hbox = new HBox(10, button1, button2);\n  23\
  \         hbox.setAlignment(Pos.CENTER);\n  24         hbox.setPadding(new Insets(10));\n\
    25         Scene scene = new Scene(hbox, 300, 200);\n  26         scene.getStylesheets().add(\"\
  demo.css\");\n  27         primaryStage.setScene(scene);\n  28         primaryStage.show();\n\
    29     }\n  30 }\n```\n\n\n\n\n\n```\nLabel outputLabel = new Label(\"Hello world!\"\
  );\noutputLabel.setStyle(\"-fx-font-size: 24pt\");\noutputLabel.getStyleClass().add(\"\
  -fx-font-weight: bold\");\n```\n\n这段代码创建了一个名为 `outputLabel` 的 `Label` 控件，将 `Label`\
  \ 的字体大小设置为 24 磅，并将字体粗细设置为粗体。\n\n当你在应用程序中只需要应用一或两条样式规则时，内联样式（Inline styling）非常方便。然而在大多数情况下，使用样式表（stylesheets）是更好的做法。如果你需要更改特定的样式规则，在样式表中找到该规则可能会比在应用程序的\
  \ Java 代码中更容易。此外，如果你更改了内联适的样式规则，将必须重新编译 Java 应用程序。而在样式表中更改规则则不需要重新编译应用程序。\n\n# 检查点\
