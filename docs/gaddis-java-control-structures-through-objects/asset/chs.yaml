  \ 和 `void` 都是关键字。第 5 行的 `int` 和第 6 行的 `double` 也是关键字。这些词始终以小写形式编写，每个在 Java 中都有特定的含义，且只能用于它们的用途。正如你将看到的，程序允许程序员为程序中的某些事物自定义名称。然而，关键字是保留的，不能用于其指定用途之外的任何地方。学习编程语言的一部分是就是学习常用的关键字、它们的含义以及如何使用它们。\n\
