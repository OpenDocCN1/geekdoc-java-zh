  \ 12-4 `(ImageDemo.java)`\n\n![Image Demo 程序的输出是一个标题为 Hot Air Balloon 的窗口中的热气球照片。](img/12fig13.png)\n\
  \n\n\n\n你可以通过调用对象的 `setImage` 方法来更改 `ImageView` 对象显示的图像。`setImage` 方法接收一个参数，该参数是你想要显示的的\
  \ `Image` 对象的引用。例如，假设 `myImageView` 引用一个 `ImageView` 对象，而 `myImage` 引用一个 `Image`\
  \ 对象。下面的代码了调用 `setImage` 方法的示例：\n\n```\nmyImageView.setImage(myImage);\n```\n\n\
  在该语句执行后，`myImageView` 对象将显示由 `myImage` 对象加载的图像。\n\n# Checkpoint 12.21\n../components/metrodigi/ch12-inline_self_quiz_v1.0.0-20/index.html\n\
