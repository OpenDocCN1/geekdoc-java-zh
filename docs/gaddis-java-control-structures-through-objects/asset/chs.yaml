  \n## 2.9 `String` 类\n\n概念：`String` 类允许你创建用于存储字符串的对象。它还有许多各种方法，允许你处理字符串。\n\n你已经遇到过字符串，并检查了那些在屏幕上显示它们的程序，但让我们花点时间确保你理解什么是字符串。字符串是字符的序列。它可以表示任何包含文本的数据类型，例如名称、地址、警告消息等。字符串字面量被包含在双引引号中，如下所示：\n\
  \n```\n\"Hello World\"\n\"Joe Mahoney\"\n```\n\n尽管程序经常遇到字符串并必须对它们执行各种任务，但 Java 并没有用于在内存中存储它们的原始数据类型。相反，Java\
  \ API 提供了一个用于处理字符串的类。你使用这个类来创建能够存储字符串并对其进行执行操作的对象。在讨论这个类之前，让我们简要讨论一下类和对象之间的关系。\n\
  \n### 对象从类创建\n\n第 1 章 向你介绍了对象，它们是作为包含属性和方法的软件实体。对象的属性是存储在对象中的数据值。对象的方法是对对象的属性执行操作的过程。然而，在创建对象之前，必须由程序员对其进行设计。程序员确定了必要的属性和方法，然后创建一个描述该对象的类。\n\
  \n你已经见过类被用作应用程序的容器。类也可以用于指定特定类型对象可能拥有的属性和方法。将类类为对象可以据此创建的“蓝图”。因此，类不是对象，而是对对象的描述。当程序运行时，它可以使用该类在内存中创建所需的任意数量的对象。从类中创建的每个对象都称为该类的一个\
  \ `instance`（实例）。\n\n### 提示\n\n如果这些概念对你来说似乎有点模糊，不要担心。随着你对这本书的阅读，类和对象的概念将反复被强化。\n\
  \n### `String` 类\n\nJava API 提供的处理字符串的类名为 `String`。使用 `String` 类的第一步是声明一个 `String`\
  \ 类数据类型的变量。这是一个 `String` 变量声明的示例：\n\n```\nString name;\n```\n\n### 提示\n\n`String`\
  \ 中的 `S` 是大写字母。按照惯例，类名的第一个字母总是大写大写的。\n\n该语句将 `name` 声明为 `String` 变量。记住 `String`\
  \ 是一个类，而不是原始数据类型。让我们简要查看原始类型变量和类类型变量之间的区别。\n\n### 原始类型变量和类类型变量\n\n任何类型的变量都可以与一个数据项关联。`Primitive\
  \ type variables`（原始类型变量）持有与其关联的实际数据。例如，假设 `number` 是一个 `int` 变量。以下语句将值 25 存储在变量中：\n\
  \n```\nnumber = 25;\n```\n\n这在 图 2-7 中所示。\n\n![与之关联的 25](img/02fig7.png)\n\n###\
  \ 图 2-7 原始类型变量与之关联的数据\n\n类类型变量 并不持有与其关联的实际数据项，而是持有与其关联的数据的地址。如果 `name` 是一个 `String`\
  \ 类变量，那么 `name` 可以持有该对象的地址。这在 图 2-8 中所示。\n\n![String 变量持有地址](img/02fig8.png)\n\n\
  ### 图 2-8 类变量持有地址\n\n当类类型变量持有对象的地址时，可以说该变量引用了对象。由于这个原因，类类型变量通常被称为引用变量。\n\n### 创建\
  \ `String` 对象\n\n每当程序中编写字符串字面量，Java 都会在内存中创建一个 `String` 对象来存储它。你可以使用简单的赋值语句在内存中创建一个\
  \ `String` 对象并将其地址存储在 `String` 变量中。例如：\n\n```\nname = \"Joe Mahoney\";\n```\n\n\
  在这里创建了一个 `String` 对象，其中存储了“Joe Mahoney”。然后赋值运算符将对象的地址存储在变量 `name` 中。执行此语句后，可以说 `name`\
  \ 引用了 `String` 对象。\n\n![例如，Mahoney](img/02fig9.png)\n\n# 图 2-9 `name` 变量持有地址\n\n\
  你还可以使用 `=` 运算符来初始化 `String` 变量，如下：\n\n```\nString name = \"Joe Mahoney\";\n```\n\
  \n该语句将 `name` 声明为 `String` 变量，创建一个存储了“Joe Mahoney”值的 `String` 对象，并将对象的内存地址分配给 `name`\
  \ 变量。代码列表 2-20 显示了 `String` 变量的声明、初始化，然后在 `println` 语句中使用。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步执行代码并贯穿查看解释。\n\
  \n# 代码列表 2-20 `(StringDemo.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-20/20.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-20/20.html)\n\
  \n由于 `String` 类型是类而不是原始数据类型，它提供了许多处理字符串的方法。例如，`String` 类有一个名为 `length()` 的方法，返回存储在对象中的字符串的长度。假设变量\
  \ `name` 引用一个 `String` 对象，以下语句将其字符串的长度存储在变量 `stringSize` 中（假设 `stringSize` 是一个 `int`\
  \ 变量）：\n\n```\nstringSize = name.length();\n```\n\n\n\n\n该语句调用了 `name` 所引用对象的 `length`\
  \ 方法。*调用*一个方法意味着执行该方法。方法调用的通用形式如下：\n\n```\nreferenceVariable.method(arguments .\
  \ . .)\n```\n\n`referenceVariable` 是引用对象的变量名，`method` 是方法名，而 `arguments. . .` 是传递给方法的零个或多个参数。如果没有向方法传递任何参数（如\
  \ `length` 方法所示），则必须在方法名后紧跟一对空括号。\n\n`String` 类的 `length` 方法*返回*一个 `int` 类型的值。这意味着该方法会将一个\
  \ `int` 值返回给调用它的语句。该值可以存储在变量中、显示在屏幕上或用于计算中。代码代码列表 2-21 演示了 `length` 方法。\n\n在下方的动画中，点击“上一个”或“下一个”按钮可以逐步查看代码并查看贯穿始终的解释。\n\
