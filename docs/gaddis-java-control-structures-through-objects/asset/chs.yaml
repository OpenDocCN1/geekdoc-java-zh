  \n## 2.2 `print` 和 `println` 方法以及 Java API\n\n概念：`print` 和 `println` 方法用于显示输出。它们是\
  \ API 的一部分，API 是执行特定操作的预写类。\n\n在本节中，你将学习如何编写产生输出的程序。程序显示的最简单输出类型是控制台输出。*控制台输出*仅仅是文本。当你在图形界面系统（如\
  \ Windows 或 macOS）中显示控制台输出时，输出通常出现在图 2-2 所示的窗口中。\n\n![命令提示符窗口显示控制台输出。](img/02fig02.png)\n\
  \n# 图 2-2 控制台窗口（Microsoft 公司）\n\n# 查看控制台输出\n\n*console* 一词是一个老的计算机术语。它源于大型计算机系统的操作员通过由简单屏幕和键盘组成的终端与系统交互的时代。这个终端被称为*控制台*。仅显示文本的控制台屏幕被称为标准输出设备。\n\
  \n在 Java 中执行输出操作以及许多其他任务，都是通过使用 Java API 完成的。*API* 的全称是*应用程序编程接口*。API 是用于执行特定操作的标准类库。这些类及其方法对所有\
  \ Java 程序可用。`print` 和 `println` 方法是 API 的一部分，提供了在标准输出设备上显示输出的方法。\n\n\n\n\n\n`System`\
  \ 是 Java API 的部分一个类。`System` 类包含了执行系统级操作的对象和方法。`System` 类中包含的一个对象名为 `out`。`out`\
  \ 对象拥有诸如 `print` 和 `println` 等方法，用于在系统控制台或标准输出设备上执行输出。`System`、`out`、`print` 和 `println`\
  \ 之间的层次关系如图图 2-3 所示。\n\n![System 类持有 out 对象和其他成员。System 类同样持有 out 对象以及其他成员。out 对象是\
  \ System 类的成员，包含两个成员，即 print 方法和 println 方法。](img/02fig03.png)\n\n## 图 2-3 `System`\
  \ 类、`out` 对象与 `print` 方法和 `println` 方法之间的关系\n\n以下是关于所有它们如何共同工作的简要总结：\n\n*   `System`\
  \ 类是 Java API 的组成部分。它拥有用于执行系统级操作（如向控制台发送输出）的成员对象和方法。\n*   `out` 对象是 `System` 类的成员。它提供了向屏幕发送输出的方法。\n\
  *   `print` 和 `println` 方法是 `out` 对象的成员。它们实际上执行在屏幕上写入字符的工作。\n\n这种层次结构解释了为什么执行 `println`\
  \ 的语句会那么长。序列 `System.out.println` 指定了 `println` 是 `out` 的成员，而 `out` 是 `System` 的成员。\n\
  \n### 注意\n\n分隔对象名称的句号读作“dot”。`System.out.println` 读作“system dot out dot print line”。\n\
  \n要显示在屏幕上的值放在括号内。这个值被称为 `argument`（参数）。例如，以下语句使用字符串 `\"King Arthur\"` 作为其参数执行 `println`\
  \ 方法。这将在屏幕上打印“King Arthur”（引号不会显示）。\n\n```\nSystem.out.println(\"King Arthur\");\n\
  ```\n\n关于 `println` 方法需要了解的一点重要点是，它在显示完消息后，会将光标移动到下一行的开头。屏幕上打印的下一个项目将从此位置开始。例如，查看代码列表\
  \ 2-2 中的程序。\n\n由于每个字符串在代码列表 2-2 中都是使用独立的 `println` 语句打印的，因此它们在程序输出中分行显示。\n\n在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步执行代码并查看全程的解释。\n\
  \n## 代码列表 2-2 `(TwoLines.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-2/2.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-2/2.html)\n\
  \n## `print` 方法\n\n`print` 方法也是 `System.out` 对象的一部分，其作用与 `println` 类似——在屏幕上显示输出。然而，`print`\
  \ 方法在显示完消息后不会将光标移动到下一行。查看代码列表 2-3。\n\n在在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步执行代码并查看全程的解释。\n\
  \n## 代码列表 2-3 `(GreatFun.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-3/3.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-3/3.html)\n\
  \n关于代码列表 2-3 需要理解的一个重要概念是，虽然输出被分为两个编程语句，但该程序仍然在一行上显示消息。你发送到 `print` 方法的数据以连续流的形式显示。有时这可能会产生不尽人意的结果。代码列表\
  \ 2-4 中的程序就是一个例子。\n\n在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步执行代码并查看全程的解释。\n\n\
  ## 代码列表 2-4 `(Unruly.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-4/4.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-4/4.html)\n\
  \n输出布局看起来完全不像代码。首先，虽然在代码列表 2-2 中每个字符串都是用独立的 `println` 语句打印的，但它们在程序输出中分行显示。其次，注意虽然输出被拆分为两个编程语句，但该程序仍然在一行上显示消息。你发送到\
  \ `print` 方法的数据以连续流的形式显示。有时这可能会产生不尽人意的结果。有两种方法可以解决这个问题。最明显的方法是使用 `println` 代替 `print`。另一种是使用转义序列来分隔。转义序列以斜杠（`\\\
  `）开始，后面跟着一个或控制字符。当 `print` 或 `println` 在遇到字符串中的它们时，它们不会打印转义序列，而是将其解释为将光标移动到下一行的命令。代码列表\
  \ 2-5 说明了它的用法。\n\n在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步执行代码并查看全程的解释。\n\n## 代码列表\
  \ 2-5 `(Adjusted.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-5/5.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-5/5.html)\n\
  \n`\\n` 字符被称为换行序列。当 `print` 或 `println` 遇到字符串中的它们时，它们不会在屏幕上打印 `\\n`，而是将其解释为将光标移动到下一行的命令。还有其他转义序列。例如`\\\
  t` 是制表序列。当 `print` 或 `println` 在字符串中遇到它时，会导致光标跳转到下一个制表位。代码列表 2-6 展示了它的用法。\n\n在下方的动画中，点击“上一个”（Previous）或“下一个”（Next）按钮逐步执行代码并查看全程的解释。\n\
  \n## 代码列表 2-6 `(Tabs.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-6/6.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-6/6.html)\n\
  \n### 注意\n\n虽然你需要输入两个字符来编写转义序列，但它们在内存中存储为单个字符。\n\n表 2-2 列出了常见的转义序列并对其进行了描述。\n\n\
  # 表 2-2 常见转义序列\n\n| 转义序列 | 名称 | 描述 |\n| --- | --- | --- |\n| `\\n` | 换行 | 将光标移动到下一行以便后续打印\
  \ |\n| `\\t` | 水平制表 | 导致光标跳到下一个制表位 |\n| `\\b` | 退格 | 导致光标后退或向左移动一位 |\n| `\\r` |\
  \ 回车 | 使光标回到当前行开头而不是下一行 |\n| `\\\\` | 反斜杠 | 打印一个反斜杠 |\n| `\\'` | 单引号 | 打印一个单引号 |\n\
  | `\\\"` | 双引号 | 打印一个双引号 |\n\n## 警告！\n\n不要混淆反斜杠（`\\`）和正斜杠（`/`）。如果你不小心用正斜杠开始转义序列，它将无效。此外，不要在斜杠和控制字符之间加上空格。\n\
