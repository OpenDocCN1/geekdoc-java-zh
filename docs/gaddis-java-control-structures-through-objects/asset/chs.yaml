  \n# 第 8 章 类的再次观察\n\n## 话题\n\n1.  8.1 静态成员\n2.  8.2 将对象作为参数\n3.  8.3 从方法返回对象\n4.\
  \  8.4 `toString` 方法\n5.  8.5 编写 `equals` 方法\n6.  8.6 复制对象的方法\n7.  8.7 聚合\n8.  8.8\
  \ `this` 引用\n9.  8.9 枚举类型\n10. 8.10 垃圾收集\n11. 8.11 关注面向对象的设计：类协作\n12. 8.12 需避免的常见错误\n\
  \n## 8.1 静态类成员\n\n概念：静态类成员属于类，而不属于对象。\n\n## 实例字段和实例方法的快速回顾\n\n回想第 6 章，类的每个实例都有自己的一组字段，这些字段被称为实例字段。你可以创建类的多个实例并在每个实例中存储不同的值。例如，我们创建的\
  \ `Rectangle` 类有一个 `length` 字段和一个 `width` 字段。假设 `box` 引用 `Rectangle` 类的一个实例，我们执行以下语句：\n\
  \n```\nbox.setLength(10);\n```\n\n该语句将值 10 存储在属于 `box` 所引用实例的 `length` 字段中。你可以将实例字段视为属于类的特定实例。\n\
  \n你还会记得类也可以有实例方法。当你调用一个实例方法时，它在类的特定实例上执行操作。例如，假设 `box` 引用 `Rectangle` 类的一个实例，看以下语句：\n\
  \n```\nx = box.getLength();\n```\n\n该语句调用了 `getLength` 方法，该方法返回属于 `Rectangle` 类特定实例（即\
  \ `box` 所引用的实例）的 `length` 字段的值。实例字段和实例方法都与类的特定实例相关，在创建类实例之前无法使用它们。\n\n\n\n\n可以创建一个不属于类的任何实例的字段或方法。此类成员被称为静态字段（static\
  \ fields）和静态方法（static methods）。当值存储在静态字段中时，它不会存储在类的实例中。事实上，为了在类的静态字段中存储值，甚至不需要存在类的实例。同样，静态方法不操作属于类的任何实例的字段。相反，它们只能对静态字段进行操作。你可以将静态字段和静态方法认为是属于类而不是属于类的实例。在本节中，我们将仔细查看静态成员。首先，我们将检查静态字段。\n\
  \n# 静态字段\n\n当使用 `static` 关键字声明字段时，内存中只会存在该字段的一个拷贝，无论可能存在多少个类实例。类静态字段的单一拷贝由类的所有实例共享。例如，代码列表\
  \ 8-1 所示的 `Countable` 类使用静态字段来计数创建的类实例数量。\n\n```java\n 1   /**\n  2     This class\
  \ demonstrates a static field.\n  3  */\n  4\n  5  public class Countable\n  6 \
  \ {\n  7     private static int instanceCount = 0;\n  8\n  9    /**\n  10      \
  \ The constructor increments the static\n  11       field instanceCount. This keeps\
  \ track\n  12       of the number of instances of this\n  13       class that are\
  \ created.\n  14     */\n  15\n  16     public Countable()\n  17     {\n  18   \
  \     instanceCount++;\n  19     }\n  20\n  21    /**\n  22        The getInstanceCount\
  \ method returns\n  23        the number of instances of this class\n  24      \
  \  that have been created.\n  25        @return The value in the instanceCount field.\n\
    26    */\n  27\n  28     public int getInstanceCount()\n  29     {\n  30     \
  \   return instanceCount;\n  31     }\n  32  }\n```\n\n# 代码列表 8-1 `(Countable.java)`\n\
  \n首先，注意第 7 行中名为 `instanceCount` 的静态字段的声明，如下：\n\n```java\nprivate static int instanceCount\
  \ = 0;\n```\n\n静态字段是通过在访问修饰符之后字段数据类型之前放置 `static` 关键字创建的。请注意，我们显式地将 `instanceCount`\
  \ 字段初始化为值 0。无论创建了多少个类实例，这种初始化只发生一次。\n\n### 注意\n\nJava 自动为所有未初始化的静态成员变量存储 0。此类中的\
  \ `instanceCount` 字段是显式初始化的，因此任何阅读代码的人都能清楚看到该字段从值 0 开始。\n\n接下来，查看第 16 行到 19 行的构造函数。构造函数使用\
  \ `++` 运算符来增加 `instanceCount` 字段。每创建一个 `Countable` 类的实例，就会调用构造函数并且 `instanceCount`\
  \ 字段就会加 1。结果，`instanceCount` 字段将包含已创建的 `Countable` 类的实例数量。第 28 行到 31 行的 `getInstanceCount`\
  \ 方法返回 `instanceCount` 中的值。代码列表 8-2 程序演示了这个类。\n\n```java\n 1  /**\n  2     This\
  \ program demonstrates the Countable class.\n  3  */\n  4\n  5  public class StaticDemo\n\
    6  {\n  7     public static void main(String[] args)\n  8     {\n  9        int\
  \ objectCount;\n  10\n  11        // Create three instances of the\n  12       \
  \ // Countable class.\n  13        Countable object1 = new Countable();\n  14  \
  \      Countable object2 = new Countable();\n  15        Countable object3 = new\
  \ Countable();\n  16\n  17        // Get the number of instances from\n  18    \
  \    // the class's static field.\n  19        objectCount = object1.getInstanceCount();\n\
    20        System.out.println(objectCount +\n  21                           \"\
  \ instances of the class \" +\n  22                           \"were created.\"\
  );\n  23     }\n```\n\n### 输出\n\n```\n3 instances of the class created.\n```\n\n\
  # 代码列表 8-2 `(StaticDemo.java)`\n\n程序创建了 `Countable` 类的三个实例，由 `object1`、`object2`\
  \ 和 `object3` 。这在图 8-1 中所示。\n\n# 图 8-1 类的静态字段\n\n![类的静态字段](img/08fig1.png) 第 19\
  \ 行程序调用 `getInstanceCount` 方法来获取：\n\n```java\nobjectCount = object1.getInstanceCount();\n\
  ```\n\n 静态方法\n\n当类包含静态方法时，不需要创建类的实例来执行该方法。代码列表 8-3 程序展示了一个示例。\n\n```java\n 1  /**\n\
    2     This class demonstrates static methods.\n  3  */\n  4\n  5  public class\
  \ Metric\n  6  {\n  7     /**\n  8        The milesToometers method converts\n \
  \ 9        distance in miles to kilometers.\n  10        @param m The distance in\
  \ miles.\n  11        @return The distance in kilometers.\n  12     */\n  13\n \
  \ 14     public static double milesToometers(double m)\n  15     {\n  16       \
  \ return m * 1.609;\n  17     }\n  18\n  19     /**\n  20        The kilometersToMiles\
  \ method converts\n  21        distance in kilometers to miles.\n  22        @param\
  \ k The distance in kilometers.\n  23        @return The distance in miles.\n  24\
  \     */\n  25\n  26     public static double kilometersToMiles(double k)\n  27\
  \     {\n  28        return k / 1.609;\n  29     }\n  30  }\n```\n\n# 代码列表 8-3 `(Metric.java)`\n\
  \n静态方法是通过在方法头访问修饰符之后放置 `static` 关键字创建的。`Metric` 类有两个静态方法：`milesToometers` 和 `kilometersToMiles`。由于它们被声明为\
  \ `static`，它们属于类，可以在没有类实例的情况下被调用。你只需要在方法调的点运算符之前写入类名。这里有一个示例：\n\n```java\nkilometers\
  \ = Metric.milesToometers(10.0);\n```\n\n该语句调用了 `milesToometers` 方法，并将值 `10.0` 作为参数。注意该方法不是从实例调用的，而是直接从\
  \ `Metric` 类调用的。代码列表 8-4 程序使用了 `Metric` 类。图 8-2 展示了与程序的交互示例。\n\n\n\n\n在 `/home/user/`\
