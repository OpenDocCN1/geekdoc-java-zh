  [`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-13/13.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr7-13/13.html)\n\
  \n# 部分填充的数组\n\n有时，你需要在数组中存储一系列项目，但你不知道这些项目的数量。因此，你不知道数组所需的确切元素数量。一种解决方案是让数组足够大，能够容纳可能的最大数量的项目。然而，这会导致另一个问题。如果存储在数组中的实际项目少于元素数量，则数组将只有部分填充的。当你处理部分填充的数组时，必须只处理包含有效数据项目的元素。\n\
  \n部分填充的数组通常配合一个整数变量使用，该变量用于存储在数组中的项目数量。例如，假设一个程序使用以下代码创建一个包含 100 个元素的数组，以及一个名为 `count`\
  \ 的 `int` 变量，该变量将存储在数组中的项目数量：\n\n```\nfinal int ARRAY_SIZE = 100;\nint[] array =\
  \ new int[ARRAY_SIZE];\nint count = 0;\n```\n\n每当我们向数组添加一个项目时，都必须增加 `count`。以下代码演示了：\n\
  \n```\nScanner keyboard = new Scanner(System.in);\nSystem.out.print(\"输入数字或输入 −1\
  \ 退出: \");\nnumber = keyboard.nextInt();\nwhile (number != −1 && count < array.length)\n\
  {\n   array[count] = number;\n   count++;\n   System.out.print(\"输入数字或输入 −1 退出:\
  \ \");\n   number = keyboard.nextInt();\n}\n```\n\n此哨兵控制循环的每次迭代允许用户输入一个存储在数组中的数字，或者输入\
  \ −1 退出。`count` 变量作为数组下一个可用元素的下标，然后递增。当用户输入 −1 或 `count` 达到数组大一时，循环停止。以下代码显示数组中所有的有效项目：\n\
  \n```\nfor (int index = 0; index < count; index++)\n{\n   System.out.println(array[index]);\n\
  }\n```\n\n注意，此代码使用 `count` 来确定要使用的最大数组下标。\n\n### 注意\n\n如果将部分填充的数组作为参数传递给方法，则存储数组中项目数量的变量也必须作为参数传递。否则，方法将无法确定存储在数组中的项目数量。\n\
  \n# 数组与文件的操作\n\n将数组的内容保存到文件中是一个直接的过程：使用循环遍历数组的每个元素，将其内容写入文件。例如，假设程序如下声明一个数组：\n\n\
  ```\nint[] numbers = { 10, 20, 30, 40, 50 };\n```\n\n以下代码打开名为 `Values.txt` 的文件，并将\
  \ `numbers` 数组每个元素的内容写入文件：\n\n```\nint[] numbers = { 10, 20, 30, 40, 50 };\n\n//\
  \ 打开文件。\nPrintWriter outputFile = new PrintWriter(\"Values.txt\");\n\n// 将数组元素写入文件。\n\
  for (int index = 0; index < numbers.length; index++)\n   outputFile.println(numbers[index]);\n\
  \n// 关闭文件。\noutputFile.close();\n```\n\n以下代码演示了如何打开 `Values.txt` 文件并将其内容读回 `numbers`\
  \ 数组。\n\n```\nfinal int SIZE = 5;\nint[] numbers = new int[SIZE];\nint index = 0;\
  \    // 循环控制变量\n\n// 打开文件。\nFile file = new File(\"Values.txt\");\nScanner inputFile\
  \ = new Scanner(file);\n\n// 将文件内容读入数组。\nwhile (inputFile.hasNext() && index < numbers.length)\n\
  {\n   numbers[index] = inputFile.nextInt();\n   index++;\n}\n\n// 关闭文件。\ninputFile.close();\n\
  ```\n\n打开文件，然后使用 `while` 循环将文件中所有的值读入 `numbers` 数组。只要 `inputFile.hasNext()` 返回 `true`\
  \ 且 `index` 小于 `numbers.length`，循环就会重复。调用 `inputFile.hasNext()` 方法是为了文件中剩余值。这防止了在文件不包含足够填充数组的值的情况下错误。第二个条件（`index\
  \ < numbers.length`）防止循环写入数组边界之外。\n\n## 7.5 从方法返回数组\n\n概念：除了接受数组作为参数外，方法还可以返回数组。\n\
  \n方法可以返回数组的引用。为了实现这一点，必须正确声明方法的返回类型。例如，查看以下方法定义：\n\n```\npublic static double[]\
  \ getArray()\n{\n   double[] array = { 1.2, 2.3, 4.5, 6.7, 8.9 };\n   return array;\n\
  }\n```\n\n`getArray` 方法返回一个 `double` 数组。注意方法头中的返回类型为 `double[]`。图 7-13 阐释了返回类型。\n\
  \n# 代码列表 7-14 (ReturnArray)\n\n```java\n/**\n 此程序演示了如何从方法返回\n * 数组引用。\n */\npublic\
  \ class ReturnArray\n{\n   public static void main(String[] args)\n   {\n      double[]\
  \ values;\n      values = getArray();\n      for (double num : values)\n       \
  \  System.out.print(num + \" \");\n   }\n\n   /**\n    getArray 方法\n    @return\
  \ 一个 double 数组。\n    */\n   public static double[] getArray()\n   {\n      double[]\
  \ array = { 1.2, 2.3, 4.5, 6.7, 8.9 };\n      return array;\n   }\n}\n```\n\n程序输出\n\
  \n```\n1.2 2.3 4.5 6.7 8.9\n```\n\n出现在第 12 行的语句将 `getArray` 方法返回的数组赋值给数组变量 `values`：\n\
  \n```\nvalues = getArray();\n```\n\n然后第 13 和 14 行的 `for` 循环显示 `values` 数组每个元素的值。\n\
  \n## 7.6 `String` 数组\n\n概念：可以创建 `String` 对象数组，但如果数组未初始化，数组中的每个 `String` 必须单独创建。\n\
  \nJava 还允许你创建 `String` 对象的数组。以下是创建一个带有初始化值的 `String` 对象数组的语句：\n\n```\nString[] names\
  \ = { \"Bill\", \"Susan\", \"Steven\", \"Jean\" };\n```\n\n在内存中，`String` 对象数组的排列方式与基本数据类型数组不同。为了使用\
  \ `String` 对象，你必须拥有该 `String` 对象的引用。因此，`String` 对象数组实际上是 `String` 对象引用的数组。图 7-14\
  \ 阐释了 `names` 变量将引用一个指向 `String` 对象引用的数组。\n\n# 图 7-14 `names` 变量引用一个 `String` 数组\n\
  \n\n\n\n`names` 数组中的每个元素都是对 `String` 对象的引用。`names[0]` 元素引用包含“Bill”的 `String` 对象，`names[1]`\
  \ 元素引用包含“Susan”的 `String` 对象，依此类推。代码列表 7-15 程序展示了一个 `String` 对象的数组。\n\n在下方的动画中，点击“上一个”或“下一个”按钮可以逐步查看代码并看到全程的解释。\n\
