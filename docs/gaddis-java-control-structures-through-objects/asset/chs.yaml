  \n## 7.4 一些常用的数组算法和操作 比较数组\n\n在上一节中，你看到不能简单地将一个数组的引用变量赋值另一个数组的引用变量来复制数组。此外，你不能使用\
  \ `==` 运算符来比较两个数组引用变量并判断数组是否相等。例如，以下代码似乎在比较两个数组，但实际上并没有：\n\n```\nint[] firstArray\
  \ = { 5, 10, 15, 20, 25 };\nint[] secondArray = { 5, 10, 15, 20, 25 };\nif (firstArray\
  \ == secondArray)       // 这是一个错误。\n   System.out.println(\"The arrays are the same.\"\
  );\nelse\n   System.out.println(\"The arrays are not the same.\");\n```\n\n当你对引用变量使用\
  \ `==` 运算符（包括引用数组的变量）时，运算符比较的是变量所包含的内存地址，而不是变量所引用对象的内容。由于此代码中的两个数组变量引用内存中不同的对象，它们将包含不同的地址。因此，布尔表达式\
  \ `firstArray == secondArray` 的结果为 `false`，代码报告数组不相等。\n\n要比较两个数组的内容，你必须比较这两个数组的元素。例如，看下方的代码：\n\
  \n```\nint[] firstArray = { 2, 4, 6, 8, 10 };\nint[] secondArray = { 2, 4, 6, 8,\
  \ 10 };\nboolean arraysEqual = true;    // 标记变量\nint index = 0;                \
  \ // 循环控制变量\n\n// 首先确定数组的大小是否相同。\nif (firstArray.length != secondArray.length)\n\
  \   arraysEqual = false;\n\n// 接下来确定元素是否包含相同的数据。\nwhile (arraysEqual && index <\
  \ firstArray.length)\n{\n   if (firstArray[index] != secondArray[index])\n     \
  \ arraysEqual = false;\n   index++;\n}\n\nif (arraysEqual)\n   System.out.println(\"\
  The arrays are equal.\");\nelse\n  System.out.println(\"The arrays are not equal.\"\
  );\n```\n\n这段代码确定了 `firstArray` 和 `secondArray` 是否包含相同的值。使用一个初始化为 `true` 的布尔标记变量\
  \ `arraysEqual` 来指示数组是否相等。另一个初始化为 0 的变量 `index` 被用作循环控制变量。\n\n首先，这段代码确定两个数组的长度是否相同。如果长度不同，则数组就不相等，因此标记变量\
  \ `arraysEqual` 被设为 `false`。然后开始一个 `while` 循环。只要 `arraysEqual` 为 `true` 且控制变量 `index`\
  \ 小于 `firstArray.length`，循环就会执行。在每次迭代期间，它都会比较数组中一组不同的对应元素。当它发现两个值不同的对应元素时，标记变量 `arraysEqual`\
  \ 被设为 `false`。循环结束后，用 `if` 语句检查 `arraysEqual` 变量。如果变量为 `true`，则数组相等并显示相应的消息。否则，它们不相等，显示另一条消息。\n\
  \n## 求数值数组中值的和\n\n要计算数组中值的总和，你必须使用带有累加变量的循环。循环将每个数组元素的值加到累加器上。例如，假设以下语句出现在程序中，并且值已经存储在：\n\
  \n```\nint[] units = new int[25];\n```\n\n下面的循环相加 `units` 数组的值。当代码完成后，`total` 将包含总和。\n\
  \n```\nint total = 0;\nfor (int index = 0; index < units.length; index++)\n   total\
  \ += units[index];\n```\n\n## 获取数值数组中值的平均值\n\n计算数组平均值的第一步是求总和。第二步是将总和除以元素个数。假设以下语句出现在程序中：\n\
  \n```\ndouble[] scores = new double[10];\n```\n\n以下代码计算 `scores` 数组的平均值。当代码完成时，`average`\
  \ 将存储在：\n\n```doubledouble total = 0;\nfor (int index = 0; index < scores.length;\
  \ index++)\n   total += scores[index];\ndouble average = total / scores.length;\n\
  ```\n\n注意最后一条语句不在循环内部。\n\n## 寻找数值数组中的最大值和最小值\n\n寻找数组中最大值和最小值的算法非常相似。首先，让我们来看寻找最高值的代码。假设以下语句存在于程序中：\n\
  \n```\nint[] numbers = new int[50];\n```\n\n寻找数组中最高值的代码如下：\n\n```\nint highest =\
  \ numbers[0];\nfor (int index = 1; index < numbers.length; index++)\n{\n   if (numbers[index]\
  \ > highest)\n      highest = numbers[index];\n}\n```\n\n首先将第一个元素的值复制给变量 `highest`。然后循环将从\
  \ 1 开始的数组剩余部分与 `highest` 进行比较。每当发现数组中大于 `highest` 的值时，就将该值复制给 `highest`。循环结束后，`highest`\
  \ 将包含数组中的值。\n\n下面的代码寻找数组中的最小值。你可以看到，它与寻找最高值的代码几乎相同。\n\n```\nint lowest = numbers[0];\n\
  for (int index = 1; index < numbers.length; index++)\n{\n   if (numbers[index] <\
  \ lowest)\n      lowest = numbers[index];\n}\n```\n\n循环结束后，`lowest` 将包含数组中的最小值。\n\
  \n## `SalesData` 类\n\n为了演示这些算法，请看代码列表 7-10 所示的 `SalesData` 类。该类的实例在数组中保留任意天数的销售金额，这是一个私有字段。提供了公共方法来返回销售总额、平均值、最高和最低销售金额。代码列表\
  \ 7-11 中的程序演示了该类，而图 7-11 显示了与程序交互的示例。\n\n# 代码列表 7-10 `(SalesData.java)`\n\n\n\n\n\
  \n```java\n/**\n * 该类在数组中保存若干天的销售额数字，\n * 并提供了获取总销售额、平均销售额、\n * 以及最高和最低销售额的方法。\n\
  \ */\npublic class SalesData\n{\n    private double[] sales; // 销售数据\n\n    /**\n\
  \       构造函数将数组中的元素\n       拷贝到到 sales 数组中。\n       @param s 待拷贝的数组。\n    */\n \
  \   public SalesData(double[] s)\n    {\n       // 创建一个与 s 等大的数组。\n       sales\
  \ = new double[s.length];\n\n       // 将元素从 s 拷贝到 sales。\n       for (int index\
  \ = 0; index < s.length; index++)\n          sales[index] = s[index];\n    }\n\n\
  \    /**\n       getTotal 方法\n       @return sales 数组中元素的总和。\n    */\n    public\
  \ double getTotal()\n    {\n       double total = 0.0;      // 累加器\n\n       //\
  \ 累加 sales 数组中\n       // 元素的总和。\n       for (int index = 0; index < sales.length;\
  \ index++)\n          total += sales[index];\n\n       // 返回总和。\n       return total;\n\
  \    }\n\n    /**\n       getAverage 方法\n       @return sales 数组中\n       // 元素的平均值。\n\
  \    */\n    public double getAverage()\n    {\n       return getTotal() / sales.length;\n\
  \    }\n\n    /**\n       getHighest 方法\n       @return sales 数组中存储\n       // 最高值。\n\
  \    */\n    public double getHighest()\n    {\n       double highest = sales[0];\n\
  \n       for (int index = 1; index < sales.length; index++)\n       {\n        \
  \  if (sales[index] > highest)\n             highest = sales[index];\n       }\n\
  \n       return highest;\n    }\n\n    /**\n       getLowest 方法\n       @return\
  \ sales 数组中存储\n       // 最低值。\n    */\n    public double getLowest()\n    {\n  \
  \     double lowest = sales[0];\n\n       for (int index = 1; index < sales.length;\
  \ index++)\n       {\n          if (sales[index] < lowest)\n             lowest\
  \ = sales[index];\n       }\n\n       return lowest;\n    }\n}\n```\n\n# 代码列表 7-11\
  \ `(Sales.java)`\n\n```java\nimport javax.swing.JOptionPane;\n\n/**\n * 该程序收集一周的销售额。\n\
  \ * 它使用 SalesData 类来显示总额、\n * 平均值、最高值和最低销售额。\n */\npublic class Sales\n{\n    public\
  \ static void main(String[] args)\n    {\n       final int ONE_WEEK = 7; // 元素数量\n\
  \n       // 创建一个数组来存储一周的销售额。\n       double[] sales = new double[ONE_WEEK];\n\n\
  \       // 获取一周的销售数字。\n       getValues(sales);\n\n       // 创建一个 SalesData 对象，用\n\
  \       // 一周的销售数字初始化。\n       SalesData week = new SalesData(sales);\n\n      \
  \ // 显示本周的总额、平均、最高和最低\n       // 销售额。\n       JOptionPane.showMessageDialog(null,\n\
  \          String.format(\"总销售额为 $.2f\\n\" +\n                       \"平均销售额为 $.2f\\\
  n\" +\n                       \"最高销售额为 $.2f\\n\" +\n                       \"最低销售额为\
  \ $.2f\",\n                       week.getTotal(),\n                       week.getAverage(),\n\
  \                       week.getHighest(),\n                       week.getLowest()));\n\
  \       System.exit(0);\n    }\n\n    /**\n     * getValues 方法要求用户输入\n     * 数组中每个元素的销售额。\n\
  \     * @param array 用于存储数值的数组。\n     */\n    private static void getValues(double[]\
  \ array)\n    {\n       String input; // 用于存储输入。\n\n       // 获取每周每天的销售额。\n    \
  \   for (int i = 0; i < array.length; i++)\n       {\n          input = JOptionPane.showInputDialog(\n\
  \                    \"输入第 \" + (i + 1) + \"天的销售额。\");\n          array[i] = Double.parseDouble(input);\n\
  \       }\n    }\n}\n```\n\n# 图 7-11 与 `Sales.java` 程序的交互 (Oracle Counsel)\n\n![与\
  \ Sales dot java 程序的交互由 7 个生成消息的对话框组成。](img/07fig11.png)\n\n# 焦点聚焦：创建一个处理数组的对象\n\
  \nLaClaire 博士在她的化学课学期内会进行多次考试。在学期结束时，她在计算平均分之前会扣除每个学生的最低分。她要求你写一个程序，读取学生的考试分数作为输入，并计算扣除最低分后的平均分。\n\
  \n以下伪代码显示了计算一组测试分数平均分（扣除最低分）的步骤：\n\n* 计算分数的总和。\n* 找到最低分。\n* 从总和中减去最低分。得到调整后的总和。\n\
  * 将调整后的总和除以（分数数量 - 1）。这就是平均分。\n\n你决定创建一个名为 `Grader` 的类，并带有一个接受 `double` 类型的测试分数数组的构造函数。`Grader`\
  \ 类将有一个名为 `getLowestScore` 的方法，返回数组中的最低分，以及一个名为 `getAverage` 的方法，返回扣除最低分后的平均分数。图\
  \ 7-12 显示了该类的 UML 图。\n\n# 图 7-12 `Grader` 类的 UML 图\n\n![Grader 类的 UML 图分为三个矩形区域。](img/07fig12.png)\n\
