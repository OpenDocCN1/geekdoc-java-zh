  \n# 挑战\n\n# 1. `Employee` 和 `ProductionWorker` 类\n\n## 观看 Employee 和 ProductionWorker\
  \ 类\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_10_03_employee_and_productionw`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_10_03_employee_and_productionw)\n\
  \n设计一个名为 `Employee` 的类。该类应在字段中保留以下信息：\n*   姓名\n*   格式为 XXX–L 的员工编号，其中每个 X 是 0–9\
  \ 之间的数字，L 是 A–M 范围内的字母。\n*   入职日期\n\n为该类编写一个或多个构造函数以及相应的访问器（accessor）和修改器（mutator）方法\n\
  \n接下来，编写一个名为 `ProductionWorker` 的类，它继承自 `Employee` 类。`ProductionWorker` 类应该拥有字段来存储以下信息：\n\
  *   班次（一个整数）\n*   时薪率（一个 `double`）\n\n工作日分为两个班次：日班和夜班。`shift` 字段是一个代表员工工作班次的整数值。日班是班次\
  \ 1，夜班是班次 2。为该类编写一个或多个构造函数以及相应的访问器和修改器方法。通过编写一个使用 `ProductionWorker` 对象的程序来演示这些类。\n\
  \n# 2. `ShiftSupervisor` 类\n\n在特定的工厂中，班主管（shift supervisor）是负责监督班次的薪薪制员工。除了工资外，当其班次达到生产目标时，班主管还会年度奖金。设计一个\
  \ `ShiftSupervisor` 类，它继承自编程挑战 1 中创建的 `Employee` 类。`ShiftSupervisor` 类应该有一个持有年薪的字段，以及一个持有班主管获得的年度生产奖金的字段。为该类编写一个或多个构造函数以及相应的访问器和修改器方法。通过编写一个使用\
  \ `ShiftSupervisor` 对象的程序来演示该类。\n\n# 3. `TeamLeader` 类\n\n在特定的工厂中，团队组长（team leader）是带领小团队的按时付费生产工人。除了时薪，团队组长还获得固定的月奖金。团队组长每年需要参加最低小时数的培训。设计一个\
  \ `TeamLeader` 类，它继承自你在挑战 1 中设计的 `ProductionWorker` 类。`TeamLeader` 类应该拥有月奖金金额、所需的培训小时数团队组长已参加的培训小时数的字段。为该类编写一个或多个构造函数以及相应的访问器和修改器方法。通过编写一个使用\
  \ `TeamLeader` 对象的程序来演示该类。\n\n# 4. `Essay` 类\n\n设计一个 `Essay` 类，继承本章介绍的 `GradedActivity`\
  \ 类。`Essay` 类应该确定学生论文获得的成绩。学生的论文得分可达 100 分，并按以下方式确定：\n*   语法：30 分\n*   拼写：20 分\n\
  *   长度正确：20 分\n*   内容：30 分\n\n在一个简单的程序中演示该类。\n\n# 5. 课程成绩\n\n在一门课程中，老师给出了以下测试和作业：\n\
  *   一项由老师观察并分配数值评分的**实验活动**（lab activity）。\n*   一次包含 10 道题的**通过/不通过考试**（pass/fail\
  \ exam）。最低合格分为 70 分。\n*   一篇分配数值评分的**论文**（essay）。\n*   一次包含 50 道题的**期末考试**（final\
  \ exam）。\n\n编写一个名为 `CourseGrades` 的类。该类应该有一个名为 `grades` 的 `GradedActivity` 数组字段。该数组应该四个元素，对应之前描述的每个作业。该类应该具有以下方法：\n\
  \n| 方法 |  |\n| :--- | :--- |\n| `setLab` | 该方法接受一个 `GradedActivity` 对象作为参数。该对象已经包含了学生的实验活动评分。`grades`字段的元素\
  \ 0 应该引用该对象。 |\n| `setPassFailExam` | 该方法接受一个 `PassFailExam` 对象作为参数。该对象已经包含了学生的通过/不通过考试评分。`grades`字段的元素\
  \ 1 应该引用该对象。 |\n| `setEssay` | 该方法接受一个 `Essay` 对象作为参数。（如果你还没有完成挑战 4，请改用 `GradedActivity`\
  \ 对象。）该对象已经包含了学生的论文评分。`grades`字段的元素 2 应该引用该对象。 |\n| `setFinalExam` | 该方法接受一个 `FinalExam`\
  \ 对象作为参数。该对象已经包含了学生的期末考试评分。`grades`字段的元素 3 应该引用该对象。 |\n| `toString` | 该方法返回一个包含\
  \ `grades` 数组中每个元素的数值评分和成绩的字符串。 |\n\n在程序中演示该类。\n\n# 6. `Analyzable` 接口\n\n修改你在挑战\
  \ 5 中创建的 `CourseGrades` 类，使其实现以下接口：\n\n```\npublic interface Analyzable {\n   double\
  \ getAverage();\n   GradedActivity getHighest();\n   GradedActivity getLowest();\n\
  }\n```\n\n`getAverage` 方法应该返回 `grades` 数组中存储的评分的平均值。`getHighest` 方法应该返回 `grades`\
  \ 数组中数值最高的元素引用。`getLowest` 方法应该返回 `grades` 数组中数值最低元素的引用。在一个完整的程序中演示这些新方法。\n\n# 7.\
  \ `Person` 和 `Customer` 类\n\n设计一个名为 `Person` 的类，具有持有人的姓名、地址和电话号码的字段。为这些字段编写一个或多个构造函数以及相应的修改器和访问器方法。\n\
  \n接下来，设计一个名为 `Customer` 的类，它继承自 `Person` 类。`Customer` 类应该有一个客户编号的字段和一个指示客户是否希望加入邮件列表的\
  \ `boolean` 字段。为这些字段编写一个或多个构造函数以及相应的修改器和访问器方法。在一个简单的程序中演示 `Customer` 类的对象。\n\n#\
  \ 8. `PreferredCustomer` 类\n\n一家零售店有一项优惠客户计划，客户可以根据所有的购买获得折扣。客户的折扣金额取决于客户在商店的累计购买金额，如下：\n\
  *   当优惠客户花费 500 美元时，其未来的所有购买将获得 5% 的折扣。\n\n\n\n\n\n*   当优惠客户消费满 $1,000 时，其未来的购买可享受\
  \ 6% 的折扣。\n*   当优惠客户消费满 $1,500 时，其未来的购买可享受 7% 的折扣。\n*   当优惠客户消费满 $2,000 或更多时，其未来的购买可享受\
  \ 10% 的折扣。\n\n设计一个名为 `PreferredCustomer` 的类，它继承自你在编程挑战 7 中创建的 `Customer` 类。`PreferredCustomer`\
  \ 类应包含客户购买金额和客户折扣等级的字段。为该类编写一个或多个构造函数，以及针对字段的相应修改器（mutator）和访问器（accessor）。在一个简单的程序中演示该类。\n\
  \n# 9. `BankAccount` 和 `SavingsAccount` 类\n\n设计一个名为 `BankAccount` 的抽象类，用于存储银行账户的数据：\n\
  \n*   余额\n*   本月存款次数\n*   取款次数\n*   年利率\n*   每月服务费\n\n该类应包含以下方法：\n\n| 构造函数: | 构造函数应接受余额和年利率作为参数。\
  \ |\n| `deposit`: | 一个接受存款金额作为参数的方法。该方法应将参数加到账户余额中。它还应该增加存储存款次数的变量。 |\n| `withdraw`:\
  \ | 一个接受取款金额作为参数的方法。该方法应从余额中减去该参数。它还应该增加存储取款次数的变量。 |\n| `calcInterest`: | 一个通过计算账户赚取的每月利息并将其加余额中来更新余额的方法。这通过以下公式执行：$\\\
  begin{array}{l} \\textit{Mothly Interest Rate = (Annual Interest Rate/12)} \\\\\
  \ {\\textit{Mothly}\\textit{Interest = Balance * Monthly Interest Rate}} \\\\ \\\
  textit{Balance = Balance + Monthly Interest} \\end{array}$ |\n| `monthlyProcess`:\
  \ | 一个从余额中减去每月服务费、调用 `calcInterest` 方法，然后将存储取款次数、存款次数和每月服务费的变量设置为零的方法。 |\n\n接下来，设计一个自\
  \ `BankAccount` 的 `SavingsAccount` 类。`SavingsAccount` 类应有一个状态字段来表示账户的激活或非激活。如果储蓄账户的余额低于\
  \ $25，它将变为非激活状态（`status` 字段可以是 `boolean` 变量）。在余额恢复到 $25 以上之前，不再允许任何取款，此时账户将重新变为激活。储蓄账户类应包含以下方法：\n\
  \n| `withdraw`: | 一个在进行取款之前判断账户是否为非激活的方法。（如果账户未激活，则不允许任何取款）。然后通过调用父类的同名方法执行取款。 |\n\
  | `deposit`: | 一个在进行存款之前判断账户是否为非激活的方法。如果账户是非激活状态且存款使余额升至 $25 以上，账户将重新激活。然后通过调用父类的同名方法执行存款。\
  \ |\n| `monthlyProcess`: | 在调用父类方法之前，此方法检查取款次数。如果本月的取款次数超过 4 次，则每个超过 4 次的额外取款将增加\
  \ $1 的服务费，并加到存储每月服务费的父类字段中。（不要忘记在扣除服务费后检查账户余额。如果余额低于 $25，账户将变为非激活状态。） |\n\n# 10.\
  \ `Ship`、`CruiseShip` 和 `CargoShip` 类\n\n设计一个 `Ship` 类，包含以下成员：\n\n*   船名的名的字段（字符串）。\n\
  *   船只建造年份的字段（字符串）。\n*   一个构造函数以及相应的访问器和修改器。\n*   一个显示船名和建造年份的 `toString` 方法。\n\n\
  设计一个继承自 `Ship` 的 `CruiseShip` 类。`CruiseShip` 类应包含以下成员：\n\n*   最大乘客人数字段（`int`）。\n\
  *   一个构造函数以及相应的访问器和修改器。\n*   一个覆盖基类中 `toString` 方法的 `toString` 方法。`CruiseShip` 类的\
  \ `toString` 方法应只显示船名和最大乘客人数。\n\n设计一个继承自 `Ship` 的 `CargoShip` 类。`CargoShip` 类应包含以下成员：\n\
  \n*   货物载量吨位（`int`）。\n*   一个构造函数以及相应的访问器和修改器。\n*   一个覆盖基类中 `toString` 方法的 `toString`\
  \ 方法。`CargoShip` 类的 `toString` 方法应只显示船名和货物载量。\n\n在一个包含 `Ship` 数组的程序中演示这些类。将各种 `Ship`、`CruiseShip`\
  \ 和 `CargoShip` 对象赋值给数组元素。程序随后应遍历数组，调用每个对象的 `toString` 方法。（请参见 [代码列表 10-25] 作为示例。）\n\
  \n# 第 11 章 异常与高级文件 I/O\n\n# 题目录\n\n1. [11.1 处理异常]\n2. [11.2 抛出异常]\n3. [11.3 高级主题：二进制文件、随机访问文件和对象序列化]\n\
  4. [11.4 需要避免的常见错误]\n\n# 11.1 处理异常\n\n概念：异常是由于错误或意外事件而产生的对象。为了防止异常导致程序崩溃，你必须编写检测并处理它们的代码。\n\
  \n# 查看处理异常\n\n在 Java 应用程序运行时可能会发生许多错误情况会导致执行停止。到目前，你可能已经经历过很多次。例如，查看 [代码列表 11-1]\
  \ 中的程序。该程序尝试读取数组边界之外的内容。\n\n```\n 1 /**\n 2    此程序会导致错误并崩溃。\n 3 */\n 4\n 5 public\
  \ class BadArray\n 6 {\n 7    public static void main(String[] args)\n 8    {\n\
  \ 9       // 创建一个包含 3 个元素的数组。\n 10       int[] numbers = { 1, 2, 3 };\n 11\n 12\
  \       // 尝试读取超出数组\n 13       // 边界的内容。\n 14       for (int i = 0; i <= 3; i++)\n\
  \ 15          System.out.println(numbers[i]);\n 16    }\n 17 }\n```\n\n程序输出\n\n\
  ```\n1\n 2\n 3\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException\n\
  \         at BadArray.main(BadArray.java:15)\n```\n\n# 代码列表 11-1 `(BadArray.java)`\n\
  \n此程序中的 `numbers` 数组只有三个元素，下标为 0 到 2。当程序尝试读取 `numbers[3]` 时，程序会崩溃，并显示与程序输出结尾类似的错误消息。此消息表示发生了异常，并提供了有关该异常的信息。*异常*是由于错误或意外事件而在内存中产生的对象。当异常产生时，说它被“抛出”了。除非异常被应用程序检测并处理，否则它会导致应用程序停止。\n\
  \n\n\n\n\n为了检测异常是否抛出并防止其导致你的应用程序停止，Java 允许你创建异常处理器。`异常处理器`（exception handler）是当异常抛出时能够优雅响应异常的代码段。拦截和响应异常的过程被称为`异常处理`（exception\
  \ handling）。如果你的代码在异常抛出时没有处理它，将由`默认异常处理器`（default exception handler）来处理，如代码列表 11-1\
  \ 所示。默认异常处理器会打印错误信息并导致程序崩溃。\n\n代码列表 11-1 中导致异常抛出的错误是很容易避免的。如果循环写得正确，它将不会尝试读取数组边界之外的内容。然而，某些错误是由应用程序之外的条件引起的，是无法避免。例如，假设一个应用程序在磁盘上创建一个文件，然后用户删除了它。随后应用程序尝试打开该文件进行读取，由于文件不存在，便发生了错误。结果就是抛出了一个异常。\n\
  \n# 异常类\n\n如前所述，异常是一个对象。异常对象是由 Java API 中的类创建的。API 拥有广泛的异常类层次结构。图 11-1 中显示了该层次结构的一部分。\n\
  \n## 图 11-1 异常类层次结构的一部分\n\n![异常类的层次结构因编程错误而变得复杂。](img/11fig01.png)图 11-1 完整替代文本\n\
  \n如你所示，层次结构中的所有类都继承自 `Throwable` 类。紧接 `Throwable` 类下方的是 `Error` 和 `Exception` 类。继承自\
  \ `Error` 的类用于发生严重错误时抛出的异常，例如 Java 虚拟机内部错误或内存耗出。你的应用程序不应该尝试处理这些错误，因为它们是严重状况的结果。\n\
  \n你将处理的所有异常都是继承自 `Exception` 的类的实例。图 11-1 显示了其中两个类：`IOException` 和 `RuntimeException`。这些类也作为父类使用。`IOException`\
  \ 是与输入输出操作相关的异常的父类。`RuntimeException` 是由编程错误（如数组下标越界）引起的异常的父类。\n\n图 11-1 中的图表显示了继承自\
  \ `IOException` 两个类：`EOFException` 和 `FileNotFoundException`。这些是创建异常对象的类示例。当应用程序尝试读取文件末尾之外的内容时会抛出\
  \ `EOFException` 对象；当应用程序尝试打开一个不存在的文件时，会抛出 `FileNotFoundException` 对象。\n\n### 注意\n\
  \n异常类存在于 Java API 的包中。例如，`FileNotFoundException` 位于 `java.io` 包中。当你处理一个不在 `java.lang`\
  \ 包中的异常时，你需要适当的 `import`语句。\n\n# 处理异常\n\n要处理异常，你使用 `try` 语句。我们将查看 `try` 语句的几种变体，从以下通用格式开始：\n\
  \n```java\ntry\n {\n    (try block statements . . . ) \n }\n catch (ExceptionType\
  \ parameterName)\n {\n    (catch block statements . . . )\n }\n```\n\n首先出现关键字 `try`。接下来在大括号内出现一段代码，括号是必须的。这段代码被称为\
  \ `try 块`（try block）。`try 块` 是一个或多个被执行并可能抛出异常的语句。你可以将 try 块中的代码认为是受“保护”的，因为如果 try\
  \ 块抛出异常，应用程序不会停止。\n\n在 try 块之后，会出现 `catch` 子句。`catch` 子句以关键字 `catch` 开头，后面跟着 `(ExceptionType\
  \ parameterName)`。这是一个参数变量声明，其中 `ExceptionType` 是异常类的名称，`parameterName` 是变量名。如果\
  \ try 块中的代码抛出了 `ExceptionType` 类的异常，那么参数变量将引用该异常对象。此外，紧随 `catch` 子句的代码将被执行。紧随 `catch`\
  \ 子句的代码被称为 `catch 块`（catch block）。再次，大括号是必须的。\n\n让我们来看一个使用 `try` 语句的代码示例。以下 try\
  \ 块中的语句尝试打开文件 `MyFile.txt`。\n\n```java\ntry\n {\n    File file = new File(\"MyFile.txt\"\
  );\n    Scanner input = new Scanner(file);\n }\n catch (FileNotFoundException e)\n\
   {\n    System.out.println(\"File not found.\");\n }\n```\n\n如果文件不存在，`Scanner` 将抛出一个\
  \ `FileNotFoundException` 异常。\n\n让我们仔细看。首先，执行 try 块中的代码。如果这段代码抛出异常，Java 虚拟机将寻找能够处理该异常的\
  \ `catch` 子句。为了让 `catch` 子句能够处理异常，其参数必须与异常类型兼容。这里是 `catch` 子句：\n\n```java\ncatch\
  \ (FileNotFoundException e)\n```\n\n此 `catch` 子句声明了一个名为 `e` 的参数变量。`e` 可以引用 `FileNotFoundException`\
  \ 类型的对象。如果 try 块抛出 `FileNotFoundException` 异常，`e` 将引用该异常对象，并执行 catch 块。在这种情况下，将打印“File\
  \ not found.”。\n\n### 注意\n\nJava API 文档列出了每个方法可能抛出的所有异常。\n\n代码列表 11-1 显示了一个要求用户输入文件名并尝试打开该文件的程序。如果文件不存在，将打印错误信息。图\
  \ 11-2 和 11-3 展示了与程序交互的示例。\n\n# 代码列表 11-2 `(OpenFile.java)`\n\n```java\nimport java.io.File;\n\
  import java.io.FileNotFoundException;\nimport java.util.Scanner;\n\npublic class\
  \ OpenFile {\n    public static void main(String[] args) {\n        System.out.print(\"\
  Enter a filename: \");\n        Scanner in = new Scanner(System.in);\n        String\
  \ fileName = in.nextLine();\n        try {\n            File file = new File(fileName);\n\
  \            Scanner input = new Scanner(file);\n        } catch (FileNotFoundException\
  \ e) {\n            System.out.println(\"File not found.\");\n        }\n    }\n\
  }\n```\n\n\n\n\n查看图 11-2 所示的程序运行示例。用户输入 `BadFile.txt` 作为文件名。在第 25 行，即 `try` 块内部的第一条语句中，创建了一个\
  \ `File` 对象并将此名称传递给 `File` 构造函数。在第 26 行，将 `File` 对象的引用传递给 `Scanner` 构造函数。由于 `BadFile.txt`\
  \ 不存在，`Scanner` 类构造函数抛出了一个 `FileNotFoundException` 类的异常。当抛出异常时，程序立即退出 `try` 块，跳过该块中剩余的语句（第\
  \ 27 行到第 28 行）。程序跳转到第 30 行的 `catch` 子句，该子句有一个 `FileNotFoundException` 参数，并执行随其后的\
  \ `catch` 块。图 11-4 展示了这一系列事件。\n\n## 图 11-4 带有异常的事件序列\n\n![通过语句的图示来识别带有异常的事件序列。](img/11fig04.png)图\
  \ 11-4 完整备用文本\n\n注意，在执行 `catch` 块之后，程序将从紧接在 `try`/`catch` 结构之后的语句继续运行。该语句位于第 36\
  \ 行，显示消息“Done.”。\n\n现在查看图 11-3 所示所示的程序运行示例。在这种情况下，用户输入了 `GoodFile.txt`，这是一个存在的文件名。`try`\
  \ 块中没有抛出异常，因此程序跳过了 `catch` 子句及其 `catch` 块，直接跳转到第 36 行紧随 `try/catch` 结构之后的语句。该语句显示消息“Done.”。图\
  \ 11-5 展示了这一系列事件。\n\n## 图 11-5 不带异常的事件序列\n\n![通过语句的图示来识别没有异常的事件序列。](img/11fig05.png)图\
  \ 11-5 完整备用文本\n\n## 获取默认消息\n\n每个异常对象都有一个名为 `getMessage` 的方法，可以使用它来获取异常的默认错误消息。这与异常未被处理且应用程序停止时显示的相同相同。代码列表\
  \ 11-3 中的程序演示了 `getMessage` 方法。这是代码列表 11-2 中程序的修改版本。图 11-6 显示了程序的运行情况。在图中，用户输入了一个不存在的文件名。\n\
  \n## 图 11-6 与 ExceptionMessage.java 的交互（假设 BadFile.txt 不存在）\n\n![显示与 ExceptionMessage.java\
  \ 程序的交互，假设用户的示例 BadFile.txt 不存在。](img/11fig06.png)图 11-6 完整备用文本\n\n```java\n1 import\
  \ java.io.*;                 // 用于文件/O 类\n2 import java.util.Scanner;         //\
  \ 用于 Scanner 类\n3 import javax.swing.JOptionPane;   // 用于 JOptionPane 类\n4\n5 /**\n\
  6    此程序演示了如何处理 FileNotFoundException\n7    异常。\n8 */\n9\n10 public class ExceptionMessage\n\
  11 {\n12    public static void main(String[] args)\n13    {\n14       File file;\
  \                  // 用于文件输入\n15       Scanner inputFile;          // 用于文件输入\n16\
  \       String fileName;            // 用于存储文件名\n17\n18       // 从用户处获取文件名。\n19 \
  \      fileName = JOptionPane.showInputDialog(\"Enter \" +\n20                 \
  \                  \"the name of a file:\");\n21\n22       // 尝试打开文件。\n23      \
  \ try\n24       {\n25          file = new File(fileName);\n26          inputFile\
  \ = new Scanner(file);\n27          JOptionPane.showMessageDialog(null,\n28    \
  \                         \"The file was found.\");\n29       }\n30       catch\
  \ (FileNotFoundException e)\n31       {\n32          JOptionPane.showMessageDialog(null,\
  \ e.getMessage());\n33       }\n34       JOptionPane.showMessageDialog(null, \"\
  Done.\");\n35       System.exit(0);\n36    }\n37 }\n```\n\n## 代码列表 11-3 (ExceptionMessage)\n\
  \n代码列表 11-4 展示了另一个示例。该程序强制 Integer 包装类的 parseInt 方法抛出异常。\n\n```java\n1 /**\n2  \
  \  此程序演示了 Integer.parseInt\n3    方法抛出一个异常。\n4 */\n5 public class ParseError\n6 {\n\
  7    public static void main(String[] args)\n8    {\n9        String str = \"abcde\"\
  ;\n10       int number;\n11\n12       try\n13       {\n14          number = Integer.parseInt(str);\n\
  15        }\n16       catch (NumberFormatException e)\n17        {\n18         \
  \  System.out.println(\"Conversion error: \" +\n19                             \
  \ e.getMessage());\n20        }\n21    }\n22 }\n```\n\n程序输出\n\n```\nConversion error:\
  \ For string \"abcde\"\n```\n\n## 代码列表 11-4 (ParseError)\n\n数值包装类的“parse”方法在转换的字符串不包含数值时，都会抛出\
  \ NumberFormatException 类型的异常。\n\n## 异常的多态引用\n\n回想第 10 章，超类类型的引用变量可以引用子类对象。这被称为多态。在处理异常时，可以使用多态引用作为\
  \ catch 子句的参数。例如，我们处理过的所有异常都继承自 Exception 类。因此，使用 Exception 类型作为参数的 catch 子句能够捕获任何继承自\
  \ Exception 的异常。例如，代码列表 11-4 中的 try 语句可以写如下：\n\n```java\ntry\n{\n   number = Integer.parseInt(str);\n\
  }\ncatch (Exception e)\n{\n   System.out.println(\"Conversion error: \" +\n    \
  \                  e.getMessage());\n}\n```\n\n尽管 Integer 类的 parseInt 方法抛出的是 NumberFormatException\
  \ 对象，这段代码仍然有效，因为 NumberFormatException 类继承自 Exception 类。\n\n## 使用多个 catch 子句处理多个异常\n\
  \n我们到为止学习的程序只测试了单一类型的异常。但在许多情况下，try 块中的代码可能会抛出多种类型的异常。在这种情况下，你需要为每种可能抛出的异常类型编写一个\
  \ catch 子句。\n\n例如，代码列表 11-5 中的程序读取名为 SalesData.txt 的文件的内容。文件中的每行包含一个月的销售额，该文件有多行。以下是文件的内容：\n\
  \n```\n24987.62\n26978.97\n32589.45\n31978.47\n22781.76\n29871.44\n```\n\n\n\n\n\
  代码列表 11-5 中的程序从文件中读取每个数字并将其累加到一个累加变量中。`try` 块包含可能抛出不同类型异常的代码。例如，如果未找到文件，`Scanner`\
  \ 类的构造函数可能会抛出 `FileNotFoundException`；如果从文件中读取到非数值值，`Scanner` 类的 `nextDouble` 方法可能会抛出\
  \ `InputMismatchException`（该异常位于 `java.util` 包中）。为了处理这些异常，`try` 语句有两个 `catch` 子句。图\
  \ 11-7 显示了程序在未发生错误时弹出的对话话框。该对话框由第 51 行至第 56 行的语句显示。图 11-8 显示了当找不到文件时，第 62 行至第 64\
  \ 行的语句显示的对话话框。\n\n![当未发生错误时，Sales Report dot java 程序显示出一个对话框。消息框包含消息：Number of months:\
  \ 6\\. Total Sales: $169,187.71\\. Average Sales: $28,197.95.](img/11fig07.png)\n\
  \n# 图 11-7 当未发生错误时，`SalesReport.java` 程序显示的对话话框（Oracle 公司法律顾问）\n\n![当找不到文件时，Sales\
  \ Report dot java 程序显示出一个对话框。消息框包含消息：The file Sales dot Data dot t x t does not\
  \ exist.](img/11fig08.png)\n\n# 图 11-8 当找不到文件时，`SalesReport.java` 程序显示的对话话框（Oracle\
  \ 公司法律顾问）\n\n```\n 1 import java.io.*;    // 用于 File 类和 FileNotFoundException\n\
    2 import java.util.*;  // 用于 Scanner 和 InputMismatchException\n  3 import javax.swing.JOptionPane;\
  \ // 用于 JOptionPane 类\n  4\n  5 /**\n  6    此程序演示了如何用一个 try 语句\n  7    捕获多个异常。\n\
    8 */\n  9\n  10 public class SalesReport\n  11 {\n  12    public static void main(String[]\
  \ args)\n  13    {\n  14       String filename = \"SalesData.txt\"; // 文件名\n  15\
  \       int months = 0;                    // 月份计数器\n  16       double oneMonth;\
  \                   // 单月销售额\n  17       double totalSales = 0.0;           // 总销售额\n\
    18       double averageSales;               // 平均销售额\n  19\n  20       try\n \
  \ 21       {\n  22          // 打开文件。\n  23          File file = new File(filename);\n\
    24          Scanner inputFile = new Scanner(file);\n  25\n  26          // 处理文件内容。\n\
    27          while (inputFile.hasNext())\n  28          {\n  29             //\
  \ 获取一个月的销售额。\n  30             oneMonth = inputFile.nextDouble();\n  31\n  32  \
  \           // 累加金额。\n  33             totalSales += oneMonth;\n  34\n  35     \
  \        // 增加月份计数器\n  36             months++;\n  37          }\n  38\n  39   \
  \       // 关闭文件。\n  40          inputFile.close();\n  41\n  42          // 计算平均值。\n\
    43          averageSales = totalSales / months;\n  44\n  45          // 显示结果。\n\
    46          JOptionPane.showMessageDialog(null,\n  47             String.format(\"\
  Number of months: %d\\n\" +\n  48                           \"Total Sales: $%,.2f\\\
  n\" +\n  49                           \"Average Sales: $%,.2f\",\n  50         \
  \                  months, totalSales, averageSales));\n  51       }\n  52     \
  \  catch(FileNotFoundException e)\n  53       {\n  54          // 当未找到文件时，由\n  55\
  \          // Scanner 构造函数抛出。\n  56          JOptionPane.showMessageDialog(null,\n\
    57              \"The file \" + filename + \" does not exist.\");\n  58      \
  \ }\n  59       catch(InputMismatchException e)\n  60       {\n  61          //\
  \ 当发现非数值值时，由\n  62          Scanner 类的 nextDouble 方法抛出。\n  63          JOptionPane.showMessageDialog(null,\n\
    64              \"Non-numeric data found in the file.\");\n  65       }\n  66\n\
    67       System.exit(0);\n  68    }\n  69 }\n```\n\n# 代码列表 11-5 `(SalesReport.java)`\n\
  \n当 `try` 块中的代码抛出异常时，JVM 开始在 `try` 语句中搜索可以处理它的 `catch` 子句。它从上到下搜索 `catch` 子句，并将程序的控制权传递给第一个与异常参数兼容的\
  \ `catch` 子句。\n\n# 使用异常处理器从错误中恢复\n\n代码列表 11-5 中的程序演示了 `try` 语句如何拥有多个 `catch` 子句以处理不同类型的异常。然而，该程序并没有使用异常处理器从任何错误中恢复。无论是找不到文件还是在文件中遇到非数值项，该程序都会停止。代码列表\
  \ 11-6 中的程序是有效异常处理的更好示例。它尝试从尽可能多的异常中恢复。\n\n\n\n\n\n```java\nimport java.io.*;  \
  \  // 用于 File 类和 FileNotFoundException\nimport java.util.*;  // 用于 Scanner 和 InputMismatchException\n\
  import javax.swing.JOptionPane; // 用于 JOptionPane 类\n\n/**\n  此程序演示了如何使用异常处理器\n\
  \  来从错误中恢复。\n */\npublic class SalesReport2\n{\n   public static void main(String[]\
  \ args)\n   {\n      String filename = \"SalesData.txt\"; // 文件名\n      int months\
  \ = 0;                    // 月份计数器\n      double oneMonth;                   //\
  \ 一个月的销售额\n      double totalSales = 0.0;           // 总销售额\n      double averageSales;\
  \               // 平均销售额\n\n      // 尝试通过调用 openfile\n      // 方法来打开文件。\n      Scanner\
  \ inputFile = openFile(filename);\n\n      // 如果 openFile 方法返回 null，则\n      //\
  \ 文件未找到。获取一个新的文件名。\n      while (inputFile == null)\n      {\n         filename\
  \ = JOptionPane.showInputDialog(\n                             \"错误: \" + filename\
  \ +\n                             \" 不存在。\\n\" +\n                             \"\
  请输入另一个文件名: \");\n         inputFile = openFile(filename);\n      }\n\n      // 处理文件内容。\n\
  \      while (inputFile.hasNext())\n      {\n         try\n         {\n        \
  \    // 获取一个月的销售金额。\n            oneMonth = inputFile.nextDouble();\n\n        \
  \    // 累积金额。\n            totalSales += oneMonth;\n\n            // 增加月份计数器。\n\
  \            months++;\n         }\n         catch(InputMismatchException e)\n \
  \        {\n            // 显示错误消息。\n            JOptionPane.showMessageDialog(null,\n\
  \               \"在文件中发现非数字数据。\\n\" +\n               \"该无效记录将被跳过。\");\n\n     \
  \       // 跳过无效数据。\n            inputFile.nextLine();\n         }\n      }\n\n \
  \     // 关闭文件。\n      inputFile.close();\n\n      // 计算平均值。\n      averageSales\
  \ = totalSales / months;\n\n      // 显示结果。\n      JOptionPane.showMessageDialog(null,\n\
  \        String.format(\"月份数: %d\\n\" +\n                      \"总销售额: $%,.2f\\\
  n\" +\n                      \"平均销售额: $%,.2f\",\n                      months, totalSales,\
  \ averageSales));\n\n      System.exit(0);\n   }\n\n   /**\n    openFile 方法打开指定的文件并\n\
  \    返回一个 Scanner 对象的引用。\n    @param filename 要打开的文件名。\n    @return 如果文件存在，则返回 Scanner\
  \ 引用；\n            否则，返回 null。\n   */\n   public static Scanner openFile(String\
  \ filename)\n   {\n      Scanner scan;\n\n      // 尝试打开文件。\n      try\n      {\n\
  \         File file = new File(filename);\n         scan = new Scanner(file);\n\
  \      }\n      catch(FileNotFoundException e)\n      {\n         scan = null;\n\
  \      }\n      return scan;\n   }\n}\n```\n\n# 代码列表 11-6 (SalesReport2.java)\n\n\
  让我们看看程序是如何从 `FileNotFoundException` 中恢复的。第 85 行到 101 行的 `openFile` 方法接受文件名作为参数。方法创建一个\
  \ `File` 对象（将文件名传递给构造函数）和一个 `Scanner` 对象。如果 `Scanner` 类抛出 `FileNotFoundException`，该方法将返回\
  \ `null`。否则，它返回 `Scanner` 对象的引用。在 `main` 方法中，第 26 行到 33 行使用了一个循环，在 `openFile` 方法返回\
  \ `null` 时向用户请求不同的文件名。\n\n现在看看程序是如何在意外遇到文件中中的非数字项目时恢复的。第 41 行调用 `Scanner` 类的 `nextDouble()`\
  \ 方法的语句被封装在一个捕获 `InputMismatchException` 的 `try` 语句中。如果 `nextDouble()` 方法抛出此异常，则第\
  \ 49 行到 58 行的 `catch` 块将显示一条消息，指示遇到了非数字项目且该无效记录将被跳过。然后，使用第 57 行的 `nextLine()` 方法从文件中读取无效数据。由于第\
  \ 47 行的语句 `months++` 位于 `try` 块中，它将不会执行，因此月份数仍然是正确的。循环继续处理文件的下一行。\n\n让我们来看一些程序从这些错误中恢复的示例。假设我们将\
  \ `SalesData.txt` 文件重命名为 `SalesInfo.txt`。\n\n# 图 11-9 与 SalesReport2.java 程序的交互\
  \ (Oracle Counsel)\n\n![与 Sales Report 2 程序的交互。](img/\n\n现在，假设我们将文件名改回 `SalesData.txt`\
  \ 并按如下所示编辑内容：\n\n```\n24987.62\n26978.97\nabc\n31978.47\n22781.76\n29871.44\n```\n\
  \n注意，第三项不再是数字了。\n\n# 图 11-10 SalesReport2.java 程序的对话框 (Oracle Counsel)\n\n![Sales\
  \ Report 2 程序显示了两个对话框。]\n\n# 在 try 语句中仅处理一次异常\n\n如果不包含多态引用，`try` 语句对于每种特定类型的异常只能有一个\
  \ `catch` 子句。例如，下面的 `try` 语句将导致编译器发出错误消息，因为它用两个 `catch` 子句处理了 `NumberFormatException`\
  \ 对象：\n\n```java\ntry\n{\n   number = Integer.parseInt(str);\n}\ncatch (NumberFormatException\
  \ e)\n{\n   System.out.println(\"数字格式错误.\");\n}\n// 错误！！！NumberFormatException 已经被捕获了！\n\
  catch (NumberFormatException e)\n{\n   System.out.println(str + \" 不是一个数字.\");\n\
  }\n```\n\n有时你可以通过使用多态引用引起此错误。例如，查看图 11-11，它显示了 `NumberFormatException` 类的继承层次结构。\n\
  \n# 图 11-11 NumberFormatException 类的继承层次结构\n\n![数字异常类的继承层次结构由六个类组成，每层一个类，每个较低的类通过垂直箭头连接到下一个高层类，最顶层的\
  \ Object 类除外。]\n\n从图中可以看出，`NumberFormatException` 类继承自 `IllegalArgumentException`\
  \ 类。现在看下面的代码：\n\n```java\ntry\n{\n   number = Integer.parseInt(str);\n}\ncatch (IllegalArgumentException\
  \ e)\n{\n   System.out.println(\"数字格式错误.\");\n}\n// 这也会导致错误。\ncatch (NumberFormatException\
  \ e)\n{\n   System.out.println(str + \" 不是一个数字.\");\n}\n```\n\n编译器会对第二个 `catch`\
  \ 子句发出错误消息，报告 `NumberFormatException` 已经被捕获。这是因为第一个捕获 `IllegalArgumentException`\
  \ 对象的 `catch` 子句会以多态的方式捕获 `NumberFormatException` 对象。\n\n\n\n\n\n如果你在同一个 `try` 语句中处理多个异常，且其中某些异常之间存在继承关系，那么你应该在处理更通用的异常类之前，处理更专门的异常类。我们可以将之前的代码重写如下，且不会出现错误：\n\
  \n```\ntry\n {\n    number = Integer.parseInt(str);\n }\n catch (NumberFormatException\
  \ e)\n {\n    System.out.println(str + \" is not a number.\");\n }\n catch (IllegalArgumentException\
  \ e)\n {\n    System.out.println(\"Bad number format.\");\n }\n```\n\n# `finally`\
  \ 子句\n\n`try` 语句可以可选的 `finally` 子句，它必须出现在所有 `catch` 子句之后。以下是带有 `finally` 子句的 `try`\
  \ 语句的标准格式：\n\n```\ntry\n {\n    (try block statements .. ..) \n }\n catch (ExceptionType\
  \ ParameterName)\n {\n     (catch block statements ..�.) \n }\n finally\n {\n  \
  \   (finally block statements ..�.) \n }\n```\n\n`finally block` 包含一个或多个语句，它们在 `try`\
  \ 块执行之后，以及在抛出异常后任何 `catch` 块执行之后总是执行。无论是否发生异常，`finally` 块中的语句都会执行。例如，以下代码打开了一个 `doubles`\
  \ 类型的文件并读取其内容。外层的 `try` 语句打开文件并有一个捕获 `FileNotFoundException` 的 `catch` 子句。内部的 `try`\
  \ 语句从文件中读取值并有一个捕获 `InputMismatchException` 的 `catch` 子句。无论是否发生 `InputMismatchException`，`finally`\
  \ 块都会关闭文件。\n\n```\ntry\n {\n    // 打开文件。\n    File file = new File(filename);\n\
      Scanner inputFile = new Scanner(file);\n\n    try\n {\n       // 读取并显示文件内容。\n\
         while (inputFile.hasNext())\n       {\n          System.out.println(inputFile.nextDouble());\n\
         }\n    }\n    catch (InputMismatchException e)\n    {\n       System.out.println(\"\
  Invalid data found.\");\n    }\n    finally\n    {\n       // 关闭文件。\n       inputFile.close();\n\
      }\n }\n catch (FileNotFoundException e)\n {\n    System.out.println(\"File not\
  \ found.\");\n }\n```\n\n# 堆栈跟踪 (Stack Trace)\n\n很多时候，一个方法会调用另一个方法，而该方法会调用另一个方法。例如，方法\
  \ A 调用方法 B，方法 B 调用方法 C。`call stack`（调用栈）是正在执行的所有方法的内部列表。\n\n当在多层方法调用下执行的方法抛出异常时，了解哪些方法负责了该方法的调用是有帮助的。`stack\
  \ trace`（堆栈跟踪）是调用栈中所有方法的列表。它指示了发生异常时正在执行的方法以及为了执行该方法而按顺序调的所有方法。例如，查看代码列表 11-7 中的程序。它包含三个方法：`main`、`myMethod`\
  \ 和 `produceError`。`main` 方法调用 `myMethod`，`myMethod` 调用 `produceError`。`produceError`\
  \ 方法通过 `String` 类的 `charAt` 方法传递无效的位置数字导致异常。该异常没有被程序处理，而是由默认异常处理器处理。\n\n```\n 1\
  \ /**\n  2    此程序演示了在抛出异常时产生的\n  3    堆栈跟踪。\n  4 */\n  5\n  6 public class StackTrace\n\
    7 {\n  8    public static void main(String[] args)\n  9    {\n  10       System.out.println(\"\
  Calling myMethod...\");\n  11       myMethod();\n  12       System.out.println(\"\
  Method main is done.\");\n  13    }\n  14\n  15    /**\n  16       MyMethod\n  17\
  \    */\n  18\n  19    public static void myMethod()\n  20    {\n  21       System.out.println(\"\
  Calling produceError...\");\n  22       produceError();\n  23       System.out.println(\"\
  myMethod is done.\");\n  24    }\n  25\n  26    /**\n  27       produceError\n \
  \ 28    */\n  29    public static void produceError()\n  30    {\n  31        String\
  \ str = \"abc\";\n  32        // 下述将导致错误。\n  33        System.out.println(str.charAt(10));\n\
    34    }\n }\n\n 输出\nCalling myMethod...\nCalling produceError...\njava.lang.StringIndexOutOfBoundsException:\
  \ String index 10 for length 3\n\tat StackTrace.produceError(StackTrace.java:33)\n\
  \tat StackTrace.myMethod(StackTrace.java:22)\n\tat StackTrace.main(StackTrace.java:12)\n\
  ```\n\n\n\n\n\n# 代码列表 11-8 `(MultiCatch.java)`\n\n```java\nimport java.io.*;   \
  \  // 用于 File 类和 FileNotFoundException\nimport java.util.*;   // 用于 Scanner 和 InputMismatchException\n\
  \n/**\n   此程序演示了如何使用单个 catch 句 \n   捕获多个异常。\n */\n\npublic class MultiCatch\n{\n\
  \   public static void main(String[] args)\n   {\n      int number;    // 存储来自文件的数字\n\
  \n      try\n      {\n          // 打开文件。\n          File file = new File(\"Numbers.txt\"\
  );\n          Scanner inputFile = new Scanner(file);\n\n          // 处理文件内容。\n \
  \         while (inputFile.hasNext())\n          {\n             // 从文件中获取一个数字。\n\
  \             number = inputFile.nextInt();\n\n             // 显示该数字。\n        \
  \     System.out.println(number);\n          }\n\n          // 关闭文件。\n         \
  \ inputFile.close();\n       }\n       catch(FileNotFoundException | InputMismatchException\
  \ ex)\n       {\n          // 显示错误信息。\n          System.out.println(\"Error processing\
  \ the file.\");\n       }\n    }\n}\n```\n\n### 注意\n\n如果你使用的是 Java 7 之前的版本，则无法使用多捕获（multi-catch）。\n\
  \n# 当异常未被捕获时\n\n当异常被抛出时，它不能被忽略。它必须由程序或默认异常处理器处理。当方法中的代码抛出异常时，该方法的正常执行将停止，JVM 会在方法内部搜索兼容的异常处理器。如果方法内部没有处理异常的代码，程序的控制权将传递给调用堆栈中的上一个方法（即调用出错方法的方法）。如果该方法无法处理该异常，控制权将再次沿堆栈向上传递给上一个方法。这种会会一直持续直到控制权到达\
  \ `main` 方法。如果 `main` 方法没有处理该异常，程序将停止，并由默认异常处理器处理该异常。\n\n代码列表 11-7 中的程序就是这种情况。由于\
  \ `produceError` 方法没有处理异常，控制权传回了 `myMethod`。`myMethod` 也没有处理该异常，因此控制权传回了 `main`。由于\
  \ `main` 没有处理该异常，程序停止，默认异常处理器显示了错误信息。\n\n# 检查异常与未检查异常\n\n在 Java 中，异常分为两类：未检查异常（unchecked）和已检查异常（checked）。`未检查异常`\
  \ 是继承自 `Error` 类或 `RuntimeException` 类的异常。记住，继承自 `Error` 的异常是在发生严重错误（如内存耗尽）时被抛出的。你不应该处理这些异常，因为导致这些异常的情况在程序中很少可以处理。还请记住\
  \ `RuntimeException` 是由于编程错误（如数组下标越界）引起的异常的父类。最好也不处理这些异常，因为它们可以通过编写良好的代码来避免。所以，你不应该处理未检查异常。\n\
  \n所有剩余异常（即那些*没有*继承自 `Error` 或 `RuntimeException` 的异常）都是`已检查异常`。这些是你应该在程序处理的异常。如果方法中的代码可能抛出已检查异常，那么该方法必须满足以下要求之一：\n\
  \n* 它必须处理该异常，或者\n* 它必须在方法头部中列出 `throws` 子句。\n\n`throws` 子句告知编译器从方法中可能抛出的异常。例如，请看以下方法：\n\
  \n```java\n// 此方法将无法编译！\npublic void displayFile(String name)\n{\n   // 打开文件。\n\
  \   File file = new File(name);\n   Scanner inputFile = new Scanner(file);\n\n \
  \  // 读取并显示文件内容。\n   while (inputFile.hasNext())\n   {\n      System.out.println(inputFile.nextLine());\n\
  \   }\n\n   // 关闭文件。\n   inputFile.close();\n}\n```\n\n此方法中的代码能够抛出 `FileNotFoundException`，这是一种已检查异常。由于方法没有处理此异常，它必须在头部中有一个\
  \ `throws` 子句，否则将无法编译。\n\n关键字 `throws` 写在方法头部的末尾，后面跟着该方法可能抛出的异常类型列表。这里是修改后的方法头部：\n\
  \n```java\npublic void displayFile(String name) throws FileNotFoundException\n```\n\
  \n`throws` 子句告诉编译器该方法可能会抛出 `FileNotFoundException`。（如果有多种类型的异常，请用逗号隔开。）现在你知道为什么在前面的章节中，对执行文件操作的方法写了\
  \ `throws` 子句了。我们没有处理任何可能发生的已检查异常，因此我们必须通知编译器我们的方法可能会将这些异常向上传递给调用堆栈。\n\n# 检查点 11.1\n\
