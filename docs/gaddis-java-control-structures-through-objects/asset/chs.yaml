  \ + \" row updated.\");\n   }\n}\n```\n\n程序输出\n\n```\nEnter the product number:\
  \ 101\nDescription: Sumatra Roast\nProduct Number: 101\nPrice: $1.99\nEnter the\
  \ new price: 2.99\n1 row updated.\n```\n\n\n\n\n在 JDBC 中执行 `DELETE` 语句的过程与执行 `INSERT`\
  \ 语句或 `UPDATE` 语句相似。首先，你通过 `Connection` 对象的 `createStatement` 方法获取一个 `Statement`\
  \ 对象。然后，你使用 `Statement` 对象的 `executeUpdate` 方法来执行 `DELETE` 语句。该方法返回一个 `int` 类型的值，表示被删除的行数。以下是一个示例：\n\
  \n```java\nString sqlStatement = \"DELETE FROM Coffee \" +\n                   \
