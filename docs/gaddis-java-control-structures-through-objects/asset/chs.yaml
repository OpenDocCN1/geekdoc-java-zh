  \n# 继承不是反向的\n\n在继承关系中，子类继承父类的成员，而不是反过来。这意味着父类无法调用子类的方法。例如，如果我们创建一个 `GradedActivity`\
  \ 对象，它无法调用 `getPointsEach` 或 `getNumMissed` 方法，因为它们是 `FinalExam` 类的成员。\n\n# 检查点\
