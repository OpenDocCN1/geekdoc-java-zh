  \n## 7.9 二维数组\n\n**概念**：二维数组是“数组的数组”。它可以被想象为具有行和列。\n\n数组对于存储和处理一组数据非常有用。然而，有时需要处理多组数据。例如，在一个成绩平均分程序中，老师可能会用\
  \ `double` 数组记录一个学生的所有测试成绩。如果老师有 30 个学生，这意味着她需要 30 个数组来记录全班的成绩。但是，与其定义 30 个独立的数组，不如定义一个二维数组更好。\n\
  \n你目前为止学过的数组都是一维数组。它们被称为`一维`数组，是因为它们只能包含一组数据。二维数组（有时被称为 `2D arrays`）可以包含多组数据。虽然二维数组实际上是数组的数组，但最好的方式是将其视为具有行和列的元素，如图\
  \ 7-18 所示。该图显示了一个测试成绩数组，有三行四列。\n\n![二维数组包含一个类似于表格的数组，有四列，标记为 Column 0、Column 1、Column\
  \ 2 和 Column 3，以及三行，标记为 Row 0、Row 1 和 Row 2。](img/07fig18.png)\n\n### 图 7-18 行和列\n\
  \n图中所示数组有三行（编号从 0 到 2）和四列（编号从 0 到 3）。数组中总共有多少个元素。要声明二维数组，需要两组括号和两个大小声明符：第一个用于行数，第二个用于列数。这里是一个三行四列二维数组的示例：\n\
  \n```\ndouble[][] scores = new double[3][4];\n```\n\n数据类型中的两组括号表示 `scores` 变量将引用一个二维数组。数字\
  \ `3` 和 `4` 是大小声明符。第一个大小声明符指定行数，第二个大小声明符指定列数。注意每个大小声明符都包含在自己的括号中。这在图 7-1 中有所插图。\n\
  \n\n\n\n如前所述，该数组有三行（每个部门一行）和四列（每个季度一列），用于存储公司的销售数据。行下标为 0、1 和 2，列下标为 0、1、2 和 3。图\
