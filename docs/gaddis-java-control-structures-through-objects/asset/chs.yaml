  ### 程序员定义的名称\n\n出现在程序第 5、6、8 和 9 行的 `hours`、`payRate` 和 `grossPay` 是程序员定义的名称。它们不是\
  \ Java 语言的一部分，而是由程序员命名的名称。在这个特定的程序中，这些是变量的名称。正如你在本章后面将学到的，变量是可能存储数据的内存位置名称。\n\n\
  ### 运算符\n\n在第 8 行出现了以下内容：\n\n```\ngrossPay = hours * payRate;\n```\n\n`=` 和 `*`\
  \ 符号都是运算符。它们对数据项执行操作，这些项被称为操作数。`*` 运算符将它的两个操作数相乘，在本例中，这两个操作数是变量 `hours` 和 `payRate`。`=`\
  \ 符号被称为赋值运算符。它获取右侧表达式的值，并将其存储在左侧出现的变量中。在本例中，` 运算符将 `hours` 变量乘以 `payRate` 变量的结果存储在\
  \ `grossPay` 变量中。换句话说，该语句的意思是：“将 `hours` 乘以 `payRate` 的值赋值给变量 `grossPay`”。\n\n###\
  \ 标点符号\n\n注意第 5、6、8 和 9 行以分号结尾。Java 中的分号类似于英语中的句号：它标记了一个完整句子（或用编程术语称为“语句”）的结束。然而，Java\
  \ 程序中并不是每一行的末尾都有分号。有规则规定了哪里需要分号，哪里不需要。学习 Java 的一部分是学习在何处放置分号和其他标点符号。\n\n# 检查点 1.22\n\
