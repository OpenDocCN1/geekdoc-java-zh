  \ {\n  53       return percentage;\n  54    }\n  55}\n```\n\n\n\n\n重载（overloading）和重写（overriding）都可以发生在继承关系中。你已经知道重载方法出现在同一个类中。此外，子类中的方法可以重载父类中的方法。如果类\
  \ `A` 是父类而类 `B` 是子类，那么类 `B` 中的方法可以重载类 `A` 中的方法，也可以重载类 `B` 中的另一个方法。另一方面，重写只能发生在继承关系中。如果类\
  \ `A` 是父类而类 `B` 是子类，那么类 `B` 中的方法可以重写类 `A` 中的方法。然而，一个方法不能重写同一个类中的另一个方法。下列表总结了重载和重写的区别：\n\
  \n*   如果两个方法的名称相同但签名（signature）不同，则它们就是重载的。无论这两个方法是在同一个类中，还是一个方法在父类中另一个方法在子类中，都如此。\n\
  *   如果子类中的方法与父类中的方法的签名相同，则子类方法重写了父类方法。\n\n重载和重写的区别非常重要，因为它们会影响子类对父类方法的访问权限。当子类重载父类方法时，使用子类对象可以调用这两个方法。然而，当子类重写父类方法时，使用子类对象只能调用子类版本的该方法。例如，查看代码列表\
  \ 10-15 中的 `SuperClass3` 类。它有两个同名为 `showValue` 的重载方法。其中一个方法接受一个 `int` 参数，另一个接受一个\
  \ `String` 参数。\n\n```\n 1  public class SuperClass3\n 2  {\n 3     /**\n 4     \
  \   此方法显示一个 int。\n 5        @param arg 一个 int。\n 6     */\n 7\n 8     public void\
  \ showValue(int arg)\n 9     {\n 10        System.out.println(\"SUPERCLASS: \" +\n\
  \ 11                           \"The int argument was \" + arg);\n 12     }\n 13\n\
  \ 14     /**\n 15        此方法显示一个 String。\n 16        @param arg 一个 String。\n 17\
  \     */\n 18\n 19     public void showValue(String arg)\n 20     {\n 21       \
  \ System.out.println(\"SUPERCLASS: \" +\n 22                           \"The String\
  \ argument was \" + arg);\n 23     }\n 24  }\n```\n\n### 代码列表 10-15 (SuperClass3.java)\n\
