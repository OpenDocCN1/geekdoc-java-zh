  \n## 2.5 算术运算符\n\n概念：有很多运算符用于处理数值和执行算术运算。\n\nJava 提供了许多处理数据的运算符。通常有三种类型：*一元*、*二元*和*三元*。这些术语反映了运算符所需的的操作数数量。\n\
  \n## 查看简单的数学表达式\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/7yRmZ7kVTxDaFGEq3vz0AxD5oQSSpm6`](https://mediaplayer.pearsoncmg.com/assets/_video.true/7yRmZ7kVTxDaFGEq3vz0AxD5oQSSpm6)\n\
  \n一元运算符只需要一个操作数。例如，考虑以下表达式：\n\n```\n−5\n```\n\n当然，我们理解这代表负五的值。我们也可以将运算符应用于变量，如下所示：\n\
  \n```\n–number\n```\n\n\n\n\n\n此表达式给出了 `number` 中存储的值的负值。减号在这样使用时被称为`取反运算符`。因为它只需要需要一个操作数，所以它是一个一元运算符。\n\
  \n二元运算符与两个操作数一起工作。赋值运算符属于这一类。正如你可能猜的那样，三元运算符需要三个操作数。`Java` 只有一个三元运算符，在第 3 章中进行了讨论。\n\
  \n算术运算在编程中非常常见。表 2-7 展示了 `Java` 中的算术运算符。\n\n### 表 2-7 算术运算符\n\n| 运算符 | 含义 | 类型 |\
  \ 示例 |\n| --- | --- | --- | --- |\n| `+` | 加法 | 二元 | `total = cost + tax;` |\n|\
  \ `−` | 减法 | 二元 | `cost = total − tax;` |\n| `*` | 乘法 | 二元 | `tax = cost * rate;`\
  \ |\n| `/` | 除法 | 二元 | `salePrice = original / 2;` |\n| `%` | 取模 | 二元 | `remainder\
  \ = value % 3;` |\n\n这些运算符每一个的作用可能正如你预期的那样。加法运算符返回两个操作数的和。以下是一些使用加法运算符的示例语句：\n\n\
  ```\namount = 4 + 8;                  // 将 12 赋值给 amount\ntotal = price + tax; \
  \            // 将 price + tax 赋值给 total\nnumber = number + 1;             // 将 number\
  \ + 1 赋值给 number\n```\n\n减法运算符返回其左操作数减去右操作数的值。以下是一些示例：\n\n```\ntemperature = 112\
  \ − 14;          // 将 98 赋值给 temperature\nsale = price − discount;         // 将\
  \ price – discount 赋值给 sale\nnumber = number − 1;             // 将 number − 1 赋值给\
  \ number\n```\n\n乘法运算符返回两个操作数的积。以下是一些示例：\n\n```\nmarkUp = 12 * 0.25;           \
  \   // 将 3 赋值给 markUp\ncommission = sales * percent;    // 将 sales * percent 赋值给\
  \ commission\npopulation = population * 2;     // 将 population * 2 赋值给 population\n\
  ```\n\n除法运算符返回其左操作数除以右操作数的商。以下是一些示例：\n\n```\npoints = 100 / 20;         // 将 5 赋值给\
  \ points\nteams = players / maxEach; // 将 players / maxEach 赋值给 teams\nhalf = number\
  \ / 2;         // 将 number / 2 赋值给 half\n```\n\n取模运算符返回涉及两个整数除法运算的余数。以下语句将 2 赋值给\
  \ `leftOver`：\n\n```\nleftOver = 17 % 3;\n```\n\n在某些情况下，你需要获取除法的余数。检测奇数或需要确定除法后剩余多少项的计算会使用取模运算符。\n\
  \n代码清单 2-17 中的程序演示了在简单的工资计算中使用的一些运算符。\n\n在下面的动画中，点击“上一个”或“下一个”按钮可以逐步查看代码并贯穿始终的解释。\n\
  \n### 代码清单 2-17 `(Wages.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-17/17.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-17/17.html)\n\
  \n代码清单 2-17 计算了小时薪工人在一周内赚的总工资。正如注释中所提到的，有用于常规工资、基础薪率、常规工作小时、加班工资、加班薪率、加班工作小时和总工资的变量。\n\
  \n程序的第 15 行将 `basePay` 乘以 `regularHours`并将结果（1000）存储在 `regularWages` 中：\n\n```\n\
  regularWages = basePay * regularHours;\n```\n\n第 16 行将 `overtimePay` 乘以 `overtimeHours`，并将结果（375）存储在\
  \ `overtimeWages` 中：\n\n```\novertimeWages = overtimePay * overtimeHours;\n```\n\
  \n第 17 行将常规工资和加班工资相加，并将结果（1375）存储在 `totalWages` 中：\n\n```\ntotalWages = regularWages\
  \ + overtimeWages;\n```\n\n第 18 和第 19 行的`println`语句在屏幕上显示消息。\n\n### 整数除法\n\n当除法的两个操作数都是整数时，小数部分会被舍弃。这被称为整数除法。例如，考虑以下代码：\n\
  \n```\ndouble number = 5 / 2;\n```\n\n`number` 的值将是 2，因为小数部分被丢弃了。如果操作数是浮点数，结果将是浮点数。例如：\n\
  \n```\ndouble number = 5.0 / 2;\n```\n\n`number` 的值将是 2.5，因为操作数是浮点数。\n\n### 运算符优先级\n\
  \n数学表达式从左到右求值。乘法除法的优先级高于加法和减法，因此上述语句如下：\n\n1. 6 除以 3，得到结果 2\n2. 12 加上 2，得到结果 14\n\
  \n它可以像图 2-5 所示那样进行图示。\n\n![优先级通过一个数学表达式从 12 + 3 简化为 12 + 2 最后到最终结果 14 来演示](img/02fig05.png)\n\
  \n# 图 2-5 优先级图示\n\n表 2-8 显示了算术运算符的优先级。表格顶部的运算符优先级高于下面的运算符。\n\n### 表 2-8 算术运算符优先级（从高到低）\n\
  \n| **最高优先级** → | `−` (取反) `* / %` |\n| **最低优先级** → | `+ −` |\n\n乘法、除法和取模运算符优先级相同。加法和减法运算符优先级相同。如果共享操作数的运算符优先级相同，它们根据它们的`结合性`工作。结合性是*从左到右*或*从右到左*。表\
  \ 2-9 显示了算术运算符及其结合性。\n\n### 表 2-9 算术运算符的结合性\n\n| 运算符 | 结合性 |\n| --- | --- |\n| `−`\
  \ (取反) | 从右到左 |\n| `* / %` | 从左到右 |\n| `+ −` | 从左到右 |\n\n表 2-10 显示了一些表达式及其值。\n\n\
  \n\n\n\n### 表 2-10 某些表达式及其值\n\n| 表达式 | 值 |\n| --- | --- |\n| `5 + 2 * 4` | `13`\
  \ |\n| `10 / 2 − 3` | `2` |\n| `8 + 12 * 2 − 4` | `28` |\n| `4 + 17 % 2 − 1` | `4`\
  \ |\n| `6 − 3 * 2 + 7 − 1` | `6` |\n\n### 使用括号分组\n\n数学表达式中的部分可以使用括号分组，以强制某些操作在其他操作之前执行。在下面的语句中，`a`、`b`、`c`\
  \ 和 `d` 的和被除以 `4.0`。\n\n```\naverage = (a + b + c + d) / 4.0;\n```\n\n然而，如果没有括号，`d`\
  \ 将除以 `4`，并将结果加到 `a`、`b` 和 `c` 上。表 2-11 显示了更多的表达式及其值。\n\n### 表 2-11 更多的表达式及其值\n\n\
  | 表达式 | 值 |\n| --- | --- |\n| `(5 + 2) * 4` | `28` |\n| `10 / (5 − 3)` | `5` |\n\
  | `8 + 12 * (6 − 2)` | `56` |\n| `(4+17)%2-1` | `0` |\n| `(6-3) * (2+7) /3` | `9`\
  \ |\n\n### 焦点：计算百分比和折扣\n\n确定百分比是计算机编程中常见的计算。虽然在通用数学中使用 `%` 符号表示百分比，但大多数编程语言（包括 `Java`）并不使用\
  \ `%` 符号来实现此目的。在程序中，你必须将百分比转换为浮点数，就像你使用计算器一样。例如，50% 应该写为 `0.5`，2% 应该写为 `0.02`。\n\
  \n让我们来看一个例子。假设你每月赚 6,000 美元，并允许将每月总工资的一部分投入退休计划。你想确定，如果你投入每月总工资的 5%、8% 或 10%，你的工资中将有多少金额进入该计划。为了做出这一判断，你编写了一个像所示代码列表\
  \ 2-18 所示的程序。\n\n在下方的动画中，点击“上一个”或“下一个”按钮，可以逐步执行代码并查看贯穿始终的解释。\n\n### 代码列表 2-18 `(Contribution.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-18/18.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-18/18.html)\n\
  \n第 11 行和 12 行声明了两个变量：`monthlyPay` 和 `contribution`。变量 `monthlyPay` 初始化为 `6000.0`，持有你的每月工资金额。`contribution`\
  \ 变量将持有投入退休计划的金额。\n\n第 15 行至 18 行的语句计算并显示月工资的 5%。计算在第 15 行完成，其中 `monthlyPay` 变量乘以\
  \ `0.05`。结果被赋值给 `contribution` 变量，然后通过第 16 行至 18 行的语句显示。\n\n第 21 行至 24 行采取了类似的步骤，计算并显示了月工资的\
  \ 8%，第 27 行至 30 行计算并显示了月工资的 10%。\n\n### 计算百分比折扣\n\n另一种常见的计算是确定百分比折扣。例如，假设一家零售店销售一件原价为\
  \ 59 美元的商品，并计划进行促销，将商品价格降低 20%。你被要求编写一个程序来计算该商品的促销价。\n\n要确定促销价，你需要执行两次计算：\n\n* 第一，你获得折扣金额，即商品原价的\
  \ 20%。\n* 第二，你从商品原价中减去折扣金额。这让你得到了促销价。\n\n代码列表 2-19 显示了如何在 `Java` 中实现此。\n\n在下方的动画中，点击“上一个”或“下一个”按钮，可以逐步执行代码并查看贯穿始终的解释。\n\
  \n### 代码列表 2-19 `(Discount.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-19/19.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-19/19.html)\n\
  \n第 11 行至 13 行声明了三个变量。`regularPrice` 变量持有原价，初始化为 `59`。第 16 行通过将 `regularPrice` 乘以\
  \ `0.2` 计算 `discount` 变量。第 20 行通过从 `regularPrice` 中减去 `discount` 计算促销价，并存储在 `salePrice`\
  \ 变量中。第 23 行至 25 行显示了原价、折扣和促销价。\n\n## 2.6 复合赋值运算符\n\n概念：复合赋值运算符将赋值运算符与算术运算符相结合。\n\
  \n程序中，经常会有如下形式的赋值语句：\n\n```\nx = x + 1;\n```\n\n在赋值运算符的右侧，将 1 加到 `x`。结果被赋值给 `x`，替换之前的值。实际上，这条语句将\
  \ x 增加了 1。这里是另一个例子：\n\n```\nbalance = balance + deposit;\n```\n\n\n\n\n假设 `balance`\
  \ 和 `deposit` 是变量，该语句将 `balance + deposit` 的值赋值给 `balance`。该语句的作用是将 `deposit` 加到存储在\
  \ `balance` 中的值上。这里是另一个示例：\n\n```\nbalance = balance - withdrawal;\n```\n\n假设 `balance`\
  \ 和 `withdrawal` 是变量，该语句将 `balance - withdrawal` 的值赋值给 `balance`。该语句的作用是将 `withdrawal`\
  \ 从存储在 `balance` 中的值中减去。\n\n如果你以前没有见过这类类型的语句，它们可能会引起一些初始的困惑，因为同一个变量名同时出现在赋值运算符的两侧。表\
  \ 2-12 显示了其他这种编写方式的语句示例。\n\n# 表 2-12 各种赋值语句（假设每个语句中 `x` = 6）\n\n| 语句 | 作用 | 语句执行后\
  \ `x` 的值 |\n| --- | --- | --- |\n| `x = x + 4;` | 将 `x` 加 4 | `10` |\n| `x = x −\
  \ 3;` | 从 `x` 减去 3 | `3` |\n| `x = x * 10;` | 将 `x` 乘以 10 | `60` |\n| `x = x / 2;`\
  \ | 将 `x` 除以 2 | `3` |\n| `x = x % 4` | 将 `x / 4` 的余数赋值给 `x` | `2` |\n\n这类操作在编程中非常常见。为了方便起见，Java\
  \ 提供了一组专门为这些工作设计的特殊运算符。表 2-13 显示了`复合赋值运算符`，也称为`复合运算符`。\n\n### 表 2-13 复合赋值运算符\n\n\
  | 运算符 | 示例用法 | 等价于 |\n| --- | --- | --- |\n| `+=` | `x += 5;` | `x = x + 5;` |\n\
  | `−=` | `y −= 2;` | `y = y − 2;` |\n| `*=` | `z *= 10;` | `z = z * 10;` |\n| `/=`\
  \ | `a /= b;` | `a = a / b;` |\n| `%=` | `c %= 3;` | `c = c % 3;` |\n\n如你所示，复合赋值运算符不需要程序员输入两次变量名。以下语句：\n\
  \n```\nbalance = balance + deposit;\n```\n\n可以重写为：\n\n```\nbalance += deposit;\n\
  ```\n\n同样，语句\n\n```\nbalance = balance − withdrawal;\n```\n\n可以重写为：\n\n```\nbalance\
  \ −= withdrawal;\n```\n\n## 2.7 原始数据类型之间的转换\n\n概念：在将值存储在变量之前，该值的数据类型必须与变量的数据类型兼容。Java\
  \ 会自动在数据类型之间进行某些转换，但不会自动执行任何可能导致数据丢失的转换。Java 在评估包含混合数据类型的算术表达式时，也遵循一套规则。\n\nJava\
  \ 是一种`强类型`语言。这意味着在将值赋值给变量之前，Java 会检查变量和赋值给它的数据的类型，以确定它们是否兼容。例如，看以下语句：\n\n```\nint\
  \ x;\ndouble y = 2.5;\nx = y;\n```\n\n该赋值语句试图将 `double` 值 (2.5) 存储在 `int` 变量中。当\
  \ Java 编译器遇到这行代码时，它将返回一条错误信息。（JDK 显示消息“possible loss of precision.”）\n\n然而，并不是所有混合数据类型的赋值语句都会被编译器拒绝。例如，看以下程序段：\n\
  \n```\nint x;\nshort y = 2;\nx = y;\n```\n\n这个赋值语句将 `short` 存储在 `int` 中，可以毫无问题运行。那么，为什么\
  \ Java 允许将 `short` 存储在 `int` 中，但不允许将 `double` 存储在 `int` 中呢？显然是因为 `double` 可以存储小数，并且可以持有比\
  \ `int` 能存储的大得多的值。如果 Java 允许 `double` 赋值给 `int`，可能会导致数据丢失。\n\n就像军队中的军官一样，原始数据类型是有级的。如果一个数据类型可以持有更大的数字，那么它的级别就高于另一个数据类型。例如，`float`\
  \ 高于 `int`，而 `int` 高于 `short`。图 2-6 显示了按排序的数值数据类型。数据类型在列表中出现的位置越高，它的排名越高。\n\n![原始数据类型排名从最低到最高。数据类型排名\
  \ byte 最低，然后是 short、然后是 int、然后是 float、最后是 double。](img/06.png)\n\n### 原始数据类型排名\n\
  \n数据类型在列表中出现的位置越高，排名越高。（图 2-6 显示了按排序的数值数据类型）。\n\n### 宽转换\n\n当将低优先级类型赋值给高优先级类型变量时，Java\
  \ 会自动执行转换。例如：\n\n```java\nint x;\ndouble y = 2.5;\nx = y;\n```\n\n### 窄转换\n\n窄转换可能会导致数据丢失。Java\
  \ 不会自动执行它们。强制转换让你手动进行转换，即使这意味着数字被截断。例如：\n\n```\nx = (int)number;\n```\n\n### 强制运算符\n\
  \n强制运算符是一个出现在括号中的一元运算符。它返回转换为指定数据类型的值。表 2-14 显示了使用强制运算符的语句。\n\n### 表 2-14 强制运算符示例\n\
  \n| 语句 | 说明 |\n| --- | --- |\n| `littleNum = (short)bigNum;` | 将 `bigNum` 转换为 `short`\
  \ 类型，并赋值给 `littleNum`。 |\n| `x = (long)3.7;` | 强制运算符应用于表达式 3.7。它返回 3，赋值给 `x`。 |\n\
  | `number = (int)72.567;` | 强制运算符应用于表达式 72.567。它返回 72，用于初始化变量 `number`。 |\n| `value\
  \ = (float)x;` | 强制运算符将 `x` 转换为 `float` 类型，转换后的值赋值给 `value`。 |\n| `value = (byte)number;`\
  \ | 强制运算符将 `number` 转换为 `byte` 类型，转换后的值赋值给 `value`。 |\n\n注意，当强制运算符应用于变量时，它不会改变变量的内容。它只是返回存储在变量中的值，并转换为指定的数据类型。\n\
  \n回顾我们之前的讨论，当除法的的操作数都是整数时，该操作将导致整数除法。这意味着除法结果将是一个整数，结果的任何部分都会被丢弃。例如，看以下代码：\n\n```\n\
  int pies = 10, people = 4;\ndouble piesPerPerson;\npiesPerPerson = pies / people;\n\
  ```\n\n尽管 10 除以 4 是 2.5，但这段代码会将 2 存储在 `piesPerPerson` 变量中。由于 `pies` 和 `people` 都是\
  \ `int` 变量，结果将是一个 `int`，小数部分将被丢弃。然而，我们可以通过强制运算符修改代码，以便其获得正确的浮点值结果：\n\n```\npiesPerPerson\
  \ = (double)pies / people;\n```\n\n\n\n\n变量 `pies` 是一个 `int` 类型，其值为 10。表达式 `(double)pies`\
  \ 返回将 `pies` 中的值转换为 `double` 后的结果。这意味着除法运算符的操作数之一是 `double`，因此除法的结果将是一个 `double`。该语句也可以写成如下形式：\n\
  \n```\npiesPerPerson = pies / (double)people;\n```\n\n在这一语句中，强制转换符返回将 `people` 变量的值转换为\
  \ `double` 后的结果。在两种语句中，除法的结果都是 `double`。\n\n# 警告！\n\n强制转换符可以应用于括括号内的整个表达式。例如，看以下语句：\n\
  \n```\npiesPerPerson = (double)(pies / people);\n```\n\n该语句并没有将 `pies` 或 `people`\
  \ 中的值转换为 `double`，而是转换了表达式 `pies / people` 的结果。如果使用该语句，仍然会执行整数除法操作。原因如下：表达式 `pies\
  \ / people` 的结果是 2（因为执行了整数除法）。将值 2 转换为 `double` 得到 2.0。为了防止整数除法的发生，必须将操作数之一转换为 `double`。\n\
  \n### 混合整数操作\n\nJava 语言的细微之处之一是它内部处理 `int`、`byte` 和 `short` 变量算术运算的方式。当 `byte` 或\
  \ `short` 数据类型的值用于算术表达式时，它们会被临时转换为 `int` 值。仅使用 `byte`、`short` 或 `int` 值混合进行算术运算，其结果始终是一个\
  \ `int`。\n\n例如，假设以下表达式中的 `b` 和 `c` 是 `short` 变量：\n\n```\nb + c\n```\n\n尽管 `b` 和\
  \ `c` 都是 `short` 变量，但表达式 `b + c` 的结果是一个 `int`。这意味着当将此类表达式的结果存储在变量中时，该变量必须是 `int`\
  \ 或更高的数据类型。例如，看以下代码：\n\n```\nshort firstNumber = 10,\n      secondNumber = 20,\n\
  \      thirdNumber;\n// 下述语句会导致错误！\nthirdNumber = firstNumber + secondNumber;\n\
  ```\n\n当编译这段代码时，以下语句会导致错误：\n\n```\nthirdNumber = firstNumber + secondNumber;\n```\n\
  \n该错误源于 `thirdNumber` 是一个 `short`。尽管 `firstNumber` 和 `secondNumber` 也是 `short` 变量，但表达式\
  \ `firstNumber + secondNumber` 的结果是一个 `int` 值。如果将 `thirdNumber` 声明为 `int`，或者在赋值语句中使用强制转换符，就可以修正该程序，如下所示：\n\
  \n```\nthirdNumber = (short)(firstNumber + secondNumber);\n```\n\n### 其他混合数学表达式\n\
  \n在数学表达式包含一个或多个 `double`、`float` 或 `long` 数据类型值的情况下，Java 会尽力将表达式中的所有操作数转换为相同的数据类型。让我们来看指导此类类型表达式评估的具体规则。\n\
  \n1. 如果运算符的操作数之一是 `double`，则另一个操作数的值将被转换为 `double`。表达式的结果将是 `double`。例如，在以下语句中假设\
  \ `b` 是 `double` 且 `c` 是 `int`：\n\n```\na = b + c;\n```\n\n`c` 中的值将在加法之前被转换为 `double`。加法的结果将是\
  \ `double`，因此变量 `a` 也必须是是 `double`。\n\n2. 如果运算符的操作数之一是 `float`，则另一个操作数的值将被转换为 `float`。表达式的结果将是\
  \ `float`。例如，在以下语句中假设 `x` 是 `short` 且 `y` 是 `float`：\n\n```\nz = x * y;\n```\n\n\
  `x` 中的值将在乘法之前被转换为 `float`。乘法的结果将是 `float`，因此变量 `z` 必须是 `double` 或 `float`。\n\n3.\
  \ 如果运算符的操作数之一是 `long`，则另一个操作数的值将被转换为 `long`。表达式的结果将是 `long`。例如，在以下语句中假设 `a` 是 `long`\
  \ 且 `b` 是 `short`：\n\n```\nc = a − b;\n```\n\n变量 `b` 将在减法之前被转换为 `long`。减法的结果将是 `long`，因此变量\
  \ `c` 也必须是 `long`、`float` 或 `double`。\n\n## 2.8 使用 `final` 创建命名常量\n\n概念：`final`\
  \ 关键字可以在变量声明中使用，使变量成为命名常量。命名常量在初始化时赋予一个值，该值在程序执行期间不能更改。\n\n假设以下语句出现在一个计算贷款相关数据的程序中：\n\
  \n```\namount = balance * 0.069;\n```\n\n在这样的程序中，会出现两个潜在问题。首先，除了原始程序员之外，其他人都不清楚\
  \ 0.069 是什么。它看起来像是一个利率，但在某些情况下会有与贷款支付相关的费用。第二个问题发生在该数字在整个程序中使用且必须被更改时。假设该数字是利率，如果利率从\
  \ 6.9% 变为 8.2% 呢？程序员必须搜索源代码以找到该数字出现的所有处。\n\n这两个问题都可以通过使用命名常量来解决。命名常量是一个值只读且在程序执行期间不能改变的变量。在\
  \ Java 中，你可以在变量声明中使用 `final` 关键字创建这样的变量。`final` 单词写在数据类型之前。这是一个示例：\n\n```\nfinal\
  \ double INTEREST_RATE = 0.069;\n```\n\n这条语句看起来和变量声明完全一样，只是变量。并不要求变量名使用大写字母，但许多程序员倾向于这样写，以便它们与普通变量名区分开来。\n\
  \n当你将变量声明为 `final` 时，必须在使用之前对其进行初始化或给它赋一个值。例如，以下代码在输出操作之前声明并初始化了一个名为 `PRICE` 的 `final`\
  \ 变量：\n\n```\nfinal double PRICE = 19.99;\nSystem.out.println(\"The price is \"\
  \ + PRICE);\n```\n\n以下代码声明了一个名为 `PRICE` 的 `final` 变量，在单独语句中对其赋值，然后在输出操作中使用它：\n\n\
  ```\nfinal double PRICE;\nPRICE = 19.99;\nSystem.out.println(\"The price is \" +\
  \ PRICE);\n```\n\n然而，以下代码编译时会导致错误，因为你不能在给 `final` 变量赋值之前使用它：\n\n```\nfinal double\
  \ PRICE;\nSystem.out.println(\"The price is \" + PRICE); // 错误！\nPRICE = 19.99;\n\
  ```\n\n一旦给 `final` 变量赋了值，程序中的任何语句都不能更改其值。以下代码会导致编译错误：\n\n```\nfinal double PRICE;\n\
  PRICE = 19.99;\nSystem.out.println(\"The price is \" + PRICE);\nPRICE = 12.99; \
  \ // 错误！不能更改 PRICE。\n```\n\n使用命名常量的优点之一是它们使程序更具自文档。以下语句：\n\n```\namount = balance\
  \ * 0.069;\n```\n\n可以更改为：\n\n```\namount = balance * INTEREST_RATE;\n```\n\n\n\n\
  一个新程序员可以阅读第二条语句并知道正在发生什么。显而易见，`balance` 正在乘以利率。这种方法的另一个优势是可以很容易地对程序进行广泛的更改。假设利率在整个程序中出现在十几个不同的语句中。当利率发生变化时，只有命名常量定义中的\
  \ `initialization value`（初始化值）是需要修改的值。如果利率增加到 8.2%，可以将声明更改为如下内容：\n\n```\nfinal double\
  \ INTEREST_RATE = 0.082;\n```\n\n然后程序就可以准备重新编译了。每个使用 `INTEREST_RATE` 的语句都将使用新值。\n\
  \n### `Math.PI` 命名常量\n\n作为 Java API 的一部分 `Math` 类提供了一个预定义的命名常量 `Math.PI`。该常量被赋值为值\
  \ 3.14159265358979323846，这是数学数值 pi 的近似值。例如，看以下语句：\n\n```\narea = Math.PI * radius\
  \ * radius;\n```\n\n假设变量 `radius` 存储圆的半径，该语句使用 `Math.PI` 常量来计算圆的面积。\n\n### 注意\n\n\
  关于 `Math` 类的更多信息，请参见 附录 F。\n\n# 检查点 2.44\n\n../components/metrodigi/ch02-inline_self_quiz_v1.0.0-22/index.html\n\
