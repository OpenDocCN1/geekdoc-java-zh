  \n# 不锯齿数组 (Ragged Arrays)\n\n由于二维数组中的行也是数组，因此每行都可以有自己的长度。当二维数组的行长度不同时，该数组被称为不锯齿数组。你通过首先创建一个具有特定行数但没有列的二维数组来创建不锯齿数组。这是一个示例：\n\
  \n```java\nint[][] ragged = new int[4][];\n```\n\n该语句部分创建了一个二维数组。该数组可以有四行，但行尚未被创建。接下来，你按照下面的代码创建各个行：\n\
  \n```java\nragged[0] = new int[3];    // 行 0 有 3 列。\nragged[1] = new int[4];   \
  \ // 行 1 有 4 列。\nragged[2] = new int[5];    // 行 2 有 5 列。\nragged[3] = new int[6];\
  \    // 行 3 有 6 列。\n```\n\n这段代码创建了四行。行 0 有三列，行 1 有四列，行 2 有五列，行 3 有六列。下面的代码显示了每行的列数：\n\
  \n```java\nfor (int index = 0; index < ragged.length; index++)\n{\n   System.out.println(\"\
  The number of columns \" +\n                      \"in row \" + index + \" is \"\
  \ +\n                      ragged[index].length);\n}\n```\n\n这段代码将显示以下内容：\n\n```\n\
  The number of columns in row 0 is 3\nThe number of columns in row 1 is 4\nThe number\
  \ of columns in row 2 is 5\nThe number of columns in row 3 is 6\n```\n\n# Checkpoint\
  \ 7.32\n\n# Checkpoint 7.33\n\n# Checkpoint 7.34\n\n# 三维或更多维的数组\n\n概念：Java 不限制数组可以拥有的维度数量。可以创建几乎任意数量维度的数组。这是一个三维数组的示例：\n\
  \n```java\ndouble[][][] seats = new double[3][5];\n```\n\n该数组可以被视为三组五行，可能用于存储一个有八个座位的观众厅的价格。\n\
  \n# 7.11 选择排序算法和二分查找算法\n\n概念：排序算法用于将数据按某种顺序排列。搜索算法是在较大数据集中定位特定项目的方法。选择排序和二分查找是常用的排序和搜索算法。\n\
  \n# 选择排序算法\n\n通常数组中的数据需要按某种顺序排序。例如，客户列表通常按字母顺序排序。学生成绩可能从高到低排序。产品代码可以排序，以便将相同颜色的产品存储在一起。在本节中，我们将探索如何编写你自己的排序算法。排序算法扫描数组并按特定顺序重新排列内容的技术。我们将探索的算法是选择排序。\n\
  \n选择排序的工作原理如下：找到数组中的最小值并将其移动到元素 `0`。然后找到下一个较的值并移动到元素 `1`。这个过程一直持续，直到所有元素都处于正确的顺序位置。让我们看看选择排序在排列\
  \ `图 7-25` 中以下数组的元素时是如何工作的。\n\n\n\n\n\n`selection sort`（选择排序）会扫描数组，从元素 `0` 开始，并找到值最小的元素。然后将该元素的内容与元素\
  \ `0` 的内容进行交换。在这个示例中，存储在元素 `5` 中的 `1` 与存储在元素 `0` 中的 `5` 交换。交换后，数组将将如图 7-26 所示。\n\
  \n![第一次交换后，数组的六个值被排列成一行六个框，每个框标记为元素 0、元素 1、元素 2、元素 3、元素 4 和元素 5，它们分别对应值 1, 7, 2,\
  \ 8, 9 和 5。](img/07fig26.png)\n\n## 图 7-26 第一次交换后数组中的值\n\n该算法接着重复该过程，但由于元素 `0` 已经包含了数组中的最小值，因此可以将其排除在过程之外。这次，算法从元素\
  \ `1` 开始扫描。在这个示例中，元素 `2` 的内容与元素 `1` 的内容交换。数组随后将如图 7-27 所示。\n\n## 图 7-27 第二次交换后数组中的值\n\
  \n![第二次交换后，数组的六个值被排列成一行六个框。](img/07fig27.png)图 7-27 完整替代文本\n\n再次重复该过程，但这次扫描从元素 `2`\
  \ 开始。算法将发现元素 `5` 包含下一个较小。该元素的值与元素 `2` 的值交换，导致数组出现如图 7-28 所示。\n\n## 图 7-28 第三次交换后数组中的值\n\
  \n![第三次交换后，数组的六个值被排列成一行六个框。](img/07fig28.png)图 7-28 完整替代文本\n\n接下来，扫描从元素 `3` 开始。它的值与元素\
  \ `5` 的值交换，导致数组出现如图 7-29 所示。\n\n## 图 7-29 第四次交换后数组中的值\n\n![第四次交换后，数组的六个值被排列成一行六个框。](img/07fig29.png)图\
  \ 7-29 完整替代文本\n\n此时，只剩下两个元素需要排序。算法发现元素 `5` 中的值小于元素 `4` 的值，因此对两者进行交换。这使得数组处于最终排列，如图\
  \ 7-30 所示。\n\n## 图 7-30 第五次交换后数组中的值\n\n![第五次交换后，数组的六个值被排列成一行六个框。](img/07fig30.png)图\
  \ 7-30 完整替代文本\n\n以下是选择排序算法的伪代码：\n\n```\nFor startScan is each subscript in array\
  \ from 0 through the next-to-last subscript\n     Set minIndex variable to startScan\n\
       Set minValue variable to array[startScan]\n     For index is each subscript\
  \ in array from (startScan + 1) through the last subscript\n        If array[index]\
  \ is less than minValue\n           Set minValue to array[index]\n           Set\
  \ minIndex to index\n        End If \n        Increment index\n     End For. \n\
       Set array[minIndex] to array[startScan]\n     Set array[startScan] to minValue\n\
  �End For\n```\n\n以下方法对整数数组执行选择排序。作为参数传递的数组将按升序排序。\n\n```java\npublic static void\
  \ selectionSort(int[] array)\n {\n   int startScan, index, minIndex, minValue;\n\
     for (startScan = 0; startScan < (array.length−1); startScan++)\n   {\n      minIndex\
  \ = startScan;\n      minValue = array[startScan];\n      for(index = startScan\
  \ + 1; index < array.length; index++)\n         if (array[index] < minValue)\n \
  \        {\n           minValue = array[index];\n           minIndex = index;\n\
           }\n     }\n     array[minIndex] = array[startScan];\n     array[startScan]\
  \ = minValue;\n   }\n```\n\n`SelectionSortDemo.java` 程序演示了选择排序方法。你可以在此处下载本章源代码。\n\
  \n# 二分查找算法\n\n本章之前介绍了对数组进行顺序的算法。顺序搜索的优点是简单、易于理解和实现。此外，它不需要数组中的数据按任何顺序存储。然而，它的缺点是效率低下。如果数组有\
  \ 20000 个元素，顺序搜索必须检查 20000 次。在平均情况下，搜索项位于数组末尾附近。对于包含 `N` 个元素的数组，顺序搜索通常需要 `N/2` 次比较。如果有\
  \ 50000 个元素，顺序搜索需要 25000 次，这当然是假设搜索项在数组中存在。`N/2` 是平均比较次数。当顺序搜索失败时，它必须与每个元素进行比较。显然，如果速度很重要，不应该在大规模数组上使用顺序搜索。\n\
  \n二分查找是一种比顺序搜索高效得多的巧妙算法。它的唯一要求是数组中的值必须按升序排序。算法不是测试数组的第一个元素，而是从中间元素开始。如果该元素恰好包含所需的值，搜索结束。否则，中间的值大于或小于要搜索的值。如果大于，则所需的值（如果存在的话）将在数组的前半部分找到。如果小于，则所需的值（再次如果存在）将在数组的后半部分找到。无论哪情况，数组的一半元素都被排除在搜索之外。\n\
  \n如果在中间元素没有找到所需值，则对可能包含该值的数组重复该过程。例如，如果要搜索数组的后半部分，算法将测试其中间元素。如果在那里没有找到所需值，搜索将缩小到该元素之前的四分之一。该过程一直持续到找到要搜索的值，或者没有更多元素可以测试。以下是对数组执行二分查找方法的伪代码：\n\
  \n```\nSet first to 0 \n Set last to the last subscript in the array \n Set position\
  \ to − 1\n Set found to false \n While found is not true and first is less than\
  \ or equal to last\n     Set middle to the subscript half way between array[first]and\
  \ array[last]\n     If array[middle] equals the desired value \n        Set found\
  \ to true \n        Set position to middle\n     Else If array[middle] is greater\
  \ than the desired value \n        Set last to middle − 1\n     Else \n        Set\
  \ first to middle + 1\n     End If \n End While\n Return position\n```\n\n\n\n\n\
  \n该算法使用三个变量来标记数组中的位置：`first`、`last` 和 `middle`。`first` 和 `last` 变量标记了当前正在搜索的数组部分的边界。它们被初始化为数组中\
  \ `first` 和 `last` 元素的下标。`first` 和 `last` 正中间元素的下标被计算并存储在 `middle` 变量中。如果数组中间的元素不包含搜索值，则会调整\
  \ `first` 或 `last` 变量，以便在下次迭代中只搜索数组的上半或下半部分。这使得每次循环未能找到搜索值时，被搜索的数组部分都会减半。\n\n以下方法在整数数组上执行二分查找。第一个参数\
  \ `array` 用于查找是否存在存储在 `value` 中的数字。如果找到了该数字，则返回其数组中的下标。否则，返回 −1，表示该值未出现在数组中。\n\n\
  ```\npublic static int binarySearch(int[] array, int value)\n {\n    int first;\
  \          // 数组第一个元素\n    int last;           // 数组最后一个元素\n    int middle;    \
  \     // 搜索中间点\n    int position;       // 搜索值的位置\n    boolean found;      // 标记\n\
      // 设置初始值。\n    first = 0;\n    last = array.length − 1;\n    position = −1;\n\
      found = false;\n    // 搜索值。\n    while (!found && first <= last)\n    {\n  \
  \  // 计算中间点\n    middle = (first + last) / 2;\n    // 如果在中间找到了值...\n    if (array[middle]\
  \ == value)\n    {\n      found = true;\n      position = middle;\n    }\n    //\
  \ 或者如果值在下半部分...\n    else if (array[middle] > value)\n       last = middle − 1;\n\
      // 或者如果值在上半部分....\n    else\n      first = middle + 1;\n   }\n   // 返回项目的位置，如果未找到\n\
     // 则返回 −1。\n   return position;\n }\n```\n\n`BinarySearchDemo` 程序演示了该方法。你可以点击[此处](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)\
  \ 下载所有源代码。\n\n# Checkpoint 7.39\n../components/metrodigi/ch07-inline_self_quiz_v1.0.0-20/index.html\n\
