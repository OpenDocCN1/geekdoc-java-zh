  Catherine\nBill\n```\n\n# `ArrayList` 类的 `toString` 方法\n\n\n\n\n`ArrayList` 类拥有一个\
  \ `toString()` 方法，该方法返回一个表示 `ArrayList` 对象中存储的所有项的字符串。例如，假设我们像之前所示设置了 `nameList`\
  \ 对象，其中包含“James”、“Catherine”和“Bill”等等字符串。我们可以使用以下语句来显示所有名称：\n\n```\nSystem.out.println(nameList);\n\
  ```\n\n`ArrayList` 的内容将以如下方式显示：\n\n```\n[James, Catherine, Bill]\n```\n\n这在程序 `ArrayListToString.java`\
