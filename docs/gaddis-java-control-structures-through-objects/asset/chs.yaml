  \ 字段。\n\n该类还将具有以下方法：\n\n*   一个接受制造商、型号号和零售价作为参数的构造函数。\n*   一个 `setManufact` 方法，接收制造商作为参数。此方法允许我们在对象创建后，必要时更改\
  \ `manufact` 字段的值。\n*   一个 `setModel` 方法，接收型号作为参数。此方法允许我们在对象创建后，必要时更改 `model` 字段的值。\n\
  *   一个 `setRetailPrice` 方法，接收零售价作为参数。此方法允许我们在对象创建后，必要时更改 `retailPrice` 字段的值。\n*\
