  \n* 少于 20 张支票，每张 $0.10\n* 20–39 张支票，每张 $0.08\n* 40–59 张支票，每张 $0.06\n* 60 张或更多支票，每张\
  \ $0.04\n\n编写一个程序询问每月支票的数量。程序应计算并显示该月的银行服务费。\n\n# 16. 书籍积分\n\nSerendipity 书店根据每月购买的书的数量向客户发放积分。积分规定如下：\n\
  \n* 如果客户购买 0 本书，获得 0 分。\n* 如果客户购买 1 本书，获得 5 分。\n* 如果客户购买 2 本书，获得 15 分。\n* 如果客户购买\
  \ 3 本书，获得 30 分。\n* 如果客户购买 4 本或更多书，获得 60 分。\n\n编写一个程序询问用户本月购买的书的数量，然后显示所获得的积分。\n\n\
