  \n## 6.4 构造函数\n\n**概念**：构造函数是在对象创建时自动调用的方法。\n\n### 观看使用构造函数初始化对象\n[`mediaplayer.pearsoncmg.com/assets/_video.true/3JLH4yRxWiwsXq6krg_RSepc9R7RbUAo`](https://mediaplayer.pearsoncmg.com/assets/_video.true/3JLH4yRxWiwsXq6krg_RSepc9R7RbUAo)\n\
  构造函数是在类的实例创建时自动调用的方法。构造函数通常执行初始化或设置操作，例如在实例字段中存储初始值。它们被称为“构造函数”，是因为它们帮助构建对象。\n\n\
  构造方法的方法名与类名相同。例如，代码列表 6-10 显示了 `Rectangle` 类新版本的前几行。在类的这个版本中，添加了一个构造函数。（该文件存储在源代码文件夹\
  \ `第 6 章 Rectangle 第 5 阶段`中。）\n\n\n\n\n\n```java\n  /**\n     Rectangle 类，第 5 阶段\n\
  \  */\n\npublic class Rectangle\n{\n    private double length;\n    private double\
  \ width;\n\n    /**\n       构造函数\n       @param len 矩形的长度。\n       @param w 矩形的宽度。\n\
  \     */\n\n    public Rectangle(double len, double w)\n    {\n       length = len;\n\
  \       width = w;\n    }\n}\n```\n\n...该类的其余部分未发生变化，不再显示。\n\n## 代码列表 6-10 `(Rectangle.java)`\n\
  \n此构造函数接受两个参数，这些参数被传递给 `len` 和 `w` 参数变量。然后，参数变量被赋值给 `length` 和 `width` 字段。\n\n注意，构造函数的头部没有指定返回类型——即使是\
  \ `void`也没有。这是因为构造函数不是通过显式方法调用执行的，并且不能返回值。构造函数的方法头采用以下通用格式：\n\n```\nAccessSpecifier\
  \ ClassName(Parameters...)\n```\n\n以下是一个示例语句，它声明了变量 `box`，创建一个 `Rectangle` 对象，并将值\
  \ 7.0 和 14.0 传递给构造函数。\n\n```\nRectangle box = new Rectangle(7.0, 14.0);\n```\n\n\
  执行此语句后，`box` 将引用一个 `Rectangle` 对象，其 `length` 字段设置为 7，`width` 字段设置为 14。代码列表 6-11\
  \ 中的程序演示了 `Rectangle` 类的构造函数。（该文件也存储在源代码文件夹 `Chapter 06\\Rectangle Class Phase 5.`\
  \ 中。）\n\n```java\n  /**\n     此程序演示了 Rectangle 类的\n     构造函数。\n  */\n\npublic class\
  \ ConstructorDemo\n{\n    public static void main(String[] args)\n    {\n      \
  \ // 创建 Rectangle 对象，将 5.0 和\n       // 15.0 作为参数传递给构造函数。\n       Rectangle box\
  \ = new Rectangle(5.0, 15.0);\n\n       // 显示长度。\n       System.out.println(\"The\
  \ box's length is \" +\n                          box.getLength());\n\n       //\
  \ 显示宽度。\n       System.out.println(\"The box's width is \" +\n                 \
  \         box.getWidth());\n\n       // 显示面积。\n       System.out.println(\"The box's\
  \ area is \" +\n                          box.getArea());\n    }\n}\n```\n\n程序输出\n\
  \n```\nThe box's length is 5.0\nThe box's width is 15.0\nThe box's area is 75.0\n\
  ```\n\n## 代码列表 6-11 `(ConstructorDemo.java)`\n\n## 在 UML 图中显示构造函数\n\n在 UML 图中显示类的构造函数有多种接受的方法。在本书中，我们简单地像显示其他方法一样显示构造函数，但不列出返回类型。图\
  \ 6-20 显示了列有构造函数的 `Rectangle` 类的 UML 图。\n\n## 图 6-20 显示构造函数的 `Rectangle` 类 UML 图\n\
