  \n# 10.7 多态\n\n概念：父类引用变量可以引用子类的对象。\n\n# 查看多态\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/j6TMM13srPDc6_T8v0q7bqOm8o2Ls`](https://mediaplayer.pearsoncmg.com/assets/_video.true/j6TMM13srPDc6_T8v0q7bqOm8o2Ls)\n\
  \n查看以下声明名为 `exam` 的引用变量语句：\n\n```java\nGradedActivity exam;\n```\n\n该语句告诉我们 `exam`\
  \ 变量的数据类型是 `GradedActivity`。因此，我们可以使用 `exam` 变量来引用 `GradedActivity` 对象，如下：\n\n```java\n\
  exam = new GradedActivity();\n```\n\n`GradedActivity` 类也被用作 `FinalExam` 类的父类。由于父类和子类之间存在“是”的关系，`FinalExam`\
  \ 的对象不仅仅是一个 `FinalExam` 对象，它也是 `GradedActivity` 对象。（期末考试是一种评分活动）。由于这种关系，我们可以使用 `GradedActivity`\
  \ 变量来引用 `FinalExam` 对象。例如，查看以下语句：\n\n\n\n\n\n```\nGradedActivity exam = new FinalExam(50,\
  \ 7);\n```\n\n此语句将 `exam` 声明为 `GradedActivity` 变量。它创建了一个 `FinalExam` 对象并将该对象的地址存储在\
  \ `exam` 变量中。此语句是完全合法的，不会产生错误信息，因为 `FinalExam` 对象也是一个 `GradedActivity` 对象。\n\n这是多态的一个示例。`polymorphism`\
  \ 一词意味着采取多种形式的能力。在 Java 中，引用变量是多态的，因为它可以引用与其自身类型不同的对象，只要这些类型是其类型的子类。以下所有声明都是合法的，因为\
  \ `FinalExam`、`PassFailActivity` 和 `PassFailExam` 类都继承自 `GradedActivity`：\n\n```\n\
  GradedActivity exam1 = new FinalExam(50, 7);\nGradedActivity exam2 = new PassFailActivity(70);\n\
  GradedActivity exam3 = new PassFailExam(100, 10, 70);\n```\n\n尽管 `GradedActivity`\
  \ 变量可以引用任何扩展 `GradedActivity` 的类的对象，但该变量对这些对象的操作是有限制的。回想 `GradedActivity` 类有三个方法：`setScore`、`getScore`\
  \ 和 `getGrade`。因此，`GradedActivity` 变量只能调用这三个方法，无论该变量引用的对象类型是什么。例如，看以下代码：\n\n```\n\
  GradedActivity exam = new PassFailExam(100, 10, 70);\nSystem.out.println(exam.getScore());\
  \      // 正常工作。\nSystem.out.println(exam.getGrade());      // 正常工作。\nSystem.out.println(exam.getPointsEach());\
  \ // ！无法工作。\n```\n\n在此代码中，`exam` 被声明为 `GradedActivity` 变量，并赋值了一个 `PassFailExam`\
  \ 对象的地址。`GradedActivity` 类只有 `setScore`、`getScore` 和 `getGrade` 方法，因此这些是 `exam`\
  \ 变量知道如何执行的方法。代码的最后语句是对 `getPointsEach` 方法的调用，该方法定义在 `PassFailExam` 类中。由于 `exam`\
  \ 变量只认识 `GradedActivity` 类中的方法，因此它无法执行该方法。\n\n# 多态与动态绑定\n\n当父类变量引用子类对象时，存在一个潜在的问题。如果子类重写了父类中的方法，而变量调用了该方法会怎样？变量是调用父类版本的方法，还是子类的版本？例如，看以下代码：\n\
  \n```\nGradedActivity exam = new PassFailActivity(60);\nexam.setScore(70);\nSystem.out.println(exam.getGrade());\n\
  ```\n\n回想 `PassFailActivity` 类继承自 `GradedActivity` 类，并且重写了 `getGrade` 方法。当最后语句调用\
  \ `getGrade` 方法时，调用的是 `GradedActivity` 类的版本（返回 `'A'`、`'B'`、`'C'`、`'D'` 或 `'F'`），还是\
  \ `PassFailActivity` 类的版本（返回 `'P'` 或 `'F'`）？\n\n回想第 6 章，将方法调用与正确的方法定义匹配的过程被称为 `binding`。当变量包含多态引用时，Java\
  \ 执行动态绑定或晚绑定。这意味着 Java 虚拟机在运行时根据变量引用的对象类型来决定调用哪个方法。因此，决定调用哪个方法的对象类型，而不是变量的类型。在这种情况下，`exam`\
  \ 变量引用了一个 `PassFailActivity` 对象，因此调用了 `PassFailActivity` 类版本的 `getGrade` 方法。代码的最后语句将显示等级为\
  \ `P`。\n\n代码列表 10-25 中的程序演示了多态。它声明了一个 `GradedActivity` 变量数组，然后将各种类型的对象赋值给该数组。\n\n\
  ```java\n/**\n 此程序演示了多态行为。\n */\npublic class Polymorphic {\n    public static void\
  \ main(String[] args) {\n        // 创建一个 GradedActivity 引用数组。\n        GradedActivity[]\
  \ tests = new GradedActivity[3];\n        // 第一个测试是普通考试。\n        tests[0] = new\
  \ FinalExam(50, 7);\n        tests[0].setScore(95);\n        // 第二个测试是通过/不通过测试。\n\
  \        tests[1] = new PassFailActivity(75);\n        // 第三个测试是期末考试。\n        tests[2]\
  \ = new PassFailExam(86, 10, 70);\n\n        // 显示等级。\n        for (int i = 0; i\
  \ < tests.length; i++) {\n            System.out.println(\"Test \" + (i + 1) + \"\
  : score \" + tests[i].getScore() + \", grade \" + tests[i].getGrade());\n      \
  \  }\n    }\n}\n```\n\n程序输出\n```\nTest 1: score 95, grade A\nTest 2: score 75, grade\
  \ P\nTest 3: score 86, grade B\n```\n\n\n\n\n\n```java\nGradedActivity activity\
  \ = new GradedActivity();\nif (activity instanceof GradedActivity)\n   System.out.println(\"\
  Yes, activity is a GradedActivity.\");\nelse\n   System.out.println(\"No, activity\
  \ is not a GradedActivity.\");\n```\n\n这段代码将显示 `\"Yes, activity is a GradedActivity.\"\
  `。\n\n`instanceof` 运算符可以理解类继承自另一个类时存在的“是一个”（is-a）关系。例如，看以下代码：\n\n```java\nFinalExam\
  \ exam = new FinalExam(20, 2);\nif (exam instanceof GradedActivity)\n   System.out.println(\"\
  Yes, exam is a GradedActivity.\");\nelse\n   System.out.println(\"No, exam is not\
  \ a GradedActivity.\");\n```\n\n即使 `exam` 引用的对象是一个 `FinalExam` 对象，这段代码仍将显示 `\"Yes,\
  \ exam is a GradedActivity.\"`。`instanceof` 运算符返回 `true` 是因为 `FinalExam` 是 `GradedActivity`\
  \ 的子类。\n\n# 检查点 10.30\n\n../components/metrodigi/ch10-inline_self_quiz_v1.0.0-26/index.html\n\
