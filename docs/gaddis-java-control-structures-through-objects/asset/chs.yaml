  \n## 15.5 汉诺塔\n\n**概念**：解决汉诺塔游戏涉及的重复步骤很容易在递归算法中实现。\n\n汉诺塔是一种数学游戏，经常用于计算机科学教科书中说明递归的力量。该游戏使用三个柱子和一组中心有孔的圆盘。圆盘堆叠在一个柱子上，如图\
  \ 15-7](#ch15_pg0006.xhtml_P7001015878000000000000000006D35)所示。\n\n### 图 15-7 汉诺塔游戏中的柱子和圆盘\n\
  \n![了汉诺塔游戏中的柱子和圆盘。(images/15fig07.png)图 15-7 完整替代文本注意圆盘按大小堆叠在最左侧的柱子上，最大的盘在底部。该游戏基于一个传说：汉诺塔寺庙的一群僧有一组带有\
  \ 64 个圆盘的柱子。僧的任务是将圆盘从第一个柱子移动到第三个柱子。中间柱子可以作为临时支撑。此外，僧在移动圆盘时必须遵循以下规则：* 每次只能移动一个圆盘。*\
  \ 圆盘不能放在较小的盘之上。* 除了移动时，所有圆盘必须存储在柱子上。根据传说，当僧将所有圆盘从第一个柱子移动到最后一个柱子时，世界将会结束。要玩这个游戏，你必须按照与僧相同的规则将所有圆盘从第一个柱子移动到第三个柱子。让我们看看不同数量圆盘的解决方案。如果你只有一个圆盘，游戏的解决方法很简单：将圆盘从\
  \ 1 号柱移动到 3 号柱。如果你有两个圆盘，解决方法需要三次移动：* 将圆盘 1 移动到 2 号柱。* 将圆盘 2 移动到 3 号柱。* 将圆盘 1 移动到\
  \ 3 号柱。注意这种方法使用 2 号柱作为临时位置。随着圆盘数量的增加，移动的复杂度继续增加。移动三个圆盘需要图 15-8](img/#ch15_pg0006.xhtml_P7001015878000000000000000006D56)\
  \ 所示的七次移动。\n\n以下陈述描述了问题的整体解决方案：\n\n\n\n\n\n```\n使用柱 2 作为临时柱，将 n 个盘子从柱 1 移动到柱 3。\n\
  ```\n\n以下算法可以作为递归方法的基础，模拟游戏的解决方案。请注意，在该算法中，我们使用变量 `A`、`B` 和 `C` 来存储柱的编号。\n\n```\n\
  将 n 个盘子从柱 A 移动到柱 C，使用柱 B 作为临时柱：\n 如果 n > 0 则\n     使用柱 C 作为临时柱，将 n − 1 个盘子从柱 A 移动到柱\
  \ B。\n     将剩余的盘子从柱 A 移动到柱 C。\n     使用柱 A 作为临时柱，将 n − 1 个盘子从柱 B 移动到柱 C。\n 结束\n```\n\
  \n当没有更多盘子需要移动时，达到基础基础。以下代码实现该算法的方法。该方法并没有实际移动任何物体，而是显示指示所有盘子移动的指令。\n\n```java\n\
  private void moveDiscs(int num, int fromPeg, int toPeg, int tempPeg)\n {\n    if\
  \ (num > 0)\n    {\n       moveDiscs(num − 1, fromPeg, tempPeg, toPeg);\n      \
  \ System.out.println(\"Move a disc from peg \" + fromPeg +\n                   \
  \       \" to peg \" + toPeg);\n       moveDiscs(num − 1, tempPeg, toPeg, fromPeg);\n\
      }\n }\n```\n\n### 图 15-8 移动三个柱的步骤\n\n![在 7 张图中，展示了移动三个柱的过程](img/15fig08.png)图\
  \ 15-8 完整备用文本\n\n该方法接受以下四个参数的参数值：\n\n| `num` | 要移动的盘子数量。 |\n| `fromPeg` | 盘子移出的柱。\
  \ |\n| `toPeg` | 盘子移到的柱。 |\n| `tempPeg` | 作为临时柱的柱。 |\n\n如果 `num` 大于 0，则有盘子需要移动。第一次递归调用如下：\n\
  \n```\nmoveDiscs(num − 1, fromPeg, tempPeg, toPeg);\n```\n\n该语句的指令是将除一个之外的所有盘子从\
  \ `fromPeg` 移动到 `tempPeg`，使用 `toPeg` 作为临时柱。下一个语句如下：\n\n```java\nSystem.out.println(\"\
  Move a disc from peg \" + fromPeg + \" to peg \" + toPeg);\n```\n\n这仅仅是显示一条消息，指示应该将盘子从\
  \ `fromPeg` 移动到 `toPeg`。接下来，执行另一个递归调用：\n\n```\nmoveDiscs(num − 1, tempPeg, toPeg,\
  \ fromPeg);\n```\n\n该语句的指令是将除一个之外的所有盘子从 `tempPeg` 移动到 `toPeg`，使用 `fromPeg` 作为临时柱。代码列表\
  \ 15-10 显示了使用此方法的 `Hanoi` 类。\n\n```java\n/**\n * 此类显示了汉诺塔游戏的解决方案。\n */\npublic class\
  \ Hanoi\n{\n    private int numDiscs; // 盘子数量\n\n    /**\n     * 构造函数。\n     * @param\
  \ n 使用的盘子数量。\n     */\n    public Hanoi(int n)\n    {\n        // 分配盘子数量。\n    \
  \    numDiscs = n;\n        // 使用柱 2 作为临时位置，\n        // 将盘子从柱 1 移动到柱 3\n      \
  \  moveDiscs(numDiscs, 1, 3, 2);\n    }\n\n    /**\n     * moveDiscs 方法显示一次移动。\n\
  \     * @param num 要移动的盘子数量。\n     * @param fromPeg 移出的柱。\n     * @param toPeg 移入的柱。\n\
  \     * @param tempPeg 临时柱。\n     */\n    private void moveDiscs(int num, int fromPeg,\
  \ int toPeg, int tempPeg)\n    {\n        if (num > 0)\n        {\n           moveDiscs(num\
  \ − 1, fromPeg, tempPeg, toPeg);\n           System.out.println(\"Move a disc from\
  \ peg \" + fromPeg + \" to peg \" + toPeg);\n           moveDiscs(num − 1, tempPeg,\
  \ toPeg, fromPeg);\n        }\n    }\n}\n```\n\n# 代码列表 15-10 (Hanoi.java)\n\n类构造函数接受一个参数，即游戏中使用的盘子数量。它将此值赋值给\
  \ `numDiscs` 字段，然后在第 22 行调用 `moveDiscs` 方法。简而言之，该语句的指令是将所有盘子从柱 1 移动到柱 3，使用柱 2 作为临时柱。代码列表\
  \ 15-11 中的程序演示了该类。它显示了移动三个盘子的指令。\n\n```java\n/**\n * 此类演示了 Hanoi 类，该类\n * 显示了解决汉诺塔游戏所需的步骤。\n\
  \ */\npublic class HanoiDemo\n{\n    static public void main(String[] args)\n  \
  \  {\n        Hanoi towersOfHanoi = new Hanoi(3);\n    }\n}\n```\n\n### 程序输出\n\n\
  ```\nMove a disc from peg 1 to 3\nMove a disc from peg 1 to 2\nMove a disc from\
  \ peg 3 to 2\nMove a disc from peg 1 to 3\nMove a disc from peg 2 to 1\nMove a disc\
  \ from peg 2 to 3\nMove a disc from peg 1 to 3\n```\n\n# 代码列表 15-11 (HanoiDemo.java)\n\
  \n## 应避免的常见错误\n\n*   **没有编写基础情况**：当到达基础情况时，递归方法会停止调用自身。如果没有基础情况，方法将继续调用自身。\n*  \
  \ **每次递归调用时没有缩小问题**：除非每次递归调用时都在缩小问题（通常意味着一个或多个关键参数的值在减少），否则方法将无法到达基础情况。\n*   **编写递归的方式导致无法到达基础情况**：你可能编写了基础情况和缩小问题的递归情况，但如果计算方式无法导致到达基础情况，方法将无限调用自身。\n\
