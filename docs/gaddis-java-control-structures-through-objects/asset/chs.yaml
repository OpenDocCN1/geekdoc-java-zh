  \n# 2.13 读取输入\n\n概念：Scanner 类对象可以用于读取输入。之前我们讨论了 `System.out` 对象，它指向标准输出。Java 有另一个对象\
  \ `System.in`，它指向键盘。然而，使用 `System.in` 不像 `System.out` 那样简单，因为 `System.in` 只读取字节值。为了解决这个问题，你可以结合\
  \ `System.in` 使用 `Scanner` 类。它提供原始值或字符串输入。\n\n首先，创建一个 `Scanner` 对象并将其连接到 `System.in`。这是一个实现此操作的语句示例：\n\
  \n```\nScanner keyboard = new Scanner(System.in);\n```\n\n把语句分为两个部分。语句的第一部分\n\n\
  ```\nScanner keyboard\n```\n\n定义名为 `keyboard` 的变量。变量的数据类型是 `Scanner`。由于 `Scanner`\
  \ 是一个类，`keyboard` 变量是一个类变量。回想对 `String` 对象的讨论，类变量持有对象的地址。因此，`keyboard` 变量将持有 `Scanner`\
  \ 对象的地址。语句的第二部分如下：\n\n```\n= new Scanner(System.in);\n```\n\n我们在该部分看到的第一个符号是赋值运算符\
  \ `=`。赋值运算符会将内容赋值给 `keyboard` 变量。赋值运算符之后看到单词 `new`，这是一个关键字。`new` 关键字的目的是在内存中创建一个对象。接下来列出要创建的对象。在这种情况下，我们在\
  \ `new` 关键字之后看到了 `Scanner(System.in)`。这指定要创建一个 `Scanner` 对象，并将其连接到 `System.in` 对象。对象的内存地址被通过\
  \ `=` 运算符赋值给变量 `keyboard`。语句执行后，`keyboard` 变量将引用内存中创建的 `Scanner` 对象。\n\n图 2-12 指出了该语句每个部分的目的。图\
  \ 2-13 插图了 `keyboard` 变量如何引用 `Scanner` 类对象。\n\n\n\n\n\n# 图 2-13 变量 keyboard 引用了一个\
  \ `Scanner` 对象\n\n### 注意事项\n\n在之前的代码中，我们选择 `keyboard` 作为变量名。`keyboard` 这个名字并没有特殊之处。我们之所以选择这个名字是因为我们将使用该变量从键盘读取输入。\n\
  \n`Scanner` 类具有用于读取字符串、`byte`、整数、`long` 整数、`short` 整数、`float` 和 `double` 的方法。例如，下面的代码使用\
  \ `Scanner` 类的对象从键盘读取一个 `int` 值，并将该值赋值给 `number` 变量。\n\n```\nint number;\nScanner\
  \ keyboard = new Scanner(System.in);\nSystem.out.print(\"Enter an integer value:\
  \ \");\nnumber = keyboard.nextInt();\n```\n\n这里显示的最后一条语句调用了 `Scanner` 类的 `nextInt`\
  \ 方法。`nextInt` 方法将输入值格式化为 `int`，然后返回该值。因此，该语句将在键盘上输入的输入格式化为 `int`，然后将其返回。该值被赋值给\
  \ `number` 变量。\n\n[表 2-17] 列出了 `Scanner` 类的几个方法并描述了它们的用途。\n\n## 表 2-17 `Scanner`\
  \ 类的一些方法\n\n| 方法 | 示例和描述 |\n| --- | --- |\n| `nextByte` | **示例用法：** \n```\n byte\
  \ x;\n   Scanner keyboard = new Scanner(System.in);\n   System.out.print(\"Enter\
  \ a byte value: \");\n   x = keyboard.nextByte();\n```\n**描述：** 返回输入作为 `byte`。 |\n\
  | `nextDouble` | **示例用法：** \n```\n double number;\n   Scanner keyboard = new Scanner(System.in);\n\
  \   System.out.print(\"Enter a double value: \");\n   number = keyboard.nextDouble();\n\
  ```\n**描述：** 返回输入作为 `double`。 |\n| `nextFloat` | **示例用法：** \n```\n float number;\n\
  \   Scanner keyboard = new Scanner(System.in);\n   System.out.print(\"Enter a float\
  \ value: \");\n   number = keyboard.nextFloat();\n```\n**描述：** 返回输入作为 `float`。 |\n\
  | `nextInt` | **示例用法：** \n```\n int number;\n   Scanner keyboard = new Scanner(System.in);\n\
  \   System.out.print(\"Enter an integer value: \");\n   number = keyboard.nextInt();\n\
  ```\n**描述：** 返回输入作为 `int`。 |\n| `nextLine` | **示例用法：** \n```\n String name;\n  \
  \ Scanner keyboard = new Scanner(System.in);\n   System.out.print(\"Enter your name:\
  \ \");\n   name = keyboard.nextLine();\n```\n**描述：** 返回输入作为 `String`。 |\n| `nextLong`\
  \ | **示例用法：** \n```\n long number;\n   Scanner keyboard = new Scanner(System.in);\n\
  \   System.out.print(\"Enter a long value: \");\n   number = keyboard.nextLong();\n\
  ```\n**描述：** 返回输入作为 `long`。 |\n| `nextShort` | **示例用法：** \n```\n short number;\n\
  \   Scanner keyboard = new Scanner(System.in);\n   System.out.print(\"Enter a short\
  \ value: \");\n   number = keyboard.nextShort();\n```\n**描述：** 返回输入作为 `short`。 |\n\
  \n## 使用 `import` 语句\n\n在你准备好使用 `Scanner` 类之前，还有一个关于 `Scanner` 类的最后一个细节你需要了解。`Scanner`\
  \ 类不会自动供你的 Java 程序使用。任何使用 `Scanner` 类的程序都应该在文件的开头（任何类定义之前）包含以下语句：\n\n```\nimport\
  \ java.util.Scanner;\n```\n\n该语句告诉 Java 编译器在 Java 库的什么位置查找 `Scanner` 类，并使其对程序可用。\n\
  \n[代码列表 2-29] 显示了使用 `Scanner` 类读取 `String`、`int` 和 `double`。\n\n在下面的动画中，点击“Previous”（上一个）或“Next”（下一个）按钮来逐步执行代码并查看整个过程中的解释。\n\
  \n## 代码列表 2-29 `(Payroll.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-29/29.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-29/29.html)\n\
  \n### 注意事项\n\n注意，我们使用的每个 `Scanner` 类方法在返回值之前都会等待用户按下 `Enter ↵` 键。当按下 `Enter ↵` 键时，光标会自动移动到下一行，以便后续的输出操作。\n\
  \n## 读取字符\n\n有时你可能想要从键盘读取单个字符。例如，你的程序可能会向用户问一个是/否问题，并指定让其输入 Y 表示是，输入 N 表示否。然而，`Scanner`\
  \ 类没有读取单个字符的方法。我们将用于读取字符的方法是使用 `Scanner` 类的 `nextLine` 方法读取一个字符串，然后使用 `String` 类的\
  \ `charAt` 方法提取该字符。这里是一个示例：\n\n```\nString input; // 用于存储一行输入\nchar answer;  //\
  \ 用于存储一个字符\nScanner keyboard = new Scanner(System.in); // 创建一个 Scanner 对象\nSystem.out.print(\"\
  Are you having fun? (Y=yes\"); // 询问用户问题\ninput = keyboard.nextLine(); // 获取行\n\
  answer = input.charAt(0); // 获取字符\n```\n\n`input` 变量引用了一个 `String` 对象。此代码中的最后一条语句调用了\
  \ `String` 类的 `charAt` 方法来检索位置 0 处的字符。在该语句执行后，`answer` 变量将持有该字符。\n\n## 将 `nextLine`\
  \ 调用与其他 Scanner 方法混合使用\n\n当你调用 `Scanner` 类方法读取基本类型值（如 `nextInt` 或 `nextDouble`），然后调用\
  \ `nextLine` 方法读取字符串时，可能会出现一个难以发现的问题。例如，查看代码列表 2-30 中的程序。在下面的动画中，点击“Previous”或“Next”按钮逐步执行代码并查看整个过程中的解释。\n\
  \n## 代码列表 2-30 `(InputProblem.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-30/30.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-30/30.html)\n\
  \n从示例输出中注意，程序首先允许用户输入年龄。第 20 行语句从键盘读取一个 `int` 并将值存储给 `age` 变量。接下来，用户输入收入。第 24 行语句从键盘读取一个\
  \ `double` 并将值存储给 `income` 变量。然后要求用户输入姓名，但似乎第 28 行的语句被跳过了。姓名从未从键盘读取。这种情况发生的原因是 `nextLine`\
  \ 方法与其他 `Scanner` 类方法在行为上的细微差异。\n\n当用户在键盘上输入字符时，这些按键会被存储在有时被称为*键盘缓冲区*（keyboard buffer）的内存区域。按下\
  \ `Enter ↵` 键会导致换行符存储在键盘缓冲区中。在代码列表 2-30 的程序的示例运行中，用户被要求输入年龄，第 20 行语句调用了 `nextInt`\
  \ 方法从键盘缓冲区读取一个整数。注意用户输入了 24 然后按了 `Enter ↵` 键。`nextInt` 方法从键盘缓冲区读取了值 24，然后在遇到换行符时停止。因此，值\
  \ 24 从键盘缓冲区读取了，但换行符没有被读取。换行符留在键盘缓冲区中。\n\n\n\n\n\n接下来，用户被要求输入年收入。用户输入了 `50000.00`\
  \ 然后按下了 `Enter ↵` 键。当第 24 行的 `nextDouble` 方法执行时，它首先遇到由 `nextInt` 方法留下的换行符。这不会引起问题，因为\
  \ `nextDouble` 方法的设计初衷是跳过它遇到的任何领先换行符。它会跳过初始换行符，从键盘缓冲区中读取值 `50000.00`，并在遇到下一个换行符时停止读取。这个换行符随后被留在键盘缓冲区中。\n\
  \n接下来，用户被要求输入姓名。在第 28 行中调用了 `nextLine` 方法。然而，`nextLine` 方法的设计并不是为了跳过初始换行符的。如果换行符是\
  \ `nextLine` 方法遇到的第一个字符，那么将没有任何内容能被读取。由于第 24 行的 `nextDouble` 方法在键盘缓冲区中留下了一个换行符，`nextLine`\
  \ 方法将读取任何输入。相反，它将立即终止，用户将没有机会输入姓名。\n\n尽管这个问题的细节看起来可能很困惑，但解决方案很简单。代码列表 2-31 中的程序是\
  \ 代码列表 2-30 的修改，修复了输入问题。\n\n在下面的动画中，点击“上一个”或“下一个”按钮可以逐步执行代码并查看全程各处的解释。\n\n# 代码列表\
  \ 2-31 `(CorrectedInputProblem.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-31/31.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-31/31.html)\n\
  \n注意，在第 24 行通过 `nextDouble` 方法读取用户收入后，第 27 行调用了 `nextLine` 方法。此调用的目的是消耗（或移除）留在键盘缓冲区中的换行符。然后，在第\
  \ 31 行再次调用了 `nextLine` 方法。这一次它正确地读取了用户的姓名。\n\n### 注意\n\n注意在第 27 行，当我们消耗剩余的换行符时，我们没有将方法的返回值赋值给任何变量。这是因为我们仅仅是调用该方法来移除换行符，不需要保留方法的返回值。\n\
  \n# 检查点 2.60\n\n# 检查点 2.61\n\n## 2.14 对话框\n\n### 概念：JOptionPane 类\n`JOptionPane`\
  \ 类允许你快速显示对话框，对话框是一个用于显示消息或请求输入的小型图形化窗口。\n\n*对话框*是一个向用户显示消息或请求输入的小型图形化窗口。你可以使用 `JOptionPane`\
  \ 类快速显示对话框。在本节中，我们将讨论以下类型的对话框以及你如何使用 `JOptionPane` 显示它们：\n\n| • 消息对话框 | 显示消息的对话框；同时还会显示一个\
  \ OK 按钮 |\n| • 输入对话框 | 提示用户输入并提供输入文本框的对话框；同时显示一个 OK 按钮和一个取消按钮 |\n\n图 2-14 显示了每种对话框的示例。\n\
  \n# 图 2-14 消息对话框和输入对话框（Oracle 法务顾问）\n\n![消息对话框和输入对话框包含一些重叠和一些不同的特征。](img/02fig14.png)图\
  \ 2-14 完整替代文本\n\n`JOptionPane` 类对你的 Java 程序并不是自动可用。任何使用 `JOptionPane` 类的程序都必须在文件开头包含以下语句：\n\
  \n```\nimport javax.swing.JOptionPane;\n```\n\n该语句告诉编译器去哪里寻找 `JOptionPane` 类，并使其对程序可用。\n\
  \n### 显示消息对话框\n\n`showMessageDialog` 方法用于显示消息对话框。这里是调用该方法的语句：\n\n```\nJOptionPane.showMessageDialog(null,\
  \ \"Hello World\");\n```\n\n第一个参数仅在显示其他图形窗口的程序中重要。在我们的示例中，我们始终将关键字 `null` 作为第一个参数。这会导致对话框显示在屏幕中央。第二个参数是我们希望在对话框中显示的消息。这段代码会导致图\
  \ 2-15 中的对话框显示\n\n# 显示输入对话框\n\n输入对话框是要求用户输入数据的快速简单方法。你使用 `JOptionPane` 类的 `InputDialog`\
  \ 方法来显示。以下代码调用了该方法：\n\n```\nString name;\nname = JOptionPane.InputDialog(\"Enter\
  \ your name.\");\n```\n\n传递给方法的参数是要显示的消息。该语句会导致图 2-16 出现在屏幕中央。如果用户点击 OK 按钮，`name`\
  \ 将引用用户输入的字符串。如果用户点击取消按钮，`name` 将引用特殊值 `null`。\n\n![输入对话框指示用户：Enter your name.](img/02fig16.png)\n\
  \n# 图 2-16 输入对话框（Oracle 法务顾问）\n\n### 示例程序\n\n代码列表 2-32 中的程序演示了如何使用两种对话框。该程序使用输入对话框询问用户的名、中间和姓，然后显示一条问候消息。\n\
  \n### 代码列表 2-32 `(NamesDialog.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-32/32.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-32/32.html)\n\
  \n注意 `main` 方法中的最后一个语句：\n\n```\nSystem.exit(0);\n```\n\n该语句导致程序结束，在控制台程序中使用 `JOptionPane`\
  \ 类时是必要的。当控制台程序使用 `JOptionPane` 显示对话框时，当 `main` 方法结束时，程序不会自动停止执行。这是因为 `JOptionPane`\
  \ 类导致在 JVM 中运行一个额外的任务。如果没有调用 `System.exit` 方法，该任务（也称为*线程*）将继续执行，即使 `main` 方法已经执行完毕结束。\n\
  \n# 警告！\n\n仅在绝对必要时才使用 `System.exit`。在大型程序中，System.exit 可能会导致问题，因为它无条件地关闭 JVM，跳过了程序正常的逻辑流。在本书中，我们使用\
  \ `System.exit` 仅是因为结束使用 `JOptionPane` 的控制台程序是必要的。\n\n\n\n\n\n`System.exit` 方法需要一个整数参数。该参数是一个传回操作系统的退出代码。虽然此代码通常会被忽略，但它可以在程序外部使用，用于指示程序是成功结束还是作为失败的结果结束的。值\
  \ `0` 传统上表示程序成功结束。\n\n# 将字符串输入转换为数字\n\n与 `Scanner` 类不同，`JOptionPane` 类没有不同的方法来读取不同数据类型的输入值。`showInputDialog`\
  \ 方法始终将用户的输入作为 `String` 返回，即使用户输入的是数字数据。例如，如果用户在输入对话框中输入数字 `72`，`showInputDialog`\
  \ 方法将返回字符串 `\"72\"`。如果你想在数学运算中使用用户的输入，这可能会产生一个问题，因为你所知道的，你不能对字符串进行数学运算。在这种情况下，你必须将输入转换为数值。要将字符串值转换为数值，你可以使用表\
  \ 2-18 中列出的方法之一。\n\n# 表 2-18 将字符串转换为数字的方法\n\n| 方法 | 使用此方法来 . . . . | 示例代码 |\n| ---\
  \ | --- | --- |\n| `Byte.parseByte` | 将字符串转换为 `byte`。 | `byte num;` `num = Byte.parseByte(str);`\
  \ |\n| `Double.parseDouble` | 将字符串转换为 `double`。 | `double num;` `num = Double.parseDouble(str);`\
  \ |\n| `Float.parseFloat` | 将字符串转换为 `float`。 | `float num;` `num = Float.parseFloat(str);`\
  \ |\n| `Integer.parseInt` | 将字符串转换为 `int`。 | `int num;` `num = Integer.parseInt(str);`\
  \ |\n| `Long.parseLong` | 将字符串转换为 `long`。 | `long num;` `num = Long.parseLong(str);`\
  \ |\n| `Short.parseShort` | 将字符串转换为 `short`。 | `short num;` `num = Short.parseShort(str);`\
  \ |\n\n### 注意\n\n表 2-18 中的方法是 Java 包装类的一部分，你将在第 9 章中学习更多内容。\n\n以下是如何使用 `Integer.parseInt`\
  \ 方法将 `JOptionPane.showInputDialog` 方法返回的值转换为 `int` 的示例：\n\n```\nint number;\nString\
  \ str;\nstr = JOptionPane.showInputDialog(\"Enter a number.\");\nnumber = Integer.parseInt(str);\n\
  ```\n\n此代码执行后，`number` 变量将保存用户输入的值，并将其转换为 `int`。以下是如何使用 `Double.parseDouble` 方法将用户的输入转换为\
  \ `double` 的示例：\n\n```\ndouble price;\nString str;\nstr = JOptionPane.showInputDialog(\"\
  Enter the retail price.\");\nprice = Double.parseDouble(str);\n```\n\n此代码执行后，`price`\
  \ 变量将保存用户输入的值，并将其转换为 `double`。代码列表 2-33 显示了一个完整的程序。这是对代码列表 2-29 中 `Payroll.java`\
  \ 程序的修改。当此程序执行时，图 2-18 中显示的对话框将逐个显示。\n\n在下面的动画中，点击“上一个”或“下一个”按钮可以逐步通过代码并查看贯穿其中的解释。\n\
