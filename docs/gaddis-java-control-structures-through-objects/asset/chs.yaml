  \n# 4.11 使用 Random 类生成随机数\n\n概念：随机数用于各种应用程序。Java 提供了 `Random` 类，你可以用它生成随机数。\n\n\
  随机数对许多任务都很有用。以下只是几个例子：\n\n- 随机数常用于游戏。例如，掷骰子的电脑游戏使用随机数表示骰子。显示从洗过的牌中抽牌的程序使用随机数。\n\
  - 随机数对模拟程序有用。在某些模拟中，计算机必须随机决定人、动物、昆虫或其他生物的行为。可以构建使用随机数的公式。\n- 随机数在随机选择数据的统计程序中有用。\n\
  - 随机数常用于计算机安全加密数据。\n\nJava API 提供了一个名为 `Random` 的类，你可以用它生成随机数。该类是 `java.util` 包的一部分，因此任何使用它的程序都需要如下的\
  \ `import` 语句：\n\n```\nimport java.util.Random;\n```\n\n你通过如下语句从 `Random` 类创建一个对象：\n\
  \n```\nRandom randomNumbers = new Random();\n```\n\n该语句执行了以下操作：\n\n- 它声明了一个名为 `randomNumbers`\
  \ 的变量。数据类型是 `Random` 类。\n- 表达式 `new Random()` 创建了 `Random` 类的实例。\n- 等号将 `Random`\
  \ 类的地址赋值给 `randomNumbers` 变量。\n\n执行该语句后，`randomNumbers` 变量将引用一个 `Random` 对象。一旦你创建了\
  \ `Random` 对象，就可以调用它的 `nextInt` 方法来获取随机整数。以下代码显示了一个示例：\n\n```\n// 声明一个 int 变量。\n\
  int number;\n// 创建一个 Random 对象。\nRandom randomNumbers = new Random();\n// 获取随机整数并赋值给\
  \ number。\nnumber = randomNumbers.nextInt();\n```\n\n执行该代码后，`number` 变量将包含一个随机整数。如果你不带参数地调用\
  \ `nextInt` 方法（如示例所示），返回的整数位于 −2,147,483,648 到 +2,147,483,647 之间。或者，你可以传递一个参数来指定生成数字范围的上限。在以下语句中，赋值给\
  \ `number` 的值位于 0 到 99 之间：\n\n```\nnumber = randomNumbers.nextInt(100);\n```\n\n\
  \n\n\n你可以通过增加或减少一个值来将数值范围向上或向下移动。在接下来的语句中，我们调用 `nextInt` 方法来获取一个 0 到 9 之间的随机数，然后对其加\
  \ 1。因此，赋值给 `number` 的数字将位于 1 到 10 的范围内：\n\n```\nnumber = randomNumbers.nextInt(10)\
  \ + 1;\n```\n\n接下来的语句显示了另一个示例。它将一个 −50 到 +49 之间的随机整数赋值给 `number`：\n\n```\nnumber\
  \ = randomNumbers.nextInt(100) - 50\n```\n\n`Random` 类还有其他生成随机数的方法，表 4-1](#ch04_pg0014.xhtml_P7001015878000000000000000001E95)\
  \ 总结了其中几种方法。\n\n# 表 4-1 `Random` 类的一些方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `nextDouble()`\
  \ | 返回作为 `double` 类型的下一个随机数。该数字将在 `0.0` 到 `1.0` 之间。 |\n| `nextFloat()` | 返回作为 `float`\
  \ 类型的下一个随机数。该数字将在 `0.0` 到 `1.0` 之间。 |\n| `nextInt()` | 返回作为 `int` 类型的下一个随机数。该数字将在\
  \ `int` 范围内，即 −2,147,483,648 到 +2,147,483,648 之间。 |\n| `nextInt(int n)` | 此方法接受一个整数参数\
  \ `n`。它返回一个作为 `int` 类型的随机数。该数字将在 0 到 `n` 范围内。 |\n| `nextLong()` | 返回作为 `long` 类型的下一个随机数。该数字将在\
  \ `long` 范围内，即 −9,223,372,036,854,775,808 到 +9,223,372,036,854,775,808 之间。 |\n\n\
  代码列表 4-23 中的程序演示了如何使用 `Random` 类。在下面的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看全程中的解释。\n\n# 代码列表\
