  \ 类\n\n`Rectangle` 类有四个构造函数，总结在表 14-4 中。\n\n# 表 14-4 Rectangle 类构造函数\n\n| 构造函数 |\
  \  |\n| --- | --- |\n| `Rectangle()` | 创建一个空矩形。调用 `Rectangle` 类的 `setX` 和 `setY`\
  \ 方法来建立矩形左上角的位置，调用 `setWidth` 方法建立宽度，调用 `setHeight` 方法建立高度，并调用 `setFill` 方法填充矩形。\
  \ |\n| `Rectangle(width, height)` | `width` 和 `height` 是 `double` 类型。调用 `Rectangle`\
  \ 类的 `setX` 和 `setY` 方法来建立矩形左上角的位置，调用 `setWidth` 方法建立宽度，调用 `setHeight` 方法建立高度，并调用\
  \ `setFill` 方法填充矩形。 |\n| `Rectangle(x, y, width, height)` | `x`、`y`、`width` 和 `height`\
  \ 都是 `double` 类型。创建一个左上角位于指定 `x`、`y` 坐标，具有指定宽度和高度的矩形。调用 `Rectangle` 类的 `setFill`\
  \ 方法填充矩形。 |\n| `Rectangle(width, height, fill)` | 参数 `width` 和 `height` 是 `double`\
  \ 类型，参数 `fill` 是一个 `Paint` 类对象（通常是 `Color` 类常量）。创建一个具有指定 `width` 和 `height` 的矩形，并用指定的\
  \ `fill` 填充。 |\n\n以下语句创建了一个左上角位于 (200, 100)、宽度为 75、高度为 150 的矩形：\n\n```java\nRectangle\
  \ myRectangle = new Rectangle(200, 100, 75, 150);\n```\n\n你可以使用 `Rectangle` 类的 `setX`\
  \ 和 `setY` 方法来建立矩形左上角的位置，使用 `setWidth` 方法建立宽度，使用 `setHeight` 方法建立高度，并使用 `setFill`\
  \ 方法填充矩形。这里的示例创建了一个左上角位于 (10, 20)、宽为 50、高为 100 且填充为绿色的矩形：\n\n```java\nRectangle\
  \ myRectangle = new Rectangle();\nmyRectangle.setX(10);\nmyRectangle.setY(20);\n\
  myRectangle.setWidth(50);\nmyRectangle.setHeight(100);\nmyRectangle.setFill(Color.DARKGREEN);\n\
