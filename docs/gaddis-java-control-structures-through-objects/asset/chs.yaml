  \ 行显示应用程序窗口。\n\n### 注意\n\n如果椭圆的 `X` 半径和 `Y` 半径具有相同的值，则椭圆将是一个圆。\n\n# `Arc` 类\n\n\
  `Arc` 类绘制圆弧，圆弧被认为是椭圆的一部分。`Arc` 类有两个构造函数，总结在表 14-6 中。\n\n# 表 14-6 `Arc` 类的构造函数\n\n\
  | 构造函数 | 描述 |\n| :--- | :--- |\n| `Arc()` | 创建空圆弧。调用 `Arc` 类的 `setCenterX()` 和 `setCenterY()`\
  \ 方法建立圆弧的中心点，`setRadiusX()` 建立圆弧沿 `X` 轴的半径，`setRadiusY()` 建立圆弧沿 `Y` 轴的半径，`setStartAngle()`\
  \ 建立圆弧的起始角度（度），`setLength()` 建立圆弧的角度范围（度）。 |\n| `Arc(centerX, centerY, radiusX,\
  \ radiusY, startAngle, length)` | 参数为 `double` 类型。在指定的中心点以指定的 `X` 和 `Y` 半径创建一个圆弧。圆弧从\
  \ `startAngle` 指定的角度开始，并逆时针方向延伸。`length` 参数指定圆弧从其起始角度延伸的度数。 |\n\n由于圆弧是椭圆的一部分，你需要建立一个中心点、一个\
  \ `X` 半径和一个 `Y` 半径。此外，圆弧有一个起始角度和一个角度长度，两者都以度为单位。注意 0 度在 3 点钟位置，圆弧从起始角度逆时针绘制。\n\n\
  # 图 14-8 圆弧属性\n\n![显示了圆弧的属性。](img/14fig08.png)\n\n默认情况下，圆弧将填充为黑色。你可以调用 `Arc` 类的\
  \ `setFill()` 方法（继承自 `Shape`）将其填充为另一种颜色。如果你希望圆弧不填充，请向 `setFill()` 方法传递 `null`。然后，调用\
  \ `Arc` 类的 `setStroke()` 方法（同样继承自 `Shape`）更改轮廓颜色。\n\n有三种可以使用 `Arc` 类绘制的圆弧类型。要选择这些圆弧类型之一，你需要从\
  \ `javafx.scene.shape` 包导入 `ArcType` 类。然后将表 14-7 列出的常量之一传递给 `Arc` 类的 `setType()`\
  \ 方法。（注意默认类型为 `ArcType.CHORD`。）\n\n# 表 14-7 圆弧类型\n\n| 类型 | 描述 |\n| :--- | :--- |\n\
  | `ArcType.CHORD` | 这是默认圆弧类型。会在圆弧的一个端点到另一个端点之间画直线。 |\n| `ArcType.ROUND` | 会从每个端点到圆弧的中心点画直线。结果是圆弧形状像饼切形。\
  \ |\n| `ArcType.OPEN` | 不会连接端点。只绘制圆弧。 |\n\n![显示了三种类型的圆弧。Arc Type, point, CHORD 看起来像圆的上部分。Arc\
  \ Type, point, ROUND 看起来像圆的三角形扇形。Arc Type, point, OPEN 看起来像圆曲线的轮廓。](img/14fig09.png)\n\
  \n# 图 14-9 圆弧类型\n\n一个使用圆弧绘制饼图的示例程序。程序的输出如图 14-10 所示。\n\n\n\n\n\n`Polygon` 类创建一个闭合的多边形，默认情况下填充为黑色。多边形由多个连接的线段组成。两条线段连接的点称为\
  \ `vertex`（顶点）。`Polygon` 类有两个构造函数，总结在表 14-8 中。\n\n# 表 14-8 `Polygon` 类的构造函数\n\n\
  | 构造函数 | 描述 |\n| --- | --- |\n| `Polygon()` | 创建一个空的多边形。调用 `Polygon` 类的 `getPoints().addAll()`\
  \ 方法来确立多边形顶点的 `XY` 坐标。 |\n| `Polygon(x1, y1, x2, y2, ...)` | 可变数量的参数（类型为 `double`）是多边形顶点的\
  \ `XY` 坐标。 |\n\n当你调用参数化构造函数时，将每个顶点的 (*X*,*Y*) 坐标作为参数传递。前两个参数是第一个顶点的 (*X*,*Y*) 坐标，接两个参数是第二个顶点的\
  \ (*X*,*Y*) 坐标，依此类推。以下是一个绘制菱形的示例：\n\n```\nPolygon diamond = new Polygon(160.0, 20.0,\
  \  // 顶\n                              300.0, 120.0, // 右\n                    \
  \          160.0, 220.0, // 底\n                              20.0,  120.0, // 左\n\
  \                              160.0, 20.0); // 顶\n```\n\n如果你调用无参构造函数来创建一个空的多边形，随后可以调用\
  \ `Polygon` 类的 `getPoints().addAll()` 方法来确立顶点的坐标。以下是创建之前所示菱形的示例：\n\n```\nPolygon\
  \ diamond = new Polygon();\ndiamond.getPoints().addAll(160.0, 20.0,  // 顶\n    \
  \                       300.0, 120.0, // 右\n                           160.0, 220.0,\
  \ // 底\n                           20.0,  120.0, // 左\n                        \
  \   160.0, 20.0); // 顶\n```\n\n默认情况下，多边形填充为黑色。你可以调用 `Polygon` 类的 `setFill` 方法（继承自\
  \ `Shape` 类）来将其填充为另一种颜色。如果你希望多边形不填充，可以将 `null` 作为参数传递给 `setFill` 方法。然后，调用 `Polygon`\
  \ 类的 `setStroke` 方法（同样继承自 `Shape` 类）来改变多边形轮廓的颜色。\n\n代码列表 14-6 显示了一个示例程序，该程序使用 `Polygon`\
