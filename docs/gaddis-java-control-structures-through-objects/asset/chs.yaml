  \n`CompSciStudent` 类继承自 `Student` 类，在第 8 到 10 行声明了以下 `final` 整数字段：`MATH_HOURS`、`CS_HOURS`\
  \ 和 `GEN_ED_HOURS`。这些字段存储了计算机科学学生所需的数学、计算机科学和通用教育学时数。它在第 13 到 15 行声明了以下字段：`mathHours`、`csHours`\
  \ 和 `genEdHours`。这些字段存储了学生已修的数学、计算机科学和通用教育学时。提供了修改方法来向这些字段中存储值。此外，该类重写了 `toString`\
  \ 方法和抽象的 `getRemainingHours` 方法。\n\n### 抽象类\n\n记住关于抽象的以下几点：\n- 抽象方法和类使用 `abstract`\
  \ 进行定义。\n- 抽象类不能被实例化。相反，它由其他类来*实现*。\n- 当一个类继承抽象类时，它必须重写抽象方法。\n\n### 接口\n\n在最简单的形式下，接口就像一个包含抽象方法的类。接口不能被实例化。相反，它由其他类实现。\n\
  \n接口指定了某种行为的行为。在最简单的形式下，接口就像一个只包含方法的类。接口不能实例化。\n\n接口看起来像类，区别在于使用 `interface` 关键字代替\
  \ `class`，并且接口中的方法没有方法体，只有以分号结尾的方法头。以下是接口的通用格式：\n\n```java\npublic interface 接口名称\n\
  {\n   (方法头. .)\n}\n```\n\n代码列表 10-29 `(Displayable.java)` 展示了一个名为 `Displayable`\
  \ 的接口示例。在第 3 行，接口指定了一个名为 `display()` 的 `void` 方法。\n\n```java\npublic interface Displayable\n\
  {\n   void display();\n}\n```\n\n注意第 3 行的 `display` 方法头没有访问修符。这是因为接口中的所有方法隐式为 `public`。你可以选择在方法头部写\
  \ `public`，但大多数程序员会省略它，因为所有接口方法必须是 `public` 的。\n\n任何在 `Person` 类中实现 `Displayable`\
  \ 接口的类都是一个示例。\n\n```java\npublic class Person implements Displayable\n{\n   private\
  \ String name;\n\n   // 构造函数\n   public Person(String n)\n   {\n      name = n;\n\
  \   }\n\n   // display 方法\n   public void display()\n   {\n      System.out.println(\"\
  我的名字是 \" + name);\n   }\n}\n```\n\n# 代码列表 10-30 `(Person.java)`\n\n\n\n\n\n当你想让一个类实现一个接口时，在类头部中使用\
  \ `implements` 关键字。注意代码列表 10-30 中的第 1 行，`Person` 类的类头部以 `implements Displayable`\
  \ 子句结尾。由于 `Person` 类实现了 `Displayable` 接口，它必须为该接口的 `display` 方法提供实现。这在 `Person` 类的第\
  \ 12 到 15 行中完成的。代码列表 10-31 中的程序演示了 `Person` 类。\n\n```\n 1 /**\n  2    此程序演示了一个实现\n\
    3    Displayable 接口的类。\n  4 */\n  5\n  6 public class InterfaceDemo\n  7 {\n \
  \ 8    public static void main(String[] args)\n  9    {\n  10       // 创建 Person\
  \ 类的一个实例。\n  11       Person p = new Person(\"Antonio\");\n  12\n  13       // 调用对象的\
  \ display 方法。\n  14       p.display();\n  15    }\n  16 }\n```\n\n程序输出\n\n```\n\
  My name is Antonio\n```\n\n# 代码列表 10-31 `(InterfaceDemo.java)`\n\n# 接口是一种契约\n\n\
  当一个类实现一个接口时，它就同意提供接口中指定的所有方法。人们常说接口像一份“合同”，当一个类实现接口时，它必须遵守该合同。\n\n例如，代码列表 10-32\
  \ 显示了一个名为 `Relatable` 的接口，它旨在与之前介绍的 `GradedActivity` 类配合使用。该接口三个方法头部：`equals`、`isGreater`\
  \ 和 `isLess`。注意每个方法都接受一个 `GradedActivity` 对象作为参数。\n\n```\n 1  /**\n  2     Relatable\
  \ 接口\n  3  */\n  4\n  5  public interface Relatable\n  6  {\n  7     boolean equals(GradedActivity\
  \ g);\n  8     boolean isGreater(GradedActivity g);\n  9     boolean isLess(GradedActivity\
  \ g);\n  10  }\n```\n\n# 代码列表 10-32 `(Relatable.java)`\n\n你可能猜到了 `Relatable` 接口命名为“Relatable”是因为它指定了据测会对\
  \ `GradedActivity` 对象进行关系比较的方法。其意图是通过确保任何实现此接口的类都拥有执行关系比较的 `equals`、`isGreater`\
  \ 和 `isLess` 方法，使其与 `GradedActivity` 对象具有“可关联性”。但是，接口只指定了这些方法的头部，而没有规定方法应该做什么。虽然实现\
  \ `Relatable` 接口的类的程序员可以选择这些方法的作用，但他或她应该提供符合此意图的方法。\n\n代码列表 10-33 显示了 `FinalExam3`\
  \ 类的代码，该类实现了 `Relatable` 接口。`equals`、`isGreater` 和 `isLess` 方法比较调用对象与作为参数传递的对象。代码列表\
  \ 10-34 中的程序演示了该类。\n\n```\n 1 /**\n  2    此类确定期末考试的成绩。\n  3 */\n  4\n  5 public\
  \ class FinalExam3 extends GradedActivity implements Relatable\n  6 {\n  7    private\
  \ int numQuestions;  // 题目数量\n  8    private double pointsEach; // 每题分值\n  9   \
  \ private int numMissed;     // 错题数\n  10\n  11    /**\n  12       构造函数设置考试的题目数量\n\
    13       以及错题数量。\n  14       @param questions 题目数量。\n  15       @param missed\
  \ 错题数量。\n  16    */\n  17\n  18    public FinalExam3(int questions, int missed)\n\
    19    {\n  20       double numericScore; // 用于存储分数\n  21       // 设置 numQuestions\
  \ 和 numMissed 字段。\n  22       numQuestions = questions;\n  23       numMissed =\
  \ missed;\n  24\n  25       // 计算每题的分值\n  26       以及该考试的总分。\n  27       pointsEach\
  \ = 100.0 / questions;\n  28       numericScore = 100.0 - (missed * pointsEach);\n\
    29\n  30       // 调用继承的 setScore 方法\n  31       setScore(numericScore);\n  32\
  \    }\n  33\n  34    /**\n  35       getPoints 方法返回每题\n  36       所占的分值。\n  37\
  \       @return pointsEach 字段的值。\n  38    */\n  39\n  40    public double getPoints()\n\
    41    {\n  42       return pointsEach;\n  43    }\n  44\n  45    /**\n  46   \
  \    getNumMissed 方法返回错题\n  47       的数量。\n  48       @return numMissed 字段的值。\n\
    49    */\n  50\n  51    public int getMissed()\n  52    {\n  53       return numMissed;\n\
    54    }\n  55\n  56    /**\n  57       equals 方法将调用对象\n  58       与参数进行相等性比较。\n\
    59       @return 如果调用对象的数的与参数相等，则返回 true。\n  60    */\n  61\n  62    public boolean\
  \ equals(GradedActivity g)\n  63    {\n  64       boolean status; \n  65\n  66 \
  \      if (this.getScore() == g.getScore())\n  67          status = true;\n  68\
  \       else\n  69          status = false;\n  70\n  71       return status;\n \
  \ 72    }\n  73\n  74    /**\n  75       isGreater 方法判断调用对象\n  76       是否大于参数对象。\n\
    77       @return 如果调用对象的数的大于参数的分数，则返回 true。\n  78    */\n  79\n  80    public\
  \ boolean isGreater(GradedActivity g)\n  81    {\n  82       boolean status; \n\
    83\n  84       if (this.getScore() > g.getScore())\n  85          status = true;\n\
    86       else\n  87          status = false;\n  88\n  89       return status;\n\
    90    }\n  91\n  92\n  93    /**\n  94       isLess 方法判断调用对象\n  95       是否小于参数对象。\n\
    96       @return 如果调用对象的数的小于参数的分数，则返回 true。\n  97    */\n  98\n  99\n  100   \
  \ public boolean isLess(GradedActivity g)\n  101    {\n  102       boolean status;\
  \ \n  103\n  104       if (this.getScore() < g.getScore())\n  105          status\
  \ = true;\n  106       else\n  107          status = false;\n  108\n  109      \
  \ return status;\n  110    }\n  111 }\n```\n\n# 代码列表 10-33 `(FinalExam3.java)`\n\
  \n```\n 1 /**\n  2    此程序演示了 FinalExam3 类，它\n  3    实现了 Relatable 接口。\n  4 */\n\
    5\n  6 public class RelatableExams\n  7 {\n  8    public static void main(String[]\
  \ args)\n  9    {\n  10       // 创建 Person 类的一个实例。\n  11       100 道题目和学生错的。\n \
  \ 12       FinalExam3 exam1 = new FinalExam3(100, 20);\n  13\n  14       // 调用对象的\
  \ display 方法。\n  15       100 道题目和学生错的。\n  16       FinalExam3 exam2 = new FinalExam3(100,\
  \ 30);\n  17\n  18       // 显示考试分数。\n  19       System.out.println(\"Exam 1: \"\
  \ + exam1.getScore());\n  20       System.out.println(\"Exam 2: \" + exam2.getScore());\n\
    21\n  22       // 比较考试分数。\n  23       if (exam1.equals(exam2))\n  24         \
  \ System.out.println(\"考试分数相等。\");\n  25\n  26       if (exam1.isGreater(exam2))\n\
    27          System.out.println(\"Exam 1 分数最高。\");\n  28\n  29\n  30       if (exam1.isLess(exam2))\n\
