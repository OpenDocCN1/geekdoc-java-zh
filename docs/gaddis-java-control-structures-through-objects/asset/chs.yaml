  \n## 7. 文件加密\n文件加密是用密代码编写文件内容的科学。你的加密程序应该像过滤器一样工作：读取一个文件的内容，将数据修改为代码，然后将编码内容写入第二个文件。第二个文件将是第一个文件的版本，但是用密代码编写的。\n\
  \n尽管有复杂的加密技术，但你应该自己想出一个简单的方法。例如，你可以一次读取第一个文件的一个字符，在写入第二个文件之前将字符代码加上 10。\n\n## 8.\
