  \ `CalcButtonHandler` 类的定义。相反，在第 44 行到第 58 行，我们实例化了一个实现 `EventHandler` 的匿名内部类，并将该对象注册为\
  \ `calcButton` 控件的事件处理器。\n\n# 使用 Lambda 表达式创建事件处理器\n\n# Watch Lambda Expressions\n\
  \n[`mediaplayer.pearsoncmg.com/assets/_video.true/2_Mb23iQ1RRAGQKWsYWnyKMGFWVIuvVe`](https://mediaplayer.pearsoncmg.com/assets/_video.true/2_Mb23iQ1RRAGQKWsYWnyKMGFWVIuvVe)\n\
  \n回想我们在第 10 章中关于函数式接口和 Lambda 表达式的讨论。函数式接口有一个且只有一个抽象方法。`EventHandler` 接口只有一个抽象方法（`handle`\
  \ 方法），因此它是一个函数式接口。每当你编写 Java 代码来实例化函数式接口的匿名类时，都应该考虑使用 Lambda 表达式来代替。Lambda 表达式比实例化匿名类的代码更简洁。\n\
  \n\n\n\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.layout.HBox;\nimport javafx.scene.layout.VBox;\n\
  import javafx.geometry.Pos;\nimport javafx.geometry.Insets;\nimport javafx.scene.control.Label;\n\
  import javafx.scene.control.TextField;\nimport javafx.scene.control.Button;\nimport\
  \ javafx.event.EventHandler;\nimport javafx.event.ActionEvent;\n\n/**\n  Lambda\
  \ 版本的公里转换器应用程序\n */\n\npublic class LambdaKiloConverter extends Application\n{\n\
  \    // Fields\n    private TextField kiloTextField;\n    private Label resultLabel;\n\
  \n    public static void main(String[] args)\n    {\n       // 启动应用程序。\n       launch(args);\n\
  \    }\n\n    @Override\n    public void start(Stage primaryStage)\n    {\n    \
  \   // 创建一个 Label 显示提示。\n       Label promptLabel = new Label(\"Enter a distance\
  \ in kilometers:\");\n\n       // 创建一个 TextField 用于输入。\n       kiloTextField = new\
  \ TextField();\n\n       // 创建一个 Button 执行转换。\n               calcButton = new Button(\"\
  Convert\");\n\n       // 创建一个事件处理器。\n       calcButton.setOnAction(event ->\n  \
  \     {\n          // 获取公里数。\n          double kilometers = Double.parseDouble(kiloTextField.getText());\n\
  \n          // 将公里转换为英里。\n          double miles = kilometers * 0.6214;\n\n    \
  \      // 显示结果。\n          resultLabel.setText(String.format(\"%,.2f miles\", miles));\n\
  \       });\n\n       // 创建一个空的 Label 显示结果。\n       resultLabel = new Label();\n\
  \n       // 将 promptLabel 和 kiloTextField 放入一个 HBox 中。\n       HBox hbox = new HBox(10,\
  \ promptLabel, kiloTextField);\n\n       // 将 HBox, calcButton 和 resultLabel 放入一个\
  \ VBox。\n       VBox vbox = new VBox(10, hbox, calcButton, resultLabel);\n\n   \
  \    // 设置 VBox 的对齐方式为居中。\n       vbox.setAlignment(Pos.CENTER);\n\n       // 设置\
  \ VBox 的内边距为 10 像素。\n       vbox.setPadding(new Insets(10));\n\n       // 创建一个 Scene。\n\
  \       Scene scene = new Scene(vbox);\n\n       // 将 Scene 添加到 Stage。\n       primaryStage.setScene(scene);\n\
  \n       // 设置阶段标题。\n       primaryStage.setTitle(\"Kilometer Converter\");\n\n\
  \       // 显示窗口。\n       primaryStage.show();\n    }\n}\n```\n\n# 代码列表 12-14 `(LambdaKiloConverter.java)`\n\
  \n虽然 lambda 表达式简化了匿名内部类的使用，但它们也有局限性。回想第 10 节，lambda 表达式只能访问本质上最终的（effectively final）的变量。此外，如果\
  \ lambda 表达式包含大量代码，它们可能会变得难以阅读。\n\n创建事件处理程序有许多不同的技术。在本章中，你学习了三种技术：\n\n*   编写实现 `EventHandler`\
  \ 接口的内部类定义。然后实例化该类并将其注册到控件上。你在[代码列表 12-11]中见过这种技术。\n*   使用匿名内部类来实现 `EventHandler`\
  \ 接口。你在[代码列表 12-12]中见过这种技术。\n*   使用 lambda 表达式来实现 `EventHandler` 接口。你在[代码列表 12-13]中见过这种技术。\n\
  \n## 12.9 `BorderPane` 布局\n\nJavaFX 提供了一种名为 `BorderPane` 的布局容器，可以轻松地实现这种组织风格。`BorderPane`\
  \ 布局容器分为五个区域：顶部、底部、左侧、右侧和中心。例如，GUI 中心显示主要内容，而状态栏出现在顶部，元素出现在左侧和右侧。\n\n## 12.10 `BorderPane`\
  \ 容器\n\n`BorderPane` 容器分为五个区域：`top`、`bottom`、`left`、`right` 和 `center`。当一个节点被放入\
  \ `BorderPane` 容器时，它必须放入这些区域之一。\n\n每次只能向 `BorderPane` 区域放入一个对象。由于由于原因，你通常不会直接将控件放入\
  \ `BorderPane` 区域。通常，你会先将控件放入另一种类型的布局容器（例如 `HBox` 或 `VBox`），然后将该容器放入 `BorderPane`\
  \ 的任一区域。\n\n### 注意\n\n你不必使用 `BorderPane` 的所有区域。如果 `BorderPane` 区域不包含任何内容，该区域简单地就不会出现在\
  \ GUI 中。\n\n要创建一个 `BorderPane`，你需要从 `javafx.scene.layout` 包中导入 `BorderPane` 类。然后，使用三个构造函数之一创建\
  \ `BorderPane` 类的实例。\n\n### 表 12-3 `BorderPane` 构造函数\n\n| 构造函数 | 说明 |\n| --- | ---\
  \ |\n| `BorderPane()` | 无参数构造函数创建一个空的 `BorderPane` 容器。 |\n| `BorderPane(``center``)`\
  \ | 此构造函数接受一个参数。作为参数传递的节点被放在 `BorderPane` 的中心区域。 |\n| `BorderPane(``center`*`,`\
  \ `top`*`,` `right`*`,` `bottom`*`,` `left`*`)` | 此构造函数接受五个节点作为参数：分别放在每个区域中。 |\n\
  \n\n\n\n\n如果你使用第一个构造函数（无参构造函数），你将需要使用以下 `BorderPane` 方法将节点放入容器的区域中：`setCenter`、`setTop`、`setBottom`、`setLeft`\
  \ 和 `setRight`。代码列表 12-15 演示了这些方法。程序的输出如图 12-37 所示。\n\n```\nimport javafx.application.Application;\n\
  import javafx.stage.Stage;\nimport javafx.scene.Scene;\nimport javafx.scene.control.Button;\n\
  import javafx.scene.layout.HBox;\nimport javafx.scene.layout.VBox;\nimport javafx.scene.layout.BorderPane;\n\
  import javafx.geometry.Pos;\n\n/**\n  A BorderPane Demo\n */\npublic class BorderPaneDemo\
  \ extends Application\n{\n    public static void main(String[] args)\n    {\n  \
  \      // 启动应用程序。\n        launch(args);\n    }\n\n    @Override\n    public void\
  \ start(Stage primaryStage)\n    {\n        // 创建一些按钮。\n        Button centerButton\
  \ = new Button(\"This is Center\");\n        Button topButton = new Button(\"This\
  \ is Top\");\n        Button bottomButton = new Button(\"This is Bottom\");\n  \
  \      Button leftButton = new Button(\"This is Left\");\n        Button rightButton\
  \ = new Button(\"This is Right\");\n\n        // 将每个按钮添加到它们自己的布局容器中。\n        HBox\
  \ centerHBox = new HBox(centerButton);\n        HBox topHBox = new HBox(topButton);\n\
  \        HBox bottomHBox = new HBox(bottomButton);\n        VBox leftVBox = new\
  \ VBox(leftButton);\n        VBox rightVBox = new VBox(rightButton);\n\n       \
  \ // 设置顶部和底部的对齐方式。\n        topHBox.setAlignment(Pos.CENTER);\n        bottomHBox.setAlignment(Pos.CENTER);\n\
  \n        // 创建一个 BorderPane。\n        BorderPane borderPane = new BorderPane();\n\
  \n        // 将按钮添加到 BorderPane 的区域中。\n        borderPane.setCenter(centerHBox);\n\
  \        borderPane.setTop(topHBox);\n        borderPane.setBottom(bottomHBox);\n\
  \        borderPane.setLeft(leftVBox);\n        borderPane.setRight(rightVBox);\n\
  \n        // 创建以 BorderPane 为根节点的 Scene。\n        Scene scene = new Scene(borderPane);\n\
  \n        // 将 Scene 添加到 Stage。\n        primaryStage.setScene(scene);\n\n     \
  \   // 显示窗口。\n        primaryStage.show();\n    }\n}\n```\n\n# 代码列表 12-15 `BorderPaneDemo1.java`\n\
