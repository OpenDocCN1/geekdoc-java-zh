  \ --.- |\n| 逗号 | --..-- | 7 | -- . . . | H | . . . . | R | .-. |\n| 句号 | .-.-.-\
  \ | 8 | ---.. | I | .. | S | . . . |\n| 问号 | ..--.. | 9 | ----. | J | .--- | T |\
  \ - |\n| 0 | ----- | A | .- | K | -.- | U | ..- |\n| 1 | .---- | B | - . . . | L\
  \ | .-.. | V | . . . - |\n| 2 | ..--- | C | -.-. | M | -- | W | .-- |\n| 3 | . .\
  \ . -- | D | -.. | N | -. | X | -..- |\n| 4 | . . . :- | E | . | O | --- | Y | -.--\
  \ |\n| 5 | . . . .. | F | ..-. | P | .--. | Z | --.. |\n\n# 17. 彩票统计\n\n要玩 PowerBall\
  \ 彩票，你需要购买一张彩票，其中包含 1–69 范围内的五个数字，以及一个 1–35 范围内的“PowerBall”号码。（你可以自己挑选数字，也可以让选票机随机为你挑选。）然后，在指定的日期，机器会随机抽取一组中奖号码。如果你的前五个数字以任何顺序与前五个中奖号码匹配，且你的\
  \ PowerBall 号码匹配中奖 PowerBall 号码，你就获得了大奖，这是一笔巨款。如果你的号码只匹配了部分中奖号码，你将获得较少的奖，取决于你中了多少个中奖号码。\n\
  \n在本书的学生示例程序中，你会找到一个名为 `pbnumbers.txt` 的文件，其中包含了在 2010 年 2 月 3 日至 2016 年 5 月 11\
  \ 日之间选出的 PowerBall 中奖号码（该文件包含 654 组奖号码）。以下是文件内容前几行的示例：\n\n```\n 17 22 36 37 52 24\n\
  \ 14 22 52 54 59 04\n 05 08 29 37 38 34\n 10 14 30 40 51 01\n 07 08 19 26 36 15\n\
  \ 等等 . . .\n```\n\n文件中的每一行都包含特定日期选出的六个数字。数字之间用空格分隔，每行的最后一个数字是当天的 PowerBall 号码。例如，文件的第一行显示了\
  \ 2010 年 2 月 3 日的数字，即 17, 22, 36, 37, 52 和 PowerBall 号码 24。\n\n编写一个或多个程序处理此文件以执行以下操作：\n\
  \n*   按出现频率显示前 10 个常见数字\n*   按出现频率显示后 10 个最不常见数字\n*   显示 10 个最欠期的数字（长时间未被抽中的数字），从最欠期到最不欠期排序\n\
  *   显示 1–69 每个数字的频率，以及 1–26 每个 Powerball 号码的频率\n\n# 18. 油价\n\n在本章的学生示例程序中，你会找到一个名为\
  \ `GasPrices.txt` 的文件。该文件包含了从 1993 年 4 月 5 日到 2013 年 8 月 26 日美国加仑油的周平均价格。以下是文件内容前几行的示例：\n\
  \n```\n04-05-1993:1.06\n04-12-1993:1.079\n04-19-1993:1.079\n04-26-1993:1.086\n等等\
  \ . .\n```\n\n文件中的每一行都是特定日期的每加仑平均价格。每行的格式如下：`MM-DD-YYYY:Price`。`MM` 是两位月份，`DD` 是两位日期，`YYYY`\
  \ 是四位年份。`Price` 是该日期每加仑的价格。你需要编写一个或多个程序读取文件并执行以下计算：\n\n*   计算文件中每年的平均油价（文件从 1993\
  \ 年 4 月开始到 2013 年 8 月结束。对于 1993 年和 2013 年，仅使用这些年份的数据）。\n*   计算文件中每个月的平均价格\n*   计算文件中每年的最低和最高价格\n\
  *   生成一个按最低价到最高价排序的日期和价格文件\n*   生成一个按最高价到最低价排序的日期和价格文件。你可以编写一个程序完成所有这些计算，也可以为每个任务编写不同的程序。\n\
  \n# 第 10 章继承\n\n## 话题\n\n1. 10.1 什么是继承？\n2. 10.2 调用父类构造函数\n3. 10.3 重写父类方法\n4. 10.4\
  \ 保护级成员\n5. 10.5 继承链\n6. 10.6 `Object` 类\n7. 10.7 多态性\n8. 10.8 抽象类和抽象方法\n9. 10.9\
  \ 接口\n10. 10.10 匿名内部类\n11. 10.11 函数式接口和 Lambda 表达式\n12. 10.12 应避免的常见错误\n\n# 10.1\
  \ 什么是继承？\n\n概念：继承允许一个新类扩展一个现有类。新类继承其所扩展的类的成员。\n\n# 一般化与特化\n\n# 观看继承\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/0sI0neM8TZtGb7T8V0YRa9_uhHyiDZ`](https://mediaplayer.pearsoncmg.com/assets/_video.true/0sI0neM8TZtGb7T8V0YRa9_uhHyiDZ)\n\
  \n在现实世界中，你可以找到许多其他更通用对象的特化版本。例如，“昆虫”一词描述了一类具有众多特征的非常一般的生物。因为蚂蝗和蜜蜂都是昆虫，所以它们拥有昆虫的所有通用特征。此外，它们还有自己的特殊特征。例如，蚂蝗具有跳跃能力，而蜜蜂有刺针。蚂蝗和蜜蜂是昆虫的特化版本。这在图\
  \ 10-1 中所示。\n\n# 图 10-1 蜜蜂和蚂蝗是昆虫的特化版本\n\n![蜜蜂和蚂蝗是昆虫的特化版本。所有昆虫都有某些特征。](img/10fig01.png)图\
  \ 10-1 完整替代文本\n\n\n\n\n\n# 继承与“是”（Is a）关系\n\n当一个对象是另一个对象的特化版本时，它们之间就存在一种“是”（is a）的关系。例如，蚂虫是一种昆虫。这里是“是”关系的其他几个例子：\n\
  \n*   贵宾犬是一种狗。\n*   汽车是一种交通工具。\n*   花朵是一种植物。\n*   矩形是一个形状。\n*   足球运动员是一个运动员。\n\n\
  当对象之间存在“是”关系时，意味着该特化对象具有通用对象的所有特征，外加上使其变得特殊的额外特征。在面向对象的编程中，继承被用于在类之间建立“是”关系。这允许你通过创建另一个该类的特化版本，来扩展该类的功能。\n\
  \n继承涉及父类（superclass）和子类（subclass）。`superclass` 是通用类，而 `subclass` 是特化类。你可以将子类类为父类的扩展版本。子类从父类继承字段和方法，而无需重写其中任何一个内容。此外，可以在子类中添加新的字段和方法，这使得它成为父类的特化版本。\n\
  \n## Note\n\n冒着担心过多术语会让你困惑的风险，但应该提到，父类也被称为基类（base classes），而子类也被称为派生类（derived classes）。这两组术语都是正确的。为了保持一致性，本文将使用\
  \ `superclass` 和 `subclass` 术语。\n\n让我们来看一个使用继承的例子。大多数老师会给学生分配各种评分评分活动。评分活动可以给出一个数值分数，如\
  \ 70、85、90 等，并给出一个字母等级，如 A、B、C、D 或 F。图 10-2 显示了 `GradedActivity` 类的 UML 图，该类用于存储评分活动的数值分数。`setScore`\
  \ 方法设置数值分数，`getScore` 方法返回数值分数。`getGrade` 方法返回与数值分数对应的字母等级。注意，该类没有程序员定义的构造函数，因此\
  \ Java 将自动为它生成一个默认构造函数。这将在以后成为讨论的点。代码列表 10-1 显示了该类的代码。\n\n## 图 10-2 `GradedActivity`\
  \ 类的 UML 图\n\n![Rectangle 类的 UML 图由三个矩形部分组成。](img/10fig02.png)图 10-2 完整替代文本\n\n\
  ```\n 1  /**\n  2     一个持有评分活动分数的类。\n  3  */\n  4\n  5  public class GradedActivity\n\
    6  {\n  7     private double score;  // 数值分数\n  8\n  9     /**\n  10        The\
  \ setScore 方法设置 score 字段。\n  11        @param s 要存储在 score 中的值。\n  12     */\n \
  \ 13\n  14     public void setScore(double s)\n  15     {\n  16        score = s;\n\
    17     }\n  18\n  19     /**\n  20        The getScore 方法返回分数。\n  21        @return\
  \ 字段中存储的值。\n  22     */\n  23\n  24     public double getScore()\n  25     {\n \
  \ 26        return score;\n  27     }\n  28\n  29     /**\n  30        The getGrade\
  \ 方法返回根据 score 字段\n  31        确定的字母等级。\n  32        @return 字母等级。\n  33     */\n\
    34\n  35     public char getGrade()\n  36     {\n  37        char letterGrade;\n\
    38\n  39        if (score >= 90)\n  40           letterGrade = 'A';\n  41    \
  \    else if (score >= 80)\n  42           letterGrade = 'B';\n  43        else\
  \ if (score >= 70)\n  44           letterGrade = 'C';\n  45        else if (score\
  \ >= 60)\n  46           letterGrade = 'D';\n  47        else\n  48           letterGrade\
  \ = 'F';\n  49\n  50        return letterGrade;\n  51     }\n  22 }\n```\n\n## 代码列表\
  \ 10-1 `GradedActivity.java`\n\n代码列表 10-2 中的程序演示了该类。图 10-3 和 10-4 显示了与程序交互的示例。\n\
  \n![与 Grade Demo java 程序的交互从一个输入对话框开始，输入一个数值测试分数。用户输入数字 89 并点击 OK。生成了一个包含消息“该测试的成绩为\
  \ B”的消息。](img/10fig03.png)\n\n## 图 10-3 与 `GradeDemo.java` 程序的交互（Oracle Counsel）\n\
  \n![与程序的交互从一个输入对话框开始，输入一个数值测试分数。用户输入数字 75 并点击 OK。生成了一个包含消息“该测试的成绩为 C”的消息。](img/10fig04.png)\n\
  \n## 图 10-4 与 `GradeDemo.java` 程序的交互\n\n在下面的动画中，按“Previous”或“Next”按钮逐步执行代码并查看说明。\n\
  \n## 代码列表 10-2 `GradeDemo.java`\n\n`GradedActivity` 类代表学生评分活动的通用特征。然而，存在许多不同的评分活动，例如测验、期考试、期末考试、实验报告、论文等。由于这些评分活动的数值分数确定方式可能不同，我们可以为每种活动创建子类。例如，我们可以创建一个\
  \ `GradedActivity` 类的子类 `FinalExam` 类。图 10-5 显示了此类类的 UML 图，而 代码列表 10-3 显示了其代码。它包含考试题目数量\
  \ (`numQuestions`)、每道题的分值 (`pointsEach`) 以及学生错过的题目数量 (`numMissed`) 的字段。\n\n\n\n\n\
  \n```java\n /**\n  此类确定期末考试的成绩。\n */\n\npublic class FinalExam extends GradedActivity\n\
  {\n   private int numQuestions;      // 题目数量\n   private double pointsEach;    \
  \ // 每道题的分数\n   private int numMissed;         // 错的题目数量\n\n   /**\n      构造函数设置了考试的题目数量\n\
  \      以及错的题目数量。\n      @param questions 题目数量。\n      @param missed 错的题目数量。\n  \
  \  */\n\n   public FinalExam(int questions, int missed)\n   {\n      double numericScore;\
  \        // 保存数值分数\n\n      // 设置 numQuestions 和 numMissed 字段。\n      numQuestions\
  \ = questions;\n      numMissed = missed;\n\n      // 计算每道题的分数和\n      // 本考试的数值分数。\n\
  \      pointsEach = 100.0 / questions;\n      numericScore = 100.0 − (missed * pointsEach);\n\
  \n      // 调用继承的 setScore 方法来\n      // 设置数值分数。\n      setScore(numericScore);\n\
  \   }\n\n   /**\n      getPointsEach 方法返回每道题\n      所占的分数。\n      @return pointsEach\
  \ 字段的值。\n    */\n\n   public double getPointsEach()\n   {\n      return pointsEach;\n\
  \   }\n\n   /**\n      getNumMissed 方法返回错的\n      题目数量。\n      @return numMissed\
  \ 字段的值。\n    */\n\n   public int getNumMissed()\n   {\n      return numMissed;\n\
  \   }\n }\n```\n\n# 代码列表 10-3 `(FinalExam.java)`\n\n查看第 5 行 `FinalExam` 类的头部定义。该头部使用了\
  \ `extends` 关键字，这表示该类继承了另一个类（父类）。父类的名称列在 `extends` 之后。因此，这一行表示 `FinalExam` 是正在声明的类名，而\
  \ `GradedActivity` 是它继承的父类名。这在图 10-6 中所示。\n\n![Final Exam 类的头部内容如下：Public class\
  \ Final Exam extends Graded Activity。Final Exam 部分是正在声明的子类。Graded Activity 部分是父类。](img/10fig06.png)\n\
  \n# 图 10-6 `FinalExam` 类头部\n\n如果我们想表达这两个类之间的关系，可以说一个 `FinalExam` 是一个 `GradedActivity`。\n\
  \n由于 `FinalExam` 类继承了 `GradedActivity` 类，它继承了 `GradedActivity` 类的所有公共成员。以下是 `FinalExam`\
  \ 类的成员列表。\n\n## 字段\n\n| `int numQuestions;` | 在 `FinalExam` 中声明 |\n| `double pointsEach;`\
  \ | 在 `FinalExam` 中声明 |\n| `int numMissed;` | 在 `FinalExam` 中声明 |\n\n## 方法\n\n|\
  \ 构造函数 | 在 `FinalExam` 中声明 |\n| `getPointsEach` | 在 `FinalExam` 中声明 |\n| `getNumMissed`\
  \ | 在 `FinalExam` 中声明 |\n| `setScore` | 继承自 `GradedActivity` |\n| `getScore` | 继承自\
  \ `GradedActivity` |\n| `getGrade` | 继承自 `GradedActivity` |\n\n注意，`GradedActivity`\
  \ 类的 `score` 字段没有列在 `FinalExam` 类的列表中。这是因为 `score` 字段是私有的。父类的私有成员无法被子类访问，因此从技术上说它们并没有被继承。当创建子类对象时，父类的私有成员存在内存中，但只有父类的方法可以访问它们。它们对于父类来说是真正的私有。\n\
  \n你还会发现父类的构造函数没有列在 `FinalExam` 类的列表中。父类的构造函数不被继承是有。为了了解继承是如何工作的，让我们仔细观察 `FinalExam`\
  \ 构造函数。在第 18 行，构造函数接受两个参数：`questions` 和 `missed`。在第 23 行和 24 行，赋值了 `numQuestions`\
  \ 和 `numMissed` 字段。在第 28 行和 29 行，计算了 `pointsEach` 和 `numericScore`。在第 33 行，代码调用了继承的\
  \ `setScore` 方法：\n\n```\nsetScore(numericScore)\n```\n\n`setScore` 方法在 `GradedActivity`\
  \ 类中是公共的。在下面的示例中，第 27 行创建了一个 `FinalExam` 实例并将地址赋值给变量 `exam`：\n\n```java\nFinalExam\
  \ exam = new FinalExam(questions, missed);\n```\n\n当在内存中创建一个 `FinalExam` 对象时，它不仅拥有\
  \ `FinalExam` 类中声明的成员，还拥有 `GradedActivity` 类的非私有成员。注意此处第 30 到 34 行，`GradedActivity`\
  \ 类的两个公共方法 `getScore` 和 `getGrade` 直接从 `exam` 对象被调用：\n\n```java\nJOptionPane.showMessageDialog(null,\n\
  \   \"每道题计 \" + exam.getPointsEach() +\n   \" 分。\\n 考试分为 \" +\n   exam.getScore()\
  \ + \"\\n 成绩为 \" +\n   exam.getGrade());\n```\n\n当子类继承父类时，父类的公共成员将成为子类的公共成员。\n\n\
  ## UML 图中的继承\n\n在 UML 图中，你通过一根带有空箭头的线连接两个类来显示继承。箭头指向父类。图 10-8 是显示 `GradedActivity`\
  \ 类和 `FinalExam` 类之间关系的 UML 图。\n\n![一个 UML 图显示了 Graded Activity 类和 Final Exam 类的继承，后者分为三个矩形区域。](img/10fig08.png)\n\
  \n# 图 10-8 显示继承关系的 UML 图\n\n\n\n\n\n你可能在好奇当一个类继承另一个类时，构造函数是如何协同工作的。在继承关系中，父类的构造函数始终在子类的构造函数之前执行。正如早之前提到的，`GradedActivity`\
  \ 类只有一个构造函数，即 Java 自动为其生成的默认构造函数。当创建一个 `FinalExam` 对象时，`GradedActivity` 类的默认构造函数会在\
  \ `FinalExam` 构造函数执行之前执行。\n\n代码列表 10-5 显示了一个名为 `SuperClass1` 的类，它有一个无参构造函数。该构造函数仅显示消息“This\
  \ is the superclass constructor.”。代码列表 10-6 显示了继承 `SuperClass1` 的 `SubClass1`。该类也有一个无参构造函数，显示消息“This\
  \ is the subclass constructor.”。\n\n```\n 1  public class SuperClass1\n  2  {\n\
    3     /**\n  4        Constructor\n  5     */\n  6\n  7     public SuperClass1()\n\
    8     {\n  9        System.out.println(\"This is the \" +\n 10               \
  \   \"superclass constructor.\");\n 11     }\n  12  }\n```\n\n# 代码列表 10-5 `(SuperClass1.java)`\n\
  \n```\n 1  public class SubClass1 extends SuperClass1\n  2  {\n  3     /**\n  4\
  \        Constructor\n  5     */\n  6\n  7     public SubClass1()\n  8     {\n \
  \ 9        System.out.println(\"This is the \" +\n 10                  \"subclass\
  \ constructor.\");\n 11     }\n  12  }\n```\n\n# 代码列表 10-6 `(SubClass1.java)`\n\n\
  代码列表 10-7 中的程序创建了一个 `SubClass1` 对象。如你从程序输出所示，父类构造函数首先执行，然后是子类构造函数。\n\n```\n 1  /**\n\
