  \ 对象不再被引用\n\n## finalize 方法\n\n如果类有一个名为 `finalize` 的方法，该方法会在类的实例被垃圾回收器销毁之前自动调用。如果你想在对象销毁之前执行代码，可以在类中创建一个\
  \ `finalize` 方法并将代码放在其中。`finalize` 方法不接受参数且返回类型为 `void`。\n\n### 注意\n\n垃圾回收器定期运行，你无法准确预测它执行的确切时间。因此，你无法确切知道对象的\
  \ `finalize` 方法何时执行。\n\n## 检查点 8.39\n\n\n\n\n\n../components/metrodigi/ch08-inline_self_quiz_v1.0.0-30/index.html\n\
  \n# 检查点 8.40\n\n../components/metrodigi/ch08-inline_self_quiz_v1.0.0-31/index.html\n\
  \n# 8.11 关注面向对象的设计：类协作\n\n**概念**：类之间相互交互或协作以执行其操作是种常见现象。面向对象设计过程的一部分是识别类与类之间的协作关系。\n\
  \n在在面向对象的应用程序中，不同类的对象进行协作是很常见的。这简单意味着对象之间会相互作用。有时，一个对象需要另一个对象的服务来完成它的职责。例如，假设一个对象需要从键盘读取值，然后将这些值写入文件。该对象将使用\
  \ `Scanner` 对象的服务从键盘读取值，然后使用 `PrintWriter` 对象的服务将值写入文件。在这个示例中，该对象正在与由 Java API 中的类创建的对象进行协作。你从自己的类创建的对象也可以相互协作。\n\
  \n如果一个对象要与另一个对象协作，那么它必须了解另一个对象类的类方法以及如何调用这些方法。例如，假设我们编写一个名为 `StockPurchase` 的类，它使用一个\
  \ `Stock` 类对象（在本章前面介绍过）来模拟购买股票。`StockPurchase` 类负责计算购买股票的成本。为了做到这一点，它必须知道如何调用 `Stock`\
  \ 类的 `getSharePrice` 方法来获取股票的每股价格。代码列表 8-24 展示了 `StockPurchase` 类的示例。（该文件位于源代码文件夹\
  \ `Chapter 08\\StockPurchase Class.` 中。）\n\n```\n 1 /**\n  2    The StockPurchase\
  \ class represents a stock purchase.\n  3 */\n  4\n  5 public class StockPurchase\n\
    6 {\n  7    private Stock stock; // The stock that was purchased\n  8    private\
  \ int shares; // Number of shares owned\n  9\n  10    /**\n  11       Constructor\n\
    12       @param stockObject The stock to purchase.\n  13       @param numShares\
  \ The number of shares.\n  14    */\n  15\n  16    public StockPurchase(Stock stockObject,\
  \ int numShares)\n  17    {\n  18       // Create a copy of the object referenced\
  \ by\n  19       // stockObject.\n  20       stock = new Stock(stockObject);\n \
  \ 21       shares = numShares;\n  22    }\n  23\n  24    /**\n  25       getStock\
  \ method\n  26       @return A copy of the Stock object for the stock\n  27    \
  \           being purchased.\n  28    */\n  29\n  30    public Stock getStock()\n\
    31    {\n  32       // Return a copy of the object referenced by stock.\n  33\
  \       return new Stock(stock);\n  34    }\n  35\n  36    /**\n  37       getShares\
  \ method\n  38       @return The number of shares being purchased.\n  39    */\n\
    40\n  41    public int getShares()\n  42    {\n  43       return shares;\n  44\
  \    }\n  45\n  46    /**\n  47       getCost method\n  48       @return The cost\
  \ of the stock purchase.\n  49    */\n  50\n  51    public double getCost()\n  52\
  \    {\n  53       return shares * stock.getSharePrice();\n  54    }\n  55 }\n```\n\
  \n# 代码列表 8-24 `(StockPurchase.java)`\n\n该类的构造函数接受一个代表正在购买的股票的 `Stock` 对象以及一个表示购买股份数量的\
  \ `int`。在第 20 行，我们看到了第一次协作：`StockPurchase` 构造函数通过使用 `Stock` 类的拷贝构造创建了 `Stock` 对象的副本。拷贝构造在第\
  \ 33 行的 `getStock` 方法中再次被使用，用于返回 `Stock` 对象的副本。\n\n下次协作发生在 `getCost` 方法中。该方法计算并返回购买股票的成本。在第\
  \ 53 行，它调用了 `Stock` 类的 `getSharePrice` 方法来确定每股价格。\n\n\n\n\n\n*   **在静态方法尝试引用实例字段或实例方法**。静态方法只能引用其他静态的类成员。\n\
  \n*   **在接受对象作为参数的方法中，编写无意中修改对象的代码**。当将引用变量作为参数传递给方法时，该方法可以访问该变量所引的对象。在编写接收引用变量作为参数的方法时，你必须小心不要无意中修改变量所引用的对象的内容。\n\
  \n*   **允许使用 `null` 引用**。由于 `null` 引用变量不引用任何对象，因此不能使用它来执行需要对象存在的操作。例如，不能使用 `null`\
  \ 引用变量来调用方法。如果你尝试对 `null` 引用变量执行操作，程序将终止。当一个类有一个引用变量作为字段，且该字段没有被正确初始化为对象的地址时，就会发生这种情况。\n\
  \n*   **忘记使用 `enum` 常量的完全限定名**。在大多数情况下，你必须使用 `enum` 常量的完全限定名。唯一的例外是当 `enum` 常被用作\
  \ `switch` 语句中的分支表达式时。\n\n## 编程挑战\n\n## 1. `Area` 类\n\n编写一个类，包含三个重载的静态方法，用于计算以下几何形状的面积：\n\
