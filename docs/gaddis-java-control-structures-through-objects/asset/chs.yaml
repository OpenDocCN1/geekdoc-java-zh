  \n## 5.4 从方法返回值\n\n### 概念\n\n方法可以将一个值发送回调用该方法的语句。\n\n你已经看到数据可以通过参数变量传递到方法。数据也可以从方法返回，回到调用它的语句。返回值的的方法被称为“有返回值的方法”（value-returning\
  \ methods）。\n\n## 观看视频：从方法返回值\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/hQdXuGPKF89cJw6C0PfY_a_UJdAHi2gz`](https://mediaplayer.pearsoncmg.com/assets/_video.true/hQdXuGPKF89cJw6C0PfY_a_UJdAHi2gz)\n\
  \n你已经很熟练使用有返回值的方法。例如，你使用过包装类的解析方法，如 `Integer.parseInt`。这里有一个示例：\n\n```\nint num;\n\
  num = Integer.parseInt(\"700\");\n```\n\n这段代码的第二行调用了 `Integer.parseInt` 方法，并将 `\"\
  700\"` 作为参数。该方法返回整数值 700，由 `=` 运算符将其赋值给变量 `num`。你还见过返回返回值的 `Math.pow` 方法。这里有一个示例：\n\
  \n```\ndouble x;\nx = Math.pow(4.0, 2.0);\n```\n\n这段代码的第二行调用了 `Math.pow` 方法，将 4.0\
  \ 和 2.0 作为参数。该方法计算 4.0 幂 2.0 次的值并返回该值。该值为 16.0，由 `=` 运算符将其赋值给变量 `x`。\n\n在本节中，我们将讨论如何编写你自己的有返回值的方法。\n\
  \n## 定义有返回值的方法\n\n当你编写有返回值的方法时，你必须决定该方法将返回什么类型的值。这是因为你必须在方法头部中指定返回值的数据类型。记住，`void`\
  \ 方法不返回值。有返回值的方法将使用 `int`、`double`、`boolean` 或任何其他数据类型。\n\n```\npublic static int\
  \ sum(int num1, int num2)\n{\n   int result;\n   result = num1 + num2;\n   return\
  \ result;\n}\n```\n\n`return` 语句表达式必须与方法头部指定的返回类型相同，或者与之兼容。否则，将发生编译错误。\n\n### 注意\n\
  \n`return` 语句在必要时可以宽转换（widen），但不会进行窄转换（narrow）。\n\n## 调用有返回值的方法\n\n代码列表 5-9 中的程序演示了有返回值的方法。\n\
  \n```\n/**\n * 此程序演示了有返回值的方法。\n */\npublic class ValueReturn\n{\n   public static\
  \ void main(String[] args)\n   {\n      int total, value1 = 20, value2 = 40;\n\n\
  \      // 调用 sum 方法，将 value1 和 value2 的内容\n      // 作为参数。将返回值赋值给 total 变量。\n   \
  \   total = sum(value1, value2);\n\n      // 显示所有变量的内容。\n      System.out.println(\"\
  The sum of \" + value1 +\n                          \" and \" + value2 + \" is \"\
  \ + total);\n   }\n\n   /**\n    * sum 方法返回参数的和。\n    * @param num1 第一个相加的数字。\n\
  \    * @param num2 第二个相加的数字。\n    * @return num1 和 num2 的和。\n    */\n   public static\
  \ int sum(int num1, int num2)\n   {\n      int result; // result 是局部变量\n\n     \
  \ // 将 num1 + num2 的值赋值给 result。\n      result = num1 + num2;\n\n      // 返回 result\
  \ 变量的值。\n      return result;\n   }\n}\n```\n\n### 代码列表 5-9 (ValueReturn.java)\n\
  \n程序输出\n\n```\nThe sum of 20 and 40 is 60\n```\n\n\n\n\n第 14 行的语句调用了 `sum` 方法，并将\
  \ `value1` 和 `value2` 作为参数传递。它将 `sum` 方法的返回值赋值给变量 `total`。在这种情况下，该方法将返回 60。图 5-15\
  \ 显示了参数是如何传递给方法的，以及值是如何从方法返回的。\n\n# 图 5-15 传递给 `sum` 的参数和返回的值\n\n![分别为 20 和 40 的两个参数返回总量\
  \ 60。](img/05fig15.png)图 5-15 完整替代文本\n\n当你调用一个返回值的方法，你通常希望对它返回的值进行有意义的操作。`ValueReturn.java`\
  \ 程序展示了将方法的返回值赋值给变量。这是使用值的常用方法，但你也可以对它们进行许多其他操作。例如，下面的代码显示了一个使用 `sum` 方法调用的数学表达式：\n\
  \n```\nint x = 10, y = 15;\ndouble average;\naverage = sum(x, y) / 2.0;\n```\n\n\
  在最后一条语句中，使用 `x` 和 `y` 作为参数调用了 `sum` 方法。方法的返回值 25 被除以 2.0。结果 12.5 被赋值给 `average`。这里是另一个例子：\n\
  \n```\nint x = 10, y = 15;\nSystem.out.println(\"The sum is \" + sum(x, y));\n```\n\
  \n这段代码将 `sum` 方法的返回值发送给 `System.out.println`，这样它就可以在屏幕上显示。将显示消息“The sum is 25”。\n\
  \n记住，返回值的方法返回一个特定数据类型的值。你可以在任何可以使用相同数据类型的普通值的地方使用方法的返回值。这意味着在任何可以使用 `int` 值的地方，都可以使用返回\
  \ `int` 值的方法调用。同样，在任何可以使用 `double` 值的地方，都可以使用返回 `double` 值的方法调用。对于所有其他数据类型也是如此的。\n\
  \n# 在文档注释中使用 `@return` 标签\n\n在为返回值的方法编写文档注释时，你可以使用 `@return` 标签提供对返回值的描述。当 `javadoc`\
  \ 实用程序方法的文档注释内部看到 `@return` 标签时，它知道接下来将出现方法返回值的描述。\n\n`@return` 标签注释的一般格式如下：\n\n\
  ```\n@return Description\n```\n\n`Description` 是返回值的描述。记住关于 `@return` 标签注释的以下几点：\n\
  \n*   方法文档注释中的 `@return` 标签必须出现在方法的总体描述之后。\n*   描述可以跨越多行。它在文档注释的结束处（`*/` 符号）或另一个标签的开始处结束。\n\
  \n当方法的文档注释包含 `@return` 标签时，`javadoc` 实用会在方法的文档中创建一个“Returns”部分。这里就是列出方法返回值描述的地方。图\
  \ 5-16 显示了 `javadoc` 为 `ValueReturn.java` 文件中的 `sum` 方法生成的文档。\n\n![Value Return.java\
  \ 中 sum 方法的文档。sum 方法返回两个参数之和。参数 num 1 和 num 2 包含要相加的第一个和第二个数字，并分别返回 num 1 和 num\
  \ 2 的和](img/05fig16.png)\n\n# 图 5-16 `ValueReturn.java` 中 `sum` 方法的文档\n\n# 焦点聚焦：使用方法\n\
  \n你的朋友 Michael 经营一家餐饮公司。他的食谱所需的某些成分是以杯（cups）为单位衡量的。然而，当他去商店购买这些成分时，它们仅按液盎（fluid\
  \ ounce）出售。他请你写一个简单的程序，将杯转换为液盎。\n\n你设计了以下算法：\n\n1. 从用户处获取杯数。\n2. 将杯数转换为液盎。\n3. 显示结果。\n\
  \n该算法列出了程序需要执行的高级任务，并成为该类 `main` 方法的基础。该类还将具有以下方法：\n\n*   `getCups`——此方法将提示用户输入杯数，然后将该值作为\
  \ `double` 返回。\n*   `cupsTounces`——此方法将接受杯数作为参数，然后返回等量的液盎数作为 `double` 返回。\n*   `displayResults`——此方法显示一个指示转换的消息。代码列表\
  \ 5-10 显示了该程序。图 5-17 显示了程序的执行交互。\n\n# 图 5-17 `CupConverter` 程序交互\n\n![CupConverter\
  \ 程序由一个输入框和一个显示结果的消息框组成。](img/05fig17.png)图 5-17 完整替代文本\n\n在下面的动画，点击“Previous”或“Next”按钮来逐步执行代码并查看。\n\
  \n# 代码列表 5-10 (`CupConverter.java`)\n\n# 返回布尔值\n\n经常需要一个方法来测试参数并返回 `true` 或 `false`\
  \ 值，以指示条件是否存在。例如，下面的方法当参数在 1 到 100 范围内时返回 `true`，否则返回 `false`：\n\n```\npublic static\
  \ boolean isValid(int number)\n{\n   boolean status;\n   if (number >= 1 && number\
  \ <= 100)\n      status = true;\n   else\n      status = false;\n   return status;\n\
  }\n```\n\n下面的代码显示了一个使用该方法的 `if-else` 语句：\n\n```\nint value = 20;\nif (isValid(value))\n\
  \    System.out.println(\"The value is within range.\");\nelse\n    System.out.println(\"\
  The value is out of range.\");\n```\n\n当这段代码执行时，将显示“The value is within range.”\n\
  \n# 返回引用\n\n返回的方法还可以返回非基本类型的引用，例如 `String` 对象。代码列表 5-11 展示了这样一个例子。\n\n```\n1  /**\n\
  2      此程序演示了一个返回 String\n3            对象的方法。\n4  */\n5  \n6  public class ReturnString\n\
  7  {\n8      public static void main(String[] args)\n9      {\n10         String\
  \ customerName;\n11\n12         customerName = fullName(\"John\", \"Martin\");\n\
  13         System.out.println(customerName);\n14      }\n15\n16      /**\n17   \
  \     fullName 方法接受两个 String 参数\n18        包含名和姓。它将它们\n19        合并成一个单一的 String\
  \ 对象。\n20        @param first 名。\n21        @param last 姓。\n22        @return 包含名和姓的\
  \ String \n23                对象的引用。\n24    */\n25\n26    public static String fullName(String\
  \ first, String last)\n27    {\n28        String name;\n29\n30        name = first\
  \ + \" \" + last;\n31        return name;\n32    }\n33  }\n```\n\n# 代码列表 5-11 (`ReturnString.java`)\n\
  \n程序输出\n\n```\nJohn Martin\n```\n\n第 12 行调用了 `fullName` 方法，并将 \"John\" 和 \"Martin\"\
  \ 作为参数传递。该方法返回一个包含 \"John Martin\" 的 `String` 对象的引用。该引用被赋值给变量 `customerName`。这在图\
  \ 5-18 所示。\n\n# 图 5-18 `fullName` 方法返回 `String` 对象的引用\n\n\n\n\n![`fullName` 方法返回一个字符串对象的引用。](img/05fig18.png)图\
