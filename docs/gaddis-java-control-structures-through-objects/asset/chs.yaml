  \ X, X。](img/12fig38.png)\n\n## 图 12-38 井字棋应用程序（Oracle 公司法务顾问）\n\n该应用程序应使用二维 `int`\
  \ 数组在内存中模拟游戏棋盘。当用户点击 `New Game`（新游戏）按钮时，应用程序应该遍历数组，在每个元素中存储一个 0 到 1 之间的随机数。数字 0\
  \ 代表字母 O，数字 1 代表字母 X。然后应更新应用程序窗口以显示游戏棋盘。应用程序应显示一条消息，指示 X 玩家胜出、Y 玩家胜还是游戏平局。\n\n##\
  \ 10. 老虎机模拟\n\n老虎机是一种赌博设备，用户向其中投入货币然后拉动杠杆（或按下按钮）。老虎机机会显示一组随机图像。如果其中两个或多个图像匹配，用户将赢得老虎机返还给用户的金额。\n\
  \n创建一个模拟老虎机的 JavaFX 应用程序。图 12-39 显示了 GUI 应该外观的示例。应用程序应允许用户在 `TextField`（文本字段）中输入其向机器投入的货币金额。当用户点击\
  \ `Spin`（旋转）按钮时，应用程序应该显示三个随机选择的符号。（老虎机传统上显示水果符号。你会在学生示例程序中找到水果符号图像。）程序还应该显示用户每次旋转赢得的金额以及所有旋转的总金额。\n\
  \n## 图 12-39 老虎机应用程序（Oracle 公司法务顾问）\n\n![模拟老虎机的 JavaFX 应用程序中 GUI 外观的示例。](img/12fig39.png)图\
  \ 12-39 完整替代文本\n\n单次旋转赢得金额通过以下方式确定：\n\n* 如果随机显示的图像无一匹配，则用户赢得 0 美元。\n* 如果两个图像匹配，用户赢了输入金额的两倍。\n\
  * 如果三个图像匹配，用户赢了输入金额的三倍。\n\n# 第 13 章 JavaFX：高级控件\n\n## 题\n\n1. 13.1 使用 CSS 为 JavaFX\
  \ 应用程序进行样式化\n2. 13.2 `RadioButton` 控件\n3. 13.3 `CheckBox` 控件\n4. 13.4 `ListView`\
  \ 控件\n5. 13.5 `ComboBox` 控件\n6. 13.6 `Slider` 控件\n7. 13.7 `TextArea` 控件\n8. 13.8\
  \ 菜单\n9. 13.9 `FileChooser` 类\n\n10. 13.10 使用控制台调试应用程序\n11. 13.11 避免常见错误\n\n## 13.1\
  \ 使用 CSS 为 JavaFX 应用程序进行样式化\n\nCSS 代表层叠样式表，是一种用于描述呈现效果的语言。在 JavaFX 中，CSS 使用选择器和属性来样式组件。这允许将应用程序的内容与其呈现分离，使代码更易维护和更新。\n\
  \n你可以通过内联样式、内部样式表或外部样式表来应用 CSS。内联样式通过 `setStyle` 方法直接应用于节点。内部样式表定义在文件中。\n\n例如，你可以使用内联样式来设置\
  \ `Label`：\n\n```java\nlabel.setStyle(\"-fx-font-size: 14px; -fx-text-fill: red;\"\
  );\n```\n\n或者，使用外部样式表：\n\n```java\nscene.getStylesheets().add(getClass().getResource(\"\
  style.css\").toExternalForm());\n```\n\nCSS 提供的属性包括颜色、字体、边框、背景等。你还可以使用 CSS 创建动画和过渡效果。CSS\
  \ 是一种创建视觉效果应用程序的强大工具。通过掌握 CSS，你可以创建美观且易用的界面。\n\n### 选择器\n\n选择器用于标识样式应该应用于哪些节点。JavaFX\
  \ 中有多种选择器：\n\n* 类型选择器：选择特定类型的节点。例如，`.label` 选择所有 `Label`。\n* ID 选择器：选择具有特定 ID 的节点。例如，`#myLabel`\
  \ 选择 ID 为 myLabel 的节点。\n* 类选择器：选择分配了特定类的节点。例如，`.highlight` 选择所有带有 `highlight` 类的节点。\n\
  * 属性选择器：根据属性选择节点。例如，`label[text=\"Hello\"]` 选择所有文本为 \"Hello\" 的 `Label`。\n\n在 JavaFX\
  \ 中，你可以组合选择器以创建更具体的规则。例如，`.label.highlight` 选择带有 `highlight` 类的 `Label`。\n\n###\
  \ 使用控制台调试应用程序\n\n控制台是调试 JavaFX 应用程序的有用工具。你可以向控制台打印消息，帮助跟踪代码执行并识别问题。\n\n```java\n\
  System.out.println(\"Debug message\");\n```\n\n### 常见错误\n\n在处理 JavaFX CSS 时，可能会遇到某些错误。以下是一些常见错误及其避免方法：\n\
  \n* CSS 语法错误：检查 CSS 代码中的拼写错误或缺失的标点。\n* 样式表路径错误：确保你的样式表文件路径正确。\n* 使用错误的选择器：确保为要样化的节点使用了正确的选择器。\n\
  * 样式覆盖：注意样式之间相互覆盖。使用优先级来控制样式的应用。\n\n\n\n\n\nJavaFX 中的每个节点类型都有一组你可以使用的样式属性。例如，表 13-2\
  \ (#ch13_pg0002.xhtml_P7001015878000000000000000000583D) 显示了 `Labeled` 类的一些样式属性，而表\
  \ 13-3 (#ch13_pg0002.xhtml_P70010158780000000000000000058A7) 显示了 `Region` 类的一些属性。`Label`\
  \ 类、`Button` 类、`CheckBox` 类和 `RadioButton` 类都继承自 `Region` 类和 `Labeled` 类，因此这两个表格中的属性均可用于\
  \ `Label`、`Button`、`CheckBox` 和 `RadioButton` 控件。（本章稍后会讨论 `CheckBox` 和 `RadioButton`\
  \ 控件。）\n\n## 表 13-2 `Labeled` 类的一些 CSS 样式属性（被 `Label` 和 `Button` 类继承）\n\n| 属性 |\
  \ 说明 | 可能的值 |\n| --- | --- | --- |\n| `-fx-text-alignment` | 指定控件的文本对齐方式 | `left`\
  \ `center` `right` `justify` |\n| `-fx-font-family` | 指定控件文本的字体 | 可以是本地系统安装的字体名称，或者是以下通用字体之一：`serif`\
  \ `sans-serif` `cursive` `fantasy` `monospace` |\n| `-fx-font-size` | 指定控件文本的大小\
  \ | 可以是以磅 (`pt`) 或像素 (`px`) 为指定的数字。例如：`12pt` `18px` |\n| `-fx-font-style` | 指定控件文本的样式（普通、斜体或倾斜）\
  \ | `normal` `italic` `oblique` |\n| `-fx-font-weight` | 指定控件文本的粗细 | 你可以这些预定义值之一：`normal`\
  \ `bold` `bolder` `lighter`。或者，你可以指定这些数值值之一：`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`\
  \ 或 `900`。使用数值值时，`400` 的权重与 `normal` 相同，`700` 的权重与 `bold` 相同。 |\n| `-fx-text-fill`\
  \ | 指定控件文本的颜色 | 可以是十六进制颜色代码，或命名颜色（参见本节稍后对颜色代码的讨论） |\n\n## 表 13-3 `Region` 类的一些 CSS\
  \ 样式属性（被 `Label` 和 `Button` 类继承）\n\n| 属性 | 说明 | 可能的值 |\n| --- | --- | --- |\n| `-fx-border-style`\
  \ | 指定在控件周围绘制边框类型 | 此属性有很多可能的设置，但常见的有：`none` `solid` `dotted` `dashed` |\n| `-fx-border-width`\
  \ | 指定控件边框的宽度 | 通常以像素数表示，如 `3px` |\n| `-fx-border-color` | 指定控件边框的颜色 | 可以是十六进制颜色代码，或命名颜色（参见本节稍后对颜色代码的讨论）\
  \ |\n| `-fx-background-color` | 指定控件的背景颜色 | 可以是十六进制颜色代码，或命名颜色（参见本节稍后对颜色代码的讨论） |\n\
  \n以下是一个使用了这些属性的示例样式定义：\n\n```\n.label {\n   -fx-font-family: cursive;\n   -fx-font-size:\
  \ 14pt;\n   -fx-font-style: italic;\n   -fx-font-weight: bold;\n   -fx-border-style:\
  \ dotted;\n}\n```\n\n如果我们在 JavaFX 中使用此样式定义，它的样式规则将应用于用户界面中的所有 `Label` 控件。\n\n##\
  \ 将样式表应用到 JavaFX 应用程序\n\n如前所述，样式表仅仅是一个包含样式定义的文本文件。样式表通常以 `.css` 文件扩展名保存。要将样式表应用于\
  \ JavaFX 应用程序，将样式表保存在与 JavaFX 应用程序相同的目录下。然后，在应用程序的代码中，将样式表添加到场景（scene）。例如，假设我们有一个名为\
  \ `mystyles.css` 的样式表，在我们的 Java 代码中，变量 `scene`引用了我们的 `Scene` 对象。我们将使用以下语句将样式表添加到场景中：\n\
  \n```\nscene.getStylesheets().add(\"mystyles.css\");\n```\n\n`Scene` 类的 `getStylesheets()`\
  \ 方法返回一个包含场景样式表集合的对象，该对象的 `add` 方法将指定的样式表添加到集合中。\n\n让我们来看示例。代码列表 13-1 显示了 `demo1.css`\
  \ 文件的内容（等一下，检查原文...它说是 `demo1.css`），并且 代码列表 13-2 显示了一个向 JavaFX 应用程序应用该样式表的程序。\n\n\
  \n\n\n\n![C S S Demo 2 dot java 的输出包含一个文本为 This is a label 的字段，以及两个标记为 Button 1\
  \ 和 Button 2 的按钮。](img/13fig02.png)\n\n## 图 13-2 CSSDemo2.java 输出（Oracle 法律顾问）\n\
