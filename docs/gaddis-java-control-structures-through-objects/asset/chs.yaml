  \ 控件中输入文本。在程序中，你可以获取用户输入的文本，并将该文本用于任何必要的操作。\n\n要创建一个 `TextField` 控件，你将使用位于 `javafx.scene.control`\
  \ 包中的 `TextField` 类。一旦你写了必要的 `import` 语句，你就可以创建 `TextField` 类的实例 了。以下语句显示了一个示例：\n\
  \n```\nTextField myTextField = new TextField();\n```\n\n此语句创建了一个空的 `TextField`。在可选情况下，你可以向构造函数传递一个字符串，以便在\
