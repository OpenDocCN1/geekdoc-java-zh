  \n## 3.11 需要避免的常见错误\n\n以下列表描述了在学习本章主题时经常发生的几种错误。\n\n*   **使用 `=` 而不是 `==` 来比较基本数据类型值。**\
  \ 记住，=` 是赋值运算符，而 `==` 用于测试相等性。\n*   **使用 `==` 而不是 `equals` 方法来比较 `String` 对象。**\
  \ 你不能使用 `==` 运算符来比较 `String` 对象与另一个字符串的内容。相反，你必须使用 `equals` 或 `compareTo` 方法。\n\
  *   **忘记将 `if` 语句的 `boolean` 表达式括在括号。** Java 要求 `if` 语句测试的 `boolean` 表达式必须括在括号内。如果省略括号或使用任何其他分组字符将导致错误。\n\
  *   **在 `if` 子句末尾写分号。** 当你在 `if` 子句末尾写分号时，Java 假设条件执行的语句是一个空语句或空语句。\n*   **忘记将多个条件执行的语句括在大括号中。**\
  \ 通常情况下，`if` 语句只条件地执行一条语句。要条件地执行多个语句，你必须将它们括在大括号中。\n*   **在 `if-else-if` 语句中省略末尾的\
  \ `else`。** 这不是语法错误，但可能会导致逻辑错误。如果你在 `if-else-if` 语句中省略了最后的 `else`。\n*   **在 `&&`\
  \ 的两侧都未编写完整的 `boolean` 表达式。** 例如，`x > 0` 是无效的。\n*   **尝试用 `String` 类进行不区分大小的比较。**\
  \ 要进行不区分大小的比较，请使用 `String` 类的 `equals`。\n*   **使用了非字面量或 `final` 的 switch 值。** `switch`\
  \ 值必须是字面量或 `final`。\n*   **在使用条件运算符时反转了 `?` 和 `:`。** 使用条件运算符时，`?` 字符在前，然后是 `:`。\n\
  *   **在使用 `System.out.printf` 或 `String.format` 格式化数字时使用了错误的标志或宽度。**\n\n## 检查点 3.75\n\
  \n../components/metrodigi/ch03-assessable_table_v1.0.1/index.html\n\n## 编程挑战\n\n\
  ### 1. 罗马数字\n\n编写一个程序，提示用户输入 1 到 10 之间的数字。程序应显示该数字的罗马数字形式。如果数字超出 1 到 10 的范围，程序应显示错误信息。\n\
  \n### 2. 魔法日期\n\n编写一个程序，要求用户输入月份（数字形式）、日期和两位数的年份。程序应判断月份乘以日期是否等于年份。如果是，则显示该日期是魔法日期的消息；否则，显示该日期不是魔法日期的消息。\n\
  \n### 3. 体质量指数\n\n编写一个程序，计算并显示人的体质量指数（BMI）。BMI 通常用于判断人相对于其身高来说是否超重或体重过轻。人的 BMI 通过以下公式计算：\n\
  \n`BMI = weight * 703 / height²`\n\n其中 *weight* 以磅为单位，*height* 以英寸为单位。程序应显示一条消息，说明人的体重是理想的、过轻还是超重。如果久坐人员的\
  \ BMI 在 18.5 到 25 之间，则体重被认为是理想的。如果 BMI 小于 18.5，则被认为过轻。如果 BMI 值大于 25，则被认为超重。\n\n\n\
  \n\n\n编写一个程序，使用三个变量来存储三个测试分数。程序应要求用户输入三个测试分数，并将输入的值赋值给这些变量。程序应显示测试分数的平均分以及根据该平均分对应的字母等级。请使用下表中的评分标准：\n\
  \n| 测试分数平均分 | 字母等级 |\n| --- | --- |\n| 90–100 | A |\n| 80–89 | B |\n| 70–79 | C\
  \ |\n| 60–69 | D |\n| 60 以下 | F |\n\n# 5. 质量与重量\n\n科学家以千克（kg）测量物体的质量，以牛顿（N）测量其重量。如果你知道一个对象的质量，可以使用以下公式计算其以牛顿为单位的重量：\n\
  \n`Weight = Mass × 9.8`\n\n编写一个程序要求用户输入对象的质量，然后计算其重量。如果对象的重量超过 1,000 牛顿，则显示一条表示该物体太重的消息。如果对象的重量小于\
  \ 10 牛顿，则显示一条表示该物体太轻的消息。\n\n# 6. 时间计算器\n\n## 查看时间计算器问题\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/M_SSC3txFyjEBuwMO0cxb6Kd7fGSuUQ_`](https://mediaplayer.pearsoncmg.com/assets/_video.true/M_SSC3txFyjEBuwMO0cxb6Kd7fGSuUQ_)\n\
  \n编写一个程序要求用户输入秒数。\n\n* 一分钟有 60 秒。如果用户输入的秒数大于等于 60，程序应显示该秒数对应的分钟数。\n* 一小时有 3,600\
  \ 秒。如果用户输入的秒数大于等于 3,600，程序应显示该秒数对应的小时数。\n* 一天有 86,400 秒。如果用户输入的秒数大于等于 86,400，程序应显示该秒数对应的天数。\n\
  \n# 7. 姓名排序\n\n编写一个程序要求用户输入三个名字，然后按升序显示这些名字。例如，如果用户输入了“Charlie”、“Leslie”和“Andy”，程序将显示：\n\
  \n* Andy\n* Charlie\n* Leslie\n\n# 8. 软件销售\n\n一家软件公司销售一套零售价为 $99 的软件包。根据下表提供数量折扣：\n\
  \n| 数量 | 折扣 |\n| --- | --- |\n| 10–19 | 20% |\n| 20–49 | 30% |\n| 50–99 | 40% |\n\
  | 100 或更多 | 50% |\n\n编写一个程序要求用户输入购买的软件包数量。程序应显示折扣金额（如果有）以及折扣后的购买总额。\n\n# 9. 运费\n\
  \n快速货运公司按以下费率收费：\n\n| 包裹重量 | 每 500 英里的运运费率 |\n| --- | --- |\n| 2 磅或以下 | $1.10 |\n\
  | 超过 2 磅但不超过 6 磅 | $2.20 |\n| 超过 6 磅但不超过 10 磅 | $3.70 |\n| 超过 10 磅 | $3.80 |\n\n\
  每 500 英里的运费不按比例计算。例如，如果一个 2 磅的包裹运输了 550 英里，费用将是 $2.20。编写一个程序要求用户输入包裹重量，然后显示运费。\n\
  \n# 10. 脂肪计算器\n\n编写一个程序要求用户输入食品中的卡路里数和脂肪克数。程序应显示脂肪占总热量的百分比。每克脂肪含有 9 卡路里；因此：\n\n\
  `Calories from fat = Fat grams × 9`\n\n脂肪热量的百分比可以如下计算：\n\n`Calories from fat ÷ Total\
  \ calories`\n\n如果脂肪热量小于食品总卡路里数的 30%，则还应显示一条表示该食品低脂的消息。\n\n### 注意\n\n脂肪热量数不能大于食品中的总卡路里数。如果程序确定脂肪热量数大于食品中的卡路里数，则应显示一条表示输入无效错误消息。\n\
  \n### 11. 跑步\n\n编写一个程序要求用户输入跑步的名字和他们完成所需的时间，然后显示冠军。\n\n### 12. 声速\n\n下表显示了声速：\n\n\
  | 介质 | 速度 |\n| --- | --- |\n| 空气 | 340 |\n| 水 | 140 |\n| 钢 | 5960 |\n\n编写一个程序要求用户输入介质（“air”、“water”或“steel”）和距离。程序应使用以下公式计算该距离所需的时间：\n\
  \n`time = distance / speed`\n\n# 13. 移动运营商\n\n一家移动运营商为客户提供三个套餐：\n\n| 套餐 | 月费 | 包含分钟数\
