  \n## 9. 阿克曼函数\n\nAckermann 函数是一种递归数学算法，可以用于测试计算机执行递归的性能。编写一个 `ackermann(m, n)` 方法来解决\
  \ Ackermann 函数。在你的方法中使用以下逻辑：\n\n- 如果 `m` = 0，则返回 `n + 1`\n- 如果 `n` = 0，则返回 `ackermann(m\
  \ − 1, 1)`\n- 否则，返回 `ackermann(m − 1, ackermann(m, n − 1))`\n\n在程序中测试你的方法，显示以下方法调用的返回值：\n\
  \n- `ackermann(0, 0)` `ackermann(0, 1)` `ackermann(1, 1)` `ackermann(1, 2)`\n- `ackermann(1,\
  \ 3)` `ackermann(2, 2)` `ackermann(3, 2)`\n\n## 10. 递归种类\n\n在第 4 章的第 9 个编程挑战中，你编写了一个种类来预测生物在若干天后的数量。修改该类，使用递归方法而不是循环来计算生物的数量。\n\
