  \ 4 章中编写的“已行驶距离”程序（编程挑战 2），以使用该方法。\n\n# 10. 股票利润\n\n出售股票的利润可以这样计算：\n\n`Profit =\
  \ ((NS × SP) - SC) - ((NS × PP) + PC)`\n\n其中 `NS` 是股数，`PP` 是每股买入价格，`PC` 是支付的买入佣金，`SP`\
  \ 是每股卖价格，`SC` 是支付的出售佣金。如果计算结果为正值，则出售股票产生了利润。如果计算结果为负数，则出售导致亏损。\n\n编写一个方法，接受股数、每股买入价格、支付的买入佣金、每股卖价格和支付的出售佣金作为参数。该方法应返回出售股票的利润（或亏损）。在一个程序中演示该方法，要求用户输入必要的数据并显示利润或亏损的金额。\n\
  \n# 11. 多次股票出售\n\n在一个程序中使用你为编程挑战 10（股票利润）编写的方法，计算出售多只股票的总利润或亏损。该程序应询问用户出售股票的次数以及每笔交易所需的必要数据。它应该累积每笔股票出售的利润或亏损，然后显示总计。\n\
  \n# 12. 动能\n\n在物理学中，运动中的物体被称为具有动能。可以使用以下公式确定运动物体的动能：\n\n`KE = ½ m v²`\n\n公式中的变量如下：`KE`\
  \ 是动能，`m` 是以公斤为单位的物体质量，`v` 是以米/秒为单位的物体速度。\n\n编写名为 `kineticEnergy` 的方法，接受对象的质量（公斤）和速度（米/秒）作为参数。该方法应返回物体拥有的动能值。在一个程序中调用该方法来演示它，要求用户输入质量和速度的值。\n\
  \n# 13. isPrime 方法\n\n质数是一个只能被自身和 1 整除的数字。例如，数字 5 是质数，因为它只能被 1 和 5 整除。然而，数字 6 不是质数，因为它可以被\
  \ 1、2、3 和 6 整除。\n\n编写一个名为 `isPrime` 的方法，它接受一个整数作为参数，如果该参数是质数则返回 `true`，否则返回 `false`。在一个完整的程序中演示该方法。\n\
  \n### 提示\n\n记住 `%` 运算符将一个数字除以另一个数字，并返回除法的余数。在如 `num1 % num2` 的表达式中，如果 `num1` 能被\
  \ `num2` 整除，`%` 运算符将返回 0。\n\n# 14. 质数列表\n\n在一个程序中使用你在编程挑战 13 中编写的 `isPrime` 方法，将\
  \ 1 到 100 之间的所有质数存储在一个文件中。\n\n# 15. 奇偶计数\n\n可以使用以下逻辑判断一个数字是偶数还是奇数：\n\n```java\n\
  if ((number % 2) == 0)\n{\n  // 该数字是偶数。\n}\nelse\n{\n  // 该数字是奇数。\n}\n```\n\n编写一个带有名为\
  \ `isEven` 方法的程序，该方法接受一个 `int` 参数。如果参数是偶数则返回 `true`，否则返回 `false`。程序的 `main` 方法应使用循环生成\
  \ 100 个随机整数。它应该使用 `isEven` 方法判断每个随机数是偶数还是奇数。当循环结束，程序应显示生成的偶数个数和奇数个数。\n\n# 16. 现值\n\
  \n假设你想向储蓄账户存入某笔钱，然后让其闲置 10 年以赚取利息。10 年后，你希望账户里有 $10,000。你现在需要存入多少钱来实现这一目标？你可以使用以下公式（即现值公式）来计算：\n\
  \n$$P = \\frac{F}{(1 + r)^{n}}$$\n\n公式中的项如下：\n\n* `P` 是**现值**，即你今天需要存入的金额。\n* `F`\
  \ 是你希望在账户中拥有的**未来值**。（在这种情况下，`F` 为 $10,000。）\n* `r` 是**年利率**。\n* `n` 是你计划让资金存放的**年数**。\n\
  \n编写一个名为 `presentValue` 的方法执行此计算。它应该接受`未来值`、`利率`和`年份`作为参数。它应该返回现值，即你今天需要存入的金额。在一个程序中演示该方法，让用户尝试不同的值。\n\
  \n# 17. 石头剪刀布游戏\n\n编写一个程序让用户与电脑玩石头剪刀布游戏。程序运行逻辑如下：\n\n1. 当程序开始时，生成一个 3 以内的随机数。如果是\
  \ 1，电脑出石头；如果是 2，电脑出布子；如果是 3，电脑出剪刀。\n2. 用户通过键盘输入 \"rock\"、paper\" 或 \"scissors\"\
  。\n3. 根据以下规则确定胜者：\n    * 如果一个出石头，另一个出剪刀，则石头胜。\n    * 如果一个出剪刀，另一个出布子，则剪刀胜。\n    *\
  \ 如果一个出布子，另一个出石头，则布子胜。\n    * 如果双方选择相同，则重新玩。\n\n确保将程序拆分为方法。\n\n# 18. 猜颜色\n\n编写一个测试你\
  \ ESP 的程序。程序应该从 Red、Green、Yellow 列表中随机选择一个颜色。为了选择颜色，程序可以生成一个随机数。例如，如果是 0 则 Red；如果是\
  \ 1 则 Green。接下来，程序询问用户输入的颜色。用户输入后，程序显示随机选择的颜色。程序重复此过程 10 次，然后显示猜中的次数。\n\n# 第 6 章\
  \ 类初探\n\n## 话题\n\n1. 6.1 对象与类\n2. 6.2 逐步编写简单类\n3. 6.3 实例字段与方法\n4. 6.4 构造方法\n5. 6.5\
  \ 传递对象对象\n6. 6.6 方法与构造器的重载\n7. 6.7 实例字段的作用域\n8. 6.8 包与 `import` 语句\n9. 6.9 关注面向对象的设计：寻找类及其职责\n\
  10. 6.10 需要避免的常见错误\n\n\n\n\n## 6.1 对象与类\n\n概念：对象是存在于内存中的软件组件，在程序中具有特定的用途。对象是由类创建的，而类包含了描述该对象的代码。\n\
  \n如果你曾经开过汽车，你就知道汽车由许多组件组成。它有方向盘、加速踏板、刹车踏板、档位杆、速度表以及驾驶员与之交互的许多其他设备。引擎盖下还有许多组件，如引擎、电池、散热器等　。因此，汽车不仅仅是一个单一的整体，而是一系列共同工作的对象的集合。\n\
  \n同样的概念也适用于计算机编程。今天使用的大多数编程语言都是面向对象的。在用像 `Java` 这样面向对象的语言时，你创建的程序是由对象构成的。然而，在编程中，对象并不是像方向盘或刹车踏板那样的物理设备；它是存在于计算机内存中并执行特定任务的软件组件。在软件中，对象通常具有两个通用能力：\n\
  \n*   对象可以存储数据。存储在对象中的数据通常称为 `fields`（字段）。\n*   对象可以执行操作。对象可以执行的操作称为 `methods`（方法）。\n\
  \n对象在 `Java` 中非常重要。以下是你之前学习过的一些对象示例：\n\n*   如果你需要从键盘或文件读取输入，可以使用 `Scanner` 对象。\n\
  *   如果你需要生成随机数，可以使用 `Random` 对象。\n*   如果你需要将输出写入文件，可以使用 `PrintWriter` 对象。\n\n当程序需要某个特定类型对象的服务时，它会在内存中创建该对象，然后根据需要调用该对象的方法。\n\
  \n### 类：对象从何而来\n\n对象非常有用，但它们并不会空出现在你的程序中。在程序使用某个特定类型的对象之前，该对象必须在内存中被创建。而在内存中创建对象之前，你必须先为该对象定义一个类。\n\
  \n一个 `class`（类）是描述特定类型对象的代码。它指定了对象可以包含的数据（对象的 `fields`）以及对象可以执行的动作（对象的 `methods`）。你可以将类比比一个代码“蓝图”，可以用来创建特定类型的对象。它的作用类似于房屋的蓝图。蓝图本身不是房子，而是对房屋的详细描述。当我们使用蓝图建造一栋真实的房屋时，我们可以说我们正在建造蓝图所描述的房屋的实例（instance）。如果我们愿意，可以从同一个蓝图建造几栋完全相同的房屋。每栋房子都是蓝图所描述的房屋的独立实例。这一概念在图\
  \ 6-1 中得到了说明。\n\n![蓝图描述了一个房屋平面，包括一个浴室和一个长房间，被称为类。该平面的三个实例由蓝图描述，并表示为带有四扇窗户、一个前门和一个前走道的房屋。](img/Fig06-01.png)\n\
  \n### 图 6-1 蓝图和根据蓝图建造的房屋\n\n因此，类不是对象，而是对对象的描述。当程序运行时，它可以利用类在内存中创建所需数量的特定类型对象。从类创建的每个对象都称为该类的\
  \ `instance`（实例）。\n\n### 注意\n\n到本章为止，你使用的类的用途不同：作为程序方法的容器。到目前为止，你编写的所有 `Java` 程序都包含一个带有\
  \ `main` 方法的类，可能还有其他方法。在本章中，你将学习如何编写可以从中创建对象的类。\n\n# Java API 中的类\n\n到目前为止，你在程序中使用的对象都是从\
  \ Java API 中的类创建的。例如，每当你创建一个 `Scanner` 对象时，你都在创建一个名为 `Scanner` 的类的实例，而该类位于 Java\
  \ API 中。同样，当你创建一个 `Random` 对象时，你就在创建一个名为 `Random` 的类的实例，该类位于 Java API 中。`PrintWriter`\
  \ 对象也是如此。当你需要将数据写入文件时，你创建一个 `PrintWriter` 类的实例，该类位于 Java API 中。查看代码列表 6-1，这是一个使用了所有这些类型对象的程序。\n\
  \n在下面的动画中，点击“上一步”或“下一步”按钮逐步查看代码并查看贯穿其中的解释。\n\n### 代码列表 6-1 `(ObjectDemo.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr6-1/1.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr6-1/1.html)\n\
  \n简而言之，该程序向名为 `numbers.txt` 的文件写入指定数量的随机数。当程序运行时，它会询问用户要写入的随机数数量。然后向文件中写入相应数量的数字。为了完成工作，它创建了对象：\n\
  \n*   在第 17 行创建了 `Scanner` 类的实例，将其地址赋值给变量 `keyboard`。该对象用于读取输入。\n*   在第 20 行创建了\
  \ `Random` 类的实例，将其地址赋值给变量 `rand`。该对象用于生成随机数。\n*   在第 23 行创建了 `PrintWriter` 类的实例，将其地址赋值给变量\
  \ `output`。该对象用于输出到 `numbers.txt`。\n\n图 6-2 说明了程序创建的三个对象。当程序运行时，它使用这些对象来完成任务。例如：\n\
  \n*   在第 27 行调用 `Scanner` 对象的 `nextInt` 方法读取用户输入（即要生成的随机数数量）。返回值赋值给 `maxNumbers`。\n\
  *   在第 33 行调用 `Random` 对象的 `nextInt` 方法获取一个随机整数。返回值赋值给 `number`。\n*   在第 36 行调用\
  \ `PrintWriter` 对象的 `println` 方法将 `number` 的值写入文件。\n*   在第 40 行调用 `PrintWriter`\
  \ 对象的 `close` 方法关闭文件。\n\n### 图 6-2 ObjectDemo 程序创建的对象\n\n![三个变量对应三个对象。](img/Fig06-01.png)图\
  \ 6-2 完整文本\n\n这个简单的示例展示了程序是如何工作的。程序创建完成任务所需的各种对象。每个对象都有组可以调用的方法，从而执行操作。\n\n### 注意\n\
  \n代码列表 6-1 中第 1 到 3 行出现的 `import` 语句使得 `Scanner`、`Random` 和 `PrintWriter` 类对程序可用。你将在本章后面更多关于\
  \ Java API 如何组织以及为什么需要这些 `import` 语句。\n\n# 原型变量与对象\n\n第 2 章介绍了 Java 原型数据类型：`byte`、`short`、`int`、`long`、`char`、`float`、`double`\
  \ 和 `boolean`。现在你已经看到了许多同时使用原型数据类型和对象的程序。事实上，代码列表 6-1 中的程序使用了两个原型变量（`maxNumbers`\
  \ 和 `number`，均为 `int` 变量），以及一个 `Scanner` 对象、一个 `Random` 对象和一个 `PrintWriter` 对象。\n\
  \n\n\n\n你可能已经注意到，创建一个对象的步骤与创建一个原始类型变量的步骤不同。例如，要创建一个 `int` 变量，你只需要进行如下的声明：\n\n```\n\
  int wholeNumber;\n```\n\n但是，要创建一个对象，你必须编写一些额外的代码。例如，以下语句创建了一个 `Random` 对象：\n\n```\n\
  Random rand = new Rand();\n```\n\n原始类型变量（如 `int`、`double` 等）仅仅是计算机内存中的存储位置。原始数据类型被称为“原始的”（primitive），是因为使用原始数据类型创建的变量除了存储值外，没有内置功能。当你声明一个原始类型变量时，编译器会预留或分配一段足够容纳该变量的内存。例如，查看以下变量声明：\n\
  \n```\nint wholeNumber;\ndouble realNumber;\n```\n\n回想第 2 章，`int` 使用 4 字节内存，而 `double`\
  \ 使用 8 字节内存。这些声明语句将导致内存如图 6-3 所示被分配。\n\n![两个变量有不同的内存分配。第一个命名为 `int wholeNumber;`，分配了\
  \ 4 字节内存。第二个命名为 `double realNumber;`，分配了 8 字节内存。](img/Fig06-03.png)\n\n### 图 6-3\
  \ 内存分配\n\n为原始类型变量分配的内存是存储分配给该变量的任何值的实际位置。例如，假设我们使用以下语句为图 6-3 所示的变量赋值：\n\n```\nwholeNumber\
  \ = 99;\nrealNumber = 123.45;\n```\n\n图 6-4 显示了赋值的值是如何存储在每个变量的内存位置中的。![两个变量有不同的内存分配。第一个命名为\
  \ `int wholeNumber;`，分配了 4 字节内存。第二个命名为 `double realNumber;`，分配了 8 字节内存。](img/Fig06-04.png)\n\
  \n# 图 6-4 赋值给变量的值\n\n从这些插图中可以看出，原始类型变量非常直观。当你处理原始变量时，你正在使用一个持有部分数据的存储位置。\n\n这与对象的工作方式不同。当你处理一个对象时，你通常在使用两样东西：\n\
  * 对象本身，它必须在内存中创建\n* 指向该对象的引用变量\n\n在内存中创建的对象持有某种数据并执行某种操作（具体取决于它是什么类型的对象以及数据和操作）。为了在代码中使用对象，你需要某种方式来引用它。这就是引用变量派用用场。引用变量并不持有你的程序将处理的实际数据；相反，它持有对象的内存地址。我们说该变量引用了该对象。当你想要操作该对象时，你使用引用它的变量。引用变量（也称为类变量）只能用于引用对象。图\
  \ 6-5 展示了在内存中创建的两个对象，每个都由一个变量引用。![两个相同的对象被两个相同的变量引用。每个引用变量都是一个标记为“Reference Variable”的空框，并指向一个内部有“Object”字样的矩形阴影圆。](img/Fig06-05.png)\n\
  \n# 图 6-5 由变量引用的两个对象\n\n要理解引用变量和对象是如何工作的，想象一下放风筝。为了放风筝，你需要卷连接在上面的线轴。当风筝在空中时，你使用线轴来握住风筝并控制它。这与对象与引用该对象的变量之间的关系相似。如图\
  \ 6-6 所示，对象就像风筝，而引用该对象的变量就像线轴。![风筝和线说明了一个用于理解引用变量和对象如何协同工作的比喻。引用对象的变量充当线轴来控制风筝，风筝表示为在空中的风筝。](img/Fig06-06.png)\n\
  \n# 图 6-6 风筝与线的比喻\n\n创建一个对象通常需要以下两个步骤：\n1. 你声明一个引用变量。\n2. 你在内存中创建对象并将其赋值给该变量。\n\n\
  完成这些步骤后，你就可以使用该变量来操作对象了。这里有一个创建该类的熟悉示例：\n\n```\nRandom rand = new Rand();\n```\n\
  \n观察这个语句的不同部分：\n* 语句的左侧部分 `Random rand` 了一个变量 `rand`，它可以用于引用对象。\n* 语句的右侧部分 `new\
  \ Rand()`：`new` 操作符在内存中创建一个对象并返回该对象的内存地址。\n* `=` 运算符将 `new` 操作符返回的内存地址赋值给变量 `rand`。该语句执行后，`rand`\
  \ 变量将引用该对象。你随后可以使用引用它的变量对该对象进行操作，例如生成随机数。![rand 变量被绘为一个空框，引用框内的 Random 对象。](img/Fig06-07.png)\n\
  \n# 图 6-7 `rand` 变量引用 `Random` 对象\n\n# 练习题 6.1\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-01/index.html\n\
  \n# 练习题 6.2\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-02/index.html\n\
  \n# 练习题 6.3\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-03/index.html\n\
  \n# 练习题 6.4\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-04/index.html\n\
  \n# 练习题 6.5\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-05/index.html\n\
  \n# 练习题 6.6\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-06/index.html\n\
  \n# 练习题 6.7\n../components/metrodigi/ch06-inline-self_quiz_v1.0.0-07/index.html\n\
  \n# 6.2 逐步编写一个简单的类\n\n**概念**：你可以编写自己的类来创建程序中需要的对象。我们将以逐步步进的方式演示编写类的过程。\n\nJava API\
  \ 提供了许多预写好的类，可供程序使用。然而，有时你可能希望有一个对象来执行特定任务，而 Java API 中并不存在这样的类。这并不是问题，因为你可以根据任何情况编写自己的类，并包含所需的特定字段和方法。\n\
  \n\n\n\n在本节中，我们将编写一个名为 `Rectangle` 的类。从 `Rectangle` 类创建的每个对象都将能够存储关于矩形的数据。具体来说，一个\
  \ `Rectangle` 对象将具有以下字段：\n\n*   `length.` `length` 字段将存储矩形的长度。\n*   `width.` `width`\
  \ 字段将存储矩形的宽度。\n\n`Rectangle` 类还将具有以下方法：\n\n*   `setLength.` `setLength` 方法将一个值存储在对象的\
  \ `length` 字段中。\n*   `setWidth.` `setWidth` 方法将一个值存储在对象的 `width` 字段中。\n*   `getLength.`\
  \ `getLength` 方法将返回对象 `length` 字段中的值。\n*   `getWidth.` `getWidth` 方法将返回对象 `width`\
  \ 字段中的值。\n*   `getArea.` `getArea` 方法将返回矩形的面积，该面积是对象的长度乘以其宽度的计算结果。\n\n在设计类时，绘制 UML\
  \ 图表通常很有帮助。UML 代表统一建模语言（Unified Modeling Language）。它提供了一系列标准图表，用于以图形方式描述面向对象的系统。图\
  \ 6-8 显示了类 UML 图的通用布局。注意，该图是一个被分为三个部分的框。顶部部分是书写类名的地方。中间部分包含类的字段列表。底部部分包含类的方法列表。\n\
  \n![类 UML 图的通用布局在一个矩形框中所示，该框被均匀地分为三个空矩形框。类名放在顶部的框中。字段列在第二个框中。方法列在第三个框中。](img/Fig06-08.png)\n\
  \n# 图 6-8 类 UML 图的通用布局\n\n遵循这种布局，图 6-9 显示了我们 `Rectangle`类的 UML 图。在本书中，我们频繁使用 UML\
  \ 图来说明类。\n\n# 图 6-9 Rectangle 类的 UML 图\n\n![Rectangle 类的 UML 图被分为三个矩形部分。](img/Fig06-09.png)图\
  \ 6-9 完整备用文本\n\n# 编写类的代码\n\n# 视频编写类和显示对象\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_06_01_writing_classes_and_displa`](https://mediaplayer.pearsoncmg.com/assets/_video.true/secs_gaddis_6_vn_06_01_writing_classes_and_displa)\n\
  \n现在我们已经确定了想要 `Rectangle` 类拥有的字段和方法，让我们编写 Java 代码。首先，我们使用编辑器创建一个名为 `Rectangle.java`\
  \ 的新文件。在 `Rectangle.java` 文件中，我们将从开始编写如下的通用类“骨架”：\n\n```\npublic class Rectangle\n\
   {\n }\n```\n\n出现在第一行的关键字 `public` 是一个访问修饰符。访问修饰符指示类如何可以被访问。`public` 访问修饰符表示该类将对\
  \ `Rectangle.java` 文件之外的代码公开可用。我们在书中编写的几乎所有类都是 `public` 的。\n\n紧随访问修饰符的是关键字 `class`，然后是\
  \ `Rectangle`，它是类名。在下一行出现一个左括号，紧接着是一个右括号。类的内容（即字段和方法）将写在这些括号内部。类定义的通用格式如下：\n\n```\n\
  AccessSpecifier class Name\n {\n     Members\n }\n```\n\n通俗地说，属于一个类的字段和方法被称为类的*成员*（members）。\n\
  \n# 编写类字段的代码\n\n让我们继续编写 `Rectangle` 类，填充其部分成员的代码。首先，我们将为该类的两个字段 `length` 和 `width`\
  \ 编写代码。我们将使用 `double` 数据类型的变量作为这些字段。新的代码行用粗体显示，如下：\n\n```\npublic class Rectangle\n\
   {\n      private double length;\n      private double width;\n }\n```\n\n我们添加的这两行代码声明了变量\
  \ `length` 和 `width`。注意两个声明都以关键字 `private` 开头，位于数据类型之前。关键字 `private` 是一个访问修饰符。它指示这些变量可能被类外的语句访问。\n\
  \n通过使用 `private` 访问修饰符，类可以向类外部的代码隐藏其数据。当类的字段对外部代码隐藏时，数据就能受到保护防止意外损坏。一种常见的做法是将类的所有字段都设为\
  \ `private`，并通过方法提供访问。表 6-1 总结了 `private` 和 `public` 的区别。\n\n| 访问修饰符 | 说明 |\n| :---\
  \ | :--- |\n| `private` | 当 `private` 访问修饰符应用于类时，该成员不能被类外访问。 |\n| `public` | 当 `public`\
  \ 访问修饰符应用于类时，该成员可以被类外访问。 |\n\n# 编写 setLength 方法\n\n现在我们将开始编写类方法。我们将从 `setLength`\
  \ 方法开始。代码列表 6-2 显示了此阶段的 `Rectangle` 类。\n\n```\n 1  /**\n      Rectangle 类，阶段 1\n\
        构造中！\n   */\n 6  public class Rectangle\n   {\n      private double length;\n\
        private double width;\n11     /**\n         setLength 方法将一个值存储在\n        \
  \ length 字段中。\n         @param len 要存储在 length 中的值。\n      */\n17     public void\
  \ setLength(double len)\n      {\n         length = len;\n      }\n21  }\n```\n\n\
  在第 11 到 15 行，我们编写了一个简述方法的块注释。始终为方法编写注释是非常重要的，这样将来任何阅读代码的人都能理解它。方法的定义出现在第 17 到 20\
  \ 行。这里是方法头部：\n\n```\npublic void setLength(double len)\n```\n\n该方法头部看起来与你在第 5 章\
  \ 中学习的任何其他方法头部非常相似。让我们查看各个部分：\n\n*   `public.` 关键字 `public` 是一个访问修饰符。它指示该方法可以被调用。\n\
  *   `void.` 这是方法的返回类型。关键字 `void` 表示方法不向调用它的语句返回任何数据。\n*   `setLength.` 这是方法的名字。\n\
  *   `(double len).` 这是 `double` 数据类型的参数变量的声明，名为 `len`。\n\n图 6-10 标注了 `setLength`\
  \ 方法头部的每个部分。\n\n# 图 6-10 setLength 方法头部\n\n![setLength 方法头部的头部如图所示，标识了访问修饰符、返回类型、方法名和参数变量声明。](img/Fig06-10.png)\n\
  \n\n\n\n注意，方法头中没有出现 `static` 单词。当一个方法被设计为在类的实例上工作时，它被称为`实例方法`（instance method），你不需要在方法头中编写\
  \ `static` 单词。由于此方法会在 `Rectangle` 类实例的 `length` 字段中存储值，因此它是一个实例方法。我们稍后会详细讨论这一点。\n\
  \n方法头之后，方法的体出现在一组大括号内：\n\n```\n{\n      length = len;\n }\n```\n\n该方法的体只有一条语句，即将将\
  \ `len` 的值赋值给 `length` 字段。当方法执行时，`len` 参数变量将持有传递给方法的参数值。该值被赋值给 `length` 字段。\n\n\
  在向类添加其他方法之前，如果能演示一下 `setLength` 方法是如何工作的，可能会有所帮助。首先，注意 `Rectangle` 类没有 `main` 方法。这个类不是一个完整的程序，而是一个可以创建\
  \ `Rectangle` 对象的蓝图。其他程序将使用 `Rectangle` 类来创建对象。创建和使用这些对象的程序将拥有它们自己的 `main` 方法。我们可以通过保存\
  \ `Rectangle.java` 文件的当前内容，然后创建代码列表 6-3 所示的程序来演示该类的 `setLength` 方法。\n\n```\n 1 \
  \ /**\n   2     This program demonstrates the Rectangle class’s\n   3     setLength\
  \ method.\n   4  */\n   5\n   6  public class LengthDemo\n   7  {\n   8     public\
  \ static void main(String[] args)\n   9     {\n  10        // Create a Rectangle\
  \ object and assign its\n   11        // address to the box variable.\n   12   \
  \     Rectangle box = new Rectangle();\n   13\n   14        // Indicate what we\
  \ are doing.\n   15        System.out.println(\"Sending the value 10.0 \" +\n  \
  \ 16                           \"to the setLength method.\");\n   17\n   18    \
  \    // Call the box object's setLength method.\n   19        box.setLength(10.0);\n\
  \   20\n   21        // Indicate we are done.\n   22        System.out.println(\"\
  Done.\");\n   23     }\n   24  }\n```\n\n### 程序输出\n\n```\nSending the value 10.0\
  \ to the setLength method.\n Done.\n```\n\n### 代码列表 6-3 `(LengthDemo.java)`\n\n\
  代码列表 6-3 中的程序必须保存为 `LengthDemo.java`，并存 `Rectangle.java` 文件相同的文件夹或目录中。然后可以使用 JDK\
  \ 使用以下命令来编译程序：\n\n```bash\njavac LengthDemo.java\n```\n\n当编译器读取 `LengthDemo.java`\
  \ 的源代码并看到正在使用名为 `Rectangle` 的类时，它会在当前文件夹或目录中查找 `Rectangle.class` 文件。然而，该文件并不，因为我们还没有编译\
  \ `Rectangle.java`。因此，编译器会搜索 `Rectangle.java` 文件并编译它。这会创建 `Rectangle.class` 文件，使得\
  \ `Rectangle` 类可用。编译器随后完成 `LengthDemo.java` 的编译。生成的 `LengthDemo.class` 文件可以使用以下命令执行：\n\
  \n```\njava LengthDemo\n```\n\n程序的输出显示在代码列表 6-3 的底部。\n\n让我们来看此程序 `main` 方法中的每条语句。首先，程序使用第\
  \ 12 行的以下语句来创建一个 `Rectangle` 对象并将其与变量关联：\n\n```\nRectangle box = new Rectangle();\n\
  ```\n\n将该语句拆分为两部分。语句的第一部分：\n\n```\nRectangle box\n```\n\n声明了一个名为 `box` 的变量。该变量的数据类型是\
  \ `Rectangle`。（因为 `Rectangle` 单词不是原始数据类型的名称，Java 假设它是一个类的名称。）记住，类类型的变量是引用变量，它持有对象的内存地址。当引用变量持有对象的内存地址时，称该变量引用该对象。因此，变量\
  \ `box` 将用于引用一个 `Rectangle` 对象。语句的第二部分如下：\n\n```\n= new Rectangle();\n```\n\n语句的这部分使用了关键字\
  \ `new`，它创建一个对象。语句的部分 `Rectangle box` 声明了一个名为 `box` 的变量。变量的数据类型是 `Rectangle`。（因为\
  \ `Rectangle` 单词不是原始数据类型的名称，Java 假设它是一个类的名称。）记住，类类型的变量是引用变量，它持有对象的内存地址。当引用变量持有对象的内存地址时，称该变量引用该对象。因此，变量\
  \ `box` 将用于引用一个 `Rectangle` 对象。语句的第二部分 `= new Rectangle();` 使用了 `new`，它创建一个对象。`new`\
  \ 关键字后面跟着类名，指定了要创建的类。\n\n由于用户提供的文本末尾出现了一些重复的句子，我将提供**最终的干净版本**。\n\n\n\n\n由于 `length`\
  \ 和 `width` 字段是私有的，我们编写了 `setLength` 和 `setWidth` 方法，允许 `Rectangle` 类外部的代码向这些字段存储值。我们还必须编写方法，允许类外部代码获取存储在这些字段中的值。这就是\
  \ `getLength` 和 `getWidth` 方法要做的工作。`getLength` 方法将返回存储在 `length` 字段中的值，`getWidth`\
  \ 方法将返回存储在 `width` 字段中的值。\n\n以下是 `getLength` 方法的代码：\n\n```\npublic double getLength()\n\
   {\n     return length;\n }\n```\n\n假设 `size` 是一个 `double` 类型变量，`box` 引用一个 `Rectangle`\
  \ 对象，并执行了以下语句：\n\n```\nsize = box.getLength();\n```\n\n该语句将 `getLength` 方法返回的值赋值给\
  \ `size` 变量。在该语句执行后，`size` 变量将包含与 `box` 对象 `length` 字段相同的值。\n\n`getWidth` 方法与 `getLength`\
  \ 类似。该方法的代码如下：\n\n```\npublic double getWidth()\n {\n      return width;\n }\n```\n\
  \n该方法返回存储在 `width` 字段中的值。例如，假设 `size` 是一个 `double` 类型变量，`box` 引用一个 `Rectangle` 对象，并执行了以下语句：\n\
  \n```\nsize = box.getWidth();\n```\n\n该语句将 `getWidth` 方法返回的值赋值给 `size` 变量。在该语句执行后，`size`\
  \ 变量将包含与 `box` 对象 `width` 字段相同的值。\n\n代码列表 6-5 显示了包含目前为止讨论的所有成员的 `Rectangle` 类。`getLength`\
  \ 和 `getWidth` 方法的代码位于第 33 至 53 行。（此文件存储在源代码文件夹 *Chapter 06\\Rectangle Class Phase\
  \ 3.* 中。）\n\n```\n 1  /**\n  2     Rectangle class, phase 3\n  3     Under construction!\n\
  \  4  */\n  5\n  6  public class Rectangle\n  7  {\n  8     private double length;\n\
  \  9     private double width;\n 10\n  11     /**\n  12        The setLength method\
  \ stores a value in the\n  13        length field.\n  14        @param len The value\
  \ to store in length.\n  15     */\n  16\n  17     public void setLength(double\
  \ len)\n  18     {\n  19        length = len;\n  20     }\n  21\n  22     /**\n\
  \  23        The setWidth method stores a value in the\n  24        width field.\n\
  \  25        @param w The value to store in width.\n  26     */\n  27\n  ��28  \
  \   public void setWidth(double w)\n  29     {\n  30        width = w;\n  31   \
  \  }\n  32\n  33     /**\n  34        The getLength method returns a Rectangle\n\
  \  35        object's length.\n  36        @return The value in the length field.\n\
  \  37     */\n  38\n  39     public double getLength()\n  40     {\n  41       \
  \ return length;\n  42     }\n  43\n  44\n  45     /**\n  46        The getWidth\
  \ method returns a Rectangle\n  47        object's width.\n  48        @return The\
  \ value in the width field.\n  49     */\n  50     public double getWidth()\n  51\
