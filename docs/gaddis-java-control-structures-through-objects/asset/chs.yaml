  \n## 5.2 向方法传递参数\n\n## 概念：方法可以写成接受参数的形式。那么在调用方法时，可以将数据传递到方法中。\n\n### 向方法传递参数\n\n\
  传递到方法的值被称为 `arguments`（参数）。你已经熟悉了如何在方法调用中使用参数。例如，请查看以下语句：\n\n```\nSystem.out.println(\"\
  Hello\");\n```\n\n该语句调用了 `System.out.println` 方法并将 `\"Hello\"` 作为参数传递。这里是另一个例子：\n\
  \n```\nnumber = Integer.parseInt(str);\n```\n\n该语句调用了 `Integer.parseInt` 方法并将 `str`\
  \ 的内容作为参数传递。通过使用参数变量，你可以设计接收数据的自定义方法。`parameter variable`（参数变量，有时称为 `parameter`，参数）是一个特殊的变量。\n\
  \n```\npublic static void displayValue(int parameter) {\n  System.out.println(\"\
  The value is \" + parameter);\n}\n```\n\n这里的 `main` 方法调用 `deep` 方法，然后 `deep` 方法调用\
  \ `deeper` 方法。\n\n# 参数与类型兼容性\n\n`Value` 是一个 `int` 类型的变量，`int` 变量的 `int` 类型的参数。`Value`\
  \ 是一个 `int` 类型的参数。\n\n```\n```\nint value = 10;\ndisplayValue(value); // 传递 int\
  \ 变量\n```\n\n当向方法传递参数时，请确保参数的数据类型与参数变量的类型兼容。如果参数的类型排名低于参数变量的类型，Java 将自动执行宽带转换。例如，`displayValue`\
  \ 方法有一个 `int` 参数变量。以下两个代码段均可工作，因为 `short` 和 `byte` 参数被自动转换为 `int`：\n\n```\nshort\
  \ s = 1;\ndisplayValue(s);   // 将 short 转换为 int\nbyte b = 2;\ndisplayValue(b); \
  \  // 将 byte 转换为 int\n```\n\n然而，Java 不会自动将参数转换为排名较低的数据类型。这意味着 `long`、`float` 或 `double`\
  \ 值不能传递给具有 `int` 参数变量的方法。例如，以下代码将导致编译错误：\n\n\n\n\n\n```\ndouble d = 1.0;\ndisplayValue(d);\
  \  // Error! 无法将 double 转换为 int。\n```\n\n### 提示\n\n你可以使用强制转换符手动将值转换为低级数据类型。例如，以下代码将可以通过编译：\n\
  \n```\ndouble d = 1.0;\ndisplayValue((int)d);     // 这将可以工作。\n```\n\n# 参数变量的作用域\n\
  \n回想第 2 章，变量的作用域是程序中可以通过其名称访问该变量的部分。变量仅对变量作用域内部的语句可见。参数变量的作用域是声明该参数的方法。方法之外的任何语句都无法通过其名称访问参数变量。\n\
  \n# 传递多个参数\n\n通常，向方法传递多个参数是有很有用的。这里有一个接受两个参数的方法：\n\n```\npublic static void showSum(double\
  \ num1, double num2)\n{\n   double sum;  // 用于存储和\n   sum = num1 + num2;\n   System.out.println(\"\
  The sum is \" + sum);\n}\n```\n\n注意在方法头部的括号内声明了 `num1` 和 `num2` 两个参数变量。这通常被称为`参数列表`。还要注意用逗号分隔了这些声明。下面是调用该方法的语句示例：\n\
  \n```\nshowSum(5, 10);\n```\n\n该语句将参数 5 和 10 传递到方法中。参数按照它们在方法调用中出现的顺序传递给参数变量。换句话说，第一个参数传递给第一个参数变量，第二个参数传递给第二个参数变量，依此类推。因此，该语句导致\
  \ 5 被传递给 `num1` 参数，而 10 被传递给 `num2` 参数。这在图 5-8 中予以所示。\n\n# 图 5-8 传递到多个参数的多个参数\n\n\
  ![两个参数被传递到两个参数中。](img/05fig08.png)图 5-8 完整备用文本\n\n假设我们反转方法调用中列出参数的顺序，如下所示：\n\n```\n\
  showSum(10, 5);\n```\n\n这将导致 10 被传递给 `num1` 参数而 5 被传递给 `num2` 参数。接下来的代码段显示了另一个示例。这次我们将变量作为参数传递。\n\
  \n```\ndouble value1 = 2.5;\ndouble value2 = 3.5;\nshowSum(value1, value2);\n```\n\
  \n当由于此代码导致 `showSum` 方法执行时，`num1` 参数将包含 2.5，`num2` 参数将包含 3.5。\n\n# 警告！\n\n参数列表中的每个参数变量都必须在其名称之前列出一个数据类型。例如，如果\
  \ `showSum` 方法的参数列表按如下所示的头定义，将会发生编译器错误：\n\n```\npublic static void showSum(double\
  \ num1, num2) // 错误！\n```\n\n必须为 `num1` 和 `num2` 参数变量都列出数据类型，如下：\n\n```\npublic\
  \ static void showSum(double num1, double num2)\n```\n\n查看本章源代码文件夹中的程序 `TwoArgs.java`\
  \ 可以获得一个演示 `showSum` 方法的完整程序。你可以[下载](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/downloads/Source_Code.zip)书的源码。\n\
  \n# 参数按值传递\n\n在 Java 中，所有基本数据类型的参数都是`按值传递的`，这意味着只有参数值的副本会被传递到参数变量中。方法的参数变量与方法调用括号内列出的参数是分离且互不相同的。如果从方法内部更改了参数变量，它对原始参数没有影响。例如，查看代码列表\
  \ 5-6 中的程序。\n\n\n\n\n\n\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n# 代码列表 5-6\
