  \ |\n| | **示例：** |\n```\n String littleName = \"herman\";\n    String bigName =\
  \ littleName.toUpperCase();\n``` |\n| | 在执行此代码后，由 `bigName` 引用的对象将持有字符串 “HERMAN”。\
