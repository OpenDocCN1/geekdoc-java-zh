  \n注意，当索引 1 处的项被删除时（第 27 行），之前存储在索引 2 处的项会向前移动到索引 1。当从 `ArrayList` 中删除一个项时，其后的项将向下移动位置位置以填补空隙。这意味着被删除项之后的每个项的索引都将减\
  \ 1。\n\n注意，如果使用无效的索引调用 `remove` 方法，将会发生错误。\n\n 插入项\n\n如之前所示，`add` 方法在 `ArrayList`\
