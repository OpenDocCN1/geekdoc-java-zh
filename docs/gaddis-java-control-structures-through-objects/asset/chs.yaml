  \n## 3.2 `if-else` 语句\n\n概念：如果 `if-else` 语句的 `boolean` 表达式为 `true`，则执行一组语句；如果其 `boolean`\
  \ 表达式为 `false`，则执行另一组语句。\n\n## 查看 if-else 语句\n\n[`mediaplayer.pearsoncmg.com/assets/_video.true/LsEAD9uN_US_RTfznne0NvOCxDt1LIdU`](https://mediaplayer.pearsoncmg.com/assets/_video.true/LsEAD9uN_US_RTfznne0NvOCxDt1LIdU)\n\
  \n`if-else` 语句是 `if` 语句的扩展。其格式如下：\n\n```\nif (BooleanExpression)\n    statement\
  \ or block\nelse\n    statement or block\n```\n\n与 `if` 语句一样，会对 `boolean` 表达式进行评估。如果表达式为\
  \ `true`，则执行一条语句或语句块。然而，如果表达式为 `false`，则执行另一组独立的语句。代码列表 3-2 使用 `if-else` 语句来处理一个经典的编程问题：除以零。在\
  \ Java 中，当整数除以 0 时，程序会崩溃。当浮点数除以 0 时，程序不会崩溃。相反，会产生特殊值 `Infinity` 作为除法的结果。\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码，并查看贯穿的解释。\n\
