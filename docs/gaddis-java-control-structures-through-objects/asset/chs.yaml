  \ 类模拟玩家。\n\n# 第 9 章 文本处理与更多类\n\n## 话题\n\n1.  `9.1 包装类简介`\n2.  `9.2 使用 Character\
  \ 类进行字符测试和转换`\n3.  `9.3 更多字符串方法`\n4.  `9.4 StringBuilder 类`\n5.  `9.5 字符串标记`\n6.\
  \  `9.6 数值数据类型的包装类`\n7.  `9.7 关注问题解决：TestScoreReader 类`\n8.  `9.8 需要避免的常见错误`\n\n\
  \n\n\n回想第 2 章，基本数据类型之所以被称为“基本”（primitive），是因为它们不是由类创建的。你不是实例化对象，而是从基本数据类型创建变量，而变量没有属性或方法。它们的设计初衷仅是为了在内存中存储单个值。\n\
  \nJava 还为所有基本数据类型提供了包装类（wrapper classes）。`wrapper class` 是一种“包裹”在基本数据类型外层之上的类，它允许你创建对象而不是变量。此外，这些包装类还提供了许多方法，可以对基本值执行有用的操作。例如，你已经使用过包装类的“解析”（parse）方法将字符串转换为基本值。\n\
  \n虽然这些包装类可以用来创建对象而不是变量，但很少程序员以这种方式使用它们。原因之一是包装类是不可变的，这意味着一旦创建了对象，就无法更改该对象的值。另一个原因是，对于简单操作，它们不像变量那样易于使用。例如，要获取对象中存储的值，必须调用一个方法；而变量可以直接用于赋值语句、数学运算、作为参数传递给方法等。\n\
  \n尽管从包装类创建对象通常没有用处，但它们确实提供了非常有用的静态方法。在本章中，我们将检查 Java 的几个包装类。我们首先从查看 `Character`\
  \ 类开始，它是 `char` 数据类型的包装类。\n\n## 检查点 9.1\n## 检查点 9.2\n\n## 9.2 使用 `Character` 类进行字符测试和转换\n\
  \n### 概念\n`Character` 类是 `char` 数据类型的包装类。它提供了许多方法用于测试和转换字符数据。\n\n`Character` 类是\
  \ `java.lang` 包的一部分，因此使用该类时不需要编写 `import` 语句。该类提供了几个静态方法来测试 `char` 变量的值。每个每个方法都接受一个\
  \ `char` 参数并返回一个 `boolean` 值。\n\n### 表格 9-1 用于测试 `char` 值的某些 `Character` 类静态方法\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean isDigit(char ch)` | 如果传递给 `ch` 的参数是 0\
  \ 到 9 的数字，则返回 `true`。否则返回 `false`。 |\n| `boolean isLetter(char ch)` | 如果传递给 `ch`\
  \ 的参数是字母，则返回 `true`。否则返回 `false`。 |\n| `boolean isLetterOrDigit(char ch)` | 如果传递给\
  \ `ch` 的字符包含数字（0 到 9）或字母，则返回 `true`。否则返回 `false`。 |\n| `boolean isLowerCase(char\
  \ ch)` | 如果传递给 `ch` 的参数是小写字母，则返回 `true`。否则返回 `false`。 |\n| `boolean isUpperCase(char\
  \ ch)` | 如果传递给 `ch` 的参数是大写写字母，则返回 `true`。否则返回 `false`。 |\n| `boolean isSpaceChar(char\
  \ ch)` | 如果传递给 `ch` 的参数是空格字符，则返回 `true`。否则返回 `false`。 |\n| `boolean isWhiteSpace(char\
  \ ch)` | 如果传递给 `ch` 的参数是空白字符（空格、制表符或换行符），则返回 `true`。否则返回 `false`。 |\n\n`Code Listing\
  \ 9-1` 中的程序演示了其中的许多方法。\n\n#### 代码列表 9-1 `(CharacterTest.java)`\n\n```java\npublic\
  \ class CharacterTest {\n    public static void main(String[] args) {\n        //\
  \ 示例交互逻辑\n    }\n\n    public static boolean isValid(String customerNumber) {\n\
  \        boolean goodSoFar = true;\n        int i = 0;\n        if (customerNumber.length()\
  \ != 7) {\n            goodSoFar = false;\n        }\n        while (goodSoFar &&\
  \ i < 3) {\n            if (!Character.isLetter(customerNumber.charAt(i)))\n   \
  \             goodSoFar = false;\n            i++;\n        }\n        return goodSoFar;\n\
  \    }\n}\n```\n\n\n\n\n回想第 2 章，`String` 类的 `charAt` 方法返回返回字符串中特定位置的字符（位置编号从 0 开始计数）。这段代码使用\
  \ `Character.isLetter` 方法来测试 `custNumber` 字符串中位置 0、1 和 2 处的字符。如果这些字符中的任何一个不是字母，则将变量\
  \ `goodSoFar` 设置为 `false`\n\n并且循环终止。接下来，该方法使用第 62 到 67 行的以下循环来验证最后四个字符：\n\n```\n\
  while (goodSoFar && i < 7)\n {\n     if (!Character.isDigit(custNumber.charAt(i)))\n\
          goodSoFar = false;\n     i++;\n }\n```\n\n这段代码使用 `Character.isDigit` 方法来测试\
  \ `custNumber` 字符串中位置 3、4、5 和 6 处的字符。如果这些字符中的任何一个不是数字，则将变量 `goodSoFar` 设置为 `false`\
  \ 并且循环终止。最后，该方法返回 `goodSoFar` 方法的值。\n\n# 字符大小转换\n\n`Character` 类还提供了表 9-2 中列出的静态方法，用于转换字符的大小。每个方法都接受一个\
  \ `char` 参数并返回一个 `char` 值。\n\n# 表 9-2 用于大小转换的某些 `Character` 类方法\n\n| 方法 | 说明 |\n\
  | --- | --- |\n| `char toLowerCase(char ch)` | 返回传递给 `ch` 的参数的小写对应字符。 |\n| `char\
  \ toUpperCase(char ch)` | 返回传递给 `ch` 的参数的大写对应字符。 |\n\n如果 `toLowerCase` 方法的参数是一个大写字符，则该方法返回其小写对应字符。例如，以下语句将在屏幕上显示字符\
  \ `a`：\n\n```\nSystem.out.println(Character.toLowerCase('A'));\n```\n\n如果参数已经是小写的，则\
  \ `toLowerCase` 方法将原样返回它。以下语句也会导致显示小写字符 `a`：\n\n```\nSystem.out.println(Character.toLowerCase('a'));\n\
  ```\n\n如果 `toUpperCase` 方法的参数是一个小写字符，则该方法返回其大写对应字符。例如，以下语句将在屏幕上显示字符 `A`：\n\n```\n\
  System.out.println(Character.toUpperCase('a'));\n```\n\n如果参数已经是大写的，则 `toUpperCase`\
  \ 方法将原样返回它。\n\n任何传递给 `toLowerCase` 或 `toUpperCase` 的非字母参数都将原样返回。以下每个语句都会在不更改的情况下显示方法参数：\n\
  \n```\nSystem.out.println(Character.toLowerCase('*'));\n System.out.println(Character.toLowerCase('$'));\n\
   System.out.println(Character.toUpperCase('&'));\n System.out.println(Character.toUpperCase('%'));\n\
  ```\n\n代码列表 9-3 中的程序在循环中演示了 `toUpperCase` 方法，要求用户输入 Y 或 N。只要用户对问题的回答是 Y 或 y，程序就会重复。\n\
