  \n## 4.6 运行总和与哨兵\n\n**概念**：运行总和（running total）是随循环每次迭代累加的和。用于保持运行总和的变量称为累加器（accumulator）。哨兵（sentinel）是一个信号列表结束的值。\n\
  \n许多编程任务要求你计算一组数字的总和。例如，假设你正在编写一个计算公司一周总销售额的程序。程序将读取每天的销售额作为输入并计算这些数字的总和。\n\n计算一组数字总数的程序通常使用两个元素：\n\
  \n* 一个读取序列中每个数字的循环。\n* 一个在读取时累加数字总和的变量。\n\n用于累加数字总和的变量被称为 `accumulator`。人们通常说循环保持了\
  \ `running total`，因为它在读取序列中的每个数字时都会累加总和。 [图 4-11 显示了计算运行总和循环的通用逻辑。\n\n### 图 4-11\
  \ 计算运行总和的逻辑\n\n![循环的通用逻辑使用累加器计算运行总和。](img/04fig11.png)图 4-11 完整替代文本\n\n当循环结束时，`accumulator`\
  \ 将包含循环读取的数字的总和。注意流程图中的第一步是将 `accumulator` 变量设置为 `0`。这是一个关键步骤。循环每次读取一个数字时，它都会将其添加到\
  \ `accumulator` 中。如果 `accumulator` 从 0 以外的任何值开始，在循环结束时它将不会包含正确的总和。\n\n让我们来看计算运行总和的程序。代码列表\
  \ 4-10 通过获取每日销售数据作为输入并在收集时计算其运行总和，来计算公司某一段时间内的总销售额。图 4-12 显示了与程序交互的一个示例。\n\n# 图\
  \ 4-12 与 `TotalSales` 程序的交互（甲骨文公司法律顾问）\n\n\n\n\n\n![与 Total Sales 程序的交互是顺序的。](img/04fig12.png)图\
  \ 4-12 完整备用文本\n\n在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n### 代码列表 4-10 `(TotalSales.java)`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-10/10.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-10/10.html)\n\
  \n让我们仔细观察这个程序。在第 17 行和第 18 行，用户被要求输入拥有销售数据的天数。该数字从输入对话框中读取并赋值给 `days` 变量。然后，在第 22\
  \ 行，`totalSales` 变量被赋值为 0.0。在通用编程术语中，`totalSales` 变量被称为累加器（accumulator）。*累加器*是一个初始化为起始值（通常为零）的变量，通过将数字加到它上来累积总和。正如你所看到的，在向其添加值之前将累加器设置为零是非常关重要的。\n\
  \n接下来，执行第 25 行到第 31 行的 `for` 循环。在循环的每次迭代中，用户输入特定天的销售额，并将其赋值给 `sales` 变量。这在第 27 行到第\
  \ 29 行完成。然后，在第 30 行，将 `sales` 的内容加到 `totalSales` 变量的现有值。（注意，第 30 行并不是将 `sales` 赋值给\
  \ `totalSales`，而是将 `sales` 加到 `totalSales`。换句话说，这一行通过 `sales` 中的金额增加了 `totalSales`。）\n\
  \n由于 `totalSales` 最初被赋值为 0.0，因此在循环第一次迭代后，`totalSales` 将设置为与 `sales` 相同的值。在随后的每次迭代中，`totalSales`\
  \ 都会根据 `sales` 的值而增加。循环结束后，`totalSales` 将包含所有录入的每日销售数据的总和。现在应该清楚为什么我们在循环执行之前给 `totalSales`\
  \ 赋值为 0.0 了。如果 `totalSales` 从任何其他值开始，总和将是不正确的。\n\n### 使用哨兵值\n\n代码列表 4-10 中的程序需要用户提前知道拥有销售数据的天数。有时，用户有一份很长的输入值列表，并且不知道精确数量。在其他情况下，用户可能从几个列表中输入值，要求计算每个列表中的每个项目是不现实的。\n\
  \n在这些情况下可以使用的一种技术是要求用户在列表末尾输入一个哨兵值（sentinel value）。*哨兵值*是一个特殊的值，不会被误认为是列表的成员，并标志着没有更多值需要输入了。当用户输入哨兵值时，循环终止。\n\
  \n代码列表 4-11 中的程序展示了一个示例。它计算一支足球队在一系列比赛中获得的总分。它允许用户输入系列比赛的分，然后输入 -1 来标志列表结束。\n\n\
  在下方的动画中，点击“上一个”或“下一个”按钮逐步执行代码并查看全程的解释。\n\n### 代码列表 4-11 `(SoccerPoints.java)`\n\n\
  [`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-11/11.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr4-11/11.html)\n\
  \n选择 -1 作为哨兵值是因为球队是不可能得负数的。注意，该程序执行了预读操作（priming read）来获取第一个值。这使得如果用户输入的第一个值是 -1，循环就可以立即终止。还要注意，哨兵值不包含在运行总量中。\n\
