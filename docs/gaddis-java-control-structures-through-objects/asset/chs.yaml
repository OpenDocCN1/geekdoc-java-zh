  \n## `if-else-if` 语句与嵌套决策结构的比较\n\n你并不非使用 `if-else-if` 语句，因为它的逻辑可以通过嵌套的 `if-else`\
  \ 语句来实现。然而，在调试代码时，长系列的嵌套 `if-else` 语句有两个明显的缺点：\n\n*   代码可能会变得复杂且难以理解。\n*   因为缩进在嵌套语句中非常重要，长系列的嵌套\
  \ `if-else` 语句可能会太长，无法在不进行水平滚动的情况下显示在计算机屏幕上。此外，长语句在打印到纸上时往往会发生“换行”，使得代码更难阅读。\n\n\
  `if-else-if` 语句的逻辑通常比长系列嵌套 `if-else` 语句更容易理解。而且，由于 `if-else-if` 语句中的所有子句都是对齐的，语句中的行长度往往较短。\n\
