  \n# 13.8 菜单 (Menus)\n\n概念：JavaFX 提供了用于创建下拉菜单系统的类。菜单可以包含菜单项、复框菜单项、单选按钮菜单项和其他菜单。\n\
  \n在你目前所学习的 GUI 应用程序中，用户通过点击如 `Button` 等控件来启动操作。当一个应用程序有多个操作供用户选择时，菜单系统比按钮更常用。菜单系统是组织在一个或多个下拉菜单中的命令的集合。在学习如何构建菜单系统之前，你必须了解典型菜单系统中包含的基本项目。请查看图\
  \ 13-29 中的示例菜单系统。\n\n## 图 13-29 示例菜单系统（Oracle 法务顾问）\n\n![菜单系统的示例图示。](img/13fig29.png)图\
  \ 13-29 完整替代文本\n\n图中的菜单系统由以下项目组成：\n\n*   **菜单栏 (Menu bar)**。窗口顶部是菜单栏。菜单栏列出了一个或多个菜单的名称。图\
  \ 13-29 中的菜单栏显示了两个菜单名称：`File`（文件）和 `Edit`（编辑）。\n*   **菜单 (Menu)**。菜单是菜单项的下拉列表。可以通过点击菜单栏上的名称来激活菜单。在图\
  \ 13-29 中，`Edit` 已被激活。\n*   **菜单项 (Menu Item)**。用户可以选择菜单项。当菜单项被选中时，通常会执行某种操作。\n\
  *   **复框菜单项 (Check menu item)**。出现一个可以被选中或取消选择的复框菜单项。当被选中时，项目旁边会出现一个勾标记。当取消选中时，勾标记则不显示。复框菜单项通常用于开启或关闭某个选项。用户每次选择复框菜单项时都会切换其状态。\n\
  *   **单选菜单项 (Radio menu item)**。单选菜单项可以被选中或取消选择。单选菜单项看起来与复框菜单项相似。当被选中时，项目旁边会出现一个勾标记。当取消选中时，勾标记则不显示。当一组单选菜单项与\
  \ `ToggleGroup` 对象分组时，它们只能同时其中一个被选中。当用户选择一个单选菜单项时，之前选中的那个将被取消选中。\n*   **子菜单 (Submenu)**。菜单中的菜单被称为子菜单。菜单上的某些命令实际上是子菜单。你可以通过其右侧有一个小箭头来判断一个命令是子菜单。激活子菜单名称会显示该子菜单。例如，在图\
  \ 13-29 中，点击 `Sort` 命令会显示子菜单。\n*   **分隔线 (Separator bar)**。分隔线是用于分隔菜单上项目组的水平线。分隔线仅作为视觉辅助，无法被选择。\n\
  \n菜单系统使用以下类构建：\n\n*   **菜单栏 (MenuBar)**。使用此类创建菜单栏。`MenuBar` 对象可以包含 `Menu` 对象。\n\
  *   **菜单 (Menu)**。使用此类创建从菜单栏下拉的菜单。`Menu` 对象可以包含 `MenuItem`、`CheckMenuItem` 和 `RadioMenuItem`\
  \ 对象，以及其他 `Menu` 对象。子菜单是位于另一个 `Menu` 对象内部。\n*   **菜单项 (MenuItem)**。使用此类创建普通菜单项。`MenuItem`\
  \ 对象在用户选择时会产生操作事件。\n*   **复框菜单项 (CheckMenuItem)**。使用此类创建复框项。当项目被选中时，`isSelected()`\
  \ 方法返回 `true`，否则返回 `false`。`CheckMenuItem` 对象在用户选择时会产生操作事件。\n*   **单选菜单项 (RadioMenuItem)**。使用此类创建单选按钮项。`RadioMenuItem`\
  \ 对象可以组合到 `ToggleGroup` 中，以便同一时间只能有一个被选中。当项目被选中时，`isSelected()` 方法返回 `true`，否则返回\
  \ `false`。`RadioMenuItem` 对象在用户选择时会产生操作事件。\n\n所有这些类都位于 `javafx.scene.control` 包中。菜单系统是一个包含一个或多个\
  \ `Menu` 对象的 `MenuBar`。每个 `Menu` 对象都可以包含 `MenuItem`、`RadioMenuItem` 和 `CheckMenuItem`\
  \ 对象，以及其他 `Menu` 对象。构建菜单系统的过程需要以下步骤（但不一定按此顺序）：\n\n*   创建一个 `MenuBar` 对象。这将是菜单系统的“根”。\n\
  *   创建必要的 `Menu` 对象，并将其添加到 `MenuBar` 对象中。\n*   为每个菜单项注册事件处理器。\n*   将 `MenuBar` 对象添加到场景图中。\n\
  \n\n\n\n\n```java\nimport javafx.application.Application;\nimport javafx.stage.Stage;\n\
  import javafx.scene.Scene;\nimport javafx.scene.control.MenuBar;\nimport javafx.scene.control.Menu;\n\
  import javafx.scene.control.MenuItem;\nimport javafx.scene.layout.BorderPane;\n\n\
  public class SimpleMenu extends Application\n{\n    public static void main(String[]\
  \ args)\n    {\n        // 启动应用程序。\n        launch(args);\n    }\n\n    @Override\n\
  \    public void start(Stage primaryStage)\n    {\n        // 场景尺寸的常量\n        final\
  \ double WIDTH = 300.0, HEIGHT = 200.0;\n\n        // 创建菜单栏。\n        MenuBar menuBar\
  \ = new MenuBar();\n\n        // 创建文件（File）菜单。\n        Menu fileMenu = new Menu(\"\
  File\");\n        MenuItem exitItem = new MenuItem(\"Exit\");\n        fileMenu.getItems().add(exitItem);\n\
  \n        // 为退出项注册事件处理程序。\n        exitItem.setOnAction(event ->\n        {\n \
  \          primaryStage.close();\n        });\n\n        // 将文件菜单添加到菜单栏。\n     \
  \   menuBar.getMenus().add(fileMenu);\n\n        // 将菜单栏添加到 BorderPane 中。\n    \
  \    BorderPane borderPane = new BorderPane();\n        borderPane.setTop(menuBar);\n\
  \n        // 创建场景并显示它。\n        Scene scene = new Scene(borderPane, WIDTH, HEIGHT);\n\
  \        primaryStage.setScene(scene);\n        primaryStage.show();\n    }\n}\n\
  ```\n\n# 代码列表 13-26 `(SimpleMenu.java)`\n\n![显示了 SimpleMenu.java 应用程序的菜单系统。选择了标记为\
  \ File 的 Menu 对象，并显示了一个标记为 Exit 的单个菜单项。](img/13fig30.png)\n\n# 图 13-30 SimpleMenu.java\
