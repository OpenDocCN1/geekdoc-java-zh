  \ `String` 和 `System`，这些类对于 Java 编程语言是基础性的。`java.lang` 包会被所有 Java 程序自动导入。\n\n# 附录\
  \ H：处理记录和随机访问文件\n\n## 将数据结构化为字段和固定记录\n\n写入文件的数据通常结构化为字段（fields）和记录（records）。在文件术语中，`field`\
  \ 是单独的数据单元，例如人的姓名或电话号码。`record` 是属于单个项目的字段集合。例如，一条记录可能包含一个特定人的姓名、年龄、地址和电话号码。\n\n\
  很多时候，你可以将对象的内容保存为文件中的一条记录。你通过将对象的每个字段一个接一个写入文件来实现这一点。当你保存了对象的所有字段后，一条完整的记录就已写入。当保存了多个对象的字段后，文件中就向文件中写入了多条记录。\n\
  \n随机访问文件对于存储和检索记录特别有用。然而，为了计算特定项目的位置，必须知道随机访问文件中存储的项目的大小。存储在随机访问文件中的记录必须具有相同的大小并且必须具有\
  \ `fixed length`（固定长度）。这意味着记录的大小不能改变。\n\n在 Java 中，基本数据类型的大小有完善的文档，并保证在所有系统上都是相同的。如果一个对象的字段都是基本数据类型，你可以轻松地计算记录的大小：它将是所有字段大小之和。然而，如果一个对象有一个字段是\
  \ `String`，就会出现问题，因为其内容的长度可能会变化。你可以通过确保 `String` 字段始终写入特定数量的字符来解决这个问题。本附录中的示例展示了实现此目标的一种方法。\n\
  \n首先，我们将介绍代码列表 H-1 所示的 `InventoryItem` 类。该类的对象可以代表公司库存中的某个物品。该类有两个字段：`description`（持有项目描述的\
  \ `String`）和 `units`（持有库存数量的 `int`）。该类还包含必要的访问方法（accessor methods）、变器方法（mutator\
  \ methods）以及两个构造函数。\n\n# 代码列表 H-1 `(InventoryItem.java)`\n\n```java\n1 /**\n 2 \
  \ InventoryItem class\n 3 */\n 4 \n 5 public class InventoryItem\n 6 {\n 7   private\
  \ String description;  // Item description\n 8   private int units;           //\
  \ Units on hand\n 9 \n 10    /**\n 11       此构造函数将空字符串\n 12       赋值给 description\
  \ 并将 0 赋值给 units。\n 13    */\n 14\n 15    public InventoryItem()\n 16    {\n 17\
  \       description = \"\";\n 18       units = 0;\n 19    }\n 20\n 21    /**\n 22\
  \       此构造函数将值\n 23       赋值给 description 和 units 字段。\n 24       @param d 描述。\n\
   25       @param u 库存数量。\n 26    */\n 27\n 28    public InventoryItem(String d,\
  \ int u)\n 29    {\n 30       description = d;\n 31       units = u;\n 32    }\n\
   33\n 34\n 35    /**\n 36       setDescription 方法将一个字符串\n 37       赋值给 description\
  \ 字段。\n 38       @param d 要赋值给 description 的字符串。\n 39    */\n 40\n 41    public\
  \ void setDescription(String d)\n 42    {\n 43       description = d;\n 44    }\n\
   45\n 46    /**\n 47       setUnits 方法将一个值\n 48       赋值给 units 字段。\n 49       @param\
  \ u 要赋值给 units 的值。\n 50\n 51    public void setUnits(int u)\n 52    {\n 53     \
  \  units = u;\n 54    }\n 55\n 56\n 57    /**\n 58       getDescription 方法返回项目的\n\
   59       描述。\n 60       @return description 字段。\n 61    */\n 62\n 63    public\
  \ String getDescription()\n 64    {\n 65       return description;\n 66    }\n 67\n\
   68\n 69    /**\n 70       getUnits 方法返回库存\n 71       数量。\n 72       @return units\
  \ 字段。\n 73    */\n 74    public int getUnits()\n 75    {\n 76       return units;\n\
   77    }\n 78 }\n```\n\n代码列表 H-2 所示的 `InventoryItemFile` 类旨在将 `InventoryItem` 对象作为记录在随机访问文件中读取和写入。该类还可以将文件指针移动到特定的记录。为了保持代码简单，没有对任何异常进行捕获。\n\
  \n\n\n\n\n```java\nimport java.io.*;\n\n/**\n  此类管理一个包含库存物品（InventoryItem）\n记录的随机访问文件。\n\
  */\npublic class InventoryItemFile\n{\n    private final int RECORD_SIZE = 44;\n\
  \    private RandomAccessFile inventoryFile;\n\n    /**\n       构造函数打开一个随机访问文件\n\
  \       用于读取和写入。\n       @param filename 文件的名称。\n       @exception FileNotFoundException\
  \ 当文件\n                   未找到时。\n  */\n    public InventoryItemFile(String filename)\n\
  \                          throws FileNotFoundException\n    {\n       // 打开文件进行读写。\n\
  \       inventoryFile =\n            new RandomAccessFile(filename, \"rw\");\n \
  \   }\n\n    /**\n       writeInventoryItem 方法将 InventoryItem 对象的内容\n       写入文件在当前文件指针所在的位置。\n\
  \       @param item 要写入的 InventoryItem 对象。\n       @exception IOException 当发生文件错误时。\n\
  \    */\n    public void writeInventoryItem(InventoryItem item)\n              \
  \                     throws IOException\n    {\n       // 获取项目的描述。\n       String\
  \ str = item.getDescription();\n\n       // 写入描述。\n       if (str.length() > 20)\n\
  \       {\n          // 如果字符串中超过 20 个字符，\n          // 则只写入前 20 个。\n          for\
  \ (int i = 0; i < 20; i++)\n             inventoryFile.writeChar(str.charAt(i));\n\
  \       }\n       else\n       {\n          // 将描述写入文件。\n          inventoryFile.writeChars(str);\n\
  \          // 写入足够的空格以填充\n          // 到 20 个字符。\n          for (int i = 0; i <\
  \ (20 - str.length()); i++)\n             inventoryFile.writeChar(' ');\n      \
  \ }\n\n       // 将单位写入文件。\n       inventoryFile.writeInt(item.getUnits());\n   \
  \ }\n\n    /**\n       readInventoryItem 方法读取并返回\n       当前文件指针位置的记录。\n       @return\
  \ InventoryItem 对象的引用。\n       @exception IOException 当发生文件错误时。\n    */\n    public\
  \ InventoryItem readInventoryItem()\n                                throws IOException\n\
  \    {\n       char[] charArray = new char[20];\n\n       // 从文件中逐个字符读取描述，\n   \
  \    // 到 char 数组中。\n       for (int i = 0; i < 20; i++)\n          charArray[i]\
  \ = inventoryFile.readChar();\n\n       // 将 char 数组存储为 String。\n       String desc\
  \ = new String(charArray);\n\n       // 修剪字符串末尾的空格。\n       desc.trim();\n\n   \
  \    // 从文件中读取单位。\n       int u = inventoryFile.readInt();\n\n       // 创建 InventoryItem\
  \ 对象并用\n       // 这些值初始化它。\n       InventoryItem item =\n              new InventoryItem(desc,\
  \ u);\n\n       // 返回该对象。\n       return item;\n    }\n\n    /**\n       getByteNum\
  \ 方法返回记录的\n       起始字节数。\n       @param recordNum 目标记录的\n                      \
  \  记录编号。\n    */\n    private long getByteNum(long recordNum)\n    {\n       return\
  \ RECORD_SIZE * recordNum;\n    }\n\n    /**\n       moveFilePointer 方法将文件\n   \
  \    指针移动到指定的记录。\n       @param recordNum 要移动到的\n                         记录编号。\n\
  \       @exception IOException 当发生文件错误时。\n    */\n    public void moveFilePointer(long\
  \ recordNum)\n                             throws IOException\n    {\n       inventoryFile.seek(getByteNum(recordNum));\n\
  \    }\n\n    /**\n       getNumberOfRecords 方法返回文件中\n       存储的记录总数。\n       @return\
  \ 文件中的记录数。\n       @exception IOException 当发生文件错误时。\n    */\n    public long getNumberOfRecords()\n\
  \    {\n       return inventoryFile.length() / RECORD_SIZE;\n    }\n\n    /**\n\
  \       close 方法关闭文件。\n       @exception IOException 当发生文件错误时。\n    */\n    public\
  \ void close() throws IOException\n    {\n       inventoryFile.close();\n    }\n\
  }\n```\n\n\n\n\n`getNumberOfRecords` 方法出现在第 133 行到 136 行。该方法返回文件中的记录数。它通过将文件的长度除以记录的大小来计算记录数。文件长度由\
  \ `RandomAccessFile` 类的 `length` 方法返回。\n\n该类中的最后一个方法是 `close` 方法，用于关闭文件。代码代码列表 H-3\
  \ 中的程序展示了该类的简单演示。该程序要求用户输入五个项目的数据，这些数据存储在一个包含 `InventoryItem` 对象的数组中。然后程序将数组元素的内容保存到文件中。\n\
  \n# 代码列表 H-3 `(CreateInventoryFile.java)`\n\n```\n1 import java.io.*;\n 2 import\
  \ java.util.Scanner;\n 3 \n 4 /**\n 5   此程序使用 InventoryFile 类来创建一个\n 6   包含来自 5\
  \ 个 InventoryItem 对象数据的文件。\n 7 */\n 8 \n 9 public class CreateInventoryFile\n 10\
  \ {\n 11    public static void main(String[] args) throws IOException\n 12    {\n\
   13       final int NUM_ITEMS = 5;   // 项目数量\n 14       String description;    \
  \    // 项目描述\n 15       int units;                 // 库存数量\n 16\n 17       // 创建一个用于键盘输入的的\
  \ Scanner 对象。\n 18       Scanner keyboard = new Scanner(System.in);\n 19\n 20  \
  \     // 创建一个存放 InventoryItem 对象的数组。\n 21       InventoryItem[] items = new InventoryItem[NUM_ITEMS];\n\
   22\n 23       // 获取 InventoryItem 对象的数据。\n 24       System.out.println(\"Enter\
  \ data for \" + NUM_ITEMS +\n 25                          \" inventory items.\"\
  );\n 26\n 27       for (int i = 0; i < items.length; i++)\n 28       {\n 29    \
  \      // 获取描述。\n 30          System.out.print(\"Enter an item description: \");\n\
   31          description = keyboard.nextLine();\n 32\n 33          // 获取库存数量。\n\
   34          System.out.print(\"Enter the number of units: \");\n 35          units\
  \ = keyboard.nextInt();\n 36\n 37          // 消耗剩余的换行符。\n 38          keyboard.nextLine();\n\
   39\n 40          // 在数组中创建一个 InventoryItem 对象。\n 41          items[i] = new InventoryItem(description,\
  \ units);\n 42       }\n 43\n 44       // 创建一个 InventoryFile 对象。\n 45       InventoryItemFile\
  \ file =\n 46                     new InventoryItemFile(\"Inventory.dat\");\n 47\n\
   48       // 将数组的内容写入文件。\n 49       for (int i = 0; i < items.length; i++)\n 50\
  \       {\n 51          file.writeInventoryItem(items[i]);\n 52       }\n 53\n 54\
  \       // 关闭文件。\n 55       file.close();\n 56\n 57       System.out.println(\"\
  The data was written to the \" +\n 58                          \"Inventory.dat file.\"\
  );\n 59    }\n 60 }\n```\n\n带有示例输入的程序输出（部分已加粗显示）\n\n```\nEnter data for 5 inventory\
  \ items.\n Enter an item description: Wrench [Enter] \n Enter the number of units:\
  \ 20 [Enter] \n Enter an item description: Hammer [Enter] \n Enter the number of\
  \ units: 15 [Enter] \n Enter an item description: Pliers [Enter] \n Enter the number\
  \ of units: 12 [Enter] \n Enter an item description: Screwdriver [Enter] \n Enter\
  \ the number of units: 25 [Enter] \n Enter an item description: Ratchet [Enter]\
  \ \n Enter the number of units: 10 [Enter] \n The data was written to the Inventory.dat\
  \ file.\n```\n\n代码列表 H-4 中的程序演示了如何从文件中随机读取记录。\n\n# 代码列表 H-4 `(ReadInventoryFile.java)`\n\
  \n```\n1 import java.io.*;\n 2 import java.util.Scanner;\n 3 \n 4 /**\n 5   此程序显示指定的\n\
   6   Inventory.dat 文件。\n 7 */\n 8 \n 9 public class ReadInventoryFile\n 10 {\n 11\
  \    public static void main(String[] args) throws IOException\n 12    {\n 13  \
  \     int recordNumber;          // 记录\n 14       String again;              //\
  \ Y 或 N\n 15       InventoryItem item;        // 从文件中\n 16       读取对象\n 17     \
  \  //一个 Scanner 对象。\n 18       Scanner keyboard = new Scanner(System.in);\n 19\n\
   20       // 打开文件。\n 21       InventoryItemFile file =\n 22                    \
  \ new InventoryItemFile(\"Inventory.dat\");\n 23\n 24       // 报告文件的记录数。\n 25  \
  \     System.out.println(\"The Inventory.dat file has \" +\n 26                file.getNumberOfRecords()\
  \ + \" records.\");\n 27       // 获取用户的\n 28       记录编号并显示记录。\n 29       do\n 30\
  \       {\n 31          // 获取记录编号。\n 32          System.out.print(\"Enter the number\
  \ of the record \"\n 33                           to see: \");\n 34          recordNumber\
