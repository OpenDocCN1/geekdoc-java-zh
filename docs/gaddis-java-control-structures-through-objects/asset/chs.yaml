  \n# 检查点 16.29\n[components/metrodig/16-inline-self-v1.0/27)\n\n## 16.10 关系数据\n\n\
  概念：在关系数据库中，一个表的列可以与另一个表建立关联。\n\n在 `section` 中，我们添加了 `Customer` 表，这使得我们可以通过 `Coffee`\
  \ 表获取产品信息。\n\n假设我们想让数据库更有用，存储有关欠款订单的信息。为了这样做，我们需要为数据库添加一个额外的表。这里是 `UnpaidOrder`\
  \ 表：\n\n```\n CustomerNumber     CHAR(10)      外键\n          ProdNum           \
  \ CHAR(10)      外键\n          OrderDate          CHAR(10)\n          Quantity  \
  \         DOUBLE\n          Cost               DOUBLE\n```\n\n第一列 `CustomerNumber`\
  \ 标识了订单的客户。然而，`paidOrder` 表并不包含其他客户数据，它只存储客户编号。在设计数据库时，避免数据重复是非常重要的。因为客户数据已经存储在\
  \ `Customer` 表中，我们只需要在 `Order` 表中存储客户编号，通过 `Customer` 表来查询客户的剩余数据。\n\n在 `UnpaidOrder`\
  \ 表中，`CustomerNumber` 列是一个**外键**。*外键*是指一个表中引用另一个表中主键的列。回想一下 `CustomerNumber` 是 `Customer`\
  \ 表的主键。当我们向 `UnpaidOrder` 表添加行时，存储的 `CustomerNumber` 值必须匹配 `Customer` 表中 `CustomerNumber`\
  \ 列的值。这在 `UnpaidOrder` 表的行与 `Customer` 表的行之间建立了关系。\n\n下一列 `ProdNum` 也是一个外键，因为它标识了\
  \ `Coffee` 表中的产品。再次，没有必要在 `UnpaidOrder` 表中存储所有的产品数据。我们只需要存储产品编号，然后就可以在 `Coffee`\
  \ 表中查询产品数据。\n\n`UnpaidOrder` 表的下一列是 `OrderDate`。它将存储订单日期。`Quantity` 列存储客户订购的咖啡磅数。`Cost`\
  \ 列存储物品的总费用。我们将使用以下 SQL 语句来创建 `Order` 表：\n\n\n\n\n\n注意，此语句引入了一个新的限定符 `REFERENCES`，它被同时用于\
  \ `CustomerNumber` 和 `ProdNum` 列。以下是它在 `CustomerNumber` 列上的用方法：\n\n```\nREFERENCES\
  \ Customer(CustomerNumber)\n```\n\n这表示该列引用了 `Customer` 表中的 `CustomerNumber` 列。由于有了这个限定符，当你向\
  \ `UnpaidOrder` 表中插入行时，DBMS 会执行一次检查。只有当 `CustomerNumber` 列包含来自 `Customer` 表中 `CustomerNumber`\
  \ 列的有效值时，它才允许你插入该行。这确保了两张表之间的*引用完整性*（referential integrity）。\n\n`REFERENCES` 限定符也用于\
  \ `ProdNum` 列：\n\n```\nREFERENCES Coffee(ProdNum)\n```\n\n这表示该列引用了 `Coffee` 表中的\
  \ `ProdNum` 列。当你向 `Order` 表中插入行时，其 `ProdNum` 列必须包含来自 `Coffee` 表中 `ProdNum` 列的有效值。\n\
  \n系统设计人员通常使用`实体关系图`（entity relationship diagrams）来展示数据库表之间的关系。图 16-17 展示了 `CoffeeDB`\
  \ 数据库的实体关系图。在图中，主键用 `(PK)` 表示。连接表与表之间的线显示了表之间的关系。在此图中，有两种类型的关系：\n\n*   `一对多关系`意味着对于表\
  \ `A` 中的每行，表 `B` 中可以有许多行可以引用它。\n*   `多对一关系` 意味着表 `A` 中的许多行可以引用表 `B` 中的某一行。\n\n#\
  \ 图 16-17 实体关系图\n\n![一个 Coffee D B 数据库的实体关系图。](img/16fig17.png)图 16-17 完整备用文本\n\n\
  注意，每条线的末端显示的是 1 或无限符号 `[∞]`。你可以将无限符号解释为“多”，将数字 1 解释为“一”。看连接 `Customer` 表和 `UnpaidOrder`\
  \ 表的线。1 位于靠近 `Customer` 表的末端，无限符号位于靠近 `UnpaidOrder` 表的末端。这意味着 `Customer` 表中的某行可以被\
  \ `UnpaidOrder` 表中的许多行引用。这是合逻辑的，因为一个客户可以下许多订单。（事实上，这正是管理层希望看到的！）\n\n如果我们从反方向看这种关系，会发现\
  \ `UnpaidOrder` 表中的许多行可以引用 `Customer` 表中的一行。以下是图中显示的所有关系的总结：\n\n*   `Customer` 表与\
  \ `UnpaidOrder` 表之间存在一对多关系。`Customer` 表中的某行可以被 `UnpaidOrder` 表中的许多行引用。\n*   `UnpaidOrder`\
  \ 表与 `Customer` 表之间存在多对一关系。`UnpaidOrder` 表中的许多行可以引用 `Customer` 表中的某一行。\n*   `Coffee`\
  \ 表与 `UnpaidOrder` 表之间存在一对多关系。`Coffee` 表中的某行可以被 `UnpaidOrder` 表中的许多行引用。\n*   `UnpaidOrder`\
  \ 表与 `Coffee` 表之间存在多对一关系。`UnpaidOrder` 表中的许多行可以引用 `Coffee` 表中的某一行。\n\n# 从多个表连接数据\n\
  \n当相关数据存储在多个表中时（如在 `CoffeeDB` 数据库中），通常需要在 `SELECT` 语句中从不同的表中提取数据。例如，假设我们想查看所有未付订单的信息。具体来说，对于每笔未付订单，我们想查看客户编号、客户名称、订单日期、咖啡描述和成本。这涉及来自\
  \ `Customer`、`UnpaidOrder` 和 `Coffee` 表的列。由于这些表中的某些列具有相同的列名，我们必须在 `SELECT` 语句中使用限定列名（qualified\
  \ column names）。`限定列名`的格式如下：\n\n```\nTableName.ColumnName\n```\n\n例如，`Customer.CustomerNumber`\
  \ 指定了 `Customer` 表中的 `CustomerNumber` 列，而 `UnpaidOrder.CustomerNumber` 指定了 `UnpaidOrder`\
  \ 表中的 `CustomerNumber` 列。请查看以下查询：\n\n```\n SELECT\n      Customer.CustomerNumber,\n\
  \      Customer.Name,\n      UnpaidOrder.OrderDate,\n      Coffee.Description,\n\
  \      UnpaidOrder.Cost\n   FROM\n      Customer, UnpaidOrder, Coffee\n   WHERE\n\
  \      UnpaidOrder.CustomerNumber = Customer.CustomerNumber AND\n      UnpaidOrder.ProdNum\
  \ = Coffee.ProdNum\n```\n\n查询的第一部分指定了我们想要的列：\n\n```\n SELECT\n      Customer.CustomerNumber,\n\
  \      Customer.Name,\n      UnpaidOrder.OrderDate,\n      Coffee.Description,\n\
  \      UnpaidOrder.Cost\n```\n\n查询的第二部分使用 `FROM` 子句，指定了我们想要的表：\n\n```\nFROM\n  \
  \    Customer, UnpaidOrder, Coffee\n```\n\n查询的第三部分使用 `WHERE` 子句，指定了搜索条件：\n\n```\n\
  \ WHERE\n      UnpaidOrder.CustomerNumber = Customer.CustomerNumber AND\n      UnpaidOrder.ProdNum\
  \ = Coffee.ProdNum\n```\n\n搜索条件告诉 `DBMS` 如何链接表。回顾我们之前的讨论，`UnpaidOrder.CustomerNumber`\
  \ 引用 `Customer.CustomerNumber`，而 `UnpaidOrder.ProdNum` 引用 `Coffee.ProdNum`。\n\n\
  # 警告\n\n从多个表连接数据时，务必使用 `WHERE` 子句来指定搜索条件。如果不这样做，将导致大量无关的数据。\n\n# 订单输入系统\n\n现在，我们已经在数据库中设置了必要的表，并将查看一个允许用户点咖啡的应用程序。该应用程序由两个类构建：一个用于管理数据库，另一个用于显示界面。我们首先查看的类是\
