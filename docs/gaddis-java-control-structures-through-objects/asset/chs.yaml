  \ 6-11 中的程序使用 `Rectangle` 对象的地址初始化了变量 `box`。引用变量也可以在不初始化的情况下声明，如下语句所示：\n\n```\n\
  Rectangle box;\n```\n\n注意，此语句并没有创建 `Rectangle` 对象。它只是声明了一个名为 `box` 的变量，可用于引用 `Rectangle`\
  \ 对象。由于 `box` 变量没有引用任何内容，如果你在初始化之前尝试使用它，将会导致编译错误。\n\n\n\n\n在本章较早之前（第 6.1 节），我们讨论了创建原始变量和创建对象之间的区别。你通过简单的声明语句创建原始变量，而通过\
  \ `new` 操作符创建对象。然而，有一个类可以在不使用 `new` 操作符的情况下实例化：即 `String` 类。\n\n由于字符串操作非常常见，Java\
  \ 允许你像创建原始变量一样创建 `String` 对象。以下是一个示例：\n\n```\nString name = \"Joe Mahoney\";\n```\n\
  \n该语句在内存中创建了一个 `String` 对象，并用字符串字面量 `\"Joe Mahoney\"` 初始化。该对象由变量 `name` 引用。如果你愿意，可以使用\
  \ `new` 操作符创建 `String` 对象，并通过向构造函数传递字符串字面量来初始化该对象，如下所示：\n\n```\nString name = new\
  \ String(\"Joe Mahoney\");\n```\n\n### 注意\n\n`String` 对象是 Java 中的一个特殊情况。由于它们被频繁使用，Java\
  \ 为 `String` 对象提供了许多快捷操作，这些操作在其他类型的对象上是不可能的。除了不使用 `new` 操作符创建 `String` 对象外，你还可以使用\
  \ `=` 运算符为 `String` 对象赋值，使用 `+` 运算符拼接字符串等。第 9 章 讨论了 `String` 类的几种方法。\n\n# 焦点聚焦：创建\
