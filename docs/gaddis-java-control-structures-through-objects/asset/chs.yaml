  \n`GridPane` 布局容器以列和行组成的网格形式排列其内容。结果是 `GridPane` 被划分为许多单元格，类似于电子表格。如图 12-21 所示，列和行通过索引识别，索引从\
  \ 0 开始。你使用这些列和行索引来引用 `GridPane` 内部特定的单元格。\n\n![一个表示 Grid Pane 对象的表格包含 4 列（标记为 Column\
  \ 0、Column 1、Column 2 和 3）以及 3 行（标记为 Row 0、Row 1 和 Row 2）。](img/12fig21.png)\n\n\
  # 图 12-21 列和行索引\n\n如果你想创建一个 `GridPane`，请从 `javafx.scene.layout` 包中导入 `GridPane`\
  \ 类。然后你使用其无参数构造函数创建一个 `GridPane` 类的实例，如下所示：\n\n```java\nGridPane gridpane = new\
  \ GridPane();\n```\n\n一旦你创建了 `GridPane` 对象，就可以调用对象的 `add` 方法在网格的特定位置添加控件。以下是 `add`\
  \ 方法的通用格式：\n\n```java\ngridPaneObject.add(control, column, row);\n```\n\n在通用格式中，`gridPaneObject`\
  \ 是 `GridPane` 的引用，`control` 是你添加到 `GridPane` 中的控件，`column` 是列索引，`row` 是行索引。\n\n\
  代码列表 12-8 中的程序演示了如何使用 `GridPane`。该程序的输出如图 12-22 所示：\n\n```java\nimport javafx.application.Application;\n\
  import javafx.stage.Stage;\nimport javafx.scene.Scene;\nimport javafx.scene.layout.GridPane;\n\
  import javafx.geometry.Insets;\nimport javafx.scene.control.Label;\n\n/**\n  GridPane\
  \ Demo\n */\npublic class GridPaneDemo extends Application\n{\n   public static\
  \ void main(String[] args)\n   {\n      // 启动应用程序。\n      launch(args);\n   }\n\n\
  \   @Override\n   public void start(Stage primaryStage)\n   {\n      // 创建一些 Label\
  \ 控件。\n      Label label1 = new Label(\"This is label1\");\n      Label label2 =\
  \ new Label(\"This is label2\");\n      Label label3 = new Label(\"This is label3\"\
  );\n      Label label4 = new Label(\"This is label4\");\n\n      // 创建一个 GridPane。\n\
  \      GridPane gridpane = new GridPane();\n\n      // 将 Label 添加到 GridPane 中。\n\
  \      gridpane.add(label1, 0, 0); // 0 列， 0 行\n      gridpane.add(label2, 1, 0);\
  \ // 1 列， 0 行\n      gridpane.add(label3, 0, 1); // 0 列， 1 行\n      gridpane.add(label4,\
  \ 1, 1); // 1 列， 1 行\n\n      // 创建以 GridPane 为根节点的 Scene。\n      // Scene 宽 200\
  \ 像素，高 100 像素。\n      Scene scene = new Scene(gridpane, 200, 100);\n\n      // 将\
  \ Scene 添加到 Stage。\n      primaryStage.setScene(scene);\n\n      // 显示窗口。\n    \
  \  primaryStage.show();\n   }\n}\n```\n\n# 代码列表 12-8 `(GridPaneDemo.java)`\n\n![GridPane\
