  \n## 综合运用\n\n让我们来看一个 `if` 语句的示例：\n\n```\nif (sales > 50000)\n     bonus = 500.0;\n\
  ```\n\n该语句使用 `>` 运算符确定 `sales` 是否大于 50,000。如果表达式 `sales > 50000` 为 `true`，则变量 `bonus`\
  \ 被赋值为 500.0。如果表达式为 `false`，则跳过赋值语句。代码列表 3-1 显示另一个示例：用户输入三个分数，程序计算它们的平均分。如果平均分大于\
  \ 95，程序将祝用户获得高分。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步查看代码并查看贯穿其中的解释。\n\n### 代码列表 3-1 `AverageScore.java`\n\
  \n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-1/1.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr3-1/1.html)\n\
  \n第 38 行和 39 行的代码会导致打印庆祝消息：\n\n```\nif (average > 95)\n    System.out.println(\"\
  That's a great score!\");\n```\n\n图 3-4 显示了此 `if` 语句的逻辑。\n\n![if 语句 Average 大于 95\
  \ 的逻辑被演示。如果答案为 True，显示器读取“That's a great score!”（带引号）。如果答案为 false，则没有任何语句。](img/03fig04.png)\n\
  \n\n\n\n\n表 3-3 显示了 `if` 语句的其它示例及其结果。\n\n### 表 3-3 `if` 语句的其它示例\n\n| 语句 | 结果 |\n\
  | --- | --- |\n| | |\n```\nif (hours > 40)\n   overTime = true;\n```\n | 如果 `hours`\
  \ 大于 40，则给 `boolean` 变量 `overTime` 赋值 `true`。 |\n| | |\n```\nif (value < 32)\n \
  \  System.out.println(\"Invalid number\");\n``` | | 如果 `value` 小于 32，则显示消息 `\"Invalid\
  \ number\"`。 |\n\n### 编程风格与 `if` 语句\n\n尽管 `if` 语句通常跨一行，但它实际上是一个很长的语句。例如，以下 `if`\
  \ 语句除了编写风格外，是完全相同的：\n\n```\nif (value > 32)\n    System.out.println(\"Invalid number.\"\
  );\n if (value > 32) System.out.println(\"Invalid number.\");\n```\n\n在这两个示例中，编译器都将\
  \ `if` 语句和条件执行的语句视为一个单元，并在结尾正确地放置了分号。缩进和间距是为了程序的人类阅读者准备的，而不是为了编译器。以下是你在编写 `if` 语句时应该采用的两个重要风格规则：\n\
  \n* 条件执行的语句应该出现在 `if` 语句的下一行。\n* 条件执行的语句应该比 `if` 语句缩进一级。\n\n在大多数编辑器中，你每按一次 tab 键，就会缩进一级。通过对条件执行的语句进行缩进，你实际上是让它在视觉上脱颖而出。这样你就能一眼看出\
  \ `if` 语句执行了程序的哪个部分。这是编写 `if` 语句的标准方法，也是你应该使用的方法。\n\n### 注意分号\n\n你不需要在 `if` 语句的\
  \ `if (expression)` 部分之后放置分号，如图 3-5 所示。这是因为如果没有其条件执行的语句，`if` 语句是不完整的。\n\n![终止 if\
  \ 代码语句的正确方法是使用分号。第 1 行读取为：if 左括号 表达式右括号。没有分号结束代码。第 2 行读取为：语句分号，分号结束了代码。](img/03fig05.png)\n\
  \n### 图 3-5 不要用分号提前终止 `if` 语句\n\n如果你用分号提前终止了 `if` 语句，编译器不会显示错误信息，但会假设你是在那里放置了一个*空语句*（null\
  \ statement）。空语句是一个不执行任何操作的空语句，它将成为条件执行的语句。你本打算条件执行的语句将与 `if` 语句断开，并且将始终执行。\n\n\
  例如，看以下代码：\n\n```\nint x = 0, y = 10;\n\n // 下面的 if 语句被提前\n // 用分号终止了。\n if (x >\
  \ y);\n    System.out.println(x + \" is greater than \" + y);\n```\n\n此代码中的 `if`\
  \ 语句被分号提前终止了。由于 `println` 语句没有连接到 `if` 语句，它将始终执行。\n\n# 检查点 3.15\n\n../components/metrodigi/ch03-inline_self_quiz_v1.0.0-09/index.html\n\
