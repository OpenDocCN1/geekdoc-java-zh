  \n# 8.4 `toString` 方法\n\n概念：大多数类都可以从一个名为 `toString` 的方法中受益，该方法在某些情况下会被隐调用。通常，它返回一个表示对象状态的字符串。\n\
  \n我们经常需要显示对象状态的消息。对象的状态就是存储在对象中的数据。例如，回想 `BankAccount` 类有一个字段：`balance`。在任何时刻，`BankAccount`\
  \ 对象的 `balance` 字段都持有一个值。`balance` 字段的值代表该时刻的状态。以下可能是显示 `BankAccount` 对象的代码示例：\n\
  \n```java\nBankAccount account = new BankAccount(1500.0);\nSystem.out.println(\"\
  The account balance is $\" +\n                   account.getBalance());\n```\n\n\
  第一条语句创建一个 `BankAccount` 对象，将值 1500.0 传递给构造函数。回想 `BankAccount` 构造函数会将此值存储在 `balance`\
  \ 字段中。在此语句执行后，`account` 变量将引用 `BankAccount` 对象。在第二条语句中，`System.out.println` 方法显示对象的\
  \ `balance` 字段的值。此语句的输出看起来如下：\n\n```\nThe account balance is $1500.0\n```\n\n创建一个表示对象状态的字符串是一个常见的任务，以至于许多程序员为类配备配备返回此类字符串的方法。在\
  \ Java 中，将此方法命名为 `toString` 是标准做法。让我们来看具有 `toString` 方法的类示例。图 8-8 显示了 `Stock` 类的\
  \ UML 图。\n\n\n\n\n\n![Stock 类的 UML 图分为三个矩形区域。](img/08fig08.png)图 8-8 完整替代文本\n\n\
  该类有两个字段：`symbol` 和 `sharePrice`。`symbol` 字段存储公司股票的交易代码。这是一段短的字符序列，用于在证券交易所识别该股票。例如，XYZ\
  \ 公司的股票交易代码可能是 XYZ。`sharePrice` 字段存储该股票的当前每股价格。表 8–1 描述了该类的方法。\n\n# 表 8-1 `Stock`\
