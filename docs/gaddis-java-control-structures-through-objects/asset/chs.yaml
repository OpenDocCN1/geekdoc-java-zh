  \n## 7.7 对象数组\n\n概念：你可以创建由你编写的类实例组成的对象数组。\n\n\n\n\n```java\n   /**\n      此程序按顺序在一个\
  \ \n      int 数组中搜索指定的值。\n   */\n\n   public class SearchArray\n   {\n      public\
  \ static void main(String[] args)\n      {\n         int[] tests = { 87, 75, 98,\
  \ 100, 82 };\n         int results;\n\n         // 在数组中查找值 100。\n         results\
  \ = sequentialSearch(tests, 100);\n\n         // 确定是否找到了 100 并\n         // 显示适当的消息。\n\
  \         if (results == −1)\n         {\n             System.out.println(\"你没有在任何测试中\"\
  \ +\n                         \"获得 100 分。\");\n         }\n         else\n     \
  \    {\n             System.out.println(\"你在测试 \" + (results + 1) +\n          \
  \               \" 中获得了 100 分。\");\n         }\n      }\n\n      /**\n        sequentialSearch\
  \ 方法在数组中查找\n        一个值。\n        @param array 要搜索的数组。\n        @param value 要查找的值。\n\
  \        @return 如果在数组中找到，则返回值的下标，\n                否则返回 −1。\n      */\n\n     \
  \ public static int sequentialSearch(int[] array,\n                            \
  \             int value)\n      {\n          int index;        // 循环控制变量\n     \
  \     int element;      // 找到值的元素索引\n          boolean found;    // 搜索结果的标志\n\n\
  \          // 元素 0 是搜索的起点。\n          index = 0;\n\n          // 存储默认值 element 和\
  \ found。\n          element = −1;\n          found = false;\n\n          // 搜索数组。\n\
  \          while (!found && index < array.length)\n          {\n             if\
  \ (array[index] == value)\n             {\n                found = true;\n     \
  \           element = index;\n             }\n             index++;\n          }\n\
  \n          return element;\n      }\n   }\n```\n\n### 程序输出\n\n```\n你在测试 4 中获得了\
  \ 100 分\n```\n\n### 注意事项\n\n当在数组中未找到搜索值时，返回 `-1` 的原因是 `-1` 不是一个有效的下标。\n\n请参阅[`PinTester`\
