  \n*助记符*（mnemonic）是键盘上的一个键，你通过组合 `Alt` 键来快速访问菜单项。助记符有时被称为*快捷键*（shortcut keys）、*访问键*（access\
  \ keys）或*热键*（hot keys）。你在实例化菜单项时可以为菜单项分配助记符。以下代码段显示了一个示例：\n\n```\nMenu fileMenu\
  \ = new Menu(\"_File\");\nMenuItem exitItem = new MenuItem(\"E_xit\");\n```\n\n\
