  \n[/content]\n\n---\n\n### 第二部分：基元数据类型\n\n[content]\n\n## 2.4 基元类型 (Primitive Types)\n\
  \n概念：有许多类型。变量根据其进行分类。在数值范围内，例如，有整数和小数。变量的类型决定了其占用的。\n\n表 2-5 显示了所有的。\n\n### 表 2-5\
  \ 数值数据\n\n| 数据类型 | 大小 | 范围 |\n| --- | --- | --- |\n| `byte` | 1 字节 | −128 到 +127\
  \ |\n| `short` | 2 字节 | −32,768 到 +32,767 |\n| `int` | 4 字节 | −2,147,483,648 到 +2,147,483,647\
  \ |\n| `long` | 8 字节 | −9,223,372,036,854,775,808 到 +9,223,372,036,854,775,807 |\n\
  | `float` | 4 字节 | ±3.4 × 10^(−38) 到 ±3.4 × 10³⁸，保留 7 位数字 |\n| `double` | 8 字节 |\
  \ ±1.7 × 10^(−308) 到 ±1.7 × 10³⁰⁸，保留 15 位数字 |\n\n表 2-5 左列列出的单词是你在变量声明使用的关键字。变量声明采用以下通用格式：\n\
  \n```\nDataType VariableName;\n```\n\n`DataType` 是数据类型的名称，`VariableName` 是变量的名称。这里是一些变量声明的示例：\n\
  \n```\nbyte inches;\nint speed;\nshort month;\nfloat salesCommission;\ndouble distance;\n\
  ```\n\n表 2-5 中的大小列显示了每个数据类型的变量所使用的字节数。例如，`int` 变量使用 4 字节，而 `double` 变量使用 8 字节。范围列显示了每个数据类型变量可以存储的数字范围。\n\
  \n\n\n\n\n这些数据类型被称为“原始”类型，因为你不能使用它们来创建对象。回想第 1 章中对面向对象编程的讨论，对象具有属性和方法。对于原始数据类型，你只能创建变量，而变量只能用于存储单个值。此类变量不具有属性或方法。\n\
  \n# 整数数据类型\n\n表 2-5 中列出的前四个数据类型 `byte`、`int`、`short` 和 `long` 都是整数数据类型。整数变量可以存储整数，如\
  \ `7`、`125`、`−14` 和 `6928`。代码列表 2-10 中的程序展示了使用了几个不同整数数据类型的变量。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步通过代码，并查看各处的解释。\n\
  \n### 代码列表 2-10 `(IntegerVariables.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-10/10.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-10/10.html)\n\
  \n在大多数程序中，你需要的任何给定的数据类型可能不止一个。如果一个程序使用了三个整数 `length`、`width` 和 `area`，可以分别声明它们，如下所示：\n\
  \n```\nint length;\nint width;\nint area;\n```\n\n然而，将三个变量声明结合起来更简单：\n\n```\nint\
  \ length, width, area;\n```\n\n你只需用逗号分隔变量名，就可以声明多个相同类型的变量。\n\n# 整数字面量\n\n当你在程序代码中编写整数字面量时，Java\
  \ 假设它是 `int` 数据类型。例如，在代码列表 2-10 中，字面量 `−20`、`105`、`120` 和 `189000` 都被处理为 `int` 值。然而，你可以通过在字面量后面加上字母\
  \ `L` 来强制将其处理为 `long`。例如，值 `57L` 将被视为一个 `long`。虽然你可以使用大写或小写的 `L`，但建议使用大写的 `L`，因为小写的\
  \ `l` 看起来太像数字 `1`。\n\n# 注意！\n\n你不能在数值字面量中嵌入逗号。例如，以下语句会导致错误：\n\n```\nnumber = 1,257,649;\
  \    // 错误！\n```\n\n该语句必须写成：\n\n```\nnumber = 1257649;      // 正确。\n```\n\n### 浮点数据类型\n\
  \n整数对于许多工作来说是不够的。如果你正在编写处理美元金额或精确测量值的程序，你需要一种允许小数值的数据类型。在编程术语中，这些被称为浮点数。诸如 `1.7`\
  \ 和 `−45.316` 等值都是浮点数。\n\n在 Java 中有两种数据类型可以表示浮点数。它们是 `float` 和 `double`。`float`\
  \ 数据类型被认为是单精度数据类型。它可以存储具有 7 位精度的浮点数。`double` 数据类型被认为是双精度数据类型。它可以存储具有 15 位精度的浮点数。然而，`double`\
  \ 数据类型使用的内存是 `float` 数据类型的两倍。`float` 变量占用 4 字节内存，而 `double` 变量使用 8 字节。\n\n代码列表 2-11\
  \ 显示了一个使用三个 `double` 变量的程序。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步通过代码，并查看各处的解释。\n\n### 代码列表\
  \ 2-11 `(Sale.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-11/11.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-11/11.html)\n\
  \n# 浮点字面量\n\n当你在程序代码中编写浮点字面量时，Java 假设它是 `double` 数据类型。例如，在代码列表 2-11 中，字面量 `29.75`、`1.76`\
  \ 和 `31.5` 都被处理为 `double` 值。正因如此，将浮点字面量赋值给 `float` 变量时会出现问题：\n\n```java\nfloat number\
  \ = 23.5; // 错误\n```\n\n然而，通过在字面量后面加上字母 `F`，你可以强制将 `double` 字面量处理为 `float`。如下代码所示：\n\
  \n```java\nfloat number = 23.5F; // 这是正确的。\n```\n\n# 注意！\n\n在处理数值字面量时，你不能嵌入货币符号或逗号。例如，以下语句会导致错误：\n\
  \n```\nnumber = $1,257,649; // 错误！\n```\n\n该语句必须写成：\n\n```\nnumber = 1257649; //\
  \ 正确。\n```\n\n### 科学计数法\n\n浮点字面量可以用科学计数法表示。考虑数字 `47281.97`。表 2-6 显示了其他科学计数法的数字：\n\
  \n| 十进制表示 | 科学计数法 | E 计数法 |\n| --- | --- | --- |\n| 47.91 | 4.791 × 10¹ | 4.791E1\
  \ |\n| 0.0072 | 7.2 × 10⁻⁴ | 7.2E-4 |\n| 2900000 | 2.9 × 10⁶ | 2.9E6 |\n\nJava 使用\
  \ E 表示这些值。在科学计数法中，`47281.97` 是 `4.728197×10⁴`。E 可以是大写或小写。\n\n### 代码列表 2-12 `(SunFacts.java)`\n\
  \n以下代码展示了使用科学计数法表示浮点字面量。代码列表 2-12 使用了浮点字面量。\n\n### boolean 数据类型\n\n`boolean` 数据类型允许你创建可能持有两个值之一：`true`\
  \ 或 `false` 的变量。代码列表 2-13 演示了 `boolean` 变量的声明和赋值。\n\n在下面的动画中，点击“上一个”或“下一个”按钮逐步通过代码，并查看各处的解释。\n\
  \n### 代码列表 2-13 `(TrueFalse.java)`\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-13/13.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-13/13.html)\n\
  \n`boolean` 类型的变量用于评估结果为真或假的条件。然而，我们还没有使用它们直到第 3 章，所以现在只需记住以下几点：\n\n*   `boolean`\
  \ 变量只能持有 `true` 或 `false` 值。\n*   `boolean` 变量的内容不能复制到 `boolean` 以外的任何类型。\n\n###\
  \ char 数据类型\n\n`char` 数据类型用于存储字符。`char` 数据类型的变量每次存储一个字符。字符字面量封装在*单引号*中。代码列表 2-14\
  \ 使用了 `char` 变量。字符字面量 'A' 和 'B' 被赋值给该变量。\n\n\n\n\n\n[`media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-14/14.html`](https://media.pearsoncmg.com/ph/esm/0media_ecs/gaddis-java/pr2-14/14.html)\n\
  \n重要的一点是你不要混淆字符字面量与字符串字面量（后者是用双引号括起来的字符串字面量不能赋值给 `char` 变量。\n\n### Unicode\n\n字符在内部是用数字表示的。每个可打印字符以及许多不可打印字符都被分配了一个唯一的数字。Java\
  \ 使用 Unicode，这是一组用作表示字符代码的数字。每个 Unicode 数字需要两个字节的内存，因此 `char` 变量占用两个字节。当字符被存储在内存中时，实际存储的是数值代码。当指令计算机在屏幕上打印该值时，它会显示与数值代码对应的字符。\n\
  \n附录 A 显示了 Unicode 字符集的一部分。注意数字 65 是 A 的代码，66 是 B 的代码，以此此类推。代码列表 2-15 表明，当你处理字符时，你实际上是在处理数字。\n\
