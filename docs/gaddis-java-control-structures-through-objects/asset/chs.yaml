  \n# 16.9 结果集元数据\n\n概念：结果集元数据描述结果集的内容。元数据可以用于确定查询时返回了哪些列。\n\n*元数据*（metadata）指的是描述数据的数据。`ResultSet`\
  \ 对象拥有描述 `ResultSet` 中数据的元数据。你可以使用结果集元数据确定关于结果集的若干信息，包括它包含的列数、列名、类型等等。如果你正在编写一个提交查询的应用程序，并且无法提前返回哪些列，结果集元数据将非常有用。\n\
  \n一旦你有一个 `ResultSet` 对象，就可以调用它的 `getMetaData` 方法来获取一个 `ResultSetMetaData` 对象的引用。假设\
  \ `resultSet` 引用一个 `ResultSet` 对象，以下是一个示例：\n\n```\nResultSetMetaData meta = resultSet.getMetaData();\n\
  ```\n\n`ResultSetMetaData` 是 `java.sql` 包中的一个接口。它指定了许多方法，其中一些方法在表 16-6 中描述。\n\n\
  # 表 16-6 一些 `ResultSetMetaData` 方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `getCount()`\
  \ | 返回结果集的列数。 |\n| `getColumnName(col)` | 返回由整数 `col` 指定的列名。第一列为 1。 |\n| `getColumnTypeName(col)`\
  \ | 返回由整数 `col` 指定的列的数据类型名称。第一列为 1。返回的数据类型是数据库特定的 SQL 数据类型。 |\n| `getColumnDisplaySize(col)`\
  \ | 返回由整数 `col` 指定的列的显示宽度（以字符为单位）。第一列为 1。 |\n| `getTableName(col)` | 返回与由整数 `col`\
  \ 指定的列关联的表名。第一列为 1。 |\n\n代码列表 16-12 中的程序演示了如何使用元数据。它要求用户为 `CoffeeDB` 数据库输入一个 `SELECT`\
  \ 语句，然后显示结果集信息以及结果集的内容。\n\n# 代码列表 16-12 `(MetaDataDemo.java)`\n\n\n\n\n\n```java\n\
  import java.sql.*;\nimport java.util.Scanner;\n\n/**\n    此程序演示了结果集元数据。\n */\npublic\
  \ class MetaDataDemo\n{\n    public static void main(String[] args) throws Exception\n\
  \    {\n       // 为 URL 创建命名常量。\n       // 注意：此值特定于 Java DB 或 Apache Derby。\n  \
  \     final String DB_URL = \"jdbc:derby:CoffeeDB\";\n\n       try\n       {\n \
  \         // 创建一个用于键盘输入的 Scanner 对象。\n          Scanner keyboard = new Scanner(System.in);\n\
  \n          // 从用户处获取 SELECT 语句。\n          System.out.println(\"Enter a SELECT\
  \ statement for \" +\n                             \"the CoffeeDB database:\");\n\
  \          String sql = keyboard.nextLine();\n\n          // 创建与数据库的连接。\n      \
  \    Connection conn =\n                 DriverManager.getConnection(DB_URL);\n\n\
  \          // 创建 Statement 对象。\n          Statement stmt = conn.createStatement();\n\
  \n          // 执行查询。\n          ResultSet resultSet = stmt.executeQuery(sql);\n\n\
  \          // 获取结果集元数据。\n          ResultSetMetaData meta = resultSet.getMetaData();\n\
  \n          // 显示返回的列数。\n          System.out.println(\"The result set has \" +\n\
  \                             meta.getColumnCount() +\n                        \
  \     \" column(s).\");\n\n          // 显示列名和列类型。\n          for (int i = 1; i <=\
  \ meta.getColumnCount(); i++)\n          {\n             System.out.println(meta.getColumnName(i)\
  \ + \", \" +\n                                meta.getColumnTypeName(i));\n    \
  \      }\n\n          // 显示行内容。\n          System.out.println(\"\\nHere are the\
  \ result set rows:\");\n          while (resultSet.next())\n          {\n      \
  \       // 显示一行。\n             for (int i = 1; i <= meta.getColumnCount(); i++)\n\
  \             {\n                System.out.print(resultSet.getString(i));\n   \
  \          }\n             System.out.println();\n          }\n\n          // 关闭语句和连接。\n\
  \          stmt.close();\n          conn.close();\n       }\n       catch(Exception\
  \ ex)\n       {\n          System.out.println(\"ERROR: \" + ex.getMessage());\n\
  \       }\n    }\n}\n```\n\n### 示例输入以**粗体**所示的程序输出\n\n```\nEnter a SELECT statement\
