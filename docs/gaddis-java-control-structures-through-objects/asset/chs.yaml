  \n## 16.11 高级主题\n\n### 事务\n\n有时，应用程序必须执行多次数据库更新来完成单一任务。例如，假设你在银行有一个储蓄账户和一笔车贷。每个月，车贷会自动从你的储蓄账户中扣除。为了完成这项操作，你的储蓄账户余额必须减少车贷金额，同时车贷的余额也必须减少。\n\
  \n这种需要多次数据库更新的操作被称为 `transaction`（事务）。为了使一个事务完成，事务涉及的所有步骤都必须执行。如果事务中的任何一个步骤执行失败，则事务中的所有步骤都不应被执行。例如，想象银行系统已经开始处理你的车贷还。还款金额已从你的储蓄账户余额中扣除，但在车贷余额减少之前发生了某种系统故障。如果你发现车贷金额已经被扣除了，你会感到非常沮丧。\n\
  \n### 存储过程\n\n许多商业数据库系统允许你创建 SQL 语句并将其存储在 DBMS 内部。这些 SQL 语句被称为 `stored procedures`（存储过程），可以使用使用\
  \ DBMS 的其他应用程序来执行。如果你编写了一个在各种应用程序中频繁使用的 SQL 语句，将其作为存储过程存储在 DBMS 中可能会很有帮助。那么，当你需要执行该\
  \ SQL 语句时，可以从任何应用程序中调用该存储过程。由于存储过程已于 DBMS 中，它们的执行速度通常比从 DBMS 外部提交的 SQL 语句更快。\n\n\
  \n\n\n\n本书中我们不会详细介绍存储过程细节，但如果你想学习更多知识，我们将为你指引正确的方向。每个 DBMS 都有其用于在 SQL 中创建存储过程的语法，因此你必须查阅你的\
  \ DBMS 文档来确定格式。一旦你已经在 SQL 中正确地编写了存储过程，只需使用 `Statement` 类的 `execute` 方法将其提交给 DBMS\
  \ 即可。要执行存储过程，你必须创建一个 `CallableStatement` 对象。`CallableStatement` 是 `java.sql` 包中的一个接口。要创建\
  \ `CallableStatement` 对象，你需要调用 `Connection` 类的 `prepareCall` 语句。\n\n# 检查点 16.32\n\
  ../components/metrodigi/ch16-inline_self_quiz_v1.0.0-29/index.html\n\n# 检查点 16.33\n\
  ../components/metrodigi/ch16-inline_self_quiz_v1.0.0-30/index.html\n\n# 16.12 需要避免的常见错误\n\
  \n-   **在 SQL 语句中使用 `==` 运算符代替 `=` 运算符。** SQL 中的相等运算符是一个 `=` 符号，而不是两个。\n-   **使用双引号括字符串而不是单引号。**\
  \ SQL 中的字符串字面量是用单引号括起来，而不是双引号。\n-   **在 SQL 语句中使用 `&&` 和 `||`。** SQL 中的逻辑与和逻辑或运算符是单词\
  \ `AND` 和 `OR`，而不是 `&&` 和 `||` 符号。\n-   **在 `UPDATE` 语句中未使用正确的 `WHERE` 子句。** 使用\
  \ `UPDATE` 语句时，请注意不要漏掉 `WHERE` 子句和条件表达式。你可能会更改表中每一行的内容！\n-   **在 `DELETE` 语句中未使用正确的\
  \ `WHERE` 子句。** 使用 `DELETE` 语句时，请注意不要漏掉 `WHERE` 子句和条件表达式。你可能会删除表中的每一行！\n-   **在连接数据时未使用正确的\
  \ `WHERE` 子句。** 在从多个表连接数据时，务必使用 `WHERE` 子句来指定链接适当列的搜索准则。这样做将导致大量无关的数据。\n\n# 检查点\
