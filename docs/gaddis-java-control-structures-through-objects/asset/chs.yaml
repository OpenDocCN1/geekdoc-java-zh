  \n### Java 的历史\n\n1991 年，Sun Microsystems（一家现由 Oracle 有的公司）成立了一个团队，负责预测近期可能出现的重要技术趋势。该团队被称为“绿色小组”（Green\
  \ Team），他们得出计算机将与消费电器融合的结论。他们的第一个项目是开发一种名为 `7（读作 star seven）`的便携设备，可以用于控制各种家庭娱乐设备。为了让该设备工作，它必须使用一种能够被其控制的所有设备处理的编程语言。这产生了一个问题，因为不同品牌的消费设备使用不同的处理器，每个处理器都有其自己的机器语言。\n\
  \n由于不存在这样的通用语言，团队的首席工程师 James Gosling 创建了它。用这种语言（最初名为 `Oak`）编写的程序并没有翻译成特定处理器的机器语言，而是被翻译成被称为\
  \ `byte code`（字节码）的中间语言。然后另一个程序会将 `byte code` 翻译成由特定消费设备中的处理器执行的机器语言。\n\n遗憾的是，绿色小组开发的技术领先于时代。当时没有找到客户，主要是因为计算机控制的消费电器行业刚刚起步。但他们并没有放弃心血去转向其他项目，而是看到了另一个机会：互联网。互联网对于像\
  \ `Oak` 这样的通用编程语言来说是一个完美的环境。它由连接在单个网络中的许多不同计算机平台组成。\n\n为了证明其语言（后更名为 `Java`）的有效性，团队用它开发了一个\
  \ Web 浏览器。该浏览器名为 `HotJava`，能够下载并运行名为 `applets` 的小型 Java 程序。这让浏览器有了显示动画和与用户交互的能力。HotJava\
  \ 在 1995 年的 SunWorld 大会上向令观众惊叹的人群进行了演示。随后宣布 Netscape 将将 Java 技术整合到它的 Navigator 浏览器中。其他互联网公司迅速跟进，增加了\
  \ Java 语言的接受度和影响力。今天，Java 非常流行，不仅用于开发 Web 应用的 `applets`，还用于开发 Web 应用、移动应用和桌面应用程序。\n\
  \n### 检查 1.20\n\n../components/metrodigi/ch01-inline_self_quiz_v1.0.0-16/index.html\n\
