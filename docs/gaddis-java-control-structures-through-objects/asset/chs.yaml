  names[1] = \"Susan\";\nnames[2] = \"Steven\";\nnames[3] = \"Jean\";\n```\n\n执行这些语句后，`names`\
  \ 数组的每个元素将引用一个 `String` 对象。\n\n## 从数组元素调用 String 方法\n\n回想第 2 章可知，`String` 对象有几个方法。例如，`toUpperCase`\
